  - '[PAGE 7]


    # OpenSource


    08 News | 12 Opinion | 94 Letters


    # KERNEL


    # Linux 4.0 gets live, no-reboot patching


    Torvalds jumps from 3.x, keeps his socks on


    Linux kernel 4.0 has been officially released, and while the sudden jump from
    the 3.x branch may come as a surprise, there’s a welcome new development along
    for the ride: the ability to patch a live, running kernel without rebooting.


    In November 2013, founder and maintainer Linus Torvalds suggested that a jump
    to a new full-version release was in the works, joking that “we’re getting to
    release numbers where I have to take off my socks to count that high again.” To
    “keep the numbers small and easy to remember,” Torvalds suggested that Linux 3.20
    would release as Linux 4.0 – and now he has officially made good on that plan.


    Linux 4.0 is now the mainline release and comes with a major feature with an interesting
    development history: the ability to patch the kernel on a live system without
    rebooting. This feature was originally available to Linux users back in 2008 as
    part of a project dubbed kSplice. This software used the stop_machine() functionality
    to halt the system, patch the kernel and restart things again without rebooting.


    kSplice proved useful, but was acquired by Oracle in 2011 and now exists as a
    proprietary service with no plans for further open source releases. With customers
    clamouring for similar


    functionality, both SUSE and Red Hat began working on their own implementations
    – kGraft and kPatch – and released early builds near- simultaneously last year,
    with each designed to work specifically on their own distributions.


    “It pretty quickly became obvious to the interested parties that it’s absolutely
    impractical in this case to have several isolated solutions for one task to co-exist
    in the kernel,” explained kernel developer Jiri Kosina in the pull notes addressed
    to Torvalds for the new live-patching functionality. “During a dedicated Live
    Kernel Patching track at LPC (the ‘Linux Plumbers’ Conference’ in Düsseldorf,
    all the interested parties sat together and came up with a joint approach that
    would work for both distro vendors.


    “It provides a basic infrastructure for functional ‘live patching’ – ie code redirection
    – including API for kernel modules containing the actual patches, and API/ABI
    for userspace to be able to operate on the patches (look up what patches are applied,
    and enable/disable them etc)”, Kosina explains.


    Described by Kosina as “relatively simple and minimalistic,” the new functionality
    uses ftrace and other existing kernel infrastructure to reduce its complexity
    and it exists self-contained. Its initial release is a reference implementation
    for


    x86 hardware, with support for PowerPC, S390 and ARM architectures already in
    the works.


    Both Red Hat and SUSE have agreed that with Kosina’s pull request now accepted
    into the Linux kernel properly, they will begin work to port their own equivalent
    functionality to the new common infrastructure. This means abandoning their existing
    out-of-tree projects in favour of something that will be much more cross-compatible
    to use.


    ![](img/c9d26cf718256f071c3af699b9670538_7_0.png)


