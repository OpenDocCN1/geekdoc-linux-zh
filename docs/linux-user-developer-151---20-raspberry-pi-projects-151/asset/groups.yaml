    # Facebook unveils modular switch

    1.28Tb/s of bandwidth available with the new open hardware modular switch


    ![](img/c9d26cf718256f071c3af699b9670538_9_0.png)


    Social networking giant Facebook has announced 6-pack, which it describes as the
    first open hardware modular switch and is designed for use in its expansive data
    centres.


    Based on a top-of-rack network switch project dubbed Wedge, 6-pack uses a Linux-based
    operating system called FBOSS with a data centre fabric based around a modular
    architecture for fast and easy scalability.


    Described as the core of Facebook''s new data centre fabric, 6-pack uses Wedge
    as a building block and works as a full-mesh non-blocking two-stage switch across
    twelve independent switching elements. Two configurations exist at present: one
    features 18 40-gig Ethernet ports to the front and a further 16 to the back; the
    other has all 32 ports to the rear for 1.28T of bandwidth and is mostly used for
    aggregation purposes.


    "With 6-pack, we have created an architecture that enables us to build any size
    switch using a simple set of common building blocks," explained Facebook''s Yuval
    Bacher at the company''s announcement. "Because the design is so open and so modular
    – and so agnostic when it comes to switching technology and software – we hope
    this is a platform that the entire industry can build on."


    Bacher has claimed that the switch design offers greater flexibility than traditional
    modular switch designs, thanks to its open hardware architecture and Linux-based
    open source operating system, and has indicated that Facebook has already begun
    production testing of Wedge, FBOSS and the 6-pack modular switch itself.


    Facebook has further confirmed that they have contributed the design of 6-pack
    to the Open Compute Project, of which it is a founding member.


    Right 6-pack is a modular data-centre switch design with 1.28Tb/s of bandwidth
    and a Linux-based OS


