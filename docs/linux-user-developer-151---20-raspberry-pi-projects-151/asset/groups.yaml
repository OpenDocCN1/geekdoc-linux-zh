    ![](img/c9d26cf718256f071c3af699b9670538_23_0.png)


    ### Robotics education


    There are many ways to try and get kids excited with coding. Like making games
    in Scratch, modifying Minecraft and teaching via robotics. The latter is a newer
    concept but still has the same merits – a physical creation that children are
    excited about then react to the programming they’ve done on it. Visible results
    and instant gratification is a great way to get imagination fired up.


    When we talked about Rolly the alarm clock robot around the office, most people
    burst forth with a string of expletives not fit for print. It’s a stiflingly evil
    invention – an alarm clock you need to work for to turn off. It sounds like a
    great invention, getting people who have trouble waking up to actually get up
    out of bed and start the morning.


    Like any other Dexter Industries robot, it runs on BrickPi, the LEGO Mindstorms
    adapter for the Raspberry Pi that enables it to interface with LEGO kits via programming.


    “Today almost everyone uses their phone as an alarm clock, which has a range of
    benefits,” the website explains. “Phones are easy to set, easy to adjust, play
    custom songs and can even sense when is the best time to wake you up. The problem
    is, unless your phone is across the room, we use our phones so much we can literally
    use them in our sleep. Why not build a robot that is able to do all these things,
    but won’t stop till you get up and start moving! Our robot will be able to easily
    move randomly around the room over any surface, playing a custom alarm tone.


    In order to set the alarm, simply link the program on the BrickPi to your Google
    account and it will search events with the title “wake” and automatically start
    the alarm at the event’s time. This means the alarm time can very easily be adjusted
    using any device that can access your Google Calendar.”


    #### Maker Profile


    **Taryn Sullivan**


    *Advisor*


    Taryn is an international businesswoman. As well as flying between Shanghai and
    DC for her own engineering business, she now works with Dexter Industries to promote
    robotics education.

