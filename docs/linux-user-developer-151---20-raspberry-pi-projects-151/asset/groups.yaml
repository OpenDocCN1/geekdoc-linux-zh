    ## Feature


    ### Project Jarvis


    The 1950s future today with your voice-activated smart home automation system


    ![](img/c9d26cf718256f071c3af699b9670538_27_0.png)


    - **Maker Profile**

    - **Mayur Singh**

    - Computer systems engineering student


    Located in South Africa, Mayur''s expertise is in embedded systems and he is familiar
    with microcontrollers and systems that enable outside hardware interaction, such
    as the Raspberry Pi and the BeagleBone Black.


    Find out more: bit.ly/1EvIImci


    ![](img/c9d26cf718256f071c3af699b9670538_27_1.png)


    **Left** The Jarvis interface is gorgeous, but you can control the system from
    anywhere using your smartphone or your voice


    **Home automation has been a thing for years now, with a fair few intrepid engineers
    and DIYers modifying their home.** With wirelessly controlled lights, heating,
    garage doors and many other household items, it''s amazing what some have achieved.
    Science fiction has always portrayed houses with advanced systems and Mayur has
    been busy creating such a system.


    "The major inspiration came from watching the *Iron Man* movies, which is where
    the name Jarvis comes from. I decided to build a simple home automation system,
    however over the many years and many re-installs of Windows, I lost my program.
    I built a new and improved home automation system, which features an AI assistant
    and more functionality, after I saw the third *Iron Man* film."


    While home automation is one part of the project, convenience isn''t the only
    factor.


    ![](img/c9d26cf718256f071c3af699b9670538_27_2.png)


    **Above** Alarm mode can only be disabled with the right finger or the master
    code


    "The main function of the system is to help save energy in homes," Mayur tells
    us. "Jarvis can read and monitor the electricity usage per light or appliance
    and this lets the AI perform certain tasks. These tasks are determined by outside
    factors, like whether or not a light should be switched on. If there is adequate
    natural light in the room. This is a basic example but other factors influence
    the determination of the AI, which has control over the power to each light or
    appliance. The data is logged throughout the month and the system uses that information
    to achieve better results the following month. This is smart home automation."


    The Jarvis AI is a major part of it, and you can talk to it. "He can control your
    home using voice interaction and make basic decisions about energy savings in
    a room. I have also recently built a well-rounded tablet system that links to
    a local online grocery store. It uses voice control to identify what products
    you need and adds the items to a list until you specify the delivery."


    With a year and a half of work on the project, everything Mayur has completed
    works reliably, but there are still more functions he wants to add.


    ### The voice


    The Jarvis that this project is named after is well known for its snarky remarks
    and tone of voice. Choosing an actual voice that works is a hard enough task without
    going for a certain style, as Mayur explains:


    "It''s been difficult trying to find voices with a good API and price but I have
    settled for a free API which offers cloud conversion and just sends an MP3 sound
    file back. It takes longer but it ensures that the voice works on all OSs."


    If you''re interested in having a go at creating your own Jarvis-esque home automation
    system, check out the previous issue of *Linux User & Developer*. Jay Bernard,
    who writes the Python column, began a three-part series (continued on page 72)
    that explains how to set up a voice assistant that uses Python and a few voice
    recognition modules to parse your spoken commands.


    ## Plan your perfect day out


    Inspire your family and go somewhere amazing this weekend. **GREAT DAYS OUT**,
    the new FREE iPhone app from **HOW IT WORKS**


    *Explore great attractions on the map*


    ![](img/c9d26cf718256f071c3af699b9670538_28_0.png)


    Search ''Great Days Out'' in the App Store or visit www.greatdaysoutapp.com


    ## Troubleshoot & Repair

    ### Linux Networks


    No network connection on your laptop or problems with your Web hosting? We’re
    here to help


    ![](img/c9d26cf718256f071c3af699b9670538_29_0.png)


    "The Network is the computer," is the famous, prescient quote made by Sun Microsystems''
    chief scientist and employee number five, John Gage, in 1984. The growth of the
    web, mobile and cloud computing have borne out that phrase, and a computer without
    a network connection is just an expensive paperweight.


    Fortunately networking is central to Linux, with the Internet, and the Web, having
    been built on UNIX. Most distros have the built-in tools that will tell you what''s
    going on, or at least start you on your way in investigating your network problem.
    More sophisticated tools can be found in your distro''s repository and, as nearly
    all of them are command line based, will work just as well on your VPS as your
    laptop.


    Linux puts the power in your hands – you just need to know where to look. Over
    the next few pages we''ll take you through the basics of the GNU/Linux networking
    stack, and what can go wrong with it (and the rest of the Internet). We''ll look
    at tools and config files to help you and finish with help for using four of the
    most useful tools: netcat, dig, traceroute and Wireshark.

