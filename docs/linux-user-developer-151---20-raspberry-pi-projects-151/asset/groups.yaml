    ## Linux 用户来信


    关于杂志、Linux 和开源的意见


    ### 链接过去


    是我眼花了吗，还是 Valve 终于对 SteamOS 和 Steam Machine 的开发采取了更积极的态度？我刚看到关于 Steam Link 的新闻，我不禁想起，在
    SteamOS 发布那会儿，我就觉得一款专用的流媒体盒子会非常合适！我真的不认识任何想要在已经拥有 Steam 游戏库的情况下，却还要一个 Steam Box
    的人。不过，我倒是好奇这些盒子可被“折腾”的程度如何？我们能否为其添加媒体流功能？如果那样，那就真的完美了。


    Mel Riddler


    我们似乎还不知道 Steam Link 是否运行 SteamOS，但说实话，这样做是有道理的，因为他们已经有这套操作系统用于玩游戏等用途。他们可能只需要进行一些内部调整，使其不在本地存储任何数据。至于媒体播放，这是一个非常棒的想法，我们完全能够理解并欣赏这一点，但对于像这样开源程度有限的设备，除非
    Steam 商店里有官方应用，否则你不太可能添加像 Kodi 这样的应用。不过人总要有一点点梦想，Valve 肯定知道这是人们所想要的。


    ![](img/c9d26cf718256f071c3af699b9670538_93_0.png)


    上方：Kodi 媒体播放器拥有了新的名称和新的界面


    ### 告别 XBMС


    我非常喜欢 XBMC——我使用它已经很久了。曾经有一两年的时间，我拥有一台很棒的 Xbox 机器，但即使在那时，我运行在那些社交应用底层的是 XBMC。现在我回到
    XBMC 已经好几年了，我热爱它，也热爱这个品牌——所以我不太理解他们为什么要改名为 Kodi？他们为什么要试图破坏自己的品牌呢？这看起来很奇怪。


    Jim Nurdin


    也许你知道，XBMC 这个名字源于其最初的目的——Xbox 媒体中心（Xbox Media Centre），由于其强大的功能和网络能力，它在破解版 Xbox
    上非常流行。在 21 世纪末，随着其扩展，并且对原始 Xbox 的支持越来越少，它正式更名为 XBMC。他们决定 XBMC 这个品牌已经完全过时，因此选择了全新的名字以摆脱它。


    此外，还有一个问题：由于与 Xbox 的关联，XBMC 在法律上并不属于他们，显然这意味着市面上销售了许多带有 XBMC 品牌的假冒硬件，这些硬件最终都会出现故障。因此，这对每个人来说都是更好的，希望这真的能让品牌在未来发展壮大并变得更好。


    ### 为操作系统付费


    我注意到 elementaryOS 现在决定更大力度地推广其发行版的捐赠选项。老实说，我对此意见分歧。一方面，这一切似乎都在羞辱那些不付费就使用它的人——开发人员似乎不太理解自由开源软件（FOSS）的哲学和社区。但另一方面，我理解他们确实做了很多工作，而且如果你花点时间，它仍然是免费获取的。说实话，当
    Ubuntu 这么做时，我本来就不太喜欢，我也不喜欢其他发行版效仿这一做法。


    Ben W


    你必须记住的一点是，自由软件中的“自由”并不指


