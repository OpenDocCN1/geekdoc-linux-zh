    \ C 的 `strlen` 函数来计算其长度。使用指针时则不需要这样做，因为内存中用于标记字符串结尾的 '\\0' 字符可以让你在程序中确定字符串的结尾——因此一个简单的\
    \ while 循环就能完成任务！若要修改字符串，必须使用以下 C 语句进行初始化：\n\n```c\nchar s[] = \"abcdefg\";\n\
    ```\n\n普通的指针版本（参见‘PRevC’文件）还需要一个额外的指针变量来标记字符串的结尾。`p` 指针初始化为字符串第一个字符的内存地址：`char\
    \ *p = &s[0];`（很糟糕的 C 代码！）。可以使用一个不寻常但完全可用的 while 循环来找到字符串的结尾：\n\n```c\nwhile (*++p)\
    \ ;\n```\n\n上述 while 循环会使你的代码看起来奇怪，因此不会使用它。数组版本（参见‘RevC’）易于理解且运行良好，看起来很像 Perl\
    \ 或 Python 代码。此外，如果你拥有一个智能的 C 编译器，它可能会将数组替换为指针并为你执行优化工作。整个过程中棘手的部分是确定字符串的长度，这取决于具体的字符串。最终版本将使用指针算术、数组和\
    \ `strlen` 函数：\n\n```c\nfor (i=0; i < len/2; i++) {\n    temp = s[i];\n    s[i]\
    \ = *p;\n    *p = temp;\n    p--;\n}\n```\n\n代码高效、简洁且优雅。`p` 指针的初始值表示字符串的结尾：`char\
    \ *p = &s[len-1];`。你可以在 www.filesio.co.uk 或 www.mtsoukalos.eu 找到这三个 C 程序。在下篇文章之前，请继续编程！\n\
    \n## 客座专栏\n\n### 破解编码技能之谜\n\n软件测试公司 Coverity 的总监扎克·萨莫哈（Zach Samocha）探讨了编码在英国的重要性及普遍性\n\
    \n![](img/c9d26cf718256f071c3af699b9670538_13_0.png)\n\n**扎克·萨莫哈（Zack Samocha）**\
    \ 是 Coverity 的总监。在他目前的职位上，他制定了公司的产品战略，并管理着 Coverity 开源 Scan 计划。在他的领导下，该计划已发展至\
    \ 4,000 个项目和 10,000 名活跃用户。扎克还发起了研究，比较开源代码质量与专有代码质量。\n\n**2014：代码之年** – 或者至少这是许多人看待那\
    \ 12 个月的方式，这段时期将这项宝贵技能推上了风口浪尖。去年，编码获得了巨大的媒体关注，特别是当它在 9 月被纳入英国教育课程时——许多人对这一举措表示庆祝。\n\
    \n这对整个 IT 行业来说都是真正积极的进步，尽管新发现的对编码的关注可能需要一段时间才能改变企业。即便如此，培养拥有更广泛技能和更多样化人才队伍，绝对是朝正确方向迈出的一步，尤其是考虑到目前缺乏熟练的编码人员。连同树莓派（Raspberry\
    \ Pi）等小工具，这些发展旨在年轻人早期生活中激发他们对计算机制的热情。希望他们在这个话题上的兴趣会在青少年时期乃至职业生涯中不断增长。\n\n在英国学习编码的人数之多是令人兴奋且重要的，因为它正在改变我们对这个国家\
    \ IT 的看法。人们越来越多地思考应用程序和软件的可能性，而不仅仅是支持和维护全国各地办公室里的台式机、笔记本电脑和打印机。\n\n这对编码社区来说是极大的好消息，但我们不能过度兴奋。\n\
    \n尽管编码技能在更广泛的社会中越来越流行，但这种流行并不一定与代码质量的增长相匹配。不幸的是，我们必须考虑，随着程序员数量的增加以及他们产生的代码标准，是否会降低对开源项目贡献的标准，例如，作为一个近年来取得了很多进展的领域。\n\
    \n让我们以开车作为类比；在英国，数百万人在满足所有要求后可以合法驾驶。我们通过了实操和理论考试，购买了车辆并缴纳了道路税以维护我们行驶的道路。在编码方面，你不需要执照，你只需要知道如何做以及上手工具。编码对每个人开放，因为没有任何正式规定，结果它吸引了大量独立的编码者。\n\
    \n如果有谁是‘自学成才者’，他们甚至无需考虑拥有正式资格证明，就能创建各种软件和应用。\n\n编码社区已经熟知这些问题。即使是那些实际上有看门人过滤和监控代码贡献的开源项目，这也是一项具有挑战性的任务，因为人们会犯错，其中一些错误会溜过去。因此，小错误的积累，\n\
    \n> “去年，编码获得了巨大的媒体关注，特别是当它被纳入课程时”\n\n"
