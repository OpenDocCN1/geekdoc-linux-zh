    直接使用该模块对初学者可能较难，且当装入 Arduino 载板后，Edison 的尺寸优势便丧失了。\n\n> 首次设置 Edison 的过程并不友好\n\n\
    顾名思义，Arduino 扩展套件将 Edison 模块变得更加适合爱好者使用。当与电路板结合时，Edison 相当于一个连接到运行 Yocto Linux\
    \ 发行版的高性能计算机的 Arduino Uno 微控制器。它与 Arduino 平台几乎完全兼容，只是在具有脉宽调制（PWM）控制功能的引脚数量上有所减少，从六个减至四个——这是\
    \ Edison 的上限。电路板还提供 USB 连接、基于 USB 的串行监视器以及 7-15V 电源输入，但不含电源。\n\n不过，Edison 并不局限于英特尔自己的板子。美国爱好者专家\
    \ SparkFun 已创建了一系列被称为“Blocks”的电路板，它们以更为紧凑的方式引出 Edison 的各种功能。这些 Blocks 两侧均设有 Hirose\
    \ 连接器，允许用户将多个 Blocks 堆叠在一起，并在顶部放置 Edison。\n\n自带的 Linux 发行版存储在集成的 4GB eMMC 闪存模块上，虽然精简但功能齐全，且双核\
    \ 500MHz Atom 处理器比同价位的竞品板卡强大得多。1GB 内存同样慷慨，由于设计中没有图形处理器，因此没有 RAM 预留给 GPU 使用。\n\n\
    唯一的缺点是它的配置。首次设置 Edison 的过程并不友好，虽然英特尔在其新上线的“创客”网站上提供了详尽的文档，但内容略显冗长，且在步骤和图片中偶尔存在错误。\n\
    \nGareth Halfacree\n\n### 总结\n\nEdison 是一个非常巧妙的想法，但英特尔官方的硬件捆绑包未能很好地展示它。当你脱离官方扩展板，将模块与第三方模块（如\
    \ SparkFun 的可堆叠 Block 系列）配对时，其灵活性便一目了然，而其计算能力为激动人心的嵌入式项目提供了巨大的潜力。\n\n## **评测**\n\
    \nRyanteck 套件, Tails 1.3\n\n![](img/c9d26cf718256f071c3af699b9670538_83_0.png)\n\
    \n## **机器人**\n\n### Ryanteck 树莓派低成本机器人套件\n\n> 市面上最便宜、最简单的树莓派机器人是完美的入门套件\n\n过去几个月，我们在《Linux\
    \ 用户与开发者》杂志中介绍了一些低价且基础的套件，成功率各异。有些只是做工廉价，有些则使用了简单的组件选择，当你熟悉背后的机器人技术时可以进行扩展。然而，Ryanteck\
    \ 低成本套件采取了略微不同的方法。\n\n名字中的“低成本”绝对是非常贴切的描述。该套件包含了实现移动所需的基本要素：两个电机、连接它们的底盘以及连接树莓派的方式。你可以多花一点钱来获得开箱即用的完整构建，否则你还需要树莓派、Wi-Fi\
    \ 适配器和用于给树莓派供电的便携式电池。\n\n组装起来相当快速简单，而且相当坚固。电机是你在许多其他机器人套件中常见的标准电机，甚至配有速度传感器，如果你希望更好地控制直线性能可以添加。底盘本身有许多安装点，只需对顶部组件进行少量改装即可添加任意数量的额外传感器。\n\
    \n编程机器人相当简单，使用 Python 和 GPIO 端口按需激活电机。无需担心 Arduino，网站上的基本示例代码足以适应你自己的用途。由于电路板连接到树莓派的方式，标准的\
    \ 26 个引脚可供插入——因此通过一点巧思，你可以通过这种方式添加传感器。\n\n这是一个看起来平淡无奇的简单套件，但鉴于其价格以及能够立即开始学习机器人的能力，它是一个很棒的选择。然而，其升级路径非常有限，如果你想做更多事情，很快就会需要考虑其他机器人。\n\
    \n**Rob Zwetsloot**\n\n| 尺寸 | 20mm x 170mm x 80mm |\n|---|---|\n| 重量 | 0.5kg（含电池）\
    \ |\n| 价格 | £24.49 |\n\n### **总结**\n\n对于完全的初学者、孩子以及使用树莓派制作聚会小玩意的人来说非常好，但与其他低成本套件相比，这是一个最基础的入门机器人套件，扩展性较差。不过，没有其他的像它这么便宜，或与\
    \ Model A+ 配合得如此顺滑。\n\n"
