    # Tutorial: LVM filesystems


    Understand the limitations of graphical partitioning when dealing with LVM filesystems.
    Create, name and modify logical volumes and volume groups that contain all your
    data. Add more hard drives and partitions to the LVM to keep expanding the space
    forever by allocating it smartly.


    ![](img/c9d26cf718256f071c3af699b9670538_45_0.png)


    ## Set up LVM filesystems


    ## Advisor


    ![](img/c9d26cf718256f071c3af699b9670538_45_1.png)


    Rob Zwetsloot models complex systems and is a web developer proficient in Python,
    Django and PHP. He loves to experiment with computing.


    ## Quite a different filesystem to your normal ext4 partitions, but LVM might
    just be the way for you to go


    ## Resources


    - LVM 2 tools: sourceforge.org/lvm2

    - GParted: gparted.org


    Last issue we talked about Btrfs, the next generation of filesystems. In that
    tutorial we briefly mentioned LVM, a technology that is already widely in use,
    and how it’s related to Btrfs. Logical volume management, as it’s properly designated,
    acts as a sort of container to manage data – the benefit of this is that you can
    start adding and extending space while the LVM is still online and working.


    This is great for server farms because you can swap out and add storage very quickly,
    and on your desktop it''s good for managing the size of different partitions if
    you weren’t sure how they should have been during installation.


    In this tutorial, we’ll look at how you can create an LVM filesystem and how to
    maintain and modify it. We will also look into how some distros install using
    LVM.


    ![](img/c9d26cf718256f071c3af699b9670538_46_0.png)


    ## 01 Install LVM


    Many distros have the option to install using an LVM filesystem. In our example,
    we''ve left the LVM option checked when installing Fedora 21. This will automatically
    create a boot and storage partition within the logical volumes for you to play
    about with later.


    ## 02 Graphical partition editors


    General partition editors like GParted have a bit of a tough time working with
    LVM filesystems – with the right tools installed you can see the partition but
    you can''t really do much to it. For this tutorial, we will be working mostly
    within the terminal.


    > “The LVM partitions are kept inside a volume group”


    ![](img/c9d26cf718256f071c3af699b9670538_46_1.png)


    ![](img/c9d26cf718256f071c3af699b9670538_46_2.png)


    ## 03 Use LVM tools


    Although you can edit partitions live, we suggest booting into a live disc or
    other distro on the system instead. Once you have, install the LVM2 tools if they
    haven''t been installed already. The package is called lvm2 in the repos and contains
    various tools for looking at and manipulating LVM partitions, which is useful.


    ## 04 View the LV


    Now the tools are installed, we can have a peek at the LVs (logical volumes) on
    the system. This will display the volume group, the name, type and size. Open
    up the terminal and use:


    ```bash

    $ sudo lvs

    ```


    ## 05 See the volume group


    The LVM partitions are kept inside a volume group, which in our case is called
    Fedora but could be called anything. You can get more accurate details on this
    by using the volume group tools like so:


    ```bash

    $ sudo vgdisplay

    ```


    ![](img/c9d26cf718256f071c3af699b9670538_47_0.png)


    ## 06 Create an LVM


    It takes multiple steps to make an LVM filesystem. You need to create a physical
    volume for the volume group to be in and then you can create your logical volume
    inside that. First though, create a new partition on the system in your preferred
    method.


    ## 07 Make a physical volume


    Once the partition is made, you can turn it into a physical volume. Make sure
    you know the designation of the partition (in our case /dev/sda3), which you can
    find out with `fdisk -l`. Create the PV with:


    ```bash

    $ sudo pvcreate /dev/sda3

    ```


    ## 08 Include a volume group


    Now with a physical volume to play with, we need to create a volume group with
    a name. Make sure you still remember the partition designation and create it with
    something like:


    ```bash

    $ sudo vgcreate LVMVG /dev/sda3

    ```


    You can add several partitions and/or hard drives like this as well.


    ## 09 Create a logical volume


    The final step is to include a logical volume. Give it a name, tell it how much
    space to use and which volume group it should belong to. To fill up a 20GB volume
    group, use:


    ```bash

    $ sudo lvcreate --name root --size 20G LVMVG

    ```


    ## 10 Extend the volume group


    If you want to extend the space in your original volume group, first create a
    new physical volume as before. Find out the name of the volume group (vgdisplay)
    and use the designation of the partition to extend with:


    ```bash

    $ sudo vgextend /dev/fedora /dev/sda3

    ```


    ## 11 Alter the logical volume


    Ensure that you know exactly how much space you have to extend the partition by
    using vgdisplay to find the free PE (physical extent) value, and also make sure
    you know the name of the partition that you are extending. Once you have both
    of those, then use:


    ```bash

    $ sudo lvextend -l +4958 /dev/fedora/root

    ```


    ## 12 Resize the file system


    To finish off the extension, we need to let the entire LVM system know that it
    has had some changes using the resize option on the LV you’ve extended. The good
    thing is, this means you don’t need to have space ‘next to it’ in the hard drive
    to extend in this way. Do this with:


    ```bash

    $ sudo resize2fs /dev/fedora/root

    ```


    ## Make sure you know the designation of the partition


    ![](img/c9d26cf718256f071c3af699b9670538_48_0.png)


    ![](img/c9d26cf718256f071c3af699b9670538_48_1.png)


    ## 13 File system check


    Depending on how the storage was created, you may need to check the integrity
    of the filesystem before performing the resize2fs. In our case, it asked us to
    perform an e2fsck command on the extended LV before resizing – all you need to
    do is follow the instructions.


    ## 14 Test your new filesystems


    You can now see the extended space in the LV, the volume group and see if you
    have any spare space still to allocate using the lvs, vgdisplay and pvs options.
    In lvs and vgdisplay, it won’t show the extra sda partition because it’s all part
    of the same storage as far as it’s concerned.


    ## 15 More complicated setups


    The beauty of LVM is that we can have several partitions and hard drives, have
    them all donate space to the volume group and then be divided between different
    LVs. You can create multiple LVs in any volume group, taking space where you want
    it. Adding hard drives later will let you extend the storage with little hassle.
    The partitions you create traditionally will show up as ext4 or whatever filesystem
    in the partition editors, but they’ll be inaccessible outside of the LV.


    ![](img/c9d26cf718256f071c3af699b9670538_48_2.png)


    ## 16 Delete an LV


    Want to completely rearrange the insides of your volume group? Start by deleting
    LVs to create them from scratch using the lvremove command. Make sure you know
    the name of the LV you’re removing and do it like so:


    ```bash

    $ sudo lvremove /dev/[volume_group]/[logical_volume]

    ```


    ## 17 Remove a volume group


    Need to go a step further and delete the entire volume group? This will delete
    all the LVs within and free up some of the partitions that are in the physical
    volume. Make sure you know the name of the volume group and then do:


    ```bash

    $ sudo vgremove [volume_group]

    ```


    ## 18 Get rid of the physical volumes


    If you want to remove the LV completely, you can just delete the physical volume
    designations and then start using a more traditional partitioning system instead.
    Make sure you know the original names of the partitions and remove them:


    ```bash

    $ sudo pvremove /dev/sda1 /dev/sda2 [etc]

    ```


    ## 19 Shrink the logical volumes


    Like we did with the expanding, you can shrink the logical volumes and volume
    groups. In each case, you would be reducing the size of the logical volume or
    removing physical volumes from the volume group, respectively – otherwise it works
    the same way.


    ## 20 Logical volume management


    There are more functions you can use while creating and maintaining an LV, but
    these are the basics. If you find yourself running through a lot of storage then
    this may be the solution for you, as you can just keep adding with little-to-no
    hassle and no RAID.

