  md: '# Tutorial


    # AWS cloud


    # ## EBS Volumes


    EBS volumes are slower than instance storage but offer data persistence – you
    can attach and detach them even while your Linux instance is running.


    EBS volumes come in two flavours: as magnetic hard drives or ''flashy'' SSDs.
    Amazon offers SSDs in one performance category – General Purpose or Provisioned
    IOPS, which deliver bursts of I/O depending on the size of the drive and other
    users'' activities in the shared storage pool. SSDs with provisioned I/O level
    will perform at the specified I/O level, but they are pricey. General Purpose
    SSDs are the way to go. If you''re budgeting and need infrequent access, Magnetic
    is a compromise.


    # ### 08 Choose an instance type


    ![](img/c9d26cf718256f071c3af699b9670538_59_0.png)


    # **05** Choose your AWS region


    Some AWS services, particularly EC2, require you to select an AWS region. A region
    is a set of interconnected data centres, called AWS zones, with a common tax jurisdiction
    and identical pricing. You can utilise services in any of the nine AWS regions,
    not just your default one, and combine them to suit you. Typically, you would
    pick the most cost-effective one or combine several regions that are closest to
    the location of your end users to minimise latency. It''s important to remember
    that your EC2 dashboard shows infrastructure that you are paying for only in the
    region currently selected. This is a common trick of AWS: watching resource consumption
    in the dashboard of a wrong region, so beware.


    # **07** Select a Linux-based AMI


    The storage configuration of an instance is described using a machine definition
    called an AMI (Amazon Machine Image). An AMI specifies, among other things, the
    contents of the boot volume. Select an AMI based on a Linux distribution from
    your choice from the list in section *Quick Start* (not a database instance, an
    Amazon RDS instance doesn''t grant you superuser access at the OS level). Instances
    labelled ''Free tier eligible'' do not incur any costs so long as you remain within
    the time allotment of up to 720 hours per month throughout the first 12 months
    after your account is first registered.


    # **06** Launch a new EC2 instance


    Navigate to the EC2 section of the AWS Management Console. This part of the interface
    grants you access to a variety of infrastructure services which enable you to
    build and run your own Linux box in the AWS cloud, a so-called EC2 instance of
    Linux.


    Each EC2 instance represents a host that runs in a virtualised environment in
    isolation from other virtual machines, which makes it very cost-effective and
    reasonably safe. In order to start your own Linux server in the cloud, click on
    *Launch Instance* in the EC2 Dashboard. You can also click on the link *Instance*
    in the left-hand navigation pane of the AWS Management Console and then on the
    button *Launch Instance*.


    # **08** Choose an instance type


    The instance type defines the performance characteristics of your Linux box in
    terms of its clock speed, available RAM, internal storage and network capabilities.
    The only instance type that qualifies for the free usage tier is t2.micro.


    Make your choice and then click *Next: Configure Instance Details*.


    It is best to launch an EC2 instance in a virtual private cloud (VPC), which is
    a fancy way of saying that Amazon will isolate it from other users'' instances
    by means of smart routing. Older AWS accounts may also offer an option labelled
    ''EC2-Classic'', which does not have this protection, so if you see it, don''t
    use it.


    In the menu *''Auto-assign Public IP''*, select *''Use subnet setting (Disable)''*.
    Set the IAM role to None and shutdown behaviour to Stop. If you enable ''Termination
    protection'', AWS won''t let you destroy the instance using the Terminate command
    in the Console until you remove this protection.


    Leave the other options unchanged and click on *Next: Attach Storage*.


    # **09** Configure instance details


    On the next screen, you can select how many instances to start, whether you want
    them to be persistent (leave the *Purchasing option check box deactivated*, if
    they should have their own privileges to access your AWS services (IAM role)None,
    and configure


    # **10** Attach storage


    If you need additional volumes, you can create and attach them now. Free Tier
    covers up to 30GB of General Purpose (SSD) storage giving you a maximum baseline
    performance of slightly under 100 IOPS (see ''EBS Volumes'' box for more information).


    Now click on *Next: Tag Instance*.


    # **11** Tag your Linux instance


    Tags on AWS are key value pairs that store information that can help you to organise
    your AWS resources. Using tags is purely optional. Don''t sweat it – you can always
    add tags later if you need to. If nothing comes to mind, click on *Next: Configure
    Security Groups*.'
