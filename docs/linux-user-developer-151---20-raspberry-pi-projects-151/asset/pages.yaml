  md: '# Build a complex LED matrix


    # Our LED model has a total of 32 inputs, which overwhelms older versions


    ![](img/c9d26cf718256f071c3af699b9670538_68_0.png)


    *Above* The extended version of this schematic is inside FileSilo.co.uk – just
    sign in and head to the issue #151 page


    # 03  Harnessed the MUX


    Our LED module has a total of 32 inputs, which overwhelms older versions of the
    RPI. The first way to restrict their number comes in the shape of the 74HC238,
    a component described as a 3-to-8 line decoder/demultiplexer. Its function is
    described in the Figure B image on the next page.


    # 04  Separate concerns


    Chip two goes by the name of 74HC244, which is described as an octal buffer with
    tri-state capability. Tri-State outputs can physically disconnect themselves from
    the bus line. This permits you to tie their outputs together without fear of short
    circuits. As long as all but one chip are in tri-state mode, no current can flow
    between high and low output pins.


    # 05  Round them up


    Four GPIO pins control the currently-enabled ‘line’ of the display. Three pins
    configure the address which is to be emitted, while the signal emitted from the
    fourth pin is connected to the activity inputs. This ensures that but one IC is
    active. The 74HC244 ensures that but one of the two groups is active at any given
    time.


    # 06  Configure the pins


    We used a library from Hussam Al-Hertani’s Hertzville blog (hertzville.com/2014/07/07/rpimmapgpio).
    The first step involves setting output functions. As the GPIOs are set to outputs,
    the tri-state feature might connect the internal state to the output pins of the
    IC. This could lead to internal shorting if the output is not turned off.


    # Full code listing


    ```

