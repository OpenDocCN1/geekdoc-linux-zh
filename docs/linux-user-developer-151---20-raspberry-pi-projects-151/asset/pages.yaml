    # # 20

    ## Raspberry Pi

    ## Projects


    Get the **inside story** on the greatest

    Raspberry Pi **hardware hacks**


    There are now over five million Raspberry Pi models out in the wild, and some
    of the things that you, the Raspberry Pi community, have made with them truly
    are wild. From elegantly crafted scripts that chain together a series of web services
    to homebrew Rube Goldberg machines, they are as creative as they are diverse.
    And through the crowd of new projects bubbling up online every day, if there’s
    one word that’s guaranteed to get everyone’s attention than it’s the word ‘hack’.

    But what exactly is a hack? Well, for the purposes of this feature, we decided
    that a hack has to have some sort of hardware base. It’s the kind of project where
    you take one device and, with a little Raspberry Pi magic, transform it into something


    wholly new and original. These are the projects that get us excited and make us
    want to learn more about electronics, engineering and programming.

    Over the next few pages we’re going to introduce you to some of the greatest Raspberry
    Pi hacks that we’ve ever discovered. Projects where vintage hardware has been
    torn apart and the components repurposed into something amazing, or where the
    hardware has been puzzled over, fiddled with, then brought back to life after
    twenty years spent in a garage. These hacks inspire us, with each maker striking
    the right balance between passion, skill and virtuosity, and we hope they inspire
    you too. Read on as we hear how you can launch a satellite from a bedroom spaceship,
    transform an analogue camera into a digital one, make a classic Apple Pi and more.'
