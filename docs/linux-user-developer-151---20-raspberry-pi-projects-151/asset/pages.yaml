- pgno: 65
  md: '# Tutorial


    # Make a Raspberry Pi 2 HTPC


    Finally create a more powerful and capable HTPC using the Raspberry Pi 2 and the
    excellent OpenELEC project


    **Rob Zwetsloot** models complex systems and is a web developer proficient in
    Python, Django and PHP. He loves to experiment with computing


    We know people who just a great idea and a great use for the Pi – it works just
    well enough that you can easily play media locally or over the network. The biggest
    issue come with GUI response on the original Model Bs, and a lack of USB ports
    for connecting up everything that you want.


    While optimisation over the last few years has helped, the leap to Raspberry Pi
    2 has basically solved all of these problems by giving you much more powerful
    hardware to play with. So if you''re looking to upgrade or finally take the plunge,
    this handy guide will help you create the perfect Raspberry Pi 2 HTPC.


    **01 Choose the software**

    In the past, Pi HTPCs were just a choice between RaspBMC and OpenELEC. However,
    RaspBMC is on a bit of a hiatus and OpenELEC is your best bet for getting the
    most up-to-date software. There''s not a massive difference between the two, as
    they both run XBMC.


    **02 Get the software**

    Head over to openelec.tv and look for the Download section. There''s a specific
    Raspberry Pi section which is split up into original (ARMv6) Pi and the newer
    Raspberry Pi 2 (ARMv7). Grab the image file from this page for the Pi 2.


    ![](img/c9d26cf718256f071c3af699b9670538_65_0.png)


    # What you''ll need


    +   * OpenELEC openelec.tv

    +   * HDMI cable

    +   * USB IR receiver

    +   * IR remote

    +   * Case

    +   * Dedicated power supply

    +   * Optional USB storage


    www.linuxuser.co.uk'
