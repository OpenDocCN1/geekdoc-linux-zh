    \ years after the death of its composer, and the rewards go to a corporate entity,\
    \ is less tenable. We may not fight wars over the right to copy a book today,\
    \ but open access to common information, in the form of scientific documents that\
    \ were never intended to be privately owned, and which is “increasingly being\
