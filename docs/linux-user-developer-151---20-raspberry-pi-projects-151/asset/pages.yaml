    The most exciting new feature in Linux 4.0 is probably going to be the new live
    patching mechanism that can be used for dynamically updating the kernel with security
    and bug fixes without rebooting (akin to the older Ksplice and similar live updating
    technologies invented prior to that). Another cool feature will turn out to be
    the new KASan (Kernel Address Sanitizer), which tracks kernel memory accesses
    to verify that they turn out to be what it intends to touch. This should turn
    out to be very useful to developers, who generally like to know if any of their
    kernel modifications lead the kernel to attempt to trounce over physical RAM,
    causing hard-to-detect memory corruption in the process. Finally, the incorporation
    of support for NVM (Non-Volatile Memory) backed conventional filesystems will
    be exciting to those lucky enough to possess a large quantity of NVM hardware
    with which to try it out.


    If things go according to plan, we’ll have a full summary of Linux 4.0 in next
    month’s issue, including how kernel live patching works. We will also look at
    how we root subtle bugs in the kernel during (and after) a development cycle by
    methodically investigating changes made over time, and a look back at how we dealt
    with the Linux 3.0 numbering change once of defe.


    # Raspberry Pi 2


    Many of us who grew up in the UK remember, rather fondly, the BBC Microcomputer
    System (or ‘BBC Micro’, or simply ‘BBC’). These computers were made by a small
    company from Cambridge, England, known as Acorn. The purpose of the original BBC
    was to bring computer literacy to the masses. Its cult-like success and the achievement
    of its goals during the early part of the Eighties was at least indirectly responsible
    for many later developments in the British computing industry, including the formation
    of another small company spin-off from Acorn now known as ARM. That’s the same
    ARM that today powers over 95 per cent of smartphones and the vast majority of
    tablets and other gadgets.


    The original BBC inspired many who would come later. It was the inspiration for
    the creation of the Raspberry Pi Foundation years before the launch of their first
    Model A (a nod to the BBC, which like the Pi also came in a Model B). Raspberry
    Pi in 2012. The original Pi, which came in various models (A, A+, B and B+), leveraged
    a low-cost System-on-Chip originally designed for use as a mobile graphics processor
    and which just so happened to include a small ARMv6 (ARM1176JZF-S) compatible
    processor capable of running a full 32-bit Linux ARM stack (squeezed into the
    corner of the chip).


    Former Broadcom ASIC Architect and Raspberry Pi Foundation trustee Eben Upton
    was among those who successfully convinced Broadcom to support the Pi project,
    developing a low-cost credit card sized computing platform that in three years
    has already sold over five million units. The original Pi featured a 700MHz single
    core ARMv6-compatible processor, 256MB (later 512MB) of RAM, an SDHC slot for
    storage and USB. The Pi used its on-chip USB to also provide wired Ethernet via
    a USB-to-Ethernet bridge chip, and was further expandable through 1HAIs (Hardware
    Attached on Top) expansion boards.


    While the original Pi was widely popular beyond even the most outlandish dreams
    of its


