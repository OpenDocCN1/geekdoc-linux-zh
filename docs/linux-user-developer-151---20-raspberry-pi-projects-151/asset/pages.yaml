- pgno: 56
  md: '# 08 **Manage your mailbox**


    ![](img/c9d26cf718256f071c3af699b9670538_56_0.png)


    # 09 **Enjoy music and videos with SPlayer**


    SPlayer is a top-notch media beast, which can play almost any media, both local
    and remote, and even some Blu-ray discs. There’s a PPA for Ubuntu family (ppa:arvm/SPlayer),
    but it offers SPlayer with Qt4, while we need a Qt5 version. So issue the following:


    ```

    ```

    sudo apt-get build-dep splayer

    ```

    ```


    Then download the source tarball (`bit.ly/1Bl8gPT`) and use instructions from
    the Install.txt file there. The Qt5 switch is applied to the make command this
    way:


    ```

    ```

    make QMAKE=/usr/lib/x86_64-linux-gnu/qt5/bin/qmake

    ```

    ```


    Of course, you should have qt5-qmake and other Qt5 dev packages installed beforehand.


    ![](img/c9d26cf718256f071c3af699b9670538_56_1.png)


    # 10 **Write text with FocusWriter**


    FocusWriter is a simple typewriter-like editor which hides away almost all controls
    in order not to distract you from writing. Yet there are many useful features
    such as auto-saving, live statistics, spell checking, multi-document support and
    many more. You can install it using the official PPA:


    ```

    ```

    sudo add-apt-repository ppa:gotcodcc/gcppa

    sudo apt-get update

    sudo apt-get install focuswriter

    ```

    ```


    # 11 **Add fun with Cool Retro Term**


    LxQt already has a great OFterminal application with tabs support, colour profiles
    and more, but we can go even further and install Qt5 and OpenGL-powered old school
    terminal called Cool Retro Term. The following application mimics the historic
    cathode tubes of Amiga, IBM and Apple workstations:


    ```

    ```

    sudo add-apt-repository ppa:bugs-launchpad-net-falkensweb/cool-retro-term

    sudo apt-get update

    sudo apt-get install cool-retro-term

    ```

    ```


    Once it is launched you can switch between profiles or change the effects manually.
    It is even possible to scale up the whole screen so that Cool Retro Term will
    be as usable as a regular console application, which is handy.


    # **Add more apps**


    If you stay with your custom LxQt desktop, sooner or later you’ll want more. The
    applications in this tutorial are not all the Qt5 applications out there, so supercharge
    your system with the following:


    +   - **Votair** A 2D platformer game built on top of Qt Quick and LiquidUI libraries.
    Getting the game compiled in Linux needs skill, but there’s a perfect guide: `bit.ly/1HIHMB9P`.

    +   - **Friends** This app features a next OML interface and is easy to install
    (`sudo apt-get install friends-app`). To use it you must refer to Unity’s Online
    Accounts section, so you need that DE or at least its `go-daemon` (stored in `~/.config/goa-1.0/`).

    +   - **Rosa ImageWriter** This is a Qt5 port of famous SUSE Studio ImagerWriter.
    The app is improved for comfortable USB media writing. See `bit.ly/1ZgurWL` for
    applications that are dependent on KDE Software delivery and are difficult to
    use outside of certain DES.

    +   - **Qt-apps.ORG** The `qt-apps.org` website is a vital bookmark if you want
    to keep track of Qt5 applications. Most new and updated titles appear there.'
