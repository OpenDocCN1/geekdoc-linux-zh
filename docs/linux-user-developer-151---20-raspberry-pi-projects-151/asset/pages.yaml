    # Portable Pi Arcade


    Love old arcade games? With Ben Heck’s hack, you can play them all on a single
    hand-built, hand-held console


    ![](img/c9d26cf718256f071c3af699b9670538_18_0.png)


    Left Install MAME and you will never run out of arcade games to play


    Ben Heck has built two versions of the Portable Pi Arcade. The first was the original
    Portable Raspberry Pi project (youtube.com/watch?v=v-rdLZjzQuTNX4), where he hacked
    the Pi to reduce its size and opened up a USB game controller to extract more
    of the circuits. With a new assembly in place, he 3D-printed a custom-designed
    case, put the new device together, and booted up MAME (the Multiple Arcade Machine
    Emulator) to play old-school games.


    His recent revival of this earlier project was even more home-made. For the Raspberry
    Pi MAME portable gaming device (youtube.com/watch?v=rzrEj1aIQRbpw), Ben made a
    circuit board from scratch, fitting all the components into a new 3D-printed case
    that, rather than resembling a Game Gear, looks pretty close to a Game Boy.


    We asked Ben to take us through the original version of his project. "My first
    portable Pi project was a small, battery-powered unit for gaming," he begins.
    "It had a single USB port for Wi-Fi or external storage and we featured it back
    on season three of the show. The screen came from a cheap NTSC LCD screen that
    Amazon sells for use as a car''s backup camera. The buttons I laser-cut myself
    and the case was 3D-printed." And in terms of physical modifications to the Pi?
    "Mostly I removed the taller through-hole components," he replies, "and attached
    the Teensy HID (used for controllers) directly to it. I also moved the secondary
    USB port."


    As you can see above, the case is very well made; "I did the initial layout in
    Adobe Illustrator, for the laser-cut portions," explains Ben, "then transferred
    the whole design to Autodesk 123D to create a 3D-printable file. Hand-writing
    the buttons for the controls was the most challenging part of this project. It
    was the most time-intensive part and required a lot of precision and attention
    to detail."


    Ben is no stranger to taking apart consoles and controllers for his Pi hacks –
    but he also makes one-handed accessibility controllers. "In addition to all of
    the other projects and hacks, we modify gaming controllers for people who have
    difficulty using existing ones," Ben tells us. "On the show we''ve featured a
    few of them – Xbox One, PS4, even the Wii. Now we build these controllers by request
    and they can be ordered off my website, though we only do Xbox 360/Xbox One controllers
    as those use PCBs throughout (instead of silk screen circuits like the PS4). Recently
    I trained Felix (an assistant on element14''s The Ben Heck Show) on how to do
    it, so he''s been helping and working on them in his spare time as well."


    ![](img/c9d26cf718256f071c3af699b9670538_18_1.png)


    Above Watch the video to see how Ben builds and tests the custom circuit board


    # Maker Profile


    # Ben Heck


    Master hacker, creator of The Ben Heck Show


    ![](img/c9d26cf718256f071c3af699b9670538_18_2.png)


    Ben Heck is an online sensation and a pillar of the maker community, putting out
    amazing how-to videos for games console hacks and all kinds of different Pi projects.
    He''s done it all on The Ben Heck Show.


    Find out more: benheck.com


    # Heck''s hacks


    +   * **Pi Point and Shoot.** A Raspberry Pi camera module, PiTFT from Adafruit,
    PlayStation 3 controller battery and additional parts were all made into a point-and-shoot
    camera.

    +   * **Pi Retro Computer.** A tribute to the BBC Microcomputer from the 1980s,
    Ben mounted a Raspberry Pi to a self-made wooden case, HDMI port, on/off switch
    and USB hub for an old-school feel/computer and carrying case.

    +   * **Handheld Pi Console.** Ben hacked a Raspberry Pi single board computer
