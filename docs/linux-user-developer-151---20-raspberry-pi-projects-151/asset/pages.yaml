  md: "# Mission\nControl Desk\n\nAstronaut training begins early in\nJeff Highsmith's\
    \ home, with\nhis sons running launches\nfrom their home-made\nMission Control\n\
    \n![](img/c9d26cf718256f071c3af699b9670538_21_0.png)\n\nAbove\nThe Mission Control\
    \ desk\ngroups the various functions\ninto 'station' panels\n\n![](img/c9d26cf718256f071c3af699b9670538_21_1.png)\n\
    \nRight\nOutside of playtime, this is just an\nordinary homework desk. Almost\n\
    \n> **Jeff Highsmith**\n> Tinkerer/extraordinary\n> \n> Jeff Highsmith loves to\
    \ make new and novel\n> things. The medium isn't important, and he\n> enjoys scrounging\
    \ for materials and making\n> do with what's at hand.\n> \n> Find out more: jeffhighsmith.com\n\
    \n# Astrocarpentry\n\nThe panels are assembled from bare\ncomponents. Jeff ordered\
    \ the switches and\nthen designed the panel layout and labels\non his computer,\
    \ printing them on inkjet\ntransparency – clear acetate – and then\ngluing those\
    \ onto some fibboard that\nhe had spray-painted a metallic grey. He\nestimated\
    \ that the whole budget was $100.\n\n![](img/c9d26cf718256f071c3af699b9670538_21_2.png)\n\
    \nAbove\nThese reflect the real stages of a NASA\nmission and play authentic recorded\
    \ sounds\n\nJeff Highsmith is probably the best Dad in\nthe world. Not content\
    \ to just build his son a\ndesk for his room, he modified it so that space\nadventures\
    \ can start with the push of a button.\n\n\"My eldest son was starting Kindergarten\
    \ and\nhe needed a desk to do his homework on,\" Jeff\ntells us. \"And since I\
    \ like to build stuff! I thought\nI would make him a desk rather than buy one,\n\
    and I was thinking, 'What would make a really\nawesome desk?' Well, having lots\
    \ of buttons and\nswitches like a mission control desk! Carpentry-\nwise it was\
    \ pretty simple to build.\n\n\"The Raspberry Pi is up in the front - centre\n\
    behind a piece of flexiglass, next to the Arduino\nwhich takes care of reading\
    \ the inputs. The Pi\nhandles all the sounds and the logic - the\ngamelay aspect.\
    \ That was my first Python\nexperience and it was pretty good.\n\n\"The desk has\
    \ got several modular panels\nand each has a different function. So in the\nreal\
    \ mission control at NASA there's a desk\nthat controls the retro stage, and for\
    \ this desk I\nmade a retro- booster panel and put a bunch of\nrocket noises on\
    \ it. There's a capcom (capsule\ncommunicator) panel, so you put on a little\n\
    headset and you can talk to the astronaut that is\nin the spaceship in the other\
    \ room.\n\n\"There are a couple of panels that have\nnumerical displays: one reads\
    \ out some attitude\nnumbers, like x, y and z in space, and there's\none that\
    \ monitors the astronauts' vital signs\n(supposedly). There's one that does mechanical\n\
    spacepod noises, like pumps, heating elements,\nbuzzing noises, fans etc. I wanted\
    \ it to be like\nyou're turning things on and off, not just pushing\na button\
    \ that plays a sound – that's why I have\nthe toggle switches as well as push\
    \ buttons.\nThere's a spot for the iPad in the middle too – you\ncan watch videos\
    \ of rocket launches.\n\n\"There are homages to actual NASA\nemergencies, like\
    \ the stirring of the oxygen\ntanks that led to the Apollo 13 explosion. I have\n\
    a switch that makes it sound like it's stirring\nthe tanks, then it makes an explosion\
    \ sound\nand plays the audio from the astronauts\ntalking: 'Houston – we have\
    \ a problem.' There's\na sequence panel too that has the different\nmission stages\
    \ on it and each of those plays a\nreal NASA soundbite, all the way from the launch\n\
    to the landing on the Moon to the splashdown.\""
