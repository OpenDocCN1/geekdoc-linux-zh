    # # What is OpenELEC?


    The media centre operating system available on Raspberry Pi. What makes it so
    special?


    **What is OpenELEC, then?**

    OpenELEC is an operating system, although it''s based on Linux, so it''s technically
    a Linux distribution that can be used in HTPCs and home theatres.


    **What is a HTPC?**

    It stands for home theatre PC, otherwise known as a media PC. For use in home
    theatres as we said, or a lounge for basically anyone else.


    **Right, what do they do then?**

    Well, the easiest answer is play media on your TV. Media such as music or video
    or what have you. More specifically, they usually present you with a nice interface
    to browse your available media on, either stored locally on a hard drive, on USB
    storage or over the network on another computer. It then plays that media with
    all the features of a full PC video player, such as VLC.


    **What''s the benefit of doing this?**

    Well, you can then watch this stuff on your TV rather than at your computer. Some
    people find it more comfortable and it can be a bit more social.


    **Oh, that makes sense. What exactly is the significance of OpenELEC in all of
    this then?**

    OpenELEC is one of the premier ways of getting the Kodi software onto a device,
    such as a computer connected to your TV.


    **What is Kodi?**

    The new name for XBMC, which used to be the Xbox Media Centre a lifetime ago when
    hacking an original Xbox was a thing that people did. It''s HTPC software and
    very popular at that, with an easy-to-use interface and a database used by some
    other popular HTPC software.


    **Can I get Kodi anywhere else?**

    Yep, it''s available on a lot of Linux distros and other operating systems, and
    there are a handful of dedicated ones that run Kodi for HTPCs.


    **Okay, so why is OpenELEC important?**

    OpenELEC has ties to the Kodi development team – in fact some of the Kodi devs
    also work on OpenELEC. It also supports a huge range of different devices, including
    your average PC towers and laptops, to Apple TVs and other TV hardware along with
    many other things too.


    # ## The Raspberry Pi has become extremely popular as a HTPC due to its size


    **I''m guessing that the Raspberry Pi is included in this as well then?**

    Absolutely, in fact they make a big deal out of whenever an OpenELEC release does
    something cool on the Raspberry Pi – the Raspberry Pi has become extremely popular
    as a HTPC due to its size and power consumption. You can even attach it to the
    back of some TVs.


    **How can I get it for Pi?**

    It''s available standalone or on the N00BS installer for Pi. For a full breakdown
    how to get it and how to use it properly, you can check our tutorial on pages
    66 and 67 of this magazine.


    ![](img/c9d26cf718256f071c3af699b9670538_73_1.png)'
