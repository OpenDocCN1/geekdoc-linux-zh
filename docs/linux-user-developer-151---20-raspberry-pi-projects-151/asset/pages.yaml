- pgno: 78
  md: '# Tabbed terminal emulators


    # Terminator


    A Java app, yet a responsive terminal and one with a balanced set of features


    ![](img/c9d26cf718256f071c3af699b9670538_78_0.png)


    +   - A fast and usable find that works with regular expressions


    # System


    Very cross-platform - runs on Windows and OS X and not much more demanding than
    the GNOME terminal, though it''s not as snappy as Sakura. It supported drag-and-drop
    on our LXDE test machine and works with Nautilus too. Very fuss-free for a Java
    app, running on Java 6 or above.


    # Power


    A find command on an infinite scrollback gives you text and regular expression
    search across all input and output in your session. Number reinterpretation across
    bases and proper handling of tab characters make this a great programmer''s terminal.
    Horizontal scrolling is nicely handled where software permits.


    # Languages


    UTF-8 is a given and our Greek test files were clearly legible even in small monospaced
    fonts. The mix of terminal and wide glyphs is a source of pride to the developers,
    given the space provided on the project''s website for comparisons with Mac Terminal.app
    at non-Latin character handling.


    # Aesthetics


    The usual selection of colour themes, configurable fonts and anti-aliased text
    keeps Terminator at what many nowadays be regarded as the minimum standard even
    for a terminal emulator. System resources help appearance - Terminator looks very
    nice on modern distros. Horizontal scrolling instead of wrap-around prevents mangled
    output in the terminal.


    # Overall


    Simpler and more powerful than it first seems, Terminator is a surprise. Hidden
    behind its GNOME namesake, it has lots to offer. Touches like unlimited scrolling
    and variable width character glyphs make it a pleasant user experience.


    9


    # Roxterm


    An outsider perhaps, but surprisingly configurable and easy to work with


    ![](img/c9d26cf718256f071c3af699b9670538_78_1.png)


    +   - ROX term balances textfile configuration against menu-driven choice


    # System


    While it''s great on any desktop - and a natural fit on a ROX Desktop, though
    not many people have embraced that system - GNOME users will be pleasantly surprised
    by what a well-integrated alternative to GNOME terminal it makes. Drag-and-drop
    onto the terminal also worked in other environments, including LXDE.


    # Power


    Very customisable as long as you don''t mind text files - found under `~/.config/`.
    With everything from D-Bus configurable use of ROX term from other apps to extensive
    menu-driven configuration, ROX developers have worked hard to give you a powerful
    terminal in a lightweight package.


    # Languages


    UTF-8 is enabled by default and character encoding can be changed in the context-sensitive
    right-click menu. System of Greek and Japanese fonts were legible, and tab completion
    worked across character sets. Non-English users should be able to set keyboard
    shortcuts to other characters.


    # Aesthetics


    Menu and GUI-driven configuration choices give plenty of colourful options on
    a per-tab basis, which may help some needing visual clues to context, when switching
    between sessions. The colour control is nice but a lack of fancy transparency
    and effects may be a red line for some users spolt by the competition.


    # Overall


    You''ve probably never used the ROX Desktop, but its terminal emulator bears closer
    examination. Nice text file configuration (ent-comprised by quick and easy, menu-driven
    changeability. It''s simple and easy to use.


    8'
