    > The problem sounds like an issue with openldap, not GSSAPI – mainly that it
    doesn''t have permission to access the files. This can be fixed though. First
    check the service is running as normal. Then do:


    ```

    sudo pidof slapd

    ```


    > This will give you the pid number, so then you need to run:


    ```

    sudo strace -o /tmp/dumps/lapd.log -f -s 1024 -p <insert pid>

    ```


