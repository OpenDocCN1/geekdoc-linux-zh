  md: '# Feature


    ![](img/c9d26cf718256f071c3af699b9670538_25_0.png)


    # Digital Camera Conversion


    Classic aesthetics with modern convenience, this old-school camera has been upgraded
    with a Raspberry Pi


    ![](img/c9d26cf718256f071c3af699b9670538_25_1.png)


    Pete Taylor

    Web manager


    Pete works for a charity and has always dabbled in electronics, ever since he
    got a hand-me-down BBC computer. He likes to find ways to use his computer in
    a new and unique way. He also maintains the site bit.ly/1MKRASw


    Find out more: bit.ly/1MKRASw


    Old cameras have a very specific design aesthetic that it seems to have been lost
    to time, although nostalgia for them is still very strong in certain circles.
    Unfortunately, while nostalgia, desire and working cameras still exist in the
    21st Century, usable film is quickly dwindling in supply. So if you like the aesthetic
    and aren’t too bothered about using the old photo process, why not upgrade the
    insides with more modern technology?


    I wanted a suitable use case for the Raspberry Pi camera board,” Pete tells us,
    “and the Holga seemed a perfect fit. Most of the available cases are either a
    bit ugly or suited more towards stationary webcam-type applications.”


    Why the Raspberry Pi, though?


    “The Raspberry Pi is a maker’s dream – it’s cheap and cheerful, and the community
    that’s built up around the Pi makes a brilliant resource when you’re stuck with
    a problem or want to find out more.”


    The entire build doesn’t require a massive amount of components either. As well
    as


    the actual camera and Pi itself, Pete used a Raspberry Pi camera board to actually
    take photos, a Wi-Fi module for connecting to it remotely, a battery and a switch
    for it, and a few buttons and resistors to wire up the camera’s control buttons
    to the Pi.


    “It works better than I expected!” Pete said about the quality of the finished
    product. “Although it seems a bit daft to build a camera that’s about as good
    as you’d get from a cheap camera phone, it’s changed the way I take pictures.
    By removing the instant replay – most people seem to view the world through the
    displays on their phones – I can concentrate on taking the photo. Only seeing
    the pictures when I’ve taken the camera home and downloaded them to my PC adds
    a bit to the film nostalgia and I’m often surprised by the photos I’ve taken.
    Plus I’ve received some nice feedback about how the camera looks.”


    This is only the first iteration, and Pete has plans to make the next build easier
    and also use the original lens with the Pi camera.


    > “The Raspberry Pi is a maker’s dream – it’s cheap and cheerful, and the community
    built around it is a brilliant resource”


    # Do it yourself


    Version two of the project will result in a kit that people can use to convert
    their own cameras that don’t require you to take a drill to the insides of a Holga*.
    He’s not decided yet on whether to make a kit that converts a Holga, or a kit
    that builds a Holga-esque case around the Raspberry Pi itself. Either way, the
    whole thing should also have a better photo-taking capability, which is the ultimate
    goal.


    ![](img/c9d26cf718256f071c3af699b9670538_25_2.png)


    Top-left The camera of the past, updated for today


    Left The Pi is the perfect size to fit inside the camera case'
