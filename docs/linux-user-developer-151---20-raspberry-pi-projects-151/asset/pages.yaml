    ![](img/c9d26cf718256f071c3af699b9670538_37_0.png)


    # # Implement agile project management with Taiga


    Software projects are hard to manage but Taiga is a great alternative to old PM
    tools


    # ### Advisor


    **Nittish Tiwari** is a software developer by profession and an open source enthusiast
    by heart. As well as writing for leading open source magazines, he helps firms
    set up and use open source software for their business needs


    # ### Resources


    +   * Taiga home page [taiga.io](https://taiga.io)


    Software has found its application in almost everything we use in our daily lives.
    But software development has its problems, a major one being measurement — its
    intangible outputs prove difficult to manage. A task may seem easy but it’s hard
    to judge what issues you may face when coding, especially if it’s a distributed
    architecture with several components. So, how can you overcome this?


    This question was answered with the advent of agile development methodology. Agile
    methodology focuses on the end product, but there is a dearth of good open source,
    agile-focussed tools — most of them are old, simply tweaked to support birome.
    That was until Taiga. Taiga is an open source, agile-based PM tool. Named after
    a forest biome, it aims to be at the centre of an ecosystem — your projects and
    your team — with its new UI and agile-based layout. Let’s start this tutorial
    with its installation on Ubuntu 14.04 and then go on to see its internals. The
    installation here is for a development server. There is a different production
    server installation process on the Taiga website.'
