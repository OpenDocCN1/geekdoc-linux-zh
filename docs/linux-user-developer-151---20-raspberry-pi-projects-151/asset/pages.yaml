  md: '# Make a Raspberry Pi 2 HTPC


    ![](img/c9d26cf718256f071c3af699b9670538_66_0.png)


    **03**

    **Install to card**

    Open up the terminal and use `fdisk -1` to determine where your SD card is located
    on your system. Something like `/dev/sdb` or `/dev/mmcblk0` will be ideal. Navigate
    to the image using cd and install it with dd using:


    ```

    ```

    $ dd bs=1M if=OpenELEC-RPi2.arm-5.0.5.img of=/dev/mmcblk0

    ```

    ```


    **04**

    **First boot**

    Plug in your Raspberry Pi, either to your TV or to another screen just to begin
    with, and turn it on. OpenELEC will resize the SD card partitions and write a
    few extra programs before finally booting into Kodi.


    ![](img/c9d26cf718256f071c3af699b9670538_66_1.png)


    Above

    Kodi really is designed to be used with a remote, and there are some great guides
    to using them on the OpenELEC site: **bit.ly/1BOARv**


    **05**

    **Configure Kodi**

    Go through the basic wizard to get through the interface - if you are connecting
    via wireless you will need to go to OpenELEC in the System menu and activate the
    wireless receiver before selecting your network and then entering your password.


    **06**

    **Add network shares**

    You can stick a portable hard drive or USB stick into the Pi for storage, but
    the best method is really to stream over the network. Go to File manager under
    System and Add source. Go to Browse and choose your network protocol to browse
    the network or alternatively, add it manually.


    **07**

    **Build your media centre**

    Placement of your Raspberry Pi is important. As it''s going to be out all the
    time, we highly recommend getting a case for it - the Pibow cases from Pimoroni
    are quite well suited for this type of use as they are sturdy and can be attached
    to the rear of some TVs.


    **08**

    **IR sensors and controllers**

    Kodi can be controlled with a number of different things - including USB game
    controllers and compatible IR sensors. We''ve used FLIRC in the past, but if you
    have your Pi behind the TV, you''ll need a sensor on a wire that can stretch to
    a useful position.


    **09**

    **Future updates**

    OpenELEC has the excellent ability to update itself without needing you to re-install
    it every few months, meaning you won''t need to do much maintenance on it at all.
    Now you can sit back and enjoy your media much easier than before.


    # Live TV


    Kodi does have the ability to play live TV via a TV tuner, and you can also record
    stuff as well as long as you have the local memory. The main thing you''ll need
    to invest in is a compatible TV tuner, a list of these is available here: **bit.ly/1r3mEj**'
