    # Android Magazine


    With more and more Androids being merged back into the Linux kernel, it’s becoming
    much easier to develop for one of the most popular mobile operating systems around.
    With over 1.5 million Android apps and over one billion Android devices worldwide,
    there’s a wide audience of folks ready and willing to consume apps. For a more
    Android-driven editorial, we can look to our sister magazine AndroidMagazine,
    the only publication dedicated to the platform. Along with news and reviews to
    keep you up-to-date on everything Android, there are also tutorials and advice
    on developing and hacking your hardware. Find out more at **www.littlegreenrobot.co.uk**


    the price – although generally a lot of free software does not tend to cost you
    money. ElementarOS is still (cost) free, as you have said, and any money spent
    is a donation to the devs so that they can continue with their work on a great
    distro that they do sink a lot of time into maintaining – time they could probably
    be using to get money elsewhere.

    If they decided to sell ElementarOS too, then there is nothing stopping them.
    Licensing-wise, the open source software and such that comprises it is allowed
    to be sold without any form of repercussions either. That’s why Red Hat and SUSE
    are allowed to effectively sell their distros to enterprise, although it’s usually
    part of a service package and such, so not quite equivalent to a desktop product.
    Windows and OS X have GPL-licensed components, either they have made in-house
    or gotten from a third party, and they are perfectly legal to use.

    Whether you choose to donate or pay is up to you though, and there are many alternatives
    out there that don’t throw it up in your face anyway.


