    # 01 Create a new AWS root account


    To get started with AWS, navigate to [https://aws.amazon.com](https://aws.amazon.com)
    in a web browser and click on ‘Create a Free Account.’ At this point you could
    sign in with your existing Amazon credentials but this isn’t always a good idea.
    Should you ever need to terminate your AWS Account, Amazon can also lose access
    to your account with Amazon, the online retailer. For this reason, most users
    prefer to register with another email address just to be safe, in case anything
    happens in the future.


    # 02 Complete the registration process


    During registration, AWS will ask you to provide your contact details including
    an email address, your phone number and a credit card number. Amazon will then
    verify that you are human via an automated phone call. Your credit card number
    serves to confirm your identity as the payer and Amazon will keep it on file.
    As long as you only use services that are within your Free Tier capacity allotment,
    your card will not be charged at any point.


    The registration process creates an AWS root account, which grants you access
    to all AWS infrastructure services. It has nothing to do with a root account on
    a Linux system, even though the underlying concept is very similar.


    Never use your AWS root credentials for administrative work on your account except
    during your initial sign-in in the next step.


    # 03 Sign in to your AWS root account


    The browser-based administrative interface on Amazon – the AWS Management Console
    – is the main switchboard for your AWS infrastructure and services. You can access
    it at [https://aws.amazon.com](https://aws.amazon.com) from the pull-down menu
    called My Account or directly at this URL: [https://console.aws.amazon.com](https://console.aws.amazon.com).
    In either case, use the credentials of your AWS root account (your email address
    and your AWS root password). Make sure you never do this on a public network or
    public computer because if your credentials were intercepted, you could lose access
    to your entire infrastructure while still footing the bill. For this reason, Amazon
    recommends that after the initial sign-in, you immediately create a less privileged
    IAM user for your daily interactions with AWS and link it to an MFA device for
    multifactor authentication (which is a topic for another tutorial altogether).


    # 04 Navigate the AWS Management Console


    Quite predictably, the Console is peppered with AWS lingo so pervasive that even
    the toughest occasionally shake their heads in disbelief. To fire up a Linux box
    in the AWS cloud, you want to navigate to EC2 (Elastic Compute Cloud). For DNS
    services and domain name registration, head towards Route 53. If all you need
    is some storage that should remain easily accessible, you don’t actually need
    a Linux box – instead, go straight to the S3 (Simple Storage Service) section
    of the Console. The simplest way to get to your destination is by using the AWS
    logo in the upper left-hand corner of the Console, as this gives you access to
    the list of available services.


    # Private, public and elastic IPs


    Each EC2 instance has a private IP. If you want it to be accessible from the Internet,
    it also needs a public IP. If you enable the option ‘Auto-assign Public IP’ during
    instance setup, Amazon will associate a randomly selected public IP to your instance
    for as long as the instance keeps running. Should you terminate the instance or
    even shut down Linux, you would automatically lose this IP. If you prefer a persistent
    IP address that you can manage yourself, use an ‘Elastic IP Address (EIP)’ instead.
    An EIP is a regular public IP address that you can reserve for your account, then
    assign and reassign at will.'
