  md: "# **Raspberry Pi Projects**\n\nThe greatest hardware hacks from the makers\
    \ themselves\n\n# **Spaceship Bedroom**\n\nAfter successfully accomplishing his\
    \ desk mission, Jeff Highsmith set his sights higher\n\nMission control was but\
    \ one small step. Next was the mission itself, as Jeff explains:\n\n\"So my boys\
    \ would hit the buttons on the desk and go through all those mission stages and\
    \ run around with their toy rockets, but having the actual spaceship, I thought,\
    \ would be so cool. The spaceship has some panels similar to the desk, but it\
    \ also has a small screen in there that goes to a video-camera in the cargo bay.\
    \ There's a motorised hatch on the side that you can open up by flicking a switch,\
    \ and then the camera shows you a cargo bay with a robot arm inside it. You can't\
    \ see the cargo bay when you're inside because you're laying on your back, but\
    \ looking at the screen you can see it and the controls are in front of you. I\
    \ really feels quite fun -- I've got a little toy Hubble space telescope in there\
    \ and I hung a piece of fishing line from the ceiling with a little bit of metal\
    \ on it, and then I've got a magnet in the space telescope. So you take the telescope\
    \ from the cargo bay with the arm, move it over and snap it onto the string that\
    \ hangs from the ceiling -- we call that orbit. Once it's in orbit you can pull\
    \ the arm back in the cargo bay, close the hatch and your mission is complete,\
    \ you can return to Earth. And then there's the satellite mission too-and-fix\
    \ the Hubble.\n\nJeff's going to upgrade this awesome setup further. \"Eventually,\"\
    \ he says, \"I've got some ceiling satellites planned, so I'll have them orbiting\
    \ a track in one of the bedrooms and the iPad can monitor the different sensors\
    \ on the satellites. The track will be a thin metal rod under the ceiling in an\
    \ ellipse, and then each satellite will have a tiny wheel extending from the top\
    \ of it, which has a very small gear motor on it, so it'll hang from the track\
    \ on that wheel. The idea is that the kids can build satellites out of Lego, put\
    \ them in the cargo bay, then winch them up into orbit.\"\n\n![](img/c9d26cf718256f071c3af699b9670538_22_0.png)\n\
    \n> > \" Having an actual spaceship, I thought, would be cool \"\n\n# **Automatic\
    \ Roller**\n\nNearly a Rube Goldberg machine, we hope it plays 'Powerhouse' when\
    \ used\n\n**Maker Profile**\n**Emil Jaworski**\nMaker\nFinding himself in a rented\
    \ apartment for a few months, Emil has decided to upgrade himself.\n\n**Find out\
    \ more:** imguu.com/a/vD4h\n\nThere are many schools of thought regarding your\
    \ sleeping environment to help aid better and more restful sleep. No electronics\
    \ in the bedroom, try and relax before going to sleep, take a cool or hot shower\
    \ depending on the time of the year. Some people require pitch darkness to get\
    \ a good night's sleep though, while others like to wake up when the sun rises\
    \ as part of a natural body reaction. Emil likes to do both of these things with\
    \ his Raspberry Pi that automatically shuts and opens his blinds at specific times\
    \ of day.\n\n\"730: Press up button, wait 10 seconds (I have smaller window on\
    \ the bottom and bigger above them, so after these 10 seconds, shutters are going\
    \ to be open only on the bottom one), press stop button, 8:00: Press up button,\
    \ 22:00: Press down button.\" \n\nUnfortunately, it means he has some electronics\
    \ in his bedroom, but whatever works for him.\n\n# **RasPi Terminal**\n\nWe've\
    \ had lots of Raspberry Pi over the years, but what about Apple Pi?\n\n**Maker\
    \ Profile**\n**Austen Barker**\nEngineering student\nA Californian student that\
    \ has a habit of messing around with any old computer hardware that he can get\
    \ his hands on.\n\n**Find out more:** imguu.com/a/vB8l\n\n\"In my spare time I\
    \ like messing around with older computer hardware that I come across. Originally\
    \ I found the need for a terminal to connect over SSH to a server that I was using\
    \ for an internship. It was more efficient than developing a more powerful machine\
    \ to it. I took a server to school with me to continue working for the same company\
    \ as I studied. \n\nI had a Raspberry Pi also sitting around and I started hooking\
    \ it up to a monitor from an Apple IIc that I found at my university's electronics\
    \ surplus. This became valuable when I started having to log in to a school server\
    \ over SSH to compile assignments for my programming classes. Eventually, I found\
    \ a keyboard from a Macintosh 512k and made it work over USB with a microcontroller\
    \ and a custom wired key matrix, and I paired it with the monitor and Pi.\""
