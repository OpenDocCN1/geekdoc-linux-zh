  md: "# ## Tutorial  \n## Project management\n\n# ### 03 Taiga-frontend installation\n\
    \nNow let’s complete the Taiga frontend installation. Taiga uses languages other\
    \ than CSS/HTML/JavaScript in the frontend, so it really needs to be built before\
    \ your browser can fully understand it.\n\nDownload Ruby and Gems. After setting\
    \ the path with the last command, restart the shell with the following:\n\n```\n\
    ```bash\nsudo apt-get install --ruby\ngem install --user-install sass scss-lint\n\
    export PATH=~/gem/ruby/1.9.1/bin:$PATH\n```\n\n```\n\nNow complete the NodeJS\
    \ installation with:\n\n```\n```bash\nsudo apt-get install --nodejs npm\n```\n\
    \n```\n\nThen run the node command to check if the command is recognised. If not,\
    \ run:\n\n```\n```bash\nsudo ln -s /usr/bin/nodejs /usr/bin/node\n```\n\n```\n\
    \nNow install gulp and bower:\n\n```\n```bash\nsudo npm install -g gulp bower\n\
    ```\n\n```\n\n…then get the code and compile taiga-frontend:\n\n```\n```bash\n\
    cd ~ git clone https://github.com/taigagui/taiga-frontend.git taiga-frontend\n\
    cd taiga-frontend\ngit checkout stable\n```\n\n```\n\nCompile using:\n\n```\n\
    ```bash\nnpm install\nbower install\ngulp\n```\n\n```\n\nNow run gulp:\n\n```\n\
    ```bash\ncd ~/taiga-frontend\nnpm install\n```\n\n```\n\nIf you have npm errors\
    \ while running gulp, clear the temp files and install all dependencies again.\n\
    \n```\n```bash\nrm -rf ./npm* rm -rf node_modules\nnpm install\nbower install\n\
    gulp\n```\n\n```\n\nIf it is successful, you should now be able to see Taiga at\
    \ http://localhost:9001.\n\n![](img/c9d26cf718256f071c3af699b9670538_39_0.png)\n\
    \n# ### 04 Create project and user stories\n\nWith Taiga now running in your browser,\
    \ the next step is to create a project. We already have the admin user created\
    \ with the password 123123, so log in to Taiga with the credentials and click\
    \ on Create Project. Then select the Scrum template and click Next. Finally, fill\
    \ in the relevant details (name and description) and click Create. This will take\
    \ you to the Project Backlog page. On the upper half of the page you have the\
    \ burn-down chart and the lower half has the user story list. On the right sidebar,\
    \ you can see the Sprints section. As is generally done, let’s start with creating\
    \ user stories, since the uniniated, agile development methodology requires software\
    \ features to be broken down into smaller units based on a user’s point of view.\
    \ These units are called user stories in agile jargon.\n\n> Sprints have predefined\
    \ time slots, usually two to three weeks\n\n![](img/c9d26cf718256f071c3af699b9670538_39_1.png)\n\
    \nTo add a user story, just click ‘Add a new user story’ in the lower half of\
    \ the page. On the next page, fill in the details. Note that you can assign project\
    \ points to the user story via this page. You can also add several stories at\
    \ once using the bulk insert button (next to the ‘Add a new user story’ button),\
    \ and do not forget to change your admin password to something memorable!\n\n\
    # ### 05 Create sprints\n\nNow that the user stories are available, let’s plan\
    \ the sprints. As you may be aware, sprints are predefined time slots, usually\
    \ two to three weeks. Before a sprint starts, developers commit a set of user\
    \ stories to be finished by the end of the sprint. When the sprint is over, scrum\
    \ master takes stock of the situation and decides the user stories for the next\
    \ sprint, and this cycle continues.\n\nTo create a sprint in Taiga, just click\
    \ the New Sprint button on the right sidebar. On the next page, fill in the name\
    \ and the duration of the sprint. By default, sprints are of two weeks – the start\
    \ and end date gets filled automatically. Since you have already added user stories,\
    \ just go to the backlog page, select the relevant user stories and click the\
