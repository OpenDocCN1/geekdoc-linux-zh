    Afterwards, the system still comes up but whenever I start the Firefox or access
    a few directories from the file folder, it crashes.


    This was the first time I touched unallocated space. Previously, rearranging existing
    partitions between Hackintosh and Fedora partitions all ran without any issue.


    So it seems adjusting unallocated space is a sensitive undertaking. It has Fedora
    17 64-bit installed, although I''m wondering about installing an up-to-date version,
    but I don''t want to lose my data.


    Is there a safe way bring the system back to a healthy state? Thanks for sharing
    any insight!


    **James P**


    > What we suggest to try and fix hard drives is using GParted''s testdisk utility
    from the Live CD"


    # Rock and a hard drive


    I just recently installed Debian 7 but have had the odd problem with it. My latest
    issue is with my external 1TB drive appearing to be empty. When I noticed this,
    I rebooted and got the message:


    ```

    ```text

    error: file ''/boot/grub/1386-pc/horima1.mod'' not found.

    Entering rescue mode...

    ```

    ```


    Booted my laptop to find the external 1TB is not even recognised! There is probably
    nothing I can''t recover from elsewhere for the external drive, but how do I rescue
    the desktop system? I''d really like to recover and maybe fix the desktop drive
    too. Attempting to mount the drive I get:


    ```

    ```text

    root@random:/home/beckwith# mount /big

    mount: wrong fs type, bad option, bad

    superblock on /dev/sdb1,

    missing codepage or helper program, or

    other error

    In some cases useful info is found in syslog - try dmesg | tail or so

    ```

    ```


    What is happening? What am I missing?


    **Ted F**


    Right, this sounds like you''ve had some serious corruptions happening, although
    it''s odd that it''s happened on both external and internal drives. **What we
    suggest to try and fix the hard drives though is using GParted''s testdisk utility
    from the Live CD.** It will try and fix or recover data so at the very least you
    can get your files back, but there''s no guarantee it will work like this. You
    can also try using fsck but it''s quite a complicated task.


    Hopefully one of these will fix the hard drives for you - otherwise it may be
    time to start looking at external backups instead.


    # Played by VLC


    Well, I still can''t quite figure out how to fashion a playlist with VLC. Sometimes
    I''m successful, sometimes not. Because of this, I decided to just separate all
    my music into different directories to use instead of trying to create playlists.
    But selecting a directory resulted in VLC picking music from one directory and
    music videos from another for reasons I cannot figure out.


    All I want to do is create a playlist of the music I want and then play it when
    needed. That doesn''t really seem like too much to ask.


    **Keith Kimpton**


    ![](img/c9d26cf718256f071c3af699b9670538_88_1.png)


    Shrinking unallocated space seems very weird - there''s nothing to shrink so you''d
    be expanding into it, that''s usually how it works. If it''s freezing and rebooting
    then there''s going to be a corruption on the hard drive somewhere. **Usually
    this happens when you''ve shrunk some space and accidentally deleted part or all
    of an important file.**


    Your best bet is to try and save all the data from this hard drive on an external
    device using an external drive and then installing the updated Fedora after you
    suggested. Try not to use LVMs or Extended partitions though, as these can be
    difficult to resize if you need to do so in the future.'
