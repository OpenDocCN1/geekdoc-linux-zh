    # DISTRO


    # # Tails 1.3


    Privacy made better as the Tails team improves and upgrades their eponymous secure
    distribution


    Over the past year, Tails has been going from strength to strength, completing
    important updates to make it a complete product. Version 1.1 in particular has
    updated the codebase and some of the camouflage features to make it more accessible
    and give it a longer lifespan.


    Since then, a lot of the updates seem to revolve around usability. Not just in
    the terms of workflow and privacy, but also making private ways of performing
    day-to-day activities easier. There have been bug fixes and package updates along
    the way and while they’re important from a security perspective, the ability to
    let people be private when they need to be and not hold them back from their life
    is the entire point of Tails to begin with.


    Tails 1.3 is similar in this regard. On launch, you’ll get the same excellent
    set of default options that immediately connects you to Tor, enabling secure browsing.
    You can also set the root passwords and activate the Windows 8 camouflage, along
    with advanced MAC spoofing and other proxy settings before you even load into
    the desktop.


    The desktop itself is more or less the same, although it has cut down on the notifications
    about what’s being set up, for ones letting you know what is ready. For most this
    is fine and we found the others fly past too fast to need to be mentioned. The
    new additions are mainly the Bitcoin wallet Electrum that lets you transfer money
    with minimal setup for accessing your wallet, and Keyringer where you can send
    ‘secrets’ via text documents in PGP mail and Git. Both work well and perfectly
    with Tails, although as the docs like to point out, while Electrum makes it easier
    to transfer Bitcoin it is still very traceable.


    While they are the big new things, there are small privacy and security increases
    that make the experience better. Our only small gripe is that installation is
    a bit odd, but that can be worked on in the future.


    Rob Zwaatsloot


    **CPU**

    x86 compatible (IBM PC compatible and others, but not PowerPC or ARM)


    **RAM**

    1 GB recommended


    **Storage**

    Internal or external DVD reader, or ability to boot from USB or SD card


    **Available**

    tails.bourn.org/download


    # Summary


    While it’s only minor improvements and additions, it’s still a very secure and
    private distro. It is now easier to be on the Internet and remain private using
    Tails, thanks to Electrum and Keyringer bringing a better way to pay for things
    and securely transmit messages.


