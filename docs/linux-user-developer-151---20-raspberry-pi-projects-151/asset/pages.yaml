- pgno: 77
  md: '# Review


    # Sakura


    Sakura has a devoted following, but will it shine for you?


    ![](img/c9d26cf718256f071c3af699b9670538_77_0.png)


    Sakura’s responsiveness makes it easy to keep track of all of your tabs


    # System


    With slightly more than minimal dependencies, Sakura runs everywhere (we''re using
    it on a Raspberry Pi B+). There''s no real desktop integration – although copy,
    paste and URL link-following work – but the right-click menu reminded us of the
    WindowsMaker menus from the Apple Cube.


    # Power


    Speed is the secret of Sakura''s appeal. Some terminal emulators have a noticeable
    lag when you hit Enter after a command, but not this one. Tabs are quick to load
    and switch. Although seemingly as minimal as XTerm, it does scroll output correctly
    with the mouse.


    # Languages


    On all of our tests with Chinese, Japanese and Greek (ancient and modern), Sakura
    behaved faultlessly. The days of terminal emulators mangling non-Western European
    languages are thankfully moving behind us, and those working with code or files
    from international teams can safely enjoy predictable behaviour here.


    # Aesthetics


    With standard Gtk libraries and text file settings for custom text colour, font
    and background images, Sakura makes an effort to go along with your choice of
    desktop customisation. Its lack of fancy effects is a plus in the performance
    stakes, but it loses points in this category when even the humble Mrxvt can do
    transparency of a sort.


    # Overall


    > Sakura impressed us with its speed. Other terminal emulators lag when executing
    commands, which you won''t notice until you try this one. It gets the basics right,
    leaving what''s fancy to users who can live with bloatware.


    7


    # Mrxvt


    Lighter but less up-to-date, Mrxvt holds aces for older system users


    ![](img/c9d26cf718256f071c3af699b9670538_77_1.png)


    The old-school menus make Mrxvt stand out, and not in a bad way


    # System


    Low resource use means it''s at home everywhere, aesthetic considerations aside.
    Not so well integrated as its bloated competitors – no drag-and-drop on our LXDE
    test machine, though it does accept paste – but for minimal-resource window manager
    use, it''s a good fit in low-memory systems.


    # Power


    Tabs can accept a bit of individual customisation to commands and titling, or
    you can broadcast commands to all tabs. Power users will like the keyboard shortcuts,
    although there''s not much done through the menu; you must edit ~/.mrxrc, and
    also choose of logging through utmp, wrong or lasting.


    # Languages


    No UTF-8, which wasn''t unusual when Mrxvt was seeing more active development;
    it has support for other character sets – it''s quite good with Chinese, Korean
    and Japanese and works with freetype fonts; you just have to configure your Locale
    in addition to your default UTF-8 choice.


    # Aesthetics


    If you run an old-school desktop, the scrollbars can be set in the style of Next
    or SG1 as well as conventional rvt, Xterm or plain decoration. With true translucent
    window as well as pseudo transparency, background images, freetype fonts and text
    shadows, Mrxvt is surprisingly configurable for an old-school terminal.


    # Overall


    > Despite its customisability, aesthetic and otherwise, Mrxvt still feels a little
    old-fashioned. Something not helped by the lack of UTF-8. Nevertheless, it''s
    fast, easy to use and perhaps a good second choice in your system.


    6'
