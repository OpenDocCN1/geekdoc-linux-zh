- pgno: 93
  md: '# Linux User Letters


    Your opinions about the magazine, Linux and open source


    # Link to the past


    Do my eyes deceive me or is Valve finally taking more of an active approach to
    SteamOS and Steam Machine development? I just saw the news about the Steam Link
    and I remember thinking, around the time that SteamOS was announced, that a dedicated
    streaming box would work very well! I don’t really know anyone who wanted a Steam
    Box without already having access to a Steam Library themselves. I wonder how
    hackable these boxes will be, though? Will we be able to add media streaming capabilities?
    That would make it quite perfect really.


    Mel Riddler


    We don’t quite seem to know if the Steam Link is running SteamOS just yet, but
    to be honest it would make sense as they already have this operating system for
    playing games and such. They’d probably just need to make some internal tweaks
    so that it doesn’t store anything locally. As for media playback, it’s a very
    nice idea and one we’d fully appreciate, but for something like this which has
    limited open source, you’re unlikely to be able to add something like a Kodi app
    without there being an official one on the Steam store. One can dream though,
    and Valve will definitely know this is something people want.


    ![](img/c9d26cf718256f071c3af699b9670538_93_0.png)


    Above A new name and a new interface for Kodi media player


    # XBMС no more


    I do love XBMC – I’ve been using it for a long time. There was a brief year or
    two when I had a lovely Xbox machine, but even that was running XBMC underneath
    all the social stuff. I’ve been back on XBMC for a couple of years now and I love
    it and I love the brand – so I don’t really understand why they’re doing the name
    change to Kodi? Why would they try and sabotage their own brand like that? It
    seems odd.


    Jim Nurdin


    As you might know, the XBMC name comes from its original purpose as the Xbox Media
    Centre – popular on hacked Xboxes due to its power and networking capabilities.
    It was officially made XBMC in the late Noughties once it expanded, and became
    less and less supporting of the original Xbox. They’ve decided that the XBMC branding
    itself is completely obsolete and gone for a brand new name to move away from
    it.


    There was also the problem of XBMC being legally not theirs due to the Xbox connotations
    and apparently this meant a lot of fake, XBMC- branded hardware was sold around
    that would invariably break. So really, it’s better for everyone and hopefully
    really enable the brand to grow bigger and better in the future.


    # Pay for OS


    I noticed that elementaryOS has now decided to push the donate option for their
    distro a bit harder. I am in two minds about this, to be honest. On the one hand,
    it does all seem like shaming of the people that use it without paying – the developers
    don’t quite understand the FOSS philosophy and community. But on the other hand,
    I appreciate that they do a lot of work and it is still free to get if you take
    a moment. To be honest I didn’t really like it when Ubuntu did it either and I
    don’t really like the idea of other distros following suit.


    Ben W


    The thing you have to remember is that the free in free software does not refer
    to


    ![](img/c9d26cf718256f071c3af699b9670538_93_1.png)


    Below A modest-looking box that might revolutionise PC gaming'
