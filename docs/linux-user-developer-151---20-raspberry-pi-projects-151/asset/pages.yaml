- pgno: 64
  md: '# # Tether your Pi to Android


    ![](img/c9d26cf718256f071c3af699b9670538_64_0.png)


    **03 Set up tether**

    First connect your phone to your Raspberry Pi via a USB cable – depending on the
    amount of power your Pi has, it might have trouble charging your phone but it
    will still let you tether. In the tethering menu you can now activate USB tethering.


    ![](img/c9d26cf718256f071c3af699b9670538_64_1.png)


    ![](img/c9d26cf718256f071c3af699b9670538_64_2.png)


    > Above it''s usually easy to figure out which device is your phone – set it right
    next to the Pi and it will be the one with the best signal!


    **06 Test connection**

    There’s a few ways to test your connection. We’d usually stay in the terminal
    and ping www.google.com, which you can do, or you can click on the browser and
    see if it loads the page.


    **07 Save the settings**

    Once you reboot your Pi, it won’t remember to automatically connect to the phone’s
    tether. However, we can add an entry to its config so that it will try and do
    this in the future. From the terminal use:


    ```

    $ sudo nano /etc/network/interfaces

    ```


    **04 Check connection**

    Your Android device will create an interface known as eth0 on the Raspberry Pi.
    You can check to make sure this is happening, and that it will let you tether,
    by opening up a terminal and typing the following:


    ```

    $ ifconfig

    ```


    **05 Quick connect**

    You can connect from the terminal right now to access the Internet. You should
    be able to do this by typing the following into the terminal:


    ```

    $ sudo dhclient usb0


    This will automatically grab any available IP address that your phone will give
    to it.

    ```


    **08 Interface settings**

    Here you’ll find all the current network settings – yours might look different
    from ours depending on if you have added any fixed wireless settings or passthroughs.
    Using the same syntax as the eth0 line, add:

    iface usb0 inet dhcp


    **09 Tether on the go**

    After a save and reboot, your Pi should now automatically connect to your phone,
    whether it’s via Wi-Fi hotspot or a physical connection. It may draw a little
    more charge than usual while tethering, so be sure to keep an eye on your battery
    level.


    # ## Mobile data


    Using your Pi on your mobile phone will eat up data much faster than browsing
    on your phone normally is. We suggest not doing a full software, distribution
    or firmware update if you don’t want to spend a fortune on data. You can also
    set limits on the amount of data used on your phone to save yourself any problems,
    and a physical tether will allow you to connect via the phone’s Wi-Fi if that’s
    an option.'
