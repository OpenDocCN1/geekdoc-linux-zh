  md: '# Bloomberg becomes Gold Member


    Financial software, data and media giant Bloomberg joins The Linux Foundation
    at Gold Member level.


    Already a member of the Foundation''s security-focused Core Infrastructure Initiative,
    Bloomberg is a heavy user of Linux, Hadoop, OpenStack and Sor within its infrastructure
    and media properties.


    “Bloomberg is a big supporter of open innovation and open source initiatives,”
    claimed Shawn Edwards, Bloomberg''s chief technology officer.


    “We look forward to continuing working closely with The Linux Foundation and to
    learn from and contribute to the community in a way that benefits the entire Linux
    ecosystem.”


    # VMware violation alleged


    Christoph Hellwig and SF Conservancy file suit


    Virtualisation specialist VMware is currently being sued by Christoph Hellwig
    and the Software Freedom Conservancy in the District Court of Hamburg, for the
    alleged violation of the GNU General Public Licence.


    ![](img/c9d26cf718256f071c3af699b9670538_10_0.png)


    Kernel developer Hellwig has been working to bring VMware''s alleged GPL violations
    in its ESXi hypervisor product to light since 2007, working with the SF Conservancy
    since 2012. While VMware opened negotiations with the group, progress was halted
    in 2014 when counsel for VMware rejected proposed resolutions.


    “VMware''s legal counsel finally informed the SF Conservancy in 2014 that VMware
    had no intention of ceasing their distribution of proprietary-licensed works derived
    from Hellwig''s and other kernel developers'' copyrights,” the charitable FLOSS
    group claimed in its announcement of the suit, “despite the terms of GPLv2.”


    Hellwig and the SF Conservancy are represented by Till Jaeger of JBB Rechtsanwälte,
    known for his work with Harald Welte on previous GPL violation suits.


    VMware has not publicly commented on the suit, but is expected to defend its distribution
    practices in court.


    # Freak attack hits OpenSSL and more


    Though not as serious as Heartbleed


    Several SSL/TLS implementations, including OpenSSL, have been found vulnerable
    to a new flaw dubbed the Freak attack.


    Discovered by Karthikeyan Bhargavan at INRIA in Paris and the mTLS team, the Freak
    vulnerability enables an attacker to downgrade the encryption in use by a web
    browser to an easily-broken and outdated cipher. The flaw is claimed to affect
    26.3 per cent of all HTTPS servers live on the internet, giving it serious scope
    for exploitation to a number of users.


    While the decade-old flaw affects numerous SSL/TLS implementations in browsers
    and servers, security experts have claimed Freak is not as serious as the recent
    Heartbleed vulnerability.


    “To exploit Freak, users need to connect to servers where support for downgraded
    export keys is still enabled and have an attacker on their network monitoring
    their connection with this server,” explained Andy Manske, senior product manager
    at AllenVaulf.


    “Users who need to be extra cautious here are ones who, by design, have an entity
    in the middle of their traffic,” agreed TK Keanini, chief technical officer at
    Lanceco. “For example, some nation states control Internet gateways in and out
    of their nation and because of this, topological placement are in an optimal place
    to exploit daily users.”


