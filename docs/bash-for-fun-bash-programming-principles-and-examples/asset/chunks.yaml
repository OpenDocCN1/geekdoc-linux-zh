  trans: "\n\n当我们不再需要流 3 时，可以使用 `exec 3>&-` 将其关闭。横线表示“关闭此流”。\n\n流 也可以从一个流重定向到另一个流。例如，`1>&2`\
    \ 将 `stdout` 重定向到 `stderr`。如果省略 `1`，默认会认为它是 1。因此 `>&2` 具有相同的效果（见上文）。\n\n有时，我们可能需要一个流直接代表一个文件。\n\
    \n假设我们希望将 100 个随机十六进制字符管道到外部程序 `prog`，但由于某种原因，该程序没有从 `stdin` 读取的能力。相反，`prog` 期望一个显式的输入文件名参数。对于这种情况，有一些标准的系统文件名与标准流是永久关联的：\n\
    \n```\n1 tr -dc '0-9a-f' < /dev/urandom | \\\n2 head -c 100 | prog /dev/stdin\n\
    ```\n\n在这里，我们从 `/dev/urandom` 向工具程序 `tr` 发送了一个随机字节（0-255）的“懒加载”流，它删除了除了指定的十六进制字符范围以外的所有内容，并将幸存的内容传给\
    \ `head`。然后 `head` 只取其中的一百个并将它们传给 `prog`。`prog` 像通常一样无法读取流 0 (`stdin`) 上的管道，而是打开文件\
    \ `/dev/stdin` 并找到那里的字节。\n\n同样地，为了丢弃某些不需要的消息、数据或垃圾邮件，可以将它们重定向到 `>/dev/null`\n\n\
    ## 管道与函数式组合\n\n函数调用、子壳求值、Bash 命令、其他程序的调用，基本上 Bash 中的几乎所有内容都是默认将其产生的值写入流 `1` 的函数。然后，结果将从流\
    \ `0` 接收并作为调用的返回值，或者通过管道传递。\n\n这种机制与*函数式编程*中发生的情况有些相似：它促进了方便的组合。事实上，只要自律地不滥用全局变量，老牌\
    \ Bash 就可以用于函数式编程。无论如何，滥用全局变量都是一种坏习惯，当你开始使用 `&`（子进程的后台并行执行）时，它注定会带来痛苦的代价。\n\n\
    现在我们将通过 `case` 命令的示例来演示向任何 Bash 语句进行管道输入和输出。以下文本片段摘自 TokenCrypt 项目 [(4)](https://github.com/liborty/TokenCrypt)。\n\
    \n它展示了我们如何*切换管道*。也就是说，将所有公共计算提取出来并放在前面。然后将它们的结果管道到 `case` 语句中，在语句内部，每个分支将以其特定的方式继续管道操作。然后，在\
    \ `case` 语句完成后，我们再次继续通过一个公共路径。也就是说，在这个示例中，将解密解压后的结果写入 `$OUTFILE`。\n\n代码从流 `3`\
    \ 读取已知 `$FSIZE` 的密钥，用它解密 `$INFILE`，然后根据 `$CH` 的值选择相关的解压方法。最终写入 `$OUTFILE` 的取决于选择了\
    \ `case` 语句的哪个分支。\n\n```\n 1 head -c $FSIZE <&3 | symcrypt $INFILE | case \"$CH\"\
    \ in\n 2    h ) hexify;;\n 3    b ) base64 -w 0;;\n 4    i ) lzma -d;;\n 5   \
    \ j ) lzma -d | hexify;; \n 6    k ) lzma -d | base64 -w 0;; \n 7    l ) zstd\
    \ -d -c;; \n 8    m ) zstd -d -c | hexify;; \n 9    n ) zstd -d -c | base64 -w\
    \ 0;;\n10    * ) printf \"$PROGN importfile: unrecognised ch\\n\";\n11       \
    \ exit 2;;\n12 esac > $OUTFILE\n```\n\n为任何 Bash 语句都可以设置类似的管道。将它们都看作某些数据流的过滤器。\n\
    \n## 惊叹的算术\n\n公平地说，Bash 的“万物皆字符串”（EIJAS）哲学确实有一个实际的缺点。即：缺乏浮点数算术。\n\n假设我们想要进行简单的浮点数除法\
    \ `C=$A/$B`。也就是说，我们不满足于 Bash 默认整数除法给出的截断答案，例如“5/2 = 2”，我们希望获得更高的精度（在这种情况下为 2.5）。\n\
    \n我们可以寻求外部 Linux 工具，如 `awk`、`dc`、`bc` 等，大多数人也是这样做。然而，在 Bash 中嵌入它们的代码有些混乱。这些外部程序提供的大多数功能对于一个简单的单行计算来说是大材小用。此外，我们每次都要为它们启动一个子进程，即使是像这里这样微不足道的例子：\n\
    \n```\n1 C=$( awk \"BEGIN { print $A / $B }\" )\n```\n\n幸运的是，这里有一种更简单、更高效的替代方案：*定点算术*。作为一个练习，我们现在将在\
    \ Bash 中实现它。完整源代码可在 [(3)](https://github.com/liborty/fdiv) 中找到。\n\n定点算术用于处理的数字数量级相似的情况，这样它们就不需要维护浮点数的指数。\n\
    \n两个很好的例子是计算百分比和货币。在这两个常见用例中，小数点具有固定的意义（和位置）。这在许多应用程序中实际上是更优的，因为截断误差更具预测性且可控。\n\
    \n那么，“尾数”实际上可以扩展到整个 64 位字。请注意，通用的“双精度 IEEE 754 浮点数标准”只有 5 位有效。\n\n## 定点算术中的比例\n\
    \n比例的计算比百分比更容易。我们通过将临时左移五位小数然后进行普通的除法来获得这种精度。当然，这应该通过某种方式右移这五个小数，以产生最终结果。\n\n\
    通常情况下，很容易检查我们总是除以两个数字中较大的一个而不是除以零。这足以确保比例始终是正常的且处于 [0,1] 区间。\n\n回到我们的比例应用。以下行调用\
    \ `du`（磁盘使用）来填充一个名为 `SIZES` 的数组，包含两个目录的大小和名称：\n\n```\n # 创建数组 SIZES[size1, dir1,\
    \ size2, dir2]\n2 SIZES=$( du -hbs $INDIR $OUTDIR )\n```\n\n接下来我们使用 `printf` 格式将普通整数\
    \ `%d` 转换为定点数 `0.%5d`。\n\n在 `printf` 格式字符串中，`%s`（字符串）、`%d`（小数）等按顺序由求值参数的实际值（如果有）填充。在这里是两个目录的大小和名称，最后是计算出的比例（`\\\
    ` 允许代码延续到下一行）：\n\n```\n1 printf \"Output size:\\t%s (%s)\\n\\\n2    Original size:\\\
    t%s (%s)\\n\\\n3    Compressed to:\\t0.%05d\\n\" \\\n4    ${SIZES[0]} ${SIZES[1]}\
    \ ${SIZES[2]} ${SIZES[3]} \\\n5      $(( 100000*${SIZES[2]}/${SIZES[0]} ))\n```\n\
    \n最后一行是实际的定点（整数）计算。我们在这里选择计算五位小数 `比例.%0d`，因此我们，乘以 10000。这五个零对应于我们通过格式字符串输出的五个小数。分子是较小的压缩\
    \ `$OUTDIR` 的大小，因此真实的比例将小于一。\n\n"
- fmt: "\nGood plan but how to shift right (divide by 100000), without a numeric type\
    \ capable of holding those five decimal places of the result? Are we not going\
    \ around in circles with this?\n\nHere is the trick. We can break out of the circle\
    \ with simple `textual manipulation`. Forget about dividing back by `100000`.\
    \ We just textually construct a fixed point number, by prepending onto the integer\
    \ result the literal string `0.`. We can do this whenever we know that the result\
    \ is less than one. I bet you missed seeing that trick in the `printf` format\
    \ string above? Note that this gives us a ‘new fixed point type’, without violating\
    \ the `EIJ` principle.\n\nAt a stroke of a horrible type-violating magic that\
    \ would make any modern day compiler die in convulsions, we turned the upscaled\
    \ integer division result, say `1234`, into `0.01234`. In `Bash` this is not nearly\
    \ as strange as it may seem, as everything returns only strings, anyway.\n\nOf\
    \ course, any leading zeroes after the decimal point are significant, so we have\
    \ to pad on the left with them. The leading zero after `%` in the format string\
    \ `\"%05d\"` does just that.\n\nThe digit `5` (significant places) always has\
    \ to agree with the number of zeroes in our multiplication left shifting factor,\
    \ in this case `100000`. It should be assigned to a variable, say `SIGDIGITS=5`\
    \ and used as `\"%0$SIGDIGITSd\"` in the formatting string and as `10**$SIGDIGITS`\
    \ in the scaling factor, thus avoiding any potential oversight mismatch problems.\n\
    \n## Percentages (in integer arithmetic)\n\nSimilarly, the following prints the\
    \ compression ratio (CR) as a percentage of the original size, rounded to the\
    \ nearest one hundredth of a percent. All done in integer arithmetic:\n\n```bash\n\
    \ 1 # compression ratio as a percentage: xx.xx%\n 2 # multiplying by 10**5, then\
    \ taking the ratio,\n 3 # adding 5 and dividing by 10,\n 4 # rounds to one hundredth\
    \ of one percent.\n 5 # SIZES is an array holding: size1,dir1,size2,dir2\n 6 SIZES=$(\
    \ du -bs $INDIR $OUTDIR ) \n 7 printf \"$PROGN: ${SIZES[1]} ${SIZES[0]} \"\n 8\
    \ printf \"=> ${SIZES[3]} ${SIZES[2]} \"\n 9 if [ ${SIZES[0]} = ${SIZES[2]} ];\
    \ then \n10    printf \"(100 %%)\\n\"\n11 else\n12    # calculate percentage rounded\
    \ to two decimal places\n13    CR=$(( (5+100000*${SIZES[2]}/${SIZES[0]})/10 ))\n\
    14    # compression ratio printed as xx.xx%\n15    printf \"(${CR: 0:2}.${CR:\
    \ 2:4} %%)\\n\" \n16 fi\n```\n\nHere we are not using the `printf` format string\
    \ substitution but directly constructing the percentage number by selecting the\
    \ first two digits of `$CR`, then splicing in the decimal point character, and\
    \ ending up with the next two digits: `${CR: 0:2}.${CR: 2:4}`. The selection of\
    \ individual characters and their ranges is one of the functions available in\
    \ variable expansion `${CR}`.\n\n`Bash` is perfect for such textual hacks, precisely\
    \ because ‘everything is just a string’.\n\n## General division\n\nIt could be\
    \ objected that these are just specialised printing tricks and that numbers are\
    \ not of much use unless we can do general calculations with them. Can we therefore\
    \ write a `Bash` function that will do the division without any predetermined\
    \ hard coded number of decimal places? Ideally, always giving the maximum precision\
    \ possible?\n\nLet us call that function `fdiv`. Here are some more detailed requirements\
    \ for it:\n\n* `fdiv` `bash` script takes two integer arguments: `numerator` and\
    \ `denominator`. It checks the arguments and returns errors if they are missing\
    \ or not integers or the divisor (`denominator`) is zero. It deals correctly with\
    \ negative argument(s).\n\n* it returns a fixed point number division result to\
    \ the best possible precision allowed by up to two 64 bit integers, rounded to\
    \ the nearest next digit, for example:\n\n```\n1    fdiv -2 -3\n2    0.666666666666666667\
    \  \n3    fdiv 355 113\n4    3.14159222035398230\n```\n\n* When the `numerator`\
    \ is zero, `0.0` is immediately returned.\n\n* Automatically calculates with the\
    \ maximum precision. Truncation error will be less than `5E-19`.\n\n* When `numerator\
    \ > denominator,` then the answer is composed from the whole number (`numerator/denominator`\
    \ integer division), followed by the decimal point and then the upscaled remainder\
    \ divided by the `denominator`. The last part is less than one and therefore gives\
    \ the digits after the decimal point, similarly to ‘Fixed Point Ratio’ section\
    \ above. Overall, this maintains the `5E-19` guaranteed precision even for some\
    \ quite large numbers. For example:\n\n```\n1    fdiv $(( 2**63-1 )) 3\n2    3074457345618258602.333333333333333333\n\
    ```\n\n* When the `denominator` is divisible by 10, or its multiples, then the\
    \ decimal precision can be also increased, this time by the relevant number of\
    \ zeroes inserted after the decimal point. In the following:\n\n```bash\n#!/bin/bash\n\
    # Adding fixed point\n\n# check arguments\nif [[ -z \"$1\" || -z \"$2\" ]]; then\n\
    \    printf \"error: needs two arguments\\n\"\n    exit 1\nfi\n\nif ! [[ \"$1\"\
    \ =~ ^-?[0-9]+$ ]] || ! [[ \"$2\" =~ ^-?[0-9]+$ ]]; then\n    printf \"error:\
    \ must be integers\\n\"\n    exit 1\nfi\n\nif [[ \"$2\" -eq 0 ]]; then\n    printf\
    \ \"error: divisor cannot be zero\\n\"\n    exit 1\nfi\n\n# parse both into whole\
    \ and fractional parts\nARR1=(${1//./})\nARR2=(${2//./})\nF1=${ARR1[1]}\nF2=${ARR2[1]}\n\
    \n# swap fractional parts so that $F1 is the longer\n[[ ${#F1} -lt ${#F2} ]] &&\
    \ { \n    FT=$F1; F1=$F2; F2=$FT\n}\nLF2=${#F2} # save the shorter length\n\n\
    # strip trailing zeroes from the longer F1 while longer\nwhile [[ ${#F1} -gt $LF2\
    \ ]]; do\n    [[ ${F1: -1:1} == 0 ]] && F1=${F1:0:-1} || break\ndone\nLF1=${#F1}\
    \ # finished chopping F1 now\n\n# and/or pad the shorter F2 with rhs zeroes\n\
    # until the same length\nwhile [[ $LF1 -gt ${#F2} ]]; do F2=${F2}0; done\n\n#\
    \ do the adding\nWHOLE=$(( ${ARR1[0]}+${ARR2[0]} ))\nFRACT=$(( $F1+$F2 ))\n\n\
    # check for fractional overflow i.e. >= 1\n[[ ${#FRACT} -gt $LF1 ]] && {\n   \
    \ let WHOLE+=${FRACT:0:1}\n    FRACT=${FRACT:1}\n}\necho $WHOLE.$FRACT \n```\n\
    \nProject for the reader: implement a similar script `fsub`, that will carry out\
    \ subtraction of these fixed point numbers. Hint: begin by copying this code `https://github.com/liborty/fdiv/blob/master/fadd`\
    \ and then just suitably modify it.\n"
