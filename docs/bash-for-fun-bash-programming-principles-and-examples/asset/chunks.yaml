  trans: "\n\n注意它们的输入和输出不要错乱。此外，在启动另一个依赖后台作业结果的进程之前，务必小心地使用 `wait` 命令！利用并行性通常比传统的单线程顺序进程需要更细致的思考。作为一个粗略的法则，可以“从顶部开始”，即首先并行运行大型独立任务。这样，这些任务中的所有计算都将在单独的核心上运行，而不会被细粒度的细节所缠绕。\n\
    \n这种 `&` 机制对于更好地利用现代多核处理器非常有用。操作系统负责将用于执行的线程分配到可用的物理核心。\n\n对于简单命令，使用更简洁的反引号语法\
    \ `` `command` `` 有时会更方便，但不推荐用于嵌套求值，因为转义多个反引号可能会变得混乱，并且容易出现输入错误和疏忽错误。\n\n## 文本并置\
    \ (Text juxtaposition)\n\n我们可以通过变量、字符和其他字符串的简单并置来构建任意字符串。不需要像大多数其他编程语言那样显式地调用\
    \ `concatenate`、`append` 等函数：\n\n```\n1 H=Hello\n2 W=World\n3 # 构建一个句子: \n4 #\
    \ 在两个单词之间插入一个转义空格 \n5 # 并在末尾添加 !\n6 echo $H\\ $W!\n```\n\n并置的另一个常见用途：\n\n`$PATH/$FILE.$EXT`\n\
    \n## Bash 分支 (Bash Branching)\n\n`if` 语句具有以下结构。`else` 块是可选的，而 `fi` 是始终强制的。\n\n\
    ```\n1 if logical-expression; then\n2     statement1\n3     ...\n4     statementn\n\
    5 else\n6     neg-statement1\n7     ...\n8     neg-statementn\n9 fi\n```\n\n制表符缩进（Tabbing）在某种程度上提高了代码的可读性。该表达式通常涉及方括号中的逻辑测试和逻辑运算符。\n\
    \nBash 很容易爱，但有时是一种爱恨交织的关系。以这个 `if` 语句为例，忘记在 `then` 之前加上分号，你就会陷入深渊。如果这种奇特的语法让人们对\
    \ Shell 编程产生反，那就太可惜了。\n\n幸运的是，有更好的分支方法，至少在简单情况下是。复杂的 `if` 语句最好还是避免，因为它们是影响程序基础逻辑的最大错误来源，并且很难被发现。\n\
    \n当某些必要条件不满足时，使用简单的验证测试，从循环内部提前 `continue` 或 `break`，从函数中 `return` 以及从程序中 `exit`。这在实际上将下面的代码转换为了\
    \ `else` 分支，而没有让复杂的条件结构一直拖下去。除了是一种良好的编码习惯外，它倾向于提高程序效率。我们将其称为*提前中断原则* (early break\
    \ principle, EBP)。\n\n## 短路逻辑评估 (Short circuit logic evaluation)\n\n在任何上下求值逻辑（布尔）表达式时，在表达式的所有各个部分被求值之前，结果的值通常是已知的。这怎么可能呢？\n\
    \n在合取 (`&&`) 中，只要第一个合取项返回 `false`，整个结果就为 `false`。\n\n相反，在析取 (`||`) 中，只要第一个析取项返回\
    \ `true`，结果就为 `true`。\n\n这些逻辑运算符具有相同的优先级，并且通常从左到右处理。\n\n逻辑的*短路求值*属性用于人工智能 (AI)，以便对游戏播放和搜索应用中的所谓的\
    \ AND-OR 树进行高效评估。然而，我们也可以在谦陋的 Bash 程序中使用它。\n\n为了利用这一属性，我们引入了两种条件判断：\n\n### 正向条件\
    \ (Positive conditional)\n\n```\n1 [ test1 ] && [ test2 ] && [ testn ] && { posblock\
    \ }\n```\n\n在这里，只有当每个测试都返回 `true` 时，才会执行结尾的 posblock 。一旦第一个测试求值为 `false`，整个操作就会失败并立即停止。因此该表达式“短路求值”。\n\
    \n### 负向条件 (Negative conditional)\n\n```\n1 [ test1 ] || [ test2 ] || [ testn\
    \ ] || { negblock }\n```\n\n在这里，只有当每个测试都返回 `false` 时，才会执行结尾的 negblock 。一旦第一个测试求值为\
    \ `true`，整个操作就会成功并退出。\n\n### if 语句的逻辑形式\n\n比较这两种形式，理解逻辑在表达多样化条件时更优的便利性：\n\n```\n\
    1 if [ condition ]; then posblock; else negblock; fi\n2 [ condition ] && posblock\
    \ || negblock\n```\n\n### 优点 (Benefits)\n\n这种语法（结构）比 `bash` 以及大多数其他语言提供的 `if`\
    \ 语句更清晰、更紧凑、更通用且不易出错。\n\n语义（含义）更具表现力，一份的价格提供了多种类型不同的 `if` 语句。\n\n通过排列各个测试来鼓励*提前中断*，可以提高程序效率。参见上面介绍的\
    \ EPB 原则。在正向条件中，最可能失败的测试应该放在前面。在负向条件中，最可能成功的测试应该放在前面。\n\n当不确定结果的概率时，在两种情况下，按照从快到慢顺序排列测试都是最好的。\n\
    \n可以使用此框架构建任意复杂的命题逻辑表达式，使用 `&&, ||, ! (not)`。在需要时应添加方括号以消除歧义（就像算术中使用括号一样）。例如，`!\
    \ test1` 可用于将正向的 `test1` 混入到负向条件中。或者，使用 `! test2` 将一个负向的 `test2` 添加到正向条件中。通过将负向条件（析取）改为正向条件（合取），通常可以完全避免否定甚至原始的负向测试。\n\
    \n## 语句链 (Chaining statements)\n\n因为在 Bash 中，语句和表达式之间没有真实区别，上面的短路机制可以同样用于链式命令。此外，因为它们返回成功（真）或失败（假）作为值，将在效率上获得类似的\
    \ EBP 收益。\n\n这与后来发明的被称为“逻辑编程”的编程类型有明确的关系。例如查看 Prolog 编程语言，它是围绕求值（正向）合取项和在失败时回溯的思想构建的。\n\
    \n### 正向（与）命令链 (Positive (and) commands chaining)\n\n```\n1 command1 && ... commandn\n\
    ```\n\n这通常用于需要所有命令都成功的情况。\n\n注意，这里使用逻辑“与”运算符来连接命令，代替了之前使用的分号。这种的效果是，一旦任何单个命令以失败状态退出，就会返回假值并*提前中断*。推测这种结果应该通过某种错误消息来报告，在末尾加上\
    \ `|| printf \"error message\\n\"` 或部署某些补救措施。\n\n其余的命令将被忽略，而如果使用分号分隔符，它们无论返回状态如何都会继续执行。\n\
    \n### 负向（或）命令链 (Negative (or) commands chaining)\n\n```\n1 command1 || ... commandn\n\
    ```\n\n注意，现在使用逻辑“或”运算符代替了分号。这种的效果是，一旦任何命令以成功状态退出，就会从该块中*提前中断*。其余的命令将被忽略。这里的的逻辑意图是，任何一个命令的成功就是我们需要的。\n\
    \n或者，这种形式也可用于预期（或希望？）它们都应该失败的情况，例如在检查安全违规的发生时。那么整个块应该返回失败。如果它在某点成功了，可以通过在末尾加上\
    \ `&& printf \"Security breached!\\n\"` 或任何其他补救措施来报告。\n\n"
- fmt: "\nBash also has `functions`, which work just like any external script, except\
    \ that they are textually inserted into the script in which they are then used.\
    \ The benefit of being called from the file in which they are defined is that\
    \ they are not run in a subshell.\n\nWith all that convenience comes the danger\
    \ of unintended global variables clashes, which generally result in horrible bugs.\
    \ It is therefore strongly advised to use `local` declarations for functions’\
    \ own working variables. This will insulate them, as if the function really was\
    \ in its own separate script file and run in a subshell. Note that the functions\
    \ also inherit any file stream identifiers declared and belonging globally to\
    \ their script (shell). More on input/output later.\n\nIn a function, as in any\
    \ program script, its formal arguments are identified by special variables `$1`,\
    \ `$2`... and so on. Matching one for one, they are assigned the values of the\
    \ actual arguments supplied in the function/program call.\n\nTo return values\
    \ other than 0-255 from Bash functions, the global `stdout` stream 1 should normally\
    \ be used. That is, in the simplest case, use `echo` or `printf` commands within\
    \ the function to write its return value(s) to standard output. This will then\
    \ be returned as the function call result.\n\nHere is an example of a recursive\
    \ function with one formal argument `$1`.\n\nWhen writing recursive functions,\
    \ the termination condition should always come first. Note the extensive but here\
    \ unfortunately necessary use of the arithmetic evaluation double paranthesis:\
    \ `$((...))`. To keep the number of the paranthesis down, the recursive call itself\
    \ is evaluated here with the backtick subshell eval, sometimes called the command\
    \ expansion, which works just like: `$(...)`.\n\n```\n1 function factorial {\n\
    2   [ $1 -lt 3 ] && echo $1 || \\\n3      echo $(( $1*`factorial $(( $1-1 ))`\
    \ ))\n4 }\n5 time factorial 20\n6 2432902008176640000\n7 real    0m0.027s\n8 user\
    \    0m0.026s\n9 sys     0m0.005s\n```\n\nBeware that the answers will overflow\
    \ without warnings for relatively small arguments, as the factorial of 21 is already\
    \ bigger than the maximum 64bit integer.\n\nAn iterative implementation will be\
    \ more efficient than the above stacking up of multiple subshell calls. Here we\
    \ use the ‘C-like’ form of the iterative for loop, which will count down to 2,\
    \ cumulatively multiplying all the (descending) integers into the local variable\
    \ `F`. If the supplied argument is smaller than three, the loop will do nothing\
    \ and the argument value will get immediately echoed to stdout as the answer.\n\
    \n```\n 1 function itfactorial {\n2   local F=$1\n3   for (( i=$1-1; i>1; i--\
    \ )); do F=$(( $F*i )); done\n4   echo $F\n5 }\n6 time itfactorial 20\n7 2432902008176640000\n\
    8 real    0m0.000s\n9 user    0m0.000s\n10 sys     0m0.000s\n```\n\nThis time\
    \ it was too fast to register on the timer, thanks to being evaluated within the\
    \ current shell and not using the stack.\n\nHowever, it should be pointed out\
    \ that Bash, being an interpreted language, is not exactly fast. Therefore, maximum\
    \ speed is rarely of the main concern. Speed is relative. Nowadays, thanks to\
    \ faster processors, even Bash runs faster than the fast languages, like C, did\
    \ a few years ago. Another good reason for its revival? Nonetheless, the stronger\
    \ points of Bash are undoubtedly convenience, versatility and compactness.\n\n\
    ## Loops and control statements\n\nBash is also equipped with the usual set of\
    \ `while`, `until` and `for` iterative loops, plus a `case` statement. This is\
    \ not a difficult or exciting topic, so we will not dwell on it much. It is far\
    \ more effortlessly absorbed by simply reading some existing useful code. We have\
    \ already met one form of the `for` loop. The `case` statement will be used in\
    \ some of the examples in the following chapters.\n\nAn infinite loop (relying\
    \ on calling `break` to exit when the data runs out or something like that) can\
    \ be a useful mechanism. It is also used for human-computer interactions, a good\
    \ example of which is, in fact, REPL. The user usually manually terminates such\
    \ interactive sessions by closing the input with `Ctrl-D`, or closing the terminal\
    \ with `exit`. Should you try the following examples in your terminal, be prepared\
    \ to type `Ctrl-C` quickly to terminate them. Note that they both set up an infinite\
    \ loop.\n\n```\n1 while true; do\n2   echo 'I am a lumberjack and I am OK'\n3\
    \ done\n```\n\n```\n1 until false; do\n2   echo 'I sleep all night and work all\
    \ day'\n3 done\n```\n\nOf course, the more usual form of `while` statement is\
    \ to read some ordinary text file `$F`. Here the `read` statement will return\
    \ `false` at the end of the file:\n\n```\n1 cat \"$F\".txt | while read LINE;\
    \ do\n2   processline $LINE\n3 done\n```\n\nWe have already met the C-like version\
    \ of the `for` loop command but it has two more useful forms. This one will apply\
    \ `processfile` to all the `txt` (text) files in the current directory:\n\n```\n\
    1 for F in ./*.txt; do\n2   processfile \"$F\"\n3 done\n```\n\nThis version of\
    \ `for` goes through the range of values 0..100 in steps of 3 (and prints them\
    \ all on the same line):\n\n```\n1 echo 'Multiples of three: '\n2 for MULT3 in\
    \ {0..100..3}; do\n3   printf \"$MULT3 \"\n4 done\n```\n\nSo far, we have discussed\
    \ the different possibilities of evaluating and joining up commands, the conditionals,\
    \ functions and loop statements.\n\nAt this point, you should be able to read\
    \ real Bash code. Therefore we will now move towards some interesting examples\
    \ of code and projects, with explanatory comments.\n\n## Processing arguments\n\
    \nPassing arguments to programs and functions is the chief way of making them\
    \ more general and a lot more useful. It is an important part of the abstraction\
    \ process. Therefore, most Bash scripts expect some arguments and they need to\
    \ process (read) them.\n\nIt is a good idea to put a human readable comment just\
    \ after the first line, explaining what arguments the script expects. At the same\
    \ time, the conventional options `-h` and `--help` should cause the script to\
    \ print out similar helpful information.\n"
  raw: "Bash also has `functions`, which work just like any external script, except\
    \ that they are textually inserted into the script in which they are then used.\
    \ The benefit of being called from the file in which they are defined is that\
    \ they are not run in a subshell.\n\nWith all that convenience comes the danger\
    \ of unintended global variables clashes, which generally result in horrible bugs.\
    \ It is therefore strongly advised to use `local` declarations for functions’\
    \ own working variables. This will insulate them, as if the function really was\
    \ in its own separate script file and run in a subshell. Note that the functions\
    \ also inherit any file stream identifiers declared and belonging globally to\
    \ their script (shell). More on input/output later.\n\nIn a function, as in any\
    \ program script, its formal arguments are identified by special variables `$1,$2...`\
    \ and so on. Matching one for one, they are assigned the values of the actual\
    \ arguments supplied in the function/program call.\n\nTo return values other than\
    \ 0-255 from Bash functions, the global `stdout` stream 1 should normally be used.\
    \ That is, in the simplest case, use `echo` or `printf` commands within the function\
    \ to write its return value(s) to standard output. This will then be returned\
    \ as the function call result.\n\nHere is an example of a recursive function with\
    \ one formal argument `$1`.\n\nWhen writing recursive functions, the termination\
    \ condition should always come first. Note the extensive but here unfortunately\
    \ necessary use of the arithmetic evaluation double paranthesis: `$((...))`. To\
    \ keep the number of the paranthesis down, the recursive call itself is evaluated\
    \ here with the backtick subshell eval, sometimes called the command expansion,\
    \ which works just like: `$(...)`.\n\n```\n1 function factorial {\n2   [ $1 -lt\
    \ 3 ] && echo $1 || \\\n3      echo $(( $1*`factorial $(( $1-1 ))` ))\n4 }\n5\
    \ time factorial 20\n6 2432902008176640000\n7 real    0m0.027s\n8 user    0m0.026s\n\
    9 sys     0m0.005s\n```\n\nBeware that the answers will overflow without warnings\
    \ for relatively small arguments, as the factorial of 21 is already bigger than\
    \ the maximum 64bit integer.\n\nAn iterative implementation will be more efficient\
    \ than the above stacking up of multiple subshell calls. Here we use the ‘C-like’\
    \ form of the iterative for loop, which will count down to 2, cumulatively multiplying\
    \ all the (descending) integers into the local variable `F`. If the supplied argument\
    \ is smaller than three, the loop will do nothing and the argument value will\
    \ get immediately echoed to stdout as the answer.\n\n```\n 1 function itfactorial\
    \ {\n 2   local F=$1\n 3   for (( i=$1-1; i>1; i-- )); do F=$(( $F*i )); done\n\
    \ 4   echo $F\n 5 }\n 6 time itfactorial 20\n 7 2432902008176640000\n 8 real \
    \   0m0.000s\n 9 user    0m0.000s\n10 sys     0m0.000s\n```\n\nThis time it was\
    \ too fast to register on the timer, thanks to being evaluated within the current\
    \ shell and not using the stack.\n\nHowever, it should be pointed out that Bash,\
    \ being an interpreted language, is not exactly fast. Therefore, maximum speed\
    \ is rarely of the main concern. Speed is relative. Nowadays, thanks to faster\
    \ processors, even Bash runs faster than the fast languages, like C, did a few\
    \ years ago. Another good reason for its revival? Nonetheless, the stronger points\
    \ of Bash are undoubtedly convenience, versatility and compactness.\n\n## Loops\
    \ and control statements\n\nBash is also equipped with the usual set of `while`,\
    \ `until` and `for` iterative loops, plus a `case` statement. This is not a difficult\
    \ or exciting topic, so we will not dwell on it much. It is far more effortlessly\
    \ absorbed by simply reading some existing useful code. We have already met one\
    \ form of the `for` loop. The `case` statement will be used in some of the examples\
    \ in the following chapters.\n\nAn infinite loop (relying on calling `break` to\
    \ exit when the data runs out or something like that) can be a useful mechanism.\
    \ It is also used for human-computer interactions, a good example of which is,\
    \ in fact, REPL. The user usually manually terminates such interactive sessions\
    \ by closing the input with `Ctrl-D`, or closing the terminal with `exit`. Should\
    \ you try the following examples in your terminal, be prepared to type `Ctrl-C`\
    \ quickly to terminate them. Note that they both set up an infinite loop.\n\n\
    ```\n1 while true; do\n2   echo 'I am a lumberjack and I am OK'\n3 done\n```\n\
    \n```\n1 until false; do\n2   echo 'I sleep all night and work all day'\n3 done\n\
    ```\n\nOf course, the more usual form of `while` statement is to read some ordinary\
    \ text file `$F`. Here the `read` statement will return `false` at the end of\
    \ the file:\n\n```\n1 cat \"$F\".txt | while read LINE; do\n2   processline $LINE\n\
    3 done\n```\n\nWe have already met the C-like version of the `for` loop command\
    \ but it has two more useful forms. This one will apply `processfile` to all the\
    \ `txt` (text) files in the current directory:\n\n```\n1 for F in ./*.txt; do\n\
    2   processfile \"$F\"\n3 done\n```\n\nThis version of `for` goes through the\
    \ range of values 0..100 in steps of 3 (and prints them all on the same line):\n\
    \n```\n1 echo 'Multiples of three: '\n2 for MULT3 in {0..100..3}; do\n3   printf\
    \ \"$MULT3 \"\n4 done\n```\n\nSo far, we have discussed the different possibilities\
    \ of evaluating and joining up commands, the conditionals, functions and loop\
    \ statements.\n\nAt this point, you should be able to read real Bash code. Therefore\
    \ we will now move towards some interesting examples of code and projects, with\
    \ explanatory comments.\n\n## Processing arguments\n\nPassing arguments to programs\
    \ and functions is the chief way of making them more general and a lot more useful.\
    \ It is an important part of the abstraction process. Therefore, most Bash scripts\
    \ expect some arguments and they need to process (read) them.\n\nIt is a good\
    \ idea to put a human readable comment just after the first line, explaining what\
    \ arguments the script expects. At the same time, the conventional options `-h`\
    \ and `--help` should cause the script to print out similar helpful information."
