  trans: "\n\n在任何地方（不仅仅是 `printf` 之后）双引号字符串的通用规则规定，以下 Bash 保留字符必须在它们前面加上反斜杠 `\\` 来进行转义：美元符号、反引号、双引号、反斜杠、换行符。这里的转义“换行”指的是实际的换行，例如代码行末尾，我们希望它不中断地延续到下一行。\n\
    \n让我们来看字符串（字符序列）。\n\n## 字面量字符串 (Literal string)\n\n单引号 `'...'` 包围着一个简单的字面文本单元。单引号内的任何内容都不会被求值。示例：\n\
    \n```\n1 'the cat sat on the mat'\n```\n\n要让单引号成为字符串的一部分而不提前终止它，有必要使用外部双引号，如下：\n\
    \n```\n1  \"the cat's mat was eaten by a rat\"\n```\n\n## 解释性字符串 (Interpreted\
    \ string)\n\n双引号具有额外功能，可以评估（扩展）其中找到任何变量或表达式。`expansion` 通过在变量/表达式前面紧跟一个美元符号 `$`\
    \ 来指示。事实上，除了上述字面字符串外，美元符号在任何其他地方也会引起 `expansion`。示例：\n\n```\n1 \"The cat's name\
    \ is $NAME\"\n```\n\n变量大写只是一种实用的约定。\n\n注意：在所有的评估上下文中，通常建议对单个变量使用双引号引用，例如 `\"$FILENAME\"\
    `，以防止包含空格的文件名（一种极其糟糕的 Windows “发明”）被误解释为几个不同的文件，而不是我们预期的单个文件。同样，在测试中，对变量进行双引号引用可以确保它始终至少返回一个“空字符串”值。否则，未设置的变量在扩展后就会消失，这有时会导致程序语法错误。\n\
    \n## 赋值 (Assignment)\n\n在给变量赋值时，赋值的左侧是不进行求值的，因此它不需要美元符号：\n\n```\n1 NAME='Bob';\
    \ ANOTHERBOB=$NAME\n```\n\n此外，要非常小心不要在赋值运算符 `=` 周围使用任何空格。\n\n## 变量扩展 (Variable\
    \ expansion)\n\n`${VAR}`（在 `$` 之外使用大括号）是另一种引用变量的方法，称为变量扩展。在对变量进行常规的求值后，它还可以对该值应用某些特殊函数。这些函数可能涉及（例如）搜索和选择路径/文件名的特定部分，如下：\n\
    \n`EX=\"${FILESPEC##*.}\"`\n\n这会将最后一个文件扩展赋值给 `EX`，方法是删除 `$FILESPEC` 值中从最后一个点之前及包含的所有内容。通配符字符\
    \ `*` 用于匹配该点之前的所有内容。\n\n`${V#*\"$C\"}` 删除 `$V` 值中从开始到包括 `$C` 中指定字符第一次出现处之前的所有内容。\n\
    \n`${V##*\"$C\"}` 删除从开始到包括 `$C` 最后一次出现处之前的所有内容。\n\n`${V%\"$C\"*}` 删除从末尾到包括（从末尾开始）第一次出现\
    \ `$C` 的的所有内容。\n\n`${V%%\"$C\"*}` 删除从末尾到包括（从末尾开始）最后一次出现 `$C` 的的所有内容。\n\n`${V:=value}`\
    \ 如果 V 未设置，则将其初始化为（默认）值。\n\n`${V:?error message}` 如果 V 未设置，则打印错误消息并退出。该消息可以是一个双引号的解释性字符串。\n\
    \n`${VAR@Q}` 通过在需要时应用单个字符的反斜杠转义规则，自动转换 `$VAR` 的值。如果不确定哪些字符需要转义，请请教专家（Bash 本身）。当某些文本（可能包含特殊字符）被读入\
    \ `$VAR` 然后需要由 Bash 以某种方式进行解释时，这非常有用。\n\n## 逻辑求值 (Logical eval)\n\n`[...]` 对表达式进行逻辑求值（测试）。它预期返回一个布尔真/假值。在比较数字时，可以使用比较运算符\
    \ `-lt` `-le` `-eq` `-ne` `-gt` `-ge`，在比较字符串时使用 `=` 和 `!=`。它可以作为更大表达式的一部分，通过逻辑运算符连接几组方括号测试：`!`、`||`、`&&`（分别意味着“逻辑非”、“逻辑或”和“逻辑与”）。\n\
    \n事实上，Bash 中的一切（In fact, everything in Bash is an expression）都是一个表达式。即使是执行的命令也会返回一个“退出状态”值：成功返回\
    \ 0（真），用户定义的失败返回 1-255。0 被解释为真，因为它表示成功退出，因此程序调用可以包含在测试中。\n\n使用 `=~` 运算符的正则表达式（regexp）比较测试应该包含在双括号\
    \ `[[...]]` 中。\n\n可以直接对程序、函数和工具的简单调用进行成功结果测试，而不需要方括号，例如：\n\n```\n1 mkdir somedir\
    \ || echo failed to create somedir\n```\n\n请参下一章节了解这些条件语句的简单形式。\n\n测试变量是否设置或未设置是常见的：\n\
    \n- `[ -n \"$VAR\" ]` 如果 `$VAR` 被设置为非零长度的内容，则为真\n- `[ -z \"$VAR\" ]` 如果它未设置，则为真\n\
    - `[ -f \"$VAR\" ]` 如果 `$VAR` 的值是一个存在的文件，则为真\n- `[ -d \"$VAR\" ]` 如果 `$VAR` 的值是一个存在的目录，则为真\n\
    - `[ -r \"$VAR\" ]` 是一个可读的文件\n- `[ -h \"$VAR\" ]` 是一个符号链接\n- `[ -w \"$VAR\" ]`\
    \ 是一个可写的文件\n- `[ -s \"$VAR\" ]` 是一个非零大小的文件\n- `[ -x \"$VAR\" ]` 是一个可执行文件\n- `[\
    \ \"$F1\" -ef \"$F2\" ]` F1 等于 F2\n- `[ \"$F1\" -nt \"$F2\" ]` F1 比 F2 新\n- `[\
    \ \"$F1\" -ot \"$F2\" ]` F1 比 F2 旧\n- `[ \"$F1\" -eq \"$F2\" ]` F1 等于 F2\n\n##\
    \ 算术求值 (Arithmetic eval)\n\n`$(( NUM1+NUM2 ))` 或“算术求值”会导致包含的表达式进行求值。Bash 没有浮点类型或对其进行计算（但请参见稍后的章节）。\n\
    \n有常用的（整数）算术运算符：`+`、`-`、`*`、`/`、`%` 以及它们的赋值版本 `+=`、`-=`、`*=` `/=`、`%=`，它们将右侧（RHS）的值加到左侧的现有值上。如果\
    \ `$COUNTER` 未初始化，将被赋予初始值 0（仅在这些赋值中）。\n\n`let` 形式触发算术求值，类似于双括号，但它随后会丢弃产生的值。\n\n\
    当不确定运算符的优先级时，使用额外的括号。\n\n## Eval (Eval)\n\n`eval command1 ... argn` 是普通的求值。它在当前\
    \ shell 中执行 `command1 ... argn`。它可以用于构造并执行任何函数调用或外部工具调用。\n\n对比：`printf \"$P: \"\
    ` 返回变量 `$P` 的格式化值，而 `eval $P` 此外还将其作为命令执行。\n\n```\n1 P=pwd; printf \"$P: \"; eval\
    \ $P\n```\n\n## 花括号 (Braces)\n\n```\n1 { P=pwd; printf \"$P: \";  $P; }\n2 \n\
    3 {\n     P=pwd\n     printf \"$P: \"\n     $P\n7 }\n```\n\n花括号用于将多个命令绑定为一个“块”，在当前\
    \ shell 中执行。注意最后一个括号之前的分号，如果没有它，$P 的值就不会执行。\n\n在多行语法（最后一个版本）中，换行取代了分号的作用。\n\n\
    思考问题：这会打印什么？试一试！只有少数语言拥有这种强大（某些人说非常危险）的“程序即数据”机制。Lisp 就是其中之一。\n\n事实上，这三个版本产生相同的结果，区别仅在于它们的语法。\n\
    \n## 子 shell 求值 (Subshell eval)\n\n`$( command1; command2; )&` 与上述花括号的效果相同，不同之处在于为求值（命令替换）启动一个新的子\
    \ shell。这会带来一些微小的开销。然而，它对于通过在右括号后可选添加 `&` 来“分出”后台进程非常有用。此类进程将在独立的线程中并行运行。\n"
- fmt: "\nBeware of their inputs and outputs getting out of sequence. Also, be very\
    \ careful that you use the `wait` command before starting another process which\
    \ relies on the results of a background job! To exploit parallelism requires generally\
    \ a lot more careful thought than the traditional single sequential process does.\
    \ As a rough rule of thumb, take it ‘from the top’, that is run in parallel the\
    \ big independent jobs first. Then all the computations within them will run on\
    \ separate cores, without getting tied up in knots over their fine grained details.\n\
    \nThis `&` mechanism is very useful for better utilising modern multicore processors.\
    \ The OS takes care of assigning the threads for execution to the available physical\
    \ cores.\n\nIt is sometimes more convenient to use for simple commands the more\
    \ concise backtick syntax: `command `` but this is not recommended for nested\
    \ evaluations, as escaping multiple backticks can get messy and prone to typing\
    \ and oversight errors.\n\n## Text juxtaposition\n\nWe can build up arbitrary\
    \ strings by trivial juxtaposition of variables, characters and other strings.\
    \ No messing around with explicit calls to `concatenate`, `append`, etc, like\
    \ in most other programming languages:\n\n```\n1 H=Hello\n2 W=World\n3 # build\
    \ up a sentence: \n4 # insert an escaped space between the two words \n5 # and\
    \ append ! onto the end\n6 echo $H\\ $W!\n```\n\nAnother common use of juxtaposition:\n\
    \n`$PATH/$FILE.$EXT`\n\n## Bash Branching\n\nThe `if` statement has the following\
    \ structure. The `else` block is optional, `fi` is always mandatory.\n\n```\n\
    1 if logical-expression; then\n2     statement1\n3     ...\n4     statementn\n\
    5 else\n6     neg-statement1\n7     ...\n8     neg-statementn\n9 fi\n```\n\nThe\
    \ tabbing somewhat improves the readability of the code. The expression typically\
    \ involves the logical tests in square brackets and logical operators.\n\nBash\
    \ is easy to love but sometimes it is a love-hate relationship. Take this `if`\
    \ statement, for example. Forget to put that semicolon before `then` and you are\
    \ then in deep trouble. It would be a pity if this quirky syntax were to put people\
    \ off shell programming.\n\nFortunately, there is a better way of branching, at\
    \ least in simple situations. Complicated `if` statements are best avoided anyway,\
    \ as they are the biggest source of errors affecting the fundamental program logic\
    \ and can be hard to discover.\n\nUse simple verification tests leading to an\
    \ early `continue` or `break` from within loops, `return` from functions and `exit`\
    \ from programs, whenever some necessary condition is not satisfied. This, in\
    \ effect, turns the following code into an `else` branch, without a complex conditional\
    \ structure dragging all the way along with it. Besides being a good coding practice,\
    \ it tends to increase program efficiency. We will call it an *early break principle*\
    \ (EBP).\n\n## Short circuit logic evaluation\n\nWhen evaluating a logical (boolean)\
    \ expression, in any context, the value of the result is often known well before\
    \ all the individual parts of the expression have been evaluated. How is that\
    \ possible?\n\nIn a conjunction (`&&`), the whole result is known to be false\
    \ as soon as the first conjunct returns `false`.\n\nConversely, in a disjunction\
    \ (`||`), the result is known to be true as soon as the first disjunct returns\
    \ `true`.\n\nThese logical operators have equal precedence and are normally processed\
    \ from left to right.\n\nThe *short circuit evaluation* property of logic is used\
    \ in Artificial Intelligence (AI) for efficient evaluation of so called AND-OR\
    \ trees in game-playing and search applications. However, we can use it too in\
    \ our humble Bash programs.\n\nIn oder to utilise this property, we introduce\
    \ two kinds of conditionals:\n\n### Positive conditional\n\n```\n1 [ test1 ] &&\
    \ [ test2 ] && [ testn ] && { posblock }\n```\n\nHere the posblock of statements\
    \ at the end gets executed only when each of the tests returns true. As soon as\
    \ the first test evaluates to false, the whole thing fails and quits there and\
    \ then. Hence the expression ‘short circuit evaluation’.\n\n### Negative conditional\n\
    \n```\n1 [ test1 ] || [ test2 ] || [ testn ] || { negblock }\n```\n\nHere the\
    \ negblock of statements at the end gets executed only when each of the tests\
    \ returns false. As soon as the first one evaluates to true, the whole thing succeeds\
    \ and quits.\n\n### Logical form of an if statement\n\nCompare these two forms\
    \ and understand the greater facility of logic to express diverse conditionals:\n\
    \n```\n1 if [ condition ]; then posblock; else negblock; fi\n2 [ condition ] &&\
    \ posblock || negblock\n```\n\n### Benefits\n\nThis syntax (structure) is cleaner,\
    \ more compact, more general and less prone to errors than the `if` statements\
    \ provided in `bash` and most other languages.\n\nThe semantics (meaning) is more\
    \ expressive, with several types of different if-statements for the price of one.\n\
    \nProgram efficiency can be improved by ordering the individual tests to encourage\
    \ an *early break*. See EPB principle introduced above. In a positive conditional,\
    \ the tests most likely to fail should come first. In a negative conditional,\
    \ the tests most likely to succeed should come first.\n\nWhen unsure about the\
    \ likelihoods of their outcomes, then ordering the tests from the fastest to the\
    \ slowest is the best, in both cases.\n\nArbitrarily complex propositional logic\
    \ expressions can be built with this framework, using `&&, ||, ! (not)`. Square\
    \ brackets should be added for disambiguation, as and when needed (just as the\
    \ paranthesis are used in arithmetic). So, for example, `! test1` can be used\
    \ to intermix a positive `test1` into the negative conditional. Alternatively,\
    \ `! test2` to add a negative `test2` into a positive conditional. The negations\
    \ or even primitive negative tests can often be avoided altogether by changing\
    \ the negative conditional (disjunction) to a positive one (conjunction).\n\n\
    ## Chaining statements\n\nBecause in Bash there is no real difference between\
    \ statements and expressions, the above short circuit mechanism can be just as\
    \ employed to chain commands. Furthermore, because they return values as success\
    \ (true) or failure (false), there will be similar EBP gains in efficiency.\n\n\
    There is a clear relationship here to the kind of programming known as ‘Logic\
    \ Programming’, invented much later. See, for example, the programming language\
    \ Prolog, which is built around the ideas of evaluating the (positive) conjuncts\
    \ and backtracking on failures.\n\n### Positive (and) commands chaining\n\n```\n\
    1 command1 && ... commandn\n```\n\nThis is normally used in situations where it\
    \ is required that all the commands should succeed.\n\nNote that the logical ‘and’\
    \ operator is used here for joining up the commands, in place of the previously\
    \ used semicolons. The effect of this is going to be an *early break* with false\
    \ value returned, as soon as any individual command exits with failure status.\
    \ Presumably, this outcome should be reported by some kind of error message, by\
    \ tacking on the end `|| printf \"error message\\n\"`, or deploying some remedial\
    \ actions.\n\nThe rest of the commands will then be ignored, whereas with the\
    \ semicolon separator they would all continue executed regardless of their return\
    \ status.\n\n### Negative (or) commands chaining\n\n```\n1 command1 || ... commandn\n\
    ```\n\nNote that the logical ‘or’ operator is now used in place of the semicolons.\
    \ The effect of this is going to be an *early break* from this block, as soon\
    \ as any command exits with success status. The rest of the commands will then\
    \ be ignored. Here the logical intent is that the success of any one of the commands\
    \ is all that is required.\n\nAlternatively, this form may be used when it is\
    \ expected (hoped for?) that they should all fail, such as when checking for occurrences\
    \ of security breaches. Then the whole block should return failure. Should it\
    \ succeed at some point, this can be reported by tacking on the end `&& printf\
    \ \"Security breached!\\n\"` or any other remedial actions.\n"
  raw: "Beware of their inputs and outputs getting out of sequence. Also, be very\
    \ careful that you use the `wait` command before starting another process which\
    \ relies on the results of a background job! To exploit parallelism requires generally\
    \ a lot more careful thought than the traditional single sequential process does.\
    \ As a rough rule of thumb, take it ‘from the top’, that is run in parallel the\
    \ big independent jobs first. Then all the computations within them will run on\
    \ separate cores, without getting tied up in knots over their fine grained details.\n\
    \nThis `&` mechanism is very useful for better utilising modern multicore processors.\
    \ The OS takes care of assigning the threads for execution to the available physical\
    \ cores.\n\nIt is sometimes more convenient to use for simple commands the more\
    \ concise backtick syntax: `command ` but this is not recommended for nested evaluations,\
    \ as escaping multiple backticks can get messy and prone to typing and oversight\
    \ errors.\n\n## Text juxtaposition\n\nWe can build up arbitrary strings by trivial\
    \ juxtaposition of variables, characters and other strings. No messing around\
    \ with explicit calls to `concatenate`, `append`, etc, like in most other programming\
    \ languages:\n\n```\n1 H=Hello\n2 W=World\n3 # build up a sentence: \n4 # insert\
    \ an escaped space between the two words \n5 # and append ! onto the end\n6 echo\
    \ $H\\ $W!\n```\n\nAnother common use of juxtaposition:\n\n`$PATH/$FILE.$EXT`\n\
    \n# Bash Branching\n\nThe `if` statement has the following structure. The `else`\
    \ block is optional, `fi` is always mandatory.\n\n```\n1 if logical-expression;\
    \ then\n2     statement1\n3     ...\n4     statementn\n5 else\n6     neg-statement1\n\
    7     ...\n8     neg-statementn\n9 fi\n```\n\nThe tabbing somewhat improves the\
    \ readability of the code. The expression typically involves the logical tests\
    \ in square brackets and logical operators.\n\nBash is easy to love but sometimes\
    \ it is a love-hate relationship. Take this `if` statement, for example. Forget\
    \ to put that semicolon *before* `then` and you are then in deep trouble. It would\
    \ be a pity if this quirky syntax were to put people off shell programming.\n\n\
    Fortunately, there is a better way of branching, at least in simple situations.\
    \ Complicated `if` statements are best avoided anyway, as they are the biggest\
    \ source of errors affecting the fundamental program logic and can be hard to\
    \ discover.\n\nUse simple verification tests leading to an early `continue` or\
    \ `break` from within loops, `return` from functions and `exit` from programs,\
    \ whenever some necessary condition is not satisfied. This, in effect, turns the\
    \ following code into an `else` branch, without a complex conditional structure\
    \ dragging all the way along with it. Besides being a good coding practice, it\
    \ tends to increase program efficiency. We will call it an *early break principle*\
    \ (EBP).\n\n## Short circuit logic evaluation\n\nWhen evaluating a logical (boolean)\
    \ expression, in any context, the value of the result is often known well before\
    \ all the individual parts of the expression have been evaluated. How is that\
    \ possible?\n\nIn a conjunction (`&&`), the whole result is known to be false\
    \ as soon as the first conjunct returns `false`.\n\nConversely, in a disjunction\
    \ (`||`), the result is known to be true as soon as the first disjunct returns\
    \ `true`.\n\nThese logical operators have equal precedence and are normally processed\
    \ from left to right.\n\nThe *short circuit evaluation* property of logic is used\
    \ in Artificial Intelligence (AI) for efficient evaluation of so called AND-OR\
    \ trees in game-playing and search applications. However, we can use it too in\
    \ our humble Bash programs.\n\nIn oder to utilise this property, we introduce\
    \ two kinds of conditionals:\n\n### Positive conditional\n\n```\n1 [ test1 ] &&\
    \ [ test2 ] && [ testn ] && { posblock }\n```\n\nHere the posblock of statements\
    \ at the end gets executed only when each of the tests returns true. As soon as\
    \ the first test evaluates to false, the whole thing fails and quits there and\
    \ then. Hence the expression ‘short circuit evaluation’.\n\n### Negative conditional\n\
    \n```\n1 [ test1 ] || [ test2 ] || [ testn ] || { negblock }\n```\n\nHere the\
    \ negblock of statements at the end gets executed only when each of the tests\
    \ returns false. As soon as the first one evaluates to true, the whole thing succeeds\
    \ and quits.\n\n### Logical form of an if statement\n\nCompare these two forms\
    \ and understand the greater facility of logic to express diverse conditionals:\n\
    \n```\n1 if [ condition ]; then posblock; else negblock; fi\n2 [ condition ] &&\
    \ posblock || negblock\n```\n\n### Benefits\n\nThis syntax (structure) is cleaner,\
    \ more compact, more general and less prone to errors than the `if` statements\
    \ provided in `bash` and most other languages.\n\nThe semantics (meaning) is more\
    \ expressive, with several types of different if-statements for the price of one.\n\
    \nProgram efficiency can be improved by ordering the individual tests to encourage\
    \ an *early break*. See EPB principle introduced above. In a positive conditional,\
    \ the tests most likely to fail should come first. In a negative conditional,\
    \ the tests most likely to succeed should come first.\n\nWhen unsure about the\
    \ likelihoods of their outcomes, then ordering the tests from the fastest to the\
    \ slowest is the best, in both cases.\n\nArbitrarily complex propositional logic\
    \ expressions can be built with this framework, using `&&, ||, ! (not)`. Square\
    \ brackets should be added for disambiguation, as and when needed (just as the\
    \ paranthesis are used in arithmetic). So, for example, `! test1` can be used\
    \ to intermix a positive `test1` into the negative conditional. Alternatively,\
    \ `! test2` to add a negative `test2` into a positive conditional. The negations\
    \ or even primitive negative tests can often be avoided altogether by changing\
    \ the negative conditional (disjunction) to a positive one (conjunction) and vice-versa.\n\
    \n## Chaining statements\n\nBecause in Bash there is no real difference between\
    \ statements and expressions, the above logical short circuit mechanism can be\
    \ just as well employed to chain together commands. Furthermore, because they\
    \ return values interpreted as success (true) or failure (false), there will be\
    \ similar EBP gains in efficiency.\n\nThere is a clear relationship here to the\
    \ kind of programming known as ‘Logic Programming’, invented much later. See,\
    \ for example, the programming language Prolog, which is built around the ideas\
    \ of evaluating the (positive) conjuncts and backtracking on failures.\n\n###\
    \ Positive (and) commands chaining\n\n```\n1 command1 && ... commandn \n```\n\n\
    This is normally used in situations where it is required that all the commands\
    \ should succeed.\n\nNote that the logical ‘and’ operator is used here for joining\
    \ up the commands, in place of the previously used semicolons. The effect of this\
    \ is going to be an *early break* with false value returned, as soon as any individual\
    \ command exits with failure status. Presumably, this outcome should be reported\
    \ by some kind of error message, by tacking on the end `|| printf \"error message\\\
    n\"`, or deploying some remedial actions.\n\nThe rest of the commands will then\
    \ be ignored, whereas with the semicolon separator they would all continue being\
    \ executed regardless of their return status.\n\n### Negative (or) commands chaining\n\
    \n```\n1 command1 || ... commandn\n```\n\nNote that the logical ‘or’ operator\
    \ is now used in place of the semicolons. The effect of this is going to be an\
    \ *early break* from this block, as soon as any command exits with success status.\
    \ The rest of the commands will then be ignored. Here the logical intent is that\
    \ the success of any one of the commands is all that is required.\n\nAlternatively,\
    \ this form may be used when it is expected (hoped for?) that they should all\
    \ fail, such as when checking for occurrences of security breaches. Then the whole\
    \ block should return failure. Should it succeed at some point, this can be reported\
    \ by tacking on the end `&& printf \"Security breached!\\n\"` or any other remedial\
    \ actions.\n\n## Functions"
