    \ -c | hexify;; \n 9    n ) zstd -d -c | base64 -w 0;;\n10    * ) printf \"$PROGN\
    \ importfile: unrecognised ch\\n\";\n11        exit 2;;\n12 esac > $OUTFILE\n\
    ```\n\nSimilar pipes can be set up for any Bash statements. Think of them all\
    \ as filters of some data streams.\n\n# Amazing Arithmetic\n\nIn fairness, there\
    \ is one practical drawback to the ‘everything is just a string’ (EIJAS) philosophy\
    \ of Bash. Namely, the lack of floating point arithmetic.\n\nSuppose we want to\
    \ do a simple floating point division `C=$A/$B`. That is, we are not satisfied\
    \ with just the truncated answer that the Bash default integer division gives,\
    \ e.g. ‘5/2 = 2’ and we want greater precision (in this case 2.5).\n\nWe could\
    \ reach for external Linux utilities, such as `awk`,`dc`,`bc`, etc., and most\
    \ people do. However, embedding their code is somewhat messy in Bash. Most of\
    \ the facilities that these external programs offer are an overkill for a simple\
    \ one line calculation. Plus we have to start a sub-process for them every time,\
    \ even for trivial examples, such as this one:\n\n```\n1 C=$( awk \"BEGIN { print\
    \ $A / $B }\" )\n```\n\nLuckily, there is a simpler and more efficient alternative:\
    \ *fixed point arithmetic*. As an exercise, we are now going to implemented it\
    \ in Bash. The full source is available in [(3)](https://github.com/liborty/fdiv).\n\
    \nFixed point arithmetic is used in situations, where the numbers being handled\
    \ are all of similar magnitudes, so that they do not need the separately maintained\
    \ exponents of floating point numbers.\n\nTwo good examples are calculating percentages\
    \ and money. In both of these common use cases, the decimal point has a fixed\
    \ meaning (and position). This is in fact preferable in many applications, as\
    \ the truncation errors are more predictable and controllable.\n\nThen the ‘mantissa’\
    \ can be, in effect, expanded to the full 64 bits word. Note that the commonly\
    \ used ‘Double Precision IEEE 754 Floating Point Standard’ has only 52 bits allocated\
    \ for the mantissa. Therefore our fixed point arithmetic implemented on top of\
    \ ordinary 64 bit integer arithmetic used by Bash, will gain up to 12 bits of\
    \ extra precision.\n\n## Ratio in fixed point arithmetic\n\nRatios are easier\
    \ for internal calculations than percentages. Besides, any barely numerate person\
    \ is able to mentally translate them to percentages by simply multiplying them\
    \ by a hundred.\n\nSuppose we want to calculate the ratio of the byte sizes of\
    \ two directories: $INDIR and $OUTDIR. The second one, $OUTDIR, is a compressed\
    \ version of the first, and we want to find its compression ratio.\n\nBy taking\
    \ the ratio, where we always divide by the bigger of the two numbers, we are normalising\
    \ from two hard to handle ranges of the original values `[0,infinity)`, to a much\
    \ more compact and convenient range of their ratio: [0,1].\n\n*   Mathematical\
    \ notation: the round closing bracket above denotes a half open interval. Computers\
    \ can not handle infinity, so we excluded it from the interval. We can only ever\
    \ approach it.\n\nIn general, it is easy to check that we are always dividing\
    \ by the bigger of the two numbers and not by zero. That is enough to ensure that\
    \ the ratio will always be well behaved and in the interval [0,1].\n\nBack to\
