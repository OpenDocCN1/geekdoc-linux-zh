  trans: "\n好计划，但如何右移（除以 100000）呢，而且在没有能够容纳结果后五位小数的数值类型的情况下？我们不是在绕圈子吗？\n\n这里有一个技巧。我们可以通过简单的`文本操作`跳出这个循环。忘记再除回\
    \ `100000` 吧。我们只需要在整数结果前面加上字面量字符串 `0.`，通过文本方式构造一个定点数。每当我们知道结果小于 1 时，就可以这样做。我敢打赌你错过了上面\
    \ `printf` 格式化字符串中的那个技巧？请注意，这为我们提供了一个“新的定点类型”，且没有违反 `EIJ` 原则。\n\n通过一种会让任何现代编译器都会在抽搐中死掉的、糟糕且违反类型的魔法，我们将放大后的整数除法结果（例如\
    \ `1234`）转换成了 `0.01234`。在 `Bash` 中，这并不像看起来那么奇怪，因为反正一切返回的都是字符串。\n\n当然，小数点后的任何前导零是有意义的，所以我们必须在左侧填充这些零。格式化字符串\
    \ `\"%05d\"` 中 `%` 之后的前导零正是为此。\n\n数字 `5`（有效位数）必须与我们乘法左移因子中的零的数量一致，在本例中为 `100000`。它应该被赋值给变量，例如\
    \ `SIGDIGITS=5`，并在格式化字符串中使用 `\"%0$SIGDIGITSd\"`，在缩放因子中使用 `10**$SIGDIGITS`，从而避免任何潜在的视觉不匹配问题。\n\
    \n## 百分比（整数运算中）\n\n同样，以下代码将压缩率（CR）打印为原始大小的百分比，并四舍五入到最近的百分分之一。全部通过整数运算完成：\n\n```bash\n\
    \ 1 # 百分比压缩率：xx.xx%\n 2 # 乘以 10**5，然后取比例，\n 3 # 加上 5 并除以 10，\n 4 # 四舍五入到百分之分之一。\n\
    \ 5 # SIZES 是一个存储：size1,dir1,size2,dir2 的数组\n 6 SIZES=$( du -bs $INDIR $OUTDIR\
    \ ) \n 7 printf \"$PROGN: ${SIZES[1]} ${SIZES[0]} \"\n 8 printf \"=> ${SIZES[3]}\
    \ ${SIZES[2]} \"\n 9 if [ ${SIZES[0]} = ${SIZES[2]} ]; then \n10    printf \"\
    (100 %%)\\n\"\n11 else\n12    # 计算保留两位小数的百分比\n13    CR=$(( (5+100000*${SIZES[2]}/${SIZES[0]})/10\
    \ ))\n14    # 压缩率以 xx.xx% 格式打印\n15    printf \"(${CR: 0:2}.${CR: 2:4} %%)\\n\"\
    \ \n16 fi\n```\n\n在这里，我们没有使用 `printf` 格式化字符串替换，而是通过选择 `$CR` 的前两个数字、拼接小数点字符、最后加上接两个数字来直接构造百分比数字：`${CR:\
    \ 0:2}.${CR: 2:4}`。单个字符及其范围的选择是变量扩展 `${CR}` 可用功能之一。\n\n`Bash` 非常适合这种文本黑客技巧，正因为“一切都只是字符串”。\n\
    \n## 通用除法\n\n有人可能会反对认为这些只是特殊的打印技巧，除非我们能对数字进行通用计算，否则数字并没有太大用。我们是否可以写一个 `Bash` 函数，在没有预设硬编码小数位数的情况下进行除法？理想情况下，始终提供可能的精度？\n\
    \n让我们该函数命名为 `fdiv`。以下是对它更详细的要求：\n\n* `fdiv` `bash` 脚本接受两个整数参数：`numerator`（分子）和\
    \ `denominator`（除数）。它检查参数，如果缺失、不是整数或除数（`denominator`）为零，则返回错误。它能正确处理负参数。\n\n*\
    \ 它返回一个定点数除法结果，精度达到两个 64 位整数允许的最佳精度，四舍五入到最近的一位，例如：\n\n```\n1    fdiv -2 -3\n2\
    \    0.666666666666666667  \n3    fdiv 355 113\n4    3.14159222035398230\n```\n\
    \n* 当 `numerator` 为 0 时，立即返回 `0.0`。\n\n* 自动以最高精度计算。截断误差将小于 `5E-19`。\n\n* 当 `numerator\
    \ > denominator` 时，答案由整数（`numerator/denominator` 整数除法）组成，后面跟着小数点，然后是放大后的余数除以 `denominator`。最后部分小于\
    \ 1，因此提供了小数点后的数字，类似于上面的“定点比率”部分。总体而言，即使对于某些非常大的数字，这也保持了 `5E-19` 的保证精度。例如：\n\n\
    ```\n1    fdiv $(( 2**63-1 )) 3\n2    3074457345618258602.333333333333333333\n\
    ```\n\n* 当 `denominator` 可以被 10 或其倍数整除时，小数精度也可以增加，这次是在小数点后插入相应数量的零。在如下：\n\n```bash\n\
    #!/bin/bash\n# 添加定点\n\n# 检查参数\nif [[ -z \"$1\" || -z \"$2\" ]]; then\n    printf\
    \ \"error: needs two arguments\\n\"\n    exit 1\nfi\n\nif ! [[ \"$1\" =~ ^-?[0-9]+$\
    \ ]] || ! [[ \"$2\" =~ ^-?[0-9]+$ ]]; then\n    printf \"error: must be integers\\\
    n\"\n    exit 1\nfi\n\nif [[ \"$2\" -eq 0 ]]; then\n    printf \"error: divisor\
    \ cannot be zero\\n\"\n    exit 1\nfi\n\n# 将两者解析为整数部分和小数部分\nARR1=(${1//./})\n\
    ARR2=(${2//./})\nF1=${ARR1[1]}\nF2=${ARR2[1]}\n\n# 交换小数部分使 $F1 更长\n[[ ${#F1} -lt\
    \ ${#F2} ]] && { \n    FT=$F1; F1=$F2; F2=$FT\n}\nLF2=${#F2} # 保存较短的长度\n\n# 从较长的\
    \ F1 中删除末尾零，直到不再较长\nwhile [[ ${#F1} -gt $LF2 ]]; do\n    [[ ${F1: -1:1} == 0 ]]\
    \ && F1=${F1:0:-1} || break\ndone\nLF1=${#F1} # 现在完成对 F1 的裁剪\n\n# 在较短的 F2 右侧补零，直到长度相同\n\
    while [[ $LF1 -gt ${#F2} ]]; do F2=${F2}0; done\n\n# 执行加法\nWHOLE=$(( ${ARR1[0]}+${ARR2[0]}\
    \ ))\nFRACT=$(( $F1+$F2 ))\n\n# 检查小数溢出，即 >= 1\n[[ ${#FRACT} -gt $LF1 ]] && {\n\
    \    let WHOLE+=${FRACT:0:1}\n    FRACT=${FRACT:1}\n}\necho $WHOLE.$FRACT \n```\n\
    \n给读者的作业：实现一个类似的脚本 `fsub`，执行这些定点数的减法。提示：先复制这段代码 `https://github.com/liborty/fdiv/blob/master/fadd`，然后对其进行适当修改。\n"
- fmt: "\nAs has been outlined before, running processes in the background with `&`,\
    \ potentially in a different processor core, while we get on with the job on hand,\
    \ is an important part of Bash. It always has been but lately, with multicore\
    \ processors being the norm, it has become more topical. When you have thirty\
    \ two or more cores sitting in your processor, most of them so to speak ‘twiddling\
    \ their thumbs’, it behoves a responsible programmer to think of ways of spreading\
    \ the jobs around.\n\n## Automatic multithreading\n\nMany Bash applications just\
    \ handle lots of files. As does, for example, the open-source github project `TokenCrypt`,\
    \ [(4)](https://github.com/liborty/TokenCrypt). Many of the tasks depend on the\
    \ file alone and so they can be run in parallel. Disk bottlenecks may limit the\
    \ expected speedups but we will not worry about them here.\n\nHere we shall see\
    \ how to automate the spawning of background jobs within a Bash script. This technique\
    \ is of general use and it can speed up many naturally parallel tasks, such as\
    \ the processing of several files.\n\nA better way of doing intricate multithreaded\
    \ and asynchronous programming (and many other things besides) is Rust, of course.\
    \ However, Bash remains by far the easiest for simple tasks.\n\n## Rant about\
    \ security and privacy\n\nThis project was born out of frustration with the state\
    \ of encryption on the internet. Many of the offerings appear to be achieving\
    \ only the objectives of obfuscation and insecurity. Amongst them even some well\
    \ intentioned ones.\n\nHowever, there is a very simple and effective alternative:\
    \ XOR symmetric encryption. Symmetric means that the same key is used for both\
    \ encryption and decryption, which much simplifies the key management. It also\
    \ allows such useful operations as merging of keys for multi authorisations.\n\
    \nFurthermore, with the key of the same length as the message, this encryption\
    \ is theoretically unbreakable, i.e., the strongest possible. It is implemented\
    \ in `TokenCrypt` in an easily usable form.\n\nThere is one reasonable objection,\
    \ that generating such long keys in effect doubles the amount of storage needed.\
    \ This is mitigated by compressing the files first and some care is taken to do\
    \ it effectively. So, for example, with 50% compression achieved, there is no\
    \ storage overhead at all. In any case, disks are cheap and the security is worth\
    \ it even with some overhead. On the plus side, the encryption and decryption\
    \ are very fast, being so simple.\n\n## Encrypting many files faster\n\nThe tasks\
    \ of compressing, encrypting, decompressing and decrypting all the files in a\
    \ given directory are clearly I/O bound. They only depend on one file at a time,\
    \ so can be performed in parallel, without communications between them.\n\nThe\
    \ most suitable compression method is selected and applied for each file individually\
    \ and also the key of the right length is generated on encryption or looked up\
    \ on decryption. The code is general enough to take care of this. We will not\
    \ dwell on the details here, they can be found in [(4)](https://github.com/liborty/TokenCrypt),\
    \ [(5)](https://github.com/liborty/TokenCrypt/ncrpt), [(6)](https://github.com/liborty/TokenCrypt/expcrypt),\
    \ [(7)](https://github.com/liborty/TokenCrypt/impcrypt).\n\nOur aim is to fire\
    \ off background jobs for longer files first and leave the shorter ones to be\
    \ processed in the current shell in the end, to avoid the subshell overheads for\
    \ them. This will minimise the overall script execution time. We also want simple\
    \ code without too many tests and complicated ‘if’ statements.\n\nFirst the script\
    \ arguments and flags are processed and used to set up the correct input and output\
    \ directories. Then the input files are sorted by their lengths:\n\n```\n1 # size\
    \ of files to be encrypted in the subshells\n2 BACKSZ=10000 \n3 # list sorted\
    \ files in INDIR by size (in bytes)\n4 ITEMS=$(ls -SL $INDIR)\n5 # prepare to\
    \ fire off subshells\n6 BJ=\\&\n```\n\nThe last line above is a wondrous hack\
    \ to set up the default textual command ending `$BJ` to `&`.\n\nThis will cause\
    \ jobs over big files, followed by “$BJ”, to be run in the background subshell,\
    \ to start with.\n\nWhat remains now is to process all the files in the order\
    \ of their decreasing size and when the threshold `BACKSZ` is reached, permanently\
    \ turn off the sub-shelling with `BJ=''`:\n\n```\n 1 for FILEND in $ITEMS; do\n\
    \ 2    # reconstruct one full path/filename\n 3    INFILE=$INDIR/$FILEND \n 4\
    \    # only process a genuine file\n 5    [ -f \"$INFILE\" ] || continue \n 6\
    \    # turn off subshells when file size falls \n 7    # below the threshold BACKSZ\n\
    \ 8    # once $BJ has been set to an empty string, \n 9    # do not check filesizes\
    \ any more\n10    [ -z \"$BJ\" ] || \\\n11    [ $( stat -c%s $INFILE ) -ge $BACKSZ\
    \ ] || BJ='' \n12    # the function that processes one file\n 13    # either in\
    \ the background or in this shell\n 14    # depending on the value of $BJ\n 15\
    \    processfile $INFILE $BJ \n 16 done\n17 wait # for all processfiles to finish\n\
    ```\n\nRemember that Bash functions are executed in a sub shell when their invocation\
    \ ends in `&`. When `$BJ` variable is programmatically unset, its value simply\
    \ disappears from the program text and executions of `processfile` are thereafter\
    \ done in the current shell.\n\nSelf modifying program, ha! (The beautitudes of\
    \ EIJAS in Bash).\n\nWe use logical or `||` instead of `if`. It only executes\
    \ the last command, unsetting `BJ=''`, once `$BJ` was still set to `&` but the\
    \ size of the current `$INFILE` has fallen below the threshold. The only check\
    \ performed thereafter is the first part: `[ -z \"$BJ\" ]` evaluates to true and\
    \ exits immediately. If there are lots of short files, it saves the relatively\
    \ expensive `stat` system calls on all the rest of them.\n\nOf course, in this\
    \ simple example, we could have achieved the same effect by testing `$BJ` in an\
    \ `if` statement and issuing two explicit calls to `processfile`, as follows:\n\
    \n```\n1 if [ -n \"$BJ\" ]; then\n2    processfile $INFILE &\n3 else\n4    processfile\
    \ $INFILE\n5 fi\n```\n\nbut we wanted to demonstrate the general opportunities\
    \ in Bash for self-modification.\n\nPossibly the most exciting thing about Bash\
    \ is just how quickly we were able to move with this book ‘from zero to hero’.\
    \ gain confidence and to start implementing practical projects that would actually\
    \ be quite challenging and long winded to do in most modern languages.\n\nSome\
    \ modern languages, of which Rust is a prime example, produce rather the opposite\
    \ experience of going ‘from hero to zero’. That is to say, from a confident programmer\
    \ who has previously mastered a number of languages, to a human wreck feeling\
    \ very much at the deep end, with snail pace productivity. Don’t get me wrong,\
    \ I love Rust really and will probably write my next book about it.\n\nAnother\
    \ anecdote in a similar vein used to be told about Java when that one first came\
    \ out: “have you heard of this wonderful new language, in which you can print\
    \ ‘hello world’ in mere five pages of code”?\n"
