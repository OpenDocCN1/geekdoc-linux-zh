  trans: '

    在这种幽默的背后，其实隐藏着一个严肃的问题。编程正变得越来越复杂。遵循目前的趋势，我们可能会完全失去对编程的所有权。它可能会变成最后几个活着的“书呆子”的领地，他们在自己狭窄的领域内，还能（几乎）进行剪切和粘贴，而使用的是某些早已故去的人遗留给他们的专有应用程序库。那将是一个悲哀的、反乌托邦的世界。


    这样一个暗淡的未来真的不可避免吗？也许这本书已经成功地激发了你去（重新）发现“拥有”编程的乐趣并分享其成果。如果是如此，那么它的使命就成功了。


