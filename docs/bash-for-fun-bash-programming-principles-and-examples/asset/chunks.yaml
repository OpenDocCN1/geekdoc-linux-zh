- fmt: "\nThe general rule for double quoted strings anywhere (not just after `printf`),\
    \ states that the following Bash reserved characters must be escaped by being\
    \ preceded by a backslash: dollar, backtick, double-quote, backslash, newline.\
    \ The escaped ‘newline’ here means an actual newline, such as at the end of a\
    \ line of code, which we want to continue uninterrupted onto the next line.\n\n\
    Let us move on to strings (sequences of characters).\n\n## Literal string\n\n\
    Single quotes `'...'` enclose a simple unit of literal text. Nothing inside the\
    \ single quotes is evaluated. Example:\n\n```\n1 'the cat sat on the mat'\n```\n\
    \nTo make a single quote part of the string, without terminating it prematurely,\
    \ it is necessary to use outer double quotes, like this:\n\n```\n1  \"the cat's\
    \ mat was eaten by a rat\"\n```\n\n## Interpreted string\n\nDouble quotes have\
    \ the additional function of evaluating (expanding) any variables or expressions\
    \ found within them. The `expansion` is indicated by sticking a dollar sign `$`\
    \ immediately in front of the variable/expression. In fact, the dollar sign causes\
    \ the `expansion` anywhere else as well, apart from within those literal strings\
    \ above. Example:\n\n```\n1 \"The cat's name is $NAME\"\n```\n\nCapitalising the\
    \ variables is just a useful convention.\n\nNote: Double quoting of just a variable\
    \ alone, e.g. `\"$FILENAME\"`, is often advised in all evaluation contexts to\
    \ prevent filenames containing spaces (a horrific Windows ‘invention’), from being\
    \ interpreted as several different files, instead of just one file as was intended.\
    \ Similarly, in tests, double quoting a variable ensures that it always returns\
    \ at least an ‘empty string’ value. Otherwise an unset variable just disappears\
    \ after expansion and this can sometimes cause program syntax errors.\n\n## Assignment\n\
    \nWhen assigning to variables, the left hand side of an assignment is unevaluated,\
    \ so it does not take the dollar sign:\n\n```\n1 NAME='Bob'; ANOTHERBOB=$NAME\n\
    ```\n\nAlso, be very careful not to use any spaces around the assignment operator\
    \ `=`.\n\n## Variable expansion\n\n`${VAR}`, using braces with `$` outside, is\
    \ another way of quoting variables, called the variable expansion. After the usual\
    \ evaluation of the variable, it can also apply some special functions to its\
    \ value. Those functions may involve, for example, searching and selecting specific\
    \ parts of a path/filename, as in:\n\n`EX=\"${FILESPEC##*.}\"`\n\nThis assigns\
    \ the last file extension to `EX`, by deleting everything in `$FILESPEC` value\
    \ before and including the last dot. The wildcard character `*` is use to match\
    \ everything before that last dot.\n\n`${V#*\"$C\"}` deletes everything from the\
    \ value of `$V`, from its beginning up to and including the first occurrence of\
    \ the character specified in `$C`.\n\n`${V##*\"$C\"}` deletes everything from\
    \ the beginning up to and including the last occurrence of `$C`.\n\n`${V%\"$C\"\
    *}` deletes everything from the end up to and including the first occurrence (from\
    \ the end) `$C`.\n\n`${V%%\"$C\"*}` deletes everything from the end up to and\
    \ including the last occurrence (from the end) `$C`.\n\n`${V:=value}` initialises\
    \ V to (default) value if it was unset.\n\n`${V:?error message}` prints error\
    \ message and exits if V is unset. The message can be a double quoted interpreted\
    \ string.\n\n`${VAR@Q}` automatically transforms the value of `$VAR`, by applying\
    \ the individual character backslash escaping rules, where necessary. When in\
    \ doubt about which characters require escaping, then ask the expert (Bash itself).\
    \ This is useful whenever some text, (possibly containing special characters),\
    \ is read into `$VAR` and it is then to be interpreted in some way by Bash.\n\n\
    ## Logical eval\n\n`[...]` logical evaluation (test) of an expression. It is expected\
    \ to return a boolean true/false value. It can use the comparator operators `-lt`\
    \ `-le` `-eq` `-ne` `-gt` `-ge` when comparing numbers and `=`, `!=` when comparing\
    \ strings. It can form part of a bigger expression, with several sets of square\
    \ bracket tests joined by logical operators: `!`, `||`, `&&` (meaning ‘logical\
    \ not’, ‘logical or’ and ‘logical and’, respectively).\n\nIn fact, everything\
    \ in Bash is an expression. Even an executed command returns an ‘exit status’\
    \ value: 0 (true) for success and 1-255 for user defined failures. Zero is interpreted\
    \ as true because it indictates a successful exit, so that program calls can be\
    \ included in the tests.\n\nRegular expressions (regexp) comparison tests using\
    \ `=~` operator should be enclosed in double brackets `[[...]]`.\n\nSimple invocations\
    \ of programs, functions and utilities can be tested for successful outcomes directly,\
    \ without the square brackets, for example:\n\n```\n1 mkdir somedir || echo failed\
    \ to create somedir\n```\n\nSee the next chapter for these simple forms of conditional\
    \ statements.\n\nIt is common to test variables for being set or unset:\n\n- `[\
    \ -n \"$VAR\" ]` true if `$VAR` has been set to something of non zero length\n\
    - `[ -z \"$VAR\" ]` is true if it is unset\n- `[ -f \"$VAR\" ]` is true if value\
    \ of `$VAR` is an existing file\n- `[ -d \"$VAR\" ]` is true if value of `$VAR`\
    \ is an existing directory\n- `[ -r \"$VAR\" ]` is a readable file\n- `[ -h \"\
    $VAR\" ]` is a symlink\n- `[ -w \"$VAR\" ]` is a writable file\n- `[ -s \"$VAR\"\
    \ ]` is a file of nonzero size\n- `[ -x \"$VAR\" ]` is an executable file\n- `[\
    \ \"$F1\" -ef \"$F2\" ]` F1 is equal to F2\n- `[ \"$F1\" -nt \"$F2\" ]` F1 is\
    \ newer than F2\n- `[ \"$F1\" -ot \"$F2\" ]` F1 is older than F2\n- `[ \"$F1\"\
    \ -eq \"$F2\" ]` F1 is equal to F2\n\n## Arithmetic eval\n\n`$(( NUM1+NUM2 ))`\
    \ or ‘arithmetic evaluation’, causes the evaluation of the enclosed expression.\
    \ Bash has no floating point types or calculations with them (but see in a later\
    \ chapter).\n\nThere are the usual (integer) arithmetic operators: `+`, `-`, `*`,\
    \ `/`, `%` and their assignment versions, `+=`, `-=`, `*=`, `/=`, `%=` which adds\
    \ the right side (RHS) value to the existing value of LHS. If `$COUNTER` was not\
    \ initialised, it will be given initial value 0 (only in these assignments).\n\
    \nThe `let` form triggers an arithmetic evaluation, somewhat like the double parenthesis\
    \ but then it drops the produced value.\n\nWhen unsure about the operator’s precedence,\
    \ use extra parenthesis.\n\n## Eval\n\n`eval command1 ... argn` is the normal\
    \ evaluation. It executes `command1 ... argn` in the current shell. It can be\
    \ used to construct and execute any function call, or a call to linux external\
    \ utility.\n\nComparison: `printf \"$P: \"` returns (formatted) value of variable\
    \ `$P`, whereas `eval $P` in addition also executes its value as a command.\n\n\
    ```\n1 P=pwd; printf \"$P: \"; eval $P\n```\n\n## Braces\n\n```\n1 { P=pwd; printf\
    \ \"$P: \";  $P; }\n2 \n3 {\n     P=pwd\n     printf \"$P: \"\n     $P\n7 }\n\
    ```\n\nBraces are used to bind together a number of commands into a ‘block’, executed\
    \ at the current shell. Note the last semicolon before the closing brace, without\
    \ which the value of $P would not be executed.\n\nIn the multi line syntax (the\
    \ last version), the new lines substitute the role of the semicolons.\n\nControl\
    \ question: what will this print out? Try it out! Only a few other languages have\
    \ this very powerful ( some say downright dangerous ) ‘program as data’ facility.\
    \ Lisp is one of them.\n\nIn fact, all these three versions produce the same results,\
    \ the differences are only in their syntax.\n\n## Subshell eval\n\n`$( command1;\
    \ command2; )&` has the same effect as the braces above, except that it starts\
    \ a new subshell for the evaluation (command substitution). This has some small\
    \ overhead costs associated with it. However, it is useful for ‘spinning off’\
    \ background processes by optionally appending `&` after the closing paranthesis.\
    \ Such processes will then run in parallel, in separate threads.\n"
  raw: "The general rule for double quoted strings anywhere (not just after `printf`),\
    \ states that the following Bash reserved characters must be escaped by being\
    \ preceded by a backslash: dollar, backtick, double-quote, backslash, newline.\
    \ The escaped ‘newline’ here means an actual newline, such as at the end of a\
    \ line of code, which we want to continue uninterrupted onto the next line.\n\n\
    Let us move on to strings (sequences of characters).\n\n## Literal string\n\n\
    Single quotes `'...'` enclose a simple unit of literal text. Nothing inside the\
    \ single quotes is evaluated. Example:\n\n```\n1 'the cat sat on the mat'\n```\n\
    \nTo make a single quote part of the string, without terminating it prematurely,\
    \ it is necessary to use outer double quotes, like this:\n\n```\n1  \"the cat's\
    \ mat was eaten by a rat\"\n```\n\n## Interpreted string\n\nDouble quotes have\
    \ the additional function of evaluating (expanding) any variables or expressions\
    \ found within them. The *expansion* is indicated by sticking a dollar sign `$`\
    \ immediately in front of the variable/expression. In fact, the dollar sign causes\
    \ the *expansion* anywhere else as well, apart from within those literal strings\
    \ above. Example:\n\n```\n1 \"The cat's name is $NAME\"\n```\n\nCapitalising the\
    \ variables is just a useful convention.\n\nNote: Double quoting of just a variable\
    \ alone, e.g. `\"$FILENAME\"`, is often advised in all evaluation contexts to\
    \ prevent filenames containing spaces (a horrific Windows ‘invention’), from being\
    \ interpreted as several different files, instead of just one file as was intended.\
    \ Similarly, in tests, double quoting a variable ensures that it always returns\
    \ at least an ‘empty string’ value. Otherwise an unset variable just disappears\
    \ after expansion and this can sometimes cause program syntax errors.\n\n## Assignment\n\
    \nWhen assigning to variables, the left hand side of an assignment is unevaluated,\
    \ so it does not take the dollar sign:\n\n```\n1 NAME='Bob'; ANOTHERBOB=$NAME\n\
    ```\n\nAlso, be very careful not to use any spaces around the assignment operator\
    \ `=`.\n\n## Variable expansion\n\n`${VAR}`, using braces with `$` outside, is\
    \ another way of quoting variables, called the variable expansion. After the usual\
    \ evaluation of the variable, it can also apply some special functions to its\
    \ value. Those functions may involve, for example, searching and selecting specific\
    \ parts of a path/filename, as in:\n\n`EX=\"${FILESPEC##*.}\"`\n\nThis assigns\
    \ the last file extension to `EX`, by deleting everything in `$FILESPEC` value\
    \ before and including the last dot. The wildcard character `*` is use to match\
    \ everything before that last dot.\n\n`${V#*\"$C\"}` deletes everything from the\
    \ value of `$V`, from its beginning up to and including the first occurrence of\
    \ the character specified in `$C`.\n\n`${V##*\"$C\"}` deletes everything from\
    \ the beginning up to and including the last occurrence of `$C`.\n\n`${V%\"$C\"\
    *}` deletes everything from the end up to and including the first occurrence (from\
    \ the end) of `$C`.\n\n`${V%%\"$C\"*}` deletes everything from the end up to and\
    \ including the last occurrence (from the end) of `$C`.\n\n`${V:=value}` initialises\
    \ V to (default) value if it was unset.\n\n`${V:?error message}` prints error\
    \ message and exits if V is unset. The message can be a double quoted interpreted\
    \ string.\n\n`${VAR@Q}` automatically transforms the value of $VAR, by applying\
    \ the individual character backslash escaping rules, where necessary. When in\
    \ doubt about which characters require escaping, then ask the expert (Bash itself).\
    \ This is useful whenever some text, (possibly containing special characters),\
    \ is read into $VAR and it is then to be interpreted in some way by Bash.\n\n\
    ## Logical eval\n\n`[...]` logical evaluation (test) of an expression. It is expected\
    \ to return a boolean true/false value. It can use the comparator operators `-lt\
    \ -le -eq -ne -gt -ge` when comparing numbers and `=`,`!=` when comparing strings.\
    \ It can form part of a bigger expression, with several sets of square bracket\
    \ tests joined by logical operators: `!, ||, &&` (meaning ‘logical not’, ‘logical\
    \ or’ and ‘logical and’, respectively).\n\nIn fact, everything in Bash is an expression.\
    \ Even an executed command returns an ‘exit status’ value: 0 (true) for success\
    \ and 1-255 for user defined failures. Zero is interpreted as true because it\
    \ indictates a successful exit, so that program calls can be included in the tests.\n\
    \nRegular expressions (regexp) comparison tests using `=~` operator should be\
    \ enclosed in double brackets `[[...]]`.\n\nSimple invocations of programs, functions\
    \ and utilities can be tested for successful outcomes directly, without the square\
    \ brackets, for example:\n\n```\n1 mkdir somedir || echo failed to create somedir\n\
    ```\n\nSee the next chapter for these simple forms of conditional statements.\n\
    \nIt is common to test variables for being set or unset:\n\n*   `[ -n \"$VAR\"\
    \ ]` true if `$VAR` has been set to something of non zero length\n\n*   `[ -z\
    \ \"$VAR\" ]` is true if it is unset\n\n*   `[ -f \"$VAR\" ]` is true if value\
    \ of `$VAR` is an existing file\n\n*   `[ -d \"$VAR\" ]` is true if value of `$VAR`\
    \ is an existing directory\n\n*   `[ -r \"$VAR\" ]` is a readable file\n\n*  \
    \ `[ -h \"$VAR\" ]` is a symlink\n\n*   `[ -w \"$VAR\" ]` is a writable file\n\
    \n*   `[ -s \"$VAR\" ]` is a file of nonzero size\n\n*   `[ -x \"$VAR\" ]` is\
    \ an executable file\n\n*   `[ \"$F1\" -ef \"$F2\" ]` F1 is equal to F2 (same\
    \ file content)\n\n*   `[ \"$F1\" -nt \"$F2\" ]` F1 is newer file than F2\n\n\
    *   `[ \"$F1\" -ot \"$F2\" ]` F1 is older file than F2\n\n## Arithmetic eval\n\
    \n`$(( $NUM1+$NUM2 ))` or ‘arithmetic evaluation’, causes the evaluation of the\
    \ enclosed arithmetic expression. In this case the sum of two integers. There\
    \ must be spaces left between the double paranthesis and the expression inside.\n\
    \nBash has no floating point types or calculations with them (but see in a later\
    \ chapter our fixed point arithmetic project).\n\nThere are the usual (integer)\
    \ arithmetic operators: `+,-,*,**,/,%` and their updating assignment versions,\
    \ e.g. `+=` which adds the right hand side (RHS) value to the existing value of\
    \ the LHS variable, e.g.: `let COUNTER+=1`. If `$COUNTER` was not initialised,\
    \ it will be given initial value 0 (only in these updating assignments).\n\nThe\
    \ `let` form triggers an arithmetic evaluation, somewhat like the double paranthesis\
    \ above but then it drops the produced value. Therefore `let` is often used for\
    \ arithmetic assignments.\n\nWhen unsure about the operator’s precedence, use\
    \ extra paranthesis.\n\n## Eval\n\n`eval command arg1 ... argn` is the normal\
    \ evaluation. It executes `command arg1 ... argn` in the current shell. It can\
    \ be used to *construct* and execute any function call, or a call to a linux external\
    \ utility.\n\nComparison: `printf \"$P: \"` returns (formatted) value of variable\
    \ `$P`, whereas `eval $P` in addition also executes its value as a command.\n\n\
    ```\n1 P=pwd; printf \"$P: \"; eval $P\n```\n\n## Braces\n\n```\n1 { P=pwd; printf\
    \ \"$P: \";  $P; }\n2 \n3 {\n4     P=pwd\n5     printf \"$P: \"\n6     $P\n7 }\n\
    ```\n\nBraces are used to bind together a number of commands into a ‘block’, executed\
    \ at the current shell. Note the last semicolon before the closing brace, without\
    \ which the value of $P would not be executed.\n\nIn the multi line syntax (the\
    \ last version), the new lines substitute the role of the semicolons.\n\nControl\
    \ question: what will this print out? Try it out! Only a few other languages have\
    \ this very powerful ( some say downright dangerous ) ‘program as data’ facility.\
    \ Lisp is one of them.\n\nIn fact, all these three versions produce the same results,\
    \ the differences are only in their syntax.\n\n## Subshell eval\n\n`$( command1;\
    \ command2; )&` has the same effect as the braces above, except that it starts\
    \ a new subshell for the evaluation (command substitution). This has some small\
    \ overhead costs associated with it. However, it is useful for ‘spinning off’\
    \ background processes by optionally appending `&` after the closing paranthesis.\
    \ Such processes will then run in parallel, in separate threads."
