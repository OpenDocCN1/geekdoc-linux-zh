    \ `%d` into a fixed point number `0.%05d`.\n\nIn the printf formatting string,\
    \ `%s` (for strings), `%d` (for decimal numbers), etc., get filled in order by\
    \ the actual values of the evaluated arguments (if any), following the formatting\
    \ string. Here they are the sizes and names of the two directories and finally\
    \ the calculated compression ratio ( `\\` simply allows continuing the code onto\
    \ the next line):\n\n```\n1 printf \"Output size:\\t%s (%s)\\n\\\n2    Original\
    \ size:\\t%s (%s)\\n\\\n3    Compressed to:\\t0.%05d\\n\" \\ \n4    ${SIZES[0]}\
    \ ${SIZES[1]} ${SIZES[2]} ${SIZES[3]} \\\n5      $(( 100000*${SIZES[2]}/${SIZES[0]}\
    \ ))\n```\n\nThe last line is the actual fixed point (integer) calculation. We\
    \ have chosen here to calculate the ratio to five decimal places `0.%05d`, so\
    \ we premultiply by 100000\\. The five zeroes correspond to the five decimal places\
    \ we will output via the formatting string. The numerator is the size of the smaller\
    \ compressed $OUTDIR, so the true ratio will be less than one.\n\nWe get this\
    \ precision by making a temporary left shift by five decimal places and then carrying\
    \ out ordinary integer division. Of course, this should be followed by somehow\
    \ shifting back those five decimal places to the right, to produce the final result."
