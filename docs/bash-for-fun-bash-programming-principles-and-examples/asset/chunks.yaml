  trans: "\n\n```bash\n#!/bin/bash\n# 此程序期望一些选项，\n# 随后是三个强制性的的目录路径。\n\n# 程序的路径/名称始终位于\
    \ $0 中。 \n# 在这里我们使用 `##*/` 删掉程序名称之前的路径\nPROGN=${0##*/}\n\n# 将频繁使用的消息封装到函数中；\n\
    # 它们的输出被重定向到 stderr (>&2)\nfunction usage {\n   printf \"Usage: $PROGN \\\n  \
    \ [-h][-b][-c][-x][-q][-r][-u][-v][-z] \\\n   indir keydir outdir\\n\" >&2\n}\n\
    \nfunction helpmsg {\n   usage\n   printf \"\\t%s\\n\" \\\n     '-b | --b64 :\
    \ 测试 base64 编码文件' \\\n     '-c | --clean : 归档' \\\n     '-h | --help : 打印此文本'\
    \ \\\n     '-q | --quiet : 关闭最终总结' \\\n     '-r | --recurse : 同时处理子目录' \\\n  \
    \   '-u | --update : 归档' \\\n     '-v | --verbose : 详细报告' \\\n     '-x | --hex\
    \ : 测试十六进制文件' \\\n     '-z | --zstd : 使用 zstd 压缩' >&2\n   exit 1\n}\n\n# 使用实用工具\
    \ `getops` 进行选项解析： \n# 将列出的选项（即跟在 - 后面的单词）\n# 放入 $OPT 中\nwhile getopts hbcxqruvz-:\
    \ OPT; do\n  # 长选项以 -- 开头，\n  # 这通过列表中的最后一个选项检测：`-`\n  # 然后手动将长选项名称赋值给 $OPT：\n\
    \  if [ \"$OPT\" = \"-\" ]; then\n    # 找到 --：重置 OPT 和 OPTARG\n    OPT=\"${OPTARG%%=*}\"\
    \  # 提取长选项名称\n    # 提取长选项参数（此处为空）\n    OPTARG=\"${OPTARG#$OPT}\" \n    # 移除长选项中的任何赋值\
    \ `=`\n    OPTARG=\"${OPTARG#=}\" \n  fi\n  # 现在按任意顺序处理并记录所有选项\n  # 在这里我们设置它们的变量，\n\
    \  # 稍后检测它们被设置，例如：[ -n \"$VAR\" ]\n  case \"$OPT\" in\n    h | help ) helpmsg;;\n\
    \    b | b64 ) B64TEST=0;;\n    c | clean ) CLEAN=0;; \n    x | hex ) HEXTEST=0;;\n\
    \    q | quiet ) QUIET=0;;\n    v | verbose ) VERBOSE=0;; \n    r | recurse )\
    \ RECURSE=0;;\n    u | update ) UPDATE=0;;\n    z | zstd ) COMPRESSOR=zstd;; \n\
    \    ??* ) printf \\\n    \"$PROGN quitting, bad long option: $OPT\\n\" >&2\n\
    \       usage; exit 2;; \n    # 错误的短选项（将通过 getopts 报告） \n    *) exit 2;; \n  esac\n\
    done\n# 从列表 $@ 中移除所有解析过的选项和参数\n# 这样我们就可以解析剩余的参数。\n# 下一个将位于 $1，\n# 就像没有提供选项一样：\n\
    shift $((OPTIND-1)) \n\n# 验证输入目录\n[ -d \"$1\" ] || { \n   printf \"$PROGN: input\
    \ directory $1 not found\\n\" >&2\n   exit 2\n}\n...\n# 可选的最终报告\n[ $QUIET ] ||\
    \ { printf ... } \n```\n\n现在，用户可以使用列出的选项的任意组合调用此程序，这些选项前加 `-`，后跟三个目录路径。这些选项正如其名称所示，为程序提供了可选的功能和运行模式。例如：\n\
    \n`ncrpt -rbxuc dir1 dir2 dir3`\n\n# 输入-输出\n\n在所有的编程语言中，`Bash` 一定拥有最简单方便的输入/输出\
    \ (I/O) 处理。\n\n## 基本术语\n\n*   文件\n    *   通常存储在文件系统中，通过路径、文件名和文件扩展名进行识别\n    *\
    \   当存储在互联网上时，它们的通用资源定位符 (`URL`) 充当路径的角色。这些文件需要通过某些实用程序（如 `scp` (ssh 安全拷贝) 或 `wget`）通过网络复制（下载）。一旦安全地存储在本地文件系统中，就可以更快、更安全地进行读取和操作。\n\
    *   流（streams）是字节序列，即实际数据，并关联一个内部存储的当前位置。读取和写入会自动推进该位置。\n    *   输入流用于读取\n   \
    \ *   输出流用于写入\n    *   输入流用于读取，输出流用于写入\n\n"
- fmt: "\nWhen we no longer need stream 3, we close it with: `exec 3>&-`. The dash\
    \ means ‘close this stream’.\n\nStreams can also be redirected from one to another.\
    \ For example, `1>&2` redirects `stdout` to `stderr`. Leaving `1` out, it will\
    \ be assumed by default. Thus `>&2` has the same effect (see above).\n\nOccasionally,\
    \ we may need a stream to directly stand in for a file.\n\nSuppose we wish to\
    \ pipe 100 random hexadecimal characters to an external program `prog`, which\
    \ for some reason does not have the ability to read from `stdin`. Instead, `prog`\
    \ expects an explicit input filename argument. For this situation, there are certain\
    \ standard system filenames, permanently associated with the standard streams:\n\
    \n```\n1 tr -dc '0-9a-f' < /dev/urandom | \\\n2 head -c 100 | prog /dev/stdin\n\
    ```\n\nHere we sent a ‘lazy’ stream of random valued bytes (0-255) from `/dev/urandom`\
    \ to utility program `tr`, which deletes all but the specified hexadecimal characters\
    \ ranges and pipes the surviving ones to `head`. Head then takes just one hundred\
    \ of them and pipes them to `prog`. Prog can not read the pipe on stream 0 (`stdin`),\
    \ as per usual but instead opens the file `/dev/stdin` and finds the bytes there.\n\
    \nSimilarly, to throw away some unwanted messages, data, or spam, direct them\
    \ to `>/dev/null`\n\n## Pipes and functional composition\n\nFunction calls, subshell\
    \ evaluations, Bash commands, invocations of other programs, basically everything\
    \ in Bash, are functions which write their produced values by default to stream\
    \ `1`. The results are then received from stream `0` as the returned value of\
    \ their call or passed on via the pipe.\n\nThis mechanism is somewhat like what\
    \ happens in *functional programming*: it facilitates convenient composition.\
    \ In fact, with a bit of self imposed discipline not to abuse global variables,\
    \ good old Bash can be used for functional programming. Abusing global variables\
    \ is a bad practice anyway, it is bound to bite you painfully when you start using\
    \ `&` (background parallel execution of sub processes).\n\nWe will now demonstrate\
    \ the piping to and from any Bash statements on an example of `case` command.\
    \ The following text fragment is taken from TokenCrypt project [(4)](https://github.com/liborty/TokenCrypt).\n\
    \nIt shows how we can *switch pipes*. That is, factor out all common computations\
    \ and put them upfront. Then pipe their results to a `case` statement, within\
    \ which each branch is going to continue the pipe actions in its own specific\
    \ way. Then we continue again with one common path after the `case` statement\
    \ is finished. That is, in this example, write the decrypted decompressed result\
    \ into `$OUTFILE`.\n\nThe code reads a key of known `$FSIZE` from stream `3`,\
    \ decrypts `$INFILE` with it and then chooses the relevant method of decompression,\
    \ depending on the value of `$CH`. What gets written into `$OUTFILE` in the end\
    \ will depend on which branch of the case statement was selected.\n\n```\n 1 head\
    \ -c $FSIZE <&3 | symcrypt $INFILE | case \"$CH\" in\n 2    h ) hexify;;\n 3 \
    \   b ) base64 -w 0;;\n 4    i ) lzma -d;;\n 5    j ) lzma -d | hexify;; \n 6\
    \    k ) lzma -d | base64 -w 0;; \n 7    l ) zstd -d -c;; \n 8    m ) zstd -d\
    \ -c | hexify;; \n 9    n ) zstd -d -c | base64 -w 0;;\n10    * ) printf \"$PROGN\
    \ importfile: unrecognised ch\\n\";\n11        exit 2;;\n12 esac > $OUTFILE\n\
    ```\n\nSimilar pipes can be set up for any Bash statements. Think of them all\
    \ as filters of some data streams.\n\n## Amazing Arithmetic\n\nIn fairness, there\
    \ is one practical drawback to the ‘everything is just a string’ (EIJAS) philosophy\
    \ of Bash. Namely, the lack of floating point arithmetic.\n\nSuppose we want to\
    \ do a simple floating point division `C=$A/$B`. That is, we are not satisfied\
    \ with just the truncated answer that the Bash default integer division gives,\
    \ e.g. ‘5/2 = 2’ and we want greater precision (in this case 2.5).\n\nWe could\
    \ reach for external Linux utilities, such as `awk`, `dc`, `bc`, etc., and most\
    \ people do. However, embedding their code is somewhat messy in Bash. Most of\
    \ the facilities that these external programs offer are an overkill for a simple\
    \ one line calculation. Plus we have to start a sub-process for them every time,\
    \ even for trivial examples, such as this one:\n\n```\n1 C=$( awk \"BEGIN { print\
    \ $A / $B }\" )\n```\n\nLuckily, there is a simpler and more efficient alternative:\
    \ *fixed point arithmetic*. As an exercise, we are now going to implemented it\
    \ in Bash. The full source is available in [(3)](https://github.com/liborty/fdiv).\n\
    \nFixed point arithmetic is used in situations, where the numbers being handled\
    \ are all of similar magnitudes, so that they do not need the separately maintained\
    \ exponents of floating point numbers.\n\nTwo good examples are calculating percentages\
    \ and money. In both of these common use cases, the decimal point has a fixed\
    \ meaning (and position). This is in fact preferable in many applications, as\
    \ the truncation errors are more predictable and controllable.\n\nThen the ‘mantissa’\
    \ can be, in effect, expanded to the full 64 bits word. Note that the commonly\
    \ used ‘Double Precision IEEE 754 Floating Point Standard’ has only 5 bits.\n\n\
    ## Ratio in fixed point arithmetic\n\nRatios are easier for internal calculations\
    \ than percentages. We get this precision by making a temporary left shift by\
    \ five decimal places and then carrying out ordinary integer division. Of course,\
    \ this should be followed by somehow shifting back those five decimal places to\
    \ the right, to produce the final result.\n\nIn general, it is easy to check that\
    \ we are always dividing by the bigger of the two numbers and not by zero. That\
    \ is enough to ensure that the ratio will always be well behaved and in the interval\
    \ [0,1].\n\nBack to our ratio application. The following line calls `du` (disk\
    \ usage) to fill an array, here called `SIZES`, with the sizes and names of the\
    \ two directories:\n\n```\n1 # create array SIZES[size1, dir1, size2, dir2]\n\
    2 SIZES=$( du -hbs $INDIR $OUTDIR )\n```\n\nNext we use printf formatting to turn\
    \ an ordinary integer `%d` into a fixed point number `0.%5d`.\n\nIn the printf\
    \ formatting string, `%s` (for strings), `%d` (for decimal numbers), etc., get\
    \ filled in order by the actual values of the evaluated arguments (if any), following\
    \ the formatting string. Here they are the sizes and names of the two directories\
    \ and finally the calculated compression ratio ( `\\` simply allows continuing\
    \ the code onto the next line):\n\n```\n1 printf \"Output size:\\t%s (%s)\\n\\\
    \n2    Original size:\\t%s (%s)\\n\\\n3    Compressed to:\\t0.%05d\\n\" \\\n4\
    \    ${SIZES[0]} ${SIZES[1]} ${SIZES[2]} ${SIZES[3]} \\\n5      $(( 100000*${SIZES[2]}/${SIZES[0]}\
    \ ))\n```\n\nThe last line is the actual fixed point (integer) calculation. We\
    \ have chosen here to calculate the ratio to five decimal places `0.%05d`, so\
    \ we premultiply by 10000\\. The five zeroes correspond to the five decimal places\
    \ we will output via the formatting string. The numerator is the size of the smaller\
    \ compressed `$OUTDIR`, so the true ratio will be less than one.\n"
