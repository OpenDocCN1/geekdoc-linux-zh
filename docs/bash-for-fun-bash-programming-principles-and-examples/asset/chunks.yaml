  trans: "\n\n![](img/title_page.jpg)\n\n![Bash 之趣](img/title_page.jpg)\n\n# Bash\
    \ 之趣\n\n## Bash 编程：原理与示例\n\n### Libor Spacek\n\n本书已售：[`leanpub.com/bashforfun`](http://leanpub.com/bashforfun)\
    \ \n此版本发布于 2022-01-08\n![出版者标志](img/leanpub-logo.png)\n\n这是一本来自 [Leanpub](http://leanpub.com)\
    \ 的书籍。Leanpub 通过精益出版（Lean Publishing）流程为作者和出版社提供支持。[精益出版](http://leanpub.com/manifesto)是指使用轻量级工具和多次迭代发布开发中的电子书，以获取读者反馈，不断调整方向直到获得正确的书籍，并在完成后建立影响力。\n\
    \n© 2021 - 2022 Libor Spacek\nEPUB 版本的 ISBN：978-0-6453971-0-9\n\n## 目录\n\n## 指南\n\
    \n1. 开始阅读\n\n# 引言\n\n本书的预期读者群是所有希望更好地了解自己电脑的人。那些希望高效且自信地使用 Bash 的人。本书涵盖了 Bash\
    \ 编程技能的各个范围：从初学者到高级学者，并配有有趣的逸见解和完成实用任务的示例。\n\n在过去的四多年里，无知的“点击按钮”对编程教育中值得赞誉的理想造成了很大损害。是时候重新发现那些古老的智慧了！你也将成为一名复古编程的魔法师。有了这本书，你将极大提高你的生产力，并获得对设备的真正所有权。\n\
    \n如果你过去在编程上遇到阻碍感到沮丧，如果你从未开始过，或者你曾想：“一定有更简单、更好的方法来做这件事！”，那么这本书就是为你准备的。\n\n最重要的是，你在这里将发现一种最稀有且珍贵的东西：理解。\n\
    \n本书绝对不是另一本枯燥的参考手册。编程是一门高技巧的艺术。这在 Bash 编程中尤其如此。艺术不能从手册中轻易学会，即使是从那些组织完美、充满劝诫和练习的教学著作中也一样。手册是用来查阅的，正如互联网上的搜索引擎一样。在需要的时候请尽管查阅细节\
    \ [(1)](https://www.gnu.org/software/bash/manual/bash.html)，但请先读这一本。\n\n本书基于作者使用和教学多种编程语言的长期经验。经验表明，学习编程最有效的方法是玩转有趣的示例。\n\
    \n来自速查表的示例 [(2)](https://devhints.io/bash)、“模板代码”示例、实际上能完成有用任务的强大技术示例、高级技巧和窍门示例、针对有趣问题的惊人解决方案。示例、示例、示例。\n\
    \n正是通过玩转那些激发灵感的代码片段，带来了那些“灵光一现”的时刻，让我们想大喊：\n\n“哇，我竟然！”\n“原来是这样做的！是的，现在我真的懂了！”\n\
    “太有趣了，让我自己试一下！”\n“现在，我只要稍微改一下这里就能解决我自己的那个迷人的问题！”\n\n## 排版规范\n\n- 不在英语中通用的技术术语和软件包、内联代码片段等，均使用等宽“计算机”字体原样呈现，例如：`wget`\n\
    - 较大的 Bash 代码块会额外进行块设置并部分着色\n- 特殊术语使用单引号，例如：‘guru’。有时这可能带有某种温和的讽刺\n- 作者的强调通过斜体文本表示\n\
    - 缩写大写，并在首次使用后在圆括号内介绍形式：(REPL)\n- 双引号“……”照常标记对话\n- 链接引用放在圆括号内 (1)\n\n## 在任何地方用\
    \ Bash 编程\n\n本书的目标之一是让每个人都能触及编程。实际上，停止点击图标一段时间，转而运行强大的、自动化的通用 Bash 脚本其实很容易。这是计算专业的秘密，被称为命令行界面\
    \ (CLI)。\n\nBash 内部有一些 Unix/Linux 工具（命令），例如 `wget`，它们让你能够直接访问整个互联网以及你可能使用的所有服务器和云服务。这一切都以有序且自动的方式进行。\n\
    \n在 `Linux` 和 `MacOS` 下，无需安装任何东西。只需打开默认终端即可开始。终端是一个交互式的 Bash 会话。\n\n在 `Windows`\
    \ (10-11) 上，安装 Windows Linux 子系统 (`WSL`)。然后你就可以获得真正的操作系统的大部分好处，而无需划分磁盘和双启动电脑。最重要的是，你会得到一个小\
    \ Linux (Ubuntu) 图标，它会激活具有完整文件系统访问权限的真实 Bash 终端。\n\n可以在 Android 手机上使用 Bash 编程。安装一个名为\
    \ `F-Droid` 的应用。这又允许安装最新版本的 `Termux`，它是一个包含 Bash 的完整 Linux 系统。你也可以安装任何其他 Linux\
    \ 编译器和应用程序，尽管它们可能会占用手机很大一部分内存。让我们希望 `Termux` 的开发者最终能让使用 SD 卡成为可能。\n\n## 方言与风格\n\
    \n当在互联网上搜索与 Bash 相关的问题和问题的答案时，很快就会发现问题很多，但答案更多。这部分归功于 Shell 编程悠久而活跃的历史。乍一看，并不明显哪些建议的方法或风格是“过时的”、“陈旧的”、“属于某种被遗忘的方言或仅仅是错误的”。同时，通常有多种各有优的解决方案。因此，本书倾向于简单、统一、理性的风格。为了降低复杂性，很少提供或讨论无关紧要的替代方案。并不是说没有其他有效的风格和解决方案。\n\
    \n## 为什么选择 Bash？\n\n> “用 Bash 还是不用 Bash，这是一个问题！”\n\nBash 脚本语言是‘老派’语言之一，可以追溯到 20\
    \ 世纪 80 年代中期。它最初是作为 Unix 项目的一部分联合开发的。这就是为什么它的某些 (Unix/Linux) 函数/工具与 C 是相同的。例如，打印命令\
    \ `printf`。Bash 是任何基于 Unix/Linux 操作系统 (OS) 面向的核心。这就是为什么今天它对资深系统管理员专家和熟练用户来说仍然重要。它的长寿充分说明了它的实力、易用性和多功能性。\n\
    \n正因为与操作系统的紧密集成，事实上，所有的 Unix/Linux 命令加上你可能安装或实现的任何内容，在 Bash 中都是直接可用且极易调用的。\n\n\
    ## 专业人士\n\n另一方面，如果你在犯蠢错误时需要大量的‘手把手教学’，如果你在大型协作项目中工作，如果你不介意更陡峭的学习曲线、长时间的编译和大型执行文件，那么你可能应该走向另一个极端使用\
    \ Rust。\n\n实际上，在同一个大项目中结合 Rust 及其卓越的速度和安全性与 Bash 是非常有价值的。Bash 非常适合有效地自动化整个项目管理：文件整理、移动、重命名、归档、更新、上传、下载、编译、备份、程序执行等。因此，可以兼得两者。\n\
    \n"
- fmt: '

    This book took shape when the author started using `Bash` within his TokenCrypt
    project [(4)](https://github.com/liborty/TokenCrypt), originally just for the
    prosaic convenience of it. Warming up to it, it came as a bit of a shock to realise
    that two modern programming styles, namely Logic Programming and Functional Programming,
    since then much loved and hyped in the academic circles, are in fact already available
    in `Bash`. Admittedly in a dormant and embryonic form but they are there. In retrospect
    view, `Bash` can be said to have been seminal to their development.


    `Bash` is said to be the language which many use (or need to use, or wish to use)
    but few understand. Maybe this book will help to change that.


    # First steps


    Anyone can certainly list a few commands like `cd ..; ls -al` in a script file
    and then run it. In fact, doing just that, is an excellent way to get started
    with `Bash` programming.


    Create a file called `myscript`, put some commands in it and make it executable
    with `chmod +x myscript`. Then just typing `./myscript` will make `Bash` execute
    all the commands contained in it.


    Apart from `Bash`, there are several other dialects of shell scripting. The convention
    dictates that scripts should always start on the first line with so called ‘shriek-bang’
    `#!`, which indicates which interpreter (shell) is wanted and where exactly it
    is to be found. Most often, it will be this: `#!/bin/bash`


    However, on Android phones, `Bash` will be installed in a non-standard location
    with a longer path. The specification should therefore always point to exactly
    where it resides, otherwise it may not run. Any normal commands will then follow,
    exactly as you might type them prompt. `#` turns the rest of the line into a comment.
    `Bash` is very terse. A lot can be happening in just line of code, so it is a
    good idea to be generous with explanatory comments.


    Note: sometimes it is good to try things out directly by Read Eval Print Loop
    (REPL), which is what interactive terminal is. It can happen after typing out
    the correct answer, command found. For example, try this little bit of arithmetic:
    `$((1+1))`. There is nothing wrong, really. The message is just `2` as well. You
    can stop it happening by using `echo` or `printf` commands, which drop their values
    (in this case not pass them back to REPL), like this: `echo $((1+1))`


    Moving beyond this, to really understand subtle points of `Bash` as a full programming
    language that opens up entirely new horizons, I hear some you exclaim: “Why not
    Python?”. It has to be said that `Bash` still holds some big advantages over Python
    and other similar languages (Ruby, etc.), making it easier to learn:


    1. `Bash` needs no installations and voluminous searching.

    2. The Read-Eval-Print-Loop (REPL) for trying things out is right there in any
    terminal.

    3. `Bash` is tightly integrated with the Operating System (OS), right of the box.
    This helps understand how OS works.

    4. The EIJAS principle ‘Everything is just a string’ (more on this later).


    # Chapters outline


    * **Introduction** - the why and how of `Bash`.

    * **Quoting Quoting Quoting** - develops understanding of fundamental principles:
    what is most needed for confident and successful `Bash` programming.

    * **Bash Branching** - the practicalities of `Bash`: conditionals, program control,
    functions, loops. An example of applying them to the common task of processing
    and interpreting arguments.

    * **Input-Output (I/O)** handling is an important part of any language. In `Bash`
    this applies especially. Its streams, redirections and pipes act like glue that
    ties everything together. That means internally as well as taking care of the
    traditional role of communicating with the outside world. After this follow increasingly
    sophisticated applications and projects with examples of code.

    * **Amazing Arithmetic** is a useful project exploiting the EIJAS property of
    `Bash` to implement fixed point arithmetic. This is achieved by inserting the
    decimal point in the right place in the strings without any external utilities,
    just using the default integer arithmetic.

    * **SubShell Scheduling** is an advanced project that shows how to automatically
    orchestrate background jobs in separate threads. It deploys an interesting technique
    of program self modification. It is also a good template for using files and directories
    effectively.

    * **Conclusion**

    * **Link References**


    # Quoting, Quoting, Quoting


    `Bash` is nowadays considered by sloppy programmers to be prone to programming
    errors but it is really not bad, as long as we watch out for a few pitfalls and
    ‘gotchas’.


    The main potential problem are spaces in the wrong places. This is the price we
    pay for programs and data all being one and the same thing to `Bash`. You may
    still be able to read this. However, computers are ‘syntax nazis’. They ‘hate’
    any typing errors or ambiguities. Spaces are important to the structure of any
    text, which means they are also important to the structure of the `Bash` programming
    language.


    Everything in `Bash` is just a string of text ( EIJAS principle). That means `Bash`
    only knows about and understands chunks of text. We will see later how this simplicity
    brings about some amazing opportunities and advantages.


    The first and foremost advantage is simplicity: neither the user, nor `Bash`,
    have to worry about all kinds of different types and checking them all. There
    is really only text and sometimes explicitly annotated text interpreted as digits.


    However, with power comes responsibility. We have to be prepared to get more errors
    and therefore it is wise to test small units of program at a time. In case of
    big trouble, that means hard to find bugs, it is highly recommended to introduce
    extra `printf` statements into the program code to print out values of variables
    that you suspect may be wrong. This method is almost always more focussed and
    therefore more successful than uninformed general debugging in any language. Afterwards,
    it is easy to comment out or to delete those extra statements.


    In order to handle text effectively in different situations, there are several
    different ways of annotating or quoting it. Each has its own specific effects
    and determines how the quoted text is to be interpreted and/or acted upon. It
    is important to understand them all and the differences between them.


    ## Individual characters


    First of all, there is ‘escaping’ of some special and non-printable individual
    characters. Funny example:


    ```

    printf "My book sales reached 200%%\n"

    ```


    There are specific rules which only apply within printf formatting strings. Here
    the non-printable character ‘newline’ is encoded as `\n`. The printable character
    `%` is escaped by being doubled, as otherwise it has a different interpretation
    within the printf formatting string. In other words, it is a ‘reserved character’,
    just in this context.

