    \ with any combinations of the listed options, preceded by `-` and followed by\
    \ three directory paths. The options, as their name suggests, give the program\
    \ optional capabilities and modes of operation. For example:\n\n`ncrpt -rbxuc\
    \ dir1 dir2 dir3`\n\n# Input-Output\n\nOf all the programming languages, Bash\
    \ must have just about the simplest and most convenient input/output (I/O) handling.\n\
    \n## Basic terminology\n\n*   files\n\n    *   are usually stored on a filesystem,\
    \ where they are identified by their path, filename and filename extension(s)\n\
    \n    *   when stored on the internet, then their universal resource locator (URL)\
    \ fulfils the role of the path. These files need to be copied (downloaded) over\
    \ the network by some utility program, such as `scp` (ssh secure copy) or `wget`.\
    \ Once securely on the local filesystem, they can be read and manipulated much\
    \ faster and more securely.\n\n*   streams are sequences of bytes, i.e. the actual\
    \ data, with an associated internally memorised current position. Reads and writes\
    \ automatically advance that position.\n\n    *   input streams are for reading\n\
    \n    *   output streams are for writing\n\n    *   in-out streams are for both\
    \ reading and writing\n\n*   file descriptor (perhaps more accurately a stream\
    \ descriptor) is the means of referring internally, within a program, to a particular\
    \ stream of data. A program will use these to communicate with the ‘outside world’,\
    \ i.e. to read and write some data. The streams need to be named (in Bash actually\
    \ by single digit characters) because several different streams can be used at\
    \ the same time for different kinds of data and different purposes. For example,\
    \ one stream for writing clean results to a file and a separate one for writing\
    \ out warnings (and errors) which we do not want intermixed with the results.\n\
    \nOpening a file associates a nominated stream descriptor with the named file\
    \ and specifies if that file is to be used for input, output, or both.\n\nStream\
    \ descriptors in Bash are just digit characters 0-9\\. The first three, 0-2, have\
    \ special meanings. They are always opened automatically in every shell:\n\n*\
    \   0 standard input (known as stdin), is the default input to any Bash command.\n\
    \n*   1 standard output (known as stdout), is the default output from a command.\n\
    \n*   2 standard error (known as stderr), is the ‘error’ output.\n\n*   3 to 9\
    \ can be explicitly opened and assigned to files or other streams by the user.\n\
    \n0-2 should not be opened for a real named file. In fact, they have predefined\
    \ system files associated with them, see later. Their streams of data are either\
    \ directed to processes and files with `<`, `>`, `>>` or sent/received to/from\
    \ a pipe `|`, which is a hidden buffer inserted by Bash between two ‘piped’ commands,\
    \ whereby the first one writes to it and the second one (asynchronously) reads\
    \ from it.\n\n## The meaning of zero\n\nThis is a word of warning. Zero is for\
    \ some reason very important to Bash. Its designers must have been very fond of\
    \ it. Oh, seeker, realise the meaning of zero and become a Bash Master!\n\nVariable\
    \ `$0` always holds as its value the path and the name of the current program\
    \ or function. It is often used by the program to identify itself as the source\
    \ of an error message. `PROGN=${0##*/}` holds its root name (with the path up\
    \ to the last / stripped off) in our examples.\n\nNot to be confused with `0`\
    \ written to stdout to indicate a successful outcome.\n\nWhich happens to be the\
    \ same as the value of ‘true’.\n\nWhich also happens to be the same as the character\
    \ `0` (binary ascii value 48) in strings etc.\n\nNot to be confused with `0` within\
    \ an arithmetic evaluation context `$(( 0 ))`, where it means the integer zero\
    \ (binary value 0).\n\nNot to be confused with the character `0` where stream\
    \ identifiers might be expected, as there it becomes the standard input (stdin)\
    \ stream identifier!\n\nAll clear now?\n\n## Using I/O\n\nThe streams (1-2) are\
    \ often simply directed (written) to real files with `> $FILENAME`, without having\
    \ to ‘open’ those files.\n\n`>> $FILENAME` will append to the end of an existing\
    \ file instead of creating a new one (or overwriting and existing one).\n\nTo\
    \ append several files at once into stream 0 (stdin), we can invoke program `cat\
    \ $F1 $F2` or `tac $F2 $F1`, where `tac` presents the file’s lines backwards.\n\
    \nSometimes we may wish to read chunks of an input file and to remember the current\
    \ reading position in-between, down to the last byte. It is better to define our\
    \ own dedicated stream to do this. Let us open file `$F1` for reading on stream\
    \ `3`. We use special command `exec` which replaces the default shell stream(s)\
    \ with the new one(s). In this case, it adds the newly created stream 3:\n\n```\n\
    1 exec 3<$F1 || {\n2   printf \"$PROGN: '$F1' failed to open for reading\\n\"\
    \ >&2\n3   exit 2\n4 }\n```\n\nTo open an output file, use `>` and for both input\
    \ and output, use `<>`.\n\nExample: invoking utility program `head` to read just\
    \ the next `$N` bytes from stream `3` and writing them to `$FILE2`:\n\n```\n1\
    \ head -c $N <&3 >$FILE2\n```\n\nThe next execution of this command will read\
    \ the following `$N` bytes from `$FILE1` and so on. Note that, unlike `cat` and\
    \ `tac`, this disregards the ‘lines structure’ of text files and thus is particularly\
    \ suitable for reading binary files."
