  trans: "\nBash 也拥有 `functions`（函数），它们的工作方式与任何外部脚本都一样，不同之处它们以文本形式插入到被使用的脚本中。在定义它们的文件中调用它们的好处是，它们不会在子壳（subshell）中运行。\n\
    \n尽管有这些便利性，但也存在意外的全局变量冲突的危险，这通常会导致严重的错误。因此，强烈建议对函数自身的工作变量使用 `local` 声明。这可以将它们隔离开来，就像该函数实际上位于自己一个独立的脚本文件中并在子壳中运行一样。请注意，函数还会继承全局声明并属于其脚本（shell）的任何文件流标识符。关于输入/输出的更多内容稍后介绍。\n\
    \n在函数中，就像在任何程序脚本中一样，形式参数通过特殊变量 `$1`、`$2`……等来标识。它们一一对应，并赋值为在函数/程序调用时提供的实际参数值。\n\
    \n为了从 Bash 函数中返回 0-255 以外的值，通常应该使用全局 `stdout` 流 1。也就是说，在最简单的情况下，在函数内部使用 `echo`\
    \ 或 `printf` 命令将其返回值写入标准输出。这将作为函数调用的结果返回。\n\n这里有一个带形式参数 `$1` 的递归函数示例。\n\n在编写递归函数时，终止条件应该始终放在第一。注意这里使用了大量但在此遗憾是必要的算术评估双括号：`$((...))`。为了减少括号的数量，递归调用本身在这里通过反引号子壳评估（有时称为命令扩展）进行评估，它的工作方式与\
    \ `$(...)` 相似：\n\n```\n1 function factorial {\n2   [ $1 -lt 3 ] && echo $1 ||\
    \ \\\n3      echo $(( $1*`factorial $(( $1-1 ))` ))\n4 }\n5 time factorial 20\n\
    6 2432902008176640000\n7 real    0m0.027s\n8 user    0m0.026s\n9 sys     0m0.005s\n\
    ```\n\n请注意，对于较小的参数，答案将在没有警告的情况下溢出，因为 21 的阶乘已经大于 64 位整数的最大值。\n\n使用迭代实现将比上述堆叠多个子壳调用更有效。在这里我们使用了“类\
    \ C”形式的迭代 `for` 循环，它递减到 2，并将所有（降序）整数累积乘到局部变量 `F` 中。如果提供的参数小于三，循环将什么都不做，参数值将立即作为答案回显到\
    \ stdout。\n\n```\n 1 function itfactorial {\n2   local F=$1\n3   for (( i=$1-1;\
    \ i>1; i-- )); do F=$(( $F*i )); done\n4   echo $F\n5 }\n6 time itfactorial 20\n\
    7 2432902008176640000\n8 real    0m0.000s\n9 user    0m0.000s\n10 sys     0m0.000s\n\
    ```\n\n这次由于是在当前 shell 中进行评估的且没有使用栈，速度快到计时器都无法记录。\n\n然而，应该指出的是，Bash 作为一种解释型语言，并不算快。因此，最大速度很少是主要关注的问题。速度是相对的。如今，得益于更快的处理器，即使是\
    \ Bash 的运行速度也比几年前的 C 等快速语言要快。复兴的另一个良好理由？尽管如此，Bash 更强大的点无疑是便利性、多功能性和紧凑性。\n\n##\
    \ 循环和控制语句\n\nBash 还配备了常用的 `while`、`until` 和 `for` 迭代循环，外加 `case` 语句。这不是一个困难或有趣的话题，所以我们不会对其进行过多探讨。通过简单阅读一些现有的实用代码可以更轻松地吸收。我们已经遇到过\
    \ `for` 循环的一种形式。`case` 语句将在接下来的章节中的某些示例中使用。\n\n无限循环（依赖在数据耗尽或类似情况下调用 `break` 退出）可以是一种非常有用的机制。它也被用于人机交互，其实一个很好的例子是\
    \ REPL（读取-评估-打印循环）。用户通常通过 `Ctrl-D` 关闭输入或通过 `exit` 关闭终端来手动终止此类交互式会话。如果你在终端中尝试以下示例，请准备好快速输入\
    \ `Ctrl-C` 来终止它们。请注意它们都设置了无限循环。\n\n```\n1 while true; do\n2   echo 'I am a lumberjack\
    \ and I am OK'\n3 done\n```\n\n```\n1 until false; do\n2   echo 'I sleep all night\
    \ and work all day'\n3 done\n```\n\n当然，`while` 语句更常用的形式是读取某些普通文本文件 `$F`。在这里，`read`\
    \ 语句将在末尾返回 `false`：\n\n```\n1 cat \"$F\".txt | while read LINE; do\n2   processline\
    \ $LINE\n3 done\n```\n\n我们已经遇到过类 C 版本的 `for` 命令，但它还有两种更有用的形式。这种形式对当前目录下的所有 `txt`（文本）文件应用\
    \ `processfile`：\n\n```\n1 for F in ./*.txt; do\n2   processfile \"$F\"\n3 done\n\
    ```\n\n这个版本的 `for` 以步长 3 遍历 0..100 的取值范围（并将它们全部打印在同一行）：\n\n```\n1 echo 'Multiples\
    \ of three: '\n2 for MULT3 in {0..100..3}; do\n3   printf \"$MULT3 \"\n4 done\n\
    ```\n\n为止，我们讨论了评估和连接命令的各种可能性、条件语句、函数和循环语句。\n\n到目前，你应该能够阅读真实的 Bash 代码了。因此，我们现在将转向一些有趣的代码和项目示例，并附有说明注释。\n\
    \n## 处理参数\n\n将参数传递给程序和函数是使其更通用、更有用的主要方法。它是抽象过程的一个重要部分。因此，大多数 Bash 脚本都期望某些参数，并且需要处理（读取）这些参数。\n"
- fmt: "\n```bash\n#!/bin/bash\n# This program expects some options, \n# followed\
    \ by three mandatory directory paths.\n\n# The program path/name is always in\
    \ $0\\. \n# Here we chop off the path \n# before the program's name, with `##*/`\n\
    PROGN=${0##*/}\n\n# Frequently used messages subsumed into functions;\n# their\
    \ output is redirected to stderr with >&2\nfunction usage {\n   printf \"Usage:\
    \ $PROGN \\\n   [-h][-b][-c][-x][-q][-r][-u][-v][-z] \\\n   indir keydir outdir\\\
    n\" >&2\n}\n\nfunction helpmsg {\n   usage\n   printf \"\\t%s\\n\" \\\n     '-b\
    \ | --b64 : test for base64 encoded files' \\\n     '-c | --clean : the archive'\
    \ \\\n     '-h | --help : print this text' \\\n     '-q | --quiet : turn off the\
    \ final summary' \\\n     '-r | --recurse : process also subdirectories' \\\n\
    \     '-u | --update : the archive' \\\n     '-v | --verbose : detailed reporting'\
    \ \\\n     '-x | --hex : test for hexadecimal files' \\\n     '-z | --zstd : use\
    \ zstd compression' >&2\n   exit 1\n}\n\n# Use the utility `getops` for options\
    \ parsing: \n# puts listed options, that is words that can  follow -,\n# into\
    \ $OPT\nwhile getopts hbcxqruvz-: OPT; do\n  # Long options start with --,\n \
    \ # this gets detected by the last option in the list: `-`\n  # then assign the\
    \ long option name to $OPT manually:\n  if [ \"$OPT\" = \"-\" ]; then\n    # found\
    \ --: reset OPT and OPTARG\n    OPT=\"${OPTARG%%=*}\"  # extract long option name\n\
    \    # extract long option argument (here empty)\n    OPTARG=\"${OPTARG#$OPT}\"\
    \ \n    # remove any assignments `=` from long options\n    OPTARG=\"${OPTARG#=}\"\
    \ \n  fi\n  # now process and record all options, in any order\n  # here we set\
    \ their variables, \n  # later detect them being set, e.g. with: [ -n \"$VAR\"\
    \ ]\n  case \"$OPT\" in\n    h | help ) helpmsg;;\n    b | b64 ) B64TEST=0;;\n\
    \    c | clean ) CLEAN=0;; \n    x | hex ) HEXTEST=0;;\n    q | quiet ) QUIET=0;;\n\
    \    v | verbose ) VERBOSE=0;; \n    r | recurse ) RECURSE=0;;\n    u | update\
    \ ) UPDATE=0;;\n    z | zstd ) COMPRESSOR=zstd;; \n    ??* ) printf \\\n    \"\
    $PROGN quitting, bad long option: $OPT\\n\" >&2\n       usage; exit 2;; \n   \
    \ # bad short option (will be reported via getopts) \n    *) exit 2;; \n  esac\n\
    done\n# Remove all parsed options and args from their\n# list $@  \n# so that\
    \ we can parse the remaining arguments.\n# The next one will be in $1, \n# as\
    \ if no options were given: \nshift $((OPTIND-1)) \n\n# Validate the input directory\n\
    [ -d \"$1\" ] || { \n   printf \"$PROGN: input directory $1 not found\\n\" >&2\n\
    \   exit 2\n}\n...\n# optional final report\n[ $QUIET ] || { printf ... } \n```\n\
    \nNow, the user can invoke this program with any combinations of the listed options,\
    \ preceded by `-` and followed by three directory paths. The options, as their\
    \ name suggests, give the program optional capabilities and modes of operation.\
    \ For example:\n\n`ncrpt -rbxuc dir1 dir2 dir3`\n\n# Input-Output\n\nOf all the\
    \ programming languages, `Bash` must have just about the simplest and convenient\
    \ input/output (I/O) handling.\n\n## Basic terminology\n\n*   files\n    *   are\
    \ usually stored on a filesystem, where they are identified by their path, filename\
    \ and filename extension(s)\n    *   when stored on the internet, then their universal\
    \ resource locator (`URL`) fulfils the role of the path. These files need to be\
    \ copied (downloaded) over the network by some utility program, such as `scp`\
    \ (ssh secure copy) or `wget`. Once securely on the local filesystem, they can\
    \ be read and manipulated much faster and more securely.\n*   streams are sequences\
    \ of bytes, i.e. the actual data, with an associated internally memorised current\
    \ position. Reads and writes automatically advance that position.\n    *   input\
    \ streams are for reading\n    *   output streams are for writing\n    *   in\
    \ input streams are for reading output streams are for writing\n"
