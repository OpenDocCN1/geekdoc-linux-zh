    since then much loved and hyped in the academic circles, are in fact already available
    in Bash. Admittedly in a dormant and embryonic form but they are there. In retrospect
    view, Bash can be said to have been seminal to their development.


    Bash is said to be the language which many use (or need to use, or wish to use)
    but few understand. Maybe this book will help to change that.


    ## First steps


    Anyone can certainly list a few commands like `cd ..; ls -al` in a script file
    and then run it. In fact, doing just that, is an excellent way to get started
    with Bash programming.


    Create a file called `myscript`, put some commands in it and make it executable
    with `chmod +x myscript`. Then just typing `./myscript` will make Bash execute
    all the commands contained in it.


    Apart from Bash, there are several other dialects of shell scripting languages.
    The convention dictates that the scripts should always start on the very first
    line with the so called ‘shriek-bang’ `#!`, which indicates which particular interpreter
    (shell) is wanted and where exactly it is to be found. Most often, it will be
    just this: `#!/bin/bash`


    However, on Android phones, Bash will be installed in a non-standard location
    with a longer path. The path specification should therefore always point to exactly
    where on the filesystem Bash resides, otherwise it may not run.


    Any normal commands will then follow, exactly as you might type them to the terminal
    prompt. Hash `#` turns the rest of the line into a comment. Bash is very terse.
    A lot can be happening in just one line of Bash code, so it is a good idea to
    be generous with explanatory comments.


    Note: sometimes it is good to try things out by typing them directly to the Read
    Eval Print Loop (REPL), which is what an interactive Bash terminal is. It can
    happen that after typing out the correct answer, the REPL will add a complaint:
    `command not found`. For example, try this little bit of arithmetic: `$(( 1+1
    ))`. There is nothing wrong, really. The message is just Bash trying to evaluate
    the answer `2` as well. You can stop it happening by using `echo` or `printf`
    commands, which drop their values (in this case do not pass them back to REPL),
    like this: `echo $(( 1+1 ))`


    Moving beyond this, to really understand the subtle points of Bash as a ‘full-on’
    programming language, that opens up entirely new horizons.


    I hear some of you exclaim in horror: “Why not Python?”. It has to be said that
    Bash still holds some big advantages over Python and other similar interpreted
    scripting languages (Ruby, etc.), making Bash easier to learn as the first programming
    language:


    1.  Bash needs no installations and voluminous libraries searching.


    2.  The ‘Read-Eval-Print-Loop’ (REPL) for trying things out is right there, in
    any terminal. It is recommended to open a terminal alongside this book and experiment
    with the code.


    3.  Bash is tightly integrated with the Operating System (OS), right out of the
    box. This has the side benefit that learning Bash, you will also get to understand
    much better how your OS works. This is somewhat like what learning Latin used
    to do for european human languages. The same can not be said for Python, etc.


    4.  The EIJAS principle = ‘Everything is just a string’ (more on this later).


