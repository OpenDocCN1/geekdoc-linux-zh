    ![](resources/title_page.jpg)


    ![Bash for Fun](resources/title_page.jpg)


    # Bash for Fun


    ## Bash Programming: Principles and Examples


    ### Libor Spacek


    This book is for sale at [http://leanpub.com/bashforfun](http://leanpub.com/bashforfun)

    This version was published on 2022-01-08

    ![publisher''s logo](resources/leanpub-logo.png)


    This is a [Leanpub](http://leanpub.com) book. Leanpub empowers authors and publishers
    with the Lean Publishing process. [Lean Publishing](http://leanpub.com/manifesto)
    is the act of publishing an in-progress ebook using lightweight tools and many
    iterations to get reader feedback, pivot until you have the right book and build
    traction once you do.


    © 2021 - 2022 Libor Spacek

    ISBN for EPUB version: 978-0-6453971-0-9


    ## Table of Contents


    ## Guide


    1. [Begin Reading](#chap00.xhtml)


    # Introduction


    The intended audience of this book are all those who want to gain a better understanding
    of their computers. Those who wish to use Bash effectively and with confidence.
    This book spans the full range of Bash programming skills: from beginners to advanced,
    with amusing anecdotal insights and examples of doing useful things.


    The ignorant ‘clicking of buttons’ has done much disservice to laudable ambitions
    of programming education over the past four decades or so. It is time to rediscover
    the ancient lore! You, too, will become a wizard of retro programming. Armed with
    this book, you will massively increase your productivity and gain true ownership
    of your device.


    This book is for you if in the past you got waylaid and discouraged from programming,
    if you never even started or if you ever thought: “surely, there must be a simpler
    and better way of doing this!”.


    Above all, what you will discover here is that one most rare and precious thing:
    understanding.


    This book is definitely not another boring reference manual. Real programming
    is a skilful art. This applies especially to programming in Bash. Art is not easily
    learnt from manuals. Not even from pedagogically perfectly organised treatises
    full of exhortations and exercises. Manuals are for looking things up, same as
    are search engines on the internet. By all means, look up the details as and when
    needed [(1)](https://www.gnu.org/software/bash/manual/bash.html) but please read
    this first.


    This book is based on the author’s lifetime experience with using and teaching
    numerous programming languages. The experience has shown that the most effective
    way to learn programming is by playing with fun examples.


    Examples from cheat sheets [(2)](https://devhints.io/bash), examples of ‘boiler
    plate’, examples of powerful techniques that actually accomplish useful things,
    examples of advanced tips and tricks, examples of amazing solutions to interesting
    problems. Examples, examples, examples.


    It is playing with those inspiring snippets of code that brings on those ‘eureka’
    moments, when we want to shout:


    “Wow, I did not know that!”

    “So, this is how to do it! Yes now I really get it!”

    “What fun, let me try this myself!”

    “Now, let me just change this a bit and it will solve my own fascinating problem!”


    ## Typesetting conventions


    - technical terms and software packages that are not in common English use, inline
    bits of code, etc, are all literalised in a fixed width ‘computer’ font like this:
    `wget`

    - bigger chunks of Bash code are additionally block set and partially coloured

    - special terms are single quoted, e.g.: ‘guru’. Sometimes this may involve a
    measure of gentle irony

    - author’s emphasis is indicated by italicised text

    - acronyms are capitalised and introduced after their first use in parenthesis
    (round brackets): (REPL)

    - double quotes “…” mark, as usual, speech

    - link references are placed in round brackets (1)


    ## Program in Bash anywhere


    One of the objectives of this book is to make programming accessible to everybody.
    It is actually quite easy to stop clicking on the icons for a while and start
    running powerful, automated, general Bash scripts instead. It is the secret of
    the computing professionals, known as the Command Line Interface (CLI).


    There are some Unix/Linux utilities (commands) within Bash, for example `wget`,
    that put at your fingertips direct access to the whole of the internet and all
    the servers and cloud services that you may have been using. All in an organised
    and automated fashion.


    Under `Linux` and `MacOS`, there is no need to install anything. Just open the
    default terminal and you are ready to go. The terminal is an interactive Bash
    session.


    Under `Windows` (10-11), install Windows Subsystem for Linux (`WSL`). Then you
    get most of the benefits of a proper operating system, without having to partition
    your disks and dual boot your computer. Most of all, you get a little Linux (Ubuntu)
    Icon, which activates the real Bash terminal with full access to the whole file
    system.


    It is even possible to program in Bash on a mobile Android phone. Install an app
    called `F-Droid`. That in turn will allow the installation of the latest version
    of `Termux`, which is a fully fledged Linux with Bash included. You can also install
    any other Linux compilers and applications, even though they will probably eat
    up a fair chunk of your phone’s memory. Let us hope that the developers of `Termux`
    will, in time, make it possible to use an SD.


    ## Dialects and styles


    When searching the internet for answers to questions and problems related to Bash,
    it quickly becomes apparent that there are many questions but even more answers.
    This is partly due to the long and active history of shell programming. At first
    glance, it is not all obvious, which of the suggested methods or styles are ‘deprecated’,
    outdated, pertaining to some obscure dialect fallen to disuse, or just plain wrong.
    At the same time, there are often more than one solutions with different merits.
    Accordingly, this book prefers a simple, unified, rational, style. Insignificant
    alternatives are rarely offered or discussed, in order to keep the complexity
    down. That is not to say that other valid styles and solution are not ‘out there’.


    ## Why Bash?


    > “To Bash or not to Bash, that is the question!”


    Bash shell script is one of the ‘old school’ languages, going back to mid1980s
    and beyond. It was originally developed as part of the Unix project in conjunction
    with C. That is why some of its (Unix/Linux) functions/utilities are in fact the
    same as in C. For example, the print command `printf`. Bash is the user facing
    heart of any UNIX/Linux based Operating System (OS). That is why today it remains
    important to grey bearded systems admin gurus and skilled users alike. Its longevity
    speaks volumes about its proven strength, usability and versatility.


    It is because of this close integration with the OS that, in fact, all Unix/Linux
    commands, plus anything that you might install or implement yourself, are all
    directly available and trivially simply invokable in Bash.


    ## Notes for the professionals


    On the other hand, if you need a lot of ‘hand holding’ in case you do something
    silly, if you work on large collaborative projects and if you do not mind a much
    steeper learning curve, long compilations and large executables, then probably
    you should go to the other extreme and use Rust.


    Actually, there is a lot to be said for combining within the same overall project
    Rust and its prodigious speed and safety, with Bash. Bash is great for effectively
    automating the overall project administration: files marshalling, moving, renaming,
    archiving, updating, uploading, downloading, compiling, backing up, program executions,
    etc. Thus one can get the best of both worlds.

    '
