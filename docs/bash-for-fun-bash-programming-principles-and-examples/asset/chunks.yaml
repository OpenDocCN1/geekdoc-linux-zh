    这本书的成形是因为作者在自己的 TokenCrypt 项目 [(4)](https://github.com/liborty/TokenCrypt) 中开始使用
    `Bash`，起初仅仅是为了处理平庸工作的便利。随着对它的逐渐熟悉，他有些惊讶地发现，两种现代编程风格——即逻辑编程和函数式编程（自那时以来在学术界备受推崇和炒热），实际上已经实现在
    `Bash` 中。诚然，虽然它们还处于休眠和胚胎阶段，但它们确实存在。回首来看，可以说 `Bash` 对它们的发展具有开创性意义。


    `Bash` 被认为是一种许多人使用（或需要使用、或希望使用）但很少有人理解的语言。也许这本书将帮助改变现状。


    # 第一步


    任何人当然可以在脚本文件中列出诸如 `cd ..; ls -al` 这样的命令并运行它。事实上，这样做是入门 `Bash` 编程的极佳方式。


    创建一个名为 `myscript` 的文件，在其中放入一些命令，并使用 `chmod +x myscript` 使其具有执行权限。然后只需输入 `./myscript`，`Bash`
    就会执行其中包含的所有命令。


    除了 `Bash` 之外，还有其他几种 Shell 脚本变体。规定脚本的第一行应该始终以所谓的“shriekbang” `#!` 开头，这指示了需要哪种解释器（shell）以及它具体的所在位置。通常情况下，它是：`#!/bin/bash`


    然而，在 Android 手机上，`Bash` 会安装在一个非标准的、路径较长的位置。因此，规范应该始终指向它所在的确切位置，否则它可能无法运行。随后的任何普通命令都将像你在提示符中输入它们时一样执行。`#`
    将行的剩余部分变为注释。`Bash` 非常简洁。仅仅的一行代码就可能发生很多事情，因此慷慨地编写解释性注释是一个明智的主意。


    注意：有时直接通过读取-评估-打印循环（REPL）尝试操作是很好的，这就是交互式终端的本质。在输入正确答案后，可能会出现“已找到命令（command found）”。例如，尝试这段简单的算术运算：`$((1+1))`。这其实没有问题，输出信息也是
    `2`。你可以使用 `echo` 或 `printf` 命令来阻止这种情况发生，这些命令会丢弃它们的值（在此情况下不将其传回 REPL），如下所示：`echo
    $((1+1))`


    更进一步，为了真正理解 `Bash` 作为一门开启了全新视野的完整编程语言的微妙之处，我听到一些人惊叹：“为什么不用 Python 呢？”必须说，`Bash`
    相比 Python 和其他类似语言（Ruby 等）仍然具有一些巨大的优势，使其更容易学习：


    1. `Bash` 不需要安装和大量的搜索。

    2. 任何终端中都有可以直接用于尝试操作的读取-评估-打印循环（REPL）。

    3. `Bash` 与操作系统（OS）紧密集成，开箱即用。这有助于理解操作系统是如何工作的。

    4. EIJAS 原则“一切都是字符串”（后文将详细介绍）。


    # 章节目录


    *   **引言** - `Bash` 的为什么以及如何做。

    *   **引号引号（Quoting Quoting Quoting）** - 对基本原理的理解：进行自信且成功的 `Bash` 编程最需要什么。

    *   **Bash 分支** - `Bash` 的实用性：条件判断、程序控制、函数、循环。将它们应用于处理和解释参数这一常见任务的示例。

    *   **输入/输出 (I/O) 处理**是任何语言的重要部分。在 `Bash` 中这尤为如此。它的流、重定向和管道像胶水一样将一切连接在一起。这意味着它既处理内部逻辑，也承担了与外部通信的传统角色。之后是带有代码示例的日益复杂的应用程序和项目。

    *   **神奇算术** 是一个实用的项目，利用 `Bash` 的 EIJAS 属性来实现定点算术。这是通过在字符串的正确位置插入小数点实现的，不需要任何外部工具，仅使用默认的整数运算。

    *   **子 调度 (SubShell Scheduling)** 是一个高级项目，展示了如何在单独线程中自动调度后台作业。它采用了一种有趣的程序自修改技术。它也是有效使用文件和目录的良好模板。

    *   **结论**

    *   **链接引用**


    # 引号、引号、引号


    如今，`Bash` 被粗粗心的程序员认为容易产生编程错误，但它实际上并不糟糕，只要我们注意一些陷阱和“坑（gotchas）”。


    主要的潜在问题是空格位置错误。这是我们为 `Bash` 将程序和数据视为同一物而付出的代价。你可能还能读懂这些。然而，计算机是“语法纳西主义”。它们“讨厌”任何输入错误或歧义。空格对任何文本的结构都关重要，这意味着它们对
    `Bash` 编程语言的结构同样重要。


    `Bash` 中的一切都只是文本字符串（EIJ 原则）。这意味着 `Bash` 只知道并理解文本块。稍后我们将看到这种简单性如何带来一些惊的机会和优势。


    第一个首要的优势是简单：用户和 `Bash` 都不需要担心各种不同的类型并对它们进行检查。真的只有文本以及有时被显式注释为数字的文本。


    然而，能力越大责任越大。我们必须准备好更多的错误，因此一次测试一小单元程序是明智的。如果遇到大麻烦（即难以找到 bug），强烈建议在程序代码中引入额外的 `printf`
    语句，打印出你怀疑可能有错误的变量值。这种方法比任何语言中盲目的通用调试更有针对性，因此更成功。之后，可以很容易注释掉或删除这些额外的语句。


    为了在不同情况下有效处理文本，有几种不同的标记或引用方式。每种方式都有其特定的效果，并决定了引用文本如何被解释或执行。理解所有它们以及它们之间的差异非常重要。


    ## 字符


    首先，是对某些特殊和不可见的单个字符进行“转义”。一个有趣的例子：


    ```

    printf "My book sales reached 200%%\n"

    ```


    某些特定规则仅适用于 printf 格式化字符串。在这里，不可打印的字符“换行符”被编码为 `\n`。可打印字符 `%` 通过双倍处理来转义，否则它在 printf
    格式化字符串中具有不同的含义。换句话说，在这一语境下，它是一个“保留字符”。


