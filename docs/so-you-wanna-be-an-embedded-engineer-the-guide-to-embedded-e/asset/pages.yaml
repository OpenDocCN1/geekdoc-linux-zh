    the 2006 tables, you are in the 28% marginal tax bracket, so you are going to
    owe an additional $2,800 in federal tax on that bonus. You will also owe $1,530
    in FICA costs, for a grand total of $4,330. Since there are 26 pay periods in
    the year, you should ask your employer to withhold approximately an additional
    $167 per paycheck.


