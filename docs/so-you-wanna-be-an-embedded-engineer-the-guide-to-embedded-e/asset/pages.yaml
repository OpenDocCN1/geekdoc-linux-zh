    show when you''re carrying out these waste tasks. If your supervisor is a staunch
    supporter of the time-wasting process you''re trying to avoid, you need to be
    diligent. However, if they don''t have a strong personal interest in this piece
    of paperwork (or whatever it is), then you can safely ascertain the bare minimum
    requirements and do just that, nothing more.


    Possibly the worst case you have to deal with is where the official corporate
    manual tells you to use procedure ABC, but your assessor actively discourages
    that procedure in favor of some other technique XYZ. XYZ is typically a “legacy”
    procedure left over from your business unit''s preacquisition life as an independent
    corporation. If your supervisor absolutely refuses to let you do things the “corporate
    way,” you''re in a sticky situation. Although you''re covered by the argument
    that you were ordered to do things in a certain way, this argument has failed
    spectacularly for soldiers many times in the past and could easily fail for too.
    You suggest obeying your supervisor, email them and ask for clarification on how
    the way you are doing things matches with published company policy. The email
    is an audit trail that can be used to cover your rear if problems arise later.


    Step 4 has potential to save you time, especially for tasks that consist primarily
    of establishing an audit trail; ISO documents in particular. You''ll find that
    most of the requirements are already being generated in the form of meeting minutes,
    signed authorizations to purchase tooling, and so forth. Make sure you learn where
    these “free” outputs are generated, and you won''t need to run around chasing
    signatures suchlike.


    In summary: Although what I''m about to say is rank heresy, it''s a view held
    by engineers, and to which I personally subscribe. Procedures, no matter how well-designed,
    cannot create quality; they can, at best, only provide a standardized way of measuring
    it. You cannot avoid learning and using your company''s procedures, but you can
    try to minimize the negative work these procedures generate for you.'
