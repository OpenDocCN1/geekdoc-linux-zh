    system using a Flash-based microcontroller that doesn''t require special programming
    hardware. In practical terms, means selecting a part that supports in-system serial
    programming; these interfaces are usually very simple and easily connected to
    a PC with simple hardware (just a passive cable). I personally enjoy working with
