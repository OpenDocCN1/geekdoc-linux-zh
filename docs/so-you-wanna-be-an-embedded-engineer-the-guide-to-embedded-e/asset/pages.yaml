  md: 'Observe that the VCM informs the Kuro Box if it''s busy sweeping every the
    VCM sends status; this information is contained in FLAGS1 in the CMD_STATUS_REPORT
    packet. FLAGS1 bit 0 means that Stepper A was running when the status packet was
