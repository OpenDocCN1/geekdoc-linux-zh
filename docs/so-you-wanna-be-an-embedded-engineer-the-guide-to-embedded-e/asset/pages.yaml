    hardware in your box. This is a Good Thing, because PC components tend to have
    very short production lifecycles compared to parts specifically intended for embedded
    applications.


    At the opposite end of the scale, it is of course possible to build your entirely
    custom board around an x86-compatible processor. The difficulty level of such
    a task is depressingly formidable, however—it''s a job really best left to companies
    that specialize in this sort of design work. Even just to take a semiconductor
    vendor''s cookie-cutter reference schematic and lay it out on a PCB board to fit
    your own space requirements is assuredly no simple task. At the very least, you
    need to license a BIOS and tweak it to initialize the memory controller correctly
    for your board. There are subtle timing parameters that must be adjusted to account
    for layout-specific issues in high-speed memory subsystems—essentially, you need
    to skew the timing on each data line to account for the fact that the trace lengths
    and delays are different. Testing this and finding a set of timing values that
    works with all the memory configurations you intend to support is quite challenging;
    it''s difficult to get that works at all, and extremely difficult to certify that
    your design is going to work correctly across all combinations of temperature,
    installed memory type, ambient RF noise, and so.


    In these extremes, there are a variety of off-the-shelf x86-compatible single-board
    computers, backplane-based systems and processor/logic core modules designed for
    integration with custom mainboards.


    The most popular mainstream x86-compatible processors come from Intel, AMD and
    Via Technologies. (National Semiconductor used to build a range of Pentium-like
    processors collectively called Geode, but this product line was sold to AMD. You''ll
    still see chips with the National Semiconductor logo on them.) The other main
    contender is Transmeta™, which makes some innovative low-power-requirement x86
    emulator chips (Cruse™ and Effice™) used in some consumer laptops and single-board
    computers. AMD''s and Intel''s range of consumer chips (of the type you find in
    normal desktop and portable PCs) are the best performers; as brutal generalization,
    the more oddball parts like Geode, and the CPUs from Via™ and Transmeta, are designed
    with specific goals in mind; power efficiency (Via Eden™, Transmeta™), low embedded
    system cost for set-top box and Internet Appliance (IA) applications (this is
    where Geode was originally intended to find its niche), and so on. Be prepared
    to test your'
