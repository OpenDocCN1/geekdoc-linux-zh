  md: '# # Working for Yourself as an Embedded Engineer


    # ##5.1 Self-Employment for You? Risks and Benefits


    More or less once every quarter, I get together with a group of engineers and
    miscellaneous IT workers (website designers, database programmers, fuzzily named
    “technology consultants,” and so on). We have dinner and swap stories of managers,
    contracts and customers. Once in a while, a newbie visits the group to network
    and hears tales of the real world while they decide whether to start moonlighting.
    Most of these newbies subsequently decide to stick with their day jobs.


    Working as a full-time consulting embedded engineer is a difficult job. If you''ve
    only worked in a company environment before—even a relatively small company—you
    probably have no idea how much infrastructure helps you through every hour of
    the day. If you''re tired of process and procedure, if your day job leaves you
    exhausted and you''re looking for a life of freedom through self-employment, I''m
    afraid I have some harsh news for you. It''s substantially more work and (at least
    intermittently) more stressful to be successfully self-employed than to hold down
    a day job. Furthermore, if you don''t organize yourself and work to an established
    procedure, you''ll lose customers because of silly omissions or mistakes.


    The key difference between working for “the man” versus working for yourself is
    that self-employment lets you make your own choices about which opportunities
    to pursue. Here are some good reasons to start working for yourself.


    +   - You are currently earning at least twice your day-job hourly rate doing
    work as a moonlighter, and you want to focus all of your attention on where the
    money is. (More on this important topic later.)'
