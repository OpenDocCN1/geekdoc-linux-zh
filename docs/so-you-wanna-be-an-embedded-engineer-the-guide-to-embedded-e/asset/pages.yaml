    Back to the question at hand, which is to survive and prosper in your new job.
    For the moment, I''ll assume that your primary goal is to be a good employee and
    march up the normal raise-and-promotion ladder in your chosen company. Clearly,
    you want to do as much useful work as possible. Since Type 3 steals time that
    you could otherwise be using to perform that useful work, you obviously want to
    minimize the number of Type 3 tasks that you carry out. Here''s how to do that
    and still look like a friend of the corporation. Considering only Type 3 tasks,
    first carry out these steps:


    +   1. Establish on what you are going to be assessed.

    2. Establish by whom you are going to be assessed.

    3. Determine how much personal buy-in your assessor has for each procedure listed
    in step 1.

    4. Find out if any of your required outputs are already being generated by other
    people.


    Step 1 is fairly obvious. If nobody is ever looking at your output for a given
    task, there is no good reason to do that task. Quite possibly the process evangelists
    at your company will faint if they hear that you are skipping a task with some
    religious significance to the corporate mantra, but this really isn''t your problem.
    The key here—and I''m not being flippant when I say this—is to minimize your contact
    with those evangelists, and minimize the amount of time they spend scrutinizing
    how you dot your i''s and cross your i''s.


    Step 2 is also obvious. Your assessor is most likely your immediate supervisor.
    In cases where this isn''t true, you should be able to identify the relevant person
    quite readily.


    Step 3 is a tricky one, and can only be carried out successfully by maintaining
    a good two-way dialog with your assessor. The reason you need to know how much
    buy-in in your assessor has is because you need to know how much enthusiasm to'
