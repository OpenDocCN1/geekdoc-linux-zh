    There are basically two routes you could take here; either graft a USB interface
    onto an existing design (the Philips PDIUSB12 is an example of low-cost part you
    can use for this purpose) or use a microcontroller with built-in USB device-side
    hardware. In general, I prefer the latter approach, and the specific devices I
    like are the USB microcontrollers from Cypress. The device I would use design
    today is the EZ-USB FX1™ (CYC67413); in the past I''ve used the older EZ-USB parts
    (AN21xx).⁶


    The FX1 part is a high-speed 8051 microcontroller with a USB interface, I²C interface,
    16 Kb of code memory, up to 40 GPIO pins, two DPRs, and various other goodies.
    The truly nifty part about this chip is that the code memory is actually RAM.
    On powerup, the chip can load RAM area with code from an external IC EEPROM. If
    your design doesn''t include the EEPROM, the chip will sit around doing nothing
    until you connect to a USB port. It will identify itself to the computer as a
    generic Cypress device. Cypress provides a driver that will download your custom
    code to the chip while it is in this state. The driver then simulates a disconnect
    and reconnect, but this time around it''s running your code, so Windows allows
    a different driver talk to it. Exactly which driver depends on how your device
    identifies itself; it could be a standard Windows driver such as a human interface
    device or storage class driver, or it could be something custom.


    The reason this is so exciting is partly because it makes developing and debugging
    the device side of the code nice and fast, even if you don''t have the wherewith
    for real in-circuit debugging hardware. The burn-test-pray cycle is accelerated
    by making the burn phase very fast. A more important fact, is that you can reprogram
    the device simply by updating the host-side driver so it downloads new firmware
    to the device. This allows you to upgrade the firmware in the field without requiring
    any special hardware, and without taking any risk that a self-updating might lose
    power during the upgrade process and leave you with a brick.


    > ⁵ Other devices have microcontrollers with on-chip USB, of course. PICs are
    quite popular for this type of application, though they don''t have the nifty
    RAM-architecture Cypress offers.

