  md: '# Education 9


    Second, while your attention is focused on your field of choice, not only is your
    memory of those general college courses fading, but the practical state of the
    art in other topics is moving ahead without you. For example, if you took any
    college-level computer science courses in the 1990s, you probably learned Pascal.
    If you then went away and took a ten-year sabbatical working on a farm, you''d
    have come back to the engineering workforce to find Pascal almost dead and buried.³
    even as a teaching language. This is perhaps a silly example, but it would illustrate
    that if you spend any significant time—two or three years at most—away from an
    engineering topic, you''ll have to put in an appreciable effort to reclaim the
    learning curve when you come back to that topic.


    On the topic of work experience and how to obtain it, you should give serious
    consideration to an internship you''re currently following the “normal” life progression
    from high school to college to job day. Note that by the easiest way to get an
    internship is through your school. Make sure you are on the mailing lists for
    all the job fairs and internship opportunities. Most faculties regularly receive
    internship offers from corporations; these offers are sent out by email or posted
    on bulletin boards in the faculty buildings. Likewise, if you are on the faculty
    mailing list, you will receive regular invitations to job fairs and similar events.
    If you''re not at school, or your school for some reason doesn''t attract recruiters
    of this sort, you can find internships directly on the websites of most large
    companies. To find out what''s available in your area, a simple technique is to
    search job-related sites for local permanent positions, then go directly to the
    website of the employers you search uncovered and see what internships they have
    listed. (Although most job websites carry listings for internships as well as
    regular jobs, it has been my experience that these sorts of positions are mostly
    advertised through direct means.)


    One or two years as an intern (even just a couple of summers will help) will not
    only provide the real-world experience you need in order to stand out from the
    pack of recent graduates, but also as a practical matter you will probably have
    used this time to identify your key interests and areas of strength competency.
    This will go a long way ensuring that your next job application will be for


    > ³No mail, please. I''m aware that Delphi still exists, for example. However,
    Pascal''s primary purpose was as a teaching language—in which role it has been
    almost completely overthrown, mostly by Java.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'something you are good at and will enjoy. As almost a side benefit, the industry
    for a couple of years will also provide you with some networking opportunities
    that can be very useful when you''re looking for a permanent position.


    Unfortunately, if you''re already in the workforce, it is probably not practical
    for you to cut your regular income and go back to the internship stage. If you
    fall into this category, I encourage you to manufacture your relevant experiences.
    The object is to build a portfolio of devices you''ve built that are relevant
    to a future employer looking for an embedded engineer. Pick a field that interests
    you on a hobby basis—model aircraft, pets, cars, laser shows—almost anything is
    a good example. Develop some hardware that''s relevant to this field, and keep
    it in your portfolio. This assignment almost ridiculous when stated baldly, but
    if you think about it for a little while, you''ll be able to see an embedded project
    in any hobby or interest. You might develop an autopilot for a model aircraft,
    a doggy that uses machine vision to recognize your dog and opens only for it,
    an electronic ignition module for your 1960s car with its points-based ignition,
    and so on. By the way, amateur radio groups are a positive hive of people who
    can help you learn electronics—not just Rust, but all kinds of analog and digital
    material. Even if you don''t have interest in amateur radio for its own sake,
    it''s worth joining one of these clubs for access to your local wizards. Visit
    the American Radio Relay League at <http://www.arl.org/> to find out more about
    what''s available in your neighborhood.


    Now, if you''re on the corporation ladder, promotions beyond a certain point are
    generally much harder to obtain if you lack higher (postgraduate) study. You should
    think very carefully about this issue when selecting an undergraduate degree.
    For example, there are schools now offering bachelor''s degrees in something electrical
    engineering technology (the qualification is called a BSEET). This sounds perfectly
    like it''s the right kind of course, and if you were to skip the syllabus, you
    might see all the right buzzwords—ABET, hardware, firmware, software, programming,
    circuit design, and so on. However, the BSEET is a highly empirical course that
    is not designed to lead to further study—it''s sort of the engineering equivalent
    of trade school.

    I''d advise strongly that you steer clear of this degree program; at the institutions
    I''ve examined that the BSEET is no cheaper than the BSEE, it takes approximately
    the same length of time to complete, and it offers significantly less in terms
    of employability and postgraduate study options.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Education 11


    One parenthetical note about postgraduate study: The utility of higher education
    with respect to landing a good position is not merely asymptotic; it actually
    has a turning point. It''s a good thing to have a bachelor''s degree. It''s a
    great thing to have a master''s degree. Technical certificates, industry-specific
    qualifications and other addenda are fine (although not usually valuable by themselves).
    However, it can actually be slightly harder to get practical engineering jobs
    if you have a PhD—even to the point where some people intentionally leave off
    their résumé. The stated reasons for this old prejudice vary, but include pay
    scale requirements (PhDs are expensive), perceptions about PhD holders best suited
