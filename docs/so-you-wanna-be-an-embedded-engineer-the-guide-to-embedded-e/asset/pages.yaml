  md: '# Education 7


    The traditional route into embedded engineering (in the United States) four-year
    bachelor''s degree at an institution accredited by ABET, Inc. ABET is the official
    accreditor of tertiary programs in science and engineering; it is a consortium
    of twenty-eight assorted professional and technical societies. The homepage for
    this consortium is <http://www.abet.org/>, although there''s not much interest
    there for a casual reader.


    The *typical* (but far from universal) degree for embedded engineers would be
    a Bachelor of Science in Electrical Engineering (BSEE). Here is an example of
    the curriculum you can expect to cover in such a degree:


    If you''re not accustomed to the credit system used by colleges in the United
    States, the rule of thumb is that a “credit-hour” means one hour''s classroom
    time week per semester. You can get some idea of the workload involved in all
    this by considering that a full-time course load is four courses per semester.


    > This table is an amalgamation from published 2005 curricula for several U.S.
    colleges. I generated it by categorizing the subjects in curriculum from various
    institutions and averaging the credit-weighting for each category; I rounded it
    out to obtain nice integers. This information is intended only to be representative
    of the relative course load weighing of various subject matter in a typical BSEE
    degree.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Chapter 2


    translates to somewhere between twelve and sixteen credits. A BSEE degree is approximately
    eight full-time semesters. If you''re willing to spend the money to attend summer
    and winter classes in addition to the normal spring and fall sessions, and you''ve
    got the motivation, it''s possible to complete this program in somewhere between
    two and three years. Although you''ll probably be close to insanity at the end
    of such an intensive study program, and when you come home, your dog will assume
    you''re a burglar and try to bite you.


    Note there is a surprisingly wide variation in course work offered or required
    by BSEE degree programs at various colleges. In particular, quite a few schools
    are much heavier on computer science than the curriculum I provided on the previous
    page. Degrees that mandate a large number of computer science courses (more than
    eight credits orabouts) tend to be hybrid qualifications with names such as “Bachelor
    of Science in Computer and Electronic Engineering.” People who get these sorts
    of degrees might have a very slight start (holders of standard BSEEs) working
    on firmware in relatively high-end embedded systems. Regular BSEE holders might
    be very slightly advantaged in dealing with fine-tuned systems that have significant
    hardware issues to solve, and perhaps a lot of hand-massaged, time-critical assembly
    language to tweak.


    This possible difference, however, really only going to affect your first job
    when you get out of school.After a year or two in the workforce, your useful and
    marketable skill set will be determined almost exclusively by the field in which
    you work unless you make a determined and objectively demonstrable effort at self-improvement
    (for example, by publishing technical articles) in some other field. There are
    two major reasons for this. First, and most important, once you start working
    in a “real” field, your learning and experience will obviously be focused on that
    field. You''ll find that the skills you exercise in the pursuit of your day job
    will improve exponentially over the baseline competence you learned in school.
    Skills that you aren''t using will inevitably atrophy. (This will to some degree
    be offset by the fact that your general problem-solving abilities will increase
    dramatically.)


    3 Note that I''m not considering whether a prospective employer will see a difference
    between the two qualifications.


    4 Of course, it can affect your postgraduate study path, but I''m assuming you
    thought that when you were selecting undergraduate course work.'
