    The internal architecture of the MSP430 core is beautifully neat and tidy, as
    I hinted previously (though some people complain that the instruction set architecture
    is billed as RISC, but implemented as CISC). There are sixteen general-purpose
    16-bit registers, named R0 through R15, which are all treated identically from
    an instruction set perspective. Although I call them “general-purpose”(since the
    datasheet does so), R0 is the program counter, R1 is the stack pointer, R2 is
    the status register and R3 is the constant generator. This whole system is very
    C-friendly and enjoyable from a programming standpoint.


    The MSP430 core has a traditional von Neumann architecture. Some quote this as
    a disadvantage, which is rather incomprehensible since there’s no obvious characteristic
    of the micro, compatible with its design goals as a low-power device, that would
    be improved by switching to a Harvard architecture.


    | Source | Dest | Name | Syntax | Meaning |

    | --- | --- | --- | --- | --- |

    | Yes | Yes | Register mode | Rn | Contents of Rn is operand. |

    | Yes | Yes | Indexed mode | X(Rn) | Memory at (Rn + X) is operand. |

    | Yes | Yes | Symbolic mode | ADDR | Memory at (ADDR) is operand, with relative
    addressing. Note that this is actually encoded as X(PC). |

    | Yes | Yes | Absolute mode | &ADDR | Memory at (ADDR) is operand, with absolute
    addressing. Note that this is actually encoded as X(SR) (i.e., a constant offset
    from the zero generator). |

    | Yes | No | Indirect register mode | @Rn | Memory at (Rn) is operand. |

    | Yes | No | Indirect register mode with autoincrement | @Rn+ | Memory at (Rn)
    is operand. Rn is incremented after instruction (by 1 for byte-wide operations,
    2 for word-wide operations). |

    | Yes | No | Immediate mode | #N | Immediate 16-bit constant is source. This is
    implemented at @PC+ (i.e., a special case of indirect register mode with autoincrement).
    |'
