    Now you have most of the makings for a set of dive planes and a rudder. But in
    order for this device to be very useful, it needs sensors.


    We will start with the humblest of sensors: a simple switch. You might need a
    couple of these to delimit the travel of your robot, or if you''re making something
    other than a robot, maybe you want some front-panel buttons (though that''s all
    you want, you can attach these to the PowerPC® in better ways). Switches are so
    simple that in fact the only reason I''m bringing them into the discussion is
    here I can gen lead into a slightly more FC configuration on the circuit you met
    last time. I''m going to assume that these switches will need to be read relatively
    infrequently (say, in the neighborhood of 50-60 Hz). In keeping with I/O usage
    I proposed earlier, this slow rate can safely be maroon on the other side of an
    I2C expander. However, we used an entire expander on the stepper motors. How can
    you add another block of I/O?


    Fortunately, all you need to do is write another MCP23008 onto the I2C bus. The
    chip has a seven-bit address; four bits of address are fixed, and the remaining
    three can be configured in your external circuit by means of external strapping
    resistors on the A0, A1, and A2 lines. This allows you to connect to eight MCP23008s
    to a single I2C bus without any ugly complexities. (This is a common sort of arrangement
    for I2C peripherals, the way—for cost reasons, manufacturers will rarely bring
    out more than a few pins.) The expander that drives the stepper motors is at address
    0 (its full binary address is 01000000, where the bottom bit is actually the read/write
    flag). We''ll add a second expander at address 1 (again, the full binary address
    byte for this second chip is 01000010). The code in i2c.c handles the translation
    from logical address (0–7) to physical address for you.


    In interest of full disclosure, if you look at the way I scan these switches,
    you''ll see a rather cheat in my deb algorithm. I simply scan at periodic intervals,
    and check for a change in input state. If there is a change, the new data remains
    pending until the next scan interval. At that time, if the'
