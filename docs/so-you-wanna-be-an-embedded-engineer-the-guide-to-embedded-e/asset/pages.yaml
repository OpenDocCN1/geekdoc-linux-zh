  md: '# Teaching Yourself, Bottom-Up


    8051 accesses external program memory, either using the MOVC instruction

    (more on this later) or by jumping to a location in off-chip memory.


    +   - The micro brings ALE and _PSEN high.

    - The low 8 bits of the desired fetch are output on port 0. In this mode, the
    port uses strong internal pullups; you do not need external pullups if you are
    only using port 0 as the address/data bus.

    - ALE is brought low.

    - _PSEN is brought low and simultaneously, Port 0 switches to input mode to read
    the instruction. (Port 2 is still outputting the high byte of the desired address.)


    In a typical 8051 employing external memory, ALE is routed to the clock input
    of an octal flip-flop as a 74HC373, and P0.0..P0.7 are routed to the D0..D7 inputs
    of that chip. The Q0..Q7 outputs of the 74HC373 form the low 8 bits of the address
    bus (A0..A7); and the high 8 bits (A8..A15) come directly from P2.0..P2.7 on the
    8051.


    The A0-A15 lines are routed directly to the inputs of your memory or memories.
    The _PSEN signal goes to the _OE (Output Enable) line of your EPROM or Flash memory
    chip, and _RD and _WR should be run to the _OE and _WE (Write Enable) lines, respectively,
    on your SRAM. Separate chip selects (if any) on the memory devices should be tied
    to their active state. All of this sounds complex, and looks impressive if you
    draw it on paper, but if you look closely you''ll see that in a large number of
    cases you can use external RAM and ROM with no additional components besides the
    74HC373 latch. In fact, some manufacturers ever use SRAM/or EPROM chips (and exotic
    combined chips!) already have the address multiplexer latch built in, so 8051
    users reduce the surface area of their boards.


    Addressing external RAM via the data pointer (DPTR; see the following) works almost
    exactly the same way, except instead of _PSEN being asserted during the memory
    access cycle, either _RD or _WR is asserted depending on whether this is a memory
    read or write operation. (In the case of a write operation, Port 0, rather than
    being an input, outputs the desired data during the _WR active period.)'
