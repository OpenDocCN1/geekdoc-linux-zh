  md: '# Chapter 3


    The simple external logic method also can give you an interrupt when input states
    change; in some applications, that might be important. Of course, you could structure
    external interfaces with jellybean logic in many other ways, but it''s a headache
    to design and debug is often difficult to run on the printed circuit board (PCB)
    as well.


    Serial-connected I/O expanders utilize CPU pins much more effectively, and these
    chips also provide interrupt-on-change capabilities on the inputs, if you should
    require it—they are also generally programmable, so you can remit inputs and outputs
    as necessary with software changes rather than needing to mess with physical wiring.
    All things considered, serial I/O expansion is definitely the way to go.


    The two most popular low-bandwidth synchronous buses for intra-board communications
    are I²C (Inter-IC Communication) and SPI (Serial Peripheral Interface). However,
    some confusing nomenclature is used: Atmel has its I²C interface TWI (Two-Wire
    Interface), and many other vendors refer to I²C as 2-Wire, and SPI as 3-Wire.
    The reason for this intellectual property rights—I²C is trademarked by Philips,
    and SPI is trademarked by Motorola. Everybody implements a complete interface
    without paying licensing fees to hide their alternate name. Once in a while you
    will encounter a truly proprietary serial bus, but it''s far from common.


    Now. SPI is usually described in fashionable literature as a three-wire interface,
    but in any system with more than one peripheral is a bit of a smoke and mirrors
    act—it really requires four lines: clock, data in, data out, and select. All SPI
    peripherals are connected to common clock, data in, and data out, and each peripheral
    has its own dedicated select line (The two data lines are referred to as MOSI
    and MISO, acronyms for Master Out, Slave In and Master In, Slave Out respectively.).
    To address an SPI device, you assert its SS (Slave Select) pin and start clocking
    data out of your MOSI pin. The same clock signal pulls data out of the peripheral
    into your MOSI pin, so after eight clocks you simultaneously receive a byte. The
    transaction ends when you deassert the _SS pin.


    SPI is very easy to use (especially if you have to implement it in pure software),
    but the requirement for individual _SS (Slave Select) lines means that you need
    to add extra wiring—and an extra I/O—for every peripheral, rather than'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Teaching Yourself, Bottom-Up 107


    having a true “bus” architecture. It is therefore slightly harder to route complex
    SPI buses over a PCB.


    I2C gets over this limitation and allows you to add extra peripherals to the bus
    by wiring them in parallel with existing devices. It achieves this at the expense
    of some implementation complexity. I2C is a two-wire interface; the signals are
    named SCL (Serial Clock) and SDA (Serial Data). I2C peripherals have a 7-bit address—generally,
    some of the address is fixed for a given part, and a few bits are configurable
    by means of resistor stripping or EEPROM setup. The protocol is, unfortunately,
    quite involved, with numerous meaningful states and transitions. Luckily for us,
    practically all of the requisite magnitude is implemented in hardware inside the
    Atmega32’s TWI module; this is a case of hardware support really saving you a
    lot of design and debug time. All you need to do is add two pull-up resistors
    selected according the load capacitance of your I2C bus and the desired maximum
    data rate, and wire up all your devices in parallel.


    The principal disadvantage of I2C is that it''s difficult to propagate over long
    distances through noisy environments. Because the data line, and in multiple systems,
    also the clock line is bidirectional, you can''t shape up the signals with a simple
    buffer. IC was designed for, and works best in, communications on a single board
    or within a subassembly. It''s commonly used in TV sets, PC motherboards, laptop
    batteries (and other smart battery types), and other consumer equipment.


    I have an ulterior motive for using I2C—namely, the rich variety of peripherals
    available with I2C buses. Practically any sensor you can think of interest in
    an embedded application is available with an I2C-flavored interface—for example
    (and this list is far from exhaustive), temperature sensors, pressure sensors,
    battery charge controllers, control interfaces for image sensors, television-on-screen
    display chips, and even complex subassemblies like flux compasses, gyroscopes,
    and GPS receivers. Although some of these sensors are available with SPI-style
    interfaces, I2C is more widely supported.


    As see from the schematic, I have chosen to use the Microchip MCP23008 8-bit I/O
    expander. This chip supports the three standard I2C data rates of 100 kHz, 400
    kHz, and 1.7 MHz. Note that there are other ICs, such as the Philips PCA95xx series
    parts, that offer more bits of I/O for roughly the'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'same price as the MCP23008. I''m using the Microchip device in this demonstration
    project because it''s available in a dual inline package (DIP) and is therefore
    easier to-prototype; the PCA95xx parts are only available in SOIC and (T)SSOP.
    Moving to one of the higher pin-count devices is, however, a trivial modification,
    both in terms of hardware and code.


    The MCP23008''s outputs drive the inputs of a ULN2803A Darlington driver, which
    I use to drive two four-phase stepper motors. Excellent background reading on
    stepper motors can be found at http://www.doc.ie.ac.uk/#ibld/stepper/, along with
    some handy hints on how to identify steppers scavenged from computer peripherals.
    By the way, I have amassed a huge collection of stepper motors simply by picking
    up my neighbors'' unwanted inkjet printers and flatbed scanners off the curb on
    trash day. Because it is now cheaper to buy an entire printer with fresh ink cartridges
    to buy a set of replacement cartridges, I usually see two or three junked printers
    per week, each one drive of motors and mechanical parts suitable for miscellaneous
    experiments.


    For formal projects, you can buy new, documented steppers from numerous industrial
    supply sources. eBay is also a rich source of brand new steppers, usually with
    documentation—although you often have to buy them a tray at a time.


    Note that the ATmega32 allows you to perform I²C operations asynchronously (though
    it can be quite complex to write an interrupt routine ISR) that covers all the
    bases if you''re using several different I ²C peripherals that have radically
    different protocols. The code I''m presenting here uses a simpler polled method.
    Note that this I ²C code is not reentrant! If you plan to use the TWI module from
    an interrupt routine as well as main process code, you must erect suitable barriers
    to prevent an interrupt from attempting to use I ²C in the middle of a main process
    I ²C transaction. The firmware I''ve built is carefully designed to avoid this
    sort of contention.


    Observe that the VCM talks to the SCM over a serial link. The packet format for
