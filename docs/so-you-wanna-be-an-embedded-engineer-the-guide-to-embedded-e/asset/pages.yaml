  md: '# Teaching Yourself, Bottom-Up 39


    that there will be no real cost benefit to be realized by staying with an 8-bit
    architecture. There is a complicated and rather interesting set of simultaneous
    equations at work here. Individual chip die (raw unpacked chips sliced off the
    wafer) are priced mostly according to the number of processing steps in the “recipe”
    and the number of good die yielded by each wafer. As chip geometries get smaller,
    the number of die per wafer goes up. Additionally, the absolute cost differential
    between an 8-bit core and a physically larger 32-bit core goes down, since the
    absolute size of each is shrinking. The relative size difference is still the
    same; if the 32-bit core was 30% larger before the shrink, it will still be 30%
    larger afterwards. However, since each feature costs less after a die-shrink,
    the financial impact of that size difference is reduced.) On the flip side, smaller
    geometries can lead to reduced yield, a single defect in the wafer is likely to
    affect a larger number of die; this factor puts upward pressure on the cost of
    small-geometry chips. The net result of all this banter is as manufacturing processes
    improve, the cost of a core—either flavor—is asymptotically approaching zero.
    As both 8-bit and 32-bit cores get closer to that magic spot, the cost of the
    core is starting to disappear behind other factors.


    For parts with a lot of on-chip memory, for example, the core cost is more or
    less irrelevant compared with the cost of the memory array. However, this question
    becomes more complicated since because the processes used to make memory are not
    the same as the processes used to make microprocessor cores. a microprocessor
    requires several layers of interconnects due to its complexity—it needs to route
    large busses around multiple peripherals, and in many cases needs additional special
    handling to meet mixed-signal requirements. A memory array, on the other hand,
    is simply a two-dimensional matrix; it doesn’t need so many layers. Since all
    areas of a chip have to go through every process required by any single part of
    the chip, this means it is much more expensive (dollar peroby) to put memory on
    the same die as the processor. At a certain size cut-off, you will find that manufacturers
    switch to a stacked-die configuration—the memory array is a separate chip, and
    the microcontroller is mounted on top of it.³ Bond wires connect the two.


    ³ For any chip where this issue is a consideration, the memory section will be
    geographically larger than the microcontroller core.'
