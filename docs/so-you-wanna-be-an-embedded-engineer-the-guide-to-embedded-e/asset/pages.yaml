    # 4.5 Linux


    Almost everyone who would be reading this book knows at least some of the history
    of Linux and how it was designed by Linus Torvalds, so I won''t dig deeply into
    that topic—if you want more information, the Wikipedia entry for Linux <http://en.wikipedia.org/wiki/Linux>
    is as good a place as any to learn about. Linux is unavoidably the world''s most
    popular open-source operating system. It''s available for numerous platforms,
    and in its current incarnations includes (where supported by hardware) a complete
    turnkey GUI windowing environment, XFree86. Linux is used on desktops, in Web
    servers, TiVo digital video recorders, and in PDAs, among many other things.


    Architecturally, Linux consists of a modular, multitasking kernel (which is the
    actual operating system per se) and numerous support programs like the command
    line shell. Most of the time you''re working with Linux, you''re interacting with
    these support programs, not the actual operating system, so some people get confused
