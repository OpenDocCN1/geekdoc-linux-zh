    # 3.4 Texas Instruments MSP430


    It''s slightly cheating to lump the MSP430 in 8-bit microcontrollers, since it''s
    a pure 16-bit device, but it''s sold into the same sorts of applications as 8-bit
    micros, and hence belongs in this chapter despite the fact that the part''s classification
    is not completely semantically aligned with the other products in the lineup.


    Compared with say, the 8051, the MSP430 is a relatively young family—it is about
    ten years old. The early variants were developed for low-cost, low-power measurement
    applications. The design goals for these applications have been carried into the
    current range of products: the MSP430 is a low-power-consumption family with the
    usual selection of interrupt-woken low-power snooze and sleep modes, and it has
    a very flexible programmable analog-to-digital converter module. Some parts also
    feature on-chip LCD controllers. The parts feature a programmable DCO-based clock
    generation module that can clock all sections of the chip from a standard 32.768
    kHz crystal.'
