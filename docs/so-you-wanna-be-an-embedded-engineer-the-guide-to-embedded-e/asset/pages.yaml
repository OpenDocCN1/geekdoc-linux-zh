  md: '# Teaching Yourself, Bottom-Up 119


    table might be another. A rocket motor launching, the table, and the device into
    space would be another component of the acceleration. You cannot separate these
    components just by looking at the output of the accelerometer. In other words,
    if you have the accelerometer mounted as I previously described, the best you
    can do—even with a three-axis accelerometer—is to obtain a single vector that
    summarizes all linear acceleration forces acting on the vehicle.


    Due to this fact, and also the lack of a z-dimension and the low-maximum-G sensor
    being used, the circuit I''m discussing here is totally unsuitable for inertial
    navigation. Building so-called dead reckoning inertial guidance circuits and developing
    the software for them is very challenging. To establish the motion vector of an
    object from a historical record of its acceleration vector, you need to sample
    rapidly and (numerically) integrate over time. To calculate the displacement (position)
    of the object, you need to integrate the motion vector again. Errors in these
    processes are cumulative.


    The consumer application where you are most likely to encounter such circuits
    is in very high-end GPS receivers. These devices try to keep track of their position
    using the GPS signals as far as possible. When the satellites are temporarily
    occluded (for example, when you drive into a tunnel), the device keeps your position
    up to date, with reduced accuracy, inertial navigation.


    The MEMS device is read through the Analog/Digital Converter (ADC) channels, a
    slight nuance is that due to matching issues, you need to use an op-amp configured
    as a simple voltage follower between the sensor and the micro. You''ll observe
    a few calibration constants in the code; you need to calibrate the zero reference
    (flat on the table) and the +1.0G voltages for both outputs. These constants vary
    from unit to unit, due to differences in orientation of the MEMS sensor inside
    its packaging, different mounting angles of the package on the PCB, and other
    random factors. The usual way of calibrating these devices is with a reference
    platform. (A piece of plywood with adjustable-height feet—or, large bolts—in each
    corner and a spirit bubble on it, is an adequate reference platform.) You calibrate
    the zero position with the vehicle on the; you roll through +90 degrees and pitch
    through ±90 degrees to calibrate the range limits. You can store the constants
    measured in EEPROM; they will be valid unless the device is serviced and the orientation
    of the accelerometer with respect to the vehicle exterior is altered.'
