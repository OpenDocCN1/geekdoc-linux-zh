  md: '# 4.6 eCos


    eCos is an embedded operating system designed for smaller applications than Linux.
    (For some reason, people seem to have a lot of mental trouble separating these
    two operating systems.) If you''re working on a small hardware platform, or you
    don''t want to get into the GPL-ness of Linux, eCos might be the right open-source
    choice for you. Much like Linux, eCos is supported by the gcc toolchain, so it
    doesn''t cost anything to start experimenting with this operating system. Although
    it doesn''t support anything approaching the massive range of hardware covered
    by Linux, eCos has been ported to a respectable number of (larger) cores, including
    x86, ARM, PowerPC and several others.


    The eCos homepage is http://ecos.sourceware.org/. Probably the first thing you''ll
    want to read is the license—eCos is royalty-free, and covered by a license that
    does not require you disclose your modifications to the general public. As you
    will see from the list of supported hardware, eCos has been ported to about a
    hundred different hardware platforms, with all the major CPUs you''re likely to
    use covered—there''s a good chance that you won''t need to do much working to
    get it operational on your own hardware.


    In a nutshell, eCos is a POSIX-compliant multithreaded operating system with real-time
    capabilities, networking support and various other useful features such as USB
    (slave), serial and Ethernet support. Ports also include the code to initialize
    a device driver (for example, the port to the evaluation board for the Cirrus
    Logic Maverick EP7312 evaluation board), although the OS does not have any GUI
    support built into it.


    eCos is not Linux, though the two are frequently confused—since Red Hat supplies
    flavors of both, people somehow assume eCos is derived from Linux. This is explicitly
    not the case; the eCos maintainers are careful to keep Linux code out of the source
    tree, to avoid putting it under the GPL. The main advantage of eCos over Linux
    (and many other operating systems) is greatly superior real-time characteristics.¹¹
    eCos is also configurable to a very fine level of granularity; merely by selecting
    a few configuration options at build time, you can prune the operating system''s
    driver set to the base


    > ¹¹ Compared with standard Linux. Linux with real-time extensions is, of course,
    much better than regular Linux at meeting real-time requirements.'
