  md: '# Chapter 3


    $0000–$001F is reserved for general-purpose registers; $0020–$005F is occupied
    by I/O registers. The 2K of on-chip RAM resides from $0060–$085F. From a superficial
    look at the instruction set, you may be led to believe there is a separate I/O
    space, since there are dedicated IN and OUT instructions that operate on the I/O
    register area. This isn''t the case; IN and OUT are just convenient features.


    The ATmega32 also has a third address space, EEPROM memory—this is, however, not
    directly addressable by the core. In a similar fashion to other parts with on-chip
    EEPROM, this memory is accessed through an 8-bit window; you write the desired
    EEPROM address to a pointer register and access data through another register.


    Speaking of address spaces, observe that this particular AVR variant does not
    have external address or data buses (although some do). Since AVR cannot execute
    out of on-chip RAM, this means that you cannot attach removable modules (software
    cartridges) and have them directly mapped into the code space as an executable
    program. You can also add more addressable RAM. If either of these functions is
    going to be important to your application, you should either look at one of the
    larger AVRs that offer external buses, (or the extension cartridge example) consider
    writing an interpreter that can load and execute programs from external serially
    accessed Flash chips.


    The AVR core has 32 8-bit general purpose registers, R0 through R31. These registers
    live in the bottom 32 bytes of the data address space. The instruction set is
    not entirely orthogonal with respect to these registers; R16 through R31 are treated
    slightly differently than R0 through R15. Apart from this detail, however, the
    instruction set operates more or less equally on all the general-purpose registers.


    The top six registers have an additional special function; they can be treated
    as three 16-bit registers for the purpose of certain instructions involving indirect
    addressing modes and 16-bit arithmetic. When you are taking advantage of this
    capability, these 16-bit registers are named X (R26, R27), Y (R28, R29) and Z
    (R30, R31). In each case, the lower-numbered register contains the lower-order
    bits of the 16-bit concatenation (Observe that this is just nomenclature detail.
    You can access the individual 8-bit registers at any time and they will contain
    valid data.). From the point of view of high-level language usage, observe that'
  merge: -1
