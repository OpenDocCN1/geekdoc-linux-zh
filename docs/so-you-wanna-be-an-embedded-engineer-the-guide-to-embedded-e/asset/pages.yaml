  md: '# Education 25


    The real answer to this question is, of course, somewhere in the middle—and highly
    dependent on what sorts of projects you intend to do. To a certain extent, the
    size of the company you''re aiming to work for is also a factor; if you''re working
    for a small company or in a small team within a bigger company, you''ll be under
    increased pressure to be self-reliant and able to solve problems that are “across
    the divide” from your job description (for more on this topic, see Chapter6).
    You don''t need to be a guru, but you do need to be able to understand the behavior
    of the other parts of your system so that you can predict how the system will
    behave given a certain stimulus from your software. As you get down close to the
    bare metal (writing device drivers, for instance), it can be practically impossible
    to develop relevant debugging skills unless you''re able to hook up a scope analyzer
    and understand what the actual hardware is doing in response to your code.


    While I''m on this point, let me take a moment to state most vehemently that the
    idea of every software that''s independent of hardware or hardware independent
    of software is dangerous and useless. Neither can operate in a vacuum; you can
    design a fabulously complex and powerful piece of embedded hardware, but until
    it becomes a platform supporting an operational piece of software, it''s just
    a piece of laboratory junk. Likewise, you can develop software in some non-native
    simulation environment, but until it''s loaded onto real hardware, it''s a computer
    science project, not a product. (This does not altogether disparage simulation,
    by the way, but the premise of software is that the simulation environment emulates
    latent features of the actual hardware on which the final product is expected
    to run.) As a design engineer in a large company, it irks me no end to see the
    hardware build something “perfect” and toss it over the wall to a software group.
    Of course, the software group has developed “perfect” software that runs just
    fine on the emulator and maybe even the first prototype PCB. Naturally, when the
    software meets the perfect hardware, unforeseen problems arise.


    So what, exactly, should you know? Here is a short list of the skills and knowledge
    that I would consider essential but which might not be obvious to a newcomer.
    Observe that not all of this is explicitly included in a BSEE degree.'
