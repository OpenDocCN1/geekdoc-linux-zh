    # 7.2 How to Get the Job


    Hiring a new employee at the engineer level is a significantly expensive and complicated
    process for a large company. Simply hunting for the right candidate, paying a
    recruiter''s fees, potentially paying for relocation expenses and the other setup
    costs for the hire (plus, potentially, a signing bonus) can easily add up to $15,000
    or even more for an engineering position. It doesn''t have to be a high-level
    position, either—big companies will even spend this much recruiting the right
    person for a mid-level position.


    Partly because of this complication, and partly because of the unavoidable large-corporation
    love of procedure, landing an engineering job at a large company is a highly structured
    process, divided into phases. The first phase is simply to get into your target
    company''s human resources system. This is superficially easy—almost every large
    company has a website with an easily located careers section where you can submit
    your résumé. It''s worth doing even if you plan to use an alternate route into
    the company, because the hire process will probably require you to enter your
    résumé in the standard manner anyway. Once your résumé is in the system, you''ll
    be in a position to use the application tools on the employer''s website (and
    you''ll probably start receiving automated emails with positions that match some
    of the keywords in your résumé).


    Now, you just need to get someone to read your résumé. This is really difficult
    if the résum are pre-filtered by “intelligent” software. You''re really not in
    with much of a chance if you go through this standard route but you don''t match
    the required qualifications for word. In Section 2.2, I discussed how it''s easiest
    if you have a recruiter working for you on the inside; this advice is generically
    true for large-company jobs regardless of your qualifications. As a result, I
    strongly recommend you concentrate your search through professional headhunters.
    It doesn''t actually hurt to apply for random jobs online, of course, but don''t
    be overly disappointed if you don''t land the job of your dreams immediately by
    this means.


    I reiterate here that the large recruiters are not really recruiters so much as
    clearinghouses for résumés and jobs. They compare pieces of paper, then notification
    to apparent matches out to the protagonists. It''s vastly preferable to work with
    a real person who knows the hiring manager personally (and preferably knows your
    industry as well). You might also get an interview by'
