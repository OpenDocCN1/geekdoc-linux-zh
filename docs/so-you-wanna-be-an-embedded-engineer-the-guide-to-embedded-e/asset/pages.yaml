  md: '# 102 Chapter 3


    ![](img/c399ccf73cf87546c20eb6734a6baa3d_110_0.png)


    Now you''re up and running, connect your terminal program to the USB adapter at
    57600bps, 8 bits, no parity, 1 stop bit, with no flow control. You should see
    all the kernel messages while the unit is booting or shutting down (and also on
    events such as USB hotplug). There is a getty process running on that port, so
    you can log in locally. The port can also be used for general-purpose communications;
    it is accessible as /dev/ttyS0.


    With this digamos out of the way, on the design of our actual circuit. I have
    chosen to use an Atmel ATmega32 microcontroller as the core of the VCM. This happens
    to be an ideal choice for me, because I''m very comfortable with programming this
    micro, it''s 5V-compatible (and hence interfaced to all the power electronics;
    it can be a bit irksome using 3.3V micros in projects like this), and it operates
    over a wide temperature range. It is also supported well by free or low-cost hardware
    and software tools, and most of these tools work within Linux. Most of the same
    things, except for the voltage comment, are also true for the MSP430 series—if
    you''re more familiar with that microcontroller, then you can probably port 75%
    of the circuit and code across without much difficulty.


    Figure 3.13 shows a schematic of the circuit we''ll be working with.'
