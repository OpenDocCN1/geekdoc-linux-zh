    common philosophy, and they usually have a widely disparate array of internal
    procedures, some of which may be fundamentally incompatible with the “big picture”
    methods and goals of the parent corporation.


    This situation is pretty unavoidable; it''s extremely expensive (in terms of cash
    and customer satisfaction, among other things) just to dump an entirely new set
    of procedures and goals on every employee of a newly acquired subsidiary and force
    an overnight switchover. In fact, the cost is approximately the same as it would
    be to fire and rehire everyone from the subsidiary into the parent company.


    In a large-corporation job, you''re inevitably going to be exposed to many procedural
    requirements than you would be in a small company. Speaking from the worm''s-eye
    view of a frontline engineer, we can break these procedures into the following
    broad categories.


    +   * Type 1: Tasks which are clearly necessary or useful in order to perform
    engineering functions effectively; for example, a standardized process for handling
    electronic CAD symbols, procedures for issuing engineering change notifications
    to existing products, and so on.


    +   * Type 2: Tasks which are not, strictly speaking, engineering necessities,
    but are practically important in some way and hence cannot be ignored. ISO procedures,
    government required test data, etc. Almost all of these tasks are directly a result
    of customer requirements, and hence have an unambiguous bottom-line effect.


    +   * Type 3: Tasks which are designed to generate metrics or other outputs that
    don''t directly impact engineering functions in any way. Sometimes, these metrics
    exist only so that engineering functions can be measured using the same units
    as, say, marketing. This is a bit like trying to measure the acidity of orange
    juice in juices.


    (There’s also a fourth category of tasks—things that are really somebody else’s
    job but somehow seem to wind up becoming your responsibility. These are obviously
    the most irritating of all.)


    Tasks of Types 1 and 2 are simply things you’re going to have to live with; they’re
    part of the job you’re taking and although you might tactfully suggest'
