    difficulties were manifold: To drive displays (up to VGA resolution, 640x480),
    the most cost-effective solution is to use a highly integrated System-on-Chip
    (SoC) microcontroller with on-chip LCD controller. Several offered us parts that
    would work reasonably well for low resolutions. However, these devices almost
    employ a unified memory architecture; RAM bandwidth is shared between code execution
    and DMA peripherals such as the LCD controller. As you increase resolution and
    color depth of the video output, you drastically reduce the bandwidth for executing
    code. This meant that for anything larger than QVGA size, the CPU would be so
    starved for RAM bandwidth that it wouldn''t be able to handle the video decoding
    tasks (even a more modest subset, like MPEG-1 alone trying to do a full software
    decode of DVD-resolution MPEG-2). Furthermore, there wasn''t a single SoC-type
    device that would handle the higher resolutions desired for the large-screen models.


