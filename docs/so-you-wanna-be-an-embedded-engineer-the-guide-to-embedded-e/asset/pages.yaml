    As you can see, the roll axis output is the same for both situations. The z-axis,
    if I had a way to measure it, would have changed sign, the two-axis device simply
    cannot differentiate between the two possibilities.


    Another point that sometimes seems very difficult to communicate the following:
    An accelerometer only measures a single acceleration vector (in this case, I have
    the vector decomposed into two components; a three-axis accelerometer would give
    a third component, but the net result is still a single vector). Gravity is one
    component of this acceleration. Your hand pushing the device across the'
