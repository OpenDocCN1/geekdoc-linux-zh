  md: '# Teaching Yourself, Top-Down 159


    Historical issues limit the size of a user-supplied bootloader program slightly
    less than 512 bytes. Since this isn''t enough space to implement all the possible
    device drivers that might be required to access different displays and storage
    devices, it''s necessary for the BIOS to install standard-ized software interfaces
    for all installed, recognized hardware that might be required by the bootloader.


    Once all the BIOS-supported system peripherals are initialized, the main BIOS
    code will run through candidate boot devices (in accordance with a user-configurable
    preference list) looking for a magic signature word. Storage devices for IBM®-compatible
    PCs have historically used a sector size of 512 bytes, and the BIOS only loads
    the first 512 bytes from the selected boot device. The operating system''s installation
    program is responsible for storing sufficient code in that to bootstrap the remainder
    of the IPL process.


    Although it would be possible to write a minimalist Linux bootloader that would
    fit into such a space, Linux bootloaders for the PC consist of two stages: a small
    stub that lives in the boot sector, and a larger segment that lives elsewhere
    on the boot medium, usually inside the partition that contains the root file-system.
    LILO and grub are the best-known bootloaders for mainline Linux installations,
    and SYLINUX is a popular choice for embedded distributions.


    The primary purpose of the bootloader is to load the operating system kernel from
    secondary storage into RAM. In a Linux system (x86 or otherwise), the bootloader
    can also load an initial RAMdisk image. This is a small filesystem that resides
    entirely in RAM. It contains a minimal set of modules to get the operating system
    off the ground before mounting the root filesystem. The original design purpose
    for initial RAMdisk support in the kernel was provide a means whereby numerous
    device drivers could be made available at boot time (potentially drivers that
    needed to be loaded before the root filesystem be mounted).


    You can get an idea of the original usage scenario for the RAMdisk by considering
    a boot Linux installation CD-ROM. The disk needs to contain drivers for many different
    hardware types, so that it can boot properly on a wide variety of different systems.
    However, it is desirable to avoid building an enormous kernel with every single
    option statically linked (partly for memory space reasons, but also to a'
