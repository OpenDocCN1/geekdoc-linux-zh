- img_proc: true
  md: '# Teaching Yourself, Bottom-Up 57


    the limited number of 16-bit registers acts something like the DPTR restriction
    in the 8051 family; it''s something of a bottleneck.


    There are a couple of slightly odd things about the AVR family, and both of them
    relate to programming the parts. The first strange is that you have to program
    the device''s three memory areas—program memory, EEPROM and fuse bits—separately.
    There is no universally recognized way to combine all this into a single file
    for one-step programming. The way I usually work around this is by using a command-line
    programming tool (avrdude, to be exact; the homepage for this open-source tool
    is <http://savannah.nongnu.org/projects/avrdude/>); I can then embed a one-step
    programming option into my project''s myfile.


    The second odd is that the internal RC oscillator requires device-specific calibration
    in order to operate exactly on its nominal frequency. This is not, itself, terribly
    odd for on-chip RC oscillators in microcontrollers. What is unusual is that the
    factory calibrations are stored in such a way that they can''t be used; they are
    located in the device signature area, which can only be read by external programming
    hardware.¹⁰ You can select RC clock speeds of 1, 2, 4 or 8 MHz in the fuse bytes;
    your software then needs to load the correct device-specific calibration byte
    into the OSCCAL register at startup.


    This process is handled automatically for the 1 MHz case; at reset, OSCCAL is
    automatically initialized with the 1 MHz calibration value. If you''re using one
    of the faster speeds, Atmel has thoughtfully provided the correct calibration
    constants for you in the chip, but there''s no way to get them directly.¹¹ The
    recommended workaround for this is to read out the signature area with your programming
    hardware, retrieve the appropriate calibration byte for the speed of interest,
    and write it into a spare byte of software-accessible EEPROM. This has to be done
    individually for each chip you program; the calibration constants are dependent
    on process variations. Your software needs to read the relevant EEPROM byte at
    power-reset, and write that value into OSCCAL. This is really annoying; I wish
    Atmel had made the part auto-load the correct calibration byte for each RC oscillator
    mode, or at least provided a method for software to access the factory area.


    > ¹⁰ The device signature area appears to be merely a reserved area of EEPROM
    cells. It contains factory calibration values and the device signature bytes used
    by programming hardware to determine the chip version.


    > ¹¹ As this was going to press, Atmel was working to eliminate this particular
    oddity.'
