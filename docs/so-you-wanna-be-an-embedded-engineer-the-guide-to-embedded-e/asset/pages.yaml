  md: '# Teaching Yourself, Top-Down 135


    There are various exotic things you can do to attach external peripherals to a
    PC, but the “easiest” route is to go in USB. (Nothing in USB is truly easy; it’s
    a complicated interface to use. If you are very cautious about what you intend
    to do, you can hopefully avoid most of the pain, however.) If you just need a
    few external pushbuttons and your product is a low-volume device, you can cannibalize
    a USB mouse or keyboard and wire your buttons to the appropriate points on the
    microcontroller in those devices; you won''t need to write any device drivers
    or build any complex hardware. For higher production volumes, or if you need something
    more complex than just a couple of buttons, or more drastic solutions are called
    for.


    Now, I''m a big fan of keeping things as simple as possible, particularly where
    USB is concerned. In particular, I never want to be in the position of having
    to write and maintain USB driver code for the host operating system, especially
    if that host operating system happens to be a rapidly consuming operating system
    like Windows or Mac OS. Therefore, I prefer to use a USB interface solution that
    has fully debugged, vendor-provided drivers.


    From a practical design standpoint, this means that I still use RS-232-style asynchronous
    serial as my external interface of choice. In between the PC and the external
    hardware, I use USB-to-serial converter chips from FTIR <http://www.ftidich.com/>.
    These devices are a boon to embedded developers, because FTIR provides completely
    free drivers for Windows, Windows CE and Mac OS. (Linux had FTIR support built
    into the kernel for a while; if you''re using an older kernel, FTIR provides a
    driver for your use.) All you need to plug the device in, install the driver,
    and you''re communicating.


    You don''t need to put the FTIR chip on your board; you can use the pre-assembled
    “ChiPi” cable (UC232R) which is available directly from FTIR for about $20. The
    only real downside to this that you''ll need to put an RS-232 level matcher on
    the other end of the cable; if you use the bare chip then you can avoid shifting
    from CMOS to RS-232 levels and back again. Of course, you can hack the ChiPi so
    that it outputs inverted CMOS signal levels, if you desire.


