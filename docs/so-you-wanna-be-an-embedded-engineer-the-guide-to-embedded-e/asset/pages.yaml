    United States needs to comply with FCC Part 15 rules on RF emissions; customers
    usually don''t think of this, and most consultants (myself included) don''t have
    the equipment to perform official FCC testing, the contract for something that
    eventually be a consumer appliance has to include wording to the effect that it''s
    the customer''s responsibility to have the product tested and certified, and your
