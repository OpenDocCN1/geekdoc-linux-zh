    much higher than eCos.


    Note also that eCos is a multithreaded operating system, not a multitasking operating
    system. Your application is not “loaded” in the same way that Linux loads external
    programs off a hard disk or of Flash. In eCos, your application is directly linked
    in with the operating system; the operating system is actually a library and by
    of startup code that is statically linked with hence inextricably welded to your
    code. The possible downside to this is, unlike in Linux, eCos you can''t directly
    spawn an external program to do some function for you, since the operating system
    has no concept of “loading” a program (and even if it did, there is no defined
    API for such an externally loaded program to access operating system services).
    If you want to include the functionality of some external utility, you will need
    to integrate the sourcecode of that utility directly into your own code and link
    it into your operating system image.


    From a commercial standpoint, another advantage of eCos over Linux is the license
    agreement. Some investors in particular be leery of using Linux in a commercial
    application because of the GPL (though there are certainly many precedents for
