    There''s another very simple heuristic for working out your hourly rate should
    be (short of asking colleagues working in the same arena, of course): Study a
    few salary research engines as salary.com to learn what the going day-job rates
    are in your geographical area and field of expertise. Calculate the effective
    hourly rate from the quoted annual baseline salary (don''t include stock options,
    401(k), medical plans and so on), and double it. This is a surprisingly useful
    rule of thumb: doubling the hourly rate covers self-employment tax, health insurance,
    personal liability insurance (if you carry it), utilities and all the other miscellaneous
    expenses that a day-job employer would normally carry for you.


    So much for working out your hourly rate. Projects that require you to buy special
    tools or unique, expensive parts—or even simple projects that require you to ship
    the customer a prototype built from parts you normally keep on your shelves—are
    a little less complex. One method of handling contract work of this type is to
    assemble a bill of materials up-front and send it to the customer, along with
    a suggested supplier list. The customer should then order the parts for delivery
    directly to you. The benefit of this system is that you have no outofpocket expenses,
    and the customer has a clear understanding that you''re not marking up any of
    the parts—simply bill for hours of work.


    There are two major downsides to this approach. Very few nontrivial projects are
    fortunate enough from schematic to fully functional prototype in one step, especially
    when the underspecification is changing. Practically one has to tune the device—tweak
    a resistor value here, choose a meaty transistor there, or switch to a less noisy
    op-amp elsewhere. As a result, you find yourself waiting for the customer to approve
    additional expenses for the prototypes and get the parts in-house. You also risk
    annoying the customer, who might not understand that some aspects of engineering
    are a little speculative; some things are hard to develop analytically, so a little
    trial-and-error can creep in.


    For this reason, it''s better to charge the raw materials costs to the customer
    on project completion (or at a major milestone) and simply keep the parts you''re
    likely to require on hand in your lab, replenishing when necessary. In order to
    avoid being out of pocket, you need to structure your terms in such a way that
    the initial project-start payment will cover all the anticipated raw materials
    costs, as well as whatever you need to pay the bills while you''re working on
    the'
