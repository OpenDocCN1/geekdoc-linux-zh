  md: '# 204 Chapter 6


    Getting to the point of being offered an interview, then, requires demonstrating
    (in your résumé and cover letter) a track record of concrete work achieved, preferably
    with rapid and impressive results. The easiest way to do this is to check off
    specific projects you accomplished. Unless there is some particularly amazing
    personal project you worked on, you should give precedence to commercial projects,
    and (if applicable) emphasize what cross-functional responsibilities you had in
    project. For example, if you were the lead engineer on a widget and supervising
    another engineer to develop the hardware, and working with a Far East factory
    to get the PCB laid out and the product built and tested properly, this should
    be all in your cover letter. If you can include details about the development
    time (time to working prototype and time to release), it''s a good idea to do
    so. By the way, your suggestion is to put pointers to the really employer-specific
    stuff (projects that relate directly to your target industry, for instance) in
    your cover letter as well as the résumé. Some guides advise you keep the cover
    letter terse and rely on the interviewer reading the entire résumé to learn about
    your career to date; for the case where the result is to be processed by a real
    human, I don''t agree with this all. The cover letter is like the first chapter
    of a book; you need to persuade the reader that the remainder of the text is of
    interest. Cover letters have different importance for the large-company hiring
    process; see Section 7.2 for more information on this topic. I suspect that people
    advise a "please, thank you" cover letter are influenced heavily by the large-company
    hiring process.


    This part of the hiring process is more difficult, of course, if you''re fresh
    out of school (or if you haven''t completed school yet); you won''t have any commercial
    projects under your belt. However, you can still pique an interviewer''s interest
    by showing off personal and school projects that you''ve worked on. You will set
    yourself apart from the pack by including evidence that you devoted some thought
    to the issues that affect real production but are often neglected in personal
    projects; for example, future availability of the parts you designed in, ease
    of manufacturing, ability to be tested automatically, and bill-of-materials costs.
    It''s also less impressive to show a project built out of custom parts bolted
