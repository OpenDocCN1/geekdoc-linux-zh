    However, there are numerous other traps lurking for the unwary student. These
    traps range from courses that simply aren''t as useful as they appear, to so-called
    life degree programs that are downright fraught (more on later). The problem of
    choosing a degree program in the United States is exceptionally difficult to unravel
    because the tertiary education system in this country operates on an apparently
    free-market principle with no central government regulation. Practically anybody
    can collect fees and issue “degrees.” A third party (say, a prospective employer)
    can theoretically judge the value of a degree by whether the issuing institution
    is accredited by someone reputable. However, this becomes something of a chicken
    and egg situation, because any fraudster who can open a degree-issuing “school”
    can also create a credit agency to “credit” that school.²¹ So, to evaluate the
    worth of a degree, we really need to know by whom the issuing institution is accredited
    and the bona vides of the accrediting authority.


    Because of this, combined with the plethora of different curricula and claims
    made by various institutions, it can be excruciatingly difficult to evaluate the
    relative merits of different higher education programs. Obviously, an Ivy degree
    is (usually) easy to distinguish from a “print your own diploma, pay only for
    paper!” sort of operation, but between these extremes there is a very broad spectrum
    of cost and utility. Let’s not forget, that once you finish your degree, you will
    have able to convince an employer or another college of the utility of this qualification.


