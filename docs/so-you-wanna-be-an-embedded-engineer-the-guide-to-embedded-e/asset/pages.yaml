  md: 'Upper management generally doesn''t like these sorts of expenditures. There
    is a critical danger here, too, that the quick and dirty technology demonstration
    prototype may seem like a tempting foundation for the real product.


    +   * What is the cost of overestimating a particular part''s capabilities? In
    other words, what will be the consequences if we look at all the datasheets, run
    calculations, and decide that part XYZ will be suitable and have an optimal price
    point, but it later transpires that''s just a shade under-powered for the task
    at hand? A large company will be able to swallow six months of wasted development
    time and say, ten thousand dollars worth of platform-specific development tools.
    (The individual engineer who chose to go down that path might not survive, of
    course.)


    +   * What are the anticipated product volumes and margins? This information will
    probably be included in the product request from marketing (though it is quite
    normal for it to be wildly inaccurate, particularly for a project that has a whiff
    of anything new and untried in it—marketing simply doesn''t have the information
    to predict what the bill of materials will cost be). The reason this data figure
    into your solution set is if you''re only going to sell five hundred units at
    a profit of, say, ten dollars each, it''s not worth spending much time optimizing
    those designs.


    Unfortunately, most engineers don''t have a good enough intuitive on the issues
    to estimate all this stuff accurately up front. There are many unknowns, and any
    off-cuff answer is dangerous. Worse, many engineers have a terrible propensity
    to make promises that can be fulfilled.


    The technique I have found to work best for me is to limit my contact, and in
    fact my whole team''s contact, with marketing. In particular, it is vitally important
    for engineers to avoid discussing speculative or forward-looking projects with
    marketing personnel in an unstructured way. If you have team members who can''t
    resist talking about the latest cool thing they''re working on, these people need
    to be silenced or sequestered at all costs. This remark is even applicable for
    features you believe to be minor changes to existing projects.


    In short, when dealing with marketing, I advise you to live your life by Bo Dudley''s
    maxim: "Don''t let your mouth write no check that your tail can''t cash."'
