  md: 'I chose to use a PalmConnect® USB adapter, originally intended to adapt a Palm
    III™ or m100™ cradle to USB. Figure 3.7 shows the component side of the PCB of
    this adapter.


    ![](img/c399ccf73cf87546c20eb6734a6baa3d_105_0.png)


    Figure 3.7 Serial adapter, before modification.


    If you have a different adapter, you''ll certainly see a different layout and
    different micro, but it is likely that the transceiver part is something very
    similar to the Analog Devices ADM3311 used in the Palm® adapter, if not the exact
    same device.


    The first step you should take after opening your serial adapter is to check that
    it uses 3.3V logic levels internally. (If it uses 5V internally, the current-limiting
    resistors and 5V-tolerant IOs in the Kuro Box will protect it, but you might not
    see any output on the PC side.) To determine the internal logic voltage, simply
    plug the adapter into a USB port, wait for it to be recognized by the host PC,
    then use a multimeter or oscilloscope to probe the pins on the transceiver chip—pins
    23 (GND) and 2 (Vcc) in the case of the ADM3311.


    Now you need to desolder that transceiver chip. The method I use is to put a bead
    of solder down all the pins on one side, then get an Exact blade under the chip
    to lever up that side while keeping the entire bead melted with my iron.'
