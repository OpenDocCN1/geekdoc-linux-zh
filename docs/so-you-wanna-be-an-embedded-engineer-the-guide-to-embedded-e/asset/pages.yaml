    | RAM controller initialized | BIOS decompressed into shadow RAM | Shadow RAM
    write-protected | Peripherals enumerated + POST |

    |---| Boot sector loaded | Boot candidates scanned for signature | Potential boot
    devices evaluated | Expansion ROM hooks installed |

    | Boot sector loads stage 2 | State 2 loads kernel and RAMdisk | | |

    | | Kernel re-enumerates hardware | RAM disk mounted | Device driver loaded |

    | | Filesystem mounted (flash, disk, ...) | Device driver modules loaded | Run
    startup scripts and user apps |


    4.1 A diagram of the typical PC boot process.


    For reason, modern PC motherboard BIOS code is always compressed in Flash. The
    only directly executable code in that chip is a tiny boot stub. Therefore, the
    first task on power-up is to initialize the motherboard chipset enough to get
    the DRAM controller working so that the BIOS code can be decompressed out of Flash
    into a mirror area in RAM, referred to as shadow RAM. This area is write-protected
    and control is passed to the RAM-resident code. Shadow RAM is permanently stolen
    by the motherboard chipset; it cannot later be reclaimed by the operating system.
    For legacy reasons, special hardware mappings are set up so that the shadow RAM
    appear in the CPU''s real-mode memory map at the locations where old operating
    systems like MS-DOS would expect to find them.


    Keep in mind that the PC is an open architecture. This openness extends down to
    firmware modules within the BIOS. Once the power-on initialization (POI) code
    has run, the next step it takes is to enumerate peripherals, and optionally install
    hooks provided by expansion ROMs from peripherals. (Of some expansion ROMs—for
    instance, the video BIOS in a system that onboard integrated video hardware—will
    physically reside in the BIOS image, but conceptually they are separate entities.)
    The following are the reasons the BIOS has to do this redundant initialization.


    +   1. The main BIOS needs basic console services to announce messages and allow
    the user to override default start-up behavior and configure system-specific parameters.'
