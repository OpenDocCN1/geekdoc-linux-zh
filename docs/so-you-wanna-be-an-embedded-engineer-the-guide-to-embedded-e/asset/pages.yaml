    # 2.3 Write Software—How Much Electronics Must I Learn?


    Before we embark on this topic, it''s time for a short humor break illustrating
    the potential silliness of embedded software development.


    # The 999,999th Monkey Theorem


    Emile Borel''s 1909 book on probability stated that a monkey hitting random keys
    on a typewriter would eventually type every book in France''s national library.
    You''re probably much more familiar with an anglicized restatement of the theorem,
    commonly put this way: "A million monkeys at a million typewriters will eventually
    produce the complete works of Shakespeare." (There are numerous ways of saying
    the same thing, of course, and many people prefer to assign infinite monkeys to
    the task—however, this presents us with the intractable Infinite Banana Paradox,
    so we will consider finite monkeys.)


    A frightening amount of software is clearly generated using the million-monkey
    approach, which is sufficient to evidence the fact that almost every software
    release since the first set of cards for the Jacquard loom has been delivered
    late. (We''re sorry, Sweater 1.1 has been delayed due to problems with the cable
    stitch subroutine. Now, the difficult part about the monkey method is not setting
    the monkeys to work, but filtering the results. Scanning random text for Shakespeare
    is relatively easy, because the desired output is well-defined; you simply compare
    the output against the known works of Shakespeare and there you have the answer.'
