    # 7.1 Analyze Your Goals: Benefits and Downsides of the Large Company


    Roughly half of all Americans work in large companies, and approximately one third
    of all new jobs created are generated by these large companies. Working for a
    large corporation is the traditional career path that engineers have followed
    for years, and it''s not a path that is likely to disappear any time soon.


    Developing complex electronic systems can be very expensive, requiring costly
    tools and a significant investment in prototypes and regulatory testing requirements.
    Furthermore, in today''s environment, most new products are built incrementally
    on existing platforms and protocols, which means (unfortunately) that they''re
    built on other people'' patents. Barriers to entry are therefore incredibly high.
    Large companies have the financial clout to penetrate some of these markets. For
    this reason, if you want to work on really major projects—the twenty-first century
    equivalent to the Apollo program—or massmarket consumer appliances—you''ll absolutely
    have to go to a large company.


    This isn''t entirely bad news. Large companies offer financial stability (as long
    as you work in a department that is making good profits for the company, and as
    long as you''re pulling your weight enough to keep your manager happy). You''ll
    also have access to good laboratory facilities and the best equipment, as long
    as you can persuade your manager that there''s a sound business case to purchase
    them. Finally, the very best benefits (though not necessarily base pay, certainly
    not cash bonuses) can generally be found at large companies—401(k) programs, cash
    payouts for patent disclosures, premium healthcare and dental plans, tuition reimbursement,
    employee discount plans with other companies, guaranteed vacation time, and more.


    > ¹ This is defined negatively; a "large company" for the purposes of this statistic
    is any company that isn''t covered by the rules of the Small Business Administration.'
