    # 2.5 Practical Skills You''ll Want to Acquire


    Regardless of how far you eventually intend to specialize, there is a small core
    of baseline skills that will benefit you greatly in any sector of embedded engineering.
    Some of these skills are taught explicitly in college, some of them are mentioned
    peripherally not examined in any detail, and the remainder are acquired and honed
    exclusively through practical experience.


    I hope the fact that you are reading this book—and presumably somebody paid to
    buy it—helps to demonstrate that one of the most important skills you can acquire
    is to learn the art of effective reading and writing in the apparently dead language
    known as English. Most engineers will probably not author full-length books, but
    any good engineer will write thousands of words of technical documents in their
    careers, including the following:


    +   - Product specifications, explaining to marketing and the people who write
    your product manuals exactly what the product will do


    +   - Protocol specifications, explaining to other engineers how to talk to your
    product


    +   - White papers, describing to other engineers what you''ve been working on
    and useful discoveries you''ve made


    +   - Patent disclosures


    +   - Instructions to subordinates


    +   - Articles for technical journals (Being published in this way can substantially
    improve your visibility within an organization—think raises and promotions.)


    +   - Debugging information, communicating with vendors, quality assurance technicians
    and engineering colleagues to solve complex problems


    +   - Justifications (dare I say it) for taking a specific course of action (When
    things get out of control and the recriminations start to fly, the one with the
    best paper trail usually wins.)'
