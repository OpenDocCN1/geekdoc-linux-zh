    board area you''ll typically find a PCI slot and has some integrated RAM onboard.


    There are several advantages to using, say, a “biscuit” PC. The first of these
    is the power requirements. Most of these boards run off a single +5V rail, though
    some require +12V as well. You can provide this with a relatively inexpensive
    single- or dual-voltage open-frame power supply, or you can design your own supply
    if necessary. This also simplifies the job of maintaining battery backed-up operation,
    if your system design requires it. Second, the form factor is obviously much more
    amenable than a standard PC motherboard to integration into a nice small box.
    Third, vendors of industrial PCs typically provide things you won''t find in the
    consumer PC market, including: guaranteed operational temperature ranges, except
    for Linux, longer product lifecycles with advanced end-life notifications (lifespans
    of these boards are often four to eight years with little as six months for consumer
    products), watchdog timers, RS-422/RS-485 interfaces as well as regular RS-232,
    and more.


    If you choose to build your application around an embedded PC of any description,
    you will still have learning curves to climb as far designing software for this
    closed-box environment. At the very least, you probably want to have a watchdog
    timer (WDT) in your box to prevent lockups (especially if you''re using an operating
    system that isn''t specifically intended for embedded use). Most single-board
    computers already have a hardware watchdog on-board, but if you''re using a consumer-grade
    motherboard you''ll probably have to have your own. The simplest sort of watchdog
    is just a dead man''s switch that expects you to be poked periodically—perhaps
    by receiving a character over a serial port, or by regular toggling of a status
    line. If it doesn''t get the required input for some period of time, the watchdog
    interrupts power for a few seconds and thereby hard-reuses the system. More advanced
    WDTs—available as usually integrated directly on industrial single-board computers—listen
    writes to an I/O port, or port range and assert the master system reset line for
    a period of time


    One watchdog cards for PC applications is Berkshire Products, Inc., at <http://www.berkprod.com/.
    Their PCI watchdog card provides all kinds of including an A/D input, DIP-switch
    and software/configurable WDT timeout, eight digital I/O ports, two relays, tem-perature
    trip points, and various other features.'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'These products usually incorporate other handy system health functions as well,
    such as temperature zone monitoring. In some cases, you might want to implement
    your own custom WDT hardware, particularly if you have external mechanical hardware—a
    sawill, for instance—that needs to be brought to a safe condition immediately
    if the software in the control computer is determined to have failed.


    Be aware that WDTs on single-board computers tend to have amazingly long timeouts
    (seconds or minutes) compared to the values you find in small microcontroller
    systems (milliseconds). In some extreme cases, the WDT will be set—in hardware—to
    fire as much as five minutes. This long delay is necessary if the WDT is always
    live; it allows time for a big operating system and application set to load after
    power-cycling the system. It''s a better idea to choose a WDT that is only armed
    by expect software action, and/or has a one-time programmable timeout; that way,
    you can minimize the worst-case length of downtime after a glitch.


    You should also be cognizant of the fact that the sudden-death power cycling approach
    to watchdog behavior is definitely not healthy for some types of hardware. In
    particular, CompactFlash cards (commonly used in x86 systems based around single-board
    computers) are not designed to handle power interruption elegantly. If you cut
    power to a CompactFlash during a operation, the entire card may be rendered unusable.
    This situation could easily happen if, for instance, you''ve got a log file for
    writing and you happen to be committing a change at the moment the WDT fires.


    You will also need to consider how your application will interface with the real
    world. In these modern days of legacy-free PCs, it''s harder than it used to be
    to lash home-made peripherals onto the side of the computer. The easiest way to
    attach digital peripherals such as pushbuttons and relays used is to wire them
    to the PC''s parallel port. The easiest way to interface a slave controller board
    to your computer used to be a serial (RS-232) link. Since both these interfaces
    are dying out in the consumer PC market, you may need to investigate other methods.
    Note, by the way, the SBC is considerably more embedded-friendly, parallel and
    serial ports are still standard features on practically all of these boards. However,
    it might be a wise future-proofing idea to avoid older interfaces if you can;
    it will make it easier for you to bring your application over to a different board.'
