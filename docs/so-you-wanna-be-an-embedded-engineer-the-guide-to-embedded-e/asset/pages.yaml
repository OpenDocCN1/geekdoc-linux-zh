  md: '# Working for a Larger Company 237


    Sony, for instance, makes a bunch of showcase gadgets intended to be profitable,
    simply because its corporate strategy includes a desire to be perceived as leading
    its competitors in innovative designs.


    It''s also relatively common for products to be introduced as leaders for either
    other, more profitable products, or for IP licensing deals. As an illustration
    of this, Sony''s proprietary Memory Stick storage card format was promoted very
    heavily on its initial introduction; Sony was virtually paying other companies
    to develop products that used the Memory Stick. Now, the shoe''s on the other
    foot—it relatively expensive to become part of the Memory Stick club, and presumably
    Sony is now starting to see actual revenue from the development effort.


    Real life, of course, is considerably woolier than my highly idealized previous
    description. For instance, it''s an unfortunate inescapable fact that many if
    not all engineering projects have a certain seasoning of theoretical research
    about them. Keep in mind that I do not use phrase “theoretical research” in quite
    the way a scientist would; I use it to mean the process whereby we have a list
    of proposed features—usually quite vague—and decide what sort of hardware will
    be required to implement them. This process is a delicate balance, and is much
    more of an art form than a science. It seeks a solution that is bounded by the
    following:


    +   - How much time do we have to spend on early analysis? The range of parts
    available to us is approximately infinite.¹⁶ The more time we spend scouring-
    the earth for new microcontrollers, ASICs and ASSPs, the more likely we are to
    find a “better” solution than the current best proposal.


    +   - How much money can we spend acquiring test equipment? If we can build a
    quick and dirty prototype, or at least port some of our critical firmware onto
    a reference board for the chip under consideration, we can gauge whether the part
    is adequate or not. This kind of spending is scientific research funding, though—not
    actual product engineering.


    > ¹⁶ By this I mean that the only condition effectively limiting the resources
    we can spend searching is that point at which it is no longer worth continuing
    the search. In other words, we can find a “good” solution and continue searching
    for a “better” solution, but we can never find the “best” solution. It usually
    isn''t even possible to define what the “best” solution might be, although most
    attempts at such a definition normally begin by assuming a hypothetical custom
    device that contains exactly the features we need and no more.'
