    There are two competing viewpoints about the end of the offshoring trend. For
    want of an official term to describe either, I''ll call the Malthusian theory
    and the other Utopian Theory. Each of these theories really represents a continuum
    of beliefs, of course, with the extreme Malthusians lying at one end, the extreme
    Utopians lying at the other, and a considerable spectrum of different opinions
