  md: '# Teaching Yourself, Bottom-Up 103


    The ATmega32 offers a rich set of peripherals useful for this sort of project,
    but inevitably once you start to use those peripherals, the availability of general-purpose
    I/O pins shrinks.


    To realize the maximum amenity from the ATmega32''s peripheral set, you therefore
    need to categorize your I/O requirements, first according to whether a hardware
    feature of the microcontroller can carry out or accelerate the desired function,
    and second (in the case of functions that you will be implementing entirely in
    software), according to the specific timing limits for implementing the function.
    For example, something like a radio receiver input, with tight timing requirements,
    would be best connected directly to a micro input pin (preferably with interrupt-on-change
    capability).


    You need to build enough I/O expansion to get around the shortage of I/O pins
    on the microcontroller. You can achieve this goal in many ways, of which are the
    top three:


    +   - Use external flip-flops (for example, 74HC373) to latch expansion data and
    external tristatable buffers (for example, 74HC244) to scan in inputs.

    - Use the ATmega32''s on-chip SPI module to drive external I/O expanders.

    - Use the ATmega32''s on-chip I²C (TWI, see sidebar1) module to drive external
    I/O expanders.


    Each of these methods has its own distinct advantages and disadvantages which
    are worth exploring.


    Using external logic is a simple route. It also offers the lowest possible latencies.
    However, the difficulty is that it directly connects a relatively large number
    of I/Os. For example, if you wanted to add 24 I/Os to your device, you could add
    three 74HC373s and three 74HC244s. The inputs of the 373s and the outputs of the
    244s would form a common data bus, routed to eight pins on the micro. But you
    would also need a read/write strobe line and at least three addressing pins—bringing
    the total required I/O count up to 12.'
