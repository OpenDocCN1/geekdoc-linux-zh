    can only tell you your vehicle''s acute angle off in the $X$ and $Y$ directions.
    It cannot completely resolve this information into a unique vehicle orientation.
    Consider the two situations in Figure 3.15, where I roll a vehicle through 15
    degrees and then through a further 150 degrees (note that these diagrams represent
    a stern view of the vehicle).


    ![](img/c399ccf73cf87546c20eb6734a6baa3d_126_0.png)


