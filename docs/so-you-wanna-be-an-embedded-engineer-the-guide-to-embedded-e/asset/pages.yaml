  md: 'As you can see, the process is structured in such a way as to avoid depressing
    wages, and to give employment to U.S. residents preferentially before authorizing
    an immigrant worker to fill the position. A few laws have also been tweaked—see
    particularly my last point—to avoid some of the stress this process causes on
    the H-1B holder. Being an H-1B, especially if your employer isn''t doing very
    well financially, is very frightening.


    That''s how it all works in theory; there are various abuses that are reported
    to occur. The most commonly reported abuse is that shell companies will bring
    H-1B talent in at a low rate (based on prevailing wages wherever the shell company
    is based) and hire them out to companies located elsewhere at a massive hourly
    rate. Some the H-1B is not even paid the amount that was specified in the LCA.
    The H-1B is paid aittance; the shell company pockets the difference. Purportedly,
    these companies treat their employees virtually like slaves; they''re threatened
    with withdrawal of sponsorship (which means an end to their eligibility for U.S.
    employment) if they complain.


    At the end of day, I can judge the availability of embedded jobs in America largely
    by the recruitment activity I see, and that activity is formidable and growing.
    Ignore the doom and gloom; outsourcing and worker visas are not going to preclude
    you from work in the United States. I would, however, advise you to keeping the
    management track if this option is offered to you; outsourcing does occur, and
    it''s usually happening to “individual contributors”. On the other hand, the need
    for competent project managers is growing enormously. Being able to assume either
    role makes it easier for you to avoid the need to look for a job with a new company
