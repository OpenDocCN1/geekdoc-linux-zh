    The 2G accelerometer I''m discussing here is typically used for measuring roll
    and pitch of a vehicle or perhaps a video game controller. For example, you might
    use it in an auto-leveling circuit for a model aircraft. The accelerometer would
    be mounted with one axis—the X axis, without loss of generality—parallel to the
    stern-to-bow line of the craft, and the other axis (Y, in this case) running from
    port to starboard. (See Figure 3.14)


