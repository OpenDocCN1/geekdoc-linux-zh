    Delivering the initial specification document will trigger another round of discussion
    with the customer, another round of specifications, and this process can go on
    quite a while. Hopefully, you are spiraling in converging on a solution that''s
    acceptable to the customer, but this doesn''t always happen. Be aware of this
    possibility; you can waste a terrible amount of time going backwards and forwards
    researching all the issues surrounding a project like this, and that time would
    be better spent on more profitable work (It’s moments like these that you can
    really appreciate the people in a big company whose full-time job it is to work
    on negotiating details with suppliers and customers, so that engineering gets
    at least a accurate specification with most of this iterative stuff filtered out
    of it.)


    Once you nail the specification and start working, unfortunately you''ll find
    customers almost invariably start to throw in additional last-minute changes.
    It’s a basic and practically inviolate rule of engineering—hardware or software—that
    the later changes are introduced, the more expensive they are to implement. You
    really can''t do anything about this problem except to keep the customer informed,
    as accurately as possible, what these change requests are going to cost in time
    and money terms. (Experience is a great help here.) Unfortunately it takes a lot
    of discipline to prevent these changes from interfering with the overall integrity
    of the system design. There’s a horrible temptation to patch the new feature in
    quickly in software or hardware, and this almost invariably results in a loss
    of overall design integrity.


    Be very cautious, then, about these last-minute changes. Merely by virtue of the
    fact that they are indeed last-minute, they will not have received the same scrutiny
    as all the other features that you and the customer discussed “finalizing” the
    specification. It’s here that you’re going to find the lurking bear traps; the
    things that can''t quite be done in software, the feature that doesn''t match
    the rest of the system is supposed to work, and the functionality that’s going
    to be just a bit more than your hardware platform can handle. Changes that are
    truly minor—switching the red LED for a green one, or changing the default volume
    setting on a device with audio output—are not a cause for worry, but more complex
    changes should, if necessary, trigger a requite for the entire project, and development
    of an entirely new specification and delivery schedule. Patching a project as
    it’s going out the door is a recipe for expensive disasters.'
