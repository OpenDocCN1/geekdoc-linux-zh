    Figure 3.1 40-DIP 8051 pinout.


    The pin count is dominated, as you see, by the general-purpose I/O (GPIO) ports.
    There are four 8-bit ports in the standard 8051, providing up to 32 available
    I/O lines. Ports 0, 2 and 3 are however, multiplexed with other functions, shown
    in patents. (Note that there are still other alternative uses of pins when the
    part is being programmed in a suitable burner; those uses are not shown here.
    The baseline 8051 series parts are not in-system programmable.)


    Be aware that not all of these GPIOs behave identically, when their associated
    multiplexed peripherals are not enabled! It is a rookie mistake in an 8051 design
    to assume that the drive characteristics of all GPIOs are identical. In particular,
    you must note that port 0, when being used as a general-purpose port, has open-drain
    outputs with no internal pull resistor (The behavior of port 0 is different when
    external memory is being accessed; see the following for more details on that.)
    Ports 1, 2, and 3 have on-chip pullups; if you use them as inputs, and an external
    device pulls the pin low, the 87C51 will source current.


    The following are miscellaneous pin functions.


    +   * RXD – Receive and transmit data for the on-chip UART, respectively.'
