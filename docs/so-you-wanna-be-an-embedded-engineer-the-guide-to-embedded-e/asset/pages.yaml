    # 5.7 More Than a Handshake: The Importance of Contracts


    It''s a common misconception that you can do business with friends and family
    without needing any documentation of the work. Many people also feel that insisting
    on contracts, due dates, and specific terms of sale will imply a lack of trust
    on one or both sides, and undermine personal relationships with the aforementioned
    friends and family.'
