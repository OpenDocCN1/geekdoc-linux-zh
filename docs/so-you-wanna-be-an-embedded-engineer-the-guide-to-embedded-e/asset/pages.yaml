  md: '![](img/c399ccf73cf87546c20eb6734a6baa3d_170_0.png)


    applications include blob, U-Boot and RedBoot, although there are others—and there
    many applications that use utterly proprietary bootloaders. Figure 4.2 illustrates
    a typical start-up flow for a non-x86 embedded Linux device.


    Observe that, for the preceding x86 startup process, you have the possible different
    routes once the kernel has been loaded. Note also that once control passes to
    the kernel, the boot process is identical to what it was on the x86. This is to
    be expected: the further you get in the boot process, the more the software environment
    is defined by the operating system’s API specification rather than the vagaries
    of the underlying hardware.


    The exact layout of such a system in Flash memory depends on two principal factors:
    the Flash device sector size (usually in the neighborhood of 64 KB), and the processor’s
    power-on-reset behavior. A core like ARM, which starts execution at address 0,
    will put the bootloader at the bottom of Flash. A core like x86 will need to put
    the bootloader at the top.


    There are at least two, and generally four, entities that need to be installed
    in Flash: the bootloader (mandatory), an optional parameter block providing nonvolatile
    storage for boot options, calibration data and other information, the Linux kernel
    (again, mandatory), and almost always an intial RAMdisk image. For example, a
    layout for a 4 MB Flash chip with a 64 KB sector size might be as follows:


    +   - 00000–01FFFF Bootloader (128 KB)

    - 02000–0FFFF Parameter block (64 KB, probably mostly unused)

    - 03000–1FFFF Kernel (1.8 MB)

    - 20000–3FFFF Initial RAMdisk image (2 MB)'
