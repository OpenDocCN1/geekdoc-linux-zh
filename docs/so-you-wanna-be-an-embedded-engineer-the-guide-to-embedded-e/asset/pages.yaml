  md: '# Teaching Yourself, Top-Down 163


    While it is possible to write these various segments across sector boundaries
    (and it is especially tempting in the case of the parameter block, which will
    likely be more than 99% empty), this is an extremely unwise practice and should
    be avoided unless you are under severely Flash space constraints. It is particular
    that the bootloader should reside in a private segment that can be left write-protected.
    Otherwise, a failed firmware upgrade operation may leave the system entirely inoperable.
    Good system engineering should provide a safe fallback position from any possible
    user-initiated process.


    The only part of this software bundle that absolutely must be preloaded at the
    factory. Once the system is startable from that boot code, you can use other (end-user-accessible)
    interfaces to load the kernel and RAMdisk image.


    By the way, at this point the attentive reader may be wondering whether embedded
    PC applications can use a special boot ROM that simply loads the operating system
    directly off disk (or some other medium).


    The answer to this is that while it is possible to write a custom cut-down-bootstrap
    program for a PC motherboard (see, for example, the LinuxBIOS project), the types
    of applications that use PC hardware tend to be using the board as a black box.
    Typically, the system integrator will not even have access to datasheets or schematics
    for the board; they can’t write a bootstrap program even if they want to. Furthermore,
    PC operating systems are built on the assumption that lowest-common-denominator
    BIOS services are available, at least at boot. In other words, it’s a simple fact
    that the path of least resistance is so much easier than a fully custom alternative
    that nobody tries to do it the “smart” way. The inefficiencies of the multilayer
    BIOS approach are lost in the noise (as it were) compared with the overall system
    specifications.


    Having digested all the previous information, assuming you understand approximately
    large your various software modules will be, you are well prepared to select Flash
    and RAM sizes and layouts for a custom embedded system. Many devices use a very
    uncomplicated memory architecture; they have a single linear Flash chip (NOR Flash,
    i.e., bootable) large enough to hold the bootloader and compressed operating system,
    and a relatively large area of SRAM or SDRAM, typically between 16–64 MB. While
    this is the simplest design, it is not necessarily the cheapest, and you may wish
    to consider other alternatives if you are designing your own system.'
