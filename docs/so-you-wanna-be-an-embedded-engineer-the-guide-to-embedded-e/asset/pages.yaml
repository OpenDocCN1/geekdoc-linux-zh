    specialized parts. Some of them feature optimized microcode with fewer machine
    cycles per instruction; some have higher maximum clock speeds, more RAM, on-chip
    debugging capabilities, fairly UARTs, and so on. Once you start looking at ASSPs⁴
    digital camera ICs, US keyboard and mouse controllers, USB-to-Flash-media interface
    chips and so on, and there is no standardization at all the bare instruction set;
    certainly, there are no drop-in replacements from different vendors. As a result,
    the 8051 is really only a true multisource part (in the sense of drop-in pin-for-pin
    replacement) if you care to avoid using any vendor-specific features—in which
    case, why should you pay for them?


