  md: '# Teaching Yourself, Bottom-Up 47


    The area from 020h through 02Fh is user-available scratch memory, but has the
    interesting and useful property that it is addressable at the bit level in a single
    instruction. The bits in this area are logically numbered from 000h (bit 0 of
    location 020h) through 07F (bit 7 of location 02F). When using an assembler that
    employs standard Intel syntax, you can refer to each location either by its 7-bit
    address or as "20.0", "2E.4" and so on. It is extremely code size-efficient to
    put your program''s flags or other bitwise-accessible data in this area, and indeed
    this is one of the 8051''s key strengths.


    The remaining area from 030h through 07Fh (the top of internal memory in 8051)
    is scratch RAM available for the stack and other purposes.


    Above the internal data memory, from 080h to 0FFh, lies the special function register
    (SFR) area. These registers control the various hardware features in the microcontroller;
    the following table shows their functions. Observe that many of these registers
    are directly bit-addressable. Also note that the SFR consists consists of empty
    holes; these spaces are used to control other hardware in enhanced 8051 variants.
    For example, since the DPTR is a scarce resource, many 8051 vendors implement
    an additional DPTR—or even more than one—to speed up operations such as bulk memory
    copy or to allow the user to maintain state in more than one thread without needing
    to save and reload the DPTR.


    | Address | Bit? | Name | Function |

    |---|---|---||

    | 080h | | P0 | Port 0 |

    | 081h | | SP | Stack pointer |

    | 082h | | DPL | DPTR (data pointer) low byte |

    | 083h | | DPH | DPTR (data pointer) high byte |

    | 087h | | PCON | Power Control |

    | 088h | Y | TCON | Timer/Counter Control |

    | 089h | | TMOD | Timer/Counter Mode Control |

    | 08Ah | | TL0 | Timer/Counter 0 low byte |

    | 08Bh | | TL1 | Timer/Counter 1 low byte |

    | 08Ch | | TH0 | Timer/Counter 0 high byte |

    | 08Dh | | TH1 | Timer/Counter 1 high byte |'
