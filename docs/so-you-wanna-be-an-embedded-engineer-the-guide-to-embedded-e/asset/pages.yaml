    # 5.5 Pricing Your Services Appropriately


    It is a capital mistake—frequently made, and extraordinarily hard to undo—to underprice
    your services or set payment terms that are excessively liberal. If you overprice
    yourself, you will simply not attract many clients. You can observe this and start
    to reduce your price as appropriate. If you underprice yourself, however, you''ll
    get into a much worse situation. You''ll start to build relationships with people
    based on your low price, you''ll start to rely on the income stream coming from
    this work, and if you try to adjust your price upward at a later date, you may
    find that the resulting drop-off in business affects your financial survival.
    Note that I don''t mean that this your customers will not say you''re not paying
    extra. What I''m warning you against is that if you underprice yourself, you may
    be building your future financial stability on a raft of customers who simply
    cannot afford industry rates for your expertise.


    The most rational way to judge how much to charge for your time—particularly if
    you''re moonlighting—is by analyzing the opportunity cost of doing freelance work.
    The opportunity cost of an activity is a piece of economics jargon meaning the
    returns foregone by choosing activity instead of the most profitable alternative.
    To give an example, let''s say you have been offered the chance to give an hour-long
    lecture one evening, in return for a speaker''s fee of $5,500. You estimate the
    lecture will take you four hours to prepare, and that there will be perhaps two
    more hours of travel to and from the venue, and an hour of question time involved.


    If you don''t give the lecture, let''s say your next profitable activity would
    be working on a contract job at $100 per hour. Giving the lecture would consume
    eight of these billable hours, so the opportunity cost of giving the lecture is
    $800 (assuming that you actually have contract lined up, you would have to decline
    if you give the lecture).


    The situation isn''t as clear-cut as I have presented it, by the way. A creative
    accountant looking at the same situation would undoubtedly point out that giving
    a lecture counts as advertising your services, so the lecture earns more than
    $5,000. Assessing how much this of advertising or goodwill might be worth in dollar
    terms is a specialized art; experience will teach you what business you can expect
    to come out of a session of this sort.'
