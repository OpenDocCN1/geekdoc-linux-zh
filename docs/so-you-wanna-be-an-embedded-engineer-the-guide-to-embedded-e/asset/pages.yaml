    The normal sequence of events at powerup would be as follows:


    +   - A small bootstrap program at 0x00000000 (physical memory) jumps to a location
    in the 0x40000000-0x5FFFFFF range. Note that this is still executing out of the
    same physical memory device; it’s merely a change in the program counter.

    - The remainder of the bootstrap program initializes static memory controller
    and SDRAM controller to match the product’s physical memory map and the attached
    devices. Note, by the way, memory-mapped peripherals are attached to the static
    memory controller.

    - The main program image is copied to SDRAM or on-chip RAM.

    - The remap register is set to either 0b01 or 0b10 (0b01 would generally be more
    useful).

    - The bootstrap program jumps to location 0x00000000, which is now pointing at
    high-speed RAM, usually 32 bits wide.

    - Main program image execution begins. Observe, by the way, that the ARM vector
    area at 0x00000000 is now in RAM.


    Now, an important point: The ARM core operates with 32-bit words. It expects to
    have external hardware manage the byte lanes for unaligned accesses and memories
    that are less than 32 bits wide. Therefore, it is absolutely critical that you
    take care to program the static memory controller for the correct width of the
    device you’re accessing, and (particularly in the case of memory-mapped I/O devices)
    that you use the correct instructions to access memories that are narrower than
    32 bits. If you don’t heed that last warning, you’ll experience some very odd
    behavior, because the static memory controller (SMC) will select the'
