    In the remainder of this section, I''ll introduce you to some of the details of
    the Linux startup process to illustrate what''s involved in embedding Linux. Most
    of this text was first published on IBM''s developerWorks website in an article
    I wrote in 2005; it has been edited for coherence with this book. If you''re interested
    in Linux development on PowerPC, I suggest you read the entire series of articles,
    which you can access through an index page at <http://www.larwe.com/technical/current.html>.


    By the time a system has booted to the point where it can run your application-level
    code, any variant of Linux is, practically by definition, largely similar to another.
    However, there are several different methodologies that you can use to get the
    system from power-on reset to a running kernel, and beyond that point, you can
    construct the filesystem in which your application will run in different ways.


    Each approach has its own distinct advantages and disadvantages, and a definite,
    two-way relationship exists between the hardware you choose to implement and the
    way you structure the power-up and Initial Program Load (IPL) process. Understanding
    the software options available to you is a critical part of the research you must
    do before designing or selecting hardware.


    The most fundamental and obvious difference between x86 boards and embedded systems
    based on PPC, ARM, and others is that the x86 board will ship with one or more
    layers of manufacturer-supplied "black box" firmware that helps you with power-on
    initialization and the task of loading the operating system out of secondary storage.
    This firmware takes the system from a cold start to a known, friendly software
    environment to run your operating system. Figure 4.1 is a diagram of the typical
    PC boot process, with considerably more detail than you tend to find in PC-centric
    literature.'
