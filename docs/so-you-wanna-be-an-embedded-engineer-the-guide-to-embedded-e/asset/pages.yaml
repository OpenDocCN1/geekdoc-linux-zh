- img_proc: true
  md: '# Chapter 3


    in still is the same, the new data is latched into a status buffer. This is not
    a very advanced debouncing method by any stretch of the imagination, but it performs
    adequately in lab conditions (at least, with reasonably well-behaved switches).
    If you''re interested, look at <http://www.gansle.com/debouncing.pdf>, where you
    can read a detailed article on debouncing techniques, accompanied by reams of
    actual real-world data. If you want to implement a more advanced debouncing method,
    I''ve wired the interrupt request line from the MCP23008 to one of the GPIOs on
    the microcontroller. Since this line can be configured as an open-drain output,
    you can add more I/O expanders and simply connect all their interrupt lines to
    the same point for a wired-AND configuration. An external pull is not necessary,
    as the ATmega32 has on-chip pulls.


    One further subtle I''ve added to this circuit is optical isolation of the input
    lines, accomplished very easily with a standard six-pin optocoupler and a couple
    of resistors. This additional circuitry serves two purposes: first, it protects
    the microcontroller from outrageous events such as miswired connectors or electrostatic
    discharge, and it also provides a kind of level-shifting capability; you can interface
    anything to the input side of the optoisators. You''ll be very grateful of this
    isolation circuit if you ever tap an unregulated battery line onto one of the
    inputs; it''s much easier and cheaper to desolder an optocoupler to replace the
    micro! Please note that you want to get the full amenity of the ESD isolation,
    you will need to ensure that whatever is outside the VCM box has a separate (or
    at least, isolated) power supply from the VCM. Otherwise an ESD event on your
    external hardware will propagate into the VCM through the common power rail, largely
    negating the benefit of the optocouplers. Note that the series resistor I selected
    for the optocoupler LEDs is correct for a +12V external supply; you will need
    to tweak this if you run the common anode line to a different voltage.


