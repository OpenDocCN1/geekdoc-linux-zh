    Note that the SFRs can only be accessed by direct addressing modes. For example,
    “MOV 080H, #012H” will write 012H to the SFR at address 080H, which is to say
    Port 0. However, “MOV R0, #080H” followed by “MOV @R0, #012H” will not change
    the state of Port 0.


    The reason for this seemingly odd behavior is that 8051 has larger internal RAM
    space—the 8051, for instance—implement RAM “underneath” the SFR area. If you want
    to access the SFRs, you use direct addressing; if you want to access the RAM with
    the same nominal address, you use indirect addressing modes.


    The final type of memory accessible by the 8051 is “XRAM”, which is accessed indirectly
    using the 16-bit DPTR register and the MOVX instruction (e.g., “MOV @DPTR,A” stores
    the accumulator at the external address referenced by DPTR). Just pause here to
    take stock of all the different address spaces; we have program memory (MOVC,
    read-only), data/SFR memory, and external data memory (MOVX, read/write).


