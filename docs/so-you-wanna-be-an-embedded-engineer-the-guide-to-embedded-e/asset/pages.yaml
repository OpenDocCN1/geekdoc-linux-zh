  md: '# Working for a Larger Company 219


    The major downside to large companies is, commonly, a loss of individual creativity
    and freedom. Employees in the large-company environment are usually specialized
    and pigeonholed for efficiency reasons; they are not exposed to cross-functional
    requirements except when they hear teammates reporting on other aspects of the
    project.


    Most large companies also have onerous development procedures designed to fit
    a theoretical general case; in many cases, these procedures have all kinds of
    inbuilt requirements that are more or less orthogonal to the idea of developing
    a quality product and releasing it quickly. Design cycles, even for simple products
    like toys, are typically long in the large-company world (two years or more) compared
    with the 6–9 month cycle in small companies. All this can be very risky to a creative
    employee.


    Because most large companies sit on significant cash reserves, there is also a
    distinction between “my” money and “company” money. Employees therefore often
    become complacent about development costs. (In many cases, engineers are the “individual
    contributor” level will not have enough information to estimate development costs—they
    can be amazed when they see the numbers.) Time, in particular, becomes an easy
    commodity to spend. There is also little link between the product’s palatability
    to end-users and the engineer’s paycheck; as a result, human factors are all too
    frequently neglected in large-company products. At other times, internal company
    politics can cripple an otherwise good product; for example, a desire for the
    cheap home-user version of a product not to compete with some more expensive commercial
    or industrial version.


    Choosing to work at a large corporation is, for many people, a compromise between
    financial certainty² and freedom. Where you sit on this topic is a matter of individual
    preference; you should simply be aware that it is most unlikely that you will
    ever find a large-company position that involves the same broad task exposure
    and opportunity for individual achievement that can be found in the small-company
    arena.


    > ² This is a bit of an illusion, course. Every day, we read of layoffs and closures
    that affect the employees of large companies.'
