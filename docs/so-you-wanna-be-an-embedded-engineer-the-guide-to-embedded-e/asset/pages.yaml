  md: '# 160 Chapter 4


    less degree because some drivers "fight" and shouldn''t be loaded simultaneously).
    The solution to this problem is to link the bare minimum of drivers statically
    in the kernel, and to build all remaining drivers as separable modules, which
    are then placed in the RAMdisk. When the unknown target system is booted, the
    kernel (or start-up script) mounts the RAMdisk, probes the hardware, and loads
    only those modules appropriate for the system''s current configuration.


    Having said that, many embedded Linux applications run entirely out of the initial
    RAMdisk. As long as you can spare the memory—8 MB is usually more than enough—it''s
    a very attractive way of organizing your system. Generally speaking, this is the
    boot architecture I favor, for a few reasons:


    +   1. The root filesystem is always writeable. It''s much less work to have a
    writable root than it is to coerce all your other software to put its temporary
    files in special locations.


    +   2. There is no danger of exhausting Flash memory erase-modify-write times
    or corrupting the boot copy of the root filesystem, because the system executes
    entirely out of a volatile RAM copy.


    +   3. It is easy to perform integrity-checking on the root filesystem at boot
    time. If you calculate a CRC or other check value when you install the root filesystem,
    that same value will be valid on all subsequent boots.


    +   4. (Particularly interesting to applications where the root filesystem is
    stored in Flash.) You can compress the boot copy of the root filesystem, and there
    is no run time performance hit. Although it''s possible to run directly out of
    a compressed filesystem, there''s obviously an overhead every time your software
    needs to access that filesystem. Compressed filesystems also have other annoyances,
    such as the inability to report free space accurately (since the estimated free
    space is a function of the anticipated compression ratio of whatever data you
    plan to write into that space).


