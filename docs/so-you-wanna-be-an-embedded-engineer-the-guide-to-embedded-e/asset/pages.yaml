  md: '# Working for a Small Company


    # 6.1 Analyze Your Goals: Benefits and Downsides of the Small Company


    In this chapter, I''ll be talking about life in a “small” company. By this, I
    mean a corporation with a single place of business (possibly with a few work-from-home
    offices attached to it), which is not usually dominant in the markets where it
    sells its goods or services. There also exists a special class of small engineering
    business where the second criterion doesn''t apply, the company (often a startup)
    with a truly innovative product, a niche product for vertical markets, or a product
    consisting primarily of IP (intellectual property) that is heavily protected by
    patents and copyrights. This type of company is “dominant” in its market by default,
    since it is the only significant player in that market.


    As you''d expect, life in a small company has both advantages and disadvantages
    that are more or less in the middle between freelance work and working for a big
    corporation. Whether it''s right for you or not depends on individual preference.
    Working in a small company is, at the very least, excellent preparation for working
    in a larger company. Possibly the biggest advantage (some people would feel that
    it''s a disadvantage) working in the small-company environment is that every member
    of the team has cross-functional abilities. The great thing about this is that
    you''ll get to learn a lot about how to run a business, and you''ll also be exposed
    to challenges at a variety of levels in the organization. At the same time, however,
    you''ll have other people to lean on for the “infrastructure”—paying bills, ordering
    supplies, and so on—and a bigger financial cushion to sit on than you would otherwise
    have as a freelance consultant.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# 202 Chapter 6


    You''ll also be happy to learn that the procedural workload at a small company
    is at the absolute minimum level you''ll find in an engineering job. Freelancers
    need to do a fairly large amount of procedural stuff because there''s nobody else
    to keep the lights burning and bills paid, and engineers at big companies need
    to spend even more time on procedures because there are company policies that
    force them to. Working at a small company, you avoid both these pressures; it''s
    entirely possible in many companies for an engineer to get away with virtually
    no procedural workload at all.


    Whether this is a Good Thing or not is an interesting question; engineers and
    professors both complain constantly about the “code cowboys” who work, unsupervised,
    at small companies. Regardless of what you can get away with in terms of paperwork,
    design reviews and similar irritations, it''s important to deliver an objectively
    high-quality product at the end. While it may be the case that your management
    will reward you on delivering a product that boots up and works, regardless of
    how hairy the design might be under the hood, remember that every project you
    work on is a potential addition to your portfolio, to be shown to another employer.
    Also contemplate for a moment that the highest goal of many small companies is
    to develop some highly saleable technology and be acquired by a large company.
    When that integration arrives, your design will be subject to scrutiny by real
    engineers evaluating the value of your company. If you did an amateurish job,
    you would not only look bad, but might jeopardize the sale. Since acquisitions
    like this frequently result in large payouts to the engineers concerned, you''re
    doing yourself a favor disservice.


    Small companies offer a broad spectrum of salary ranges and nonsalary compensation.
    In general, you can expect a reasonable salary range and an employer-sponsored
    healthcare plan. Many small companies also offer profit-sharing schemes and a
    retirement plan of some kind. Beyond that, the benefits start to get fuzzy. You
    shouldn''t expect to find tuition reimbursement, a pension plan,² employee discount
    program and so on at a small company, although


    > ¹ Not always, of course. After you''ve been with the company for a while, try
    to secure some equity. This is your sure path to a big payout come acquisition
    day.


    > ² Note the difference between a pension plan (this is a specified payment awarded
    to you upon retirement based on years of tenure) and a retirement plan (this is
    a fixed balance, accrued during your working years, and distributed according
    to your preferences after you reach retirement age).'
