- img_proc: true
  md: '# Teaching Yourself, Bottom-Up


    The stepper outputs on the VCM board are labeled SAP1 through 4 (Stepper A 1 through
    4) and SBP1 through 4 (Stepper B 1 through 4). You should connect the phase lines
    up to the SxPx lines as appropriate, and the common line(s) from your motor to
    the +24V line. On the VCM, I use a 9-position terminal block to take these signals
    off-board.


    Attention! Observe the series resistors on the stepper drive lines. The zero ohm
    resistors I have specified are strictly placeholders; you should substitute suitable
    current-limiting resistors based on your drive voltage and the stepper motor’s
    coil resistance and rated current.


    This code and hardware are designed to provide very simple control of two four-phase
    unipolar stepper motors, Stepper A and Stepper B. The step functions are driven,
    by default, off a 100 Hz software timer. This is a moderate speed for junkbox
    steppers, and a fairly safe arbitrary choice on my part. The hardware is capable
    of considerably higher step rates, however. You should be aware of the following
    two issues as you increase step rates:


    +   * Without going into the detailed mechanics of it, a stepper cannot start
    from zero and instantly begin operating at its maximum rated step frequency. You
    need to implement “acceleration profiles” if you intend to get the most out of
    your motors. In brief, this means that you need to make a speed change on the
    motor, instead of just jumping to a new step rate, you ramp the step rate towards
    the target speed. Acceleration profiles need to be calibrated for the motor and
    the mechanical load being driven.

    * As you increase step rates, torque decreases. Cunning hardware designs are necessary
    to squeeze the maximum possible performance out of a given motor.


    This particular design is nowhere near pushing the envelope in either of these
    respects—you have plenty of headroom to increase step rates, for instance.


    Referring to stepper.c, you’ll see that the software keeps track of the absolute
    position of each stepper, checking it at the step speed interval. If the position
    ordered by the Kuro Box is not the same as the current position, the appropriate
    motor is stepped either forwards or backwards. The serial interface code listens
    “seek to...” packets and updates the target values appropriately.'
