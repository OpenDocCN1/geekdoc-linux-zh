    in case you haven''t disassembled a PC recently, bring all their external connectors
    for onboard peripherals (video, serial, USB, and so forth) to the back of the
    housing. The motherboard ships with a layout-specific connector plate that fits
    into a standardized hole on the back of the case, and seals the connector area
    against RF leakage. The mounting screws positions and the size and shape of this
    connector plate are standardized,³ you can easily develop a housing that will
    accept almost any modern motherboard.


    The disadvantages of this method are, however, shows for many applications. The
    worst downside is that in order to drive a PC motherboard you need a relatively
    complicated and expensive power supply. The smallest available power supply that
    have all the PC motherboard connections are intended for 1U rack-mount server
    cases (approximately 16.8" x 25.6" x 1.7" W x D x H); the power supplies are typically
    in the region of 5.5" x 10" x 1.5" with some protrusions. This immediately sets
    a lower boundary on the overall size and shape of your product; couple in the
    relatively large size of a standard PC motherboard and your housing design is
    going to wind up not too radically different from a normal slimline case. You
    also have to deal with a host of other issues: Cooling can be a problem in these
    confined spaces; fans on the CPU and in the power supply are noisy and constitute
    potential failure points; and as supplies of a particular motherboard fluctuate,
    you''ll need to keep altering your software bundle to match all the hardware you''re
    shipping. This can also make end-user upgrades problematic, since it can be difficult
    to keep your upgrader totally generic while making all these hardware changes
