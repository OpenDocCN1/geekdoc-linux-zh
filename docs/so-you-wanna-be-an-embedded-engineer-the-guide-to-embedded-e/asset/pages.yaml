  md: '# Chapter 3


    “Information memory” works a differently from the nonvolatile storage peripherals
    available in other 8-bit micros, and you might find it a little irksome for some
    applications. It’s implemented as two 128-byte Flash blocks¹⁵ named segment A
    and segment B. Erasure can only be performed with block granularity. Reads and
    writes can be performed with either byte or word granularity, with caveats that
    (a) you can only turn “1” bits to “0”, not the reverse; and (b) each time you
    write to any location in a block, it eats into that block’s accumulated programming
    voltage. If this cumulative programming gets too large, you’ll need to erase and
    rewrite the entire block. Of course, there is an overall erase-write lifetime
    for the memory array, also. The downside of this system is that it’s relatively
    annoying to implement nonvolatile data that are updated frequently (vending machine
    auditors, powerup lifetime timers, and so forth), because you need to read the
    entire segment into RAM, update the value you want to change, erase the Flash
    version, and write the entire segment back out. The reason that information memory
    is divided into two blocks is that you can implement redundant storage schemes
    to guard against a failure or other glitch during the erase or write operations.


    Contrast with the traditional on-chip EEPROM on most other parts in the same application
    space; the traditional method allows you to read, erase and write bytes individually
    (though it’s not quite as easy to work with those devices, they don’t usually
    map the entire storage array into the processor’s address space). If your application
    needs to store both frequently updated data (such as audit counters) and infrequently
    updated data (serial numbers, passwords and so forth), design your storage algorithm
    with great care, keeping the MSP430’s limitations into account. Also look very
    closely at the Flash endurance and compare it with the frequency which you’re
    erasing and rewriting the information memory.


    The on-chip bootstrap loader (BSL) is a handy ROM-based feature allowing you to
    reprogram the Flash memory using a three-wire serial interface; P1.1, P2.2 and
    ground. Using the BSL is documented in Texas Instruments document


    ¹⁵ Some MSP430s split info memory into 64-byte blocks. Most devices have the dual
    128-byte banks, however.'
