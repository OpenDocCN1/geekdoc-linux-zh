- img_proc: true
  md: '# Teaching Yourself, Bottom-Up 109


    | Name | Size | Description |

    | STRT | Byte | Start character, ''!'' |

    | CSUM | Byte | Unsigned checksum of all bytes in packet from CSUM+1 to end of
    BODY (or, all bytes except STRT and CSUM) |

    | TXSN | Byte | Serial number of transmission (see the following) |

    | IRSN | Byte | ''In Response To'' serial number (see the following) |

    | CMND | Byte | Command or data ID |

    | BLEN | Byte | Number of bytes in BODY or zero if no BODY |

    | BODY | Variable | Additional data, if required |


    Each end waits for a "!” character to begin data. The packet is deemed complete
    when the requisite number of BODY bytes has been received. Bytes received beyond
    the capacity of the serial-receive buffer are discarded. Since the start character
    might occur in the middle of real data, the CSUM field is used to verify that
    the data block just received was a complete packet.


    But what are these "serial numbers" I mention? They are a means of identifying
    specific question-answer pairs in a transmission stream, as well as spotting dropped
    packets. At power up, the VCM and the Kuro Box initialize their internal serial
    number counter to 1 (0 is a reserved value). When one of the link waits to send
    a packet, it sets the TXSN field to the current serial number value, then increments
    the serial number counter (if the counter overflows to 0, it is reset to 1). If
    the packet sent requires a response, when the other ends, it sets the IRSN field
    to the TXSN from the packet to which it is responding. An “originated” packet,
    one, that is not a response to a request from the other side of the link, has
    IRSN field set to 0.


    This simple system allows either end to keep a history of pending data requests
    and track which responses belong to outstanding requests (as well as, if necessary,
    implementing time-outs and retries on packets that simply don''t get a response).


    An example illustrates this most easily. Suppose you defined command #99 to be
    "Get current vehicle attitude," and command #100 to be "Get current vehicle position
    from GPS." Furthermore, suppose that the current serial in'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# 110 Chapter 3


    the VCM was 56 and the serial number in the Kuro Box was 80. Then say the Kuro
    Box wants to know the vehicle''s current attitude and position as soon as possible.
    It might send the following packets in quick succession:


    +   - A packet with CMND=100 (get GPS position), TXSN=80, IRSN=0, and no BODY

    - A packet with CMND=99 (get attitude), TXSN=81, IRSN=0, and no BODY


    The GPS position can take some time for the VCM to acquire, so the attitude could
    easily be ready for transmission before the position data. Assuming this scenario
    takes place, the VCM would respond with:


    +   - A packet with CMD=99 (get attitude), TXSN=56, IRSN=81, and attitude data
    in the BODY. Note that the nonzero IRSN implicitly indicates that this is a response
    rather than a request

    - (Later, when data is available) A packet with CMND=100 (get position), TXSN=57,
    IRSN=80, and the position data in the BODY.


    If some reason the VCM didn''t respond to one of these packets, the Kuro Box could
    keep a record of which serial numbers are outstanding, and after some time-out
    period, reissue the request. (Note that this system breaks down if the serial
    number wraps and comes back to the same number as the earliest pending request.
    For reason, your time-out code should also trigger if TXSN wraps to the earliest
    pending serial number.)


    Before you run the code, you should understand what it does and how to wire your
    stepper motor(s). The link I mentioned previously describes in detail how a stepper
    motor (synchronous DC motor) is constructed and driven, but here''s a thumbnail:
    A stepper motor has fixed coils and a permanent magnet rotor. The types of motors
    I designed the VCM to use four coils (phases), each of which has one line run
    to a common wire and the other wire run to the outside world. (The common wire
    is also run to the outside world.) When a given phase is energized, it pulls the
    rotor toward a certain position. The four phases are physically positioned so
    that if you energize them in sequence (1, 2, 3, 4, 1, 2, 3, 4, 1, ...) the motor
    will turn continuously in a given direction.'
