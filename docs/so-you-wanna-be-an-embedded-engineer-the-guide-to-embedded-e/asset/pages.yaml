    The MPC8241 microcontroller provides (among other features) an-chip PCI bridge,
    SDRAM and Flash controllers, and two serial ports. The first serial port is connected
    to J1, the debug console port. The signal swing is from 0V to +3.3V, and it is
    inverted for compatibility with RS-232 level shifters. The second serial port
    is connected to the slave microcontroller (AT90S2313). This micro handles power
    sequencing and tachometer feedback, and also provides a master watchdog for the
    MPC8241. The software bundle preloaded on the Kuro Box includes a daemon that
    kicks this watchdog periodically. CN1 on the motherboard is a standard 6-pin AVR
    ISP port connected to the slave microcontroller.


    The board also offers a normal COP/JTAG debug port, although the connector is
    not populated as shipped from Buffalo. In order to use this, you should add the
    10K series VIO resistor R67 and a 4-1K resistor part to RA11. The least expensive
    route to use the COP is through a “wiggler” connected to your PC’s parallel port;
    the cheapest commercially available product for accessing the MPC8241’s on-chip
    debugging facilities is the Macraigor Wiggler.


    In this text, I''m going to use a lot of acronyms specific to the E-2 project.
