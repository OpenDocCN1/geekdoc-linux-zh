    # 5.6 Establishing Your Own Working Best Practices


    I cannot possibly overstress the need for freelance one-person engineering consultancies
    to be both ethical and well-organized. There are a huge number of things that
    need to be managed in such a business, and if you don''t pay care to these issues,
    you will present a very chaotic appearance to the outside world. This is not something
    that is calculated to draw in future customers. It is imperative, therefore, that
    you create a system for carrying out your business, and that you stick to it consistently.
    In fact, it''s preferable to have a primitive system that you use consistently
    than an advanced system that you don''t often use; given the potential complexity
    of migrating a business from one operating method to another, it is also usually
    preferable to stick with an existing system until it is absolutely impossible
    to delay migrating to something new. You get engineering to do; you don''t have
    time to be re-sorting documents and so forth. On the other hand, if you just break
    off from one system and start a new one, you''ll have a lot of annoyance (at least
    in the first year or so), because you''ll constantly be looking for data that
    is not in your new system.


    To begin with the easy part: As I intimated earlier, there''s an unavoidable slug
    of bookkeeping that you''ll need to do if you''re running your own business. This
    paperwork is like a bacterial colony; it grows slowly at first, but if left unrestrained,
    exponential growth will bring it to a really terrifying size in short order. The
    only way you can keep this monster reigned in is to schedule time to work on'
