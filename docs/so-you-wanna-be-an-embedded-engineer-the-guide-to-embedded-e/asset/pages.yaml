    # 4.8 A Final Word on Part Selection


    In this section, I''ll try to give you a little taste of the joys of selecting
    a highend microcontroller for an embedded application. The challenges and choices
    here are often quite different from the process you''ll follow when selecting
    an 8-bit microcontroller. The stakes are also higher, because the design effort
    invested into a 32-bit circuit is likely to be significantly larger than the design
    effort in 8-bit designs.


    The issue that makes 32-bit device selection potentially so difficult is that
    you''re considering these high-end parts, you quite likely have a fairly complex
    application to implement. You''re then faced with the task of deciding from a
    datasheet whether or not a particular part can do whatever you need, and this
    is often very difficult, particularly at the pre-prototype stage, everything is
    up in the air and the requirements themselves are subject to change. Often, what
    you''ll be given is a be-all-end-all wishlist that can''t possibly be achieved
    in a single design while remaining cost-effective. Hence, you''ll generally be
    expected to present a few options to the marketing staff, who will then pick the
    one that they think will sell the best.'
