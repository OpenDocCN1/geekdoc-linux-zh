    The last and most complex sensor we''ll use is an Analog Devices ADXL322 MEMS
    (Micro Electromechanical Systems) accelerometer. MEMS is an exciting technology
    that straddles the border between "really, small machines" and nanotechnology.
    The most common MEMS devices you''ll encounter in robotics are accelerometers
    and gyroscopes; various vendors including Analog Devices, Freescale, and Kionix®
    (among others) offer these sorts of parts. (By the way, the pressure sensor we''re
    using is also a MEMS device.) If you browse the Resources in depth, you''ll see
    a few other interesting MEMS devices on the market, both sensors and actuators.
    I''m particularly intrigued by the possibility of building an electric motor the
    diameter of a human hair, though I can''t think of a use for this device in any
    project I''m working on.


