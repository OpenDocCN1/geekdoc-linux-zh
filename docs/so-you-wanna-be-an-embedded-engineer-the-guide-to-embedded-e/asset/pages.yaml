    wrong lane(s) and may generate additional, unwanted read and write cycles.

    For instance, if you have a 16-bit peripheral on the bus, and you configured

    SMC correctly, a 32-bit read or write will cause the SMC to issue two read or

    write cycles to the lower 14 data bits. Conversely, if you have an 8-bit peripheral

    on the bus, and you accidentally configured the SMC for 32-bit operation on

    thank, reads and writes for addresses that are not an integer multiple of 4

    will be routed to the wrong data bus lines.


    While we''re on the topic of memory, a brief word about the memory man-

    agement unit (MMU). The ARM720T has an 8K on-chip cache memory area.

    Order to use this, you must enable the MMU, since the cache enable bits are

    set on a per-page basis in the MMU page tables. The MMU operates with two

    data structures: a table of "section" entries that describe memory in 1 MB blocks,

    and (optionally) one or more tables of "page" entries that describe memory with

    finer granularity, in either 4 KB or 64 MB blocks. The MMU translation table

    must reside on a 16 KB boundary in memory.


    Each entry in either of these tables is a 32-bit word. You''ll find the address

    translation process, and how to create the page tables, described in detail in
    sec-

    6 of the ARM720T Rev 3 Technical Reference Manual, but in brief: When

    t processor attempts to read or write a given address, the address is divided

    by 1 MB and the result is as an offset into the level 1 (section) descriptor

    table. The 32-bit entry thus fetched describes fully the handling to be

    given to this 1 MB zone, or it references a page level (2 descriptor). Bits in

    the table entry control whether the area is cached and/write-buffered, which

    privilege domain the address belongs to, and where it should be mapped in physical

    memory (with 1 MB granularity in the case of the section table). The simplest

    way to deal with the MMU is to create a set of section entries that map all

    your memory into a contiguous area starting at 0x00000000, with cache and

    buffer enabled where appropriate. (Since the size of the address is directly dependent

    how large your addresses get, cramming everything down to the bottom

    of the section table minimizes the number of entries the table needs to create.)

    Advanced operating systems, particularly those that implement virtual memory,

    will need to implement page tables so they can have finer-grained control over

    memory permissions. With practically all MMUs, the ARM720T contains

    a translation lookaside buffer (TLB) that caches 64 sections'' worth of mappings,

    so they don''t need to be looked up.'
