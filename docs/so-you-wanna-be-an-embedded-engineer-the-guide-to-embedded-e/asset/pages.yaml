    Linux, you can easily build the AVR GNU tools in Windows using the cygwin emulation
    environment, available freely from http://sourceorg/cygwin/. Cygwin runs under
    Windows 95/98/Me/NT/2000 and XP (and presumably Vista, though I haven''t tried
    this). It emulates most of a Linux system and makes it possible to run a large
    amount of UNIX® software (including X11 software) directly within Windows. If
    you wish, you can also use the precompiled WinAVR tools; I generally prefer to
    build my own toolchain, but if you''re looking to get started quickly, WinAVR
    is the speedy route.


    If you''re rolling your own, your first step is to download gcc and binutils from
    ftp.gnu.org, and avr-libc from http://www.nongnu.org/avr-libc/. First, unpack
    build and install binutils (assuming you''re using version 2.16, which is the
    version I am currently using for AVR development):


    ```

    tar zxvf binutils-2.16.tar.gz

    cd binutils-2.16

    ./configure --target=avr --program-prefix="avr"

    make

    make install

    ```


