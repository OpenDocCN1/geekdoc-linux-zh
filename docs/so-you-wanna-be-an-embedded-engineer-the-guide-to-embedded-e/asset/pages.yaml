    The ADXL322 provides you with two analog voltage outputs corresponding to the
    X and Y acceleration vectors. When the device is parallel to the Earth’s surface,
    both analog outputs are mid-scale. As you tilt the device toward the X+ direction,
    the X output gets closer to rail voltage; tilt it back toward the X– direction
