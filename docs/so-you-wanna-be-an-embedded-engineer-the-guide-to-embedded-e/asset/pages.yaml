  md: '# Teaching Yourself, Top-Down

    (Large Embedded Systems)


    # 4.1 Target Audience


    The previous chapter dealt with people who have hardware experience and want to
    start learning about microcontroller programming, or a "bottom-up" approach to
    embedded engineering. At the other end of the spectrum, we find people who have
    considerable experience programming application software in high-level languages,
    and who now want to extend their reach into embedded systems. These people will
    typically have what I would describe as "IT" qualifications (database programming,
    HTML design, Java development and so forth), rather than engineering expertise.
    Computer science majors frequently fall into this category.


    There is an immediate difficulty in adapting these people to embedded environments,
    and this is that pure software projects for mass-market operating systems (Windows,
    Mac OS, and so forth) are typically designed with an acceptance of enormous variations
    in performance margins due to variations in customer hardware. Furthermore, PC
    hardware is sufficiently expandable and inexpensive that it is realistic for an
    application software developer to require that the user provide special hardware
    features such as additional memory, 3D accelerated graphics, and so on. Neither
    of these two assumptions are remotely acceptable in embedded environments.


    The embedded software developer must be able to:


    +   a) characterize and control the resource utilization of the software exactly.
    This includes being able to specify how much RAM and secondary storage space the
    software will require under all conceivable execution conditions, with explicit
    safeguards in place to prevent the software from overrunning'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Chapter 4


    those limits under unusual input circumstances. In most cases, it is also necessary
    to provide some guarantee of real-time performance (though the limits here are
    often loose enough that people don''t need to take explicit notice of them).


    +   b) develop the software in such a way that it utilizes available system resources
    efficiently, and


    +   c) design the software to perform deterministically under specified input
    conditions.


    None of these skills are apparently in great demand in modern consumer software
    development¹ hence, they are not well taught in computer science degree programs.
    Also observe that the scope of the word “software” in this context includes the
    operating system running on the target device; by contrast it''s not normal for
    application developers on PCs to have to guarantee the behavior of the underlying
    system.


    Ten or twelve years ago (as I complained in the introduction to this book), this
    gulf between embedded development and mass-market software development was considerably
    smaller; programmers who cut their teeth writing games and other software for
    the Commodore Amiga (or even so) its 8-bit architects such as the Sinclair ZX
    Spectrum and Commodore 64 were well-prepared for life developing real-time embedded
    software.


    This chapter will introduce you to several of the options for developing high-end,
    32-bit (or even 64-bit) embedded systems. Pay attention to the “high-end” qualifier
    there. Some 32-bit microcontrollers (ARM and SuperH, for example) are available
    in exceedingly cut-down variants, usually with no external memory buses, intended
    for low-cost single-chip systems. Other 32-bit cores, many of them proprietary,
    are built into ASSPs as those used in DVD players. Both these categories of parts
    and applications more properly fall into the province of Chapter 3. In this chapter
    I''m very specifically focusing on complex embedded systems where the application
    layer is considerably abstracted from the hardware.


    > Engineers generally have a very special view of the deplorable state of consumer
    software development. This is one reason you''ll find a disproportionately high
    number of engineers running open-source operating systems. They get bugs, just
    like commercial software, but at least there''s the opportunity for a user to
    fix the bugs (even though most engineers would never have enough free time to
    start tinkering with that code).'
