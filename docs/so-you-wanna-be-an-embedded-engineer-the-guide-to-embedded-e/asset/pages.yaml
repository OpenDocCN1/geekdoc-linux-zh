    The basic Linux kernel can be downloaded from <http://www.kernel.org/>.

    Some architecture-specific ports also exist, such as uLinux (a special version
    of the OS for microcontrollers that lack a memory-management unit), arm-linux
    (Linux with patches for various ARM-based platforms), and in order to build any
    of these kernel source distributions into an actual Linux system, you need a considerable
    amount of support magic, ranging from a bootloader to get the kernel into RAM
    off secondary storage, to an init program that will manage system startup and
    shutdown. Also, of course, you need your own application, which is just another
    program as far as Linux is concerned (even though it may consume100% of your system''s
    resources!).


    The fantastic thing about Linux is the vast array of hardware support in the kernel
    and various add-on packages such as Free86 (the GUI windowing system). This is
    a great boon to the embedded developer, because you can immediately get up and
    running with all sorts of heterogeneous hardware without the tedium of writing
    your own drivers.


    Linux is licensed under the GNU General Public License (GPL), which fact is the
    case of much uneasy angst—mostly due to falsehoods and half-truths disseminated
    by vendors of proprietary software. Simply put, the GPL requires that if you modify
    a GPL piece of software and distribute it to anyone, your code is covered by the
    GPL and you must supply the sourcecode to your modifications on request. However,
    there is an exception, which is that if your program only accesses GPL code through
    documented interfaces, it does not need to be GPL itself. What this means, as
    a practical matter, that you will need to disclose sourcecode if you modify the
    kernel or any of the other GPL programs that form part of the typical Linux install,
    but if you simply write a Linux application, you won''t be pulled into that requirement.
    Speaking of GNU, by the way, note that the only “safe” tool to building Linux
    is the gcc toolchain.


    Linux has been embraced by both vendors and customers in the embedded arena; there
    are literally hundreds of ports, and almost any 32-bit embedded platform you look
    at these days will probably come with Linux as a build option. A happy side-effect
    of this is that “porting” Linux to a new platform is often no work at all—if the
    microcontroller is supported at all, chances are that you’ll have to do is set
    the right kernel options, possibly include some additional drivers for hardware
    that you’ve put on your board, and build it.'
