    +   * _INT0, _INT1 – External interrupt request lines.

    * _T0, T1 – External clock signal inputs for timers 0 and 1.

    * _RD, _WR – Read and write strobes, respectively, for off-chip RAM.

    * _PSEN (Program Store EEnable) – Read strobe for off-chip program memory.

    * _ALE/PROG – Address Enable pin, used by multiplexed address bus when accessing
    external memory. Also used when EPROM parts are being programmed in a specialized
    burner.

    * _RESET – Resets the microcontroller (note that it is active high, which is slightly
    unusual).

    * _EA/Vpp – If this is strapped low, the micro will boot off external-program
    memory instead of on-chip memory. This is a supremely useful feature if you''ve
    come across a boxload of used OTP or ROM 8051s; just tie this low and use the
    part in ROMLess mode. I''ve come across commercial appliances—particularly cheap
    mods, and certain aftermarket automotive accessories—used all sorts of recycled
    scrap/surplus 8051 parts in this way. If you intend to let the device run off
    internal memory, you should strap this pin high. Note that some 8051 variants
    may disable this function partially or entirely if codeout protection is enabled.

    * _XTAL1, XTAL2 – Crystal oscillator amplifier input and output.


    In addition to the features previously described, the 8051 has a multiplexed address/bus
    allowing the device to access to 64K of external static RAM (SRAM) and 64K of
    external program memory. These two memory types live in different address spaces,
    since the 8051 is a Harvard-architecture device.6


