  md: '# Teaching Yourself, Bottom-Up (Small Embedded Systems)


    # 3.1 Target Audience


    One of the most frequently asked “newbie” questions asked in embedded engineering
    forums is (paraphrased), “Which microcontroller should I learn about in order
    to have directly marketable embedded skills?” This question is fairly commonly
    posed by technicians and engineers with circuit design experience, who are looking
    to extend their skill set upward into firmware. This chapter will provide such
    with some idea why the newbie question can''t be answered in any simple way, and
    some useful recommendations as to which platforms you might choose for experimentation
    and learning purposes.


    This is an appropriate moment to make a very important point to those people who
    work primarily in hardware design: Not only is it practically mandatory for a
    latter-day hardware engineer to understand, at least, the software layer above
    them, but having a good understanding of what can be achieved in firmware will
    make your circuit designs more efficient. There are problems that are much easier
    to solve in firmware than in hardware, and a good engineer—software or hardware—will
    keep this in mind so that the overall design can be tuned with respect to the
    features that will be implemented in software versus those that deal in hardware.


    To try a trivial example—most microcontrollers that implement a hardware UART
    expect to be connected to an off-the-shelf RS-232-compatible line driver/receiver
    chip (the MAX232 is a common candidate, and it''s available from several sources).
    If you''re connecting a microcontroller to something else on-board via the UART,
    and you don''t intend to shift the signal to RS-232 levels,'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# 38 Chapter 3


    will be simpler and much more cycle-efficient if you design the other end of the
    communications link to accept inverted input.


    In any case, the short answer to the “Which micro should I learn for fortune and
    glory?” question is learning how to work with any one particular microcontroller
    won''t lead you directly to a job! When you come to a new job, you''re going to
    find a body of legacy technology implemented on some micro or other (probably
    some hoary old device you would never choose in your wildest nightmare—and when
    you start working on your completely new designs, you may choose a different family
    yet again. All sorts of factors will affect your choice of micro; future availability,
    pricing, contract terms with distributors, power supply limitations, performance
    requirements ... and so the list goes on.


    You might occasionally see people asking if there is any reason to learn to develop
    on 8-bit cores, the 32-bit cores getting cheaper every day. These people don''t
    take account of the fact that for high-volume consumer applications like VCRs
    and CD players (which don''t benefit at all from a high-end microcontroller),
    a few pennies in cost translate to massive savings. These applications will not
    migrate from 8-bit to 32-bit cores until there is no cost difference at all.


    Note that this is not quite the same thing saying “never,” and it''s worth explaining
    some of the issues so that you can understand the factors at work here. As die
    sizes shrink, the packaging and bonding costs (bonding wires from the silicon
    to pins that go out to the real world) start to dominate the cost of the device.
    Raw 8-bit dice will always be cheaper than raw 32-bit dice due to their lower
    transistor count, but by the time the chips are packed for sale, the price difference
    may be almost invisible. For some applications, it is already foreseeable


    +   Sometimes, a particular job will “require” experience with a specific microcontroller.
    Job descriptions constrained in this indicate a lack of understanding of the part
