- img_proc: true
  md: '# 128 Chapter 4


    around an x86-compatible core, and thus significant external circuitry is always
    required in an x86 systems. It should also be noted that, unlike the vast majority
    of embedded devices, x86 chips lack on-chip JTAG or other hardware debugging interface
    support. This makes debugging critical low-level functionality

    relatively difficult.


    x86 shines, for the embedded developer, in a few situations:


    +   1. You need to hit an extremely aggressive price-performance point for a very
    complex high-performance hardware design in low production volumes. Because most
    of the parts in an embedded x86 system are off-the-shelf consumer PC parts, the
    unit pricing is lower than it would be for parts specifically designed for niche
    markets. Your 100-piece order of single-board computers enjoys lower overall component
    pricing by riding the massive volumes purchased by Dell, Gateway, and so forth.


    +   2. You''re building your product around a bunch of functionality that is available
    to run in an off-the-shelf operating system like Windows XP, and your end product
    does need to have extremely tight real-time characteristics.


    +   3. You need to have a very quick design cycle—you want to develop a mockup
    of your code on a regular PC, then transfer it across the target system with the
    minimal possible amount of porting and debugging time. This positive factor is
    enhanced considerably if you have access to a stable of competent application-level
    programmers.


    Embedded x86 systems take a variety of forms. The most easily recognizable method
    of embedding an x86 processor is simply to take an off-the-shelf PC and put it
    inside a cabinet containing whatever it is want to control. The self-service photo
    scanning and printing stations often found in pharmacies and department stores
    are built this, and they are perfectly legitimate embedded systems. One of the
    principal advantages of this approach is that you can keep your application—from
    the software perspective and the mechanical assembly perspective—more or less
    entirely isolated from the specific piece of


    > There are exceptions to this rule. The i386EX and some 80186 variants, for instance,
    are not terribly difficult to design around. For the purpose of this chapter,
    however, I''m discussing stricter-x86 systems. At the performance level occupied
    by those low-end processors, there are much better non-x86 alternatives.'
