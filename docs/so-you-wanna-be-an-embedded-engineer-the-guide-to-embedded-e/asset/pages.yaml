    # 3.2 Intel® (Et al.) 8051 Variants


    Intel’s 8051 architecture is an industry-standard platform referenced in almost
    every engineering course since the beginning of the microprocessor era. When spoken
    of in polite company (and even in books like this), you’ll generally see the number
    8051 prefixed with the adjective “venerable” or a synonym. Personally, I would
    much rather describe it as “decrepuit”, it is a solid fact that the 8051 is the
    world’s bestselling 8-bit microprocessor core. Barring some major uprising, this
    is likely to remain true for as long as the world is still manufacturing and using
    8-bit micros.


    I’m including a discussion of the 8051 in this book for two main reasons and one
    minor reason:


    +   1. It pops up in all sorts of apparently unrelated applications—many application-specific
    standard products (ASSPs), for instance, have an 8051 core. The chance you’ll
    run across an 8051 variant in your career is thus very good indeed. Being familiar
    with the core’s capabilities, if nothing else, will help you decide how to put
    together your design.


    +   2. If you can work efficiently with the 8051, you can work with anything,
    so’s not a terrible architecture to learn on.


    +   3. (Minor reason)—The 8051 happens to be very efficient at tasks that involve
    bit-level data manipulation. Clock for clock, it is faster than many 32-bit microcontrollers.
    You may find this fact useful, since the 8051 is also very cheap.


    For educational purposes, the principal advantage of the 8051 family is its ubiquity.
    From the point of view of real, commercial projects, the principal stated advantage
    of the 8051 is its availability from multiple sources. It is widely claimed that
    this makes the 8051 a truly multisourced part, and that you have'
