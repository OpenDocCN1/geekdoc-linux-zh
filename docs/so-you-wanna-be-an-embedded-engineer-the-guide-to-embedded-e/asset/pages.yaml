    # 6.3 Responsibilities and Stresses in a Small Company


    During my career to date, I''ve been involved full time with two very different
    small companies that went out of business. One, a software company, was driven
    out of business essentially because technology advances made its primary products
    irrelevant. They did not develop a strategy for dealing with new competing or
    complementary features built into consumer operating systems until it was too
    late (and, to make things worse, the specific product they were offering a feature
    that is best implemented by the operating system vendor anyway). The other, a
    hardware company, fell victim to a series of unwise marketing decisions and unfavorable
    price fluctuations, over-extended themselves and died as a result. Both of these
    positions were, at times, extremely stressful, but perhaps not for the reasons
    you might think.


    It can be terribly lonely working at a small company. By this I dont mean that
    your coworkers shun you, but that you may be the only one who is in a position
    to make engineering decisions about a project. In personal projects, you can show
    the design to your professors or friends, or publish them on the Internet, and
    solicit comments about the design. In a large company, your work is subject to
    design reviews from people who (least theoretically) will look over and spot the
    stupid mistakes before you commit to copper or ship code to the unsuspecting public.
    In a small company, you may not have any safety net of this type at all, beyond
    perhaps discussing'
