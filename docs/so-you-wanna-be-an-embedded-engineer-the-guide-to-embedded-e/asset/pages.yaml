  md: '# # Introduction


    # ## 1.1 About This Book


    Both online and in real life, nearly every day I see people asking what they need
    to do in order to become embedded engineers. Some are new graduates; some are
    still college students; a few are teenagers in high school; and a large minority
    are hobbyists, hardware technicians, or application-level programmers looking
    to improve their salary prospects and/or diversify their skills in order to avoid
    the 21st century plague of white-collar commoditization.


    Why do so many people want to become embedded gurus? The obvious explanation is
    that young (and not-so-young) programmers and technicians are being lured by the
    glamorous, high-profile work, easy commands, relaxed lifestyle and limitless wealth,
    delivered by adoring crowds, that only embedded engineers can provide. Since none
    of that last sentence is remotely true, however (I''ve been working in the field
    full time for somewhat than ten years, and I don''t clearly recall the last time
    I was pelted with cash by an adoring crowd), I can only assume that there is some
    major marketing campaign in progress and it is driving people to the embedded
    field.


    This, of course, leads to an intractable dilemma. Should existing embedded engineers
    steer these young hopefuls toward other fields, keeping the pool of fresh embedded
    talent small, and consulting rates correspondingly lucrative? Or, should we beckon
    these poor innocents in the door to work the bottom level, thereby pushing all
    of us embedded guides one step up the pyramid?


    Humor aside, it is a generally accepted fact that the number of new graduate engineers
    of all types is shrinking (at least in the United States). Various theories are
    posited to explain this phenomenon. In the specific case of embedded'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Chapter 1


    engineering, I see several factors causing the decline. One such factor is the
    unavailability in this day and age of well-documented home computers of the style
    my generation enjoyed—Acorn BBC, Commodore VIC-20, Sinclair ZX Spectrum, and so
    on. Modern computers are black boxes designed to run shrink-wrapped software.
    They are shipped without programming tools¹ and with no technical documentation
    whatsoever. These times we live are dark indeed. Operating system vendors are
    actively working to confine third-party software development to an exclusive club
    of paid-up licensees (in the same way that video game console development is controlled),
    and lower-level programming at the direct hardware-access layer is at best very
    difficult due to the unavailability of chipset documentation—in many cases, due
    to the manufacturers'' contractual obligations to preserve trade secret information
    related to intellectual protection mechanisms. In addition to this, we are faced
    with the mere complexity and heterogeneity of PC hardware. Back in the old days,
    we could develop a homebrew program on our Commodore 64, fine-tune it to the last
    instruction cycle, and show it to other people with pride. This type of skill
    is a vital component of embedded engineering, and it is more or less impossible
    to practice on mainstream home computers of the current era.


    There are other factors that raise the bar or discourage people from becoming
    an embedded engineer, too—and I''ll deal with them in the appropriate sections
    of this book—but the point I''m making here is that it''s simply more difficult
    days for kids to experiment with what they have at home; their opportunities to
    do so are at, constrained.


    The good news is that a decline in the supply of engineering talent leads— inevitably—to
    an increased price to meet demands. Despite the specters of outsourcing and high-tech
    worker visas (more on these topics in Chapter 7, if you''re the code-skipping
    type), right now it''s a great time to be looking for work in this field. There
    are course cycles and cataclysms in everything—there was an enormous crash in
    telecommunications engineering jobs not so long ago, for example—over time, the
    trend for total employed hours and investment dollars going into high-tech engineering
    projects is headed relentlessly upward.


    ¹Apple''s Mac OS is the only retail exception to this rule. While some PC vendors
    do offer Linux as a preload option, the people who would choose this are, in the
    main, people who would installed it themselves anyway.'
  merge: -1
