  md: '# Chapter 3


    There are quite a few different hardware options for working with the AVR. Atmel''s
    very lowest-end development board (really, more of a demonstration than a development
    board) is the AVR Butterfly, which sells for about $20 but is frequently given
    away as freebie at Atmel seminars and "lunch and learn" events. The Butterfly
    consists of an Atm169 microcontroller with a small alphanumeric segmented LCD,
    lithium ion cell, a 4-mini joystick of the type found on cellphones, 4 MB of off-chip
    Flash memory, a temperature sensor (thermistor), a light sensor (CdS cell) and
    a piezo speaker element. The board has a lap clip so you can attach it to your
    clothing and use it as a name-tag badge. It is shipped preloaded with some demo
    software, including a bootloader—so it can be reprogrammed over a regular serial
    port; you don''t need to own Atmel-specific programming hardware. However, the
    board has a JTAG connector and you can use it as a low-cost evaluation platform
    for the ATmega169.


    The next step from the Butterfly is the STK500 development board, again direct
    from Atmel, which retails for about $79. This is the recommended entry-level evaluation
    board for the AVR series, and it''s the board I''d recommend you acquire if you''re
    just starting out with these parts. The STK500 connects to your PC over a standard
    interface. It has sockets for most of DIP-package AVR variants, and you can run
    some simple applications directly on the board. Note that plug-in adapters are
    also available so that you can use the STK500 to work with some of the larger
    AVR parts that don''t come in DIP packaging.


    The STK500 has eight LEDs and eight pushbuttons, as well as headers to allow you
    to connect to all of the I/O lines of the micro. You can simply put your circuit
    in the appropriate socket and connect the rest of your circuit to the headers.
    Using a (supplied) 6-pin cable, you can also use the STK500 to perform in-system
    programming of AVR devices on your custom boards. The STK500 supports serial (SPI)
    programming as well as parallel programming; the advantage is that if you accidentally
    switch off the SPI programming mode in the fuses of your target device, you can
    use the STK500 to recover and reprogram the chip, as long as you remove the device
    from your circuit.


    > 12 The STK500 board plays well most with the USB-to-serial adapters I have tried
    under Windows, Linux and Mac OS X. This is an important point in these dark days
    of legacy-free PCs. Most of the homebrew serial-connected device programmers dont
    work properly over USB converters.'
