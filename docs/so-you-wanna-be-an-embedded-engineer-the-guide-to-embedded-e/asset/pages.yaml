  md: 'An extremely common 8051 reference circuit configuration, particularly for
    hobbyist experimentation boards, is to have a socket for a 28-pin Flash or EPROM
    (usually a 27256 32 KB or 27512 64 KB device), a jumper to enable booting off
    external memory device, and a device 62256 or equivalent 32 KB static RAM. Another
    fairly common configuration is similar, but has a single 32 KB Flash configured
    so that it can be written via the "SRAM side" and read via the "code side" of
    the external memory interface. By this means, you can have a small bootloader
    inside the 8051, and a user program inside the Flash memory. The user program
    can easily be updated using a serial link or other convenient mechanism.


    Of course, you are not limited to connecting just memory devices in this way;
    you can connect external buffers and latches to expand your I/O capability, you
    can add a peripheral expansion IC such as the 82C55. Common practice in such cases
    is to use external logic; for example, a 74HC138 one-of-eight decoder, to decode
    a few bits of the demultiplexed bus and generate the required chip selects.


    The program map of 8051 is relatively simple. There is a single 64 KB program
    address space from 0000h to 0FFFFh. Depending on the state of the _EA pin, this
    is either a single 64 KB space, or a 4 KB internal space and a 60 KB external
    space (in this case, the lowest 4 KB of the external memory device is not used).
    Note that code protection features can cause odd results if you''re using external
    code memory. For instance, some 8051 variants, when code protection is enabled,
    disable the MOVC instruction while the program counter is pointing into external
    RAM. The rationale is to prevent an attacker from writing a program that reads
    the low code memory area and outputs to a port—assuming your design already uses
    some external code memory, the attacker could simply pull out the device containing
    the unprotected portion of your program, insert their attack code, and grab the
    read-out version of your secret code.


    Data memory is more complicated. The internal data memory space stretches from
    000h to 0FFh. At the bottom of this area, from 0000h-01FH, reside four banks of
    eight scratch registers. These registers are named R0 through R7; according to
    the currently selected bank, R0 refers to location 000h, 008h, 010h or 018h, and
    so on.'
