    There''s a big difference between hand-building a single prototype and designing
    the same type of product to be manufactured by automated machinery; or by semiskilled
    labor.


    +   - You want to work shorter hours.


    +   - You hate paperwork.


    As with any other major life decision, becoming a full-time consultant is a complex
    choice. On the plus side, you will have as much control over your professional
    destiny as is possible to have. You''ll be able to set your policies, enforce
    your own design style, and select precisely projects you want to pick up and which
    you want to leave on the curb. You will also have unlimited access to the (after-tax)
    profits of your labors; there will be no management layers or investors getting
    a slice of the pie. Being a consultant can feed some very interesting'
