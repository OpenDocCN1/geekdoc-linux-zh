  md: 'This attitude is about as far from reality as you could possibly get. If I
    could brand just one succinct maxim onto your brain in this section, I''d like
    it to be this: “Friends don''t let friends do vague projects.” Contracts do not
    create acimony and ill-feeling—they prevent it! Frankly, if you think your customer
    is going to cheat you in the contract, or if you''re looking for ways to cheat
    them in writing, you shouldn''t be doing this job anyway. Furthermore, if you
    can''t come to a written agreement with somebody, this is a a priori evidence
    that you will not be able to reach—and adhere to—a verbal agreement either. You
    might shake hands and agree over coffee at the start of the project, but it is
    absolutely certain that you will be arguing until the end of the project.


    The first fundamental reason why you need to have a contract in place is to avoid
    causing disputes to either party. If you have a contract that says “Party A shall
    pay next-day air shipping to send the first working prototype to Mount Everest,”
    Party A knows this in advance and plan for it. If a detail like this isn''t specified
    up front, Party A may expect the finished widget to arrive on-site in a week,
    with no extra money payable—and Party B may be expecting to send it by four-week
    slow boat at Party''s expense.


    The second fundamental reason why you absolutely must have a contract is because
    the contract—probably by way of an engineering specification—defines when the
    project is finished, both in terms of time and deliverables. This has all sorts
    of important ramifications


    +   - Your client knows exactly what they are going to receive for their money.
    This is especially important if you''ve quoted on a whole-project basis (though
    I don''t recommend this; see Section 5.5).


    +   - You and your client both understand what stages trigger responsibilities
    on either end.


    +   - You have a clear idea—assuming you can meet your due dates, of course!—as
    to when you will be free to take the next job from someone else.


    Speaking of contracts, you''ll be asked from time to time to sign nondisclosure
    agreements (NDAs). Not infrequently, the person asking you to sign the NDA'
