    The principal interesting characteristics of the ARM core:


    +   - small size on the chip die,

    - low power requirements (in MIPS/MW terms) and,

    - available (as prepackaged intellectual property) as both a hard core and synthesizable
    soft IP. Hence, if you are willing to pay the appropriate licenses, you can even
    synthesize an ARM into your own FPGA.


    Observe, by the way, that ARM (per se) does not manufacture chips—they simply
    develop the intellectual property relating to the core. It is a frequent neophyte
    question to ask “Is ARM available from other vendors?” The answer to this question
    is that there is no such as “an ARM”—are merely chips that contain an ARM core,
    and such chips are indeed available from numerous vendors. There are no drop-in-replacement,
    generic multisourced ARM parts in the same sense that there are generic 8051 parts.
    In fact, as a general rule, many of the ARM parts we see as general-purpose devices
    were at one time application-specific products custom-designed for one customer
    or one particular market space. After such parts have been in production for some
    time, the chip vendor starts to look for other customers, and if the demand seems
    to be present, the device will be offered to the public.


    The earliest ARM-cored parts (from companies such as VLSI) were microprocessors,
    rather than microcontrollers. They did not have on-chip RAM (except perhaps for
    caches) or ROM; it was not possible to build a single-chip system using these
    devices. It was not until 2003 or thereafter that we began to commercially fielded,
    generally available single-chip ARM products. Possibly the first such product
    family to the general retail market was the LPC2xx series from Philips. As of
    2006, there are several other vendors single-chip products; Atmel and ST would
