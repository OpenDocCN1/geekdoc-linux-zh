  md: '# 24 Chapter 2


    Scanning the output of a million monkeys for software that meets the design specification
    is a much harder task, because you don''t know exactly what you''re looking for.


    The 999,999th Monkey Theory goes like this: Given a desired output and a functioning
    monkey engine, there will be a finite set of "correct" answers (i.e., answers
    that satisfy all the constraints for "perfect" output—To be or not to be, that
    is the question.). There will also be an infinite set of answers that are useless
    gibberish ("Tabah892aq[9b80c324l]"). However, for any correct answer, there is
    an infinite number of possible variants of answer, all of which are SLIGHTLY incorrect
    or SUPERCIALLY appear to be correct ("To be or not to be, that is the question.").
    Since the infinite number is infinitely larger than any finite number, there is
    a negligible probability that any answer appears to be correct actually will be.
    Unfortunately, this also means the discriminator logic on our monkey-driven code
    engine can, at best, decide "gibberish" versus "possible solution"—it cant pick
    the correct solutions out of the set of possibles, and the odds against it hitting
    onto a perfect answer.


    Therefore, we conclude that any functional software generated using the monkey
    approach is practically certain not to be working, and we can say this with confidence
    if we have no idea how it''s supposed to work or what it actually does.


