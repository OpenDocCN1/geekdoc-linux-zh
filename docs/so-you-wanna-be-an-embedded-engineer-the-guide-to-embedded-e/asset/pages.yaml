  md: '# Chapter 3


    As with other micros, the pinout is again dominated by GPIOs; ports A through
    D 8-bit general-purpose ports, each pin of which can be individually programmed
    as inputs or outputs. The following are the other pin functions (including those
    multiplexed onto GPIO ports).


    +   * XTAL1, XTAL2 – Crystal or ceramic resonator connections. The AVR use an
    internal RC oscillator clock source, an external RC, or an external resonator.

    * AVCC, AREF – Reference voltage for the on-chip ADC.

    * ADC0 – Analog-to-digital channels. Each line can be individually assigned to
    the ADC module.

    * XCK – External clock input for the USART module. This is used if you are implementing
    a synchronous serial protocol with the clock sourced from some external device.

    * T0 – Timer/Counter 0 external input.

    * T1 – Timer/Counter 1 external input.

    * AIN0 – Positive input for on-chip analog comparator.

    * INT0, INT1, INT2 – External interrupt 0, 1 and 2 inputs.

    * AIN1 – Negative input for on-chip analog comparator.

    * OC0, OC2 – Timer/Counter 0 and output compare match (used for PWM applications).

    * SS – SPI Select input (when operating as a SPI slave device).

    * MOSI, MISO – SPI bus master out/slave in master in/slave pins.

    * SCK – SPI data clock.

    * SCL, SDA – Two-wire bus (I2 by another name) clock and data lines.

    * TCK, TMS, TDO, TDI – JTAG debugging interface pins.

    * TOSC1, TOSC2 – Timer Oscillator crystal resonator lines. Timer/2 can be operated
    in an asynchronous clicking mode where the clock source is provided by an external
    resonator connected to these pins.'
