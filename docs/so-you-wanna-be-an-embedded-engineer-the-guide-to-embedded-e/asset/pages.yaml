  md: '# Teaching Yourself, Bottom-Up 95


    Enough digression; back to the task at hand. First, let''s get acquainted with
    a few of the design requirements for the board: Many of the actuators (solenoid
    valves, motors, and so on) needed in this project are most readily available in
    24V flavors, so the board should be designed to operate off a 24 battery supply.
    This raises the first interesting question of how to regulate the bus voltage
    down to a micro-friendly 5V.


    A lazy sort, I''d usually take the easy way out and dump a simple regulator into
    the application like this, but dropping 24V down to 5V is just too big a step,
    as it would mean throwing away about 5W in that regulator for a relatively modest
    250mA load. Use of a switcher is therefore mandatory, and if you refer to the
    schematic you''ll see that I''ve used the dirt-cheap MC3063A in a direct crib
    of its step-down application note. There is nothing at all special about this
    circuit, and if you''re trying to throw a quick hack with the code I''m talking
    about here, feel free to use a 7805, or just power your board off a lab power
    supply. Substantial heatsinking and a TO-3 package on the regulator is necessary
    if you use a 7805 with a 24V input voltage.


    Fulfilling Step 3 in the goals previously mentioned requires choosing a sensible
    hardware interface, and overlying software protocol, between the VCM and SCM.
    There are many ways to achieve this, but the method I''ve chosen is an asynchronous
    serial interface with RS-232-compatible levels. Please note that this probably
    wouldn''t be the ideal choice for a real integrated application that you were
    building from scratch. If you were using a bare MPC8241 part, for instance, the
    right thing would be simply to put some 3.3V-5V shifting in place and connect
    directly to one of the MPC8241''s serial ports. Unfortunately, we''re fighting
    the design a bit here; one port is reserved for debug output, and the other is
    connected to the supervisor/watchdog chip.


    The great thing about async serial connections, however, is that they can be plugged
    into almost any hardware platform on the planet. In the case of the Kuro Box,
    you can either go through the debugging serial port, or you can put a standard
    level-shifter on the micro and attach it to the Kuro Box through USB-to-serial
    converter.


    This discussion follows the latter route, partly because the debug port is constantly
    in the kernel, but mostly this way you can use the same VCM hardware to talk to
    a Microsoft® Windows® machine running Cygwin,'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# 96 Chapter 3


    or a regular PC running Linux, or indeed almost anything else with a standard
    serial port.


    I''m using a Keyspan USA-19W USB-to-serial adapter in this project, because I
    happen to have it lying around; there are numerous other such adapters supported
    by Linux and the standard kernel has modules for the Keyspan adapters, among others
    (Belkin as well as FTDI USB-serial solutions). The only thing you might need to
    do is to create the necessary /dev/ttyUSB* device nodes.


    By the way, the debug serial port, J1, is an essential route into the Kuro Box,
    since it is the default console for kernel messages and bootloader communications,
    and it is the easiest device to use for kernel bring-up and debug. For inscrutable
    reasons, Buffalo neither documents nor fully implements this port. The pinout
    of J1 is as follows (the pads are drilled for a standard 100 mil SIL header, which
    is a rather relief as most of the other connectors in the appliance are on 2 min
    pitch);


    | Pin | Function |

    | 1 | TxD (data out of the Kuro Box) |

    | 2 | RxD (data into the Kuro Box) |

    | 3 | 3.3V power of the Kuro Box |

    | 4 | Ground |


    As is fairly standard with debug ports on embedded boards, the serial port is
    NOT at RS-232C levels; it is driven by the CPU''s I/O ring voltage (3.3V) and
    it is inverted relative to RS-232C. This means you need a charge-pump type inverting
    serial IC in order to interface to a normal PC. In turn, this usually means breadboarding
    something quite dirty.


    However, there is an easier route, which also gives you a one-stop solution to
    the problem of having a legacy-free PC. Most USB-to-serial converters consist
    of a microcontroller that does the USB interface, and a separate, off-the-shelf
    transceiver chip doing does the level translation. As a rule the I/O voltage in
    these devices is 3.3V, which is conveniently compatible with the MPC8241''s I/O
    ring.'
  merge: -1
