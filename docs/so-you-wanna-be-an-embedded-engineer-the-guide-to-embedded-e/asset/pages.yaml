    # 4.3 ARM


    ARM is a fantastically popular embedded core with a most interesting pedigree.
    ARM is so popular, in fact, if you learn this 32-bit core and no others, you''ll
    likely be employable for a long time to come. The name is an acronym that originally
    stood for "Acorn RISC Machine" but is now generally accepted to mean "Advanced
    RISC Machine."


    I won''t delve into the history of the ARM core too deeply


    In 1983, Acorn began developing their own proprietary RISC microprocessor as an
    upward migration path away from the 6502, and in 1987 released the Acorn Archimedes,
    a powerful personal computer (designed to replace the BBC Micro), based around
    this new architecture. The Archimedes and its descendants never saw enormous commercial
    success, and the RISCPC that followed the Archimedes went out of production last
    century⁷ ARM microprocessor was adopted by Apple⁸ as the core of its Newton PDA
    product.


    Then and now, the ARM core generates sales that is nothing short of staggering.
    Today, ARM cores are realized in silicon by dozens of vendors; they are found
    inside ASSPs in all sorts of products from PDAs to handheld games to mobile phones
    to rack-mounted networking gear. Intel ever practically abandoned its home-grown
    1960 RISC product line (the principal applications for which included laser printers
    and chips controllers) in


    > ⁷ referred to as the "BBC Micro". However, the BBC acronym is known by the Brown
    Boveri Corporation, which was the cause of some legal action. The formal name
    of the computer is therefore the British Broadcasting Corporation Microcomputer.


    > ⁸ There is now, an ARM-RISC PC still on sale from Castle Technology under the
    Ionix brand <http://www.ionix.com/). This machine is, however, quite thrillingly
    expensive—in comparison to the evaluation boards for the high-end XScale parts.'
