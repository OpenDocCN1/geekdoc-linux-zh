  md: '# Working for Yourself as an Embedded Engineer 199


    wants you to so before divulging anything at all about the item it covers. My
    blanket advice to you is not even to read the NDA, much less unless you are already
    interested in the project. Some people—on both sides of the client/contractor
    fence—treat NDAs as a kind of initial courtship ritual in the process of establishing
    a business relationship, with no real meaning and no risk on other side.


    Make no mistake, though: executing an NDA for a project about which you know absolutely
    nothing is potentially very dangerous. This is doubly true if you are already
    bound by NDAs to other clients, or (even worse!) to your job. and then the customer
    tells you about the project—which just happens to be in direct competition with
    your day job. Even if your day job allows much, it would be exceedingly unethical
    to work on both projects.


    In a similar vein, consider what might happen if you sign an NDA for (and receive
    disclosures concerning) a project that turns out to be in competition with, or
    just related to, contract you''re doing for someone else under a separate NDA.
    Even if you never work on this second project, you''re still in trouble. When
    the first project is completed, the person who wanted to hire you for the second
    project can sue you and the company that hired you for pilfering trade secrets.
    In short, signing NDAs willy nanny is digging yourself into a legal hole, getting
    out of which can be very expensive.


    Of course, simply having a client ask you for paperwork of this sort is no reason
    to be discourous, and it''s not necessarily a stop-stopper to working on the project,
    either. If I''m asked to sign an NDA up-front, my standard response is that my
    policy is not to sign NDAs for any project except as part of the quotation process
    (since this process is the first formal transaction in an engineering relationship
    that involves exchanging of detailed specifications). I then encourage the other
    party to provide further information on the project so I can decide if I''m competent
    to carry it out and interested in doing it. If you follow this method, be sure
    to stipulate that the other person should not disclose any proprietary information
    to you. The test I ask people to apply is: don''t tell me anything you wouldn''t
    tell a stranger in a bar.'
