    # 7.4 Procedures and You: Keeping Your Head Above Water


    At least in America, few (if any) large corporations are the monolithic entities
    they pretend to be. Although they may be unified under a single brand name, with
    a single corporate philosophy on paper, in practice, most large corporations are
    like Chinese dragons at the lunar year. In other words, they''re a bunch of potentially
    self-sufficient individual units draped in something opaque to make them look
    like a single organism. These units don''t necessarily share a'
