- img_proc: true
  md: 'One hardware architecture that I have used with some success, and which I have
    also seen in a few other commercial products, is to use a very small, cheap (generally
    narrow-bus) OTP EPROM as the primary boot device. This chip is factory-programmed
    with just enough bootstrap code to load the main firmware image off a secondary
    storage device and check its integrity. It is very useful if you can also include
    a little additional intelligence so that the secondary storage device can be reloaded
    from some external source—removable media, a serial port, Ethernet, USB or something
    else—if the main firmware becomes corrupted.


    An attractive choice of storage device for the main is NAND Flash, which is cheaper
    than the linear NOR Flash used for boot purposes. NAND Flash is produced in vast
    quantities for removable storage devices: CompactFlash cards, USB “pen disks,”
    Secure Digital (SD) cards, MP3 players, and although it is possible, with a minimal
    amount of external logic, to graft NAND Flash onto a normal Flash/ROM/RAM controller,
    there are a couple of reasons why you can’t boot directly out of the NAND Flash.
    The first is that NAND is not guaranteed error-free; it’s the host’s responsibility
    to maintain ECC and bad sector mapping information. The second reason is that
    NAND Flash is addressed serially; you send the chip a block number, read the block
    out into RAM. Hence, you need a little boot firmware on a normal random-access
    PROM to do the physical-level management of the NAND.


    Note that some microcontrollers provide hardware NAND controllers that obviate
    the need for the little boot PROM I discussed previously. The disadvantage of
    relying on that sort of hardware is that you lose the failsafe system-recovery
    features that can easily be implemented in the boot PROM. However, you’re working
    against space or cost constraints, and your micro has the NAND control hardware,
    you may avail yourself of it. SoCs sold for cellphone applications use this sort
    of technology.


    Hopefully you’ve found this to be illustrative of some of the initial things you’ll
    need to consider when embedding Linux. The one great point in favor of this operating
    system is the excellent community support; you’re an individual trying to bring
    the OS up on a new platform (and do some learning in the process) or simply writing
    some application software, there is very good support available on Usenet and
    message boards. There are so many people using Linux in many different ways that
    you’re almost certain to find someone who can help you answer your questions.'
