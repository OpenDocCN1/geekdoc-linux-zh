  md: '# Teaching Yourself, Top-Down


    Linux kernel code out of RAM and operating out of a RAM disk. Hardware is accessed
    through the Linux device driver architecture. The darkest boxes are like the lighter
    boxes, except that the system is running out of some kind of secondary storage
    rather than a RAMDisk. The rules being followed in the white box are system-specific.


    You''ll observe from that there are two possible boot routes (actually, more)
    once the kernel has been loaded. You can load an initial RAMdisk and run entirely
    out of that, you can use the initial RAMDisk and switch out to a main root filesystem
    on some other storage medium, or you skip the initial RAMdisk altogether and simply
    tell the kernel to mount a secondary storage device as root. Desktop Linux distributions
    tend to use the latter design model.


    Also note that there is an awful lot of redundant code here. The BIOS performs
    system tests and sets up a fairly complex software environment to make things
    cozy for operating systems like MS-DOS. The kernel has to duplicate much of the
    hardware discovery process. As a rule, once the kernel loads, none of the ROM-resident
    services are used again (although there are some exceptions to this statement),
    you still have to waste a bunch of RAM shadowing that useless BIOS code.


    In contrast to the x86''s complex boot process, an embedded device based on a
    PowerPC®, ARM or other embedded processor jumps as directly as possible into the
    operating system. Although there are exact standards for implementing firmware
    interfaces (equivalent to the PC ROM-BIOS) in PowerPC systems, these standards
    are rarely implemented in embedded appliances. The general firmware construction
    in such a system (assuming that it is based on Linux) is the operating system
    kernel, a minimal filesystem, and a small bootloader all reside in linearly accessible
    Flash memory.


    At power-up, the bootloader initializes the RAM controller and copies the kernel
    and (usually) the initial RAMdisk into RAM. Flash memory is typically slow and
    often has a narrower data bus than other methods in the system, so it''s practically
    unheard of execute the kernel directly out of Flash memory, although it''s theoretically
    possible with an uncompressed kernel image.


    Most bootloaders also give the user some kind of recovery interface, whereby the
    kernel and initial RAMdisk can be reloaded from some external interface if the
