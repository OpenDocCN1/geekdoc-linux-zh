    Since it''s difficult to absorb all the details of an industry in few moments,
    this process is generally iterative. Your customer will state the problem, and
    you will respond with a preliminary suggestion as to how the desired solution
    can be implemented. In this response, you should include as much detail as possible
    covering issues as:


    +   * Development time

    * Bill-of-materials cost,

    * A list of what can and cannot be achieved with the system in question, since
    the customer probably gave you an endless laundry list of features

    * Special issues the customer might not have considered


