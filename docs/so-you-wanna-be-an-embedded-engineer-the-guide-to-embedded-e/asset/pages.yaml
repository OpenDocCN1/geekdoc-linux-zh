  md: '# Education


    # 2.1 Traditional Education Paths into Embedded Engineering


    In October 2005, I attended an engineering job fair at Columbia University in
    New York, mainly to see who was hiring and what they were looking for. It''s most
    instructive to do a reconnaissance mission like this occasionlly, because corporations
    spend a large amount of money on these sorts of events and the internship and
    co-op programs to which they often lead. An observer can glean valuable information
    about the state of the industry merely from a list of who''s hiring and what sort
    of positions they are trying to fill. I left have other similar events recently,
    with the following two facts in mind:


    +   1. Domestic U.S. hiring for engineers of all types is picking up pace.

    2. The traditional path of college, then internship (a polite word for apprenticeship,
    really), then a regular nine-to-five job with a 401(k) and dental care as the
    major perks is far from dead, despite what you might read about trendy companies
    picking resumes off the Internet and challenging job applicants to a game of football
    in order to prove their employ-worthiness.


    Most of the people reading this book will probably be somewhat off the beaten
    path as far as the second point is concerned. My goal is to discuss this normal
    path, and indicate how you can rejoin it or work in parallel with it to the same
    goal.


    Before you start constructing an educational plan, please be quite clear about
    what you''re trying to achieve. Embedded work covers an unusually wide gamut'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Chapter 2


    of project complexities compared with most other branches of engineering. It is
    utterly impractical to attempt to become an all-around expert on all these things,
    and any prospective employer is likely to be gravely suspicious (with good reason)
    of such a claim, anyway. At the opposite extreme, spending years in some arcane
    branch of signal processing, to the exclusion of all other knowledge, is not a
    particularly useful way to spend your time. Standards and best-practice methods
    evolve constantly, and design priorities shift with changes in both the supply
    and demand sides of the marketplace. An almost universally relevant example of
    this is the trend toward moving functionality—especially complex signal decomposition
    and waveform generation—into firmware, by digital signal processors (DSPs) and
    high-speed conventional microcontrollers become cheaper and more power-efficient.
    There is a prevailing attitude nowadays of “get these nasty analog signals into
    the digital domain as quickly as possible.” In times of yore, when micros were
    expensive, breathtaking (and frequently grotesque) analog, digital and hybrid
    front ends were assembled to avoid the need for complex firmware. Nowadays, we
    all need to brush up on our math skills and learn fairly complex programming techniques
    to work with DSPs.


    The upside of this is that you need to narrow down your goals somewhat—not too
    far—before you intensive study. It''s perfectly acceptable to be unfocused while
    you''re deciding which your interests lie—that''s the only way to try things,
    after all. An undergraduate degree is designed to give you some basic skills and
    enough generalized knowledge to use as a base to build a detailed understanding
    of a particular field of specialty in postgraduate study. If you''re not new to
    the field of engineering, I''d suggest that you structure your first year or two
    of undergraduate study to get all the miscellaneous mandatory subjects—mathematics,
    physics, chemistry, and so on—out of the way, while you converse with your professors
    and senior students to decide what general slice of interests you the most. For
    example, RF engineering might appeal to you more than all the other options—in
    which case, you can direct your last year or two toward acquiring analog skills.
    If you can earn your bachelor’s degree, you can then select a field to specialize
    (preferably experiencing this field in the real workforce).


