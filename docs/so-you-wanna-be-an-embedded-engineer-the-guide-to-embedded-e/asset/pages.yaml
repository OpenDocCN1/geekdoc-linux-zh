  md: '# 40 Chapter 3


    The principal downsides here are (a) the cost of bonding the two parts, (b) vulnerability
    to vibration damage, (c) reduced speed, and (d) increased RF emissions. It is
    very instructive, when comparing the prices of different (large) micros with similar
    features, to drill down into the details like this and determine exactly what
    disadvantages you''re going to experience from choosing the cheaper part. Some
    applications might not be affected, but anything with tight RF requirements (a
    GPS receiver or cellular phone, for instance) needs to think carefully about the
    cost/benefit equation of choosing stacked-die parts.


    Leaving this interesting digression to one side, if you''ve got a solid practical
    electronics background—and I''m speaking here particularly to hardware design
    engineers, but also to technicians—you''ve got a big advantage over software-only
    people in the stores of applications where 8-bit processors are commonly used.
    The reason for this is that you''re already used to extracting state information
    out of a complex system using hardware tools that typically only allow you to
    look at the system through a tiny window. You''ve also gained a comfortable level
    of familiarity with what can go wrong with the system on the outside, from a voltage/time
    perspective.


    Hence, if you can drive an oscilloscope or logic analyzer competently, you''ve
    already acquired one of the most important skills you''re going to get in firmware
    development: being able to feel a great deal about the system being debugged by
    peering through a relatively small aperture. Although it''s nice to have a full
    symbolic debugger, this luxury is often not available. Sometimes it''s too expensive
    to justify purchasing the necessary hardware and software, and sometimes you simply
    can''t reproduce the problem(s) in your code when it''s running on emulator.


    In the remainder of this chapter, I''m going to introduce you to a few popular
    microcontroller cores, and describe some of their features, both enjoyable and
    execrable. This chapter is not, of course, an up-and-running guide to using any
    of these parts. It is a high-level overview of what''s inside these parts, where
    you might use some of these device families, and where their design strengths
    lie. Where possible, I''ll also provide with pointers to places where you can
    obtain hardware and software to do your own development and experimentation.


    On a related note: In this chapter, I mention several specific vendors and products
    by name, and I quote some approximate prices. I''m not endorsing these vendors
    in the same sense that an athlete might endorse a sports shoe company'
