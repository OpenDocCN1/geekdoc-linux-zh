  md: '# 94 Chapter 3


    For those who are really interested, here are some more details on how technology
    is applied in my submarine project. If you''re not building a vehicle of your
    own, you can skip the next few paragraphs. Although the hardware you see is here
    very similar to the control system in the sub, there''s an important architectural
    difference. In the sub, the heavy processing iron (currently an Advantech PCM-5820
    single-board x86 computer based on the AMD Geode™ processor) doesn''t do the navigation
    tasks; it is powered down almost all of the time in order to conserve energy.
    In fact, for the daylight hours, the submarine is configured in a minimum-power
    mode with everything switched off, so that the batteries can reach the maximum
    possible charge level. The actual mission is carried out at night—the rationale
    for this being that underwater you will need lights to see anything interesting
    regardless of what time it is, so you may spend your daytime collecting energy.


    As a result, the block diagram of the E-2 is slightly different from what you
    see in this; it has all the blocks, but the GPS receiver gets directly into the
    ATmega32. Through a little software and hardware cunning, a single UART on the
    ATmega32 serves both the GPS and the SCM. From a conceptual standpoint, the other
    main differences are all the software feedback loops (depth control, for instance)
    are closed within the ATmega32, and the engineering data log (EDL) is connected
    directly to micro as well. The EDL is implemented on a standard SD or MMC card
    in SPI mode.


    This architectural decision, by the way, is why I don''t need to worry much about
    security on the Linux side of the equation (the Kuro Box runs a standard edition
    of Hat Linux without special extensions). During normal operation, the outside
    world simply cannot communicate with the Linux box. The only field communications
    interface during mission time is with the VCM, which is as secure as it needs
    to be.


    Note that there are also a couple of additional function blocks in the E-2, designed
    to communicate with the device and with recovering if it lost, which article series
    doesn''t get into. These modules will eventually be described in detail in the
    E-2 public information area on larwe.com; one of them is an emergency recovery
    beacon similar to an aircraft flight data recorder''s “pinger”, and the other
    is an off-the-shelf satellite transceiver. E-2 can be contacted and commanded
    using satellite Short Message Service (SMS) strings; telemetry data can be uplinked
    over a moderate-bandwidth commercial satellite phone subsystem.'
