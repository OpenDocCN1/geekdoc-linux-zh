    # 7.5 Managing Relationships with Marketing


    The lines of communication among and division of responsibilities between departments
    of a large company often follow very similar patterns, no matter what the company
    may be.


    Teleology (n.)


    +   1. The study of design or purpose in natural phenomena.

    2. The use of ultimate purpose or design as a means of explaining phenomena.

    3. Belief in or the perception of purposeful development toward an end, as in
    nature or history.


    > The American Heritage Dictionary of the English Language, Fourth Edition


    Some might argue teleologically; the reason correct behaviors evolve this way
    is because they are destined to evolve this way.


    In almost any organization—even very small companies consisting of only two or
    three people—product features, release schedules and so on are driven, or perhaps
    herded, by marketing. This is a normal and, believe it or not, a desirable state
    of affairs. Marketing people—if they''re doing their job properly—have their finger
    on the pulse of what the customers want, when they want it, and how much they
    can be inveigled into paying for it. Like it or not, in a for-profit company,
    these factors are the primary constraints within which you, the engineer, need
    to shape your design. Even in a pure research environment—and there are precious
    few of jobs—“marketing” pressure comes from the people who direct funding toward
    research goals.


    In a hypothetical perfect company, marketing should hand down a wishlist of features.
    Engineering then responds, after due analysis, with accurate estimates of the
    development cost, development time, and per-unit costs for the various features.
    Marketing will forecast the likely sales for the product and present all this
    information to upper management, who will then make the requisite profit-and-loss
    decision as to whether this particular widget is profitable enough to produce.
    In some cases they might also assess if''s worth producing, even if not profitable,
    in order to achieve some other business goal.'
