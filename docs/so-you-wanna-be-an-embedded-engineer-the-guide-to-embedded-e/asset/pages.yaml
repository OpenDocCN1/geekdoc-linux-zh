  md: '# 84 Chapter 3


    Engineers are a contentious lot, as the preceding snippet should imply. The issue
    of which programming language represents the One True Faith of embedded software
    development has been the cause of millions of words of fiery finely reasoned technical
    arguments sprinkled with sample sourcecode, and not infrequently interspersed
    with bitter wrangling. I will give you a sneak peek at the truth right here in
    this first paragraph starting up-front that there is, in fact, no One True Faith,
    and that the correct programming language to use for an embedded application is
    a situation-specific decision. (Naturally, there are plenty of people who would
    argue this statement, just as there are people who would defend it to the death.
    In, merely by omitting [insert name of any computer language here] from the title
    of this section, I have invited flames down on my head.)


    The decision as to which programming language to use for a project rests on the
    following order:


    +   - The complexity of the project, which usually translates more or less directly
    into code size.

    - The project manager’s preferences, experience and, unfortunately, arbitrary
    whim.

    - Company policies.

    - The availability within your organization of experienced programmers for a given
    language or tool. Though this is clearly universal advice, it has been my experience
    that outsourced programmers have a predilection for high-level languages even
    when other aspects of the project are decidedly in of assembly language.

    - Availability of trusted tools for the hardware platform in question.

    - The resources (ROM, RAM, CPU horsepower) available in the hardware platform.
    As resources become tighter and tighter, hand-tweaked assembly language starts
    to become the only viable option.

    - Functional requirements of the system; in particular, real-time responsiveness.
    The further your language abstracts you from the hardware, the more difficult
    it is to guarantee overall system real-time behavior.'
