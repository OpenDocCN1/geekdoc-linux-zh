  md: '# Introduction 3


    Note, by the way, that this book is something of a work of management heresy,
    almost to the point where I considered publishing it under a pseudonym. It is
    written for embedded engineers, or people who want to be embedded engineers, not
    people who are counting the days until the moment they can put “manager” at the
    end of their job title. Although many engineers will one day deservedly graduate
    to management (and it''s certainly not a door you should close arbitrarily), I
    am assuming that right now, dear reader, are an “individual contributor”—one of
    the rudely faced faces grimacing at the bottom of the totem pole. Someday I may
    regret sowing these seeds of discontent in my future direct reports, but in the
    meantime, please take the most of the advice I''m offering.


    A final note: Sprinkled throughout this book you''ll find occasional humor breaks.
    Most of the snippets are of my own creation, they are to a certain degree representative
    of engineering humor that in a fairly large percentage of engineers would find
    humorous.I hope that you find them upon your first reading; if not, I encourage
    you to read this book again when you reach your goal of engineerhood.


    # 1.2 What Is an Embedded Engineer?


    Before I embark on a description of how you can become an embedded engineer, it
    is valuable to describe what the term encompasses (at least with respect to this
    book). To put it succinctly, embedded engineers work on the hardware and/or software
    of embedded control systems. In today''s world, this practically means systems
    built around a microprocessor core running executive software,although this software
    and its microprocessor aren''t necessarily the main meat of the system.


    Although most embedded engineers lean one toward the other side of the software-versus-hardware
    developer equation, there is less rigidity to the division of labor than there
    is in other specialized branches of engineering. A good


    > 2 I''ll hide behind this statement any you w at some particularly precarious
    piece of levy.

    3 For the purpose of this book, I''ll consider exotic scenarios, such as FPGA
    systems (without a microcontroller core), to fall within this description.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Chapter 1


    embedded engineer is part software engineer, part digital designer, part analog
    designer, with at least a rudimentary understanding of radio frequency (RF)—at
    least as far as mitigating interference is concerned. Like a medical specialist,
    the embedded engineer is a general practitioner first, with additional experience
    that allows him or her to work with particular confidence on certain classes of
    problems.


    This job description covers a great deal of territory—even more than you might
    realize from the previous broad description. A simple throwaway toy containing
    a speaking chip, a few LEDs, and a handful of switches; a cruise control mechanism
    in a car; an ultra high-speed cryptographic engine carrying a communications link
    between a guided missile and its operator—all these are the province of the embedded
    engineer. This makes it quite difficult to generalize broadly about the field
    without being ludicrously off-base for some significant number of readers. Perhaps
    more important, it makes it difficult for a newcomer who asks the question, “How
    do I enter the field?” to make sense of the answers that are proffered. This book
    tries to present several answers to many common questions, with enough background
    information for you to be able to decide which answer is most relevant to your
    skills, ambitions, and needs.'
