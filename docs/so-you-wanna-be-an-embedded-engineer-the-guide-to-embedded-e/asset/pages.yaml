    From an assembly language programmer’s standpoint, ARM720T is a von Neumann, highly
    orthogonal RISC architecture with a 32-bit instruction word. The “T” suffix indicates
    that this part also supports the Thumb mode. Thumb mode, the instruction word
    is only 16 bits in size, offering an improvement in code density and potentially
    an improvement in speed if the code is executed out of a 16-bit memory device.
    However, while Thumb is active, not all the general-purpose registers can be accessed,
    some other functionality is unavailable, and algorithm execution is therefore
    slower, all other things being equal. For the remainder of this discussion, unless
    otherwise specified, I am talking about ARM mode (the 32-bit mode), not 16-bit
    Thumb mode. Not that all instructions in ARM mode can be given a conditional override;
    this is not available in Thumb mode.


    The ARM core has sixteen general-purpose registers r0 through r15 in Thumb mode,
    r8 through r12 are not directly accessible. R15 is reserved for the program counter
    (PC), r14 is used as a link register for branch instructions (ARM assemblers give
    it alias “lr”), and r13 is the stack pointer (SP). This register is also a status
    register, CPSR (current program status register). This register is active for
    conditional branches and so forth the processor is executing in the unprivileged
    “user” and “system” mode. When the core is kicked into the privileged modes—FIQ,
    Supervisor, Abort, IRQ or Undefined—dedicated SPSR, LR and SP registers are mapped
    in, so each of these modes have its own link register, stack pointer and status
    word (these don’t need to be saved when you exit the privileged mode; they are
    kept separately in the core).


    If you’re not familiar with high-performance RISC architectures, you might find
    the idea of the link register a bit alien, by the way. CISC devices typically
    execute a call instruction by pushing the current program counter onto the stack
    and jumping to the new destination address; the matching return instruction automatically
    pops the return address off the stack into the program counter. RISC devices,
    on the other hand, typically have a link register and a special form of branch
    instruction that is usually called branch with link, or something similar (the
    mnemonic in ARM assembly language is “bl”). The branch with instruction operates
    by copying the return address into the link register—however that is defined in
    the processor’s instruction set architecture—jumping to the destination address.
    To return to the called program, you use an instruction that copies the link register
    back into the program counter; on the ARM, you would'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# 148 Chapter 4


    be either “bx lr” (unconditional branch to link register) or “mov pc, lr” (copy
    link register to program counter)—note that the two are not quite identical.


    The advantage of this system is that you can avoid touching memory when making
    nonnested calls inside the inner loop of function; it can be a significant performance
    enhancement. The called function also doesn''t necessarily need to mess around
    with stack arithmetic if it created local variables on the stack; it can jump
    directly back to the caller using the link register, the caller can simply restore
    the stack pointer to what it was before the function call, and all local variables
    and passed parameters would be cleaned up automatically. (The usual ABI for ARM
    specifies that r0–r3 are used to pass the first four parameters to C functions;
    any remaining parameters are passed on the stack.) You can think of the link register
    as, conceptually, a high-speed cache of the last return address on the stack.
    It only needs to be written out to actual RAM when making a nested function call.
    Additionally, when the link register is not being used, it can be employed as
    a general-purpose register.


    I''ve spent some time talking about nifty ARM is so, what are the downsides? Not
    really. There are three principal demands. First, the interrupt architecture is
    a bit unusual—the core directly supports two interrupt modes, IRQ and FIQ. IRQ
    (Interrupt ReQuest) FIQ (Interrupt ReQuest) is a high-priority interrupt that
    doesn''t need to save so much processor state, but guarantees lower latency than
    IRQ. FIQ is supported by shadow registers covering r8–r14 and SPSR (the status
    word); you don''t need to save these registers during the interrupt, and as a
    result your latency is reduced. Since there is effectively one interrupt level
    in the core, interrupts from multiple sources are vectored using software techniques;
    this is accomplished by effectively jumping into the register contents of the
    Vectored Interrupt Controller. It works, but it''s a bit strange.


    Second, on a closely related note, interrupt latency on ARM is relatively poor
    (potentially tens of clock cycles) compared with the 8-bit parts we all know and
    love. When an interrupt occurs, the CPU has to complete the current instruction—this
    could be as much as 15 clock cycles for a multistord instruction to 32-bit memory
    in ARM mode (potentially worse for narrow memory situations). The interrupt also
    causes a mode switch, which requires finite time—and the pipeline is flushed,
    which delays completion of the first instruction in the ISR.'
