    # 7.3 Globalization: Outsourcing and Temporary Worker Visas


    This section is aimed most directly at readers in the United States of America,
    but it is also relevant to European, Australian and other "first-world" engineers.
    In all of the developed world, there is a growing terror in professional communities
    that their jobs, formerly believed to be immobile, are outsourced to foreign engineers
    who have a much lower cost of living and therefore work for much less. There is
    a somewhat less acrimonious, but nevertheless perceptible body of ill-will toward
    companies that employ skilled foreigners using temporary work visas like the H-1B
    program in place in the United States.


