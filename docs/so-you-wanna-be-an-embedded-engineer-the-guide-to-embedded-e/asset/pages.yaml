- img_proc: true
  md: 'These applications would typically involve complex user interface code, with
    a GUI. Examples of such systems might include an ATM, an electronic storefront
    sign driven by an embedded PC, a PDA, an automated movie ticket vending machine,
    or a computer-driven airport/railway station board. Note that I am specifically
    excluding real-time systems that happen to have such high performance requirements
    that they need a 32-bit microprocessor.


    In a similar fashion to the previous chapter, I''m going to give you a brief taste
    of the capabilities of a few popular high-end platforms. Again, this is not supposed
    to be an introduction to actually developing for these systems. The goal is to
    elucidate for you some of the strengths and weaknesses of these powerful microcontroller
    families. This will help you to make an informed choice as to where you begin
    experiments of your own.


    # 4.2 Embedded x86 Solutions


    Developers who are most comfortable with application development under Windows
    or Linux will quite likely gravitate toward Intel-compatible x86 systems out of
    sheer familiarity. While x86 has some distinct disadvantages in many embedded
    applications, it is not to be despised when used in environments that benefit
    benefit from compatibility with off-the-shelf PC hardware and software.


    Let me digress here for a moment to explain why I selected the phrasing; it was
    not arbitrary. Simply put, x86 is not a very good candidate for many embedded
    systems. The x86-compatible extended family is (with a few exceptions that you
    can safely ignore) only employed as part of a more or less wholly PC-compatible
    hardware architecture. These processors and their support chips are large and
    extremely energy-hungry; active cooling is almost universally required in x86
    designs, and mains power is preferable. The dominant engineering steering x86-based
    designs is the baggage required by backwards compatibility (both in the CPU core
    and other support circuitry on the motherboard), and most of the people reading
    this text are dubious of the history behind this statement. Vast efforts have
    been invested—some uncharitable folk might say “squandered”—to modernize the CPU
    and overall system architecture, but even the current 64-bit architectures are
    constrained to some degree by legacy considerations. There are relatively few
    system-on-chip offerings based'
  merge: -1
