  md: '# Working for a Small Company 203


    some companies offer this sort of incentive, for course. The good news is that
    small companies are much more likely than large companies to offer you cash bonus
    at the end of the year; average raises are also usually directly tied to profits.
    The flip side of this can be quite bleak—since your salary is directly linked
    to the company''s ability to make sales, and the cash cushion is usually fairly
    small, any more-than-momentary interruption in sales means you''re not getting
    a paycheck.


    The strengths of a small organization lie in rapid adaptation and immediate flexibility.
    Because a lot of processes are not formally documented and regulated, employees
    are free to modify their behavior on a case-by-case basis to match changing circumstances.
    Besides allowing the company to provide better short-term customer satisfaction,
    this results in a feeling of self-empowerment for the employee which can be very
    good for morale. The negative side is that such a high level of flexibility introduces
    an unavoidable level of chaos into the daily operations of the business.


    Regardless of this downside, properly handled, the time you spend at a smaller
    organization can help you develop a solid work ethic and start on the way to building
    a network of vendors and colleagues who will work with you in later life. Perhaps
    most important of all, you''ll acquire a broad spectrum of experience in the lifecycle
    of engineering a product.


    # 6.2 How to Get the Job


    While hiring decisions are, of course, individual, there are some general rules
    that you''ll find useful when looking for a job in a small company. First, consider
    that the person who is going to read your résumé and interview you is almost certainly
    one of the principals of the company, with sole responsibility for hiring you.
    Contrast this against the large-company situation, where the gatekeeper first
    reads and potentially rejects your résumé is a computer program, and the person
    who interviews you is merely going to make an upward recommendation to hire you.
    As a closely related fact, the person who interviews you will have a direct interest
    in the value proposition (what this person earn me versus what I will have to
    pay them); this is definitely not always the case in a large company.'
