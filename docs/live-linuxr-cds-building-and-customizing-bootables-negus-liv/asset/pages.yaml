  md: '# Gentoo-Based Live CDs


    Creating live CDs from Gentoo repositories using tools associated with the Catalyst
    installer (www.gentoo.org/proj/en/releng/catalyst) is probably the most challenging
    approach to producing live CDs that is covered in this book. However, using Catalyst
    to build Gentoo live CDs also provides the most promise, in the long run, for
    producing live CDs that are specifically tuned for the computer architecture and
    hardware the CD is intended to run.


    Gentoo offers the capability to include cutting-edge software in the systems you
    install (or build into a live CD). Because packages can be built on the fly using
    simple commands, the software can be tuned for your specific computer system with
    only those features you want built into each package. The result is software that
    is leaner (including only what you need) and faster (because it''s tuned to a
    specific computer architecture).


    The Gentoo project produces a live CD that offers a usable GNOME desktop system.
    That live CD also includes desktop icons that you launch the recently added installer,
    in either graphical or text mode, you can permanently install Gentoo on your hard
    disk. The advantage is that, from this CD, you can set up the permanent Gentoo
    system you need to build your Gentoo live CD. Figure 1-10 shows an example of
    the Gentoo live CD desktop, including icons for launching the Gentoo command-line
    and graphical installers.


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_49_0.png)


    > FIGURE 1-10 Install Gentoo from a live CD to create a build environment for
    Gentoo.


    Chapter 8 describes both the Catalyst and remastering approaches to creating a
    Gentoo live CD. Remastering is similar to the procedure in Chapter 6 for remastering
    Knoppix.'
  merge: -1
