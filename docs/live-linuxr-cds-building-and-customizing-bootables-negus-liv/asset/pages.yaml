  md: '# Live Linux CDs


    Type this to get the package containing sample spec files:


    ```

    # emerge livecd-specs livecd-kconfigs

    ```


    Although, strictly speaking, you don''t need the livecd-specs and livecd-configs
    packages, they are useful to refer to later. The packages contain the spec files
    that the Gentoo development team used to create the official Gentoo live CDs,
    and have recently been updated for the 2006.1 release.


    # Configuring the catalyst.conf File


    With the software you need installed, next you should create and identify the
    directories for building your Gentoo live CD with Catalyst. For the catalyst command
    to know where your working directories are located, those locations need to be
    identified in /etc/catalyst/catalyst.conf. Here are examples of how variables
    can be set in that file:


    ```

    # /etc/catalyst/catalyst.conf file

    distdir="/usr/portage/distfiles"

    options="pkgcache kerncache"

    sharedir="/usr/lib/catalyst"

    storedir="/var/tmp/catalyst"

    envcript="/root/catalyst-env.sh"

    ```


    The following list describes variables you can set in the catalyst.conf.


    +   - distdir—Use the default distdir in most cases (/usr/portage/distfiles).
    This directory contains all the files that were fetched when you install packages.

    - options—By adding pkgcache and kerncache to the options line, you can set Catalyst
    to save all built packages and build your kernel, respectively. The seedcache
    and snapcache caching for those features are useful because they save time by
    not having to rebuild components that don''t change each time you rebuild your
    stage files. The autoresume option enables you to save points at which you want
    to restart a build.

    - sharedir—Indicates the location of Catalyst runtime executables. The default
    /usr/lib/catalyst directory is used in most cases.

    - storedir—Indicates the location where temporary and cache files are stored.
    The default is /var/tmp/catalyst.

    - envcript—If you need to set any options or environment variables to use when
    you build live CDs set the location of the script containing those items with
    the envcript variable. By default, envcript is commented out.'
