  md: 'Before you use the provided kickstart file, you should change at least the
    rootpw line (to set your own encrypted password) and timezone (to set the time
    zone in which the live CD is expected to run). Also, uncommenting and using a
    network line saves you from having to deal with the network configuration screen.
    Those and other kickstart options you might want to use are also described here:


    install


    Indicates that the Fedora installation is a new install instead of an upgrade.


    lang


    Indicates the primary language to use during the installation process.


    langsupport


    Indicates the language to be installed on the live CD. If more than one language
    is installed, a --default option must be set to indicate which language is used
    by default.


    keyboard


    Sets the type of keyboard to be used.


    xconfig


    If you are using GNOME, KDE, or other X desktop software, you can set specifics
    about your X server configuration. If you don''t set xconfig, Fedora tries to
    probe for your monitor and video card. If your display configuration is not properly
    detected, you might need to set your X configuration after you boot using the
    system-config-display utility.


    network


    You can set your network configuration so that your network comes up when you
    boot your live CD. If a DHCP server is available, you can use a line such as the
    following to have your network come up automatically:


    network --bootproto=dhcp -device=eth0


    rootpw


    Using rootpw expects an encrypted MD5 password to be assigned to the root user.
    To create an MD5 encrypted password to use the rootpw line, type the following:


    ```

    # openssl passwd -1

    Password: mygnucar

    Verifying - Password: mygnucar

    $oob11gYPhObSQJqHyTYRCxrewKN0

    ```


    Type the password you want to use (twice) as prompted. The previous example shows
    the encrypted string resulting from the password mygnucar. (Of course, you want
    to select your own password and use the string that.)'
