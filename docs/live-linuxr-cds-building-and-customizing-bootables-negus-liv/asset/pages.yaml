  pgno: 169
- img_proc: true
  md: '# Live Linux CDs


    GRUB''s flexibility also extends to its user interface. Command-line menu interfaces
    are available with GRUB. As a developer, you can change the look of the boot screens
    by adding your own images. As a user, you can edit boot labels before launching
    the selected operating system.


    Configuring GRUB centers on the grub.conf file. Like the isolinux.cfg file used
    with Isolinux, grub.conf can set a variety of options, followed by specific labels
    that represent the operating systems GRUB can boot. The grub.conf file is a plain-text
    file that you can edit with any editor.


    From a live CD point of view, GRUB comes with an El Torito-compatible stage2 boot
    file. That boot file is placed with other GRUB-related files in the /boot directory.
    The location of this boot file (called stage2_eltorito) is identified in the mkisofs
    command when you produce the ISO image for your live CD.


    To illustrate how GRUB can be used as the boot loader for a live CD, the following
    steps describe how to remaster a Knoppix CD to use GRUB. The steps were done on
    a Fedora system that has the grub package installed and the contents of a Knoppix
    CD copied to the /knoppix/master directory. If you are using a different Linux
    system, you need to get the grub package for your system or download it from the
    GNU Linux site (www.gnu.org/software/).


    +   1. From the root of the directory where you are remastering Knoppix (it should
    contain several author files, as well as boot/ and KNOPPIX/ directories), make
    a grub directory. For example, if your remaster directory is /knoppix/master,
    you will type the following:

    > # cd /knoppix/master

    > # mkdir -p boot/grub

    2. Copy the stage2_eltorito to the grub directory as follows:

    > # cp /usr/share/grub/i386-redhat/stage2_eltorito boot/grub

    3. Copy the files from the isolinux directory. I chose to use the kernel file
    (linux), the initial RAM disk (minirt.gz), and the memtest command:

    > # cd /knoppix/master/boot/isolinux

    > # cp linux minirt.gz memtest ../grub

    4. Next, you can create your own splash screen to use as the background for the
    GRUB menu when you first boot the live CD. For the background, you can use an
    XPM image that is 640x480, has a 14-color palette, and is compressed with gzip.
    You can use GIMP to convert your image to this size or use the convert command.
    This example converts a JPEG image to one that can be used on a GRUB splash screen:'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# CHAPTER 5 Looking Inside Live CD Components


    ```

    # convert -colors 14 -resize 640x480 mypic.jpg myplash.xpm

    # gzip myplash.xpm

    # cp myplash.xpm /knoppix/master/boot/grub

    ```


    5. Create a grub.conf file in the boot/grub directory, I got edit any text editor.
    Many of the options used here from the isolinux.cfg file that comes with Knoppix:

    default=0

    timeout=10

    splashimage=(cd)(boot/grub/myplash.xpm.gz

    title KNOPIX 5

    root (cd)

    kernel /boot/grub/linux ramdisk_size=100000

    init/etc/init lang=us ap-power-off vga=791

    nonce quiet BOOT_IMAGE=knoppix

    ititrd /boot/grub/minert.gz

    title KNOPIX 5 expert

    root (cd)

    kernel /boot/grub/linux ramdisk_size=100000

    init/etc/init lang=us ap-power-off vga=791

    nonce BOOT_IMAGE=knoppix

    ititrd /boot/grub/minert.gz

    title KNOPIX 5 knoppix-test

    kernel /boot/grub/linux ramdisk_size=100000

    init/etc/init lang=us ap-power-off vga=normal

    quiet memtest BOOT_IMAGE=knoppix

    ititrd /boot/grub/minert.gz

    title MEMTEST

    root (cd)

    kernel /boot/grub/memtest


    The default=0 set, the first title (KNOPIX 5) is booted by default (after the
    timeout expires). With default=10 set, the timeout is set to 10 seconds (pressing
    any key from the splash screen prevents the timeout). The splashimage value indicates
    that the image file that will appear behind the GRUB menu (created earlier in
    this procedure) is located at /boot/grub/myplash.xpm.gz on the CD.

    A title indicates each boot entry. For this example, I simply re- a few of the
    entries from the isolinux.cfg file for Knoppix. I put the APPEND boot options
    from that file on the line with each kernel (the options should be on the kernel
    line, although they are shown as indented here). So the kernel is linux and the
    initial RAM disk is minirt.gz. I also added an entry to run the memtest command.'
