    # Making the Compressed File-System Image


    With everything set up in the file system that will be your Knoppix live CD, the
    next step is to gather that file system into a single compressed image. That image
    (named KNOPPIX) will go into the final CD ISO, where parts of that image can be
    uncompressed (later by the loop driver), as they are needed.


    When making the compressed file system image, you need the amount of memory (RAM
    plus swap) described near the beginning of the chapter. Refer to that section
    again on how to check the amount of available you need before proceeding.


    > NOTE

    Although in this example we are using a single KNOPPIX image, you can have multiple
    KNOPPIX images in the /KNOPPIX directory (KNOPPIX, KNOPPIX2, KNOPPIX3, and so
    on). They will all be picked up and merged into a single root file system (/)
    when Knoppix boots up.


    Allowing multiple KNOPPIX images not only makes each of those images a more manageable
    size, but it also reduces the total amount of memory you need, instead of producing
    a single, massive KNOPPIX image. The official Knoppix DVD includes KNOPPIX and
    KNOPPIX2 images that are merged.


    The mkiso command is the tool used to make a set of selected files into an ISO
    9660 file-system image. Because this file system needs to include Linux/Unix file
    system features that are not part of the official ISO 9660 standard, several options
    are added to the command line to support those needed features. The image we create
    is not itself bootable (no -b or -c options to add El Torito boot information).
    It will, however, be included on the bootable image.


    In this example, after the ISO 9660 image is created, it is piped to the create_compressed_fs
    command to reduce the size of that image. Here''s an example of command line:'
