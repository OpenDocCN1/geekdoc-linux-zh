  md: '# CHAPTER 9 Customizing a Security Linux CD


    start up network interfaces. In the case of BackTrack, the network interfaces
    are not started automatically. Here are some of the highlights of what occurs
    after the init process sets other processes in motion to start up system services:


    +   - S script—The /etc/rc.d/rc.S script runs every time the live CD is started
    (regardless of the init) This mounts and checks any file systems listed in /etc/fstab,
    turns on, startsadev (to manage remove devices), and configures plug-and-device
    devices.

    - M script—The /etc/rc.d/rc.M script runs when the live CD boots up to any multiuser
    run level (2, 3, 4, and running). It does some logging (dmesg output to /var/log/dmesg
    and the syslog log daemon). This script also runs the rc.slax script, which responds
    to several options that might have been agreed at the boot prompt. For example,
    the nougest guest user account and password causes the script to prompt for the
    new root password. For the autoexec option, the script runs the command (for example,
    autoexec="date") and then reboots.


    +   - V init scripts—One of the lists that the rc.S script runs is the /etc/rc.d/rc.svinit
    script to start any System V init scripts to run at the current run level. For
    example, in run level 3, the script starts any scripts beginning with the letter
    S in /etc/rc.d/rc3.d.


    +   - MyLAX scripts—The only script currently in the /etc/rc.d/rc3.d directory
    is Installscript. If you added any MyLAX Modular scripts to this directory (names
    that begin with Install\*), they would be executed to install the software it
    contained. Information on adding MyLAX described later in this chapter.


    If you had watched the messages we were displayed, the process described take
    between the message beginning with "INIT:" and the login prompt.


    # Customizing the init Process


    Features you add to a security CD during the init process should focus on the
    kinds of services you want to enable or disable during the live session. Here
    are some customizations you might want to consider:


    +   - Add boot options—You can add for different boot options that are dealt with
    the init process. For example, the /etc/rc.d/rc.M script. That script reads the
    boot options (stored in /proc/cmdline) and turns various services on or off based
    on those settings.


    +   - Add system services—If you want to have a particular service launched at
    boot time, you can add a script for that service to a run level directory. In
    this case, you could add start-up scripts (beginning with the letter S) to the
    /etc/rc.d/rc3.d directory.'
