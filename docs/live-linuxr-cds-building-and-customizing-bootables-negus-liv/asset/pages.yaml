  md: '# SUMMARY


    Although the BIOS, which runs when the computer is first turned on, is typically
    supplied by the manufacturer of the motherboard, nearly every other aspect of
    the boot process involves opensource software. For that reason, someone creating
    a live Linux CD can control every aspect of the live CD boot process with control
    off from the BIOS.


    The control a user can exert over the BIOS is typically done from the BIOS setup
    process. Most important, the user might need to make sure that the device containing
    the live CD (CD, DVD, USB flash drive, or other medium) is enabled. The next step
    is to be sure that the device falls in the boot order so that another device (such
    as the computer''s hard disk) doesn''t boot first.


    The BIOS passes control of the boot process to the boot loader next. For Linux
    CDs, that typically means the Isolinux boot loader. With Isolinux, the user can
    type a boot label and control the boot process going forward. GRUB is another
    type of boot loader that is sometimes used with live Linux CDs (however, it is
    more often used to boot from hard disk).


    After the selected label is booted, the Linux kernel takes over with the help
    of some drivers and commands made from an initial RAM disk. The kernel and initial
    RAM disk represent the most basic components needed to mount the file system structure,
    load the needed drivers, and begin the initialization of the system services.


    For Knoppix, the next step is to run the linuxrc script. The linuxrc script, which
    is contained on the initial RAM disk, is responsible for mounting the file systems
    and loading the drivers needed to proceed to the next stage of the boot process.


    System services are started by way of the init process. The init process relies
    on the contents of the /etc/initab file and run directories for the current run.
    For Knoppix, the default run level is 5. This means that the live CD is intended
    to boot up to a graphical desktop system.


    Many of the features described in this chapter are common to many Linux systems.
    Some features are more specifically used on live CDs. The next chapter describes
    features such as file systems that are particularly useful to live CDs (squashfs
    and UnionFS) and boot loaders used to boot live CDs (Isolinux, and to a lesser
    extent, GRUB).'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Looking Inside Live CD Components


    Although many of the components you find in live CD systems are the same ones
    you find in installed Linux systems, some components are of particular interest
    to live CDs. Live Linux CDs are different than installed systems in these areas:


    +   **Boot loaders**—Isolinux (part of the Syslinux project) is the boot loader
    most used with live CDs because it implements the El Torito boot, which BIOSes
    understand, booting from CD-ROM. Other boot loaders, such as GRUB or LILO, can
    be used as well but tend to be less popular for use with live Linux CDs.


    +   **File systems**—Issues related to file system types relate to the facts that
    live CDs are typically a read-only medium and they have much more space limitations
    than a typical hard disk. The UnionFS file system is an interesting file system
    type because it can be used to merge read-only and read/write file systems to
    enable you to save files in what would otherwise be a read-only environment on
    a live CD. Live Linux CDs such as Knoppix use UnionFS in tandem with file systems
    compressed for the loop driver, allowing more than double the amount of software
    to be included on the live CD.


    The Squashfs file system has become a popular file system type because it compresses
    software in a way that it can be uncompressed on the fly. Live Fedora CDs created
    using Kadisci can incorporate file systems compressed with Squashfs.'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'After the live Linux CD boots up, the CD often runs a script that does a lot
    of the magic needed to make it operational. Knoppix runs a linuxrc script, which
    mounts file systems, loads modules, and copies files that are needed. After that,
    the live CD typically passes control to the init process to start up the system
    processes. From point forward, how services start and the ways that you use the
    system are very similar to the ways you would use a Linux system installed on
    your hard disk. The differences then relate to the Linux distribution on which
    the live CD is based.


    Before you begin the process of remastering or putting together a live CD from
    scratch, it helps to understand some of the differences among the different Linux
    distributions used to create the live CD you are building:


    +   - Software packaging—Although you can install software from tarballs (even
    building the software from source code, if you want), using software that is prepackaged
    for the Linux distribution on which your live Linux CD is based can cause you
    trouble. Packaging formats described in this book include RPM (for building Fedoras),
    Deb (for Debian-Knoppix, and other live CDs), and emerge (for Gentoo live CDs).


    Some Linux CDs also have their own methods of installing software that are prepackaged
    for their particular live CD. Damn Small Linux has a MyDSL feature that lets you
    install tarballs of software live and across reboots. SLAX lets you add software
    packaged as compressed modules to activate software-on-the-fly.


    +   - Installers—Instead of remastering an existing live CD, certain live distributions
    enable you to use the installer with the distribution to create a live CD. One
    example of this is the Kasidis project, which uses the anaconda installer that
    comes with Fedora and Red Hat Enterprise to run through a fresh software installation
    that results in a live CD ISO image. Another example is the Gentoo Catalyst installer,
    which can likewise be used to create a live CD from scratch.


    The topics covered in this chapter serve as background for the procedures for
    remastering or creating from scratch the different types of live CDs covered in
    the chapters that follow. The first section covers how to use boot loaders in
    live CDs.


    # USING BOOT LOADERS IN LIVE CDs


    When the computer''s BIOS is directed to boot from a live CD, the boot loader
    takes over. Most live Linux CDs use Isolinux as their boot loader. If you choose
    to use GRUB as your boot loader, you can choose different boot labels from a menu'
