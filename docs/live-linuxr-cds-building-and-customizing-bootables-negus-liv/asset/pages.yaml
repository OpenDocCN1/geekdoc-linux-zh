  md: '# CHAPTER 13 Customizing a Firewall Live Linux CD


    buffer overflows and other attacks that take advantage of minor vulnerabilities
    to run arbitrary code. Because the firewall is your first line of defense, you
    want it to be as secure as possible.


    +   - Simple GUI tools—I also like Devil Linux because I can use a simple GUI
