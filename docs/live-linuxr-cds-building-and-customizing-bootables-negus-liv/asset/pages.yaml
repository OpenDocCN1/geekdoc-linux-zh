  md: '# Building a Basic Fedora Live CD


    To start building your own bootable live Linux CD system, you should set up the
    tools you need to build your live Linux and the software packages you plan to
    put into it. Because this chapter steps you through creating Live Linux CDs based
    on Fedora Core using a project called Kadischi, I describe how to do the following:


    +   - Obtain and set up the Fedora Core distribution and Kadischi tools needed
    to create the live Fedora CD

    - Run the commands to create your first Fedora live CD

    - Learn about the many opportunities to customize your Fedora live CD


    When you understand the basics for building a Fedora live CD with Kadischi, you
    can go on to use many of the techniques in the third part of this book to create
    specialized Linux CDs and DVDs.


    Unlike Knoppix, which is itself a bootable Linux distribution, Kadischi is really
    a set of tools you can use to produce your own live Linux distribution based on
    the Red Hat-sponsored Fedora Core Linux project. Using the Red Hat anaconda installer,
    Kadischi essentially creates a live Fedora Core CD or DVD (in the form of an ISO
    image).'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# UNDERSTANDING HOW TO BUILD A FEDORA LIVE CD


    The process of building a Fedora-based live CD using Kadischi is very similar
    to doing a typical permanent install of Fedora to your hard disk. The process
    consists of the following:


    +   - Launching an install of Fedora Core (typically from a repository of Fedora
    Core located on your hard disk)

    - Installing the Fedora system as you selected (language, keyboard, network settings,
    packages, and so on) to a temporary directory on your hard disk

    - Gathering the installed software from the temporary directory and molding it
    into a form that can be used in a live CD environment

    - Creating a bootable ISO image of that software


    Essentially, you need the following items to get started:


    +   - **Fedora Core installed**—This procedure describes how to create a live
    Linux CD from an installed Fedora Core system. This procedure was tested and run
    on an installed Fedora Core 6.

    - **Kadischi Tools installed**—You need to install the Kadis software included
    on the DVD that comes with this book. The software is packaged as a binary RPM
    that was tested to run on Fedora Core 6.

    - **Fedora Core repository**—The actual live Linux CD you create will be made
    from a selection of packages from Fedora Core. You can get those packages in several
    ways, but I describe how to install them on a directory on your hard disk and
    use them from there.

    - **Fedora Core kickstart file**—You have the option of using a kickstart file
    to indicate the software packages and other installation options used to create
    your Fedora live CD. Using a kickstart file, you can easily repeat the process
    of creating your live Fedora ISO without having to manually step through the Fedora
    Core install each time.


    Kadischi works by installing a Fedora system to a directory structure on your
    hard drive and other read-only medium. Kadischi compresses the Fedora system tree
    that was created and joins that with a newly created RAM disk (initrd) to form
    the ISO image that is the bootable Fedora system.


    The live CDs you can produce using Kadischi tools and Fedora Core software repositories
    won''t have the bells and whistles you get with Knoppix, but the approach Kadischi
    takes to producing live CDs has some wonderful advantages.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# CHAPTER 7 Building a Basic Fedora Live CD


    In fact, in some ways, Kadiski can produce live CDs that are more secure and easier
    to fix and rebuild than Knoppix live CDs. Here''s how:


    +   - **Read-only file system**—By default, Kadiski uses Squash as the file system
    that holds most of the files on a Fedora live CD. The drawback is that those files
    and directories used directly from the live CD cannot be changed, deleted, or
    added to once the CD is running. By keeping those files and directories read-only,
    however opportunities exist to hack into areas that might be vulnerable. Although
    making most of the file system readable in Knoppix with UnionFS is user-friendly,
    it is inherently less secure.

    - **Kickstart**—By using a kickstart file, you can define all the options you
    want to build your live CD. Instead of having a chroot environment (as is done
    with remastering Knoppix), you can simply run Kadiski using the same kickstart
    file. Small changes or updated packages in the software repository can be immediately
    picked up and incorporated into a new ISO image.

    - **Easy firewall and service setup**—During the process of producing a live CD
    with Kadiski, you have the opportunity to configure a secure firewall. Likewise,
    and turn on or off services that are needed on the live CD (such as remote shell,
    FTP service, or Web service).


    Kadiski was created by Darko Il as part of the Google Source Code project in 2005
    (http://code.google.com/soc-results.html). Discussions of the development process
    on the Fedora Live CD mailing list (www.redhat.com/archives/fedora-livecd-mailing-list/index.html)
    can give you some insights into the design decisions. Information about Kadiski
    is maintained by the Fedora Project Wiki (www.fedaproject.org/wiki/kadiski).


    The technology which Kadiski is based includes software from the Stateless-linux
    project (http://fedora.redhat.com/projects/stateless)—in particular, the readonly-root
    package. Some ideas for creating Kadiski were also taken from the Linux4All project
    (http://www.linux4all.com), which created the Basilisk-based live CD.


    Like many other live CD projects, Isolinux (http://syslinux.zytor.com/iso.php)
    is the boot loader used by default to manage the live CD''s boot process for Fedora.
    The mkiso command, used to produce the resulting ISO image, is part of the cdrecord
    project (http://cdrecord.berlio.de/old/private/cdrecord.html).


    Going forward, a fair amount of development is going on with Kadiski. As more
    Kadiski features are added to the Anaconda installer, building live CDs based
    on Fedora will become a more mainstream activity that is built into'
  merge: -1
