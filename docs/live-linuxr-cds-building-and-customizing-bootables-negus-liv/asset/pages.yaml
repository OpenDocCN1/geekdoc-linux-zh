    work with GeeXBox is available from the supported hardware page (www.geexbox.com/en/hard.html).


    TV Out is available with GeeXBox for those TV cards that include TV Out, the default
    resolution is 800x600 and some cards support only 640x480. TV Out standards include
    NTSC, PAL, and SECAM. Many TV card remote controls are also supported by GeeXBox.


