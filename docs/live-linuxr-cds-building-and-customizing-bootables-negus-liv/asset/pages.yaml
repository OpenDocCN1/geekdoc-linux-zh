  md: '# CHAPTER 5 Looking Inside CD Components


    instead of typing in the label you want. The following sections describe how to
    use Isolinux and GRUB boot loaders with a live CD.


    # Using the Isolinux Boot Loader


    Isolinux provides a level of control over the boot process by allowing the user
    to enter different boot labels and options to control what is booted and which
    features of that image are on or off. Isolinux is one of several projects in the
    Syslinux suite (http://syslinux.zyor.com/) of boot loaders. The different Syslinux
    boot loaders differ based on the type of medium each is made to boot. The Syslinux
    boot loaders include the following:


    +   - **Isolinux**—Used to boot ISO 9660 CD-ROMs. The Isolinux boot loader is
    the one most used to boot live CDs and DVDs (or images made for those media).


    +   - **Syslinux**—Used to boot MS-DOS and Windows FAT file systems. Often used
    to create a bootable floppy disk.


    +   - **Pelinux**—Used for booting a computer from a network server. Often Pelinux
    boots a program (such as Nilo, http://nilo.sourceforge.net) that has been loaded
    as a PXE-compliant PROM on a network card.


    +   - **Extlinux**—Used to boot an ext2 or ext3 file system.


    This book focuses on Isolinux because it is used for booting live CDs or similar
    removable media. What do you need to know about Isolinux differs based on whether
    you are using a live CD or creating your live CD:


    +   **Using an Isolinux live CD**—As someone booting a live CD, you might just
    press Enter and forget about Isolinux completely. However, to boot the live CD
    in different ways, you can try different boot labels (defined using Isolinux features)
    and options. Often pressing a function key at the boot screen (F1, F2, F3, and
    so) shows different boot labels and options.


    To see for what boot labels and options can be chosen, you can refer to the isolinux.cfg
    file for the live CD (it probably in the /boot/isolinux or /isolinux directories
    in the root of the live CD). Chapter 2, “Playing with Live CDs,” and Chapter 3,
    “Customizing a Live CD,” describe some boot options by different live CDs.


    +   **Building an Isolinux live CD**—If you are creating or remastering a live
    CD, you can set up Isolinux features to boot your live CD in different ways. For
    example, you might set labels to boot the live CD in different video modes or
    to start at different run levels. You might also add'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'special labels to do things as you check your RAM (memtest command) or boot
    to a Linux installer instead of a live CD.


    If you are building a live CD, Isolinux also enables you to control what the users
    see from the boot screen. Using Isolinux, you can incorporate an image that you
    choose on the splash screen. You can also create message screens on which you
    can place information that is useful to the person booting the live CD (such as
    boot options and licensing information).


    The following describes different ways of configuring the Isolinux boot loader
    to direct the boot process of your live CD.


    # Understanding Isolinux


    Isolinux is made to be compatible with the El Torito Bootable CD-ROM Format Specification
    (search for the speccd.pdf file at www.phoenix.com). That specification defines
    what a CD-ROM must include to be bootable and what a computer''s BIOS needs to
    boot a CD. Because the El Torito spec has been widely accepted since it was created
    in 1994, most PCs made in the past decade are capable of booting El Torito-compatible
    CDs and DVDs.


    El Torito extends the ISO 9660 standard (which describes the format of CD-ROMs)
    by identifying the location of a boot record volume descriptor that points to
    a boot catalog. The boot catalog contains information on available images that
    can be selected and booted.


    Isolinux operates in the El Torito mode referred to as no emulation mode. This
    means that the computer executes the image without performing floppy emulation
    (which limits how much space you can access on the CD-ROM) or hard disk emulation
    (which doesn''t work on all BIOSes). Using “no emulation” lets you access the
    whole CD or DVD from the Isolinux boot loader. For example, accessing more than
    8GB of compressed data on a DVD-9 is no problem.


    # Setting Up the isolinux Directory


    Isolinux is designed to have the files it needs in a single directory on the live
    CD. Files in that directory can include kernels, initial RAM disks, message files,
    a splash screen, and related files. A boot catalog in the isolinux directory is
    inserted into the CD header to identify the available images. A configuration
    file also identifies available kernels and options.


    To see some real-world implementations of isolinux, you can look at /isolinux
    or /boot/isolinux directories of a Linux live CD, such as Knoppix.'
