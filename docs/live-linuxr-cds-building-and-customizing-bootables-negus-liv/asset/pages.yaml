    # Creating Boot Labels


    Adding boot labels to your insolux.cfg file is one technique for helping those
    who use your live CD get it running properly. Although the default label that
    launches your live CD is the mode that you expect to be (for example, for a KDE
    desktop or to a shell), you can use alternate labels for some of the cases:


    +   **Check memory—Instead of running a Linux kernel, a particular label might
    run a different command altogether. For example, some live CDs use the memtest
    label to run the memtest command. This is a good way to determine how much RAM
    is available and how much of it is working properly. With the memtest command
    in the insolux directory, the following label is used in Knoppix to start that
    command:


    ```

    LABEL memtest

    KERNEL memtest

    APPEND initrd=

    ```


    In this case, the memtest command runs when the memtest label is typed at the
    boot prompt. No initial RAM disk is needed, so the APPEND line is basically blank.


    +   **Run in selected video modes—Because an inability to get the X display working
    properly can be a great challenge in some cases, often a live CD offers specific
    labels so the CD can run in particular video modes. Video for many laptops works
    in framebuffer mode. You can set different framebuffer-specifications using the
    vga option. For example, vga=769×480 with 256 colors). Table 5-3 shows a list
    of available video modes.'
