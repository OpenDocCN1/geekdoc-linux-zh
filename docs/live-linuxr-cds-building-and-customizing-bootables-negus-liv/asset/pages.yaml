  md: '# SELECTING BOOTABLE MEDIA


    The term live CD is used generically to describe a bootable operating system that
    sits on a removable medium outside of your computer''s hard disk. This term is
    widely used because some of the first popular full-featured live bootables (in
    particular, Knoppix) were made specifically to fit on a CD. Now, however, you
    can consider many different media types for holding your bootable live Linux.
    Table 1-1 describes examples of media you can use to hold your Live Linux (shown
    in Figures 1-5, 1-6, 1-7, and 1-8).


    Although CDs, DVDs, and USB flash drives are the most popular bootable media,
    you can actually put a bootable Linux on any device that the PC''s BIOS can recognize
    as a boot device. For example, PCs can also boot from Zip drives and floppy disks
    (although the Linux 2.6 kernel has become too large to fit on a floppy). You can
    even launch your bootable Linux from some local medium on the computer (such as
    a PXE-enabled Ethernet card) and run your bootable Linux from a device on network.


    If you have an ISO image of a CD in a directory on your hard disk because you
    just downloaded it or are in the process of testing one that you created, you
    can often try to use image using some sort of virtualization software. For example,
    you can use VMware or Qemu and run the bootable image so that it appears in a
    window right on your desktop screen. This lets you try out your live CD before
    you burn up your media.


    # Getting the Most from a Live CD


    When using a live CD, you can use some tips and tricks to get the most of your
    experience running live Linux systems. When trying out a live CD, many people
    find the concept quite cool. When you start using a live CD, however, you likely
    want to do:


    +   **Run faster**—Accessing from a CD or DVD drive is generally slower than accessing
    data from a hard disk. Add to the fact that data on the CD is usually compressed
    (to fit on as much software as possible), decompression adds another performance
    hit. Some live Linux distributions include a feature that lets you write the entire
    distribution to memory (provided your PC has enough available). As a result, the
    live Linux system might actually run faster than one installed to your hard disk.


    If you are building your own live CD, you can also build it to run in low-RAM
    or slow CPU environments. For example, you might choose simple applications and
    window managers for your live CD.'
