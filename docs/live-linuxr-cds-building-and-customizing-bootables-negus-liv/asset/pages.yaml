  md: '# CHAPTER 6 Building a Custom Knoppix CD


    Now you should have all files needed to boot your live CD in the master/KNOP-PIX
    directory. The entire KNOPPIX file system you are using should be in the source/KNOPPIX
    directory. Your next step is to change your root directory (chroot) to the source/KNOPPIX
    directory and modify that directory structure to contain the applications, files,
    and directories you want to include on your live CD.


    # Working in the chroot Environment


    By changing your root directory to the source/KNOPPIX directory, you change the
    contents of your custom Knoppix CD image by working within that directory structure.
    Within that environment, you can add and remove software packages, set up a desktop,
    and configure system settings.


    When you run the chroot command, as shown, you begin working from a copy of the
    Knoppix system you just booted from CD. Therefore, you have to do a few steps
    to make that environment capable of accessing the Internet and downloading software
    packages. Remember that everything you do to the file system while you are in
    this environment ends up on the CD you produce.


    Here''s what you do:


    +   12. Add network access—To use the chrooted environment to access the Internet,
    you need a resolving.conf file. If you were able to get an Internet connection
    from the live CD (via DHCP), you can copy the resolv.conf file that was created
    when you booted Knoppix:


    ```

    # cd /media/hdal/knoppix/source/KNOPPIX/etc/dhcp

    # cp /etc/dhcp/resolv.conf .

    cp: overwrite ./resolv.conf? y

    ```


    +   13. Run chroot—To assign the source/KNOPPIX directory as your root directory,
    type the chroot command and mount the /proc file system as follows:

    # chroot /media/hdal/knoppix/source/KNOPPIX

    # mount -t proc /proc /proc

    warning: can''t open /etc/fstab: No such file or directory


    > NOTE

    If the partition you chroot to was mounted with the nodev option, a //dev/null
    error message might appear ("Permission Denied"). You can get around this problem
    by adding the dev option to the entry in /etc/fstab and then unmounting and remounting
    the partition. For example, the new fstab entry for /dev/hdal1 might appear as
    follows:


    ```

    /dev/hdal1/media/hdal1 ext3 noauto,users,dev 0 0

    ```'
