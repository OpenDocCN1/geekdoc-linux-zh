  md: '# CHAPTER 1 Starting Up with Live Linux CDs


    Despite the fact that Fedora Core comes with no guarantees (then again, what Linux
    system does?), Fedora Core is developed and maintained primarily by world-class
    software developers employed by Red Hat. In fact, what is developed in Fedora
    Core (which is released every 6 to 9 months) finds its way into Red Hat Enterprise
    Linux (scheduled to release approximately every 18 months). So Red Hat, Inc.,
    has a vested interest in making Core a good distribution.


    Fedora and Red Hat Enterprise Linux are among the last Linux distributions to
    offer a live CD. The effort started in earnest with the 2005 Summer Code Project
    by Dark Illic. Dark created Kadiski, a set of tools for producing live CDs using
    Fedora software repositories and the anaconda installer.


    In the past year, leaders from Red Hat Inc. have been picking up development of
    Kadiski-related tools. Some of the features previously built into the kadiski
    command are now being incorporated directly into the Fedora anaconda installer.
    In fact, producing a live CD is becoming more like doing a regular Fedora installer
    to hard disk.


    By relying on the anaconda installer, kadiski gives you access to a lot of the
    different installation features in Fedora when you produce a live CD. Then, not
    only you get the software packages you want, but you can also choose your language,
    keyboard, network configuration, time zone, and other configuration settings.
    Kadiski launches the anaconda installer to produce a live CD in two ways:


    +   - Graphical installer—When you learn the kadiski command, you must identify
