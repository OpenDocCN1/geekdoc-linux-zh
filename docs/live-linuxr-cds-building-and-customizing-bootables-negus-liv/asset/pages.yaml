  md: '# CUSTOMIZING A Fedora LIVE CD


    Although customizing a Fedora Live CD or DVD can be as simple as just selecting
    the features you would put in a normal Fedora Core installation (selecting software
    packages, keyboard, language, network configuration, and so on), you can customize
    your live Fedora CD with Kadisci in many other ways.


    To help understand where your opportunities are for customizing a live Fedora
    CD, here is a list of activities that occur when the kadiski command runs:


    +   **kadiski command options and configuration files**—Options on the kadiski
    command line indicate the location of the Fedora software repository and the filename
    of the resulting ISO image (the actual bootable image you will burn to CD). Most
    of the other options you add let you indicate how anaconda will run. (See the
    kadiski options described at the end of the "Trying a Test Build" section, earlier
    in this chapter.)


    The kadiski command sets the location of the build directory to /tmp. You can
    override that location by adding the --tempdir variable to the command line (for
    example, --tempdir=/home/build/). You can also change the location where Kadisci
    scripts and files are stored (/usr/share/kadiski/ by default) by changing the
    value of INSTALLDIR in the /etc/kadiski/kadiski.conf file.


    +   **Fedora (anaconda)**—The anaconda installer used to install the Fedora distribution
    to the build directory that is created for your live CD is a new version of the
    standard Fedora anaconda installer that has been updated to be able to run live
    CDs. To use anaconda to build live CDs, kadiski runs anaconda with --livecd


    Based on the options given to the kadiski command, anaconda can run in different
    modes: GUI, text-based, or command (based entirely from a kickstart file you provide).
    The screens you see are the Fedora Core installation screens. You can also bypass
    those screens by feeding the required information via a kickstart file.


    +   **Kadiski post-install scripts**—When Fedora is installed to the build directory,
    a set of post-install scripts are run from the /usr/share/kadiski/post_installscripts
    directory. These scripts modify the standard Fedora install so it can run from
    a live CD.


    +   **Initial RAM disk**—The /usr/share/kadiski/livecd-mkinitrd.sh script creates
    the initial RAM disk (initrd.img) used as the file system when the kernel initially
    boots the live CD.'
  merge: -1
