    from a boot loader, so the only way to run it is from a separate ISO image. I
    created two different ISO images of PuppetiX that are on the DVD that comes with
    this book:


    +   **puppetix**—The image puppetix-0.1.iso contains the software needed to boot
    to a full-screen slide show. It also includes the framework for playing OpenOffice
    presentations, but it doesn''t include Imp itself. By not including the OpenOffice.org
