  md: '# COMMERCIAL GAMES LICENSES


    By focusing on the LLGP live CD, which was built from Knoppix and from packages
    included in the Debian/Knoppix software repositories, I managed to skirt some
    of the more complicated issues related to licensing. In fact, if you want to make
    sure that you can freely redistribute any live CD you build, you can stay clear
    of most patent and copyright infringement if you stick with software in repositories
    of established Linux distributions that carefully scrutinize licenses (Debian,
    Fedora, and Gentoo).


    However, sometimes you might want to include games that are one or more covered
    under commercial or other non-GPL licenses. The general rule of thumb is that
    if a copyright owner of a piece of software has not released it into the public
    domain, you can''t just assume that it is okay to use and redistribute the software.
    This is still true if the owner is no longer selling the product and even if the
    company no exists.


    However, in some instances you might be able to include commercial gaming software
    on your personal, or redistributed, live CD. Here are some examples:


    +   Commercial demos—A producer of commercial games for Linux might be happy to
    have you quite demos of its commercial games. Before doing so, you would need
    to contact the producer to get written permission to do so. I''ve heard that GarageGames.com
    has given permission for some live CDs to redistribute its demos. Keep in mind
    that the demos you distribute probably include some samples materials.


    +   Closed-source drivers—To do high-quality 3D gaming on Nvidia and ATI cards,
    you will need to include closed-source drivers from those manufacturers. In many
    cases, such drivers can be redistributed freely, in people''s opinions (see https://www.nvidia.com/object/nv_swlicense.html).


    However, open-source purists say that, when distributing closed-source drivers,
    you don''t know how drivers are infecting your Linux kernel. In fact, depending
    on how you configure these drivers, they can ruin your kernel''s capability to
    use other video drivers (Earlier I noted a case that I had with my i586 motherboard
    conflicting with the Nvidia drivers.)


    +   Commercial products released to the public—Some games actually were released
    into the public domain years after they stopped being viable products. If you
    want to include such gaming software on your live CD, however, you should make
    sure that the entire product is modifiable and can be freely redistributed.'
  merge: -1
