  md: 'When you are ready to begin building your own live CD, you can start from scratch
    or you can start with an existing Linux distribution. Starting with an existing
    distribution offers many advantages:


    +   **Prepackaged software**—One feature that sets different Linux distributions
    apart is the way that software is packaged for each distribution. Although you
    can usually get software directly from the software project that made it, most
    of the popular software projects already have been compiled, packaged, and tested
    for the major Linux distributions.


    The three distributions illustrated in this book (Knoix/Debian, Fedora, and Gentoo)
    each use a specific packaging format. Because Knoppies is based on Debian GNU/Linux,
    you can add precompiled .deb software packages that match your particular distribution''s
    release. Fedora can include packages in RPM that are maintained in Fedora Core
    or Fedora Extras, or from third-party sources. Gentoo maintains packages using
    the Portage system.


    +   **Software tools and repositories**—To maintain consistency among the software
    you install on a particular distribution, Linux distributions set up software
    repositories that contains thousands of packages. Each distribution also includes
    tools for installing and managing software.


    For Debian, the dpkg system was created to manage software that was packaged into
    .deb format. Later, APT utilities came to point installation requests at software
    repositories on the Internet. Gentoo uses the emerge command, to let you grab,
    compile, and install any of 10,000 packages from Internet repositories


    Fedora and other Red Hat-sponsored Linux systems package software in RPM format
    (.rpm). To build live CDs, you can use the anaconda installer to install Fedora
    to hard disk, but have the result be a live CD ISO instead. Typically, you copy
    the RPM packages to hard disk to create the live CD. However, anaconda and other
    software tools in Fedora have moved toward supporting online repositories that
    are constructed for use with the yum utility. So, in other words, you can build
    a live CD entirely from software repositories outside of the local system.


    Before we launch into a description of the software tools just mentioned (and
    how to use them when you are creating your own live CDs), I want to mention a
    few other approaches to gathering the software you want and building live CDs
    that are not covered in this book. You might want to look into these approaches
    to building live CDs if the procedures in this book don''t suit you:'
