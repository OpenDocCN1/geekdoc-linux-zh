  md: '# CHAPTER 1 Starting Up with Live Linux CDs


    Although the Catalyst tools represent the greatest prospect for building and tuning
    a live CD to your exact specifications, they take a long time to run and require
    more expertise to make corrections when something goes wrong. For that reason,
    descriptions for building Gentoo live CDs in Chapter 8, "Building a Basic Gentoo
    Live CD," start with a remastering approach before getting into how to use Catalyst
    to build a live CD.


    If you decide that saving a few settings and some data (customization) doesn''t
    meet your needs, you must have (or develop) some expertise in Linux systems from
    the command line. You cannot remaster or build a live CD from scratch entirely
    from a graphical environment (at least, so far); you must work as the root user
    from the command line, in most cases.


    What you will find as you dig in, however, that Linux is an extraordinarily rich
    environment for creating your live CD. Linux is the natural platform for custom
    operating systems because of these characteristics:


    +   **Small core**—A minimal kernel and a few applications can run in only a few
    megabytes of memory. So your live CD can be tuned to run efficiently from the
    live CD or even loaded completely into memory (making it blazing fast to use).


    +   **Building-block nature**—Unlike developers of some proprietary operating
    systems, strive to interoperate with existing components created by other people.
    This gives you the choice to piece together components that suit your needs. For
    example, you can include any of several boot loaders (ISOLINUX, GRUB, or LILO)
    to start your live CD, or choose a desktop that is either full-featured (such
    as GNOME or KDE) or lightweight (such as Fluxbox or WindowMaker).


    +   **Vast amount of available software**—You can draw on thousands of open-source
    software projects for your live CD. By starting with an Linux distribution (such
    as Debian, Fedora, and Gentoo, as were chosen for this book) you begin with versions
    of those software projects that have been packaged and tested for these particular
    Linux environments. For you, it''s usually more like just making a shopping list
    of software packages than it is having to make every piece of software work yourself.


    If you are already familiar with Debian (including Knoppix), Fedora Core (including
    Red Hat Enterprise Linux or CentOS systems), Slackware (including SLA) or Gentoo,
    you might naturally want to begin by building a live CD that is based on that
    distribution.'
