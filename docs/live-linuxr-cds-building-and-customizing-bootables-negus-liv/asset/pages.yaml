- img_proc: true
  md: '# MAKING THE LIVE CD IMAGE


    To make the live CD image from the directory structure you created, you need to
    first separate the /boot directory from the rest of the live system. Next, you
    can convert the remaining file system to a squashfs file system and use the two
    elements to- create the live CD, using the mkisofs command.


    ```

    # cd /root/livecd

    # mkdir -p target/files/source

    # cp -a source/boot target/

    # cp -p -R -d source/ target/files

    # cd target/files

    ```


    The next step is to convert the file system into a single squashfs archive. To
    do that, type the following:


    ```

    # mksquashfs source/ /root/livecd/target/livecd.squashfs

    # touch /root/livecd/target/livecd

    # cd /root/livecd/target

    # rm -rf files/

    ```


    After the previous set of commands, you should now have a /root/livecd/ target
    directory that contains a /boot directory (which includes the kernel and files
    needed to boot your computer) and the livecd.squashfs file (represents a compressed
    image of your live CD''s file system). If you want anything else to go into the
    root of your live CD (such as a license file or a README file), you can place
    that in the target directory as well.


    The last step in creating the ISO image is to run the mkisofs command. Here is
    an example:


    ```

    # cd /root/livecd/target

    # mkisofs -R -b boot/grub/stage2_eltorito -no-emul-boot \

    --boot-load-size 4 --boot-info-table --hide-rr-moved \

    -c boot.catalog -o /root/livecd.iso /root/livecd/target/

    ```


    The result of the command is just a live CD image named livecd.iso in the /root
    directory. This ISO image is ready to be tested.


    # TESTING THE LIVE CD IMAGE


    You can test your live CD as you would with any live CD. Here are a few reminders:


    +   - **Use qemu**—You can boot your live CD using the qemu package. Install the
    qemu package and then use the qemu command with the ISO you just built, as shown:


    ```

    # emerge qemu

    # qemu -cdrom /root/livecd.iso -boot d -m 512

    ```'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'The emerge command installs the qemu software. The qemu command shown boots
    the livecd.iso image, telling the command that it is a CD-ROM image (-cdrom),
    that qemu is booting from a CD image (-boot d), and to use 512MB of virtual memory
    to run the booted image (--m 512).


    +   Burn to media—You can, of course, burn the ISO to a CD or DVD. Because you
    will probably redo your CD a few times, rewritable media will probably save you
    money. To do a quick erase and burn, you can use the following commands:


    ```

    # cdrecord -v gracime=2 dev/cdrom -tao blank=fast

    # cdrecord -v /root/livecd.iso

    ```


    Many other options exist for cdrecord (try man cdrecord). For example, to do a
    thorough erase of your CD, use blank=all instead of blank=fast. After the CD is
    booted, insert it into the CD drive of any computer and reboot.


    If everything on your CD worked perfectly, you are done. If there are problems,
    assuming that you kept your source directory, you can go back and make corrections.
    To make corrections to your CD image, return to the step where you mounted the
    sys, proc, and other directories in your source directory. Then run the chmod
    command again and continue forward with the procedure from there to make any changes
    you desire.


    # CREATING A Gentoo LIVE CD WITH CATALYST


    The Catalyst project, which is referred to as the Gentoo Linux Release Engineering
    Metatool, includes features that Gentoo users extend the “build-your-own” concept
    to live CDs as well. Catalyst is the official tool for building CDs in Gentoo.
    It is provided in this chapter as an alternative method because, for the first-time
    Gentoo CD builder, it can be a bit trickier to produce live CDs with Catalyst.


    > NOTE

    Using Catalyst to produce live CDs is not intended for casual users. The information
    in this section is our attempt to steer more advanced users toward the recommended
    way of producing Gentoo live CDs.


    With Catalyst, you can create your own group of settings and packages in what
    are referred to as spec files. With those spec files, you execute the commands
    used to make the live CD. You can find more information on Catalyst here:'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# CHAPTER 8 Building a Basic Gentoo CD


    +   **Catalyst project page**—For links to the Catalyst FAQ and Reference Manual,
    refer to the Catalyst project page (www.gentoo.org/proj/en/releng/catalyst). documentation
    on the most recent version of Catalyst was not complete at the time of writing.
    However, descriptions of the catalyst command are still available, they will better
    reflect the current state of how Catalyst is used than descriptions of the older
    catalyst command from catalyst 1.1.


    +   **Catalyst mailing list**—The Catalyst mailing list is probably the best place
    to ask questions about building Gentoo live CDs. Subscribe to the list by sending
    an e-mail from your catalyst+subscribe@gentoo.org (to receive and post to the
    list) or gentoo-catalyst+subscribe-digest@gentoo.org (to send a digest of messages
    every few days).


    +   **Catalyst documentation**—For information about the catalyst command itself,
    type man catalyst or -help. Sample spec files for creating live CD stages are
    available by installing the livedcd-specs and livedcd-configs packages. The former
    contains files for building official Gentoo live CDs, while the later contains
    files for configuring live CD kernels for different computer architectures. Review
    spec files in /usr/share/doc/catalyst-2.0*/examples/ directory to learn about
    the set you can choose to create your live CD.


    Building Gentoo live CDs is in stages. The livedcd-stage target is what you gather
    and compile all the software packages you want to include on your live CD to form
    an archive for livedcd-stage2. In livedcd-stage2, you customize the basic livedcd-stage1
    archive you build to include such as custom splash screens, create or remove configuration
    files, and select system services to start automatically.


    # Setting Up the Build Environment


    I started with an installed Gentoo system to do this procedure, although you should
    be able to create a live CD with Catalyst from any Linux system. To install Gentoo
    to your hard disk, follow the instructions in the "Installing Gentoo" section
    earlier in this chapter. When Gentoo is installed, you need to run a few commands
    to get the software you need to create live CDs with Catalyst.


    You can get the Catalyst software you need to create your Gentoo live CD by indicating
    that you want the new catalyst software and running emerge, as follows:


    ```

    # mkdir -p /etc/portage

    # echo "dev-util/catalyst ~x86" >> /etc/portage/package.keywords

    # emerge catalyst

    ```'
