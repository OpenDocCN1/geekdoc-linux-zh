    # Adventure Games


    Falcon''s Eye is a graphical version of the popular NetHack game. With Falcon''s
    Eye, instead of moving keyboard letters around ASCII grids, you see graphical
    characters and items appearing around a colorful grid. The purpose of the game
    is to travel through mazes to retrieve the Amulet of Yor. Along the way, you encounter
