    The following sections describe how to modify your Kadishi configuration to change
    how your live CD is created. Step through those sections to find where configuration
    files are located and ideas on ways you can change them.


    Besides existing Kadishi configuration files and scripts, I cover how to create
    your own kickstart file to bypass or all of the Fedora (anaconda) installation
    process. You need to use a kickstart in most cases when you are fintuning a live
    CD, and you don''t have to step through (and remember) all the options you want
    to set along the way.


    # Changing Scripts and Configuration Files


    The /usr/share/kadishi directory contains scripts and other content in Kadishi
    that you might want to modify to adapt to your own Fedora live CD. Two configuration
    files for Kadishi (kadishi.conf and buildstamp files) are located in the /etc/kadishi
    directory.


    Before you start changing the contents of your kadishi directory, however, I recommend
    that you make a copy of that directory, in case you have a problem and want to
    go back to any of the original files. For example:


    ```

    # cp -a /usr/share/kadishi /usr/share/kadishi-original

    ```


    The scripts you can modify in the kadishi directory are python (.py), perl (.pl),
    or shell (.sh) scripts:


    +   livecd-initrd.sh—This script creates the initial RAM disk (initrd.img) that
    is used on the live CD.


    +   install-boot.sh—This script creates the files needed to initially boot the
    live CD. It copies the initial RAM disk (initrd.img) and kernel, and creates configuration
    files in the isolinux directory. You can modify this script to'
