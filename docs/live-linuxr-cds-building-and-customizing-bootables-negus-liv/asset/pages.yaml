    t /etc/make.globals file. Although you should not change this file, it''s

    good place to see where Portage gets files, where it keeps tempo-

    rary files, and what settings it uses. To override these settings, use the

    make.conf file.


    +   - make.conf—Settings in the /etc/make.conf file direct the specific build

    environment you use to install the packages on your live CD.

    Variables you set here override settings in make.globals (except for USE,

    CONFIG_PROTECT*, and ACCEPT_KEYWORDS variables, which are added to

    extisting variable values). For details on what make.conf can contain, type

    man make.conf or see the /etc/make.conf file.


    This is where some knowledge of the Gentoo Portage system can be very use-

    ful. The variables you set in the make.conf file have profound effect on both

