    # SUMMARY


    Gaming live CDs can be just plain fun to put together and use. Hundreds, if not
    thousands, of free and open-source games are available to include on your Linux
    CDs. Categories of games include adventure, arcade, board games, card games, sports,
    and strategy games.


    A big issue with getting high-quality 3D games running on Linux CDs is the issue
    of supported 3D accelerated video cards. Nvidia and ATI release versions of their
    drivers, but those drivers can sometimes conflict with drivers for open-source
    hardware-accelerated video cards. Open-source purists also note that there''s
    no way to know how those drivers might be causing conflicts in your Linux system
    kernel.


    Outside the realm of open-source games, you might be able to include with your
    live CD some older commercial games that have been released as freeware. Games
    once sold commercially, including Doom and games such as Beneath the Steel Sky
    and Flight of the Amazon Queen, that run on the GPL-licensed ScummVM can also
    be included on a live CD.


    The Fedora installer and tools from the Kadishi project are used to illustrate
    how to build a gaming live CD that is based on the Fedora Linux distribution.
    Using the latest Fedora anaconda installer, you can select packages from multiple
    online repositories to gain access to more gaming and other software packages.'
