  md: '# CHAPTER 12 Customizing a Multimedia Live Linux CD


    this book (which I am not qualified to do), I pass on the general interpretation
    of what is and is not considered to be freely distributable software for multimedia.


    If you are creating audio or video content from scratch, you can use opensource
    audio and video codecs. Any content you create with these open-source multimedia
    players can be freely distributed along with the players and encoders themselves.
    You can even include these encoders and players in your own commercial products,
    as long as you adhere to the licensing associated with them (which generally requires
    that you make the source code available).


    +   **Audio (Ogg Verbis and FLAC)**—The Xiph Foundation (www.xiph.org) produces
    Ogg Verbis as an efficient, high-quality competitor to MP3 audio encoding. Ogg
    is the media container and Verbis is the audio codec. Ogg Verbis is a nonproprietary,
    patent- and royalty-free audio format that can produce good-quality audio at high
    rates of compression.


    +   The Free Loss Audio Codec (FLAC) is another audio format sponsored by Xiph.org
    (http://flac.sourceforge.net). FLAC audio files are much larger than comparable
    Ogg Verbis or MP3 files, but this format features some compression with no discernible
    loss of audio quality.


    +   Nearly every audio and video player available for Linux (ogg123, xmms, mplayer,
    yine, and others) support Ogg Verbis audio.


    +   **Video (Theora)**—Theta (www.theora.org) is the free video codec sponsored
    by Xiph.org, Theora was based on the VP3 codec which was released into the public
    domain several years ago (see www.theora/svn.html). Tools such as Cinelerra (http://cinelerra.org)
    and ffmpeg2theora can be used to create Ogg audio/video files. Open-source video
    players (including VLC player, Helix Player, Totem, and mplayer) can play Ogg
    Theta content.


    As I noted earlier, playing your own multimedia content in Ogg Verbis and Theora
    from live CD is not a problem. Playing commercial multimedia content, however,
    is an issue. This is where you need to do some digging. Every major Linux distribution
    includes software for playing commercial music CDs, but most don''t include software
    for Theora comes with some restrictions that prevent it from being freely distributed.


    Playing commercial movies from DVDs is a different case. The encryption techniques
    used to produce and play commercial movies on DVD were trade secrets and, therefore,
    were not patented or copyrighted. So when encryption was broken with software
    referred to as DeCSS, there was nobody to claim a royalty for distributing the
    software to play commercial DVDs.'
