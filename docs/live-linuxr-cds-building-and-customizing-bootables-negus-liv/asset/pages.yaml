    After you select a package to download, you need to enter a location to store
    that application. For example, if you have an accessible pen drive for saving
    your settings, you can save the applications to /mnt/sda1. (You can mount any
    drive by selecting the drive name from the mounting tool in the lower-right corner
    of the screen.)


    # Restoring Files and Applications


    As with Knoppix, you can DSL restore your backup archive from the boot prompt.
    One difference, however, is that DSL restores your backup archive automatically
    if it finds it on one of your storage media (even if you don''t ask for it). This
    can cause some confusion if you forgot you left an archive on a hard disk or USB
    flash memory drive. DSL also has options for restoring your DSL applications.


    As noted, you don''t have to add any boot options if you have a backup archive
    on any available storage medium. DSL simply finds it and uses it. However, if
    you have multiple backup.tar.gz files (on different media), you can explicitly
    identify a particular drive to indicate the one you want. For example, to restore
    the backup from the first partition on your USB drive (sda1), you could type the
    following at the boot prompt:


    ```

    dsl restore=sda1

    ```


    To restore your saved applications, you can use the mysdl option. For example,
    if your applications are on the first partition of your USB drive (sda1), you
    could type the following at the boot prompt:


    ```

    dsl mysdl=sda1

    ```'
