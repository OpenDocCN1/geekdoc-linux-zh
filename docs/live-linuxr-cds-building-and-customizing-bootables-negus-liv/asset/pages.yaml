    # Changing or Adding System Start-Up Services


    Knopp lets you use the standard V init script facility for starting system services.
    Using this facility, you can add any system services you like (Web server, mail
    server, login server, and so on) that the system starts when Knoppies boots up.


    Regardless of which run level (also called system) the system boots up to, the
    first init script is the knoppix-autoconfig script (located in /etc/rc5.d/S00knoppix-autoconfig).
    This script defines many basic settings (language, keyboard, and modules so Knoppix
    can interact with hardware-ports and storage devices (USB, firewire, and others).


    By default, Knopp starts up in init state 5. The state is the most commonly used
    to start an X desktop system that is connected to a network. When any start-up
    scripts in the /etc/rc.d directory beginning with the letter S are started (run
    with the start option), while start-up scripts beginning with K are stopped (run
    with the stop option).


    Many applications that include start-up scripts place these scripts in the /etc/init.d
    directory. For example, if you want to have any of the services in /etc/init.d
    start up when you boot your custom Knoppix, you only need link the script for
    that service to a file in /etc/rc5.d that begins with a letter S. Here is an example:


    ```

    # cd /etc/rc5.d

    # ln -s ../init.d/ssh S55ssh

    ```


    In the example the ssh service start-up script is linked to a file S55ssh in the
    /etc/rc5.d directory. The convention of that filename is the letter S (for “start”),
    followed by a number (indicating the order the script will run), and ending with
    the script name. (You can use any number you like, although the convention is
    to use numbers above 40 for services that require the network to be running and
    all local file systems to be mounted.) In this case, the ssh daemon starts automatically
    when you boot Knoppix, remote users can log into the computer using ssh.'
