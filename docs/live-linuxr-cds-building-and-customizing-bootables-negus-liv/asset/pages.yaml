    appears in front of it. This enables you to use a larger image than you can with
    Isolinux.


    Using GRUB, you can have as many presentations available from the boot screen
    as you want. Each presentation can be run with a different player or options that
    you define.


    To begin setting up the GRUB boot loader, I added a grub directory to the master/boot
    directory during remastering. On the resulting live CD, that directory will end
    up as the /cdrom/boot/grub directory. More important, however, when you make the
    ISO file system (mkisofs command), the El Torito boot image and related files
    come from that directory.


