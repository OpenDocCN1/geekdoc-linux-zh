  md: '# Live Linux CDs


    +   **File saves**—Because the root system (/) of the live CD often resides on
    the live CD or other read-only medium, you cannot directly add files to that file
    system or modify files from that file system. As a result, for example, you could
    not install new software or change settings in files located in directories on
    the live CD.


    Live CD developers have taken a few different approaches with that issue. On Fedora
    CDs, you can simply install new software or otherwise add new files to directories
    in read-only file systems. Directories that need to be read/write (such as /tmp
    and /home directories) are mounted on a writable file system that is mounted from
    system memory. In other words, you are just saving your data to temporary, transient
    work space.


    On Knopix live CDs, using UnionFS file system is overlaid on the read-only file
    system. That way, files that you save to the /bin directory, for example, appear
    to be in the /bin directory, even though they actually reside on a different physical
    file system. That writable file system would, with Fedora live CDs, be saved in
    RAM.


    +   **Changes you make**—Unless you make some other arrangements, all the files
    you add and settings you change during a live session disappear when you reboot
    the computer. For any live CD, you can save files during a live session by either
    opening write access to a hard-disk partition or inserting your own writable medium
    (such as a USB flash drive).


    In some cases, just saving files is not enough. For example, you might want to
    save installed software, your desktop background, or other data that has to be
    in a particular location in the file system to be used automatically. In case,
    you need a live CD that supports the capability to put data back where it belongs
    the next time you reboot. In Knopix, that feature is referred to as a persistent
    desktop; in Dybolic, the same feature is called a Nest.


    +   **Hard-disk access**—Most live CDs are designed to prevent unintentional changes
    to the hard-disk partitions on the computer. For reason, those partitions are
    usually not mounted when the live CD boots. If a desktop feature is available
    to let you choose to mount those partitions, it typically does so in read-only
    mode, by default.


    Exceptions to this rule exist, however. By default, the Puppy Linux (www.puppylin.org)
    creates a file system, represented by a single 256MB file, on a hard-disk partition
    in which the data you create is saved. It does without asking if it''s okay. By
    default, that file (called PUP001) remains on the hard disk after the reboot,
    so all your settings return the next time you reboot your live CD on that computer.'
