  md: '# Running Card Game, Board Game, and Strategy Game Clones


    Nearly every board game or card game you can imagine in the real world has a version
    available that you can play in Linux. Likewise, many popular computer and arcade
    games have been cloned to open-source applications. Some games are diverting to
    play if you need a bit of downtime include these:


    +   - Card games->Select Games -> Card Games from the K menu and select a card
    game to try. You''ll find several solitaire games, Crabbage, Go Fish, XScat, and
    a clone of Mille Borne.

    - Board games->Select Games -> Board Games from the K menu to select from dozens
    of board games. You''ll find traditional board games such as chess, backgammon,
    and mahjong, as well as clones of commercial games, such as Monopoly.

    - Strategy games->Select Games -> Strategy from the K menu to choose from a variety
    of original and cloned strategy games. Select Freecraft to try the free clone
    of the popular Civilization games. Choose Freecraft to try a clone of the Warcraft
    II real-time strategy games.


    You can include plenty of games in these categories on a live Linux. KDE and GNOME
    desktop environments themselves offer packages that include a rounded set of game
    packages.


    For information on issues that you go producing your own gaming CD, refer to Chapter
    11. Besides choosing the types of games you want to include, you need to carefully
    consider licensing issues and requirements for video hardware (especially for
    games requiring 3D hardware acceleration).


    # RUNNING A Multimedia LIVE CD (MOVIX AND DYNEBOLIC)


    Playing and displaying multimedia content are among the most activities to do
    with a computer. Desktop-oriented live CDs, such as Knoppix, typically offer several
    choices for playing audio, digital images, and some of video. People have also
    developed a variety of specialized live CDs for both presenting and creating multimedia
    content. Here are some examples:


    +   - Specialized media players->There live Linux CDs made primarily for playing
    video. Because there is little overhead with just being a media player (no bulky
    desktop required), these tiny multimedia CD systems often play audio CDs and digital
    images as well. Low resource demands allow you can run them on minimal PCs (a
    Pentium II with 64MB of RAM often works fine).'
