- img_proc: true
  md: 'The isolinux.cfg file is a plain-text file in either Linux (Unix) or DOS formats.
    It contains a set of keywords and values to provide default settings and user
    options. Using the portions of the isolinux.cfg file that comes with Knoppix as
    an example, here are some ways this file can control the boot process of a live
    CD.


    +   **Default boot command**—The DEFAULT line sets the boot command to run if
    the user simply presses Enter at the boot prompt (the Linux kernel with no options
    is run by default).


    +   **Boot timeout**—The TIMEOUT value of 300 causes the live CD to wait 30 seconds
    before booting the boot command. The value of TIMEOUT represents [1/10] of a second.
    A user can prevent the timeout from occurring by pressing any key on the keyboard
    after the boot prompt


    The value TOTALTIMEOUT can be set instead to boot the default command after a
    number of [10] seconds, regardless of whether the user pressed a key. Both TIMEOUT
    and TOTALTIMEOUT can be set to allow a short period of time to stop the boot process
    (maybe 30 seconds), but ultimately boot after a few minutes (maybe 5 minutes)
    if the user hasn''t entered a command by that point.


    +   **Boot prompt**—Setting PROMPT 1 causes the boot prompt to always be displayed
    from the Linux boot screen. By setting PROMPT to 0 instead, the prompt is displayed
    only when the user presses the Alt or Shift keys (or the Caps Lock or Scroll Lock
    key is on).


    By setting NOESCAPE flag to 1, you can disable the escapes just described. For
    example, if you set PROMPT 0 and then set NOESCAPE 1, the user has no way of entering
    the boot prompt. As a result, the default boot command runs every time. This approach
    is good if you know the exact hardware environment you are using and don''t want
    any user intervention in the boot process.


    +   **Initial boot screen**—The DISPLAY value points to the file contents are
    displayed as the initial boot screen. Often, as is the case with Knoppix and many
    others, the file reads in an image file that is displayed at the top of the boot
    screen. The upcoming section "Creating Boot Screens" describes the format you
    can use with this file.


    +   **Additional boot screens**—You can have ten boot screens in addition to the
    initial boot screen. Using the keys F1, F2, F3, F4, F5, F6, F7, F8, and F9, you
    can assign a particular file to each function key of the same name. You can assign
    F0 to the F10 function key.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# CHAPTER 5 Looking Inside CD Components


    Usually, as is done with Knoppix, F1 is assigned to the same boot screen file
    (boot.msg) as is assigned to the DISPLAY keyword. In that way, the user can return
    to the original boot screen (by pressing F1) after visiting the other boot screens.
    The boot: prompt remains at the bottom of all boot screens, so the user can type
    in the desired label and options from any of those screens.


    In the case of Knoppix, the content of the boot.msg file appears on the initial
    boot screen and when the F1 key is pressed. The f2 and f3 files are assigned to
    the F1 and F2 function keys, respectively. For information on how these files
    are formatted, refer to the “Creating Boot Screens” section.


    +   * Boot labels—The LABEL keyword identifies the string of characters that users
    type at boot prompt if they don''t want to use the default boot command. Often
    labels represent the name of the live CD (such as knoppix or ds1 for Damn Small
    Linux). Other boot labels, indicate special-purpose commands or settings that
    come with the live CD. Typically at least two keywords follow each LABEL keyword.
    The KERNEL keyword identifies the image file containing the Linux kernel to boot
    for that label. For example, the file linux contains a bootable Linux kernel with
    Knnoppix.


    The other keyword typically used is APPEND. Any options added to the APPEND keyword
    are appended to the command indicated by KERNEL for the LABEL. Options that users
    type with the label at the boot prompt are added to the end of the APPEND options.


    Some of the options added to an APPEND line tell how the kernel boots, while other
    options are passed along and consumed at different points in the boot process.
    For example, initrd=minirt.gz tells the boot kernel to use the minirt.gz file
    as the initial RAM disk. The BOOT_IMAGE option tells the linux script (which is
    run after the kernel boots) what mode to start.


    > NOTE

    You might notice that an APPEND line near the beginning of the isolinux.cfg file
    is not associated with a LABEL. Options attached to this APPEND keyword are set
    as global defaults. Those options are appended to the KERNEL for any LABEL that
    doesn''t have its own APPEND line. To avoid using the global APPEND options for
    a particular KERNEL line, you must add an APPEND - line after that KERNEL line.'
