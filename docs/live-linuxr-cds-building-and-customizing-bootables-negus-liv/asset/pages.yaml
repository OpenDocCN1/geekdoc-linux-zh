  md: '# CHAPTER 9 Customizing a Security Linux CD


    The software will be immediately available on your live CD to use.


    You might need a variety of drivers and firmware to get certain hardware peripherals
    working properly on your live CD. SLAX comes with a bunch of drivers that might
    not have been included with the distribution but might be legal for you to install
    on your personal live CD:


    From the SLAX modules page, select Drivers. These are some examples of drivers
    you might want to add (depending on your hardware) that are available from the
    modules:


    +   - ATI video drivers—If your video card uses ATI chipsets, you can install
    closed-source, proprietary drivers from the manufacturer that might work better
    for applications that require hardware acceleration than their open-source counterparts.


    +   - NVIDIA drivers—As with ATI video cards, if you have NVIDIA chipsets in your
    video cards, proprietary drivers from NVIDIA will probably work better for you
    than open-source drivers for gaming and other software that performs better with
    hardware acceleration.


    +   - madwif—Several different wireless LAN cards might not work at all in Linux
    without drivers from the madwif project.


    +   - Webcam driver—The drivers in this package can help the limited number of
    Webcams that are supported in Linux to work properly.


    Besides those packages just mentioned, other drivers are available from this page.
    They include modern modem drivers for specific modem types and some firmware packages
    that are needed to get certain wireless cards working properly.


    # SUMMARY


    With dozens of security- and rescue-oriented live Linux CDs available today, choosing
    one for yourself can be done based on the tools that are provided and the Linux
    distribution it is based on. For examples in this chapter, I used the BackTrack
    network security live CD.


    Using BackTrack, you can evaluate literally hundreds of security- and rescue-oriented
    tools to work on Linux systems, networks, and a variety of systems you can reach
    from a network. BackTrack is based on SLAX (which is based on Slackware) and,
    therefore, can use many of the resources available to SLAX (such as extra-ware
    modules).'
