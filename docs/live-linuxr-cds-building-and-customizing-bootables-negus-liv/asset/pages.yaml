  md: '# CHAPTER 3 Customizing a Live CD


    To make more substantial changes to the arrangement of items on your K menu, select
    the Edit K Menu button from the Panels module on the Control Center. From the
    KDE Menu Editor, you can add, remove, and rearrange items that appear on the K
    menu. You can add new items, new submenus, and separator lines. You can also cut
    and paste to rearrange items and change information associated with each item
    (such as name, description, icon, and commands run).


    Here''s a quick procedure for adding a new submenu to the K menu from the Panels
    module, with several items (applications, links), and so on:


    +   1. From the Control Center, select Desktop → Panels, and then select the Menus
    tab.


    +   2. Click the Edit K Menu button. The KDE Menu Editor appears.


    +   3. Click the New Submenu for the new submenu. A New Submenu pop-up window
    appears.


    +   4. Add a name for the new submenu and select OK. A blank form appears.


    +   5. Fill in the name, description, and comments for submenu. You can also select
    the icon to browse for an icon to represent your submenu.


    +   6. With your submenu item highlighted, select New Item to add an application
    to your submenu. A New Item pop-up window appears.


    +   7. Select a name for the new item and click OK. A blank form appears.


    +   8. Fill in a description, comment, and command for the item. You can click
    the folder icon to browse the file system to find your application. If you need
    to, you can have the command run in a terminal window (which you need to do for
    non-GUI commands). You can also select to have the application run as a different
    user.


    +   9. Repeat the previous three steps for each application you want to appear
    under your submenu.


    +   10. When your submenu and items are all entered, click Save to save your changes.


    +   11. Once you get everything working the way you want it, be sure to save your
    persistent desktop to hard disk or USB flash memory (as described later in this
    chapter) so you will have all your settings available the next time you reboot
    your live CD.


    Using the procedure I described, I created a custom submenu called LinuxToys.net.
