- img_proc: true
  md: '# CHAPTER 6 Building a Custom Knoppix CD


    ```

    # mkisofs -R -U -V "My Knoppix File System"

    -publisher "John W. Jones"

    hide-rr-moved cache-inodes no-bak -pad \

    /media/hda1/knnoppix/source/KNOPIX \

    | nice -5 /usr/bin/create_compressed_fs - 65536 > \

    /media/hda1/knnoppix/master/KNOPIX

    ```


    The -R option adds SUP and RR attributes that must have file-system attributes
    that a Linux or UNIX systems expects (long filenames, symbolic links, permission
    bits, and so on). The -U option allows filenames that might include characters
    that violate the ISO 9660 standard (such as leading dots, multiple dots, mixed-case
    files, and so on). The hide-rr-moved option hides the RR Moved directory (if it
    exists) by renaming it to .rr_moved.


    Using the -cache-inodes option saves space on the CD by causing files that are
    hard-linked (multiple names for a single file) to physically appear only once
    on the CD. The no-bak option excludes backup files (ending in .bak # or ~ characters)
    from the CD. The -pad option causes the end of the CD to be padded by 300K (150
    sectors).


    The location of the source directory and make sure it matches where you put your
    source/KNOPIX directory. Likewise, note the location where the image file (KNOPIX)
    will end up (in this case, /media/hda1/knnoppix/master/KNOPIX/KNOPIX).


    The output of mkisofs is piped to the create_compressed_fs command. (That command
    is run with the nice command, which attempts to increase the processor priority
    to -5). The create_compressed_fs command will run for a while to convert the image
    file to a compressed file-system image that the cloop driver can mount and access.
    The block size (65536) is set to a multiple of 512 bytes.


    When this command line run on a 1.7GB source directory structure, the resulting
    KNOPIX image was 627MB (about a 39% compression ratio). With the KNOPIX file inserted
    into your master/KNOPIX directory, you can now take a look at all the files that
    will appear on your CD. Most of these files are associated with how the CD will
    boot up. You can customize those boot files as well.


