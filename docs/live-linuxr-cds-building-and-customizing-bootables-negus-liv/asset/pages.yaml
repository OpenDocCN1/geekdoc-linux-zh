  md: '# CHAPTER 3 Customizing a Live CD


    For example, files in the /etc/sysconfig directory contain settings used when
    Knoppix boots up. The desktop file indicates which desktop environment/window
    manager to use. To change your desktop from KDE to fluxbox, change the first line
    of /etc/sysconfig/desktop to DESKTOP="fluxbox".


    The /etc/sysconfig/knoppix file contains a consolidation of settings relating
    to your display, keyboard, language, and other features. The xserver file identifies
    your X server (Xorg or XFree86) and X module (such as vera). The sound file identifies
    your driver.


    Any system-wide configuration you do set up printers, network connections, Windows
    file sharing (samba), Linux file sharing (NFS), or other features that end in
    the /etc/directory can be saved with the persistent desktop.


    # Locking Down KDE


    If you want to restrict what using your live CD can access from the KDE desktop,
    you can use the Kiosk Admin Tool (kiosktool command) to customize your live CD.
    Using the Kiosk Admin Tool, you can lock down nearly every aspect of the KDE desktop,
    effectively mandating what a user of that desktop can access and change.


    > Kiosk Admin Tool is not included on the Knoppix 5 CD included in the DVD that
    comes with this book. To try out this feature as described, you can use the Knoppix
    5 DVD that you can get in several different ways from the Knoppix.net Web site
    (www.knoppix.net/get.php).


    In the physical world, a kiosk can be a stand-alone booth that incorporates a
    self-service terminal for getting information. By locking down the desktop interface
    (such as KDE) for a general-purpose operating system (such as Knoppix), a computer
    can be like a kiosk to securely provide a contained set of features (such as a
    presentation or information service).


    Some KDE desktops, including the one with Knoppix, come with the Kiosk Admin Tool
    installed. Using it you can create a profile containing the components you want
    the user to see (background, desktop icons, menus, and so on) and rules restricting
    the user''s ability to change those items or access items outside the desktop
    (shells, context menus, and so on). Then you assign profile to one or more users.
    In this example, the profile is owned by the root user and assigned to the knoppix
    user.'
