  md: '# Linux Kernel and Initial RAM Disk


    From a Kppix CD, simply pressing Enter or typing knppix uses the following

    information configured in the isolinux.cfg file:


    ```

    LABEL knppix

    KERNEL linux

    APPEND ramdisk_size=100000 init=/etc/init lang=apm-power-off vga=791

    initrd-minirt.gz nomce quiet BOOT_IMAGE=knppix

    ```


    Based on this label, the boot loader identifies the kernel named linux as

    to one boot and the minirt.gz file as the initial RAM disk (both of which are
    stored

    in the isolinux directory). Other information shown on the APPEND line is passed
    as

    options to the linux kernel to be used later in various ways. Options that the
    user

    might have added to the knppix label at the boot prompt (for example, knppix

    ndom to turn off DMA support on local drives) are added to the end of the

    appended options.


    One of the first things the boot image (containing the Linux kernel) does

    when it starts up unzip (the gunzip utility) and mount the initial RAM disk

    (minirt.gz). minirt.gz is the root file system that the boot image uses; it con-

    the minimum amount of software needed to set up the full Knppix system.

    Most of the files the ultimate Knppix system are contained in the KNOP-\PIX image
    file in the KNOPPPX/ directory on the CD.


    With the boot image running the Knppix kernel and the minimum file

    system mounted (minirt.gz), the linuxrc script in the root directory can kick
    in.

    The linuxrc script relies on a couple of nonstandard directories it uses during

    setup that are contained in the minirt root-mounted file system: /modules and

    static:


    +   -modules—The /modules directory contains the loadable modules and

    related commands (insmod and rmod) for working with these modules. For

    example, in /modules, the cloop modules are needed to uncompress files

    from the KNPOSIX image on the fly. The unionfs module is there to create

    merged UnionFS file systems (so the end user can save files to a directory

    that are otherwise read-only). A scsi directory is also located in the /modules

    directory, if the CD drive is a SCSI device in a module to

    access it.


    +   -static—The /static directory contains the ash shell required for the shell

    environment that is needed at this point.'
