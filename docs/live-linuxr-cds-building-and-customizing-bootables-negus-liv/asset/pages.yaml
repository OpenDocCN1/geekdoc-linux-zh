  md: '# Creating a Custom Theme


    If you are using a live CD as a personal desktop, you might want to select backgrounds,
    themes, colors, fonts, and other graphical elements to reflect your taste. If
    you want to create a live CD to represent a business or product, you might want
    those elements to enhance your presentation.


    KDE lets you create entire desktop themes or select individual elements on an
    existing theme. The following list provides a quick reminder of theme-related
    features of the KDE desktop that you can change by selecting Appearance & Themes
    from the KDE Control Center:


    +   **Theme Manager**—Start by selecting a theme that is close to one that you
    want, or select New Theme to create your own. The new theme goes into a file in
    the `.kde/share/apps/kthememanager/themes` directory in your home directory. For
    example, I created a theme named LinuxToys. Next, you can start modifying the
    elements of your theme (as described).


    +   **Background**—Add an image you want to use for your background (to the `/home/knopp/.kde/share/wallpapers`).
    Select New Wallpaper to find images from the Internet. To rotate the backgrounds
    in a slide show from the wallpapers directory (or another directory you choose),
    select Slide and choose Setup to adjust how often the background changes.


    +   **Colors**—Select from a variety of color schemes to change the colors used
    in window borders, buttons, links, menus, and other desktop components. You can
    create and use your own color scheme, if you like. To have the scheme available,
    place it in the `.kde/share/apps/kisplay/color-scheme` directory (or just save
    one by selecting Save after you select the colors you like from the Widget Box
    box).


    +   **Styles**—Select a style for how the buttons, tabs, and various widgets are
    displayed on the KDE desktop.


    +   **Icons**—Select from several different sets of icons to use on the desktop
    by selecting a theme. Try Kids for a fun icon theme; Industrial or KDE-Classic
    for a clean, professional look; or Slick Icons for a more artistic look.


    +   **Fonts**—Select individual fonts for different parts of the desktop.


    +   **Screen Saver**—The screen saver is off by default in Knopp. However, if
    you want to enable it, you can set when the screen saver comes on (after how many
    minutes) and whether a password is required. After that, select from more than
    100 screen savers to use for your KDE desktop.'
