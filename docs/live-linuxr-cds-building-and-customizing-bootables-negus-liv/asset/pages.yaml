    Before you get to boot options, if you try to boot a live CD, DVD, or USB drive,
    your computer ignores it completely and boots straight to hard disk, or you might
    need to change the system BIOS. As the system is first booting, go to the BIOS
    screen (by pressing a function key, the Del key, or any other key as instructed
    on the screen). From the BIOS, look for an option that lets you choose the boot
    order so your CD, DVD, or USB drive comes before your hard disk. Save the changes
    and continue to boot.


    If you see the live CD or DVD splash screen or boot prompt, you can proceed. From
    the boot prompt for any live Linux CD, you can pass options to the kernel to tell
    it how to handle certain types of hardware, or to ignore certain hardware as you
    boot up.


    The first thing you want to you about is that you have only a few seconds to pause
    the boot process before it continues to boot the default system. From an Isolinux
    boot screen, typing any letter keeps the boot process from proceeding. From a
    GRUB boot screen, use the arrow keys to move to the CD image you want to boot,
    and press the letter e to be able to add options to the selected kernel line.


    Different live CDs might have different boot options. You enter boot options by
    entering the label (such as knoptix or hlinux), followed by one or more options.
    For example, to run Knoptix using US English language and the fluxbox desktop,
    you type the following at the boot prompt:


    ```

    boot: knoptix lang=en desktop=fluxbox

