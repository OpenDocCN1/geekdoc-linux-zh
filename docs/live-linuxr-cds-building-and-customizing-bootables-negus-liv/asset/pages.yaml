  md: '# Customizing a Presentation

    Live Linux CD


    If you are creating a live Linux CD for the express purpose of making a presentation,
    showing your photos, playing a video, why not have that CD boot directly to applications
    that play content? You can create a live CD that offers one or more presentations
    that you, a friend, or a coworker can select from the boot prompt. offering your
    presentation in this way, you can not only go directly to your content, but you
    can also play that content with the exact players and options you want.


    Because I could not find an existing live Linux CD that boots directly to the
    way I wanted, I created my own custom CD. I began with the latest version of Damn
    Small Linux and remaster using a procedure similar to the Knoppix remasting procedure
    in Chapter 6, “Building a Custom Knoppix Live CD.


    For demonstration purposes in this book, I created a live CD called PuppetIX (don''t
    look for it at distrowatch.com), which is designed to promote a puppet workshop
    and parade. To get a feel for how this type of CD might ultimately work, I have
    also included content so you can see the viewers in action. The boot screen of
    this live CD, you can select to launch the following components:


    +   - Slide Show (GView)—A slideshow of images from puppet parades are displayed
    in full-screen mode using GView (gview command).

    - Presentation (Openoffice.org Imp)—The presentation, displayed as an OpenOffice.org
    file, describes the puppet workshop and parade. It was designed for live presentations
    at community groups and schools.


    You can add your presentations or slideshows that can be launched from the boot
    loader. For this particular project, I chose to use the GRUB boot loader so I
    could take advantage of the menu interface. I added options to different boot
    labels to indicate presentation to launch.'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'This live CD is used to launch particular content (digital images and an Impress
    presentation) (GQview and OpenOffice.org Impress), but with some simple remastering,
    you could remaster this live CD to do the following:


    +   **Launch any desktop application**—By adding your label to the boot loader
    and identifying the command to run on that label, you can launch any application
    that you want to run on the desktop. Using the Damn Small MySQL Extension Tool,
    you can choose from dozens of applications that are already packaged to run on
    Damn Small Linux.


    +   **Play any content you like**—By adding your own content to the live CD, you
    can be sure that the content will run as you expect. You can even add other types
    of content, such as music or videos. As long as you can find a player to play
    it that runs in Linux, you can launch your content directly from the boot prompt
    using this CD.


