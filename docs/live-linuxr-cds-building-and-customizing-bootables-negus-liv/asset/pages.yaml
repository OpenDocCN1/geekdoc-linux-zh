    If you have questions about developing themes, refer to the Dev KDE Wiki (http://wiki.kde.org/tiki-index.php?page_ref_id=18).


    # Making Custom Menus


    Live CDs that offer chests of particular types of applications typically add custom
    menus to the K menu for selecting those applications. To simply change the appearance
    of the K menu, use the Control Panel. To add and remove menus items from a K menu,
    you use the menu editor.


    To begin changing the appearance of the K menu, select Desktop → Panels from the
    Control Center. Here are some of the features you can then change on the K menu:


    +   **Menu item format**—A name and short description (in parentheses) appear
    for each menu item by default. Instead, you can choose to show the name only,
    description only, or description followed by name.


    +   **Optional menu**—You can add optional menus under the Actions section of
    the K menu. Only Bookmarks and Quick Browser are added by default. You can also
    add menu items to be quickly access printers (Print System), configuration settings
    (Settings), file and Web searches (Find), and network resources (Network Folders).


    +   **QuickStart menu items**—At the top of the K menu, applications that were
    started most often appear under the Most Used Applications heading. Instead, you
    can choose to have the most recently used applications appear on the K menu. You
    can also change the number of applications shown under that heading from the five
    applications.'
