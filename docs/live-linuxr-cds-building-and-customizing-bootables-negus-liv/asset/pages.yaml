  md: '# CHAPTER 12 Customizing a Multimedia Live CD


    # Understanding Dynebolic Dynebolic


    The Dynebolic live CD was designed to run lean so that most resources can be directed
    toward running powerful multimedia applications. Dynebolic boots directly (no
    login required) to a WindowMaker window manager without many frills. Emphasis
    is on ease of use, so access to available storage device and root privilege are
    immediately opened.


    The WindowMaker window manager (www.windowmaker.info) incorporates small applications
    called docapps into its interface instead of end-to-end panels. For Dynebolic,
    docks are added to the desktop to let you immediately open folders on different
    storage locations using the fox file manager. Locations include your home folder,
    hard-disk partitions, network shared folders, and any removable media (CDs, DVDs,
    floppy drives, and USB flash drives).


    Hard-disk and removable storage devices that have read/write capabilities (as
    USB flash drives) When you open a terminal or storage device from the desktop,
    you do so as root user with the capability to effectively change any file or directory
    on the computer. Again, this reflects Dynebolic''s intent to be as easy and open
    as possible.


    The menus on the WindowMaker desktop are where you see what there is really to
    do with Dynebolic. Right-click the desktop to see the dyne:II menu, which includes
    categories of applications that include video, audio, image, text, Nets, devel,
    utils, and desktop applications. There are also selections for opening a terminal
    window (XTerm) and configuration window (Configure).


    Figure 12-3 shows the dyne:II menu for selecting multimedia applications to run,
    as well as storage media. Applications for configuring language, networks, modems,
    printers, screen resolution, sound cards, and WindowMaker itself are shown in
    the Configure folder.


    To support lots of working at the same time, the Dynebolic WindowMaker desktop
    is configured with six virtual desktops. Select the dock from the upperleft corner
    of the screen to switch desktops.


    Dynebolic also enables you to save the changes you made in a way that allows you
    to restore those later. The Nest (which you can create by selecting the Nest icon
    from the Configure window) lets you save your desktop settings and to an archive
    on hard disk or USB key so that you can restore those later. (Chapter 2, "Playing
    with Live CDs," contains descriptions for setting up a Nest).


    With Dynebolic booted, you have a lean desktop, access to all locally connected
    storage media, and basic tools for configuring the desktop and saving data going
    forward. Now for the fun part: the multimedia applications.'
