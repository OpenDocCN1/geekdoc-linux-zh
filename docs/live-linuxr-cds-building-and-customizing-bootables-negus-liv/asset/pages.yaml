    “Creating Different Boot Labels,” can be used to boot Knoppix in text mode (knoppix-txt),
    debug mode (debug), or with special video settings (fb1280x1024). A label also
    can be used to run a different allant (such as the memtest label, which runs the
    memtest command for checking your system RAM).


    +   - Capability to run from a serial port—In most cases these days, you would
    expect a computer running a live CD to have a monitor available that supports
    VGA. However, Isolinus can also boot on a computer that uses a dumb terminal that
    connects to a serial port as its console instead of a graphics display.


    SERIAL 0


    By default, parameters for the serial port are hard-coded to 8 bits, 1 stop bit,
    and no parity. The connection defaults to a 9600bps baud rate and no flow control.
    However, if you want to change baud rate and flow control, you can add them as
    options to the SERIAL line. To get the flow-control features you need to combine
    the bits associated with those features. Table 5-1 shows the hex values for flow-control
    features.


    The Isolinus recommends several flow-control values you might want to use, other
    than the default (0) no flow control. For null modem detection, use 0x033. Use
    0x02 for DTR/DSR flow control or 0x08 for DTR/DCD flow control. For RTS/CTS flow
    control, you can use 0x013 or 0x813 (with the latter adding modem input).


    For example, you might want to change the baud rate to 14400bps and the flow control
    to 0xab3. For RS-232 compliance (marked with asterisks in Table 5-1), the SERIAL
    line (as the first line in your isolinux.cfg file) would appear as:


    SERIAL 0 14400 0xab3


