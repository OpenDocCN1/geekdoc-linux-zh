  md: '# CHAPTER 7 Building a Basic Fedora Live CD


    In your kickstart file, replace the string after rootpw

    --iscripted with the string produced by the openssl command. The password you
    entered to get this result is what you use to log in root to your live CD.


    firewall


    Setting firewall to --enable turns on the iptables firewall but doesn''t allow
    any incoming connections unless you specifically enable ports to allow them. You
    can allow individual services (--ssh, --telnet, --smtp, --http, or --ftp) or allow
    access to specific port numbers

    --port=XXX (where you replace XXX with a port number on which you can allow incoming
    connections). Turn off iptables service completely (effectively blocking all incoming
    requests) by setting --disable for the firewall option.


    selinux


    Setting this value to --disabled will disable the Security Enhanced Linux feature.


    authconfig


    Sets how authentication is done. The --enablemd5 option expects you to use MD5
    encrypted user passwords. The --enableshadow option allows passwords to be stored
    in the /etc/passwd file instead of Other methods, such as NIS (--enablenis), LDAP
    (--enableldap), Kerberos 5 (--enablekrb5), Hesiod (--enablehesiod), or SMB server
    --can be used instead.


    timezone


    Sets the default time zone used for the live CD. Use the system-config-date utility
    to see a list of available time zones.


    bootloader


    Because Kadishi uses isolux to boot the live CD, you don''t need a GRUB or LILO
    bootloader on your live CD. The bootloader is therefore set to the value of --location=none.


    %packages


    After the %packages directive, you add any software packages you would like to
    add beyond the minimal set of packages. The minimal package set doesn''t include
    a desktop interface and includes very few server packages. (Those packages shown
    in the minimal example, preceded by a hyphen, are actually those are excluded
    from the normal hard-disk minimal install.) See the sidebar “Choosing Software
    Packages for Your Fedora Live CD” for further information on adding packages either
    from the Fedora Core distribution or outside of it.'
