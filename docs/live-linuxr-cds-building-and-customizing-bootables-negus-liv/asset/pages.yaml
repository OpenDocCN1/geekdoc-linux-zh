  md: 'are the Package Manager window (for installing packages from software repositories)
    and the Package Updater window (for updating existing packages).


    > NOTE

    Keep in mind that, even though different software distributions use the same packaging
    tools, each draw on software repositories that are specific to that distribution.
    These days, distributions such as Fedora and Debian are set up automatically to
