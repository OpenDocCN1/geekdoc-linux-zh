  md: '# Customizing a Live CD


    If you find that you love your live Linux CD, you''ll probably want to use it
    more than once. The problem is that as soon as you reboot the live CD, you lose
    all custom settings, data, and added applications. The solution is to find a way
    to save the data you have changed or adding during a live CD session so that it
    is available the next time you reboot that live CD.


    Remastering (essentially modifying and remaking an existing CD) and starting from
    scratch (essentially doing a fresh Linux install that results in a new ISO image)
    are two ways to get exactly what you want on your live CD. However, require some
    time and a fair amount of Linux expertise (see Chapters 6, “Building a Custom
    Knoppix Live CD,” through 8, “Building a Basic Gentoo Live CD”). Also, if you
    are working with a read-only medium, you can''t add software to it as you go along.


    Different live CDs offer different approaches to letting you save your settings,
    data files, and applications so they can be used the next time you reboot the
    live CD. Using those features requires little or no special expertise. And by
    having your data returned to the same places in the file system (such as /home
    or /etc), your settings will be automatically to keep your desktop look and feel
    or incorporate the system settings you need (network addresses, printers, exported
    file systems, and so on).


    This chapter begins covering some great ways of customizing your live CD systems.
    Some of these features are ones you can do on most any Linux system (such as change
    the desktop look and feel); others offer features that work well on a live CD
    (such as setting up the live CD to run in kiosk mode).


    Next, the chapter tells you how to set up your live CD so that your data can be
    saved and reused from a USB flash memory drive, hard-disk partition, floppy disk,'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'or writable medium. This feature is sometimes referred to as a persistent desktop.
    The chapter also tells how to put the operating system itself on a rewriteable
    USB flash drive so that the operating system and data don''t have to be carried
    around separately.


    Knoppix is used primarily here to provide examples of how to customize your live
    CD and configure to save those customizations across reboots. Because many other
    live Linux distributions are based on Knoppix, many of the procedures described
    here work on those live CDs as well. After that, the chapter includes information
    on how other live CDs use different means of saving your data across reboots.


    # CUSTOMIZING A LIVE CD


    This section gives you ideas on how to customize your live CD. These techniques
    for changing the look, feel, and content of a live CD (without the remastering)
    let you really make a live CD your own. Knoppix provides two primary ways of saving
    your custom settings: persistent desktop and backup archive. Before you start
    configuring the settings you want to save, you can be aware of these two approaches:


    +   - Persistent desktop—With this approach, you set up a writeable file-system
    image that is stored on a writeable USB flash memory drive or a hard disk. You
    should set this up before making customizations because you need to reboot for
    this feature to take effect. After that, all custom settings are stored in that
    file-system image as they are.

    - Backup archive—With this approach, when you have your settings and the files
    you want to save, you can back them up to a compressed archive (in zip2 and tar
    formats) that is stored on any writeable medium (hard disk, USB flash drive, or
    zip drive). You can save only files in your home directory and settings in the
    /etc directory. However, you can save this archive after you make your settings
    because it backs them up to a single file.


    Refer to the “Keeping Your Customized Files and Settings” section later in this
    chapter to learn ways of saving your customizations. That section describes both
    the persistent desktop and backup archive approaches.


    For several reasons, this section focuses on KDE as the desktop environment to
    demonstrate customization techniques. One reason for using KDE is that it is the
    default desktop environment for Knoppix. Another is that it is loaded with bells
    and'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# CHAPTER 3 Customizing a Live CD


    whistles that GNOME (which is a simpler, business-oriented desktop) and other
    window managers just don''t have.


    If you want a custom server-oriented live CD, the section “Making Server Customizations”
    describes how you can add data and custom settings to a live CD. Without having
    to remaster, you can have a live CD that lets you offer a variety of services
    and data from your live CD.


    # Making Desktop Customizations


    KDE has a wealth of features for customizing the look and feel of your desktop
    environment. You can store the settings you change in your home directory. Live
    CDs such as Knoppix and Damn Small Linux enable you to back up those desktop settings
    with just a few mouse clicks.


    The examples in this section use the KDE desktop (3.5.2) included with Knoppix
    5, which comes on the DVD with this start. By booting up the DVD and typing the
    following at the boot prompt:


    ```

    knoppix

    ```


    When Knoppix boots up, open the KDE Control Center. To do that from the K menu,
    select Control Center. Figure 3-1 shows an example of the KDE Control Center,
    with the Appearance & Themes selected.


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_95_0.png)


    FIGURE 3-1 Change KDE desktop settings through the Control Center.'
