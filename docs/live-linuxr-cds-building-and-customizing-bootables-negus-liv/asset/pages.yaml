  md: '# Live Linux CDs


    # NOTE


    Using the standard Knoppix distribution offers the best opportunity to use the
    latest Knoppix technology. Also, there is more risk of getting broken or even
    malicious software if you just grab some random distribution off the Internet.
    For those reasons, the procedure in this chapter uses the standard Knoppix distribution
    for illustration.


    +   * **Server**—Lampix (http://lamprix.tinowagner.com) is primarily a Web server
    CD. LiveOIO (www.txoutome.org) is a CD to demo Zope Web server and the OIO on
    Zope medical application.

    * **Small**—Damn Small Linux (www.damnsmalllinux.org) and Feather Linux (http://featherlinux.berlio.de)
    live CDs are good to start with if you want a mini live CD that starts at about
    50MB. (Damn Small Linux offers some of its customization tools.) An example of
    a remastered Damn Small Linux distribution is described in Chapter 10, "Customizing
    a Presentation Live CD."

    * **Security/recovery**—Because rescue, recovery, and security applications are
    natural tools for live CDs, several Knoppix-based distributions focus on such
    tools. Popular security live CDs include the Auditor security collection (www.remote-exploit.org)
    and Knoppix STD (www.knoppix-std.org). You can find a list of security live CDs
    at www.knoppix.net/wiki/Security_Live_CD.


    For a long list of Knoppix customizations, refer to the Knoppix Customizations
    page: www.knoppix.net/wiki/Knoppix_Customizations. To find out how to get the
    standard Knoppix distribution used in examples in this chapter, refer to www.knoppix.net/get.php.


    # Setting Up The Build Machine


    If you have a computer with a Linux system installed on your hard disk, you might
    already have the configuration you need to remaster your own custom Knoppix live
    CD. To effectively remaster Knoppix, you need good chunks of RAM, swap, and hard
    disk space. The space you need varies, depending on whether you are creating a
    CD or a DVD. You also need a connection to the Internet:'
