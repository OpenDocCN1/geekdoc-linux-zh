  md: '# CHAPTER 14 Customizing a Cluster Live Linux CD


    If this behavior annoys you as much as it does me, you can just right-click the
    taskbar and select Configure Panel. Then you will see the Configure KDE dialog,
    and on the left side you will see Hiding. Click that and deselect Hide Automically
    under Hide Mode.


    > NOTE

    ParallelKnoppix assumes you''ll be able to pull an IP address via DHCP. If you''re
    not running DHCP on your network, you can open a terminal and use su - switch
    to root. ParallelKnoppix has no root password, by default.


    Then run the following to set up your IP address:


    ```

    # ifconfig eth0 10.0.0.10 netmask 255.0.0.0 gw 10.0.0.1

    ```


    Of course, you''ll want to change the values to reflect your network setup.


    # Setting Up Swap Space


    If you''re booting PK on a Linux machine, it can find and use the swap partition
    that''s already available on the machine.


    However, if you''re using Windows, you won''t have a swap file that PK can use
    in the long run. If the system has a FAT file system, you can mount it and create
    a swapfile using dd. For example, to add a swap name swapfile.swp to a FAT partition
    located at /media/hda1, you could type the following:


    ```

    # dd if=/dev/zero of=/media/hda1/swapfile.swp bs=1024 count=1024k

    ```


    This will give you size; adjust to reduce or increase the size of the swap. Note
    that the general rule of thumb is to have twice the amount of system RAM—at least,
    that used to be the case before 1GB and of of RAM became common. If you''re using
    swap enough to need more than 1GB of swap, you probably need more RAM than a bigger
    swapfile. Remember, accessing swap is much, slower than accessing RAM.


    Now you need to format the file as swap and tell the system to use it:


    ```

    # cd /media/hda1

    # mkswap swapfile.swp

    # swapon swapfile.swp

    ```'
