  md: '# Live Linux CDs


    To try a live CD that offers a GNOME desktop, you can get the GNOME version of
    Knopix Gnoppix (www.gnnoppix.org). Another live CD that offers the GNOME interface
    is the GNOME LiveCD, which comes directly from the GNOME project (http://live.linux.org).


    For a more lightweight desktop system (fitting on a medium of less than 50MB),
    try Small Linux (www.damnsmallinux.org). Other live CDs in the lightweight desktop
    category include Puppy Linux (www.puppyl.com) and Feather Linux (http://featherlinux.berlio.de).
    These mini desktop live CDs usually work better on older machines that have a
    smaller amount of RAM and slower CPU.


    # Gaming Live CDs


    Hundreds of open-source games are available today. Demo versions of commercial
    games for Linux can be redistributed. Live CDs and DVDs tuned specifically for
    gaming can make your transition to Linux much easier than if you try to do a fresh
    Linux install and put together a gaming system.


    The PCLOS SuperGame live DVD, for example, is based on the PCLinUX distribution.
    It contains about 3.6GB of gaming software, including demos of popular games like
    Wesnoth, Quake 4, and America''s Army. It also includes a bunch of arcade games,
    card games, and strategy games. The Live Linux Project live CD (http://tuggames.altervista.org)
    is a nearly 700MB live CD containing hundreds of free and open source games.


    SuperGame and other live CD/DVDs differ from other live systems because they can
    be optimized for gaming, SuperGame-1 includes a kernel that is tuned for gaming,
    a special desktop theme, and drivers for video cards capable of doing 3D video
    (NVIDIA video drivers are included, and a version of the distro is being developed
    with ATI drivers as well.)


    You can read more about SuperGame at the PCLinuxOS forum: www.plinuxos.com/forum/index.php?board=31.0.
    Figure 1-2 shows an example of the PCLlinuxOS SuperGame desktop.


    Another example of a gaming live CD is Games Knoppix (http://games-knoppix.unix.uni-kl.de);
    both German and English versions are available. Features in Games Knoppix include
    hardware acceleration that is by default and NVIDIA video drivers.'
