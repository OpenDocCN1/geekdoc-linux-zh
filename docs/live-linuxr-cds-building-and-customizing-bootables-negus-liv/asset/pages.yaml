    # BUILDING A LIVE LINUX CD


    You might be perfectly happy using the exact versions of a bootable live CD you
    download from the Internet or use from the DVD that comes with this book. However,
    to make the CD fit your needs more specifically, you will almost surely want to
    add more software or data to the CD or change the look and how well it feel like
    it suits your needs.


    You can make changes to a live CD so that it includes (and keeps) the personal
    data and applications you want to it. In this book, we describe several different
    ways you can go about changing, or even starting from scratch, so that you end
    up with the exact live CD that suits your needs. These basic approaches to producing
    the live CD that you are described in this book:


    +   - Customization—You don''t need to know about the inner workings of Linux
    or live CDs to be able to change and save customized settings for live Linux distributions
    such as Knoppix or Damn Small Linux. Using persistent desktop features in those
    two distributions, you can save your desktop settings,'
