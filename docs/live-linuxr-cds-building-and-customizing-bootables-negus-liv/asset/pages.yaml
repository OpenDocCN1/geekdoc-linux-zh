  md: '# Customizing a Cluster Live Linux CD


    Imagine that you have an office full of computers that are used only from about
    9 a.m. to 5 p.m. That’s a lot of computer power going to waste, and there’s an
    easy way to harness the horsepower of those computers the rest of the day using
    live CD clustering distributions.


    If you’re looking for a way to create a quick-and-dirty cluster, a live CD is
    definitely the way to go. You can pop a CD into each machine’s drive and reboot,
    and use it for a few hours (or a few days), and make the most of a long holiday
    weekend! When your computing task is finished, reboot the machine, pop out the
    CD, and you’ve got the PC’s original operating system available, untouched by
    the cluster operating system.


    For really hardcore computing tasks, you probably don’t want to use a cluster
    live CD; if you’re doing work for the Department of Defense doing battlefield
    simulations or something equally computationally intensive (not to mention high
    budget), you’ll probably want to go ahead and install the operating system directly
    to the hard drive. In fact, in that sort of scenario, you’d probably be working
    with a vendor or IT department that would supply its own customized version of
    Linux.


    This chapter discusses basic clustering concepts in general and looks at the options
    for live CD cluster distributions.


    # WHAT’S a CLUSTER?


    Let’s start this chapter by discussing what a cluster is and what you can accomplish
    with a live CD distro to be used for creating a cluster of computers.'
  merge: -1
  pgno: 379
- img_proc: true
  md: '# Live Linux CDs


    The simplest definition of a cluster is two or more computers that are connected
    and that work together. Clustering is used for many different reasons. A cluster
    can provide high availability, load balancing, high-performance computing, and
    utility or "grid" computing facilities. Note that these functions are not exclusive,
    so a cluster can provide high performance and high availability, or high availability
    and load balancing.


    # High Availability (HA)


    HA computing is used to provide redundancy. A single computer represents a single
    point of failure. Even if you have a server that has redundant power supplies,
    a RAID array with hot-swappable drives, and all the other goodies, it represents
    a single point of failure (like if a junior admin accidentally disconnects the
    wrong network cable..)


    An cluster can be as small as two nodes, or it can be much larger. One example
    might be a company that has two firewall systems—one that as the firewall, and
    another with the same configuration that stands by and listens for a “heartbeat”
    from the other server. If the first firewall fails, the second system kicks in
    and provides the service until the master firewall comes back up.


    Another example is an e-commerce company that has a master and slave MySQL server,
    where the slave is configured to mirror the first MySQL database and take over
    as the master MySQL server if the master fails.


    # Load Balancing


    Sometimes a task is too difficult for one server to take on, no matter how much
    horsepower that server has. Consider a popular site such as Slashdot, the traffic
    it handles is far too much to be handled by a single server.


    A load-balancing cluster spreads the computing load across two or more computers.
    Sites such as Slashdot have several Web nodes and database nodes to handle. Usually
    a load-balanced cluster is also an HA cluster—that is, if one node in the cluster
    fails, the application that the cluster provides does not fail. It might take
    a performance hit, but it won''t fail when one node drops out.


    # High-Performance Computing (HPC)


    If you follow Linux, you''re probably well aware of the Top 500 list of supercomputing
    systems and the fact that more than two-thirds of the systems on the Top 500 run
    some version of Linux. These are systems that are built for raw computing'
  merge: -1
  pgno: 380
- img_proc: true
  md: '# CHAPTER 14 Customizing a Cluster Live Linux CD


    performance to run simulations and other compute-intensive applications that simply
    wouldn''t be practical to run on a single computer.


    For example, oil companies use HPCs to analyze geographical data to try to determine
    where to drill for oil. HPCs are also used extensively for biological research
    and for rendering computer-generated effects for movies. If you''ve seen Monsters
    Inc. or Toy Story, you''ve seen what HPCs can do for the world of entertainment.


    # Grid Computing


    Grid computing, also called “utility” computing, is similar to HPC and load balancing,
    but the difference is that grid computing often makes us of nondicated machines.
    For instance, the SETI@home project uses a client on the computers of volunteers
    to search radio transmissions for signs of intelligent life in the universe. (We
    ruled out Washington D.C., and have the rest of the universe to search!)


    Now that we have our terminology straight, it''s time to look at ParallelKnoppix.


    # ParallelKnoppix


    ParallelKnoppix, or PK, is a modified Knoppix live CD for use in creating HPC
    clusters. In this section, we look at how to start up PK on multiple nodes to
    run a cluster, and how to customize PK to add or remove applications. We also
    review some of the applications present on the live CD and when you might want
    to use PK.


    # Starting ParallelKnoppix


    ParallelKnoppix is contained on the DVD that comes with this book. Refer to Appendix
    A, “On the DVD,” to learn how to get and boot ParallelKnoppix. After it''s booted,
    ParallelKnoppix appears as shown in Figure 14-1.


    In Figure 14-1, you can see the PK boot screen. To start PK, just press Enter,
    unless you need to pass boot options to the kernel to get it. For example, you
    might want to pass acpi=no argument to the kernel if you have had problems getting
    PK (or other live CDs) to boot.


    PK can also be used to memtest to check the system memory. This is a good idea
    if you have any problems with the machine that you can''t track down, such as
    programs crashing for no apparent reason.


    After ParallelKnoppix has started, you might notice that it seems to be missing
    the menu bar. Actually, ParallelKnoppix has a taskbar, but it''s hidden. Move
    the mouse to the bottom of the screen, and you''ll see the taskbar after it unides.
    In Figure 14-2, you can see the KDE taskbar, and PK''s documentation in Konqueror.'
