    # BURN THE IMAGE TO CD OR DVD


    When you have created the ISO image, you can test the image using qemu or burn
    that image to a CD, DVD, or other bootable medium (such as a USB flash drive).
    For Fedora, the qemu package is included with Fedora Extras. With, an Internet
    connection, you should be able to install the qemu package by simply typing the
    following root user:


    ```

    # yum install qemu

    ```


    If you used the same locations as shown in the procedure, the ISO image will be
    FC6-live.iso in your home directory. Here is an example of a qemu command line
    for testing Fedora live CD iso:


    ```

    # qemu -cdrom ~/FC6-live.iso -boot d -m 768

    ```


    In this example, qemu boots the FC6-live.iso so that it appears in a window on
    the desktop. The -cdrom option tells qemu that the file is a CD-ROM image. The
    -boot d option indicates that the image is booted as an El Torito CD. The -m option
    in this, tells qemu to use 768MB of virtual RAM to boot the live CD (you should
    use as much as you have available).


    The qemu command and the process of burning ISO images are discussed in further
    detail in Appendix B, "Building, Testing, and Burning ISOs."'
