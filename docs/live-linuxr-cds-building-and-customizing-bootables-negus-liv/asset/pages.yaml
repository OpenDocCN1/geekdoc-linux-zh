    # Fedora-Based Live CDs


    Fedora Core (www.fedaproject.org) is the free, community-oriented Linux system
    that is sponsored by Red Hat, Inc. Projects under the Fedora umbrella include
    Fedora Extras (repositories of software packages outside the scope of Fedora Core),
    Ambassadors & Marketing (to spread the word about Fedora), Documentation, and
    Kadiski. The Kadiski project is where the tools are created to build live CDs
    from Fedora.


    The Fedora project comes from the legacy of Red Hat Linux, a general-purpose Linux
    operating system designed to include a range of desktop and server features that
    scale well from home and small-office computing up to enterprise-level installations.
    When Red Hat, Inc., focused its for-profit Linux system-development efforts on
    Red Hat Enterprise Linux, the Fedora Project was created to allow Red Hat to still
    contribute to a Linux system that could be freely distributed.'
