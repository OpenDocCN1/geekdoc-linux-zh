  md: '# Live Linux CDs


    Although knoppix is the default label to use as the boot prompt, Knoppies has
    other labels available. The expert label lets you interactively configure hardware
    during boot-up. The debug label results in more messages when Knoppies boots.
    The failsafe label boots with almost no hardware. Other frame buffer lets the
    video to display different resolutions: fb800x600, fb1024x768, and fb1280x1024.


    Table 2-2 contains a list of boot options that are available with Knoppies. Most
    of these options are listed in the knoppix-cheatcodes.txt file on any Knoppies
    CD. Many of them also appear when you press F2 and F3 and the Knoppies boot prompt.


    Other boot options that are not listed here can be used to provide special features
    for running Knoppies. They include options for having a persistent desktop, saving
    configuration settings, and running Knoppies from RAM or hard disk. Chapter 3
    covers the options you can create and use a persistent desktop.


    The feature for running a Knoppies live entirely from RAM requires a simple boot
    options called toram. If you have at least 1GB of RAM available, you can run your
    Knoppies live CD from RAM by typing the following at the boot prompt:


    boot: knoppix toram


    Booting Knoppies with the toram option can take longer to boot because the entire
    image must be loaded into RAM. However, performance of the live CD should be much
    improved over running from the CD or DVD. Also, you can then pop out the CD or
    DVD and use the drive for other purposes.


    # SUMMARY


    Because live Linux CDs are made to run from read-only media, running a live CD
    has some differences from running Linux from a hard disk. Developers of live CDs
    have gotten around problems such as slower performance by allowing the system
    to run from RAM. They have gotten around the read-only issue by allowing you to
    save data to memory. Also, by implementing features as persistent desktops and
    notes, the data doesn''t disappear when you reboot.


    This chapter featured several different types of live CD. Knoppies is featured
    as the most popular desktop CD. Games Knoppies contains a large number of games.
    BackTrack contains a slew of security-related applications. Exploring how these
    and other live CDs work should give you ideas about building your own live Linux
    CDs.'
