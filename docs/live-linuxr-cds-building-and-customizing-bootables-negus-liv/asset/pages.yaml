    # TESTING AN ISO IMAGE WITH QEMU


    By emulating a PC processor and system components, the QEMU processor emulator-

    t (http://fabric.bellar.free.fr/qemu) can boot up disk images so that you can

    work with an early bootable operating system on a window on the Linux desktop.'
