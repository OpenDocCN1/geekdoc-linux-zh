- img_proc: true
  md: 'The packaging system for Gentoo is called Portage and is based on the BSD ports
    system. Software management is done from the list of more than 10,000 packages
    that make up what is referred to as the portage tree. Using the portage tree and
    the emerge command, you can launch commands that request selected software packages
    be downloaded, compiled, and installed, while resolving any software dependencies
    along the way. (Be careful, though, because a single emerge command can result
    in hours of downloading and compiling.)


