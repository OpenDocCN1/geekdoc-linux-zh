  md: '# CHAPTER 4 Understanding How Live Linux CDs Work


    to be set that are used later in the linuxrc script. Many of the values consumed
    here turn off features (nosci, nosi, or nofirewire, for example) or set modes
    of operation (such as debug or expert modes).


    +   - **Sets the location of KNOPPIX—**The KNOPPIX_DIR variable sets the directory
    containing the KNOPPIX image file (the KNOPPIX directory, default). The KNOPPIX_NAME
    variable sets the name of the Knopix archive (KNOPPIX, by default). This image
    contains a compressed archive of most of the file system (file, directories, applications,
    settings) used to run Knopix. As a result, the Knopix image is located at /KNOPPIX/KNOPPIX
    from the root of the CD''s file system.


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_141_0.png)


    > NOTE

    If you ever set up a live DVD to multiple versions (or derivatives of) Knopix,
    changing the value of KNOPPIX_DIR in the linuxrc script for the initial RAM disk
    of each version can allow multiple Knopix distributions to coexist (and bootable)
    from the same disk. For example, one distribution could use /KNOPPIX/a as the
    location of the KNOPPIX file-image system. Another might use /KNOPPIX/b, and so
    on. If you name the initial RAM disks differently (minrta.gz, minirtb.gz, and
    so on), different labels can point to different versions.


    +   - **Runs in different modes—**If debug was set as a boot option, linuxrc sets
    a special shell to start up the live CD in debug mode. If expert mode was set
    as a boot option, the person running the live CD is asked whether they want to
    install additional modules from a floppy disk.


    +   - **Probes and configures devices—**The linuxrc script checks for PCI devices
    (/proc/pci) and searches for output for SCSI devices that might require modules
    to use. It also checks and tries to install modules for any IDE read devices,
    USB devices, and Firewire devices.


    +   - **Finds KNOPPIX—**With all available CD and hard-drive storage devices (IDE,
    SCSI, etc.) now properly detected and configured, the linuxrc script tries to
    find the KNOPPIX archive that will be used to make most of the KNOPPIX file system
    available (including the applications and settings).


    +   - **Mounts KNOPPIX—**When found, the KNOPPIX image is mounted. If multiple
    KNOPPIX images are found, they are mounted as KNOPPIX2, KNOPPIX3, and so on. Each
    image is mounted as a cloop device, as files and directories are requested from
    one of those file systems, they can be uncompressed on the fly.'
