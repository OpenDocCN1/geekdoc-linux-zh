  md: '# CHAPTER 8 Building a Basic Gentoo CD


    CFLAGS="-march=i686 -02 -pipe"

    CHOST="i686-pc-linux-gnu"

    CXFLAGS="${CFLAGS}"

    MAKEOPTS="-j2"


    The CFLAGS variable lets you set the CPU instructions and optimization to be used
    when building the packages for your live CD. To learn how to build your live CD
    for different architectures, refer to the Safe Cflags page (www.en.gentoo-wiki.com/safe_cflags).


    The -02 optimization is considered to be safe in most cases (-05 can be used if
    there will limited memory on machines where the live CD will run; -03 can be used
    to try to improve optimization, but the results can be unstable). If you have
    a multiprocessing system, you can add -j3 (or higher) MAKEOPTS to improve your
    build performance.


    The USE variable lets globally set features (represented by flags) that should
    be built into the packages you add. Likewise, you can request that certain features
    are not installed or added. Flags can represent compile-time options or might
    indicate whether to include certain libraries.


