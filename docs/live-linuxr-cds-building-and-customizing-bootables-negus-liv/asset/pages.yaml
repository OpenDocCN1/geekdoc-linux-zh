  md: '# Live Linux CDs


    +   * Floppy mode—By default, El Torito live CDs are assumed to include a floppy
    boot image (indicated by the -b option). For this to take place, the floppy image
    included on the CD must be exactly 1200, 1440, or 2880K in size. A drawback of
    using floppy mode is that the boot loader can reference only items on that image
    (which restricts the size of the boot images and other files you want to include).
    The advantage of using floppy mode is that you can simply copy a working floppy
    boot and use that on your CD to boot.


    +   * Hard disk mode—Adding the -hard-disk-boot option to mkisofs removes the
    size restrictions related to floppy emulation for someone creating a live CD.
    However, hard-disk emulation tends to work less reliably with different BIOSes.


    +   * No emulation—This is the most commonly used to create Linux CDs (by using
    the -no-emul-boot option to mkisofs, as described earlier). In this mode, boot
    problems are typically caused by older BIOSes that don''t fully support El Torito.
    In these cases, creating a live CD in floppy mode or using Syslinux (http://syslinux.zytor.com)
    instead of Isolinux overcome the problem.


    When the El Torito boot image starts up, the boot loader takes over the booting
    of the computer.


    # Proceeding to the Boot Loader


    When the boot loader has taken over the boot process, you typically get some choices
    about how the boot process will proceed. Here are the things you will see when
    the boot loader takes over:


    +   * Boot prompt—Whether you are in text mode or graphics mode, the Isolinux
    boot loader displays a boot prompt (boot:) which the boot loader takes over. A
    timeout period (often about 5 seconds) usually passes, during which you can type
    any labels defined for the boot loader. If you don''t type anything, the boot
    loader times out and boots the default boot loader.


    Pressing any key stops the boot process from proceeding while you try to figure
    what to type at the prompt. Often message files (described later) are available
    by pressing keys (F1, F2, and so on) that indicate both labels and options to
    those labels.


    If your live CD uses the GRUB boot loader of Isolinux, you might have a menu interface
    available instead of seeing a boot prompt. In that case, use the arrow keys to
    select the label you want to boot from a menu.'
