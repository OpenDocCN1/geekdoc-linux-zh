  md: '# GETTING THE MOST FROM APT


    To help you install and work with applications for your custom Knoppix CD, you
    can do several things with the apt facility. Here are some ideas:


    +   - Get the apt-spy application (apt-get install apt-spy) and use it to check
    for the best mirror sites to use from your area. The apt-spy command will modify
    your sources. list file (so you should probably make an extra copy of that file
    as a backup). Here''s an example of an apt-spy command line that finds four stable
    mirrors that offer good response times to North America and updates the /etc/apt/sources.
    list file with the new servers:


    ```

    # apt-spy -d stable -a north-america -e 4

    ```


    +   - Don''t upgrade packages (apt-get upgrade). Upgrades are more likely to break
    software than simply an an.


    +   - Changing the default packages installed by apt-get for Knoppix from testing
    to stable. You can do this by changing the word testing to stable in the /etc/apt/conf.file.


    +   - Watch the messages produced by apt-get to get information that you might
    need, such as empty directories left behind after uninstalling a package.


    +   - Instead of using apt-get, you could try the aptitude utility. Besides being
    able to work with packages in the same way that apt-get does, aptitude also provide
    information about disk space you are using or saving.


