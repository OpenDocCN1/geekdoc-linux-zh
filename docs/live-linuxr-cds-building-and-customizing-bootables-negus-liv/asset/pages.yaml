  md: '# Card Games


    Card games that come with LLGP are dominated by solitaire games, including include
    AisleRiot, FreeCell, and Gnome Solitaire. A few, however, can be played with others
    over the network (see Table 11-3).


    # Kids Games


    The only game in the Kids Games category in LLGP is Potato Guy, in which you put
    a face, hands, hats, and other accessories on a potato. Although the game is not
    very complicated, it keeps younger kids amused for a long time.


    # Sports


    The sports games included with LLGP are all 3D games that can test your hardware.
    Battleball (battleball package) is a soccer game played with tanks and helicopters.
    BilliardGL (billiard-gl package) is a 3D billiards game. CannonSmash (cmash package)
    is a table tennis game simulator. Foobilliard (foobilliard package) is another
    3D billiards game.


    # Strategy


    Some of the most challenging games available on LLGP are the strategy games. Freeciv
    (freeciv-client, freeciv-data, and freeciv-server packages) are a clone of the
    game Civilization, in which you build and maintain civilizations. Lincity (lcity
    package) is a similar game for building communities and city infrastructures.


    Battle for Wesnoth (wesnoth, wesnoth-data, wesnoth-editor, wesnoth-music, and
    wesnoth-server packages) are a popular fantasy, turn-based strategy game. Scorched3D
    (scorched3d, scorched3d-data, and scorched3d-doc packages) are a tank game that
    is based on the DOS game Scorched Earth. Liquidwar (liquidwar and liquidwar-data
    packages) is a multiplayer game.


    # Other Gaming Categories


    Other categories of games included on the LLGP live include Puzzles, Tactics &
    Strategy, and Tetris-like games. You can try out in those categories from the
    LLGP menu. Some games from those categories include SameGame (remove all the balls
    from the screen by clicking matching colors), KBBattleship (a clone of the Battleship
    board), and KSokoban (a challenging Japanese game in which you try to push items
    around a warehouse without getting them stuck).'
