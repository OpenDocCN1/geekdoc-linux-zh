  md: '# Live Linux CDs


    +   **Labels for failsafe and debug**—If your live CD won''t boot, it''s nice
    to provide the live CD user with labels that include failsafe and debug options.
    A failsafe label might be used to start a Linux kernel with many features disabled
    that might be causing the boot to fail (options as nodma, noscci, nousb, nofirewire,
    and so on) that drops you to a shell instead of desktop.


    Using a debug label, where the debug option is added to the APPEND line, you can
    see many messages relating to the live CD startup, and you can figure out what
    is causing any problems that occur during the boot process.


    # Other Files in the isolinux Directory


    Depending on how you set up your live CD boot configuration, the files you have
    in your isolinux directory (or boot/isolinux directory) will vary. By way of a
    quick checklist, you need to have these files in your isolinux directory before
    you can build your live CD:


    +   **Boot image (El Torito)**—Copy the isolinux.bin file to the isolinux (or
    boot/isolinux) directory where you are creating your live CD. On a Fedora system,
    the file is located in / El Torito boot image that the mkisos command uses when
    you are making the live CD ISO image. When the ISO is created, a pointer is placed
    in the image header to point to isolinux.bin. The isolinux image must be 1200K,
    1400K, or 2800K in size.


    You can create your own isolinux.bin file as you would create a boot floppy. In
    fact, simply copy the contents of a boot floppy to your isolinux directory and
    use it. For example, you could place a boot floppy into the floppy drive and type
    the following:


    ```

    # dd if=/dev/fd0 of=isolinux.bin bs=10k=144

    ```


    You don''t need to command the file isolinux.bin. However, any name you use must
    identify with the -b option when you run the mkisos command.


    +   **Boot catalog**—El Linux requires a boot catalog file (usually boot.cat).
    The mkisos command creates this file automatically, so you don''t have to worry
    about creating this. However, you must identify its name and location using the
    -c option when you run the mkisos command.


    +   **Isolinux configuration file**—The isolinux.cfg file must be created and
    stored in the isolinux directory, as described earlier in this chapter.


    +   **Boot screen files**—Files containing the initial boot screen and any boot
    screens you make accessible using function keys F1 through F10 need to be added
    to isolinux directory. Knopp uses boot.msg to contain information for the initial
    boot screen (and also when pressing the F1 function key).'
