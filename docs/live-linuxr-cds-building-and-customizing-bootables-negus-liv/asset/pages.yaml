  md: '# CHAPTER 8 Building a Basic Gentoo CD


    When you feel satisfied that your livecd-stage2 spec file is correct, run the
    catalyst command with that spec file as follows:


    ```

    # cd /root/gentooCD

    # catalyst -f livecd-stage2_template.spec

    ```


    When the catalyst command finishes running, it creates the live CD, based on the
    contents of the livecd/iso entry (/root/mylcd-x86-2006.1.iso, in my example).
    You can then test it (with tools such as qemu or VMware) and burn (with tools
    such cdrecord or k3b) live CD as described in Appendix B, “Building, Testing,
    and Burning Isos”,


    You most certainly won''t get a clean build the first time you try this procedure.
    If catalyst fails, look for the last error message and try to correct the problem.
    You might receive suggestions from the error message to change a flag or a notice
    that some component is missing. If you are not able to overcome the issue yourself,
    you can look for help on the gentoo-catalyst mailing list, as mentioned earlier.
    Read a few posts first and try to ask specific questions. Archives are available
    at http://archives.gentoo.org/gentoo-catalyst.


    # SUMMARY


    Gentoo is one of the more challenging Linux systems for building a live CD. The
    procedure in this chapter for producing a Gentoo live CD has set up a chroot environment
    for your live CD directory structure. Once in that chroot environment, you can
    use merge to add or remove any software packages as you please for your live CD.


    To save space for your live CD, the directory structure is compressed by converting
    it to a squashfs file system. Although isolinux can be used as the boot loader,
    this procedure describes how to GRUB to achieve the same results.


    Active development efforts for producing live CDs are mostly associated with the
    Catalyst project. Using Catalyst and spec files, you can produce highly customized
    live CDs. Development of Catalyst for producing live CDs has been progressing
    for a few years. However, you should closely follow the Catalyst mailing list
    and other resources to find out the latest components you should be using to build
    live Gentoo CDs with Catalyst.'
