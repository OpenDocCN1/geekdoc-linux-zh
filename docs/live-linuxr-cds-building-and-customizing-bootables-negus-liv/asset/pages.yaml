  md: '# CHAPTER 8 Building a Basic Gentoo CD


    # Understanding the Directory Structure


    At this point, it helps to understand the directory structure you are working
    in to create your live CD. Based on the information just entered into the catalyst.conf
    file, the following is a list of directories and files you should know about for
    the rest of the procedure:


    +   * /var/tmp/catalyst—Contains the builds directory (which holds the stage3
    tarball used to build the live CD), snapshots directory (which holds the Portage
    snapshot), and packages directory (which holds the packages created by the package
    and kernache to create the live CD.

    * /usr/lib/catalyst—Contains the scripts catalyst uses to produce the live CD.

    * /usr/portage directory (portdir) used to create the live CD. The distfiles subdirectory
    holds source code for package updates that have been applied to the local system.

    * /root/gentooCD/—This is an arbitrary directory I created to hold the spec files
    used to create the live CD.


    The configuration files you need to work with include the /etc/catalyst/catalyst.conf
    file (defining the location of catalyst components) and spec files for the live
    CD livecd-stage1 and livecd-stage2 archive. To go with those files, you will need
    a port snapshot and a stage3 tarball, which you will use to build the livecd-stage1
    archive.


    # Creating the livecd-stage1 Archive


    Building your Gentoo live CD is done in stages. The first stage (livecd-stage1)
    gathers all the software packages you want to include on the live CD and compiles,
    based on the USE flags you provide. The livecd-stage1 archive is used to create
    a livecd-stage2 archive and your live CD image.


    The Creating the livecd-stage1 archive starts by creating a livecd-stage1 spec
    file. The spec files are available from the /usr/share/doc/catalyst-2*/examples
    and /usr/share/livecd-specs-* directory, under separate directories for each architecture.
    The examples in this chapter use the i686 (standard PC) architecture. Copy the
    livecd-stage1 spec file to a working directory to get started.


    ```

    # mkdir $HOME/gentooCD

    # cd $HOME/gentooCD

    # cp /usr/share/doc/catalyst-2*/examples/livecd-stage1_template.spec .

    ```'
