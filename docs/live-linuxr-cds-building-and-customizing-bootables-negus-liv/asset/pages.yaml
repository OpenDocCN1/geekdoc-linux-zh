- img_proc: true
  md: '# Building a Basic Gentoo Live CD


    Tools for building live CDs are a natural extension of the Gentoo project. Although
    prebuilt binaries are available for many Gentoo packages, many people are drawn
    to Gentoo because it is geared toward those who like to select and build installed
    Linux systems from scratch.


    Although it is possible to build your own Gentoo live CD from scratch, the main
    procedure in this chapter has you start with an existing stage2 tarball and builds
    from there. After you have built a live CD with that procedure, the following
    section describes how to use tools from the Catalyst project (the Gentoo release
    building tool) much the same way as you would install Gentoo to hard disk. The
    difference is that the result is an ISO image instead of an installed system on
    hard disk.


    The procedures contained in this chapter are based on two different approaches
    to creating a Gentoo live CD:


    +   **Remastering a Gentoo live CD**—This procedure is, essentially, remastering
    of an existing Gentoo live CD. You install Gentoo to hard disk (to create a working
    environment), copy live CD components (from a stage2 tarball) to a directory on
    the hard, add and remove software for directory structure. That directory structure
    is then used to create the new ISO image. (http://gentoo-wiki.com/HOWTO_build_a_LiveCD_from_scratch).
    This is an unofficial process for creating Gentoo live CDs and is only capable
    of building a live CD for AMD64 or x86 architectures.


    +   **Building a Gentoo live CD with Catalyst**—Starts by using a stage tarball
    to create a base image. You then install the packages you want to that image and
    ultimately produce a custom live CD image. This procedure relies on the recently
    enhanced Catalyst release tool.'
  merge: -1
  pgno: 243
- img_proc: true
  md: 'If you choose to use Catalyst to create your Gentoo live CD, refer to the mailing
    list and other resources associated with the Catalyst project that are described
    later in this chapter. Because the project is still in early stages of development,
    it will help you find out the latest versions that people have gone working before
    you get started.


    # ABOUT GENTOO LINUX


    Gentoo Linux (www.gentoo.org) is a great Linux system for performance tweakers
    and cutting-edge users. Its primary claim to fame is its software-distribution
    system, based on the BSD ports system, called Portage. Key elements of Portage
    include these:


    +   - The Portage tree (/usr/portage), containing more than 10,000 software packages
    prepared to use in Gentoo.

    - The emerge command, which lets you select, download, and build on-the-fly any
    of those software packages. This command also lets you search and update your
    Portage tree and installed packages.


    With Gentoo, not only do you get exactly the packages you want, but you also build
    them to run specifically for your hardware configuration. Gentoo is set up to
    take advantage of the latest changes that are constantly rolling into the Portage
    tree. A single command updates all your packages (emerge -u world) or gets the
    latest Portage tree (emerge -sync).


    When you use prebuilt binaries from a Linux project, there are always features
    in build that you do not and possibly others built in you do. For example, you
    might not need Kerberos authentication or Oracle database support. By building
    the packages with emerge, using the USE flag, you can request which features are
    and are not built into the software capable of supporting those features.


    If you are trying to set up Gentoo yourself, a challenge is that you need to know
    a lot of Linux to use effectively. With the most recent graphical and Gentoo Reference
    Platform (a set of prebuilt packages), a lot of decisions require you to be Linux-savvy.
    Also, if something goes wrong, you won''t be able to fix it by clicking a button.


    Because Gentoo is in such a constant state of change, it''s very possible that
    something will go wrong in the procedure described in this chapter for building
    live CDs. So, the other great challenge is to learn how to track down and fix
    problems. The Gentoo community has a lot of resources you can draw on to:'
  merge: -1
  pgno: 244
- img_proc: true
  md: '+   Documentation (www.gentoo.com/doc)—Gentoo Linux comes with an active document
    to produce instructions to go with Gentoo software. If you are new to Gentoo,
    start with the Frequently Asked Questions and Installation Related Resources documents
    from the main documentation page. It''s best to read these documents before you
    asking questions in Gentoo forums.


    +   Forums (http://forums.gentoo.org)—Some Gentoo forums contain hundreds of thousands
    of posts.


    +   Mailing lists (www.gentoo.org/main/en/lists.xml)—More than 50 mailing lists
    are associated with different Gentoo topics. Mailing lists are available in multiple
    languages as well.


    In general, building a live CD based on Gentoo is more difficult than starting
    with a Debian-based CD (like Knoprix) or a Fedora Linux package (using Kadiski
    tools). But if you have a lot of time, bandwidth, disk space, and patience, you
    have the potential of ending up with a highly tuned Linux CD.


    # # SET UP TO BUILD A GENTOO LIVE CD


    To build a Gentoo live CD, you should start with an installed Gentoo Linux system.
    Because a Gentoo system can be many things to different people, I started the
    installation with a Gentoo live CD (2006.1) and selected most of the Gentoo Reference
    Platform (GRP) packages to have a stable platform to begin with. With Gentoo running,
    I added packages needed specifically for building live CDs.


    The Gentoo project doesn''t have system resource guidelines you need to follow
    be able to create live CDs. After running through the process, here is what I
    came up with my build system:


    +   Memory—A minimum 512MB of RAM and 1GB of swap space seemed to be enough to
    effectively run the Gentoo system needed to build the live CD. Of course, mine
    will get the job faster.


    +   Hard disk—I used a 1GB partition for the Gentoo system I used to build the
    live CD. By selecting the GRP packages and adding those packages needed specifically
    for building the live CD, I consumed about 3GB of disk space. Creating the build
    environment to have a copy of the file system structure and produce a 700MB live
    CD used about another 3GB. That left about 4GB for keeping around extra software
    and a few versions of the live CD ISOs.'
  merge: -1
