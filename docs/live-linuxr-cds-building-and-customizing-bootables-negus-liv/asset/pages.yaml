    | DEPTH | COLORS | 640×480 | 800×600 | 1024×768 | 1280×1024 | 1600×1200 |

    |---|---|---|---|---|---||}{

    | 8-bit | 256 | 769 | 771 | 773 | 775 | 796 |

    | 15-bit | 32,768 | 784 | 787 | 790 | 793 | 797 |

    | 16-bit | 65,536 | 785 | 788 | 791 | 794 | 798 |

    | 24-bit | 16,800,000 | 786 | 789 | 792 | 795 | 799 |


    In Knoix, separate labels exist for different framebuffer modes. For example,
    the following label (fb1024x768) starts Knoppix with vga=791. This sets the screen
    resolution 1024×768 and colors to 16-bit color (65,000 colors). This is a listing
    of that label:


    ```

    LABEL fb1024x768

    KERNEL LINUX

    APPEND ramdisk_size=100000 init=/etc/init lang= apm power-off vga=791 module=fbdev
    initrd=mminirt.gz nomce quiet BOOT_IMAGE=knoppix

    ```


    The module value is set to fbdev and vga is set to 791. In Knoppix, other fb labels
    (fb800x600, fb1280x1024, and on) are set to set vga values. To have the user prompted
    for a mode, you can set vga=ask instead.


    You can set xmodule values as you wish, depending on which drivers your kernel
    supports. In Knoppix, open-source drivers exist for ATI (ati), Radeon (radeon),
    Savage (savage or s3), NVIDIA (nv), and Intel i810 (i810) chipsets. If you are
    remastering a live CD, another option is to add video drivers from NVIDIA or ATI.
    Because these drivers are not open source, they are not available with many Linux
    distributions. However, you can add drivers to your live CD for private use because
    they are distributed freely from NVIDIA and ATI.


    A few other issues relate to LABEL lines. If a user uses the LABEL name at the
    boot prompt, followed by one or more options, those options are appended to the
    end of the options listed on the APPEND line. If a LABEL has no APPEND line, the
    APPEND keyword at the beginning of isolinux.cfg is used to provide global options.
    To not use the global options, you can add an APPEND line followed by a dash (APPEND
    -).'
