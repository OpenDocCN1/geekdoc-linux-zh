    # Recovery and Security Live CDs


    One of the first (and still one of the best) uses of a live CD is to recover and
    secure a computer or network of computers. Several recovery types of CDs, such
    as System Rescue CD (www.sysrescuecd.org) and INSERT (www.inside-security.de/insert_en.html),
    fit on a mini CD. Full-size security live CDs can include hundreds of additional
    tools for repairs, forensics, monitoring, and other security features.


    Security live CDs tend to offer simple graphical desktop environments, for the
    greatest flexibility in the types of systems they can run on. Some of the smaller'
