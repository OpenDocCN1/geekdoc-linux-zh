  md: '# WHAT YOU NEED TO USE THIS BOOK


    Live Linux CDs are available to run on a range of computer hardware, such as standard
    PC architecture (i386), PowerPC (ppc), and 64-bit AMD (AMD64). Some Linux live
    CD tools you build for the architecture you like (such as the Gentoo Catalyst
    installer). For the purpose of this book, however, the software we provide and
    the procedures are geared towards the standard 32-bit PC architecture.


    The PC you use to follow with this book requires a DVD drive or a CD drive (if
    you can burn your own ISO images to CD). Although each live CD has its own minimum
    hardware requirements, I suggest starting with at least a Pentium-class PC and
    at least 128MB of RAM. As noted later in this book, live CDs (by nature) consume
    a lot of RAM and run poorly in low-RAM environments.


    As hard-disk requirements, you don''t even need to have a hard disk in the computer
    to run the live CDs with this book. However, if you are remastering a live CD
    or building one from scratch, the amount of hard-disk space can range from a few
    hundred megabytes (to remaster Damn Small Linux) to several gigabytes of disk
    space. The space you need depends on how much software you are adding to your
    live CD (or live DVD).


    You might consider getting a USB flash drive (also sometimes called a pen drive
    or thumb drive). Because live CDs are typically run from read-only media, USB
    flash drives are good to keep handy in case you want to save any of the data you
    create.'
  merge: -1
