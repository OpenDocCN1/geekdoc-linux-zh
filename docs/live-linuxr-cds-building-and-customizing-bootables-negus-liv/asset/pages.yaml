    # SUMMARY


    Using Kadiski, you can create custom bootable CDs and DVDs of Fedora Core. Kadiski
    works by accessing a Fedora Core software repository and installing the software
    packages you select to a build directory on the local system. Kadiski then modifies
    the contents of that directory so it can run from a CD. The result is an ISO image
    that can be burned to a CD or DVD.


    You have many opportunities to customize your Fedora live CD with Kadiski. Because
    the anaconda installer runs as part of the kadiski, you can choose the packages
    that are installed, the keyboard and language used, your Ethernet connection,
    and other basic anaconda features. You can also modify scripts that come with
    Kadiski to change boot screens or modify the contents of your Fedora live CD file
    system.


    If you choose to use an optional kickstart file, you can automate much of the
    process normally done by clicking through anaconda install screens. Using the
    kickstart file, you can also add post-install scripts to run at the end of the
    live CD build process.'
