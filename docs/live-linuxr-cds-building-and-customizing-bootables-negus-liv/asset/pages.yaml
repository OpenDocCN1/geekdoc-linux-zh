    | nostab | Ignores the /etc/fstab file when trying to find file systems to mount.
    |

    | nofirewire | Disables firewire detection. |

    | nopcmcia | Disables PCMCIA detection. |

    | noscsi | Disables SCSI detection. |

    | noswap | Doesn''t try to detect a swap partition. |

    | noudev | Disables UDEV device detection. |

    | nousb | Doesn''t try to detect USB version 1 ports. |

    | nousb2 | Doesn''t try to detect USB version 2 ports. |

    | pnpbios=-off | Turns off PNP BIOS initialization. |

    | acpi=off | Turns off ACPI BIOS initialization. |

    | acpi=force | Requires ACPI BIOS initialization. |'
