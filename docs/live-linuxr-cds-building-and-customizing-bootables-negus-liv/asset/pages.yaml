  md: '# Live Linux CDs


    # NOTE


    Don''t let the fact that Devil Linux uses text menus scare you off; a lot of users
    expect a graphical user interface, but there''s nothing inherently difficult about
    using a text-based menu. Besides, you''ll spend very little time in the configuration
    menu, so when everything is set up as you like it, you probably won''t need to
    see the configuration screen again for a very long time.


    Most of the defaults in the basic configuration menu are probably safe to use.
    Be sure to change the host and domain names to reflect your network, though. As
    you can see in Figure 13-2, I''ve set the hostname (Kodos), domain name (zonker.net),
    and time-zone (America/Denver). You can also set the logging level, mouse device,
    and so forth.


    The next step is to configure services. If you''re just running a firewall, the
    default set of services will probably be fine. However, if you want to be able
    to run cron jobs, an SSH daemon, or other services, or maybe remove IPv6 support,
    you''ll need to configure the services here. From the System Configurator main
    menu, select Services. Available services are listed as shown in Figure 13-3.


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_372_0.png)


    SSHD is a Secure Shell for remote logins and file copying


    > FIGURE 13-3 Turn on system services for your firewall from the System Configurator
    Services menu.


    As you can see in Figure 13-3, there are quite a few available services to choose
    from. Very few, if any, additional services should be turned on for a firewall.
    I recommend setting up SSHD, though, if you plan to administer the firewall'
  merge: -1
