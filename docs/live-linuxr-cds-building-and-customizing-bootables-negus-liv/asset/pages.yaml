  md: '# Running Enumeration Tools


    Enumeration tools are used to find out information about a system, network, or
    service is available to potential intruders. Including enumeration tools on a
    live CD lets you test the computers on your network so you can shut off access
    to information that an intruder could use to do you harm.


    BackTrack includes dozens of enumeration tools that can be used to find information
    about your Internet domain, LDAP servers, operating system, routing, and other
    services. The following enumeration tools come with BackTrack.


    # Checking Domain Information


    To run commands for checking information about an Internet domain from a Domain
    Name (DNS) server, select K menu -> Enumeration -> DNS. About a half-dozen menu
    items are available to check out DNS information.


    +   * DNS -> Walk lets you run the dnswalk (www.visi.com/~bar/dnswalk) to debug
    the zone database for your DNS servers. The dig (K menu -> Enumeration -> DNS
    -> Dig) is a popular utility for looking up a range of DNS information. dsapenum.pl
    (Perl utility) is another useful tool for checking out your domain. With it, you
    can find DNS servers, try zone transfers, and check for host names from a list
    you provide.


    # Checking LDAP Information


    Using the 1ldapenum Perl script (http://sourceforge.net/projects/ldapenum), you
    can get password and system information from LDAP services running on Windows
    2000 and 2003 systems. You can get to the script by selecting K menu -> Enumeration
    -> LDAP -> Ldap Enum. This same tool can be used to try to log into the accounts
    it finds. The 1ldapenum command can also be used to check for groups and members.


    The Luma (http://luma.sourceforge.net) graphical LDAP management tool (K menu
    -> Enumeration -> LDAP -> L) includes eight plug-ins for finding and working with
    data on LDAP servers. Plug-ins let you search LDAP address books, search selected
    LDAP servers, manage users, and access other kinds of information from an LDAP
    server.


    # Determining Operating Systems


    Tools from the Operating System enumeration menu (K menu -> BackTrack -> Enumeration
    -> Operating System) can help determine the type of operating system being run.
    Select Pof from that menu to use a passive fingerprinting technique to determine
    the type of operating system a computer is running, based on TCP/IP'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# CHAPTER 9 Customizing a Security Linux CD


    pockets sent from that computer. The pof command (http://lcamut.coredump.com/pof.shtml)
    is considered to be passive because it finds information about a system by reading
    TCP/IP packets on the network to determine the type of operating system and other
    properties of the host.


    Tools such as pof can get information about a remote system without actually contacting
    it. The pof tool can study TCP/IP packets from any system contacting your network.
    It can also get information from a system based on the system without accepting
    or rejecting a connection from the system running pof.


    The nmap command (www.secure.org/nmap) is another tool that is commonly used to
    explore a remote system. With nmap, you can scan networks or single hosts. By
    scanning packets, nmap can determine what operating systems hosts are running
    on and what services those hosts are offering. It can also learn what type of
    firewall each host is running.


    The Nmap Front End (nmap command) provides a graphical interface to nmap. 9-5
    shows the results of scanning a Linux machine on the local network. The system''s
    name is einstein, and TCP ports 21 (ftp), 22 (ssh), rbind (111), and X11 (6000)
    are open. The ftp and ssh services are shown in red, indicating that services
    are active on ports.


    The sinfp.p1 Perl script (gom.org/sinfp) can determine the type of operating system
    running on a computer, based on the IP address you give the command. For Linux
    systems, you can also determine information about the version of the current kernel.


    The probe2 (http://probe.sourceforge.net) command can glean a lot of information
    about a computer''s operating system by simply giving the system''s IP address.
    It uses several different information-gathering techniques to find out about the
    selected system. It tries to determine the distance from the remote system, checks
    open ports on the system, and checks to determine the type of operating system
    is running.


    # Determining Network Routing


    Tools for uncovering information about network routing (from the Routing/Network
    menu) including the Autonomous System Scanner, or command (www.phenenoit.de/iraps/doc.html),
    the firewall command (www.packetfactory.net/projects/firewall). To trace packets
    to a destination, you can use the itrace command (http://ftp.sourceforge.net/itrace.html),
    traceroute command (ftp://ftp.ee.lpl.gov) or tcaceroute command (www.phenenoit.de/iraps/doc.html).
    Itrace uses ICMP echo requests; tctrace uses TCP SYN packets to trace packets
    to their destination.'
  merge: -1
  pgno: 287
