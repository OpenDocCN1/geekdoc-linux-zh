- img_proc: true
  md: '# CHAPTER 13 Customizing a Firewall Linux CD


    remotely. My firewall doesn''t even have a keyboard or monitor attached to it;
    I do all the administration via SSH after its set up.


    You''ll also need to set up your network devices, naturally. From the System Configurator
    main menu, select NET. The Networking Menu appears as shown in Figure 13-4.


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_373_0.png)


    FIGURE 13-4 Configure network interfaces and settings for the System Configurator
    Networking Menu.


    One of the reasons I like Devil Linux is that it''s better suited to more complex
    network setups, as three-NIC configurations that provide a DMZ, instead of the
    standard two-NIC configurations that provide only a single barrier between the
    LAN and the Internet.


    As you can see on the Networking Menu in Figure 13-4, you have several options
    here. You can choose a two-card Local LAN configuration or a DMZ setup with three
    interfaces. You can set the interface to each card individually.


    As you can see, Devil Linux makes it easy to set up a basic firewall framework
    with the FW2 and DMFW3 options. Unfortunately, it doesn''t make easy to set up
    the NICs. On systems I tested, Devil Linux doesn''t autodetect network cards,
    so you have to explicitly tell Devil Linux modules to use for the cards.


    Because users rarely know exactly what model network card they have, and because
    the name and model number of the card might or not bear any resemblance to the
    actual module name, this can be a bit tricky. I recommend booting the computer
    using another live CD, such as Knoppix, and then seeing what'
