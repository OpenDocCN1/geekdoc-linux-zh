  md: '# Building from a Kickstart File


    One of the installation types Fedora Core supports is called a kickstart install.
    By creating a kickstart file that contains information needed to direct the Fedora
    Core installation process, you can bypass some (or all) of the anaconda installation.


    Kickstart files are often used to unattended Fedora Core installations. If you
    are installing Fedora Core on multiple computers (especially if they are configured
    similarly), a kickstart install can make sure you get the exact installation you
    want each time.


    Using a kickstart file to create your Fedora live CD with Kadisci offers several
    advantages. As you tune up and customize your live CD with Kadischi, you want
    to make continuous rebuilds with kadischi as possible. Creating a kickstart file
    saves you from having to click through the install screens over and over. It also
    makes sure you get the exact packages, language, network settings, and other Fedora
    features that you can continuously rebuild your live CD.


    Here are some ways you can create a kickstart file to make your live CD:


    +   * **Sample kickstart files**—You start with a minimal kickstart file with
    Kadischi. The sample, minimal kickstart file in Kadischi is named minimal-1livecd.cfg
    and is located in the /usr/share/kadiski/ks_examples directory. Also in that directory
    is standard-livecd.cfg (which can build a more complex desktop system) and xen-livecd
    (which can build a live CD with a Xen-enabled kernels). The other kickstart file
    in that directory is standard-livecd, which builds a DVD-sized ISO image that
    includes most of the Fedora Core distribution.


    +   * **system-config-kickstart**—Run the system-config-kickstart utility to create
    a custom kickstart file. The system-config-kickstart package (which includes the
    utility of the same name) is part of Fedora Core, but it isn''t installed by default.


    +   **Kickstart file from installation**—After a normal permanent Fedora Core
    installation to hard disk, anaconda places a kickstart file called anaconda-cfg
    in the /root directory. That file contains the settings you used during installation.
    So, essentially, you could use that kickstart file to repeat the same installation
    (without having to step through the install screens) or create a live CD with
    the same settings and software packages.'
  merge: -1
  pgno: 235
