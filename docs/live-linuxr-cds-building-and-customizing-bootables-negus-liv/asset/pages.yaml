  md: '# Live Linux CDs


    +   * MAME—The Multiple Arcade Machine Emulator (MAME) is probably the most popular
    game console emulator available for Linux. MAME has been tested to run hundreds
    of classic console games from the 1970s, 1980s, and 1990s. You need legal ROMs
    to be able to use the emulator.


    Three game ROMs are said to be in the public domain (www.mame-world.net/legal).
    Capcom and Taito have licensed some of their game ROMs to be sold, so you can
    get them with Hanaho''s HotRod joystick control panel. Some are bundled (www.hanaho.com).
    StarROMs (www.starroms.com) offers a legal way to get ROM for supported games.


    +   * DOSBox—If you have old DOS games, you can use the dosbox command to run-
    and protected-mode games created originally for the Operating System (DOS).


    +   * Amiga—For games ran on Commodore Amiga 500, 1000, and 2000 computers, you
    can use the UAE Amiga emulator (uae command). Those machines were built on the
    Motorola 680x0 CPU chip.


    +   * Nintendo—The znmes utility (http://znmes.com) is an emulator for playing
    games created for Super Nintendo systems.


    The presence of game emulators is one feature that distinguishes GamesKnoppix
    from other live CDs. However, if you don''t have legal game ROMs (or if you''re
    not willing to hunt them down), the emulators themselves are not useful. However,
    this live CD has about 300 games to keep you busy. Check the GamesKnoppix Web
    site (http://games-knoppix.unix-ag.kl.de/gamelist-4.0.2-0.3.txt) for a complete
    list of available games.


    The interface for GamesKnoppix is the familiar and stable Knoppix 4.0.1 KDE desktop.
    Beside game emulators, you can try hundreds of games from the GamesKnoppix DVD.
    The Games menu has more than 50 arcade games and nearly 20 strategy games. There''s
    even a Potato Guy game for kids. Figure 11-1 shows example of GamesKnoppix displaying
    a billiards game (foobilliard), a space game (kasteroids), and a game for putting
    a face on a potato (Potato Guy).


