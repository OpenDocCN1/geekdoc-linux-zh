  md: '# FROM BIOS TO BOOT LOADER


    When you turn on (or reboot) a PC, the computer''s BIOS is run to direct the start-up
    process. The BIOS must determine where to look for the boot information that will
    either boot the operating system or present a boot screen (so the user can select
    the operating system to boot). The BIOS has these primary duties related to running
    live CDs:


    +   **Enable drives**—Depending on the BIOS, you might have to specifically enable
    the particular hardware you want to boot from. For example, with some BIOSes,
    you might need to enable USB BIOS support to even be able to select USB drives
    or USB hard disks as bootable devices.


    +   **Set the boot order**—The boot order set in the BIOS determines which device
    is searched for bootable media. On systems most booted from hard disk, floppy
    and CD drives typically precede hard disks in the boot order. In these cases,
    bootable CDs and floppies are expected to be in those only during the boot process
    to start them instead of starting the operating system.


    If an inserted live CD is bypassed during the boot process, you should check the
    boot order to make sure that it appears in the boot list before the medium (probably
    the hard disk) that actually booted. Also, other media that you might want to
    boot from (such as a USB device or Zip drive) likely will not be in the default
    boot order list; you must change the boot order to boot from those devices.


    In most cases, a PC''s BIOS is set so that simply inserting a live Linux CD into
    a computer''s CD drive and rebooting cause the boot information on the CD to be
    found and booted. However, with some computers (especially older ones), the boot
    order doesn''t include the CD drive before the hard disk. A more likely problem
    with older computers, however, is that a computer''s BIOS doesn''t include less
    popular devices (such as a USB drive or Zip drive) in its priority order.


    In other cases, BIOS is supposed to be capable of booting from a particular drive,
    but some bug in the BIOS prevents that from happening. In those cases, you might
    try to track down an updated BIOS for your computer.


    # Checking and Changing the BIOS


    To check and possibly change your computer''s BIOS, turn on the computer and watch
    the screen as the computer checks the available memory. Look for the'
