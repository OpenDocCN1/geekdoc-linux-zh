  md: '# Live Linux CDs


    +   **Access hard disks**—A live Linux system doesn''t need to access your hard
    drive. However, sometimes you will want to use the data on your hard drive to
    perhaps play music, open a document, or view images using your favorite Linux
    application. Or you might want to save data that you gather or create from your
    live CD to a more permanent hard disk.


    Some bootable Linux systems provide icons right on the desktop representing all
    the hard-disk partitions on your computer. Accessing data on those partitions
    is often as simple as opening those icons. Writing to those partitions often requires
    a special request (to prevent you from writing to hard-disk partitions unintentionally).


    +   **Access the CD drive**—Because the operating system is, by default, running
    from your boot media (CD or DVD), if you then want to play a music CD or a video
    file from DVD, you can''t just eject the medium from its drive. If you have two
    CDs you can use one for the live CD and for the content you want to play.


    If you have only one CD/DVD drive, however, a way around this problem is the same
    technique used to improve performance. With enough available memory, run the live
    Linux from RAM; you can eject the bootable medium insert the CD or DVD you want
    to play. Some media player live CDs are, by design, stripped down to the minimum
    you need to play multimedia content, so they automatically load into RAM and let
    you eject the CD.


    +   **Access networks**—Most bootable Linux systems are configured to automatically
    detect the availability of a DHCP server on most supported Ethernet cards. This
    immediately provides you with a working Internet or other network connection.
    Tools for configuring static addresses or connecting with wireless cards are also
    available with many bootable Linux systems.


    +   **Add applications**—You might have an almost-perfect live CD but find that
    it lacks an application or two that you want. Some live systems enable you to
    install applications to a running, live Linux system (usually with downloadable
    packages that are preconfigured for the particular Linux distribution you are
    using).


    +   **Save custom features**—With a read-only medium, such as a CD-ROM, you might
    be able to change your desktop background, write a document, or save some Web
    bookmarks. But soon as you reboot (by default), all that stuff just goes away.
    As already mentioned, you can access the local hard disk or network for saving
    data, but you might want to keep custom settings and applications with your live
    Linux so that every time you reboot the CD, those settings just reappear.'
