  md: '# CHAPTER 9 Customizing a Security Linux CD


    attached to your system, you can start and stop the GPS tracking daemon by select-ing
    GPS Daemon or Stop GPS Daemon, respectively. Several utilities also exist for
    changing the drivers used on your wireless cards.


    For forging packets on wireless networks, a handful of tools are available on
    the Packet Forging menu. The aircrack-ng package (aircrack-ng.org/doc.php) contains
    tools for auditing the reliability of your wireless network, including airplay-ng
    (for injecting frames that generate traffic for cracking WEP and WPA-PSK keys).
    Aircsnarf (www.shmo.com) can be used to set up a rogue access point. WifiTap (wi
    tap command) can be used to capture traffic and inject packets on an 802.11 network
    (http://sid.rack.org/index.php/wifitap_EN).


    # BlueTooth Device Tools


    Tools for monitoring BlueTooth devices (www.bluetooth.org) are available from
    the BlueTooth menu (K menu → BackTrack → Bluetooth). Blue Snaper (bluesner command)
    downloads the phonebook of Bluetooth-enabled devices that are not secured against
    such intrusions. Carwhisperer (carwhisperer command) tests the vulnerability of
    BlueTooth car kits, particularly those that use standard passkeys (see http://trifinite.org/trifinite_stuff_carwhisperer.html).


    You can use the HelMoto utility (helomoto command) to exploit the handling of
    trusted devices by some Motorola phones and other devices. You can learn about
    HelMoto attacks from the Trifinite site (http://trifinite.org/trifinite_stuff_helomoto.html).


    # Cisco Router Tools


    Look under the Cisco Tools menu (K menu → BackTrack → Cisco Tools) to find tools
    for checking for vulnerabilities in Cisco Routers. The Global Exploiter (cge.pl
    perl script) can test for a range of known Cisco equipment vulnerabilities. Using
    this tool usually requires a target and the name of exploit to test. You can find
    out about this script from the BlackAgents site (www.blackagents.it).


    Cisco Torch is a Cisco vulnerability scanner (cisco-torch.pl Perl script). With
    it, you can scan for a variety of services on Cisco devices, including telnet,
    sshd, snmp, and tftp. You can do fingerprinting on Network Time Protocol (NTP)
    and TFTP services.


    Yersinia (yersinia command) is a tool for analyzing network protocols, including
    the Cisco Discovery Protocol (CDP). You can find out more about Yersinia from
    its home page (www.yersinia.net). the cisco-copy-config.pl and merge-copy-config.pl
    Perl scripts are simple scripts for copying and merging Cisco configurations,
    respectively, using SNMP.'
