  md: '# Database-Analysis Tools


    BackTrack divides its tools for analyzing database vulnerabilities into categories
    of generic database tools, MS-Sql, Mysql, and Oracle. Nearly a dozen tools exist
    for checking database vulnerabilities.


    Absinthe (www.ox90.org/releases/absinthe) is a graphical tool for downloading
    database schema and content that might be vulnerable to blind SQL injection. It
    also includes the bases for MS SQL server error-based injection. The tool is used
    primarily to improve the speed of recovering data.


    The SQL-Dict selection over the sqldict.exe Windows binary for launching the SQL
    Server Dictionary Attacker (http://security.nu/toolbox). The window lets you start
    attacks to test for SQL dictionary on target server IP and target account. You
    can also load a password file.


    For MySQL databases, BackTrack includes Blind SQL Injection (bsqlbf.pl script
    from www.unsec.net), SQL-Miner (mysql-miner.pl script), and Setup MySQL (setup-mysql
    Python script). The setup-mysql script lets you configure and start a MySQL server
    on which you can start testing.


    # Forensic Tools


    To check out a system for problems after they occur, BackTrack includes a handful
    of forensic tools you can run on the system. The Autopsy Forensic Browser (www.sleuthkit.org/autopsy)
    lets you up cases to do volume and file-system analysis. As forensics run, data
    is stored in an Evidence Locker that is associated with a case.


    Using the pasco command (www.foundstone.com/resources/prodesc/pasco.htm), you
    can browse the contents of cache files Internet Explorer left behind. It takes
    an index.dat file as input and outputs file-delimited data that you can use in
    a spreadsheet.


    # Acquiring Tools


    To be able to run forensic analysis tools on an infected system, you usually need
    to copy the file system to an image file to work on it from another location.
    The standard tool for copying an image file, and converting it in various ways,
    is the dd command (which has been around since the old UNIX days). BackTrack includes
    several related commands that can also work with those file system images.


    The dcfldd command is an enhanced version of the dd command that is intended specifically
    for doing forensics. This command can do such things as'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# CHAPTER 9 Customizing a Security Live Linux CD


    hashing on-the-fly (to ensure data integrity) and performing flexible disk wipes
    (using any known pattern you choose). To learn more about dcfldd, refer to its
    SourceForge page (http://dcflldd.sourceforge.net).


    The ddrescue command (www.gnu.org/software/ddrescue/ddrescue.html) is a data-recovery
    tool that does to rescue data in environments where there might be read errors.
    Because ddrescue runs automatically, it fills in data gaps instead of truncating
    output or stopping for errors.


    A graphical tool for creating file-system image files, already discussed in this
    chapter, is the Automated Image & Restore (AIR) utility.


    # Running Services


    Because network interfaces and services that run on those interfaces are off by
    default in BackTrack, the BackTrack Services (K menu → BackTrack → BackTrack Services)
    lets you to start and stop various system services that can help you with rescue
    and security activities. You can select the following services from:


    +   - HTTPD—Starts and stops an Apache web server

    - Postgres—Starts and stops a Postgresql database server

    - SNORT—Sets up and initializes Snort, and then starts Snort (along with any dependent
    processes)

    - SSH—Sets up, and stops an SSH remote-login daemon server

    - TFTPD—Starts and stops a virtual network computing (VNC) server to allow remote
    displaying of local desktop displays

    - vsFTPD—Starts and stops an FTP server


    Depending on the types of services you want to be able to test from your Linux
    CD, you might want to add other services as well.


    # Miscellaneous Services


    A whole bunch of services that didn’t fit into any other category are lumped into
    the Misc category on the BackTrack menu. Among the tools on menu are QTParted
    (a graphical disk-partitioning tool based on the parted command), PDF Viewer for
    viewing PDF files with the kpdf viewer), and Screen Capture (to take a screen
    shot with the ksnapshot command).'
  merge: -1
