    # RUNNING THE LINUX LIVE GAME PROJECT LIVE CD


    As an example of a gaming live CD, I included the Linux Live Game Project (LLGP)
    live CD (http://tuxgamers.altervista.org). This is a good representation of how
    Knoppix can be customized to meet a specific purpose. In this case, the purpose
    is gaming. The LLGP live CD also limited the games to add and free open-source
    games, so there is no problem using or redistributing any of the games described.


    Literally hundreds of games are included on the LLGP live CD. Despite not including
    any commercial games or game demos, the live CD contains many fun and challenging
    games. To see the games included with the live CD, refer to the project''s List
    of Games page (http://tuxgamers.altervista.org/List_of_games). To see all packages
    in the distribution, go to List_of_packages_on_LLGP_0.1pre0 from the home page.
    (If you do your own Knoppix or Debian remaster, you can refer to either of these
    lists as a reminder of packages you might want to include.)'
  merge: -1
