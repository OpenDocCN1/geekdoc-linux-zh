    # Changing Isolinux Files


    You might consider changing these files located in the /boot/isolinux directory
    of the Knoppix CD:


    +   - isolinux.cfg—Describes how the CD responds to input from the boot prompt.
    Labels listed in this file define which kernel and options are run when those
    labels are typed at the boot prompt. Function key definitions determine which
    message files are displayed. Also, you can enter several different options to
    define such as how long the system should wait at the boot prompt (without input)
    before the system boots (TIMEOUT) or what text to display before the boot prompt
    (DISPLAY).

    - boot.msg—Defines the text that appears before the boot prompt.

    - logo.1—Contains the splash screen image in syslinux SLL16 image format that
    appears on the initial boot.

    - f2—Contains text that appears when the user presses the F2 key from the boot
    prompt. This text describes boot options with Knoppix.

    - f3—Contains text that appears when the user presses the F3 key from the boot
    prompt. This text describes code available with Knoppix.


    If you, you can add more message files to go with function key definitions (f4,
    f5, f6, and so on). For example, you might want to create message files that describe
    the contents of the CD or licensing information.


    Because the isolinux files are basically the same as one type of live CD to another,
    Chapter 5, "Looking Inside Live CD Components," has general descriptions of Isolinux
    files. Refer to that for information on creating your splash screens and modifying
    configuration message files.


    Besides the isolinux files, you might consider changing informational text and
    HTML files that are available from the CD when it first boots up. These files
    include the index.html file that appears in the root directory on the CD. That
    file points to introductory files in the KNOPPIX directory that are in a variety
    of languages (French, Italian, Spanish, Japanese, and others). You might also
    look at the FAQ files in that directory (also available in different languages)
    to see whether you want to change or replace them.'
