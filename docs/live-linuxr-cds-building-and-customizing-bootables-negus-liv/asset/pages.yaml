  md: 'You can add the -f option to the command line to overwrite the location of
    the previous ISO file when the new one is created. The add --text option to the
    command line if you want to do the live CD creation process in text mode. If Kaschis
    is unable to run in graphical mode on your desktop, it will automatically step
    back to text mode. Select OK to continue.


    The next steps are part of a standard Fedora installation process. You can find
    detailed descriptions of this process in many books on Fedora Core (such as Red
    Hat Fedora and Enterprise Linux, ISBN 0-47-08278-X, by Christopher Negus). The
    following is a checklist cover installing the process.


    +   1. Welcome screen—Click next (or OK) to continue.


    +   2. Language selection—Select your primary language.


    +   3. Keyboard configuration—Select the language/layout for your keyboard.


    +   4. Network configuration—Configure the Ethernet subnet.


    +   5. Time zone selection—Select the zone in which the system will run.


    +   6. Set root password—Select a password for the root user.


    +   7. Installation type—Select one or more sets of software to get the basic
    groups of software you want on your live CD (Office and Productivity, Software-Development,
    and Web Server). Choose Customize Now to make more specific selections.


    A new feature on the Installation Type screen is the Additional Repository feature.
    Select Fedora Extras to allow software packages from the Fedora Extras repository
    to be included on your live CD. Select to add additional software repositories
    to the location of additional software repositories (such as those from rpm.livna.org
    or atrpm.org). (See descriptions in Chapter 11 on building a Fedora gaming CD
    to learn about incorporating packages from other repositories.)


    +   8. Package group selection—Select the packages you want in the system. (Be
    sure to select Base System → Base and add the Squashes optional packaging.)


    +   9. Beginning of installation—When package dependencies have been worked out,
    Click next to start the install.


    When you select your packages, keep in mind that a bootable CD can hold about
    700MB of compressed data; for a standard, single-layer DVD, you can use an ISO
    image of about 4.4GB. Because the file system is being compressed before made
    into the ISO image, you will be able to fit more on your CD or DVD than the anaconda
    installer will indicate.'
