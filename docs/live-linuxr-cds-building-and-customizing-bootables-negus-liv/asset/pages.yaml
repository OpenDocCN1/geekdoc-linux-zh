  md: '# RUNNING A SECURITY LIVE CD (BACKTRACK)


    BackTrack(www.remote-exploit.org/index.php/BackTrack) is a suite of network security
    tools on a Linux live CD. It is based on the SLAX live CD, slackware derivative,
    and combines features from two security-oriented live Linux distributions: Whax
    and Auditor.


    The BackTrack CD contains more than 600MB of tools for fixing file systems, tracking
    down exploits, monitoring networks, and doing many, many repair and maintenance
    tasks. The CD also includes archives of information on known exploits from Metasploit(www.metasploit.com)
    and SecurityFocus(www.securityfocus.com), with tools (such as an archive browser)
    available to access that data. Chapter 9, “Customizing a Security Live CD,” for
    further descriptions of BackTrack.


    # Using BackTrack


    The approach to BackTrack’s design reflects the kind of features you might expect
    from a live CD that is to check or repair a broken system or network. Here are
    some examples:


    +   **Boot messages**—Normally when you boot a live CD, messages stream so quickly
    that you can miss something important. BackTrack offers a debug mode (type `s1ax
    debug` at the boot prompt) to open a shell at several points during the boot process.
    If something is wrong, you can correct it from the shell. If everything is okay,
    you press Ctrl+D to continue to boot.


    When handled to the init process, services are started up. If certain features
    fail, BackTrack tells you what to turn off the boot prompt. For example, if BackTrack
    fails when starting PCMCIA devices, the message on the screen tells you to type
    `s1ax nopcmia` the next time you boot. The same applies if Hotplug fails (s1ax
    nohotplug).


    +   **Boots to a text prompt**—BackTrack boots to a text prompt, assuming that
    you might not have an available (or working) graphics card. Here, six virtual
    terminals are available (Ctrl+Alt+F1, Ctrl+Alt+F2, and so on).


    +   **Mounting file systems**—BackTrack assumes that you want total access to
    your system when you are booting from a security live CD. Every partition can
    be mounted from a storage media is detected and mounted with read-write permission
    turned on. For example, partitions from the first hard disk (/dev/hda1, /dev/hda2,
    and so on) are mounted on the /mnt directory (/mnt/hda1, /mnt/hda2, and so on).
    Likewise, USB flash drive partitions (which are viewed as SCSI devices) are mounted
    on /mnt/sda1, /mnt/sda2, and so on.'
