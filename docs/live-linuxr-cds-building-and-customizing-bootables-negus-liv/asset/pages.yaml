  md: '# # APPENDIX B

    # Building, Testing, and Burning ISOs


    When you have all the pieces of a live CD in place, you can gather those pieces
    into a bootable ISO image from Linux typically using the `mkisoofs` command. That
    ISO image can then be shared from software repositories and run by either of these
    ways:


    +   - Starting the ISO image from an emulator—A convenient way to try and run
    the ISO image from the local file system using a CPU emulator. Popular emulator
    software includes VMware and Qemu. Qemu is available with most of the Linux distributions
    described in this book (and works well in most cases), this appendix primarily
    describes how to use Qemu to test the ISO images you build. A short description
    of how to get and use the VMware Player is also included.

    - Burning the ISO image to bootable media—Because the live ISO image is intended
    to be bootable from a removable medium, the last step in producing a live Linux
    system is to burn that to CD, DVD, or other removable boot medium. This appendix
    describes how to use tools such as the `cdrecord` command and `K3` graphical utility
    to burn ISO images to CD or DVD.


    Utilities for making ISO images (`mkisoofs` command), testing ISO images before
    burning (`qemu`), and burning them to media (`cdrecord` and `k3`) are noted in
    procedures throughout the book. However, because those utilities have more features
    than the few that are mentioned earlier, you can use this appendix as a reference
    for expanding ways of building, testing, and burning your ISO images.'
  merge: -1
