  md: '# SUMMARY


    The process of remastering a custom Knoppix CD is largely a manual process, but
    many people have managed to do it successfully. The general steps to remastering
    Knoppix involve unpacking the Knoppix files directly from a running Knoppix system,
    changing the unpacked files to make the system suit your needs, and then repacking
    it all into an ISO file that can be burned to disk.


    By modifying the Knoppix file system that was copied to your hard disk in a chrooted
    environment, you can install and remove packages, change settings, and test out
    your changes as though you were working directly from the live CD itself. After
    you recompress the file system and add it back into a full, bootable ISO image,
    you can test that image using emulators such as qemu or by burning the image to
    CD and trying it out.'
  merge: -1
  pgno: 212
