  md: '# Customizing a Security Live Linux CD


    Security and system-rescue activities are among the best uses of a live Linux
    CD. On one read-only medium, you can gather a range of tools to fix a broken operating
    system, scan file systems for intruders, watch traffic on the network, and hundreds
    of other activities to check and protect your computing environment.


    Putting together your security live CD offers a means of having all the tools
    you need at your fingertips in a way that you apply to any PC you can reboot.
    You have fewer worries when you go to fix a broken system because you can start
    with a clean, freshly booted operating system each time. In this way, less exists
    that the tools you would use to fix a system are themselves broken or infected.


    Creating a custom security live CD can also mean adding tools that might not be
    on other live CDs. For example, some software is licensed in a way that you can
    use it for personal use but might not be available for someone to redistribute.
    Examples of such things are proprietary drivers or utilities that come with a
    hardware peripheral. So features that they can''t legally put on a widely distributed
    live CD might go on the one you carry with you to use when it''s needed.


    This chapter covers some of the features that have been put into live Linux CDs
    that are used for security and rescue purposes. It also describes additional components
    you might want to add to your own custom live Linux CD. For demonstration purposes,
    the chapter focuses on the BackTrack live CD.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# EXPLORING SECURITY LIVE CDs


    Many Linux CDs for security already are available today, so chances are good that
    you can start your own Live CD based on an existing security-oriented Live CD.
    Popular security live CDs include some that are based on Knoix, Slackware, and
    Gentoo. You can choose where to start based on Linux distribution, as well as
    the tools each CD provides.


    To begin demonstrating the features of functions you might find on a Security
    Live CD, this chapter starts with the BackTrack network security suite (www.remoteexploit.org).
    Chapter 2, “Playing with Live Linux CDs,” includes an introduction to BackTrack,
    to help you start and learn the basics. This chapter looks at BackTrack with an
    eye toward the following:


    +   - Understanding how it starts—You’ll learn how BackTrack boots and starts
    services, as well as the state in which users begin using the live CD (such run
    levels, graphical and text-based interfaces, and user accounts).


    +   - Learning which tools it includes—You’ll become familiar with the features
    and tools included in BackTrack to help you put together your own set of custom
    security tools.


    > NOTE

    Track, like other Slax-based live CDs, includes many of the boot files provided
    from the Linux Live CD/USB Scripts (www.linux-live.org). Refer to that site to
    learn more about how the scripts, kernels, and other components from linux-live.org
    can be used to produce live CDs from an installed Linux system.


    Figure 9-1 illustrates the features that BackTrack pulls into its arsenal of security
    tools. Because BackTrack was created from a combination of tools from two other
    popular security-centric live Linux distributions (Auditor and Whax), you can
    get a good sense of the tools you want to have on your own live CD.


    If you are using BackTrack, open the BackTrack menu (lower-left corner of the
    screen) to select security tools to try out. In Figure 9-1, the applications displayed
    include the Autopsy Forensic Browser, the Automated Image and Restore (AIR) tool
    for creating and restoring disk images, and the AutoScan utility for exploring
    your network.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# CHAPTER 9 Customizing a Security Live CD


    25


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_275_0.png)


    FIGURE 9-1 Size up systems, hunt down exploits, and explore networks with BackTrack.


    Because security live CDs are not generally meant to be used for gaming or other
    high-end graphics applications, a lot of disk space can be saved by including
    a simple window manager (no window manager at all). Because it is lightweight
    but carries enough features to launch many useful X applications, the Fluxbox
    window manager is available on many of the smaller live CDs (50MB to 180MB). BackTrack
    includes Fluxbox for users who want to use it; the KDE interface is used with
    BackTrack by default.


    To understand the foundation on which this security tool chest is built, the next
    sections step you through the boot process and basic setup to support the security
    tools.


    # Booting the BackTrack Security Live CD


    To begin exploring how BackTrack is configured, look at the boot files it uses.
    As with most Linux live CDs, BackTrack uses the Isolinux boot loader. The boot
    loader is configured quite simply and is basically the same configuration you
    get with other live CDs based on Slax (www.slax.org).'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# Live Linux CDs


    The isolinux.cfg file is stored in the root (/) of the live CD, to direct the
    boot process. Three labels exist: slax, linux, and memtest. The memtest label
    simply runs the memtest command to check your RAM. The default slax label is the
    same as the linux label, except that slax label sets the default vga mode to 1024×768,
    16 colors (vga=03x17, the hexadecimal equivalent of 791). The following options,
    that can be used from the boot prompt (using either linux or slax labels) are
    described on the message screen when pressing F1:


    +   - linux debug—Interrupts the boot process on several occasions to open a shell
    to check progress.

    - linux copyram—Copies a complete file system to RAM. This can be used only if
    enough RAM is available.

    - linux floppy—Enables floppy automounting during startup.

    - linux load-modules—Loaded modules from the /optional directory.


    You can pass other boot options to BackTrack from the boot prompt, including nocod,
    nohd, and nodma.


    You can set the probeusb parameter to find USB devices earlier in the process
    than it would normally do. You can also set the specific amount of RAM you want
    to allow BackTrack to use when it mounts the root (/) directory by setting the
    size= parameter (in bytes). By default, 60 percent of your available RAM is used
    for the tmpfs file system that will eventually hold the CD''s root file system.


    # Boot Components


    This bootloader components are used during the boot process for BackTrack:


    +   - Splash screen—The first screen that appears when BackTrack boots is defined
    in the boot/splash.cfg file. That file reads the BackTrack splash screen (boot/splash.1ns)
    and line of text instructing the user to press Enter. Before booting, the user
    has the option of pressing F1 (to see several boot options contained in the boot/splash.txt
    file) and pressing F2 to return to the original splash screen.

    - RAM disk—From append options with the slax label, a 4MB RAM disk is created
    (ramdisk_size=4444).

    - Kernel—The kernel is booted from the boot/mlinuz file. The kernel is a 2.6 kernel
    that includes support for Unionfs and Squash systems.

    - Initial RAM disk—The initial RAM disk files and directories are provided from
    the initrd.gz file (initrd=boot/initrd.gz). This file is unzipped and mounted
    as the root file system on the RAM disk. After this file is unzipped,'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# CHAPTER 9 Customizing a Security Live Linux CD


    the kernel can direct the linuxrc file (located at the root of this file system)
    to continue the boot process.


    # The linuxrc Script


    The linuxrc script does a lot of work to set up the systems for the live CD. Because
    the linuxrc script is derived from the same script that comes with Slack, the
    way BackTrack sets up its file systems is similar to that of Slack (and other
    distributions based on linux-live.org scripts).


    Most of the processing of the linuxrc script is done using functions defined in
    the liblinux script (also in the root of the initrd file). Here are some of the
    things that the linuxrc script does in BackTrack:


    +   - Mounts the /proc and /sys file systems.


    +   - Checks the debug option was given at the boot prompt. If it was, the rest
    of the script runs in debug mode.


    +   - Runs modprobe to load external modules. Many of the modules loaded are to
    use supported file system types (isofs, squashfs, unions, and vfat). If an NTFS
    file system is present, ntfs support is also added. It is also added for USB storage
    devices if the probeusb boot option was given.


    +   - The root file system (/) is ultimately set up as a tmpfs file system. First,
    individual squashfs file systems, representing /bin, /etc, /root, /usr, /var,
    and others, are mounted read-only from /base directory of the CD. Then they are
    merged with the writable /UNIONFS directory. (See Chapter 5, “Inside Live CD Components,”
    for descriptions of UnionFS and Squashfs.)


    Later, the entire root file system is converted to a tmpfs file system. The advantage
    of a tmpfs system is that it runs from system memory. This enables you to make
    the files and directories from the read-only medium (CD) writable. An advantage
    of tmpfs over other file systems that are stored in memory, such as the ramfs
    file system, which can write only to RAM, is that tmpfs can store files in both
    RAM and swap space. A tmpfs file system automatically expands if more space is
    needed (as long as memory is available).


    +   - An image appears behind text as it scrolls during the boot process. The
    location of the image is /etc/bootsplash/themes/Linux/config in the file bootsplash-1024x768.cfg.
    The actual images used are stored in the /etc/bootsplash/themes/Linux/images directory.'
