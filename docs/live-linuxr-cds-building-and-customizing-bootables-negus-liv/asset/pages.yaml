    The command just shown tells the qemu command to boot the file image named dsl-3.0.1.iso
    (from the current directory) and to boot it as an ISO 9660 CD image (-cdrom -boot).
    If you already burned the image to the CD, you can insert that CD into the drive
    and boot it from QEMU using the following command line:


    ```

    # qemu -cdrom /dev/cdrom -boot d

    ```


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_410_0.png)


    Although we are focused on CD images for this book, QEMU can also boot from hard
    disk. For example, if you had Gentoo installed on a second hard disk (/dev/hdb)
    while you worked on Fedora from the first hard disk (/dev/hda), you could launch
    Gentoo on your desktop by typing something:


