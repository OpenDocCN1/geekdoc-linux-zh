  md: '# CHAPTER 3 Customizing a Live CD


    The following procedure tells how to set up httttps Web server from your Knoppix
    live CD in a way that requires very little configuration change. It assumes that
    you have already configured your firewall to allow https (port 443) or www (port
    80) access to your server. To begin, boot Knoppix in a way that incorporates a
    persistent desktop, as described in the next section:


    +   1. To start the thttpd server immediately, type the following command:

    # sudo /etc/init.d/thttpd start

    2. To start the thttpd server so it starts every time you reboot Knoppix, type
    the following:

    # sudo ln -s /etc/init.d/thttpd /etc/rc5.d/S20thttpd

    # sudo ln -s /etc/init.d/thttpd /etc/rc0.d/K20thttpd

    # sudo ln -s /etc/init.d/thttpd /etc/rc1.d/K20thttpd

    # sudo ln -s /etc/init.d/thttpd /etc/rc6.d/K20thttpd


    The command just creates a link from the thttpd start-up script to the /etc/rc5.d
    directory in such a way that the thttpd server will run when Knoppix boots to
    the default run level (5). The other links stop the thttpd service when you move
    to a lower run level, including shutdown (0), single user (1), and reboot (6).


    +   3. Assuming that your network interface is already up and running, determine
    the address of your network interface as follows:

    # /sbin/ifconfig | grep "inet addr"

    inet addr:10.0.0.205 Bcast:10.0.0.255 Mask:255.255.255.0

    inet addr:127.0.0.1 Mask:255.255.255.0


    In this example, the IP address of the eth0 network interface is 10.0.0.205 (the
    loopback interface is 127.0.0.1, but this is not the number we are looking for).


    +   4. From a Web browser on your network, check that the Web server is working
    by displaying the index.html page. Do this by typing in the following in the Web
    browser''s location box:

    ://10.0.0.205/index.html

    Strictly speaking, index.html doesn''t have to be typed in for this to work. You
    should see the sample "Welcome to Your New Home in Cyberspace" page. If you do
    this shows that the server is working and available on your network.

    5. Next, replace the index.html file in the /var/www directory with your own index.html
    file, along with any other HTML content that is accessible from your Web server.
    Because the root user owns the directory, you need to use the sudo command to
    write to it that is the knoppix user.'
