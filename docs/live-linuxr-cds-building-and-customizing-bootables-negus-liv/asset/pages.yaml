    # Adding Content to the Live CD


    Content was added to the live CD by copying files to /var/puppets in your source
    KNOPPIX remastering directory (for example, /mnt/hda1/DSL/source/var/puppets).
    Digital images of puppets ended up in the /var/puppets/images directory of the
    CD, and an Impress presentation went into the /var/puppets/presentations directory.


    To be able to quickly create slide shows without creating multiple directories
    of images, I used the -graftpoints option to when creating the KNOPPIX image to
    insert into the live CD. Using -graftpoints, you can graft a directory of files
    from your hard disk onto the live CD at any point in the live CD''s file system
    that you choose.


