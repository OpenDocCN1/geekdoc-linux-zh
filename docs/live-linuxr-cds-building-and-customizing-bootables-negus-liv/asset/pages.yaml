    # SUMMARY


    By their nature, live Linux CDs usually run from a read-only CD or DVD, so making
    and saving custom settings and data that you create live CD sessions has always
    been an issue. By including popular desktop environments (such as KDE) and many
    configurable features (printers, network interfaces, and servers, for example),
    you have no shortage of ways to customize a live CD system.


    Live CD developers come up with innovative ways to keep the settings and files
    you create during a live CD session. The first solutions focused on backing up
    changed files to a compressed archive file. When the CD was rebooted, those files
    could then be restored to where they were needed. A more recent solution is to
    create a persistent desktop that relies on a writeable disk image stored on a
    local hard disk or USB flash drive.


    With persistent desktop images, changes are immediately applied to the writeable
    medium. When you reboot, the files are still available from their same locations,
    without having to back them up. Combining a writable file system image with a
    UnionFS file system means that the persistent desktop does not have to be restricted
    to the /home and /etc directories. Throughout the entire file system can be changed
    and merged with files from file systems mounted from read-only CDs and DVDs.


    Examples of customizing and saving customizations associated with a live CD in
    this chapter were been done using Knoppix. However, because other live CDs are
    based on Knoppix, these techniques work with other CDs as well. Later, the chapter
    also described techniques for customizing settings, files, and even applications
    for live CDs such as Damn Small Linux, Dybobolic, and Puppy Linux.'
  merge: -1
