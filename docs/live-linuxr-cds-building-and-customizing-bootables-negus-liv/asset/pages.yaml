    fb1280x1024, fb1024x768, and fb800x600 for Frame Buffer at various video resolutions).


    The following is part of inolinux.cfg file that comes with Knoppix:


    ```

    DEFAULT linux

    APPEND ramdisk_size=100000 init=/etc/init lang=apm=power-off

    vga=791 initrd=minirt.gz nomce quiet quiet BOOT_IMAGE=knoppix

