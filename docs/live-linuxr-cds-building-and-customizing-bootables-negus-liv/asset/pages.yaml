    RAM disk to include (or exclude) drivers or add commands to run. With that file
    unzipped and mounted as already, you can make any changes you like. When you are
    done, unmount the file (umount /mnt/mini) and zip up the file again (gzip /tmp/mininert).


    After the initial RAM disk is mounted, it''s time to start setting up the file
    system and additional drivers to run the live CD. Knoppix, Fedora, and live CDs
    built with other technology use a linux file to set up the live CD environment.
    How those components are directed to set up the Knoppix environment mostly comes
    from a script that is located in the root of the initial RAM disk: the linux file.'
