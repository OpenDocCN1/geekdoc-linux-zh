  md: '# Live Linux CDs


    label linux

    kernel vmlinuz

    append initrd=initrd.img quiet $kernel_params

    debug

    kernel vmlinuz

    append initrd=initrd.img INITRD_DBG=x $kernel_params

    label memtest86

    kernel memtest

    append -

    _EOF_


    In the previous procedure, I added cp lines to copy the boot.msg, about.msg, and
    splash.ls files to the CD''s /boot/isolinux directory. I also added a display
    line to indicate that the boot.msg file appears on the original boot screen. In
    addition, I indicated that about.msg files should be displayed when the F1 or
    F2 function keys are pressed from the boot screens, respectively. If you like,
    you can identify msg files for function keys up to F8.


    One argument I added to the end of the append line after the first label is the
    number 5. This causes the default label (linux) to be booted to initialization
    state 5. As a result, when we load CDs, I get a graphical first boot screen and
    graphical login screen instead of text-based first boot and login screen. You
    do this only if you have selected to install a graphical interface, such as the
    GNOMEDesktop Environment on your live CD. To force a non-graphical login, use
    3 instead of 5.


    You can pass other arguments to the kernel that is initially booted by adding
    other options to the append line following a label. For example, you could turn
    off certain features (such as nodma, nosci, or noapm). Chapter 1, “Starting Up
    Live Linux CDs,” describes boot options, although not every CD supports boot options.


    Another thing you might want to do is add your own labels. In this example, there
    are three labels: linux, test, and memtest86. The memtest86 label is used to have
    a memory test option from the boot prompt, as the regular Fedora CD does. You
    can add your labels to run a single bootable command (such as memtest) or use
    existing kernels that simply append different options (such as vga settings).
    Examples of boot labels you might want to add are described in Chapter 5.


    Notice that everything between the isolinux.cfg line and the final EOF is added
    to the resulting isolinux.cfg file. If you like, you can add another label, change
    the timeout, or add boot options to the vmlinuz lines. Refer to the isolinux section
    in Chapter 5 for further information relating to working with the isolinux.cfg
    file.'
