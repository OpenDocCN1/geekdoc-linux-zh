  md: 'Another way of doing file system compression on live CDs is with the Squashfs
    file system. Using Squashfs, directories, files, and even inodes are compressed
    (including files up to 4GB). It can provide greater compression than some other
    compressed file-system types by supporting block sizes up to 64K. Kadiski enables
    to create Squashfs file systems when you produce live CDs of Fedora or Red Hat
    Enterprise Linux.


    The following sections describe some details on UnionFS, Squashfs, and the clooper
    driver.


    # Using theUnionFS File System


    UnionFS (www.unionfs.org) is referred to as a stackable unification file system.
    When it is implemented on a live CD, it allows a combination of read-only and
    read/write branches to be joined to form a single file-system view to an end user.
    This enables end users to write to directories containing data from read-only
    CDs in a way that the entire file system appears writable.


    With UnionFS, changed and added data is actually written to a writable file-system
    branch, which can be stored on a separate medium from the read-only medium. With
    the new data stored separately, it can be used during the current session and
    even can be backed up so it can restore the next live CD is booted.


    More than dozen live CD projects (most notably, Knopp and its derivatives) incorporate
    UnionFS file systems. Earlier versions of these projects tended to have areas
    that could be written to (such as /home and /tmp directories) that were separate
    from directories taken from the live CD. Now, with UnionFS enabled at the root
    of the file system, files can be changed and added anywhere (given proper Linux
    file permissions). This greatly simplifies the capability to mix content from
    the live CD with new content, as software installed from standard packages.


    > NOTE

    As a quick aside, UnionFS has other uses beyond live CDs. For example, UnionFS
    can be used to merge multiple archives of music, images, or video so they can
    be accessed from a single point in the file system. Likewise, home directories
    from different disk partitions or networked file systems can be merged to form
    a single home directory structure.


    To use UnionFS on a live CD or other Linux system, UnionFS support must be added
    (it is not part of the basic Linux kernel). You can get the latest'
