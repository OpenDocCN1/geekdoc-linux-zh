  md: '# CHAPTER 11


    # # Customizing a Gaming Live Linux CD


    If you are interested in computer games, no shortage of opportunities awaits you
    in Linux. Hundreds of pleasantly diverting games are available, with practically
    no restrictions on how you use them. Games that can take advantage of hardware-accelerated
    video cards are also being produced for distribution as open-source games, to
    produce more eye-popping games.


    After you create a gaming live CD, you can hand your youthful bootable CD that
    plays tons of games you have hand-picked for them. Or you might create a CD to
    carry around your favorite open-source games so you don''t get bored when you''re
    on the road. So much open-source software is available for gaming these days that
    most gaming live CD distributions have grown into DVD distributions.


    This chapter takes several approaches to describing topics that you might find
    interesting when putting together your own live CD or DVD:


    +   * **Gaming live CDs—A handful of Linux gaming live CDs already exist that
    you can try.** With so much software available, many of the most popular gaming
    live CDs have expanded to DVDs. DVD versions of Games Knoppix (games-knoppix.unix.ag.uni-klde)
    is 2.7GB; the SuperGamer gaming live CD (www.pclinuos.com/forum/index.php?board=31,0)
    is about 3.7GB.


    +   * **Free games—Free and open-source games (distributed under the GPL or similar
    license) are quite plentiful for original games or clones of traditional computer
    games. You''ll find no shortage of solitaire games, maze games, board games, and
    the like. In recent years, more complex action and strategy games have been created
    for free distribution.'
  merge: -1
  pgno: 321
- img_proc: true
  md: 'If you want to put together a live CD that you can distribute freely, you can
    check out several lists of available applications. Later in this chapter, I take
    you through the selection of games that are included with the Linux Live Game
    Project CD.


    +   - **Commercial games and demos**—Many of the most popular computer games were,
    of course, created to sell them. Most commercial computer games were made for
    Microsoft Windows platforms, but some commercial games have been ported to Linux.


    Although it might not be legal to include most commercial Linux games on a live
    CD, in some cases you can get permission to include those games on a Linux CD.
    We describe some of the licensing issues surrounding redistributing Linux games
    later in this chapter.


    +   - **Classic commercial games**—You might be able to legally include on a live
    CD some commercial games that were originally created for PCs or game consoles.
    That''s not to say that it''s alright to just include a game on your live CD because
    a company isn''t selling it anymore. Most companies don''t simply relinquish their
    copyright because the game is no longer being marketed.


    In some cases, rights to classic games have been released into the public domain.
    In other cases, game console emulators are available in Linux, and you can purchase
    the games themselves to run on those emulators. In another case, parts of a commercial
    game might have been released into the public domain, while open-source clones
    of the parts that are still protected might have been created so the whole game
    can be freely distributed. Doom is—an example of such a game.


    +   - **Video card support**—A big impediment to getting support for 3D gaming
    in Linux is getting drivers for video cards that support hardware acceleration.
    Closed-source drivers for Nvidia and ATI graphics cards are available for Linux,
    but restrictions given redistributing those drivers and sometimes inhibit those
    drivers to play nicely with open-source video drivers on the same machine. Later
    in this chapter, I describe ways to get drivers to play more advanced 3D graphics
    games.


    To start, this chapter takes you through some of the available Linux live CDs.
    Then it describes open-source games that you can include on your own CD so that
    you can freely distribute your CD. The chapter includes a description of a Knoppix
    customization called the Linux Live Game Project (LLGP) live CD.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# CHAPTER 11 Customizing a Gaming Live Linux CD 30


    This chapter goes on to cover the issues that surround including software on your
    CD that was or is still covered under licenses other than GPL types of licenses.
    These types of games include games that are sold commercially or that have other
    licensing impediments that you might or not be able to work through.


    # FINDING LINUX GAMING LIVE CDs


    Linux CDs specializing in gaming applications range from pure open-source gaming
    CDs to those that include the capability to play commercial demos and 3D games.
    To use some of these live CDs, you need special graphics cards and lots of RAM
    to run effectively. The following sections contain examples of some live gaming
    CDs and DVDs.


    # GamesKnoppix Live CD and DVD


    The GamesKnoppix (http://games-knoppix.unix-ag.uni-kl.de) gaming live CD is available
    as both a live CD (700MB) and a DVD (2.7GB). Unlike many Knoppix remasters, GamesKnoppix
    removes the OpenOffice.suite (saving about 200MB alone) and a bunch of KDE applications
    to make room for lots of games.


    Besides including many open-source games (described later in this chapter), the
    GamesKnoppix KDE features demos of commercial games that run natively in Linux;
    you can try demos for games such as Marble Blast and Ghost Tanks (www.garagegames.com),
    as well as Mutant Storm and Space Tripper (www.pomgames.com). Be sure to use 3D
    graphics-accelerator hardware to run these games. (The demos aren''t available
    on the DVD.)


    To enable you to stretch the bounds of games that run natively in Linux, the GamesKnoppix
    DVD includes several computer and game console emulators. Select Emulators from
    the KDE menu to what is available. If you can find game ROMs (games extracted
    from console cartridges) or executables from supported computers, you can use
    the following emulators to run them:


    +   - Atari—Commands are included to run emulators of Atari 800, Atari 800 XL,
    Atari 130 XE, and Atari 5200 games systems. Many options are available for running
    the Atari console emulator. To be able to use the emulator, you need to have game
    ROMs that were made to run on those consoles.'
