    Running Falcon''s Eye requires DirectMedia Layer software support (www.libsdl.org).
    Read about the game from the Falcon''s Eye home page (http://users.tkk.fi/~jpelto2/nethack.html).
    To install the game from Debian repositories, request the falconseye package.'
