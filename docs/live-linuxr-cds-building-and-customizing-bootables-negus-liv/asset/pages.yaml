- img_proc: true
  md: 'This example shows just a few of the neat features in GRUB. You can find

    more options by typing info grub on a Linux system where GRUB is

    installed.


    +   6. Assuming that you have remastered Knappix (or other live CD) the way

    like you can now create the ISO image of your live CD. This is an example

    of mksoiso command you can use, using the example we created to this

    point:


    ```

    # cd /knoppix/master

    # mksoiso -R -b boot/grub/stage2_eltorito \

