  md: '# # Acknowledgments


    I''d like to acknowledge the work of the thousands of free and open-source software
    developers around the world who have built, tested, tweaked, and published their
    software so that everyone can use it freely. Because of their efforts, you and
    I have literally thousands of unique software packages to choose from as we build
    the live CDs in this book.


    Thanks to *Debra Williams Cauley* for encouraging me to do this book and start
    the *Negus Live Linux Series* with Prentice Hall. Her work has helped me to produce
    the kinds of Linux books I want to write, while still getting me to do them within
    the time constraints of the publishing world. Others from Prentice Hall who have
    helped me through this project include Songlin Qiu (development editor), Krista
    Hansing (copy editor), and Christy Hackerd (project editor).


    Direct help in writing and technical editing has come from several sources. Joe
    “Zonker” Brockmeier came through in a pinch and wrote the Firewall and Cluster
    live CD chapters. Jasper Hartline, a key developer on the Fedora Kadiski live
    CD, tech-edited the entire book. Chris Gellenoni, leader developer of the Gentoo
    installer (Catalyst), reviewed the chapter on building a Gentoo live CD (with
    the latest Catalyst software just recently completed). John Kennedy came in to
    provide last-minute technical assistance.


    Finally, I''d like to thank my family for helping me stay at it for the many years
    it takes to write a book.'
