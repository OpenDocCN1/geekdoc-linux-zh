  md: '# Building a Custom Knoppix Live CD


    Not only is Knoppix the most popular live CD to use, but it is also the live CD
    distribution that has seen the greatest interest in customizing and remastering.
    Unlike a Fedora live CD, in which you use scripts from the Kadiski project to
    essentially build a live CD from a Fedora install, the common way to remaster
    Knoppix is by copying, changing, and rebuilding files from a live Knoppix CD itself.


    The remastering process is different than the customization steps described in
    Chapter 3, “Customizing a Live CD.” Whereas customization can pull desktop settings
    or even applications into an existing Knoppix system, remastering lets you change
    what is in the Knoppix CD itself. The result is a live CD that can do everything
    you want to do, from start to finish.


    Much of the procedure shown in this chapter is derived from the Knoppix Remastering
    Howto (www.knoppix.net/wiki/Knoppix_Remastering_Howto), as well as others available
    on the Web. Refer to that document for further information on Knoppix remastering
    as it becomes available. The forum for Customizing and Remastering Knoppix is
    located at www.knoppix.net/forum/viewforum.php?f=2.


    Because the commands you use to remaster Knoppix are on the Knoppix CD itself,
    you can learn about other options for those commands using the man command while
    is running. In particular, you might want to check out man pages for mkisos (for
    creating ISO images) and create_compressed_fs (for compressing the KNOPPIX image).


    When you know how to create a basic custom Knoppix CD, information at the end
    of this chapter describes different ways of doing specialized customization. These
    include tips for using some custom scripts to make the setup process easier.'
