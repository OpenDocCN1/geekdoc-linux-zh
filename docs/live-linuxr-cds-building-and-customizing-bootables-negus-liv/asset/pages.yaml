- img_proc: true
  md: '# Live Linux CDs


    module it uses to fire up the NICs. (Type 1smod 1spci -v to get information about
    your network interface cards.)


    Go ahead and set up the NICs (remember, it''s a pain the first time, but you shouldn''t
    have to do it again) and then go back to the main configuration.


    Now it''s time to save your configuration and reboot. After you reboot, you should
    be ready to set up your firewall rules. You can save the configuration via the
    text menu or using the save-config command. You''ll want to use the menu option
    for the first go and use the save-config option after configuring your firewall-rules.


    The configuration is saved under etc.tar.bz on the hard drive or other media.
    This will come in handy later because you can do away with the need for a hard
    disk, floppy drive, or USB key by copying to another system and creating a new
    CD-ROM with the configuration already available on it. Devil Linux includes scp,
    so you can use scp to send the file to another machine.


    However, Devil Linux might not mount the drive, so you''ll need to mount it before
    you can copy the file. Assuming your media is the first partition on the first
    IDE drive, for example, you would use this:


    ```

    # mount -t ext3 /dev/hd1 /mnt

    ```


    Then use cd to change the /mnt directory and use scp to copy the file to another
    host:


    ```

    # scp etc.tar.bz username@host:/home/username/

    ```


    We return to that in a bit when we discuss making a custom CD. Now it''s time
    to set up firewall rules.


    # SETTING UP FIREWALL RULES


    You can set up your firewall rules in a couple of ways with Devil Linux. The first
    way is to configure it manually using iptables rules. That''s a fine option if
    you happen to be an expert at iptables, but most folks aren''t.


    The second option, and the one I recommend, is to use Firewall Builder, which
    is available at www.fwbuilder.org/. If you''re using Linux, Firewall Builder is
    probably available with your distribution. If not, the project has packages available
    for Windows and Mac OS X, though these are not GPLled; the Linux version is freely
    available under the GPL.'
  merge: -1
  pgno: 374
- img_proc: true
  md: 'Ubuntu and Debian users can grab Firewall Builder by running this:


    ```

    # apt-get update

    # apt-get install fwbuilder

    ```


    This also grabs any dependencies you might need for Firewall Builder.


    Firewall Builder has three templates that should get you started: a basic set
    of firewall rules that allows connections to the firewall only from the internal
    LAN and only via SSH, a more complex set of rules that also allows the firewall
    to serve as a base for DHCP and DNS server for the internal network, and a set
    of firewall rules with a DMZ for a machine with three interfaces.


    The templates assume a couple things: first, that you want to use the 192.168.1.0
    private subnet, and second, that you’re to use your IP address on the Network-facing
    interface using DHCP.


    Firewall Builder is a bit too complex to cover in depth, but it’s not too difficult
    to use. You should be able to master it in an afternoon if you are at all familiar
    with networking. When you have your firewall configuration, you can use Firewall
    Builder to publish it to the firewall and save the configuration.


    # CREATING A NEW CD


    The Devil Linux distribution ships with a script custom-cd. You might think mastering
    a new CD would be a royal pain, but it’s actually quite easy and takes only a
    few minutes, at worst. Note that you’ll need to be running as root or use sudo
    to run the script you’ll need to mount a directory for the ISO image while the
    new one is created.


    Earlier in the chapter, we discussed saving the configuration to another machine
    so you could create a new Devil Linux CD with your custom configuration. We use
    that as an example of how to create CDs. You can also use this process to add
    software or replace other configuration files or packages.


    To start, you need to be in the Devil Linux directory, which should be something
    like /home/username/devil-linux-1.2.10-1586-SMP/ (This differs from the version
    of Devil Linux that you are using).


    Create a new directory to hold any files that need to be added to the ISO image.
    Note that you need to replicate the CD-ROM structure under the new directory,
    so if you want to add a file under, /home/home, you would add it under /new/home.


    To replace the Linux default configuration, replace the etc.tar.bz file you created
    earlier under the new directory, and make sure you have a directory under /mnt
    (or anywhere, really, but /mnt is standard) for the script to mount the ISO'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# Live Linux CDs


    image. I usually just use devil, which is what the script defaults to, but you
    have the option of giving it a different name if it suits you.


    Now run ./custom-cd as root, or sudo ./custom-cd if you use a distro such as Ubuntu
    that doesn''t use the root account by.


    You''ll see a series of prompts:


    ```

    jzb@kang:~/local/devil-linux-1.2.10-i586-SMP$ sudo ./custom-cd

    Enter location of existing CD drive or ISO image [/bootcd.iso] ->

    Enter your new ISO image [/bootcdnew.iso] -> ./newboot.iso

    Enter location where you mount CD/ISO [/mnt/dev/] ->

    Enter location of directory with new files [/new] ->

    Enter temporary location to hold the files [/tmp11832] ->

    ```


    Notice that I changed the name of the new ISO to newboot instead of bootcdnew.iso
    because I already had a bootcdnew.iso.


    Then you''ll see a bunch of status messages and a mkisos message about the options
    used. You can safely ignore these. At the end, you should get a final message
    that the new ISO image has been created.


    Depending on the speed of your machine, it can take 5 minutes, or it can take
    considerably longer. On your Athlon 6 3000+ with 2GB of RAM, it takes about 10
    minutes to generate a new ISO image.


    You definitely want to be sure that you''ve got the configuration that you want
    before you burn the ISO to CD-R. Descriptions in Appendix B, "Building, Testing,
    and Burning ISOs," can help you QEMU or VMware to test your Devil ISO image. Refer
    to this appendix for information on burning the ISO image to CD.


    # Other Firewall Distros


    As I mentioned at the beginning of this chapter, you might consider a number of
    other distros if Devil Linux doesn''t meet your needs—or if you want to sample
    other approaches to setting up a live CD firewall.


    Coyote Linux (http://www.coyotelux.com/) is a good solution if you need to run
    a firewall for a small home network and you don''t want to modify it or redistribute
    it. The licensing for Coyote means that it''s not very flexible and it''s not
    suitable for use in commercial environments. It''s, however, a really easy-to-use
    firewall/router combo, so consider it if you''re just looking for a quick "set
    it and forget it" solution for the home. I used Coyote (the floppy version) for
    more than a year, and it was dead easy to use.'
