  md: '# Live Linux CDs


    Because of limited space on live CDs and the need to write to what the CD saves
    as read-only files and directories, the types of file systems used with live CDs
    are very important. To be able to compress file system data, some live CDs compress
    their file systems into single archives that can be decompressed-on-the-fly using
    the cloop driver. Other live CDs use the Squashfs file system to provide a read-only
    file system to use.


    To be capable of writing to files and directories from the CD, some live CDs use
    the UnionFS file system. Using UnionFS, a file system can join read-only and read/write
    branches to give the user the appearance of a completely writeable file system.
    This also provides a means of saving changes to files and directories so that
    they can persist across reboots.


    When you set out to remaster an existing installer or create one using a Linux
    installer, the Linux distribution you choose to base your live CD on is very important.
    This chapter described the different tools, software repositories, and software
    packaging formats available with Knoppix (Debian), Fedora, and Gentoo.'
