  md: '# CHAPTER 7 Building a Basic Fedora Live CD


    +   **Compressed files**—Any files and directories that need to remain writeable
    are copied to a single directory and compressed to the kadishi.tar.gz file (using
    the myfile.py script). Then the entire file system is compressed into a single
    file, and files such as the kernel and initrd.img file (that are not compressed)
