  md: '# ADDING SOFTWARE TO A BACKTRACK LIVE CD


    Using the customization and remastering techniques described in Chapters 6, “Building
    a Custom Knoppix Live CD,” through 8, “Building a Basic Gentoo Live CD,” for Knoppix,
    Fedora, and Gentoo live CDs, you can add the components described in this chapter
    (as well as other components) as you choose. In some cases, software packages
    will already be available for your chosen live CD type (Deb, RPM, or Emerge packages).
    In other cases, you can download the software you want from the Project Web sites
    mentioned with many of the components described.


    Because BackTrack is based on a slackware (in particular, SLAX live CD) distribution,
    I next describe how to add SLAX-based packages to a BackTrack live CD. This way,
    you can download and run any packages (referred to modules) available from the
    SLAX repository.


    The technique for adding software modules to a SLAX-based live CD such as BackTrack
    is much easier than the remastering for Knoppix (using a chroot environment) in
    Chapter 6. You can add SLAX modules to your BackTrack live CD in two ways:


    +   * **Remaster**—Add a SLAX module to the /modules directory on the live CD.
    You copy the contents of your BackTrack live CD to a directory on your hard disk,
    adding the SLAX module to the directory, and re-creating the ISO image (using
    makeiso); the software in the module you added is installed when you boot that
    live CD.


    +   * **Live**—You can download any SLAX module and install it live using the
    livemod command while BackTrack is running. The software in that module then is
    immediately available for use.


    To find available software modules that will work with BackTrack and other SLAX-based
    live CDs, go to the SLAX modules page (www.slax.org/modules.php). There will find
    15 categories of software you can add to your live CD or to the /modules directory
    when you remaster. To install a module immediately, the software you want (either
    select the category or use the search box to find what you want). Then download
    the module you choose.


    With the module you want to install in the current directory, you can use the
    livemod command to install the module. For example, you could type the following
    to install the eMovix package:


    ```

    # elivemod eMovix_0_9_0

    ```'
  merge: -1
