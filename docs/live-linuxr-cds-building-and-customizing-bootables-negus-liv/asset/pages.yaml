  md: '# Live Linux CDs


    To focus on games, LLGP developer Fabio Fabbri removed office and multimedia applications
    to make lots of room for games. He added multiple available LLGP backgrounds and
    a separate Games menu to the panel. He also put a Gamesukebox icon on the panel
    so you can select a random game to start. To speed up the boot process, kudzu
    hardware detection was completely removed, leaving all hardware detection only
    by hotplug and udev.


    Although LLGP includes Nvidia drivers, which were included in a more thoughtful
    way than I have seen with other CDs. For example, I tried LLGP on my old Intel
    i310 computer, and no apparent conflicts arose with Nvidia drivers. Typing glxinfo
    showed that direct rendering was on (Yes) and GLX extensions were enabled, so
    I could play games requiring DRI and GLX (albeit, rather slowly, given the slow
    processor and low RAM amounts). See the LLGP Nvidia discussion for more information
    (~tuxgamers.altervista.org/LLGP_Nvidia_packages).


    If you have questions about LLGP, you can go to the Tuxgamers forum to ask questions
    or see what others are discussing about LLGP (http://tuxgam.altervista.org). English
