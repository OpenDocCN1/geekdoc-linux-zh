  md: 'To sniff secure shell (SSH) traffic, the sshmit utility (part of the dsniff
    package) can be placed between an ssh client and server. By acting as the real
    ssh server, sshmit can grab the password information from an unsuspecting client
    and then complete the transaction for the client with the real server without
    the client suspecting that anything has gone wrong. The aftercap utility (http://ettercap.sourceforge.net)
    is a graphical utility that can similarly do man-in-the-middle but aftercap can
    grab whole sessions as well as the password information.


    As the name implies, URLsnarf (urlsnarf command) can grab Web information requested
    on a selected interface (matching any pattern you like). XSPy (xspy command) can
    track everything typed into an X display and echo that information back to the
    shell where xspy is running.


    To save files that are transferred using the NFS protocol, you can use the filesn
    command. Using the msgnarf command, you can save messages and chat sessions from
    many different IRC and messaging protocols. With mailsnarf, you can sniff SMTP
    and POP traffic to save e-mail messages. All three, mailsnarf, filesn, and msgnarf,
    are part of the dsniff package.


    # Wireless Network Tools


    You can use tools for working with wireless networks to try to analyze traffic,
    crack passwords, forge packets, and switch to different driver configurations
    on your wireless cards. You can see tools available in BackTrack for working with
    wireless LANs on the Wireless Tools menu (K menu -> BackTrack -> Wireless Tools).


    Kismet is a popular tool for working with wireless interfaces. With Kismet, you
    can detect intrusions on 802.11 wireless networks (802.11b, 802.11a, and 802.11g).
    Kismet collects packets passively to detect hidden networks. It detects networks
    using standard names and cancloak hidden networks over time. Data you log with
    Kismet is compatible with Etter and tcpdump.


    To test password strength of the nodes on a wireless LAN, you can use tools such
    as WepAttack (http://webpattack.sourceforge.net), Wep_crack and Wep_decrypt (http://www.lava.net/~newsham/wlan,
    as part of the wep_tools package), and Weplab (http://weplab.sourceforge.net).
    Each of these tools provides a different set of options for testing the security
    of the passwords used on your wireless networks.


    Some miscellaneous wireless tools are available from the Miscellaneous submenu.
    The macchanger utility (www.allobs.com/macchanger) lets you view and change the
    MAC addresses of network interfaces. If you have a GPS device'
  merge: -1
