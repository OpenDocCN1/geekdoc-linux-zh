    # Doing Spoofing


    One way to break into networks or systems is to run programs in which the program
    pretends to be something it’s not, such as a legitimate DNS server or DHCP server,
    in hopes of fooling an unsuspecting application or user or giving you critical
    information. BackTrack includes a whole set of spoofing tools (K menu → Backtrack
    → Spoofing) that you can try out to test for vulnerabilities in your systems.


    The arspoof program (part of the dsniff package from www.monkey.org/~dug-son/dsniff)
    tries to trick another computer into believing that it is the gateway machine.
    It does this by constantly sending the victim machine its IP address as that of
    the gateway. When the victim machine eventually caches the arspoof machine’s MAC
    address as that of the gateway, the victim starting its IP packets to the arspoof
    machine instead of the real gateway.


    The dhcp program (from www.phenoelit.de/irpas) is a DHCP flooder. This technique
    is also referred to as a DHCP exhaustion attack. The dnsspoof command tries to
    convince other systems on the LAN that it is the DNS server by faking replies
    to various DNS address queries and pointer queries.


    Using the fragroute command, you can change it, and rewrite traffic in the LAN
    that is destined for locations outside the LAN. This type of network traffic is
    referred to as egress traffic. Although fragoute has an effect on only packets
    that originate on the local machine, the fragrouter command can work on other
    machines as well.


    Check the Spoofing menu for other types of spoofing you can also do well. For
    example, some commands try to redirect ICMP traffic, and others try to gain control
    by replaying TCP/IP packets.


    # Network Sniffers


    As its name implies, a network sniffer watches a network, trying to “sniff” for
    information being passed on that network. That information can be used for evil
    (in the case of someone trying to steal data or connection information) or good
    (to uncover a potential problem on the network). In some cases, employ sniffers
    to make sure employees aren’t doing anything against company policy with their
    computers.


    BackTrack includes more than a dozen sniffers that you can use to watch network
    traffic of various kinds. Check the Sniffers menu to see which ones BackTrack
    includes (K menu → BackTrack → Sniffers).'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# CHAPTER 9 Customizing a Security Linux CD


    You can use the AIM Sniffer (aimsniffer command) to log and capture traffic from
    AOL Messenger sessions. Driftnet (www.ex-portal.com/~chis/driftnet) is a graphical
    utility that listens for images in TCP traffic and displays those it finds in
    the Driftnet window. Figure 9-8 shows the images that appeared on the Driftnet
    window after selecting Wikipedia from a local Web browser.


    # FIGURE 9-8


    Display images encountered in TCP traffic with driftnet.


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_297_0.png)


    The dsniff command (http://monkey.com/~duong/dsniff) is a password-sniffing command
    that can listen for passwords on a variety of services. Those services include
    FTP, TELNET, SMTP, HTTP, POP, X11, AIM, ICQ, and others. With dsniff running,
    it automatically detects the protocols it is sniffing, picks out only relevant
    password information, and saves that information to an output file in Berkeley
    DB format.


    Ethere (www.ether.com) is a graphical tool for capturing Ethernet traffic on selected
    interfaces. The Ethere window contains tools for filtering, sorting, and analyzing
    network traffic. Ethere also allows the use of plug-ins, which can be used for
    many purposes, including outputting the data gathered by Ethere in various ways.


    Iptraf (http://iptraf.se.org) is an IP network statistics utility you can use
    to monitor the traffic on your network. The utility is ncurses-based, so it can
    run in any shell (no need for a GUI). Using the iptraf command, you can watch
    for specific types of traffic or watch only on selected interfaces. Log information
    is placed in /var/log/iptraf unless otherwise specified.


    You can use other specialized sniffers in addition to those mentioned. The SMB
    Sniffer (start-smb-sniffer command) watches for traffic relating to Windows file-
    and printer-sharing activity. The mailsniffer captures mail traffic based on interfaces
    you choose and specific patterns you are looking for. The Phoss utility (www.phenoelit.de/phoss)
    watches network interfaces for clear-text passwords.'
