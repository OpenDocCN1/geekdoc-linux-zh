  md: '# Live Linux CDs


    one you want to write. You can use a device name (such as /dev/cdrom) to indicate
    the drive or the SCSI device name. To determine the SCSI device name for your
    writable CD and DVD drives, you can use the scanbus option, as follows:


    # cdrecord -scansbus

    cdrecord-Clone 2.01-dwr (i686-pc-linux-gnu)

    Copyright (C) 1995-2004 Jorg Schilling

    scsideo: ''ATA''

    devname: ''ATA''

    scsibus: -target 2 lun: -2

    Linux sg driver version: 3.5.27

    Using libscg version ''shily-0.8''.

    scsibus:


    +   - 0,0 100 '' LITE-ON ''DVDRW SOHW-1633S'' ''BSOC'' Removable CD-ROM

    - 1,1 101 *

    - 1,2 102 *

    - 1,3 103 *

    - 1,4 104 *

    - 1,5 105 *

    - 1,6 106 *

    - 1,7 107 *


    In this example, only one CD/DVD writer is found, at the SCSI address 1,0,0. That
    indicates SCSI bus 1, target 0, and LUN 0. So using the dev= option, you can identify
    that as either dev=1,0,0 or dev=/cdrom on the cdrecord command line. The SCSI
    address format is preferred, for the simple reason that there is no guarantee
    that the Linux system you are using will use dev/cdrom to access the CD you want.


    To see a complete list of options, type cdrecord -help. To find the number of
    cdrecord, use the dev-help option. For information on SCSI transport specifies,
    you can use the driveropts and -checkdrive options to check for options that are
    specific to a dev. For example, to check options for the drive located at /dev/cdrom,
    type the following:


    # cdrecord dev=/dev/cdrom driveropts=help -checkdrive


    Driver options:

    burnfree Prepare writer to use BURN-Free technology

    oburnfree Disable using BURN-Free technology

    forcespeed Tell the drive to force even for low quality media


    When no speed option is given, cdrecord tries the maximum speed that it can detect
    is available for the drive and medium you are using. At times this value may be
    incorrect, or you might be getting write errors and want to change the speed yourself.
    In particular, I noticed that the maximum speed for some DVDs is not'
  merge: -1
  pgno: 416
- img_proc: true
