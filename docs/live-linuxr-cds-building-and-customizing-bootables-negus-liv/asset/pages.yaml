  md: '# CHAPTER 10 Customizing a Presentation Live CD


    The purpose of the mylaunch script is to read options set from the kernel boot
    line and then start up a presentation for puppet option that appears on the line.
    Those options are stored in /proc/cmdline. If you typed cat /proc/cmdline, you
    would see all the options from the label you booted.


    The mylaunch script starts with several functions for reading values from /proc/cmdline.
    These functions come from the libinuxlive script that is part of the Linux Live
    CD project (www.live-org). In the Presentations section of the script, the script
    currently looks for two options.


    If puppet-slides set, the gview command runs a slide mode (-s) in full-screen
    mode (-f) using all images placed in the /var/puppets/images directory. If puppet=impress
    is set, the suffice command is run in Impress mode (-impress) as a full-screen
    slide show (-show) to display the pp.xi OpenOffice.org Impression presentation.


    When the selected presentation is finished running, the Fluxbox window starts.
    After that, you can begin using the desktop.


    Because someone might want to run another presentation or slide without having
    to reboot, the PuppetiX desktop has been modified to all users to run other presentations
    from the desktop or restart the original presentations. That desktop has also
    been tuned to include a different Fluxbox theme, to match the content of the PuppetiX
    live CD.


    # A Custom Fluxbox Theme


    Instead of just exiting when the slide show or presentation is done or dropping
    you into a Damn Small Linux desktop, PuppetiX contains a custom desktop. Using
    a theme fashioned after the DSL theme, the Puppet theme includes an appropriate
    background image and a menu that lets you launch any of your presentations from
    the desktop.


    System-wide Fluxbox themes are stored in the /usr/share/fluxbox directory. Themes
    are in the styles subdirectory of that. By copying the default file, you can create
    your own theme file and modify it as you like. In a theme file, you can change
    attributes that relate to toolbars, menus, windows, and fonts. You can even set
    the image used as the root window.


    I created a style named Puppet, modified it to include attributes that worked
    for a presentation CD, and copied it to a file named default in the same directory.
    In particular, I added puppet.xpm image to the backgrounds directory and this
    line to the Puppet theme file so it would be loaded each time the Fluxbox desktop
    started:


    ```

    rootCommand: xsri -scale-height=100 scale-width=100

    /usr/share/fluxbox/backgrounds/puppet.xpm

    ```'
