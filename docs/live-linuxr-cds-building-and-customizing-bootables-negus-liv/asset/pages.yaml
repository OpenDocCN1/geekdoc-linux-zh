  md: '# Live Linux CDs


    For the purposes of this procedure, however, I have created an RPM containing
    the Kadiski tools that you can install on Fedora Core 6 system. Although the software
    in this RPM works as of this writing with Fedora Core 6, if you want the latest
    software (or if updates to Fedora Core 6 break the Kadiski RPM provided with this
    book), refer to the Fedora Project''s Kadiski page to get the latest software.


    From a running Fedora Core 6 system, you can install the Kadiski RPM using the
    DVD included with this book. For example, with the DVD inserted, type the following
    from a terminal window:


    ```

    # rpm -Uv /media/LiveCDs/RPMS/kadiski*rpm

    ```


    The Kadiski software you used to create your live Linux distros is installed in
    the following locations:


    +   - /etc/kadiski—Contains configuration build files used to create your live
    Linux CDs.

    - /usr/share/kadiski—Contains scripts and examples to configure your live Linux
    CD.

    - /usr/sbin—Contains the kadiski command, which is used to build the ISO image
    containing your live distribution.

    - /usr/libexec/kadiski—Contains some commands used in the process of building
    the live CD. These include eject-live-cd, find-live-cd, and scanswap.


    In addition, kadiski and kadiski.conf man pages are in the /usr/share/man directories.
    The next section describes how to set up the Fedora Core software repository you
    will draw from to create your live Linux CDs.


    # Setting The Fedora Core Repository


    Through the Fedora Core anaconda installer, Kadiski can grab the Fedora packages
    it needs to create your live CD from a software repository on your hard disk,
    removable medium (CD or DVD), or network location (via NFS, HTTP, or FTP protocols).
    For the purpose of this procedure, I describe how to copy the Fedora Core distribution
    to your hard disk and use it from there to create your live CD.


    > NOTE You can download the complete Fedora Core 6 installation DVD from a Fedora
    mirror site (see http://fedora.redhat.com/download/mirrors.html). The Fedora Core
    DVD is also packaged with several books on Fedora, such as the Fedora 6 and Red
    Hat Enterprise Linux Bible, by Christopher Negus (Wiley Publishing).'
