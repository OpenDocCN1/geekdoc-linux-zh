    distributed operating systems such as Linux possible. However, writing software
    from scratch and licensing that work under the GPL still might not make it possible
    to freely distribute software. In no area of free software development are issues
    more contentious than multimedia.


    Problems related particularly to free distribution of audio and video codecs (coders/decoders)
    from several issues, including these:


    +   - Patents—Many of the audio and video standards that are used for creating
    and paying commercial music and video contained patented technology. Anyone writing
    music and video players is subject to claims from those royalty holders to pay
    for every player or encoder the software creator distributors


    +   - Digital Millennium Copyright Act (DMCA)—The DMCA is an act of the United
    States Congress in 1998 that made it illegal in the U.S. to create technology
    to circumvent copyright-protection measures.


    The threat of software patent claims has been looming over the free and opensource
    software movement since people began distributing free software. To fight the
    long-term battle today, major software vendors have been gathering patent portfolios
    relating to everything from database structures to how you click to buy something
    on the Internet. In the short term, however, some of the most litigious types
    of software components have been those related to licensing to multimedia.


    In theory, you should understand the licensing arrangements associated with every
