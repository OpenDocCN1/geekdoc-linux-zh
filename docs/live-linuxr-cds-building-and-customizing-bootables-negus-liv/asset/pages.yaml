  md: '# Live Linux CDs


    +   Runs POST—The Power-On Self Test (POST) is a routine that initializes and
    tests the hardware components attached to your PC. If something goes wrong, an
    error code is written to IO port 080h (that can be displayed with special hardware).
    An error message is also typically displayed on the screen.


    +   Beeps—To indicate that the speakers are working, BIOS sends a beep to the
    speakers after POST completes.


    +   Checks boot order—The default boot order for your PC might attempt to boot
    from the floppy drive, the CD drive, and the hard disk. a newer BIOS might also
    offer the option to boot from many different devices (USB drives, Zip drives,
    and so on) but typically requires you to change the order yourself by going into
    setup mode.


    +   Boots the indicated device—By going through each boot device in order, BIOS
    looks for boot information on each device and attempts to boot the operating system
    or boot loader indicated by that device.


    Because our interest here is live CDs, let''s assume going forward that a CD is
    inserted into the CD drive and that it is the first bootable media encountered.
    A BIOS that implements the El Torino specification looks at the CD to determine
    whether it has boot information available. If the CD contains no boot record value,
    the BIOS bypasses the CD, moving to the next bootable device. However, if the
    CD contains one of the following types of boot information, the BIOS attempts
    to boot from that CD:


    +   Single boot image—If a single boot image is encountered, the BIOS accesses
    the boot record volume, in turn, checks the location of the boot catalog. The
    boot record volume, in turn, checks the boot catalog on the CD and starts the
    initial/default entry. Entry points to the boot disk image on the CD that starts
    the operating system.


    +   Multiple boot images—As with the single boot image, here the BIOS checks the
    boot record volume to find the boot catalog. However, if the boot catalog contains
    multiple boot entries, a boot loader can be used to enable the user to select
    the boot image to start. Boot entries can point to multiple available boot images
    to start. Those images can exist on the CD or other devices (such as a hard disk).


    To access different boot images on the CD, the BIOS can use INT 13 calls. If the
    BIOS has problems booting from a multiboot live CD, often there will be errors
    related to INT 13 calls.


    The format of Linux live CDs is compatible with the ISO 9660 standard. The El
    Torino spec is incorporated into the ISO 9660 standard to make the CD'
