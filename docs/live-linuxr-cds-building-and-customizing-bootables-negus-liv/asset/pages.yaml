    # STANDING FILE SYSTEMS FOR LIVE CDs


    A live Linux CD can include any type of file system that Linux supports (ext2,
    ext3, reiserfs, FAT, and so on). However, two facts about operating systems that
    run from read-only, limited-space environments (live CD-ROMs do) make it useful
    to include special kinds of file systems:


    +   - Read-only—A CD-ROM itself cannot (in most cases) be written to after the
    image has been burned on. Because the file system used by the live CD is stored
    on the CD, you cannot save and modify files from that file system as you would
    file systems stored on a hard disk.


    Ways to get around the problem of running from a read-only medium include loading
    the entire file system into RAM (which might not be reasonable with a 700MB CD)
    and having only selected directories available from RAM (such as home and temporary
    directories). The second solution, might not allow you to install software that
    needs to reside in multiple directories.


    +   - Limited space—Compressed file systems can be used to allow more data to
    be saved on live CDs. Knopp has used the create_compressed_fs command to create
    a compressed cloop-compatible version of its file-system image. When Knopp is
    running, the cloop module decompresses files as needed-on-the-fly. This allows
    nearly 2GB of compressed data to be on a 700MB CD.'
  merge: -1
