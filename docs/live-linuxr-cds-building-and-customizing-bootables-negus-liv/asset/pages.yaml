  md: '# CHAPTER 12 Customizing a Multimedia Live CD


    # MULTIMEDIA PLAYER LIVE CD


    For multimedia-player live CDs, you basically want to include player applications
    (music, video, and image players) and ways to get content. The other issue is
    hardware support. To get the most out of a multimedia player, you might want to
    include support for special video cards, sound cards, PCMCIA cards, and TV tuner
    cards.


    Open-source music and image players are plentiful. There are also open-source
    video players, getting the codecs you need to play certain kinds of video content
    can be more problematic (on that later). As for how you get the content to play,
    a multimedia player offers one or more of ways of getting content:


    +   **On the live CD**—If you are remastering a live CD and you have space available,
    you can add as much content as you can fit on the live CD itself. You can then
    play the content without needing to access any medium other than the live CD itself.

    The EMoviX project, which is a spin-off of the MobiX project, is an example of
    a media player designed to let you add video to a live CD so that the video plays
    directly when you boot up. The GeeXBox project produces the GeeXBox Generator,
    which lets you add codecs and content to a personal GeeXBox live CD.


    +   **CDs or DVDs**—Because most commercial music and movies come on CDs and DVDs,
    respectively, any valid music or movie player needs to deal with that. Tiny live
    CDs like GeeXBox and MobiX run completely in RAM, so the CD or DVD drive is free
    for inserting the media you choose.


    +   **Hard disks or other storage media**—By detecting and automatically mounting
    harddisk partitions, a multimedia player live CD can let the users browse the
    computer''s hard disk for the content they want to play. As long as the live CD
    includes support for file systems that are on the hard disk (in particular, NTFS
    supported for most Windows systems), you can play any content added from your
    computer''s operating system (usually Windows).


    Most multimedia live CD includes support to connect the live CD system to a LAN
    or the Internet. Support for wired cards typically lets you configure your network
    connection (or do it automatically via DHCP). Wireless network support is less
    common but available in some cases with PCMCIA cards. After that, you can use
    applications for grabbing content from the network. Those applications might include
    the following:


    +   **Network file systems**—If your LAN supports file-sharing applications such
    as Windows file sharing (Samba, SMB, or CIFS) or Linux file sharing'
