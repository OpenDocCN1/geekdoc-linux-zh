  md: '# CHAPTER 5 Looking Inside Live CD Components


    +   **Linux From Scratch (www.linuxfromscratch.org)**—If you really want to make
    decisions about every aspect of the live CD you create, Linux From Scratch provides
    a way to do just that. As the name implies, Linux From Scratch (LFS) helps you
    pull together the software you want and compile it and configure into a useful,
    installed system. You can then package that system into a live CD.


    You can get instructions for creating an LFS live CD from the Linux Scratch site
    (www.linuxfromscratch.org/livedc/documentation.html). The basic procedure involves
    installing an LFS system (complete descriptions are available), adding packages,
    and modifying boot scripts and systems settings to your needs.


    When the basic LFS system is in place, you create an initial script (one is supplied
    to start with) that you set up the CD environment. Then, with other live CDs,
    you configure your boot loader and the LFS file system into an ISO image.


    LFS relies on Squashfs to create a compressed, read-only file system. Instead
    of using initrd as the initial RAM disk, LFS uses initramfs to provide the basic
    file-system environment when the live CD first boots and before the final file
    system is mounted. Instead of a inituxx file, LFS uses an init file (created in
    C language) to set up the environment.


    +   **Linux Live Scripts (www.linux-live.org)**—Linux Live Scripts provide a means
    of creating a live CD from any installed Linux system. The Slax project (www.slack.org)
    uses these scripts to create several different Slax CDs based on the slackware
    distribution.


    To build a live CD using the Live scripts, you need an installed Linux system
    with a kernel that includes support for UnionFS and Squashfs systems. Download
    the archive containing the latest scripts from the linux-live.org, unpack the
    archive, and run the ./run.sh script to get


    The approaches to creating your own live CD that the chapter illustrate were chosen
    because they let you leverage a lot of work that has been done for other Linux
    distributions. Unless you are purely in it for the learning process of how Linux
    works, you can start creating your live CD with Linux distributions that have
    thousands of software packages ready, well-tested installers, and proven components
    for compressing, booting, and running live CD.


    The following sections provide brief introductions to the different software-packaging
