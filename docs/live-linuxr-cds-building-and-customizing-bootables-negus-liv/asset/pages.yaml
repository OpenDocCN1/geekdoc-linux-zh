  md: '# Customizing a Firewall Live Linux CD


    Live Linux CDs make an excellent choice for a firewall, for a number of reasons.
    First, most firewall-specific distros require very little software, so they fit
    quite well on a single CD-ROM. Second, performance isn''t much of a factor because,
    again, not a lot of software is involved in setting up a Linux-based firewall;
    the system shouldn''t need to read from the CD-ROM very often, so it shouldn''t
    take a performance hit in reading from CD-ROM instead of a hard disk.


    Third, on the CD-ROM is write-only, so you don''t have to worry about an intruder
    tampering with the software included with the live CD distro. Finally, you don''t
    usually need to write data to disk with a firewall distro, so you can make use
    of a system that doesn''t even have a hard drive.


    Customizing a firewall CD can include putting new packages on the CD or just hard-wiring
    your configuration so that you don''t need to read additional data off a hard
    drive, floppy, or USB flash drive.


    In this chapter, we look at the Devil Linux distribution and how to use and customize
    it, and we briefly discuss some of the other options in the live CD firewall arena.


    # CHOOSING A FIREWALL COMPUTER AND LIVE CD


    Let''s start the chapter with hardware requirements and then look at how to select
    a firewall live CD.


    If you''re looking to set up a firewall for your home office or small business,
    a Linux live CD and an older PC with two network interface cards (NICs) will just
    do fine. Unless you''ll be setting up a firewall and/or gateway for a fairly large
    network,'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# Live Linux CDs


    a used Pentium or Pentium II computer with at least 32MB of RAM is usually sufficient
    to provide decent performance. For my home network, I use a Pentium III clocked
    at 350MHz, with 384MB of RAM and two 10/100 Ethernet cards.


    This is probably overkill because the firewall serves only two users and a handful
    of computers, but it''s the oldest machine I had lying around when it came time
    to set up a firewall.


    After you select your hardware, it''s time to choose the distro. You have the
    following options when it comes to using a live CD for your firewall:


    +   **General live CD**—Choose a general-purpose Linux CD such as Knoppix and
    customize it to suit your needs.

    **Specialized firewall CD**—Grab a specialized live CD specifically tuned for
    use as a firewall.


    If you''re using a live CD for your desktop and you have only a single computer,
    you might want to configure firewall rules in Knoppix (for example) and leave
    it at that. If you''ll be setting up a dedicated firewall, you probably want to
    go ahead and use a distro that''s specifically set up for the task.


    I spent a fair amount of time considering the options and finally chose Devil
    Linux as the firewall of choice, for the following reasons:


    +   **Flexibility**—Devil Linux is very flexible. It can run off a live CD or
    a USB flash drive. The configuration can be stored on the CD, on a USB drive,
    or on a floppy disk. You don''t need a hard drive in the system at all, although
    you can take advantage of the hard disk for storing data if it''s present.

    **Customization**—Devil Linux also has a customizable build system, so you can
    easily create a custom Devil Linux distro that fits your needs. It''s not too
    hard to customize a lot of distros, but the fact that Devil Linux is specifically
    designed to be customized makes it much more attractive.

    **Development community**—I also like the fact that Devil Linux seems to have
    an active development community. If you look on DistroWatch at some of the other
    firewall CDs, you''ll probably find that they haven''t had a new release in a
    year or more. As we all know, things move quickly in the Linux world, and any
    distro that doesn''t keep up with kernel development and other software updates
    is not very attractive.

    **Security patches**—Devil Linux also uses the GRSecurity (www.grsecurity.net/)
    patches for the Linux 2.4.x series kernel, to prevent'
