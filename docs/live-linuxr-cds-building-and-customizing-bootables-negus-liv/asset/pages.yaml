    The system being emulated either a standard PC with an IDE bus or a PC with an
    ISA bus (by adding the -M ispc option).


    QEMU can operate in user mode (allowing it to run processes created for one CPU
    type on a different CPU) or full system emulation (the CPU and peripherals). Often
    people use QEMU in user mode to WINE, allowing them to install and run Windows
    applications, or DOSEMU, to run DOS applications. However, for the purposes of
    testing live CD images, this book describes QEMU in full system emulation.


    For Linux distributions described in this book, preprint binaries are available
    for QEMU. With an Internet connection, you can install binary packages of QEMU
    from Debian/Knoppix, Fedora, and Gentoo, respectively, using the following commands:


    +   # apt-get install qemu

    # yum install qemu

    # emerge qemu


    Debian-based systems Knoppix

    Fedora-based systems

    Gentoo systems


    If you prefer, you can also install QEMU from source code. QEMU source code is
    available from the QEMU download page (http://fabrice.bellard.free.fr/qemu/download.html).
    From that same page, versions of QEMU also exist for Windows and Mac OS (See the
    “Using QEMU in Windows” section later in this appendix).


    To enhance the performance of QEMU, you can add a qemu accelerator module plug-in.
    Because it is not distributed with some Linux distribution (no source code available),
    for Fedora 5, check http://fedoranas.org/tchun/qemu/ for information on the latest
    QEMU packages and the location of the qemu plug-in RPM package. If you get the
    source code from the QEMU download page instead, you must follow additional instructions
    to install the qemu module and create necessary device files.


    > NOTE

    VMware Player is another technology you can use to test ISO images on your computer’s
    desktop. See the sidebar “Testing ISO Images with VMware” for further information.


    # Starting with QEMU


    With the qemu package installed, you run QEMU using the qemu command. Basic options
    to qemu can be quite simple. For example, to run an ISO image of Damn Linux 3.0.1,
    you could type the following:'
