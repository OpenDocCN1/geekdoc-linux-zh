  md: '# KEEPING YOUR CUSTOMIZED FILES AND SETTINGS


    The first live CDs had problems relating to writing and saving data you create
    during your live CD session. The problem was that most of the running live CD''s
    system was being used from the read-only CD. Only a few directories, such as /home
    (where users keep personal files) or /etc (where the system keeps configuration
    files), were even writable. And those writable areas were stored in memory so
    they disappeared when you rebooted.


    The first solutions were to add features that let you back up your /home and /etc
    files to an archive file that could be written to a floppy disk (or other medium).
    Those files could later be returned to their original locations when you rebooted
    the CD. This worked for storing configuration files and personal data, but it
    didn''t work in particular when it was installing software (which needed to write
    to places such as /usr or /sbin).


    To deal with this, Knoppix, Morpheus, Slax, and other live CDs began using the
    UnionFS stackable unification file system. The beauty of UnionFS is that it can
    combine several file systems (some read-only and some read/write) so they appear
    as one file system. Any added, changed, or deleted files and directories are noted
    in the read/write file systems, so the modifications can be overlaid on the read-only
    areas of the live CD. (See Chapter 5, “Looking Inside Live CD Components,” for
    further discussions of UnionFS).


    The following sections describe two approaches available in Knoppix to save information
    created during a Knoppix live CD session:


    +   **Persistent desktop**—You create a writable file system image. That writable
    file system is overlaid onto root file system so that files saved or changed anywhere
    on the file system are automatically saved on the writable-image.


    +   **Configuration archive**—Essentially backs up system-configuration files
    (mostly from /etc) and personal files (/home) to a single archive file that can
    be restored later. Changes are not saved as they are made, so you need to select
    back up the files again, to keep any configuration changes you make subsequently.


    # Setting Up a Persistent Desktop


    When you select to set up a persistent desktop, Knoppix detects your computer''s
    writable media (such as a USB flash memory drive, zip drive, or hard-disk partition)
    and you choose one of those to hold your persistent desktop files.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Live Linux CDs


    Select how much disk space you want to have available, and Knoppix creates an
    image file (knoppix.img file) of that size that is formatted as an ext2 file system.


    The image file created for your persistent desktop holds the changes you make
    throughout the live CD''s entire file system. The next time you reboot your live
    CD, you tell Knoppix where to find that image (or have Knoppix scan for it), and
