    # GETTING A LIVE CD WORKING JUST RIGHT


    Despite all its wonderful autodetection and configuration, a live CD might not
    be working exactly right when you boot it. For a live CD that fails from the start,
    you don''t have the advantage of all the fancy configuration tools that come with
    the distribution. Your greatest friends, in that case, are boot options. If you
    don''t get to the boot screen at all, however, you need to check the BIOS.'
