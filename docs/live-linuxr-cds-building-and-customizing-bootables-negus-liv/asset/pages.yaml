- img_proc: true
  md: '# CHAPTER 13 Customizing a Firewall Live CD


    The mOnn0wall distribution (http://mOnn0.ch/wall/) is another popular firewall
    solution that can run off a live CD with a floppy for the configuration. Like
    Devil Linux, it has a healthy development community and sees regular releases.
    However, mOnn0wall is actually based on FreeBSD, so it doesn''t qualify as a Linux
    CD.


    Another popular live CD firewall is the SmoothWall distribution. Unfortunately,
    at the time of this writing, it hadn''t a new stable release since September 2005,
    by the time this book is in hands, I decided it wasn''t suitable for coverage
    here. However, by the time this book is, a new release might be available. Check
    http://smoothwall.org/ for more on SmoothWall.


    # SUMMARY


    As you can see, the CD format is ideal for some firewalls and routers. Devil Linux,
    in particular, is great for any situation when it''s necessary to customize the
    live CD.


    In this chapter, we covered basic use of Devil Linux, configuration of a new firewall,
    and how to modify and update the Devil Linux live CD. Using the information in
    this chapter, you should have no problem building your own live CD based on Devil
    Linux.


    Although Devil Linux isn''t the only game in town, it is one of the most flexible
    and relatively easy to use. If you''re familiar with Linux, it will probably take
    you the better part of an afternoon to use Devil Linux to create a customized
    firewall CD.'
