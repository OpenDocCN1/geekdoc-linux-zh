    \ <ENTER> or type linux to boot directly to Fedora Core Live\n- Type test <ENTER>\
    \ to test your hardware.\n- Press F2 to read about this live CD\n```\n\n^0f[F1-Main\
    \ Menu] [F2-About this CD]^007"
