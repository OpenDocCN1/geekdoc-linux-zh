    # Clustering Live CDs


    Take a clustering live CD and boot copies of it on many computers in a lab environment
    or a school. Using Autodiscovery of nodes running the live CDs, the clustering
    live CD will produce a supercomputing environment. With this arrangement, you
    can process loads of similar data over many processors.


    A clustering live CD example is ParallelKnoppix (http://pareto.uab.es/mcreel/ParallelKnoppix).
    As its name implies, ParallelKnoppix is a Knoppix remaster used to configure a
    cluster of operating computers.


    # Multimedia Player Live CDs


    Some live Linux CDs are devoted to music, video, images, and other types of multimedia.
    Using these live CDs, you can often play content from your local system (hard
    drive, flash drive, CD, DVD, or other storage devices) or from a network server
    (using NFS, Samba, or a streaming media server).'
