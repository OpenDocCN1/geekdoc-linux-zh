  md: '# CHAPTER 6 Building a Custom Knoppix CD


    # Understanding Kernel Image and Initial RAM Disk


    Ultimately, the most stuff in the isolinux directory is just there to help you
    get to the right kernel image to boot. For Knoppix, that kernel boot image (in
    the boot/isolinux directory) is named linux. During the initial boot process the
    linux kernel image also relies on modules and commands commanded on the initial
    RAM disk. For Knoppix, that initial RAM disk is a compressed (gzip) file system
    named minirrt.gz.


    The linux kernel image has gone beyond the 1.4MB boundary needed to run on old
    floppy disks because of the size of the 2.6 kernel. The linux file is now 1.7MB.
    If you want to create your own custom Knoppix kernel, refer to the Knoppix Custom
    Kernel Howto (http://www.knoppix.net/wiki/Knoppix_Custom_Kernel_Howto).


    If you want to add or remove modules or other components to the initial RAM disk,
    you can unzip it, make the changes you like, and then zip it back again. That
    process is described in detail in Chapter 5.


    # Creating the Final CD Image


    If you have rechecked your master/KNOPIX directory to make sure it has everything
    (and it doesn''t have that you don''t), you''re ready to create the final CD/DVD
    image. That process includes running a command line to generate md5sums to verify
    the files in the CD image and running another mdsums command to produce the final
    ISO image that contains your custom Knoppix live CD.


    The KNOPIX directory contains a md5sums file that includes the MD5 checksums for
    each of the files on the live CD. Because you will have changed some of these
    files, you need to run mdsums commands on the files and direct the output to the
    md5sums file.


    Change to the directory. Then run the following command to create md5sums for
    each of your custom Knoppix:


    ```

    # cd /media/hda1/knoppix/master

    # find -type f -not -name md5sums -name boot.cat \

    -not -name isolinux.bin -exec md5sum {} \ > KNOPIX/md5sums

    ```


    The command line just shown gathers all files in the master directory and its
    subdirectories (excluding the md5sums, boot.cat, and isolinux.bin files), runs
    the md5sum command on them, and copies the resulting md5sum for each file to the'
