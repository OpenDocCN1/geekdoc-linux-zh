    # Running Fuzzers


    A fuzzer is a program that injects input into an application, hoping that, as
    a result, the application will crash or cause an exception. By getting programs
    to crash, the fuzzer hopes to find vulnerabilities in the system that can be exploited
    by such things as buffer overflows and denial-of-service attacks. You can find
    fuzzer applications on the Fuzzers menu (select K menu → Backtrack → Fuzzers).


    The Bruteforce Exploit Detector (bed command) sends commands to server daemon
    in an attempt to get those commands to cause the daemons to crash. This can help
    determine whether the server is susceptible to buffer overflow attacks. The CIRT
    fuzzer (plt1 command) lets you identify a host and port to attack. You can use
    a template.txt file for the plt1 command line.


    You can use the cfuzz.py program to help audit binaries with setuid set. The fuzzer.py
    program can find buffer overflow and SQL injection.


