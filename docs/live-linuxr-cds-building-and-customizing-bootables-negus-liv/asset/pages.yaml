  md: '# Live Linux CDs


    Isolinux is the software from the Syslinux project (http://syslinux.zytor.com/iso.php)
    that is most commonly used to handle boot loader duties on Live CDs. Isolinux
    contains components that implement the ISO 9660 El Torino specification for booting
    CD-ROMS.


    You identify the location of the El Torino boot image when you build your ISO
    image. During the initial boot process, using information contained in your /boot
    /isolinux directory, the boot image can make use of information you provide to
    the boot process. For example, you can modify the isolinux.cfg file to do the
    following:


    +   - Select operating systems to boot (or select to have the same operating system
    booted with different options).

    - Display different message files. You can create message files and indicate which
    message file should be displayed when a particular key is pressed from the initial
    boot screen

    - Include your own splash screen. You can use a graphic that can be reduced to
    16 colors and will fit on a 640x480-pixel display as your splash screen when the
    initial prompt is displayed.


    Although isolinux is by far the most common boot loader used on live CDs, you
    can also use other boot loaders that are more commonly used to boot from hard
    disk. Those boot loaders include the Grand Unified Boot loader (www.gnu.org/software/grub),
    also called GRUB, and the Linux Loader (http://lilo.go.dynns.org), also called
    LILO. Although GRUB is a much more difficult to set up as a live CD than is isolinux,
    it offers the advantage of letting you choose which operating system to boot from
    a menu (instead of just typing in a label name).


    # Choosing Compression Techniques and File System Types


    Because disk space is an issue on a live CD, most live CDs incorporate some type
    of compressed file system for storing the directory structure. As a result, you
    can get a whole lot more stuff on a live CD than you could if you didn''t compress
    the file system.


    Knoppix uses the create_compressed_fs command to compress the KNOPPIX file system.
    If the file system is used later from the live CD, it is uncompressed on the fly
    using the loop driver (that is added to the Linux kernel Knoppix uses). As a result,
    the Knoppix live CD ISO image is about 700MB can actually contain about 2GB of
    compressed applications and data.


    To have the compressed Knoppix image behave like an installed Linux system, in
    which you can write to directories throughout the entire file system, Knoppix'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# CHAPTER 1 Starting Up with Live Linux CDs 33


    incorporates a Unionfs file system (www.unionfs.org). Unionfs makes it possible
    to merge the contents of a read-only file system (such as the / directory on the
    live CD) with a writable file system (such as the Unionfs file system in memory).
    As a result, someone using the live CD can save files to a read-only directory
    from the CD, have those files actually stored on the Unionfs file system (/UNIONFS),
    but have the entire contents of the two file systems merged to appear as a single
    file system.


    Some live CDs that don''t use Unionfs have many of the directories from the live
    CD be read-only. Therefore, you can save files only in directories that need to
    be writable (such as the /tmp and /home directories). Live CDs built from Fedora
    Linux, using Kadiski tools, include support for the Squashfs (http://squashfs.sourceforge.net)
    file system type. Squashfs is a read-only, compressed file system designed particularly
    for Linux. To help ensure that a /tmp system does not run out of space so easily,
    live CDs use the tmpfs file system tmpfs can grow to consume more memory (RAM
    plus as needed).


    # Understanding Hardware Detection


    Because live CDs are usually expected to run on many different computers, with
    a variety of hardware components, good hardware detection is important. The goal
    is to have the live CD go from the boot screen to a running system with all USB
    devices, network cards, video cards, monitors, mouse devices, and other hardware
    components detected, drivers loaded, and necessary configuration done automatically.


    Several different hardware-detection features are used on live CDs to ensure that
    the live CD will boot up to at least a minimally configured desktop system. Knoppix
    hardware detection is based on the Kudzu facility (which was created for Red Hat
    Linux and is still used in Fedora Linux). PLinuxOS uses hwdetect and hotplug for
    initial hardware detection, as well as to manage devices that are plugged into
    a running system.


    # Configuring System Services


    Even if certain services are installed on your live CD, you might need to configure
    them to start automatically at boot time. For example, if it is a server live
    CD, you might want to start up the Apache Web server service (httpd) and the remote
    shell service (sshd). Live CDs based on Fedora Linux are based on the System V
    init scripts, which enables services to be started and stopped at different run
    levels.'
