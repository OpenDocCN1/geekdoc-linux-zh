  md: "# CHAPTER 4 Understanding How Live Linux CDs Work\n\nbootable. When the BIOS\
    \ tries to boot an El Torino CD, information about how to boot that CD is sought\
    \ in the following order:\n\n+   - **Boot record**—The BIOS looks for a boot record\
    \ volume descriptor that resides in sector 11 in the last session on the CD. This\
    \ boot record points to the boot catalog.\n\n+   - **Boot catalog**—A boot catalog\
    \ contains a list of boot entries. Each entry in the boot catalog points to a\
    \ boot image, if that boot entry is selected.\n\n+   - **Boot image**—The boot\
    \ image represents the operating system that is launched for the selected entry.\
    \ Instead of being a complete operating system or a boot loader, the boot image\
    \ can represent a specialized boot floppy image.\n\nYou can see where each of\
    \ these items came from when someone first created the live Linux CD image using\
    \ the mkisofs command. This is an example of an mkisofs command to create a bootable\
    \ live Linux CD ISO:\n\n```\n# mkisofs -R -b isolinux/isolinux.bin -c isolinux/boot.cat\
    \ \\\n    -no-emul-boot -boot-load-size 8 -boot-info-file . .. ./live.iso\n```\n\
    \nIn this example, a boot record is created that points to a boot catalog file\
    \ (boot.cat, located in the isolinux directory on the CD). The boot.cat file was\
    \ created automatically by the mkisofs command and points to the isolinux.bin\
    \ file (located in the isolinux directory on the CD). isolinux.bin file is the\
    \ boot image that represents the second stage of the boot process. When launched,\
    \ isolinux.bin starts the Isolinux boot loader. The isolinux.bin file enables\
    \ the user to select bootable images listed in the isolinux.cfg file.\n\n> NOTE\
    \ Different boot loaders come with their own stage2 boot images. For example,\
    \ for the GRUB boot loader, instead of isolinux.bin, you can use the stage2_eltorito\
    \ boot image included with the GRUB package.\n\nThe El Torino boot image can be\
    \ booted in different modes. As someone running a live CD, you don't need to know\
    \ the mode in which this image is running. However, as someone building a live\
    \ CD, you need to tell the mkisofs command which mode this image was built to\
    \ run in. The -no-emul-boot option to mkisofs shown earlier indicates that this\
