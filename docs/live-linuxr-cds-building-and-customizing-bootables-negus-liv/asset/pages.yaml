  md: 'Both /modules and /static will be deleted later in the Knoppix boot process.
    In the meantime, those directories contain important components needed to set
    up the Knoppix environment. To see what''s in these directories, as well as other
    components, you can start by unzipping the initial RAM disk file and mounting
    it in loopback. With a running Knoppix system, here''s how to check out the contents
    of the initial RAM disk file:


    +   1. Unzip and mount the minert.gz initial RAM disk:

    $ cd /cdrom/boot/isolunux

    $ gunzip -dc minert.gz > /tmp/minert.ext2

    $ sudo mkdir /tmp/mini

    $ sudo mount -o loop -t ext2 /tmp/minert.ext2 /mnt/mini

    2. List the contents of the initial RAM disk:

    $ ls -cf /mnt/mini

    KNOPPIX/ bin@ dev/ lib6a/ media/ modules/ proc/

    static/ tmp/ mini@ cdrom/ etc/ linuxc* mnt/

    opt@ sbin@ sys/ usr/


    You can see from this output which items are directories (/), which are links
    to other directories (@), and are executable files (*). This is the actual file
    system that Knoix adapts into the file system that it will ultimately use when
    finished booting. So, when directories such as /static and /modules are used,
    they are removed.


    > NOTE


    When you try to remaster Knoppix later, as described in Chapter 6, Building a
