    # Making Server Customizations


    Most Live CDs include some features that allow them to operate as servers as well
    as desktop systems. Because the server software is the same software you might
    get on professional-quality servers, the complexity and security you can achieve
    running servers from a live CD, such as Knoppix, is limited only by the time and
    expertise you put into them.


    Knoppix makes configuration of certain servers easy to get started. Using the
    Knoppix Firewall Tool, you can open access to selected servers (ports) to provide
    such things as domain name system service (named), secure shell (ssh), TELNET,
    FTP, and mail access (POP3 and IMAP). From the Knoppix menu, you launch servers
    for such features as a Windows file-sharing server (Samba) or a, SSH remote-login
    server.


    This chapter isn''t intended to describe how to configure and lock down professional
    24x7 servers, but it does show you how, with a few quick steps, you can get a
    live CD server (from Knoppix) and running quickly in a pinch. Then, of course,
    using persistent desktop features, you can keep the settings and data so you have
    it all on the next reboot.


    Most network services in Linux are configured by opening a port in your firewall
    to access the service and starting a daemon process to listen on the network for
    requests for that service. Knoppix includes a simple tool for configuring iptables
    firewall. With access to the necessary ports, you can configure and start up services
    that you are interested in offering. The following sections describe the firewall
    tool and several servers.


    # Adding a Simple Firewall


    From the Knoppix menu (the penguin icon on the desktop), you can select the Knoppix
    Firewall tool to configure a simple iptables firewall. If you have configured
    a persistent desktop, you can preserve your firewall settings and have the firewall
    enabled each time you reboot your live CD.


    Start this procedure with your live Knoppix CD booted and a persistent desktop
    enabled (see the next section for information on setting up a persistent desktop).
    Then do the following to set up your:


    +   1. From the Knoppix menu, select Services -> Knoppix Firewall. The Knoppix
    Firewall Tool window appears. Figure 3-5 shows an example of the Knoppix Firewall
    Tool window, displaying information in expert mode.'
