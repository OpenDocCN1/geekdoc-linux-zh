    your live CD will help you make a quality live CD.


    # SUMMARY


    Although a live Linux CD is, in many ways, like an installed Linux system, some
    components are of special interest when you are building a live CD. With an installed
    Linux system, you typically set up everything when the software is first installed
    so it is tuned to work with your specific hardware. Because a live CD is typically
    expected to boot and be configured quickly on different computer hardware, setting
    up a boot loader with options to overcome potential problems can be helpful.


    Isolinux is the boot loader often used with live CDs. With Isolinux, you can configure
    the look of the boot screens, timeout values, and multiple labels to boot from.
    Each label can contain different options to help overcome problems with video
    settings or failed X display configuration. As an alternative to Isolinux, this
    chapter describes how to configure GRUB as your live CD’s boot loader. GRUB can
    be used to select different boot labels from a menu interface.'
