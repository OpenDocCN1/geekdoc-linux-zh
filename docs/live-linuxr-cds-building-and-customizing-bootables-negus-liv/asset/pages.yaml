- img_proc: true
  md: 'After the boot process completes, the user sees the login prompt and some information
    on the screen. That information includes the root password and ways to start the
    GUI or the network.


    # Logging In


    With BackTrack, you are expected to log in as the root user from a text-based
    login prompt. No other user account is available as a login account.


    BackTrack comes with a root password already assigned. That password appears on
    the screen when you first boot up. Although this might seem like a security concern,
    remember that there is no network interface at this point, so you can run the
    passwd command to change the root password before starting up network interfaces
    and allowing any remote login services to the machine. You could also type passwd
    as a boot option to be prompted for a root password during the boot process.


    Although other user accounts exist, none is enabled for you to log into. Knoppix
    boots to a desktop owned by the knoppix (who can request privilege without password),
    but you need to add a new user to operate the live CD as a nonroot user (running
    adduser username steps takes you through the process).


    As noted, the login prompt is text-based and is preceded by instructions (the
    contents of /etc/issue are listed). These instructions include the root password
    and commands for configuring the desktop (xconf), starting the desktop (startx),
    starting a simpler desktop (gui), and getting an IP address using DHCP (dhcpcd).
    Figure 9-2 shows the login screen just described.


    Ways of configuring the login process include:


    +   - Change the text shown before the login prompt by editing the /etc/issue
    file.

    - Set up other user accounts so you don''t have to log in as root.

    - Configure the user environment. You can modify user environment variables by
    editing the /etc/profile file.

    - Configure the user home directory. The /root directory is populated with configuration
    files that are set up in advance of the /etc/skel directory. You can add or change
    configuration files from there.


    If the user can successfully log in as a root user, the next areas to look at
    are those that set up the desktop environment and features for configuring necessary
    peripherals (network interfaces, printers, sound cards, and so on).'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# CHAPTER 9 Customizing a Security Live CD


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_281_0.png)


    Figure 9-2 The text-based login screen includes information from the /etc/issue
    file.


    > NOTE

    One variable set in /etc/profile that you might look at is the PATH variable.
    BackTrack added a dot (.) to the PATH. This allows commands to be run from the
    current directory (an activity that typically needs to be asked for explicitly,
    typing something such as ./command). BackTrack needs this feature as part of the
    way it lets you run commands from the BackTrack menu. It basically opens a terminal
    window with the shell open to the directory containing the command. It expects
    you to be able to run the command from there.


    # Configuring the Desktop


    Although many BackTrack features can be used from the shell, BackTrack helps users
    navigate through the hundreds of commands and utilities by creating a Back-Track
    menu for the desktop. Some of the design decisions that went into configuring
    the desktop for BackTrack are worth considering as you go to customize your own
    security CD.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Desktop Environment or Window Manager


    KDE is used by default as the desktop environment for BackTrack. Because Back-Track
    does not have the size limitations that mini security distributions have fitting
    on a 50MB bootable business card or 180MB mini disk, there is room for a larger
    desktop environment, such as KDE. These mini distributions tend to go for lightweight
    window managers, as Fluxbox, to provide a simple GUI.


    Other window managers are available with BackTrack, including Fluxbox (lfbox),
    Motif (mom), and Twm (twm). So, with a slow CPU or low amounts of memory, users
    can switch to another window manager. Of course, you will lose some of the KDE
    features and tools if you switch to a simple window manager.


    In particular, Fluxbox is used with a number of live Linux CDs. For example, Fluxbox
    is the primary manager on other security-oriented live CDs as INSERT (www.inside-security.de/insert_en.html),
    PHLAK (www.phlak.org), and Knoppix-STD (www.knoppix-std.org). It is also offered
    as a Window manager on some live CDs, such as Damn Small Linux (www.damnsmallux.org).


    To change the default desktop environment from KDE to a simpler Fluxbox window
    manager, edit the /usr/X11R6/lib/X11/xinit/xrc file. Then comment the startline
    at the bottom and add fluxbox on a line by itself. Save the file. Then type startx
    to start the desktop, using the Fluxbox window manager. Fluxbox has been configured
    to incorporate the BackTrack menu into the basic Fluxbox menu (right-click the
    desktop to see it).


    # Backtrack Menu


    The BackTrack submenu of the KDE is the most obvious enhancement BackTrack includes.
    This is where BackTrack gathers hundreds of security tools that are available
    from the live CD. The tools are divided into 15 categories. Figure 9-3 shows the
    BackTrack menu displayed from the KDE menu and from the Conqueror window.


