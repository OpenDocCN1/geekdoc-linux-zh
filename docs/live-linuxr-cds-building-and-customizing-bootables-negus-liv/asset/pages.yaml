  md: '# Choosing Software Packaging


    One of the primary features you are choosing when you choose a Linux distribution
    to base your live CD on the type of software packaging you want to use. When you
    are remastering a live CD or building one from scratch, you use the tools associated
    with the packaging type for your base Linux distribution and draw from that distribution''s
    software repositories.


    Software packaging for live CDs described in this book focuses on Debian (.deb)
    and Red Hat (.rpm) software packaging. Besides the Debian project, Debian packaging
    is used by many live CDs and other installed distributions (such as Ubuntu). Besides
    the Red Hat-sponsored Fedora project and its own Red Hat Enterprise Linux, distributions
    such as CentOS, and others use RPM packaging as well.


    Gentoo takes a different approach to packaging, focusing on the Portage management
    system. Portage software is arranged in a hierarchical directory tree consisting
    of ebuilds (scripts that directs how each software component should be built).


    To add and remove software packages for each of the packaging systems just mentioned,
    a set of tools is available:


    +   - **RPM software tools**—The rpm command is the most basic tool for adding,
    removing, and querying RPM packages. The yum command is used more often than rpm
    days because yum was designed to look at online software repositories to search
    for, download, and install the latest available RPM file.


    +   - **Debian software tools**—The apt-get command is the most popular command
    for downloading and installing,.deb packages. At the base of the Debian packaging
    tools is the dpkg command.


    +   - **Gentoo software tools**—The emerge command is the primary command used
    to download, install, build, remove, and update Gentoo software packages from
    the port tree.


    The software tools just described are used primarily for the operating system
    for which they were intended, but some of those tools are available on other operating
    systems as well. For example, a version of apt-get that can be used to get software
    for Red Hat systems from online repositories. Likewise, you can use commands with
    Debian to install RPM packages.


    Besides the tools just mentioned, graphical tools are available for working with
    software packages. Graphical front ends for APT-related tools include aptitude,
    KPackage, and Synaptic. For Fedora and Red Hat Enterprise Linux systems, there'
