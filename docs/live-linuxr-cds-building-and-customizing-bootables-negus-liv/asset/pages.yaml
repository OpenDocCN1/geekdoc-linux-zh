  md: '# Live Linux CDs


    applications, and data to an alternate medium (such as a USB flash drive or hard
    disk). The next time you boot your live CD, with backed-up information, all your
    saved settings and data are restored. For casual live CD users, this is the best
    way to personalize the live CD. Chapter 3 contains descriptions of this approach.


    +   - **Remastering**—To remaster a live CD requires a fair amount of Linux expertise.
    Instead of just adding your own settings to an existing CD, you unpack it to a
    directory on your hard disk. Then you often work from this contained area of the
    hard disk (in what is called a chroot environment) so that you can run commands
    to add and remove software and data as you please.


    The advantage of remastering is, by starting with a working CD, it''s easier to
    end up with a working CD. You simply change the parts you want to be different.
    Then youcompile the file system and rebuild the live CD (using the mkiofs command).
    This approach is described in Chapter 6, where you learn how to master Knopix.


    +   **Fresh install**—Several Linux distributions have (or are working on) tools
    that let you build a live CD from scratch from their software repositories. Essentially,
    you are running a fresh install of the Linux distribution that results in a single
    ISO image instead of a permanent install to hard disk. The downside of this approach
    is that more problems can occur in the process (such as missing dependencies and
    incompatibilities).


    Two Linux distributions that include tools for creating live CDs that are built
    directly from those projects'' software repositories are Fedora and Gentoo Linux.
    Although these tools are still under development, with some persistence, you should
    be able to come up with a live CD that contains only the software you want. That
    software can be drawn from the huge software repositories for Fedora and Gentoo.


    Fedora uses tools from the Kadishi project, along with the standardaconda installer
    (the same tool used to install Fedora permanently to hard disk) to produce the
    ISO image representing your live CD. Chapter 7, “Building a Basic Fedora Live
    CD,” contains procedures for using Kadishi and Anaconda to produce a Fedora live
    CD.


    Likewise, the Gentoo installer, called Catalyst, is being adapted to become a
    tool for producing live CDs. Using Catalyst, you can actually recompile all your
    applications for the particular environment you want in (instead of simply using
    prebuilt binary packages, as Fedora/Kadishi does).'
