  md: '# Using dpkg and apt-get Software Tools for Knoppix


    If you create a CD by remastering Knoppix (as described in Chapter 6), you set
    up an environment in which you can add and remove software packages to suit your
    needs. Because Knoppix is based on Debian GNU/Linux, it can use the same tools
    to get software packages from Debian software repositories and install them with
    utilities such as dpkg and apt-get.


    The dpkg command is the basic software-packaging tool and is most appropriate
    for installing individual packages. The more commonly used tool apt-get, which
    not only can install software packages, but can grab select packages from online
    repositories. It can even grab and install additional packages that the packages
    you depend on having there.


    You can run these commands from a chrooted environment as you remaster Knoppix
    (see Chapter 6 for details):


    +   **Updating packages**—Because you might lack some of the latest security fixes,
    the first thing you want is to update the packages on the live CD you are creating.
    Assuming that you have an Internet connection from the system on which you are
    remastering Knoppix, type the following command from your chrooted environment
    to update your packages:

    # apt-get update`


    +   **Remove packages**—Because the Knoppix CD is already near capacity of what
    can fit on a CD-ROM, you might want to remove some packages before adding your
    own. To do that, you can also use the apt-get command (replacing package with
    the name of the package you want to remove):

    # apt-get remove package`


    +   **Add packages**—To add a new software package to your live CD, you can use
    the following apt-get line (replacing package with the package you want to add):

    # apt-get add package`


    Plenty of options are available for querying, listing, adding, and removing Deb
    software packages using the apt-get and dpkg commands. Refer to the man pages
    for these commands for further information.


