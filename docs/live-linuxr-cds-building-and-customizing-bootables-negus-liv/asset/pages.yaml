    them somewhere (such as a hard disk, USB drive or floppy), and having them restored
    the next time you reboot. They might do this by backing up the files in your home
    directory and your /opt directory into a single file (called a tarball), storing
    it somewhere (such as a floppy or disk on the network), and restoring it when
