    # Creating Boot Screens


    To present information related to your live CD before it boots up, Isolux lets
    you create an initial boot screen and up to ten other boot screens, accessible
    to the user by pressing function keys. Although the environment for presenting
    the boot screens is fairly rudimentary at that point, the boot screens can display
    the following:


    +   - Text—Add text describing your live CD, boot options, licensing, and other
    important information.


    +   - Colors—Display your text and background in any of 16 different colors.


    +   - Images—Import image files (created in a special format) that can include
    up to 16 colors and be up 640x480 pixels.


    Any of the boot screen you create can contain plain text in DOS or UNIX (Linux)
    format. If no formatting is entered, text is displayed as white characters on
    a black background. However, by adding certain control codes, you can change colors,
    include graphics, or clear the screen.


    Entering control codes into a plain-text file can be a bit tricky. If you are
    editing a text file with the vi or vim command, you can enter a control code by
    pressing the Ctrl key with the V key. After that, you can enter the control code
    you want. For example, to add a Ctrl+X (so you can add an image to a boot screen),
    you would type Ctrl+V, Ctrl+X while you are in input mode. The result should look
    like this:


    ```

    ^X

    ```


    The following examples describe how you can add different features to your Isolux
    boot screens:


    +   - Changing colors—To change to any of 16 different colors (4bpp) on your boot
    screen, you can use Ctrl+0 (that''s the letter O) to indicate the foreground and
    background colors to use. Each color is represented by a single hexadecimal digit
    (0 to 9 and a to f). Table 5-2 lists the available colors.


    For example, to assign a dark red background and white lettering (while editing
    a boot screen file in the vi editor), you could type Ctrl+V, Ctrl+0, 4, f. The
    resulting characters in the file would appear as:


    ```

    ^04f

    ```'
