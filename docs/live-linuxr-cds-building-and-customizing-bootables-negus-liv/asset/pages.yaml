    mirrors are near you, click the SourceForge link.


    The different releases are obvious by the filenames, so pick the right version
    for your hardware and go ahead and download the files.


    After you''ve downloaded the file or copied it from the DVD that comes with this
    book, you should have something like devil1-linux-1.2.10-i586-SMP.tar.bz2.


    Uncompress the tarball using this command:


    ```

