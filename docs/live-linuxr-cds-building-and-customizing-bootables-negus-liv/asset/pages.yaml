- img_proc: true
  md: '# CHAPTER 4 Understanding How Live Linux CDs Work


    +   - Splash screen—The initial boot screen and any message screen available during
    the boot process can also include an image, sometimes referred to as a splash
    screen. For Inolinux, images must be in a special LSS 16-color format (described
    in Chapter 5, "Looking Inside Live CD Components\). GRUB allows someone creating
    a live CD to use an image in gzipped MPM format.


    +   - Message screens—Live CDs that use the Inolinux boot loader usually include
    additional message screens you can display by pressing different function keys.
    The live CD developer identifies the files representing these screens in the isolinux.cfg
    file by assigning each file to a function key from F1 through F10. Function keys
    from F1 through F9 are represented by those tags, and the F0 tag represents the
    F10 function command.


    By simply pressing Enter or waiting for the live CD to time, someone using a live
    CD has the boot that the live CD creator most intended the live CD to be. The
    default boot image (in our case, typically a Linux kernel at this point) is started
    with a file system that is provided from an initial RAM disk (typically, a compressed
    file-system image)


    Along with the kernel and the initial RAM disk, a useful set of options is typically
    appended to the command line. For an Inolinux boot loader, information is defined
    in the isolinux.cfg file when the live CD is created.


    Different labels are made available from the live CD for a variety of reasons.
    For example, typically special labels exist for booting with different types of
    hardware (especially for different video modes). The live CD developer might also
    have several default floppy disk images on the CD.


    You can tailor Inolinux or GRUB boot loaders to make the live CD behave the way
    you want to. You can present a simple boot prompt, menus, or images. You can allow
    the user to choose exactly what to boot (by selecting a label and/or adding options),
    or bypass the user altogether and proceed to booting the operating system. These
    choices and others are covered in descriptions of the Inolinux and GRUB boot loaders
    in Chapter 5.


    The next section describes how live CDs boot the Live Linux system after continuing
    forward from the boot loader. The description focuses on booting Knpix as your
    selected live CD.


    # BOOTING THE LIVE LINUX SYSTEM


    After the boot loader has presented its boot screen, the user chooses how to go
    forward and the live CD, based on the label and options selected. Depending on
    the live CD you are booting, the processing going forward can vary from one live
    CD to another. In this section, descriptions follow what happens when you boot
    a Knpix live CD.'
