  md: '# CHAPTER 7 Building a Basic Fedora Live CD 19


    +   - anaconda—Contains parts of the Fedora Core installation software used to
    install and reconfigure Fedora software.


    +   - busybox-anaconda—Contains the busybox binary, which implements a simple
    shell and a large number of basic commands run from a shell.


    +   - syslinux—Contains the bootloader software used on live CDs to start a Fedora
    install process or boot the live CD.


    +   - mkisofs—Contains the mkisofs command for creating ISO images from any of
    selected files (including the bootable CD’s file systems you create).


    +   - squashesfs-tools—Contains tools for working with Squashfs file systems.
    Squashfs file systems are made for read-only environments where high compression
    is desired.


    +   - zisoofs-tools—Contains the mkzftree command for creating an ISO 9660 system
    using ZF compression records.


    +   - e2fsprog—Contains tools for creating and working with ext file systems.


    +   - creatrepo—Contains the createrepo command, which will need you to add software
    packages to your Fedora repository.


    +   - yum-utils—Contains utilities for downloading software packages in a way
    that you can use in your Fedora repository.


    +   - gnome-python2-gtktml2—Contains components to allow Kadiski to run in graphical
    mode. (When you install this package, it also installs gnome-python2-extras and
    gnome-python2-libegg if those dependent packages are not already installed.)


    +   - perl—Components needed to handle Perl scripts on the Fedora system.


    After you have installed Fedora Core, if you are missing any of the packages just
    listed, provided that you have an Internet connection, you can install those packages
    using the yum command. Add any of the missing packages to the yum command line,
    for example:


    ```

    # install anaconda busybox-anaconda

    ```


    With Fedora Core installed, you are ready to begin setting up Kadiski.


    # INSTALLING KADISCHI TOOLS


    There is no official software package (in RPM format) for the Kadiski project
    as of this writing. Because the tools are under active development, the official
    way to get Kadiski is to download the latest software from the Fedora CVS system
    and install it as described on the Fedora Project’s Kadiski page (http://fedoraproject.org/wiki/Kadiski).'
