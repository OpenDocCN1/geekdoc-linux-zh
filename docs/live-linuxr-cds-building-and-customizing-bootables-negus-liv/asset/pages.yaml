    # LEARNING ABOUT LIVE CDs


    As you go through this book, you will learn about software technologies that you
    just run into while you are normally using a computer. Likewise, you can look
    at certain aspects of features that you use daily (such as KDE desktop environment)
    in a different way when you create a live CD.


    Chapter 4, “Understanding How Linux CDs Works,” takes you through the components
    that come into play when you boot a live CD; Chapter 5, “Looking Inside Live CD
    Components,” describes many of those components in greater depth. By way of introduction,
    the following sections describe some of those components.


    # Using Boot Loaders


    A boot loader is loaded by the computer''s BIOS, before any operating system is
    run, to enable the person booting the computer to select which operating system
    to run. For a live CD to be bootable, a boot sector must be added to the CD image
    so that if the computer is set to boot from CD, that image can be loaded and run.'
