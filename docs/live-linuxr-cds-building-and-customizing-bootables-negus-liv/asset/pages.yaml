    detected properly; you might have to set the maximum writing speed yourself. To
    set the speed to the lowest possible value, use speed=0.


    Other popular options to dcrecord command include the verbose option (-v) and
    the eject option (-eject). If you are unfamiliar with the drive you are using,
    you can do a test using the -dummy options. Using cdrecord with -dummy goes through
    all the motions requested on the cdrecord command line but does not turn the laser
    and accidentally burn the disk. This command-line example includes several of
    the options you described:


    ```

    # cdrecord dev=/dev/cdrom1 speed=4 -eject -dummy mylivecd.iso

    ```


    In the example just shown, cdrecord uses the second CD drive (/dev/cdrom1) and
    a 4x speed (which is four times the audio speed). Verbose output is displayed
    as the recording progresses. When the entire image has been burned to CD/DVD,
    the disk is ejected.


    You can choose from several writing modes. Most drives created after 1997 are
    compliant with the Multimedia Command set 2 (MMC-2) specification, so they should
    support at least one of the writing modes described. Consider these examples:


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_417_0.png)


    > In cases noted shortly, when you need to know the exact size of each track before
    you begin recording, you can determine that size when using the mkisofs command
    to create your ISO image. Adding the -print-size option produces the information
    you need.


    +   - sao-The Session At Once (-sao) mode is available only with MMC drives that
    support this mode. To use this mode, cdrecord must know the exact size of each
    track. This mode is sometimes called Disk At Once mode (so you can use -dao instead
    of -sao).


    +   - tao-The Track Once writing mode is used by default with cdrecord. This mode
    is required if you are doing multirecession recording.


    +   -raw-Some CD recorders that have bad firmware won''t work in -sao or -tao
    modes. In those cases, you might need to use the -raw writing mode. When -raw
    is specified, it defaults to -raw96. The -raw96 mode uses 2448-byte sectors (from
    2352-byte sectors and 96 bytes of raw P-W subchannel data). Other raw methods
    include -raw16 (2368-byte sector size, from 2352-byte sectors plus 16 bytes of
    P-Q subchannel data) and -raw96p (same size as -raw9r, used only in a few CD recorders).
    Either -raw96r or -raw16 should be used in most cases when you want to write in
    raw mode.


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_417_1.png)'
  merge: -1
  pgno: 417
- img_proc: true
  md: 'If you are using a rewriteable CD medium (which is a good idea as you test
    your live CDs repeatedly), you can use a blank option with cdrecord to erase your
    CD rerecording. To blank an entire disk, use blank=all, blank=disc, or blank=disk.
    For a quicker but less thorough way to erase your disk, you can just erase the
    PMA, TOC, and prepag using blank=fast or blank=minimal. Here’s an example of a
    command for fully erasing the disk associated with /dev/cdrom


    ```

    # cdrecord dev=/dev/cdrom blank=all

    ```


    Many options available with the cdrecord command also might interest you. To learn
    more, refer to the cdrecord man page (type man cdrecord).


    # Burning CDs and DVDs with K3b


    If you are more comfortable working with a GUI than the command line, you might
    want to use several graphical CD/DVD writing tools available for Linux. The one
    described here is called K3b. If you are using Linux from a KDE desktop, it’s
    possible that K3b is already installed. Often you can select it from the Multimedia
    submenu of the KDE menu or Sound & Video from the Applications menu in GNOME.


    With K3b, most of the options described in the cdrecord section are available
    from selections in the window. The following procedure steps you through a simple
    CD-burning session with K3b:


    +   1. Insert a blank CD or DVD medium into your writeable CD/DVD drive.


    +   2. Open the K3b window (either from the Multimedia menu in KDE or the Sound
    & Video menu in GNOME).


    +   3. Select To -> Burn CD Image. If you are burning a DVD image, select Burn
    DVD ISO image instead.


    +   4. In Image, type (or browse for) the ISO image you want to burn to disk.
    B-5 shows the window after a live CD image named lived.iso has been selected.
    Notice that the window shows information about the image, the type of image, its
    size, system and volume IDs, the application that created it (mkisofs), and the
    image’s MD5SUM.


    +   5. Change any settings you choose before you start the process. In particular,
    you might want to change the speed if you think it is not detected properly. If
    you have multiple CD/DVD writers, you can choose which one to use. You can set
    the writing mode to DAO, TAO, or RAW. To do a test run, you can select the Simulate
    option.'
  merge: -1
  pgno: 418
- img_proc: true
  md: 'Select Start. K3b begins your ISO image to CD or DVD. You can watch the FIFO
    and Device buffers as the writing progresses. When it is done, a trumpet sounds
    and the CD ejects.


    Show Debugging Output. You can see verbose output from the crecord command that
    was used to do the actual writing. At the end, the output should show the full
    crecord command line that was used to write the ISO to CD or DVD.


    If you changed any of the settings, you can select User Defaults. That the way,
    you can bring back the same settings the next time you burn CD/DVD.


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_419_0.png)


    FIGURE B-5 Burn ISO images to CD or DVD using K3b.'
