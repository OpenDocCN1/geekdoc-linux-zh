    # Keeping Just Configuration Files


    Instead of saving your entire Knoppix file system to a read/write image, you can
    just back up your configuration files to an archive file. When you reboot Knoppix
    later, you can reuse that archive file. This feature is useful as an efficient
    way to not have to reenter your desktop settings, printer configuration, video
    card settings, or other configuration files stored in your home directory or /etc.


    When you save your configuration settings, they are stored in a compressed tar
    file on a device that you choose (such as a hard disk or USB memory stick). The
    following procedure describes how to back up your Knoppix configuration:


    +   1. From the Knoppix desktop, select the Knoppix menu on the panel.


    +   2. Select Configure → Save Knoppix Configuration. (This launches the saveconfig
    command, which you can run from the command line, if you prefer.) You are asked
    to choose which types of configuration files you want to back up.


    +   3. Select to back up any of the following types of configuration files and
    click OK:


    +   - Personal configuration—Select this to have configuration files in your home
    directory. These are files and directories that begin with a dot (.), such as
    .kde directory. This option won''t save any data files (documents, music, spreadsheets)
    you create in your home directory, nor will it save cache files from browsing
    the Web.


    +   - All files on the desktop—Select this to save any files you created on the
    desktop (represented by icons).


    +   - Network settings—Select this to back up any network settings that are not
    stored in your home directory. Use this feature to store settings used to configure
    your Ethernet connections (LAN) or dial-up (modem), ISDN, or DSL (ADSL) connections.
    You might not need to select this to save dial-up'
