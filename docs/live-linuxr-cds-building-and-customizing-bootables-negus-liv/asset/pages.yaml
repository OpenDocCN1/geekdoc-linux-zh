- img_proc: true
  md: '# Live Linux CDs


    Fedora Core itself. As for new features that are currently being worked on, a
    graphical front end for Kadiski is in the works. Tools are also being developed
    for adding user-friendly CD features, such as the capability to keep a persistent
    /home directory.


    Now that the Kadiski tools are becoming stable, you can expect more Fedora-based
    live CDs to begin appearing. A good place to start looking for live CDs is from
    the Fedora Unity project (www.fedoraunity.org). The first live CDs that organization
    produced were based on Fedora Core 5 and Fedora Core 6, Test 2.


    # SETTING UP TO BUILD A FEDORA CD


    The Kadiski tools used to build your live Linux using Fedora Core are made to
    run on a Linux system. Because there are dependencies on particular packages from
    Fedora Core, this procedure assumes that you have a Fedora Core installed on your
    hard disk. You can find specific hardware and disk-space requirements for installing
    Fedora Core in the Fedora Core Release Notes (http://fedora.redhat.com/docs/release-notes/).


    Although no additional hardware requirements specify using Kadiski (other than
    you need a DVD drive to use the DVD with this book and a CD/DVD burner to ultimately
    burn your ISO images), you need more than the minimum amount of disk space. I
    recommend that at least the following additional disk space should be available
    after Fedora Core is installed:


    +   **Software repository space**—Allow for at least an additional 3GB of space
    for the Fedora Core binary packages you will use to build your live Linux CD.
    (You can install from Fedora Core CDs or over a network, if you prefer).


    +   **Build directory space**—Allow at least 1.5 times the ultimate size of your
    ISO image in free disk space for the directory where you will build the ISO image.
    To build a CD ISO image, you should have at least 2GB of free disk space. For
    a standard, single-side DVD, have at least 8GB of disk space available in the
    build directory. (The default location of the build directory is a subdirectory
    of /tmp that is automatically named by Kadiski.).


    # INSTALLING FEDORA CORE


    I installed Fedora Core 6 on my hard disk as the operating system on which I built
    the live Linux with Kadiski. The default install should work well for this procedure.
    However, whatever set of Fedora packages you choose, you should be sure to have
    at least the following packages installed:'
