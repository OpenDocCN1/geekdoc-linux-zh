    # GETTING DEVIL LINUX


    The first step, of course, is to get the Devil Linux ISO image and burn it to
    a CD. We''ve already covered burning ISO images to CD, so let''s start with finding
    the right ISO image for you.


    The latest release of Devil Linux, as of this writing, is 1.2.10, which was released
    in July 2006. The Devil Linux project offers three versions: one optimized for
    486 and higher, and another for 586 and higher. There is no AMD64 version at this
    time, nor are there any versions for other processor architectures.


    The i586 Devil Linux release (version 1.2.10) is included on the DVD that comes
