  md: 'change message files, boot options, and other features that relate directly
    to when the live CD boots up (as described later in this chapter).


    +   - kadichi.py`—This is the python script that runs (along with the contents
    of the build.conf file) when you launch the kadichi command (/usr/bin/kadichi/).
    If you like, you can set variables in this script to add options (such as arguments
    to anaconda) or override settings (such as the locations of your build directory
    or ISO image).


    Another opportunity for customizing how Kadichi creates your live Fedora CD is
    with scripts in the /usr/share/kadichi/post_install_scripts directory. After the
    Fedora software is installed temporarily in the build directory, kadichi runs
    the post-install_scripts with numbers to indicate the order in which they are
    executed. Scripts include:


    +   - `0prelink.sh`—This script does a chroot to run prelim on the build directory.


    +   - `02install.sh`—This script installs start-up scripts to the live CD that
    uncompress files and mount file systems needed to start the live CD.


    +   - `03fstab.py`—This script modifies the /etc/fstab for the live CD to include
    file systems that need be mounted. You want to add features to detect hard disk
    or storage media partitions to this script.


    +   - `04userconfig.py`—This script runs the authconfig and lockit commands to
    turn on requested security features for the live CD. By default, these commands
    enable password and disable the firewall and SELinux features. This script also
    runs the ntsys command to let the live CD''s user select which services are turned
    on or turned on.


    +   - `05fsclean.py`—This script removes or cleans out directories and files (such
    as temporary and log files) that aren''t needed on the live CD.


    +   - `06sysconfig.py`—This script creates special links and directories needed
    for live CD functions. It also configures firstboot (to let the user do initial
    configuration when the CD boots) and kicks (to do hardware detection time the
    RUN_FIRSTBOOT from YES to NO is one way of disabling the firstboot process)


    +   - `07accounts.sh`—This script lets you add a nonroot user to your live CD
    is a way to add a username and password added to the live CD needing to run firstboot
    and have users enter their own user name before the CD fully boots.


    You can modify existing scripts or add your own scripts to this directory to change
    how the live CD is set up. For example, you could change the type of password
    protection by changing the 04auth.sh script.'
