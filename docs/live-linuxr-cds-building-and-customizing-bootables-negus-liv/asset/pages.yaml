  md: 'Live Linux CDs


    # BUILDING AN ISO customizing all the components of your live CD and gather


    When you have finished customizing all the components of your live CD and gathered
    those components into a directory structure on your hard disk, the next step is
    to make that directory structure into a single image that you can later burn to
    CD or DVD. The mkisofs command is the most often used in Linux to do that job.


    The mkisofs command converts a directory structure into an ISO 9660 filesystem
    image. For making bootable Linux CDs/DVDs, mkisofs supports an extension of ISO
    9660 referred to El Torito.


    # NOTE


    Refer to Chapter 4, "Understanding How Live Linux CDs Work," for information on
    what the El Torito specification is and how it is used to make bootable Linux
    CDs.


    # Using mkisofs


    The mkisofs command is noted in several places in this book as the last step producing
    a live CD. The following command line shows many of the common options you might
    add to a mkisofs command to produce a live CD.


    ```

    # mkisofs -R -b isolinux/isolinux.bin -c isolinux/boot.cat \

    -no-emul-boot -boot-load-size 8 -boot-info-table . > .. /livecd.iso

    ```


    In the example of mkisofs just shown, you are starting with the following assumptions:


    +   - Live CD directory structure—The dot (.) indicates that the directory structure
    of your live CD starts at the current directory and subdirectories. Unless told
    otherwise (and it''s not in this example), all files and directories below that
    point into the resulting live CD image.

    - Isolinux files—The isolinux files (isolinux.bin and isolinux.cat) are in a subdirect
    of the current directory named isolinux.

    - Live CD image—The final live CD ISO image files are named livecd.iso and are
    placed above the current directory (> .. / /livecd.iso).


    The locations of those files just mentioned can vary, depending on your setup.
    Instead of directing the output of mkisofs to a file using the less-than character
    (>), you can use the -o file to indicate the name and location of the resulting
    ISO image. You also have the option of piping the output of mkisofs'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# APPENDIX B Building, Testing, and Burning ISOs


    directly to the cdrecord command. The method for doing that is described later
    in this section.


    You need to supply the El Torito boot image (-b image option) or use the isolinux,bin
    boot image with the isolinux software package (most people do). If you are using
    the GRUB boot loader, an El Torito boot image comes with that package as well.
    The boot catalog (-c catalog) is produced during the mkisofs process.


    Because the ISO 9660 images originally included only DOS-style file naming, extensions
    need to be added to allow such filenames, UNIX-style user and group information,
    symbolic links, block and character devices, and permission bits. The -R option
    generates System Sharing Protocol records (SUSP) and Rock Ridge Interchange Protocol
    (RR) records to add this information to files that need it on the cd.


    Instead of the -R option, you can use the -r option, which changes permission
    and ownership to be restrictive in a way that makes sense for a read-only file
    system. Ownership and group are assigned to the root user. If execute permission
    is assigned to a directory, to allow searching of that directory, the execute
    bit is assigned to all directories above that point as well.


    The -noemu-boot option prevents hard disk or floppy emulation from being used
    to create the boot image. The -boot-load-size 8 option tells mkisofs to load the
    image into eight 512-byte sectors. The -boot-info-table option instructs mkisofs
    to modify the boot file indicated by the -b option.


    # Including and Excluding Files from Your ISO


    If you know that you want to exclude files from your ISO image that are contained
    in the directory structure you feed to mkisofs, you can do that with the -m glob
    option. In this case, glob is replaced by the wildcard-style pattern matching
    the file you want to exclude. Here is an example:


    ```

    # mkisofs -m ''*.junk'' -m core -m whatever -1 livecd.iso

    ```


    In this example, all files ending with .junk would be excluded, as would all files
    named core or whatever. Instead of excluding files on the command line, you could
    add all the files you want excluded to a list and give that to the mkisofs command
    using the -exclude-list option, as follows:


    -exclude-list filename'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# Live Linux CDs


    Although it seems easiest to keep all the files for your live Linux CD in one
    directory structure, mkisofs enables you to merge files from multiple paths. Instead
    of just changing to the root of the master directory containing your complete
    CD directory structure and identifying it with a dot (.) on the mkisofs command
    line, you could add multiple paths to the end of the mkisofs command line. Files
    from each of those paths would be added starting from the root of the live CD''s
    file system. For example:


    ```

    # mkisofs [options] /home/chris/master /home/chris/stuff > livecd.iso

    ```


    Another way to add files to your live CD without having exist in the live CD directory
    structure is to use the -graft-points option to graft files or directories into
    your live CD at other points in the file system than the root directory. For example
    if you wanted to add photos from the /home/image directory to a directory called
    data/photos on the live CD, you could use mkisofs with the following option:


    ```

    # mkisofs [options] -graft-points /data/photo=/home/image > livecd.iso

    ```


    I have used this method to draw a changing set of images I download from my digital
    camera to a live CD without changing the structure of my live CD remastering (See
    Chapter 10, “Customizing a Presentation Linux CD," for an example of how you can
    graft a directory of images into your live CD.)


    # Adding Information to the ISO Volume Header


    You can add other interesting and useful options to the mkisofs command when you
    are making a live Linux CD. You might want to use a few of these options to add
    more information into the volume header for your live CD:


    +   - p "preparer-id"—Replace preparer_id with information about how to contact
    you (the organization responsible for the live CD). You might use -p "www.example.com"
    or something similar for this option.


    +   -publisher "name"—Identify the name of the publisher with this option. For
    example, you could use -p "Acme Widgets" as the value.


    +   - V "Vol1_ID"—Replace Vol1_ID with a volume name you want to assign to the
    volume. This is important because it will be used as the name of the mount point
    for the live CD in many Linux systems. For example, you could use the option -V
    "LivelinuxCD" so that the resulting live CD is inserted into a Linux system, when
    it can be mounted automatically to the directory /media/LiveLinuxCD.


    +   - volset "ID"—Specify the volume set ID. Because you can enter up to 128 characters,
    it provides space for a longer description of the volume set.'
