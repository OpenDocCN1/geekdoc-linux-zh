  md: 'That''s all there is to it. When remastering the system, you might want to
    make sure that you set up the swapfile permanently in /etc/fstab. To do this,
    you add a line like this:


    ```

    /dev/hda1/swapfile.swp    none    sw   0   0

    ```


    Another alternative, if you''re going to be using a machine as a cluster node
    on a regular basis, is to use something like the GPArted live CD to reduce the
    Windows partition bit and add a swap partition. Because most machines have fairly
    big drives, users shouldn''t need a 1GB partition for swap, and because PK automatically
    detects swap, it will make your life just that much easier—and isn''t that what
    computers are all?


    # Using Applications from the PK Live CD


    The ParallelKnoppix CD comes with quite a bit of software that isn''t necessarily
    related to clustering. You''ll find a number of editors (including my favorite,
    vim), multimedia applications, Internet applications, games, and a lot more.


    Games and whatnot won''t be on your list of desired apps if you''re actually being
    productive, but if you just happen to have the PK disc with and want to kill some
    time, you can always turn a boring old Windows machine into a Kppix desktop for
    a while.


    But PK also comes with a number of useful applications for clustering. For KDE
    menu, you''ll find a ParallelKnoppix menu (catchy, huh?), and this includes a
    set of scripts for remastering ParallelKnoppix, setting up the cluster, saving
    your PK settings, and so forth. We cover the most important of these items individually.


    If PK doesn''t include an application you want, such as Firefox, you can add it
    to the system by remastering PK. We look at that bit later in the chapter.


    # Saving Settings


    One of the annoying things about a live CD distro is that all your work disappears
    into the ether you reboot the machine—unless you have a way of saving your settings,
    PK gives you a way to do this quickly and painfully.


    Go to the ParallelKnoppix menu and look for the Save PK Configuration menu. The
    Create PK configuration archive dialog appears as shown in Figure 14-3:


    This dialog walks you through a series of options to save your personal configuration,
    network settings, printer settings, and whatnot. In Figure 14-3, I''ve asked PK
    to save my network settings, desktop files, and personal configuration. I don''t
    worry about the X configuration because I may want to use the configuration on
    a machine with a different video card.'
