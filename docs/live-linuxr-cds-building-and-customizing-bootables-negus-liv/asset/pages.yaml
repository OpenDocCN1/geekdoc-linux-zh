  md: '# CHAPTER 6 Building a Custom Knoppix CD


    +   **Memory (RAM and swap)**—At least 1GB of memory (RAM plus swap) is recommended
    to create a CD 150 image, if 5GB of memory is recommended to create a single-layer
    DVD. For example, if you have 512MB of RAM, you need at least 512MB swap for a
    CD and 4.5GB of swap for a DVD.


    +   **Hard-disk space**—For hard-disk space, you need between 3GB (CD) and 15GB
    (DVD) of space on a Linux file system. Linux file systems such as ext3 or xfs
    work fine.


    +   **Internet connection**—Knoppix automatically configures wired Ethernet cards
    and connects to the network (assuming that a DHCP server is available). If needed,
    Knoppix can also be configured manually for many wireless network cards or for
    a static Ethernet connection.


    The procedure that follows here assumes that you have a Linux system installed
    on your hard disk (with the memory and disk space available as described). To
    carry out the customization, the procedure assumes that you are booting Knoppix
    and carrying out the instructions from there. Knoppix will detect your swap area
    automatically, so you only need to be sure that the hard disk space you will use
    on a Linux file system Knoppix can support.


    # REMASTERING KNOOPPIX


    With your computer prepared as described previously, you can start the process
    of remastering Knoppix. This procedure was done using a standard Knoppix 5.0.1
    CD (about 696MB). The procedure is split into the following major parts: preparing
    for remastering, working in the ch environment, modifying boot files, creating
    the final CD image, and testing and burning the CD image.


    # Preparing for Remastering


    To begin the process of remastering Knoppix to create a custom Knoppix live CD,
    you need to work from the computer you just prepared by booting Knoppix. While
    Knoppix is running, you will copy the files you need from Knoppix CD to your hard
    disk. Here''s how:


    +   **1. Boot Knoppix**—Insert the DVD that comes with this book (or other Knoppix
    CD) into your computer''s DVD drive and reboot. At the boot prompt, type knnoppix
    and press Enter. Wait several minutes for Knoppix to boot up to the desktop.'
