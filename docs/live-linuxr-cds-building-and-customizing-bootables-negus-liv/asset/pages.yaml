  md: '# Live Linux CDs


    If the person requested Knoppix to have the KNOPPIX image written to and run from
    hard disk (tohd) or RAM (toram), linuxrc makes sure space is available to write
    KNOPPIX there. The linuxrc script also checks whether the user asked for KNOPPIX
    to be booted from hard disk or an ISO.


    +   - Mounts RAM—After checking for a reasonable size to create a RAM disk, linuxrc
    creates a RAM disk (/ramdisk). Writeable directories are created on /ramdisk that
    can be used (via symbolic links) in the file system. These locations include /home
    and /tmp.


    +   - Creates the UnionFS file system—To make all the read-only directories from
    the live CD available as read-write directories, the linuxrc scripts merge with
    writable directories on /ramdisk using UnionFS. To see which directories are linked
    from the UnionFS file system (/UNIONFS), type Is -lI / | less with Knoppix booted.
    Chapter 5 describes how UnionFS is used to enable you to merge read-only directories
    (from the CD) and read-write directories (from the RAM disk).


    +   - Sets up the /etc directory—Certain files and directories in the /etc directory
    cannot be links but must be read files. To make sure that this is, the linuxrc
    script removes files in the /etc directory it ftusers, passwd, sudoers, gshadow,
    group, pop, isdn, dhcp, and ioctl.save, init-network, sudoers, init, localtime,
    and ppm2ppa.conf. it copies version of these files from the CD.


    +   - Performs final cleanup—To clean up the /etc/stab file, the linuxrc script
    grabs information from /proc/mounts. It then removes the /linuxrc file and exits.


    With the linuxrc script finished, control of the boot process is passed to the
    Linux kernel. The kernel then passes control to the init process.


    # Starting init (and the initab File)


    The init process takes over the boot process to direct the startup of systems
    services and to set system parameters. In fact, the process ID number of init
    is referred to as the parent of all processes. The init is 1 because it is the
    first process to start on the running system and it sets all other processes in
    motion.


    The init process keys off the contents of the /etc/initab file. The services that
    init runs are based on the run level passed to init and on the services that are
    set up to start at that run level. For Knoppix, the default is to boot to a desktop
    run level (run level 5) and to run at least one start-up script that is specific
    to Knoppix.'
