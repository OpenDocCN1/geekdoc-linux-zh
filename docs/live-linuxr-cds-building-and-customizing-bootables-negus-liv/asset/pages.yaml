  md: '# CHAPTER 5 Looking Inside Live CD Components


    that the cloop driver can access it. As shown in Chapter 6, you can just pipe
    the output of the mkisofs command to the create_compressed_fs command to create
    the compressed image named KNOPOSIX.


    When the live CD goes to use the compressed image when the live CD boots, the
    compressed image is mounted using a cloop device. For example, in Knopix, the
    /KNOPPIX/KNOPPIX file on the CD is mounted on /KNOPPIX of the running live CD,
    using the /dev/cloop0 device. As files are requested from that image, they are
    uncompressed individually. Because accessing the CD drive tends to be of a bottleneck
    than the processing required to uncompress the files, using a cloop driver adds
    little or no overhead to the process.


    Because the cloop driver is maintained by Klaus Kno as part of the Knopix project,
    you can get the source code for cloop the same place you can find Knopix source
    code (at www.knopix.net/knopix/sources).


    # Using the Squashfs File System


    The Squashfs file system type (http://squashfs.sourceforge.net) is a read-only
    file system, primarily designed for archival backups. Because Squashfs was designed
    for low-overhead environments, it can work well on embedded systems, or as is
    our interest, live CDs.


    Because Squashfs was created for Linux systems, it supports many Linux features
    that might not be found in other compressed file system types. It stores complete
    user ID and group ID (32-bit) information and creation time. Large files (2⁶⁴
    bytes) and file systems (2⁶⁴ bytes) are supported. Likewise, directory and inode
    data can be efficiently compressed. Some people claim that they get about to 50%
    compression using Squashfs.


    Squashfs support is available when you create live Fedora CDs (using Kadiski).
    Developers on the Kadiski project have discussed adding extended attributes (xattr)
    to Squashfs so that Fedora will ultimately be capable of supporting security features
    from SELinux.


    # CHOOSING AN APPROACH TO CREATING YOUR OWN LIVE CD


    When you create CDs based on Linux systems, you have access to literally thousands
    of open-source software applications and utilities. In most cases, you are free
    to use and distribute the software from these projects like you, as long as you
    adhere to the terms of the GPL or similar license. Most of these terms have to
    do with not restricting other people’s access to that code.'
