  md: '# CHAPTER 2 Playing with Live Linux CDs


    # Hard-Disk Partitions


    During boot-up, Knoppix checks your hard disks and adds an icon representing each
    hard-disk partition it encounters to your desktop. None of those hard-disk partitions
    are mounted by default. To mount one and open its contents in a file manager,
    simply select the icon. It will open with read/write permission.


    Knoppix offers support for many different file system types. Whether the computer
    you are running on Linux, Microsoft Windows, BSD, or another operating system
    type installed, there is a good chance that you will be able to mount its file
    systems from Linux.


    One feature that Knoppix includes that some Linux systems do not support the NTFS
    file system type. Because NTFS is the file type most used with Microsoft Windows
    XP, Knoppix can be very useful for playing, displaying, or overusing the data
    from your Windows XP computer.


    Knoppix makes it easy to mount and unmount file systems for your disks and other
    storage media by adding information about each of your partitions to the /etc/fstab
    file. Knoppix mounts each partition to directories under the /media directory.
    Each directory is named based on the device type (IDE or SCSI) and the partition
    number. For example, the first partition (1) on the first IDE hard disk (hda)
    is named hda1. It is mounted on the /media/hda1 (with a link to /mnt/hda1 for
    backward compatibility).


    For hard disks, the mount point begins with sd. For example, the first partition
    on the SCSI disk on your computer is mounted on the /media/sda1 directory. Because
    USB flash memory drives are mounted as a SCSI device, with no SCSI hard drives,
    a USB drive would be mounted on /media/sda1.


