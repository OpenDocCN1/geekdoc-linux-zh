- img_proc: true
  md: '# Live Linux CDs


    security live CDs offer no graphical interface but still make hundreds of Linux
    commands available to use (while consuming only a few megabytes of disk space).


    Knoppix-STD (http://s-t-d.org) contains hundreds of applications for tracking
    down problems and repairing systems and networks. It contains forensics tools
    such as autopsy and slumkit. It also includes honeypots (such as honeyd) for catching
    intruders and a range of network-monitoring and sniffing utilities (such as ethereal
    and tcpdump). Vulnerability-assessment tools include nessus, imap, and several
    CGI scanners.


    # Firewall Live CDs


    You can run a dedicated firewall system from a live CD. Along with basic firewall
    features (such as those included in iptables), a live firewall typically includes
    server features for your LAN, such as DHCP and DNS.


    Firewall live CDs often fit in less than 100MB of space and are built to run on
    low-end computers (so you can use any Pentium in your closet as a devoted firewall).
    If there is a GUI at all, it is typically lightweight. More often the firewall
    is configurable by commands or a simple menu system. In other cases, a basic Web
    server runs on the live CD so you can configure the firewall from a Web browser
    on another machine on the LAN.


    Devil-Linux (www.devil-linux.org) is a firewall live CD that can be configured
    to match the network environment you are using. With Devil-Linux, you can run
    a firewall on a computer that has no hard disk at all.


    The Sentry Firewall CD is an example of a live firewall CD that can run on minimal
    hardware (a minimum of 32MB of RAM is required). The kernel is a 2.4 Linux that
    is enhanced to include several security patches from projects such as OpenWall,
    strongSwan, and etables. Sentry Firewall includes Snort (www.snort.org) for intrusion
    prevention and Bind (www.isc.org/products/BIND) so the firewall can act as a DNS
    server.


    # Live CDs for Developing, Testing, and Showcasing Applications


    For software developers, having to install a new operating system to test a software
    project they are working on can be a. A live CD containing a particular operating
    system version, desktop environment, or server configuration can provide the platform
    a software developer needs to test software without having to install a new operating
    system.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# CHAPTER 1 Starting Up with Live Linux CDs


    The GNOME project offers the GNOME LiveCD (http://live.gnome.org/Gnome-LiveCd).
    Although the GNOME LiveCD is intended primarily to demo GNOME for people such
    as Linux group members and journalists, the GNOME project encourages other software
    projects to use this CD as a base for demos of their projects.


    Monoppix is a Knoppix-based live CD that helps developers start using tools to
    develop Mono runtime environment, compiler, and class libraries. Sample applications
    let developers see how to begin writing text-based and graphical applications,
    as well as applications for accessing MySQL databases.


    One version of the Slav live CD (http://slack.linux-live.org), called KillBill,
    is geared toward testing Windows applications to see whether they can run in Linux.
    Tools included on the disk help people try Windows applications using wine, dosbox,
    and Qemu.


    # Specialty Presentation Live CDs


    You can create a live CD that launches into a special presentation or application.
    For example, you can boot up to a slide show or an OpenOffice.org Impress presentation.
    Using a variety of methods, you can configure your selected application to start
    at boot time, without requiring the user to log in.


    Add custom backgrounds, icons, screensavers, and menus to have the entire desktop
    present the look and feel representing your presentation. Alternatively, you can
    run an application, as a Web browser, in full screen mode so that the person using
    your CD doesn''t even see anything but your presentation.


    # Disaster Center Live CD


    When someone says that necessity is the mother of invention, that person might
    be referring to some live CDs created during the 2005 hurricane season in Louisiana.
    One disaster center in Lake Charles, Louisiana, started with some used (diskless)
    PCs and a single Internet connection. They created both Linux and Windows live
    CDs that included a secure operating system to let people browse the Web, send
    and receive e-mail, make phone calls (VoIP), and complete other critical communications
    during the aftermath of the disaster.'
