    You can see from this example that /UNIONFS is a union of /ramdisk, /KNOPIX, and
    /KNOOPPIX directories. Permission on a branch can be read/write (rw-), read-only
    (r-), or read-only for an NFS file system (r-n). You can also use unionctl to
    add (-add), remove (-remove) or change the read/write mode of a branch.


    # Using the Cloop Driver


    Cloop is a technology used by live CDs, as Knoppix, to compress a supported Linux
    file system so that it can be uncompressed on-the-fly when the live CD is used.
    To compress the file system, the create_compressed_fs command is used. To uncompress
    data as it is requested, the cloop driver (which needs to be added to the Linux
    kernel) is used.


    Using cloop technology, you can more than double the amount of software and data
    you can get on a live CD. For example, the KNOOPPIX file-system image that consumes
    less than 700MB on a Knoppix CD holds more than 1.7GB of data. The 1.8GB KNOOPPIX
    image on a Knoppix DVD holds over 4.5GB of data. As you can see, using cloop compression,
    you can have 2.5 times the amount of software available on your live CD as you
    would if not compressed.


    If you have remastered Knoppix (as described in Chapter 6, "Building a Custom
    Live CD"), you have probably already used the create_compressed_fs command. With
    your remastered Knoppix file system completed and gathered into an ISO image,
    you run this command to compress image so'
