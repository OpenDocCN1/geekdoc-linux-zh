  md: '# Live Linux CDs


    This should give you a directory such as devil-linux-1.2.10-i586-SMP. In this
    directory, you''ll find a sample configuration tarball (etc.tar.bz2), the ISO
    image for Devil Linux, scripts for creating Devil Linux ISOs, and documentation.


    > NOTE

    to use Devil Linux, you''ll need to have at least a 48MHz CPU, 32MB of RAM, two
    or three Ethernet cards supported by Linux, and a device to store a configuration
    to. In this chapter, we assume that you have a hard disk attached to the computer—even
    a small one will do. You can also use a USB flash drive or floppy disk, if you
    still have any floppies!


    # BOOTING THE DEVIL LINUX LIVE CD


    When you first boot Devil Linux, you will see a menu with several options for
    screen resolution and the option to press F1 for help. If you don''t enter one
    of the screen resolutions or boot parameters, or press F1, Devil Linux starts
    after 5 seconds by default.


    As part of the boot process, Devil Linux looks for configuration files on other
    media—IDE and SCSI disks and CD-ROMs, floppy disks, and so forth. It looks for
    a file called etc.tar.bz2; if it finds this, it uses that configuration.


    You can also find the location of the configuration archive to Devil Linux using
    this syntax:


    ```

    DL_config=/dev/ide/disc0/part1:myconfig.tar.bz2

    ```


    So, to be clear, the complete command line includes the kernel name as well. This
    is taken as read in the Devil Linux documentation and is likely to confuse new
    Linux users. The entry command line would look like this:


    ```

    boot=/vmlinux root=/dev/ram0 initrd=/boot/initrd.gz

    init=/linuxrc DL_config=/dev/ide/disc0/part1:myconfig.tar.bz2

    ```


    That probably seems a lot of typing, but remember that you have your firewall
    set up, you shouldn''t need to reboot very often.


    This example would tell Devil Linux, "Look for the myconfig.tar.bz2 on the first
    IDE disk (disc0) on the first partition (part1)."


    > NOTE

    The syntax is a bit muddled—0 is the first disk, but 1 is the first partition.
    Not only is counting from 0 confusing, but it''s also nonstandard across the board.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# CHAPTER 13 Customizing a Firewall Live Linux CD 39


    Finally, you can string more than one config location, if you need to, by separating
    them with commas, like so (make sure that the entire text of both lines is typed
    into one line):


    ```

    DL_config=/dev/ide/disc0/part1:myconfig.tar.bz2,/dev/scsi/disc0/part1:siconfig.tar.bz2

    ```


    Note that there''s no space between the comma and configuration locations.


    If this is the first time you''re booting Devil Linux, you can save the bit of
    time it takes to scan the drives by passing this option instead:


    ```

    DL_config_no_scan

    ```


    The initial scan can take quite a while (a couple minutes, so you probably wont
    use the DL_config_no_scan parameter if you already know that you don''t have the
    configuration file.


    If you don''t pass the DL_config_no_scan parameter and there''s no configuration
    file for Devil Linux to find, it will stop during boot-up with a prompt saying
    "Would you like to load DL without configuration Media?" Go ahead and press; Devil
    Linux then finishes booting.


    Devil Linux also includes the memtest utility on the live CD, if you''re a bit
    concerned that a machine has bad RAM, you can type M at the prompt to boot Devil
    Linux into memtest.


    Pressing F1 takes you to the help screen, and F10 returns you to the main menu.
    When the CD finishes booting, it''s time to log in.


    # LOGGING IN AND SETTING UP DEVIL LINUX


    When Devil Linux boots up, you can log into the system as root with no password.
    Devil Linux has no regular user defined by default.


    It''s worth noting that Devil Linux can also make a passable rescue CD because
    it includes a fair number of standard utilities that you might need, including
    fdisk, fsck, chmod, and other standard GNU utilities that can help with rescuing
    a system.


    The first thing you''ll want to set up a file system to save your configuration
    on—assuming you don''t have a file system already available. You''ll need to do
    this using the fdisk command, which is pretty simple.


    If you''ve never used fdisk, the first thing to do is scan for devices. You can
    do this using this command:


    ```

    # fdisk -l

    ```'
