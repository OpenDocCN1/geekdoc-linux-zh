    In this example, mksoiso creates a boot image knoppix.iso in the /knoppix

    direct from the current directory (notice the dot on the last line). The -b

    option indicates the location of the El Torito boot image added.

    ISO image (knoppix.iso) is created in no emulation mode (-no-emul-boot)

    and --boot-load-size is 4 (meaning that four 512-byte sectors are used).

    --boot-info-table option inserts a 56-byte boot information table into the

    boot file (indicated by the -b option). (See Appendix B for more information

    on the knoppix command).


    You should now be able to test knoppix.iso by burning it to a CD and

