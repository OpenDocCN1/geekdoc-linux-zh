  md: '# Live Linux CDs


    > TIP

    Excluding Docs


    You can save some space on your live CD by excluding documentation that comes
    with Fedora packages. An Everything install of Fedora Core results in more than
    200MB of documents, man pages, and info files in /usr/share/. To exclude documentation
    from packages you install to your live CD, %packages should appear as %packages
    --excluded.


    %post

    You can add scripts you want to run after packages are installed on separate lines
    following the %post directive. This is a good place to do some initial configuration
    of your live CD. For example, you could use useradd to add a user. Using the encrypted
    created earlier for root, here are some commands to add a user after the %post
    line:


    ```

    %post

    /usr/sbin/useradd chris

    /usr/sbin/usermod -p $1$oB11gYQPhb0JqjHyTYRcxrEwKN0 chris

    /usr/bin/chfn -f "Chris Jones" chris

    ```


    In the example shown, the user name is added to the live CD, with a home directory
    /home/chris created by default. The usermod command enters the password for chris.
    Finally, the chfn -f sets the user''s full name to Chris Jones.


    To find more information about this and other options you can set in your kickstart
    file, refer to the kickstart-docs.txt file in the /usr/share/doc/anaconda* directory.
    To get that file, you must have the anaconda RPM package installed.


    # Adding Post-Install Scripts


    You can change any of the post-install scripts (which are located in the following
    directory: /usr/share/kadischi/post_install_scripts) to modify the contents of
    the live CD you are creating Fedora Core is to the build directory and before
    the file system is compressed and made into an ISO image. Likewise, you can add
    your own scripts to the post_install_scripts directory.


    The post-install scripts are run with the location of the build directory (containing
    the newly installed Fedora Core live CD system) as an argument. Script names begin
    with a number, to indicate the order in which each script is run.'
  merge: -1
