  md: '# UNDERSTANDING THE BOOT PROCESS


    In this chapter, I take you through the entire process of booting a live CD. Because
    the boot process can go in different directions, I step you through the boot process
    of a live Linux CD. Along the way, I note how the process might branch off into
    different directions. Through the descriptions, here we cover the following:


    +   - PC with x86 architecture—As with most of the discussions in this book, PCs
    are used in the examples.

    - Knoppix—Because of its popularity, Knoppix is the live CD used in this example.

    - CD-ROM (El Toronto)—The ISO 9660 Knoppix image boots from CD-ROM because the
    Knoppix ISO image was created, components described in the El specification were
    added (such as a boot image and boot catalog). El Toronto is an extension of the
    ISO 9660 standard that places boot information on a well-known place on the CD
    so that a computer Basic Input/System (BIOS) that supports El Toronto can find
    and boot from it.


    In general, the following sections fill out the boot process of your live CD example:


    +   - Boot medium—The process begins with PC x86-compatible hardware and the medium
    you add to that hardware. Although we are bypassing the normal "boot from a hard
    disk" process, the discussion of boot media isn''t limited to CD-ROMs. It also
    includes booting from other non-hard disk media: floppy disks, USB flash drives,
    Zip drives, and network cards (PXE boot).

    - BIOS—settings initially determine what order in bootable devices (floppy drive,
    hard disk, CD-ROM, and so on) are checked for information that would allow the
    computer to boot from those devices.

    - Boot loader—When the BIOS determines which medium to boot from, the computer
    looks for a boot record on that medium. That boot record points to a boot loader
    (such as Isolinux, GRUB, or LILO) that can be configured to let the user choose
    among various boot labels. Each boot label represents a different combination
    of operating system and boot options.

    - Kernels and initial RAM disk—When the selected boot disk is started for a Linux
    system, an initial RAM disk is identified and mounted, and the root file system
    and a kernel are started that draws from that initial RAM disk.

    - First script run—After starting the kernel and before starting up system services
    associated with the system level, Knoppix (and'
