    # BURNING ISO IMAGES WITH CDREORDER OR K3B


    When you have a completed ISO image, you can use many tools for Linux and Windows
    for burning the ISO image to CD or DVD. This section covers two popular tools
    for burning images to CD and DVD that are available with every major Linux distribution:
    cdrecord and K3b.


    # Burning CDs and DVDs with cdrecord


    The cdrecord command is an easy-to-use tool you can use to burn your images to
    CD or DVD. By supporting the ATA Packet Interface (ATAPI) standard, cdrecord can
    work with IDE CD-ROM drives using SCSI commands that are transported over the
    IDE interface. To cdrecord, an IDE CD drive looks like a SCSI device. This works
    fine because all CD/DVD use SCSI commands to communicate.'
  merge: -1
  pgno: 414
- img_proc: true
  md: '# APPENDIX B Building, Testing, and Burning ISOs


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_415_0.png)


    FIGURE B-4 Use VMware Player to boot CDs on a Linux or Windows desktop.


    Every Linux distribution that I know includes the cdrecord command. If you have
    a recent Linux distribution, it probably includes cdrecord 2.0 or later. Jörg
    Schilling cdrecord, but several Linux distributions (including Red Hat Linux systems
    and SuSE) maintain their own versions of cdrecord.


    Using default settings (set in the /etc/cdrecord.conf file), you are required
    to add a lot of options to cdrecord. The default drive is typically to /dev/cdrom
    in that file. If a writable CD or DVD drive is your first drive, and that is not
    being used currently to run a live CD, you might be able to burn an ISO image
    to CD or DVD with one option: the name of the ISO. For example, if your ISO image
    were in the current directory and were named livecd.iso, you would need to insert
    a blank CD into the drive and perform the following:


    # # cdrecord livecd.iso


    With the example shown just, when cdrecord completes, you can eject the CD or
    DVD and you are done. If that doesn''t work, or if you want a bit more control
    over the process, you can use one of many options to cdrecord.


    You can get information about your writeable drives in several ways before proceeding.
    If you have multiple CD or DVD drives, you might need to indicate which'
