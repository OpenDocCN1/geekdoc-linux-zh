  md: '# Choosing a Base Linux System


    One of the biggest choices you make before you start is which Linux system to
    base your live Linux CD on. For this book, three basic Linux distributions were
    chosen for producing live CDs: Debian/Knoppix, Fedora, and Gentoo. Each of those
    three Linux distributions has large software repositories for you to draw from
    and active communities to back you up.


    > NOTE

    If you are a Slackware enthusiast, there are several SLAX live CDs (www.slax.org)
    you can try out. You can easily customize a running SLAX CD by adding software
    modules. That process is described in Chapter 9, "Customizing a Secure Linux CD,"
    for customizing the SLAX-based BackTrack security CD.


    # Knoppix and Debian-Based Live CDs


    Knoppix is the most mature and widely bootable Linux CD. It''s the first CD you
    should try. This is probably the best one to use for your first remaster as well.
    That''s because Knoppix was built from the ground up to run as a live CD and has
    gone through many iterations to get it right. When you begin with Knoppix, you
    know you are starting with a known, working community.


    Features include the following:


    +   - Linux 2.6 kernel—The Linux 2.6 kernel offers many enhancements over the
    previous 2.4 kernel, especially in the area of managing devices. Although all
    major Linux distributions offer the 2.6 kernel, many live CDs available still
    use the 2.4 kernel.

    - Hardware detection—Knoppix offers excellent hardware detection and configuration.
    Most notably, you will almost always get a working X desktop (which you can tune
    further, if you like) because Knoppix gives such a good job detecting and configuring
    your video card.

    - KDE desktop—Knoppix uses the KDE desktop by default, although you can select
    to use a lighter window manager instead (including fluxbox, icewm, twn, larsch,
    wm, or xfce). KDE offers more custom applications than does GNOME (the other major
    Linux desktop environment). Many more features are available for customizing KDE
    as well. If you prefer GNOME, you can try the GNOME version of Knoppix, called
    Knoppix (www.gnoppix.org).'
