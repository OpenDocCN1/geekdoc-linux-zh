    # Using the GRUB Boot Loader for a Live CD


    The Grand Unified Bootloader (GRUB) is the most popular boot loader used to boot
    Linux systems are installed to hard disk. Its popularity stems from the fact that
    it can boot a wide range of computer operating systems, plus it understands different
    file systems and kernel executables (so GRUB can boot using the name of the kernel,
    instead of needing to know where the kernel is physically located on the disk.'
