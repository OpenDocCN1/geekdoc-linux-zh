  md: "# CHAPTER 7 Building a Basic Fedora Live CD\n\n# Changing Boot Parameters and\
    \ Splash Screens\n\nAs with most linux CDs, the initial boot process of a Fedora\
    \ live CD is directed by the Isolinux bootloader. By adding or modifying files\
    \ in the /boot/isolinux directory, you can add options, message files, and splash\
    \ screens to change the look and behavior of your live CD. (See Chapter 5, “Looking\
    \ Inside Live CD Components,” for more information about isolinux works).\n\n\
    Possibly best to modify the isolinux files for your live CD is through the /usr/share/kadishi/install-boot.sh\
    \ file. Besides copying files needed to initially boot the CD to the /boot/isolinux\
    \ directory, it creates the /boot/isolinux.cfg file, which defines the initial\
    \ boot screens and activities.\n\n> WARNING\n\nBe sure to have a backup copy of\
    \ the install-boot.sh file before proceeding. If there is a mistake in this file,\
    \ it could prevent your live CD from booting at all.\n\nThe following procedure\
    \ steps you through modifying the install-boot.sh script to add or change text\
    \ appearing on your boot screens, for example, add an image to your initial boot\
