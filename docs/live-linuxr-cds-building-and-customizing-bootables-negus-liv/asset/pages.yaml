- img_proc: true
  md: '# UNDERSTANDING KNOPPIX REMASTERING


    Remastering Knopp begins from a computer with a lot of disk space, a bunch of
    memory (RAM and swap), and a running Knoppix live CD. The basic steps for creating
    your own remastered live CD includes:


    +   - Choosing a Knoppix distribution—This procedure uses the Knoppix CD, but
    you can choose to start from an already customized Knoppix derivative that includes
    content that might be closer to what you want.

    - Setting up the build machine—Prepare the computer to have enough disk space
    and memory to complete the procedure.

    - Copying Knoppix software to hard disk—This involves copying both the Knoppix
    file system structure from the CD for you to modify (source directory) and the
    files needed to boot the CD (master directory).

    - Modifying the Knoppix software—You can add and delete software, set features,
    and configure the user desktop environment. You do this in a chroot shell.

    - Compressing the Knoppix software—After you have made your modifications, you
    compress the Knoppix software into a single image (named KNOPPIX) that is copied
    to the master directory.

    - Modifying boot files—If you choose, you can change the splash screen that appears
    when the CD boots or modify linux boot files.

    - Creating the CD image—Combine the boot files and KNOPPIX image into a single
    CD image that you can burn to CD, DVD, or other medium to boot up your final customized
    Knoppix.


    Figure 6-1 shows the general flow of what happens when you remaster Knoppix to
    make your own custom live CD. It begins by booting a Knoppix CD on a PC that has
    enough available memory and disk space to handle the process and ends when you
    burn your custom ISO image to a blank CD. In between, you modify the contents
    of the Knoppix system you copy to disk so it includes the software and settings
    you.


    If you are ready to start creating your own customized, remastered Knoppix CD,
    you can begin by choosing the Knoppix distribution you want to use as the basis
    for your custom Knoppix CD.'
