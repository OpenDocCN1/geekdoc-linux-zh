    As you can see, in the first example, there''s one SCSI disk on this system, and
    it already has a Linux partition. The second example looks a little more complicated,
    but it''s not too hard to follow; the system has an IDE drive as the first device
    on the first IDE, which translates to /dev/sda. SCSI disks are sdn and IDE disks
    are nd where n is the letter for the device—a for the first, b for the second
    one, and so on.


    If the disk doesn''t have a partition or you just want to get rid of it and start
    fresh, running something like this:


    ```

    fdisk /dev/sdb

    ```


    Replace /dev/sdb with the appropriate device. Note that you''ll see an error message
    about lacking a file system if the disk has never been initialized. It''s okay
    to ignore that.


    To create a new partition, press n at the fdisk menu and follow the prompts. Note
    that you can use the fdisk help menu by pressing m; remember to write the changes
    to disk when you''re finished with w, or press q to without saving.


    When you''ve got that finished, run setup to enter the Devil System Configuration
    screen shown in Figure 13-1. Although many menus are self-explanatory, the following
    descriptions will walk you through a few of the important menus.


    First I recommend that you set the root password (the LoginPW password); you don''t
    want to have a firewall with a blank root password, right?


    After that, it''s time to move on to the basic configuration. Select the Basic
    option from the System Configuration menu shown in Figure 13-1. The Config Menu
    appears as shown in Figure 13-2.


    In the basic configuration, you can configure the host name, time zone, keyboard
    layout, and so forth. Go ahead and set up the system the way you like it, and
    press Back when you''re finished.'
