  md: '# CHAPTER 2


    # Playing with Live Linux CDs


    The DVD included with this book contains more than ten Linux live CD distributions.
    By trying out these different distributions, you can start drawing on the wealth
    of open-source software that is available today. You can also get a sense of the
    applications and decisions that went into making these different live CDs, so
    you''ll have a head start when you create or customize one of your own.


    Among the mix of live CDs on this book''s DVD are CDs meant for general desktop
    use, gaming, multimedia, and security/recovery. This chapter describes special
    features of each of those live CDs, as well as some of the applications that come
    with them. If you don''t have a DVD drive available, later sections describe where
    you can download or purchase the CD versions of those live CDs.


    # Before Booting a Live CD


    Most live CD developers want you to have the same experience with their live CD
    as you would using an installed Linux system. To get to that happen, however,
    they have to do a few tricks. Before you boot up a live CD, you understand that
    using live CDs can result in different behavior than you would expect from running
    an installed Linux system:


    +   - Longer time—Booting from a CD typically takes longer than booting from a
    hard disk. One reason for this is that data access from a CD is slower than hard-disk
    access. Also, booting up a live CD typically takes more time to autodetect and
    configure hardware that would have already been configured during a hard-disk
    installation. Extra time autodetecting such things as your video hardware is needed
    partly to get a working desktop system without any user input.'
