    # # TRYING A TEST BUILD


    With the repository in place, you can run the kadishi command to try your first
    test build of an ISO image. As I noted earlier, you basically go through the same
    process you would install Fedora Core to a hard disk. However, instead of the
    result of the installation being a Fedora Core system installed on partitions
    of your hard disk, the result is a single ISO image containing an entire bootable
    Fedora Core system.


    To start the process of creating your own live CD, run the kadishi command as
    follows:


    ```

    # kadishi HOME/FC6 HOME/FC6-live.iso

    ```


    At this point, you should see the Kadishi Fedora LiveCD Creator Tool. Type in
    the following information, based on how you set up your repository and where you
    want your ISO image to be:


    +   * **Enter a Repository**—Type the full path to the directory where you added
    your repository. For example, I created my Fedora software repository in the directory
    /home/chris/FC6/.


    +   * **Enter a filename and its location**—This is where you want the ISO image
    to go. In my case, I entered /home/chris/FC6-live.iso.'
