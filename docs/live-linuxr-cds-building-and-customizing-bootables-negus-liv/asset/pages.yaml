  md: '# Starting Up with Live Linux CDs


    Creating live Linux CDs involves more than just boot files and compression techniques.
    It''s about letting loose your own creativity to make available at all times the
    exact set of tools and tools you love to use. It''s about creating and displaying
    your presentation, music, video, and image content exactly as you want.


    This book is about live CDs that are built from Linux system technology and draw
    on a pool of thousands of open-source software components available today. In
    this book, you learn how to find, use, customize, and remaster live CDs—and even
    build them from scratch.


    The DVD that comes with this book contains a handful of live Linux CDs that you
    can use separately from a single boot prompt. It also contains many of the software
    tools you need to create anything from a lightweight desktop system that run from
    a 50MB bootable business-card CD to a multigigabyte DVD containing a dizzying
    array of desktop, server, and system-administration software.


    This book starts with novice tricks for running live Linux included with the book''s
    DVD and takes you to guru skills, which you can build, customize, and remaster
    specialized Linux distributions. When you are finished, you end up with the perfect
    bootable Linux system for your own use, or even your own Linux distribution to
    share with the world.


    # UNDERSTANDING LIVE LINUX CDs


    A live CD separates the computer system from the computer. Whereas an operating
    system is usually permanently installed on the computer''s hard disk, a live CD
    is typically designed to boot and run entirely from a read-only medium (such as
    a CD-ROM).'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'With a live CD, you no longer have to be tied to a desktop or even a laptop
    computer to do your computer work or play. Instead, you can carry an entire operating
    system, important applications, and even your data (music, documents, video, images,
    and spreadsheets) on a single CD, DVD, or USB flash drive (about the size of a
    pack of gum). Your whole computer system goes where you go and run on almost any
    PC that''s handy.


    The explosion of high-quality open-source software and the popularity of the Linux
    operating system have created a fertile landscape for Live CDs. As a result, you
    can find dozens of Linux-based live CDs that are available for you to download
    and use freely. There are also powerful tools for customizing live CDs and building
    your own remastered (or from-scratch) live CDs.


    In recent years, Linux development has seen a lot of action, resulting in some
    sophisticated tools and solid base systems to build. Low-cost, high-capacity media,
    such as USB flash memory, CDs, and DVDs, make the concept inexpensive for anyone
    to create a live Linux distribution. Also, unlike proprietary software, you have
    great freedom to copy, adapt, and customize most open-source software, without
    cost.


    # Running a Live Linux CD


    Using a live CD is one of the best ways to start with Linux, whether you want
    to try Linux for yourself or encourage others to become Linux enthusiasts. With
    a live Linux CD, you can do the following:


    +   **Try Linux**—If you are hesitant to mess with your hard disk, a live Linux
    CD represents a way to try a functional Linux system without disturbing your hard
    disk''s contents.


    +   **Test hardware**—Before committing to a hard-disk install, you can use a
    live CD to check that the hardware will work with Linux. CDs such as Knoppix provide
    tools for getting some of the trickier PC hardware elements working (such as sound
    cards and wireless-networking cards).


    +   **Take Linux on the road**—When you become comfortable with Linux and your
    favorite open-source applications, a live CD is a great way to take the whole
    system on the road without carrying a computer. Boot up the live CD on an available
    PC (especially if you''ve included your own settings and customizations with the
    CD), and you can be up in minutes with all your favorite applications.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# CHAPTER 1 Starting Up with Live Linux CDs


    +   - Do something special—You can set up a live CD to do special tasks. For example,
    you can use a distribution such as GeeXBox or MobiX to boot up to a movie and
    music player. You can use a Linux-oriented live CD as a toolbox for monitoring
    and checking the security of systems on your LAN.


    +   - Harness use of computers—Using a cluster-type CD in multiple computers on
    your network, you can share others'' processing resources. This enables you to
    provide high availability (if one system fails, the other can take over), load
    balancing (so demand for a server can be spread across multiple machines), and
    high performance computing (to divide computation-intensive applications across
    many systems).


    +   - Install Linux permanently—Linux systems such as Ubuntu, Gentoo, and LinuxOS
    offer a live CD that can double as an install CD. That way, if you are comfortable
    with how the live CD works, you can install Linux systems permanently right from
    the running CD environment.


    Starting up a live CD or DVD is as simple as inserting the CD or DVD into the
    computer and rebooting. You can use options you on the boot screen to enable various
    services associated with the live CD when it is running. Then it is up to you
    to do any special configuration that''s needed (set up printers, desktop settings,
    network connections, and so on).


    # OVERCOMING THE FIRST HURDLES TO LINUX


    Although installing Linux is not hard if you are used to it, installing can be
    a showstopper if it is your first Linux experience. Using a live CD can make the
    first brush with Linux much more pleasant by avoiding common problems that first-time
    users have with Linux installation.


    Here is a common scenario when installing Linux for the first time on a PC with
    a hard disk that is completely consumed by Windows.


    +   - Freeing disk space—Because all disk is assigned to a Windows (NTFS) partition,
    the first task is to free up some disk space from Windows to make room for Linux.
    Because of patent issues, Linux distributions don''t include the capability to
    resize Windows (NTFS) partitions; you might have to find a separate partitioning
    tool.


    +   - Partitioning—Before Linux can be installed to the disk, the free disk space
    must be divided (partitioned) and formatted in particular file system types. In
    some cases, the Linux installer handles the partitioning; in others, you must'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Live Linux CDs


    understand issues such as swap space, file system types, and whether a separa-rate,
    /boot partition is needed.


    +   **Hardware configuration**—During the install process, you might be asked
    to configure your video card, monitor, network card, or other hardware. Some Linux
    systems are better than others at detecting and automatically configuring your
    hardware; most ask you to provide some level of information to configure your
    hardware during the installation process.


    A live Linux CD such as Knopp is designed to start up without prompting you for
    any information. It doesn''t care if Windows constructs your hard disk because
    it doesn''t need to touch your hard disk to run. It is designed particularly to
    detect and configure (at least, to a workable minimum configuration) your video
    card, network hardware, sound card, and other available hardware. If any of these
    features isn''t working, you have an opportunity to pass options on the boot screen
    to have the live CD enable or disable selected features.


    With a booted live install as the proof that Linux will run on your PC, going
    to a permanent install is a daunting prospect. In fact, Knopp includes the tools
    you need to resize your disk partitions and further configure hardware (such as
    printers, TV cards, and other hardware). You can write down the drivers and configuration
    information from your Knoppix system and use that information to reconfigure if
    problems arise when you permanently install Linux.


    # USING DIFFERENT TYPES OF LIVE CDs


    When creating a live CD, you can choose which applications and other components
    to include in it; the live CD can be a generic or a highly tuned system. The Linux
    CD can contain a complete computer system, loaded with nearly every application
    imaginable. Or it can be a special-purpose system.


    Special uses for a live Linux CD are limited only by your imagination. By making
    your own live Linux CD, you can go beyond what popular Linux distributions can
    do. As an individual, you can obtain or purchase all sorts of applications or
    content for a personal live CD that aren''t available for a Linux distribution
    to distribute freely.


    Chapters 9-14 describe different types of live CDs that you might be interested
    in using or creating. The following subsections describe some examples of specialized
    live Linux systems that other people have created.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Desktop Live CDs


    With a live Linux CD that''s tuned to be a desktop system, you can work on the
    road as you do from home. A typical desktop live CD contains word processing,
    spreadsheet, e-mail, and Web browsing applications, as well as any other type
    of software available from a typical home or work computer. With live CDs that
    offer persistent desktop features, you can store your own Web bookmarks, e-mail
    settings, buddy lists, or other features you need on a USB flash drive or writable
    medium.


    As I noted earlier, Knoppix is the most popular live CD and one of the best ones
    to start with. Its excellent hardware detection and configuration make it easy
    for beginning Linux users. Although Knoppix boots up to a KDE desktop, custom
    versions of Knoppix offer other desktop environments and window managers.


    Chapter 2, "Playing with Live Linux CDs," and Chapter 3, "Customizing a Live CD,"
    contain descriptions of how to use Knoppix. Chapter 6, "Building a Custom Knoppix
    Live CD," includes information on remaining Knoppix. Figure 1-1 shows an example
    of the Knoppix desktop:


    ![](img/6b7a4aaf8c4f76728e9b63b90222dd8e_31_0.png)'
