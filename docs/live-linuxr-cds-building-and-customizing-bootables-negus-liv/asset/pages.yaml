    # Selecting a Desktop Environment


    If a nifty desktop system is a priority, you might go with KDE or GNOME desktop
    environments if your live CD. If you want your desktop to run more efficiently,
    you might consider just using a simple window manager.


    Besides choosing the type of desktop you want, personalizing it for yourself or
    for the software project you are showcasing on your live CD can do a lot to make
    that live CD special. You can add a customized login screen, wallpaper, desktop
    icons, menus, screen savers, or other items to present the look and feel you want
    to get across with your live CD.


    # BURNING AND FANCING UP YOUR LIVE CD


    After you have produced your live Linux CD, how you distribute it is the last
    question you need to answer. You can simply deposit the live CD image to an FTP
    server (adding an appropriate checksum so downloaders can verify that it'' not
    corrupted) and publish the address to anyone you like. If you want to distribute
    your live CD, you can have it burned to CD, DVD, or use a USB flash drive.


    Linux, Windows, and almost every other operating system include applications for
    burning an ISO image to CD or DVD. In Linux, the most command-line utility for
    burning CDs is the cdrecord command. You can use the growisff to burn multisession
    CDs and DVDs. For a graphical interface, you might consider trying the K3b CD
    burning application.


    To add some final polish to your live CD, create a label for it. Some live CD
    projects produce their own labels that give you permission to use (although they
    might want you to use it only if you are not remastering the CD). Figure 1-11
    shows the CD label (left) and jewel case cover (right) that are available with
    the Dyneolic live CD.'
