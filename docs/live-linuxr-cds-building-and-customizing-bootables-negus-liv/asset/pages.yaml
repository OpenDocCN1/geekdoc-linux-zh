  md: '# Live Linux CDs


    However, what makes the distribution of DeCSS illegal is the DMCA and various
    hacker laws around the world. The DMCA made it a felony in the U.S. to circumvent
    copyright protection, as DeCSS did. To my knowledge, there has been no legal action
    taken against anyone in the United States for using or distributing code that
    breaks DVD encryption. One of three creators of the DeCSS, Joon Lech Johansen,
    tried several times in Norway under a criminal hacker law but was later acquired
    (http://en.wikipedia.org/wiki/DeCSS).


    Because of licensing issues and other legal entanglements, most open-source DVD
    players use the libvdcss library (http://developers.videolan.org/libdvdcss) for
    unscrambling and accessing commercial DVDs Based on the Content Scrambling System
    (CSS). Despite the fact that CSS is not a real copy-protection system, but a means
    of keeping people from playing DVDs without licensed software, major Linux distributions
    do not include libvdcss in their distributions.


    With all that, software for playing just about every audio and video under the
    sun is available from unofficial sources to go most Linux distributions. In some
