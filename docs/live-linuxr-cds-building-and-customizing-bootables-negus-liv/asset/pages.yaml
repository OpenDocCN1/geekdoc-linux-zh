  md: '# NOTE


    Instead of using the file system from the initial RAM disk going forward, Knoppix
    live CDs built using kadisci set up the permanent file system structure separately
    from the initial RAM disk. When the new environment is set up, the pivot_root
    command is run to change the running-kernel to use the new file-system structure.


    # The linuxrc Script


    A linuxrc script in the root directory of the initial RAM disk file (minirt.gz
    in Knoppix) directs much of the initial setup of the live CD environment. Most
    of what this script does is mount the file systems that the CD will use when the
    boot process is completed. However, in Knoppix, the linuxrc script also makes
    sure that modules are loaded to handle any special hardware requirements (such
    as SCSI devices) that the live CD may encounter.


    The work that linuxrc boots at this point is accomplished with the limited number
    of commands and modules available at this point. Most of the work is done using
    commands that are built into the Linux kernel, the ash shell, and commands for
    adding and removing modules (insmod, rmod, and modprobe). These are some of the
    things that linuxrc script does:


    +   **Sets colors**—As Knoppix boots, you will notice that different types of
    messages are displayed in different colors. These color changes make it bit easier
    to see what is going on as Knoppix boots up. In the linuxrc script, the following
    variables are set to the color names they represent, to output different types
    of messages: RED (failure or error messages), GREEN (success messages), YELLOW
    (descriptions), BLUE (system messages), MAGENTA (found devices or drivers), CYAN
    (questions), and WHITE (hint).

    You also notice that Knoppix uses these colors in some fun ways. The "Welcome
    to KNOPPIX" message displays each of the letters in KNOPPIX as a separate color.


    +   **Mounts system file systems**—The /proc and /sys file systems are mounted
    within the linuxrc script. The /proc file system provides an interface to data
    structures used by the kernel. The /sys file system contains data registered by
    built-in drivers that can be accessed from processes in user space.


    +   **Checks options**—The linuxrc script checks options that the user or the
    isolinux.cfg file may have set. These values cause environment variables'
  merge: -1
