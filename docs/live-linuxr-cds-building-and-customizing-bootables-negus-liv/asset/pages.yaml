    the final ISO image.


    # SUMMARY


    The Puppetix live CD was created for this book to illustrate how to make a live
    CD that boots up directly to a slide show or presentation. Using the GRUB boot
    loader, a Puppetix user can select from a menu of presentations. The operating
    system boots up to a remastered Damn Small Linux that results in a full-screen
    display of the selected presentation.


    Starting with a mini desktop distribution, such as Damn Small Linux, you can create
    this special-type of live CD in a way that enables you to add lots of content.
    Using features such as MyDSL, you can add only those players you need (such as
    the gview and OpenOffice.org Impress applications). The rest of the space on your
    live CD or DSL can be dedicated to holding the digital images, presentations,
    videos, or other content you want to display.


    Because DSL is based on Kpuppix, you can use many of the remastering techniques
    described in Chapter 6 to tailor the content of your live CD. You can also customize
    the Fluxbox desktop to include images, colors, and other desktop attributes to
    match the content you are displaying.'
