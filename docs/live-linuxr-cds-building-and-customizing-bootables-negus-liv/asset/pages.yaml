    When files are deleted, UnionFS can be set to delete the files physically or mask
    the real file using what is called whiteout mode. Whiteout is used in this case.
    Whiteout files are identified by .wh files in the writable branch. For example,
    type ls -a /ramdisk/etc to see files that have been deleted or replaced in the
    /etc directory.


    If you want to further control UnionFS file systems, you can try the unionctl
    command. For example, to list the branches of an existing UnionFS file system,
    you can use the -list option as follows:


    ```

    # unionctl /UNIONFS -list

    /ramdisk (rw-)

    /KNOOPPIX (r-)

    /KNOOPPIX (r-)

