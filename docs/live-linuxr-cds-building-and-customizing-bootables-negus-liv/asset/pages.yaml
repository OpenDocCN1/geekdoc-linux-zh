  md: '# BOOTING LIVE CDs From The DVD


    A handful of live CDs have been remastered to boot directly from the DVD that
    comes with this book. To try any of those live CDs, all you need is a PC (with
    a DVD drive) that you can reboot.


    The default live CD on the DVD is Knoppix. So, to use Knoppix, you can simply
    press Enter at the boot prompt or wait for the timeout period (just a few seconds)
    and Knoppix will automatically boot. To boot any of the other live CDs available
    from the boot prompt, you need to type the label associated with that distribution.


    # Choosing Which Live CD to Boot


    The live CDs that you can boot directly from the DVD include the following live
    Linux distributions:


    +   - **Knoppix**—A desktop-style live Linux CD that is the world''s most popular
    live CD

    - **BackTrack**—The security-oriented live Linux CD based on the SLAX CD

    - **Gentoo Live CD**—An official live CD produced by the Gentoo project using
    the Catalyst Linux installer

    - **Dann Small Linux**—A desktop-oriented mini live Linux CD distribution that
    fits on a bootable business card-size CD (about 50MB)

    - **SLAX KillBill**—A SLAX-based live CD that features tools (such as wine and
    qemu) for testing and using applications created to run in Windows in a Linux
    system

    - **Live Linux Gaming Project**—A Debian-based live CD that features dozens of
    open source games


    These live CD distributions vary in size from about 50MB to nearly 700MB each.


    # Starting the DVD


    To try out the Live CDs DVD, use the following procedure:


    +   1. Insert the DVD into your DVD drive.

    2. Reboot the computer.

    3. When you see the Live CDs splash screen boot prompt, either press Enter (or
    wait for the timeout) to boot Knoppix or type one of the following boot labels
    listed in Table A-1.'
  merge: -1
  pgno: 396
