    # CHOOSING A KNOOPPIX DISTRIBUTION TO CUSTOMIZE


    Because a variety of customized Knoppix distributions are already available, to
    save yourself some work, you can begin with a Knoppix distribution that most closely
    matches the live CD you eventually want to create. These different Knoppix live
    CD or DVD distributions (among others) are available:


