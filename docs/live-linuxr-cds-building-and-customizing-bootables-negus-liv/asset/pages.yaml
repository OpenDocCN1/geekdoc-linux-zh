    # Testing and Burning the CD Image


    The procedure for testing and burning an ISO image to CD or DVD is the same for
    any live CD. You can test the live CD before burning it to disk using an emulation
    package such as qemu. You can then burn the image using a variety of tools available
    in Linux or Windows. See Appendix B—“Building, Testing, and Burning ISOs,” for
    details on testing and burning live CD images.


    The following quick examples illustrate how you can test and burn the knoppix.iso
    ISO image you just created. From a Knoppix desktop or other Linux system that
    has the qemu package installed, you can use a command such as the following to
    try out your live image on your desktop:


    ```

    # /media/hda1/knoppix/

    # qemu -cdrom knoppix.iso -k en-us -m 512

    ```


    The image should boot up in a window on your desktop. Unless you have a ton of
    RAM on your computer, probably won''t have the 512MB of RAM available (as suggested
    earlier with -m 512), and your custom Knoppix will probably run slowly on your
    desktop. However, this is a good way to make sure that the image is basically
    working before you start up your CDs.


    The following simple cdrecord command (with a blank CD or DVD medium in a writable
    drive) can be used to burn your CD image to CD or DVD:


    ```

    # cdrecord -v data knoppix.iso

    ```


