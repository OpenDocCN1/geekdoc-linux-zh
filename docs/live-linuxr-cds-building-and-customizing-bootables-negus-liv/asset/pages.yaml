    get that shoot instead.


    To run ParallelKnoppix in Qemu, use this:


    ```

    # qemu -m mem -cdrom parallelknoppix-2006-06-19.iso

    ```


    The -m option tells Qemu how much RAM to allocate for the virtual machine. You
    probably want to allocate at least 384MB of RAM, and if your machine has enough
    RAM to spare (If you''re running on a machine with less than 512MB of RAM, running
    things under Qemu might not make sense.) The -cdrom option tells Qemu to use an
    ISO image to boot.


    Note that Qemu is not as high performance as VMware Player, Server, or Workstation.
    You might want to download VMware Server or Player if you want to play with ParallelKnoppix
    for any amount of time. VMware is also described in Appendix B.


    #  MANAGING NODES AND STARTING YOUR CLUSTER


    Okay, let''s get to the fun part! Now it''s time to start a new cluster. The first
    step is to boot what will be the master node. Of course, you will need at least
    two machines (even if they''re virtual machines) and they should be on their own
    network. This is because PK uses DHCP to assign addresses to the slave nodes;
    if you''ve got a DHCP server running for the rest of your network, there can (and
    will) be confusion about assigning IP addresses.


    If you''re doing this on a home network with a cable modem or DSL modem that does
    DHCP, you can get away with unplugging the cable modem from the network while
    you''re working with PK—assuming that no one else in the household wants to get
    on the Internet. If you''re going to be using ParallelKnoppix a lot, you might
    want to consider buying a spare switch to connect the cluster nodes when they''re
    not connected to the main network.'
  merge: -1
  pgno: 386
- img_proc: true
  md: '# CHAPTER 14 Customizing a Cluster Live Linux CD


    Go to the ParallelKnoppix menu option on the KDE menu, and select Setup ParallelKnoppix.
    PK will launch the cluster configuration dialog.


    Next, tell PK how many nodes, maximum, you want to allow in the cluster. I have
    about 12 computers on my home network at any given time, but I never use all of
    them simultaneously, so I say 10 here.


    After you''ve selected the number of nodes, you have to choose the network card
    you want to. This can be handy; if you have a system with two (or) network cards,
    you can let it remain connected to your main network while keeping one interface
    on the LAN.


    PK should autodetect the interface that you want to use here, so it''s probably
    to accept the default. Next, PK asks if you want to provide any boot options.
    Again, unless there are any specific options, you can probably accept the default.


    PK will also ask what network card(s) to support the slave nodes. Just accept
    the default here, because we''re going to boot from the PK disc and it should
    support just any Linux-compatible network card without help from the master node.


    > NOTE\Technically, you can boot the slave nodes using PXE boot rather than using
    a PK disc—but, because many computers don''t support PXE, I''m going to stick
    with the tried-and-true method of using a PK disc here. If your systems support
    PXE, you can try booting using PXE and let the systems boot entirely off of the
    master system.


    Next, select media that can be read-write. Your master machine will have space
    it can write to, your slave nodes will not need a hard drive unless you would
    like them to swap space (which is probably a good idea). This will be a working
    directory for all the nodes that will be shared via NFS. After this step, PK will
    be ready to accept compute nodes to the cluster.


    # Adding Nodes to the Cluster


    Everything has been easy up until now, so you might think that configuring the
    slave nodes will be the difficult step, right? Nope. Configuring the nodes is
    a cakewalk.'
  merge: -1
  pgno: 387
- img_proc: true
  md: '# Live Linux CDs


    After your master node is ready, it''s time to boot the rest of the computers.
    Pop PK disc into the slave node(s) and boot them up. If you have everything configured
    properly—the master node is running and waiting for slave nodes, and they''re
    on a network separate from other DHCP servers—the remaining nodes should automatically
    configure them as slave nodes without any intervention on your part.


    Re-run the StartHPC script, and it will add waiting nodes to the cluster. You
    will see a dialog labeled tkping, and it will show green blocks for each node
    that''s attached to the cluster, and red blocks for open slots in the cluster.


    # Testing the Cluster


    Now it''s to make sure your cluster is actually computing as one big computer.
    The first task that PK suggests is to run a POV-Ray job to see the cluster in
    action:


    ```

    # cd /usr/share/doc/povray-3.5/examples/advanced/

    # povray +N +NT2 mediaskyp.pov

    ```


    This will fire up POV-Ray, and tell it to render the scene in mediaskay.pov. Depending
    on how many nodes you have and how fast they are, this can be done in a minute
    or so it may be done in a few seconds. With two compute nodes, it takes about
    45 seconds in my test environment.


    > NOTE

    POV-Ray, the Persistence of Vision Raytracer, is a program that creates 3D scenes
    and graphics. It''s capable of some stunning images—but they can take a very long
    time to render using a single computer. Using PK, you can render images much,
    much faster.


    Another way to monitor and manage your cluster is to use XPVM, which is a GUI
    manager for the Parallel Virtual Machine (PVM). PVM is the software that allows
    your cluster to be used as a single virtual machine. XPVM provides an easy-to-use
    interface for PVM.'
  merge: -1
  pgno: 388
- img_proc: true
  md: '# CHAPTER 14 Customizing a Cluster Live Linux CD 369


    Open a console on the master node and run xpvm. This fires up the XPVM interface,
    which shows all the attached nodes and their states.


    To run a program across the nodes, click the Tasks button and select SPAWN. You''ll
    see a dialog with a field labeled Command. Put the PVM-compatible command in the
    command field and click Start.(When you''re starting out, you can probably just
    accept the defaults.)


    Note that programs have to be compiled with PVM in order to be used with PVM/XPVM.
    For example, POV-Ray is designed to use PVM, Firefox or the Gimp aren—so they
    won''t run under PVM.


    To test XPVM, go ahead and do another POV-Ray test using the following:


    ```

    # cd /usr/share/doc/pov-3.5/examples/advanced/

    # pov -N mediaskpy

    ```


    Note that you can take nodes out of use with PVM if you want to run a job with
    just a fraction of your compute cluster. Go to the Hosts menu and unselect any
    hosts that you don''t want to use. (You can bring those nodes back by reselecting
    them.)


    That''s really all there is to. And you thought running a cluster would be hard!


    # REMASTERING PARALLELKNOPIX


    According to the PK notes, you need at least 2GB free to remaster PK to create
    a new disc. That''s a very, very optimistic estimate, and I''ve found that you''ll
    probably want to go with at least 4GB. Given today''s humongous disk drives, it
    shouldn''t be too difficult to scrape up a disk with at least that much space
    for remastering.


    > NOTE

    Here''s one helpful hint: If the system you''ll be remastering PK is on a system
    you use for day-to-day work, copy the files or packages you want to use to your
    file system before rebooting into PK. That way, you can just copy them over into
    the PK file system after rebooting instead of having to download them while running
    PK.'
  merge: -1
