    \ This is called the cache-line aliasing problem.\n\nGenerally, though, the added\
    \ lookup speed of a VIVT cache outweighs its disadvantages, making it the predominant\
    \ cache type for non-x86 CPUs.\n\nA type of hybrid cache designed to overcome\
    \ some of the shortcomings of the VIVT cache without sacrificing too much of its\
    \ speed advantage is virtually indexed, physically tagged (VIPT) caching. The\
    \ index is on the virtual address, but the tag is on the physical address, so\
    \ the combination (tag, offset) must specify the full physical address. This requirement\
    \ causes the tags to be larger than the tags for other cache types.\n\nThe VIPT\
    \ cache gains its speed advantage over PIPT because the address translation and\
    \ the cache lookup now can be done in parallel. The CPU doesn't know if the cache\
    \ line is valid (the tags match), however, until the address translation has completed.\n\
    \nThe disadvantages of VIVT are overcome because the tag is physical, thus the\
    \ VIPT cache automatically detects aliasing when it sees that two tags are identical\
    \ in the cache. Thus, a VIPT cache may be constructed in such a fashion that cache-line\
    \ aliasing never occurs.\n\nThis fourth theoretical type of cache, physically\
    \ indexed, virtually tagged (PIVT), is basically useless and is not discussed\
    \ further.\n\n# The Aliasing Problem\n\nAny time the kernel sets up more than\
    \ one virtual mapping for the same physical page, cache-line aliasing may occur.\
    \ The kernel is careful to avoid aliasing, so it usually occurs only in one particular\
    \ instance: when the user mmap s a file. Here, the kernel has one virtual address\
    \ for pages of the file in the page cache, and the user may have one or more different\
    \ virtual addresses. This is possible because nothing prevents the user from mmaping\
    \ the file at multiple locations.\n\nWhen a file is mmaped, the kernel adds the\
    \ mapping to one of the inode's lists: i_mmap, for maps that cannot change the\
    \ underlying data, or i_mmap_shared, for maps that can change the file's data.\
    \ The API for bringing the cache aliases of a page into sync is:\n\n```\n```c\n\
    void flush_dcache_page(struct page *page);\n```\n```\n\nThis API must be called\
    \ every time data on the page is altered by the kernel, and it should be called\
    \ before reading data from the page if page->mapping->i_mmap_shared is not empty.\
    \ In architecture-specific code, flush_dcache_page loops over the i_mmap_shared\
    \ list and flushes the cache data. It then loops over the i_mmap list and invalidates\
    \ it, thus bringing all the aliases into sync.\n\n# Separate Instruction and Data\
    \ Caches\n\nIn their quest for efficiency, processors often have separate caches\
    \ for the instructions they execute and the data on which they operate. Often,\
    \ these caches are separate mechanisms, and a data write may not be seen by the\
    \ instruction cache. This causes problems if you are trying to execute instructions\
    \ you just wrote into memory, for example, during module loading or when using\
    \ a trampoline. You must use the following API:\n\n```\n```c\nvoid\nflush_icache_range(unsigned\
    \ long start,\n                   unsigned long end);\n```\n```\n\nto ensure that\
    \ the instructions are seen by the instruction cache prior to execution. start\
    \ and end are the starting and ending addresses, respectively, of the block of\
    \ memory you modified to contain your instructions.\n\n# General Cache Flushing\n\
    \nTwo APIs globally flush the CPU caches:\n\n```\n```c\nvoid flush_cache_all(void);\n\
    ```\n```\n\nand\n\n```\n```c\nvoid flush_cache_mm(struct mm_struct *mm);\n```\n\
    ```\n\nThese flush all the caches in the system and only the lines in the cache\
    \ belonging to the particular process address space mm. Both of these are extremely\
    \ expensive operations and should be used only when absolutely necessary.\n\n\
    # Caching in SMP Environments\n\nWhen more than one CPU is in the system, a level\
    \ of caching usually exists that is unique to each CPU. Depending on the architecture,\
    \ it may be the responsibility of the kernel to ensure that changes in the cache\
    \ of one CPU become visible to the other CPUs. Fortunately, most CPUs handle this\
    \ type of coherency problem in hardware. Even if they don't, as long as you follow\
    \ the APIs listed in this article, you can maintain coherency across all the CPUs.\n\
    \n# Conclusion\n\nI hope I've given you a brief overview of how caches work and\
    \ how the kernel manages them. The contents of this article should be sufficient\
    \ for you to understand caching in most kernel programming situations you're likely\
    \ to encounter. Be aware, however, that if you get deeply into the guts of kernel\
    \ cache management (particularly in the architecture-specific code), you likely\
    \ will come across concepts and APIs not discussed here.\n\nJames Bottomley is\
    \ the software architect for SteelEye. He maintains the SCSI subsystem, the Linux\
    \ Voyager port and the 53c700 driver. He also has made contributions to PA-RISC\
    \ Linux development in the area of DMA/device model abstraction.\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_63_0.png)\n\
    \n# TECH TIP\n\nIf you've just converted all the GIF images on your Web site to\
    \ PNG, but the HTML still refers to the original .gif filenames, just use Apache's\
    \ mod_rewrite to redirect visitors to the new versions of the images:\n\n```\n\
    ```\nRewriteEngine on\nRewriteRule (.*)\\.gif $1.png [R]\n```\n```"
