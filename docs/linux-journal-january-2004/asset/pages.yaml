  md: '# OpenOffice.org 1.1


    OpenOffice.org has released version 1.1 of its office suite for Linux, Windows
    and Solaris in a variety of languages, including English, German, Swedish, Spanish
    and Japanese. New features for version 1.1 include native, one-click PDF export,
    Flash export, a faster load time, improved MS Office file compatibility and accessibility
    support. In addition, support for AportisDoc, Pocket Word and Pocket Excel has
    been added for easier transfer of documents to PDAs and handheld devices. OpenOffice.org
    1.1 also offers an open, future-proof XML file format, which allows users to avoid
    file format lock-in situations. The suite and its source code can be downloaded
    from www.openoffice.org/dev_docs/source/download.html.


    CONTACT OpenOffice.org, www.openoffice.org.


    # Panasas ActiveScale Storage Cluster


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_66_0.png)


    Employing an object-based architecture that manages data as large virtual objects,
    the ActiveScale Storage Cluster is comprised of the ActiveScale File System, StorageBlades
    and DirectorBlades, a 4U system shelf and an integrated gigabit Ethernet switch.
    The ActiveScale File System turns files into smart data objects and then dynamically
    distributes data activity across the StorageBlades. This design enables parallel
    data paths between servers and StorageBlades, eliminating performance and capacity
    bottlenecks. Application and user data is stored in the StorageBlades, and filesystem
    activity is coordinated by the DirectorBlades. DirectorBlades also virtualize
    data objects across the range of StorageBlades so the system can be viewed as
    a single namespace.


    CONTACT Panasas, 6520 Kaiser Drive, Fremont, California 94555, 510-608-7790, www.panasas.com.


    # Aqua Data Studio 3.5


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_66_1.png)


    Aqua Data Studio 3.5 is a database query and administration tool that allows developers
    to create, edit and execute SQL scripts, as well as browse and modify database
    structures. Aqua Data Studio provides an integrated database environment with
    a single consistent interface to all major relational databases. This allows the
    database administrator or developer to tackle multiple tasks simultaneously from
    one application. Aqua Data Studio includes support for such database platforms
    as Oracle 8i/9i, IBM DB2, Informix Dynamic Server, Sybase Adaptive Server, Microsoft
    SQL Server, MySQL and PostgreSQL. New features for version 3.5 include complete
    schema extractions, SQL scripting of database objects and expanded Query Analyzer
    options.


    CONTACT AquaFold, Inc., www.aquafold.com.


    # Stratus/PMC


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_66_2.png)


    The Stratus/PMC is a dual-head graphics controller PMC card designed for use in
    VME and CompactPCI embedded systems. It features a 128-bit graphics module for
    video capture with analog/digital I/O. Stratus/PMC’s two display channels simultaneously
    deliver dual VGA or LVDS outputs or a single DVI output. Using the Silicon Motion
    SM731 graphics accelerator, Stratus/PMC supports single displays at screen resolutions
    up to 1600x1200x24bpp (with 16.7 million colors) and dual displays at 1024x768x24bpp.
    It also has an onboard 33/66MHz, 32-bit PCI interface; 16MB of SDRAM on-chip;
