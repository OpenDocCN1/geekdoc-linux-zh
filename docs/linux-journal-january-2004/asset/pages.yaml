- pgno: 18
  md: '# Management Issues


    When a print newspaper or magazine publishes a story, there is no way to change
    what has been displayed. But on the Web, all you need to do is modify the story
    in question, and everyone immediately sees the changes. Ignoring the issues of
    journalistic ethics raised by this technological ability, Bricolage makes it easy
    to correct a story and then redeploy it on the site.


    To modify an already-published story, go to the Active Stories menu item, which
    brings up a list of stories currently available. You can choose to check out a
    story and make it available for editing by the current user. (Bricolage’s version-control
    system ensures that only one person can edit a file at a time.) You then can edit
    the file and send it to the Edit Desk, just as you did when you originally wrote
    the story. And as before, the Edit Desk must pass it along to the Publish Desk;
    from there it can be published to the Web.


    If you have worked on only small Web sites before, then this task might appear
    to be far too complicated. After all, isn’t part of the Web’s beauty the fact
    that we can change documents and immediately see the results of those changes?
    It’s true that a content management system introduces a set of trade-offs into
    the workings of a Web site. No longer can you simply modify a file on the disk;
    you must log in, check the file out, make the modifications, check it back in
    and send it to the Publish Desk, which might even reject your changes.


    But complicated and bureaucratic as this procedure might be, it is better than
    the alternative, which is multiple people fighting over ownership of a file or
    different people trying to edit a file—sometimes in different ways—on a live site.
    A CMS is designed to slow you down, much as a seat belt is designed to prevent
    you from moving too much. But in both cases, the restrictions are designed to
    help you by stopping you from hurting yourself. Moreover, this bureaucracy can
    save you in a pinch, because every previous version of the document always is
    available. So if you accidentally removed half of an important story, you can
    revert to the previous version that Bricolage has stored in its database.


    version that Bricolage has stored in its database.


    # Conclusion


    Bricolage is a complete, sophisticated open-source content management system with
    an impressive array of features. As we saw this month, we easily can set up a
    Bricolage-based site and publish stories through a distribution channel that we
    created with a simple set of virtual host definitions in our Apache configuration.
    Next column, we conclude our discussion of


    Bricolage by looking at ways in which we can customize the output templates, turning
    a simple black-and-white publication into something with more pizzazz.


    Reuven M. Lerner, a long-time Web/database consultant and developer, now is a
    first-year graduate student in Learning Sciences at Northwestern University in
    Chicago, Illinois. You can reach him at reuven@lerner.co.il.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_18_0.png)


    # GET WITH THE PROGRAM


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_18_1.png)


    # Need to move your file server to Linux in a hurry?


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_18_2.png)


    “Linux Transfer for Windows Network Admins” will show you how to convert your
    existing Windows PDC and file/print server to Linux, using your knowledge and
    skills as a Windows admin to get the job done quickly and easily.


    Download free sample chapters and order online at www.hentzenwerke.com


    Also available at selected bookstores nationwide'
