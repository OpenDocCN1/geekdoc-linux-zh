  md: '# IBM eServer BladeCenter


    REVIEWED BY DANA CANFIELD


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_67_0.png)


    # PRODUCT INFORMATION


    Manufacturer:

    IBM


    URL:

    www.ibm.com/servers/eserver/bladecenter


    Price:

    BladeCenter Chassis from $2,789 US; HS20 Blade from $1,879 US; Ethernet Switch
    Module $2,199 US


    # THE GOOD


    +   - 14 servers/28 CPUs in 7U rack space.

    - Fully redundant design throughout the system.

    - Full Linux support on par with Windows support.

    - Price point matches standalone servers after seven blades.


    # THE BAD


    +   - Only one console for 14 systems.

    - Support limited to certain versions of Red Hat and SuSE.

    - Limited expandability.


    IBM recently has begun rallying around two major server systems for Linux deployment
    on the x86 architecture. On the scale-up front, IBM offers the eServer x440 line,
    which boasts scalability up to 16 CPUs in a single system. More interesting to
    the average user with a cluster of smaller servers is IBM’s scale-out offering,
    the IBM eServer BladeCenter system, a 7U rackmount chassis supporting 14 blades.


    The chassis itself consists of only a passive midplane, a CD-ROM and floppy drive
    and two 10" blowers. Two redundant 230V power supply modules ship with the unit,
    and two more are required if the system is running more than five blades. A single
    management module with keyboard, video and mouse (KVM) and Ethernet connections
    is included, and support for a redundant management module recently was added.


    Redundancy is a key design goal of the BladeCenter and little has been overlooked.
    Four switch-module bays are in the rear of the chassis; the second and fourth
    bays are redundant bays for the first and third bays, respectively. For example,
    if you install an Ethernet switch in the first bay, you can install a second Ethernet
    switch module in the third bay but not a SAN switch module. Although allowing
    full redundancy, this means that only two types of switch modules ever can be
    installed at a time.


    Currently, IBM offers gigabit Ethernet and Fibre Channel SAN switch modules. Internally,
    these switch modules connect to each individual blade, and externally the gigabit
    switch offers four copper Ethernet ports while the SAN switch offers four Fibre
    Channel ports. With redundant modules installed, each blade has access to two
    Ethernet ports and two SAN ports. The Ethernet switch is a full-function layer-3
    switch with a powerful Web-based interface. The SAN switch is a Q-logic SAN switch,
    which is configured through either a telnet session or the Java-based management
    software available for both Linux and Microsoft Windows.


    The front of the BladeCenter chassis contains a single CD-ROM, floppy and USB
    port that is connected by an internal USB hub/switch to each blade. This switch
    is controlled by a button on each blade, and only one blade can access the CD/floppy/USB
    port at a time. The keyboard, video and mouse are connected through a separate
    internal switch that is controlled by a second button on each blade. Control of
    the KVM and USB peripherals also can be manipulated by using the BladeCenter’s
    Web-based management interface, which allows the KVM output to be controlled remotely
    over the Web. Unfortunately, although redundant KVM/management modules may be
    installed, only one blade can be assigned to the console at a time, even through
    the Web interface. This probably is the most disappointing limitation of the BladeCenter,
    but it may be less of an issue for those using the blades in a true cluster environment.


    At the time of this writing, only the HS20 server blade has been released for
    the BladeCenter. One might assume these blades simply would be a modified ThinkPad
    on a card, but in reality the blade is a miniaturized, enterprise-class server.
    Although it ships with a single CPU and 512MB of RAM, the HS20 has a 533MHz front
    side bus and can support two Pentium 4 Xeon CPUs (up to 2.8GHz) and four PC2100
    DDR DIMMs (up to a total of 8GB). Thanks to the hyperthreading feature of the
    Xeon CPUs, modern Linux kernels can see two logical CPUs for each actual CPU installed.


    Each blade also has one 8MB Rage Video and two Broadcom gigabit Ethernet controllers.
    Each Ethernet controller is hard-wired to a switch-module bay, and the driver
    can be configured to allow these interfaces to be used individually or in a failover
    fashion. Two notebook-sized IDE hard drives can be mounted in the blade, but the
    optional'
