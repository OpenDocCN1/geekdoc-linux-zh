    +   1. It was run on hardware that does not meet the SPEC availability-to-the-public
    criteria. The machine was an engineering sample.

    2. access_log was not kept for full accounting. It was being written but deleted
    every 200 seconds.


    For the latest SPECweb99 benchmark results, visit www.spec.org.


    Paul E. McKenney is a distinguished engineer at IBM and has worked on SMP and
    NUMA algorithms for longer than he cares to admit. Prior to that, he worked on
    packet-radio and Internet protocols (but long before the Internet became popular).
    His hobbies include running and the usual house-wife-and-kids habit.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_47_2.png)


    Dipankar Sarma currently is working on a number of Linux kernel projects, including
    CPU hot-plug, RCU and VFS enhancements. Prior to his Linux days, he worked on
    a number of areas including ABI, OS bringup, I/O drivers and multipath I/O.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_47_3.png)


    Maneesh Soni has been working with IBM’s Linux Technology Center as a member of
    Linux Scalability Effort Project. He has experience in the system software arena,
    particularly with operating-system kernels and filesystems.


