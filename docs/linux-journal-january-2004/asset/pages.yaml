  md: '![](img/3e9d313887e2c1cabeb5043769cbf08f_41_0.png)


    Figure 4. dentry Hash Table


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_41_1.png)


    Figure 5. Hard-Link Alias Chains


    distributed filesystems like NFS.


    Each dentry references its inode using the d_inode pointer. This d_inode pointer
    can be NULL for negative dentries, which lack an inode. Negative dentries can
    be generated when a filesystem removes a dentry’s file or when someone tries to
    lock a non-existent file. Negative dentries can improve system performance by
    failing repeated accesses to a given non-existent file without having to invoke
    the underlying filesystem. Similarly, hard links result in multiple dentries sharing
    an inode, as shown in Figure 5.


    Figure 6 shows a high-level dentry state diagram. The normal dentry’s life goes
    as follows:


    +   1. d_alloc() allocates a new dentry for a newly referenced file, leading to
    state New.

    2. d_add() associates the new dentry with its name and inode, leading to state
    Hashed.

    3. When done with the file, d_put() adds the dentry to the LRU list and sets its
    DCACHE_REFERENCED bit in its d_vfs_flags field, leading to state LRU Ref (Hashed).

    4. If the file is referenced again while in the LRU Ref (Hashed) state, dget_locked(),
    usually called from d_lookup(), marks it in use. If it still is in use at the
    next prune_dcache() invocation, it is removed from the LRU list, leading again
    to state Hashed.

    5. Otherwise, prune_dcache() eventually removes the DCACHE_REFERENCED bit from
    the d_vfs_flags field, leading to state LRU (Hashed).

    6. As before, if the file is referenced again, dget_locked()


    ence the mounted filesystem directly. Instead, the mountpoint’s d_mounted flag
    is set, and dcache looks up the mounted filesystem in mount_hashtable, a process
    that is described later.


    Although one could search the d_subdirs lists directly, this would be a slow process
    for large directories. Instead, __d_lookup() hashes the parent directory’s dentry
    pointer and the child’s name, searching the global dentry_hashtable for the corresponding
    dentry. This hash table is shown in Figure 4, along with the LRU list headed by
    dentry_unused. Any dentry in the LRU list usually is in the hash table as well.
    Exceptions include cases where parent directories time out, such as in distributed
    filesystems like NFS.


    marks it in use so that prune_dcache() can remove it from the LRU list, leading
    again to state Hashed.


    7. Otherwise, the second consecutive call to prune_dcache() invokes d_free() via
    prune_one_dentry(), resulting in state Dead.


    Other paths through Figure 6 are possible. For example, if a distributed filesystem
    converts a cached file handle into a new dentry, it invokes d_alloc_anon() to
    allocate the dentry when the corresponding object’s parent is no longer represented
    in the dentry cache. Similarly, using d_delete() to delete the file or directory
    underlying a given dentry would move that dentry to the Negative state. On last
    close, it would be advanced to “Dead”.


