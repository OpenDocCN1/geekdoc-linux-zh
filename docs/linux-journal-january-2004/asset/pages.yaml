    | VisibilityNotify | The new page is loaded and visible to the user. |


    RPM packages are available at the home page, and Xnee also is available in the
    FreeBSD ports tree. Xnee comes with a user manual and a developer manual in various
    formats. The TeX sources to the manuals are distributed with Xnee and covered
    under GNU FDL. Instead of building the documents yourself, you can download the
    format of your choice (PDF, HTML, INFO and TXT) from the Xnee home page. As of
    this writing, the Xnee documentation version is 1.0.4. Extract the documents:


    ```

    tar zxvf xnee-doc-1.0.4.tar.gz

    ```


    When running Xnee, make sure the RECORD extension is enabled. On XFree86 make
    sure the RECORD module is loaded. Open the XFree86 configuration file, typically
    /etc/X11/XF86Config-4, and look in the Module section. The following line should
    be included:


    ```

    Load  "record"

    ```


    See the Xnee FAQ for more information about this.


    # Simple Usage Examples


    We don’t go into any details about Xnee in this section, but rather begin slowly
    with a simple example. Start Xnee with the --all-events option. This sets up the
    recording of a few events. The option is not useful when doing serious Xneeing.
    It is intended to simplify your introduction to using Xnee:


    ```

    xnee --all-events

    ```


    When moving the mouse or pressing the buttons or keys, Xnee prints information
    about the action. We move on to record a simple session that we replay immediately.
    To record 20 mouse motions, start Xnee like this:


    ```

    xnee --record --out session1.xnr \

    --device-event-range MotionNotify --loops 20

    ```


    The options on the command line mean use recording mode (--record), save output
    in a file called session1.xnr (--out session1.xnr), record the device event MotionNotify
    (--device-event-range MotionNotify) and record 20 events (--loops 20).


    To replay this event, start Xnee like this:


    ```

    xnee --replay --file session1.xnr

    ```


    The options on the command line mean use replay mode (--replay), and read data
    to replay from file session1.xnr (--file session1.xnr).


    # Setting Up Recording Ranges


    Xnee uses ranges to explain what is to be recorded. Ranges have a start value
    and a stop value. The following data can be recorded: core-requests, device-event,
    delivered-event, error, reply, extension requests and extension replies. We don’t
    describe the above data in this article. If you want to read more, see the RECORD
    extension documents. When, for example, you want to record the device-event


    Table 2. How Xnee Replays a Test Session


    | Protocol Data Name | Xnee Action |

    |---|---|

    | MotionNotify | Xnee moves the pointer to the Galeon launch icon. |

    | ButtonPress | Xnee presses the button and Galeon starts. |

    | CreateNotify | Xnee waits for this event to be sent. When Xnee receives a CreateNotify
    notice, it continues with the next event in the file. |

    | VisibilityNotify | Xnee waits for this event to be sent. Because the network
    is down and the page can’t be loaded, this event isn’t sent. Xnee continues to
    wait. Eventually the event is sent and Xnee can continue. |

    | MotionNotify | Xnee moves the pointer to a link on the loaded page. |

    | ButtonPress | Xnee clicks on this link. |

    | VisibilityNotify | The new page is loaded and visible. |'
