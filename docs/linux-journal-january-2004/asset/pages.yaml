  md: 'MotionNotify, use:


    ```

    --device-event-range MotionNotify

    ```


    To record the events from KeyPress up to MotionNotify and CreateNotify, use:


    ```

    --device-event-range KeyPress-MotionNotify,\

    CreateNotify

    ```


    You can use the number corresponding to the event name instead of the name itself
    if you want shorter command lines. To find the number for the data you want to
    record, use Xnee''s --print-data-name option:


    ```

    xnee --print-data-name

    ```


    # Stopping Xnee


    You can stop recording by setting the number of the data to record (--loops option),
    or you can interrupt Xnee by sending a TERM signal (pressing Ctrl-C in the terminal
    window where you started Xnee). Alternatively, you can dedicate a modifier and
    key combination that won''t be used to do anything else during recording. Setting
    the modifier and key is done with the --stop-key option. To set up Xnee so it
    stops recording when Ctrl-Alt-A are pressed, add the following to the command-line
    option:


    ```

    --stop-key Control+Alt,a

    ```


    # Synchronize


    But why even bother to record data other than device events when you can''t replay
    it? Xnee uses that other data to synchronize, which is where things get complicated.
    Think of recording a session when using Galeon or any other Web browser. When
    recording, everything goes well and the network is up and running. But when replaying
    the Galeon session, you can''t reach the Internet. If not for synchronization,
    Xnee might replay user events such as clicking on a link on the Web page. If Galeon
    could not load the page, it is not useful to continue the replay until the network
    is up and the page can be loaded.


    When recording other data, we can use it to synchronize the session. For example,
    if we record the data sent when displaying the Web page in the Galeon window,
    we can wait for the same data to be sent when replaying. This ensures that the
    Web page is loaded before we go on and replay the coming events. In this example,
    we skip a lot of the X protocol data sent when recording in order to keep it simple
    (see Table 1). When replaying this simple session, Xnee uses the same events (see
    Table 2).


    # What to Synchronize


    Although synchronization is needed, finding the right data to use for synchronization
    may be difficult. Xnee solves this with plugin files that specify what should
    be recorded for a range of


