  md: '# Scaling dcache with RCU


    Reorganizing the way Linux caches filename lookups is a big win for helping to
    scale to large servers. BY PAUL E. MCKENNEY, DIPANKAR SARMA AND MANEESH SONI


    RCU (read-copy update), a synchronization technique optimized for read-mostly
    data structures, recently was added to the Linux 2.6 kernel. This article describes
    how RCU improved the scalability of Linux’s directory-entry cache (dcache). For
    some more background, see “Using RCU in the Linux 2.5 Kernel”, in the October
    2003 issue of Linux Journal.


    # Linux Directory-Entry Cache


    Linux’s dcache maintains a partial in-memory image of the filesystem hierarchy.
    This image enables pathname lookup without expensive disk transfers, greatly increasing
    the performance of filesystem operations. To ease handling of mount and unmount
    operations, the Linux kernel also maintains an image of the mount tree in struct
    vfsmount structures.


    If the Linux 2.4 dcache is so great, why change it? The difficulty with the 2.4
    dcache is it uses the global dcache_lock. This lock is a source of cache-line
    bouncing on small systems and a scalability bottleneck on large systems, as illustrated
    in Figure 1.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_39_0.png)


    Figure 1. Tux Doing His Duty


    # Visual Overview of dcache


    This section provides background for the RCU-related dcache changes, which are
    described later in the article. Readers desiring more detail should dive into
    the source code.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_39_1.png)


    Figure 2. Example Filesystem Tree


    This section uses the example filesystem tree shown in Figure 2, which has two
    mounted filesystems with roots r1 and r2, respectively. The second filesystem
    is mounted on directory b, as indicated by the dashed arrow. The file g has not
    been referenced recently and therefore is not present in dcache, as indicated
    by its dashed blue box.


    The dcache subsystem maintains several views of the filesystem trees. Figure 3
    shows the directory structure representation. Each dentry representing a directory
    maintains a doubly linked circular list headed by the d_subdirs field that runs
    through the child dentries’ d_child fields. Each child’s d_parent pointer references
    its parent. The mountpoint (dentry b) does not refer-


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_39_2.png)


    Figure 3. dcache Representation of the Example Filesystem Tree'
