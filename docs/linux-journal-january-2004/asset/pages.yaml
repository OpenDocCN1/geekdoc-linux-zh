- pgno: 60
  md: "![](img/3e9d313887e2c1cabeb5043769cbf08f_60_0.png)\n\nFigure 1. Stale Data\
    \ Problem\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_60_1.png)\n\nFigure 2. Data\
    \ Destruction by Dirty Cache Lines\n\n# Cache-Line Interference\n\nThe situation\
    \ where two sets of independent data lie in the same cache line, potentially leading\
    \ to the data destruction detailed above, is termed cache-line interference. If\
    \ you are laying out data structures in memory, the general rule to avoid this\
    \ situation is never, ever have data that can be modified outside of the caches\
    \ mixed with data the CPU may ordinarily use. If you absolutely have to violate\
    \ this rule, make sure all externally modifiable elements of the structure are\
    \ aligned L1_CACHE_BYTES, a value set at compile time to the largest possible\
    \ cache width value for all the processors on which your\n\ncode may run. The\
    \ best thing to do is use kmalloc to allocate two separate regions. kmalloc never\
    \ allocates two regions that overlap in a cache line.\n\n# Cache Management Instructions\n\
    \nThe most basic instruction, called an invalidate, simply ejects the nominated\
    \ line from all caches. Any reference to data in that line causes it to be re-fetched\
    \ from main memory. Thus, the stale data problem may be resolved by invalidating\
    \ the cache line before reading the data. In Linux, such an invalidation is done\
    \ with:\n\n```\nvoid\ndma_cache_inv(unsigned long address\n    unsigned long size);\n\
    ```\n\nwhere address is the virtual address on which to begin, and size is the\
    \ length of data to invalidate. Note that size is rounded up automatically to\
    \ a multiple of the cache line width.\n\nFor write back caches, any dirty cache\
    \ line may be written out, or flushed, to main memory using:\n\n```\nvoid\ndma_cache_wback(unsigned\
    \ long address,\n    unsigned long size);\n```\n\nThis flushing must be done before\
    \ anything changes the\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_60_2.png)"
