  md: '![](img/3e9d313887e2c1cabeb5043769cbf08f_84_0.png)


    Figure 1. Schematic of the Bell System


    I obtained one of our company’s spare Dell PCs to use for this project, a basic
    PC with a Pentium III 750MHz processor, 128MB of SDRAM, 40GB IDE hard drive and
    an IDE CD-ROM. I used what was readily available, and really, the computer is
    a lot more powerful than necessary.


    The AR-2 relay device attaches to the computer’s serial port and is controlled
    by the DTR (data terminal ready) and RTS (ready to send) control lines. Setting
    RTS to high energizes the first relay and setting DTR to high energizes the second
    relay. Closing the bell circuit requires only one relay, so I needed to be able
    to toggle only the RTS signal. Example programs in GWBASIC and Turbo C were provided
    with the documentation. I wanted to write a program using GCC to control the relay
    but had little experience in C programming, so I searched the Web for some well-documented
    examples of C programs that made use of a serial port.


    The first interesting program I found was upschek.c from Harvey J. Stein’s UPS
    HOWTO. upschek, itself a modified version of Miquel van Smoorenburg’s powerd.c,
    makes use of both the RTS signal and the DTR signal. The program originally was
    used to diagnose or examine UPS communications with a PC over a serial port. When
    starting the program, you indicate with parameters to which serial device the
    UPS is attached and whether to set RTS and/or DTR high. After the program opens
    the port and sets or clears the indicated serial control lines, the program would
    monitor another control line for feedback from the UPS. The program did everything
    I needed and more. All I had to do was remove the monitoring part, and I had my
    C


