  md: "would look like this:\n\n```\nbash-$ cyradm -u mick_admin localhost\nIMAP Password:\
    \ **********\n    localhost>\n```\n\nNotice the localhost> prompt after a successful\
    \ login: I'm now logged in to a cyradm shell session. To see a complete list of\
    \ available commands, all I need to do is type ? or help. There are 20 commands\
    \ in all, and each can be abbreviated, sometimes in two different ways. The help\
    \ screen lists all versions of each command.\n\n# Creating Mailboxes with cyradm\n\
    \nTo create a mailbox, I can use the command createmailbox. Alternatively, I can\
    \ use the abbreviation create or even a simple cm, like this:\n\n```\nlocalhost>\
    \ cm user.bwooster\nlocalhost>\n```\n\nThis is the very model of command-line\
    \ efficiency, but notice that the user name corresponding to our new mailbox isn't\
    \ really user.bwooster—it's simply bwooster. The user. prefix must be used for\
    \ all mailboxes you create in Cyrus IMAP. Thus, to create a mailbox for the user\
    \ bubba, I'd use the command cm user.bubba. To then create subdirectories for\
    \ that mailbox, I'd use cm user.bubba.sent, cm user.bubba.drafts and so forth.\n\
    \nThis user. prefix is visible only to Cyrus and to its administrators. In fact,\
    \ when our user Bubba connects to the server with Evolution or some other IMAP\
    \ client, rather than user.bubba he simply sees a folder named Inbox, even though\
    \ its real name is user.bubba. Similarly, submailboxes appear as sent, drafts\
    \ and so on, indented beneath Inbox.\n\nAnother thing worth noting about the e-mail\
    \ account creation command is the lack of any feedback whatsoever from Cyrus upon\
    \ successful completion. If you're like me, you find this unnerving; you periodically\
    \ want to use the listmailbox command, lm for short, to see what you have:\n\n\
    ```\nlocalhost> lm\n    user.bwooster (\\HasNoChildren)\n```\n\nBelieve it or\
    \ not, this is all we need to do with Cyrus IMAP to allow user bwooster to receive\
    \ and read his e-mail, assuming there's an LDAP record with a UID of bwooster.\
    \ In Cyrus IMAP, creating a new user mailbox has the effect of creating that user's\
    \ IMAP account. But before I move on to the topic of configuring the Postfix MTA\
    \ to deliver e-mail to Cyrus IMAP, a few words about Cyrus IMAP ACLs.\n\n# Cyrus\
    \ IMAP ACLs\n\nEach mailbox in a Cyrus IMAP system can have one or more ACLs associated\
    \ with it in which each ACL defines which actions a given user may perform on\
    \ the referenced mailbox or folder. By default, a new mailbox has only one ACL,\
    \ one that grants the mailbox's owner full administrative rights over the mailbox.\n\
    \nInterestingly, administrators by default have only lookup and administer rights\
    \ on the new mailbox. You can look up the name\n\nof the mailbox using the listmailbox\
    \ command, and you can set ACLs on it. But if you need to delete the mailbox,\
    \ you first must create an ACL for the mailbox that grants your administrative\
    \ account administrative rights. This is a feature, not a bug; it helps prevent\
    \ things from getting deleted accidentally.\n\nContinuing with our example, below\
    \ are the commands for removing the mailbox we just created, using our administrative\
    \ account mick_admin:\n\n```\n$ cyradm -u mick_admin localhost\nIMAP Password:\
    \ *****\nlocalhost> setaclmailbox user.bwooster mick_admin all\nlocalhost> deletemailbox\
    \ user.bwooster\n```\n\nThe second command issued here is of particular note;\
    \ it begins with the cyradm command setaclmailbox, which may be abbreviated as\
    \ sam or setacl. This is followed by the mailbox in question (user.bwooster),\
    \ in turn followed by the account name to which we wish to grant (or deny) access,\
    \ mick_admin in this case. Finally, either a group of permission codes or a special\
    \ string is indicated. In this example, we have\n\nTable 1. cyradm ACL Permission\
    \ Codes (adapted from the cyradm(1) man page)\n\n| Permission | Description |\n\
    |---|---|\n| l | Lookup (visible to LIST/LSUB/UNSEEN) |\n| r | Read (SELECT, CHECK,\
    \ FETCH, PARTIAL, SEARCH, COPY source) |\n| s | Seen (STORE \\SEEN) |\n| w | Write\
    \ flags other than \\SEEN and \\DELETED |\n| i | Insert (APPEND, COPY destination)\
    \ |\n| p | Post (send mail to mailbox) |\n| c | Create and delete mailbox (CREATE\
    \ new submailboxes, RENAME or DELETE mailbox) |\n| d | Delete (STORE \\DELETED,\
    \ EXPUNGE) |\n| a | Administer (SETACL) |\n| none | Special string meaning no\
    \ permissions |\n| read | Special string meaning lrs |\n| post | Special string\
    \ meaning lrsp |\n| append | Special string meaning lrsip |\n| write | Special\
    \ string meaning lrswipcd |\n| all | Special string meaning lrswipcda |"
  merge: -1
  img_proc: true
