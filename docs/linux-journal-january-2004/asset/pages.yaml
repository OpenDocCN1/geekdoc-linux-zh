- pgno: 80
  md: 'The next processor to deal with the network messages is the common processor
    (CP). The CP does many things, such as matching flight plans to tracks, sending
    conflict alerts (CAs), minimum safe altitude warning (MSAW) and monitoring some
    of the Common ARTS system heartbeats. The biggest thing the CP does is determine
    airspeed and direction of a track.


    # When aircraft are traveling at 300KTS—about five miles a minute—it is important
    to be looking a minute or two ahead.


    powerful enough, all the systems and subsystems can be run on a single CPU.


    CA uses the speed and direction to look at other tracks to determine the possibility
    of a conflict. If a conflict is detected, the CP broadcasts a CA message indicating
    the aircraft in conflict. When aircraft are traveling at 300KTS—about five miles
    a minute—it is important to be looking a minute or two ahead.


    normal operation, the display includes a track indication, a direction history
    indication, a full or partial databock and the state of the various systems.


    # Porting


    MSAW uses a site-adapted map to learn terrain in the area. The terrain can be
    hills and mountains as well as towers and buildings. For transponder-equipped
    aircraft, the MSAW system looks at the altitude and the position and determines
    if the aircraft may be too low. If an aircraft is determined to be too low, an
    MSAW message is broadcast.


    The flight plan information message from the CP is displayed in the full databock
    near the aircraft for which the TP created the track. The broadcast SMC overall
    state can be displayed as well. The network can use one or several hundred displays.


    Initially, the reason for the port to Linux was to allow developers to test and
    debug the systems at their desks before testing on the target hardware. The target
    hardware is Motorola OEM boards in a VME chassis running LynxOS. The systems are
    relatively expensive, so neither the FAA nor Lockheed-Martin wants to have a bunch
    sitting around. Instead, several test systems are used almost full-time for integration
    testing and development.


    The last major system in the back room is the system monitor and control (SMC).
    The main purpose of the SMC is to monitor and control the other systems. It is
    a gateway to the SMC display PC, a GUI for monitoring the network and its current
    state. Current state indicates the systems that are on-line, off-line, standby
    or idle. If a heartbeat is missed, the SMC instructs a standby system to take
    over. A system operator can instruct a manual switch at anytime, load new software
    or reboot systems from this PC. The SMC also is used for recording all the data
    that crosses the network.


    In addition, each system can be run on one or more CPUs. If the CPU is


    Because the IS department gives developers a Microsoft Windows NT PC, an attempt
    was made to port the software to NT. Most of the port was completed when I started
    working for the company. For testing some things, NT worked fine. An adapter layer
    was used to make the POSIX threads, file I/O and graphics behave like the target
    system, so it wasn’t good at testing those features.


    What most of us think of when we think of air traffic control are the displays:
    a room full of round vector displays and guys in white shirts watching them. More
    and more sites are using large 20"-square color displays. The new color displays
    are 2048x2048 pixel, X window displays. The design of the display processing software
    (DPS) is such that parts of it can be used by any display type, the color square
    display, like an ARTS Color Display (ACD) or the round vector display, like a
    Full Digital ARTS Display (FDAD).


