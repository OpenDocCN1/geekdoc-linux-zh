    # TALOSS Participants


    In the November 2003 issue, acknowledgements were inadvertently omitted from the
    TALOSS (Three-Dimensional Advanced Localization Observation Submarine Software)
    article. Mr Ken Lima of NUWC was the originator of the TALOSS concept and the
    project''s manager, without whose leadership this project would not be possible.
    The authors also would like to thank the Office of Naval Research (ONR) Code 311
    (Mr Paul Quinn, Mr Gary Toth and Dr Larry Rosenblum) for the funds to complete
    the project.


    ONR (Dr Rosenblum) funded Dr Gregory Neilsen and Mr Gary Graf of Arizona State
    University to develop software that computes the intersection of irregular 3-D
    regions within TALOSS. That software is the same software included in TALOSS as
    described in the subject article. A patent application for this software already
    has been prepared by its inventors (Graf, Nielsen, Lima and Drury).


    A major portion of the TALOSS software was written at Virginia Tech University
    under the direction of the NUWC by graduate student, Fernando DasNeves. The funding
    for his work was provided under a NAVCITTII Virginia Tech grant administered by
    ONR (Dr Rosenblum).


    The Naval Research Laboratory contributed that laboratory''s expertise in 3-D
    rendering and visualization to the NUWC-led project. NRL (initially Mr Rob King),
    conducted research on 3-D interactive devices in the immersive variant of the
    TALOSS. Mr Douglas Maxwell, then an NRL employee, subsequently developed a 3-D
    grid-based approach to ocean floor rendering within TALOSS using the digital nautical
    chart database. Mr Maxwell also developed the collision detection algorithms used
    in TALOSS. Mr Maxwell''s primary role, since joining NUWC a year ago, has been
    as a technical consultant to the project.


    Mr Richard Shell of NUWC has served as the technical lead for the TALOSS Project
    for the past three years. Mr Todd Drury is the NUWC software development lead
    for TALOSS and has been responsible for the design and development of the TALOSS
    software for the past three years. The bottom rendering approach currently implemented
    in TALOSS and referenced in the Linux Journal article is Mr Drury''s work, with
    Mr Maxwell''s as a candidate to follow. A patent for this software was submitted
    several months ago.


    The authors would like to express regret in the inadvertent omission of these
    acknowledgements. Thanks to the hard work and dedication of all involved, this
    project was a resounding success.


    --

    Douglas B. Maxwell, MSME, Research Scientist/Mechanical Engineer, Naval Undersea
    Warfare Center


