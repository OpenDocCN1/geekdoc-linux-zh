    The third part of the output (Listing 3) lists the disk’s table of up to 30 Attributes
    (from a maximum set of 255). Remember that Attributes are no longer part of the
    ATA standard, but most manufacturers still support them. Although SFF-8035i doesn’t
    define the meaning or interpretation of Attributes, many have a de facto standard
    interpretation. For example, this disk’s 13th Attribute (ID #194) tracks its internal
    temperature.


    Studies have shown that lowering disk temperatures by as little as 5°C significantly
    reduces failure rates, though this is less of an issue for the latest generation
    of fluid-drive bearing drives. One of the simplest and least expensive steps you
    can take to ensure disk reliability is to add a cooling fan that blows cooling
    air directly onto or past the system’s disks.


    24 hours or it has exceeded its design or usage lifetime. Some of the Attribute
    values are updated as the disk operates. Others are updated only through off-line
    tests that temporarily slow down disk reads/writes and, thus, must be run with
    a special command. In late 1995, parts of SFF-8035i were merged into the ATA-3
    standard.


    Starting with the ATA-4 standard, the requirement that disks maintain an internal
    Attribute table was dropped. Instead, the disks simply return an OK or NOT OK
    response to an inquiry about their health. A negative response indicates the disk
    firmware has determined that the disk is likely to fail. The ATA-5 standard added
    an ATA error log and commands to run disk self-tests to the SMART command set.


    To make use of these disk features, you need to know how to use smartmontools
    to examine the disk’s Attributes (most disks are backward-compatible with SFF-8035i),
    query the disk’s health status, run disk self-tests, examine the disk’s self-test
    log (results of the last 21 self-tests) and examine the disk’s ATA error log (details
    of the last five disk errors). Although this article focuses on ATA disks, additional
    documentation about SCSI devices can be found on the smartmontools Web page.


    To begin, give the command smartctl -a /dev/hda, using the correct path to your
    disk, as root. If SMART is not enabled on the disk, you first must enable it with
    the -s on option. You then see output similar to the output shown in Listings
    1–5.


    The first part of the output (Listing 1) lists model/firmware information about
    the disk—this one is an IBM/Hitachi GXP-180 example. smartmontools has a database
    of disk types. If your disk is in the database, it may be able to interpret the
    raw Attribute values correctly.


    The second part of the output (Listing 2) shows the results of the health status
    inquiry. This is the one-line Executive Summary Report of disk health; the disk
    shown here has passed. If your disk health status is FAILING, back up your data
    immediately. The remainder of this section of the output


    Each Attribute has a six-byte raw value (RAW_VALUE) and a one-byte normalized
    value (VALUE). In this case, the raw value stores three temperatures: the disk’s
    temperature in Celsius (29), plus its lifetime minimum (23) and maximum (33) values.
    The format of the raw data is vendor-specific and not specified by any standard.
    To track disk reliability, the disk’s firmware converts the raw value to a normalized
    value ranging from 1 to 253. If this normalized value is less than or equal to
    the threshold (THRESH), the Attribute is said to have failed, as indicated in
    the WHEN_FAILED column. The column is empty because none of these Attributes has
    failed. The lowest (WORST) normalized value also is shown; it is the smallest
    value attained since SMART was enabled on the disk.


    The TYPE of the Attribute indicates if Attribute failure means the device has
    reached the end of its design life (Old_age) or it’s an impending disk failure
    (Pre-fail). For example, disk spin-up time (ID #3) is a prefailure Attribute.
    If this (or any other prefail Attribute) fails, disk failure is predicted in less
    than 24 hours.


    The names/meanings of Attributes and the interpretation of their raw values is
    not specified by any standard. Different manufacturers sometimes use the same
    Attribute ID for different purposes. For this reason, the interpretation of specific
    Attributes can be modified using the -v option to smartctl; please see the man
    page for details. For example, some disks use Attribute 9 to store the power-on
    time of the disk in minutes; the -v 9,minutes option to smartctl correctly modifies
    the Attribute’s interpretation. If your disk model is in the smartmontools database,
    these -v options are set automatically.


    The next part of the smartctl -a output (Listing 4) is a log of the disk errors.
    This particular disk has been error-free, and'
