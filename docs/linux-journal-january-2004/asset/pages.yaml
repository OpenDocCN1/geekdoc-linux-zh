    The one reason you might want to consider bandwidthd over MRTG or Cacti is that
    bandwidthd graphs individual IP addresses instead of capturing raw traffic volume.
    bandwidthd also attempts to categorize the traffic into TCP, UDP, ICMP, VPN, HTTP
    and P2P traffic per host. That is, you can see what each host is doing with the
    bandwidth it''s using. Perpetual bandwidth hogs and even sudden virus infestations
    can be seen on the graphs once you have a baseline. Requires: libgd, libpng12,
    libpcap, glibc, libXpm, libX11, libjpeg, libfreetype, libz, libm and libdl.


    —DAVID A. BANDEL'
