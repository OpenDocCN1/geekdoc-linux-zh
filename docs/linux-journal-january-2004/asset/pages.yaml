  md: '# Listing 1. Lock-Free Pathname Segment Lookup


    ```

    1 struct dentry *

    2 __d_lookup(struct dentry * parent,

    3             struct qstr * name)

    4 {

    5     unsigned int len = name->len;

    6     unsigned int hash = name->hash;

    7     const unsigned char *str = name->name;

    8     struct hlist_head *head = d_hash(parent,hash);

    9     struct dentry *found = NULL;

    10    struct hlist_node *node;

    11

    12    rcu_read_lock();

    13    hlist_for_each (node, head) {

    14        struct dentry *dentry;

    15        unsigned long move_count;

    16        struct qstr * qstr;

    17

    18        smp_read_barrier_depends();

    19        dentry = hlist_entry(node, struct dentry,

    20                            d_hash);

    21        if (unlikely(dentry->d_bucket != head))

    22            break;

    23        move_count = dentry->d_move_count;

    24        smp_rmb();

    25        if (dentry->d_name.hash != hash)

    26            continue;

    27        if (dentry->d_parent != parent)

    28            continue;

    29        qstr = dentry->d_qstr;

    30        smp_read_barrier_depends();

    31        if (parent->d_op &&

    32            parent->d_op->d_compare) {

    33            if (parent->d_op->d_compare(parent, qstr,

    34                                        name))

    35                continue;

    36        } else {

    37            if (qstr->len != len)

    38                continue;

    39            if (memcmp(qstr->name, str, len))

    40                continue;

    41        }

    42        spin_lock(&dentry->d_lock);

    43        /*

    44         * If dentry is moved, fail the lookup

    45         */

    46        if (likely(move_count ==

    47                   dentry->d_move_count)) {

    48            if (!d_unhashed(dentry)) {

    49                atomic_inc(&dentry->d_count);

    50                found = dentry;

    51            }

    52        }

    53        spin_unlock(&dentry->d_lock);

    54        break;

    55    }

    56    rcu_read_unlock();

    57    return found;

    58 }

    ```


    comparison functions may be provided, for example, for case-independent filesystems,
    as shown on line 33.


    If execution reaches line 42, we have found a child dentry with a matching name.
    We then acquire the child dentry''s lock on line 42. Because we have a lock on
    each dentry, the level of contention on these individual locks is much lower than
    on the original dcache_lock. Nonetheless, life is not perfect. For example, the
    lock on the root dentry still is subject to contention, a topic discussed later.


    The child dentry possibly was renamed after the d_move_count snapshot was acquired
    on line 23. Therefore, lines 46-47 check the current value of d_move_count against
    the snapshot. If the check passes, the child dentry has not been renamed out from
    under the lookup, and lines 48-51 increment a reference count—but only if the
    entry still is hashed.


    Line 53 releases the child dentry''s lock, and line 54 breaks out of the hash-chain
    search loop. Line 57 returns a pointer to the child dentry if the lookup was successful,
    or NULL otherwise.


    A failure of __d_lookup() does not mean that failure is returned to the user process.
    The file actually may exist, but has not been loaded yet into dcache.


    This function does not protect, however, against all rename-race hazards. One
    additional race is caused by the fact that dcache uses hlist rather than list
    for the dcache hash chains. It uses hlist to save memory, because hlist requires
    one rather than two pointers in the list header. This does mean, though, that
    hlist, unlike list, is not circular. It therefore is possible that a particular
    dentry will be renamed such that it lands in a previously empty dcache hash chain.
    If this happened at the right time, the __d_lookup() function could return search
    failure incorrectly.


    An incorrectly returned search failure is handled by the upper-level d_lookup()
    function, shown in Listing 2. Any racing renames are detected by the read_seqretry()
    function on line 13. As the problematic case results only in spurious failure,
    the check is made only on NULL return from __d_lookup().


    # Listing 2. Pathname Segment Lookup Rename-Race Resolution


    ```

    1 struct dentry *

    2 d_lookup(struct dentry * parent,

    3          struct qstr * name)

    4 {

    5     struct dentry * dentry = NULL;

    6     unsigned long seq;

    7

    8     do {

    9         seq = read_seqbegin(&rename_lock);

    10        dentry = __d_lookup(parent, name);

    11        if (dentry)

    12            break;

    13    } while (read_seqretry(&rename_lock, seq));

    14    return dentry;

    15 }

    ```


