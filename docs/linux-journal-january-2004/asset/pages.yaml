- pgno: 61
  md: "main memory under the dirty cache line. You therefore must issue the flush\
    \ before an external entity (such as a PCI card) modifies main memory and issue\
    \ an invalidate after this flush but before the CPU accesses any data that has\
    \ changed.\n\nIn theory, for write back caches an invalidate kills the cache line\
    \ without actually writing the data out, thus destroying the data in the cache.\
    \ A safer thing to do in this case is issue a flush and invalidate instruction:\n\
    \n```\nvoid\ndma_cache_wback_inv(unsigned long address,\n    unsigned long size);\n\
    ```\n\nThis flushes the cache lines to main memory and then invalidates them from\
    \ the cache.\n\n# Types of Caches\n\nThis section explains how a cache actually\
    \ works. The only vital piece of information you need from this section is a property\
    \ called aliasing, which means that the same physical address in memory may be\
    \ cached in multiple distinct cache lines. How the kernel actually manages the\
    \ aliases is discussed in the following section.\n\nIn a directly mapped cache,\
    \ as shown in Figure 3, the cache is divided up into cache lines of known width\
    \ (four in the example). Each line in the cache is characterized by a unique index,\
    \ so every byte in the cache is addressed by the index of the line and offset\
    \ into the line. Each index of the cache also possesses a hidden number called\
    \ the tag.\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_61_0.png)\n\nFigure 3.\
    \ A Directly Mapped Cache\n\nEvery address in the system is divided into three\
    \ pieces—tag, index and offset—along a power of two boundary (Figure 4). When\
    \ a line is brought into the cache, the tag and index are extracted from the address.\
    \ The line is stored in the cache at the required index, and the hidden tag is\
    \ stored along with the line data. When the CPU makes reference to a particular\
    \ address, the cache is consulted at the given index. If the tags match, the offset\
    \ into the line is fetched to satisfy the address reference. If the tags do not\
    \ match, the current line may be\n\nflushed back to main memory and the correct\
    \ line brought into the cache.\n\n| Tag | Index | offset |\n\nFigure 4. Address\
    \ Division\n\nEvery cache-able address has one and only one corresponding index\
    \ line, which can cause problems. For instance, if the processor reads a sequence\
    \ of addresses that accidentally happen to correspond to the same cache index,\
    \ the cache line must be evicted and re-fetched on each read. Such a situation\
    \ easily can happen in, say, a for loop reading elements of a structure that happens\
    \ to be about the same size as the cache. For directly mapped caches, the index\
    \ sometimes is called the cache color, and this problem is called the cache-line\
    \ coloring problem.\n\nTo get around the coloring problem of directly mapped caches,\
    \ cache circuitry sometimes is arranged so that a cache lookup can compare tags\
    \ simultaneously in more than one cache line. In an N-way associative cache, each\
    \ index corresponds to N cache lines (and tags); thus, we can have up to N addresses\
    \ with the same index simultaneously in the cache.\n\nThe added parallel cache\
    \ lookup circuitry tends to increase the cost of associativity somewhat, so it\
    \ usually is found only in higher-end CPUs.\n\nAt the very top of the range, you\
    \ might find a fully associative cache. This type of cache has no index at all,\
    \ and all lines are consulted at once when looking for a particular tag.\n\nAll\
    \ modern CPUs handle address translation, which means the virtual address used\
    \ by the kernel or application to refer to memory isn't the same as the physical\
    \ address where the data actually resides. The caches can be placed before or\
    \ after address translation, and sometimes in a hierarchical cache there is a\
    \ mixture of placements. Each of these placements has different properties and\
    \ features as described below.\n\nIn physically indexed, physically tagged (PIPT)\
    \ caches, the tag and index of the cache are both in physical memory, that is,\
    \ after virtual address translation has been done. This process is nice and simple,\
    \ but the disadvantage of PIPT caches is that a valid address translation must\
    \ be in the TLB (translation lookaside buffer) of the CPU. If such a TLB entry\
    \ needs to be fetched from memory before the address translation can be done,\
    \ the advantage of caching the data is lost. Even if a TLB entry is present, the\
    \ TLB lookup and the cache lookup must be done sequentially, making these caches\
    \ slow.\n\nIn virtually indexed, virtually tagged (VIVT) caches, on the other\
    \ hand, both the index and tag are in the virtual address space in which the CPU\
    \ currently is operating. Although this makes cache lookups much faster (no address\
    \ translation needs to be done before the lookup or after, if the cache lookup\
    \ is successful), they suffer from several other problems:\n\n+   1. Virtual address\
    \ translations usually are changed as part of normal kernel operation, so the\
    \ cache must pay careful attention to changes in TLB entries (and changes in address\
    \ space) and flush cache lines whose translations have changed.\n2. Even in a\
    \ single address space, multiple virtual addresses may exist for the same physical\
    \ address. Each of these virtual"
