  md: 'in the UPS HOWTO, things would not have gone so smoothly. With a little effort,
    I was able to find C source code that was close to what I needed and modify it
    to meet my needs. I now can control two relays from a single serial port.


    At this point, the bells could be attached to the first relay on the AR-2 using
    the NO contacts. Before connecting it all, though, I wanted to put the AR-2 in
    an enclosure, a nice little box to hold all this stuff so the electronics aren’t
    exposed. I used the EN-B enclosure recommended and sold by EECI. It consists of
    two plastic pieces, a top and bottom, with black plastic inserts to cover openings
    on two sides. The enclosure is rather large for this job, but it works. I had
    to cut the black plastic inserts so that the external connectors would be accessible.
    Also, a hole was cut for the serial connector on the AR-2 that would be used for
    the connection to the computer’s serial port. A hole was drilled for the female
    power connector that powers the AR-2 board. To connect the relay and the bell
    circuit, I chose a red and black banana clip, which can be found at most electronics
    stores. Two more holes were drilled for the banana clips. For added functionality,
    I added a power switch and power LED to the top of the enclosure so the power
    to the AR-2 board could be turned on and off. The LED lights up when the AR-2
    board is turned on. With the electronics tested and enclosed, it was time to move
    on to the computer.


    I chose Red Hat 7.3 as the operating system. A fresh install was done, choosing
    Server as the installation type. Once the Red Hat installation was completed,
    I began customizing the box. I copied ar-2.c, the hacked-up version of upschek.c,
    to the box and compiled it. After it successfully compiled, I copied the resulting
    binary ar-2 to the /usr/bin/ directory, because the AR-2 program runs from cron
    at specific times.


    I wanted to allow remote administration of the cron jobs that ring the bells,
    so I really didn’t feel comfortable with them running as root. I therefore decided
    to add a user for the specific task of ringing and gave it the user name bell
    with the command, useradd bell. The user bell has no need to log in locally or
    remotely, so it is a good idea to change the user’s shell to a non-functioning
    one with the command usermod -s /sbin/nologin bell.


    functioning one with the command usermod -s /sbin/nologin bell.


    A problem with permissions arises here that needs attention. In Red Hat 7.3, the
    /dev/ttyS* devices have their permissions set so that only root and members of
    the group uucp have read and write access to them. User bell, however, needs to
    be able to write to the serial ports in order to control the attached relay device.
    By default, the user bell does not have read or write access to the serial devices.
    To solve this problem, I decided to make the user bell a member of the uucp group.


    access to the serial devices. To solve this problem, I decided to make the user
    bell a member of the uucp group. As root, I added the user bell to the group uucp
    with the command usermod -G uucp bell. Now bell can use AR-2 on the /dev/ttyS0
    device to manipulate the control lines of the serial port.


