  md: 'patches and plugins rely on directory names. Go to the DVB directory and type
    make to compile the driver and some useful applications that help you scan the
    satellites to retrieve a list of channels. make install is not needed because
    the runvdr script we use later takes care of the module loading. It''s important
    to run the makedev.napi script after compiling the drivers, as this script creates
    the needed entries in /dev.


    # Scanning for Channels


    If you live outside of Europe or don’t use the Astra satellites, you have to use
    a different channel list. Scanning for channels is an automated process. A tool
    called scan comes with the DVB driver, and you can find it in the /apps/scan directory.
    Invoke it with the -o vdr option so the output file is in VDR’s channel format.
    To capture the newly created channel file, you need to redirect the programs standard
    output with this command:


    ```

    ./scan -o vdr > channels.conf

    ```


    # Installing VDR


    Fetch vdr-1.2.5.tar.bz2, unpack it in /usr/src and change to that directory. Installing
    VDR can be a bit tricky. Because you can use some patches to spice up the features,
    you quickly can end up in patch hell if you’re not careful. The best idea, if
    you want to use multiple patches, is to get your hands on an all-in-one patch.
    I used nothing but the Elchi patch, which gives the rather dull default VDR interface
    a nice face-lift. If you have the right patch for your VDR version, you shouldn’t
    encounter any problems.


    The range of additional functions added by plugins goes from simple games to e-mail
    alerts to full-featured DVD playback. Here, install only two, the remote plugin
    and the MP3/MPlayer playback plugin. The remote plugin is necessary only when
    using the original remote from Hauppauge. The MP3/MPlayer plugin, on the other
    hand, is a must-have.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_32_0.png)


    Figure 1. VDR Main Menu with the Elchi Patch Applied


    Change to /usr/src/vdr-1.2.5/PLUGINS/src and unpack the two packages. VDR’s Makefile
    won’t build the plugins until you strip the version information from the directory
    names, so rename them to remote and MP3. The MP3 plugin has some additional requirements,
    namely


    libsndfile, libmad and libid3tag. Since Red Hat ships without MP3 support, you
    have to install them manually. Fetch them from www.freshprms.org, and don’t forget
    to install the development packages. When everything is set, type make REMOTE=plugin
    NEWSTRUCT=1 all plugins. The REMOTE=plugin parameter adds another input method
    using the remote plugin. You can use Lirc to select whatever remote you happen
    to find; VCR ones do rather well. Simply add REMOTE=lirc in that case. Keyboard
    support is enabled by default and shouldn’t be disabled, as it can be very helpful
    for debugging. The NEWSTRUCT=1 is needed to tell the plugins to search for the
    new drivers in /usr/src/DVB.


    Having compiled everything, we now need to edit the start-up script a bit. As
    a basis, use the one supplied with the remote plugin. You can find it in the misc
    directory, named runvdr.remote. This script loads a keymap so the signals from
    the remote are decoded. This is used only with Hauppauge’s IR receiver. If you
    don’t have one, use the runvdr script in VDR’s root as a starting point. Move
    the runvdr.remote script to VDR’s root and fire up your favorite editor. On line
    24 you should find the parameters by which vdr is started. Mine looks like this:


    ```

    VDRCMD="$VDRPRG -w 60 -P scanner \

    -P\"mplayer -M /video/plugins/mplayer.sh\" \

    -P mp3 \

    -P\"remote -i /dev/input/event1\" $*"

    ```


