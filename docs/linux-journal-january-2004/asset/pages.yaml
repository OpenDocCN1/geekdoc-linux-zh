    mount, which need to traverse all the filesystems mounted in a particular subtree
    of the overall pathname namespace.


    # Applying RCU to dcache


    A full parallelization of dcache would be quite complex and was deemed too risky
    for the latter part of the 2.5 effort. The 2.6 dcache is but one step along the
    road to RCU; the goal for 2.7 is to walk the entire path without acquiring any
    locks. Pathname segment lookup is performed by the __d_lookup() function shown
    in Listing 1. The __d_lookup() function is invoked with a pointer to the parent
    directory''s dentry and the name to be looked up. The name is passed in a struct
    qstr, which contains a pointer to the string, its length, a precomputed hash value
    for the dcache hash table and the name itself, if desired.


    Lines 5–7 unmarshall the struct qstr. Line 8 hashes the combination of the name
    and the parent dentry pointer into the global dcache hash table, yielding a pointer
    to the corresponding hash chain.


    Lines 12 and 56 demark the RCU-protected segment of the code, disabling preemption
    in CONFIG_PREEMPT kernels, as specified by the Reader-Writer-Lock/RCU analogy
    described in the article entitled “Using RCU in the Linux 2.5 Kernel” in the October
    2003 issue of Linux Journal. Lines 13–55 loop through the elements in the selected
    hash chain, looking for the matching dentry. Line 18 issues a memory barrier but
    only on DEC Alpha. On other CPUs, the data dependency implied by the pointer dereference
    suffices, so on these CPUs, line 18 generates no code.


    Because this lookup acquired no locks, it may be racing with a rename system call.
    Such a system call could move a dentry to another hash chain, taking this lookup
    with it. Lines 21 and 22 check for this race, but they are not sufficient in and
    of themselves. Therefore, line 23 takes a snapshot of the number of times that
    the current dentry has been subjected to a rename, the dcache d_move() function,
    which is used later to determine if any renames raced with the path walk. Line
    24 is a memory barrier to ensure that the snapshot is not reordered by either
    the compiler or the CPU.


    Lines 25–28 check the name hash and the parent dentry. If either fail to match,
    this dentry cannot be the target of our lookup. Lines 29–41 do the full name comparison,
    with memory barrier for DEC Alpha at line 30. Filesystem-specific name


