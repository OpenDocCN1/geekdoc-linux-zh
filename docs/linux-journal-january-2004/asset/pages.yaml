    Finally, xobs provides a search function that allows the user to enter the name
    of a celestial object, search an internal database and automatically slew the
    telescope into position to observe and photograph the requested object.


    telsched is the element of Talon that makes robotic unattended observing sessions
    possible. This can be a critical function for institutions conducting research
    from remote locations or those requiring repeated observations of particular objects
    over a given period of time.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_71_1.png)


    Figure 3. telsched, the Talon Operations Scheduling Program


    The telsched command opens a scheduler for these unattended observing sessions.
    The scheduler automatically calculates images to be taken during the session based
    on the size (in degrees) of the chunk of sky the user selects. In general, the
    tighter the area of the sky (fewer degrees), the more images taken. Images taken
    by telsched during an unattended session are stored in a directory of the user''s
    choice. All instructions created by the telsched program are stored in a flat
    file. These instructions are referenced by xobs when the telescope is slaved off
    to robotic control from the xobs interface.


    Camera is another terminal-launched application in the Talon suite. It provides
    complete control over the functions of a CCD camera attached to the telescope.


    The camera application includes tools for exposure time, image size, software
    image filtering and image analysis. Camera also contains tools for adjusting the
    brightness and


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_71_2.png)


    Figure 4. Camera, the Talon Image Processing Application


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_71_3.png)


    Figure 5. xephem, the Ephemeris Program for Talon


    contrast of images, determining the area of interest (AOI) of the image and automatically
    labeling objects by comparison to the World Coordinates System (WCS). The latter
    tool is, in fact, a pattern-matching algorithm that allows the system to compare
    known patterns of objects to the WCS database.'
