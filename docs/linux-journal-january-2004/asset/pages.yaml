- pgno: 17
  md: 'Once you have provided some basic information about your new destination, you
    have to define at least one action ("move") and then define the most important
    part, the server section. In the server section you indicate the server on which
    the files eventually should be deposited. As we’ve already indicated that we are
    copying files rather than using FTP, we need to fill in only the destination pathname,
    which should match the DocumentRoot of the Apache virtual host where the document
    will be available.


    # Writing and Publishing


    Now that we have created an output channel, we can go back and create a new story,
    putting on our reporter hat. (Remember, each of these menus normally is meant
    to be used by a different person or group of people on a magazine’s staff.) Click
    on New Story in the the Story menu, giving it the minimum of a title, a category
    (/ , unless you have defined other categories) and a priority (normal). You also
    can set the publication date, which indicates not only when the story should be
    published to the Web, but also the URL with which it should be available. Longtime
    readers of Salon.com probably have noticed that each story’s URL contains the
    date of publication; it should come as no surprise that Bricolage, which evolved
    from the CMS developed at Salon, continues in that tradition.


    When you have filled in this basic information, click on the Create button. You
    now have the opportunity to create the text of your article, adding paragraphs
    (one at a time or separated by blank lines using the bulk Edit button). When your
    story is finished, you can submit it to the Edit Desk using the Check In button
    at the bottom of the page, sending it to the Edit Desk.


    Unfortunately, the nature of a Web-based interface and the flexibility that Bricolage
    offers means that the interface for Bricolage often is a bit complex, forcing
    you to work with a number of different Submit buttons. Fortunately, the buttons
    are labeled clearly, which means that even if you end up saving your story rather
    than checking it in to the Edit Desk, you probably aren’t going to delete the
    story accidentally. That said, new Bricolage users would be wise to read the labels
    on the buttons before assuming that all Submit buttons are created equal.


    Now that we have submitted the article to the Edit Desk, we change hats once again
    and pretend to be the editor who has to review the story. Click on the Edit menu
    under the Desks subheading in the Stories menu, and you get a list of all stories
    currently checked in to the edit desk (Figure 2). Stories already published have
    a P in their titlebars. Stories checked out (that is, available for changes by
    an editor) can be edited. But we’re not going to edit the story right now, because
    we know that the author is one who consistently finishes his sentences and carefully
    double-checks his work. For now, we send it along to the Publish Desk, where things
    are reviewed one last time and then sent to the Web. We do this by choosing Publish
    on the Move To menu and then clicking Move Assets.


    We then can go to the Publish Desk, where items are reviewed one final time before
    they are published to the Web. Notice that Bricolage comes with built-in support
    for copyediting and legal reviews. You can create new desks as well, if


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_17_0.png)


    Figure 2. At the Edit Desk, you can check for stories ready to edit.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_17_1.png)


    Figure 3. Review stories for publication at the Publish Desk.


    your organizational structure is more complicated than the default setup.


    In many ways, the Publish Desk is the same as the others; it allows you to add
    notes to a story, view a story’s edit trail or even see the log of changes. You
    also can edit the story at the Publish Desk by checking it out and clicking on
    the Edit link. The most important parts of the Publish Desk, however, are the
    additional check box (marked Publish, not surprisingly) and a button marked Publish
    Checked (Figure 3).


    When you click on Publish Checked, Bricolage gives you the option of indicating
    when the story should be published. This is different from the publication date
    of the story. You might want a story with a February 1st date, for example, to
    be available on January 31st. Alternatively, you might want it to be available
    only on February 7th. Clicking on the Publish Assets button puts this process
    in place, with Bricolage reporting it has published the story (or stories) in
    question. And sure enough, our document has been published to the URL we assigned
    it earlier—in this case, as index.html in the DocumentRoot.'
