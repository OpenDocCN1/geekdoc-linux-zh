  md: '# One might assume these blades simply would be a modified ThinkPad on a card,
    but in reality the blade is a miniaturized, enterprise-class server.


    SAN controller card overlaps with the second IDE drive, so you can use only one
    IDE drive if you also are connecting to a SAN. The SAN card is a custom Qlogic
    SAN card, which provides redundant pathways to the SAN switch modules. IBM also
    offers a companion blade that allows two SCSI drives to be attached to a blade,
    but it consumes another slot in the chassis.


    The blades are hot-swappable and generally easy to upgrade. If a blade suffers
    catastrophic failure, the blade can be removed and an onboard diagnostic system
    flashes an LED next to the faulty component. I did find that installing the heatsink
    on the second CPU required a disturbing amount of force due to the spring-loaded
    screws used to secure it.


    An interesting design characteristic of the BladeCenter is that IBM promises they
    eventually will release blades based on their pSeries and iSeries server lines.
    This means you can mix and match both Intel and mainframe-class blades in the
    same chassis. At the time of this writing, no such products have been announced
    formally, though.


    As mentioned earlier, the BladeCenter has a powerful Web-based interface. Blades
    can be powered on and off, the CD/floppy or console port can be switched and firmware
    can be updated over the Web. At this time, user names and passwords must be defined
    within the management console, which is bothersome because those user names then
    must be defined again in each Ethernet and SAN switch


    module. In addition, security controls are coarse. Users cannot be granted access
    to only certain blades or limited to performing only certain tasks. Although users
    can be limited to having only view access, this limit also prevents those users
    from utilizing the remote console.


