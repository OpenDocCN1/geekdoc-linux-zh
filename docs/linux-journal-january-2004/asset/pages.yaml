- pgno: 19
  md: '# Scalability:

    from

    Simplicity

    Comes

    Complexity


    If the idea of yet another game with cards or guns leaves you yawning, why not
    amuse yourself with virtual structures or sample our chef’s tasty molecules? BY
    MARCEL GAGNÉ


    t’s a methanol molecule, François. Why do you ask? Non, mon ami, it may be alcohol,
    but it bears no resemblance to the alcohol found in that most noble of liquids,
    wine. That would be ethyl alcohol, and as you can see, its molecular structure
    is quite different. Why am I doing this, you ask? Because the theme of this issue
    is kernel scalability. You still do not see the connection? Kernel scalability,
    François, is a fascinating area of development. This is the front line of Linux’s
    future, and the programmers working in this area are doing fantastic work. It
    just seemed to me that because we are going to be sampling a little bit of wine
    when our guests arrive, a different kind of scalability might be in order. François,
    why aren’t you paying attention?


    Ah, our guests are here! Welcome, mes amis, to Chez Marcel, home of fine Linux
    fare, exceptional wines and from-the-ground-up design. François and I were discussing
    the theme of this issue. Please sit; your tables are ready and my faithful waiter
    will run to the cellar immédiatement to fetch the wine. I think the 2001 Châteauneuf-du-Pape
    with its rich fruit, tantalizing texture and complex aromas should do nicely.
    You’ll find it in the south wing next to the entrance to the reading room.


    While we wait for the wine, let me introduce you to the first item on today’s
    menu. As I was telling François, I felt that because we are sampling a little
    vin, our features would explore scalability of a different sort. Just as a few
    lines of code can have a huge impact on the performance of certain kernel functions,
    so too can a few stray atoms have a massive effect on a final molecular product.
    For instance, consider the difference between ethyl alcohol and methanol. Most
    of us left chemistry behind a number of years ago, with the possible exception
    of cooking, non? As part of the KDE suite, you can find a little program from
    Andreas Wüst called KAtomic


    (Figure 1). It is listed under the Games menu along with other strategy or puzzle
    games.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_19_0.png)


    Figure 1. Building Molecules Atom by Atom with KAtomic


    If you ever have played Sokoban, you should notice some similarities here. The
    premise of KAtomic is simple. Execution is somewhat more complex. You are given
    a molecule, displayed in the right-hand pane, with its component atoms scattered
    in a maze of sorts. Pressing the Tab key (or clicking the mouse) selects an atom
    that you then set in motion by pressing one of the cursor keys. Once in motion,
    the atom continues to move until it hits a barrier, either a wall or another atom.
    In this way, you create complexity from simplicity. It’s also a fantastic way
    to eat up your free time.


    Just as simple code is used to build ever more complex programs, so too can we
    move from molecules to visible structures. The next item on tonight’s menu is
    a little hard to explain, and I must admit that I had some doubts when I first
    looked at it. It’s called Construeo, and quite frankly, it turned out to be an
    amazingly addictive little program.


    Ingo Ruhnke’s Construeo is, in effect, a two-dimensional construction program
    that lets you build objects on-screen using rods and springs connected at points
    that you define. The resulting structure then can be run, which essentially means
    letting real-world physical forces act on it. The idea is to build a stable structure,
    which is a lot harder than it sounds. If your creation starts to waver and finally
    crashes to the ground, it’s time to rethink and modify your construction. A note
    on the Construeo Web site makes a point of letting us know it is “currently not
    a real game”, but I beg to differ. To get in on this thought-provoking bit of
    fun, head over to the Construeo Web site at www.nongnu.org/construeo.


    Building Construeo simply is a matter of extracting, configuring and making. Yes,
    mes amis, it’s the classic extract and build five-step:


    ```

    tar -xzvf construeo-0.2.2.tar.gz

    cd construeo-0.2.2

    ./configure

    make

    su -c "make install"

    ```'
