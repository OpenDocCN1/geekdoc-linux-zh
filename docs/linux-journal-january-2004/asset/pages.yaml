- pgno: 21
  md: 'Running `make install` installs the program in `/usr/local/games`. In that
    directory, you may find two versions of the program, one called `construo.x11`
    and the other called `construo.glut`. On the SuSE 8.2 notebook where I tested
    *Construo*, I found the graphics to be sharper and the text cleaner when using
    the X11 version (Figure 2).


    When the program starts for the first time, you are presented with a clean slate.
    At the top of the program window, you see some keyboard shortcuts. To the right
    and left are control buttons. If you abandon a design halfway when you quit, *Construo*
    returns you to that design the next time you play. If, like François, the idea
    of starting clean intimidates you, click the Load button and navigate to the Examples
    directory. There, you are rewarded with a number of prebuilt structures you can
    modify until you feel more confident to create from scratch.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_21_0.png)


    Figure 2. *Construo* makes designing improbable structures fun.


    To add a dot, left-click on the screen, move to where you want the opposite point
    (or joint) to reside and left-click again. To remove a dot, right-click. At some
    point, you should feel you’ve created something reasonably stable. Click the Run
    button to set the laws of physics into motion, and watch how your structure behaves
    under stress. In all likelihood, your first creation will bend, twist, topple
    and eventually collapse—which can be a lot of fun. *Construo* lets you set objects
    in motion (check out the basketball demo), put barriers in the way (colliders)
    and otherwise release your creative genius.


    To modify and strengthen your now—demolished creation, click Undo and your whatever-it-is
    (or was) returns to its former glory. When you get bored with creating and are
    ready to start anew, press C to clear the scene, and you once again begin your
    mechanical ascent to new heights.


    Building things on solid ground is interesting enough, but try building them in
    a 3-D, zero gravity, virtual world. That’s the idea behind one of the strangest
    games this Linux chef has ever run across. The program, called *Ensemblist*, was
    created for a 2003 Paris game-coding exhibit. This is another one of those deceptively
    simple ideas that turns out to be something much greater. All you have to do is
    build the shape presented to you on-screen using simple geometric shapes. This
    assembly uses simple programming and mathematical principles:


    boolean, union and intersection.


    Have I neglected to mention that the shapes are three-dimensional and floating
    in a networked virtual space where they can be rotated along any axis? This is
    something the authors, rixed and dom, call CSG, or constructive solid geometry
    (Figure 3).


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_21_1.png)


    Figure 3. Building Complex Objects from Geometric Primitives in *Ensemblist*''s
    CSG


    *Ensemblist* is distributed as source from www.nongnu.org/ensemblist. After extracting
    the file with `tar -xzvf ensemblist.tgz` and switching to the source directory
    with `cd ensemblist`, you simply run `make`. When the compile finishes, type `su
    -c ''make install''`. Now, run the program by typing `ensemblist` at the command
    line. *Ensemblist* installs in `/usr/local/games` by default.


    What follows is a bit strange the first time around. The program connects to the
    Ensemblist Web site, after which you find yourself floating above a flowchart
    diagram (Figure 4) where you see your user name and your current score (which
    is 1). Below that intro box are two options, OK and Quit. With your mouse, you
    can zoom in and out from this landscape by moving the cursor up or down. Click
    OK and you are transported to the game options, where you can choose free play
    or select a campaign that takes you through some predefined levels. You probably
    want to start with a campaign. You also may want to ask François to fill up your
    wineglass, to steady yourself.


    When the game starts, your selected object is presented in the center of a spherical
    space bounded by fractal walls. Click the Play icon to the lower right and the
    action begins. On the bottom left-hand corner, a counter ticks away. The objects
    you need to use to create the final shape are geometric primitives, and they all
    are sitting at the top left. These are spaced with union operators. Clicking on
    the union operators selects between union (looks like a U), intersection (an upside-down
    U) and minus (a minus sign). At the bottom right, new icons appear so that you
    can review the original shape, quit or claim victory.


    That’s all there is to it. Move shapes in and out of the central build area according
    to these simple rules. This also is where you discover how difficult simple can
    be. *Ensemblist* is very strange and strangely addictive. On subsequent plays,
    you can use the `--no-net` option when starting the game, because the existing
    levels have been downloaded to your system.'
