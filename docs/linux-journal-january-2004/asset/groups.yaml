    \ GAGNÉ\n- **24 偏执企鹅**\n  使用 LDAP 和 IMAP 安全邮件，第二部分\n  MICK BAUER\n\n## 深度\n\n\
    - **69 Linux、TALON 和天文学**\n  控制研究级望远镜的软件也可以控制您的望远镜。\n  TONY STEIDLER-DENNISON\n\
    - **74 使用 SMART 监控硬盘**\n  使用易于配置的工具关注驱动器的健康状况。\n  BRUCE ALLEN\n- **78 Linux 在空中交通管制中**\n\
