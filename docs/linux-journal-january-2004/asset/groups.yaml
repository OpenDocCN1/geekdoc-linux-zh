    ## SMART 标准提供了一种运行磁盘自检并监控磁盘性能各方面的机制。


    日志为空。通常只有当磁盘错误开始大量出现时才需要担心。偶尔出现的瞬态错误且不再复发通常是良性的。smartmontools 网页上有若干 smartctl
    -a 输出的示例，展示了一些说明性的错误日志条目。它们使用磁盘在错误发生时的通电寿命（以小时为单位）进行时间戳标记，而导致错误的各个 ATA 命令则使用磁盘通电后的毫秒时间进行时间戳标记。这可以显示错误是最近发生的还是旧的。


    smartctl 输出的最后一部分（清单 5）是磁盘上运行的自检报告。这些显示了两种类型的自检，短检和长检。 （ATA-6/7 磁盘也可能具有运输和选择性自检。）这些可以用命令
    smartctl -t short /dev/hda 和 smartctl -t long /dev/hda 运行，并且不会损坏磁盘上的数据。通常，短检只需一两分钟即可完成，而长检大约需要一个小时。这些自检不会干扰磁盘的正常功能，因此该命令可用于运行系统上已挂载的磁盘。在我们的计算集群节点上，每周日清晨都会通过
    cron 作业运行一次长自检。清单 5 中的条目都是未出现错误的已完成自检；LifeTime 列显示运行自检时磁盘的通电年龄。如果自检发现错误，逻辑块地址（LBA）会显示磁盘上错误发生的位置。Remaining
    列显示在发现错误时自检的剩余百分比。如果你怀疑磁盘有问题，我强烈建议运行一次长自检以查找问题。


    smartctl -t offline 命令可用于执行离线测试。这些离线测试不会在自检日志中留下条目。它们可以追溯到 SFF-8035i 标准，并更新在正常磁盘操作下不会自动更新的属性值（请参阅清单
    3 中的 UPDATED 列）。某些磁盘支持自动离线测试，通过 smartctl -o on 启用，该测试每隔几小时自动运行一次离线测试。


    ### 清单 4. smartctl -l error /dev/hda 的输出


    ```

    SMART Error Log Version: 1

    No Errors Logged

    ```


    ### 清单 5. smartctl -l selftest /dev/hda 的输出


    SMART 自检日志，版本号 1


    | 编号 | 测试说明 | 状态 | 剩余 | 通电时间(小时) | 首个错误 LBA |

    |-----|------------------|--------|-----------|-----------------|--------------------|

    | 1 | 扩展离线 | 已完成 | 00% | 3525 | - |

    | 2 | 扩展离线 | 已完成 | 00% | 3357 | - |

    | 3 | 短离线 | 已完成 | 00% | 3059 | - |


    SMART 标准提供了一种运行磁盘自检并监控磁盘性能各方面的机制。它的主要缺点是它没有提供直接向操作系统或用户报告发现问题的方法。事实上，由于磁盘 SMART
    状态经常未被监控，许多磁盘问题要到导致灾难性故障时才会被发现。当然，你可以使用 smartctl 实用程序定期监控磁盘，如我所述，但这很麻烦。


    smartmontools 包的剩余部分是 smartd 守护进程，它为你执行定期监控。它监控磁盘的 SMART 数据以寻找问题的迹象。它可以配置为在发现问题时向用户或系统管理员发送电子邮件或运行任意脚本。默认情况下，启动
    smartd 时，它会注册系统的磁盘。然后它每 30 分钟检查一次其状态，以查找失败的属性、失败的健康状态或 ATA 错误数量增加或自检失败，并将此信息默认使用
    SYSLOG 记录在 /var/log/messages 中。


    你可以使用配置文件 /etc/smartd.conf 控制和微调 smartd 的行为。此文件在 smartd 启动时读取，在它 fork 到后台之前。每行包含与不同磁盘相关的指令。我们计算集群节点上的配置文件如下所示：


    ```

    # /etc/smartd.conf config file

    /dev/hda -s on -o on -a -I 194 -m sense@phys.uwm.edu

    /dev/hdc -s on -o on -a -I 194 -m sense@phys.uwm.edu

    ```


    第一列指示要监控的设备。-o on 指令启用自动离线测试，而 -s on 指令启用自动属性自动保存。-m 指令后跟发送警告消息的电子邮件地址，而 -a 指令指示
    smartd 监控磁盘的所有 SMART 功能。在此配置中，smartd 记录所有归一化属性值的更改。-I 194 指令表示忽略属性 #194 的更改，因为磁盘温度经常变化，定期记录此类更改很烦人。


    通常 smartd 由正常的 UNIX init 机制启动。例如，在 Red Hat 发行版上，可以使用 /etc/rc.d/init.d/smartd start
    和 /etc/rc.d/init.d/smartd stop 启动和停止守护进程。


    有关 smartd 及其配置文件的更多信息可以在手册页（man smartd）中找到，摘要可以通过命令 smartd -D 和 smartd -h 找到。例如，-M
    test 指令向测试电子邮件警告消息发送测试电子邮件，以确认警告电子邮件是否正确送达。其他指令提供额外的灵活性，例如监控原始属性值的更改。


    如果磁盘出现问题迹象，你该怎么办？如果磁盘自检失败或磁盘的 SMART 健康状态失败怎么办？首先尽快将数据从磁盘上取下并转移到另一系统。其次，运行一些扩展磁盘自检，看看问题是否在相同的
    LBA 可重复。如果是这样，磁盘可能有问题。如果磁盘的 SMART 健康状态失败并且在保修期内，供应商通常会更换它。如果磁盘自检失败，许多制造商提供专门的磁盘健康程序，例如
    Maxtor 的 PowerMax 或 IBM 的 Drive Fitness Test。有时这些程序实际上可以通过重新映射坏扇区来修复磁盘。通常，它们会报告一个特殊的错误代码，可用于获取更换磁盘。


    本文介绍了 smartmontools 的基础知识。要了解更多信息，请阅读手册页和网页，然后如果需要进一步帮助，请写信给支持邮件列表。记住，smartmontools
    不是备份数据的替代品。SMART 不能也不预测所有磁盘故障，但它通常会提供某些异常的线索，并帮助许多计算集群可靠运行。


    一些开发人员正在将 smartmontools 移植到 FreeBSD、Darwin 和 Solaris，并且我们最近添加了扩展，以允许 smartmontools
    监控和控制 3ware RAID 控制器后面的 ATA 磁盘。如果你想为 smartmontools 的开发做出贡献，请写信给支持邮件列表。我们特别感兴趣的是有关厂商特定
    SMART 属性和原始值的解释和含义的信息。


    Bruce Allen 是威斯康星大学密尔沃基分校的物理学教授。他从事引力波和早期宇宙的研究工作，并建立了多个大型 Linux 集群用于数据分析使用。


