    ## 移动硬盘时修复交换分区


    我使用的是 HP Brio 上的 Red Hat 9（PIII，20GB 和 192MB RAM）。我最初在硬盘为从盘主盘时安装了 Linux。后来我将其改为主盘主盘。我使用启动盘启动
    Linux，但尝试启动系统时，出现交换分区未初始化的错误。内核可以检测到我的根分区和引导分区的变化，但在交换分区的情况下却无法检测。如何动态更改交换分区？换句话说，在启动前应向内核传递什么参数，以便在命令行上指定我的交换分区？另外，我能否使用同一启动盘在具有不同分区分配的其他系统上启动，就像
    Windows 启动盘一样？


    --

    Aman Hardikar, cybergeek2k@rediffmail.com


    *这很容易解释；Linux 在一个设备上查找交换分区（主从盘），可能命名为 /dev/hdbX，X 为分区号，而它现在位于主盘主盘上，可能为 /dev/hdaX。因此，Linux
    找不到指定的交换分区，无法初始化它。要修复此问题，编辑你的 /etc/fstab 文件并更改具有交换条目的那一行中的设备。它可能类似于：*


    ```

    /dev/hdb2  swap  swap  defaults  0 0

    ```


    所以，将其更改为：


    ```

    /dev/hda2  swap  swap  defaults  0 0

    ```


    *在此示例中，交换分区是磁盘上的第 2 号分区。然后重新启动系统，它应该能正常工作。另一种重启方式是在编辑 /etc/fstab 文件后，使用命令 swapon
    -a -e 手动启动交换分区，如上所述。*


    --

    Felipe Barousse Boué, fbarousse@piensa.com


    ## 支持 Serial ATA？


    我打算安装 SuSE 8.2，想知道我能否在 Serial ATA 硬盘上安装它。


    --

    Daniel Gustafsson, gustafsson_danie@hotmail.com


    *Serial ATA 硬盘受 Linux 支持（包括 SuSE 8.2 发行版的库存内核版本 2.4.19）。这显而易见，但正如通常一样，首先你必须检查你的系统
    BIOS 和/或磁盘控制器硬件是否支持 Serial ATA 硬盘。*


    --

    Felipe Barousse Boué, fbarousse@piensa.com


    *通常，第一个问题是，你的 BIOS 是否支持从串行 ATA 接口启动？如果你的 BIOS 不支持从此控制器启动，你可能能够安装 Linux 从其他设备启动。*


    --

    Jim Dennis, jimd@starshine.org


    *你可以在 SuSE 的组件数据库 hardware db.suse.de 上查找你的硬件。其他 Linux 发行版也维护*


    *它们自己的硬件兼容性列表。虽然技术上在你的发行版提供的内核版本中可能受支持，但在购买硬件之前最好还是检查发行版的硬件兼容性列表。列表上的项目更有可能被安装程序自动检测到，你的发行版更有可能包含对列表上项目支持的最新实用程序。*


    --

    Don Marti, dmarti@ssc.com


    Linux Journal 网页上有许多在线帮助资源。Sunsite 镜像站点、FAQ 和 HOWTO 都可以在 www.linuxjournal.com
    找到。


    Best of Technical Support 中发表的答案由一支 Linux 专家团队提供。如果你想提交问题供本栏目考虑，请填写 www.linuxjournal.com/lj-issues/techsup.html
    上的网页表单，或发送电子邮件，主题行写“BTS”至 bts@ssc.com。


    请务必包含你的发行版、内核版本、任何相关细节以及问题的完整描述。


    ## 简单文档管理系统：

    sdms.cafuego.net


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_65_0.png)


    许多公司甚至一些个人都需要一个归档文档的系统。此文档管理系统使用 MySQL 进行存储，并为需要的人提供不同级别的访问权限。访问权限可以按文档逐个拒绝、只读、修改或上帝模式（允许几乎任何操作）。需要：MySQL、PHP、Web
    服务器和 Web 浏览器。


    —DAVID A. BANDEL

