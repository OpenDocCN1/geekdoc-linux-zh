    ## 将 RCU 应用于 dcache


    完全并行化 dcache 会相当复杂，并且在 2.5 工作的后半部分被认为风险太大。2.6 dcache 只是通往 RCU 道路上的一个步骤；2.7 的目标是在不获取任何锁的情况下遍历整个路径。路径名段查找由列表
    1 中显示的 __d_lookup()__ 函数执行。__d_lookup()__ 函数使用指向父目录的 dentry 的指针和要查找的名称调用。名称以 struct
    qstr 的形式传递，其中包含指向字符串的指针、其长度、为 dcache 哈希表预先计算的哈希值以及名称本身（如果需要）。


    第 5–7 行解包 struct qstr。第 8 行将名称和父 dentry 指针的组合哈希到全局 dcache 哈希表中，生成指向相应哈希链的指针。


    第 12 行和第 56 行标记了代码的 RCU 受保护段，在 CONFIG_PREEMPT 内核中禁用抢占，正如 2003 年 10 月《Linux Journal》期刊中题为“Using
    RCU in the Linux 2.5 Kernel”的文章中所述的 Reader-Writer-Lock/RCU 类比所指定。第 13–55 行遍历所选哈希链中的元素，查找匹配的
    dentry。第 18 行发出内存屏障，但仅在 DEC Alpha 上。在其他 CPU 上，指针解引用隐含的数据依赖性已足够，因此在这些 CPU 上，第 18
    行不生成代码。


    由于此查找未获取锁，它可能与重命名系统调用竞争。这样的系统调用可能会将 dentry 移到另一个哈希链，并带走此查找。第 21 行和第 22 行检查此竞争，但它们本身不足。因此，第
    23 行获取当前 dentry 经历重命名的次数的快照，dcache d_move() 函数，后者稍后用于确定是否有任何重命名与路径遍历竞争。第 24 行是内存屏障，以确保快照不会被编译器或
    CPU 重排序。


    第 25–28 行检查名称哈希和父 dentry。如果任一不匹配，则此 dentry 不能是我们查找的目标。第 29–41 行执行完整的名称比较，第 30
    行对 DEC Alpha 进行内存屏障。例如，对于不区分大小写的文件系统，可以提供文件系统特定的名称比较函数，如第 33 行所示。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_42_0.png)


    ### 列表 1. 无锁路径名段查找


    ```

    1 struct dentry *

    2 __d_lookup(struct dentry * parent,

    3             struct qstr * name)

    4 {

    5     unsigned int len = name->len;

    6     unsigned int hash = name->hash;

    7     const unsigned char *str = name->name;

    8     struct hlist_head *head = d_hash(parent,hash);

    9     struct dentry *found = NULL;

    10    struct hlist_node *node;

    11

    12    rcu_read_lock();

    13    hlist_for_each (node, head) {

    14        struct dentry *dentry;

    15        unsigned long move_count;

    16        struct qstr * qstr;

    17

    18        smp_read_barrier_depends();

    19        dentry = hlist_entry(node, struct dentry,

    20                            d_hash);

    21        if (unlikely(dentry->d_bucket != head))

    22            break;

    23        move_count = dentry->d_move_count;

    24        smp_rmb();

    25        if (dentry->d_name.hash != hash)

    26            continue;

    27        if (dentry->d_parent != parent)

    28            continue;

    29        qstr = dentry->d_qstr;

    30        smp_read_barrier_depends();

    31        if (parent->d_op &&

    32            parent->d_op->d_compare) {

    33            if (parent->d_op->d_compare(parent, qstr,

    34                                        name))

    35                continue;

    36        } else {

    37            if (qstr->len != len)

    38                continue;

    39            if (memcmp(qstr->name, str, len))

    40                continue;

    41        }

    42        spin_lock(&dentry->d_lock);

    43        /*

    44         * If dentry is moved, fail the lookup

    45         */

    46        if (likely(move_count ==

    47                   dentry->d_move_count)) {

    48            if (!d_unhashed(dentry)) {

    49                atomic_inc(&dentry->d_count);

    50                found = dentry;

    51            }

    52        }

    53        spin_unlock(&dentry->d_lock);

    54        break;

    55    }

    56    rcu_read_unlock();

    57    return found;

    58 }

    ```


    如果执行到达第 42 行，我们就找到了一个名称匹配的子 dentry。然后我们在第 42 行获取子 dentry 的锁。由于我们对每个 dentry 都有锁，这些单独锁的竞争程度远低于原始
    dcache_lock。尽管如此，生活并不完美。例如，根 dentry 上的锁仍然会受到竞争，这是一个稍后讨论的话题。


    子 dentry 可能在第 23 行获取 d_move_count 快照后被重命名。因此，第 46-47 行检查 d_move_count 的当前值与快照。如果检查通过，则子
    dentry 未在查找过程中被重命名，并且第 48-51 行递增引用计数——但前提是该条目仍被哈希。


    第 53 行释放子 dentry 的锁，第 54 行跳出哈希链搜索循环。第 57 行如果查找成功则返回指向子 dentry 的指针，否则返回 NULL。


    __d_lookup()__ 的失败并不意味着失败会返回给用户进程。文件实际上可能存在，但尚未加载到 dcache 中。


    然而，此函数并不能防止所有重命名竞争风险。另一个竞争是由 dcache 对 dcache 哈希链使用 hlist 而非 list 引起的。它使用 hlist
    来节省内存，因为 hlist 在列表头中只需要一个指针而不是两个指针。这也意味着 hlist 与 list 不同，不是循环的。因此，特定 dentry 可能被重命名，使其落入之前为空的
    dcache 哈希链。如果这发生在正确的时间，__d_lookup()__ 函数可能会错误地返回搜索失败。


    错误返回的搜索失败由上层的 d_lookup() 函数处理，如列表 2 所示。任何竞争的重命名都由第 13 行的 read_seqretry() 函数检测。由于问题情况仅导致虚假失败，因此仅在
    __d_lookup()__ 返回 NULL 时才进行检查。


    ### 列表 2. 路径名段查找重命名竞争解决


    ```

    1 struct dentry *

    2 d_lookup(struct dentry * parent,

    3          struct qstr * name)

    4 {

    5     struct dentry * dentry = NULL;

    6     unsigned long seq;

    7

    8     do {

    9         seq = read_seqbegin(&rename_lock);

    10        dentry = __d_lookup(parent, name);

    11        if (dentry)

    12            break;

    13    } while (read_seqretry(&rename_lock, seq));

    14    return dentry;

    15 }

    ```


    ## 延迟释放


    d_free() 函数必须将给定 dentry 的释放延迟到宽限期过去，因为任意数量的正在进行的路径遍历可能持有对该 dentry 的引用。延迟是在所示的
    d_free() 函数中完成的

    '
