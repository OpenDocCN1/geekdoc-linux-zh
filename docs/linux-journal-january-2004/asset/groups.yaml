    # Mick''s LDAP and IMAP Corrections


    There are two errors in my article "Secure Mail with LDAP and IMAP, Part I" [LJ,
    November 2003]. First, early in the article I say (about Cyrus IMAP) "...use of
    databases rather than flat files to store messages has an obvious performance
    benefit." Actually, although Cyrus IMAP does use database files for indexing messages,
    it stores the messages themselves as individual flat text files.


    Second, later in the article, I correctly point out that to configure Cyrus SASL
    on SuSE to use LDAP, you must edit the parameter SASLAUTHD_AUTHMECH in /etc/sysconfig/saslauthd.
    The problem is, the Cyrus SASL package in SuSE doesn''t have LDAP support compiled
    in. You either need to build your own LDAP-enabled package with SuSE''s cyrus-sasl2
    source-RPM (SRPM) or forego direct LDAP support in SASL altogether and use the
    PAM method instead, which is compiled in by default. In the latter case, you need
    to install the module pam_ldap, and then create a file, /etc/pam.d/imap, containing
    these lines:


    ```

    #PAM-1.0

    auth    required    /lib/security/pam_ldap.so

    account required    /lib/security/pam_ldap.so

    ```


    Next, copy the file /usr/share/doc/packages/pam_ldap/ldap.conf to /etc/openldap/ldap.conf,
    and edit it to match your environment (the most relevant settings are host, base,
    binddn, bindpw and TLS_REQCERT). Finally, edit /etc/sysconfig/saslauthd to include
    this line:


    ```

    SASLAUTHD_AUTHMECH=pam

    ```


    I apologize for any confusion or inconvenience that either error may have caused.

    --

    Mick Bauer


