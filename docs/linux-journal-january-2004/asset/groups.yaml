    ## 空中交通管制中的 Linux


    Linux 是联邦航空管理局空中交通管制软件的自然开发平台。作者 TOM BRUSEHAVER


    很多人说 Linux 还不适合空中交通管制，但实际上它已经准备就绪并且正在使用。最近我参与了一个项目，将 FAA 的 Common ARTS 软件 (www1.faa.gov/ats/atb/Sectors/Automation/CommonArts/index.htm)
    移植到 Linux。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_79_0.png)


    亚特兰大的一名管制员


    当我们大多数人想到空中交通管制系统时，通常会看到带有扫描线的圆形屏幕。有些人知道雷达天线阵列是什么样子。在雷达天线和显示器之间有一些计算机使事情更简单。数字信号处理器（DSPs）位于天线建筑物中，同时也使用自动化系统。本文描述了自动化系统的工作原理以及
    Linux 的使用位置。


    ## 历史


    自动雷达终端系统（ARTS）始于 1964 年的 Univac 计算机。该系统最终于 1973 年在全国范围内推广。原始计算机已升级并至今仍在使用。许多大型站点在
    1980 年代从 Univac 计算机迁移到微处理器。所有遗留的 ARTS 软件在迁移到微处理器的过程中都被移植或用 C 语言重写，以便在实时 LynxOS
    下运行。


    迁移到 LynxOS 是幸运的，因为它提供了可进一步移植的 POSIX 基础。使用 LynxOS 还允许开发人员选择使用的微处理器。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_79_1.png)


    全数字 ARTS 显示器。ACD（右侧）正在取代这些矢量显示器。所有的旋钮现在都变成了显示器上的菜单。


    最初，软件运行在摩托罗拉 68K CPU 上，目前运行在 PowerPC 上。


    ## 架构


    Common ARTS 系统是一个高度分布式、联网的、多线程的实时系统。绝对可靠性是要求。使用双网络，在正常情况下，每个特定任务分配两个备份。软件设计为一个子系统的某些功能可以由另一个子系统接管。


    雷达数据通过串行线路进入每个航迹处理器（TPs）。通常，每个雷达到每个 TP 有四条串行线路。雷达上的数据包括原始雷达信号、应答机信标（每架飞机应具有应答机，每次雷达
    ping 飞机时应答机返回 ID 和高度）以及天气数据。相同的天线阵列通常接收全部三种信号。任何雷达和信标数据都可以通过任意三条串行线路传输，而天气数据通过其专用的串行线路传输。


    TP 至少分为两个子系统：串行消息组装和实际航迹处理。串行消息组装将每种消息类型（原始雷达、信标和天气）转换为网络消息。航迹处理涉及将雷达和信标消息（目标）关联成单一航迹。航迹是已知的飞机历史。目标可以是雷达、信标信号或两者兼有。一旦目标与航迹关联，另一条航迹消息将被放到网络上。


    消息通常在网络上广播。它们使用 UDP 在两个主干上发送，每个消息都有唯一的包 ID。网络上的每台计算机都监听两个主干，并记录从每个唯一网络 ID 听到的包
    ID。如果包 ID 出现间隙，机箱可能会请求重播。重复的包 ID 被忽略，假设它是另一条主干上的消息或某个其他机箱请求重播。


    每个系统必须在网络上广播心跳。如果错过心跳，则假定系统已宕机，其他系统之一会发送消息让备用系统接管。


    处理网络消息的下一个处理器是通用处理器（CP）。CP 执行许多任务，例如将飞行计划与航迹匹配、发送冲突告警（CAs）、最低安全高度警告（MSAW）以及监控
    Common ARTS 系统的部分心跳。CP 最重要的工作是确定航迹的空速和方向。


    当飞机以 300KTS 的速度飞行——大约每分钟五英里——时，提前一两分钟观察非常重要。


    CA 使用速度和方向来查看其他航迹以确定冲突的可能性。如果检测到冲突，CP 会广播 CA 消息，指示冲突的飞机。当飞机以 300KTS 的速度飞行——大约每分钟五英里——时，提前一两分钟观察非常重要。


    ## 移植


    MSAW 使用站点自适应的地图来学习该区域的地形。地形可以是山丘和山脉，也可以是塔楼和建筑物。对于配备应答机的飞机，MSAW 系统会查看高度和位置并判断飞机是否可能过低。如果确定飞机过低，则会广播
    MSAW 消息。


    来自 CP 的飞行计划信息消息显示在 TP 创建航迹的飞机附近的全数据块中。广播的 SMC 整体状态也可以显示。网络可以使用一台或数百台显示器。


    最初，移植到 Linux 的原因是让开发人员在目标硬件上测试之前就能在自己的办公桌上测试和调试系统。目标硬件是运行 LynxOS 的 VME 机箱中的摩托罗拉
    OEM 板。这些系统相对昂贵，因此 FAA 和洛克希德-马丁都不希望有一堆闲置设备。相反，几个测试系统几乎全天候用于集成测试和开发。


    后室的最后一个主要系统是系统监控和控制（SMC）。SMC 的主要目的是监控和控制其他系统。它是 SMC 显示 PC 的网关，是一个用于监控网络及其当前状态的
    GUI。当前状态指示系统处于在线、离线、备用或空闲状态。如果错过心跳，SMC 会指示备用系统接管。系统操作员可以随时指示手动切换、从此 PC 加载新软件或重启系统。SMC
    还用于记录穿越网络的所有数据。


    此外，每个系统都可以在一个或多个 CPU 上运行。如果 CPU 足够强大，所有系统和子系统都可以在单个 CPU 上运行。


    由于信息系统部门给开发人员提供的是 Microsoft Windows NT PC，曾尝试将软件移植到 NT。我开始为公司工作时，大部分移植工作已完成。对于测试某些功能，NT
    工作正常。使用了适配层使 POSIX 线程、文件 I/O 和图形的行为像目标系统一样，因此不适合测试这些功能。


    我们大多数人想到空中交通管制时想到的就是显示器：一间满是圆形矢量显示器和穿白衬衫的人在观看的房间。越来越多的站点使用大型 20"-见方的彩色显示器。新的彩色显示器是
    2048x2048 像素的 X window 显示器。显示处理软件（DPS）的设计使得其部分可以被任何类型的显示器使用，例如彩色方形显示器，如 ARTS Color
    Display（ACD）或圆形矢量显示器，如 Full Digital ARTS Display（FDAD）。


    当我开始在洛克希德-马丁承包工作时，我被安排在


    DPS 接收广播消息并根据系统状态显示适当的图像。在正常运行中，显示包括航迹指示、方向历史指示、全或部分数据块以及各种系统的状态。


    ## 超密集、功能强大、可靠... 数据中心管理简化！

    15" 深，2-Xeon/Opteron 或 P4（带 RAID）选项


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_80_0.png)


