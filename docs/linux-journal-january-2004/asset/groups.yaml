    4.1 的客户端、代理和服务器组件均在 Linux 下运行，允许你从单个控制台对所有 IBM 服务器执行诊断、启动和停止进程以及接收自动警报。


    BladeCenter 上的 Linux 支持远好于我在任何其他服务器厂商那里发现的。Linux 驱动光盘随包装提供，且所有通用管理工具均用 Java 编写，完全支持
    Linux。


    ## CODY 很快就被压垮了


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_68_0.png)


    角色和图像 © 2003 Brad Fitzpatrick, ActiveEdge。保留所有权利。


    ## Etnus TotalView... 地球上最好的线程调试器


    单击即可切换线程，在保持其他线程当前状态的同时控制单个线程，定义和控制线程组等等。TotalView 从零开始设计用于处理多个执行流，为你调试即使是最复杂的线程程序提供所需的一切。不要被线程束缚。


    在 www.etnus.com 免费试用 TotalView。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_68_1.png)


    事实上，我尚未发现任何仅限 Windows 的与 BladeCenter 相关的管理、监控或配置工具。这与过去甚至最专注于 Linux 的硬件厂商的经历相比是一个令人耳目一新的变化。虽然官方支持目前仅限于
    Red Hat Linux 7.3、Red Hat Advanced Server 2.1 和 SuSE Linux 8，但我运行 Red Hat 8.0
    和 9 时没有任何问题。


    如果你的服务器需要任何自定义外设、卡或接口，BladeCenter 不是一个选择，因为没有 PCI 或每刀片 I/O 端口。为每个刀片增加一个专用 USB
    端口会使 BladeCenter 成为更通用的系统。


    另一个重要考虑因素是，如果你没有专用服务器机房，BladeCenter 会令人不舒服地嘈杂。事实上，它嘈杂到 IBM 销售一种声学衰减单元（AAU），本质上是一个大型泡沫消音器。即使安装了
    AAU，也可能通过办公室墙壁听到 BladeCenter 的运行声。


    IBM 声称 BladeCenter 的定价使其在购买七个或以上刀片时成为独立服务器的低成本替代方案。很少能找到具有 BladeCenter 所包含的冗余级别的独立服务器，但我认为即使与功能较少的服务器相比，成本说法也是正确的。总的来说，BladeCenter
    是一项了不起的工程。它可能最适合构建高密度集群的人，但与 SAN 结合使用时，它也是通用服务器的绝佳选择。


    Dana Canfield 是印第安纳波利斯大学的系统管理员，他不断催促厂商为任何事物提供 Linux 支持。你可以通过 canfield@peng1.net
    联系他。


    ## 书评


    ### Hacking the Xbox


    作者 Andrew “bunnie” Huang


    No Starch Press, 2003

    ISBN: 1-59327-029-1

    $24.99


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_69_0.png)


    该书围绕一系列硬件黑客项目构建，复杂度从安装替代 LED 和制作电缆到使用定制窃听板窃听主板不等，《Hacking the Xbox》首先通过打开机箱，然后作废保修，最后四处查看来探索微软游戏主机的硬件内部。


    这样做在有争议的《数字千年版权法》（DMCA）下是一个法律雷区，全文频繁讨论 DMCA。虽然主要对北美读者感兴趣，但该书提供了洞察，说明善意但经常信息不足的立法者可能造成的麻烦。生活在其他国家的黑客可能不会太担心
    DMCA，但这并不意味着没有同等的本地立法在等待。


    从软件角度想学习如何黑客攻陷 Xbox 的读者会感到好奇但失望。虽然它描述了一些重要的 Xbox 软件项目，但《Hacking the Xbox》专注于从硬件工程师而非软件工程师的角度进行逆向工程。关于在
    Xbox 上运行 GNU/Linux 的详细说明不在此书中，但它们在其他地方提供，Andrew Huang 包含了必要的指针。如果你是那种对螺丝刀、烙铁、电子元件和
    PCB 板很熟悉的人，那么这本书就是为你准备的。当然，如果你能忍受在过程中可能毁掉 Xbox 的风险会更好。别担心，Huang 提供了如果出现问题如何更换损坏的大容量存储设备、内存和电源的详细说明。


    副标题为《逆向工程入门》，Huang 的《Hacking the Xbox》远不止于此。它是对密码学及其在硬件设计中应用的介绍。它是对 DMCA 对科学追求构成威胁的警告。它是关于知识产权法及其对黑客影响的入门读物。它是对
    Xbox 黑客社区关键人物的介绍，并突出了他们的动机、意图和贡献。它也是一本相当不错的读物。令人惊讶的是，Huang 在不到 270 页的篇幅内完成了所有这些内容。


    显然，《Hacking the Xbox》描述的是当前的 Xbox，而且现在书籍已经出版（这本身就是另一个故事），下一代 Xbox 很可能会改变，使书籍大部分内容失效。话虽如此，《Hacking
    the Xbox》中描述的通用硬件黑客技术可以重新应用于新 Xbox，尽管没有逐步说明。当然，随着全球数百万台原版 Xbox 主机出货，始终会有旧的、被替换或升级的
    Xbox 可供玩耍，因此该书在相当长一段时间内仍有价值。


    —PAUL BARRY


    ## Linux、Talon 与天文学


    一个新开源应用程序让专业和业余天文学家能够从桌面探索太空。作者 TONY STEIDLER-DENNISON


    自古中国人首次绘制星空以来，我们就对天文学着迷。有人认为，天文学的计算机化是其迄今为止的最大飞跃。今天，无人值守的机器人望远镜扫描了几个世纪以来绘制的天空，将其发现记录在现代数据库中。CCD
    相机捕捉到胶片上无法定义的图像。无论是业余还是专业，这都是成为天文学家的激动人心的时代。


    天文学的革命并不止于硬件。从西班牙到韩国的观测站中的科研级望远镜都在开源软件和基于 Linux 的计算机控制之下。在开源模式下，科学家可以自由修改控制软件，产生惠及业余爱好者的
    trickle-down 效应。开源和 Linux 甚至改变了科学方法。随着源代码自由可用，同行评审现在不仅针对数据，也针对数据收集方法。


    开源天文学革命的最前沿是 Talon。Talon 最初由 Ellwood Downey 开发为天文台控制和天文分析软件（OCAAS）。2001 年，该软件被爱荷华州爱荷华城的
    Torus Technologies 收购。2002 年底，Torus 被 Optical Mechanics, Inc. 收购，更新后的 OCAAS 软件包在
    GPL 下作为 Talon 发布。


    在过去两年里，我每天都有与 Talon 合作的愉快经历。我已在多个望远镜套件上安装和配置了该软件，并随这些望远镜前往世界各地进行安装和现场配置。很高兴与你分享
    Talon 安装、配置和使用的一些要点。


    Talon 可在 observatory.sourceforge.net 下载。该软件与集成运动控制板交互，可从 Optical Mechanics, Inc.（Optical
    Mechanics Motion Controllers）或 Oregon Microsystems（PC39 Motion Controllers）获得。目标获取和跟踪、计划操作、环境监控、穹顶控制、图像分析和处理均在
    Talon 控制之下。使用远程 X 会话也可以进行网络操作。


    ### 使用 Talon


    Talon 软件包包含完整的安装脚本；install.sh 创建一个 talon 用户，编译二进制文件并创建一组用于望远镜初始操作的文本配置文件。


    Talon 包含一套完整的专门作为工具套件使用的天文应用程序。主要的 Talon 界面使用 Motif 工具集，在整个应用程序集中提供熟悉且统一的外观和感觉。虽然工具集很丰富，但以下四个工具应该对大多数观测者有用。


    xobs 是主要的 Talon 控制窗口，通过终端命令 startTel 启动。它包含操作所需的所有监控和校准工具。该窗口提供望远镜及其任何附属外设（如滤光轮或穹顶控制）的手动控制。它还提供望远镜当前位置的恒定显示，该位置由电机编码器的反馈计算得出。此反馈以
    xobs 窗口内的一组文本框形式提供。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_70_0.png)


    图 1. xobs，Talon 主控制屏幕


    使用 Talon 时，首要任务是找到系统各处编码器的零位位置。这些编码器闭合了轴操作的回路，为每个轴的全行程提供静态计数。望远镜的移动部分由所选轴相对于编码器零位位置的运动计算得出。例如，递减赤纬编码器通常会使望远镜向北移动。xobs
    窗口中查找零位的操作会搜索并建立每个轴编码器的零位位置。


    使用 xobs 窗口（图 2）中的软件摇杆命令，用户可以手动定位望远镜、滤光轮和焦点位置。望远镜东西方向的运动称为望远镜的赤经（RA）或时角（HA）。南北方向的移动称为赤纬（Dec）。使用正负编码器计数，移动望远镜轴只是将轴在
    x（RA）或 y（Dec）方向上正负移动的问题。这些坐标相对于北极。


    此外，Talon 通过连接的 Davis 天气站提供观测地点的天气状况数据。此功能确保望远镜在无人值守操作期间不会暴露于恶劣天气条件下。当条件落在预定范围内时，天文台穹顶或卷帘屋顶关闭，望远镜移动到收纳位置，操作停止。如同位置

