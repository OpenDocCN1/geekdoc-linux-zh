    ## Monitoring Hard Disks with SMART


    One of your hard disks might be trying to tell you it’s not long for this world.
    Install software that lets you know when to replace it. BY BRUCE ALLEN


    It’s a given that all disks eventually die, and it’s easy to see why. The platters
    in a modern disk drive rotate more than a hundred times per second, maintaining
    submicron tolerances between the disk heads and the magnetic media that store
    data. Often they run 24/7 in dusty, overheated environments, thrashing on heavily
    loaded or poorly managed machines. So, it’s not surprising that experienced users
    are all too familiar with the symptoms of a dying disk. Strange things start happening.
    Inscrutable kernel error messages cover the console and then the system becomes
    unstable and locks up. Often, entire days are lost repeating recent work, re-installing
    the OS and trying to recover data. Even if you have a recent backup, sudden disk
    failure is a minor catastrophe.


    Many users and system administrators don’t know that Self-Monitoring, Analysis
    and Reporting Technology systems (SMART) are built in to most modern ATA and SCSI
    hard disks. SMART disk drives internally monitor their own health and performance.
    In many cases, the disk itself provides advance warning that something is wrong,
    helping to avoid the scenario described above. Most implementations of SMART also
    allow users to perform self-tests on the disk and to monitor a number of performance
    and reliability attributes.


    By profession I am a physicist. My research group runs a large computing cluster
    with 300 nodes and 600 disk drives, on which more than 50TB of physics data are
    stored. I became interested in SMART several years ago when I realized it could
    help reduce downtime and keep our cluster operating more reliably. For about a
    year I have been maintaining an open-source package called smartmontools, a spin-off
    of the UCSC smartsuite package, for this purpose.


