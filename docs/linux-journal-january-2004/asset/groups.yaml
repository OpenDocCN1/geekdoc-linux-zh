    ## 个人视频录像机基础


    将您的卫星天线连接到基于 PC 的录像机，它可以时移您喜爱的节目、制作存档副本，并通过插件实现更多功能。


    作者 CHRISTIAN A. HERZOG


    我们所有喜爱的电视节目都是数字录制和数字编辑的。但我们使用一些模拟技术接收它们，例如有线、无线电波或卫星。这简直太荒谬了。幸运的是，有一种替代方案可提供更好的画质、杜比数字音效和
    EPG 电子节目指南。女士们先生们，请欢迎 DVB 数字视频广播。


    DVB 使用 MPEG-2 压缩流，理论最大比特率为 15Mbit/s。由于 DVB 从不单独用于视频，会添加额外的音轨和其他信息以创造更丰富的用户体验。所有这些数据都存储在小数据包中。当然，如果某些数据包未到达或损坏，会在画面甚至音轨中留下伪影。另一方面，一旦正确的包再次到达，节目会像什么都没发生一样继续播放，因此无需担心同步问题。信号也比较宽容，因为天线通常设计有足够的余量来应对雨雪或小型动物。


    可用的 DVB 有三种不同模式，DVB-S 用于卫星，DVB-C 用于有线，DVB-T 用于地面接收。三者基本相同；区别在于调谐器。DVB-T 相当新，目前尚未广泛使用；另外两种，尤其是卫星版本，在世界各地都很常见且受欢迎。


    ## 构建 VDR


    主流厂商提供的现代机顶盒具有一些不错的功能，例如硬盘录制和 MP3 播放。尽管如此，它们缺乏更高级的选项，包括将录制内容归档到 SVCD 或某些 MPEG-4
    变体。随着价格实惠的 DVD 刻录机和介质的出现，将您喜爱的电视节目备份到 DVD 已完全可行。在欧洲，数字个人视频录像机（PVR）的价格约为 500 欧元，而且大多数不带硬盘。相比之下，全功能的
    DVB-S 卡在网上零售商处最低可找到 165 欧元。


    但是，没有好软件的廉价硬件有什么用呢？VDR 程序（video disc recorder，视频光盘录像机）使您能够使用您喜欢的 Linux 发行版和 DVB
    卡自行构建功能强大的机顶盒。我构建的机器包含基本功能，如观看电视、录制和时移，以及高级功能，包括 MP3/Ogg 播放、MPlayer 支持的所有视频格式的播放以及将录制材料备份到
    MPEG-4、视频 CD 或 DVD。商业机顶盒几乎无法与此功能列表抗衡。


    ## 选择硬件


    要构建我们的设备，我们需要一些硬件。请记住，录制需要大量空间。120GB 硬盘通常可容纳约 60 小时的视频，这应该足够了。如果您更频繁地备份电影以将其移出硬盘，也可以少用一些，但我建议至少使用
    20GB 驱动器，可容纳约三到四部电影。


    我们还需要一个处理器。如果您想编码视频，需要更快的处理器；如果不编码，旧的 200MHz 机器就足够了。我找不到比 Celeron 1,700MHz 更慢的机器，这已经绰绰有余，甚至足以进行编码过程。使用
    MPlayer 播放也需要较快的处理器，至少 1GHz，尽管据说用更低的配置也能工作。我在较慢的机器上测试过 MPlayer，图像质量确实受损相当严重。其原因是
    MPlayer 使用 DVB 板上的 MPEG-2 解码器的方式。非 MPEG-1/2 资料会在播放时即时转换为 MPEG，这会消耗大量处理器周期。


    这就引出了最重要的硬件部件；DVB 卡。您需要一张具有硬件 MPEG 解码器的全功能卡。这些卡更贵，但它们有多路音频和电视连接。像 WinTV Nova 这样的卡最好作为副卡同时录制多个节目。如果可以，请选择卫星选项。这是迄今为止最灵活的解决方案，因为您不依赖于某个有线电视运营商。此外，您还可以连接多个卫星天线观看更多频道。本文也讨论了
    DVB-S 变体，但部署不同解决方案的过程其实并没有太大不同。我选择了 Hauppauge Nexus-s。它可能是最贵的卡，但它不会出现老型号遇到的过热问题，而且调谐器性能良好，并配有红外遥控器和接收器。


    对于基础软件环境，我使用了 Red Hat Linux 9，但任何发行版都可以使用。安装 GCC 和 libjpeg 的开发包的小型安装就足够了。由于全功能
    DVB 卡具有视频输出功能，因此不需要 X。不要忘记安装所有内核开发包；我们需要它们来编译 DVB 驱动程序。


    ## 安装驱动程序


    一旦基础发行版运行起来，我们就需要卡的驱动程序。您可以在 linvdr.org/download/vdr/Developer 获取 CVS 版本。截至本文撰写时，linux-dvb.2003-09-05.tar.bz2
    是最新版本。当前驱动程序在断开卫星电缆或接收信号降至零时有时会挂起。然后您必须移除并重新插入驱动程序，这并不总是有效，导致您需要重新启动才能再次运行。这些挂起在录制节目或观看电影中途时尤其令人讨厌，但通常不会发生。


    现在进入 /usr/src，解压驱动快照并 mv 到 DVB。重命名目录很重要，因为某些补丁和插件依赖于目录名称。进入 DVB 目录并输入 make 以编译驱动程序以及一些有助于扫描卫星以获取频道列表的有用应用程序。无需
    make install，因为我们稍后使用的 runvdr 脚本会负责模块加载。编译驱动程序后运行 makedev.napi 脚本很重要，因为该脚本会在 /dev
    中创建所需的条目。


    ## 扫描频道


    如果您居住在欧洲以外或不使用 Astra 卫星，则必须使用不同的频道列表。扫描频道是一个自动化过程。DVB 驱动程序附带一个名为 scan 的工具，您可以在
    /apps/scan 目录中找到它。使用 -o vdr 选项调用它，以便输出文件采用 VDR 的频道格式。要捕获新创建的频道文件，您需要使用以下命令重定向程序的标准输出：


    ```

    ./scan -o vdr > channels.conf

    ```


    ## 安装 VDR


    获取 vdr-1.2.5.tar.bz2，解压到 /usr/src 并切换到该目录。安装 VDR 有点棘手。因为您可以使用一些补丁来增强功能，如果不小心，很快就会陷入补丁地狱。如果您想使用多个补丁，最好的办法是获取一个一站式补丁。我只使用了
    Elchi 补丁，它为相当单调的默认 VDR 界面带来了漂亮的外观。如果您有适合 VDR 版本的补丁，就不应该遇到问题。


    插件添加的附加功能范围从简单的游戏到电子邮件提醒再到功能齐全的 DVD 播放。在这里，只安装两个，遥控插件和 MP3/MPlayer 播放插件。遥控插件仅在使用
    Hauppauge 原装遥控器时才需要。而 MP3/MPlayer 插件则是必备的。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_32_0.png)


    图 1. 应用 Elchi 补丁后的 VDR 主菜单


    切换到 /usr/src/vdr-1.2.5/PLUGINS/src 并解压两个包。VDR 的 Makefile 在您从目录名中删除版本信息之前不会构建插件，因此将它们重命名为
    remote 和 MP3。MP3 插件有一些额外要求，即 libsndfile、libmad 和 libid3tag。由于 Red Hat 不提供 MP3
    支持，您必须手动安装它们。从 www.freshmeat.org 获取，并不要忘记安装开发包。设置完成后，输入 make REMOTE=plugin NEWSTRUCT=1
    all plugins。REMOTE=plugin 参数使用遥控插件添加另一种输入方法。您可以使用 Lirc 选择任何找到的遥控器；VCR 遥控器效果相当不错。在这种情况下，只需添加
    REMOTE=lirc。键盘支持默认启用，不应禁用，因为它对调试非常有帮助。NEWSTRUCT=1 是必需的，告诉插件在 /usr/src/DVB 中搜索新驱动程序。


    编译完所有内容后，我们现在需要稍微编辑启动脚本。作为基础，使用随遥控插件提供的脚本。您可以在 misc 目录中找到它，名为 runvdr.remote。该脚本加载键映射以便解码遥控器信号。这仅与
    Hauppauge 的红外接收器一起使用。如果您没有，请使用 VDR 根目录中的 runvdr 脚本作为起点。将 runvdr.remote 脚本移动到 VDR
    根目录并启动您喜欢的编辑器。第 24 行应包含启动 vdr 的参数。我的如下所示：


    ```

    VDRCMD="$VDRPRG -w 60 -P scanner \

    -P\"mplayer -M /video/plugins/mplayer.sh\" \

    -P mp3 \

    -P\"remote -i /dev/input/event1\" $*"

    ```


    ## 无线连接


    蜂窝调制解调器

    802.11b WiFi


    ## TS-5600 586 单板计算机


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_32_1.png)


    - PC 兼容：BIOS、DOS、RTC、I/O & memory map

    - 可用户编程的 PLD 用于数字 I/O

    - 低功耗 +5v @ 900mA  4.3" x 5.6"

    - TS-Linux 3.0 是开源 GNU/Linux - Glibc 2.2.5

    - Apache、SSH、Perl、bash、FTP、kernel drivers


    - 133 MHz x86

    - PCMCIA 插槽

    - 10/100 以太网

    - PC/104 总线

    - Compact Flash

    - 32-64 MB SDRAM

    - 6 ch 12-bit A/D

    - 2 ch 12-bit DAC

    - 23 Digital I/O

    - 2 Serial Ports


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_32_2.png)


    (480)-837-5200

    www.embedded586.com

