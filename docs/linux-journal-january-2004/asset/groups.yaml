    \n## 推出支持 NetFlow™ 的 Cyclades-nQuirer\n\n当今复杂的网络承载着各种类型的流量，从客户信息到可能使网络瘫痪的病毒。拥有网络流量的可见性对于高效的网络管理和规划至关重要。\n\
    \n借助 Cyclades-nQuirer，您可以收集流量数据并将其转换为 NetFlow™ 格式，这使您能够以更高级别的格式整合和分析网络，实现更快的问题解决并提高网络正常运行时间。所有这些都在紧凑的\
    \ form factor 中完成，并且成本仅为同类解决方案的一小部分。\n\n借助 Cyclades-nQuirer，您将能够深入了解您的网络，并像从未有过的那样理解它。\n\
    \n## Linux 杂志\n\n2004 年 1 月 第 117 期\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_4_0.png)\n\
    \nxephem 可在您所在位置提供夜空的定制视图，第 70 页。\n\n## 封面故事\n\n## 69 TALON：用于望远镜控制的 GPL 软件\n\n\
    天文学中的开源革命在很大程度上归功于 Talon，这款 GPL 软件包处理跟踪、计划操作、环境监控、穹顶控制甚至图像分析。我们的作者 Tony Steidler-Dennison\
    \ 已在世界各地有人值守和自动化的地点设置了基于 Talon 的望远镜。\n\n## 特写\n\n- **38 使用 RCU 扩展 DCACHE**\n \
    \ 随着处理器数量的增加，Linux 要么会遇到性能瓶颈，要么可以探索新算法。\n  PAUL E. MCKENNEY, DIPANKAR SARMA AND\
    \ MANEESH SONI\n- **48 签名内核模块**\n  加密技术为设备驱动程序提供新的安全检查。\n  GREG KROAH-HARTMAN\n\
    - **54 使用 IOCTLS 控制硬件**\n  控制 UNIX 编程书籍中没有的小东西。\n  LISA CORSETTI\n- **58 理解缓存**\n\
    \  正确使用缓存，您的代码运行速度更快。\n  JAMES BOTTOMLEY\n\n## 嵌入式\n\n- **30 个人视频记录器基础**\n  创建一个按您的方式工作的自定义\
    \ PVR，甚至可以刻录存档副本。\n  CHRISTIAN A. HERZOG\n\n## 工具箱\n\n- **14 在 Forge 上**\n  使用\
