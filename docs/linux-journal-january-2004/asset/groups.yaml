    \n## 使用 cyradm 创建邮箱\n\n要创建邮箱，我可以使用 createmailbox 命令。或者我也可以使用 create 缩写，甚至是简单的\
    \ cm，如下所示：\n\n```\nlocalhost> cm user.bwooster\nlocalhost>\n```\n\n这是命令行效率的典范，但请注意，我们新邮箱对应的用户名并不是真的\
