    \ 启动时创建的初始框架有一系列图形特性，由变量 initial-frame-alist 定义。后续框架由 default-frame-alist 控制。请相同地使用这两个变量。每个变量都是子变量及其值的列表，很像\
    \ Perl 中的哈希。例如，要设置屏幕上第一个框架的初始位置，使用：\n\n```\n(setq initial-frame-alist\n  '((top\
    \ . 40) (left . -15)\n    (width . 96) (height . 40)\n    (background-color .\
    \ \"Gray94\")\n    (foreground-color . \"Black\")\n    (cursor-color     . \"\
    red3\")\n    (user-position t)\n  ))\n```\n\n此定义将 Emacs 初始框架设置在屏幕顶部 40 像素处，右侧\
    \ 15 像素处（因此 left 为负数），宽度为 96 个字符，高度为 40 行。它设置了默认的背景和前景文本颜色，然后设置光标颜色。\n\n如果你不喜欢默认字体，这里也是设置字体的地方。程序\
