    as possible. Second, run some extended disk self-tests and see if the problem
    is repeatable at the same LBA. If so, something probably is wrong with the disk.
    If the disk has failing SMART health status and is under warranty, the vendor
    usually will replace it. If the disk is failing its self-tests, many manufacturers
    provide specialized disk health programs, for example, Maxtor''s PowerMax or IBM''s
    Drive Fitness Test. Sometimes these programs actually can repair a disk by remapping
    bad sectors. Often, they report a special error code that can be used to get a
    replacement disk.


    This article has covered the basics of smartmontools. To learn more, read the
    man pages and Web page, and then write to the support mailing list if you need
    further help. Remember, smartmontools is no substitute for backing up your data.
    SMART cannot and does not predict all disk failures, but it often provides clues
    that something is amiss and has helped to keep many computing clusters operating
    reliably.


    Several developers are porting smartmontools to FreeBSD, Darwin and Solaris, and
    we recently have added extensions to allow smartmontools to monitor and control
    the ATA disks behind 3ware RAID controllers. If you would like to contribute to
    the development of smartmontools, write to the support mailing list. We especially
    are interested in information about the interpretation and meaning of vendor-specific
    SMART Attribute and raw values.


