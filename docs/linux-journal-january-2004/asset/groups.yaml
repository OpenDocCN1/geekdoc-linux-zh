    Markets get made in exactly two ways. The first is “find customer needs and satisfy
    them.” When a bunch of companies start doing that and competing to make the best
    products and services, you have a market. Reduced to a single phrase, Marketing
    101 teaches “Necessity is the mother of invention.” The second way is less obvious,
    but without it we wouldn’t have a single technology category. It goes like this:
    make something so new and cool that customers think they have to have it. They
    hardly teach this in marketing school, but if they did, the single-phrase version
    would be “Invention is the mother of necessity.”


    When people ask you how Apple can drive whole markets and establish new technology
    standards (hard-case floppies, SCSI, flat screens, USB, FireWire, GUIs, Wi-Fi
    and so on) over and over again, point them to that second marketing principle.
    Apple does a great job of inventing needs. It’s a skill that goes beyond simple
    innovation. Steve Jobs’ genius is not his obsession with art; that’s a real asset,
    but it’s also a red herring. His genius is knowing how invention can lever the
    world.


    Invention is not what Microsoft does. And it’s not what Linux does, either. Microsoft
    innovates, as they’ll tell you, over and over again—and they’re right. The company
    comes up with an endless series of modest but marketable improvements to goods
    largely invented elsewhere. Although Microsoft has an abundance of red herring
    assets (credit where due), its real genius may lie in the very hole where we currently
    find Linux in respect to laptops: in relationships with hardware OEMs. These relationships
    are highly muscular on Microsoft’s part and deeply involved. Look at any laptop
    today, and you see a little sticker that says “designed for Windows XP” or something
    similar, along with a Microsoft Windows logo. You can imagine the extent to which
    Microsoft labors, within its hardware OEM relationships, to make sure Linux has
    the hardest possible time running on laptops.


    And don’t discount the manufacturers’ shared interest in the same resistance.
    No tier-one hardware manufacturer wants to see the world filled with


    ## For display alone, laptops kick desktop butt.


    white box or build-it-yourself laptops. What makes each of their laptops unique
    may be the very thing that keeps Linux from running on every model across the
    board, from one manufacturer to another. But that’s not a problem. Not in the
    long run, which may not take very long at all.


    In the emerging laptop market ecology, three different forces: Apple the inventor,
    Microsoft the innovator and Linux the disrupter.


    In The Innovator’s Dilemma: When New Technologies Cause Great Companies to Fail,
    Clayton Christensen lays out the last two roles rather clearly. Innovators find
    it hard to disrupt themselves. They resist the inevitable, even as they see it
    coming. Incumbent innovators could be found in every one of the computing categories
    we checked at the start of this column. Linux disrupted all of them. The ones
    that embraced the disruption, starting with IBM, have made the most of innovation
    as well.


    Linux also will disrupt laptops and the remaining categories for the simple reason
    taught in Marketing 101: necessity will mother invention. One of these months,
    some company—a FedEx, a Boeing, a General Motors, a Siemens—will call on Dell,
    HP and IBM to compete for filling a gargantuan Linux laptop order. The relationship
    with Microsoft will be strained for the winner of the contest, but they’ll do
    the deal. They’ll lean on Intel to release the Linux device drivers for Centrino.
    They’ll work with Canon and Sony to get the device drivers written for the cameras,
    camcorders and scanners. They’ll finish hammering out the ACPI issues. And we’ll
    have good, cheap Linux laptops being marketed, with real advertising, by the big
    hardware OEMs.


    Then you can start checking off the rest of the list.


    Doc Searls is senior editor of Linux Journal.


