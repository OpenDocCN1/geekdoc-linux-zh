    Linux 未来的前沿，在这一领域工作的程序员们做出了令人惊叹的工作。只是因为当我们的客人到来时我们会品尝一点葡萄酒，我觉得另一种类型的可扩展性可能更合适。François，你为什么不注意听呢？


    啊，我们的客人到了！欢迎，mes amis，来到 Chez Marcel，这里有精致的 Linux 美食、 exceptional 葡萄酒和从零开始的设计。François
    和我正在讨论本期的主题。请坐；你们的桌子已经准备好了，我忠实的侍者会立即跑到地窖 immédiatement 去取酒。我想 2001 年的 Châteauneuf-du-Pape，带有丰富的果香、诱人的口感和复杂的香气，应该很不错。你可以在入口旁的阅读室南翼找到它。


