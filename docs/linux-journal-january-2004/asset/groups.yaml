    \n### 原始性能\nVXRack 可以轻松构建以提供几乎任何级别的容量和性能。单个配备 256 个 Xeon 处理器的 VXRack 可提供超过 1.5\
    \ Tflops（每秒万亿次浮点运算）的性能。\n\n### 灵活性\nVXRack 的一部分可以分配给不同的应用程序，允许多个独立作业高效并行运行，或合并以尽可能快地完成单个大型计算。\n\
    \n### 无与伦比的质量\nVXRack 利用 Intel 30 年设计和工程行业领先服务器组件的经验。Intel 花费 12,000+ 小时测试和验证服务器堆栈的每个部分。\n\
    \n立即致电 866-7VX-RACK 或 WWW.VXRACK.COM\n\n地址将被分别缓存，即使它们代表相同的数据。这称为缓存行别名问题。\n\n总体而言，VIVT\
    \ 缓存增加的查找速度超过了其缺点，使其成为非 x86 CPU 的主要缓存类型。\n\n设计用于克服 VIVT 缓存某些缺点而又不会牺牲太多速度优势的混合缓存类型是虚拟索引、物理标记（VIPT）缓存。索引在虚拟地址上，但标记在物理地址上，因此组合（标记、偏移）必须指定完整的物理地址。这一要求导致标记比其他缓存类型的标记更大。\n\
    \nVIPT 缓存相对于 PIPT 的速度优势在于地址转换和缓存查找现在可以并行进行。然而，CPU 在地址转换完成之前并不知道缓存行是否有效（标记匹配）。\n\
    \nVIVT 的缺点得以克服，因为标记是物理的，因此当 VIPT 缓存看到缓存中两个标记相同时会自动检测别名。因此，可以构建 VIPT 缓存，使缓存行别名永远不会发生。\n\
    \n这种第四种理论缓存类型，物理索引、虚拟标记（PIVT），基本上是无用的，不再进一步讨论。\n\n## 别名问题\n\n只要内核为同一物理页设置了多个虚拟映射，就可能发生缓存行别名。内核小心避免别名，因此它通常只在一种特定情况下发生：当用户\
    \ mmap 一个文件时。这里，内核在页缓存中有文件的页面的一个虚拟地址，而用户可能有一个或多个不同的虚拟地址。这是因为没有任何东西阻止用户在多个位置 mmap\
    \ 文件。\n\n当文件被 mmap 时，内核将其映射添加到 inode 的其中一个列表中：i_mmap，用于不能更改底层数据的映射，或 i_mmap_shared，用于可以更改文件数据的映射。使页的缓存别名同步的\
    \ API 是：\n\n```c\nvoid flush_dcache_page(struct page *page);\n```\n\n此 API 必须在每次内核更改页上的数据时调用，并且如果\
    \ page->mapping->i_mmap_shared 不为空，则在读取页数据之前应调用它。在特定于体系结构的代码中，flush_dcache_page\
    \ 遍历 i_mmap_shared 列表并刷新缓存数据。然后它遍历 i_mmap 列表并使其无效，从而使所有别名同步。\n\n## 分离的指令和数据缓存\n\
    \n在追求效率的过程中，处理器通常对执行的指令和操作的数据有单独的缓存。通常，这些缓存是独立的机制，数据写入可能不会被指令缓存看到。如果您试图执行刚刚写入内存的指令，例如在模块加载期间或使用\
    \ trampoline 时，这会造成问题。您必须使用以下 API：\n\n```c\nvoid\nflush_icache_range(unsigned\
    \ long start,\n                   unsigned long end);\n```\n\n以确保指令在执行前被指令缓存看到。start\
    \ 和 end 分别是您修改以包含指令的内存块的起始和结束地址。\n\n## 通用缓存刷新\n\n两个 API 全局刷新 CPU 缓存：\n\n```c\n\
    void flush_cache_all(void);\n```\n\nand\n\n```c\nvoid flush_cache_mm(struct mm_struct\
    \ *mm);\n```\n\n这些刷新系统中的所有缓存以及仅属于特定进程地址空间 mm 的缓存行。这两者都是极其昂贵的操作，应仅在绝对必要时使用。\n\n\
    ## SMP 环境中的缓存\n\n当系统中存在多个 CPU 时，通常存在每个 CPU 独有的缓存级别。根据体系结构，可能由内核负责确保一个 CPU 缓存中的更改对其他\
    \ CPU 可见。幸运的是，大多数 CPU 在硬件中处理这种一致性问题。即使没有，只要遵循本文列出的 API，您就可以在所有 CPU 之间保持一致性。\n\n\
    ## 结论\n\n我希望我已经简要概述了缓存的工作原理以及内核如何管理它们。本文的内容应该足以让您理解在您可能遇到的大多数内核编程情况下的缓存。请注意，然而，如果您深入到内核缓存管理的内部（特别是在特定于体系结构的代码中），您可能会遇到本文未讨论的概念和\
    \ API。\n\nJames Bottomley 是 SteelEye 的软件架构师。他维护 SCSI 子系统、Linux Voyager 端口和 53c700\
    \ 驱动程序。他还在 DMA/设备模型抽象领域为 PA-RISC Linux 开发做出了贡献。\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_63_0.png)\n\
    \n## 技术提示\n\n如果您刚刚将网站上的所有 GIF 图像转换为 PNG，但 HTML 仍引用原始 .gif 文件名，只需使用 Apache 的 mod_rewrite\
    \ 将访问者重定向到图像的新版本：\n\n```\nRewriteEngine on\nRewriteRule (.*)\\.gif $1.png [R]\n\
    ```\n"
