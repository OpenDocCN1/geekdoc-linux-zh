    ```\n\nNow that the SHA1 hash is computed and the place with the signed hash has\
    \ been found, all that is left to do is unencrypt the signed hash and compare\
    \ it to the calculated one. This step is done in the last line of this function:\n\
    \n```\nreturn rsa_check_sig(sig, &sha1_result[0]);\n```\n\nThe rsa_check_sig function\
    \ is located in the security/rsa/rsa.c file and uses the GnuPG code itself, which\
    \ was ported to run in the kernel to unencrypt the signature and compare the values.\
    \ The description of how this works is beyond the scope of this article.\n\n#\
    \ How the User-Space Code Works\n\nNow that we have seen how the kernel determines\
