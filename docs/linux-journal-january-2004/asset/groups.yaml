  mdcn: "\n## Appro 高性能服务器与集群解决方案\n\nAppro 基于 AMD Opteron™ 处理器的服务器可提升现有 Windows® 和\
    \ Linux 应用的性能。\n\n## 密度翻倍！\n\n## Appro HyperBlade 全集成集群解决方案\n\n### 新！\nMini-Cluster\n\
    \n### Appro BladeDome 远程服务器管理选项\n\n- 针对快速变化环境而设计的灵活、模块化且可扩展的架构\n- Blade 服务器可适配\
    \ Appro 全尺寸机柜（最多 80 节点）和 Appro 小型机柜（最多 17 节点），并可混合搭配集群构建模块\n- 每节点双 AMD Opteron™\
    \ 处理器\n- 每节点最高 16GB ECC DDR 内存\n- 每节点一个 PCI-X 插槽\n- 最多两个内置硬盘\n- 远程管理选项：\n  - 带内和带外控制\n\
    \  - GUI 与命令行界面\n- 高速互连选项：Myrinet、Dolphin、Quadrics 和 Infiniband\n\n## Appro 1U\
    \ 和 2U 服务器\n\n- 双 AMD Opteron™ 处理器\n- 设计用于在苛刻的机架条件下保持凉爽高效运行\n- 高质量、功能强大且经济实惠\n\
    - 提供全集成集群解决方案\n\n## Appro 4U - 四路服务器\n\n- 四 AMD Opteron™ 处理器\n- 内存容量和灵活性可支持广泛的应用\n\
    - 支持 16 个 DIMM 插槽最多 64GB\n- 支持最多 4 个 SCSI 驱动器\n- 3.5 英寸软盘驱动器和 slim CD-ROM\n\n\
    AMD Opteron™ 处理器 - 缩短运行时间周期并增加处理计算请求的带宽。\n- 在迁移到 64 位计算的同时运行 32 位应用程序，以保护长期投资。\n\
    \n链接器通常执行的其他任务。补丁修改了此函数并添加了以下代码行：\n\n```\nif (module_check_sig(hdr, sechdrs, secstrings))\
    \ {\n    err = -EPERM;\n    goto free_hdr;\n}\n```\n\n这个新函数 module_check_sig 执行所有模块签名检查逻辑。如果它返回错误，则会向用户返回错误\
    \ Improper Permission 并中止模块加载。如果函数返回 0，表示未发生错误，模块加载过程将成功继续。\n\nmodule_check_sig\
    \ 函数位于文件 kernel/module-sig.c 中。该函数首先要做的是检查模块内是否存在签名。这是通过以下代码行完成的：\n\n```\nsig_index\
    \ = 0;\nfor (i = 1; i < hdr->e_shnum; i++)\n    if (strcmp(secstrings+sechdrs[i].sh_name,\n\
    \        \"module_sig\") == 0) {\n        sig_index = i;\n        break;\n   \
    \ }\nif (sig_index <= 0)\n    return -EPERM;\n```\n\n这段代码遍历内核模块中的所有不同 ELF 部分并查找名为\
    \ module_sig 的部分。如果未找到签名，它将返回错误并阻止该模块加载。如果找到签名，函数将继续。\n\n一旦内核找到模块签名，它就需要确定所要求加载的模块的哈希值。为此，它会生成包含内核使用的可执行代码或数据的\
    \ ELF 部分的 SHA1 哈希。内核已包含生成 SHA1 哈希的代码（以及其他类型的哈希，包括 MD5 和 MD4），因此此步骤的大部分逻辑已存在。\n\
    \n该函数首先通过请求 SHA1 算法分配一个加密转换结构。然后它使用以下代码行初始化该结构：\n\n```\nsha1_tfm = crypto_alloc_tfm(\"\
    sha1\", 0);\nif (sha1_tfm == NULL)\n    return -ENOMEM;\ncrypto_digest_init(sha1_tfm);\n\
    ```\n\nsha1_tfm 变量用于创建我们想要的 ELF 文件特定部分的 SHA1 哈希，如以下代码所示：\n\n```\nfor (i = 1; i\
    \ < hdr->e_shnum; i++) {\n    name = secstrings+sechdrs[i].sh_name;\n\n    /*\
    \ we only care about sections with \"text\" or\n       \"data\" in their names\
    \ */\n    if ((strstr(name, \"text\") == NULL) &&\n        (strstr(name, \"data\"\
    ) == NULL))\n    continue;\n    /* avoid the \".rel.*\" sections too. */\n   \
    \ if (strstr(name, \".rel.\") != NULL)\n    continue;\n\n    temp = (void *)sechdrs[i].sh_addr;\n\
    \    size = sechdrs[i].sh_size;\n    do {\n        memset(&sg, 0x00, sizeof(*sg));\n\
    \        sg.page = virt_to_page(temp);\n        sg.offset = offset_in_page(temp);\n\
    \        sg.length = min(size,\n            (PAGE_SIZE - sg.offset));\n      \
    \  size -= sg.length;\n        temp += sg.length;\n        crypto_digest_update(sha1_tfm,\
    \ &sg, 1);\n    } while (size > 0);\n}\n```\n\n在此代码中，我们只关心名称中包含单词 text 或 data\
    \ 的 ELF 部分，但不包含字符 .rel 的部分。在所有部分被找到并输入 SHA1 算法后，SHA1 哈希会通过以下行放入变量 sha1_result\
    \ 中：\n\n```\ncrypto_digest_final(sha1_tfm, sha1_result);\ncrypto_free_tfm(sha1_tfm);\n\
    ```\n\n现在 SHA1 哈希已计算并且已找到包含签名哈希的位置，剩下的就是解密签名哈希并将其与计算出的哈希进行比较。此步骤在该函数的最后一行完成：\n\
    \n```\nreturn rsa_check_sig(sig, &sha1_result[0]);\n```\n\nrsa_check_sig 函数位于\
    \ security/rsa/rsa.c 文件中，并使用 GnuPG 代码本身，该代码已移植到内核中以解密签名并比较值。其工作原理的描述超出了本文的范围。\n\
    \n## 用户空间代码的工作原理\n\n现在我们已经了解内核如何确定模块是否已正确签名，那么我们如何首先将签名放入模块中呢？内核补丁中可以找到两个用户空间程序\
    \ extract_pkey 和 mod，以及一个小型脚本 sign（位于 security/rsa/userspace/ 目录中）。这两个程序可以通过运行该目录中的\
    \ Makefile 构建。extract_pkey 程序用于将公钥放入内核，而 mod 程序由 sign 脚本用于签名内核模块。\n\n为了签名模块，必须生成\
    \ RSA 签名密钥，这可以使用 gnupg 程序完成。要生成 RSA 签名密钥，请将 --gen-key 选项传递给 gpg：\n\n```\n$ gpg\
    \ --gen-key\ngpg (GnuPG) 1.2.1; Copyright (C) 2002 Free Software Foundation, Inc.\n\
    This program comes with ABSOLUTELY NO WARRANTY.\nThis is free software, and you\
    \ are welcome to redistribute it\nunder certain conditions. See the file COPYING\
    \ for details.\n\nPlease select what kind of key you want:\n  (1) DSA and ElGamal\
    \ (default)\n  (2) DSA (sign only)\n  (5) RSA (sign only)\nYour selection?\n```\n\
    \n我们想要创建一个 RSA 密钥，因此选择选项 5，然后选择默认密钥大小 1024：\n\n```\nYour selection? 5\nWhat keysize\
    \ do you want? (1024)\nRequested key size is 1024 bits\n```\n\n继续回答其余问题，最终你的 RSA\
    \ 密钥将被生成。但为了使用此密钥，我们必须创建它的加密版本。为此，再次运行 gpg 并编辑你刚刚创建的密钥（在下面的文本中，我将我的密钥命名为 testkey）：\n\
    \n```\n$ gpg --edit-key testkey\ngpg (GnuPG) 1.2.1; Copyright (C) 2002 Free Software\
    \ Foundation, Inc.\nThis program comes with ABSOLUTELY NO WARRANTY.\nThis is free\
    \ software, and you are welcome to redistribute it\nunder certain conditions.\
