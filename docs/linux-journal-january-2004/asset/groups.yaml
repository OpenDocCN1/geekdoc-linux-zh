    Tab 键（或点击鼠标）会选择一个原子，然后你通过按下光标键使其运动。一旦运动起来，原子会一直移动，直到撞到障碍物，要么是墙壁，要么是另一个原子。这样，你就从简洁中创造出复杂性。这也是消磨你空闲时间的绝佳方式。


    正如简单的代码被用来构建越来越复杂的程序一样，我们也可以从分子过渡到可见的结构。今晚菜单上的下一道菜有点难以解释，我必须承认我第一次看到它时有些怀疑。它叫做
