    \ configured to poll an attached GPS at regular intervals, adjusting the system\
    \ time to account for internal clock drift.\n\nThe xephem program, launched from\
    \ the command line with xephem, provides a granular view of the current sky. Data\
    \ on each object is provided in a right-click pop-up screen. The user also can\
    \ point the telescope using this pop-up, a feature used extensively for calibration.\
    \ Magnification can be increased, effectively looking deeper and deeper into the\
    \ sky. As an alternative to zooming, the user may select a minimum magnitude (apparent\
    \ brightness) threshold. This allows brighter stars to be filtered in the ephemeris\
    \ view, leaving only the dimmer objects in the window. The sky view also may be\
    \ rotated, and object type filtering is provided. For example, globular clusters\
    \ can be selected, eliminating the view of all other object types.\n\n## Configuration\n\
    \nConfiguration files are critical to the operation of Talon. They provide the\
    \ means by which the software communicates with both the user and the hardware\
    \ installed in the telescope. In the Linux tradition, these files are simple text\
    \ files, commented heavily for the clarification of the user. The configuration\
    \ files for all elements of Talon can be found in /usr/local/telescope/archive/config.\
    \ Using the default tcsh shell, the simple command cd config moves the user into\
    \ the configuration directory.\n\nThe operation of the telescope can be viewed\
    \ as two discrete elements, each of which is addressed by a specific configuration\
    \ file type. First, the internal motion control boards must communicate with the\
    \ motors and encoders. Configuration files intended to serve this function utilize\
    \ a .cmc extension. I've always viewed this extension as delineating files that\
    \ configure motion controllers, cmc for short. The .cmc files establish the operating\
    \ parameters for the controller boards, which, in turn, send signals to and receive\
    \ feedback from the encoders and electromechanical components. The other element\
    \ of telescope operation is the interface between the user and the software. In\
    \ simple terms, all user-controlled operations utilize configuration files with\
    \ a more traditional .cfg extension. Whereas the .cmc files operate behind the\
    \ scenes to communicate directly with the hardware, the user interface must communicate\
    \ with the .cfg files.\n\n## Critical Configuration Files\n\nAlthough every configuration\
    \ file plays a role in the operation of Talon, some in both the .cmc class and\
    \ the .cfg class bear special attention. These .cmc files include:\n\n- basic.cmc:\
    \ establishes the basic communication between the motion control boards and the\
    \ motors driving the telescope axes.\n- find.cmc: establishes the routines for\
    \ finding objects based on encoder counts.\n- nodeDec.cmc: establishes the hardware\
    \ parameters for the Dec axis of the telescope.\n- nodeRA.cmc: establishes the\
    \ hardware parameters for the RA axis of the telescope.\n- nodeFocus.cmc: establishes\
    \ the hardware parameters for the telescope focus control.\n\nThe .cfg files are:\n\
    \n- boot.cfg: allows the user to script Talon startup routines. These may include\
    \ starting GPS monitoring, weather station monitoring and opening the Talon main\
    \ interface when the computer boots.\n- home.cfg: provides an initial set of constants\
    \ to allow the telescope to find the home position of each encoder. These constants\
    \ represent a spatial sense for the telescope prior to working through the initial\
    \ calibration routines. Once these routines are completed, the actual encoder\
    \ counts and axis travel are updated automatically.\n\n## Expand! $125\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_72_0.png)\n\
    \n## RouterBOARD 24\n\nFour ethernet ports in one card that work as separate interfaces.\
    \ Supported by all OSs!\n\n## Combine! $195\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_72_1.png)\n\
    \n## RouterBOARD 230\n\nA super small integrated motherboard with various interfaces\
    \ and 266 MHz CPU. Use as a CPE or an AP on a tower with 500ft of PoE (802.3af),\
    \ or anything else you can imagine! Many cases and accessories available. IDE/CF,\
    \ PCMCIA, miniPCI, PCI, USB.\n\n## route! $45\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_72_2.png)\n\
    \n## MikroTik.com RouterOS\n\nA router operating system that has every possible\
    \ feature a router could need - works with regular pc's and routerboards!\n\n\
    ## more!\n\nFour-port miniPCI to PCI $95\nOne-port miniPCI to PCI $33\nv.35 synchronous\
    \ miniPCI $550\nand much more on ...\n\n## RouterBOARD.com\n\nsales@routerboard.com\n\
    \n## telsched is the element of Talon that makes robotic unattended observing\
    \ sessions possible.\n\n- telescoped.cfg: provides constants regarding the telescope\
    \ axes, establishes the position of physical travel limit switches in relation\
    \ to the encoders and establishes the maximum rotational velocity of each axis\
    \ as well as the rotational acceleration rates.\n\n## Critical Configuration Settings\n\
    \nThe settings in each of the individual .cmc and .cfg files utilize a naming\
    \ convention that makes their function easily recognizable, but some critical\
    \ settings within these files deserve special attention. These settings can be\
    \ modified with any familiar text editor:\n\n- boot.cfg: establishes the overall\
    \ parameters of the Talon software at boot.\n- setTelUser: creates the telescope\
    \ user, the telescope user group and sets the appropriate permissions. By default,\
    \ the initial telescope user and group are named talon. This can be changed for\
    \ subsequent use by modifying the setTelUser constant in boot.cfg, provided the\
    \ new user and group already exist on the system.\n- setTelDaemons: initializes\
    \ the telescope daemon (telescoped), camera daemon (camerad), weather station\
    \ daemon (wxd) and global positioning system daemon (gpsd).\n\n- home.cfg: provides\
    \ the following four constants for encoder counts, home position, limit switches\
    \ and rotational velocity and acceleration:\n  - HSTEP: the number of encoder\
    \ counts in the full rotation of the HA axis encoder.\n  - DSTEP: the number of\
    \ encoder counts in the full rotation of the Dec axis encoder.\n  - HSIGN: the\
    \ physical location of the HA encoder on the telescope. When viewed from the north,\
    \ the HA encoder will increment clockwise if placed at the back of the polar shaft\
    \ (the shaft upon which the telescope moves from east to west) or decrement when\
    \ placed at the front. Another way to view this is, if the marked encoder surface\
    \ points to the south in the final telescope configuration, it will increment\
    \ when rotating clockwise. If it points to the north, the encoder will decrement\
    \ with clockwise rotation. This configuration is a simple constant: 1 if the encoder\
    \ increments, -1 if it decrements.\n  - DSIGN: the physical location of the Dec\
    \ encoder on the telescope. Much like the HA encoder, the increment/decrement\
    \ of the encoder varies depending on the method used to mount the encoder. If\
    \ the encoder is installed with the encoded surface toward the outside of the\
    \ fork, it decrements when rotated clockwise, or toward the north. This requires\
    \ a setting of 1. If the encoder is mounted with the encoded surface to the inside\
    \ of the fork, it increments when rotated clockwise. This requires a setting of\
    \ -1.\n\n- telescoped.cfg: provides the following constants for initial operation:\n\
    - HAXIS: the telescope network node from which the HA axis is controlled.\n- DAXIS:\
    \ the telescope network node from which the Dec axis is controlled.\n- HESTEP:\
    \ the raw encoder counts per revolution for the HA axis.\n- DESTEP: the raw encoder\
    \ counts per revolution for the Dec axis.\n- HMAXVEL: the maximum slewing velocity\
    \ of the HA axis.\n- DMAXVEL: the maximum slewing velocity of the Dec axis.\n\
    - HMAXACC: the maximum slewing acceleration of the HA axis.\n- DMAXACC: the maximum\
    \ slewing acceleration of the Dec axis.\n\n## Using Talon\n\nPutting Talon to\
