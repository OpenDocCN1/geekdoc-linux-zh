  - "[PAGE 53]\n\nNow that we have a key, we can use it to sign a kernel module.\n\
    \nTo sign a module, use the sign script, which is a simple shell script:\n\n```\n\
    #!/bin/bash\nmodule=$1\nkey=$2\n\n# strip out only the sections that we care about\n\
    ./mod $module $module.out\n\n# sha1 the sections\nsha1sum $module.out | awk \"\
    {print \\$1}\" > \\\n$module.sha1\n\n# encrypt the sections\ngpg --no-greeting\
    \ -e -o - -r $key $module.sha1 > \\\n$module.crypt\n\n# add the encrypted data\
    \ to the module\nobjcopy --add-section module_sig=$module.crypt \\\n$module\n\n\
    # remove the temporary files\nrm $module.out $module.sha1 $module.crypt\n```\n\
    \nThe first thing the script does is run the program mod on the kernel module.\
    \ This program strips out only the sections that we care about in the ELF file\
    \ and outputs them to a temporary file. The mod program is described in more detail\
    \ later.\n\nAfter we have an ELF file that contains only the sections we want,\
    \ we generate a SHA1 hash of the file using the sha1sum program. This SHA1 hash\
    \ then is encrypted using GPG, the key is passed to it and this encrypted file\
    \ is written out to a temporary file. The encrypted file is added to the original\
    \ module as a new ELF section with the name module-sig. This is done with the\
    \ program objcopy. And that is it. Using common programs already present on a\
    \ Linux machine, it is easy to create a SHA1 hash, encrypt it and add it to an\
    \ ELF file.\n\nThe mod program also is quite simple. It takes advantage of the\
    \ fact that the libbfd library knows how to handle ELF files and manipulates them\
    \ in different ways; it is based on the binutils program objdump. Because the\
    \ libbfd library handles all of the heavy ELF logic, the mod program simply can\
    \ iterate through all the sections of the ELF file it wants to with the following\
    \ code:\n\n```\nfor (section = abfd->sections;\n    section != NULL;\n    section\
    \ = section->next) {\n    if (section->flags & SEC_HAS_CONTENTS) {\n        if\
    \ (bfd_section_size(abfd, section) == 0)\n            continue;\n\n        /*\
    \ we only care about sections with \"text\"\n           or \"data\" in their names\
    \ */\n        name = section->name;\n\n```\n\n```\nif ((strstr(name, \"text\"\
    ) == NULL) &&\n    (strstr(name, \"data\") == NULL))\n    continue;\n\nsize =\
    \ bfd_section_size(abfd, section));\ndata = (bfd_byte *)malloc(size);\n\nbfd_get_section_contents(abfd,\
    \ section,\n                    (PTR)data,\n                    0, size);\n\n\
    stop_offset = size / opb;\n\nfor (addr_offset = 0;\n    addr_offset < stop_offset;\n\
    \    ++addr_offset) {\n    fprintf(out, \"%c\", data[addr_offset]);\n}\n    free(data);\n\
    }\n}\n```\n\nNow that we can sign a kernel module and the kernel knows how to\
    \ detect this signature, the only remaining piece is to put our public key into\
    \ the kernel so it can decrypt the signature successfully. A lot of discussion\
    \ on the linux-kernel mailing list recently has centered on how to handle keys\
    \ within the kernel properly. That discussion has produced some good proposals\
    \ for how this aspect will be handled in the 2.7 kernel series. But for now, we\
    \ do not worry about properly handling keys in flexible ways, so we compile it\
    \ in directly.\n\nFirst we need to get a copy of our public key. To do this, tell\
    \ GPG to extract the key to a file called public_key:\n\n```\n$ gpg --export -o\
    \ public_key\n```\n\nTo help manipulate GPG public keys, some developers at Ericsson\
    \ created a simple program called extract_pkey to help dissect the keys into their\
    \ different pieces. I have modified that program to generate C code for the public\
    \ key.\n\nRun the extract_pkey program and point it at the public_key file you\
    \ generated previously. Have it send the output to a file called rsa_key.c:\n\n\
    ```\n$ extract_pkey public_key > rsa_key.c\n```\n\nAfter this step is finished,\
    \ move that rsa_key.c on top of the file in the security/rsa/ directory, replacing\
    \ my public key with yours:\n\n```\n$ mv rsa_key.c ~/linux/linux-2.6/security/rsa/\n\
    ```\n\nNow you have generated a public and private RSA key pair and placed your\
    \ public key into the kernel directory. Build the patched kernel, making sure\
    \ to select the Module signature checking option, and then install it. If you\
    \ boot in to this kernel, you will be allowed to load only the modules you have\
    \ signed with your key, so be careful and test this only on a development machine."
  - '[PAGE 54]


    # What Is Left to Do?


    As shown in this article, a number of different steps are required to generate
    a key, sign a kernel module and place the public key into the kernel image. This
    still is a rough development project. In order to make it more acceptable to the
    kernel developers and to the Linux community in general, these steps need to be
    automated, making it easier to sign all kernel modules and handle the public key.


    Besides the obvious need to simplify the use of this feature, some other future
    goals of this project include:


    +   Move the RSA code into the generic crypto framework, allowing other kernel
    features to use it.


    +   Allow more than one public key to be present in the kernel, letting multiple
    sources of signed kernel modules run in a single machine.


    +   Simplify the signing logic to allow GPG’s native signing functionality or
    possibly the functionality provided in the bsign program to be used, instead of
    the custom mod program.


    # Acknowledgements


    I would like to thank the developers at Ericsson, who have created a kernel patch
    and program called digsig, for allowing me to use their port of GPG to the kernel.
    I previously had done this, but the implementation was horrible; thankfully, they
    released their port and were very helpful. The digsig kernel patch allows users
    to sign programs and prevents the kernel from running any program not signed.
    More information about this project can be found at sourceforge.net/projects/dise
    c.


    I also would like to thank my employer, IBM, for allowing me to work on this project,
    and Don Marti, for prodding me to finish it and write this article.


    Greg Kroah-Hartman currently is the Linux kernel maintainer for a variety of different
    driver subsystems. He works for IBM, doing Linux kernel-related things, and can
    be reached at greg@kroah.com.


