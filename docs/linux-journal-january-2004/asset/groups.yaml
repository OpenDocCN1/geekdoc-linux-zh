    ![](img/3e9d313887e2c1cabeb5043769cbf08f_81_0.png)


    8位 VGA Linux DPS 软件的实际截图。与 ACD 显示相比，只有全棕色的天气不同。蓝色的历史轨迹看起来相似，绿色信标和雷达图像相同。菜单对地图透明，但对天气不透明。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_81_1.png)


    一名真实的控制器正在观看一个 ACD。


    消息层组，是维护系统通信、线程和文件 I/O 的组。基本上，我的测试都无法在桌面上进行，我必须使用目标硬件。最初，这是一个侧面项目，旨在看看是否可行，我被提供了一台旧的（200MHz
    Pentium）PC 用于开发目的。


    大部分代码编译都很顺利，尽管在 POSIX 标准方面存在一些问题。LynxOS 2.4 和 3.0 使用的是较旧的标准，而 Linux 使用的是当前标准。我最初在
    Red Hat 7.0 上进行开发，内核为 2.2，它不支持命名信号量或命名共享内存段。在我们这样的分布式系统中，使用处理器内的标准名称比使用其他通信机制来确定共享内存和信号量所在位置更容易。我拼凑了一个命名共享内存兼容层，并且我在俄罗斯的一个网站上找到了一个命名信号量兼容层。


    开发期间我转到了 Red Hat 7.1，据说它支持命名共享内存，但 glibc 与头文件之间存在不兼容。我能够查看源代码找到这个问题，并向内核邮件列表发布了说明。有人抢在我前面。不过，为了保持原样，允许任何人使用任何版本的
    Red Hat 而无需此修复，我将我拼凑的版本保留在代码中。


    目标硬件全部是大端（Motorola 68K 和 PPC），而 Linux PC 是 x86 小端，因此我需要进行一些字节交换才能使整个系统工作。许多文件以二进制（地图、适配等）格式存储。网络层已内置字节交换机制，并且效果很好。


    一旦我将所有消息代码编译并运行，我就需要一个应用程序。FAA 同意资助 TP、CP、SMC 和 DPS 系统的进一步开发，用于桌面测试和调试。系统移植得都很好，但
    DPS 在 X 显示方面存在一些问题。通常，大型 2048×2048 像素显示器在具有两个或三个伪彩色物理平面的专用硬件上运行。如果地图和菜单绘制在底部平面，天气绘制在另一个平面，飞机绘制在顶部平面，则飞机移动时整个显示器无需重绘。为了使平面概念发挥作用，颜色映射被分为三部分。伪彩色（8
    位）限制了每个平面的颜色数。地图和菜单平面获得一种颜色（白色），天气获得另一种颜色（棕色），主显示平面获得 78 种颜色。


    因此，我们需要进行更多的颜色表调整，因为通常主显示使用 250 种颜色。大型显示器具有模拟矢量显示器上衰减荧光粉的动画淡出历史轨迹。动画工作需要 128 个颜色单元。对于此应用程序，我制作了一个单元且没有动画。看起来惊人地好。在找到相似的红色、相似的绿色，以及黄色、蓝色、白色和灰色之间，我将表精简到可用的
    78 个。


    一旦完成所有这些，我被提供了一块双平面视频卡，以查看系统是否仍能工作。更改一个编译时标志后，整个系统就能工作。双平面卡将天气地图和菜单放在同一平面上。


    大约在这个时候发生了两件事。我向 FAA 交付了 Linux 代码，并且另外几名开发人员被指派在目标 PowerPC 硬件上使 Linux 工作。FAA 发现了一些我没有跟上的基线代码中的更新，我们能够就此合作。其他开发人员发现我的大多数
    #ifdefs 特定于 Linux 而非机器架构。因此，我能够将我的更改保留给 FAA，并在 FAA 最终接手时做出正确的 #ifdefs。


    PowerPC Linux 项目旨在改进 SMC 处理的数据记录任务。当前系统使用消费级现成光盘，不适合 24/7 写入。新系统采用 SAN 磁盘，更适合空中交通管制需求。虽然在技术上是成功的，但该项目目前已暂停。


    2003 年春季，FAA 开始在 Linux 上的 Common ARTS 用于一个非关键子系统，即一个廉价的网关系统，将 ARTS 数据馈送到其他系统。完整的认证可能最终会发生。


    Tom Brusehaver 是一名代码苦工，自 PC 之前就开始编写代码。如今他主要从事合同工作，偏爱嵌入式系统。他已婚，有成年的孩子，两只猫和一只狗。天气好的时候他在建造飞机。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_81_2.png)


    ## BOOK REVIEW

    ### Red Hat Linux 9 Bible

    by Christopher Negus


    John Wiley & Sons, 2003

    ISBN: 0-7645-3938-8

    $49.99 US


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_82_0.png)


    页数超过 1,000 页，称这本书为圣经并不夸张。浏览其页面，我很快意识到它分为三个部分，第一部分面向用户，第二部分面向系统管理员，第三部分面向网络。该书附带三张
    CD 用于安装 Red Hat Linux 9。


    我在这种书中首先寻找的是解释 Red Hat 9 新内容的章节。书中在第 12 页解释了所有内容，“虽然你看不到它，但原生 POSIX 线程库是 Red Hat
    Linux 9 最重要的新增功能（也是发布版被称为 9 而不是 8.1 的主要原因）。”谢谢。该书还详细说明了 Red Hat 9 中已升级、已删除或即将被淘汰的组件。


    第 2 章值得深入阅读，尤其是对 Linux 新手而言，以便在进行任务之前对概念有一个基础。第 3–9 章涵盖桌面、基本命令以及如何运行应用程序。这些章节帮助那些面对新计算环境时感到有些迷茫的用户。


    本书中重要的章节——涉及系统和网络管理——缺少了大多数 Linux 系统管理书籍似乎都缺少的信息：关于故障排除和收集系统信息的信息。


    第 13 章“备份和恢复文件”内容全面，我尤其喜欢对 mirrordir 的讨论。本章最好的地方是讨论了许多解决方案，读者可以从多个选项中选择。我也喜欢 pax、dump
    和 Amanda 的快速参考图表。这不是唯一包含这些图表的章节；它们在整本书中被大量使用，非常方便。


    网络服务很容易成为另一本书的主题，它们占据了本书的三分之一以上。第 15 章讨论设置局域网，并包含有关无线网络的信息，对我来说这使其及时且有用。我会称之为方便的参考，值得考虑并保留，尤其是对
    Linux 新手而言。


    > — FRANK CONLEY


