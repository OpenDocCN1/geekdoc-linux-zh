    ## 同步


    当无法重放它时，为什么还要费心记录除设备事件之外的数据呢？Xnee 使用这些其他数据进行同步，这就是事情变得复杂的地方。想象一下在使用 Galeon 或其他任何
    Web 浏览器时记录会话。记录时，一切顺利，网络正常运行。但在重放 Galeon 会话时，您无法访问互联网。如果没有同步，Xnee 可能会重放用户事件，例如在网页上点击链接。如果
    Galeon 无法加载页面，在网络恢复并且页面可以加载之前继续重放是没有用的。


    记录其他数据时，我们可以将其用于同步会话。例如，如果我们记录显示 Galeon 窗口中网页时发送的数据，我们可以在重放时等待发送相同的数据。这确保了在继续重放后续事件之前网页已加载。在本示例中，我们跳过了记录时发送的大量
    X 协议数据以保持简单（参见表 1）。重放此简单会话时，Xnee 使用相同的事件（参见表 2）。


    ## 要同步的内容


    虽然需要同步，但找到用于同步的正确数据可能很困难。Xnee 通过插件文件解决了这个问题，这些文件指定了应为一系列应用程序记录的内容。这些插件以它们旨在测试的应用程序命名。如果您想测试自己编写的浏览器，使用
    Galeon 插件是个好主意。然而，有时没有插件适合您的程序，您需要找到正确的协议数据进行同步。以下示例希望能让您在未来更容易操作。我们选择 gnumeric
    作为需要找到正确选项的程序。首先，启动 gnumeric。然后在终端模拟器中使用以下选项启动 Xnee：


    ```

    xnee --delivered-event-range \

    EnterNotify-MappingNotify --human-printout \

    --loops 1000

    ```


    这会生成大量无用的事件填满屏幕，因此停止 Xnee。通过在设置范围时排除它们来过滤掉这些无用事件：


    ```

    xnee --delivered-event-range \

    EnterNotify-KeymapNotify,VisibilityNotify- \

    MappingNotify --human-printout --loops -1

    ```


    这看起来更好。现在，使用以下选项使用 Xnee 开始记录会话：


    ```

    xnee --delivered-event-range \

    EnterNotify-KeymapNotify, \

    VisibilityNotify-CirculateRequest, \

    SelectionClear-MappingNotify --loops \

    1000 --out session1.xnr

    ```


    在 gnumeric 电子表格中输入一些内容并使用菜单插入今天的日期或其他输入。完成后，转到终端并按 Ctrl-C 停止记录。现在是重放会话的时候了。将 gnumeric
    设置为记录时的相同状态。这样启动 Xnee 的重放模式：


    ```

    xnee --replay -f session1.xnr

    ```


    重放会话时 Xnee 有时会暂停。如果协议数据发送的顺序与记录时不同，就会发生这种情况。Xnee 会暂停执行一段时间，以便等待服务器发送预期数据（从文件中读取）。最终，超时过期，Xnee
    尝试继续。如果 Xnee 无法在记录的数据流量和重放时发送的数据流量之间同步，它将退出。


    Xnee 支持通过插件提供记录选项。当您找到应用程序的设置后，将其保存到插件文件中。插件文件的语法与命令行选项类似。创建新插件最简单的方法是复制旧插件，填入您的设置，然后重命名为合适的名称。Xnee
    附带了针对不同客户端的插件。如果您想向 Xnee 发送应用程序的插件文件，请这样做。Xnee 主页上有如何贡献的说明。


    如果您有一个为用户反馈创建窗口的程序，您必须确保这些窗口在同一位置弹出。Xnee 记录所有设备事件，其坐标参考根窗口，而不是创建的窗口。


    为了便于记录，请制作脚本以使用特定目的的正确设置启动 Xnee。您可以将启动器添加到面板或将菜单项添加到窗口管理器菜单。


    ## 看见未来 · 塑造未来


    第 3 届年度

    O''REILLY

    新兴技术大会™

    2004 年 2 月 9–12 日

    加州圣地亚哥 Westin Horton Plaza


    节省高达 $430！· 2004 年 1 月 9 日前注册

