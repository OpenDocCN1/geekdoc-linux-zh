    familiar, Usermin. I also downloaded Webmin for the purpose of configuring Usermin
    and installed them both. After installation, I logged in to Webmin and configured
    Usermin with the Usermin Configuration module. Because only user bell should be
    able to use Usermin, I used the Allowed Users and Groups module and selected “Only
    allow listed users”; bell, was of course, the only user I added to the list. Next,
    I used Available Modules to restrict all but the Scheduled Cron Jobs module. Last
    but not least, I went into the User Interface module and clicked Yes for the Go
    direct to module if user has only one option. Now bell is the only user that can
    log in using Usermin, and when user bell does log in, Usermin jumps straight to
    displaying Scheduled Cron Jobs. I also turned on mandatory SSL encryption. Webmin
    wasn’t needed for anything else, so I stopped it with service webmin stop. To
    make sure it does not start back up on a reboot, I entered chkconfig webmin off.


    Now we can log in to Usermin as the user bell and easily schedule the times at
    which the bells should ring and how long they should last by using the command
    /usr/bin/ar-2 /dev/ttyS0 2 2. Employees can feel comfortable knowing the bell
    always lets them know when to start running. Management can rest easy knowing
    they have yet another tool to help keep things running smoothly, and I can rest
    easy knowing that it’s running on Linux, which means I don’t have to worry about
    constantly babying it.


    # Further Possibilities


    This was a simple exercise that illustrated the use of controlling devices using
    a relay over a serial interface. The low-cost relay used in this example is capable
    of controlling any number of electrical devices. Also available are relay boards
    that can be expanded to up to 128 relays per serial port, not to mention analog
    and digital input cards.


    Jason Ellison is from Fairhope, Alabama, and currently is a network analyst for
    Delphi. He also maintains several Linux and AIX systems at Delphi.


