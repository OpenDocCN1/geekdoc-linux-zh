    Running `make install` installs the program in `/usr/local/games`. In that directory,
    you may find two versions of the program, one called `construo.x11` and the other
    called `construo.glut`. On the SuSE 8.2 notebook where I tested *Construo*, I
    found the graphics to be sharper and the text cleaner when using the X11 version
    (Figure 2).


    When the program starts for the first time, you are presented with a clean slate.
    At the top of the program window, you see some keyboard shortcuts. To the right
    and left are control buttons. If you abandon a design halfway when you quit, *Construo*
    returns you to that design the next time you play. If, like François, the idea
    of starting clean intimidates you, click the Load button and navigate to the Examples
    directory. There, you are rewarded with a number of prebuilt structures you can
    modify until you feel more confident to create from scratch.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_21_0.png)


    Figure 2. *Construo* makes designing improbable structures fun.


    To add a dot, left-click on the screen, move to where you want the opposite point
    (or joint) to reside and left-click again. To remove a dot, right-click. At some
    point, you should feel you’ve created something reasonably stable. Click the Run
    button to set the laws of physics into motion, and watch how your structure behaves
    under stress. In all likelihood, your first creation will bend, twist, topple
    and eventually collapse—which can be a lot of fun. *Construo* lets you set objects
    in motion (check out the basketball demo), put barriers in the way (colliders)
    and otherwise release your creative genius.


    To modify and strengthen your now—demolished creation, click Undo and your whatever-it-is
    (or was) returns to its former glory. When you get bored with creating and are
    ready to start anew, press C to clear the scene, and you once again begin your
    mechanical ascent to new heights.


    Building things on solid ground is interesting enough, but try building them in
    a 3-D, zero gravity, virtual world. That’s the idea behind one of the strangest
