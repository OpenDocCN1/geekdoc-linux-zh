    # diff -u: What’s New in Kernel Development


    Intel has come out with some event notification patches that provide profiling
    hooks at process termination, in addition to the already existing hooks provided
    at process creation. Intel’s work should be useful for enhancing such profiling
    tools as Oprofile, Perfmon and VTune. Although adding hooks like these potentially
    can provide a way for proprietary software vendors to bypass the GPL licensing
    restrictions, it does not appear that Intel’s work suffers from that problem.
    Frederic Rossi also has been working on his own unrelated event notification code,
    called asynchronous event mechanism (AEM). AEM allows general-purpose user-space
    applications to register for system events by providing their own sets of event
    handlers [LJ, July 2003]. The main goal for this is to be able to pass data quickly
    from the kernel back to user space. Although Intel and AEM’s work are not directly
    related, they reveal an interesting trend in Linux development toward greater
    and greater communication between the layers of the system.


    The DSI Development team has produced a standalone module, called digsig, that
    checks the embedded digital signature of an executable program before running
    it. If the file has been modified, digsig prevents its invocation. A wide variety
    of applications could make use of this—for everything from worm protection to
    digital rights management. Unlike Trusted Computing’s attestation feature, digsig’s
    verification process remains under the control of the machine owner. It is not
    possible, for example, for remote systems to rely on the digsig module on your
    system to verify that your computer is running particular versions of particular
    software that those remote systems have approved.


    Apparently, all AMD Athlon processors suffer from a bug that can cause prefetch
    instructions to receive memory management faults for certain addresses under certain
    conditions. This is similar to the infamous f00f Pentium bug, in that both are
    bugs within the hardware itself that the OS simply must work around. The good
    news is that, in most cases, the bug doesn’t do any actual harm. Triggering the
    bug is rare, which may account for why it’s gone undetected for so long. Andi
    Kleen has been working on a Linux workaround for 2.4 and 2.6, and the AMD folks
    have affirmed that his workaround will be forward-compatible with future Athlons
    that have the bug corrected in hardware. However, according to Andi, some Athlons,
    including the K7, may never be fixed, and so his workaround may be needed on new
    systems for quite a long time.


    SGI has released a GPLed driver for its Altix serial con-


    sole, but in the copyright notice, SGI explicitly reserves the rights to any patents
    used in that code. Although the Free Software Foundation has confirmed to SGI
    that this is not technically a violation of the GPL, it could result in a situation
    in which code from a GPLed project (like the kernel) would not be allowed to be
    used in other GPLed projects. The question then becomes, should the code be allowed
    into the kernel under those conditions? Alan Cox has decided to investigate the
    situation with both SGI and the FSF to confirm that the FSF really doesn’t consider
    it a violation of the GPL and to see if SGI is willing to modify its position.


    Chris Rivera and Robert Love have released the slabtop standalone utility, a tool
    to monitor the allocation and freeing of memory in the cache. The kernel maintains
    a cache of allocated memory that it disburses to processes as needed. But sometimes
    this memory needs to be freed, and the slab is the way that such freeing is accomplished.
    The slabtop tool monitors each slab cache, presenting data for that slab in real
    time, and it also concurrently updates a set of global statistics on all slab
    activity on the system.


    Matthew Wilcox has begun separating kernel headers into two categories, those
    that should be visible to user-space sources and those that shouldn’t. It’s always
    a problem when a user application comes to rely on the wrong kernel headers. As
    the kernel grows and changes, the headers may change as well, and the user software
    may break. To recover from this, a strict separation must be maintained. Matthew’s
    work helps make this easier. He also managed to inspire other folks, such as Erik
    Andersen, to start cleaning up some type naming conventions, in preparation for
    2.6.


    A new division of kernel code has been initiated, similar to the arch/ directory.
    But instead of dividing code on an architecture-by-architecture basis, the new
    division works on a compiler-by-compiler basis. Ever since Intel’s ecc compiler
    became the second compiler (after GCC) that could build the Linux kernel successfully,
    subtle conflicts have crept in, causing developers to start submitting patches
    specifically to handle particularities of one compiler or the other. After some
    recent debate over support for in-line assembly, which GCC supports but ecc does
    not, Linus Torvalds decided to create per-compiler directories to house all patches
    relating to particular compilers. Sam Ravnborg and David Mosberger apparently
    have decided to lead that effort, and they already have submitted patches to initiate
    the transition.


    —ZACK BROWN


    # They Said It


    It is very very hard to find people who don’t flame and are calm and rational—and
    have good taste. I mean it’s like…give me one honest man. It doesn’t happen…too
    much. And at the same time, when it happens, it matters a lot. Just a few of these
    people make a huge difference.


    > —LINUS TORVALDS, ALSO FROM HIS TALK ON THE LINUX LUNACY GEEK CRUISE


    In the early days, Linux was under the wire without the chief information officer’s
    (CIO) knowledge. It was the technical decision for things such as a file and print
    server, with cost or reliability as the driver. Now we have CIO adoption.


    > —ADAM JOLLANS, IBM WORLDWIDE LINUX SOFTWARE MARKETING STRATEGY MANAGER (www.vnunet.com/News/1144291)


    A slide rule is a precision instrument. A good one will last a long time, in fact,
    for a lifetime unless you abuse it. You’ve got to look ahead for 10, 20, 30 or
    even 40 years if you want to be sure you are getting your money’s worth.


    > —“HOW TO CHOOSE A SLIDE RULE” BY DON HEROLD (1940 KEUFFEL & ESSER CO. BROCHURE
    POSTED ON mccoys-kecatalogs.com)'
