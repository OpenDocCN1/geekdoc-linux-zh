  md: "\n## POSTFIX AND LDAP\n### Configuring Postfix to Deliver to Cyrus IMAP\n\n\
    the special string a11, which is short for all permissions. To delete the user.bwooster\
    \ mailbox, it would have been sufficient simply to specify c, for create or delete\
    \ mailbox or submailboxes. Other possible ACL permissions are listed in Table\
    \ 1.\n\nACLs are covered in detail in the cyradm(1) man page and are explained\
    \ in Cyrus IMAP's HTML documentation. I highly recommend that you get into the\
    \ habit of at least reviewing, if not always customizing, the ACLs on each mailbox\
    \ you create with cyradm. On some sites, it may not be necessary for users to\
    \ retain the default permission c. If all user submailboxes (user.whatever.sent,\
    \ user.whatever.saved and so on) are created for them by you, for example, you\
    \ may prefer that they not have the ability to create new ones or delete them\
    \ accidentally.\n\nIn Part I, I described the role of mail delivery agents (MDAs)\
    \ as delivering mail to mailboxes. Being an MDA, Cyrus IMAP can deliver mail,\
    \ but it first must receive that mail from a message transfer agent (MTA). The\
    \ most popular MTA is Sendmail, but a simpler and more secure option is Wietse\
    \ Venema's excellent Postfix (www.postfix.org). As Postfix is my MTA of choice,\
    \ and because it's available either as the default MTA or as an option in most\
    \ major Linux distributions nowadays, it's the one I explain in detail here.\n\
    \nDoes your IMAP server need to reside on your organization's SMTP relay? It can,\
    \ but it doesn't have to. It may make more sense from the standpoints of security\
    \ and performance to keep your SMTP relay dedicated to that purpose. You then\
    \ can have your IMAP server run its own instance of Postfix that receives mail\
    \ from the dedicated SMTP relay rather than directly from other networks' MTAs.\
    \ In either case, we assume the MTA from which IMAP receives its mail is running\
    \ on the same host as Cyrus IMAP.\n\nThree files need to be edited in order to\
    \ configure Postfix to transfer mail to Cyrus. The first file is /etc/postfix/main.cf,\
    \ in which we need to add or uncomment this line:\n\n```\nmailbox_transport =\
    \ cyrus\n```\n\nThe second file we need to edit is /etc/postfix/master.cf, in\
    \ which we need to add or uncomment these two lines:\n\n```\ncyrus unix - n n\
    \ - - pipe\nuser=cyrus argv=/usr/libexec/cyrus/deliver -r ${sender} ${user}\n\
    ```\n\nActually, the second line may differ on your system; the syntax of Cyrus'\
    \ deliver program has changed over the years. If you installed both Cyrus IMAP\
    \ and Postfix from your Linux distribution's current CDs or download site, the\
    \ included /etc/postfix/master.cf file should work without tweaking. If you installed\
    \ either Cyrus IMAP or Postfix from source code, however, you may need to do some\
    \ tweaking and Googling to get the second line exactly right. One key piece of\
    \ the second line is the path in argv=/usr/libexec/cyrus/deliver, which must point\
    \ to your local system's Cyrus deliver command.\n\nThe third and final Postfix\
    \ file to edit is /etc/aliases; you may keep yours in /etc/postfix/aliases. Unless\
    \ you're using LDAP for alias lookups—a process too involved for this article,\
    \ but which I describe in the Sidebar—you need to have at least one entry in aliases\
    \ for each Cyrus mailbox, plus any aliases to those mailboxes you need.\n\nIn\
    \ this article I describe how to use LDAP to authenticate Cyrus IMAP users, but\
    \ I cover Postfix only so far as pointing Postfix mail delivery at Cyrus. In fact,\
    \ Postfix also has LDAP functionality: it can use LDAP to resolve e-mail aliases\
    \ to mailbox names.\n\nThat is, you can configure Postfix to check both its local\
    \ /etc/postfix/aliases database for e-mail-alias-to-mailbox-name mappings and\
    \ also to query the local LDAP service or a remote one. This can save considerable\
    \ administration time; rather than maintaining separate alias and user databases,\
    \ you can do it all in LDAP.\n\nHowever, Postfix on Red Hat 7.3 (and possibly\
    \ on later versions) doesn't have LDAP support compiled in. To determine whether\
    \ your version of your distribution of choice has LDAP support compiled in its\
    \ Postfix package, use the command postfix -m. If LDAP isn't listed among the\
    \ supported Postfix modules, you need to uninstall your Postfix package and build\
    \ it yourself from source.\n\nSee www.postfix.org for more information and for\
    \ Postfix source code. Be sure to read the instructions in ./READMES/LDAP_README\
    \ in the Postfix source code, which explains how to compile in Postfix's LDAP\
    \ functionality—the default Postfix Makefile does not do so automatically. Be\
    \ sure also to read the file /etc/postfix/samples/sample-ldap.cf, which contains\
    \ the parameters you need to add and configure in /etc/postfix/main.cf to get\
    \ LDAP alias lookups working. The latter step is extremely important, and it may\
    \ take some tinkering to get it working properly.\n\n> If you forego all this\
    \ and choose instead to maintain Postfix's aliases file separately (the old-fashioned\
    \ way), then don't worry; using or not using LDAP with Postfix has no ramifications\
    \ whatsoever on Postfix's ability to interact with your LDAP-authenticated Cyrus\
    \ IMAP software.\n\nFor our example user Bubba, /etc/aliases needs the line:\n\
    \n```\nbubba: bubba\n```\n\nSimple enough, right? We omit the user. prefix; Cyrus\
    \ mailboxes are referred to by user name. If your Cyrus (LDAP) user names correspond\
    \ to local system user names, you don't need aliases entries for those users.\
    \ But part of Cyrus' attraction lies in its not requiring users to have shell\
    \ accounts.\n\nIf Bubba is our organization's marketing analyst, we also can add\
    \ the line:\n\n```\nmarketing_weasel: bubba\n```\n\nAfter you edit your aliases\
    \ file, don't forget to use the postalias command to generate a new alias database:\n\
    \n```\nbash-$ postalias hash:/etc/aliases\n```\n\n## CUSTOMIZE YOUR DATABASE SERVER\
