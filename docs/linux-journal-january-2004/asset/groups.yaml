  - '[PAGE 37]


    # Laptopia


    Will your next laptop “just work” with Linux? And when will you be able to buy
    a major-label laptop without a proprietary OS anyway? BY DOC SEARLS


    Let’s do a check-box progress report on Linux World Domination of computer hardware
    types. We’ll run down the scale, starting at the top:


    +   - Mainframes

    - Big enterprise database machines

    - Big compute farms

    - Symmetrical multiprocessing machines

    - Small- and medium-sized business machines

    - Engineering workstations

    - Desktops

    - Laptops

    - Notebooks

    - PDAs

    - Embedded devices


    Looks pretty good. At the high end, gains will increase as the 2.6 kernel begins
    to establish itself. At the low end, the contest is all but over. Ken Nelson,
    President and CEO of CACMedia (cacmedia.tv) and a veteran of the consumer electronics
    business, tells me Linux “owns the embedded category”. Even Microsoft is a distant
    also-ran.


    The standout exceptions are desktops, laptops, notebooks and PDAs. And of those
    four, the one that matters is laptops. That’s where the center of gravity in personal
    computing is moving today. In the last year, “Desktop Replacement” became a leading
    laptop category as well as a description of what’s happening to the marketplace.
    Thanks to desktop-grade functionality and the growth of wireless networking, Wi-Fi-enabled
    laptops are doing to desktops what cell phones did to desk phones. As a result,
    desktops are turning into cubicware at work, while at home they are morphing into
    forms that are sure to displace TV as the central household entertainment appliance.


    Meanwhile, laptops are getting more fully functional every day. For under $2,000
    US you can get a high-speed laptop with


    a 1600 × 1200 display, a gigabyte of RAM, 80+GB of storage, a good sound system,
    a first-rate graphics subsystem and a drive for burning as well as playing both
    CDs and DVDs. For display alone, laptops kick desktop butt. As one hardware company
    executive put it, “You want a two megapixel display—get a big-screen laptop. It’s
    priced in the same range as a standalone display.”


    Linux isn’t pushing these developments; Apple and Microsoft are. With all due
    respect to the innovations involved (credit where due: there are many, especially
    on Apple’s part), the leverage comes from relationships between manufacturing
    companies. Thanks to design agreements between laptop makers and the sources of
    graphics subsystems, namely NVIDIA and ATI, new Mac OS X and Windows laptops can
    play a DVD with minimal CPU involvement. Linux doesn’t have that privilege—yet.


    Linus explained the situation in the long talk he gave on the Linux Lunacy Geek
    Cruise in September 2003:


    > > Quite honestly, none of the laptop vendors support Linux at all, really. To
    be real. Some of them go through a certain amount of motions. They support Linux
    in certain configurations if it’s not too painful. But the amount of support tends
    to be okay (to a limited degree). It may not be suspended. It may not actually
    do half of the things you want a laptop to do. But you can run Linux on it. I
    expect that to change as companies start to use Linux more on the desktop. If
    you have a few big companies that just say, “Hey, Linux has to work on our laptops”,
    suddenly hardware manufacturers will start caring a whole lot more....


    So, the good news is laptops are moving away from the embedded machine kind of
    thing. They are getting so standardized. Especially with chipsets like Centrino.
    If you use the Pentium-M and you don’t use Centrino, you are doing stuff wrong—except
    for the fact that they don’t support (802.11) A&G; and right now you can’t get
    Centrino drivers for Linux....


    I’ve also heard that they exist, but other people at Intel say “That’s crap. We
    have it on the road map, but we haven’t been able to get it going.” They have
    been promising them for 2004, but I am not an Intel spokesman by any stretch.
    So I don’t know what the actual date is. But it is supposed to come.


    The thing is, when you built a laptop, you used to have to scrounge around people’s
    backyards to find strange pieces of hardware just to make it all fit. And that
    is definitely going away. And that’s not just Centrino. Instead of having hundreds
    of different chipsets that you wire up a million different ways, you’re going
    to have maybe five different chipsets, and you can’t wire them up any way other
    than the way they are wired up. And that’s just going to happen.


    This is what we had on the desktop ten years ago. Compaq made their own PC desktops
    that weren’t quite standard. Actually HP was worse. And that just went away because
    of standard chipsets. And it’s starting to happen in laptop space now. So, a year
    from now, I’d expect...assuming we can fight those ACPI issues...it’s much more
    likely that when you buy a laptop it will just work.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_37_0.png)'
