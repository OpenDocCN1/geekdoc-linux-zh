    # Mondo and Mindi Tips


    Thanks for the article about restoring with Mondo and Mindi in the October 2003
    issue. It was good, but it could have included a couple more options, in my opinion.
    Option -g gives a nice graphical interface to the restoration process. Option
    -l GRUB -f /dev/xxx ensures that if one uses the GRUB loader, it will be integrated
    nicely. Option -k FAILSAFE adds compliance with Debian/GNU. I believe this last
    one is important for Debian users.


    --

    Jose Marrero


    # NEC Source Code?


    I was very interested in your article about NEC''s fault-tolerant server [LJ,
    October 2003]. I''m an IT consultant here in Buenos Aires, Argentina with some
    exposure to fault-tolerant and mission-critical applications. I contacted Mr John
    Fitzsimmons (of Aspire Communications) four or five months ago in order to help
    me get the source code for NEC''s FT Linux. As I understand it, the software must
    be released under the GPL, but as of today I wasn''t able to get the software.
    So, it was great to know from your article that "...NEC told us they are firmly
    committed to releasing all changes to the public under GPL." I think I will have
    to wait just a little longer. Do you have an approximate date for that release?


    One other point, as the article stated, "At the time of this writing, NEC was
    reviewing and documenting its kernel changes for a planned public release, perhaps
    through OSDL''s Carrier Grade Linux Project...", could you tell me what I should
    do to get the release from OSDL? Will it be available to the general public or
    to OSDL members only?


    --

    Pablo J. Rogina, IT Consultant


    > *Dan Wilder replies: I am not aware of any such release to date. I am copying
