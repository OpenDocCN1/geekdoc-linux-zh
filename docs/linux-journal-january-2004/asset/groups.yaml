  - "[PAGE 92]\n\n# Intermediate\nEmacs\nHacking\n\nTurn Emacs into your editor of\
    \ choice with this easy customization tool. BY CHARLES CURLEY\n\nCustomizing Emacs\
    \ is important to get the most out of it. You can change the way it operates to\
    \ reflect your way of doing things, which in turn makes you more efficient. Just\
    \ as custom-built boots fit better than factory boots, a customized Emacs fits\
    \ you better than standard, off-the-shelf Emacs.\n\nEmacs changes can be session-specific\
    \ or permanent. You can customize Emacs directly by executing commands in the\
    \ mini-buffer or by modifying variables using the set-variable command. These\
    \ changes are volatile, meaning you lose them when you end your session. To make\
    \ permanent changes, you can create or modify an init file. Emacs examines several\
    \ init files when it loads. Probably the easiest way to customize is to edit .emacs,\
    \ stored in your home directory. Before loading your .emacs file, Emacs loads\
    \ default.el from your library path. Emacs also looks in its load path for site-start.el,\
    \ which system administrators may use to provide site-wide customization. Alternatively,\
    \ you can make permanent Emacs changes through the Customize menu (Options→Customize\
    \ Emacs in version 21.1 and up). This gives you a GUI-based front end for modifying\
    \ your .emacs file.\n\n# Using Customize\n\nLike most GUI front ends, Customize\
    \ is not as powerful as hacking the text configuration file, but it is easier\
    \ to use. Fire up the Customization group, and you notice that Emacs builds the\
    \ menus on the fly. That way it’s always up to date (Figure 1).\n\nTo navigate\
    \ Customize’s tree structure, either point to a button and press Return or click\
    \ on the button. Full Emacs searching also works in the Customize buffers. Each\
    \ level in the tree is represented in a buffer, and you can manipulate Customize\
    \ buffers as usual. For example, when you are done with a level, kill the buffer.\
    \ I’d like to turn on the PHP speedbar whenever I enter PHP mode, for example,\
    \ when I visit a PHP file. To do this, I follow the menu tree to PHP mode customization\
    \ (Figure 2). As you can see, I’ve toggled the state but haven’t yet saved my\
    \ changes. I can set it only for this session, or I can save the change for future\
    \ sessions. When I do the latter, Emacs edits my .emacs file. You can verify the\
    \ change by searching for the variable name in .emacs.\n\nIf you aren’t sure of\
    \ the name of a variable or where to find it in Customize’s vast tree, you can\
    \ use regular expression searches on variable names and their contents. If you\
    \ want to change how Emacs prints, you could search on the regex\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_92_0.png)\n\
    \nFigure 1. The Top-Level Customization Menu\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_92_1.png)\n\
    \nFigure 2. Setting the Speedbar to Turn On in PHP Mode\n\n“print” and Emacs would\
    \ build a custom Customize menu for you. See the menu under Options→Customize\
    \ Emacs for these and other options.\n\n# Editing Your .emacs File\n\nYou also\
    \ can modify Emacs’ behavior by editing ~/.emacs directly. This is a good way\
    \ to add function and insert bulk customizations you may learn about from other\
    \ people. For example, C mode can be modified by setting variables that affect\
    \ how it operates.\n\nMany modes are customized on a per-buffer basis. This means\
    \ you write a short function that sets the variables and set that function to\
    \ be executed whenever Emacs enters the mode. The outline of it is:\n\n```\n(defun\
    \ rays_c_mode ()\n  \"ray’s c/c++ mode hook\"\n  (message \"Loading Ray’s C mode...\"\
    )\n  ...\n  (message \"Loading Ray’s C mode... Done\")\n)\n(add-hook `c-mode-common-hook\
    \ `rays_c_mode)\n```\n\nThe Lisp function defun defines a function, in this case\
    \ rays_C_mode. The function takes no parameters; it prints out messages only for\
    \ the user’s benefit. The last line adds the function rays_c_mode to C mode’s\
    \ mode hook, that is, a list of functions"
  - "[PAGE 93]\n\nexecuted whenever Emacs enters C mode. You can see more of Ray’s\
    \ C mode in my personal .emacs file (see Resources).\n\nIt is customary to name\
    \ the variables for a particular mode by prepending the mode’s name to them. To\
    \ see variables associated with a particular mode, then, make a regex search on\
    \ the variable name, with M-X apropos-variable. For C mode, we eliminate a lot\
    \ of false hits with the regex \"^c-\". When Emacs returns a list of the results,\
    \ move to that buffer and press Return on any variable that interests you for\
    \ more information.\n\nTo find out what else you can search on, try M-X apropos-command\
    \ RET apropos RET. \"apropos-zippy\"? I’ll let you examine that one.\n\nA function\
    \ can, of course, call other functions. This possibility is one of several things\
    \ that make editing your .emacs file and programming in Emacs Lisp more powerful\
    \ than using Customize.\n\n# Printing\n\nEmacs, as usual, offers you a lot of\
    \ flexibility for printing. You can print by sending the raw contents of the buffer\
    \ to the printer. This is quick and easy, but it may not give you exactly what\
    \ you wanted. You have far more control over PostScript printing, so that may\
    \ be the way to go. For one thing, font-locked (colorized) buffers print in color\
    \ on color printers and in grayscale on monochrome printers, where Ghostscript\
    \ supports those features.\n\nProbably the most common change to Emacs in the\
    \ printing area is changing the name of Emacs’ default printer. This can be nil,\
    \ which tells Emacs to use the default printer, lp in Linux or UNIX. Or, it can\
    \ be a printer name such that the lp daemon recognizes it as a printer name. If\
    \ you have Red Hat’s printtool or similar, you can get printer names from it.\
    \ Failing that, look in /var/spool/lpd/ for the names of your printers. Emacs\
    \ can use any printer for which you can define a local queue, including remote\
    \ printers.\n\nTwo variables are set to indicate the printer, one for PostScript\
    \ printing and one for non-PostScript printing. The code below shows how I set\
    \ up Emacs under Linux and Windows. The Windows definition uses a remote printer\
    \ on the computer charlesc. Setting both printers to the same computer works only\
    \ because the server is a Linux box. The printcap detects PostScript and runs\
    \ it through Ghostscript before printing it:\n\n```\n;; Begin setup for printing\
    \ on win32\n(if (and (>= sams-Gnu-Emacs-p 20)\n        (memq window-system '(win32\
    \ w32)))\n  (progn (setq printer-name \"//charlesc/lp\")\n         (setq ps-printer-name\
    \ \"//charlesc/lp\"))\n)\n;; End setup for printing on win32\n\n;; Begin setup\
    \ for printing on Linux\n(if (and (>= sams-Gnu-Emacs-p 20)\n        (string-equal\
    \ system-name\n                      \"charlesc.localdomain\"))\n  (progn (setq\
    \ printer-name \"lp\")\n         (setq ps-printer-name \"lp\"))\n)\n;; End setup\
    \ for printing on Linux\n```\n\nEmacs’ PostScript printing is very powerful. By\
    \ default, it\n\nprints a gray box at the top of each page with the buffer’s name,\
    \ the data, a page number and a count.\n\nYou can set a text string and other\
    \ characterestics of a watermark on each page or on selected pages. For example,\
    \ a watermark of Preliminary or Draft is a good idea for code reviews; see the\
    \ variable ps-print-background-text. You also can use an EPS image, such as a\
    \ picture of Tux or the Free Software Foundation’s GNU logo, for a watermark.\n\
    \nWe geriatric cases who don’t like 8.5 point type can change the value of ps-font-size.\
    \ The value contans two numbers, the first for landscape and the second for portrait\
    \ printing. Whether to print landscape or portrait is controlled by the variable\
    \ ps-landscape-mode.\n\nYou can modify the default PostScript header and add a\
    \ footer as well. For two-sided printing, you may specify left and right headers\
    \ and footers. And if you want to save trees, look at ps-n-up-printing. It lets\
    \ you print multiple pages on a sheet of paper.\n\n# Font Selection\n\nEmacs supports\
    \ multiple frames or windows. You can launch another frame with Ctrl-X 5 2, or\
    \ remove one with Ctrl-X 5 0. The initial frame created when Emacs is launched\
    \ has a number of graphics characteristics defined by the variable initial-frame-alist.\
    \ Subsequent frames are governed by default-frame-alist. Use these two variables\
    \ identically. Each variable is a list of sub-variables and their values, rather\
    \ like a hash in Perl. For example, to set the initial position of the first frame\
    \ on the screen, use:\n\n```\n(setq initial-frame-alist\n  '((top . 40) (left\
    \ . -15)\n    (width . 96) (height . 40)\n    (background-color . \"Gray94\")\n\
    \    (foreground-color . \"Black\")\n    (cursor-color     . \"red3\")\n    (user-position\
    \ t)\n  ))\n```\n\nThis definition sets the Emacs initial frame 40 pixels from\
    \ the top of the screen, 15 pixels from the right (hence the negative number for\
    \ left), with a width of 96 characters and a height of 40 lines. It sets the default\
    \ background and foreground text colors and then sets the cursor color.\n\nThis\
    \ definition is also where you set your font, if you don’t like the default. The\
    \ program xfontsel comes with XFree86, and you can use it to find a suitable font\
    \ (Figure 3). Press Select as an option, and xfontsel puts it into the clipboard.\
    \ Add another pair of parentheses to the definition of initial-frame-alist, insert\
    \ the phrase font . and insert a pair of quote marks. Then recover the font definition\
    \ between the quotes with Ctrl-Y, like any other clipboard entry:\n\n```\n(font\
    \ . \"-adobe-courier-*-r-*-*--140-*-*--*--*-\")\n```\n\nIf you are wondering how\
    \ I get the colors in my screenshots, that’s how I do it.\n\nIf you have problems\
    \ with these settings, look in your .Xresources file for any Emacs settings. Any\
    \ settings in .Xresources overrides these definitions. To get rid of the over-"
