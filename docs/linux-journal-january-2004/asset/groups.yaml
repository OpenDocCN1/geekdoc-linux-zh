    \ ps-printer-name \"//charlesc/lp\"))\n)\n;; End setup for printing on win32\n\
    \n;; Begin setup for printing on Linux\n(if (and (>= sams-Gnu-Emacs-p 20)\n  \
    \      (string-equal system-name\n                      \"charlesc.localdomain\"\
    ))\n  (progn (setq printer-name \"lp\")\n         (setq ps-printer-name \"lp\"\
    ))\n)\n;; End setup for printing on Linux\n```\n\nEmacs 的 PostScript 打印功能非常强大。默认情况下，它在每页顶部打印一个灰色框，其中包含缓冲区的名称、日期、页码和计数。\n\
    \n你可以为每页或选定页设置水印的文本字符串和其他特性。例如，在代码审查中使用 Preliminary 或 Draft 水印是个好主意；请参阅变量 ps-print-background-text。你也可以使用\
    \ EPS 图像作为水印，例如 Tux 的图片或自由软件基金会的 GNU 标志。\n\n我们这些不喜欢 8.5 磅字体的老家伙可以更改 ps-font-size\
    \ 的值。该值包含两个数字，第一个用于横向打印，第二个用于纵向打印。是否横向或纵向打印由变量 ps-landscape-mode 控制。\n\n你也可以修改默认的\
    \ PostScript 页眉并添加页脚。对于双面打印，你可以指定左右页眉和页脚。如果你想节约纸张，请查看 ps-n-up-printing。它允许你在单张纸上打印多页。\n\
