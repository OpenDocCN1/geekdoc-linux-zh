  - "[PAGE 85]\n\nprogram to control both relays on the AR-2 (Listing 1). The program\
    \ is compiled with the following command:\n\n```\n[root@pluto ar-2]# gcc -o ar-2\
    \ ar-2.c\n\n[root@pluto ar-2]# ./ar-2\nUsage: ar-2 <device> <bits-to-set> <hold-time>\n\
    ```\n\n# Listing 1. ar-2.c\n\n```\n#include <sys/types.h>\n#include <sys/ioctl.h>\n\
    #include <fcntl.h>\n#include <errno.h>\n#include <stdlib.h>\n#include <unistd.h>\n\
    #include <stdio.h>\n#include <signal.h>\n/* Main program. */\nint main(int argc,\
    \ char **argv)\n{\n    int fd;\n    int sleep_time;\n    /* These TIOCM_* parameters\
    \ are defined in\n     * <linux/termios.h>, which\n     *  is indirectly included\
    \ here.\n     */\n    int dtr_bit = TIOCM_DTR;\n    int rts_bit = TIOCM_RTS;\n\
    \    int set_bits;\n    int flags;\n    int status, oldstat = -1;\n    int count\
    \ = 0;\n    int pc;\n    if (argc < 3) {\n        fprintf(stderr, \"Usage: ar-2\
    \ <device> \"\n            \"<bits-to-set> <hold-time>\\n\");\n        exit(1);\n\
    \    }\n    /* Open monitor device. */\n    if ((fd = open(argv[1], O_RDWR | O_NDELAY))\
    \ < 0) {\n        fprintf(stderr, \"ar-2: %s: %s\\n\",\n            argv[1], sys_errlist[errno]);\n\
    \        exit(1);\n    }\n    /* Get the bits to set from the command line. */\n\
    \    sscanf(argv[2], \"%d\", &set_bits);\n    /* Get delay time from command line.\
    \ */\n    sscanf(argv[3], \"%d\", &sleep_time);\n    ioctl(fd, TIOCMSET, &set_bits);\n\
    \    sleep(sleep_time);\n    close(fd);\n}\n```\n\nThe program compiled with no\
    \ errors, and better yet, it ran with no errors. Using the program is pretty straightforward,\
    \ but let's briefly discuss it. AR-2 requires three parameters: device, bits-to-set\
    \ and hold-time. Device refers to the special character device that addresses\
    \ the serial device to which the AR-2 is\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_85_0.png)\n\
    \nFigure 2. Connections to the AR-2 Board\n\nattached. For example, if the device\
    \ is attached to COM1, the device would be /dev/ttyS0. Bits-to-set is a little\
    \ more complicated. It is a decimal number that must be converted to binary to\
    \ be understood. Bit 2 controls RTS or relay one, and bit 3 controls DTR or relay\
    \ two. So the decimal number 4, which in binary is 100, has the first bit set\
    \ to zero, the second bit set to zero and the third bit set to one. Therefore,\
    \ if the bit-to-set parameter is the decimal number 4, the DTR line would be placed\
    \ high and the RTS line would remain low. The last parameter, Hold-time, simply\
    \ is the number of seconds the modem control lines should be held in the state\
    \ requested by the bits-to-set parameter.\n\nI applied power to the AR-2 board\
    \ and connected it to the serial port to test that the program worked as I had\
    \ hoped. With the AR-2 connected to ttyS0 (COM1), I attempted to energize the\
    \ first relay by placing RTS high by setting bit 2 with the command ./ar-2 /dev/ttyS0\
    \ 2 5. The program successfully placed RTS high for five seconds. After the program\
    \ exited, it placed the RTS line in its original low state, de-energizing the\
    \ relay. Next, I placed DTR high by setting bit 4 using the command ./ar-2 /dev/ttyS0\
    \ 4 5. Both RTS and DTR could be placed high by setting bits 4 and 2 at the same\
    \ time, using the decimal number 6 for the bits-to-set parameter. The LEDs on\
    \ the board are helpful in determining that both the AR-2 program and AR-2 board\
    \ are operational.\n\nThanks to upscheck.c and its authors, I was able to place\
    \ both the RTS and DTR control lines in a low or high state for a specified amount\
    \ time. Without the source code listed"
