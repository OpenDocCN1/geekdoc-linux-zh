    \n## 配置\n\n配置文件对 Talon 的运行至关重要。它们提供了软件与用户以及安装在望远镜中的硬件通信的手段。遵循 Linux 传统，这些文件是简单的文本文件，为用户澄清而大量注释。Talon\
