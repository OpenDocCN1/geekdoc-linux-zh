    pub 1024R/77540AE9 created: 2003-10-09 expires: never trust: u/u\n(1). testkey\n\
    \nCommand>\n```\n\n我们想要添加一个新密钥，因此在提示符下输入 addkey：\n\n```\nCommand> addkey\nPlease\
    \ select what kind of key you want:\n  (2) DSA (sign only)\n  (3) ElGamal (encrypt\
    \ only)\n  (5) RSA (sign only)\n  (6) RSA (encrypt only)\nYour selection?\n```\n\
