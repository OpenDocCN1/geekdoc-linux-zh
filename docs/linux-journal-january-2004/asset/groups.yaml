    update values of the Attributes that are not updated automatically under normal
    disk operation (see the UPDATED column in Listing 3). Some disks support automatic
    off-line testing, enabled by smartctl -o on, which automatically runs an off-line
    test every few hours.


    The SMART standard provides a mechanism for running disk self-tests and for monitoring
    aspects of disk performance. Its main shortcoming is that it doesn’t provide a
    direct mechanism for informing the OS or user if problems are found. In fact,
    because disk SMART status frequently is not monitored, many disk problems go undetected
    until they lead to catastrophic failure. Of course, you can monitor disks on a
    regular basis using the smartctl utility, as I’ve described, but this is a nuisance.


    The remaining part of the smartmontools package is the smartd daemon that does
    regular monitoring for you. It monitors the disk’s SMART data for signs of problems.
    It can be configured to send e-mail to users or system administrators or to run
    arbitrary scripts if problems are detected. By default, when smartd is started,
    it registers the system’s disks. It then checks their status every 30 minutes
    for failing Attributes, failing health status or increased numbers of ATA errors
    or failed self-tests and logs this information with SYSLOG in /var/log/messages
    by default.


    You can control and fine-tune the behavior of smartd using the configuration file
    /etc/smartd.conf. This file is read when smartd starts up, before it forks into
    the background. Each line contains Directives pertaining to a different disk.
    The configuration file on our computing cluster nodes look like this:


    ```

    # /etc/smartd.conf config file

    /dev/hda -s on -o on -a -I 194 -m sense@phys.uwm.edu

    /dev/hdc -s on -o on -a -I 194 -m sense@phys.uwm.edu

    ```


    The first column indicates the device to be monitored. The -o on Directive enables
    the automatic off-line testing, and the -s on Directive enables automatic Attribute
    autosave. The -m Directive is followed by an e-mail address to which warning messages
    are sent, and the -a Directive instructs smartd to monitor all SMART features
    of the disk. In this configuration, smartd logs changes in all normalized attribute
    values. The -I 194 Directive means ignore changes in Attribute #194, because disk
    temperatures change often, and it’s annoying to have such changes logged on a
    regular basis.


    Normally smartd is started by the normal UNIX init mechanism. For example, on
    Red Hat distributions, /etc/rc.d/init.d/smartd start and /etc/rc.d/init.d/smartd
    stop can be used to start and stop the daemon.


    Further information about the smartd and its config file can be found in the man
    page (man smartd), and summaries can be found with the commands smartd -D and
    smartd -h. For example, the -M test Directive sends a test e-mail warning message
    to confirm that warning e-mail messages are delivered correctly. Other Directives
    provide additional flexibility, such as monitoring changes in raw Attribute values.


    What should you do if a disk shows signs of problems? What if a disk self-test
    fails or the disk’s SMART health status fails? Start by getting your data off
    the disk and on to another system as soon'
