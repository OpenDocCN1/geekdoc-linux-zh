    # Linux, Talon and Astronomy


    A new open-source application lets professional and amateur astronomers explore
    space from their desktops. BY TONY STEIDLER-DENNISON


    We’ve been fascinated by astronomy since the ancient Chinese first charted the
    skies. The computerization of astronomy, some would argue, is its greatest leap
    forward yet. Today, unattended robotic telescopes scan skies that have been charted
    over centuries, recording their findings in modern databases. CCD cameras capture
    images impossible to define on film. It’s an exciting time to be an astronomer,
    whether amateur or professional.


    The revolution in astronomy doesn’t stop at the hardware. Research-grade telescopes
    in observatories from Spain to Korea are under the control of open-source software
    and Linux-based computers. Under the open-source model, scientists are free to
    modify the control software, creating a trickle-down effect that benefits amateurs.
    Open source and Linux even have changed the scientific method. With source code
    freely available, peer review now occurs not only on the data, but on the data
    gathering methods as well.


    At the forefront of this open-source astronomy revolution is Talon. Talon was
    originally developed by Ellwood Downey as the Observatory Control and Astronomical
    Analysis Software (OCAAS). In 2001, the software was purchased by Torus Technologies
    of Iowa City, Iowa. In late 2002, Torus was purchased by Optical Mechanics, Inc.,
    and the updated OCAAS package was released as Talon under the GPL.


    During the past two years, I’ve had the daily pleasure of working with Talon.
    I’ve installed and configured the software on multiple telescope packages, and
    I’ve followed these telescopes to destinations around the world for installation
    and on-site configuration. It’s my pleasure to share with you some of the broad
    points of Talon installation, configuration and use.


    Talon can be downloaded at observatory.sourceforge.net. The software interacts
    with integrated motion control boards, available from Optical Mechanics, Inc.
    (Optical Mechanics Motion Controllers) or Oregon Microsystems (PC39 Motion Controllers).
    Object acquisition and tracking, scheduled operations, environmental monitoring,
    dome control, image analysis and processing all fall under the control of Talon.
    Networked operations also are possible using a remote X session.


    # Using Talon


    The Talon package contains a full installation script; install.sh


    creates a talon user, compiles the binaries and creates a set of text configuration
    files for initial operation of the telescope.


    Talon contains a full compliment of astronomy applications designed specifically
    for use as a suite of tools. The main Talon interface utilizes the Motif toolset,
    producing a familiar and unified look and feel throughout the application set.
    Although the toolset is rich, the following four tools should be of use to most
    observers.


    xobs is the main Talon control window and is launched with the terminal command
    startTel. It contains all the monitoring and calibration tools necessary for operation.
    This window provides manual control of the telescope and any attached peripherals,
    such as a filter wheel or dome control. It also provides a constant display of
    the current position of the telescope, as calculated by feedback from the motor
    encoders. This feedback is provided in a set of text boxes within the xobs window.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_70_0.png)


    Figure 1. xobs, the Main Talon Control Screen


    When using Talon, the first important task is to find the home position of the
    various encoders located throughout the system. These encoders close the loop
    on the operation of the axes, providing a static count for the full travel of
    each axis. Movement of the telescope is calculated in part by the motion of the
    chosen axis in relation to the zero position on the encoder. Decrementing the
    Declination encoder, for example, generally moves the telescope to the north.
    The operation to find homes in the xobs window hunts for and establishes the zero
    positions on each axis encoder.


    Using the software paddle command in the xobs window (Figure 2), the user can
    position the telescope, filter wheel and focus position manually. The motion of
    the telescope to the east and west is referred to as the right ascension (RA)
    or hour angle (HA) of the telescope. To travel north and south is referred to
    as Declination (Dec). Using positive and negative encoder counts, moving the telescope
    axes is a simple matter of moving the axis positive or negative x (RA) or y (Dec).
    These coordinates are in relation to the North Pole.


    Additionally, Talon provides data on the weather conditions at the observing site
    with an attached Davis weather station. This feature ensures that the telescope
    is not exposed to adverse weather conditions during unattended operations. When
    conditions fall within a predetermined range, the observatory dome or roll-off
    roof closes, the telescope moves to a stowed position and operations cease. As
    with the position'
