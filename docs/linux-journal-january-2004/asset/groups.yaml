    ## 使用继电器控制设备


    用简单的 C 程序和廉价硬件敲响铃声及更多。作者 JASON ELLISON


    我最近被赋予了一个有趣的任务，即在工厂车间按设定的间隔制造噪音。公司希望利用这种噪音为特定事件提供重要的听觉提示。这些事件包括员工应上下班打卡、休息以及返回休息后的时间。我实施的解决方案运行良好，相关人员都对结果感到满意。我从上下班打卡的员工那里得到的感激之情直接与他们个人计时器的不准确性有关——手表走快的人欣赏在打卡前似乎拥有的额外时间。然而后来，当手腕上的手表明显显示该下班时，他们却咒骂我让下班打卡延迟了。


    我所在的公司在整个厂区放置了条码打卡终端，用于记录员工上下班打卡的时间。此外，条码打卡机还记录每位员工正在执行的工作。当员工上下班打卡时，员工会扫描其身份徽章和代表该人正在做的工作的条码。打卡终端将这些数据连同扫描项目的时间戳一起复制到缓冲区。CMINet
    是一种运行在两台 Microsoft Windows NT 系统上的数据采集系统，用于从打卡机获取数据。打卡机大约每分钟轮询一次，以检索保存在打卡终端缓冲区中的数据。在轮询期间，打卡机也会被设置为轮询机器的本地时间。从打卡机获取的数据随后会被导入企业资源规划（ERP）系统，用于作业成本核算和工资发放。


    公司关于迟到的政策规定，“如果员工在指定开始时间后一分钟或更长时间才打卡，则视为迟到。”由于公司关于迟到的政策，事件铃声需要与条码打卡机和运行 CMINet
    的机器完美同步。理论上，这种同步可以缓解记录的上下班时间与真实本地时间之间的差异。正确的时间同步至关重要，但本文并未对此进行深入讨论。


    考虑到迟到一分钟或以上即视为迟到的规则，以及员工从休息返回时不可避免地会出现时间困惑的情况，决定安排铃声会很有用。因此，需要一个关键任务的噪音制造系统，我被要求实施它。


    ### 实现概念


    基于当前问题，该项目必须满足以下要求：


    - 使用铃声系统提供听觉提示。铃声需要在长时间暴露后仍足够响亮且令人厌烦以引起注意。

    - 提供通过计算机闭合电气电路的简单方法。

    - 为所有时间敏感系统提供准确的时间同步，包括将触发铃声的机器、运行 CMINet 的机器以及间接的条码打卡机。


    在明确要求后，我开始制定计划。购买了五个新的 12VAC 铃声和一个 12VAC 电源。这些是报警系统或任何发声系统中常用的同类型铃声。铃声以与旧式闹钟相同的方式物理敲击自身，并发出分贝。铃声需要布线，以便连接两根电线即可使整个工厂的铃声响起。


    为了控制铃声，我们需要暂时闭合铃声电路。我被指引到一个特定的继电器设备 AR-2，它可以通过串行端口由计算机控制。该设备将用于完成铃声电路，使其响起。AR-2
    由 Electronic Energy Control, Inc. (EECI) 以约 $44 US 的价格出售。它在电路板上有两个继电器，两者都可以作为常开（NO）或常闭（NC）继电器连接。仅一个接为常开的继电器将用于此项目。还购买了一个外壳（EN-B）来容纳电路板。在外壳上安装了一个紧急开关，以防出现严重问题时使用。AR-2
    的文档足够完善，我知道可以用 C 编写程序来控制它。该程序可以使用 cron 作业进行调度。


    对于时间同步，选择了 NTP 协议。由于 NTP 协议定义明确且被广泛采用，NTP 客户端和服务器不太可能出现互操作性问题。此外，NTP 客户端可以处理网络延迟、夏令时和本地时区。几乎所有当前使用的主流操作系统都有免费的客户端可用。使用这些客户端的计算机可以轻松获得精确到毫秒的时源。良好的精度正是我们在尝试同步多个系统时所需要的。


    ### 实现细节


    五个 12VAC 铃声安装在整个工厂和指定的休息区，以便每个人都能听到。铃声与供应商提供的 12VAC 电源以混合串联和并联方式布线。电源的一根引线未连接，以提供可打开和关闭铃声的点。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_84_0.png)


    图 1. 铃声系统示意图


    我拿了一台公司闲置的 Dell PC 用于此项目，一台基本配置的 PC，配备 Pentium III 750MHz 处理器、128MB SDRAM、40GB
    IDE 硬盘和 IDE CD-ROM。我使用了现成可用的设备，实际上这台计算机比所需功能强大得多。


    AR-2 继电器设备连接到计算机的串行端口，并由 DTR（数据终端准备）和 RTS（请求发送）控制线控制。将 RTS 置为高电平会使第一个继电器通电，将 DTR
    置为高电平会使第二个继电器通电。闭合铃声电路只需要一个继电器，因此我只需要能够切换 RTS 信号。文档中提供了 GWBASIC 和 Turbo C 的示例程序。我想用
    GCC 编写一个程序来控制继电器，但对 C 编程经验不多，所以我在网上搜索了一些关于使用串行端口的 C 程序的详细文档示例。


    我找到的第一个有趣的程序是 Harvey J. Stein 的 UPS HOWTO 中的 upschek.c。upschek 本身是 Miquel van
    Smoorenburg 的 powerd.c 的修改版本，使用了 RTS 信号和 DTR 信号。该程序最初用于通过串行端口诊断或检查 UPS 与 PC 的通信。启动程序时，你会通过参数指定
    UPS 连接到的串行设备以及是否将 RTS 和/或 DTR 置为高电平。程序打开端口并设置或清除指示的串行控制线后，会监控另一条控制线以获取 UPS 的反馈。该程序做了我需要的一切，甚至更多。我只需要移除监控部分，就有了我的
    C


