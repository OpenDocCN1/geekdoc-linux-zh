    ## Panasas ActiveScale Storage Cluster


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_66_0.png)


    采用以对象为基础的架构将数据作为大型虚拟对象进行管理，ActiveScale 存储集群由 ActiveScale 文件系统、StorageBlades 和
    DirectorBlades、4U 系统机架以及集成千兆以太网交换机构成。ActiveScale 文件系统将文件转换为智能数据对象，然后动态地在 StorageBlades
    之间分配数据活动。这种设计在服务器和 StorageBlades 之间实现了并行数据路径，消除了性能和容量瓶颈。应用程序和用户数据存储在 StorageBlades
    中，文件系统活动由 DirectorBlades 协调。DirectorBlades 还在 StorageBlades 范围内虚拟化数据对象，使系统可被视为单一命名空间。


