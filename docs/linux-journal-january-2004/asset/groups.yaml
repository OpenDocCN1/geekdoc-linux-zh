    输出的第三部分（列表 3）列出了磁盘的最多 30 个属性表（来自最多 255 个属性集）。请记住，属性已不再是 ATA 标准的一部分，但大多数制造商仍支持它们。尽管
    SFF-8035i 未定义属性的含义或解释，但许多属性具有事实上的标准解释。例如，此磁盘的第 13 个属性（ID #194）跟踪其内部温度。


    研究表明，将磁盘温度降低仅 5°C 即可显著降低故障率，尽管对于最新一代的流体驱动轴承驱动器来说这问题较小。你可以采取的最简单、最经济的措施之一来确保磁盘可靠性是添加一个冷却风扇，直接向系统磁盘吹送冷却空气或从其旁吹过。


    每个属性都有一个六字节的原始值（RAW_VALUE）和一个一字节的归一化值（VALUE）。在这种情况下，原始值存储三个温度：磁盘的摄氏温度（29），以及其使用寿命的最低值（23）和最高值（33）。原始数据的格式是厂商特定的，未被任何标准指定。为了跟踪磁盘可靠性，磁盘固件将原始值转换为从
