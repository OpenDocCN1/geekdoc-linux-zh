    \ C 模式的内容（参见 Resources）。\n\n通常的做法是以模式的名称作为前缀来命名特定模式的变量。因此，要查看与特定模式关联的变量，可以使用 M-x\
    \ apropos-variable 对变量名进行正则表达式搜索。对于 C 模式，我们使用正则表达式 \"^c-\" 消除大量误报。当 Emacs 返回结果列表时，移动到该缓冲区并按\
    \ Return 查看任何感兴趣的变量以获取更多信息。\n\n要了解还能搜索什么，试试 M-x apropos-command RET apropos RET。“apropos-zippy”？我让你自己去研究一下。\n\
