    \n## Understanding Caching\n\nArchitectures that support Linux differ in how they\
    \ handle caching at the hardware level. Here’s how the kernel gets the best possible\
    \ use out of every cache design. BY JAMES BOTTOMLEY\n\nSince the earliest days\
    \ of microprocessors, system designers have been plagued by a problem in which\
    \ the speed of the CPU’s operation exceeded the bandwidth of the memory subsystem\
    \ to which it was connected. To avoid wasting CPU cycles while waiting for the\
    \ memory to fetch the requested data, the universally adopted solution was to\
    \ use an area of faster (and thus more expensive) memory to cache main memory\
    \ data. This solution allowed the CPU to operate at its natural speed as long\
    \ as the data it required was available in the cache.\n\nThe purpose of this article\
    \ is to explain caching from the point of view of a kernel programmer. I also\
    \ explain some of the common terms used to describe caches. This article is divided\
    \ into sections whose kernel programming relevance is indicated; that is, some\
    \ sections explain that cache properties are irrelevant to understanding the essentials\
    \ of how the kernel handles caching. If you’re coming from an Intel IA32 background,\
    \ caching is practically transparent to you. In order to write kernel code that\
    \ operates correctly on all the architectures Linux supports, however, you need\
    \ to know the essentials of how caching works in general.\n\n### A Cache and Its\
    \ Properties\n\nSimply put, a cache is a place that buffers memory accesses and\
    \ may have a copy of the data you are requesting. Usually one thinks of caches\
    \ (there may be more than one) as being stacked; the CPU is at the top, followed\
    \ by layers of one or more caches and then the main memory. In this hierarchy,\
    \ caches are quantified by their level. The cache closest to the CPU is called\
    \ level one, L1 for short, and caches increase in level until the main memory\
    \ is reached.\n\nA cache line is the smallest unit of memory that can be transferred\
    \ to or from a cache. The essential elements that quantify a cache are called\
    \ the read and write line widths. These signify the minimum amount of data the\
    \ cache must read or write from the memory or cache below it. Frequently, these\
    \ quantities are the same, so caches often are quantified simply by the line width.\
    \ Even if they differ, the longest width usually is called the line width.\n\n\
    The next property that quantifies a cache is its size. This number is an indication\
    \ of how much data could be stored in the cache. Often, the performance rule of\
    \ thumb is the bigger the cache, the better the benchmarks.\n\nA multilevel cache\
    \ can be either inclusive or exclusive. Exclusive means a particular cache line\
    \ may be present in exactly one of the cache levels and no more than one. Inclusive\
    \ means the line may be present simultaneously in more than one level of cache.\
    \ Nothing prevents the line widths from being different in differing cache levels.\n\
    \nFinally, a particular cache can be either write through or write back. Write\
    \ through means the cache may store a copy of the data, but the write must be\
    \ completed at the next level down before it can be signaled as complete to the\
    \ layer above. Write back means a write may be considered complete as soon as\
    \ the data is stored in the cache. For a write back cache, as long as the written\
    \ data is not transmitted, the cache line is considered dirty, because it ultimately\
    \ must be written out to the level below.\n\n### Cache Management and Coherency\n\
    \nOne of the most basic problems with caches is coherency. A cache line is termed\
    \ coherent when the data in the line is identical to the data stored in the main\
    \ memory being cached. If this is not true, the cache line is termed incoherent.\
    \ Lack of coherency can cause two particular problems. The first problem, which\
    \ may occur for all caches, is stale data. In this situation, data has changed\
    \ in main memory but the cache hasn’t been updated to reflect the change.\n\n\
    This usually manifests itself as an incorrect read, as illustrated in Figure 1.\
