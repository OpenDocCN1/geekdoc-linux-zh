    游戏开始时，你选择的物体呈现在一个由分形墙包围的球形空间中央。点击右下方的 Play 图标，行动开始。左下角的计数器滴答作响。你需要用来创建最终形状的物体是几何基元，它们都位于左上方。这些基元之间用并集运算符分隔。点击并集运算符可在并集（看起来像
    U）、交集（倒置的 U）和减法（减号）之间选择。在右下方，新的图标出现，以便你查看原始形状、退出或声明胜利。


    就是这样。根据这些简单规则将形状移入和移出中央构建区域。这也是你发现简单有多困难的地方。*Ensemblist* 很奇怪且奇怪地令人上瘾。在后续游戏中，你可以在启动游戏时使用
    `--no-net` 选项，因为现有关卡已下载到你的系统上。

