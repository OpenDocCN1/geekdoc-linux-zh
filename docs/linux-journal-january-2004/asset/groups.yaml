    尽管 Linux 具有全球影响力毫无疑问，但 LPI 在确保开源教育和认证在许多语言、文化和政府结构中相关且有用方面面临挑战。LPI 单靠其总部无法让 Linux
    在世界各地都相关。传统的分支机构方法也行不通。我们的基于社区的分支网络现已在美国、日本、巴西、加拿大、德国和奥地利运营。每天都有更多国家分支机构上线；一些最新加入的包括澳大利亚、尼日利亚、保加利亚和中国。


    ### 特别是，我们必须让人力资源界意识到 Linux 认证是可用的。


    短期目标是扩大这一分支网络，但我们也有长期愿景：确保认证在每个地区都可访问且质量尽可能高，同时保持相关性。即使我们的网络呈跳跃式增长，障碍仍然存在。特别是，我们必须让人力资源界意识到
    Linux 认证是可用的。组织整体需要知道，如果他们选择 Linux 作为战略技术，专家人才以受过培训、通过 LPI 项目认证的专业人员的[content]

    ## 将 IT 认证颠覆


    如何为更多人提供更好的认证，价格更低，且无厂商锁定。


    作者 EVAN LEIBOVITCH


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_97_0.png)


    Linux 专业学院 (LPI) 成立于 1998 年，是一家旨在消除开源采用障碍并提高其社区技能水平的 Linux 认证机构。自那时起，LPI 已在几乎每个国家交付了超过
    35,000 次考试，并获得了厂商、培训师、雇主和政府的支持。然而，这只是开始。作为一个组织，LPI 有潜力将 IT 认证世界颠覆，就像 Linux 本身颠覆了软件世界一样。


    技术相关培训已成为一种如此以厂商驱动的商品，以至于它不过是软件厂商营销计划的延伸。没人再教授技术了；一切都归结为把学生锁定在一种工具上。


    IT 认证现在被期望以厂商为中心，这是一种 IT 领域的独特现象。例如，药剂师并不是只接受一种药品品牌名称的培训。即使在“厂商中立”项目（如 CompTIA）的情况下，厂商仍然控制着认证。被认证的人和将雇用他们的人在培训内容上没有发言权。


    尽管 LPI 已接受厂商赞助以推进其目标，但厂商单独并不会决定其未来发展方向。LPI 由社区驱动，不仅厂商中立，而且确实厂商独立。例如，社区要求桌面 Linux
    认证，因此 LPI 正在努力使其成为现实。更重要的是，我们作为一个整体所试图做的是将 IT 认证世界拖向同行评审模式，而人们已从其他职业中期望这种模式。


    鉴于其视角，LPI 发现自己与科技专业人士可用的其他 IT 认证项目相比，共同点更少，而与诸如国家能力保证组织等团体更相似，其成员主要由医疗和职业认证主导，而非
    IT 项目。


    虽然大多数技术厂商一直在提高其认证考试的费用，但 LPI 正在有意识地努力降低其考试费用并提高在每个国家的可及性。在某些国家，LPI 考试 100 美元的费用相当于一名
    IT 工作者一个月的工资。由于 LPI 的目标是推进开源而不是最大化收入，我们显然面临挑战。即使在富裕国家，大多数认证的费用往往超出寻求新职业道路的失业者承受能力。LPI
    内部的一项主要举措是研究和开发降低计算机交付教育成本的方法，同时改进测试技术，以可扩展、经济高效的方式提供动手测试。我们的增长取决于 Linux 和开源的进展，它们在企业和公共部门取得了显著进展。慕尼黑市于
    2003 年 5 月决定选择 Linux 不仅用于服务器还用于桌面，使其成为 Linux 客户端的典范。慕尼黑的决定与价格无关；根据已发表的报道，微软努力保留该业务，价格低于
    Linux 选项。但 Linux 赢得了投标。


    尽管 Linux 具有全球影响力毫无疑问，但 LPI 在确保开源教育和认证在许多语言、文化和政府结构中相关且有用方面面临挑战。LPI 单靠其总部无法让 Linux
