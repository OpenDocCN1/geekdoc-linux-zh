    一旦您提供了有关新目标的一些基本信息，您必须定义至少一个操作（“move”），然后定义最重要的部分，即服务器部分。在服务器部分中，您指定最终应存放文件的服务器。正如我们已指出的那样，我们是复制文件而不是使用
    FTP，因此我们只需填写目标路径名，该路径名应与文档将可用的 Apache 虚拟主机的 DocumentRoot 匹配。


    ## 编写与发布


    现在我们已经创建了输出通道，可以返回并创建新的故事，戴上记者的帽子。（请记住，这些菜单通常 intended to be used by 杂志员工的不同人员或人员组。）在“故事”菜单中点击“新建故事”，为其提供至少一个标题、一个分类（/，除非您已定义其他分类）和一个优先级（普通）。您还可以设置发布日期，该日期不仅表示故事应何时发布到网络上，还表示其应可用的
    URL。Salon.com 的长期读者可能已经注意到，每个故事的 URL 都包含发布日期；Bricolage 源自 Salon 开发的 CMS，继续沿用这一传统也就不足为奇了。


    填写完这些基本信息后，点击“创建”按钮。现在您可以创建文章的文本，添加段落（一次一个，或使用批量编辑按钮并用空行分隔）。故事完成后，您可以使用页面底部的“签入”按钮将其提交到编辑部，发送到编辑部。


    不幸的是，基于 Web 的界面以及 Bricolage 提供的灵活性意味着 Bricolage 的界面往往有点复杂，迫使您使用多个不同的“提交”按钮。幸运的是，按钮的标签很清晰，这意味着即使您最终保存故事而不是将其签入编辑部，您也不太可能意外删除故事。话虽如此，新
    Bricolage 用户在假设所有“提交”按钮都一样之前，最好先阅读按钮上的标签。


    现在我们已将文章提交到编辑部，我们再次换帽子，假装成需要审阅故事的编辑。在“故事”菜单中“桌”子标题下点击“编辑”菜单，您将获得当前签入编辑部的所有故事的列表（图
    2）。已发布的故事在其标题栏中有 P。已签出的故事（即可由编辑更改）可以编辑。但我们现在不会编辑故事，因为我们知道作者总是能完整写完句子并仔细核对工作。对于现在，我们将其发送到发布部，在那里内容会最后审阅一次然后发送到网络。我们通过在“移至”菜单中选择“发布”然后点击“移动资源”来完成此操作。


    然后我们可以前往发布部，在那里项目在发布到网络之前会进行最后一次审阅。请注意，Bricolage 内置了校对和法律审查的支持。您也可以创建新的工作台，如果


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_17_0.png)


    图 2. 在编辑部，您可以检查准备编辑的故事。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_17_1.png)


    图 3. 在发布部审阅待发布的故事。


    您的组织结构比默认设置更复杂。


    在许多方面，发布部与其他部门相同；它允许您为故事添加注释、查看故事的编辑轨迹甚至查看更改日志。您也可以在发布部签出故事并点击“编辑”链接来编辑故事。然而，发布部最重要的部分是额外的复选框（不出所料，标记为“发布”）和一个标记为“发布已选”（图
    3）的按钮。


    当您点击“发布已选”时，Bricolage 会给您选择故事应何时发布的选项。这与故事的发布日期不同。例如，您可能希望一篇发布日期为 2 月 1 日的故事在
    1 月 31 日就可用。或者，您可能希望它仅在 2 月 7 日可用。点击“发布资源”按钮会启动此流程，Bricolage 会报告已发布相关故事（或故事）。果然，我们的文档已发布到我们之前为其分配的
    URL——在本例中为 DocumentRoot 中的 index.html。


    ## 管理问题


    当印刷报纸或杂志发布故事时，没有办法更改已显示的内容。但在网络上，您只需修改相关故事，每个人立即就能看到更改。忽略这种技术能力引发的新闻伦理问题，Bricolage
    使纠正故事然后将其重新部署到网站上变得很容易。


    要修改已发布的故事，请转到“活动故事”菜单项，其中会列出当前可用的故事。您可以选择签出一个故事，使其可供当前用户编辑。（Bricolage 的版本控制系统确保一次只有一个人员可以编辑文件。）然后您可以编辑文件并将其发送到编辑部，就像您最初撰写故事时所做的那样。同样，编辑部必须将其传递给发布部；从那里它可以发布到网络。


    如果您之前只从事过小型网站，那么这项任务可能看起来过于复杂。毕竟，网络的魅力之一不就是我们可以更改文档并立即看到更改结果吗？内容管理系统确实给网站的运作引入了一系列权衡。您不能再简单地在磁盘上修改文件；您必须登录，签出文件，进行修改，签回并发送到发布部，后者甚至可能拒绝您的更改。


    但无论此流程多么复杂和官僚，它都比另一种选择更好，即多人争夺文件的所有权或不同人员尝试在实时站点上编辑同一文件——有时以不同的方式。CMS 的设计目的是减缓您的速度，就像安全带旨在防止您移动过多一样。但在两种情况下，限制都是为了帮助您，阻止您伤害自己。此外，这种官僚程序在关键时刻可以救您，因为文档的每个先前版本始终可用。因此，如果您意外删除了重要故事的一半，您可以恢复到
    Bricolage 存储在其数据库中的先前版本。


    ## 结论


    Bricolage 是一个功能齐全、复杂的开源内容管理系统，具有令人印象深刻的功能集合。正如我们本月所见，我们可以轻松设置基于 Bricolage 的站点，并通过我们使用
    Apache 配置中简单的一组虚拟主机定义创建的分发渠道发布故事。下期专栏，我们将通过探讨如何自定义输出模板来结束对 Bricolage 的讨论，将简单的黑白出版物变成更具魅力的东西。


