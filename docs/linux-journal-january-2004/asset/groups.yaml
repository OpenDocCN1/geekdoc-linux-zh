  mdcn: "\n## 提供超过 175 门课程：\n- C++\n- Java\n- XML\n- .NET\n- Mobile\n- Security\n\
    - Emerging Technologies\n- Modeling, Design & Quality\n- People, Process & Methods\n\
    - Web Services Technologies\n- Requirements & Analysis\n\n另加：\n新展会、小组讨论、\n案例研究、\n\
    圆桌会议、BOF's\n以及令人兴奋的特别活动\n\n超级早鸟优惠\n在 1 月 16 日之前注册可节省高达 $500\n\n早鸟优惠\n在 2 月 13\
    \ 日之前注册可节省高达 $400\n\n## SD WEST\n\n2004 年 3 月 15-19 日，圣克拉拉，加州\n\n## 提升自我\n\n立即在\
    \ WWW.SDEXPO.COM 注册\n\n## 理解缓存\n\n支持 Linux 的架构在硬件层处理缓存的方式各不相同。以下是内核如何充分利用每种缓存设计的最佳性能。作者：JAMES\
    \ BOTTOMLEY\n\n自微处理器诞生之初以来，系统设计师就一直困扰于一个问题：CPU 的运行速度超过了其所连接的存储子系统的带宽。为了避免在等待内存获取请求数据时浪费\
    \ CPU 周期，普遍采用的解决方案是使用一块更快的（因此更昂贵的）内存来缓存主内存数据。只要所需的数据在缓存中可用，这一解决方案就能让 CPU 以其自然速度运行。\n\
    \n本文的目的是从内核程序员的角度解释缓存。我还解释了一些用于描述缓存的常用术语。本文分为若干章节，其内核编程相关性已标明；也就是说，有些章节解释了缓存属性与理解内核处理缓存的基本原理无关。如果你来自\
    \ Intel IA32 背景，缓存对你来说几乎是透明的。然而，为了编写在 Linux 支持的所有架构上都能正确运行的内核代码，你需要了解缓存工作原理的基本知识。\n\
    \n### 缓存及其属性\n\n简单来说，缓存是一个缓冲内存访问并可能保存所请求数据的副本的地方。通常人们认为缓存（可能不止一个）是堆叠的；CPU 在顶部，其后是若干层一级或多级缓存，然后是主内存。在此层次结构中，缓存按其级别量化。最接近\
    \ CPU 的缓存称为一级缓存，简称为 L1，缓存级别不断增加直至达到主内存。\n\n缓存行是可以传输到缓存或从缓存传输的最小内存单元。用于量化缓存的基本要素称为读线宽和写线宽。它们表示缓存必须从其下方的内存或缓存中读取或写入的最小数据量。经常这些数量相同，因此缓存通常仅用线宽来量化。即使不同，最长的宽度通常也称为线宽。\n\
    \n量化缓存的下一个属性是其大小。这一数字表示缓存中可存储的数据量。常有的性能经验法则是缓存越大，基准测试越好。\n\n多级缓存可以是包含式或独占式。独占式意味着特定缓存行最多只能存在于一个缓存级别中。包含式意味着该行可以同时存在于多个缓存级别中。没有任何因素阻止不同缓存级别的线宽不同。\n\
    \n最后，特定缓存可以是写直达或写回。写直达意味着缓存可以存储数据的副本，但写入必须在下一层完成后才能向上一层发出完成信号。写回意味着只要数据存储在缓存中，写入即可视为完成。对于写回缓存，只要写入的数据未被传输，缓存行就被视为脏，因为最终必须将其写出到下一层。\n\
    \n### 缓存管理与一致性\n\n缓存最基本的问题之一是一致性。当行中的数据与被缓存的主内存中存储的数据 identical 时，缓存行称为一致的。如果不是这样，缓存行称为不一致。缺乏一致性可能导致两个特定问题。第一个问题可能发生在所有缓存中，即陈旧数据。在这种情况下，主内存中的数据已更改，但缓存未更新以反映更改。\n\
    \n这通常表现为不正确的读取，如图 1 所示。这是一个瞬态错误，因为正确的数据位于主内存中；缓存只需被告知将其取入即可。\n\n第二个问题仅发生在写回缓存中，可能导致数据实际破坏，且更加隐蔽。如图\
    \ 2 所示，数据在内存中已被更改，同时也被 CPU 写入缓存而单独更改。由于缓存必须一次写出一行，现在无法调和这些更改——要么缓存行在未写入的情况下被清除，从而丢失\
    \ CPU 的更改，要么该行被写出，从而丢失对主内存所做的更改。所有程序员都必须避免达到数据破坏不可避免的程度；他们可以通过明智地使用各种缓存管理 API\
    \ 来做到这一点。\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_60_0.png)\n图 1. 陈旧数据问题\n\
    \n![](img/3e9d313887e2c1cabeb5043769cbf08f_60_1.png)\n图 2. 脏缓存行导致的数据破坏\n\n###\
    \ 缓存行干扰\n\n当两组独立数据位于同一缓存行中，可能导致上述数据破坏的情况称为缓存行干扰。如果你正在内存中布局数据结构，避免这种情况的一般规则是永远不要将可在缓存外修改的数据与\
    \ CPU 可能通常使用的数据混合在一起。如果你绝对必须违反此规则，请确保结构中所有可外部修改的元素都对齐 L1_CACHE_BYTES，该值在编译时设置为代码可能运行的所有处理器上可能的最大缓存宽度值。最好的做法是使用\
    \ kmalloc 分配两个单独的区域。kmalloc 从不分配在缓存行中重叠的两个区域。\n\n### 缓存管理指令\n\n最基本的指令称为失效，它只是将指定的行从所有缓存中弹出。对该行中数据的任何引用都会导致其从主内存重新获取。因此，在读取数据之前使缓存行失效即可解决陈旧数据问题。在\
    \ Linux 中，此类失效通过以下方式完成：\n```\nvoid\ndma_cache_inv(unsigned long address,\n   \
    \ unsigned long size);\n```\n其中 address 是开始的虚拟地址，size 是要失效的数据长度。请注意，size 会自动向上舍入为缓存行宽度的倍数。\n\
    \n对于写回缓存，任何脏缓存行都可使用以下方法写出或刷新到主内存：\n```\nvoid\ndma_cache_wback(unsigned long address,\n\
    \    unsigned long size);\n```\n此刷新必须在任何事物更改\n![](img/3e9d313887e2c1cabeb5043769cbf08f_60_2.png)\n\
    脏缓存行下的主内存之前完成。因此，你必须在外部实体（如 PCI 卡）修改主内存之前发出刷新，并在刷新后但在 CPU 访问任何已更改数据之前发出失效。\n\n\
    理论上，对于写回缓存，失效会杀死缓存行而不实际写出数据，从而破坏缓存中的数据。在这种情况下更安全的做法是发出刷新并失效指令：\n```\nvoid\ndma_cache_wback_inv(unsigned\
    \ long address,\n    unsigned long size);\n```\n这会将缓存行刷新到主内存，然后从缓存中使它们失效。\n\n\
    ### 缓存类型\n\n本节解释缓存实际的工作原理。你从本节需要了解的唯一重要信息是一个称为别名的属性，这意味着内存中的同一物理地址可能被缓存到多个不同的缓存行中。内核实际如何管理别名将在下一节讨论。\n\
    \n在直接映射缓存中，如图 3 所示，缓存被划分为已知宽度的缓存行（示例中为四个）。缓存中的每一行都由唯一的索引标识，因此缓存中的每个字节都由行的索引和行内的偏移量寻址。缓存的每个索引还具有一个称为标记的隐藏数字。\n\
    \n![](img/3e9d313887e2c1cabeb5043769cbf08f_61_0.png)\n图 3. 直接映射缓存\n\n系统中的每个地址都沿\
    \ 2 的幂边界分为三部分——标记、索引和偏移（图 4）。当一行被带入缓存时，标记和索引从地址中提取。该行存储在缓存的所需索引处，隐藏的标记与行数据一起存储。当\
    \ CPU 引用特定地址时，缓存会在给定索引处被查询。如果标记匹配，则获取行内的偏移量以满足地址引用。如果标记不匹配，当前行可能会被刷新回主内存，并将正确的行带入缓存。\n\
    \n| Tag | Index | offset |\n|---|---|---|\n\n图 4. 地址划分\n\n每个可缓存地址只有一个对应的索引行，这可能导致问题。例如，如果处理器读取的一系列地址恰好对应于相同的缓存索引，则缓存行必须在每次读取时被逐出并重新获取。这种情况很容易发生在例如\
    \ for 循环读取结构元素时，而该结构的大小恰好与缓存相近。对于直接映射缓存，索引有时称为缓存颜色，此问题称为缓存行着色问题。\n\n为了解决直接映射缓存的着色问题，缓存电路有时被安排成使缓存查找能够同时在多个缓存行中比较标记。在\
    \ N 路组相联缓存中，每个索引对应 N 个缓存行（和标记）；因此，我们可以同时在缓存中拥有多达 N 个具有相同索引的地址。\n\n增加的并行缓存查找电路往往会略微增加关联性的成本，因此它通常只出现在高端\
    \ CPU 中。\n\n在范围的顶端，你可能会找到全相联缓存。这种类型的缓存完全没有索引，在查找特定标记时所有行都会同时被查询。\n\n所有现代 CPU 都处理地址转换，这意味着内核或应用程序用于引用内存的虚拟地址与数据实际所在物理地址不同。缓存可以放置在地址转换之前或之后，有时在分层缓存中存在混合放置。每种放置都有不同的属性和特性，如下所述。\n\
    \n在物理索引、物理标记（PIPT）缓存中，缓存的标记和索引都在物理内存中，即在虚拟地址转换完成后。这过程很简单，但 PIPT 缓存的缺点是有效的地址转换必须在\
    \ CPU 的 TLB（转换后备缓冲器）中。如果在进行地址转换之前需要从内存中获取此类 TLB 条目，则缓存数据的优势就丧失了。即使存在 TLB 条目，TLB\
    \ 查找和缓存查找也必须顺序进行，使这些缓存变慢。\n\n在虚拟索引、虚拟标记（VIVT）缓存中，另一方面，索引和标记都在 CPU 当前操作的虚拟地址空间中。虽然这使缓存查找速度更快（如果缓存查找成功，则在查找之前或之后无需进行地址转换），但它们存在其他几个问题：\n\
    - 1. 虚拟地址转换通常是正常内核操作的一部分，因此缓存必须仔细注意 TLB 条目的更改（以及地址空间的更改）并刷新其转换已更改的缓存行。\n- 2. 即使在单个地址空间中，同一物理地址也可能存在多个虚拟地址。每个这些虚拟\n"
