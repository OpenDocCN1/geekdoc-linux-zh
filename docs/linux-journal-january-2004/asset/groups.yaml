    # Linux in Air Traffic Control


    Linux is the natural development platform for the Federal Aviation Administration’s
    air traffic control software. BY TOM BRUSEHAVER


    Many people say Linux isn’t ready for air traffic control, but in reality, it
    is ready and already is being used. Recently I was involved in a project that
    ported the FAA’s Common ARTS software (www1.faa.gov/ats/atb/Sectors/Automation/CommonArts/index.htm)
    to Linux.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_79_0.png)


    A Controller in Atlanta


    When most of us think of air traffic control systems, we usually see round screens
    with a sweep. Some people know what the RADAR antenna array looks like. Between
    the RADAR antenna and the display are a few computers to make things easier. The
    Digital Signal Processors (DSPs) are in the antenna building, and automation systems
    are used as well. This article describes how the automation system works, and
    where Linux was used.


    # History


    The Automated Radar Terminal System (ARTS) got its start back in 1964 on Univac
    computers. The system eventually went nationwide in 1973. The original computers
    have been upgraded and continue to be used today. Many of the larger sites moved
    from the Univac computers to microprocessors during the 1980s. All of the legacy
    ARTS software was ported or rewritten in C to run under the real-time LynxOS during
    the move to microprocessors.


    The move to LynxOS was fortuitous, as it provided a POSIX base to which further
    porting could be done. Using


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_79_1.png)


    Full digital ARTS display. The ACDs (right side) are replacing these vector displays.
    All the knobs are now menus on the display.


    LynxOS also allowed developers to choose which microprocessors to use. Initially,
    the software ran on Motorola 68K CPUs, and it currently runs on PowerPCs.


    # Architecture


    The Common ARTS system is a highly distributed, networked, multithreaded, real-time
    system. Absolute reliability is a requirement. Dual networks are used, and under
    normal conditions, two backups are assigned to each specific task. The software
    is designed such that some functions of one subsystem can be taken over by another
    subsystem.


    The RADAR data comes in over serial lines to each of the track processors (TPs).
    Normally, four serial lines go from each RADAR to each TP. The data on the RADAR
    include the raw RADAR signal, a transponder beacon (each aircraft should have
    a transponder that returns an ID and an altitude in the beacon each time the RADAR
    pings the aircraft) and weather data. The same antenna array usually receives
    all three signals. Any of the RADAR and beacon data can go down any of three serial
    lines, with weather transferring on its own serial line.


    The TP is divided into at least two subsystems, the serial message assembly and
    the actual track processing. Serial message assembly converts each message type
    (raw RADAR, beacon and weather) into a network message. Track processing involves
    correlating RADAR and beacon messages (targets) into a single track. A track is
    the known history of the aircraft. Targets can be RADAR, beacon signals or both.
    Once a target is correlated to a track, another track message is put on the network.


    Messages usually are broadcast on the network. They are sent using UDP on both
    trunks, and each message has a unique packet ID. Each computer on the network
    listens to both trunks and keeps a record of the packet IDs it has heard from
    each unique network ID. If there is a gap in packet IDs, a chassis may request
    a rebroadcast. Duplicate packet IDs are ignored, assuming it was the message on
    the other trunk or some other chassis requesting a rebroadcast.


    Each system must broadcast heartbeats on the network. If a heartbeat is missed,
    it is assumed the system is down, and one of the other systems sends a message
    to have a standby system take over.'
