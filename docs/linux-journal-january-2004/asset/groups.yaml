    ![](img/3e9d313887e2c1cabeb5043769cbf08f_91_1.png)


    您可能想考虑使用 bandwidthd 而不是 MRTG 或 Cacti 的一个原因是 bandwidthd 图表显示单个 IP 地址，而不是捕获原始流量量。bandwidthd
    还尝试按主机将流量分类为 TCP、UDP、ICMP、VPN、HTTP 和 P2P 流量。也就是说，您可以看到每个主机如何使用其带宽。一旦您有了基线，持续的带宽占用者甚至突然的病毒感染都可以在图表上看到。需要：libgd、libpng12、libpcap、glibc、libXpm、libX11、libjpeg、libfreetype、libz、libm
    和 libdl。


