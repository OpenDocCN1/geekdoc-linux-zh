    1 to 253 and a corresponding one-byte threshold. If one or more of the normalized
    Attribute values are less than or equal to its corresponding threshold, then either
    the disk is expected to fail in less than 24 hours or it has exceeded its design
    or usage lifetime. Some of the Attribute values are updated as the disk operates.
    Others are updated only through off-line tests that temporarily slow down disk
    reads/writes and, thus, must be run with a special command. In late 1995, parts
    of SFF-8035i were merged into the ATA-3 standard.


