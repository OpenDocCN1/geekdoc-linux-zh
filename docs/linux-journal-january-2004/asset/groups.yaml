  mdcn: "\n## Linux 杂志\n\nLinux 社区的月刊 • 2004 年 1 月\n\n## 天文学与望远镜控制\n\n大型 SMP 系统的 RCU\n\
    \n签名内核模块\n\n空中交通管制的新解决方案\n\n使用 SMART 监控驱动器健康状况\n\n安全邮件服务器\n\n## 高密度服务器：\n\nIBM\n\
    eServer Blade Center\n\n立即订阅 Linux Journal！\n致电 1-888-66LINUX 或访问 http://www.linuxjournal.com/subscribe\n\
    \n![](img/3e9d313887e2c1cabeb5043769cbf08f_0_0.png)\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_0_1.png)\n\
    \n![](img/3e9d313887e2c1cabeb5043769cbf08f_1_0.png)\n\n## 在最小的占地面积内体验最强大的计算能力...\n\
    \n由 AMD Opteron™ 处理器驱动的 RackSaver® BladeRack™ 专为支持各种企业解决方案而设计...包括您的。\n\n过去 10\
    \ 年里，RackSaver 为娱乐到石油天然气等各个行业的客户提供了市场上最强大、可靠且可扩展的高性能集群。我们的客户明白，通过提高服务器机房的密度，他们可以在降低总体拥有成本的同时提高生产力。此外，RackSaver\
    \ 提供全天候 24 小时、每周 7 天的现场企业级完整支持，以最大化您的投资保护。了解为何像 Industrial Light and Magic、NVIDIA、Shell、WesternGeco\
    \ 和 Novartis 这样的行业领导者依赖 RackSaver 满足其所有高性能计算需求。\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_1_1.png)\n\
    \n## 我们提到我们还销售高端可定制图形工作站吗？\n\nRackSaver 已推出全新高端图形工作站系列。由 NVIDIA Quadro® FX 系列驱动的\
