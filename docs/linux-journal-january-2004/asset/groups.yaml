    ## IBM eServer BladeCenter


    评测者 DANA CANFIELD


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_67_0.png)


    ### 产品信息


    | 制造商 | IBM |

    | 网址 | www.ibm.com/servers/eserver/bladecenter |

    | 价格 | BladeCenter 机箱起价 $2,789 US；HS20 Blade 起价 $1,879 US；Ethernet Switch Module
    $2,199 US |


    ### 优点


    - 7U 机架空间内容纳 14 台服务器/28 个 CPU。

    - 系统全程采用完全冗余设计。

    - Linux 支持与 Windows 支持相当。

    - 安装七块刀片后价格点与独立服务器相匹配。


    ### 缺点


    - 14 个系统共用一个控制台。

    - 支持仅限于 Red Hat 和 SuSE 的特定版本。

    - 可扩展性有限。


    IBM 近期已开始围绕两种主要服务器系统展开推广，用于 x86 架构上的 Linux 部署。在扩展性方面，IBM 提供 eServer x440 系列，单系统可扩展至
    16 个 CPU。对拥有小型服务器集群的普通用户更有吸引力的是 IBM 的横向扩展方案，即 IBM eServer BladeCenter 系统，一款支持
    14 个刀片的 7U 机架式机箱。


    机箱本身仅由无源中背板、CD-ROM 和软盘驱动器以及两个 10 英寸鼓风机组成。该单元随附两个冗余 230V 电源模块，如果系统运行超过五块刀片，则需要再配备两个。包含一个带键盘、视频和鼠标（KVM）以及以太网连接的管理模块，并且最近已增加对冗余管理模块的支持。


    冗余是 BladeCenter 的关键设计目标，几乎没有被忽视。机箱后部有四个交换机模块槽；第二和第四槽分别是第一和第三槽的冗余槽。例如，如果在第一个槽安装以太网交换机，则可以在第三个槽安装第二个以太网交换机模块，但不能安装
    SAN 交换机模块。尽管允许完全冗余，但这意味着一次只能安装两种类型的交换机模块。


    目前，IBM 提供千兆以太网和光纤通道 SAN 交换机模块。内部，这些交换机模块连接到每个单独的刀片，外部千兆交换机提供四个铜制以太网端口，而 SAN 交换机提供四个光纤通道端口。安装冗余模块后，每个刀片可访问两个以太网端口和两个
    SAN 端口。以太网交换机是一款功能齐全的三层交换机，具有强大的基于 Web 的界面。SAN 交换机是 Q-logic SAN 交换机，可通过 Telnet
    会话或适用于 Linux 和 Microsoft Windows 的基于 Java 的管理软件进行配置。


    BladeCenter 机箱正面包含一个 CD-ROM、软盘和 USB 端口，通过内部 USB 集线器/交换机连接到每个刀片。该交换机由每个刀片上的一个按钮控制，且一次只有一个刀片可以访问
    CD/软盘/USB 端口。键盘、视频和鼠标通过另一个内部交换机连接，该交换机由每个刀片上的第二个按钮控制。KVM 和 USB 外设的控制也可以通过 BladeCenter
    的基于 Web 的管理界面进行操作，该界面允许通过网络远程控制 KVM 输出。不幸的是，尽管可以安装冗余 KVM/管理模块，但一次只能将一个刀片分配给控制台，即使通过
