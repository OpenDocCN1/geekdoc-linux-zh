  mdcn: "\n## POSTFIX 与 LDAP\n### 配置 Postfix 以投递到 Cyrus IMAP\n\n特殊字符串 a11，是 all permissions\
    \ 的简写。要删除 user.bwooster 邮箱，只需指定 c，用于创建或删除邮箱或子邮箱就足够了。其他可能的 ACL 权限列在表 1 中。\n\nACLs\
    \ 在 cyradm(1) 手册页中有详细说明，并在 Cyrus IMAP 的 HTML 文档中进行了解释。我强烈建议你养成至少审阅，如果不是总是自定义，使用\
    \ cyradm 创建的每个邮箱上的 ACL 的习惯。在某些站点，用户可能不需要保留默认权限 c。例如，如果所有用户子邮箱（user.whatever.sent、user.whatever.saved\
    \ 等）都是由你为他们创建的，你可能更希望他们没有创建新邮箱或意外删除它们的权限。\n\n在第一部分，我描述了邮件投递代理（MDAs）将邮件投递到邮箱的作用。作为\
    \ MDA，Cyrus IMAP 可以投递邮件，但它首先必须从邮件传输代理（MTA）接收该邮件。最流行的 MTA 是 Sendmail，但一个更简单且更安全的选择是\
    \ Wietse Venema 的优秀 Postfix（www.postfix.org）。由于 Postfix 是我选择的 MTA，并且如今在大多数主要 Linux\
    \ 发行版中要么作为默认 MTA 提供，要么作为选项提供，所以这里我详细解释它。\n\n你的 IMAP 服务器需要在组织的 SMTP 中继上吗？可以，但不必如此。从安全性和性能的角度来看，将\
    \ SMTP 中继专用于该目的可能更有意义。然后你可以让你的 IMAP 服务器运行自己的 Postfix 实例，从专用的 SMTP 中继接收邮件，而不是直接从其他网络的\
    \ MTA 接收。在任何情况下，我们都假设 IMAP 从中接收邮件的 MTA 与 Cyrus IMAP 运行在同一主机上。\n\n为了配置 Postfix\
    \ 将邮件传输到 Cyrus，需要编辑三个文件。第一个文件是 /etc/postfix/main.cf，其中我们需要添加或取消注释这一行：\n\n```\n\
    mailbox_transport = cyrus\n```\n\n我们需要编辑的第二个文件是 /etc/postfix/master.cf，其中我们需要添加或取消注释这两行：\n\
    \n```\ncyrus unix - n n - - pipe\nuser=cyrus argv=/usr/libexec/cyrus/deliver -r\
    \ ${sender} ${user}\n```\n\n实际上，第二行在你的系统上可能有所不同；Cyrus 的 deliver 程序的语法多年来发生了变化。如果你从\
    \ Linux 发行版的当前 CD 或下载站点安装了 Cyrus IMAP 和 Postfix，则包含的 /etc/postfix/master.cf 文件应该无需调整即可工作。但是，如果你从源代码安装了\
    \ Cyrus IMAP 或 Postfix，则可能需要进行一些调整和搜索，以使第二行完全正确。第二行中的一个关键部分是 argv=/usr/libexec/cyrus/deliver\
    \ 中的路径，它必须指向你本地系统上的 Cyrus deliver 命令。\n\n第三个也是最后一个需要编辑的 Postfix 文件是 /etc/aliases；你也可以将其保存在\
    \ /etc/postfix/aliases 中。除非你使用 LDAP 进行别名查找——这对于本文来说过于复杂，但我在侧边栏中描述了——你需要在 aliases\
    \ 中为每个 Cyrus 邮箱至少有一个条目，外加你需要的指向这些邮箱的别名。\n\n在本文中，我描述了如何使用 LDAP 对 Cyrus IMAP 用户进行身份验证，但我只涵盖了将\
    \ Postfix 邮件投递指向 Cyrus 的方面。事实上，Postfix 也有 LDAP 功能：它可以使用 LDAP 将电子邮件别名解析为邮箱名称。\n\
    \n也就是说，你可以配置 Postfix 同时检查其本地 /etc/postfix/aliases 数据库中的电子邮件别名到邮箱名称映射，并查询本地或远程\
    \ LDAP 服务。这可以节省大量的管理时间；不必维护单独的别名和用户数据库，你可以在 LDAP 中完成所有操作。\n\n然而，Red Hat 7.3（以及可能更晚的版本）上的\
    \ Postfix 并未编译内置 LDAP 支持。要确定你选择的发行版的版本是否在其 Postfix 包中编译了 LDAP 支持，请使用命令 postfix\
    \ -m。如果 LDAP 未列在支持的 Postfix 模块中，你需要卸载 Postfix 包并自行从源代码构建。\n\n有关更多信息和 Postfix 源代码，请参阅\
    \ www.postfix.org。请务必阅读 Postfix 源代码中 ./READMES/LDAP_README 中的说明，其中解释了如何编译 Postfix\
    \ 的 LDAP 功能——默认的 Postfix Makefile 并不会自动执行此操作。还请务必阅读文件 /etc/postfix/samples/sample-ldap.cf，其中包含你需要在\
    \ /etc/postfix/main.cf 中添加和配置以使 LDAP 别名查找正常工作的参数。后一步极其重要，可能需要一些调试才能使其正常工作。\n\n\
    > 如果你放弃这一切，而选择以老式的方式单独维护 Postfix 的 aliases 文件，那么不用担心；使用或不使用 LDAP 与 Postfix 对其与\
    \ LDAP 身份验证的 Cyrus IMAP 软件的交互能力没有任何影响。\n\n对于我们的示例用户 Bubba，/etc/aliases 需要这一行：\n\
    \n```\nbubba: bubba\n```\n\n简单吧，对吧？我们省略了 user. 前缀；Cyrus 邮箱以用户名引用。如果你的 Cyrus（LDAP）用户名与本地系统用户名相对应，你就不需要为这些用户创建\
    \ aliases 条目。但 Cyrus 的吸引力之一在于它不需要用户拥有 shell 账户。\n\n如果 Bubba 是我们组织的市场分析师，我们也可以添加这一行：\n\
    \n```\nmarketing_weasel: bubba\n```\n\n编辑 aliases 文件后，不要忘记使用 postalias 命令生成新的别名数据库：\n\
    \n```\nbash-$ postalias hash:/etc/aliases\n```\n\n## 使用 C-TREE® SERVER SDK 自定义你的数据库服务器\n\
    \n当今的数据库需求往往过于复杂，传统数据库服务器难以应对。你需要的功能和精确的控制级别根本不可用。也许你需要数据的替代排序标准，或在线程或通信逻辑上做特殊处理。\n\
    \nFairCom 的 c-tree® Server SDK 允许你创建一个定制化、工业级服务器，专为你的特定需求设计。使用 FairCom 拥有超过 20\
