    \ 或类似工具，可以从中获取打印机名称。否则，请在 /var/spool/lpd/ 中查找打印机名称。Emacs 可以使用任何可以定义本地队列的打印机，包括远程打印机。\n\
    \n有两个变量用于指示打印机，一个用于 PostScript 打印，一个用于非 PostScript 打印。下面代码展示了我在 Linux 和 Windows\
