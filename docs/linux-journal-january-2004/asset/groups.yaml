    ## Laptopia


    您下一台笔记本电脑能与 Linux “即插即用” 吗？而且您什么时候才能买到没有专有操作系统的主流品牌笔记本呢？BY DOC SEARLS


    让我们对 Linux 征服计算机硬件类型的进度做一个勾选框报告。我们从顶部开始逐项检查：


    - 大型机

    - 大型企业数据库机器

    - 大型计算农场

    - 对称多处理机

    - 中小型企业机器

    - 工程工作站

    - 台式机

    - 笔记本电脑

    - 上网本

    - PDA

    - 嵌入式设备


    看起来相当不错。在高端，随着 2.6 内核开始确立自身地位，收益将会增加。在低端，竞争几乎已经结束。CACMedia（cacmedia.tv）总裁兼首席执行官
    Ken Nelson 以及消费电子业务的资深人士告诉我，Linux “拥有嵌入式类别”。甚至微软也是遥远的追随者。


    突出的例外是台式机、笔记本电脑、上网本和 PDA。而在这四者中，最重要的是笔记本电脑。那里是个人计算重心正在移动的地方。过去一年，“桌面替代” 成为领先的笔记本电脑类别，也是市场正在发生的事情的描述。得益于桌面级功能和无线网络的增长，支持
    Wi-Fi 的笔记本电脑正在对台式机做着手机对座机所做的事情。因此，在工作中，台式机正变成立方体，而在家中，它们正在演变成肯定会取代电视成为家庭娱乐中心设备的形式。


    与此同时，笔记本电脑每天变得更具功能性。花费不到 2,000 美元，您就可以获得一台高速笔记本电脑，配备


    1600 × 1200 显示屏、1GB 内存、80+GB 存储、良好的音响系统、一流的图形子系统以及可刻录和播放 CD 和 DVD 的驱动器。仅就显示而言，笔记本电脑完胜台式机。正如一家硬件公司高管所说，“你想要一个两百万像素的显示器——买一台大屏幕笔记本电脑。它的价格与独立显示器处于同一范围。”


    Linux 并没有推动这些发展；苹果和微软才是推动者。尽管其中涉及的创新值得尊重（功劳归于：有很多，尤其是苹果方面），杠杆来自制造公司之间的关系。得益于笔记本电脑制造商与图形子系统来源——NVIDIA
    和 ATI——之间的设计协议，新的 Mac OS X 和 Windows 笔记本电脑可以以最少的 CPU 参与播放 DVD。Linux 尚无此特权——还不。


    Linus 在 2003 年 9 月 Linux Lunacy Geek Cruise 上发表的长篇讲话中解释了这种情况：


    > > 坦率地说，没有任何笔记本电脑厂商真正支持 Linux。说实话。有些厂商会做一些表面功夫。如果不是太痛苦，他们会在某些配置下支持 Linux。但支持程度往往只是可以的（有限度）。它可能不会被挂起。它可能实际上并不能完成你希望笔记本电脑完成的一半功能。但你可以在上面运行
    Linux。我预计随着公司开始在桌面上更多使用 Linux，这种情况会发生变化。如果你有几家大公司只是说，“嘿，Linux 必须在我们的笔记本电脑上工作”，硬件制造商突然会非常在意……


    所以，好消息是笔记本电脑正在远离那种嵌入式机器的类型。它们变得越来越标准化。尤其是像 Centrino 这样的芯片组。如果你使用 Pentium-M 而不使用
    Centrino，你就是在做错事——除了它们不支持（802.11）A&G；而且现在你还不能为 Linux 获取 Centrino 驱动程序……


    我也听说它们存在，但英特尔的其他人说“那是胡说。我们在路线图上有，但还没能让它运行起来。”他们一直承诺在 2004 年推出，但我绝不是英特尔发言人。所以我不知道实际日期是什么。但据说会到来。


    问题是，当你组装一台笔记本电脑时，以前你必须在人们的后院搜刮来找到奇怪的硬件零件才能让一切都合适。而这肯定正在消失。这不仅仅是 Centrino。取而代之的是，有数百种不同的芯片组以数百万种不同的方式连接，你将只有大约五种不同的芯片组，而且你无法以任何其他方式连接它们，只能以它们被连接的方式连接。这只是会发生。


    这就是十年前我们在桌面上拥有的东西。Compaq 制造了不太标准的自有 PC 台式机。实际上 HP 更糟。这只是因为标准芯片组而消失了。现在笔记本电脑领域也开始发生这种情况。所以，一年后，我预计……假设我们能解决那些
    ACPI 问题……当你买一台笔记本电脑时，它更有可能“即插即用”。


