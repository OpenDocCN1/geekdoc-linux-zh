    \ 的定义中添加另一对括号，插入短语 font . 并插入一对引号。然后使用 Ctrl-Y 恢复引号之间的字体定义，就像其他任何剪贴板条目一样：\n\n```\n\
    (font . \"-adobe-courier-*-r-*-*--140-*-*--*--*-\")\n```\n\n如果你想知道我的截图中的颜色是怎么来的，就是这么做的。\n\
    \n如果你在使用这些设置时遇到问题，请在你的 .Xresources 文件中查找任何 Emacs 设置。 .Xresources 中的任何设置都会覆盖这些定义。要去掉覆盖\n"
