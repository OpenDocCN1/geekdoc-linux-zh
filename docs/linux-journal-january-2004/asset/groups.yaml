    ![](img/3e9d313887e2c1cabeb5043769cbf08f_94_0.png)


    图 3. 使用 X 的实用程序 xfonts.el 选择字体


    fonts， 在 .Xresources 文件中将其注释掉并重新启动 X。


    直到最近，Emacs 还不支持可变宽度字体，而固定宽度字体对于大多数用途来说已经足够。但随着最近版本中对比例字体和非英语字符集的支持，您现在可以在 Emacs
    中定义自己的字体集。字体集允许像文字处理器一样轻松控制字体。例如，请查看 Emacs Info 和 Customize 菜单中的标题；另请参阅 Emacs
    关于字体集的 info 节点。


    有关 X 下字体的更多信息，请参阅 Emacs 的 info 节点“字体规范选项”。


    ## 速度条


    我在讨论 Customize Emacs 系统时解释了如何自动化打开速度条。Speedbar 是一个单独的框架（窗口），允许通过鼠标点击在 Emacs 缓冲区之间导航。如插图所示，速度条允许树状结构，如
    Emacs 的 Info 系统。点击 + 打开子节点，点击 – 关闭它们（图 4）。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_94_1.png)


    图 4. Emacs 的速度条点选浏览界面


    当你在某些模式下编辑时——例如 Rmail、Info 和 GUD——速度条会显示该模式下可供编辑的其他选择。例如，当你在 Info 模式下时，速度条会显示节点。否则，它会显示当前缓冲区中文件所在目录中的文件。


    如果你在 Emacs 中打开了大量文件，速度条是一个有用的工具。我经常同时打开超过 30 个文件，速度条帮助我管理和在它们之间切换。


    ## Emacs 用于电子邮件


    在 2003 年 3 月的《Linux Journal》文章“Getting Started with Emacs”中，我演示了如何将 Emacs 用作服务器，让
    crontab 和 mutt 等程序使用 Emacs 进行文件编辑。为了进一步扩展，你可以将 Emacs 用作任何可以调用外部编辑器的应用程序的编辑器，包括邮件阅读器。然而，Emacs
    至少有两个邮件模式和一个功能强大的新闻阅读器 GNUS。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_94_2.png)


    图 5. Emacs 邮件模式中的电子邮件骨架


    要发送消息，Ctrl-X M（或 M-X mail）会进入邮件模式。只需编辑消息并发送即可（图 5）。如屏幕截图所示，你会看到一个准备好填写空白的电子邮件骨架。使用控制字符序列移动到（并创建）额外的头，如
    FCC。在头中使用制表符补全。它会查看本地系统用户以及你在 .emacs 中定义的任何电子邮件别名的内容。


    你可以使用 Ctrl-C Ctrl-W 插入签名，或者通过在 .emacs 文件中将 mail-signature 设置为 t 让 Emacs 为你完成。如果你想更高级一些，可以编写一个
    Lisp 程序，根据……好吧，任何你可以用 Lisp 代码检测到的内容为你选择签名。


    你可以在消息上运行拼写检查。输入 M-X ispell-message 只检查消息的主体，


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_94_3.png)


    跳过任何引用内容。


    ## 阅读邮件


    在 Emacs 中，使用 rmail 模式（M-X rmail）阅读和回复你的来信（图 6）。你可能想要创建一个摘要缓冲区或通过修改 rmail 模式钩子来自动化它。这会创建一个大多数用户熟悉的缓冲区：每条消息一行，包含日期、来源电子邮件地址、数据大小和主题。如图
    7 所示，rmail 缓冲区中的消息以绿色高亮显示。正常的 Emacs 导航键在摘要缓冲区中有效。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_95_0.png)


    图 6. rmail 模式中的电子邮件消息


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_95_1.png)


    图 7. 带摘要的 rmail 模式


    为了适应多个操作系统，Emacs 邮件以一种有些复杂的方式运行。当你启动一个 rmail 缓冲区时，它会将邮件从你的收件箱文件（在 Linux 上通常位于
    /var/spool/mail）移动到文件 ~/RMAIL 中。这就是你通常编辑的文件。你可以随时使用 G 键将电子邮件放入 ~/RMAIL。如果你有 POP
    或 IMAP 账户，请尝试使用 fetchmail 将邮件放入收件箱。


    Emacs 使用 Babyl 邮件文件格式。你可以将单个消息导出为文本文件；整个 rmail 文件可以以 mailbox 格式导出。


    大多数邮件阅读器使用多个邮件文件（如果使用 maildir 邮件格式，则为目录）。Emacs 可以从一个 rmail 文件切换到另一个，但你可能不需要这样做。相反，你可以使用正则表达式和其他搜索模式创建自定义摘要。你可以根据收件人、主题内的正则表达式搜索或标签指定摘要。


    你可以拥有多个 rmail 文件并将每个文件与一个或多个收件箱关联。这意味着那些已经运行垃圾邮件过滤器（如 SpamAssassin）或使用 procmail
    配方将电子邮件投递到单独文件的人无需放弃这项投资。每次访问 rmail 文件时，Emacs 都会从关联的输入文件中获取任何新邮件。


    你可以在 rmail 模式下回复和转发电子邮件。两者都会打开一个邮件模式缓冲区，其中电子邮件头已完成。你可以使用 Ctrl-C Ctrl-Y 将你要回复的消息
    yank 进来。如果你想回复多封电子邮件，请切换到 rmail 缓冲区，选择不同的消息，切换回来并 yank 新的当前消息。为了符合 RFC，你必须通过自定义
    mail-yank-prefix 使其使用字符串 > 来设置引用字符。


