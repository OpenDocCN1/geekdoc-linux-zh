    \ {\n    fprintf(out, \"%c\", data[addr_offset]);\n}\n    free(data);\n}\n}\n\
    ```\n\n现在我们能够签名内核模块并且内核知道如何检测此签名，剩下的唯一部分就是将我们的公钥放入内核中，以便它能够成功解密签名。最近在 linux-kernel\
    \ 邮件列表上有很多讨论集中在如何在内核中正确处理密钥上。该讨论产生了关于如何在 2.7 内核系列中处理此方面的一些良好提案。但现在，我们不担心以灵活的方式正确处理密钥，所以我们直接将其编译进去。\n\
    \n首先我们需要获取一份公钥的副本。为此，请告诉 GPG 将密钥提取到名为 public_key 的文件中：\n\n```\n$ gpg --export\
    \ -o public_key\n```\n\n为了帮助操作 GPG 公钥，爱立信的一些开发人员创建了一个名为 extract_pkey 的简单程序来帮助将密钥拆分为不同的部分。我修改了该程序以生成公钥的\
    \ C 代码。\n\n运行 extract_pkey 程序并将其指向你之前生成的 public_key 文件。让它将输出发送到名为 rsa_key.c 的文件：\n\
    \n```\n$ extract_pkey public_key > rsa_key.c\n```\n\n完成此步骤后，将该 rsa_key.c 移动到 security/rsa/\
    \ 目录中的文件顶部，用你的公钥替换我的公钥：\n\n```\n$ mv rsa_key.c ~/linux/linux-2.6/security/rsa/\n\
    ```\n\n现在你已经生成了一对公钥和私钥 RSA 密钥对，并将你的公钥放入内核目录。构建补丁后的内核，确保选择模块签名检查选项，然后安装它。如果你在该内核中启动，你将只允许加载用你的密钥签名的模块，所以要小心，只在开发机器上进行测试。\n\
    \n## 还剩下什么要做？\n\n如本文所示，生成密钥、签名内核模块并将公钥放入内核映像需要多个不同的步骤。这仍然是一个粗糙的开发项目。为了使其对内核开发人员和\
    \ Linux 社区总体上更可接受，这些步骤需要自动化，使其更容易签名所有内核模块并处理公钥。\n\n除了明显需要简化此功能的使用之外，该项目的一些其他未来目标包括：\n\
    \n- 将 RSA 代码移入通用加密框架，允许其他内核功能使用它。\n- 允许内核中存在多个公钥，让来自多个来源的签名内核模块在单台机器上运行。\n- 简化签名逻辑以允许使用\
    \ GPG 的原生签名功能或 bsign 程序提供的功能，而不是自定义的 mod 程序。\n\n## 致谢\n\n我谨向爱立信的开发人员表示感谢，他们创建了名为\
    \ digsig 的内核补丁和程序，允许我使用他们移植到内核的 GPG。我以前也做过，但实现很糟糕；幸运的是，他们发布了他们的移植版并且非常有帮助。digsig\
    \ 内核补丁允许用户签名程序并阻止内核运行任何未签名的程序。有关此项目的更多信息可在 sourceforge.net/projects/digsig 找到。\n\
    \n我还要感谢我的雇主 IBM 允许我从事该项目，以及 Don Marti 催促我完成它并撰写本文。\n\nGreg Kroah-Hartman 目前是各种不同驱动程序子系统的\
    \ Linux 内核维护者。他在 IBM 工作，从事与 Linux 内核相关的工作，可以通过 greg@kroah.com 联系到他。\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_54_0.png)\n\
    \n## Cacti: www.raxnet.net/products/cacti\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_54_1.png)\n\
    \nCacti 在某些方面与 MRTG 相似，但设置和维护更容易，并且默认情况下绘制的不仅仅是流量。但一些 Cacti 用户并未止步于此；他们绘制了 Web\
