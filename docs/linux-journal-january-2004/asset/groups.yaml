    ## 使用 Xnee 测试应用程序


    你的点击手指因测试 GUI 程序而疼痛吗？用 Xnee 脚本化你的回归测试。


    BY HENRIK SANDKLEF


    Xnee 可以在会话期间记录用户操作然后重放这些操作。通过在测试程序时记录会话，Xnee 可以在以后自动为你测试程序。这些测试会话可以在每次发布前或每晚重放，以确保程序的质量。听起来很容易吗？几乎如此。


    Xnee 不仅测试 GUI。你也可以通过制作几个测试脚本来测试命令行程序的所有选项并分析结果，从而使用 Xnee 测试命令行程序。Xnee 还被用于测试通过拥有众多瘦客户端的大型网络发送了多少流量。如果想同时在多台机器上测试相同的情况，已添加了将事件分发到多个显示器的支持。除了测试程序之外，Xnee
    还用于演示程序。在这种情况下，Xnee 充当耐心演示者，反复做同样的事情而不抱怨。


    ### Xnee 的历史


    1997 年，Henric Johansson 和我撰写了关于记录和重放 X 事件的硕士论文。我们为一家瑞典公司的内部用途实现了一个非自由的记录器和重放器。找到工作后，我经常缺乏
    X11 的免费测试程序，所以我决定利用论文中获得的经验自己实现一个。Xnee 项目始于 1999 年夏季，并从一开始就采用 GPL 许可。2002 年 11
    月，版本 1.0 发布，到 2003 年 2 月底，Xnee 被命名为 GNU 软件包。


    ### 介绍


    在继续 Xnee 之前，这篇简短的 X 介绍解释了本文中使用的许多术语。X 是一个面向各种平台的基于窗口的用户界面系统。X 服务器是一个处理所有硬件并实际在屏幕上绘图的程序。在
    GNU/Linux 系统上，XFree86 是使用最广泛的 X 服务器。X 程序被称为客户端；例如 xterm 和 Galeon。客户端使用 X 协议与 X
    服务器通信。


    本文集中于用于在 X 服务器与其客户端之间发送信息的包。这些包称为 Event、Request、Reply 和 Error，在本文中称为协议数据。以下列表显示了


    ### X11 协议数据描述：


    - Request 是由客户端发送到服务器。服务器被要求执行某些操作或发送某些信息。

    - Reply 是服务器作为对客户端某些请求的响应发送给客户端的。并非所有请求都会得到回复。

    - Event 是服务器发送给客户端以通知客户端用户输入或发生了一些客户端可能想要处理的事件，例如客户端失去焦点。

    - Error 是服务器在请求无效时发送给客户端的。


    这里最有趣的是，每当用户使用鼠标或键盘与计算机交互时，X 服务器就会向适当的客户端发送一个或多个事件。其中一些事件直接来自用户输入。这些事件被称为设备事件。设备事件为
    ButtonPress、ButtonRelease、MotionNotify、KeyPress 和 KeyRelease。如果我们能在会话期间记录所有这些事件，我们将拥有用户执行的所有操作的完整描述。如果我们有一个机器人可以读取这些事件，即使它们打印在文件或纸上，机器人就可以像记录时用户那样与系统交互，我们就拥有了一个测试机器人。或者，更好的是，如果我们有伪造这些事件的支持，我们将拥有一个由软件组成的测试机器人。幸运的是，X
    中同时存在记录和重放的支持。


    要记录 X 协议数据，我们可以使用 RECORD 或 XTrap 扩展。还有其他记录方式，例如嗅探 X 套接字，但我们将重点关注 RECORD，因为 Xnee
    使用它。要重放事件，我们可以使用 XTest 扩展和 RECORD 扩展。在重放期间，RECORD 扩展用于同步重放时发生的事情与会话记录时发生的事情。


    RECORD 扩展会将客户端和服务器之间发送的数据副本发送给请求它的客户端。使用 RECORD 扩展，Xnee 可以记录用户想要的所有协议数据并将其保存到文件中以便以后重放。


    XTest 扩展可以重现或伪造所有设备事件。此扩展允许 Xnee 伪造用户操作，例如移动指针、按下和释放键或按下和释放按钮。无法重放其他数据。


    ### Xnee 安装


    Xnee 是一个 GNU 软件包，其源代码可以在 Xnee 主页上找到。下载最新源代码；截至本文撰写时，最新版本为 1.0.6。提取软件包，然后配置、构建并安装它：


    ```

    tar zxvf xnee-1.0.6.tar.gz

    cd xnee-1.0.6

    ./configure

    make

    make install

    ```

