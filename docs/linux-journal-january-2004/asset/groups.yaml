    # Reading Mail


    In Emacs, read and reply to your incoming mail with rmail mode (M-X rmail) (Figure
    6). You may want to create a summary buffer or automate it by modifying the rmail
    mode hook. This creates a buffer familiar to most users: one line per message
    with the date, source e-mail address, data size and subject. As you can see in
    Figure 7, the message in the rmail buffer is highlighted in green. The normal
    Emacs navigation keys work in the summary buffer.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_95_0.png)


    Figure 6. An E-mail Message in rmail Mode


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_95_1.png)


    Figure 7. rmail Mode with a Summary


    Emacs mail operates in a somewhat convoluted way in order to accommodate multiple
    operating systems. When you start an rmail buffer, it moves mail from your inbox
    file, typically in /var/spool/mail on Linux, into a file, ~/RMAIL. This is the
    file you normally edit. You can put e-mail into ~/RMAIL at any time with the G
    key. If you have a POP or IMAP account, try using fetchmail to put your mail in
    the inbox.


    Emacs uses the Babyl mail file format. You can export individual messages as text
    files; entire rmail files can be exported in mailbox format.


    Most mail readers use multiple mail files (directories, if they use maildir mail
    format). Emacs can shift from one rmail file to another, but you may not need
    to. Instead, you can create customized summaries using regular expressions and
    other search patterns. You can specify summaries based on recipients, a regular
    expression search within the subject or labels.


    You can have multiple rmail files and associate each one with one or more inboxes.
    This means that folks with spam filters, such as SpamAssassin, already running
    or using procmail recipes to deliver their e-mail to separate files need not abandon
    that investment. Each time you visit an rmail file, Emacs gets any new mail from
    the associated input files.


    You can reply and forward e-mail in rmail mode. Either


    one opens up a mail mode buffer with the e-mail headers already completed. You
    can use Ctrl-C Ctrl-Y to yank in the message to which you are replying. If you
    want to reply to multiple e-mails, switch to the rmail buffer, select a different
    message, switch back and yank the new current message. To be RFC-compliant, you
    will have to set the quoting character by customizing mail-yank-prefix to use
    the string >.


