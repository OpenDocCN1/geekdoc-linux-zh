    \ 与 Ada 之间差异的更完整总结。\n\n--\nRodney M. Bates\n\n## TALOSS 参与者\n\n在 2003 年 11 月刊中，《TALOSS（三维高级定位观测潜艇软件）》文章的致谢被不慎遗漏。NUWC\
    \ 的 Ken Lima 先生是 TALOSS 概念的提出者和项目经理，没有他的领导该项目就不可能完成。作者还想感谢海军研究办公室（ONR）第 311 代码（Paul\
    \ Quinn 先生、Gary Toth 先生和 Larry Rosenblum 博士）为完成项目提供的资金。\n\nONR（Rosenblum 博士）资助亚利桑那州立大学的\
    \ Gregory Neilsen 博士和 Gary Graf 先生开发计算 TALOSS 中不规则三维区域交集的软件。该软件与主题文章中所述包含在 TALOSS\
    \ 中的软件相同。其发明人（Graf、Nielsen、Lima 和 Drury）已为该软件准备了专利申请。\n\nTALOSS 软件的大部分是在弗吉尼亚理工大学由\
    \ NUWC 指导下由研究生 Fernando DasNeves 编写的。他的工作资金由 ONR（Rosenblum 博士）管理的 NAVCITT II 弗吉尼亚理工大学资助提供。\n\
    \n海军研究实验室将该实验室在三维渲染和可视化方面的专业知识贡献给了由 NUWC 主导的项目。NRL（最初是 Rob King 先生）对 TALOSS 沉浸式变体中的三维交互设备进行了研究。随后，时任\
    \ NRL 员工的 Douglas Maxwell 先生使用数字海图数据库在 TALOSS 中开发了一种基于三维网格的海底渲染方法。Maxwell 先生还开发了\
    \ TALOSS 中使用的碰撞检测算法。自一年前加入 NUWC 以来，Maxwell 先生在项目中的主要角色是技术顾问。\n\nNUWC 的 Richard\
    \ Shell 先生过去三年担任 TALOSS 项目的技术负责人。Todd Drury 先生是 TALOSS 的 NUWC 软件开发负责人，过去三年负责 TALOSS\
    \ 软件的设计和开发。目前在 TALOSS 中实施并在《Linux Journal》文章中提及的底部渲染方法是由 Drury 先生完成，Maxwell 先生的方法作为后续候选。几月前已为该软件提交了专利。\n\
    \n作者对这些致谢的不慎遗漏表示遗憾。感谢所有参与者的辛勤工作和奉献精神，该项目取得了巨大的成功。\n\n--\nDouglas B. Maxwell, MSME,\
    \ Research Scientist/Mechanical Engineer, Naval Undersea Warfare Center\n\n##\
    \ 请多介绍集群应用\n\n我一直有一种个人挥之不去的好奇，想用几台 readily available 的机器搭建自己的家庭集群。建好之后，我能做什么呢？关于这个问题，你们的\
    \ 2003 年 11 月刊很棒，但缺少了我最想了解的一点。能否考虑一篇介绍集群可用不同应用的文章？\n\n--\nS. B.\n\n## Linux 培训？\n\
    \n作为一名自学的 Linux 用户，我非常喜欢并感激 LJ 发表的资讯。我想了解更多，正在寻找 Linux 课程，但似乎只能找到偶尔的 Linux 大会或提供\
    \ Linux 认证的工作坊。获得 Linux 认证是我的目标，但我知道我仍需要课堂学习。你能指点我正确的方向吗？谢谢！继续加油！\n\n--\nJason\
    \ Fales, Dallas, Texas\n\n试试 lintraining.com 上的目录。——编者。\n\n## fgets 很好，gets 很坏\n\
    \n我很喜欢 2003 年 11 月刊中 Cal Erickson 的文章《Writing Secure Programs》，并且肯定会去查看\n\nFlawFinder\
    \ 和其他工具。一个小问题：不要在读取数据时使用 fgets，因为这会导致溢出。我认为这是一个笔误；应该是 gets...会导致溢出，因为 fgets 有长度参数。\n\
    \n--\nCollin Park\n\n> 你说得对。一旦你完成了要求使用 gets 的那个 C 语言入门课程，你就再也不会使用它了。——编者。\n\n\
    ## 生物信息学软件的许可\n\n在 2003 年 11 月刊封面文章《Sequencing the SARS Virus》中，Krzywinski 和 Butterfield\
    \ 将 phred、phrap 和 consed 称为人类基因组计划的开源主力。虽然这些程序确实是生物信息学主力，并且在它们可获得的免费用学术许可条款下，按专有软件标准来看相当慷慨，但其分发条款至少在歧视从事领域方面不符合开放源码定义。条款适用于学术或非营利用途，但不适用于商业用途（开放源码定义版本\
    \ 1.9，第 6 节）。\n\n文章中提到的另一主力 BLAST 已分化为两个主要分支，一个属于公共领域（可从国家生物技术信息中心 [NCBI] 获得），另一个的分发方式与\
    \ phred、phrap 和 consed 类似。\n\n--\nD. Joe Anderson\n\n## 勘误\n\n2003 年 10 月，第 88\
    \ 页：David Gordon 和 Ibrahim Haddad 的文章《Building a Linux IPv6 DNS Server》中的清单 1，在前两行之后应有一个闭合大括号。\n\
