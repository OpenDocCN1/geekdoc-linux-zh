    \ you print multiple pages on a sheet of paper.\n\n### Font Selection\n\nEmacs\
    \ supports multiple frames or windows. You can launch another frame with Ctrl-X\
    \ 5 2, or remove one with Ctrl-X 5 0. The initial frame created when Emacs is\
    \ launched has a number of graphics characteristics defined by the variable initial-frame-alist.\
    \ Subsequent frames are governed by default-frame-alist. Use these two variables\
    \ identically. Each variable is a list of sub-variables and their values, rather\
    \ like a hash in Perl. For example, to set the initial position of the first frame\
    \ on the screen, use:\n\n```\n(setq initial-frame-alist\n  '((top . 40) (left\
    \ . -15)\n    (width . 96) (height . 40)\n    (background-color . \"Gray94\")\n\
    \    (foreground-color . \"Black\")\n    (cursor-color     . \"red3\")\n    (user-position\
    \ t)\n  ))\n```\n\nThis definition sets the Emacs initial frame 40 pixels from\
    \ the top of the screen, 15 pixels from the right (hence the negative number for\
    \ left), with a width of 96 characters and a height of 40 lines. It sets the default\
    \ background and foreground text colors and then sets the cursor color.\n\nThis\
    \ definition is also where you set your font, if you don’t like the default. The\
    \ program xfontsel comes with XFree86, and you can use it to find a suitable font\
    \ (Figure 3). Press Select as an option, and xfontsel puts it into the clipboard.\
    \ Add another pair of parentheses to the definition of initial-frame-alist, insert\
    \ the phrase font . and insert a pair of quote marks. Then recover the font definition\
    \ between the quotes with Ctrl-Y, like any other clipboard entry:\n\n```\n(font\
    \ . \"-adobe-courier-*-r-*-*--140-*-*--*--*-\")\n```\n\nIf you are wondering how\
    \ I get the colors in my screenshots, that’s how I do it.\n\nIf you have problems\
    \ with these settings, look in your .Xresources file for any Emacs settings. Any\
    \ settings in .Xresources overrides these definitions. To get rid of the over-\n"
  mdcn: "\n## 中级 Emacs 黑客技术\n\n将 Emacs 变为你首选的编辑器，使用这个简单的定制工具。BY CHARLES CURLEY\n\n\
