    ## NEC 源代码？


    我对您关于 NEC 容错服务器的文章 [LJ, 2003 年 10 月] 非常感兴趣。我是阿根廷布宜诺斯艾利斯的一名 IT 顾问，接触过一些容错和关键任务应用。四五个月前，我联系了
    Aspire Communications 的 John Fitzsimmons 先生，希望帮助我获取 NEC 的 FT Linux 源代码。据我所知，该软件必须根据
    GPL 发布，但截至今天我仍无法获得该软件。因此，从您的文章中得知“...NEC 告诉我们他们坚定致力于根据 GPL 向公众发布所有更改。”真是太好了。我想我只需要再等一会儿。您对该发布有大约的日期吗？


    还有一点，正如文章所述，“在撰写本文时，NEC 正在审查和记录其内核更改，以便计划通过 OSDL 的 Carrier Grade Linux 项目进行公开发布...”，您能告诉我该如何从
    OSDL 获取该发布吗？它将对公众开放还是仅限 OSDL 成员？


    --

    Pablo J. Rogina, IT Consultant


    > *Dan Wilder 回复：我目前不了解此类发布。我将此消息抄送给 Fitzsimmons 先生，希望他能发表评论。*


    ## 仅电子订阅？


    只是想知道您是否会为 Linux Journal 提供电子版订阅。对于海外读者来说，订阅费有点贵。我想那是由于运费造成的。如果您能以与美国国内订阅费相同或更低的价格提供电子版作为订阅选项，那就太有帮助了。

    --

    Simon


    > *你不是第一个问这个问题的人。我们目前还没有这样做，但我已请我们的订阅部门调查是否可以做到。——编者。*


    ## Mick 的 LDAP 和 IMAP 更正


    我在“使用 LDAP 和 IMAP 安全邮件，第一部分”[LJ, 2003 年 11 月] 文章中有两个错误。首先，文章早期我提到（关于 Cyrus IMAP）“...使用数据库而不是平面文件来存储消息具有明显的性能优势。”实际上，虽然
    Cyrus IMAP 确实用数据库文件对消息进行索引，但它将消息本身存储为单独的平面文本文件。


    其次，文章后面我正确指出，要在 SuSE 上配置 Cyrus SASL 以使用 LDAP，必须编辑 /etc/sysconfig/saslauthd 中的参数
    SASLAUTHD_AUTHMECH。问题是，SuSE 中的 Cyrus SASL 包未编译 LDAP 支持。您要么需要使用 SuSE 的 cyrus-sasl2
    source-RPM（SRPM）构建自己的 LDAP 启用包，要么完全放弃 SASL 中的直接 LDAP 支持，转而使用默认已编译的 PAM 方法。在后一种情况下，您需要安装
    pam_ldap 模块，然后创建一个文件 /etc/pam.d/imap，包含以下行：


    ```

    #PAM-1.0

    auth    required    /lib/security/pam_ldap.so

    account required    /lib/security/pam_ldap.so

    ```


    接下来，将文件 /usr/share/doc/packages/pam_ldap/ldap.conf 复制到 /etc/openldap/ldap.conf，并根据您的环境进行编辑（最相关的设置是
    host、base、binddn、bindpw 和 TLS_REQCERT）。最后，编辑 /etc/sysconfig/saslauthd 以包含以下行：


    ```

    SASLAUTHD_AUTHMECH=pam

    ```


    对于这两个错误可能造成的任何混淆或不便，我深表歉意。

    --

    Mick Bauer


    ## 忙碌的主厨正在撰写另一本书


    Tinyminds 的 Tony Brijeski（Fragadelic）


    最近有幸与 Marcel Gagné 在咖啡馆坐下，问了他一些关于他最近出版的书籍《Moving to Linux: Kiss the Blue Screen
    of Death Goodbye》以及他对 Linux 今天的看法的问题。他甚至透露了正在撰写的新书；您必须阅读采访才能在 www.tinyminds.org
    上了解详情。


    --

    Mark Angeli


    ## Modula-3 比 C++ 和 Ada 更好


    这是对 Dennis Ludwig 在 2003 年 11 月刊中来信“ Ada 并非糟糕” 的回应。我是 Dennis Ludwig 声明“我从未遇到过真正了解该语言的
    Ada 批评者”的反例。我在 Ada 上编程，主要是从 1986 年起全职工作，在三家 Ada 编译器上进行过严肃的开发工作，并在十多年里担任过驻地 Ada
    语言律师。它很糟糕，我讨厌它。话虽如此，它也不及 C++ 那样糟糕，Ludwig 主要将 Ada 与之比较。我确实同意他引用的网络文章中的许多内容。两种语言都以相似的程度过度复杂化。大多数在任一语言中工作的程序员甚至远未理解其语言。至少
    Ada 是强类型安全的，而 C++ 继承了 C 的所有最糟糕的类型不安全和“未定义”行为，因此在 Ada 中缺乏理解更可能表现为编译错误而不是错误。


    但最好的语言，如 Pascals、Modula-2 和 Oberons，简单程度高出一个数量级，其中一些具有与 Ada 相当的有用功能列表。我最喜欢的是 Modula-3，其语言定义比
    Ada 小十倍。它具有更灵活的类型安全分离编译、更强大的信息隐藏功能以及垃圾回收或

