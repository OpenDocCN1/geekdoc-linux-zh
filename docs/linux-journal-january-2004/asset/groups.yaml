    \ MTA 将电子邮件传递到 Cyrus IMAP 的主题之前，先说几句关于 Cyrus IMAP ACL 的话。\n\n## Cyrus IMAP ACLs\n\
    \nCyrus IMAP 系统中的每个邮箱都可以关联一个或多个 ACL，其中每个 ACL 定义给定用户对所引用邮箱或文件夹可以执行的操作。默认情况下，新邮箱只有一个\
    \ ACL，该 ACL 授予邮箱所有者对邮箱的完全管理权限。\n\n有趣的是，管理员默认情况下对新邮箱只有查找和管理权限。您可以使用 listmailbox\
    \ 命令查找邮箱的名称，并且可以设置其 ACL。但如果需要删除邮箱，您首先必须为邮箱创建一个 ACL，授予您的管理账户管理权限。这是一个功能，而不是错误；它有助于防止意外删除。\n\
