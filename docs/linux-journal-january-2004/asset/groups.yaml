    将 dcache_rcu 补丁应用于 Linux 2.4.17 内核后，在 8 CPU PIII Xeon 服务器上，SPECweb99（不含 SSL）的吞吐量从
    2,258 提高到 2,530，改善了 12%。将同一补丁应用于 Linux 2.5.40-mm2 内核后，Linux 内核构建所消耗的系统时间从 47.548
    CPU 秒减少到 42.498 CPU 秒，减少了超过 10%。在运行 Linux 2.5.42 内核的单处理器 700MHz PIII Xeon 系统上进行的类似测试显示没有变化。综上所述，dcache
