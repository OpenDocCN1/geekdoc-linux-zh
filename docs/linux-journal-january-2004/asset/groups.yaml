    Until recently, Emacs had no support for variable-width fonts, and fixed-width
    fonts are fine for most purposes. But with support for proportional fonts and
    non-English character sets included in recent versions, you now can define your
    own sets of fonts within Emacs. Fontsets allow word-processor ease of control
    over fonts. For examples, take a look at the headers in Emacs'' Info and the Customize
    menus; see also Emacs'' info nodes on fontsets.


    For more information on fonts under X, see Emacs'' info node on Font Specification
    Options.


    # The Speedbar


    I explained how to automate turning on the speedbar in the discussion of the Customize
    Emacs system. Speedbar is a separate frame (window) that allows mouse-click navigation
    among Emacs buffers. As you can see from the illustration, the speedbar allows
    for tree structures, like Emacs'' Info system. Click on the + to open subnodes,
    and click on the – to close them (Figure 4).


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_94_1.png)


    Figure 4. Emacs'' Speedbar Point-and-Click Browsing Interface


    When you are editing in certain modes—Rmail, Info and GUD, for example—the speedbar
    shows other selections to be edited in that mode. For example, when you are in
    Info mode, the speedbar displays nodes. Otherwise, it shows files in the directory
    where the file in the current buffer is located.


    If you have a lot of files open in Emacs, the speedbar is a useful tool. I often
    have more than 30 files open simultaneously, and the speedbar helps me manage
    and switch between them.


    # Emacs Is for E-mail


    In the article “Getting Started with Emacs”, LJ, March, 2003, I demonstrated how
    to use Emacs as a server, letting programs like crontab and mutt use Emacs for
    file editing. To carry this further, you can use Emacs as the editor for any application
    that can call on an external editor, including mail readers. However, Emacs has
    at least two mail modes and a powerful newsreader called GNUS.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_94_2.png)


    Figure 5. A Skeleton E-mail in Emacs'' Mail Mode


    To send a message, Ctrl-X M (or M-X mail) puts you in mail mode. Simply edit a
    message and send it (Figure 5). As the screen capture shows, you see a skeleton
    of an e-mail ready for you to fill in the blanks. Use control character sequences
    to move to (and create) additional headers, like FCC. Use tab completion in the
    headers. There, it looks at local system users and the contents of any e-mail
    aliases you have defined in your .emacs.


    You can insert your signature with Ctrl-C Ctrl-W, or you can have Emacs do that
    for you by setting mail-signature to t in your .emacs file. If you want to get
    fancy and write a Lisp program to select a signature for you based on, well, whatever
    you can write Lisp code to detect.


    You can run a spell-checker on your message. Entering M-X ispell-message checks
    only the body of the message,


