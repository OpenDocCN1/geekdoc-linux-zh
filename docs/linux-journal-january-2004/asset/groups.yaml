  - '[PAGE 1]


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_1_0.png)


    # Experience the most computing power in the smallest footprint possible...


    The RackSaver® BladeRack™, powered by AMD Opteron™ processors, is designed to
    support a wide variety of enterprise solutions...including yours.


    Over the past 10 years, RackSaver has provided customers in every industry from
    Entertainment to Oil and Gas with the most powerful, reliable, and scalable high
    performance clusters available on the market today. Our customers understand that
    by increasing density in their server room they improve productivity while lowering
    their overall total cost of ownership. In addition, RackSaver offers complete
    onsite enterprise-level support 24 hours a day, 7 days a week to maximize your
    investment protection. Discover why industry leaders like Industrial Light and
    Magic, NVIDIA, Shell, WesternGeco, and Novartis rely on RackSaver for all of their
    high performance computing needs.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_1_1.png)


    # Did we mention that we sell high-end customizable graphics workstations too?


    RackSaver has launched a new line of high-end graphic workstations. NemeSys™,
    powered by the NVIDIA Quadro® FX family, takes the leading design and digital
    content creation applications to a new level of interactivity. For the first time,
    styling and production rendering become integral functions of the design workflow,
    shortening the production process and enabling faster time to market.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_1_2.png)


    # Need a blade solution that can fit under your desk at work and provide more
    power than ever before?


    The HIVE™ houses up to 11 blades that can accommodate a variety of options including
    high-end servers, SAN, NAS-based storage, along with InfiniBand®. Both the 8 blade
    and 11 blade versions are fully compatible with RackSaver''s RS-1100VM BladeRack
    line of products. The HIVE''s innovative cooling technologies are specifically
    designed for the needs of small rack systems and also make them suitable for a
    wide range of environments including military, industrial or a simple office setting.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_1_3.png)


    RackSaver

    Leader in High-Density Servers!


    Start configuring your company''s high performance supercomputing solution now
    by visiting RackSaver online at www.racksaver.com or call one of our Account Managers
    at (888) 942-3800.'
  - "[PAGE 2]\n\n# AMD Opteron™ Specialists\n\n# Largest AMD Opteron™ cluster for\
    \ National Institute of Health installed at the University of Utah.\n\n# Over\
    \ 1,000 CPUs!\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_2_0.png)\n\n# World’s\
    \ Densest Server Rack:\n\nTitan64 SuperBlade™\n130 SERVER BLADES - 260 AMD Opteron™\
    \ and AMD Athlon™ MP Processors in One Rack!\n\nAs clusters become the standard\
    \ in supercomputing solutions, more servers are required to number crunch larger\
    \ and larger datasets. Titan64 SuperBlades™ solve key problems in the growth of\
    \ these clusters in the following fashion:\n\n+   - **Increased density:** 128\
    \ server nodes-plus 2 management nodes per rack\n- **Easy to maintain:** Servers\
    \ are hot-swappable and easy to remove\n- **Easy to manage:** System administrator\
    \ can remotely manage multiple racks simultaneously\n- **Integrate with existing\
    \ datacenters:** Customer specified power connectors, front-to-back cooling\n\
    - **Flexible design:** Option to reduce density of blades and increase 19\" rack\
    \ space\n- **Improve reliability:** Large clusters exhibit problems not found\
    \ in those that are small\n\n+   **Titan64 SuperBlades™ solution:**\n- Reduce\
    \ fan count, use large fans (no small fans or blowers),\n- Eliminate most cables,\
    \ and provide a select indicator for blades to be serviced,\n- LinuxBIOS enabled!\n\
    \n![](img/3e9d313887e2c1cabeb5043769cbf08f_2_1.png)\n\n# Titan64 Creator™ Workstations\n\
    \n# High Performance Computing\n\nThe Titan64 Creator™ is a series of high-performance\
    \ workstations with advanced 8x AGP graphics capabilities integrated with the\
    \ powerful AMD Opteron™ platform to provide a content creation engine for animation,\
    \ 3D modeling, and CAD.\n\n**Cutting-Edge Performance:** 8x AGP graphics performance\
    \ on Microsoft® and Linux® platforms running Maya®, XSI® and many other graphics\
    \ intensive creation applications.\n\nIdeal for NVIDIA® Quadro® FX 1000 by PNY®\n\
    \n**Ultra-Cool Design:** Chassis design based on cooling, functionality and ease\
    \ of access without sacrificing the looks\n\n**Focus On Content Creation:** Our\
    \ workstations and servers have created and rendered movies such as X-Men 2™,\
    \ DAREDEVIL™, Scooby Doo™ The Movie and MIB II™\n\n**Proven Quality:** Our proven\
    \ track record for exceptional quality has enabled our clients to deploy mission-critical\
    \ systems world-wide\n\n* We offer the best price performance in the industry.\n\
    \n![](img/3e9d313887e2c1cabeb5043769cbf08f_2_2.png)\n\n# Titan64 SuperBlades™\
    \ more cost-effective than 1U servers\n\n# AMD Opteron™- based Enterprise Solutions\n\
    \nThe Titan64 Enterprise server is ideal for users who demand high CPU density\
    \ per rack, dependability and serviceability for a broad range of applications\
    \ including storage, web and portal serving, application development, compute\
    \ farms, and security. Designed for mission-critical 24 x 7 x 365 environments,\
    \ the Titan64 Enterprise™ delivers on the promises of 64-bit technology for the\
    \ enterprise today.\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_2_3.png)\n\n#\
    \ The LinuxBIOS Revolution – ideal for blade solutions\n\n+   :: Fast boot time\
    \ (less than 5 seconds)\n:: Improve quality and reduce cost by eliminating HDD\n\
    :: Remote server management\n   • BIOS updates • Console access • Environmental\
    \ monitoring\n   • Debugging failed server\n:: Easy to patch O/S and upgrade server\
    \ software"
  - '[PAGE 3]


    # Get a closer look inside your network


    # Introducing the Cyclades-nQuirer with NetFlow™ support


    The complex networks of today carry all different types of traffic, from customer
    information to viruses that can bring your network to a halt. Having visibility
    over your network traffic is essential for efficient network management and planning.


    With the Cyclades-nQuirer, you can gather traffic data and convert it to NetFlow™
    format, which allows you to consolidate and analyze your network in a higher-level
    format and achieve faster problem solving and increase network uptime. All this
    in compact form factor and at a fraction of the cost of comparable solutions.


    With the Cyclades-nQuirer you will be able to look inside your network and understand
    it like you''ve never had before.'
  - "[PAGE 4]\n\n# LINUX JOURNAL\n\nJANUARY 2004 ISSUE 117\n\n![](img/3e9d313887e2c1cabeb5043769cbf08f_4_0.png)\n\
    \nxephem provides a customized view of the night sky at your location, page 70.\n\
    \n# COVER STORY\n\n# 69 TALON: GPL SOFTWARE FOR TELESCOPE CONTROL\n\nThe open-source\
    \ revolution in astronomy is largely thanks to Talon, the GPL package that handles\
    \ tracking, scheduled operations, environmental monitoring, dome control and even\
    \ image analysis. Our author Tony Steidler-Dennison has set up Talon-based telescopes\
    \ at staffed and automated locations around the world.\n\n# FEATURES\n\n+   -\
    \ **38 SCALING DCACHE WITH RCU**\n  As the number of processors grow, Linux either\
    \ can hit a performance wall or explore new algorithms.\n  PAUL E. MCKENNEY, DIPANKAR\
    \ SARMA AND MANEESH SONI\n- **48 SIGNED KERNEL MODULES**\n  Crypto techniques\
    \ give device drivers a new security check.\n  GREG KROAH-HARTMAN\n- **54 CONTROLLING\
    \ HARDWARE WITH IOCTLS**\n  Control all the little stuff that isn’t in the UNIX\
    \ programming books.\n  LISA CORSETTI\n- **58 UNDERSTANDING CACHING**\n  Use the\
    \ cache right, and your code runs fast.\n  JAMES BOTTOMLEY\n\n# EMBEDDED\n\n+\
    \   - **30 PERSONAL VIDEO RECORDER BASICS**\n  Create a custom PVR that works\
    \ your way and even burns archive copies.\n  CHRISTIAN A. HERZOG\n\n# TOOLBOX\n\
    \n+   - **14 AT THE FORGE**\n  Publishing with Bricolage\n  REUVEN M. LERNER\n\
    - **18 COOKING WITH LINUX**\n  Scalability: from Simplicity Comes Complexity...\n\
    \  MARCEL GAGNÉ\n- **24 PARANOID PENGUIN**\n  Secure Mail with LDAP and IMAP,\
    \ Part II\n  MICK BAUER\n\n# INDEPTH\n\n+   - **69 LINUX, TALON AND ASTRONOMY**\n\
    \  The software that controls research-grade telescopes can control your telescope\
    \ too.\n  TONY STEIDLER-DENNISON\n- **74 MONITORING HARD DISKS WITH SMART**\n\
    \  Keep an eye on your drives’ health with an easy-to-configure tool.\n  BRUCE\
    \ ALLEN\n- **78 LINUX IN AIR TRAFFIC CONTROL**\n  Using Linux as a testing platform\
    \ for mission-critical software.\n  TOM BRUSEHAVER\n- **82 CONTROLLING DEVICES\
    \ WITH RELAYS**\n  Your software can break free of the box and control lights,\
    \ bells and motors in the real world.\n  JASON ELLISON\n- **87 TESTING APPLICATIONS\
    \ WITH XNEE**\n  Give your GUI apps a scriptable test suite with simulated X clicks\
    \ and input.\n  HENRIK SANDKLEF\n- **91 INTERMEDIATE EMACS HACKING**\n  You don’t\
    \ have to be a LISP hacker to customize Emacs.\n  CHARLES CURLEY\n\n# COLUMNS\n\
    \n+   - **36 LINUX FOR SUITS**\n  Laptopia\n  DOC SEARLS\n- **96 EOF**\n  Turning\
    \ IT Certification on Its Ear\n  EVAN LEIBOVITCH\n\n# REVIEWS\n\n+   - **66 IBM\
    \ ESERVER BLADECENTER**\n  DANA CANFIELD\n- **68 HACKING THE XBOX**\n  PAUL BARRY\n\
    - **81 RED HAT LINUX 9 BIBLE**\n  FRANK CONLEY\n\n# DEPARTMENTS\n\n+   - 4 FROM\
    \ THE EDITOR\n- 6 LETTERS\n- 10 UPFRONT\n- 63 ON THE WEB\n- 64 BEST OF TECHNICAL\
    \ SUPPORT\n- 65 NEW PRODUCTS\n- 81 ADVERTISERS INDEX\n- 95 MARKETPLACE\n\n# COVER\
    \ PHOTO:\n\nTONY STEIDLER-DENNISON\n\n# NEXT MONTH\n\n# WEB-BASED BUSINESS\n\n\
    When you’re building a machine with a half-million parts and multiple quality\
    \ assurance records per part, you need work-flow management software. Giovanni\
    \ Organini and Luciano M. Barone explain the MySQL-backed system they’re using\
    \ to manage the construction of the Compact Muon Solenoid for CERN.\n\nCan you\
    \ run a record company without being evil? And why might a site want three different\
    \ free software Web servers? Find out when John Buckman explains Magnatune, where\
    \ you can get everything from Bach cello suites to electronica as MP3, Ogg or\
    \ FLAC."
