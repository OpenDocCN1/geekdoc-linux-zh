  - '[PAGE 35]


    If you''re unsure what you need to add, simply run vdr -help, and you should see
    a list of all usable modules and their options, along with all of VDR''s options.
    Don''t worry, it''s fairly easy to find out what to add. To finish up, we need
    a base directory; the default (as defined in Make.config) is /video. This directory
    holds all the recordings and configuration files. Copy the sources.conf and your
    channels.conf to /video.


    The only thing left for us to do is write configuration files for the MPlayer/MP3
    plugin. Start by creating a directory named /video/plugins. Now we need two files,
    one called mp3sources.conf and one called mplayersources.conf. Writing them is
    simple. For starters, add something like /video/music;Local files;0 for mp3sources.conf
    and /video/compressed;Local files;0 for mplayersources.conf and save them. To
    get MPlayer to work with the DVB card, you have to recompile. Grab a copy from
    www.mplayerhq.hu, and add --with-extrainidir=/usr/src/DVB/include to your configure
    options. Let the configure script run, recompile and install, and you''re good
    to go.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_35_0.png)


    Figure 3. The information bar shows the program name, running TV show and what''s
    on next.


    As you can see from the runvdr script, the MPlayer plugin uses a special shell
    script to start MPlayer, mplayer.sh. You can get that from batleth.sapienti-sat.org/projects/VDR.


    The package consists of only two files, mplayer.sh itself and mplayer.sh.conf,
    which hold some configuration options. If your machine is too slow to play back
    files using MPlayer, you should try tweaking the settings in this file.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_35_1.png)


    Figure 2. Defining the Keys for Your Remote


    # Roll Film and Back It Up!


    Go back to /usr/src/vdr-1.2.5 and run runvdr.remote. If you use Red Hat, set the
    environment variable LD_ASSUME_KERNEL=2.4.1, because VDR doesn''t yet work with
    the native posix layer that Red Hat introduced in the latest version. The modules
    for the DVB card then are loaded, and the VDR is started. Hook up your TV, and
    you should see a black screen prompting you to define the keys on your remote.
    After finishing the wizard, you''re ready to watch TV, record shows and remove
    commercials. You can listen to your MP3s and watch videos. There''s a manual in
    VDR''s root that explains how to record and edit TV events, using the time-shift
    feature.


    VDR splits its recordings into 2GB files, which is a bit inconvenient for transcoding
    the videos. If you go for manual conversion, which gives you finer control over
    the quality/size aspect, mencoder or transcode are good options. Use the speedy
    mencoder, which I found to be perfect for backups to MPEG-4, or transcode, which
    comes with a lot of tools. If you favor the I-don''t-want-to-care approach, get
    a hold of VDRCONVERT. The README file offers a pretty simple approach to installing
    it, and at least you can watch some TV while downloading and compiling. With VDRCONVERT
    you have to change some scripts and configuration files to adapt the DVD/(S)VCD
    resolutions to NTSC, in case PAL is not used where you live.


    It''s too bad that a Linux PVR doesn''t make the TV programs themselves any better,
    but I guess you can''t have everything, can you?


    # Back It Up


    In case you''re disappointed that the end of the article is within reach, don''t
    worry; there still are some optional things you can do. The automatic backup feature
    has some limitations. Although the (S)VCD backup works flawlessly, the DivX encoding
    does not crop the picture to remove black bands, should they exist. This has quite
    a negative impact on bit rate, size and overall picture quality. If you really
    want a high-quality, small-size MPEG-4, you should back it up manually. The improved
    picture quality is well worth the trouble.


    Christian A. Herzog is a programmer focused on Web development using open-source
    technologies. He''s still on his never-ending quest to bring a Linux-based device
    to every home and company he comes across. Write him at noeffred@gmx.net.


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_35_2.png)


    # RESOURCES


    +   Libraries: www.freshrpms.org

    LIRC: www.lirc.org

    MPlayer: www.mplayer.hu

    mplayer.sh: batleth.sapienti-sat.org/projects/VDR

    Plugins, Scripts and Patches for VDR:

    www.vdrportal.de/board/portal_downloads.php?site=6'
