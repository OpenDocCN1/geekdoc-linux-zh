    \ Speedbar 在 PHP 模式下打开\n\n“print”，Emacs 会为你构建一个定制的 Customize 菜单。有关这些和其他选项，请参阅\
    \ Options→Customize Emacs 下的菜单。\n\n### 编辑你的 .emacs 文件\n\n你也可以通过直接编辑 ~/.emacs 来修改\
    \ Emacs 的行为。这是一种添加功能并插入你可能从他人那里学到的批量定制的好方法。例如，C 模式可以通过设置影响其运行的变量来修改。\n\n许多模式是按缓冲区进行定制的。这意味着你编写一个设置变量的简短函数，并将该函数设置为在\
