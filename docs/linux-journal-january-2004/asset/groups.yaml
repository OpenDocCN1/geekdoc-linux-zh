    ## 使用 SMART 监控硬盘


    你的其中一块硬盘可能在告诉你它时日无多了。安装软件来提醒你何时更换它。作者 BRUCE ALLEN


    可以肯定的是，所有磁盘最终都会死亡，这很容易理解。现代磁盘驱动器中的盘片每秒旋转超过一百次，在磁盘磁头与存储数据的磁介质之间保持亚微米级的公差。它们经常在灰尘多、过热的环境中
    24/7 运行，在负载过重或管理不善的机器上拼命工作。因此，经验丰富的用户对死亡磁盘的症状再熟悉不过了。奇怪的事情开始发生。晦涩的内核错误信息覆盖控制台，然后系统变得不稳定并死锁。经常会浪费整整一天的时间重复最近的工作、重新安装操作系统并尝试恢复数据。即使你有最近的备份，突然的磁盘故障也是一场小灾难。


    许多用户和系统管理员不知道，自监控、分析和报告技术系统（SMART）已内置于大多数现代 ATA 和 SCSI 硬盘中。SMART 磁盘驱动器内部监控自身健康状况和性能。在许多情况下，磁盘本身会提前发出警告，表明出了问题，有助于避免上述情况。大多数
    SMART 实现还允许用户对磁盘执行自检并监控许多性能和可靠性属性。


    我职业上是一名物理学家。我的研究小组运行一个拥有 300 个节点和 600 块磁盘驱动器的庞大计算集群，其上存储了超过 50TB 的物理数据。几年前我对 SMART
    感兴趣，因为我意识到它可以帮助减少停机时间并使我们的集群运行更可靠。约一年来，我一直在为此目的维护一个名为 smartmontools 的开源软件包，它是
    UCSC smartsuite 软件包的分支。


    在本文中，我解释了如何使用 smartmontools 的 smartctl 实用程序和 smartd 守护进程来监控系统磁盘的健康状况。有关下载和安装说明，请参阅
    smartmontools.sourceforge.net 并查阅 WARNINGS 文件以获取问题磁盘/控制器的列表。其他文档可在手册页（man smartctl
    和 man smartd）以及网页上找到。


    smartmontools 的版本适用于 Slackware、Debian、SuSE、Mandrake、Gentoo、Conectiva 和其他 Linux
    发行版。Red Hat 的现有产品包含 UCSC smartsuite 版本的 smartctl 和 smartd，但 smartmontools 版本将在即将发布的版本中包含。


    要了解 smartmontools 的工作原理，了解 SMART 的历史很有帮助。原始的 SMART 规范（SFF-8035i）由一组磁盘驱动器制造商编写。在修订版
    2（1996 年 4 月）中，磁盘保留一个内部列表，最多包含 30 个属性，对应于不同的性能和可靠性度量，例如读取和寻道错误率。每个属性都有一个从 1 到
    253 的一字节归一化值和一个对应的一个字节阈值。如果一个或多个归一化属性值小于或等于其对应的阈值，则磁盘预计在 24 小时内会发生故障或已超过其设计或使用寿命。其中一些属性值在磁盘运行时更新。其他属性值仅通过离线测试更新，这些测试会暂时减慢磁盘读写速度，因此必须使用特殊命令运行。1995
    年底，SFF-8035i 的部分内容合并到 ATA-3 标准中。


    从 ATA-4 标准开始，要求磁盘维护内部属性表的要求被取消。相反，磁盘只需对有关其健康状况的查询返回 OK 或 NOT OK 响应。负响应表示磁盘固件已确定磁盘可能发生故障。ATA-5
    标准在 SMART 命令集中增加了 ATA 错误日志和运行磁盘自检的命令。


    要使用这些磁盘功能，你需要知道如何使用 smartmontools 来检查磁盘的属性（大多数磁盘与 SFF-8035i 向后兼容）、查询磁盘健康状态、运行磁盘自检、检查磁盘自检日志（最近
    21 次自检的结果）并检查磁盘的 ATA 错误日志（最近五次磁盘错误的详细信息）。尽管本文侧重于 ATA 磁盘，但有关 SCSI 设备的其他文档可在 smartmontools
    网页上找到。


    首先，以 root 身份给出命令 smartctl -a /dev/hda，使用指向你的磁盘的正确路径。如果磁盘上未启用 SMART，你首先必须使用 -s
    on 选项启用它。然后你会看到与列表 1-5 中所示输出相似的输出。


    输出的第一部分（列表 1）列出了磁盘的型号/固件信息——这是一个 IBM/Hitachi GXP-180 示例。smartmontools 有一个磁盘类型数据库。如果你的磁盘在数据库中，它可能能够正确解释原始属性值。


    ```

    Listing 1. Output of smartctl -i /dev/hda

    Device Model: IC35L120AVV207-0

    Serial Number: VNVD02G4G3R72G

    Firmware Version: V240A63A

    Device is: In smartctl database [for details use: -P show]

    ATA version is: 6

    ATA Standard is: ATA/ATAPI-6 T13 1410D revision 3a

    SMART support is: Available - device has SMART capability.

    SMART support is: Enabled

    ```


    输出的第二部分（列表 2）显示了健康状态查询的结果。这是磁盘健康状况的一行执行摘要报告；此处显示的磁盘已通过。如果你的磁盘健康状态为 FAILING，请立即备份数据。输出此部分的其余部分提供了有关磁盘功能以及执行短自检和长自检所需估计时间的信息。


