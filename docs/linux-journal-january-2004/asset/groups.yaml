    在音频和视频方面的发展也很重要，因为其中至少有一部分最终会进入桌面发行版。所以本月，我们将为你指引一些 LJ 网站文章，讨论 Linux 多媒体世界正在发生的事情。


    如果你对能完成更复杂音频任务（如录制和混音音乐）的声卡感兴趣，Peter Todd 讨论了“在 Linux 上使用 Hammerfall HDSP”（www.linuxjournal.com/article/7024）。Hammerfall
    是一款在全球各大录音棚使用的专业级声卡；它也能在 Linux 下运行，这要归功于 ALSA Project 驱动。它由一个名为 Multiface 的外部模块与一块内部
    PCI 卡组成。Peter 解释说 Hammerfall 与普通声卡的最大区别在于 HDSP“被设计为声音 I/O 设备。它具有输入和输出，你可以任意在它们之间路由声音”。文章还解释了如何使用诸如外部时间码源等高级功能，这是录音棚必备的。


    2003 年初春，Dave Phillips，《The Linux Book of Music & Sound》的作者，参加了专门为 Linux 音频开发者举办的首次会议。他为我们撰写的报告“Linux
    Audio Development: A Report from Karlsruhe”（www.linuxjournal.com/article/6762）提供了会议上讨论的主要问题的概述，以及
    Linux 音频开发的发展方向。其中讨论的话题之一是 JACK，这款软件工具包“提供了一个低延迟环境中的专业级音频服务器，使任意音频信号路由成为可能，且无丢帧或失真”。


    转向我们演示的视频部分，Roberto de Leo 的文章“Self-Hosting Movies with MoviX”（www.linuxjournal.com/article/6474）解释了
    de Leo 如何开始 MoviX 项目用于自托管电影——“一种能够启动并自动播放光盘上所有音视频文件的 Linux CD 微型发行版”。文章的主要目的 however
    是引导用户通过构建自己的微型发行版的过程，无论是用于播放电影还是其他应用。


    最后，Geoff Draper 为我们撰写了文章“The Art of Rewriting Old Games”（www.linuxjournal.com/article/7083），其中他回忆了对老宠爱
    Nellan Is Thirsty 的怀念如何促使他重写这款老式 8 位文本游戏。新版本 Thirsty Nellan“用点按式 GUI 环境取代了原版游戏的命令行解析器界面”。他还使用了
    Alias/Wavefront 来制作场景，我们必须承认，这是我们见过的最可爱的企鹅艺术作品之一。因为许多这些老式 8 位游戏属于公共领域，它们也可以为新一代游戏玩家重新创作。阅读文章以了解
    Draper 具体做了什么，然后去拯救你自己的老宠爱。


    如果你重写老游戏、在 Linux 机器上搭建音乐工作室或编辑电影，请给我们写信，告诉我们你是如何做的。而且，务必经常查看 Linux Journal 网站。每天都会发布新文章。


