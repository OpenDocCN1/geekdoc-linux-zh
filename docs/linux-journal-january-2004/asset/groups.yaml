    \ all\nlocalhost> deletemailbox user.bwooster\n```\n\n这里发出的第二个命令特别值得注意；它以 cyradm\
    \ 命令 setaclmailbox 开始，可缩写为 sam 或 setacl。随后是相关邮箱（user.bwooster），然后是希望授予（或拒绝）访问权限的账户名称，此例中为\
    \ mick_admin。最后指示一组权限代码或特殊字符串。在本例中，我们有\n\n表 1. cyradm ACL 权限代码（改编自 cyradm(1) 手册页）\n\
