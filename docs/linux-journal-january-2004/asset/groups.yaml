    \ bandwidth for processing computing requests.\n- 32 bit applications while you\
    \ migrate to 64 bit computing for long-term investment protection.\n\nThe other\
    \ tasks a linker generally does. The patch modifies this function and adds the\
    \ following lines of code:\n\n```\nif (module_check_sig(hdr, sechdrs, secstrings))\
    \ {\n    err = -EPERM;\n    goto free_hdr;\n}\n```\n\nThis new function, module_check_sig,\
    \ does all of the module signature-checking logic. If it returns an error, the\
    \ error Improper Permission is returned to the user and module loading is aborted.\
    \ If the function returns a 0, meaning no error occurred, the module load procedure\
    \ continues on successfully.\n\nThe module_check_sig function is located in the\
    \ file kernel/module-sig.c. The first thing the function does is check to see\
    \ if a signature is located within the module. This is done with the following\
    \ lines of code:\n\n```\nsig_index = 0;\nfor (i = 1; i < hdr->e_shnum; i++)\n\
    \    if (strcmp(secstrings+sechdrs[i].sh_name,\n        \"module_sig\") == 0)\
    \ {\n        sig_index = i;\n        break;\n    }\nif (sig_index <= 0)\n    return\
    \ -EPERM;\n```\n\nThis bit of code loops through all of the different ELF sections\
    \ in the kernel module and looks for one called module_sig. If it does not find\
    \ the signature, it returns an error and prevents this module from being loaded.\
    \ If it does find the signature, the function continues.\n\nOnce the kernel has\
    \ found the module signature, it needs to determine what the hash value is of\
    \ the module it is being asked to load. To do this, it generates the SHA1 hash\
    \ of the ELF section that contains executable code or data used by the kernel.\
    \ The kernel already contains code to generate SHA1 hashes (along with other kinds\
    \ of hashes, including MD5 and MD4), so most of the logic for this step is present\
    \ already.\n\nThe function first allocates a crypto transformation structure by\
    \ requesting the SHA1 algorithm. It then initializes this structure with the following\
    \ lines of code:\n\n```\nsha1_tfm = crypto_alloc_tfm(\"sha1\", 0);\nif (sha1_tfm\
    \ == NULL)\n    return -ENOMEM;\ncrypto_digest_init(sha1_tfm);\n```\n\nThe sha1_tfm\
    \ variable is used to create the SHA1 hash of the specific portions of the ELF\
    \ file that we want, as shown in the following code:\n\n```\nfor (i = 1; i < hdr->e_shnum;\
    \ i++) {\n    name = secstrings+sechdrs[i].sh_name;\n\n    /* we only care about\
    \ sections with \"text\" or\n       \"data\" in their names */\n    if ((strstr(name,\
    \ \"text\") == NULL) &&\n        (strstr(name, \"data\") == NULL))\n    continue;\n\
    \    /* avoid the \".rel.*\" sections too. */\n    if (strstr(name, \".rel.\"\
    ) != NULL)\n    continue;\n\n    temp = (void *)sechdrs[i].sh_addr;\n    size\
    \ = sechdrs[i].sh_size;\n    do {\n        memset(&sg, 0x00, sizeof(*sg));\n \
    \       sg.page = virt_to_page(temp);\n        sg.offset = offset_in_page(temp);\n\
    \        sg.length = min(size,\n            (PAGE_SIZE - sg.offset));\n      \
    \  size -= sg.length;\n        temp += sg.length;\n        crypto_digest_update(sha1_tfm,\
    \ &sg, 1);\n    } while (size > 0);\n}\n```\n\nIn this code, we care only about\
    \ the ELF sections with the word text or data in their names but not ones that\
    \ contain the characters .rel. After all of the sections have been found and fed\
    \ to the SHA1 algorithm, the SHA1 hash is placed into the variable sha1_result\
    \ with the following lines:\n\n```\ncrypto_digest_final(sha1_tfm, sha1_result);\n\
    crypto_free_tfm(sha1_tfm);\n```\n\nNow that the SHA1 hash is computed and the\
    \ place with the signed hash has been found, all that is left to do is unencrypt\
    \ the signed hash and compare it to the calculated one. This step is done in the\
    \ last line of this function:\n\n```\nreturn rsa_check_sig(sig, &sha1_result[0]);\n\
    ```\n\nThe rsa_check_sig function is located in the security/rsa/rsa.c file and\
    \ uses the GnuPG code itself, which was ported to run in the kernel to unencrypt\
    \ the signature and compare the values. The description of how this works is beyond\
    \ the scope of this article.\n\n## How the User-Space Code Works\n\nNow that we\
    \ have seen how the kernel determines whether a module is signed properly, how\
    \ do we get a signature into a module in the first place? Two user-space programs,\
    \ extract_pkey and mod, and one small script, sign (in the security/rsa/userspace/\
    \ directory), can be found in the kernel patch. The two programs can be built\
    \ by running the Makefile in this directory. The extract_pkey program is used\
    \ to place a public key into the kernel, and the mod program is used by the sign\
    \ script to sign a kernel module.\n\nIn order to sign a module, an RSA-signing\
    \ key must be generated, which can be done by using the gnupg program. To generate\
    \ an RSA-signing key, pass the --gen-key option to gpg:\n\n```\n$ gpg --gen-key\n\
    gpg (GnuPG) 1.2.1; Copyright (C) 2002 Free Software Foundation, Inc.\nThis program\
