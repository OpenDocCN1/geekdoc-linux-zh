    虽然 dcache 的这次改动相对较小，但它在内核中产生了深远的影响，因为当时并没有为文件系统与 dcache 交互提供一个明确定义的 API。这导致 Linux
    2.5 内核中出现了大量错误，因为文件系统开发者试图以传统方式直接操作 dcache。鉴于现在已存在一个较为正式的 API，我们希望未来的改动会不那么痛苦。


    图 9 显示了在打补丁使用目录项缓存中 RCU 的 Linux 2.5.59 内核上运行的多用户基准测试的性能，与未打补丁内核的性能相比。这些基准测试在 16
    CPU NUMA-Q 系统上运行，使用 700MHz PIII Intel Xeon 处理器，1MB L2 缓存和 16GB 内存。


    ![](img/3e9d313887e2c1cabeb5043769cbf08f_47_0.png)


