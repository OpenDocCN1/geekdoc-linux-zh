    \n![](img/3e9d313887e2c1cabeb5043769cbf08f_1_2.png)\n\n## 需要一种可以放在办公桌下并提供前所未有强大性能的刀片解决方案吗？\n\
    \nHIVE™ 可容纳多达 11 个刀片，可容纳各种选项，包括高端服务器、SAN、基于 NAS 的存储以及 InfiniBand®。8 刀片和 11 刀片版本均与\
