    # TALOSS Participants


    In the November 2003 issue, acknowledgements were inadvertently omitted from the
    TALOSS (Three-Dimensional Advanced Localization Observation Submarine Software)
    article. Mr Ken Lima of NUWC was the originator of the TALOSS concept and the
    project''s manager, without whose leadership this project would not be possible.
    The authors also would like to thank the Office of Naval Research (ONR) Code 311
    (Mr Paul Quinn, Mr Gary Toth and Dr Larry Rosenblum) for the funds to complete
    the project.


    ONR (Dr Rosenblum) funded Dr Gregory Neilsen and Mr Gary Graf of Arizona State
    University to develop software that computes the intersection of irregular 3-D
    regions within TALOSS. That software is the same software included in TALOSS as
    described in the subject article. A patent application for this software already
    has been prepared by its inventors (Graf, Nielsen, Lima and Drury).


    A major portion of the TALOSS software was written at Virginia Tech University
    under the direction of the NUWC by graduate student, Fernando DasNeves. The funding
    for his work was provided under a NAVCITTII Virginia Tech grant administered by
    ONR (Dr Rosenblum).


    The Naval Research Laboratory contributed that laboratory''s expertise in 3-D
    rendering and visualization to the NUWC-led project. NRL (initially Mr Rob King),
    conducted research on 3-D interactive devices in the immersive variant of the
    TALOSS. Mr Douglas Maxwell, then an NRL employee, subsequently developed a 3-D
    grid-based approach to ocean floor rendering within TALOSS using the digital nautical
    chart database. Mr Maxwell also developed the collision detection algorithms used
    in TALOSS. Mr Maxwell''s primary role, since joining NUWC a year ago, has been
    as a technical consultant to the project.


    Mr Richard Shell of NUWC has served as the technical lead for the TALOSS Project
    for the past three years. Mr Todd Drury is the NUWC software development lead
    for TALOSS and has been responsible for the design and development of the TALOSS
    software for the past three years. The bottom rendering approach currently implemented
    in TALOSS and referenced in the Linux Journal article is Mr Drury''s work, with
    Mr Maxwell''s as a candidate to follow. A patent for this software was submitted
    several months ago.


    The authors would like to express regret in the inadvertent omission of these
    acknowledgements. Thanks to the hard work and dedication of all involved, this
    project was a resounding success.


    --

    Douglas B. Maxwell, MSME, Research Scientist/Mechanical Engineer, Naval Undersea
    Warfare Center


    # More on Cluster Apps Please


    I have had a personal nagging curiosity to build my own home cluster out of a
    few boxes that are readily available. Once I have it, what can I possibly do?
    Regarding that question, your November 2003 issue was fantastic but lacked the
    one thing I would like to read more about. Could you maybe consider an article
    describing the different applications that are available for clusters?


    --

    S. B.


    # Linux Training?


    As a self-taught Linux user, I really enjoy and appreciate the information that
    gets published in LJ. I am wanting to learn more and am looking for courses in
    Linux, but only seem to find the occasional Linux conference or workshops that
    offer Linux certifications. Being Linux-certified is my goal, but I know I still
    require classroom study. Can you point me in the right direction? Thanks! Keep
    up the good work!


    --

    Jason Fales, Dallas, Texas


    Try the directory at lintraining.com.—Ed.


    # fgets Good, gets Bad


    I enjoyed Cal Erickson''s article, Writing Secure Programs, in the November 2003
    issue, and definitely plan on looking at


    FlawFinder and other tools. One nit: Do not use fgets when reading data, as this
    allows overflows. I think this was a typo; it should have read gets...allows overflows,
    because fgets has a length parameter.


    --

    Collin Park


    > You''re right. As soon as you finish that Intro to C class that requires you
    to use gets, you just don''t use it anymore.—Ed.


    # License for Bioinformatics Software


    In the November 2003 cover article, Sequencing the SARS Virus, Krzywinski and
    Butterfield refer to phred, phrap and consed as the open-source workhorses of
    the Human Genome Project. Although these programs are indeed bioinformatics workhorses,
    and although the no-fee academic licensing terms under which they are available
    are generous by proprietary software standards, the terms under which they are
    distributed do not conform to the Open Source definition at least to the extent
    that they discriminate against fields of endeavor. The terms apply to academic
    or nonprofit use but not to business use (Open Source definition version 1.9,
    section 6).


    BLAST, another workhorse mentioned in the article, has diverged into two main
    branches, one in the public domain (which can be obtained from the National Center
    for Biotechnology Information [NCBI]) and one distributed in a fashion similar
    to phred, phrap and consed.


    --

    D. Joe Anderson


    # Errata


    October 2003, page 88: in Listing 1 of the article Building a Linux IPv6 DNS Server
    by David Gordon and Ibrahim Haddad, there should have been a closing brace after
    the first two lines.


    November 2003, page 50: in the Command-Line Bioinformatics Sidebar of Sequencing
    the SARS Virus by Martin Krzywinski and Yaron Butterfield, the tau in the third
    line of code should be tr.


    We welcome your letters. Please submit Letters to the Editor to jeditor@ssc.com
    or SSC/Editorial, PO Box 55549, Seattle, WA 98155-0549 USA.'
