- pgno: 340
  md: "# Question 6\n\n+   Which of the following are valid uses for the asterisk\
    \ (`*`) within the `/etc/syslog.conf` file? (Select all that apply.)\n+   \n+\
    \   - [ ] a. Represents all source facilities\n+   - [ ] b. Represents all severity\
    \ levels\n+   - [ ] c. Represents all messages\n+   - [ ] d. Writes message to\
    \ all logged-on users\n\nAnswer d is correct. You can use an asterisk to write\
    \ messages to all logged-in users. An asterisk can be used to represent all source\
    \ facilities except mark. Therefore, answer a is incorrect. No symbol or keyword\
    \ is available to represent all severity levels or all messages. Therefore, answers\
    \ b and c are incorrect.\n\n# Question 7\n\nIdentify the command used to list\
    \ the login accounts currently logged in to the system.\n\nThe correct answer\
    \ is the **last** command or the **who** command.\n\n# Question 8\n\n+   Which\
    \ of the following are severity levels? (Select all that apply.)\n+   \n+   -\
    \ [ ] a. **alert**\n+   - [ ] b. **notice**\n+   - [ ] c. **none**\n+   - [ ]\
    \ d. **mail**\n\nAnswers a, b, and c are correct. **alert**, **notice**, and **none**\
    \ are severity levels. **mail** is a source facility, not a severity level. Therefore,\
    \ answer d is incorrect."
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Question 9


    Enter the name of the default log file used for most of the syslog messages.


