- pgno: 57
  md: 'requirement. The **man(1)** command is used to display one or more man pages
    specified as command-line arguments. Table 2.3 lists the command-line arguments
    available with the **man** command.


    **Table 2.3  Command-Line Arguments for the man Command**


    | Argument | Description |

    |---|---|

    | *name* | The name of a Solaris command, file, and so on described by a man page
    of the same name. At least one *name* is required by all arguments except the
    **-f**, **-k**, and **-M** arguments. More than one *name* (separated by spaces)
    can be specified. |

    | **-** | Don’t automatically send output through the **more(1)** command (which
    provides pagination, underlining, and so on). |

    | **-a** | Display all man pages that match the specified *name* (regardless of
    section). |

    | **-d** | Display debug information (search methods used, sections searched,
    and so on) used to locate the *name* man page. |

    | **-f file ...** | List man pages that reference the specified *file* (requires
    preformatted man pages). More than one *file* can be specified (separated by spaces).
    Note that this argument is used to locate a file referenced in the man page, not
    a man page (therefore, it does not require a man page *name* argument). |

    | **-F** | Force a search of all man sections for *name* instead of using the
    windex database to locate man pages (windex is associated with pre-formatted man
    pages). |

    | **-k keyword ...** | Print a summary of all windex database entries containing
    the specified *keyword* (preformatted man pages only). More than one *keyword*
    can be specified (separated by spaces). Note that this argument is used to locate
    keywords in a database, not a man page (therefore, it does not require a *name*
    argument). |

    | **-l** | List all man pages that match the specified *name* (regardless of section).
    |

    | **-M path** | Specify an alternative directory *path* for man page files. This
    argument can be used with any of the other arguments. |

    | **-r** | Reformats the specified *name* man page. Instead of being displayed,
    the output is captured in a file for use by subsequent **man** commands. |

    | **-s section ...** | Search only the specified *section* or sections (separated
    by spaces). |

    | **-t** | Typeset the specified *name* man page using **troff(1)**. If **-t**
    is used with the **-a** argument, the output is not displayed, but instead is
    captured in a file for subsequent use by the **man** command. |

    | **-T macro** | Use the specified **nroff(1)** *macro* package instead of the
    standard man page (**-man**) macro package. |'
  merge: -1
  img_proc: true
- pgno: 58
  md: "The following example shows how you can use the **man** command to display\
    \ the **man(1)** man page. Note that man pages longer than one screen use the\
    \ **more(1)** command to display one screen of the man page at a time:\n\n```\n\
    # man man\nReformatting Page. Please wait... Done\n```\n\n# User Commands　　　　　　　　　　　　　　　　　　　　　　　　　man(1)\n\
    \n# NAME\n\nman - find and display reference manual pages\n\n# SYNOPSIS\n\n```\n\
    man [- · ] [ -adFlrt ] [ -M path ] [ -T macro-package ]\n    [ -s section ] name\
    \ ...\n\nman [ -M path ]  -k keyword ...\n\nman [ -M path ]  -f file ...\n```\n\
    \n# DESCRIPTION\n\nThe man command displays information from the reference manuals.\
    \ It displays complete manual pages that you select by name, or one-line summaries\
    \ selected either by keyword (-k), or by the name of an associated file (-f).\
    \ If no manual page is located, man prints an error message.\n\n# Source Format\n\
    \nReference Manual pages are marked up with either nroff(1) or sgml(5) (Standard\
    \ Generalized Markup Language) tags. The man command recognizes the type of markup\
    \ and processes the file accordingly. The various source files are kept in separate\
    \ directories depending on the type of markup.\n\n# Location of Manual Pages\n\
    \nThe online Reference Manual page directories are conventionally located in /usr/share/man.\
    \ The nroff sources are located in the /usr/share/man/man* directories. The SGML\
    \ sources are located in the /usr/share/man/sman* directories. Each directory\
    \ corresponds to a section of the manual. Since\n\n```\n.\n.\n.\n```\n\nThe *passwd*\
    \ topic shows the different **man** command-line arguments because **passwd(1)**\
    \ is a command and **passwd(4)** is a system file. The following example lists\
    \ all man pages named *passwd*:\n\n```\n# man -l passwd\npasswd (1)       -M /usr/share/man\n\
    passwd (4)       -M /usr/share/man\n#\n```\n\nNote that both man pages are listed.\
    \ In addition, an appropriate **-M** command-line argument is displayed to show\
    \ the location of the man pages. The default pathname for man pages is /usr/share/man."
  merge: -1
  img_proc: true
