    # Default File Permissions


    When a file is created, a set of default permissions is assigned to it. The default
    permissions are defined by using the **umask**(1) command. The **umask** command
    sets a mask of the permissions that should not be included in the file access
    mode by default.


    For example, to allow full permission for owner and to remove write permission
    for group and other, the umask value is 022. That is, a file created with an access
    mode of 666 has the umask of 022 subtracted from its access mode (666 − 022 =
    644), removing write for group and other. You should add the umask command to
    the contents of the user’s login initialization file to provide a consistent permission
    mask.


    The following example shows the impact of the umask command on created files and
    directories:


    ```

    ```sh

    # umask 022

    # >file1

    # mkdir dir1

    # ls -l

    total 2

    drwxr-xr-x  2 root   other       512 Mar 30 02:28 dir1

    -rw-r--r--  1 root   other         0 Mar 30 02:28 file1

    ```

    ```


    A umask of 022 removes group and other write permissions for newly created directories
    and files. In the previous example, file1 is created with the default mode 666.
    Subtracting the umask of 022 results in 644, or rw-r--r--. The directory dir1
    is created with a default mode of 777. Subtracting the umask of 022 results in
    755, or rwxr-xr-x.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_131_0.png)


    > > Remember that directories are created with execution permission (777) and
    files are not created with execution permission (666). Specifying an umask that
    contains execution permission (values of 1, 3, 5, or 7) affects only directories.


