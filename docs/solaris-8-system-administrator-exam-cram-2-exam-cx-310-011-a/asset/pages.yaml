- pgno: 452
  md: '# Boot Server


    A **boot server** is a system containing the files needed to boot a SPARC install
    client over the network during an over-the-network installation. After an install
    client has booted, the boot server has completed its function. The remainder of
    the installation is supported by an install server. Because Intel-compatible install
    clients boot from a local floppy disk or local CD-ROM, they do not use a boot
    server for installation.


    Typically, an install server and a boot server reside on the same system. In fact,
    when a system is set up as an install server, it is also set up as a boot server.
    However, if install clients are on a different subnet than an install server,
    a boot server must be set up on the same subnet as the install clients.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_452_0.png)


    > A boot server is required to be on the same subnet as SPARC install clients
    because the clients obtain booting information from the boot server using the
    Boot Protocol (BOOTP). Typically, this protocol is not passed by routers (which
    interconnect subnets).


    To set up a system only as a boot server, the system must have access to the Solaris
    software distribution CD through a local CD-ROM drive or a remotely shared CD-ROM
    drive.


    The **setup_install_server** command, under the Solaris_8/Tools directory on the
    Solaris software distribution CD, copies the boot software to the boot server.
    Two command-line arguments are required: **-b**, which specifies that a boot server
    is being set up, and the full pathname to an empty directory to which the boot
    files will be copied. Although any directory can be used, by convention the directory
    is named **boot** and is located under the /export/install directory. The following
    line executes the **setup_install_server** command from the Solaris_8/Tools directory
    of the distribution CD to set up a boot server:


    ```

    ```sh

    # ./setup_install_server -b /export/install/boot

    ```

    ```


    # Adding Install Clients


    When a system or install client is installed over the network, basic information
    about the install clients needs to be available through a name service (NIS/NIS+)
    or in the files under the /etc directory on the install server or boot server.


    You can use the Solstice Host Manager program to add this information or, if Host
    Manager is not available, use the **add_install_client** command.'
  merge: -1
  img_proc: true
- pgno: 453
  md: '![](img/b957f979417d9f16274c2eb52c8f2c9f_453_0.png)


    The **add_install_client** command can be used only to update the /etc files on
    an install server or a boot server. Use the appropriate NIS or NIS+ procedures
    to add client information to these name services. At minimum, you must add the
    hostname, IP address, and Ethernet address of the client.


    Depending on the environment, you can modify the following /etc files to support
    over-the-network installation:


    +   - **/etc/bootparams(4)**—An entry for each client, to define pathnames and
    parameters required to boot the client

    +   - **/etc/dfs/dfstab(4)**—Entries for any NFS resources that should be shared

    +   - **/etc/ethers(4)**—An entry mapping the Ethernet address to the system hostname

    +   - **/etc/exports(4)**—Entries for any NFS resources that should be shared

    +   - **/etc/hosts(4)**—An entry mapping the hostname to an IP address

    +   - **/etc/inetd.conf(4)**—An entry to enable the Trivial File Transfer Protocol
    (FTP) daemon


    The following line uses the **add_install_client** command to set up a system
    for over-the-network installation. This command is executed from the Solaris_8/Tools
    directory of the Solaris 8 Software (2 of 2) distribution CD or from the mount
    point of the Solaris 8 Installation CD. The name of the system to be installed
    is identified by the **host** command-line argument followed by the system’s platform
    group.


    In this example, the command-line argument **sun4m** is used to identify the system
    to be installed as a SPARC5 platform:


    ```

    ```sh

    # add_install_client host sun4m

    ```

    ```


    Table 21.2 lists the command-line arguments supported by the **add_install_client**
    command.


    **Table 21.2 Command-Line Arguments for the add_install_client Command**


    | Argument | Description |

    |---|---|

    | **-c server:path** | Specifies the profile **server** and **path** of the JumpStart
    directory. |

    | **-d** | Defines the client as a DHCP client. |

    | **-e address** | Specifies an Ethernet address. |'
  merge: -1
  img_proc: true
- pgno: 454
  md: '| Argument | Description |

    |---|---|

    | **-i address** | Specifies an IP address. |

    | **-n server:service netmask** | Specifies the name **service** and the name
    service **server**. The **netmask** can also be defined. |

    | **-p server:path** | Specifies the **server** on which the sysidcfg file is
