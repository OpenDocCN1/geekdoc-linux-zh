- pgno: 180
  md: 'This chapter covers controlling programs or processes running on the system.
    This control consists of viewing the status of processes, killing processes as
    needed, and scheduling the automatic starting of processes. The *Process Control*
    test objectives are covered in this chapter.


    # # Viewing and Terminating Processes


    The **ps(1)**, **prstat(1M)**, and **pgrep(1)** commands are used to view attributes
    of processes, whereas the **kill(1)** and **pkill(1)** commands are used to terminate
    processes.


    # ## The ps Command


    The **ps** command is used to display information about active processes. Without
    any command-line arguments, the **ps** command displays processes that have the
    same effective user ID (UID) of the user account that executed the command. Table
    7.1 lists the command-line arguments supported by the **ps** command.


    A considerable amount of information on processes is available through the **ps**
    command and its several display formats.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_180_0.png)


    The default information displayed for a process consists of the process ID (PID),
    the terminal device it is associated with (TTY), its accumulated execution time
    (TIME), and the program or command name (CMD). This information is included in
    all formats unless specifically omitted.


    | Argument | Description |

    |---|---|

    | **-a** | Displays all processes except process group leaders and processes not
    associated with terminals |

    | **-A** | Displays all processes (identical to **-e**) |

    | **-c** | Displays alternate columns |

    | **-d** | Displays all processes except process session leaders |

    | **-e** | Displays all processes |

    | **-f** | Uses the full listing display format |

    | **-g** *Process Group ID* | Displays processes with the specified process group
    ID |

    | **-G** *Group ID* | Displays processes with the specified process group ID (GID)
    |

    | **-j** | Displays the session and process group ID |


    *(continued)*'
  merge: -1
  img_proc: true
- pgno: 181
  md: "| Argument | Description |\n|---|---|\n| `-l` | Uses the long listing display\
    \ format |\n| `-L` | Displays information about each lightweight process (LWP)\
    \ |\n| `-n Name` | Uses an alternative name list file (ignored) |\n| `-o Format`\
    \ | Uses an alternative display format |\n| `-p Process ID` | Displays the process\
    \ with the specified process ID (PID) |\n| `-P` | Displays the number of the processor\
    \ executing the process (only meaningful on a multiprocessor system) |\n| `-s\
    \ Process Session ID` | Displays processes with the specified process session\
    \ ID |\n| `-t Terminal Device Path` | Displays processes associated with the specified\
    \ terminal device path |\n| `-u Effective User ID` | Displays processes with the\
    \ specified effective user ID |\n| `-U Real User ID` | Displays processes with\
    \ the specified real user ID |\n| `-Y` | Displays alternate columns in long listings\
    \ |\n\nAll the command-line arguments used to specify an ID—such as process group\
    \ ID, real group ID, PID, process session ID, effective UID, and real UID—accept\
    \ multiple IDs (separated by commas). For the real and effective user IDs and\
    \ the real group ID, you can specify the numeric IDs or the account names.\n\n\
    The following listing uses the **ps** command with several different command-line\
    \ arguments:\n\n```\n```text\n$ ps -udla\n   PID TTY      TIME CMD\n   781 pts/5\
    \    0:19 xterm\n   782 pts/5    0:00 sh\n   910 pts/5    0:10 telnet\n   913\
    \ pts/6    0:01 sh\n$ ps -pts/6\n   PID TTY      TIME CMD\n   782 pts/5    0:00\
    \ sh\n   910 pts/5    0:10 telnet\n$ ps -f -udla\n   UID  PID PPID  C  STIME TTY\
    \      TIME CMD\n   dla  781    0  0  Aug 28 ?        0:19 xterm -display\n  \
    \ dla  782  781  0  Aug 28 pts/5    0:00 sh\n   dla  910  782  0  Aug 28 pts/5\
    \    0:10 telnet solaris\n   dla  913  911  0  Aug 28 pts/6    0:01 -sh\n$\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 182
  md: "The PPID column lists the parent PID of the process, the C column lists processor\
    \ utilization (obsolete), and the STIME shows the start date.\n\n# The prstat\
    \ Command\n\nThe prstat(1M) command generates a statistics report on active processes.\
    \ If you use it with no command-line arguments, information on all active processes\
    \ is displayed, sorted by CPU usage. The report is updated approximately every\
    \ three seconds until it is killed. The following listing shows the use of the\
    \ prstat command:\n\n```\n```text\n$ prstat\n PID USER  SIZE  RSS STATE   PRI\
