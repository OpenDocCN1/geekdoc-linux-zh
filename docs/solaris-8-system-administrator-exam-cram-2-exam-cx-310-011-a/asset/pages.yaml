    \ drive\n+   - ☐ b. Kernel\n+   - ☐ c. File system\n+   - ☐ d. System console\n\
    +   - ☐ e. Memory management\n+   - ☐ f. Shell\n+   - ☐ g. Process control\n\n\
    Answers b, c, and f are correct. The three parts of the Solaris 8 operating system\
    \ are the kernel, the file system, and the shell. The disk drive and system console\
    \ are hardware devices. Therefore, answers a and d are incorrect. Memory management\
    \ and process control are functions of the kernel. Therefore, answers e and g\
    \ are incorrect.\n\n# ## Question 2\n\n+   What is the commonly used shell provided\
    \ by the Solaris 8 system?\n+   \n+   - ○ a. Corn shell\n+   - ○ b. Sea shell\n\
    +   - ○ c. Bourne shell\n+   - ○ d. Berkeley shell\n\nAnswer c is correct. Solaris\
    \ 8 provides the Bourne shell. Answers a and b are incorrect because they sound\
    \ similar to the Korn and C shells, but are spelled differently. Answer d, the\
    \ Berkeley shell, does not exist."
  merge: -1
  img_proc: true
- pgno: 65
  md: "# ## Question 3\n\n+   Which of the following files is used to store commands\
    \ that should be executed when a user logs in to the system?\n+   \n+   - a. The\
    \ .cshrc file\n+   - b. The .Profile file\n+   - c. The .startuprc file\n+   -\
    \ d. The profile file\n+   - e. The .login file\n\nAnswer e is correct. The .login\
    \ file is the login initialization file for the C shell. The .cshrc file is the\
    \ shell startup initialization file for the C shell. Therefore, answer a is incorrect.\
    \ Answer b is similar to the name of the Bourne and Korn login initialization\
    \ file, but the correct filename uses a lowercase p. In Unix, filenames are case\
    \ sensitive, so answer b is incorrect. The file .startuprc is not a standard initialization\
    \ file. Therefore, answer c is incorrect. Answer d would be correct if it began\
    \ with a period.\n\n# ## Question 4\n\n+   System maintenance commands are documented\
    \ in which section of the *Reference Manual*?\n+   \n+   - a. 1\n+   - b. 1M\n\
    +   - c. 2\n+   - d. 4\n\nAnswer b is correct. System maintenance commands are\
    \ documented in Section 1M. User commands are documented in Section 1, system\
    \ calls in Section 2, and file formats in Section 4. Therefore, answers a, c,\
    \ and d are incorrect."
  merge: -1
  img_proc: true
- pgno: 66
  md: "# Question 5\n\n+   An account is set up to use the Bourne shell. Which file\
    \ is used to store commands to be executed when the user logs in to the system?\n\
    +   \n+   - ○ a. The .cshrc file\n+   - ○ b. The .profile file\n+   - ○ c. The\
    \ .startup file\n+   - ○ d. The .logon file\n+   - ○ e. The .login file\n\nAnswer\
    \ b is correct. The .profile file is used to store commands that are executed\
    \ when the user logs in to the system. The shell startup initialization file for\
    \ the C shell is .cshrc. Therefore, answer a is incorrect. Answers c and d are\
    \ incorrect because they are not standard names for login initialization files.\
    \ Answer e is the login initialization file for the C shell.\n\n# Question 6\n\
    \n+   Which of the following are functions of the kernel? (Select all that apply.)\n\
    +   \n+   - □ a. Process control\n+   - □ b. Hardware interface and control\n\
    +   - □ c. Memory management\n+   - □ d. Interprocess communication\n\nAnswers\
    \ a, b, c, and d are correct. They are all functions of the kernel.\n\n# Question\
    \ 7\n\n+   Which of the following shells are available in a restricted version?\
    \ (Select all that apply.)\n+   \n+   - □ a. C shell\n+   - □ b. Korn shell\n\
    +   - □ c. Bourne shell\n\nAnswers b and c are correct. The Korn and Bourne shells\
    \ are available in a restricted version. The C shell does not provide a restricted\
    \ version; therefore, answer a is incorrect."
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Question 8


    Which commands can be used to display the `passwd(4)` manual page? (Select all
    that apply)


    +   - a. `man -s 4 passwd`

    +   - b. `man -a passwd`

    +   - c. `man passwd`

    +   - d. `man passwd -s 4`


    Answers a and b are correct. Answer a displays only **passwd(4)**, whereas answer
    b displays both **passwd(1)** and **passwd(4)**. **man passwd** displays only
    **passwd(1)**; therefore, answer c is incorrect. **man passwd -s 4** displays
    **passwd(1)** and generates an error message because **-s 4** is misinterpreted
    as the name of manual pages (command-line arguments must be specified before the
    name of the manual pages). Therefore, answer d is incorrect.'
  merge: -1
  img_proc: true
