    # Deleting a Device Alias


    An alias defined by the **nvAlias** command is stored in the script and remains
    there until you remove it by using the **nvunialias** command, or until you restore
    the system configuration to its original defaults by using the **set-defaults**
    command. Keep in mind that an alias defined with the **devalias** command is *not*
    stored in the script and is lost when the system reboots.


    To delete the nonvolatile device alias (an alias stored in the script) disk2,
    enter the following command at the OpenBoot ok prompt:


    ```

    ```text

    ok nvunalias disk2

    ok

    ```

    ```


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_106_0.png)


    # Viewing and Modifying NVRAM Parameters

    from Solaris


    Typically, you view and modify NVRAM parameters by using OpenBoot commands. It
    is possible to view and modify the NVRAM parameters from the Solaris 8 environment
    by using the **eeprom**(1M) command. However, only the superuser can modify NVRAM
    parameters with the **eeprom** command.


    To view the value of the **auto-boot?** NVRAM parameter, enter the following **eeprom**
    command at the system prompt:'
  merge: -1
  img_proc: true
- pgno: 107
  md: '```

    $ /usr/sbin/eeprom ''auto-boot?''

    auto-boot?=true

    $

    ```


    To view all NVRAM parameters, enter the **eeprom** command without any command-line
    arguments.


    You can also use the **eeprom** command to modify an NVRAM parameter. To set the
    value of **auto-boot?** to **false**, enter the following command at the system
    prompt:


    ```

    # eeprom auto-boot?=false

    #

    ```


    # Troubleshooting Boot Problems


    When reset or powered on, a SPARC system typically runs the POST. After this,
    the system boots automatically (if **auto-boot?** is **true**) or enters the Forth
    Monitor.


    The boot process or OpenBoot initialization sequence performs various checks and
    loads the appropriate modules. You can view status messages on this initialization
    sequence in the /var/adm/messages file after the system has successfully loaded
    and started the operating system.


    However, if a boot problem occurs, the Solaris 8 system will not be started, and
    you can’t view the messages. To get around this situation, OpenBoot has the capability
    to send the initialization sequence messages to tty serial port A (TTYA). You
    accomplish this by setting the **diag-switch?** OpenBoot parameter to true and
    using the **setenv** command before starting the system boot, as in the following
    example:


    ```

    ok setenv diag-switch? true

    ok

    ```


    By attaching a terminal or PC to TTYA, you can observe the messages generated
    by the OpenBoot initialization sequence and identify the boot problem.


    # Emergency Commands (SPARC Only)


    Sometimes you need to take control of a system, regardless of its state. From
    the keyboard of a SPARC system, you can immediately enter the Forth Monitor. Table
    4.4 lists the emergency keyboard commands OpenBoot supports. All make use of the
    stop function key on the SPARC keyboard.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '![](img/b957f979417d9f16274c2eb52c8f2c9f_108_0.png)


    When you need to recover a system that has stopped responding, after the stop+a
    sequence, be sure to enter the OpenBoot **sync** command to synchronize the system
    disks and write a crash dump before issuing the appropriate boot command.


    | Sequence | System Response |

    |---|---|

    | stop | Bypasses the POST |

    | stop+a | Aborts the operating system or boot process (returns to the OpenBoot
    **ok** prompt) |

    | stop+d | Enters diagnostic mode |

    | stop+f | Enters the Forth Monitor on TTYA (instead of the system console) |

    | stop+n | Resets the NVRAM contents to default values |


    You can use the **kbd(1)** command to enable or disable the stop+a sequence. You
    can also set the keyboard characteristics by modifying the /etc/default/kbd file
    and then executing the **kbd -i** command. For example, the following **kbd**
    command disables the keyboard abort sequence:


    ```

    ```sh

    # kbd -a disable

    ```

    ```


    To accomplish the same task, place the _KEYBOARD_ABORT=disable_ entry in /etc/default/kbd
    and execute the following:


    ```

    ```sh

    # kbd -i

    ```

    ```


    # The Boot Process


    The boot PROM stores firmware that is responsible for booting the operating system.
    Because the SPARC boot process is somewhat different from the Intel x86 boot process,
    they are covered separately here.


    # The SPARC Boot Process


    The SPARC boot process consists of the following phases:


    +   1. **Boot PROM**—This phase displays system information and then runs the
    POST diagnostics. After the diagnostics are complete, the primary boot program,
    bootblk, is loaded. Its function is to locate the secondary boot program, ufsboot,
    on the boot device.'
  merge: -1
  img_proc: true
- pgno: 109
  md: "+   2. **Boot Programs**—In this phase, bootblk loads the ufsboot program into\
    \ memory and executes it.\n+   \n+   3. **Kernel Initialization**—In this phase,\
    \ the ufsboot program loads the core kernel into memory and causes it to execute.\
    \ The kernel initializes its data structures and begins loading other kernel modules\
    \ on the basis of the /etc/system file using the ufsboot program. After all the\
    \ necessary modules are loaded and initialized, the kernel starts the /sbin/init\
    \ program.\n+   \n+   4. **init**—In this phase, the init program starts other\
    \ processes on the basis of the information in the /etc/inittab file. These processes\
    \ include a program that calls the run control (rc) scripts that set up various\
    \ system services.\n\n# Intel x86 Boot Process\n\nThe Intel x86 boot process consists\
    \ of the following phases:\n\n+   1. **BIOS**—During this phase, the POST diagnostics\
    \ are run. Then the master boot record, mboot, is read from disk to locate the\
    \ active partition containing the pboot program.\n+   \n+   2. **Boot Programs**—In\
    \ this phase, the pboot program is loaded and then locates and loads the primary\
    \ boot program, bootblk. Then the secondary boot program, either boot.bin or ufsboot,\
    \ is located in the root file system and loaded.\n+   \n+   3. **Kernel Initialization**—In\
    \ this phase, the boot.bin or ufsboot program loads the core kernel into memory\
    \ and causes it to execute. The kernel initializes its data structures and begins\
    \ loading other kernel modules. After all the necessary modules are loaded and\
    \ initialized, the kernel starts the /sbin/init program.\n+   \n+   4. **init**—In\
    \ this phase, the init program starts other processes on the basis of the information\
    \ in the /etc/inittab file. These processes include a program that calls the rc\
    \ scripts that set up various system services.\n\n# Kernel Modules\n\nKernel software\
    \ is divided into groups of related functions called *modules*. Some modules are\
    \ part of a small, common core of the operating system. Some modules provide platform-specific\
    \ operations, and other modules are device drivers. This architecture allows portions\
    \ of the kernel to be included"
  merge: -1
  img_proc: true
- pgno: 110
  md: 'or excluded on the basis of the desired functionality or enables portions of
    the kernel to be updated without replacing the entire kernel. Device drivers are
    dynamic kernel modules that are loaded when the device is accessed.


    The kernel modules are stored in three directories—two under the root file system
    and one under the /usr file system:


    +   - **/platform/sparc/kernel** for SPARC platforms or **/platform/i86pc/kernel**
    for x86 platforms—Modules specific to the platform

    +   - **/kernel**—Common kernel modules required for booting

    +   - **/usr/kernel**—Common kernel modules used by platforms with a particular
    instruction set


    The /etc/system file is used to determine which kernel modules are loaded and
    to define kernel parameters. This file takes the form of one or more keywords
    followed by one or more parameters. These are the supported keywords:


    +   - **exclude**—Prevents modules from loading

    +   - **forceload**—Forces a module to load

    +   - **moddir**—Changes the common kernel module directories

    +   - **rootdev**—Sets the physical pathname to the root device

    +   - **rootfs**—Defines the type of root file system

    +   - **set**—Sets kernel or module variables


    # The init Program


    The last phase of the boot process is the init program, which is used to control
    system processes and services. Its primary purpose is to create or stop processes
    on the basis of the system’s current state. The system state is referred to as
    a *system run level*. Several run levels are defined based on the type of activities
    the system should be supporting at a particular run level, such as maintenance,
    a single user, multiple users, and so on. Information on which processes and services
    should be running at a particular run level is stored in the /etc/inittab file.


    The default run level is defined in /etc/inittab by the initdefault entry. The
    following example shows run level 3 as the default run level:


    ```

    id:3:initdefault:

    ```'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Every run level (except 4) has an entry in the /etc/inittab file that identifies
    an rc program to execute. In addition, each run level has a directory associated
    with it, which contains rc scripts that should be executed by the rc program to
    start or stop processes and services when that run level becomes the current run
    level.


    The init program also sets the default environment variables as defined in /etc/default/init.
    These variables include local variables and system parameters based on location,
    such as the time zone.


    # System Run Levels


    To give the system administrator a convenient way to shut down or reboot the system
    and to control system services and resources, eight system run levels (also referred
    to as *init states*) are defined and assigned specific functionality. Table 4.5
    describes the eight run levels.


    **Table 4.5  The Eight System Run Levels**


    | Run Level | init State | Functionality |

    |---|---|---|

    | 0 | Power Down | The system is being shut down. All users are forced off the
    system. All operating system services are stopped in an orderly manner. When this
    process is complete, the system is at firmware mode. For SPARC platforms, firmware
    mode is the **ok** OpenBoot prompt. It is safe to turn off power to the system
    and peripherals. |

    | S or s | Single User | The system is prepared for maintenance. Any users are
    logged off the system. Any services except the most basic operating system services
    are stopped in an orderly manner. Any mounted file systems remain mounted. A command-line
    interface (with superuser privileges) is started and associated with the system
    console, so the system administrator can perform maintenance (such as system backup)
    without interference from users or applications. |'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Table 4.5 The Eight System Run Levels *(continued)*


    | Run Level | Init State | Functionality |

    |---|---|---|

    | 1 | Administrative | Any logged-on users are not affected. Multiple users can
    log on and use available system resources. All services except the most basic
    operating system services are stopped in an orderly manner. Any mounted file systems
    remain mounted. A command-line interface (with super-user privileges) is started
    and associated with the system console, so the system administrator can perform
    maintenance while allowing users to access the system. |

    | 2 | Multiuser | The system is set up for normal operations. Multiple users can
    log on and use system resources. All services, except the Network File System
    (NFS) server, are started. All default file systems are mounted. |

    | 3 | Multiuser with NFS | The system is set up for normal operations. This system
    state is typically the default. Multiple users can access and use system resources.
    All services, including resource sharing (the NFS server), are started. All default
    file systems are mounted. |

    | 4 | Alternative Multiuser | Currently, this state is not used and is unavailable.
    |

    | 5 | Power Down | The system is shut down. All users are logged off the system.
    All operating system services are stopped in an orderly manner. When this process
    is complete, it is safe to turn off power to the system and peripherals. If supported
    by the system hardware, the power to the system is automatically turned off. |

    | 6 | Reboot | The system is shut down (run level 0) and then restarted and brought
    back up to the default run level (as defined in the /etc/inittab file, typically
    3). |


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_112_0.png)


    > Solaris has eight run levels, of which seven are used. Even though no functionality
    is defined for run level 4, it is still considered a valid run level. Also note
    that the NFS client is started at run level 2, whereas the NFS server is started
    at run level 3.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# # Changing the System Run Level


    Occasionally, you’ll need to change the system run level—for example, when you
    shut down the system to add or remove hardware, perform backups, prepare for an
    expected power outage, or prepare to physically move the system to another location.
    Table 4.6 lists the commands you use to change the system run level from the command
    line.


    **Table 4.6 — Commands Used to Change the System Run Level**


    | Command | Path | Run Level(s) | Description |

    |---|---|---|---|

    | `halt` | `/usr/sbin` | `0` | Stops the processor(s) |

    | `init` | `/sbin` | `0, 1, 2, 3, 4, 5, 6, s` | Processes control initialization
    |

    | `poweroff` | `/usr/sbin` | `5` | Stops the processor(s) and powers off the system
    (if possible) |

    | `reboot` | `/usr/sbin` | `6` | Reboots the system |

    | `shutdown` | `/etc` | `0, 1, 5, 6, s` | Used for compatibility (symbolically
    linked to /usr/sbin/shutdown) |

    | `shutdown` | `/usr/sbin` | `0, 1, 5, 6, s` | Changes the system run level |

    | `telinit` | `/etc` | `0, 1, 2, 3, 4, 5, 6, s` | Used for compatibility (symbolically
    linked to /usr/sbin/init) |

    | `uadmin` | `/sbin` | `0, 5, 6` | Used for administrative control |


    The halt(1M) command normally logs the shutdown to the system log, writes a shutdown
    record to the system accounting file, performs a call to the sync(1M) command
    to write any pending information to the disks, and halts the processor(s). You
    can prevent system and account logging, along with disk syncing, by using command-line
    arguments. The halt command changes to run level 0 but does not execute the rc
    scripts associated with run level 0 as the shutdown(1M) and init(1M) commands
    do.


    You can use the init(1M) and telinit(1M) commands to change to any of the eight
    run levels. The commands identified in the /etc/inittab file for each run level
    are executed, and any running process not in /etc/inittab is sent a SIGTERM signal
    or possibly a SIGKILL signal (see Chapter 7, “Controlling Processes”) to cause
    it to terminate. For each run level, an entry in /etc/inittab runs the appropriate
    rc scripts to start and stop processes.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '![](img/b957f979417d9f16274c2eb52c8f2c9f_114_0.png)


    > The **init** command is unique in that it is the only command that can be used
    to change to any system run level. Although all the commands listed in Table 4.6
    can shut down/reboot the system (run levels 0, 1, 5, 6, s), only the **init**
    command can bring a system up from run level s or 1 to run level 2 or 3.


    The **poweroff**(1M) command changes the system to run level 5. Normally, it logs
    the shutdown to the system log, writes a shutdown record to the system accounting
    file, performs a call to **sync**(1M) to write any pending information to the
    disks, halts the processor(s), and, if possible, shuts off the power. The **poweroff**
    command is equivalent to the **init** 5 command.


    The **reboot**(1M) command changes the system to run level 6. Normally, it logs
    the reboot to the system log, writes a shutdown record to the system accounting
    file, performs a call to **sync** to write any pending information to the disks,
    and initiates a multiuser reboot.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_114_1.png)


    > The **reboot** command is unique in that it can pass arguments to the OpenBoot
    **boot** command using the `--` argument. For example, the command `reboot --
    -rv` passes the `-rv` command-line arguments to the OpenBoot **boot** command;
    they are then passed to the kernel. In this case, the `r` causes a reconfigure
    (probes all devices and build nodes), and the `v` enables verbose mode.


    The **shutdown** command (under both the /usr/sbin and /etc directories) provides
    a grace period and warning message capability and also executes the appropriate
    rc scripts. You can use the **shutdown** command to change to run levels 0, 1,
    5, 6, and s.


    The **shutdown** command without any command-line arguments results in a one-minute
    grace period with warning messages at 1 minute, 30 seconds, and now. The **shutdown**
    command prompts for confirmation to continue before the *shutdown now* message
    is broadcast and the run level change continues. The system is then changed to
    run level s.


    The **uadmin**(1M) command provides basic administrative functions, such as shutting
    down or rebooting a system. Typically, it is called by various system administration
    procedures and is not intended for general use.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_114_2.png)


    > You can use the **who -r** command to determine the system’s current run level
    and the date on which the change to that run level occurred.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Run Control (rc) Scripts


    As previously stated, every run level (except 4) has an entry in the /etc/inittab
    file that identifies an rc program to execute. In addition, each run level has
    a directory associated with it.


    The directory contains rc scripts that should be executed by the rc program to
    start or stop processes and services when that run level becomes the current run
    level. These rc programs and rc script directories use a standard naming convention
    based on the run level. For run level 0, the rc program is /etc/rc0, and /etc/rc0.d
    is the rc script directory. Likewise, for run level 1, the rc program is /etc/rc1,
    and /etc/rc1.d is the rc script directory. The same naming convention is applied
    for run levels 2, 3, and 5. Run levels 5 and 6 do not have separate rc directories
    but rather use the run level 0 rc directory.


    Typically, both the rc program and the scripts under the rc script directories
    are referred to as rc scripts. Referring to the script called directly from the
    /etc/inittab as the rc program helps avoid confusion.


    The rc scripts are shell scripts (typically Bourne) written to start and stop
    various processes and services. An rc script is usually written in two portions:
    a start portion and a stop portion. As the name implies, the start portion is
    executed to start a service, and the stop portion is called to stop a service.
    Therefore, a single script can control the service. When the rc program calls
    the rc script, the program provides either a start or stop command-line argument
    to the rc script, depending on whether the service should be started or stopped
    at a particular run level. The decision to start or stop a service is based on
    the name of the rc script in the appropriate rc directory.


    For example, the standard Unix utility to automate maintenance commands automatically
    is the cron program. It is usually started at run level 2 and stopped at run levels
    0, 1, 5, 6, and s. To start cron at run level 2, you can copy (or link) the cron
    rc script into /etc/rc2.d and name it S75cron. The S at the beginning of an rc
    script causes the rc program to start the service at the particular run level
    (in this example, run level 2) by calling the rc script with the start argument.


    Likewise, you can copy (or link) the same cron rc script into the /etc/rc0.d,
    /etc/rc1.d, and /etc/rcS.d directories and name it K40cron. The K at the beginning
    of an rc script causes the rc program to stop the service at a particular run
    level by calling the rc script with the stop argument.


    Note that the numbers included in the names of the cron rc script files are different.
    The numbers provide a method for the rc program to start or stop services in a
    particular, consistent order. The rc scripts with lower numbers'
  merge: -1
  img_proc: true
- pgno: 116
  md: "are executed before the rc scripts with higher numbers. This order is necessary\
    \ because some services require the presence of other services to operate properly.\n\
    \nFor example, a networking application requires that the networking services\
    \ be available, so the rc script to start the application should have a higher\
    \ number than the rc script to start the networking services. In addition, services\
    \ should be stopped in reverse order. For a networking application, the rc script\
    \ to stop the application should have a lower number than the rc script to stop\
    \ the networking services.\n\nCopies of all rc scripts are placed in the /etc/init.d\
    \ directory. To start or stop a particular service, the system administrator only\
    \ has to locate the appropriate rc script in a single directory.\n\n# Adding rc\
    \ Scripts\n\nUse the following procedure to add rc scripts for a new service:\n\
    \n+   1. Write a shell script that accepts the command-line arguments **start**\
    \ and **stop** and the appropriate actions to perform those functions.\n+   \n\
    +   2. As superuser, copy the new rc script to the /etc/init.d directory.\n+ \
    \  \n+   3. Determine the run level at which to start the service (typically 2).\n\
    +   \n+   4. Determine the two-digit number to control the start sequence (00\
    \ through 99). Look at the other startup rc scripts in the appropriate rc directory\
    \ and choose a number that is not being used: one that is higher than any required\
    \ services but lower than any services that will use the new service.\n+   \n\
    +   5. Copy or link the new script from the /etc/init.d directory to the appropriate\
    \ rc directory, giving it a name starting with **S** followed by the selected\
    \ two-digit number and then the service name.\n+   \n+   6. Determine the run\
    \ level(s) at which the service should stop (typically, 0, 1, and 6), meaning\
    \ that the script needs to be linked to one or more of the rc directories.\n+\
    \   \n+   7. Determine the two-digit number to control the stop sequence (00 through\
    \ 99). Look at the other stop rc scripts in the appropriate rc directories and\
    \ choose a number that is not being used: one that is lower than any required\
    \ services but higher than any services that were using the service.\n+   \n+\
    \   8. Copy or link the new script from the /etc/init.d directory to the appropriate\
    \ rc directories, giving it a name starting with **K** followed by the selected\
    \ two-digit number and then the service name."
  merge: -1
  img_proc: true
