- pgno: 513
  md: "# # Glossary\n\n**Access Control List (ACL)**  \nSolaris 8 extends the standard\
    \ Unix file permissions by adding an Access Control List capability. ACLs make\
    \ it possible to add permissions for specific users and groups along with a default\
    \ permission (mask). In addition to supporting the standard read/write/execute\
    \ permission for owner, group, and other, ACLs can be used to set read/write/execute\
    \ permissions for additional user accounts and group accounts and to define a\
    \ mask capability that controls the maximum allowed permissions given to user\
    \ and group accounts. The ACL for a directory includes default entries that determine\
    \ the permissions assigned to files and subdirectories created under the directory.\
    \ The setfacl(1M) command is used to set ACLs, and the getfacl(1M) command is\
    \ used to display ACLs.\n\n**Address Resolution Protocol (ARP)**  \nA protocol\
    \ used to map from an IP address to an Ethernet address.\n\n**architecture** \
    \ \nThe variation of the platform. For SPARC platforms, types of architecture\
    \ include sun4c and sun4m.\n\n**authorization (for Role-Based Access Control)**\
    \  \nThe right to perform restricted administrative functions, such as shutting\
    \ down the system.\n\n**AutoClient**  \nA type of network client that uses a small\
    \ local disk for swap space and a cached copy of the root and user file systems.\n\
    \n**AutoFS**  \nA network service and type of file system. AutoFS resources are\
    \ mounted automatically when an attempt is made to access them and are then unmounted\
    \ automatically after a period of being idle."
  merge: -1
  img_proc: true
- pgno: 514
  md: '# **AutoFS map**


    A file used to configure the AutoFS service. The three types of AutoFS maps are
    the /etc/auto_master file that identifies other maps, direct maps that identify
    full pathnames to mount points and associated NFS resources, and indirect maps
    that identify partial pathnames to mount points and associated NFS resources.


    # **boot server**


    A network server that provides the files necessary to boot an install client over
    the network during an over-the-network installation. After an install client has
    booted, the boot server has completed its function. The remainder of the installation
    is supported by an install server. Typically, an install server and a boot server
    reside on the same system. However, if install clients are on a different subnet
    than an install server, a boot server must be set up on the same subnet as the
    install clients.


    # **Bourne shell**


    A version of the Unix shell developed by Steven Bourne from AT&T Bell Labs. It
    is referred to as *sh*. The Bourne shell is the default shell for the Solaris
    operating system.


    # **C shell**


    A version of the Unix shell developed at the University of California at Berkeley.
    It is referred to as *csh*.


    # **CacheFS**


    A storage service and a type of file system. CacheFS is used to store a copy of
    a remote NFS resource locally. Doing so allows faster access and results in less
    network traffic.


    # **client**


    A networked computer system that uses services provided by a server.


    # **client/server**


    An operation model used by computer systems in which services are centralized
    on one or more servers and accessed by one or more clients via a network.


    # **client-side failover**


    Automatic switch to another NFS server that provides a “replicated” copy of a
    resource when the original NFS server becomes unavailable.


    # **Common Desktop Environment (CDE)**


    A graphical user interface based on the X Window System (also known as X Window).


    # **concatenated striped virtual device**


    A striped virtual device that has been expanded by concatenating additional slices
    to the end of the device.


    # **concatenated virtual device**


    A device consisting of two or more slices. The slices can be on the same physical
    disk or on several physical disks. The slices also can be different sizes. The
    slices are addressed in sequentially; that is, as space is'
  merge: -1
  img_proc: true
- pgno: 515
  md: "needed, it is allocated from the first slice in the concatenation. After this\
    \ space is used completely, space is allocated from the second slice, and so on.\n\
    \n**csh**  \nSee C shell.\n\n**Custom JumpStart**  \nAn automated installation\
    \ method that uses a predefined rules file and one or more profile files to determine\
    \ the system configuration to install, depending on architecture, equipped hardware,\
    \ or other defined characteristics. These files are located in the JumpStart configuration\
    \ directory.\n\n**daemon**  \nA task or process that after being run stays resident\
    \ in memory and executes in the background (and typically provides a service on\
    \ demand).\n\n**dataless client**  \nA type of network client that uses a small\
    \ local disk for swap space and a root file system. Other file systems are accessed\
    \ remotely.\n\n**device aliases**  \nAn OpenBoot feature that enables you to assign\
    \ a short, easy-to-use name to a full physical device pathname.\n\n**device driver**\
    \  \nSoftware modules that interface with physical resources and understand how\
    \ to communicate\n\nwith hardware devices and control their operation. Typically,\
    \ each device has a unique driver provided with the hardware and is identified\
    \ by hardware manufacturer, model, and sometimes hardware version.\n\n**direct\
    \ map**  \nA type of AutoFS configuration file that identifies the full path to\
    \ mount points and associated NFS resources.\n\n**directory**  \nA folder used\
    \ to organize files.\n\n**disk group**  \nA collection of Volume Manager (VM)\
    \ disks that share a common configuration.\n\n**disk label**  \nSee volume table\
    \ of contents.\n\n**diskless client**  \nA type of network client that does not\
    \ have any local storage. All file systems, along with swap space, are accessed\
    \ remotely.\n\n**domain**  \nA group of systems managed as a single entity by\
    \ using a name service, such as DNS, NIS, or NIS+.\n\n**Domain Name System (DNS)**\
    \  \nThe name service used on the Internet and other TCP/IP networks to resolve\
    \ hostnames to IP addresses and IP addresses to hostnames."
  merge: -1
  img_proc: true
- pgno: 516
  md: '# **duplexing**


    The technique of copying data being written to one online device to another, offline
    device. Duplexing provides a real-time backup of data that can be brought online
    to replace the original device if it fails. Each disk has its own controller.


    # **Dynamic Host Configuration Protocol (DHCP)**


    A protocol used by DHCP clients to request host configuration information from
    a DHCP server. The requested information includes IP address, subnet mask, default
    routers, and so on.


    # **dynamic reconfiguration**


    A system capability that supports hot plugging by allowing the system to recognize
    the new hardware (or even software) configuration without rebooting the system.


    # **Enterprise Volume Manager**


    A virtual disk management system. In addition to supporting disk mirroring and
    several RAID configurations, it provides statistics and dynamic tuning capability.


    # **/etc files**


    The original name service provided with the Unix operating system. Information
    in this case is stored in files located under the /etc directory (such as /etc/hosts).


    # **Ethernet address**


    A unique 48-bit Data Link layer address of a network interface. Also referred
    to as a hardware address,


    physical address, or Media Access Control (MAC) address.


    # **Federated Naming Service (FNS)**


    A name service that conforms to the X/Open Federated Naming Specification (XFN).


    # **file**


    A group of bytes treated as a unit for storage, retrieval, and manipulation.


    # **file server**


    A networked standalone system used to provide remote access to shared or common
    data.


    # **file system**


    A logical collection of files and directories contained in a partition. The file
    system can be treated as a single entity when making it available for use (mounting),
    checking, and repairing.


    # **group account**


    A unique name and associated group ID used to manage a collection of user accounts.


    # **group ID (GID)**


    A unique numeric ID assigned to a group account used for group ownership and permissions.


    # **host**


    A computer system that provides resources to locally and/or remotely logged-on
    users.


    # **hot plugging**


    A hardware capability that allows system components to be changed without shutting
    down the system.'
  merge: -1
  img_proc: true
- pgno: 517
  md: '# hot relocation


    The process Volume Manager uses to reconstruct a failed subdisk on a spare disk
    or free space within a disk group and then substitute the rebuilt subdisk for
    the failed subdisk.


    # hot spare


    A disk slice that DiskSuite automatically substitutes for a slice that has failed.


    # hot spare pool


    A collection of hot spares managed by DiskSuite.


    # indirect map


    A type of AutoFS configuration file that identifies partial pathnames to mount
    points and associated NFS resources. The partial pathnames are relative to the
    directory identified in the /etc/auto-master file.


    # initialization file templates


    Login and shell startup initialization files for each user account are copied
    from templates under the /etc/skel directory when the home directory for the user
    account is created.


    # initialization files


    Several initialization files are associated with each user account home directory.
    These files are used to specify commands to be executed when the associated event
    occurs. Depending on the login shell being used, there might be a login initialization
    file, a shell startup file, or a logout file. Commands in the login initialization
    file are executed when


    the user logs in. All three common shells provide a login initialization file.
    Commands in the shell startup file are executed whenever the logged-in user starts
    a shell. Both csh and ksh provide this capability. The ENV parameter is used to
    define the ksh shell startup initialization file. Only csh provides a file for
    automatic execution of commands when a user logs out.


    # install client


    A system that will be installed over the network. Basic information about install
    clients needs to be available through a name service (NIS/NIS+) or in the files
    under the /etc directory on the install server or boot server.


    # install server


    A network server that provides the distribution files necessary for installing
    the Solaris operating system on an install client during an over-the-network installation.
    The files can be provided directly from the Solaris distribution CD mounted in
    a local CD-ROM drive or from the local hard disk.


    # installation


    The four installation methods are SunInstall, Web Start, JumpStart, and Custom
    JumpStart. All four methods can use a local CD-ROM or over-the-network installation
    resources to obtain the distribution files. The installation process is divided
    into three phases: system configuration, system installation, and post-installation.'
  merge: -1
  img_proc: true
- pgno: 518
  md: '# **JumpStart**


    An automated installation process that uses standardized configurations based
    on system architecture and hardware to determine the system configuration to install.


    # **JumpStart configuration directory**


    A directory that contains the files used to customize a JumpStart installation.
    It provides a means to automate the system configuration phase of an installation
    for groups of similar systems. This directory can reside on a floppy disk, referred
    to as a profile disk, or on a network server, referred to as a profile server.
    The two basic types of files in the JumpStart directory are rules file and one
    or more profile files.


    # **kernel**


    A collection of software that manages a computer’s physical and logical resources.
    These management services include controlling the allocation of memory and other
    storage devices, controlling access to peripheral devices (input/output), and
    controlling the scheduling and execution of processes or tasks. The kernel is
    one of the three parts of an operating system. (The other parts are the shell
    and the file systems.)


    # **kernel modules**


    Kernel software divided into groups of related functions. Some modules are part
    of a small, common core of the operating system, some modules provide platform-specific
    operations, and other


    modules are, device drivers. This architecture allows portions of the kernel to
    be included or excluded on the basis of desired functionality or allows portions
    of the kernel to be updated without replacing the entire kernel. The device drivers
    are loaded when the device is accessed.


    # **Korn shell**


    A version of the Unix shell developed by David Korn from AT&T Bell Labs and referred
    to as ksh. It combines the best features of the Bourne shell and the C shell.


    # **ksh**


    See Korn shell.


    # **Lightweight Directory Access Protocol (LDAP)**


    A common protocol used by many vendors to provide access to directory services.


    # **localhost**


    The loopback IP address for the local system; typically, it’s 127.0.0.1 but can
    be any address starting with 127.


    # **logical device name**


    A naming convention used to identify disk, tape, and CD-ROM devices and provide
    either raw access (one character at a time) or block access (via a buffer for
    accessing large blocks of data). All logical device names reside under the /dev
    directory, and the /dev/rdsk subdirectory identifies the device as a block disk
    device. (The /dev/rdsk subdirectory indicates a raw disk.)'
  merge: -1
  img_proc: true
- pgno: 519
  md: "**m4 macro**  \nAn interpreted command syntax used to control the execution\
    \ of conditional statements.\n\n**man page**  \nA page from the *Solaris 8 System\
    \ Reference Manual* that describes a command, system call, library routine, file\
    \ format, and so on.\n\n**mandatory locking**  \nA special file permission that\
    \ prevents a program from reading or writing a file while another program has\
    \ the file open.\n\n**memory management**  \nA means of keeping track of available\
    \ memory, allocating it to processes as needed, and reclaiming it as processes\
    \ release it or terminate.\n\n**metadevice**  \nThe basic virtual disk DiskSuite\
    \ uses to manage physical disks.\n\n**mirroring**  \nThe technique of copying\
    \ data being written to one online device to another, offline device. Mirroring\
    \ provides a real-time backup of data that can be brought online to replace the\
    \ original device if the original device fails. Typically, the two disks share\
    \ the same controller.\n\n**mount point**  \nA directory in a mounted file system\
    \ that serves as an access point for another file system.\n\n**mounting**  \n\
    The process of associating a file system or NFS resource with a directory (mount\
    \ point) so that users and programs can access it.\n\n**multitasking**  \nThe\
    \ capability to execute more than one process or task at a time.\n\n**multiuser**\
    \  \nThe capability of a system to support multiple simultaneous users.\n\n**name\
    \ service**  \nA network service that provides a centralized location for information\
    \ that users and systems use to communicate with each other across the network.\
    \ The name service not only stores the information, but also provides mechanisms\
    \ to manage and access that information.\n\n**name service switch**  \nA configuration\
    \ file used to select which name services to use and in what order.\n\n**namespace**\
    \  \nA collection of information about systems within the domain of a name service.\n\
    \n**network client**  \nA system containing little to no local storage space.\
    \ Some or all of the necessary files for booting and operation are accessed remotely\
    \ via the network."
  merge: -1
  img_proc: true
- pgno: 520
  md: '# Network File System (NFS)


    A network service and type of file system. This service allows local storage,
    such as file systems, to be accessible by other systems via the network. RFC 1813
    defines version 3 of the NFS protocol.


    # Network Information Service (NIS)


    A name service that stores information in maps and makes it available to NIS clients
    that request it.


    # Network Information Service Plus (NIS+)


    An enhanced version of NIS that stores information in tables. Security is provided
    by using authentication and authorization.


    # nonvolatile random access memory (NVRAM)


    An area of memory used to store OpenBoot parameters that is not affected by powering
    down or rebooting the system.


    # Open Systems Interconnect (OSI) Network Model


    The network model developed by the International Organization for Standardization
    (ISO), consisting of seven layers of services. Each layer is responsible for handling
    a different aspect of network communication.


    # Open Windows


    A graphical user interface based on the X Window System.


    # OpenBoot


    The standard firmware for Sun Systems. OpenBoot is used to boot the operating
    system, run diagnostics, and modify boot-related parameters stored in nonvolatile
    RAM (NVRAM), and it provides a Forth interpreter. OpenBoot firmware pertains only
    to SPARC platforms, but some limited functionality is available on Intel x86 platforms.


    # operating system release


    The version of an operating system, such as 7 or 8 for Solaris.


    # operating system (OS) server


    A network server that provides network clients with access to operating system
    files as required.


    # operating system (OS) service


    A set of files needed to support a particular network client. An OS service is
    identified and configured for a combination of platform, system architecture,
    and OS release.


    # over-the-network installation


    Solaris can be installed over the network by using an install server that has
    the Solaris distribution CD in its CD-ROM drive or a copy of the files from the
    Solaris distribution CD on its hard disk. A boot server might also be required.


    # partition


    A contiguous collection of disk sectors as defined by the partition table. After
    a partition is defined in the partition table, a file system can be created within
    the partition.'
  merge: -1
  img_proc: true
- pgno: 521
  md: '**partition table**

    A table in the VTOC that contains an entry for each partition on the disk.


    **password aging**

    The parameters of the /etc/shadow file determine the password aging policy. These
    parameters enforce a policy for protecting password integrity.


    **Peripheral Component Interconnect (PCI)**

    A slot- and card-based bus mechanism used to connect video adapters, network cards,
    sound cards, and other devices to a computer system.


    **platform**

    The particular type of hardware—for Solaris, either SPARC or Intel x86 compatible.


    **plex**

    A collection of Volume Manager subdisks organized to support various levels of
    RAID.


    **post-installation phase**

    The installation phase during which any appropriate patches and applications are
    installed and custom configurations, such as user accounts and environments, are
    set up.


    **preconfigured system information**

    Two methods are available for preconfiguring system information: using the sysidcfg
    file and using a name service.


    **privileged operation**

    A Solaris command executed with the UID and/or GID set to the correct value to
    allow proper operation.


    **process**

    A task or program that the computer system is currently executing.


    **profile (Role-Based Access Control)**

    A mechanism used to assign authorizations and/or privileged operations to roles.


    **profile disk**

    A disk containing the JumpStart configuration directory—that is, a rules file
    and one or more profile files.


    **profile file**

    A text file that defines how to install the Solaris 8 software on a system. Like
    the rules file, a profile file contains keywords and associated values that guide
    the installation.


    **profile server**

    A server that provides access to a Custom JumpStart configuration directory over
    the network and eliminates the need to create and distribute multiple profile
    disks during the installation of large numbers of systems.


    **pseudo file system**

    A memory-based file system.


    **RAID**

    Redundant array of independent disks.'
  merge: -1
  img_proc: true
- pgno: 522
  md: '# remote authentication database


    Used to determine which remote hosts and users are considered trusted. The rlogin,
    rsh, and rcp commands use the remote authentication database. This database consists
    of two types of files: the /etc/hosts.equiv file, which applies to the entire
    system, and the $HOME/.rhosts files, which apply to individual user accounts and
    are located in the home directories of user accounts.


    # Remote Procedure Call (RPC)


    A mechanism that allows a client to request a remote server to execute a procedure
    or process.


    # Request For Comment (RFC)


    A document used to publish networking-related policies and protocols so that interested
    parties can submit comments and recommend changes. After a period of time, the
    RFC can be adopted as a standard by the U.S. government and industry. RFCs have
    defined protocols such as TCP/IP and NFS. For more information, see http://www.rfc-editor.org.


    # Reverse Address Resolution Protocol (RARP)


    A protocol used to map from an Ethernet address to an IP address.


    # role


    A special type of user account provided by the Role-Based Access Control mechanism
    to grant a set of superuser privileges to perform some administrative tasks.


    # Role-Based Access Control (RBAC)


    A mechanism used to grant access to privileged operations or commands to accounts
    as needed to perform a task.


    # rules file


    A text file containing an entry or rule for each system or group of systems to
    be automatically installed. Each rule identifies the system (or group of systems)
    based on one or more attributes and identifies a unique profile file that provides
    configuration details for that system or group of systems. Each rule consists
    of one or more keywords and values followed by the name of the profile file.


    # run control (rc) script


    A shell script (typically Bourne) written to start and stop processes and services.
    An rc script is usually written in two portions: a start portion and a stop portion.
    The appropriate portion is executed when the system is booted or shut down.


    # server


    A computer system that provides resources to remote clients.


    # setgid


    A special file access mode that sets the effective GID of the user account executing
    a program to the GID of the program group owner. The setgid permission has an
    absolute mode of 2000 and a symbolic mode of s.'
  merge: -1
  img_proc: true
- pgno: 523
  md: '# setuid


    A special file access mode that sets the effective UID of the user account executing
    a program to the UID of the program owner. The setuid permission has an absolute
    mode of 4000 and a symbolic mode of **s**.


    # SGML


    The Standard Generalized Markup Language used to provide a generic method of encoding
    a document’s contents without associating it with a particular format.


    # sh


    See Bourne shell.


    # share


    The process of making an NFS resource available for mounting by remote NFS clients.


    # shell


    A software module that provides the interface between users and the kernel. One
    of the three parts of an operating system. (The other parts are the kernel and
    the file systems.)


    # signal


    A notification sent to a process to indicate an event or an action that should
    be performed. Signals can be used to terminate processes.


    # slice


    See partition.


    # small computer system interface (SCSI)


    A bus-based peripheral device connection mechanism typically used for disk drives
    and tape drives.


    # software cluster


    A logical grouping of software packages. Clusters are necessary because some software
    is distributed in more than one package, but all the packages need to be distributed
    and installed as a unit.


    # software configuration cluster


    See software group.


    # software group


    A collection of software clusters. Depending on the intended use of the system,
    the most appropriate software group should be selected for installing an operating
    system.


    # software package


    An easily installable collection of Solaris 8 system and application software.
    These packages consist of files and directories that can be copied onto the system
    from CD-ROM or magnetic tape as a single compressed file and then uncompressed
    for installation. Included with the package is information about the package,
    such as its title, storage requirements, and version. Also included are any custom
    scripts needed to properly install the software.


    # software patch


    An easily installable collection of file and directories intended to update or
    fix a problem with an installed software.'
  merge: -1
  img_proc: true
- pgno: 524
  md: '# SPARC


    A computer architecture developed by Sun Microsystems. It uses a reduced instruction
    set processor, which provides superior performance over processors that operate
    using a standard instruction set.


    # standalone system


    A system that uses local disk space to store all operating system files, applications,
    and user data, including the root (/), /usr, /export/home, and /var file systems.
    Likewise, a standalone system provides local swap space for the system’s virtual
    memory. A standalone system can function autonomously and can be networked or
    non-networked.


    # sticky bit


    A special file permission that, when set on a directory allowing write permission
    for everyone, permits only the user account that created the files and subdirectories
    under that directory to remove those files and subdirectories. A sticky bit is
    especially useful for the /tmp directory, which is available from any user account.
    The sticky bit permission has an absolute mode of 1000 and a symbolic mode of
    t.


    # striped virtual device


    A device consisting of two or more slices. The slices can be on the same physical
    disk or on several physical disks. The slices also can be different sizes. They
    are addressed in an interleaved manner. That is, as space is needed, it is allocated
    as a


    block from the first slice, then a block from the second slice, and so on.


    # subdisk


    The basic unit Volume Manager uses to allocate storage. A subdisk is a portion
    of the public region of a VM disk.


    # SunInstall


    An interactive Open Windows installation program that can be used to install the
    Solaris 8 software but does not support installation of co-packaged software.


    # superuser


    A special administrative account (“root”) that provides the ultimate in terms
    of access to data and services because it can override any file permissions on
    the system.


    # swap space


    Disk space used as virtual memory. Swap space can be on a local disk or on a remote
    disk that is accessed via the network.


    # syslog


    A facility used to collect messages from system programs and applications. These
    messages are identified by a source facility and priority level. The /etc/syslog.conf
    file assigns an action to each combination of source and priority level.


    # syslog actions


    The action that should be performed when the syslogd daemon receives a syslog
    message of the identified source.priority.'
  merge: -1
  img_proc: true
- pgno: 525
  md: '# **syslog priority levels**


    A syslog message can be identified by priority level or severity. This identification
    provides a second mechanism (with finer granularity) for handling messages on
    the basis of importance.


    # **syslog source facilities**


    The facilities generating syslog messages can be used to determine where the messages
    are sent or stored. Doing so allows separate log files for different types of
    messages based on source.


    # **system configuration phase**


    The installation phase during which basic information about the system, such as
    hostname and domain, is identified. This information can optionally be set up
    ahead of time (preconfigured).


    # **system installation phase**


    The installation phase during which the system software is installed. The system
    software is one of the Solaris 8 software groups.


    # **system profile**


    For user accounts that use sh (Bourne shell) or ksh (Korn shell) as a login shell,
    commands in the system profile (/etc/profile) are executed before the user’s login
    initialization file.


    # **system run levels**


    Eight defined levels, each associated with specific functions used to shut down
    or reboot the system and control system services and resources.


    # **Transmission Control Protocol/Internet Protocol (TCP/IP) Network Model**


    A network model consisting of five layers of services. Each layer is responsible
    for handling a different aspect of network communication.


    # **UFS file system logging**


    Updates to a UFS file system are recorded in a log before they are applied. In
    the case of system failure, the system can be restarted, and the UFS file system
    can quickly use the log instead of having to use the fsck command.


    # **user account**


    A unique name and user ID that control an individual’s access to a computer and
    its resources.


    # **user ID (UID)**


    A unique numeric ID assigned to a user account that is used for file and process
    ownership and access permissions.


    # **Veritas File System (vxfs)**


    The type of virtual file system that Enterprise Volume Manager supports.'
  merge: -1
  img_proc: true
- pgno: 526
  md: '# virtual disk management system


    A software package that allows the use of physical disks in different ways than
    the standard Solaris file systems do not support. It can overcome disk capacity
    and architecture limitations and improve performance and reliability. In addition,
    the use of a graphical management tool enhances manageability.


    # virtual file system


    An enhanced file system that provides improved performance and data reliability.


    # volume


    An Enterprise Volume Manager virtual disk device composed of up to 32 plexes.
    The volume is the virtual object that the operating system and applications view
    and manipulate.


    # Volume Manager (VM) disk


    A physical disk partition or slice that has been assigned to Enterprise Volume
    Manager.


    # volume table of contents (VTOC)


    Contains the partition table and geometry data about the disk, such as sectors
    per track, tracks per cylinder, available cylinders, and so on.


    # WebNFS


    A protocol that allows Web browsers to access NFS resources. RFCs 2054 and 2055
    define this protocol.


    # Web Start


    An interactive installation method that uses a Web browser interface.


    # x86 Intel compatible


    A computer architecture based on a microprocessor originally designed by the Intel
    Corporation, which used the 286, 386, 486 series of numbers to denote versions.


    # X/Open Federated Naming Specification (XFN)


    The specification for the Federated Naming Service (FNS) as defined by the X/Open
    Consortium.


    # zone


    A portion of a domain delegated to a DNS server.'
  merge: -1
  img_proc: true
