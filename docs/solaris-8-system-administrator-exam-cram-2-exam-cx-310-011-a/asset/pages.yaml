- pgno: 269
  md: "# Question 3\n\n+   Which of the following vi commands replaces all occurrences\
    \ of the text string **old** with the text string **new**?\n+   \n+   - a. `:g/old/s/new/`\n\
    +   - b. `:1,$s/old/new/g`\n+   - c. `:s/old/new/g`\n+   - d. `:1,$s/old/new/`\n\
    +   - e. `:1,$s/old/new/g`\n\nAnswer e is correct. The `:1,$s/old/new/g` command\
    \ replaces all occurrences of the text string **old** with the text string **new**.\
    \ The `:g/old/s/new/` and `:1,$s/old/new/` commands replace the first occurrence\
    \ of **old** in each line with **new**. Therefore, answers a and d are incorrect.\
    \ `:!old/new/g` does not work because the `!` is used to execute a shell command.\
    \ Therefore, answer b is incorrect. `:s/old/new/g` replaces all occurrences of\
    \ **old** with **new**, but only for the current line. Therefore, answer c is\
    \ incorrect.\n\n# Question 4\n\nMatch each of the following **ftp** subcommands\
    \ with its description.\n\n| Subcommand | Description |\n|---|---|\n| a. **binary**\
    \ | 1. Transfers multiple files to the remote system |\n| b. **hash** | 2. Transfers\
    \ multiple files to the local system |\n| c. **ascii** | 3. Doesn't map newline\
    \ characters during transfer |\n| d. **mput** | 4. Maps newline characters during\
    \ transfer |\n| e. **mget** | 5. Changes the working directory on the local system\
    \ |\n| f. **lcd** | 6. Prints a # character for every 8,192 characters transferred\
    \ |\n\nAnswers a-3, b-6, c-4, d-1, e-2, and f-5 are correct. **binary** mode does\
    \ not map newlines in transferred data. The **hash** subcommand marks every 8,192\
    \ characters transferred with a # character. **ascii** mode maps newlines in transferred\
    \ data. The **mput** subcommand transfers multiple files to the remote system.\
    \ The **mget** subcommand transfers multiple files to the local system. The **lcd**\
    \ subcommand changes the local working directory."
