- pgno: 143
  md: "# # Practice Questions\n\n# ## Question 1\n\n+   Which command is used to determine\
    \ the default access mode for files when they are created?\n+   \n+   - a. `setfacl`\n\
    +   - b. `chmod`\n+   - c. `umask`\n+   - d. `getfacl`\n+   - e. `ls`\n\nAnswer\
    \ c is correct. The umask command determines the default access mode for files\
    \ when they are created. The setfacl and chmod commands set access modes of existing\
    \ files. Therefore, answers a and b are incorrect. The getfacl and ls commands\
    \ display access modes of existing files. Therefore, answers d and e are incorrect.\n\
    \n# ## Question 2\n\n+   Which of the following are true about the listing produced\
    \ by executing the `ls -F` command? (Select all that apply.)\n+   \n+   - ☐ a.\
    \ The names of directories are followed by a forward slash (`/`).\n+   - ☐ b.\
    \ The names of symbolic links are followed by an asterisk (`*`).\n+   - ☐ c. The\
    \ names of directories are followed by a plus sign (`+`).\n+   - ☐ d. The names\
    \ of executable files are followed by an asterisk (`*`).\n+   - ☐ e. The names\
    \ of symbolic links are followed by an ampersand (`@`).\n\nAnswers a, d, and e\
    \ are correct. In the listing that results from the `ls -F` command, directory\
    \ names are followed by a forward slash, executable filenames are followed by\
    \ an asterisk, and symbolic link names are followed by an ampersand. Symbolic\
    \ links are not followed by an asterisk. Therefore, answer b is incorrect. Directory\
    \ names are not followed by a plus sign. Therefore, answer c is incorrect."
  merge: -1
  img_proc: true
- pgno: 144
  md: "# Question 3\n\nGive the command (without command-line arguments) used to add\
    \ read/write permission for user account fred to a file owned by user account\
    \ george.\n\nThe correct answer is **setfacl**.\n\n# Question 4\n\n+   To restrict\
    \ logging in directly as root to the system console, which file needs to be modified?\n\
    +   \n+   - a. `/dev/console`\n+   - b. `/etc/passwd`\n+   - c. `/etc/default/login`\n\
    +   - d. `/etc/default/su`\n\nAnswer c is correct. To restrict root login to the\
    \ system console, you must modify the /etc/default/login file. /dev/console is\
    \ the pathname for the console. Therefore, answer a is incorrect. /etc/passwd\
    \ is the password file. Therefore, answer b is incorrect. /etc/default/su is the\
    \ file that controls the behavior of the **su** command. Therefore, answer d is\
    \ incorrect.\n\n# Question 5\n\nWhere are user account passwords stored?\n\nThe\
    \ correct answer is /etc/shadow.\n\n# Question 6\n\n+   The file test currently\
    \ has the access mode 644. Which of the following will add mandatory locking?\
    \ (Select all that apply.)\n+   \n+   - a. `chmod 2664 test`\n+   - b. `chmod\
    \ 2674 test`\n+   - c. `chmod g+s test`\n+   - d. `chmod g-x test`\n+   - e. `setfacl\
    \ -s u::rw-,g::rw-,o::r-- test`"
  merge: -1
  img_proc: true
- pgno: 145
  md: "Answers a, c, and d are correct. The **chmod** commands in those answers will\
    \ add mandatory locking. The command **chmod 2674 test** also adds group execution,\
    \ which results in setgid permission, not mandatory locking. Therefore, answer\
    \ b is incorrect. The **setfacl** command cannot be used to add or remove mandatory\
    \ locking. Therefore, answer e is incorrect.\n\n# Question 7\n\n+   The file `/etc/default/su`\
    \ controls the behavior of the **su** command, which includes which of the following?\
    \ (Select all that apply.)\n+   \n+   - [ ] a. Displaying **su** usage on the\
    \ system console\n+   - [ ] b. Restricting superuser usage to the system console\n\
    +   - [ ] c. Logging failed **su** attempts\n+   - [ ] d. Enabling logging of\
    \ **su** usage through syslog\n+   - [ ] e. Logging successful **su** attempts\n\
    \nAnswers a, c, d, and e are correct. You can use `/etc/default/su` to control\
    \ **su** behavior by displaying **su** usage on the system console, logging failed\
    \ **su** attempts, enabling logging of **su** usage through syslog, and logging\
    \ successful **su** attempts. You restrict superuser usage to the system console\
    \ by editing the `/etc/default/login` file. Therefore, answer b is incorrect.\n\
    \n# Question 8\n\n+   Which of the following shows the access mode of a file that\
    \ has setuid enabled?\n+   \n+   - ○ a. `srwxrwxrwx`\n+   - ○ b. `-rwsrwxrwx`\n\
    +   - ○ c. `-rwxrwsrwx`\n+   - ○ d. `-rwxrwxrws`\n+   - ○ e. `-rwxrwxrwt`\n\n\
    Answer b is correct. The file access mode of **-rwsrwxrwx** shows that the file\
    \ has setuid enabled. **srwxrwxrwx** and **-rwxrwxrws** are not valid file access\
    \ modes. Therefore, answers a and d are incorrect. **-rwxrwsrwx** shows setgid,\
    \ and **-rwxrwxrwt** shows the sticky bit set. Therefore, answers c and e are\
    \ incorrect."
  merge: -1
  img_proc: true
- pgno: 146
  md: "# Question 9\n\n+   The file test currently has the access mode 644. Which\
    \ of the following will add write access for the group owner? (Select all that\
    \ apply.)\n+   \n+   - [ ] a. `chmod test 664`\n+   - [ ] b. `chmod 664 test`\n\
    +   - [ ] c. `chmod test g+w`\n+   - [ ] d. `chmod g+w test`\n+   - [ ] e. `setfacl\
    \ -s u::rw-,g::rw-,o::r-- test`\n\nAnswers b, d, and e are correct. Each of those\
    \ commands add write access for the group owner. Even though the `setfacl -s`\
    \ command replaces the existing ACLs, the original access mode is reinstated along\
    \ with the added group write access. Using `setfacl -m` would also have worked,\
    \ but was not specified as an answer. The commands `chmod test 664` and `chmod\
    \ test g+w` do not follow the correct syntax. Therefore, answers a and c are incorrect.\n\
    \n# Question 10\n\nMatch each of the following ls command-line arguments with\
    \ its function.\n\n| Argument | Function |\n|---|---|\n| a. `-R` | 1. Displays\
    \ directory names instead of directory contents |\n| b. `-l` | 2. Identifies file\
    \ types by using `/`, `*`, `@`, and other characters |\n| c. `-a` | 3. Recursively\
    \ lists the contents of subdirectories |\n| d. `-F` | 4. Lists file permissions,\
    \ owner, group, size, and so on |\n| e. `-d` | 5. Lists directory/file names beginning\
    \ with a dot (`.`) |\n\nAnswers a-3, b-4, c-5, d-2, and e-1 are correct. `-R`\
    \ recursively lists directory contents; `-l` lists permissions, owner, and so\
    \ on; `-a` lists names beginning with a dot; `-F` identifies file types; and `-d`\
    \ lists directory names."
