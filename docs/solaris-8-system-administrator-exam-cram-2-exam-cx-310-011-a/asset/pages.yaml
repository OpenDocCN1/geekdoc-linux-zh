  md: "# # Practice Questions\n\n# ## Question 1\n\n+   Which of the following can\
    \ be used to install multiple patches? (Select all that apply.)\n+   \n+   - [\
    \ ] a. `patchadd -M /var/spool/patch 104567-03 106583-10 103276-04`\n+   - [ ]\
