  md: "# # Practice Questions\n\n# ## Question 1\n\n+   Which of the following activities\
    \ can be performed by using the **format** command? (Select all that apply.)\n\
    +   \n+   - ☐ a. Display a partition table.\n+   - ☐ b. Modify a single partition\
    \ in a partition table.\n+   - ☐ c. Replace the entire partition table.\n+   -\
    \ ☐ d. Copy the partition table from one disk to another.\n\nAnswers a, b, and\
    \ c are correct. Using the **format** command, you can display a partition table,\
    \ modify a single partition in a partition table, and replace the entire partition\
    \ table. Although a partition table can be created, saved, and used on another\
    \ disk, the **format** command does not provide a method for copying a table from\
    \ one disk to another. Therefore, answer d is incorrect.\n\n# ## Question 2\n\n\
    Enter the command that can be used to display the date and time the file systems\
    \ were mounted.\n\nThe correct answer is **mount**.\n\n# ## Question 3\n\n+  \
    \ Which command supports dynamic reconfiguration for hot-plugging?\n+   \n+  \
    \ - ○ a. **reconfig**\n+   - ○ b. **configadm**\n+   - ○ c. **cfgadm**\n\nAnswer\
    \ c is correct. The **cfgadm** command supports dynamic reconfiguration for hot-plugging.\
    \ The commands in answers a and b do not exist.\n\n![](img/b957f979417d9f16274c2eb52c8f2c9f_213_0.png)"
  merge: -1
