    Another special file permission is the sticky bit. Originally, it was used to
    indicate programs that should be left in memory after execution. When set for
    frequently used programs, the sticky bit saved time and CPU cycles by using the
    image left in memory instead of loading it from disk again.


    When the sticky bit is set on a directory that allows write permission for everyone,
    only the user account that created files and subdirectories under the directory
    can remove those files and subdirectories. This restriction is especially useful
    for the /tmp directory, which is available from any user account.


    The sticky bit permission has an absolute mode of 1000 and a symbolic mode of
    t when used with the chmod command. This permission is shown as t in the other
    account execution permission field in the output of an ls command, but it is considered
    a user account (owner) permission. The following example shows using the chmod
    command to remove the sticky bit permission and then add it to a directory:


