  img_proc: true
- pgno: 93
  md: 'Because the default backup directory could have been changed during installation
    by using the **-B** command-line argument to the **patchadd** command, the **patchrm**
    command also supports the **-B** argument. In addition, you can force the **patchrm**
    command to remove a patch that has been superseded by another patch by using the
    **-f** command-line argument.


    You can remove installed patches and return the system to the state it was in
    before the patch was installed as long as the following conditions are met:


    +   - The patch is not required by another patch or has been made obsolete by
    a later patch.

    +   - The patch was not installed by using **patchadd -d**, which instructs **patchadd**
    not to save a copy of files before they are updated or replaced.'
  merge: -1
