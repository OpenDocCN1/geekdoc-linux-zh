    The /etc/shadow file is an ASCII file that stores encrypted passwords for local
    user accounts along with any password restrictions or aging. Access is restricted
    to superusers to protect the passwords. Each line represents the password of a
    user account and consists of nine colon-delimited fields. Table 5.2 lists the
    fields of an entry in the /etc/shadow file.


    | Field | Purpose |

    |---|---|

    | User account | Relates the /etc/shadow entry to a user account defined in the
    /etc/passwd file. |

    | Password | A 13-character encrypted password for the associated user account.
