  md: 'Normally, the directory in which the new directory is to be created must already
    exist. However, if you specify the **-p** command-line argument, any necessary
    parent directories are created first. The following examples show several uses
    of the **mkdir** command. The first creates a directory using the **umask** permissions.
    The second creates a directory with specified permissions. The third fails because
    a necessary parent directory does not exist. The fourth **mkdir** command uses
    the **-p** command-line argument to create the parent directory:


    ```

