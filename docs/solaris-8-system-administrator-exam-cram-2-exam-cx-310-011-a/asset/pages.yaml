    ```

    ```


    You can use the **zcat(1)** command to view the contents of a file compressed
    with the **compress** command. However, the **zcat** command does not generate
    an uncompressed file or remove the compressed file as the **uncompress** command
    does.


    # ## The gzip and gunzip Commands


    The gzip command uses the adaptive Lempel-Ziv coding (LZ77) algorithm to compress
    one or more files specified as command-line arguments (separated by spaces). Files
    compressed with the gzip command are given a .gz extension. You can uncompress
    files with the gunzip command, specifying the filenames as command-line arguments
    (separated by spaces). Note that the gzip command can be used only on regular
    files, and each file is compressed separately. The following example shows the
    use of these commands:


    ```

    ```text

    # ls -l

    total 3

    -rw-r--r--  1 root     other    103306 Apr  6 02:27 file4


    # gzip file4


    # ls -l

    total 7

    -rw-r--r--  1 root     other     32757 Apr  6 02:27 file4.gz


    # gunzip file4


    # ls -l

    total 3

    -rw-r--r--  1 root     other    103306 Apr  6 02:27 file4

    #

    ```

    ```


    You can use the **gzcat(1)** command to view the contents of a file compressed
    by the **gzip** command. However, the **gzcat** command does not generate an uncompressed
    file or remove the compressed file as the **gunzip** command does.


    # ## The zip and unzip Commands


    The zip command compresses one or more files and/or directories specified as command-line
    arguments into a single archive. Archives created by the zip'
