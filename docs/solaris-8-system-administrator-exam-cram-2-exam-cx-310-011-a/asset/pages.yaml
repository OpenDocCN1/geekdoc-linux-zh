  md: "# # Practice Questions\n\n# ## Question 1\n\n+   Which of the following versions\
    \ of OpenBoot are currently supported by Sun Microsystems? (Select all that apply.)\n\
    +   \n+   - [ ] a. 1.x\n+   - [ ] b. 2.x\n+   - [ ] c. 3.x\n+   - [ ] d. 4.x\n\
    \nAnswers b and c are correct. OpenBoot versions 2.x and 3.x currently are supported\
    \ by Sun Microsystems. Version 1.x is no longer supported. Therefore, answer a\
    \ is incorrect. Version 4.x does not exist. Therefore, answer d is incorrect.\n\
    \n# ## Question 2\n\n+   Which OpenBoot command can be used to view system configuration\
    \ information?\n+   \n+   - ( ) a. `env`\n+   - ( ) b. `display`\n+   - ( ) c.\
    \ `banner`\n+   - ( ) d. `list`\n+   - ( ) e. `show`\n\nAnswer c is correct. You\
    \ can use the **banner** command to view system configuration information. The\
    \ Solaris 8 **env** command lists shell variables in the current environment.\
    \ Therefore, answer a is incorrect. The commands in answers b, d, and e do not\
    \ exist, although a **show-dev** OpenBoot command does."
  merge: -1
  img_proc: true
- pgno: 118
  md: "# ## Question 3\n\n+   Which of the following OpenBoot commands are used to\
    \ test hardware? (Select all that apply.)\n+   \n+   - [ ] a. **probe-scsi**\n\
    +   - [ ] b. **test floppy**\n+   - [ ] c. **test net**\n+   - [ ] d. **watch-clock**\n\
    +   - [ ] e. **test memory**\n\nAnswers a, b, c, and d are correct. The **probe-scsi**,\
    \ **test floppy**, **test net**, and **watch-clock** commands test the SCSI controller,\
    \ floppy disk drive, network interface, and system clock, respectively. The correct\
    \ command to test memory is **test /memory** (note the **/** before memory). Therefore,\
    \ answer e is incorrect.\n\n# ## Question 4\n\nName the OpenBoot command used\
    \ to delete a nonvolatile device alias.\n\nThe correct answer is either **nvunalias**\
    \ or **set-defaults**.\n\n# ## Question 5\n\n+   Which emergency keyboard command\
    \ is used to abort the boot process?\n+   \n+   - ( ) a. stop\n+   - ( ) b. stop+a\n\
    +   - ( ) c. stop+b\n+   - ( ) d. stop+s\n+   - ( ) e. stop+!\n\nAnswer b is correct.\
    \ The stop+a emergency keyboard command aborts the boot process. The stop keyboard\
    \ command bypasses the POST. Therefore, answer a is incorrect. The keyboard commands\
    \ in answers c, d, and e do not exist."
  merge: -1
  img_proc: true
- pgno: 119
  md: "# Question 6\n\nName the OpenBoot command to boot a system from the CD-ROM.\n\
    \nThe correct answer is **boot cdrom**.\n\n# Question 7\n\n+   Which of the following\
    \ is the last phase in the Solaris boot process?\n+   \n+   ○ a. init\n+   ○ b.\
    \ Boot PROM\n+   ○ c. BIOS\n+   ○ d. Kernel initialization\n+   ○ e. Boot programs\n\
    \nAnswer a is correct. The init phase is last in the Solaris boot process. All\
    \ the answers are phases of the SPARC or Intel x86 boot process. The Boot PROM\
    \ and BIOS phases test hardware, the Boot programs phase locates and loads boot\
    \ programs, and the Kernel initialization phase loads the kernel. Only then can\
    \ the init phase occur to initialize the operating system services. Therefore,\
    \ answers b, c, d, and e are incorrect.\n\n# Question 8\n\nGive the full pathname\
    \ of the file that determines whether the keyboard abort sequence is enabled or\
    \ disabled.\n\nThe correct answer is **/etc/default/kbd**.\n\n# Question 9\n\n\
