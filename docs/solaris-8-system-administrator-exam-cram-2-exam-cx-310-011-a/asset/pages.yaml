- pgno: 414
  md: 'This chapter describes the name services supported by the Solaris 8 operating
    system. The first part provides an overview. The second part covers the Network
    Information Service (NIS) in more detail. The third part summarizes the Network
    Information Service Plus (NIS+). This chapter covers the *Naming Services* and
    NIS test objectives.


    # # Solaris Name Services


    A *name service* or *naming service* provides a centralized location for information
    that users and systems use to communicate with each other across the network.
    The name service not only stores information, but also provides mechanisms to
    manage and access information.


    The information is referred to as a *namespace* and typically includes the following:


    +   - Hostnames and their IP addresses

    +   - User accounts and their passwords

    +   - Access permissions


    Without a centralized name service, each system would have to maintain its own
    copy of the information. For example, by default the Solaris 8 system uses the
    /etc/inet/hosts (/etc/hosts) file to resolve hostnames to IP addresses. This approach
    is fine for a few systems, but for many systems, it becomes a maintenance nightmare.
    A centralized name service eliminates redundancy, improves consistency, and reduces
    administration.


    # ## Supported Naming Services


    The Solaris 8 operating system supports five naming services:


    +   - The original Unix name service mechanism, referred to as */etc files*

    +   - The Domain Name System (DNS)

    +   - The Network Information Service (NIS)

    +   - The Network Information Service Plus (NIS+)

    +   - The Federated Naming Service (FNS), which conforms to the X/Open Federated
    Naming Specification (XFN)


    NIS and NIS+ are considered enterprise-level naming services. That is, they work
    adequately within an intranet environment, but are not scalable to the'
  merge: -1
  img_proc: true
- pgno: 415
  md: 'global level (Internet environment). To address this scaling issue, FNS can
    be used to *federate* or link NIS or NIS+ with a global-level naming service,
    such as X.500 via the Lightweight Directory Access Protocol (LDAP) or DNS. By
    linking these naming services, the information managed by the enterprise-level
    name service is accessible globally.


    Sun Microsystems does not fully embrace X.500/LDAP as a naming service or provide
    an LDAP server as part of the Solaris 8 distribution. However, it does provide
    an LDAP client and an LDAP data caching mechanism.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_415_0.png)


    Of these naming services, NIS and NIS+ are covered in the most detail on the exam.
    The /etc files and DNS are covered briefly. FNS will probably not be mentioned.
    However, be sure to understand the significance of enterprise-level (NIS and NIS+)
    versus global-level (DNS and LDAP) naming services.


    # Domain Name System (DNS)


    DNS, part of the TCP/IP protocol suite, is the name service the Internet uses.
    It provides hostname-to-IP address resolution as well as IP address-to-hostname
    resolution. The DNS namespace is divided into domains that in turn are divided
    into subdomains (or zones). One or more DNS servers can be responsible (authoritative)
    for a zone. All the DNS servers work together to provide name resolution services
    across the entire namespace. The DNS server provided with Solaris 8 is version
    8.1.2 of the Berkeley Internet Name Domain (BIND) program, referred to as the
    *Internet name daemon* (in.named).


    Information on the namespace is stored in text files using a predefined syntax
    known as *records*. The named program uses the following data files:


    +   - **/etc/named.conf**—The BIND configuration file that identifies zones over
    which the DNS server is authoritative and the associated data files

    +   - **/etc/resolv.conf**—When configured as a DNS client, a file that identifies
    the DNS server that should be used for name resolution

    +   - **named.ca**—The names and IP addresses of the Internet root DNS servers

    +   - **hosts**—The DNS address (A type) records used for resolving hostnames
    to IP addresses (not to be confused with the /etc/hosts file)

    +   - **hosts.rev**—The DNS pointer (PTR type) records used for resolving IP addresses
    to hostnames

    +   - **named.local**—The DNS records for the localhost or the loopback interface'
  merge: -1
  img_proc: true
- pgno: 416
  md: 'The named.ca, hosts, hosts.rev, and named.local files are typically located
    under the /var/named directory but can be in any directory specified by the /etc/named.conf
    file.


    # Network Information Service (NIS)


    NIS is a distributed name service. It is a mechanism for identifying and locating
    network objects and resources. It provides a uniform storage and retrieval method
    for networkwide information in a platform-independent manner. The data files (called
    *maps*) can be distributed among NIS servers to improve availability but can still
    be managed and updated from a central location. The “Network Information Service
    (NIS)” section later in this chapter provides additional details on NIS.


    # Network Information Service Plus (NIS+)


    NIS+ is similar to NIS but includes many more features. Unlike NIS, the NIS+ namespace
    is dynamic because updates can take effect at any time by any authorized user.


    The NIS+ namespace is hierarchical and similar to a Unix file system. This structure
    allows the namespace to conform to an organization’s hierarchy and can be divided
    into multiple domains for separate administration.


    NIS has weak security, but NIS+ includes a security system that uses both authentication
    and authorization to maintain the integrity of its namespace. *Authentication*
    is a method to restrict access to specific users when accessing a remote system.
    Authentication can be set up at both the system level and the network level. Credentials
    are used to verify the identity of a user. For NIS+, every request for access
    is authenticated by checking the credentials of the user. *Authorization* is a
    method to restrict the operations a user can perform on the remote system after
    he or she has gained access (been authenticated). For NIS+, every component in
    the namespace specifies the type of operations it will accept from each user.


    # The Name Service Switch


    Because Solaris 8 supports five different naming services, you need a method to
    select which name services should be used and in which order. This capability
    is provided by the *name service switch*, which consists of the /etc/nsswitch.conf
    file and five templates that can be used to simplify the setup of the nsswitch.conf
    file.'
  merge: -1
  img_proc: true
- pgno: 417
  md: 'Applications use standardized routines to obtain name resolution and other
    system and network information. These routines consult the `/etc/nsswitch.conf`
    file to determine which name services should be queried.


    The `/etc/nsswitch.conf` file contains entries for each type of data the name
    services support. An entry consists of a keyword identifying the type of information,
    followed by one or more information sources. The source keywords are separated
    from the information keyword and other source keywords by one or more space characters.
    Table 19.1 lists the 17 types of information keywords. In addition to the five
    name services Solaris supports, three additional name resolution methods are supported
    via the information source field of the name service switch. They are *compat*,
    which is used for passwords and group information; *ldap*, for using an external
    LDAP service; and *users*, which is used for printers. Table 19.2 lists the eight
    information source keywords.


    **Table 19.1 — The /etc/nsswitch.conf Information Keywords**


    | Information Keyword | Description |

    |---|---|

    | aliases | Mail aliases |

    | automount | Information on the Auto File System (AutoFS) configuration |

    | bootparams | Location of root, swap, and dump partitions for diskless workstations
    |

    | ethers | Ethernet addresses of systems |

    | group | Group name and member information |

    | hosts | Hostnames and network (IP version 4) addresses |

    | ipnodes | Hostnames and network (IP version 6) addresses |

    | netgroup | Network groups and members defined in the domain |

    | netmasks | Netmasks associated with known networks |

    | networks | Networks and their associated names |

    | passwd | Password information for user accounts |

    | printers | Printer alias database |

    | protocols | IP protocols used within the domain |

    | publickey | Public keys used for authentication |

    | rpc | Remote Procedure Call (RPC) program numbers for RPC services used within
    the domain |

    | sendmailvars | Variables used within the *sendmail*(1M) program |

    | services | Names of IP services and their port numbers |'
  merge: -1
  img_proc: true
- pgno: 418
  md: '| **Table 19.2  The /etc/nsswitch.conf Source Keywords** |  |

    |---|---|

    | **Source Keyword** | **Description** |

    | `compat` | Uses old-style syntax for password and group information |

    | `dns` | Uses DNS to resolve queries |

    | `files` | Uses /etc files to resolve queries |

    | `ldap` | Uses LDAP to resolve queries |

    | `nis` | Uses NIS to resolve queries |

    | `nisplus` | Uses NIS+ to resolve queries |

    | `users` | Valid only for printers |

    | `xfn` | Valid only for printers |


    When these name services (DNS, /etc files, LDAP, and NIS or NIS+) are queried
    or searched, they return one of four search status messages:


    +   - **SUCCESS**—The requested information was located.

    +   - **UNAVAIL**—The service is not responding.

    +   - **NOTFOUND**—The requested data does not exist.

    +   - **TRYAGAIN**—The service is busy; try again later.


    For each search status message, an action can be associated with each source.
    The action is either **return** (stop looking) or **continue** (try the next source).
    For example, the following example shows a hosts entry in the /etc/nsswitch.conf
    file:


    ```

    hosts:    nisplus dns files

    ```


    The default action for a SUCCESS status message is to return the information.
    The default action for the other status messages (NOTFOUND, TRYAGAIN, and UNAVAIL)
    is to continue to the next source if one exists or to return if one does not exist.


    When an application attempts to resolve a hostname to an IP address, first NIS+
    is searched. If the information is found, it is returned to the application. If
    it is not found, DNS is searched. If the information is found, it is returned
    to the application. If it is not found, the /etc files configuration (/etc/hosts
    file) is searched. If the information is found, it is returned to the application;
    otherwise, an error is returned.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_418_0.png)


    Note that the name service search order proceeds from left to right. That is,
    the search starts with the leftmost service and, if necessary, continues until
    the right-most service is queried.'
  merge: -1
  img_proc: true
- pgno: 419
  md: 'Five templates are included with the Solaris 8 distribution to simplify setting
    up the /etc/nsswitch.conf file. These templates provide a standardized setup for
    the most commonly used name services in the Solaris 8 environment:


    +   - DNS (/etc/nsswitch.dns)

    +   - LDAP (/etc/nsswitch.ldap)

    +   - NIS (/etc/nsswitch.nis)

    +   - NIS+ (/etc/nsswitch.nisplus)

    +   - Original Unix /etc files configuration (/etc/nsswitch.files)


    During system installation, the contents of one of these files is copied to the
    /etc/nsswitch.conf file based on the name service selected (if any). Listing 19.1
    shows the default contents of the /etc/nsswitch.nisplus file. To use this configuration,
    copy this file to the /etc/nsswitch.conf file. Comments are preceded by the pound
    (#) character. An action can be defined for a status message by using a `message=action`
    statement within square brackets ([]) after the source keyword.


    # Listing 19.1  The Contents of the /etc/nsswitch.nisplus File


    ```

    #

    # /etc/nsswitch.nisplus:

    #

    # An example file that could be copied over to /etc/nsswitch.conf; it

    # uses NIS+ (NIS version 3) in conjunction with files.

    #

    # "hosts:" and "services:" in this file are used only if the

    # /etc/netconfig file has a "-" for netmgt_libs of "inet" transports.

    #

    # the following two lines obviate the "+" entry in /etc/passwd

    # and /etc/group.

    passwd:     files nisplus

    group:       files nisplus


    # consult /etc "files" only if nisplus is down.

    hosts:       nisplus [NOTFOUND=return] files

    ipnodes:     files

    # Uncomment the following line, and comment out the above, to use both DNS

    # and NIS+. You must also set up the /etc/resolv.conf file for DNS name

    # server lookup. See resolv.conf(4).

    #hosts:      nisplus dns [NOTFOUND=return] files

    ```'
  merge: -1
  img_proc: true
- pgno: 420
  md: '```

    ```text

    Listing 19.1  The Contents of the /etc/nsswitch.nisplus File (continued)


    services:   nisplus [NOTFOUND=return] files

    networks:   nisplus [NOTFOUND=return] files

    protocols:  nisplus [NOTFOUND=return] files

    rpc:        nisplus [NOTFOUND=return] files

    ethers:     nisplus [NOTFOUND=return] files

    netmasks:   nisplus [NOTFOUND=return] files

    bootparams: nisplus [NOTFOUND=return] files


    publickey:


    netgroup:   nisplus


    automount:  files nisplus

    aliases:    files nisplus

    sendmailvars:   files nisplus


    printers:   user nisplus files xfn


    auth_attr:  files nisplus

    prof_attr:  files nisplus

    project:    files

    ```

    ```


    # # Network Information Service (NIS)


    NIS, like other network applications, follows the client/server architecture model.
    The following sections describe the NIS components, how to configure these components,
    and how to add and update NIS maps.


    # ## NIS Components


    NIS consists of a master server, possibly slave servers, and one or more clients.
    The servers store NIS maps and make the information contained in the maps available
    to clients on request.


    # ## NIS Maps


    NIS stores information in a set of files called *maps*, which are two-column tables.
    The first column is used as a key, and the second column is the information associated
    with that key. Because the maps are organized by key, the same information might
    appear in more than one map. For example, host and associated IP addresses appear
    in two maps: hosts.byname (the hostname is the key and the IP address is the information)
    and hosts.byaddr (the IP address is the key and the hostname is the information).
    Table 19.3 lists the NIS maps, which are physically located under the /var/yp
    directory along with several other NIS files.'
  merge: -1
  img_proc: true
- pgno: 421
  md: '| Keyword | Maps | Description |

    |---|---|---|

    | aliases | mail.aliases, mail.byaddr | Mail addresses and aliases |

    | bootparams | bootparams | Location of root, swap, and dump partitions for diskless
    workstations |

    | ethers | ethers.byaddr, ethers.byname | Ethernet addresses of systems |

    | group | group.bygid, group.byname | Group name, group ID (GID), and member information
    |

    | hosts | hosts.byaddr, hosts.byname | Hostnames and network (IPv4) addresses
    |

    | ipnodes | ipnodes.byaddr, ipnodes.byname | Hostnames and network (IPv6) addresses
    |

    | netgroup | netgroup, netgroup.byhost, netgroup.byuser | Network groups and members
    defined in the domain |

    | netmasks | netmasks.byaddr | Netmasks associated with known networks |

    | networks | networks.byaddr, networks.byname | Networks and their associated
    names |

    | passwd | netid.byname, passwd.adjunct.byname, passwd.byname, passwd.byuid |
    Password information for user accounts |

    | protocols | protocols.byname, protocols.bynumber | IP protocols used within
    the domain |

    | rpc | rpc.bynumber | RPC program numbers for RPC services used within the domain
    |

    | services | services.byname, services.byservice | IP services and their port
    numbers |


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_421_0.png)


    NIS was previously known as “Yellow Pages.” For this reason, many of the NIS files
    and commands contain the yp prefix.


    # NIS Master and Slave Servers


    Each NIS environment, or domain, must have only one NIS master server. The NIS
    maps reside on the master server. To provide load distribution and redundancy,
    one or more slave servers can be configured. Whenever the NIS maps are updated
    on the master server, they are propagated to the slave servers.'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# ## NIS Clients


    NIS clients request information contained in the maps from NIS servers. The clients
    do not make any distinction between the master server and slave servers.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_422_0.png)


    NIS servers can also be NIS clients, depending on the configuration of the `/etc/nsswitch.conf`
    file. Keep in mind that NIS servers also need to resolve hostnames, network addresses,
    and so on for their own use.


    # ## Configuring NIS Servers and Clients


    The procedures used to configure an NIS master server, slave server, and client
    are somewhat similar. The steps for each procedure are given in the following
    sections.


    Each system should be identified as a member of the domain. You do so by using
    the **domainname**(1M) command and specifying the domain name as an argument.
    For example, if a system will be part of the sun.com domain, you use the following
    command to set the domain:


    ```

    ```sh

    # domainname sun.com

    #

    ```

    ```


    An alternative approach is to enter the domain name in the `/etc/defaultdomain`
    file.


    # ## NIS Master Server


    Before you can configure an NIS master server, you must prepare the data used
    to build the maps. By default, the maps will be built from the /etc files. However,
    it is recommended that you copy the /etc files to another directory so that you
    can make any necessary changes to these source files without affecting the local
    system. Use the following procedure to prepare the data:


    +   1. Verify that the /etc files are up to date. These files are auto_home, auto_master,
    bootparams, ethers, group, hosts, netgroup, netmasks, networks, passwd, protocols,
    rpc, service, and shadow.

    +   2. Select a directory for building most of the maps (the DIR directory) and
    another directory for building the passwd map (the PWDIR directory).

    +   3. Copy all the files (except /etc/passwd) to the DIR directory, and copy
    the /etc/passwd file to the PWDIR directory.'
  merge: -1
  img_proc: true
- pgno: 423
  md: '+   4. Verify that the /etc/mail/aliases file is up to date, but do not copy
    it to the DIR directory.

    +   5. Remove comments and other unnecessary information from the copied source
    files. Verify that the file formats are correct.

    +   6. Modify the /var/yp/Makefile to identify the selected DIR and PWDIR directories.


    Use the following procedure to configure an NIS master server. As part of the
    procedure, the maps will be built automatically:


    +   1. To be sure that the system is using the /etc files configuration for the
    name service switch, copy the /etc/nsswitch.files file to the /etc/nsswitch.conf
    file.

    +   2. Add entries to /etc/hosts for each NIS slave server.

    +   3. If necessary, use the **domainname**(1M) command to set the domain name.

    +   4. Run the **ypinit**(1M) command to initialize the NIS master server and
    build the maps, as shown here.

    +   5. Provide the information in response to the prompts from the **ypinit**
    command. This information includes a list of NIS slave servers and whether the
    **ypinit** command should exit if an error is encountered.

    +   6. Enable NIS by copying the /etc/nsswitch.nis file to the /etc/nsswitch.conf
    file.


    ```

    ypinit -m

    ```


    To start the NIS master server, either reboot the system or run the **ypstart**(1M)
    command, as shown here:


    ```

    /usr/lib/netsvc/yp/ypstart

    ```


    # NIS Slave Server


    You can use the following procedure to configure a system as an NIS slave server:


    +   1. Configure the system as an NIS client. If necessary, use the **domainname**
    command to set the domain name.

    +   2. Update the /etc/nsswitch.conf file to use NIS by copying the /etc/nsswitch.nis
    template file to it or by manually editing the appropriate configuration.'
  merge: -1
  img_proc: true
- pgno: 424
  md: '+   3. Log in to the system as the root account and run the **ypinit** command,
    as shown here:


    ```

    ypinit -c

    ```


    +   4. The **ypinit** command will prompt for one or more NIS servers. Enter the
    hostnames of the closest NIS servers. This step completes the client setup.


    +   5. Add an entry for the NIS master server to the /etc/hosts file.


    +   6. If the **ypbind**(1M) command is running, stop it by using the following
    command:


    ```

    /usr/lib/netsvc/yp/ypstop

    ```


    +   7. Restart the **ypbind** command by using the following command:


    ```

    /usr/lib/netsvc/yp/ypstart

    ```


    +   8. Run the **ypinit** command from the /var/yp directory, as shown here (**master**
    is the hostname of the NIS master server):


    ```

    # cd /var/yp

    # ypinit -s master

    ```


    To start the NIS slave server, reboot the system or repeat steps 6 and 7.


    Only the maps generated on the master server are copied to the slave server. The
    original files used to generate the maps reside only on the master server.


    # NIS Client


    You can use the following procedure to configure a system as an NIS client:


    +   1. If necessary, use the **domainname** command to set the domain name.


    +   2. Update the /etc/nsswitch.conf file to use NIS by copying the /etc/nsswitch.nis.template
    file to it or by manually editing the appropriate configuration.


    +   3. Log in to the system as the root account and run the **ypinit** command,
    as shown here:


    ```

    ypinit -c

    ```


    +   4. The **ypinit** command will prompt for one or more NIS servers. Enter the
    hostnames of the closest NIS servers.'
  merge: -1
  img_proc: true
- pgno: 425
  md: '# Updating and Auditing NIS Maps


    Updating one of the default maps (one automatically generated when the master
    server is configured) is fairly straightforward. Edit the appropriate source file,
    and then execute the **make(1)** command from the /var/yp directory. The name
    of the map being updated must be specified as a command-line argument to the **make**
    command. The **make** command updates the map and automatically propagates the
    updated map to any slave servers. The following example shows the commands used
    to update the hosts map and propagate it to slave servers:


    ```

    ```sh

    # cd /var/yp

    # make hosts

    ```

    ```


    To add a new map (referred to as a *nondefault map*), create a text file in the
    /var/yp directory on the master server with the appropriate information. Then
    run the **makedbm(1M)** command to add the map. The **makedbm** command expects
    two command-line arguments: the name of the source file and the name of the map
    that should be created. The **ypxfr(1M)** command is used to distribute a new
    map that does not currently exist on the slave servers. The name of the new map
    is specified as a command-line argument. The following lines create the new map,
    apps, from the apps.txt source file:


    ```

    ```sh

    # cd /var/yp

    # makedbm apps.txt apps

    # /usr/lib/netsvc/yp/ypxfr apps

    ```

    ```


    To update and propagate a nondefault map, edit the source file, and then run the
    **makedbm** command to rebuild the map. To propagate the updated map, use the
    **yppush(1M)** command and specify the map name as a command-line argument. The
    following lines rebuild the apps map from the apps.txt source file and propagate
    it to the slave servers:


    ```

    ```sh

    # cd /var/yp

    # makedbm apps.txt apps

    # /usr/lib/netsvc/yp/yppush apps

    ```

    ```


    # Verifying the NIS Configuration


    Several commands provide access to NIS configuration information. You can use
    these commands to verify a client configuration and check the contents of the
    maps. Consult the *System Reference Manual* for additional details:


    +   - **ypcat(1)**—Lists the contents of the specified map.

    +   - **ypmatch(1)**—Returns data that matches the specified key from the specified
    map.'
  merge: -1
  img_proc: true
- pgno: 426
  md: '+   ypwhich(1)—Returns the name of the NIS server or map master. When used
    with the -m command-line argument, the ypwhich command returns a list of all available
    maps.


    # Network Information Service Plus (NIS+)


    NIS+ is similar to NIS but offers more features. In addition to providing centralized
    administration and access to domain data, it also supports a hierarchical domain
    namespace that can be configured to reflect an organization’s structure; NIS,
    however, provides only a flat domain. NIS provides no authentication, but NIS+
    provides Data Encryption Standard (DES)–based authentication. In addition, whereas
    NIS propagates updated information in a batch mode, NIS+ propagates incremental
    updates immediately. Like NIS, NIS+ supports the optional use of redundant servers
    (referred to as replicas). These replicas provide load balancing and alternative
    servers in case the master NIS+ server fails.


    NIS stores its data in files referred to as maps; NIS+ stores its data in files
    referred to as tables. NIS+ provides tables for all data stored in NIS maps, plus
    some additional tables for credential, time zone, and automount information. Table
    19.4 lists the NIS+ tables.


    The tables are stored under a directory by domain name. This directory contains
    three other directories: ctx_dir.domain, for XFN (FNS) data; org_dir.domain, to
    store the tables; and groups_dir.domain, for group information.


    **Table 19.4 NIS+ Tables**


    | Table | Description |

    |---|---|

    | auto_home | Location of users’ home directories |

    | auto_master | AutoFS map information |

    | bootparams | Location of root, swap, and dump partitions for diskless workstations
    |

    | cred | Credentials for NIS+ principals |

    | ethers | Ethernet addresses of systems |

    | group | Group name, GID, and member information |

    | hosts | Hostnames and network (IP) addresses |

    | mail_aliases | Mail addresses and aliases |'
  merge: -1
  img_proc: true
- pgno: 427
  md: '| Table 19.4 | NIS+ Tables (continued) |

    |---|---|

    | **Table** | **Description** |

    | netgroup | Network groups and members defined in the domain |

    | netmasks | Netmasks associated with known networks |

    | networks | Networks and their associated names |

    | passwd | Password information for user accounts |

    | protocols | IP protocols used within the domain |

    | rpc | RPC program numbers for RPC services used within the domain |

    | services | IP services and their port numbers |

    | timezone | Time zone of workstations in the domain |'
  merge: -1
  img_proc: true
- pgno: 428
  md: "# # Practice Questions\n\n# ## Question 1\n\n+   Which of the following naming\
    \ services requires the data to be configured manually on every system on which\
    \ it is used?\n+   \n+   - a. NIS\n+   - b. NIS+\n+   - c. DNS\n+   - d. /etc\
    \ files\n\nAnswer d is correct. NIS requires the data to be configured manually\
    \ on every system on which it is used. All the other naming services provide a\
    \ means to update one master database and propagate changes to every system that\
    \ needs them. Therefore, answers a, b, and c are incorrect. Although using /etc\
    \ files is simple and quick for a few systems, using NIS, NIS+, or DNS reduces\
    \ maintenance for many systems.\n\n# ## Question 2\n\n+   Enter the name of a\
    \ method to restrict access to NIS+ resources based on the user’s credentials.\n\
    \nThe correct answer is authentication.\n\n# ## Question 3\n\n+   Which of the\
    \ following are features provided by NIS+? (Select all that apply.)\n+   \n+ \
    \  - a. Authentication\n+   - b. Time zone support\n+   - c. Batch propagation\
    \ of updates\n+   - d. Hierarchical domain architecture\n+   - e. Flat domain\
    \ architecture\n\nAnswers a, b, and d are correct. NIS+ provides authentication,\
    \ time zone support, and a hierarchical domain architecture. Batch propagation\
    \ of updates and flat domain architecture are characteristics of NIS. Therefore,\
    \ answers c and e are incorrect."
  merge: -1
  img_proc: true
- pgno: 429
  md: '# Question 4


    Which of the following name services are supported by the Solaris 8 operating
    system? (Select all that apply.)


    +   - [ ] a. NIS

    +   - [ ] b. NIS+

    +   - [ ] c. FNS

    +   - [ ] d. DNS

    +   - [ ] e. /etc files configuration


    Answers a, b, c, d, and e are correct. The Solaris 8 operating system supports
    NIS, NIS+, FNS, DNS, and /etc files configuration.


    # Question 5


    Which of the following commands is used to configure an NIS client?


    +   - ( ) a. `ypinit -m`

    +   - ( ) b. `ypinit -c`

    +   - ( ) c. `ypinit -s`

    +   - ( ) d. `nisclient`

    +   - ( ) e. `nisinit -c`


    Answer b is correct. The `ypinit -c` command is used to configure an NIS client.
    `ypinit -m` is used to configure a master server. Therefore, answer a is incorrect.
    `ypinit -s` is used to configure a slave server. Therefore, answer c is incorrect.
    The commands in answers d and e do not exist.


    # Question 6


    Which of the following is *not* a valid type of search status message?


    +   - ( ) a. SUCCESS

    +   - ( ) b. NOTFOUND

    +   - ( ) c. TRYLATER

    +   - ( ) d. UNAVAIL


    Answer c is correct. TRYLATER does not exist; the correct keyword is TRYAGAIN.
    SUCCESS, NOTFOUND, and UNAVAIL are valid search status messages. Therefore, answers
    a, b, and d are incorrect.'
