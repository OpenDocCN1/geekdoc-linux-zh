- pgno: 296
  md: '# ## Question 1


    The correct answer is _/etc/group_.


    # ## Question 2


    Answers a, b, and d are correct. The **ufsdump** command can back up files and
    directories from a UFS file system or the entire file system. The volume table
    of contents is part of the disk layout and does not physically reside within a
    file system. Therefore, answer c is incorrect.


    # ## Question 3


    Answers a-4, b-1, c-3, and d-2 are correct. This question is meant to be misleading.
    **Select** is used to select a partition table. **Print** displays the current
    partition table. Answers 2 and 3 were vaguely worded—keep in mind that **label**
    writes a partition table and **label** to disk, whereas **name** only assigns
    a label or name to a partition table.


    # ## Question 4


    The correct answer is _hard_. The other type of link, soft or symbolic, references
    by name and can be used to point to a file on another file system.


    # ## Question 5


    Answer b is correct. The **cfgadm** command is used to manage the dynamic configuration
    of hot-pluggable devices. **hpadmin** and **attach** are not valid commands. Therefore,
    answers a and c are incorrect.


    # ## Question 6


    The correct answer is **pkill**.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Question 7


    Answers a-3, b-5, c-2, d-1, and e-4 are correct. Root (/) is used for required
    system files such as kernel and device drivers, /usr is used for user-accessible
    system commands and programs, /home is usually used for user home directories,
    /var is used for logs and spool areas, and /opt is used for optional applications.


    # Question 8


    Answers a, b, and c are correct. **nosuid**, **atime**, and **nolargefiles** are
    all **-o** command-line arguments. **-o nosuid** disables setuid permissions on
    any files (**-o suid** allows it). **-o atime** allows access times on files to
    be updated (**-o noatime** prevents it). **-o nolargefiles** causes the mount
    command to fail if any files on the file system are 2GB or larger (**-o largefiles**
    allow large files). **nmonntab** does not exist. Therefore, answer d is incorrect.
    To prevent a mounted file from being added to the /etc/mnttab file, use the **-m**
    command-line argument.


    # Question 9


    The correct answer is the question mark (?).


    # Question 10


    Answer b is correct. The **zip** command can be used to compress files and directories.
    **compress** and **gzip** can compress only files, not directories. Therefore,
    answers a and c are incorrect. **shrink** does not exist. Therefore, answer d
    is incorrect.


    # Question 11


    Answer a is correct. The **eject cdrom** command can be used to unmount a CD-ROM
    and eject it from the CD-ROM drive. Answers b, c, d, and e all use incorrect command-line
    arguments.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Question 12


    Answers a-3, b-4, c-1, and d-2 are correct. Both h and **<left arrow>** move the
    cursor to the left. j and **<down arrow>** both move the cursor down. k and **<up
    arrow>** both move the cursor up. l and **<right arrow>** both move the cursor
    to the right.


    # Question 13


    Answer b is correct. The file b2 matches the metacharacter expression **[abc][123]**.
    The metacharacter expression matches only a two-character file-name. The first
    character must be *a*, *b*, or *c*, and the second character must be *1*, *2*,
    or *3*. Answers a, c, d, and e consist of three or more characters; therefore,
    they are incorrect.


    # Question 14


    Answer b is correct. The PID of the process must be specified when you use the
    **kill** command to terminate a process. The system uses the PID to identify a
    specific process. The signal to send to the process is not required because the
    SIGTERM signal is used by default if a signal is not specified. Therefore, answer
    a is incorrect. The UID and name could refer to more than one process; something
    more unique is required to identify a particular process. Therefore, answers c
    and d are incorrect.


    # Question 15


    Answers a, b, c, and d are correct. Because a file system type is not specified
    with mkfs, the default file system type as specified in the /etc/defaults/fs file,
    which is UFS, is assumed. All the other commands specify file system type UFS
    or are intended for UFS file systems.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Question 16


    Answers b and d are correct. Because the **-m** command-line argument was not
    used, all mounted file systems were listed in the /etc/mnttab file. The **mount**
    command without command-line arguments displays all file system listed in the
    /etc/vfstab file. Answer a is a description of the **mountall** command, not the
    **mount** command. The **mountall** command mounts all file systems in /etc/vfstab.
    Therefore, answer a is incorrect. The **mount** command displays the contents
    of the /etc/mnttab, not the /etc/vfstab file. Therefore, answer c is incorrect.


    # Question 17


    Answer b is correct. The path is /dev/dsk instead of /dev/rdsk, which identifies
    a raw device. Therefore, answer a is incorrect. Physical device names are located
    under the /devices directory, not the /dev directory. Therefore, answers c and
    d are incorrect.


    # Question 18


    Answer d is correct. The question mark (?) can be used to enter vi Last Line mode.
    The %, $, and # characters are not used to change vi modes. Therefore, answers
    a, b, and c are incorrect.


    # Question 19


    Answers a-3, b-4, c-1, and d-2 are correct. PCFS is used for floppy (MS-DOS) disks,
    UFS is used for disk drives; UDF is used for DVDs, and HSFS is used for CD-ROMs.


    # Question 20


    Answers a, b, c, and f are correct. The **format**, **newfs**, **fsck**, and **prtvtoc**
    commands either display or can use logical raw device names. The **mount** and
