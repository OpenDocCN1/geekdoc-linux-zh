  md: '| Feature | sh | csh | ksh | Function |

    |---|---|---|---|---|

    | **History execution** | No | `!n` | `fc` | Repeats the previous command with
    few keystrokes. For csh, *n* is the number of the command in the history list.
    |

    | **Initialization file: login** | `.profile` | `.login` | `.profile` | Stores
    commands that should be executed once, when a user logs in to the system. |

    | **Initialization file: shell startup** | No | `.cshrc` | User defined | Stores
    commands that are executed every time the user starts a shell to execute a command.
    With the Korn shell, the user can specify the name of the shell start-up initialization
    file by using the **ENV** parameter. |

    | **Inline editing** | No | No | Yes | Enables you to edit a command that has
    been entered but not yet executed, so you can correct typo-graphical errors rather
    than retype the entire command. Either **emacs** or **vi** editing commands can
    be used when you''re correcting errors. |

    | **Logout file** | No | `.logout` | No | Stores commands that should be executed
    when a user logs out. |

    | **Overwrite protect** | No | Yes | Yes | Prevents files from being accidentally
    overwritten; can be set by using the **noclobber** parameter. |

    | **Repeat last command** | No | `!!` | No | Handy shortcut for reexecuting the
    last command with only a few keystrokes. |'
