- pgno: 344
  md: 'This chapter covers the *Disk Management* test objectives. The first section
    of this chapter reviews basic disk management commands. The second section introduces
    and describes features of virtual file systems and defines some of the basic terminology.


    The last two sections briefly describe the features and capabilities of two disk
    management software products that are available for the Solaris 8 operating system:
    Solstice DiskSuite and Sun StorEdge Volume Manager.


    # Basic Disk Management


    This section provides a brief review of the basic disk management commands provided
    with the Solaris 8 operating system. These commands are covered in more detail
    in Chapter 9, “File System Administration.”


    > NOTE: Reviewing Chapter 9 should be considered part of your preparation for
    the Part II exam.


    Before you create a file system on a disk, the disk must be formatted by using
    the **format** command. Next, you must define the volume table of contents (VTOC)
    using the **fmthard** or **format** command. The VTOC includes the partition table
    that determines the number and size of partitions or disk slices. The **prtvtoc**
    command can be used to display the VTOC. For x86 platforms, the **fdisk** command
    is used to create or modify the partition table.


    You can use the **mkfs** or **newfs** command to create a Unix File System (UFS)
    on the partition. The file system must fit within a partition, and only one file
    system can reside within a partition.


    The **fsck** command checks and repairs file systems. Typically, a file system
    should be checked before it is made available for use.


    You can use the **mount** or **mountall** command to mount the file system and
    make it available for use.


    # Virtual File Systems


    Virtual disk management systems let you use physical disks in different ways that
    are not supported by the standard Solaris file systems. The following sections
    summarize these advantages and describe several techniques to provide virtual
    file systems.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# # Advantages of Virtual Disk Management Systems


    A virtual disk management system can overcome disk capacity and architecture limitations
    and improve performance and reliability. In addition, manageability is enhanced
    by the use of a graphical management tool.


    # ## Overcoming Disk Limitations


    Virtual disk management systems allow partitions on multiple disks to be combined
    and treated as a single partition. Not only can file systems be larger than the
    largest available physical disks, but also the entire storage area available on
    a physical disk can be used.


    # ## Improved Performance


    Typically, using multiple disks in place of a single disk increases performance
    by spreading the load across several physical disks.


    # ## Improved Reliability


    Virtual disk management systems typically support data-redundancy or high-availability
    features, such as mirroring and redundant array of independent disks (RAID) configurations.
    In addition, features such as hot sparing and file system logging reduce recovery
    time.


    # ## Enhanced Manageability


    Virtual disk management systems typically provide a simple graphical user interface
    (GUI) for disk management and administration. This interface allows simple, almost
    error-free administration of complex disk configurations and file systems.


    The GUI usually includes a visual representation of the physical disks and virtual
    disk file systems. In addition, it typically supports drag-and-drop capabilities
    for quick configuration changes.


    # # Concatenated Virtual Devices


    Unlike the standard Solaris file system, which consists of a single partition
    (slice), a *concatenated virtual file system* consists of two or more slices.
    The slices can be on the same physical disk or on several physical disks. The
    slices also can be different sizes.


    “Concatenation” implies that the slices are addressed sequentially. That is, as
    space is needed, it is allocated from the first slice in the concatenation. After'
  merge: -1
  img_proc: true
- pgno: 346
  md: "this space is completely used, space is allocated from the second slice, and\
    \ so on.\n\nThe main advantage of a concatenated virtual device is that it provides\
    \ a means for using slices that might otherwise be too small for use. In addition,\
    \ concatenation using more than one physical disk provides some load balancing\
    \ between the disks and can result in head-movement optimization.\n\nHowever,\
    \ using multiple disks increases the chance that a failure of any one disk will\
    \ result in the failure of the entire virtual device, which could hold gigabytes\
    \ or even terabytes of data.\n\n# Striped Virtual Devices\n\nA *striped virtual\
    \ device*, like a concatenated virtual device, can consist of two or more slices.\
    \ The slices can be on the same physical disk or on several physical disks. The\
    \ slices can also be different sizes.\n\nUnlike a concatenated device, the slices\
    \ are addressed in an interleaved manner. That is, as space is needed, it is allocated\
    \ as a block from the first slice, then a block from the second slice, and so\
    \ on.\n\nThe main advantage of a striped device is that when the slices are on\
    \ several physical disks, it increases performance because it allows multiple\
    \ simultaneous reads and writes. This concurrent activity is possible because\
    \ each physical disk in the striped virtual device can be accessed at the same\
    \ time. In addition, like concatenated virtual devices, a striped device provides\
    \ a means for using slices that might otherwise be too small for use.\n\nAs with\
    \ concatenated virtual devices, multiple disks increase the chance that a failure\
    \ of any one disk will result in the failure of the virtual device.\n\n> **NOTE**\
    \  \n> A concatenated striped virtual device is a striped virtual device that\
    \ has been expanded by concatenating additional slices to the end of the device.\n\
    \n# Mirroring and Duplexing\n\n*Mirroring* is the technique of copying data being\
    \ written to an online device to another, offline device. This technique provides\
    \ a real-time backup of data that can be brought online to replace the original\
    \ device in the event the original device fails. Typically, the two disks share\
    \ the same controller. However, if the controller fails, neither disk can be accessed."
  merge: -1
  img_proc: true
- pgno: 347
  md: 'Duplexing is similar to mirroring, except that each disk has its own controller.
    This approach provides a little more redundancy and allows data to be accessed
    if either a single disk or a single controller fails.


    # RAID Configurations


    One approach to improving data availability is to arrange disks in various configurations
    known as RAID. Table 15.1 lists the levels of RAID.


    **Table 15.1 — RAID Levels**


    | Level | Description |

    |---|---|

    | 0 | Striping or concatenation |

    | 1 | Mirroring and duplexing |

    | 2 | Hamming Error Code Correction (ECC), used to detect and correct errors |

    | 3 | Bit-interleaved striping with parity information (separate disk for parity)
    |

    | 4 | Block-interleaved striping with parity information (separate disk for parity)
    |

    | 5 | Block-interleaved striping with distributed parity information |

    | 6 | Block-interleaved striping with two independent distributed parity schemes
    |

    | 7 | Block-interleaved striping with asynchronous I/O transfers and distributed
    parity information |

    | 10 | Mirrored striping or striped mirroring (combination of RAID 0 and RAID
    1) |

    | 53 | Similar to RAID 5, except data is taken from RAID 3 disks (the data on
    a set of RAID 3 disks is copied to another set of disks by using the RAID 5 methodology)
    |


    Virtual disk management systems implement one or more of these RAID levels but
    typically not all of them. The commonly supported RAID levels are 0, 1, and 5.


    # UFS File System Logging


    With UFS file system logging, updates to a UFS file system are recorded in a log
    before they are applied. In the case of system failure, the system can be restarted,
    and the consistency of UFS file systems quickly restored by using the log instead
    of the fsck command.


    The fsck command is a time-consuming and not always 100% accurate method of recovering
    a file system. It reads and verifies the information defining the file system.
    If the system crashed during an update, the update might have been only partially
    completed. The fsck command must correct the information by removing these partial
    updates.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'With UFS file system logging, only logged updates are applied to the file system.
    If the system crashes, the log has a record of what should be complete; this log
    can be used to quickly make the file system consistent.


    # Solstice DiskSuite


    Solstice DiskSuite is a software product that can be used to increase storage
    capacity and data availability and, in some cases, to increase performance. DiskSuite
    uses virtual disks, called *metadevices*, to manage the physical disks. A metadevice
    is a collection of one or more physical disk slices or partitions. You can use
    the basic disk-management commands, except the **format** command, with metadevices.
    In general, metadevices can be thought of as slices or partitions.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_348_0.png)


    Like the standard Solaris file systems that are accessible by using raw (/dev/rdsk)
    and block (/dev/dsk) logical device names, virtual file systems under DiskSuite
    are accessed by using the raw or block device name under /dev/md/rdsk or /dev/md/dsk.
    The metadevices (that is, partition names) begin with the letter **d** followed
    by a number. For example, /dev/md/dsk/d0 is block metadevice *d0*.


    Because you can build a metadevice that includes slices from more than one physical
    disk, it can be used to create a file system larger than the largest available
    physical disk. For SPARC platforms, metadevices can include small computer system
    interface (SCSI) and SPARCStorage Array drives. For x86 platforms, metadevices
    can include SCSI and IDE devices. In addition, slices that are too small to be
    of any use can be combined to create usable storage.


    DiskSuite supports four types of metadevices, listed in Table 15.2.


    | Metadevice | Description |

    |---|---|

    | Simple | Used directly or as a building block for mirror and trans metadevices
    (used for transactional logging). (The three types of simple metadevices are stripes,
    concatenations, and concatenated stripes.) |

    | Mirror | Used to replicate data between simple metadevices to provide redundancy.
    |

    | RAID 5 | Used to replicate data with parity, allowing data regeneration. |

    | Trans | Used for UFS file system logging. |


    DiskSuite enables you to expand metadevices dynamically by adding more slices.
    Then a UFS file system on that metadevice can be expanded.'
  merge: -1
  img_proc: true
- pgno: 349
  md: "# # Hot Spare Pools\n\nA hot spare pool is a collection of slices that are\
    \ substituted automatically for slices that fail. When a disk error occurs, DiskSuite\
    \ locates a hot spare (slice) in the hot spare pool that is at least the size\
    \ of the failing slice and allocates the hot spare as a replacement for the failing\
    \ slice. Assuming a mirrored or RAID level 5 configuration, the data from the\
    \ failed slice is copied to its replacement from the mirrored data or rebuilt\
    \ by using parity information.\n\n# # Administration\n\nTwo methods are available\
    \ to manage DiskSuite objects. The first is the DiskSuite Tool, which provides\
    \ a GUI. The second is a set of commands referred to collectively as the DiskSuite\
    \ command-line interface.\n\n# ## DiskSuite Tool\n\nThe DiskSuite Tool, also known\
    \ as the metatool command, is used to set up and administer a DiskSuite configuration.\
    \ It provides a graphical view of DiskSuite objects and the underlying physical\
    \ disks. You can modify the DiskSuite configuration quickly by using drag-and-drop\
    \ manipulation. However, the DiskSuite Tool does not support all DiskSuite operations.\
    \ These operations must be performed by using the command-line interface.\n\n\
    # ## DiskSuite Command-Line Interface\n\nThe command-line interface provides a\
    \ set of commands to create and manage DiskSuite objects. Most of these commands\
    \ start with the prefix *meta*, such as the *metainit* command used to initialize\
    \ a metadevice. See the DiskSuite manuals for more information.\n\n# # Sun StorEdge\
    \ Volume Manager\n\nSun StorEdge Volume Manager is a software product that, like\
    \ DiskSuite, can be used to increase storage capacity and data availability. Unlike\
    \ DiskSuite, Volume Manager includes performance analysis tools and dynamic online\
    \ tuning to achieve optimal use of storage.\n\n> > **NOTE**  \n> > Sun StorEdge\
    \ Volume Manager is also known as the Solaris Enterprise Volume Manager and the\
    \ Veritas Volume Manager. Sun Microsystems has been reselling the Veritas product\
    \ under its own brand name since 1997. The Volume Manager supports the virtual\
    \ file system referred to as the Veritas File System (VxFS)."
  merge: -1
  img_proc: true
- pgno: 350
  md: '![](img/b957f979417d9f16274c2eb52c8f2c9f_350_0.png)


    Like the standard Solaris file systems that are accessible by using raw (`/dev/rdsk`)
    and block (`/dev/dsk`) logical device names, virtual file systems under the Volume
    Manager are accessed by using the raw or block device name under `/dev/vx/rdsk`
    or `/dev/vx/dsk`. Typically, disk groups and volumes are specified under these
    paths, such as `/dev/vx/dsk/salesdg/salesvol` for the storage space used by a
    sales organization. Names such as `c0t0d0s3` and `disk01` are also used to identify
    devices under the `/dev/vx` directory structure.


    StorEdge Volume Manager uses a *VM disk* to manage storage. A VM disk is a physical
    disk partition that has been assigned to the Volume Manager. Each VM disk consists
    of a public region from which storage is allocated and a private region that stores
    configuration information. A *disk group* is a collection of VM disks that share
    a common configuration. Initially, a default disk group is used; however, additional
    groups can be defined for better management.


    The public region of a VM disk is subdivided into *subdisks*; the subdisk is the
    basic unit the Volume Manager uses to allocate storage. A *plex* collection of
    subdisks can be organized to support the following approaches to data availability:


    +   - Concatenated virtual device

    +   - RAID level 0 (striping)

    +   - RAID level 1 (mirroring)

    +   - RAID level 5 (block-interleaved striping with distributed parity information)

    +   - RAID 10 (RAID 1 + RAID 0)


    A *volume* is a virtual disk device composed of up to 32 plexes. The volume is
    the virtual object that the operating system and applications view and manipulate.


    # Hot Relocation


    When a subdisk fails, Volume Manager automatically reacts by reconstructing the
    failed Volume Manager objects on a spare disk or free space within a disk group
    and then substituting the rebuilt subdisk for the failed subdisk.


    # Administration


    Volume Manager provides three methods to manage disk groups: a GUI (Visual Administrator),
    a set of command-line utilities, and the **vxdiskadm** menu-oriented interface.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Visual Administrator


    Visual Administrator, also known as the **vxva** command, is used to set up and
    administer a Volume Manager configuration. It provides a graphical view of Volume
    Manager objects and the underlying physical disks. You can modify the Volume Manager
    configuration quickly by using drag-and-drop manipulation.


    Visual Administrator enables you to display statistics about performance and activity
    levels of Volume Manager objects either graphically with colored icons or numerically
    with pop-up forms. Statistics that can be monitored include reads and writes,
    block reads and writes, total I/O, and average read and write times.


    # Command-Line Utilities


    The command-line utilities provide a set of commands to create and manage Volume
    Manager objects. Most of these commands start with the prefix **vx**, such as
    the **vxsdiskadd** command used to add a physical disk to the Volume Manager configuration.
    See the Volume Manager manuals for more information.


    # The vx diskadm Menu Interface


    The **vx diskadm** command provides a menu-driven interface to the command-line
    utilities. It eliminates the need to be familiar with the **vx** commands and
    their command-line arguments.'
  merge: -1
  img_proc: true
