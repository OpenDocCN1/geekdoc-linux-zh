    # # The devfsadm and devfsadmd Commands


    The **devfsadm**(1M) command and its daemon version **devfsadmd**(1M) are used
    to maintain the /dev/ and /devices directories. As device drivers are loaded into
    the kernel, the **devfsadm** program creates the appropriate /devices special
    files and /dev links to provide access to devices. The **devfsadmd** program is
    started during the later stages of the system boot and handles any /devices and
    /dev modifications required to support reconfigurations and hot-plugging (dynamic
    reconfiguration) activities. **devfsadm** also maintains the path_to_inst file.
    The **devfsadm** command can be used to manually manage the /dev and /devices
    files as required.


    # # Determining Disk Device Names


    You can use several commands to identify disk device names. They include the following:


    +   - **df**(1M)

    +   - **dmesg**(1M)

    +   - **format**(1M)

    +   - **mount**(1M)

    +   - **prtconf**(1M)

    +   - **sysdef**(1M)


    See the appropriate *System Reference Manual* page of each command for more details.


    # ## The df Command


    The df command lists free blocks (available storage space) and files (number of
    additional files that can be created) on a file system basis. The file systems
    are identified by using logical block disk device names, as shown in the following
    example:


    ```

    ```text

    # df

    /                 (/dev/dsk/c0d0s0  ): 28658862 blocks 1862425 files

    /boot             (/dev/dsk/c0d0p0:boot): 17722 blocks       1 files

    /proc             (/proc             ):        0 blocks    1868 files

    /dev/fd           (fd                ):        0 blocks       0 files

    /etc/mnttab       (mnttab            ):        0 blocks       0 files

    /var/run          (swap              ):  1135576 blocks   21076 files

    ```

    ```'
