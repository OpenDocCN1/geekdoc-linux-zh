- pgno: 196
  md: 'The first part of this chapter describes the three naming conventions used
    to identify system devices. It then focuses on the device names associated with
    disks and the commands used to display these names. The second part of the chapter
    provides a brief introduction to hot-plugging devices and their management. The
    third part defines the logical structure of a disk, referred to as a *partition*,
    and describes how to create and display partition-related data. The last section
    describes the use of the **format** command. This chapter covers the *Disk Configuration*
    and *Format* test objectives.


    # ## Disk Device Names


    Disks, like other devices of the Solaris 8 operating system, can be referenced
    with three naming conventions:


    +   - Physical device name

    +   - Logical device name

    +   - Instance name


    # ## Physical Device Names


    When the system is booted, the kernel builds a device hierarchy, referred to as
    the *device tree*, to represent the devices attached to the system. This tree
    is a hierarchy of interconnected buses; the devices attached to the buses are
    nodes. The root node is the main physical address bus.


    Each device node can have attributes, such as properties, methods, and data. In
    addition, each node typically has a parent node and might have children nodes.
    A node with children is typically another bus, whereas a node without children
    is a device attached to a bus.


    The *full device pathname* identifies a device in terms of its location in the
    device tree by listing a series of *node names* separated by slashes; the root
    is indicated by a leading slash. Each node name in the full device pathname has
    the following form:


    ```

    driver-name@unit-address:device arguments

    ```


    **driver-name** identifies the device name, **@unit-address** is the physical
    address of the device in the address space of the parent, and **:device arguments**
    defines additional information about the device software. For example, the following
    full device address represents a slice (or partition) of a small computer system
    interface (SCSI) disk drive on a SPARC system:


    ```

    /sbus@1f,0/esp@0,4000/sd@3,0:a

    ```'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'This address identifies a device attached to the sbus with a main system bus
    address of 1f,0; an esp device (SCSI bus) attached at SBus slot 0, offset 4000;
    and an sd device (SCSI disk) with a SCSI bus target of 3, a logical unit of 0,
    and an argument of a, which represents slice a of the disk.


    Devices can also be referenced by using *physical device names*, which are located
    under the /devices directory. Although these physical names define the exact location
    of devices within the system, they are long and difficult to remember and use.


    # Logical Device Names


    *Logical device names* are easier to use. They identify disk, tape, and CD-ROM
    devices and provide *raw (character) access* (one character at a time) or *block
    access* (via a buffer for accessing large blocks of data).


    The logical name of a SCSI disk device on a SPARC system identifies the SCSI controller
    (bus), SCSI target (location on the bus), drive (almost always 0), and slice (partition),
    as in the following logical device name:


    ```

    /dev/dsk/c0t3d0s0

    ```


    All logical device names reside under the /dev directory, and the disk subdirectory
    identifies the device as a block disk device. (The rdsk subdirectory indicates
    a raw disk device.) This block disk device is addressed as SCSI controller 0,
    SCSI bus target 3, drive 0, and slice (partition) 0. Note the similarities (and
    differences) between this logical device name and its physical device name, as
    described in the previous section. Devices that have direct controllers as opposed
    to bus-oriented controllers (such as IDE drives) do not include the t# (bus target)
    portion of the logical device name.


    Some commands, such as the **format(1M)** command used to format a disk, the **newfs(1M)**
    command used to create a file system, and the **fsck(1M)** command used to check
    a file system, expect raw (character) device names (/dev/rdsk). Other commands,
    such as the **mount(1M)** command used to make a file system available for use
    and the **df(1M)** command used to display free file system space, expect block
    device names (/dev/dsk). A few commands, such as **prvtoc(1M)**, accept either
    raw or block logical device names.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_197_0.png)


    Of the three types of disk device names used in the Solaris environment, logical
    device names are used most frequently.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# # Instance Names


    Instance names are abbreviated names that are mapped to or associated with the
    physical device names of devices. These names make it possible to quickly and
    easily identify devices without requiring the use of long and typically complicated
    physical device names. An instance name typically consists of a short driver binding
    name, such as sd, and an instance number. For example, sd0 could be the instance
    name of the first SCSI disk, or fd0 could be the instance name of the first floppy
    disk drive.


    You map physical device names (also known as full device pathnames) with instance
    names using the /etc/path_to_inst file. This file is rebuilt automatically when
    you reconfigure the system by using the **touch /reconfigure** command or the
    **boot -r** command. The format of the /etc/path_to_inst file consists of three
    fields separated by tab characters. The fields are described in Table 8.1.


    | Field | Description |

    |---|---|

    | Physical Name | Full physical device name or full path device name |

    | Instance Number | The unique number (typically starting with 0) |

    | Driver Binding Name | Name assigned to the device driver |


    The following example shows the /etc/path_to_inst file for an x86 Solaris 8 operating
    system. The tab between each field has been replaced with an appropriate number
    of spaces to improve readability:


    ```

    ```text

    "/pci@0,0"                                      0   "pci"

    "/pci@0,0/pci-ide@0,1"                            0   "pci-ide"

    "/pci@0,0/pci-ide@0,1/ide@1"                      1   "ata"

    "/pci@0,0/pci-ide@0,1/ide@1/sd@0,0"               0   "sd"

    "/pci@0,0/pci-ide@0,1/ide@1/st@0,1"               0   "st"

    "/pci@0,0/pci-ide@0,1/ide@0"                      0   "ata"

    "/pci@0,0/pci-ide@0,1/ide@0/cmdk@0,0"             1   "cmdk"

    "/pci@0,0/pci-ide@0,1/ide@0/cmdk@0,0,0"           0   "cmdk"

    "/pci@0,0/pci@10,3"                                0   "pci"

    "/pci@0,0/pci@10,3,1/02/display@0"                1   "vgatext"

    "/pci@0,0/display@0"                               0   "vgatext"

    "/isa"                                             0   "isa"

    "/isa/pnp1,0"                                      0   "lp"

    "/isa/i8042@1,60"                                  0   "i8042"

