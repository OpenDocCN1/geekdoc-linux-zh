- pgno: 330
  md: 'The first part of this chapter covers the Solaris 8 syslog facility. This mechanism
    provides the ability to log user and system messages in one or more files on the
    local or a remote system. This chapter covers the Solaris Syslog test objectives.


    The second part of this chapter describes three commands (**who, whodo, and last**)
    for auditing usage of the login accounts.


    # ## The syslog Facility


    The **syslogd**(1M) daemon accepts messages sent to it from system (kernel and
    device drivers) and user programs and handles them based on the entries in the
    /etc/syslog.conf file. These messages can report anything from emergency situations
    to debugging details. Common uses include monitoring logins and recording hacking
    attempts. Typically, the **syslogd** command writes these messages to the specified
    log file, but other processing options are supported. A syslog message is categorized
    by its source, a _source facility_, and a priority, or _severity level_.


    # ## Source Facilities


    To better control the handling of log messages, the facilities generating the
    messages can be used to determine where the messages are sent or stored. Therefore,
    you can maintain separate log files for different types of messages based on the
    source. Table 14.1 lists the keywords used in the /etc/syslog.conf file to identify
    the source of messages and control handling.


    | Keyword | Description |

    |---|---|

    | auth | Login authentication |

    | cron | The at(1) and cron(1M) commands |

    | daemon | System daemons |

    | kern | The kernel |

    | lpr | The line printer spooling system |

    | local0 through local7 | As defined locally |

    | mail | System mail |

    | mark | Timestamp produced by syslogd(1M) |

    | news | The Usenet network news system |

    | user | User programs |'
  merge: -1
  img_proc: true
- pgno: 331
  md: '| Keyword | Description |

    |---|---|

    | uucp | The Unix-to-Unix Copy (UUCP) system |

    | * | All facilities except mark |


    The user facility (the default) is used if the source does not specify a facility
    keyword in the syslog message.


    # Priority (Severity) Levels


    Along with the source facility, a syslog message can be identified by priority
    or severity. This identification provides a second mechanism (with finer granularity)
    for handling messages based on importance. Table 14.2 lists the keywords used
    in the /etc/syslog.conf file to identify the severity of messages and control
    handling. These keywords are ordered on the basis of severity (from most severe
    to least severe).


    | Keyword | Description |

    |---|---|

    | emerg | Panic conditions |

    | alert | Conditions that need immediate attention |

    | crit | Critical conditions |

    | err | Other errors |

    | warning | Warning messages |

    | notice | Conditions that might require special handling |

    | info | Non-urgent information |

    | debug | Typically generated by debug messages in programs |

    | none | Special keyword used to prevent logging of messages generated by specified
    sources |


    # Customizing System Message Handling


    To control the handling of syslog messages, you add entries to the /etc/syslog.conf
    file. These entries take the form of one or more facility/severity keyword combinations
    followed by a tab character and an action. The facility and severity identify
    a particular source facility and message severity, whereas the action determines
    how the messages are handled. You can optionally define facility/keywords and/or
    actions by using an m4(1) macro to determine whether the current system is configured
    as a syslog host.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Facility/Severity Keywords Combinations


    The facility and severity keywords are separated by a period (.) and identify
    a particular source facility and severity of messages. For example, **kern.emerg**
    identifies emergency error messages from the kernel.


    Three special cases exist:


    +   - A facility keyword is specified without being followed by a period and a
    severity keyword. This keyword is used to identify all levels of severity. For
    example, if the facility keyword **mail** is specified by itself, all severity
    levels of mail messages are processed.

    +   - A facility keyword is followed by a period and the **none** severity keyword.
    This combination specifies that no messages from the specified facility should
    be processed. For example, **mail.none** indicates that no mail messages should
    be processed.

    +   - The asterisk (*) facility is used. This facility specifies that all source
    facilities (except the **mark** facility) should be processed. For example, ***.notice**
    indicates that all messages of the notice level sent to syslog (from all sources
    except **mark**) should be processed.


    You can specify more than one facility/severity combination in an /etc/syslog.conf
    entry by separating them with the semicolon (;) character.


    # Actions


    Each entry has an action associated with it. Table 14.3 lists the four forms of
    actions.


    **Table 14.3  The syslog Actions**


    | Action | Description |

    |---|---|

    | */filename* | The identified syslog messages are appended to the specified file
    (must begin with a slash (/) character). |

    | **@host** | The identified syslog messages are forwarded to the **syslogd**
    daemon on the specified remote host (must begin with the at ([@]) character).
    |

    | *login account* | The identified syslog messages are written to the standard
    out (typically the monitor) associated with the specified login account if the
    account is currently logged on to the system. Multiple login accounts can be specified
    (separated by commas). |

    | * | The identified syslog messages are written to the standard out of all login
    accounts currently logged on to the system. |'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Optional Entries Controlled by m4 Macros


    You can define optional entries in the /etc/syslog.conf file by using the m4 macro,
    specified in the facility/keyword column or the action column, as follows:


    ```

    ifdef(condition, define_if_true, define_if_false)

    ```


    The ifdef() macro provides a conditional control statement. If *condition* is
    true, the **define_if_true** expression is in effect. If not, the **define_if_false**
    expression is in effect.


    The only relevant **condition** for the /etc/syslog.conf file is the ‘LOGHOST’
    keyword. This keyword is used to determine whether the local system has an alias
    of **loghost** in the /etc/hosts file. This alias indicates that the associated
    host is configured to store local syslog messages and possibly syslog messages
    from remote hosts. The following /etc/hosts entry shows the solaris8 system being
    identified as **loghost**:


    ```

    192.168.99.8    solaris8    loghost

    ```


    The following line shows a typical example of using an m4 ifdef macro in the action
    column of the /etc/syslog.conf file:


    ```

    auth.notice   ifdef(''LOGHOST'', /var/log/authlog, @loghost)

    ```


    This entry specifies that for an **auth.notice** message, if the local system
    is identified in the /etc/hosts file as **loghost**, the message should be added
    to the /var/log/authlog file. Or, if the local system is not identified as the
    **loghost**, the message should be forwarded to the system identified as the **loghost**.


    The following listing shows using an m4 ifdef macro to optionally define entire
    /etc/syslog.conf file entries based on the local system *not* being the **loghost**:


    ```

    ifdef(''LOGHOST'',

    user.err        /dev/sysmsg

    user.err        /var/adm/messages

    user.alert      ''root, operator''

    user.emerg      *

    )

    ```


    This macro specifies that if the local system is defined as **loghost**, nothing
    should be done (that is, the **define_if_true** expression is blank). If the local
    system is not **loghost**, **user.err**, **user.alert**, and **user.emerg** messages
    should be processed locally.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# ## The /etc/syslog.conf File


    Entries in the /etc/syslog.conf file determine the handling of syslog messages.
    The **syslogd** daemon reads the /etc/syslog.conf file whenever it is started
    or when it is sent the **SIGHUP(1)** signal. Table 14.4 summarizes the default
    syslog message handling (/etc/syslog.conf contents) for systems that log messages
    locally. The previously described **m4** macro for **user** messages is also included.


    **Table 14.4  The Default /etc/syslog.conf File**


    | Facility/Severity | Action | Description |

    |---|---|---|

    | `*.err,kern.notice; auth.notice` | `/dev/sysmsg` | All error, **kernel.notice**,
    and **auth.notice** messages are written to the /dev/sysmsg file. |

    | `*.err;kern.debug; daemon.notice; mail.crit` | `/var/adm/messages` | All error,
    **kern.debug**, **daemon.notice**, and **mail.crit** messages are written to the
    /var/adm/messages file. |

    | `*.alert;kern.err; daemon.err` | `operator` | All **alert**, **kern.err**, and
    **daemon.err** messages are written to the operator login account (if currently
    logged in). |

    | `*.alert` | `root` | All **alert** messages are written to the root account
    (if currently logged in). |

    | `*.emerg` | `*` | All **emerg** messages are written to all login accounts currently
    logged in. |


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_334_0.png)


    Unless an entry exists for a particular facility/severity combination, messages
    generated using that particular combination are discarded. Be careful not to delete
    any of the existing entries unless those messages are being handled by a new entry.
    The most commonly used default log file is /var/adm/messages.


    # ## Messages Generated by the logger Command


    The logger(1) command can be used by users, shell scripts, or programs to generate
    syslog messages. Table 14.5 lists the command-line arguments for the **logger**
    command.'
  merge: -1
  img_proc: true
- pgno: 335
  md: "| **Table 14.5  Command-Line Arguments for the logger Command** | |\n|---|---|\n\
    | **Argument** | **Description** |\n| *message* | Specifies the text of the message.\
    \ |\n| *-f file* | Uses the contents of *file* as the message. |\n| *-i* | Includes\
    \ the process ID (PID) of the *logger* command on each message. |\n| *-p priority*\
    \ | Specifies the priority of the message, which is specified as *facility.level*\
    \ or a number. The default is *user.notice*. |\n| *-t tag* | Includes *tag* on\
    \ each message. |\n\nThe following example uses the logger command to log a message\
    \ with a **user.err** priority:\n\n```\n```text\n$ logger -p user.err \"This is\
    \ a user error\"\n\n$ tail /var/adm/messages\n\nMar 31 20:09:38 solaris8 su: [ID\
    \ 810491 auth.crit]\n    'su root' failed for dla on /dev/pts/5\nMar 31 20:20:31\
    \ solaris8 su: [ID 810491 auth.crit]\n    'su root' failed for dla on /dev/pts/7\n\
    Apr 19 00:41:02 solaris8 dla: [ID 702911 user.error]\n    This is a user error\n\
    \n#\n```\n```\n\n# Messages Generated by the login Command\n\nThe login(1) command,\
    \ used to log on to the system, can be configured to generate **auth.notice**\
    \ syslog messages when the root account logs on to the system. In addition, multiple\
    \ failed attempts to log in as root are logged as **auth.crit** syslog messages.\
    \ These messages are generated by the login command if the /etc/default/login\
    \ file contains the following entry:\n\n```\n```text\nSYSLOG=YES\n```\n```\n\n\
    # Messages Generated by Internet Services\n\nThe Internet services daemon, **inetd(1M)**,\
    \ which is used to start the standard Internet services, can be configured to\
    \ trace incoming TCP connections by logging the client IP address, TCP port number,\
    \ and name of the service as a **daemon.notice** syslog message. To enable this\
    \ logging, add the **-t** command-line argument to the **inetd** command at the\
    \ end of the /etc/init.d/inetvs file."
  merge: -1
  img_proc: true
- pgno: 336
  md: "# Auditing Login Accounts and Processes\n\nSeveral commands are available to\
    \ monitor the use of system and user login accounts. In addition, you can use\
    \ several commands to identify the processes currently running on the system and\
    \ the associated login accounts.\n\n# The who Command\n\nYou can use the who(1)\
    \ command to determine which system and user accounts are currently logged in\
    \ to the local system. Without arguments, the who command lists the login account\
    \ name, terminal device, login date/time, and optionally an indication of X Window\
    \ System terminal (:0.0):\n\n```\n```text\n$ who\nroot        console      Apr\
    \  4 18:57   (:0)\nroot        pts/5        Apr  8 22:13   (:0.0)\ndla       \
    \  pts/6        Apr 11 21:06   (winnt40)\n$\n```\n```\n\nWhen the -q command-line\
    \ argument is specified, only the login account names and number of users currently\
    \ logged on are displayed, as shown in the following example:\n\n```\n```text\n\
    $ who -q\nroot    root    dla\n# users=3\n$\n```\n```\n\n# The whodo Command\n\
    \nThe whodo(1M) command determines the processes that each login account is executing.\
    \ The following example shows (among other things) that the user dla is using\
    \ the vi(1) command:\n\n```\n```text\n# whodo\nThu Apr 19 02:22:25 EDT 2001\n\
    solaris8\n\n    console       root    16:16\n        ?         423    0:00 xsession\n\
    \      pts/2       467    0:00 sdt_shell\n      pts/2       483    0:00 ttsession\n\
    \      pts/2       484    0:01 dtsession\n        ?        1091    0:00 dtcscreen\n\
    \        ?         491    0:04 dtwm\n        ?         507    0:00 dtaction\n\
    \        ?         492    0:01 sdtperf-meter\n      pts/2       470    0:00 sh\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 337
