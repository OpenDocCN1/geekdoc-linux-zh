    \ system from the console. To list information for only a particular login account,\
    \ specify the account name as a command-line argument:\n\n```\n# last dla\ndla\
    \       ftp       winnt40 Fri Apr  6 02:10 - 02:33 (5+00:22)\n#\n```"
