  md: 'This chapter covers some system basics, including navigating the Unix directory
    tree, using the **vi** editor, and accessing remote systems. This chapter covers
    the *Basic Command Syntax*, *Editor*, and *Remote Connection* test objectives.


    # # The Unix Directory Tree


    The Unix data storage facility is a collection of directories containing files
    and other directories. These files and directories are organized in a hierarchical
    structure with the root (/) directory as the starting point. Therefore, Unix data
    storage is organized in the form of an inverted tree, with directories as branches
    and files as leaves.


    # ## Metacharacters


    *Metacharacters* are characters or combinations of characters that can represent
    all or portions of directory names or filenames. With metacharacters, you can
    use a short phrase to represent a longer directory/file name or even a series
    of directory/file names. The three standard shells (Bourne, C, and Korn) support
    the metacharacters listed in Table 10.1.


    **Table 10.1  Directory/File Name Metacharacters**


    | Metacharacter | Description |

    |---|---|

    | `?` | Matches any single character. |

    | `*` | Matches zero or more occurrences of any character. |

    | `[...]` | Represents a set of characters of which any one character can match.
    Commonly used character sets can be represented as ranges. For example, lowercase
    letters (`[a-z]`), uppercase letters (`[A-Z]`), and numbers (`[0-9]`) are frequently
    used. |


    An example best illustrates the use of metacharacters. Given a set of files—filea,
    fileb, through filez—you can specify the following metacharacter expressions as
    an argument to the ls command to represent all 26 files:


    ```

    ```shell

    ls file[abcdefghijklmnopqrstuvwxyz]

    ls file[a-e f-j k-o p-t u-z]

    ls file[a-mn-z]

    ls file[a-z]

    ls file*

    ls file?

    ```

    ```


    Therefore, metacharacters can be used to reference files that have a common prefix
    or suffix. For example, given a set of C language source code files that'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'all end with the .c extension, you can reference all these files by using the
    *.c metacharacter expression.


    # Directory Tree Navigation


    When a user logs in to the system, he or she is positioned somewhere in the Unix
    directory tree—typically in the user account’s home directory. The current directory,
    referred to as the *current working directory*, can be displayed by using the
    pwd(1) command.


    The user can move around the directory tree by using the cd(1) command. When used
    without any command-line arguments, cd relocates the user to the directory specified
    by the HOME environment variable (typically the user account’s home directory).
    A new directory can be specified as a command-line argument. If the directory
    exists and the user has execution permission for that directory, he or she is
    relocated to that directory. The new directory can be specified by using a complete
    directory name, a partial directory name and metacharacters, or (in a few cases)
    all metacharacters.


    The new directory can also be specified as a *full or absolute pathname* starting
    with the root (/) directory, or a *partial or relative pathname* starting at the
    current working directory. You can reference the current directory by using a
    single dot (.) and the directory above the current directory (the *parent directory*)
    by using two dots (..), as shown in this example:


    ```

    ```sh

    $ pwd

    /export/home/dla

    $ cd ..

    $ pwd

    /export/home

    $ cd .

    $ pwd

    /export/home

    $ cd /export/home

    $ pwd

    /export

    $ cd dla

    $ pwd

    /export/home/dla

    $

    ```

    ```


    You can also reference multiple parents in the same path by using (..), as shown
    in this example:


    ```

    ```sh

    $ pwd

    /export/home/dla

    $ cd ../../..

    $ pwd

    /export

    $

    ```

    ```'
