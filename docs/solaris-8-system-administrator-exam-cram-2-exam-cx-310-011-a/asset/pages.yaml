- pgno: 446
  md: 'The first part of this chapter covers concepts and terms related to system
    installation, specifically over-the-network installation. Some of this information
    was covered in Chapter 3, “Installing and Maintaining Solaris 8,” as it pertained
    to the Part I exam objectives. Some of the information in Chapter 3 is repeated
    here with a slightly different emphasis.


    The second part of this chapter covers automating over-the-network installation
    with the JumpStart feature. The *JumpStart – Automatic Installation* test objectives
    are covered in this chapter.


    # # Server Installation


    This section includes the phases of an installation, the software configurations
    that can be installed on a system, and over-the-network installation.


    # ## Installation Phases


    Installation consists of three phases: The *system configuration* phase identifies
    the necessary system information, the *system installation* phase copies the software
    onto the system, and the *post-installation* phase updates system software as
    required.


    # ### System Configuration Phase


    During the system configuration phase, basic information about the system, such
    as hostname and domain, is identified. Optionally, this information can be set
    up ahead of time, or *preconfigured*. You can use two methods to preconfigure
    system information. The first uses the sysidcfg file, and the second uses a name
    service.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_446_0.png)


    > > If a system is not preconfigured, the **sysidtool**(1M) is executed during
    installation to prompt for the information. The **sysidtool** command consists
    of five programs: **sysidnet, sysidnis, sysidys, sysidroot,** and **sysidpm.**


    # ### System Installation Phase


    During the system installation phase, the selected Solaris 8 software group (see
    “Software Groups,” later in this chapter) is installed by using one of the four
    installation methods:


    +   - SunInstall (standard interactive installation)

    +   - Web Start'
  merge: -1
  img_proc: true
- pgno: 447
  md: '+   - JumpStart

    +   - Custom JumpStart


    The two interactive installation methods (SunInstall and Web Start) are Part I
    exam objectives and were discussed in Chapter 3. The two automatic installation
    methods (JumpStart and Custom JumpStart) are Part II exam objectives and are described
    later in this chapter in “Automating Installation with JumpStart.”


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_447_0.png)


    All four installation methods can use over-the-network installation, as described
    later in this chapter. However, exam CX-310-012 addresses over-the-network installation
    only in terms of its use with JumpStart.


    # Post-Installation Phase


    During the post-installation phase, any appropriate patches are installed, along
    with any separately bundled applications. In addition, any custom configurations,
    such as user accounts and environments, are applied to the system. Typically,
    system security changes are also performed during the post-installation phase.


    # Preconfiguring System Information


    As previously described, during the system configuration phase, basic information
    about the system (such as hostname and domain) is identified. This information
    can be defined in the sysidcfg file, in the name service being used (Network Information
    Service [NIS] or Network Information Service Plus [NIS+]), or manually in an interactive
    dialog box.


    # Using the sysidcfg File


    To use the sysidcfg file method, you create a file for each system containing
    a set of lines in the form **keyword=value**, such as **timezone=US/CENTRAL**.
    The file can be available over the network (via Network File System [NFS]) or
    on a floppy disk mounted in the local floppy disk drive. The following information
    can be defined in the sysidcfg file:


    +   - Name service (NIS, NIS+, DNS, or none), along with the hostname and IP address
    of the server

    +   - Domain name

    +   - Network interface (enable use of DHCP or specify IP address and netmask;
    enable IPv6)'
  merge: -1
  img_proc: true
- pgno: 448
  md: '+   - Root password

    +   - System locale

    +   - Terminal (keyboard, mouse, monitor, and graphics card type)

    +   - Time zone (timezone and timeserver)


    # Using NIS


    For the name service method, entries for each system are added to the NIS or NIS+
    database. Name services are described in Chapter 19, “Name Services.”


    The following system definition information can be defined by using NIS/NIS+:


    +   - Name service (implied)

    +   - Hostname and IP address

    +   - System locale

    +   - Time zone (timezone and timeserver)


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_448_0.png)


    > A lot of information can be defined in the sysidcfg file that cannot be defined
    in a name service, including the domain name, most of the network interface parameters
    (netmask, DHCP usage, and IPv6 usage), the root password, and terminal information
    (monitor, keyboard, mouse, and so on).


    The system locale (specific language and region) is stored in the /etc/locale
    file and can be specified for the system name or the domain name. For NIS, you
    can build a locale.byname map by modifying and executing the NIS makefile. The
    /etc/locale file is used as a source of information for the local.byname map.
    For NIS+, you use the **nיסtbladm**(1M) command to build the locale table and
    add entries.


    # Software Configurations


    The Solaris 8 system software is distributed in several different configurations,
    as described in the following sections.


    # Software Packages


    Solaris 8 system and application software are delivered as collections of files
    and directories, referred to as *software packages*. These packages can be copied
    onto the system from CD-ROM or magnetic tape as a single compressed file and then
    uncompressed for installation.'
  merge: -1
  img_proc: true
- pgno: 449
  md: 'Included with the package is additional information, such as title, storage
    requirements, and version. Also included are any custom scripts needed to properly
    install the software.


    # Software Clusters


    Sometimes system software is distributed in more than one package, but the packages
    need to be distributed and installed as a unit. A collection of two or more related
    packages is referred to as a *software cluster*, a logical grouping of packages.


    # Software Groups


    *Software groups* (also referred to as *software configuration clusters*) are
    collections of software clusters. Depending on the intended use of the system,
    the most appropriate software group should be selected for installing an operating
    system. Table 21.1 describes the five software groups.


    **Table 21.1 — Solaris 8 Software Groups**


    | Software Group | Contents |

    |---|---|

    | Core | Minimum files required for the operating system. |

    | End User Support System | Typical configuration for a system that supports general
    users. Consists of the Core software group plus:<br>Windowing software: Common
    Desktop Environment (CDE) and Open Windows<br>Basic networking and printer support<br>Standard
    Unix and patch utilities<br>Java Virtual Machine |

    | Developer System Support | Intended as a software development environment. Consists
    of the End User Support System software group plus:<br>Programming tools and libraries<br>Extended
    terminal, X, and kernel probing support<br>CDE/Motif developer software and runtimes<br>Online
    manual pages |

    | Entire Distribution | All files included with the Solaris 8 distribution. Consists
    of the Developer System Support software group plus:<br>AnswerBook2 (online Web-based
    documentation)<br>Enhanced security features, including disk quotas and system
    accounting<br>Enhanced network support, including Unix-to-Unix Copy Protocol (UUCP),
    Dynamic Host Configuration Protocol (DHCP) server, Point-to-Point Protocol (PPP),
    and NIS |'
  merge: -1
