- pgno: 229
  md: '# Types of Files


    The allocated space on file systems is in the form of directories or files. Only
    one type of directory exists. However, there are several types of files. The files
    used to store data or executables are referred to as *regular* or *ordinary* files.
    Other files are used for special purposes. Table 9.5 lists all supported files.
    You can identify a file’s type by a single-character ID produced by the `ls -l`
    command.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_229_0.png)


    Be familiar with the types of files supported in the Solaris environment and the
    character IDs the `ls` command uses to identify the types of files.


    | Table 9.5 File Types |  |  |

    |---|---|---|

    | Type | `ls -l` ID | Description |

    | Regular | `-` | An ordinary or regular file. Used for data and executables.
    |

    | Directory | `d` | A directory. Used to organize files and other directories.
    |

    | Link | `l` | A symbolic link. Used to provide an alternative path to a file
    or directory (see the next section, “Types of Links”). |

    | Block special | `b` | A file that provides an interface to a block-oriented
    peripheral device. These files are typically located under the `/dev` or `/device`
    directory. Also referred to as *device files*. |

    | Character special | `c` | A file that provides an interface to a character-oriented
    peripheral device. These files are typically located under the `/dev` or `/device`
    directory. Also referred to as *device files*. |

    | Door | `D` | A file that provides an Remote Procedure Call (RPC) mechanism interface
    between programs and between the kernel and a user space process. |

    | FIFO | `p` | A First-In-First-Out or named pipe data structure that provides
    a mechanism for two cooperating programs to communicate. |

    | Socket | `s` | A network (AF_UNIX) socket data structure used to communicate
    via a network interface. |


    # Types of Links


    As previously mentioned, files and directories are *linked* into a directory.
    This link is stored as an entry in the directory and provides a reference for
    locating and accessing the file or directory.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'The directory entry is actually a pointer to the location of the file or directory
    within the file system and is referred to as a *hard link*. Because links point
    to files or directories based on their location in the file system, links cannot
    be used to point to files or directories in a different file system. Therefore,
    a hard link implies that the file or directory is located in the current file
    system.


    A *soft link* or *symbolic link* provides a mechanism for referencing a file or
    directory on another file system. Instead of pointing to a location in the file
    system, the directory entry contains the full pathname of another file or directory.
    Using symbolic links enables you to create multiple pathnames and filenames on
    different file systems that all point to the same file or directory.


    You can use the **link**(1M) and **ln**(1) commands to create hard links. However,
    only the **ln** command can be used to create symbolic links (by using the **-s**
    command-line argument). The **unlink**(1M) command deletes hard or soft links.
    When all hard links to a file or directory are deleted, the file or directory
    is removed. You can also use the **rm**(1) and **rmdir**(1) commands to delete
    hard or soft links.


    # File and Directory Compression


    Directories and files can be compressed to use less space on disk drives and,
    more important, on backup devices, such as magnetic tape and optical media. Solaris
    supports three types of utilities to compress and uncompress (that is, expand)
    data:


    +   - **compress**(1) and **uncompress**(1)

    +   - **gzip**(1) and **gunzip**(1)

    +   - **zip**(1) and **unzip**(1)


    # The compress and uncompress Commands


    The **compress** command uses the adaptive Lempel-Ziv coding algorithm to compress
    one or more files specified with the command-line arguments (separated by spaces).
    Files compressed with the **compress** command are given a .Z extension. You can
    uncompress files with the **uncompress** command, specifying the filenames as
    command-line arguments (separated by spaces). Note that the **compress** command
    can be used only on regular files, and each file is compressed separately. The
    following example shows the use of these commands:


    ```

    ```text

    # ls -l

    total 3

    -rw-r--r--  1 root     other    103306 Apr  6 02:27 file4

    ```

    ```'
  merge: -1
  img_proc: true
