- pgno: 142
  md: '| Table 5.7 Characters in Positions 2 Through 10 Used in the File Permission
    Field of the `ls` Command Display |

    |---|

    | **Character** | **Description** |

    | `l` | Mandatory locking |

    | `r` | Read permission |

    | `s` | Set UID (when in fourth position) or set GID (when in seventh position)
    |

    | `S` | Undefined state |

    | `t` | Sticky bit |

    | `T` | Undefined state |

    | `w` | Write permission |

    | `x` | Execution permission |

    | `-` | No permission granted |


    Position 11 is normally a space, except when an ACL has been defined on the directory/file.
    In this case, a plus sign (+) appears in the 11th position. The following example
    shows the permission field portion of the output generated by this command:


    ```

    ```text

    # ls -l

    total 2

    drwxrwxrwx  2 sarah  other       512 Jan 24 13:49 dir1

    -rwsr-xr-x  1 sarah  other      1112 Jan 24 13:53 file1

    lrwxrwsr-x  1 sarah  other      1112 Jan 24 13:53 file2

    -rwxrwxr-x  1 sarah  other      1112 Jan 24 13:53 file3

    ```

    ```


    The listing for dir1 shows that it is a directory with mode 1777 (sticky bit plus
    read, write, execute permissions for owner, group, and others). The listing for
    file1 shows that it is a file with mode 4775 (setuid; read, write, execute for
    owner; read, write, execute for group; and read, write, execute for others). The
    listing for file2 shows that it is a symbolic link with mode 2775 (setgid; read,
    write, execute for owner; read, write, execute for group; and read, execute for
    others). The listing for file3 shows that it is a file with mode 2777 (mandatory
    locking; read, write, execute for owner; read, write for group; and read, write,
    execute for others). The + indicates that an ACL has been defined for file3.'
