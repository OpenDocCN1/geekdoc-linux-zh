  md: '```

    ```sh

    # This is the default standard profile provided to users.

    # They are expected to edit it to meet their own needs.

    MAIL=/usr/mail/${LOGNAME:?}

    ```

    ```


    When you create an account by using the **admintool** command, the appropriate
    /etc/skel file is copied to the home directory of the user account based on the
    selected login shell. When you use the **useradd** command, all the /etc/skel
    files (.profile, local.cshrc, local.login, and local.profile) are copied to the
    home directory. The appropriate files must be set up manually.


    # Customizing the User Environment


    You can modify the initialization file templates to create a custom environment
    for new user accounts. In addition, you can modify the system profile (/etc/profile)
    to customize the environment for all users during login initialization.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_166_0.png)


    Keep in mind that the system profile, /etc/profile, is executed before the user''s
    profile. This execution order makes it possible to control and restrict the user
    environment before the user has an opportunity to make any modifications.


    To customize individual user accounts, you can modify the initialization files
    in the user’s home directories. For the most part, this change consists of adding
    commands to be executed automatically or defining shell parameters.


    # Defining Shell Variables in $HOME/.profile


    Variables defined and exported in the $HOME/.profile become part of the user’s
    environment. These variables are available to programs and shells the user executes.


    A common shell variable defined in the $HOME/.profile is **LPDEST**, which specifies
    a default printer. To define HPLaser as the default printer, include the following
    in the $HOME/.profile for a user account:


    ```

    ```sh

    LPDEST=HPLaser

    export LPDEST

    ```

    ```


    Alternatively, you can specify both commands on the same line and separate them
    with a semicolon:


    ```

    ```sh

    LPDEST=HPLaser; export LPDEST

    ```

    ```


    A similar syntax can be used for a user account that uses ksh as a login shell:


    ```

    ```sh

    export LPDEST=HPLaser

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Although defining variables for csh user accounts is not a certification requirement,
    the syntax for two csh methods of defining variables is shown here:


    ```

    set LPDEST=HPlaser

    setenv LPDEST HPlaser

    ```


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_167_0.png)


    Changes made to the user''s login initialization file do not take effect until
    the user logs in again or the $HOME/.profile is executed by preceding it with
    a dot followed by a space. This technique executes the $HOME/.profile and makes
    it part of the current environment.


    # Sourcing $HOME/.profile


    For user accounts that use the Solaris Common Desktop Environment (CDE), you can
    configure the /usr/dt/bin/Xsession command that starts the desktop to read and
    process the .login (csh) or .profile (sh and ksh) login initialization file in
    the user’s home directory as part of the startup process.


    The first user-specific file that Xsession calls is the .dtprofile file located
    in the user’s home directory. This is the last line of the default .dtprofile
    file:


    ```

    DTSOURCEPROFILE=true

    ```


    This line causes the .login or .profile file to be executed (or sourced) automatically.
    To change this default behavior and prevent the login initialization file from
    being sourced, change true to false.


    # Login and Logout Procedures


    The following sections cover command-line login and logout procedures. Keep in
    mind that from the system console, a GUI can be used to log in to the Solaris
    CDE.


    # Logging in to a Solaris 8 System


    The login(1) command is used to log in to (or into or on to) a system. When a
    connection is made to a system via the network or terminal, the login command
    is typically used to interact with the user to prompt for and obtain a user account
    name and password. This information is then compared to entries in the /etc/passwd
    and /etc/shadow files to determine whether the user should be given access to
    the system. If so, the login shell specified in the /etc/passwd file is started
    to give the user an interface to the system. If not, the login command tries several
    more times to obtain a valid user'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'account and password. If all these attempts fail, the connection to the system
    is dropped.


    # Failed Login Attempts


    Failed login attempts are saved in the /var/adm/loginlog file after five unsuccessful
    attempts. This logging is enabled by creating the loginlog file and disabled by
    deleting it. The file should be created with read/write permissions for root only.
    It does not exist by default and needs to be created by the system administrator.


    # Logging Out of a Solaris 8 System


    In most situations, you can use the exit(1) command to log out of (or, in some
    circles, off of) a system. All three shells recognize this command. For csh, the
    logout(1) command can also be used to log out of a system.


    # Identifying and Monitoring Users


    You can use several commands to identify and monitor users:


    +   - **id(1M)**—Displays the real and effective UID and GID

    +   - **finger(1)**—Displays information about local and remote users

    +   - **last(1)**—Displays login and logout information

    +   - **who(1)**—Displays the users currently logged in to the system

    +   - **whodo(1M)**—Displays who is doing what


    # The id Command


    The **id** command displays the real and effective UID and GID for the invoking
    process or specified user account. If you invoke **id** with **-a** as an option,
    all groups in which the user ID is a member are returned. The following lines
    show the results of executing the **id** command:


    ```

    ```text

    # id -a

    uid=0(root) gid=1(other) groups=1(other),0(root),2(bin),

    3(sys),4(adm),5(uucp),6(mail),7(tty),8(lp),9(nuucp),12(daemon)

    #

    ```

    ```


    # The finger Command


    The **finger** command displays information about users logged in to the local
    system or a specified remote system. Use the **-l** command-line argument to display
    detailed information. You can also specify a logged-in user’s account'
  merge: -1
  img_proc: true
