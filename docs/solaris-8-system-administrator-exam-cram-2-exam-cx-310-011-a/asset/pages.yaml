    ![](img/b957f979417d9f16274c2eb52c8f2c9f_225_0.png)


    You can use the **mount** command to mount CacheFS, HSFS, NFS, PCFS, TMPFS, UDF,
    and UFS file systems. Unlike the other file system commands, the **mount** command
    expects a logical block device name of a partition in which the file system resides.


    The **umount**(1M) command is used to unmount a file system. The file system cannot
    be unmounted if it is busy (for example, a program residing on the file system
    is being executed, or the current directory of a logged-in user account is within
    the file system). Either the logical block device name or the mount point can
    be specified as a command-line argument.


    The **mountall**(1M) command mounts all file systems listed in the /etc/vfstab
    file. This file is also used to determine the file systems to automatically mount
    during system boot. You can add or remove file systems in the /etc/vfstab file
    with any standard text editor. Table 9.4 lists the (tab-separated) fields of an
    entry in the /etc/vfstab file. A hyphen indicates no entry in a field.


    **Table 9.4 Fields of the /etc/vfstab File**


    | Field | Description |

    |---|---|

    | Device To Mount | Logical block device name of the file system partition to
    mount |

    | Device To fsck | Logical block device name used for the **fsck** command |

    | Mount Point | Subdirectory where the file system should be mounted |'
