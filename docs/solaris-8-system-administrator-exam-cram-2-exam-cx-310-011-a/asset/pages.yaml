    \ In the Reboot window, click Reboot Now to reboot the system.\n\nAfter the system\
    \ reboots, log in as the root account and select OpenWindows or CDE as a desktop\
    \ for the account. You’ve now completed the Solaris 8 installation for a networked\
    \ standalone system by using Web Start.\n\n# Upgrading an Existing Solaris System\n\
    \nUpgrading a system enables you to merge the existing system configuration with\
    \ the new Solaris 8 operating system. However, planning and occasional manual\
    \ intervention are necessary for a successful upgrade.\n\n![](img/b957f979417d9f16274c2eb52c8f2c9f_77_0.png)\n\
    \nSunInstall and Custom JumpStart (see Chapter 21) can be used to upgrade a system.\
    \ Web Start and the standard JumpStart cannot be used to upgrade an existing system\
