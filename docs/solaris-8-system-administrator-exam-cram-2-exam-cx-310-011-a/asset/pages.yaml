- pgno: 135
  md: 'addition, ACLs support read/write/execution permissions for the standard others
    (everyone else).


    ACLs also include a mask capability that controls the maximum allowed permissions
    given to user and group accounts other than the standard file user account and
    the standard file group account.


    For example, suppose root owns a file and sets its ACL mask to read/execute. Later,
    root adds read/write/execute permission to the file ACL for the guest user account.
    Because of the mask, the write permission is overridden, and the effective permissions
    for the guest account are read/execute.


    The ACL for a directory includes default entries that determine the permissions
    assigned to files and subdirectories created under the directory. Default permissions
    can be defined for the standard Unix user, group, and other along with a default
    mask and default permissions for specific users or groups.


    Two commands are used to manage ACLs: The **setfacl** command sets ACLs, and the
    **getfacl** command displays ACLs.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_135_0.png)


    > Using the **setfacl** command to add, modify, and delete ACLs on files and directories
    is a stated test objective.


    # Setting ACLs by Using setfacl


    You use the setfacl(1) command to set and modify ACLs. It supports three command-line
    arguments:


    +   - **-d**—Deletes the specified ACL entries

    +   - **-m**—Adds/changes the specified ACL entries

    +   - **-s**—Replaces the whole ACL with the specified entries


    ACL entries for the standard user and group permissions are specified by using
    the format **entry:permissions** (note the two colons); **entry** is the keyword
    **user** or **group** (or the single-letter abbreviation **u** or **g**), and
    **permissions** is the appropriate combination of **r**, **w**, **x**, and **-**
    needed to define the permission.


    ACL entries for the standard other permission and the mask used for maximum permissions
    use a slightly different syntax. The format is **entry:permissions** (note the
    single colon); **entry** is the keyword **other** or **mask** (or the single-letter
    abbreviation **o** or **m**), and **permissions** is the appropriate combination
    of **r**, **w**, **x**, and **-** needed to define the permission.'
