    \ GID can be specified.\n+   - e. The user account is deleted.\n\nAnswer b is\
    \ correct. The **-o** command-line option of the **usermod** command lets you\
    \ specify a duplicate UID. The actions listed in the other answers are not supported\
    \ by the **usermod** command. Therefore, answers a, c, d, and e are incorrect.\n\
    \n# ## Question 10\n\n+   **When using the `admintool` command to create a user\
