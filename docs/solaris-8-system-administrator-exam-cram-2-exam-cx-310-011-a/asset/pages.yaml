    # The Online Reference Manual


    The *Solaris 8 Reference Manual* (in printed form) is a multivolume set of manuals
    that document the commands, system calls, library functions, special files, and
    so on available with the Solaris 8 operating system. This format originated with
    the initial version of the Unix operating system developed by AT&T Bell Labs and
    has been adopted as the definitive documentation for almost every version of the
    Unix operating system available.


    For convenience, an online version of the *Reference Manual* is provided with
    the Solaris 8 system and most other versions of the Unix operating system. You
    can view the pages or topics of the online *Reference Manual* on the terminal/monitor
    screen by using the **man(1)** command. The *Reference Manual* is also included
    in the Solaris 8 AnswerBook2 online documentation, which lets you search, display,
    and print *Reference Manual* pages using an HTML Web browser, such as Netscape
    Navigator. The pages of the *Reference Manual* are referred to as *man pages*.


    The *Reference Manual* is divided into sections. Each section addresses a related
    set of commands or different aspects of the operating system. Table 2.2 describes
    the *Reference Manual* sections.'
