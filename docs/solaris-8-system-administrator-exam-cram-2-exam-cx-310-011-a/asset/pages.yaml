    # The Sysadmin Group


    A user account that is a member of the sysadmin group (numerical group 14) can
    perform some selected system administration activities using **admintool** (IM)
    without being granted full superuser privileges. As a result, more than one person
    can perform basic system administration (adding and deleting users, printers,
    software, and so on) without compromising system security. To enable this capability,
    configure the setuid root permission for **admintool** and specify membership
    in the sysadmin group as a requirement for using **admintool**. Additional information
    about groups is covered in the “/etc/group” section, and more details on the setuid
    permission are covered in the “Special Permission” section, later in this chapter.


