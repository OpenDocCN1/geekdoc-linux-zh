    # The kill Command


    The kill(1) command terminates a process by sending a signal to it that causes
    it to exit. Many different types of signals exist. The signals typically used
    to terminate a process are listed in Table 7.3, and a complete listing of base
    signals can be found in signal(3HEAD).


    The default response of processes that receive these signals is to terminate,
    but this behavior can be changed on a process-by-process basis.


    | Symbolic Name | Value | Description |

    |---|---:|---|

    | SIGHUP | 1 | Hangup |

    | SIGINT | 2 | Interrupt |'
