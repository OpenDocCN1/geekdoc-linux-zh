- pgno: 140
  md: '| Argument | Description |

    |---|---|

    | **name** | The name of a directory or file to display information about. To
    specify more than one name, separate them with spaces and/or use metacharacters
    (see Chapter 10, “System Basics”). If one or more *names* are directories, the
    contents of those directories are listed. If no *names* are specified, all directories/files
    in the current directory are listed. |

    | **-a** | Lists all directories and files, including those beginning with a dot
    (which are normally not displayed). |

    | **-A** | Lists all directories and files, including those beginning with a dot,
    except the current directory (.) and the parent directory (..). |

    | **-b** | Displays nonprintable characters in file/directory names by using octal
    \\ddd notation. |

    | **-c** | Uses the time of the last link modification for sorting or listing.
    |

    | **-C** | Generates multicolumn output sorted down columns (default). |

    | **-d** | Lists the names of directories instead of the directory contents. |

    | **-f** | Interprets all *names* as directories. |

    | **-F** | Indicates the type of files by marking them with a trailing character.
    Marks directories with a forward slash (/), doors with a greater-than sign (>),
    executable files with an asterisk (*), FIFOs with a vertical bar (\|), symbolic
    links with an ampersand (@), and sockets with an equals sign (=). |

    | **-g** | Lists file permissions, ACL indication, number of links, group, byte
    size, and last modification time stamp. Same as **-l** but does not list the owner.
    |

    | **-i** | Lists the i-node numbers, which are unique numbers assigned to each
    file and directory within a file system. |

    | **-l** | Lists file permissions, ACL indication, number of links, owner, group,
    byte size, and last modification time stamp. |

    | **-L** | For symbolic links, lists the referenced directory/file instead of
    the link. |

    | **-m** | Lists information across the page, separated by columns. |

    | **-n** | Lists file permissions, ACL indication, number of links, UID of the
    owner, GID of the group, byte size, and last modification time stamp. Same as
    **-l** but lists the UID and GID instead of the owner and group. |

    | **-o** | Lists file permissions, ACL indication, number of links, owner, byte
    size, and last modification time stamp. Same as **-l** but does not list the group.
    |

    | **-p** | Marks directories with a trailing forward slash (/). |

    | **-q** | Uses a question mark (?) for any nonprinting characters in directory/file
    names. |

    | **-r** | Reverses the order of the sort (zyx... instead of abc..., or oldest
    instead of newest). |'
