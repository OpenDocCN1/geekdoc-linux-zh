    # Open Network Computing (ONC) and the Remote Procedure Call Mechanism


    Sun Microsystems has developed an environment for supporting distributed services.
    This environment is referred to as Sun’s Open Network Computing Plus (ONC+) Technologies.
    ONC+ Technologies is a family of technologies, services, and tools with the following
    main components:


    +   - **Applications**—Network File System (NFS) and Network Information Service
    Plus (NIS+) services. They use RPCs to accomplish the client/server interaction.

    +   - **Remote Procedure Call (RPC)**—A mechanism that enables a client to request
    a remote server to execute a procedure or process.

    +   - **External Data Representation (XDR)**—A machine-independent data representation.
    Both clients and servers translate data into and out of the XDR format. This mechanism
    provides a standardized format for all data to overcome differences in data byte
    ordering, data type size, and byte alignment between different hardware architectures.

    +   - **Transport Layer Interface (TLI)**—An interface to TCP/IP that allows the
    RPC mechanism to be protocol independent. You can select a connection-oriented
    protocol (such as TCP) or a connectionless protocol (such as UDP) without making
    changes to the client or server code.

    +   - **Sockets**—Another mechanism for interfacing to TCP/IP that supports protocol-independent
    client and server programming.


    In the TCP/IP model, all the ONC+ components reside in the Application layer.
    In terms of the OSI model, these components are distributed among the Session
    layer (RPC), Presentation layer (XDR), and Application layer (NFS and NIS+). Note
    that the applications call XDR routines to translate the data. Once translated,
    the data is either processed locally or passed to RPC routines that send the data
    to a remote system.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# Registering RPC Services


    For systems to use distributed services built on RPC, the programs providing services
    must be identified (registered) on particular systems. The rpcbind(1M) daemon
    manages RPC services on a system. Each RPC program is assigned a unique number.
    When a RPC program starts, it contacts the local rpcbind daemon and provides its
    RPC program number, version, and so on. When a remote client attempts to use a
    local RPC service, it contacts the local rpcbind daemon to obtain information
    (based on RPC program number) about the service and to request a connection to
    the service. Therefore, the rpcbind daemon provides a method for local services
    to register their availability and remote clients to identify the services and
    establish a connection to the servers.


    You can use the rpcinfo(1) command to contact the local or a remote rpcbind daemon
    and request it to list the currently registered RPC services. The following example
    uses the rpcinfo command to list local services and, because a remote host’s name
    is specified as a command-line argument, to list services on a remote system:


    ```

    ```text

    # rpcinfo

    program version netid   address       service  owner

    100000  4       ticots   solaris8.rpc   rpcbind  superuser

    100000  3       ticots   solaris8.rpc   rpcbind  superuser

    100000  4       ticotsord solaris8.rpc  rpcbind  superuser

    100000  3       ticotsord solaris8.rpc  rpcbind  superuser

    100000  4       ticots   solaris8.rpc   rpcbind  superuser

    100000  3       ticots   solaris8.rpc   rpcbind  superuser

    100000  4       tcp      0.0.0.0.111    rpcbind  superuser

    100000  3       tcp      0.0.0.0.111    rpcbind  superuser

    100000  2       tcp      0.0.0.0.111    rpcbind  superuser

    100000  4       udp      0.0.0.0.111    rpcbind  superuser

    .

    .

    .

    # rpcinfo sparc20

    program version netid   address       service  owner

    100000  4       ticots   sparc8.rpc    rpcbind  superuser

    100000  3       ticots   sparc8.rpc    rpcbind  superuser

    100000  4       ticotsord sparc8.rpc   rpcbind  superuser

    100000  3       ticotsord sparc8.rpc   rpcbind  superuser

    100000  4       ticots   sparc8.rpc    rpcbind  superuser

    100000  3       ticots   sparc8.rpc    rpcbind  superuser

    100000  4       tcp      0.0.0.0.0.111  rpcbind  superuser

    100000  3       tcp      0.0.0.0.0.111  rpcbind  superuser

    100000  2       tcp      0.0.0.0.0.111  rpcbind  superuser

    100000  4       udp      0.0.0.0.0.111  rpcbind  superuser

    .

    .

    .

    ```

    ```


    RPC services are typically listed in the /etc/rpc file, which contains the common
    RPC service name, its RPC program number, and any aliases. See the rpc(4) manual
    page for more information.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Controlling Network Services


    Most Internet and RPC services are started automatically by the **inetd**(1M)
    Internet Services daemon when needed. These services are specified as entries
    in the /etc/inet/inetd.conf file (or /etc/inetd.conf, which is symbolically linked
    to /etc/inet/inetd.conf).


    The **inetd** daemon is started automatically at system boot, or you can start
    it manually by executing the **/etc/inetd** start command.


    Likewise, all Internet and RPC services controlled by the **inetd** daemon are
    stopped automatically when the system is shut down, or you can stop them manually
    by executing the **/etc/inetd** stop command.


    You can stop individual Internet and RPC services by using the kill command to
    send a signal to the process providing the service. However, the **inetd** daemon
    should be reconfigured so that it will not retry to restart the service.


    To reconfigure the **inetd** daemon, edit the /etc/inet/inetd.conf file. Then
    use the kill command to send the Hang Up signal (SIGHUP) to the **inetd** daemon.
    This signal causes the **inetd** daemon to reread the /etc/inetd.conf file. You
    can also use the /etc/inet/inetd script (as previously described) to stop and
    restart the **inetd** daemon, or you can reboot the system.


    # The Solaris Network Environment


    The Solaris 8 network environment supports several different types of system configurations,
    including standalone, diskless, and AutoClient. These configurations provide different
    capabilities and affect deployment and support costs.


    # Standalone Configuration


    A *standalone* system has local disk space for storing all operating system files,
    applications, and user data, which includes the root (/), /usr, /export/home,
    and /var file systems. Likewise, it provides local swap space for the system’s
    virtual memory. A standalone system can function autonomously and can be networked
    or non-networked. You can use a networked standalone system as a server, such
    as a file server, to provide remote access to shared or common data.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# File Server Concepts


    *A file server* is a standalone system that functions as a server and enables
    clients to access files via the network. There are several kinds of file servers.


    One important type of file server in the Solaris environment is the *operating
    system (OS) server*. The OS server provides access to client systems that do not
    have all or some of the operating system files available through local file systems
    on local hard disks.


    An OS server can support more than one version of an operating system at a time.
    This support includes not only different releases of an operating system, such
    as Solaris 8, Solaris 7, and SunOS 2.5, but also different hardware platforms,
    such as SPARC and Intel x86 compatibles.


    # Diskless Configuration


    A *diskless client*, as the name implies, does not have a hard disk on which to
    store the operating system or applications locally. Storage is provided by a *diskless
    client server* that is accessible via the network. For a diskless client to boot
    and operate, it must remotely mount its root (/) and /usr file systems from an
    OS server.


    In addition to providing a common set of operating system files for all diskless
    clients (of the same version) through the network, the OS server provides hard
    disk space assigned for use by each client. This disk space is used for swap space
    for the diskless client’s virtual memory system and for the /home file system
    for user accounts that are unique to each diskless client.


    Compared to the standalone configuration, the diskless configuration is cheaper
    and easier to maintain because only a few systems (the OS servers) require hard
    disks. Only one copy of common files is required, and this copy is shared among
    many clients. In addition, all data unique to each client is stored on an OS server,
    simplifying backup and restore procedures. Because no data is stored on the clients,
    the client hardware can be easily replaced or upgraded.


    The main disadvantages of the diskless configuration are its dependence on the
    network and the load it places on the network. If a diskless client cannot access
    the OS server via the network, it cannot operate at all. In addition, because
    all data (including that in swap space) is accessed remotely, the network is extremely
    loaded even under normal operating conditions.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# # AutoClient Configuration


    An *AutoClient* is similar to a diskless client, except that it has a limited
    amount of local storage space (minimum of 100MB) used for a specific purpose.
    Like the diskless client, the AutoClient must remotely access its root (/) and
    /usr file systems from an OS server configured as an AutoClient server. Unlike
    the diskless client, the AutoClient uses local disk space to store or cache the
    root (/) and /usr file systems.


    In addition, the local hard disk is used for swap space. Like the diskless configuration,
    the OS server provides hard disk space for the /home and /var file systems that
    are unique to each diskless client.


    Compared to the diskless configuration, the AutoClient configuration is somewhat
    more expensive because its client requires a hard disk; however, the hard disk
    is small. Like the diskless configuration, only one copy of common files is required,
    and this copy is shared among the clients. In addition, all data unique to each
    client is stored on an OS server, simplifying backup and restore procedures. Therefore,
    in terms of client hardware, AutoClients, like diskless clients, can be replaced
    or upgraded easily.


    The disadvantages of the diskless configuration are reduced or, in some cases,
    eliminated by the AutoClient configuration. After the AutoClient has cached the
    operating system, it no longer requires access to the OS server for those files.
    In addition, the local swap space eliminates much of the network load.


    # # Comparison of Configurations


    Table 13.6 compares the significant differences among the system configurations
    supported in the Solaris 8 network environment.


    **Table 13.6  A Comparison of System Configurations**


    | System Type | Local Swap | Local File Systems | Remote File Systems |

    |---|---|---|---|

    | Standalone | Yes | root, /usr, /var, /export/home | None or optional |

    | Diskless client | No | None | root, /usr, /var, /home |

    | AutoClient | Yes | root, /usr | /var, /home |


    Standalone systems that function as servers typically provide file systems——such
    as /export/root, /export/home, and /export/swap——that store files remotely accessed
    by diskless clients and AutoClients. In addition, servers and standalone systems
    provide the /opt file system for storing application software.'
  merge: -1
  img_proc: true
