- pgno: 390
  md: 'This chapter covers some additional topics relating to file systems. The first
    part covers the Network File System (NFS) and the commands used to administer
    NFS. The next part describes the AutoFS and CacheFS services that support NFS.
    This chapter covers the NFS, AutoFS, and CacheFS test objectives.


    # The NFS Environment


    The NFS service uses the server/client model to allow systems to remotely access
    the storage space of other systems. The NFS protocol is defined by Request For
    Comment (RFC) 1813, “NFS Version 3 Protocol Specification.”


    An NFS server allows computers of different architectures running different operating
    systems to access its storage space across a network. The NFS service also allows
    multiple systems to access the same information, thereby eliminating redundancy,
    improving consistency, and reducing administration.


    An NFS client accesses this information in a somewhat transparent mode. That is,
    the remote resource appears and can be treated as local storage space for most
    operations and applications.


    # NFS Administration


    Before file systems or directories can be accessed (that is, mounted) by a client
    through NFS, they must be shared or, in older terminology, advertised. Once the
    resources are shared, authorized NFS clients can mount them.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_390_0.png)


    Another term for sharing NFS resources is exporting. This term appears occasionally
    in Solaris documentation, but is most often seen as a directory name for NFS resources,
    such as /export/home or /export/swap.


    # Sharing NFS Resources


    NFS resources can be shared by using the **share**(1M) command and unshared by
    using the **unshare**(1M) command. In addition, any resources identified in the
    /etc/dfs/dfstab file are automatically shared at system boot or when the **shareall**(1M)
    command is used. Shared resources are automatically recorded in the /etc/dfs/sharetab
    file. When the **unshareall**(1M)'
  merge: -1
  img_proc: true
- pgno: 391
  md: 'command is used, all resources listed in the `/etc/dfs/sharetab` file are automatically
    unshared.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_391_0.png)


    Actually, the NFS server is started and the identified resources are shared when
    the system enters system run level 3 as a result of system boot or administrator
    actions. The resources are unshared and the NFS server is stopped when the system
    run level changes to any level other than 3. Remember that the NFS client is started
    at run level 2.


    # The Share Command


    The **share** command shares NFS resources so that NFS clients can mount and access
    them. At a minimum, you must specify the full pathname of the directory (or mount
    point of the file system) to be shared as a command-line argument.


    In addition, three other command-line arguments are supported. The **-d** command-line
    argument is followed by a description of the data being shared. The **-F nfs**
    command-line argument specifies the type of file system. If not specified, the
    default file system type listed in the `/etc/dfs/fstypes` file (NFS) is assumed.
    The **-o** command-line argument is followed by one or more NFS-specific options
    (separated by commas). The share command options for NFS are listed in Table 18.1.
    For details on the settings associated with these options, consult the **share(1M)**
    description in the *System Reference Manual*.


    **Table 18.1  The share Command’s NFS-Specific Options**


    | Option | Description |

    |---|---|

    | `aclok` | Allows access control for NFS Version 2 clients. |

    | `anon=uid` | Assigns anonymous users the specified *uid*. |

    | `index=file` | Displays the contents of *file* instead of listing the directory
    for WebNFS clients. |

    | `nosub` | Prevents clients from mounting subdirectories of shared resources.
    |

    | `nosuid` | Prevents clients from setting setuid or setgid access modes on files.
    |

    | `public` | Specifies a public file handle. |

    | `ro` | Allows read-only access. |

    | `ro=list` | Allows read-only access to those clients specified by *list*. |

    | `root=list` | Allows root access to root users on clients specified by *list*.
    |

    | `rw` | Allows read/write access. |

    | `rw=list` | Allows only read/write access to those clients specified by *list*.
    |'
  merge: -1
  img_proc: true
- pgno: 392
  md: '**Table 18.1  The share Command’s NFS-Specific Options (continued)**


    | Option | Description |

    |---|---|

    | **sec-mode** | Uses one or more of the security modes specified by **mode**
    to authenticate clients. Modes are user ID (sys), Diffie-Hellman public key system
    (dh), Kerberos Version 4 (krb4), or none. |

    | **window=value** | Sets the maximum lifetime for a client’s credentials to **value**
    seconds. |


    The following example uses the **share** command to allow NFS clients to mount
    the /export/home file system, including WebNFS clients. All clients will have
    read-only access:


    ```

    # share -F nfs -o public,ro /export/home

    #

    ```


    If you use the **share** command without any command-line arguments, the currently
    shared resources will be listed.


    # The unshare Command


    The **unshare** command stops the sharing of NFS resources so that NFS clients
    can no longer mount and access them. At a minimum, you must specify the full pathname
    of a directory (or mount point of the file system) that is currently shared as
    a command-line argument.


    Only one other command-line argument is supported: **-F nfs**, which specifies
    the type of file system. If not specified, the default file system type listed
    in the /etc/dfs/fstypes file (NFS) is assumed. Because NFS is the only network
    file system shipped with Solaris, you don’t need to use this argument.


    The following example uses the **unshare** command to stop the sharing of the
    /export/home file system:


    ```

    # unshare -F nfs /export/home

    #

    ```


    # The /etc/dfs/dfstab File


    The /etc/dfs/dfstab file specifies resources that should be shared automatically
    when the system is changed to run level 3 or when the **shareall** command is
    used.


    This file can be modified by using any text editor. To automatically share a resource,
    add a line to the /etc/dfs/dfstab file that contains the **share** command with
    the command-line arguments and options that would have been entered manually.
    To remove automatic sharing of a resource, delete the appropriate **share** command
    from /etc/dfs/dfstab. See the previously described **share** commands for examples.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '![](img/b957f979417d9f16274c2eb52c8f2c9f_393_0.png)


    You might wonder why some of the directories, files, and even commands associated
    with NFS use the phrase *dfs* or *df*. This usage comes from the System V (5)
    version of the UNIX operating system. Originally, Distributed File System (DFS)
    had two variations: NFS and the Remote File System (RFS). Directories, files,
    and commands containing the *dfs* phrase were used to manage and configure both
    types of file systems. Since then, RFS has disappeared, leaving behind the DFS
    legacy.


    # The shareall and unshareall Commands


    The **shareall** command shares one or more resources. If the **-F** fns command-line
    argument is not specified, the default file system type (NFS) is assumed. If the
    name of a file (that contains one or more **share** commands) is not specified
    as a command-line argument, the /etc/dfs/dfstab file is used by default.


    The **unshareall** command unshares all currently shared resources. If the **-F
    nfs** command-line argument is not specified, the default file system type (NFS)
    is assumed.


    # The dfshares Command


    The **dfshares(1M)** command lists shared resources on the local or a remote system.
    If the hostname (or IP address) of a remote system is specified as a command-line
    argument, the resources shared on that system are listed.


    In addition, two other command-line arguments are supported. The first is **-F
    nfs** (as previously described), and the other is **-h**. If specified, the header
    describing the columns of the resource listing is not displayed.


    In addition, you can obtain information on locally shared resources from the /etc/dfs/sharetab
    file. This file is updated by the **share**, **shareall**, **unshare**, and **unshareall**
    commands to reflect the currently shared resources.


    # Mounting NFS Resources


    NFS resources that have been shared by an NFS server can be mounted by an NFS
    client using the **mount(1M)** command and unmounted using the **umount(1M)**
    command. In addition, any NFS resources identified in the /etc/vfstab file are
    automatically mounted at system boot or when the **mountall(1M)** command is used.
    Likewise, the NFS resources listed in the /etc/mnttab file are unmounted by using
    the **umountall(1M)** command.


    # The mount Command


    The **mount** command is used to mount NFS resources like any other standard Solaris
    file system so that NFS clients can mount and access them. For NFS, you specify
    the hostname (or IP address) and pathname of the'
  merge: -1
  img_proc: true
- pgno: 394
  md: 'currently shared directory as a command-line argument followed by a mount point.
    The hostnames and pathnames are separated by a colon (:).


    The generic **mount** command-line arguments are listed in Table 18.2. A few of
    the more significant NFS-specific options used with the **-o** command-line argument
    are listed in Table 18.3. (Multiple NFS-specific options are separated by commas.)
    For additional information, see the **mount_nfs**(1M) page in the *System Reference
    Manual*.


    | Table 18.2 The mount Command-Line Arguments |  |

    |---|---|

    | **Argument** | **Description** |

    | `-F fstype` | Specifies the file system type |

    | `-m` | Mounts the file system without creating an /etc/mnttab entry |

    | `-o` | Specifies NFS-specific options (see Table 18.3) |

    | `-O` | Overlays an existing mount point |

    | `-r` | Mounts the file system read-only |


    | Table 18.3 The mount Command''s NFS-Specific Options |  |

    |---|---|

    | **Option** | **Description** |

    | `hard` | If the server does not respond, continues to try to mount the resource
    |

    | `intr` | Allows keyboard interrupts to kill the process while waiting on a **hard**
    mount |

    | `nointr` | Does not allow keyboard interrupts to kill the process while waiting
    on a **hard** mount |

    | `public` | Specifies a public file handle |

    | `retrans=n` | Retransmits NFS requests *n* times |

    | `retry=n` | Retries the mount operation *n* times |

    | `ro` | Mounts resource as read-only |

    | `rw` | Mounts resource as read/write |

    | `soft` | If the server does not respond, returns an error and exits |

    | `timeo=n` | Sets the NFS time-out to *n* tenths of a second |


    The following example uses the **mount** command to mount the /export/home file
    from the “sun” system on the /sun_home mount point. The resource is soft mounted
    (1,000 attempts) with read-only access:


    ```

    ```sh

    # mount -F nfs -o soft,retry=1000,ro sun:/export/home /sun_home

    #

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 395
  md: 'If you use the **mount** command without any command-line arguments, all currently
    mounted file systems (standard Solaris file systems and NFS resources) are displayed.


    # The umount Command


    The **umount** command is used to unmount local file systems and remote NFS resources
    so that local users can no longer access them. For NFS, you specify one or more
    *system:path name* pairs (or file system mount points) that are currently mounted
    as command-line arguments.


    Two other command-line arguments are supported. The first is **-V**, which displays
    instead of executes the command line used to perform the unmount (used to verify
    the command line). The second is **-a**, which performs parallel unmount operations
    if possible.


    The following example uses the **umount** command to unmount the `/export/home`
    file system being shared from the *solaris* host:


    ```

    ```shell

    # umount solaris:/export/home

    #

    ```

    ```


    # The /etc/vfstab File


    The /etc/vfstab file, referred to as the *file system table*, specifies resources
    that should be automatically mounted when the system is booted or when the **mountall**
    command is used.


    You can modify this file by using any text editor. To automatically mount an NFS
    resource, add a line to the /etc/vfstab file that contains the appropriate options
    that would have been entered manually with a **mount -F nfs** command. To remove
    automatic mounting of an NFS resource, delete the appropriate line from the /etc/vfstab
    file.


    Table 18.4 lists the (tab-separated) fields and the appropriate values of an entry
    in the /etc/vfstab file as they pertain to mounting an NFS resource. A hyphen
    (-) indicates no entry in a field.


    | Table 18.4 — Fields of an NFS Resource /etc/vfstab Entry |  |

    |---|---|

    | **Field** | **Description** |

    | **Device To Mount** | Uses the **system:resource** format; **system** is a hostname
    or IP address and **resource** is the full pathname of the shared NFS resource
    |

    | **Device To fsck** | Uses a hyphen (-) to indicate no entry because NFS clients
    should not check remote NFS resources with the **fsck** command |'
  merge: -1
  img_proc: true
- pgno: 396
  md: '| Field | Description |

