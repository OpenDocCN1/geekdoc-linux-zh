    (setuid) and cannot be used to log in to the system. If the field contains *LK*,
    the account is locked and cannot be used to access the system. If the field is
    empty, no password exists, and the user is forced to enter a password the first
    time the account is used. |

    | Last changed | The number of days between January 1, 1970, and the last date
    the password was changed. |

    | Minimum | The minimum number of days required to pass before the user is allowed
    to change the password. |

