    # ## Files


    Typically, system programs and applications create files. These files can be copied,
    moved (or renamed), and deleted as required. These operations are performed by
    the following commands:


    +   - **cp(1)**—Copies one or more files.

    +   - **mv(1)**—Moves or rename files.

    +   - **rm(1)**—Removes one or more files.


    # ### Copying Files by Using the cp Command


    The cp(1) command copies one or more files to another directory or creates a copy
    of an existing file with a different name. Note that when you’re copying multiple
    files, they cannot be renamed.


    When you’re copying one or more files to another directory, the last command-line
    argument is the target directory and all preceding command-line arguments are
    the files to be copied. The files to be copied can be complete filenames, multiple
    files selected with metacharacters, or any combination. Multiple filenames are
    separated by spaces. In the following examples, the first two **cp** commands
    copy one file to a different filename. The third command copies several files
    into another directory:


    ```

    # ls -l

    total 224

    -rw-r--r--   1 root     other      103306 Apr 13 20:48 file1


    # cp file1 file2


    # ls -l

    total 448

    -rw-r--r--   1 root     other      103306 Apr 13 20:48 file1

    -rw-r--r--   1 root     other      103306 Apr 13 20:48 file2

    ```'
