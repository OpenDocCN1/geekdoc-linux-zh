- pgno: 259
  md: '# # Last Line Mode


    Last Line mode is used to perform searches and enter commands associated with
    the **ed** and **ex** line-oriented text editors. You enter Last Line mode from
    Command mode by pressing any of the following three keyboard characters:


    +   - **Colon <:>**—Specifies **ed** or **ex** commands, which are mainly file
    control commands (such as writing the file) or executing a shell command.

    +   - **Forward slash </>**—Performs a search for a text pattern in the file,
    starting from the current position and searching toward the end of the file.

    +   - **Question mark <?>**—Performs a search for a text pattern in the file starting
    from the current position and searching toward the beginning of the file.


    In Last Line mode, you can specify the operation you want. When you press <Enter>,
    the specified operation is performed and the **vi** editor returns to Command
    mode.


    # ## File Control and Execution


    Table 10.5 lists some of the common Last Line mode keyboard sequences used for
    file control and command execution. See the vi(1) manual page for more information.


    | Sequence | Description |

    |---|---|

    | `:<e>name` | Edits the named file |

    | `:<e>!` | Discards changes and re-edits |

    | `:<w>` | Writes changes to a file |

    | `:<w>!` | Writes changes regardless of file permission |

    | `:<q>` | Quits |

    | `:<q>!` | Discards changes and quits |

    | `:<cmd>` | Executes the specified **ed** or **ex** command specified by *cmd*
    |


    # ## Text Search


    Table 10.6 lists some of the common Last Line mode keyboard sequences for performing
    text searches. See the vi(1) manual page for more information.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '| Sequence | Description |

    |---|---|

    | `/text/` | Searches forward for *text* (trailing slash optional) |

    | `?text?` | Searches backward for *text* (trailing question mark optional) |


    If the text is found, the cursor is positioned at the beginning of the specified
    text. When the end (or beginning) of the file is encountered, the search continues
    at the beginning (or end) of the file contents. Press `</>` or `<?>` followed
    by `<Enter>` to repeat the last search.


    # Text Search and Replace


    The vi editor supports text search-and-replace functions. They combine the ability
    to search for text and replace the located text into a single operation. Table
    10.7 lists the text search-and-replace keyboard sequences.


    | Sequence | Description |

    |---|---|

    | `:<x>s/<old>/<new>/` | Searches the current line for the first occurrence of
    *old* and replaces it with *new* (trailing slash optional) |

    | `:<x>s/<old>/<new>/g` | Searches the current line for all occurrences of *old*
    and replaces them with *new* |

    | `:<x>1,.,$s/<old>/<new>/` | Searches for the first occurrence of *old* on all
    lines and replaces them with *new* (trailing slash optional) |

    | `:<x>1,.,$s/<old>/<new>/g` | Searches for all occurrences of *old* on all lines
    and replaces them with *new* |

    | `:<x>g/old/s//new/` | Searches for the first occurrence of *old* on all lines
    and replaces them with *new* (trailing slash optional) |

    | `:<x>g/old/s//new/g` | Searches for all occurrences of *old* on all lines and
    replaces them with *new* |


    Note that `g` denotes a global search and that there are two meanings of “global.”
    The first refers to the current line, meaning the global replacement affects all
    occurrences on the current line as opposed to just the first occurrence. Therefore,
    the `g` at the end of the keyboard sequence refers to all occurrences on the current
    line. The second meaning of “global” refers to all lines.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Two mechanisms address all 1s. The first uses the **1,$** sequence to indicate
    all lines. When this sequence is used with the **s///** sequence, vi attempts
    search-and-replace on all lines in the file. The second mechanism uses the **g/old/**
    sequence to locate all lines containing the phrase **old**. When this sequence
    is used with the **s/// ** sequence to perform a replacement, the **old** text
    does not need to be specified in the first field of the **s/// ** sequence. Although
    both **1,$s/old/new/** and **g/old/s//new/** use different approaches, the results
    are the same. That is, the first occurrence of **old** in every line is replaced
    with **new**. Note that you can add a **<g>** to the end of both commands to affect
    all occurrences of **old**.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_261_0.png)


    Know the purpose of Last Line mode and the file control, search, and search-and-replace
    keyboard sequences. Also keep in mind that <Enter> terminates Last Line mode and
    returns the vi editor to Command mode.


    # # Accessing Remote Systems


    Solaris 8 provides several commands to perform remote login, remote copy, and
    remote execution of commands:


    +   - **telnet(1)**—Remote Network Terminal utility

    +   - **ftp(1)**—File Transfer Protocol utility

    +   - **rlogin(1)**—Remote login

    +   - **rcp(1)**—Remote copy

    +   - **rsh(1)**—Remote shell execution


    The **ftp** and **telnet** commands require the user to log in to the remote system
    using a valid user account name and password set up on the remote system. The
    **rlogin**, **rcp**, and **rsh** commands are collectively referred to as the
    “r commands,” and all can use the remote authentication database in place of requiring
    a user account name and password to validate the user.


    # ## Remote Login


    Two commands provide the ability to log in to a remote system as a local user
    over the network: the **telnet** command and the **rlogin** command.


    # ### The telnet Command


    The **telnet** command is used to log in remotely to a system over the network.
    The user must provide a valid user account name and password as defined on'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'the remote system because the **telnet** command uses standard Unix login/password
    authentication.


    The remote system’s hostname or IP address is typically specified as a command-line
    argument. If this address is not specified, the **telnet** command is placed in
    an interactive mode. The remote system prompts for a user account name and password.
    The following example uses the **telnet** command to log in to the remote system
    solaris8 using the dla user account name:


    ```

    ```text

    $ telnet solaris8

    Trying 192.168.99.8...

    Connected to solaris8.

    Escape character is ''^]''.



    SunOS 5.8


    login: dla

    Password:

    Last login: Sat Feb  3 22:34:56 from wint40

    Sun Microsystems Inc.   SunOS 5.8   Generic February 2000

    $

    ```

    ```


    # The rlogin Command


    The **rlogin** command can also be used to log in remotely to a system over the
    network. If the remote authentication database has been set up properly, the user
    might be able to log in without providing a valid user account name and password.
    This capability is described later in this chapter in the section “The Remote
    Authentication Database.”


    If this database has not been set up properly, the user must, as with the **telnet**
    command, provide a valid user account name and password as defined on the remote
    system. If the user account name executing the **rlogin** command on the local
    system exists on the remote system, the user account name is not required. (It
    is assumed to be the same as the local system’s user account name.) If another
    user account is to be used on the remote system, the user account name must be
    specified with the **rlogin** command-line using the **-l** command-line argument.


    The following listing shows three examples of using the **rlogin** command to
    log in to the remote system solaris8. In the first example, the database has been
    set up to allow the local user account (dla) to log in to the same user account
    on the remote system. In the second example, the database has not been set up.
    The user account name dla is assumed and a prompt is issued for a password. In
    the third example, a different user account is used (sarah) and the user account
