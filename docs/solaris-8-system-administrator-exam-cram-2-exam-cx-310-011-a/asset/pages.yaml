- pgno: 405
  md: "To set up a CacheFS log, use the **cachesfslog** command with the -f command-line\
    \ argument followed by the filename to be used for the log and the name of the\
    \ directory where the cached file system is mounted (not the name of the cache\
    \ itself). For example, to set up a log named /var/tmp/home_log on a cached file\
    \ system mounted at /home, use the following **cachesfslog** command:\n\n```\n\
    ```bash\n# cachesfslog -f /var/tmp/home_log /home\n/var/tmp/home_log: /home\n\
    #\n```\n```\n\nTo verify cache logging, use the **cachesfslog** command and specify\
    \ only the mount point of the cached file system as a command-line argument:\n\
    \n```\n```bash\n# cachesfslog /home\n/var/tmp/home_log: /home\n#\n```\n```\n\n\
    To halt logging, use the **cachesfslog** command with the -h command-line argument\
    \ followed by the mount point of the cached file system:\n\n```\n```bash\n# cachesfslog\
    \ -h /home\nnot logged: /home\n#\n```\n```\n\nTo determine the optimum cache size,\
    \ set up CacheFS logging and allow it to run for an appropriate time period (such\
    \ as a day or week) to provide a snapshot of the representative work load. Then\
    \ stop logging and use the **cachefswssize** with the log's filename as a command-line\
    \ argument:\n\n```\n```text\n# cachefswssize /var/tmp/home_log\n\n        /home\
    \                 end size:                 72k\n              high water size:\
    \                          72k\n\n        total for cache\n              initial\
    \ size:                              53888k\n                    end size:   \
    \                         72k\n              high water size:                \
    \          72k\n#\n```\n```\n\nThe **end size** (cache working set size when logging\
    \ was halted) and **high water size** (largest cache working set size) are displayed\
    \ for each file system mounted in the cache. In this example, only one file system\
    \ (/home) is mounted.\n\nThe **total for cache** summary includes the **initial\
    \ size** of the cache. If the **high water size** is the same as the **initial\
    \ size**, the cache is probably too small. If the **high water size** is much\
    \ smaller than the **initial size**, the cache is probably too large."
