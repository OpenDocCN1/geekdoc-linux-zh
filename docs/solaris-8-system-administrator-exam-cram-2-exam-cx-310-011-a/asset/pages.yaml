- pgno: 77
  md: "+   10. The Lay Out File Systems window shows a default file system layout.\
    \ To modify the layout, highlight a listed disk/file system entry and click Modify.\
    \ A Disk dialog box opens in which you can assign the file systems on the disk\
    \ to different slices and/or modify the size of each file system. Click Apply\
