- pgno: 40
  md: '# The Testing Situation


    When you arrive at the Prometric Testing Center where you scheduled your test,
    you’ll need to sign in with a test coordinator. He or she will ask you to produce
    two forms of identification, one of which must be a photo ID. After you’ve signed
    in and your time slot arrives, you’ll be asked to leave any books, bags, or other
    items you brought with you, and you’ll be escorted into a closed room. Typically,
    that room will be furnished with anywhere from one to half a dozen computers,
    and each workstation will be separated from the others by dividers designed to
    keep you from seeing what’s happening on someone else’s computer.


    You’ll be furnished with a pen or pencil and a blank sheet of paper or, in some
    cases, an erasable plastic sheet and an erasable felt-tip pen. You’re allowed
    to write down any information you want on this sheet, and you can write on both
    sides of the page. I suggest you memorize as much as possible of the material
    on the Exam Sheet (on this book’s inside back cover) and then write that information
    on the blank sheet as soon as you sit down in front of the test machine. You can
    refer to the sheet any time you like during the test, but you’ll have to surrender
    it when you leave the room.


    Most test rooms feature a wall with a large window, which allows the test coordinator
    to monitor the room, prevent test-takers from talking to one another, and observe
    anything out of the ordinary that might be going on. The test coordinator will
    have preloaded the Solaris certification exam you’ve signed up for, and you’ll
    be permitted to start as soon as you’re seated in front of the machine.


    Each Solaris certification exam permits you to take up to 90 minutes to complete
    the test. (The test itself maintains an onscreen counter/clock so that you can
    check the time remaining whenever you like.) Part I consists of 57 questions and
    Part II consists of 61 questions, randomly selected from a pool of questions.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_40_0.png)


    All Solaris certification exams are computer generated and use a multiple-choice,
    drag-and-drop, or fill-in-the-blank format. Although this might sound easy, the
    questions are constructed not just to check your mastery of basic Solaris system
    administration, but also to require you to evaluate one'
  merge: -1
  img_proc: true
- pgno: 41
  md: "or more sets of circumstances or requirements. Often, you’ll be asked to give\
    \ more than one answer to a question; likewise, you might be asked to select the\
    \ best or most effective solution to a problem from a range of choices, all of\
    \ which technically are correct. The tests are quite an adventure, and they involve\
    \ real thinking. This book will show you what to expect and how to deal with the\
    \ problems, puzzles, and predicaments you’re likely to find on the exams.\n\n\
    # Test Layout and Design\n\nA typical test question is depicted in Question 1.\
    \ It’s a multiple-choice question that requires you to select a single correct\
    \ answer. Following the question is a brief summary of each potential answer and\
    \ why it was either right or wrong.\n\n# Question 1\n\n+   Which of the following\
    \ is the last phase in the Solaris boot process?\n+   \n+   - a. init\n+   - b.\
    \ Boot PROM\n+   - c. BIOS\n+   - d. Kernel initialization\n+   - e. Boot programs\n\
    \nAnswer a is correct. All these choices are phases of the SPARC or Intel x86\
    \ boot process. The boot PROM and BIOS phases test hardware. Therefore, answers\
    \ b and c are incorrect. The boot programs phase locates and loads boot programs,\
    \ and then the kernel initialization phase loads the kernel. Therefore, answers\
    \ d and e are incorrect. Only then can the init phase occur to initialize the\
    \ operating system services.\n\nThis sample question corresponds closely to those\
    \ you’ll see on Solaris certification exams. To select the correct answer during\
    \ the test, you would position the cursor over the radio button next to answer\
    \ a and click the mouse to select that particular choice. The only difference\
    \ between the questions on the certification exams and questions such as this\
    \ one is that the real questions are not immediately followed by the answers.\n\
    \nIn the following question, one or more answers are possible. This type of question\
    \ provides check boxes rather than radio buttons for marking all the correct selections."
