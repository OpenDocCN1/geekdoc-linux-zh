    \ command can be used only to change to system run level 0. Therefore, answer\
    \ f is incorrect.\n\n# Question 11\n\n+   How many run levels are there in Solaris\
    \ 8?\n+   \n+   - a. 6\n+   - b. 7\n+   - c. 8\n+   - d. 9\n\nAnswer c is correct.\
    \ Solaris 8 has eight run levels. Answers a and d are not feasible. You might\
    \ think that Solaris 8 has seven levels because run level 4 is not used, but run\
