    # # Role-Based Access

    ## Control (RBAC)


    **Terms you’ll need to understand:**


    +   - Roles

    +   - Profiles

    +   - Authorizations

    +   - Privileged operations


    **Techniques you’ll need to master:**


    +   - Creating and assigning roles

