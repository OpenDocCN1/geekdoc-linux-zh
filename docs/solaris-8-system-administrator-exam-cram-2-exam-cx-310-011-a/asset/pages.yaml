    plus:<br>PCI drivers<br>SunFastEthernet and FastWide SCSI adapter drivers |


    # # Over-the-Network Installation


    Typically, Solaris is installed directly from the Solaris distribution CD, which
    requires that each system be equipped with a CD-ROM drive. However, another approach
    is available: Solaris can be installed over the network by using a remote server
    that has the Solaris distribution CD in its CD-ROM drive or a copy of the files
    from the Solaris distribution CD on its hard disk.


    The over-the-network installation can be used with the two interactive installation
    methods (SunInstall or Web Start, covered in Chapter 3) or the two automatic installation
    methods (JumpStart and Custom JumpStart).


    To perform over-the-network installation, you must set up one or more network
    servers, consisting of an install server and possibly a boot server. In addition,
    you must add information about the install clients in the local NIS or NIS+ name
    service or in the /etc files of the appropriate install servers.


    # # Install Server


    An *install server* is a system that provides the distribution files needed to
    install the Solaris operating system on an install client during an over-the-network
    installation. The files can be provided directly from the Solaris distribution
    CD mounted in a local CD-ROM drive or from a local hard disk.


    If you copy the distribution files to a local hard disk, a single install server
    can be used to provide the files for multiple releases (Solaris 8, Solaris 7,
    Solaris 2.6, and so on) and/or for multiple platforms (SPARC and Intel x86). In
    addition, a local hard disk typically provides faster access to the distribution
    files than a local CD-ROM drive.


    To set up a system as an install server, mount the Solaris 8 Software (1 of 2)
    distribution CD in the local CD-ROM drive. Then use the **setup_install_server**
    command, under the Solaris_8/Tools directory on the Solaris distribution CD, to
    copy the distribution files to the install server’s'
  merge: -1
  img_proc: true
- pgno: 451
  md: 'local hard disk. One command-line argument is required: the full pathname to
    a target directory to which the distribution files will be copied. Although you
    can use any directory, by convention the directory is named /export/install. The
    following line executes the **setup_install_server** command from the Solaris_8/Tools
    directory of the distribution CD to set up an install server:


    ```

    # ./setup_install_server /export/install

    ```


    The **setup_install_server** command copies the CD image of the software to the
    specified directory. Both the Product and Tools directories are copied. In addition,
    a **netmask(4)** file containing the network subnet mask for the server is created
    in the Tools directory.


    After an install server is set up, you can add products from the other Solaris
    distribution CDs, such as Solaris 8 Software (2 of 2) or Solaris 8 Languages,
    to the install server. The directory for the files associated with the install
    server must be specified as a command-line argument. To add to the install server,
    insert the supplemental CD into the local CD-ROM drive and execute the **add_to_install_server(1M)**
    command on the CD. The following line executes the **add_to_install_server** command
    from the Solaris_8/Tools directory of the distribution CD to add to the install
    server:


    ```

    # ./add_to_install_server /export/install

    ```


    The **add_to_install_server** command supports two additional command-line arguments.
    The first is **-s**, which allows selecting the products to install. By default,
    all products are installed. The second is **-p product_path**; *product_path*
    is an alternative directory for products to be installed into.


    By default, the install server supports the SunInstall installation program (see
    Chapter 3). However, the install server can be modified to use the Solaris Web
    Start program instead. You can use the **modify_install_server(1M)** command (located
    on the Solaris 8 Installation CD) to copy the Web Start–enabled miniroot from
    the CD to the install server configuration.


    To modify the install server, insert the Solaris 8 Installation CD into the local
    CD-ROM drive and execute the **modify_install_server** command on the CD. The
    following line executes the **modify_install_server** command from the mount point
    of the distribution CD to modify the install server:


    ```

    # ./modify_install_server /export/install

    ```


    The **modify_install_server** command supports the **-p** command-line argument,
    which preserves the existing miniroot by copying it to the /Solaris_8/Tools/Boot.ori
    location under the install server configuration before the CD miniroot is installed.'
