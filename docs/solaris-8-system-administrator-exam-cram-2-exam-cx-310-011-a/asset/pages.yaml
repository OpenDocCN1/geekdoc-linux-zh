- pgno: 233
  md: 'A magnetic tape can contain more than one grouping of data, or *data set*.
    In some cases, a data set might be a single file. Usually, the data set is a collection
    of files written to a tape as a single unit. The data sets are separated by an
    End Of File (EOF) mark and are composed of any number of records or blocks. The
    command used to store data on the tape determines the block size.


    # ## The mt Command


    The `mt(1)` command is used to control magnetic tape operations, including positioning
    the tape to the beginning of a data set, rewinding the tape, and even erasing
    the tape. Table 9.6 lists the mt operations you can specify as command-line arguments.
    Most operations expect a value as another command-line argument specifying the
    number of times the operation should be repeated (shown in the table as *count*).
    If *count* is not specified, the operation is performed once.


    | Command | Description |

    |---|---|

    | `asf count` | Positions the tape after the *count*-1 EOF mark |

    | `bsf count` | Skips backward over *count* EOF marks |

    | `bsr count` | Skips backward over *count* records |

    | `eof count` | Writes *count* EOF marks |

    | `eom` | Skips forward to a position after the last data set |

    | `erase` | Erases the entire tape |

    | `fsf count` | Skips forward over *count* EOF marks |

    | `fsr count` | Skips forward over *count* records |

    | `rewind` | Rewinds the tape |

    | `status` | Displays status of tape drive |


    If a raw tape device is not specified following the `-f` command-line argument,
    the default tape device `/dev/rmt/0n` is assumed. The following example positions
    a tape to the fifth data set (that is, skips over four EOF marks):


    ```

    ```sh

    # mt -f /dev/rmt/0n fsf 4

    #

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# # The ufsdump and ufsrestore Commands


    The ufsdump(1M) and ufsrestore(1M) commands are used to back up and restore UFS
    file systems or specified files/directories. These commands can perform incremental
    backup and restore, using the file modification date as the selection criterion.


    # ## Dumping a File System by Using the ufsdump Command


    The **ufsdump** command provides several command-line arguments. Most of them
    relate to changing the backup media’s default characteristics. Table 9.7 lists
    the more significant command-line arguments of the **ufsdump** command.


    | Argument | Description |

    |---|---|

    | 0 through 9 | Dump level (0 is the entire file system) |

    | *a archive_file* | Uses *archive_file* to store a dump table of the contents
    |

    | c | Uses cartridge tape instead of standard half-inch reel tape |

    | f *dump_file* | Uses *dump_file* instead of /dev/rmt/0 |

    | u | Records the dump level and date in /etc/dumptdates |

    | v | Verifies the dump media after backup |


    You specify these single-character arguments together as a single group followed
    by the files (*archive_file*, *dump_file*, and so on) in the same order as the
    single-character arguments. Along with the appropriate command-line arguments,
    you must specify the files to dump (typically a logical raw device name of a file
    system).


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_234_0.png)


    > To ensure a usable backup, the file system should be unmounted or the system
    should be in the single-user run level before the backup is performed.


    If no command-line arguments other than the files are specified to dump, the default
    is **9uf /dev/rmt/0**. This command creates a dump level 9 backup using /dev/rmt/0
    as the dump file and records the backup in the /etc/dumptdates file.


    The dump level determines which files are backed up. If **0** is specified, the
    entire file system is backed up; otherwise, all files that have changed since
    the backup using a lower-numbered dump level are backed up. The following'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'line uses **ufsdump** to back up the entire file system identified by its logical
    raw device name, /dev/rdsk/c0t1d0s5, to the default tape device (/dev/rmt/0).
    The backup is verified:


    ```

    # ufsdump 0uv /dev/rdsk/c0t1d0s5

    ```


    # ## Restoring a File System by Using the **ufsrestore** Command


    The **ufsrestore** command restores a file system backed up with the **ufsdump**
    command. Like the **ufsdump** command, the **ufsrestore** command supports an
    *f dump file* command-line argument for identifying the media that contains the
    backup. If this argument is not specified, the /dev/rmt/0 device is used by default.
    The following line uses the **ufsrestore** command to restore a file system backup
    from the /dev/rmt/1 device to the current directory:


    ```

    # ufsrestore f /dev/rmt/1

    ```


    The **ufsrestore** command also supports an interactive restore capability that
    is enabled by using the i command-line argument.


    # ## Restoring Selected Files by Using the **ufsrestore** Command


    You can use the **ufsrestore** command’s extract (x) command-line argument to
    restore selected files from a backup instead of the entire file system. The files
    or directories to be restored from the backup are also listed as command-line
    arguments on the **ufsrestore** command. The following line extracts the /etc/passwd
    file and the /etc/default directory (and its contents) from a backup of the root
    file system on the /dev/rmt/1 device and restores them to the /etc directory:


    ```

    # ufsrestore xf /dev/rmt/1 /etc/passwd /etc/default

    ```


    # # The tar Command


    The tar(1) command creates a tape archive and adds or extracts files from the
    archive. Table 9.8 lists the five basic functions of the tar command.


    Table 9.8 The tar Functions


    | Function | Description |

    |---|---|

    | c | Creates (overwrites) a tape archive |

    | r | Replaces the named files in a tape archive |

    | t | Lists the files in a tape archive |

    | u | Updates the named files in a tape archive |

    | x | Extracts all the named files from a tape archive |'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'Along with these functions, the **-f tar file** command-line argument specifies
    a backup device. If this command-line argument is not used, either the backup
    device specified by the **TAPE** environmental variable or the backup device identified
    in the /etc/default/tar file is used. The files or directories to be backed up
    are listed as command-line arguments after the function and argument. You can
    use the v option to display the names of files as they are added to or extracted
    from the archive.


    In some situations, using the tar command to create a single archive of directories
    and files results in an archive that uses less space than all the original files
    and directories. Therefore, using the tar command can reduce storage space requirements.


    # Backing Up a Directory by Using the tar Command


    The following line uses the tar command to back up the /export/home directory
    to the /dev/rmt/0 tape drive:


    ```

    ```sh

    # tar cf /dev/rmt/0 /export/home

    ```

    ```


    # Restoring a Directory by Using the tar Command


    The following line uses the tar command to restore the /export/home directory
    from the /dev/rmt/0 tape drive:


    ```

    ```sh

    # tar xf /dev/rmt/0 /export/home

    ```

    ```


    # The cpio Command


    You can also use the cpio(1) command to create an archive of directories and files.
    The cpio command operates in three modes:


    +   - **Copy out (-o command-line argument)**—Reads a list of directory names
    and filenames and then copies their contents and control information to an archive
    format.

    +   - **Copy in (-i command-line argument)**—Reads an archive to extract the directories
    and files and re-creates them at a specified location on the system.

    +   - **Pass (-p command-line argument)**—Reads a list of directories/files (along
    with their contents) and reproduces them at a specified location on the system.


    Table 9.9 lists the most commonly used **cpio** command-line arguments. See the
    **cpio(1)** manual page for details.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Table 9.9 — Selected cpio Command-Line Arguments


    | Argument | Description |

    |---|---|

    | `-a` | Resets file access times (used with `-i`) |

    | `-A` | Appends to an archive (used with `-o`) |

    | `-d` | Creates directories as needed (used with `-i` and `-p`) |

    | `-i` | Copies in (extracts from an archive) |

    | `-I file` | Reads the contents of *file* as an input archive (used with `-i`)
    |

    | `-L` | Follows symbolic links (used with `-o` and `-p`) |

    | `-m` | Retains modification times (used with `-i` and `-p`) |

    | `-o` | Creates out (creates an archive) |

    | `-O file` | Uses *file* as an output archive (used with `-o`) |

    | `-p` | Passes input to output |

    | `-t` | Prints an archive table of contents; no files are created (used with
    `-i`) |

    | `-u` | Copies files unconditionally; older files overwrite newer files (used
    with `-i` and `-p`) |

    | `-v` | Prints filenames (verbose mode) |


    The following example shows some typical uses of the cpio command. The first cpio
    command uses the output of the ls command to generate a list of files to place
    in the file named “archive.” The second cpio command lists the contents of archive.
    The third cpio command extracts files from archive:


    ```

    ```text

    # ls

    file1  file2  file3  file4


    # ls | cpio -ov -o archive

    file1

    file2

    file3

    file4

    272 blocks


    # cpio -ivt -I archive

    -rw-r--r--   1 root     other          27 Apr  6 03:04 2001, file1

    -rw-r--r--   1 root     other         389 Apr  6 03:04 2001, file2

    -rw-r--r--   1 root     other       34341 Apr  6 03:04 2001, file3

    -rw-r--r--   1 root     other      103306 Apr  6 03:04 2001, file4

    272 blocks


    # cpio -ivum -I archive

    file1

    file2

    file3

    file4

    272 blocks

    #

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# # The find Command


    You can use the find() command to generate a list of files (that is, their names)
    under a particular directory or a list of filenames that meet specified criteria.
    The find command is especially useful when combined with the cpio command.


    At a minimum, one command-line argument is required: the directory name. By default,
    the directory and all files and directories under it are also listed. The find
    command provides a variety of command-line arguments. Table 9.10 lists some of
    the more useful ones.


    | Argument | Description |

    |---|---|

    | `-atime n` | List only files accessed `-n` (less than *n* days ago) or `+n`
    (more than *n* days ago). |

    | `-ctime n` | List only files whose status changed `-n` (less than *n* days ago)
    or `+n` (more than *n* days ago). |

    | `-exec cmd` | Execute `cmd` for each listed file. |

    | `-group grp` | List only files that belong to the group name of GID `grp`. |

    | `-mtime n` | List only files modified `-n` (less than *n* days ago) or `+n`
    (more than *n* days ago). |

    | `-name pattern` | List only files whose name matches *pattern*. |

    | `-newer file` | List only files that are newer than *file*. |

    | `-print` | Print the selected files (always true even if not specified). |

    | `-type c` | List only the specified type of file (block, character, directory,
    FIFO, link, plain, or socket). |

    | `-user usr` | List only files owned by user name or UID *usr*. |


    To make the find command even more powerful (and harder to figure out), these
    command-line arguments can be combined into complex expressions by using the and
    (-a) and or (-o) operators. For example, the expression -type p -a -user dla causes
    find to list only plain (ordinary) files owned by the user account dla.


    The following example uses the find command to generate a list of files. The first
    find command lists all files under the /export/home/sarah directory. This list
    of files is used to generate the sarah.cpio archive. The second cpio command lists
    the files under /etc that have been modified in the past two days. The same command
    is repeated and used as input for the cpio command to create the etc.cpio archive:'
  merge: -1
  img_proc: true
- pgno: 239
  md: '```

    ```sh

    # find /export/home/sarah | cpio -o -O sarah.cpio

    544 blocks


    # find /etc -mtime -2

    /etc/saf/zsmon/_pmpipe

    /etc/saf/_sapipe

    /etc/mnttab

    /etc/utmpipe


    # find /etc/ -mtime -2 | cpio -o -O etc.cpio

    16 blocks

    #

    ```

    ```


    # Recovering the root or /usr File System


    Occasionally, the root or /usr file system needs to be recovered. Assuming that
    the file system has been backed up and that the backup is available, you can use
    the following procedure:


    +   1. Select an available partition or, if additional hardware is required, install
    the new disk in the system and then format and create an appropriately sized partition.

    +   2. Create a file system by using the **newfs** command or another command
    (such as the **mkfs** command).

    +   3. Mount the new file system on a temporary mount point. Change the directory
    to the temporary mount point.

    +   4. Use the **ufsrestore** command to restore the root or /usr backup to the
    new file system.

    +   5. Remove the restoresymtable file created by the **ufsrestore** command.

    +   6. Unmount the new file system.

    +   7. Use the **fsck** command to check the new file system. Modify `/etc/vfstab`
    to identify the new root or /usr partition.

    +   8. If you’re recovering the root file system, use the **installboot**(1M)
    command to create a boot block on the new file system.

    +   9. Reboot the system.'
  merge: -1
  img_proc: true
