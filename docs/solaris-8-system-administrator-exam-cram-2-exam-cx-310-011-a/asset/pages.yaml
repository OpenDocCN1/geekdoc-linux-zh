    \ file is copied to the .profile file in the user’s home directory. The following\
    \ example shows the default contents of the /etc/skel/local.profile file:\n\n\
    ```\nstty istrip\nPATH=/usr/bin:/usr/ucb:/etc:.\nexport PATH\n#\n# If possible,\
    \ start the windows system\n#\n```"
