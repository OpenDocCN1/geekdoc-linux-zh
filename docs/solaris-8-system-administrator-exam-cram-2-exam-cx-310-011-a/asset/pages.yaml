    A single file can be renamed in the current directory or moved to another directory
    and renamed at the same time. In the following example, the first **mv** command
    renames the 310-011 file. The second command moves it to another directory (the
    parent or **..** directory). The third command moves the 310-012 file to the parent
    directory and renames it at the same time:


    ```

    ```text

    # ls

    310-011  310-012


    # mv 310-011 part1


    # mv part1 ..


    # mv 310-012 ../part2

    #

    ```

    ```


    # Deleting Files by Using the rm Command


    The **rm(1)** command deletes one or more files specified as command-line arguments.
    The files to be deleted can be complete filenames, multiple files selected with
    metacharacters, or any combination. Multiple filenames must be separated by spaces.
    The **-i** command-line argument provides interactive control over the remove
    command. Normally, if the **rm** command encounters a write-protected file, it
    prompts to confirm the file’s removal. However, if you specify the **-f** command-line
    argument, write-protected files are removed with confirmation. The **-f** command-line
    argument cannot be specified with the **-i** command-line argument, as shown in
    this example:


    ```

    ```text

    # ls

    file1  file2  xfile


    # rm xfile file*


    # ls

    #

    ```

    ```


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_255_0.png)


    File and directory names beginning with a dot character, such as .profile, are
    not included in multiple file/directory specifications using metacharacters. For
    example, **profile** does not include .profile. A file beginning with a dot must
    be specified separately by using a preceding dot, as in **.*.**'
