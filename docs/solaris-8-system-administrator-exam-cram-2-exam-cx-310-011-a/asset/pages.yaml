    \ d incorrect.\n\n# Question 7\n\n+   Which of the following describes the format\
    \ of the RBAC User Attributes Database file?\n+   \n+   - (○) a. `name:qualifier:res1:res2:attributes`\n\
    +   - (○) b. `name:res1:res2:description:attributes`\n+   - (○) c. `name:res1:res2:short\
    \ description:long description:attributes`\n+   - (○) d. `name:policy:type:res1:res2:ID:attributes`\n\
    \nAnswer a is correct. The RBAC User Attributes Database file uses the format\
    \ `name:qualifier:res1:res2:attributes`. `name:res1:res2:description:attributes`\
    \ is the format of the Profile Attributes Database file. Therefore, answer b is\
    \ incorrect. `name:res1:res2:short description:long description:attributes` is\
    \ the format of the Authorization Attributes Database file. Therefore, answer\
    \ c is incorrect. `name:policy:type:res1:res2:ID:attributes` is the format of\
