  md: '| Table 5.4 Absolute File Permission Modes |  |

    |---|---|

    | **Absolute Mode** | **Description** |

    | 001 | Other execution |

    | 002 | Other write |

    | 004 | Other read |

    | 010 | Group execution |

    | 020 | Group write |

    | 040 | Group read |

    | 100 | User execution |

    | 200 | User write |

    | 400 | User read |


    A file’s access mode is determined by adding these absolute modes (user permissions
    + group permissions + other permissions). For example, a file that has user read
    (400) and user write (200) permissions but no other permissions for group or other
    has an access mode of 400 + 200, or 600. Adding group read (040) and group write
    (020) to this file results in an access mode of 600 + 060, or 660. Adding other
    read (004) and other write (002) results in 666. Adding user execution (100) results
    in a file access mode of 766.


    The other type of notation is symbolic mode. Using this mode, read access is represented
    by the letter r, write by the letter w, and execution by the letter x. The letters
    u, g, and o represent user, group, and other permissions, respectively. Symbolic
    mode supports adding permissions (+), removing permissions (-), and setting only
    the specified permissions (=).


    Using u+x adds execution permission to user, g-w removes write permission from
    group, and o=r sets only read access to other (that is, it removes any other permissions).


    The ls(1) command uses something similar to symbolic mode to represent file access
    modes. The following example shows the output of an ls command:


