- pgno: 338
  md: "# # Practice Questions\n\n# ## Question 1\n\n+   Which of the following commands\
    \ is used to determine when a particular login account was last used?\n+   \n\
    +   - ○ a. **logins**\n+   - ○ b. **last**\n+   - ○ c. **whodo**\n+   - ○ d. **ps**\n\
    \nAnswer b is correct. The **logins** command displays attributes about login\
    \ accounts, not the usage of the login accounts. Therefore, answer a is incorrect.\
    \ The **whodo** and **ps** commands list information about processes. Therefore,\
    \ answers c and d are incorrect.\n\n# ## Question 2\n\n+   The /etc/syslog.conf\
    \ file was modified to capture messages from a particular user application, but\
    \ the log file still does not contain any of those messages. Which of the following\
    \ reasons could explain this situation? (Select all that apply.)\n+   \n+   -\
    \ □ a. A typographical error exists in the /etc/syslog.conf entry that was added.\n\
    +   - □ b. The **syslogd** program was not restarted.\n+   - □ c. The user application\
    \ does not generate the expected facility and/or severity of messages.\n+   -\
    \ □ d. The **syslogd** program is not running.\n+   - □ e. The wrong log is being\
    \ examined.\n\nAnswers a, b, c, d, and e are correct. They are all reasons the\
    \ syslog facility would not work as expected. Entries with typographical errors\
    \ are ignored or cause other entries to be misinterpreted. The **syslogd** command\
    \ reads the /etc/syslog.conf file only when it is started or when it receives\
    \ the **SIGHUP** signal. The /etc/syslog.conf entry must match the expected facility/severity\
    \ the user application is using to submit the messages. If the **syslogd** command\
    \ is not running, it cannot receive and handle messages. Be certain that the messages\
    \ are being sent to the intended log file."
  merge: -1
  img_proc: true
- pgno: 339
  md: "# ## Question 3\n\nIdentify the name of the command that combines the **who**\
    \ command with the **ps** command.\n\nThe correct answer is **whodo**.\n\n# ##\
    \ Question 4\n\n+   Which of the following are source facilities for syslog messages?\
    \ (Select all that apply.)\n+   \n+   - [ ] a. **login**\n+   - [ ] b. **news**\n\
    +   - [ ] c. **local8**\n+   - [ ] d. **kern**\n\nAnswers **b** and **d** are\
    \ correct. **news** and **kern** are source facilities for syslog messages. **auth**\
    \ (not **login**) is the source facility associated with logging onto the system.\
    \ Therefore, answer **a** is incorrect. The eight locally defined source facilities\
    \ are **local0** through **local7**. Therefore, answer **c** is incorrect.\n\n\
    # ## Question 5\n\n+   Which of the following are valid command-line arguments\
    \ for the **logger** command? (Select all that apply.)\n+   \n+   - [ ] a. **-p**\
    \ (specifies a priority)\n+   - [ ] b. **-l** (sends the message to the **loghost**\
    \ system instead)\n+   - [ ] c. **-t** (specifies a tag that is included with\
    \ the message)\n+   - [ ] d. **-L** (specifies the log file that should be used)\n\
    \nAnswers **a** and **c** are correct. The **-p** and **-t** command-line arguments\
    \ are valid for the **logger** command. The **-l** and **-L** command-line arguments\
    \ do not exist. Therefore, answers **b** and **d** are incorrect. Processing messages\
    \ locally or sending them to **loghost** and log files is specified by entries\
    \ in the /etc/syslog.conf file.\n\n![](img/b957f979417d9f16274c2eb52c8f2c9f_339_0.png)"
