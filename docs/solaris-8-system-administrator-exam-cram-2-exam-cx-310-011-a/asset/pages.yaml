- pgno: 29
  md: '# # Self-Assessment


    I’ve included a Self-Assessment in this *Exam Cram* to help you evaluate your
    readiness to tackle Sun Certified System Administrator for Solaris 8 certification.
    It should also help you understand what you need to master the topic of this book—namely,
    Exam CX-310-011, “Sun Certified System Administrator for Solaris 8 Operating Environment,
    Part 1,” and Exam CX-310-012, “Sun Certified System Administrator for Solaris
    8 Operating Environment, Part 2.” Before you tackle this Self-Assessment, however,
    I’ll talk about the concerns you might face when pursuing a Solaris 8 System Administrator
    certification and what an ideal candidate might look like.


    # ## Solaris 8 System Administrators in the Real World


    In the next section, I describe an ideal Solaris 8 System Administrator candidate,
    knowing full well that only a few actual candidates meet this ideal. In fact,
    my description of that ideal candidate might seem downright scary. But take heart;
    although the requirements to obtain a Solaris 8 System Administrator certification
    may seem formidable, they are by no means impossible to meet. However, you should
    be keenly aware that it does take time, requires some expense, and calls for a
    substantial effort.


    You can get all the real-world motivation you need from knowing that many others
    have gone before you. You can follow in their footsteps. If you’re willing to
    tackle the process seriously and do what it takes to gain the necessary experience
    and knowledge, you can take—and pass—the certification tests. In fact, the *Exam
    Cram* and the companion *Exam Prep* are designed to make it as easy as possible
    for you to prepare for these exams, but prepare you must!'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'The same, of course, is true for other Solaris certifications, including:


    +   - Solaris 8 Network Administrator, which concentrates on the networking aspects
    but requires only one exam. The Solaris 8 System Administrator certification is
    a prerequisite.

    +   - Solaris 7 System Administrator, which is similar to the Solaris 8, but addresses
    the previous version of Solaris and requires two exams.

    +   - Solaris 7 Network Administrator, which concentrates on the networking aspects
    of the Solaris 7 environment and requires only one exam.


    # The Ideal Solaris 8 System Administrator Candidate


    Just to give you some idea of what an ideal Solaris 8 System Administrator candidate
    is like, here are some relevant statistics about the background and experience
    such an individual might have. Don’t worry if you don’t meet these qualifications
    (or, indeed, if you don’t even come close) because this world is far from ideal,
    and where you fall short is simply where you’ll have more work to do. The ideal
    candidate will have the following:


    +   - Academic or professional training in Unix operating systems and, more specifically,
    the AT&T System V Release 4 (SVR4) Unix operating system on which Solaris is based.

    +   - Three-plus years of professional system administration experience, including
    experience installing and upgrading operating systems, performance tuning, troubleshooting
    problems, creating users, and managing backup and recovery scenarios.


    I believe that well under half of all certification candidates meet these requirements.
    In fact, most probably meet less than half of these requirements (that is, at
    least when they begin the certification process). However, because all those who
    have their certifications already survived this ordeal, you can survive it, too—especially
    if you heed what this Self-Assessment can tell you about what you already know
    and what you need to learn.


    # Put Yourself to the Test


    The following series of questions and observations is designed to help you figure
    out how much work you’ll face in pursuing Solaris certification and what kinds
    of resources you can consult on your quest. Be absolutely honest'
  merge: -1
  img_proc: true
- pgno: 31
