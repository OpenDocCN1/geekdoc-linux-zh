  md: 'same time by following the user account name or UID with a colon and a group
    account name or GID. The following example uses the **chown** command to change
    both user account ownership and group account ownership:


    ```

    ```text

    # ls -l

    total 18

    -rw-rw-rw-  1 guest    other       120 Feb 28 07:38 data

    -rw-rw-rw-  1 guest    other      6528 Feb 28 07:38 junk

    -rw-r--r--  1 guest    other       636 Feb 28 07:39 list

