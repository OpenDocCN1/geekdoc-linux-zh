- pgno: 365
  md: "# # Practice Questions\n\n# ## Question 1\n\nMatch each pseudo file system\
    \ with its use.\n\n| Option | Pseudo file system | Use |\n|---|---|---|\n| a.\
    \ | CacheFS | 1. Temporary files |\n| b. | PROCFS | 2. Alternative pathnames |\n\
    | c. | TMPFS | 3. Process information |\n| d. | LOFS | 4. Local caching of data\
    \ |\n\nAnswers a-4, b-3, c-1, and d-2 are correct. CacheFS is used for local caching\
    \ of data from remote file systems. PROCFS provides status and other information\
    \ for active processes. TMPFS provides a storage area for fast access to temporary\
    \ files. LOFS provides access to existing data using alternative pathnames.\n\n\
    # ## Question 2\n\n+   Which swap command-line argument adds a swap file to the\
    \ system swap space?\n+   \n+   - a. `-a`\n+   - b. `-d`\n+   - c. `-l`\n+   -\
    \ d. `-s`\n\nAnswer a is correct. The swap command’s -a command-line argument\
    \ adds a swap file to the system swap space. -d deletes a swap file from the system\
    \ swap space. Therefore, answer b is incorrect. -l lists the swap space partition\
    \ and any swap files. Therefore, answer c is incorrect. -s lists statistics about\
    \ swap space use. Therefore, answer d is incorrect."
  merge: -1
  img_proc: true
- pgno: 366
  md: "# ## Question 3\n\n+   The /tmp directory is one of two TMPFS instances typically\
    \ found on a Solaris 8 system. Which of the following is the other?\n+   \n+ \
    \  - a. /etc/run\n+   - b. /var/run\n+   - c. /etc\n+   - d. /var/tmp\n+   - e.\
    \ / (root)\n\nAnswer b is correct. /var/run is the other TMPFS instance typically\
    \ found on a Solaris 8 system. /etc/run and /var/tmp do not exist. Therefore,\
    \ answers a and d are incorrect. /etc and / (root) cannot be correct because files\
    \ stored in a TMPFS instance would be lost when the system was rebooted. If /etc\
    \ or root was a TMPFS instance, the system could not boot after being shut down.\n\
    \n# ## Question 4\n\n+   Which of the following commands are proc tools? (Select\
    \ all that apply.)\n+   \n+   - a. **pstop**\n+   - b. **pfiles**\n+   - c. **pstart**\n\
    +   - d. **pwdx**\n+   - e. **psig**\n+   - f. **pmem**\n\nAnswers a, b, d, and\
    \ e are correct. The **pstop** command stops the specified process(es). The **pfiles**\
    \ command lists the file(s) opened by the specified process(es). The **pwdx**\
    \ command displays the current working directory of the specified process(es).\
    \ The **psig** command lists pending signals associated with the specified process(es).\
    \ The **prun** command, not the **pstart** command, restarts the specified process(es).\
    \ Therefore, answer c is incorrect. The **pmap** command, not the **pmem** command,\
    \ displays memory usage of the specified process(es). Therefore, answer f is incorrect."
  merge: -1
  img_proc: true
- pgno: 367
  md: "# Question 5\n\n+   Which of the following is the correct syntax for the **mkfile**\
    \ command?\n+   \n+   - a. `mkfile -s 32m /swapfile`\n+   - b. `mkfile 32 M swapfile`\n\
    +   - c. `mkfile 32m /swapfile`\n+   - d. `mkfile 32m -f /swapfile`\n\nAnswer\
    \ c is correct. The correct syntax for the **mkfile** command is **mkfile 32m\
    \ /swapfile**. The mkfile command does not use command-line arguments, such as\
    \ -s or -f. Therefore, answers a and d are incorrect. The size scale (m or M)\
    \ should not be separated from the size. Therefore, answer b is incorrect.\n\n\
    # Question 6\n\n+   Which of the following conditions might require additional\
