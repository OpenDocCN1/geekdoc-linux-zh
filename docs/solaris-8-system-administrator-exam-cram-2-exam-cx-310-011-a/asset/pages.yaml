- pgno: 78
  md: "# Before the Upgrade\n\nYou should complete a number of tasks before you upgrade\
    \ your system:\n\n+   1. Check the latest Solaris 8 Release Notes to determine\
    \ whether any Solaris 8 changes or enhancements affect the current operation.\
    \ This information includes software no longer provided with Solaris or patches\
    \ you need to install.\n+   \n+   2. Verify that the hardware is supported as\
    \ described in the preparation phase of the Web Start installation.\n+   \n+ \
    \  3. Install Solaris by using a CD-ROM or via the network. Depending on the method,\
    \ verify the proper operation of the CD-ROM drive or network connectivity.\n+\
    \   \n+   4. Some Sun applications, such as DiskSuite, cannot be upgraded automatically.\
    \ Manual configuration changes are required before the software can be used. Check\
    \ the documentation provided with the applications.\n+   \n+   5. If any third-party\
    \ software is installed on the system, check with the software manufacturer to\
    \ verify that the software will run on Solaris 8. You might need to purchase new\
    \ versions of third-party software.\n+   \n+   6. Back up the existing system.\
    \ If the upgrade fails, you might need to restore the existing system until the\
    \ reasons for failure can be determined and resolved.\n+   \n+   7. Collect any\
    \ configuration information you might be prompted for during the upgrade, such\
    \ as hostname, network interface, IP address, subnet mask, and domain name. You\
    \ can avoid having to respond to prompts during installation by preconfiguring\
    \ system configuration information (as explained in the “Preconfiguring System\
    \ Configuration Information” section later in this chapter).\n+   \n+   8. Set\
    \ up a backup medium for possible use during the upgrade. If disk space needs\
    \ to be reallocated, you need to copy file systems to a backup medium and then\
    \ reload them after the space on the system disks has been adjusted. Local devices,\
    \ such as unused system disks, tape, or floppy disks, as well as remote file systems\
    \ can be used for the backup medium.\n+   \n+   9. If you’re using the Solaris\
    \ 8 distribution CD, insert it in the system’s CD-ROM drive. For x86 platforms\
    \ that cannot be booted from the"
  merge: -1
  img_proc: true
- pgno: 79
  md: "CD-ROM drive, insert the Device Configuration Assistant floppy disk into the\
    \ A: drive. If you’re installing over the network, set up an install server and\
    \ possibly a boot server.\n\n+   10. Reboot the system.\n\n# During the Upgrade\n\
    \nIf the current layout of the system disks does not provide enough space for\
    \ the upgrade, SunInstall uses the auto-layout feature to reallocate disk space\
    \ as required. If the auto-layout fails or you want to use a different layout,\
    \ you must manually specify the disk layout.\n\nIf the system configuration information\
    \ was not preconfigured, you need to supply the correct information when prompted.\n\
    \n# After the Upgrade\n\nMerging the existing system configuration with the Solaris\
    \ 8 operating system might not be completely successful, and you may need to do\
    \ some manual cleanup. Check the /a/var/sadm/system/data/upgrade_clean file to\
    \ determine any configuration problems that need to be reviewed and possibly modified\
    \ before the system can be rebooted.\n\nAfter resolving any cleanup issues, reboot\
    \ the system.\n\n# Preconfiguring System Configuration\nInformation\n\nYou can\
    \ preconfigure the system configuration information required for installation\
    \ in two ways:\n\n+   ➤ **Name service method**—This method adds the system information\
    \ to an available name service (NIS or NIS+). During installation, the information\
    \ is retrieved from the name service and used to configure the system. This is\
    \ the recommended method for SPARC installations.\n+   \n+   ➤ **Sysidcfg file\
    \ method**—This method creates a file named sysidcfg that contains the configuration\
    \ information. The file must conform to a defined format (keywords and syntax).\
    \ The file must be available on a local drive, and the local floppy disk drive\
    \ on the remote drive must be accessible via the network."
