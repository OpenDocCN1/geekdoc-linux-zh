  md: '![](img/b957f979417d9f16274c2eb52c8f2c9f_401_0.png)


    The default name for the initial direct map is auto_home.


    # Running the automount Command


    When changes are made to the AutoFS maps, you might need to execute the **automount**
    command manually. Any changes to the /etc/auto_master file require that the **automount**
    command be executed to put the changes into effect. The command must also be executed
    when an addition or a deletion is made to a direct map.


    # The Cache File System Service


    The Cache File System (CacheFS) is a client-side service that provides the capability
    to cache a remotely accessed NFS resource locally on the NFS client. Doing so
    not only speeds up client access to the data, but also decreases network traffic
    and load on the NFS server.


    After you create a cache, a remote NFS resource can be mounted “in” the cache.
    The first time the NFS resource is accessed, data is copied from the remote NFS
    server into the local cache. Subsequent accesses are from the local cache instead
    of the remote NFS server. Like other types of file systems, the remote NFS resource
    can be mounted manually by using the **mount** command, at system boot, by adding
    it to the /etc/vfstab file, or as needed by using the AutoFS mechanism (described
    in the section “The Auto File System Service” earlier in this chapter).


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_401_1.png)


    > The root (/) and /usr file systems cannot be cached by using the CacheFS mechanism.
    However, these two file systems can be cached by using the AutoClient configuration,
    which is briefly described in Chapter 13, “The Solaris Network Environment.”


    # Configuring a Cache


    The **cfsadmin**(1M) command is used to create, check, tune, and delete caches.
    The **cachefsstat**(1M) command can also be used to display cache statistics.


    You specify the **-c** command-line argument to create a cache, followed by the
    full pathname of a directory to be used for the cache. In addition, multiple'
  merge: -1
  img_proc: true
- pgno: 402
  md: "options (separated by commas) can be specified by using the **-o** command-line\
    \ argument. The following example uses the **cfsadmin** command to create a cache\
    \ under the /cache directory. The size of the largest file that can be cached\
    \ is set to 10MB:\n\n```\n```text\n# cfsadmin -c -o maxfilesize=10 /cache\n#\n\
    ```\n```\n\nTo list the file systems mounted in the cache and the cache status,\
    \ use the **-l** command-line argument. Additional command-line arguments include\
    \ **-s** to perform a consistency check, **-u** to update cache parameters, and\
    \ **-d** to delete a cache. All these command-line arguments should be followed\
    \ by the cache directory’s full pathname.\n\nMounting a remote NFS resource in\
    \ the cache using the **mount** command requires specifying the remote file system,\
    \ the local cache, and a local mount point.\n\nThe **-F** command-line argument\
    \ should be used to identify the file system type as CacheFS. In addition, at\
    \ least two cache-specific mount options need to be specified by using the **-o**\
    \ command-line argument: **backfstype**, which identifies the type of file system\
    \ being mounted (typically NFS), and **cachedir**, which identifies the cache\
    \ directory. The following listing uses the **mount** command to mount the /export/home\
    \ file system from the host **sparc20** on the /home mount point (referred to\
    \ as the *front file system*), using /cache as the cache directory. The line is\
    \ wrapped to improve readability:\n\n```\n```text\n# mount -F cachefs -o backfstype=nfs,cachedir=/cache\n\
    \  sparc20:/export/home /home\n#\n```\n```\n\n# Checking the Status of a Cache\n\
    \nTo display the status of a cached file system, use the **cfsadmin** command\
    \ and specify the **-l** command-line argument followed by the name of the cache.\
    \ The following information about the cache is displayed:\n\n+   - **maxblocks**—The\
    \ maximum amount of storage space the cache can use (expressed as a percentage\
    \ of blocks in the front file system).\n+   - **minblocks**—The minimum amount\
    \ of storage space the cache can use (expressed as a percentage of blocks in the\
    \ front file system).\n+   - **threshblocks**—The threshold at which additional\
    \ resources cannot be claimed after **minblocks** is reached (expressed as a percentage\
    \ of blocks in the front file system)."
  merge: -1
  img_proc: true
- pgno: 403
  md: "+   - **maxfiles**—The maximum number of files the cache can use (expressed\
    \ as a percentage of blocks in the front file system).\n+   - **minfiles**—The\
    \ minimum number of files the cache can use (expressed as a percentage of blocks\
    \ in the front file system).\n+   - **threshfiles**—The threshold at which additional\
    \ inodes cannot be claimed after minfiles is reached (expressed as a percentage\
    \ of inodes in the front file system).\n+   - **maxfilesize**—Size of the largest\
    \ file allowed in the cache.\n+   - **mount info**—The resource being mounted\
    \ and its local mount point. The slash (/) characters are displayed as underscore\
    \ (_) characters.\n\nThe maximum, minimum, and threshold parameters can be modified\
    \ by using the **cfsadmin -u** command. The following example uses the **cfsadmin\
    \ -l** command to display the cache status:\n\n```\n```text\n# cfsadmin -l /cache\n\
    cfsadmin: list cache FS information\n    maxblocks       90%\n    minblocks  \
    \      0%\n    threshblocks    85%\n    maxfiles        90%\n    minfiles    \
    \     0%\n    threshfiles     85%\n    maxfilesize      3MB\n# sparcio:_export_home:_home\n\
    ```\n```\n\n# Displaying Cache Statistics\n\nTo display statistical information\
    \ about the performance of the cached file system, use the **cachestat(1M)** command\
    \ and specify the mount point of the cached file system. The following statistics\
    \ about the cached file are displayed:\n\n+   - **cache hit rate**—Percentage\
    \ of attempts to locate files or directories in the cached file system that were\
    \ successful, followed by a count of the actual hits and misses\n+   - **consistency\
    \ checks**—Number of consistency checks performed, followed by the count of passed\
    \ and failed checks\n+   - **modifies**—Number of modify operations\n+   - **garbage\
    \ collection**—Number of attempts to reclaim resources that are no longer used"
  merge: -1
  img_proc: true
- pgno: 404
  md: "The following example uses the **cachefsstat** command to display the cached\
    \ file system statistics:\n\n```\n```shell\n# cachefsstat /home\n\n    /home\n\
    \n              cache hit rate:    57% (8 hits, 6 misses)\n              consistency\
    \ check: 14 (14 pass, 0 fail)\n                      modifies:   0\n         \
    \      garbage collection: 0\n\n#\n```\n```\n\n![](img/b957f979417d9f16274c2eb52c8f2c9f_404_0.png)\n\
    \n> > Note that the **cfsadmin -l** command reports on the configuration status\
    \ (tunable parameters) of the cache, whereas the **cachefsstat** reports on the\
    \ contents of the cache (cached file system statistics).\n\n# Checking the Consistency\
    \ of a Cache\n\nTo be certain that information in a cache is up to date, periodic\
    \ consistency checks are performed automatically. These checks could increase\
    \ network activity, however. To reduce the amount of network traffic, you can\
    \ disable the automatic consistency checking and check the consistency manually\
    \ (on demand).\n\nTo disable automatic consistency checking (that is, to request\
    \ on-demand consistency checking), specify the **demandconst** option when the\
    \ file system is mounted. The line is wrapped to improve readability:\n\n```\n\
    ```shell\n# mount -F cachefs -o backfstype=nfs,cachedir=/cache,demandconst\nsparc20:/export/home\
    \ /home\n#\n```\n```\n\nTo perform a consistency check on demand, use **cfsadmin\
    \ -s** followed by a mount point of the cached file system as a command-line argument:\n\
    \n```\n```shell\n# cfsadmin -s /home\n#\n```\n```\n\n# Managing a Cache Log\n\n\
    The **cachefslog**(1M) command is used to set up, verify, and halt CacheFS logging.\
    \ The **cachefsswsize**(1M) command is used to analyze the log to determine a\
    \ recommended working set size for the cache. A cache that’s too small causes\
    \ access delays and higher network traffic (a low cache hit rate). A cache that’s\
    \ too large wastes file system space."
