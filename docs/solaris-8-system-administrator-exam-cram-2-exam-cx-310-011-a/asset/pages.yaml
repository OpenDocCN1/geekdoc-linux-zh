- pgno: 42
  md: '# Question 2


    Which of the following commands can be used to list all installed patches?

    (Select all that apply.)


    +   - [ ] a. `showrev -p`

    +   - [ ] b. `patchinfo`

    +   - [ ] c. `patchlist all`

    +   - [ ] d. `patchadd -p`


    Answers a and d are correct. Answers b and c do not exist.


    For this type of question, one or more answers must be selected to answer the
    question correctly. For Question 2, you would have to position the cursor over
    the check boxes next to items a and d and click on both to get credit for a correct
    answer.


    These two types of questions can appear in many forms and constitute the foundation
    on which most Solaris certification exam questions rest. More complex questions
    might include so-called exhibits, which are usually tables or data-content layouts
    of one form or another. You’ll be expected to use the information displayed in
    the exhibit to guide your answer to the question.


    Other questions involving exhibits might use charts or diagrams to help document
    a workplace scenario that you’ll be asked to troubleshoot or configure. Paying
    careful attention to exhibits is the key to success—be prepared to toggle between
    the picture and the question as you work. Often, both are complex enough that
    you might not be able to remember all of either one.


    The drag-and-drop questions are new to the Solaris exams. They provide a table
    consisting of two columns of data, such as technical terms and their definitions.
    All terms have to be positioned (using the mouse) in front of their respective
    definitions to be correct. To drag a term, position the mouse over the term and
    press the left mouse button. Then move the mouse to drag the term to the correct
    location. Release the mouse button to drop the term in front of its definition.


    The remaining questions are fill in the blank. This format involves entering the
    name of a command, filename, command-line argument, or Solaris-related terminology.
    A typical fill-in-the-blank question is shown in Question 3. This question provides
    a box in which to enter the answer.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Question 3


    Enter the full pathname to the file used to modify the configuration of the kernel.


    The correct answer is `/etc/system`.


    Be sure to read this type of question very carefully. Without having any answers
    in front of you, there is nothing to jog your memory and it makes guessing almost
    impossible. Because this question specifically asks for the full pathname, an
    answer such as *system*, which might be considered technically correct, will be
    marked as wrong. Try to be as specific as possible.


    # Using the Test Software Effectively


    A well-known test-taking principle is to read over the entire test from start
    to finish first, but to answer only those questions that you feel absolutely sure
    of on the first pass. On subsequent passes, you can dive into more complex questions,
    knowing how many such questions you have to deal with.


    Fortunately, the test software makes this approach easy to implement. At the bottom
    of each question, you’ll find a check box that permits you to mark that question
    for a later visit. (Note that marking questions makes review easier, but you can
    return to any question by clicking the Forward and Back buttons repeatedly until
    you get to the question.) As you read each question, if you answer only those
    you’re sure of and mark for review those that you’re not, you can keep going through
    a decreasing list of open questions as you knock the trickier ones off in order.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_43_0.png)


    > > There’s at least one potential benefit to reading the test over completely
    before answering the trickier questions: Sometimes, you find information in later
    questions that sheds more light on earlier ones. Other times, information you
    read in later questions might jog your memory about facts, figures, or behavior
    that can also help with earlier questions. Either way, you’ll come out ahead if
    you defer those questions about which you’re not absolutely sure of the answers.


    Keep working on the questions until you’re absolutely sure of all your answers
    or until you know you’ll run out of time. If unanswered questions remain, you
    should zip through them and guess. No answer guarantees that no credit will be
    given for a question, and a guess has at least a chance of being correct. (Blank
    answers and incorrect answers are scored as equally wrong.)'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/b957f979417d9f16274c2eb52c8f2c9f_44_0.png)


    # Taking Testing Seriously


    The most important advice I can give you about taking any test is this: Read each
    question carefully. Some questions are deliberately ambiguous, some use double
    negatives, and others use terminology in incredibly precise ways. I’ve taken numerous
    practice tests and read, and in nearly every test I’ve missed at least one question
    because I didn’t read it closely or carefully enough.


    Here are some suggestions on how to deal with the tendency to jump to an answer
    too quickly:


    +   - Make sure you read every word in the question. If you find yourself jumping
    ahead impatiently, go back and start over.

    +   - As you read, try to restate the question in your own terms. If you can do
    this, you should be able to pick the correct answer(s) much more easily.

    +   - When returning to a question after your initial read-through, reread every
    word again—otherwise, your mind can fall quickly into a rut. Sometimes, seeing
    a question afresh after turning your attention elsewhere lets you see something
    you missed, but the strong tendency is to see what you’ve seen before. Try to
    avoid that tendency at all costs.

    +   - If you return to a question more than twice, try to articulate to yourself
    what you don’t understand about the question, why the answers don’t appear to
    make sense, or what appears to be missing. If you chew on the subject for a while,
    your subconscious might provide the details that are lacking or you might notice
    a “trick” that points to the right answer.


    Above all, try to deal with each question by thinking through what you know about
    being a Solaris system administrator—commands, characteristics, behaviors, facts,
    and figures involved. By reviewing what you know (and what you’ve written down
    on your information sheet), you can often recall or understand things sufficiently
    to determine the answer to the question.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Question-Handling Strategies


    Based on the tests I’ve taken, a couple of interesting trends in the answers have
    become apparent. For those questions that take only a single answer, usually two
    or three of the answers are obviously incorrect, and two of the answers are plausible.
    Of course, only one can be correct. Unless the answer leaps out at you (and if
    it does, reread the question to look for a trick; sometimes they are the ones
    you’re most likely to get wrong), begin the process of answering by eliminating
    answers that are obviously wrong.


    Things to look for in the “obviously wrong” category include spurious command
    choices or filenames, nonexistent software or command options, and terminology
    you’ve never seen before. If you’ve done your homework for a test, no valid information
    should be completely new to you. In that case, unfamiliar or bizarre terminology
    probably indicates a totally bogus answer. As long as you’re sure what’s right,
    it’s easy to eliminate what’s wrong.


    Numerous questions assume that the default behavior of a particular Solaris command
    is in effect. It’s essential to know and understand the default settings for the
    various commands. If you know the defaults and understand what they mean, this
    knowledge will help you cut through many Gordian knots.


    Likewise, when dealing with questions requiring multiple answers, you must know
    and select all the correct options to get credit. This, too, qualifies as an example
    of why careful reading is so important.


    As you work your way through the test, another counter the exam provides will
    come in handy: the number of questions completed and questions outstanding. Budget
    your time by making sure you’ve completed one fourth of the questions one quarter
    of the way through the test period. Check again three quarters of the way through.
    For Exam CX-310-011 with 57 questions and Exam CX-310-012 with 61 questions, that’s
    about 20 questions after 30 minutes and 40 questions after 60 minutes (30 minutes
    remaining).


    If you’re not through after 80 minutes, use the last 10 minutes to guess your
    way through the remaining questions. Remember, guesses are potentially more valuable
    than blank answers because blanks are always wrong, but a guess might turn out
    to be right. If you haven’t a clue about any of the remaining questions, pick
    answers at random or choose all as, bs, and so on. The important thing is to submit
    a test for scoring that has an answer for every question.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# # Mastering the Inner Game


    In the final analysis, knowledge breeds confidence, and confidence breeds success.
    If you study the materials in this book carefully and review all the questions
    at the end of each chapter, you should be aware of those areas requiring additional
    studying.


    Next, follow up by reading some or all of the materials recommended in the “Need
    to Know More?” section at the end of each chapter. The idea is to become familiar
    enough with the concepts and situations you find in the sample questions to be
    able to reason your way through similar situations on a real test. If you know
    the material, you have every right to be confident that you can pass the test.


    After you’ve worked your way through Part I, take the practice test in Chapter
    11. Likewise, after studying Part II, take the practice test in Chapter 22. The
    tests provide a reality check and help you identify areas that you need to study
    further. Make sure you follow up and review materials related to the questions
    you miss before scheduling the real tests. Only when you’ve covered all the ground
    and feel comfortable with the whole scope of the practice tests should you take
    the real tests.


    > > **TIP** If you take the practice test in Chapter 11 and don’t score at least
    66% correct or don’t score at least 70% on the practice test in Chapter 22, you’ll
    want to practice further.


    Armed with the information in this book and the determination to augment your
    knowledge, you should be able to pass the certification exam. If you don’t work
    at it, however, you’ll spend the test fee more than once before you finally do
    pass. If you prepare seriously, the exam should go flawlessly. Good luck!


    # ## Additional Resources


    By far, the best source of information about Solaris certification exams comes
    from Sun itself. Because its products and technologies—and the tests that go with
    them—change frequently, the best place to go for exam-related information is online.


    If you haven’t already visited the Solaris certification pages, do so right now.
    As I’m writing this chapter, the certification home page resides at **http://suned.sun.com/SUN/certification/solaris/sysadmin.html**.'
  merge: -1
  img_proc: true
