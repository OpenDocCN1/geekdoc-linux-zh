    # # Patch Administration


    *A patch* is a collection of files intended to update or fix problems with installed
    software. For example, a patch might be required to fix a problem with a system
    command or address a security issue. Because most system and application software
    are installed as packages, patches are applied against one or more packages. Actually,
    patches are special packages used to update other packages. Like packages, a collection
    of patches can be grouped together into a *patch cluster*.


    The ability to obtain and install patches, keep track of installed patches, and
    occasionally remove patches are key skills of a competent system administrator.


    # # Obtaining Patches and Patch Information


    You can obtain patches from Sun Microsystems in several ways. The two most common
    methods are purchasing a service contract from Sun or downloading the patches
    yourself from Sun’s Web or FTP site.


    Sun Service customers have access to an online patch database and an extended
    set of patches. The patches can be downloaded from Sun’s Web site or FTP site.
    In addition, Sun Service customers receive a CD-ROM of patches every six to eight
    weeks.


    Everyone else can obtain recommended and security patches for supported systems
    on the Web at **http://sunsolve.sun.com** or through anonymous FTP from **ftp://sunsolve1.sun.com/pubs/patches**.
    Another site for Solaris patches is **http://www.ibiblio.org/pub/sun-info/sun-patches**.'
  merge: -1
  img_proc: true
- pgno: 88
  md: "> > **TIP**  \n> > Sun offers a bimonthly report that summarizes recommended\
    \ and security patches for each supported system. Like the patches, the information\
    \ is available at http://sunsolve.sun.com along with other system support information.\n\
    \nPatches are identified with an eight-digit number. The first six digits identify\
    \ the base patch, and the last two digits identify the revision. For example,\
    \ patch number 110906-01 is the update for the x86 version of the Solaris 8 `find(1)`\
    \ command.\n\n# Installing a Patch\n\nYou install patches by using the **patchadd**\
    \ command. The appropriate type of system configuration must be specified by using\
    \ a **patchadd** command-line argument. You might also need to specify a target\
    \ directory. In addition, you can use a single **patchadd** command to install\
    \ more than one patch.\n\nRegardless of the type of system configuration being\
    \ patched, the **patchadd** command is typically executed locally on the system\
    \ where the software being patched resides (the *target directory*). However,\
    \ you can install patches remotely over the network if the target directory can\
    \ be accessed through Network File System (NFS) services.\n\nIf the patch is on\
    \ a CD-ROM, you can install it directly from the CD-ROM. A patch downloaded from\
    \ the Sun Web or FTP site must reside on a system hard disk. The area where patches\
    \ are stored before they are installed is referred to as the *spool directory*.\n\
    \n> > **TIP**  \n> > Although patches have no required spool directory, the most\
    \ commonly used location is the `/var/spool/patch` directory. However, you can\
    \ use any location on the system that has adequate free space.\n\nIf a patch was\
    \ obtained via download, chances are good that it is *zipped* (compressed) to\
    \ make it easier and quicker to download. Some patches (mainly for SPARC platforms)\
    \ are compressed with the **gzip(1)** command and have filenames ending with the\
    \ `.gz` suffix. Others are compressed with the **zip(1)** command and have filenames\
    \ ending with the `.zip` suffix. The **zip** command is used for both SPARC and\
    \ Intel x86 platforms. To uncompress or *unzip* the x86 find patch (110906-01),\
    \ which is located in the current directory, use the **unzip(1)** command as shown\
    \ in the following example:"
  merge: -1
  img_proc: true
