    The correct answer is `/etc/path_to_inst`.\n\n# Question 5\n\nWhat command can\
    \ be used to display both the physical device name and the (partial) logical device\
    \ name of disks?\n\nThe correct answer is **format**.\n\n# Question 6\n\n+   Devices\
    \ can be addressed by using physical device names. Under which directory are they\
    \ listed?\n+   \n+   - a. `/dev`\n+   - b. `/etc`\n+   - c. `/devices`\n+   -\
