    A PCI device can be disconnected (**cfgadm -c disconnect _AP_Id_), connected (**cfgadm
    -c connect _AP_Id_), configured (**cfgadm -c configure _AP_Id_), or unconfigured
    (**cfgadm -c unconfigure _AP_Id_) as needed. In addition, you can use the **cfgadm
    -t _AP_Id_** command to perform diagnostic tests on an attachment point.


    # Partitioning Disks


    The Solaris 8 operating system requires that disk drives support a logical structure
    to use its storage space. The logical structure consists of a small *disk label*,
    also called a *volume table of contents (VTOC)*, with the remainder of the disk
    being divided into *slices* or *partitions*. After a partition is defined, a file
    system can be created within the partition. The physical and logical device name
    associated with a file system is actually the name of the partition in which it
    resides.


    # The Disk Label, or VTOC


    The disk label, or VTOC, contains various geometry data about the disk, such as
    sectors per track, tracks per cylinder, available cylinders, and so on. In addition,
    the disk label contains the *partition table*.


    # Partitions


    A partition, or disk slice, is a contiguous collection of disk sectors as defined
    by the partition table. After a partition is defined in the partition table, a
    file system can be created within the partition. The partition table contains
    an entry for each partition on the disk. Table 8.2 describes the fields of the
    partition table.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '**Table 8.2 Fields of the Partition Table**


    | Field | Description |

    |---|---|

    | Partition Name | A single hexadecimal character used as a name for the partition
    (0 through f). |

    | Tag | The intended use of the partition (obsolete; see Table 8.3). |

    | Flags | 1 if the partition is not mountable; 10 if the partition is read-only
    (obsolete). |

    | First Sector | The number of the first sector in the partition. |

    | Sector Count | The number of sectors in the partition. |

    | Last Sector | The number of the last sector assigned to the partition. |

    | Mount Directory | The directory where the partition (actually file system) was
    last mounted. |


    When you define partitions, you can assign them a hexadecimal tag that identifies
    the partition’s intended use. These partition tags can be used during system maintenance
    to quickly identify and select partitions. The tags, listed in Table 8.3, are
    stored in the tag field of the partition table.


    **Table 8.3 Partition Tags**


    | Partition Type | Tag Value |

    |---|---:|

    | unassigned | 0 |

    | boot | 1 |

    | root | 2 |

    | swap | 3 |

    | usr | 4 |

    | backup | 5 |

    | stand | 6 |

    | var | 7 |

    | home | 8 |

    | altsctr | 9 |

    | cache | a |


    You can create the partition table by using the **format** command or the **fmthard**(1M)
    command. To display it, use the **format** command or the **prtvtoc**(1M) command.


    After the partition table has been populated with the appropriate information
    (the disk partitions have been defined), you can create file systems'
