  md: "# # Practice Questions\n\n# ## Question 1\n\n+   Where are the user account\
    \ initialization file templates stored?\n+   \n+   - ○ a. Under the user account\
    \ home directories\n+   - ○ b. In the /etc/skel directory\n+   - ○ c. In the /usr/skel\
    \ directory\n+   - ○ d. In the /skel directory\n\nAnswer b is correct. The user\
    \ account initialization file templates are stored in the /etc/skel directory.\
    \ The user’s copies of the templates (not the templates themselves) are stored\
    \ under the home directories. Therefore, answer a is incorrect. The /usr/skel\
    \ and /skel directories do not exist. Therefore, answers c and d are incorrect.\n\
    \n# ## Question 2\n\n+   Which of the following are valid settings for the **admintool**\
    \ command's Password field? (Select all that apply.)\n+   \n+   - ☐ a. Normal\
    \ Password\n+   - ☐ b. Account Is Locked\n+   - ☐ c. Cleared Until First Login\n\
    +   - ☐ d. No Password—Setuid Only\n+   - ☐ e. One-Time Password\n\nAnswers a,\
    \ b, c, and d are correct. Normal Password, Account Is Locked, Cleared Until First\
    \ Login, and No Password—Setuid Only are valid settings for the **admintool**\
    \ command’s Password field. Solaris 8 does not provide a one-time password capability.\
    \ Therefore, answer e is incorrect.\n\n# ## Question 3\n\nEnter the command for\
    \ adding a user-defined Bourne shell variable to the user environment so that\
    \ other programs can use the variable.\n\nThe correct answer is **export**."
  merge: -1
  img_proc: true
- pgno: 173
  md: "# Question 4\n\n+   Which of the following command-line arguments can be specified\
    \ when using the **useradd** or **usermod** command? (Select all that apply.)\n\
    +   \n+   ☐ a. `-u uid`\n+   ☐ b. `-g gid`\n+   ☐ c. `-d home_directory`\n+  \
    \ ☐ d. `-l account`\n\nAnswers a, b, and c are correct. The UID, GID, and home\
    \ directory can be defined by using the specified **useradd** command-line arguments\
    \ and modified by using the same **usermod** command-line arguments. The **-l**\
    \ command-line argument is used only with the **usermod** command to specify a\
    \ new account name. The account name for the **useradd** command does not use\
    \ the **-l** command-line argument. Therefore, answer d is incorrect.\n\n# Question\
    \ 5\n\n+   Which command can be used to change the members (that is, the user\
    \ accounts) assigned to an existing group?\n+   \n+   ○ a. **usermod**\n+   ○\
    \ b. **groupmod**\n+   ○ c. **groupadd**\n+   ○ d. **groupmem**\n\nAnswer a is\
    \ correct. The **usermod** command is used once for each user account to be added\
    \ or deleted from a group. The **groupmod** command and the **groupadd** command\
    \ do not affect group membership. Therefore, answers b and c are incorrect. The\
    \ **groupmem** command does not exist. Therefore, answer d is incorrect.\n\n#\
    \ Question 6\n\nEnter the full pathname of the systemwide Bourne and Korn shells\
    \ profile.\n\nThe correct answer is `/etc/profile`."
  merge: -1
  img_proc: true
- pgno: 174
  md: "# Question 7\n\n+   What does the **-P** command-line argument of the **useradd**\
    \ command specify?\n+   \n+   - a. Account password\n+   - b. Execution profile\n\
    +   - c. Initialization file (profile) template\n+   - d. Primary group\n\nAnswer\
    \ b is correct. The **-P** command-line argument of the **useradd** command specifies\
    \ the execution profile. A password cannot be specified by using the **useradd**\
    \ command; all accounts created with **useradd** are locked until a password is\
    \ defined with the **passwd** or **admintool** command. Therefore, answer a is\
    \ incorrect. A template cannot be specified; however, a profile template directory\
    \ can be specified by using the **-k** command-line argument. Therefore, answer\
    \ c is incorrect. The primary group is specified by the **-g** command-line argument.\
    \ Therefore, answer d is incorrect.\n\n# Question 8\n\n+   What is the /var/adm/loginlog\
    \ file used to log?\n+   \n+   - a. Logins\n+   - b. Logouts\n+   - c. Failed\
    \ logins\n+   - d. Successful logins\n+   - e. All logins and logouts\n\nAnswer\
    \ c is correct. The /var/adm/loginlog file logs failed login attempts. The **last**\
    \ command is used to determine logins, logouts, and both logins and logouts. Therefore,\
    \ answers a, b, d, and e are incorrect. In addition, the **who** command can be\
    \ used to identify users currently logged in to the system."
  merge: -1
  img_proc: true
