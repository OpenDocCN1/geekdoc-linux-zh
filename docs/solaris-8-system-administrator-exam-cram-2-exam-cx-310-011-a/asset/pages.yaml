- pgno: 32
  md: '# ## Hands-On Experience


    Another important key to success on all the Solaris tests is hands-on experience.
    If I leave you with only one realization after taking this Self-Assessment, it
    should be that there’s no substitute for time spent installing, configuring, and
    using the various Solaris command and tools on which you’ll be tested repeatedly
    and in depth.


    +   5. Have you installed, configured, and worked with Solaris 8? (Yes or No)


    If yes, make sure you understand the basic concepts covered in Exam CX-310-011.


    If you haven’t worked with Solaris 8, you must obtain a copy of it for either
    SPARC or Intel x86 compatible platforms. Then learn about the installation and
    administration.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_32_0.png)


    Before you even think about taking any Solaris exam, make sure you’ve spent enough
    time with Solaris 8 to understand how it can be installed and configured, how
    to maintain such an installation, and how to troubleshoot software when things
    go wrong. This will help you in the exam—as well as in real life.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_32_1.png)


    # ## Testing Your Exam-Readiness


    Whether you attend a formal class on a specific topic to get ready for an exam
    or use written materials to study on your own, some preparation for the Solaris
    certification exam is essential. At $150 a try, pass or fail, you’ll want to do
    everything you can to pass on your first try. That’s where studying comes in.


    I have included in this book several practice exam questions for each chapter
    and a sample test, so if you don’t score well on the chapter questions, you can
    study more and then tackle the sample tests at the end of each part. If you'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'don’t earn a score of at least 66% on the Part I test and 70% on the Part II
    test, you’ll want to investigate the other practice test resources available via
    the Web. (Locate them by using your favorite search engine.)


    For any given subject, consider taking a class if you’ve tackled self-study materials,
    taken the test, and failed anyway. If you can afford the privilege, the opportunity
    to interact with an instructor and fellow students can make all the difference
    in the world. For information about Sun classes, visit the Certification Program
    page at **http://suned.sun.com**.


    If you can’t afford to take a class, visit the Certification Program page anyway
    because it also includes free sample questions. Even if you can’t afford to spend
    much at all, you should still invest in some low-cost practice exams from commercial
    vendors because they can help you assess your readiness to pass a test better
    than any other tool. Check with the **http://www.unix-cert.net** Web site for
    other available resources.


    +   6. Have you taken a practice exam on your chosen test subject? (Yes or No)


    If yes—and you scored 66% or better on Part I and 70% or better on Part II—you’re
    probably ready to tackle the real thing. If your score isn’t above that crucial
    threshold, keep at it until you break that barrier. If you answered no, obtain
    all the free and low-budget practice tests you can find (or afford) and get to
    work. Keep at it until you can comfortably break the passing threshold.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_33_0.png)


    # Assessing Your Readiness for Exams

    CX-310-011 and CX-310-012


    In addition to the general exam-readiness information in the previous section,
    other resources are available to help you prepare for the exams. Two Web sites
    come to mind: **http://www.solarisguide.com** and **http://www.solariscentral.org**.
    Also, the comp newsgroups **comp.unix.solaris** and **comp.sys.sun.admin** are
    available via news services or via **http://google.com**. The groups at **http://groups.google.com**
    are great places to ask questions about topics you are having trouble understanding
    and to get good answers, or simply to observe the questions others'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'ask (along with the answers, of course). The Sun Blueprints Programs at **http://www.sun.com/blueprints**
    provide in-depth articles on various Solaris topics.


    I’d also like to recommend that you check out one or more of these books as you
    prepare to take the exam:


    +   - Mulligan, John P. *Solaris 8 Essential Reference*. New Riders, 2001.

    +   - Sun Microsystems. The three-volume *System Administration Guide for Solaris
    8* (Sun Microsystems, 2000).


    One last note: I hope it makes sense to stress the importance of hands-on experience
    in the context of the exams. As you review the material for the exams, you’ll
    realize that hands-on experience with Solaris 8 commands, tools, and utilities
    is invaluable.


    # Onward, Through the Fog!


    After you’ve assessed your readiness, undertaken the right background studies,
    obtained the hands-on experience that will help you understand the products and
    technologies at work, and reviewed the many sources of information to help you
    prepare for a test, you’ll be ready to take a round of practice tests. When your
    scores come back positive enough to get you through the exam, you’re ready to
    go after the real thing. If you follow my assessment regimen, you’ll not only
    know what you need to study, but also know when you’re ready to make a test date
    at Prometric. Good luck!'
  merge: -1
  img_proc: true
