- pgno: 358
  md: 'This chapter covers the *Solaris Pseudo File Systems and Swap Space* test objectives.
    The first section describes the Solaris pseudo file systems and provides information
    on the more important pseudo file systems. The second section covers managing
    swap space.


    # Solaris Pseudo File Systems


    Solaris supports several types of memory-based file systems, referred to as *pseudo
    file systems*. Because they are memory based, these file systems provide faster
    access to data stored in them. However, they are not permanent. In addition, any
    directories or files in pseudo file systems are lost when the file system is unmounted
    or the system is rebooted/shut down. Table 16.1 describes the pseudo file systems
    supported by Solaris 8.


    **Table 16.1  Solaris 8 Pseudo File Systems**


    | Name | Abbreviation | Use |

    |---|---|---|

    | Cache File System | CacheFS | Local caching for slow (CD-ROM) or remote (NFS)
    file systems |

    | File Descriptors File System | FDFS | Opening file using file descriptors with
    explicit names |

    | First-In First-Out File System | FIFOS | Accessing data (named pipes) |

    | Loopback File System | LOFS | Providing alternative paths to existing data |

    | Name File System | NAMEFS | Dynamic mounting of file descriptors by STREAMS
    modules |

    | Process File System | PROCFS | Accessing process status and information |

    | Special Device File System | SPECFS | Accessing special character or block devices
    |

    | Swap File System | SWAPFS | Accessing system swap space |

    | Temporary File System | TMPFS | Providing fast access to temporary files |


    Of these nine pseudo file systems, the following five do not require any administration:
    FDDS, FIFOS, NAMEFS, SPECFS, and SWAPFS. The other four pseudo file systems—CacheFS,
    LOFS, PROCFS, and TMPFS—are described in the following sections.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '![](img/b957f979417d9f16274c2eb52c8f2c9f_359_0.png)


    In some Solaris documentation, pseudo or memory-based file systems are referred
    to as “virtual file systems.” However, this term is also used for file systems
    created and managed by virtual disk management systems (covered in Chapter 15,
    “Advanced Disk Management”). To avoid confusion, I refer to memory-based file
    systems only as “pseudo file systems.”


    # Process File System (PROCES)


    The Process File System is a memory-based file system used to provide process
    status and information. One instance of PROCFS exists on a system by default;
    it is accessible as the /proc directory. This directory contains one directory
    for each active process on the system. The directory name is the process ID (PID)
    of the process. Files under each PID directory provide various status and other
    information about the process. The /proc directory is owned by the root account
    and has an access mode of 555 (read/execute for owner/group/other) because no
    user account (not even root) should attempt to modify the files. These files are
    managed directly by the kernel.


    # The Proc Tools


    You extract process status and other information from the /proc PROCFS instance
    by using the proc tools, which are a collection of command-line utilities. These
    tools also provide stop/start capability.


    The PID of the process to be examined is specified as a command-line argument.
    If more than one process is to be examined, the PIDs should be separated by spaces.
    Table 16.2 provides a list of the proc tools.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_359_1.png)


    Be familiar with the names and purposes of the proc tools. Memorizing Table 16.2
    should be sufficient.


    | Command | Purpose |

    |---|---|

    | `pcred` | Lists process credentials (effective and real UID and GID) |

    | `pflags` | Displays tracing flags and pending and held signals, along with other
    information |

    | `pfiles` | Lists information on all open files |

    | `pldd` | Lists dynamic link libraries used |

    | `pmap` | Displays the memory address space map |

    | `prun` | Restarts the process |'
  merge: -1
  img_proc: true
- pgno: 360
