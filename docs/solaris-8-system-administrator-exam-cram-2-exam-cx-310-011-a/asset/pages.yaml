    # ## Extended File Permissions: Access Control Lists


    Solaris 8 extends the standard Unix file permissions by adding an Access Control
    List (ACL) capability. ACLs enable you to add permissions for specific users and
    groups along with a default permission (mask).


    In addition to supporting the standard read/write/execute permissions for the
    standard file user account (owner), ACLs can be used to set read/write/execute
    permissions for additional user accounts. Likewise, ACLs support read/write/execute
    permissions for the standard file group account and allow read/write/execute permissions
    for additional group accounts. In'
