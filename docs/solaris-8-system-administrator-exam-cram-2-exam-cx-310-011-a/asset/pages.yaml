  md: "# # Practice Questions\n\n# ## Question 1\n\n+   Which of the following commands\
    \ use the remote authentication database to validate users? (Select all that apply.)\n\
    +   \n+   - [ ] a. **telnet**\n+   - [ ] b. **rlogin**\n+   - [ ] c. **rcp**\n\
    +   - [ ] d. **ftp**\n+   - [ ] e. **rsh**\n\nAnswers b, c, and e are correct.\
    \ The r commands (**rlogin, rcp,** and **rsh**) use the remote authentication\
    \ database. The **telnet** and **ftp** commands use only the Unix account name\
    \ and password for authentication. Therefore, answers a and d are incorrect.\n\
    \n# ## Question 2\n\n+   Which **mkdir** command-line argument creates any parent\
    \ directories as needed?\n+   \n+   - ( ) a. **-p**\n+   - ( ) b. **-c**\n+  \
    \ - ( ) c. **-p**\n+   - ( ) d. **-m**\n\nAnswer c is correct. The **-p** command-line\
    \ argument of **mkdir** will create any parent directories as needed. **-P**,\
    \ **-c**, and **-m** are not valid command-line arguments for the **mkdir** command.\
    \ Therefore, answers a, b, and d are incorrect."
  merge: -1
