- pgno: 224
  md: 'file system is mounted using the information from the /etc/vfstab file entry.
    In addition, the **-F** command-line can identify the type of file system being
    mounted. Mounted file systems are listed in the /etc/mnttab file (unless the **-m**
    command-line argument is specified). If the **mount** command is used with no
    command-line arguments, all mounted file systems listed in the /etc/mnttab file
    are displayed.


    The **mount** command supports several options specified as command-line arguments.
    One significant option is UFS large file support. By default, UFS file systems
    support large files (more than 2GB). This default is the same as specifying **-o
    largefiles** as a command-line argument. To disable large file support, specify
    **-o nolargefiles** as a command-line argument to the **mount** command. If this
    option is specified and a large file exists on the file system, the mount will
    fail.


    Table 9.3 lists the commonly used command-line arguments for the **mount** command.


    **Table 9.3 Selected mount Command-Line Arguments**


    | Argument | Use |

    |---|---|

    | **-F type** | Specify the type of file system (NFS, UFS, and so on) |

    | **-m** | Mount the file system without making an entry in /etc/mnttab |

    | **-o** | Specify file-system-specific options |

    | **-p** | List the mounted file systems (abbreviated listing) |

    | **-r** | Mount the file system as read-only |

    | **-v** | List the mounted file systems (verbose listing) |


    Multiple file-system-specific options (**-o**) can be specified separated by commas.
    Following are some of the frequently used UFS options:


    +   - **atime**—Use normal access time recording (default).

    +   - **intr**—Allow keyboard interrupts to kill processes waiting on file system
    I/O (default).

    +   - **largefiles**—Allow files larger than 2GB (default).

    +   - **noatime**—Reduce file system activity by not updating file access times.

    +   - **nointr**—Do not allow keyboard interrupts to kill processes waiting on
    file system I/O.

    +   - **nolargefiles**—Do not allow files larger than 2GB. If any exist in the
    file system, the mount will fail.'
