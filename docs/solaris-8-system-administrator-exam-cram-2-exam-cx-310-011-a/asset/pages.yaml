- pgno: 3
  md: '# A Note from Series Editor Ed Tittel


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_3_0.png)


    You know better than to trust your certification preparation to just anybody.
    That’s why you, and more than two million others, have purchased an Exam Cram
    book. As Series Editor for the new and improved Exam Cram 2 series, I have worked
    with the staff at Que Certification to ensure you won’t be disappointed. That’s
    why we’ve taken the world’s best-selling certification product—a tradition for
    “Best Study Guide” in a CertCities reader poll in 2002—and made it even better.


    As a “Favorite Study Guide Author” finalist in a 2002 poll of CertCities readers,
    I know the value of good books. You’ll be impressed with Que Certification''s
    stringent review process, which ensures the books are high-quality, relevant,
    and technically accurate. Rest assured that at least a dozen industry experts—including
    the panel of certification experts at CramSession—have reviewed this material,
    helping us deliver an excellent solution to your exam preparation needs.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_3_1.png)


    We’ve also added a preview edition of PrepLogic’s powerful, full-featured test
    engine, which is trusted by certification students throughout the world.


    As a 20-year-plus veteran of the computing industry and the original creator and
    editor of the Exam Cram series, I’ve brought my IT experience to bear on these
    books. During my tenure at Novell from 1989 to 1994, I worked with and around
    its excellent education and certification department. This experience helped push
    my writing and teaching activities heavily in the certification direction. Since
    then, I’ve worked on more than 70 certification-related books, and I write about
    certification topics for numerous Web sites and for Certification magazine.


    In 1996, while studying for various MCP exams, I became frustrated with the huge,
    unwieldy study guides that were the only preparation tools available. As an experienced
    IT professional and former instructor, I wanted “nothing but the facts” necessary
    to prepare for the exams. From this impetus, Exam Cram emerged in 1997. It quickly
    became the best-selling computer book series since “...For Dummies,” and the best-selling
    certification book series ever. By maintaining an intense focus on subject matter,
    tracking errata and updates quickly, and following the certification market closely,
    Exam Cram was able to establish the dominant position in cert prep books.


    You will not be disappointed in your decision to purchase this book. If you are,
    please contact me at ettittel@jump.net. All suggestions, ideas, input, or constructive
    criticism are welcome!


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_3_2.png)'
  merge: -1
  img_proc: true
