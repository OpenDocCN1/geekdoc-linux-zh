- pgno: 70
  md: 'The first section of this chapter covers the Solaris 8 distribution. Next,
    installing the operating system is covered in detail. The last two sections summarize
    the commands for performing software package administration and patch administration.
    The *Installation* test objectives are covered in this chapter.


    # # The Solaris 8 Distribution


    Solaris 8 system and application software is delivered as collections of files
    and directories, referred to as *packages*. You can copy these packages onto the
    system from CD-ROM or magnetic tape as a single compressed file and uncompress
    them for installation.


    Included with the package is information about the package, such as its title,
    storage requirements, and version. Also included are any custom scripts needed
    to properly install the software.


    Sometimes system software is distributed in more than one package, but you need
    to distribute and install the packages as a unit. A collection of two or more
    related packages is referred to as a *software cluster*, a logical grouping of
    packages.


    The Solaris 8 operating system is preconfigured into *software groups* consisting
    of different collections of software clusters and packages. The five software
    groups are shown in Table 3.1.


    | Software Group | Contents |

    |---|---|

    | Core | Required operating system files |

    | End-User System Support | Core plus windowing environments |

    | Developer System Support | End-User plus development environment |

    | Entire Distribution | Developer System plus enhanced features |

    | Entire Distribution Plus OEM | Entire Distribution plus third-party hardware
    drivers |


    > > **NOTE**

    > >

    > > Some Solaris 8 documents refer to the operating system’s preconfigured software
    groups as *software configuration clusters* or simply clusters. The term *software
    cluster* also refers to a collection of packages, so this reference can create
    confusion. This book uses the term *software groups* because it is the term used
    in the *Solaris 8 Advanced Installation Guide*.


    The Entire Distribution Plus OEM group is available only for SPARC platforms.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Installing Solaris 8


    Solaris 8 can be installed in four ways. Two of the methods are interactive: The
    Solaris Interactive Installation program (SunInstall) and Solaris Web Start are
    covered in this chapter. The other two methods are automatic: JumpStart and Custom
    JumpStart. These methods are objectives for Exam CX-310-012 and are covered in
    Chapter 21, “Over-the-Network Installation and JumpStart.”


    SunInstall, an interactive Open Windows installation program, can be used to install
    the Solaris 8 software but it does not support installation of copackaged software.
    You can install any copackaged software using its provided installation program
    after you finish installing the Solaris 8 software.


    Web Start enables you to install Solaris 8 by using a Web browser–like interface
    instead of the Open Windows interactive SunInstall uses. By default, all Solaris
    and copackaged software is installed; however, this default can be changed so
    that you can select specific software.


    By default, Web Start sets up the system disks, including the root and swap partitions.
    It also enables you to change the size of the system partitions and provides access
    to the Layout File Systems utility to set up other disks. The /opt partition is
    created automatically for copackaged software. With Web Start, you can also create
    additional partitions and file systems.


    # Hardware Requirements


    Solaris 8 can be installed on Sun SPARC platforms and Intel x86 or compatible
    platforms. The hardware requirements for both are similar.


    # Solaris 8 on SPARC Hardware


    Solaris 8 can be installed on most sun4c, sun4u, and sun4m platform groups. Consult
    the *Solaris 8 Sun Hardware Platform Guide* to determine whether a particular
    platform is supported along with other devices and peripherals, such as disk drives,
    CD-ROM drives, tape drives, floppy disk drives, small computer system interface
    (SCSI)/Peripheral Component Interconnect (PCI) host adapters, graphic accelerators,
    network interfaces, and keyboard/mouse components.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_71_0.png)


    > You can use the Solaris 8 installation programs to install the 32-bit or 64-bit
    version of the Solaris operating system. The 64-bit version is selected by default
    when you install on Sun UltraSPARC system, but you can choose the 32-bit version
    instead. However, you might need to upgrade the Flash PROM on some UltraSPARC
    sun4u platforms to provide 64-bit support. The *Solaris 8 Sun Hardware Platform
    Guide* supplies information on determining whether the Flash PROM for a particular
    system must be upgraded and provides a procedure for updating the Flash PROM.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Solaris 8 requires a minimum of 64MB of memory. The recommended space for the
    End-User System is 1.6GB of hard disk space. For the largest software group (Entire
    Distribution Plus OEM with 64-bit support), 2.4GB of hard disk space is required.
    Either a CD-ROM drive or the appropriate environment for a network installation
    is required.


    # Solaris 8 on Intel Hardware


    Solaris 8 can be installed on most Pentium or better Intel-compatible CPUs, including
    AMD and Cyrix processors. Consult the *Solaris 8 (Intel Platform Edition) Hardware
    Compatibility List* to determine whether a particular CPU is supported along with
    other devices and peripherals, such as system buses, disk drives, CD-ROM drives,
    tape drives, floppy disk drives, SCSI/PCI host adapters, graphic accelerators,
    network interfaces, and keyboard/mouse components. If the system does not have
    a CD-ROM drive or cannot be booted from the CD-ROM drive, a floppy disk drive
    is required.


    The memory and storage requirements for Intel hardware are identical to those
    for SPARC hardware: a minimum of 64MB of memory, 1.6GB of hard disk space for
    the End-User System with 32-bit support, and 2.4GB of hard disk space for the
    Entire Distribution. Either a CD-ROM drive or the appropriate environment for
    a network installation is required.


    # Installing Solaris 8 on a New System by

    Using Web Start


    If you’re installing Solaris 8 on a single new system, the preferred installation
    method is to install from a local CD-ROM drive by using Web Start. (Over-the-network
    installation is described briefly later in this chapter and in more detail in
    Chapter 21, “Over-the-Network Installation and JumpStart.”) Solaris Web Start
    can be accessed with a command-line interface or a graphical user interface (GUI).


    The installation is divided logically into three phases:


    +   - Preparation

    +   - Configuration

    +   - Software installation


    # Preparation


    The following list summarizes the preparation steps for installing Solaris 8 on
    a SPARC or Intel-compatible platform from a local CD-ROM drive:'
  merge: -1
  img_proc: true
- pgno: 73
  md: '+   1. Verify that the system hardware is supported. For a SPARC system, see
    the *Solaris 8 Sun Platform Guide*. For an Intel-compatible system, see the *Solaris
    8 (Intel Platform Edition) Hardware Compatibility List*.

    +   2. If the system is networked (will be attached to a network), decide whether
    Dynamic Host Configuration Protocol (DHCP) will be used. If not, determine the
    hostname, IP address, and subnet mask information.

    +   3. Determine the domain name. If a name service is used, determine the server
    hostname and IP address. The name service choices are Domain Name System (DNS),
    Network Information Service (NIS), or Network Information Service Plus (NIS+).

    +   4. Determine the disk space required by selecting a software group (End-User,
    Developer, Entire Distribution, or Entire Distribution Plus OEM) and identifying
    additional software and space for home directories.

    +   5. Determine the language used to install Solaris.

    +   6. Insert the appropriate Solaris 8 Installation CD-ROM (English or Multilingual)
    into the CD-ROM drive. For Intel-compatible systems that cannot boot from the
    CD-ROM drive, insert the Solaris 8 Device Configuration Assistant floppy disk
    in the floppy disk drive.

    +   7. Boot the system by turning the power on.

    +   8. For Intel-compatible systems, the Device Configuration Assistant runs to
    identify the hardware configuration.

    +   9. If you’re using the Multilingual CD-ROM, the Web Start Installer prompts
    you for the language to use during the install. Select the appropriate language.

    +   10. For SPARC platforms, the Installer prompts you to select Initial Install
    or Upgrade. Select Initial Install.

    +   11. For Intel-compatible platforms, if an appropriate partition for Solaris
    is not located, a utility similar to the MS-DOS FDISK program executes to define
    a partition.

    +   12. The Installer prompts you to confirm reformatting of the default disk,
    requests a size for the swap space, and confirms that the swap space can be located
    at the beginning of the disk (or prompts for a starting location if the swap space
    can’t be located). The Installer copies the miniroot and platform-specific files
    to the disk and then reboots the system.'
  merge: -1
  img_proc: true
- pgno: 74
  md: "+   13. For SPARC platforms, the Web Start GUI starts automatically after the\
    \ system boots.\n+   \n+   14. For Intel-compatible platforms, the Installer prompts\
    \ you for a window configuration (video card and monitor) and tests it to be certain\
    \ the configuration is correct. Without a proper configuration, the GUI and Solaris\
    \ Desktop cannot be displayed. After a few seconds, the Web Start GUI starts.\n\
    \nThe install process continues with the configuration phase.\n\n# Configuration\n\
    \nUse the following steps in the Web Start GUI to collect the necessary configuration\
    \ information. In this sequence of windows, the next window is typically displayed\
    \ after you supply the required information in the current window and click the\
    \ Next button:\n\n+   1. The Welcome window is displayed.\n+   \n+   2. In the\
    \ Network Connectivity window, select Networked. (If you do not know the network\
    \ configuration, contact your network administrator.)\n+   \n+   3. In the DHCP\
    \ window, select Yes to enable DHCP; otherwise, select No. If DHCP is not being\
    \ used, do the following:\n+      - In the Host Name screen, enter the name of\
    \ the host in the dialog box.\n+      - In the IP Address screen, enter the IP\
    \ address of the system name in the dialog box.\n+      - In the Netmask screen,\
    \ enter the subnet mask in the dialog box.\n\n+   4. In the IPv6 screen, select\
    \ Yes to enable IPv6; otherwise, select No.\n+   \n+   5. In the Name Service\
    \ screen, select NIS+, NIS, DNS, or None. If you select a name service, do the\
    \ following:\n+      - In the Domain Name screen, enter the domain name in the\
    \ dialog box.\n+      - If you selected NIS or NIS+, in the Name Server screen,\
    \ select Find One or Specify One. If you select Specify One, the Name Server Information\
    \ screen opens, in which you specify the server hostname and IP address."
  merge: -1
  img_proc: true
- pgno: 75
  md: '+   - If you selected DNS, in the DNS Server Address screen, enter up to three
    IP addresses for DNS servers in the dialog boxes. In the DNS Search List screen,
    enter up to six domains to be searched to resolve a DNS query in the dialog boxes.
    If none is identified, only the domain specified for the system will be searched.


    +   6. In the Time Zone screen, select how to specify the time zone: Geographic
    Region, Offset From GMT, or Time Zone File. Depending on which selection you make,
    do the following:

    +      - If you select Geographic Region, the Geographic Region screen opens.
    Select a region or country and an associated time zone.

    +      - If you select Offset From GMT, the Offset From GMT window opens. Drag
    the slide bar until the window displays the correct number of hours (plus or minus)
    the time zone differs from GMT.

    +      - If you select Time Zone File, the Time Zone File window opens. Enter
    the name of the time zone file (typically /usr/share/lib/zoneinfo).


    +   7. In the Date And Time window, enter the year, month, day, hour, and minute
    in the appropriate dialog boxes.

    +   8. In the Root Password window, enter the password for the root account.

    +   9. In the Power Management window, select whether power management should
    be turned on or off and whether the selection should be prompted at each reboot.

    +   10. In the Proxy Server Configuration window, select Direct Connection To
    The Internet or Use Proxy Configuration and enter the proxy server’s hostname
    and port number.

    +   11. The Confirm Information window summarizes your selections. Either click
    Confirm to continue with the software installation phase, or click Back to change
    one or more selections.


    The install process continues with the software installation phase.


    # Software Installation


    Use the following steps in the Web Start GUI to install the Solaris 8 software
    on a networked SPARC or Intel-compatible system with a local CD-ROM drive. In
    this sequence of windows, the next window is typically displayed after you provide
    the required information in the current window and click the Next button:'
  merge: -1
  img_proc: true
- pgno: 76
  md: "+   1. In the Welcome window, click Next. The Installation CD is ejected.\n\
    +   \n+   2. In the Insert CD window, click OK after inserting the Solaris 8 Software\
    \ 1 of 2 CD-ROM in the CD-ROM drive.\n+   \n+   3. In the Select Type Of Install\
    \ window, select Default Install or Custom Install. *If you select Default Install,\
    \ skip steps 4 through 10; the installation continues with step 11.*\n+   \n+\
    \   4. In the Select Software Localizations window, select software localization\
