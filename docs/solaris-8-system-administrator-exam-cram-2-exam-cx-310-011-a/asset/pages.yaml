    \ The default type for local (disk-based) file systems is UFS. Additional parameters,\
    \ such as block size and disk geometry (sectors per track, tracks per cylinder,\
    \ and so on) can also be specified.\n\n![](img/b957f979417d9f16274c2eb52c8f2c9f_222_0.png)\n\
    \nThe commands used to create file systems expect raw (character) logical device\
