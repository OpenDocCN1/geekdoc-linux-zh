  md: "# # Practice Questions\n\n# ## Question 1\n\n+   Which of the following RBAC\
    \ data files is not under /etc/security?\n+   \n+   - a. `auth_attr`\n+   - b.\
    \ `exec_attr`\n+   - c. `prof_attr`\n+   - d. `user_attr`\n\nAnswer d is correct.\
    \ The user_attr file is under the /etc directory. All the other files are under\
    \ the /etc/security directory. Therefore, answers a, b, and c are incorrect.\n\
    \n# ## Question 2\n\n+   Which of the following cannot be assigned to a role?\n\
    +   \n+   - a. A profile\n+   - b. An authorization\n+   - c. Another role\n+\
    \   - d. More than one profile\n\nAnswer c is correct. A role cannot be assigned\
    \ to another role. One or more authorizations and/or one or more profiles can\
    \ be assigned to roles. Therefore, answers a, b, and d are incorrect.\n\n# ##\
    \ Question 3\n\n+   The Execution Attributes Database file is associated with\
    \ what other RBAC attributes database file?\n+   \n+   - a. Authorization Attributes\
    \ Database file\n+   - b. Profile Attributes Database file\n+   - c. User Attributes\
    \ Database file\n\nAnswer b is correct. Privileged operations listed in the Execution\
    \ Attributes Database file are associated with profiles listed in the Profile\
    \ Attributes"
  merge: -1
