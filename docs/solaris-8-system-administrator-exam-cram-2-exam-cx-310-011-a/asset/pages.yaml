    \ -M /var/spool/patch patchlist`\n\nAnswers a, b, and c are correct. All the answers\
    \ can be used to install multiple patches. The command in answer a installs three\
    \ patches located in the `/var/spool/patch` directory. The command in answer c\
    \ uses a file named `patchlist` that contains a list of patches to install. Of\
    \ course, the `pkgadd` command can be used to install several patches, one at\
    \ a time (answer b).\n\n# ## Question 2\n\n+   Which of the following can be used\
    \ to install packages? (Select all that apply.)\n+   \n+   - [ ] a. `admintool`\n\
    +   - [ ] b. `pkgtool`\n+   - [ ] c. `pkgadd`\n+   - [ ] d. `pkgrm`\n+   - [ ]\
    \ e. `pkginfo`\n\nAnswers a and c are correct. You can use `admintool` and `pkgadd`\
    \ to install packages. `pkgtool` does not exist. Therefore, answer b is incorrect.\
    \ `pkgrm` is used to remove packages, and `pkginfo` is used to display information\
