- pgno: 102
  md: 'This chapter addresses topics related to booting and shutting down the system.
    The first section covers key aspects of the system firmware on Sun SPARC platforms,
    including the *Boot PROM* test objectives. The second section summarizes the boot
    process for SPARC and Intel x86 platforms and covers the *Boot Process* test objectives.
    The third section describes system run levels, the services available at the different
    run levels, and how to change between run levels. It also describes how to add
    custom services at a selected run level and includes the *Initialization and Shutdown*
    test objectives.


    # Boot PROM Firmware (OpenBoot)


    A system’s boot Programmable Read-Only Memory (PROM) stores the firmware that
    is executed immediately after the system hardware finishes the Power On Self Test
    (POST). This firmware, called OpenBoot, is the standard firmware for Sun systems.
    OpenBoot firmware pertains only to SPARC platforms, but some limited compatible
    functionality is available on Intel x86 platforms as well.


    OpenBoot is used to boot the operating system, run diagnostics, modify boot-related
    parameters stored in nonvolatile RAM (NVRAM), and provide a Forth interpreter
    used to execute the Forth Monitor.


    Currently, two supported versions of OpenBoot are available: version 2.x and version
    3.x. OpenBoot 2.x was introduced with SPARCstation 2 and SPARCstation IPX systems.
    OpenBoot 3.x is an enhanced version of OpenBoot 2.x; it’s based on the Institute
    of Electrical and Electronics Engineers (IEEE) Standard 1275-1994, “Standard for
    Boot Firmware.” OpenBoot 3.x is used on Sun Ultra series and newer SPARC platforms.


    OpenBoot provides a command-line interface for the system console. The command-line
    interface has two modes:


    +   - **Restricted Monitor**—Allows the administrator to boot the operating system,
    continue a suspended operation, or start the Forth Monitor. The prompt for the
    Restricted Monitor is the `>` symbol.

    +   - **Forth Monitor**—Allows the administrator to boot the operating system,
    run diagnostics, and modify system configuration parameters. The prompt for the
    Forth Monitor is the word *ok*, which is typically referred to as the *OpenBoot
    prompt*.


    System configuration parameters are stored in the system NVRAM. These parameters
    determine the system’s initial configuration and related communication characteristics
    and retain their value even if the power to the system is shut off.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'You can use the OpenBoot **printenv** command to view the value of these parameters.
    To set and modify them, use the OpenBoot **setenv** command.


    # Important OpenBoot Commands


    Some of the more important OpenBoot commands are used to display system configuration
    information, perform hardware testing, and control system booting. All these commands
    are entered at the Forth Monitor or OpenBoot **ok** prompt.


    Table 4.1 lists the OpenBoot commands that display system configuration data,
    and Table 4.2 lists the OpenBoot commands you use to perform basic hardware testing.
    Table 4.3 lists variations of the OpenBoot **boot** command you can use to select
    different boot devices.


    **Table 4.1 OpenBoot Commands for Displaying System Configuration Data**


    | Command | Description |

    |---|---|

    | banner | Displays the power-on banner |

    | devalias | Lists all device aliases |

    | .enet-addr | Displays an Ethernet address |

    | .idprom | Displays formatted ID PROM contents |

    | module-info | Displays the CPU speed (2.x only) |

    | printenv | Lists all NVRAM parameters and default values |

    | show-devs | Lists all installed devices |

    | .speed | Displays CPU and bus speeds (3.x only) |

    | .traps | Lists types of SPARC traps |

    | .version | Displays the boot PROM’s version and data |


    **Table 4.2 OpenBoot Commands for Performing Hardware Testing**


    | Command | Description |

    |---|---|

    | pcia-probe-list | Tests the Peripheral Component Interconnect (PCI) bus |

    | probe-scsi | Tests the built-in small computer system interface (SCSI) bus for
    connected devices |

    | probe-scsi-all | Tests all SCSI buses |

    | test-all | Tests a group of installed devices |

    | test floppy | Tests the floppy disk drive |

    | test /memory | Tests system memory |'
  merge: -1
  img_proc: true
- pgno: 104
  md: '**Table 4.2 OpenBoot Commands for Performing Hardware Testing (continued)**


    | Command | Description |

    |---|---|

    | `test net` | Tests the on-board Ethernet interface |

    | `watch-clock` | Monitors the system clock |

    | `watch-net` | Monitors the network connection |


    **Table 4.3 OpenBoot Commands for Selecting Different Boot Devices**


    | Command | Description |

    |---|---|

    | `boot cdrom` | Boots from the local CD-ROM |

    | `boot disk` | Boots from the default hard disk |

    | `boot floppy` | Boots from the diskette drive |

    | `boot net` | Boots from the network |

    | `boot tape` | Boots from the SCSI tape drive |


    The boot command supports a couple of options that you may find useful. The **-a**
    option requests an interactive boot so that OpenBoot will prompt for information
    when needed. In addition, the **-s** option causes OpenBoot to boot to single-user
    mode instead of the default system run level. When you’re booting from the hard
    disk, the default device is specified by the boot-device NVRAM configuration parameter.
    From the OpenBoot **ok** prompt, use the following command to display the default
    device:


    ```

    ok printenv boot-device

    boot-device = disk

    ok

    ```


    The default device can be changed as required. For example, to change the **default**
    boot device to a device with the alias disk2, use the following command. Then
    use **reset** to save the new value and reboot:


    ```

    ok setenv boot-device disk2

    ok reset

    ```


    # Device Aliases


    OpenBoot identifies system hardware using a full device pathname that represents
    the type of device and its location in the system. A device pathname consists
    of system buses, addresses, and possibly driver names. The following is an example
    of a full device name for a partition of a SCSI disk drive:


    ```

    /bus@1f,0/SUNW,fas@e,8800000/sd@3,0:a

    ```'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'For more details on device names, see Chapter 8, “Disk Administration.” Because
    device names are typically long, complex, and awkward to enter, OpenBoot lets
    you assign a device alias to a full device name; this alias is a name that’s short
    and easy to remember and type.


    # Creating a Device Alias


    You can create a device alias in two ways. The first method uses the **devalias**
    command. Aliases created with this command are lost when the system is rebooted.
    Aliases created with the second method, the **nvalias** command, are stored in
    nonvolatile memory and remain there until you remove them by using other OpenBoot
    commands. Both commands use the same syntax.


    For example, both of the following commands, entered at the OpenBoot ok prompt,
    assign the alias disk2 to the device named /sbus/esp/sd@2,0 (a SCSI disk):


    ```

    ok devalias disk2 /sbus/esp/sd@2,0

    ok nvalias disk2 /sbus/esp/sd@2,0

    ok

    ```


    Whenever the device name is required in the OpenBoot environment, you can use
    the alias instead. When you enter the **nvalias** command, it’s stored in nonvolatile
    memory. This portion of memory is treated as an OpenBoot parameter called **nvramrc**.
    The contents of the **nvramrc** parameter are called the *script*. In addition
    to storing user-defined commands, this parameter is used by device drivers to
    save startup configuration variables, to patch device driver code, and to store
    bug patches or other installation-specific device configuration information.


    If the OpenBoot **use-nvramrc** parameter is set to **true**, the script is executed
    during system boot. Any aliases defined in **nvramrc** with the **nvalias** command
    will be set, and then the aliases can be used in a later part of the script or
    as the value of one or more other OpenBoot parameters.


    # Displaying a Device Alias


    You can also use the **devalias** command to display defined device aliases. If
    you enter the command without any command-line arguments, all defined device aliases
    are listed. If you list a device alias as a command-line argument, the **devalias**
    command displays only the named device alias. The following example shows using
    the **devalias** command from the OpenBoot ok prompt of a SPARC 20 workstation:


    ```

    ok devalias

    screen        /iommu@f,e0000000/sbus@f,e0010000/cgsix@2,0

    ttyb          /obio/zs@0,100000:b

    ttya          /obio/zs@0,100000:a

    keyboard      /obio/zs@0,0

    ```'
  merge: -1
  img_proc: true
- pgno: 106
  md: '```

    ```text

    floppy    /obio/SUNW, fdtwo

    scsi      /iommu/sbus/espdma@f,4000000/esp@f,800000

    net-aui   /iommu/sbus/ledma@f,4000100/aui@f,0c000

    net-tpe   /iommu/sbus/ledma@f,4000100/le@f,c000

