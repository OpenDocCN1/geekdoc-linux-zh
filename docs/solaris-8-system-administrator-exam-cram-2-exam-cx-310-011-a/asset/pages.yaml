- pgno: 158
  md: '![](img/b957f979417d9f16274c2eb52c8f2c9f_158_0.png)


    Because using the **admintool** command makes creating, modifying, and deleting
    group accounts easy, Exam CX-310-011 concentrates on using the **groupadd**, **groupmod**,
    and **groupdel** commands for administering group accounts.


    # Creating a Group by Using the groupadd Command


    The **groupadd**(1M) command provides a quick method to add a new group account.
    At a minimum, you must specify the group account name as a command-line argument.
    The **groupadd** command supports two other command-line arguments. The first
    is **-g gid**, which specifies the unique GID that should be associated with the
    group. It must be a decimal integer. If you don’t specify a GID, the next highest
    available GID is assigned. The other command-line argument is **-o**, which lets
    you assign a duplicate GID to the group.


    The following example creates a group by using the **groupadd** command:


    ```

    ```sh

    #

    # groupadd -g 1000 newgroup

    #

    ```

    ```


    # Modifying a Group by Using the groupmod Command


    The **groupmod**(1M) command is used to modify an existing group account. The
    command-line arguments are identical to the **groupadd** command-line arguments,
    except that you specify the new group account name by using **-n name** if the
    group account name is being modified. The following example uses groupmod to change
    the group newgroup to group:


    ```

    ```sh

    # groupmod -n newgroup newgroup

    #

    ```

    ```


    # Deleting a Group by Using the groupdel Command


    The **groupdel**(1M) command is used to delete a group account. The group account
    is specified as a command-line argument:


    ```

    ```sh

    # groupdel ngroup

    #

    ```

    ```


    # Password Administration


    Password administration involves setting parameters to control password aging,
    changing a user’s password as needed, and possibly locking a user account to prevent
    its use.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Password Aging


    The parameters of the /etc/shadow file, which you set through the Account Security
    fields of the **admintool** command’s Add or Modify User dialog box, determine
    the password aging policy. These parameters include how long a password is valid
    (Max Change), how often it can be changed (Min Change), and how long an account
    can be inactive before the password must be changed (Max Inactive). They enforce
    a policy for protecting password integrity.


    Note that only Max Inactive can be specified by using the **useradd** command
    and modified by using the **usermod** command.


    # Password Requirements


    Unless specified by a superuser account such as root, passwords must meet the
    following requirements:


    +   - A password must contain at least the number of characters specified by the
    PASSLENGTH parameter in the /etc/default/passwd file. The default is six; the
    recommended is eight or more.

    +   - A password must contain at least two alphabetic characters and at least
    one numeric character (within the first PASSLENGTH characters).

    +   - A password cannot be the same as the user account name, the reverse of the
    user account name, or a circular shift of the user account name. Any uppercase
    letters are mapped to lowercase letters for requirement checking. As a result,
    the password for the guest user account cannot be guest, tseug, uestg, estgu,
    GUEST1, and so on.

    +   - A new password must differ by at least three characters from the old password.
    Again, uppercase and lowercase letters are equivalent for requirement checking.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_159_0.png)


    Passwords can be any length, but only the first eight characters are significant.
    For example, if a password is defined as **25administation**, **25administation**,
    25admini can be used to log in to the system.


    Keep in mind that these requirements do not apply when root or some other superuser
    account defines its own password or the password of another user account.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# Changing Passwords by Using the admintool Command


    To change the password of a user account, start the admintool command if it is
    not already active. Choose Browse, Users from the menu to open the Users dialog
    box.


    You can select the user account in two ways: by double-clicking the account entry
    or by clicking the account entry to highlight it and then choosing Edit, Modify
    from the menu. With either method, the Modify User dialog box opens (see Figure
    6.6). Note that the current password setting for the user account is shown in
    the Password field. In Figure 6.6, the user account has Normal Password as the
    current setting.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_160_0.png)


    **Figure 6.6** The Admintool: Modify User dialog box, with the Normal Password
    setting selected.


    To modify the account password, position the mouse cursor over the Password field
    and hold down the left button. Then move the mouse cursor over the Normal Password
    item and release the mouse button to display the Set User Password dialog box
    (see Figure 6.7).


    Enter the same password in the Enter Password and Verify Password fields. Asterisks
    are displayed in place of each character entered. Click OK. To save the password,
    click OK in the Modify User dialog box.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '![](img/b957f979417d9f16274c2eb52c8f2c9f_161_0.png)


    **Figure 6.7**  The Set User Password dialog box.


    # Changing Passwords by Using the passwd Command


    Other than the admintool command, the passwd(1) command is the only way to change
    a user account’s password. When used without any command-line arguments, the passwd
    command changes the password of the current user account, as in this example:


    ```

    ```text

    $ passwd

    passwd: Changing password for dla

    Enter login password:

    New password:

    Re-enter new password:

    passwd (SYSTEM): passwd successfully changed for dla

    $

    ```

    ```


    Note that the current password must be entered before a new password can be specified.
    When a superuser account, such as root, uses the **passwd** command, the current
    password is not required.


    A variety of command-line arguments are provided to support changing passwords.
    Table 6.4 lists the most important ones.


    | Table 6.4 — Selected Command-Line Arguments for the passwd Command |  |

    |---|---|

    | **Argument** | **Description** |

    | *account* | Specifies the name of the user account for which the password will
    be changed |

    | -as | Lists password attributes for all user accounts (displays *LK* for locked,
    *PS* for password, and so on) |

    | -d | Deletes the password for the specified account |

    | -l | Locks the specified account so that it cannot be accessed |'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'A superuser account can change the password for another user account. The user
    account is specified as a command-line argument, as shown in this example:


    ```

    # passwd dla

    New password:

    Re-enter new password:

    passwd (SYSTEM): password successfully changed for dla

    #

    ```


    # Locking a User Account by Using the admintool Command


    An account can be locked to prevent it from being used. To do so, start the admintool
    command if it is not already active, and choose Browse, Users from the menu.


    You can select the user account in two ways: by double-clicking the account entry
    or by clicking the account entry to highlight it and then choosing Edit, Modify
    from the menu. With either method, the Modify User dialog box opens.


    To lock the account, position the mouse cursor over the Password field and hold
    down the left button. Then move the mouse cursor over the Account Is Locked item
    and release the mouse button. The Account Is Locked item is displayed in the Password
    field (see Figure 6.8). To save the change, click OK in the Modify User dialog
    box.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_162_0.png)


    **Figure 6.8** The Account Is Locked setting in the Admintool: Modify User dialog
    box.'
  merge: -1
