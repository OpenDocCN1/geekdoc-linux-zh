  md: 'a time. For example, **5x** deletes the next five characters and **10dd** deletes
    the next 10 lines.


    > Know the purpose of Command mode and the cursor-positioning and text-deletion
    keyboard sequences. Also keep in mind that Command mode is the default mode.


    # ## Input Mode


    Input mode makes it possible to insert (before the cursor), append (after the
    cursor), change, and replace text. Table 10.4 lists the Input mode keyboard sequences
    for manipulating text. You enter Input mode from Command mode, and it remains
    in effect until you terminate it by pressing the <Esc> key (except **r**, which
    is in effect only on your character). Then the vi editor is returned to Command
    mode.


    **Table 10.4  Text-Manipulation (Input Mode) Keyboard Sequences for the vi Editor**


    | Key | Description |

    |---|---|

    | `<a>` | Appends after the cursor |

    | `<A>` | Appends to the end of the file |

    | `<i>` | Inserts before the cursor |

    | `<I>` | Inserts before the first non-blank character |

    | `<c>` | Changes the line |

    | `<C>` | Changes the rest of the line |

    | `<o>` | Inserts a new line below the current line |

    | `<O>` | Inserts a new line above the current line |

    | `<r>` | Replaces a character |

    | `<R>` | Replaces text |

    | `<s>` | Substitutes a character |

    | `<S>` | Substitutes a line |


    You can combine the <c> keystroke with <w> to change the current word (cw) or
    with <S> to change the rest of the current line (c$).


    > Know the purpose of Input mode and the text-manipulation keyboard sequences.
    Also keep in mind that <Esc> terminates Input mode and returns the vi editor to
    Command mode.'
