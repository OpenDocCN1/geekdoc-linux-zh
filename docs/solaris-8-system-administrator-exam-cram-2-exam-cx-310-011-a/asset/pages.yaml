    | **-s server:path** | Specifies the install **server** and **path** to the CD
    image (needed only when you’re adding a client to the boot server). |


    # ## Install/Boot Server Daemons


    The install and boot servers use several network daemons to support over-the-network
    installation:


    +   - **in.rarpd(1M)**—The Reverse Address Resolution Protocol (RARP) daemon provides
    Ethernet address-to-IP address resolution. Clients use this service to determine
    their IP address based on their assigned Ethernet address.

    +   - **in.tftpd(1M)**—The Trivial File Transfer Protocol (TFTP) daemon provides
    a method for SPARC install clients to obtain bootable images from a server without
    logging in to the server.

    +   - **nsfd(1M)**—The NFS daemon gives clients remote access to file systems
    over the network.

    +   - **rpc.bootparamd(1M)**—The Boot Protocol (BOOTP) daemon provides clients
    with boot information from the /etc/bootparams file.


    # ### The RARP Daemon (in.rarpd)


    The /etc/sbin/in.rarpd daemon provides Ethernet address-to-IP address resolution.
    When a RARP request is received, the **in.rarpd** program attempts to determine
    the IP address assigned to the specified Ethernet address. The lookup procedure
    consists of looking up the Ethernet address to obtain the system’s hostname, and
    then looking up the hostname to determine its IP address.


    The procedure for looking up the hostname (based on the Ethernet address) is determined
    by the configuration of the **ethers** keyword in the name service switch (/etc/nsswitch.conf)
    file. It can be obtained from NIS (ethers.byaddr'
  merge: -1
  img_proc: true
- pgno: 455
  md: 'map), NIS+ (ethers table), or the /etc/ethers file. See **ethers**(4) for the
    format of the /etc/ethers file.


    The procedure for looking up the IP address (based on the obtained host-name)
    is determined by the configuration of the **hosts** keyword in the name service
    switch (/etc/nsswitch.conf) file. It can be obtained from DNS, NIS (hosts.byname
    map), NIS+ (hosts table), or the /etc/hosts file. See **hosts**(4) for the format
    of the /etc/hosts file.


    # The TFTP Daemon (in.tftpd)


    The /usr/sbin/in.tftpd daemon provides a simple method for SPARC install clients
    to obtain the boot image from the install/boot server using TFTP. Unlike the standard
    FTP, TFTP does not require user authentication (account name and password) to
    access files. The boot images are typically stored under the/tftpboot directory.


    # The NFS Server Daemon (nsfd)


    The /usr/lib/nfs/nfsd daemon provides network access to the Solaris 8 distribution
    files via NFS. These files are identified by the boot parameters the **rpc.bootparamd**
    daemon provides.


    # The Boot Parameter Server Daemon (rpc.bootparamd)


    The /usr/sbin/rpc.bootparamd daemon provides NFS share names and other information
    needed to boot install clients. The source of the information is determined by
    the configuration of the **bootparams** keyword in the name service switch (/etc/nsswitch.conf)
    file. It can be obtained from NIS (bootparams map), NIS+ (bootparams table), or
    the /etc/bootparams file. See **bootparams**(4) for the format of the /etc/bootparams
    file.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_455_0.png)


    Because these four daemons are required to support over-the-network installation
    (with or without JumpStart), the **add_install_client** command configures and
    starts them (on the install/boot server) if required when a network install client
    is configured.


    # Automating Installation with

    JumpStart


    The JumpStart feature provides a mechanism to automatically install the Solaris
    operating system. The two JumpStart methods are JumpStart and Custom JumpStart.'
  merge: -1
  img_proc: true
- pgno: 456
  md: '![](img/b957f979417d9f16274c2eb52c8f2c9f_456_0.png)


    Not only does JumpStart automate installation, it can be used to automate the
    installation of large numbers of identically configured systems. If you need to
    install 100 systems using the same configuration, for example, JumpStart provides
    a way to simplify this task.


    JumpStart enables you to automatically install the Solaris operating system on
    new SPARC platforms by inserting the Solaris distribution CD into the local CD-ROM
    drive and powering on the system or booting via the network. The software that
    is installed is determined by a default profile, which is selected based on the
    hardware model and the size of the hard disks. The installed software cannot be
    manually selected.


    All new SPARC platforms have a preinstalled JumpStart boot image. This boot image
    can be copied to an existing SPARC platform by using the **re-preinstall(1M)**
    command.


    Custom JumpStart enables you to automatically install the Solaris operating system
    on new SPARC or Intel x86 platforms by inserting the Solaris distribution CD into
    the local CD-ROM drive and powering on the system or booting via the network.
    The software that is installed is determined by a custom profile. Using this method,
    you can automatically install groups of systems in an identical manner. The custom
    profile, along with other JumpStart configuration files, is located in the JumpStart
    configuration directory.


    # JumpStart Configuration Directory


    The JumpStart configuration directory contains the files for customizing a JumpStart
    installation. It provides a means to automate an installation’s system configuration
    phase for groups of similar systems. This directory can reside on a floppy disk,
    referred to as a *profile diskette*, or on a network server, referred to as a
    *profile server*. The profile server provides access to the custom JumpStart configuration
    files over the network and eliminates the need to create and distribute multiple
    profile diskettes when installing a large number of systems. The two basic types
    of files in the JumpStart directory are a rules file and one or more profile files.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_456_1.png)


    The Part II Exam (CX-310-012) continues to refer to the *profile file* as the
    *class file*, even though it was renamed way back in the Solaris 2.6 system documentation.
    Keep this in mind when you see JumpStart questions that refer to the class file.'
  merge: -1
  img_proc: true
- pgno: 457
  md: "# The Rules File\n\nThe rules file is a text file containing an entry, or rule,\
    \ for each system or group of systems to be automatically installed. Each rule\
    \ identifies the system (or group of systems) based on one or more attributes\
    \ and identifies a unique profile file that provides configuration details for\
    \ that system or group of systems.\n\nEach rule consists of one or more keywords\
    \ and values followed by the name of a begin script, the profile file, and the\
    \ finish script (all separated by tabs or spaces). Keywords (and associated values)\
    \ include the following:\n\n+   - **any**\n+   - **arch** (followed by a processor-type\
    \ value)\n+   - **disksize** (followed by a disk name value)\n+   - **hostaddress**\
    \ (followed by an IP address value)\n+   - **hostname** (followed by a hostname\
    \ value)\n+   - **memsize** (followed by a physical memory value)\n+   - **model**\
    \ (followed by a platform name value)\n\nOne or more of these keywords and associated\
    \ values are specified per rule to uniquely identify a system or group of systems.\n\
    \nFollowing the keywords and values is the name of a begin script. This is a Bourne\
    \ shell script that executes before installation begins. If a begin script is\
    \ not required, a hyphen should be used instead. Next is the name of a profile\
    \ file in the JumpStart configuration directory that provides configuration details\
    \ for that system or group of systems. Following the profile file is the name\
    \ of the finish script, which is a Bourne shell script executed after installation\
    \ is complete. If a finish script is not required, a hyphen should be used instead.\n\
    \nThe following example shows several entries from a rules file:\n\n```\nhostname\
    \ sample_host    -          host_class   set_root_pw\nnetwork 924.22.43.0 & \\\
    \\\n        karch sun4c    -          net924_sun4c  -\narch i386             \
    \ -          x86-class     -\nany  -                 -          any_machine  \
    \ -\n```\n\nThe first entry lists the JumpStart installation for the host named\
    \ sample_host. No begin script is specified, the host_class file is used as the\
    \ profile or class file, and the finish script set_root_pw is called after installation\
    \ to set the root account’s password."
  merge: -1
  img_proc: true
- pgno: 458
  md: 'The second entry is actually listed on two lines. The backslash (\\) character
    at the end of the first line continues the entry to the next line. For systems
    that are located on network 924.222.43.0 and are SPARC sun4c platforms, the net924_sun4c
    profile or class file is used. No begin or finish script is specified.


    The third entry is for all i386 or Intel-compatible platforms. The x86-begin script
    is executed first, and then the x86-class profile or class file is used to direct
    the installation. No finish script is specified.


    The fourth entry provides a default. Any systems not covered by the other rules
    are installed using the any_machine profile file. No begin or finish script is
    specified.


    # The Profile Files


    A profile (or class) file is a text file defining how to install the Solaris 8
    software on a system. Like the rules file, a profile file contains keywords and
    associated values that guide the installation, such as the following:


    +   - **boot_device** (followed by the partition to use as a boot device)

    +   - **cluster** (followed by the name of the software group to install, add,
    or delete)

    +   - **filesys** (followed by pathname and mount point of a remote file system
    to mount)

    +   - **install_type** (followed by the type of install: initial_install or upgrade)

    +   - **package** (followed by the name of a software package to add or delete)

    +   - **partitioning** (followed by the type of disk partitioning: default, existing,
    or explicit)

    +   - **root_device** (followed by the partition to use as the root device)

    +   - **system_type** (followed by the system type: standalone or server)


    The following lists the contents of the any_machine profile provided as a JumpStart
    sample on the Solaris 8 distribution CD:


    ```

    install_type   initial_install

    system_type    standalone

    partitioning   default

    cluster        SUNWCuser

    cluster        SUNWCXgl delete

    package        SUNWaudio add

    filesys        any 40 swap

    filesys        any 50 /opt

    ```'
  merge: -1
  img_proc: true
- pgno: 459
  md: 'The install_type entry must be specified as the first entry in a profile. This
    example identifies the installation as an initial instead of an upgrade. The system
    type is standalone with default disk partitioning. The End User Support software
    group or cluster will be installed, but the gxl cluster will be deleted and the
    audmo package will be added. For the file system layout, any partition will be
    used for swap (40MB), and any partition will be used for the /opt file system
    (50MB).


    # Validation


    Before you can use the rules file and profile files, you must validate them by
    using the check(1M) command (located on the Solaris 8 distribution CD under the
    Tools directory). If the rules file and all the profile files are set up correctly,
    a rules.ok file is created in the JumpStart configuration directory.


    # Booting the JumpStart Client


    When booted, the JumpStart client attempts to locate the rules and profile files
    associated with the system. If a floppy disk is mounted in the floppy disk drive
    containing the JumpStart configuration directory, the client will use it.


    Otherwise, the client will use a RARP broadcast to contact the in.rarpd daemon
    running on an install/boot server and obtain its client name or IP address based
    on its Ethernet address. Then the client will use BOOTP to contact the in.bootparamd
    daemon running on an install/boot server. The request includes the name of the
    client or IP address. Based on this information, the in.bootparamd daemon provides
    the boot parameters from /etc/bootparams. NIS, or NIS+. One of these parameters
    is install_config, which defines the profile server and path to the JumpStart
    configuration directory. Other parameters, including the name of the TFTP server
    that will provide the boot image (SPARC only) and the NFS server that will provide
    the distribution of the Solaris 8 software over the network, are also obtained
    with the same procedure. After the JumpStart Directory is located, the rules file
    determines the appropriate profile or class file to use. The details in the profile
    file are used to direct the installation.


    The install files will be obtained from the distribution CD mounted in a local
    CD-ROM drive or from an install server and path identified by the install boot
    parameter.'
  merge: -1
  img_proc: true
- pgno: 460
  md: "# # Practice Questions\n\n# ## Question 1\n\n+   Which of the following commands\
    \ is used to set up an install server?\n+   \n+   - a. `setup_install_server`\n\
    +   - b. `setup_install_server -b`\n+   - c. `install_server setup`\n+   - d.\
    \ `server_setup -i`\n\nAnswer a is correct. The **setup_install_server** command\
    \ is used to set up an install server. The **-b** command-line argument is used\
    \ to install a boot server. Therefore, answer b is incorrect. The commands in\
    \ answers c and d do not exist.\n\n# ## Question 2\n\n+   Which of the following\
    \ is a reason to set up a boot server on a system separate from an install server?\n\
    +   \n+   - a. A boot server cannot reside on an install server.\n+   - b. One\
    \ or more install clients are not on the same subnet as the install server.\n\
    +   - c. All install clients are not on the same subnet.\n+   - d. NIS or NIS+\
    \ cannot locate a boot server that resides on an install server.\n\nAnswer b is\
    \ correct. If one or more install clients are not on the same subnet as the install\
    \ server, you should set up a boot server on a system separate from the install\
    \ server. A boot server can reside on an install server. Therefore, answer a is\
    \ incorrect. The location of clients in relation to other clients does not determine\
    \ the need for boot servers; the location of clients in relation to the install\
    \ server determines the need for a separate boot server. Therefore, answer c is\
    \ incorrect. NIS and NIS+ do not locate anything; they serve only as databases\
    \ of information. Therefore, answer d is incorrect."
  merge: -1
  img_proc: true
- pgno: 461
  md: "# Question 3\n\nEnter the name of the command (without command-line arguments)\
    \ used to add install client information to an install or a boot server.\n\nThe\
    \ correct answer is **add_install_client**.\n\n# Question 4\n\n+   Which of the\
    \ following install methods can use over-the-network installation resources? (Select\
    \ all that apply.)\n+   \n+   - [ ] a. Custom JumpStart\n+   - [ ] b. Web Start\n\
    +   - [ ] c. JumpStart\n+   - [ ] d. Interactive installation\n\nAnswers a, b,\
    \ c, and d are correct. All four installation methods can use over-the-network\
    \ installation resources.\n\n# Question 5\n\n+   Which of the following are automatic\
    \ installation methods? (Select all that apply.)\n+   \n+   - [ ] a. SunInstall\n\
    +   - [ ] b. Custom JumpStart\n+   - [ ] c. Web Start\n+   - [ ] d. JumpStart\n\
    \nAnswers b and d are correct. Custom JumpStart and JumpStart are automatic installation\
    \ methods. SunInstall and Web Start are interactive installation methods. Therefore,\
    \ answers a and c are incorrect.\n\n# Question 6\n\nEnter the name of the command\
    \ used to add the contents of the Solaris 8 Software (2 of 2) CD or the Solaris\
    \ 8 Languages distribution CD to an install server.\n\nThe correct answer is **add_to_install**."
  merge: -1
  img_proc: true
- pgno: 462
  md: "# Question 7\n\n+   Which of the following files should be in a JumpStart configuration\
    \ directory?\n+   (Select all that apply.)\n+   \n+   - ☐ a. One or more JumpStart\
    \ profile files\n+   - ☐ b. `check`\n+   - ☐ c. `rules` file\n+   - ☐ d. `rules.ok`\
    \ file\n\nAnswers a, c, and d are correct. The profile files and the rules file\
    \ are the two types of files that must be created in the JumpStart configuration\
    \ directory. If they are set up correctly, the rules.ok file is created in the\
    \ JumpStart configuration directory. The check command, which is located on the\
    \ Solaris 8 distribution CD, must be executed to validate the rules and profile\
    \ files. Therefore, answer b is incorrect.\n\n# Question 8\n\n+   Match each `add_install_client`\
    \ command-line argument with its purpose.\n+   \n+   - ○ a. `-c` — 1. Specifies\
    \ the install server and path\n+   - ○ b. `-d` — 2. Specifies the profile server\
    \ and JumpStart configuration directory path\n+   - ○ c. `-p` — 3. Specifies client\
    \ is a DHCP client\n+   - ○ d. `-s` — 4. Specifies the server and path for the\
    \ sysidcfg file\n\nAnswers a-2, b-3, c-4, and d-1 are correct. The **-c server:path**\
    \ command-line argument specifies the profile server and JumpStart configuration\
    \ directory where the rules and profile (class) files reside. The **-d** command-line\
    \ argument specifies that the client will use DHCP to determine the IP address,\
    \ netmask, and so on. The **-p server:path** command-line argument specifies a\
    \ server and the full pathname to the sysidcfg file. The **-s server:path** command-line\
    \ argument specifies the install server and path to the install images."
  merge: -1
  img_proc: true
