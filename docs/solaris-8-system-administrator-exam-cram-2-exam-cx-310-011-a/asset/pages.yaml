- pgno: 256
  md: '# # The vi Editor


    The vi(1) command is a screen-oriented text editor. The following sections cover
    the three modes of operation, controlling the cursor position, manipulating text
    (add, delete, copy, and move), and search/replace functions.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_256_0.png)


    In this description of the vi text editor, I use the symbols < and > to define
    a key you should press on the keyboard. For example, <a> indicates that you should
    press the key labeled “a,” and <Enter> indicates that you should press the key
    labeled “Enter” or “Return.”


    # ## Modes of Operation


    The vi editor has three modes of operation:


    +   - Command

    +   - Input

    +   - Last Line


    Command mode is the initial and default mode of operation. In this mode, file
    navigation is supported so that you can view different parts of the file. You
    control the view by using commands to scroll the file forward or backward (vertically
    on the screen) and to move between the left and right side of the display. Character,
    word, and line deletion is also supported in Command mode.


    Input mode allows text to be added, deleted or modified. This mode provides a
    variety of commands to manipulate a file’s text contents.


    Last Line mode supports the input of commands to save changes, perform searches,
    and execute other ex(1) and ed(1) commands.


    # ## Command Mode


    The main functions of Command mode are navigation and deletion. Navigation enables
    you to position the cursor at a certain location within the file. You can then
    perform deletion or Input mode operations (add or modify) on the file contents.


    # ### Cursor Positioning


    Table 10.2 lists the commonly used cursor-positioning keyboard sequences. See
    the vi(1) manual page for additional commands.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '| Table 10.2 Cursor-Positioning (Command Mode) Keyboard Sequences for the vi
    Editor |  |

    |---|---|

    | **Sequence** | **Description** |

    | `<up arrow>` | Moves the cursor up one line |

    | `<down arrow>` | Moves the cursor down one line |

    | `<left arrow>` | Moves the cursor left one character |

    | `<right arrow>` | Moves the cursor right one character |

    | `<h>` | Moves the cursor left one character |

    | `<j>` | Moves the cursor down one line |

    | `<k>` | Moves the cursor up one line |

    | `<l>` | Moves the cursor right one character |

    | `<Ctrl><f>` | Moves forward an entire screen |

    | `<Ctrl><b>` | Moves backward an entire screen |

    | `<Ctrl><d>` | Moves forward half a screen |

    | `<Ctrl><u>` | Moves backward half a screen |


    Note that there are two sets of single character/line cursor-positioning commands.
    One set uses the dedicated cursor (arrow) keys, and the other uses lowercase alphabet
    keys. These dual commands allow the vi text editor to be used with keyboards that
    do not have cursor keys or for some reason have cursor keys not recognized by
    the vi text editor. Also note that you can enter a number before each cursor-positioning
    command to position the cursor by multiple lines or characters at a time. For
    example, **20j** moves the cursor down 20 lines and **10<right arrow>** moves
    the cursor 10 characters to the right.


    # Text Deletion


    Deletion is also supported in Command mode. Table 10.3 lists the commonly used
    text-deletion keyboard sequences.


    | Table 10.3 Text-Deletion (Command Mode) Keyboard Sequences for the vi Editor
    |  |

    |---|---|

    | **Sequence** | **Description** |

    | `<x>` | Deletes the current character |

    | `dd<w>` | Deletes the current word |

    | `dd<d>` | Deletes the current line |


    As with the cursor-positioning commands, you can enter a number before each of
    these text-deletion commands to delete characters, words, or lines at'
