- pgno: 361
  md: '# Temporary File System (TMPFS)


    The Temporary File System is a memory-based file system used to improve the performance
    of file system reads and writes (because memory input/output is much faster than
    disk-based UFS input/output). Files in a TMPFS instance are not permanent and
    are lost when the file system is unmounted or the system is rebooted. Typically,
    TMPFS is used for temporary files (such as intermediate files created when a program
    is compiled). It can significantly speed up activities that require creating,
    reading, writing, and deleting temporary files.


    The Solaris 8 operating system provides two TMPFS instances. The first is /tmp,
    which can be used by any user account or process that needs to use temporary files.
    The /tmp directory is owned by the root account and has an access mode of 1777
    (read/write/execute for owner/group/other with the sticky bit set; see Chapter
    5, “System Security and File Permissions”). The other TMPFS instance is the /var/run
    directory, which is used for temporary system files that are not needed across
    system reboots. This directory is owned by the root account and has an access
    mode of 755 (read/write/execute for owner and read/execute for group/other).


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_361_0.png)


    Be sure you understand TMPFS and its use. Also be familiar with the two instances
    automatically provided by the Solaris 8 operating system.


    # Loopback File System (LOFS)


    The Loopback File System is a memory-based file system used to provide alternative
    pathnames to existing data. That is, the same copy of the data can be accessed
    by using two different pathnames. Any file systems subsequently mounted in the
    original file system also appear in the LOFS. However, any subsequent file systems
    mounted in the LOFS do not appear in the original file system.


    # Cache File System (CacheFS)


    The Cache File System is a memory-based file system used to improve the performance
    of remote file systems and slow devices, such as CD-ROM drives. It stores data
    previously read from the remote file system or slow device in the CacheFS on the
    local system. When that data is read again, the copy in the local CacheFS is used
    instead of the data on the remote file system or slow device.'
  merge: -1
  img_proc: true
- pgno: 362
  md: 'The CacheFS is frequently used with the Network File System (NFS). It is described
    in more detail in Chapter 18, “Network File System.”


    # ## Swap Space


    Solaris 8 supports the concept of virtual memory by using space on a hard disk
    to temporarily store the contents of memory not currently being used. When the
    contents are needed, the system swaps out some other area of memory to the swap
    file, and then swaps in the requested contents.


    As long as sufficient memory is available, swap space is not used. When the load
    on the system increases and resources (mainly memory) are in high demand, swapping
    may begin to occur.


    Keep in mind that pseudo file systems (such as the /tmp TMPFS instance) use memory.
    As more /tmp space is used, the system will be forced to make more use of the
    swap space. Heavy use of the /tmp TMPFS instance could cause the system to run
    out of swap space.


    # ## Default Swap Space


    When Solaris 8 is initially installed, a partition on a hard disk is defined as
    the default swap space. Its size is based on the amount of physical memory. Table
    16.3 lists the recommended swap space sizes. The Solaris installation programs
    use these recommendations to determine the default size of the swap space.


    | Table 16.3 Recommended Swap Space Sizes |

    |---|

    | **Equipped Memory** | **Recommended Swap Space Size** |

    | Less than 64MB | 32MB |

    | 64 to 127MB | 64MB |

    | 128 to 511MB | 128MB |

    | 512MB or greater | 256MB |


    If a system needs more swap space because additional memory is added or the system
    is heavily loaded, the size of the swap space partition cannot be increased without
    reinstalling Solaris 8 and resizing the swap space partition. However, you can
    use available space from other file system partitions to add swap space.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# Adding More Swap Space


    The mkfile(1M) command can configure additional swap space by using available
    space from mounted partitions. This command creates a file of a specified size
    that internally has the appropriate layout. You can then use the swap(1M) command
    to add the file to the system swap space.


    The mkfile command expects at least two command-line arguments. The first is a
    number specifying the file size. The size should be followed by k or K for kilobytes,
    b or B for blocks, or m or M for megabytes, to identify the appropriate scale
    for the size. Be sure you do not place a space between the size and the scale.
    If a scale is not specified, the size is assumed to be in bytes. The second command-line
    argument is the filename. You can create more than one file of the specified size
    by listing multiple filenames as command-line arguments, separated by spaces.
    Two other command-line arguments are supported: -n, which indicates that the disk
    space should be allocated as needed up to the specified size instead of all being
    allocated when the file is created), and -v, which specifies verbose reporting
    mode (filenames and sizes are listed).


    You can add a swap space file (or swap file) to the system swap space by using
    the **swap -a** command. At a minimum, the filename must be specified as a command-line
    argument. Be sure to use the full (absolute) pathname for the file. To activate
    swap space files when the system is rebooted, list them in the /etc/vfstab file.
    The /etc/vfstab entry should contain the full pathname to the swap file and be
    identified as a swap file system. The /sbin/swapadd script is executed for each
    swap file system listed in the /etc/vfstab file during system reboot.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_363_0.png)


    Understand the procedure and commands used to add, delete, and list swap space.


    # Administering Swap Space


    In addition to being used to add swap space, the **swap** command supports command-line
    arguments to list swap space (-l), list swap statistics (-s), and delete swap
    files (-d). The following example creates a 32MB swap file, adds to the system
    swap space, and uses the **swap** command to administer the swap space:


    ```

    ```text

    # swap -l

    swapfile             dev  swaplo blocks   free

    /dev/dsk/c0d0s1      102,1      8 1049320 1049320

    ```

    ```'
