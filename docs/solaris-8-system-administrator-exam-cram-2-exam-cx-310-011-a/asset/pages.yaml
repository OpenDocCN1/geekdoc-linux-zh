    # Remote Copy


    Two commands are available to copy files between systems: the ftp(1) command and
    the rcp(1) command.


    # The ftp Command


    The ftp command copies one or more files between a local system and a remote system
    over the network. The user must provide a valid user account name and password
    as defined on the remote system because the ftp command uses standard Unix login/password
    authentication.


    The remote system’s hostname or IP address is typically specified as a command-line
    argument. If this address is not specified, the ftp command is placed in an interactive
    mode. The remote system will prompt for a user account name and password.


    After you’ve logged in to the remote system, you can transfer files between systems
    by issuing the appropriate ftp subcommand. To copy a file from the local system
    to the remote system, use the put subcommand. To copy a file from the remote system
    to the local system, use the get subcommand. Table 10.8 lists the commonly used
    ftp subcommands.


    **Table 10.8  Commonly Used ftp Subcommands**


    | Subcommand | Description |

    |---|---|

    | ? | Lists ftp subcommands. |

    | ascii | Sets the transfer mode to ASCII (performs end-of-line character mapping).
    ASCII is the default mode. |

    | binary | Sets the transfer to binary (does not perform end-of-line character
    mapping). |

    | *cd path* | Changes the remote current directory to *path*. |'
  merge: -1
  img_proc: true
- pgno: 264
  md: '**Table 10.8. Commonly Used ftp Subcommands (continued)**


    | Subcommand | Description |

    |---|---|

    | **get remote local** | Copies the file *remote* from the remote system to the
    file *local* on the local system. If *local* is not specified, the file is given
    the same name on the local system. |

    | **hash** | Prints a pound (#) character for every 8,912 bytes sent or received.
    |

    | **help subcommand** | Displays a short description of *subcommand*. |

    | **lcd path** | Changes the local current directory to *path*. |

    | **ls** | Lists the contents of the remote directory. |

    | **mget meta** | Copies multiple files from the remote system to the local system.
    A set of files is specified by *meta*, which is an expression with one or more
    metacharacters. |

    | **mput meta** | Copies multiple files from the local system to the remote system.
    A set of files is specified by *meta*, which is an expression with one or more
    metacharacters. |

    | **put local remote** | Copies the file *local* from the local system to the
    file *remote* on the remote system. If *remote* is not specified, the file is
    given the same name on the remote system. |

    | **quit** | Exits the ftp command. |


    The following example uses the ftp command to access the remote system solaris8
