    Like the shown command, the **chgrp** command supports a recursive command-line
    argument, **-R**. When you use it to change a directory’s group ownership, the
    group ownership of any files or subdirectories under the directory also changes.


    If the **chgrp** command is used by an account other than root that does not have
    the appropriate permissions and the file has the setuid special permission set,
    and/or the setgid special permission, the setuid and/or the setgid special permission
    is cleared. This action prevents a user from setting up a setuid and/or setgid
    file, changing the ownership to someone else, and then using the file to gain
    access to another user and/or group account.


    As an enhanced security feature of Solaris 8, use of the **chgrp** command is
    restricted by requiring the user account attempting to change group ownership
    to be a member of the new group. You can remove this restriction by clearing the
    following kernel parameter in the /etc/system file and rebooting the system:


    ```

    ```text

    set rstchown = 0

    ```

    ```


    Setting **rstchown** to 1 and rebooting the system will enforce the restriction
    again.


    # Displaying File Permissions and Ownership


    The **ls(1)** command displays file permissions and ownership. It supports a wide
    variety of command-line arguments, described in Table 5.5, to display and sort
    almost everything anyone would want to know about directories and files.'
