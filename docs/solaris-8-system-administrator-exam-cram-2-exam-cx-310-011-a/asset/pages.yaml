- pgno: 486
  md: '+   59. a

    +   60. root

    +   61. b, c, d


    # Question 1


    The correct answer is **add_to_install_server**.


    # Question 2


    Answers a, b, c, and d are correct. DiskSuite supports concatenated virtual devices
    and RAID levels 0, 1, and 5. DiskSuite does not support RAID level 10. Therefore,
    answer e is incorrect.


    # Question 3


    Answer c is correct. The **add_install_client** command is used to set up a system
    to be installed over the network. The commands in the other answers do not exist.


    # Question 4


    Answer a is correct. The hosts: *dns nisplus files* entry causes DNS, then NIS+,
    and then /etc files to be searched when trying to resolve a hostname. The *hosts
    files dns* has all the name services, but in the incorrect order; the search order
    is from left to right. Therefore, answer b is incorrect. Answers c and d use an
    invalid keyword (**ipaddress**) and, therefore, are incorrect.


    # Question 5


    Answers a, b, c, and d are correct. system sharing an NFS resource can be identified
    by either hostname or IP address. If the file system type is not specified by
    using the **-F** command-line argument, NFS is assumed. NFS-specific options can
    be specified by using the **-o** command-line argument.'
  merge: -1
  img_proc: true
- pgno: 487
  md: '# Question 6


    Answer b is correct. A boot server can reside on an install server. Therefore,
    answer a is incorrect. The location of clients in relation to other clients does
    not determine the need for boot servers. It is the location of the clients in
    relation to the install server that determines the need for a separate boot server.
    Therefore, answer c is incorrect. NIS and NIS+ do not locate things, but serve
    only as a database of information. Therefore, answer d is incorrect.


    # Question 7


    Answers a and c are correct. **ptree** and **ptime** are proc tools. **pwd** is
    used to display the current working directory. The proc tool equivalent is the
    **pwdx** command. Therefore, answer b is incorrect. The proc tool command to list
    signal actions is **psig**, not **psignal**. Therefore, answer d is incorrect.


    # Question 8


    Answer a is correct. **yppush** is used to propagate an updated NIS map to NIS
    slave servers. **ypxfr** is used to propagate a new map. Therefore, answer d is
    incorrect. The commands in answers b, c, and e do not exist.


    # Question 9


    The correct answer is *NFS client*.


    # Question 10


    Answers a-7, b-4, c-2, d-5, e-1, f-6, and g-3 are correct. The layers of the OSI
    Network Model from highest to lowest are Application, Presentation, Session, Transport,
    Network or Internet, Data Link, and Physical.'
  merge: -1
  img_proc: true
- pgno: 488
  md: '# Question 11


    Answers b and d are correct. The *make* command is used when updating a default
    map. The *yppush* command is used for propagating an updated non-default map.
    The text file is used to add a new map. Therefore, answer a is incorrect. Likewise,
    the *makedbm* command is used for new maps. Therefore, answer c is incorrect.


    # Question 12


    Answers a, b, and c are correct. If more than one NFS server provides the same
    resource, as in answer c, multiple servers can be listed (separated by spaces).
    The first available resource is used. /- nfsserver:/usr/data does not provide
    a valid mount point. Therefore, answer d is incorrect. The format for a direct
    map entry is mount point, options, and then resource. The format of answer e is
    mount point, resource, and then options. Therefore, answer e is incorrect.


    # Question 13


    Answers a, b, c, and d are correct. Virtual disk management systems provide all
    these features.


    # Question 14


    Answers a, b, c, d, and e are correct. A rules entry consists of one or more rule
    keywords and rule values followed by the name of a begin script and then a profile
    script and an end script. The begin and end scripts are optional. If either is
    not specified, a hyphen (-) is used in place of the script name.


    # Question 15


    Answer c is correct. The AdminSuite Host Manager can add support for a network
    client. The Host Manager cannot be used to mount a disk. Therefore, answer a is
    incorrect. It also cannot edit any NIS+ table or boot a network client. Therefore,
    answers b and d are incorrect.'
  merge: -1
  img_proc: true
- pgno: 489
  md: '# Question 16


    Answers c and f are correct. Changes to indirect maps do not require running the
    **automount** command. Changes to the auto_master and direct maps require that
    the **automount** command be executed manually. Therefore, answers a, b, d, and
    e are incorrect.


    # Question 17


    Answers a, b, and d are correct. The client’s hostname, IP address, and Ethernet
    address need to be added to NIS/NIS+ to support JumpStart installation. The system
    locale is not required to install a client. Therefore, answer c is incorrect.
    Because the client information is added to the appropriate name service, you don’t
    need to identify the name service. Therefore, answer e is incorrect.


    # Question 18


    Answer c is correct. The **ypstart** command is used to start the **ypbind** program.
    **ypinit** is used to initialize NIS servers and clients. Therefore, answer a
    is incorrect. **ypsetup** is used to stop the **ypbind** program. Therefore, answer
    b is incorrect. **ypcrank** does not exist. Therefore, answer d is incorrect.
    **ypwhich** is used to identify the NIS server. Therefore, answer e is incorrect.


    # Question 19


    Answer c is correct. The user source facility is used for messages from user programs.
    If a source is not specified, user is assumed. The mail source is used for messages
    related to mail. Therefore, answer a is incorrect. The auth source is used for
    messages related to login authentication. Therefore, answer b is incorrect. The
    kern source is used for messages related to the kernel. Therefore, answer d is
    incorrect.


    # Question 20


    The correct answer is *tables*.'
  merge: -1
  img_proc: true
- pgno: 490
  md: '# Question 21


    Answers b and d are correct. The -c command-line argument and the full pathname
    of the cache directory are required to create a CacheFS configuration. The NFS
    server name and resource, along with the name of the local host, cannot be specified
    by using command-line arguments. Therefore, answers a and e are incorrect. The
    -o command-line argument can be used to specify options but is not required. Therefore,
    answer c is incorrect.


    # Question 22


    Answer d is correct. The Ethernet address is six 8-bit bytes or 48 bits long.
    It can be displayed by using the ifconfig command. The Ethernet address is six
    (not five) 8-bit bytes long, and the ping command cannot be used to display the
    Ethernet address of a network interface. Therefore, answers a, b, and c are incorrect.


    # Question 23


    Answers a and c are correct. SunInstall and Web Start are interactive installation
    methods. Custom JumpStart and JumpStart are automatic installation methods. Therefore,
    answers b and d are incorrect.


    # Question 24


    Answers a, c, and d are correct. -c, -d, and -o are valid command-line arguments
    for cfsadmin. The -s command-line argument, not -C, is used to perform a consistency
    check. Therefore, answer b is incorrect.


    # Question 25


    Answer c is correct. Although some of the name services use ASCII files and/or
    provide both hostname and IP address resolution, DNS is the only one used on the
    Internet. Therefore, answers a, b, and d are incorrect.'
  merge: -1
  img_proc: true
- pgno: 491
  md: '# Question 26


    Answer b is correct. A striped virtual file system is composed of several partitions
    that are allocated and used in an interleaved fashion. RAID 1 is a configuration
    that uses mirroring in an identical (not interleaved) fashion. Therefore, answer
    a is incorrect. A concatenated virtual file system uses one partition at a time.
    Therefore, answer c is incorrect. Hot spare is not a type of virtual file system.
    Therefore, answer d is incorrect.


    # Question 27


    Answers a, c, and d are correct. If a filename is specified, the message is appended
    to the file. If a hostname is specified, the message is sent to the host. If a
    user account name is specified, the message is displayed on the standard output
    of the logged-in user. The only other valid action is an asterisk (*), which causes
    the message to be displayed on the standard output device of all logged-in user
    accounts. Therefore, answer b is incorrect.


    # Question 28


    Answers a and c are correct. The **share** command, used without arguments, lists
    all locally shared NFS resources. The **dfshares** command can be used to list
    locally or remotely shared resources. The **dfmounts** command can be used to
    list locally or remotely mounted resources. Therefore, answer b is incorrect.
    The **mountall** command is used to mount local file systems. Therefore, answer
    d is incorrect. The **mount** command is used to mount or list currently mounted
    local file systems and NFS resources. Therefore, answer e is incorrect.


    # Question 29


    Answer b is correct. To generate the data files used to create NIS maps, you should
    copy the /etc files to a different directory and clean up the copy. The /etc files
    can be modified, but the editing might adversely affect the system and is not
    the best approach. Therefore, answer a is incorrect. The **makedbm** and **buildm**
    commands do not exist. Therefore, answers c and d are incorrect.'
  merge: -1
  img_proc: true
- pgno: 492
  md: '# Question 30


    The correct answer is *rules*.


    # Question 31


    The correct answer is *striping*.


    # Question 32


    The correct answer is **cachefslog**.


    # Question 33


    The correct answer is **unshare**.


    # Question 34


    The correct answer is **roleadd**.


    # Question 35


    The correct answer is *FNS*.


    # Question 36


    Answer c is correct. The rank order of severity levels is emerg, alert, crit,
    err, warning, notice, info, debug, and none.


    # Question 37


    Answer a is correct. The **ypinit -m** command is used to configure an NIS master.
    **ypinit -c** is used to configure an NIS client, and **ypinit -s** is used to'
  merge: -1
  img_proc: true
- pgno: 493
  md: 'configure an NIS slave server. Therefore, answers b and c are incorrect. The
    commands in answers d and e do not exist.


    # Question 38


    Answer b is correct. The /etc/vfstab file is used to automatically mount NFS resources
    during system boot or when the **mountall** command is used. The /etc/dfs/dfstab
    file is used to automatically share NFS resources. Therefore, answer a is incorrect.
    The /etc/mnttab file lists the currently mounted file systems and NFS resources.
    Therefore, answer c is incorrect. The /etc/dfs/sharetab file lists the NFS resources
    currently shared. Therefore, answer d is incorrect.


    # Question 39


    Answer b is correct. The /dev/vx/dsk pathname is associated with Volume Manager.
    /dev/dsk is associated with the standard file systems. Therefore, answer a is
    incorrect. /dev/md/dsk is associated with DiskSuite virtual file systems. Therefore,
    answer c is incorrect. The pathname in answer d does not exist.


    # Question 40


    The correct answer is *ethers*.


    # Question 41


    The correct answer is **makedbm**.


    # Question 42


    Answer c is correct. The /etc/defaultdomain file is used to store the default
    system domain. If this file is used, the domain name does not have to be defined
    after every reboot. Therefore, answer a is incorrect. The **domainname** command
    does not support a **-p** command-line argument. Therefore, answer b is incorrect.'
  merge: -1
  img_proc: true
- pgno: 494
  md: '# ## Question 43


    Answer a is correct. The bootparams file contains a list of the servers (and paths)
    that provide boot, root, and swap areas for network/install clients. Either contains
    network client Ethernet addresses and associated hostnames. Therefore, answer
    b is incorrect. timezone contains network client time zone information. Therefore,
    answer c is incorrect. hosts contains system hostnames and IP addresses. Therefore,
    answer d is incorrect. vfstab contains a list of file systems to be mounted automatically.
    Therefore, answer e is incorrect.


    # ## Question 44


    The correct answer is *WebNFS*.


    # ## Question 45


    Answer c is correct. The **fsck** command is used to check and repair a file system.
    The **mount** command is used to mount the file system. Therefore, answer a is
    incorrect. The **newfs** command is used to create a file system after the disk
    has been formatted. Therefore, answer b is incorrect. The **format** command is
    used to format a file system. Therefore, answer d is incorrect.


    # ## Question 46


    Answer d is correct. The NFS server program is started at run level 3. Run level
    0 is the power down state; services are being shut down in this state. Therefore,
    answer a is incorrect. Run level 1 is used for administration, and users are not
    allowed to access the system. Therefore, answer b is incorrect. All network services
    except the NFS server are started at run level 2. Therefore, answer c is incorrect.
    Run level 6 is the reboot state, and the system is being restarted. Therefore,
    answer e is incorrect.'
  merge: -1
  img_proc: true
- pgno: 495
  md: '# Question 47


    Answers a, b, c, and d are correct. From smallest to largest, the software groups
    are End User Support, Developer System Support, Entire Distribution, and Entire
    Distribution Plus OEM System Support.


    # Question 48


    The correct answer is *Solaris Management Console*.


    # Question 49


    Answers c and d are correct. Volume Manager includes performance analysis tools
    and dynamic online tuning, but DiskSuite does not. Both Volume Manager and DiskSuite
    provide a graphical administration tool and command-line utilities. Therefore,
    answers a and b are incorrect.


    # Question 50


    The correct answer is **-b**.


    # Question 51


    The correct answer is */etc/syslog.conf*.


    # Question 52


    Answer c is correct. AdminSuite includes a Host Manager that is used to manage
    network clients, not a Network Client Manager. Database Manager, Storage Manager,
    and Serial Port Manager are all included in AdminSuite. Therefore, answers a,
    b, and d are incorrect.'
  merge: -1
  img_proc: true
- pgno: 496
  md: '# Question 53


    Answer d is correct. The /etc/dfs/sharetab file should always contain the currently
    shared NFS resources. The files in answers a and b do not exist. The /etc/dfs/dfstab
    file contains resources that should be shared automatically during system boot
    or when the **shareall** command is used. Therefore, answer c is incorrect.


    # Question 54


    Answer a is correct. The pathname /dev/dsk is associated with standard Solaris
    file systems. /dev/vx/dsk is associated with Volume Manager virtual file systems.
    Therefore, answer b is incorrect. /dev/md/dsk is associated with DiskSuite virtual
    file systems. Therefore, answer c is incorrect. The pathname in answer d does
    not exist.


    # Question 55


    The correct answer is *syslog* or *syslogd*.


    # Question 56


    Answers a, b, c, and d are correct. All these keywords can be defined in a profile
    file. The **install_type** keyword must be defined and must be the first entry
    in the profile file.


    # Question 57


    Answer b is correct. Intel clients typically obtain a bootable image from a local
    disk or local CD-ROM. Only SPARC clients use TFTP to obtain a bootable image.
    Therefore, answers a and c are incorrect. Intel clients can be configured to use
    the Remote Program Load (RPL). The subnet has no impact on the use of TFTP. Therefore,
    answer d is incorrect.'
  merge: -1
  img_proc: true
- pgno: 497
  md: '# ## Question 58


    Answers a-4, b-5, c-1, d-2, and e-3 are correct. The layers of the TCP/IP Network
    Model from highest to lowest are Application, Transport, Network or Internet,
    Data Link, and Physical.


    # ## Question 59


    Answer a is correct. Only the read-only (ro) NFS mount option should be specified
    to set up failover. Therefore, answers b, c, and d are incorrect.


    # ## Question 60


    The correct answer is **root**. The **root-list** command-line argument is used
    to specify a list of clients that have root access.


    # ## Question 61


    Answers b, c, and d are correct. The **swap** command is used to add, list, and
    delete swap space. The **mkfile** command is used to create swap space. Therefore,
    answer a is incorrect.'
  merge: -1
  img_proc: true
