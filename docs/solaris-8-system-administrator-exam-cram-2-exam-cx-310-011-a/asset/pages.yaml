    \ 8 x86 **find** command patch to a diskless client that uses a root image stored\
    \ under the /export/root/client directory on the current system requires the following\
    \ command:\n\n```\n```text\npatchadd -R /export/root/client /var/spool/patch/110906-01\n\
    ```\n```"
