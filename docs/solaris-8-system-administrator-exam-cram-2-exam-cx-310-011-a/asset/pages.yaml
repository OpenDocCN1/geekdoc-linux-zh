- pgno: 90
  md: 'To apply a patch to an operating system (OS) service, use the **-S** command-line
    argument and specify the service. (See Chapter 13, “The Solaris Network Environment,”
    for information about OS servers.) For example, applying the Solaris 8 find command
    patch to an x86 Solaris 8 OS service named Solaris_8x86 on the OS server requires
    the following command:


    ```

    patchadd -S Solaris_8x86 /var/spool/patch/110906-01

    ```


    To apply a patch to the mini root of a net install image (the image used to install
    a system over the network), use the **-C** command-line argument and specify the
    pathname to the net install image. For example, applying the Solaris 8 find command
    patch to an x86 Solaris 8 image on the Solaris_8x86 net install server requires
    the following command:


    ```

    patchadd -C /export/Solaris_8x86/Tools/Boot

    /var/spool/patch/110906-01

    ```


    Multiple patches can be installed by using the **patchadd** command with the **-M**
    command-line argument and by specifying a directory where all the patches are
    located and a list of the patch numbers. For example, to install patches 108529-05,
    108653-23, and 108876-07, which are all located in the /var/spool/patch directory,
    you can use the following command:


    ```

    patchadd -M /var/spool/patch 108529-05 108653-23 108876-07

    ```


    Instead of listing several patches on the command line, you can create a text
    file containing a list of patches. Then specify the name of the text file on the
    command line in place of all the individual patch names.


    For example, to install the 108529-05, 108653-23, and 108876-07 patches located
    in the /var/spool/patch directory, create a text file with the name /var/spool/patch/patchlist
    that contains the name of the three patches (separated by spaces or returns).
    Then use the following command to install the patches:


    ```

    patchadd -M /var/spool/patch /var/spool/patch/patchlist

    ```


    The **-M** command-line argument can be used to install multiple patches for client,
    services, or install servers by specifying the previously described **-R**, **-S**,
    or **-C** command-line argument. This argument should be specified after the **-M**
    patch spool directory and patch names or patch list command-line arguments. See
    the previous examples of the **patchadd** command for use of these arguments.


    By default, any files that will be changed as a result of the patch’s installation
    are copied to one or more backup directories. If necessary, you can then remove
    the patch and return the system to its state before the patch was'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'installed. However, if you specify the **-d** command-line argument on the
    **patchadd** command, the files are not backed up, and the patch cannot be removed.


    The default backup directories, located under /var/sadm/pkg, are based on the
    installed package or packages being modified by the patch and the patch number.
    For example, the x86 find command patch (110906-01) modified the SUNWcsu package.
    Any files changed by installing this patch will be saved under the /var/sadm/pkg/SUNWcsu/110906-01
    directory. You can specify a different backup directory by using the **-B** command-line
    argument.


    The **patchadd** command will fail if any of the following occur:


    +   - A package being patched is not installed or is only partially installed.

    +   - The patch requires another patch that is not installed.

    +   - The patch is incompatible with another patch already installed.

    +   - The current version or a higher version of the patch is already installed.

    +   - The architecture of the patch and the system do not match.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_91_0.png)


    # Determining Which Patches Are Installed


    Two commands can be used to generate a list of installed patches for a stand-alone
    system:


    +   - **showrev -p**

    +   - **patchadd -p**


    Both commands generate almost identical lists. The following example illustrates
    the use of the **showrev(1M)** command (the output is formatted for readability):


    ```

    ```text

    $ showrev -p

    Patch: 110906-01

    Obsoletes:

    Requires:

    Incompatibles:

    Packages: SUNWcsu

    Patch: 108632-06

    Obsoletes:

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 92
  md: '```

    Requires: 109000-01, 109038-01, 109067-02, 108994-01, 108969-01

    Incompatibles:

    Packages: SUNWcsr, SUNWnisr, SUNWncar

    $

    ```


    When a patch is installed, information about the patch is added to the pkginfo
    file of each package the patch updates. The pkginfo files are located in subdirectories
    under the /var/sadm/pkg directory. The **showrev** and **patchadd** commands extract
    and format information from the pkginfo files. In addition to the patch number
    and packages the patch updates, the commands list any dependency information,
    such as other required patches or incompatible patches.


    You can use the **patchadd** command to display a list of installed patches for
    other system configurations by using the **-C**, **-R**, and **-S** command-line
    arguments, as previously described. For example, to display the patches applied
    to an OS service named Solaris8x86, you can use the following **patchadd** command:


    ```

    patchadd -S solaris8x86 -p

    ```


    To display a list of patches applied to a particular package, use the **pkgparam**
    command. The following example lists the patches applied to the SUNWcsr package:


    ```

    $ pkgparam SUNWcsr PATCHLIST

    108529-01 108286-01 108980-01 108980-04 108986-01 108990-02

    109010-01 109020-01 109028-01 109044-02 109046-02 109092-01

    109138-01 109146-01 109148-01 109150-01 109278-01 109565-02

    109876-02 109004-01 109006-01 109008-01 109012-01 109016-01

    109018-01 109022-01 109024-01 109032-01

    109304-01 109036-01

    109306-01

    $

    ```


    # Removing a Patch


    The **patchrm** command is used to remove or back out a patch by specifying the
    patch number as a command-line argument. This command also supports the system
    configurations that the **patchadd** command supports. You use the same **-C**,
    **-R**, and **-S** command-line arguments, as previously described. For example,
    to remove patch 110906-01 from the bootable root image of a diskless client named
    client5, you can use the following **patchrm** command:


    ```

    patchrm -R /export/root/client5 110906-01

    ```'
