    # Removing Directories by Using the rmdir or rm Command


    Either the **rmdir(1)** or **rm(1)** command can be used to remove directories.
    The **rmdir** command removes the directories specified as one or more command-line
    arguments (separated by spaces). If a directory contains files or other directories,
    the remove will fail. If the **-p** command-line argument is specified, all parent
    directories that are empty are also removed. The **-s** command-line argument
    is used to suppress error messages, as shown in this example:


    ```

    ```text

    # rmdir /test/Solaris/8

    # ls -lR /test

    /test:

    total 2

    drwxr-xr-x 2 root     other      512 Apr 13 19:15 Solaris


    /test/Solaris:

    total 0


    # rmdir -p /test/Solaris


    # ls -lR /test

    /test: No such file or directory

    #

    ```

    ```


    The **rm(1)** command also removes one or more directories specified as command-line
    arguments (separated by spaces). Directories can be removed only if the **-R**
    or **-r** command-line argument is specified. Either command-line argument recursively
    removes all files and directories *under* the directory being removed. Note that
    you can use the **rmdir** command to remove parent directories (directories *above*
    the directory being removed), as shown in this example:


    ```

    ```text

    # mkdir -p /test/Solaris/8


    # rm /test

    rm: /test is a directory


    # rm -r /test


    # ls -lR /test

    /test: No such file or directory

    #

    ```

    ```


    The **-i** command-line argument provides interactive control over the remove
    command:


    ```

    ```text

    # mkdir -p /test/Solaris/8


    # rm -r -i /test

    ```

    ```'
