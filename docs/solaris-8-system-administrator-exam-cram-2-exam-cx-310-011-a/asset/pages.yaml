- pgno: 62
  md: "**sgml** are passed through an SGML preprocessor before being formatted by\
    \ the **nroff** command.\n\nAny searches for a man page are basically brute force—that\
    \ is, each directory containing man pages is searched until the specified man\
    \ page is located. To speed up displaying and searching, you can generate and\
    \ store a preformatted version of the man pages. The preformatted version is used\
    \ whenever possible. As part of the preformatting process, an index of man page\
    \ keywords is also generated. This index is referred to as the *windex* database.\
    \ The **catman(1M)** command formats the man pages and generates the windex database.\
    \ Note that depending on the speed of the system CPU and current load, the **catman**\
    \ command might take a significant amount of time to format all the man pages.\n\
    \nIn addition, having the windex database enables you to search the man pages\
    \ for keywords and files. The following example shows using the **-f** command-line\
    \ argument to search the man pages for references to the /etc/passwd file and\
    \ the **-k** command-line argument to search for the keyword *passwd*:\n\n```\n\
    ```text\n# man -f /etc/passwd\npasswd          passwd (1)          - change login\
    \ password and\n                                      password attributes\n  \
    \                                    password file\n\npasswd          passwd (4)\
    \          - password file\n\n# man -k passwd\nd passwd        d passwd (4)  \
    \     - dial-up password file\ngetpw           getpw (3c)          - get passwd\
    \ entry from UID\nkpasswd         kpasswd (1)         - change a user's Kerberos\n\
    \                                      password\nnispasswd       nispasswd (1)\
    \       - change NIS+ password information\nnispasswd       rpc.nispasswd (1m)\
    \ - NIS+ password update daemon\npasswd          passwd (1)          - change\
    \ login password and\n                                      password attributes\n\
    passwd          passwd (4)          - password file\npwconv          pwconv (1m)\
    \         - installs and updates\n                                      /etc/shadow\
    \ file information\n                                      from /etc/passwd\nrpc.nispasswd\
    \   rpc.nispasswd (1m) - NIS+ password update daemon\nrpc.ypasswdd    rpc.ypasswdd\
    \ (1m)  - server for modifying NIS\n                                      password\
    \ file\nyppasswd        yppasswd (1)      - change your network password\n   \
    \                                   in the NIS database\nyppasswdd       rpc.yppasswdd\
    \ (1m) - server for modifying\n                                      NIS password\
    \ file\n#\n```\n```\n\nYou can use the **-d** command-line argument to view the\
    \ search process as the **man** command attempts to locate the specified man page.\
