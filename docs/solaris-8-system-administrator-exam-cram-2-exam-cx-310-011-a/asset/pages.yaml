  md: '| Table 5.5 Command-Line Arguments for the ls Command (continued) |  |

    |---|---|

    | **Argument** | **Description** |

    | -R | Recursively lists the contents of subdirectories. |

    | -s | Lists the size in blocks (including indirect blocks). |

    | -t | Sorts by modification time instead of alphabetically by directory/file.
    When combined with **-u**, sorts by access time; when combined with **-c**, sorts
    by link modification time. |

    | -u | Uses the last access time for sorting and displaying. |

    | -x | Displays multiple columns sorted across the page instead of down. |

    | -1 | Displays one directory/file per line. |


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_141_0.png)


    The more important command-line options are **-a, -d, -F, -l, -r, -R, -t,** and
    **-1**. Be certain to understand the effect of these command-line arguments on
    the information the **ls** command displays.


    When you’re using one of the long listing formats (**-g, -l, -n,** or **-o**),
    the file permissions and additional information are displayed in the first 11
    characters of each directory/file. Table 5.6 lists the characters used in the
    first character of this file permission field. Table 5.7 lists the characters
    used in positions 2 through 10 of the file permission field.


    | Table 5.6 First Character Used in the File Permission Field of the ls Command
    Display |  |

    |---|---|

    | **Character** | **Description** |

    | b | Block special file |

    | c | Character special file |

    | d | Directory |

    | D | Door |

    | l | Symbolic link |

    | p | FIFO or named pipe |

    | s | Socket |

    | - | Ordinary file |'
