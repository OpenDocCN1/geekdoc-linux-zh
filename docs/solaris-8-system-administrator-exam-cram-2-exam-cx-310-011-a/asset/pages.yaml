  md: "physical disk hardware. The fsck(1M) command checks (audits) the logical consistency\
    \ of a file system and attempts to make the repairs necessary to eliminate any\
    \ inconsistency. The fsck command checks the superblock, inodes, indirect blocks,\
    \ and directory data block.\n\nThe fsck command is typically executed when a file\
    \ system is mounted automatically as part of system boot. It can also be executed\
    \ manually on one or more file systems. Only unmounted file systems should be\
    \ checked and repaired because changes can affect programs accessing the file\
    \ system and in turn cause even more damage. One or more raw logical device names\
    \ (partitions) can be specified as command-line arguments. As with the mkfs command,\
    \ you should use the -F command-line argument to specify the type of file system\
    \ being checked. The following example shows using the fsck command to check the\
    \ 1GB file system previously created:\n\n```\n    # fsck -F ufs /dev/rdsk/c0d1s7\n\
    \    ** /dev/rdsk/c0d1s7\n    ** Last Mounted on\n    ** Phase 1 - Check Blocks\
    \ and Sizes\n    ** Phase 2 - Check Pathnames\n    ** Phase 3 - Check Connectivity\n\
    \    ** Phase 4 - Check Reference Counts\n    ** Phase 5 - Check Cyl groups\n\
    \    2 files, 9 used, 1019783 free\n    #\n```\n\nIf you don’t specify the -F\
    \ command-line argument, the type of file system defined in the /etc/default/fs\
    \ file (UFS) is used by default. In addition, if no partitions (raw logical device\
    \ names) are specified, all the file systems listed in the /etc/vfstab file are\
    \ checked.\n\n![](img/b957f979417d9f16274c2eb52c8f2c9f_223_0.png)\n\nLike the\
    \ commands used to create file systems, the fsck command expects raw logical device\
    \ names. You can use the fsck command to check and repair CacheFS, UDF, and UFS\
    \ file systems. Remember to unmount the file system first.\n\n# Mounting and Unmounting\
