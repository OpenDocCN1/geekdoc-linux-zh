    # Moving and Renaming Files by Using the mv Command


    The mv(1) command can be used to


    +   - Move one or more files to another directory.

    +   - Rename a file in the current directory.

    +   - Move a file to another directory and rename it in the process.


    When you’re moving one or more files, the last command-line argument is the target
    directory and all preceding command-line arguments are the files to be moved.
    The files to be moved can be complete filenames, multiple files selected with
    metacharacters, or any combination. The filenames must be separated by spaces,
    as shown in this example:


    ```

    # ls -R /test

