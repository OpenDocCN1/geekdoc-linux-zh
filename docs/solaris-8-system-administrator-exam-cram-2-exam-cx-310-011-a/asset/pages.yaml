  md: "```\n```shell\n#\n# usermod -l user3 -d /export/home/user3 -m user1\n6 blocks\n\
    #\n# ls -l\n total 22\ndrwx------  2 root  root  8192 Jan 13 21:05 lost+found\n\
    drwxr-x--x  2 user2 other 512 Mar 31 13:45 user2\ndrwxr-x--x  2 user3 other 512\
