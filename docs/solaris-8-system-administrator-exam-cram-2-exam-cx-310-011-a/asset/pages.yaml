- pgno: 506
  md: 'This Exam Cram includes a special version of PrepLogic Practice Tests—a revolutionary
    test engine designed to give you the best in certification exam preparation. PrepLogic
    offers sample and practice exams for many of today’s most in-demand and challenging
    technical certifications. This special *Preview Edition* is included with this
    book as a tool to use in assessing your knowledge of the Exam Cram material, while
    also providing you with the experience of taking an electronic exam.


    This appendix describes in detail what *PrepLogic Practice Tests, Preview Edition*
    is, how it works, and what it can do to help you prepare for the exam. Note that
    although the *Preview Edition* includes all the test simulation functions of the
    complete, retail version, it contains only a single practice test. The *Premium
    Edition*, available at **PrepLogic.com**, contains the complete set of challenging
    practice exams designed to optimize your learning experience.


    # Exam Simulation


    One of the main functions of *PrepLogic Practice Tests, Preview Edition* is exam
    simulation. To prepare you to take the actual vendor certification exam, PrepLogic
    is designed to offer the most effective exam simulation available.


    # Question Quality


    The questions provided in the *PrepLogic Practice Tests, Preview Edition* are
    written to the highest standards of technical accuracy. The questions tap the
    content of the Exam Cram chapters and help you to review and assess your knowledge
    before you take the actual exam.


    # Interface Design


    The *PrepLogic Practice Tests, Preview Edition* exam simulation interface provides
    you with the experience of taking an electronic exam. This enables you to effectively
    prepare yourself for taking the actual exam by making the test experience a familiar
    one. Using this test simulation can help to eliminate the sense of surprise or
    anxiety you might experience in the testing center because you will already be
    acquainted with computerized testing.


    # Effective Learning Environment


    The *PrepLogic Practice Tests, Preview Edition* interface provides a learning
    environment that not only tests you through the computer, but also teaches the
    material you need to know to pass the certification exam. Each question'
  merge: -1
  img_proc: true
- pgno: 507
  md: 'comes with a detailed explanation of the correct answer and often provides
    reasons the other options are incorrect. This information helps to reinforce the
    knowledge you already have and also provides practical information you can use
    on the job.


    # ## Software Requirements


    PrepLogic Practice Tests requires a computer with the following:


    +   - Microsoft Windows 98, Windows Me, Windows NT 4.0, Windows 2000, or Windows
    XP

    +   - A 166MHz or faster processor is recommended

    +   - A minimum of 32MB of RAM

    +   - As with any Windows application, the more memory, the better your performance

    +   - 10MB of hard drive space


    # ## Installing *PrepLogic Practice Tests, Preview Edition*


    Install *PrepLogic Practice Tests, Preview Edition* by running the setup program
    on the *PrepLogic Practice Tests, Preview Edition* CD. Follow these instructions
    to install the software on your computer:


    +   1. Insert the CD into your CD-ROM drive. The Autorun feature of Windows should
    launch the software. If you have Autorun disabled, click the Start button and
    select Run. Go to the root directory of the CD and select setup.exe. Click Open,
    and then click OK.

    +   2. The Installation Wizard copies the *PrepLogic Practice Tests, Preview Edition*
    files to your hard drive; adds *PrepLogic Practice Tests, Preview Edition* to
    your Desktop and Program menu; and installs test engine components to the appropriate
    system folders.


    # ## Removing *PrepLogic Practice Tests, Preview Edition* from Your Computer


    If you elect to remove the *PrepLogic Practice Tests, Preview Edition* product
    from your computer, an uninstall process has been included to ensure that it'
  merge: -1
  img_proc: true
- pgno: 508
  md: 'is removed from your system safely and completely. Follow these instructions
    to remove PrepLogic Practice Tests, Preview Edition from your computer:


    +   1. Select Start, Settings, Control Panel.

    +   2. Double-click the Add/Remove Programs icon.

    +   3. You are presented with a list of software currently installed on your computer.
    Select the appropriate *PrepLogic Practice Tests, Preview Edition* title you wish
    to remove. Click the Add/Remove button. The software is then removed from your
    computer.


    # Using *PrepLogic Practice Tests, Preview Edition*


    PrepLogic is designed to be user friendly and intuitive. Because the software
    has a smooth learning curve, your time is maximized, as you will start practicing
    almost immediately. *PrepLogic Practice Tests, Preview Edition* has two major
    modes of study: Practice Test and Flash Review.


    Using Practice Test mode, you can develop your test-taking abilities, as well
    as your knowledge through the use of the Show Answer option. While you are taking
    the test, you can reveal the answers along with a detailed explanation of why
    the given answers are right or wrong. This gives you the ability to better understand
    the material presented.


    Flash Review is designed to reinforce exam topics rather than quiz you. In this
    mode, you will be shown a series of questions, but no answer choices. Instead,
    you will be given a button that reveals the correct answer to the question and
    a full explanation for that answer.


    # Starting a Practice Test Mode Session


    Practice Test mode enables you to control the exam experience in ways that actual
    certification exams do not allow:


    +   ➤ **Enable Show Answer Button**—Activates the Show Answer button, allowing
    you to view the correct answer(s) and a full explanation for each question during
