- pgno: 385
  md: "Database file. The Authorization Attributes Database defines privileged operations\
    \ associated with a profile and does not relate directly to command execution.\
    \ Therefore, answer a is incorrect. The User Attributes Database associates users\
    \ and roles with authorizations and profiles, which also do not directly relate\
    \ to command execution. Therefore, answer c is incorrect.\n\n# Question 4\n\n\
    +   Which of the following keys are allowed in the **attribute** field of the\
    \ User Attributes Database file? (Select all that apply.)\n+   \n+   - [ ] a.\
    \ **auths**\n+   - [ ] b. **help**\n+   - [ ] c. **profile**\n+   - [ ] d. **roles**\n\
    +   - [ ] e. **type**\n\nAnswers a, c, d, and e are correct. The **attribute**\
    \ field of the User Attributes Database file can be used to assign authorizations,\
    \ profiles, and roles. The **type** key identifies entries as being either normal\
    \ user accounts or roles. The **help** key is supported only in the Authorization\
    \ and Profile Attributes Database files. Therefore, answer b is incorrect.\n\n\
    # Question 5\n\n+   Which of the following is the definition of a role?\n+   \n\
    +   - ◯ a. A special user account to which authorizations and profiles are assigned.\n\
    +   - ◯ b. A right used to grant access to a restriction function.\n+   - ◯ c.\
    \ A mechanism used to group authorizations and profile assignments.\n+   - ◯ d.\
    \ A user account that does not require a password.\n+   - ◯ e. A user account\
    \ that can be accessed via the login command.\n\nAnswer a is correct. A **right\
    \ used to grant access to a restriction function** is the definition of an authorization.\
    \ Therefore, answer b is incorrect. A **mechanism used to group authorizations\
    \ and profile assignments** is the definition of a profile. Therefore, answer\
    \ c is incorrect. Roles, like other user accounts, require a password and can\
    \ be accessed only by using the su(1) command. Therefore, answers d and e are\
    \ incorrect."
  merge: -1
  img_proc: true
- pgno: 386
  md: "# Question 6\n\n+   Which of the following keys can be used in the **attribute**\
    \ field of the RBAC Execution Attributes Database file? (Select all that apply.)\n\
    +   \n+   - [ ] a. `auths`\n+   - [ ] b. `gid`\n+   - [ ] c. `help`\n+   - [ ]\
    \ d. `profiles`\n+   - [ ] e. `uid`\n\nAnswers b and e are correct. The only valid\
    \ keys for the **attribute** field of the Execution Attributes Database file are\
    \ **gid**, **gid**, **euid**, and **uid**. The **auths** key can be specified\
