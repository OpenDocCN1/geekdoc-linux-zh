- pgno: 150
  md: 'This chapter covers the Part I exam objectives that address *User Administration*.
    I’ll discuss administering user and group accounts, the initialization files associated
    with user accounts, logging in and out of a system, and identifying the users
    currently logged in to the system.


    # ## Account Administration


    The Solaris 8 system controls access to data and resources by means of user and
    group accounts. A key system administration activity is administering user accounts
    and group accounts as well as the passwords associated with these accounts.


    # ## User Accounts


    You can add, modify, or delete user accounts by using command-line utilities or
    the **admintool**(1M) command. Using the **admintool** command reduces or eliminates
    the possible introduction of typos and other errors that might affect all user
    accounts.


    However, the **admintool** command requires a graphical user interface (GUI),
    and using it is more time-consuming than using the command-line utilities manually.
    These are the command-line utilities:


    +   - **useradd**(1M)

    +   - **usermod**(1M)

    +   - **userdel**(1M)


    Both the **admintool** command and the command-line utilities are described in
    the following sections.


    # ### Creating an Account by Using the admintool Command


    When you start the admintool command, the Users dialog box is displayed (see Figure
    6.1). To display the Add User dialog box, choose Edit, Add from the menu. The
    Add User dialog box, shown in Figure 6.2, consists of three sections: User Identity,
    Account Security, and Home Directory.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '![](img/b957f979417d9f16274c2eb52c8f2c9f_151_0.png)


    **Figure 6.1** The Admintool: Users dialog box.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_151_1.png)


    **Figure 6.2** The Admintool: Add User dialog box.


    The User Identity section displays the information you must define to add a user
    account. All this information is stored in the /etc/passwd file, except secondary
    groups information, which is stored in the /etc/group file. Table 6.1 lists the
    fields in the User Identity section.


    The Account Security section contains information for determining how the password
    should be defined and for setting up password aging. This information is stored
    in the /etc/shadow file. Table 6.2 lists the fields in the Account Security section.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'The Home Directory section is used to define (and create, if necessary) the
    account’s home directory. This path is stored in the /etc/passwd file. The appropriate
    initialization files are created in the home directory based on the type of login
    shell selected.


    **Table 6.1 User Identity Fields**


    | Field | Description |

    |---|---|

    | User Name | A unique user account name consisting of a maximum of eight upper-
    and lowercase letters and/or numbers. |

    | User ID | The UID associated with the user account. It is a unique number, typically
    between 1,000 and 60,000. The next available number starting at 1,000 is supplied
    automatically. |

    | Primary Group | The group to which the user should be assigned. The default
    value is 10 (staff). Any specified group must exist before members can be added.
    |

    | Secondary Groups | Additional groups (separated by commas) to which the user
    should be assigned. Specified groups must exist before members can be added. |

    | Comment | Any text that should be placed in the /etc/passwd field. |

    | Login Shell | The Bourne (default), C, or Korn shell can be selected. To specify
    another shell, select Other from the drop-down menu and enter the name of the
    shell in the field. |


    **Table 6.2 Account Security Fields**


    | Field | Description |

    |---|---|

    | Password | The choices are Cleared Until First Login, Account Is Locked, No
    Password—Setuid Only, or Normal Password. |

    | Min Change | The minimum number of days required between password changes. |

    | Max Change | The maximum number of days the password is valid. |

    | Max Inactive | The maximum number of days the account can be inactive before
    the password must be changed. |

    | Expiration Date | The date the account expires. |

    | Warning | The number of days the user is warned before the password expires.
    |'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Modifying an Account by Using the admintool Command


    To modify a user account, start the **admintool** command if it is not already
    active. Choose Browse, Users from the menu (shown previously in Figure 6.1) to
    open the Users dialog box.


    Click the account entry to highlight it, and then choose Edit, Modify from the
    menu to open the Modify User dialog box, which is similar to the Add User dialog
    box (shown previously in Figure 6.2). The fields in this dialog box are filled
    in with information about the selected user. Change the fields as needed and click
    Apply to save the changes.


    # Deleting an Account by Using the admintool Command


    To delete a user account, start the **admintool** command if it is not already
    active, and choose Browse, Users from the menu. In the Users dialog box, click
    the account entry to highlight it, and then choose Edit, Delete from the menu
    to open the Warning dialog box (see Figure 6.3). Click Delete to delete the user
    account.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_153_0.png)


    **Figure 6.3** The Admintool: Warning dialog box.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_153_1.png)


    > Because using the **admintool** command makes creating, modifying, and deleting
    user accounts easy, Exam CX-310-011 concentrates on using the **useradd**, **usermod**,
    and **userdel** commands for administering user accounts.


    # Creating an Account by Using the useradd Command


    The **useradd**(1M) command provides a quick method to add a new user account.
    At a minimum, you must specify the account name as a command-line argument. Table
    6.3 lists the command-line arguments supported by the **useradd** command.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '**Table 6.3 Command-Line Arguments for the useradd Command**


    | Argument | Description |

    |---|---|

    | *account* | Specifies the name of the new user account (required). |

    | *-A authorizations* | Specifies one or more authorizations. |

    | *-b base* | Defines a base directory. If a home directory (`-d`) is not specified,
    the *account* name is added to *base* and used as the home directory. |

    | *-c comment* | Specifies a comment that is placed in the comment field of the
    `/etc/passwd` file. |

    | *-d directory* | Defines the home directory of the account. |

    | *-e date* | Specifies an expiration date for the account. After the specified
    date, the account is disabled. |

    | *-f days* | Specifies the maximum number of days the account can be inactive
    before it is disabled. |

    | *-g group* | Defines the GID or name of an existing group that will be the primary
    group for the user account. |

    | *-G group* | Defines a GID or name of an existing group that will be a secondary
    group for the user account. |

    | *-k template_dir* | Specifies the directory that contains a template (default)
    `.profile` used for the user account. |

    | *-m* | Creates the home directory if it doesn’t exist. The home directory is
    defined by `-b` and the *account* name or by `-d`. |

    | *-o* | Enables you to specify an existing UID. That is, you can create an account
    with a duplicate UID (see `-u`). |

    | *-p profiles* | Specifies one or more execution profiles. |

    | *-R roles* | Specifies one or more user roles. |

    | *-s shell* | Specifies the login shell; the default is the Bourne shell (`/bin/sh`).
    |

    | *-u uid* | Specifies the UID of the user account. It must be a decimal integer.
    If *uid* is not specified, the next highest available UID is assigned. |


    The following example creates a user account by using the **useradd** command:


    ```

    ```sh

    # useradd -d /export/home/user1 -m -g other -u 1050 user1

    6 blocks

    #

    ```

    ```


    This command creates the user1 user account, assigns it UID 1050, makes it a member
    of the group other, and creates its home directory (/export/home/user1).'
  merge: -1
  img_proc: true
- pgno: 155
  md: "To make life a little easier, the **useradd** command also supports the **-D**\
    \ command-line argument, which enables you to assign default values to authorizations\
    \ (**-A**), the base directory (**-b**), the group (**-g**), the expiration date\
    \ (**-e**), the maximum inactivity (**-f**), execution profiles (**-P**), and\
    \ roles (**-R**). Subsequent uses of the **useradd** command will use these default\
    \ values if they are not specified, as shown in this example:\n\n```\n# useradd\
    \ -D -b /export/home -g other\n group=other, proj=3  basedir=/export/home\n skel=/etc/skel\
    \  shell=/bin/sh  inactive=0\n expire=  auths=  profiles=  roles=\n#\n# useradd\
    \ -m -u 1051 user2\n6 blocks\n#\n```\n\nBecause a default base and group were\
    \ defined, the user2 account is a member of the group other and has a home directory\
    \ of /export/home/user2.\n\n![](img/b957f979417d9f16274c2eb52c8f2c9f_155_0.png)\n\
    \n> User accounts created with the useradd command do not have a password. These\
    \ accounts are locked and cannot be used until a password is defined for the account\
    \ by using the passwd(1) command.\n\n# Modifying an Account by Using the usermod\
    \ Command\n\nThe usermod(1M) command is used to modify an existing user account.\
    \ The command-line arguments are identical to the useradd command-line arguments,\
    \ with the following exceptions:\n\n+   - The base directory (**-b**) is not available.\
    \ Use **-d** to specify a new directory. Don't forget to include **-m** if the\
    \ specified directory doesn't exist.\n+   - Set defaults (**-D**) is not available.\n\
    +   - The template directory (**-k**) is not available.\n+   - You specify a new\
    \ user account name by using **-l account** if the account name is being modified.\n\
    \nKeep in mind that if the account name is changed, the name of the home directory\
    \ does not change unless you use the **-d** and **-m** command-line arguments.\
    \ The following example uses the **usermod** command to change the name of the\
    \ user1 account to user3:\n\n```\n# ls -l\ntotal 22\ndrwx------  2 root   root\
    \     8192 Jan 13 21:05 lost+found\ndrwxr-x---  2 user3  other     512 Mar 31\
    \ 13:23 user1\ndrwxr-x--  2 user2  other     512 Mar 31 13:45 user2\n```"
  merge: -1
  img_proc: true
