    # # File Permissions and Ownership


    File permissions determine the operations that can be performed on files and directories
    and who can perform these operations. Solaris 8 provides two types of file permissions:
    standard, which provides basic security, and extended, which expands the standard
    permissions.


    # ## Standard File Permissions


    Files and directories can have read, write, and execution permissions. You can
    assign permissions to three classes of system accounts: the user account that
    owns the file, the group account that has group permissions, and everyone else.
    These three permissions are referred to as *user*, *group*, and *other*. The read,
    write, and execution permissions for user, group, and other can be set independently
    of one another.


    You use two types of notation to specify file permissions (also known as the *file
    access mode*): absolute mode and symbolic mode. *Absolute mode* (also referred
    to as *octal mode*) is a numeric value assigned to each permission per account
    class. Table 5.4 lists the absolute modes.'
