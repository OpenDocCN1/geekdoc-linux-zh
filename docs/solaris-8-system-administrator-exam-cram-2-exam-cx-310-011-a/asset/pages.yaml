- pgno: 434
  md: 'This chapter covers the *Solaris Management Console* and the *Solstice AdminSuite*
    test objectives by briefly describing the functionality and features of these
    tools.


    # Solaris Management Console


    The Solaris Management Console is an administrative tool used to remotely manage
    multiple domains consisting of Solaris systems. A set of graphical user interface
    (GUI) administrative tools is integrated into a single interface framework. The
    Solaris systems registered with the Management Console are viewed as a tree of
    icons representing hosts and services. These tools include:


    +   - **User Manager**—User account administration

    +   - **Process Manager**—Active process management

    +   - **Log Viewer**—View contents of the Console log

    +   - **Job Scheduler**—View and manage scheduling of tasks

    +   - **Mounts and Shares Manager**—View and modify Network File System (NFS)
    mounts and shares

    +   - **Disk/Partition Manager**—View and modify disk and partition configurations

    +   - **Serial Port Manager**—View and modify serial port configuration


    # Other Features


    The Management Console provides a *single login* capability. By logging in to
    the Management Console, you can access all hosts and services managed by the Console.
    This single login eliminates the need to log in to each host separately.


    The new Role-Based Access Control (RBAC) feature can be managed by using the Management
    Console, allowing you to delegate specific rights to multiple administrators while
    maintaining centralized control.


    The Management Console enables applications to be executed on remote hosts and
    monitored using local GUIs. It eliminates the need to install the applications
    on the local system.'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# The Solstice AdminSuite


    The graphical management tool AdminSuite is a collection of the following tools:


    +   - **Host Manager**—Manages AutoClient servers, standalone servers, and diskless
    clients

    +   - **Storage Manager**—Manages partitions and file systems

    +   - **Database Manager**—Manages network-related data

    +   - **Serial Port Manager**—Manages the configuration of serial ports

    +   - **User Manager**—Manages user accounts

    +   - **Group Manager**—Manages group accounts

    +   - **Printer Manager**—Manages printers and print servers


    Many of the functions performed by AdminSuite can also be performed by the **admintool**
    command. These functions include serial port management, user and group account
    management, and printer management. For these cases, the AdminSuite GUIs (windows)
    look very similar to the windows provided by the **admintool** command.


    > The Solstice AdminSuite is not covered in detail on Part II of the exam. However,
    you should be familiar with the capabilities of the seven AdminSuite manager tools
    and the two tools that compose the Storage Manager.


    # Host Manager


    The Host Manager provides the ability to add and maintain server and client support.
    You can use it to perform tasks including the following:


    +   - Adding and modifying system support for all types of system configurations
    (AutoClients, diskless clients, operating system [OS] servers, and standalone
    systems), including converting system types

    +   - Setting root passwords for AutoClients or diskless clients


    System support includes providing software services. These services include boot
    services and install services for installation as well as OS services for systems
    with limited disk space. The Host Manager provides the ability to convert a standalone
    system to an OS server, an AutoClient to a standalone system, and so on. In addition,
    you can use the Host Manager to add OS'
  merge: -1
  img_proc: true
- pgno: 436
  md: 'services to an OS server (for example, to add support for another type of operating
    system) or to remove OS services that are no longer needed. Another function of
    the Host Manager is to set up, install, boot, and profile servers for performing
    over-the-network installation.


    AdminSuite provides command-line equivalents for the following operations of the
    Host Manager:


    +   - **admhostadd**—Adds support for a new system or OS server

    +   - **admhostdel**—Deletes support for an existing system or OS server

    +   - **admhostmod**—Modifies an existing system

    +   - **admhosts**—Lists existing hosts


    # Storage Manager


    The Storage Manager consists of two tools: the Disk Manager and the File System
    Manager. The Disk Manager enables you to view and edit partition-related information.
    You can use it for the following:


    +   - Viewing and modifying x86 and SPARC slice parameters (that is, changing
    the starting and ending addresses of the slices)

    +   - Specifying a disk label

    +   - Viewing and modifying x86 disk partitions

    +   - Copying the characteristics of a disk to one or more similar disks


    The File System Manager supports creating and modifying file systems. You can
    use it for the following:


    +   - Creating file systems

    +   - Creating mount points

    +   - Mounting and unmounting file systems

    +   - Sharing and unsharing NFS resources

    +   - Modifying the /etc/vfstab file on one or more systems

    +   - Adding entries to existing Auto File System (AutoFS) maps


    The File Manager also provides the capability to select mount and share options,
    such as NFS-specific mount options.'
  merge: -1
  img_proc: true
- pgno: 437
  md: 'AdminSuite does not provide any command-line equivalents for the Storage Manager
    because you can use standard Solaris commands to perform disk and file system
    tasks.


    # Database Manager


    The Database Manager is used to view and modify network-related system information.
    This information can be stored on a selected host (in /etc files), in Network
    Information Service (NIS), or in Network Information Service Plus (NIS+). You
    can use the Database Manager to view and modify files, maps, or tables (depending
    on name service) containing the following types of information:


    +   - System aliases

    +   - AutoFS map contents

    +   - Boot parameters

    +   - Ethernet addresses

    +   - Groups

    +   - Hostnames and IP addresses

    +   - Locale information

    +   - Network groups

    +   - Network masks

    +   - Network names

    +   - User account information

    +   - Network protocols

    +   - Remote Procedure Call (RPC) configuration

    +   - Network services

    +   - Time zone information


    AdminSuite does not provide any command-line equivalents for the Database Manager.
    For the /etc files name service, you can use any text editor to modify the information.
    For NIS and NIS+, use the appropriate procedures to modify the maps and tables
    as necessary.'
  merge: -1
  img_proc: true
- pgno: 438
  md: '# Serial Port Manager


    The Serial Port Manager provides AdminSuite with a graphical interface to view
    and modify serial port settings on the selected host. Using the Serial Port Manager,
    you can perform the following operations:


    +   - View serial port settings

    +   - Add a terminal

    +   - Add a modem

    +   - Disable a port service

    +   - Delete a port service


    AdminSuite provides command-line equivalents for the following operations of the
    Serial Port Manager:


    +   - **admserialdel**—Deletes a port service

    +   - **admserialls**—Lists a port service

    +   - **admserialmod**—Modifies a port service


    # User Manager


    The User Manager is used to view and modify user account information. This information
    can be stored on the selected host (in /etc files), in NIS, or in NIS+. You can
    use the User Manager to view and modify files, maps, or tables (depending on name
    service) containing the following types of information:


    +   - System aliases

    +   - AutoFS map contents for home directories

    +   - User credential information

    +   - Group account information

    +   - User account information

    +   - Password information


    AdminSuite provides the following command-line equivalents for the User Manager:


    +   - **admuseradd**—Adds a user account

    +   - **admuserdel**—Deletes a user account'
  merge: -1
  img_proc: true
- pgno: 439
  md: '+   - **admusers**—Lists user accounts

    +   - **admusermod**—Modifies a user account


    # Group Manager


    The Group Manager is used to view and modify group account information. This information
    is stored on a selected host (in the /etc/group file), an NIS map, or an NIS+
    table. AdminSuite provides the following command-line equivalents for the Group
    Manager:


    +   - **admgroupadd**—Adds a group account

    +   - **admgroupdel**—Deletes a group account

    +   - **adm-groups**—Lists group accounts

    +   - **admgroupmod**—Modifies a group account


    # Printer Manager


    The Printer Manager provides AdminSuite with a graphical interface to perform
    the following operations:


    +   - Install a printer on a print server

    +   - Install a network printer

    +   - Give print clients access to a printer

    +   - Modify existing information for a printer

    +   - Delete access to a printer

    +   - Delete a printer from a print server


    AdminSuite does not provide any command-line equivalents for the Printer Manager.
    You can manage printers by using the Solaris LP Service commands on the appropriate
    system.'
  merge: -1
  img_proc: true
