- pgno: 372
  md: 'This chapter covers the *Role-Based Access Control* test objectives. The first
    section describes the purpose of role-based access. The second section provides
    details on the configuration files used to implement Role-Based Access Control
    (RBAC). The last section summarizes the commands you can use to manage RBAC.


    # Purpose of Role-Based Access Control


    In the past, Solaris system administration has been performed by using the root
    superuser account or a user account granted superuser privileges. Even if a user
    account needed to access only a few privileged operations or commands to perform
    a task, the account was granted complete control over the system. This all-or-nothing
    approach to system administration has always been a security issue. A new feature
    in Solaris 8, Role-Based Access Control (RBAC), addresses this issue.


    The RBAC subsystem supports the concept of a special type of user account called
    a role. Roles are granted a set of superuser privileges to perform selected administrative
    tasks, such as printer management. Even though roles are a type of user account,
    they can be accessed only by using the `su(1)` command. That is, a role cannot
    be used as a regular user account accessed directly with a normal login procedure,
    such as `login(1)` or `telnet(1)`. You grant superuser privileges to roles (and
    regular user accounts) by assigning them profiles and/or authorizations.


    *Profiles* are sets of authorizations and privileged operations. You can think
    of a profile as a grouping mechanism used to simplify assigning sets of related
    superuser privileges. For example, the Device Management profile includes all
    the necessary authorizations to manage system devices.


    *Authorizations* are rights to perform restricted functions, such as shutting
    down the system. An authorization might not correspond to a single Solaris command.
    For example, several commands can be used to shut down the system. If a user account
    has been assigned the authorization `solaris.system.shutdown`, the user account
    can use any of the appropriate commands to perform the shutdown. Sun Microsystems
    has defined the set of authorizations associated with the Solaris system, and
    they cannot be modified.


    On the other hand, *privileged operations* are Solaris commands executed with
    the UID and/or GID set to the values that allow proper operation.'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'In summary, authorizations and privileged operations can be assigned to regular
    user accounts and roles to allow controlled delegation of superuser privileges.
    Profiles can be used to assign sets of authorizations and privileged operations.


    # The RBAC Database


    The RBAC database consists of four attribute databases or files. Collectively,
    these files define the RBAC attributes (roles, profiles, authorizations, and privileged
    operations). The RBAC database also provides a mechanism to associate profiles,
    authorizations, and privileged operations to regular user accounts and roles.
    These are the four RBAC database files:


    +   - **User Attributes Database (user_attr)**—Defines roles and assigns authorizations
    and profiles to roles and regular user accounts. Also referred to as the Extended
    User Attributes Database.

    +   - **Profile Attributes Database (prof_attr)**—Defines profiles.

    +   - **Authorization Attributes Database (auth_attr)**—Defines the authorizations.

    +   - **Execution Attributes Database (exec_attr)**—Defines privileged operations.
    Also referred to as the Profile Execution Attributes Database.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_373_0.png)


    The User Attributes Database (user_attr) is located under the /etc directory.
    The other three databases are under the /etc/security directory.


    Figure 17.1 shows the relationships among the four database files. The User Attributes
    Database assigns profiles to user accounts and roles by referencing entries in
    the Profile Attributes Database. Likewise, the User Attributes Database assigns
    authorizations to user accounts and roles by referencing entries in the Authorization
    Attributes Database.


    The Profile Attributes Database assigns authorizations to profiles by referencing
    entries in the Authorization Attributes Database. The privileged operations defined
    in the Execution Attributes Database are associated with a profile by including
    the profile’s name in the Execution Attributes Database.'
  merge: -1
  img_proc: true
- pgno: 374
  md: "![](img/b957f979417d9f16274c2eb52c8f2c9f_374_0.png)\n\n**Figure 17.1** Relationships\
    \ among the RBAC database files.\n\n# The User Attributes Database (user_attr)\n\
    \nThe /etc/user_attr file is the key database of RBAC. It assigns profiles and/or\
    \ authorizations to user accounts. It also defines roles (as one or more authorizations\
    \ and/or profiles). Table 17.1 lists the colon-delimited fields of the user_attr\
    \ file.\n\n**Table 17.1 Fields of the User Attributes Database**\n\n| Field |\
    \ Use |\n|---|---|\n| Name | Name of a user account (defined in the /etc/passwd\
    \ file) or a role. |\n| Qualifier | Reserved for future use (empty field). |\n\
    | Res1 | Reserved for future use (empty field). |\n| Res2 | Reserved for future\
    \ use (empty field). |\n| Attributes | List of `key=value` pairs separated by\
    \ semicolons; it determines the attributes assigned to the user account or role.\
    \ Valid keys are **auths** (one or more authorization names, separated by commas),\
    \ **profiles** (one or more profile names, separated by commas), **roles** (one\
    \ or more roles, separated by commas), and **type** (set to **normal** if the\
    \ name field is a regular user account or **role** if name is a role). |\n\nThe\
    \ following example shows several sample entries from the /etc/user_attr file\
    \ (wrapped lines are indented to improve readability):\n\n```\n```text\nprt_adm:::type=role;profiles=Printer\
    \ Management;\n        auths=solaris.system.date\nprof_adm:::type=role;auths=solaris.profmgr.*\n\
    role_adm:::type=role;auths=solaris.role.*\namber::::type=normal;roles=prt_adm\n\
    morgan::::type=normal;roles=prof_adm,role_adm\ndana::::type=normal;auths=solaris.jobs.*;\n\
    \        profiles=Printer Management;roles=prof_adm,role_adm\n```\n```"
  merge: -1
  img_proc: true
- pgno: 375
  md: 'The first entry defines the prt_adm role that is assigned the Printer Management
    profile. In addition, this role is assigned the authorization solari​s.system.date,
    which allows the role to set the system date.


    The second entry defines the prof_adm role, which is assigned all authorizations
    relating to RBAC profile administration. Note that the asterisk (*) metacharacter
    can be used to denote *any* (like the shell metacharacter).


    The third entry defines the role_adm role, which is assigned all authorizations
    relating to RBAC role administration.


    The fourth entry assigns the prt_adm role to the normal user account *amber*.
    Once logged in, *amber* can use the **su(1)** command to become the prt_adm and
    perform any tasks assigned to that role.


    The fifth entry assigns the prof_adm and role_adm roles to the normal user account
    *Morgan*. Once logged in, *morgan* can use the **su(1)** command to become the
    prof_adm and role_adm, and then perform any tasks assigned to those roles.


    The sixth entry assigns a considerable amount of access control to the normal
    user account *dana*. This control includes all authorizations associated with
    SolarisJobs (cron and at job management), the Printer Management profile, the
    prof_adm role, and the role_adm role.


    The following example shows the only default entry in the user_attr file. This
    entry is for the root superuser account. Basically, it assigns all authorizations
    and profiles:


    ```

    root::::type=normal;auths=solaris.*,solaris.grant;profiles=All

    ```


    # The Execution Profile Attributes Database (prof_attr)


    The /etc/security/prof_attr file is used to assign authorizations from the Authorization
    Attributes Database (auth_attr) and privileged operations from the Execution Attribute
    Database (exec_attr) to a single named entity referred to as an “execution profile”
    or just a “profile.” You can then reference these profiles in the user_attr file
    to assign them to roles or directly to user accounts. Table 17.2 lists the colon-delimited
    fields of the prof_attr file.


    | Field | Use |

    |---|---|

    | Name | Profile name (case-sensitive). |

    | Res1 | Reserved for future use (empty field). |'
  merge: -1
  img_proc: true
- pgno: 376
  md: "| **Table 17.2  Fields of the Profile Attributes Database (continued)** | |\n\
    |---|---|\n| **Field** | **Use** |\n| **Res2** | Reserved for future use (empty\
    \ field). |\n| **Description** | Description of profile. |\n| **Attributes** |\
    \ List of `key=value` pairs (separated by semicolons) that determines the authorizations\
    \ and operations included in the profile. Valid keys are **auth** and **help**.\
    \ |\n\nThe following example shows two entries from the `/etc/security/prof_attr`\
    \ file. The lines are broken and wrapped to improve readability.\n\n```\nAudit\
    \ Review::View the audit trail:auths=solaris.audit.read;\n    help=AuditReview.html\n\
    Printer Management::Control Access to Printer:\n    help=PrinterMgmt.html\n```\n\
    \nThe first entry defines the Audit Review profile. The phrase “View the audit\
    \ trail” is a somewhat terse but accurate description. The **Attributes** field\
    \ references the solaris.audit.read authorization and identifies the help file\
    \ (located under the /usr/lib/help/profiles/locale/C directory). Any privileged\
    \ operations identified by entries in the exec_attr file as being associated with\
    \ the Audit Review profile are also allowed.\n\nThe second entry defines the Printer\
    \ Management profile. Only the help file is identified in the **Attributes** field.\
    \ However, any operations associated with Printer Management in the exec_attr\
    \ field are allowed in this profile. Table 17.3 lists the default profiles defined\
    \ by the prof_attr file. Note that the Device Management profile attributes uses\
    \ the phrase solaris.device.*; this metacharacter expression implies that all\
    \ solaris.device authorizations are included.\n\n| **Table 17.3  Default RBAC\
    \ Profiles** | | | |\n|---|---|---|---|\n| **Name** | **Description** | **Authorizations**\
    \ | **Help** |\n| All | Standard Solaris | N/A | All.html |\n| Audit Control |\
    \ Administers the audit subsystem | solaris.audit.config, solaris.jobs.admin |\
    \ AuditControl.html |\n| Audit Review | Views the audit trail | solaris.audit.read\
    \ | AuditReview.html |\n| Device Management | Controls access to removable media\
    \ | solaris.device.* | DevMgmt.html |\n| Printer Management | Controls access\
    \ to printers | N/A | PrinterMgmt.html |"
  merge: -1
  img_proc: true
- pgno: 377
  md: '# # The Authorization Attributes Database (auth_attr)


    The /etc/security/auth_attr file is used to define authorizations (rights to use
    restricted functions) that can be granted on an individual user-account basis.
    You can then reference these authorizations in your auth_attr file to assign them
    to roles or directly to user accounts. Table 17.4 lists the column-delimited fields
    of the auth_attr file.


    The following example shows three entries from the /etc/security/auth_attr file:


    ```

    solaris.grant:::Grant All Rights::help=PriAdmin.html

    solaris.audit:::Audit Management::help=AuditHeader.html

    solaris.audit.config:::Configure Auditing::help=AuditConfig.html

    ```


    **Table 17.4  Fields of the Authorization Attributes Database**


    | Field | Use |

    |---|---|

    | Name | Name of the authorization, consisting of one or more keywords separated
    by periods that identify a system, subsystem, and function. If the name ends with
    a period, this entry is only a title that describes a group of related authorizations.
    |

    | Res1 | Reserved for future use (empty field). |

    | Res2 | Reserved for future use (empty field). |

    | Short Description | A short description of the authorization. |

    | Long Description | A long description of the authorization. |

    | Attributes | List of zero or more *key=value* pairs (separated by semicolons)
    that describes the authorization. Currently, the only valid key is **help**; it
    defines the help file associated with the authorization. |


    The first entry defines the solaris.grant authorization. The **Short Title** field
    identifies this authorization as Grant All Rights. The **Attributes** field identifies
    the help file (located under the /usr/lib/help/auths/locale/C directory).


    The second entry defines the **Short Title** field for the audit management set
    of authorizations. (Note the period at the end of the **Name** field.) The third
    entry defines the solaris.audit.config authorization, which allows system auditing
    to be configured. (The help file is defined as AuditConfig.html.)


    Table 17.5 lists the default authorizations defined by the auth_attr file.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '**Table 17.5  Default RBAC Authorizations**


    | Name | Description | Help |

    |---|---|---|

    | All | Standard Solaris | All.html |

    | solaris.* | Primary administrator | PriAdmin.html |

    | solaris.grant | Grants all rights | PriAdmin.html |

    | solaris.audit.config | Configures auditing | AuditConfig.html |

    | solaris.audit.read | Reads the audit trail | AuditRead.html |

    | solaris.device.allocate | Allocates a device | DevAllocate.html |

    | solaris.device.config | Configures device attributes | DevConfig.html |

    | solaris.device.grant | Delegates device administration | DevGrant.html |

    | solaris.device.revoke | Revokes or reclaims a device | DevRevoke.html |

    | solaris.jobs.admin | **cron** and **at** administration | JobsAdmin.html |

    | solaris.jobs.grant | Delegates **cron** and **at** administration | JobsGrant.html
    |

    | solaris.jobs.user | Creates **cron** or **at** jobs | JobsUser.html |

    | solaris.login.enable | Enables logins | LoginEnable.html |

    | solaris.login.remote | Remote login | LoginRemote.html |

    | solaris.pfmgmr.assign | Assigns profiles to users or roles | ProfmgrAssign.html
    |

    | solaris.pfmgmr.write | Creates, modifies, and deletes profiles | ProfmgrWrite.html
    |

    | solaris.role.assign | Assigns roles to users | RoleAssign.html |

    | solaris.role.write | Adds, modifies, and deletes roles | RoleWrite.html |

    | solaris.system | Machine administration | SysHeader.html |

    | solaris.system.date | Sets the date and time | SysDate.html |

    | solaris.system.shutdown | Shuts down the system | SysShutdown.html |


    Note that all these authorizations are for the Solaris system (developed by Sun
    Microsystems). If new authorizations are added by other organizations, they should
    be identified using the reverse-order Internet domain name of the organization
    that creates the authorization. For example, an authorization created by the unixcert.net
    organization would start with the **net.unixcert** prefix.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# The Execution Attributes Database (exec_attr)


    The /etc/security/exec_attr file is used to associate privileged operations (commands
    executed with a specified UID and/or GID) with profiles. You can then assign these
    profiles to user accounts or roles. Table 17.6 lists the colon-delimited fields
    of the exec_attr file.


    **Table 17.6 Fields of the Execution Attributes Database**


    | Field | Use |

    |---|---|

    | **Name** | Name of the associated profile (must match the profile name in the
    prof_attr file entry exactly). |

    | **Policy** | Security policy. Currently, the superuser policy **suser** is the
    only valid entry. |

    | **Type** | Type of entity. Currently, the command type **cmd** is the only valid
    entry. |

    | **Res1** | Reserved for future use (empty field). |

    | **Res2** | Reserved for future use (empty field). |

    | **ID** | Command to be executed (specified using a full pathname or partial
    path with metacharacters). |

    | **Attributes** | List of key=value pairs (separated by semicolons) that determines
    the attributes to apply to the command during execution. Valid keys are **euid**
    (set effective UID), **uid** (set real UID), **egid** (set effective GID), and
    **gid** (set real GID). Valid values are UIDs, user account names, GIDs, and group
    account names. |


    The following example shows two entries from the /etc/security/exec_attr file
    associated with the Printer Management profile.


    ```

    Printer Management:suser:cmd:::/usr/bin/enable:euid=lp

    Printer Management:suser:cmd:::/usr/bin/disable:euid=lp

    ```


    The first entry defines execution of the enable(1) command as a privileged operation.
    It will be executed with an effective UID of lp. The second entry defines execution
    of the disable(1) command as a privileged operation. It will also be executed
    with an effective UID of lp.


    Table 17.7 lists the default privileged operations defined by the exec_attr file.
    All have the **Policy** field set to **suser** and the **Type** field set to **cmd**.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '| Profile Name | Command | Attributes |

    |---|---|---|

    | All | * | |

    | Audit Control | /etc/init.d/audit | euid=0;egid=3 |

    | Audit Control | /etc/security/bsmonconv | uid=0 |

    | Audit Control | /etc/security/bsmunconv | uid=0 |

    | Audit Control | /usr/sbin/audit | euid=0 |

    | Audit Control | /usr/sbin/auditconfig | euid=0 |

    | Audit Control | /usr/sbin/auditd | uid=0 |

    | Audit Review | /usr/sbin/auditreduce | euid=0 |

    | Audit Review | /usr/sbin/praudit | euid=0 |

    | Audit Review | /usr/sbin/auditstat | euid=0 |

    | Printer Management | /etc/init.d/lp | euid=0 |

    | Printer Management | /usr/bin/cancel | euid=0 |

    | Printer Management | /usr/bin/lpstat | egid=14 |

    | Printer Management | /usr/bin/enable | euid=lp |

    | Printer Management | /usr/bin/disable | euid=lp |

    | Printer Management | /usr/sbin/accept | euid=lp |

    | Printer Management | /usr/sbin/reject | euid=lp |

    | Printer Management | /usr/sbin/lpadmin | egid=14 |

    | Printer Management | /usr/sbin/lpfilter | euid=lp |

    | Printer Management | /usr/sbin/lpforms | euid=lp |

    | Printer Management | /usr/sbin/lpmove | euid=lp |

    | Printer Management | /usr/sbin/lpshut | euid=lp |

    | Printer Management | /usr/sbin/lpusers | euid=lp |


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_380_0.png)


    Be familiar with the formats of all four RBAC database files and the purpose of
    each field.


    # Managing the RBAC


    You can use the following commands to manage RBAC:


    +   - **auths(1)**—Displays authorizations assigned to a user account

    +   - **profiles(1)**—Displays profiles assigned to a user account'
  merge: -1
  img_proc: true
- pgno: 381
  md: '+   - **roles(1)** — Displays roles assigned to a user account

    +   - **roleadd(1M)** — Adds a role definition

    +   - **roledel(1M)** — Deletes a role definition

    +   - **rolemod(1M)** — Modifies a role definition


    # Displaying RBAC Assignments


    If you use the auths, profiles, and roles commands without a command-line argument,
    the authorizations, profiles, and roles assigned to the current user account are
    listed. To list the authorizations, profiles, and roles assigned to another user
    account, specify the user account as a command-line argument, as shown in this
    example:


    ```

    ```sh

    $ auths root

    solaris.*,solaris.grant


    $ profiles root

    All


    $ roles root

    roles: root : No roles

    $

    ```

    ```


    # Role Management


    The roleadd, rolemod, and roledel commands are used to manage the RBAC roles.


    # Creating a Role by Using the roleadd Command


    The roleadd(1M) command provides a quick method to add a new role. At a minimum,
    the name of the role must be specified as a command-line argument. Table 17.8
    lists the command-line arguments the roleadd command supports.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_381_0.png)


    > > The roleadd command supports command-line arguments that are identical to
    those of the useradd command, except roleadd does not support the -R command-line
    argument because a role cannot contain other roles.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '| Table 17.8 Command-line Arguments for the roleadd Command |  |

    |---|---|

    | **Argument** | **Description** |

    | *role* | Specifies the name of the new role (required). |

    | **-A authorizations** | Specifies one or more authorizations (separated by commas).
    |

    | **-b base** | Defines a base directory. If a home directory (**-d**) is not
    specified, the role name is added to *base* and used as the home directory. |

    | **-c comment** | Specifies a comment placed in the comment (**gcos**) field
    of the `/etc/passwd` file. |

    | **-d directory** | Defines the role’s home directory. |

    | **-e date** | Specifies an expiration date for the role. After the specified
    date, the role is disabled. |

    | **-f days** | Specifies the maximum number of days the role can be inactive
    before it is disabled. |

    | **-g group** | Defines the GID or name of an existing group that will be the
    primary group for the role. |

    | **-G group** | Defines the GID or name of an existing group that will be a secondary
    group for the role. |

    | **-k template_dir** | Specifies the directory containing a template (default)
    `.profile` used for the user profile. |

    | **-m** | Creates the home directory if it doesn’t exist. The home directory
    is defined by **-b** and the role name or **-d**. |

    | **-o** | Allows an existing UID to be specified—that is, allows a role to be
    created with a duplicate UID (see **-u**). |

    | **-p profiles** | Specifies one or more execution profiles (separated by commas).
    |

    | **-s shell** | Specifies the login shell; the default is the Bourne shell (`/bin/sh`).
    |

    | **-u uid** | Specifies the UID of the role. It must be a decimal integer. If
    not specified, the next highest available UID is assigned. |


    The following example creates a role by using the **roleadd** command:


    ```

    # roleadd -A solaris.system.date -P "Printer Management" prt_adm

    #

    ```


    This command creates the prt_adm role. It assigns the solaris.system.date authorization
    and the Printer Management profile to the role.


    To make life a little easier, the **roleadd** command also supports the **-D**
    command-line argument, which allows default values to be assigned to authorizations
    (**-A**), base directory (**-b**), group (**-g**), expiration date (**-e**),'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'maximum inactivity (-f), and execution profile (-P). Subsequent uses of the
    **reload** command will use these default values if they are not specified.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_383_0.png)


    > Roles created with the **reload** command do not have a password. These roles
    are locked and cannot be used until a password is defined for the role by using
    the **passwd(1)** command.


    # Modifying a Role by Using the rolemod Command


    The **rolemod**(1M) command modifies an existing role. The command-line arguments
    are identical to those of the **roleadd** command, with the following exceptions:


    +   - The base directory (**-b**) is not available. Use **-d** to specify a new
    directory. Don’t forget to include **-m** if the home directory doesn’t exist.

    +   - Set defaults (**-D**) is not available.

    +   - The template directory (**-k**) is not available.

    +   - A new role name is specified by using **-l role** if the role name is being
    modified.


    Keep in mind that if the role is changed, the home directory’s name does not change
    unless the **-d** and **-m** command-line arguments are used.


    # Deleting a Role by Using the roledel Command


    The **roledel**(1M) command deletes a role. Not only is the role definition deleted
    from the user_attr file, all role assignments in other user_attr entries are modified.
    The role is specified as a command-line argument. Only one other command-line
    argument is supported: **-r** removes the home directory associated with the role.'
  merge: -1
  img_proc: true
