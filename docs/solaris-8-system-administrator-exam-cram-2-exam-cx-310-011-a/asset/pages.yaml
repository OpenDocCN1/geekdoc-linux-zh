- pgno: 220
  md: 'The first part of this chapter reviews some basic information about file systems,
    including creating, checking, repairing, monitoring, mounting, unmounting, and
    monitoring usage. The second part provides an overview of important file and directory
    concepts and commands you can use to save storage space. The third portion describes
    the commands used to back up and restore files, directories, and file systems.
    This chapter covers the *File Systems*, *Files and Directories*, and *Backup and
    Recovery* test objectives.


    # # File System Basics


    *A file system* is a logical collection of files and directories contained in
    a partition. It can be treated as a single entity when you’re making it available
    for use (mounting), checking it, and repairing it.


    The three types of file systems supported by the Solaris 8 environment are disk
    based, memory based (pseudo), and network based. The Part I exam concentrates
    on disk-based file systems. The Part II exam covers pseudo file systems (Chapter
    16, “Pseudo File Systems and Swap Space”) and network-based file systems (Chapter
    18, “Network File System”).


    Disk-based file systems are stored on physical disks, CD-ROMs, DVDs, and floppy
    disks on the local system. Table 9.1 lists the disk-based file system formats.


    **Table 9.1 Disk-based File Systems**


    | Format | Description |

    |---|---|

    | High Sierra File System (HSFS) | The default format for CD-ROM file systems
    |

    | PC File System (PCFS) | The default format for floppy disk file systems; same
    as the DOS disk format |

    | Universal Disk Format (UDF) | Format for optical media referred to as Digital
    Versatile Disc (DVD) |

    | Unix File System (UFS) | The default format for hard disk file systems |


    Pseudo file systems are memory based and provide access to special system information,
    such as processes. Several pseudo file system formats are used, including CacheFS
    for system cache, Loopback File System (LOFS) to provide alternative pathnames,
    the Temporary File System (TMPFS), and the Process File System (PROCFS).'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# # Default Solaris 8 File Systems


    The disk space available for use with a Solaris 8 operating system is a collection
    of mounted file systems. The top directory is the location where the root file
    system is mounted. The locations where other file systems are mounted, called
    *mount points*, are subdirectories of the root file system, and normally are used
    to refer to the file systems themselves. For example, the file system mounted
    at /usr normally is referred to as the /usr file system. Table 9.2 lists the default
    file systems of a Solaris 8 operating system.


    **Table 9.2  Default File Systems**


    | File System | Use |

    |---|---|

    | root (/) | The top of the hierarchical file system tree. Contains critical system
    files, such as the kernel and device drivers. |

    | /usr | System files, such as commands and programs, used to administer and use
    the system. |

    | /home | User home directories. On some systems, it might be /export/home or
    a network-based file system. |

    | /var | System files that change or grow, such as logs, queues, and spooling
    areas. |

    | /opt | Third-party software and applications. |

    | /tmp | Temporary files cleared each time the system boots. |

    | /proc | Information on active processes. |


    These file systems are UFS file systems. The two memory-based file systems (/tmp
    and /proc) are type TMPFS and PROCFS, respectively.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_221_0.png)


    Because kernel files reside in the root file system and system files reside in
    the /usr file system, these two file systems are required to boot a usable system.


    # ## Creating UFS File Systems


    You can use the **mkfs(1M)**, **mkfs_ufs(1M)**, and **newfs(1M)** commands to
    create a UFS file system. The **mkfs_ufs** command is typically not used directly.
    It is called by the **mkfs** command when **mkfs** is used to create a UFS file
    system. The **newfs** command is the preferred method for creating a UFS file
    system because it provides a user-friendly interface to the **mkfs** command.'
  merge: -1
  img_proc: true
- pgno: 222
  md: "The **newfs** command calculates the appropriate parameters and calls the **mkfs**\
    \ command to create the file system. You can specify command-line arguments to\
    \ override the calculated parameters. The only required command-line argument\
    \ is the raw logical device name of the partition in which the file system should\
    \ be created. The following example uses the **newfs** command to create a UFS\
    \ in a 1GB partition. The **-v** command-line argument specifies *verbose mode*,\
    \ which causes the **newfs** command to display its actions:\n\n```\n```text\n\
    # newfs -v /dev/rdsk/c0d1s7\nnewfs: construct a new file system /dev/rdsk/c0d1s7:\
    \ (y/n)? y\nmkfs -F ufs /dev/rdsk/c0d1s7 2104515 63 240 8192 1024 ... 8 7\nWarning:\
    \ 12286 sectors (5) in last cylinder unallocated\n/dev/rdsk/c0d1s7: 2104514 sectors\
    \ in 140 cylinders of 240 tracks,\n    63 sectors\n 1027.6MB in 24 cyl groups\
    \ (6 cg, 44.30MB/g, 10688 i/g)\nsuper-block backups (for fsck -F ufs -o b=#) at:\n\
    \  32, 90816, 181600, 272384, 363168, 454352, 545136, 635920,\n  726304, 817088,\
    \ 907872, 998656, 1089440, 1180224, 1271008,\n  1361792, 1452576, 1543360, 1634144,\
    \ 1724928, 1815712,\n  1906496, 1997280, 2088064,\n#\n```\n```\n\nAnother useful\
    \ **newfs** command-line option is **-N**, which causes the **newfs** command\
    \ to calculate the parameters that will be used to call the **mkfs** command;\
    \ however, the **mkfs** command is not actually called, and the file system is\
    \ not created. The **-v** command-line argument is used to preview the file system\
    \ parameters. In addition, most of the **mkfs** command-line arguments can be\
    \ specified as **newfs** command-line arguments. If any of them are specified,\
    \ they override any calculated parameters and are passed to the **mkfs** command.\
    \ See the **newfs(1M)** and **mkfs(1M)** manual pages for details.\n\nIf you’re\
    \ using the **mkfs** command directly, you should include the **-F** command-line\
    \ argument to identify the type of file system to create. If you don’t specify\
