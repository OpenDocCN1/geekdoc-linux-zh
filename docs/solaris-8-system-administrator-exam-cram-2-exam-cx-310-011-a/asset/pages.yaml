- pgno: 80
  md: '# # Over-the-Network Installation


    Typically, a system is installed with the Solaris 8 distribution CD using a local
    CD-ROM drive. However, software can be installed over the network if these systems
    are set up:


    +   - **Install server**—A server created by copying the contents of the Solaris
    8 distribution CD to its disk drive or that has the distribution CD available
    in its CD-ROM drive.

    +   - **Boot server**—A server used for booting clients located on a different
    subnet than the install server. The boot server should be located on the same
    subnet as the clients.


    You set up systems to be installed over the network by using Solstice Host Manager
    to add (preconfigure) information about the systems to NIS/NIS+ or by adding the
    information to configuration files of an install server or a boot server.


    # # Software Package Administration


    Both Sun Microsystems and third-party vendors deliver software as easily manipulated
    collections of files and executable installation/removal procedures referred to
    as *packages*. Software packages can be installed on or removed from standalone
    systems or servers in a fairly straightforward manner because both the root and
    /usr file systems are local.


    # # Package Tools


    Solaris 8 package tools provide a convenient mechanism for installing and removing
    packaged software. These package tools are standard Unix commands and are accessible
    through the shell command-line interface. In addition, the system administration
    tool, **admintool**(1M), provides a GUI for installing and removing packages.


    These are the most commonly used command-line package tools:


    +   - **pkgadd**(1M)—Installs packages

    +   - **pkginfo**(1) *and* **pkgparam**(1)—Displays information about packages

    +   - **pkgrm**(1M)—Removes a package

    +   - **pkgchk**(1M)—Checks that a package has been correctly installed'
  merge: -1
  img_proc: true
- pgno: 81
  md: "# Installing a Package by Using the pkgadd Command\n\nThe pkgadd command can\
    \ install a package from disk or CD-ROM. Typically, software obtained through\
    \ the network or from magnetic tape or floppy disk is copied into a spool directory\
    \ on the system before installation. The default package spool directory is /var/spool/pkg,\
    \ but you can use any location with adequate free space.\n\nTo install one or\
    \ more packages located in the default spool directory by using the pkgadd command,\
    \ only the package names need to be specified as command-line arguments. For example,\
    \ to install the SUNWast package, you use the following command:\n\n```\n```text\n\
    # pkgadd SUNWast\n\nProcessing package instance <SUNWast> from </var/spool/pkg>\n\
    \nAutomated Security Enhancement Tools\n(i386) 11.8.0,REV=2000.01.08.18.17\nCopyright\
    \ 2000 Sun Microsystems, Inc. All rights reserved.\nUsing </> as the package base\
    \ directory.\n## Processing package information.\n## Processing system information.\n\
    \   1 package pathname is already properly installed.\n## Verifying package dependencies.\n\
    ## Verifying disk space requirements.\n## Checking for conflicts with packages\
    \ already installed.\n## Checking for setuid/setgid programs.\n\nThis package\
    \ contains scripts which will be executed with\nsuper-user permission during the\
    \ process of installing this package.\n\nDo you want to continue with the installation\
    \ of <SUNWast> [y,n,?] y\n\nInstalling Automated Security Enhancement Tools as\
    \ <SUNWast>\n## Installing part 1 of 1.\nInstallation of <SUNWast> was successful.\n\
    #\n```\n```\n\nIf a package was spooled onto the system into a different directory,\
    \ you specify the alternative spool directory by using the -d command-line argument.\
    \ For example, if the /tmp directory was used to spool the SUNWast package onto\
    \ the system, use the following command to install the package:\n\n```\n```text\n\
    pkgadd -d /tmp SUNWast\n```\n```\n\nTo install a package located on CD-ROM, use\
    \ the -d command-line argument to specify the pathname to the CD-ROM drive. For\
    \ example, you can use the pkgadd command to install the SUNWast package from\
    \ a CD-ROM mounted at /cdrom/cdrom0:\n\n```\n```text\npkgadd -d /cdrom/cdrom0\
    \ SUNWast\n```\n```"
  merge: -1
  img_proc: true
