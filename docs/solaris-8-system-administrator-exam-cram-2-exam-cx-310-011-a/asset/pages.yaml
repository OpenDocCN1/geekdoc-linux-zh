  md: "Answers b and c are correct. Using NFS improves consistency and reduces administration.\
    \ NFS eliminates redundancy by making a single copy of data available to multiple\
    \ clients. Therefore, answer a is incorrect. NFS is a network application, and\
    \ using it will increase network traffic. Therefore, answer d is incorrect.\n\n\
    # Question 10\n\nIdentify the NFS-specific option used with the `-o` command-line\
    \ argument of the **share** command to change the public file handle.\n\nThe correct\
    \ answer is **public**.\n\n# Question 11\n\n+   Which file contains one or more\
    \ share commands used with the **shareall** command?\n+   \n+   - a. `/etc/nfs/nfstab`\n\
    +   - b. `/etc/nfs/shares`\n+   - c. `/etc/dfs/dfstab`\n+   - d. `/etc/dfs/sharet​​ab`\n\
    \nAnswer c is correct. The `/etc/dfs/dfstab` file contains one or more **share**\
    \ commands used with the **shareall** command. The `/etc/nfs/nfstab` and `/etc/nfs/shares`\
    \ files do not exist. Therefore, answers a and b are incorrect. `/etc/dfs/sharet​​ab`\
    \ is the file containing information on shared resources. Therefore, answer d\
    \ is incorrect.\n\n# Question 12\n\n+   The command `cfsadmin -s xyz` fails. Which\
    \ of the following is probably the reason?\n+   \n+   - a. `xyz` is a mount point.\
    \ It should be the name of a cache.\n+   - b. The **demandconst** option was not\
    \ specified when mounting xyz.\n+   - c. Cache logging has not been started.\n\
    +   - d. The size of the cache is too small."
  merge: -1
  img_proc: true
- pgno: 410
  md: Answer b is correct. The **cfsadmin -s xyz** command probably failed because
    the **demandconst** option was not specified when mounting xyz. xyz must be a
    point mount, not a cache name. Therefore, answer a is incorrect. The **-s** command-line
    argument performs a consistency check; it does not have anything to do with logging
    or cache size. Therefore, answers c and d are incorrect.
  merge: -1
