- pgno: 227
  md: 'CD-ROM from the CD-ROM drive. If more than one CD-ROM is mounted, you specify
    the mount point—for example, **eject cdrom0**. See the **eject(1)** manual page
    for more details.


    # Using Floppy Disks


    Unlike CD-ROMs, floppy disks are not automatically mounted by the **vold** program.
    Instead, you can use the **volcheck(1)** command to instruct **vold** to scan
    all floppy disk drives and mount any floppy disks under the /floppy directory.
    The first floppy disk is mounted at /floppy/floppy0, the second at /floppy/floppy1,
    and so on. Once mounted, the floppy disk can be used like any (small) read/write
    disk drive.


    When the floppy disk is no longer needed, you can use the **eject** command without
    any command-line arguments to unmount it. Or, if more than one floppy disk is
    mounted, you supply the name of the mount point as a command-line argument—for
    example, **eject floppy0**.


    # Monitoring File System Usage


    Several commands can be used to monitor file system usage: **df(1)**, **du(1)**,
    and **quot(1M)**.


    The **df** command (without command-line arguments) displays the mount point,
    logical block device name, number of free 512-byte blocks, and number of files
    that can be created for each file system. (The **-k** command-line argument lists
    sizes in 1,024-byte blocks or kilobytes instead of 512-byte blocks.) The command
    can also be used to display the disk space used by file systems. The following
    example shows the use of the df command:


    ```

    ```text

    # df

    /proc            (/proc          ):       0 blocks     948 files

    /                (/dev/dsk/c0d0s0 ):    56098 blocks    35834 files

    /usr              (/dev/dsk/c0d0s3 ):   181578 blocks    168053 files

    /var              (/dev/dsk/c0d0s3 ):   307080 blocks    147835 files

    /export/home      (/dev/dsk/c0d0s7 ):  1854626 blocks    488882 files

    /opt              (/dev/dsk/c0d0s5 ):    15272 blocks    109653 files

    /tmp              (swap           ):   311360 blocks       9985 files

    /usr2             (/dev/dsk/c0d1s7 ):  2039566 blocks    256508 files

    #

    ```

    ```


    The **du** command lists the number of 512-byte blocks allocated to each subdirectory
    and the total for the current directory. Several frequently used command-line
    arguments include **-a** to list all nondirectory files, **-k** to list sizes
    in terms of 1,024-byte blocks (kilobytes) instead of 512-byte blocks, and **-s**
    to report only the total sum of the specified files. The following example uses
    the **du** command to determine the amount of storage space allocated to the /etc/openwin
    directory and its contents:'
