- pgno: 203
  md: 'component configurations, test system components, and display system component
    status. The **cfgadm** command supports hot-plugging SCSI devices on SPARC and
    Intel-compatible platforms and PCI adapter cards on Intel-compatible platforms.


    The components in the system that support hot-plugging and require dynamic reconfiguration
    are referred to as *attachment points*. An attachment point consists of an *occupant*
    (a device that can be added to or removed from the system) and a *receptacle*
    (a location such as a slot or connector that accepts the occupant). Receptacles
    have three states:


    +   - **Empty**—No occupant.

    +   - **Disconnected**—The occupant is isolated from the system (typically used
    for testing the occupant or when the occupant is unconfigured).

    +   - **Connected**—The occupant is configured and accessible by the system. (This
    is the normal state.)


    Occupants are typically in the unconfigured state or the configured state. Configured
    is the normal operational state.


    The overall status condition of the attachment point (receptacle and occupant)
    can be ok, failing, failed, unusable, or unknown. The status condition of an attachment
    point is the result of errors that occur during operation or diagnostic tests
    run to identify and isolate faulty components.


    # Hot-Plugging SCSI Controllers and Devices


    The **cfgadm** command displays information about hot-plugging configurations,
    connects and disconnects SCSI controllers, and configures or unconfigures SCSI
    devices.


    Attachment points are represented using *attachment point IDs* (AP_Ids). For example,
    SCSI controllers are represented by using IDs such as c0 and c1. A SCSI device
    such as disk /dev/dsk/c1t3d0 that is attached to controller c1 has an AP_Id of
    c1::dsk/c1t3d0, whereas a tape drive such as /dev/rmt/0 attached to controller
    c0 has an AP_Id of c0::rmt/0. Refer to the **cfgadm(1M)** manual page for more
    information on attachment point IDs.


    You can use the **-al** command-line argument to display information about SCSI
    controllers and devices. The following **cfgadm** command displays this information:


    ```

    ```text

    # cfgadm -al

    AP_Id             Type       Receptacle   Occupant   Condition

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 204
  md: '```

    c0          scsi-bus   connected   configured   unknown

    c0::rmt/0   tape       connected   configured   unknown

    c1          scsi-bus   connected   configured   unknown

    c1::dsk/c1t3d0  disk   connected   configured   unknown

    #

    ```


    You can disconnect a SCSI controller by using the **cfgadm -c disconnect AP_Id**
    command. For example, to disconnect the c1 controller, use the following command:


    ```

    # cfgadm -c disconnect c1

    #

    ```


    Likewise, to connect the c1 controller, use the following command:


    ```

    # cfgadm -c connect c1

    #

    ```


    Adding a SCSI device (such as a disk) requires the **cfgadm -x insert_device AP_Id**
    command. For example, to add a disk to the c0 controller on a SPARC system, use
    this command:


    ```

    # cfgadm -x insert_device c0

    Adding device to SCSI HBA: /devices/sbus@f1,0/SUNW,fas@0,8800000

    This operation will suspend activity on SCSI bus: c0

    Continue (yes/no)? y

    SCSI bus quiesced successfully.

    It is now safe to proceed with hotplug operation.

    Enter y if operation is complete or n to abort (yes/no)? y

    #

    ```


    You can use similar **cfgadm** commands to replace (**cfgadm -x replace_device
    AP_Id**), remove (**cfgadm -x remove_device AP_Id**), configure (**cfgadm -c configure
    AP_Id**), or unconfigure (**cfgadm -c unconfigure AP_Id**) SCSI devices as needed.
    In addition, you can use the **cfgadm -t AP_Id** command to perform diagnostic
    tests on an attachment point.


    # Hot-Plugging PCI Adapter Cards


    The **cfgadm** command displays information about hot-plugging configurations
    and connects, disconnects, configures, and unconfigures PCI adapter cards.


    Attachment point IDs (AP_Ids) for PCI devices are based on the PCI bus and slot.
    For example, slot 0 of PCI bus 1 has an AP_Id of pci1:hp0_slot0.'
