    # # The format Command


    The format(1M) command supports the ability to format, analyze, repair, label,
    and partition disk drives. The format command provides an interactive menu from
    which subcommands and submenus can be selected. Table 8.4 describes these format
    subcommands and submenus.


    **Table 8.4  Subcommands and Submenus of the format Command**


    | Subcommand or Submenu | Description |

    |---|---|

    | disk | Selects a disk |

    | type | Defines a disk type |

    | partition | Creates/modifies a partition table for the selected disk (submenu)
    |

    | current | Displays information on the selected disk |

    | format | Formats and analyzes the selected disk |

    | fdisk | Runs the fdisk(1M) program for the selected disk (Intel-compatible only)
    |

    | repair | Repairs a defective sector on the selected disk |

    | show | Translates a disk address (Intel-compatible only) |

    | label | Writes a label to the selected disk |

    | analyze | Performs surface analysis on the selected disk (submenu) |

    | defect | Displays a defect lists for the selected disk (submenu) |

    | backup | Searches for backup labels |

    | verify | Displays the label for the selected disk |

    | save | Saves new disk/partition definitions |

    | inquiry | Displays the vendor, model, and revision of the selected disk (SPARC
    only) |'
  merge: -1
  img_proc: true
