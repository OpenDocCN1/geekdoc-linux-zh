- pgno: 56
  md: '| Section | Description |

    |---|---|

    | 1 | Commands available to all users. Included are commands that are part of
    the BSD Compatibility Package (1B), commands used to communicate between systems
    (1C), commands associated with the *Form and Menu Language Interpreter* (1F),
    and commands specific to the SunOS system (1S). |

    | 1M | Commands used for system maintenance and administration. Some are restricted
    to system administration login accounts (such as root). |

    | 2 | Low-level operating system calls that C language programs can use to access
    and control system resources. |

    | 3 | Functions available in system libraries that C language programs can use
    to access and control system resources. This section is subdivided based on library
    function (basic, networking, threads, curses, and so on). |

    | 4 | Format of various system configuration files. Also included are descriptions
    of the C language data structure declarations that can be used to access some
    system files via a C language program. |

    | 5 | Miscellaneous topics, such as standards, environments, and macros. |

    | 6 | Any available games or demos. |

    | 7 | Special files associated with specific hardware, device drivers, and components
    of the STREAMS I/O subsystem. |

    | 9 | Two kernel-level device driver specifications: the Device Driver Interface
    (DDI) and the Driver/Kernel Interface (DKI). This section is subdivided based
    on topic (entry points, functions, data structures, and so on). |


    Note that Section 8 is not used. In the original AT&T Unix System V operating
    system, Section 8 was used to describe special system maintenance procedures.
    For Solaris, these procedures are described in the *System Administration Guide*
    and other guides and manuals.


    Typically, each section of the *Reference Manual* is printed as a separate volume.
    When a man page is referenced in text, the section number may be specified in
    parentheses after the name of the command. This number might not be important
    in the online manuals, but if you are trying to locate a manual page within a
    stack of printed manuals more than a foot high, knowing the section number (that
    is, which volume) saves a lot of time and effort. Therefore, man(1) indicates
    that the **man** command is located in Section 1: “User Commands.”


