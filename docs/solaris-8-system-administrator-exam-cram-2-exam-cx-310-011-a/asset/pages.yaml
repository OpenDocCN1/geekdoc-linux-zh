- pgno: 184
  md: '**Table 7.3  Signals Used to Terminate Processes (continued)**


    | Symbolic Name | Value | Description |

    |---|---:|---|

    | SIGKILL | 9 | Kill |

    | SIGTERM | 15 | Terminate (default signal for the **kill** and **pkill** commands)
    |

    | SIGUSR1 | 16 | User signal 1 |

    | SIGUSR2 | 17 | User signal 2 |


    You can specify the signal by using its symbolic name (excluding the SIG prefix)
    or its numeric value. If a signal is not specified, SIGTERM (15) is sent by default.
    The PIDs of the processes to be terminated must be known. The following listing
    sends the KILL signal (9) to several processes, using the kill command:


    ```

    ```text

    # kill -KILL 4220 4224 4229

    #

    4229 Killed

    4224 Killed

    4220 Killed

    # kill -9 4247

    #

    4247 Killed

    ```

    ```


    A PID preceded by a minus sign is interpreted as a process group ID, and the signal
    is sent to all processes in that process group.


    # The pgrep and pkill Commands


    The **pgrep**(1) and **pkill**(1) commands support viewing and terminating processes
    by name or other attributes, such as UID, GID, and so on. Table 7.4 lists the
    command-line arguments supported by both the **pgrep** and the **pkill** commands.


    **Table 7.4  Common pgrep and pkill Command-Line Arguments**


    | Argument | Description |

    |---|---|

    | *pattern* | Regular expression to match against the program name and/or arguments
    |

    | **-f** | Matches the pattern against full arguments instead of the program name
    |

    | **-g Process Group ID** | Matches processes with the specified process group
    ID |

    | **-G Real Group ID** | Matches processes with the specified real group ID |

    | **-n** | Matches only the newest process that meets the specified criteria |'
