    NFS supports *client-side failover*. That is, if an NFS resource becomes unavailable,
    the client can switch to another NFS server that provides a “replicated” copy
    of the resource. You enable this failover capability by adding an entry in the
    /etc/vfstab file for the resource. In the **Device To Mount** field, list the
    systems that provide the replicated resource, separated by commas. You should
    also specify the read-only option (**-o ro**) in the **Mount Options** field.
    For example, to provide client-side failover for the /export/local resource that
    is available from the **alpha** or the **beta** NFS server and mounted at /usr/local,
    add the following entry to the /etc/vfstab file:


    ```

    alpha,beta:/export/local - /usr/local nfs - no -o ro

    ```


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_396_0.png)


    The read-only resources (-o ro mount option) should be configured for client-side
    failover. Also be certain that the system hostnames or IP addresses are valid
    and separated by commas.


    # The mountall and umountall Commands


    The **mountall** command is used to mount one or more local file systems and/or
    remote (NFS) shared file systems or directories. If the name of a file (containing
    information on one or more resources) is not specified as a command-line argument,
    the /etc/vfstab is used by default. The **mountall** command will mount only the
    resources in the file system table (or specified file) that have the **Mount At
    Boot** column set to **yes**.


    If a file system type is specified by using the **-F** command-line option, only
    file systems of that type are mounted. If the **-l** command-line argument is
    specified, only local file systems or directories are mounted. If the **-r** command-line
    argument is specified, only remote shared file systems or directories are mounted.'
  merge: -1
  img_proc: true
- pgno: 397
  md: 'The **umountall** command is used to unmount all currently mounted resources.
    It also supports the **-F**, **-l**, and **-r** command-line arguments supported
    by the **mountall** command. In addition, it supports the **-h host** command-line
    argument to specify that only the resources mounted from that host should be unmounted.
    The **-k** command-line argument can be used to kill processes using the user(1M)
    command to allow unmounting. Also, the **-s** command-line argument prevents unmount
    operations from being performed in parallel. Currently mounted file resources
    are typically listed in the /etc/mnttab file.


    # The dfmounts Command


    The **dfmounts**(1M) command lists currently mounted resources on the local or
    a remote system (and its clients). If you specify the hostname (or IP address)
    of a remote system as a command-line argument, the resources mounted on that system
    (and its clients) are listed.


    In addition, two other command-line arguments are supported. The **-F nfs** command-line
    argument specifies the type of file system. If not specified, the default file
    system type listed in the /etc/dfstab file (NFS) is assumed. If the **-h** command-line
    argument is specified, the header describing the columns of the listing is not
    displayed. The following listing uses the **dfmounts** command to list the NFS
    resources on the local system named **solaris**:


    ```

    ```text

    # dfmounts

    RESOURCE   SERVER PATHNAME          CLIENTS

    .          -      solaris /export/home   uxsys2.amb.org

    ```

    ```


    # WebNFS


    WebNFS extends the NFS protocol to allow Web browsers or Java applets to access
    NFS shared resources. It enables client systems to access NFS resources without
    requiring them to be NFS clients. Browsers can access NFS resources by using an
    NFS Uniform Resource Locator (URL) that takes the form **nfs://server/path**.
    RFCs 2054 and 2055 define the WebNFS server and client specifications.


    The **share** command supports two NFS-specific options that pertain to WebNFS
    access. The first is the **public** option. Each server has one public file handle
    associated with the server’s root file system. NFS URLs are relative to the public
    file handle. For example, accessing the target directory under the /usr/data shared
    resource on the host server requires using the **nfs://server/data** target NFS
    URL. However, if the public option is specified when the /usr/data directory is
    shared, the public file handle is'
  merge: -1
  img_proc: true
- pgno: 398
  md: 'associated with the /usr/data directory; this association allows using the
    **nfs://server/target** NFS URL to access the same data.


    The second option is **index**, which specifies a file containing information
    that should be displayed instead of a listing of the directory. The following
    listing uses the **share** command to enable read/write NFS and WebNFS access
    relative to the /export/home directory:


    ```

    ```sh

    # share -F nfs -o rw,public,index=index.html /export/home

    #

    ```

    ```


    # # The Auto File System Service


    The Auto File System (AutoFS) service is a client-side service used to automatically
    mount and unmount NFS resources on demand. This service simplifies keeping track
    of resources manually and can reduce network traffic. In addition, AutoFS eliminates
    the need to add NFS mounts in the /etc/vfstab file. It allows faster booting and
    shutdown, and users need not know the root password to mount/unmount NFS resources.


    The **automount**(1M) command runs when the system is booted (system run level
    2) and initializes the AutoFS service. In addition, the **automountd**(1M) command
    is started at this time. The **automountd** command is a daemon process that runs
    continuously and provides the automatic mounting and unmounting.


    By default, a resource is unmounted if it is not accessed for 10 minutes. You
    can modify this default time by using the **automount** command and including
    the **-t** command-line argument followed by a number representing a time (in
    seconds).


    The configuration of the AutoFS service is controlled by **AutoFS maps** that
    define local mount points and associate remote NFS resources with the mount points.
    The **automount** command reads these maps during initialization.


    # ## AutoFS Maps


    The three types of AutoFS (or automount) maps are auto_master, direct, and indirect.
    All these maps are under the /etc directory.'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# The /etc/auto_master File


    The auto_master file associates directories with indirect maps. In addition, the
    auto_master file references one or more direct maps. Entries in the auto_master
    file consist of three fields:


    +   - **Mount point**—The initial portion of a full pathname to a local directory
    where an NFS resource should be mounted.


    +   - **Map name**—The filename of a map (direct or indirect) or a special built-in
    map. You can identify a built-in map by the first character in its name, which
    is a hyphen (-).


    +   - **Map options**—Zero or more (comma-separated) NFS-specific mount options,
    as described earlier in Table 18.3


    A special mount point that uses the notation `/-` indicates that the map listed
    in the map name field is a direct map that actually contains the mount points.
    In addition, a special entry consisting of only the keyword **+auto_master** is
    used to include AutoFS maps that are part of Network Information Service (NIS)
    or NIS+.


    The following example shows the contents of the /etc/auto_master file:


    ```

    ​​​​# Master map for automounter

    #

    +auto_master

    /net            -hosts          -nosuid,nobrowse

    /home           auto_home       -nobrowse

    /xfn            -xfn

    /               auto_direct

    ```


    As previously described, the **/net** and **/xfn** entries reference built-in
    maps. The **/home** entry references the indirect map /etc/auto_home, and the
    **/** entry references the direct map /etc/auto_direct.


    The **-hosts** built-in map uses the hosts database. The **-xfn** built-in map
    uses resources shared through the Federated Naming Service (FNS).


    # Direct Maps


    A direct map provides both mount point and NFS resources. Entries in a direct
    map consist of three fields:


    +   - **Key**—Typically a full pathname to be used as a mount point.


    +   - **Mount options**—Zero or more (comma-separated) NFS-specific mount options,
    as described earlier in Table 18.3.'
  merge: -1
  img_proc: true
- pgno: 400
  md: '+   - **NFS resource**—Files that take the form *server:file system*, which
    identifies a file system shared by the system server. Because more than one NFS
    server might be providing the same resource, multiple resources can be specified
    (separated by spaces). The first available resource is used.


    The following example shows the contents of the /etc/auto_direct file that is
    referenced in the /etc/auto_master file:


    ```

    ```text

    /usr/local/bin              nfsserver:/usr/local/bin

    /usr/games       -ro        nfsserver:/usr/games

    ```

    ```


    In this example, the /usr/local/bin and /usr/games directories shared by the host
    named **nfsserver** are mounted on the local system under mount points using the
    same names.


    ![](img/b957f979417d9f16274c2eb52c8f2c9f_400_0.png)


    The default name for the initial direct map is auto_direct.


    # Indirect Maps


    An indirect map provides the remainder of the /etc/auto_master mount point and
    identifies the NFS resource that should be mounted on the client. Entries in an
    indirect map consist of three fields:


    +   - **Key**—Typically a directory that provides the remainder of the mount point.

    +   - **Mount options**—Zero or more (comma-separated) NFS-specific mount options,
    as described earlier in Table 18.3.

    +   - **NFS resource**—Files that take the form *server:file system*, which identifies
    a file system shared by the system server.


    The following example shows the contents of the /etc/auto_home file:


    ```

    ```text

    dla       solaris:/export/home/dla

    guest     -rw,nosuid       nfsserver:/export/home/guest

    ```

    ```


    In this example, the indirect map is referenced by the **/home** entry in the
    auto_master file. It contains two entries. The first entry identifies the /home/dla
    mount point, which is used to mount the /export/home/dla directory from the host
    named **solaris**. The second entry identifies the /home/guest mount point, which
    is used to mount the /export/home/guest directory from the host named **nfsserver**.'
  merge: -1
  img_proc: true
