    # ## Changing File Ownership


    Two commands are used to control file ownership:


    +   - **chown(1M)**—Changes file user account ownership

    +   - **chgrp(1M)**—Changes file group account ownership


    # ### Changing the File User Account


    The **chown** command is used to change the file user account that is the owner
    of a file or directory. You specify the user account name or associated UID along
    with the name of one or more files that should be owned by the specified user
    account. The following example uses the **chown** command to change the ownership
    of several files to the guest user account, which has a UID of 1001. Each **chown**
    command is preceded and followed by the **ls** command, which lists the file ownership
    and permissions:


    ```

    ```text

    # ls -l

    total 18

    -rw-rw-rw-  1 root   other       120 Feb 28 07:38 data

    -rw-rw-rw-  1 root   other      6528 Feb 28 07:38 junk

    -rw-r--r--  1 root   other       636 Feb 28 07:39 list

    # chown guest junk

    # ls -l

    total 18

    -rw-rw-rw-  1 root   other       120 Feb 28 07:38 data

    -rw-rw-rw-  1 guest  other      6528 Feb 28 07:38 junk

    -rw-r--r--  1 root   other       636 Feb 28 07:39 list

    # chown 1001 data

    # ls -l

    total 18

    -rw-rw-rw-  1 guest  other       120 Feb 28 07:38 data

    -rw-rw-rw-  1 guest  other      6528 Feb 28 07:38 junk

    -rw-r--r--  1 guest  other       636 Feb 28 07:39 list

    #

    ```

    ```


    The **chown** command supports a recursive command-line argument, **-R**. When
    you use it to change a directory’s owner, the ownership of any files or subdirectories
    under the directory also changes.


    Even though a separate command exists to change file group account ownership,
    you can use the **chown** command to change group ownership at the'
