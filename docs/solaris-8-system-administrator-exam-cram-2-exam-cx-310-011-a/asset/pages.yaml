- pgno: 18
  md: '# # About the Author


    Darrell L. Ambro has been using various forms of Unix since 1977. During his career,
    he has been involved in a variety of projects supporting both military and civilian
    organizations of the U.S. government. These projects involved local area network
    (LAN) design, operation, implementation and troubleshooting, application development
    and systems integration, system security and intrusion detection, database design,
    system administration, system test, proposal development, acceptance test/sales
    support, software maintenance, tier 2 support, and corporate computer infrastructure
    support.


    In addition to being a Sun Certified System Administrator for Solaris 2.6, Solaris
    7, and Solaris 8, Darrell is also a Sun Certified Network Administrator for Solaris
