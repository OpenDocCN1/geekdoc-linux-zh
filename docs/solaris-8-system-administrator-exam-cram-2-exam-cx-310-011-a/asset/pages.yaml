    # ls -l

    total 18

    -rw-rw-rw-  1 sys      staff       120 Feb 28 07:38 data

    -rw-rw-rw-  1 sys      staff      6528 Feb 28 07:38 junk

    -rw-r--r--  1 sys      staff       636 Feb 28 07:39 list

    #

    ```

    ```


    If anyone other than **root** uses the **chown** command to change the ownership
    of a file that has the setuid special permission, setuid is cleared. This action
    prevents a user from setting up a setuid file, changing the ownership to someone
    else, and then using the file to gain access to another user account.


    As an enhanced security feature of Solaris 8, use of the **chown** command is
    restricted to the superuser account. You can remove this restriction by clearing
    the following kernel parameter in the /etc/system file and rebooting the system:


    ```

    ```text

    set rschown = 0

    ```

    ```


    Setting **rschown** to 1 and rebooting the system will enforce the restriction
    again.


    # Changing the File Group Account


    The **chgrp** command changes the file group account associated with a file or
    directory. Only the user account that currently owns the file or the superuser
    account (root) can change file ownership. By default, a file’s owner can change
    only a group account to which the user belongs.


    You specify the group account name or associated GID along with the name of one
    or more files that should be owned by the specified group account. The following
    example shows the **chgrp** command being used to change the ownership of several
    files to the other group account, which has a GID of 1. Each **chgrp** command
    is preceded and followed by the **ls** command, which lists the file ownership
    and permissions:


    ```

    ```text

    # ls -l

    total 18

    -rw-rw-rw-  1 sys      staff       120 Feb 28 07:38 data

    -rw-rw-rw-  1 sys      staff      6528 Feb 28 07:38 junk

    ```

    ```'
