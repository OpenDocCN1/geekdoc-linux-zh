- pgno: 266
  md: '# The rsh Command


    The rsh command executes a command on a remote system. At a minimum, two command-line
    arguments are required: the remote hostname and the command to be executed. As
    with the other r commands, the remote authentication database is used. If the
    desired remote user account is not the same as the local user account, it is identified
    by using the -l command-line argument. In the following examples, the ls command
    is executed for the /tmp directory on the remote system solaris8:


    ```

    ```text

    $ rsh solaris8 "ls /tmp"

    ab2.socat.cache

    dtdbcache_0

    file.txt

    mp5eanNc

    mpfnaoNc

    mpjAwMwc

    mpqvoOMc

    ps_data

    sdtvolcheck388

    $

    ```

    ```


    # The Remote Authentication Database


    The remote authentication database is used to determine which remote hosts and
    users are considered “trusted.” The rlogin, rsh, and rcp commands use the remote
    authentication database. This database consists of two types of files: the /etc/host.equiv
    file, which applies to the entire system, and the .rhosts files, which apply to
    individual user accounts and are located in the home directories of user accounts.


    You use the remote authentication database to determine whether a user on a remote
    system can access the local system using the same user account. For example, if
    the “guest” account on a remote system is authorized to access the local system
    and then does so using the rlogin command, the user is automatically logged in
    to the local system as “guest” without providing a user account name and password.


    The remote authentication procedure first checks to determine whether the remote
    system’s hostname is listed in the /etc/hosts.equiv file. If it is listed, remote
    authentication succeeds and the user is granted access.


    If the remote system’s hostname is not listed, the remote authentication continues.
    The home directory of the local user account name (that matches the user account
    name of the remote user) is checked to determine whether the remote system’s hostname
    is listed in the .rhosts file. If it is listed, remote authentication succeeds
    and the user is granted access to the local system. If'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'it is not listed, remote authentication fails and the user is prompted for
    a local user account name and password.


    Both files consist of a list of hostnames (one per line). A hostname by itself
    or preceded by a plus sign (+) is considered a trusted host and allowed access.
    If a hostname is preceded by a minus sign (-), the host is considered untrusted
    and denied access.


    Optionally, a hostname can be followed by a user account name. If this form is
    used in the /etc/hosts.equiv file and the remote user account matches the specified
    user account name, the user is given access as any user. If the user is allowed
    to access the system using any user account, the user either provides the user
    account as a command-line option to the rlogin command or is prompted for it.
    If the optional form is used in the .rhosts file, the remote user is given access
    as the specified user account.'
  merge: -1
  img_proc: true
