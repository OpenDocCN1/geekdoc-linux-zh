    case, we use the loopback interface and its IP address since both Apache and Nginx
    are installed in the same physical server. If you do not host Apache on the same
    server, you will need to specify the IP address of the network interface that
    can communicate with the server hosting Nginx. 3) The port that was just selected
    must be reported in all our virtual hosts configuration sections (in `/etc/apache2/sites-available/default`).


