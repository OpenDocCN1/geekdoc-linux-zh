    it’s also a real risk due to the fact that in a large organization, it is not
    likely that all users will know the difference between a legitimate key generated
    by your IT department, and keys generated by a malicious third party. In this
    case, you need to buy a certificate from a trusted third party, such as GeoTrust
    (used by Google), DigiCert, Comodo, Thawte, or VeriSign (used by Facebook, for
    example). For other cases, especially when you want to use https for your own
    use (i.e. securing your admin panel), a self-signed certificate will do just fine.


