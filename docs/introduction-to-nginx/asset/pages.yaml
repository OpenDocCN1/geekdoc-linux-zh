  md: '# ## Chapter 2


    # # Nginx Configuration Guide


    # ### 2.1 Configuration file syntax


    According to Merriam-Websters online dictionary, the word syntax represents "the
    way in which words are put together to form phrases, clauses, or sentences". Of
    course that definition, as it is taken from a dictionary, is aimed at English
    (or actually any other language) students. So what about IT people coming from
    all backgrounds, languages, and countries? The change in context does not alter
    the meaning of the term very significantly. In particular, the syntax of a configuration
    file must be correct, as seen by the program that will parse it, in order for
    it to work efficiently.


    We will learn to understand and how to write (and / or modify) a configuration
    file for Nginx under Ubuntu 12.04 LTS. That will be accomplished by specifying
    a set of values that will define the behavior of the web server.


    # ### 2.2 Configuration directives


    By default, the behavior of Nginx is defined by its main configuration file, which
    is located (as seen before and unless we have modified this setting) at `/usr/local/nginx/conf/nginx.conf`.
    This file is composed of a list of directives organized in a logical structure
    that is very easy to follow and understand (see Fig. 2.1).'
  merge: -1
  img_proc: true
- pgno: 21
  md: "```\n1 user nobody;  \n2 worker_processes 1;  \n3  \n4 #error_log logs/error.log;\
    \  \n5 #error_log logs/error.log notice;  \n6 #error_log logs/error.log info;\
    \  \n7  \n8 pid /var/run/nginx.pid;  \n9  \n10  \n11 events {  \n12 worker_connections\
    \ 1024;  \n13 }  \n14  \n15  \n16 http {  \n17 include mime.types;  \n18 default_type\
    \ application/octet-stream;\n```\n\nFigure 2.1: Nginx main configuration file\
    \ (nginx.conf)\n\nThe lines that begin with \"#\" are comments, or in other words,\
    \ strings of text that are not interpreted by the program during execution. You\
    \ can comment out entire lines or add brief comments after a line to clarify what\
    \ it is supposed to do.\n\nThe next line shows a directive, in this case worker_processes,\
    \ which represents a setting to which we will append one or more values, depending\
    \ on its syntax. Actually, the worker_processes directive only accepts one argument,\
    \ which needs to be a numerical value. Another example of a directive is user\
    \ (which is commented out in the previous line). The user directive lets us add\
    \ up to 2 text strings - the first one is required and indicates the user account\
    \ Nginx will run as, and the second one is optional (user group). We will need\
    \ to remember, right from the start, that each directive has its own meaning and\
    \ defines a particular feature of the application.\n\nEach module that is part\
    \ of Nginx has a specific set of directives. When a new module is activated, its\
    \ specific set of directives becomes available, and directive blocks may also\
    \ be enabled.\n\nDirective blocks are precisely that: a block of text that lets\
    \ us specify a logical construction of the configuration and allows us to use\
    \ inheritance, which means that configuration found in a certain block is passed\
    \ on to its children blocks as well. However, inside a children block you can\
    \ still change the value of a directive that was defined in its parent block.\n\
    \nIn Fig. 2.2 and 2.3 we see that all access to the root directory of the site\
    \ (/) is saved to /home/gacaneqa/nginx-1.5.6/html/access_log except for the access\
    \ to the directory named restricted (notice the directive access_log off) in the\
    \ corresponding directive block."
