- pgno: 66
  md: "now? As before, our robust Nginx web server has the answer. We will simply\
    \ forward incoming requests on port 80 (external connections) to another port\
    \ (8080 in this case for internal connections). This way we are using Nginx as\
    \ a reverse proxy and the outside world cannot talk to the chat room application\
    \ directly, but through Nginx, which acts as a frontend server. This scenario\
    \ will also allow us to use SSL certificates to encrypt traffic.\n\nWe will go\
    \ ahead and edit the nginx.conf file (see Fig. 6.9) adding a few directives from\
    \ the proxy module.\n\n```\n```nginx\nserver {\n\tlisten\t\t\t80;\n\tserver_name\t\
    nGINXTEST.com;\n\troot\t/home/gacanepa/chatroom;\n\taccess_log /home/gacanepa/nginx-1.5.6/html/access_log\
    \ MyLogFormat;\n\terror_log /home/gacanepa/nginx-1.5.6/html/error_log;\n\tlocation\
    \ / {\n\t\tproxy_pass http://localhost:8080;\n\t\tproxy_http_version 1.1;\n\t\t\
    proxy_set_header Upgrade $http_upgrade;\n\t\tproxy_set_header Connection \"upgrade\"\
    ;\n\t\tproxy_set_header Host $host;\n\t\tindex index.html index.htm;\n\t}\n}\n\
    ```\n```\n\nFigure 6.9: The main configuration file, nginx.conf\n\nWe will discuss\
    \ each directive in detail:\n\n+   * **proxy_pass** http://localhost:8080: enables\
    \ reverse proxying to a backend server by specifying its location (in this case,\
    \ the same host, port 8080).\n\n+   * **proxy_http_version** 1.1: sets the HTTP\
    \ version to be used for communicating with the proxy backend. HTTP 1.0 is the\
    \ default value, but if we need to enable keepalive connections, it's best to\
    \ set this directive to 1.1.\n\n+   * **proxy_set_header**: This directive allows\
    \ you to redefine header values to be transferred to the backend server. As we\
    \ can see, it can be declared multiple times.\n\n+   * **proxy_set_header** Host\
    \ $host: The Host HTTP header in the request forwarded to the backend server defaults\
    \ to the proxy hostname, as specified in the configuration file. This setting\
    \ lets Nginx use the original Host from the client request instead. Refer to tutorial\
    \ #2 for a complete list of http headers.\n\nSince we want the app would start\
    \ automatically when the server booted up, we need to manage the Node process\
    \ with an init script or an upstart supervisor. We will choose the second option\
    \ in this tutorial. First, we will install forever, a very useful tool for running\
    \ and monitoring Node.js processes (see Fig. 6.10).\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_66_0.png)"
