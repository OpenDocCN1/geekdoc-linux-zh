    As a extra security measure, we can tell Apache to only serve requests coming
    from the fronted server. This can be performed in 2 ways: 1) system wide or by
    2) establishing per-virtua-host restrictions.


    +   1) As discussed earlier, the Listen directive of Apache lets you specify a
    port, but also an IP address. However, by default, no IP address is selected which
    results in communications coming from all interfaces. All you have to do is replace
    the `Listen *:8080` directive by `Listen 127.0.0.1:8080`, Apache should then only
    listen on the local IP address.

    +   2) Using the allow and deny Apache directives we can define which IP addresses
    will be able to access each virtual host. Once the changes are made, Apache must
    be restarted (or its configuration reloaded) in order to reflect the changes that
    we have just made.'
