  md: '+   The **configuration** module enables file inclusions with the include directive,
    as discussed earlier. The directive may be placed anywhere in the configuration
    file and accepts one (and only one) parameter: the file’s path relative to the
    current working directory (unless it is specified with the path all the way down
    from the / directory).


    # ### 2.5 The HTTP Server


    The web server itself is configured using the directives found in the HTTP Core
    module. This module is the essential component of the HTTP configuration and will
    allow us -among other things- to serve multiple websites, which are referred to
    as virtual hosts. It is organized into three major blocks (see Fig. 2.9):


    +   **http**: must be placed at the root of the configuration file. It is used
    to define directives and blocks related to the web server functionality of Nginx.

    +   **server**: must be inserted inside the http block and is used to declare
    a specific website.

    +   **location**: allows us to define a group of settings to be applied to certain
    sections of the web site. This block can either be used within a server block
    or nested inside another location block.


    ```

    gacanepa@ubuntuOS:/usr/local/nginx/conf$

    http {

    include    mime.types;

    default_type application/octet-stream;

    #access_log logs/access.log main;

    sendfile     on;

    keepalive_timeout  65;

    server {

    listen       80;

    server_name  localhost;

    root  /home/gacanepa/nginx-1.5.6/html;

    access_log  /home/gacanepa/nginx-1.5.6/html/access_log;

    location / {

    index index.html index.htm;

    }

    location /restricted {

    index index.html index.htm;

    access_log off;

    }

    error_page   404 /404.html;

    }

    ```


    ![](img/3adf2b91cc40e3d0012eab041f055ca8_26_0.png)


    # ### 2.6 Mail server proxy


    To act as mail server (not enabled by default), Nginx must be compiled with the
    `--with-mail` (which enables mail server proxy module with support for POP3, IMAP4,
    and SMTP) option in `./configure`. If for some reason this will be the only use
    of Nginx in our system, the HTTP Core module can be disabled using the `--without-http`
    switch.'
  merge: -1
