  mdcn: "\n# 2.3 结构与包含\n\n以“#”开头的行是注释，换句话说，就是程序在执行期间不会解释的文本字符串。你可以注释掉整行，也可以在行后添加简短的注释来阐明其预期功能。\n\
    \n下一行显示了一个指令，本例中为 worker_processes，它代表一个配置项，我们将根据语法向其附加一个或多个值。实际上，worker_processes\
    \ 指令只接受一个参数，该参数需要是一个数值。指令的另一个例子是 user（在前一行中被注释掉了）。user 指令允许我们添加最多 2 个文本字符串——第一个是必需的，指示\
    \ Nginx 将以其身份运行的用户账户；第二个是可选的（用户组）。我们需要从一开始就记住，每个指令都有自己特定的含义，并定义了应用程序的某个特定特性。\n\
    \n构成 Nginx 的每个模块都有特定的一组指令。当新模块被激活时，其特定的一组指令变得可用，指令块也可能被启用。\n\n指令块正是如此：一个文本块，它允许我们指定配置的逻辑结构，并允许我们使用继承。这意味着在某个块中找到的配置也会传递到其子块中。然而，在子块内部，你仍然可以更改其父块中定义的指令的值。\n\
    \n在图 2.2 和 2.3 中，我们看到对网站根目录（/）的所有访问都保存在 /home/gacanepa/nginx-1.5.6/html/access_log\
    \ 中，除了对应指令块中名为 restricted 目录的访问（注意指令 access_log off）。\n\n**图 2.1：Nginx 主配置文件 (nginx.conf)**\n\
    \n```nginx\nuser nobody;\nworker_processes 1;\n\n#error_log logs/error.log;\n\
    #error_log logs/error.log notice;\n#error_log logs/error.log info;\n\npid /var/run/nginx.pid;\n\
    \nevents {\n    worker_connections 1024;\n}\n\nhttp {\n    include mime.types;\n\
    \    default_type application/octet-stream;\n}\n```\n\n**图 2.2：嵌套指令块**\n\n```nginx\n\
    server {\n    listen    80;\n    server_name localhost;\n    root /home/gacanepa/nginx-1.5.6/html;\n\
    \    access_log /home/gacanepa/nginx-1.5.6/html/access_log;\n    location / {\n\
    \        index index.html index.htm;\n    }\n    location /restricted {\n    \
    \    index index.html index.htm;\n        access_log off;\n    }\n}\n```\n\n**图\
    \ 2.3：访问日志**\n\n```bash\ngacanepa@ubuntuOS:~/nginx-1.5.6/html$ ls -l\ntotal 20\n\
    -rw-r--r-- 1 gacanepa gacanepa  537 Oct  1 10:44 50x.html\n-rw-r--r-- 1 root \
    \    root     157 Oct 31 15:41 access_log\n-rw-rw-r-- 1 gacanepa gacanepa   9\
    \ Oct 30 12:23 add.html\n-rw-rw-r-- 1 gacanepa gacanepa 612 Oct  1 10:44 index.html\n\
    -rw-r--r-- 1 root     root     306 Oct 31 15:50 main_access_log\ngacanepa@ubuntuOS:~/nginx-1.5.6/html$\
    \ cat access_log\n127.0.0.1 - [31/Oct/2013:15:41:59 -0300] \"GET /50x.html HTTP/1.1\"\
    \ 404 168 \"-\" \"Mozilla/5.0 (X11; Ubuntu; Linux 1686; rv:23.0) Gecko/20100101\
    \ Firefox/23.0\"\ngacanepa@ubuntuOS:~/nginx-1.5.6/html$ cat main_access_log\n\
    127.0.0.1 - [31/Oct/2013:15:49:31 -0300] \"GET / HTTP/1.1\" 304 0 \"-\" \"Mozilla/5.0\
    \ (X11; Ubuntu; Linux 1686; rv:23.0) Gecko/20100101 Firefox/23.0\"\n127.0.0.1\
    \ - [31/Oct/2013:15:50:13 -0300] \"GET /index.html HTTP/1.1\" 200 612 \"-\" \"\
    Mozilla/5.0 (X11; Ubuntu; Linux 1686; rv:23.0) Gecko/20100101 Firefox/23.0\"\n\
    gacanepa@ubuntuOS:~/nginx-1.5.6/html$\n```\n\n让我们关注第 17 行。那里有一个特殊指令：include。该指令用于在此确切位置插入指定文件的内容。文件名可以通过绝对路径或相对于当前目录的相对路径（本例中即为如此）来指定。我们可以看到，在\
    \ nginx.conf 所在的同一目录中有一个名为 mime.types 的文件（参见图 2.4）。\n\n**图 2.4：截图**\n\n```bash\n\
    gacanepa@ubuntuOS:/usr/local/nginx/conf$ ls -l\ntotal 36\n-rw-r--r-- 1 root root\
    \ 1034 Oct 30 11:35 fastcgi.conf\n-rw-r--r-- 1 root root  964 Oct 30 11:35 fastcgi_params\n\
    -rw-r--r-- 1 root root 2837 Oct 30 11:35 koi-utf\n-rw-r--r-- 1 root root 2223\
    \ Oct 30 11:35 koi-win\n-rw-r--r-- 1 root root 3815 Oct 30 11:35 mime.types\n\
    -rw-r--r-- 1 root root 2700 Oct 31 13:43 nginx.conf\n-rw-r--r-- 1 root root  596\
    \ Oct 30 11:35 scgi_params\n-rw-r--r-- 1 root root  623 Oct 30 11:35 uwsgi_params\n\
    -rw-r--r-- 1 root root 3610 Oct 30 11:35 win-utf\ngacanepa@ubuntuOS:/usr/local/nginx/conf$\n\
    ```\n\n最终结果与实际将 `mime.types` 的内容插入到 `nginx.conf` 文件中所达到的结果相同。当然，如果我们这样做，主配置文件很快就会变得难以阅读。通过这种方式，include\
    \ 指令帮助我们确保 `nginx.conf` 文件保持易于阅读和理解。此外，它还递归工作，即被包含的文件可以引用另一个文件，依此类推；它还支持*文件名通配符*，这意味着它识别并扩展标准的通配符字符（*\
    \ 和 ?）以及方括号中的字符列表。例如，这样我们可以添加多个配置文件，如 `20131030.conf`、`20131031.conf` 和 `20131101.conf`。如果我们只想包含以\
    \ 201310 开头的文件，我们必须将以下行添加到 `nginx.conf` 文件中（参见图 2.5）：\n\n**图 2.5：使用通配符包含文件**\n\
    \n```bash\nroot@debian:~# nginx -v\nnginx version: nginx/1.2.1\nroot@debian:~#\n\
    ```\n\n然而，如果我们添加了一个特定的文件（并非通过*文件名通配符*）且该文件不存在，Nginx 将无法正确启动（参见图 2.6）。否则，我们将看到一个“测试成功”的消息（参见图\
    \ 2.7）：\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_24_0.png)\n\n**图 2.6：由于缺少包含文件导致\
    \ Nginx 重启失败**\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_24_1.png)\n\n**图 2.7：配置文件的语法测试已成功完成**\n\
    \n# 2.4 基础模块\n\n基础模块允许我们定义 Nginx 的基本参数和配置。它们在编译时自动内置于 Nginx 中。它们的指令和块始终可用。基础模块有三种类型：\n\
    \n-   核心模块包含必需的指令和功能。其大多数指令必须放置在配置文件的根（即顶部），并且只使用一次。表 2.1 展示了核心模块中的一些指令及其简要说明和上下文（如果未指定上下文，则实际上下文为全局，且指令必须放置在配置文件的根）。\n\
    \n**表 2.1：一些核心模块指令**\n\n| 指令/上下文 | 语法和描述 |\n| :--- | :--- |\n| `daemon` | 接受的值：on\
    \ / off 语法：`daemon on;` 启用或禁用守护进程模式（分别表示在后台或前台启动程序）。对于排查问题很有用。 |\n| `env` | 语法：`env\
    \ MY_VARIABLE=my_value;` 允许我们定义或设置环境变量。 |\n| `error_log` | 上下文：`main`、`http`、`server`\
    \ 和 `location`<br>语法：`error_log /path/to/file level`（其中 level 可以是以下值之一：debug,\
    \ info, notice, warn, error, 和 crit，具体取决于我们希望保存在日志文件中的错误类型）。要禁用错误记录，请将日志输出重定向到\
    \ /dev/null：`error_log /dev/null crit;` |\n| `master_process` | 接受的值：on / off\
    \ 默认值：on 如果启用（on），Nginx 将同时启动主进程和工作进程。如果禁用，Nginx 将以单一进程运行。这仅用于调试目的，并会导致客户端无法连接到服务器。\
    \ |\n| `pid` | 语法：`file path` 默认值：在编译时定义。存储 Nginx PID 的文件路径。 |\n| `user` | 语法：`user\
    \ username groupname; user username;` 允许你定义用于启动工作进程的用户账户以及可选的用户组。出于安全原因，此处必须使用权限受限的用户/组。\
    \ |\n| `worker_processes` | 语法：`numeric` 或 `auto`（默认值），例如：`worker_processes 4;`\
    \ 定义工作进程的数量。如果某个进程因某种原因被阻塞，未来的请求可以由其他工作进程处理。如果使用值 `auto`，Nginx 将选择合适的值（默认情况下，它是检测到的\
    \ CPU 核心数量）。 |\n| `worker_priority` | 语法：`Numeric` `worker_priority 0;` 定义操作系统视角下工作进程的优先级，范围从\
    \ -20（最高）到 19（最低）。 |\n\n-   events 模块允许我们配置 Nginx 网络功能的操作。这些指令必须放置在配置文件的根内的 events\
    \ 块中（参见图 2.8）。表 2.2 展示了该模块中可用的两个指令。\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_25_0.png)\n\
    \n**表 2.2：一些 events 模块指令**\n\n| 指令/上下文 | 语法和描述 |\n| :--- | :--- |\n| `worker_connections`\
    \ | 语法：`Numeric` 定义工作进程可同时处理的连接数量。 |\n| `debug_connection` | 语法：`IP address` 或\
    \ `CIDR block`。`debug_connection 192.168.0.0/24` 为匹配此 IP 地址或 CIDR 块的客户端写入详细日志。信息保存在\
    \ `error_log` 指令定义的文件中（必须使用 `debug` 级别启用，并且 Nginx 必须使用 `--debug` 开关编译才能启用此指令）。\
    \ |\n\n"
