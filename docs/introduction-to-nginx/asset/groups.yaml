    \ ngixtest.com;\n    root    /home/gacaneepa/nginx-1.5.6/html;\n    access_log\
    \  /home/gacaneepa/nginx-1.5.6/html/access_log;\n    location / {\n        index\
    \ index.html index.htm;\n    }\n    location /restricted {\n        index   index.html\
    \ index.htm;\n        access_log off;\n    }\n}\n```\n\n图 2.11：创建用于提供虚拟主机的 server\
    \ 块\n\n接下来，我们需要设置虚拟主的主配置文件。Nginx 的默认安装提供了一个示例文件（位于 /etc/nginx/sites-available/default），我们将复制该文件并以我们的网站命名：\n\
