    \ are identified either by a hostname or through a combination of IP address and\
    \ port number (see Fig. 2.11).\n\n```nginx\nserver {\n    listen      80;\n  \
    \  server_name ngixtest.com;\n    root    /home/gacaneepa/nginx-1.5.6/html;\n\
    \    access_log  /home/gacaneepa/nginx-1.5.6/html/access_log;\n    location /\
    \ {\n        index index.html index.htm;\n    }\n    location /restricted {\n\
    \        index   index.html index.htm;\n        access_log off;\n    }\n}\n```\n\
    \nFigure 2.11: Creating a server block to serve a virtual host\n\nNext, we need\
    \ to set up the virtual host main configuration file. The default installation\
    \ of Nginx provides a sample file (located in /etc/nginx/sites-available/default)\
    \ that we will copy and name after our website:\n\n```bash\nsudo cp  /etc/nginx/sites-available/default\
    \ /etc/nginx/sites-available/nginxtest.com\n```\n\nThen the next thing to do is\
    \ edit the sample file (nginxtest.com) with basically the same information that\
    \ is found in the nginx.conf file (see Fig. 2.12).\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_28_0.png)\n\
    \nFigure 2.12: Virtual host configuration file\n\nThe virtual host must now be\
    \ enabled by creating a symlink to this file in the sites-enabled directory:\n\
    \n```bash\nsudo ln -s /etc/nginx/sites-available/nginxtest.com /etc/nginx/sites-enabled/nginxtest.com\n\
    ```\n\nTo avoid conflicts, we can also delete the file named default in the sites-enabled\
    \ directory:\n\n```bash\nsudo rm /etc/nginx/sites-enabled/default\n```\n\nNow\
    \ let's restart Nginx and look what happens! (Fig. 2.13)\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_29_0.png)\n\
    \n![](img/3adf2b91cc40e3d0012eab041f055ca8_29_1.png)\n\nFigure 2.13: Our first\
    \ virtual host is working\n\nTo add more virtual hosts, we can just repeat the\
    \ process above step by step, with the caution to set up a new document root with\
    \ the appropriate domain name, and then creating and activating the new virtual\
    \ host file as we did with the nginxtest.com website.\n\n## Chapter 3\n\n## Nginx\
    \ and Apache\n\n### 3.1 Introduction\n\nNginx and Apache can certainly work together,\
    \ not necessarily replacing each other as our web server of choice. This solution\
    \ offers many advantages and solves the issues that most system administrators\
    \ are familiar with, such as slowdowns and complex configurations. You can just\
    \ take a look at the Apache configuration file and chances are you'll probably\
    \ agree with me!\n\n### 3.2 Nginx as reverse proxy\n\nA reverse proxy is a device\
    \ or service placed between a client and a server in a network infrastructure.\
    \ Incoming requests are handled by the proxy, which interacts on behalf of the\
    \ client with the desired server or service residing on the server¹. In this case,\
    \ Nginx will act as reverse proxy between the client (your computer, for example)\
    \ and Apache, the backend web server (see Fig. 3.1).\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_30_0.png)\n\
    \nFigure 3.1: Nginx acting as reverse proxy\n\nIn this above diagram, Nginx acts\
    \ as reverse proxy (or in other words, as frontend server) and receives all requests\
    \ from the outside world. At this point those requests can be filtered or “delivered”\
    \ to Apache (acting as HTTP client) in the backend. These two services can even\
    \ be hosted in the same physical server with the caution to use different listening\
    \ ports for each of them. This whole operation is handled by the proxy module\
    \ of Nginx.\n\nThe main purpose of setting up Nginx as a frontend server and giving\
    \ Apache a simple backend role is to improve the serving speed, given the fact\
    \ that great amount of requests coming from clients are for static files (html\
    \ pages, cascading style sheets, regular images, and so on), and static files\
    \ are served much faster by Nginx. The overall performance sharply improves both\
    \ on the client side and server side.\n\n### 3.3 Nginx proxy module\n\nFortunately,\
    \ the proxy module is enabled by default during the installation of Nginx. The\
    \ main directives of the module can be seen in Table 1.\n\nTable 3.1: Main directives\
    \ of the proxy module\n\n| Directive/Context | Description |\n| :--- | :--- |\n\
    | proxy_buffers<br>Context: http, server, location | The request is sent to the\
    \ backend server by specifying its location. Syntax: TCP sockets: proxy_pass http://hostname:port;\
    \ UNIX domain sockets: proxy_pass http://unix:/path/to/file.sock; (https can be\
    \ used instead of http for secure traffic) Examples: proxy_pass http://localhost:8080;\
    \ proxy_pass http://127.0.0.1:8080; proxy_pass http://unix:/tmp/nginx.sock; |\n\
    | proxy_method | Allows overriding the HTTP method of the request to be forwarded\
    \ to the backend server. Syntax: proxy_method method; Example: proxy_method POST;\
    \ |\n| proxy_hide_header<br>Context: http, server, location | By default, as Nginx\
    \ prepares the response received from the backend server to be forwarded back\
    \ to the client, it ignores some of the http headers⁴. With this directive, you\
    \ can specify an additional header line to be hidden from the client. This directive\
    \ can be inserted multiple times with one header name for each. Syntax: proxy_hide_header\
    \ header_name; Example: proxy_hide_header Cache-Control; |\n| proxy_pass_header<br>Context:\
    \ http, server, location | Forces some of the ignored headers to be passed on\
    \ to the client. Syntax: proxy_pass_header header_name; Example: proxy_pass_header\
    \ Date; |\n| proxy_pass_request_body<br>proxy_pass_request_headers<br>Context:\
    \ http, server, location | Defines whether or not, respectively, the request body\
    \ and extra request headers should be passed on to the backend server. Syntax:\
    \ on or off; |\n| proxy_redirect<br>Context: http, server, proxy_cache location\
    \ | Allows you to rewrite the URL appearing in the Location HTTP header on redirections\
    \ triggered by the backend server. Syntax: off, default, or the URL of your choice\
    \ off: Redirections are forwarded as it is. default: The value of the proxy_pass\
    \ directive is used as the hostname and the current path of the document is appended.\
    \ Note that the proxy_redirect directive must be inserted after the proxy_pass\
    \ directive as the configuration is parsed sequentially. URL: Replace a part of\
    \ the URL by another. Additionally, you may use variables in the rewritten URL.\
    \ Examples: proxy_redirect off; proxy_redirect default; proxy_redirect http://localhost:8080/\
    \ http://mysite.com/; |\n\nThe best scenario is to limit to the extent possible\
    \ the number of requests that are forwarded to the backend server. To that end,\
    \ the proxy module comes with a group of directives that will help us build a\
    \ caching system as well as control buffering options and the way Nginx deals\
    \ with temporary files (see Table 2 for more information on most of these directives).\n"
  mdcn: "\n\n### 2.5 HTTP 服务器\n\n**配置**模块通过 include 指令启用文件包含功能，如前所述。该指令可以放置在配置文件的任何位置，并且只接受一个参数：相对于当前工作目录的文件路径（除非指定了从\
    \ / 目录开始直到目标文件的完整路径）。\n\nWeb 服务器本身使用 HTTP Core 模块中的指令进行配置。该模块是 HTTP 配置的核心组件，它允许我们——除了其他功能外——提供多个网站，这些网站被称为虚拟主机。它由三个主要块组成（见图\
    \ 2.9）：\n\n- **http**：必须放置在配置文件的根位置。用于定义与 Nginx Web 服务器功能相关的指令和块。\n- **server**：必须插入在\
    \ http 块内部，用于声明一个特定的网站。\n- **location**：允许我们定义一组应用于网站某些部分的设置。此块可以在 server 块内使用，也可以嵌套在另一个\
