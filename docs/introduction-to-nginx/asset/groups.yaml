  mdcn: "\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_64_0.png)\n\n图 6.4：package.json\
    \ 文件\n\n由于本教程重点在于讲解 Nginx 如何与 websockets 协同工作，而非使用 node.js 进行编程，因此我们不会从零开始开发一个\
    \ Web 应用，而是会使用一个已有的、可通过 GitHub 获取的应用（聊天室示例）。我们需要使用以下命令下载 index.html 和 app.js 文件（见图\
    \ 6.5）：\n\n```bash\nwget https://github.com/mmkohin/pitsmike_example_1/archive/master.zip\n\
    ```\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_64_1.png)\n\n图 6.5：从 GitHub 下载聊天室\
    \ Web 应用\n\n然后，我们将解压之前提到的文件，并使用 `node app.js` 启动应用（见图 6.6）。如果 Apache 正在端口 8080\
    \ 上运行，我们可能需要停止它。\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_64_2.png)\n\n图 6.6：启动\
    \ Web 应用程序\n\n结果（见图 6.7 和 6.8）尚未使用 Nginx，我们也尚未提及为何需要使用带 websockets 的 Nginx，但毕竟已经完成了一半。到目前为止，我们拥有一个类似聊天室的\
    \ Web 应用程序，它可以实时显示发送和接收的消息，以及服务器响应。\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_65_0.png)\n\
    \n![](img/3adf2b91cc40e3d0012eab041f055ca8_65_1.png)\n\n## 6.4 那么……Nginx 与此有何关系？\n\
    \n如果我们需要在正式（生产）环境中使用此应用程序，我们可能希望它监听 80 端口（大多数企业级防火墙允许通过该端口进行通信）。但 Nginx 已经在监听该端口。我们现在该怎么办？一如既往，我们强大的\
    \ Nginx Web 服务器给出了答案。我们只需将传入的 80 端口请求（外部连接）转发到另一个端口（在本例中为内部连接的 8080 端口）。这样，我们就使用\
    \ Nginx 作为反向代理，外部世界无法直接与聊天室应用通信，而是通过充当前端服务器的 Nginx 进行通信。此场景还将允许我们使用 SSL 证书来加密流量。\n\
    \n我们将继续编辑 nginx.conf 文件（见图 6.9），并添加几个来自代理模块的指令。\n\n```nginx\nserver {\n    listen\
    \            80;\n    server_name       NGINXTEST.com;\n    root      /home/gacanepa/chatroom;\n\
    \    access_log /home/gacanepa/nginx-1.5.6/html/access_log MyLogFormat;\n    error_log\
    \ /home/gacanepa/nginx-1.5.6/html/error_log;\n    location / {\n        proxy_pass\
    \ http://localhost:8080;\n        proxy_http_version 1.1;\n        proxy_set_header\
    \ Upgrade $http_upgrade;\n        proxy_set_header Connection \"upgrade\";\n \
    \       proxy_set_header Host $host;\n        index index.html index.htm;\n  \
    \  }\n}\n```\n\n图 6.9：主配置文件 nginx.conf\n\n我们将详细讨论每个指令：\n\n- **proxy_pass** http://localhost:8080：通过指定位置（在本例中为同一主机，端口\
    \ 8080）实现对后端服务器的反向代理。\n- **proxy_http_version** 1.1：设置用于与代理后端通信的 HTTP 版本。默认值为\
    \ HTTP 1.0，但如果我们需要启用 keepalive 连接，最好将此指令设置为 1.1。\n- **proxy_set_header**：此指令允许您重新定义要传输到后端服务器的头部值。如我们所见，它可以声明多次。\n\
    - **proxy_set_header** Host $host：转发到后端服务器的请求中的 Host HTTP 头部默认值在配置文件中指定为代理主机名。此设置让\
    \ Nginx 使用客户端请求中的原始 Host。有关 http 头部的完整列表，请参阅教程 #2。\n\n由于我们希望服务器启动时应用程序能够自动启动，因此我们需要使用\
    \ init 脚本或 upstart 守护进程来管理 Node 进程。在本教程中，我们选择第二种选项。首先，我们将安装 forever，这是一个非常有用的工具，用于运行和监控\
    \ Node.js 进程（见图 6.10）。\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_66_0.png)\n\
    \n我们还需要在 /etc/init 目录中有一个 init 脚本（`app.js.conf` - 可在附件 zip 文件中找到，改编自 ExRatione），用于启动（见图\
    \ 6.11）/ 停止 / 重启我们的进程（`app.js`），并在需要时显示其状态。该脚本是一个通用的 upstart 文件，其中定义了脚本运行所必需的特定环境变量（见图\
    \ 6.12）。\n\n```bash\ngacanepa@gubuntuOS:~/chatroom$ sudo service app.js start\n\
    app.js start/running, process 3388\ngacanepa@gubuntuOS:~/chatroom$ tail -f app.js.log\n\
    info: socket.io started\ndebug: client authorized\ninfo: handshake authorized\
    \ 19M8Bhz6eqLklUSkbwK\ndebug: served static content /socket.io.js\ndebug: client\
