    ### 6.1 介绍\n\n根据 IETF（互联网工程任务组）发布的 RFC（请求评论）#6455，WebSocket 是一种通过单个 TCP 连接提供全双工通信通道的协议，它旨在在\
    \ Web 浏览器和服务器中实现，但任何客户端或服务器应用程序都可以使用它。\n\n与 TCP 一样，WebSocket 在低延迟连接中实现了全双工通信，但它与\
    \ TCP 的不同之处在于，它启用的是消息流而不是字节流。\n\n换句话说，客户端和服务器之间存在持久连接，并且其中任何一方都可以在任何时间开始发送数据。因此，每当你需要客户端和服务器之间接近实时的连接时，无论是否在\
    \ Web 环境中，你都会想到使用 WebSockets。\n\n请注意，Nginx 从 1.3.13 版本开始（2013 年 2 月发布）支持 Websockets，并且可以在核心产品中访问。旧版本不支持此协议。\n\
    \n在本教程中，我们还将配置 Upstart（Ubuntu 开发者编写的 init.d 的现代替代品），以确保我们的 websocket 应用程序（用 Node.js\
    \ 编写）在崩溃时自动重启，并在服务器启动时启动。\n\n### 6.2 安装 Node.js\n\n首先，让我们在主目录内创建一个目录，用于下载 Node.js\
    \ 的源代码（参见图 6.1）。请注意，为了清晰起见，该目录位于与我们在教程 #1 中解释的下载 Nginx 源代码的目录相同的级别。然后我们将使用相同的目录来解包\
