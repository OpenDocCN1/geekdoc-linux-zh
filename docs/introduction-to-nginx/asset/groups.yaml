    onsite the startup and ongoing operation of the WMS in a major multinational company,
    running Red Hat Enterprise Linux and Oracle 11g as RDBMS.'
  - '[PAGE 7]


    # Chapter 1


    # Nginx installation on Linux


    # 1.1 Introduction


    Nginx (pronounced “engine x”) is - in few words - a small, powerful, and scalable
    web/proxy server. According to a recent survey performed by Netcraft, Nginx powers
    more than 15% of the web, equating to 111,680,078 sites (Sept. 2013 Web Server
    Survey), including giants like Netflix and WordPress.com.


    Nginx is available under the Simplified BSD License, an open source license, and
    can be installed either from online repositories or from sources. In this article
    we will cover the installation of Nginx in Debian, Ubuntu, and CentOS using both
    methods. It is important to note that the repositories are often somewhat out-of-date.
    If we want the latest features and bugfixes, it’s recommended to build from source
    or use packages directly from nginx.org.


    # 1.2 Installation of Nginx in Debian Wheezy 7.2 using online repositories


    Using aptitude, the high-level interface to the Debian GNU/Linux package manager,
    we can check the list of packages related to Nginx (see Fig. 1.1). However, it
    is advisable to run the command aptitude update first in order to see an updated
    list of available packages.


    ```

    root@debian:~# aptitude search nginx

    p    nginx-common                   - small, powerful, scalable web/proxy server
    - common files

    p    nginx-doc                      - small, powerful, scalable web/proxy server
    - documentation

    p    nginx-extras                   - nginx web/proxy server (extended version)

    p    nginx-extras-dbg               - nginx web/proxy server (extended version)
    - debugging symbols

    p    nginx-full                     - nginx web/proxy server (standard version)

    p    nginx-full-dbg                 - nginx web/proxy server (standard version)
    - debugging symbols

    p    nginx-light                    - nginx web/proxy server (basic version)

    p    nginx-light-dbg                - nginx web/proxy server (basic version) -
    debugging symbols

    p    nginx-naxsi                    - nginx web/proxy server (version with naxsi)

    p    nginx-naxsi-dbg                - nginx web/proxy server (version with naxsi)
    - debugging symbols

    p    nginx-naxsi-ui                 - nginx web/proxy server - naxsi configuration
    front-end

    root@debian:~#

    ```


    ![](img/3adf2b91cc40e3d0012eab041f055ca8_7_0.png)


    (By the way, the letter “p” in the first column indicates that no trace of the
    package currently exists on the system).


    If we can’t decide which package to install, aptitude search followed by a package
    name such as aptitude search nginx- is our friend and will help us to make up
    our minds as to which one is right for us. Based on the description of each package
    listed above, we will proceed with the installation of nginx-full (see Fig. 1.2).
