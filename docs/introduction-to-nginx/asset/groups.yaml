    \ {\n        listen 143;\n```\n\n图 2.10：mail 块\n\n### 2.7 虚拟主机\n\n如前所述，虚拟主机是由\
    \ Nginx 在单台服务器上提供的特定网站。设置虚拟主机的第一步是在主配置文件中创建一个或多个 server 块。这些 server 块通过主机名或通过\
