    # ## 1.3 Installation of Nginx in Debian Wheezy 7.2 from sources


    Please note that the following instructions represent the default way of building
    a package from scratch in Linux, so be advised that the regular installation procedure
    using ./.configure, make, and make install makes it harder for you to uninstall
    the package later if you don’t want to use it anymore because there is no way
    for the system to keep track of all the files that were added / modified during
    the process.


    In summary, you should have a valid reason (a very good one, actually) for compiling
    a package using the method mentioned above. There are a couple of valid reasons
    why you may want to do so, though. The most common reason is to install a more
    recent version of a certain package in your system; another reason is to compile
    in order to add support for a particular feature.


    If you build and install a .deb or a .rpm file, then the corresponding package
    manager (aptitude / apt-get or yum, respectively) will be aware of the presence
    of the package and it will make sure that you do not overwrite the files of a
    previously installed package. On the other hand, the make install command will
    overwrite anything that gets in its way. We will discuss later the other options
    that we have when we DO have a valid reason to compile and install a package from
    source.


    Now that we have decided that we will not settle for less than the latest version
    of Nginx, we need to follow these steps to download the compressed tarball from
    http://nginx.org/download/ and uncompress it before proceeding with the build
    per se.


    +   - Download the tarball: `wget http://nginx.org/download/nginx-1.5.6.tar.gz`


    +   - Uncompress it: `tar xvfz nginx-1.5.6.tar.gz`


    +   - Go to the directory that was automatically created during the last step:
    `cd nginx-1.5.6`


    And then:


    +   - ./.configure (add the --help option if you want to list all the configuration
    options). The output of ./.configure shows the directory where Nginx will be installed
    (/usr/local/nginx, see Fig. 1.5)'
