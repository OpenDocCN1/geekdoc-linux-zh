    \n    pop3_auth       plain apop cram-md5;\n    pop3_capabilities LAST TOP USER\
    \ PIPELINING UIDL;\n\n    smtp_auth       login plain cram-md5;\n    smtp_capabilities\
    \ \"SIZE 16485760\" ENHANCEDSTATUSCODES 8BITMIME DNS;\n\n    server {\n      \
