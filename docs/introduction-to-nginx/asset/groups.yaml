    \ 1 章\n\n## Nginx 在 Linux 上的安装\n\n### 1.1 简介\n\nNginx（读音为“engine x”）简而言之，是一个小型、强大且可扩展的\
    \ Web/代理服务器。根据 Netcraft 最近进行的一项调查，Nginx 为超过 15% 的网站提供支持，相当于 111,680,078 个站点（2013\
    \ 年 9 月 Web 服务器调查），其中包括 Netflix 和 WordPress.com 等巨头。\n\nNginx 在简化的 BSD 许可证下可用，这是一种开源许可，可以从在线仓库或从源代码进行安装。在本文中，我们将介绍使用这两种方法在\
