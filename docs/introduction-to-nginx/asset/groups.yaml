    \n# 第 4 章\n\n## 使用 Nginx 进行负载均衡\n\n### 4.1 引言 - 负载均衡的需求\n\n负载均衡是一种网络方法，用于将工作负载分布在多个计算资源上，例如服务器、服务器集群（一组协同工作的服务器，它们可以被视为单个系统）、网络链路、CPU\
    \ 或其他硬件组件（[http://en.wikipedia.org/wiki/Load\\_balancing\\_(computing)](http://en.wikipedia.org/wiki/Load\\\
    _balancing\\_(computing)) target=[维基百科条目]）。这项技术旨在通过减少（或更准确地说是平衡）单个服务器或节点的负担，从而提高后端应用的容量（支持大量并发用户）和可靠性。由于同样的原因，负载均衡还提供了冗余和灾难恢复能力。使用\
    \ Nginx，我们将设置一个第 7 层负载均衡器（它将根据应用层协议（如 HTTP 和 FTP）中找到的数据来分配请求）。\n\n### 4.2 必要的模块\n\
    \n为了设置负载均衡器，我们需要两个模块：proxy 模块和 upstream 模块。这两者默认都内置于 Nginx 中。\n\n与之前一样，我们将使用位于\
    \ `/usr/local/nginx/conf` 目录中的 nginx.conf 文件。\n\n#### 4.2.1 upstream 模块\n\n在 `http\
    \ { }` 内部插入一个 `upstream` 指令块（参见图 4.1）。您可以随意命名这个块（如下例中的 `app_rack`）。\n\n```\nhttp\
    \ { include mime.types; default_type application/octet-stream; #access_log logs/access.log\
    \ main; sendfile on; keepalive_timeout 65; upstream app_rack { server 10.0.2.13:8080;\
    \ server 10.0.2.14:8080; server 127.0.0.1:8080; }\n```\n\n**图 4.1: 一个 upstream\
    \ 块**\n\nserver 指令分配服务器的名称和参数。“名称”可以是域名、IP 地址、端口或 unix socket。如果域名解析为多个地址，则所有这些都会被使用。还有几个额外的参数可用，但我们稍后会探讨它们。\n\
    \n- **10.0.2.13** 是一台 Debian Wheezy 7.2 服务器的 IP 地址，其中 Apache 正在监听 8080 端口。\n-\
    \ **10.0.2.14** 是一台 CentOS 6.4 服务器的 IP 地址，其中 Apache 正在监听 8080 端口。\n- 最后，**127.0.0.1**\
    \ 是环回接口的 IP 地址，在该物理服务器上，Nginx 运行在 80 端口，而 Apache 监听 8080 端口。\n\n这样我们就有了三台服务器——它们都运行一个简单的\
    \ PHP 脚本，可以由 Apache 的实例提供（参见图 4.2）。\n\n正如我们前面提到的，出现在 **upstream** 块中的 server 指令接受多个参数，这些参数会影响\
    \ Nginx 的后端选择：\n\n- **weight=n:** 如果将此参数放在服务器名称之后，该服务器将被选择“n 倍”的频率。\n- **max_fails=n:**\
    \ 这定义了应该在指定的时间框架内（使用下面的 fail_timeout 参数）发生多少次超时的连接，Nginx 才会认为该服务器不可操作。\n- **fail_timeout=n:**\
    \ 如果 Nginx 在 fail_timeout 秒内无法与后端服务器通信 max_fails 次，该服务器将被视为不可操作。\n- **down:**\
    \ 此服务器不再使用。仅当启用 ip_hash 指令时适用。\n- **backup:** 如果后端服务器被标记为 backup，Nginx 不会使用该服务器，直到所有其他服务器（未标记为\
    \ backup 的服务器）宕机或不可操作。\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_43_0.png)\n\
    \n图 4.2: Nginx 连接到多个后端服务器\n\n**注意：** 使用 upstream 模块还有几个其他参数。有关更全面的列表，请参见 upstream\
    \ 模块的在线文档。\n\n话虽如此，如果我们希望确保来自同一访问者的所有请求始终由同一个后端服务器处理，我们需要在声明 upstream 块时启用 `ip_hash`\
    \ 选项。\n\n现在是时候“玩转”上面讨论的参数了。让我们看看修改后的 nginx.conf 文件（参见图 4.3 和图 4.4）。\n\n```\nupstream\
    \ app_rack {\n    ip_hash;\n    server 10.0.2.13:8080 max_fails=3 fail_timeout=30s;\n\
    \    server 10.0.2.14:8080 weight=3;\n    # backup can only be used if ip_hash\
    \ is not present\n    server 127.0.0.1:8080 down;\n}\n```\n\n图 4.3: nginx.conf\
    \ 文件中的 upstream 块\n\n```\n# proxy the PHP scripts to Apache\n# listening on each\
    \ server listed\n# in the upstream block above.\nlocation ~ \\.php$ {\n    proxy_pass\
    \  http://app_rack;\n}\n```\n\n图 4.4: 将请求重定向到 upstream 块中列出的服务器\n\n根据上述设置，我们可以预期\
    \ CentOS 6.4 服务器（IP 10.0.2.14）将比其他两个后端服务器接收多两倍的流量。ip_hash 选项的存在将确保来自特定访问者——实际上是特定\
    \ IP——的每个请求都由同一个后端服务器提供服务。\n\n哎呀！发生了一个错误（参见图 4.5）。\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_45_0.png)\n\
    \n图 4.5: Nginx 在尝试将请求转发到后端服务器时返回错误页面\n\n既然指示我们要查看错误日志，那就让我们来看看（参见图 4.6）。\n\n```\n\
    gacanepa@ubuntuOS:~/nginx-1.5.6/html$ ls -l\ntotal 24\n-rw-r--r-- 1 gacanepa gacanepa\
    \  537 Oct  1 10:44 50x.html\n-rw-r--r-- 1 gacanepa gacanepa 3786 Nov  7 13:55\
    \ access_log\n-rw-rw-r-- 1 gacanepa gacanepa    9 Oct 30 12:23 add.html\n-rw-r--r--\
    \ 1 root     root       720 Nov  7 13:55 error_log\n-rw-r--r-- 1 gacanepa gacanepa\
    \  659 Nov  2 19:20 index.html\ndrwxrwxr-x 2 gacanepa gacanepa 4096 Oct 31 16:08\
    \ restricted\ngacanepa@ubuntuOS:~/nginx-1.5.6/html$ tail -f error_log\n2013/11/07\
    \ 13:55:03 [error] 2235#0: *1 connect() failed (113: No route to host) while connecting\
    \ to upstream, client: 127.0.0.1, server: ngxtest.com, request: \"GET /test.php\
    \ HTTP/1.1\", upstream: \"http://10.0.2.13:8080/test.php\", host: \"localhost\"\
    \n2013/11/07 13:55:03 [error] 2235#0: *1 connect() failed (111: Connection refused)\
    \ while connecting to upstream, client: 127.0.0.1, server: ngxtest.com, request:\
    \ \"GET /test.php HTTP/1.1\", upstream: \"http://10.0.2.14:8080/test.php\", host:\
    \ \"localhost\"\n2013/11/07 13:55:03 [error] 2235#0: *1 no live upstreams while\
    \ connecting to upstream, client: 127.0.0.1, server: ngxtest.com, request: \"\
    GET /test.php HTTP/1.1\", upstream: \"http:// /app_rack/test.php\", host: \"localhost\"\
    \n```\n\n图 4.6: 截图\n\n似乎所有的 upstream 服务器都宕机了！\n\n后端服务器 #2 可以 ping 通。那还有什么问题呢？在\
    \ CentOS 6.4 服务器上运行\n\n```\nnetstat -npilu | grep :8080\n```\n\n我们发现 Apache 没有在运行。我们可以使用\
    \ service httpd start 启动它。\n\n让我们看看现在会发生什么（参见图 4.7）。\n\n"
