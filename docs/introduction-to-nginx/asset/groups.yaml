    \n![](img/3adf2b91cc40e3d0012eab041f055ca8_29_1.png)\n\n图 2.13：我们的第一个虚拟主机正在运行\n\
    \n若要添加更多虚拟主机，我们只需逐步重复上述过程，并注意设置具有相应域名且新的文档根目录，然后像我们在 nginxtest.com 网站中所做的那样创建并激活新的虚拟主机文件。\n\
    \n## 第 3 章\n\n## Nginx 和 Apache\n\n### 3.1 引言\n\nNginx 和 Apache 当然可以协同工作，它们并不一定相互替代成为我们首选的\
    \ Web 服务器。此解决方案具有许多优势，并解决了大多数系统管理员熟悉的问题，例如减速和复杂的配置。你只需查看一下 Apache 的配置文件，很可能你会同意我的观点！\n\
    \n### 3.2 Nginx 作为反向代理\n\n反向代理是放置在客户端和服务器之间的网络设备或服务。传入的请求由代理处理，该代理代表客户端与服务器上托管的目标服务器或服务进行交互¹。在这种情况下，Nginx\
    \ 将在客户端（例如你的计算机）和后端 Web 服务器 Apache 之间充当反向代理（见图 3.1）。\n\n![](img/3adf2b91cc40e3d0012eab041f055ca8_30_0.png)\n\
    \n图 3.1：Nginx 充当反向代理\n\n在上述图中，Nginx 充当反向代理（或者说前端服务器），并接收来自外部世界的所请。在此阶段，这些请求可以被过滤或“传递”给后端中充当\
    \ HTTP 客户端的 Apache。这两个服务甚至可以托管在同一台物理服务器上，但需注意为每个服务使用不同的监听端口。整个操作由 Nginx 的 proxy\
    \ 模块处理。\n\n将 Nginx 设置为前端服务器，并给予 Apache 简单的后端角色的主要目的是提高服务速度，因为考虑到来自客户端的大量请求都是针对静态文件（html\
    \ 页面、层叠样式表、普通图像等），而 Nginx 提供静态文件的速度快得多。客户端和服务器端的整体性能都显著提高。\n\n### 3.3 Nginx 代理模块\n\
    \n幸运的是，proxy 模块在 Nginx 安装过程中默认是启用的。该模块的主要指令见表 3.1。\n\n表 3.1：proxy 模块的主要指令\n\n\
    | 指令/上下文 | 描述 |\n| :--- | :--- |\n| proxy_buffers<br>上下文: http, server, location\
    \ | 通过指定其位置将请求发送到后端服务器。语法：TCP 套接字：proxy_pass http://hostname:port; UNIX 域套接字：proxy_pass\
    \ http://unix:/path/to/file.sock;（对于安全流量可以使用 https 代替 http）示例：proxy_pass http://localhost:8080;\
    \ proxy_pass http://127.0.0.1:8080; proxy_pass http://unix:/tmp/nginx.sock; |\n\
    | proxy_method | 允许覆盖要转发到后端服务器的请求的 HTTP 方法。语法：proxy_method method; 示例：proxy_method\
    \ POST; |\n| proxy_hide_header<br>上下文: http, server, location | 默认情况下，当 Nginx\
    \ 准备将从后端服务器接收到的响应转回给客户端时，它会忽略某些 http 头部⁴。使用此指令，你可以指定要从客户端隐藏的额外头行。此指令可以多次插入，每次指定一个头名称。语法：proxy_hide_header\
    \ header_name; 示例：proxy_hide_header Cache-Control; |\n| proxy_pass_header<br>上下文:\
    \ http, server, location | 强制将某些被忽略的头部传递给客户端。语法：proxy_pass_header header_name;\
    \ 示例：proxy_pass_header Date; |\n| proxy_pass_request_body<br>proxy_pass_request_headers<br>上下文:\
    \ http, server, location | 分别定义是否将请求体和额外的请求头传递到后端服务器。语法：on 或 off; |\n| proxy_redirect<br>上下文:\
    \ http, server, proxy_cache location | 允许你重写由后端服务器触发的重定向中出现在 Location HTTP 头部的\
    \ URL。语法：off, default, 或你选择的 URL off: 重定向按原样转发。default: 使用 proxy_pass 指令的值作为主机名，并附加当前文档路径。请注意，proxy_redirect\
    \ 指令必须插入在 proxy_pass 指令之后，因为配置是按顺序解析的。URL: 用另一个部分替换 URL 的一部分。此外，你可以在重写的 URL 中使用变量。示例：proxy_redirect\
    \ off; proxy_redirect default; proxy_redirect http://localhost:8080/ http://mysite.com/;\
    \ |\n\n最佳场景是尽可能限制转发到后端服务器的请求数量。为此，proxy 模块附带了一组指令，帮助我们构建缓存系统，并控制缓冲选项以及 Nginx 处理临时文件的方式（关于这些指令的更多信息见表\
    \ 3.2）。\n\n"
