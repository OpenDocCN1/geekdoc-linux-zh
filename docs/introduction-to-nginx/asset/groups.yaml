    ```

    http { include mime.types; default_type application/octet-stream; #access_log
    logs/access.log main; sendfile on; keepalive_timeout 65; upstream app_rack { server
    10.0.2.13:8080; server 10.0.2.14:8080; server 127.0.0.1:8080; }

    ```


    **Figure 4.1: An upstream block**


    The server directive assigns the name and the parameters of server. “Name” can
    be a domain name, an IP address, port or unix socket. If domain name resolves
    to several addresses, then all are used. There are several extra parameters available,
    but we will explore them later.


    +   - **10.0.2.13** is the IP address of a Debian Wheezy 7.2 server where Apache
    is listening on port 8080.

    +   - **10.0.2.14** is the IP address of a CentOS 6.4 server where Apache is listening
    on port 8080.

    +   - Finally, **127.0.0.1** is the IP address of the loopback interface, where
    Apache is listening on port 8080 in the same physical server where Nginx is running
    on port 80.


    This way we have three servers - all of them running a simple PHP script that
    can be served by an instance of Apache (see Fig. 4.2).


    As we mentioned earlier, the server directive that appears within **upstream**
    blocks accepts several parameters that influence the backend selection by Nginx:


    +   - **weight=n:** if this parameter is placed after a server name, that server
    will be selected “n-times” more often.

    +   - **max_fails=n:** This defines the number of timed-out connections that should
    occur (in the time frame specified with the fail_timeout parameter below) before
    Nginx considers the server inoperative.

    +   - **fail_timeout=n:** If Nginx fails to communicate with the backend server
    max_fails times over fail_timeout seconds, the server is considered inoperative.

    +   - **down:** this server is no longer used. This only applies when the ip_hash
    directive is enabled.

    +   - **backup:** if a backend server is marked as backup, Nginx will not make
    use of the server until all other servers (servers not marked as backup) are down
    or inoperative.'
