    ```\n\n然后需要做的就是编辑该示例文件（nginxtest.com），其中基本上包含与 nginx.conf 文件中找到的相同信息（见图 2.12）。\n\
    \n![](img/3adf2b91cc40e3d0012eab041f055ca8_28_0.png)\n\n图 2.12：虚拟主机配置文件\n\n现在必须通过在\
