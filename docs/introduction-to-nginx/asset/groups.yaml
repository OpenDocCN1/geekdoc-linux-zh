    # Chapter 5


    Nginx SSL configuration guide


    # 5.1 Introduction


    The SSL (Secure Socket Layer) protocol was created by Netscape to ensure secure
    transactions between web servers and browsers (using secure pages often identified
    with https://). The protocol uses a third party, a Certificate Authority (CA),
    to identify one end or both ends of the transactions (The Linux Documentation
    Project).


    # 5.2 Adding support for SSL to Nginx


    Since The Linux Documentation Project website offers a comprehensive explanation
    of how this procedure is performed, we will limit this tutorial to show how to
    set up SSL with Nginx on Ubuntu 12.04 LTS. We will need to compile Nginx with
    SSL support (see Fig. 5.1).


    ![](img/3adf2b91cc40e3d0012eab041f055ca8_50_0.png)


    However, the ssl module requires the OpenSSL library (see Fig. 5.2) to be installed
    on the system beforehand. We will install the libssl-dev package, which includes
    the said library (see Fig. 5.3).


    ![](img/3adf2b91cc40e3d0012eab041f055ca8_50_1.png)'
