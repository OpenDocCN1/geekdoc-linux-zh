    \ request GET /socket.io/1/websocket/ezjJPChCJByQllFtZkbwL\ndebug: set heartbeat\
    \ interval for client ezjJPChCJByQllFtZkbwL\ndebug: client authorized for\ndebug:\
    \ websocket writing 1::\ndebug: websocket writing 5::{\"name\":\"updatechat\"\
    ,\"args\":[\"SERVER\", \"you have connected\"]}\ndebug: broadcasting packet\n\
    debug: websocket writing 5::{\"name\":\"updateusers\",\"args\":[{\"Gabriel\":\
    \ \"Gabriel\"}]}\ndebug: websocket writing 5::{\"name\":\"updatechat\",\"args\"\
    :[\"Gabriel\", \"this is a test message\"]}\ndebug: emitting heartbeat for client\
    \ ezjJPChCJByQllFtZkbwL\n```\n\n图 6.11：我们的 Web 应用程序已启动\n\n```bash\n# The following\
    \ environment variables must be set so as to define\n# where Node.js and Forever\
    \ binaries and the Node.js source code\n# can be found.\n\n# The full path to\
    \ the directory containing the node and forever binaries.\nenv NODE_BIN_DIR=\"\
    /usr/local/bin\"\n# Set the NODE_PATH to the Node.js main node_modules directory.\n\
    env NODE_PATH=\"/home/gacanepa/chatroom/node_modules\"\n# The directory containing\
    \ the application Javascript file.\nenv APPLICATION_DIRECTORY=\"/home/gacanepa/chatroom\"\
    \n# The application start Javascript filename.\nenv APPLICATION_START=\"app.js\"\
    \n# Log file path.\nenv LOG=\"/home/gacanepa/chatroom/app.js.log\"\n```\n\n图 6.12：由\
