- img_proc: true
  md: 'numbers or integers; the next argument (the 0 in all of these functions) specifies
    that the arrays are tightly packed with no gaps between consecutive vertices;
    the last argument is the actual address of the array.


    Having set up these arrays and pointers, we can draw our object with just one
    OpenGL call:

    glDrawElements ( GL_TRIANGLES, NUM_VERTS, GL_UNSIGNED_SHORT, indices ) :


    The first argument is value you''ve given to glBegin(). The second argument is
    the number of vertices to draw. The third parameter is the C-type of the array
    you are passing as the fourth argument.


    That final (the indices array) allows you to decide the order in which the vertices
    in the array will be drawn. In the general case, you''ll find that you can reduce
    the size of your data arrays (and perhaps speed up rendering) by reusing the same
    vertex data more than once a single glDrawElements().


    This feature also allows you to use enormous arrays—perhaps containing every vertex
    in an entire game level. If you take this approach, you''ll only need an index
    array and a call to glDrawElements() for each object, saving you the cost of all
    gl*Pointer calls.


    Another aspect of vertex arrays that some people find useful is that the glVertexPointer(),
    glColorPointer(), glNormalPointer(), and glTexCoordPointer() have a "stride" parameter
    (which in the previous example was set to 0). This parameter makes it possible
    to interleave the vertex, color, normal, and texture coordinate data for a single
    vertex into consecutive memory locations, which is convenient for some applications.


    # DRAWING WITH TRIANGLE STRIPS AND FANS


    Now, our simple program example has been drawn using GL_TRIANGLES, which draws
    one for every three vertices you send to OpenGL. This is rarely the most efficient
    thing to do: The problem is that a real tetrahedron has only four vertices, yet
    we are sending 12 vertices to OpenGL for each frame. In this example, all 12 turn
    out to be necessary because we don''t want all three triangles that meet at a
    vertex to be the same color or have the same surface normal or texture coordinate.


    However, if you were drawing something like a globe (a sphere textured with a
    map of the earth), every vertex of the triangles that approximate that sphere,
    you''d want the same surface normal, the same color, and the same texture coordinate.
    In the case of a densely tessellated sphere, you may have six triangles meeting
    at each vertex, which means that, using GL_TRIANGLES, you''d be sending each vertex
    to OpenGL six times!'
  merge: -1
