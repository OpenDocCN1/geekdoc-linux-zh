  md: '# SENDING DATA


    When you have successfully established a socket, you can go ahead and send data
    to it. There are several-ways to do this, depending on the type of socket, ranging
    from standard file I/O calls to TCP-specific I/O functions, and everything in
    between.


    # OPENING A SOCKET AS A FILE STREAM


    I mentioned earlier in this chapter that the socket descriptor is the same as
    a standard file descriptor created by a call to open(). This similarity allows
    you to use the function fdopen() to access the standard-file I/O functions, such
    as fprintf() and fgets().


    ```

    FILE *fdopen(int filefd, char *mode);

    ```


    This function works exactly as fopen() except you specify a file descriptor (or
    a socket descriptor, in this case) instead of a filename. Depending on the type
    of access you want, the mode string can be any of the standard fopen() mode strings
    (see fopen man page for details).


    When you want to send data to the socket, you can use the standard file I/O functions
    to write data to the file stream using fprintf() for raw text (which is useful
    for clear-text protocols, such as HTTP) or write() (for more complex data types).


    # USING THE send() FUNCTION


    If you have opened a TCP socket, you can use the function send() after you have
    established a connection to the remote end. The send() function takes four parameters:
    a socket descriptor, the data to send, the length of the data, and some flags.


    ```

    int send(int s, const void *msg, int len, unsigned int flags);

    ```


    The flags parameter can consist of a combination of the following predefined values:


    | Name | Description |

    | --- | --- |

    | MSG_OOB | Send out-of-bounds data. |

    | MSG_DONTROUTE | Ignore routing tables; usually used by routers and diagnostic
    tools. |

    | MSG_DONTWAIT | Don''t block if the data is too big to be sent in a single packet.
    |

    | MSG_NOSIGNAL | Don''t generate a SIGPIPE in the event of a socket error. |


    If the call to send() succeeds, it returns the number of bytes sent; it returns
    -1 on error.'
