  md: '# USING OPENGL IN GAMES


    # IF THE OBJECTS ARE CLOSE, TEST AGAIN


    When you know that two objects are close enough that their bounding spheres overlap,
    you can look inside each object and see whether their polygons overlap. This is
    a much nastier test. First, you''ll really want to test each triangle; you''ll
    have to split the polygons into individual triangles before you start.

    The steps to test a triangle against a sphere are complex:


    +   - Compute the plane equation of the triangle. If the distance from the center
    of the sphere to the plane containing the triangle is greater than the radius
    of the sphere, then it can be touching, so we can stop the test.


    +   - Unfortunately, we aren''t there yet. There are still cases in which the
    sphere can overlap both the "fence" planes and the plane of the triangle and still
    not intersect the triangle. However, if the center of the sphere is inside the
    fence planes, it''s a definite hit and we need look no further.


    +   - If the sphere penetrates the plane of the triangle and the plane of one
    or more of the fence planes, we can use the Pythagorean theorem to determine whether
    the sphere actually intersects that edge between the plane and the triangle. If
    the distance from the center of the sphere to the plane of the triangle (squared)
    plus the distance to the plane of the fence (squared) is less than the radius
    of the sphere (squared), then it''s a hit. If this value is greater than the radius
    of the sphere (squared), it''s a miss.


    Whew! If you think the code to do this is complex, wait until you get to the next
    test—intersecting the actual triangles of one object against those of another!


    Rather than attempting to convey in enough detail to reproduce it (which would
    fill several chapters with ugly mathematics), I''ll refer you to the code in my
    own OpenSource-graph library. This library contains the code for all of this nastiness
    and is the subject of the next section.'
  merge: -1
  pgno: 164
