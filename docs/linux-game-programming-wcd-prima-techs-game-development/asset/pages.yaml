  md: "# LINUX GAME PROGRAMMING\n\nImagine a case of a thin brick wall and a car driving\
    \ along at high speed. It could be that the car is entirely on one side of the\
    \ wall at the start of one frame—and entirely on the other side of it at the start\
    \ of the next frame. In a game situation, it would be possible to drive through\
    \ a brick wall if the user is driving fast enough!\n\nThere are two solutions\
    \ to that problem. One is to divide the time span of one frames into sufficiently\
    \ small intervals so that the car does not move more than its own length during\
    \ each interval. The other approach is to pretend that the length of the car is\
    \ equal to its real length plus the length it's about to travel in that frame.\n\
    \nTo calculate whether two polygonal shapes have collided is quite tricky and\
    \ very time-consuming. If you tried to test every polygon of your player's character\
    \ against every polygon in the game level, you'd be doing millions or billions\
    \ of calculations per frame.\n\n# SIMPLIFY THE SHAPES YOU TEST\n\nThe key to making\
    \ collision detection in real time is to simplify the shapes you test against.\
    \ You should then use refined, detailed tests only if coarser, simpler tests suggest\
    \ the possibility of a collision.\n\nYou can start off by imagining an invisible\
    \ sphere surrounding each object in the scene and another sphere surrounding the\
    \ player. It's easy to use the Pythagorean theorem in 3D to figure out the distance\
    \ between the centers of two spheres. If that distance is less than the sum of\
    \ the two radii, then the spheres overlap and the objects have collided. However,\
    \ square roots are a costly math operation; it's cheaper to compare the square\
    \ of the distance to the square of the sum of the radii. Here's a suggested series\
    \ of equations your program can detect which two objects are in contact:\n\n```\n\
    struct Sphere { float x, y, z; /* Center */\nfloat r; /* Radius */ };\n#define\
    \ sq(x) ((x)*(x))\nint isOverlapping (struct Sphere *s1, struct Sphere *s2) {\n\
    \    float d_sqd;\n    d_sqd = sq(s1->x - s2->x) + sq(s1->y - s2->y) + sq(s1->z\
    \ - s2->z);\n    return d_sqd < sq(s1->r + s2->r);\n}\n```"
  merge: -1
