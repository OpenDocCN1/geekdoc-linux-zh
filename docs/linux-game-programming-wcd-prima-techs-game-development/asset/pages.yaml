    if you have Nvidia 3D hardware, for example, you''ll do better to visit the Web
    site of the company that After the new scene makes your graphics hardware and
    look for a section containing appropriate Linux drivers.


    MESA/OPENGL: HTTP://WWW.MESA3D.ORG


    For the purposes of this chapter, however, you can get by with whatever comes
    with your distribution. Although it''s slower than hardware-accelerated OpenGL,
    it should work perfectly.


    # BUFFERS, HIDDEN SURFACE ELIMINATION, AND ANIMATION


    To make images that appear to move smoothly, it''s necessary to redraw the complete
    image at a rate of around 20 to 60 times per second. Unlike some 2D animation
    techniques, it''s absolutely necessary to redraw the entire 3D picture at because
    speed even the smallest movement of the eye point causes the entire scene to change.
    Consequently, the graphics have to be drawn behind the scenes in a "back buffer"
    so that you can''t see the front and back buffers so that the new image is displayed
    on the screen and the old one can be recycled. This double-buffer technique is
    pretty much universally used in OpenGL games, and is what I''ll describe in the
    remainder of this chapter.


    In addition to the two buffers, OpenGL makes use of a depth buffer (also known
    as a Z-buffer). The depth buffer is a part of a common technique to deal with
    the problem of "hidden surface removal," that is, of making sure that the things
    that are far off in the distance of your 3D scene are correctly hidden behind
    the things that are closer to the camera. For every pixel on the screen, there
    is also a depth pixel that can store distances from the camera (or more often,
    the reciprocal of that).


    When OpenGL draws a pixel, it also calculates the depth of the pixel. If the value
    of pixel''s depth is larger than the value currently stored in the depth buffer,
    that pixel won''t be drawn. If the value is closer, the pixel will be drawn—and
    the new "closest" value will overwrite whatever was in the depth buffer before.
    By setting the depth buffer to the largest possible depth at the start of each
    screen redraw, OpenGL resolves the problem of hidden surface elimination with
    virtually no impact on the application.


    > NOTE

    The Z values are stored in the Z-buffer as I/Z—partially to make the math easier
    for the graphics hardware and to give you better Z resolution close to the camera.'
