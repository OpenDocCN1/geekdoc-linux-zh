    \ a weighting system that performs some simple math in each AI frame. By using\
    \ weights, you can cut down on your use of large if-else blocks which is also\
    \ an advantage. To create this weighting system, CPU-heavy algorithms come into\
    \ play.\n\nSoftware-based neural networks work by analyzing each situation and\
    \ adjusting the weights so that a suitable outcome is achieved. Some pseudo-code\
    \ that demonstrates this logic flows. The inputs are prefixed with an i (i1 is\
