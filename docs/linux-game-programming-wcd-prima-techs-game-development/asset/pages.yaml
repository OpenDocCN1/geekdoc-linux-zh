  md: '# 3D GRAPHICS FOR LINUX GAMES


    Suppose that you wanted to draw the simplest possible solid object: a three-sided
    pyramid, also called a tetrahedron. How would you use OpenGL to do that? If you
    start with the GLUT program from earlier in this chapter, you can simply replace
    the DRAW SOMETH with some actual code.


    First, tell OpenGL what kind of primitive to draw (for the tetrahedron, you want
    triangles) and then give it a list of vertex coordinates in 3D space. When you
    have finished drawing the shape, you will tell OpenGL that you are done, and the
    drawing will commence your program gets on with something else.


    Just for fun, let''s color each triangle with a different color so that we can
    see triangle as which. Here''s the code to accomplish these lofty goals:


    ```

    glBegin( GL_TRIANGLES); /* Start drawing triangles */


    Color3f(1.0f, 0.0f, 0.0f); /* Red */

    glVertex3f(0.0f, 0.0f, 0.0f); /* First triangle */

    glVertex3f(-1.0f, -1.0f, -1.0f);


    Color3f(0.0f, 0.0f, 1.0f); /* Second triangle */

    glVertex3f(0.0f, 0.0f, 0.0f);

    glVertex3f(-1.0f, -1.0f, -1.0f);


    Color3f(0.0f, 1.0f, 0.0f); /* Blue */

    glVertex3f(0.0f, 0.0f, 0.0f);

    glVertex3f(-1.0f, -1.0f, -1.0f);


    Color3f(1.0f, 1.0f, 0.0f); /* Yellow */

    glVertex3f(0.0f, 0.0f, 0.0f); /* Fourth triangle */

    glVertex3f(-1.0f, -1.0f, -1.0f);


    glEnd(); /* All done - let the drawing commence. */

    ```


    You may be wondering why all these commands end in 3f. There are many versions
    of the glColor() and glVertex() commands, taking more or fewer arguments--glVertex2f()
    is for 2D drawing, for example. The number sets the number of arguments and the
    letter f tells the system we are passing float numbers (usually preferred for
    best performance). (You can also pass bytes, shorts, ints, and doubles.) You can
    also pass an array containing the coordinates by adding a v to the end of the
    function name, as in this example:


    ![](img/8827e679048b592dad186c600299f274_128_0.png)'
