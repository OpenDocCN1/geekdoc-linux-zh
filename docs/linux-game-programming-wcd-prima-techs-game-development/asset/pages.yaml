    # # HEAR NO DIFFERENCE?


    If you don''t hear any change when you compile and run this revised program, that
    may be because the sound scale that OpenAI is using isn''t really suitable for
    the amount of movement going on.


    According to the OpenAL documentation, there isn''t a function for setting the
    scale of the universe, but according to the header files, there is such a function.
    The convert function is aDopplerScale(), which takes a single argument:


    ```

    void aLAPPIENTRY aDopplerScale(ALfloat value);

    ```


    Because the OpenAL documentation is so sketchy as I write this, I can''t find
    a point of reference for what the scaling system is. However, we do know that
    the default is 1.0, Through trial and error, you can find the best value for aDopplerScale()
    in your application.


    # # REVERB AND ECHO


    Although there is no official support for reverberation and echo features in OpenAL,
    there are some temporary Loki extensions in the library that do the job. The OpenAL
    documentation recommends that you don''t use these functions, but it is possible
    to hack your program to support both the current functions as well as the functions
    in the stable release.


    The Loki-specific functions you shouldn''t use are called alReverbScale_LOKI()
    and alReverbDelay_LOKI(). Each of these functions takes two arguments: the source
    that generates the effect and a floating-point value.'
