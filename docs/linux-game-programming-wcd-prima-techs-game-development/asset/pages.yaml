    If you change the numbers in the glRotate() command, the tetrahedron will rotate
    in different directions. Notice that we load the current matrix with the identity
    matrix every time to reset to it. The glRotate() commands multiplies the matrix
    on the top of the stack; as a result, the rotation we apply gets little larger
    in each frame and the object spins.


    ```

    #define ROTATION_SPEED 1.0f

    glRotatef(ROTATION_SPEED, 0.0f, 0.0f, 1.0f);

    ```


    However, you shouldn''t simplify the code to this degree; the roundoff errors
    within OpenGL would build up, and the simple rotation will gradually deteriorate
    and produce very bad effects if you don''t reset the matrix from time to time.


    Another thing to notice is that the actual rotation speed of the tetrahedron depends
    on the speed of your computer, the speed of your graphics card, and the amount
    of other stuff you have running at the time. It is a good idea (in most cases)
    to measure the amount of time that has elapsed between the last frame and this
    one and use that to adjust the amount of movement to make the speed of the game
    action appear constant no matter what.


    # PERSPECTIVE AND THE PROJECTION MATRIX


    Earlier I mentioned that there are three OpenGL matrix stacks and three current
    matrices. The one we''ve been messing with so far is the ModelView matrix. It
    controls how objects (models) are positioned to the viewer.


    The second matrix is the Projection matrix; it determines how the 3D coordinates
    in the model are squashed down into two dimensions so that polygons can be drawn
    on the screen.


    We won''t concern ourselves with the third Texture matrix at this stage.


    So, what''s the Projection matrix for? You may have realized that the OpenGL viewing
    "volume" has coordinates that run from -1.0 to +1.0 in the X and Y directions;
    you can see that from the last we


    ![](img/8827e679048b592dad186c600299f274_131_0.png)'
