  md: '# LINUX GAME PROGRAMMING


    In my games that start Tux, the Linux penguin, I use textures to map Tux''s features.
    However, the black feathers that cover most of a penguin''s body need to be shiny.
    However, no matter how shiny you make your body, the resulting white polygon colors
    are multiplied by the black textures in the map, and the result is always black.


    The solution is to render the textured polygons and then draw them again as untextured
    black polygons with white specular colors. Setting the OpenGL glBlendFunc() function
    to add the incoming color to the color already drawn results in only shiny spots
    in the second pass showing.


    It''s possible to produce all kinds of interesting effects with these kinds of
    multilayer rendering techniques. On other graphics cards, these effects can be
    considerably expensive because you wind up drawing each polygon several times,
    often with the least-efficient pixel-blending modes.


    Furthermore, some modern 3D cards OpenGL extensions to render and combine multiple
    texture maps at the same time. This avoids the cost of transforming the geometry
    times, but the fill rates for many cards slow down proportionally to the number
    of texture maps that are being applied, so the net gain in fill rate may come
    to zero.


