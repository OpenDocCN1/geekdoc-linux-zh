    in the texture map to have an alpha value of 0, you''ll see that square holes
    are punched through the polygons. This is great because you can use alpha-textures
    to make complicated irregular shapes like without having to draw thousands of
    polygons. All you need is to take a photograph of a tree and, using a program
    like the GIMP, remove the parts of the photo that are not part of the tree.


    > NOTE You may be wondering why many of the texture functions use GL_TEXTURE_2D
