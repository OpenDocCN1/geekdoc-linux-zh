  md: '# POLLING WITH SDL


    SDL provides a set of functions that you can use to bypass the normal event queue
    methods and get immediate information about current device states. It should be
    noted that these functions do not query the hardware directly; instead, use the
    internal information that SDL maintains about devices. This internal information
    may not always be up-to-date, especially if you are not actively using the event
    queue. To update these internal states, you can call SDL_PumpEvents(), which forces
    SDL to gather information from the input devices.


    # POLLING THE KEYBOARD


    The simplest way to get the state of the keyboard is to poll it. This can be achieved
    using the following two functions.


    ```

    Uint8 *SDL_GetKeyState();

    SDLMod SDL_GetModState(void);


    Internally, SDL keeps track of the state of all the keys on the keyboard, which
    ones are currently

    pressed and which are not. The SDL_GetKeyState() function returns a pointer to
    this internal

    ray. The array contains an entry for each SDL key symbol; if the entry is 1, the
    key is pressed;

    otherwise, it is not. So, if you want to check whether or not the Enter key is
    pressed, you could use the following:


    Uint8 *key_table;


    SDL_PumpEvents();

    key_table=SDL_GetKeyState();

    if(key_table[SDLK_ENTER])

    printf("Enter key is pressed\n");

    ```


    SDL_GetModState() returns a value that is bitwise OR of modifier symbols, such
    as Shift, Caps Lock, and Ctrl, are currently pressed. You can check for a specific
    modifier by ANDing the value returned from SDL_GetModState() with the required
    modifier symbol. The following example checks to determine whether the Shift key
    is pressed:


    ```

    SDL_PumpEvents();

    if(SDL_GetModState() & KMOD_SHIFT)

    printf("Shift key is pressed\n");

    ```


    Both the SDL_GetModState() and SDL_GetKeyState() functions can be very useful
    if used correctly. They allow you to get the current state of the keyboard at
    any time without your having to maintain it yourself.'
