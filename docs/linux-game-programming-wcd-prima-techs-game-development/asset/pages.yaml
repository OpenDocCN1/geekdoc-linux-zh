  md: '# LINUX GAME PROGRAMMING


    # SENDING CONTROLLER INPUTS


    If you have a server controlling the state of game, why bother sending every single
    piece of data that the client generates to the server? A better method is to send
    only the user presses on the keyboard and to let the server run the main logic.


    This approach not only reduces the amount of traffic being sent over the network,
    but allows the full control of the game. Note that there are some problems with
    this system, especially for players experiencing a bit of lag. Such players may
    have the server processes input a long time after they responded. This problem
    was prevalent in the original Quake Deathmatch (not QuakeWorld). If you had about
    200ms of lag, you felt like you were on ice. Your player would slide over all
    the place because the packet spent too long updating your current direction (in
    Quake Deathmatch, the client handled all looking around).


    Although this wasn''t a major problem, it did get annoying at times, and it''s
    something you should remember when designing your games.


    # LOBIES


    It''s not much giving the user the ability to play multiplayer games if he doesn''t
    know where to find a server running the game. This is where lobbies come into
    play. Lobbies act as directories of active game servers, allowing players to search
    a database of games and choose the one he wants to play. Some lobbies also offer
    a pregame system and staging areas where players can plan tactics before being
    thrown-first into a combat scenario.


    Most current lobby APIs are limited to a single platform, restricting players
    from competing against others using the same platform. APIs such as DirectPlay
    and Kage (DreamCast) also offer proprietary game protocols, adding a further barrier
    to interoperability.


    # WHAT IS OPENLOBBY?


    OpenLobby (available at http://www.thisisnurgle.org.uk/openlobby) is the first
    part of a project to eliminate the proprietary-ness of networking APIs for games.
    With an open protocol and OpenSource API (allow porting to various platforms),
    OpenLobby is almost guaranteed to provide the interoperability that cross-platform
    development requires—even if you don''t need to use it on other platforms. )


    ```

    OPENLOBBY: HTTP://WWW.THISISNGLE.ORG.UK/OPENLOBBY

    ```'
