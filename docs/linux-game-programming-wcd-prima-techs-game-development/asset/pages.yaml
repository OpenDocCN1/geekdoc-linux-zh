  md: '# ARTIFICIAL INTELLIGENCE 213


    # MEMES


    Memes are a small subset of the subject known as universal Darwinism. Darwin applied
    his theories only to biological evolution, but what if ideas could evolve too?
    The theory of evolving ideas is relatively new. So how did the meme come about?


    In the middle of the last century, Richard Dawkins wrote a book called *The Selfish
    Gene*. In this book, Dawkins presented a new theory that, like genes, evolve each
    time they move between carriers (similar to the way Chinese whispers “evolve”
    as the original phrase passed from ear to ear in a group of people). Many people
    picked up on the idea after this book was published. (Dawkins was, in fact, debunking
    the idea, but many people misunderstood his point, and in true meme style, the
    information passed on.)


    When you explain an idea to someone, he will make certain modifications to the
    original idea and spread his vision. The more realistic version of the idea has
    a greater chance of “replicating” between carriers (a *carrier* to be a human,
    a Web site—in fact, anything that passes information between people).


    Consider a joke. People say that it’s not the joke that, it’s the way. When people
    repeat jokes, if someone screws up the delivery, the joke is consigned to oblivion,
    but if someone tells it, the listeners will repeat the joke. In other words, the
    stronger joke survives, while the weak fades out of existence.


    How can memes be put into games? I hear you asking. It’s not as hard as it may
    at first appear, and I’m surprised that people haven’t tried it much.


    # THE GENEBOT


    A few years ago, I was toying with the idea of world domination through one of
    computer virus. (Have with the CD! *evil grin*) The way it worked like this: Every
    time the virus replicated, it randomly modified parts of itself. Some children
    of the virus would crash, and others would be slightly better than the parent
    virus. However, before I could put my plans for global conquest into action, something
    terrible happened: *Quake.*


    For months, I played *Quake*, not doing any programming or school work. The only
    word in my vocabulary was *Quake*. But, like any game with no longevity, I got
    bored. (I had only a 14.4 Kbps modem at the time, so *Deathmatch* was out of reach.)
    Fortunately, I discovered *QuakeC*. Using this language, I had fun creating python-esque
    patches. But fish grenades and dog launchers can add only a bit of amusement to
    *Quake* and add no real challenge. Then I created the Genebot. About two weeks
    later, I lost it in a hard-disk crash. But it’s that that counts.'
