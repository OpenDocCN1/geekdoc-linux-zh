    Adding fog to a program is fairly simple, although you''ll need to tweak the color
    and density of the fog to achieve the effect you need. Choosing a fog value is
    rarely a cut-and-dried computation; it''s hardly ever possible to be sure of a
    good number to type in.


    ```

    glEnable( GL_FOG );

    Fog( GL_FOG_DENSITY, 0.2f );

    Fog( GL_FOG_COLOR, white );

