  md: "# INPUT WITH SDL 77\n\n```\ntypedef struct {\n    Uint8 type;\n    Uint8 button;\n\
    \    Uint8 state;\n    Uint16 x, y;\n} SDL_MouseButtonEvent;\n```\n\nAt first\
    \ glance, the SDL_MouseButtonEvent structure seems to convey the same information\
    \ as the SDL_MouseMotionEvent structure. Every time a mouse button is pressed\
    \ or released, an event of this type is added to the queue. The button field tells\
    \ us which button has been pressed or released; it can contain one of the following\
    \ values: SDL_BUTTON_LEFT, SDL_BUTTON_MIDDLE, SDL_BUTTON_RIGHT. The SDL_BUTTON(x)\
    \ macro is not with this structure, so don't get confused with that.\n\nThe state\
    \ field is redundant; it simply tells whether the button has been pressed or released,\
    \ but we have already determined this from the event type. Ignore the state field\
    \ because it only adds confusion. the x and y are the same as in the SDL_MouseMotionEvent\
    \ structure: they are simply the position of the mouse when the button was pressed\
    \ or released.\n\nAt this stage, you have probably realized that the key to understanding\
    \ events is understanding all the different structures that make up the SDL_Event\
    \ union. Don't rush through these explanations; make sure that you understand\
    \ the purpose of each structure and the information it conveys. When you are confident\
    \ that you know what you're going on, take a look at the HandleMouseEventEvent()\
    \ function in the following list:\n\n```\n/* Handle all mouse events *\nvoid HandleMouseEvent(SDL_Event\
    \ *event) {\n    /* Useful pointers to the required event structures *\n    SDL_MouseMotionEvent\
    \ *motion=event->motion;\n    SDL_MouseButtonEvent *button=event->button;\n```\n\
    \n```\n/* Switch on the event type */\nswitch(event->type) {\n    /* handle motion\
    \ events */\n    case SDL_MOUSEMOTIONEVENT:\n        /* Print mouse position */\n\
    \        printf(\"Mouse moved to: (%d, %d)\\n\",\n               motion->x, motion->y);\n\
    ```"
