- img_proc: true
  md: 'tetrahedron in expl.c exactly fits the window. The viewing volume also runs
    from 0.0 to -1.0 in the Z direction (the positive Z region would be "behind your
    head," so you can''t see it).


    Space is restrictive and doesn''t allow for the effects of perspective. The Projection
    matrix takes care of all of these things and is capable of doing some strange
    things to your images. However, for most practical purposes, you only want a simple
    3D projection that achieves perspective.


    Setting the Projection matrix to produce the exact effect you need would be hard.
    Fortunately, there is an OpenGL utility to do all the messy part for:


    ```

    glPerspective(double fov, double aspect,

    double zNear, double zFar);

    ```


    The fov parameter sets the field of view in the Y (vertical) direction. This is
    the angle (measured at the eye) between the highest you can fit on the screen
    and the lowest. In practice, it''s generally set to somewhere between 40 and 80
    degrees. Smaller numbers generate telephone views, as if you were looking through
    a telescope. Larger numbers produce wide-angle views and in the extreme can produce
    "fish-eye" distortions.


    The aspect parameter is the aspect ratio of the window. For a 640x480 window,
    this parameter should be 640/480 (about 1.3). Getting this number wrong tends
    to produce distortions as thing


    If you rotate your spinning tetrahedron, you''ll notice that the red triangle
    is initially the same width as the screen; after 90 degrees of rotation, however,
    it''s the same height as the screen, which is quite a bit smaller! Setting the
    Projection matrix appropriately for the window size will fix problem.


    If you played with glRotate() in the preceding example, you may have managed to
    spin the tetrahedron so that parts of it get cut off—even though they lie within
    the window. What happens when parts of the object come too close and "poke through
    the screen" or get too far away and fall below the edge of OpenGL''s little world.
    These two places are called zNear and zFar, and you can position them with glPerspective().


    Most beginners try to set these numbers so far out that objects never be clipped,
    but that''s a mistake. The depth buffer we discussed earlier has only limited
    precision; if you put Near close to the eye, you will create problems with depth
    precision. The zFar value is less critical, and you can safely set it to a large
    number.


    > NOTE

    Notice that some OpenGL commands start with glu rather than gl1. This difference
    indicates that they come from the optional libGL library rather than the core
    libGL set. Although functions can be rewritten in terms of core OpenGL functions,
    the GL functions are generally a worthwhile convenience. Plan to use libGL in
    most of your programs.'
