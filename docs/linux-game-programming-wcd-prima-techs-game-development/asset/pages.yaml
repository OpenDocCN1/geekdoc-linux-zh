    # SWITCHING TO A GRAPHICS MODE


    The first thing any SVGALib program should do is set an appropriate graphics mode.
    The first step

    down this path is to initialize the SVGALib by calling `vga_init()`, defined in
    the header file `vga.h`. This

    function starts up the SVGALib subsystem and renders root privileges.


    If the call is successful, `vga_init()` returns 0. Assuming that `vga_init()`
    was called with no

    problems, you can then switch to a graphics mode. Personally, I like to check
    whether a mode is

    available before I try to switch it by calling `vga_hasmode()`. This function
    takes a single parameter:

    symbol for the mode you want to take. Table 4.4 shows the different video modes
    available. If

    the mode is available, a non-zero value is returned; otherwise, the function returns
    0.


    As soon as you know that your chosen mode is available, you can call `vga_setmode()`
    to change

    resolutions. On success, it returns 0; on failure, it returns -1.


    # Table 4.4 VGA Modes


    | Name | Resolution |

    |---|--n| TEXT | Standard text mode (original console mode) |

    | G320x200x16 | 320x200 16-color |

    | G640x200x16 | 640x200 16-color |

    | G640x350x16 | 640x350 16-color |

    | G640x480x16 | 640x480 16-color |

    | G320x200x256 | 320x200 256-color |

