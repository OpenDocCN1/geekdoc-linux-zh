  md: '# CHAPTER 9


    # NETWORKING'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'n today''s Internet society, very few games will pass public muster unless
    they include some form of multiplayer entertainment. Even so, a small number of
    PC games are released without the ability to compete or cooperate with other human
    beings. At the other extreme are games designed as pure multiplayer experiences,
    offering very little in the way of single-player entertainment.


    # INTRODUCTION TO MODERN NETWORKING


    Networking today is very different from the way it was in the early days. In recent
    years, traditional technologies such as IPX have been supersceded by widely accepted
    standards such as TCP/IP.


    Even the physical design of a network has changed. Old, then Ethernet systems
    have been replaced with the more reliable Cat-5 structure, which adopts a format
    similar to that of the Internet. The "star" topology is probably the most-used
    type of network today—and with good reasons. However, I''m not here to teach you
    to set up networks, but to focus on the software side of things.


    When it comes to adding network support to any type of software, there are certain
    things you need to consider before writing your code. The first thing you need
    to consider is what sort of network architecture you want to use. There are two
    types worth considering: peer-to-peer and client/server.


    # PEER-TO-PEER NETWORKING


    Peer-to-peer applications are programs in which all systems on the network communicate
    with no central point of contact. Although many people shun this system, if your
    game has only a few players, this could be your best option.


    Peer-to-peer games work by transmitting data to all other clients connected to
    the game. If there more than four players in the game, the peer-to-peer architecture
    is unsuitable, but for a few players, it''s perfect.


    Each client in the system also acts as a server, telling all the other systems
    what it is doing at that precise moment in time. At the same time, machine is
    being told by all the other systems what''s happening. This simultaneous communication
    can lead to problems keeping all the clients synchronized, but these problems
    can be navigated with a little bit of hard work.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# CLIENT/SERVER NETWORKING


    The other main network architecture in use today is the client/server method.
    This approach makes use of a dedicated server to which all the clients connect.
    Instead of communicating with other clients, the client sends a message to the
    server; the server then passes that message to the other clients involved in the
    game.


    The client/server model makes it easier to communicate with the other clients
    because there is only one address to send the data to. However, this model does
    double any latency that may occur. There are not many ways around the latency
    problem, and this delay can kill the success of a game in no time flat.


    # THE TCP/IP STACK


    Most networks using the TCP/IP stack. This collection of protocols is designed
    to isolate applications from the underlying hardware. There are several layers,
    ranging from the physical layer (data going over the cable) to the application
    layer (what programs actually).


    The layers of interest to us are the transport layer (which includes the TCP,
    UDP, and ICMP protocols) and the application layer. The application layer is completely
    undefined and can be used to transmit any data you want, in whatever format you
    want.


    > NOTE\NICMP (Internet Control Messaging Protocol) is a very simple protocol that
    can only be used for a few things, and are not really usable in games.


    The transport layer, on the other hand, offers several options for transmitting
    the data.


    # TCP


    TCP (Transport Control Protocol) is a reliable system that incorporates error
    checks to the data. These error checks increase the size of the packet headers,
    and therefore reduce the amount of data you can send in a single packet (different
    connection types have different MTUs (Maximum Transmission Units). PPP connections,
    for example, have an MTU of 500).'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'Unlike UDP connections (which are explained in the following section), TCP
    connections establish a connection to the other machine and send data directly
    there. This approach reduces the amount of work you have to do while coding your
    program.


    TCP is generally slower than UDP because of the error checks involved, so it is
    not suitable for urgent data (such as game data), but it is perfect for applications
    that need reliability over speed.


    # UDP


    The other option, UDP (User Datagram Protocol), is as low-level as you could ever
    want to (trust on that). It is a fast, efficient system, but it''s not too safe.
    All the UDP packet header contains the destination address for the packet (which
    is all it really needs to know). However, if a packet is dropped or becomes corrupted
    en route, it is for good.


    UDP is used for games more than TCP is because of the performance enhancements
    UDP sports. A good comparison between the two protocols can be seen in the differences
    of lag time between Quake Deathmatch and QuakeWorld. Originally, Quake used TCP
    connections to transmit data, which resulted in a major latency problem. This
    issue was fixed to some degree with QuakeWorld, which used UDP instead.


    # SOCKET PROGRAMMING


    Socket programming can be easy at times, a nightmare at others, depending on what
    you want to do. Unfortunately, the TCP option is easier (in my opinion) than UDP,
    but there are some functions that apply to the whole area of socket coding.


    # OPENING A SOCKET


    The function call socket() opens the initial socket for you. This function simply
    describes the type of socket you want and returns a socket descriptor. These socket
    descriptors can be used as normal file descriptors (for example, such as the ones
    returned by open()) and demonstrate the UNIX philosophy of "everything''s a file"
    quite well. The function prototype for socket() is shown here:


    ```

    int socket(int domain, int type, int protocol)

    ```'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'The first argument, domain, specifies the protocol family to use. This should
    be either PF_INET or PF_INET6 (for IPv6 sockets, which are going to be use in
    several years'' time). There are several options, but these are out of the scope
    of this book.


    The next argument, type, is the transport layer type you want to use. Again, although
    there are several possibilities, you''ll probably want to use SOCK_STREAM (for
    TCP) or SOCK_DGRAM (for UDP).


    The final argument, protocol, is the type of protocol to use. It can be either
    IPPROTO_TCP or IPPROTO_UDP.


    The socket() function returns a valid descriptor on success; it returns -1 on
    failure.


    # # CONNECTING THE SOCKET


    When you have successfully opened a socket, you must specify where exactly you
    want it to go. You do this with the connect() function. Note that you connect()
    only if you are using a TCP socket. UDP is a connectionless protocol and does
    not require this call.


    ```

    int connect(int sockfd, struct sockaddr *serv_addr, int addrlen);

    ```


    The first argument, sockfd, is the descriptor returned by socket(). You will use
    this value again throughout the process. The next argument, serv_addr, is a pointer
    to a structure containing details about the address to which you want to connect.
    Although the function prototype uses type sockaddr, you''ll need to use the structure
    sockaddr_in and cast it to the correct type when you call the function. The members
    of this structure that are of interest are sin_addr->saddr and sin_port. The first
    one is the address of the machine to which you want to connect. You can determine
    this address by calling the function inet_aton(as a string) of the host to connect
    to, followed by a pointer to the address where you want to store the result in_addr
    structure.


    The sin_port member is the port number which you want to connect, which must be
    specified in network-byte order.


    > NOTE

    When specifying any sort of numbers, remember to use the htons() function, which
    converts the host-specific number to network-byte order.


    ![](img/8827e679048b592dad186c600299f274_206_0.png)'
