    That simple (and probably buggy) implementation of a message queue system should
    demonstrate how to allow messages received from the network thread to be read
    from the game thread itself. With this approach, the network thread can do what
    it does best: be a network thread.


    # SERVERS


    In addition to the methods discussed in the preceding section regarding clients,
    there are a few more tricks to lighten the load when it comes to server programming.
    The most common trick is the use of a separate thread for each client; then you
    can use the interthread communication methods described in the preceding section
    to pass messages between the threads.


    When a connection is requested with accept(), you pass the new socket descriptor
    associated with the fresh client as the argument to the client''s own thread.
    This approach removes the need for a database of sockets (which can be a pain
    in the backside to maintain).


    The following code demonstrates this:


    ```

    // Accept the new connection

    new_sock = accept(sock, NULL, NULL);


    // Create a new thread for said client

    pthread_create(client_thread, NULL, client_func, &new_sock);

    ```


    # PINGS


    Every so often during a game, a client might be disconnected from a server. This
    can cause problems because there is no way to automatically detect this situation.
    To combat it, you must keep track of player activity using a number of methods.
    The easiest method is to keep a timer of how long it has been since the last message
    was received from a particular client. If the timer exceeds a specified time,
    that client is removed from the game.


    Note that this approach isn''t necessarily the best course of action to take.
    If a client is not doing much at that point of the game (dare I say he might be
    camping?), you probably won''t appreciate being kicked out of the game for it.
    Another approach is to send regular pings to all the clients.


    A ping is a simple message that contains the time the message was sent. When the
    client receives the message, it sends the message back unchanged. The server can
    then keep track of these ping times and'
