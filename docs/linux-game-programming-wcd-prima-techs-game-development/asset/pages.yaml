  md: '# CHAPTER I


    # INTRODUCTION TO GAME DEVELOPMENT'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    Listen my children, for I will tell a tale of a quest for glory, an adventure
    most heroic. A long time ago, in a place far away, a young man sat in front of
    a magic box and decided to give everything to the world. He spent many moons on
    his creation. And when it was complete, he looked upon his creation and saw that
    it was good. This creation was a computer game. (After this went went to the pub
    for a few drinks because he really needed a good night out.)


    # WHAT MAKES A GAME?


    Why is a game different from any other type of application? There are several
    major differences: Games generally use more input and output devices than other
    applications. Games generally run faster than normal applications and use a lot
    of CPU time. The differences between games and other software are recognized by
    large software developers such as Microsoft and forced these companies to create
    additional tools to developers to access the hardware directly.


    Let''s compare a game to a word processor. What do you do in a word processor?
    You type stuff in, add a bit of formatting, stick in some random comments for
    your editor to have a chuckle over, and save the file. In a game, a lot is involved.
    You have update the screen as many times as possible during a single second. You
    need enemies reacting to the player''s actions, you need a goal to achieve, and
    most important, the game has to be.


    # DIFFERENT GAME GENRES


    There are many different types of games on the market, ranging from shoot-em-ups
    to strategy, from card games to simulations. Although some genres are generally
    more popular than others (such as first-person shooters), others have much more
    playability (such as card games).


    # SHOOT-EM-UPS


    The shoot-em-up type of game is probably one of the most popular genres at the
    moment. This category includes games such as Quake and Unreal Tournament. There
    are several types of shoot-em-up, ranging from first-person perspective to scrolling
    games such as Defender. Most games in this genre have one goal: to kill anything
    that moves, from a shotgun to space ship.


    Many newer shoot-em-ups have multiplayer capabilities, while others are only written
    for use as multiplayer games (for example, Quake III: Arena). These games have
    come under a lot of fire from the media in recent years and have been blamed for
    the Columbine shootings.'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'Games of this genre generally have very little in the way of a storyline—who
    need an excuse to kill the alien invaders. Although some games make an effort
    to craft a story, original stories are harder to come up with these days.


    Many games based on films fall into this category, such as Die Hard Trilogy and
    Alien versus Predator.


    # STRATEGY GAMES


    There are two types of strategy games: real-time and turn-based. Games such as
    Command and Conquer, StarCraft, and Dune are real-time, whereas the hugely successful
    Civilization series is turn-based.


    Real-time strategy games generally consist of two or more sides battling it out
    for an area of land. These games usually require the mining of raw materials to
    build new structures and units. These games are nearly as popular as shoot-em-ups
    but require a lot more to play (a single level of Command and Conquer can take
    several hours of playing before it''s completed). Consequently, it takes a lot
    of patience to play these games, and they can become very frustrating.


    Games that require the building of a civilization, as Sid Meier Civilization,
    tend to be turn based. Turn-based games can be played for days on end with only
    regular cups cups of coffee to keep you going. Turn-based games allow a player
    to move all of their units before allowing the other players to have their turns.


    # SIMULATIONS


    Any game that attempts to simulate a real event is a simulator, be it flight simulator
    or a fishing game. These games are designed to emulate real life as much as possible,
    allowing the users to gain experience in areas they wouldn''t normally get a chance
    to experience.


    Some simulators are used for training, such as the Concord simulator at British
    Aerospace Filton in the United Kingdom. This multimillion-dollar computer game
    emulates the real behavior of the aircraft exactly (except that they won''t barrel
    roll it). A few years ago, I had the opportunity to browse through the source
    code for the simulator (written in Assembler)—all seven million lines of code!
    Accurate simulators are big projects and are not suited for the weekend programmer.


    # PLATFORM GAMES


    Some of the most successful games ever have platform games, such as the Mario
    series. This genre consists of a character moving around on a level that usually
    scrolls from side to side, but that in more years has become a full three-dimensional
    environment, with the character jumping around like a hyperactive frog on anti-depressants.


    Many people in game development choose a platform game as one of their earlier
    projects (after a few puzzle games). This is because platform games are generally
    uncomplicated the developer''s point of view and can result in hours of entertainment
    for the player.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    # PUZZLE GAMES


    There are probably more puzzle games in the world than any other type of game.
    Puzzle games are very easy to code and can be more addictive for the player. This
    type of game requires very little in the way of artificial intelligence and tends
    to be relatively small compared to games from other genres that require large
    numbers of external data to run.


    Examples of puzzle games include Tetris and Minesweeper. These games require patience
    and planning to win. Like strategy games, puzzle games can get very frustrating
    over time.


    # ADVENTURE GAMES


    Adventure games run the gamut of complexity, from the text-based Zork to the full
    3D Tomb Raider. This genre usually consists of the main character interacting
    with NPCs (Non-Player Characters) to achieve a goal, whether that goal is rescuing
    a lost artifact or hooking up with a sexy babe (as in Leisure Larry, by Sierra).
    These games tend to be highly immersive and can suck away many days of life from
    a dedicated adventurer.


    # ROLE-PLAY GAMES


    Similar to adventure games, role-play games often involve going on a quest of
    some description, but tend to be a lot more open ended. Players can spend years
    building up a character, giving it a personality, and collecting a large stash
    of cash.


    Some of the early RPGs (Role-Play Games), such as Ultima, used very simple graphics
    but proved highly successful, and some are still played today. Multiplayer RPGs
    have traditionally been text-based MUDs (Multi-User Dungeons), but some of the
    more recent games have been graphical, such as Ultima: Online and EverQuest.


    # CARD GAMES


    Everyone has played Solitaire or FreeCell. These card games tend to be played
    when the user is waiting for something to be done or on the phone with an answering
    customer. Card games can become very addictive; I know some people who wouldn''t
    get out of bed if it weren''t for FreeCell.


    # SPORTS GAMES


    Another successful game genre is the sports genre. Here in the United Kingdom,
    every gamer out there has played at least one soccer game, one racing simulation,
    and at least one beat-em-up. Some of the first games ever created fell into this
    genre (Pong being very similar to a game of tennis without nets).'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# INTRODUCTION TO GAME DEVELOPMENT


    Games like the FIFA series are always bestsellers, and with good reason. They
    bring out the competitive instinct in the player and allow the user to kick ass
    without actually hurting anyone. Many a time my better challenged me to a quick
    game of Actua Soccer, and many times I won (and many time I beat me for winning).


    Sports games are generally addictive and can lead to large tournaments among groups
    of people. People like sports, and they like them even more if they don''t have
    to get injured in the process.


    # WHAT MAKES A SUCCESSFUL GAME?


    This is a tough question because everyone has different opinions about what makes
    a game good, but there are always common factors. Successful games are always
    (and most important) playable. Nobody likes to play a game where you have to fight
    for ten minutes just to square to one pixel to the left.


    The game also needs to have a user-friendly interface, with easy-to-navigate menus
    that get the player into the game as it loads. Continuing from this, a good game
    should be very easy to learn but should take a lifetime to master. A good example
    of this criterion is Street Fighter. Anybody can play the game well, but very
    few are good at it. This is because the game controls are intuitive; randomly
    hitting even allows a new player to win a fight against a master. However, a master
    can learn the special moves and use them to their full effect.


    Some games have overly complex control systems, such as Alien Predator. This game
    had too many controls to master before you get into the game. This means only
    a dedicated gamer could play it for more than five minutes without deleting it
    from the disk out of frustration. Having to constantly jump around the keyboard
    to select a gun and fire puts most off for life.


    Another key to the success of some games (although not all) is a good plot. why
    are you killing them? Did they run around every goblin in sight, your second cousin''s
    pet cat? Or are you killing them because they are there to kill? A simple background
    story can contribute a huge amount to the game''s success, even if the actual
    story has no relevance to the game itself.


    Good story don''t have to be predictable to be interesting. Take, for example,
    the film From Dusk Till Dawn. Half the film is about two criminals trying to get
    to Mexico, suddenly, of nowhere, they are attacked by a hoard of vampires. This
    surprising twist made the film much more interesting. Games with sudden twists
    have done very well. A good example of this is Wing Commander III, in which the
    Kilrath pilot changes halfway through the story, even though he showed loyalty
    to the Terran struggle.


    Sometimes being a well-known game developer means that all your games will be
    a huge success, if there is nothing special about your project. A good example
    of this condition is Doom 2, the sequel to'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'The highly successful Doom. There weren''t any brand-spanking new features
    or a supersmart AI system in this sequel to the successful Doom game, but people
    like id software, and they will buy their games. However, fame has a price. People
    are more willing to jump on any bugs in a game from a successful developer, while
    a lesser-known developer might manage to sneak a few “inconsistencies” past the
    critics.


    # THE GAME-DEVELOPMENT PROCESS


    Game development, like any form of software engineering, isn''t a simple code-it-and-re-done
    process. There are several stages to go through to your game from the drawing
    board to being played.


    # THE DESIGN DOCUMENT


    A good document is probably the most helpful tool for any game developer. It helps
    you develop a solid idea which you can base your game. The design document can
    also help you a publisher if you choose to write a commercial game (as explained
    later in this chapter).


    What goes into a design document? Just about everything from the story line to
    the 3D engine you''re going to use. Some design documents are several hundred
    pages and cover every single detail in the game; simpler games can use shorter
    design documents. Even the smallest documents should contain the:


    +   - **General Overview.** This section of the document covers the story line,
    the main characters, an overview of the development timeline, and the development
    staff required.

    - **Screen and User Interface.** This section of the document covers the in-menus,
    the in-game HUD (Heads-Up Display) you might use, as well as any icons used in
    the game.

    - **Art Specification.** This section of the document lists any in-game artwork,
    cut-scenes, and sprites. Include any appropriate storyboards and sketches.

    - **Sound and Music.** All sound effects and music must be documented in this
    section, as well as any voice talents you will need.

    - **Technical Specification.** This section covers how the game is going to run,
    including flowcharts and benchmarking you plan to perform.

    - **Legal Information.** This section includes the copyright and a disclaimer.


    After you have written your document, you should share it with everyone so they
    can give you feedback on your ideas. You will probably get through several versions
    of the design document before you all agree on what it contains, but that''s not
    a bad thing. The revision process will help form new ideas from old ones and point
    out some serious problems that might occur only later in the development process.'
