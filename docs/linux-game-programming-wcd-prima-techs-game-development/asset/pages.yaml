    # DRAWING POLYGONS, LINES, AND POINTS


    OpenGL can draw a wide range of basic shapes: points, lines, polygons, triangles,
    and quadrilaterals. When you tell OpenGL to draw one of those basic primitives,
    you only have to tell it where the corners—the *vertices*, to use the correct
    term—of triangles are in 3D space. OpenGL does all the rest. You don''t have to
    worry about the order in which you draw things, and you don''t have to write code
    to draw every individual pixel. Because all the apparatus needed to draw a complete
    triangle is typically provided in your 3D graphics card, this operation can happen
    very quickly—perhaps in less than a million of a second for a small triangle!
    On a modern graphics adapter, your biggest worry is often how to arrange the triangle
    vertex data in memory so that you can send it to the graphics card fast enough
    to keep it busy; rarely will you have to wait for the hardware!


    Those basic shapes (point, line, polygon, triangle, and quadrilateral) are all
    pretty obvious. OpenGL also offers line-strips, line-loops, quad-strips, triangle-strips,
    and triangle-fans. These strips, loops, and fans are there to allow you to draw
    collections of connected shapes without having to send the vertices that they
    share more than once. Using these shapes can save you typing and will also make
    your program run faster because those shared vertices don''t have to be processed
    more than once.


