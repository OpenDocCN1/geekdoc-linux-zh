- img_proc: true
  md: '# TEN REASONS TO WRITE CLOSED-SOURCE SOFTWARE


    I''m known for my neutral stance in pretty much everything, and the OpenSource
    movement is no exception. To balance my list with ten reasons for using OpenSource
    development, here is another list of reasons for using a closed-source development
    route. (Note that this list does not present ten reasons against OpenSource development,
    which is a completely different ball.)


    # MONEY


    It''s very hard to make money from OpenSource product. If you ever plan to get
    a publisher for your game, you''ll have a tough time convincing them that OpenSource
    is the way to go. There are too many issues to count, from easy piracy to intellectual
    property rights. Closed-source software, on the other hand, can make money very
    quickly if the product is of high-enough quality. Note that many developers have
    found that people still buy shareware, so contacting a publisher isn''t always
    a requirement for making money from your game.


    # PARANOIA


    Many developers are worried that people will rip off their code, or that their
    code is of substandard quality and don''t want other people to see it. This fear
    of having code dissected can be found everywhere,where even with commercial companies,
    and is probably one of the main reasons why hobby developers do not release their
    code.


    # PLAGIARISTS


    A few years ago, when I was in school, people kept asking me for the code to my
    programs. At first, I had no problem with this, but after a while, I realized
    that instead of writing their own programs, these people were just copying bits
    of my code to make a new program. As soon as I realized that, I decided that I
    wouldn''t give my code out. Instead, I would guide people to the right track when
    it came to development. I still stick by this philosophy today, programming ignorance
    is still rampant in the world, and hacked code is frequently of much lower quality
    than new, original code.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# NEW TECHNOLOGIES


    Your game might be the foundation of a brand new technology, such as a new 60
    frame-per-second ray-tracing engine. Anyone would have doubts about freely releasing
    that hard-earned technique into the OpenSource arena, and I wouldn''t blame them.


    New technology is one of the key reasons for closed-source software. In many ways,
    the fear of making a new technology freely reflects the paranoia aspect of closed-source
    development. However, we are aware that OpenSource software is responsible for
    developing some new technologies itself.


    # CONTRACTS


    Some developers work under contract to other companies and don''t actually own
    the code they write. This is also the case in many universities and colleges,
    where the work you produce as part of your course is actually owned by the institution.
    In many cases, universities will allow you to release your code; sometimes they
    don''t (if the program is part of an examination, for example). In situations
    like these, obviously, the OpenSource development route is not an option.


    # SELFISHNESS


    Everyone is selfish in some ways, as much as we hate to admit it. Sometimes this
    selfishness drives us to not anyone see our code, even if that code could help
    people in the future. This short-sightedness is a major obstacle to the OpenSource
    movement, and one that will be very hard to hurdle


    # THE HE DID''T, SO WON''T ATTITUDE


    Some people work solely from the example of others. In some situations, people
    may think that because Microsoft didn''t release its code, why should anyone else?
    Although this is a good question, it doesn''t really mean in the real world, as
    everyone is born with free will, and people don''t have to live their lives in
    the shadow of someone else.


    # POLITICS


    Everyone has a political agenda, and sometimes that plays a factor in deciding
    whether you will others access to your source. Some people believe that keeping
    their source closed, they can gain ground in the development environment. How
    can this be, I hear you ask. By developing some funky graphics engine, people
    gain the respect of their peers. However, some people believe that this respect
    would be lost (and that they would therefore have less power) if people knew exactly
    how the engine was created.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    # EGO


    As described in the example in the preceding section, someone may feel that others
    won''t respect him if they know exactly how he did something with his code. That
    person may therefore not want to hurt his fragile ego by releasing his source
    code. Although this scenario may sound ridiculous, it does hap- pen The human
    ego is a dangerous thing, but it''s a part of us, and there''s nothing we can
    do to stop it from playing a role in our decision making.


    # SECURITY THROUGH OBSCURITY


    Although many people claim that "security through obscurity" doesn''t exist, it
    especially where games are involved. If people can see how everything is done,
    they can change the code to their advantage. This is a serious problem in online
    games, where people can give their online avatars super-human strength, making
    them impossible to beat by the average (non-cheating) player.


    Also, keeping your protocols closed means that people can''t "sniff" packets to
    find out certain things about the in-game environment that would give them an
    unfair advantage.


    # THE MIDDLE GROUND


    If both the OpenSource and closed-source development routes have reasons for their
    respective devel-op models, is there any way to exploit the advantages from both
    systems? Of course is there!


    # FREE CODE, PRIVATE DATA


    One way to gain the advantages of both sides of the OpenSource/closed-source argument
    is to make the source code to your game public but to keep the actual data to
    run the game private. This approach has been proven successful many times; id
    software proved the system to work when it made the Doom source code publicly
    available.


    The idea behind the Doom was that although the source code was free, the data
    files from the registered game weren''t. This meant that you had to buy the game
    if you wanted to play it (the data files worked just well, though).


    This approach allowed third-party developers to learn from the Doom graphics engine
    while keeping the game itself a commercial (private) product. Since id has done
    this, many other developers have fol-low; Alien Versus Predator is one of the
    most recent games to follow this pattern.'
