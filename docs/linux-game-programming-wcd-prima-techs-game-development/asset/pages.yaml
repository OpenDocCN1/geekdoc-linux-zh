  md: '# LINUX GAME PROGRAMMING


    game is all about control. Whether you are racing around the track at Daytona
    or piloting your damaged fighter in the most important battle in the galaxy''s
    history, you are in control. As a game designer and programmer, it is your job
    to make your game''s control system as simple and intuitive as possible. But the
    player should remember how good your control system was; it should be so intuitive
    that the player will forget it even there. Of course, this isn''t always possible:
    The best control system for a submarine simulator would require an entire bridge
    crew, a periscope hanging from your roof, and a red lightbulb (for effect). We
    are restricted to a small set of generalpurpose devices: keyboards, mice, and
    joysticks. Successfully forging these simple devices into the controls of starships,
    the hands of warriors, and even the minds of gods is what turns a game into an
    experience.


    If you have browsed through a games magazine or strolled through your local computer
    store, you may have noticed the vast array of game controllers available. You
    have your bread and butter: the keyboard and mouse. You also have your age-old
    classic, the joystick, in many different shapes and sizes: analog, digital, gamepads,
    arcade-style, and whatever else. There are some more specialized devices, the
    steering wheels, the light-guns, and even (my favorite) the mind controllers (what
    did happen to those?). Luckily for us, the designers and manufacturers of these
    devices realize that they are going to be used and bought only if they are supported
    by the games people want to play, and the best way to make sure that this happens
    is to use a standard interface, like that of a keyboard, mouse, or joystick. So
    that''s what they do: They make a steering wheel that just plugs into a joystick
    port and acts like a joystick, and they make a light gun that acts just like a
    mouse. This is great! We don''t have to worry about anything but three simple,
    established, and well-supported devices.


    # KEYBOARD


    For the uninitiated, a keyboard is an array of largely alphanumeric switches.
    It has the standard input device for computers for many years. Keyboards usually
    consist of just over one hundred keys which are divided into three logical sets:
    alphanumeric keys, function keys, and modifier keys. The alphanumeric keys consist
    of letters, digits, and punctuation characters. The function keys are made up
    of general-purpose keys, named F1 through F12, and several special-purpose keys
    such as Esc, Home, and End. Finally, the modifier keys are used to "modify" the
    meaning of the other two sets of keys (for example, the Shift key capitalizes
    letters).'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'A modern keyboard communicates with a computer by sending 8-bit data sequences
    to a peripheral processor. These data sequences are called scancodes, and each
    key on a keyboard is assigned a scancode based on a certain standard. The modern
    IBM PC-compatible keyboard is based on the AT scancode set. For example, according
    to the AT standard, when A Key is pressed, a scancode of value 0x1C is sent to
    the computer. When a key is released, a break code is sent, in the case of an
    AT keyboard FxF0; the break code is then followed by the scancode of the key that
    was pressed. It is up to the Linux keyboard driver—or sometimes the application—to
    convert these scancodes into usable character data of control codes.


    ![](img/8827e679048b592dad186c600299f274_94_0.png)


    # MOUSE


    The mouse was first developed by a team led by Doug Engelbart at the Stanford
    Research Institute in the late 1960s. The mouse is the most commonly used 2D positioning
    device for computer software. The basic roller mouse contains a ball that is in
    contact with a desk surface and two internal rollers at right angles to each other.
    Sensors (usually photo-diodes) on the rollers detect movement over the two axes;
    the movement is transmitted to the computer and is usually converted by the mouse
    driver to the movement of a pointer on the screen. A mouse usually has several
    buttons for clicking and selecting items.


    The really wonderful thing about a mouse is that it provides smooth and fluid
    movement; because it plays an important role in most modern computer software,
    it''s a device that can quickly gain a natural feel. Over the past few years,
    mice have become very popular in the First Person Shooter genre, a type of shoot-em-up,
    where they are used to control the head movements of the player''s character.


    # JOYSTICK


    Traditionally, a joystick is a vertical stick that pivots around its base and
    reports the angle to the computer. A joystick may have buttons positioned on the
    base or on the stick. The traditional joystick has been transformed over the years
    into the gamepad, which is similar to the joystick in function, the stick is replaced
    by a four-way pad, similar to the cursor keys on a keyboard. Other controls are
    also added to joysticks to complete the basic buttons. Hats are four-way minijoysticks
    placed at the top of the stick. Hats were originally used in flight simulators
    to allow the player to easily glide in the four directions. Throttle levers have
    also been added, originally to enhance flight simulators; the throttle is usually
    treated as a third or fourth axis. One and very rare feature is a trackball mounted
    on the joystick''s base, which provides all the functions in conjunction with
    a joystick.


    ![](img/8827e679048b592dad186c600299f274_94_1.png)


    Trackballs are another form of pointing device similar to mice. The device remains
    stationary while the user moves the pointer by rotating a ball mounted on the
    top of the device.


    ![](img/8827e679048b592dad186c600299f274_94_2.png)'
