  md: '# LETTER FROM THE SERIES EDITOR


    Dear Reader,


    A long time ago, in a cubicle, far away, UNIX was created. UNIX has shown itself
    to be a reliable and robust platform for workstations, mainframes, and even PCs.
    But, UNIX never really gained momentum on the PC platform for any one other than
    UNIX, wasn''t a simple platform to learn to program for However, the time has
    come when the PC version of UNIX, named Linux, has begun to make major in-roads
    into the average user''s home, and game programmers are taking notice! Now is
    the time that gamers and developers alike want to play and develop games for Linux.
    However, Linux, like UNIX, wasn''t a simple platform to learn to program games
    for—until now...


    Linux Game Programming is without a doubt one of the most ambitious game programming
    books ever written. There are so many aspects of basic Linux programming, and
    it boggles the mind to even begin to think about writing 2D/3D games for Linux.
    But, I can say that Linux Game Programming does it all. The author, Mark "Nurgle"
    Collins, starts from square one setting up the compiler, explaining the tools
    and libraries of Linux, and covering general game programming theory.


    This book is not just a bridge for Windows game programmers who want to learn
    how to port to Linux, but an entire treatise on game programming on the Linux
    platform. This book covers it all! And I mean everything—from 2D and the SDL (Simple
    DirectMedia Layer) to open GL and full 3D game programming.


    In conclusion, this book sets the standard for Linux game programming and will
    definitely be a jewel in your game programming library.


    André LaMathe March 2001'
  merge: -1
