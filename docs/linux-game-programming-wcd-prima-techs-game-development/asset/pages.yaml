  md: "# THE recvfrom() FUNCTION\n\nFor receiving messages on both TCP and UDP sockets,\
    \ you have to use the recvfrom() function. Note that this wasn't always the function\
    \ you called to receive data. A now-redundant function, recv() (similar to recvfrom()\
    \ but without the address details), simply called recvfrom() with NULL specified\
    \ for the unnecessary arguments. The recv() function may be removed from future\
    \ versions of the BSD socket library, if you decide to use it here, I will also\
    \ demonstrate a simple macro to emulate it here.\n\n```\n// Macro to emulate recv()\\\
    \ - not really needed in\n// current versions of the TCP/IP stack\n#define recv(s,\
    \ msg, len, flags) recvfrom(s, msg, len, flags,\nNULL, NULL);\n```\n\n```\nint\
    \ recvfrom(int s, void *msg, int len, int flags,\n             struct sockaddr\
    \ *from, int *from_len);\n```\n\nThe first argument, s, specifies the socket to\
    \ receive data on; the next argument is a pointer to some memory in which to store\
    \ the data. This memory must be allocated beforehand, or your program will most\
    \ likely crash with a possible buffer overflow. Because this is a network socket,\
    \ a buffer overflow is a major problem because it could allow remote attackers\
    \ full access to the client PC.\n\nThe len argument is the size of the buffer\
    \ into which you want to receive data. The flags argument can be a combination\
    \ of the following predefined macros:\n\n| Macro Name | Description |\n| --- |\
    \ --- |\n| MSG_OOB | Receive out-of-bounds data. |\n| MSG_PEEK | Don't remove\
    \ the message from the queue; this macro can help find the amount of memory you\
    \ need to store the message in. |\n| MSG_WAITALL | This flag forces recv() to\
    \ block until the operation is completed. |\n| MSG_NOSIGNAL | This flag prevents\
    \ a signal from being generated in the event of a socket error. |\n\nThe final\
    \ two arguments, from and from_len, specify where to store the source details\
    \ and the size of the address details, respectively. Although the prototype claims\
    \ that you should use a structure of type sockaddr, you should use sockaddr_in\
    \ (as you when connecting) instead.\n\nOn success, recvfrom() returns the size\
    \ of the message received; it returns -1 on an error."
  merge: -1
  pgno: 210
