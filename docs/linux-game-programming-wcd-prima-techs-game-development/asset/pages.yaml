  md: "# PROBLEM SOLVING\n\nNot every AI system used in games relates to units. Some\
    \ AI systems are for games like chess or Tetris, which require a whole new school\
    \ of thought if they are to run efficiently. I'm going out to cover two of the\
    \ many methods used for these sorts of games, but there are many, many out there\
    \ in the great, wide world.\n\n# TRIAL AND ERROR\n\nEveryone in the world has\
    \ heard of the trial-and-error method (if not, is there room under your rock for\
    \ me?). The principle behind it is this: You try something, it doesn't work, so\
    \ you try something else. Couldn't be easier, now?\n\nJust about every form of\
    \ AI uses some form of trial and error, but there are specific uses for this method,\
    \ such as guessing games. Everyone has coded a 'what number are you thinking of?'\
    \ game (if you haven't, your rock must be getting crowded by now).\n\nIn the number-guessing\
    \ game, you have two variables: a minimum and a maximum number. Each time the\
    \ computer's guesses. If it is higher, the number guessed is stored in the minimum\
    \ variable, and if it's lower, the last number guessed is stored in the maximum\
    \ variable.\n\nFor the next number the computer will guess, it calculates the\
    \ mean average of the minimum and maximum variables ((min+max)/2). This concept\
    \ is used all sorts of search algorithms (when the search data is sorted, that\
    \ is), and this approach can zero-in on a number very quickly sometimes.\n\nThe\
    \ following code demonstrates the simple guessing game just described:\n```void\
    \ main(void) {\n    char high = 100, low = 0; guess:\n\n    puts(\"Think of a\
    \ number between 0 and 100.\");\n    while ((high - low) > 1)\n        guess =\
    \ ((low + high) / 2);\nn```"
