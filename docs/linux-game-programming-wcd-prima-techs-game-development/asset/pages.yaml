  md: '# SCENE GRAPHS


    Getting all of this together is a little complicated, but fortunately there are
    several OpenSource scene graph API libraries you can pick up or use rip apart
    and learn from. Probably the two most popular scene graph APIs for games for Linux
    right now are CrystalSpace and my own PLIB/SSG. Both are pre-installed on most
    complete Linux distributions and can be downloaded from the Web with source code
    if you prefer to get the absolute latest and greatest version. Each has a thriving
    newsgroup and developer community, so you''ll have someone you can ask for help.


    The general style of programming a scene graph API is different from the OpenGL
    approach, although most of these libraries use similar terminology and allow you
    to mix raw OpenGL and higher-level constructs.


    In PLIB/SSG for example, you construct your 3D scene as a class of C++ objects
    organized into a tree structure. The leaves of the tree contain polygons, lines,
    and points as pointers to structures constructing the OpenGL state elements. Leaf
    nodes are grouped into higher-level objects (branch nodes), which are grouped
    in yet higher-level objects until, at the root of the tree, is a node that contains
    the entire virtual world and all the information that''s needed to draw it.


    From that point on, the entire scene can be efficiently drawn with a single call
    to the scene graph API. For the game software to interact with this virtual world,
    you use various special nodes in the tree that allow objects or subobjects to
    be rotated or positioned within the scene. Other nodes allow you to automatically
    draw simpler versions of objects when they are further away so that you can save
    your precious polygon-generating capacity for drawing things. You can also select
    different versions of objects under program control so that you can have things
    look different after they''ve been destroyed or after a key has been turned in
    a lock.


    All of this flexibility allows the programmer concentrate on the higher-level
    aspects of game play, leaving it to the scene graph API to handle the ugly details
    of drawing the pictures.


    Let''s look at a simple example using PLIB/SSG graph. PLIB is a suite of portable
    game libraries designed to work well with OpenGL, SSG is a Simple Scene Graph.
    Because SSG works well with GLUT and relies on OpenGL behind the scenes, much
    of what follows should be familiar. This example is written in C++ because PLIB/SSG
    is a C++ library:


