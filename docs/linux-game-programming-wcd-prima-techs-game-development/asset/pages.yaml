  md: '# LINUX GAME PROGRAMMING


    This approach is fine when there is only one possible route to a single destination,
    but what if there is more than one route or more than one possible destination?


    # MODIFY THE TREE TO ACCOMMODATE MULTIPLE ROUTES


    To change the AI system so it can take into consideration more than one possible
    route, we need to modify our tree structure to allow for multiple routes. Change
    the tree definition to following:


    ```

    struct MapState {

    unsigned char nodeName;

    void *prev_node[4];

    int num_parents;

    };

    ```


    Adding new nodes gets slightly more complicated than adding a fixed size to store
    the previous node pointers. There are two possible ways to do this. The first
    is to use an array of a fixed size to store the previous node pointers. The second
    is to allocate the memory needed each time a node is added. The first way is the
    simplest because few systems will require more than a finite number of routes
    to get to a certain point.


    The following function demonstrates how to add a node to the tree:


    ```

    void AddNode(void *node, void *parent) {

    if ((struct MapState*)node)->num_parents == 4) return;

    ((struct MapState*)node)->prev_node[++->num_parents] = parent;

    }

    ```


    # SEARCH THE TREE


    Now we can construct a tree, how do we search it? This is where things get icky.
    The system will demonstrate now isn''t the best, but it''s the easiest to understand.
    The more complex your node tree,


    To search the list, we need a recursive function that searches all possible routes
    that the AI can take. We also need a history of nodes already searched (to avoid
    backtracking) as well as a current route. To do this, we will need two separate
    linked lists.'
