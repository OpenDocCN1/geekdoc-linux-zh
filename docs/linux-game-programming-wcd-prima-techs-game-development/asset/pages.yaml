    \ of retrieving the index page of a Web server located on the local machine (assuming\
    \ that you're running one on your Linux box).\n\n# RECEIVING DATA\n\nReceiving\
    \ data is slightly more complicated than sending data. Because you don't know\
    \ when data is ready to be received, and because the receive functions block the\
    \ current thread, you could run into some problems here. A solution to this snag\
    \ is to use the select() function, which is covered later in this chapter."
