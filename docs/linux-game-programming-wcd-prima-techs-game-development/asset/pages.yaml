  md: '# NEWSPAPERS


    Where would we be without updates on the industry? As well as the Web, many companies
    prefer to issue press releases to the traditional press before making the information
    available to Web sites. These newspapers sometimes have the news before the Net,
    and are vital resources for keeping an eye on the state of the industry.


    # COMPUTER TRADE WEEKLY


    CTW is filled to the brim with industry news, ranging from who hired who to what
    games retailers should be placing on the shelves. If you''re into the business
    side of game development, this newspaper is definitely for you. Free for developers
    in the United Kingdom.


    # MCV


    MCV is filled to the brim with industry news, ranging from who hired who to what
    games retailers should be placing on the shelves. If you''re into the business
    side of game development, this newspaper is definitely for you. Free for developers
    in the United Kingdom. (deja-vu?)


    # COMPUTER WEEKLY


    Computer Weekly is a weekly publication for the entire IT industry, not just games.
    Free to U.K. IT professionals, it has a decent job section covering both U.K.
    and international positions, with the occasional games-related job sneaking in.


    # COMPUTING


    Like Computer Weekly, Computing magazine is not strictly aimed at the games industry,
    but it does keep you up-to-date on the current state of the IT industry as a whole.
    It has the added bonus of being the only newspaper in the United Kingdom to feature
    a Dilbert comic strip every week.'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# NEWSGROUPS


    The best newsgroups are usually contained within the rec.games.* and comp.games.*
    groups. Note that many people prefer mailing lists to newsgroups because of the
    lack of spambots there. If you''re interested in finding out what the enemy is
    working on, a useful group is ms.directx.*, which discusses many things about
    just about every aspect of the games industry.


    # MAILING LISTS


    The obvious mailing list you should belong to is the LGDC mailing list (http://sunsite.auc.dk).
    This list tends to be very quiet at times and very busy at others (especially
    when my ex-employer''s mail starts flooding it).


    Indrema and ColabNET also run a few Indrema-related lists for various subjects,
    ranging from the Indrema-specific certification discussions to a list for getting
    groups of developers together for working on common ideas. You can subscribe to
    all of these lists at the IDN Web site (http://idn.indrema.com).'
  merge: -1
