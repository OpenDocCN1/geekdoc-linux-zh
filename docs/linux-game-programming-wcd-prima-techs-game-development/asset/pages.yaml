  md: '# INTRODUCTION TO GAME DEVELOPMENT


    The OpenSource route also means that you''ll have a larger number of testers working
    for free. This approach can speed up the development process dramatically and
    might even mean that your game will be ported to other operating systems by third
    parties.


    Many people claim that it is impossible to make any money out of OpenSource software,
    Companies such as RedHat and SuSE have made a huge success out distributing OpenSource
    by offering support and printed manuals.


    The first step in releasing an OpenSource project is to make it publicly, including
    the source code. After you have made it possible for everyone to get your program,
    make an announcement on a few mailing lists and sites such as Freshment (http://freshment.net).


    ```

    FRESHMENT: http://freshment.net.

    ```


    > Make sure that you don''t choose a license just because everyone else is using
    it. Read through several licenses (printed versions which can be found in the
    back of this book) and choose the one you agree with the most.


    After you have made your announcement, expect input from users within a very short
    period of time. Some may have patches, others may have critics, and others may
    need help using your game. It is good practice in the OpenSource community to
    reply to all-mail messages you receive regarding the product; doing so will win
    you a name for yourself in the OpenSource community.


    # COMMERCIAL GAMES


    Many developers have realized that Linux is a viable option for commercial software,
    including games. Companies such as Loki have made a name for themselves by portant
    successful games; others companies as Epic (Unreal) are also starting to develop
    games specifically for Linux machines.


    Getting a game published commercially is not the easiest thing to do, especially
    for the Linux platform. The process is long and complicated, involving several
    contracts, NDAs (Non-Disclosure Agreements), and tough milestones. However, the
    rewards outweigh the costs. Cash advances, high royalties, and fame encourage
    many independent developers to strive for bigger, better, and faster games.


    To publish, you must first approach a publisher. Look around at your Electronics
    Boutique to see what publishers are out there. Names and addresses of publishers
    appear on the packaging of the products you''ll see. Electronic Arts have in-house
    development teams and refuse unsolicited submissions. Look for companies that
    publish games from a wide range of developers, such as GT Interactive and ActVision.
    When you have determined who you want to publish your game, request a submission
    pack from the publisher. This packet will contain an NDA, which protects all parties
    involved in any legal problems that may arise (for example, plagiarism).'
