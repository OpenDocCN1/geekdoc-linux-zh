- img_proc: true
  md: '# GLOSSARY


    # 309


    # E


    **Eric S. Raymond.** Founder of OpenSource.org and acknowledged guru of the OpenSource
    movement.


    # F


    **Free Software Foundation.** An organization to promote the use of free software
    (specifically the GNU licenses).


    **FreeBSD.** *See* BSD.


    **Freshmeat.** A directory of software for Linux, located at **http://www.freshmeat.net.**


    # G


    **GameDev.Net.** An online reference for game developers of all levels, located
    at **http://www.gamedev.net.**


    **GDNet.** *See* GameDev.Net.


    **GNU Public License.** The most widely used OpenSource license. Commonly referred
    to as the GPL.


    # H


    **HSR (Hidden Surface Removal).** A technique used in 3D graphics to work out
    what needs to be drawn.


    **HUD.** Heads-up display.


    # I


    **IDN (Indrema Developer Network).** A resource for people interested in Indrema
    development, located at **http://idn.indrema.com.**


    **IES (Indrema Entertainment Systems).** Creators of the Linux-powered L600 console.


    **Indrema.** *See* IES.'
