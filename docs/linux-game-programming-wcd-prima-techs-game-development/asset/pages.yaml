  md: '# COMPILING THE SAMPLE


    We''ve finally completed our simple OpenAL application; now we can compile it.
    Use the following gcc command line to do this:


    ```

    gcc -Wall -L/usr/local/lib -I/usr/local/include -lal \

    -o almodel.c

    ```


    > The OpenAL libraries install to /usr/local/lib and /usr/local/include by default.
    If you installed them to a different directory, you will have to replace these
    values with the location to which you installed them.


    # ADVANCED OPENAL


    Now that we have covered the basics of OpenAL, we can start looking at some of
    the more advanced features, such as reverb and Doppler shift. Because it is a
    complete 3D sound library, OpenAL has more capabilities than you can shake a big
    stick with pointy bits.


    # VOLUME CONTROL


    The first "advanced" OpenAL feature we''re going to look at isn''t really that
    advanced; it''s volume control.


    Because different sources may require different levels of volume in the game (a
    silenced machine gun, or example), OpenAL provides the functionality to give each
    source a different volume. You can also control the volume of the listener itself.


    If you''ve ever played around with "real" audio equipment, you may have noticed
    a gain knob that affects the amplification of the sound. OpenAL uses a similar
    pre-amplification gain control to alter the volume of music.'
