    # CREATING SOUND SOURCES


    Now that we''ve loaded a sound sample into a buffer, we have to create the sound
    source that will be playing the sound. The sound sources are created in similar
    manner to listeners, but the functions (there are more than one this time) are
    called alSourcefv() and alSourcei(). Before you can define the position of the
    source, however, you must first generate the source. The function alGenSources()
    does this for you.


    ALAPI void ALAPIENTRY alGenSources(AlUint n, AlUint *sources);


    The first argument, n, is the number of sources you want to create. The second
    and final argument is an array containing the source identifiers you want to use.
    In our example program, we need only one source.


    After you have generated the source, you must define the position of the source
    using the same method you used to set up the listener. In addition to setting
    up the position, direction, and velocity of the sound source, you must also specify
    which sound buffer the source will be playing. This is defined by the AL_BUFFER
    property.


    Add the following code to the sample program after we load the sound file to generate
    the single sound source:


    ```

    // Generate a single source

    alGenSources(1, &source);

    ```


    ```

    // Set up the source details

    alSourcei(source, AL_BUFFER, sound_buffer);

    alSourcei(source, AL_SOUND_LOOPING, AL_FALSE);

    alSourcefv(source, AL_POSITION, source_position);

    alSource3v(source, AL_VELOCITY, 0.0f, 0.0f, 0.0f);

    ```'
