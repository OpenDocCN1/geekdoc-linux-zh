  md: '# 3D GRAPHICS FOR LINUX GAMES 97


    A 4x4 matrix can combine any number of transformations applied in any order. OpenGL
    represents matrices as a single-dimension 16-element array—which is a little curious
    since they are universally written down as a 4x4-dimensional array of numbers.
    The order of the matrix elements in an OpenGL matrix array is shown here:


    ```

    0  4  8  12

    1  5  9  13

    2  6  10 14

    3  7  11 15

    ```


    OpenGL uses the idea of a "current" matrix (well, actually three current matrices),
    which is automatically applied to every vertex before it is used to draw something.
    This means that once you''ve set up these 16 numbers, everything you draw from
    that point on can be transformed for no extra cost.


    Better still, each of the current matrices is actually the top element of a stack
    of matrices that you can push or pop. OpenGL commands multiply matrices together—which
    has the effect of combining them. You can also use handy routines to create matrices
    that rotate, translate, or scale; each of these routines operates on the matrix
    at the top of the stack. Here are the utility routines with which you will want
    to make:


    +   glPushMatrix();

    glPopMatrix();

    glClearMatrix(float matrix [ 16 ] );

    glClearIdentity();

    glMultMatrix(float x, float y, float z);

    glTranslate(float x, float y, float z);

    glRotate(float angle, float x, float y, float z);

    glScale(float x, float y, float z);


    Most of these routines are named to make their functionality obvious: The glRotate
    creates a matrix that rotates around a line from the origin to the point (specified
    by x, y, and z), through the specified angle and multiplies it by the current
    matrix (the one on top of the stack). The glTranslate() and glScale() commands
    are similar.


    glClearMatrix() and glIdentity() replace the matrix on the top of the stack with
    the matrix or a "do nothing" matrix, respectively. The identity matrix is a "do
    nothing" operation; therefore, glIdentity() is a handy way to reset the current
    matrix.


    Be careful with the matrix push and pop commands; the OpenGL matrix stacks are
    often quite small (16 is a common maximum number).


    If you add the following lines to our rapidly growing sample program, the tetrahedron
    will rotate by one degree every time it is redrawn. (This version of the program
    is ex3.c on the CD-ROM that accompanies you.)'
