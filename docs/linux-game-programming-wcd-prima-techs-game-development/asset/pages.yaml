    float length = sqrt ( x * x + y * y + z * z );

    float one_over_length = 1.0f / length;

    x *= one_over_length;

    y *= one_over_length;

    z *= one_over_length;

    ```


    Now you know the most common 3D mathematical operations; almost all 3D algorithms
    use these operations in various combinations.


    # # USING BILLBOARDS TO SIMULATE 3D


    In many games, you need to draw very complex objects such as trees, to represent
    accurately in 3D, would require thousands or millions of polygons. (Did you know
    a typical European Oak tree has more than a half-million leaves?) Even with the
    wonders of modern 3D graphics hardware, it would be while before you could draw
    every single tree as a 3D object.


    The usual graphical trick to get this is to paint a 2D picture (or photograph)
    of a tree into a texture map and set the parts of the map that are not part of
    the tree to be fully transparent. This single-texture map can then be applied
    to a single polygon—and as long as you don''t look closely, you''ll see a tree!


    The snag is that it''s really only a cardboard cutout of a tree: If you walk around
    it, the 2D nature of the tree will be obvious. Therefore, we have to rotate the
    tree to face the camera, so that no matter you stand, you see the same picture
    of a tree.


    You can do this by calculating the position of the tree and the position of the
    camera and applying a glRotate() command, but there is an easier way. Because
    OpenGL keeps the camera at (0,0,0), you really have to do something facing the
    camera is model it in the X,Y plane and avoid rotating the model at all.


    That''s easier than done because by the time we get to render the tree, we''ll
    have the OpenGL matrix stacked piled high with transformations that deal with
    the position of the camera relative to the world and so on. One way to deal with
    that is to ask OpenGL what the current rotation matrix is and then erase the rotation
    part of matrix when we render the tree:'
