  md: 'SDL_Joystick *SDL_JoystickOpen(int index);


    The SDL_JoystickOpen() function opens a joystick and returns a pointer to a structure
    that stores information about the joystick. You should save the returned structure
    pointer because you''ll need it when closing the joystick. The joystick you want
    to open is specified with the Index parameter (0 being the first joystick, 1 being
    the second, and so on). The Index is a very important value because it is used
    by the event structure to identify which joystick generated the event. When you
    are finished using a joystick, it''s good practice to close it by passing the
    SDL_Joystick structure returned by SDL_JoystickClose().


    Having an open joystick isn''t much good if you don''t know anything about it,
    is it it? SDL provides several functions for getting the name of a joystick, as
    well as getting the number of axes, buttons, hats, and balls available. These
    functions are the following:


    ```

    const char *SDL_JoystickName(int index)

    ```


    ```

    int SDL_JoystickNumAxes(SDL_Joystick *joystick)

    ```


    ```

    int SDL_JoystickNumButtons(SDL_Joystick *joystick)

    ```


    ```

    int SDL_JoystickNumHats(SDL_Joystick *joystick)

    ```


    ```

    int SDL_JoystickNumBalls(SDL_Joystick *joystick)

    ```


    The function of these five functions is simple and is clearly explained in the
    SDL documentation. You will use these functions in some later sample listings.


    By default, the SDL event queue does not gather events from opened joysticks,
    you must explicitly instruct the queue to do so with the call SDL_JoystickEventState(SDL_ENABLE).
    Without this call, you can only poll the joystick for input.


    The four joystick-related event structures all have a similar layout, as you can
    see in these structure prototypes:


    ```

    typedef struct {

    Uint8 type;

    Uint8 which;

    Uint8 axis;

    Uint16 value;

    SDL_JoyAxisEvent;

    };

    ```


    ```

    typedef struct {

    Uint8 type;

    Uint8 which;

    Uint8 button;

    Uint8 state;

    SDL_JoyButtonEvent;

    };

    ```


    ![](img/8827e679048b592dad186c600299f274_112_0.png)'
