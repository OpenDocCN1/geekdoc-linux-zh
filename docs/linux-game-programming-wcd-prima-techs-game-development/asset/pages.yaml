    # THE GL_COLOR_MATERIAL OPTION


    This option is related to the GL_LIGHTING flag; it allows you to continue to use
    glColor() commands to

    set some aspects of the color of objects even when GL_LIGHTING is turned on. More
    about this later in

    this chapter.


    # THE GL_BLEND OPTION


    There is a version of the glColor() command called glColor4f() that adds a fourth
    component to the

    three standard color components of red, green, and blue. This fourth component,
    the Alpha compos-

    ent, is a measure of opacity. If Alpha is 1.0, the object is utterly opaque (which
    is

    default in glColor3f() calls); if Alpha is 0.0, the object is utterly transparent.
    Values between 0.0 and

    1.0 are used to define varying degrees of transparency between these extremes.


    However, for transparency to work correctly, you''ll need to tell OpenGL to blend
    the color of the poly-

    go into the background. That is what enabling GL_BLEND does. Transparency is a
    subject we''ll come

    back to later.


    # THE GL_ALPHA_TEST OPTION


    Once you start rendering with the Alpha component (to permit transparency), you''ll
    want to

    avoid drawing completely transparent pixels—or perhaps pixels that are almost
    completely trans-

    parent. We''ll talk more about this flag in the “Transparency and the Alpha Component”
    section, later

    in this chapter.


    # THE GL_DEPTH_TEST OPTION


    This option we''ve already seen; it allows you to turn down depth testing on and
    off. Generally, you’ll

    want it enabled all the time, although you might want to turn it off when you’re
    rendering scores-

    power-ups, and so on that you want to appear onscreen in front of everything else.'
