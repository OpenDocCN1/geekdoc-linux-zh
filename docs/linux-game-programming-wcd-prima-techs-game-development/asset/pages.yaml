    OpenGL uses a default 3D coordinate system in which X and Y are the plane of the
    screen with the origin in the middle (like a 2D coordinate system); Z decreases
    (becomes increasingly negative) as things move further "into" the screen (where
    some vertices have negative Z values). (So if you are good at visualizing things
    in three dimensions, you''ll see that this is a tetrahedron with its point facing
    us.)


    Another important thing to know is that OpenGL is very picky about what commands
    it allows you to use between glBegin() and glEnd() calls. Only the following commands
    (and a handful of other obscure calls) are allowed:


    +   - glVertex()

    - glColor()

    - glNormal()

    - glTexCoordCoord()

