    | --- | --- |\n| Immelman | Pull back on the stick to fly inverted, then rotate\
    \ the aircraft 180 degrees. |\n| Scissors | Fly downward while in a barrel roll.\
    \ |\n| Inverted scissors | Similar to Scissors tactic, but performed while flying\
