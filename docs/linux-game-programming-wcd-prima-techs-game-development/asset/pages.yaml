  md: '# LINUX GAME PROGRAMMING


    Here''s how the idea works: In a turn-based game, there are two objectives. The
    first is to maximize your score, and the second is to keep your opponent''s score
    as low as possible. Although the first objective requires very little thought,
    the second requires some planning to predict what possible moves the other player
    can take.


    Figure 10.2 shows the first few moves you take in a tic-tac-toe game. By the time
