- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    This development model is like religion in many ways: Priests or ministers tell
    people what a particular god says, and the "little people" (that is, the people
    who pay the leaders'' wages) must do what they''re told. Although this is a mildly
    cynical view of both religion and software, it sums up a large percentage of the
    commercial software industry pretty well. How often has a vendor actually listened
    to your recommendations and acted on them?


    # THE BAZAAR


    A bazaar is an open marketplace, bustling with people haggling over prices and
    lined with stalls set up and run by anyone who has something to sell. Trading
    places between the stalls, there is a sense of an informal community about the
    place. People get to know other people''s names, and friendships are formed.


    If you replace the marketplace image with the Internet, and the goods and services
    being sold with various gloss of source code, you should be able to see the relevance
    of the bazaar model when it comes to OpenSource. (Don''t worry, I don''t get 100
    percent either.) OpenSource works like this: you someone your code for free; in
    return, they make some modifications, test it, or spread the word about it, bringing
    in more users and developers to help the project.


    A large part of the OpenSource community is the word of mouth aspect. With sites
    Freshmeat and (heaven forbid) Slashdot offering daily coverage of changes to the
    ever-growing world of Linux, the word of mouth is very, very easy to find. Without
    it, people wouldn''t have heard of projects such as The GIMP and the XFree86 project.
    By linking from various Web sites, people are finding out about these projects
    and joining the development teams to fill the holes that may appear in the ware.


    In addition to the development advantages offered by the OpenSource community,
    free access to the software also helps an army of testers. If you display your
    contact address in some obvious location in your software, you can be guaranteed
    to get bug reports in no time flat (that is as you will).


    All the community aspects of OpenSource can help create high-quality software.
    Although this "community development" takes some time in many cases, more than
    not, the effort is worth it. Take takes a look at the FreeCiv project for example.
    When I first tried that game, if you''ll pardon my French, merci. When I tried
    again about a year later, it was still bad. But a few months after that, things
    started improving. Developers started communicating, or a new hot-shot rookie
    with brilliant skills had joined the team, because something was better, and that
    made the game actually enjoyable.


