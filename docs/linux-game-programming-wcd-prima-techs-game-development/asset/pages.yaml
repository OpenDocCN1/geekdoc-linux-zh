    be more, but my paper isn''t that big). In the first option, the Os are playing
    defensively; in option 3, the Os are playing more aggressive-(in option 2, the
    Os are being completely stupid). If we were to give each option a score between
    1 and 3 (3 being the highest), option 1 (the Os blocked the opponent as well as
    positioned themselves for possible victory in a single move). Option 2 would score
    a 1 (the opponent can win in the next turn), and option 3 would score a 2 (the
    Os have a chance of winning in the next turn if the opponent is a complete idiot.


    Figure 10.2


