  md: '# LINUX GAME PROGRAMMING


    Clearly, OpenGL is itself already doing these kinds of texts, but it is forced
    by the nature of its API to test every single vertex of every triangle to see
    whether the triangle is on the screen or not. Inside your application, however,
    you can test objects with a simple test and out thousands of polygons without
    even looking closely at them. One way to do that is to store a bounding box or
    bounding sphere that tightly encloses each of the objects in your 3D scene and
    just test those simple shapes against the field of view. You can test a sphere
    against the field of view with just a handful of operations (it’s even faster
    than testing a single triangle). This is why it makes sense to “cull the scene
    before you pass anything on to OpenGL.


    Scene graph APIs open the 3D scene in a tree structure; a bounding sphere (or
    cube) at node surrounds all the polygons that are in that node. Thus, a space
    game might have a bounding sphere around each spacecraft model; that sphere would
    contain number of subobjects (the engine, the weapons, the cockpit and so on),
    each of which would have its own bounding sphere. With one test, the scene graph
    API can cull the entire spaceship if it’s not anywhere close to being onscreen;
    alternatively, it can draw the spacecraft unconditionally if the entire bounding
    sphere is clearly onscreen. If the bounding sphere lies part inside and part outside
    the field of view, the API can look at each of the spaceship in turn, accepting
    or rejecting each group of polygons as it comes to it.


    # STATE MANAGEMENT


    Another aspect of OpenGL that needs careful attention if you want the best performance
    is state management. As you saw in the last chapter, you can have a significant
    number of calls to glEnable() or glDisable()—along with glMaterial(), glBindTexture(),
    and other functions that have to be set up before you draw a triangle. It’s tempting
    to run through all of the things that a triangle needs, and to set them before
    you do the glBegin() and glEnd() sequence. However, these changes take time to
    execute—and sometimes a relatively innocuous change can have a horizontal impact
    on performance.


    There are two things you can do about this: First, you can perform “lazy” state
    changes, making changes only when you absolutely have to. If two consecutive groups
    of polygons have the same glMaterial() and glBindTexture() needs, you can test
    for this and avoid repeating those calls unnecessarily. Second, you can even go
    so far as sort your polygons into groups that share the same textures, material
    settings, and so much that they are all drawn together, requiring fewer state
    changes.


    ![](img/8827e679048b592dad186c600299f274_167_0.png)'
