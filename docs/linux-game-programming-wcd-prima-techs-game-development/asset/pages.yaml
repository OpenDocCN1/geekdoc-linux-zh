  md: '# LINUX GAME PROGRAMMING


    ALSA (Advanced Linux Sound Architecture). A set of sound drivers for Linux that
    supports OSS emu-lation.


    BeOs. A multimedia operating system.


    Blender. A freeware 3D modeling and visualization package; the latest version
    includes a game engine.


    BSD. A version of UNIX distributed under the BSD license.


    BSD Sockets. A TCP/IP programming API.


    Client. A program that connects to a server. A game running under X Windows is
    an example of a client program.


    Console. a) The text mode interface on Linux. b) A home entertainment system.


    Copyleft. An alternative to traditional copyright. It is associated with lower
    restrictions on redistribu-tion. Also a vendor of Linux T-shirts and other related
    merchandise.


    CVS (Concurrency Versioning System). A system that enables users to share and
    edit source.


    Debian HURD. A UNIX-like system, similar to Linux, which uses a modularized microkernel
    instead of a monolithic kernel.


    DRM (Digital Rights Management). A system designed to prevent software piracy
    on the Indrema L600 console.


    DV Linux. A special distribution of Linux designed to make sure that Indrema games
    run on a stan-dard Linux box running DV Linux.'
  merge: -1
