    > NOTE There are other options you can use with the glTexParameteri() function
    that might be appropriate for older graphics cards if you want to trade quality
    for speed. For more details, check the OpenGL FAQ at http://www.opengl.org.


    # APPLYING TEXTURE


    One issue with applying the defined texture to your objects is that the glBindTexture()
    cannot be made between calls to glBegin() and gl(). This rule means that the things
    between two commands must use the same texture map.

    Another is to decide how the texture should be oriented on each face of your object.
    OpenGL provides another of per-vertex colors—similar to glNormal() and glColor()—that
    sets the texture coordinate. After a texture map has been loaded, OpenGL considers
    it to have coordinates that run from 0 to 1, with the bottom-left corner. We are
    already using the letters X and Y to refer to the vertex coordinates, OpenGL uses
    S and T to refer to the horizontal and vertical axes for the texture map. Some
    programmers use U and V for the same reason to be aware of when discussing this
    in point mailing and lists.

    Each vertex of a polygon can have a separate texture coordinate, and OpenGL interpolates
    between those coordinates to find the texture coordinate of each screen pixel—and
    where the texel is drawn at that point. This arrangement gives you a lot of power:
    you can stretch, shear, rotate, or translate the texture in any combination before
    gluing it onto the model. More powerful than that, you do not have to restrict
    yourself to texture coordinates in the range 0..1. If you use coordinates outside
    that range, OpenGL can either clamp or wrap the coordinate (by taking it 1.0).
    In the first case, the map''s edges are repeated if you map areas outside 0..1
    onto the polygon. In the second case, the map repeats as often as necessary to
    cover the polygon. You can even make the map repeat in one direction and clamp
    the other.

    For the S direction, you can set the treatment of the texture to either clamp
    or wrap with a call to one of the following functions:


    ```

    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP );

    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_REPEAT);

    ```'
