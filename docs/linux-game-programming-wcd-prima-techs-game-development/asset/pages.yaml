    }\n```\n\n# JOYSTICK EVENTS\n\nIf you thought the two keyboard structures and\
    \ the mouse structures were hard work, then you'll love working with joystick\
    \ events. There are a total of four joystick event structures—but don't worry,\
    \ they are all very similar. When you understand their similarities, understanding\
    \ their differences is easy. However, before we explore the joystick event structures,\
    \ we must understand the one thing that makes joysticks different from keyboards\
    \ and mice. A joystick is not considered to be a compulsory device. The SDL_INIT_JOYSTICK\
    \ flag must be passed to SDL_Init to enable its joystick subsystem. SDL assumes\
    \ there is only one keyboard and one mouse connected to a system, but it understands\
    \ that there may be, and often, more than one joystick connected to a system.\
    \ Because of this, you must specify which joysticks are to be used; of course,\
    \ SDL provides functions to allow you to do this.\n\n```\nint SDL_NumJoysticks(void);\n\
    ```\n\nThe SDL_NumJoysticks() function should always be the first step you take\
    \ when working with joysticks. It returns the number of joysticks connected to\
    \ the system. If it returns 0, there's no point trying to open any joysticks because\
    \ there are none there.\n\n![](img/8827e679048b592dad186c600299f274_111_0.png)"
