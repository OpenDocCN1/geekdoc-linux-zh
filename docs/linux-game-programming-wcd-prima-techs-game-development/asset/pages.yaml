  md: '# LINUX GAME PROGRAMMING


    The limited license is common in many areas. It allows amateur developers with
    little skill to use the engine to practice game development without spending months
    writing their own 3D engines or spending a few million on a commercial engine.
    The limited license allows them to focus on other aspects of game development,
    such as improving the game''s artificial intelligence or just creating a good
    game in. If the amateur game is of commercial quality, and the programmer decides
    to sell it, then the license will force royalty payments or lump sums to be paid
    to the developers of the original engine.


    This philosophy is perfect in today''s world. Commercial entities that have the
    means to pay for that software and don''t want the legal hassle of doing anything
    to break the contract (license) supplied with the engine. Amateur developers who
    don''t have the means to develop commercial-quality software are still free to
    use the engine, and even to redistribute their products, as long as it isn''t
    for profit.


    # KEY TECHNOLOGIES


    Another option when it comes to games is to keep the actual game logic closed,
    OpenSource the surrounding technologies, such as sound and 3D engines. This option
    allows people to learn from your systems and use them to make their own games,
    keeping their game unique.


    Alternatively, you can OpenSource the game logic itself, while keeping the engine
    closed. (This method requires a bit of work because any changes to the logic must
    be compiled against the engine.) One method of doing this is to dynamically link
    the game logic at run time, as is done with Quake II, using a shared library and
    a predefined interface for the functions. Although this method isn''t strictly
    OpenSource, it does allow people to create patches for the game.


    Continuing on this theme, you may want to create a separate scripting language
    for your game, or a C library that gives you access to any language, such as Python.
    This method allows you to OpenSource the logic (so that others can create patches
    and the like) while keeping your development time to a minimum. This does have
    a slight impact on performance, depending on the language used, but just everything
    else in programming anywhere.


    # THE INDREMA DEBATE


    Recently (in December 2000), a question was raised on one of the Indrema mailing
    lists regarding how the certification program (which, Indrema Entertainment Systems
    requires all programs that run on the console to participate in) would affect
    the testing of OpenSource software. Traditionally, anyone can help test an OpenSource
    product, but the certification program prevents this free testing from happening
    in the usual way.'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'The certification program works like this: You pay a fee to sign a binary file
    that says the program is allowed to run on the Indrema system. Without this digital
    signature, a program won''t run on the console. This system allows Indrema to
    recover the money it lost selling the console at a loss.


    Like all consoles, Indrema has a development kit (at a higher price compared to
    the console) that can run uncertified games so people can test the games as they
    write them. The question about how to get testing done before the game is submitted
    to the certification process caused much conflict between OpenSource developers
    and Indrema.


    Several ideas were raised, from big red warnings saying that the game is uncertified
    to a time-share system for the development kits—and everything in between.


    The real problem is that the OpenSource bazaar model is not compatible with console
    development as it stands today. People need to rethink the whole process before
    a solution that everyone is happy with be found. The following sections present
    some of the ideas raised during the debate.


    # # BIG RED WARNING


    One of the first ideas in resolving the conflict between OpenSource and the Indrema
    certification system was to allow games to "semicertified" for free while they
    were in development. This approach would allow people to download the game and
    report bugs back to the author. When the game ran, a big red warning screen would
    appear, saying that the game was not yet certified and that Indrema wouldn''t
    be held responsible for any incompatibilities with the console.


    This suggestion presented several problems for Indrema, the biggest being that
    no one actually pay for full certification if you could get it for free, albeit
    at the expense of a warning screen (but that wouldn''t put most people playing
    the game). There was also the problem of malicious codes. Because the game would
    be in development, the microcertificate wouldn''t be able to be tied to a single
    binary and the binary file would be subject to change. A checksum of the binary
    would have to be regenerated every time the program was compiled. This constant
    checksum could allow anyone to write a trojan that could cause irreparable damage
    to the end-user''s console.


    At the time I am writing, many people still think this is one of the better ideas
    proposed during the debate.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    # EMULATORS


    My contribution to the debate was for Indra to develop an emulator for the console
    that could run uncertified games. The emulator wouldn''t run on the console itself
    because that would allow people to use it to play uncertified games.


    There are several potential problems with this solution. NTSC and PAL output systems
    are not the same as those of a normal monitor, and these systems would have to
    be emulated as well. Televisions can also warp the picture, making color bleed
    hard to simulate accurately. Emulation of the console would therefore give an
    inaccurate representation of the game.


    The problem is, the game logic itself can be tested using a normal PC running
    Linux. The only reason an actual console is needed is to test interface glitches,
    such as warping by televisions or color bleeding that causes severe problems.
    These are the sorts of things that can''t be emulated.


    # TIME-SHARE


    One of the suggestions from Indra''s PR representative was to form developer groups
    that could share the development kits. Although this solution would work if the
    developers were all located in the same geographic area, this is seldom the case.
    This method also failed to address the problem of testers, who would still need
    access to the development kits to test the uncertified titles.


    # REGISTERED TESTERS


    Another suggestion was to allow a number of testers to run uncertified games on
    their standard home consoles by having a central database that the DRM (Digital
    Rights Management) engine would refer to when trying to load an uncertified game.


    Although this suggestion puts a limit on the number of testers available, it does
    help ensure a higher quality of testers because the people registered as testers
    would have tested other Indra games before, and therefore have experience in dealing
    with bug reports and the like.


    # THE SOLUTION


    Currently, Indra is looking at the first method, a self-certification system that
    would allow developers and testers to create a time-limited certificate to allow
    people to run the software without going through the full certification process.


    The terms of usage would prevent people from sharing the mini-certificates but
    would allow developers to release the code and the binaries (as long as they are
    uncertified). At the time I am writing, it looks like this is the method Indra
    is planning to use to keep everyone happy.'
