  md: '# GLOSSARY 311


    OpenAL (OpenSource Audio Library). An OpenGL-based sound API by Loki.


    OpenBSD. See BSD.


    OpenGL. A 3D graphics API originally created by SGI. It is available for just
    about every operating system.


    OpenLobby. An OpenSource lobbying API for games.


    OpenSource. A software distribution model that encourages the sharing of source
    code, knowledge, and skills.


    OSS (Open Sound System). A sound driver for Linux.


    Pretty Poly. An OpenSource modeling package.


    Quake. The first next-generation, 3D, first-person, shoot-em-up game. Quake is
    now OpenSourced under the GNU Public License.


    Richard M. Stallman. Founder of the GNU Project and head of the Free Software
    Foundation.


    SDL (Simple DirectMedia Layer). A DirectX-like API that runs on various platforms,
    including Linux, BeOS, and Win32.


    Server. A program to which a client connects. An X Windows server is an example
    of a server.


    SourceForge. An online source repository for OpenSource projects, located at http://www.sourceforge.net.


    SVGALib. A console graphics library.'
