  md: '# GROUPING


    When dealing with more than one AI opponent, it would be nice if those opponents
    actually used some form of tactic or strategy when attacking. For example, it
    would be very cool in Quake the zombies actually had a formation when they were
    throwing their limbs at instead of standing in a nice straight line, waiting for
    your stream of rockets to hit them. This is where grouping comes into play (not
    grouping, pervert). Although many games get by without any intelligent tactics,
    the more games behave a little better.


    A good example of a grouping system can be seen when dealing with archers in god
    ol medieval England. There were basically two formations they used: One to stand
    in a straight line, firing volley after the incoming enemy; the other formation
    was a diamond, in which pikemen were ready to take care of any inconvenient horseman
    who was stupid enough to attack.


    Unfortunately, grouping varies from game to game, so I can''t give you any code
    samples in this section, but I will explain how the concept works.


    Imagine that you have a soccer team with several possible tactics (5-3-3, 4-4-3,
    3-4-4, and so on). Each player on the pitch has an assigned position (defender,
    left-midfield, right-midfield, and so on). Under different conditions, each player
    uses a different tactic to reflect the current state of play (attack or defense).


    By using a two-state logic system, we can switch the grouping players depending
    on whether they are attacking or defending. For example, each defender has two
    positions: one toward the halfway line for attack, and one near the goal for defense.
    Keeping track of the goal of the current state of play (which half of the field
    is in and which team has the ball) is a relatively trivial task. By storing positions
    for each of the possible states, you can group the players depending on the current
    state of play. This logic isn''t limited to a soccer pitch with fixed positions.
    Instead of soccer players, you have a unit of troops with an assigned leader,
    the positions of the troops could be relative to the leader. If you are attacking,
    you stand in a line moving forward; if you''re defending, you crawl away from
    the enemy. Although this method of grouping may seem obvious, you''d be surprised
    at the number of email messages I''ve received asking him how to do that sort
    of thing.


    ![](img/8827e679048b592dad186c600299f274_236_0.png)'
