    You can download the SDL from http://www.libsdl.org. Features in the SDL include
    video, sound, threads, and event management, as well as CD-Audio. These features
    are accessible through a DirectX-like API, making it very simple library to use
    if you are an Windows programmer. KDev documentation for the SDL can be found
    at http://www.libsdl.org, which will prove invaluable if you choose to develop
    your games under it.


    SDL LIBRARY: http://www.libsdl.org


    # OPENGL


    OpenGL is the most used 3D graphics API on any platform, originally created by
    SGI. Because it is available for the Windows, Linux, and MacOS platforms, using
    OpenGL in your games will make porting to another platform a walk in the park.


    An OpenGL implementation for Linux, called MesaGL, can be downloaded from http://mesa3.sourceforge.net.
    MesaGL supports a growing number of 3D accelerators as well as software rendering
    (for those of us without high-end video cards). The list of supported hardware
    is constantly growing, and with hardware developers as nvidia now taking an interest
    in Linux, more stable drivers are also coming on the market.


    MESAGL: http://mesa3.sourceforge.net


    # LIBX11


    If you are not a bit of masochism now and, you might want to program your games
    using the libX11 library. If you want to skip functionality that higher-level
    APIs provide, the libX11 library makes you handle every aspect of the code yourself,
    from displaying the window to writing event managers.


    However, the library allows you to do some things that other APIs don''t, such
    as changing the screen resolution (you now change color depth with XFree86 4,
    which also incorporates GLX). Also, if you plan on working with OpenGL, using
    libX11 may be a more suitable choice than any of the other libraries because OpenGL
    requires you to provide some details about the window that other APIs supply.


    # OTHER LIBRARIES


    There are other libraries out there, such as Crystal Space and ClanLib, as well
    as the traditional game library SVGlib. Although these are not used as much as
    the SDL, OpenGL, and libX11 libraries just described, some OpenSource developers
    will convince you to use them. Some of these libraries act as wrappers to lower-level
    libraries, while others interface with the hardware directly.


