    We have been talking about alpha components in glColor() and glMaterial() and
    inside texture maps, but the alpha component doesn''t do anything. Transparency,
    like most OpenGL effects, is disabled by default. To enable the alpha channel
    and permit transparencies to invade your images, make calls to the following functions:


    ```

    glEnable( GL_BLEND );

