    \ these input\n  nw1 = w1 - (i1 * 0.2)\n  nw2 = w2 - (i2 * 0.2)\n  nw3 = w3 -\
    \ (i3 * 0.2)\n  nw4 = w4 - (i4 * 0.2)\n```\n\n```\nend\n```"
