    After the scene is cleared, the process of drawing the scene requires just one
    SSG call: ssgCullAndDraw() walks through the scene graph, drawing just those parts
    of the scene that appear on-screen.


    SSG is a part of a larger suite of graphics and sound libraries that includes
    code to load and draw fonts and to create simple graphical interfaces, all using
    OpenGL.


    A full discussion of SSG (or any other scene graph for that matter) would fill
