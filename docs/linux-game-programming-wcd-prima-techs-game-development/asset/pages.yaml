  md: "# sendto() FUNCTION\n\nIf you are using a UDP socket (a TCP socket like if\
    \ you the added hassle of the extra sendto parameters), you can't use send() to\
    \ send data. You have to use sendto() instead.\n\n```\nint sendto(int s, void\
    \ *msg, int len,\n    struct sockaddr *to, int len, unsigned int flags);\n```\n\
    \nThe extra two arguments, to and len, specify the destination address of the\
    \ message being sent. This information is presented in the same format as the\
    \ address you used when calling connect(); you can reuse it.\n\nIf you are writing\
    \ a UDP server that maintains connections, you should keep a list of connected\
    \ clients and refer to that when sending them data. Alternatively, you can give\
    \ each separate client its own thread (explained later in this chapter).\n\n#\
