  md: '# BOOKS


    No library is complete without any books; hell, it''s not even a library. It''s
    just a room with empty shelves. To help you fill those shelves, here are some
    useful guides to the various aspects of game programming, as well as some other
    references.


    # OPENGL SUPER BIBLE (THE RED BOOK)


    A must for any 3D programmer, this book covers everything from transformations
    to bump mapping. Anyone who has done 3D programming has read this book or has
    it recommended to him.


    # OPENGL REFERENCE (THE BLUE BOOK)


    A printed version of the OpenGL man pages. The only reason for buying this book
    is if you prefer hardcopy references to the system help and don''t have a fast
    printer. I don''t recommend this title for the OpenGL newbie because it doesn''t
    contain much in the way of tutorials.


    # GRAPHICS PROGRAMMING BLACK BOOK


    By Michael Abrash (Coriolis)

    ISBN 1-56710-174-6


    This is graphics programmer''s bible. In addition to amusing anecdotes of Abrash''s
    life, this book covers everything from anti-aliasing to-the-metal optimization
    techniques. Although it requires some effort to apply the assembly code in this
    book to Linux systems (which uses a different syntax), it''s a very handy reference
    to have, but it is not cheap. You do get what you pay for, however, because it
    is probably the ultimate game programmer''s reference.


    # GAME ARCHITECTURE AND DESIGN


    By Andrew Rollings and Dave Morris (Coriolis)

    ISBN 1-56710-425-7


    This book covers every aspect of design, from team assignments to interface planning.
    It is a must for any team leader/lead programmer—as well as a useful guide for
    anyone who wants to break into the industry—because it gives helpful tips and
    case studies of the ways things work on the inside. Although I personally disagree
    with some of the business models contained in this title, it is nonetheless a
    good read, and it was written by two people with a long career in the game industry.'
