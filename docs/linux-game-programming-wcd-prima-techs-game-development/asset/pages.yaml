  md: '# REASONS FOR AND AGAINST OpenSource


    There are many reasons why OpenSource can be considered a good thing, ranging
    from greater security to a development team consisting of thousands of coders.
    But are these really claims? In some ways they are, and in other ways they''re
    not, depending on which side of the fence you are standing on.


    # TEN REASONS TO USE OpenSource


    There are many reasons to consider an OpenSource development route for your latest
    Linux game; the following sections present a small selection of them.


    # PEER REVIEWS


    The first and most pushed reason to go the OpenSource route is that thousands
    of developers can look at your code and point out errors. This free testing team
    can help you debug your game much thoroughly than you ever could on your own.


    People become attached to their code and find it hard to test all possibilities
    because they think that their code is flawless or that a certain situation could
    never happen. As much as we wish this was true, it isn''t. Your attachment to
    your code clouds your judgment and can result in a faulty testing process. This
    is where one of the OpenSource mottoes, “Release early, release often,” really
    comes into play.


    # SECURITY


    The next reason you should consider the OpenSource development route is that it''s
    a lot harder to sneak a back door into a program where it can be easily found.
    This issue has been raised on the Indrema mailing lists in the past, although
    when it comes to games, there are few reasons to hide a back door (except for
    copyright reasons, in which the game reports to the server that it''s being used,
    and the server can check whether user is allowed). Of course, if your game is
    OpenSource software, it would be very easy to remove the piracy checks.'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    # AVAILABLE CODE


    Another good argument for the OpenSource cause is that other people can learn
    from your code. This is probably one of the best reasons for OpenSource software:
    to aid the world in its quest to destroy ignorance in all its forms.


    # FREE SOFTWARE, FREE INFORMATION


    Who said there ain''t no thing as a free lunch? Many OpenSource products are free
    in more than one sense of the word. In addition to making code available for free
    (as free beer), OpenSource allows another form of freedom. Many people claim that
    information wants to be free (although how a metaphysical entity "want" anything
    is beyond me).


    By sharing your code with other people, it can be claimed that you are helping
    mankind, and in doing so, you are making yourself a better person. Personally,
    I don''t fall for that, but many others have. Who am I to say who''s right and
    who''s wrong?


    # MANY DEVELOPERS


    In addition to the peer reviews OpenSource almost guarantees, participating in
    an OpenSource development approach offers the possibility that other programmers
    may want to join your project as time goes on. This results in several things
    (including more free time to enjoy that free beer I mentioned earlier). Your project
    will gain the skills of someone who may or not have more experience in developing
    software than you do.


    # FAME


    Publicity is probably one of the primary factors involved in the OpenSource movement,
    although many people will disagree with me on that. People love to see their names
    in the credits of a game, and that may be all the inspiration they need to work
    with your software, find a few bugs, and fix them. (Obviously, then, your final
    version of the software will have to include a list of people who have helped
    you in your development efforts.) Although this may be a cynical view of society,
    I''m a cynical person, and that''s counts.'
  merge: -1
