  md: '# WHICH LICENSE TO USE?


    There are many kinds of OpenSource licenses, and some people can get quite emotional
    regarding the issue of licensing. From the "free software fanatics" who consider
    only a GPL program to be free, to the more open-minded OpenSource zealot who assumes
    that all closed-source software is dangerous to society, there is a whole range
    of attitudes towards licensing.


    You have several kinds of licenses to choose from, including viral licenses such
    as the GPL and more open licenses such as the BSD license. A number of the more
    popular license agreements are printed in Appendix A.


    # VIRAL LICENSES


    Licenses as the GNU Public License have a clause in them stating that any derivative
    software must be released under the same license, as must any libraries that the
    software is linked to. This clause has caused a lot of problems among KDE developers
    because their commonly used widget library, Qt, used another license.


    This conflict has been the topic of a very heated argument, one side arguing that
    Qt must be released under the GPL (or LGPL, a less restrictive version of the
    license), and the other side claiming that the GPL was the thing that needed changing.
    This issue has almost been resolved since the Qt libraries were released under
    a new license, the QPL (Qt Public License), as well as the original license.


    But there are further complications involved. Some libraries are released under
    the GPL (libJPEG being one example); as a result, any program that uses that library
    must be released under the same license. It is this problem causes people consider
    the GPL to be a virus, infecting anything it comes close to.


    Viral licenses are good for keeping things open, however. They do prevent people
    from taking parts of one program and cloning them in a proprietary system under
    a completely new license. (Note that this does happen anyway; there are numerous
    examples of it, such as an incident where Be Inc. accidentally released a development
    tool based on a GPLed.)'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# OPEN LICENSES


    Another type of OpenSource license worth considering is a more open license that
    allows users to do more things with the source than a viral license like the GPL
    permits. The BSD license, for example, allows someone to close the source if they
    desire. Although many of the previously mentioned "free software fanatics" would
    refuse to use this license, it opens up the prospect of commercial entities taking
    OpenSource software, adding their own proprietary extensions, and then releasing
    a closed version of the modified software.


    Although people might argue that this does nothing for the OpenSource movement,
    they would be wrong. Such situations would bring awareness to the movement, and
    the original software would still be available as OpenSource software. The proprietary
    extensions a company may add to the software may be specific to that company''s
    users, such as an employee-tracking system that hooks up to a custom database.
    Releasing the extensions to allow access to a system nobody has access to would
    have very little point.


    Many OpenSource licenses practices like the one just described. In my humble opinion,
    allowing people to do this is vital to the health of OpenSource in the enterprise
    environment.


    When it comes to games, if you decided to release a small part of your product
    as OpenSource (such as the graphics engine and nothing else), an open license
    would allow you to do so. The terms of the GPL dictate that the entire program
    must be made available to OpenSource (or must be dynamically linked to the LGPL
    library, if you use the lesser version of the license).


    # Custom LICENSES


    Some situations might require you to write your own software license from scratch.
    This approach can be a problem because you would have to remember to "cross all
    the is and dot all the s." On the other hand, it allows you to have a license
    tailor-made to the software you''re writing.


    If you plan on having a restricted-use license, you will probably have to write
    your own license. It doesn''t have to be stupidly long and complex; it just has
    to cover all the essential features such as redistribution rights, copyright,
    and disclaimers.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# LIABILITY


    One area that most OpenSource licenses doesn''t cover is who is responsible when
    everything breaks. With off-the-shelf software, you know who you you can turn
    to (and sue) if you lose all your data, but with OpenSource, that safeguard is
    rarely there.


    Although many license agreements include clauses to indemnify the original developers
    from blame, these clauses offer very little protection under circumstances of
    gross negligence.


    When a company is looking into purchasing software, it has to consider the liability
    issue. The liability issue is the number-one reason why many people still buy
    faulty closed-source software: Because there is a single source for fixes and
    blame. With OpenSource software, nobody knows who is responsible for a certain
    line of code, or who wrote the bit of code that caused a conflict with another
    patch.


    Although liability isn''t really an issue involving games (unless your title happens
    to be used to pilot planes covertly, which is unlikely), it does affect the business
    perspective of OpenSource software. Some publishers might want the liability factor
    to be resolved before any contracts are signed.'
