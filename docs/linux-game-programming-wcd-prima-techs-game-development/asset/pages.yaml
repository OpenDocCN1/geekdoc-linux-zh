- img_proc: true
  md: 'A better approach is to use triangle strips or triangle fans. In both cases,
    you send three vertices to describe the first triangle, but each subsequent triangle
    is connected to the first one along a shared edge. In the case of a triangle strip,
    you send vertices A, B, and C (which forms the first triangle). When you send
    vertex D, OpenGL draws a triangle between the last three points you sent—and so
    connects points B, C, and D. If you add a fifth point, you''ll get a third triangle
    formed by points C, D, and E, and so on. With triangle fans, OpenGL remembers
    the first point you send and uses the two most recent ones to form each triangle.
    Hence, sending vertices A, B, C, D, and E creates three triangles: A, B, C; D;
    and A, E.


    If your strips or fans contain enough triangles, using this approach, you can
    get down to an average of just one vertex per triangle—a lot more efficient than
    the three vertices per triangle you have to specify with GL_TRIANGLES.


    Although OpenGL also provides GL_QUADS and GL_QUADSTRIP, most OpenGL implementations
    are highly optimized for GL_TRIANGLE_STRIP and GL_TRIANGLE_FAN. You would do well
    to have your use those two elements as its main geometric primitive in addition
    to GL_LINES and GL_POINTS.


    # ADDING TEXT


    Eventually, you''ll want your game to include onscreen help instructions, credits,
    high-score tables, and such. If you are using GLUT and you don''t need to do smooth
    motion while the text is onscreen, you can use the following command:


    ```

    glutBitmapCharacter(font,character);

    ```


    In this syntax, font is one of the following values:


    | Value | Meaning |

    | --- | --- |

    | GLUT_BITMAP_9_BY_15 | Bithmapped 9x15 |

    | GLUT_BITMAP_8_BY_13 | Bithmapped 8x13 |

    | GLUT_BITMAP_TIMES_ROMAN_10 | 10-point Times Roman font |

    | GLUT_BITMAP_TIMES_ROMAN_24 | 24-point Times Roman font |

    | GLUT_BITMAP_HELVETICA_10 | 10-point Helvetica font |

    | GLUT_BITMAP_HELVETICA_12 | 12-point Helvetica font |

    | GLUT_BITMAP_HELVETICA_18 | 18-point Helvetica font |


    The character parameter can be any regular ASCII character. You choose a color
    for the text and position it like this:


    ![](img/8827e679048b592dad186c600299f274_154_0.png)'
