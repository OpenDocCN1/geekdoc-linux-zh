  md: 'It''s really easy. Okay, it''s not. Your games will probably have a fancy chat
    window to display the message in, but the message should get across. The OpenLobby
    chat system is stupidly easy to use because all the complex stuff such as attaching
    user names to messages and the like is handled by the server.


    When you join a room, the client is sent a single chat message that looks something
    like this:


    :NAMES User1 User2 User3


    This message is a list of the users in the room. Whenever the message is sent,
    the client should update the list of users in the room (if there is such a list)
    or simply ignore it. OpenLobby has a number of messages like this, and they''re
    fully documented in the OpenLobby documentation.


    Leaving a room is just as simple; a call to o1_PartRoom() does the job. It takes
    two arguments: the session pointer and the ID of the room you want to leave.


    # Sending Chat Messages


    Now that we know how to join a room and receive messages, things are looking good.
    But our chat system is missing one small thing: the ability to send messages.
    Never fear! As the rest of the chat features, sending messages is handled by a
    function, o1_ChatSend().


    o1_ChatSend() takes three arguments: the session pointer, a room number, and the
    actual message to send. The OpenLobby server prepends the sender''s name to the
    message so there is no need to handle that aspect of the message on the client.


    If the client tries to send a system message (for example, a message beginning
    with the character :), the server either rejects the message or removes the offending
    character. Only a server can send system messages because these kinds of messages
    can affect the clients in various ways.


    # Cleaning Up


    When you have finished with OpenLobby, it is wise to call o1_Bye(), with the single
    argument being the session pointer. This function causes you to leave any rooms
    in which you were participating and closes the connection. The server should detect
    a dead client after a while, but this approach results in unwanted packets being
    sent to the user for an unspecified period of time.'
  merge: -1
