- img_proc: true
  md: 'The preceding chapter, we covered the basic set of OpenGL features that every
    3D game will use.

    In this chapter, we''ll dip into a group of topics that build on that basic knowledge
    and hopefully get you to the point where you''ll be able to start writing your
    masterpiece.


    # STANDING DISPLAY LISTS


    OpenGL provides a feature that lets you record long sequences of commands into
    an object called a display list. A display list has a handle (rather like a texture
    handle, described in Chapter 6); you can replay the commands in a list with a
    single function call.


    First, create a handle for your display list using the following command:


    ```

    unsigned int handle = glGenLists ( 1 )

    ```


    The parameter to glGenLists is the number of consecutive handle numbers you want
    to generate.

    Now, you can record something into the list by using the following sequence:


    ```

    glNewList ( handle, GL_COMPILE )

    /* Some sequence of OpenGL commands */

    glEndList ( )

    ```


    Whatever OpenGL commands issued between glNewList() and glEndList() are recorded
    into the specified list instead of being executed. You can then replay those commands
    at any time in the future by "calling" the display list:


    ```

    glCallList ( handle )

    ```


    Most graphics cards can execute commands from a display list faster than if you
    issued them normally. That''s because the OpenGL driver can do calculations associated
    with the command at the time when the display list is created and save time when
    the list is eventually called.


    Think of display lists as a like subroutine in a programming language with the
    exception that display lists can be changed and recreated-on-the-fly. You can
    call one display list within another list by issuing the glCallList () command
    while you''re recording another list.


    You can change the contents of a list by recording over the top of it again. You
    can delete the list to free up memory using this command:


    ```

    glDeleteLists(handle, n)

    ```'
