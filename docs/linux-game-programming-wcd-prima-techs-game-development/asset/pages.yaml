  md: '# LINUX GAME PROGRAMMING


    This is where things start to get tricky. Sound under Linux is a tough thing to
    do if you don''t have the right libraries. Fortunately, Loki makes an OpenGL-like
    API called OpenAL that makes your audio life a lot easier. Of course, SDL also
    provides simple sound support.


    # OPENAL


    OpenAL (Open Audio Library) is an OpenSource 3D sound library with an API similar
    to OpenGL (Open Graphic Library). 3D surround sound is pretty much essential in
    today''s games, allowing total immersion into the environment. You can download
    OpenAL from http://www.openal.org or use the version in the libs directory on
    the CD-ROM that accompanies this book. At the time I am writing this, the documentation
    for OpenAL is less complete, but hopefully someone will complete it too long.


    ```

    OpenAL http://www.openal.org

    ```


    If you plan to port your game to other platforms, OpenAL is the perfect choice
    for the audio API because it compiles for various operating systems, including
    Windows and the Mac.


    # A SIMPLE OPENAL APPLICATION


    OpenAL coding is as easy as eating pie. (For you-American readers, that means
    it''s very easy. Just look at Elvis.) If you''ve read the last two chapters, you
    should already be familiar with the basic functions (replace the gl at the beginning
    of the function name with al, and you are away).


    Okay, it''s not quite that easy, but it''s not far from the truth. The following
    sections are dedicated to the basics of OpenAL, ranging from loading a WAV file
    to achieving full 3D surround sound.


    # INITIALIZING AND LOADING SAMPLES


    The first thing your OpenAL application must do is create a rendering context.
    This is achieved with the function alcCreateContext(). The function prototype
    for this is as follows:


    ```

