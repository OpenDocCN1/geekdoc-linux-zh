  md: '# LINUX GAME PROGRAMMING


    Each source has a property, AL_GAIN_LINEAR, which is basically the volume at which
    you want to play

    sample. You use the function alSource() to set this value:


    ```

    alSource(source, AL_GAIN_LINEAR, 1.0f);

    ```


    The reason "volume" is not a really suitable term here is because OpenAL uses
    a 3D environment.

    at that environment, two sources can have the same gain, but be at different volumes
    as far the listener

    is concerned (depending on the position of the sources relative to the listener).


    # VELOCITY AND DOPPL SHIFT


    If you''ve been watching a race on TV, or even beside during a race, I''m sure
    you''ve

    oticed that voo-1000 sound the cars make as they approach you. However, if you
    were inside the car,

    at that noise is not a reality voo-1000 without the room bit of the sound.


    The spectator hears the voo-1000000 because of something called the Doppler effect
    or Doppler shift.

    Dppler shift affects just about everything that moves in waves, be it light or
    sound.


    Doppler shift works like this: Considering an object that is generating sound
    (a car). This sound

    moves at a fixed speed (about 330 meters per second air), but because the source
    of the sound wave

    is moving, the sound interferes with itself as a newer part of the sound wave
    arrives at the

    s position as an "older" part of the wave.


    This Doppler shift is what causes a sonic boom: the sound you hear when an object
    moving so fast

    at all the sound it generates occupies the same point in the universe, and the
    universe doesn''t know

    to what to do with all the built-up energy.


    OpenAL has a feature to simulate the Doppler effect; you control it by using the
    AL_VELOCITY property

    of sources and listeners. If you remember your high physics class, you know that
    velocity is a

    a vector (a speed in a single direction). It is important to remember this fact
    when trying to work out

    your racers dont voo-100000 like they should.


    In the sample application we built earlier in this chapter, we used 0s for velocity
    of both the listener\and the source. We can, however, make the code more realistic
    by introducing Doppler shift into the\equation.


    Add the following new variable to the sample code with the other variables so
    that we can startimple-

    ment Doppler shift into our sample program:


    ```

    ALfloat source_velocity[3] = (0.0f, 0.0f, 0.0f);

    ```


    ![](img/8827e679048b592dad186c600299f274_189_0.png)'
