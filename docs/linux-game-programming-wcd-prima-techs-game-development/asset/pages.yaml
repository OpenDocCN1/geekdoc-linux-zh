  md: "# LINUX GAME PROGRAMMING\n\n# KEYBOARD EVENTS\n\nA keyboard is a relatively\
    \ simple device. It is, after all, just a lot of switches that are either on (pressed)\
    \ or off (released). On one hand, handling keyboard input with SDL is also simple.\
    \ There are two event types, SDL_KEYUP and SDL_KEYDOWN, that refer to a key press\
    \ and a key release. At the list of event types in Table 5.1, we can determine\
    \ information for an SDL_KEYUP or SDL_KEYDOWN event is stored in an SDL_KeyboardEvent\
    \ structure. Here is the prototype for structure:\n\n```\ntypedef struct {\n \
    \   Uint8 type;\n    Uint8 state;\n    SDL_keysym keysym;\n} SDL_KeyboardEvent;\n\
    ```\n\nAs you can see, the SDL_KeyboardEvent structure contains an SDL_keysym\
    \ structure—and however, I fear, where matters become complicated.\n\n```\ntypedef\
    \ struct {\n    Uint8 scancode;\n    SDLKeyym keysym;\n    SDLMod mod;\n    Uint16\
    \ unicode;\n} SDL_keysym;\n```\n\nIf you didn't read the explanation of keyboards\
    \ at the beginning of the chapter, shame on you! Go back and read it. As was explained,\
    \ when a key is pressed or released, the device generates a scancode. On its own,\
    \ a scancode is not very useful; it is just a number representing a key on the\
    \ keyboard and is often associated with the position of the key and not the key's\
    \ alphanumeric or symbolic value. The SDL_keysym structure, however, contains\
    \ everything we need to know about a key press or a key release. The scancode\
    \ field contains below keyboard scancode, with which we are more comfortable and\
    \ familiar. The sym and mod fields are what we are really interested in, The sym\
    \ field contains one of the key values listed in Table 5.2. For example, if the\
    \ cursor key is pressed, the sym field contains the value SDL_LEFT. The mod field\
    \ contains information about any modifier key (such as Ctrl, Alt, Shift) that\
    \ were active when pressed or released. The mod field is an ORed combination of\
    \ the modifier symbols in field. For example, if both the Shift and Ctrl keys\
    \ were pressed, the mod field would be equal to KMOD_CTRL|KMOD_SHIFT."
