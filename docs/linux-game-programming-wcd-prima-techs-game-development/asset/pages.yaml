  md: "The first argument, thread, is a pointer to where you want to store an identifier\
    \ for the newly created thread. The next argument, attr, contains the attributes\
    \ for the thread. For now, it's safe to specify a value of NULL for this argument\
    \ (this is a chapter on networking, not threads). The third argument, start_routine,\
    \ is a pointer to a function that will be started in the separate thread. The\
    \ final argument, arg, specifies any arguments you want to pass to the thread\
    \ function.\n\nWhen you want to end the thread, you end the function just as you\
    \ would a normal function: by calling return. For more details on the pthreads\
    \ library, see the main pages.\n\n# CLIENTS\n\nWhen it comes to client-side networking,\
    \ it's a damned good idea to isolate the game logic and rendering from the network\
    \ code—unless your game is 100 percent dependant on the network data (which is\
    \ unlikely). By running the network code in a separate thread, you don't have\
    \ to worry about calls such as sendto() blocks, and there are many ways to prevent\
    \ that from happening.\n\nIf you decide to run the network code in a separate\
    \ thread, you must provide a way for the two threads (the game thread and the\
    \ network thread) to communicate. The first method I will demonstrate is the use\
