  md: '# LINUX GAME PROGRAMMING


    The following code demonstrates how to set up a light source.


    ```

    float pos[ 3 ] = ( 1000.0f, 5000.0f, 0.0f);

    float white[ 3 ] = ( 1.0f, 1.0f, 1.0f);

    float dim_white[ 3 ] = ( 0.3f, 0.3f, 0.3f );


    glLightfv( GL_LIGHT, GL_POSITION, pos );

    glLightfv( GL_LIGHT, GL_AMBIENT, dim_white );

    glLightfv( GL_LIGHT, GL_DIFFUSE , white );

    glLightfv( GL_LIGHT, GL_SPECULAR, white );

    glEnable(GL_LIGHT );

    ```


    The first parameter of glLightfv() selects which light is being set up. This parameter
    can be GL_LIGHT, and so on up to GL_LIGHT7. Alternatively, you can index the light
    sources using references as GL_LIGHT+1, GL_LIGHT+2, and so on. The second parameter
    specifies which attributes of the light source is being set. Setting the ambient,
    diffuse, and specular colors is easy; in the real world, these are identical colors,
    with the ambient color being about 30 percent of the brightness of the other components.
    The glEnable() turns the light source on; glDisable() turns it off. It is quite
    convenient: you can preset your lights and switch them on and off with a single
    call.


    Setting up the position of the light source is a little trickier because the GL_POSITION
    parameter is transformed by the ModelView matrix--the same way as a vertex of
    your model. Establishing the position of the light source can become confusing.
    If you set the light position before setting up the camera''s position, it will
    look like the light source is moving around with the camera. If you want the light
    source to stay fixed with respect to your world, you''ll have to set up the position
    of the light source after you set up the camera matrix. Then form the position
    of the light source using the same matrix as the camera.


    # SETTING UP SURFACE NORMALS


    The final part of getting lighting is to set up the surface normals for each of
    the surfaces. To compute the amount of diffuse and specular light reflected into
    the camera from the light source, OpenGL needs to know the angle of the polygon
    to the light and to you. You might think it could compute from the vertex information
    you''ve already given it, but so produces very faceted models. When you build
    a sphere, for example, you''re approximating the angles of reflection with triangles
    that are deal flat. A sphere made from flat surfaces does not look very smooth.


    The solution is to provide OpenGL with the orientation of the surface (the sphere
    in this case) at every vertex. OpenGL then computes the amount of light falling
    at each vertex, does the light-math, and then blends the light over the polygon.
    If we set up the light orientations, the sphere will look perfectly smooth.


    ![](img/8827e679048b592dad186c600299f274_141_0.png)'
