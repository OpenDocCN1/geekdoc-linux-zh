    \ at our sample program as it is currently written, you will notice that we already\
    \ have a callback function that is ready to be coded: audio_func(). This function\
    \ has three parameters. The first is a pointer to some user-defined data that\
    \ is set when you call SDL_OpenAudio() in the userdata member of the SDL_AudioSpec\
    \ structure.\n\nThe second argument is a pointer to the audio stream, which is\
    \ you actually send data when you want it to be played. More on this later. The\
    \ final argument for the callback function is the length of the audio buffer in\
    \ bytes.\n\n# PLAYING A SAMPLE\n\nTo copy a sample to the audio stream, use the\
    \ function SDL_MixAudio(), which takes care of everything. Although you can do\
    \ things manually, I don't recommend doing that\n\n```\nvoid SDL_MixAudio(Uint8\
    \ *dst, Uint8 *src, Uint32 len, int vol);\n```\n\nThe first argument to SDL_MixAudio()\
    \ is the destination sound buffer, which can be the actual audio stream. The second\
    \ argument is the sample you want to play. The third argument is the size of the\
    \ audio sample to play, followed by the volume at which you want to play it.\n\
    \nThe volume can be any value between 0 and 128, but you should use SDL_MIX_MAXVOLUME\
    \ if you want to play the sample at full volume.\n\nIn our sample program, replace\
    \ the empty callback function with the following code:\n\n```\n// Function to\
    \ play audio\nvoid audio_func(void *userdata, Uint8 *stream, int len) {\n  //\
