  md: 'Some of you may be thinking that this system doesn''t take the edges of the
    board into account, there is a reason for this. As well aiming for a win, the
    system also considers a draw to be a reason-able result. This code takes into
    account by allowing certain checks to wrap.


    If, for example, you have control of cells 3, 4, and 9, there is only one way
    for the opponent to win, and that''s by going down the middle. However, if you
    calculate what the AI player would try to do for his next turn, the most profitable
    square would be square number 5 (with three neighbors), forcing a draw.


    Now that we have our two turns planned out, we need to decide which one we want
    to do. There are two ways to make this decision. The first is just to go whichever
    mover gives us the highest score, and the other is to work out which gives us
    the highest score and prevents the opponent from winning in his next turn.


    The easiest way to do this is to sort the scores from the first test and then
    select the highest score that also has the lowest score from the second test.


    # ADVANCED ARTIFICIAL INTELLIGENCE


    Now we are going to take the concept of artificial intelligence one step further.
    Yes, my friends, we are going to create our own pet Frankenstein. Although a deep
    understanding of human anatomy isn'' required for this exercise, some knowledge
    of biology, such as genetics and neural chemistry, will help.


    # GENETIC ALGORITHMS


    The first-level AI we''re going to look at is a genetic algorithm. Genetic algorithms
    are considered non-symbolic, meaning that the behavior is not hard coded but is
    learned using a vague form of fuzzy logic. Based on Darwin''s Theory of Evolution,
    genetic algorithms "evolve" over time, adapting to the task at hand.'
