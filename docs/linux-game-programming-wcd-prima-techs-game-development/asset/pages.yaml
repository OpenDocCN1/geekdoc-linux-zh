  md: 'ol_UpdateGame() takes two arguments: a session pointer and an olGameDef structure
    containing all the relevant details about the game. The creator of the game can
    update the game. The function proto-type for ol_UpdateGame() is as follows:


    ```

    void ol_UpdateGame(olServer *session, olGameDef *gamedef);

    ```


    This function also allows you to change the address of the game server, if you
    need to change the host, for example. You do this by updating the IPv4 member
    of the game definition structure. Clients already in the game must be notified
    by some other means, however.


    You call ol_UpdateGame() whenever something in the game changes, as the number
    of players. This is an important call to make because things can become very confusing
    for the users if more play- are in the game then the users are led to believe
    there.


    # ENDING GAMES


    To remove a game from the lobby server''s directory, simply call ol_EndGame().
    This function takes a single argument: the session pointer and ol_Connect(). Like
    the other OpenLobby functions, this function doesn''t notify clients that the
    game has ended; this notification must be handled by the game server itself, not
    the lobby API.


    # CHATTING IN THE LOBBY


    Like any good lobby provider, OpenLobby includes support for a rudimentary chat
    system. Unlike other chat systems, OpenLobby chat is completely isolated from
    the rest of your networking code. There is no need to check for chat messages
    because OpenLobby notifies the program using a callback function; that function
    also contains the chat messages.


    # LISTING CHAT ROOMS


    The process of finding an OpenLobby chat room works almost identically to finding
    an OpenLobby game. Unlike ol_FindGames(), the chat system lists every chat room
    on the server. Although this request can result in a very long list of rooms,
    a system exists to narrow down this list. Like ol_FindGames(), the callback function
    for finding rooms gives information about the chat rooms.'
