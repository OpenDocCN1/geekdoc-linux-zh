  md: '# CREATING A WINDOW


    The first thing you do when opening a window under X is to tell it where the screen
    is. The X Windowing System uses a client/server architecture, and one machine
    (the client) sends the window to a different machine (the server). Although there
    are several ways of telling the client where the server is, the most foolproof
    way is to use the DISPLAY environment variable.


    The variable takes the form `<address>:<desktop>`, where `<address>` is the name
    or IP address of the X server, and `<desktop>` is the server to use. (Note that
    a single machine can run multiple times.)


    The function XOpenDisplay() makes the connection to the X server. It takes one
    argument: a string using the display described above, or NULL to use the default.
    It returns a pointer to the display (of `type Display`) on success, or NULL on
    error.


    When you have a pointer to your display, you need a screen. You can find your
    screen using the `DefaultScreenDisplay()` function. This function takes one parameter:
    the pointer to the display found using `XOpenDisplay()` function. `DefaultScreenDisplay()`
    returns a pointer to Screen on success, or NULL on error. You must also find the
    screen with the `DefaultScreen()` function. `DefaultScreen()` is almost identical
    to `DefaultScreenDisplay()` except that it returns an integer.


    Now that we have a display, screen, and screen (Xlib coding is quite pointless
    at times), we can actually create the window. You create the window using the
    `XCreateSimpleWindow()` function. (Although you can use `XCreateWindow()`, doing
    so is infinitely more complicated.) The prototype for `XCreateSimpleWindow` is
    shown here:


    ```

    XCreateSimpleWindow(Display *display, Window *parent, int x, int y, unsigned int
    width, unsigned int height, unsigned int border_width, unsigned long border, unsigned
    long background);

    ```


    The first argument, `display`, is the pointer to the display we got using the
    `XOpenDisplay()` function. The next argument, `parent`, is a pointer to the window
    that is opening the new one. If this is the window program is opening, you must
    use the `RootWindowOfScreen()` function. This function takes one argument: the
    pointer to the screen we got using `DefaultScreenOfDisplay()`.


    The next four arguments are the location and size of window. The `border_width`
    argument specifies the width of the window border in pixels. The next argument,
    `border`, is the color of the border. The last parameter, `background`, is simply
    the background color of the window.


    The next step is to clear the window using the `XClearWindow()` function. This
    function takes two arguments: the display and the window to clear (in that order).
    Finally, you must raise the window using the `XMapRaised()` function, which uses
    the same two arguments as `XClearWindow()`.


    ![](img/8827e679048b592dad186c600299f274_74_0.png)'
