  md: '# LINUX GAME PROGRAMMING


    Now that you know what you need to create a game, you need to know how to make
    a game. Other words, you can have all the monkey wrenches in the world, but that
    still doesn''t mean you''re a mechanic. This chapter starts your training as a
    game programmer by outlining the basic structure of a typical game.


    # THE PARTS OF A GAME


    Every game has several parts, the most important of which is the game loop. After
    you have initialized all the required hardware and loaded any data, the game enters
    a loop during which the actual play occurs. Before it gets to the loop, the game
    must do several things to make it playable.


    The first thing a game must do is start. This sounds pretty obvious, but I''ve
    seen people try to write the main loop before anything else and then wonder why
    the game won''t work. When I say "start", I mean the game must open any windows
    you need, activate sound drivers, and load any graphics required for the basic
    operation of the game.


    After the initialization process is completed, most games usually enter a "message
    loop" in which a check is performed to see whether anything must be done regarding
    user input and then process that input. The message loop works by first checking
    to see any events are waiting and processing them. If there are no messages waiting,
    an idle function is called which processes any information that isn''t dependent
    on user input, as setting up the enemy AI or updating the screen.


    The final part of the game is where you close everything. Although some people
    believe that this step isn''t necessary, not doing it results in wasted memory
    and hardware being locked up, in which turn prevents others applications from
    using these system resources.


    # A GAME FRAMEWORK


    When it comes to programming, one of the most useful things you can have is a
    simple framework on which you can build more complex projects. Included in this
    framework is a makefile that you can use regardless of which editor you are using
    to code the program, be it KDevelop or vi.


    Here is the first file in our little framework; it handles the startup and shutdown
    of the program, and also handles events.


