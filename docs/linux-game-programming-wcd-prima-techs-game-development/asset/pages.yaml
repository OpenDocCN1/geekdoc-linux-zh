  md: "# ARTIFICIAL NEURAL NETWORKS\n\nArtificial neural networks are really quite\
    \ simple (in the way that genetic algorithms are simple). However, a complicated\
    \ system can be quite processor intensive. Even if your artificial neural network\
    \ isn't complicated (unless you're a big fan of multithreaded applications), the\
    \ system can still make a significant impact on performance if it is not thought\
    \ out carefully.\n\nFor this example, we're going to use a fictitious table of\
    \ data that we want the network to learn from. Table 10.1 shows a series of dog-fighting\
    \ tactics and how successful they are.\n\nBefore I go into the details about Table\
    \ 10.1, I'll explain what each of the tactics mean. Table 10.2 does this sincerely.\n\
    \nIn a perfect world, you want to use tactics that result in the enemy being killed\
    \ while minimizing damage to yourself. However, some tactics result in damage\
    \ to yourself while still killing the enemy, so these tactics can be considered\
    \ okay but not as desirable. If we were to hard-code the logic, we would end up\
    \ with something like this:\n\n```\nif ((ENEMY_HIT || ENEMY_KILLED) && !(ME_DEAD))\
    \ {\n    // do something here\n}\n```\n\n| Table 10.1 Dog-Fighting Tactics and\
    \ Success Rates |\n| Name | Successful Hit | Successful Kill | Took Damage | Was\
    \ Killed | Mission Success |\n|---|---|---|---|---||}{\n| Immelman | 0 | 0 | 0\
    \ | 0 | 0 |\n| Scissors | 0 | 1 | 0 | 0 | 1 |\n| Inverted scissors | 0 | 0 | 1\
    \ | 1 | 0 |\n| Low yo-yo | 1 | 0 | 0 | 0 | 0 |\n| Hi yo-yo | 1 | 0 | 0 | 0 | 1\
    \ |"
