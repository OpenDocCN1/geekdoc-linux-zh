    # UNDERSTANDING VERTEX ARRAYS


    In Chapter 6, we talked about drawing lists of vertices (along with their color,
    normal, and texture coordinate data) using glBegin() and glEnd() sequences. This
    is the classical way to send vertex data to OpenGL, but more versions of the API
    (as those available under Linux) have vertex arrays that allow you to place all
    your vertex information into one or more arrays and render them all with one convenient
    call. If you examine the code for expl1.c on the CD-ROM that accompanies this
    book, you''ll notice that it contains five pre-initialized arrays:


    ```

    #define NUM_VERTS (3*4) / Four triangles - three vertices each *

    float normals [ 3 * NUM_VERTS ]

    float colors [ 3 * NUM_VERTS ]

    float texcoords [ 2 * NUM_VERTS ]

    float vertices [ 3 * NUM_VERTS ]

    unsigned short indices [ NUM_VERTS ]

    ```


    The first four arrays contain the raw data for colors, normals, texture coordinates,
    and 3D coordinates. The last array (in this example) just contains the numbers
    0 through 11 in order.


    Next, it is necessary to tell OpenGL that the various data items used for drawing
    are drawn by vertex arrays. Generally, programs set this feature once during initialization:


    ```

    glClearState ( GL_NORMAL_ARRAY );

    glClearState ( GL_COLOR_ARRAY );

    glClearState ( GL_TEXTURE_COORD_ARRAY );

    glClearState ( GL_VERTEX_ARRAY );

    ```


    The next step is to tell OpenGL where to find these arrays:


    ```

    glColorPointer ( 3, GL_FLOAT, 0, colors )

    glTexCoordPointer ( 2, GL_FLOAT, 0, texcoords )

    glNormalPointer ( 3, GL_FLOAT, 0, normals )

    gglVertexPointer ( 3, GL_FLOAT, 0, vertices );

    ```


    The first argument in this call is the number of parameters for each vertex (except
    in the case of glNormalPointer(), for which you can have only three arguments
    for each glNormal3f()); the second argument tells OpenGL what C-type the array
    elements are, such as floating-point


    ![](img/8827e679048b592dad186c600299f274_152_0.png)'
