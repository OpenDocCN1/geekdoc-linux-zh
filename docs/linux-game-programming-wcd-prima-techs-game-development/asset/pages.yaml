    This code can go anywhere at the start of the display routine or even somewhere
    in the initialization code if you don''t plan to change the amount of fog as the
    game progresses.


    As you can see, there is a call to set the density of the fog and another to set
    the color (white in this case). However, if you do nothing else to this code when
    you add it to the sample program, it won''t look right. The problem is that OpenGL
    not applying fog to the clear-screen color. If you add this code axis, you will
    have a foggy model shown darkly against a dark-green screen. The fix for that
    is to change the clear-screen color equal to the fog color.


