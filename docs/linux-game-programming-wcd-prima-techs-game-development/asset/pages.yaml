  md: '# LINUX GAME PROGRAMMING


    For several years now, 3D has been taking more of an emphasis in gaming, with
    titles such as Quake III and Half-Life showing developers what they should be
    doing. To make life easy for us, several companies have developed 3D APIs to handle
    the more complex aspects of 3D programming.


    # SOME HISTORY! MESA AND OPENGL


    Currently, only two 3D graphics interfaces are in common use for computer games:
    Direct3D and OpenGL. Direct3D is available only under Microsoft Windows, but OpenGL
    is implemented on just about every kind of computer with power to run 3D graphics—including
    machines. So, when fast 3D graphics hardware came to the PC, it was inevitable
    that some of OpenGL implementation would be needed for Linux.


    Brian Paul had been experimenting with a graphics library he''d written for the
    Commodore Amiga and ported to Linux. Daryl Strauss and David Bucciarelli adapted
    Mesa to drive 3FX Voodoo graphics Mesa. In addition to supporting more card types,
    Mesa has grown into an almost perfect implementation of the OpenGL API (although,
    for legal reasons, it''s not allowed to be called OpenGL). Nonetheless, if you
    have a program that''s written using OpenGL, it''s pretty much a bet that it''ll
    work when compiled and linked against Mesa.


    Additionally, there are now several OpenGL implementations for Linux, including
    those from Xig, Metro-Link, and NVIDIA. Therefore, for the remainder of this chapter
    and the next, I''ll talk about the "OpenGL" graphics interface, even though the
    chances that you''ll be pronouncing it "Mesa."


    > In 2001, 3DFX was bought by its competitor, NVIDIA. While support for the older
    chips is going to continue, no Voodoo-based cards are going to be manufactured.


    In this chapter, I''ll introduce you to enough OpenGL to write gaming games. Because
    it''s a deep subject worthy of several volumes, much of which is out of the scope
    of this book, but for more information on this extensive topic, pick up a copy
    of OpenGL Game Programming (Primary Publishing).


    # WHAT IS OPENGL?


    OpenGL is an extremely powerful graphics API. One of its nicest features is that
    all implementations have to provide all of the core functionality required by
    the specification of the API. That means that programs should run correctly whether
    you have an aging Voodoo-1 card or an up-to-date GeForce-2


    ![](img/8827e679048b592dad186c600299f274_121_0.png)'
