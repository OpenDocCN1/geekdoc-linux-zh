  md: '# # ifdef Your Friend


    The #ifdef statement is cool. There''s a real temptation to just define a LINUX
    macro and have all your porting changes switched in with. Instead, try to switch
    by feature availability and not by platform. Because most of the features you''ll
    use are available on multiple platforms, you''ll have much finer-grained control
    over your build configuration if you are using a blanket switch-by-platform approach.
    Here are some examples:


    +   - If you are using a cross-platform library to add your porting effort, the
    original codebase can benefit by having the extra configuration variable. As an
    example, Windows NT doesn''t (didn''t?) have very good Direct3D support. Porting
    Direct3D game to Linux using OpenGL gives you a NT version essentially for free.

    - A lot of the system calls are part of the POSIX standard. By switching these
    calls in a macro called POSIX rather than LIN, you''ll be better placed to port
    other POSIX-supporting platforms (the BSDs, for example).

    - Even seemingly proprietary features pop up in odd places. For example, there
    are a number of Win32 API implementations for Linux/UNIX, such as the WINE project.

    - Don''t use a platform macro to switch in a compiler-specific feature. All compilers
    have predefined macros to let identify them, so use these macros instead. Visual
    C/++ is not the only Windows compiler available.


    Here are some useful compiler-defined macros:


    | Macro | Meaning |

    |---|---|

    | _WIN32 | The Win32 API is available (defined by Visual C/C++) |

    | _MSC_VER | Compiling on Microsoft Visual C/C++ |

    | _GNUC_ | Compiling on GCC |

    | _GNUG_ | Compiling on GCC C++ compiler (G++). Implies _GNUC_|


    # The Harder Stuff


    It''s now time to dealing with all the code you previously disabled using #ifdef
    preprocessor directive and stub functions.


    At this point, you may have identified places in which some refactoring of the
    original code would help. Try to identify areas where separation of platform-dependent
    code from platform-independent code makes sense. Additionally, for particularly
    convoluted modules, just to make the code'
  merge: -1
  pgno: 308
- img_proc: true
  md: 'understandable can be worthwhile. Ideally, the refactoring would be done on
    the original platform so that you can keep the game running. This approach lets
    you test your changes to make sure that your changes haven''t broken anything.
    Performing the changes on the target platform, where the game is not yet in a
    standard, requires a huge leap of faith. Untested code is almost always buggy
    code.


    Often you''ll have to make a decision between port or rewriting a module. This
    can be a hard decision, and there is no magic method to help—except experience
    and familiarity with the code. A good rule of thumb is that if you are getting
    the existing code ported without obfuscating it to any degree, you are better
    off making sure that the interface is well defined, forking it off, and writing
    a new implementation.


    # FIRST LIGHT


    "First light" is a magical moment. It is the first time you run the newly ported
    game and actually see something recognizable on the screen. Of course, this is
    almost immediately followed up by a screenful of garbage and a horrible catastrophic
    crash.


    It''s still a memorable milestone.


    Anyway, you''re running Linux. Horrible catastrophic crashes are well behaved
    and easy to deal with, a new example for the UK national railway operator, Railtrack,
    may like to follow.


    # COMPILER ISSUES


    Although it took a long time to pin down, there is now an official C++ standard.
    However, implementing this standard accurately in a compiler is not trivial. Pity
    the compiler engineers; C++ is a complex language to implement. You''ll be hard
    pressed to find a compiler that doesn''t break or deviate from the standard in
    some way. The footpath of C++ is strewn with the dog-dog poof of standards violations.


    If you are using rather than C++, the situation is a lot better. The ANSI C standard
    has been in place for a while and there are still a few new features being added
    here and there, and of course the compiler support for these additions is likely
    to be patchy.


    At the time I am writing, Microsoft Visual C/C++ seems to be the predominant compiler
    for Windows. It can be a pretty good compiler, but it is somewhat idiosyncratic.
    It contains a lot of not-quite-standard behaviors that can trip you up the porto
    process. It also supports some non-standard features such as compiler-level COM
    support.'
