    Now let''s get this object to move.


    # DRAWING IN 3D: PERSPECTIVE AND MOVEMENT


    Making things move in OpenGL is just a matter of drawing them in a slightly different
    position in each frame—just as you do in 2D graphics—but recomputing all those
    glVertex values each time would be tedious. Fortunately, OpenGL can do this computing
    for you, on modern graphics cards, it might be for you on lightning fast hardware.


    Moving objects in 3D is tricky, especially if your vector and matrix math isn''t
    strong. All rotations, translations, scaling, shearing, mirroring, and other "linear"
    transformations can be described by 16 numbers arranged in a 4x4 matrix. This
    compact representation is at the heart of 3D algorithms. If you are going to become
    an effective 3D programmer, you''ll have to come to grips with 4x4 matrices.'
