  md: '# INTRODUCTION TO GAME DEVELOPMENT


    # DEVELOPMENT


    After your team has agreed on a design, you can actually get to work on writing
    the code. But where do you begin? Do you write the game engine or the menus first?
    And which part of the game engine? Where to start is one of the toughest choices
    you''ll have to make when starting a new project, fortunately, you have a design
    document.


    One of the best places to start writing your game is at the beginning. I don''t
    mean that you should write the whole thing in order, from intro sequence to credits,
    but that you should start where the program starts: the initialization routine
    where you prepare any variables you may need or fire any graphics APIs. Without
    this vital part of the program, you cannot anything.


    Where you go from is up to you, but I like to continue by developing the graphics
    engine. This allows me to code the core of the game next, but does make it difficult
    to add or modify features later in the development process.


    If you are on a team that is developing a large project, you will need a way of
    sharing files. E-mail is a fine exchange medium if everyone is working on completely
    separate parts of the program and you have a clearly defined interface to work
    with. However, if you have problems with version concurrency, you might want to
    look into a CVS (Concurrency Versioning System) repository. CVS repository allows
    multiple developers to work on the same problem by checking files in and out of
    a "repository", I''ll go into further detail CVS options in Chapter 2, "Linux
    Development Tools."


    # TESTING


    One of the most important steps in the development process is testing your new
    game. If any serious bugs show after you release the game, your reputation will
    be ruined. Frontier II: First Encounters is a good example of incomplete testing
    resulting in a buggy release (although I can''t really place the whole blame on
    the developers). Because of a tight deadline, the program wasn''t fully tested
    and major bugs caused serious problems in the game. These bugs seriously damaged
    the reputation of the developer, even though it had Elite, one of the most popular
    games ever.


    There are several stages to testing your game, commonly referred to as Alpha,
    Beta, and Gamma phases. The Alpha testing is done by the developers, in which
    they find any obvious bugs and glitches while writing the code. Beta testing is
    performed by a third party (usually a dedicated gamer) who will try to find any
    of the hidden bugs; finally, Gamma testing is performed by the general game playing
    community. When a bug is found in the game, chances are you will hear about it.
    When you do, you have to reproduce the problem and then generate a patch to fix
    the program.


    When it comes to testing, one of the most useful tools you can create is a debug
    cheat. A cheat allows you to jump to any part of the game, gives you any extras
    you need (such as cash, weapons, or points), and can save you hours of time. Because
    all cheats are removed before the game is released'
