- img_proc: true
  md: 'Back in The Good Old Days™, games were platform specific. You would write everything
    in assembly language (or raw machine code if you were a Real Programmer) and hit
    the hard-directly. Porting a game to another platform usually meant throwing away
    the original code and doing a complete rewrite. If you were lucky, you might be
    able to steal some graphics data from the original version if the hardware was
    similar enough. You had to be platform specific if you wanted any sort of performance.


    Since those days of nostalgia¹, two main advances have taken place that make porting
    games a more viable prospect:


    +   * The use of high-level languages

    * Abstracted hardware interfaces


    Although calling C and C++ "high-level languages" might be a subject of debate,
    they are high level in comparison to assembly language. Most, code written on
    one platform has at least a running chance of being compiled for another. Other
    languages could provide the same benefits, but C and C++ are currently the predominant
    languages used for games.


    Regarding the second point, it is simply not feasible to program directly to the
    hardware anymore. Even on the same platform, the variety of video, sound, and
    I/O hardware that may have to be sup-ported is astronomical. So that responsibility
    must be delegated to the operating system, device drivers, and the interfaces
    they provide.


    These facts mean that things are much better than they used to be, from a portability
    point of view. However, there is still a lot more to porting than simply recompiling
    it. Proprietary standards, closed formats, creative use of programming language
    features, and fundamental differences in portability capabilities still stand
    in your way.


    The ideal game for porting has the following characteristics:


    +   * It is well designed and cleanly structured. Clean code is much more portable
    than badly organized code.

    * It uses open standards and cross-platform libraries wherever possible.

    * It avoids platform or compiler-specific features.

    * It has segregated any unavoidably platform-specific parts into separate files.'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'In contrast, the porting project from hell has the following characteristics:


    +   - It has code that looks like spaghetti. There is no clear structure or separation
    of responsibility between modules.

    - It uses closed, proprietary standards and APIs wherever possible. For extra
    credit, the program contains technologies covered by software patents and hefty
    license fees.

    - It uses a programming language that''s only available on the original platform
    or, failing this, makes extensive use of platform-specific language extensions.

    - It contains somewhat biased badly commented assembly code.


    This appendix is somewhat biased toward porting an application from Windows to
    Linux because this is considered to be the most likely case. The good news is
    that the capabilities of the basic hardware will be pretty identical. The bad
    news is that Windows games are rarely written with portability in mind. Well-structured
    original code is of immense help here; good programming practices such as abstraction
    and encapsulation inherit portability, even if that is not the original motivation
    for using these practices.


    # PORTING STRATEGY


    Starting a port can be a pretty daunting prospect. You have a bunch of source
    files written for an incompatible platform, possibly written by you, possibly
    written by others, probably badly documented. Where do you start?


    # TRY NOT TO FORK THE CODEBASE


    If you misread the word *fork* in the title of this section, don''t worry. The
    meaning doesn''t change much.


    There is a lot to be gained by trying to maintain a single codebase. That is,
    to make the porting changes while keeping the original version working. It''s
    often tempting to diverge from the original by replacing old platform-specific
    bits with new platform-specific bits. Try to avoid this snafu by switching between
    the old and new versions using compile-time switches (#ifdefs). Better still,
    try putting platform-neutral code in instead.'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    Here are some of the benefits of a shared codebase:


    +   - Changes and fixes made on one platform will automatically be incorporated
    on the other(s).

    - The original version will benefit from the scrutiny given to it during the porting
    process. Bug fixing, refactoring, and general tidying will improve the entire
    codebase, not just the new port.

    - You can debug tools using the original platform. Having extra debugging tools
    available is always a good thing.

    - The codebase as a whole will become easier to port to additional platforms.


    If active work is continuing on the original version, take care not to cause unnecessary
    breaking during the porting process. If possible, test your changes on the original
    platform as you go. Most source control systems provide some sort of branching
    mechanism to manage multiple streams of development. Potentially disruptive changes
    can be performed on a separate branch and merged into the main branch when they
    are well tested and stable. Of course, CVS, widely used in the Linux world, provides
    the required features.


    Of course, sometimes you won''t be able to share a codebase. Maybe the people
    in charge of the original version don''t want you messing with their copy of the
    code, or maybe the platforms differ in such a radical way that a complete architectural
    rethink is required. Maybe the original codebase resides in a source control system
    without Linux support (Microsoft Sourcesce, for example). In these cases, you
    have to maintain a separate Linux source repository, treating the original repository
    as a third-party package you have to track.


    # GETTING STARTED


    As with many things, the best approach is to just dive in and start hacking away.
    Pick a file at random and compile it from the command line. A large number of
    the resulting errors are going to be trivial things. Fix them. For bigger problems,
    use #ifdef to block out offending chunks of code, making sure that you leave some
    of TODO: comment or NEEDS_WORK marker that you can use grep to locate for later
    on. Replace problem functions with stubs that do nothing. Leave the big issues
    for later.


    Go through all the files in this way. The goal at the moment is just to get the
    project compiled. You''ll feel a sense of achievement over you as the compiler
    errors disappear. If you''re lucky, you''ll also be able to get successful linking.


    You''ll probably want to script a makefile (or its equivalent). There is a strong
    likelihood that the original version of the game was built using an IDE (Integrated
    Development Environment) using proprietary project description files. For example,
    the Visual C/C++ IDE uses workspaces (.DSW files) containing one or more projects
    (described in DSP files). Of course, these are little or no use under Linux.'
  merge: -1
