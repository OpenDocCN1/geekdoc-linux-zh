- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    When you have returned the NDA with your completed design document—and hopefully
    a working demo of your game—the publisher will tell you whether it is interested
    in your submission. If it turns you down, don''t give up. Keep trying until you
    find a new publisher.


    If the publisher approves your game, negotiations will begin. It might be a good
    idea to contact a lawyer because legal documents will be involved; unless you
    are fluent in legalese, the contracts will probably be a bit confusing.


    A guide to getting your games published has been written by Geoff Howland of Lupus
    Games. You can find it at http://www.lupinegames.com/articles/getstart.html.


    # GUIDE TO GETTING YOUR GAMES PUBLISHED:


    ```

    HTTP://WWW.LUPINEGAMES.COM/ARTICLES/GETSTART.HTML

    ```


    # SHAREWARE GAMES


    Another option when it comes to releasing your game is the shareware route. Some
    of the most successful games, such as Doom and Quake, were released initially
    as shareware. Releasing a game as shareware is very similar to releasing a game
    in the OpenSource route, except that you generally don''t distribute the source
    code. (Note, however, id software now made the source code to Quake available,
    although it still requires a license for the in-game data.)


    You have several options to choose from when making your game shareware. You can
    use an honor system and ask the user to pay after a certain amount of time has
    elapsed, or you can restrict the game in some way (such as only including the
    first few levels) until the user has paid for the complete version.


    After you have decided how youre going to claim money from your games, you can
    set a price ($20 is usually a good start) and add a message to the game letting
    the users know where they have to send the money. In games such as Doom and Quake,
    a message was displayed when you quit the game, giving the user registration details.
    Some games use pop-up messages during the game to get the shareware access.


    When it comes to distributing your game, you have several options. You can try
    and have it stuck on the cover CD of your favorite magazine, or you can upload
    it to the Internet and have some download sites such as Tucows (http://www.tucows.com),
    sending random surfers to get your game. The possibilities are endless.


    ```

    TUCOWS: HTTP://WWW.TUCOWS.COM

    ```'
