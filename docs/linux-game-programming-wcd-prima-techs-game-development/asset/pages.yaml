  md: '# LINUX GAME PROGRAMMING


    # FOLLOW SURFACE CONTOURS


    The other thing you know is how to make an object follow the contours of a surface
    (a vehicle driving over hilly terrain, for example). You need to find out the
    height of the surface along with its orientation so that you can run the vehicle
    to sit on top of it.


    Using the kinds of intersection techniques described in the preceding section,
    you can then use the plane equation to find the Y coordinate of a point on the
    plane that corresponds to the X Z coordinates of the object. That gives you the
    height of the polygon, which you can use with glTranslatef() to position your
    vehicle at the desired height. The surface normal of the polygon—plus a little
    trigonometry—gives you the rotation angles.


    # THE NEXT LAYER! SCENE GRAPH API


    In the preceding chapter, we took a swift gall through OpenGL API without too
    much concern for how apply this technology to games. Now we''ll take a step back
    and see how to apply what we''ve learned.


    One thing I''m sure you are thinking about is the amount of information it took
    to draw something-simple as a tetrahedron. Just how much would it take to draw
    the Enterprise and four Ronulan WarBirds? The simple tetrahedron contained four
    triangles, with three vertices each; each vertex had a glColor(), glNormal(),
    gluCoord(), and glVertex() command. That''s about 36 numbers for each triangle!
    When you consider a game like Quark and see an individual monster''s drawn with
    a thousand or more triangles, it''s readily apparent that you are not going to
    be typing all those vertices and commands by hand!


    In practice, you''ll ever enter vertex data by hand. It''s much more likely that
    you''ll use a kind of specialized CAD program called a modeler. There are several
    cheap (or even free) modelers for Linux, including Blender, AC3D, PrettyPoly,
    and Moonlight Creator. These programs allow you to enter 3D models in a natural
    way, without too much typing. It''s interesting that all four of these are written
    using OpenGL.


    Although modelers help you do the detailed work of creating the 3D models, you
    will still need to load those models into your program from data files on disk.


    > NOTE

    nYou can find Blender and PrettyPoly on the CD accompanying this book.'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'OpenGL was designed without a native file format because it''s focused on an
    efficient and flexible rendering mechanism. This means that if you want to load
    models from disk, you''ll either have to use a library that is layered on top
    of OpenGL or write the code to parse the data files yourself.


    There is really no single standard for storing 3D models on disk (although several
    formats as VRML try to take on mantle). Worse still, there are really no 3D model
    loaders that are analogous to libpng, libjpeg, and libgif for 2D images. The reason
    for that is that there is no data structure for storing 3D models in memory after
    they are loaded. To store a 2D image, on the other hand, you need little more
    than a 2D array of pixel values.


    I will not attempt to describe 3D file formats in detail; there are plenty of
    descriptions of them on the Web. Instead, I''m going to talk about a library layered
    on top of OpenGL to structure the storage of models—and here to provide a frame-work
    around which you can write standardized file loaders. Such libraries are sometimes
    called engines, but that term covers a multitude of other functions. A more concise
    term is scene graph API because most of these libraries store the 3D scene in
    some type of directed graph or tree structure.


    > NOTE

    A good place to find out file formats of any type is http://www.wotsit.org.


    # FIELD-OF-VIEW CULLING


    When you have the models you need in memory, it''s tempting to place them all
    in their correct positions in each frame using glRotate() or glTranslate() and
    let OpenGL get on with the business of drawing the models. Doing that would certainly
    work—providing that your game is simple enough and your computer is fast enough.
    But to make the best of your machine, you''ll need to help out OpenGL.


    One thing you can do to help is try not to give OpenGL things to draw that are
    obviously off the edge of the screen. Precisely how you do depends on the nature
    of your game. You might be able to say that all the monsters that are not in the
    same room as the player don''t have to be drawn (well, unless the doors are left
    open). You might also be able to discard objects that are behind you because they
    can''t be seen. In general, anything that lies outside your field of view (FOV)
    is not needed and doesn''t have to be drawn.'
