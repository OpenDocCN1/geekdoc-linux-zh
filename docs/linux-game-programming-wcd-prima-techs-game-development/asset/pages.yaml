  md: '# Your guide to creating games with Linux!


    With the growing interest in Linux on the desktop, it is only a matter of time
    everyone will enjoy high-quality Linux games. With commercial developers now setting
    up in-house teams for porting their titles to Linux, people are finally acknowledging
    that the OpenSource platform is a viable gaming platform. Linux Game Programming
    is your guide to game development for Linux, covering all the APIs and methodologies
    you will need, as well as some more advanced techniques discussed in other game
    development guides, such as neural networks and genetic algorithms. You will also
    find valuable information on 2D graphics using SDL, Xlib, and SVGA graphics using
    OpenGL; networking, lobbying, and threading; artificial intelligence and learning
    systems; genetic algorithms; and much, much more!


    # WHAT''S ON THE CD


    THE LATEST LINUX® KERNEL SOURCE


    INDREMA ENTERTAINMENT SOFTWARE DEVELOPMENT TOOLKIT


    MESA 3D VERSION 3.4


    OPENAL


    PRETTY POLY EDITOR


    SDL


    LINUX® SVGAL18


    AUTHOR CODE


    Mark Collins At the age of 18, Mark "Nungle" Collins secured a job in the games
    industry developing network support for a successful product line, as well as
    being considered a guru for game development for the GameDev community. After
    having many adventures, he''s starting up his own development studio with the
    goal of making games good again.


    # Series Editor


    # André LaMothe, CEO Xtreme Games LLC


    André LaMothe has been in the computing industry for more than 23 years and wrote
    his first game for the TRS-80B in 1976. He has worked in 2D/3D graphics, artificial
    intelligence at NASA, compiler design, robotics engineering, virtual reality,
    telecommunications, and has been a consultant to various companies in Silicon
    Valley. Andre is also the inventor of one of the world''s first commercially available
    reality games. CyberGate, created in the early 90s.


