    # TEXTURING THE MODEL


    The ability to apply textures to an OpenGL model is a tremendously powerful feature.
    You can use this ability to make surfaces more interesting by putting bricks on
    walls, grass textures on hills, and so on. But texture can do much more than this
    simple pattern: you can turn a simple cube into a visually complex building by
    texturing photographs of a real building into polygons.


    The images you use for texturing are commonly called texture maps, or just maps
    for short.

    Here are the steps involved in applying a texture to a polygon:


    +   1. Load an image.

    2. MIP map it and set texture parameters.

    3. Apply the texture.

    4. Select the texture coordinates for each vertex.'
