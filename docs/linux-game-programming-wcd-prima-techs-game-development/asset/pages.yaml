  md: 'base the timeout value on the time between pings being returned to the server.
    Again, this approach might cause problems with players who are suffering high
    latency (but if the latency is that bad, the game would probably be pretty unplayable
    as it is).


    You might also want the client to use a keep-alive system to make sure that it
    is still sending and receiving data from the server.


    # # NETWORKING IN GAMES


    All the stuff in this chapter up to this point is pretty generic and can be used
    in any application. The next sections cover some systems that are applicable only
    in games, such as sending only user input between the clients.


    # # DEAD RECKONING


    In-paced action games as Quake, latency on the network can cause major problems
    with the game. Latency can be combated by the use of dead reckoning on the clients.


    When the client isn''t receiving messages from the server, it continues processing
    the game logic based on the last known data until it receives an update from the
    server. This is fine for games played in a low-latency range, but if you''ve ever
    played Quake at a medium-ping range, you may have noticed characters suddenly
    jump around the screen.


    This jitter behavior caused by the client assuming that the character will take
    a different action than the server thinks the character will take. The server
    has full control of the gaming environment, while the server says is gospel.


    When the server updates the client machine with the game state, it sends only
    the information that has changed since the last update. At other times, it sends
    minor changes that affect play, such as a player changing direction or firing
    a weapon. The client bases its logic on a continuation of the last sent.


    There are further complications to this system, such as the infamous "death by
    lag" scenario. If player Bob is running towards a corner, and player Jim suddenly
    encounters some lag, Jim may see Bob running straight into a wall; he may then
    fire a few missiles. Meanwhile Bob, who isn''t affected by the lag, runs around
    the corner, sees Jim just standing there, and opens fire.


    Because the server processes only the data it has received, it considers Bob''s
    kill to have happened and updates all the clients with that version of events.'
