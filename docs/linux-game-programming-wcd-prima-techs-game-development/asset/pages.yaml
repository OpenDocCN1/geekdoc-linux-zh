  md: '# AUTHOR BIO


    The Infamous Mark “Nurgle” Collins, the teenager with an ego that dwarfs Texas,
    has worked in just about every area of the IT industry, from Web design to network
    consultancy, but one field has repeatedly attracted his expertise and outside-the-box
    thinking. That area is game development.


    In addition to all his hobbyist involvement, Mark has worked for one of the largest
