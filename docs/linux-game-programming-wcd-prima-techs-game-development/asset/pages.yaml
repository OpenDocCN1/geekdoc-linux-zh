  md: '# J


    Joystick. A type of input, frequently used for games.


    # K


    Kernel. The core of an operating system. The kernel controls access to the hardware.


    # L


    Lesser GNU Public License. An OpenSource operating system originally designed
    for use with libraries.


    Linux. A free OpenSource operating system originally created in 1991. Linux is
    used on millions of PCs and servers worldwide. It is the "official" operating
    system of China.


    LOD (Level of Detail). A technique in 3D graphics similar to MIP-mapping. The
    further away an object is, the lower the quality.


    Loki. A company that makes a living porting commercial games to Linux.


    # M


    Minix. A free UNIX operating system on which Linux was initially based.


    MIP-mapping. A technique to keep the quality of a scaled image high. Instead of
    scaling the image, you "render" different versions of it at different sizes.


    MMORPG (Massively Multiplayer Online Role Play Game). A large multiplayer environment
    over the Internet.


    # N


    Winter Nights. An upcoming MMORPG from the creators of Baldours Gate. This game
    will be available for various platforms, including Linux and BeOS.'
  merge: -1
