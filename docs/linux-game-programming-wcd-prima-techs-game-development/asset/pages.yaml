    # PLOTTING PIXELS


    After you worked out the format for your pixel, you can plot it to the screen.
    Before you do this, however you will have to lock the surface to prevent other
    parts of the program from accessing it. This is an issue if your program is multithreaded,
    but SDL requires you to lock the surface whether or not your program uses threads.


    SDL_Lock() takes only one parameter: the address of the surface to lock. On success,
    it returns 0; otherwise, you should use SDL_GetError() to see what went wrong.


    When you lock the surface, you must calculate the address to draw to. This isn''t
    necessarily the easiest of things to do if your math isn''t up to scratch. The
    SDL_Surface structure has a member called pixels that contains the actual image
    of the surface.


    To work out the exact location of the pixels you want to plot, you need to know
    how many bytes of memory are between each horizontal line. You can calculate this
    value using the color depth and the pitch of the surface definition. The exact
    formula for working out the location of the pixel follows (it may be worth making
    a little macro for this):


    ```

    offset = Y * pitch + X * bitdepth

    ```


