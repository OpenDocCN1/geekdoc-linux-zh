  md: '# LINUX GAME PROGRAMMING


    I set up this texture map with four bytes for each pixel and have packed the colors
    as red/green/blue/alpha at one byte each. This array defines a simple red-and-white
    checkerboard with all the alpha components set to 0xFF, which means that the colors
    are opaque.


    Most practical texture maps are much larger—256x256 is a commonly used size, and
    some cards allow 2Kx2K maps? It becomes quite confusing to talk about pixels on
    the screen and pixels in the textures, so 3D graphics programmers generally refer
    to texture maps as texels.


    There are some restrictions on the size and shape of texture maps in OpenGL: They
    have to be square or rectangular, with both dimensions being powers of 2 (1, 2,
    4, 8, 16, and so on). On PC-based hardware, we can cope with map sizes up to 256x256
    being supported, but assuming that the texture is loaded into main memory, we
    have next to perform a process known as MIP mapping.


    # MIP MAPPING THE IMAGE


    If you simply wallpapered a texture onto a polygon, when polygon moved off into
    the distance, it would eventually get so small that the wallpaper map would also
    have shrunk to appear at the correct size. If OpenGL shrunk the map by simply
    dropping texels, the textured image would look terrible. What''s really needed
    is to align the texels to color each screen pixel. However, that can get computationally
    expensive if, for example, a complete 2Kx2K map had to fit into a single screen—the
    map would have to add up four million numbers just to draw that single pixel!


    To avoid that, OpenGL uses a clever technique called MIP mapping. MIP is an acronym
    for the Latin phrase partim minim, which can be paraphrased as "a lot in a little
    size." The idea is to pre-compute not just the original texture map but also maps
    that are half sized, quarter sized, and so on, all the way down to a 1x1 map.
    This pre-calculation means that the hardware needs a map that''s a lot smaller
    than the one it is currently using, and one nearby that''s roughly the right size.


    It''s perfectly possible to create or load your MIP maps, but generally, it''s
    handy to use the function


    ```

    glBuild2DMMIPMaps(GL_TEXTURE_2D, 0, GL_RGBA, GL_UNSIGNED_BYTE);

    ```


    Finally, you need to tell OpenGL what you want to set for the rendering of the
    texture when it''s magnified or "minified" in OpenGL:


    ```

    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR_MIPMAP_LINEAR);

    ```


    To map the texture map, you have two choices:


    ```

    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);

    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_NEAREST);

    ```


    ![](img/8827e679048b592dad186c600299f274_145_0.png)'
