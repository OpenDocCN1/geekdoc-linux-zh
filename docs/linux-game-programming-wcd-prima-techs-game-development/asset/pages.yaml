- img_proc: true
  md: '# THE COMMUNITY ASPECT


    If there''s one thing the OpenSource movement has that closed-sourced developers
    generally don''t have, it''s a- sense of community. Apart from a few global mailing
    lists filled with professional developers (in whose company an amateur developer
    may feel intimidated), commercial developers generally don''t help each other
    unless they know each other from previous experiences.


    OpenSource developers are generally more welcoming of "newbies" than anyone else
    (although claiming to be female when you''re a few of them). Finding the help
    you need in an OpenSource community can prove quite easy, as long as you help
    others. An elitist programmer makes few friends in the real world.


    # AVAILABILITY OF THE SOFTWARE


    Commercial games are hard to get on the shelves, trust me. There are so many layers
    of bureaucracy to get through you''ll need an army of lawyers to handle all the
    paperwork. Problem doesn''t exist with OpenSource. If you write a good game and
    stick it on a Web site, before you know it, it will appear on every major Linux
    distribution out there, as well as on FTP archives mirroring those sites.


    # THE CAUSE


    I know some people who refuse to use non-GPL software, whether it''s OpenSource
    or not. They do this because they believe in "the cause" and because they have
    the same political beliefs that some other OpenSource gurus like Richard Stallman
    do. In my opinion, this is probably a bad thing to think.


    Just because something happens to fall under the GPL or some other OpenSource
    license doesn''t mean that it''s the best thing since sliced bread.


    # BECAUSE YOU LIKE IT


    Many OpenSource developers don''t really care about the whole OpenSource movement,
    but they write free games because they enjoy writing them. This is probably one
    of the best reasons for OpenSource development—not because you follow the same
    political agenda, or that you worship the ground Richard Stallman walks on, but
    because you want to, because you feel all warm and fuzzy inside.'
  merge: -1
