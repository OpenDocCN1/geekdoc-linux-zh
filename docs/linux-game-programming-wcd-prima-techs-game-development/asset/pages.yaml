  md: "# THE select() FUNCTION\n\nAs mentioned in the preceding section, recvfrom()\
    \ is a blocking function, meaning that it causes the cur- rent to wait before\
    \ continuing. This is not what you want your application to do in the middle of\
    \ a busy combat sequence. To counter this problem, you can use the function select()\
    \ to determine whether there are any incoming messages before calling recvfrom().\n\
    \n```\nselect(int n, fd_set *readfds, fd_set *writefds,\nfd_set *exceptfds, struct\
    \ timeval *timeout);\n```\n\nThe first parameter, n, is the highest number of\
    \ file descriptors in any of the three sets plus 1. The next three arguments are\
    \ blocks of file descriptors for data to be read, data to be written, and data\
    \ contain-ing exceptions respectively. The final argument, timeout, is how long\
    \ to wait before returning. This argument should be 0 (return immediately), but\
    \ you can choose to wait here. Be sure that you never edit set this argument to\
    \ NULL or select() indefinitely before returning.\n\nThe file descriptor blocks,\
    \ or FD_SETs, are controlled by a set of macros. You should never try editing\
    \ these blocks. The macros are listed here:\n\n```\nFD_CLR(int fd, fd_set *fds)\
    \      // Remove fd (descriptor) from fds (fd_set)\nFD_ISSET(int fd, fd_set *fds)\
    \    // Check if fd is in fds\nFD_SET(int fd, fd_set *fds)      // Add fd to fds\n\
    FD_ZERO(fd_set *fds)             // Empty fds\n```\n\nThe select() function returns\
    \ the number of descriptors contained with activity; it returns 0 if nothing\n\
    happ before the function times out. If -1 is returned, an error has occurred.\n\
    \n# ANOTHER MINI1-EXERCISE\n\nBefore reading the following block of code, add\
    \ to the evolving application in this chapter a loop that\n all incoming data\
    \ to stdout. Use the select() function where necessary."
