  md: "Polling was popular in the earlier days of computers, when reading from a device\
    \ was not handled by the operating system and required direct access to the hardware.\
    \ With the advent of modern operating systems such as Linux, polling has become\
    \ a less common way to receive input data from devices and has been superseded\
    \ by event queues.\n\n# # USING THE SDL EVENT QUEUE\n\nThe SDL event queue is\
    \ one of SDL's most powerful features. It does much more than simply relying keyboard,\
    \ mouse, and joystick events; it also relays important window manager events and\
    \ can be used as a simple messaging system.\n\n# # THE SDL_Event UNION\n\nThe\
    \ SDL_Event union is the key to all event handling in SDL. It can contain the\
    \ information of any SDL event supports. The SDL event queue is composed entirely\
    \ of SDL_Event unions; when an event occurs, an SDL_Event union is filled with\
    \ the required data and placed on the end of the event queue. The functions used\
    \ to read events from the head of the event queue use SDL_Event unions to return\
    \ their data.\n\n> A union in C/C++ is like a C structure (struct) in that it\
    \ can contain members of different types and sizes. Unlike structures, however,\
    \ all the members of a union are overlaid in the same storage space, and the compiler\
    \ allocates enough space for the largest member.\n\nIn SDL, each event type has\
    \ a structure associated with it: A mouse button event has SDL_MouseButtonEvent\
    \ structure, and a mouse event has SDL_MouseMotionEvent. The event structures\
    \ have two things in common: Their first member is a Uint8 called type, and they\
    \ are all contained within the SDL_Event union.\n\n# # LAYOUT\n\nFollowing is\
    \ the prototype for the SDL_Event union. This is returned by the event functions,\
    \ and it should contain the various details about the event that has occurred.\
    \ The details of the events are explained later in this section.\n\n```\ntypedef\
    \ union {\n  Uint8 type;\n  SDL_ActiveEvent active;\n  SDL_KeyboardEvent key;\n\
    ```"
