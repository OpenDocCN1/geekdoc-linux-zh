- img_proc: true
  md: 'The Linux joystick driver sees a joystick as a collection of axes and switches.
    The stick, throttles, hats, and balls are all mapped to axes—which can make things
    confusing when you''re trying to determine what is it. It is, however, to assume
    that the X axis of the joystick (its left-to-right motion) is mapped to the first
    axis and the Y axis of the joystick (its up-and-down motion) is mapped to the
    second axis. An axis has an integer range from -32767 to 32767; -32767 on the
    X axis is far left and 32767 on the Y axis is far down.


    # # HANDLING METHODS


    After you have decided which devices you will be supporting in your game, you
    must decide how you will actually read from the devices and use the data in your
    game. Reading from a device is often a complex task, requiring hardware knowledge
    and precise timing techniques.


    Thankfully, APIs like SDL are designed to do the grunt work for you. SDL gathers
    information from devices it implicitly (the mouse and keyboard) and from devices
    you explicitly tell it to open (joysticks). Internally, SDL keeps track of the
    state of all opened input devices and provides you with two interfaces through
    which you can read these states, event queues and polling.


    # # EVENT QUEUES


    A queue is a common data structure in computer science. It is much like a queue
    in real life: The person at the head of the queue is the next person to be served,
    and someone who wants to get in line at the end of the queue. A queue in computer
    science contains data; data at the head of the queue is processed. When data is
    removed from the queue. Data that needs to be processed is added to the end of
    the queue and is eventually processed when all the data ahead of it has been processed.


    Queues have many applications and can be useful for handling input. When an input
    "event" takes place—such as a joystick button being pressed—information about
    that event is added to the end of a particular queue called the event queue. With
    an API like SDL, the event queue is internal, and input events are added to the
    queue as they are detected.


    > NOTE A queue is more traditionally known as a FIFO (First In, First Out) array,
    where the data that goes into the array is first accessed.


    # # POLLING


    When you poll a device, you are asking what its current state is. Note that you
    are not asking it what has happened since the last time you polled it, you just
    want to know what is happening right now.'
