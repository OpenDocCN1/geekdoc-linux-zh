  md: "# 204 LINUX GAME PROGRAMMING\n\nHere's how the system works: When you initialize\
    \ the game, you run a test to see what sort of terrain is on each grid section.\
    \ Each of the types of terrain is assigned a value, terrain that's easier to pass\
    \ has a low value, while the tougher stuff gets a higher value. In addition to\
    \ the terrain, each grid has a number associated with the distance from the target\
    \ point. The further away from the target grid section is, the higher the value.\
    \ The distance value is stored in another array, separate from the terrain value.\n\
    \nMovement is the first check you perform to find which adjacent grid section\
    \ has the lowest distance value. (You do want your AI to move toward the target,\
    \ don't you?) When you have a list of potential squares to move into, you check\
    \ to see which has the lowest terrain value. Simple, no?\n\nHowever, there is\
    \ another factor worth considering. Imagine the situation in which you've sent\
    \ a group of artillery to attack the enemy base but your attack is wiped out in\
    \ a vicious retaliation. Do you want the artillery to go back to the same spot?\
    \ Of course not. If you consider that the attack means the terrain is more difficult\
    \ to cross, and adjust your terrain table accordingly, the artillery (in theory)\
    \ may take a safer route into.\n\nAnother trick you can do with this method is\
    \ to normalize the terrain array whenever it changes, to allow units to take clear\
    \ paths around the targets. Normalization can be performed using the method:\n\
    \n```\nfor (x = 0; x < MAP_WIDTH; x++)\n  for (y = 0; y < MAP_HEIGHT; y++) = (terrain_score[x-1][y]\
    \ + \n    terrain_score[x][y-1] + \n    terrain_score[x+1][y-1] + \n    terrain_score[x-1][y]\
    \ + \n    terrain_score[x+1][y]) + \n    terrain_score[x-1][y+1] + \n    terrain_score[x][y+1]\
    \ + \n    terrain_score[x+1][y+1]) / 8;\n```\n\nThis system, in essence, smoothes\
    \ the terrain ratings and prevents erratic movement from the units, which results\
    \ in more fluid motion.\n\n![](img/8827e679048b592dad186c600299f274_235_0.png)"
