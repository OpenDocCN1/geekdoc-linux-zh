  md: "# USING MESSAGE QUEUES TO COMMUNICATE\nBETWEEN THREADS\n\nThe other method\
    \ of interthread communication I will discuss here is a message queue. If you've\
    \ ever\ndone Windows programming, you'll have a basic understanding of how the\
    \ message retrieval systems.\n\nBasically, all messages are stored in a queue.\
    \ When you want to receive a message, you call\nGetMessage() or PeekMessage()\
    \ to get the next message to be processed. These functions pull the next\nmessage\
    \ from the message queue and allow you to act on it. We'll use this ideal idea\
    \ for our multi-threaded program.\n\nI won't go into too much detail about queues,\
    \ but I'll demonstrate the basic usage here. You'd place\nthis code somewhere\
    \ in the network receive loop in the function network_thread().\n\n```\nvoid *message_queue[QUEUE_SIZE];\n\
    int queue_position;\n\n// Get message from receive queue\nrecvfrom(sock, buffer,\
    \ BUFFERSIZE, 0,\nfrom, &len);\n\n// Add message to queue to be processed\nif\
    \ (++queue_position > QUEUE_SIZE)\nqueue_position = 0;\nmessage_queue[queue_position]\
    \ = buffer;\n```\n\nIn our game loop, the code would be read as follows:\n\n```\n\
    void *message_queue[QUEUE_SIZE];\nint queue_position = 0;\nint queue_start = 0;\n\
    \n// Read next message from queue\nif (queue_start != queue_position) {\n  //\
    \ New message in queue, so process it\n  process_message(message_queue[queue_start++]);\n\
    \n  if (queue_start > QUEUE_SIZE) queue_start = 0;\n```"
