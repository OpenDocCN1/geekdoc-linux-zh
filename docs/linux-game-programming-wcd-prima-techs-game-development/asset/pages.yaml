  md: '# SECURITY ISSUES


    There are a variety of security issues involved in multiplayer games, ranging
    from buffer overflows to denial-of-service attacks. Recently, there has been some
    exposure on the Security Focus mailing lists about these issues. As a developer
    you should do your best to make sure that your clients and servers are as secure
    as is humans possible.


    # BUFFER OVERFLOWS


    A buffer overflow occurs when the program tries to store too much data in an array
    that hasn''t been allocated enough space. In most circumstances, the program crashes,
    but some buffer overflows are exploitable, meaning remote users can send code
    to be executed on the target computer.


    To prevent a buffer overflow, always make sure that your program doesn''t make
    assumptions about the size of data being copied. Use functions where you can specify
    the amount of data to copy, such as memcpy() and strncpy().


    # DENIAL-OF-SERVICE ATTACKS


    Because most game servers run UDP, it is possible for someone to spoof your IP
    address and cause a flood of packets to be sent to a target computer. This isn''t
    an easy attack to prevent, but there are methods.


    Have your clients establish a TCP connection to the server so that you can first
    authenticate your IP addresses; only after the connection has been confirmed should
    you then send UDP data. In this way, you can make it a lot harder to achieve the
    kind of attack just described.'
