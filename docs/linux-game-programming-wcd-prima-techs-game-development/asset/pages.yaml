  md: 'ULTRA. If your hardware does not implement a feature, the OpenGL driver emulates
    feature in software—and your program will not be aware of any problem that it
    may run rather slowly. In addition to the core functionality, OpenGL implementations
    are allowed to extend the API to take advantage of the special features of some
    cards that lie outside the core functions.


    This flexibility is something of a double-edged sword. Any program written using
    OpenGL should work correctly on any implementation, if you want the program to
    run quickly, you''ll have to pay careful attention to particular OpenGL cards
    are likely to be fast on most 3D hardware. We''ll discuss these parameters in
    more detail later.


    So can OpenGL do? 3D applications decide the game''s "world" and everything in
    terms of textures, lines, and points—each of which can be colored, illuminated
    by light sources, forged by the simulated atmosphere, and "textured" by wall-papering
    with a picture of some kind. This may sound limiting, but keep in mind that even
    graphically sophisticated games like Quake are in OpenGL using those basic primitives.
    Even multimillion-dollar flight graphics systems are most often using OpenGL.


    Some things OpenGL does not do: It doesn''t deal with opening a window to draw
    the graphics, and it doesn''t include routines for keyboard, mouse, joysticks,
    text output, or GUI elements such as menus, buttons, or sliders. Consequently,
    you will have to include some other library to handle those things. Simple OpenGL
    games use Mark Kilgard''s GL Utility Toolkit (GLUT) library or its OpenSource
    clone, freeglut. GLUT is also used in examples in most OpenGL manuals, but there
    are plenty of alternatives to this library. Nearly all Linux GUI toolkits provide
    a way to create a window into which OpenGL can render; use SDL, GTK+, FLTK, T/Tk,
    Lessif, or even raw Windows windows.


    In addition, you''ll probably want to use add-on libraries to load textures, to
    images, and perhaps to handle some of the low-level drawing for you. A good place
    to look for these things is the official OpenGL Web site, located at http://www.opengl.org.


    OFFICIAL OPENGL WEBSITE! http://www.opengl.org


    Early versions of Mesa had support for software-only rendering under SVGlib, but
    as I write this, that version is not actively maintained. All modern implementations
    of OpenGL for Linux work within the XFree80 window system. If you are a console
    programming enthusiast, you''ll either have to get into X or forget about doing
    hardware-accelerated 3D graphics.


    # WHERE CAN 1 GET OPENGL?


    Unless your Linux distribution is hopelessly outdated, you''ll probably find that
    Mesa is already installed. However, it''s possible that you''ll need to hunt down
    a vendor-specific version to take advantage of your hardware. The site at http://mesa.3d.org
    is a good place to start that search. However,'
