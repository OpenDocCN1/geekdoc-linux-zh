  md: '# PUTTING IT INTO PRACTICE


    In tic-tac-toe, the objective is to get three of your symbols (an X or an O) in
    a row while preventing the other player from doing so. This objective must be
    considered for our scoring system. How can that be achieved? Well, before you
    get three in a row, you get two in a row. That''s a good starting point. What
    other factors are involved? If the opposition has two in a row, we need to block
    his, preventing him from placing a symbol in the winning cell. Although this move
    rarely offers us an advantage, it ensures that the opponent has to try a different
    pattern, thereby lowering his score when we win. So we have our scoring system:
    the number of symbols you have in a row.


    Now that we''ve decided on a scoring system, we need to build a tree that holds
    all the possible states for the next couple of moves. Although we could, in theory,
    hold all possible states for every single game, that''s not really practical and
    takes the fun out of it (the game would always end in a draw or a victory for
    the computer, a Deep Blue versus Kasparov). In theory, with each cell being one
    of three values (X, O, or unused), we could use a 24-bit variable to store the
    game data (two bits for each cell require a total of 18 bits), but that''s a bit
    of overkill. A simpler option is to use an array of nine characters.


    So what information is our min-max tree going to hold? Well, there are nine possible
    places for each symbol in the game, with each cell being one of three values (X,
    O, or unused). Using the system from our path-finding examples earlier in this
    chapter, we can incorporate the nine-character array into our game using the following
    structure:


    ```

    typedef struct GameOver {

    char cells[9];

    char my_score, their_score;

    GameBoard *children[9]; // There are a total of 9 possible moves

    };

    ```


