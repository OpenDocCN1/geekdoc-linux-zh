  md: "# LOADING A SOUND FILE\n\nWe're almost ready to play a sound (not really),\
    \ but first we have to load a sound into memory. There are a number of ways to\
    \ do this, but I will focus on the more complicated method here. I'm not just\
    \ being sadistic; later in this chapter, I will talk about streaming buffers,\
    \ and you will need to know how to load the samples without assigning a buffer\
    \ to them to do that.\n\nThe function alutBufferAndConvert_LOKI() (in the file\
    \ atext.h, which is an extension to the API added by Loki) converts a WAV file\
    \ loaded memory into an audio buffer that can be used by OpenAI. The function\
    \ prototype is here:\n\n```\nALAPI Alboolean alutBufferAndConvert_LOKI(Aluint\
    \ Albid, void *data,\nAlboolean dummy, Aluint size);\n```\n\nThe first argument\
    \ is the identifier of the sample to convert. These are user-definable, and used\
    \ when assigning the buffer to a source. The next argument is the WAV sample data\
    \ to convert, and the final argument is the size of the data (bytes). The dummy\
    \ argument is exactly that: a dummy argument that should be set to AL_TRUE just\
    \ to be safe.\n\nThe following code demonstrates how to load a WAV file into a\
    \ buffer. Add it to our evolving program after the block of code that set up the\
    \ listener.\n\n```\nfp = fopen(\"boom.wav\", \"rb\");\nif (!fp) {\n    // Clean\
    \ up and quit\n    fprintf(stderr, \"Can't load file boom.wav\\n\");\n    alDestroyContext(context);\n\
    \    return 1;\n}\n\n// Read the WAV data\ndata_len = fread(data, 1, DATABUFFSIZE,\
    \ fp);\nfclose(fp);\n\nif (!alutBufferAndConvert_LOKI(sound_buffer, data,\nAL_TRUE,\
    \ data_len)) {\n    fprintf(stderr, \"Invalid file format\\n\");\n    return 1;\n\
    }\n```"
