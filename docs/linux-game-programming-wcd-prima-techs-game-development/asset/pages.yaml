  md: '# DRAWING TO THE SCREEN


    The Xlib routines for drawing graphics are relatively (!) straightforward. Depending
    on what you want to do, you have a range of functions from which to choose. I''ll
    start with the simpler ones, such as drawing text to the screen.


    # PLOTTING A PIXEL


    The easiest thing to do when any graphics is usually plotting a pixel. This rule
    also applies to programming in X, but because it is X, plotting a pixel still
    isn''t the easiest thing in the world to do. Before you can draw anything, you
    must initialize several items, including "drawables" and graphics contexts.


    I''ll start describing the Graphics Contexts (GCs for short). These are like the
    surface definitions in SDL and similar to Device Contexts used in Windows programming.
    The function to create a GC is XCreateGC(); its prototype is shown here:


    ```

    extern GC XCreateGC(Display *display, Drawable d, unsigned long mask, XValues
    gcv);

    ```


    As is for most Xlib functions, XCreateGC() needs to know about the machine running
    the X server. This information is passed using the display argument. The next
    argument, the drawable, is the "surface" you want to draw on (in this example,
    it''s the window, but it could be a pixmap or another drawable object). The next
    parameter is a mask of values which are used in the description; the description
    itself is the final argument.


    The available masks for XCreateGC() as well as the GCValue member they refer to
    are shown in Table 4.3. The only value mask is GCForeground; the other masks are
    covered later in this chapter. To set a color, use [ColorPixel()] functions, such
    as BlackPixel() or WhitePixel(), as demonstrated in Xsample.c, earlier in this
    chapter.


    After you set up your GC, call XCreateGC() to create a new Graphics Context. You
    can draw pixels to the screen (or use any other graphics operation that requires
    a GC). You can use the XDrawPoint() to plot single pixels. XDrawPoint() takes
    five parameters: a drawable, a GC, and the window coordinates, in the following
    function prototype:


    ```

    extern int XDrawPoint(Display *display, Drawable d, GC gc, int x, int y);

    ```


    Now it''s time to put the theory into practice. Take the sample program Xsample.c
    and add the following lines just before we initialize GC to enable us to draw
    something on the screen:


    ```

    GC gc;

    XValues gcv;

    int x, y;

    ```


    ![](img/8827e679048b592dad186c600299f274_76_0.png)'
