- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    # FILE ATTRIBUTES AND HOME DIRECTORIES


    Although Windows does some support for multiple user accounts, most (all?) Win32
    games assume that the system is for a single user. If games have any sort of user-profile
    support, they inevitably ignore any features provided by the OS and implement
    it themselves.


    The Windows user typically runs with the Windows equivalent of root access and
    has read/write access to all files. This contrasts strongly with file security
    on UNIX-based systems in which the user usually has write access within his home
    directory. This security difference can cause problems if the game requires write
    access. Under Windows, the game assumes that it can always write. Under Linux,
    the game will be in a rude shock. Here are some solutions:


    +   - Allow installation (as root) to somewhere sensible and have the installation
    process change the permissions on any files or directories the game needs to write.
    This is probably workable, but not like "The Linux Way" and raises security issues.
    This solution reeks of unspeakable evil.


    +   - Force the user to play the game with root permissions.


    +   - Separate the game files into two groups: read-only and read/write. Install
    the read-only files in /usr/games or /usr/local/games and store the writable files
    in the user''s home directory. This is the True Answer. With this solution, you
    can easily support multiple users, each with his own in-game preference settings
    and saved games. Whenever the game starts, you can check the user''s home directory
    to see whether he has played. If not, you can create a fresh profile by copying
    a template set of files from the read-only part of the installation. An easy way
    to do this is to use a shell script "wrapper" to launch the game.


    # ASSEMBLY LANGUAGE


    Games are usually performance-critical applications, often employing hand-tuned
    assembly language to speed up hot spots. Porting assembly to Linux can be fickle
    because the GNU tools use a different syntax than the Microsoft tools. Note that
    the assumption here is that the port is being done from Windows to Linux on the
    32-bit i386 architecture (IA32, as Intel now likes to call it). With the same
    processor, porting assembly is mainly an exercise in translating the code into
    the expected syntax. Porting assembly between different processors will almost
    always require a rewrite'
  merge: -1
  pgno: 317
- img_proc: true
  md: 'Hopefully, all the assembly routines will still have the equivalent C source
    code available for you to use. If you have the source code, you can at least get
    the game up and running. If there is no C equivalent, it may be worth writing
    it as your first step—especially if you are porting to another processor.


    The GNU tools use the AT&T assembly syntax rather than the Intel syntax used by
    the Microsoft tools. However, there are other assemblers available for Linux.
    Of particular note is NASM, the NetWide Assembler. It uses the more traditional
    Intel syntax and so provides an easier target for code originating on Windows.


    The following sections describe some of the differences between Intel and AT&T
    syntax.


    # OPERAND ORDER


    Intel syntax uses instructions of the following form:


    ```

    op dest,src

    ```


    AT&T reverses the source and destination operands:


    ```

    op src,dest

    ```


    If you have done a lot of programming using one syntax, the other can take some
    getting used to.


    # REGISTER NAMING


    AT&T syntax prepends a symbol (%) to register names: %eax, %ebx, and so on. Intel
    syntax uses unorned register names.


    # OPCODE NAMING AND OPERAND SIZE


    AT&T syntax adds b, w, or l to the opcode name to denote 8-bit, 16-bit, and 32-bit
    instructions respectively. Where the instruction size is clear from the operation,
    you are allowed to use the plain opcode name. For example, add %eax, %ebx is obviously
    a 32-bit operation. The explicit specification of size must be used whenever the
    size of the operands is ambiguous. For example, use incl foo to increment the
    32-bit variable at memory location foo.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# IMMEDIATE VALUES


    Immediate values are prefixed with a $ in AT&T syntax. For example, the following
    are considered to be reads from memory locations:


    ```

    mov 100,%ax

    mov wobble,%ebx

    ```


    However, the following statements copy immediate values (the address of wobble
    in the second case):


    ```

    mov $100,%ax

    mov $wobble,%ebx

    ```


    # ADDRESSING MODES


    AT&T addressing modes take the following form:


    ```

    offset(base,index,scale)

    ```


    In this syntax, scale can be 1, 2, 4, or 8. Any unused term can be omitted.


    # ENDIANNESS


    No guide to porting would be complete without a section on endianness. Little-endian
    processors (for example, i386 or Alpha) store multi-byte numbers with the least
    significant byte first. Big-endian processors (such as PowerPC, MIPS, and Sparc)
    store the most significant byte first.


    The 32-bit hex value 0x1234567 is stored in memory on a big-endian machine like:


    ```

    0x12, 0x34, 0x56, 0x78

    ```


    That value would be stored on a little-endian machine like:


    ```

    0x78, 0x56, 0x34, 0x12

    ```


    In most code, you won''t care which ordering the processor uses. The problems
    start when you want to share values with processors using the other convention.
    Form formats and network protocols are the usual suspects; they are places where
    numbers sneak out of the code into the world beyond.'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'The solution is to define and use conventions. Network protocols, for example,
    traditionally send and receive values in "network byte order" which is big-endian.
    Implementing this on a little-endian machine requires code that translates values
    into the host format (by reversing the byte order). BSD sockets API provides functions
    to handle this translation:


    | Function | Description |

    | :--- | :--- |

    | htonl() | Host order to network order (long int) |

    | htons() | Host order to network order (short int) |

    | ntohl() | Network order to host order (long int) |

    | ntohs() | Network order to host order (short int) |


    A similar approach can be used on binary file formats. The ordering convention
    on disk should be independent of the processor used. If the game being ported
    has only ever run on one platform, then it just writes values out whatever ordering
    the original processor uses. In this case, the choice of convention has been made
    for you already; if you want to retain data file compatibility, you have to go
    along with it. Porting to a processor with different endianness involves going
    through the file and network code with a fine-tooth comb, looking for values that
    need translation.


    Keep in mind that Linux is not an i386-specific operating system. The large range
    of architectures it runs on is one of its insanely cool features, and it''s well
    worth your time to maintain support for all these architectures!


    # WINDOWS ISSUES


    As well as the differences between compilers and operating systems, there are
    also several differences in the way you program for each of them. Windows has
    a habit of forcing developers to do the things "Microsoft Way."


    # WinMain() AND MESSAGE LOOPS


    The entry point for Win32 applications uses the WinMain() function instead of
    the more traditional main(). Its prototype is shown here:


    ```

    int WINAPI WinMain(HINSTANCE hInstance,

    hINSTANCE hPrevInstance,

    LLPSTR lpCmdLine,

    int nCmdShow );

    ```'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    Most of the arguments passed in are pretty irrelevant. The IpCmdLine parameter
    holds any arguments that were passed in during process creation, such as a raw
    version of argc/argv. In fact, the Microsoft C runtime library also provides a
    "cooked" version of IpCmdLine in the form of _argc and _argv. nCmdShow shows an
    enumerated value with the desired visibility state of the application (which is
    usually ignored).


    WinMain() typically initializes the application, opens a window, and then drops
    into a message loop. The message loop waits for incoming messages (user input,
    timers, window repaint requests, and so on) and dispatches them to the WindowProc
    handler of the window using the Win32 DispatchMessage() call. WindowProc usually
    takes the form of a large case statement that switches on message type.


    When porting a Windows game to Linux, you''ll have to replace WinMain() and the
    message loop. Most of the logic should carry onto whatever framework you use—be
    raw X or an extra library (SDL, for example). You may have to shuffle things around
    a bit, but this will be for your project to manage, there are no concrete rules.


    # TIMERS


    Most games are driven using a function that performs a single game update. This
    function must be called at regular intervals to keep the game running. Under Windows,
    this call might be made as part of the message loop in WinMain(), or it might
    be called from the WindowProc in response to a timer message.


    Here are some of the timing mechanisms used in Windows:


    +   - SetTimer() and WM_TIMER. The SetTimer() call specifies a frequency at which
    Windows sends WM_TIMER messages to be processed by the message loop. This mechanism
    is very easy to implement, but the timer is of too low resolution to be useful
    for most games.

    - Multimedia timers. These high-resolution timers are set using timeSetEvent().
    A callback will be called at the specified frequency that often sends a user-defined
    (WM_USER+x) message to the message loop.

    - Separate timer thread. An extra thread is created to send regular tick notifications
    to the main thread. The multimedia timer method, this notification is often done
    by sending a user-defined Windows message to the message loop. In fact, multimedia
    are implemented in Windows using a timer thread.

    - Sleep(). This calls the current process to wait for the specified number of
    milliseconds. Often this is used as part of the main loop: sleep for an interval,
    perform a game update, process any pending window messages, repeat.

    - QueryPerformanceCounter(). This call polls the high-performance tick counter
    on the processor. This is the most accurate timing function available in Windows.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# THE REGISTRY


    Most Windows programs store configuration information in the Windows Registry,
    a hierarchical structure that holds named values. Applications usually store their
    settings in the following Registry keys:


    HKEY_LOCAL_MACHINE\Software\[vendorname]\[app name]\...

    HKEY_CURRENT_USER\Software\[vendorname]\[app name]...


    HKEY_LOCAL_MACHINE is for global settings across the entire machine; however,
    most Windows games don''t bother any user account features in the OS, so the use
    of these two branches can often be somewhat fuzzy.


    A configuration file is the obvious alternative implementation. You can change
    all the game code that accesses the Registry so that instead uses a configuration
    file. Alternatively, you can implement a subset of the Registry API (which reads
    and writes to a file). Unless the game accesses the Registry lot, the former option
    is probably the better one.


    # HUNGARIAN NOTATION


    Microsoft uses a naming scheme known as Hungarian Notation, which involves prefixing
    identifiers with a type tag. Windows uses Hungarian Notation extensively in its
    APIs and type definitions, and, by osmosis, many Windows programs have also adopted
    the convention. If you haven''t yet come across it, Hungarian Notation can be
    a little unsettling.


    Here are some example names:


    | Variable Name | Meaning |

    | --- | --- |

    | cbSize | A byte count |

    | fSuccess | A flag |

    | hwndParent | A window handle |

    | lpszFile | A pointer to a string (the l indicates a "long" or "far" pointer,
    a drawback to 16-bit days) |


    Some people love Hungarian Notation, others find it ahetically offensive. Regardless
    of which camp you fall into, you''ll probably have to read it.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    # GRAPHICS


    Porting graphics code from Windows is generally regarded as “The Biggie”—the main
    barrier to running Windows code under another OS. The main reason for this is
    DirectX, the collection of Microsoft APIs designed for games. DirectX is a closed
    system that is specific to Windows. However, if the original Windows code is well-structured,
    it may not be as hard to port as you think.


    # DIRECTDRAW


    DirectDraw is the 2D component of DirectX. It is a reasonably thin abstraction,
    providing access to the frame buffer and features such as hardware accelerated
    blitting.

    Porting from DirectDraw to another API can be quite straightforward because DirectDraw
    concepts map well to other APIs. Most 2D APIs work in terms of manipulating surfaces.
    Here is a short list of some basic surface operations:


    +   - Accessing surface memory (between lock/unlock guards)

    - Blitting pixel data between surfaces

    - Surface memory management (allocating surfaces in either main system memory
    or in video memory)

    - Double buffering, page-flipping


    The main thing is to understand your target API and to understand the intent of
    the original DirectDraw calls.


    # DOS FRAME BUFFER


    DOS games traditionally use the frame buffer by directly accessing hardware registers
    or using low-level BIOS or VESA calls.

    Actual pixel manipulation is done by accessing video memory. This is made more
    complicated by the need for bank switching, a process by which video memory can
    be accessed only through a memory window that may have to be moved around to access
    the entire frame buffer. This is why 320x200x8-bit (mode 13h) was so popular;
    it used a small-enough section of memory to be accessible through a single 64K
    window without the complications of bank switching.'
  merge: -1
  pgno: 323
- img_proc: true
  md: 'Many DOS extenders provide mechanisms to map the frame buffer into a single
    linear area of memory. The VESA interface also provides frame buffers on some
    hardware.


    Games using linear frame buffers correspond nicely to the display surfaces presented
    by most modern graphics APIs and shouldn''t cause too many parenting headaches.
    Code using bank switching might require a little more reworking.


    The hardware access under DOS also means that more esoteric hardware features
    could be used. Probably the most (in)famous example is ModeX, in which each access
    accesses four pixels. A latch register sets of those four pixels is affected.
    The benefit of ModeX was that it allowed you to squeeze multiple frames into a
    memory window, which in turn opened up the option of hardware paging flipping
    and smooth scrolling techniques. ModeX code will definitely require some prompting


    # DIRECT3D


    Access to accelerated 3D hardware in DirectX is provided by Direct3D. The only
    real option whening this code to Linux is to rewrite the 3D code using OpenGL.


    If the original code was well designed, the incidence of Direct3D may be quite
    localized, which will help a lot. Many games use an API-neutral high-level layer
    to deal with aspects such as object geometry, spatial partitioning, culling, and
    so on. This layer is built on top of an API-specific low-level back end that actually
    pushes polygons out to the video card. If you provide a replacement low-level
    layer, the rest of the code will be:


    Again, there''s a reasonable chance that the original code was badly written and
    that the raw Direct3D API is exposed in code and data structures all over the
    place. In this case, you''ll just have to rewrite the whole shebang. Joy.


    Because Direct3D and OpenGL are both trying to expose the set of hardware features,
    there is some degree of agreement between the two APIs—they encapsulate the same
    concepts. Indeed, recent versions of the Direct3D API have been moving noticeably
    towards the style of interface provided by OpenGL. This is a really Good Thing,
    and will make your portant task easier.


    The following sections address some of the differences and similarities between
    OpenGL and the Direct3D API.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '# 294 LINUX GAME PROGRAMMING


    # COORDINATE SYSTEMS


    OpenGL uses a right-handed coordinate system while Direct3D uses a left-handed
    system. However, the OpenGL Model matrix can be fudged to produce a left-handed
    system by scaling Z by -1. The following example shows the existing Direct3D coordinate
    system and, by simply applying the glScale(), it transforms it into an OpenGL
    system:


    ```

    glMatrixMode(GL_MODELVIEW);

    glLoadIdentity();

    // want left-handed coordinate system

    glScale(1.0, 1.0, -1.0);

    // now transform as usual...

    ```


    # POLYGON WINDING


    Direct3D identifies front-facing polygons as polygons that have their vertices
    listed in clockwise order. In OpenGL, the default assumption is that front-facing
    polygons are defined in counter-clockwise order. This behavior can be changed
    using glFrontFace():


    ```

    void glFrontFace( GL_Cenum mode );

    ```


    In this syntax, mode is GL_CW for clockwise and GL_CCW for counter-clockwise.


    # TEXTURE MANAGEMENT


    Textures in OpenGL are very opaque objects. Once you''ve created a texture and
    passed it in, the rest is handled for you. You don''t have to worry about juggling
    video memory requirements or using the transfer mechanisms to shuffle texture
    data out from system memory or any other potentially hardware-specific operations.
    These things are left up to the driver.


    The earlier versions of Direct3D assumed that the programmer would require complete
    control of texture management details—essentially, each application could provide
    its own custom texture management. Although more recent versions of Direct3D provide
    automatic texture management in a style similar to OpenGL, porting code written
    using the older systems could pose some challenges.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# OPENGL EXTENSIONS


    At first glance, you may think Direct3D has some features that are missing from
    OpenGL. In fact, most of these features are actually provided as OpenGL extensions.
    Extensions take the form of new functions or new enumerators to existing functions.
    A runtime query must be performed to determine whether OpenGL drivers support
    the required extensions.


    A good example is multitexturing, in which the hardware can perform multiple rendering
    passes in one go. Most consumer 3D cards these days have this capability. In OpenGL,
    multitexturing is exposed with the `_multitexture` extension.


    In general, if Direct3D provides a hardware that is missing from the base OpenGL
    specification, there will be an OpenGL extension to support it.


    The OpenGL Web site at http://www.opengl.org maintains up-to-date information
    about extensions. Of course, the hardware manufacturers themselves use extension
    information available to encourage you to support the new features on their latest
    and greatest chipsets.


    # Sound Issues


    Unless the original sound code was written using a cross-platform API, you''ll
    be looking at a complete rewrite for these sections of the original game. The
    good news is that sound code is quite well encapsulated. Most games have a very
    well-defined set of sound requirements: play a sound effect, a music track, change
    the volume, and so on. Porting the sound code is a matter of retaining the interface
    seen by rest of the game while replacing the implementation.


    DirectX provides audio support through the DirectSound API. It''s quite a low-level
    interface, centered around managing sound buffers containing waveform data. This
    contrasts somewhat with the file-centric Linux approach to audio generation, which
    involves streaming waveform data out to an audio device.


    # Networking Issues


    # WINSOCK


    The Winsock API provides a Windows implementation of the familiar BSD library.
    But it has some quirks that can make porting tricky.'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    # FILE AND SOCKET HANDLES


    The "everything-is-a-file" approach of UNIX means that file handles and socket
    handles are usually interchangeable. Windows does not allow you to treat sockets
    as files. When UNIX file and socket handles are usually just integers, Wins defines
    the data type SOCKET to represent socket handles.


    Where a UNIX program uses read() to pull data in from a socket, the Windows equivalent
    has to use the socket-specific recv() or (WSARecvEx()). Fortunately, this difference
    falls in your favor because socket-specific calls such as recv() also work in
    UNIX.


    # INCLUDE FILES


    Winsock is included in your code winsock.h or winsock2.h. The winsock2.h header
    is for version 2 of the Winsock API, which now seems to be more or less standard.
    BSD sockets on UNIX require various files, depending on the features being used.


    # RETURN CODES


    Although Winsock and BSD sockets share a basic set of error conditions, the way
    conditions are communicated differs. Most socket calls return a 0 to indicate
    success. On failure, Winsock returns SOCKET_ERROR instead of the more traditional
    -1. Additionally, Winsock uses INVALID_SOCKET to denote a bogus socket handle
    where BSD socket calls again use -1.


    The Winsock header files define SOCKET_ERROR as -1 and INVALID_SOCKET as -0 (which,
    from a bitwise point of view, is also -1). Winsock does, in fact, use the same
    return codes as BSD sockets, but the naming is defined.


    If an error occurs, you''ll need to know more: "What type of error? What happened?
    Can I recover?" BSD sockets use the standard errno variable used by other file-handling
    calls. As a consequence of Winsock sockets not being real file handles, errno
    does not work. Instead, WSAGetLastError() provides the same functionality. The
    codes returned are pretty much the same as those used by errno, except that they
    have been given a WSA prefix. For example, WSAECONNRESET corresponds directly
    to ECONNRESET.'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# DIFFERENT CALLS


    Winsock provides most of the standard calls present in BSD sockets. Most of these
    also have one or more Winsock-specific versions. Sometimes, the Winsock versions
    provide significant extra functionality; other calls appear to be present merely
    for the sake of consistency. For example, recv() and WSARcvEx() are almost identical,
    but select(), WSAAsyncSelect(), and WSAEventSelect() all work differently.


    Some differences between Winsock and BSD sockets are a consequence of the non-file
    handle aspect of Winsock sockets. We''ve already seen that the BSD errno functionality
    is provided by WSALastError(). Following are some other examples of the differences
    between Winsock and BSD sockets:


    +   * The BSD-close() call in the Microsoft C runtime library will not work with
    Winsock sockets.

    * Sockets should instead be using the closesocket() call.

    * Winsock provides ioctlocket to replace the BSD ioctl() call.


    # DIRECTORY IS EVIL


    Some Windows games use DirectPlay for their network requirements. Like all the
    DirectX components, DirectPlay is a proprietary API. This wouldn''t be too bad—you
    can always port to another API—except that DirectPlay also imposes a proprietary
    network protocol. This means that the people playing your Linux port will not
    be able to play with people running the Windows version of the game. It''s a bad
    situation, and until the protocol is opened up by Microsoft (or by someone with
    good reverseengineering skills!), you''re out of luck. The best you can do is
    to persuade programmers and game players not to support DirectPlay unless it is
    freed by Microsoft.


    DirectPlay is a prime example of why proprietary protocols are a Bad Thing™.


    # USEFUL LINKS


    The Mozilla project has a good section on portable coding in C++. It is pretty
    comprehensive, and you''ll want to pick and choose from their advice given:


    ```

    http://www.mozilla.org/hacking/portable-cpp.html

    ```'
  merge: -1
