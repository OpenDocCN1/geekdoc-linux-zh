    If you replace initCamera() in this way, you''ll notice that the sides of the
    tetrahedron have vanished, and all you can see is a huge spinning wheel triangle.
    That''s because the tetrahedron''s apex is at (0.0,0), where the camera is. "Losing
    the model" is a frequent problem when you first write 3D programs; the usual treatment
    for this condition is to change your program so that the camera moves backward
    until it comes into view and you can see what''s going on.


    Confusing, OpenGL doesn''t allow you to "move the camera"; it''s always at the
    origin facing along the Z axis. The way we give the impression that you are moving
    around the virtual world is to transform the world in the opposite direction to
    the way we want the camera to move. That is, rather than the camera advancing
    through the static world, the world moves past the static.


    Now we have to add a glTranslatef() call to the ModelView matrix setup in the
    redisplay function, as shown:


    ```

    glLoadIdentity();

    glTranslatef(0.0f, 0.0f, -10.0f);

    glRotate(a, 0.0f, 0.0f, 1.0f);

    ```


    The order of matrix operations is generally rather important because matrix multiplication
    is not commutative as simple numbers (in other words, AxB doesn''t always equal
    BxA if A and B are matrices).


    We can make the camera move backward (by ten units in this example) by moving
    the model forward ten units. Because "forward" means along the negative Z axis
    in OpenGL, we must apply a translation of -10 to give the impression that the
    camera moved back ten units. The resulting code is in ex4.c on the CD-ROM.


