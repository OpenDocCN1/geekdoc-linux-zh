  md: '# LINUX GAME PROGRAMMING


    This simple sample creates an audio context and destroys it. Useful, no? Well,
    not really. Now we actually need to play some sounds!


    # CREATING LISTENERS


    Before we can set up a sound source, we first need to tell OpenGL exactly where
    the listener is in the scene. We do this in the same way that we''d set up a camera
    position in OpenGL before drawing any tetrahedra. We establish the position of
    the listener using a series of calls to a function called allListenerfv(). This
    function is similar in many ways to OpenGL vertex and lighting functions.


    The function prototype for allListenerfv() is as follows:


    ```

    ALAPI void * ALAPIENTRY allListenerfv(ALenum pname, ALfloat *param);

    ```


    The first argument, pname, is the name of the listener we want to change. There
    are three possible options: AL_POSITION (the position of the listener), AL_ORIENTATION
    (the direction), and AL_VELOCITY (the speed). The properties we are interested
    in at the moment are the first two, and position and direction of the listener.


    Where our little sample code has the comment XXX1, add the following two lines
    of code:


    ```

    ALfloat listener_pos[3] = (0.0f, 0.0f, 0.0f);

    ALfloat listener_dir[3] = (0.0f, 0.0f, -1.0f);

    ```


    These statements specify the coordinates (the middle) and the direction of the
    listener (facing forward). Before these values are used by OpenGL, you need to
    inform the API of these little, but important, factors. Add the following code
    to where the comment reads XXX2:


    ```

    // Set up the listener

    allListenerfv(AL_POSITION, listener_pos);

    allListenerfv(AL_ORIENTATION, listener_dir);

    // Stationary listener, so no Doppler shift needed

    allListener3v(AL_VELOCITY, 0.0f, 0.0f, 0.0f);

    ```


    > NOTE

    You are limited to only one listener per scene, but you can move the listener
    around to create the illusion of multiple sound sources.'
