- img_proc: true
  md: 'The CD-ROM that accompanies this book contains both source code (when available)
    for SDL, OpenGL, IESDK, PrettyPoly, Mesa3D, SVGAlib, and source code only for
    Linux Kernel 2.2.18, 2.4.0, and 2.4.1. The CD-ROM also has all the sample files
    that the author used throughout the book.


    # RUNNING THE CD-ROM WITH WINDOW 95/98/2000/NT


    To make the CD user-friendly and take less of your disk space, no installation
    is required to view the CD. This means that the only files transferred to your
    hard disk are the ones you choose to copy or install. You can run the CD on any
    operating system that can view files; however, not all the programs can be installed
    on all operating systems.


    +   1. Insert the CD into the CD-ROM drive and close the tray.

    2. Go to My Computer or Windows Explorer and double-click the CD-ROM drive.

    3. Most of the files contained on the CD can be viewed with WINZIP.


    # RUNNING THE CD WITH LINUX


    To make the CD user-friendly and take less of your disk space, no installation
    is required to view the CD. This means that the only files transferred to your
    hard disk are the ones you choose to copy or install. You can run the CD on any
    operating system that can view files; however, not all the programs can be installed
    on all operating systems.


    +   1. Insert the CD into the CD-ROM drive and close the tray.

    2. Either make sure that the mount is running, or mount the CD by issuing the
    mount command from a shell prompt.

    3. Change to the root directory of the amount, usually /mnt/cdrom.

    4. Most of the files contained on the CD will need to be uncompressed and un-tarred
    with the following commands:

    ```gunzip filename

    tar -xvf filename

    ```'
