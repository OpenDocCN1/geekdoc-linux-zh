  md: '# POLLING THE MOUSE


    Like keyboard polling, you can also poll the mouse in a very similar method using
    the following functions.


    Uint8 SDL_GetMouseState(int *x, int *y);


    Uint8 SDL_GetRelativeMouseState(int *x, int *y);


    Retrieving information about the current mouse position and button states is a
    simple task. The SDL_GetMouseState() function copies the current mouse position
    in the x and y pointers passed to it and returns the button states in the same
    format as the button data stored in the SDL_MouseMotionEvent structure. The SDL_GetRelativeMouseState()
    function returns the same button data; however, the position is relative to the
    previous mouse position, not to the screen origin.


    # CONFIGURING THE CONTROL SYSTEM


    A control system that can be completely configured by the user offers complete
    and total freedom. However, such a system can also overwhelm users by offering
    them too many choices and options before they have even started playing the game.
    Note that you should always allow several features to be configurable by the user.
    For instance, users should be able to remap keyboard keys and buttons to their
    liking. Mouse and joystick sensitivity should also be adjustable. It is worth
    noting that the buttons of some joysticks may actually be axes, as the joystick
    hardware sees it, so you should be careful not to restrict axes to buttons only,
    such as an obscure control or view-heat.


    > Do not make assumptions based on your own personal preferences. Remember, you
    will not be the only person playing your game. If possible, get friends and colleagues
    to experiment with your control methods and your configuration options.


    A simple and effective way to do this is to use a structure containing the key
    presses as well as a function pointer to call when the appropriate input is activated.
    The following sample code demonstrates this.


    ```

    #define KEY_UP 0

    #define KEY_DOWN 1

    #define KEY_LEFT 3

    #define KEY_RIGHT 4

    #define KEY_FIRE 5

    ```'
