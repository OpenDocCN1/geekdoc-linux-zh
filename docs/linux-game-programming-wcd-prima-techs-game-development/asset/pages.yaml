    \ the code, we might as well stream audio data to /dev/audio (which is a bit binding).\n\
    \nOne of the attractions of OpenAI is its 3D sound capabilities (stereo sound\
    \ for those who don't like sales pitches). OpenAI makes integration of audio features\
