    # MOVING THE CAMERA


    For some 3D games, the "camera" is attached to the player''s character. For these
    kinds of first-person games, there is really no problem deciding where to place
    the camera. In games such as Quake, this is the preferred mechanism. However,
    other styles of game such as racing and third-person adventure/RPG games, the
    camera must be moved intelligently by the game software to keep the player''s
    character in view—without being moved behind obstacles or being embedded in the
    scenery.


    Moving the camera is a deep subject, and one that many third-person games come
    far from getting right. The problem is that you wind up playing the role of Hollywood
    cinematographer and director all rolled into one. One strategy that seems to work
    is to make a list of good places for the camera to be in each room or other area
    of your game level and to move the camera smoothly'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'between those positions depending on where the player''s character is at the
    time. If, in testing the game, you find that there is a place to the player can
    go where he''s hidden from the camera, you can simply add another camera position
    closer to the player that does a good view.


    Another approach is to allow the player some control over the camera. You have
    to be careful not to allow him to move the camera somewhere he may see something
    he shouldn''t (for example, he should not be able to move the camera inside a
    locked room to which he doesn''t have the key). If you restrict the player''s
    ability to move the camera only to places where the camera has a clear line of
    sight to the player, this flexibility should be a fairly safe gambit.


    For racing games, it''s tempting to place the camera at a fixed position behind
    the player''s vehicle. However, this tends to look very artificial because the
    vehicle ends nailed to the center of the screen, you only see it square-on from
    the rear. A better approach is to remember the position of the player in every
    frame and to position the camera back where that position was (say) a half-second
    ago. This simple trick works surprisingly well; as the player turns, you see the
    effect of turn on-screen immediately, and a half second later, the camera catches
    up follows. Similarly, if you brake suddenly, the camera will come closer to the
    vehicle; as you accelerate, the camera will fall behind.


    Even in this case, it''s nice to provide the player with a little control (for
    example, the player to control the amount of delay in camera positioning, which,
    in effect, moves it in closer or farther away).


    One problem with this approach is that if the player stops, the camera will crash
    into him half-second later. This condition requires a little adjustment to the
    code so it can detect when the player stops moving and can then remember old positions
    when that happens. Now the camera will stop moving whenever the player does.


    # ADVANCED LIGHTING


    The current state of First Person Shooter (FPS) games is mostly set in dark, dungeon-like
    locations with flickering torchlight and brightly glowing weapons along corridors.


    The standard OpenGL lighting model doesn''t care for lighting of this sophistication.
    If you need shadows in OpenGL, you need to model them yourself—probably dark,
    translucent polygons that overlay the walls and floors. The current generation
    of FPS games uses a technique called light-mapping to apply custom-made texture
    maps that mimic shadows to normally lit walls.


    One problem with OpenGL''s standard lighting model is that it''s computed before
    texture is applied to the model. Because textures have to modulate the results
    of lighting, there is no way for any amount of light to brighten up the dark parts
    of your texture map. This can cause serious problems for some kinds of objects.'
