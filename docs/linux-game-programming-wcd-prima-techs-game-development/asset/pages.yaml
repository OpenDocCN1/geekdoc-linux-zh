  md: '# INTRODUCTION


    Well, it''s been a long time coming, but now there is finally a book on Linux
    game programming. With the growing interest in both the commercial and desktop
    uses of the free Linux operating system, it was only a matter of time until people
    started writing games for it. Sure, many people have written little games in the
    past, such as xbill and xboing (and a plethora of titles starting with the letter
    x), but only in recent years have games that are almost commercial quality available
    for Linux.


    With companies such as Loki porting successful titles such as Descent 3 and SimCity
    3000, it''s only a matter of time until software houses start developing original
    titles for the Linux platform. With the immediate launch of the Indrema console,
    a Linux-based system, that future is set to become a reality.


    But what is Linux? In 1991, a student in some country of Scandinavia made an announcement
    on a message board with this immortal line: "I''m working on a minix-based operating
    system; it won''t be as big as the GNU project, though." (I''m paraphrasing here).
    Since then, the "small" operating system that was never going to be as big as
    the GNU project has grown to several million worldwide, with uses ranging from
    enterprise servers to games consoles.


    Linux is a semi-POSIX-compatible, UNIX-like operating system that runs on almost
    every platform available, ranging from i386 to PalmPots. Until the past few years,
    however people considered using Linux as a desktop environment, but with projects
    such as KDE and Gnome paving the way, more and more people are wiping out Windows
    and switching to one of the many Linux distributions available.


    # MY JOYS WITH LINUX


    I first played with Linux in 1994, running an old version of Slackware on a CD-ROM.
    After finding that the version of Doom included in that program refused to pass
    the title screen, I started looking for other games on the CDs (I couldn''t get
    XWindows working back then). That''s when I discovered Abuse, the classic side-scrolling
    platform game with a rather innovative feature: you aim with the mouse while moving
    with the keyboard. I was impressed with this feature but knew it wasn''t going
    to last.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'A few weeks later, I tried to install a few things from the CD, but horror
    struck! I was running on a UMSDOS partition, co-existing with Chicago (later renamed
    Windows 95). A broken installation program wiped up all the partitions on my hard
    disk, completely without even having the courtesy to ask first.


    A few years later (after the phenomenal success of Spong, I really bad Pong clone
    for DOS, which everyone in my school became addicted to), I decided to try Linux
    again. So I popped down the shop and bought a RedHat boxed set, and I was away.
    After a few problems getting Windows in anything higher than standard VGA, everything
    ran perfectly. I was happily playing around with stuff, reconfiguring files here
    and there, setting up security, and so on. I never actually used it. Why? Because
    there was nothing to do. Every time I wanted to play Dungeon Keeper, I would reboot
    into Windows and load it from there.


    After some time, I did start playing some of the Linux games that were in existence,
    but none of really impressed me. So I started looking for ways to write my own
    games. I downloaded SDL and started playing around it. Then the worst in the world
    had happened: I got a job. Working on serverside Java for Web sites, I had no
    time for personal projects. Soon I moved up to network consultancy and still had
    no time for games. A year after that, things changed.


    I was looking for a career change, and boy did I find one. Within a week after
    sending my curriculum vitae to an agency, I had an interview at Silicon Dreams.
    And I got the job. I stayed in that job until December 2000, at which point I
    decided to write this book full time. (I was fired).


    While I was at Silicon Dreams, I learned many things (one of which was to not
    annoy Microsoft; they''ll complain to your boss if you do). One of the most important
    things I learned is this: No one in the "professional" industry cares about Linux
    development—at least officially, that is. Many of my coworkers at Dreams were
    close die-hard Linux fans, as soon as they found out that I was writing this book,
    I had the sudden urge to kill many of them.


    As unlikely as it may seem, the small project that was never destined for big
    things might actually become a hardcore gaming platform. I, for, would like to
    see that happen.


    ![](img/8827e679048b592dad186c600299f274_33_0.png)'
