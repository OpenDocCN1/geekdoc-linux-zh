    Make sure that you have the Projection matrix set up in orthographic mode.


    The GLUT texture-rendering routines are handy, but they are quite slow on hardware
    OpenGL accelerators, and the limited range of fonts get boring. GLUT fonts are
    also displayed at a constant size (in pixels), so they can be tiny on modern high-resolution
    displays. A better approach is to draw each letter as a separate texture-mapped
    quadrilateral. Well, you can paint any font you like into the texture and scale
    or rotate the characters using the usual glScale() and glRotate().


    > CAUTION Don''t put each character into a separate texture map. The time consumed
    in switching between one map to another (between one character and the next) will
    kill your performance. Put all characters into a single large map and use glTexCoord2f()
    to tell OpenGL which part of the texture map to use for each character.


    # UNDERSTANDING MATRICES


    At first sight, matrices are hard to understand. Even people who know all the
    rules for using matrices don''t always know what the numbers inside the matrix
    really mean.


    The 16-element array OpenGL uses to represent matrices is easy to decode (at least
    for the majority of matrices that represent a rotation, a translation, or a combination
    of the two).


    The way to imagine what matrices do is to think about a little cube with one corner
    at the origin and aligned to the positive X, Y and Z axes. Assume that the little
    cube is one unit across each direction. Now let''s label vertices: The vertex
    that is touching the origin we''ll call O; the vertices that are at (1,0,0), (0,1,0),
    and (0,0,1) we''ll call X, Y and Z respectively.


    What happens to this cube when it''s transformed by a matrix? Well, the corner
    of the cube that was at the origin (O) ends up at the coordinate defined by the
    right-hand column of the matrix (array elements 12, 13, and 14 in the OpenGL array).


    ![](img/8827e679048b592dad186c600299f274_155_0.png)'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'The first three columns of the matrix tell you where (relative to that first
    corner of the cube) the rest of the object will be. The first column (array elements
    0, 1, and 2) tells you where X is relative to O. The second column (array elements
    4, 5, and 6) tells you where Y is relative to O. The third column (array elements
    8, 9, and 10) is the coordinate of Z relative to O.


    Pictorially, OpenGL array indices are laid out like this:


    ```

    0 4 8 12

    1 5 9 13

    2 6 10 14

    3 7 11 15

    ```


    The functions of these indices look like this:


    The original points of the cube—O, X, Y, and Z—undergo these transformations:


    ```

    (0,0,0) -> (0x,0y,0z)

    (1,0,0) -> (0x+Xdx,0y+Xdy,0z+Xdz)

    (0,1,0) -> (0x+Ydx,0y+Ydy,0z+Ydz)

    (0,0,1) -> (0x+Zdx,0y+Zdy,0z+Zdz)

    ```


    It''s pretty easy to see how to map any point to its destination after it has
    been transformed by the matrix.


    ```

    P(p,q,r) -> (0x+p*Xdx+q*Ydx+r*Zdx)

    0y+p*Xdy+q*Ydy+r*Zdy

    0z+p*Xdz+q*Ydz+r*Zdz

    ```


    In essence, the columns of the matrix define a new coordinate system into which
    objects are drawn. Understanding how matrix is put together is key to understanding
    transformations in OpenGL.


    I''m sure that you noticed that we have talked about only the first three elements
    of each column of the matrix. The bottom element of each row is not relevant to
    simple rotate/translate matrices, these are always set so that elements 3, 7,
    and 11 are 0 and element 15 is 1.


    ![](img/8827e679048b592dad186c600299f274_156_0.png)'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    An interesting consequence of understanding what the various rows of the matrix
    is that you can make matrices that OpenGL cannot directly generate with the API.
    For example, you can make a "shear" matrix by using the first and second columns
    of the matrix represent vectors that are not perpendicular. Apply one of these
    matrices using glMatrix() or glMultMatrix(), and all your squares will come out
    in a diamond shape.


    # WORKING WITH PLANE EQUATIONS, LINE EQUATIONS, AND DISTANCES IN 3D


    If you intend to get seriously into 3D graphics, it''s unavoidable that you''ll
    need a certain amount of mathematics. I will explain some of the most important
    equations and algorithms here, but realize that there are always more equations
    to learn.


    One concept, the surface normal, was explained in Chapter 6—along with a function
    you can use to compute the surface normal from the three vertices of a triangle.
    The normal is a 3D vector that is one unit length and points in a direction at
    right angles to the plane of the polygon. All polygons that are parallel to one
    another have the same surface normal. A useful extension of this concept is the
    plane equation, which is a set of four numbers (three numbers) and the distance
    from the plane to the origin in 3D. It is composed of the surface normal (three
    numbers) called A, B, C, and D (where A, B, and C are the normal vector and D
    is the distance to the closest point). These values obey this relationship for
    every (x,y,z) that lies on the plane:


    ```

    A * x + B * y + C * z + D == 0

    ```


    Hence, if you know the surface normal of a triangle (using the algorithm in Chapter
    6), you can find D by substuting one of the triangle''s vertices into the plane
    equation:


    ```

    D = - ( A * x + B * y + C * z )

    ```


    When you compute it this, D is a signed quantity that is positive if the origin
    is on one side of the plane and negative if it lies on the other. That''s a useful
    fact and leads to this equation:


    ```

    d = A * x'' + B * y'' + C * z'' + D

    ```


    Where (x'',y'',z'') is any point in space and D is the signed distance to that
    point from the plane. Now, armed with the plane equation, you can easily compute
    which other point lies on the plane, the behind, or in front of the plane—and
    by how much (using OpenGL''s counterclockwise convention discussed in Chapter
    6).


    ![](img/8827e679048b592dad186c600299f274_157_0.png)'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# USING OPENGL IN GAMES 125


    Just as are plane equations, there are also equations that describe lines in 3D.
    These equations are generally given in parametric form:


    x = e * t + l * y = f * t + y * z = g * t + zl


    Where E,F,G is a vector (one unit in length) describing the direction along the
    line, (x1,y1,z1) is one point on the line, (x,y,z) is another point on the line,
    and t is the distance between the two points. The sign of the equation depends
    on which side of the (x1,y1,z1) the point (x,y,z) is.


    If you know two points that lie on a line, you can work out the distance between
    and reverse the equations above to compute (e,f).


    Another important thing is to be able to measure distances in 3D. The distance
    between two points is calculated in 3D using the Pythagorean theorem (just as
    it is in 2D):


    ```

    dx = x1 - x2

    dy = y1 - y2

    dz = z1 - z2

    dist = sqrt ( dx * dx + dy * dy + dz * dz )

    ```


    Two other operations are commonly found. Mathematicians call them the names dot-product
    and cross-product (which are typically uninformativeative names). The dot-product
    operation is between two length-vectors one that produces the cosine of the angle
    between them:


    ```

    dot_product = x1 * x2 + y1 * y2 * z1 * z2

    ```


    In this syntax, (x1,y1,z1) and (x2,y2,z2) are both vectors of length 1.0.

    The cross-product of two unit vectors is another vector that''s right angles to
    the first two. We already used a cross-product operation to calculate the surface
    area of a triangle:


    ```

    cross_x = y1 * z2 - z1 * y2

    cross_y = z1 * x2 - x1 * z2

    cross_z = x1 * y2 - y1 * x2

    ```


    Many of these need so-called unit vectors—that is, vectors whose length is 1.
    The act of taking an arbitrary vector and changing its length to 1.0 without altering
    its direction is called normalizing. All you have to do to normalize a vector
    is to divide the three components of the vector by the length of the vector:'
