    component in the right place for the pixel to appear correctly.


    Because the masks for each surface may be slightly different, you must figure
    out how to display something before you go into your code to display it. If you
    look at the structure definition for SDL_PixelFormat, you will notice several
    masks and shifts that tell you how to set up your memory.


    A very simple function for plotting a pixel in 24-bit mode follows.


    ```

    void Plot24(SDL_Surface *surface, int x, int y, Uint32 pixel) {

    Uint8 *bits;

    Uint8 r, g, b;


    // Prepare the components

    r = ((pixel)->screen->Rshift) & 0xFF;

    g = ((pixel)->screen->Gshift) & 0xFF;

    b = ((pixel)->screen->Bshift) & 0xFF;

    ```


    ```

    // Lock the surface and work out where to plot the pixels

    SDL_Lock(surface);

    bits = ((Uint8*)surface->pixels)+y * surface->pitch + x * surface->format->BytesPerPixel;


    ```


    ```

    // Plot the pixels

    *((bits) + screen->format->Rshift/8) = r;

    *((bits) + screen->format->Gshift/8) = g;

    *((bits) + screen->format->Bshift/8) = b;

    ```


    ```

    // Unlock the surface

    SDL_Unlock(surface);


    ```


    Although SDL_MapRGB() does not work with 24-bit color, 32-bit color depths support
    the use of SDL_MapRGB(), so this is a very simple color depth to use. The 32-bit
    color depth has an extra byte of memory per pixel for alpha. This is useful if
    you want to have a transparent surface.


    If you use alpha, the SDL_MapRGB() function won''t cut it. You will need to calculate
    the pixel yourself, using a method similar to that for calculating the pixels
    for 24-bit colors. The Plot32 function shown demonstrates how to calculate the
    pixel.


    ```

