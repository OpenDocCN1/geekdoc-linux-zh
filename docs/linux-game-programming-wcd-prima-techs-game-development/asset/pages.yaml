  md: '# LINUX GAME PROGRAMMING


    People debate long and hard about value to use for zNear, but it really depends
    on the general scale of your models. If you are building a human-scale game, perhaps
    0.1 meter is a good value. If your game is "The Attack of the Mutant Bacterium,"
    you''ll probably want a much smaller value for zNear.


    To cut a long story short, we''ll want something like this:


    ```

    gluPerspective(40.0, 1.333, 0.1, 100000.0);

    ```


    There isn''t a float version of gluPerspective(); its arguments are always doubles.
    In addition, this is like glRotate();It multiplies the current matrix rather than
    replacing it. Finally, all OpenGL matrix operations affect only one of the matrix
    stacks at a time; you decide which by using the glMatrix() command. Considering
    all that, the sequence of statements to set the Projection matrix to a "reasonable"
    value looks like this:


    ```

    * Select the Projection matrix */

    glMatrixMode ( GL_PROJECTION );

    ```


    ```

    glLoadIdentity();

    gluPerspective(40.0, 1.333, 0.1, 100000.0);

    ```


    ```

    * Go back to the ModelView matrix */

    glMatrixMode ( GL_MODELVIEW );

    ```


    It''s usual to leave the matrix set to GL_MODELVIEW when you''ve finished messing
    with the GL_PROJECTION or GL_TEXTURE matrix because the ModelView stack is by
    far the most active in applications.


    # DRAWING IN ORTHOGRAPHIC OR PERSPECTIVE MODE


    You may have noticed that this code is quite similar to the initCamera() function
    used earlier in the chapter. That''s no accident: The previous examples used glOrtho
    rather than gluPerspective() to produce a Projection matrix that simulated orthographic
    drawings. (An orthographic drawing is one which stays the same size no matter
    how far from the eye they are). For some occasions, to use orthographic rendering
    in a game—perhaps for a board game or for a game in which the action happens from
    a God''s eye view. Some games are better suited to orthographic rendering: SimCity
    would be hard to play in, for example.


    You''ll probably want to switch your game into orthographic mode for drawing overlay
    information such as scores, damage indicators, and such. Games that attempt realism
    use perspective for most of the rendering, though.


    Now you can place those lines code at the end of the last section into the evolving
    sample program in place of the old initCamera() call. Alternatively, you can call
    these lines of code in every frame if you want to be able to change the field
    of view or the clip planes during the game.'
