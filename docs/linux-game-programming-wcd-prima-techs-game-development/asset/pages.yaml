    # THE GL_CULL_FACE OPTION


    Polygons in OpenGL look like they were cut out of paper—they are infinitely thin
    and have two sides. In the real world, the surfaces of solid objects can''t be
    seen from the inside. This is a useful property. If you could somehow make the
    inside of an object, you wouldn''t have to draw polygons when the OpenGL camera
    is on the outside of the object. In the case of the tetrahedron in the sample
    program, you there is really no need to draw it. Drawing fewer polygons saves
    processor time, so you can see that culling the backfacing polygons is a good
    thing.


    OpenGL uses the order of the vertices of the polygon which is the visible side.
    Therefore, if you make a call to glEnable(GL_CULL_FACE), a polygon is drawn only
    if its vertices appear in counterclockwise order. In the red tetrahedron in the
    example:


    ```

    glColor3f(1.0f, 0.0f, *); / Red *

    glVertex3f(0.0f, 0.0f, 0.0f);    / First triangle *

    glVertex3f(-1.0f, -1.0f, 0.0f);

    glVertex3f(1.0f, -1.0f, -0.0f);

    ```


    If you plot out the X,Y coordinates on graph paper, you will see that this is
    a counterclockwise ordering; when it''s displayed without any rotation, the tetrahedron
    will be red. However, if you rotate the polygon (for example, if you took the
    graph paper, held the red up to the light, and flipped it over that you were seeing
    the back side of the paper), magically, those vertices would be in clockwise order—and
    OpenGL won''t draw the polygon under those conditions when the GL_CULL_FACE option
    is turned on.


    So, most of the time, you will back-face culling enabled. Keep in mind, however,
    that there may be times when it''s inconvenient.


    # THE GL_LIGHTING OPTION


    In the examples so far in this chapter, we have seen OpenGL draw our tetrahedron
    in the exact colors we asked it to. However, in the real world, objects have their
    colors modified by the lights shining on them. If you use a red cube and a blue
    cube and view them under light, the blue cube will appear black because it reflects
    only blue light—and there isn''t.


    Also, objects are brighter on the near side to the light source and shiny objects
    that have a highlight on them moves around depending on the geometrical relationship
    between the shape and the position of the object, the position of the light source,
    and the position from which object is being viewed.


    All of the lighting influences are included in OpenGL''s lighting scheme (a subject
    we''ll return to later). Suffice to at this point that disabling or enabling the
    GL_LIGHTING option switches between'
