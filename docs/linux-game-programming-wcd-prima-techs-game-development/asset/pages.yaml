  md: 'The first argument is the more-than-familiar socket descriptor. The next argument,
    my_addr, is a pointer to a structure containing information about the local address.
    You set up this structure in the same way as you are establishing a socket using
    connect(), except that you set the sin_addr member of the sockaddr_in structure
    to INADDR_ANY. The final argument for bind() is the size of the local address
    descriptor.


    # USING THE listen(FUNCTION)


    After you have bound the socket to a port, you must tell the TCP/IP subsystem
    that you are willing to accept connections. This is achieved with the function
    listen():


    ```

    int listen(int s, int backlog);

    ```


    This first argument is—yep, you guessed it—the socket descriptor. The next argument
    specifies how many connection requests can be queued at any one time.


    listen() function returns a 0 on success or a -1 on error.


    # ACCEPTING CONNECTIONS


    After you have called listen(), you can start your main server loop. Incoming
    connections are received by calling the function accept().


    ```

    int accept(int s, struct sockaddr *addr, int *addrlen);

    ```


    I really don''t think I need to say what the first argument is, so I''ll move
    on to the second. The sockaddr structure is where you want to store the address
    of the remote client. Depending on how you implement your server, you may want
    to store this information in a linked list of other addresses, or pass this value
    on a new thread to handle that client''s information.


    The accept() function is a blocking function, so you may want to use the select()
    function earlier to check whether there are any incoming connections before calling
    accept(). In this scenario, the socket is regarded as ready to read.


    From here on, the rest of the server operations are pretty identical to client
    operations, such as sending and receiving data.'
