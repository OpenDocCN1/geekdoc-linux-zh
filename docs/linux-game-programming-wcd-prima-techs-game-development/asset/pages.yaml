  md: '# WORKING WITH PARTICLES


    Many graphical effects in games need fluid motion to reproduce the look of spraying
    water, swirling or drifting smoke, dust, little magical sparkles, and so on. These
    effects are generally handled by rendering small "particles" of whatever material
    is being simulated. By using the first version of the billboard code that causes
    objects to turn to the camera, we can render each particle as a texture-mapped
    shape (typically either single triangle or at most a quadrilateral). After you
    have established the specific billboard matrix on the OpenGL ModelView stack,
    you can rapidly render a large number of particles in a 3D volume.


    The rules for moving from one frame to the next can range from the very simple
    (gravity acting on water droplets in a fountain) to something more complex (a
    full-dynamics model that makes fog swirl as a character walks through it). The
    particle-moving basics are much the same for all these effects. Keep track of
    the coordinates of your particles in a large array and then zip quickly through
    that. In each frame, you update the position of each particle.


    You''ll also need to add rules for creating new particles and destroying old ones.
    For a fountain, example, you might want to delete water droplets that hit the
    ground and create new ones with an appropriate upward velocity in the fountain''s
    outlet even as old droplets die.


    Even systems with just a handful of golden "glow" particles that swirl in a spiral
    can create wonderful magical effects that can help the player that something special
    has just happened.


    When a character jumps into water, you can create a handful of splash particles.
    If someone gets shot, a little shower of blood droplets can add greatly to the
    goriness of the game! If your character is running quickly and to a sudden stop,
    you can launch some tiny dust clouds from his feet and let them settle to earth.


    # DETECTING COLLISIONS


    It''s generally necessary to provide several types of 3D collision-detection sequences
    so that you can tell when the player walks into a wall or is hit by a weapon.
    In games where the player can walk or drive on uneven ground, you''ll also have
    to detect the height and slope of the terrain beneath his feet or wheels.


    These related problems are enough to completely kill your frame rates because
    they are mathematically complex to resolve and may require you to test often for
    each frame of graphics.'
  merge: -1
