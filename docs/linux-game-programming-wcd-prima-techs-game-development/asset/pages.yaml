  md: "# LINUX GAME PROGRAMMING\n\n```\ncase SDL_KEYDOWN:\n    printf(\"pressed.\\\
    n\");\ndefault:\n    break;\n\n```\n\n# MOUSE EVENTS\n\nWhile the keyboard has\
    \ two separate event types associated with it, the mouse has three event types\
    \ and two different event structures.\n\nEvents of type SDL_MOUSEMOTION refer\
    \ to mouse movement; information about that event is stored in an SDL_MouseMotionEvent\
    \ structure. Here is its prototype.\n\n```\ntypedef struct {\n    Uint8 type;\n\
    \    Uint8 state;\n    Uint16 x, y;\n    Sint16 xrel, yrel;\n} SDL_MouseMotionEvent;\n\
    ```\n\nThe SDL_MouseMotionEvent structure contains three separate groups of data.\
    \ The state field refers to the current state of the mouse buttons, which are\
    \ either pressed or released. The data is stored in the bits of the 8-bit byte.\
    \ The LSB refers to button 1 (the left button), the second LSB refers to button\
    \ 2 (the right button, or sometimes the middle button). The best way to read this\
    \ data is to use SDL_BUTTON_LEFT, SDL_BUTTON_MIDDLE, or SDL_BUTTON_RIGHT. If (state\
    \ & SDL_BUTTON(X)) is true, then X is pressed.\n\nThe x and y fields store coordinates\
    \ to where the mouse was moved. These values are bound by the width and height\
    \ of the screen, respectively. Finally, the xrel and y fields store the relative\
    \ motion of the mouse, that is, the distance the mouse has moved since the previous\
    \ SDL_MOUSEMOTION event.\n\nAlthough the SDL_MOUSEMOTION event provides us with\
    \ all possible information related to the mouse, it only allows us to act on mouse\
    \ motion and not button presses (releases). Therefore, we also have the SDL_MOUSEBUTTONUP\
    \ and SDL_MOUSEBUTTONDOWN events, which are associated with the SDL_MouseButtonEvent\
    \ structure, shown here."
