  md: '# T


    TCP (Transport Control Protocol). A subset of TCP/IP.

    TCP/IP. The protocol used on the Internet as well as on most networks on the planet.

    Tux. The accepted Linux penguin mascot created by Larry Ewing.


    # U


    UDP (User Datagram Protocol). A subset of TCP/IP.


    # W


    Win32. The Windows 9x/NT/2k/ME programming library.

    WINE (WINE Is Not an Emulator). A program that emulates the Win32 API for Linux.
    Several

    can run under WINE. For more information, see http://www.winehq.org.


    # X


    X Consortium. The group that defines the X Windowing protocol.

    X Windowing System. A distributed user interface system, commonly referred to
