  md: '```

    typedef struct {

    Uint8 type;

    Uint8 which;

    Uint8 hat;

    Uint8 value;

    } SDL_JoyHatEvent;

    ```


    ```

    typedef struct {

    Uint8 type;

    Uint8 which;

    Uint8 ball;

    S16 xrel, yrel;

    } SDL_JoyBallEvent;

    ```


    The first events in all four structures have identical meanings. The type field
    has the same meaning as the type field in all other event structures; the which
    indicates which joystick event refers to. It has the same value as the index parameter
    passed to SDL_JoyAxisOpen(). The third field in each event structure indicates
    which axis, button, hat, or ball the event refers to. For this third field, a
    value of 0 indicates the first axis, button, hat, or ball; the second and so on.
    Note that the field is named differently in each structure: In SDL_JoyAxisEvent,
    the field is axis; in SDL_JoyBallEvent, the field is ball; and so on.


    The type of input data contained in each structure variable. SDL_JoyAxisEvent
    contains the new position in the value field, which is a signed 16-bit integer
    as explained at the beginning of this chapter. Hat has only nine possible positions,
    the value field of the SDL_JoyHatEvent contains one of the following defined values:


    +   - SDL_HAT_CENTERED

    - SDL_HAT_UP

    - SDL_HAT_RIGHTUP

    - SDL_HAT_RIGHT

    - SDL_HAT_RIGHTDOWN

    - SDL_HAT_DOWN

    - SDL_HAT_LEFTDOWN

    - SDL_HAT_LEFT

    - SDL_HAT_LEFTUP


    Unlike the other joystick controls, balls do not have a position; they only report
    movement relative to the previous reading. This data is stored in the xrel and
    yrel fields of the nSDL_JoyBallEvent structure.'
