  md: "# LINUX GAME PROGRAMMING\n\n(honest), there are some funky tricks you can use\
    \ to enable or disable them at compile time using preprocessor directives.\n\n\
    If your compiler allows a flag to add at compile time, you can use that flag to\
    \ specify a release type, depending on whether you are compiling a debug or release\
    \ version of the game. For example, you can include the following code in your\
    \ game program.\n\n```\n// test.c\n#include <stdio.h>\nmain () {\n  #ifdef DEBUG\n\
    \    puts(\"This is a debugging version!\");\n  #else\n    puts(\"This is a release\
    \ version!\");\n  #endif\n}\n```\n\nIf you then compile the program with the following\
    \ command and run the program, you should seenThis is the release version.\n\n\
    ```\ngcc -o test1 test.c\n```\n\nHowever, if you include the -DDEBUG option on\
    \ the command line, as shown in the following command, the program will output\
    \ the line This is a debugging version!\n\n```\ngcc -DDEBUG -o test2 test.c\n\
    ```\n\nThis trick allows you to add cheats using #ifdef blocks of code. You can\
    \ then turn off the cheats when you are ready to release the game, if you wish.\
    \ You can also add simple debugging statements in #ifdef blocks to track the program\
    \ flow without the use of an external debugger (as discussed in Chapter 2).\n\n\
    # RELEASING YOUR GAME\n\nAfter you have tested your game as much as is human possible,\
    \ you can release it. You have several choices about what to do at this stage,\
    \ and I will discuss three of your options here: OpenSource, commercial, and shareware.\n\
    \n# OPENSOURCE GAMES\n\nOpenSource is probably the simplest and quickest route\
    \ to getting your games on the market. If you want to play your game as soon as\
    \ possible, you can release the game while you are still writing it. Not only\
    \ does this approach let people know your game exists long before it's finished,\
    \ it also lets other people work with you to fix any problems they might find\
    \ or to make suggestions for improvement."
