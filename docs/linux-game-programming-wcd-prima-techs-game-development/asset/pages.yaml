    # SOLVING TRANSPARENCY PROBLEMS


    Transparency using alpha has one truly major problem, though, the standard depth
    buffer hidden surface algorithm fails to work as you''d hope for transparent surfaces.
    The problem is that if a pixel is rendered with an alpha of 0, it still sets the
    Z value for that pixel. That means that though the pixel is transparent, it prevents
    you from seeing things behind, unless those objects were drawn beforehand.


    This leads to one partial solution to the problem. If you always draw translucent
    polygons after the opaque ones, the transparent polygons will incorrectly occlude
    the "background" images. However, you can still run into problems if translucent
    polygons are drawn behind another one. Ultimately, the only solution is to sort
    your translucent polygons as a function of range from the eye and render them
    in order from farthest to nearest. This is quite hard to do, and for many 3D games
    it isn''t necessary because there are very partially transparent polygons (or
    texels). The best solution is a trick that solves the problem for utterly transparent
    parts of polygons (such as our cardboard cutout trees):


    ```

    glEnable(GL_ALPHA_TEST);

    glAlphaFunc(GL_GREATER, 0.01f);

    ```


    These statements tell OpenGL to render only those pixels whose alpha component
    is greater than 0.01 (We don''t choose 0.0 because rounding error can creep into
    the calculations inside OpenGL.). These commands prevent utterly transparent pixels
    from writing to the depth buffer, which solves a lot of problems.


    The alpha test code is incorporated into the ex.c file on the CD-ROM at the back
    of this book.


    # FOGGING


    OpenGL incorporates a very simple model for the scattering and absorption of light
    by our atmosphere. You can use it to produce the effect of a dense fog or some
    subtle haze. By using a colored fog, you can create effects such as the change
    in color of far-distant mountains compared to nearby grassy slopes.'
