  md: 'In recent years, OpenSource has been in the spotlight. Although it''s been
    heralded as a new age of software development, it is really all people claim it
    can be, or is it just another form of communism disguise?


    # # WHAT IS OPENSOURCE?


    The idea behind OpenSource software is simple, yet it involves many complex political
    issues. Sometimes hailed as "technical communism," other times as the "future
    of software development," everyone has a different opinion about what OpenSource
    means. But what is it?


    The concept is like this You write a program and release it with the source code.
    Now, people have been doing that since long before the OpenSource movement started,
    so what makes OpenSource different? Traditional source code usually had some restrictions
    on its use by other people. Early versions of UNIX, for example, included the
    source code, but those versions weren''t OpenSource applications by today''s standards.


    The license restrictions regulating the use of UNIX meant that only corporations
    and universities could actually see the source code. Mr. Joe Public didn''t have
    a hope in hell of seeing a single line of code that went into making the monster
    that was the original AT&T UNIX. Modern OpenSource software is different.


    An OpenSource license places no restrictions on who can see the source code or
    who can redistribute it. This approach allows a single program, released on a
    simple Web page, to end up on every Linux user''s hard drive without any special
    effort by the original programmer.


    However, just releasing the source code to a program doesn''t make it an OpenSource
    application. To be a "proper" OpenSource program, your license agreement must
    meet certain requirements. Several sample license agreements are presented in
    Appendix A, but I''ll cover some of the more common aspects of all the licenses
    in the next few sections.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# UNLIMITED REDISTRIBUTION


    Every OpenSource software license must have the provision that anyone can give
    your software to-one else, including any modifications they may have made to your
    original code. Safeguards are in place within the license agreement to protect
    the author''s copyright, preventing someone else claiming credit for the original
    coder''s hard work. This is one of the key selling points of OpenSource software:
    the low cost of acquisition.


    # ABILITY TO CHARGE FOR EXPENSES


    Many OpenSource licenses offer an option to charge for the cost of redistribution,
    such as the price of a CD and manuals. This is how companies as RedHat and SuSE
    make their money. Although these companies rarely develop their own software for
    the operating system, they make the application available in a nice box, on several
    CDs, and with instruction manuals. If these companies weren''t allowed by the
    rules of OpenSource redistribution to charge for this kind of packaged redistribution,
    the Linux CDs that get many of us started with the operating system would not
    exist.


    In addition to charging for nicely distributed copies of software


    # THE DEVELOPMENT MODELS


    So, now we have a vague idea of what OpenSource is, but what is the reasoning
    behind it? In Eric Raymond''s essay called “The Cathedral and the Bazaar,” he
    describes the two main development models, based on community centers around the
    world.


    # THE CATHEDRAL


    A cathedral is a place where many people can go, but where only a few can address
    the masses. This development model represents commercial, closed-source software
    such as Windows and Quicken. These programs are written and controlled by a relatively
    small group of people, yet hundreds of use them without any say in the future
    of the product.'
  merge: -1
