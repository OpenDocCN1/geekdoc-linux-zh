    \ TREES\n\nThe final aspect of basic artificial intelligence I'm going to cover\
    \ is the infamous min-max tree idea. This is how single-player puzzle/board games\
    \ work, such as chess and tic-tac-toe games. The idea is to keep your opponent\
    \ from winning at any possible cost. Winning the game is only an afterthought\
    \ when it comes to min-max trees.\n\n# THE THEORY BEHIND THE TREE\n\nThe aim of\
    \ a min-max tree is to keep your score as high as possible, while keeping your\
    \ opponent's score as low as possible. For each possible action, we calculate\
    \ the possible results of the follow-up actions. This approach makes this system\
    \ perfect for turn-based games such as chess or tic-tac-toe."
