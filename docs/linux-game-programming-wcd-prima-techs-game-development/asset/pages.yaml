    \ considered good practice to enable all warnings by using the -Wall switch. In\
    \ addition to warning levels, the GCC also has levels of optimization. By default,\
    \ GCC disables optimization for debugging purposes (-O); for release versions\
    \ of your programs, you will probably want to enable full optimization with the\
    \ -O3 switch. A word of warning, however: Full optimization may introduce stability\
    \ problems to your program, so people generally use the -O2 switch instead.\n\n\
    If you're developing for multiple platforms, you might want to use the -D switch\
    \ to define symbols such as architecture. Chapter 1 contained a simple example\
    \ of the -D switch to enable or disable debugging commands (such as cheats) at\
    \ compile time. You are not limited to specifying a single symbol on the command\
    \ line. In fact, you can specify as many symbols as you like. The following example\
