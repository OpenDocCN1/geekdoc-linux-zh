- img_proc: true
  md: '# LINUX GAME PROGRAMMING


    The best solution to this problem is not always clear and will vary from project
    to project. Here are some options:


    +   - Find every place in the game where files are referenced and make sure that
    the names correspond exactly to the other files—remember that the game may reference
    data files that contain other files—it''s not just the source code you must check.
    For this reason, this solution is not ideal. You want to keep data file changes
    to a minimum.

    - If the file handling code is reasonably localized within the source, you could
    add a fix by transforming all filenames to a specific pattern. For example, a
    file-open function could lowercase all the filenames it is passed before trying
    to open them. The drawback with this method is that it assumes the files on disk
    already conform to that specific naming pattern.

    - You can always rename the files, easily, but remember that this will break compatibility
    with the original data files. This is of special concern if you want it to be
    available as a patch to the originally distributed version of the game.

    - Of course, the file renaming can easily be performed automatically at install.
    The function would have to perform a scan using a case-insensitive comparison.
    There may some potential speed issues with this method, unless files are being
    opened at an extremely high rate, it wouldn''t cause problems.

    - Use a loopback device with a virtual VFAT partition within a file. This has
    a nice, smug, "look-what-you-do-in-Linux" feel to it, but there are likely to
    be configuration problems. For example, the user may not be able to name a kernel
    with the correct file system support.


    If users can name their own files (when saving games, for example), remember to
    take this into account. Users'' file-naming inconsistencies can be an issue, particularly
    if they send files to one another. It''s frustrating when a file saved by a player
    using the Linux version of the game cannot be loaded by a player using the original
    Windows version.


    # DRIVE LETTERS AND PATH SEPARATORS


    Different operating systems use different path separators when specifying locations
    of files. Windows uses a backslash (\), UNIX-OSes use a forward slash (/), and
    the MacOS uses a colon (:). Windows also uses a colon to denote the drive letter,
    typed by the (in)famous C:. Your filename-handling code must take these differences
    into account.


    Sometimes, it''ll be enough to search through all the source code and change backslashes
    to forward slashes. If you are porting from Windows, remember that all the Win32
    file-handling API calls just'
  merge: -1
  pgno: 315
- img_proc: true
  md: 'as happy with forward slashes as they are with backslashes, so you can do the
    replacement without breaking the original version.


    Another approach is to write a translation function that converts filenames to
    a UNIX style and then to make sure that you call it from all the appropriate places.
    Such a function might be desirable if the original data files contain many Windows-style
    filenames. However, if filenames are exposed to the play- at all, you''ll want
    to be careful to prevent filenames in only the native format.


    A common construct for composing filenames takes a form like this:


    ```

    string spritefile = gfdir + ''\\'' + "Wibble.spr";

    ```


    Of course, you can search the source for this sort of thing, changing the \ to
    / as you go, but if filenames appear often, you''ll probably be better off writing
    a name composition function that hides the platform specifics.


    ```

    string spritefile = JoinPath(gfdir, "Wibble.spr");

    ```


    This method has the following benefits:


    +   - Encapsulation of platform-specific details (always a good thing).

    - Easier to improve robustness. What if gfdir in this example has a trailing separator?
    By adding a check in JoinPath(), you automatically make all the filename composition
    occurrences more bulletproof.


    # LINE TERMINATION


    Text files present a class portability issue: different platforms use different
    end-of-line (EOL) sequences. In the following chart, LF means "line feed" (0x0A
    ''\n'') and CR means "carriage return" (0x0D ''\r'').


    | Platform | End-of-Line Sequence |

    | :--- | :--- |

    | UNIX-based | LF |

    | Windows/DOS | CR followed by LF |

    | MacOS | CR |


    Of course, C and C++ use ''\n'', and I/O functionality in the standard libraries
    on-the-fly translation if files are opened in text mode.


    The best thing to do make sure that your file-reading functions are flexible.
    Allowing any EOL convention to be used means you have less trouble swapping files
    between systems. Ideally, you''ll want to write out any text files using the native
    standard (that is, LF on Linux), but to maintain compatibility you might need
    to output an explicit CR/LF pair.'
