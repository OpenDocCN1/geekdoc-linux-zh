    SDL_SysWMEvent syswm:

    SDL_Event:


    This definition should clarify things a bit. The SDL_Event union can store all
    the information you''ll need for any possible SDL event.


    # # INTERPRETING EVENT TYPES


    All SDL event types are enumerated and given a symbolic name; this value is stored
    in the type member of the SDL_Event union. The value in the type member allows
    you to determine the event type and hence from which member of the SDL_Event union
    you are to read the event information. Table 5.1 lists the possible event types.


    # # READING FROM THE EVENT QUEUE


    SDL provides two simple functions for reading from the event queue: SDL_PollEvent()
    and SDL_WaitEvent(). Following are the function prototypes:


    ```

    int SDL_PollEvent(SDL_Event *event);

    int SDL_WaitEvent(SDL_Event *event);

    ```


    These functions are quite similar; both examine the event queue and place the
    event at the head of the queue into the structure pointed to by the event parameter.
    The event is removed from the queue, and the function returns a value I. The two
    functions differ in how they behave if there is no event to be removed from the
    queue. SDL_PollEvent() simply returns a value of 0; however, SDL_WaitEvent() waits
    until there is an event on the queue and removes it and copies it into the event
    structure as usual. The only time SDL_WaitEvent() returns 0 is when an internal
    error has occurred, which is rare.'
