    \ networks like these is that you can create \"personalities\" for each AI opponent\
    \ simply by modifying the threshold that checks to see whether a node should be\
    \ activated.\n\nIf, for example, you have a paranoid pilot who doesn't like less-fancy\
    \ dog-fighting tactics (and in fact a faster increasing the threshold value results\
