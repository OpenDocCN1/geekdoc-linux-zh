    # Streaming BUFFERS


    If you are generating audio on-the-fly or decompressing a large audio file and
    not want to store it

    in all memory, you may want to use a streaming buffer. Streaming buffers provide
    a constant stream of

    input instead of a single sample. You can stream the audio from several sources,
    such as an MP3 file,

    CD-ROM, or off the Internet (think voice-chat).


    When you want to create a streaming buffer, you must use the function alGenStreamingBuffer(ALsize
    n);

    ALAPI void ALAPIENTRY alGenStreamingBuffers(ALsize n, Alu *samples);


    The first argument for alGenStreamingBuffers() is the number of buffers you want
    to create,

    by a pointer specifying the buffer identifiers you want to generate.


    When you want to add data to a streaming buffer, you must use the function alBufferAppendData().

    This function works in a similar fashion to the function alBufferConvert().


    ALsize alBufferAppendData(ALuint buffer, Enum format,

    ALvoid *data, ALsize size, ALsize freq);


    The first argument, buffer, specifies which

    streaming buffer to add the data to. This argugu-

    shoud be one of the values you used in

    alGenStreamingBuffers(). The next argument,

    format, is one of the types listed in the

    following chart.


    > At the time I am writing this,

    the alBufferAppendData()

    function isn''t actually in the API,

    but it is in the documentation.

    There is, however, a function called

    alBufferAppendData_LOKI()

    that takes the same arguments as

    alBufferAppendData().'
