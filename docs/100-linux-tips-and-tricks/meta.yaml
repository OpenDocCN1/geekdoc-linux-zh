    # Tip 18: Shared library not found


    Binaries need to load shared libraries at runtime. They are files on your system
    that provide functions to the program. Sometimes the program will report that
    a shared library was not found, and it will abort.


    To find which libraries a program needs, you can use the ldd program. It will
    list all those libraries and those missing. If you know that a library is installed,
    maybe you need to add it to the current library path. The path used to look for
    shared libraries is in /etc/ld.so.conf. You can modify that file and add any path
    you want, then as root run the ldconfig program.'
