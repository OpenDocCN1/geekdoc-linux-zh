- md: "# 100 Linux Tips and Tricks\n\n## Tip 14: Allowing users to run root programs\n\
    \nWhen a user starts a command, it runs with the permissions of that user. What\
    \ if you want to allow them to run some commands with root permissions? You can,\
    \ and that's called suid.\n\nYou can set a command to be suid root with the chmod\
    \ command. This will make it run as root even if a user starts it. Here is how\
    \ to set mybin suid root:\n\n```\nchmod +s mybin\n```\n\nNote that you must be\
    \ very careful with this option. If the command has any security hole, or allows\
    \ the user to access other files or programs, the user could take over the root\
    \ account and the whole system.\n\n## Tip 15: Linux and NT booting\n\nSome people\
    \ choose to have both Windows NT and Linux on the same system. Windows NT has\
    \ its own boot loader called NTLDR and Linux has LILO. Which should go on the\
    \ MBR?\n\nThe safest way is to install Windows NT first, and give it the MBR.\
    \ Then, when you install Linux, tell LILO to install on the Linux partition. Also\
    \ set the Linux partition as the active partition. When the system boots, LILO\
    \ will be loaded, and if you want to boot Windows NT, then LILO can load the MBR\
    \ with NTLDR in it. There is a mini HOWTO text covering this subject available\
    \ at <http://metalab.unc.edu/pub/Linux/docs/HOWTO>.\n\n## Tip 16: Annoying boot\
    \ messages\n\nWhen recompiling your kernel, you might end up seeing strange messages\
    \ on bootup like:\n\n```\nmodprobe: cannot find net-pf-5\nmodprobe: cannot find\
    \ char-major-14\n```\n\nThese are messages from the modules loader telling you\
    \ that he can't find specific modules. This usually happens when you compile modules,\
    \ but modprobe tries to load modules that were not compiled and it can't find\
    \ them. The way to remove those messages is to set the modules to off. In the\
    \ file /etc/conf.modules you may want to add:\n\n```\nalias net-pf-5 off\nalias\
    \ char-major-14 off\n```\n\nThis will stop modprobe from trying to load them.\
    \ Of course you could also try to resolve the problem by compiling the modules\
    \ and make sure modprobe knows where they are.\n\n## Tip 17: Programs on CD-ROM\n\
    \n<http://metalab.unc.edu>, <ftp://ftp.cdrom.com> and more are sites with a lot\
    \ of programs available freely for Linux. But you may not want to download gigabytes\
    \ of data over a slow Internet link.\n\nSeveral places offer a bunch of free programs\
    \ on CD-ROM. <http://www.cheapbytes.com> and <http://www.linuxmall.com> are 2\
    \ places that can sell multiple CD-ROMs with all those programs for a very low\
    \ price:\n\n## Tip 18: International console\n\nMost Linux distributions are configured\
    \ to use a US english keyboard. If you need to write on a french or any other\
    \ kind of keyboard, you will want to change the locale so special keys like accents\
    \ appear in the console.\n\nThe way to do this is to change the system locale\
    \ with a program called loadkeys. For example, to enable a canadian-french locale,\
    \ you need to add this line in your startup files:\n\n```\nloadkeys cf\n```\n\n\
    Here cf means the canadian-french keyboard. Other locales are us, fr and more.\n\
    \n## Tip 19: Multiple kernels choices\n\nWhen you compile a new kernel, you will\
    \ often change your configuration. This means you may forget to include an important\
    \ driver, like the IDE driver, or otherwise make your system unbootable. The solution\
    \ is to always keep your old kernel.\n\nWhen you compile your kernel, the compilation\
    \ procedure will often copy your old kernel into vmlinuz.old. If it does not,\
    \ you can do it manually. What you should do is add an entry to /etc/lilo.conf\
    \ allowing you to boot your old kernel. You should view the lilo man page for\
    \ the complete syntax. You could also add entries for different kernels, for example\
    \ if you want to have an older stable version of the kernel and the newest development\
    \ version on your system.\n\nNote that some distributions name their kernel with\
    \ the version they represent. For example, your current kernel may be /boot/vmlinuz-2.0.36-0.7\n\
    \n## Tip 20: Default file permissions\n\nWhen you create a file, the system gives\
    \ it default permissions. On most systems the permissions are 755 (read, write\
    \ and execute for the owner, and read and execute for others).\n\nThis default\
    \ is setup with the umask command. To use the command, you need to find the right\
    \ octal number to give it. The permissions in the umask are turned off from 666.\
    \ This means that a umask of 022 will give you the default of 755. To change your\
    \ default permissions from 755 to 700, you would use this command:\n\n```\numask\
    \ 077\n```\n\n## Tip 21: Default boot mode\n\nWhen a Linux system boots, it loads\
    \ the kernel, all its drivers, and the networking servers, then the system will\
    \ display a text login prompt. There, users can enter their user names and their\
    \ passwords. But it doesn't have to boot this way.\n\nThere are 3 modes defined\
    \ in most Linux distributions that can be used for booting. They are defined in\
    \ /etc/inittab and have specific numbers. The first mode, also called runlevel\
    \ 1, is single user mode. That mode will only boot the system for 1 user, with\
    \ no networking. Runlevel 3 is the default mode. It will load the networking servers\
    \ and display a text login prompt. Runlevel 5 is the graphical mode. If you have\
    \ X Window installed and configured, you can use it to display a graphical login\
    \ prompt.\n\nThe way to change this is to edit /etc/inittab and change the initdefault\
    \ line:\n\n```\nid:3:initdefault:\n```\n\nChanging a 3 to a 5 will make the system\
    \ display a xdm graphical screen on bootup.\n\n## Tip 22: More information from\
    \ usenet\n\nThere are newsgroups about everything. Newsgroups on the latest TV\
    \ show, on gardening, and more. There also are newsgroups on Linux. In fact, the\
    \ best help can be obtained from newsgroups. But which ones?\n\nHere is a list\
    \ of a few newsgroups dedicated to Linux, and what they are used for:\n\n- comp.os.linux.advocacy:\
    \ This newsgroup is used for advocacy. People stating their opinions about Linux\
    \ or Linux applications, and about Linux competitors. Some post facts, some will\
    \ flame other people.\n- comp.os.linux.setup: This is a general purpose setup\
    \ help group. Users will post questions and get answers there.\n- linux.\\*: There\
    \ now is a linux section on usenet. Currently there are more than 150 groups in\
    \ linux.\\* and they are all about Linux!\n\nMake sure you read the FAQ and rules\
    \ of every newsgroup you want to post to.\n\n## Tip 23: Bytes per inodes\n\nWhen\
    \ you format a partition using Linux's primary file system, ext2, you have the\
    \ choice of how many bytes per inode you want. From the man page:\n\n```\n-i bytes-per-inode\n\
    \t\tSpecify the bytes/inode ratio. mke2fs creates an\n\t\tinode for every bytes-per-inode\
    \ bytes of space on\n\t\tthe disk.  This value defaults to 4096 bytes.\n\t\tbytes-per-inode\
    \ must be at least 1024.\n```\n\nThis means that by using a smaller size, you\
    \ will save disk space but may slow down the system. It is a space/speed trade\
    \ off.\n\nThis is similar to one of FAT16/FAT32' major differences.\n\n## Tip\
    \ 24: LILO and boot problems\n\nWhen a computer starts, the number of beeps the\
    \ BIOS outputs tells you the state of the computer. On some computers, one beep\
    \ means all is ok, but 2 beeps mean there is an error. LILO uses the same kind\
    \ of codes. The number of letters you see from the word LILO on the screen says\
    \ what is wrong. The whole word means everything is fine, only LI means only the\
    \ first part of LILO could be loaded. A full description of this is available\
    \ from the Bootdisk HOWTO.\n\nWhen LILO can't load, it's a major problem. This\
    \ often means that the boot code was corrupted. The only way to boot is from a\
    \ floppy disk. In RedHat, you can use the rescue disk, in Slackware, you can use\
    \ the boot disk with the \"mount\" image.\n\nWhen LILO is fine, it's often easier\
    \ to figure a boot problem. If the kernel panics when it tries to boot, it is\
    \ usually due to a configuration error. You can tell LILO to mount another kernel\
    \ you may have, like a \"safe\" or \"old\" image you kept for these cases. If\
    \ the problem is in initialization scripts, you can tell LILO to boot directly\
    \ into a shell with the following boot command line:\n\n```\nLILO boot: linux\
    \ init=/bin/sh\n```\n\nWhere \"linux\" would be your kernel image."
  mdcn: "\n# 100 条 Linux 使用技巧与窍门\n\n## 技巧 14：允许用户运行 root 程序\n\n当用户启动一条命令时，该命令以该用户的权限运行。如果你想允许他们以\
    \ root 权限运行某些命令该怎么办？你可以这样做，这被称为 suid。\n\n你可以使用 chmod 命令将某条命令设置为 suid root。这样即使由普通用户启动，它也会以\
    \ root 身份运行。以下是将 mybin 设置为 suid root 的方法：\n\n```\nchmod +s mybin\n```\n\n请注意，对于这个选项你必须非常谨慎。如果该命令存在任何安全漏洞，或者允许用户访问其他文件或程序，那么该用户就可能接管\
    \ root 账户乃至整个系统。\n\n## 技巧 15：Linux 与 NT 的启动\n\n有些人会选择在同一台系统上同时使用 Windows NT 和\
    \ Linux。Windows NT 有自己的引导加载程序 NTLDR，而 Linux 有 LILO。究竟应该由哪一个来管理 MBR？\n\n最安全的做法是先安装\
    \ Windows NT，并将 MBR 交给它。然后，当你安装 Linux 时，指示 LILO 安装到 Linux 分区上。同时将该 Linux 分区设置为活动分区。系统启动时，会加载\
    \ LILO；如果你想启动 Windows NT，LILO 可以加载包含 NTLDR 的 MBR。关于这个主题有一个简明的 HOWTO 文档可供参考，地址为\
    \ <http://metalab.unc.edu/pub/Linux/docs/HOWTO>。\n\n## 技巧 16：烦人的启动信息\n\n在重新编译内核时，你可能会在启动时看到类似下面这样奇怪的信息：\n\
    \n```\nmodprobe: cannot find net-pf-5\nmodprobe: cannot find char-major-14\n```\n\
    \n这些信息来自模块加载器，告诉你它无法找到指定的模块。这种情况通常发生在你编译了某些模块，但 modprobe 试图去加载那些尚未编译的模块，于是它就找不到它们。消除这些信息的方法是将相关模块设置为关闭。在文件\
    \ /etc/conf.modules 中你可以添加如下内容：\n\n```\nalias net-pf-5 off\nalias char-major-14\
    \ off\n```\n\n这样就能阻止 modprobe 去尝试加载它们。当然，你也可以通过编译这些模块、并确保 modprobe 知道它们所在位置来解决这个问题。\n\
    \n## 技巧 17：光盘上的程序\n\n<http://metalab.unc.edu>、<ftp://ftp.cdrom.com> 等网站都提供了大量可供\
    \ Linux 自由使用的程序。但你可能并不愿意通过缓慢的网络连接下载数以 GB 计的数据。\n\n也有一些地方提供将大量自由软件刻录在光盘上进行销售。例如\
    \ <http://www.cheapbytes.com> 和 <http://www.linuxmall.com> 就是两个能够以非常低廉的价格出售包含上述所有程序的多张光盘的地方：\n\
    \n## 技巧 18：国际化控制台\n\n大多数 Linux 发行版默认配置为使用美式英语键盘。如果你需要使用法语或其他语言的键盘，你就需要更改 locale，以便像带音调符号的特殊键位能够在控制台上正常输入。\n\
    \n实现这一点的方法是使用一个名为 loadkeys 的程序来更改系统 locale。例如，要启用加拿大法语 locale，你需要在你的启动文件中添加以下这一行：\n\
    \n```\nloadkeys cf\n```\n\n这里的 cf 表示加拿大法语键盘。其他可用的 locale 还有 us、fr 等。\n\n## 技巧\
    \ 19：多内核选择\n\n当你编译一个新的内核时，通常会修改你的配置。这意味着你可能会忘记包含某些重要的驱动，例如 IDE 驱动，从而导致系统无法启动。解决办法就是始终保留你的旧内核。\n\
    \n在编译内核时，编译过程通常会将你的旧内核复制为 vmlinuz.old。如果它没有这样做，你也可以手动完成。你应该在 /etc/lilo.conf 中添加一项条目，以便能够启动你的旧内核。完整的语法你可以查阅\
    \ lilo 的 man 手册页。你也可以为不同的内核添加多个条目，例如当你希望同时在系统中保留一个较旧但稳定的内核版本以及最新的开发版本时。\n\n请注意，某些发行版会以版本号作为内核文件的命名。例如，你当前的内核可能是\
    \ /boot/vmlinuz-2.0.36-0.7\n\n## 技巧 20：默认文件权限\n\n当你创建一个文件时，系统会赋予它默认的权限。在大多数系统中，该权限为\
    \ 755（所有者可读、可写、可执行，其他用户可读、可执行）。\n\n这个默认值是通过 umask 命令设置的。要使用该命令，你需要找到正确的八进制数传递给它。umask\
    \ 中的权限是从 666 中屏蔽掉相应位得到的。也就是说，umask 为 022 时，得到的默认权限就是 755。若要将默认权限由 755 改为 700，你可以使用下面的命令：\n\
    \n```\numask 077\n```\n\n## 技巧 21：默认启动模式\n\n当 Linux 系统启动时，它会加载内核及其所有驱动，并启动网络服务，然后系统会显示一个文本登录提示符。在那里，用户可以输入用户名和密码。但系统并不一定非得按这种方式启动。\n\
    \n大多数 Linux 发行版中定义了 3 种可用于启动的模式。它们定义在 /etc/inittab 中，并各自有特定的编号。第一种模式也称为运行级别 1，是单用户模式。该模式只会为单个用户启动系统，并且不加载网络。运行级别\
    \ 3 是默认模式。它会加载网络服务，并显示一个文本登录提示符。运行级别 5 是图形模式。如果你已经安装并配置好 X Window，就可以使用它来显示一个图形化的登录提示符。\n\
    \n更改这一设置的方法是编辑 /etc/inittab，并修改其中的 initdefault 行：\n\n```\nid:3:initdefault:\n\
    ```\n\n把其中的 3 改成 5，系统启动时就会显示 xdm 图形登录界面。\n\n## 技巧 22：从 Usenet 获取更多信息\n\nUsenet\
    \ 上有各种各样的新闻组：关于最新电视剧的、关于园艺的，以及更多其他主题。同样也有专门讨论 Linux 的新闻组。事实上，最好的帮助往往可以从新闻组获得。但究竟该关注哪些呢？\n\
    \n下面列出了一些专门面向 Linux 的新闻组，以及它们的用途：\n\n- comp.os.linux.advocacy：该新闻组用于宣传和讨论。人们在此发表他们对\
    \ Linux 或 Linux 应用程序、以及 Linux 竞争对手的看法。有人会发布事实，有人会与他人相互攻击。\n- comp.os.linux.setup：这是一个通用目的的安装帮助组。用户可以在此提问并获得解答。\n\
    - linux.\\*：Usenet 上目前已经有一个 linux 分类。当前在 linux.\\* 下已经有超过 150 个子组，它们全部都是关于 Linux\
    \ 的！\n\n在准备发帖之前，务必阅读每一个你想发帖的新闻组的 FAQ 和规则。\n\n## 技巧 23：每 inode 对应的字节数\n\n在使用 Linux\
    \ 的主要文件系统 ext2 格式化分区时，你可以选择每个 inode 对应多少字节。手册页中的说明如下：\n\n```\n-i bytes-per-inode\n\
    \t\t指定 bytes/inode 的比例。mke2fs 会在磁盘上每\n\t\tbytes-per-inode 字节的空间创建一个 inode。该值默认\n\
    \t\t为 4096 字节。bytes-per-inode 至少必须为 1024。\n```\n\n这意味着，使用更小的值可以节省磁盘空间，但可能会降低系统速度。这是一个空间与速度之间的权衡。\n\
    \n这与 FAT16/FAT32 之间的主要区别之一相似。\n\n## 技巧 24：LILO 与启动问题\n\n计算机启动时，BIOS 发出的蜂鸣声次数会告诉你计算机的状态。在某些计算机上，一声蜂鸣表示一切正常，而两声蜂鸣则表示有错误。LILO\
    \ 也使用了类似的方式：屏幕上你看到的 \"LILO\" 这个单词所显示出的字母个数就表明了问题所在。完整的 \"LILO\" 表示一切正常；只出现 \"\
    LI\" 则意味着只有 LILO 的第一部分被成功加载。完整的说明可参见 Bootdisk HOWTO。\n\n当 LILO 无法加载时，这是一个严重的问题，通常意味着引导代码已被损坏。此时唯一的启动方法就是使用软盘。在\
    \ RedHat 中，你可以使用救援盘；在 Slackware 中，你可以使用带有 \"mount\" 镜像的启动盘。\n\n当 LILO 本身工作正常时，启动问题通常更容易排查。如果内核在启动过程中发生\
    \ panic（内核崩溃），通常是由于配置错误造成的。你可以指示 LILO 去挂载另一个内核，例如你为这种情况保留的 \"safe\" 或 \"old\"\
    \ 镜像。如果问题出在初始化脚本中，你也可以让 LILO 通过下面的启动命令行直接启动到一个 shell：\n\n```\nLILO boot: linux\
    \ init=/bin/sh\n```\n\n其中 \"linux\" 应该是你所要使用的内核镜像名称。\n"
