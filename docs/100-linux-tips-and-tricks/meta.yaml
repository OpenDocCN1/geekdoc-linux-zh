    # Tip 18: Mouse problems


    The mouse is a very important part of a computer. In X, you can''t do much without
    it. Even in console some applications will allow you to use it. You must first
    configure it.


    Like every other device, the mouse has a device file in the /dev directory. Depending
    on your mouse type, it will be either /dev/psaux for a PS/2 mouse, or /dev/cua0
    for a serial mouse on COM1.


    To make it easy to use in the future, you should link the right device file to
    /dev/mouse:


    ```

    ln -s /dev/cua0 /dev/mouse

    ```


    Then, when you configure X Window or any other program that requires a mouse,
    you can specify /dev/mouse.'
