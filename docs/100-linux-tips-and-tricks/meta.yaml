    1 = 5).'
- md: ' # 100 Linux Tips and Tricks


    ## Tip 22: An international background


    To set a background in X Window, most of the time you will use XV or a similar
    program to set a static image. But there is a program out there that allows you
    to put something useful on your background.


    Xearth, available from [http://www.cs.colorado.edu/~tuna/xearth/index.html](http://www.cs.colorado.edu/~tuna/xearth/index.html),
    is a program that will display a map of the world on your background, with some
    useful information. The main use is to display where the sun currently lights
    the planet. It will also display the current time, and stars in the sky if you
    want to.


    Several options exist. By default, Xearth will show a round planet, but you can
    make it display a rectangular map:


    ```

    xearth -proj merc

    ```


    Other options are available, including mono display, the number of colors, and
    the running priority.


    ## Tip 23: Powerful file transfer system


    Downloading several directories from an FTP server, or mirroring a web site, can
    be hard to do using traditional file transfer programs.


    A program called wget is available from the GNU archive at [ftp://ftp.gnu.org](ftp://ftp.gnu.org).
    This is a powerful program allowing you to do advanced functions like fetching
    recursive directories and even retrieving full web sites.


    A graphical frontend using the GTK library is available from [http://usuarios.meridian.es/frimost1/gwget/gwget.htm](http://usuarios.meridian.es/frimost1/gwget/gwget.htm).


    ## Tip 24: Editing in text editors


    One common complaint among new Linux users is that vi or other text editors are
    too hard to use. That may be true, but they aren''t the only available editors.


    Experts used to tell new users to learn ed or vi and that they would not regret
    it. It was true in the past, but it is no longer necessary to learn hard to use
    editors to do powerful text editing.


    Graphical editors most likely came with your distribution. You may not have installed
    them, but they are on your CD-ROM. Some examples are pico, a console full screen
    text editor, and emacs, which work on console and X Window, and is a very powerful
    text editor.


    Desktop interfaces such as GNOME and KDE each come with their own text editors
    too. You can even find more editors on the Web.


    ## Tip 25: Documentation and manual


    Software under Linux rarely comes with printed documentation. Some do, like the
    GIMP and Blender, but most only come with online documentation. This way, you
    can get the documentation at the same time that you download the program.


    There are 2 traditional ways to provide documentation under Unix and Linux:


    The first is man pages. These are small files containing information about every
    command you have on your system. For example, if you want to know what the command
    df does, simply type:


    ```

    man df

    ```


    The man system works with level of commands, from 1 to 8, plus other extensions.
    For full details about the man program, simply see its manual page:


    ```

    man man

    ```


    The second way to provide help is with the info system. These are usually much
    bigger files (the libc info files have more than 10,000 lines of text).


    To access info files, simply type the info command. It is a bit harder to use,
    but you can get help by typing h.


    # Networking


    ## What this chapter covers


    Linux is a networking operating system. Even so, problems related to networking
    are not uncommon. PPP dialup can be hard to setup, local network IP address issues
    can be hard to understand. We try to solve most common problems here with tips
    on how to make your networking and Internet experience a good one.


    ## Tip 1: Easy PPP dialup


    By default, most Linux distributions come with text-based configuration files
    and console menu-based configuration programs for PPP dialup. Often, this simply
    isn''t enough for most new users.


    Several GUI programs exist and can be used to configure your PPP dialup. One is
    X-isp, available from http://users.hol.gr/~dbouras/. You may still need to edit
    the pap-secrets file in /etc/ppp.


    Another is the Gnome PPP dialer. It comes with Gnome and can be used with no text
    file editing. Be sure to put a "*" in the "Remote address" field if it should
    be set dynamically.


    Here is a quick guide to setup the Gnome PPP program. First make sure the pppd
    program is suid root. Then, enter your user name, password and "*" in the remote
    IP field. Enter the DNS server, and set your IP address or set to dynamic. This
    should work for most Internet providers. Check the PPP-HOWTO for a complete overview
    of the PPP programs.


    This is the Gnome PPP interface:


    ![](img/4fc015bbc2a49bafd7ac218106b1313d_84_0.png)


    ## Tip 2: Internet for your LAN


    Many companies have local networks, and it is becoming even more popular in homes,
    where 2 or 3 systems are linked together using ethernet wires. Most providers
    only offer 1 IP address per connection, which means that you can''t put all of
    the systems on the Internet at the same time, unless you use a special gateway.


    Linux comes with something called IP-Masquerade. With it, you can assign LAN IPs,
    which are IPs that can''t go on the Internet directly, and then use the Linux
    system as a gateway. All you need to implement this is a Linux system with 2 ethernet
    cards, and an Internet connection. The Linux system has IP-Masquerade enabled,
    and the LAN systems will have access to the Internet using the Linux gateway as
    a transparent proxy server.


    You can find more on the subject by reading the IP-Masq HOWTO and other networking
    documentation at [http://metalab.unc.edu/pub/Linux/docs](http://metalab.unc.edu/pub/Linux/docs).
    You also need to make sure your Internet provider accepts this kind of network
    on their connection.


    ## Tip 3: Domains to search in


    When you try to access a Web site, or any remote site, you need to specify the
    full hostname. This means the machine name plus the domain name:


    ```

    lynx my.yahoo.com

    ```


    If you have a few domain names that you access a lot, you can make your life easier.
    You can edit /etc/resolv.conf and add the domains there:


    ```

    search domain.net yahoo.com

    ```


    This means that the system will search in those domains for hostnames. From now
    on type:


    ```

    lynx my

    ```


    The system will now look for "my", if that hostname doesn''t exist it will look
    for "my.domain.net", and at last "my.yahoo.com".


    ## Tip 4: Display IP rather than hostname


    When dealing with networking issues, it often helps to be able to use only IP
    addresses rather than hostnames. Why? For 2 reasons. First, the name server might
    not always be available if routing is being changed. And most important, you may
    not have the time to wait for all the IP resolving to be done.


    Fortunately, many networking utilities in Linux share a common option flag. The
    -n flag. It will allow you to make the utility display IP addresses rather than
    hostnames. Here are a few examples:


    ```

    netstat -an

    traceroute 1.2.3.4 -n

    arp -n -a -i eth0 -a proxy

    ```


    These commands were all given the -n flag and will display only IP addresses.


    ## Tip 5: Is my modem a winmodem?


    Winmodems are modems which lack some hardware. They use software drivers to emulate
    the hardware, and the CPU to do some tasks. Unfortunately the drivers provided
    by the winmodem manufacturers are Windows only.


    There is no sure way to know if the modem should work in Linux or not, except
    trying it yourself, or ask someone else who has tried it. Fortunately, there is
    a Web site with a very long list of modems that are known to work in Linux, and
    those that are winmodems. The Web site can be found at http://www.o2.net/~gromitkc/winmodem.html.


    ## Tip 6: Sharing files from a Windows system


    The protocol to use to be able to share files with Windows systems is called SMB.
    Linux supports natively a lot of file systems and network protocols. SMB is one
    of them. To be able to mount a Windows file system to share files, that system
    needs to have file sharing enabled, and you need to enable SMB support in the
    kernel. You also need to download a program called Samba which allows you to share
    remote file systems, and build yourself a server. General information about how
    to connect Linux, Windows machines and Macs is on the Web at [http://www.eats.com/linux_mac_win.html](http://www.eats.com/linux_mac_win.html).


    If SMB is not a possibility, you could use FTP. Linux by default has an FTP server
    turned on. Windows FTP servers are also available for free.'
  mdcn: "\n # Linux 百技百法\n\n## 第 22 法：国际范儿的桌面背景\n\n在 X Window 中设置桌面背景，大多数情况下你会使用 XV\
    \ 或类似的程序来设置一张静态图片。但其实有一款程序能让你在桌面上显示一些实用的东西。\n\nXearth 可以从 [http://www.cs.colorado.edu/~tuna/xearth/index.html](http://www.cs.colorado.edu/~tuna/xearth/index.html)\
    \ 获取，它能在你的桌面上显示一幅世界地图，并附带一些实用信息。其主要功能是显示当前太阳照射地球的位置。如果你愿意，它还可以显示当前时间以及天空中的星星。\n\
    \n它提供了多个选项。默认情况下，Xearth 会显示圆形的地球，但你也可以让它显示矩形地图：\n\n```\nxearth -proj merc\n```\n\
    \n还有其他选项可供选择，包括单色显示、颜色数量以及运行优先级。\n\n## 第 23 法：强大的文件传输系统\n\n要从 FTP 服务器下载多个目录，或者镜像整个网站，使用传统的文件传输程序来完成可能会很困难。\n\
    \n一款名为 wget 的程序可以从 GNU 档案库 [ftp://ftp.gnu.org](ftp://ftp.gnu.org) 获取。这是一个功能强大的程序，允许你执行高级功能，例如递归获取目录，甚至可以下载完整的网站。\n\
    \n使用 GTK 库的图形前端可以从 [http://usuarios.meridian.es/frimost1/gwget/gwget.htm](http://usuarios.meridian.es/frimost1/gwget/gwget.htm)\
    \ 获取。\n\n## 第 24 法：在文本编辑器中编辑\n\nLinux 新用户常见的抱怨之一是 vi 或其他文本编辑器太难用了。这或许是真的，但它们并非唯一可用的编辑器。\n\
    \n专家们过去常常告诉新用户去学习 ed 或 vi，并说他们不会后悔的。这在过去是对的，但现在想要进行强大的文本编辑，已经不必再去学习那些难用的编辑器了。\n\
    \n图形化编辑器很可能已经随你的发行版一起提供了。你可能没有安装它们，但它们就在你的 CD-ROM 上。一些例子包括 pico，一个控制台全屏文本编辑器，以及\
    \ emacs，它可以在控制台和 X Window 下工作，是一款非常强大的文本编辑器。\n\nGNOME 和 KDE 等桌面环境也都自带了各自的文本编辑器。你甚至可以在网上找到更多编辑器。\n\
    \n## 第 25 法：文档与手册\n\nLinux 下的软件很少附带印刷版文档。有些软件会提供，比如 GIMP 和 Blender，但大多数只提供在线文档。这样，你可以在下载程序的同时获取文档。\n\
    \n在 Unix 和 Linux 下，有 2 种传统的方式来提供文档：\n\n第一种是 man 页面。这些是一些小的文件，包含系统中每个命令的信息。例如，如果你想知道\
    \ `df` 命令的作用，只需输入：\n\n```\nman df\n```\n\nman 系统为命令划分了级别，从 1 到 8，外加其他扩展。要获取关于\
    \ man 程序的完整信息，只需查看它的手册页：\n\n```\nman man\n```\n\n第二种提供帮助的系统方式是 info 系统。这些通常是更大的文件（libc\
    \ 的 info 文件就有超过 10,000 行的文本）。\n\n要访问 info 文件，只需输入 info 命令。它使用起来有一点难度，但你可以通过输入\
    \ h 来获取帮助。\n\n# 网络\n\n## 本章内容涵盖\n\nLinux 是一个网络操作系统。即便如此，与网络相关的问题仍然屡见不鲜。PPP 拨号可能难以设置，局域网\
    \ IP 地址问题可能难以理解。我们在这里尝试解决最常见的问题，并给出如何让你的网络和互联网体验变得良好的建议。\n\n## 第 1 法：快捷的 PPP 拨号\n\
    \n默认情况下，大多数 Linux 发行版都带有基于文本的配置文件和基于控制台菜单的配置程序来进行 PPP 拨号。通常，这对于大多数新用户来说远远不够。\n\
    \n存在一些 GUI 程序可以用来配置你的 PPP 拨号。其中一个是 X-isp，可以从 http://users.hol.gr/~dbouras/ 获取。你可能仍然需要编辑\
    \ `/etc/ppp` 中的 `pap-secrets` 文件。\n\n另一个是 GNOME PPP 拨号器。它随 GNOME 一起提供，并且无需编辑任何文本文件即可使用。如果\
    \ IP 地址是动态分配的，请务必在\"远程地址\"字段中填入\"*\"。\n\n以下是设置 GNOME PPP 程序的快速指南。首先确保 `pppd` 程序设置了\
    \ suid root 权限。然后，输入你的用户名、密码，并在远程 IP 字段中填入\"*\"。输入 DNS 服务器，并设置你的 IP 地址或设置为动态分配。这对于大多数互联网提供商来说应该都能正常工作。查看\
    \ PPP-HOWTO 以获取 PPP 程序的完整概述。\n\n这是 GNOME PPP 的界面：\n\n![](img/4fc015bbc2a49bafd7ac218106b1313d_84_0.png)\n\
    \n## 第 2 法：为局域网提供互联网\n\n许多公司拥有局域网，而在家庭中，使用以太网线将 2 或 3 台系统连接在一起也正变得越来越普遍。大多数提供商每个连接只提供\
    \ 1 个 IP 地址，这意味着你无法让所有系统同时上网，除非你使用一个特殊的网关。\n\nLinux 自带了一项称为 IP-Masquerade（IP 伪装）的功能。通过它，你可以分配局域网\
    \ IP，这些 IP 不能直接访问互联网，然后以 Linux 系统作为网关。实现这一点仅需一台带有 2 张以太网卡的 Linux 系统和一条互联网连接。Linux\
    \ 系统启用了 IP-Masquerade，局域网系统就能通过 Linux 网关作为透明代理服务器来访问互联网。\n\n你可以在 [http://metalab.unc.edu/pub/Linux/docs](http://metalab.unc.edu/pub/Linux/docs)\
    \ 阅读 IP-Masq HOWTO 和其他网络文档来了解更多相关内容。你还需要确保你的互联网提供商允许在他们的连接上使用这种网络。\n\n## 第 3 法：要搜索的域\n\
    \n当你尝试访问一个网站或任何远程站点时，你需要指定完整的主机名。这意味着机器名加上域名：\n\n```\nlynx my.yahoo.com\n```\n\
    \n如果你有一些经常访问的域名，你可以让生活更轻松一些。你可以编辑 `/etc/resolv.conf` 并在其中添加这些域名：\n\n```\nsearch\
    \ domain.net yahoo.com\n```\n\n这意味着系统会在这些域中搜索主机名。从此以后输入：\n\n```\nlynx my\n```\n\
    \n系统现在会查找\"my\"，如果该主机名不存在，它会查找\"my.domain.net\"，最后查找\"my.yahoo.com\"。\n\n## 第\
    \ 4 法：显示 IP 而非主机名\n\n在处理网络问题时，能够只使用 IP 地址而非主机名通常会很有帮助。为什么呢？有 2 个原因。首先，如果路由正在更改，名称服务器可能并不总是可用。最重要的是，你可能没有时间去等待所有\
    \ IP 解析完成。\n\n幸运的是，Linux 中的许多网络实用程序共享一个通用的选项标志：`-n` 标志。它能让你使该实用程序显示 IP 地址而非主机名。以下是一些例子：\n\
    \n```\nnetstat -an\ntraceroute 1.2.3.4 -n\narp -n -a -i eth0 -a proxy\n```\n\n\
    这些命令都带有 `-n` 标志，将只显示 IP 地址。\n\n## 第 5 法：我的调制解调器是 winmodem 吗？\n\nWinmodem（软猫）是缺少部分硬件的调制解调器。它们使用软件驱动程序来模拟硬件，并由\
    \ CPU 来执行一些任务。不幸的是，winmodem 制造商提供的驱动程序仅支持 Windows。\n\n除了亲自尝试，或者询问其他已经尝试过的人之外，没有绝对可靠的方法来判断调制解调器是否能在\
    \ Linux 下工作。幸运的是，有一个网站列出了大量已知能在 Linux 下工作的调制解调器，以及那些 winmodem。该网站位于 http://www.o2.net/~gromitkc/winmodem.html。\n\
    \n## 第 6 法：从 Windows 系统共享文件\n\n要与 Windows 系统共享文件，需要使用的协议叫做 SMB。Linux 原生支持大量文件系统和网络协议，SMB\
    \ 便是其中之一。要能够挂载 Windows 文件系统来共享文件，该系统需要启用文件共享，并且你需要在内核中启用 SMB 支持。你还需要下载一个名为 Samba\
    \ 的程序，它可以让你共享远程文件系统，并自行搭建服务器。关于如何连接 Linux、Windows 计算机和 Mac 的通用信息可以在 [http://www.eats.com/linux_mac_win.html](http://www.eats.com/linux_mac_win.html)\
    \ 找到。\n\n如果 SMB 不可行，你可以使用 FTP。Linux 默认开启了 FTP 服务器。Windows FTP 服务器也可以免费获取。\n"
