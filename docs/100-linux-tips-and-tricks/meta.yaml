    # Tip 4: Multiple accounts in Pine


    You can use multiple POP3, IMAP or other incoming mail accounts in the same config
    file by editing the line "incoming-folders=" from .pinerc in your local home directory.


    The syntax is:


    ```

    incoming-folders= "Nick1" {pop1.domain.com/pop3/user=login}INBOX,

    "Nick2" {pop2.somewhere.com/pop3/user=login}INBOX

    ```


    This will create a new collection in Pine with these folders in it, plus the mail
    folder on the local system.'
