    # What this chapter covers


    Hardware support has once been a very big problem with Linux. Generic hardware
    always was well supported, but most of the hardware today is unfortunately non-generic.
    100% Sound Blaster compatible cards often are not detected by the Sound Blaster
    driver, and non-PostScript printers don''t accept PostScript input unless a program
    previously converted it. These are the kind of problems we solve here.'
