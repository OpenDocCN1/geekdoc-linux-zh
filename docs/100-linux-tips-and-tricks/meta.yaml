- md: ' # 100 Linux Tips and Tricks


    ## Tip 11: Find files


    Find is a very useful and powerful utility. It is often used by system administration
    and in shell scripts. Here are 2 commands that might be useful:


    ```

    find / -perm -4000 -print

    ```


    This command will find every file on the system that is suid. This means that
    when you run it you will be running it as an other user. For example, traceroute
    is a utility that needs to be run as root. To allow users to run it, systems administrators
    will set it suid root so it will be run as root even if a user starts it. This
    can be useful, but can also be a big security risk if the utility has a security
    hole in it.


    Here is another interesting command:


    ```

    find / -atime +10 -print

    ```


    This command will find all the files accessed more than 10 days ago. Commands
    like this one can be useful to find old files that need to be backuped or erased.


    ## Tip 12: asm or linux include files not found


    On older Linux systems, you may have some errors about include files not found
    in the asm/ or linux/ directory when you try to compile some programs. This means
    that the kernel source code was not installed. Both asm/ and linux/ directories
    are links to the kernel source code.


    To install them on your system, you need to get the kernel source code. Then you
    need to link the directories:


    ```

    ln -s /usr/src/linux/include/asm /usr/include/asm

    ln -s /usr/src/linux/include/linux /usr/include/linux

    ```


    This will link the 2 directories in the include tree allowing applications to
    find them.


    ## Tip 13: ICQ on Linux


    The original ICQ client does not currently run on Linux. Fortunately, there are
    clones that do run on Linux and offer the ICQ service to users. A popular ICQ
    program is Licq available from http://licq.wibble.net. Another popular one is
    Micq available at http://micq.chatzone.org. Other ICQ programs are also available
    for Linux. This is licq:


    ## Tip 14: Reading foreign documents


    Linux comes with various freely available word processors and office suites. Unfortunately,
    Microsoft Office doesn''t come with a Linux native port. But you can still read
    and write Word and Excel files.


    Word Perfect is a Corel word processor product that has a Linux port. The latest
    version is Word Perfect 8. It is available freely for personal use on Linux, and
    will read and write Word files. It is available from http://linux.corel.com. Another
    program is Star Office. This product from Star Division looks very much like Microsoft
    Office and offers similar features. It will also read and write all kinds of file
    formats. Star Office is available freely for personal use from http://www.stardivision.com:


    ## Tip 15: Scanning with Linux


    A number of scanning programs exist for Linux. A popular one currently is SANE
    which stands for "Scanner Access Now Easy" and is available from http://www.mostang.com/sane.
    It is an application programming interface that provides standardized access to
    scanners.


    Several graphical frontends are also available from the SANE Web page.


    ## Tip 16: Real audio and video


    Real Networks has released their Real Player for Linux. Unfortunately, many users
    had problems setting it up. When running an older kernel, you may need to disable
    the 16bits sound playback. When running the Linux kernel 2.2 with Real Player
    5.0, you may need to use a workaround to get the Real Player to work. The workaround
    is available from the Web.


    Real Networks provides the Real Player for Linux and for RedHat Linux. The RedHat
    Linux version comes in the RPM format. Here it is:


    ## Tip 17: Emulation


    Linux is source compatible with Unix. This means that all of the Unix programs
    should work on Linux when compiled correctly, with little or no change to the
    source. Unix does provide a wide variety of software programs, but some programs
    are only available on non-Unix systems.


    A number of emulators are available on Linux. We''ll see 4 of them:


    - One of them is called WINE and stands for WINE Is Not an Emulator. It used to
    stand for Windows Emulator. WINE will run various Windows 16bits and 32bits applications.
    The home page for WINE is at http://www.winehq.com.


    - To emulate DOS programs, a program called DOSEmu exists. That program comes
    with an X Window interface and a console interface. It will run most DOS programs.
    You may want to run graphic-intensive programs like DOS games in the console interface
    of DOSEmu. Like WINE, DOSEmu is a free product.


    - To emulate MacOS programs, a commercial program called Executor exists. It will
    run a MacOS-like shell in X Window and will run various MacOS programs.


    - A new commercial program is now available for every OS. It is called VMware
    and will create a virtual PC, allowing you to run nearly any operating system,
    including DOS, Windows NT and FreeBSD. It is very stable and comes with a 30 day
    free license.


    ## Tip 18: Shared library not found


    Binaries need to load shared libraries at runtime. They are files on your system
    that provide functions to the program. Sometimes the program will report that
    a shared library was not found, and it will abort.


    To find which libraries a program needs, you can use the ldd program. It will
    list all those libraries and those missing. If you know that a library is installed,
    maybe you need to add it to the current library path. The path used to look for
    shared libraries is in /etc/ld.so.conf. You can modify that file and add any path
    you want, then as root run the ldconfig program.


    ## Tip 19: Hard to erase files


    File names in Linux can have many letters and numbers in them. Usually, names
    should not have spaces in them, although Linux can deal with them. There are some
    characters that should not be used in files, like "/" and "~".


    Some programs unfortunately will create strange looking file names, often as temporary
    files. Using the rm command, you should be able to remove them, but it may be
    hard when strange alphanumeric characters are used. Here are a few ways you should
    try to get rid of a file with a strange name:


    - First you should try the following:


    ```

    rm -f "file name"

    ```


    - If this doesn''t work you should try the console program mc.


    - With graphical file managers, you should be able to pick an icon and remove
    it, regardless of the file name.


    ## Tip 20: Files permissions


    When you try to run a file it may refuse to work with an error like "Permission
    denied" and when you try to view another file it may also say that you don''t
    have permission to view it. These all come down to file permissions, a basic feature
    of Unix.


    There are 3 types of permissions: read, write and execute. When you list files
    it will say which permission the files have:


    ```

    ls -l file.dat

    -rw-r--r--  1 root    users      1656 Mar 22 00:27 file.dat

    ```


    The first part of that line is the permissions. They are, in order, the user permissions,
    the group permissions and others permissions, where r means read, w means write
    and x means execute. For this file, the user, root, has read and write permission
    (rw-), the group, users, can only read the file (r--) and everyone else can also
    only read the file (r--).


    Other letters may appear. The first letter is - for a normal file, d for a directory
    and c or b for a device. In place of x you may see a letter s. This means that
    when you start a program, it will run as its owner.


    ## Tip 21: Changing file permissions


    To change a file''s permissions, you need to use a program called chmod. With
    that command you can change one or multiple file permissions. Here are a few examples:


    ```

    $ chmod 755 file

    $ ls -l file

    -rwxr-xr-x  1 root    users       1656 Mar 22 00:27 file

    $ chmod 700 file

    $ ls -l file

    -rwx------  1 root    users       1656 Mar 22 00:27 file

    $ chmod 664 file

    $ ls -l file

    -rw-rw-r--  1 root    users       1656 Mar 22 00:27 file

    ```


    The numbers are based on the 3 types of permissions. Read = 4, write = 2 and execute
    = 1. A permission of 755 means the user will have read, write and execute permissions
    (4 + 2 + 1 = 7), and everyone else will have read and execute permissions (4 +
    1 = 5).'
