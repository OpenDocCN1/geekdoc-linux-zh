    ```

    search domain.net yahoo.com

    ```


    This means that the system will search in those domains for hostnames. From now
    on type:


    ```

    lynx my

    ```


    The system will now look for "my", if that hostname doesn''t exist it will look
    for "my.domain.net", and at last "my.yahoo.com".'
  - '[PAGE 87]


    # 100 Linux Tips and Tricks


    # Tip 4: Display IP rather than hostname


    When dealing with networking issues, it often helps to be able to use only IP
    addresses rather than hostnames. Why? For 2 reasons. First, the name server might
    not always be available if routing is being changed. And most important, you may
    not have the time to wait for all the IP resolving to be done.


    Fortunately, many networking utilities in Linux share a common option flag. The
    -n flag. It will allow you to make the utility display IP addresses rather than
    hostnames. Here are a few examples:


    ```

    netstat -an

    traceroute 1.2.3.4 -n

    arp -n -a -i eth0 -a proxy

    ```


    These commands were all given the -n flag and will display only IP addresses.'
  - '[PAGE 88]


    # 100 Linux Tips and Tricks


    # Tip 5: Is my modem a winmodem?


    Winmodems are modems which lack some hardware. They use software drivers to emulate
    the hardware, and the CPU to do some tasks. Unfortunately the drivers provided
    by the winmodem manufacturers are Windows only.


    There is no sure way to know if the modem should work in Linux or not, except
    trying it yourself, or ask someone else who has tried it. Fortunately, there is
    a Web site with a very long list of modems that are known to work in Linux, and
    those that are winmodems. The Web site can be found at http://www.o2.net/~gromitkc/winmodem.html.'
  - '[PAGE 89]


    # 100 Linux Tips and Tricks


    # Tip 6: Sharing files from a Windows system


    The protocol to use to be able to share files with Windows systems is called SMB.
    Linux supports natively a lot of file systems and network protocols. SMB is one
    of them. To be able to mount a Windows file system to share files, that system
    needs to have file sharing enabled, and you need to enable SMB support in the
    kernel. You also need to download a program called Samba which allows you to share
    remote file systems, and build yourself a server. General information about how
    to connect Linux, Windows machines and Macs is on the Web at [http://www.eats.com/linux_mac_win.html](http://www.eats.com/linux_mac_win.html).


    If SMB is not a possibility, you could use FTP. Linux by default has an FTP server
    turned on. Windows FTP servers are also available for free.'
- md: '# 100 Linux Tips and Tricks


    ## Tip 7: Sorry but this host is not in my list


    Mail clients require you to specify your server for incoming mail, but they also
    need a server for outgoing mail. If you have sendmail or Qmail running, you can
    use localhost. If not, you may use your provider''s mail server.


    If you setup your own mail server, you may have problems sending mail from other
    systems on your network. Mail servers often block clients from using them for
    outgoing mail to prevent relaying. You need to specify the hosts where you will
    be sending mail from. Here is how to do it in Qmail, from the FAQ. You need to
    put the following line in /etc/hosts.allow:


    ```

    tcp-env: ip1, ip2, ip3: setenv = RELAYCLIENT

    ```


    ## Tip 8: Access to various networks


    Big corporations often sub-divide their networks into small networks, hidden behind
    gateways. To access them, you need to tell your Linux system that there is a gateway
    to use to access the networks.


    The route program makes it easy to add networks, hosts and gateways to your routing
    table. To add a default gateway, for example to access the Internet, you can set
    it as default with the following line:


    ```

    route add default gw 10.0.0.1

    ```


    This will work if you need to access the Internet via the 10.0.0.1 gateway. Now,
    if you want to access networks 10.1.0.0 and 10.2.0.0 through other gateways, here
    is what you will want to do:


    ```

    route add -net 10.1.0.0 gw 10.0.0.10

    route add -net 10.2.0.0 gw 10.0.0.20

    ```


    ## Tip 9: Accessing remote file systems


    SMB is the most popular protocol to access Windows systems. But from the Unix
    world comes NFS. NFS is a way to share files that predates SMB and Samba, and
    comes compiled in most Linux distributions. To enable file sharing, you must have
    the nfsd and mountd daemons running. You also need to add the IPs of the systems
    you want to allow in /etc/exports.


    To access remote file systems, you simply mount them like local hard drives. To
    mount /usr/files from 1.2.3.4 into /mnt/files, simply type:


    ```

    mount -tnfs 1.2.3.4:/usr/files /mnt/files

    ```


    The -tnfs parameter may be omitted.


    ## Tip 10: Secure Web server


    Electronic commerce is becoming very popular on the Internet. Companies will often
    pay thousands of dollars for commercial packages to deliver secure content to
    customers on the Web. You can setup one of the most popular Web servers, Apache,
    running on Linux and serving secure content, for free.


    To setup Apache to deliver secure content, you will need to get a cryptographic
    package called OpenSSL, based on the SSLeay library. The place to start is at
    http://www.apache-ssl.org. From there, you can download the needed patches to
    make Apache into a secure web server.


    Detailed instructions are available in the packages, but here is a quick step-by-step
    guide:


    - First, you need to download 3 packages: Apache itself, the corresponding Apache-SSL
    patch and OpenSSL.


    - Then you need to patch the Apache distribution and compile the SSL library.


    - After editing the configuration file in the Apache directory, and setting the
    right paths and libraries to use, you can compile Apache and then create a test
    certificate.


    - All you have to do now is install Apache and configure it to use your test certificate.


    Note that while Apache and the SSLeay library are free, you may need to pay to
    get signed certificates from commercial companies. Also, due to export laws in
    various countries, you may want to check your local laws before using any encrypting
    product.


    ## Tip 11: Secure alternative to telnet


    Telnet is a protocol allowing you to connect to a remote system and run programs
    and commands on that system. It is very old and still very much in use today.


    Unfortunately, a telnet client sends the user password as clear text, and the
    connection is not encrypted. On the other hand, a program called ssh exists that
    can replace both telnet and ftp in a secure, encrypted way.


    Ssh stands for Secure Shell. It will encrypt each connection with a random key,
    so that it is impossible or at least very hard for a third party to decrypt the
    connection and find the password, or spy on you.


    ## Tip 12: Speed problems on a PPP connection


    PPPd is the PPP connection daemon. It will try to connect to a server using a
    specified speed. The default speed is 38400. If you use a serial connection, or
    a 56.7Kbps modem, it may not be enough. If you want to use all the available bandwidth,
    you need to increase that number. For example, for a serial connection, you want
    the speed set at 115200.


    Another reason for speed drops is unwanted packets. You may want to filter unwanted
    packets out of your network, like some ICMP messages and chat connections.


    A last possibility for speed drops is Denial of Service attacks. DoS attacks are
    unfortunately very real and they occur a lot. Malicious people that can''t handle
    their problems elsewhere turn to the Internet and launch attacks against networks.
    An attack against one user will always affect several thousands of people. By
    using bandwidth of an Internet provider to cause trouble to any one user, the
    whole provider will be affected. To prevent such attacks, firewalls exist, and
    tracking tools were invented to deal with abusers. MCI has a tool called DoSTrack
    that can be of help if you are victim of such an attack. For more information
    about various DoS attacks, you should search the Web.


    ## Tip 13: Names and name servers


    Internet hostnames and domains are resolved using the Domain Name System (DNS)
    using Name Servers (NS). These name servers are usually hosted by your Internet
    provider. You can also host your own name server, using the program named. Every
    name server, upon receiving a request to resolve a hostname, will ask an upstream
    name server if it doesn''t know the answer. Your name server may ask your ISP''s
    name server, which will ask the backbone''s main name server, which will ask a
    root server.


    Linux knows which name server to ask by looking in /etc/resolv.conf. In that file,
    a number of name servers may be specified in the following way:


    ```

    nameserver 192.168.0.1

    nameserver 205.237.65.254

    ```


    The name server itself, named, has a configuration file which is usually /etc/named.conf.
    In that file, you configure the domain names you are responsible for, and the
    zone file to use. A nice introduction to running a name server is available in
    the various named man pages.


    Various utilities are related to resolving hostnames. One is called whois, and
    will query the Internet main name servers to know who owns a domain:


    ```

    whois linux.org

    ```


    Another utility is called nslookup. That command will allow you to resolve hosts,
    and to get all kinds of information about a domain. See the man page for more.


    ## Tip 14: Who owns this port


    Several utilities exist to check which ports are open, who is connected to your
    system and even what process owns a port number.


    First a few ground rules. Ports below 1024 are reserved for common services, and
    only root can use them. Standard port numbers can be found in /etc/services. The
    maximum number of ports is 65k, so you have more than enough Internet ports for
    all your services.


    Here are some useful utilities. Netstat is a command that will list both the open
    ports and who is connected to your system. You should run it like this:


    ```

    netstat -an | more

    ```


    This way you can find out who is connected to which service.


    Another interesting command is the fuser program. This program can tell you which
    user and process owns a port. For example, the following command will tell you
    who owns port 6000:


    ```

    fuser -v -n tcp 6000

    ```


    ## Tip 15: Network printers


    By tradition in Unix most services come with networking capabilities. This includes
    the printing server. You don''t need to get third party software to make a printing
    server.


    The lpd daemon allows you to print to your local printer, but also allows others
    to print on it, if you allow them.


    By default the printing software will read on port 515 on the UDP protocol. It
    will allow hosts listed in the /etc/hosts.lpd to print using your printer.


    For a full overview of the printing service, you should check the printing howto
    on the Web.'
  mdcn: '

    # 100 个 Linux 技巧与窍门


    ## 技巧 7：抱歉，此主机不在我的列表中


    邮件客户端要求你指定接收邮件的服务器，但它们也需要一个发送邮件的服务器。如果你运行了 sendmail 或 Qmail，可以使用 localhost。如果没有，可以使用你的服务提供商提供的邮件服务器。


    如果你设置了自己的邮件服务器，可能会在从网络上的其他系统发送邮件时遇到问题。邮件服务器经常会阻止客户端使用它们来发送外发邮件，以防被用作转发。你需要指定允许通过你的服务器发送邮件的主机。以下是在
    Qmail 中如何操作（摘自 FAQ）。你需要在 /etc/hosts.allow 中加入以下一行：


    ```

    tcp-env: ip1, ip2, ip3: setenv = RELAYCLIENT

    ```


    ## 技巧 8：访问各种网络


    大型公司通常将其网络划分为若干小网络，并隐藏在网关之后。要访问这些网络，你需要告诉你的 Linux 系统存在一个用于访问这些网络的网关。


    route 程序使得向路由表中添加网络、主机和网关变得很容易。例如，要添加默认网关以访问互联网，你可以使用以下命令将其设置为默认网关：


    ```

    route add default gw 10.0.0.1

    ```


    如果你需要通过 10.0.0.1 这个网关访问互联网，这条命令是可行的。现在，如果你希望通过其他网关访问 10.1.0.0 和 10.2.0.0 网络，可以这样做：


    ```

    route add -net 10.1.0.0 gw 10.0.0.10

    route add -net 10.2.0.0 gw 10.0.0.20

    ```


    ## 技巧 9：访问远程文件系统


    SMB 是访问 Windows 系统最常用的协议。但 Unix 阵营也带来了 NFS。NFS 是一种文件共享方式，它早于 SMB 和 Samba 出现，并且在大多数
    Linux 发行版中都已经编译好。要启用文件共享，你必须让 nfsd 和 mountd 守护进程保持运行。同时你还需要在 /etc/exports 中添加你希望允许访问的系统的
    IP 地址。


    要访问远程文件系统，你只需像挂载本地硬盘一样挂载它们即可。要将 1.2.3.4 上的 /usr/files 挂载到 /mnt/files，只需输入：


    ```

    mount -tnfs 1.2.3.4:/usr/files /mnt/files

    ```


    -tnfs 参数可以省略。


    ## 技巧 10：安全的 Web 服务器


    电子商务在互联网上正变得越来越流行。公司经常花费数千美元购买商业软件包，以便通过 Web 向客户提供安全内容。你可以免费搭建一台运行在 Linux 上的、非常流行的
    Web 服务器 Apache，并对外提供安全内容。


    要让 Apache 提供安全内容，你需要获取一个名为 OpenSSL 的加密软件包，它是基于 SSLeay 库开发的。起点可以访问 http://www.apache-ssl.org。在那里，你可以下载将
    Apache 改造为安全 Web 服务器所需的补丁。


    软件包中提供了详细的安装说明，以下是一个快速的步骤指南：


    - 首先，你需要下载 3 个软件包：Apache 本身、与之对应的 Apache-SSL 补丁以及 OpenSSL。


    - 然后你需要为 Apache 源码打上补丁并编译 SSL 库。


    - 在编辑 Apache 目录中的配置文件并设置好正确的路径和库之后，就可以编译 Apache，然后创建测试证书。


    - 现在你所要做的就是安装 Apache，并配置它使用你的测试证书。


    请注意，虽然 Apache 和 SSLeay 库都是免费的，但你可能需要向商业公司付费以获得由其签发的证书。此外，由于各国出口法规的不同，在使用任何加密产品之前，你可能需要查阅当地的法律法规。


    ## 技巧 11：telnet 的安全替代方案


    Telnet 是一种允许你连接到远程系统并在该系统上运行程序和命令的协议。它非常古老，但今天仍在广泛使用。


    不幸的是，telnet 客户端以明文形式发送用户密码，并且连接未加密。另一方面，存在一个名为 ssh 的程序，它可以以安全、加密的方式替代 telnet 和
    ftp。


    Ssh 是 Secure Shell 的缩写。它会使用随机密钥对每个连接进行加密，因此第三方几乎不可能——至少是极难——解密连接并获取密码，或窥探你的通信内容。


    ## 技巧 12：PPP 连接上的速度问题


    PPPd 是 PPP 连接守护进程。它会尝试以指定的速度连接服务器。默认速度是 38400。如果你使用串口连接或 56.7Kbps 调制解调器，这个速度可能不够。如果你想使用所有可用带宽，需要提高这个数值。例如，对于串口连接，应将速度设置为
    115200。


    速度下降的另一个原因是存在不必要的报文。你可能希望过滤掉网络中那些不需要的报文，例如某些 ICMP 报文和聊天连接。


    速度下降最后一种可能是拒绝服务攻击（DoS）。DoS 攻击是真实存在的，而且经常发生。那些在现实中无法处理问题的人，就会转向互联网，对网络发起攻击。针对单个用户的攻击往往会影响到成千上万的人。恶意攻击者利用互联网服务提供商的网络带宽去骚扰某一个用户，会影响到整个提供商的网络。要防范此类攻击，人们开发了防火墙，并发明了跟踪工具来处理滥用者。MCI
    提供一个名为 DoSTrack 的工具，如果你是此类攻击的受害者，它会有所帮助。要了解有关各种 DoS 攻击的更多信息，你应该在网上进行搜索。


    ## 技巧 13：名称与域名服务器


    互联网主机名和域名是使用域名系统（DNS）通过域名服务器（NS）来解析的。这些域名服务器通常由你的互联网提供商托管。你也可以使用名为 named 的程序托管自己的域名服务器。每台域名服务器在收到解析主机名的请求时，如果自己不知道答案，就会去询问上游域名服务器。你的域名服务器可能会询问你
    ISP 的域名服务器，后者会去询问骨干网的主域名服务器，主域名服务器再去询问根服务器。


    Linux 通过查看 /etc/resolv.conf 来知道应该询问哪个域名服务器。在该文件中，可以按以下格式指定多个域名服务器：


    ```

    nameserver 192.168.0.1

    nameserver 205.237.65.254

    ```


    域名服务器本身——named——有一个配置文件，通常是 /etc/named.conf。在该文件中，你可以配置你所负责的域名以及所使用的区域文件。在各种 named
    手册页中都可以找到关于运行域名服务器的精彩介绍。


    有几个与主机名解析相关的实用工具。其中一个叫 whois，它可以查询互联网主域名服务器，以了解某个域名属于谁：


    ```

    whois linux.org

    ```


    另一个实用工具叫 nslookup。该命令允许你解析主机，并获取关于某个域名的各种信息。更多信息请参阅相关手册页。


    ## 技巧 14：这个端口属于谁


    有几个实用工具可以检查哪些端口是开放的、谁正在连接到你的系统，甚至可以查看哪个进程正在使用某个端口。


    首先说明一些基本规则。低于 1024 的端口是为公共服务保留的，只有 root 才能使用这些端口。标准的端口号可以在 /etc/services 中找到。端口的最大数量为
    65k，因此你有远超需求的互联网端口可供服务使用。


    以下是一些有用的实用工具。Netstat 是一个命令，可以列出开放的端口以及谁正在连接到你的系统。你可以这样运行它：


    ```

    netstat -an | more

    ```


    通过这种方式，你可以查出谁连接到了哪个服务。


    另一个有趣的命令是 fuser 程序。这个程序可以告诉你哪个用户及进程正在占用某个端口。例如，以下命令将告诉你端口 6000 是被谁占用的：


    ```

    fuser -v -n tcp 6000

    ```


    ## 技巧 15：网络打印机


    按 Unix 的传统，大多数服务都自带网络功能。这其中就包括打印服务器。你不需要第三方软件来搭建打印服务器。


    lpd 守护进程允许你使用本地打印机打印，同时也允许其他用户在你允许的情况下使用它进行打印。


    默认情况下，打印软件通过 UDP 协议的 515 端口进行监听。它会允许 /etc/hosts.lpd 中列出的主机使用你的打印机进行打印。


    要全面了解打印服务，你应该在网上查阅 Printing HOWTO。

    '
