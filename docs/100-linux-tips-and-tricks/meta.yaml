    where they would not be detected is if the device is Plug and Play. The kernel
    won''t be able to detect ISA PnP devices unless they have been prepared by a program
    called isapnptools.


    The trick is to use this program in initiation scripts. It will detect the ISA
    PnP devices and make them available to kernel modules and applications.


    For example if you want to access an ISA PnP sound card, you will need to compile
    sound as a module in the kernel, and use isapnptools before loading the module.'
- md: '## 100 Linux Tips and Tricks


    ## Tip 7: Find hardware information


    When the Linux system boots, it will try to detect the hardware installed in the
    computer. It will then make a fake file system called procfs and will store important
    information about your system in it.


    You can get information about your system simply by browsing the directory /proc.
    The files in there will contain information such as the processor you have, the
    amount of memory and the file systems the kernel currently supports.


    A useful application exists to browse the /proc file system. It is called Xproc
    and is available from http://devplanet.fastethernet.net/files.html:


    ![](img/4fc015bbc2a49bafd7ac218106b1313d_42_0.png)


    ## Tip 8: Blinking leds on the keyboard


    Keyboard leds are pretty boring. Usually you know if the num lock is on or if
    you are writing in upper case letters. Could we make them do something more useful?
    Of course.


    The keyboard leds can be controlled by a device driver called the misc driver.
    That driver can control all kinds of misc things. You could write your own driver
    to make them blink or light up at any system event.


    A program called tleds is available from http://www.hut.fi/~jlohikos/tleds.html.
    That program will have them blink based on network usage. One will blink when
    packets go in, and the other when packets go out.


    ## Tip 9: Reading a foreign file system


    File systems are defined in the kernel. The kernel supports many file systems,
    but they need to be compiled in, or compiled as a module. When you compile a file
    system in the kernel, all you need to do is use mount with the -t option and the
    right file system type.


    If you have compiled a driver for a file system as a module, then you need to
    load the module first.


    Here are a few of the available file systems:


    - msdos: This is the FAT file system used by DOS.

    - vfat: This is the FAT32 file system used by Windows 95 and Windows 98.

    - ext2: This is the default Linux file system.

    - iso9660: This is the default CD-ROM format.


    ## Tip 10: Can''t mount root fs


    When you boot a system, this is an error that will halt the system. This error
    means that the kernel can''t mount the root file system, so it can''t get all
    of its configuration files.


    There are a few cases where this happens:


    - No IDE support in the kernel. If your main hard drive is an IDE, and you have
    recompiled without including "Enhanced IDE/MFM/RLL disk/cdrom/tape/floppy support"
    or some other basic IDE device drivers.

    - File system not supported. Usually the root file system should be of type ext2.
    You need to make sure that ext2 is compiled in the kernel, and not as a module
    because you can''t load modules without first mounting the root file system.

    - The drive is not ready. If you have removed the drive, the hard disk died or
    the BIOS didn''t detect the device for some reason, then the kernel won''t be
    able to mount it.


    ## Tip 11: Linux on a 286?


    Linux is a multi-user, multitasking operating system which requires a 386 processor
    or more to run. This is because the lower PC processors don''t have what is needed
    for the Linux kernel.


    Linux being open source, is being ported to many architectures. And one group
    decided to modify the kernel so it would run on a 286 processor. The project page
    is http://www.uk.linux.org/ELKS-Home/index.html.


    ## Tip 12: Linux without a hard drive


    Modern Linux distributions require around 100 megs to 200 megs of hard disk space
    to install. But is it possible to run Linux on a system without a hard drive?
    Yes it is.


    The Linux Router Project is a full-featured Linux distribution that fits on one
    diskette. It was made for routers, and use modules to add the software packages
    you need, including DNS servers, Web servers, email and routing. You can find
    more information on the Linux Router Project at http://www.linuxrouter.org.


    ## Tip 13: Shutdown and power off


    Linux, like most other operating systems, must be shutdown in a specified manner.
    You can''t turn the power off on a computer running Linux, or you may lose some
    data.


    Here are the steps that need to be done when you want to shutdown:


    - The operating system needs to stop all the running processes and logout the
    users.

    - Various servers need to be shutdown in a proper way.

    - All the mounted file systems need to be unmounted safely and unwritten data
    need to be stored on the disk.


    The system can then be turned off safely.


    To accomplish all these tasks, the shutdown command exists. That command has a
    lot of options, and you should explore them before trying anything at random.
    Another way to shutdown a Linux system is to set the runlevel to 0, the default
    shutdown level, with the init program.


    ## Tip 14: LPD started but no device found


    The printer daemon is called LPD. It will be started at boot time and assume that
    a printer is connected to the printer port. But a problem may occur when the daemon
    is started and no device is found.


    The most common cause for this problem is a configuration problem in the kernel.
    Make sure that parallel port, PC-style parallel port, and printer support is enabled
    in the configuration, and that modules are loaded.


    ## Tip 15: Read files from FAT32 drives


    The Linux utility mount can read any file system that the kernel supports. Since
    version 2.0.34, the kernel supports FAT32, which is the main file system used
    by Windows 98.


    To read the FAT32 file system you need to specify the -t vfat option to mount.
    Here is an example:


    ```

    mount -t vfat /dev/hdb1 /mnt

    ```


    ## Tip 16: TV on Linux


    A number of cards exist allowing you to watch and record TV on your PC. Most come
    with software for Windows only, like so many things, but it is possible to do
    the same thing on Linux.


    Linux comes with several drivers which make up the Video4Linux drivers. Several
    cards are supported by these drivers, and a list of them is available at http://roadrunner.swansea.linux.org.uk/v4l.shtml.
    This is the driver side. You also need software to use the devices.


    Several programs are available to watch TV, capture images and even Web applications.
    A list of some of the programs is available at http://www.thp.uni-koeln.de/~rjkm/linux/bttv.html
    including datasheets.


    ## Tip 17: Device drivers


    Hardware devices are not of much use without device drivers. Fortunately, the
    Linux kernel, like every other operating system, comes with a lot of them.


    When you configure a kernel, the menu from which you must choose which devices
    you have in your computer is actually a list of device drivers available to you.
    Here is how to configure your kernel:


    ```

    cd /usr/src/linux

    make menuconfig

    ```


    Linux, still not being as popular as some other operating systems, can''t support
    all of the existing hardware. If you have a device that is not in the list, then
    you will need to search for it on the Web. Some drivers may exist for Linux and
    not be in the default kernel. But if a device is not currently supported by any
    driver for Linux, then you will have to wait for someone to make one, or make
    one yourself.


    If you want to write your own driver, the best place to start is at The Kernel
    Hacker''s Guide, available at [http://khg.redhat.com/HyperNews/get/khg.html](http://khg.redhat.com/HyperNews/get/khg.html)


    ## Tip 18: Mouse problems


    The mouse is a very important part of a computer. In X, you can''t do much without
    it. Even in console some applications will allow you to use it. You must first
    configure it.


    Like every other device, the mouse has a device file in the /dev directory. Depending
    on your mouse type, it will be either /dev/psaux for a PS/2 mouse, or /dev/cua0
    for a serial mouse on COM1.


    To make it easy to use in the future, you should link the right device file to
    /dev/mouse:


    ```

    ln -s /dev/cua0 /dev/mouse

    ```


    Then, when you configure X Window or any other program that requires a mouse,
    you can specify /dev/mouse.'
  mdcn: '

    ## 100 个 Linux 技巧与窍门


    ## 技巧 7：查找硬件信息


    当 Linux 系统启动时，它会尝试检测计算机中安装的硬件。然后它会创建一个名为 procfs 的虚拟文件系统，并在其中存储有关系统的重要信息。


    你只需浏览 /proc 目录即可获取系统信息。该目录中的文件包含诸如处理器型号、内存容量以及内核当前支持的文件系统等信息。


    有一个实用的应用程序可用于浏览 /proc 文件系统。它叫做 Xproc，可从 http://devplanet.fastethernet.net/files.html
    获取：


    ![](img/4fc015bbc2a49bafd7ac218106b1313d_42_0.png)


    ## 技巧 8：让键盘指示灯闪烁


    键盘指示灯通常相当无趣。通常你知道数字锁定是否开启，或者你是否正在输入大写字母。我们能让它们做点更有用的事情吗？当然可以。


    键盘指示灯可以由一个名为杂项驱动程序（misc driver）的设备驱动程序控制。该驱动程序可以控制各种杂项设备。你可以编写自己的驱动程序，让它们在任何系统事件时闪烁或点亮。


    有一个名为 tleds 的程序，可从 http://www.hut.fi/~jlohikos/tleds.html 获取。该程序会让它们根据网络使用情况闪烁。一个灯在有数据包进入时闪烁，另一个在有数据包发出时闪烁。


    ## 技巧 9：读取外来文件系统


    文件系统在内核中定义。内核支持多种文件系统，但它们需要被编译进内核，或编译为模块。当你将文件系统编译进内核时，只需使用 mount 命令加上 -t 选项和正确的文件系统类型即可。


    如果你将某个文件系统的驱动程序编译为模块，那么你需要先加载该模块。


    以下是一些可用的文件系统：


    - msdos：这是 DOS 使用的 FAT 文件系统。

    - vfat：这是 Windows 95 和 Windows 98 使用的 FAT32 文件系统。

    - ext2：这是 Linux 的默认文件系统。

    - iso9660：这是默认的 CD-ROM 格式。


    ## 技巧 10：无法挂载根文件系统


    当你启动系统时，这是一个会导致系统停止的错误。该错误意味着内核无法挂载根文件系统，因此无法获取所有配置文件。


    这种情况有几种原因：


    - 内核中没有 IDE 支持。如果你的主硬盘是 IDE 硬盘，而你重新编译内核时没有包含"Enhanced IDE/MFM/RLL disk/cdrom/tape/floppy
    support"或其他基本的 IDE 设备驱动程序。

    - 文件系统不受支持。通常根文件系统应该是 ext2 类型。你需要确保 ext2 是编译进内核的，而不是作为模块，因为不先挂载根文件系统就无法加载模块。

    - 驱动器未就绪。如果你移除了驱动器、硬盘损坏，或者 BIOS 由于某种原因未能检测到该设备，那么内核将无法挂载它。


    ## 技巧 11：在 286 上运行 Linux？


    Linux 是一个多用户、多任务操作系统，需要 386 或更高处理器才能运行。这是因为较低端的 PC 处理器不具备 Linux 内核所需的特性。


    Linux 作为开源软件，正在被移植到多种架构。有一个团队决定修改内核，使其能在 286 处理器上运行。该项目页面是 http://www.uk.linux.org/ELKS-Home/index.html。


    ## 技巧 12：无硬盘运行 Linux


    现代 Linux 发行版需要大约 100 到 200 兆字节的硬盘空间来安装。但能否在没有硬盘的系统上运行 Linux？可以。


    Linux 路由器项目是一个功能完整的 Linux 发行版，可以装入一张软盘。它是为路由器设计的，使用模块来添加所需的软件包，包括 DNS 服务器、Web
    服务器、电子邮件和路由功能。你可以在 http://www.linuxrouter.org 找到有关 Linux 路由器项目的更多信息。


    ## 技巧 13：关机和断电


    与其他大多数操作系统一样，Linux 必须以指定方式关闭。你不能直接关闭运行 Linux 的计算机电源，否则可能会丢失一些数据。


    以下是关机时需要执行的步骤：


    - 操作系统需要停止所有正在运行的进程并注销用户。

    - 各种服务器需要以适当的方式关闭。

    - 所有已挂载的文件系统需要安全卸载，未写入的数据需要存储到磁盘上。


    然后系统就可以安全地关闭了。


    为了完成所有这些任务，存在 shutdown 命令。该命令有很多选项，在随机尝试之前你应该先了解它们。另一种关闭 Linux 系统的方法是将运行级别设置为
    0（默认的关机级别），使用 init 程序。


    ## 技巧 14：LPD 已启动但未找到设备


    打印机守护进程称为 LPD。它将在启动时启动，并假设打印机已连接到打印机端口。但当守护进程启动时未找到设备，可能会出现问题。


    此问题最常见的原因是内核配置问题。请确保在配置中启用了并口、PC 风格并口和打印机支持，并且模块已加载。


    ## 技巧 15：从 FAT32 驱动器读取文件


    Linux 实用程序 mount 可以读取内核支持的任何文件系统。自 2.0.34 版本起，内核支持 FAT32，这是 Windows 98 使用的主要文件系统。


    要读取 FAT32 文件系统，你需要向 mount 指定 -t vfat 选项。示例如下：


    ```

    mount -t vfat /dev/hdb1 /mnt

    ```


    ## 技巧 16：在 Linux 上看电视


    有多种卡可以让你在 PC 上观看和录制电视节目。大多数只附带 Windows 软件，就像许多其他设备一样，但在 Linux 上也可以实现同样的功能。


    Linux 自带多个驱动程序，它们组成了 Video4Linux 驱动程序。这些驱动程序支持多种卡，支持的列表可在 http://roadrunner.swansea.linux.org.uk/v4l.shtml
    查看。这是驱动程序方面。你还需要软件来使用这些设备。


    有多种程序可用于观看电视、捕获图像，甚至 Web 应用程序。部分程序的列表可在 http://www.thp.uni-koeln.de/~rjkm/linux/bttv.html
    查看，包括数据手册。


    ## 技巧 17：设备驱动程序


    没有设备驱动程序，硬件设备就没有太大用处。幸运的是，Linux 内核与其他操作系统一样，自带了大量驱动程序。


    当你配置内核时，你必须从中选择计算机中拥有哪些设备的菜单，实际上是一份可用的设备驱动程序列表。以下是配置内核的方法：


    ```

    cd /usr/src/linux

    make menuconfig

    ```


    Linux 仍然不如某些其他操作系统流行，因此无法支持所有现有硬件。如果你的设备不在列表中，那么你需要在网上搜索。有些驱动程序可能存在于 Linux 中，但未包含在默认内核中。但如果某个设备目前没有任何
    Linux 驱动程序支持，那么你必须等待有人制作一个，或者自己制作一个。


    如果你想编写自己的驱动程序，最好的起点是《内核黑客指南》，可在 [http://khg.redhat.com/HyperNews/get/khg.html](http://khg.redhat.com/HyperNews/get/khg.html)
    获取


    ## 技巧 18：鼠标问题


    鼠标是计算机非常重要的组成部分。在 X 中，没有它你几乎无法操作。即使在控制台中，某些应用程序也允许你使用它。你必须先配置它。


    与其他设备一样，鼠标在 /dev 目录中有一个设备文件。根据你的鼠标类型，PS/2 鼠标为 /dev/psaux，COM1 上的串口鼠标为 /dev/cua0。


    为了将来使用方便，你应该将正确的设备文件链接到 /dev/mouse：


    ```

    ln -s /dev/cua0 /dev/mouse

    ```


    然后，当你配置 X Window 或任何其他需要鼠标的程序时，你可以指定 /dev/mouse。

    '
