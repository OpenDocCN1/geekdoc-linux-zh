    unfortunately very real and they occur a lot. Malicious people that can''t handle
    their problems elsewhere turn to the Internet and launch attacks against networks.
    An attack against one user will always affect several thousands of people. By
    using bandwidth of an Internet provider to cause trouble to any one user, the
    whole provider will be affected. To prevent such attacks, firewalls exist, and
    tracking tools were invented to deal with abusers. MCI has a tool called DoSTrack
    that can be of help if you are victim of such an attack. For more information
    about various DoS attacks, you should search the Web.'
  - '[PAGE 96]


    # 100 Linux Tips and Tricks


    # Tip 13: Names and name servers


    Internet hostnames and domains are resolved using the Domain Name System (DNS)
    using Name Servers (NS). These name servers are usually hosted by your Internet
    provider. You can also host your own name server, using the program named. Every
    name server, upon receiving a request to resolve a hostname, will ask an upstream
    name server if it doesn''t know the answer. Your name server may ask your ISP''s
    name server, which will ask the backbone''s main name server, which will ask a
    root server.


    Linux knows which name server to ask by looking in /etc/resolv.conf. In that file,
    a number of name servers may be specified in the following way:


    ```

    nameserver 192.168.0.1

    nameserver 205.237.65.254

    ```


    The name server itself, named, has a configuration file which is usually /etc/named.conf.
    In that file, you configure the domain names you are responsible for, and the
    zone file to use. A nice introduction to running a name server is available in
    the various named man pages.


    Various utilities are related to resolving hostnames. One is called whois, and
    will query the Internet main name servers to know who owns a domain:


    ```

    whois linux.org

    ```


    Another utility is called nslookup. That command will allow you to resolve hosts,
    and to get all kinds of information about a domain. See the man page for more.'
  - '[PAGE 97]


    # 100 Linux Tips and Tricks


    # Tip 14: Who owns this port


    Several utilities exist to check which ports are open, who is connected to your
    system and even what process owns a port number.


    First a few ground rules. Ports below 1024 are reserved for common services, and
    only root can use them. Standard port numbers can be found in /etc/services. The
    maximum number of ports is 65k, so you have more than enough Internet ports for
    all your services.


    Here are some useful utilities. Netstat is a command that will list both the open
    ports and who is connected to your system. You should run it like this:


    ```

    netstat -an | more

    ```


    This way you can find out who is connected to which service.


    Another interesting command is the fuser program. This program can tell you which
    user and process owns a port. For example, the following command will tell you
    who owns port 6000:


    ```

    fuser -v -n tcp 6000

    ```'
  - '[PAGE 98]


    # 100 Linux Tips and Tricks


    # Tip 15: Network printers


    By tradition in Unix most services come with networking capabilities. This includes
    the printing server. You don''t need to get third party software to make a printing
    server.


    The lpd daemon allows you to print to your local printer, but also allows others
    to print on it, if you allow them.


    By default the printing software will read on port 515 on the UDP protocol. It
    will allow hosts listed in the /etc/hosts.lpd to print using your printer.


    For a full overview of the printing service, you should check the printing howto
    on the Web.'
- md: ' # 100 Linux Tips and Tricks


    ## Development


    ## What this chapter covers


    This last chapter covers development. A standard Linux system comes with many
    compilers and interpreters for a lot of languages. We cover most of them, and
    will see tips and tricks on how to use them for small scripts or powerful applications.


    # Tip 1: Graphical messages to the world


    Often we write shell scripts and at one point we would like to display messages
    or otherwise interact with the user using a graphical way, without rewriting all
    our script in C.


    A small program called gtk-shell was created for that purpose. It is a GTK-based
    program meant to be used in shell scripts, that can interact with the user, and
    even return values to the script. Let''s see a very simple example:


    ```

    xv -quit -root `gtk-shell -t "Which file do you want me to use?" -fs`

    ```


    This will display a graphical browsing box with the specified title, where the
    user can select a file, and the file path will be returned to xv which will display
    it as background.


    Gtk-shell can be used in many ways including displaying a message, asking for
    input, and more. Here is an output of "gtk-shell --help":


    ```

    gtk-shell (C) 1999 Patrick Lambert under GPL

    This program will use the GTK library (www.gtk.org) to ask for user input,

    and can be used in scripts or called from other programs.


    Command line options:

    --help, -h                  This help text

    --version, -v               Show gtk-shell''s version

    --output <file>, -o         Set the output file, default is stdout

    --title <title>, -t         Set the window title

    --label <label>, -l         Show a label to the user

    --file-selection, -fs       Display a file selection box

    --size <x> <y>, -s          Set the size of the window

    --position <x> <y>, -p       Set the position of the window on the screen

    --query, -q                 Display a query box

    --query-value, -qv          Set a value in the query box

    --append-eol, -eol          Appends an EOL char at output time

    --exit-code <str>, -ec      String to display if user press Cancel

    --view-file <file>, -vf     Advocacy a file in a text box

    --edit file <file>, -ef     Edit a file in a text box

    --button <str>, -b          Add a button to quit

    --choice <c1> <c2>..., -c   Display a choice box with the specified choices


    Example: gtk-shell -l "Pick a choice" -c 1 2 3 4 -b Ok -eol

    Example: xv -quit -root `gtk-shell -t "Which image?" -fs`

    ```


    Gtk-shell is available at http://devplanet.fastethernet.net/files.html.


    # Tip 2: Code reuse


    Why write code that we already wrote for previous programs? Well here is a small
    tip that might save you some time: Make a generic file with reusable functions.


    Many languages make this easy to do. Object oriented languages like Java or C++
    for example allow you to make a class with utility functions, and then import
    them in your main program. This way you can use the generic class in all your
    programs. Even in C you can do this by including the generic C file when compiling
    with a command like:


    ```

    gcc -o myprogram myprogram.c generic.c

    ```


    Your generic utility functions would be in generic.c and gcc would simply add
    the file to myprogram.


    # Tip 3: Makefile don''t equal C


    Makefiles are used in most Unix C or even C++ programs. But nowhere does it say
    that they can''t be used for other languages. Make is a program installed with
    most Linux distributions, and on most Unix systems too. Makefiles make your program
    portable, and easy to compile. These files can be used in C, C++, Java, and any
    program that requires compilation.


    Make has so many useful applications. Feel free to explore them for your programs.


    # Tip 4: Parsing the command line in BASH


    Bash is a shell, but it''s also a scripting language. You can make bash scripts,
    and you can pass parameters to it. You can access the parameters with $1, $2,
    ... But what if you need the whole command line?


    Bash uses special variables for all kind of purposes. One of them is $* which
    contains the whole command line. You can use it rather than the $1, $2 if all
    you need is a string of text, passed on the command line.


    # Tip 5: Don''t grep grep


    A useful tool in scripting is the "grep" function. This program will find a string
    in a file. It is often used also to find if a process is running:


    ```

    ps ax | grep sendmail

    ```


    That command will find if sendmail is running. The problem is that you might end
    up with another entry for this command. Because you grep for "sendmail", you may
    well end up with this command showing because the "sendmail" string is in the
    command line. To avoid that, you can use the -v flag to grep:


    ```

    ps ax | grep sendmail | grep -v grep

    ```


    That command will find all the lines in the current process list that have the
    "sendmail" string in it, and will remove the lines containing the string "grep".


    # Tip 6: Move a text into upper case letters


    When you want to do text manipulation, you can use Sed and Awk. These 2 tools
    which come on most Linux distributions, will allow you to modify text files in
    many ways.


    To move a text file into upper case letters, you can use Awk in the following
    way:


    ```

    awk ''{ print toupper($0) }'' old_file > new_file

    ```


    Sed and Awk are useful for a lot of other uses, and are integrated in several
    products.


    # Tip 7: Using PASCAL on Linux


    Linux comes with a lot of compilers and interpreters. These include programs for
    C, C++, Perl, TCL/TK and more. Unfortunately most Linux distributions don''t come
    with a Pascal compiler. Is it possible to compile Pascal programs? It sure is.


    Several projects were started to make a Pascal compiler for Linux. One is called
    GNU Pascal and is available from [http://agnes.dida.physik.uni-essen.de/~gnu-pascal](http://agnes.dida.physik.uni-essen.de/~gnu-pascal).
    That program will also run on any operating system that supports the GNU C compiler.


    # Tip 8: Segmentation fault


    One of the most common problems when making software is errors like "Segmentation
    fault", also called SegFault. Here is what a SegFault is.


    Virtual memory in a computer can be created in 2 ways: pages or segments. Paging
    means that the memory is divided in pages of equal size, containing words of memory
    in it. Segmentation means that every process has a segment of memory of needed
    size, with gaps of empty memory blocks between the segments.


    The operating system knows the upper limit of every segment, and every segment
    begins at a virtual address 0. When a program accesses a memory block, it calls
    a virtual address that the Memory Management Unit (MMU) maps to a real address.
    If the operating system sees that the requested address doesn''t match any valid
    address in the segment, it will send a signal to the process terminating it.


    SegFaults are the direct result of a memory error. The program has a bad pointer,
    a memory leak or any kind of error that makes it access the wrong memory address.
    To correct these errors you need to check pointers and arrays for errors.


    # Tip 9: Who is online?


    Many system administrators use scripts to help them in the process of managing
    a server. A common problem is finding out exactly what users are on the system
    and what they are doing.


    Several tools are available on the system to see who is online, what processes
    are running, and piping them together can resolve many problems. Here are 2 small
    scripts that will show, first if a user is online, and then what he is running:


    ```

    who | grep $1

    ps -aux | grep $1

    ```


    The variable $1 here means the first command line argument, from a shell script.
    The who command first checks if the user is online, then ps will show all the
    processes currently running under that user''s UID.


    # Tip 10: Graphical toolkits


    Most Unix programs are console based. This is mainly because several years ago,
    most computer users were on text-only stations linked to big mainframes.


    Now, Linux is becoming a full graphical desktop, and needs graphical programs,
    or at least frontends to text-only programs. This is where graphical toolkits
    come in. Here is a list of some of the toolkits available to Linux programmers:


    - [GTK](https://www.gtk.org/) - This is currently a very popular toolkit, and
    is the base of the GNOME desktop. It is C based and easy to work with.


    - [QT](https://www.qt.io/) - QT is a C++ toolkit made by Troll Tech. It is the
    base of the popular KDE desktop.


    - [WXwindows](https://www.wxwindows.org/) - This is a very complete C++ toolkit
    that is cross-platform. The same code should work on Windows, the MacOS, Unix
    (Motif and GTK) and others.


    - [GraphApp](http://www.hoople.org/~fitzsim/graphapp/) - This is also a cross-platform
    toolkit, but is one of the easiest libraries I ever saw. It supports a smaller
    set of widgets, but takes only hours to learn. It will work on Windows, the MacOS,
    Unix (Motif and Athena) and others.'
  mdcn: '

    # 100个Linux技巧与诀窍


    ## 开发


    ## 本章内容概述


    最后一章介绍开发相关内容。一个标准的Linux系统自带许多编译器和解释器，支持多种编程语言。我们将涵盖其中大部分语言，并介绍如何在小型脚本或功能强大的应用程序中使用它们的技巧和诀窍。


    # 技巧1：向世界发送图形化消息


    我们经常编写shell脚本，有时希望以图形方式向用户显示消息或进行交互，而不必将整个脚本用C语言重写。


    为此，一个名为gtk-shell的小程序被开发出来。它是一个基于GTK的程序，设计用于shell脚本中，可以与用户交互，甚至向脚本返回值。让我们看一个非常简单的例子：


    ```

    xv -quit -root `gtk-shell -t "Which file do you want me to use?" -fs`

    ```


    这将显示一个带有指定标题的图形浏览框，用户可以在其中选择文件，文件路径将返回给xv，作为背景显示出来。


    Gtk-shell可以以多种方式使用，包括显示消息、请求输入等。以下是"gtk-shell --help"的输出：


    ```

    gtk-shell (C) 1999 Patrick Lambert under GPL

    This program will use the GTK library (www.gtk.org) to ask for user input,

    and can be used in scripts or called from other programs.


    Command line options:

    --help, -h                  This help text

    --version, -v               Show gtk-shell''s version

    --output <file>, -o         Set the output file, default is stdout

    --title <title>, -t         Set the window title

    --label <label>, -l         Show a label to the user

    --file-selection, -fs       Display a file selection box

    --size <x> <y>, -s          Set the size of the window

    --position <x> <y>, -p       Set the position of the window on the screen

    --query, -q                 Display a query box

    --query-value, -qv          Set a value in the query box

    --append-eol, -eol          Appends an EOL char at output time

    --exit-code <str>, -ec      String to display if user press Cancel

    --view-file <file>, -vf     Advocacy a file in a text box

    --edit file <file>, -ef     Edit a file in a text box

    --button <str>, -b          Add a button to quit

    --choice <c1> <c2>..., -c   Display a choice box with the specified choices


    Example: gtk-shell -l "Pick a choice" -c 1 2 3 4 -b Ok -eol

    Example: xv -quit -root `gtk-shell -t "Which image?" -fs`

    ```


    Gtk-shell可在http://devplanet.fastethernet.net/files.html获取。


    # 技巧2：代码复用


    为什么要重复编写之前程序中已经写过的代码呢？这里有一个小技巧，或许能帮你节省一些时间：创建一个包含可复用函数的通用文件。


    许多语言都很容易实现这一点。像Java或C++这样的面向对象语言允许你创建一个包含实用工具的类，然后在主程序中导入它们。这样你就可以在所有程序中使用这个通用类了。即使在C语言中，你也可以通过在编译时包含通用C文件来实现，命令如下：


    ```

    gcc -o myprogram myprogram.c generic.c

    ```


    你的通用实用函数放在generic.c中，gcc会简单地将该文件添加到myprogram中。


    # 技巧3：Makefile不等于C


    Makefile在大多数Unix C甚至C++程序中被使用。但 nowhere does it say that they can''t be used for
    other languages. Make是一个随大多数Linux发行版安装的程序，在大多数Unix系统上也是如此。Makefile让你的程序具有可移植性，并且易于编译。这些文件可用于C、C++、Java以及任何需要编译的程序。


    Make有如此多有用的应用。不妨在你的程序中探索一下它们。


    # 技巧4：在BASH中解析命令行


    Bash是一种shell，但也是一种脚本语言。你可以编写bash脚本，并可以向它传递参数。你可以通过$1、$2...来访问参数。但如果你需要整个命令行呢？


    Bash为各种用途使用特殊变量。其中之一是$*，它包含整个命令行。如果你需要的只是命令行上传递的一个文本字符串，你可以使用它，而不是$1、$2。


    # 技巧5：不要grep grep


    在脚本编写中，"grep"函数是一个有用的工具。这个程序会在文件中查找字符串。它也常用于查找某个进程是否在运行：


    ```

    ps ax | grep sendmail

    ```


    该命令会查找sendmail是否在运行。问题是，你可能会得到该命令的另一个条目。因为你grep的是"sendmail"，所以很可能会显示这个命令本身，因为"sendmail"字符串就在命令行中。要避免这种情况，你可以使用grep的-v标志：


    ```

    ps ax | grep sendmail | grep -v grep

    ```


    该命令会在当前进程列表中查找所有包含"sendmail"字符串的行，并移除包含"grep"字符串的行。


    # 技巧6：将文本转换为大写字母


    当你想要进行文本处理时，可以使用Sed和Awk。这两个工具在大多数Linux发行版中都自带，可以让你以多种方式修改文本文件。


    要将文本文件转换为大写字母，你可以按以下方式使用Awk：


    ```

    awk ''{ print toupper($0) }'' old_file > new_file

    ```


    Sed和Awk还有许多其他用途，并被集成到多个产品中。


    # 技巧7：在Linux上使用PASCAL


    Linux附带了许多编译器和解释器。这些包括用于C、C++、Perl、TCL/TK等的程序。遗憾的是，大多数Linux发行版不附带Pascal编译器。Pascal程序可以编译吗？当然可以。


    已经启动了几个项目来为Linux制作Pascal编译器。其中一个叫做GNU Pascal，可从[http://agnes.dida.physik.uni-essen.de/~gnu-pascal](http://agnes.dida.physik.uni-essen.de/~gnu-pascal)获取。该程序也可以在支持GNU
    C编译器的任何操作系统上运行。


    # 技巧8：段错误


    制作软件时最常见的问题之一是"Segmentation fault"错误，也称为SegFault。以下是SegFault的解释。


    计算机中的虚拟内存可以通过两种方式创建：页或段。分页意味着内存被划分为等大小的页面，页面中包含内存字。分段意味着每个进程拥有所需大小的内存段，段之间存在空的内存块间隙。


    操作系统知道每个段的上限，每个段从虚拟地址0开始。当程序访问内存块时，它调用一个虚拟地址，内存管理单元（MMU）将其映射到真实地址。如果操作系统发现请求的地址与段中的任何有效地址不匹配，它将向进程发送一个终止信号。


    SegFault是内存错误的直接结果。程序有坏指针、内存泄漏或任何导致它访问错误内存地址的错误。要纠正这些错误，你需要检查指针和数组是否存在错误。


    # 技巧9：谁在线？


    许多系统管理员使用脚本来帮助他们管理服务器。一个常见问题是准确查明哪些用户在系统上以及他们在做什么。


    系统上有几个工具可以查看谁在线、哪些进程在运行，将它们通过管道连接在一起可以解决许多问题。以下是两个小程序，首先显示用户是否在线，然后显示他正在运行什么：


    ```

    who | grep $1

    ps -aux | grep $1

    ```


    这里的变量$1表示shell脚本中的第一个命令行参数。who命令首先检查用户是否在线，然后ps将显示该用户UID下当前运行的所有进程。


    # 技巧10：图形工具包


    大多数Unix程序是基于控制台的。这主要是因为多年前，大多数计算机用户是通过文本终端连接到大型主机的。


    现在，Linux正在成为一个完整的图形桌面，需要图形程序，或者至少是纯文本程序的前端。这就是图形工具包发挥作用的地方。以下是一些可供Linux程序员使用的工具包列表：


    - [GTK](https://www.gtk.org/) - 目前非常流行的工具包，是GNOME桌面的基础。基于C语言，易于使用。


    - [QT](https://www.qt.io/) - QT是由Troll Tech公司开发的C++工具包。它是流行的KDE桌面的基础。


    - [WXwindows](https://www.wxwindows.org/) - 这是一个非常完整的跨平台C++工具包。相同的代码应该可以在Windows、MacOS、Unix（Motif和GTK）等系统上工作。


    - [GraphApp](http://www.hoople.org/~fitzsim/graphapp/) - 这也是一个跨平台工具包，但是是我见过的最简单的库之一。它支持较少的控件集，但只需几个小时就能学会。它可以在Windows、MacOS、Unix（Motif和Athena）等系统上工作。

    '
