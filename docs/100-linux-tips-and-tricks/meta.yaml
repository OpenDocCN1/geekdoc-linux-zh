- img_proc: true
  md: '# # Tip 18: International console


    Most Linux distributions are configured to use a US english keyboard. If you need
    to write on a french or any other kind of keyboard, you will want to change the
    locale so special keys like accents appear in the console.


    The way to do this is to change the system locale with a program called loadkeys.
    For example, to enable a canadian-french locale, you need to add this line in
    your startup files:


    ```

    `loadkeys cf`

    ```


    Here cf means the canadian-french keyboard. Other locales are us, fr and more.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# 100 Linux Tips and Tricks


    # Tip 19: Multiple kernels choices


    When you compile a new kernel, you will often change your configuration. This
    means you may forget to include an important driver, like the IDE driver, or otherwise
    make your system unbootable. The solution is to always keep your old kernel.


    When you compile your kernel, the compilation procedure will often copy your old
    kernel into vmlinuz.old. If it does not, you can do it manually. What you should
    do is add an entry to /etc/lilo.conf allowing you to boot your old kernel. You
    should view the lilo man page for the complete syntax. You could also add entries
    for different kernels, for example if you want to have an older stable version
    of the kernel and the newest development version on your system.


    Note that some distributions name their kernel with the version they represent.
    For example, your current kernel may be /boot/vmlinuz-2.0.36-0.7'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# 100 Linux Tips and Tricks


    # Tip 20: Default file permissions


    When you create a file, the system gives it default permissions. On most systems
    the permissions are 755 (read, write and execute for the owner, and read and execute
    for others).


    This default is setup with the umask command. To use the command, you need to
    find the right octal number to give it. The permissions in the umask are turned
    off from 666. This means that a umask of 022 will give you the default of 755.
    To change your default permissions from 755 to 700, you would use this command:


    ```

    umask 077

    ```'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# # 100 Linux Tips and Tricks


    # ## Tip 21: Default boot mode


    When a Linux system boots, it loads the kernel, all its drivers, and the networking
    servers, then the system will display a text login prompt. There, users can enter
    their user names and their passwords. But it doesn''t have to boot this way.


    There are 3 modes defined in most Linux distributions that can be used for booting.
    They are defined in /etc/inittab and have specific numbers. The first mode, also
    called runlevel 1, is single user mode. That mode will only boot the system for
    1 user, with no networking. Runlevel 3 is the default mode. It will load the networking
    servers and display a text login prompt. Runlevel 5 is the graphical mode. If
    you have X Window installed and configured, you can use it to display a graphical
    login prompt.


    The way to change this is to edit /etc/inittab and change the initdefault line:


    ```

    id:3:initdefault:

    ```


    Changing a 3 to a 5 will make the system display a xdm graphical screen on bootup.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 100 Linux Tips and Tricks


    # Tip 22: More information from usenet


    There are newsgroups about everything. Newsgroups on the latest TV show, on gardening,
    and more. There also are newsgroups on Linux. In fact, the best help can be obtained
    from newsgroups. But which ones?


    Here is a list of a few newsgroups dedicated to Linux, and what they are used
    for:


    +   - comp.os.linux.advocacy: This newsgroup is used for advocacy. People stating
    their opinions about Linux or Linux applications, and about Linux competitors.
