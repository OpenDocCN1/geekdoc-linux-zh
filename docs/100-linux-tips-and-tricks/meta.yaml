  md: '# Tip 3: POP3 in Pine


    Many Linux users use Pine as their mail client. Lets see how you can use Pine
    both with local mail and with POP3 mail, without using fetchmail or some other
    tool to get POP mail first.


    First you will want to use multiple config files:


    ```

    pine -p localmail

    pine -p popserver1

    pine -p popserver2

    ```


    You need to configure Pine to use your POP3 server. In the program go to Setup,
    Config. You''ll want to set something like this in your inbox-path:


    ```

    {pop.server.com/pop3/user=myid}INBOX

    ```


    Now restart Pine and it will ask you for your password and connect to the remote
    server, and use it just like if you were accessing local mail.'
