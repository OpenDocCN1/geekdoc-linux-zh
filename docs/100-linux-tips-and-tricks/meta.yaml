    ## 100 个 Linux 技巧与窍门


    ## 技巧 4：在没有 CD-ROM 驱动器或调制解调器的情况下安装系统


    大多数 Linux 发行版都以 CD-ROM 形式提供。你也可以从 FTP 站点下载，但这需要互联网连接。如果你的系统没有 CD-ROM 驱动器或互联网连接，比如一台老旧的
    486 笔记本电脑，该怎么办？这里的窍门是要有另一台带有 CD-ROM 驱动器的台式机，以及一根 null-modem 串口线。


    我将向你展示如何用 Slackware 完成这个操作。大多数其他 Linux 发行版也可以做到。将 Linux CD-ROM 插入台式机的驱动器中，然后将
    A（基础）和 N（网络）包复制到软盘上。你至少需要这些包，才能使用串口线传输其余的包。


    现在你需要在台式机上启用 NFS 网络，并允许笔记本电脑连接。你可以给笔记本电脑分配一个临时 IP 地址，比如 192.168.1.11，你需要将其添加到台式机的
    /etc/exports 文件中。


    要连接这两个系统，你需要在笔记本电脑上输入以下内容：


    ```

    /usr/sbin/pppd -detach crtscts lock 192.168.1.11:192.168.1.10 /dev/ttyS1 115200

    ```


    然后在 PC 上输入：


    ```

    /usr/sbin/pppd -detach crtscts lock 192.168.1.10:192.168.1.11 /dev/ttyS1 115200

    ```


    这里假设线缆连接到两个系统的 ttyS1（COM2）。


    借助 NFS，你可以远程挂载 CD-ROM 驱动器，并告诉安装程序使用特定路径来安装剩余的包。使用类似这样的命令挂载 CD-ROM：


    ```

    mount -tnfs 192.168.1.10:/cdrom /mnt

    ```


    然后运行安装程序：


    ```

    setup

    ```


    并输入包文件的新路径。


    ## 100 个 Linux 技巧与窍门


    ## 技巧 5：交换空间与内存


    在任何像 Linux 这样的保护模式操作系统中，一个重要的设置就是交换空间（swap space）。在安装过程中，你需要创建一个交换分区。一个常见的问题是：这个分区应该设为多大？


    合适的大小取决于两个因素：你的硬盘大小和 RAM 内存大小。你的 RAM 越少，需要的交换空间就越多。通常你会希望将交换空间大小设为 RAM 大小的两倍，*最大*为
    128 MB。当然这要求你的硬盘有足够的空闲空间来创建这样的分区。


    如果你有 16 MB 的 RAM，将交换空间设为 32 MB 甚至 64 MB 非常重要。你会需要它的。另一方面，如果你有 128 MB 的 RAM，你就不太需要太多交换空间，因为系统已经有
    128 MB 可以使用，然后才会用到交换空间。所以 128 MB 甚至 32 MB 的交换分区可能就足够了。


    如果你选择的交换空间不够，之后还可以再添加。


    ## 100 个 Linux 技巧与窍门


    ## 技巧 6：用交换文件增加更多交换空间


    你安装了一个新的 Linux 系统，但忘记设置足够的交换空间来满足你的需求。你需要重新分区和重新安装吗？不需要，Linux 上的交换工具允许你创建一个真实的文件并将其用作交换空间。


    这个技巧是创建一个文件，然后告诉 swapon 程序使用它。以下是如何在根分区上创建例如一个 64 MB 交换文件的方法（当然，请确保你至少有 64 MB
    的空闲空间）：


    ```

    dd if=/dev/zero of=/swapfile bs=1024 count=65536

    ```


    这将在你的硬盘上创建一个 64 MB（约 6700 万字节）的文件。现在你需要初始化它：


    ```

    mkswap /swapfile 65536

    sync

    ```


    然后你可以将其添加到你的交换池中：


    ```

    swapon /swapfile

    ```


    这样你就添加了 64 MB 的交换空间。别忘了将 swapon 命令添加到你的启动文件中，以便在每次重启时重复执行该命令。


    ## 100 个 Linux 技巧与窍门


    ## 技巧 7：内核大小与模块


    要为新的硬件配置 Linux，特别是在新内核上，你可能需要重新编译内核。如果在内核配置中添加了太多设备，你可能会收到错误消息，提示内核太大。窍门是启用模块（modules）。


    内核本身必须是特定大小，因为它需要在固定的内存大小中加载。这就是模块非常有用的原因之一。如果你启用了模块，你需要编译它们：


    ```

    make modules

    ```


    并安装它们：


    ```

    make modules_install

    ```


    然后使用 modprobe 工具，你可以在启动时加载选定的模块。这样内核会更小，并且编译时不会出现错误。


    ## 100 个 Linux 技巧与窍门


    ## 技巧 8：启动提示符


    Linux 系统使用一个名为 LILO 的程序来启动自身。这是 **LInux LOader**（Linux 加载器），它会加载内核并可以传递各种参数。这就是
    "boot:" 提示符的用途。


    在 "boot:" 提示符处，你可以输入很多参数。你可以向驱动程序发送参数，比如告诉以太网驱动程序网卡所在的 IRQ，或者你可以向内核传递参数，比如内存大小或恐慌（panic）时的处理方式。阅读
    LILO 手册会告诉你 LILO 可以用于完成的所有便捷功能。


    注意，对于编译为模块的设备驱动程序，你需要在加载这些驱动程序时传递值，而不是在 "boot:" 提示符处。


    ## 100 个 Linux 技巧与窍门


    ## 技巧 9：检测到错误的内存大小


    Linux 内核会从你的计算机配置中检测各种设置。这包括你所拥有的内存大小。在某些情况下，它可能会检测到错误的大小。例如，它可能只检测到 64 MB 内存，而实际上你有
    128 MB。


    这里的窍门是使用 "mem=" 参数指定你拥有的 RAM 内存量。以下是在系统启动时，如果你有 128 MB 内存，你需要输入的内容：


    ```

    LILO boot: linux mem=128M

    ```


    这将告诉 LILO 加载具有 128 MB 内存的 linux 内核。


    ## 100 个 Linux 技巧与窍门


    ## 技巧 10：主引导记录与 LILO


    什么是主引导记录（MBR），为什么 LILO 会擦除旧的引导加载器？每个硬盘都有一个称为 MBR 的顶部空间，BIOS 会尝试从中加载操作系统。每个系统都有自己的加载器。DOS
    有 DOS-MBR，Windows NT 有 NTLDR，Linux 有 LILO。


    安装 LILO 时，你可以将其安装在 MBR 中或 Linux 分区的引导记录中。如果你想保留当前的引导加载器，可以选择 Linux 分区，并确保它在 fdisk
    中是活动分区。这样你就能够启动到 LILO，然后从 MBR 引导旧的加载器。


    如果你计划只在系统上使用 Linux，你可以告诉 LILO 直接启动到 Linux 而不显示 "boot:" 提示符，并将其安装在 MBR 中。


    ## 技巧 11：LILO 在大硬盘上找不到内核


    在某些大容量硬盘上，LILO 可能会在加载你的内核时遇到问题。这是因为硬盘的柱面数超过 1024 个。


    这个窍门是确保你的内核位于前 1024 个柱面内，这样 LILO 才能找到它。实现这一点的方法是在驱动器开头创建一个小的 /boot 分区，并确保内核位于
    /boot 目录中。你可以在 fdisk 中设置分区，并在 /etc/lilo.conf 中选择正确的内核路径，以便 LILO 知道它在哪里。编译内核时，只需将新内核移到该目录中，LILO
    就可以加载它。


    ## 100 个 Linux 技巧与窍门


    ## 技巧 12：X Window 配置选项


    每个 Linux 发行版都有自己的 X Window 配置程序。XFree86 也有一个基于文本的配置程序，使用起来比较复杂。但如果发行版的程序和 xf86config（XFree86
    的基于文本的配置程序）似乎都无法满足你的需求呢？XFree86 还带有一个图形化配置工具。


    这个图形化程序的名称是 **XF86Setup**。这将启动一个图形化窗口，允许你配置 X Window 服务器。所以如果你不喜欢控制台配置程序，可以使用这个：


    ![](img/4fc015bbc2a49bafd7ac218106b1313d_19_0.png)


    ## 技巧 13：允许用户挂载驱动器


    默认情况下，Linux 不允许用户挂载驱动器。只有 root 可以这样做，而且将 mount 二进制文件设为 suid root 并不是一个好主意。通过在
    /etc/fstab 文件中使用特殊命令，你可以改变这一点。


    这是 /etc/fstab 中 fd0（A:）驱动器的典型行：


    ```

    /dev/fd0       /mnt           auto      noauto,user 1  1

    ```


    这里的关键词是 **noauto** 和 **user**。Noauto 告诉 mount 不要在启动时尝试挂载软盘，user 允许任何用户将该驱动器挂载到
    /mnt。**auto** 关键词也很有趣。它告诉 mount 尝试找出软盘上的文件系统是什么。你也可以使用 msdos 或 ext2。

    '
