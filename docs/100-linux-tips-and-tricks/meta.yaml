    Then, when you configure X Window or any other program that requires a mouse,
    you can specify /dev/mouse.'
- md: ' # 100 Linux Tips and Tricks


    ## Tip 19: International keyboards


    The X Window System comes by default with an english keymap on most distributions.
    If you have a keyboard from another country, it may be a problem.


    The XKB extension was provided for that purpose. If you look in your X configuration
    file, usually in /etc/X11 called XF86Config, you will find a section about the
    keyboard. There, you may specify several parameters, including the keymap and
    keycodes to use.


    For a list of available keymaps, you can look in your X directory. Most of those
    keymaps are also available from the graphical configuration program, XF86Setup.


    ## Software


    ### What this chapter covers


    Software is what makes the system work. Without software, a computer system would
    be useless. We cover important software issues here, and how small programs found
    on remote Web sites can solve most of your problems.


    ## Tip 1: Background image in X Window


    By default, the background in X Window is a grey background. Some window managers
    have their own options to set other backgrounds, and some don''t.


    A program you can use to set your background is a program that comes with most
    Linux distributions. It''s called XV, and you can specify which background image
    you want with this line:


    ```

    xv -quit -root image.gif

    ```


    This will set the background to be the image.gif file. You can add that line in
    your .xinitrc file, in your home directory, so it is executed each time you launch
    X Window.


    ## Tip 2: Customize Netscape Communicator


    Netscape Communicator has one nice feature that few people use. When you download
    it, it has a Personal Toolbar with buttons that most of us may not find really
    useful, so we either turn it off or don''t look at it.


    You can create folders in it for news sites, Linux sites, etc and move your bookmarks
    into them (with the Edit Bookmarks option).


    You then have your own personal portal in your browser:


    ![](img/4fc015bbc2a49bafd7ac218106b1313d_58_0.png)


    ## Tip 3: POP3 in Pine


    Many Linux users use Pine as their mail client. Lets see how you can use Pine
    both with local mail and with POP3 mail, without using fetchmail or some other
    tool to get POP mail first.


    First you will want to use multiple config files:


    ```

    pine -p localmail

    pine -p popserver1

    pine -p popserver2

    ```


    You need to configure Pine to use your POP3 server. In the program go to Setup,
    Config. You''ll want to set something like this in your inbox-path:


    ```

    {pop.server.com/pop3/user=myid}INBOX

    ```


    Now restart Pine and it will ask you for your password and connect to the remote
    server, and use it just like if you were accessing local mail.


    ## Tip 4: Multiple accounts in Pine


    You can use multiple POP3, IMAP or other incoming mail accounts in the same config
    file by editing the line "incoming-folders=" from .pinerc in your local home directory.


    The syntax is:


    ```

    incoming-folders= "Nick1" {pop1.domain.com/pop3/user=login}INBOX,

    "Nick2" {pop2.somewhere.com/pop3/user=login}INBOX

    ```


    This will create a new collection in Pine with these folders in it, plus the mail
    folder on the local system.


    ## Tip 5: Running Java programs


    Java is an interpreted language. Usually Java is found on the Web, in small programs
    called applets. But many Java applications exist. They are like applets, but require
    a Java Virtual Machine to run on your system. Netscape Communicator and any Java-enabled
    browser can run Java applets, but what if you want to run Java programs?


    Java programs are files ending with .class and must be run in a JVM. The Java
    Development Kit comes with a JVM. What you need is the Linux port of the JDK that
    you can find at http://www.blackdown.org. Once installed, you can run any Java
    application using the line:


    ```

    java Program

    ```


    Where java is the JVM, from the JDK package, and Program is the class found inside
    the Program.class file. Note that you do not have to specify the .class part of
    the file to run it.


    ## Tip 6: Virtual hosts in Apache


    Apache, the popular Web server for Linux and Unix, allows you to host virtual
    hostnames with multiple IP addresses. You can set one IP to each hostname. But
    what if you want to host multiple hostnames on a single IP? Apache allows you
    to do it.


    The trick is a single command that goes in the httpd.conf configuration file:


    ```

    NameVirtualHost 1.2.3.4

    ```


    Replacing 1.2.3.4 with your real IP address, this will allow Apache to know on
    which IP it should serve the virtual hostnames. Then you can add the virtual commands
    for every hostname you want to host:


    ```

    <VirtualHost virtual.host.com>

    ServerAdmin webmaster@virtual.host.com

    DocumentRoot /home/httpd/virtual

    ServerName virtual.host.com

    </VirtualHost>

    ```


    This will add virtual.host.com in your list of virtual hosts and serve the pages
    in /home/httpd/virtual. Of course you need to have the actual virtual.host.com
    hostname pointing to that system.


    ## Tip 7: Libc versus Glibc


    A few years ago, every Linux system used the libc version 5.x library. The libc
    library is the main library that all Unix C programs use. The functions they access
    are defined in that library.


    Recently a new version of the library was introduced by the GNU project called
    GNU libc, or glibc, which is also called libc 6. Some distributions and older
    systems won''t have glibc, and they won''t support glibc binaries. This doesn''t
    change anything for binaries you compile, but binaries you download that are linked
    to the GNU libc will not work.


    There are 2 ways to get them to work. The first is to upgrade. You can upgrade
    to a newer version that does support glibc, or change your distribution to one
    that already has glibc as its main library. The other way is to install glibc
    on your current system. This requires you to know what you are doing and to backup
    your system first. See the GNU page at http://www.gnu.org page for more information
    on GNU products.


    ## Tip 8: Aliases with Qmail


    Qmail is a mail program that allows users to send and receive emails. It also
    has a lot of good features, one of them being aliases. You can add aliases to
    users who do not have an account on the system. Here is how to do it:


    - Create an account called "alias" if it doesn''t exist, and go in its home directory.

    - Edit a file called .qmail-username where username is the alias you want to add.

    - Add the address in the file with a & in front of it.


    Here is an example of a .qmail-username file:


    ```

    &me@mydomain.com

    &meagain@some.other.domain.net

    ```


    This will forward any mail going to user "username" to the 2 listed email addresses.


    ## Tip 9: Samba with Windows 98 or NT 4


    Samba is a product allowing you to connect your Linux systems to Windows systems
    for file and printer sharing. By default the SMB protocol used by Samba sends
    passwords in clear text. Windows 98 and NT use encrypted passwords.


    If you can''t seem to connect from a Windows system on a Samba server, it might
    well be because the Samba server doesn''t know about the encrypted passwords.
    You need to read the documentation about encryption in the Samba package. There
    is a utility to convert a Linux /etc/passwd file to encrypted mode so Samba can
    support Windows encrypted passwords.


    Note that Samba also works with Windows 3.1 and Windows 95, with no encryption.


    ## Tip 10: KDE drag and drop icons


    KDE is a window manager for the X Window system. It comes with a toolbar at the
    bottom of the screen and default buttons. You can drag icons from your desktop
    to the toolbar. The problem is that there is no option to add icons.


    The trick is to drag a file on the toolbar and then edit it. Open KFM and drag
    the program you want on the toolbar. You can then edit it and change the settings
    of the new icon in the toolbar:


    ![](img/4fc015bbc2a49bafd7ac218106b1313d_66_0.png)'
  mdcn: '

    # 100个Linux技巧和窍门


    ## 技巧19：国际键盘


    在大多数发行版中，X Window系统{font color="#ff0000" size="inherit"}系统{font}默认使用的是英语键盘映射。如果你使用的是其他国家的键盘，这可能会成为一个问题。


    为此提供了XKB扩展。如果你查看X配置文件（通常在/etc/X11目录下，名为XF86Config），你会找到一个关于键盘的段落。在那里，你可以指定多个参数，包括要使用的键盘映射和键码。


    有关可用的键盘映射列表，你可以在你的X目录中查看。大多数键盘映射也可以从图形配置程序XF86Setup中找到。


    ## 软件


    ### 本章内容涵盖


    软件是让系统运行的关键。没有软件，计算机系统将毫无用处。在这里我们将介绍重要的软件问题，以及如何在远程网站上找到的小程序可以解决你的大部分问题。


    ## 技巧1：X Window中的背景图片


    默认情况下，X Window中的背景是灰色的。某些窗口管理器有自己的选项来设置其他背景，而有些则没有。


    你可以使用一个程序来设置背景，该程序随大多数Linux发行版一起提供。它叫做XV，你可以通过以下命令指定你想要的背景图片：


    ```

    xv -quit -root image.gif

    ```


    这会将背景设置为image.gif文件。你可以将这一行添加到你的.xinitrc文件中，该文件位于你的主目录下，这样每次启动X Window时都会执行它。


    ## 技巧2：自定义Netscape Communicator


    Netscape Communicator有一个很少有人使用的实用功能。当你下载它时，它有一个个人工具栏，其中包含一些按钮，我们大多数人可能觉得不太有用，所以我们要么将其关闭，要么不去关注它。


    你可以在其中为新闻网站、Linux网站等创建文件夹，并将你的书签移动到其中（通过编辑书签选项）。


    然后你就拥有了自己的个人门户浏览器：


    ![](img/4fc015bbc2a49bafd7ac218106b1313d_58_0.png)


    ## 技巧3：Pine中的POP3


    许多Linux用户使用Pine作为他们的邮件客户端。让我们来看看如何同时使用Pine处理本地邮件和POP3邮件，而无需使用fetchmail或其他工具先获取POP邮件。


    首先，你需要使用多个配置文件：


    ```

    pine -p localmail

    pine -p popserver1

    pine -p popserver2

    ```


    你需要配置Pine以使用你的POP3服务器。在程序中，进入设置，配置。你需要在inbox-path中设置类似以下内容：


    ```

    {pop.server.com/pop3/user=myid}INBOX

    ```


    现在重新启动Pine，它会要求你输入密码，然后连接到远程服务器，就像访问本地邮件一样使用它。


    ## 技巧4：Pine中的多个账户


    你可以通过编辑本地主目录下.pinerc文件中的"incoming-folders="行，在同一份配置文件中同时使用多个POP3、IMAP或其他传入邮件账户。


    语法如下：


    ```

    incoming-folders= "Nick1" {pop1.domain.com/pop3/user=login}INBOX,

    "Nick2" {pop2.somewhere.com/pop3/user=login}INBOX

    ```


    这将在Pine中创建一个新集合，其中包含这些文件夹，以及本地系统上的邮件文件夹。


    ## 技巧5：运行Java程序


    Java是一种解释型语言。通常Java出现在网页上，以称为小程序（applets）的小程序形式存在。但许多Java应用程序也存在。它们类似于小程序，但需要Java虚拟机（JVM）在你的系统上运行。Netscape
    Communicator和任何支持Java的浏览器都可以运行Java小程序，但如果你想运行Java程序怎么办？


    Java程序是以.class结尾的文件，必须在JVM中运行。Java开发工具包（JDK）自带了JVM。你需要的是可以在http://www.blackdown.org找到的Linux版JDK。安装后，你可以使用以下命令运行任何Java应用程序：


    ```

    java Program

    ```


    其中java是来自JDK包的JVM，而Program是Program.class文件中找到的类。请注意，运行它时你不必指定文件的.class部分。


    ## 技巧6：Apache中的虚拟主机


    Apache是Linux和Unix上流行的Web服务器，允许你使用多个IP地址托管虚拟主机名。你可以为每个主机名设置一个IP。但如果你想在单个IP上托管多个主机名呢？Apache允许你这样做。


    诀窍是在httpd.conf配置文件中使用一个命令：


    ```

    NameVirtualHost 1.2.3.4

    ```


    将1.2.3.4替换为你的真实IP地址，这将允许Apache知道它应该在哪个IP上提供虚拟主机名服务。然后你可以为要托管的每个主机名添加虚拟命令：


    ```

    <VirtualHost virtual.host.com>

    ServerAdmin webmaster@virtual.host.com

    DocumentRoot /home/httpd/virtual

    ServerName virtual.host.com

    </VirtualHost>

    ```


    这将在你的虚拟主机列表中添加virtual.host.com，并提供/home/httpd/virtual中的页面。当然，你需要有实际的virtual.host.com主机名指向该系统。


    ## 技巧7：Libc与Glibc


    几年前，每个Linux系统都使用libc版本5.x库。libc库是所有Unix C程序使用的主要库。它们访问的函数在该库中定义。


    最近，GNU项目引入了一个名为GNU libc或glibc的新版本库，也称为libc 6。某些发行版和较旧的系统可能没有glibc，也不支持glibc二进制文件。这对你编译的二进制文件没有影响，但你下载的链接到GNU
    libc的二进制文件将无法工作。


    有两种方法可以让它们工作。第一种是升级。你可以升级到支持glibc的较新版本，或者更换为已将glibc作为其主要库的发行版。另一种方法是在你当前的系统上安装glibc。这需要你知道自己在做什么，并首先备份你的系统。有关GNU产品的更多信息，请参见http://www.gnu.org页面。


    ## 技巧8：Qmail中的别名


    Qmail是一个允许用户发送和接收电子邮件的邮件程序。它也有很多有用的功能，其中之一就是别名。你可以为系统中没有账户的用户添加别名。以下是操作方法：


    - 如果"alias"账户尚不存在，则创建一个，并进入其主目录。

    - 编辑一个名为.qmail-username的文件，其中username是你想要添加的别名。

    - 在文件中添加地址，前面加上&符号。


    以下是.qmail-username文件的示例：


    ```

    &me@mydomain.com

    &meagain@some.other.domain.net

    ```


    这将把发送到用户"username"的任何邮件转发到列出的2个电子邮件地址。


    ## 技巧9：与Windows 98或NT 4共享Samba


    Samba是一个产品，允许你将Linux系统连接到Windows系统进行文件和打印机共享。默认情况下，Samba使用的SMB协议以明文形式发送密码。Windows
    98和NT使用加密密码。


    如果你无法从Windows系统连接到Samba服务器，很可能是因为Samba服务器不知道加密密码。你需要阅读Samba包中关于加密的文档。有一个工具可以将Linux的/etc/passwd文件转换为加密模式，以便Samba支持Windows加密密码。


    请注意，Samba也可以与Windows 3.1和Windows 95一起工作，无需加密。


    ## 技巧10：KDE拖放图标


    KDE是X Window system的一个窗口管理器。它在屏幕底部带有一个工具栏和默认按钮。你可以将图标从桌面拖到工具栏。问题是没有选项来添加图标。


    诀窍是将文件拖到工具栏上，然后进行编辑。打开KFM并将你想要的程序拖到工具栏上。然后你可以编辑它并更改工具栏中新图标的设置：


    ![](img/4fc015bbc2a49bafd7ac218106b1313d_66_0.png)

    '
