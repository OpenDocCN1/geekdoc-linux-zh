    ## Introduction


    ### Copyright


    This book is copyright by Patrick Lambert. It is provided free of charge in the
    hope that it will be useful. You may copy, distribute and print this book. You
    may not modify it without prior written consent from the author.


    The tips in this book are given AS-IS. This means that I shall not be responsible
    for any damage that may occur from their use. You use them at your own risks.


    Linux is a trademark of Linus Torvalds

    RedHat is a trademark of RedHat Software Inc.

    Windows and DOS are trademarks of Microsoft Corp.

    Sound Blaster is a trademark of Creative Labs

    PostScript is a trademark of Adobe

    Other trademarks and copyrights may apply.


    ### About the author


    Patrick Lambert is currently a student in Computer Science at the University of
    Montreal in Quebec, Canada. He is the author of various Web sites for the Linux
    community, and of various software packages including [GXedit](http://)


    Although he does everything from systems administration to software programming,
    he spends most of his time working on Web sites for the Linux community. You can
    contact Patrick at [drow@darkelf.net](mailto:drow@darkelf.net)


    ### Aknowledgements


    I would like to thank Tuomas Kuosmanen for the logo and the images on the Web
    site.


    ### Audience


    This book was written for anyone using Linux, from new users to experts who want
    to explore this wonderful operating system. The tips and tricks in this book were
    discovered by myself over years of experience using Linux, and learning about
    it. Some are very basic tips to make your computing life easier, others are advanced
    tricks that can save you days of work.


    I tried to cover all distributions of Linux in this book. I personaly use Slackware
    and RedHat on PC systems. If you find any error in the book, feel free to contact
    me so a future second edition could correct them.


    # 100 Linux Tips and Tricks


    # Organization


    This book is divided into 5 chapters. Each chapter covers a specific topic:


    - [Chapter 2](http://tipoftheweek.darkelf.net) covers installation of Linux. These
    are tips and tricks useful when installing Linux itself or any new program. Some
    tips will cover new means of installing Linux on non-typical hardware, others
    will explain how to take Linux distributions from an FTP server and make your
    own CD-ROM with them, or where to find Linux CD-ROMs for as little as $2.


    - [Chapter 3](http://tipoftheweek.darkelf.net) covers hardware related matters.
    You will learn tips there on how to get your non-PostScript compatible printer
    to work, or how to get a sound card detected.


    - [Chapter 4](http://tipoftheweek.darkelf.net) covers software. You will find
    tips there about all kinds of Linux software, including where to find and how
    to install the Java Development Kit port, and everything about the Pine mail and
    news program.


    - [Chapter 5](http://tipoftheweek.darkelf.net) covers networking in all its forms.
    There you will see how to setup a PPP connection quickly, without editing all
    of the configuration files yourself, as well as some nice programs that were made
    to ease dialup procedures. You will also see tricks on how to make your local
    LAN network without unexpected problems.


    - [Chapter 6](http://tipoftheweek.darkelf.net) is the last chapter but covers
    an important part of Linux: development. Here you will find a lot of tips on how
    to write powerful scripts to make your system easier to handle, and a full overview
    of what to do and what you don''t want to do in C to avoid problems like memory
    leaks, and how to allow easy scalability.


    # Web resources


    This book has a sister Web site at [http://tipoftheweek.darkelf.net](http://tipoftheweek.darkelf.net)
    where some of the tips from this book can be found, and where you can submit your
    own tips to the site, to help the Linux community.


    # 100 Linux Tips and Tricks


    # Installation


    ## What this chapter covers


    Installation is a very important part of any operating system. This is why I cover
    this topic first. The next most important thing is installation of programs and
    software to get your system to do useful tasks. This chapter covers both of these
    aspects.


    # 100 Linux Tips and Tricks


    # Tip 1: Which distribution is good for you


    They are all good. But that''s not a real tip. What you should be looking for
    is which distribution you feel the most comfortable with. RedHat has the reputation
    of being very easy to install. They provide special tools to make the configuration
    easier. Debian also has some tools, but alone usually require you to go on the
    command line more often to configure the system. If you want to be on your own,
    and really learn how to edit configuration files then Slackware is for you. The
    Web site [http://www.linux.org](http://www.linux.org) lists all the available
    distributions.


    In the end, the best person to decide which distribution you like, is yourself.


    # 100 Linux Tips and Tricks


    # Tip 2: How to find a Linux CD-ROM at low cost


    The Linux market started from a few distributions available only from FTP servers,
    to full feature commercial distributions available in stores and online including
    a printed manual and phone support.


    Here are the main choices you have when looking for a Linux distribution:


    - You can download any Linux distribution from its FTP server. To take a few examples,
    RedHat can be downloaded from [ftp://ftp.redhat.com](ftp://ftp.redhat.com), Slackware
    from [ftp://ftp.cdrom.com](ftp://ftp.cdrom.com) and Debian from [ftp://ftp.debian.org](ftp://ftp.debian.org).
    That method is free, but requires you to have a fast Internet connection. Downloading
    a full Linux distribution over a 56Kbps modem will take you quite a few hours.


    - An other way is to buy a full distribution. RedHat, for example, can be bought
    online for about $50. This will include a box, a CD-ROM, a boot diskette, a manual
    and support from RedHat.


    - The last way is to buy only the CD-ROM. There are a few places selling CD-ROMs
    of various distributions for $2. One of them is [http://www.cheapbytes.com](http://www.cheapbytes.com).
    You will only get the CD-ROM, but this is all you need to install Linux if you
    are comfortable with the fact that you don''t get a printed manual or free support.
    You can find the manual and other documentation on the CD-ROM.


    # 100 Linux Tips and Tricks


    # Tip 3: Multiple operating systems


    A computer only needs one operating system to work. But what if you just want
    to try out a new system? Do you need to forget about the old one and erase your
    hard drive? No, you can have as many operating systems on your computer as you
    wish.


    Linux requires 2 partitions to work. Partitions are sections of the hard drive.
    When you install Linux, it will provide a program called fdisk or disk druid allowing
    you to create the needed partitions. The main problems people have is that they
    don''t have empty partitions to use for Linux, and they don''t want to erase the
    current Windows or DOS partition. The trick is to resize your current partition
    to create empty space. Then you will be able to make the partitions needed by
    Linux to install properly.


    Fdisk doesn''t allow you to resize a partition. You will need to use another program
    to do the job, before using fdisk to create the Linux partitions. A very popular
    commercial product to do this is Partition Magic from [http://www.powerquest.com](http://www.powerquest.com).


    Let''s see step by step what is needed to resize an existing partition to allow
    the creation of a new one for Linux:


    - Buy Partition Magic, or get any other tool that can safely resize partitions.


    - Make sure you have at least 150 megs free on your main partition, the required
    amount for Linux.


    - Resize the partitions so you have at least 150 megs free, outside of any current
    partition.


    - Reboot and launch the Linux installation.


    - Run fdisk or any partitioning program that comes with the Linux distribution,
    and follow the installation instructions to make the required Linux partitions.'
