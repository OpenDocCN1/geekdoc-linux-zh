    # Tip 4: Parsing the command line in BASH


    Bash is a shell, but it''s also a scripting language. You can make bash scripts,
    and you can pass parameters to it. You can access the parameters with $1, $2,
    ... But what if you need the whole command line?


    Bash uses special variables for all kind of purposes. One of them is $* which
    contains the whole command line. You can use it rather than the $1, $2 if all
    you need is a string of text, passed on the command line.'
  - '[PAGE 105]


    # 100 Linux Tips and Tricks


    # Tip 5: Don''t grep grep


    A useful tool in scripting is the "grep" function. This program will find a string
    in a file. It is often used also to find if a process is running:


    ```

    ps ax | grep sendmail

    ```


    That command will find if Derivatives from ALM sent orole running. The problem
    is that you might end up with an other entry for this command. Because you grep
    for "sendmail", you may well end up with this command showing because the "sendmail"
    string is in the command line. To avoid that, you can use the -v flag to grep:


    ```

    ps ax | grep sendmail | grep -v grep

    ```


    That command will find all the lines in the current process list that have the
    "sendmail" string in it, and will remove the lines containing the string "grep".'
  - '[PAGE 106]


    # Tip 6: Move a text into upper case letters


    When you want to do text manipulation, you can use Sed and Awk. These 2 tools
    which come on most Linux distributions, will allow you to modify text files in
    many ways.


    To move a text file into upper case letters, you can use Awk in the following
    way:


    ```

    awk ''{ print toupper($0) }'' old_file > new_file

    ```


    Sed and Awk are useful for a lot of other uses, and are integrated in several
    products.'
  - '[PAGE 107]


    # 100 Linux Tips and Tricks


    # Tip 7: Using PASCAL on Linux


    Linux comes with a lot of compilers and interpreters. These include programs for
    C, C++, Perl, TCL/TK and more. Unfortunately most Linux distributions don''t come
    with a Pascal compiler. Is it possible to compile Pascal programs? It sure is.


    Several projects were started to make a Pascal compiler for Linux. One is called
    GNU Pascal and is available from [http://agnes.dida.physik.uni-essen.de/~gnu-pascal](http://agnes.dida.physik.uni-essen.de/~gnu-pascal).
    That program will also run on any operating system that supports the GNU C compiler.'
  - '[PAGE 108]


    # 100 Linux Tips and Tricks


    # Tip 8: Segmentation fault


    One of the most common problems when making software is errors like "Segmentation
    fault", also called SegFault. Here is what a SegFault is.


    Virtual memory in a computer can be created in 2 ways: pages or segments. Paging
    means that the memory is divided in pages of equal size, containing words of memory
    in it. Segmentation means that every process has a segment of memory of needed
    size, with gaps of empty memory blocks between the segments.


    The operating system knows the upper limit of every segment, and every segment
    begins at a virtual address 0. When a program accesses a memory block, it calls
    a virtual address that the Memory Management Unit (MMU) maps to a real address.
    If the operating system sees that the requested address doesn''t match any valid
    address in the segment, it will send a signal to the process terminating it.


    SegFaults are the direct result of a memory error. The program has a bad pointer,
    a memory leak or any kind of error that makes it access the wrong memory address.
    To correct these errors you need to check pointers and arrays for errors.'
  - '[PAGE 109]


    # 100 Linux Tips and Tricks


    # Tip 9: Who is online?


    Many system administrators use scripts to help them in the process of managing
    a server. A common problem is finding out exactly what users are on the system
    and what they are doing.


    Several tools are available on the system to see who is online, what processes
    are running, and pipeing them together can resolve many problems. Here are 2 small
    scripts that will show, first if a user is online, and then what he is running:


    ```

    who | grep $1

    ps -aux | grep $1

    ```


    The variable $1 here means the first command line argument, from a shell script.
    The who command first checks if the user is online, then ps will show all the
    processes currently running under that user''s UID.'
  - '[PAGE 110]


    # 100 Linux Tips and Tricks


    # Tip 10: Graphical toolkits


    Most Unix programs are console based. This is mainly because several years ago,
    most computer users were on text-only stations linked to big mainframes.


    Now, Linux is becoming a full graphical desktop, and needs graphical programs,
    or at least frontends to text-only programs. This is where graphical tookits come
    in. Here is a list of some of the toolkits available to Linux programmers:


    +   - [GTK](https://www.gtk.org/) - This is currently a very popular toolkit,
    and is the base of the GNOME desktop. It is C based and easy to work with.


    +   - [QT](https://www.qt.io/) - QT is a C++ toolkit made by Troll Tech. It is
    the base of the popular KDE desktop.


    +   - [WXwindows](https://www.wxwindows.org/) - This is a very complete C++ toolkit
    that is cross-platform. The same code should work on Windows, the MacOS, Unix
    (Motif and GTK) and others.


    +   - [GraphApp](http://www.hoople.org/~fitzsim/graphapp/) - This is also a cross-platform
    toolkit, but is one of the easiest libraries I ever saw. It supports a smaller
    set of widgets, but takes only hours to learn. It will work on Windows, the MacOS,
    Unix (Motif and Athena) and others.'
- md: '## 100 Linux Tips and Tricks


    ## Tip 11: IDE and visual interfaces


    If you are a programmer that comes from the Windows world, you may be used to
    code in a visual interface or an IDE. Coding in a text editor and then going to
    the shell to compile may be the traditional way of Unix and Linux users, but it
    may not be what you are looking for.


    You can use a visual interface in Linux too. Searching for "visual" or "IDE" at
    http://www.freshmeat.net will return a few programs available to you. But there
    may be a much better way.


    The purpose of a visual interface is to make coding more efficient. There are
    many so-called programmer editors. These are text editors so powerful that you
    can do everything with them. This includes editing multiple files, compiling and
    even debugging your program.


    One of them is emacs, available from the GNU project. It is so powerful that it
    enables you to edit text, compile, read mail, newsgroups, and even browse the
    Web. It may seem far more complex than your usual Windows visual editor, but it
    may prove really interesting in the end.


    ## Tip 12: Free software and copyleft


    Most software programs under Linux come under the GPL license. The so-called copyleft
    agreement. It may be confusing to new Linux programmers. Here are the main features
    of the license, and why you may or may not want to use it for your programs. The
    full license is available from the GNU site at http://www.gnu.org.


    The GPL license provides software free. Not as in free of charge, but in freedom.
    You can charge money for free software or software under the GPL. What you can''t
    do is restrict its use.


    You must provide source code, or a way for the user to have access to that source
    code. This means that if you release a program as a binary only, it can''t be
    under the GPL license and may not contain GPL code from other people.


    If you use code available from other people under the GPL license, you can modify
    it and redistribute it under the same license, with source code. Also, you must
    keep the previous copyright notices, and write down in the program what changes
    you have made to it. This also means that anyone can modify your programs, as
    long as they keep your copyright notices there, and release their modifications
    under the same license.


    ## Tip 13: Talking to the terminal


    Under DOS, or other text based systems, there is only one way in and one way out.
    Under Linux and every Unix system, there is one way in but two ways out.


    The terminal has 2 outputs, one for standard output and one for errors. By default,
    they both display on the same device: your monitor. But they can be redirected,
    for example, to different logs. This is why it''s important for you to use them
    properly.


    The standard output is called stdout, and printing to it will print to the screen,
    or where it is redirected. In C, it may look like this:


    ```

    fprintf(stdout, "Test\n");

    ```


    The standard error is called stderr:


    ```

    fprintf(stderr, "Error\n");

    ```


    To input, you need to read from the standard input, called stdin. They are all
    available to you from the stdio.h file.


    ## Tip 14: Internet technologies


    The Internet is of course a big phenomena, and Linux is a big part of it. Linux
    servers are very popular, and you can be a part of this revolution.


    Among available technologies, here are the most popular ones:


    - Java - The Java language is a new and powerful language made to be cross-platform.
    Since the Web must be available on all systems, this makes Java a very powerful
    tool. You can make Java applets that will run on the user''s system and display
    information or interact with him.


    - JavaScript - This is similar to Java, but in a Web page itself. It is embedded
    in HTML, to do small functions like rollover scripts, and making text appear on
    the screen.


    - CGI - The CGI protocol is very much in use for servers with some sort of account
    system, like online shops and search engines. You can make CGI scripts in any
    language, and make your Web server run them on the server.


    ## Tip 15: Library types


    Two types of libraries exist on most operating systems: shared and static. On
    Windows, they are .DLL, for dynamically linked library, and .LIB for static library.


    On Linux and most Unix, they are .so and .a files. The shared libraries, the .so
    files, are loaded at runtime. The .a files, or static libraries, are loaded at
    compile time and are no longer required to run the binary program.


    When you make a program, you must decide if you will link it to a static library
    or a shared one. You will want a shared library in most cases because standard
    libraries are available on most systems, and would be too big to include in a
    binary file.


    If you have a small library that is not one of the standard ones that you need,
    then you may decide to include it in your binary program. In that case, simply
    add it like any other object file in your compilation:


    ```

    cc -o program file1.o file2.o library.a

    ```


    Visit for more Tips, Tricks & eBooks :-


    www.ElectronicBooks.tk


    www.ElectronicBooks.110mb.com'
  mdcn: '

    ## 100 条 Linux 技巧与窍门


    ## 技巧 11：IDE 与可视化界面


    如果你是一位来自 Windows 世界的程序员，你可能习惯在可视化界面或 IDE 中编写代码。在文本编辑器中编写代码，然后进入 shell 进行编译，这可能是
    Unix 和 Linux 用户的传统方式，但也许并不是你想要的方式。


    在 Linux 中你也可以使用可视化界面。在 http://www.freshmeat.net 上搜索 "visual" 或 "IDE" 会返回一些可用的程序。但可能有更好的方式。


    可视化界面的目的是让编码更高效。有许多所谓的程序员编辑器。这些文本编辑器功能非常强大，你可以用它们完成所有工作。这包括编辑多个文件、编译甚至调试你的程序。


    其中之一是 emacs，来自 GNU 项目。它功能强大，可以让你编辑文本、编译、阅读邮件、新闻组，甚至浏览网页。它看起来可能比常用的 Windows 可视化编辑器复杂得多，但最终可能会证明非常有趣。


    ## 技巧 12：自由软件与版权所左


    Linux 下的大多数软件程序都遵循 GPL 许可证。即所谓的版权所左（copyleft）协议。对于 Linux 新手程序员来说，这可能会令人困惑。以下是该许可证的主要特性，以及你可能希望或不希望将其用于你的程序的原因。完整许可证可从
    GNU 网站 http://www.gnu.org 获取。


    GPL 许可证提供的是自由软件。不是指免费（free of charge），而是指自由（freedom）。你可以为自由软件或 GPL 下的软件收费。你不能做的是限制它的使用。


    你必须提供源代码，或者为用户提供访问该源代码的方式。这意味着如果你仅以二进制形式发布程序，它不能遵循 GPL 许可证，也不能包含他人的 GPL 代码。


    如果你使用他人以 GPL 许可证提供的代码，你可以修改它并在相同许可证下重新分发，同时提供源代码。此外，你必须保留先前的版权声明，并在程序中记录你对它所做的更改。这也意味着任何人都可以修改你的程序，只要他们保留你的版权声明，并在相同许可证下发布他们的修改。


    ## 技巧 13：与终端对话


    在 DOS 或其他基于文本的系统下，只有一种输入方式和一种输出方式。在 Linux 和每个 Unix 系统下，有一种输入方式，但有两种输出方式。


    终端有 2 个输出，一个用于标准输出，一个用于错误。默认情况下，它们都显示在同一设备上：你的显示器。但它们可以被重定向，例如，到不同的日志。这就是为什么正确使用它们很重要。


    标准输出称为 stdout，向它打印会输出到屏幕，或它被重定向到的地方。在 C 中，它看起来像这样：


    ```

    fprintf(stdout, "Test\n");

    ```


    标准错误称为 stderr：


    ```

    fprintf(stderr, "Error\n");

    ```


    要输入，你需要从标准输入读取，称为 stdin。它们都可以从 stdio.h 文件中使用。


    ## 技巧 14：互联网技术


    互联网当然是一个巨大的现象，而 Linux 是其中的重要组成部分。Linux 服务器非常流行，你可以成为这场革命的一部分。


    在可用的技术中，以下是最流行的：


    - Java - Java 语言是一种新的、强大的语言，旨在实现跨平台。由于 Web 必须在所有系统上可用，这使得 Java 成为一种非常强大的工具。你可以制作
    Java 小程序，它将在用户的系统上运行并显示信息或与他交互。


    - JavaScript - 这与 Java 类似，但存在于网页本身中。它嵌入在 HTML 中，用于执行小功能，如悬停脚本，以及使文本显示在屏幕上。


    - CGI - CGI 协议广泛用于带有某种账户系统的服务器，如在线商店和搜索引擎。你可以用任何语言编写 CGI 脚本，让你的 Web 服务器在服务器上运行它们。


    ## 技巧 15：库类型


    大多数操作系统上存在两种类型的库：共享库和静态库。在 Windows 上，它们是 .DLL（动态链接库）和 .LIB（静态库）。


    在 Linux 和大多数 Unix 上，它们是 .so 和 .a 文件。共享库，即 .so 文件，在运行时加载。.a 文件，或静态库，在编译时加载，运行二进制程序时不再需要。


    当你编写程序时，你必须决定是将其链接到静态库还是共享库。在大多数情况下，你会想要共享库，因为标准库在大多数系统上都可用，而且包含在二进制文件中会太大。


    如果你有一个小的库，不是标准库之一，但你需要它，那么你可以决定将它包含在你的二进制程序中。在这种情况下，只需像任何其他目标文件一样在编译中添加它：


    ```

    cc -o program file1.o file2.o library.a

    ```


    访问以获取更多技巧、窍门与电子书：


    www.ElectronicBooks.tk


    www.ElectronicBooks.110mb.com

    '
