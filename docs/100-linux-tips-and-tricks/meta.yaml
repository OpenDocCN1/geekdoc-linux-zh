    # Tip 1: Detecting 2 ethernet cards


    To configure an ethernet card in Linux, you need to enable it in the kernel. Then
    the kernel will detect your ethernet card if it is at a common IO port. But it
    will stop there, and will never check if you have 2 ethernet cards.


    The trick is to tell the ethernet driver that there are 2 cards in the system.
    The following line will tell the kernel that there is an ethernet card at IRQ
    10 and IO 0x300, and another one at IRQ 9 and IO 0x340:


    ```

    ether=10,0x300,eth0 ether=9,0x340,eth1

    ```


    You can add that line on bootup at the "boot:" prompt, or in the /etc/lilo.conf
    file. Don''t forget to run:


    ```

    lilo

    ```


    That will reload the lilo.conf file and enable changes.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# 100 Linux Tips and Tricks


    # Tip 2: Everything on sound cards


    A sound card can be easy or hard to detect. It depends on who made it. Many Sound
    Blaster Compatible cards in fact are not compatible with the Linux Sound Blaster
    driver. Other cards will be compatible with a driver you would never have thought
    of.


    There are multiple drivers for Linux. Currently the kernel comes with its own
    set of sound drivers, plus the OSS/Free drivers. These will support most generic
    cards. In the installation program, or when compiling your kernel, you can pick
    the sound card that matches yours, or the one that matches the chipset on your
    sound card (for example, the Sound Blaster PCI64 card uses the AudioPCI chipset).


    If your sound card is not supported by the kernel, you will need to get another
    driver. 2 popular ones are ALSA available from http://alsa.jcu.cz and OSS/Linux
    available from http://www.opensound.com


    OSS/Linux is a commercial product that supports a lot of cards not available in
    other drivers because of card specification restrictions. You will need to see
    the list of supported cards in each driver and pick the driver you need.'
  merge: -1
