    # Tip 7: Kernel size and modules


    To configure Linux to detect a new hardware part, especially on a new kernel,
    you may need to recompile the kernel. If you add too many devices in the kernel
    configuration, you may get an error message telling you that the kernel is too
    big. The trick is to enable modules.


