    # Tip 15: Read files from FAT32 drives


    The Linux utility mount can read any file system that the kernel supports. Since
    version 2.0.34, the kernel supports FAT32, which is the main file system used
    by Windows 98.


    To read the FAT32 file system you need to specify the -tvfat option to mount.
    Here is an example:


    ```

