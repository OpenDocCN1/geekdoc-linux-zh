  md: '# Tip 9: Reading a foreign file system


    File systems are defined in the kernel. The kernel supports many file systems,
    but they need to be compiled in, or compiled as a module. When you compile a file
    system in the kernel, all you need to do is use mount with the -t option and the
    right file system type.


    If you have compiled a driver for a file system as a module, then you need to
    load the module first.


    Here are a few of the available file systems:


    +   - msdos: This is the FAT file system used by DOS.


    +   - vfat: This is the FAT32 file system used by Windows 95 and Windows 98.


    +   - ext2: This is the default Linux file system.


    +   - iso9660: This is the default CD-ROM format.'
