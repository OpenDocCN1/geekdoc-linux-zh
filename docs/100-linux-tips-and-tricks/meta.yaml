- md: ' # 100 Linux Tips and Tricks


    ## Tip 25: Making CD-ROM images


    With other operating systems, such as Microsoft Windows or IBM OS/2, you are not
    allowed in the license to make your own CD-ROM with the OS on it and then distribute
    it.


    Linux, being Open Source and free, can be copied. You can download a distribution
    or buy it from an online store and burn your own copy, and then install it on
    many computers, or give it to your friends. Usually, you will find instructions
    on how to do that on the FTP server for your favorite distribution. You will need
    the main directory on the CD-ROM. The sources are not needed since they are available
    from the FTP site.


    Some distributions also come with ISO images of their CD-ROM. This is a single
    file that can be put onto a CD-ROM, and will create a full file system with files
    on it.


    One thing you have to be careful is not to copy commercial programs. The basic
    CD-ROM where the Linux distribution is located is composed of free software. But
    some distributions may come with other commercial programs, and you should read
    the license first.


    ## Tip 26: FTP access restrictions


    When you first install Linux, it comes with a lot of Internet services running,
    including mail, telnet, finger and FTP. You really should disable all those that
    you don''t need from /etc/inetd.conf and your startup scripts.


    FTP may be very useful, but must be configured correctly. It can allow people
    to log into their accounts, it can allow anonymous users to login to a public
    software directory, and it can display nice messages to them.


    The files that you will probably want to modify are /etc/ftpusers and /etc/ftpaccess.


    The file /etc/ftpusers is very simple. It lists the people that will not be allowed
    to use FTP to your system. The root account, and other system accounts should
    be in that file.


    The file /etc/ftpaccess is a bit more complex and controls the behaviour of the
    FTP server. It tells it what to use as README file to display on a directory listing,
    what kind of logs to create and what messages to display.


    Note that if you create an anonymous FTP area, you will need to read the FTP man
    page and do exactly what it tells you to avoid possible security risks.


    ## Hardware


    ## What this chapter covers


    Hardware support has once been a very big problem with Linux. Generic hardware
    always was well supported, but most of the hardware today is unfortunately non-generic.
    100% Sound Blaster compatible cards often are not detected by the Sound Blaster
    driver, and non-PostScript printers don''t accept PostScript input unless a program
    previously converted it. These are the kind of problems we solve here.


    ## Tip 1: Detecting 2 ethernet cards


    To configure an ethernet card in Linux, you need to enable it in the kernel. Then
    the kernel will detect your ethernet card if it is at a common IO port. But it
    will stop there, and will never check if you have 2 ethernet cards.


    The trick is to tell the ethernet driver that there are 2 cards in the system.
    The following line will tell the kernel that there is an ethernet card at IRQ
    10 and IO 0x300, and another one at IRQ 9 and IO 0x340:


    ```

    ether=10,0x300,eth0 ether=9,0x340,eth1

    ```


    You can add that line on bootup at the "boot:" prompt, or in the /etc/lilo.conf
    file. Don''t forget to run:


    ```

    lilo

    ```


    That will reload the lilo.conf file and enable changes.


    ## Tip 2: Everything on sound cards


    A sound card can be easy or hard to detect. It depends on who made it. Many Sound
    Blaster Compatible cards in fact are not compatible with the Linux Sound Blaster
    driver. Other cards will be compatible with a driver you would never have thought
    of.


    There are multiple drivers for Linux. Currently the kernel comes with its own
    set of sound drivers, plus the OSS/Free drivers. These will support most generic
    cards. In the installation program, or when compiling your kernel, you can pick
    the sound card that matches yours, or the one that matches the chipset on your
    sound card (for example, the Sound Blaster PCI64 card uses the AudioPCI chipset).


    If your sound card is not supported by the kernel, you will need to get another
    driver. 2 popular ones are ALSA available from http://alsa.jcu.cz and OSS/Linux
    available from http://www.opensound.com


    OSS/Linux is a commercial product that supports a lot of cards not available in
    other drivers because of card specification restrictions. You will need to see
    the list of supported cards in each driver and pick the driver you need.


    ## Tip 3: Non-PostScript printers


    Unfortunately, most printers are non-PostScript compatible. This means that your
    LPR program won''t like it.


    You will probably notice that when you first use ''lpr'' to print, the output
    looks weird on your printer. This is because these models do not support PostScript.
    You will need a converting program for it.


    Note that newer versions of RedHat already have those programs or similar filters
    so it may not apply to all Linux systems.


    First, you need to go read the Printing HOWTO to find out how to use lpr and related
    printing programs.


    Then, you''ll need to get 2 programs from http://metalab.unc.edu:


    - bjf

    - aps


    These are the filters to convert text and PostScript to your printer''s format.


    First, install bjf which will be used to print text. Installation is very simple.
    type:


    ```

    make

    cp bjf /bin/bjf

    ```


    Then, make a simple shell script to print text files and call it print.sh:


    ```

    #!/bin/sh

    /bin/bjf <$1> /dev/lp0

    ```


    Where /dev/lp0 is your printer.


    Now, install aps by running the SETUP script in its package. It''s really easy
    to setup, but you do need to have the GhostScript program installed prior to installation.
    You are now ready to print PostScript files from, for example, Netscape or XV.


    ## Tip 4: Use Windows special keys in Linux


    Why are all the new keyboards sold with Win95 keys on them? How about making them
    do real keyboard functions while in X Window? Here is how.


    First you need to find out which key mapping you are using. Usually it will be
    US, it might also be en_US, ca or else. Locate the file, usually in /usr/X11/lib/X11/xkb
    and edit it with your favorite editor. For me the file is called /usr/X11/lib/X11/xkb/symbols/ca.


    The file lists all the key codes and what they do. The key codes for the Win95
    special稍有不同，special keys are LWIN, RWIN and MENU. All you need to do is add them
    to the list, with the functions for them. I decided to map the left WIN key to
    "@" and the right WIN key and MENU keys to "{" and "}". Here are the lines I added:


    ```

    key <RWIN> { [ braceleft ] };

    key <LWIN> { [ at ] };

    key <MENU> { [ braceright ] };

    ```


    By browsing the file you can find all the other symbols and what they do. You
    can also add multiple functions to a key, by using ALT and SHIFT.


    The changes will take effect when you restart X Window. With the XKB extension
    (you do need to have it enabled in /etc/XF86Config btw) it''s easy to change the
    mapping of any key.


    ## Tip 5: Added processors


    Dual processors are becoming more and more popular in computers. Of course, you
    won''t be able to see much performance increase in Linux unless you tell Linux
    about the second CPU. Here is how to do it.


    Go in the kernel, and enable SMP. SMP means Symetric Multi-Processing and tells
    the kernel that more than one processor can be used.


    After a reboot, Linux should tell you that it has detected 2 processors and what
    their status are.


    ## Tip 6: Detecting an ISA device


    ISA devices like modems should be detected automatically by the kernel. One case
    where they would not be detected is if the device is Plug and Play. The kernel
    won''t be able to detect ISA PnP devices unless they have been prepared by a program
    called isapnptools.


    The trick is to use this program in initiation scripts. It will detect the ISA
    PnP devices and make them available to kernel modules and applications.


    For example if you want to access an ISA PnP sound card, you will need to compile
    sound as a module in the kernel, and use isapnptools before loading the module.'
  mdcn: "\n # 100 个 Linux 技巧与窍门\n\n## 技巧 25：制作 CD-ROM 镜像\n\n与其他操作系统（如 Microsoft Windows\
    \ 或 IBM OS/2）不同，其许可协议不允许你制作包含该系统的 CD-ROM 并进行分发。\n\nLinux 作为开源且免费的系统，可以被复制。你可以下载某个发行版或从在线商店购买，然后刻录自己的副本，接着将其安装到多台计算机上，或者送给你的朋友。通常，你可以在所选发行版的\
    \ FTP 服务器上找到关于如何操作的使用说明。你需要的是 CD-ROM 上的主目录。源码不是必需的，因为它们可以从 FTP 站点获取。\n\n一些发行版还提供其\
    \ CD-ROM 的 ISO 镜像。这是一个单一文件，可以刻录到 CD-ROM 上，会在其上创建包含文件的完整文件系统。\n\n有一点需要注意：不要复制商业程序。Linux\
    \ 发行版所在的基本 CD-ROM 由自由软件组成。但有些发行版可能附带其他商业程序，你应该先阅读其许可协议。\n\n## 技巧 26：FTP 访问限制\n\
    \n初次安装 Linux 时，系统会运行大量互联网服务，包括邮件、telnet、finger 和 FTP。你真的应该从 /etc/inetd.conf 和启动脚本中禁用那些不需要的服务。\n\
    \nFTP 可能非常有用，但必须正确配置。它可以允许人们登录自己的账户，可以允许匿名用户登录到公共软件目录，还可以向他们显示友好的消息。\n\n你可能需要修改的文件是\
    \ /etc/ftpusers 和 /etc/ftpaccess。\n\n文件 /etc/ftpusers 非常简单。它列出了不被允许使用 FTP 访问你系统的用户。root\
    \ 账户和其他系统账户应该列在该文件中。\n\n文件 /etc/ftpaccess 稍微复杂一些，它控制 FTP 从服务器的行为。它告诉服务器在目录列表中使用什么作为\
    \ README 文件显示、创建哪种类型的日志以及显示什么消息。\n\n注意，如果你创建匿名 FTP 区域，你需要阅读 FTP 手册页并严格按照说明操作，以避免可能的安全风险。\n\
    \n## 硬件\n\n## 本章涵盖内容\n\n硬件支持曾经一度是 Linux 面临的很大问题。通用硬件一直以来都得到了良好的支持，但如今大多数硬件 unfortunately\
    \ 并非通用。所谓 100% 兼容 Sound Blaster 的声卡往往无法被 Sound Blaster 驱动程序检测到，而非 PostScript 打印机无法接受\
    \ PostScript 输入，除非之前有程序进行过转换。这些正是我们在这里要解决的问题。\n\n## 技巧 1：检测 2 块以太网卡\n\n要在 Linux\
    \ 中配置以太网卡，你需要在 kernel 中启用它。然后 kernel 会在常用 IO 端口检测到您的以太网卡。但到此为止，它不会检查您是否有 2 块以太网卡。\n\
    \n诀窍是告诉以太网驱动程序系统中有 2 块网卡。以下命令行会告诉 kernel，在 IRQ 10 和 IO 0x300 处有一块以太网卡，在 IRQ 9\
    \ 和 IO 0x340 处有另一块：\n\n```\nether=10,0x300,eth0 ether=9,0x340,eth1\n```\n\n你可以在启动时的\
    \ \"boot:\" 提示符处添加该行，或者在 /etc/lilo.conf 文件中添加。不要忘记运行：\n\n```\nlilo\n```\n\n这将重新加载\
    \ lilo.conf 文件并启用更改。\n\n## 技巧 2：关于声卡的一切\n\n声卡的检测可能简单也可能困难。这取决于制造商。许多所谓的兼容 Sound\
    \ Blaster 声卡实际上并不兼容 Linux 的 Sound Blaster 驱动程序。其他一些声卡可能与你从未想到的某个驱动程序兼容。\n\nLinux\
    \ 有多种驱动程序。目前 Kernel 自带一套声卡驱动程序，还有 OSS/Free 驱动程序。这些将支持大多数通用声卡。在安装程序中，或编译 Kernel\
    \ 时，你可以选择与你的声卡匹配的选项，或者与声卡芯片组匹配的选项（例如，Sound Blaster PCI64 声卡使用 AudioPCI 芯片组）。\n\
    \n如果你的声卡不被 Kernel 支持，你需要获取其他驱动程序。两个流行的选择是 ALSA（可从 http://alsa.jcu.cz 获取）和 OSS/Linux（可从\
    \ http://www.opensound.com 获取）。\n\nOSS/Linux 是支持大量声卡的商业产品，这些声卡由于规格限制而无法在其他驱动程序中使用。你需要查看每个驱动程序支持的声卡列表，然后选择你需要的驱动程序。\n\
    \n## 技巧 3：非 PostScript 打印机\n\n遗憾的是，大多数打印机不兼容 PostScript。这意味着你的 LPR 程序无法直接处理它们。\n\
    \n当你第一次使用 'lpr' 打印时，可能会发现打印输出看起来很奇怪。这是因为这些型号不支持 PostScript。你需要一个转换程序。\n\n注意，较新版本的\
    \ RedHat 已经包含这些程序或类似的过滤器，因此这可能不适用于所有 Linux 系统。\n\n首先，你需要阅读 Printing HOWTO，了解如何使用\
    \ lpr 及相关打印程序。\n\n然后，你需要从 http://metalab.unc.edu 获取 2 个程序：\n\n- bjf\n- aps\n\n\
    这些是将文本和 PostScript 转换为你打印机格式的过滤器。\n\n首先，安装 bjf，用于打印文本。安装非常简单。输入：\n\n```\nmake\n\
    cp bjf /bin/bjf\n```\n\n然后，制作一个简单的 shell 脚本来打印文本文件，命名为 print.sh：\n\n```\n#!/bin/sh\n\
    /bin/bjf <$1> /dev/lp0\n```\n\n其中 /dev/lp0 是你的打印机。\n\n现在，通过运行 aps 软件包中的 SETUP\
    \ 脚本来安装 aps。设置非常简单，但你需要在安装前先安装 GhostScript 程序。现在，你已经准备好从 Netscape 或 XV 等应用程序打印\
    \ PostScript 文件了。\n\n## 技巧 4：在 Linux 中使用 Windows 特殊键\n\n为什么现在销售的新键盘都带有 Win95 键呢？如何让它们在\
    \ X Window 中实现真正的键盘功能？方法如下。\n\n首先，你需要找出正在使用的键位映射。通常是 US，也可能是 en_US、ca 或其他。找到该文件，通常在\
    \ /usr/X11/lib/X11/xkb 目录下，用你喜欢的编辑器编辑它。对我来说，文件是 /usr/X11/lib/X11/xkb/symbols/ca。\n\
    \n该文件列出了所有键码及其功能。Win95 特殊键的键码略有不同，它们是 LWIN、RWIN 和 MENU。你所需要做的就是将它们添加到列表中，并指定相应的功能。我决定将左\
    \ WIN 键映射为 \"@\"，右 WIN 键和 MENU 键映射为 \"{\" 和 \"}\"。这是我添加的行：\n\n```\nkey <RWIN>\
    \ { [ braceleft ] };\nkey <LWIN> { [ at ] };\nkey <MENU> { [ braceright ] };\n\
    ```\n\n通过浏览该文件，你可以找到所有其他符号及其功能。你还可以使用 ALT 和 SHIFT 为按键添加多种功能。\n\n重启 X Window 后，更改将生效。借助\
    \ XKB 扩展（你需要在 /etc/XF86Config 中启用它），更改任何按键的映射都非常容易。\n\n## 技巧 5：添加处理器\n\n双处理器在计算机中越来越普及。当然，除非你告诉\
    \ Linux 第二个 CPU 的存在，否则在 Linux 中不会看到太多性能提升。方法如下。\n\n进入 Kernel，启用 SMP。SMP 代表对称多处理，它告诉\
    \ Kernel 可以使用多个处理器。\n\n重启后，Linux 应该会告诉你它已检测到 2 个处理器及其状态。\n\n## 技巧 6：检测 ISA 设备\n\
    \n像调制解调器这样的 ISA 设备应该能被 Kernel 自动检测。有一种情况它们可能无法被检测到，即该设备是即插即用（Plug and Play）的。Kernel\
    \ 无法检测 ISA PnP 设备，除非它们已经被名为 isapnptools 的程序准备就绪。\n\n诀窍是在初始化脚本中使用该程序。它将检测 ISA PnP\
    \ 设备，并使它们可供 Kernel 模块和应用程序使用。\n\n例如，如果你想访问 ISA PnP 声卡，你需要将声卡编译为 Kernel 模块，并在加载模块之前使用\
    \ isapnptools。\n"
