    \n## 技巧 16：Real 音频和视频\n\nReal Networks 已经发布了适用于 Linux 的 Real Player。不幸的是，许多用户在设置它时遇到了问题。当运行较旧的内核时，你可能需要禁用\
    \ 16 位声音播放。当使用 Linux 内核 2.2 配合 Real Player 5.0 时，你可能需要使用一种变通方法来让 Real Player 工作。该变通方法可在网上找到。\n\
    \nReal Networks 为 Linux 和 RedHat Linux 提供 Real Player。RedHat Linux 版本采用 RPM 格式。以下是它：\n\
    \n## 技巧 17：模拟\n\nLinux 与 Unix 源代码兼容。这意味着所有 Unix 程序在正确编译后都应该能在 Linux 上工作，只需对源代码进行少量或无需修改。Unix\
    \ 确实提供了各种各样的软件程序，但有些程序只在非 Unix 系统上可用。\n\nLinux 上有多种模拟器可用。我们将介绍 4 种：\n\n- 其中一种叫做\
