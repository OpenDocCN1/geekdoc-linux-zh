    # Tip 12: Linux without a hard drive


    Modern Linux distributions require around 100 megs to 200 megs of hard disk space
    to install. But is it possible to run Linux on a system without a hard drive?
    Yes it is.


    The Linux Router Project is a full-featured Linux distribution that fits on one
    diskette. It was made for routers, and use modules to add the software packages
    you need, including DNS servers, Web servers, email and routing. You can find
    more information on the Linux Router Project at http://www.linuxrouter.org.'
