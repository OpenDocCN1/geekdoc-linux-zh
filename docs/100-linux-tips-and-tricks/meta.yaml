    # Tip 4: Installing with no CD-ROM drive or modem


    Most Linux distributions come on a CD-ROM. You can also download them from an
    FTP site, but that requires an Internet connection. What if you have a system
    with no CD-ROM drive or Internet connection, like an old 486 laptop? The trick
    here is to have another desktop system with a CD-ROM drive, and a null-modem serial
    cable.


