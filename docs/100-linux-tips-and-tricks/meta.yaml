    # 100 Linux Tips and Tricks


    # Tip 14: Allowing users to run root programs


    When a user starts a command, it runs with the permissions of that user. What
    if you want to allow them to run some commands with root permissions? You can,
    and that''s called suid.


    You can set a command to be suid root with the chmod command. This will make it
    run as root even if a user starts it. Here is how to set mybin suid root:


    ```

    chmod +s mybin

    ```


    Note that you must be very careful with this option. If the command has any security
    hole, or allows the user to access other files or programs, the user could take
    over the root account and the whole system.'
  - '[PAGE 22]


    # 100 Linux Tips and Tricks


    # Tip 15: Linux and NT booting


    Some people choose to have both Windows NT and Linux on the same system. Windows
    NT has its own boot loader called NTLDR and Linux has LILO. Which should go on
    the MBR?


    The safest way is to install Windows NT first, and give it the MBR. Then, when
    you install Linux, tell LILO to install on the Linux partition. Also set the Linux
    partition as the active partition. When the system boots, LILO will be loaded,
    and if you want to boot Windows NT, then LILO can load the MBR with NTLDR in it.
    There is a mini HOWTO text covering this subject available at [http://metalab.unc.edu/pub/Linux/docs/HOWTO](http://metalab.unc.edu/pub/Linux/docs/HOWTO).'
  - '[PAGE 23]


    # 100 Linux Tips and Tricks


    # Tip 16: Annoying boot messages


    When recompiling your kernel, you might end up seeing strange messages on bootup
    like:


    ```

    modprobe: cannot find net-pf-5

    modprobe: cannot find char-major-14

    ```


    These are messages from the modules loader telling you that he can''t find specific
    modules. This usually happens when you compile modules, but modprobe tries to
    load modules that were not compiled and it can''t find them. The way to remove
    those messages is to set the modules to off. In the file /etc/conf.modules you
    may want to add:


    ```

    alias net-pf-5 off

    alias char-major-14 off

    ```


    This will stop modprobe from trying to load them. Of course you could also try
    to resove the problem by compiling the modules and make sure modprobe knows where
    they are.'
