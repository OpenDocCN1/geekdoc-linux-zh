    # 100个 Linux 技巧与窍门


    # 安装


    ## 本章涵盖内容


    安装是任何操作系统中非常重要的部分，因此我将这个主题放在首位。其次重要的是程序和软件的安装，以使您的系统能够执行有用的任务。本章涵盖了这两个方面的内容。


    # 100个 Linux 技巧与窍门


    # 技巧 1：哪种发行版适合您


    它们都很好，但这并不是一个真正有意义的答案。您应该寻找的是您使用起来最舒服的发行版。RedHat 以易于安装而闻名，他们提供了专门的工具来简化配置。Debian
    也提供了一些工具，但通常需要您更多地通过命令行来配置系统。如果您想独立操作，真正学习如何编辑配置文件，那么 Slackware 是您的选择。网站 [http://www.linux.org](http://www.linux.org)
    列出了所有可用的发行版。


    最终，最适合您的发行版由您自己决定。


    # 100个 Linux 技巧与窍门


    # 技巧 2：如何以低成本获取 Linux CD-ROM


    Linux 市场从最初只能从 FTP 服务器获取的少数几个发行版，发展到如今在商店和在线销售的、功能齐全的商业发行版，后者还包括印刷手册和电话支持。


    以下是您在寻找 Linux 发行版时的主要选择：


    - 您可以从其 FTP 服务器下载任何 Linux 发行版。举几个例子，RedHat 可以从 [ftp://ftp.redhat.com](ftp://ftp.redhat.com)
    下载，Slackware 可以从 [ftp://ftp.cdrom.com](ftp://ftp.cdrom.com) 下载，Debian 可以从 [ftp://ftp.debian.org](ftp://ftp.debian.org)
    下载。这种方式是免费的，但要求您拥有较快的互联网连接。通过 56Kbps 调制解调器下载完整的 Linux 发行版将耗费您相当多的时间。


    - 另一种方式是购买完整的发行版。例如，RedHat 在线购买大约需要 50 美元，包括包装盒、CD-ROM、引导软盘、手册以及 RedHat 提供的支持。


    - 最后一种方式是只购买 CD-ROM。有一些地方以 2 美元的价格出售各种发行版的 CD-ROM，其中之一是 [http://www.cheapbytes.com](http://www.cheapbytes.com)。您只会获得
    CD-ROM，但如果您能够接受没有印刷手册或免费支持的事实，那么这已经足够用于安装 Linux。您可以在 CD-ROM 上找到手册和其他文档。


    # 100个 Linux 技巧与窍门


    # 技巧 3：多操作系统共存


    计算机只需要一个操作系统即可工作。但如果您只是想试用一个新系统，难道必须放弃旧的并擦除硬盘吗？不需要，您可以在计算机上安装任意数量的操作系统。


    Linux 需要 2 个分区才能工作。分区是硬盘的各个部分。当您安装 Linux 时，它会提供一个名为 fdisk 或 disk druid 的程序，允许您创建所需的分区。人们遇到的主要问题是：没有空分区可供
    Linux 使用，并且不想擦除现有的 Windows 或 DOS 分区。诀窍是调整现有分区的大小以创建空闲空间，这样您就能够创建 Linux 所需分区以正确安装。


    fdisk 不允许您调整分区大小。在使用 fdisk 创建 Linux 分区之前，您需要使用其他程序来完成此操作。一个非常流行的商业产品是来自 [http://www.powerquest.com](http://www.powerquest.com)
    的 Partition Magic。


    让我们一步步了解调整现有分区大小以便为 Linux 创建新分区所需的步骤：


    - 购买 Partition Magic，或获取任何其他能够安全调整分区大小的工具。


    - 确保您的主分区至少有 150 兆的可用空间——这是 Linux 所需的空间。


    - 调整分区大小，使您在任何现有分区之外至少有 150 兆的可用空间。


    - 重新启动并启动 Linux 安装程序。


    - 运行 fdisk 或 Linux 发行版自带的任何分区程序，按照安装说明创建所需的 Linux 分区。

