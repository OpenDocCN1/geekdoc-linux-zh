    \n## 技巧 18：找不到共享库\n\n二进制文件需要在运行时加载共享库。它们是你系统中为程序提供功能的文件。有时程序会报告找不到共享库，然后就会中止。\n\
    \n要查找程序需要哪些库，你可以使用 ldd 程序。它会列出所有那些库以及缺失的库。如果你知道某个库已经安装，可能需要将它添加到当前的库路径中。用于查找共享库的路径在\
    \ /etc/ld.so.conf 中。你可以修改该文件并添加任何你想要的路径，然后以 root 身份运行 ldconfig 程序。\n\n## 技巧 19：难以删除的文件\n\
    \nLinux 中的文件名可以包含许多字母和数字。通常，名称中不应该有空格，尽管 Linux 可以处理它们。有些字符不应该用于文件名，如 \"/\" 和 \"\
    ~\"。\n\n遗憾的是，有些程序会创建看起来奇怪的文件名，通常是作为临时文件。使用 rm 命令，你应该能够删除它们，但当使用奇怪的字母数字字符时可能会比较困难。以下是一些你应该尝试的删除奇怪文件名文件的方法：\n\
    \n- 首先你应该尝试以下方法：\n\n```\nrm -f \"file name\"\n```\n\n- 如果这不起作用，你应该尝试控制台程序 mc。\n\
    \n- 使用图形化文件管理器，你应该能够选中图标并删除它，无论文件名是什么。\n\n## 技巧 20： righteous  权限\n\n当你尝试运行一个文件时，它可能会拒绝工作并显示类似\
    \ \"Permission denied\"（权限被拒绝）的错误，而当你尝试查看另一个文件时，它也可能说你没有权限查看它。这些都归结为文件权限，这是 Unix\
    \ 的一项基本功能。\n\n有 3 种权限类型：读取、写入和执行。当你列出文件时，它会显示文件具有哪些权限：\n\n```\nls -l file.dat\n\
    -rw-r--r--  1 root    users      1656 Mar 22 00:27 file.dat\n```\n\n该行的第一部分是权限。它们依次是用户权限、组权限和其他人权限，其中\
    \ r 表示读取，w 表示写入，x 表示执行。对于这个文件，用户 root 具有读取和写入权限（rw-），组 users 只能读取文件（r--），其他所有人也只能读取文件（r--）。\n\
    \n可能会出现其他字母。第一个字母对于普通文件是 -，对于目录是 d，对于设备是 c 或 b。在 x 的位置你可能会看到字母 s。这意味着当你启动程序时，它将以所有者的身份运行。\n\
    \n## 技巧 21：更改文件权限\n\n要更改文件的权限，你需要使用一个名为 chmod 的程序。使用该命令，你可以更改一个或多个文件的权限。以下是一些示例：\n\
    \n```\n$ chmod 755 file\n$ ls -l file\n-rwxr-xr-x  1 root    users       1656\
    \ Mar 22 00:27 file\n$ chmod 700 file\n$ ls -l file\n-rwx------  1 root    users\
    \       1656 Mar 22 00:27 file\n$ chmod 664 file\n$ ls -l file\n-rw-rw-r--  1\
    \ root    users       1656 Mar 22 00:27 file\n```\n\n这些数字基于 3 种权限类型。读取 = 4，写入\
    \ = 2，执行 = 1。权限 755 意味着用户将具有读取、写入和执行权限（4 + 2 + 1 = 7），而其他所有人将具有读取和执行权限（4 + 1 =\
    \ 5）。\n"
