  md: '# Tip 9: Accessing remote file systems


    SMB is the most popular protocol to access Windows systems. But from the Unix
    world comes NFS. NFS is a way to share files that predates SMB and Samba, and
    comes compiled in most Linux distributions. To enable file sharing, you must have
    the nfsd and mountd daemons running. You also need to add the IPs of the systems
    you want to allow in /etc/exports.


    To access remote file systems, you simply mount them like local hard drives. To
    mount /usr/files from 1.2.3.4 into /mnt/files, simply type:


    ```

    mount -tnfs 1.2.3.4:/usr/files /mnt/files

    ```


    The -tnfs parameter may be omited.'
