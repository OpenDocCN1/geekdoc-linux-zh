  md: '# Chapter 3 The Installation


    41


    # End session for mgagne


    ![](img/6227ceb576e6091f42ed74eec527c9b4_62_0.png)


    FIGURE 3-4 Logoff screen.


    Shell Out You can also log out from the command line, but it must be done from
    the root login. From a terminal window, switch to root with "su - root" (you''ll
    be prompted for the password), and type the following:


    ```

    shutdown -h now

    ```


    When shutdown is called with the -h option, it is another way of saying, "Shut
    the system down and keep it down." On some systems (and with proper hardware),
    this option will power off the system after it is down. Another option is to type
    the following:


    ```

    shutdown -r now

    ```


    The -r option tells Linux to reboot immediately after a shutdown. A reboot option
    is usually used after kernel rebuild.'
