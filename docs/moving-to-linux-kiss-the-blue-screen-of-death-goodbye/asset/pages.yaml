  md: '# # chapter 7

    Installing New Packages


    The average Linux distribution CD comes with several gigabytes of software. SuSE,
    for one, delivers several CDs in a boxed set with enough software to keep you
    busy for weeks, maybe months. I''ll tell you how to install that software, easily
    and without fuss. Despite all that your distribution has to offer, sooner or later
    you will find yourself visiting various Internet sites, looking for new and updated
    software. Where will you find this stuff, and will installing it be the same as
    getting it from your CDs?


    Before we get into finding, building, and installing software, I''d like to address
    a little myth. You have no doubt heard that installing software on Linux is difficult
    and that it is inferior to what you are used to in the Windows world. Nothing
    could be further from the truth. In fact, software installation under Linux is
    actually quite superior to what you are leaving behind in your old OS.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    > > Security Note When you install software packages, you must often do so as
    the root, or administrative user. As root, you are all powerful. Linux tends to
    be more secure and much safer than your old OS, but that doesn''t mean disasters
    can''t strike. Know where your software comes from and take the time to understand
    what it does. When you compile software (which I will cover later in this chapter),
    it might even be a good idea to get into the habit of building as a non-root user,
    then switching to root for the installation portion. Don''t worry—I''ll explain.


    # Linux and Security


    When it comes to installing software, security is something we should talk about.
    I''ve already said that you should know where your software is coming from, but
    that is only part of the consideration. That''s why I''m going to clear up some
    bad press Linux gets it comes to installing software.


    In the Windows world, it is frighteningly easy to infect your PC with a virus
    or a worm. All you have to do is click on an email attachment, and you could be
    in trouble. With some email packages under Windows, it does the clicking for you
    and by being so helpful, once again, you could be in trouble. You won''t find
    many Linux packages provided as simple executables (.EXE files and so on). Security
    is the reason. To install most packages, you also need root privileges. Again,
    for security reasons, Linux demands that you conscious of the fact that you might
    be doing something that could hurt your system. If an email attachment wants to
    install itself into the system, it will have to consult the root user first.


    Package managers, such as rpm (the RPM Package Manager) or Debian''s select and
    apt-get, perform checks to make sure that certain dependencies are met or that
    software doesn''t accidentally overwrite other software. Those dependency checks
    many things into consideration, such as what software already exists and how the
    new package will coexist. Many of you are probably familiar with what has been
    called DLL hell, where one piece of software just goes ahead and overwrites some
    other piece of code. It may have happened to you. Blindly installing without these
    checks can be disastrous. At best, the result can be an unstable machine—at worst,
    it is unusable.


    Installing software under Linux may take a step or two, but it is for your own
    good.'
  merge: -1
