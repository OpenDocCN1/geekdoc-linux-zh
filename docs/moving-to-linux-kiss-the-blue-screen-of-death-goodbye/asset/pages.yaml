    # Look, Use the Source ...


    Once you''ve downloaded new software, you won''t be anxious to take things out
    for a spin. The truth is that there is an amazing amount of software available
    for Linux. If trying out new things is exciting for you, I can predict very much
    that you won''t get bored anytime soon.


    Much of this software is available as source—not surprising because the GPL license
    (which much of the Linux software out is distributed) requires that you distribute
    source along with the programs. There are also open source projects that have
    no relation to the GNU projects that employ the license as a means of copyright.
    Then there are other open source projects that use BSD-style licensing, artistic
    licensing, postcard licensing, and many others; all distribute their programs
    in source format.


    At first glance, this may appear to be nothing but a nuisance, yet source makes
    software portable. The number of platforms on which a single package can be compiled
    to be much higher because the applications can be built using your system at your
    operating system level with your libraries. It means that if you are running VendorX8.1,
    you don''t need to go looking for the VendorX8.1 package.


    Here''s another reason. It takes developers time to provide packages compiled
    and ready to run on multiple platforms—time they may not have'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Chapter 7 Installing New Packages


    packages they offer. Why? Because they haven''t found the time to build the packages
    for all these platforms. Here''s a plus side you may not have considered: If at
    some point you decide that you want to try your hand at programming, open source
    means that you too can get into the game.


    > > *Note:* As crazy as it may sound, building from source is not all that complicated,
    and many of the steps required are across most source distributions. At first
    it may sound difficult, but by no more than any of the myriad things you''ve learned
    how to do with your computer over the years. I admit that compiling from source
    isn''t as straightforward as downloading an RPM package and installing it, but
    it does open up thousands of possibilities.


    Here''s an added bonus—if you can build one software package, you can pretty much
    build them all.


    # The Extract and Build Five-Step


    The vast majority of source packages can be built using what I call the extract
    and build five-step. I suppose step one could also involve the downloading of
    the software, but I''ll pretend you''ve already found and downloaded something,
    a hypothetical little package ftl-travel, and you are now anxious to take it for
    a ride. I''ll give you the five steps, then I will discuss them in more detail.


    ```

    tar -xzvf ftl-travel-2.1.tar.gz

    cd ftl-travel-2.1

    ./configure

    make

    su c "make install"

    ```


    Easy, isn''t it? Now you can just type ftl-travel and be on your way. Now that
    you''ve seen a source package installation, let me give you some details.'
  merge: -1
