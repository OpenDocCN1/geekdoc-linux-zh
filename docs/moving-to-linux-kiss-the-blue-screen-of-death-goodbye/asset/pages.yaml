    Paul Clifford, by Edward George Bulwer-Lytton


    It was a dark and stormy night; the rain fell in torrents—except at occasional
    intervals, when it was checked by a violent gust of wind which swept up the streets
    (for it is in London that our scene lies), rattling along the house-tops, and
    fiercely agitating the scanty flame of the lamps that struggled against the darkness.
    Through one of the obscurest quarters of London, and among haunts little loved
    by the gentlemen of the police, a man, evidently of the lowest orders, was wending
    his solitary way. He stopped twice or thrice at different shops and houses of
    a description correspondent with the appearance of the quartier in which they
    were situated—and inquired for some article or another which did not seem easily
    to be met with. All the answers he received were couched in the negative; and
    as he turned from each door he muttered to himself, in no very elegant phraseology,
    his disappointment and discontent.


    Okay, you can stop there. Isn''t that wonderful stuff? If you feel the need to
