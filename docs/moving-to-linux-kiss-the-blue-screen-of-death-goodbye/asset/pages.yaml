  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # Toolbars of Every Kind . . .


    Now that you are feeling comfortable with your new word processor, let''s take
    a quick tour of the various toolbars, icons, and menus in Writer.


    The icon bar directly below the menu bar is called the Function bar, and it contains
    icons for opening and creating documents, cutting and pasting, printing, and others.
    The Function bar is common to all the OpenOffice.org applications (Writer, Calc,
    Imp., etc.). On the left side of Function bar is a combo box, a blank field where
    you can directly enter the path to a document you want to edit.


    Below the Function bar is the Object bar. It provides common editing options,
    such as font selection, bolding, italics, centering, and so on. Select words or
    phrases in your document with the mouse (hold, click, and drag across the desired
    text), then click B for bold or I for italics. This bar will change from application
    to application, depending on what type of formatting is most needed.


    At the bottom of the editing screen is the Status bar. What''ll you see there
    the current page number, current template, zoom percentage, insert (overwrite)
    mode, selection mode, hyperlink link, and the current status of the document (if
    the document has been modified and not saved, an asterisk will appear).


    Finally, off to the left is another icon bar. This one is called the Main toolbar,
    and it provides a quick method of inserting objects into the document, doing a
    search and replace, or running a spell check. Pause over each of the icons with
    your mouse cursor, and a tooltip will appear, describing the functions of the
    individual icons.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_213_0.png)


    Quick Tip Before we move on, let me tell you about a strange behavior you will
    encounter. After using OpenOffice.org a few times, you''ll eventually get a pop-up
    asking you to register your software. This is completely voluntary, and you do
    not need to do that. If you do register, you can contribute by letting the OpenOffice.org
    team know about bugs, features you''d like, and so on. Unless you request a future
    reminder, this is the last time you will see this screen.


    # Help!


    Under the Help heading on the menu bar, you''ll find plenty of information. By
    default, tooltips are activated so when you pause your mouse cursor over an item,
    a small tooltip will be shown. Click Help, and you''ll see Tips checked'
  merge: -1
