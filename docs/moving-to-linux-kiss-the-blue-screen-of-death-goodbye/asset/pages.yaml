  md: '# Chapter 10 Electronic Mail


    # Send Now or Later


    People who are not online the time may find it makes more sense to queue messages,
    rather than to send them immediately. When the time is more convenient (or you
    are online), you can send all queued messages. To do this, write your message
    as always. When you are ready, click Message on the menu bar and select Queue;
    the messages will be transferred to your outbox folder. You can also click the
    icon directly to the right of Kmail''s Send icon (on the default KDE theme, it
    looks like a stack of pages). To actually send the messages, dial up to your ISP,
    click File on the menu bar, and select Queued. Note that this menu option will
    be grayed out if there are no messages in your outbox.


    Convenient timing affects more than just when you are online; it also affects
    when you can finish an email message you happen to be working on. Let''s say that
    you are composing a long message to Aunt Sybil, who lives in Australia. After
    about an hour of typing, you realize that you are supposed to be at your brother''s
    wedding. Looking at your watch, you note that you only have 10 minutes to get
    to the wedding, and Aunt Sybil''s email will certainly take another hour. Because
    you''ve already done all this for work and do not want to risk losing it, consider
    saving your email in drafts folder.


    From the composer window, click Message on the menu bar and select Save in Drafts
    Folder. When you are ready to resume your email (after the wedding, of course),
    click on the drafts folder and double-click on your email in process.


    # Evolution


    What''s hard for some people moving to Linux is saying goodbye to certain familiar
    applications. One of the most used email packages in the Windows world is Outlook
    and its cousin, Outlook Express. Those users will feel at home on their new Linux
    desktops when they fire up Evolution. A look at Figure 10–11 does not seem extremely
    familiar. In fact, Evolution looks and feels like Outlook but with some very important
    improvements.


    Once again, it is likely that you will find Evolution on your distribution C.D.
    Another way to get a copy is to head over to http://www.ximian.com, the site of
    the Evolution authors.


    Upon starting Evolution for the first time, you will be presented with the various
    preparatory steps. After clicking Next through the introductory window, you will
    be asked for your default identity. This is where you enter your full name and
    email address, along with other options, such as a default signature (Figure 10–11).'
