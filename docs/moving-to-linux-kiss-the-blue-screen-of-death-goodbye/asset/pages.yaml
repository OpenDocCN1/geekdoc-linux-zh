    select a file or directory, right-click, and select Move to trash. Notice that
    there is another option on the menu labeled simply Delete. If you are absolutely
    sure that you don''t want this file hanging around (even in the trash bin), Delete
    from the menu or press <Shift+Delete>. The file will be gone for good.


    > Note To really and truly delete something, shred it. You do this by selecting
    a file and pressing <Ctrl+Shift+Delete>. This writes random bits of garbage over
