  md: '# Chapter 1 Introduction


    # Want to Try Linux Right Now?


    Loading Knoppix is easy.


    Take your CD and insert it into your CD-ROM drive. Shut down Windows, and Restart.
    Make sure your PC is set to boot from the CD. Knoppix boots up to a nice, graphical
    screen with a simple boot: prompt, from which you can simply press <Enter> and
    let Knoppix do the rest; this is an amazingly simple install.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_32_0.png)


    +   Quick Tip Many systems are set to boot directly from the CDROM drive if a
    bootable CD is found. If your system does not, you may have to change the BIOS
    settings on your PC to allow this. This is generally done by pressing <Delete>
    or <F2> to enter Setup as the system (you will usually see such a message before
    the operating system starts to load). Because menus vary, it is impossible for
    me to cover them all, but look for a menu option that specifies the boot order.
    You''ll see something like A; first, C: (i.e., your floppy drive, then the hard
    disk). Change the boot order so that it looks to the CD, save your changes, and
    restart your system.


    The boot process is all text, but it is certainly colorful because Knoppix identifies
    devices, disks, sound cards, and so on in different colors. At some point, the
    screen will go dark as your video card is configured and X, the Linux graphical
    interface is, started. If the system doesn''t respond instantly, don''t panic.
    Give it a few seconds. If nothing has happened even after you''ve waited a while,
    it is possible that your video card is one of the rares not included in the distribution.
    Never fear, most (if not all) modern cards support VESA. Reboot and type the following
    at the boot prompt.


    ```

    knoppix module=vesa

    ```


    Once the system has booted, you can start playing with Knoppix. You can speed
    up a bit right off the bat by letting Knoppix create a swap file in your Windows
    partition. This won''t hurt anything on your system. All it does allow Linux to
    use some of your disk space as though it were real memory. That is what we mean
    by swap space. Doing this is easy. Click on KDE''s program launcher (the big K
    in the lower-hand corner), and move your cursor up to the KNOPPIX entry in the
    menu. There are four submenus; one of them is Configure; under that menu, you''ll
    see an entry labeled SWAP file'
