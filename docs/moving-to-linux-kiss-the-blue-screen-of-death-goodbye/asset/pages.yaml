    # Ximians Red Carpet


    One of the great strengths of Ximian Red Carpet is the broad range of distributions
    it supports (Debian, Mandrake, Red Hat, SuSE, and others). Furthermore, the interface
    is consistent across all of these different platforms. Get used to use Red Carpet
    on one system, and you''ll find it just as easy on any other one.


    Like the other options I''ve discussed, Red Carpet takes care of making sure that
    any dependencies necessary to install a package are met and taken care of—automatically.
    Best of all, Ximian offers this service free of charge. It also offers a premium
    service that gives you access to dedicated servers with much faster access. As
    part of its premium service, Ximian occasionally offers additional bonuses, such
    as free versions of commercial software. Whichever way you choose to go (free
    or premium service), you can get started by downloading the client appropriate
    for your system from the Ximian Red Carpet web site:


    ```

    http://www.ximian.com/products/redcarpet/

    ```


    Ximian has a number of other products, including the email and calendar package
    called Evolution (which I covered in Chapter 10). Ximian also produces its own
    version of the GNOME desktop called the Ximian desktop. When'
