  md: '# Chapter 11    Surfing the Net (Just Browsing)


    163


    # Split Views


    Remember all the things you learned when using Konqueror as a file manager? Those
    things still apply. For instance, you might remember that you could split your
    Konqueror window to provide you with multiple views. Let''s say that you wanted
    to look at two Websites simultaneously, with the top half of the browser displaying
    one site and the bottom half displaying another. Try this. Open Konqueror and
    surf to the site of your choice. Now click on Window in the menu bar and choose
    Split View (either/bottom or left/right). You should have two copies of the same
    site open in two separate views. You can close either view by clicking on Window,
    then clicking on Remove Active View.


    As you used Konqueror as a file manager, the active window will have a little
    green light on the bottom left-hand corner. Click that bar on either window to
    switch from one to the other. You can now enter a new address in the Location
    field to open a new Web site.


    # Super-Speedy Searches


    Ah, shameless alliteration... Let''s say that you wanted to search on Linux media
    players in Google. Normally, you would enter http://www.google.com, wait for the
    site to load, type through Linux media players, and click to start the search.
    With Konqueror, a number of quick search shortcuts have been defined that making
    search feel so much easier. To search Google for our media players, you could
    simply type the following in the Location field:


    ```

    ggc: Linux media players

    ```


    Konqueror automagically feeds the search terms to Google. You can do a rapid-fire
    search of the Google Usenet groups archive, as well. Pretend that you are having
    problems with an FTL3D VR card for your system.


    ```

    ggg: FTL3D VR card setup Linux

    ```


    There are other great shortcuts. For instance, typing fm: let you search the Freshmeat
    software archives, and rf: package_name will search RPMfind.net for RPMs of your
    favorite software. Here''s a list of others you may want to try:


    +   av: Use the AltaVista search engine

    hb: Search HotBot

    ly: Search Lycos

    sf: Look through SourceForge

    wi: Perform a WhatIs query'
  merge: -1
