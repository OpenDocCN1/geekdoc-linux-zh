    update!


    # Final Touches


    If you select (highlight) the title text in cell AI and click the "center" icon,
    the text position doesn''t change. That''s because AI is already filled to capacity,
    and the text is essentially already centered. To get the effect you want, click
    on cell AI, hold the mouse button down, and drag to select all the cells up to
    F1. Now click Format on the menu bar and select Merge Cells, then click Define.
    All cells will merge into one, after which you can select the text and center
    it.


    For more extensive formatting of cells, including borders, color, and so on, right-click
    on the cell, and select Format. (Try this with your title cell.) A Cell Attribute
    window (as in Figure 14–10) will appear, from which you can add a variety of formatting
    effects.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_233_0.png)


    Figure 14–10 Adding borders and fill to cell.'
