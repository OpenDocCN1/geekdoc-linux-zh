  md: '# Chapter 14 Spreadsheets (Tables You Can Count)


    The next window (Figure 14–8) lets you choose from chart types (bar, pie, etc.)
    and provides a preview window to the left. That way, you can try the various chart
    options to see what best shows off your data. If you want to see the labels in
