  md: '# Chapter 13 Word Processors


    OpenOffice.org Writer starts up with a blank page, ready for you to release inner
    creative genius. At the top of the screen, you''ll find a menu bar where commands
    are organized based on their categories, including the friendly-sounding Help
    submenu (more on that shortly).


    You should also see a selection box on the screen for Paragraph Styles (see Figure
    13-1). This lets you quickly access and apply styles as headings, text boxes,
    and so on to your paragraphs. The Stylist floats above your document at all times
    for rapid access. I''ll tell you more about the Stylist later. For now, click
    the x in the corner to close it. You can always turn it on at a later time by
    pressing <F11> or clicking Format on the menu bar and selecting Stylist.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_208_0.png)


    Figure 13-1 OpenOffice.org Writer on startup.


    # Write Now!


    At this point, Writer is open, the Stylist is gone, and you are looking at a blank
    screen. Let''s write something. As any writer will tell you, nothing is more intimidating
    than a blank page. Because I opened this chapter with a reference to the famous
    phrase, It was a dark and stormy night, why don''t we continue along that theme?
    That phrase is often example of bad writing, but the phrase in itself is only
    so bad. The paragraph that follows is even worse. Type this into your blank Writer
    page, as shown in Figure 13–2.'
