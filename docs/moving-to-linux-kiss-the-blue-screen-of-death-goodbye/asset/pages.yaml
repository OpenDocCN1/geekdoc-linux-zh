  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # Starting and Stopping Linux


    This sounds like such a simple thing that you might wonder why I am spending any
    time on it at all. After all, you turn on the power switch, switch back, and watch
    Linux come to life. Depending on the installation, you may have more than one
    boot option. The default will almost certainly be to take you into Linux. If you
    opted for a dual-boot system, you may have to select Linux from the boot menu.


    The lesson here is simply this: because you do have options, take the time to
    read with the menu.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_61_0.png)


    > Warning All right. Here is rule number one when it comes to shutting down your
    system. Never, ever simply power off the system. You must do a proper shutdown.
    Oh, and get an uninterruptible power supply (UPS) so that your system doesn''t
    shut down accidentally. You do not need a UPS to run Linux. However, if you don''t
    want a random power fluctuation or a three-second power outage to take down your
    system, the added protection of a UPS makes sense.


    Linux is a multiuser, multiprocessing operating system. Even when it appears that
    nothing is happening, there can be a great deal going on. Your system is maintaining
    disk space, memory, and files. It is busy making notes on what is happening in
    terms of security, e-mail, errors, and so. There may be open files or jobs running.
    A sudden stop as a result of pulling the plug can damage your file systems. A
    proper shutdown is essential. In the world of your old OS, you still had to do
    a proper shutdown—Linux is no different.


    There are a few ways of shutting down your system. You start by logging off from
    your system. Make sure that you''ve closed all your applications and saved anything
    you might have been working on. Now, right-click on the desktop and select Logout
    from the popup menu. You should get something that looks similar to the screen
    shown in Figure 3-4.


    This particular screen is from a SuSE system, but the types of options will be
    similar regardless of what system you are on. At this point, select "Turn off
    computer." There''s rarely any need for a "Restart computer" in the Linux worldwhen
    you shut down, it''s usually because you intend to power off the system.'
  merge: -1
