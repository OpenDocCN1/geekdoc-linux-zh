- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    ```

    12346 pts/7      00:06:07 00

    12317 pts/5      00:00:00 bash

    12340 pts/5      00:00:00 ps

    ```


    For a bit more detail, try using the u option. This will show all processes by
    you that currently have a controlling terminal. Even if you are running as root,
    you will not see system processes in this view. If you add the a-option to that,
    you will see all the processes running on that terminal—in this case, revealing
    the subshell that did su to root.


    ```

    [root@testsys]# ps au

    USER     PID %CPU %MEM VSZ RTT STAT START TIME COMMAND

    root     12293 0.0 0.4 2196 pts/5    S    21:23 0:00 login -

    magne   12294 0.0 0.3 1732 976 pts/5    S    21:23 0:00 -bash

    magne   12316 0.0 0.3 2156 952 pts/5    S    21:23 0:00 -root

    root     12317 0.0 0.3 1736 980 pts/5    S    21:23 0:00 -bash

    root     12342 0.0 0.2 2400 768 pts/5    R    21:24 0:00 ps au

    ```


    The most common thing you will do is add an x option. This will show you all processes,
    controlled by your terminal, or as well as those of other users.


    # Killing Processes


    Sometimes a process (or program) gets hung and needs to be terminated. You can
    interrupt a foreground process (one you are running from the shell) by pressing
    <Ctrl+C>, but that does not work with background processes. The command used to
    terminate a process is called kill, as it turns out is an unfortunate name for
    a command that does more than just terminate processes. By design, kill sends
    a signal to a job (or jobs). That signal is sent as an option (after a hyphen)
    to a process ID.


    ```

    kill signal_no PID

    ```


    For instance, you can send the SIGHUP signal to process 7612 like this:


    ```

    kill -1 7612

    ```


    Signals are messages. They are usually referred numerically, as with the ever-popular
    kill signal, but there are a number of others. The ones you are most likely to
    use are 1, 9, and 15. These signals can also be referred symbolically with these
    names.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# Appendix B Take Command of Linux


    Signal I is SIGHUP. This is normally used with system processes such as xinetd
    and other daemons. With these types of processes, a SIGHUP tells the process to
    hang up, reread its configuration files, and restart. Most applications will just
    ignore this signal.


    Signal 9 is SIGKILL, an unconditional termination of the process. Some people
    I have worked over the years call this "killing with extreme prejudice." The process
    is not asked to stop, close its files, and terminate gracefully. It is simply
    killed. This should be your last-resort approach to killing a process, and it
    works 99% of the time. Only a small handful of conditions will ever ignore the
    -9 signal.


    # Forging on...


    I''m going to leave this extended Shell Section here. Given the sheer number of
    Linux commands and the incredible flexibility of the shell language, I could write
    an entire book on the subject. Who knows?


    I hope you enjoyed this foray into the nongraphical world of Linux. Furthermore,
    it has whetted up your appetite for more.


    Once you get comfortable with the shell, nothing is impossible. Meanwhile, if
    you want to learn more about the shell and what can be done with it, I will point
    you to a couple of excellent bash shell references at the Linux Documentation
    Project website. They are the Bash Prompt HOWTO, and the BASH Programming—Introduction
    HOWTO. Look for the links in the reference section, which follows.


    # References


    BASH Programming - Introduction HOWTO

    http://www.tldp.org/HOWTO/Bash-Prog-Intro-HOWTO.html


    Bash Prompt HOWTO

    http://www.tldp.org/HOWTO/Bash-Prompt-HOWTO/index.html'
