  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # What to Use?


    As to whether you use with Kmail or Evolution (or some of the other options) I''ll
    mention in a moment, this is something you will have to experiment with in order
    to decide. Personal preference is a huge factor here. I, for one, do not particularly
    enjoy integrated clients clients such as Evolution. I want my email package to
    be an email package only (for scheduling), I may decide to use another tool. Others
    can''t imagine anything other than Evolution for reasons that are exactly opposite
    to the one I mentioned. It''s your system and your choice. The best way to discover
    what you want is to try things out.


    # Other Options


    In this chapter, I''ve paid a lot of attention to Kmail and introduced you to
    Evolution. By no means should you look at these as your only options. If you are
    used to working with Netscape (or Mozilla) mail in the Windows world, these very
    options are available with Linux, and they work exactly the same.


    Graphical clients aren''t the only things available, either. Some people find
    that they prefer to work with text-only clients. After all, email is primarily
    about writing and reading words, and less about attached files. The average Linux
    distribution installs a handful of very nice, text-only email clients. Notable
    among these are mutt (http://www.mutt.org) and pine (http://www.washington.edu/pine/).
    In both cases, check your distribution CDs before you download.


    As you might have noticed, I mentioned Netscape and Mozilla. On that note, it''s
    time to turn the page. In the next chapter, we''ll look at what is probably today''s
    most popular Internet application, the Web browser.


    # Resources


    Kmail Homepage


    http://kmail.kde.org


    Ximian Evolution


    http://www.ximian.com/products/evolution'
  merge: -1
