- img_proc: true
  md: '# Chapter 8 Working with Devices


    Among the common Winmodems out there are those based on the Conexant chipset;
    these are starting to be very well supported. For the latest driver, just head
    over to Marc Boucher''s page at http://www.mbsi.ca/cnxlindvr/. Not only can you
    get source drivers, but precompiled packages are available for a number of popular
    Linux distributions.


    Identifying the Winmod is your first step. You can use the KDE Control Center
    to get a listing of your PCI hardware, where you will get a lot of detail. You
    can also shell out and use the lspci command for a quick list of all the PCI devices
    found on your system. Here''s what it looks like.


    ```

    $ lspci

    00:00. Host bridge: VIA Technologies, Inc. VT8367 [KT266]

    00:01. PCI bridge: VIA Technologies, Inc. VT8367 [KT266 IGP]

    00:06. Communication controller: Conexant HSF 56k

    Data/Fax/Voice/Spak (w/Handset) Modem (WorldSmartDAA) (rev 01)

    00:08. Ethernet controller: Realtek Semiconductor Co., Ltd. RTL-8139/8139c (rev
    10)

    00:11.0 ISA bridge: VIA Technologies, Inc. VT8233 PCI to ISA Bridge

    00:11.1 IDE interface: VIA Technologies, Inc. Bus Master IDE (rev 06)

    00:11.2 USB Controller: VIA Technologies, Inc. USB (rev 18)

    01:11.5 Multimedia audio controller: VIA Technologies, Inc. VT8233 AC97

    01:00.0 VGA compatible controller: nVidia Corporation NV11 [GeForce2 MX DDR] (rev
    b2)

    ```


    In some cases, you will find precompiled driver packages. These are the RPMs,
    as we discussed earlier. Some are specific to your release, and others will be
    generic. In the case of my Conexant-based Winmodem, I downloaded the RPM package
    and installed it.


    As per the instructions that followed the RPM install, I typed the following command:


    ```

    /usr/sbin/hshfconfig

    ```


    A short dialog, asking me for the country (Canada, in my case), after which the
    program compiled and installed my driver for it. Even linked the newly created
    device, /dev/ttySHSF0, to /dev/modem. I was ready to use my modem without a care.'
  merge: -1
