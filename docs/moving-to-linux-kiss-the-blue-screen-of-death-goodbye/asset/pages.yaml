    # Printing Your Presentation


    As with the other OpenOffice.org applications, click File on the menu bar and
    select Print from the menu (you can also click the small printer icon in the function
    bar). The standard OpenOffice.org print dialog will appear from which you can
    select your printer of choice.


    # Instant Web Presentations


