- img_proc: true
  md: '# Chapter 1 Introduction


    people around the world, delegated to them, worked with them, and asked for accepted
    feedback in a next generation of the model that began with the GNU project.


    GNU, by the way, is a recursive acronym that stands for "GNU''s Not UNIX," a project
    of the Free Software Foundation. This project was started in 1984 with the intention
    of creating a free, UNIX-like operating system. Over the years, many GNU tools
    were written and widely used by many commercial UNIX vendors and, of course, system
    administrators trying to get a job done. The appearance of Linus Torvalds'' Linux
    kernel has made the GNU dream of a completely free, UNIX-like operating system
    a reality at last.


    # Is Linux Really FREE?


    In a discussion of what free means in relation to software, you''ll often see
    the expressions "free as in speech" and "free as in beer." Free, in this case,
    isn''t a question of cost, although you can get a free copy (as in free) of Linux
    and install it on your system without breaking any rules. As Robert A. Heinlein
    would have said, "There ain''t no such thing as a free lunch." A free download
    will still cost you connection time on the Internet, disk space, time to burn
    the CDs, and so on.


    Walk into a computer software store and you''ll see copies of Mandrake, SuSE,
    and Red Hat on the shelves, this free software can also cost you money. On the
    other hand, those boxed sets come with documentation, support, and CDs, the latter
    saving you time and energy downloading and discs. Furthermore, there are boxed
    sets of varying prices, even within a distribution. For instance, you can buy
    a Red Hat personal or professional edition. The differences may be additional
    software, documentation, or support.


    Linux is distributed under the GNU General Public License (GPL), which, in essence,
    says that anyone may copy, distribute, and sell the program, as long as changes
    to the source are reintroduced to the community and the terms of the license remain
    unaltered. Free means that you are free to take Linux, modify it, and create your
    own version. Free means that you are not at the mercy of a single vendor who forces
    you into a kind of corporate servitude by making sure that it is extremely costly
    to convert to another environment. If you are unhappy with your Linux vendor or
    the support you are getting, you can move to the next vendor without forfeiting
    your investment in Linux.


    In other words, "free as in speech"—or freedom.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# The GPL


    The GNU GPL permits a distributor to "charge a fee for the physical act of transferring
    a copy, and you may at your option offer warranty protection in exchange for a
    fee." This is further qualified by the statement that the distributor must release
    "for a charge no more than your cost of physically performing source distribution,
    a complete machine-readable copy of the corresponding source code." In other words,
    the GPL ensures that programs like Linux will be free of charge. At worst, you
    may be asked to pay for the cost of a copy.


    You should take some time to read the GNU GPL. For your convenience, I''ve reprinted
    it in Appendix A of this book.


    # So What Do I Gain?


    No operating system is perfect, and nothing comes without some hassles, but as
    time goes on, Linux is getting closer and closer to perfection. These days, Linux
    is even easier to install than your old operating system, and you don''t have
    to reboot time and again as you load driver disk after driver disk. I won''t bore
    you with everything I consider an advantage but I will give you a few of the more
    important points.


    # Security


    Say goodbye to your virus checker and stop worrying. Although Linux is not 100%
    immune to viruses, it comes pretty close. In fact, date, so-called Linux viruses
    do not exist in the wild (only under tightly controlled environments in proof-of-concept
    labs). It isn''t that no one has tried, but the design behind Linux means that
    it is built with security in mind. Consequently, viruses are virtually nonexistent
    in the Linux world, and security issues are dealt with quickly and efficiently
    by the Linux community. Security flaws are well advertised. It isn''t unusual
    for a security hole to be discovered and a fix created within a few short hours
    of the discovery. If something does present a risk, you won''t have to wait for
    the next release of your operating system to come along.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Stability


    The stability of Linux is almost legendary. Living in a world where people are
    used to rebooting their PCs one or more times a day, Linux users talk about running
    weeks and sometimes months without a reboot. "Illegal operations" and the "Blue
    Screen of Death" are not part of the Linux experience. Sure, programs occasionally
    crash here as well, but they don''t generally take down your whole system with
    them.


    # Power


    Linux is a multitasking, multiuser operating system. In this book, I concentrate
    on the desktop features of Linux, but under the hood, Linux is a system to provide
    all the power and flexibility of an enterprise-class server. Linux-powered Web
    servers and electronic mail gateways move information along the Internet and run
    small to large businesses. Under the friendly face of your graphical desktop,
    that power is still there.


    # Money


    It is possible to do everything you need on a computer without spending any money
    on software—that means new software and upgrades alike. In fact, free software
    for Linux is almost an embarrassment of riches. In Chapter 7, I''ll show you how
    to install (or remove) additional software on your Linux system.


    # Freedom from Legal Hassles


    When you run Linux, you don''t have to worry about whether you''ve kept a copy
    of your operating system license. The GNU GPL, which I mentioned earlier, means
    you are legally entitled to copy and can legally redistribute your Linux CDs if
    you wish.


    Keep in mind, however, although Linux itself can be freely distributed, not all
    software that runs on Linux is covered by the same license. If you buy or download
    software for your system, you should pay attention to the license that covers
    that software.


    # What Do I Lose?


    Nothing ever seems to be perfect. By moving to Linux you gain a great deal, but
    I would be doing a disservice if I did not mention the disadvantages.'
