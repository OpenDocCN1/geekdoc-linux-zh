  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # # Files, Directories, and the Root of All Things


    There''s a saying in the Linux world that "everything is a file" (a comment attributed
    to Ken Thompson, the developer of UNIX). That includes directories. Directories
    are just files with files inside them. All these files and directories are organized
    into a hierarchical file system, starting from the root directory and branching
    out.


    Folders and directories are the same thing, but I will be calling them directories.
    If you are more comfortable thinking of them as folders, don''t worry. Depending
    on the application, you''ll see both terms used.


    The root directory (referred to as slash, or /) is actually aptly named. If you
    consider your file system as a tree''s root spreading out below the surface, you
    can start to get an idea of what things look like.


    Under the root directory, you''ll find folders usr, bin, etc, tmp, and so on.
    Open up Konqueror by clicking on the icon in your taskbar that has a house in
    front of a folder. This brings up Konqueror in file manager mode (remember that
    Konqueror is also a Web browser). If your navigation panel isn''t up (Konqueror''s
    left side panel), press FN to open it (Figure 5-1). To either the right or left
    of the navigation panel (this is all configurable, remember), you''ll see a set
    of tabs. Click on the root directory table, the one that looks like a small folder.
    Here''s a hint: If you move your mouse over the tabs and pause, a tooltip will
    pop up to let you know you are in the right place. When the file system appears
    (over on the left side), click on the top folder, Root Directory, look at the
    names of those folders.


    One of the directories under the root is called home and inside that directory,
    you for each login name on your system. These are the individual home directories
    and it is where you''ll find your personal files and directories. If you want
    to store personal documents, music files, or pictures, this is the place. Once
    in Konqueror, you can jump to your home directory by clicking the house icon or
    Go on the menu bar and selecting Home URL. This is $HOME.'
  merge: -1
