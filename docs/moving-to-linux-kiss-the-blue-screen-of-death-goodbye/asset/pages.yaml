  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # Saving Your Work


    Now that you have created a document (Figure 13–2), it is time to save it. Click
    File on the menu bar and select Save (or Save As). When the Save As window appears
    (Figure 13–4), select a folder, type in a file name, and click Save. When you
    save, you can also specify the File type to be OpenOffice.org''s default for mart
    (.sxw), RTF straight text, or Microsoft Word format.


    If you want to create a new directory under your home directory, you can do it
    here as well. Click the icon that looks like a folder with a star beside it (near
    the right-hand corner), then enter your new directory name in the Create folder
    pop-up window.


    Should you decide to close OpenOffice.org Writer at this point, you can always
    return to your document at a later time by clicking File on the menu bar and selecting
    Open. The Open file dialog will appear, and you can browse your directories to
    select the file you want. You can specify a file type via a fairly substantial
    drop-down list of available formats. This gives you a chance to narrow the search
    to include only text documents, spreadsheets, or presentations. You can also specify
    a particular document extension (i.e., only *.doc files) or a particular pattern.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_211_0.png)


    Figure 13–4 It is always good to save your work.'
