    # Scanning under KDE-Kooka


    A number of scanning programs exist for Linux, and most are front ends to a package
    called SANE (Scanner Access Now Easy). One such front end is included with your
    Linux system. Kooka, part of KDE, is one such program.


    Kooka is both a scanner and optical character recognition (OCR) program. What
    this means is that you can use it to scan a document of text and export that text
    back into a word processing package of some sort for further editing.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Chapter 16 Graphics and Art (Just Call Me Leonardo)


    You''ll find Kooka under the main Multimedia or Graphics menu but you can also
    start the program from the shell or with your quicklauncher <Alt+F2>. The actual
    program name is kooka. When you start the program, you will see a dialog box similar
    to that in Figure 16–4. Kooka looks for available scanners and offers you a choice.
    If you have only one scanner on your system (as is usually the case), check the
    box labeled Do not ask on startup again, always use this device before clicking
    OK.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_258_0.png)


    **Figure 16–4** Kooka autodetects your connected scanner.


    Once past this point, Kooka''s main window will appear (Figure 16–5). It consists
    of three areas, or frames: two horizontal frames at the left consisting of a navigation
    window up top and a Scanner Setting window at the bottom. The large right-hand
    side is the scan window itself. Along the top, you''ll see a familiar-looking
    menu and icon bar. You can resize the main window to suit your tastes (and monitor
    size), as well as the individual frames.


    Let''s start by having a look at the navigation window. There are two tabs here,
    one labeled Gallery and the other Preview. Ignore the Preview tab for now and
    click on the Gallery tab. Now look directly beneath those tabs see a directory
    and file browser with a default directory called Kooka Gallery. You can create
    additional folders below this by right-clicking on the directory and selecting
    Create directory. With all such dialogs, you can create directories inside of
    directories to organize your files efficiently. Scanned files will be saved in
    these directories.


    Before scanning your first image, look down at the bottom left-hand window, where
    your scanner settings are set. What you see there will vary,'
