  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    To lock the chart in place, click anywhere else on the worksheet. You may want
    to change the chart''s title, as well—double-click on the title, then make your
    changes. I''m going to call mine Sales Over 5 Years. If the chart is in the wrong
    place, click on it, then drag it to where you want it to be. If it is too big,
