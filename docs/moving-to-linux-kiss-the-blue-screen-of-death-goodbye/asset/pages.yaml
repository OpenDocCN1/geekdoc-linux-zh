  md: '# Chapter 14 Spreadsheets (Tables You Can Count)


    # Magical Totals


    Let''s start with a quick and easy total of each column.


    If you used the same layout as I did, you should have a 1998 column that ends
    at B9. Click on cell B11. Now look at the icon in the middle of the sheet area
    and the input line on the Formula bar. It looks like the Greek letter Epsilon.
    Hold your mouse over it, and you''ll see a tooltip that says Sum. Click the icon,
    and the formula to sum up the totals of that line, =SUM(B6:B10), will automatically
    appear (see Figure 14–6). All you need to do to finalize the totals is the green
    checkmark that appears next to the input line.


    Because a sum calculation is the most common function used, it is kept handy.
    You can now do the same thing for each of the other yearly columns to get your
    totals. Click on the sum, then click your beginning column and drag the mouse
    to include the cells you want. Click the green checkmark, and move on to the next
    yearly column.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_230_0.png)


    **Figure 14–6** Select a series of cells, and Calc will automatically generate
    totals for you.'
  merge: -1
