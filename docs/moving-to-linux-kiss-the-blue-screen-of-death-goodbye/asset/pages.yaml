- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # Getting Ready for Your Installation


    If your machine has Windows already, installed and you have documents, spreadsheets,
    pictures, or music files that you wish to keep, now would be a good time to back
    those up, either on diskette or burned to a CD-ROM. Even if you plan on preserving
    your Windows installation for a dual-boot system, it is always prudent to have
    a backup if if you are going to be doing major work on your hard disk. You might
    also want to take advantage of all the hard work that was done in pre-installing
    Windows and make notes on all the hardware in your machine—the type of network
    and video cards and anything you can think of. You may do that by clicking the
    Start button, selecting Settings, Control Panel, then double-clicking the System
    icon. Now walk through the hardware profiles and take some notes. Odds are you
    won''t need it at all, but you can never have too much information.


    The average Linux installation takes about 30-60 minutes, although I have seen
    it take as little as 5 minutes on a fast system. That''s a fully networkready,
    all-set-to-work every few minutes to load another driver. It doesn''t get much
    easier than this.


    That said, unless you are feeling particularly adventurous I would highly recommend
    that you read through this chapter once before actually starting.


    # Hardware Considerations


    Before we move on, let''s talk hardware. The sad truth is that not every device
    will work with Linux. You should not think of this as being strange, or somehow
    representing a weakness in Linux. After all, Linux is not unique in when it comes
    to the sheer number of devices and platforms that it supports. Linux will run
    on Intel-based systems as well as Alpha, RISC, and Macintosh. IBM''s entire line
    of computers, from small, desktop-PCs to large mainframe systems such as the S/390,
    run Linux. Then there are MIPS, SPARC, and StrongARM. You can also find Linux
    embedded in micro-crochips, running on portable MP3 players, PDAs, cell phones,
    even on digital watches. That''s incredible hardware support!


    From the perspective of your computer, it is highly unlikely that Linux won''
    install and run well. Should something be unsupported, it would probably be some
    Windows-only modems, printers, or scanners. To find out whether or not your computer
    and its associated devices will work with your installation, the first place to
    look is your Linux vendor''s Web site. Another great hardware resource is the
    Hardware HOWTO. You can find the latest version by surfing over to the LDP''s
    Linux Hardware Compatibility HOWTO page (http://www.tldp/HOWTO/Hardware-HOWTO/).'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Chapter 3 The Installation


    25


    As Linux gains in popularity, you''ll find that hardware vendors are increasingly
    interested in tapping into this ever-growing market. I''ve had the experience
    of being on site, adding hardware to a customer''s system (Ethernet cards come
    immediately to mind), and finding that the system did not have the drivers. I
    quickly visited the Ethernet card manufacturer''s Web site and found precompiled
    drivers ready and waiting for me. With the incredible growth of Linux, it won''t
    be long before these issues will be a thing of the past.


    # Dual Booting Revisited


    In the last chapter, I mentioned dual-booting, a means by which you can run both
    Linux and Windows on one machine. At boot time, a menu lets you start one or the
    other. Let''s pretend for a moment that you still want to run Windows from time
    to time. Perhaps what you want the comfort of knowing that you can go back to
    your operating system to do certain things. This is where dual-booting comes into
    play. There are a couple of ways to do this and I will get to those in a moment.
    Please note, however, that doing this will require a little more up-front work.


    One dual-boot scenario involves a completely separate disk that you can dedicate
    to a Linux installation. Although this is an ideal situation, most people will
    have a single disk with Windows already loaded. If you have a large disk, there
    is a good chance that there are already two partitions. One will be a C: drive
    and the other a D: drive. What you want to do is to erase the D: drive and use
    it for Linux. If you are going to follow this route, make sure you back up any
    documents or copy them into folders on your C: drive.


    Unfortunately, Windows is just as likely to be taking up the entire partition
    table. The trick is to shrink the Windows partition, creating some space on to
    install Linux. To do this, you must defragment your disk in Windows before going
    ahead and resizing your partitions. You can do this by clicking the Start button
    and then selecting Programs | Accessories | System Tools | Disk Defragmenter.


    Resizing the partition is your next step. Once again, there are two ways of doing
    this. Some recent distributions such as Mandrake or SuSE will automatically detect
    a Windows-only disk and shrink the partition for you. Alternatively, you can do
    this with a little DOS program called FIPS, which you can find on your Linux distribution
    CD. On Debian, check the tools directory.


    In most cases, on Red Hat or SuSE, there will probably be a directory called FIPS20
    with a number of files inside, including the FIPS.EXE program itself.'
