    be moved or renamed to preserve the originals (you will usually see appropriate
    messages if this occurs). Upgrading is more or less the same as the in-installing
    except that you use the -U flag on the command line instead of the -i flag.


    ```

    rpm -Uvh matter_transporter-1.2-1.i386.rpm

    ```


    To erase a package, use the -e flag, instead.


    ```

    rpm -e matter_transporter

    ```


    Notice that when I delete the package, I don''t add the release number extensions
    (the -2.1-1.i386.rpm type of suffix).

    A full-blown Linux installation will have a lot of packages installed. If you
    are curious, you can list every single package by typing the following command.


    ```

    rpm -qa | sort | more

    ```


    That shell command is actually three in one. The rpm -qa portion tells rpm to
    query the RPM database and list all the packages. The bar that you see is called
    the pipe symbol. It literally means to pipe the output of the first command'
