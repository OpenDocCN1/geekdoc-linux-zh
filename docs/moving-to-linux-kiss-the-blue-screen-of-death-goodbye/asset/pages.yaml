    Your Own)


    After having taken the first steps into the Linux world, you are probably thinking,
    "Hey, this is pretty easy" and "I wonder what the fuss was all about." For what
    it''s worth, I''m thinking the very same thing. Now that the fear of dealing with
    a new operating system is gone, it''s time to get really comfortable.


    In this chapter, I''m going to show you how to make your system truly your own.
    I''ll show you how to change your background, your colors, your fonts, and anything
    else you''ll need to create a desktop as individual as you are. Would you like
    some icons on your desktop? Perhaps some shortcuts to programs you use on a regular
    basis? No problem. I''ll cover all those things, too.'
