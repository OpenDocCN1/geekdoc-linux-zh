  md: '# Chapter 2 Ready...Set...Linux!


    you go down this road, you have access to all your disk space, and Linux uses
    disk space more efficiently. You can also kiss those proprietary licensing issues
    goodbye (not to mention the Blue Screen of Death).


    When you are ready to install, simply choose the option that will overwrite the
    entire system. The installation process will take care of the rest for you. It''s
    that simple.


    # Windows on Linux


    Under Linux, it is possible to run a Windows applications without having Windows
    installed at all. This is done with Wine. I''m not talking about the fermented
    beverage that some of us are quite fond of, a package that runs on Linux. Allow
    me to paraphrase from the Wine web site... Wine Is Not an Emulator. Wine is a
    compatibility layer, a set of APIs that enable Windows applications to operate
    on a Linux system running the X window system (the Linux graphical environment).


    Wine will not run every Windows application, but the number of applications is
    capable of running is increasing all the time. Some commercial vendors have ported
    certain Windows applications to Linux by making some of the code run in Wine.
    This has sped up the normal production cycle and made possible for them to get
    their programs to Linux users faster.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_40_0.png)


    > Tip When it comes to Wine (the software), younger is most definitely better.
    A well-aged Wine (the software) will not be as good as running your Windows software
    as a brand new. As for wine (the beverage), aging is certainly a good thing, but
    there are limits. As a rule, reds can age longer than whites, but it depends on
    the variety. Consult your local wine vendor or pick up a good book on the subject.


    Many Linux distributions include a version of Wine on the CDs, and some let you
    select Windows compatibility applications as part of the installation procedure.
    Keep in mind that the newer your Wine, the better. For the latest and greatest
    on Wine development, visit the Wine Web site (http://www.winehq.com/). A great
    deal of Wine development is done by CodeWeavers (http://www.codewavers.com/).
    Its version provides an installation wizard to guide you through the installation
    and configuration process for Wine. It makes the whole process extremely simple.


