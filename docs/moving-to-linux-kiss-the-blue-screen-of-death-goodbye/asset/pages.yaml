    Project (LDP).


    # The Linux Documentation Project


    The LDP is a dynamic community resource. On your Linux distribution CD, you probably
    have a collection of documents known in the Linux world as HOWOS. These are user-
    or developer-contributed documents that are maintained and updated by one or more
    individuals. You can find the latest version of these documents at the tldp site:


    ```

    http://www.tldp.org/

    ```


    The mandate of the LDP is essentially to provide a comprehensive base of documentation
    for all things Linux. If you''ve been looking high and low for information on
    installing that bleeding-edge FTL radio card on your PC and still haven''t found
    what you are looking for, try the LDP. The LDP also makes a point of offering
    the latest versions of the man pages, as well as user guides that tend to cover
    more ground than standard HOWOS.


    # Linux User Groups


    A few paragraphs back, I made passing reference to Linux User Groups, or LUGs.
    Let''s put technology aside for a moment and explore something you may have heard
    about: the Linux community. Yes, there is a Linux community. All around the world,
    you will find groups of enthusiastic Linux users gathering for regular meetings,
    chatting over beer and pizza, and sharing information. This sharing of information
    is part of what makes Linux so friendly.


    LUGs tend to run electronic mailing lists where informal exchanges of information
    take place (just as I do with my online LUG). New users are welcomed, and their
    questions are happily answered. These users range from newbies getting their feet
    wet to seasoned kernel developers. Should you find yourself stuck with nowhere
    to turn, seek your local LUG and sign on to'
