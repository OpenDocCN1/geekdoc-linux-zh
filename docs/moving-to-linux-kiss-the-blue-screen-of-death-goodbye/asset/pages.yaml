  md: "# # Say goodbye to Windows® crashes, viruses, hassles, and cost!\n\nMoving\
    \ to Linux can help you migrate from Windows to Linux in just hours! By the time\
    \ you've finished, you'll be able to do virtually anything in Linux—without the\
    \ aggravation, crashes, security risks, or high costs of running Windows!\n\n\
    This is not a book for techies! It's a book for people like you: who write documents,\
    \ create spreadsheets, surf the Web, send emails, listen to CDs, play games—and\
    \ want to simply in Linux, without becoming technical experts!\n\n+   * Convert\
    \ your Windows PC to a Linux system that does more for less—one step at a time\n\
    * Browse the Internet, send and receive email, even send instant messages using\
    \ your AOL®, MSN®, and Yahoo!® accounts\n* Connect your digital camera or scanner\
    \ and the GIMP. Linux's powerful graphics program\n* Rip music and band and play\
    \ CDs with Linux's amazing collection of easy-to-use multimedia tools\n* Discover\
    \ the world of Linux games: from solitaire to flight simulators, and beyond\n\n\
    There's more! Write, calculate, and present with OpenOffice.org, the free office\
    \ suite for Linux that can also read and write all of your existing Microsoft®\
    \ Office documents.\n\nSay goodbye to expensive software upgrades, burdensome\
    \ Microsoft licensing, Windows viruses, and \"blue screens of death.\" Say hello\
    \ to computing the way it's supposed to be—with Linux!\n\n![](img/6227ceb576e6091f42ed74eec527c9b4_371_0.png)\n\
    \n# ## About the CD-ROM\n\nIncludes special bootable Linux Knoppix CD: prove the\
