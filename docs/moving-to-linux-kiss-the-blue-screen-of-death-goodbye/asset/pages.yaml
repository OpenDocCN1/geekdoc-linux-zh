    one of the most flexible instant messaging clients around. One of these protocols
    is the open source and open protocol Jabber.


    # Why Use Jabber?


    There are several reasons aside from the two I just mentioned (open source and
    open protocol). The Jabber protocol doesn''t belong to any one in particular,
    so there is no company driving its destiny (although there are companies using
    Jabber). Jabber uses a decentralized approach, so the system is more robust. In
    fact, anyone can run a Jabber server if or she wants to. This is a boon for companies
    that may want to run a private, secure instant messaging network.


    You can create your own account name instead of having an account assigned to
    you. For these reasons and, in this little tour of plugins and account setup,
    I will show you how to create a Jabber account. On that note, let''s continue.


