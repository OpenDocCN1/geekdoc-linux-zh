    # ## RPMs, on the Shell Way


    Would you like a very fast and easy way to install RPM packages? You may find
    this hard to believe, but at times, opening up a shell and typing commands can
    be much faster than going through all those graphical steps. I''ll show you how
    it is done in this extended Shell Out session. Lets depend that you have downloaded
    some great package, and the RPM file for it is sitting in one of your directories.
    Using a hypothetical package of my invention, let''s install that package with
    command-line rpm.


    ```

    cd /directory_where/package_lives

    rpm -ivh ftl-transport-2.1-1.i386.rpm

    ```


    The only thing you need to be aware of here is that package installation needs
    to be done as the root user. The command that does all the work is called rpm.
    The flags that I am passing to tell rpm to install the package (the -i flag),
    to be verbose (the -v flag), and to print out hash marks while it does its work
    (the -h flag). Note that you do not have to use a dash before each letter option
    (-i -v -h)—you can combine them (-ivh).'
