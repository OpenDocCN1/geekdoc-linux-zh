  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # I Am Sovereign of All I Survey . . .


    As I''ve already mentioned, working in the Linux world is working in a multiuser
    world. What this means is that everyone who uses your computer can have his or
    her own unique environment. Any changes you make to your desktop while you are
    logged in as yourself will have no effect on little Sarah when she logs in to
    play her video games. If she happens to delete all the icons on her desktop or
    changes everything to a garish purple and pink, it won''t affect you, either.


    Let''s start with something simple. The first thing most people want to change
    their background. It''s sort of like moving into a new house or apartment. The
    wallpaper (or paint) that someone else chose rarely fits into your idea of décor.
    Same goes for your computer''s desktop. Let''s get you something more to your
    liking.


    # Changing the Background


    Start by right-clicking somewhere on the desktop. From the menu that appears,
    choose Configure Desktop. You''ll get a configuration card (see Figure 6-1) with
    the words “You can customize the desktop here” on (KDE 3.1 says “Change the appearance
    of the desktop” instead). On the left side of that card, there''s an item called
    Background. Click on that, and you will be able to modify your background settings.


    Over on the right side, a display shows a preview of what your new desktop will
    look like. Directly beside that, on the left, is a box that gives you the opportunity
    to change your settings for all your virtual desktops or each individually. When
    you start feeling particularly creative, you can play around creating a unique
    identity for every virtual desktop, but for now, leave the check box set for Common
    Background.


    To change the background image, you must select the Wallpaper tab. Make sure that
    the radio button Single Wallpaper is clicked. Then select an image by clicking
    on the drop-down list, Wallpaper. These are the default wallpapers, and you''ll
    find that there are a few already installed. Scroll down the list, highlighting
    titles as you go, and notice that a preview of your new wallpaper appears in the
    small monitor image. To find images other than the default directory, click Browse,
    and a Konqueror-like file manager will pop up, allowing you to navigate the disk
    in search of your personal images. When that file dialog opens, make sure you
    click on the icon directly beside the drop-down navigation bar. It turns the image
    preview on and off. You''ll definitely want it on.'
  merge: -1
