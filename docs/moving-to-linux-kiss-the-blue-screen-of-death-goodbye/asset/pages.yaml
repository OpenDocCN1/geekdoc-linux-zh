    # Okay, I''m Connected. Now What?


    Good question. For starters, you have everything the Internet has to offer. You
    can surf the Web (which I''ll cover in Chapter 11), send email (Chapter 10), and
    find and download software, music, and video. The Internet is a vast cornucopia
    of news, information, conversation, sights, sounds, and a thousand other things.
    When looking at all these things, it is easy to forget that it all comes down
    one thing—communication.


    The Internet was born of communication; email specifically was the tool that drove
    its development into the globe-spanning network that it is today. That''s why
    I''m going to devote the entire next chapter to electronic mail.


    These days, a new kind of communication has evolved—call it "mini-email." The
    one-liner. The short and sweet message. The instant message. The Net-connected
    society has grown to love those quick, always-on means of sending each other information.
    My own parents (who live in another province) send me a daily one-line weather
    report via their Jabber instant messaging client. If you are coming from the Windows
    world, there''s a good chance you already have one of these accounts, either with
    Yahoo!, AOL, MSN, or Jabber.


    What is Jabber?


    Glad you asked. The best way for me to answer is to tell you about a great instant
    messaging client that very likely came with your distribution. It is called GAIM.


