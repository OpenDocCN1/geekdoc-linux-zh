    # Go for the Big Screen


    Neats beats looking at the virtual world through a size of your monitor, but much
    as I would like to, I can''t increase the size of I can help you with the next
    best thing. When you are busy surfing the Internet and you want as much screen
    as possible, why not try Konqueror''s full-screen mode?


    At any time while you are viewing a page, you can click Window on the menu bar
    and select Full-Screen Mode. The title bar will disappear, as will K and all other
    border decorations. When the switch happens, pay attention to the icon bar (just
    below the menu bar). A new icon appears to the right of all the others. Clicking
    on that icon will return your Konqueror session to normal. You can also quickly
    toggle back and forth by pressing <Ctrl+Shift+F>.


    # Yum... Cookies


    Not that kind of cookie. Cookies are simple text files transmitted to your browser
    (or system) when you visit a Web site. The original idea before was that a server
    would give you a cookie as a marker to indicate where you had previously visited.
    Cookie might store a username and password to access a particular Web site or
    other information related to your visit, as an an online shopping cart. When next
    visit the site, the server would ask your browser whether it had served any cookies,
    and your browser would reply'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Chapter 11 Surfing the Net (Just Browsing?)


    by sending the cookies from before. In this way, the Web site would recognize
    you when next visited, and certain defaults would be set up for you. Cookies can
    be very good.


    The problem with cookies is that they can also be shared within larger domains,
    such as advertising rings. Using these shared cookies, advertisers build a profile
    of your likes and dislikes, tailoring and targeting advertising to you specifically.
    Many people object to this method of building user profiles and consider the use
    of cookies to be quite unethical, an invasion of privacy. The dilemma is to find
    a way to accept the cookies you want and reject the others. Konqueror lets you
    just do that.


    Click on Settings, then select Configure Konqueror. From the side panel, click
    on Cookies. Under the Policy tab, make sure that you have cookies enabled with
    the check box. Then, using the check box below that, select Ask for confirmation
    before accepting cookies (Figure 11–3).


    ![](img/6227ceb576e6091f42ed74eec527c9b4_186_0.png)


