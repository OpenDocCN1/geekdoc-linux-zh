  md: '# Chapter 17 Multimedia (If Music be the Food of Love...)


    **Tip** Why not use your Konqueror shortcuts to search for a package:


    ```

    rf: mplayer

    ```


    MPlayer handles tons of video formats, from avi to mpg to Windows Media Player
    to Quicktime, and just about anything you can think of. The same is true for audio
    (Ogg, MP3 and so on). MPlayer performs this magic using a series of codecs (decoder/decoders),
    little software translators that take a foreign video or audio format and let
    you enjoy it on your Linux system. To get the latest bundle of Win32 codecs, visit
    the following URL.


    ```

    http://ftp.lug.udedel/MPlayer/releases/codecs/

    ```


    You''ll find different bundles and for different video formats, but you may well
    download the full set. The packages are tarred and compressed with bzip2. Open
    up a Konsole and cd to whatever directory you downloaded your codecs bundle. Once
    there, use this command:


    ```

    tar -xjvf win32codecs.tar.bz

    ```


    This will create a subdirectly win32codecs. Switch to that directory, and (as
    root) copy all the codecs to /usr/lib/win32. If the /usr/lib/win32 directory doesn''t
    already exist, you should create it.


    ```

    cd win32codecs

    su -c "mkdir -p /usr/lib/win32"

    su -c "cp * /usr/lib/win32"

    ```


    "su -c -" before each of the commands. You might remember this from chapter 7.
    This command lets you quickly jump into root to perform the necessary steps, then
    jump back.


    Once you''ve done all this, MPlayer is ready to use. Let''s say that you have
    a movie clip called "exciting_movie.avi". To play that movie clip with MPlayer,
    you would open a shell and type the following:


    ```

    mplayer exciting_movie.avi

    ```


    To use the graphical or GUI version of the player, run the command "gm-player"
    instead.'
