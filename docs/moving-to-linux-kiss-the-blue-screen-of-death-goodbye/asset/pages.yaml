    # Modems versus Winmodems


    Way back when, in the introductory chapter, I mentioned Winmodems as one of the
    few minuses of running Linux. I recall that a Winmodem is a modem designed to
    work only with Windows. They are sometimes referred to as software or controllerless
    modems and tend to be less expensive than controller-based modems.


    If you are running a Winmodem, all is not lost. The Linux community is nothing
    but resourceful. Even when manufacturers are slow to notice Linux users, the same
    are not true the other way around. As more and more people run Linux, this becomes
    less and less of a problem. In time, hardware manufacturers may be building for
    Linux first and Windows second. In the meantime, check out the Linmodems.Org Web
    site at http://www.linmodems.org and you should be up and running shortly.


    So just how do transform a Winmodem into a Linmodem? Well, let me give you an
    example.'
