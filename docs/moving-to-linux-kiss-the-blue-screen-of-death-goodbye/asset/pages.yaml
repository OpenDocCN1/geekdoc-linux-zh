  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # A Sample FIPS Session


    > Warning When doing anything this drastic with your drives, always make a backup.
    In fact, no matter what you do with your system, always make regular backups.


    Let''s pretend that you''ve already run your defragmenter and that you have plenty
    of space on your hard drive. Start by creating a DOS/Windows boot diskette. This
    is generally done by typing the following command from the DOS/Windows command
    prompt (after inserting a blank diskette into the diskette drive).


    ```

    FORMAT A: /S

    ```


    /S tells DOS/Windows to transfer the system to the boot diskette. You will also
    want to have a second diskette handy in order to do this a second time. You''ll
    need it to back up your boot sector. I''ll explain why in a moment. Next copy
    the FIPS.EXE utility and its associated files from the CDROM drive to the first
    diskette:


    ```

    COPY D:\DOSUTILS\FIPS20\.* A:

    ```


    Remember that the path to the FIPS20 directory may vary depending on your distribution
    CD. Now, shut down Windows and boot from the FIPS diskette. When the boot completes,
    you should be at a DOS prompt. This is where the split occurs. Now, run the FIPS
    command:


    # FIPS


    FIPS will display a partition table showing how the disk space has been allocated.
    FIPS will ask which partition you want to split. Given that we are taking these
    steps, there is only one partition; that makes it easy. Enter the partition number
    and press <Enter>. As a precaution, FIPS will ask whether you want to make a copy
    of your boot sector on the remote chance that aster strikes. You probably want
    to answer Y (yes) to the question. This will require a second, pre-formatted diskette.
    Put in your second diskette and answer Y to the next question: "Do you have a
    bootable floppy disk in drive A: as described in the documentation (y/n)?" Since
    you have just inserted the diskette, press <Enter>.


    Now the fun begins. FIPS will display your partition table. Using the left and
    right cursor (arrow) keys, change the size of the partition (you''ll see the numbers'
