    ![](img/6227ceb576e6091f42ed74eec527c9b4_105_0.png)


    Semantics Technically, the taskbar is that portion of the panel that shows your
    open programs, letting you quickly click from one to the other. That said, you
    may find that people speak of the taskbar and the panel interchangeably.


    On that customization card, you can lock in some taskbar-specific configurations.
    For instance, by default, your taskbar will show all programs you have open on
    your desktop, regardless of which virtual desktop you opened them on. Some people
    like this feature but I am not one of them. This is something I check off because
    I want to see only the programs on the virtual desktop I am currently running
