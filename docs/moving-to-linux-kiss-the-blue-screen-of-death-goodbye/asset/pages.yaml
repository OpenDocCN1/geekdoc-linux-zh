  md: '# Chapter 2 Ready...Set...Linux!


    # Getting a Free Copy of Linux


    The idea of free software—a free operating system in particular—takes some getting
    used to, but it happens fast. When you are working with other operating systems,
    getting and new releases involves some kind of cash outlay. In the case of Linux,
    the most you need is a spare machine on which to play. Consequently, you can load
    one version of Linux, take it for a spin, then load another and see whether that
    feels any better to you.


    If you have a high-speed Internet connection (and a CD burner), you can visit
    any of the vendors'' sites listed at the end of this chapter and download their
    latest and greatest. Remember, technical support may still be an extra cost. although
    you may download your latest Linux free of charge.


    If you don''t like the idea of visiting each and every one of those sites, a visit
    to Linuxisoorg (http://www.linuxiso.org/) may be in order. This site provides
    you with a one-stop shop for the more popular Linux distributions with ISOs (CD-ROM
    images) available for download.


    # Package Managers and Updates


    Package managers often have a great deal to deal with what people end choosing
    in terms of a distribution. In this book, I''ll be talking about installing software
    using RPM, and every distribution I mentioned above uses RPM as the package manager,
    so the information you take will help you work with any of these re-leases. I
    have also developed a great respect for the power and simplicity of Debian''s
    apt-get program. In fact, now you can get apt-get for RPM-based systems.


    The method of update is also worthy of consideration. Many vendors provide an
    option for updating and patching your system online. As long as you have a fast
    Internet connection, you are all set. Finally, here''s the great disclaimer of
    the decade: Linux, like all dynamic, living things, is evolving and changing.
    It is a moving target and, consequently, the details of a specific distribution
    will change over time. In the next chapter, I''ll cover three major distributions
    and their installation procedures to give you an idea of what you can expect to
    see. For now, let''s talk about what you are need in preparation for getting Linux
    on your system.


    # Dual Booting


    As much as I would like to think that each and one of you is more than ready to
    say goodbye forever to your old operating system and hello to Linux, I know that
    for many this is a big jump. If you are still feeling a little insecure'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    simply breaking free and running Linux, I''m here to tell you that you can get
    the best of both worlds. It is called dual booting.


    Dual booting refers to the technique of making a home for both systems on your
    machine. When you start your computer, a small program called a boot loader offers
    you a menu of choices from which you can decide to boot Linux or whatever other
    operating system you have installed. That boot loader, for the most part, is called
    Grand Unified Bootloader (GRUB). A second and still very common boot loader is
    called LILO, the Linux Loader.


    When you load Linux on a system that already has Windows installed, your new system
    is smart enough to recognize the existence of this other operating system. You''ll
    find that an entry for both your operating systems will magically appear in your
    boot loader menu.


    # Preserving Your Data


    When you''ve been using a computer for a long time, you amass a lot of data. Forget
    software—the backup is the most important thing on your system, and you need to
    get it backed up. Whether you dual boot or not, I want to stress that you are
    going to be doing some changes to your hard disk. Please don''t take any chances
    with your data. Make a backup.


    Because Windows backup programs aren''t necessarily going to be helpful in getting
    your data onto a Linux system, you should copy the various word processing documents,
    spreadsheets, graphics (all those pictures you took with your digital camera),
    music files, and anything else that you will later later onto some kind of media,
    it it a ZIP drive, diskettes, or a CD.


    If you have large amounts of data, it might make sense to keep a Windows partition
    around long enough to copy from one to the other. Most of the major Linux distributions
    will not only notice the existence of your Windows partition, they will also provide
    you with an icon on your desktop so that you can easily access that data. Although
    this may seem like a great way to avoid backing up your data, please don''t ignore
    this step. In fact, if you haven''t been backing up your system, your system has
    been living on borrowed time. If in doubt, back up.


    # A Linux-Only System


    This is by far the easiest alternative you don''t have to worry about keeping
    an intact copy of something else on the system. This represents quite the leap
    because there is no going back (without reinstalling from scratch). If'
