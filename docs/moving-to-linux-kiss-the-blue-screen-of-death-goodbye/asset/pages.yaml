  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    If this is your first time using the service, the Red Hat Network Configuration
    dialog will automatically launch. Take a moment to fill out the form—you''ll need
    to provide a username, password, and email address (you don''t have to use your
    login id or password—in fact, you should create a completely different user).
    When you click Forward, you''ll get another, more detailed registration screen,
    but everything is optional. You may, if you wish, just click Forward past this
    point. Finally, as part of registration, the program will suggest a profile name
    for your system. You are free to create it or select new. With this information,
    your profile (including a list of packages installed on your system) will be created.


    You need to go through this registration process only once. When update starts
    the next time, you''ll get a little welcome message. Just click Next and you''ll
    be asked to confirm "channel" you are subscribed to—in other words, what release
    of the Red Hat system you are running. You should be able to click Next past this
    point.


    The available packages for update may consist of two passes. The first packages
    to skip (usually the kernel, but this is configurable), and the second is a list
    of all available packages. Check the packages you would like to install as your
    update (if you''re not sure, just check the Select all packages button, shown
    in Figure 12–2). When you have made your selection and click Next to continue,
    package dependencies will be checked (if you need additional packages installed,
    update will alert you), and the download will begin.


    As packages are downloaded, a progress bar will indicate a percentage of completion
    for both the current package and the whole download. When all packages are downloaded,
    you will click Next again to install them.


