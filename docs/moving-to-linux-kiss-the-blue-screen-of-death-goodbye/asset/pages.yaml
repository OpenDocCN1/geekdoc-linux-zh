    # Navigating Style


    Near the beginning of this chapter, I told you about the Stylist, floating window
    (labeled *Paragraph Styles*) sitting above your document. I mentioned it because
    it''s as soon as you start Writer. It made sense to explain it away, at least
    briefly. I''d like to give you some idea of how useful this tool can be in formatting
    your documents. If you''ve banished the Stylist, bring it back by clicking its
    icon or pressing <F1>.


    Whenever you start a new document, it loads with a default style. Style is actually
    a collection of formatting presets that define how various paragraphs will look.
    These include headings, lists, text boxes, and so on. All you have to do is select
    a paragraph, double-click on it, and your paragraph''s look—including font style
    and size—is magically updated. An example of how to use this, try the following:


    Start by reloading your dark and stormy document, highlight your title text to
    select it. At the bottom of your stylist, it says *Automatic*. With your title
    highlighted, double-click on Heading 1. The heading changes to a large, bold,
    sans serif font. Now click the arrow at the bottom of the list, and change from
    Automatic to Chapter Styles. Double-click on Title, and your title is suddenly
    centered with the appropriate font applied (Figure 13–9).


    The Stylist is pretty smart, really. Look back to the bottom of the list at those
    categories—HTML Styles, Custom Styles, and so on. Depending on the document type
    you are working on, the Stylist will come up with a preset sane list for that
    Automatic selection. If you call up an HTML document, HTML formatting will show
    up in the Automatic list.'
