    happens *after* the copy is done. In one case, you copy the file over and keep
    the original, giving you two copies of the same file but in different places.
    A move, on the other hand, copies the file and deletes the original from where
    it was.


    One easy trick is to select the file you want, right-click to get the menu, then
    click on Copy. Now go into the directory where you would like this file to appear,
