    # XMMS


    XMMS is pretty much the standard Linux media player but it is much more than a
    music player. Properly used, it is a spectacular light show, as well. It supports
    OGG Vorbis, MP3, and WAV formats. With the right extensions, you can also use
    it to play RealAudio and even MPEGs. More on that later.


    Every major distribution comes with XMMS, so you don''t have to go far to find
    it. If it is not already part of the installation, have a look on your distribution
    CD-ROM. If all else fails, you can always go to the source `http://www.xmms.org`
    for the latest and greatest.


    To start the program, look for XMMS under your Multimedia menu, or type `xmms
    &` (& from a shell or pressing `Alt+F2`) and press the `<Enter>` key. If this
    is the first time you start XMMS, you''ll see something that looks like the amplifier
    on your home stereo system (Figure 17–4).


    Notice that there are three *components* in my screen capture. If you are starting
    XMMS for the first time, you are likely to see only the amplifier module at the
    top left. Look at the buttons on the right of the amplifier. You''ll see one labeled
    *EQ* (the equalizer) and *PL* (the playlist). Clicking these buttons will bring
    you the two additional modules for your stereo system. The buttons may take some
    getting used to. They look more or less the same as you would expect on a home
    system and perform the same functions but, as you shall soon see when I explain
    *skins*, the *look* is very flexible.'
