  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    ![](img/6227ceb576e6091f42ed74eec527c9b4_229_0.png)


    Figure 14–5 Don''t forget to save your work.


    # Complex Charts and Graphs, Oh My!


    This time, I''ll show you how you can take the data that you enter into your spreadsheets
    and transform it into a slick little chart. These charts can be linear, pie, bar,
    and a number of other choices. They can be two- or three-dimensional, with various
    effects applied for professional look.


    To start, create another spreadsheet. We''ll call this Quarterly Sales Reports.
    With it, we will track the performance of a hypothetical company.


    In cell AI1, write the title (Quarterly Sales Reports) and in cell A2, write the
    description of the data (in thousands of dollars). Now in cell A4, write the Heading
    Period, then Q1 in cell A6, Q2 in cell A7, Q3 in cell A8, and Q4 in cell A9. Finally,
    enter some headings for the years. In cell B4, enter 1998, then 1999 in cell C4,
    and continue on in row 4 right up to 2002. You should have five years running
    across row 4, with four quarters listed.


    Time to have virtual fun. For each period, enter a fictitious figure (or a real
    one if you are serious about this). For example, the data for 1999, Q2 would be
    entered in cell C7, and the sales figure for 2001, Q3 would be in cell E8. If
    you are still with me, finishing enter the data, and we''ll do a few things.'
  merge: -1
