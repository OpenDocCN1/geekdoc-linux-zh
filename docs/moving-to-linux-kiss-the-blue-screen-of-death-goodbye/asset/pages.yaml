    * The IP address of the DNS (name servers - described above)

    * The IP address of your SMTP and POP3 email hosts

    * The IP address of your news server (optional)


    All of this information likely came with your contract when you first signed up
    with your ISP. Armed with this information, you are ready to begin.


    # Getting on the Net


    As I write this, there are three very popular methods of connecting to the In-

    ternet, notwithstanding your own connection at the office. These are cable

    modem, DSL service from the company, or god old-fashioned dial-up

    model. The first two are usually referred to as *high-speed or broadband con-

    nections, and dial-up access is usually made fun of.


    With all the press and hype about high-speed service, you would think that

    this is all people run. Think again. As I write this, the vast majority of people
    in

    North America are still connecting through a dial-up connection. Make no-

    t—as Mark Twain might have remarked, the rumors of dial-up access''s de-

    mise are greatly exaggerated. You may be among the majority who are still

    using dial-up; I''ll cover that in detail.


    Before we get started, make sure that you have all the information pro-

    ed by your ISP. At bare minimum, this information will consist of a user-

    name, a password, and a number to connect to. You will likely also be given andefault
    route, a DNS address (possibly two), and the addresses of your mail

    server (we''ll get to get that in Chapter 10). If you are ready, let''s begin.


    # Connecting to the Net with a Modem


    All ISPs provide dial-up access through the Point-to-Point Protocol, or PPP.

