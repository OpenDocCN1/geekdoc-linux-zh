    by your ISP), as well as your username. If you don''t want to enter your password
    and every time Evolution checks for mail, you should click the "Remember this
    password" check box. When you click Next, you''ll have the opportunity to decide
    whether Evolution checks for mail automatically (the default is to check every
    10 minutes). Don''t set this unless you are always connected. Click Next again,
    and you will be able to configure your outgoing mail.


    The default Server Type for sending is SMTP, and that is almost certainly what
    you will need. Enter the hostname as provided by your ISP (or system administrator),
    and click Next. The Account Management screen follows with your new email account
    listed as it will displayed in Evolution. You could change this to be a name rather
    than an email address you prefer. If this is your initial setup, leave the button
    labeled *Make my default account checked* on, and click Next.


    You are almost done. The final step is to select your time zone. Select an area
    on the map (preferably near where you live) to narrow down your search. The map
