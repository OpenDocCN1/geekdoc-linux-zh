- img_proc: true
  md: '# Searching for Common Ground


    Every major Linux vendor wants to make the Linux experience as wonderful as possible,
    particularly when it comes in installing software packages. Consequently, almost
    everyone has a software installation tool that they have tweaked to make the user
    experience as simple as possible, a tool that deals with package dependencies
    easily.


    SuSE provides YaST2. Mandrake provides RpmDrake (or the command-line updrm). Linux
    has its Click-N-Run service. As you can see, there are many alternatives. In this
    chapter, however, I''m going to be release-agnostic and cover those tools that
    should be in almost any distribution.


    Let''s start this exploration with KDE''s own package manager, kpackage.


    > Note: In the initial release of Red Hat 8.0, kpackage was not compiled into
    the kdeadmin package (of which kpackage is part). If you are working with this
    release and kademin has not yet been updated by the time this book is released,
    there is still a way. When you find a package you want (while surfing with Conqueror),
    click the one you want to install and click Open when Conqueror asks whether you
    want to open using Install Packages.


    # Kpackage


    KDE''s package tool, kpackage, uses a graphical interface to allow for easy installation
    or removal of packages. When you first start up kpackage (which you can quickly
    call by pressing <Alt+F2> and typing kpackage), you''ll get a two-pane display
    with the installed packages on the left and an information window on the right.
    Click on an installed package (such as in Figure 7–1), and you''ll get to know
    all about that package in the right-hand window''s Properties tab.


    Click on the File List tab, and you''ll get a listing of every file that makes
    up this package and where these files live on your system. This is actually a
    great way to get to know the packages installed on your system, and I would highly
    recommend walking through the list and getting a feel for what comprises your
    Linux system.


    Notice as well as all of the packages in the tree view to the left are in a category
    hierarchy, based on what kind of package they are.'
