  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    Other network-playable games include KBackgammon (command name kbackgammon) and
    Atlantik, a network-playable Monopoly-like game. It too features a chat area so
    that you can play with others around the world. Then there''s Tenies Empanadas
    Graciela, or TEG, a network-enabled clone of the Risk world conquest game. Unfortunately,
    that one isn''t on your disk, but if world conquest appeals to you, visit http://teg.source-forge.net
    and start building your empire.


    Of course, one of the oldest and most popular board games in the world is chess.
    On your disks and perhaps already installed, you will almost certainly find xboard
    (and that is the command name). For the Mahjong fans out there (the classic Eastern
    tile-matching game), there is a KDE version (command name mahjongg) and a GNOME
    version (command name mahjongg).


    # Educational Games


    Games can be educational, as well. As we all know, having a game that has pens
    to be educational doesn''t automatically eradicate the fun factor. In fact, one
    of my favorite Linux games just happens to be an educational game (I''ll tell
    you what it is shortly).


    # KStars


    KStars (command name, kstars), part of the kde package, is a desktop planetarium
    program that displays the locations of stars and planets on your desktop. KStars
    is amazing fun but much more than a toy. With a database of the planets, 40,000
    stars, and 13,000 deep-sky objects, KStars is an astronomical treasure. With it,
    you can visually identify the position of stars, galaxies, nebulae, and other
    objects of the night sky (see Figure 18–10). You can control what is displayed,
    zoom in on objects, and (I love this part) download images from online sources,
    such as Hubble and the Space Telescope Institute. Just right-click on an object
    of interest, and the pop-up will offer you both additional information and links
    to high-resolution images of those objects when appropriate.


    When you start KStars, it will assume your location as Greenwich, United Kingdom,
    which is probably not what you want (unless, of course, you live near Greenwich).
    By clicking Location on the menu bar and selecting Geographic dialog box will
    appear with a world map (Figure 18–11).


    Click an area on the map close to where you live. This will provide you with a
    list of geographical points in a list to the right of the map. Make your'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# Chapter 18 Fun and Games (Very Serious Fun)


    ![](img/6227ceb576e6091f42ed74eec527c9b4_322_0.png)


    Figure 18–10 Explore the universe with KStars.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_322_1.png)


    Figure 18–11 Choosing your geographical location for viewing.'
  merge: -1
