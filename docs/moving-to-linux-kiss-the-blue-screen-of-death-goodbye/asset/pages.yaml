  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # Konqueror


    To start surfing the Net with Konqueror, you''ll need to connect to the Internet—it''s
    a good thing we covered that in Chapter 9. Starting Konqueror as a browser is
    the same as starting Konqueror any other way. Most distributions, however, have
    an icon either on the desktop or on Kicker to start up Konqueror as a browser.
    The difference is that in the browser configuration, you can set a home page (more
    on later).


    Konqueror does pretty much anything you expect from a Web browser and some things
    you don''t. You can go forward and back, save bookmarks (click Bookmarks in the
    menu bar), download files, or print pages. Because I am assuming that you have
    all used a browser before, I''ll concentrate on the things that I think you will
    want to know. To start surfing the Net, this is all you have to do. Fire up Konqueror,
    enter your favorite Web site''s URL into the Location: bar window, and press <Enter>.
    In a few seconds, your Web site''s page should appear.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_181_0.png)


    > Quick Tip Notice the black arrow with an x through it, the immediate left of
    the Location label will automatically clear the Location field. No need to select
    or backspace over the last URL.


    # Page Home for Me...


    Setting your home page is easy. Simply visit the site of your choice, drag the
    Konqueror browser window to the size you want, then click Window in the menu bar
    and select Save View Profile | Web Browsing. This brings up the Profile Management
    dialog (Figure 1–1), where you can save this as your default Konqueror Web view.


    Notice the two boxes at the bottom. Make sure you click both if you want to preserve
    the size of browser window that you specified along the link to your home page.
    Click Save, and you are done. Next time you fire up the Konqueror browser, you''ll
    head straight to your home page.


    You might wonder what the point of creating a profile to set your home page might
    be. Profiles are interesting because you can create custom Konqueror views for
    yourself as desktop icons. When you start any other browsers, you have one home
    page. Sure, you could put links on your desktop that go to a specific site simply
    by right-clicking on the desktop, choosing Create New,'
