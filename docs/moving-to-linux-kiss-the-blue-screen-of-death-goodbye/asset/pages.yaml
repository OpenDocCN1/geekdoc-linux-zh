  md: '# About the CD-ROM


    The CD-ROM included with Moving to Linux: Kiss the Blue Screen of Death Goodbye!
    contains the following:


    WFTL Edition Knoppix: this is a Debian-based distribution that runs entirely from
    your PC''s CD-ROM drive (though much slower than if you actually install Linux).
    That''s right. You can run Linux on your personal computer system without having
    to change your system or uninstall Windows®. This CD is full of great software,
    some of which is covered in this book. You''ll have access to email applications,
    web browsers, word processors, spreadsheets, games, and more. In fact, you should
    be able to follow along with this book and do many, though not all, of the things
    covered without having to install Linux at all.


    > The version of Knoppix included with this book is not the official version,
    but one that has been slightly modified by my humble author. I wish to express
    my admiration and thanks to Klaus Knopper, the creator of Knoppix, for his fine
    work, but any questions regarding the included disk should be directed to myself.
    Visit http://www.marcelgagne.com.


    # Minimum Suggested Requirements and Instructions


    For best performance, your system should have at least a 350 Mhz Pentium class
    CPU with at least 128 Megabytes of RAM. WFTL Edition Knoppix supports a wide variety
    of graphics cards, monitors, sound cards, network cards, and other hardware. The
    odds are pretty good that the WFTL Edition Knoppix CD will work with your system
    if the minimum requirements are met.'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    Using the CD should be as simple as shutting Windows® and doing a reboot. Make
    sure your PC is set to boot from the CD, WFTL Edition Knoppix boots up to a nice,
    graphical screen with a simple boot prompt from which you can simply press Enter
    and let the CD do the rest; this is an amazingly simple install. As the system
    comes up, you''ll see a number of prompts as hardware is detected and your environment
    is created. This can take a few minutes, so please be patient.


    Additional details on your WFTL Edition Knoppix CD can be found in Chapter 1 of
    this book in the section titled "About the CD."


    # License Agreement


    Nearly all of the software on the CD is licensed under the GPL or other approved
    licenses, but there are some exceptions (see http://www.gnu.org/copyleft/gpl.html
    or the Appendix for a copy of the GPL). While you are free to copy and redistribute
    this CD, use of the software accompanying Moving to Linux: Kiss the Blue Screen
    of Death Goodbye is subject to the terms of the License Agreement and Limited
    Warranty, found in Appendix A.


    CD website and excerpts from Linux System Administration: A User''s Guide are
    copyright Marcel Gagné and Addison Wesley Professional.


    # Technical Support


    Addison-Wesley does not offer technical support for any of the programs on the
    CD-ROM. However, if the CD-ROM is damaged, you may obtain a replacement copy by
    sending an email that describes the problem to: disc_exchange@prenhall.com.'
