  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # Playing the MS-Only Plugin Game


    Yes, despite the fact that Linux is the future, there are companies producing
    plugins without a Linux equivalent. The obvious one here is Microsoft’s own Windows
    Media Player. The benefits of running Linux far outweigh any possible downside
    to not having access to these players, but as it turns out, you do not have to
    without. Consider getting your hands on a copy of the Codewavers CrossOver Plugin.
    This marvelous piece of software makes it possible to use native Windows plugins
    for Quicktime, ShockWave Driver, and others seamlessly in your favorite Linux
    browser. For all those movie trailers that seem to be available only in Quicktime
    format, the CrossOver Plugin is a must, and although this isn’t a free product,
    it is quite expensive. Installation is a piece of cake, and you won’t need to
    feel left out when the next blockbuster premiere shows up at a Web site near you.
    Still interested? Here’s your address:


    ```

    http://www.codewavers.com

    ```


    Furthermore, some CrossOver plugins can be used externally from your browser as
    stand alone programs. After installation, these will be available in your KDE
    menu.


    # Then, There’s MPlayer!


    The Codewavers CrossOver Plugin has going for it is that you get to use the actual
    Windows plugins on your Linux system. It is the real thing and consequently looks
    just like the official product. Still, if you are willing to forgo official look,
    there is a freeware alternative that will do the job very nicely. It’s called
    MPlayer. It is also a great media player that can handle both audio and video
    streams, from a TV tuner card, record audio and, and more. It works beautifully
    from the command line, but it also has a great, skinnable GUI. MPlayer requires
    a little more work up front, but the results are worth it, and it won’t cost you
    a penny.


    Some distributions such as Mandrake, already come with MPlayer, so check your
    distribution CDs first. In order to install the mplayer-gui and mplayer-skins
    packages as well as mplayer itself. If you don’t have it (or you want the latest
    and greatest), a visit to the MPlayer-Web site at http://www.MPlayerHQ.hu. You’ll
    find both source distributions as well as RPMs.'
