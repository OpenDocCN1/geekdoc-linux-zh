  md: '# chapter

    16

    Graphics and Art

    (Just Call Me Leonardo)


    Oddly enough, applications allowing users to work with graphics are among some
    of the most highly developed in the world. To see the truth in this rather bold
    statement, turn your eyes to Hollywood. Blockbusters such as Titanic, Star Trek:
    Nemesis, Shrek, and others use Linux and Linux clusters to create the complex
    special effects.


    In terms of graphical design and photo editing, your Linux system comes with one
    of the most powerful, flexible, and easy-to-use packages there is, regardless
    of what OS you are running. It''s called the GIMP, and I''ll be introducing you
    to its features a little later in this chapter.


    Then we have digital cameras. In the world of your old OS, you needed special
    software to work with your particular camera. In the Linux world, you can do it
    all with a single interface. In fact, if you come this far in this book, you probably
    already know almost everything you need to work with your camera.


    Finally, I''ll cover another piece of graphical magic making when I show you how
    to use a scanner with your Linux system, from capturing your old photos to capturing
    and interpreting text.


    Ready? Then smile!'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Working with a Digital Camera


    Behind the fancy front end that takes photos from your camera and lets you work
    with them on your Linux system is a little package called gPhoto2. This package
    is actually a back end used by various other graphical programs, including as
    you will see shortly, Conqueror.


    A number of digital cameras are supported through gphoto2; 295 of them as I write
    this chapter. To discover whether your camera is supported directly, check out
    and type the following command:


    ```

    gphoto2 --list-cameras

    ```


    You should see output similar to the following shortened list.


    +   Number of supported cameras: 295

    Supported cameras:

    - "AEG Snap 300" (TESTING)

    - "Agfa CL18"

    - "Agfa ePhoto 1280"

    - "Apple QuickTake 200"

    - "Apple QuickTake 200"

    - "Argus DC-100"

    - "Barbie"

    - "Canon PowerShot A20"

    - "Canon PowerShot S10"

    - "Canon PowerShot S100"

    - "Chinon ES-1000"

    - "DE300 Canon Inc."

    - "Digitaldream DIGITAL 2000"

    - "Epson PhotoPC 500"

    - "Epson PhotoPC 550"


    If your camera is not listed, don''t despair. A visit to the gPhoto Web site for
    an updated version of the software may be all you need.


    ```

    http://gphoto.sourceforge.net

    ```


    # Picture-Perfect Conqueror


