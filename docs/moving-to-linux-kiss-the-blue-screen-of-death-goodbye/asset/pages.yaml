  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # VMware


    The Wine project has done some impressive work, but it will not run all Windows
    applications. Sometimes you just need to run the whole shebang, and that means
    a full copy of Windows you don''t want to boot back and between Linux and Windows,
    it would be great if you could run Windows entirely on your Linux machine. This
    is the philosophy behind VMware—and it doesn''t stop.


    VMware enables you to create virtual machines on your computer. Complete with
    boot-up BIOS and memory checks, VMware virtualizes your entire hardware configuration,
    making the PC inside as real as the one you are running. Furthermore, VMware enables
    you to run (not emulate) Windows 95, 98, 2000, NT, FreeBSD, or other Linuxes.
    For the developer or support person who needs to work (or write) on different
    platforms, this is an incredible package. Yes, you can even run another Linux
    on your Linux, making it possible to test (or play) different releases without
    reinstalling on a separate machine. VMware knows enough to share your printers,
    network cards, and so on. You can even network between the “real” machine and
    the virtual machine as though they were two systems.


    All this capability comes at a price, however. Aside from the dollars you spend
    on this package (and it can be worth it), there is a considerable price in performance.
    VMware is a hungry beast. The more processor power and memory you have, the better.
    A Pentium III with 96 or more megabytes should be your starting point. Unlike
    Wine, you do need a licensed copy of Windows (or whatever OS you are installing)
    to run.


    VMware comes in a variety of packages and price points. Visit the VMware Web site
    (http://www.vmware.com/) for details.


    # Win4Lin


    Another alternative still requires a licensed copy of Windows. Nettraverse (http://www.nettraverse.com)
    sells a package called Win4Lin. This is a package designed to let you run Windows
    on your system but unlike VMware, only Windows (95, 98, and ME at this writing).
    It is, however, somewhat expensive than VMware. Once again, remember that because
    you aren''t emulating but actually running a copy, you will still need that licensed
    copy of Windows.


    Win4Lin''s magic is performed at the kernel level. Consequently, this requires
    you to download a patched kernel equivalent to what you are currently running
    or that you patch and rebuild your own. If you have compiled'
