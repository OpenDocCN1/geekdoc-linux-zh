- img_proc: true
  md: '# Chapter 14 Spreadsheets (Tables You Can Count)


    # 207


    On the left side, you''ll see a list of functions with descriptions of functions
    off to the right. For the function called AVERAGE, the description returns the
    average of a sample. Because this is what we want, click the Next button at the
    bottom of the window. When the next screen appears, look at the window labeled
    Formula at the bottom of the screen. You''ll see that the formula is starting
    to be built. At this point, it says=AVERAGE() and nothing else.


    Near the middle of the screen on the right side are data fields number 1 through
    number 4. The first field is required, whereas the others are optional. You could
    at this point enter A3:A9, click Next, and be done. Alternatively, you could click
    the button to the right of the number field (the tooltip will say Shrink), and
    the AutoPilot will shrink to a small bar floating above your spreadsheet (Figure
    14–4).


    ![](img/6227ceb576e6091f42ed74eec527c9b4_228_0.png)


    Figure 14–4 The AutoPilot Formula bar.


    On your spreadsheet, select a group of fields by clicking on the first field and
    dragging the mouse to include all seven fields. When you let go of the mouse,
    the field range will have been entered for you. On the left-hand side of therunken
    AutoPilots, there is a maximize button (move your mouse over it to activate the
    tooltip). Click it, and your AutoPilot will return to its original size. Unless
    you have an additional set of fields (or you wish to create a more complex formula),
    click OK to complete this operation. The window will disappear, and the spreadsheet
    will update.


    # Saving Your Work


    Before we move on to something else, you should save your work. Click File on
    the menu bar and Save (or Save As). When the Save window appears (Figure 14–5),
    select a folder, type in a file name, and click Save. When you save, you can also
    specify the File type to be OpenOffice.org''s default format (StarCalc), DIF,
    DBASE, or Microsoft Excel format.


    Should you decide to close OpenOffice.org Calc at this point, you could always
    go back to the document by clicking File on the menu bar and selecting Open.'
