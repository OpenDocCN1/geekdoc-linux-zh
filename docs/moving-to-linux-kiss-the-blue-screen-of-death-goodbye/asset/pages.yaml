    # Take Me out to the Arcade


    Ah, the video arcade. I''m sure I spent far too much of my youth popping quarters
    into video game machines (yes, kids, it used to cost a mere 25 cents to play a
    game). Nevertheless, there was a real flavor associated with the kind of games
    you found there. In the heyday of the arcade (sorry kids, it is over), games tended
    to be fast but easy to learn. You didn''t need to spend a small fortune to just
    get used to what was the game did. Things came at you, you zipped them. Or you
    got out of the way.


    With your Linux system, the arcade experience is alive and well. Let''s take a
    look at the sorts of things you have at your disposal.


    # Cubes and Things that Drop


    One of the most enduring games of that period was something called Tetris. The
    concept was simple. Colored geometric patterns would fall from above, and as they
    fall, you would rotate the pieces so they fit (like a jigsaw puzzle) into the
    bottom row. Fill a row, and the pieces disappear. Miss too many'
