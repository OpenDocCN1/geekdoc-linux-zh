  md: '# chapter

    14

    Spreadsheets

    (Tables You

    Can Count on)


    A spreadsheet, for those who might be curious, allows an individual to organize
    data into a table comprising rows and columns. The intersection of a row and a
    column is called a cell, and each cell can be given specific attributes, such
    as a value or a formula. In the case of a formula, changes in the data of other
    cells can automatically update the results. This makes a spreadsheet ideal for
    financial applications. Change the interest rate in the appropriate cell, and
    the monthly payment changes without having to do anything else.


    The idea of a computerized spreadsheet probably existed before 1978, but it was
    in that year Daniel Bricklin, a Harvard Business School student, came up with
    the first real spreadsheet program. He called his program a visible calculator,
    then later enlisted Bob Frankston of MIT (Bricklin names him as co-creator) to
    help develop the program further. This program would come to be known as VisiCalc.
    Some argue that with VisiCalc, the first so-called killer app was born.


    Now that we have the definitions and history out of the way, let''s get back to
    your Linux system and have a look at OpenOffice.org''s very own spreadsheet program.
    It is called Calc—an appropriate name, given what spreadsheets tend to be used
    for.'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # Starting a New Spreadsheet and Entering Data


    There are a few ways to start a new spreadsheet. If you are already working in
    OpenOffice.org Writer (as I am right now), you can click File on the menu bar,
    move your mouse to the New submenu, and select Spreadsheet from the drop-down
    list. Another way is to click the application starter (the big K) and select Calc
    from the OpenOffice.org or Office menu. When Calc starts up, you''ll see a blank
    sheet of cells, as in Figure 14–1.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_225_0.png)


    **Figure 14–1** Starting with a clean sheet.


    Directly below the menu bar is the Function bar. As with Writer, the icons here
    give you access to the common functions found throughout OpenOffice.org, such
    as cut, paste, open, save, and so on. Below the Function bar is the Object bar.
    Some features are here similar to those in Writer, as font style and size, but
    others are specific to formatting content in a spreadsheet (percentage, decimal
    places, frame border, etc.).


    Finally, below the Object bar you''ll find the Formula bar. The first field here
    displays the current cell but you can also enter a cell number to jump to that
    cell. You can move around cell to cell using your cursor keys, <Tab> (and <Shift+Tab>)
    key, or simply by clicking on a particular cell. The current cell you are working
    on will have a bold black outline around it.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Chapter 14 Spreadsheets (Tables You Can Count)


    # Basic Math


    Let''s try something simple, shall? If you haven''t already done so, open a new
    spreadsheet. In cell A1, type Course Average. Select the text in the field, change
    the font style or size (by clicking on the font selector in the Object bar), then
    press <Enter>. As you can see, the text is larger than the field. No problem.
    Place your mouse cursor on the line between the A and B cells (directly below
    the Formula bar), Click and hold, stretch the A cell to fit the text. You can
    do the same for the height of any given row of cells by clicking on the line between
    the row numbers (over to the left) and stretching these to an appropriate size.


    Now move to cell A3 and type a hypothetical number in the range of 1-100 to represent
    a course mark. Press <Enter> or cursor down to the next cell. Enter seven marks
    so cells A3 through A9 are filled. In my example, I entered 95, 67, 100, 89, 84,
    79, and 93. (It seems to me that the 67 is an aberration.)


    What we are going to do now is enter a formula in cell A1 to provide us with an
    average of all seven course scores. In cell A1, enter the following text.


    ```

    = (A3+A4+A5+A6+A7+A8+A9)/7

    ```


    When you press <Enter>, the text you entered will disappear and instead, you''ll
    see an average for your course scores (Figure 14–2).


    An average of 86.71 isn''t a bad score (it is an A, after all), but if 67 really
    was an aberration, you can easily go back to that cell, type in a different number
    and press <Enter>. When you do so, the average will magically change for you.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_226_0.png)


    Figure 14–2 Setting up a simple table to determine class averages.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    Calculating an average is a simple enough formula but if I were seventy rows instead
    of seven, the resulting formula could get ugly. The beauty of spreadsheets is
    that they include formulas to make this whole process cleaner. For instance, I
    can specify a range of cells by putting a colon between the first and last cells
    (A3:A9) and using a built-in function to return the average of that range. My
    new, improved, and cleaner formula looks like this.


    ```

    =AVERAGE (A3:A9)

    ```


    Incidentally, you can also select the cell and enter the information in the input
    line for a couple of reasons. I mention one that you can obviously enter the information
    in the field, as well as in the cell itself.

    The second reason is to do with those little icons to the left of the input field.
    If you click into that input field, you''ll notice a little green checkmark will
    appear (to accept any changes you make to the formula), and to its left there
    will be a red X (to cancel the changes). Now look to the icon furthest on the
    left. If you hold your mouse over it, it should pop up a tooltip that says AutoPilot:
    Functions. Try it. Go back to ALL, click your mouse into the input field on the
    Formula bar. Now click onto the AutoPilot Functions icon (you can also click Insert
    on the menu bar and select Function). You''ll get a window such as the one in
    Figure 14–3.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_227_0.png)


    **Figure 14–3** Using the AutoPilot to generate a function.'
  merge: -1
