    # PCI Devices


    Adding a PCI device definitely requires a reboot because we are talking about
    internal devices. These are cards that fit in the slots inside your computer.
    When you reboot the machine, Linux should be able to scan for these cards and
    identify them without any problem. When you click on PCI in the Control Center
    Information category, you''ll get a detailed list of every device known to the
    system (see Figure 8–2).


    **Shell Out** You can run the command /sbin/lspci for a more succinct list.


