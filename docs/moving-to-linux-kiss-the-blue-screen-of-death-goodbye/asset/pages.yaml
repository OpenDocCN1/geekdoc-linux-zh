    terminal session you open, every link to the Internet, every game you have running—all
    these generate one or more processes on your system. In fact, there can be hundreds,
    thousands of processes running on your system at any time. To see your own processes,
    try the following command:


    ```

    [root]@testsys /root]# ps

    PID TTY TIME CMD

    12293 pts/5 0:00:00 login

    ```'
