    # Saving Your Work


    In a strange way, your images are already saved. In your home directory, you’ll
    find another directory called .kde, where your KDE configuration files, Kmail
    address books, Konqueror bookmarks, and other files live. As it turns out, your
    scanned images are already saved there, although technically, they are still work
    files. If you want to have a look, check out ./kde/share/apps/Scan-Images in your
    home directory. If you created new directories in your Gallery, you’ll see them
    as well.


    To officially save your work in Kooka, right-click on one of your scanned images
    in the Gallery frame (top left), and select Save Image. You’ll be presented with
    the standard KDE save dialog. Choose a directory and a name for your image, and
    click Save (Figure 16–8).'
