    # Resizing Windows


    The last thing you should know is that (for the most part) you aren''t stuck with
    the default window size. By grabbing any of the corners of an application window,
    you can drag that corner and stretch the window to a size that is more comfortable
    for you. The same applies to the top, bottom, and sides of a program window.


    As you position the cursor on a corner or a side, you''ll see it change to a double
    arrow. Just drag the side or corner where you want it, and you are done.


    # Command Central


    Sometimes if you know the command, it is just as easy to type that command and
    tell the program to run without having to work your way through all those menus.
    On your old system, you would have clicked that Start button, select-Run, and
    typing something in, usually setup because that is when you tend to use the Run
    option. On your Linux system, you can do the same thing by clicking the big K
    and selecting the Run command. You can simply hold down the <Alt> key and hit
    <F2> (Alt+F2). A nice dialogue box will appear, asking you to type the name of
    the program you want to run.


    Are you wondering those programs are called? Let me give you a hint.'
