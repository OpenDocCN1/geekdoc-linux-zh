  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    The second most likely spooler you will run into is LPD, the classic UNIX spooler.
    LPD has been around for a long, long time and continues to be distributed with
    pretty much every Linux out there.


    Whether it is CUPS or LPD, KDE handles printing beautifully. Adding, configuring,
    or removing a printer is done through the KDE Control Center. After kcontrol has
    been activated, click on System (in the left side category window) and select
    Printing Manager (for KDE 3.1, click on Peripherals, then Printers).


    We''ll start by adding a printer. Because adding hardware, like adding software,
    is an administrative function, start by clicking the Administrator button at the
    bottom of the Printing Manager window. A window will pop up, asking you for the
    root password (Figure 8–4).


    ![](img/6227ceb576e6091f42ed74eec527c9b4_137_0.png)


    Figure 8-4 Accessing the printer configuration requires the root password.


    When you have entered the password, you''ll be looking at the same interface,
    but things will be a little different. For starters, the window to the right is
    now surrounded by a red border. Furthermore, some of the icons have gone from
    grayed out to being active. If the toolbar and icons are not visible, right-click
    in the printer list window (at the top of the printer configuration window). A
    pop-up menu will appear (Figure 8–5), from which you should select View Toolbar
    or View Menu Toolbar. Both have the same menu options but are presented somewhat
    differently. One of those is the Add printer/class icon. Clicking that icon brings
    up the KDE Add Printer wizard (see 8–6).'
