  pgno: 258
- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    ![](img/6227ceb576e6091f42ed74eec527c9b4_259_0.png)


    Figure 16–5 Kooka''s main screen and work area.


    depending on the model and type of scanner you are running. On my system, I used
    an Epson GT-8200. You can adjust scan mode (black and white, grayscale, or color),
    as well as resolution. Keep in mind that although higher resolution generally
    means higher quality, it also means a much larger file in terms of storage space.
