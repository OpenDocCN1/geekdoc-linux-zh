    # Using MPlayer as a Browser Plugin


    You go visit your favorite movie preview Web site to watch a video clip only to
    discover that it is in Quicktime or Microsoft format and that it doesn''t work
    in your browser. I mentioned the Crossover Plugin as a solution, but you can use
    your MPlayer for viewing these clips as well.


    You do this by using the `mplayer-plugin-in`, an open source plugin that uses
    MPlayer. Head over to `http://mplayer-plugin-in.sourceforge.net/` and download
    the latest source RPM packages for RedHat are also available). If there are no
    packages available for your distribution and you need to build from source, have
    no fear. It''s easy.


    ```

    tar -xzvf mplayer-plugin-in_v0.80.tar.gz

    cd mplayer-plugin-in

    make

    make install

    ```


    What the last line really does is copy the resulting mplayerplugin-in.so file
    into your home directory''s `.mozilla/plugins` directory.


    cp mplayerplugin-in.so $HOME/.mozilla/plugins


    If you want to make the plugin globally accessible, you''ll need to know Mozilla''s
    system-wide plugins directory (or Netscape''s). For example, with my RPM-installed
    Mozilla, I would use this command:


    ```

    cp mplayerplugin-in.so /usr/lib/mozilla/plugins

    ```'
