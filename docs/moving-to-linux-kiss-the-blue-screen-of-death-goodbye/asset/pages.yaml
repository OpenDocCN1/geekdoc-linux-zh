    # ## Some Tips on Using this Book


    My intention in creating this book is to provide a simple move from your old OS
    to Linux. I''ll cover things such as installation shortly, but the majority of
    the book has to do with working (and playing) in your new Linux environment. I
    want to show you how to do the things you have grown used to doing: the Net, writing
    emails, listening to music, printing, burning CDs, and so on. Furthermore, I am
    telling you how to take those Word documents, Excel spreadsheets, and music files
    you have collected over time and start using them with Linux. In short, my plan
    is to have you move as effortlessly as possible from your old OS to Linux.


    Working your way through the chapters, you''ll notice that I am inviting you to
    try things. That I believe the best way to learn anything is doing. Yes, you''re
    going to learn to work with a new operating system, but it doesn''t mean you can''t
    have fun. As everyone knows, all work and no play will make anyone pretty dull.
    Later on in this book (in an effort to avoid dull-ness), I''ll take you into the
    world of Linux functions and games.


    # ## Quick Tips and Shelling Out


    Throughout the book, I will occasionally provide you with boxed asides, "Quick
    tips" that should serve as little reminders or simpler ways to do things.


    You''ll also notice boxes that start with the phrase "Shell out.\ Although I intend
    to concentrate on working with graphical tools and in a graphical way, much of
    the power of Linux comes from working with the command line, or the shell. The
    "Shell out" boxes will guide you in working with the shell.


    Learning to wield the command line is akin to getting a black belt in martial
    art or earning a first aid certificate. It doesn''t mean that you are going to
    run out and take on all corners or that you are going be facing daily crisis situations.
    What working with the shell does give you the means and confidence to step outside
    the confines of the graphical environment. The shell is power, and it is always
    there for you, so you should not fear it.'
