  md: '# Chapter 17 Multimedia (If Music be the Food of Love...)


    283


    # A Note on Encrypted DVDs


    You may find as you play DVDs on your Linux system that some DVDs work and others
    do not. The reason for this is encryption. In an effort to protect against unlawful
    copying and distribution of movies on DVD, some companies in the motion picture
    industry have gone to extremes to protect themselves using a system called Content
    Scrambling System (CSS). The result of this overreaction curtails the freedom
    of those law-abiding individuals who are looking to play the DVDs that they legally
    bought and paid for the DVD player that they legally bought and paid for the computer
    they legally bought and paid for.


    "There’s a simple solution," you say. "Why not or use software that decrypts the
    DVDs so you can watch them?"


    Well, it’s not that easy.


    In some countries, most notably the United States, it is illegal to use software
    that decrypt any form of encryption put in place by any individual or company,
    even when it is for private use (do a Google search on DMCA). I write this, legal
    challenges to this law are currently in the courts and in some cases, have already
    upheld the right of the individual. This isn''t to say that the motion picture
    will give up easily.


    For instance, under the DMCA, a small handful of individuals have been charged
    for distributing a piece of software called libdecrypt, libd (or simply DeCSS),
    which lets you play encrypted DVDs on your Linux PC. The California Appeals Court
    ruled that the posting of source code (in this case, DeCSS) is upheld by the First
    Amendment.


    Meanwhile, in Norway, a young man named Jon Lech Johanson was cleared of wrongdoing
    for distributing DeCSS software on the Internet. The 19-year-old "DVD Jon" faced
    two years in prison when the Motion Picture Association of America (MPAA) requested
    that Jon be arrested (he was only 15 at the time). In fact, the MPAA wanted both
    Jon and his father arrested


    Why am I telling you all this? I mention all of this because I want to make yourselves
    aware of the laws in your area. Playing a DVD on your PC sounds like a perfectly
    normal and legal thing to do—agree, but I must repeat myself—you should be careful
    and make yourselves aware of the laws regarding as they apply to your state, province,
    or country. I don’t want to hear that any of you are facing jail time just because
    you decided to watch your legal copy of the latest blockbuster on your Linux system.'
