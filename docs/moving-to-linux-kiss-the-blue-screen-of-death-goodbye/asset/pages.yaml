    # Welcome to the GIMP


    The GIMP is one of those programs that has helped create an identity for Linux.
    Of course, there are plenty of programs out there, as I''m sure I have demonstrated
    by this point in the book, but the GIMP is special in many ways. The Linux community
    has used it to create images, buttons, desktop themes, decorations, and more.
    Even the Linux mascot, Tux the Penguin, created by Larry Ewing (the mascot''s
    best-known incarnation) was a product of the GIMP.


    The GIMP is an amazingly powerful piece of software, yet it is very simple, with
    a little bit of work, a lot of fun, and a hint of experimentation, anyone can
    use the GIMP to turn out a fantastic piece of professional-quality art. You doubt
    my words? Then follow along with me, and in just a few minutes, you''ll have created
    a slick-looking logo for your Web page or desktop. That said, with time, you can
    also learn to wield the GIMP with the power of a Hollywood special effects master.'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    Ladies and gentlemen, start your GIMP. Click on the application starter (the big
    K), scroll up to the Graphics submenu, and click on the GIMP. You can also use
    your program quickstart by pressing <Alt+F2> and entering gimp into the command
    field.


    # The First Time


    If you are starting up the GIMP for the very first time, the GIMP User installation
    dialog will appear (Figure 16–11). You''ll be asked a number of questions regarding
    the location of your GIMP directory (defaults to a directory called .gimp-version.no
    under your personal home directory), how much memory you wish to allocate for
    the GIMP to do its work, and so on. For the most part, you can just accept the
    defaults by clicking Continue through the various screens.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_265_0.png)


    **Figure 16–11** When you start the GIMP for the first time, you’ll need to adjust
    a few settings.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Chapter 16 Graphics and Art (Just Call Me Leonardo)


    Immediately after the performance tuning, you''ll be asked for your monitor''s
    resolution. If you plan on doing particularly fine work and you would like the
