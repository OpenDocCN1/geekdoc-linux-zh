  md: '# Chapter 8 Working with Devices


    The sheer number of USB devices available is phenomenal, to say the least, and
    the list is growing. Many of these devices use a standard set of drivers, which
    means that a number of things can literally be plugged in and used—no need to
    mess with loading drivers because it is all being done for you.


    You noticed the word many in that last sentence, right? Keeping track of what
    works (and what doesn''t) and providing access to drivers that aren''t included
    in current distributions is the raison d''être of the Linux USB Device Web site.
    If you find yourself looking at a new webcam and you aren''t sure whether it is
    supported under Linux, look there first.


    ```

    http://www.qbik.ch/usb/devices/

    ```


    The site is organized into sections, depending on the device type (audio, video,
    mass storage, etc.). Each device assigned a status identifying just how well a
    device is supported, from works perfectly to works somewhat don''t bother.


    # Printers and Printing


    This might seem like a silly thing to mention, particularly if your printer is
    automatically detected, configured, and tested at boot time. Nevertheless, there
    are things that you might want to do with your printer, and we should cover some
    of these now. Furthermore, printing is one of the most important functions a personal
    computer performs. It''s good to get it right. I''m going to spend a little bit
    of time talking about printers and printing. Trust me, it''s going to be lots
    of fun.


    Printing under Linux works on the basis of print queues. At its simplest, this
    means that you send something to the printer, it is queued in a directory where
    it awaits its turn at the printer. This de-queuing is known as spooling. Consequently,
    the spooler that to be one of a small handful of programs, all of which are transparent
    when you print from applications. Here''s a quick roundup of the more popular
    spoolers.


    CUPS, the Common Unix Printing System, is designed to be a platform-independent
    printing system that works across a great number of UNIX flavors, including Linux.
    CUPS uses the Internet Printing Protocol (IPP), a next-generation printing system
    designed to allow the printing of any job to any printer, anywhere. At this point,
    CUPS certainly looks like the spooler of the future. Most Linux distributions
    include CUPS, and KDE will use it transparently.'
  merge: -1
  pgno: 136
