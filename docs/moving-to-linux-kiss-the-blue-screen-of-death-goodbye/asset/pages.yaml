  md: '# Chapter 13 Word Processors


    # Printing Your Document


    Invariably, the whole point of typing anything in a word processor might be to
    produce a printed document. When you are through with your document, click File
    on the menu bar and select Print.


    The Print dialog (Figure 13–5) has several options. The easiest thing to do after
    selecting your printer is to click OK. The print job will be directed to your
    printer of choice and, in a few seconds, you''ll have a nice, crisp version of
    your document. You can select a page range, increase the number of copies (one
    to all your friends), or modify the printer properties (paper size, landscape
    print, etc.).


    You can also print to a file. This is particularly interesting in that you can
    filter that print job so that the result is a PDF file (readable with Adobe Acrobat
    Reader or Linux''s own pdf).


    To print a PDF file, select the PDF Converter from the printer selection list.
    Click the Print to file check box, and the Save As dialog will appear (as in Figure
    13–4). Choose a file name (make sure you add the .pdf extension), select PDF from
    the file type drop-down menu, and click Save. When the Print dialog returns, click
    OK, and your PDF document will be created.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_212_0.png)


    **Figure 13–5** Printing your Writer document.'
