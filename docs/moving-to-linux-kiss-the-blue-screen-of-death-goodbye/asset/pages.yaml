  md: '# Adding Color


    Right-click on your slide (not the text), and select Slide from the pop-up menu.
    Now click on Page Setup (Figure 15–8).


    ![](img/6227ceb576e6091f42ed74eec527c9b4_244_0.png)


    Figure 15–8 Modifying the page (slide) setup.


    What will see a two-tabbed window (one Page and the other Background). Click on
    the Background tab. Notice the five radio buttons (Figure 15–9). Each provides
    an option for background selection, whether it be plain white, colors, gradients,
    hatching, or bitmaps. Click on each to see the choices they offer.


    For example, you might choose the Linear blue/white gradient (a busy-looking background)
    or perhaps the Water bitmap. The choice is yours. When you click OK, you’ll be
    asked whether you want this background setting to be for all slides. Now, click
    Yes.


    All right. You’ve done a lot of work, save it. It’s time to see the fruits of
    your labors. Click Slide Show on the menu bar and select Slide show. You can also
    use the <Ctrl+F2> keyboard shortcut. The slides will transition with a touch of
    the spacebar.'
