  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # Meet Your Desktop


    Modern Linux distributions come with powerful, easy-to-use graphical environments.
    There are many such environments, and in time, you will learn about them. Part
    of that freedom I spoke about is the freedom to do your way, and that extends
    to the type of graphical environment you may want to work in. the most popular
    desktop environments today are the K Desktop Environment (KDE) and GNOME, but
    WindowMaker, IceWM, and others have quite a following, as well. My personal choice
    is KDE, but I often switch to other desktops when the mood takes


    Although much of what you do with GNOME or KDE is pretty interchangeable, it makes
    sense in a book like this to pick one and run with it. Consequently, we will concentrate
    on the KDE desktop, primarily version 3.1 (although much of what I cover is very
    similar to what you see in release 3.0).


    KDE comes with most major distributions, including Red Hat, SCO, SuSE, Mandrake,
    and others. I recommend KDE because it is more mature, beautiful, and better developed
    than the alternatives (yes, some of this is partly my opinion). It sports a clean,
    consistent, and integrated set of tools, widgets, and menus. Because of all these
    things, KDE is also much easier and friendlier to work with. In fact, many Linux
    companies install KDE as the default.


    When you become comfortable with KDE and Linux, I invite you to experiment with
    other desktop environments. Exercise your freedom to be yours.


    # Help Me!


    Once you are done working with this book, I am confident that Linux will be your
    operating system of choice for the foreseeable future. That doesn''t mean you
