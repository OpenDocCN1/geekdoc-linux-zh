  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # So What Is Script-Fu?


    Although it sounds like a strange form of martial arts, Script-Fu is in fact a
    scripting language that is part of the GIMP With it, you can create scripts that
    automate a number of repetitive tasks to create desirable effects. When you created
    your logo, you might have noticed that a number of things were happening as it
    was being created. Another logo and watch carefully what is happening. These steps
    are part of a Script-Fu script.


    The GIMP comes with a number of Script-Fu scripts, and these are used for much
    more than just creating logos. Click Xtns on the GIMP toolbox, and scroll down
    to the Script-Fu menu. In addition to logos, you''ll see options for creating
    buttons (for Web pages), custom brushes, patterns, and more. Play Don''t be afraid.


    Open an image. Then right-click on that image and scroll down the Script-Fu part
    of the menu. Another menu drops down with selections such as Alchemy, Decor, Render,
    and so on. These are all pre-created effects that would ordinarily require many
    repetitive steps. Script-Fu is very much like a command script, where one command
    follows another. In this case, the commands just happen to be graphical transformations.


    # Becoming a GIMP Guru


    You can make some pretty cool images with the GIMP with a little knowledge, but
    with time and further exploration, you can take that cool to the level of amazing.
    Make no mistake, the GIMP is a professional-grade tool, and covering it in detail
    would fill a book of its own.


    Consider a visit to the GIMP home page at www.gimp.org for the latest developments,
    software, and links to other GIMP documents. Some great books specifically covering
    the GIMP. Visit your local computer bookstore, and have a look through the titles.
    I''m particularly fond of Michael J. Hammel’s book, “Artist’s Guide to the GIMP”
    Another title I''ve enjoyed is Joshua and Ramona Pruitt’s “Teach Yourself GIMP
    in 24 Hours.”'
  merge: -1
