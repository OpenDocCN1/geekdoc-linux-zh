    # Is That a Theme or a Motif?


    Not a musical theme, but a desktop theme. A theme is a collection of buttons,
    decorations, colors, backgrounds, and so on, on preselected and packaged to give
    your desktop a finished and coherent look. Some themes incorporate sounds (for
    startup, shutdown, opening and closing program windows, etc.) into the whole package.
    It can be a lot of fun.


    Then we have styles, which are sort like themes but not as all-encompassing. Styles
    tend to concentrate on window decorations and behavior, as well as widgets. Widgets
    are things like radio buttons, check boxes, combo boxes (drop-down lists), sliders,
    and so on.


    All right, I know you want to get to it and change your theme time or two, but
    first I''m going to tell you something rather important. Most (if not all) of
    the themes I''ve seen so far on customizing your desktop can be done through the
    KDE Control Center. You''ll find it by clicking on the big K and looking for Control
    Center. If you are having trouble locating it, remember that you can bring it
    up by pressing <Alt+F2> and typing in kcontrol, its program name.'
