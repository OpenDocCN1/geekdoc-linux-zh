  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # Nice, Colorful, Impressive, and Dynamic Graphs


    Creating a chart from the data you have just entered is really pretty. Start by
    selecting the cells that represent the information you want to see on your finished
    chart, including the headings. You can start with one corner of the chart and
    simply drag your mouse across to select all that you want.


    > Warning If there are some empty cells in your table (in my example, row A3),
    you will want to deselect them. You can do this by holding down the <Ctrl> key
    and clicking those cells with the mouse.


    Once you have all the cells you want selected, click Insert on the menu bar, and
    select Chart. The first window that appears (Figure 14–7) gives you the opportunity
    of assigning certain rows and columns. This is perfect because we have the quarter
    numbers running down the left side and the year running across the top. Check
    these on.


    Before you move on, notice the drop-down list labeled Chart results in worksheet.
    By default, Calc creates threebed pages for every new worksheet, even though you
    are working on only one at a time. If you leave things as they are, your chart
    will be embedded in your current page, though you can always move it to different
    locations. You have a choice at this point to have the chart appear on a separate
    page (those tabs at the bottom of your worksheet). For my example, I''m going
    to leave the chart on the first page. Make your selection, then click Next.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_231_0.png)


    Figure 14–7 The AutoFormat chart dialog.'
  merge: -1
