    # Navigating the Navigation Panel


    We should spend a couple of minutes looking at that navigation panel (the left
    side panel you open and close with <F9>) because it is quite important. You''ve
    already seen how to use it to navigate your file system, but wait (as they say
    on television), there''s more. Look at those tabs on the right side of the navigation
    panel. If you move your mouse over any of them, the tooltips will identify them.
    Click on them, and you''ll switch to whatever they offer. Click them again, and
    the navigation panel will slam shut, leaving only the tabs and giving you more
    viewing space in the main Konquerer window.


    Now about those tabs... The first is a bookmark tab. When we talk about using
    Konquerer as a web browser in the code, you''ll be using the bookmark feature
    a lot. For now, you should probably know that you can bookmark locations on disk
    (like your music collection, for example), you''ll want to bookmark that for easy
    access. You can also get to the bookmarks (or add them) by clicking Bookmarks
    on the menu bar.


    After the bookmark tab, you''ll see the history tab. Clicking it will show you
    a tree view listing various places on your disk (files and directories) or sites
    you''ve visited.


    The tab with a house on it is a direct link to your personal home directory. You''ll
    recognize it by the image of a little blue speaker with what appears to be pouring
    out. We''ll cover that later when we talk about multimedia. Below that is an icon
    with a globe of the Earth. The network tab provides you with a quick link to the
    KDE download areas (FTP sites) and Web pages. For these, you must be connected
    to the Internet. This is another area that we will cover later in the book.'
