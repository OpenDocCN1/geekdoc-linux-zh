  md: '# chapter


    # 15


    # Presentation


    # Graphics


    # (For Those Who Need No Introduction)


    Once upon a time, even a simple business presentation could be quite a costly
    affair. The person putting together a presentation would create his her presentation
    using a word processor (or pen and ink), then transfer all to a business graphics
    presentation tool. Alternatively, a special design service might be hired to take
    that next step, but eventually, the whole thing would be sent to yet another service
    that would create 35-mm slides from the finished paper presentation.


    On the day of the big meeting, the old carousel slide projector would come out,
    and the slides would be painstakingly loaded onto the circular slide holder. Then
    the lights would dim, and the show would begin. With any luck, the slides would
    all be in the right order, and the projector would not jam up.


    These days, we use tools that streamline this process, allowing us to create presentations,
    insert and manipulate graphical elements, then play the whole thing directly from
    our notebook computers. The projectors we use simply plug into the video port
    of our computers. There are many software packages to do the job under Linux.
    The most popular (and the one I will cover here) is part of the OpenOffice suite.
    It is called Impress. For those of you coming from the Microsoft world, Impress
    is very much like PowerPoint. In fact, Impress can easily import and export PowerPoint
    files.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# Getting Ready to Impress


    After having worked with OpenOffice.org''s Writer and Calc, you should feel right
    at home when it comes to Impress. Working with menus, inserting text, spell checking,
    and customizing your environment all work in exactly the same way. The editing
    screen itself is probably more like Calc than Writer in some ways. The Impress
    work area will have tabbed pages so you can easily jump from one of the presentation
    to the other. Each page is referred to as a slide. Given the history of business
    presentations—specifically, the making of these 35-mm slides—it''s probably no
    wonder that we still use the same terms when creating presentations with software
    like Impress.


    To start Impress, click on your application starter (the big K), select OpenOffice.org
    (or Office), and click on OpenOffice.org Impress in the submenu. You can also
    start a new presentation from any other OpenOffice.org application, such as Writer
    or Calc. Just click File on the menu bar, select New, and choose Presentation
    from the submenu.


    When you start up Impress for the first time, you''ll be presented with a number
    of choices. You can start with an empty presentation (Figure 1–1), work from a
    template, or open an existing presentation. Let''s work through a new presentation
    together.


    > Quick Tip At the time of writing, OpenOffice.org did not come with any Impress
    templates. As I''ve mentioned before, one of the differences between OpenOffice.org
    and StarOffice 6.0 (its commercial sibling) is that StarOffice 6.0 comes with
    a number of templates. That said, you can still download some free templates for
    OpenOffice.org from www.ooeextras.org.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_237_0.png)


    The AutoPilot allows you to select from existing presentations, as well as templates.
    For the moment, I''m going to stick with the very basics. Leave Empty presentation
    selected, and click Next. Step 2 (Figure 15–2) gives us the opportunity to select
    a slide design. Because we have none at in this moment, it is safe to click Next,
    but pause first and have a look at the options for output medium. By default,
    Impress creates presentations designed for the screen (or projector connected
    to your PC).'
  merge: -1
