    classic, such as cherry wood or a refined brushed aluminum. Using the <Alt+S>
    shortcut brings up the Skin Browser, which you can also select through the right-click
    menu. Mandrake Linux is particularly nice this way. This distribution includes
    a large number of skins for XMMS.


    If you don''t have any skins in your list, you need to get yourself some skins.
    For that, head to the XMMS Web site at www.xmms.org and click Skins on the menu.
    I guarantee you won''t be getting bored anytime soon. There are literally tons
    of skins available.


