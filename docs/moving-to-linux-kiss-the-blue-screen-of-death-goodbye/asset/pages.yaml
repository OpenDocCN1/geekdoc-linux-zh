    group. This makes for faster access.


    # Other Options


    I''ve concentrated on OpenOffice.org Writer perhaps because it is the real contender
    to Microsoft Office and the one that most people moving to Linux from the Microsoft
    Office world are likely to want to use. That''s not to say that is your only choice.
    For instance, the KDE suite comes with its own word processor, part of the KOffice
