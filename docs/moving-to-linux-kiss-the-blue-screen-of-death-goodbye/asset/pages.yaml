  md: '# # chapter

    # 8

    # Working with Devices


    Ah, hardware ... "I hate hardware!"


    Part of the personal computer experience seems destined to be an eternal battle
    in getting your current system to talk to the latest and greatest devices. There''s
    always a new, hyper-fantastic, 3D video card; mind-blowing stereo sound system;
    or hair-trigger game controller out there. Then there are more mundane things,
    such as modems, scanners, and printers. Getting all these devices to work with
    your system is something that has caused us all grief over time, regardless of
    what operating system we were running.


    We are used to assuming that anything works with Windows, but even that isn''t
    true. From time to time, even Windows users must visit hardware vendors; Web sites
    to download a driver. I personally spent several hours looking for and downloading
    an accelerated video driver for my little niece''s Windows computer so she could
    run a Barbie ice-skating program (she is my niece—I couldn''t really let her down).


    In this chapter, I''m going to give you the tools you need to deal with common
    issues and give you some tips on avoiding problems in the first place.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # # Yes, It Runs with Linux!


    Device support under Linux is excellent. No, really. The sheer number of things
    that work “out of the box” without you having to search for and install drivers
    is impressive, and quite frankly, beats your old OS. That doesn''t mean all is
    rosy, however. Let me brutally honest some have been written to work with Windows
    and only Windows ... or so it seems. One of the great things about this open source
    world is that developers are constantly working to write drivers to make it possible
    to run that faster-than-light-communication card.


    That said, if you haven''t already bought that gadget, there are a couple of things
    that you should do. For starters, if you are in the store looking at that new
    printer, pull the salesperson aside and ask whether it runs with Linux. If the
    person doesn''t know (which is sometimes a problem but less so as time goes on),
    take a few minutes to check out the excellent Hardware HOWTO document. You can
    always find the latest version by surfing over to the LDP''s Linux Hardware Compatibility
    HOWTO page:


    ```

    http://www.ldp.org/HOWTO/Hardware-HOWTO/index.html

    ```


    If you don''t find what you are looking for there, check out the hardware compatibility
    guide on your Linux vendor''s site.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_131_0.png)


    > **Quick Tip** Red Hat''s hardware compatibility guide is worth the visit, regardless
    of what version of Linux you are running. The URL follows. However, keep in mind
    that things do change on Web sites. If you don''t find it there, just go to the
    main Red Hat site at http://www.redhat.com and look for hardware.


    ```

    http://hardware.redhat.com/hcl/

    ```


    Here''s a hint. Once there, use the Quick Search option for a fast keyword search.


    Although Linux is Linux, different releases of different vendors'' products may
    be at different levels of development. Consequently, at one time or another, Red
    Hat may have slightly more extensive support for hardware than the others, and
    a month later SuSE may have the widest range of support.'
  merge: -1
