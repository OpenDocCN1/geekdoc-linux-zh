  md: '# chapter

    12

    Keeping Up to Date


    Nothing is ever perfect. Even when things are first released and all seems well,
    it takes only the passage of time to turn up errors of some sort. A typical Linux
    distribution can contain hundreds of packages and potentially thousands of files.
    Although great care is taken to make sure things are as perfect as they can be,
    with those numbers, some-times happen. Updates aren''t always about errors, either.
    Sometimes package updates reflect enhancements to the current software.


    The nice thing about problems with your Linux system is that those problems don''t
    tend to hang around for a long time. Thousands of programmers worldwide are involved
    in developing and maintaining the Linux kernel and the associated packages that
    make up what we call a distribution. When something goes wrong or a security bug
    surfaces, it is fixed and released to the community. Getting and applying these
    updates to your system is something you should be doing on a regular basis.


    These updates and patches may be free, but there are other considerations. Specifically,
    you''ll find that when you are doing system updates, your network connection is
    definitely an issue. A given update may include multiple packages, and some of
    these packages may be quite large. A slow modem connection may be too little for
    a major update. You could still perform the update, but you may be online for
    hours.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # Mandrake Update


    It''s quite easy to install updates to your Mandrake system. This is done through
    DrakConf (Mandrake Control Center), the all-in-one system administration tool
    that comes included with your Mandrake distribution. This interface lets you add
    users, configure your system, set up a firewall ... pretty much anything related
    to administering your system. It is also the means by which you can do an online
    update of the latest patches and security fixes.


    DrakConf is usually listed in your Mandrake K-menu under Configuration (you may
    see the KDE Control Center there as well). You can also run it from a shell (command
    name: drakconf) or via the <Alt+F2> command launch. Because this program requires
    administrative privileges to do its work, you will ask for the root password.


    When the Mandrake Control Center appears, click on Software Management in the
    left sidebar menu.


    You''ll have four choices here: to install software (you can use this as an alternative
    to kpackage, which we discussed in Chapter 7), to remove software, to update the
    packages on your system, or to maintain the package sources. To update the packages
    on your system, choose Mandrake Update. If you have never used this service before,
    Mandrake Update will provide you with a list of download mirrors to choose from.
    One that is close to you geographically. This will tend to provide you with faster
    downloads.


    Mandrake Update will return a list of packages that have been updated. Clicking
    on a package in that list will give you a description of the package and why it
    is being updated (Figure 12-1).


    Beside each package is a check box. To select a package for click on the box,
    and it will be replaced with a checkmark. Should any conflict arise or some package
    require another before it can be installed, Mandrake Update will inform you. If
    you are not sure what to pick and choose, simply select them all.


    When you are ready, click Install, and Mandrake Update will start downloading
    the packages in turn. When the download is complete, those packages will then
    be installed.


    # Red Hat up2date


    Red Hat also provides an easy interface for keeping your system up to date, and
    it is actually called up2date. This program is the front end to Red Hat''s Hat
    Network, a premium service that nevertheless offers a free demo service.'
  merge: -1
