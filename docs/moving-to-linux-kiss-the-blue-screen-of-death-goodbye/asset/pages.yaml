  md: '# Moving Linux: Kiss the Blue Screen of Death Goodbye!


    If the Linux kernel has the appropriate device drivers available as modules, they
    will be loaded automatically, and nothing else needs to be done to make the device
    available. The reason that this information is useful is to do with those times
    when you do not have a driver handy or directly available. Being able to get the
    details on the troublesome device in this way is the first step toward getting
    it.


    A classic example of this is the Winmodem, so called because it was designed specifically
    with Windows. If you have one of these modems and it was not automatically configured
    by the system, never fear. I''ll talk about Winmodems in more detail later in
    the chapter. For the moment, let''s talk USB.


    # USB Devices


    The whole idea behind USB was eventually to replace all those different connectors
    on the back of a computer. That includes serial ports, parallel ports, and mouse
    and keyboard connectors. The acronym stands for Universal Serial Bus. To get a
    list of USB devices, click on the USB Devices information category. On any USB
    system, there will be at least one hub and whatever devices are attached. If you
    look at Figure 8–3, you will see a generic webcam and an Epson scanner connected
    to my system.


