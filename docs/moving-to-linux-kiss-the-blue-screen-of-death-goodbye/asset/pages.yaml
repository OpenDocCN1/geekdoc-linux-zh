  md: '# The Hunt for Typos


    For years, I''ve been including the tag line This massage was not speal or grammar-checked
    in the signature section of my emails. Given that I continue to use this line,
    I am obviously amused by it, but never running a spell check is far from good
    practice when your intention is to turn it in a professional document.


    OpenOffice.org Writer can do a spell check as you go without actually correcting
    errors. Click Tools on the menu bar, then Spellcheck, and select AutoSpellcheck.
    Words that do not appear in the dictionary will show up with a squiggle red line
    underneath them, which you can then correct. Many people find this a useful feature,
    but some, like myself, prefer to just check the whole document at the end of our
    writing.


    To start a full spell check, click Tools on the menu bar, then Spellcheck, and
    click on Check. You can also just press <F7> at any time to start a spell check.


    # What Language Is That?


    OpenOffice.org supports many different languages, and depending on where you picked
    your copy, it may be set for a different language than your own. To change the
    default language, click Tools on the menu bar, then Options, Language Settings,
    and Writing Aids.


    The dialog box that appears (Figure 13–3) should have OpenOffice.org MySpell Checker
    checked on. You can then click the Edit button next to it and select your language
    of choice under the Default languages for documents drop-down box. When you have
    made your choice, click OK to exit the various dialogs.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_210_0.png)


    Figure 13–3 Configuring writing tools.'
  merge: -1
