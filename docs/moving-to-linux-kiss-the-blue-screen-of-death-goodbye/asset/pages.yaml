  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    OpenOffice is actually the free sibling of the commercial StarOffice suite. When
    Sun Microsystems decided to open the source to StarOffice, it became another boon
    for the open source community, not to mention the average user. OpenOffice became
    the free version of this powerful word processor, spreadsheet, and presentation
    graphics package, and StarOffice became the corporate choice. Both of these are
    full-featured office suites, and familiar with Microsoft Office will feel right
    at home with the similarities.


    You might be wondering what differences exist between these two sibling suites.
    The great difference is the price. For anyone with a reasonably fast Internet
    connection (or a helpful friend), OpenOffice is free. StarOffice, on the other
    hand, will cost you something for the boxed set. Included with StarOffice is documentation
    and support, as well as additional fonts and clip art. That you''ll say, it is
    still far less expensive than the Windows alternative.


    If you are following along and with the KDE desktop, you probably have KWord at
    your disposal. Then, as I hinted, there are the others. We''ll talk about a few
    of them at the end of this chapter.


    > Trivia Time It may interest you to know that this book was written using OpenOffice
    1.0.1 (and 1.0.2), as well as its commercial cousin, StarOffice 6.0.


