  md: '# # chapter 13

    Word Processors (It Was a Dark and Stormy Night...)


    Sorry, but at some point, I just had to use that famous opening from Edward George
    Bulwer-Lytton''s “Paul Clifford” (written in 1830). Those famous words “It was
    a dark and stormy night” were made even more famous (infamous?) by Charles M.
    Schulz''s Snoopy, that brainstorming literary beagle. It just seems fitting considering
    this chapter''s topic—word processors.


    Word processors run the gamut in terms of complexity, from simple programs that
    aren''t much more than text editors to full-blown desktop publishing systems.
    Users coming from the Microsoft world are most likely to use OpenOffice Writer,
    part of the OpenOffice.org suite.'
