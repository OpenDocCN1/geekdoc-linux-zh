    Incidentally, you don''t you have to have a wallpaper. You can create a nice,
    plain background by going to the Wallpaper tab and clicking the No Wallpaper radio
    button. After that, you would select one or two colors from the Background tab.
    The Mode lets you select different ways of blending the colors.


    # Save My Screen, Please!


    Okay, screensavers don''t really much screen saving these days. The idea, once
    upon a time, was to protect screens for phosphor burn-in. Old-style monochrome
    screens were particularly bad for this. In time, the letters from your menus (we
    were using text in those days) would burn in the phosphor screen. Even when you
    turned off the monitor, you could still see the ghostly outline of your most popular
    application burned into the screen itself. As we moved to color screens and graphics,
    that changed somewhat but the problem continued to exist for some time, partly
    due to the static nature of the applications we were using.


    Time passes, and some bright light somewhere could get the idea that if you constantly
    changed the image on the screen, that type of burn-in would not be as likely.
    What better way to achieve this than to have some kind of clever animation kick
    when the user walked away from the screen for a few minutes (or hours). Heck,
    it might even be fun to watch. Theaver was born. Modern screens use scanning techniques
    that all banished burn-in, but screensavers did not go away. Those addictive fish,
    toasts, peppers, penguins, spaceships, etc., etc., we have managed to keep us
    entertained, despite the mark of technology. Let''s face it, we are all hooked.


    Depending on your distribution, your screensaver may or may not already be active
    by default. Getting your screensaver setup involves the same first steps as changing
    your background. Right-click on a clear part of the desktop and choose Configure
    Desktop. The desktop configuration card will appear (“You can customize the desktop
    here”). On the left side of that card, there''s an item called Screensaver. Click
    away.'
