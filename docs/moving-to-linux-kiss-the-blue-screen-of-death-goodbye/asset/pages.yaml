    The limitation of the demo service becomes evident during busy periods, at which
    times your up2date client will inform you that network load is too high to allow
    nonpaying customers to use the service. I''ve found that waiting until after business
    hours to perform updates is usually a satisfactory solution. For pricing and premium
    services on the Red Hat Network, visit http://rhn.redhat.com.


    # Running up2date


    You''ll find up2date under the System Tools submenu (under the big K) but it may
    be listed as Red Hat Network instead. Optionally, you may start up2date from the
