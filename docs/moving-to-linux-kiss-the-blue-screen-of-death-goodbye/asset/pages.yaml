  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    Double-clicking on the title bar will shade your program—the application will
    appear to roll up like a window. Now move your mouse pointer to the title bar,
    and it unrolls. Move off the application completely, and it rolls up again. Double-click
    on the title bar again, and the application will un and stay unrolled. Doing this
    with a number of running applications is an interesting phenomenon that takes
    some getting used to, kind of like someone reading your mind.


    The title bar also has a number of small icons. Pass your mouse cursor over them,
    and a tooltip will inform you of their functions. Starting at the left-hand corner
    of the title bar, there are two icons of interest. The far left brings you a small
    drop-down menu makes it possible to move the program to another virtual desktop
    and to minimize or maximize the application (among other things).


    You may also have a push-pin (or stick-pin) icon beside the menu—this makes a
    window sticky. Clicking it makes it sticky. Click on one of your three virtual
    desktops. If you haven''t already excited dozens of programs on each, you should
    find yourself with a nice, clean desktop. Now go back to your first virtual desktop.
    Click the stick-pin icon. Jump back to virtual desktop two. Conqueror is there.
    Click on desktop number three, and there is also. In fact, if you have 10 virtual
    desktops, Conqueror will be waiting for you on all of them.


    Here''s a cool bit of information, however. You are still running one instance
    of Conqueror. It''s just that it is available to you every desktop. Finally, if
    you stick the window on virtual desktop one and youstick it on virtual desktop
    three, it will stay on desktop three.


    Before we move on other things, we need to look at the buttons on the right-hand
    side of the title bar. You use the icon that has a dot in the center to minimize
    (or iconize) a window (remember that you can pause over the top with your mouse
    button to get the tooltip). The icon with a square in the center maximizes a window,
    causing it to take up every bit of space on your desktop except for Kicker''s
    panel. Finally, the X does pretty much what you would expect to. It closes a running
    application.


    # On to the Menu Bar


    Directly below the title bar is the menu bar. The menu bar will generally have
    a number of labels (such as File, Edit, View, and so on), each grouping the things
    you can do into some kind of sensible order.


    Every program will have a different set of menu options, depending on the nature
    of the application. Clicking on a menu label will drop down a list of options
    for that function (see Figure 4-10).'
