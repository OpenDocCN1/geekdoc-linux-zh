    # Standard Input and Standard Output


    It may sound complicated, but it isn''t. Standard in (STDIN) is simply where the
    system expects to find its input. This is usually the keyboard, although it can
    be a program or shell script. When you change that default, you call it redirecting
    from STDIN.


    Similarly, standard out (STDOUT) is where the system expects to direct its output,
    usually the terminal screen. Again, redirection of STDOUT is at the discretion
    of whatever command or script is executing at the time. The chain of events from
    STDIN to STDOUT looks like this:


    ```

    standard -> Linux command -> standard

    ```


    STDIN is often referred to as fd, or file descriptor 0, and STDOUT is usually
    thought of as fd.. There is also standard error (STDERR), where the system reports
    errors in program execution. By default, this is also the terminal. To redirect
    STDOUT, use the greater-than sign (>). As you might have guessed, to redirect
    from STDIN, use the less-than sign (<). But what exactly does that mean? Let''s
    try an experiment. Randomly search your brain and pick a handful of names. Got
    them? Now type the cat command and redirect its STDOUT to a file called random_names.


    ```

    cat > random_names

    ```'
