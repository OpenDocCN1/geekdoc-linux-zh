- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    selection and click OK. Should you happen to know your latitude and longitude,
    you can simply enter that at the bottom of the window. Explore. Learn. The universe
    is yours!


    # Learn to Type


    In this day and age, learning to type is a life skill. From what I have seen,
    a fool-proof voice recognition system is still some time off. For years, it has
    been my dream to be able to speak my thoughts and have them appear in my word
    processor or text editor, but I have seen nothing that works faster than just
    typing. What I''m saying is that everyone, including kids, should learn to type.


    As part of the kdeedu package, you''ll find a package called KTouch (command name
    touch), a great typing typing program. Besides a tutor, KTouch looks great while
    doing the job. The display highlights key to press as you go along, and the color
    coding tells you which finger to use (Figure 18-12). It supports multiple keyboard
    layouts, tracks your performance, and automatically changes levels, based on that
    performance.


    If the kids are particularly young, KTouch may not seem like a great deal of fun.
    Another way to get them into the spirit of learning is with a game called


    ![](img/6227ceb576e6091f42ed74eec527c9b4_323_0.png)


    **Figure 18-12** Learn to type with KTouch.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Chapter 18 Fun and Games (Very Serious Fun)


    # 303


    ![](img/6227ceb576e6091f42ed74eec527c9b4_324_0.png)


    Figure 18–13 Learning to type becomes a game with TuxTyping.


    TuxTyping (Figure 18–13). This one isn’t likely to be on your distribution disk,
    but head over to the Web site and pick up a copy at http://www.geek-comix.com/dm/tuxtype.


    TuxTyping features a pleasant musical soundtrack, friendly graphics, colorful
    background images, and multiple levels of increasing difficulty. Furthermore,
    when you complete a level, TuxTyping rewards you with applause that can be quite
    raucous at times. There’s also a free-type mode where Tux stands inside something
    that looks like the holodeck. You might find this ideal level for the beginner.
    I particularly like waiting until the letters are almost at ground level before
    I let Tux go for them. It’s great fun to see him run for it. Otherwise, he just
    lazily makes his way over to the fish. If you have kids and you want to teach
    them to type, get TuxTyping. They will love you for it.


    # That Potato Guy


    I can’t honestly say whether this qualifies as educational (although it does force
    you to use your imagination), but it does qualify as fun. What I am talking about
    here is Potato Guy (command name ktubling), a computerized version of the potato-head
    game where you plug various plastic eyes, ears, noses, and'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'hats into a plastic potato to create a funny-looking potato person (Figure
    18–14). The official Mr. Potato Head is, of course, the famous store-bought version
    of this game, sold by Hasbro. I’m old enough to remember when the potato wasn’t
    included with the game. You used a real potato.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_325_0.png)


    Figure 18-14 KTuberling, aka the "Potato Guy."


    As you add the various pieces to the potato guy, a friendly voice speaks out the
    names of those parts. "Nose" "Eye" "Spectacles." Change the playground(click Playground
    on the menu bar), and you can dress up Tux the penguin or create an aquarium scene
    in the same way.


    Yes, I know it is a kid’s game, but I have a lot of fun with this simple diversion.


    # The Edutainment Pack


    I’m going to wrap up this section on educational games by telling you a bit more
    about one of the packages that comprises KDE, the one called kdeedu. In it, you
    will find a scrambled word-guessing game called KMessedWords (command-name kmessedwords),
    as well as KHangMan (command name khang-man), another word-guessing game.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Chapter 18 Fun and Games (Very Serious Fun)


    # 305


    The package also contains some more advanced items, including KPercentage (command
    name kpercentage), a math testing game using (what else?) percentages; KGeo (command
    name kgeo), an interactive geometry program; and KAlzium (command name kalzium),
    an interactive periodic table of the elements with a Web lookup.


    There is quite a lot of work going on in this area. For more details (and to see
    what else is in works) visit http://edu.kde.org.


    # 3D Accelerated Fun


    To truly appreciate the following pastimes, you will require a 3D accelerated
    video card and OpenGL or Mesa 3D video libraries. Many manufacturers sell these
    cards, and some are extremely well supported under Linux. Even when the card is
    supported, the manufacturer of the card may not distribute driver for inclusion
    with the Linux distributions themselves. That doesn''t mean they aren''t available,
    but you may have to visit the vendor''s site and download them. With some cards,
    full 3D acceleration is directly supported under XFree86, the graphical environment
    on your desktop runs.


    A quick way to test for the presence of 3D support is with the following command:


    ```

    glxinfo | grep rendering

    ```


    The system should respond with this:


    ```

    direct rendering: Yes

    ```


    Another nice test you can perform involves running a program called gears (part
    of the Mesa-demos package). To do this, you need to shell out (open a terminal
    or Konsole window), type the command name (gears), and press <Enter>. A window
    will appear with three gears spinning on your screen (Figure 18-15).


    Don''t get too distracted by the spinning gears. Look back at your terminal window,
    and you will see some statistics regarding the performance of your 3D hardware.


    1778 frames in 5.001 seconds = 355.529 FPS'
  merge: -1
  pgno: 326
- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    ![](img/6227ceb576e6091f42ed74eec527c9b4_327_0.png)


    Figure 18–15 gears, a 3D acceleration measuring tool.


    That result comes from my test (play) system running with an NVIDIA GeForce2 card,
    and it is reasonably impressive hardware performance. In contrast, my notebook,
    which does not have accelerated hardware, yields this result:


    312 frames in 5.004 seconds = 62.350 FPS


    Not having acceleration for your card does not stop the program from working,
    it''s just that it will run very slowly. On that note, let''s have a look at our
    section of 3D accelerated games, starting with a personal favorite.


    # FlightGear


    You may not know this (well, you do now), but your humble author is also a pilot.
    Consequently, I have a warm spot in my heart for FlightGear, an extremely impressive
    open source flight simulator (Figure 18–16). The developers of this incredible
    package have produced a beautiful thing. The scenery itself is breathtaking, and
    the coloration of land and sky is nearing photorealistic. You can also download
    scenery packs for every bit of land mass in the world,'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# Chapter 18 Fun and Games (Very Serious Fun)


    allowing you to fly and explore distant lands from the comfort of your own room.
    Fancy a lazy flight through the Grand Canyon? With FlightGear, it’s not a problem.


    FlightGear comes with a number of different aircraft models, from a single-engine
    Cessna to a Boeing 747, an A4 fighter (Figure 18–16), or even a Sop-with Camel.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_328_0.png)


    Figure 18–16 FlightGear, a great flight simulator.


    Now that I have sold you on this (hopefully), I should tell you that this is one
    you will have to get online (http://www.flightgear.org)—many distributions will
    not include it (partly because it can be a huge program). Multiple packages are
    also involved in this one (and don’t forget the scenery), so make sure you read
    the information on the Web site carefully. Despite the extra work, the rewards
    for this one are also worth it.


    # TuxRacer


    The days, the official TuxRacer game (Figure 18–17) is actually a proprietary
    game (available at www.tuxracer.com), although it did start out as an open source
    project. Because of those GPL’ed, open source roots, you can still get'
  merge: -1
  pgno: 328
- img_proc: true
  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    ![](img/6227ceb576e6091f42ed74eec527c9b4_329_0.png)


    hands on the original TuxRacer from many different download sites. In fact, many
    distributions include it on the disk, so look there first. If you can''t get enough
    of the free game, perhaps you''ll pay the official site as a visit.


    The idea is simple. Tux races down snow or ice covered mountains on his belly.
    As the speed increases, you try to dodge obstacles while picking up her-ring along
    the way. The action is fast-paced and exciting, with Tux taking flight off the
    occasional cliff or ramp. All this as you race against the clock.


    # More Games! I Need More Games!


    Well, it was bound to happen. As you can imagine, there are tons of games out
    there. Some are commercial packages, and others are free for the download (or
    compile). Still more are in various stages of development and playability.'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'To satisfy your hunger for Linux games, you might take a little time browsing
    in the games on either SourceForge (www.sourceforge.net) or FreshMeat (www.freshmeat.net).
    You''ll find plenty there. at


    One of my favorite sites for games is the Linux Game Tome at happypenguin.org.
    Although not a download site, the Linux Game Tome organizes, reviews, and lets
    users rate games. It''s organized and searchable, and it should be on your list
    when it comes to adding some new diversions to your system. If you are looking
    specifically to find games for the younger kids, check out Linux for Kids at http://www.linuxforkids.com.

    Play on!


