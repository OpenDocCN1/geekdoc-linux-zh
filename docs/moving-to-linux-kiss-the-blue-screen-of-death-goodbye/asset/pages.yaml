    # Windows XP Considerations


    Before we get into those details, please take note of the following statement.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_48_0.png)


    > Important Note Although the install tools included on the distribution CDs are
    very good at determining the presence of a Windows 95, 98, or ME partition and
    shrinking those for you, most cannot shrink a Windows XP NTFS partition. At the
    time of this writing, there was one exception to the rule—Mandrake 9.1 included
    a tool that could resize NTFS partitions, but it was the only one.


    What means, unfortunately, that FIPS and the magical tools included as part of
    the Linux install CD won''t work. Once again, there are two possibilities. One
    is to get your hands on a product called PartitionMagic (http://www.partitionmagic.com/),
    an alternative to FIPS. It''s a nice, friendly, commercial package that enables
    you to modify your partitions on the fly, including NTFS partitions such as those
    found on Windows XP systems.


    The second option is to back up your data, reformat your hard drive, and reinstall
    Windows XP from scratch, this time making sure that only half (or a third or quarter)
    of your disk has been allocated to Windows. Please be sure that you are completely
    comfortable with the idea of reinstalling XP before proceed.


    There is a third option, to Install Linux and forget about XP.


    # An Installation Comparison


    Modern installations offer a nice, graphical process and for the most part, installing
    Linux today is a point-and-click experience with help every step of the way. Of
    course, a graphical installation makes a lot of assumptions that you'
