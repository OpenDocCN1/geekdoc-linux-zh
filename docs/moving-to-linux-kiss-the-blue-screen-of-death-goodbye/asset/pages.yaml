    # Optical Character Recognition


    Before I wrap up this discussion of Kooka, let me tell you about one other very
    cool thing the program does. Say you have an old document page that you want to
    transcribe. The obvious choice is to sit it in front of you, open up a word processor,
    and start typing. Your second option is to pop that page on your scanner, use
    Kooka to scan it, then run it through OCR.


    Here''s how you do it. Because most people won''t be using OCR, most distributions
    don''t install the supporting software by default. `ocr-forge.net` (that is not
    a typo) or check your distribution CDs for a package called gocr and install it.
    Kooka uses it to do OCR.


    Start by scanning your page as you would imagine. Binary scan mode is probably
    fine for straight text but this is one case where the higher resolution, the better
    your chances are of an accurate OCR. When you are happy with'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'The preview, click Final Scan, and you should see your page in the right-hand
    window. Now click ImageCanvas on the menu bar, and select OCR image. Alternatively,
    you can click the second icon from the left-in in the OCR bar—it does the same
    thing.

    A window labeled Optical Character Recognition will pop up (Figure 16–9), which
    allows you to specify a handful of settings to tune the character recognition
    software. Remember; OCR is not perfect by any means but with some tweaking, you
    can achieve fairly high levels of accuracy. For your first scan, simply leave
    it at the defaults and click Start OCR. The whole process of character recognition
    may take a few seconds, so be patient.


