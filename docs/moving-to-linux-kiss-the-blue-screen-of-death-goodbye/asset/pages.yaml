    # Pipes and Piping


    Sometimes the thing that makes the most sense is to feed the output from one command
    directly into another command without having to resort to files between every
    step of the way. This is called piping. The symbolism is not that subtle: Imagine
    pieces of pipe connecting one command with another. Not until you run out of pipe
    does command''s output emerge. The pipe symbol is the vertical bar on your keyboard,
    usually located just below or (depending on the keyboard) just above the <Enter>
    key and sharing space with the backslash key. Here''s how it works:


