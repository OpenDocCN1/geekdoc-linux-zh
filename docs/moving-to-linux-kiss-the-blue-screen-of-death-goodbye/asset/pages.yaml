    # Windows, Title Bars, and Menus, Oh My!


    Each graphical program that runs on your desktop will have certain common characteristics.
    Have a look at the top of your Konqueror window, and you will see something like
    Figure 4–9.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_74_0.png)


    Figure 4–9 Most windows will have a title bar, as well as a menu bar.


    # The Title Bar


    The top bar on a running program is called the title bar. Depending on the application,
    it may display a program name, a document you are working on, or a nice description
    explaining what you are running. Left-clicking on the title bar and dragging it
    with the mouse will move the program window around your desktop.


    > Quick Tip Most desktops assume a fairly sizeable monitor running at at least
    1024x768, and a number of applications assume this to be a universal truth. This
    plays havoc when your monitor is smaller than this (say, 800x600) and the buttons
    you need to click are off screen. Clicking the title bar and dragging the window
    gets you only so far.


    Don''t despair. By pressing the <Alt> key and left-clicking on a window, you can
    drag it anywhere you wish, including beyond the boundaries of your desktop. This
    is particularly handy if you need to get at a hidden OK button.'
