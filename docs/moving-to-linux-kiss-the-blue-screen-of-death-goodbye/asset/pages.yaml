    dream device is part of standard Linux.


    We''ll talk about devices and drivers later in the book.


    # Software Packages


    There is a huge amount of software available for the Linux operating system; unfortunately,
    most of it is not commercial. On the one hand, you can download thousands of games,
    tools, and Internet and office applications to run on your system. Much of it
    will cost you more than the time it takes to download it.


    On the other hand, commercial, shrink-wrapped software, including those hot new
    3D games at your local computer store, is still hard to come by. As Linux grows
    in popularity, particularly on the desktop, this is starting to change.


    That said, there is software available for Linux that makes it possible to run
    Windows software. I will talk more about that in the next chapter.


