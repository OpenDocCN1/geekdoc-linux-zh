    If you just go ahead and click Rip Only, the track will be saved in wav-format
    (remember our compression). Click Rip+Encode, however, and Grip will encode and
    compress the disk file into ogg or mp3 format. The de-fault encoder is ogg format.
    To save as mp3, you will need an mp3 encoder, such as bladeenc or lame (check
    ripfind.net for binary RPMs or check the re-sources section at the end of this
    chapter).


    When the process starts, a progress indicator bar (about two-thirds of the way
    down) will detail the status of the rip. The resulting songs will be saved in
    your home directory under a folder called mp3, using the following format:


    ```

    /home/username/mp3/artist_name/album_name/track_title.ogg

    ```


    You can change this default by clicking the Config tab and selecting MP3 Encoder.
    There are a list of possible settings: dealing with the ripping process itself,
    MP3 encoders, online disc information servers, and file formats. The options are
    many, but the defaults are probably all you need if you are writing songs to your
    disk. Grip comes with excellent help files for every part of this process. If
    you get stuck, just click the Help tab.


    You''ll notice I said to your disk at the end of the last paragraph? That''s because
    Grip is strictly a ripping and encoding program. If you want to get those songs
    burned to CDs, you''ll need a CD burning package. Luckily, this won''t be a problem.


    # K3b for a Friendlier Burn


    I still find it interesting to consider the terms that have entered the language
    when referring to creating CDs. We rip, then we burn.


    Considering the violent-sounding nature of the process, anything that simplifies
    the process and makes things little friendlier is certainly welcome. One of the
    friendliest tools for creating and copying audio and data is called K3b. You may
    have K3b available on your system, but if it isn''t, simply visit www.k3b.org.
    Both source code (it is GPLed, after all) and precompiled binaries are available.
    The program name (which you wish to run it from the shell or via the <Alt+F2>
    launcher) is k3b.


    Installation Note K3b depends on the cddao package.


    When you fire up K3b for the first time, you''ll get a little warning message
    alerting you to this fact and advising that you should consider running K3b'
