  md: '# Chapter 17 Multimedia (If Music be the Food of Love...)


    # Ripping and Burning Songs


    Over the years, we have all purchased a lot of music CDs or, or as some of us
    still call them, albums. Many of those albums, unfortunately, have only two or
    three songs we really liked, so playing the whole album wasn''t what we wanted.
    As a result, we created collections of our favorite songs on tape and played the
    tapes, instead.


    These days, with the help of our Linux systems, we can create our own collections
    from those albums we have purchased and create CD collections of those songs we
    want to hear. Furthermore, if you have lots of disk space and spend a lot of time
    at your computer, nothing beats a collection of songs ready to play without changing
    CDs all the time. Pulling songs from a CD and saving them to your system as digital
    images is what is commonly referred to as ripping.


    # Intermezzo: Digital Audio Formats


    Before I get into the mechanics of ripping and burning songs, I''d like to spend
    a small amount of time discussing music formats. When you purchase a CD, the songs
    on that CD are in a format not generally used by your system. In fact, when we
    copy songs to disk from a CD, we always encode it into another, usually a more
    compact format. The format we transfer to is identified by a three-letter extension
    on the file name. The most common formats are .wav, .mp3, and (more recently)
    .ogg.


    The wav format is originally created by Microsoft. It is extremely common but
    not the most efficient in terms of compression. The mp3 format (from the Motion
    Pictures Experts Group, aka MPEG) on the other hand, owes its popularity to the
    high compression ratio it uses—about 12:1. The newcomer on the block is ogg (or
    O Vorbis format). Like mp3, it boasts a high compression values, but unlike mp3,
    it is completely unencumbered by patents.


    To give you an idea of the compression values, I ripped a 3-minute, 46-second
    song to wav format. It came in 39866444 bytes, while the same song in ogg format
    required only 3438407 bytes. If you do the math, that is a ratio of 11.6:1. Pretty
    impressive reasons for not using wav formats.


    # Grip


    Most distributions will come with Grip, a CD ripper designed for the GNOME desktop.
    As I''ve explained before, being GNOME-based doesn''t stop this program from doing
    its job under KDE. Using a library called cdparanoia (which I'
  merge: -1
  pgno: 292
- img_proc: true
  md: 'we discuss later), Grip makes it possible to create MP3s or OGs easily from
    your favorite CD. If the program is installed, you will likely find it in your
    multimedia menu. You can also call it by its program name (using the shell or
    the <Alt+F2> program launcher), grip.

    Grip consists of a single window with multiple tabs. Each tab presents a window
    with which various functions are performed (i.e., Tracks, Rip, and Config). The
    main Tracks tab features a list of the current CD''s audio tracks, including track
    number, title, and length in minutes and seconds. The CD''s title and artist appear
    just above the track window.

    As you can probably tell by looking at Figure 17–10, Grip is also a CD player.
    Using the buttons at the bottom of the program window, you can play, pause, fast
    forward, or reverse playback, just as you did with KsCD. The extra buttons let
    you open or close the CD-ROM drive, change the volume, edit tracks, perform track
    lookups, or switch to compact, player-only mode (Figure 17–11). If you move your
    mouse over the buttons and pause, tooltips will appear, informing you of the various
    button functions.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_293_0.png)


    Figure 17–10 Grip ripping songs from a CD.'
