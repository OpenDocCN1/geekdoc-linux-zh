  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    # Security Revisited


    "Is he crazy?"


    You might be thinking security is a strange topic to revisit when we are discussing
    fun and games. It''s actually not, partly because this is one of the times when
    keeping certain people out of certain places is a plus. I''m talking about the
    kids.


    As I mentioned earlier in the book, Linux is a multiuser operating system, meaning
    that one or more users can work on it at the same time. This also means that each
    person using your system is an individual, with his or her own home directories,
    files, menus, and desktop. By creating a login for each member of your family
    or office, you not only protect the files belonging to each user, but also protect
    yourself. If little Natika deletes all her icons or changes the desktop to a garish
    green palette, it doesn''t affect you. Similarly, this is a great opportunity
    to create a play world for the kids.


    Each user is referenced by a username. Each username has a user ID (UID) associated
    with it and one or more groups. Like usernames, group names are also represented
    by a numeric identifier, this time called a group ID (GID). A user''s UID is unique,
    so it is a group''s GID.


    Adding users requires that you operate as root, when you launch the KDE User Manager
    (command name kuser), you will be asked for the root password. When the program
    starts, a window will appear like the one in Figure 18–1. There will be two tabs,
    for Users and the other for Groups.


    ![](img/6227ceb576e6091f42ed74eec527c9b4_313_0.png)


    Figure 18–1 The KDE user management tool.'
