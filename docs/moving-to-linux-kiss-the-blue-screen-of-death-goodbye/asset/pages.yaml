  md: '# Chapter 14 Spreadsheets (Tables You Can Count)


    # A Beautiful Thing!


    When you are through with your worksheet, it is time to print. Click File on the
    menu bar and select Print. Select your printer, click OK, and you''ll have a product
    to impress even the most jaded bean counter.


    # Alternatives


    Because OpenOffice.org is such an obvious and excellent replacement for Microsoft
    Office (including Word, Excel, and PowerPoint), it''s easy to forget that there
    are other alternatives. One of the great things I keep coming back to when I talk
    and write about Linux is the fact that we have alternatives, some costing no more
    than the time it takes to download and install them.


    When it comes to spreadsheet programs, your Linux distribution CDs-like with a
    few spreadsheet programs. The primary candidates are Gnumeric, KSpread, and the
    program we just looked at, OpenOffice.org''s Calc. Both Gnumeric and KSpread are
    certainly worth a look, but I''ve found Gnumeric to be particularly good when
    it comes to working with Excel spreads.


    # Resources


    +   Gnumeric

    - http://www.gnome.org/projects/gnumeric/


    +   KSpread

    - http://www.koffice.org/kspread/


    +   OpenOffice.org''s Calc

    - http://www.openoffice.org/'
