  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    ![](img/6227ceb576e6091f42ed74eec527c9b4_257_0.png)


    **Figure 16-3** Using kedit to edit the scanner model file.


    model file you need, just type it in the Location: field and press<Enter>. Otherwise,
    you can navigate your folders just as you would in Konqueror.


    Make the changes as discussed above (Figure 16–3). Remove the character from the
    line that corresponds to your scanner device, then click File | Save, then File
