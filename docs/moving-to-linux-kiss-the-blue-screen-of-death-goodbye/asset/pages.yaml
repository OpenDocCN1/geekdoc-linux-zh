    When you press <Enter>, a new window will appear, the User Properties dialog (Figure
    18–2). You don''t really need to add anything new here, but there are fields provided
    to further identify the person for whom you are creating the login. For instance,
    you can choose to enter his or her full name, office location, or home address.


