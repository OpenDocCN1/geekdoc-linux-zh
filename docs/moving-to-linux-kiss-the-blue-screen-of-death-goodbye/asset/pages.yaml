  md: '# Chapter 5 Conquerying Your World


    # Uh, Roger, Copy That…


    You can create, copy, move, rename, and delete files and directories using Conqueror,
    but before you can do any of these things, you need to select a file or directory.
    Selecting files is something you will be doing a lot, so let''s start with that.
    Place your cursor just outside one of the icons of your choosing. Now drag your
    cursor across the icon and notice the dashed-line box you are creating as you
    drag the pointer. You''ll know a file is selected because it becomes highlighted.
    Right-clicking also selects a file in a somewhat different way, bringing up a
    menu dialog that will ask you what you want to do with that.


    Don''t forget your cursor keys either. Moving left, right, up, or down will highlight
    whatever file or directory you happen to be on. Then you can click on Edit in
    the menu bar (or press <Alt+E> to get to the edit menu) and decide what you want
    to do with it. I''ll talk about those decisions in a moment.


    Sometimes, one isn''t just enough—you need to select multiple files. The easiest
    way of all is with the mouse. Left-click to the top and left of the icon you want
    to start with, then drag your cursor across a series of icons. Notice the dotted-line
    box that surrounds the files and directories you select. Perhaps you want just
    a file and a here. How do you pick and choose multiple files? Simply hold down
    the <Ctrl> key and drag with the mouse. Let''s say that you have selected a group
    of four files, and you want one further down in your directory. Let go of the
    mouse button (keep holding down the <Ctrl> key), position your mouse to the top
    and left of the next group of icons, select away. As you continue to hold down
    the <Ctrl> key, you can pick up and select files here and there.


    It is also possible to do all these things with the cursor keys by simply moving
    over the file you want to start with, holding down the <Shift> key, and moving
    the cursor to the left (or wherever you like). As you do this, you''ll notice
    file name after file being selected. Try it for nonsequential selection, use the
    <Ctrl> key as you do with the mouse. Select (or select) the files by pressing
    the spacebar. When your cursor is sitting on the file you want, press the spacebar,
    and your files will be highlighted.


    Finally, and quite important for the future, you can also select by extension.
    Extension in your directory. Click Edit on the menu bar, then Click Select. A
    small window will pop up, asking you for an extension. If you wanted all the .mp3
    files, you would enter *.mp3. The .mp3 extension will limit your selection to
    a certain type of file, whereas the asterisk says "give me everything" that matches.'
