  md: '# Moving to Linux: Kiss the Blue Screen of Death Goodbye!


    Next, we have the lasso tool. This is another selection tool, but this one lets
    select irregular or hand-drawn regions. Hold down the left mouse button and draw
    your selection around the object.


    > Quick Tip When you have selected an area on an image, you can right-click, move
    your mouse cursor over the Edit menu, and select Cut or Copy. You can then Paste
    your selection back to another part of the image.


    Then comes the magic wand. This is a strange tool to get used to. It selects an
    area by analyzing the colored pixels wherever you click. Holding down the <Shift>
    key lets you select multiple areas. This is a very useful tool but also a little
    tricky. Double-click on the icon to change the sensitivity.

    We wrap up the first row with the Bezier tool, which to be honest takes some getting
    used to. Once you get used to it, however, youll be impressed with the flexibility
    it affords in selecting both straight and curved areas. Click a point outside
    the area you want to select, and it creates an anchor point. Click again a little
    further along your outline, and you get new anchor points with a straight line
    connecting to the original. Click and drag an existing anchor point, and a bar
    will appear with control boxes on either end. You can then grab those control
    points and drag or rotate them to modify the straight line between the points.
    Once you have joined the final point, click inside the outlined region, and this
    completes your selection (you''ll see an dotted line, as with the other selection
    tools).

    That wraps it up for the first row of tools. It''s time to look at the next set
    (Figure 16–23).


    ![](img/6227ceb576e6091f42ed74eec527c9b4_275_0.png)


    Figure 16–23 Second icon group.


    We still got one last selection tool to look at, the so-called intelligent-scissors.
    These will remind you somewhat of the Bezier tool, in that you select an area
    by clicking around it. What this tool does that the other does not follow curved
    lines around an object. It does so by concentrating on areas of similar contrast
    or color. Simply click around the perimeter of the area you wish to select and
    watch the lines magically draw themselves. When you join the last dot, click inside
    the area to select it.'
