    # Scanning . . .


    There are many scanner options available: from old-fashioned parallel port devices
    to SCSI-connected scanners. These days, most people will choose a USB scanner
    for its low price and easy connection to the system. With all devices, a visit
    to the USB devices for Linux Web site will save you (and money) by helping you
    select a device that is well suited to run under Linux. If your scanner is connected
    to your system when you installed Linux, parts of the following section may not
    apply since your system may have already configured your scanner for you. Still,
    you should follow along to understand how all this happens.


    Start by plugging in your scanner and, if necessary, turning it on (some scanners
    are on as soon as you plug them in). Any recent Linux distribution will do a very
    nice job of automatically noticing your scanner and loading the appropriate driver.
    Depending on your system, your USB scanner will be represented by the file name
    `/dev/scanner0` or `/dev/usb/scanner0`. You may want to check for the existence
    of this file: Open a shell and type the following:'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Chapter 16 Graphics and Art (Just Call Me Leonardo)


    ```

    ls -l /dev/scanner0

    ornls -l /dev/usb/scanner0

    ```


    Another way to check for the existence of your scanner is to use the following
    command:


    ```

    sane-find-scanner

    ```


    You''ll get several lines of text and information. In particular, you are looking
    for those lines that begin with the word *found*.


    ```

    found USB scanner (vendor=0x04b8, product=0x0110) at /dev/usb/scanner0

    ```


    Before you can use your USB scanner, you may have to do a little setup work. Luckily,
    this is pretty simple, and you *only have to do it once*. For starters, it is
    possible that you *may have* to create the device file for your scanner manually.
    If the file isn''t there, open a shell and switch to the root user.


    ```

    su - root

    ```


    Then use the following commands to create the USB scanner device file and make
    it usable by all users.


    ```

    mknod /dev/usbscanner0 c 180 48

    chmod 666 /dev/usbscanner0

    ```


    You are almost there. Still running as root, change directory to /etc/sane.d and
    do ls in number of files ending in .conf, prefixed by a scanner brand name. In
    the case of my Epson scanner, I had to edit the /etc/sane.d/epson.conf file and
    change the following line:


    ```

    # /dev/usb/scanner0

    ```


    That "#" character at the beginning denotes a comment. *Removing that character
    makes the line real (Figure 1–3).* If you don''t want to learn to use a programmer''s
    editor, KDE has a very simple one that you can use. It is called Kedit, and you
    can run it from your current shell by typing *kedit*. When the editor starts,
    click File on the menu bar, and Select Open File. You have seen this open file
    dialog before, so this is nothing new now. If you know'
