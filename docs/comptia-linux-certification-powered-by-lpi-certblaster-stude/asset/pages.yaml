  md: '# USB devices


    You can view a list of the USB devices attached to your computer using the lsusb
    command. With the -v option, the command outputs verbose information. You do not
    have to be root to use the command, though you will be restricted from viewing
    some of the verbose output. The command''s syntax is:


    ```

    lsusb [-v | -t]

    ```


    The information output by lsusb -v is read from the /proc/bus/usb/devices file.
    This special file is created by the kernel during boot time and the operation
    of your computer. It represents the live state of your computer''s USB bus.


    On Red Hat distributions, such as Fedora, you find various text files in the /proc
    directory that are not present on other distributions. For example, the /proc/usbinfo
    file contains descriptions of devices attached to the USB bus as well as details
    about the bus. This is not present on Debian distributions, for example. However,
    that same information is available via the lsusb command or the /proc/bus/usb/devices
    file


    # D-3: Viewing devices on the USB bus


    | Here''s how | Here''s why |

    | --- | --- |

    | Enter lsusb | To view basic information about the devices connected to your
    USB bus. |

    | Enter sudo lsusb -t | To view the USB information in a tree-like format. |

    | Enter sudo lsusb -v | To view extended information. |

    | Enter cat /proc/bus/usb/devices | To view the contents of the devices file,
    which contains detailed information about your USB devices. |

    | If you were running Fedora, what would you find in the /proc/usbinfo file? |
    |'
  merge: -1
  pgno: 263
