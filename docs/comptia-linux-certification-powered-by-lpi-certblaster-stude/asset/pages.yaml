  md: '# Mounting file systems at boot time


    The file systems you created and mounted are available when you restart your computer.
    The partitions are still there, of course, but the volumes aren’t automatically
    mounted. You will have to reenter the mount command. Alternatively, you can edit
    the /etc/fstab file to mount the systems for you. A representative fstab file
    is shown in Exhibit 7-5.


    Explanation


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_235_0.png)


    Exhibit 7-5: The /etc/fstab file


    The syntax of the entries you add to the fstab file is noted in a comment line
    within that file. The fields, as listed in the following table, are separated
    by tabs or spaces with one line per volume.


    | Field | Description |

    | --- | --- |

    | File system | This is the device file, not file system type, of the drive. |

    | Mount point | The directory to which the volume will be mounted. |

    | Type | The volume’s file system type. |

    | Options | File system-specific options, such as whether the volume is read only
    (ro) or read-write (rw). |

    | Dump | Whether the volume should be included in a system backup: 0 means no,
    1 means yes. |

    | Pass | The order the drive should be checked by fsck, where 0 means to not check
    the volume at all. It makes little sense to check some volumes, such as CDs (which
    are read only and therefore unfixable) and the swap volume (which is dynamic and
    therefore doesn’t need fixing). |'
