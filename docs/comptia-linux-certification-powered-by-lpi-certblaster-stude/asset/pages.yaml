    # Disk usage


    Monitoring available disk space and usage alerts you to space issues


    An inode is the data structure that stores meta-information about a file. This
    information includes user and group ownership, permissions, and critically, a
    reference to where on the disk the data is located. Typically, one percent of
    the disk space is reserved for storing inodes. If you run out of inode space,
    you cannot store any more files on the disk, even if you have plenty of free blocks.


    Linux offers various commands for checking on disk usage. These include the du
    and df commands.'
  merge: -1
