  md: '# Manually mounting volumes


    In older versions of Linux and those configured for server roles, you must manually
    mount file systems using the mount command. Use the following syntax to mount
    removable storage devices:


    ```

    mount -t type device_file mount_point -o options

    ```


    # File system types


    The first argument you need to specify with the mount command is the file system
    type. The -t type option with mount is not strictly required. However, for a few
    file systems, you must use it. The reason for this is that, for those file systems,
    you should use a different mount program. However, by adding the -t type option,
    the mount command calls this separate program for you automatically.


    You can also specify multiple possible file systems in a single command by entering
    them as a comma-separated list without spaces. The following table lists common
    file system types you might use with the mount command.


    | Filesystem type | Use this when mounting |

    |---|---|n| ext2 or ext3 | Hard disks formatted with the extended file system
    types. |

    | iso9660 | CD-ROM discs (sometimes also DVD discs) formatted with the ISO 9660
    file system format. |

    | udf | DVD disks and CD-ROM discs formatted with the Universal Disk Format, also
    known as the ISO/IEC 13346 standard. This format is largely replacing ISO 9660,
    because it supports larger files and volumes. |

    | usbfs | USB drives formatted with the extended (virtual) FAT (file allocation
    table) file system type. |

    | nfs or nfs4 | Network drives available through the Network File Sharing (NFS)
    system. |

    | smbfs | Network drives, notably Windows Shares, available on the network. |

    | hfs | Floppy disks and CD-ROMs formatted with the Macintosh HFS file system.
    |

    | msdos | Floppy disks formatted with the historic MS-DOS FAT file system. |

    | vfat | Floppy disks formatted with the extended (virtual) FAT file system type.
    |'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Device files


    The second argument you need to specify with the mount command is the device file.
    It has been said that, in UNIX and Linux, everything is a file. Saying originates
    from the fact that the operating system and applications interact with storage
    devices and other hardware as if they were files. This scheme eliminates the need
    for special programming interfaces for each type of device. Data can be written
    to or read from device using the same techniques as a file. This similarity makes
    it easier to write applications that support existing and new devices.


    This file-based interaction is enabled through device files. Located in the /dev
    directory, device files are special files that represent hardware. Depending on
    your Linux version, you might see all possible device files in the /dev directory
    or you might see just files for the devices installed on your system.


    Device files come in two types, buffered and non-buffered. Buffered devices are
    called block devices, while non-buffered devices are called character devices.
    Those names are a bit misleading, as programs can write blocks of data or individual
    characters to both types of device files.


    # Mount points


    The third argument you need to specify with the mount command is the mount point.
    A mount point is the directory within the tree where you merge file systems. Typically,
    you do so at a subdirectory of the /mnt or /media directories. For example, you
    might mount a CD-ROM disc to the /media/cdrom directory. Depending on your Linux
    version, the /media or /mnt directories might contain a default set of subdirectories
    or be empty.


    There seems to be no universal agreement about whether to mount to /mnt or /media.
    Some people argue that /media is a more intuitive name for removable media devices,
    such as CD-ROMs, so /media should be used. Others see any mountable and unmountable
    volume as essentially removable media, leaving no reason to use /media instead
    of the older and more universal /mnt. On some distributions, mounting a volume
    to /media adds an icon to your GUI desktop for easy access. This is perhaps the
    best argument to use /media for removable media volumes to which you desire easy
    access via the GUI.


    What happens if you mount a device to a directory that contains files or directories?
    The contents of the directory are hidden, and the contents of the new device are
    made to appear in their place. Once you unmount the device, the original contents
    become visible again.


    You can mount a device to any directory, including critical system directories.
    Remember that a mounted file system hides entries. You certainly do not want to
    mount a device to the /bin directory, for example. The files in /bin are inaccessible
    and, because that directory contains the unmount executable, you would not be
    able to unmount the device!'
  merge: -1
  pgno: 115
