  md: '# Topic C: Re-keying the course


    If you have the proper hardware and software, you can re-key this course after
    class. This section explains what you''ll need in order to do so, and how to do
    it.


    # Hardware requirements


    You must have a computer with the following specifications:


    +   * A keyboard and a mouse

    * Pentium 4 processor or newer

    * 512 MB RAM or more

    * Two hard drives (preferred) or a single large hard drive of 20 GB or more.

    * CD/DVD burner

    * At least one free USB port

    * Monitor capable of operating at 1024x768 or higher resolution

    * Network adapter


    Some activities require the following additional hardware. If you do not have
    this available, you can skip those activities.


    +   * A second Linux computer, to which you will connect over the network (if
    using virtualization, you can create a second virtual machine on your host computer)

    * One or more Linux compatible printers to install and print to

    * One or more USB flash drives that you may use, format, and write data to


    # Software requirements


    You will need the following software:


    +   * Debian 5.0 (Lenny); newer versions will probably work though some activities
    might not key as written.


    # Network requirements


    Your computer must have access to the network and Internet for the duration of
    the course. You will download operating system components from the Debian repositories,
    which will require Internet access.


    You will need the following components:


    +   * A router to provide network access both within your home or office network
    and to the Internet.

    * A DHCP server (or device, such as a router that provides DHCP services) to assign
    dynamic IP addresses to clients.

    * A valid static IP address for each computer.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Physical versus virtual environment


    The preferred configuration for the activities is that you have a physical computer
    onto which you will install a new version of Debian Linux. However, you can optionally
    use a virtualization environment within another operating system. For example,
    the activities in this course were tested using Sun Microsystem’s VirtualBox running
    on a Windows XP exper. Activities were also tested on a virtual server running
    under the Citrix XenServer


    # Setup instructions to re-key the course


    You will install Debian Linux onto your computer as part of re-keying the course.
    Provided your computer supports booting from a CD, you don''t need to install
    any operating system prior to class. Optionally, you could start with a Windows
    (or Linux) based system and install Linux in place of that operating system.


    You must create a bootable Linux CD, following these steps:


    +   1. Visit www.debian.org

    2. Click Getting Debian

    3. Click Download a small image file, record it to a CD/DVD/USB disk/floppy, and
    install using the Internet.

    4. Under the Small CDs heading, click i386. Save the file to your computer.

    5. Burn the ISO file you downloaded to a CD.


    # Alternate setup: Run VirtualBox within Windows


    Instead of installing Linux as the sole operating system on your computer, you
    can run Debian within a virtual machine using Oracle VirtualBox. If you choose
    this method, you must follow these steps:


    +   1. Install Windows XP, Windows Vista, or Windows 7 according to the software
    manufacturer’s instructions.

    2. Configure networking support so that computers can access the Internet.

    3. Install the latest critical updates and service packs from www.windowsupdate.com.

    4. Create a user account for use during the course activities.

    5. Log in under the student user account.

    6. Download the Windows version of VirtualBox from www.virtualbox.org.

    7. Install VirtualBox according to the manufacturer’s instructions. If warned
    about installing unsigned drivers, install the drivers anyway. They are required
    to enable USB and networking support within the virtualized environment.

    8. Create a virtual machine within VirtualBox by following these steps:

    na. Open VirtualBox and click New.

    nb. Follow the wizard’s prompts, we suggest the following settings:

    - Virtual machine name: Debian (the operating system)

    - Memory: Assign the recommended amount, roughly one-quarter to one-half, of your
    computer’s physical RAM to the virtual machine.

    - Disk space: Use a dynamically expanding file with a maximum size of at least
    20 GB.

    nc. Do not start the virtual machine at this time as that would begin the Linux
    installation that you will do in Unit 1.'
  merge: -1
