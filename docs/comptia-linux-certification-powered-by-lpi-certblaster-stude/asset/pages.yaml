  md: '# Piping and redirecting


    You can use the output of one command as input to another command. You can also
    use text in a file as input for a command rather than typing in required text.
    You can even control the output of a command so that it''s sent to a device other
    than your screen, such as to a printer. Collectively, these techniques are called
    piping and redirection.


    # Piping


    Piping is the process of sending the output of one command, or a group of commands,
    to another command, which performs some sort of manipulation of that information.
    You pipe output using syntax similar to this:


    ```

    command1 | command2

    ```


    The output of command 1 becomes the input to command 2. A very common use of piping
    is to control the output of a command, such as cat, when that output fills more
    than one screen.


    ```

    cat longfile.txt | more

    ```


    In this command, the contents of longfile.txt are sent to the more command, which
    prints that content to the screen one screen at a time. Unlike Windows, you can
    use the simpler more longfile.txt statement to accomplish the same thing. But
    the example still illustrates the usage of piping.


    # Redirecting


    Redirecting, or redirection, is similar to piping, except that instead of sending
    the output to another program, you send the output to another file or device.
    For example, the following command would send the contents of longfile.txt to
    the printer attached to /dev/lp0.


    ```

    cat longfile.txt > /dev/lp0

    ```


    Redirection can be performed the other way. Let''s say you want to automate the
    transfer of a file to an FTP server. Typically, you enter a series of commands
    such as these:


    +   1. ftp ENTER

    2. open ftp.example.com ENTER

    3. your_username ENTER

    4. your_password ENTER

    5. lcd ~/localfolder/ ENTER

    6. cd ~/serverfolder/ ENTER

    7. binary ENTER

    8. put myfile.tar.gz ENTER

    9. exit ENTER


    Exhibit 2-6: A sample FTP session


    Each time you want to transfer this file, you need to type the set of commands.
    You can use redirection to automate most of this. The exception is that you still
    need to enter your password. To start, you create a text file containing all lines
    1 and 3, as shown in Exhibit 2-6. From then on, to transfer your file, you enter:


    ```

    ftp ~/mybackup.txt

    ```'
  merge: -1
