  md: "# File and directory permissions\n\nLinux stores file and directory permissions\
    \ within the inode in a structure called the mode. The mode contains three sections\
    \ that describe permissions assigned to these three entities:\n\n+   - User (the\
    \ file or directory's owner)\n- Group (the owner's primary group)\n- Other (everyone\
    \ else)\n\nYou will see these three sets of permissions referred to as UGO; for\
    \ user, group, and other. For each of these entities, you may assign a yes/no\
    \ indicator for these permissions:\n\n| Permission | For files | For directories\
    \ |\n|---|---|--|\\| Read (r) | Display the contents of the file. | List the contents\
    \ of the directory, but not cd (change directory) to it. |\n Write (w) | Modify\
    \ or delete the contents of files. | Add or delete files from a directory. |\n\
    \ Execute (x) | Execute a program or shell script. | Change (cd) to a directory,\
    \ but not list its contents, unless you also have the r (read) permission. |\n\
    \n![](img/b39d9dcef1d6eb273cbd81b16d07561e_148_0.png)\n\nExhibit 4-7: A directory\
    \ listing that includes each resource's mode\n\nLooking at Exhibit 4-7, the UGO\
    \ permissions (the mode) are listed first on each line. The first character in\
    \ the mode describes the file type (- for a normal file, d for a directory, l\
    \ for a link, and so forth). Elsewhere, a dash indicates that the entity does\
    \ not have the permission. The presence of a letter means a permission has been\
    \ granted."
