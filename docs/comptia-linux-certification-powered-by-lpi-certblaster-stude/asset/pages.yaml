  md: '# Locating files


    Linux offers various commands you can use to locate files on your computer. These
    include:


    +   - find

    - locate

    - slocate

    - which

    - whereis


    # The find command


    You can use the find command to search for files in a directory hierarchy.


    ```

    find [path] expression

    ```


    | Expression | Description |

    | --- | --- |

    | atime, ctime, mtime | Access time, creation time, and modification time respectively.
    The time is measured in whole 24-hour periods. So, specifying ctime 1 would mean
    a file that was created between 24 and 48 hours ago |

    | executable | The file is executable or directory is searchable. |

    | name | The base name portion of the file''s name matches the specified pattern.
    |

    | perm | The file has the permissions you specify. |

    | size [-+] [bckMG] | The file uses the specified number of units. Use the plus
    or minus operators to specify less or greater than conditions. The units are as
    follows: b=512 KB blocks, c=kilobytes, M=megabytes, and G=gigabytes. For example
    . -size +4M would search the current directory for files over 4 MB. |

    | type | The file is of the specified type. |

    | uid, user | The file is owned by the specified user, either by user ID or user
    name, respectively. |


    You can use the xargs command in conjunction with the find command. The xargs
    command reformats the output of one command to become input arguments for another
    command. Essentially, it takes the output of one command and pipes the results
    to the other command as input.


    Consider this command:


    ```

    find --type f -mmin -90 | xargs ls -lF

    ```


    It would find all files (-type f argument) in your home directory that were modified
    in the last 90 minutes (the -mmin -90 argument) then pipe that list to xargs,
    which would pipe each resulting file to the ls -lF command.'
  merge: -1
  pgno: 110
- img_proc: true
  md: "# CompTIA Linux+ Certification, Powered by LPI\n\n# The locate command and\
    \ locate commands\n\nThe locate command reads a database of file names and locations\
    \ to help you find files containing specific text. You create this database with\
    \ the updatedb command, which is typically run automatically every day by the\
    \ system. Then, you can use locate with simple search strings or regular expressions\
    \ to find files. The locate command does not confirm that the file still exists\
    \ when a match is found in its database.\n\nThe locate command is the “secure”\
    \ version of locate. It takes into account file permissions and ownership and\
    \ doesn’t display files that you don’t have permissions to access.\n\nThe updatedb\
    \ command is actually an alias for the slocate -u command. Either is used to update\
    \ the database used by locate and slocate for finding files. The /etc/updatedb.conf\
    \ configuration file specifies a list of directories to be ignored when building\
    \ the search database.\n\n# The which command\n\nThe which command specifically\
    \ searches for executable files. It returns the path to that file. For example,\
    \ entering which ls displays the path on your system to the ls command’s executable\
