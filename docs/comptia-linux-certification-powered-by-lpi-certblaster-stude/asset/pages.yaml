    of use and multi-language support are two key goals of Ubuntu''s developers. Linux
    Mint (http://linuxmint.com/) is a popular variant of Ubuntu. |

    | Red Hat Enterprise | Red Hat, Inc., authors the Red Hat Enterprise Linux commercial
