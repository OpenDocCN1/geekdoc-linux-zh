  md: '# Process and module management 8-23


    The following table lists some common settings you might employ. With such settings,
    the first section (before the first period) relates to the type of system being
    modified (i.e. net for networking, kernel for kernel components, and so forth).
    The next section describes the component, for example ipv4 describes IP version
    4 (compared to ipv6 for IP version 6). With the networking keys specifies, the
    "all" means the setting applies to all network interfaces. Instead, you can specify
    different settings for each interface by noting the interface name in the key.


    | Setting | Description |

    | --- | --- |

    | net.ipv4.conf.default.forwarding | Set to 1 to enable IP routing (configure
    your server as a router) or 0 to disable routing. |

    | net.ipv4.conf.icmp_ignore_all | Ignore all ICMP requests. If set to 1, your
    computer ignores all network requests for system state information, such as ping.
    This setting prevents some applications from working properly. |

    | net.ipv4.conf.icmp_echo_ignore_broadcasts | Leave this to 0 in most cases. Similar
    to icmp_echo_ignore_all, except that it ignores only ICMP requests (rather than
    sending directly to your computer). You can block some network attacks by setting
    this to 1.

    | net.ipv4.conf.all.send_redirects | If set to 1, the computer sends ICMP redirect
    commands if it receives a packet of data that should have been sent to another
    host. If you''re configuring your computer as a router, you should set it to 1.
    Otherwise, leave it at 0 (or its default value). |

    | net.ipv4.conf.all.accept_redirects | If set to 1, your computer accepts ICMP
    redirects. These messages inform a router of a better route to which to send the
    packet to reach a specific host or network. Set this to 1, otherwise leave it
    at its default |

    | net.ipv4.conf.all.accept_source_route | If set to 1, your computer accepts source-routed
    packets. That''s generally considered a security risk. So, set it to 0 |

    | net.ipv4.conf.all.ip_dynaddr | If set to 1, this enables various features that
    help fix some problems with associative addressing. Setting this to 1 is a good
    idea for most users. |

    | net.ipv4.conf.all.rp_filter | If set to 1, your computer will verify that the
    source of incoming packets matches the route by which it arrived. This helps prevent
    IP spoofing attacks |

    | vm_swappiness | This setting controls how the kernel swaps data between real
    RAM and swap. Set to a low value to keep more data in RAM and swap less. Set high
    to swap out data more frequently. The default value varies by distribution. |


    An exhaustive reference of networking related sysctl variables is located at http://ipsysctl-tutorial.frozux.net/ipsysctl-tutorial.html.'
