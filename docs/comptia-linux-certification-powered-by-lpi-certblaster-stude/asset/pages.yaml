  md: '# Process management


    Linux provides several utilities for viewing and managing processes. These include
    ps and top, among various others.


    # The ps command


    The ps command is a versatile tool for monitoring the processes running on your
    Linux computer. With it, you can view your user processes or all processes, process
    state, process priorities, and more.


    This command has been in use since the early days of Linux and UNIX and, thus,
    has many enhancements. As a result, the command supports three types of command
    options. Which you use depends on how you note the options on the command line.


    +   * ps -option= Access the UNIX-style options by preceding the option indicator
    with a single dash.

    * ps option= Access the BSD-style options by omitting the dash before the option
    indicator.

    * ps --option= Access the GNU-style options by preceding the option indicator
    with a double dash.


    You can intermix these options, though it is best not to do so. The following
    table lists common ps command and option combinations you might use to view various
    bits of information about the processes on your system.


    | Command form | Description |

    |---|--|

    | ps | Lists processes running in your current shell (terminal). Details include
    PID, terminal ID, CPU time, and command name. |

    | ps -f | Lists “full” details about the processes in your current shell. Includes
    user ID, PID, PPID, CPU utilization, start time, CPU time, and command name. |

    | ps -ef | Lists “full” details about the processes across all terminals including
    daemons. Includes the same details as ps -f. |

    | ps -l | Lists the “full” details, plus the process flag (associated with process
    permissions), process state, wait channel, and more. Process state includes S
    (sleeping), R (running), T (stopped or traced), and Z (zombie or defunct). |

    | ps ax | (Notice there no hyphen.) Lists the process priority, process state,
    and CPU time associated with processes across all terminals and daemons. |

    | ps aux | (Notice there is no hyphen.) Similar to the ax option, shows percentages
    of CPU time and memory, start time, and user ID associated with the various processes.
    |'
  merge: -1
