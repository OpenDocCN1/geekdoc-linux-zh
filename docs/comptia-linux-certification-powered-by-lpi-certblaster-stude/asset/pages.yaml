  md: '# Environment files


    Customized variables, command aliases, and functions are removed when you close
    your terminal window and are unavailable when you open a new terminal. The same
    is actually true of all the system-defined variables, aliases, and functions.
    It''s just that they''re redefined every time you open a terminal, giving the
    appearance that they''re being preserved.


    The variables and aliases defined when you open a terminal are specified in one
    or more environment files. In the BASH environment, the common environment files
    are described in the following table.


    | Environment file | Description |

    |---|---|

    | /etc/profile | Executed for all users immediately after they log on, this file
    defines the common environment variables such as HOME and PATH. |

    | ~/.bash_profile or ~/.bash_login or ~/.profile | After executing the /etc/profile
    file, BASH searches the user''s home directory for these files. It executes the
    first one it finds (following the order listed here). The leading period makes
    these hidden files. |

    | ~/.bashrc | For non-login shells, such as terminal windows within the GUI environment,
    BASH executes this file. |


    To redefine your custom variables or aliases each time you log on, edit the user-level
    profile files described in the preceding table. You can also specify other commands
    to run when you log on by adding those commands to the BASH profile file.


    You can specify commands to run when you log out by adding them to the .bash_logout
    file in your home directory.'
