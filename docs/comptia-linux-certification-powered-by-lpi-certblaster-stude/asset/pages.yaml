  md: '# Special permissions


    Read, write, and execute the regular Linux permissions that you assign to files
    and directories. In addition, you can assign three additional types of permissions,
    collectively called the special permissions. They are:


    +   - SUID (Set User ID)

    - SGID (Set Group ID)

    - Sticky bit


    # SUID


    When you run a program, it runs under your user ID and has the same permissions
    that you have on the system. If the SUID bit is set for a program, when you run
    it, it runs under the context of the owner of the program, not you. For example,
    to change your password, you run `passwd` command. It must update the `/etc/shadow`
    file to save your password, but non-root users don''t have permission to write
    to file.


    In this case, the `passwd` command is owned by root, which has permission to write
    to the shadow file. The SUID bit is set. When you run `passwd`, the program runs
    as if the root user were running it. Therefore, the program has the necessary
    permissions to update the file.


    Most Linux distributions, though not all, ignore the SUID bit on shell scripts.
    The reason is that users are more likely to be able to modify shell scripts, potentially
    adding malicious or unintentionally damaging features. If such scripts were written
    in an elevated context, a system''s security could be easily breached.


    # SGID


    The SGID bit offers functionality similar to that of the SUID bit when used with
    files. A file with the SGID bit runs in the context of the owner''s group, rather
    than in the group context of the user that ran the program.


    However, the SGID bit offers different functionality when used with directories.
    With a new empty directory with SGID bit set, new files created in the directory
    become owned by the directory''s creator group rather than by the file creator''s
    group. For example, if Mary creates a directory and sets the SGID bit, that directory
    and any new files belong to her primary group.


    If you set the SGID bit on a directory that already contains files, ownership
    of those files is not changed. You have to change the group ownership on your
    own using `chgrp` command.


    # Sticky bit


    The third special permission is the *sticky bit*. On most operating systems, this
    has no effect when applied to files. However, it affects file deletion when the
    bit is set on a directory.


    Some directories, such as /tmp (the system''s temporary directory), are shared
    by many users. However, in most cases, you do not want one user to be able to
    delete another user''s files from /tmp. With the sticky bit set on the directory,
    anyone can add a file to the directory. However, only the user who created the
    file, the root user, or the owner of the directory may delete files from it.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# System administration 4-35


    **Note:** All three of the special permissions require the execute permission
    in order to work properly. For files, both SUID and SGID work only on executable
    files. SGID on a directory requires the execute permission, because without it,
    users cannot access the directory anyway.


    # Viewing special permissions


    Special permissions are represented in the mode by a letter s or letter t, depending
    on the permission. As shown in Exhibit 4-11, an s in place of the x in the user
    portion of the mode indicates the SUID bit is set. In the group portion of the
    mode, the s indicates the SGID bit is set. In the other portion of the mode, the
    t indicates the sticky bit is set.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_156_0.png)


    Exhibit 4-11: Special permissions within the mode


    As mentioned previously, all three of the special permissions require the execute
    permission in order to work properly. However, you''re not actually forced by
    some operating system feature to set both the execute and special permissions.
    If for some reason you set one of the special permissions the lowercase letter
    in the mode is replaced by an uppercase letter. As shown in Exhibit 4-12, the
    SUID and SGID bits are represented by an uppercase S and the sticky bit by an
    uppercase T, if the execute permission is not set.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_156_1.png)


    Exhibit 4-12: Special permissions without the execute permission


    # Setting special permissions


    You use the chmod command to set-special permissions, just as you use it to set
    regular permissions. Earlier, when you looked at this command, we described the
    numeric means of setting explicit permissions. We stated that you specified a
    three-digit number representing the user, group, and other permissions.'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'Actually, chmod expects a four-digit number. If a number is omitted, `chmod`
    assumes the missing digit is a leading zero. In other words, when you enter `chmod
    755`, it assumes you mean `chmod 0755`.


    As with the regular permissions, the number you use to represent the special permissions
    is the sum of three values:


    +   - 4 = SUID

    - 2 = SGID

    - 1 = Sticky bit


    Thus, to set both the SUID and SGID on a file to which the owner has execute permissions
    and the group and other have read and execute, you enter:


    ```

    chmod 6755 myfile

    ```


    You can clear any special permissions using:


    ```

    chmod 0755mydirectory

    ```


    You can also use the other chmod syntax to add or remove a special permission
    without explicitly setting all the permissions. For example, to add the SUID permission
    to a file, you enter:


    ```

    chmod u+s myfile

    ```


    To add the sticky bit, you use the letter t, for example:


    ```

    chmod o+tmydirectory

    ```'
  merge: -1
