  md: "# Mount options\n\nThe fourth argument you need to specify with the mount command\
    \ is various mount options. Such options are specific to the type of file system\
    \ you are mounting, though many are universally supported. You enter them as a\
    \ comma-separated list without spaces.\n\n| Mount options | Description |\n|---|---|\n\
    | ro | Mount the volume read-only. Default for read-only media, such as CD-ROM\
    \ and DVD discs. |\n| rw | Mount the volume read-write. |\n| user or users | Enable\
    \ a specific user or all users to unmount and mount the file system. This option\
    \ is useful with CD/DVD file systems, when users are permitted to switch devices\
    \ in the drive and you don't want to grant special mount/unmount permissions.\
    \ |\n| exec or noexec | Permit or deny the execution of binaries (programs) on\
    \ the volume. |\n| auto | Direct the mount command to recognize automatically\
    \ the file system type on the volume. |\n\n# Example commands\n\nThe following\
    \ are some example commands you might use to mount various volumes:\n\n+   * MS-DOS\
    \ floppy\n  `mount -t vfat,msdos /dev/mnt/floppy -o rw,users,noexec`\n* CD or\
    \ DVD that is either ISO 9660 or UDF-formatted\n  `mount -t udf,iso9660 /dev/cdrom\
    \ /media/cdrom -o ro,users`\n* USB drive or external hard drive connected to a\
    \ USB port\n  `mount -t usbfs,vfat,msdos /dev/usbdev1_2_ep00 /mnt/usb -o rw,users`\n\
    * Internal hard drive\n  `mount -t ext3 /dev/hd1 /mnt/hd1 -o rw\n\n# /etc/fstab\
    \ file\n\nThe fstab file serves two purposes: It lists the volumes that should\
    \ be mounted at boot time, and it lists configuration options for volumes you\
    \ might mount during the use of your system. If you plan to mount a volume with\
    \ specific options regularly, you can make your command entry easier by editing\
    \ the fstab file.\n\nFull coverage of the fstab file is beyond the scope of this\
    \ unit. It is covered in detail elsewhere in the course. You can also get information\
    \ about this file from its man pages. You must have root permissions to edit the\
    \ fstab file.\n\n# Unmounting volumes\n\nTo remove a disc or USB drive, you must\
    \ unmount the device. You do so with the mount (not \"unmount\") command following\
    \ either of the following examples:\n\n```\numount device_file\numount mount_point\n\
    ```"
