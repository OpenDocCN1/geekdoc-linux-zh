  md: '# User environment configuration


    # 5-15


    You need the following system information:


    +   - Maximum resolution supported

    - Maximum color depth support (e.g. 24-bit color)

    - Horizontal sync range (hync)

    - Vertical sync range (vsync)

    - Chipset manufacturer and version


    Make sure to read the appropriate man pages—xorg.conf or XF86Config—to determine
    all the details you need and the edits you make before making any changes. Entering
    incorrect information can result in corrupted output, a GUI environment that won''t
    load, or ever damaged hardware.


    # X terminology


    A nuanced terminology has grown up around the X Windows system. You will encounter
    the following terms in guides, configuration files, and configuration utilities.


    +   - Device—the graphics adapter.

    - Monitor—the CRT or LCD display device.

    - Screen—the virtual area onto which graphics and information is rendered. You
    might be tempted to equate monitor and screen. But one is physical and the other
    virtual. You can put one monitor to the left of another and the virtual screens
    in opposite order. Moving the mouse left or right will follow the virtual locations
    of the screens not of the physical devices.

    - Display—the collection of screens assigned to one user. In a multiuser configuration,
    each user has his or her own display comprising one or more screens or monitors.


    # Screen resolution


    In GNOME, you can adjust the screen resolution, refresh rate, and other settings
    by using the Screen Resolution Preferences dialog on the System, Preferences menu.
    Exhibit 5-1 illustrates this dialog box. You may run this utility as a normal
    (non-root) user, and the changes you make affect your logon only.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_178_0.png)


    Exhibit 5-1: The Screen Resolution Preferences dialog box'
