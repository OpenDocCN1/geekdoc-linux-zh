    irc:*:4348:0:999997::

    group:*:4348:0:999997::

    body:*:4348:0:999997::

    libuid:*:4348:0:999997::

    Debian-*:!*:4348:0:999997::

    stand:*:4348:0:999997::

    messagebus:*:4348:0:999997::

    avahi:*:4348:0:999997::

    -root-

    ```


    Exhibit 4-2: An example of /etc/shadow file


    The /etc/shadow file is also a colon-delimited text file and lists one user account
    per line. In this, the fields are:


    +   * User name

    * Encrypted password or characters, indicating that the account is locked or cannot
    be logged into (for example, the *, !, or !! characters)

    * Date and time of the last password change

    * Minimum number of days before the user can change his or her password

    * Maximum number of days before the user has to change his or her password

    * The number of days before the password expires that the user will be warned
    to change his or her password

    * The number of days after the password expires before the account is disabled.
    During this time before disabling, the user may still log on using his or her
    old password.

    * The date on which the account will be disabled, entered as a count of days since
    January 1, 1970. You can use this to specify ahead of time when a temporary account
    is to be disabled.'
