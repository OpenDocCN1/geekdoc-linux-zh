  md: '# File system planning


    While you don''t need to know every nifty-gritty detail about partitions and file
    systems to install Linux, a cursory knowledge will help you create a well-tuned
    system. A partition is a logical representation of a hard drive or portion of
    a hard drive. In Windows, a partition corresponds to a drive letter, such as the
    C drive.


    Each partition uses a file system type. Various file systems are available, each
    with (sometimes subtle) benefits and tradeoffs. If you set up multiple partitions
    on your system, each can use a distinct file system type.


    # File system types


    Popular hard drive file systems for Windows computers include NTFS (the Windows
    NT File System) and FAT32. The older 16-bit FAT (file allocation table) file system
    isn''t used on hard drives anymore. The virtual FAT (VFAT) file system introduced
    with Windows 95 is still used on removable media, such as USB drives and camera
    memory cards.


    Linux can''t use NTFS, FAT32, or FAT/VFAT file systems for its hard disks, though
    they can use FAT/VFAT and FAT32 on removable media. Linux distros use one or more
    of the following file systems:


    +   - ext2—“second extended file system” is an older Linux file system type. It
    offers benefits for removable media, particularly flash-memory-based devices.

    - ext3—“third extended file system” is a journaling file system. It''s the primary
    file system used by many Linux distros at the time of writing. In general, journaling
    file logs changes before writing them to the file, making them less likely to
    be corrupted during a system crash.

    - ext4—The successor to ext3 was released at the end of 2008, yet for various
    reasons, it''s not the default file system on most distros.

    - JFS—IBM has released its Journaling File System (JFS) under the GPL and makes
    versions available for Linux, OS/2, and AI.

    - ReiserFS—A journaling file system created by programmer Hans Reiser at Namesys.
    Once the native file system of SUSE Linux, it''s not commonly used in current
    distros.

    - XFS—A journaling file system created by Silicon Graphics (SGI) for its IRIX
    operating system. It''s a high performance file system with features to support
    large files. SGI ported the file system to the Linux kernel, which has included
    XFS since kernel 2.4.


    # Linux partitions


    Typically, Linux computers are set up with two distinct partitions:


    +   - root partition—This partition stores the operating system, application,
    and data files.

    - swap partition—This partition stores virtual memory data, similar to the pagefile.sys
    on Windows computers.


    You may create additional partitions. For example, you can create a volume for
    just your data files. Doing so would make backing up your data files a bit easier,
    as you could simply swap that entire volume.


    Unless on distinct hard drives, there''s generally no performance advantage to
    maintaining separate partitions. Putting the root and swap files onto separate
    partitions is an exception to this rule.


    Explanation'
  merge: -1
