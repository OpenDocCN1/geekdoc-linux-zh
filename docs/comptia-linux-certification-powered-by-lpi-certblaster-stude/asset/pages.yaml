  md: '# Desktop environments


    In Linux, a desktop environment comprises many components, such as the window
    manager, icon set, and default applications. A desktop environment is perhaps
    equivalent to what you think of when you consider the Windows operating system.
    It''s made up of the software that draws application windows, dialog boxes, and
    so forth. Plus, it includes the built-in utilities—the Linux equivalents of utilities,
    such as Windows Explorer, Notepad, and so forth.


    There are many desktop environments, a few of which are currently popular:


    +   * GNOME

    * KDE

    * Xfece


    Linux distros include a default desktop environment. You can download and install
    additional or replacement environments at any time.


    # GNOME


    As of this writing, GNOME (the GNU Network Object Model Environment) is the most
    popular Linux desktop environment. It''s the default desktop environment for Debian,
    Fedora, and Ubuntu, each of those distros is available with other environments.


    GNOME includes two primary components: the desktop environment and a programming
    framework that enables developers to create programs that integrate with the GNOME
    environment. The desktop environment is the set of icons, window borders and colors—as
    well as the software engine—that enables those components. In addition, it includes
    a set of common programs and utilities.'
  merge: -1
