  md: '# Privilege escalation


    Most system administration commands require permissions that regular users don''t
    have. If you have root access, such as when you''re operating your own computer,
    you can log on as root to perform such tasks. However, the better option is to
    use the su sudo command to raise your privileges temporarily, perform the command,
    and return to your normal operating level.


    # su


    The su command, an abbreviation for "switch user," is the traditional command
    used for privilege escalation. To run this command in its default form, you must
    enter the root user''s password. After that, you can work at a terminal or as
    the root user until you exit that shell.


    You can also use the su command to impersonate another user. You enter username,
    then that user account''s password. After that, you can operate as that user until
    you exit that shell.


    # sudo


    You use the sudo command to run a single command as another user. This command
    reduces the chance that you inadvertently cause problems should you forget to
    exit a root shell. Additionally, the system administrator has fine-grained control
    over which commands you may run via the sudo command.


    You run the privileged command using sudo in this way:


    ```

    sudo [-u username] command

    ```


    If you don''t supply the -u option and name user, sudo assumes you''re attempting
    to run the command as root. You are then prompted to enter your password, the
    root user''s (or other user''s) password. By forcing you to enter your own password,
    sudo does not require you to know, or the administrator to share, the root password.
    This makes sudo a more secure option than the su command.


    Typically, your system caches your authentication criteria for 15 minutes. Within
    this timeframe, you can execute sudo commands without re-entering your password.
    The actions you perform with sudo are logged to the /var/log/auth.log.


    The commands you are allowed to execute are stored in the sudoers file. You can
    get a list of the commands you are permitted to execute by executing sudo -1 (that''s
    an "L" file, not a list).


    In Debian, standard user level accounts are not listed in the sudoers file, not
    even the initial account you create during installation. In Ubuntu, the user-level
    account you create during installation is added to the sudoers file with permissions
    to execute all commands.


    You can add other users or change commands that users can perform by editing the
    sudoers file. To edit the sudoers file, you must use the visudo command while
    logged in as root. This command is a special version of vi meant for editing the
    sudoers file. It works like vi, but safely locks the sudoers file so that no one
    else can edit the file while you''re editing it.'
  merge: -1
