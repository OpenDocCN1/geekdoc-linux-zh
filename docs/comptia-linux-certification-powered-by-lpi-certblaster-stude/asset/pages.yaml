  md: '# Dynamic devices


    Originally, a device file was created in /dev for every piece of hardware that
    could be connected to your system. Looking in the directory, you might see all
    sorts of files for hardware you didn''t actually have in your computer. Not only
    was this confusing for users, it also presented problems behind the scenes for
    applications and system components.


    Linux designers created a dynamic system that created device files for only those
    pieces of hardware actually present in the system. The current system uses a few
    components to support hardware better and to also support hotplug devices.


    # Hotplug and coldplug devices


    In a modern system, not every device is connected to the system at boot. Consider
    an MP3 player or a digital camera. You connect such devices when you want to transfer
    music or pictures to them.


    Linux distinguishes between coldplug devices—those you connect when the system
    is turned off—and hotplug devices—those you plug while the system is running.
    To accommodate hotplug devices, Linux must add new devices to the /dev directory.
    In some cases, it must also recognize devices that already exist.


    # Udev


    Modern distros use a virtual-memory file system udev to map devices and drivers.
    When you attach new hardware, the udev daemon creates a new directory to represent
    that class of hardware. Within that directory are files that map to the specific
    device. This device is mapped to the /dev directory.


    For example, /dev/disk contains entries for disk drives on your system. Plug in
    a new USB drive, and udev creates a new entry in the /dev/disk directory representing
    that new value.


    These actions are somewhat transparent to users and the applications they run.
    In other words, you generally don''t need to worry about udev and dynamic devices,
    unless you''re running a script or application that expects a device to be present
    with a specific name.


    Let''s say you have a backup program that /sda is configured to save your data
    to an external USB drive named /sda. If you plug in drive one and udev assigns
    it to sdb, the backup program might fail.


    You can configure rules in the /etc/udev/rules.d directory so that a device should
    be assigned a particular name. These rules are keyed off the internal manufacturer
    and model name that the hardware sends to udev when you connect the device. If
    the desired device name is available, udev assigns it to your hardware.'
  merge: -1
  pgno: 261
