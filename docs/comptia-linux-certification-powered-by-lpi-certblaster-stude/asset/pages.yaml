    # GUIs and shells


    If you come from the Windows or Macintosh world, you''re used to working with
    graphical user interfaces (GUIs). Linux has GUI interfaces, too. In fact, it has
    multiple ones. What''s different is that Linux operates independently of its GUI.

    In Linux, user interfaces are components run around the kernel. You can run a
    command line interface (CLI) called a shell. Or you can run one of various graphical
    user interfaces. In fact, because Linux is a multi-user system, one user can be
    interacting via a shell while another is using a GUI. Multiple users can even
    use different GUIs simultaneously on the same Linux computer.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_45_0.png)


    The relationships between the kernel, shells, and GUI interfaces are shown in
    Exhibit 2-1. You''ll notice that the shells interact directly with the kernel.
    The GUI interfaces interact with a layer called X Windows. This software component
    interacts with the kernel and video hardware to provide a standard means to draw
    elements on the screen.

    X is what enables Linux systems to switch GUIs and run more than one GUI at a
    time. X provides standard interfaces and programming tools, so that GUI developers
    can focus on how their interfaces work and look.

    In Windows, the GUI is the operating system. In essence, Microsoft''s operating
    system combines the functionality of the X Windows and GUI layers, some of the
    kernel layer as well. You can''t replace the Windows GUI with another you like
    better. Sure, you can open a Command Prompt window to access many command-line
    utilities.'
