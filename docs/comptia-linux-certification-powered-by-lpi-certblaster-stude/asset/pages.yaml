  md: '# Course objectives


    These overall course objectives will give you an idea about what to expect from
    the course. It is also possible that they will help you see that this course is
    not the right one for you. If you think you lack the prerequisite knowledge or
    already know most of the subject matter to be covered, you should let your instructor
    know that you think you are misplaced in the class.


    After completing this course, you will know how to:


    +   - Install Linux.

    - Interact with Linux through both the command line and GUI interfaces.

    - Manage files, directories, and removable media.

    - Manage users and groups, set file and directory permissions.

    - Configure the user environment, and configure the GUI environment.

    - Install applications, resolve dependencies, update applications, and remove
    applications.

    - Manage partitions and file systems, manage quotas, and manage devices.

    - View, control, and kill processes, manage process priority, and load and unload
    kernel modules.

    - Back up and restore data, schedule tasks, monitor performance, and manage logs.

    - Set up and configure networking and networking services including DHCP, NTP,
    and BIND.

    - Enable file sharing, export file systems, and use remote file systems; set up,
    configure, and manage printing.

    - Enable assistive technologies to provide accessibility and configure localization
    settings to tailor the user environment to the locale.

    - Configure system and network security, configure routing, and configure firewall
    filtering services.

    - Install and configure Apache, PHP, and MySQL server services; use SQL commands
    to access information in a database.

    - Configure FTP services, and enable outgoing and incoming mail services.

    - Manage the boot process and runlevels, recover a lost root password, troubleshoot
    the network, and write shell scripts.'
  merge: -1
