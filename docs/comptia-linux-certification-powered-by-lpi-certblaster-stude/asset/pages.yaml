  md: '# Binaries


    Software delivered as *binaries* are precompiled applications specific to a particular
    hardware and operating system platform. Commercial software is delivered as binaries,
    perhaps with a custom installation script. Such software is easy for endusers
    to install and use.


    Binaries are specific to Linux distribution, version, and hardware architecture.
    Even though this can be convenient for end-users, it is less so for publishers.
    Software publishers must release many versions of binaries to address various
    combinations of distribution and hardware platform, maintain current versions
    of these binaries, and manage the potential confusion when users purchase the
    wrong binaries.


    # Source code


    Software delivered as *source code* is uncompiled program code, ready to be compiled
    for your particular hardware and operating system platform. Compiling source code
    into binary, specific to the operating system and hardware on which it was compiled.
    You need a compiler, such as the GNU C Compiler (gcc) in order to compile source
    code into an installable application.


    Individual programmers often distribute this software in many ways. The same source
    code can be compiled on many systems. So, distributing source code to individuals
    enables them to code easily on a wide variety of systems.


    However, source distribution is difficult for end users. They must have a compiler
    installed, know how to configure it and use, and be able to handle any problems
    or issues that arise during compilation. Advanced users and programmers are the
    most likely users of software distributed as source code.


    # Packages


    *Packages* are precompiled applications delivered in a specialized bundle that
    can be read and installed by a *package manager*. A package contains binary code,
    with meta-information that describes the application, provides the internal information
    needed to install and configure the application, and describes dependencies—components
    or other applications that are required for an application to function. Popular
    package formats include:


    +   - deb—The Debian package format, developed originally for the Debian distribution.

    - RPM—The RedHat Package Manager format, originally developed for RedHat Linux.


    Packages often include a checksum, which is a value calculated through a mathematical
    operation performed on the package file. The package manager calculates its own
    checksum and compares it to the checksum stored in the package; if the value matches,
    the package file has not been altered (for example, by a transmission error or
    a virus) since being created.


    Packages are often published via *repositories*, which are online libraries of
    software packages. Package managers automatically download packages from repositories
    and install the software onto your system.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# 6-4 CompTIA Linux+ Certification, Powered by LPI


    # Package managers


    The package manager downloads and installs the software contained in the package.
    It examines the metadata to determine where and how to install the binaries. If
    there are any dependencies—required components—it checks to see if they''re already
    installed on the system. If they are not, those components are installed first.
    The package manager examines the version metadata to determine if older versions
    are available (and thus should be removed) or if newer versions of the software
    are available (and thus should be downloaded).


    Package managers are generally specific to the Linux distribution, though the
    same package manager might be used by multiple distributions. Popular package
    managers include:


    | Package manager | Description |

    | --- | --- |

    | Advanced Packaging Tool (apt) | Originally developed for Debian, apt originally
    supported only the deb package format. It has since been updated to support the
    RPM format, also. apt is available for Debian and its descendants, such as Ubuntu,
    as well as for various Linux distributions. Tools that implement the command-line
    apt-get, text-mode aptitude, and the GUI Synaptic Package Manager. |

    | RedHat Package Manager (RPM) | RPM shares the same name as its package file
    format. It was developed for RedHat Linux and is also used by Fedora and others.
    It supports rpm files only. |

    | Yellow dog Updater, Modified (YUM) | A command-line package manager compatible
    with RPM packages. |

    | YaST (Yet another Setup Tool) | A setup tool that includes an RPM-compatible
    package manager developed for OpenSUSE. It is used by that distribution, as well
    as by the commercial versions distributed by Novell. YaST not only installs software
    packages, it also enables you to configure various aspects of your operating system.'
  merge: -1
  pgno: 197
