    | SUSE and openSUSE | Developed by Novell Corporation, SUSE is released in two
    major versions: SUSE Enterprise Desktop (SLED) and SUSE Enterprise Server (SLES),
    which are built atop the open-source openSUSE core. Novell adds interoperability,
