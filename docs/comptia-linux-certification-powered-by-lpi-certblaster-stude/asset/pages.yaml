- img_proc: true
  md: '# Enabling quotas


    Follow these steps to enable and configure disk quotas:


    +   1. Log in as root (or perform all of the following commands using `sudo`).

    2. Install the quota package using Synaptic Package Manager or `apt-get`.

    3. In the file system''s root directory, create two files: aquota.user and aquota.group
    (Hint: use `touch`).

    4. Edit the `/etc/fstab` file to enable quota support on the file system. Depending
    on your file system type, edit the file system''s mount options to include the
    options listed in the following table:


    | Item | File system | Purpose |

    | --- | --- | --- |

    | usrquota | ext2 | Enable user quotas. |

    | grpquota | ext2 | Enable group quotas. |

    | usrquota=aquota.user | ext3 | Enable user quotas. |

    | grpquota=aquota.group | ext3 | Enable group quotas. |

    | jqfmt=vf0 | ext3 | Specify the journaling file format. The default (used for
    ext2) is vfsy, which is unsuitable for ext3 volumes. |


    +   5. Restart your system.

    6. Run the following command to update the quota database with file ownership
    information:

    `quotacheck -mavug`n7. Edit quota limits for users by using the `aquota` command,
    which is illustrated in Exhibit 7-10. You must be su to root before using this
    command (you can''t use `sudo`). Enter the command as follows:


    ```

    aquota -u username

    ```'
