  md: '# Named pipes


    In the preceding section, you saw an example of a pipe. For example:


    ```

    cat longfile.txt | more

    ```


    With that command, BASH runs both the cat and more programs at the same time,
    directing one to send its output to the structure called a pipe, while directing
    the other to read from that as if the pipe were a file. In essence, a pipe is
    a special kind of file. In this case, it''s an unnamed file set up temporarily
    by BASH for the duration of the execution of these commands.


    You can also create a persistent pipe in the form of a named pipe. Just as with
    the unnamed pipes you used already, named pipes are conduits between applications.
    They exist as actual files on your disk and remain until you remove them.


    Both unnamed and named pipes are FIFO cache, meaning the first byte in is the
    first byte out. Practically, this means that even though a named pipe is a file
    on your disk, data sent to a named pipe is never stored on your disk and takes
    no space. To work, both programs must be running and looking to the pipe for output
    or input. As one program writes a byte to the pipe, the other reads it from it.


    You create a named pipe with the mkfifo command. For example:


    ```

    mkfifo pipe_name

    ```


    On some systems, particularly other Linux versions, you use the mknode command
    instead of mkfifo. If both are available, mkfifo is the preferred method for creating
    named pipes. See the man pages for information on using mknode on your distro.


    Once created, you can send output from one command to the pipe and direct another
    program to read from the pipe. For example, let''s say you create a pipe with
    this command:


    ```

    mypype myfile

    ```


    Next, in the same terminal window, you execute this command:


    ```

    ls -F > mypype

    ```


    Then, you open a new terminal and enter this command:


    ```

    cat < mypype

    ```


    The file listing by the ls command is sent to the pipe file mypype. In the other
    window, the cat reads the mypype file, as if it were an ordinary file, and outputs
    its contents, in this case the file, to the screen.


    Actually, the order you run the ls and cat commands doesn''t matter. The cat stops
    its output when it reaches the end of a file. Basically, it keeps writing bytes
    of data as they arrive in the pipe, just as if it were dealing with an enormous
    file. It finally stops when the cat finishes.


    Named pipes are useful when writing shell scripts (mini-programs you write shell
    commands). They are also useful to programmers writing applications. You probably
    won''t use named pipes too often in everyday situations. But there are times when
    they come in handy.


    Let''s say you have a program that converts MP3 files to WAV files. And you have
    a program that burns WAV files to a CD. To burn a set of MP3 files to a disk,
    you convert MP3 files to WAV files, then burn the WAV files to disc. You''d need
    an extra 700 MB or so disk space to store the WAV files during the operation.
    And you would have to perform the two parts of the operation in.'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'Instead, you could set up a named pipe and funnel the output of the MP3-to-WAV
    converter into the pipe. You''d direct your CD burner to read from the pipe, as
    if the named pipe were a WAV file ready for burning. As each converted byte went
    in, it would come out as input to the burner. The converted files would never
    actually be stored on your hard drive, eliminating the need for temporary storage
    space. Of course, you''d need a computer fast enough to convert the MP3 files,
    pass the bytes through the named pipe, and write the resultant WAV files to the
    CD all at the same time. Most modern PCs would be able to handle such an arrangement.


