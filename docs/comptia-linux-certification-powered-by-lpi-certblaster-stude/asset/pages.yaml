    # Filesystem Hierarchy Standard (FHS)


    Most operating systems use a desktop, or office metaphor. In the real, physical
    world, you have papers, plus folders and file cabinets to store them in. In the
    computer world, files represent the papers you work with; they are your actual
    data. You organize files in folders, also called directories. You store your files
    and folders in volumes, which are like the drawers in your file cabinet. A collection
    of volumes on one or more disk drives are analogous to a collection of drawers
    within file cabinets.


    The creators of Linux and UNIX organized the operating system and application
    files into a set of standard directories. This structure has evolved over time
    to become the Filesystem Hierarchy Standard (FHS), illustrated in Exhibit 2-1.
    This standard specifies a common set of directories, with specific names and purposes.
    Not all Linux distros follow the FHS exactly, but most are pretty close.'
