  md: '# Unit summary: Process and module management


    Topic A


    In this topic, you learned that processes are running instances of processes.
    User processes are associated with a particular user, while daemons are system
    processes started and run by the kernel. You learned how to list processes and
    view process dependencies. You learned that the /proc and /sys directories are
    dynamic lists of files and directories representing processes and active components,
    respectively. You also learned how to kill processes, which is, stop them from
    running.


    Topic B


    In this topic, you learned that foreground processes run in a subshell and block
    further activity in the parent shell. Background processes run in a shell, but
    don''t block their parent shell. You also managed process priority by setting
    nice and realise values.


    Topic C


    In this topic, you learned that you can view kernel information with commands
    such as uname. You also learned how to view files in the /proc directory to obtain
    system information. You tuned the kernel by setting sysctl values. Finally, you
    learned how to view, load, and unload kernel modules using the modprobe and related
    commands.


    # Review questions


    +   1 True or false? A process is an executable application file stored on a disk.

    2 Daemons are also known as \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_.

    3 Every process has a \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_, which identifies the
    PID of the process that started it.

