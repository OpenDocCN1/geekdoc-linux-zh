  md: '# Color depth


    Color depth describes how many colors can be displayed by the pixels on your monitor.
    More technically, it refers to the number of bits assigned to each of the red,
    green, and blue sub-pixels that make up each pixel. Typical color depths include:


    +   - 1-bit displays two colors, typically black and white

    - 8-bit displays 256 colors

    - 16-bit displays 65536 (65 K) colors

    - 24-bit displays 16,777,216 colors. This level is called Truecolor. Windows computers
    sometimes use the 32-bit name for this color depth but actually use only 24 bits
    for rendering colors. The remaining eight are used to map alpha values, which
    do not affect the output on a monitor.


    You can''t configure the color depth via the GUI in Linux distros. The maximum
    supported by your hardware is detected and used when creating the starting xorg.conf
    configuration file. If that value is mis-detected, you must edit that file manually
    to configure the correct value. Exhibit 5-2 shows the pertinent section of the
    xorg.conf file.


    ```

    Section "Screen"

    Subsection "Display"

    Depth 24

    EndSection

    Device "Device [0"

    Identifier "Screen [0"

    Monitor "Monitor [0"

    EndSection

    ```


    Exhibit 5-2: Edit the xorg.conf file to set the color depth


    # Dual- and multi-head systems


    Modern Linux distributions enable you to connect multiple monitors to a single
    computer. Such dual-headed systems are common in more and more computing environments.


    You must have a graphics adapter that supports multiple monitors or have multiple,
    single-head adapters installed in your PC. Most distributions detect this hardware
    and enable multi-screen output. Multi-headed output generally operates in one
    of three modes:


    +   - Clone—Every screen shows the same output. For example, in a retail setting,
    both the clerk''s monitor and the one facing the customer show the same output.

    - Normal—Each screen operates independently, showing separate windows. Typically,
    you can move windows from one screen to another. Such screens are said to be the
    left and right of each other. In practice, the monitors might be in any physical
    orientation.

    - Combined—The screens are combined into one virtual screen as large as the sum
    of the individual dimensions. In such a system, maximizing a window would cause
    it to fill the space displayed across all of the monitors.


    If your hardware is not properly detected, you need to edit the xorg.conf file
    to add or correct the Device, Monitor, Screen, and ServerLayout sections.'
  merge: -1
  pgno: 179
