  md: '# Modifying users


    You can edit the /etc/passwd or /etc/shadow file to modify an account. However,
    a much safer method is to use the userm command. This command accepts various
    options and arguments and modifies the appropriate configuration files for you.


    # The userm command


    The basic syntax of the usermod command is:


    ```

    usermod [options] username

    ```


    Options for the command are listed in the following table.


    | Option | Use this option to specify |

    | - | - |

    | -d absolute_path | A new home directory; add the -m option to move the user''s
    files automatically to the new home directory. |

    | -f number | A new grace period with number representing the number of days after
    the password has expired when the account will be disabled. |

    | -g group | A new primary group, with group being either the group''s ID or name.
    The group must already exist. |

    | -l name | A new login (user) name. You cannot change the user name of a user
    who is currently logged in. |

    | -s absolute_path | A new shell, where absolute_path is the full path to the
    shell''s executable. |

    | -e date | A new expiration date, with date in YYYY-MM-DD format. |


    # The chfn command


    To change a user''s full name and contact information, you must use the chfn command.
    By default, users cannot change their own full names, though they can change their
    contact information details. The root user, or those with su or sudo privileges,
    can change any of the details for any user account.


    Their basic syntax of the chfn command is:


    ```

    chfn [options] [username]

    ```


    If you omit the username, the changes you specify are made to your own account.
    Options for the command are listed in the following table.


    | Option | Use this option to specify a new |

    | - | - |

    | -f full_name | Full name |

    | -r room_num | Room number |

    | -w phone_num | Work phone number |

    | -h phone_num | Home phone number |

    | -o other | Other text |'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# System administration 4-15


    If you don''t include any options, chfn operates in interactive mode. In this
    mode, the command prompts you for each of the values listed in the preceding table.
    Either enter new values or press Enter to keep the current values.


    # The chage command


    You cannot modify password expiration values stored in the /etc/shadow file by
    usermod. Instead, you must either edit that file directly or use the chage command.
    Using chage is the preferred method.


    # Locking an account


    You can lock an account to prevent the user from logging in. You have two basic
    options for locking an account:


    +   - Use the usermod -L username command to lock the account. Use usermod -U
    username to unlock the account.

    - Use the passwd -l username command to lock the account. Use usermod -u username
    to unlock the account.


    # The finger command


    You can use the finger command to retrieve information about a user. This command
    outputs the contact information that you set with the chfn command. Simply enter
    finger followed by the username.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_136_0.png)


    Exhibit 4-5: Output of the finger command'
