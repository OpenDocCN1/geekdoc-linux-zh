  md: '# Multiuser display configuration


    The preceding discussion focused on a single user''s environment: the graphical
    environment for the current user. Linux is a multiuser system, and the GUI supports
    distinct graphics for each user on the system.


    You might configure a single server to support multiple users and attach X-stations,
    which are basically "dumb" graphical terminals. Each user would work at his or
    her X-station. You could configure or permit the user to configure X-station to
    have its own resolution and display settings.


    A real-world example of this sort setup is encountered in a retail setting. A
    server, kept securely in the back room has multiple power point-of-sale (POS)
    terminals. Each cash register is an X-station running software that enables clerks
    to record sales, look up products, and so forth.


    Most implementations of the X11 software permit up to 16 X-stations on a single
    server. Obviously, you need specialized hardware—effectively 16 video cards, 16
    keyboard boards, and 16 mouse ports—to implement such a system. Configuring the
    GUI is specific to the Window manager you use.


    With older systems, you had to set up and configure a font server on your central
    server. This X Font Server (xfs) provided font rendering definitions to the X-stations.
    You configured options in the /etc/X11/xorg.conf file. That method has been replaced
    by client-side font rendering. X-stations and remote clients now provide their
    own font rendering and server-side fonts, so xfs is no longer used.


    # GNOME-specific configuration


    In GNOME-based systems, you must configure the /usr/share/gdm/defaults.conf file
    to enable multiuser displays. Two sections in this file specify the configuration
    for displays. The first defines the displays. By default, just one exists in this
    form:


    ```

    0=Standard device=/dev/console

    ```


    To add a display, add a line, so that this looks like the following:


    ```

    0=Standard device=/dev/console

    1=Second

    ```


    The name you use for the second device is up to, but it can''t contain spaces
    and must match the following configuration section. For example, the section defining
    the Standard device looks like this:


    ```

    [server-Standard]

    name=Standard server

    command=/usr/X11R6/bin/X -audit 0

    flexible=true

    ```


    You need to add a section like this that defines your second display. If you named
    your display "Second," that section would look like this:


    ```

    [server-Second]

    name=Second server

    command=/usr/X11R6/bin/X :1 -audit 0

    flexible=true

    ```


    The name of this section must include the name you defined previously, matching
    spelling and capitalization. Check the documentation for your distro to determine
    the exact command you''d use for each of the additional displays. The one shown
    above might not apply to your distro.'
  merge: -1
