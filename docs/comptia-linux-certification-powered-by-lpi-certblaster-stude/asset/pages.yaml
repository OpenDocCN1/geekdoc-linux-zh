    # Appendices


    An appendix is similar to a unit in that it contains objectives and conceptualn
    explanations. However, an appendix does not include hands-on activities, a summary,
    or an independent practice activity.


    # Course summary


    This section provides a text summary of the entire course. It is useful for providingnclosure
    at the end of the course. The course summary also indicates the next course innseries,
    if there is one, and lists additional resources you might find useful as youncontinue
    to learn about the software.


    # Glossary


    The glossary provides definitions for all of the key terms used in this course.


    # Index


    The index at the end of this manual makes it easy for you to find information
    about

    particular software component, feature, or concept.


    # Manual conventions


    We''ve tried to keep the number of elements and the types of formatting to a minimum

    in the manuals. This approach aids in clarity and makes the manuals more classically

    ellegant looking. But there are some conventions and icons you should know about.


    | Item | Description |

    | *Italic text* | In conceptual text, indicates a new term or feature. |

    | **Bold text** | In unit summaries, indicates a key term or concept. In

    an an independent practice activity, indicates an explicit

    item that you select, choose, or type. |

    | Code font | Indicates code or syntax. |

    | Longer strings of ► code will look ► like this. | In the hands-on activities,
    any code''s too long to fit

    a a single line is divided into segments by one or more

    continuation characters (►). This code should be

    ered as a continuous string of text. |

    | Select **bold item** | In the left column of hands-on activities, bold sans-serif

    text indicates an explicit item that you select, choose,

    or type. |

    | Keycaps like ⏎ | Indicate a key on the keyboard you must press. |'
