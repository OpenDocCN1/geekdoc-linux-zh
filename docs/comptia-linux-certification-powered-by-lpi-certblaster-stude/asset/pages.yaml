    Exhibit 2-5: A terminal window with the BASH shell loaded


    BASH commands follow this general format:


    ```

    command -options arguments

    ```


    In the preceding example, command is the command you''re executing. Options are
    preceded by a hyphen and are most often single letter modifier to the command.
    Arguments are input parameters that specify what resource should be used by the
    command.


    In other words, the command tells Linux what to do, options tell it how to do
    it, and arguments tell it where or on what resource to perform the function. For
    example, consider this command:


    ```

    ls -l /usr

    ```


    The command, ls, prints a list of files to your screen. The -l option directs
    the command to include “long” details (extra information, such as permissions,
    size, and so forth) about each file. And, the argument directs the command to
    list the files in the /usr directory, assuming you have permissions to read that
    directory.'
