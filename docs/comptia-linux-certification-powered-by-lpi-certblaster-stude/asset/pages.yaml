  md: '# Virtual file systems


    Explanation Linux supports virtual file systems, otherwise known as loop devices,
    within a file. Loop devices are files that act as if they were an entire file
    system. You can mount a loop device and use its file system just as if it were
    a drive. An .iso (CD image) file is a prime example of this sort of file.


    In Linux, like all devices, loop devices are implemented through file devices.
    The standard names are /dev/loop0, /dev/loop1, and so forth. You use the losetup
    program to associate a file image file with a loop device. For example, to associate
    the loopfile to the loop 0 device, you enter:


    Next, you can mount the device to the regular file system, so that you can access
    the file’s file system.


    ```

    mount /dev/loop0 mountpoint

    ```


    Alternatively, you can accomplish both operations using the mount command:


    ```

    mount -o loop loopfile mountpoint

    ```


    # Terminology


    Loop devices in Linux are sometimes incorrectly called loopback devices. The name
    comes from the SunOS operating system, where they are called loopback file interface
    (lofi) devices. The associated device files in SunOS are /dev/lofi/1, /dev/lofi/2,
    and so forth. In BSD-derived operating systems, loop devices are called virtual
    node devices (VNDs); their device files are /dev/vnd0, /dev/vnd1, and so forth.


    # A-6: Mounting a loop device


    | Here''s how | Here''s why |

    |---|---|

