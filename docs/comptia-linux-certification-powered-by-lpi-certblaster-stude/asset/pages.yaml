- img_proc: true
  md: '# The du command


    The du command displays disk usage information. It outputs the amount of disk
    space used by the files and directories on your system. By default, it outputs
    values in bytes for all files and subdirectories in the current directory. You
    can supply a path and use the following options to control the output of the command.


    | Option | Description |

    | --- | --- |

    | -h | Output sizes in “human-readable” form—K (for KB), M (MB), etc. |

    | -s | Output a summary (total) rather than individual file sizes. |

    | -S | Don’t include the size of subdirectories. |

    | -x | Don’t include directories on different file systems (mounted devices).
    |

    | --exclude=’wildcard_pattern’ | Exclude files matching the wildcard pattern (e.g.
    *.o) |


    # The df command


    The df command displays summary disk usage information for all mounted file systems.
    It will output the number of 1 KB disk blocks, the number used, and the number
    available. It summarizes the percentage of space used on the disk and lists the
    mount point for each of the file systems. You can use the following options to
    control the output of the command.


    | Option | Description |

    | --- | --- |

    | -h | Output sizes in “human-readable” form—K (for KB), M (MB), etc. |

    | -i | Output inode information rather than block usage. |

    | -t | Output information for only the specified type of file system. |

    | -T | Output the file system type in addition to the other data. |

    | -x | Exclude information for the specified type of file system. |'
  merge: -1
  pgno: 246
