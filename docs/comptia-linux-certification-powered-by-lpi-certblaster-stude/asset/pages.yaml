  md: '# Topic A: About the manual


    # ILT Series philosophy


    Our manuals facilitate your learning by providing structured interaction with
    the software itself. While we provide text to explain difficult concepts, the
    hands-on activities are the focus of our courses. By paying close attention to
    your instructor leads you through these activities, you will learn the skills
    and concepts effectively.


    We believe strongly in the instructor-led class. During class, focus on your instructor.
    Our manuals are designed and written to facilitate your interaction with your
    instructor, and not to call attention to manuals themselves.


    We believe in the basic approach of setting expectations, delivering instruction,
    and providing summary and review afterwards. For this reason, lessons begin with
    objectives and end with summaries. We also provide overall course objectives and
    a course summary to provide both an introduction and closure on the entire course.


    # Manual components


    The manuals contain these major components:


    +   * Table of contents

    * Introduction

    * Units

    * Appendix OR Appendices

    * Course summary

    * Glossary

    * Index


    Each element is described below.


    # Table of contents


    The table of contents acts as a learning roadmap.


    # Introduction


    The introduction contains information about our training philosophy and our manual
    components, features, and conventions. It contains target student, prerequisite,
    objective, and setup information for the specific course.


    # Units


    Units are the largest structural component of the course content. A unit begins
    with a title page that lists objectives for each major subdivision, or topic,
    within the unit. Within each topic, conceptual and explanatory information alternates
    with hands-on activities. Units conclude with a summary comprising one paragraph
    for each topic, and an independent practice activity that gives you an opportunity
    to practice the skills you''ve learned.


    The conceptual information takes the form of text paragraphs, exhibits, lists,
    and tables. The activities are structured in two columns, one telling you what
    to do, the other providing explanations, descriptions, and graphics.'
  merge: -1
