  md: '# The vi editor


    Linux systems typically provide many programs for editing text files. Which ones
    are available depends on your Linux distribution, version, and desktop environment
    (GUI). However, nearly every Linux system includes the vi editor.


    The vi editor was first written in the 1970s by Bill Joy, cofounder of Sun Microsystems,
    the BSD operating system. It has been ported to a wide variety of operating systems
    and is available in open-source and closed-source versions.


    Despite the fact that its name is an abbreviation for visual, vi is a text-editor.
    It does not require or use a GUI. You interact with vi by entering commands, which
    are typically control-key combinations or characters you enter in the program''s
    command mode. vi was written before the widespread availability of high-speed
    networks, fancy graphics, and even modern keyboards. Many of its operating paradigms
    are based on the 1970s vintage equipment on which it was originally written.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_97_0.png)


    Exhibit 3-2: The vi editor, showing a new, empty file


    # Modes


    vi has two operating modes. In insert mode, you can type new text into the file
    you''re editing. In command mode, you enter commands to save the file, open a
    new file, quit vi, and so forth. You use the Esc key to switch from insert to
    command mode. In command mode, you use the i or o command to enter insert mode.


    Once in command mode, you precede commands with a colon. Most commands are just
    one or two letters long. Though with many, you can precede the command with a
    number to change how many elements it affects. For example, the dd command deletes
    the current line. If you type 3dd instead, vi deletes your current line plus the
    next two.'
