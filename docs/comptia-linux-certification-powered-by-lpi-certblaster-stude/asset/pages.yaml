  md: '# Drive geometry


    In cases, you don''t need to know much about the inner workings of the hardware
    of your computer. Hard drives can be an exception to that generalization. With
    some utilities, you might need to know how your hard drive physically stores data.


    Hard drives use magnetism to store data and are made up of the following parts:


    | Component | Description |

    | --- | --- |

    | Platters | Platters are the metal or plastic disks on which the magnetic material
    is coated. Data is recorded in magnetic material as magnetically polarized regions.
    |

    | Motor | The motor turns the platters very quickly, typically 7200 revolutions
    per minute or faster. |

    | Spindle | The spindle is the axis, or central hub, around which the platters
    spin. |

    | Read/write heads | The heads are the magnetic devices that both read and write
    data on the platters. |

    | Voice coil actuator | The voice coil actuator is the mechanism that moves the
    heads precisely into position over the magnetic tracks written on the platters.
    |


    Data is written by the heads onto the platters, as the platters spin beneath the
    heads. Data is recorded onto both the top and bottom of each platter. A disk drive
    typically has more than one platter stacked concentrically.


    Data is not written in a spiral groove, as with an old phonograph record. Instead,
    data is written in a series of concentric tracks. A cylinder is the logical collection
    of all the tracks at a distance from the axis.


    Each track is divided into sectors. Each sector contains identification information
    at its beginning and end in sectors. Sectors typically hold 512 bytes of data.
    Sectors are gathered into groups called clusters. Clusters typically contain 4
    and 64 sectors each. This logical layout is illustrated in Exhibit 7-1.


    Files are stored in one or more clusters. Small files leave empty space within
    the cluster that cannot be used to store other files. Large files are split and
    stored in multiple clusters. A table stored on the hard drive tracks the clusters
    assigned to each file.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# System configuration 7-5


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_226_0.png)


    Exhibit 7-1: Hard drive layout


    # # Partitioning


    **Partitions** are organizational units of storage. A partition is defined by
    the file system it contains, for example ext2, ext3, ReiserFS, and so forth. Those
    file systems determine how files are organized and saved on the disk drive and
    how changes are recorded and committed. Linux requires a minimum of two partitions:


    +   - One mounted to the root directory, known as the root partition.

    - One used to hold the contents of virtual memory, known as the swap partition.


    Partition definitions are stored in the first sector of the hard drive in a structure
    called the master boot record (MBR) or master boot block (MBB). Due to historical
    limitations, the MBR/MBB supports from one to four partitions. There are two types
    of partitions: primary and extended.


    With Windows computers, the first of those must be a primary partition. Linux
    doesn''t have such a requirement, but it is typical that the first partition is
    a primary partition. Only one partition can be an extended partition. Extended
    partitions can contain an unlimited number of logical partitions.


    In Linux, device files are created to represent the partitions. Device file names
    mirror the names of the hard disk and are then numbered sequentially. For example,
    the first partition on the primary IDE drive (/dev/hda) would be called /dev/hda1.
    The first logical partition within an extended partition is named 5: for example
    /dev/hda5.


    Linux partitions are assigned an ID, which doesn''t provide a unique identifier
    for the partition. Instead, it identifies the partition type. A typical partition
    containing an ext2 or ext3 file system has an ID of 83. A swap partition has a
    type of 82. These type IDs correspond to a hexadecimal number stored within the
    MBR.'
  merge: -1
