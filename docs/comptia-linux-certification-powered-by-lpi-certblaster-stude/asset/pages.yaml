  md: '# Process priority


    Every process has an associated priority, lower number processes having a higher
    priority. The range is from 0 (highest priority) to 127 (lowest priority). The
    kernel favors higher priority processes by granting them more time slices than
    lower priority processes.


    A time slice is a specified amount of CPU time granted to a process. The exact
    varies by kernel version and distribution. A time slice is typically a few milliseconds
    (thousandths of a second), so hundreds of time slices are processed by the CPU
    every second.


    # Viewing priorities


    You can view the priority of running processes using the ps -el command. Exhibit
    7-1 illustrates a process list with priorities (the PRI priority) included.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_285_0.png)


    Exhibit 7-4: Viewing process priorities


    # The nice command


    You cannot set the priority of a process directly. Instead, use the nice command
    to “suggest” your priority. The nice values range from -20 to +19. A negative
    nice value increases the likelihood that the kernel will assign a high priority
    to your process. A positive nice value likely lowers its priority.


    In Exhibit 7-3, the NI column lists the nice value for each process. This could
    have been set by the default value when you ran the command (NI = 0) or could
    have been set manually with nice.'
  merge: -1
  pgno: 285
- img_proc: true
  md: 'The syntax of the nice command is:


    ```

    nice -n # command

    ```


    where # is the nice value (-20 to +19) to assign to the process associated with
    command. If you omit the -n option, a nice value of 10 is used (to set a relatively
    low priority to your command.) For example, to run the sleep process with a high
    nice value (low priority), enter:


    ```

    nice -n 15 sleep 5000

    ```


    # The renice command


    Once a process is running, you can change its nice value by using the renice command.
    The command accepts a new nice value and one or more PIDs (process IDs). It changes
    the nice values and returns a description of the old and new values, as shown
    in Exhibit 7-2.


    ```

    renice # PID

    ```


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_286_0.png)


    Exhibit 8-5: The renice command alters the priorities of running processes'
  merge: -1
