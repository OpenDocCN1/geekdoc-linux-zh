    # ## The /dev directory


    Device files in the /dev directory are associated with most of the hardware devices,
    as well with some special virtual devices, installed on your computer. Device
    files describe the devices and provide a common means to access devices. In Linux,
    you access nearly every device using the same means you use to interact with a
    file. Such a scheme makes it easier for programmers to access devices and enable
    new types of devices in Linux.


    Device files come in two types, buffered and non-buffered. Buffered devices are
    called block devices, and non-buffered devices are called character devices. Those
    names are a bit misleading, programs can write blocks of data or individual characters
    to both types of device files.


    You can determine if a device is a block or a character device by viewing a list
    of files in the /dev directory using the -loption. The first character of the
    device is a c or b, representing a character or block device, respectively. (Entries
    with the first letter of d are directories. Those that begin with l are symbolic
    links. Those that begin with p are pipes.)'
  merge: -1
  pgno: 258
