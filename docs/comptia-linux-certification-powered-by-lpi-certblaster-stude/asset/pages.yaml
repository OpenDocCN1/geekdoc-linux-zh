  md: '# Files


    Files store your data, of course. You need to be able to manage them to use your
    Linux computer effectively. As you might expect, you can use either command-line
    or GUI tools to manage your files.


    In this section, you will:


    +   - Create files with touch and tee

    - Rename and move files

    - Copy files

    - Delete files


    # touch and tee


    Most times, you use applications, such as OpenOffice, to create files. There are
    times, however all you need is a simple file containing just a few lines of text.
    For such occasions, you can use the touch and tee commands.


    With the touch command, you can create an empty file. Or, if a file by the name
    already exists, you update its last-update metadata. The syntax is straightforward:


    ```

    touch path/filename

    ```


    With tee, the text you specify is written to a new file. With the -a option, your
    text is appended to the file. The generic syntax is as follows:


    ```

    tee [-a] path/filename

    ```


    Once you''ve entered that command, you can type text (Press Enter for new lines)
    that is saved to your file. The text is echoed back to you when you press Enter,
    making it look like the command is saving your line of text twice, which it does
    not. Press Ctrl+C to end the text entry and save the file. With the -a option,
    your new text is appended to the file rather than replacing it.


    # Moving and renaming


    As directories, you can use the mv command to move or rename files. If you omit
    the path, or specify the same old and new path, the file is renamed. The general
    syntax of mv is:


    ```

    mv [-options] path/old_filename path/new_filename

    ```


    The mv command has a few useful options, which include:


    +   - -f “forces” the move, which means mv does not prompt you to confirm before
    overwriting a file.

    - -i moves in “interactive” mode, meaning mv does prompt you to confirm each operation.

    - -t treats only the last argument as the destination and all the others as source
    files. This is useful when you want to move more than one file to a destination
    directory.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Copying


    You copy files and directories with the cp command. The general syntax of cp is:


    ```

    cp [options] path/old_filename path/new_filename

    ```


    The cp command has a few useful options, which include:


    +   - -f “forces” the copy, which means cp attempts to delete a matching file
    in the destination before creating the new copy.


    +   - -i copies in “interactive” mode, meaning cp prompts you to confirm each
    operation.


    +   - -t treats only the last argument as the destination and all the others as
    source directory. This is useful when you want to copy more than one file into
    a destination directory.


    +   - -u “updates” target files, meaning they are copied only if the source file
    is newer than the destination file or the destination file is missing.


    # Deleting


    You delete files using the rm command. The general syntax of rm is:


    ```

    rm [options] path/filename [path/filename]

    ```


    The rm command has a few useful options, which include:


    +   - -f “forces” the deletion, which means rm does not prompt you with an error
    message if the file is nonexistent.


    +   - -i puts you into “interactive” mode, meaning you are prompted to confirm
    each deletion.


    +   - -r puts you into “recursive” mode, meaning rm removes the contents of the
    target, including any subdirectories and their contents.


    The rm command is meant for deleting files. You use rmdir to delete directories.
    However, with the rm -r command, you can delete both files and directories in
    a single action. At the command line, there is no undo function for deleting files.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Wildcards


    When you want to manipulate more than one file at a time, you can use wildcards
    to specify groups of files. The standard Linux wildcard characters are *, and
    []. These are explained in the following table.


    | Wildcard | Meaning | Example | Lists files as |

    | --- | --- | --- | --- |

    | * | One or more characters | ls my*.txt | my.txt, mynotes.txt, myphotos.txt
    |

    | | | ls *.my.txt | astronomy.txt, my.txt, ohmy.txt |

    | | | ls *my* | astronomy.txt, my.txt, ohmygoodness.gif |

    | ? | A single character | ls my?.txt | my1.txt |

    | | | ls ?my.txt | amy.txt, Amy.txt, lmy.txt |

    | | | ls my.?? | my.gz, my-gl |

    | [] | A range of characters | ls [1-3].txt | my1.txt, my2.txt, or my3.txt |

    | | | ls [a,A]my.txt | amy.txt, Amy.txt |

    | | | ls [a-d]my.txt | amy.txt, bmy.txt, cmy.txt, dmy.txt |


    Pattern matching with wildcards is called *globbing*. The wildcard expression
    itself is called a glob. For example, in the statement `ls my*.txt`, the "my*"
    portion is called a glob. Linux cognoscenti go far as to verbalize this command
    like "L-S dot T-X-T."


    This terminology is left over from early UNIX days when an actual program, named
    glob, was used to perform pattern matching. Globbing is such an integral part
    of working with files that the functionality was eventually built into the operating
    system’s core. But the terminology remained.'
  merge: -1
  pgno: 90
