  md: '# Greeter configuration


    You can configure the GUI environment that is in place before any user logs on.
    This includes characteristics, as screen resolution and desktop background, as
    well as text messaging and more.


    In Linux terminology, the non-logged in environment is called the greeter—perhaps
    because it greets the user and invites him or her to log on and use the system.
    You can configure and theme the greeter in both KDE and GNOME environments.


    # KDE


    In a KDE environment, you edit the $KEDEDIR/share/config/kdm/kdmrc file. Depending
    on your version of KDE, that file might be located in the /etc/kde4/ or in another
    directory. Check your distro''s documentation.


    # GNOME


    In a GNOME environment, you edit the /usr/share/gdm/defaults.conf file to configure
    the greeter. Similar files in the /etc/gdm level directory exist but, generally,
    should not be used. They are meant to set distribution-level defaults. Any changes
    you make to the /usr/share/gdm/defaults.conf file will override those set in the
    /etc/gdm files.


    Easier than editing the configuration file, you can use the GUI Login Window Preferences
    tool. You find this tool under System, Administration menu. If you''re not logged
    in, you can still run this tool. From the command line, enter `sudo gdmsetup`
    to launch this tool. From the Actions menu, choose Configure the login manager.\This
    menu option, and the entire Actions menu, can be turned off so it isn''t available
    on a production system.)


    # B-5: Configuring the greeter


    | Here''s how | Here''s why |

    |---|---|

    | 1 Log off | You''ll configure the greeter from the screen. |

    | 2 Click **Actions** and choose **Configure the login manager** | |

