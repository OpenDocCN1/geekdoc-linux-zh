  md: '# Swap space


    Computers have a limited amount of physical RAM (random access memory), the working
    memory in which programs and operating system components operate. When RAM runs
    low, Linux can use virtual memory techniques to give the appearance of more available
    memory. The operating system uses a special file, called a swap file, to store
    data from RAM temporarily, freeing space for another program.


    Disk space is cheaper than RAM. So adding memory through a virtual memory system
    is an appealing option. Besides, when you need more you can simply increase the
    size of the swap file (assuming you have free space on your hard drive) without
    shutting down your computer to install new memory chips.


    Of course, a drive is considerably slower than memory chips. You experience a
    performance penalty each time the operating system moves data from RAM to the
    swap file or versa. Just the same, every system needs at least virtual memory.
    In general, you should have the same amount of virtual memory space as physical
    RAM. Earlier versions of Linux recommended double the swap space as actual RAM.


    # Swap space creation


    When you install Linux, you must create swap space. You can do so manually, through
    command-line tools, or through your distribution''s graphical installer. For many
    users, the latter is sufficient.


    You can create additional virtual memory by adding a new swap file. The following
    list describes, in increasing order of performance benefit, the other considerations
    you should make when creating a swap file:


    +   - Put swap on its own partition—By putting the swap file onto its own partition,
    you group all its sectors together physically on the drive. This saves time moving
    the read/write heads back and forth to read or write data. Separating swap onto
    its own partition makes backing up and restoring easier. You can simply skip backing
    up the entire swap partition rather than having to remember to exclude the swap
    file from a backup set.

    - Put swap on its own drive—By putting the swap file onto its own drive, your
    computer can perform read and write operations simultaneously. It could read the
    user''s data file and write to swap space at the same time.

    - Put swap on its own drive on its own controller—By putting the swap drive on
    its own controller or its own channel on the controller, the drive circuitry can
    perform multiple operations simultaneously.


    Additionally, you can assign a priority to swap files. The kernel uses the highest
    priority swap space first, before using the next-lower priority space. This feature
    enables you to tune swap space, putting the critical base amount on a high-speed
    drive and overflow space on a slower device. In reality, if you''re worrying too
    much about swap tuning, you really should be adding more RAM instead.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Creating swap space


    To create new swap space, follow these steps:


    +   1. Log in as root, or as root.


    +   2. Create or designate the space for your new swap file:

    * If necessary, create a new partition, marking it as a swap partition (type 82).
    Swap partitions are used “raw” without any file system. You do not need to create
    a file system (i.e., format) the partition. You need to modify the /etc/fstab
    file so that the partition is mounted as swap and assigned a priority during boot
    up.

    * If creating a swap file on a data partition, you must create a file that is
    the size you want to devote to the swap space. Such files are normal files, simply
    filled with junk data.

    3. Use mkswap command to designate the partition or file as swap space.

    4. Restart the system or use the swapon command to enable your new swap space.


    As noted in step 2, creating a swap file (as opposed to a swap partition), fill
    the file with the data. You do so for a couple of reasons:


    +   * First, filling the make ensures that the file reserves the amount of disk
    space you want to allot to swap space. This saves the operating system from having
    to enlarge the file or find space on empty sectors when it needs to swap data
    to the file.

    * Second, the swap file should be contiguous on the disk. If you were to create
    a small file, and the operating were later to expand it, the sectors that comprise
    the file are likely to be contiguous on the disk. Data corruption and simply slower
    operation could result.


    You can use the dd command to fill the swap file with data. This command copies
    and converts data. You can use it to read binary zeros from the special /dev/zero
    device and save them to the swap file. For example:


    ```

    dd if=/dev/zero of=/extraswap bs=1024 count=10240

    ```


    The parameters of the command are:


    +   * input file, in this case, /dev/zero.

    * output file, in this case, extraswap in the root directory.

    * block size—number of kilobytes to write to; in this case 10 MB width.


    # Managing swap space


    You can monitor free swap space using the free command. GUI tools, such as GNOME’s
    System Monitor, provide CPU, memory, swap, and network utilization details in
    a graphical format. The GNOME System Monitor is shown in Exhibit 7-7.'
