  md: '# Topic B: Setting your expectations


    Properly setting your expectations is essential to your success. This topic will
    help you do that by providing:


    +   - Prerequisites for this course

    - A description of the target student

    - A list of the objectives for the course

    - A skills assessment for the course


    # Course prerequisites


    Before taking this course, you should be familiar with personal computers and
    the use of a keyboard and a mouse. Furthermore, this course assumes you’ve attained
    CompTIA A+ certification or have equivalent experience.


    # Target student


    The target student for this course is a system or network administrator experienced
    in Microsoft Windows or another operating system environment. The best-prepared
    students will have earned their CompTIA A+ certification and will be familiar
    with common network administration tasks. Familiarity with any Linux distribution
    and comfort working at the command-prompt will be very helpful for students.


    # How to become CompTIA certified


    To achieve CompTIA Linux+ certification, you must register for and pass the CompTIA
    Linux+ Powered by LPI exams, LX0-101 and LX0-102.


    In order to become CompTIA certified, you must:

    1 Select a certification exam provider. For more information, students should
    visit http://www.comptia.org/certifications/testprep.asp

    2 Register for and schedule a time to take the CompTIA certification exam(s) at
    a convenient location.

    3 Read and sign the Candidate Agreement, which will be presented at the time of
    the exam. The complete text of the Candidate Agreement can be found at http://www.comptia.org/certifications/policies/agreement.asp.

    4 Take and pass the CompTIA certification exam(s).


    For more information about CompTIA’s certifications, such as its industry acceptance,
    benefits, or program news, students should visit http://www.comptia.org/certifications.asp.


    CompTIA is a not-for-profit information technology (IT) trade association. CompTIA’s
    certifications are designed by subject matter experts from across the IT industry.
    Each CompTIA certification is vendor-neutral, covers multiple technologies, and
    requires demonstration of skills and knowledge widely sought after by the IT industry.


    To contact CompTIA with any questions or comments, please call (630) 678-8300
    or e-mail questions@comptia.org.'
  merge: -1
