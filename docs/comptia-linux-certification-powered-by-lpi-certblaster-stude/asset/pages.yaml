  md: '# Topic B: File and directory permissions


    This topic covers the following CompTIA exam objectives for Linux+ [Powered by
    LPI] Certification, LX0-101 and LX0-102 exams.


    | # | Objective |

    |--- | --- |

    | 104.5 | Manage file permissions and ownership

    >- Manage access permissions on regular and special files as well as directories

    >- Use access modes such as suid, sgid, and the sticky bit to maintain security

    >- Know how to change the file creation mask

    >- Use the group field to grant file access to group members

    >- The following is a partial list of the used files, terms, and utilities:

    >- chmod

    >- umask

    >- chown

    >- chgrp |

    | 110.1 | Perform security administration tasks

    >- Audit a system to find file with the suid/sgid bit set |


    Explanation


    # File ownership


    In Linux, every file and directory is owned by a user and a group. For example,
    the files and directories that you create are owned by you and your primary group.
    As you will see, ownership controls what you and others can do with the files
    and directories on your system.


    ```

    ```File Edit View Terminal Tabs Help

    tim@debian:~$ ls -LF

    total 4

    drwxr-xr-x 2 tim tim 4096 2009-04-21 10:03 Desktop/

    -rw-r--r-- 1 tim tim 2009-04-22 06:21 samplefile

    User owner Group owner```

    ```


    Exhibit 4-6: The user and group owner are shown with the ls -LF command


    You can use the whoami command to determine your username. You can determine which
    groups you belong to by using the groups or id command. The groups command prints
    a list of the groups you belong to. The id command prints the same list, but includes
    GIDs (group ID numbers).'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# The newgrp command


    When you create a file, the system assigns group ownership to that file based
    on your primary group. Let''s say you want to create a file that is owned by a
    group other than your primary group. You use the `newgrp` command to log in to
    that alternative group. Any files you create are assigned that alternate group
    ID. When done, use the `exit` command to return to your usual primary group.


    # Changing file ownership


    You can change the user and group owners of a file or directory by using the `chown`
    (change owner) and `chgrp` (change group) commands. The syntax for the `chown`
    command is:


    ```

    chown [-R] username file_or_directory

    ```


    You enter the user name of the person you want to become the owner of the file,
    then the name of the file or directory. The `-R` option specifies to make the
    change recursively. In other words, when you change the ownership of a directory
    using the `-R` option, you change the ownership of that directory plus the ownership
    of all the files and subdirectories it contains.


    The `chgrp` command works very similarly; its syntax is:


    ```

    chgrp [-R] username file_or_directory

    ```


    Only the owner of a file or directory may change its user or group ownership.
    A practical limitation of this restriction is this: If you change the owner of
    one of your files to someone else, you may not change it back. The new owner of
    the file needs to make the change.'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# B-1: Managing file ownership via the command line


