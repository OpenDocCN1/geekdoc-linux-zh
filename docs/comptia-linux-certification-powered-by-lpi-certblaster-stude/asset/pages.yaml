  md: '# Graphics information


    Explanation provides two commands that output information about your graphical
    environment. You might find these tools useful when configuring X Windows or when
    troubleshooting a display problem. The commands are xdpyinfo and xwininfo.


    # The xdpyinfo command


    The xdpyinfo command outputs information about your monitor''s supported graphics
    modes. These details include color depth, resolution, and more. You don''t have
    to be root to run the command.


    # The xwininfo command


    The xwininfo command outputs information about individual windows. After running
    the command, you click on an open window. The command outputs dimensions, position
    information, color depth, and more. You don''t have to be root to run the command.


