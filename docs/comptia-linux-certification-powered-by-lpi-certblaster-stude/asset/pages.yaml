  md: '# dpkg Package Manager


    The Debian dpkg, is a command-line package manager. You can use it to install
    packages, report on installed packages, remove packages. To install a package
    using dpkg,

    enter:


    ```

    dpkg -i package_name

    ```


    This tool is primarily meant for managing .deb (Debian style) Many administrators
    also use it to get information about installed packages and libraries. In general,
    however, dpkg doesn''t manage dependencies in the Apt or Synaptic do.


    # YUM


    The Yellow dog (Updater Modified, better known as YUM, is a package management
    tool for .rpm (RedHat-style) packages. It fully manages dependencies and should
    be your primary package manager on RedHat family distributions. It uses a command-line
    syntax similar to the apt-get or aptitude syntax:


    ```

    yum install package_name

    ```


    By default, YUM queries the remote repositories each time you run it. You list
    (or modify) repositories in /etc/yum.reposd. To speed up the operation of YUM,
    you can create a local cache of package data. To the /etc/yum.conf file, add this
    line:


    ```

    keepcache=1

    ```


    Once that''s done, add the -c option to your YUM commands to use the locally cached
    data.


    In some instances, you might want to download a package but not install it. For
    example, if you need to install the same package on many computers, you might
    download a copy to put on your network for speedier access. You can use the yumdownloader
    command to download the package. Simply enter that command followed by the name
    of the package you want to download. The yumdownloader utility is not installed
    by default. Install it with this command:


    ```

    yum -y install yum-utils.noarch

    ```


    # RPM


    On RedHat-related distributions, such as Fedora, you can use the RPM package manager
    at the command line. You can also use it to report on installed packages and remove
    packages. To install a package using rpm, enter:


    ```

    rpm -i package_name

    ```


    This tool is primarily meant for managing .rpm (RedHat-style) packages. In general,
    rpm doesn''t manage dependencies in the YAY yum does.'
