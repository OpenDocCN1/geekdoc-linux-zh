  md: '# File and directory management


    | Directory | Stores |

    | --- | --- |

    | /var/lock | Lock files, which keep track of resources that are in use. |

    | /var/log | Log files. |

    | /var/mail | User mailboxes. Some systems still use the deprecated /var/spool/mail
    directory for this purpose. |

    | /var/spool | Temporary directory for tasks waiting to be processed, as print
    queues. |

    | /var/tmp | Temporary files that should be preserved by system reboots. |


    # Multiple volumes


    In Windows, each drive has its own folder hierarchy that starts at the root directory.
    Drives are given letters; the first hard drive, for example, is the C drive. The
    folder hierarchy on drive C is separate from the folder hierarchy on drive D.


    Linux operates differently. The operating system itself has a single directory
    hierarchy. Additional volumes and removable media don''t have separate hierarchies
    and drive designations. Instead, you must mount these volumes, merging their folder
    hierarchy into the overall hierarchy.


    Volumes and removable media may be mounted at any point in the directory hierarchy.
    Typically, however, you mount file systems on a CD drive becomes a set of subdirectories
    under the /media directory.


    There are benefits to putting FHS directories onto separate volumes. For example,
    you could put the /home directory onto its own volume to keep user-owned files
    separate from system files. Doing so makes backing up user files much more convenient.


    Some system types offer improved speed, improved error checking, and so forth.
    You could put the /var or /tmp files (logs or temporary files) onto a volume with
    a high-performance file system type. You wouldn''t need to worry as much about
    file integrity with such volumes.


    # Navigating directories


    You use the `cd` (change directory) command to move from one directory to another.
    To move to a new directory, you must enter an absolute or relative path. An absolute
    path begins at the root directory and includes all the names of directories between
    the root and your target directory. For example, the `cd` the games directory
    located within the usr directory is /usr/games.


    A relative path is the path starting from your current directory. If you''re in
    the /usr directory, the relative path of the games directory is just games. Another
    example, let''s say you''re in your home directory. You have a secret_project
    directory in your home directory and move into it. You enter `cd /home/your_name/secret_project`.
    Or you enter `cd secret_project`. You move from your current directory down into
    the secret_project directory.


    Linux (like Windows UNIX) includes two special directory references, the single
    and double periods. A single period is a “nickname” for the current directory.
    The double period refers to the parent directory, that is, the directory containing
    your current working directory.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_80_0.png)'
