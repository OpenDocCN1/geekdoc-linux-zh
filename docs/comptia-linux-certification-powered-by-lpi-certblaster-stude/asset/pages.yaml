  md: '# Privilege escalation


    In some cases, regular users do not have the necessary permissions to mount file
    systems; sometimes, privilege is reserved for the user. In other cases, regular
    users cannot unmount file systems. However, if the device was mounted with the
    user users option, then regular users can unmount the volume.


    If you have root access, such as when you''re operating your own computer, you
    can log on root to mount the file system. However, the better option is to use
    the su or sudo command to raise your privileges temporarily, perform the command,
    and then return to your normal operating level.


