  md: '# Daemons


    Modern operating systems differentiate processes into user and system processes.
    The programs you run, for example, are user processes. User processes are associated
    with your user account and with a terminal or GUI interface.


    Processes that run in the background are system processes. They are not associated
    with a terminal or graphical shell, though they are associated with a system-level
    user account (not the type you can log under). In Linux, these system processes
    are called daemons.


    According to Wikipedia, the name daemon comes from Maxwell''s demon, an imaginary
    being imagined by physicist James Clerk Maxwell. Maxwell imagined a being of mythical
    powers who worked with molecules as a vehicle of fleshing out the details of his
    Second Law of Thermodynamics.


    # Process IDs


    Every process is assigned a unique process ID (PID). The kernel and other processes
    use the PID to identify the process. Processes can start other processes; the
    process starting the subprocesses is the parent process; the subprocesses are
    child processes. Thus, in addition to a PID, every process has a parent process
    ID (PPID), which references its parent''s ID.


    The first process started by the kernel when you boot your system is the init
    daemon. It has a PID of 1 and a PPID of 0, which refers to the kernel itself.
    The init daemon starts many other processes, which have a PPID of 1 referring
    back to the init process. Some of those child processes start the processes that
    enable you to log on. Thus, parent and child processes form a tree of relations
    starting at the kernel.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_270_0.png)


    Exhibit 8-1: A small portion of the process tree


    PIDs are not assigned sequentially after PID 1. Instead, they are assigned randomly
    from a pool of available PIDs kept in a process table by the kernel.


    # The /proc pseudo-file system


    The files and directories in /proc represent running processes. Within that directory,
    numbered directories correspond to process IDs (PIDs). Files within each of those
    directories provide further details about each process.'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Interprocess communication


    Processes sometimes must communicate with each other. The D-Bus, or dbus, subsystem
    manages this interprocess communication with both a system and user-level daemon.
    For example, when you connect a new piece of hardware (say, a USB drive), system
    messages are sent to Udev (the device manager daemon) over the dbus communication
    pathways. System administrators rarely need to be concerned with dbus mechanisms.
    Application developers, however, will use dbus APIs (application interfaces) to
    enable interprocess communication.


    # Viewing processes


    GNOME includes a tool named System Monitor that you can use to view the processes
    on your system. You can use it to view your own user processes or all processes.
    Additionally, you can use the `pstree` command to view a text-mode process tree.
    Without any options, it shows all processes. You can add a user name option to
    show just that user''s processes. With the `-p` option, it lists PIDs for each
    process.'
