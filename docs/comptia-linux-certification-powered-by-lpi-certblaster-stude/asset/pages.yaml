  md: '# Using Linux 2-21


    You''re prompted to enter your password. Then, one by one, each line in your file
    is redirected to the `ftp` command, just as you''d typed in the text yourself.


    # STDIN, STDOUT, and STDERR


    STDIN is the “standard input” device, which in most cases is your keyboard. In
    Linux implementations, however, STDIN might be something else. Consider Linux
    running on a tablet computer with a touchscreen and no keyboard. In such a case,
    the touchscreen is likely configured as STDIN and treated much like mouse input.


    STDOUT is the “standard output” device. On modern computers, STDOUT is typically
    the monitor. historically, a line printer or modem was more likely to be the standard
    output device.


    STDERR is the “standard error” device, to which the operating system and commands
    send error messages. Let''s say you want to send the error messages from a fictional
    program to a file named error log. You''d use a command statement like the following:


    Many Linux commands, such as `echo`, read input from STDIN. Normal output from
    these programs is sent to STDOUT. Using piping and redirection, you can temporarily
    override these normal input and output locations.


    # Redirecting STDERR


    To override where error messages are sent, you must use a special form of piping
    and redirecting.


    ```

    ./someprogram 2> error.log

    ```


    This command says, in essence, to take the output sent to line 2, which is the
    error output, and redirect it to the error log file. The line 1 output, which
    is the standard output, is sent to its normal destination (STDOUT). You could
    send the output of both lines to the file with this statement:


    ```

    ./someprogram 2>& error.log

    ```


    The next trick involves using the `tee` command. It takes the text from STDIN
    and writes it to a file you specify. You can use `tee` to direct output to both
    a file and the screen. For example:


    ```

    ./someprogram 2>&1 | tee error.log

    ```'
