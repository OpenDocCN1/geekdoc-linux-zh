  md: '# Installing


    With versions of Linux, you used to have to gather all sorts of technical details
    about the hardware in your computer. (Some of the technically complex distributions,
    such as Slackware, still require this.) You needed to know the interrupts and
    IO addresses of your system, the graphics chipset your video adapter uses, and
    so forth. Arguably, one of the largest advancements in more recent Linux distros
    has been improved installers that detect all these values for you. In this way,
    modern Linux distros are now like Windows and Mac OS X in their ability to auto-detect
    and auto-configure hardware configurations.


    Another way installers have improved their ability to work cooperatively with
    existing operating systems on your computer. Previously, you had to install onto
    an empty hard drive or partition your drive prior to installing Linux into an
    empty partition. Modern desktop distros, in particular, now handle such details
    for you.


    During an installation, you can often specify to resize an existing Windows partition
    in order to make room for running Linux side by side with Windows on the same
    PC. Or, you can use the installer to erase a Windows partition for a “clean” install
    of Linux. Most Linux distros include boot loaders, which enable you to select
    which operating system to load when you boot your PC.


