  md: '# User accounts


    You can create user accounts at the command line or using your distribution’s
    graphical tools. This section covers the essential command-line tools and configuration
    files. The next section covers GUI tools.


    # Adding accounts


    Linux offers two command-line options for creating user accounts: useradd and
    adduser. In some distributions, such as Fedora and CentOS, adduser is simply a
    symbolic or hard link to the useradd command. On other systems, such as Debian
    and Ubuntu, adduser is a Perl or BASH script that prompts you for input and calls
    useradd in the background to implement your input.


    # The useradd command


    The useradd command is the low-level command for adding a user. When used in its
    most basic form, details for the new user are set at the system defaults. In its
    basic form, you simply enter:


    ```

    useradd username

    ```


    The user’s home directory, user ID, shell, and so forth are selected based on
    entries in two configuration files: /etc/login.defs and /etc/default/user. These
    files are described in the following sections. You can specify these command-line
    options to override the default values for the account as specified in those configuration
    files.


    | Option | To specify the user''s |

    | --- | --- |

    | -d or --home | Home directory (include the -m option to create that directory)
    |

    | -e | Expiration date of the account, in YYYY-MM-DD format |

    | -g | Group ID |

    | -p | Encrypted password (use crypt to encrypt a plain text password) |

    | -s | Shell |

    | -u | User ID (number must be unique and larger than 999) |

    | -k | Skeleton directory (which contains starting files and directories copied
    to the new user’s home directory) |


    If you don’t specify an encrypted password with the -p option, the user account
    is disabled until you set a password. You use the passwd command to set the password
    using this format:


    ```

    passwd username

    ```'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'You are prompted for the new password. Make sure to use a strong password,
    containing a mix of uppercase and lowercase letters, numbers, and even punctuation
    characters.


    # The /etc/login.defs file


    The /etc/login.defs file specifies these account defaults:


    +   - Default location for e-mail

    - Password expiration information

    - Minimum password length

    - Range of available user IDs and group IDs

    - Home directory defaults, including whether to create the directories automatically


    # The /etc/default/useradd file


    The /etc/default/useradd file contains these additional user account default values:


    +   - Default primary group

    - Home directory location

    - Default grace period (the number of days logins are permitted after a password
    expires)

    - Default account expiration date

    - Default shell

    - Skeleton directory location


    # The /etc/skel directory


    Various files contain commands that set user environment options, when the user
    logs in, or runs commands, when the user logs out. These “profile” files are stored
    in the user''s home directory, usually as hidden files (named with a leading period).


    The /etc/skel directory contains default user account profile files that are copied
    to the new user''s home directory after you run useradd. These files can include:


    +   - .bash_profile (not there by default)

    - .bash_login (not there by default)

    - .bashrc

    - .profile

    - .bash_logout


    In addition to these user-specific files, the /etc/profile file contains commands
    that are run when any user logs onto the system. It applies to all users and is
    executed first when a user logs in.


    If the ~/.bash_profile profile file exists, it runs next, but then none of the
    other login files are processed. If it doesn''t exist; the ~/.bash_login file
    is processed, if it exists, but no further files are processed. If that file doesn''t
    exist either, then the ~/.profile file is.


    The ~/.bash_logout file contains commands executed when the user logs out. The
    ~/.bashrc file contains commands run when a user starts a non-interactive shell
    (for a script or program). It is not involved with an interactive shell.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# CompTIA Linux+ Certification, Powered by LPI


    The adduser command The preferred command for adding users is the adduser command.
    This command determines the necessary parameters for the new account for you.
    For example, adduser determines the next available user ID and uses it so that
    you don''t have to do so yourself.


    ```

    adduser username

    ```


    There are various command-line options for this command. In general, you can rely
    on the prompts this program makes and any default settings specified in the /etc/adduser.conf
    configuration file.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_131_0.png)


    Exhibit 4-3: The adduser command prompts you for account information


    The etc/adduser.conf

    Theetc/adduser.conf file contains these additional user account default values:


    +   - Default shell

    - Home directory location

    - Range of available user IDs and group IDs

    - Default primary group

    - Home directory defaults, including whether to create the directories automatically

    - To set disk space usage quotas

    - Which extra groups the user should be added to


    # Editing /etc/passwd direct


    While it''s not generally recommended, you can create user accounts by editing
    the /etc/passwd file directly. You do this using the special vipw command, which
    locks the password file to prevent other users or processes from changing it while
    you''re making your changes.


    The vipw program works essentially like vi. You must manually enter a new line
    to represent the user, entering valid information for each user account fields.
    Typically, you enter an asterisk (*) for the password to prevent logins to the
    account. Then, you use the vipw command to start setting the password for the
    account.'
