  md: '# Managing libraries


    Developers need to use specific versions of a library while creating their applications.
    Administrators might want to test a flaky library with a specific version of a
    library to see if doing so fixes problems. For such situations, Linux allows you
    to override the default library locations, so that you can force a different library
    to be loaded.


    One way to override library locations is to edit the /etc/ld.so.conf file to include
    the directory containing your library. This is a somewhat permanent fix and should
    be used carefully. RedHat distros don''t include the /usr/local/lib directory
    in the ld.so.conf file. One reason to edit that file is to include the /usr/local/lib
    directory in the library search path.


    Another way to override the library locations is to add the directory to the LD_LIBRARY_PATH
    environment variable. This variable contains a series of directory names, separated
    by colons. Directories in this list are searched first, before the standard directories.
    In this way, you can override built-in directories on a user-by-user basis. Unless
    you edit the user profile files, your change lasts only as long as the shell (terminal
    window or login session) is maintained.


    # Determining library usage


    You can determine which libraries are used by an application using the ldd command.
    Use this format:


    ```

    ldd /path/file

    ```


    You must specify the full path to the executable. For example, to view the libraries
    by the ls command, you use this command:


    ```

    ldd /bin/ls

    ```


    The ldd command silently runs the executable, noting which libraries are used,
    then reports the results to you. Because the application is actually run, the
    ldd command presents a measure of risk. You should not run it with an unknown
    or untrusted program that might perform malicious actions.'
