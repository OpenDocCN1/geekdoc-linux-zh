- img_proc: true
  md: '# Kernel modules


    Kernel modules are dynamically loadable system components, such as device drivers,
    file system drivers, and system extensions. Prior to the development of kernel
    modules (with version 1.2 of the Linux kernel), you sometimes needed to recompile
    your kernel to add in these system components. Now, thanks to modules, you can
    simply load or unload the modules you need, in most cases, without altering the
    kernel itself.


    Another benefit of loadable modules, rather than a monolithic kernel, is that
    the modules are loaded into memory only when they''re needed. Let''s say you want
    to install a USB web camera. With the old method, the camera''s drivers remained
    in memory, even if you disconnected the camera. With modules, the driver is not
    loaded, if the camera is not connected.


    Modules are said to be loaded into the kernel. Modules become part of the kernel
    itself and have the same universal system privileges as the kernel itself has.
    Therefore, poorly written module can crash your system or corrupt data.


    Linux provides various utilities that you can use to manage kernel modules. These
    are listed in the following table.


    | Command | Use this command to |

    | --- | --- |

    | insmod | Insert a module into the kernel. In most cases, you should use modprobe
    instead. |

    | rmmod | Remove a module from the kernel. |

    | lsmod | List the currently loaded modules. |

    | modinfo | Display information about a module. |

    | modprobe | Insert or remove a module from the kernel. Unlike insmod, modprobe
    automatically handles module dependencies—dependent modules are automatically
    loaded or unloaded with modprobe. |


    # The lsmod command


    You use lsmod to list the modules that are currently loaded into your kernel.
    It lists the module name, size (in bytes), and information about other modules
    that use the module. A zero in the Used column indicates that no other modules
    use it; though that doesn''t mean the module is unneeded or unloaded.


    According to its man page, lsmod is a "trivial" utility that simply formats the
    contents of the /proc/modules file so that it''s more readable. If you look at
    the file, however, you see essentially the same information in the same format
    as the lsmod command. So, the man page is right, lsmod is trivial. It seems to
    do nothing more than cat /proc/modules!'
  merge: -1
  pgno: 292
- img_proc: true
  md: '![](img/b39d9dcef1d6eb273cbd81b16d07561e_293_0.png)


    Exhibit 8-6: Output of the lsmod command


    # The modprobe command


    You use modprobe to add or remove a module from the kernel as it is running. You
    can also use the command to get information about loaded modules. You must be
    root or use sudo when running modprobe.


    In generic form, the command''s syntax is:


    ```

    modprobe [options] modulename module_parameters

    ```


    The modprobe command supports various options. Some of those options are listed
    in the following table.


    | modprobe option | Description |

    || -c | Display the configuration file associated with a module and exit without
    installing or removing the module. |

    | -l | List modules. You can use a wildcard to search for modules by name. |

    | -n | Perform a "dry run" in which it does everything except actually install
    or remove the module. |

    | -r | Remove the named module. |

    | -v | Verbose mode, output extra messages about the program''s operations. |'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'As noted previously, modprobe takes dependencies into consideration when adding
    or removing modules. It does so by reading the modprobe.dep file, which contains
    a list of modules that should be loaded in the order they should be loaded. (The
    dependencies list is processed backwards.) When unloading modules, the modprobe.dep
    file is stored in the /lib/modules/architecture/ directory, where architecture
    is a name that corresponds to your kernel version.


    # Module and related configuration files


    You can specify which modules to load and settings to apply at boot time by entering
    them into one of the various module configuration files. Depending on your version
    of Linux and its kernel, you might have one or more of the following files or
    directories:


    +   - /etc/modprobe.conf—For kernels older than version 2.6, module configurations
    were typically saved to the modules.conf file.


    +   - /etc/conf.modules—In a few pre-version 2.6 kernels, module configurations
    were saved to the conf.modules file instead of modules.conf.


    +   - /etc/modprobe.conf—Starting with version 2.6, modules.conf was replaced
    by modprobe.conf. The files serve the same purpose.


    +   - /etc/modprobe.d/*—In the most recent kernel versions, the individual configuration
    files have been replaced by the various files in the modprobe.d directory. Each
    of the files in this directory is parsed during boot and the settings applied.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# C-2: Exploring kernel modules


    | Here''s how | Here''s why |

    | --- | --- |

    | 1 Open a terminal window | |

    | 2 Enter `lsmod | less` | To view the list of loaded modules.

    | Press `Q` | To quit out of less.

    | 3 Enter `sudo modprobe -l | less` | To view the list of available modules on
    your system. Not all of these are loaded. But, the list describes all the modules
    that can be enabled.

    | Press `Q` | |

    | 4 Enter `sudo modprobe -l net*` | You can view subsets of the module list by
    using wildcards.

    | 5 Enter `cd /etc` | To view a list of files and directories beginning with "mod."
    Most likely, a modprobe.d directory is listed.

    | Enter `ls modprobe.d` | Use the cat command with modules.conf, if that file
    is present instead.

    | Enter `ls` | To view the files in this directory. There are various module startup
    scripts included here.

    | 6 Enter `cd /lib/modules` | To view the available directories. If more than
    one is listed, note the name of the higher-named directory (they''re typically
    named after your kernel''s version).

    | Enter `ls` | |

    | Enter `cd directory_name` | To view the files in this directory. The modules.dep
    file should be listed.

    | Enter `ls` | |

    | Enter `less modules.dep` | To view the file''s contents. Each module is listed
    on its own line. If it has dependencies, they are listed sequentially after the
    full colon. Modules are loaded left to right and unloaded right to left.

    | Quit `less` | Press `Q.`'
  merge: -1
