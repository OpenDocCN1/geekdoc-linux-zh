  md: '# Formatting disk


    Explanation

    While GParted a new partition for you automatically, at the command line you must
    perform this step yourself. Once you create a partition with fdisk, you must make
    the file system with mkfs. When that is done, check the file system with fsck.


    # mkfs


    The mkfs (make file system) command creates file systems, in other ways, formats
    your partition. In general, you use the command like this:


    ```

    mkfs -t filesystem_type /dev/hdX#

    ```


    You specify the file system type as ext2, ext3, and so forth. See the man pages
    for a full list of supported file types. When you specify the device, usually
    a hard drive partition, as /dev/hdb1.

    nYou must run mkfs as root or via sudo.


    # fsck and e2fsck


    Linux offers various commands for checking and repairing file systems, which are
    necessary steps after formatting a new partition. The traditional fsck (file system
    check) command checks most file system types, including ext2 and ext3. It works
    as a front-end to file system-specific checking program.


    Use the following command to check and repair a specific file system automatically:


    ```

    fsck -a /dev/hdX#

    ```


    If you don''t specify a file to check, the program attempts to check all the file
    systems listed in your /etc/fstab file. This could cause problems with your root
    partition, as it would be mounted read/write during the operation, and you could
    corrupt your partition.


    A newer utility, e2fsck, checks ext2 and ext file systems only. With such partitions,
    this is the utility you should run. It correctly interacts with the journaling
    systems supported by these file systems. The e2fsck command does not act as a
    front-end to e2fsck; you should run e2fsck directly.


    Use the following command to check and repair a specific file system automatically:


    ```

    e2fsck -p /dev/hdX#

    ```


    You must run fsck as root or via sudo.

    When either of the checking utility finds corrupted files, it puts them into a
    special directory named lost+found in the root of your volume. The files you find
    in that directory are corrupted and probably only partially recoverable. You might
    be able to extract some useful information from some of them, however, you won''t
    be able to recover a damaged file fully from the lost+found directory.'
  merge: -1
