  md: '# Creating groups


    As with user accounts, you can edit a configuration file (/etc/group) to create
    groups. However, you''re better off using the groupadd command or the appropriate
    graphical tool, which safely edits the appropriate files for you.


    ```

    groupadd [options] group_name

    ```


    | Option | Use it to |

    | --- | --- |

    | -g GID | Specify a particular group ID (rather than accepting the system-assigned
    ID). |

    | -p password | Specify a password for the group; password must be encrypted text,
    as created by crypt. |

    | -r | Create a system group. |


    # The /etc/login.defs file


    If you don''t specify the various options, the groupadd command reads system defaults
    from the /etc/login.defs file. These values include:


    +   - Range of GIDs (group IDs) supported on the system

    - Maximum members per group


    # Adding a user to a group


    Once you have created a group, you can add users to it with the -G option of the
    usermod command:


    ```

    usermod -G group[,group2, etc.] username

    ```


    You can specify either the group''s name or ID when assigning users. To add a
    user to more than one group, simply list all the groups separated by commas without
    spaces after the -g flag.


    You can determine which groups you belong to by using the groups or id command.
    The groups command prints a list of the groups you belong to. The id command prints
    the same list, but includes GIDs.


    # Removing a user from a group


    There is no command for removing a user from a group. You could edit the /etc/group
    file directly to delete the individual''s entry. Find the line representing the
    group. The last field is a comma-separated list of members of the group. Delete
    the username and associated comma from the list and save your changes.


    # Modifying and deleting a group


    As with user accounts, you should use the specialty commands for modifying and
    deleting groups. These are groupmod and groupdel. Information about these commands
    is available in the man pages.'
  merge: -1
  pgno: 139
