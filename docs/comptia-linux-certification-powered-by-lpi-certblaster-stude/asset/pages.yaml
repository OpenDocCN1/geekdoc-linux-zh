    # Mounting removable storage


    In Windows, each drive gets a letter identifier and contains its own root directory
    and directory hierarchy. When you plug in a USB drive or insert a disc into your
    optical drive, your system assigns that storage device a drive letter. You must
    refer the file letter to access the new file system.


    With Linux, however, you merge the file systems into one overall hierarchy by
    mounting the new device. Instead of having its own identifier and directory hierarchy,
    the removable storage device''s contents are made accessible as if they were located
    in some existing directory on your computer.


    # Automatic mounting


    Modern versions of Linux, particularly those configured for desktop (end-user)
    automatically mount some types of removable storage media. For example, if you
    insert a CD or plug in a USB drive, Debian and Ubuntu (and surely others) automatically
    mount the media for you. These operating systems even add an icon to the desktop
    to make the contents as simple as double-clicking.'
  merge: -1
  pgno: 113
