    | Debian GNU/Linux | Debian is a community-developed Linux distro managed by the
    Project. Debian is regarded as a highly customizable and powerful distro. Generally,
    Debian can be described as an intermediate user''s version of Linux; slightly
    harder to use and more customizable than some distro, but less feature-rich than
    others. Ubuntu is based on Debian. |

    | Slackware | Slackware is one of the oldest distros still undergoing active development.
    It''s a popular, highly technical distro aimed at experienced Linux "power users.\|


    You can get detailed information about most of the top Linux distros at http://distrowatch.com/.
    http://en.wikipedia.org/wiki/List_of_Linux_distributions entry at Wikipedia lists
    even more distributions.


    # Open source licensing


    Linux is distributed under a software licensing model called open source. With
    open source licensing, you are free to use, modify, and even redistribute the
    original programming code, provided you comply with specific terms of the license.
    There are many open source licenses under which software can be distributed. Linux
    follows the GNU Public License, or GPL.


    # Closed source


    In contrast to open source, closed source is the software industry''s traditional
    licensing model. Such licenses give you the right to use the software (with various
    limitations). However, you are typically restricted from reverse-engineering,
    modifying, or redistributing the software. The original publisher retains ownership
    and full control of the software. Microsoft Windows, Microsoft Office, Adobe Photoshop,
    Apple iTunes, and so forth are examples of software distributed under closed source
    licenses.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# GPL


    Developed by the Free Software Foundation (FSF), the GNU Public License is one
    of the premier open source licensing models. GPL software is free software. According
    to the FSF, “free software” is a matter of liberty, not price.” In other words,
    the GPL is meant to provide you the freedom to use and distribute software and
    ensure that the software you distribute under the GPL is free from proprietary
    claims of ownership, forms of legal liability, and onerous burdens associated
    with the use and sharing of software. It doesn''t mean GPL costs nothing or that
    you can''t charge money for software you release under the GPL.


    According to the GPL, in general, you may:


    +   - Use the software on one or more computers as you see fit

    - Copy and distribute the program in compiled or source code version

    - Modify the program and distribute the modified version


    Provided that:


    +   - Any copies you distribute are covered by the GPL

    - Any copies you distribute include a copyright notice, exclusion of warranty,
    and a copy of the GPL

    - Any copies you distribute include the source code or an offer to make the source
    code available


    Together, these provisions protect you both as the user and author of the software.
    GPL software is distributed without warranty. This means you cannot sue or be
    sued by users of the software should problems arise related to the use of the
    application. Furthermore, you cannot, nor others, take ownership of the software
    and release it under a different license.


    As of this writing, the current version of the GPL is called the GNU Affero General
    Public License v3, or GPL v3. Many programs continue to be distributed under the
    older GPL v2 license.


    # GNU Lesser Public License (LGPL)


    The LGPL represents an interim place between the free software covered by the
    GPL and software licensed under both more permissive and more restrictive licenses.
    In a general case, you can''t mix program components using one license with components
    using another. For example, you can''t create a closed source program that uses
    components covered by the GPL.


    The classic classification for the LGPL given by the FSF is a programming library.
    In programming, a library is a self-contained component that provides a specific
    type of boxes or class of functionality. For example, a library might need to
    draw boxes on the monitor. Any time a program needs to draw a box, it can “call”
    the library to do so. Libraries enable programmers to focus on the task at hand
    rather than reinventing basic functions for each program.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'So let''s say you wrote a library for drawing these boxes and released it under
    the GPL. Another programmer couldn''t use your library in her program unless she
    also released her program under the GPL. Libraries are so useful that the FSDec
    there should be an exception for reusable code, such as libraries, so that anyone
    can benefit.


    If you released your box-drawing library under the GPL, other programmers could
    use your library in their programs, even if those programs are released under
    another license. In the broader realm of computing, LGPL is useful for hardware
    drivers, DLLs, programming APIs, and so forth. Entire programs are rarely released
    under the GPL.


    # PHP, Apache, and other license models


    The FSF''s GPL and LGPL models are certainly not the only open source licensing
    models. While some are more restrictive, many of these alternate licenses are
    considerably more liberal than the GPL.


    +   * PHP—The PHP license, which originated with the PHP programming language,
    is an open source license with restrictions. Chief among the restrictions is that
    derivations cannot use the name PHP in their name or to promote their products.
    The license''s restrictions apply to the code of the PHP programming language,
    not to programs written with that.

    * BSD—The BSD license is a generally permissive license that grants permission
    to use, modify, and redistribute software. It requires you to include the original
    copyright notice and disclaimers with your modified or redistributed versions.
    You can''t reuse the code under a different license.

    * Apache—Used with the Apache web server, this model enables you to use the software
    for any purpose. You may redistribute the software in original or modified form.
    Unlike the GPL, this license doesn''t require you to apply the Apache license
    to your distributed program.

    * MIT—One of the more permissive of the open source models, the MIT license permits
    you to use, release, and modify software, and even to change the licensing used
    by your modified version. Projects released under the MIT license include the
    X Window System (X11), jQuery programming library, PuTTY secure terminal system,
    and Bouncy Castle (encryption) API.


    A large list of open source software licenses is available at www.opensource.org.


    # Freeware and shareware


    “Freeware” is not a software licensing model. It means only that the software
    is provided for free. Freeware could be covered by any of the preceding open source
    licenses or could use a proprietary or closed source license.


    Likewise, shareware isn''t a licensing model. Such software is distributed in
    a trial version, with either limited features or a time- or use-limit imposed.
    You have to pay the licensing fees to obtain full access to the software. Shareware
    is typically distributed under a closed source license.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Creative Commons


    The licenses so far apply to software. You can''t generally use any of those software
    licenses with documentation, books, articles, videos, songs, and so forth. The
    Creative Commons group has released various licensed to be used with these non-software
    digital resources, collectively called the Creative Commons licenses.


    These are documented at http://creativecommons.org/about/licenses and range from
    Attribution (licensees must simply acknowledge you as the original creator) to
    Attribution Non-Commercial No Derivatives (which permits non-commercial redistribution,
    but no modification or relicensing).


    # Public domain


    In the USA and other countries, you automatically own a copyright on something
    as soon as you commit it to a "tangible" medium. In most cases, tangible doesn''t
    mean physical. Writing a Web page, which exists entirely as digital bits and bytes,
    is considered tangible in the eyes of copyright law. By controlling the copyright,
    you control what can and can''t be done with your creation.


    The opposite of copyrighted is public domain. Public domain materials aren''t
    owned by anyone in particular but instead are owned by the people and thus are
    in the public domain. Anyone can do anything with public domain materials. In
    practice, you probably couldn''t claim public domain materials as your own, copyright
    them, or release them under some sort of restrictive license. Someone would simply
    need to show that the materials existed before in the public domain to invalidate
    your claim.'
  merge: -1
