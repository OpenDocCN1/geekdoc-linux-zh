  md: '# BASH proficiency


    Explanation


    The BASH shell offers many features to ease the difficulty of working with commands
    rather than clicks. We examine some of them in this section, starting with a simple
    trick to use when the output of a command is too long to fit on the screen. You
    can press Shift+Page Up to view previous screens of output. Use Shift+Page Down
    to scroll back down a page''s worth of output.


    Let''s say you''re trying to whoami, and you type "whao" and realize you''ve reversed
    the last two letters. You can hit Backspace twice and retry the letters. Or, pressing
    Ctrl+T and BASH will reverse the last two letters for you automatically.


    # Prior commands


    You can rerun prior commands by pressing the up and down-arrow keys until you
    find the command you want, then pressing Enter. By default, BASH saves your previous
    500 commands in a file named .bash_history (named with a leading period) in your
    home directory. You can use the history command to print this command history
    to your screen.


    In addition to using arrows, you can use the !! to rerun prior commands. Entering
    !! and BASH runs your previous command. It can also provide a shortcut to commands
    you haven''t used in a while. Let''s say you wanted to rerun a command that began
    with the letters "wh"; you could enter !!wh; and press Enter. BASH runs the most
    recent command you entered with those letters. To be sure you''re going to run
    the right command, enter !!wh-; and BASH prints the command to your screen without
    executing it.


    The history command output includes numbers, which you can use to re-execute the
    commands. Simply enter ##, where ## is the number of the command you want to run.


    BASH provides a few keyboard shortcuts to escape the task of editing a prior command.
    After you press the up or down arrows to arrive at the previous command, you can
    use the following shortcuts as you edit that command to match your current needs:


    +   * Ctrl+b—to move your cursor character to the left without erasing (or use
    the left arrow key)

    * Ctrl+f (or use the right arrow key)—to move your cursor character to the right

    * Ctrl+w—to erase the word to the left of your cursor

    * Ctrl+u—to erase everything to the left of your cursor

    * Ctrl+a—to move your cursor to the beginning of the line

    * Ctrl+e—to move your cursor to the end of the line

    * Alt+. (Alt period)—to reuse the last argument from the previous command


    # Shell variables


    Shell variables are references to system information, such as the path to your
    home directory. Rather than typing in one of these values manually, you can use
    the variable and let BASH figure out the true values for you. This can be especially
    helpful when you don''t know that real value.


    Most shell variables begin with the dollar sign ($) by the variable name following
    in all capital letters.'
