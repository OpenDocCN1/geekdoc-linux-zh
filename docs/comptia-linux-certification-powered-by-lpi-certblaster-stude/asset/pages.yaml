  md: '# Unit summary: System administration


    Topic A


    In this topic, you learned about user and group management. You used the useradd,
    adduser, passwd, usermod, userdel, chfn, groupadd, groupmod, and groupdel commands
    to add, modify, and delete users and groups. You used the Users and Groups GUI
    tool to perform many of the same tasks. You also learned how to escalate privileges
    with the su and sudo commands.


