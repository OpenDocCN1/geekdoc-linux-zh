  md: '# Library locations


    On most Linux systems, library files are stored in a few specific locations. The
    following table describes some of the common locations for various types of libraries.


    | Location | Library types |

    | --- | --- |

    | /usr/lib | System libraries, such as those used by core Linux utilities. These
    libraries are typically included with the Linux distribution and upgraded as the
    distro is updated. |

    | /usr/local/lib | Application and other non-system libraries. These libraries
    are not included with the distro (unless the particular application that installed
    the libraries is itself included with the distro). |

    | /lib | Any libraries required by the system startup process are placed in this
    directory. |

    | /usr/X11R6/lib | On some systems, X Windows libraries are stored in this directory.
    |

    | /lib/security | Pluggable authentication modules, which are security-related
    libraries. |'
