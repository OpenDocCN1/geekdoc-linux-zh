  md: '# Starting and stopping the GUI


    With other distributions or distributions that don''t rely on a GUI, your system
    might not start the GUI automatically. Alternatively, you might stop the GUI to
    perform certain system operations. To run the GUI, you have to start X Windows.


    You can start X Windows manually with the `startx` command. You can start the
    GUI as a normal user. This command is universal, regardless of the distribution
    and display manager (KDE, GNOME, and so forth). It is a script that sets various
    values, including the path to the X command, which loads the X Windows server.


    The command to stop the GUI varies by system. With Debian and other GNOME-based
    distributions, as root, enter `/etc/init.d/gdm stop` to shut down GNOME. You''re
    returned to a command prompt in a logged-off state.


    # B-7: Stopping and starting X Windows


    | Here''s how | Here''s why |

    | --- | --- |

    | 1 Open a terminal window | If necessary. |

    | 2 Enter `sudo /etc/init.d/gdm stop` | |

    | Enter your password, if prompted | To shut down the GUI. |

    | 3 At the text-mode login prompt, log on as your normal user | |

    | Enter ls | You are logged in and placed in your home directory. You can use
    the various Linux commands to interact with the system. |

    | 4 Enter `startx` | To start X Windows and the display manager. |'
