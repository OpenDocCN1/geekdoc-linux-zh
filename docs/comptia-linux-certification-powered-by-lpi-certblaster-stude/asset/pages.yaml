  md: '# Getting help


    Explanation As you probably know, there are hundreds of BASH commands. Many applications
    add even more commands for you to learn and use. How can you know all these commands,
    their options, and arguments?


    Fortunately, most Linux distributions include various help tools to make finding
    something easier. You can also turn off the Internet for articles, blog posts,
    and examples.


    # man pages


    Linux documentation is typically delivered through man pages, short for manual
    pages. To read the documentation on a particular command, enter man followed by
    the command name. Syntax and explanatory information about the command will display
    your screen.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_69_0.png)


    Exhibit 2-7: The man page for the ftp command


    +   Each man page includes sections, few of the more important of which are:

    - Name—states the command''s name and a short description of its purpose.

    - Synopsis—gives the syntax of the command, its options, and arguments.

    - Description—provides a full description of the command and its purpose. Options
    and arguments are described in detail in this section.


    The output of a man page is shown one screen at a time. Press Enter to advance
    one line or Space to advance one screen. With some distros, you can also use the
    Page Up and Page Down keys to move through the screens of information. When you
    reach the end of a man page, further presses of the Spacebar or Enter keys don''t
    do anything. Press the Q at any time to exit the man page.


    # Sections


    Linux commands are categorized by sections in the man page database depending
    on the purpose of the command. The following table lists the man page sections
    and the types of commands each contains.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# Section Command types and purposes


    | Section | Command types and purposes |

    | --- | --- |

    | 1 | User level programs and shell commands |

    | 2 | Linux system calls (kernel functions) |

    | 3 | Library functions |

    | 4 | Special files (usually found in /dev) |

    | 5 | File formats and file conventions, such as documenting the /etc/passwd file
    |

    | 6 | Games |

    | 7 | Miscellaneous entries, including macro packages |

    | 8 | Programs and commands that only the root user may execute |

    | 9 | Nonstandard kernel routines |


    Not all distributions use the exact same categorization scheme. You can find out
    your system''s man structure by viewing the man pages for the man command (enter
    man).


    Sometimes the same keyword is used for both a command and something else, such
    as a library routine, so that there are two page entries. For example, locale
    is both a shell command and a file used within programs. It has two man page entries:
    one in section 1 and one in section 7.


    By default, man displays the lowest-number section page first. So, if you type
    locale, the section 1 man page displays. To display a page from a higher section,
    include that number in your command. For example:


    ```

    man 7 locale

    ```


    # Info pages


    Novice users in particular find man pages complex and hard to follow. An alternative,
    the info pages, were created to provide simpler instructions more suited to end-users
    and beginners.


    The info and man pages work similarly, though perhaps differently enough to be
    a bit frustrating. While viewing an info page, you press Spacebar to view the
    next page of information. With some distros, you can also use the Page Up and
    Page Down keys to move through the screens of information. Pressing Enter activates
    a cross-reference, if one exists, rather than advancing the display by a single
    line as with man pages. Also unlike man pages, when you reach the end of an info
    page, pressing Spacebar again returns you to the beginning of the page. But, like
    man pages, you press the Q key to exit the info page.


    Some info pages begin with copyright or other information not directly to getting
    help with a command. You have to press Spacebar as necessary to bypass these screens.'
