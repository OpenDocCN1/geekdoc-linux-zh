  md: '# Installing a new drive


    Most often, you create file systems and install disk drives when initially installing
    Linux. You might need to add a disk to a working system. For example, you might
    add a new drive to expand the storage space available on a system.


    You need to take various steps to install a new drive:


    +   - Select a drive type

    - Select a file system type

    - Physically install it in your system

    - Partition the drive

    - Mount the drive, either manually or automatically at boot time


    # ATA/IDE


    PC boards typically feature two ATA drive controllers, each with two channels.
    You can attach one drive to each channel. With ATA, the first drive on a controller
    is called the master and the second slave. Under Linux, these four drives show
    up as:


    +   - Primary master = /dev/hda

    - Primary slave = /dev/hdb

    - Secondary master = /dev/hdc

    - Secondary slave = /dev/hdd


    # Serial ATA (SATA)


    SATA dispenses with the master/slave architecture, instead providing a separate
    controller to each drive. Under Linux, SATA drives show up as:


    +   - First SATA drive = /dev/sda

    - Second SATA drive = /dev/sdb

    - and so forth


    # SCSI


    Each SCSI controller supports a maximum of either 7 (older SCSI systems) or 15
    devices, one of which is the controller itself. Under Linux, these drives show
    up as:


    +   - First SCSI disk = /dev/sda

    - Second SCSI disk = /dev/sdb

    - Third SCSI disk = /dev/sdc

    - and so forth'
  merge: -1
