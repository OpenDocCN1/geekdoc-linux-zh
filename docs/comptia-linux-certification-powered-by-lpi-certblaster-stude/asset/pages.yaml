  md: '# Links


    You can create alternate names for files and directories through links. Linux
    supports two types of links, hard and soft. To understand links, you need to understand
    how Linux stores files.


    # inodes


    There are essentially three components to a file: its data, its name, and its
    *inode*. The data part should be obvious. File names are simply a cross-reference
    between the name you use to access the file and the inode number, which identifies
    the inode. The inode is the key to file storage on Linux and UNIX operating systems.


    An inode is a data structure, a sort of database entry, that stores information
    about a file—user and group ownership, permissions, and other metadata. Critically,
    inodes store a reference to where the data is located on the disk.


    In practice, a predetermined amount of space on the disk—typically one percent—is
    reserved for inodes. They are stored together in one location on the disk. The
    remainder of the disk stores files (name/inode reference structures) and file
    data. Directories are just a special kind of file that stores a list of names
    (name/inode reference structures)


    Deleting a file removes the name/inode reference to the file''s data. The actual
    data and inode remain until that space is needed for something else. Technically,
    as soon as you open a file (such as an application), the system references the
    data via the inode, not via file. So, you can delete a file of a running application
    without stopping or affecting the application. This scheme makes it possible to
    replace application and operating system files while such programs are in use.


    Conceptually, then, a file name is something like “myfile=12345” where 12345 is
    the inode''s identification number. A *hard link* is simply an alternate name
    for a file''s data. In other words, a hard link is just another name for the same
    data. Conceptually, it stores something like “myhardlink=12345” in which it references
    the same inode number, thus the same data.


    In Linux, there is no priority or special status to the first name for a file.
    Continuing the preceding example, myfile and myhardlink are equivalent; Deleting,
    moving, or renaming myfile has no effect on myhardlink, and vice-versa.


    You create a hard link with the `ln` command using this syntax:


    ```

    ln file link

    ```


    If successful, `linkname` becomes a new file entry (a hard link), referencing
    the same inode and data as `file`. You cannot create a hard link to a directory.
    You can create hard links only for files on the same volume as the original file.


    # Soft links


    A soft link is a reference to a file or a directory. Also called a *symbolic link*,
    or *symlink*, a soft link is not simply a new name/inode cross-reference, like
    a hard link. Instead, a symbolic link is a text string describing the absolute
    or relative path to a file or directory. Depending on the operating system, size
    of the path, and other factors, the reference may be stored within the inode or
    within a file (in its data).'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'To the operating system and applications, a symbolic link appears as a normal
    file. Exceptions are programs that need to know the file is a symbolic link, such
    as backup programs. In other words, you can write to, open, run, and otherwise
    use symbolic links as if they were the actual original files.


    You create a hard link with the ln command using this syntax:

    `ln -s path/target linkname`


    You can use an absolute or relative path when specifying the original target,
    which can be a file or directory name.


    Because symbolic links specify a path to the original file, altering original
    file breaks the link. If you move, rename, or delete the original file, the symlink
    remains points to nothing. Moving, renaming, or deleting the symbolic link has
    no effect on the original file.


    # Linking versus copying


    Depending on your needs, you might choose to either link to a file or copy that
    file. With linking, you don''t use a significant amount of disk space to have
    an additional reference to a file''s contents. But keep in mind that the link
    points to the original and there''s only one copy of the actual file. Changing
    “the contents of a link” is really changing the original information. Copying
    a file is advantageous when you want to have distinct versions with different
    information in each.


    # Windows shortcuts and Macintosh aliases


    If you''re a Windows user, you may have used shortcuts. At first glance, shortcuts
    and symbolic links are similar. Both are pointers, or references to the original
    file. However, Windows shortcuts are actually files containing the path to the
    original file. Applications must be written to recognize shortcuts; otherwise
    they won''t use them as links but as an icon, dates and times of last access,
    and so forth.


    The Macintosh operating system provides aliases, which like symbolic links, are
    pointers to actual files and directories. The primary difference is that Macintosh
    aliases remain connected to the original file if that original file is moved or
    renamed.'
  merge: -1
