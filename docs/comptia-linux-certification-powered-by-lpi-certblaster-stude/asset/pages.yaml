  md: '# Deleting and disabling accounts


    Your first reaction when a user leaves or is fired might be to delete his or her
    user account. However, such an action is permanent. What if the user is reused?
    What if you need to access his or her files as part of a legal or civil investigation?
    In many cases, disabling an account (with usermod -L username) is a better option.


    However, if you''re sure you want to delete an account, you should use the userdel
    command. It deletes the necessary entries from the /etc/passwd and /etc/shadow
    files. If you specify the -r option, it deletes the user''s home directory and
    contents.


    ```

    userdel [-r] username

    ```


    # PastPositions UIDs


    Internally, users are represented by their user ID numbers. If you''re not careful,
    you can reuse UIDs. If you do so, any files or resources owned by the former holder
    of UID would become the owner of the new user.


    Let''s say Bob leaves the company, and you delete his account but not his home
    directory. If you hire Annette as Bob''s replacement, and when you create her
    account, you reuse the UID formerly assigned to Bob, Annette would be listed as
    the owner of Bob''s files. This might or might not be a problem. But it''s critical
    that you know that this is what will happen when UIDs are reused.


    # Modifying groups


    You can modify groups, for example to rename them, by using the groupmod command.
    Using this command is safer than directly modifying the /etc/group file. For example,
    use the following command to rename a group:


    ```

    groupmod -n new_groupname old_roupname

    ```


    # Deleting groups


    You can delete groups with the groupdel command. You can''t use this command to
    delete the primary group of any existing user; you have to delete that user or
    reassign him or her to another group first. The first command takes no options
    and follows this syntax:


    ```

    groupdel groupname

    ```'
  merge: -1
  pgno: 141
