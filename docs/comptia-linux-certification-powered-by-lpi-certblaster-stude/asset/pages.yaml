  md: '# Using Linux 2-3


    But the Command Prompt runs as component within the GUI.

    Prior to OS X, the Macintosh worked the same way. In fact, command-line tools
    were supported only with add-ons and not as part of the core operating system.
    OS X has that changed, because it''s built atop a Linux-like BSD core. Most people
    still work with the GUI on their Macs, but the command-line is there, hidden under
    the covers.


    # Client-server architecture


    X Windows is a client server system in display functionality is divided between
    client and server components. While it might seem backward, the client is the
    program you run and interact with. The server is the component that reads keystrokes
    and mouse clicks and displays output on your monitor.


    The X terminology is taken from the perspective of the application (not of the
    user). So, applications (clients) make requests of the server to display output
    or get input from the user.


    The primary benefit of this split nature is that you can run the server on one
    computer and the client on another. In other words, X is built from the ground
    up to support remote computing. You can use a GUI terminal interface over the
    network to access a central computer that performs most of the “heavy duty” processing
    work.


    # Virtual consoles


    Looking at the diagram in Exhibit 2-1, you can see multiple shells running out
    the kernel. Linux is a multitasking operating system, and it can perform more
    than one task at a time for you, including running multiple shells. One way you
    can run multiple shells is by using virtual consoles.


    In its traditional use, a console refers to your keyboard and monitor—your primary
    input and output devices. If your hardware supports it, you can connect more than
    one console (keyboard and monitor) to your computer and run separate programs
    via each console. Alternatively, Linux supports virtual consoles, which are software
    equivalents to separate keyboard and monitor configurations.


    You can run more than one virtual console at a time and switch between them using
    Ctrl+Alt key combinations. The following table lists the virtual consoles that
    Linux supports and the keys you can use to switch among them.


    | Console name | Key combination | Interface type |

    |---|---||

    | tty1 | Ctrl-Alt+F1 | Command-line |

    | tty2 | Ctrl-Alt+F2 | Command-line |

    | tty3 | Ctrl-Alt+F3 | Command-line |

    | tty4 | Ctrl-Alt+F4 | Command-line |

    | tty5 | Ctrl-Alt+F5 | Command-line |

    | tty6 | Ctrl-Alt+F6 | Command-line |

    | tty7 | Ctrl-Alt+F7 | Graphical (GUI) |'
