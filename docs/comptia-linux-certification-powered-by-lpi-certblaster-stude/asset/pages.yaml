  md: '# 7-8 CompTIA Linux+ Certification, Powered by LPI


    parted

    The GNU partition editor, parted, is a text-mode editor. It is included automatically
    with many Linux distributions and as a downloadable package for others.Debian,
    for example, doesn''t include parted by default.


    In general form, the command is used like this:


    ```

    parted [options] [device [command]]

    ```


    For example, the following command could create a new partition on /dev/hdb and
    format it to the ext2 file system, starting at cylinder 1 for 1024 megabytes (1
    GB).


    ```

    parted /dev/hdb mkfs ext2 1 1024

    ```


    If you do not supply a command when you ran, it presents you a command prompt
    (interactive mode) at which you can enter the commands. For example, you might
    enter


    ```

    parted /dev/hdb

    ```


    At which point, you would be given a prompt at which you can enter parted commands.Then,
    you could enter:


    ```

    mkfs ext2 1 1024

    ```


    To create a 1 GB ext2 volume on the drive.


    # GParted


    The GNOME Partition Editor (GParted), shown in Exhibit 7-4, is a graphical partition
    editor.With it, you can perform all of the same actions you could with `fdisk`.
    Many users find GParted easier to use, thanks to its graphical interface. Rather
    than enter commands, you select from menus, click buttons, and fill in dialog
    boxes.


    GParted is included with many Linux distributions. You can also download it from
    http://gparted.sourceforge.net. You can even download a “live CD” version, which
    you can put on a CD or USB drive and then boot from. Doing so enables you to use
    GParted to modify disks used by operating systems, such as Windows, that don''t
    include a native Gparted implementation.'
