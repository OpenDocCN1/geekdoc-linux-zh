  md: '# SUID and security


    Programs with the SUID bit set run as if the program''s owner were running them.
    If that owner is root, it means the program run with full-system permissions.
    Such programs are a prime target for hackers or malicious users.


    You should audit your systems for programs that have the SUID bit set. You should
    search especially for files owned by root with the SUID bit set. Then you can
    remove the SUID bit, as appropriate, for each of the files.


    To audit for files owned by any user with the SUID bit set, use this command:


    ```

    sudo find / -perm -4000

    ```


    To audit for files owned by root with the SUID bit set, use this command:


    ```

    sudo find / -perm -4000 -uid 0

    ```


    You can audit for directories with the SGID bit set by using this command:


    ```

    sudo find / -perm -2000

    ```


    You can redirect the resulting information to a file for later reference. However,
    depending on the form of your command, the output is likely also to show on the
    screen. Regardless, error messages are sent to the console (to STDERR, actually).
    To suppress errors and send normal output to a file, use this command:


    ```

    sudo find / -perm -4000 -fprint filename 2>/dev/null

    ```'
  merge: -1
