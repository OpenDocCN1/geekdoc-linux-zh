  md: '# Hands-on activities


    The hands-on activities are the most important parts of our manuals. They are
    divided into two primary columns. The “Here’s how” column gives short instructions
    to you what to do. The “Here’s why” column provides explanations, graphics, and
    clarifications. Here’s a sample:


    # A-1: Creating a commission formula


    | Here’s how | Here’s why |

    | --- | --- |

    | Open Sales | This is an oversimplified sales compensation worksheet. It shows
    sales totals, commissions, and incentives for five sales reps. |

    | Observe the contents of cell F4 | F4 [v] =E4$C Rate

    The commission formulas use the name “C_Rate” instead of a value for the commission
    rate. |


    For these activities, we have provided a collection of data files designed to
    help you learn each skill in a real-world business context. As you work through
    the activities, you want to make a mistake and therefore want to re-key the activity
    starting from scratch. To make easy to start over, you will rename each data file
    at the end of the first activity in which the file is modified. The convention
    for renaming files is to add the word “My” to the beginning of the file name.
    In the above activity, for example, a file called “Sales” is being used for the
    first time. At the end of this activity, you would save the file as “My sales,”
    thus leaving the “Sales” file unchanged. If you make a mistake, you can start
    over using the original “Sales” file.


    In some activities, however, it might not be practical to rename the data file.
    If you want to retry one of these activities, ask your instructor for a fresh
    copy of the original data file.'
  merge: -1
