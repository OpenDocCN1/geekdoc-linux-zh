  md: 'Swap data, specifically, doesn''t need or benefit from journaling. In fact,
    journaling requires extra processing and transfer overhead, which is contrary
    to the purpose of swap data. Because swap data is dynamic, loss during a drive
    failure or power outage is not a problem; the data will be recreated the next
    time you boot, regards.


    # Swap partition size


    When you run programs that consume more memory than you have installed in your
    computer, some portions of memory are stored on the swap partition. This creates
    the illusion that your computer has more RAM than it actually does. This begs
    the question of how much swap space is sufficient.


    Most guides make recommendations similar to the following:


    | Amount of RAM | Amount of disk space | Recommended swap size |

    |---|---||

    | Low, less than 1 GB | Low, 30 GB or less | 512 MB – 1 GB swap |

    | Low, less than 1 GB | High, 100 GB or more | 1 – 2 GB swap |

    | High, 2 GB or more | Low, 30 GB or less | 1 GB swap |

    | High, 2 GB or more | High, 100 GB or more | 2 GB swap |


    In all cases, adding physical RAM is better than adding more swap space. However,
    expanding the size of your swap partition later is more difficult than creating
    a larger partition when you install Linux. So, don''t skimp unless you''re very
    limited on disk drive space.


    # Partitioning utilities


    Partitioning utilities are the software you use to create and manage partitions
    and the file systems. In most cases, these utilities are built into the installer
    or are run separately during installation. You can also download and use some
    separately. For example, you can use gpart, the GNOME Partition Editor, to manage
    partitions.


    With gpart, you download an ISO file image, create a CD, and boot with that disc.
    Your system loads a minimal Linux environment from that disc and opens the gpart
    utility automatically. In fact, you can use gpart to manage Windows and Linux
    partitions without installing Linux onto the computer.


    Once your computer is up and running, you can use gpart or its command-line equivalent,
    *parted* (for "partition editor"), to modify your existing partitions. When creating
    new partitions with *parted*, you might also need to use the *mkfs* ("make file
    system") to create your file system. You can execute this command as part of your
    *parted* command. For more information on *parted*, see your system''s man pages
    or visit www.gnu.org/software/parted/manual/html_mono/parted.html.'
