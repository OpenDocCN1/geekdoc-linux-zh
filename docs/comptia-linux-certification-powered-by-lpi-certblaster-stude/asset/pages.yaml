  md: '# System administration


    # 4-3


    # User security


    Explanation


    Linux is a multi-user system, meaning more than one person can use the same computer.
    Networking is built into the very core of the operating system. For this reason,
    user identification and authorization are critical functions. Linux performs these
    functions via user and group accounts.


    You can determine the name of the currently logged-on user account using the whoami
    command. It simply prints the username to the screen. Alternatively, you can use
    the id command: it prints your user ID, group ID, and the list of groups you belong
    to.


    # User accounts


    Every user account on a system is represented by a line in the /etc/passwd file.
    Each user entry contains nine fields, separated by colons. Exhibit 4-1 illustrates
    a sample /etc/passwd file.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_124_0.png)


    Exhibit 4-1: An /etc/passwd file


    The fields of the /etc/passwd file are:


    +   * User name

    * Encrypted password or reference to the /etc/shadow file

    * User ID

    * Group ID of the user''s primary group

    * GECOS description, typically left blank

    * Home directory

    * Shell (for example, bin/bash to load the bash)


    Internally, Linux works with the user id, also called the uid, not the name.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# CompTIA Linux+ Certification, Powered by LPI


    Any user can read the /etc/passwd file, which means anyone can view the encrypted
    form of the password. The encryption techniques are known, meaning it is possible
    that someone could recover a user''s encrypted password. In practice, doing so
    is very difficult, as long as users select strong passwords.


    To improve security, some systems are configured to store passwords in the /etc/shadow
    file instead. This text file is readable only by root and root kernel functions.
    The encrypted password is stored in the shadow password file while the /etc/passwd
    file lists an "x" in the place where the password would normally be located. This
    improves security, but course doesn''t mean users select weak passwords!


    ```

    File Edit View Journal Tabs Help

    root:*:11C:y/M/SEVbdudgv424mD81QID::4348:0:999997::

    damon:*:4348:0:999997::

    bin:*:4348:0:999997::

    sys:*:4348:0:999997::

    sync:*:4348:0:999997::

    games:*:4348:0:999997::

    man:*:4348:0:999997::

    lp:*:4348:0:999997::

    mail:*:4348:0:999997::

