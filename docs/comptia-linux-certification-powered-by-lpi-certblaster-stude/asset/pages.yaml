  md: '# User-defined functions


    Aliases are used for performing single commands, even if you want to use a complex
    set of options. But what if you want to perform a series of commands? Can you
    use shell functions to do this.


    You can create functions within shell scripts. But you can also create them at
    the command line. To create a function, you use a form similar to the following:


    ```

    function_name ()

    command 1 goes here

    command 2 goes here

    ...

    }

    ```


    The parentheses and opening curly bracket tell the shell that you''re defining
    a function. Within your function, you can enter any shell commands you like, one
    to a line. End the function with the closing curly bracket and press Enter. As
    with aliases, functions remain in effect until you close the shell.


    Within your function, you can access data supplied by the user. Such data is entered
    as additional words, separated by spaces, at the same time as the command. The
    first word provided on the command line is represented as $1 within your function.
    The second is $2, and so forth. For example:


    ```

    hi() {

    echo How are you doing today $1?

    }

    ```


    Then, let''s say you entered the following line:


    ```

    hi Bob

    ```


    The output will be

    How are you doing today Bob?'
