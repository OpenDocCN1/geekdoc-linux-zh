  md: '# Command-line package managers


    Explanation


    You don''t have to use a graphical package manager. If you know the name of the
    package you want to install, you can use a tool, such as apt or yum, to install
    it. The text-mode aptitude tool also works without a GUI, making it suitable for
    remote administration over a slower network connection.


    Like their graphical counterparts, the command-line package managers download
    packages from the repositories you specify. With some distributions, you configure
    the repository during operating system installation. You can change that information
    later.


    # APT


    The command line tool for using the APT package manager is apt-get. To install
    a package using apt-get, you must know the package''s name. Then, you enter a
    command such as the:


    ```

    apt-get install package_name

    ```


    The apt-get queries the repository, downloads the package''s files, and installs
    the software. The apt-get tool provides limited automatic management of dependencies.
    It installs new dependencies when you install a package. However, if you remove
    a package with apt-get, it doesn''t remove dependent packages.


    # Aptitude


    The aptitude tool operates in two modes: command-line and "curses" mode. As a
    command-line tool, aptitude works generally like apt-get, even following the same
    general syntax. For example, to install a package, you enter:


    ```

    aptitude install package_name

    ```


    Unlike apt-get, aptitude fully manages package dependencies. It also tracks installed
    applications, upgrades, and available packages. The easiest way to use those features
    is through its curses interface, as shown in Exhibit 6-2. In that mode, the tool
    runs as a menu- and keyboard-driven text-mode application.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_201_0.png)


    Exhibit 6-2: Aptitude''s curses mode interface'
