    # Video configuration


    Modern window environments, such as GNOME and KDE, offer simple tools for adjusting
    the video output of your Linux system. Historically, this was not the case. It
    was necessary to edit various configuration files with specific video hardware
    information.


    With distros, such as Debian, Ubuntu, and Fedora, the installation routines detect
    your video hardware configuration. The installer also automatically configures
    the various window environment settings and starts the GUI by default.


    # Manual configuration


    If you’re running an old distribution, or an advanced hacker-oriented distro,
    you might still have to edit files yourself. The files you depend on your X Windows
    version, as listed here:


    +   - X Windows version 11 (X11) — /etc/X11/xorg.conf

    - XFree886 — /etc/X11/XF86Config'
