    | /dev/zero | Read from this device to get a binary zero value, which is not the
    same as the ASCII zero character you enter from your keyboard. The binary 0 is
    equivalent to a NULL value. | Character |


    # # Disabling integrated devices


    When you disable an integrated peripheral in the system''s BIOS, it is no longer
    available when Linux starts. In the next time Linux starts, the device doesn''t
    exist and thus isn''t mapped to files in the /dev/ directory. You might disable
    an integrated video adapter, for example, if you''re planning to use an add-on
    card that provides better functionality.


    # # Hardware compatibility list


    Before install a new device, you should check the hardware compatibility list
    (HCL) published by your distribution''s authors. For example, you should confirm
    that a new video card or monitor is supported by your X server before installing
    the card. Otherwise, you might end up with no video or with scrambled video output.
    Such a list is typically published on the group''s Web site and is often included
    within the distro''s files.'
