  md: '# Command line interface (CLI)


    Most Linux distros include GUI interfaces. And in most cases, the GUI starts automatically.
    This feature provides a comfortable interface for novice users and those switching
    from Windows or OS X. Frankly, graphical tools help even experienced system administrators
    to perform configuration tasks, particularly those they do only once in a while.


    Unlike OS or X, you don''t have to use the GUI in Linux. You can work entirely
    via the command line interface (CLI) to do everything from managing your computer
    to writing and laying out complex publications.


    Another advantage of the Linux CLI is that it''s the engine behind the GUI. Everything
    you can do in the GUI you can do with a text. This isn''t always the case with
    Windows and OS X. Experienced users and administrators can take advantage of the
    CLI to write scripts to automate common tasks or to manage systems remotely over
    low-bandwidth network connections—feats that are more difficult in other operating
    systems.


    # Shells


    A shell is a command line interface to an operating system. In the case of Linux,
    it''s your means of interacting with the kernel through typed commands. Actually,
    a shell you interact with Linux is called an interactive shell. This is the terminal
    window type of shell, akin to a Command Prompt window in Microsoft Windows.


    Non-interactive shells are used to run scripts and commands in the background.
    You can''t interact with a non-interactive shell, meaning you can''t type or input
    information in response to prompts from commands or from the system.


    We''ll focus on interactive shells, of which there''s a huge range available for
    Linux systems. Linux shells are simply programs that run atop the kernel. Each
    shell provides its own set of commands, options, and means of interaction. Common
    Linux shells include the Bourne-Again Shell (bash), TC shell (tsh), Z shell, public
    domain Korn shell, and various others.


    # BASH


    The Bourne shell was developed by Stephen Bourne of AT&T Bell Laboratories in
    1977. Linux can''t use the Bourne shell directly because of licensing restrictions.
    However, most Linux distros use the BASH shell, an open source shell modeled on
    the Bourne shell and incorporating features from the Korn shell (ksh) and C shell
    (csh).'
  merge: -1
