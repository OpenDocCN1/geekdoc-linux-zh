  md: '# Managing directories


    Creating your own directories enables you to organize your files in meaningful
    ways. You can, for example, store all the files related to a particular project
    in a single directory. Linux also gives you the tools to rename and delete directories
    at the command line and via the GUI.


    # Creating directories


    You can create directories by using the mkdir (make directory) command. Simply
    enter mkdir and then an absolute or relative path reference to the new directory,
    like this:


    ```

    mkdir path/directory_name [path/directory_name]

    ```


    As you might surmise from the command syntax, you can issue a single mkdir command
    to create multiple directories. Simply list each directory to be created, separated
    by spaces.


    ```

    mkdir ''secret project''

    mkdir secret\ project

    ```


    # Renaming directories


    You can rename a directory by the mv (move) command. You can think of this moving
    all your files from the old directory to one with your new name. In fact, you
    can move a directory, and rename it in the process, by using the mv command. If
    you specify the same starting and ending location, files aren''t actually moved;
    the directory is simply renamed.


    ```

    mv path/old_directory_name path/new_directory_name

    ```


    # Deleting directories


    You can delete empty directories using the rmdir command. Simply enter the command,
    followed by the directory to remove, like this:


    ```

    rmdir path/directory_name [path/directory_name]

    ```


    Deleting directories that contains files is made purposefully difficult. You can
    add the --ignore-fail-on-empty switch to the rmdir command to delete non-empty
    directories. The better method is to use the rm (remove) command to delete the
    files first. Then, delete the directory.


    With the -p option, you can delete not only the target directory but also its
    parent or parents. In other words, the two following commands are equivalent.


    ```

    rmdir -p parent1/directory

    rmdir parent1/directory parent1

    ```'
