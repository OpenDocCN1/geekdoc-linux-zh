  md: '# Topic B: Managing shared libraries


    This topic covers the following CompTIA exam objectives for Linux+ [Powered by
    LPI] Certification, LX0-101 and LX0-102 exams.


    | # | Objective |

    |---|---|

    | 102.3 | **Manage shared libraries**<br>- Identify shared libraries<br>- Identify
    the typical locations of system libraries<br>- Load shared libraries<br>- The
    following is a partial list of the used files, terms, and utilities:<br>- lld<br>-
    ldconfig<br>- /etc/ld.so.conf<br>- LD_LIBRARY_PATH |


    # Libraries


    A programmer writing an application for Linux rarely writes every single piece
    of functionality from scratch. Programmers frequently reuse existing bits of code
    in their applications. They might use functions they themselves wrote for other
    programs. Or just as likely, they might use common functions written and by other
    programmers. Collections of shared functions are called libraries, and in Linux,
    there are three types:


    +   - Static libraries

    - Shared libraries

    - Dynamically loaded (DL) libraries


    # Static libraries


    A static library is associated with a single program, and a single version of
    that program. The files associated with such libraries are named with the .a extension.
    Static libraries are mostly of historical interest, as few modern programs use
    this type. Static library files are distributed with a program and kept together
    with the rest of the applications files or with its configuration files.


    # Shared libraries


    Shared libraries, as the name suggests, can be shared between programs and versions
    of programs. This makes them much more flexible for both their originator and
    programmers who want to use libraries in their programs. Various techniques are
    used to enable users to upgrade shared library versions without breaking compatibility
    with existing programs that use those libraries.


    # Dynamically loaded libraries


    DL libraries are similar to shared libraries, except that they can be loaded or
    unloaded by a program as needed. A shared library is loaded when the application
    is launched. A DL library is loaded by a plug-module, or feature of the program
    as an-needed'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Application management


    basis. Such runtime loading offers better performance and memory use. But DL libraries
    are more complex to create and use within programs.


    # Shared libraries


    Linux shared libraries are flexible and enable you or a programmer to:


    +   - Update installed libraries while supporting programs written to use older,
    sometimes incompatible, versions of those libraries.

    - Override specific library functions with new versions.

    - Update and install libraries while programs that use those libraries are running.
    This feature is critical for updating system components without requiring a shutdown.


    Some of these capabilities are made possible by the naming and linking system
    used by shared libraries. File names begin with lib, include an .so extension,
    followed by additional dotted extensions that specify the version of the library.
    This name is called the library''s *soname*.


    # The soname


    The full name for a library includes both major and minor version numbers. For
    example, a (fake) library might be libfake.so.3.2. In this name, .3 represents
    the major version and .2 the minor. Major versions might introduce new functions
    or make changes that are incompatible with previous versions. Minor versions might
    include bugs but should otherwise be compatible with each other.


    When another program seeks to use that library, it specifies the soname associated
    with a major version. An application named BogusApp might require libfake.so.3.
    So that program should work fine, regardless of whether you have libfake.so.3.1
    or libfake.so.3.2 installed. It probably wouldn''t work with libfake.so.4.


    If a program is written to use a library via its major-version name, how does
    Linux know to load the actual library file on your system that might include a
    minor version number? It uses symbolic links.


    # Links created by ldconfig


    The ldconfig command scans the standard library directories (which are listed
    in /etc/ld.so.conf file) and creates symbolic links pointing to the actual library
    files. It creates a series of symlinks that point to the various major and minor
    versions installed on your system. When ldconfig is unable to determine library
    types and versions, it reads the /etc/ld.so.conf file. That file contains a list
    of names and associated libraries.


    Let''s continue with our libfake example. The ldconfig command creates a link
    libfake.so, which points to another link named libfake.so.# In that name, # is
    the major number associated with the highest major version installed on your system.
    For example, if the newest version were 4, libfake.so would link to libfake.so.4.


    For each major version (represented by M) on your system, there is one or more
    minor (N) versions. The ldconfig command creates a link, named after the major
    version that points to the most recent (highest-numbered) minor version. Continuing
    the example, libfake.so.4 might point to the actual libfake.so.4.3 file. And ldconfig
    might also create a link named libfake.so.3, which points to libfake.so.3.6.'
  merge: -1
