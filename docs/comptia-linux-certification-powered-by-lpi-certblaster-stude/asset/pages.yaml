  md: '# Metacharacters Description


    ; Command separator. You can enter more than one command on a single line by separating
    each with semicolons. For example, `pwd; echo $RANDOM` executes both commands:
    BASH prints your current directory and then a random number to your screen.


    () or {} Group two or more commands and treat their output or exit status as a
    unit.


    & Background execution


    && and || AND and OR operators for working with multiple commands. For example,
    consider these two lines:


    ```

    cd /bin && ls

    cd /bin || ls

    ```


    With the first, BASH attempts to change to the /bin directory. If that''s successful
    (you had permissions to do so), then it lists the contents of the directory. If
    the cd command fails, the second command is ignored.

    With the second line, if you fail to change directories, BASH still lists the
    contents of the current directory (not the /bin directory).


    # Tab completion


    You can use the Tab key to perform a few completion tricks. Let''s say you want
    to change directories to the /usr/games directory. Type `cd /usr/g` and press
    Tab. BASH adds the "ames" to your command text. Press Enter and change directories.


    Of course, this action assumes you''ve entered enough information for BASH to
    decipher a unique completion. If there are both games and generic directory in
    the /usr/ directory, the preceding completion won''t work: /usr/g isn''t unique.
    When you press Tab, you''d hear a beep telling you so. Press Tab twice and BASH
    lists all the possible matches for what you entered. You can then try again, entering
    a unique partial command and pressing Tab to complete it.


    You can also use Tab completion with system commands. Let''s say you want to determine
    how long your system has been running. The command is `uptime`. Simply type upt,
    press Tab, and BASH completes the command for you.


    # Sources for further learning


    A complete reference to the GNU implementation of BASH is available at www.gnu.org/software/bash/bashref.html.
    Check your distribution''s documentation for any distro-specific information.'
