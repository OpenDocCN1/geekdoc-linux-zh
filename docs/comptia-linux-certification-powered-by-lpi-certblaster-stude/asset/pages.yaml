  md: '# PCI devices


    Similar to the `lsusb` command, you can use the `lspci` command to view devices
    connected to your computer''s PCI bus. This is the internal expansion bus to which
    you connect devices such as display adapters and disk controllers.


    ```

    lspci [-v | -t]

    ```


    The information output by `lspci -v` is read from the `/proc/bus/pci/devices`
    file. This special file is created by the kernel during boot time and is the operation
    of your computer. It represents the live state of your computer''s PCI bus.


    # D-4: Viewing devices on the PCI bus


    | Here''s how | Here''s why |

    | --- | --- |

    | 1 Enter `lspci` | To view basic information about the devices connected to your
    PCI (internal expansion) bus. |

    | 2 Enter `sudo lspci -t` | To view the PCI information in a tree-like format.
    This view is less helpful than with `lsusb`. |

    | 3 Enter `sudo lspci -v` | To view extended information. |

    | 4 Enter `cat /proc/bus/pci/devices` | To view the contents of the devices file,
    which contains detailed information about your PCI devices. |'
