  md: '# Topic C: Kernel modules


    This topic covers the following CompTIA exam objectives for Linux+ [Powered by
    LPI] Certification, LX0-101 and LX0-102 exams.


    | | Objective |

    |---|-|

    | 101.1 | **Determine and configure hardware settings**

    The following is a partial list of the used files, terms, and utilities:

    * /sys

    * /proc

    * modprobe

    * ismod |

    | 103.1 | **Work on the command line**

    The following is a partial list of the used files, terms, and utilities:

    * uname |


    # Kernel information


    *The kernel* is the core component of the Linux operating system. It performs
    the most basic, central, system functions, such as managing the interactions between
    hardware components and starting other processes. The kernel exists as a layer
    of software between user-space applications and the CPU, memory, and other hardware
    of your computer.


    All operating systems have a kernel, though they vary in detail. The Windows kernel
    is not the same as the Linux kernel, which is not the same as the Macintosh OS
    X kernel. Other than version differences, most Linux distributions use the same
    kernel. Sometimes the distribution authors choose different kernel options when
    compiling the kernel for use their distro. Thus, even though Fedora and Ubuntu
    might use the same kernel, the two operating systems operate differently at their
    core. (The primary difference between distros is the selection of user-space utilities
    they include.)


    # Kernel information


    You can determine information about your kernel by using various commands. You
    can also examine the files in the /sys and /proc directories, as each of those
    contains files representing the kernel, modules, and other components of your
    computer.


    With the *uname* command, you can get data about your kernel, including its name,
    version, and hardware architecture information. The command provides various options,
    of which the -a (show all) option is probably the most useful.


    You can also use the cat command to view the contents of the files in the /proc
    or /sys directory. For example, entering cat /proc/version displays most of the
    same information as you get with the *uname -a* command.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# CompTIA Linux+ Certification, Powered by LPI


    The files in /proc /sys show a size of 0 bytes, even though they contain data.
    Commands like less, more, head, and tail check the size first. They don''t display
    any output when used with files in /proc and /sys, because “believe” them to be
    empty. You must use care instead.


    # Kernel tuning


    For many users, the kernel as configured from the factory is all they ever need.
    However, experienced system administrators may want to change some aspects of
    the kernel to suit their needs better. For example, changing memory allocations,
    enabling networking features, and even hardening the kernel against attacks modifying,
    or tuning, the kernel.


    Adjusting kernel options was complicated with older versions of Linux. You had
    to modify the kernel''s source configuration files. Then you recompiled the kernel
    and hoped your changes wouldn''t prevent it from compiling. The sysctl command
    was added in kernel version 1.3.57 to make tuning simpler.


    With sysctl you can view and adjust kernel options. The command has a few options,
    which are listed in the table following the command''s general syntax form:


    ```

    sysctl [options] [variable=value]

    ```


    | sysctl | Description |

    | -a | Print all the current keys (configuration values) and their values. |

    | -e | Ignore errors about unknown keys. It doesn''t suppress all errors; for
    example, permissions-related errors still show. |

    | -n | Don''t print the key''s name when printing its value to the screen. Used
    when viewing current settings |

    | -p filename | Load the values from the file you name. If the name is omitted,
    the values are read from /etc/sysctl.conf. |

    | -w | Write (save) the value you specify. |


    The changes you make with sysctl remain in effect until you reboot the system.
    You can make the changes permanent by editing the /etc/sysctl.conf file. As your
    system boots, it reads the file and sets the kernel configuration options.


    Use care when changing this file, or you could end up with an unbootable system.
    Make sure to test the new values first with sysctl. If they work as you expect,
    then edit the /etc/sysctl.conf file to load those tested values at boot time.


    # Common sysctl settings


    The biggest use of sysctl is to tune network parameters. We have not covered Linux
    networking yet, so coverage here will be brief. According to various reference
    sources, using sysctl to tune your network for performance is rarely required
    with modern kernels. You might still use sysctl to improve the security of your
    network.'
  merge: -1
  pgno: 289
