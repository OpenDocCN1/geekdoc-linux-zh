  md: '# Command aliases


    Command aliases are alternate names for existing commands. Aliases can include
    any combination of command options that you applied every time you execute the
    command. Typically, you use aliases to provide a shortcut means to execute a command
    with default options. For example, if you like to use the -LF option with the
    ls command, you can define an alias for that that includes the options.


    You can view the current aliases by entering alias by. To set a new alias, use
    this syntax:


    ```

    alias name=''command_syntax''

    ```


    For example, you can create an alias for the ls command that always produces a
    long list, with file types identified, and color coding enabled with this command:


    ```

    alias ls=''ls -LF --color=auto''

    ```


    For the remainder of terminal session, entering ls by itself would produce the
    same output as entering ls -LF --color=auto. Command aliases are stored as variables
    along with the default variables and the user-defined variables you create.


    # The type command


    You can determine what an alias corresponds to by using the type command. You
    can also use this command to determine if an alias or keyword exists exists. It
    gives path information or tells you if a command is built into the shell.


    ```

    type command_or_alias

    ```'
  merge: -1
