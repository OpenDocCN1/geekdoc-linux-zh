  md: '# Installed software


    Explanation

    You can use the graphical or command-line package managers to determine what software
    you have installed on your system.


    # Graphical package managers


    With the Synaptic Package Manager, click the Status button. Then, select one of
    the categories to get a list of software on your system.


    +   - Installed all software installed on your system.

    - Installed (auto removable)—software that can be removed by the package manager.

    - Installed (upgradable)—software that the package manager can update.

    - Not installed—software that is not installed on your system.


    Other graphical package managers offer similar listings.


    # Command line techniques


    You can use the command-line package managers to gather a variety of information
    about the software installed on your computer. The following tables describe command
    options you can use with apt and RPM. Other tools offer similar options.


    | apt commands | Function |

    | apt-cache show package | Displays a description of the named package, its version,
    and so forth. The package can be installed or one you downloaded but didn''t install.
    |

    | apt-cache search package | Searches for and displays a description of the named
    package, its version, and so forth. The package can be installed or one you downloaded
    but didn''t install. |

    | dpkg -l | (With a lowercase L, not a one.) Lists the packages installed on your
    system. |

    | dpkg-query -l | (With a lowercase L, not a one.) Lists the packages installed
    on your system. |


    | RPM commands | Function |

    | rpm -q | Queries information about the packages on your system. Most often,
    this option is used with the others listed in this table. |

    | rpm -qi [package] | Displays extended information about the packages (or the
    named package) on your system. |

    | rpm -qa [package] | Displays the names of all the packages (or the named package)
    installed on your system. |

    | rpm -ql [package] | Displays the locations of all the packages (or the named
    package) installed on your system. |

    | rpm -V package | Verifies that the named package was installed correctly. |'
