    | 104.4 | Manage disk quotas**

    * Set up a disk quota system for a filesystem

    * Edit, check and generate user quota reports

    * The following is a partial list of the used files, terms, and utilities:

    * quota

    * edquota

    * repquota

    * quotaon |


    # Disk quotas


    You can use quotas to limit the amount of disk space available to each user on
    your computer. Obviously, you would have little need to do this if you were the
    only user on your computer. However, in a multiuser environment, quotas make sure
    that each user gets his or her fair share of space.


    You can create soft and hard limits:

    * Soft limit—Users may exceed their disk space allotment for a period of time.
    That time is seen in days by default; you can configure that period.

    * Hard limit—Users may not exceed their disk allotment.


    You set quotas on a per-user or per-group basis. If you set quotas by group, all
    of the members of the group share the space you allot. Managing who users use
    part of that allotment is difficult, and nothing in group-based quotas would stop
    one member from using all the allotted space. For this reason, user-based quotas
    are typically used.


    Quotas are typically enabled at boot time by entries in /etc/fstab. In part, this
    is because the file system must be mounted with quota support. Alternatively,
    you can use the mount command to remount a mounted file system, specifying the
    necessary options to enable quotas. Entries in the fstab file make sure that quotas
    are always enabled every time the system boots and more reliable means to use.
    See the entry for /dev/hdb1 in Exhibit 7-9, for an example of how quotas are enabled
    in the fstab file.


    Explanation'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# # System configuration


    Once you mount the file system with quota support, you turn on and off quotas
    using the quotaon and quotaoff commands, respectively. Once you turn on quotas,
    you must set limits for users using the edquota command.


    ```

    File Edit View Terminal Tabs Help

    tim@debian:~$ cat /etc/fstab

    # /etc/fstab: static file system information.

    #

    # <file system> <mount point> <type> <dump> <pass>

    proc /proc defaults 0 0

    /dev/sda1 / ext3 errors-remount-ro 0 1

    /dev/hda5 /media/cdrom iso9660 user,noauto 0 0

    /dev/fd0 /media/floppy auto rw,user,noauto 0 0

    /dev/hdb1 /mnt/drive2p1 ext3 rw,usrquota=quota.user,jqfmt=0 0

    /dev/hdb2 /mnt/drive2p2 ext2 rw,auto 0 0

    tim@debian:~$

    ```


    Exhibit 7-9: The /etc/fstab file with quotas enabled


    # ## File system type considerations


    Internally, quotas work differently with journaled file systems from how they
    work with non-journaled file systems. What this means to you is that you must
    enable quotas differently depending on your file system type. If you do not, quotas
    might not be enabled or might not be tracked on your file systems.'
  merge: -1
