  md: '# Topic A: Linux overview


    Explanation

    Linux is a UNIX-like operating system originally developed by Linus Torvalds,
    starting in 1991 while a student at the University of Helsinki. Like all operating
    systems, Linux enables the most basic common system operations, such as file management,
    user account management, and so forth. It provides a means for users to interact
    with their computer''s hardware and software.


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_23_0.png)


    Exhibit 1-1: Linux with OpenOffice Writer and Firefox open


    Linux is perhaps most notable because it is free and open source. Programmers
    have made versions of Linux for nearly every computer hardware platform in current
    use. Linux is available for:


    +   - Network servers and enterprise-class computing environments.

    - Desktop and end-user computers.

    - "Non-computer" devices, such as cell phones, automobile control systems, network
    routers, alarm system controllers, and so forth.


    Specifically, Linux Torvalds wrote the original Linux kernel. The kernel is the
    software components that provide the core set of operating system functions. These
    include features for managing system hardware and communicating between software
    and hardware.


    The Linux kernel is the base on which various versions, or distributions, are
    built. Each Linux distribution (typically abbreviated "distro") bundles a set
    of features, software components, and a design philosophy that targets a user
    or market segment. The following table lists a few of the more common distributions
    in general use of this writing.'
  merge: -1
  pgno: 23
- img_proc: true
