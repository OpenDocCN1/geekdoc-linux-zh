  md: '# KDE-specific configuration


    KDE and the bare-bones X display manager, xdm, use the same configuration files.
    The location of these files varies by distro. Check your system''s documentation
    for authoritative information on the file and its location specific to your distro.


    | Distro | kdm/xdm | File to edit |

    |---|---|--|

    | SuSE | kdm | /etc/opt/kde3/share/config/kdm/Xservers |

    | | xdm | /etc/X11/Xservers |

    | Debian | | /etc/kde3/kdm/Xservers |

    | RedHat | either | /etc/X11/XF86Config |

    | Gentoo | either | /etc/X11/XF86Config |


    For more information on configuring a multiuser environment, visit http://tldp.org/HOWTO/XFree-Local-multiuser-HOWTO/index.html.
    Section 6 of that guide covers GDM and KDM configuration specifications.


    # X server security


    X Windows is a client/server system and also a network-compatible system. Clients
    connects to server to request graphics services and can do so locally or over
    the network. In such environment, security is a concern. You don''t want to permit
    unauthorized hosts (computers) or users to access your systems.


    X Windows offers three basic categories of access control: host, cookie, and user.


    +   * Host—using the xhost command at a computer, you can create a list of authorized
    hosts that can access that system. Any user at authorized host can make such access,
    giving you relatively little control compared to other methods.

    * Cookie—similar to a browser cookie, a special file named .Xauthority is created
    in a user''s home directory. A value is stored in that file, as well as in a master
    database on the server. Because .Xauthority is in the user''s directory, it is
    available only to the user and to the programs he she runs. This feature permits
    you to limit access on a per-user basis. However, it also means that users can''t
    work from another computer, because they won''t have access to their home directory
    and .Xauthority file.

    * User—finally, through a system, such as Kerberos, you can create a mutual trust
    arrangement that manages access at the user level. With such a system, a user
    can work from any host and access the server''s X Windows system.'
  merge: -1
