  md: '# Recursive operations


    Recursion is a repetitive operation. An example of recursion is copying a directory,
    the files it contains, any subdirectories it contains, any files in subdirectories,
    any files is sub-subdirectories, and so forth. You can use recursion for various
    Linux operations, including copying and deleting.


    # Recursive copying


    By default, the cp command copies a file or single directory from a source to
    a destination. By adding the -r option, you can direct the command to copy a directory
    recursively. This means you can copy an entire directory tree from one location
    to another. In generic form, the command looks like this:


    ```

    cp -r source_dir target_dir

    ```


    # Recursive deletion


    Because there is no undo when deleting files at the command line, Linux makes
    it difficult to delete a directory that contains files or directories. The rmdir
    command fails if the directory contains files. And rm * doesn''t remove directories
    whether they contain files or not.


    You can use the rm command in recursive mode to delete the contents of a directory,
    including any subdirectories it contains. In general, delete recursively with
    this command:


    ```

    rm -r directory_or_glob

    ```


    It doesn''t matter if there is one or a thousand directories within directories,
    rm -r deletes them all. So, be careful!'
