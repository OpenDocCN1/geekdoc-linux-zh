    | 3 Enter the root password | (It should be ''pass1234.) |

    | 4 On the General tab, check **Hide visual feedback in the password entry** |
    This will turn off the display of dots as you enter your password. |

    | 5 Click the Local tab | |

    | 6 From the Theme list, choose **Selected only** | If necessary. |

    | 7 In the list of themes, click the radio button next to **Bijou** | You can''t
    simply click the thumbnail or name. |'
