  md: '# Foreground and background processes


    When you work with Linux, either at the command line or in the GUI, you work within
    the context of a shell. That shell serves as the context from which the other
    programs you run are executed. Each binary, shell function, or script you run
    in its own subshell through a process called forking.


    The following four stages describe the process of forking:


    +   A You enter a command to start a binary program, shell script, or shell function
    (built-in command). Your current shell interprets your command, and then launches
    a new subshell in which to execute that command. The parent shell enters “wait
    state” until the subshell is done. This process of starting a new subshell to
    execute the process is called forking.

    B The program executes within the subshell.

    C When the program finishes, it uses the exit function to terminate itself and
    its subshell. This returns control to the original shell.

    D When the original shell regains control, it displays the command prompt to the
    user again.


    The programs you run via this process are called foreground processes. They operate
    within a subshell but block further activity by the original shell.


    # Background processes


    Background processes are forked in a process similar to the preceding. However,
    the original shell does not have to wait for these to finish before it regains
    control and enables you to run further programs. These processes run in the background,
    while you continue to work in the foreground. To start a process in the background,
    add an ampersand (&) to the end of the command.


    You can bring a background job to the foreground with the fg command. You can
    send a foreground job to the background by stopping it (with Ctrl + Z) and then
    using the bg command. On its own, the bg command lists the background jobs and
    their job numbers. You use this job number with either the fg or bg commands to
    specify which process to bring foreground or send to background. If you omit the
    number, or without the percent sign, the shell modifies the most recent command
    you issued.


    Keep in mind that, if you close the shell from which you started a background
    process, that process will be terminated. You can use the nohup command to start
    a process that isn''t killed when you close the shell or log out. Run it in this
    way:


    ```

    nohup your_commands &

    ```


    The Bash shell provides the disown command that comes in handy if you start a
    background process without nohup but need it not to close when you log out or
    close the shell. Use it in this way:


    ```

    disown -h job_name

    ```'
  merge: -1
  pgno: 282
