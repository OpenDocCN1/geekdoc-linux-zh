  md: '# File information


    Now that you have worked with a few file types—files, directories, hard links,
    and symbolic links—it''s time to see how you can distinguish among these. In Windows,
    the file extension (filename portion after the last period in the name) determines
    the file type. A Microsoft document, for example, will be called filename.doc
    where .doc identifies the file type.


    Linux does not require extensions, though you can use them. File extensions are
    not used to determine the file type. So, if you see a file named filename.info,
    it isn''t necessarily a document created by a word processor. In Linux, you can
    use the following commands to determine file type and additional information:


    +   * ls

    * file

    * stat

    * test


    # File info with ls


    With the ls -l command, you can discover a considerable amount of information
    about the files and directories on your computer. The output includes a notation
    of the file''s type, owner, size, and last modified date. Issue the command, and
    you get output similar to the following:


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_105_0.png)


    > Exhibit 3-3: The output of the ls -l IF command'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# File and directory management


    For each file, the command describes each file in the following format:


    +   - The first character describes the file''s type: - or f for a file, d for
    a directory, p for a pipe, and l for a link.

    - The next nine characters describe the file''s permissions. Permissions are grouped
    into three categories: user, group, and other (neither the user who owns the file
    nor a group to which the file belongs, in other words, everyone else). Each category
    has three columns for read, write, and execute permissions. For example, -x means
    a category has read and execute, but not write permissions to a file.

    - The number of links, or names the file has. Typically, each file has one link
    (name), and 1 is listed in the column. Create a hard link, and both the link and
    original file show 2 as the number of links.

    - Next come the names of the owner and of the group owner of the file. The group
    name is the same as the owner''s if no group owns the file.

    - Next is the number of bytes in the file.

    - The date and time the file was last modified are listed next.

    - Finally, the file''s name is listed. With the -f and -l options, this column
    includes indicators of the file''s type (* for executable program, / for a directory)
    or of a symbolic link. If color coding is enabled, the color indicates the file
    type: black for normal files, red for compressed files, and so forth.


    The ls command supports a few other options that are useful when determining file
    types. These are explained in the following table.


    | Option | Description |

    |---|--|

    | -a | Lists all files, including hidden files and the .. entries (representing
    the current and parent directories, respectively). |

    | -l | Displays a "long listing format," meaning that extra information about
    each file displays. |

    | -i | Displays each file''s node number. |

    | -F | Displays each entry with a classifier character appended.


    # The file command


    You use the file command to determine a file''s type. It runs up to three tests
    to determine the file type. Typically, the results are either text, executable,
    or data (usually binary data). But other outputs are possible. For example, file
    outputs "empty" for an empty file.


    # The stat command


    With the stat command, you can get information about a file, including its type,
    where it''s stored, who owns it, when it was last modified, and so forth. The
    command offers many options, but for determining file types, the -c%F option is
    what you want. For example, stat -c%F myfile prints a one-line description of
    the file''s type.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# The test command


    The test command is meant for more than just testing files. You can use it to
    test whether strings are equal, whether two numbers are equal, and so forth. With
    files, you can compare file dates, determine if you''re working with a file or
    directory, and so forth.


    The command is meant to be used within a script, so its behavior at the command
    line is unusual. You enter the command and, if it works, receive no output. You
    have to execute an echo command to print the result code to the screen. For example:


    ```

    test -r myfile.txt

    echo $?

    ```


    The first line tests whether myfile.txt is readable. The second outputs the results:
    0 = true, non-zero (typically 1) = false. So with the preceding example, if myfile.txt
    were readable, the echo command would output zero.


    Most people use a shorthand notation for the test command. Instead of entering
    the command name, you can use the bracket notation. For example:


    ```

    [ -r myfile.txt ]

    echo $?

    ```


    You must include a space after the opening square bracket and before the closing
    square bracket, or you will receive an error. See the associated man page for
    a complete listing of supported options and tests.'
  merge: -1
  pgno: 107
