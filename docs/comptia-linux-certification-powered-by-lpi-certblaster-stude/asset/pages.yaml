  md: '# Changing permissions


    You can change the permissions granted to UGO entities using the chmod (change
    mode) command. The syntax for the chmod command is:


    ```

    chmod [-R] permission file_or_directory

    ```


    To make a change, you must specify the new permission(s) to alter. You can do
    so using two methods.


    # UGO syntax


    You can use UGO syntax with the chmod command. With this style, you specify one
    or more entities using the letters in the Entity column in the following table.
    You specify the operation, such as adding or removing a permission, using the
    Operators. You specify the permission to change.


    | Entity | Operator | Permission |

    | --- | --- | --- |

    | u (user) | + (add) | r (read) |

    | g (group) | - (remove) | w (write) |

    | o (owner) | = (set permissions explicitly) | x (execute) |

    | a (all) | | |


    For example, use the following command to add the write permission for your primary
    group to a file named myfile


    ```

    chmod g+w myfile

    ```


    You can assign multiple permissions in a single statement. For example, use the
    following command to add the write permission for yourself, add the read permission
    for your primary group and others, and remove the write permission for your group
    and others:


    ```

    chmod u+w,g+r-w, o=r-w myfile

    ```


    Rather than adding or subtracting from permissions, you can assign permissions
    explicitly. For example, the following command sets a file to be read only by
    others (not owner or group):


    ```

    chmod o=r myfile

    ```


    # Numeric syntax


    The other, however popular, syntax uses a numeric notation to represent the permissions
    you want to assign explicitly. This notation matches the way permissions are stored
    within the inode. With this notation, each permission is assigned a number based
    in increasing powers of 2:


    +   - read = 2² = 4

    - write = 2¹ = 2

    - execute = 2⁰ = 1'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# 4-30 CompTIA Linux+ Certification, Powered by LPI


    You add all values of the permissions to assign. For example, to assign read and
    write permissions, you would use the number 6 (4 + 2). You assign permissions
    to the users, group, and other permissions with such numbers. For example, to
    assign read/write permissions to the owner and read only to both the group and
    others, you use this command:


    ```

    chmod 644 myfile

    ```


    ![](img/b39d9dcef1d6eb273cbd81b16d07561e_151_0.png)


    Exhibit 4-9: Numeric values of the mode


    In many instances, such as public Web servers, you find that files are assigned
    the 644 permission set (user has read/write, group and other have read access),
    and directories are assigned 755 permissions (user has read/write/execute, group
    and other have read/execute access). Such permissions enable the user to create,
    edit, and delete files, to traverse directories and get directory listings. The
    group and other entities can read files, list directory contents, and traverse
    the directory tree.'
