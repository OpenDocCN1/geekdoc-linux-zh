  md: '# Checking file systems


    With older file systems, a server crash could corrupt the file system. The fsck
    (short for file system check) command was used to check and repair the file system.
    The command is still included with many distros, though updated utilities should
    probably be used.


    The e2fsspro (the ext2 file system programs) were written to support the special
    needs of checking and repairing the ext2 file system. Since that, this set of
    programs has been updated to work with the ext3 and ext4 file systems. In general,
    you should use the e2fssprogs rather than the fsck utility.


    The e2fssprogs are described in the following table.


    | Utility | Description |

    | --- | --- |

    | e2fsck | The updated equivalent to fsck. |

    | mke2fs | The tool you use to create ext2, ext3, and ext4 file systems. |

    | resize2fs | Use to expand or shrink ext2, ext3, and ext4 file systems. |

    | tune2fs | Modify file system parameters with this utility. |

    | dump2fs | Output superblock and block information for a file system. |

    | debugfs | A low-level tool for viewing and modifying the internal structures
    of a file system. |


    See the man pages of these commands for complete usage information. Use caution
    when modifying file system parameters, as you could render a disk useless or your
    system unbootable.


    # XFS file systems


    Just as Linux provides special tools for ext-based file systems, it also provides
    tools specific to XFS file systems. These are generally called the xftools. The
    following table describes them.


    | Utility | Description |

    | --- | --- |

    | xfs_check | Checks XFS file systems. |

    | xfs_repair | Checks and repairs XFS file systems. |

    | xfs_copy | Copies an XFS file system from one device to another. |

    | xfs_metadump | Copies XFS metadata to a file, which you can use for analysis
    and troubleshooting. |

    | xfs_info | Outputs information about an XFS file system. |

    | xfs_growfs | Expands the size of an XFS file system (into previously unused
    partition space or a new partition). |


    These tools are not installed by default in distros that don''t use XFS as a default
    file system type.'
  merge: -1
  pgno: 249
