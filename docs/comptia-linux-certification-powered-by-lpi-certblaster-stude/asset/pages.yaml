  md: '# Removing variables


    You can “delete” variables by using the unset command. This command removes both
    user-defined and system variables. Be careful when removing system-defined variables.
    Your system might not function properly or as expected if a variable is missing.


    To remove a variable, enter


    ```

    unset variable_name

    ```


    # Exporting variables


    Variables you create for your current shell only—they are shell, not environment
    variables. Your user-defined variables aren''t accessible to the shell in a subshell
    or a child process. You can make them accessible by exporting the variable; once
    exported, they become environment variables.


    There are two ways to use the export command, depending on whether you have already
    created the variable or not.


    ```

    export NEW_VARIABLE=value

    export EXISTING_VARIABLE

    ```


    # The PATH variable


    When you enter an executable to run a program, Linux needs to know where that
    executable file is located. Thanks to the PATH variable, you don''t need to enter
    an explicit path every time.


    Let''s say you enter ls to list the files in your current directory. Linux is
    an executable program, and its binary file is located in the /bin directory (on
    most systems). To run the program without help from the PATH variable, every time
    you want a directory listing you have to enter /bin/ls not just ls.


    The PATH variable specifies a list of directories in which Linux searches, in
    order, for the binary corresponding to the command you entered. On Debian, the
    default search path is:


    +   1 /usr/local/bin

    2 /usr/bin

    3 /bin

    4 /usr/games

    5 /usr/sbin

    6 /usr/local/sbin


    It''s important to remember that Linux searches through the paths in order. If
    there are versions of ls in both the /bin and /usr/bin directories, the version
    in /usr/bin is always executed unless you enter the explicit path to the /bin
    directory.


    # Changing the shell prompt


    The shell prompt is the text that appears on each line in the terminal window
    preceding the spot where you enter text appears. On Debian, the default prompt
    for non-root users is:


    ```

    username@hostname:current_directory$

    ```'
  merge: -1
