  md: "# Viewing variables\n\nLinux offers three commands for viewing the variables\
    \ on your system:\n\n+   - set—lists all variables, user-defined variables, and\
    \ command aliases.\n- env—lists all variables.\n\n+   - echo $variable_name—displays\
    \ the value of the specified variable; you must precede the variable with the\
    \ dollar sign.\n\nThe output produced by the set command is very lengthy and typically\
    \ overflows the terminal buffer. This means you can't Shift+Page Up to view all\
    \ of its output. You can pipe the output of the set through more or less commands.\
    \ You can use the grep command to search and display the value of one or more\
    \ variables.\n\n```\nset | more\n grep VARIABLE_NAME\n```\n\nFor example, you\
    \ could display the value of the HOSTNAME variable by entering:\n\n```\nset |\
    \ grep HOSTNAME\n```\n\n# Changing variables\n\nYou can change the value of a\
    \ built-in variable by simply assigning a value to it. For example:\n\n```\nPS1='My\
    \ Custom Prompt: '\n```\n\n**Note:** You cannot have spaces between the variable\
    \ name, the equals sign, and the value for the variable. You will get a \"command\
    \ not found\" error if you include spaces. With single or double quotes; however,\
    \ they have slightly different meanings. BASH uses your text as just that, text.\
    \ If you use double quotes and include the name of a variable, BASH uses the value\
    \ of variable as if you had entered it yourself. For example:\n\n```\nPS1='Enter\
    \ Your Command $PS1'\nPS1=\"Enter Your Command $PS1\"\n```\n\nThe first command\
    \ results in a prompt that is literally Enter Your Command. The second command\
    \ results in a prompt that is the words Enter Your Command plus whatever preceded\
    \ it.\n\n# Setting user-defined variables\n\nYou can create your own variable\
    \ by simply assigning a value to the variable's name. For example:\n\n```\nMYVAR='Linux\
    \ is cool!'\n```\n\nThen you can use the variable like this:\n\n```\necho $MYVAR\n\
    ```\n\nNotice that you must precede your variable's name with the dollar sign.\
    \ You can use this variable within shell scripts or at the command line. User-defined\
    \ variable names are typically capitalized, must not start with a number, and\
    \ may contain alphanumeric characters, the dash, and underscore."
  merge: -1
