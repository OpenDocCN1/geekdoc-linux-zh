  md: '# Default permissions


    When you create a new file or directory, your system must assign default permissions
    to it. You can control what your system applies by configuring the umask (user
    mask).


    To start, new files are assigned the 666 permission (all have read/write/permission)
    and new directories are 777 permissions (all have read/write/execute permission).
    A umask is a three-digit number, such as 022, which is subtracted from the starting
    permissions.


    For example, let''s say you create a new file, and your system''s umask is set
    to 022. Your file ends up with these permissions: user = read/write, group = read,
    other = read. If you create a new file, the permissions are: user = read/write/execute,
    group = read/execute, other = read/execute.


    | New files | New directories |

    |---|---||

    | Default permissions | 6 6 6 | 7 7 7 |

    | - umask | 0 2 2 | 0 2 2 |

    | = resulting permissions | 6 4 4 | 7 5 5 |


    Exhibit 4-10: The umask with new files and new directories


    By default, new files aren''t given the execute permission. Not all files should
    be executable. Granting such a permission by default could cause security issues.
    Therefore, you cannot create a umask that adds the execute permission. You must
    do so with the chmod command.


    You can temporarily change the umask for your system by using the umask command.
    You simply enter that command followed by the three-digit mask you want to use.
    For example:


    ```

    umask 027

    ```


    You can change the system-wide defaults by editing the /etc/profile and the /etc/login.defs
    files. You must have root access to make such changes.'
  merge: -1
