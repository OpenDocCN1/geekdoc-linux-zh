    $PWD` to print this information to your screen (or use the `pwd` command). |

    | $RANDOM | This variable doesn''t contain information. Instead, enter `echo $RANDOM`
    to print a random number between 0 and 32767 to your screen. |

    | $SHELL | Contains the full path name of the shell you''re running. Enter `echo
    $SHELL` to print this information to your screen. |


    # Shell metacharacters


    In addition to the variables listed in the preceding table, BASH assigns special
    meaning to various characters. These metacharacters enable you to group commands,
    execute multiple commands in a single statement, and use the output of one command
    as input for the next command. BASH uses the term “list” to denote the sequence
    of one or more pipelines separated by the operators shown in the following table.'
