    # KDE


    The Common Desktop Environment, KDE, has been around longer than GNOME, having
    started in 1996. At one time, licensing concerns over the Qt toolkit used within
    the KDE project led to the starting of the GNOME project. The Qt toolkit is now
    licensed under the GPL, removing those concerns.


    At this time of writing, no major Linux distributions other than Slackware use
    KDE as their default environment. That said, most distros support KDE. For example,
    you can download Kubuntu, which is the KDE version of Ubuntu (which uses GNOME).
    Or, you can install KDE apt other distros.'
