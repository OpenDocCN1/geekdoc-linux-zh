  md: '# Killing processes


    Rogue and zombie processes continue to use system resources, even though they
    are performing no useful function. sometimes processes get stuck in processing
    loops and use up system resources. In these cases, you can stop processes by killing
    them.


    To kill a process, you use the kill command, sending one of 64 different kill
    signals to the process. Each signal terminates the process in its own way. You
    can get a list of these signals by entering kill -1. A few of the more important
    signals are listed in the following table.


    | Name | Number | Description |

    | --- | --- | --- |

    | SIGHUP | 1 | The "hangup" signal stops the process and restarts it with the
    same PID. In essence, this is a restart signal. |

    | SIGINT | 2 | The "interrupt" signal stops a foreground process. This is the
    signal sent when you press the Ctrl+c key combination. |

    | SIGQUIT | 3 | The "quit" signal terminates a process and saves process information
    to a file named core (in the current directory). You can send this signal to a
    foreground application by pressing the Ctrl+\ key combination. |

    | SIGTERM | 15 | The "termination" signal is the default for the kill command.
    It is also used by processes to end other processes. |

    | SIGKILL | 9 | The "absolute kill" signal forces the kernel to stop executing
    the process. |


    In generic form, you use the following syntax to kill a process:

    `kill -signal# PID`


    Thus, you need to determine the PID of the process you want to kill. You can do
    that with the ps, ptree, or top commands. You can use grep to search. For example,
    the following displays info for a process name nautilus owned by any user.


    Let''s say the preceding command told you that the process has an ID 1234. To
    send a SIGTERM signal to that process, you enter:

    `sudo kill -15 1234`


    # pgrep and kill


    You can also use the grep command. It searches through processes displaying the
    PIDs of matching processes, essentially combining the functions of ps and grep
    into a single command. For example, let''s say you wanted to kill the nautilus
    process owned by a user name. You enter:

    `pgrep -u wilma nautilus`


    The kill command searches for and kills the process you specify by name. You can
    kill the nautilus process with this command:

    `sudo pkill -u wilma nautilus`'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# 8-12 CompTIA Linux+ Certification, Powered by LPI


    By default, pkill sends the SIGTERM signal, though you can send others. See the
    man pages for further information on pgrep and pkill.


    # Using killall


    You can stop all the processes with a given name, regardless of their user or
    terminal associations, by using the killall command. It takes the process name
    and kill signal as inputs.


    ```

    killall -signal process_name

    ```


    Let''s say you wanted to kill all instances of nautilus using the SIGQUIT signal,
    you enter:


    ```

    sudo killall -3 nautilus

    ```


    The default signal for killall is SIGTERM (15).


    # Signal trapping


    Some processes can ignore kill signals. This means you cannot kill them with those
    signals. For example, the bash process (BASH shell) cannot be killed by the SIGTERM
    signal; it traps that signal. Instead, you have to use the SIGKILL signal (9)
    with bash.


    Avoid using SIGKILL unless you have to. Processes get no opportunity to close
    files or save data when killed with this signal. They are simply shut off by the
    kernel.


    # Killing parents and children


    If you send a kill signal to a parent process, it automatically kills all its
    child processes. In fact, sometimes you will be unable to kill a child process
    without killing the parent.'
