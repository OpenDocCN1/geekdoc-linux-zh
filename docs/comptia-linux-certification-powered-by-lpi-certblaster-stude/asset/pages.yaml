    # Packages list


    Package managers maintain a list of packages that record packages already installed,
    those for which upgrades are available, and those that are available to install.
    You should update this list frequently. For example, APT maintains this list in
    the /etc/apt/sources.list.list file. Check the documentation for your package
    manager of choice to learn how to update its packages list.


    # Dependencies


    Dependencies are packages required by other packages. For example, the gpreict
    package uses a number of programming libraries, such as libgtk. If you do not
    have those dependencies installed on your computer, you can''t run gpredict.


    Dependencies come in two forms: classical and reverse. A classical dependency
    is when the package you''re about to install requires other packages, such as
    shared programming libraries, to be installed. A reverse dependency is when other
    programs rely on the package you''re installing or about to remove.


    Fortunately, package files list dependencies which modern package managers read.
    Depending on the tool you use, the necessary dependencies might be installed for
    you automatically. Others will list dependencies that you must resolve yourself.'
