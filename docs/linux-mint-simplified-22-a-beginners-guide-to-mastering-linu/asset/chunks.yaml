    running quickly on your computer. Follow these instructions to make a bootable
    USB drive, configure your system settings, and start exploring the power of Linux
    Mint''s user-friendly interface.


    Here''s a basic guide to installing Linux Mint:


    Backup your data


    Backup your current data if it is already on the system before installation since
    we will be installing Linux Mint as the only operating system, which will erase
    everything from the hard drive.


    Download Linux Mint ISO: Visit the Linux Mint website and select the Cinnamon
    Edition. The download page provides both torrent and direct download options.
    To use the direct download method, click on any available nearby mirror in the
    list.


    The Downloads page.


    [https://linuxmint.com/edition.php?id=316](https://linuxmint.com/edition.php?id=316)


    Then open any global mirror, such as the one below.


    [https://mirrors.cicku.me/linuxmint/iso/stable/22/linuxmint-22-cinnamon-64bit.iso](https://mirrors.cicku.me/linuxmint/iso/stable/22/linuxmint-22-cinnamon-64bit.iso)


    ![](image_rsrc4AY.jpg)


    Create Bootable Media: Once the ISO file has been downloaded, you must create
    a bootable USB drive or CD/DVD. To transfer the ISO file to a USB device use Rufus
    or Etcher on Windows, or the dd command on Linux.


    Write ISO to USB


    We''ll utilize the Rufus utility on the Windows workstation where we downloaded
    the ISO image. To utilize USB as installation media, we require at least 4 GB
    of USB capacity. Here are the procedures required to write a Linux Mint ISO image
    on a USB drive using Rufus:


    1.  Download Rufus: If Rufus is not already installed on your PC, you can get
    it from the Rufus.ie official website.


    2.  Insert USB Drive: Connect the USB drive to your computer.


    3.  Open Rufus: Run Rufus on your computer. It may require administrator access
    for it to function.


    ![](image_rsrc4AZ.jpg)


    4.  Select USB Drive: Choose the desired USB drive in Rufus by selecting it from
    the "Device" drop-down menu.


    5.  Select Linux Mint ISO Image: Click the "SELECT" button located next to "Boot
    selection" and proceed to the downloaded Linux Mint ISO image folder. Choose the
    ISO file.


    6.  Partition Scheme and File System: For BIOS, pick "MBR" or "GPT" for UEFI as
    the "Partition Scheme." Click "File System" and select "NTFS".


    7.  Start the Process: Click the "START" button. A warning window may appear,
    telling you that all data on the USB drive will be deleted. Click "OK" to continue.


    8.  Write in ISO Mode: Choose "Write in ISO Image mode" when prompted, then click
    "OK" to proceed.


    ![](image_rsrc4B0.jpg)


    9.  Wait for Completion: At this point, Rufus will begin writing the ISO image
    of Linux Mint to the USB drive. The duration of this operation may vary based
    on the USB drive and computer speeds.


    10.  Completion: When Rufus finishes writing the ISO image to the USB device,
    the progress bar will change to "Ready" Text. You can now close Rufus and safely
    eject the USB drive from your computer.


    ![](image_rsrc4B1.jpg)


    11.  That''s it! You successfully transferred the Linux Mint ISO image to a USB
    device with Rufus.


