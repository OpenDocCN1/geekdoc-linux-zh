- fmt: "\nOnce you've selected the option that you want, click \"Install Now.\" The\
    \ system will ask you for confirmation; select Continue.\n\n![](image_rsrc4BA.jpg)\n\
    \n### Time zone and time\nThe objective of the \"Where are you?\" screen is to\
    \ assist you choose time zone. If you are connected to the internet, it automatically\
    \ selects your location. Otherwise, you click on your current location on the\
    \ world map.\n\n### Set Up User Account\nOn the \"Who Are You\" screen, enter\
    \ your name, computer name, username, and password. It is also possible to select\
    \ for automatic login without needing to input a password every time. Press Continue.![](image_rsrc4BB.jpg)\n\
    \n### Install Linux Mint\nLinux Mint will begin installing to your system. This\
    \ process may take some time depending on your computer's speed and the size of\
    \ the disk.\n\n![](image_rsrc4BC.jpg)\n\n### Completion and Restart\nAfter the\
    \ installation is complete, you will be prompted to restart your computer. Remove\
    \ the installation media when prompted.\n\n![](image_rsrc4BD.jpg)![](image_rsrc4BE.jpg)\n\
    \n### Login and Configurations\nAfter rebooting, you'll see the Linux Mint login\
    \ screen. Enter your password and log in to your new Linux Mint installation.\n\
    \nCongratulations! You have successfully installed Linux Mint on a blank disk\
    \ and are now ready to explore and use your new operating system.\n\n# Chapter\
    \ 4: Let’s Explore the Desktop\n\nLinux Mint is a famous Linux distribution recognized\
    \ for its user-friendly interface and emphasis on offering a familiar desktop\
    \ environment for users who have switched from other operating systems such as\
    \ Windows or macOS. This is an overview of the Linux Mint desktop environment.\
    \ There are various desktop environment options available in Linux Mint, each\
    \ with a distinct appearance and feel:\n\n*   **Cinnamon**: This is Linux Mint's\
    \ flagship desktop environment. It promises to offer a contemporary, conventional\
    \ desktop experience with a taskbar, system tray, and customizable panels, similar\
    \ to that of MS Windows.\n*   **MATE**: Linux Mint also provides the MATE desktop\
    \ environment. It is an extension of the well-known GNOME 2 desktop environment,\
    \ which is straightforward and effective. MATE is appropriate for people who want\
    \ a more conventional desktop layout or on older hardware.\n*   **Xfce**: Focusing\
    \ on speed and efficiency, Xfce is a lightweight desktop environment. It works\
    \ well for people who want a more straightforward desktop experience without compromising\
    \ customization possibilities, or for PCs that are older.\n\nIn this chapter,\
    \ we will explore Linux Mint's flagship Cinnamon desktop environment. Originally\
    \ created for Linux Mint, Cinnamon is a sleek and intuitive desktop environment\
    \ that can be installed on other Linux distributions as well. It seeks to give\
    \ people switching from other operating systems like Windows or macOS a comfortable\
    \ and effective computing experience. Here is a detailed explanation of the cinnamon\
    \ components:\n\n## Cinnamon Panel\n\n![](image_rsrc4BF.jpg)\n\nUsually spanning\
    \ the bottom of the screen, the panel is the primary Cinnamon interface component.\
    \ It consists of:\n\n*   Menu\n*   Favourites\n*   Grouped windows list\n*   System\
    \ Tray\n*   Important icons\n*   Corner bar\n\n**Menu**: The Mint Menu, which\
    \ is located in the left corner of the taskbar, offers access to locations, applications,\
    \ system settings, and session options. It allows programs to be categorized and\
    \ includes a search function for convenience.\n\n**Favourites**: The Favourites\
    \ menu displays a selection of programs that you commonly use and want to access\
    \ quickly.\n\n**Grouped windows list**: This is a window list applet designed\
    \ to resemble the Windows 7 taskbar (at least partially). Some of the important\
    \ aspects include:\n\n*   **App grouping**: this groups the window of each program\
    \ into a single button\n*   **Previews**: When hovering over a button, a menu\
    \ can display previews of all windows managed by that button.\n*   **Pinning programs**:\
    \ Pin your favourite programs to workspaces.\n*   **Drag 'n' Drop**: You can reorder\
    \ your programs. Drop from the menu and panel launchers. Drag menu items from\
    \ Cinnamon's menu and panel launcher applet to this applet, and the program will\
    \ be pinned.\n*   **Context Menu**: There are multiple actions available from\
    \ the context menus of the buttons. The context menu appears when you right-click\
    \ any of the icons.\n\n**System Tray**: Displays icons for background services\
    \ and system notifications.\n\n**Important icons**: Right corner of the bar has\
    \ speaker, network, removable devices, date/calendar, battery and Bluetooth icons.\
    \ Click any of these icons to open its popup. Sound icon allows you to adjust\
    \ speaker and microphone volume. Other icons give you the option to adjust network\
    \ and Bluetooth settings.\n\n**Corner Bar**: The corner bar is used to display\
    \ the desktop, desklets, workspace selector, or window selector. Left-clicking\
    \ the mouse on the corner bar minimizes all windows and displays the desktop,\
    \ whereas right-clicking brings up the context menu. Hovering over the Corner\
    \ Bar (like in Windows) allows you to rapidly \"peek at desktop\"; you may enable\
    \ or disable this functionality in the corner bar's settings.\n\n![](image_rsrc4BG.jpg)\n\
    \n### Clock\nThe clock is located on the right side of the bar and displays the\
    \ current time by default. When you hover over it, it shows the date and day of\
    \ the week. A right-click provides you the ability to configure it.\n\n## Understanding\
    \ the Menu\n\n![](image_rsrc4BH.jpg)\n\n### All Applications\nShow all tools and\
    \ applications installed on the Linux Mint computer, arranged alphabetically.\n\
    \n### Categories\nThe menu is organized into multiple categories, such as Accessories,\
    \ Graphics, Internet, Office, Sound, and Video. Clicking on a category opens it\
    \ to display related programs and tools.\n\n### Administration and Preferences\n\
    Administration and Preferences displays the tools and applications that enable\
    \ you configure and administer Linux Mint.\n\n### Places\nThe place menu displays\
    \ shortcuts for the following:\n\n*   Home\n*   Desktop\n*   Documents\n*   Music\n\
    *   Pictures\n*   Videos\n*   Downloads\n*   Connect to server\n*   Mounted device\n\
    \nThe descriptions of each item in the place menu are:\n\n*   **Home**: The home\
    \ folder is the directory containing each user's personal files and configuration\
    \ data. Typically, it is indicated by `~/` or `/home/username`, where `username`\
    \ is the user's name. Inside your home folder (`/home/username/`), you will find\
    \ standard directories such as `Desktop`, `Documents`, `Pictures`, `Videos`, `Music`,\
    \ and `Downloads` where downloaded files are saved by default.\n*   **Connect\
    \ to server**: This dialog box contains a dropdown menu titled `Type`. This menu\
    \ allows you to select the type of server you want to connect to, including:\n\
    \    *   `SSH`\n    *   `FTP` (File Transfer Protocol)\n    *   `Windows Share`\n\
    \    *   `Custom Location`: Allows you to specify a custom URI for connecting\
    \ to other types of servers.\n*   **Mounted device**: When you connect or mount\
    \ a device, it usually displays here, and you can access and interact with these\
    \ mounted devices.\n*   **Recent files**: The Recent Files menu automatically\
    \ displays files that you have recently accessed or opened.\n\n### Search Bar\n\
    On the top menu, you will find a search bar that allows users to quickly find\
    \ and launch applications by typing keywords. It also allows you to search for\
    \ a file in the list of recently opened files.\n\nThe search bar in the Linux\
    \ Mint menu improves productivity by making it easier to find and access applications,\
    \ settings, and, in some cases, files. It's an effective tool for browsing your\
    \ system, especially as the number of installed programs and settings grows.\n\
    \nFavourite Bar\n"
  raw: 'Once you''ve selected the option that you want, click "Install Now." The system
    will ask you for confirmation; select Continue.


    ![](image_rsrc4BA.jpg)Time zone and time:   The objective of the "Where are you?"
    screen is to assist you choose time zone. If you are connected to the internet,
    it automatically selects your location. Otherwise, you click on your current location
    on the world map.


    Set Up User Account: On the "Who Are You" screen, enter your name, computer name,
    username, and password. It is also possible to select for automatic login without
    needing to input a password every time. Press Continue.![](image_rsrc4BB.jpg)


    Install Linux Mint: Linux Mint will begin installing to your system. This process
    may take some time depending on your computer''s speed and the size of the disk.


    ![](image_rsrc4BC.jpg)


    Completion and Restart: After the installation is complete, you will be prompted
    to restart your computer. Remove the installation media when prompted.


    ![](image_rsrc4BD.jpg)![](image_rsrc4BE.jpg)


    Login and Configurations: After rebooting, you''ll see the Linux Mint login screen.
    Enter your password and log in to your new Linux Mint installation.


    Congratulations! You have successfully installed Linux Mint on a blank disk and
    are now ready to explore and use your new operating system.


    Chapter 4                  


    Let’s Explore the Desktop


    Linux Mint is a famous Linux distribution recognized for its user-friendly interface
    and emphasis on offering a familiar desktop environment for users who have switched
    from other operating systems such as Windows or macOS. This is an overview of
    the Linux Mint desktop environment. There are various desktop environment options
    available in Linux Mint, each with a distinct appearance and feel:


    Cinnamon: This is Linux Mint''s flagship desktop environment. It promises to offer
    a contemporary, conventional desktop experience with a taskbar, system tray, and
    customizable panels, similar to that of MS Windows.


    MATE: Linux Mint also provides the MATE desktop environment. It is an extension
    of the well-known GNOME 2 desktop environment, which is straightforward and effective.
    MATE is appropriate for people who want a more conventional desktop layout or
    on older hardware.


    Xfce: Focusing on speed and efficiency, Xfce is a lightweight desktop environment.
    It works well for people who want a more straightforward desktop experience without
    compromising customization possibilities, or for PCs that are older.


    In this chapter, we will explore Linux Mint''s flagship Cinnamon desktop environment.
    Originally created for Linux Mint, Cinnamon is a sleek and intuitive desktop environment
    that can be installed on other Linux distributions as well. It seeks to give people
    switching from other operating systems like Windows or macOS a comfortable and
    effective computing experience. Here is a detailed explanation of the cinnamon
    components:


    Cinnamon Panel


    ![](image_rsrc4BF.jpg)


    Usually spanning the bottom of the screen, the panel is the primary Cinnamon interface
    component. It consists of:


    *   Menu


    *   Favourites


    *   Grouped windows list


    *   System Tray


    *   Important icons


    *   Corner bar


    Menu: The Mint Menu, which is located in the left corner of the taskbar, offers
    access to locations, applications, system settings, and session options. It allows
    programs to be categorized and includes a search function for convenience.


    Favourites: The Favourites menu displays a selection of programs that you commonly
    use and want to access quickly.


    Grouped windows list: This is a window list applet designed to resemble the Windows
    7 taskbar (at least partially). Some of the important aspects include:


    *   App grouping: this groups the window of each program into a single button


    *   Previews: When hovering over a button, a menu can display previews of all
    windows managed by that button.


    *   Pinning programs: Pin your favourite programs to workspaces.


    *   Drag ''n'' Drop: You can reorder your programs. Drop from the menu and panel
    launchers. Drag menu items from Cinnamon''s menu and panel launcher applet to
    this applet, and the program will be pinned.


    *   Context Menu: There are multiple actions available from the context menus
    of the buttons. The context menu appears when you right-click any of the icons.


    System Tray: Displays icons for background services and system notifications.


    Important icons: Right corner of the bar has speaker, network, removable devices,
    date/calendar, battery and Bluetooth icons. Click any of these icons to open its
    popup. Sound icon allows you to adjust speaker and microphone volume. Other icons
    give you the option to adjust network and Bluetooth settings.


    Corner Bar: The corner bar is used to display the desktop, desklets, workspace
    selector, or window selector. Left-clicking the mouse on the corner bar minimizes
    all windows and displays the desktop, whereas right-clicking brings up the context
    menu. Hovering over the Corner Bar (like in Windows) allows you to rapidly "peek
    at desktop"; you may enable or disable this functionality in the corner bar''s
    settings.


    ![](image_rsrc4BG.jpg)


    Clock


    The clock is located on the right side of the bar and displays the current time
    by default. When you hover over it, it shows the date and day of the week.  A
    right-click provides you the ability to configure it.


    Understanding the Menu


    ![](image_rsrc4BH.jpg)


    All Applications


    Show all tools and applications installed on the Linux Mint computer, arranged
    alphabetically.


    Categories


    The menu is organized into multiple categories, such as Accessories, Graphics,
    Internet, Office, Sound, and Video. Clicking on a category opens it to display
    related programs and tools.


    Administration and Preferences


    Administration and Preferences displays the tools and applications that enable
    you configure and administer Linux Mint.


    Places


    The place menu displays the shortcuts for the following things:


    *   Home


    *   Desktop


    *   Documents


    *   Music


    *   Pictures


    *   Videos


    *   Downloads


    *   Connect to server


    *   Mounted device


    The descriptions of each item in the place menu are listed below:


    Home: The home folder is the directory containing each user''s personal files
    and configuration data. Typically, it is indicated by ~/ or /home/username/, where
    "username" is the user''s name. Inside your home folder (/home/username/), you
    will find standard directories such as:


    Desktop: Typically used for storing users document files.


    Documents: Typically used for storing users document files.


    Pictures, Videos, Music: Self-explanatory directories for respective media types.


    Downloads: Where downloaded files are saved by default.


    Connect to server: This dialog box contains a dropdown menu titled Type. This
    menu allows you to select the type of server you want to connect to. Options usually
    include:


    *   SSH


    *   FTP (File Transfer Protocol)


    *   Windows Share


    *   Custom Location: Allows you to specify a custom URI for connecting to other
    types of servers.


    Mounted device: When you connect or mount a device, it usually displays here,
    and you can access and interact with these mounted devices.


    Recent files: The Recent Files menu automatically displays files that you have
    recently accessed or opened.


    Search Bar


    On the top menu, you will find a search bar that allows users to quickly find
    and launch applications by typing keywords. It also allows you to search for a
    file in the list of recently opened files.


    The search bar in the Linux Mint menu improves productivity by making it easier
    to find and access applications, settings, and, in some cases, files. It''s an
    effective tool for browsing your system, especially as the number of installed
    programs and settings grows.


    Favourite Bar'
