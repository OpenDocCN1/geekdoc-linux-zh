    Installing Packages


    To install a package, navigate to the "Not Installed Packages" category using
    the keyboard arrow keys and the Enter key.


    Highlight the selected package and press the + key. The package entry should become
    green, indicating that it has been tagged for installation. Now, hit ‘g’ to see
