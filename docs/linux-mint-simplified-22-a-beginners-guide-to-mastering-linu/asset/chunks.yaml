    # Chapter 19 Monitoring System Resources


    System monitoring is the ongoing activity of keeping an eye on and evaluating
    different parts of a computer system to make sure it is secure, performing as
    intended, and operating correctly. It entails employing hardware or software components
    used to monitor system resources to gather data on important metrics including
    CPU consumption, memory usage, disk I/O, network traffic, and system uptime, among
    others.


    There are multiple uses for system monitoring:


    ### Performance Monitoring

    Through the process of monitoring system resources, you can pinpoint apps or processes
    that are using up too much RAM, CPU, or disk I/O. This enables you to adjust your
    system or application''s performance to maximize its efficiency.


    ### Problem Solving

    Determining and fixing system problems is made easier with an understanding of
    resource utilization. For example, monitoring tools can help identify whether
    a computer’s delayed response is triggered by a high CPU load, low memory, or
    other resource limitations.


    ### Capacity Planning

    Consistent observation yields data throughout time, which is often essential for
    capacity planning. As part of a continuous capacity planning program, system capacity
    is monitored. Long-term resource monitoring is used in capacity planning to calculate
    the rates of change in system resource usage. Knowing these rates of change allows
    for more precise long-term planning with reference to the acquisition of more
    resources.


    ### Security Monitoring

    Monitoring tools can also be useful in spotting anomalous behavior, such as sudden
    increases in network traffic or strange processes that are using resources, that
    may point to a security breach. Additionally, it displays data on successful and
    unsuccessful login attempts, root login successes and failures, deleted and created
    user accounts, sudo attempts, and the total number of services.


    A variety of third-party and built-in tools are available in Linux Mint to track
    different system metrics. These tools accommodate a variety of tastes and requirements,
    from graphical programs that display data in an easy-to-understand manner to command-line
    utilities that offer comprehensive performance measurements.


    ## Check the disk usage


    When using a system, it''s essential to keep an eye on disk usage to ensure optimal
    performance and prevent running out of space. Linux offers multiple ways for you
    to check disk usage:


    One of the options is the graphical program known as Disk Usage Analyzer (Baobab).
    In order to start the "Disk Usage Analyzer":


    *   Click the Mint Menu button.

    *   To launch, select "Disk Usage Analyzer" from the Administration category.


    ![](image_rsrc4E6.jpg)


    The opening window displays summaries of all devices attached to the system.


    *   Click any device to view details for all directories.

    *   You can delve deeper into directories to discover their sizes and subdirectories.

    *   The graphical view on the right allows you to quickly identify huge files
    or folders that may be taking up a lot of space.

    *   The graphical display can be switched between ring chart and tree map chart.


    ![](image_rsrc4E7.jpg)


    *   You can also scan individual folders. Click on "Scan Folder" from the menu
    to choose the location you want to analyze.


    ![](image_rsrc4E8.jpg)


    ### Using Command Line Tools


    Linux also provides a wide range of command-line tools to monitor disk. Here are
    some of the more often used ones:


    ### Using the `df` command

    The `df` command displays information about the total and available space on a
    file system. This command retrieves the information from `/proc/mounts` or `/etc/mtab`.
    By default, `df` command shows disk space in Kilobytes (KB). You can use the options
    to display size in MBs or GBs. The most commonly used option is the `-h` option,
    which makes the output human-readable.


    Open the terminal, type:

    ```bash

    df -h

    ```


    ![](image_rsrc4E9.jpg)


    ### Using the `du` command

    The `du` (disk usage) command is a useful tool for estimating and reporting the
    disk space used by files and directories.


    Syntax: `du /path/to/directory`


    Example: Use the `-h` option to display sizes in KB, MB, or GB.

    ```bash

    du –h /media/user1/DATA/

    ```


    ### Using `lsblk` command

    The `lsblk` (list block devices) command displays a complete overview of your
    system''s block devices, including hard drives, SSDs, partitions, and USB drives.
    It''s excellent for analysing the structure of your disks, including their sizes,
    kinds, and mount points.


    Syntax: `lsblk [options] [device]`


    Example:

    ```bash

    lsblk

    ```


    ![](image_rsrc4EA.jpg)


    ## Check memory usage


    It''s critical to keep an eye on memory usage to make sure your computer has enough
    resources to run apps efficiently and prevent crashes or slowdowns.


    Linux Mint provides both graphical and command-line tools to monitor memory. The
    system monitor is a graphical application that allows you to easily monitor memory
    use and other system resources, including CPU load and disk activity, without
    the need for command-line functions.


    ### System Monitor

    To launch System monitor:


    1.  Click the Mint Menu button.

    2.  To launch, select "System Monitor" from the Administration category.


    Three tabs appear when system monitor opens: filesystems, resources, and processes.
    The description for each tab is given below:


    ### Resources Tab

    The Resources Tab displays a high-level summary of your system''s resource utilization,
    which includes CPU, memory, and disk activities. It shows real-time graphs of
    CPU load, memory consumption, and disk I/O.


    ![](image_rsrc4EB.jpg)


    ### Processes Tab

