    ## Chapter 21: Process Management


    Every task done by the Linux OS has a process associated with it. A task may consist
    of one or more processes. In the simplest terms, a process is an executed program.
    Further processes are executed in the form of threads. A thread is the basic unit
    to which the operating system allocates processor time. The idea is to achieve
    parallelism by dividing a process into multiple threads. The primary difference
    between a process and a thread is that threads within the same process run in
    a shared memory space, while processes run in separate memory spaces. Processes
    have the following properties:


    * The context switches on them determine the priority of the process.

    * Each process provides the required resources to execute the program.

    * Each process starts with a single thread known as the primary thread.

    * A process can have multiple threads.


    Here''s an overview of some essential characteristics of Linux processes:


    * Process state

    * Process identification

    * Process control

    * Process prioritization

    * Process synchronization

    * Process management

    * Process creation


    ### Process state


    The Linux process can have various states. These states define what you can do
    with that process:


    * Running & runnable: When a new process starts, it is placed in the running or
    runnable state.

    * Sleeping: Waiting for another process to complete (such as an I/O operation).

    * Stopped: Suspended or halted.

    * Zombie: intermediate state after completion of execution but still has an entry
    in the process table.


    ### Process identification


    A Process ID (`PID`) is a unique identifier assigned to each active process in
    an operating system. Each process has its own process ID (`PID`) and works in
    a separate memory space. It separates concurrent processes, making them easier
    to manage and allocate resources.


    ### Process control


    The Linux operating system has various tools for controlling foreground and background
    processes. One of the most popular tools is the shell, which provides a command-line
    interface to the operating system. The shell allows the user to initiate, terminate,
    pause, and restart front and background processes. Here''s how you can manage
    processes in both modes:


    #### Foreground Processes


    A foreground process is any command or task you run directly and wait for it to
    complete, or you can manually stop it.


    1. **Start a Foreground Process**

    To start a foreground process, you just run a command or script on the command
    line.


    Example

    ```

    cp asp.txt /home/

    ```


    2. **Pause a process**

    You can pause a running foreground process by pressing the `Ctrl + z` key on your
    keyboard. This will suspend the process and put it in the background.


    3. **Resume a paused foreground process**

    To resume suspended processes from the background, enter the `fg` command followed
    by the job number. You can get the job number with the `jobs` command.


    Syntax

    ```

    fg %[job_id]

    ```


    Example

    ```

    fg %1

    ```


    #### Background Process


    Background processes are processes that run behind the scenes. Unlike a foreground
    process, the shell does not have to wait for a background process to finish before
    it can run more processes. The maximum number of processes that can run in the
    background depends on the amount of available memory.


    1. **Start a background process**

    You can use the `&` sign after the command to send the process to background.


    Example

    ```

    ping 8.8.8.8 > /dev/null &

    ```


    2. **List background processes**

    Use the `jobs` command to list background processes.

    ```

    jobs

    ```


    3. **Bring the command to the foreground**

    To bring the background process back to the foreground, use the `fg` command.


    Syntax

    ```

    fg %[job_id]

    ```


    Example

    ```

    fg %1

    ```


    #### Terminate process


    If you are running a command in the terminal and want to stop it, use `Ctrl +
    c` on your keyboard.


    ### Using command line tools


    You can use command line or GUI tools to end a process initiated by you or another
    user, whether it''s running in the foreground or background. Here''s an overview
    of some of the most important commands for terminating processes.


    **Kill**


    The `kill` command sends signals to processes. It can be used to end processes
    graciously or forcefully.


    Syntax

    ```

    kill [options] <PID>

    ```


    Example

    ```

    kill %22

    ```


    You can specify the signal to send. If no signal is specified, `SIGTERM` (15)
    is sent by default.


    | Signal Name | Signal Number | Action |

    | :--- | :--- | :--- |

    | SIGTERM | 15 | Terminate (gracefully) |

    | SIGKILL | 9 | Terminate (forcefully) |

    | SIGINT | 2 | Interrupt |

    | SIGHUP | 1 | Hangup |

    | SIGSTOP | 19 | Stop (pause) |

    | SIGCONT | 18 | Continue (resume) |


    **Terminate a process gracefully**

    Syntax

    ```

    kill PID

    ```


    Example

    ```

    kill 44

    ```


    **Terminate a process forcefully**

    Syntax

    ```

    kill -9 PID

    ```


    Example

    ```

    sudo kill -9 44

    ```


    **Pkill command**


    To terminate a process, use the command `pkill`, followed by its name. In this
    command, you use the process name instead of the process ID.


    Syntax

    ```

    pkill command_name

    ```


    Example

    ```

    pkill -9 my_script

    ```


    **Detach processes from the terminal session.**


    Every command in Linux launches a process, which is automatically terminated when
    the user logs out or exits the terminal. You can use the `disown` and `nohup`
    commands to prevent this.


    **nohup**


    `nohup`, which stands for "no hang up," is a command that allows Linux systems
    to continue running programs after closing the shell.


    Syntax

    ```

    nohup command &

    ```


    Example

    ```

    nohup ./myscript.sh &

    ```


    **Disown command**


    The other way to continue running programs after closing the shell is to detach
    a background from your shell using the `disown` command.


    Syntax

    ```

    disown [options] [job]

    ```


    Example

    ```

    disown %1

    ```


    ### Process concepts


    The following are the concepts associated with the process that you should be
    aware of:


    **Init**


    `Init` is the first process that starts when the system boots and runs until the
    system is shut down. It automatically becomes the parent or grandparent of all
    the processes that start on your system. It also adopts adopts orphaned processes.
    The kernel starts `Init` process during booting; if the kernel is unable to do
    so, a kernel panic will happen. `PID` 1 is assigned to `Init` process.


    **Daemon process**


    A daemon is a background service process that monitors the system or provides
    functionality to other processes. The system loads several daemons to ensure proper
    system operation. For example, the `chronid` daemon is used by system to sync
    time and date. The letter `d` at the end of the process name typically identifies
    a daemon process, such as `chronid`, `dhcpd`, or `httpd`.


    **User process**


    A process executed by a Linux shell is referred to as a user process, also called
    an interactive process like `ls` command at the command line. User processes also
    include processes that you start when you are in a graphical user interface, such
    as when you launch the Firefox web browser.


    **Parent and child processes**


    Any process that initiates or spawns another process is referred to as a parent
    process. A child process is one that is started by another process. A parent process
    has complete control over all of its child processes. For example, if you start
    Firefox, you can use the `ps` command to see how many processes it has started.
    Each of these processes is known as a child process.


    **The ps command**


    The `ps` command is used to generate a list of all processes that are currently
    running on a system and display extra details about each one.


    To list all process running on the system:

    ```

    ps –ef

    ```


    Example

    ```bash

    ps -ef

    ```

