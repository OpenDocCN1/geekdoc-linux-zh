    ## rm

    对于删除文件和目录，`rm` 命令是一个非常有效的工具。它非常灵活，但在使用如 `-r` 递归删除和 `-f` 强制删除等选项时，你必须小心。


    ### 删除文件

    在 Linux 中删除（移除）一个文件或目录，请使用 `rm` 命令。


    ### 语法

    ```bash

    rm filename

    ```


    ### 示例

    ```bash

    rm biodata.txt

    ```


    ### 删除多个文件

    ### 语法

    ```bash

    rm file1 file2 ...

    ```


    ### 示例

    ```bash

    rm biodata.txt happy.txt

    ```


    ### 删除目录

    使用 `-r` 标志递归删除目录及其内容。


    ### 语法

    ```bash

    rm -r directory1 directory2

    ```


    ### 示例

    ```bash

    rm -r dir1 dir2

    ```


    ### 强制删除（忽略确认提示）

    使用 `-f` 标志覆盖任何确认提示。


    ### 语法

    ```bash

    rm -f file1 file2 ...

    ```


    ### 示例

    ```bash

    rm -f file1.txt file2.txt

    ```


    ### 递归并强制删除文件

    使用此命令时请加小心，因为它会在不会提示的情况下递归删除文件和目录。


    ### 语法

    ```bash

    rm -rf directory

    ```


    ### 示例

    ```bash

    rm -rf dir1

    ```


