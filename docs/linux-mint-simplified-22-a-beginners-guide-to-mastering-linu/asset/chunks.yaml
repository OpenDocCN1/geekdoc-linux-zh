    ![](image_rsrc4B3.jpg)


    2.  A list of Wi-Fi networks will appear. Click on the name of your Wi-Fi network.
    ![](image_rsrc4B4.jpg)


    3.  When prompted, enter the password for your Wi-Fi network and click "Connect"
