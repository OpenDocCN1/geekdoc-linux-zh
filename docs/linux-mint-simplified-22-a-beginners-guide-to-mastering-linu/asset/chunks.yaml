- fmt: '

    A remote terminal allows you to control another computer via the network or internet
    as if you were sitting directly in front of it. The most common tool for this
    is `SSH` (Secure Shell), which allows you to safely access to a remote machine
    and run commands, manage files, and perform administrative functions. `Telnet`
    is another option, although it is less secure and hence not advised for critical
    jobs. You can use these tools to traverse the file system, modify documents, and
    even transfer data between machines, all from your own location. Not only Linux
    machines, you can also use your Windows 10/11 computer to manage other systems
    remotely using `SSH` or `telnet`. `SSH` is favored for security since it encrypts
    data and protects it from prying eyes. This configuration is ideal for remotely
    managing servers, developing software, and providing technical support. ![](image_rsrc4CJ.jpg)


    You can use the `PuTTY` program on your Windows system to connect to any Linux
    machine remotely. `PuTTY` is a robust, open-source terminal emulator created by
    Simon Tatham. It supports a variety of network protocols, including `SSH` (Secure
    Shell), `Telnet`, `SCP` (Secure Copy Protocol), and raw socket connections, making
    it an important tool for system administrators, developers, and IT professionals.
    The software allows users to connect securely to remote servers, offering a command-line
    interface to execute commands, manage files, and perform system administration
    duties from a distance.


    In conclusion, learning the Linux Mint terminal is an effective method to maximize
    the capabilities of your system. The terminal offers a simple and effective way
    to manage files, execute commands, and customize your environment. In the following
    chapter, we''ll look at how to use the terminal to explore the system.


    # Chapter 10


    ## Navigating Files and Directories Using Terminal


    In this lesson, we''ll look at Linux commands for manipulating files and directories.
    Navigating and manipulating files and directories via the command line is an essential
    ability in Linux that gives users complete control over their file system. This
    guide will teach you through the important commands for reading, creating, and
    changing files and directories. Whether you''re a beginner or seeking to brush
    up on your skills, mastering these terminal commands will boost your efficiency
    and confidence in managing your Linux system. Mastering these commands, which
    range from file listing to document editing, will lay the groundwork for advanced
    tasks.


    To access files and directories with command-line tools, first open the terminal
    windows described in the last chapter and use the following commands:


    ```

    cd

    ```


    The command `cd` stands for "change directory." It is utilized to move from the
    current directory to the target directory.


    ### Syntax

    ```

    cd directory_name

    ```


    ### Example

    ```

    cd john

    ```


    ### To move one level up

    ```

    cd ..

    ```


    ### To move two levels up

    ```

    cd ../..

    ```


    ### Move to the home directory

    To navigate to a user''s home directory, use the `cd` (change directory) command.
    There are several ways to accomplish this:


    #### Using no argument with cd command

    ```bash

    cd

    ```


    #### Using `~` (tilde) symbol

    ```bash

    cd ~

    ```


    #### Using `$HOME` environment variable

    ```bash

    cd $HOME

    ```


    After running one of these commands, you''ll be in your home directory, which
    is usually `/home/username`.


    #### Navigate to a sub-directory inside your home directory

    You can use both `~` and `$HOME` to navigate within your home directory.

    ```bash

    cd ~/Downloads/

    ```

    This command will move you to the Download folder in the user''s home directory.


    #### To navigate to the same Download subdirectory using $HOME

    ```bash

    cd $HOME/Downloads/

    ```


    #### Switch to another user’s home directory.

    You can easily switch from your current working directory to another user''s home
    directory depending on your current login privileges.

    ```bash

    cd ~john

    ```


    #### Change to the root directory

    Change directly from the current working directory to the root directory.

    ```bash

    cd /

    ```


    #### Switch to the previous directory.

    ```bash

    cd -

    ```

    Assume you are in the `/etc` directory and have switched to the `/tmp` directory.
    If you type `cd -`, you will be directed back to the `/etc` directory.


    ### Changing directory with relative path

    A relative path is a way to specify the location of a file or directory relative
    to your current working directory, rather than from the root of the filesystem.


    ```bash

    $ pwd

    /home/shiv

    $ cd Documents

    $ pwd

    /home/shiv/Documents

    ```


    ### Changing directory with absolute path

    An absolute path specifies the exact position of a file or directory in the filesystem,
    beginning with the root directory.


    ```bash

    $ pwd

    /home/shiv

    $ cd /home/shiv/Documents

    $ pwd

    /home/shiv/Documents

    ```


    ## ls


    The `ls` command is used to display a folder''s contents. It will display a list
    of all the files and directories in the current or specified folder.


    ### Listing file and directory with permissions

    The `ls -l` command returns a thorough, long-format list of files and directories,
    including file permissions, ownership, size, and modification time. It is a helpful
    tool for obtaining a thorough picture of the contents and properties of files
    in a directory.


    ### Syntax

    ```

    ls -l

    ```


    ### Example

    ![](image_rsrc4CK.jpg)


    ### Listing files and directories in a human-readable format

    The `ls -lh` command displays files and directories in a comprehensive, human-readable
    format. The `-l` option provides detailed information about each file, whereas
    the `-h` format file sizes in a more understandable manner, making it easier to
    read file sizes at a glance.

    ```bash

    ls -lh

    ```


    ### Listing all files and directories, including hidden files

    The `ls -a` command displays a list of all files and folders in the current directory,
    including hidden ones. By default, `ls` displays only non-hidden files and directories;
    however, with the `-a` option, it includes those that begin with a dot `.`

    ```bash

    ls -a

    ```


    ### Recursively listing files and directories

    The `ls -R` command displays a recursive list of the current directory and all
    its subdirectories. This means that it shows files and folders not only in the
    selected directory, but also in every directory and subdirectory below it.

    ```bash

    ls -R

    ```


    ### Display ls help page

    ```bash

    ls --help

    ```


    ## pwd


    The `pwd` command is an abbreviation for "print working directory." It displays
    the user''s current directory or location. It displays the absolute path, which
    is the full path from the root.


    ### Syntax

    ```

    pwd

    ```


    ## mkdir


    You can create your own directory with the `mkdir` command.


    ### Syntax

    ```

    mkdir directory_name

    ```


    ### Example

    ```bash

    mkdir john

    ```


    ### To create multiple directories

    ### Syntax

    ```

    mkdir directory1 directory2 directory3

    ```

    ### Example

    ```bash

    mkdir dir1 dir2 dir3

    ```


    ### Add a directory and its subdirectory

    The `-p` option in the `mkdir` command stands for "parents" and allows you to
    create a directory together with any required parent directories that do not already
    exist. This is very useful when you wish to create a nested directory structure
    with a single command.


    ### Syntax

    ```

    mkdir -p directory/subdirectory

    ```

    ### Example

    ```bash

    mkdir -p development/task1

    ```


    ## rmdir


    To delete a directory from your system, use the `rmdir` command.


    ### Syntax

    ```

    rmdir directory_name

    ```


    ### Example

    ```bash

    rmdir john

    ```

    Note: The `rmdir` command will only work if the directory is empty. If the directory
    contains files or other directories, the command will fail and output an error.


    ### Delete the directory and its subdirectory

    A directory and its subdirectory will be deleted simultaneously by this command,
    but only if they are empty. This command allows for a more streamlined cleanup
    of nested empty directories.

    ```bash

    rmdir -p development/task1

    ```


    ## mv


    The `mv` command is a useful tool for managing files and directories. It enables
    you to move and rename files and directories efficiently.


    ### To move file from one directory to another location

    ### Syntax

    ```

    mv source destination

    ```

    ### Example

    ```bash

    mv file1.txt /home/shiv/

    ```


    ### Renaming files or directories

    The `mv` command is commonly used to move files, but it can also be used to rename
    folders and files.

