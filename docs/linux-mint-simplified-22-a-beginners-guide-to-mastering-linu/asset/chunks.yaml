  trans: "\n\n远程终端允许你通过网络或互联网控制另一台计算机，就像你直接坐在它面前一样。最常用的工具是 `SSH`（安全外壳），它允许你安全地访问远程机器并运行命令、管理文件以及执行管理功能。`Telnet`\
    \ 是另一个选项，尽管它的安全性较低，因此不建议用于关键任务。你可以使用这些工具遍历文件系统、修改文档，甚至在机器之间传输数据，而这一切都可以在自己的所在地完成。不仅是\
    \ Linux 机器，你也可以使用 Windows 10/11 通过 `SSH` 或 `telnet` 远程管理其他系统。`SSH` 因其安全性而青青，因为它加密数据并使其免受窥探。这种配置是远程管理服务器、软件开发和提供技术支持的理想选择\
    \ ![](img/image_rsrc4CJ.jpg)\n\n你可以在 Windows 系统上使用 `PuTTY` 程序远程连接到任何 Linux 机器。`PuTTY`\
    \ 是由 Simon Tatham 创建的一款强大的开源的终端模拟器。它支持多种网络协议，包括 `SSH`（安全外壳）、`Telnet`、`SCP`（安全复制协议）和原始套字连接，使其成为系统管理员、开发者和\
    \ IT 专业人员的重要工具。该软件允许用户安全地连接到远程服务器，提供命令行界面以从远程执行命令、管理文件并执行系统管理职责。\n\n总之，学习 Linux\
    \ Mint 终端是最大化利用系统能力的有效方法。终端提供了一种简单有效的方法来管理文件、执行命令并自定义你的环境。在接下来的章节中，我们将查看如何使用终端来探索系统。\n\
    \n# 第 10 章\n\n## 使用终端导航文件和目录\n\n在本节中，我们将查看操作文件和目录的 Linux 命令。通过命令行导航和操作文件及目录是 Linux\
    \ 中的一项基本技能，它让用户对自己的文件系统拥有完全的控制权。本指南将教你用于读取、创建和更改文件及目录的重要命令。无论你是初学者还是想要精进技能，掌握这些终端命令都将提高你管理\
    \ Linux 系统的效率和信心。掌握这些从文件列出到文档编辑的命令，将为高级任务奠定基础。\n\n要使用命令行工具访问文件和目录，首先打开上一节中描述的终端窗口并使用以下命令：\n\
    \n```\ncd\n```\n\n`cd` 命令代表“change directory”（更改目录）。它用于从当前目录移动到目标目录。\n\n### 语法\n\
    ```\ncd directory_name\n```\n\n### 示例\n```\ncd john\n```\n\n### 向上移动一级\n```\n\
    cd ..\n```\n\n### 向上移动两级\n```\ncd ../..\n```\n\n### 移动到主目录\n要导航到用户的主目录，请使用 `cd`（更改目录）命令。有几种方法可以实现这一点：\n\
    \n#### 使用无参数的 cd 命令\n```bash\ncd\n```\n\n#### 使用 `~`（波浪号）符号\n```bash\ncd ~\n```\n\
    \n#### 使用 `$HOME` 环境变量\n```bash\ncd $HOME\n```\n\n运行这些命令之一后，你将进入主目录，通常是 `/home/username`。\n\
    \n#### 导航到主目录内部的子目录\n你可以同时使用 `~` 和 `$HOME` 在你的主目录内导航。\n```bash\ncd ~/Downloads/\n\
    ```\n此命令将你带到用户主目录下的 Downloads 文件夹。\n\n#### 使用 $HOME 导航到相同的 Download 子目录\n```bash\n\
    cd $HOME/Downloads/\n```\n\n#### 切换到另一个用户的主目录。\n根据你当前的登录权限，你可以轻松地从当前工作目录切换到另一个用户的主目录。\n\
    ```bash\ncd ~john\n```\n\n#### 切换到根目录\n直接从当前工作目录更改到根目录。\n```bash\ncd /\n```\n\n\
    #### 切换到上一个目录。\n```bash\ncd -\n```\n假设你在 `/etc` 目录并切换到了 `/tmp` 目录。如果你输入 `cd -`，你将被带回\
    \ `/etc` 目录。\n\n### 使用相对路径更改目录\n相对路径是一种相对于你当前工作目录指定文件或目录位置的方法，而不是从文件系统的根。\n\n\
    ```bash\n$ pwd\n/home/shiv\n$ cd Documents\n$ pwd\n/home/shiv/Documents\n```\n\
    \n### 使用绝对路径更改目录\n绝对路径指定文件或目录在文件系统中的精确位置，从根目录开始。\n\n```bash\n$ pwd\n/home/shiv\n\
    $ cd /home/shiv/Documents\n$ pwd\n/home/shiv/Documents\n```\n\n## ls\n\n`ls` 命令用于显示文件夹的内容。它将显示当前或指定文件夹中所有文件和目录的列表。\n\
    \n 列出带权限的文件和目录\n`ls -l` 命令返回文件和目录的详细长格式列表，包括文件权限、所有者、大小和修改时间。它是获取目录内文件内容和属性详细视图的有用工具。\n\
    \n### 语法\n```\nls -l\n```\n\n### 示例\n![](img/image_rsrc4CK.jpg)\n\n### 以人类可读格式列出文件和目录\n\
    `ls -lh` 命令以全面的、人类可读的格式显示文件和目录。`-l` 选项提供了每个文件的详细信息，而 `-h` 格式以更易理解的方式格式化文件大小，使其一眼看出文件大小更加容易。\n\
    ```bash\nls -lh\n```\n\n 列出所有文件和目录，包括隐藏文件\n`ls -a` 命令显示所有文件和目录，包括隐藏文件。默认情况下，`ls`\
    \ 只显示非隐藏文件；使用 `-a` 选项包含以 `.` 开头的文件。\n```bash\nls -a\n```\n\n### 递归列出文件和目录\n`ls\
    \ -R` 命令显示当前目录及其所有子目录。这意味着它不仅显示所选目录中的文件，还会显示其下方的每一个目录。\n```bash\nls -R\n```\n\n\
    ### 显示 ls 帮助页\n```\nls --help\n```\n\n## pwd\n\n`pwd` 命令是“print working directory”（打印工作目录）的缩写。它显示用户当前的目录或位置。它显示从根目录开始的绝对路径。\n\
    \n### 语法\n```\npwd\n```\n\n## mkdir\n\n你可以使用 `mkdir` 命令创建自己的目录。\n\n### 语法\n```\n\
    mkdir directory_name\n```\n\n### 示例\n```\nmkdir john\n```\n\n### 创建多个目录\n### 语法\n\
    ```\nmkdir directory1 directory2 directory3\n```\n### 示例\n```\nmkdir dir1 dir2\
