    ## 查看和编辑文件

    在终端中查看和修改文件是 Linux 中的一项基本能力。以下是几乎在所有 Linux 发行版中用于查看和编辑文件的命令和工具的详细概述：


    ### Cat

    `cat` 命令用于查看、合并和创建文件。它的简单性使其非常适合快速读取文件内容或将多个文件合并为一个单文件。


    #### 显示文件内容。

    使用 `cat` 命令显示文件内容。


    ### 语法

    ```bash

    cat filename

    ```


    ### 示例

    ```bash

    cat example.txt

    ```


    #### 查看行号

    在输出中附加行号，这对于调试或查看大文件很有用。


    ### 语法

    ```bash

    cat -n filename

    ```


    ### 示例

    ```bash

    cat –n example.txt

    ```


    #### 合并多个文件

    ### 语法

    ```bash

    cat file1 file2

    ```


    ### 示例

    ```bash

    cat example1.txt example2.txt

    ```

    显示 `example1.txt` 的内容，随后显示 `example2.txt`。


    #### 将输出重定向到另一个文件

    ### 语法

    ```bash

    cat file1 > file2

    ```

    ### 示例

    ```bash

    cat example1.txt > newfile.txt

    ```

    此命令将 `example1.txt` 的内容复制到 `newfile.txt`，如果 `newfile.txt` 已存在，则覆盖它。


    #### 将输出追加到另一个文件

    ### 语法

    ```bash

    cat file1 >> file2

    ```

    ### 示例

    ```bash

    cat example1.txt >> newfile.txt

    ```

    此命令将 `example1.txt` 的内容追加到 `newfile.txt`。


    ### Less

    `less` 命令允许你逐页查看文件内容。


    ### 语法

    ```bash

    less filename

    ```


    ### 示例

    ```bash

    less example.txt

    ```

    以下是可以在 `less` 命令输出中一些基础导航命令：

    - **向下滚动**：使用向下方向键或 `j` 逐行向下移动。要一次向下一页，使用 `Space` 或 `F`。

    - **向上滚动**：使用向上方向键或 `k` 逐行向上移动。按 `b` 或 `Page Up` 一次向上一页。

    - **向前搜索**：按下 `/`，然后输入搜索词并按回车。使用 `n` 跳到搜索词的下一个出现处。

    - **反向搜索**：按下 `?`，输入搜索短语，然后按回车。使用 `N` 返回到搜索词的上一个出现处。


    ### Head

    `head` 命令显示文件或输入数据的开头。默认情况下，它显示前十行，但你可以更改此设置。它对于快速预览文件或数据流的开头非常有用。


    ### 语法

    ```bash

    head filename

    ```


    ### 示例

    ```bash

    head example.txt

    ```


    #### 指定行数

    ```bash

    head –n 20 example.txt

    ```

    显示前 20 行。将 `20` 替换为所需的行数。


    ### Tail

    `tail` 命令显示文件或数据流的末尾。在监控日志或大文件并需要查看最新项目时特别有用。默认情况下，`tail` 显示文件的最后 10 行，但可以进行自定义。


    ### 语法

    ```bash

    tail filename

    ```


    ### 示例

    ```bash

    tail example.txt

    ```


    #### 指定行数

    你可以使用 `-n` 选项指定要显示的行数。


    ### 语法

    ```bash

    tail –n <n> filename

    ```


    ### 示例

    ```bash

    tail –n 20 example.txt

    ```

    显示最后 20 行。


    #### 实时监控

    使用 `-f` 选项持续监控文件变化。


    ### 语法

    ```bash

    tail -f filename

    ```


    ### 示例

    ```bash

    tail -f example.txt

    ```


    除了这些命令，Linux 还有许多编辑文件的文本编辑器，最常用的是 `nano` 和 `vi`。


    ## 使用 sudo

    ### 使用 sudo 提升权限

    `sudo` (SuperUser DO) 命令允许用户以管理员权限执行命令。它通过要求输入密码来验证访问请求。`sudo` 记录所有提权命令，确保了安全性和透明度。它简化了系统管理，允许用户在不切换到
    root 账户的情况下完成操作。总的来说，`sudo` 提高了安全性和效率，是系统管理中不可或少的工具。


    以下是一些命令示例：


    #### 安装包

    ```bash

    sudo apt install

    ```


    #### 修改主机名

    ```bash

    sudo hostnamectl set-hostname host2021

    ```


    #### 以不同用户运行命令

    要以不同用户执行命令，请使用带有 `-u` 参数的 `sudo`。它允许另一个用户的权限运行命令，这对于不需要完全切换账户的任务非常有帮助。


    ### 语法

    ```bash

    sudo -u user command

    ```


    ### 示例

    ```bash

    sudo -u user hostnamectl

    ```


    #### 使用交互模式 sudo

    带有 `-i` 选项的 `sudo` 会打开一个具有 root 权限的交互式 shell。它启动一个新的 root 用户会话，允许你执行管理操作而无需在每个命令前加
    `sudo`。


    ```bash

    sudo -i

    ```


    ### 示例

    ![](img/image_rsrc4CM.jpg)


    ### 修改 sudo 配置

    sudo 的配置存储在 `/etc/sudoers`文件中。该文件是控制管理访问的有用工具。正确配置和管理它可以确保用户获得适当的权限同时维护系统安全。要更改
    sudo 配置，请使用 `visudo` 命令。


    ```bash

    sudo visudo

    ```

    它本质上是启动 `vi` 或 `nano` 编辑器并修改 `/etc/sudoers` 文件。`visudo` 命令必须由具有管理员权限的用户运行。


