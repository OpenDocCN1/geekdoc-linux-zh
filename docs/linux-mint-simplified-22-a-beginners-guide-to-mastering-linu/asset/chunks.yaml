    \ command\n\n### `pstree`\n\nThe `pstree` command, a command-line tool, displays\
    \ active processes as a tree.\n\n#### Syntax\n```\npstree -p\n```\nYou can check\
    \ the parent process with the ID of any process in this tree.\n\n#### Syntax\n\
    ```\npstree -sp pid\n```\n\n#### Example\n```\n# pstree -sp 1043\n```\n\nThe `pstree`\
    \ command can also be used with a username to display all processes that the user\
    \ has started.\n\n#### Syntax\n```\npstree username\n```\n\n#### Example\n```\n\
    # pstree shiv\n```\n\n## Process scheduling\n\nThe scheduler is part of the kernel,\
    \ which selects the process to run next. The purpose is to run the processes according\
    \ to their priorities. The `nice` and `renice` commands aid in the execution process\
    \ by changing the scheduling priorities.\n\nThe `nice` command allows you to set\
    \ the priority of a new process, whereas the `renice` command can be used to modify\
    \ the priority of an already running process.\n\nThe niceness of `-20` is the\
    \ highest priority, and the niceness of `19` is the lowest priority. A process's\
    \ priority is by default set to `0`.\n\n#### Syntax\n```\nnice -n priority\n```\n\
    \n#### Example\n```\n# nice -n 19 cp\n```\n\nDisplay nice value of processes\n\
    ```\n# ps -al\n```\n# `top`\n\nTo change the priority of running process\nUse\
    \ the `ps` command to find the process ID before using the `renice` command to\
    \ modify the priority.\n\n#### Syntax\n```\nrenice -n new_priority PID\n```\n\n\
    #### Example\n```\nsudo renice -n -5 2234\n```\nNote: To modify a process priority\
    \ to a higher one, you require administrator access.\n\nTo summarize, knowing\
    \ process management is critical for comprehending the fundamental operation of\
    \ operating systems. Computing is built around processes, which orchestrate program\
    \ execution and coordinate resources.\n\n## User Permissions and Access Control\n\
    \nLinux is a multi-user system that can be accessed by many users simultaneously.\
    \ Therefore, it becomes necessary that users do not touch other’s data. For security\
    \ of the data and system files, operating systems deploy different authorization\
    \ levels.\n\n### Ownership\nOwnership defines who can access the file or directory.\
    \ Every file is owned by a specific user (UID) and a specific group (GID).\n\n\
    #### Change ownership\nThe `chown` command can be used to change the ownership\
    \ of a file or directory.\n\n#### List the owner and group of files and directories\n\
    To view the owner and group of files and directories, use `ls -la` command.\n\
    ```\n# ls -la\n```\n\n#### Change the owner of a file\n#### Syntax\n```\nchown\
    \ username filename\n```\n#### Example\n```\n# chown user2 example.sh\n```\n\n\
    #### Change the group ownership of a file or directory\nYou can use `chown` or\
    \ `chgrp` commands to alter the group ownership of a file or directory.\n\n####\
    \ Syntax\n```\nchown :group filename\n```\n#### Example\n```\nsudo chown :data2\
    \ notes.txt\n```\n\n#### Using `chgrp`\n#### Syntax\n```\nchgrp group file/directory\n\
    ```\n#### Example\n```\nsudo chgrp data2 notes.txt\n```\n\n#### Change the Owner\
    \ and Group of a File\nYou can also change the group and owner of the file simultaneously.\n\
    \n#### Syntax\n```\nchown username:group filename\n```\n#### Example\n```\nsudo\
    \ chown shiv:data2\n```\n\n#### Recursively Change ownership\nTo recursively change\
    \ ownership of the directory and its files.\n\n#### Syntax\n```\nchown -R user:group\
    \ directory\n```\n#### Example\n```\nsudo chown -R user2 /home/timetable\n```\n\
    \n## Permissions\n\nThere is a standard set of access permissions for all files\
    \ and directories. Permission defines the action allowed on the file or directory.\
    \ These actions, also known as \"permission sets,\" read, write, and execute.\
    \ There are two ways to represent the permissions:\n\n### Symbols\nTo represent\
    \ the file permissions, following symbols are used:\n\n| Symbol | Permission |\n\
    | :--- | :--- |\n| r | Read |\n| w | Write |\n| x | Execute |\n\nExecute permission\
    \ for a directory allows the user to access its contents.\n\n### Numeric representation\
    \ of permissions\nNumeric mode refers to the use of numbers to denote Linux file\
    \ permissions. In numerical form, a three-digit value denotes specific file permissions\
    \ (for example, `774`). We refer to these as octal values. Owner permissions are\
    \ represented by the first digit, group permissions by the second, and other user\
    \ permissions by the third. Each permission has a numeric value assigned to it:\n\
    \n| Number | Permission |\n| :--- | :--- |\n| 1 | Execute |\n| 2 | Write |\n|\
    \ 4 | Read |\n\nTo represent the net permissions, we can use the sum of numerical\
    \ representations of permissions.\n\nThe chart of numeric and symbol permissions\
    \ is shown below:\n\n| Sum | Symbol | Permission |\n| :--- | :--- | :--- |\n|\
    \ 0 | - | No permission |\n| 1 | --x | Execute permission |\n| 2 | -w- | Write\
    \ permission |\n| 3 | -wx | Write and Execute permission |\n| 4 | r-- | Read permission\
    \ |\n| 5 | r-x | Read and Execute permission |\n| 6 | rw- | Read and Write permission\
    \ |\n| 7 | rwx | Read, Write and Execute permission |\n\n### Permission groups\n\
    Each file or directory has three permission groups. The scope of permissions for\
    \ each file and directory is defined by these permission groups. The table below\
    \ shows the permission groups and their scope.\n\n| Permission | Symbol | Scope\
    \ |\n| :--- | :--- | :--- |\n| Owner | u | By default user who creates the file\
    \ or directory becomes the owner of the file or directory. |\n| Group | g | Members\
    \ of the group that owns the file or directory |\n| Others | o | Grants permissions\
    \ to other users. Practically, it means everybody else. |\n\n## Permission management\
    \ command line\n\nUse the `chmod` command to manage the permissions of files and\
    \ directories.\n\n#### Add permissions\n#### Syntax\n```\nchmod +permissions filename\n\
    ```\n#### Example\n```\nchmod +x para.sh\n```\nThis command will add execute permission\
    \ to the file.\n\n#### Remove permissions\n#### Syntax\n```\nchmod -permissions\
    \ filename\n```\n#### Example\n```\n# chmod -x para.sh\n```\nYou can also add\
    \ or remove multiple permissions at the same time. Below is an example of this:\n\
    ```\n# chmod +xw para.sh\n```\n\n#### Removing permissions for group\n#### Syntax\n\
    ```\nchmod g-permission filename\n```\n#### Example\n```\n# chmod g-xw para.sh\n\
    ```\n\n#### Remove permission for others\n#### Syntax\n```\nchmod o-permission\
    \ filename\n```\n#### Example\n```\n# chmod o-xw para.sh\n```\nLike that, you\
    \ can add and remove permissions for groups and others at the same time.\n```\n\
    # chmod go-xw para.sh\n```\n\n#### Change permissions using numeric values\nThis\
    \ is the most popular way to change permissions.\n\n#### Syntax\n```\nchmod permissions\
    \ filename\n```\n#### Example\n```\n# chmod 700 hello.txt\n```\n"
