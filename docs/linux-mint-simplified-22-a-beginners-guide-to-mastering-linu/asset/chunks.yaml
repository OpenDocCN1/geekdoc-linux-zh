    #### Metadata

    * File Permissions: Indicates who has the ability to run, write, and read.

    * Ownership: Identifies the individual in possession of the file.

    * Timestamps: Indicate the creation, modification, and access dates.

    * File Type: Identifies the type of file, such as regular, directory, symbolic
    link.

    * Size: The file''s size expressed in bytes.

    * Extended Attributes: Additional metadata that can be added to a file.


    #### Directory (folders) concepts

    ##### Home folder

    In a multi-user environment, every user has his own home folder. The home folder
    holds the user’s personnel files.


    ##### Path

    The `path` is the current location of the file or directory. A path to a file
    is made up of `/` and alphanumeric characters. You can specify the path in two
    ways: relative path and absolute path.


    ###### Absolute Path-name

    An absolute path specifies the location of a file or directory relative to the
    root (`/`). To represent any directory using an absolute path, begin at the root
    directory (`/`) and work your way down. To access a file `contact.txt` in the
    Documents directory, we write `/home/shiv/Documents/contact.txt`.


    ##### path

    Relative path uses the current or parent directory as a reference and specifies
    the path relative to it. Relative paths use single or double dots. The current
    directory is represented by a `.` (single dot), while the parent directory is
    represented by `..` (two dots).


