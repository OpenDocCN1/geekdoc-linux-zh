    Overall, Linux Mint can run on practically any modern computer hardware, ranging
    from older systems with limited capabilities to high-end PCs with advanced hardware.
    Its low system requirements make it appropriate for usage on older PCs, virtual
    machines, and lightweight devices, as well as more powerful hardware that allows
    users to fully exploit its customization and versatility. The KISS (Keep It straightforward,
    Stupid) approach makes installation straightforward and transparent.


    # Chapter 3: Installation


    Linux Mint works out of the box, with full multimedia support and is extremely
    easy to use. Installing Linux Mint is a simple process that will have you up and
    running quickly on your computer. Follow these instructions to make a bootable
    USB drive, configure your system settings, and start exploring the power of Linux
    Mint''s user-friendly interface.


    Here''s a basic guide to installing Linux Mint:


    ### Backup your data

    Backup your current data if it is already on the system before installation since
    we will be installing Linux Mint as the only operating system, which will erase
    everything from the hard drive.


    ### Download Linux Mint ISO:

    Visit the Linux Mint website and select the Cinnamon Edition. The download page
    provides both torrent and direct download options. To use the direct download
    method, click on any available nearby mirror in the list.


    The Downloads page.

    [https://linuxmint.com/edition.php?id=316]


    Then open any global mirror, such as the one below.

    [https://mirrors.cicku.me/linuxmint/iso/stable/22/linuxmint-22-cinnamon-64bit.iso]


    ![](image_rsrc4AY.jpg)


    ### Create Bootable Media:

    Once the ISO file has been downloaded, you must create a bootable USB drive or
    CD/DVD. To transfer the ISO file to a USB device use `Rufus` or `Etcher` on Windows,
    or the `dd` command on Linux.


    ## Write ISO to USB

    We''ll utilize the `Rufus` utility on the Windows workstation where we downloaded
    the ISO image. To utilize USB as installation media, we require at least 4 GB
    of USB capacity. Here are the procedures required to write a Linux Mint ISO image
    on a USB drive using `Rufus`:


    1. **Download Rufus**: If `Rufus` is not already installed on your PC, you can
    get it from the `Rufus.ie` official website.

    2. **Insert USB Drive**: Connect the USB drive to your computer.

    3. **Open Rufus**: Run `Rufus` on your computer. It may require administrator
    access for it to function.


    ![](image_rsrc4AZ.jpg)

    4. **Select USB Drive**: Choose the desired USB drive in `Rufus` by selecting
    it from the "Device" drop-down menu.

    5. **Select Linux Mint ISO Image**: Click the "SELECT" button located next to
    "Boot selection" and proceed to the downloaded Linux Mint ISO image folder. Choose
    the ISO file.

    6. **Partition Scheme and File System**: For BIOS, pick "MBR" or "GPT" for UEFI
    as the "Partition Scheme." Click "File System" and select "NTFS".

    7. **Start the Process**: Click the "START" button. A warning window may appear,
    telling you that all data on the USB drive will be deleted. Click "OK" to continue.

    8. **Write in ISO Mode**: Choose "Write in ISO Image mode" when prompted, then
    click "OK" to proceed.


    ![](image_rsrc4B0.jpg)

    9. **Wait for Completion**: At this point, `Rufus` will begin writing the ISO
    image of Linux Mint to the USB drive. The duration of this operation may vary
    based on the USB drive and computer speeds.

    10. **Completion**: When `Rufus` finishes writing the ISO image to the USB device,
    the progress bar will change to "Ready" Text. You can now close `Rufus` and safely
    eject the USB drive from your computer.


    ![](image_rsrc4B1.jpg)

    11. **That''s it!** You successfully transferred the Linux Mint ISO image to a
    USB device with `Rufus`.


    ## Start Installation


    ### Disable the secure boot option

    (This is an optional step and may not be necessary in most cases.)

    Disabling Secure Boot mode is not required for Linux Mint installation. However,
    because of the possibility for problems or incompatibility with unsigned bootloaders
    or kernels, it is suggested that Secure Boot be disabled during installation.


    To disable Secure Boot mode during installation, you must open your computer''s
    BIOS/UEFI settings. The BIOS/UEFI settings vary depending on the manufacturer
    of your computer; see the hardware manual to access the BOIS/UEFI.


    ![](image_rsrc4B2.jpg)


    ### Boot from Installation Media:

    To boot from the bootable USB device or CD/DVD, insert it into your computer.
    In order to prioritize the USB drive or CD/DVD, you might need to adjust the boot
    order in your BIOS or UEFI settings. To find out how to obtain the boot menu,
    refer to your computer''s manual.


    ### Start Linux Mint Live Session:

    When you boot from the installation media, a menu will appear. Select "Start Linux
    Mint." It will launch the Linux Mint live session.


    In Linux, a live session is defined as executing the operating system directly
    from bootable installation media (such as a USB flash drive or DVD) rather than
    installing it on your computer''s hard drive. This allows you to use a variety
    of tools for troubleshooting and manipulating your computer''s drives, data, and
    hardware without having to worry about anything running on it. It also ensures
    that your system.


    ### Connect to Network

    Although an internet connection is not required for Linux Mint installations,
    it is recommended that you have one to get NTP information, updates, hardware
    drivers, and other software packages during the installation. In Linux Mint, you
    can connect via Ethernet (wired) or Wi-Fi (wireless), depending on your network
    configuration.


    ### Connect Wi-Fi:

    To connect to a Wi-Fi network, follow the steps below:

    1. Click on the network icon in the system tray.

    ![](image_rsrc4B3.jpg)

    2. A list of Wi-Fi networks will appear. Click on the name of Wi-Fi network.![](image_rsrc4B4.jpg)

    3. When prompted, enter the password for your Wi-Fi network and click "Connect"
    to establish the connection.![](image_rsrc4B5.jpg)


    ### Install Linux Mint:

    Double-click on "Install Linux Mint" icon.

    ![](image_rsrc4B6.jpg)


    ### Select Language and Keyboard Layout:

    Select your desired language and keyboard layout on the following screens.

    ![](image_rsrc4B7.jpg)


    ### Multimedia Codecs

    Check the box for multimedia codec. It''s beneficial to enable multimedia codecs
    while installing Linux Mint since it lets you play back common multimedia formats
    right away, like MP3 audio and H.264 video files, without requiring you to manually
    install any software or codecs after the installation.


    ### Install Type:

    The screen options differ depending on the system on which you are installing
    linux. The first scenario involves installing only one operating system on the
    computer, which normally takes up the entire disk. Another alternative is to install
    on a system that already has another operating system, such as Microsoft Windows,
    and you wish to install Linux Mint alongside it to dual boot the system.


    **Only OS (Single Boot)**: Please take a data backup before starting, as this
    will destroy any data on the drive.


    **Erase the disk**: This option automatically partitions the drive. This option
    includes the "Advanced features" button, which allows you to choose between LVM
    and ZFS file system type for the disk partition.

    ![](image_rsrc4B8.jpg)


    **Something else**: This option allows you to do manual disk partitioning. If
    you select this option, you need to create partitions for the root filesystem
    `/`, swap space, and any additional partitions you may require, such as `/home`.


    ### Dual boot:

    You have three options: you can choose to install Linux Mint alongside an existing
    operating system (dual-boot), replace the existing operating system, or manually
    partition the disk. If you''re unsure, the option to install alongside an existing
    OS is usually safe.


    ![](image_rsrc4B9.jpg)

