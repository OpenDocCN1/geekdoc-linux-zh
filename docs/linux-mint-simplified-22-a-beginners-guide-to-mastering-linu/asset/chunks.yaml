    `Mintupdate`，通常被称为更新管理器（Update Manager），是一个用于处理系统更新的 GUI 工具。更新管理器具有用户友好的界面。它根据更新类型（如内核、软件和安全更新）对更新进行分类。用户只需点击即可启动更新，工具还会显示通知和已安装更新的历史。自定义选项允许用户根据特定需求定制更新偏好。更新管理器以图标形式出现在面板的系统托盘（`systray`）中，提供了监控和处理更新的方便方式。如果有可用更新，图标将变为红色指示。当你将鼠标悬停在上面时，它会显示可用更新的数量。总的来说，`mintupdate`
    帮助你保持系统安全并处于最新状态。


    ![](img/image_rsrc4DF.jpg)


    当你点击此图标时，将启动更新管理 GUI 窗口。你也可以从 Mint 菜单的“管理”（Administration）类别打开更新管理器。更新管理器在启动时会自动检查更新。如果没有自动检查，你可以点击
    `Refresh`（刷新）按钮开始检查。


    ![](img/image_rsrc4DG.jpg)


    主窗口将显示可用的更新。更新通常分为安全更新、软件更新、安全更新和桌面组件（desklet）更新等类别。


    点击 `Install Updates`（安装更新）按钮开始安装过程。可能会提示你输入密码。这是授权更新程序的必要。


    安装更新后，可以通过选择菜单上的查看选项并选择 `History of Updates`（更新历史）来查看更新历史。


    ## 安装最新或其他版本的内核


    内核是操作系统的核心组件，管理硬件资源并促进硬件与软件之间的通信。它处理内存管理、进程调度和设备控制，作为应用程序与硬件之间的桥。


    内核更新对于支持新硬件至关重要，因为它们提供了修复兼容性问题的驱动和修复。对新硬件的支持可能需要更新内核，因为新的组件或设备可能在旧内核中无法被识别或正常工作。更新管理器等工具简化了应用这些更新的过程，确保你的系统与最新的硬件特性保持兼容。


    尽管升级到最新内核可以提供新功能和更好的硬件支持，但谨慎使用至关重要。在更新之前，最好查看发布说明和用户评论，因为新内核可能会带来不可预的问题或不稳定性。为了防止任何数据丢失，请确保已备份关键数据。此外，保留已安装的早期内核作为备份，以防新内核出现问题。


    要安装备用内核，请执行以下操作：


    1.  在更新管理器框中，从菜单中选择 `View`（查看）。

    2.  选择 `Linux Kernel` 选项查看可用内核版本。你将看到已安装和可访问内核的列表。较新的内核也出现在此列表中![](img/image_rsrc4DH.jpg)

    3.  从列表中选择最新或所需的内核版本。通常会有安装或升级的选项。点击 `Install`（安装）按钮开始安装程序。

    4.  可能会提示你输入密码。

    5.  安装后，重启系统以使用更新后的内核。你可以通过选择菜单中的 `Reboot`（重启）来实现。


    ## 更改偏好


    在更新管理器中，你可以根据特定需求自定义更新选项。点击更新管理器框中的 `Edit`（编辑）菜单项。从下拉菜单中选择 `Preferences`（偏好）。偏好通过标签页窗口界面处理。标签包括
    `Options`（选项）、`Packages`（包）和 `Automation`（自动化）。


    ## 使用命令行工具更新


    你可以使用终端命令进行系统更新、升级包和管理内核。以下是操作方法：


    你应该采取的第一步是更新软件包数据库。这是在执行系统升级或安装新包之前的关键步骤，因为更新软件包数据库会将此信息与 Linux Mint 存储库同步，确保你的系统拥有有关可用包及其版本的最新信息。


    使用 `apt` 命令将软件包数据库与 Linux Mint 存储库同步。


    ```bash

    sudo apt update

    ```


    ### 更新已安装的包


    若要在 Linux Mint 中将已安装的包更新到最新版本，你可以使用 `apt` 命令行工具。以下是更新所有安装包的命令。第一个命令更新包缓存，下一个命令执行系统更新。


    ```bash

    sudo apt upgrade

    ```


    如果有任何内核更新，请重启机器以应用它们。


    ## 第 17 章：备份你的系统


    ### 备份


    备份是系统管理不可或缺的组件，有助于保护数据、从灾难中恢复、减轻风险、确保合规、安全系统升级、提供用户支持并保留机构知识。备份是防止数据丢失的保险单，能为利益相关者提供安心感并保护组织的资产。


    系统管理员负责实施和管理备份方法，以确保组织数据和系统的完整性和可用性。以下是执行备份的方法：


    #### 手动备份


    使用 `cp` 或 `rsync` 等命令将关键文件和目录手动拷贝到外部设备或云存储。执行手动备份涉及以下步骤：


    1.  **什么**：首先，确定哪些文件和目录包含你想备份的关键数据、配置文件或用户设置。

    2.  **哪里**：选择一个外部存储设备，如 USB 驱动器、硬盘、网络存储或云存储服务来保存备份。

    3.  **如何做**：使用 `cp` 或 `rsync` 等命令行程序将所选的文件和目录拷贝到备份目标地。


    #### 全系统备份


    使用 `clonezilla` 或 `dd` 等软件定期创建全系统备份，以便在发生灾难性故障时恢复整个系统。


    #### 自动备份


    使用 `cron` 任务或 `systemd` 定器设置自动备份程序，以执行无需人工干预的定期备份。


    #### 测试备份


    定期测试你的备份，以确保它们有效且可以恢复。评估文件恢复、系统恢复和数据完整性。


    #### 磁盘清理


    定期删除无用文件、临时文件和缓存数据以释放磁盘空间。`du`、`df` 和 `ncdu` 是分析磁盘占用和识别大文件的有用程序。


    #### GUI 备份工具


    `MintBackup` 和 `Timeshift` 是 Linux Mint 自带的两个基本备份工具。它们是 Linux Mint 中不同的程序，功能独立。


    ### MintBackup


    `MintBackup` 是 Linux Mint 中用于保护关键文件和设置的程序。它允许备份单个文件夹和文件，确保你的图像、文档和敏感信息安全。你可以将这些备份放在外部磁盘或云存储，以便计算机故障时进行恢复。`MintBackup`
    直观的界面使其于使用，无需技术知识。


    要使用 Linux Mint 中的 MintBackup 备份数据和配置，请按照以下步骤操作：


    1.  从 Linux Mint 的应用程序菜单启动 `MintBackup`。寻找“Backup Tool”或直接输入“MintBackup”。![](img/image_rsrc4DJ.jpg)

    2.  打开 `MintBackup` 时，显示两个部分：个人数据和软件选择。


    #### 备份个人数据


    1.  点击 `Back up now`（立即备份）按钮。

    2.  选择保存备份的位置。默认备份位置是一个文件夹，但也可以是外部设备，如 USB 闪盘![](img/image_rsrc4DK.jpg)

    3.  它将提示你指定要排除的文件和目录![](img/image_rsrc4DM.jpg)


