    ![](img/image_rsrc4C4.jpg)


    ### 安装小组件

    若要安装额外的小组件，请点击 `Download`（下载）选项卡，这将显示可供下载的小组件列表。您也可以搜索您想要下载和安装的小组件。要下载并安装小组件，请选择该组件，然后点击其旁边的下载图标。


    ![](img/image_rsrc4C5.jpg)


    一旦安装完成，它将显示在 `Manage`（管理）选项卡下。


    总而言之，在 Linux Mint 中更改桌面环境为改进工作区的美观和功能提供了许多选择。通过尝试不同的主题、图标和字体，您可以设计出一个既反映自己个人风格又能提高效率的配置。


    # 第 6 章：文件系统层次结构


    ## 什么是文件系统？

    文件系统是操作系统在存储设备（包括硬盘、固态硬盘 `SSDs`、USB 驱动器和光盘）上组织和存储数据的方式。它提供了一种组织的方法来管理文件、文件夹以及与之相关的元数据。以下与文件系统相关的一些组件和概念：


    1. 文件

    2. 目录（文件夹）

    3. 元数据

    4. 文件系统类型

    5. 分区

    6. 格式化

    7. 挂载与卸载

    8. 访问控制


    ### 文件系统与 FHS

    FHS 是一组用于 Unix 类操作系统中文件和目录结构及组织标准的标准。它规范了文件系统的层次结构布局，确保了 Unix 和类 Unix 系统之间的一致性。FHS
    提供了常用的根目录，包括 `/bin`、`/boot`、`/etc`、`/home`、`/usr`、`/var` 等。


    FHS 目录结构从 `/`（根目录）开始。即使文件和目录存储在不同的物理或虚拟设备上，它们也都出现在根目录下。


    FHS 定义了大多数 Linux 发行版使用的目录结构。根据 FHS，为一个 Linux 发行版编写的程序可以轻松迁移到另一个发行版。这确保了只需要微小的更改或无需任何更改。假设您有一个程序在
    `/opt` 目录中存储二进制文件。如果没有标准，那么在迁移到另一个 Linux 发行版时，您必须创建该目录或更改该程序。FHS 对于系统管理也有用，因为如果您在数据中心有多个
    Linux 发行版，它消除了需要记住配置和日志文件位置。


    ## 文件系统概念


    #### 文件

    * 文件系统内数据存储的基本单元是文件。

    * 文件可以包含各种数据类型，包括文本、照片、应用程序和文档。

    * 在每个目录中，每个文件都通过一个唯一的名称来标识。


    #### 目录（文件夹）

    目录（有时被称为文件夹）是计算机文件系统用于组织和存储其他文件的一种文件。


    目录（有时被称为文件夹）是计算机文件系统用于组织和存储其他文件的一种文件。在每个目录中，每个文件都通过唯一名称来标识。


