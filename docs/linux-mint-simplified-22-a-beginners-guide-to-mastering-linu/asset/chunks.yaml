    ## Timeshift


    `Timeshift` is another tool included in Linux Mint that focuses on backing up
    your entire system. It periodically takes snapshots of your filesystem so that,
    in the event that something goes wrong, you can return your system to a previous
    state. `Timeshift` is very beneficial for maintaining system stability and recovering
    from software issues or updates that cause problems on your Linux Mint system.
    It provides functionality similar to the System Restore feature in Windows and
    the Time Machine tool in Mac OS. It works in `BTRFS` and `RSYNC` modes.


    ### RSYNC

    Snapshots in `RSYNC` mode are made with hard links and `rsync`. Disk space is
    saved between snapshots because common files are shared. With the use of a file
    manager, each snapshot represents a complete system backup.


    ### BTRFS

    Snapshots are taken in `BTRFS` mode by utilizing the built-in capabilities of
    the `BTRFS` filesystem. `BTRFS` snapshots are only supported on systems that use
    the `BTRFS` filesystem and have a subvolume layout similar to `@` and `@home`.


    ## Setting up Timeshift


    When you first launch `Timeshift`, an authentication prompt will appear, followed
    by an application setup prompt.


    `Timeshift` will prompt you to select the sort of snapshot you want to take. You
    can choose between `Rsync` and `Btrfs`.


    If your file system supports `Btrfs`, it is widely recommended due to its efficiency
    in managing snapshots. ![](image_rsrc4DS.jpg)


    Next, you''ll need to decide where to save the images. This might be a different
    partition, an external disk, or any other appropriate location with adequate space
    to store the snapshots. For best results the snapshots should be saved to an external
    device. Connect the external device before launching `Timeshift` if you wish to
    take a backup there.![](image_rsrc4DT.jpg)


    ![](image_rsrc4DU.jpg) Next, it will ask for a backup schedule. `Timeshift` supports
    multiple levels of snapshots. Snapshot levels refer to various strategies or procedures
    for creating and managing your system''s snapshots. These levels enable you to
    control how and when sanpshots are taken, based on your specific requirements
    and preferences. It allows hourly, daily, weekly, monthly, and boot snapshots.
    You can also specify the number of snapshots to be retained for each level. Boot
    snapshots are made every time the system boots up, providing an extra degree of
    backup. Boot snapshots are created with a 10-minute delay to ensure that system
    initialization is unaffected.


    ### Manual Snapshot


    To create a manual snapshot, select the `Create` button.


    `Timeshift` will then generate a snapshot of your system. This process could take
    some time, depending on the size of your system and the speed of your storage.


    ![](image_rsrc4DV.jpg)


    ### User Data


    `Timeshift` is intended to protect system files and settings. It is a backup application
    that is not intended to protect user data.


    The whole contents of users'' home folders are excluded by default. This offers
    two advantages:


    - You don''t have to be worried about your documents being overwritten when you
    restore an earlier snapshot to recover the system.

    - Your music and movie collection in your home directory will not take up space
    on the backup device.


    ## System Restore


    If you have a problem with your system, you can use `Timeshift` to restore it
    to its former stable state.


    Open `Timeshift`, select a snapshot from the list of available snapshots, and
    then click "Restore".


    - Snapshots can be restored from either the current system (online restore) or
    another system with `Timeshift` installed (offline restore).

    - If the main system is not bootable, you can boot from installation media on
    USB or DVD as a live session, start `Timeshift` on the live system, and restore
    a snapshot on the main system.

    - Restoring backups from the running system requires a reboot to complete the
    restore process.


    ## Command line tools to backup


    You can manually back up your files using command line tools.


    Backing up with command-line tools in Linux allows you greater freedom and customization.
    Here''s a simple instruction for performing backups using common command-line
    tools.


    ### Tar


    `tar` is a simple and versatile utility for backup and restore.


    The Linux command `tar` stands for tape archive and is used to create and extract
    archive files. The `tar` program in Linux is a useful tool for archiving files
    and directories. The Linux `tar` tool allows us to create compressed or uncompressed
    Archive files, as well as manage and alter them.


    #### Syntax


    ```

    tar [options] [archive-file] [file or directory to be archived]

    ```


    Where options are:


    | Option | Description |

    | :--- | :--- |

    | `-c | Create a new archive. |

    | -x | Extract files from an archive |

    | -v | Verbose mode (shows files being archived). |

    | -f | filename of the archive. |


    You can also use compression software like `gzip`, `bzip2`, and `xz` to compress
    tar files. Use these options while creating tar files:


    | -z | Use `gzip`. |

    | -j | Use `bzip2`. |

    | -J | Use `xz`. |


    ### Backing Up


    Open the terminal and execute the `tar` command. If you wish to take backups on
    the external media, it should be linked first. To build a backup archive, use
    the `tar` command with the `-c` option.


    ```

    tar -cvf backup1.tar file1.txt file2.txt

    ```


    To create an archive of directories:


    ```

    tar -cvf backup1.tar Documents/

    ```


    To create an archive in compressed format:


    ```

    tar -cvzf backup1.tar.gz Documents/

    ```


    ### Restoring


    To restore (extract) a tar archive, use the `-x` option with the `tar` command.


    Example:


    ```

    tar -xvf backup1.tar

    ```


    To extract an archive in compressed format:


    ```

    tar -xvzf backup1.tar.gz

    ```


    ### Appending Files


    `tar` may be used to append files to an existing archive, allowing you to add
    new files without having to recreate the entire archive using `-r` option. Here''s
    how you can accomplish it:


    ```

    tar -rvf backup1.tar newfile.txt

    ```

