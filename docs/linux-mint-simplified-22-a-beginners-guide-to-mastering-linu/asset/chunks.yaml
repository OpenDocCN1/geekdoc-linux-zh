    Aptitude 是 `APT`（高级软件包工具）的一个基于文本和命令行的界面，主要用于基于 Debian 的 Linux 发行版（如 Linux Mint）的软件包管理。与
    `apt` 相比，它提供了更具交互性和用户友好的 UI。如果你在不带任何命令行参数的情况下启动 `Aptitude`，将获得一个菜单驱动的界面。Aptitude
    最适合在非图形化终端环境中使用。在终端提示符处输入以下命令将为普通用户启动 Aptitude 的菜单驱动界面。


    ```bash

    sudo aptitude

    ```


    ![](img/image_rsrc4CU.jpg)运行 `aptitude` 时，会出现两个窗格，顶部和底部。顶部窗格包含已安装软件包、未安装软件包、虚拟软件包等类别。与软件包相关的特定信息将显示在底部窗格中。Aptitude
    的用户界面非常直观，使得处理软件包变得非常简单。


    在执行 `aptitude` 后，使用以下按键进行操作：


    * `?` 帮助

    * 使用 `Ctrl-T` 或 `F10` 调出菜单。

    * 使用 `上、下、左、右` 键进行导航。

    * 使用 `Enter` 键选择或打开/关闭单个层级。

    * 用于递归打开和关闭层级的括号是 `[` 和 `]`。

    * 安装、更新或卸载软件包，按 `+` 或 `-` 键。

    * 预览或确认操作，按 `g` 键。

    * 退出，按 `q` 键，这也会关闭当前活动窗口。

    * 向或向后搜索，使用正斜杠和反斜杠（`/` 和 `\`）。


    ## 安装软件包


    要安装软件包，请使用键盘方向键和 `Enter` 键导航到“未安装软件包”类别。


    高亮选中软件包并按 `+` 键。软件包条目应变为绿色，表示已标记为待安装。现在，按 `g` 查看软件包操作的摘要。再次按 `g` 安装软件包。完成后，按 `Enter`
    返回菜单。


    ## 移除软件包


    在“已安装软件包”类别中找到软件包，然后使用方向键和 `ENTER` 键高亮它以进行移除。当软件包被高亮时，按 `-` 键将其标记为移除。要移除该软件包，按两次
    `g`。完成后，按 `ENTER`。要返回主菜单，按 `q`。


    ## 更新软件包索引


    要更新软件包索引，按 `U` 键。


    ## 升级软件包


    要升级软件包，首先更新软件包索引，然后按 `U` 键将所有软件包标记为已更新。现在，按两次 `g` 下载并升级软件包。完成后，按 `ENTER`。按 `q`
    返回主菜单。


    ## Dpkg


    `dpkg` 是一个低级软件包管理程序，允许你直接安装、卸载和管理 Debian 软件包，提供对软件包文件详尽的控制。虽然 `apt` 和 `apt-get`
    等高级程序被广泛使用，但 `dpkg` 提供了更精确的控制。然而，`dpkg` 不会自动解析或管理软件包之间的依赖关系；用户必须手动确保所有所需的依赖项得到解决。通常，`dpkg`
    用于安装存储计算机中的 `.deb` 文件。例如，如果你手动下载了软件包，将使用 `dpkg` 进行安装。而 `apt` 是一个用于从在线存储库管理软件的工具。它通过自动处理依赖关系简化了安装、更新和删除软件的过程。以下是
    `dpkg` 命令摘要。


    ### 安装软件包


    要安装已在当前目录下下载的 Debian (`.deb`) 软件包，请使用以下命令。


    #### 语法

    ```bash

    sudo dpkg -i <package.deb>

    ```


    #### 示例

    ```bash

    sudo dpkg -i foo.deb

    ```

    这将安装 `.deb` 软件包。如果存在未满足的依赖关系，你可能需要手动解决它们。


    ### 列出已知软件包


    `-l` 选项显示系统上安装的所有软件包的列表。这对于查看当前的软件包清单和版本非常有用。


    ```bash

    dpkg -l

    ```


    ### 移除软件包


    在保留配置文件的情况下移除已安装的软件。如果你想为日后的使用保存设置，则此命令非常重要。


    #### 语法

    ```bash

    dpkg -r <package>

    ```


    #### 示例

    ```bash

    sudo dpkg -r foo

    ```


    ### 清除软件包 (Purge)


    完全移除软件及其配置文件。如果你想从系统中完全删除该软件包，请使用 purge 选项。


    #### 语法

    ```bash

    sudo dpkg -P <package>

    ```


    #### 示例

    ```bash

    sudo dpkg -P foo

    ```


    ### 检查软件包是否安装


    要检查软件包是否已安装，使用 `-s` 标记：


    #### 语法

    ```bash

    dpkg -s <package>

    ```


    #### 示例

    ```bash

    dpkg -s foo

    ```


    ### 显示软件包信息


    显示关于已安装软件包的详细信息，例如版本、状态和描述。此命令也对于检查软件包是否已安装很有用。


    #### 语法

    ```bash

    dpkg -I <package.deb>

    ```


    #### 示例

    ```bash

    dpkg -I foo*

    ```


    ## 总结


    这些只是用于管理软件包、存储库和故障排除的众多命令和选项中的某几个。软件包管理工具在 Linux Mint 中至关重要，因为它们确保了程序的平畅安装、更新和安全性。学习软件包管理工具可以确保高效的管理。


    # 第 13 章 配置存储库


    ## 存储库 (Repository)


    存储库，简称为 "repo"，是存储和处理数据的区域。在软件包管理的上下文中，存储库通常定义为存储软件包、源代码和相关元数据的地方。


    在 Linux Mint 中，可以通过以下图形界面管理存储库：


    点击菜单按钮，选择“管理”，然后点击“软件源”进入。这将启动软件源应用程序。


    ![](img/image_rsrc4CU.jpg)


    身份验证：当提示时，提供你的管理员密码进行验证。


    软件源窗口分为两个窗格。左窗格包含列表，每个项目对应存储库管理的一个组件。右侧显示每个项目的描述和设置。左侧列表中每个项目的描述如下：


    * **官方存储库 (Official Repositories)**：此选项包含由 Linux Mint 维护的稳定更新存储库。

    * **PPA**：PPA（个人包存档）是 Launchpad 上的存储库，开发者可以直接向用户分发软件。用户可以像安装普通软件包一样安装它们，并会自动接收更新。

    * **附加存储库**：通过选择“添加”或“删除”按钮，可以在此处添加或删除第三方存储库。

    * **密钥 (Authentication Keys)**：管理密钥涉及添加、删除和验证密钥。密钥验证软件包的完整性和来源，以防止篡改并确保软件来自合法来源。

    * **维护 (Maintenance)**：在这里，你可以配置自动更新存储库缓存和删除未使用软件包的设置。


    ### 添加存储库


    要添加新存储库，转到左侧的“附加存储库”部分，然后点击右侧面板上的“添加”按钮。在文本框中输入存储库 URL 并点击确定按钮。


    ![](img/image_rsrc4CV.jpg)


    ![](img/image_rsrc4CW.jpg)


    ### 移除存储库


    从附加存储库列表中选择一个存储库并点击“移除”按钮。在确认弹出窗口中点击“是”。


    ### 应用更改


    在做出更改后，可能会提示更新软件包缓存；点击确定更新更改。


    ![](img/image_rsrc4CY.jpg)

