    # Chapter 8: Using External Storage Devices


    Using external storage devices via the graphical user interface (GUI) in Linux
    Mint is typically straightforward. Here’s a guide on how to handle external storage
    devices using the GUI tools provided by Linux Mint:


    ### Plug and play


    Attach an external storage device to a USB port on your computer, such as an SD
    card, external hard drive, or USB drive. Linux often mounts external drives automatically;
    you should receive a notification and see the device on your desktop. You can
    see it in the sidebar if you are in the file manager. Click on it to access its
    contents. ![](image_rsrc4CC.jpg)


    ### Unmounting the Device


    To safely remove a USB device from a Linux system, make sure it is unmounted properly
    before physically unplugging it. This prevents data loss and file system corruption.
    Here''s how to accomplish it:


    - Right-click on the device icon in file manager and select `Eject` or `Unmount`.
    You can also unmount by clicking on the small mount icon next to the mounted device.

    - Another option is to unmount the USB device from the panel by right-clicking
    on the removable device icon and selecting `Remove "Removable drives"`. Once you
    get the confirmation message, you can safely unplug the USB device.


    ![](image_rsrc4CD.jpg)


    ### Format USB drive


    A USB drive can be made usable by formatting it, which removes existing data or
    installs a new file system. For ordinary use, you can use a file system like `FAT32`,
    or for Linux, `ext4`. The drive''s performance is enhanced and any problems are
    resolved through formatting. Additionally, it clears the disk of all previous
    data, leaving it empty and ready for usage.


    #### Using the GUI


    There are several ways to format a USB storage drive, and you may use either a
    GUI or a command line interface. In this method, we will use the `USB Stick Formatter(MintStick)`,
    a graphical application offered by Linux Mint.


    ![](image_rsrc4CE.jpg)


    1. Plug your USB drive into your computer.

    2. Start the USB stick formatter tool from the mint menu, located in the Accessories
    category.

    3. The USB stick formatter window will display a list of storage devices. Select
    your USB stick from the list.

    4. Select the preferred file system (e.g., `FAT32` or `ext4`).

    5. Change the `Volume Label` if required.

    6. Click on the `Format` button.

    7. Confirm the action by entering the authentication password and pressing `Authenticate`.
    This will delete all data from the USB stick and format it with the specified
    file system.

    8. On completion, you will receive a confirmation window.


    ### Writing ISO image


    An ISO image is a single file that contains a complete copy of the data on an
    optical disk, such as a CD, DVD, or Blu-ray, including the file system and all
    files and directories. The term "ISO" refers to the `ISO 9660` file system, which
    is used with DVD media and CD-ROM.


    An ISO image of a Linux OS is a file that contains a complete copy of the Linux
    operating system, including installation files, settings, and, in many cases,
    a bootable environment.


    The Linux Mint includes a program called `USB Image Creator`. It is used to convert
    an ISO image into a bootable USB device. This is helpful for running Linux Mint
    in a live session straight from the USB stick or for installing it on a computer.


    ![](image_rsrc4CF.jpg)


    Here''s how to use `USB Image Creator`:


    1. Download the image file.

    2. Insert your USB drive.

    3. Open the `USB Image Creator` from the Mint Menu’s Accessories category.

    4. Select the ISO file.

    5. Select the USB drive you wish to use. Be careful to choose the correct drive,
    as all data on it will be erased during the process.

    6. Press the `write` button.

    7. You will get `Authentication` window and warning about data deletion. Press
    `Authenticate` to begin the process of transferring the ISO to the USB device
    in bootable format (if the ISO file is bootable).

    8. Wait for the process to complete. The time required will vary according to
    the size of the image and the speed of your USB device. Once the process is finished,
    your USB drive should be ready for use.


    Using external storage devices is simple and intuitive in Linux Mint. Files may
    be accessed quickly with the file manager thanks to the automatic detection and
    mounting of devices like USB drives and external hard drives. All things considered,
    Linux Mint''s interaction with external storage devices is smooth, giving you
    both control and ease when it comes to handling your data.


    # Chapter 9: Using The Terminal


    The terminal is an application that allows you to access the Command-Line Interface
    (CLI) and interact with your system by typing text-based commands, which is faster
    and more efficient than using a mouse. It allows you to manage files, launch applications,
    and complete tasks. The command line is important for troubleshooting, remote
    system access, and script-based automation. It''s also an excellent method to
    learn more about your computer and enhance your technical skills. The terminal
    and virtual terminals are the two primary methods for gaining access to command-line
    interfaces.


    ### Terminal


    ![](image_rsrc4CG.jpg)


    With the terminal, you can perform commands and effectively administer your system
    from within your graphical desktop. To open it, use the `Ctrl + Alt + T` shortcut,
    search for `Terminal` in the Mint Menu, or right-click in the file manager and
    select `Open Terminal Here`.


    ### Virtual Terminal


    A virtual terminal is another way to access the command line. The virtual terminal
    provides several command-line sessions that are independent of the graphical interface.
    It enables users to switch between command-line instances, which is beneficial
    for multitasking, system administration, and troubleshooting. Virtual terminals
    come in handy when the graphical environment is unresponsive for carrying out
    various tasks or troubleshooting problems.![](image_rsrc4CH.jpg)


    `Ctrl + Alt + F1` through `F6` can be used to access virtual terminals. `Ctrl
    + Alt + F7` (or `F8`) can be used to return to the Graphical desktop.


    ### Tips and tricks


    Here are a few helpful tips for utilizing the terminal effectively:


    - **Tab Completion**: When you press `Tab` while typing a command or file name,
    it will autocomplete if there is just one option or display a list of possible
    completions. This can save time and prevent mistakes.

    - **Command History**: Use the `Up` and `Down` arrow keys to navigate through
    previously typed commands. This allows you to repeat or alter commands without
    having to type them again.

    - **History Search**: To search through your command history, use `Ctrl + R` and
    begin typing a portion of the command. Press `Ctrl + R` again to cycle through
    matches.


