    Chapter 18              


    Network


    What is a computer Network?


    A computer network is a group of computers and computing devices that are linked
    together. This link provides communication between the different computers and
    devices in that group. Computers and devices can use wire, fibre optic, or microwave
    as a medium of communication. There are many types of networks, but we will focus
    on TCP/IP as it is the most popular protocol in use both on local area networks
    (LAN) and wide area networks (WAN), such as the internet. We generally classify
    networks into wireless and wired networks, which are two major types of computer
    networks defined by their connection techniques.'
