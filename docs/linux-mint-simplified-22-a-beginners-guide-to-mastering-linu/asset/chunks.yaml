- fmt: '

    Aptitude is a text-based and command-line interface for `APT` (Advanced Package
    Tool), which is mostly utilized for Linux distributions based on Debian, such
    as Linux Mint, for package management. Compared to `apt`, it offers a UI that
    is more interactive and user-friendly. You will get a menu-driven interface if
    you launch `Aptitude` without any command-line arguments. Aptitude is best suited
    for use in a non-graphical terminal environment. Entering the following command
    at a terminal prompt will launch Aptitude''s menu-driven interface for regular
    users.


    ```bash

    sudo aptitude

    ```


    ![](image_rsrc4CU.jpg)Two pans, top and button, will appear when you run `aptitude`.
    Categories like installed packages, not installed packages, virtual packages,
    etc. are contained on the top pan. The package-related specific information is
    displayed in the bottom pan. Aptitude''s user interface is intuitive, making it
    simple to handle packages.


    Use these keys to access the `aptitude` after executing it:


    * `?` for help

    * Use `Ctrl-T` or `F10` to bring up the menu.

    * To navigate, use the `up, down, left, and right` keys.

    * Use `Enter` key to select or open and close a single level.

    * The bracket keys to recursively open and close levels are `[` and `]`.

    * To install, update, or uninstall a package, press the `+` or `-` key.

    * To preview or confirm an action, press the `g` key.

    * To exit, press the `q` key, which also closes the window that is now active.

    * To search ahead or backward, use the forward and backward slashes (`/` and `\`).


    ## Installing Packages


    To install a package, navigate to the "Not Installed Packages" category using
    the keyboard arrow keys and the `Enter` key.


    Highlight the selected package and press the `+` key. The package entry should
    become green, indicating that it has been tagged for installation. Now, hit `g`
    to see a summary of package actions. Press `g` again install the package. Once
    finished, hit `Enter` to return to the menu.


    ## Remove Packages


    Locate the package in the Installed Packages package category, then use the arrow
    key and `ENTER` key to highlight it in order to remove it. When the package is
    highlighted, hit the `-` key to designate it for removal. In order to remove the
    package, press `g` twice. When finished, hit `ENTER`. To go back to the main menu,
    press `q`.


    ## Update the Package Index


    To update the package index, hit the `U` key.


    ## Upgrade Packages


    To upgrade packages, first update the package index, then hit the `U` key to mark
    all packages as updated. Now, press `g` twice to download and upgrade the packages.
    After finished, press `ENTER`. Press `q` to return to the main menu.


    ## Dpkg


    `dpkg` is a low-level package management program that allows you to install, uninstall,
    and manage Debian packages directly, providing detailed control over package files.
    While higher-level programs like `apt` and `apt-get` are more widely used, `dpkg`
    offers more precise control. However, `dpkg` does not automatically resolve or
    manage dependencies between packages; users must manually ensure that all required
    dependencies are addressed. Normally, `dpkg` is used to install software from
    `.deb` files stored on your computer. For example, if you manually downloaded
    a software package, you would install it using `dpkg`. `apt`, on the other hand,
    is a utility for managing software from online repositories. It simplifies the
    process of installing, updating, and removing software by automatically handling
    dependencies. Here is summary of `dpkg` commands.


    ### Install Package


    To install a Debian (`.deb`) package that you have already downloaded in the current
    directory, use the following command.


    #### Syntax

    ```bash

    sudo dpkg -i <package.deb>

    ```


    #### Example

    ```bash

    sudo dpkg -i foo.deb

    ```

    This installs the `.deb` package. If there are dependencies that are not met,
    you might need to resolve them manually.


    ### List Known Packages


    The `-l` option displays a list of all packages installed on your system. It is
    handy for viewing the current package inventory and versions.


    ```bash

    dpkg -l

    ```


    ### Remove Package


    To remove the installed software while retaining its configuration files. This
    command is important if you want to save settings for future usage.


    #### Syntax

    ```bash

    dpkg -r <package>

    ```


    #### Example

    ```bash

    sudo dpkg -r foo

    ```


    ### Purge Package


    To completely remove the software and its configuration files. Use purge option
    if you want to completely remove the package from your system.


    #### Syntax

    ```bash

    sudo dpkg -P <package>

    ```


    #### Example

    ```bash

    sudo dpkg -P foo

    ```


    ### Check if the package installed


    To check whether a package is installed, use the `-s` tag:


    #### Syntax

    ```bash

    dpkg -s <package>

    ```


    #### Example

    ```bash

    dpkg -s foo

    ```


    ### Show package information


    To display extensive information about an installed package, such as version,
    status, and description. This command is also useful for checking if a package
    is already installed.


    #### Syntax

    ```bash

    dpkg -I <package.deb>

    ```


    #### Example

    ```bash

    dpkg -I foo*

    ```


    ## Summary


    These are just a few commands and examples of the many commands and options available
    for managing packages, repositories, and troubleshooting issues. Package management
    tools are essential in Linux Mint, since they ensure smooth program installation,
    updates, and security. Learning package management tools ensures efficient software
    management, enhancing system stability, security, and troubleshooting capabilities
    in Linux Mint and other Linux distributions. The `apt` manual (`man apt`), which
    offers thorough documentation on all available commands and their options, is
    a great resource to consult whenever you need more guidance.


    # Chapter 13 Configuring Repositories


    ## Repository


    A repository, sometimes abbreviated as "repo," is a central area where data is
    saved and handled. In the context of package management, a repository is often
    defined as a site where software packages, source code, and related metadata are
    saved and organized.


    The following procedures can be used in Linux Mint to manage repositories via
    the graphical interface (GUI):


    Click the Menu button, select Administration, and then click "Software Sources"
    to access Software Sources. The Software Sources application will launch as a
    result.


    ![](image_rsrc4CU.jpg)


    Authentication: When asked, provide your administrator password to authenticate.


