    # 第 19 章监控系统资源


    系统监控是一项持续活动，通过观察和评估计算机系统的不同部分，以确保其安全、按预期运行并正常工作。它涉及使用硬件或软件组件来监控系统资源，从而收集重要指标的数据，包括
    CPU 消耗、内存占用、磁盘 I/O、网络流量和系统运行时间等。


    系统监控有多种用途：


    ### 性能监控

    通过监控系统资源的过程，你可以找出占用过多 RAM、CPU 或磁盘 I/O 的应用程序或进程。这使你能够调整系统或应用程序的性能，以实现效率最大化。


    ### 问题解决

    对资源利用率的理解使得确定和修复系统问题变得更容易。例如，监控工具可以帮助识别计算机响应延迟是由高 CPU 负载、低内存或其他资源限制引起的。


    ### 容量规划

    持续的观察可以产生随时间变化的数据，这对于容量规划通常是必要的。作为持续容量规划计划的一部分，会对系统容量进行监控。长期资源监控用于容量规划，计算系统资源使用率的变化率。了解这些变化率允许根据获取更多资源的情况进行更精确的长期规划。


    ### 安全监控

    监控工具对于发现异常行为也有用，例如网络流量的突然增加或使用资源的奇怪进程，这些可能指向安全泄露。此外，它还会显示成功和未成功登录尝试的数据、root 登录成功与失败情况、删除和创建的用户帐户、sudo
    尝试以及服务的总数。


    Linux Mint 提供了多种第三方和内置工具来跟踪不同的系统指标。这些工具适应了各种喜好和需求，从以易懂方式显示数据的图形程序，到提供全面性能测量的命令行实用。


    ## 检查磁盘空间使用


    在使用系统时，监控磁盘空间以便重要，以确保最佳性能并防止空间耗尽。Linux 提供了多种方法让你检查磁盘空间：


    一个选项是名为“磁盘分析器”（Baobab）的图形程序。要启动“磁盘分析器”：


    *   点击 Mint 菜单按钮。

    *   要启动，从“管理”类别下选择“磁盘分析器”。


    ![](img/image_rsrc4E6.jpg)


    打开的窗口显示所有连接到系统的设备的摘要。


    *   点击任何设备以查看所有目录的详细信息。

    *   你可以深入研究目录以发现它们的大小和子目录。

    *   右侧的图形视图允许你快速识别可能占用大量空间的大文件或文件夹。

    *   图形显示可以在环形图和树状图之间切换。


    ![](img/image_rsrc4E7.jpg)


    *   你也可以扫描单个文件夹。点击菜单中的“扫描文件夹”来选择你想要分析的位置。


    ![](img/image_rsrc4E8.jpg)


    ### 使用命令行工具


    Linux 还提供了大量的命令行工具来监控磁盘。以下是一些较常用的工具：


    ### 使用 `df` 命令

    `df` 命令显示文件系统总空间和可用空间的信息。该命令从 `/proc/mounts` 或 `/etc/mtab` 获取信息。默认情况下，`df` 命令以千字节（KB）显示磁盘空间。你可以使用选项以
    MB 或 GB 显示。最常用的选项是 `-h`，它可以使输出变得人类易读。


    打开终端，输入：

    ```bash

    df -h

    ```


    ![](img/image_rsrc4E9.jpg)


    ### 使用 `du` 命令

    `du`（磁盘使用）命令是估计和报告文件占用磁盘空间的有用工具。


    语法：`du /path/to/directory`


    示例：使用 `-h` 选项以 KB、MB 或 GB 显示大小。

    ```bash

    du –h /media/user1/DATA/

    ```


    ### 使用 `lsblk` 命令

    `lsblk`（列出块设备）命令显示系统块设备的完整概述，包括硬盘、SSD、分区和 USB 驱动。它是分析磁盘结构（包括大小、类型和挂载点）极佳工具。


    语法：`lsblk [options] [device]`


    示例：

    ```bash

    lsblk

    ```


    ![](img/image_rsrc4EA.jpg)


    ## 检查内存占用


    监控内存占用对于确保计算机足够的资源来高效运行程序并防止崩溃或缓慢至关重要。


    Linux Mint 提供了图形和命令行工具来监控内存。系统监控是一个允许轻松监控内存使用和其他系统资源（包括 CPU 负载和磁盘活动）的图形化应用程序。


    ### 系统监控

    启动系统监控：


    1.  点击 Mint 菜单按钮。

    2.  要启动，从“管理”类别下选择“系统监控”。


    系统监控打开时会出现三个选项卡：文件系统、资源和进程。每个选项卡的描述如下：


    ### 资源选项卡

    资源选项卡显示系统资源利用情况的高级摘要，包括 CPU、内存和磁盘活动。它显示 CPU 负载、内存消耗和磁盘 I/O 的实时图。


    ![](img/image_rsrc4EB.jpg)


    ### 进程选项卡


    '
- fmt: '

    The Processes Tab displays a list of all currently active processes, including
    their process ID (PID), user, CPU use, memory consumption, and other information.
    It allows you to sort processes based on various parameters (such as CPU or memory
    utilization) and search for specific processes. To sort, select the required column
    header.


    ![](image_rsrc4EC.jpg)


    ## File Systems Tab


    The `File Systems` tab displays information about mounted file systems, such as
    their utilization, available space, and mount points. It''s useful for tracking
    disk space utilization and detecting full partitions.


    ![](image_rsrc4ED.jpg)


    ## Display memory usage using command line


    The `free` command is a Linux program that may be used to check for memory RAM
    on your system or to view the memory statics of the Linux operating system. To
    check your system''s memory use, run the `free` command with the `-m` or `-g`
    options for outputs in MB or GB, respectively.


    ```bash

    sudo free –m

    ```


    ## Other useful command line tools


    There are numerous other command line tools that can be extremely useful while
    monitoring a system. These tools are not limited to statistics for a single resource,
    but can be applied to several resources. Let''s look at some of the most popular
    tools that can be utilized with Linux Mint and other Linux variants.


    ### Top


    The `top` command line tool presents a versatile utility for real-time system
    monitoring. To view real-time system resource utilization, including CPU, memory,
    and process information, open a terminal and enter the following command:


    ```bash

    sudo top

    ```


    ### htop


    `htop` is an enhanced version of the `top` command, offering more features and
    a more user-friendly interface. While `top` gives you basic information about
    a process, including its ID, CPU and memory utilization, and status, `htop` gives
    you more information about the process, like who started it, what command was
    used to start it, and when it started.


    ```bash

    htop

    ```


    ### Vmstat


    The `vmstat` command-line utility displays a variety of system statistics. The
    information presented includes memory, paging, processes, IO, CPU, and disk scheduling.


    #### Syntax


    `vmstat [delay [count]]`


    - `delay`: delay between updates in seconds.

    - `count`: number of updates.


    #### Example


    ```bash

    vmstat 1 5

    ```


    The above command will display the `vmstat` output five times every one second.


    ## Network


    ### Netstat


    The `netstat` command provides network status and protocol statistics. You can
    display the status of TCP and UDP endpoints in a table format, routing table information,
    and interface information. To inspect network connections and routing tables,
    use `netstat`. For more precise information, add flags like `-a` or `-t`.


    #### Example


    ```bash

    netstat –a

    ```


    ### SS


    One of the most useful commands in Linux for inspecting sockets is `ss`, or socket
    statistics. Knowing how to utilize the `ss` command is essential for incident
    responders analyzing network connections and data, particularly when observing
    and investigating possibly malicious activity. Enter `ss` command with options
    to filter output.


    ```bash

    ss -t

    ```


    The command above only shows TCP sockets, which makes it easy to focus on a certain
    type of connections.


    ## Disk


    ### iostat


    The `iostat` command in Linux monitors system input/output data as well as CPU
    consumption for devices and partitions. It is handy for tracking disk performance
    and throughput. This will help identify high disk utilization. If `iostat` is
    not already installed, run the following command to do so.


    ```bash

    sudo apt install sysstat

    ```


    #### Example


    ```bash

    iostat -x

    ```


    The above command displays detailed statistical information.


    ## Overall System Monitoring tool


    You can use `nmon`, an interactive monitoring program that shows CPU, memory,
    network, and disk consumption. Press different keys to see different statistics.


    If `nmon` is not already installed on the system, you can install it using the
    `apt` command:


    ```bash

    apt –S nmon

    ```


    Now you can run the `nmon` command.


    ```bash

    nmon

    ```


    These are some of the most essential monitoring tools, but if you want more advanced
    functionality, you may always install the following tools:


    - Conky

    - Prometheus

    - Ganglia

    - Sematext

    - Zabbix

    - Elastic Stack

    - ManageEngine


    System monitoring is an important aspect of system administration. The tools mentioned
    in this chapter provide comprehensive insights into system resources, network
    activity, and I/O performance, allowing users to monitor and optimize system performance
    effectively in Linux Mint environments. Users have a variety of alternatives to
    select from based on their monitoring needs, whether they are using command-line
    utilities for rapid checks or graphical tools for in-depth examination of the
    system as part of system diagnostics. In a nutshell "prevention is better than
    cure".


    # Chapter 20: Firewall


    A firewall in Linux is a software-based network security system that monitors
    and regulates incoming and outgoing network traffic in accordance with established
    security rules. It serves as a barrier between a trusted internal network and
    untrustworthy external networks, such as the internet.


    The `UFW` (Uncomplicated Firewall) is used to manage firewall in the Linux Mint
    operating system. `GUFW` provides a graphical interface for managing `UFW`. It
    simplifies the process of configuring firewall rules with an easy-to-use interface.
    To launch `GUFW`, open the Mint Menu and select "Firewall Configuration" from
    the Preferences category. It will request you for a password for authentication.


    ![](image_rsrc4EE.jpg)


    Here is a basic interface overview:


    - **Status**: Turn the firewall on or off.

    - **Rules Tab**: Use the graphical interface to add, modify, and delete rules.


    ## Profiles


    Profiles are a collection of predefined firewall rules or configurations that
    simplify the management of files. Profiles give varying levels of security and
    network management based on common scenarios.


    `GUFW` provides certain preconfigured profiles. These profiles automatically create
    rules that allow or deny traffic on specified ports, making it easy to secure
    your system for popular services. The preconfigured profiles are:


    - **Home**: This profile allows outgoing connections and denies incoming connections.
    It allows all outgoing connections and only necessary incoming connections from
    services like SSH.

    - **Office**: You mostly trust the other computers on your network. Only selected
    incoming connections are accepted. For use at work areas.

    - **Public**: The most restricted profile blocks all incoming connections while
    allowing all outgoing ones. Use this profile when connecting to public Wi-Fi network
    to safeguard the system against threats.


    In addition to the three basic profiles, you can manage rules and create custom
    configurations that function as profiles. To build a custom or remove an existing
    profile, follow these steps:


    1. Go to `Edit` -> `Preferences`.

    2. Click the plus button `(+) to add a new profile.

    3. Locate the new profile in the list. Double-click the name to enter a custom
    name for the profile.


    ![](image_rsrc4EF.jpg)


    Once a new profile is created, you can add rules to it.


    ### Add new rule


    To add a new rule, do the following:


    1. Select the profile for the rule.

    2. Select the `Rules` tab.

    3. Click the plus `(+)` to open the firewall rule window.


    The "Add a Firewall Rule" window consists of three tabs, the descriptions of which
    are provided below:


    - **Preconfigured**: The easiest and most user-friendly method for adding new
    rules. This allows you to add rules depending on predefined services. A service
    includes a set of preconfigured local ports, protocols, and destinations.


    ![](image_rsrc4EG.jpg)


    - **Simple**: A quick and simple method for adding a firewall rule with additional
    options Include rules based on services and port.

    - **Advanced**: Allows total control over the rules for controlling traffic from
    specific IP addresses, subnets, and interfaces.

