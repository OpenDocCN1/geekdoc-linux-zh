  trans: "\n使用这些标签页之一，你可以轻松为你的自定义配置定义新规则。\n\n## 结论\n\nGUFW 为 Linux Mint 上的防火墙规则提供了一个直观的图形界面，使网络安全管理变得简单。通过使用预定义的配置，可以更容易地创建、删除和配置防火墙规则。GUFW\
    \ 对于那些喜欢简单控制防火墙的人来说非常理想，适用于基础到中级的安装。\n\n## 第 21 章：进程管理\n\nLinux 操作系统执行的每一个任务都有与其关联的进程。一个任务可能由一个或多个进程组成。简单来说，进程就是一个正在执行的程序。进一步的进程以线程的形式执行。线程是操作系统分配处理器时间的基本单位。其设计的核心思想是通过将一个进程划分为多个线程来实现并行性。进程和线程之间的主要区别是，同一进程内的线程在共享内存空间中运行，而进程运行在独立的内存空间中。进程具有以下属性：\n\
    \n*   进程的上下文切换决定了进程的优先级。\n*   每个进程都为执行程序提供所需的资源。\n*   每个进程从一个名为主线程的单线程开始。\n* \
    \  一个进程可以拥有多个线程。\n\n以下是 Linux 进程一些基本特征的概述：\n\n*   进程状态\n*   进程标识\n*   进程控制\n*\
    \   进程优先级\n*   进程同步\n*\n进程管理\n*   进程创建\n\n### 进程状态\n\nLinux 进程可以处于各种状态。这些状态定义了你可以对该进程进行哪些操作：\n\
    \n*   运行与可运行（Running & runnable）：当新进程启动时，它被处于运行或可运行状态。\n*   睡眠（Sleeping）：等待另一个进程完成（例如\
    \ I/O 操作）。\n*   停止（Stopped）：挂起或停止。\n*   僵尸（Zombie）：执行完成后的中间状态，但在进程表中仍有条目。\n\n\
    ### 进程标识\n\n进程 ID (`PID`) 是分配给操作系统系统中每个活动进程的唯一标识符。每个进程都有自己的进程 ID (`PID`) 并在独立的内存空间中运行。它分离了并发进程，使其更容易于管理和分配资源。\n\
    \n### 进程控制\n\nLinux 操作系统有各种控制前景和后台进程的工具。最流行的工具之一是 Shell，它为操作系统提供了一个命令行界面。Shell\
    \ 允许用户启动、终止、暂停和重启前景及后台进程。以下是你在两种模式下管理进程的方法：\n\n#### 前景进程\n\n前景进程是你直接运行并等待其完成的任何命令或任务，或者你可以手动停止它。\n\
    \n1.  **启动前景进程**\n    要启动前景进程，只需在命令行上运行命令或脚本。\n\n    示例\n```\ncp asp.txt /home/\n\
    ```\n\n2.  **暂停进程**\n    你可以通过按下键盘上的 `Ctrl + z` 键暂停正在运行的前景进程。这将挂起进程并将其放入后台。\n\n\
    3.  **恢复已暂停的前景进程**\n    要从后台恢复挂起的进程，请输入 `fg` 命令后跟作业号。你可以通过 `jobs` 命令获取作业号。\n\n\
    语法\n```\nfg %[job_id]\n```\n\n示例\n```\nfg %1\n```\n\n#### 后台进程\n\n后台进程是在后台隐隐运行的进程。与前景进程不同，Shell\
    \ 不必等待后台进程完成即可运行更多进程。在后台运行的最大进程数取决于可用内存量。\n\n1.  **启动后台进程**\n    你可以在命令后使用 `&`\
    \ 符号将进程发送到后台。\n\n示例\n```\nping 8.8.8.8 > /dev/null &\n```\n\n2.  **列出后台进程**\n\
    \    使用 `jobs` 命令列出后台进程。\n```\njobs\n```\n\n3.  **将命令带回前景**\n    要将后台进程带回前景，使用\
    \ `fg` 命令。\n\n语法\n```\nfg %[job_id]\n```\n\n示例\n```\nfg %1\n```\n\n#### 终止进程\n\
    \n如果你在终端中运行一个命令并想停止它，请使用键盘上的 `Ctrl + c`。\n\n### 使用命令行工具\n\n你可以使用命令行或 GUI 工具来结束由你或其他用户启动的进程，无论它是运行在前景还是后台。以下是终止进程的一些重要命令的概述。\n\
    \n**Kill**\n\n`kill` 命令向进程发送信号。它可以用于优雅地或强制地结束进程。\n\n语法\n```\nkill [options] <PID>\n\
    ```\n\n示例\n```\nkill %22\n```\n\n你可以指定要发送的信号。如果没有指定信号，默认将发送 `SIGTERM` (15)。\n\n\
    | 信号名称 | 信号数字 | 操作 |\n| :--- | :--- | :--- |\n| SIGTERM | 15 | 终止（优雅地） |\n| SIGKILL\
    \ | 9 | 终止（强制地） |\n| SIGINT | 2 | 中断 |\n| SIGHUP | 1 | 挂起 |\n| SIGSTOP | 19 |\
    \ 停止（暂停） |\n| SIGCONT | 18 | 继续（恢复） |\n\n**优雅地终止进程**\n语法\n```\nkill PID\n```\n\
    \n示例\n```\nkill 44\n```\n\n**强制终止进程**\n语法\n```\nkill -9 PID\n```\n\n示例\n```\n\
    sudo kill -9 44\n```\n\n**Pkill 命令**\n\n要终止进程，请使用命令 `pkill` 后后跟其名称。在此命令中，你使用进程名称而不是进程\
    \ ID。\n\n语法\n```\npkill command_name\n```\n\n示例\n```\npkill -9 my_script\n```\n\
    \n**脱离终端会话进程**\n\n你可以使用命令行或 GUI 工具来结束由你或其他用户启动的进程，无论它是运行在前景还是后台。以下是终止进程的一些重要命令的概述。\n\
    \n**nohup**\n\n`nohup` 意为“不挂起”，允许 Linux 系统在关闭 shell 后继续运行程序。\n\n语法\n```\nnohup\
    \ command &\n```\n\n示例\n```\nnohup ./myscript &\n```\n\n**Disown 命令**\n\n另一种在关闭\
    \ shell 后继续运行程序的方法是使用 `disown` 命令从 shell 脱离。\n\n语法\n```\ndisown [options] [job]\n\
    ```\n\n示例\n```\ndisown %1\n```\n\n### 进程概念\n\n以下是你应该的进程概念：\n\n**Init**\n\n`Init`\
    \ 是系统启动时启动的进程，一直运行到系统关闭。它会自动成为所有启动进程的父进程或祖父。它还会收养孤儿进程。内核在启动期间启动 `Init` 进程；如果内核无法做到，就会发生内核恐慌。`PID`\
    \ 1 分配给 `Init` 进程。\n\n**守护进程 (Daemon)**\n\n后台服务进程。系统加载多个守护进程以确保系统正常运行。例如，`chronid`\
    \ 守护进程用于同步系统时间。进程名称末尾的字母 `d` 通常标识守护进程，如 `chronid`、`dhcpd` 或 `httpd`。\n\n**用户进程**\n\
    \n由 Linux shell 执行的进程被称为用户进程，也称为交互式进程，如命令行上的 `ls` 命令。用户进程还包括你在图形界面界面启动的进程，例如启动\
    \ Firefox 浏览器时。\n\n**父进程和子进程**\n\n任何启动或产生另一个进程的进程被称为父进程。子进程是由另一个进程启动的进程。父进程对其所有子进程具有完全控制权。例如，如果你启动\
    \ Firefox，可以使用 `ps` 命令查看它启动了多少个进程。这些每一个进程都被称为子进程。\n\n**ps 命令**\n\n`ps` 命令用于生成系统当前运行的所有进程列表，并显示有关每个进程的详细信息。\n\
    \n列出系统中运行的所有进程：\n```\nps –ef\n```\n\n示例\n```bash\nps -ef\n```\n"
