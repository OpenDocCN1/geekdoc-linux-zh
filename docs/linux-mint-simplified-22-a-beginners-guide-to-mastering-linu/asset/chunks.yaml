- fmt: "\nIn any computing environment—whether it's a single-user system, a multi-user\
    \ server, or a networked enterprise environment—effective user and group administration\
    \ is crucial for preserving system integrity, security, and efficiency.\n\n# Users\n\
    \nA user is a person who logs in to the system and uses it for different purposes.\
    \ On a Unix-like system, every user account has a distinct username and user ID\
    \ (`UID`). Users have certain account-specific permissions and settings, and they\
    \ have the ability to own files and processes.\n\n## User Characteristics\n\n\
    Each user typically has several characteristics and attributes associated with\
    \ their account. Here are some of the key characteristics:\n\n*   **Username**:\
    \ The name that appears on the screen when a user logs in and uses the system.\n\
    *   **User Identification (UID)**: a unique number linked to every user account.\
    \ It gives the user a special identification within the system.\n*   **Home directory**:\
    \ The user's directory, which contains its configuration settings and files.\n\
    *   **Password**: During the authentication procedure, passwords are used to confirm\
    \ the user's identity.\n*   **Login shell**: This is the command interpreter or\
    \ shell that the user uses to log into the system.\n\n## Users management\n\n\
    In Linux, graphical user interfaces (GUIs) can be used alongside command-line\
    \ tools to add and manage users. GUIs offer a more user-friendly approach to user\
    \ administration duties.\n\n### Create users\n\nThe system creates one user during\
    \ installation; to add more users, use the command line or a graphical user interface\
    \ (GUI), whichever is more convenient for you.\n\n#### Using GUI\n\n1.  Click\
    \ the Menu button, select Administration, and then \"Users and Groups\". This\
    \ will launch the User and Group Management tool. When prompted for authentication,\
    \ provide your administrator password.\n2.  At the user tab. Click the `Add` button.\n\
    3.  A dialog box will appear in which you can enter the information for the new\
    \ user:\n    ![](image_rsrc4D6.jpg)\n    *   **Account type**: Select whether\
    \ the user will be Standard or Administrator (with `sudo` rights).\n    *   **Full\
    \ Name**: User's Name or Description\n    *   **Username**: Fill in the preferred\
    \ username for the new user.\n4.  Press the `Add` button.\n5.  Once added, the\
    \ new user will appear in the list of users in the Users.\n\n#### Setting user\
    \ password\n\nOnce you've created a user, you should assign it a password.\n\n\
    1.  Select the user whose password you want to change from the list of users.\n\
    2.  Click on the “No password set”.\n    ![](image_rsrc4D7.jpg)\n3.  ![](image_rsrc4D8.jpg)It\
    \ will open a dialog box. Enter the new password for the user in the provided\
    \ fields. Press the `Change` button.\n\n#### Using command line\n\nUsing the `useradd`\
    \ command and the desired username will allow you to create a new user.\n\n**Syntax**\n\
    ```\nuseradd -m user_name\n```\nHere the `-m` flag creates a home directory for\
    \ the user.\n\n**Example**\n```bash\nsudo useradd -m user2\n```\n\n#### Setting\
    \ user password\n\nRun the `passwd` command to assign a password to the newly\
    \ created user.\n\n**Syntax**\n```\npasswd user_name\n```\n**Example**\n```bash\n\
    sudo passwd user1\n```\n\n### Deleting users\n\nWhen a user is no longer required,\
    \ you should remove them. Deleting a user in Linux Mint removes unnecessary access,\
    \ improves security by eliminating potential dangers associated with inactive\
    \ accounts, and optimizes system resources by freeing up storage and configuration\
    \ space allotted to the user. Here's how to do it in GUI and CLI mode:\n\n**GUI**\n\
    1.  Select the user you want to delete from the list of users.\n2.  Click on the\
    \ \"Delete\" button. Confirm the deletion when prompted.\n    ![](image_rsrc4D9.jpg)\n\
    \    Once confirmed, the user account will be removed from the system.\n\n**Using\
    \ CLI**\nTo delete a user from the system, you can use the `userdel` command:\n\
    \n**Syntax**\n```\nuserdel user_name\n```\n**Example**\n```bash\nsudo userdel\
    \ user1\n```\n\n### Listing users\n\nTo list all defined users on the system\n\
    \n**Syntax**\n```bash\ncat /etc/passwd\n```\n**Example**\n```bash\nsudo cat /etc/passwd\n\
    ```\n\n## Modify user properties\n\nTo modify user settings (password, group membership,\
    \ username, etc.) using the GUI.\n\n1.  Select the user you want to modify from\
    \ the list of users.\n2.  You can alter a number of parameters in the right pane,\
    \ including:\n    *   **Account type**: Switch from Standard to Administrator\
    \ or vice versa.\n    *   **Username**: Change it if necessary.\n    *   **Password**:\
    \ Select the \"Password\" to modify the user's password.\n    *   **Groups**:\
    \ Select or deselect groups by clicking on the \"Groups\" popup to manage group\
    \ memberships. ![](image_rsrc4DA.jpg)\n3.  After making the necessary changes,\
    \ click \"OK\"\n\n#### Using CLI\n\nTo edit user characteristics such as username,\
    \ home directory, shell, and so on, use the `usermod` command on the command line.\n\
    \n#### Change username\n**Syntax**\n```\nusermod -l new_user_name old_user_name\n\
    ```\n**Example**\n```bash\nsudo usermod -l myuser user1\n```\n\n#### Lock user\
    \ account\n**Syntax**\n```\nusermod -L user_name\n```\n**Example**\n```bash\n\
    sudo usermod -L user1\n```\n\n#### Unlock locked user\n**Syntax**\n```\nusermod\
    \ -U user_name\n```\n**Example**\n```bash\nsudo usermod -U user1\n```\n\n####\
    \ Disable password expiration\n\nA clearly specified password expiration policy\
    \ is an important aspect of system security. Setting a password expiration date\
    \ ensures that passwords are updated on a regular basis, lowering the risk of\
    \ unwanted access caused by compromised or expired credentials. In certain scenarios,\
    \ you might need to disable or adjust automatic password expiration policies.\
    \ This could be due to special operational needs, user convenience, or other corporate\
    \ policies. To disable password expiration for the specified user:\n\n**Syntax**\n\
    ```\nchage -M -1 user_name\n```\n**Example**\n```bash\nsudo chage -M -1 user1\n\
    ```\n\n#### Change User ID (UID)\n\nChanging a user ID is sometimes necessary\
    \ to resolve conflicts, reorganize system accounts, or align with organizational\
    \ standards. To change userid of user:\n\n**Syntax**\n```\nusermod -u new_uid\
    \ user_name\n```\n**Example**\n```bash\nsudo usermod -u 1091 user1\n```\n\n####\
    \ Change home directory\n\nTo change a user's home directory in Linux, update\
    \ the user settings to point to the new location. This method is beneficial in\
    \ a of situations, including moving user accounts, restructuring storage, and\
    \ renaming home directories. This is how you do it:\n\n**Syntax**\n```\nusermod\
    \ -d /path/to/new_home user_name\n```\n**Example**\n```bash\nsudo usermod -d /home/myhome\
    \ user1\n```\nThis command changes the home directory to `/home/myhome`.\n\n####\
    \ Change default shell\n\nThe shell, or command-line interface, is an essential\
    \ component of the Linux operating system. Changing a user's default shell means\
    \ modifying the shell specified for the user. The default shell controls the command-line\
    \ environment with which the user interacts when logging in. Here's how you can\
    \ change the user's default shell:\n\n**Syntax**\n```\nusermod -s /path/to/new_shell\
    \ user_name\n```\n**Example**\n```bash\nsudo usermod -s /bin/csh user1\n```\n\
    This command changes the shell to `/bin/csh`.\n\n#### Add user to additional groups\n\
    \nBy default, a user belongs to a primary group whose name is the same as their\
    \ username. Using the `-aG` option with `usermod`, you can add a user to more\
    \ groups. This allows users to access resources or perform actions associated\
    \ with those groups.\n\n**Syntax**\n```\nusermod -aG group_name user_name\n```\n\
    **Example**\n```bash\nsudo usermod -aG group2 user1\n```\n\n# Monitoring User\
    \ Activity\n\nMonitoring user activity on a Linux system is critical for security,\
    \ troubleshooting, and compliance reasons. You can monitor user behavior with\
    \ a variety of methods and tools, including:\n\n### System logs\n\nThe system\
    \ logs, placed in `/var/log`, include useful information about user activity,\
    \ such as login/logout events, authentication attempts, and system events. The\
    \ most important logs for user activity monitoring are:\n\n*   `/var/log/auth.log`:\
    \ It keeps track of authentication-related events, such as successful and unsuccessful\
    \ login attempts.\n*   `/var/log/syslog`, `/var/log/messages`: Contains general\
    \ system activities, such as user login and logout events.\n\nYou can filter and\
    \ analyze log entries via tools such as `grep`, `tail`, and `less`.\n\n### last\
    \ command\n\nThe `last` command shows a history of login sessions, together with\
    \ the timings, durations, and terminal sessions of each login.\n"
