    # Wireless Networks


    Wireless networks employ radio waves to connect devices. It allows devices to
    connect to the network without the usage of physical cords. Wireless networks
    are popular in homes, businesses, and public locations because they are simple,
    flexible, and mobile to connect. We commonly use `WiFi` for wireless networks.


    Wired networks use wires to connect devices. `Ethernet` cables, coaxial cables,
    and fiber optic cables are common types of cables used in wired networks. Wired
    networks frequently offer faster and more consistent connections than wireless
    networks, making them excellent for applications that require high bandwidth or
    low latency.


    In `Linux Mint`, you can configure wired and wireless networks using a variety
    of graphical user interface and command-line tools. Here''s how to configure networking:


    ## Establishing a Wireless connection


    When your wireless network is connected, it will show a Wi-Fi icon on the panel.


    If you see the network icon with a cross, it signifies you are not connected to
    any network.


    ![](image_rsrc4DW.jpg)


    To connect to your home or office wireless network, follow the below procedure:


    - Click the network icon with a cross to expand the collapsed menu, which will
    display the available networks.

    - Select your Wi-Fi network name.


    ![](image_rsrc4DX.jpg)


    - If the network is password protected, it will ask for the password. Provide
    your password and press Connect.


    ![](image_rsrc4DY.jpg)


    Once your network is connected, the panel will display a Wi-Fi icon.


    ![](image_rsrc4DZ.jpg)


    ## Wired network


    Connecting to a wired network is easy; just plug the network cable into your computer.
    The system will automatically configure the system for the available network.
    Once the system connects to a wired network, the network icon appears on the panel.


    ![](image_rsrc4E0.jpg)


    Later in this chapter, we will learn how to configure a wired network manually.


    ## Command line network management


    Before proceeding with network configuration, it is advisable to identify the
    devices present in the system.


    ### Identify network interfaces


    To identify your network interfaces, open a terminal and run the command below:


    ```

    sudo ip link

    ```


    This command will list all network interfaces, including their names and statuses.
    To identify your network interfaces, look for interfaces beginning with `en`,
    `wl`, or `ww`. Once you''ve found the relevant interface, you can utilize its
    name to perform additional configurations, such as networking or troubleshooting
    connectivity.


    ![](image_rsrc4E1.jpg)


    ### Naming convention


    Historically, Ethernet devices were designated as `ethX` (e.g., `eth0`, `eth1`).
    However, with the introduction of predictable network interface names, newer Linux
    distributions, like `Linux Mint`, have adopted a more uniform naming convention
    based on variables such as the device''s physical location or attributes.


    Predictable network interface names are a consistent approach of naming network
    interfaces in Linux, making it easier to identify interfaces even after system
    reboots and hardware modifications.


    The naming scheme usually follows this pattern:


    | `en` | for Ethernet |

    | :--- | :--- |

    | `wl` | stands for wireless LAN. |

    | `ww` | stands for Wireless Wide Area Network |

    | `p` | for PCI bus. |

    | `o` | onboard gadgets. |

    | `sN` | stands for slot number. |


    ### Example


    - `enp0s3`: Ethernet interface, PCI bus 0, slot 3.

    - `wl0`: Wireless LAN interface.


    ## IP Address Assignment Types


    In order for devices to connect and uniquely identify themselves to one another
    over networks, `IP` (Internet Protocol) addresses are essential. IP addresses
    are mostly assigned using two methods: static and dynamic. Each approach has its
    own set of benefits and applications. Let''s examine these to learn how they work
    and when to use them.


    ### DHCP


    DHCP stands for `Dynamic Host Configuration Protocol`. It is a network administration
    protocol for IP networks in which a `DHCP` server dynamically provides IP addresses
    and other network setup parameters to network devices such as PCs, cellphones,
    and IoT devices. DHCP makes network management easier by automatically assigning
    IP addresses and network configuration settings to devices, eliminating the need
    for human configuration.


    ### Static Address


    Static address assignment, as opposed to dynamic assignment via `DHCP`, involves
    manually specifying a device''s network parameters, such as its IP address, subnet
    mask, default gateway, and DNS server addresses. This strategy is commonly used
    with devices that require a continuous and unchanging network setup, such as servers,
    printers, or network appliances.


    Now you understand that both dynamic and static IP address assignment methods
    have advantages and are appropriate for various network settings and use cases.
    Understanding the differences enables network managers to select the best solution
    depending on their individual needs and network equipment.


    ## Manual Wired network configuration


    Most of the time, wired network settings are automatic, but in other circumstances,
    you must specify the IP address manually, especially in the office environment.
    This type of configuration is known as "static IP address configuration."


    To configure static IP address:


    1. Click the network icon on the panel.

    2. Click `Network Settings`.


    ![](image_rsrc4E2.jpg) ![](image_rsrc4E3.jpg)

    3. It will bring up the network settings window.

    4. The `Wired` field indicates the status of the network. Make sure the button
    is in the `ON` position.

    5. Click the gear icon.

    6. Click `IPv4` in the left pane of the window.


    ![](image_rsrc4E4.jpg)


    - Choose `Manual` as the addresses from the dropdown menu.

    - Provide an IP address.

    - Enter `Netmask`.

    - Enter `Gateway`.

    - If required, set `DNS` to manual and provide a server IP address.

    - Press “Apply”.


    ## Hostname


    A hostname is a label that identifies a computer networked device. It is used
    to identify the device on the network. Hostnames are typically alphanumeric and
    can include hyphens but not underscores. Hostnames are commonly used in conjunction
    with IP addresses to locate and connect with networked devices.


    Hostnames on a local network or on the internet are translated to IP addresses
    using `DNS` (Domain Name System) servers. For example, when you enter a domain
    name (such as `example.com`) into a web browser, your computer requests a DNS
    server to resolve the domain name to an IP address, allowing it to connect to
    the right server.


    On a small network with a few workstations, the hostname is commonly specified
    through the operating system''s network settings. It can also be specified manually
    in configuration files. A computer on a home network may have a hostname such
    as `new-laptop`, `Guest-PC`, or `myPC`.


    You normally have the option to specify the hostname (Computer Name) during the
    `Linux Mint` installation, but if you wish to change it afterward, follow these
    steps:


    You can view and set the hostname using the `hostname` command.


    To check current hostname:

    ```

    hostname

    ```


    To change or set new hostname:


    Syntax:

    ```

    sudo hostnamectl set-hostname new-hostname

    ```


    Example:

    ```

    sudo hostnamectl set-hostname My-LinuxMint

    ```


    Next edit the `/etc/hosts` file:

    ```

    sudo nano /etc/hosts

    ```


    Replace any occurrence of the existing computer name with your new one.


    ![](image_rsrc4E5.jpg)


    To save the file, use the `Ctrl + O` key and press `ENTER`. To exit Nano, use
    `CTRL + X`.


    ### Reboot the system

    ```

    sudo reboot

    ```


    ## Important network commands


    Below are some of the useful network commands that can be used in most modern
    Linux distributions, including `Linux Mint`.


    | Command | Description |

    | :--- | :--- |

    | `ip` | This command is a multipurpose command for network configuration. It
    can be used for displaying, configuring, and managing network interfaces, routing,
    and addresses. Example: `ip link`, `ip addr show` |

    | `ipconfig` | Despite being deprecated, `ifconfig` is still widely used for basic
    network interface configuration and display. However, it is recommended that you
    utilize `IP` instead. Example: `ipconfig -a` |

