    Filesystem Hierarchy


    What is Filesystem?


    A filesystem is a way for operating systems to organize and store data on storage
    devices including hard drives, solid-state drives (SSDs), USB drives, and optical
    discs. It offers an organized approach to managing files, folders, and the metadata
    associated with them. Here are some important components and concepts linked to
    filesystems:


    1.  Files


    2.  Directories(Folder)


    3.  Metadata


    4.  Filesystem types


    5.  Partitioning


    6.  Formatting


    7.  Mounting and Unmounting


    8.  Access Control


    Filesystem and FHS


    FHS is a set of standards for the structure and organization of files and directories
    in Unix-like operating systems. It standardizes the filesystem hierarchy layout,
    ensuring consistency between Unix and Unix-like systems. FHS provides the usual
    root folders, which include /bin, /boot, /etc, /home, /usr, /var, and others.


    The FHS directory structure begins with the / (root) directory. Even if the files
    and directories are stored on different physical or virtual devices, they all
    appear under the root directory.


    FHS defines the directory structure that most Linux distributions use. According
    to FHS, a program written for one Linux distribution can be easily ported to another.
    This ensures that only minor or no changes are required. Assume you have a program
    that stores binary files in the /opt directory. If there is no standard, you must
    either create the directory or change the program when migrating to another Linux
    distribution. FHS is also useful for system administration because it eliminates
    the need to remember the location of configuration and log files if you have multiple
    Linux distributions in your data center.


    File system concepts


    Files


    *   The fundamental units of data storage within a filesystem are files.


    *   Files can include a variety of data types, including text, photos, applications,
    and documents.


    *   Within each directory, each file is identified by a unique name.


    Directory (folders)


    A directory, sometimes referred to as a folder, is a kind of file used by computers''
    filesystems to arrange and store other files and directories in a hierarchical
    structure. Modern operating systems must have directories in order to put relevant
    files together for easier management and organization. Key information regarding
    directories is as follows:


    *   Containers for grouping and organizing related files.


    *   A hierarchical tree-like structure can be formed by directories holding both
    files and other directories.


    Linux Mint has been acknowledged for adhering to the Filesystem Hierarchy Standard
    (FHS), which specifies the layout and contents of the Linux file system directory.
    This means that critical folders such as /bin, /etc, /home, /lib, /opt, /sbin,
    /usr, and /var are used as specified by the FHS rules.


    The description of each directory is as follows:


    | Directory | Description |


    | / | Top directory, all other directories are sub directories of root file system.
    |


    | /bin | This directory primarily contains links (shortcuts) to /usr/bin. Also
    included are executable files and commands required by both system administrators
    and normal users. |


    | /boot | Files for system boot. |


    | /dev | Device driver files. |


    | /etc | Configuration files. |


    | /home | All users'' home directories except the root user. |


    | /lib | Libraries and kernel modules |


    | /lib64 | 64 bit libraries |


    | /media | Mount point for external storage devices. |


    | /mnt | Mount point for user mounts. |


    | /opt | Third party software. |


    | /proc | Temp directory for all running processes. |


    | /root | Home directory of root user. |


    | /run | Temp file system used by running processes. |


    | /sbin | Contains mostly symbolic links to /usr/sbin directory for system executable
    files. |


    | /srv | Services related data. |


    | /sys | Symbolic link to the kernel source tree. |


    | /tmp | Temporary files. |


    | /usr | Contains all the user binaries, their documentation, libraries, header
    files, etc. |


    | /var | Variable files such as logs. |


    Metadata


    Under Linux, the information that describes the properties of files and directories
    is referred to as metadata. Typical metadata consists of:


    File Permissions: Indicates who has the ability to run, write, and read the file.


    Ownership: Identifies the individual or organization in possession of the file.


    Timestamps: Indicate the creation, modification, and access dates of the file.


    File Type: Identifies the type of file, such as regular, directory, symbolic link,
    etc.


    Size: The file''s size expressed in bytes.


    Extended Attributes: Additional metadata that can be added to a file to provide
    information beyond the standard attributes.


    Directory (Folder) concepts


    Home folder


    In a multi-user environment, every user has his own home folder. The home folder
    holds the user’s personnel files, including documents, pictures, music, and videos.


    Path


    The "path" is the current location of the file or directory. A path to a file
    is made up of / and alphanumeric characters. You can specify the path in two ways:
    relative path and absolute path. 


    Absolute Path-name


    An absolute path specifies the location of a file or directory relative to the
    root directory (/). To represent any directory using an absolute path, begin at
    the root directory (/) and work your way down. After each directory name, add
    a slash (/) (last one is optional)


    To access a file contact.txt in the Documents directory, we will write  /home/shiv/Documents/contact.txt.


    Relative path


    Relative path is a shortcut that uses the current or parent directory as a reference
    and specifies the path relative to it. Relative paths use single or double dots. 
    The current directory is represented by a . (single dot), while the parent directory
    is represented by ..(two dots).


    Files and directories are key components of every file system, with files storing
    data and directories organizing it in a hierarchical manner. Mastering their management,
    whether through GUI tools or command-line commands, enables more efficient data
    handling and system navigation. Understanding paths grants you more control over
    your files and directories. In the following chapters, we will look at how to
    manage files and directories in both GUI and command-line modes.


