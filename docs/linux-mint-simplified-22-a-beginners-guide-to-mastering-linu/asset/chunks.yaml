    communication, and scheduling techniques, provides insight into how operating
    systems manage concurrency, ensure data integrity, and maximize resource consumption.


    Chapter 22              


    User Permissions and Access Control


    Linux is a multi-user operating system that can be accessed by many users simultaneously.
    Therefore, it becomes utterly necessary that users do not touch each other’s data.
    For the security and sanity of the data and system files, the operating systems
    deploy different types of security systems. Linux divides authorization into two
    levels.


    •                    Ownership


    •                    Permission


    Ownership


    Ownership defines who can access the file or directory. Every file is owned by
    a specific user (or UID) and a specific group (or GID).


    Change ownership


    The chown command can be used to change the ownership of a file or directory.


    1.  List the owner and group of files and directories


    To view the owner and group of files and directories, use the ls -la command.


    # ls –la


    Change the owner of a file.


    Syntax


    chown username  filename


    Example


    # chown user2 example.sh


    To change the group ownership of a file or directory


    You can use the chown or ''chgrp'' commands to alter the group ownership of a
    file or directory.


    Syntax


    chown :group  filename


    Example


    sudo chown :data2 notes.txt


    Using chgrp


    Syntax


    chgrp group file/directory


    Example


    sudo chgrp data2 notes.txt


    Change the Owner and Group of a File


    You can also change the group and owner of the file simultaneously.


    Syntax


    chown username:group  filename


    Example


    sudo chown shiv:data2 asp2


    Recursively Change the file ownership


    To recursively change ownership of the directory and its files.


    Syntax


    chown -R user:group directory


    Example


    sudo chown -R user2: /home/timetable


    Permissions


    There is a standard set of access permissions for all files and directories. Permission
    defines the action allowed on the file or directory. These actions, also known
    as "permission sets," are read, write, and execute. There are two ways to represent
    the permissions:-


    •                    Symbol


    •                    Numbers


    Symbols


    To represent the file permissions following symbols are used:


    | Symbol | Permission |


    | r | Read |


    | w | Write |


    | x | Execute |


    Execute permission for a directory allows the user to access its contents.


    Numeric representation of permissions


    Numeric mode refers to the use of numbers to denote Linux file permissions. In
    numerical form, a three-digit value denotes specific file permissions (for example,
    774). We refer to these as octal values. Owner permissions are represented by
    the first digit, group permissions by the second, and other user permissions by
    the third. Each permission has a numeric value assigned to it:


    | Number | Permission |


    | 1 | Execute |


    | 2 | Write |


    | 4 | Read |


    To represent the net permissions, we can use the sum of numerical representations
    of permissions.


    The chart of numeric and symbol permissions is shown below:-


    | Sum | Symbol | Permission |


    | 0 | - | No permission |


    | 1 | --x | Execute permission |


    | 2 | -w- | Write permission |


    | 3 | -wx | Write and Execute permission |


    | 4 | r-- | Read permission |


    | 5 | r-x | Read and Execute permission |


    | 6 | rw- | Read and Write permission |


    | 7 | rwx | Read, Write and Execute permission |


    Permission groups


    Each file or directory has three permission groups. The scope of permissions for
    each file and directory is defined by these permission groups. The table below
    shows the permission groups and their scope.


    | Permission | Symbol | Scope |


    | Owner | u | By default user who creates the file or directory becomes the owner
    of the file or directory. |


    | Group | g | Members of the group that owns the file or directory |


    | Others | o | Grants permissions to other users. Practically, it means everybody
    else. |


    Permission management command line


    Use the chmod command to manage the permissions of files and directories.


    Add permissions


    Syntax


    chmod +permssions filename


    Example


    chmod +x para.sh


    This command will add execute permission to the file.


    Remove permissions


    Syntax


    chmod -permssions filename


    Example


    # chmod -x para.sh


    You can also add or remove multiple permissions at the same time. Below is an
    example of this:


    # chmod +xw para.sh


    Removing permissions for group


    Syntax


    chmod g-permission filename


    Example


    # chmod g-xw para.sh


    Remove permission for others


    Syntax


    chmod o-permission filename


    Example


    # chmod o-xw para.sh


    Like that, you can add and remove permissions for groups and others at the same
    time.


    # chmod go-xw para.sh


    Change permissions using numeric values


    This is the most popular way to change permissions.


    Syntax


    chmod permissions filename


    Example


    # chmod 700 hello.txt'
