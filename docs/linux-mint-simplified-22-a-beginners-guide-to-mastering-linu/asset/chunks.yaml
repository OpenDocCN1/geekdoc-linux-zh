  trans: "\n\n一旦你选择了所需的选项，请点击“立即安装”。系统会要求你进行确认；选择“继续”。\n\n![](img/image_rsrc4BA.jpg)\n\
    \n### 时区和时间\n“你在何处？”屏幕的目的是帮助你选择时区。如果你连接了互联网，它将自动选择你的位置。否则，你需要在世界地图上点击你当前的位置。\n\
    \n### 设置用户账户\n在“你是谁”屏幕上，输入你的姓名、计算机名称、用户名和密码。你也可以选择自动登录，而无需每次都输入密码。按下“继续”。![](img/image_rsrc4BB.jpg)\n\
    \n### 安装 Linux Mint\nLinux Mint 将开始安装到你的系统中。根据你电脑的速度和磁盘的大小，此过程可能需要一些时间。\n\n![](img/image_rsrc4BC.jpg)\n\
    \n### 完成并重启\n安装完成后，系统将提示你重启电脑。请在提示出现时移除安装介质。\n\n![](img/image_rsrc4BD.jpg)![](img/image_rsrc4BE.jpg)\n\
    \n### 登录与配置\n重启后，你将看到 Linux Mint 登录界面。输入密码并登录你新安装的 Linux Mint。\n\n恭喜！你已在空白磁盘上成功安装了\
    \ Linux Mint，现在可以探索并使用你的新操作系统了。\n\n# 第 4 章：让我们探索桌面\n\nLinux Mint 是一个著名的 Linux\
    \ 发行版，以其用户友好的界面闻名，并强调为从 Windows 或 macOS 等操作系统切换过来的用户提供熟悉的桌面环境。这是 Linux Mint 桌面环境的概述。Linux\
    \ Mint 提供了多种桌面环境选项，每种都有独特的视觉效果和体验：\n\n*   **Cinnamon（肉桂）**：这是 Linux Mint 的旗舰桌面环境。它承诺提供一种现代且传统的桌面体验，具有任务栏、系统托盘和可自定义面板，类似于\
    \ MS Windows。\n*   **MATE**：Linux Mint 还提供了 MATE 桌面环境。它是著名的 GNOME 2 桌面环境的扩展，简单且高效。MATE\
    \ 适用于想要更传统的桌面布局或在旧旧硬件上运行的人群。\n*   **Xfce**：Xfce 侧于速度和效率，是一个轻量级桌面环境。对于想要在不牺牲自定义可能性的情况下获得简单桌面体验的人，或者对于较旧的\
    \ PC，它的效果非常好。\n\n在本章中，我们将探索 Linux Mint 的旗舰 Cinnamon 桌面环境。Cinnamon 最初为 Linux Mint\
    \ 创建的，是一个丝滑且直观的桌面环境，也可以安装在其他 Linux 发行版上。它旨在为从 Windows 或 macOS 等操作系统切换过来的用户提供舒适且高效的计算体验。以下是\
    \ Cinnamon 组件的详细说明：\n\n## Cinnamon 面板\n\n![](img/image_rsrc4BF.jpg)\n\n面板通常横跨屏幕底部，是\
    \ Cinnamon 主要界面组件。它由：\n\n*   菜单 (Menu)\n*   收藏 (Favourites)\n*   分组窗口列表 (Grouped\
    \ windows list)\n*   系统托盘 (System Tray)\n*   重要图标 (Important icons)\n*   角点栏 (Corner\
    \ bar)\n\n**菜单**：Mint 菜单位于任务栏左上角，提供了访问位置、应用程序、系统设置和会话选项。它允许对程序分类，并包含搜索功能以方便使用。\n\
    \n**收藏**：收藏菜单显示你常用并想要快速访问的程序选择。\n\n**分组窗口列表**：这是一个窗口列表小组件，设计类似于 Windows 7 任务栏（至少部分是）。一些重要方面包括：\n\
    \n*   **程序分组**：将每个程序的窗口分组到单个按钮中。\n*   **预览**：当悬停在按钮上时，菜单可以显示该按钮管理的所有窗口的预览。\n*\
    \   **固定程序**：将你喜欢的程序固定到工作区。\n*   **拖放**：你可以重新排列程序顺序。从菜单和面板启动器中释放。将 Cinnamon 菜单和面板启动器小组件中的菜单项拖到此小组件中，程序将被固定。\n\
    *   **右键菜单**：通过按钮的右键菜单可以使用多个操作。右键点击任何图标时会出现右键菜单。\n\n**系统托盘**：显示后台服务和系统通知的图标。\n\
    \n**重要图标**：栏右角有扬声器、网络、可移动设备、日期/日历、电池和蓝牙图标。点击这些任何图标即可打开其弹出窗口。声音图标允许你调整扬声器和麦克风音量。其他图标提供了调整网络和蓝牙设置的选项。\n\
    \n**角点栏**：角点栏用于显示桌面、桌面小组件、工作区选择器或窗口选择器。在角点栏上点击鼠标左键会最小化所有窗口并显示桌面，而右键点击则调出右键菜单。悬停在角点栏上（类似于\
    \ Windows 中）允许你快速“查看桌面”；你可以在角点栏设置中启用或禁用此功能。\n\n![](img/image_rsrc4BG.jpg)\n\n\
    ### 钟\n时钟位于栏的右侧，默认显示当前时间。当你悬停在上面时，它会显示日期和星期。右键点击提供了配置它的功能。\n\n## 理解菜单\n\n![](img/image_rsrc4BH.jpg)\n\
    \n### 所有应用程序\n显示 Linux Mint 计算机上安装的所有工具和应用程序，按字母顺序排列。\n\n### 类别\n菜单组织为多个类别，例如附件、图形、互联网、办公、声音和视频。点击类别将打开它以显示相关的程序和工具。\n\
    \n### 管理和偏好\n管理和偏好显示允许你配置和管理 Linux Mint 的工具和应用程序。\n\n### 位置\n位置菜单显示以下内容的快捷方式：\n\
    \n*   主目录 (Home)\n*   桌面\n*   文档\n*   音乐\n*   图片\n*   视频\n*   下载\n*   连接服务器\n\
    *   挂载设备\n\n位置菜单中每个项目的描述如下：\n\n*   **主目录**：主目录是包含用户个人文件和配置数据的目录。通常表示为 `~/` 或 `/home/username`，其中\
    \ `username` 是用户名。在你的主目录内（`/home/username/`），你会找到标准目录，如桌面、文档、图片、视频、音乐和默认保存下载文件的下载目录。\n\
    *   **连接服务器**：此对话框包含一个名为“类型”的下拉菜单。该菜单允许你选择要连接的服务器类型，包括：\n    *   `SSH`\n    *\
    \   `FTP`（文件传输协议）\n    *   `Windows 共享`\n    *   `自定义位置`：指定自定义 URI 连接其他类型的服务器。\n\
    *   **挂载设备**：当你连接或挂载设备时，它通常显示在这里，你可以访问并与这些挂载设备交互。\n*   **最近文件**：最近文件菜单自动显示最近访问或打开的文件。\n\
    \n### 搜索栏\n在顶部菜单上，你会找到搜索栏，允许用户通过输入关键字快速查找并启动应用程序。它还允许你在最近打开的文件列表中搜索文件。\n\nLinux\
    \ Mint 菜单中的搜索栏通过更易于查找和访问应用程序、设置以及在某些情况下文件来提高生产力。它是浏览系统的有效工具，特别是当安装程序和设置数量增加时。\n\
    \n收藏栏\n\n"
- fmt: '

    On the left side of the menu, you will notice a bar with favourite icons and System
    actions icons. By default, favourite icons include icons for the file manager,
    terminal, system settings, software manager, and web browser. However, you can
    add more icons of your choice by dragging and dropping.


    ## System Actions


    System Actions like logout, shutdown, and restart are also easily available through
    quick links in the favourite bar on the left side of the menu. Below is a description
    of each action.


    ### Log out or switch user


    ![](image_rsrc4BJ.jpg)

    Mint provides you option to share your computer with other users. To let other
    users use your computer, either you press `Logout` or `Switch user`. When you
    pick `Logout` all your running application will close, on the other hand when
    you press `Switch user` all your applications will continue running, and everything
    will be same when you log back.


    To `Logout` or `Switch user`, click button and then pick the option you want.


    ### Lock


    When you are away from your machine for a short period of time, it is recommended
    to lock your screen so nobody can use it in your absence. When the system screen
    is in a locked state, all the running applications will continue to run. To log
    back in, provide your login password to unlock the screen. The system also locks
    the screen automatically if you leave your computer for a specific time period.


    To lock the screen manually, click the click `Lock`![](image_rsrc4BK.jpg) button.
    You can also use a keyboard shortcut to lock, press the `Super + L` key. To unlock,
    press `ENTER` key on the locked screen and provide your password.


    ### Power off


    ![](image_rsrc4BM.jpg)

    To switch off your computer or to restart the whole computer, click the system
    menu on the left side of the menu, click `Power Off`![](image_rsrc4BN.jpg)button.
    A dialog box will open, Select the required button.


    ### Suspend


    In the case of laptops, Linux Mint automatically changes the system to suspend
    mode on closing the laptop lid. In the suspended mode, the system uses very little
    power to save energy. All your applications keep running in suspend mode, but
    the screen and other non-essential parts of the computer switch off to save power.
    To change the system to suspend mode manually, click the `Power Off` button and
    pick the `Suspend` option.


    ## Desktop


    In Linux Mint, the desktop area performs multiple vital roles, making it a central
    and customizable component of the user interface. Through the settings, users
    can change the desktop background to any number of pictures, solid colors, or
    slideshows. Users of Linux Mint can customize their experience by using themes
    that alter the panel, icons, window colors, desktop background, and more. It is
    possible for users to temporarily store files and quickly access apps and data
    by placing icons on the desktop.


    ![](image_rsrc4BP.jpg)


    ## Desklets


    Desklets are little programs, sometimes known as mini-applications, that are designed
    to carry out particular tasks or offer helpful data right on the desktop. They
    can be altered and configured to suit the preferences of the user and are similar
    to widgets or gadgets present in other operating systems. Some of the common desklets
    are:


    *   Clock

    *   Weather

    *   System Monitor

    *   Calendar

    *   News Feeds


    ## Working with windows


    Linux Mint uses windows to display your running applications. This is one of way
    to run multiple tasks at same time. Whenever you launch any application it opens
    in new window. In this section we will explore windows.


    ### Window Elements


    ![](image_rsrc4BR.jpg)


    **Title Bar**: The title bar, located at the top of the window, often displays
    the application''s name and has window management functions (minimize, maximize,
    close).


    **Menu Bar**: The menu bar contains application-specific menus (File, Edit, View,
    etc.) that allow you to access program functionalities.


    **Content Area**: The Content Area is where the application''s main content is
    shown and where you interact with it.


    **Status Bar**: Optional; displays information about the application''s current
    status or progress.


    ### Windows Management


    **Move**: To move a window around the desktop, click and drag its title bar.


    **Resizing**: To resize a window, click and drag its edges or corners.


    **Minimize, Maximize, and Close**: Use the title bar buttons to control the window''s
    visibility and behaviour.


    ![](image_rsrc4BS.jpg)Windows Selector view


    When you have multiple applications running in various windows and wish to view
    all of them in order to select the relevant application window, you can utilize
    the windows selector view. To open Windows Peek View, right-click on the corner
    bar and pick "Show the window selector(scale)" from the context menu.


    Click the desired application window to switch to that application. To close any
    running application window, hover over the window and click `X` button.


    ### Switch window


    ![](image_rsrc4BT.jpg)


    You can switch the windows using key board. Press `Alt + Tab` to open windows
    switcher. Keep holding the `Alt` key, release and press `Tab` key to cycle between
    open windows. `Shift-Alt-Tab` is another shortcut you can use to navigate backward
    in the focused windows'' history. Holding `Alt` and quickly pressing `Tab` allows
    you to use the left and right arrow keys to navigate in the desired direction.
    Using the scroll wheel while holding down the `Tab` key is a third technique.


    ### Tile Windows (Snap Windows)![](image_rsrc4BU.jpg)


    To copy files or to compare the content of two windows, you can place two windows
    side-by-side. In Microsoft Windows, this feature is known as Windows Snap. To
    snap the window to the left side, press `Super + left arrow` on selected window,
    and to snap the window to the right side of the screen, select the window, press
    `Super + right arrow` key on the keyboard. To snap a window using the mouse, grab
    the title of the window and drag it to the left or right side until half of the
    screen is highlighted.


    Settings![](image_rsrc4BV.jpg)


    Click on `Setting` icon in the Mint menu will open settings windows for system
    and hardware. The settings panel is organized into categories. You can scroll
    the list of settings with mouse’s scroll wheel. Suppose you want to change the
    background of your desktop. Click background and select the wallpaper from the
    list of available wallpapers. To return to the settings window after modifying
    the desktop, click the back button in the top bar.


    ![](image_rsrc4BW.jpg)Top bar of the system setting tool also houses search button.
    Search button offers you to search anything related to settings. For example,
    to set the date and time, simply type `date` into the search box. The system will
    show you list of items related to date.

