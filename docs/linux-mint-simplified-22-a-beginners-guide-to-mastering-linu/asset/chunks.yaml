    ## rm

    For the removal of files and directories, the `rm` command is an effective tool.
    It''s flexible, but you have to exercise caution when using options like `-r`
    for recursive removal and `-f` for forcible deletion.


    ### Remove file

    To delete (remove) a file or directory in Linux, use the `rm` command.


    ### Syntax

    ```bash

    rm filename

    ```


    ### Example

    ```bash

    rm biodata.txt

    ```


    ### Remove multiple files

    ### Syntax

    ```bash

    rm file1 file2 ...

    ```


    ### Example

    ```bash

    rm biodata.txt happy.txt

    ```


    ### Remove directories

    Use the `-r` flag to remove directories and their contents recursively.


    ### Syntax

    ```bash

    rm -r directory1 directory2

    ```


    ### Example

    ```bash

    rm -r dir1 dir2

    ```


    ### Force remove (Ignore confirmation prompts)

    Use the `-f` flag to override any confirmation prompts.


    ### Syntax

    ```bash

    rm -f file1 file2 ...

    ```


    ### Example

    ```bash

    rm -f file1.txt file2.txt

    ```


    ### Remove files recursively and forcefully

    Use this command with caution, as it will delete files and directories recursively
    without prompting.


    ### Syntax

    ```bash

    rm -rf directory

    ```


    ### Example

    ```bash

    rm -rf dir1

    ```


    ## touch

    The `touch` command is used to create new empty files or to change the timestamp
    on existing files.


    ### Create a new empty file

    ### Syntax

    ```bash

    touch filename

    ```


    ### Example

    ```bash

    touch file1.txt

    ```


    ### Update timestamp of an existing file

    ### Syntax

    ```bash

    touch filename

    ```


    ### Example

    ```bash

    touch myfile.txt

    ```


    ## Viewing and Editing Files

    Viewing and modifying files from the terminal is an essential ability in Linux.
    Here is a detailed overview to the various commands and tools available in practically
    all Linux flavors for viewing and editing files:


    ### Cat

    The `cat` command is used to view, concatenate, and create files. Its simplicity
    makes it perfect for swiftly reading file contents or consolidating multiple files
    into a single one.


    #### Display content of file.

    To display the contents of a file using `cat` command.


    ### Syntax

    ```bash

    cat filename

    ```


    ### Example

    ```bash

    cat example.txt

    ```


    #### View line number

    Appends line numbers to the output, which is useful for debugging or reviewing
    large files.


    ### Syntax

    ```bash

    cat -n filename

    ```


    ### Example

    ```bash

    cat –n example.txt

    ```


    #### Concatenate multiple files

    ### Syntax

    ```bash

    cat file1 file2

    ```


    ### Example

    ```bash

    cat example1.txt example2.txt

    ```

    Displays the contents of `example1.txt` followed by `example2.txt`.


    #### Redirect output to another file

    ### Syntax

    ```bash

    cat file1 > file2

    ```

    ### Example

    ```bash

    cat example1.txt > newfile.txt

    ```

    This command copies the contents of `example1.txt` to `newfile.txt`, overwriting
    `newfile.txt` if it already exists.


    #### Append output to another file

    ### Syntax

    ```bash

    cat file1 >> file2

    ```

    ### Example

    ```bash

    cat example1.txt >> newfile.txt

    ```

    This command appends the contents of `example1.txt` to `newfile.txt`.


    ### Less

    The `less` command allows you to view file contents page by page.


    ### Syntax

    ```bash

    less filename

    ```


    ### Example

    ```bash

    less example.txt

    ```

    Here are some basic navigation commands you can use in `less` command output:

    - **Scroll Down**: Use the Down Arrow key or `j` to navigate down one line at
    a time. To move down one page at a time, use `Space` or `F`.

    - **Scroll Up**: Use the Up Arrow key or `k` to advance one line at a time. Press
    `b` or `Page Up` to advance one page at a time.

    - **Forward Search**: hit `/`, then type your search word and hit Enter. Use `n`
    to go on the next occurrence of the search word.

    - **Search backwards**: hit `?`, input your search phrase, and then hit Enter.
    Use `N` to return to the previous occurrence of the search word.


    ### Head

    The `head` command displays the beginning of a file or input data. By default,
    it displays the first ten lines, but you can change this. It is handy for fast
    previewing the beginning of files or data streams.


    ### Syntax

    ```bash

    head filename

    ```


    ### Example

    ```bash

    head example.txt

    ```


    #### Specify the number of lines

    ```bash

    head –n 20 example.txt

    ```

    Shows the first 20 lines. Replace `20` with the desired number of lines.


    ### Tail

    The `tail` command displays the end of a file or data stream. It''s especially
    beneficial when monitoring logs or huge files and need to view the most recent
    items. By default, `tail` shows the last 10 lines of a file, but this can be customized.


    ### Syntax

    ```bash

    tail filename

    ```


    ### Example

    ```bash

    tail example.txt

    ```


    #### Specify the number of lines

    You can specify the number of lines of file to display with the `-n` option.


    ### Syntax

    ```bash

    tail –n <n> filename

    ```


    ### Example

    ```bash

    tail –n 20 example.txt

    ```

    Displays the last 20 lines of the `example.txt`.


    #### Real-time monitoring

    The `tail` command with the `-f` option continually outputs new lines added to
    the end of a file. This is useful for monitoring log files or other files where
    content is dynamically appended.


    ### Syntax

    ```bash

    tail –f filename

    ```


    ### Example

    ```bash

    tail –f example.txt

    ```


    Aside from these commands, Linux has a number of text editors for editing files,
    the most popular of which are `nano` and `vi`.


    In conclusion, Command-line tools are essential for examining files and directories
    in Linux because of their efficiency, flexibility, and power. They offer exact
    control over file management, allowing users to navigate, manipulate, and query
    files fast.


    ## Chapter 11

    ### Using sudo for Elevated Access

    The `sudo` (SuperUser DO) command allows you to access restricted files and operations.
    By default, Linux blocks access to certain system components in order to protect
    sensitive files. The `sudo` command allows you to run applications with another
    user''s security rights (by default, as the superuser). It asks for your personal
    password and confirms your command request by verifying a file called `sudoers`
    that the system administrator has configured. It is a method that allows you to
    delegate some administrative responsibilities to privileged users without providing
    the administrator''s password.


    The `sudo` command is critical for conducting administrative activities safely
    because it allows users to run commands with superuser capabilities. It ensures
    that certain commands are executed with elevated permissions, lowering the possibility
    of unintended system changes. `Sudo` logs all elevated commands, which ensures
    accountability and transparency. It streamlines system administration by allowing
    users to complete important operations without having to switch to the root account.
    Overall, `sudo` improves security and efficiency, making it an essential tool
    for Linux administration.


    Example of a privilege command that modifies system configuration:


    #### Install a package

    ```bash

    sudo apt install gzip

    ```


    #### Change hostname

    ```bash

    sudo hostnamectl set-hostname host2021

    ```


    #### Run command as different user

    To execute a command as a different user, use `sudo` with the `-u` argument. It
    enables you to run commands with privileges of another user account, which is
    useful for tasks that require certain user permissions without switching accounts
    completely.


    ### Syntax

    ```bash

    sudo -u user command

    ```


    ### Example

    ```bash

    sudo -u user2 hostnamectl

    ```


    #### Use sudo in interactive mode

    The `sudo` with the `-i` option opens an interactive shell with root privileges.
    It starts a new shell session as the root user, allowing you to execute administrative
    actions without having to prefix each one with `sudo`.


    ```bash

    sudo -i

    ```


    ### Example

    ![](image_rsrc4CM.jpg)


    ### Changing the sudo Configuration

    `sudo`''s configuration is saved in the `/etc/sudoers` file. The sudoers file
    is a useful tool for controlling administrative access. Properly configuring and
    managing it helps ensure that users have the appropriate level of access while
    maintaining system security. To change the sudo configuration, use the `visudo`
    command.


    ```bash

    sudo visudo

    ```

    It essentially launches the `vi` or `nano` editor and modifies the `/etc/sudoers`
    file. The `visudo` command must be run by a user with administrative rights.


    ```bash

    sudo visudo

    ```

    The `/etc/sudoers` file contains a list of users and the commands that they can
    execute.


    ```text

    user host=(users) [NOPASSWORD:]commands

    ```


