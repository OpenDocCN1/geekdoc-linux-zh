    \ 示例\n```\n# chown user2 example.sh\n```\n\n#### 修改文件或目录的组所有权\n你可以使用 `chown` 或\
    \ `chgrp` 命令更改文件或目录的组所有权。\n\n#### 语法\n```\nchown :group filename\n```\n#### 示例\n\
    ```\nsudo chown :data2 notes.txt\n```\n\n#### 使用 `chgrp`\n#### 语法\n```\nchgrp\
    \ group file/directory\n```\n#### 示例\n```\nsudo chgrp data2 notes.txt\n```\n\n\
    #### 同时更改文件的所有者和组\n你也可以同时更改文件的组和所有者。\n\n#### 语法\n```\nchown username:group filename\n\
    ```\n#### 示例\n```\nsudo chown shiv:data2\n```\n\n#### 递归更改所有权\n递归地更改目录及其文件的所有权。\n\
    \n#### 语法\n```\nchown -R user:group directory\n```\n\n## 权限\n权限定义了对文件或目录的操作允许。文件和目录拥有一组标准权限：读、写、执行。这些权限应用于所有者、组和其他用户。\n\
    \n#### 符号表示\n使用符号来设置权限。使用 `r`（读）、`w`（写）和 `x`（执行）。`-` 表示无权限。\n\n#### 语法\n```\n\
    chmod [用户类型][权限] filename\n```\n用户类型可以是：\n- `u`: 所有者 (owner)\n- `g`: 组 (group)\n\
    - `o`: 其他用户 (others)\n- `a`: 所有用户 (all)\n\n权限可以是：\n- `+`: 添加权限\n- `-`: 移除权限\n\
    - `=`: 设置精确权限\n\n#### 示例\n```\nchmod u+x filename\nchmod g+w filename\nchmod o-r\
    \ filename\nchmod u=rx filename\n```\n\n#### 数值表示\n使用八进制法（数字值）来设置权限。每个数字代表一个权限组合：\n\
    - 4：读 (r)\n- 2：写 (w)\n- 1：执行 (x)\n\n将这些数字相加即可得到权限值：\n- 0：无权限\n- 1：执行\n- 2：写\n\
    - 3：写+执行\n- 4：读\n- 5：读+执行\n- 6：读+写\n- 7：读+写+执行\n\n#### 语法\n```\nchmod 权限 filename\n\
    ```\n#### 示例\n```\nchmod 755 filename\nchmod 644 filename\n```\n\n"
