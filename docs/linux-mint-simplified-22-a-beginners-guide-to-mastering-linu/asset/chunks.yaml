  trans: '


    这将为用户授予所有权限，并移除其他人和组的所有权限。


    ## 用户文件创建模式掩码


    用户文件创建模式掩码（`umask`）变量决定了新创建的文件和目录的权限配置方式。`umask` 命令允许用户定义在新创建的文件或目录的基础权限值上，默认移除哪些权限。


    ### 检查 umask 值


    #### umask


    ```

    0022

    ```


    输出的第一位是粘滞位（sticky bit），其余数字代表数字权限。


    更改当前会话的 umask 值：


    #### umask 0044


    在设置 `umask` 时，你可以跳过粘滞位并输入三位的新值。


    ### 示例


    ### 确定净权限


    在应用 `umask` 确定有效权限后，从默认权限中减去 `umask` 值。以下是实现方法：


    - 默认值：系统的默认权限值为文件夹的 `777` (rwxrwxrwx)，文件为 `666` (rw-rw-rw-)。

    - Umask 值：确定当前的 `umask` 值。假设当前的 `umask` 值为 `002`。

    - 减法：现在从默认权限中减去 `umask` 值。


    ```

    777 – 002 = 775 (rwxrwxr-x)

    ```


    当你在命令行提示设置 `umask` 时，它只影响特定的 shell 会话，不会在重启或新的 shell 会话中持续。要永久设置值，可以全局设置或针对特定用户设置。要为所有用户永久强制系统级默认，请使用
    `/etc/profile` 文件；对于个人用户，更改 `~/.profile` 或 `~/.bashrc` 文件。


    ## 对象类型


    `ls -al` 输出的第一列显示对象类型。


    ![](img/image_rsrc4EH.jpg)


    对象类型列如下：


    | 代码 | 对象类型 |

    | – | : |

    | – | 普通文件 |

    | d | 目录 |

    | l | 符号链接 |

    | c | 字符设备 |

    | b | 块设备 |

    | p | 命名管道 (FIFO) |

    | s | 套接字 (socket) |


    ## ACL


    访问控制列表 (ACL) 提供了一种额外的、更灵活的权限机制。ACL 允许你对任何文件或目录上的任何用户或组授予权限。它扩展了传统的 Linux 文件权限，以便对文件和目录的访问提供更细粒度的控制。


    ACL 可以提供以下类型的权限：


    - 根据用户名或用户 ID 为特定用户提供的权限称为用户特定权限。

    - 根据组名或组 ID 为特定组指定的权限称为组特定权限。

    - 目录内新创建的文件和目录受默认权限的限制。


    要显示文件或目录的当前 ACL，我们使用 `getfacl` 命令。


    ### 语法


    ```

    getfacl file / directory

    ```


    ### 示例


    ```

    getfacl hosts

    ```


    可以使用 `setfacl` 和 `chmod` 命令来设置或修改文件或目录的 ACL。


    ### 语法


    ```

    setfacl [option] file_owner:file_permission filename

    ```


    其中选项为：


    | 选项 | 描述 |

    | :--- | :--- |

    | `-m, –modify` | 修改 ACL。 |

    | `-x, –remove` | 移除权限。 |

    | `-b, –remove-all` | 移除所有权限。 |

    | `-d, –default` | 将默认权限应用到新创建的文件和文件夹。 |

    | `-R, –recursive` | 递归地对所有文件和目录应用修改。 |


    ### 示例


    对特定文件设置用户权限。


    ```

    setfacl -m u:user1:rw acct.txt

    ```


    移除特定目录上的所有权限


    ```

    setfacl -x u:user1 acct.txt

    ```


    ## 结论


    本质上，文件权限允许用户控制谁可以访问其文件和目录，它们是 Linux 系统的重要组成部分。通过理解所有者、组和其他人员的读、写、执行权限概念，用户可以确保其数据的安全和隐私。除了保护敏感数据外，正确管理文件权限也有助于系统的稳定和完整。深入理解文件权限将使用户在遍历和交互文件系统时，能够维护系统安全并做出明智的选择。


    ## 结语


    在我们结束对 Linux Mint 的之旅时，我希望这本书阐明了这些强大且易于使用的特性，这些特性使得该发行版成为新手和老练用户的绝佳选择。你现在已经掌握了安装和配置的基础知识，以及高级定制和故障排除，这为你提供了充分利用
    Linux Mint 能力所需的工具。


    请记住，开源社区非常看重好奇心和协作。当你继续使用和探索 Linux Mint 时，不要害怕跳进论坛、参与辩论并分享你自己的经验。你面临的每一个问题都是学习和改进的机会。


    感谢你伴我完成这段旅程。愿你的 Linux Mint 之旅充满探索与效率。


    祝 Linux 愉快


    '
