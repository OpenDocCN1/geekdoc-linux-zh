    line or a graphical user interface (GUI), whichever is more convenient for you.


    Using GUI


    1.  Click the Menu button, select Administration, and then "Users and Groups".
    This will launch the User and Group Management tool. When prompted for authentication,
    provide your administrator password.


    2.  At the user tab. Click the Add button.


    3.  A dialog box will appear in which you can enter the information for the new
    user:


    ![](image_rsrc4D6.jpg)


    Account type: Select whether the user will be Standard or Administrator (with
    sudo rights).


    Full Name: User''s Name or Description


    Username: Fill in the preferred username for the new user.


    4.  Press the Add button.


    5.  Once added, the new user will appear in the list of users in the Users.


    Setting user password


    Once you''ve created a user, you should assign it a password.


    1.  Select the user whose password you want to change from the list of users.


    2.  Click on the “No password set”.


    ![](image_rsrc4D7.jpg)


    3.  ![](image_rsrc4D8.jpg)It will open a dialog box. Enter the new password for
    the user in the provided fields. Press the Change button.


    Using command line


    Using the useradd command and the desired username will allow you to create a
    new user.


    Syntax


    useradd -m user_name


    Here the -m flag creates a home directory for the user.


    Example


    sudo useradd -m user2


    Setting user password


    Run the passwd command to assign a password to the newly created user.


    Syntax


    passwd user_name


    Example


    sudo passwd user1


    Deleting users


    When a user is no longer required, you should remove them. Deleting a user in
    Linux Mint removes unnecessary access, improves security by eliminating potential
    dangers associated with inactive accounts, and optimizes system resources by freeing
    up storage and configuration space allotted to the user. Here''s how to do it
    in GUI and CLI mode:


    1.  Select the user you want to delete from the list of users


    2.  Click on the "Delete" button. Confirm the deletion when prompted.


    ![](image_rsrc4D9.jpg)


    Once confirmed, the user account will be removed from the system.


    Using CLI


    To delete a user from the system, you can use the userdel command:


    Syntax


    userdel user_name


    Example


    sudo userdel user1


    Listing users


    To list all defined users on the system


    Syntax


    cat /etc/passwd


    Example


    sudo cat /etc/passwd   


    Modify user properties


    To modify user settings (password, group membership, username, etc.) using the
    GUI.


    1.  Select the user you want to modify from the list of users.


    2.  You can alter a number of parameters in the right pane, including:


    Account type: Switch from Standard to Administrator or vice versa.


    Username: Change it if necessary.


    Password: Select the "Password" to modify the user''s password.


    Groups: Select or deselect groups by clicking on the "Groups" popup to manage
    group memberships. ![](image_rsrc4DA.jpg)


    3.  After making the necessary changes, click "OK"


    Using CLI


    To edit user characteristics such as username, home directory, shell, and so on,
    use the usermod command on the command line.


    Change username


    Syntax


    usermod -l new_user_name old_user_name


    Example


    sudo usermod -l myuser user1


    Lock user account


    Syntax


    usermod -L user_name  


    Example


    sudo usermod -L user1


    Unlock locked user


    Syntax


    usermod -U user_name  


    Example


    sudo usermod -U user1   


    Disable password expiration


    A clearly specified password expiration policy is an important aspect of system
    security. Setting a password expiration date ensures that passwords are updated
    on a regular basis, lowering the risk of unwanted access caused by compromised
    or expired credentials. In certain scenarios, you might need to disable or adjust
    automatic password expiration policies. This could be due to special operational
    needs, user convenience, or other corporate policies. To disable password expiration
    for the specified user:


    Syntax


    chage -M -1 user_name


    Example


    sudo chage -M -1 user1


    Change User ID (UID)


    Changing a user ID is sometimes necessary to resolve conflicts, reorganize system
    accounts, or align with organizational standards. To change userid of a user:


    Syntax


    usermod -u new_uid user_name


    Example


    sudo usermod -u 1091 user1


    Change home directory


    To change a user''s home directory in Linux, update the user''s account settings
    to point to the new location. This method is beneficial in a variety of situations,
    including moving user accounts, restructuring file storage, and renaming home
    directories. This is how you do it:


    Syntax


    usermod -d /path/to/new_home user_name


    Example


    sudo usermod -d /home/myhome user1


    This command changes the user''s home directory to /home/myhome.


    Change default shell


    The shell, or command-line interface, is an essential component of the Linux operating
    system, giving users a powerful means of interacting with the system. In Linux,
    changing a user''s default shell means modifying the shell specified for the user
    account. The default shell controls the command-line environment with which the
    user interacts when logging in. Here''s how you can change the user''s default
    shell:


    Syntax


    usermod -d -s /path/to/new_shell user_name


    Example


    sudo usermod -s /bin/csh user1


    This command changes the shell to c shell.


    Add user to additional groups


    By default, a user belongs to a primary group whose name is the same as their
    username. Using the -aG option with usermod, you can add a user to more groups.
    This allows users to access resources or perform actions associated with those
    groups


    Syntax


    usermod -aG group_name user_name


    Example


    sudo usermod -aG group2 user1


    Monitoring User Activity


    Monitoring user activity on a Linux system is critical for security, troubleshooting,
    and compliance reasons. You can monitor user behavior with a variety of methods
    and tools, including:


    System logs


    The system logs, placed in /var/log, include useful information about user activity,
    such as login/logout events, authentication attempts, and system events. The most
    important logs for user activity monitoring are:


    *   /var/log/auth.log: It keeps track of authentication-related events, such as
    successful and unsuccessful login attempts.


    *   /var/log/syslog, /var/log/messages: Contains general system activities, such
    as user login and logout events.


    You can filter and analyze log entries via tools such as grep, tail, and less.


    last command


    The last command shows a history of login sessions, together with the timings,
    durations, and terminal sessions of each login.


    Example'
