  trans: '


    在菜单的左侧，你会看到一个包含收藏图标和系统操作图标的条栏。默认情况下，收藏图标包括文件管理器、终端、系统设置、软件管理器和网络浏览器。不过，你可以通过拖放操作来添加更多你喜的图标。


    ## 系统操作


    注销、关机和重启等系统操作也可以通过菜单左侧收藏栏中的快速链接轻松访问。以下是每个操作的说明。


    ### 注销或切换用户


    ![](img/image_rsrc4BJ.jpg)

    Mint 为你提供了与其他用户共享计算机的选项。要让其他用户使用你的电脑，你可以按下 `Logout`（注销）或 `Switch user`（切换用户）。当你选择
    `Logout` 时，所有正在运行的应用程序将关闭；相反，当你按下 `Switch user` 时，所有的应用程序将继续运行，当你重新登录时一切都会如初初。


    要执行 `Logout` 或 `Switch user`，请点击按钮然后选择你所需的选项。


    ### 锁定


    当你离开电脑一段时间时，建议锁定屏幕，以免别人在你不在时使用它。当系统屏幕处于锁定状态时，所有运行的程序将继续运行。要重新登录，请提供登录密码以解锁屏幕。如果你离开电脑特定段时间，系统也会自动锁定屏幕。


    要手动锁定屏幕，点击 `Lock`（锁定）![](img/image_rsrc4BK.jpg）按钮。你也可以使用键盘快捷键进行锁定，按下 `Super +
    L` 键。要解锁，在锁定屏幕上按下 `ENTER` 键并提供密码。


    ### 关机


    ![](image_rsrc4BM.jpg)

    要关闭电脑或重启整个电脑，请点击菜单左侧的系统菜单，点击 `Power Off`（关机）![](img/image_rsrc4BN.jpg）按钮。弹出对话框后选择所需的按钮。


    ### 挂起


    对于笔记本电脑，Linux Mint 在合盖时会自动将系统切换到挂起模式。在挂起模式下，系统使用极少的功率来节省能量。所有的应用程序在挂起模式下保持运行，但屏幕和电脑的其他其他部分将关闭以节省电源。要手动将系统切换到挂起模式，点击
    `Power Off` 按钮选择 `Suspend`（挂起）选项。


    ## 桌面


    在 Linux Mint 中，桌面区域承担着多项重要角色，使其成为用户界面一个核心且可定制的组件。通过设置，用户可以将桌面背景更改为任意数量的、纯色或幻灯片。Linux
    Mint 用户可以使用主题来定制他们的体验，这些主题可以更改面板、图标、窗口颜色、桌面背景等。用户还可以通过在桌面上放置图标来临时存储文件并快速访问应用和数据。


    ![](image_rsrc4BP.jpg)


    ## 桌面组件 (Desklets)


    桌面组件是小程序（有时被称为微应用程序），设计用于直接在桌面执行特定任务或提供有用数据。它们可以根据用户的喜好进行更改和配置，类似于其他操作系统中的部件（widgets）或插件。一些常见的桌面组件包括：


    *   时钟

    *   天气

    *   系统监控

    *   日历

    *   新闻订阅


    ## 窗口操作


    Linux Mint 使用窗口来显示你运行的应用程序。这是同时运行多个任务的方法之一。每当你启动任何应用程序时，它都会在新窗口中打开。在本节中，我们将探索窗口。


    ### 窗口元素


    ![](img/image_rsrc4BR.jpg)


    **标题栏**：标题栏位于窗口顶部，通常显示应用程序名称，并具有窗口管理功能（最小化、最大化、关闭）。


    **菜单栏**：菜单栏包含特定应用程序的菜单（文件、编辑、视图等），允许你访问程序功能。


    **内容区域**：内容区域是显示应用程序主要内容以及你与之交互的地方。


    **状态栏**：可选；显示有关应用程序当前状态或进度的信息。


    ### 窗口管理


    **移动**：要在桌面上移动窗口，请点击并拖动其标题栏。


    **调整大小**：要调整窗口大小，请点击并拖动其边缘或角部。


    **最小化、最大化和关闭**：使用标题栏按钮控制窗口的可见性和行为。


    ![](img/image_rsrc4BS.jpg)窗口选择器视图


    当你有多个应用程序在不同的窗口中运行，并希望按顺序查看所有窗口以选择相关的窗口时，你可以利用窗口选择器视图。要打开窗口预览（Windows Peek View），在角栏右键点击，从键菜单中选择“显示窗口选择器（缩放）”。


    点击所需的应用程序窗口切换到该应用程序。要关闭任何运行的应用程序窗口，将鼠标悬停在窗口上并点击 `X` 按钮。


    ### 切换窗口


    ![](img/image_rsrc4BT.jpg)


    你可以使用键盘切换窗口。按下 `Alt + Tab` 打开窗口切换器。按住 `Alt` 键，释放并按下 `Tab` 键可以在打开的窗口之间循环。`Shift-Alt-Tab`
    是你可以使用的另一个快捷键，用于在焦点窗口的历史中后导航。按住 `Alt` 并快速按下 `Tab` 允许你使用左右箭头键按所需的方向导航。按住 `Tab`
    键的同时使用滚轮是第三种技巧。


    ### 贴靠窗口（分屏）！[](image_rsrc4BU.jpg)


    为了复制文件或比较两个窗口的内容，你可以将两个窗口并排。在 Microsoft Windows 中，此功能被称为 Windows Snap。要将窗口贴靠到左侧，在选定窗口上按下
    `Super + 左方向键`；要将窗口贴靠到屏幕右侧，选择该窗口，在键盘上按下 `Super + 右方向键`。要使用鼠标贴靠窗口，按住窗口标题将其拖动到左侧或右侧，直到半屏幕高亮。


    设置![](img/image_rsrc4BV.jpg)


    点击 Mint 菜单中的 `Setting` 图标将打开系统和硬件的设置窗口。设置面板按类别组织。你可以使用鼠标滚轮滚动设置列表。假设你想更改桌面背景。点击背景并从可用壁纸列表中选择壁纸。在修改桌面后返回设置窗口，点击顶栏中的返回按钮。


    ![](img/image_rsrc4BW.jpg)系统设置工具的顶栏还包含搜索按钮。搜索按钮允许你搜索与设置相关的任何内容。例如，要设置日期时间，只需在搜索框中输入
    `date`。系统将向你显示与日期相关的项目列表。


