    # Configuring repositories using CLI


    Apt (Advanced Package Tool) is a robust command-line tool for managing packages
    and repositories in Linux Mint and other Debian-based distributions. Repositories
    are servers that hold packages and updates for your system. Apt saves a list of
    repositories or software channels in `/etc/apt/sources.list` and any files with
    the suffix `.list` under the directory `/etc/apt/sources.list.d`. These files
    can be manually edited from the command line to add, remove, or temporarily disable
    software repositories. It is recommended that you keep a backup of the file before
    altering it.


    To store a backup copy of the original file:


    ```

    sudo cp /etc/apt/sources.list.d/official-package-repositories.list /etc/apt/sources.list.d/official-package-repositories.list.backup

    ```


    Here is the example :


    ![](image_rsrc4D3.jpg)


    ## Description of the file


    - All the lines beginning with hash (`#`) are comments

    - `deb`: These repositories hold binaries or precompiled packages. Most users
    require access to these repositories.

    - `deb-src`: repositories include the packages'' source code. Useful for developers.

    - `http://packages.linuxmint.com`: The URI (Uniform Resource Identifier) or location.

    - `main upstream import backport`: the section names or components.


    ## Adding Repositories


    You can add additional repositories by creating a file with the extension `.list`
    in the `/etc/apt/sources.list.d` directory using the same format as described
    in the previous section.


    After defining a new repository, refresh the package cache with the following
    command:


    ```

    sudo apt update

    ```


    ## Using add-apt-repository command


    APT repositories can be added with the Python program `add-apt-repository`. You
    can also use the command to remove an existing repository.


    ```

    sudo add-apt-repository ppa:fossfreedom/arc-gtk-theme-daily

    ```


    ## Refresh cache


    ```

    sudo apt update

    ```


    This configuration of repositories gives you access to a greater selection of
    updates and software packages for your Linux Mint system. When adding third-party
    repositories, exercise caution though, as these can contain packages that haven''t
    been thoroughly examined by the Linux Mint maintainers.


    # Chapter 14: Install New Fonts


    Adding fonts to a Linux system can substantially improve the appearance and usefulness
    of your desktop environment. Fonts are important not just for visual appeal, but
    also for readability and compatibility with different languages and scripts. Whether
    you''re a graphic designer, developer, or simply someone who appreciates a well-designed
    user interface, having a varied font selection allows for greater customization
    and personalization. Installing additional typefaces can enhance document display,
    web design, and user experience, making your system more adaptable and adapted
    to your individual requirements. Here''s a basic overview of how to add fonts
    to your Linux system.


    ## Using the software manager to install fonts


    ![](image_rsrc4D4.jpg)


    From the main menu, select Software Manager. Use the search option to locate fonts
    by name, or go through categories such as "Fonts." Click the "Install" button
    after selecting the font package you wish to install.


    ![](image_rsrc4D5.jpg)


    ## Manual Installation


    If you have font files (usually `.ttf`, `.otf`, or other formats), you can install
    them manually. First, open the terminal and then copy the downloaded font files
    into one of the system font directories.


    - For system-wide installation, copy the files `/usr/share/fonts/` directory,
    as it requires administrator permissions, you will need to use the `sudo` prefix
    command.

    - For user-specific installation, copy the font files to the user''s home directory
    (`~/.local/share/fonts/` or `~/.fonts/`). If the directory does not exist, create
    it first.


    ```

    user1@Mint:~/.local/share/fonts$ cp ~/Downloads/Rostack.otf .

    ```


    After copying, update the font cache using the following command.


    ```

    fc-cache -fv

    ```


    ## Conclusion


    In this chapter, we learned how to install new fonts on a Linux system, which
    enhances visual appeal, readability, and overall functionality. By adding fonts,
    you can improve document appearance and personalize the user experience to better
    fit your requirements.


    # Chapter 15: Managing Users


    In Unix-like operating systems, such as Linux Mint, users and groups are basic
    concepts. They are critical to the system''s management of resource allocation,
    permissions, and access control.


    User and group management refers to the activities and procedures involved in
    setting up, configuring, managing, and monitoring user accounts and groups on
    a computer. This method is critical for limiting access to resources, guaranteeing
    security, and enabling collaboration. Here is a summary of user and group management:


    ## User Management


    - **Account creation**: creating new user accounts on the system.

    - **Account configuration**: defining user attributes such as username, user ID
    (`UID`), home directory, login shell, and password.

    - **Password management**: creating, modifying, and enforcing password restrictions
    for user accounts.

    - **User privileges**: granting users suitable privileges, such as administrative
    (root) access or limited access to resources.

    - **User deletion**: the process of removing user accounts that are no longer
    required.

    - **User Authentication**: implementing authentication measures to check users''
    identities during login.


    ## Group Management


    - **Group creation**: creating new groups to organize users and control their
    access to resources.

    - **Group configuration**: configuring group properties such as group name and
    ID.

    - **Group membership**: adding or deleting users from groups for controlling access
    permissions.

    - **Group ownership**: assigning group ownership to files and directories.

    - **Special groups**: managing special-purpose groups with unique privileges and
    permissions.


    ## Access Control


    - **Permission assignment**: granting read, write, and execute permissions to
    users and groups on files, directories, and other system resources.

    - **File System permissions**: managing file system permissions to limit access
    to sensitive data and system files.

    - **Effective permissions**: identifying users'' effective permissions based on
    individual permissions and group memberships.


    ## Monitoring & Auditing


    - **User activity monitoring**: monitoring user login sessions, commands executed,
    and resource access for security and auditing.

    - **Logging**: keeping track of user and group activity for troubleshooting, compliance,
    and forensic analysis.

    - **Enforcing Security rules**: implementing security rules and best practices
    for user authentication, password management, and access control.

    - **Enforcing Resource limitations**: creating quotas and limitations for users
    and groups to avoid abuse and ensure equitable resource distribution.

