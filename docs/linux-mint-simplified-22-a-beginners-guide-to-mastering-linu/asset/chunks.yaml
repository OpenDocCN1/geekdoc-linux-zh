    Click the file manager icon in the panel or on the left favourite bar of the Mint
    menu. Alternatively, you can find it in the mint menu by searching for "files."
    By default, `Nemo` opens in your home directory (`/home/username`).


    # Understanding the Nemo UI


    Understanding the Nemo UI will help you navigate and manage files more effectively.
    Below are the some of the main components of `Nemo` File manager:


    * Toolbar

    * Side Bar

    * Main Area

    * Context Menu

    * Status Bar

    * Tabs (Optional)


    ![](image_rsrc4C6.jpg)


    ## Toolbar


    * **Back/Forward Buttons**: Navigate backward or forward through previously visited
    directories.

    * **Up Button**: The `Up Button` moves you up one level in the directory hierarchy.

    * **Location Bar**: The location bar shows the current directory path and is situated
    beneath the toolbar. To quickly navigate to parent directories or any other directory
    along the path, just click on any portion of the path. The toggle location button,
    which is located next to the location bar, allows you to manually enter or modify
    the location.

    * **Location Toggle button**: The `Location Toggle button` allows users to switch
    between two options for displaying the path or location bar in the file manager
    window: an editable file path or a clickable breadcrumb trail.

    * **Search Bar**: The system will open the search bar when you click the search
    button. enables name-based file and folder searches.

    * **View Options**: Change the layout (icons, list, compact) and sorting options.


    ## Side Bar


    `Nemo`''s sidebar offers quick access to frequently used devices and folders.
    The following elements are included in the sidebar:


    * **Places**: Offers quick access to your Desktop, Documents, Downloads, Music,
    Images, Videos, and more.

    * **Devices**: Displays the external attached storage devices, such as USB drives
    and hard drives.

    * **Network**: Offers access to linked servers and network locations.

    * **Recent**: Shows directories and files that have recently been accessed.

    * **Trash**: Use this shortcut to view and handle files that have been deleted.

    * **File systems**: The root directory and other locations are normally accessible
    through the "File Systems" section.


    ## Main Area


    The main area is the central region of the file manager window that displays the
    contents of the current directory. This section is essential for browsing, organizing,
    and interacting with files and folders. Files and folders can be displayed in
    icon/grid, list view, or compact view.


    * **Icon/Grid View**: Shows files and folders as icons or thumbnails.

    * **List View**: Provides a comprehensive list format of files and folders with
    columns for name, size, type, and modification date.

    * **Compact View**: provides a more compact layout than the list view and normal
    icons/grid view.


    ## Context Menu


    A context menu, also called a right-click menu, is a user interface element that
    appears when a user right-clicks on an item. It displays a list of actions or
    commands connected to the specified object or location, giving you easy access
    to frequently used functions.


    A context menu including the following options appears when you right-click on
    a file or folder in the file manager:


    * **Open**: This command opens a file or folder.

    * **Cut/Copy/Paste**: Move and duplicate files and folders.

    * **Rename**: Modifies the name of the specified file or folder.

    * **Delete**: Sends the file or folder to the `Trash`.

    * **Properties**: Displays detailed information about a file or folder, such as
    permissions and metadata.

    * **Other Options**: Shows additional options based on the content that is right-clicked,
    such as compress, open terminal, create new folder, create document, etc.


    ## Tabs


    `Nemo` (File manager) supports tabbed navigation, which means you can browse numerous
    directories in independent tabs within the same window. This capability allows
    users to navigate between directories without launching additional file manager
    windows.


    ## Status Bar


    The status bar at the bottom of the `Nemo` window displays information about the
    selected files and folders.


    * Displays the total number of files and folders in the current directory.

    * Displays the overall size of the selected files as well as the available disk
    space.

    * **Side bar view options**: Provides controls for changing the side bar view
    to tree view, places view, or show/hide side bar.

    * **Zoom Bar**: Provides a scroll bar for adjusting the zoon level of the main
    area.


    # Basic Operations with Nemo


    ### Opening file or folder


    When you double-click on a file, it opens in the default program for that file
    type. Double-clicking or using the `Enter` key (on the selected file) will allow
    you to open the folder and view its contents.


    ### Select file or folder


    Simply clicking on any file or folder allows you to select it. Hold down the `Ctrl`
    key on your keyboard to select multiple files or directories.


    ### Copying and Moving Files


    There are multiple ways to copy/move files.


    #### Using Context Menu


    Select the file(s) or folder(s), then right-click and choose "Copy" or "Move"
    from the context menu. Navigate to the destination folder, then right-click and
    select "Paste".


    #### Copy using keyboard


    1. Select the file or folder you want copy.

    2. Press the `Ctrl + C` keys simultaneously.

    3. Navigate to the desired location.

    4. To paste, press the `Ctrl + V` keyboard shortcut.


    #### Move using keyboard


    1. Select the file or folder you want move.

    2. Press the `Ctrl + X` keys simultaneously.

    3. Navigate to the desired location.

    4. To paste, press the `Ctrl + V` keyboard shortcut.


    #### Drag and drop to copy or move files


    To copy a file from one source to another using drag and drop use following procedure:


    1. Navigate to the folder containing the file you want to copy (source folder).

    2. Navigate to the target folder where you wish to copy the file by opening a
    new window.

    3. Position both windows side by side.

    4. Go to the source window.

    5. Click and hold the left mouse button while pressing the `Ctrl` key on the file
    or folder you wish to copy. Drag it to the target window, then release both buttons.


    ![](image_rsrcC7.jpg)


    ### Rename a file or folder


    To change the name of a file or folder, right-click the folder and select Rename
    from the context menu. Rename the file or folder using the keyboard; select the
    file or folder and press the `F2` key. Write the new name of the file or folder
    and press `Enter`.


    ![](image_rsrcC8.jpg)


    ### Delete


    If the file or folder is no longer required, you can delete it. Select the file
    or folder to delete. Right click on the mouse and select Move to Trash from the
    context menu. Or press `Delete` key from the keyboard. The files will be moved
    to the trash. If you accidentally delete a file or folder, it can be easily restored
    from the `Trash`.


    #### Restoring a file from the Trash


    Restoring a file from the trash is a simple operation. Click the `Trash` icon
    on your desktop or in the file manager''s sidebar. Go through the `Trash` to find
    the file or folder you wish to restore. Right-click the file or folder and then
    pick Restore from the context menu.


    #### Empty Trash


    To reclaim the space used by deleted files:


    1. Right click on the trash icon on the Sidebar.

    2. Select Empty Trash from the context menu.

    3. Press Empty Trash on the confirmation popup.


    To permanently delete the file without moving it to the trash:


    1. Select the file or folder you want to delete.

    2. On your keyboard, hold down the `Shift` key while pressing the `Delete` key.


    It will prompt for confirmation. Press the `Delete` button. ![](image_rsrcC9.jpg)


    # Sorting and Viewing Options


    The file manager displays files and folders in icon view by default. To switch
    from icon view to list view or compact view, use the view buttons on the file
    manager''s Tool bar. You can also use the keyboard commands `Ctrl + 1` to go to
    icon view, `Ctrl + 2` for list view, and `Ctrl + 3` to get to compact view.


    To sort the list of files and folders:


    1. Toggle the view to a list view.

