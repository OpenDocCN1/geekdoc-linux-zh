    `sudo` 命令对于管理 Linux Mint 中的系统权限至关重要，因为它提供了一种安全手段来执行管理任务，而无需赋予长时间的 root 权限。`sudo`
    通过允许用户精确控制其可以使用提升权限运行的命令，从而了安全性和可追溯性。通过 `sudoers` 文件进行设置可以确保权限得到适当的维护和记录。有效的系统管理需要熟练掌握
    `sudo`，以确保活动安全、高效地完成。总的来说，`sudo` 是安全且高效的 Linux 管理的关键组件。


    # 第 12 章：包管理


    包管理是一系列 Linux 实用的集合，用于从基于 Linux 的操作系统中安装、更新、配置和卸载软件包。这些工具帮助用户和管理员高效地管理其计算机上的软件生态系统。大多数包管理工具都能帮助解决依赖问题。软件依赖是软件包为了正常运行而所需的其他软件组件或库。不仅如此，包管理工具还在以下方面提供帮助：


    - **依赖关系跟踪**：包管理技术维护依赖数据库，帮助您在安装、更新或卸载包时快速解决依赖关系。

    - **版本兼容性**：管理包与依赖之间的版本兼容性。

    - **冲突解决**：解决当多个包请求同一依赖的不同版本时可能出现的任何冲突。

    - **依赖移除**：当您删除一个包时，包管理程序会确定是否有其他包依赖于它。如果没有，它将删除该包以及任何不再需要的依赖。


    ### 包管理系统示例：


    - `APT` 和 `DPKG` 用于基于 Debian 的发行版，如 Ubuntu、Linux Mint、MX Linux 等，使用 `deb` 扩展名包。

    - `RPM` 和 `YUM/DNF` 用于基于 Red Hat 的发行版，如 Fedora、CentOS 和 Oracle Linux。它采用 `.rpm`
    包。

    - `Pacman` 用于 Arch Linux 及其衍生版本。

    - `Portage` 是 Gentoo Linux 的包管理系统。它采用基于源码的包管理方法。

    - `ZYpp` 是 SUSE Linux 发行版（包括 openSUSE 和 SUSE Linux Enterprise）使用的包管理库。


    这些包管理解决方案支持的功能、能力和 Linux 发行版可能有所不同，但它们的共同目标是简化 Linux 机器上软件包的处理。


    ## 高级包工具


    `APT` 是 Linux Mint 以及其他基于 Debian 变体版本的包管理器。它是系统上安装、升级和管理软件包的极其实用的应用程序。`APT` 允许用户轻松地从
    Linux Mint 仓库安装软件，这些仓库是由 Linux Mint、Ubuntu 和 Debian 社区管理的海量软件包集合。`APT` 还管理包依赖关系，确保在安装新应用程序时安装所有所需的组件。`APT`
    使用 `.deb` 文件作为包格式。`APT` 数据库通常位于 `/var/lib/apt/`。仓库定义在 `/etc/apt/sources.list`
    和 `/etc/apt/sources.list.d/` 中。


    以下是 `APT` 主要功能和方面的简要摘要：


    - **包管理**：`APT` 命令行界面允许用户通过简单的命令安装、卸载和更新包。

    - **仓库**：`APT` 默认配置访问 Linux Mint、Ubuntu 和 Debian，允许用户简单地从官方仓库安装包。也可以使用自定义仓库。

    - **依赖解析**：`APT` 包含一种复杂的机制，用于在安装或删除包时自动处理依赖关系。

    - **事务安全**：`APT` 提供了一种强大的事务机制，有助于防止系统损坏，并确保包的安装和升级是可靠安全的。

    - **配置文件**：`APT` 使用直观的系统来管理配置文件，在进行包升级的同时保留之前进行过的任何调整。


    ## 包扩展


    Linux Mint 中的包文件通常具有 `.deb` 扩展名。该扩展名表示该包是基于 Debian 的包。Debian 软件包经常保存在仓库中，这些是在线或
    CD-ROM 等物理介质上找到软件包集合。通常，包以预编译的二进制格式提供，这使得安装变得简单并消除了编译任何软件的需求。一个 `.deb` 文件通常包含：


    - **控制文件**：包的名称、版本、依赖、维护者详情和安装脚本都在 `control` 和 `md5sums` 文件中描述。

    - **数据存档**：存放要安装到系统上的实际文件，例如配置文件、库、二进制文件以及包所需的任何其他资源。


    ## 仓库


    仓库是 Linux 软件的集合，可能存在于本地或远程。仓库可安装新软件或更新现有应用程序。仓库的列表和位置可以在 `/etc/apt/sources.list`
    文件中找到，也可以在 `/etc/apt/sources.list.d` 目录中创建。要添加仓库，请向 `/etc/apt/sources.list` 添加条目；每行一个源。


    ### 示例


    ```

    deb http://packages.linuxmint.com virginia main upstream import backport #id:linuxmint_main

    deb http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse

    deb http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse

    deb http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe
    multiverse

    ```


    `/etc/apt/sources.list.d`


    要添加新仓库，请 `/etc/apt/sources.list.d` 目录下创建文件。`/etc/apt/sources.list.d` 中文件的格式与 `sources.list`
    文件相同，且文件名必须以 `.list` 结尾。


    ## Flatpak


    有时，需要安装 `deb` 格式不可提供的额外软件以满足特定的需求和要求。这时 Flatpak 的通用包结构就派上用场了，让 Linux 上安装和使用应用程序变得简单。通过使用跨发行版的框架
    Flatpak，开发者可以将程序及其依赖项打包在一起，以便在许多 Linux 发行版上安装和使用。


    它也被称为“Linux 应用沙箱”，因为它为程序的运行创建了一个安全且隔离的环境，类似于虚拟化但没有完整虚拟机的开销。Linux Mint 支持 Flatpak，这使得能够访问传统仓库中不可提供的广泛应用程序。


    ## FlatHub


    Flathub 是 Flatpak 应用程序的关键仓库，提供了一个集中平台，用于访问 Linux 发行版的多种软件。它通过在不同系统上提供一致的界面来简化应用程序的安装。这是一个开发者可以在其中上传程序并供全球用户使用的仓库。您可以使用命令行工具或图形用户界面从
    Flathub 浏览并安装应用。


    '
- fmt: '

    # Launch Software Manager


    Select the Mint Menu button. Choose the Software Manager icon from the favourites
    on the left side of the menu. ![](image_rsrc4CN.jpg)


    ## Interface


    There are three parts to the interface. At the top, there is a search bar where
    you can search for any package to install or uninstall. The second part displays
    the featured program, which you can install by clicking on any of them. The third
    section presents software categories.


    ![](image_rsrc4CP.jpg)


    ## Install Software


    ### Search and install


    Another option for installing software is to search for it by name. Let''s say
    you want to install VLC Player on your computer. This is a well-known music and
    video player. The procedure to search and install is:-


    1. Write `VLC` in the search bar.

    2. From the list of available software, Click the software to install. In our
    example, it is `VLC`.

    3. On the software description screen, press `Install`.

    4. Provide your password and press `Authenticate` on the authentication screen.

    5. The installation process will start. The progress bar will display the installation
    progress.


    ### Install through the category


    In the category area, applications are classified depending on their functionality.
    You can click on any category to explore the list of available software. Suppose
    you click on "Graphics". It will show all software related to painting, drawing,
    and photography.


    1. ![](image_rsrc4CR.jpg)Click the required software from the list.

    2. Some software offers both `Flathub` and `deb` packages; you can select the
    package type from the source dropdown menu.

    3. Press `Install` on the software description screen.

    4. On the Authentication screen, provide your password and press `Authenticate`.

    5. The progress bar will show the percentage of completion.


    ## Remove installed software


    At some point in time, you may need to delete the installed application to free
    up space on the disk. To remove the installed application:


    1. In the search bar, type the name of the software you want to remove. For example,
    you want to remove `VLC`, which you installed in the earlier segment. Write `VLC`
    in the search bar. From the list, look for the required software name. Installed
    software is marked by a small green tick in the upper right corner.![](image_rsrc4CS.jpg)

    2. Click the installed software.

    3. Click the `Remove` button on the software description screen.![](image_rsrc4CT.jpg)

    4. This process requires authentication. Provide your password and press `Authenticate`.
    The removal process will start. On completion of the removal process, the remove
    button will be converted to an install button on the application description screen.


    ## Sudo


    When you perform commands that require administrative privileges (root access)
    on Linux, you normally use the `sudo` command or switch to the root user. Sudo
    command is useful for performing tasks that require administrative rights, such
    as installing software or modifying system configurations. When you use `sudo`,
    you’ll be prompted for your user password. This is the same password you use to
    log in to your Linux system.


    In the next section, we will explore command-line utilities for software management.
    As it changes the whole system, we will need to add the `sudo` command as a prefix
    to most of these commands. Here is an example of how to use the `sudo` command:


    ```bash

    sudo apt install package1.deb

    ```


    # Package Management via Command Line


    The `apt` (Advanced Package Tool) command-line software is a robust package management
    tool for Debian-based Linux distributions, such as Linux Mint. It streamlines
    processes such as package installation, updates, and system maintenance. Here''s
    a comprehensive look at several elements of software management with `apt`.


    ## Update


    ### Update package database


    The `update` option of `apt` refreshes the local package index by retrieving the
    most recent information from defined repositories. This ensures that your system
    is updated with the most recent package versions.


    ```bash

    sudo apt update

    ```


    ### Upgrade installed packages


    After refreshing the package index, this command analyses your system for outdated
    packages and installs newer versions of those packages. It just upgrades existing
    packages and does not install or remove them.


    ```bash

    sudo apt upgrade

    ```


    ### Comprehensive upgrade


    To update the system to the most recent versions of the packages and to intelligently
    manage the changing dependencies, we utilize the `dist-upgrade` option. In order
    to meet new dependencies, it might install new packages and uninstall old ones.


    ```bash

    sudo apt dist-upgrade

    ```


    ## Querying packages


    The `apt` command offers thorough information about both software available for
    installation and software that has already been installed. It also allows users
    to search for specific packages, read their details, and track their current status.


    ### Search for packages


    The `search` option searches the repositories for packages that match the provided
    package name. It shows both the installed and available packages.


    Syntax

    ```bash

    apt search package_name

    ```


    Example

    ```bash

    sudo apt search foo

    ```


    ### List all packages


    To list all packages, you can use the `list` option of the `apt` command.


    ```bash

    sudo apt list

    ```


    ### List installed packages


    To list all installed packages, use the `list` option of the `apt` command with
    the `--installed` argument.


    ```bash

    sudo apt list --installed

    ```


    ### Displays detailed information


    To display detailed information about a specific package. It reveals essential
    details such as the package''s version, description, dependencies, and maintainer.
    This command is useful for understanding what a package does and checking its
    attributes before installation or management.


    Syntax

    ```bash

    apt show package_name

    ```


    Example

    ```bash

    apt show libreoffice

    ```


    ### Searches for packages that provide a specific file or command


    Syntax

    ```bash

    aptfile search/find command/file_name

    ```


    Example

    ```bash

    sudo aptfile update

    sudo aptfile search bin/vim

    ```


    ## Installing packages


    ### Installs a package and its dependencies


    To install the packages on Linux Mint, use `apt` with the `install` option and
    specify the package name from the repositories. You can install multiple packages
    by listing them one after the other.


    Syntax

    ```bash

    apt install package_name

    ```


    Example

    ```bash

    sudo apt install vim

    ```


    ### Install the downloaded debian package


    You can use the `dpkg` command to install a Linux Mint package that you have downloaded.
    This is a detailed how-to:


    1. Go to the directory: Open a terminal and go to the location where your downloaded
    package file.

    ```bash

    cd ~/Downloads

    ```

    2. Install the package: Run the `dpkg` command with the `-i` flag to install the
    downloaded package. Replace `PackageName.deb` with the full name of your package
    file.

    ```bash

    sudo dpkg –i foo.deb

    ```

    If the package requires dependencies that are not already installed, it will prompt
    you to confirm their installation. Enter Password (if prompted).


    ## Removing packages


    When a package is no longer required and must be removed. the following commands
    removes the specified package from the system.


    ### Removes a package


    Remove the given packages and all of their dependencies (assuming they are not
    required by other packages or were not explicitly installed by the user).


    Syntax

    ```bash

    apt remove package_name

    ```


    Example

    ```bash

    sudo apt remove vim

    ```


    ### To remove a package and its configuration files


    Syntax

    ```bash

    apt purge package_name

    ```


    Example

    ```bash

    sudo apt purge vim

    ```


    ### Clean Cache


    `apt` caches downloaded packages in the `/var/cache/apt/` directory. You can clean
    the cache using the `clean` option of the `apt` command.


    ```bash

    sudo apt clean

    ```


    ### Verify installation


    After the installation procedure is complete, you can verify the successful installation
    of the software.


    Syntax

    ```bash

    apt list -a PackageName --installed

    ```


    Example

    ```bash

    sudo apt list -a vim --installed

    ```


    ## Aptitude

