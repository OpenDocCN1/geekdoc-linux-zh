    # who command


    The `who` command shows details about the users that are presently logged in to
    the system, such as their usernames, terminal sessions, and login times.


    ### Example

    ```

    who

    ```


    # w command


    The `w` command provides comprehensive details on users who are currently logged
    in, such as their usernames, terminal sessions, login times, idle times, and current
    processes.


    ### Example

    ```

    w

    ```


    # Process Monitoring


    You can monitor processes that are running and find out who is running them with
    the use of programs like `ps`, `top`, and `htop`.


    ### Syntax

    ```bash

    ps aux | grep user_name

    ```


    ### Example

    ```bash

    ps aux | grep user1

    ```


    # Groups


    Groups enable administrators to provide permissions to a group of users rather
    than handling rights individually. This method makes it easier to manage access
    privileges for files, directories, and other system resources.


    ## Creating groups


    Creating groups in a Linux system is an essential part of user management and
    access control. Groups assist to organize users and manage rights in a more effective
    and scalable manner. To add a user in GUI mode, follow the instructions below:


    1. Open the Users and Groups management tool. Enter your administrator password
    when prompted to authenticate. ![](image_rsrc4DB.jpg)

    2. Click on the "Groups" tab to view the list of existing groups.

    3. To create a new group, click the `Add` button.

    4. In the dialog box, provide the new group a name.

    5. Click "OK" to create the new group.


    ### Using CLI

    To create a new group on the command line, use the `groupadd` command followed
    by the group name.


    ### Syntax

    ```bash

    groupadd group_name

    ```


    ### Example

    ```bash

    sudo groupadd group1

    ```


    ## Adding users to groups


    With the `-aG` option, the `usermod` command can be used to add a user to a group.


    ### Syntax

    ```bash

    usermod -aG group_name user_name

    ```


    ### Example

    ```bash

    sudo usermod -aG group1 user2

    ```


    ## Deleting Groups


    Removing a group in Linux helps keep the system clean, secure, and organized by
    deleting obsolete or superfluous groups, streamlining group management, and guaranteeing
    correct access control. To remove a user in GUI mode:


    1. Open the Users and Groups management tool. Enter your administrator password
    when prompted to authenticate.

    2. Select the group you want to delete from the list of group.

    3. Press the `Delete` button to remove the group.


    ### Using CLI

    Using the `groupdel` on the command line, you can remove a group when it is no
    longer needed.


    ### Syntax

    ```bash

    groupdel group_name

    ```


    ### Example

    ```bash

    sudo groupdel group2

    ```


    ## Listing groups


    To list all defined groups on the system.


    ### Example

    ```bash

    sudo cat /etc/group

    ```


    # User and Group Configuration Files


    User and group information is managed through configuration files located primarily
    in the `/etc` directory. Here are the main files related to user and group management:


    ### /etc/passwd


    The `/etc/passwd` is a plain text file. It contains information about each user
    on the system like user ID, group ID, home directory, shell, and more. Each line
    represents a user account and consists of seven fields separated by colons (`:`).


    ### Syntax

    `Username:password:UID:GID:GECOS:home_directory:login_shell`


    * `username`

    * `password`: An ''x'' character, indicating that the encrypted password is stored
    in `/etc/shadow`.

    * `UID`: User ID.

    * `GID`: Primary group ID.

    * `GECOS`: User information like full name, phone number, etc.

    * `home_directory`: The user''s home directory.

    * `login_shell`: The user''s default login shell.


    ### Example

    ![](image_rsrc4DC.jpg)


    ### /etc/group


    The `/etc/group` is plain text file. It contains information about each group
    on the system, including group name, group ID (`GID`), and a list of users who
    are members of the group. Each line represents a user account and consists of
    several fields separated by colons (`:`). This file contains the password hash
    as well as other password-related properties such as password expiration and account
    locking information.


    ### Syntax

    `group_name:password:GID:user_list`


    Here''s what each field represents:

    * `group_name`: the group''s name.

    * `password`: a password that is encrypted and is typically used to verify a group
    member''s identity. To indicate that the password is kept in the `/etc/gshadow`
    file or another authentication method, it is often set to `''x''` or `''*''`.

    * `GID`: the group ID, which is the group''s numerical identity.

    * `User_list`: a list of usernames belonging to the group, separated by commas.


    ### Example

    ![](image_rsrc4DD.jpg)


    ### /etc/shadow


    The `/etc/shadow` file is another crucial system file found on Unix-like operating
    systems, including Linux. Unlike `/etc/group`, which stores group information,
    `/etc/shadow` contains encrypted password information for user accounts. This
    file is essential for system security because it stores user passwords in encrypted
    form, as well as other account-related information like password expiration dates
    and account lockout policies. It''s typically accessible only to privileged users,
    such as the administrator (`root`) user. Each line in the `/etc/shadow` file represents
    a separate user account and contains several fields separated by colons. The typical
    format of a line in the `/etc/shadow` file is as follows:


    `username:password:lastchg:min:max:warn:inactive:expire:flag`


    Here''s what each field represents:

    * `username`: the username of the user.

    * `password`: the encrypted password for the user account.

    * `lastchg`: the last password change date, represented in days since January
    1, 1970. This field is usually used to enforce password expiration policies.

    * `min`: the minimum number of days required between password changes i.e. the
    number of days left before the user is allowed to change password again. An empty
    field and value `0` mean that there are no minimum password age.

    * `max`: the maximum number of days that a password can be valid before being
    changed

    * `warn`: the number of days before the password expires that the user is reminded
    that his her password must be changed.

    * `inactive`: the number of days following the password expiration date before
    the account is disabled.

    * `expire`: the date of expiration of the user account, expressed as the number
    of days since Jan 1, 1970.

    * `flag` flag.


    ### Example

    ![](image_rsrc4DE.jpg)


    # Chapter 16


    To summarize, User and group management are key components of Linux system administration
    that ensure secure and efficient access control. Administrators create and edit
    user accounts and groups to control rights, enforce security policies, and simplify
    resource access. Key duties include adding and deleting users, updating user information,
    and managing permissions for users via group memberships.


    ## Keeping Your System Up-to-Date


    Updating installed packages to the most recent versions is critical for following
    reasons:


    * **Security**: Software upgrades frequently include remedies for vulnerabilities
    in security. Keeping your packages up to date ensures that your system is protected
    from known security threats. Failure to upgrade could expose your system to exploitation.

    * **Bug fixes**: Updates regularly feature bug fixes and performance enhancements.
    Updating guarantees that you have access to the most recent bug fixes, which improve
    the stability and efficiency of your system.

    * **Compatibility**: Updated packages may improve compatibility with other software
    or system components. Keeping your packages up to date helps to avoid compatibility
    difficulties caused by utilizing obsolete software versions.

    * **New Features**: Updates may include new features or updates to current software.
    By updating frequently, you may take benefit.


    ### Update using Update Manager

