    This will give all permissions to the user and remove all permissions from others
    and groups.


    ## User file creation mode mask


    The user''s file creation mode mask (`umask`) variable determines how file permissions
    are configured for newly created files and directories. The `umask` command allows
    the user to define which permissions should be removed by default from the base
    permission value of newly created files or directories.


    ### Check umask value


    #### umask


    ```

    0022

    ```


    First digit of the output is sticky bit, and the remaining digits represent the
    numerical permissions.


    To change the current session umask value:


    #### umask 0044


    When setting `umask`, you can skip the sticky bit value and enter the new value
    in three digits.


    ### Example


    ### Determine the net permissions


    After applying the `umask` to determine the effective permissions, subtract the
    `umask` value from the default permissions. Here''s how you can accomplish it:


    - Default value: The system default permission values are `777` (rwxrwxrwx) for
    folders and `666` (rw-rw-rw-) for files.

    - Umask Value: Determine the current `umask` value. Supposing the current `umask`
    value is `002`.

    - Subtract: Now subtract the `umask` value from the default permissions.


    ```

    777 – 002 = 775 (rwxrwxr-x)

    ```


    When you set the `umask` at the command prompt, it only affects that particular
    shell session and does not persist over reboots or new shell sessions. To set
    values permanently, you can set them system-wide or for specific users. To permanently
    enforce a system-wide default for all users, use the `/etc/profile` file; for
    individual users, change the `~/.profile` or `~/.bashrc` file.


    ## Object types


    The first column of the `ls -al` output shows the object type.


    ![](image_rsrc4EH.jpg)


    Object types are listed below:


    | Code | Object type |

    | – | : | |

    | – | Regular file |

    | d | Directory |

    | l | Symbolic link |

    | c | Character device |

    | b | Block device |

    | p | named pipe (FIFO). |

    | s | socket. |


    ## ACL


    Access control lists (ACLs) provide an additional, more flexible permission mechanism.
    ACL allows you to grant permissions to any user or group on any file or directory.
    It extends the traditional Linux file permissions to provide more fine-grained
    control over access to files and directories.


    An ACL can provide the following types of permissions:


    - Permissions provided to particular users based on their usernames or user IDs
    are known as user-specific permissions.

    - Permissions designated for particular groups based on their group names or group
    IDs are known as group-specific permissions.

    - Newly created files and directories inside of a directory are subject to the
    default permissions.


    To display the current ACL of a file or directory, we use the `getfacl` command.


    ### Syntax


    ```

    getfacl file / directory

    ```


    ### Example


    ```

    getfacl hosts

    ```


    The commands `setfacl` and `chmod` can be used to set or modify the ACL of a file
    or directory.


    ### Syntax


    ```

    setfacl [option] file_owner:file_permission filename

    ```


    Where options are:


    | Option | Description |

    | :--- | :--- |

    | `-m, –modify` | Modify the ACL. |

    | `-x, –remove` | Remove the permission. |

    | `-b, –remove-all` | Remove all permission. |

    | `-d, –default` | Apply default permissions to newly created files and folders.
    |

    | `-R, –recursive` | Recursively apply modifications to all files and directories.
    |


    ### Example


    Set file permission to users on a specific file.


    ```

    setfacl -m u:user1:rw acct.txt

    ```


    Remove all permission on a specific directory


    ```

    setfacl -x u:user1 acct.txt

    ```


    ## Conclusion


    In essence, file permissions provide users control over who can access their files
    and directories and are an important part of Linux operating systems. Users can
    guarantee the security and privacy of their data by comprehending the ideas of
    read, write, and execute rights for owners, groups, and others. In addition to
    safeguarding sensitive data, properly managing file permissions also contributes
    to the stability and integrity of the system. A thorough understanding of file
    permissions will enable users to maintain system security and make informed choices
    as they traverse and interact with their filesystems.


    ## Final Thoughts


    As we conclude our tour through Linux Mint, I hope this book has shed light on
    the powerful, user-friendly features that make this distribution an excellent
    choice for both novice and seasoned users. You''ve now mastered the fundamentals
    of installation and configuration, as well as advanced customization and troubleshooting,
    giving you the tools you need to fully utilize Linux Mint''s capabilities.


    Remember that the open-source community values curiosity and collaboration. As
    you continue to use and explore Linux Mint, don''t be afraid to jump into forums,
    participate in debates, and share your own experiences. Every problem you face
    presents an opportunity to learn and improve.


    Thank you for accompanying me on this voyage. May your Linux Mint journey be rich
    with exploration and efficiency.


    Happy Linuxing

    '
