  md: "# LSSCT v1.05 > Chapter 7 > User Defined variables in awk\n\nBy Vivek G Kite.\n\
    \n+   1.Pen Rs.100\n2.Pencil Rs.20\n3.Rubber Rs.10.5\n4.Cock Rs.91\n\nTotal Rs.221.5\n\
    =============\n\nNow the grand total is printed at the end. In above program BEGIN\
    \ and END patterns are used. BEGIN instruct awk, that perform BEGIN actions before\
