    | for (( i = 1; i <= 9; i++ )) | Begin the outer loop which runs 9 times., and
    the outer loop terminates when the value of i exceeds 9. |

    | do | |

    | for (( j = 1; j <= 9; j++ )) | Begins the inner loop, for each value of i the
    inner loop is cycled through 9 times, with the variable j taking values from 1
    to 9. The inner for loop terminates when the value of j exceeds 9. |

    | do | |

    | tot=''expr $i + $j'' | See for even and odd positions when using these statements.
    |

    | tmp=''expr $tot % 2'' | |

    | if [ $tmp -eq 0 ]; then | If even number position print the white colour block
    (using echo -n "\033[47m" statement); otherwise for odd number position print
    the black colour block (using echo -n "\033[40m" statement). These statements
    are responsible to print entier chess board on screen with alternate colours.
    |

    | else | |

    | echo -n "\033[47m" | |

    | echo -n "\033[40m" | |

    | done | End of inner loop |

    | echo -n "\033[40m" | Make sure its black background as we always have on our
    terminals. |

    | echo "" | Print the blank line |

    | done | End of outer loop and print script and shell scripts get terminated by
    printing the chess board. |


