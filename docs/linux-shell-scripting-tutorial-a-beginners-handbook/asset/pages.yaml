  md: '# # Linux Shell Scripting Tutorial (LSST) v1.05r3

    ## Chapter 5: Essential Utilities for Power User


    # # Translateing range of characters using tr


    Type the following command at shell prompt:

    `$ tr "h2" "3x" <name`


    +   11 Vivek

    12 i Renuka

    13 Prakas3

    14 As3is3

    15 Rani


    You can clearly see that each occurrence of character ''h'' is replace with ''3''
    and ''2'' with ''x''. tr utility translate specific characters into other specific
    characters or range of characters into other ranges.

    h -> 3

    2 -> x


    Consider following example: (after executing command type text in lower case)

    `$ tr "[a-z]" "[A-Z]"`

    hi am Vivek

    HI I AM VIVEK

    what a magic

    WHAT A MAGIC


    [ Press CTRL + C to terminate. }

    H tr translate range of characters (i.e. small a to z) into other (i.e. to Capital
    A to Z) ranges.


    General Syntax & use of tr utility:

    Syntax:

    `tr {pattern-1} {pattern-2}\`


    Use of tr utility:

    To translate characters into other range of characters.


