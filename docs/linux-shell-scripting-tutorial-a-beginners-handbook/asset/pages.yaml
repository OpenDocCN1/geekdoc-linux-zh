  md: '# Parameter substitution.


    Now consider following command

    $($ echo ''expr 6 + 3'') **Parameter substitution.**


    The command `$ echo ''expr 6 + 3''` is known as Parameter substitution. When a
    command is enclosed in backquotes, the command executed and we will get output.
    Mostly this is used in conjunction with other commands. For e.g.


    ```

    $pwd

    cp /mnt/cdrom/lsoft/samba*.rm

    ```


    Now suppose we are working in directory called `/home/vivek/soft/artical/linux/sst`
    and I want to copy some files from `/mnt/cdrom/lsoft` to my current working directory,
    then my command will be something like


    $cp /mnt/cdrom/lsoft/samba*.rmp /home/vivek/soft/artical/linux/sst


    Instead of giving above command I can give as follows

    $cp /mnt/cdrom/lsoft/samba*.rmp `pwd`


    Here is file to copy your working directory. See the **Parameter substitution**
    of `pwd` command, and expand it to `/home/vivek/soft/artical/linux/sst`. $cp /mnt/cdrom/lsoft/samba*.rmp
    `pwd` . This will save my time.


    **Future Point:** What is difference between following two command?

    $cp /mnt/cdrom/lsoft/samba*.rmp `pwd`


    A AND

    $cp /mnt/cdrom/lsoft/samba*.rmp .


    Try to note down output of following Parameter substitution.


    ```

    $echo "Today date is ''date''"

    $cal > menuchoice.temp.$\$

    $dialog --backtitle "Linux Shell Tutorial" -title "Calender" --infobox "cat

    menuchoice.temp.$\" 9 25; read"

    ```'
