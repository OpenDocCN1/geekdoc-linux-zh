  md: '# LSST v1.05 > Chapter 7 > More examples of sed


    Above expression can be explained as follows


    | Expression | Meaning |

    | --- | --- |

    | ^ | Beginning of line |

    | \* | Find the asterisk or star (remove the special meaning of ''*'') metacharacter)
    |

    | \{2,3}\} | Find next two asterisk |

    | $ | End of line |

    | , | Next range or search pattern |

    | ^\*\{2,3}\$ | Same as above |

    | d | Now delete all lines between *** and *** range |


    You can group the commands in sed - scripts as shown in following example


    ```

    $ cat > dem_gsed

    /\^\*\{2,3\\}\$//\^\*\{2,3\\}\$/d

    s/\^\$/d

    s/Linux/Linux-Unix//

    }<

    ```


    Now save above sed script and run it as follows:

    $ sed -f-dem_gsed demofile2 > /tmp/fi.$$\n$ cat /tmp/fi.$$


    Above sed script finds all line between *** and *** and performance following
    operations

    1) Delete blank line,

    2) Substitute "Linux-Unix" for "Linux" using s/Linux/Linux-Unix expression.


    Our next example removes all blank line and converts multiple spaces into single
    space, for this purpose you need demofile3. Write sed script as follows:


    ```

    $ cat > rmb1ksp

    /\^$/d

    s/ / * /g

    ```


    Run above script as follows:

    $ sed -f rmb1ksp demofile3

    Welcome to world of sed what sed is?

    I don''t know what sed is but I think

    Rani knows what sed I s


    Above script can be explained as follows:


    | Expression | Meaning |

    | --- | --- |

    | /\^$/d | Find all blank line and deletes using d command. |

    | s/_ / * /g | Find two or more than two blank space and replace it with single
    blank space |


