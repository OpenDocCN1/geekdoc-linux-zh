  md: '# User Defined variables in awk


    You can also define your own variable in awk program, as follows:


    ```

    $ cat > math1

    {

    no1 = $1

    no2 = $2

    ans = $1 + $2

    print " " no1 " + = " no2 " = = " ans

    }

    ```


    Run the program as follows

    $ awk -f math1


    5

    1 + 5 = 6


    In the above program, no1, no2, ans are all user defined variables. Value of first
    and second field are assigned to no1, no2 respectively and the addition to ans
    variable. Value of variable can be printed using print statement, as print " "
    no1 " + " no2 " = " ans. Note that print statement whatever is enclosed in double
    quotes (" text ") as it. If string is in double quotes it is not enclosed in it
    treated as variable.


    Now try the following awk program and note down its output.


    ```

    $ cat > bill

    {

    total = $3 * $4

    recno = $1

    item = $2

    print recno item " Rs." total

    }

    ```


    Run it as

    $ awk -f bill inven


    1.Pen Rs.100

    2.Pencil Rs.20

    3.Rubber Rs.10.5

    4.Cock Rs.91


    Here we are printing the total price of each product (By multiplying third field
    with fourth field). Following program prints total price of each product as well
    as the Grand total of all product in the bracket.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# bill1


    ```

    $ cat < bill1

    {

    total = $3 * $4

    recno = $1

    item = $2

    gtotal = gtotal + total

    print recno item " Rs." total [Total Rs." gtotal] "

    ```


    Run the above awk program as follows:


    +   1.Pen Rs.100 [Total Rs.100]

    2.encil Rs.20 [Total Rs.120]

    3.Rubber Rs.10.5 [Total Rs.130.5]

    4.Cock Rs.91 [Total Rs.221.5]


    In this program, gtotal variable holds the grand total. It adds the total of each
    product as gtotal = gtotal + total. Finally this total is printed with each record
    in the bracket. But there is one problem with our script. Grand total mostly printed
    at the end of all record. To solve this problem we have to use special BEGIN and
    END patterns of awk. First let us take the example,


    ```

    $ cat < bill2

    {

    BEGIN {

    print "------------------------------------------------"

    print "Bill for the 4-March-2001. "

    print "By Vivek G Gite. "--------------------------------"

    print "------------------------------------------------"

    }

    \{

    total = $3 * $4

    recno = $1

    item = $2

    gtotal += total

    print recno item " Rs." total

    }


    END {

    print "------------------------------------------------"

    print "Total Rs." gtotal===================="

    print "=============================================="

    }

    ```


    Run it as

    Awk -f bill2 inven


    -------------------------------------------------

    Bill for the 4-March-2001.'
  merge: -1
