  md: '# # Linux Shell Scripting Tutorial (LSST) v1.05r3


    Prev Chapter 7: awk Revisited Next


    # # Getting Starting with awk


    Consider following text database file


    | Sr.No | Product | Qty | Unit Price |

    |---|---|---|--|

    | 1 | Pen | 5 | 20.00 |

    | 2 | Rubber | 10 | 2.00 |

    | 3 | Pencil | 3 | 3.50 |

    | 4 | Cock | 2 | 45.50 |


    In above fields are Sr.No,Product,Qty,Unit Price. Field is the smallest element
    of each record. Each fields has its own attributes. For e.g Take Qty. field. Q
    attribute is the numerical(Can contain only numerical data). Collection of fields
    is known as record.

    1. Pen 5 20.00 ---> A Record.

    Collection of record is known as *database* file. In above text database file
    each field is separated using space (or tab character) and record is separated
    using new-line (i.e each record is finished at the end of line ). In the above,
    fields are accessed using special variable. For e.g. In above database $1, $2,
    $3, $4 respectively represents Sr.No, Product, Qty, Unit Price fields. (Don''t
    confuse $1,$2 with command line arguments of shell)


    For this part of tool command line create text datafile inven (Shown above). Now
    ever entering simple awk program/command at shell prompt:


    ```

    $ awk ''print $1 $2 "-- Rs." $3 * $4'' inven

    1.Pen--> Rs.100

    2.Rubber--> Rs.10.5

    4.Cock--> Rs.91

    ```


    Above awk program/command can be explained as follows:


    | awk program statement | Explanation |

    |---|---||

    | ''{print $1 $2 "-- Rs." $3 * $4'' } | print command is used to print contents
    of variables or enclose in " text " . Here $1, $2, $3,$4 are all the special variable.
    $1, $2, etc all of the variable contains value of field. Finally we can directly
    the calculation using $3 * $4 i.e multiplication of third and fourth field is
    database. Note that "-- Rs." is string which is printed as it.


    **Note** $1,$2 etc (in awk) also known as predefined variable and can assign any
    value found in field.


    Type following awk program at shell prompt,'
  merge: -1
