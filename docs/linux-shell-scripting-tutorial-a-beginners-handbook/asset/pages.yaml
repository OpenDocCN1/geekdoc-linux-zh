    | Expression | Meaning |

    | --- | --- |

    | s/A.bad/Aurangabad/g | Substitute Aurangabad for A''bad. Note that here second
    character in A''bad is '' (single quote), to match this single quote we have to
    use . (DOT - Special Metacharcter) that matches any single character. |

    | s/MH/Maharastra/g | Substitute Maharashtra for MH |

    | s/^$/=========/g | Substitute blank line with actual line |

    | /V.K./ {\nN\nA\nemail:vk@fmail.co.in | Match the pattern and follow the command
    between { and }, if pattern found. Here we are finding friends initial name if
    it matches then we are going to end of his address (by giving N command twice)
    and appending (a command) friends e-mail address at the end. |


