  md: '# sed utility - Editing file without using editor


    For this part of tutorial create data file as follows


    teaormilk


    India''s milk is good.

    tea Red-Label is good.

    tea is better than the coffee.


    After creating file give create command


    ```

    $ sed ''/tea/s/milk/g'' teaormilk > /tmp/result.tmp.\$

    $ cat /tmp/result.tmp.\$"

    ```


    India''s milk is good.

    milk Red-Label is good.

    milk is better than the coffee.


    sed utility is used to find every occurrence of tea and replace it with word milk.
    sed - Stream line editor which uses ''ex'' editors for command editing file without
    starting ex. (Cool!, isn''t it? Use no of text editor to edit anything!!!)


    | /tea/ | Find the word or select all lines having the word tea |

    | s/milk/ | Replace (substitute) the word milk for the tea. |

    | g | Make the changes globally. |


    Syntax:

    sed {expression} {file}


    Use of sed utility: sed is used to edit (text transformation) on given stream
    i.e a file or may be input from a pipeline.'
