  md: '# # What is Linux Shell ?


    Computer understand the language of 0''s and 1''s binary language.


    In early days of computing, instruction are provided using binary language, which
    is difficult for all of us, to read and write. In Os there is special program
    called Shell. Shell accepts your instruction or commands in English (mostly) and
    if its a valid command, it is passed to kernel.


    Shell is a user program or it''s an environment provided for user interaction.
    Shell is command language interpreter that executes commands read from the standard
    input device (keyboard) or from a file.


    Shell is not part of system kernel, but uses the system kernel to execute programs,
    create files etc.


    Several shell available with Linux including:


    | Shell Name | Developed by | Where | Remark |

    |---|---|---|---|

    | BASH (Bourne-Again Shell ) | Brian Fox and Chet Ramey | Free Software Foundation
    | Most common shell in Linux. Freeware shell. |

    | CSH (C Shell) | Bill Joy | University of California (For BSD) | The C shell''s
    syntax and usage are very similar to the C programming language. |\| KSH (Korn
    Shell) | David Korn | AT & T Bell Labs | -- |

    | TCSH | See the man page. Type $ man tcsh | -- | TCSH is an enhanced but completely
    compatible version of the Berkeley UNIX shell (CSH). |


    **Tip:** To find all available shells in your system type following command:

    `$ cat /etc/shells`**


    **Note** that each shell does the same job, but each understand a different command
    syntax and provides different built-in functions.


    In MS-DOS, Shell name is COMMAND.COM which is also used for same purpose, but
    it''s not as powerful as our Linux Shells are!


    Any of the above read command from user (via Keyboard or Mouse) and tests Linux
    OS what we want. If we are giving commands from keyboard it is called command
    line interface ( Usually in-front or $ prompt . This prompt is depend upon your
    shell and Environment that you set or by your System Administrator, you may get
    different prompt ).'
