  md: '# # Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 4: Advanced Shell Scripting Commands


    # # Local and Global Shell variable (export command)


    Normally our variables are local. Local variable can be used in same shell, if
    you load another copy of shell (by typing the /bin/bash at the $ prompt) then
    new shell ignored all shell''s variable. For e.g. Consider following example


    ```

    $ vech=Bus

    $ echo $vech

    Bus

    $ /bin/bash

    $ echo $vech

    ```


    NOTE:-Empty line printed

    $ vech=Car

    $ echo $vech

    Car

    $ exit

    $ echo $vech

    Bus


    | Command | Meaning |

    |---|---|n=Bus | Create new local variable ''vech'' with Bus value in first shell
    |

    | echo $vech | Print the contains of variable vech |

    | /bin/bash | Now load second shell in memory (Which ignores all old shell''s
    variable) |

    | echo $vech | Print the contains of variable vech |

    | vech=Car | Create new local variable ''vech'' with Car as value in second shell
    |

    | echo $vech | Print the contains of variable vech |

    | exit | Exit from second shell to first shell |

    | echo $vech | Print the contains of variable vech (Now you can see first shells
    variable and its value) |


    Global shell defined as:

    "You can copy old shell''s variable to new shell (i.e. first shells variable to
    seconds shell), such variable know as Global Shell variable.\"


    To set global variable you have to use command.

    Syntax:

    export variable1,variable2,......variableN'
