    # Open Source


    Linux is developed under the GNU Public License. This is sometimes referred to
    as a "copyleft", to distinguish it from a copyright.


    Under GPL the source code is available to anyone who wants it, and can be freely
    modified, developed, and so forth. There are only a few restrictions on the use
    of code. If you change the programs, you have to make those changes available
    to everyone. This basically means you can''t take the Linux source code, make
    a few changes, and then sell your modified version without making the source code
    available. For more details, please visit the open-source home page.


