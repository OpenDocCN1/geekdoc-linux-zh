  md: '# Syntax:

    printf "format",var1, var2, var N


    If you just want to print any text using printf as follows

    printf "Hello"

    printf "Hello World\n"


    In last example \nAn is used to print new line. This Part of escape sequence following
    may be also used:

    \t tab

    \a Alert or bell

    \" Print double quote etc


    For e.g. printf "\nAn apple a day, keeps away\t\tDoctor\n\a"

    It will print on new line:

    An apple a day, keeps away\a\a.


    Notice that twice the sound of bell is produced by \\a. To print the value of
    decimal number %d as format specification code followed by the variable name.
    For e.g. printf "%d", no1

    It will print the value of no1. Following table shows such common format specification
    code:


    | Format Specification Code | Meaning | Example |

    | --- | --- | --- |

    | %c | Character | { isminor = "y" printf "%c", isminor } |

    | %d | Decimal number such as 10,-5 etc | { n = 10 printf "%d",n } |

    | %x | Hexadecimal number such as 0xA, 0xfffff etc | { n = 10 printf "%x",n }
    |

    | %s | String such as "vive", "Good buy" | { str1 = "Welcome to Linux!" printf
    "%s", str1 printf "%s", "Can print ?" } |


    To run above example simply create any awk program file as follows


    ```

    $ cat > p_demo

    BEGIN {

    n = 10

    printf "%d", n

    printf "\nAn apple a day, keeps away\t\tDoctor\n\a"

    }

    ```'
