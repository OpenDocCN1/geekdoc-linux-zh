    # Who developed the Linux?


    In 1991, Linus Torvalds studying Unix at the University, where he used special
    educational experimental purpose operating system Minix (small version of Unix
    and used in Academic environment). But Minix had it''s own limitations. Linus
    felt he could do better than the Minix. So he developed his own version of Minix,
    which is now know as Linux. Linux is Open Source From the start of the day. For
    more information on Linus Torvalds, please visit [his home page].


