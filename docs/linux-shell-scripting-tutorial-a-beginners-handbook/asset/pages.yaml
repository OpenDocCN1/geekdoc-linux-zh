  md: '# # Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 1: Introduction: Quick Introduction to Linux


    # # Introduction


    This tutorial is designed for beginners who wish to learn the basics of shell
    scripting/programming plus introduction to power tools like awk, sed, etc. It
    is not help or manual for the shell; while reading this tutorial you can find
    manual quite useful (type man bash at $ prompt to see manual pages). Manual contains
    all necessary information you need, but it won''t have that examples, which makes
    idea more clear. For this reason, this tutorial contains examples rather than
    all the features of shell.


    # # Audience for this tutorial


    I asumes you have at least working knowledge of Linux i.e. basic commands like
    how to create, copy, remove files/directories etc or how to use editor like vi
    or meedit and login to your system. But not expects any programming language experience.
    If you access to Linux, this tutorial will provide you an easy-to-follow introduction
    to shell scripting.


    # # What''s different about this tutorial


    Many other tutorial and books on Linux scripting are either too basic, or skips
    important intermediate steps. But this tutorial, maintained the balance between
    these two. It covers the many real life modern example of shell scripting which
    are almost missed by many other tutorials/documents/books. I have used a hands-on
    approach in this tutorial. The idea is very clear "do it yourself or learn by
    doing" i.e. trying things yourself is the best way to learn, so examples are presented
    as complete working shell scripts, which can be typed in executed


    # # Chapter Organization


    Chapter 1 to 4 shows the most useful and important shell scripting concepts. Chapter
    5 introduction to tools & utilities which can be used while programming the Linux
    shell smartly. Chapter 6 and 7 is all about expression and expression mostly used
    by tools such as awk and sed. Chapter 8 is loaded with ton of shell scripting
    examples divided into different categories. Chapter 9 gives more resources information
    which can be used while learning the shell scripting information on Linux file
    system, Linux command reference and other resources.


    Chapter 1 introduces basic concepts such as what is Linux, where Linux can be
    used and continue explaining the shell, shell script and kernel etc.


    Chapter 2 shows how to write the shell script and execute them. It explains many
    basic concepts which requires to write shell script.'
