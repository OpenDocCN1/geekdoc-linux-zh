    \  }\n  printf \"Sum for 1 to 10 numbers = %d \\nGoodbuy!\\n\\n\", sum\n  exit\
    \ 1\n}\n```\n\nRun it as follows:\n$ awk -f while01.awk\n\nPress ENTER to continue\
    \ with for loop example from LSST v1.05r3\nSum for 1 to 10 numbers = 55\nGoodbuy\n\
    \nAbove loops prints the sum of all numbers between 1 to 10, it does use very\
