    **Tip:** First find the PID of MP3 playing process by issuing command:

    $ ps ax | grep mp3-process-name

    In the first column you will get PID of mp3. Kill this PID to end the process
    as:

    $ kill PID


    **Or** you can killall command to kill by name as follows:

    $ killall mp3-process-name


    ![](img/219cb7c6e1c9c4c56d73838282f4b69b_234_0.png)


    # # Linux Console (Screen)


    How can I write colorful message on Linux Console?, mostly this kind of question
    is asked by newcomers (Specially those who are learning shell programming!). As
    you know in Linux everything is considered as a file, our console is one of such
    special file. You can write special character sequences to console, which control
    every aspect of the console Colors on screen, Bold or Linking text effects, clearing
    the screen, showing text boxes etc. For this purpose we have use special code
    called escape sequence code. Our linux is based on the DEC VT100 serial terminals
    which support ANSI escape code.


    What is special character sequence and how to write it to Console?


    By default whatever you send to console it is printed as is. For e.g. consider
    following echo statement,

    $ echo "Hello World"

    Hello World

    Above echo statement prints sequence of character on screen, but if there is any
    special escape sequence (control character) in sequence, then first action is
    taken according to escape sequence (or control character) and then normal character
    is printed on console. For e.g. following echo command prints message in Blue
    color on console

    $ echo -e "033[34m Hello Colorful World"

    Hello Colorful World!


    Above echo statement uses ANSI escape sequence (\033[34m), above string (i. e.
    "\u033[34m") is in process as follows


    +   1) First **033**, is escape character, which causes to take some action

    2) Here it is set screen foreground color to Blue using [34m escape code.

    3) Then it prints our normal message **Hello Colorful World!** in blue color.


    Note that ANSI escape sequence begins with \033 (Octal value) which is represented
    as ^ in termcap and terminfo files of terminals and documentation.

    Now you can use **echo** statement to print message, to use ANSI escape sequence
    you must use **-e option'
