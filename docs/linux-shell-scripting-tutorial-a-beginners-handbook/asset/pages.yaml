  md: '# Linux Shell Scripting Tutorial v1.05 / Misc. Linux/Unix definition is as
    follows


    (switch) with echo statement, general syntax is


    # Syntax


    ```

    echo -e "\033[escape-code your-message"

    ```


    In above syntax you have to use \033[escape-code for different operations. As
    soon as console receives the message to process/read it, and if it finds escape
    character (\033) it moves to escape mode, then it "[ character and moves into
    Command Sequence Introduction (CSI). In mode console reads a series of ASCII-coded
    decimal numbers (know as parameter) which are separated by semicolon (;). These
    numbers are read until console action letter or character is not found (which
    determines what action to take). In above example


    | \033 | Escape character |

    | Start of CSI |

    | 34 | parameter |

    | m | letter (specifies action) |


    Following table show important list of esc-code/action letter or character


    | Character or letter | Use in CSI | Examples |

    | h | Set the ANSI mode | echo -e "\033[h" |

    | l | Clears the ANSI mode | echo -e "\033[l" |

    | m | Useful to show characters in different colors or effects such as BOLD and
    see Blink, see below for parameter taken by m. | echo -e "\033[35m Hello World"
    |

    | q | Turns keyboard num lock, caps lock, scroll lock LED on or off, | echo -e
    "\033[2q" below. |

    | s | Stores the current cursor x,y position (col, row position) and attributes
    | echo -e "\033[7s" |

    | u | Restores cursor position and attributes | echo -e "\033[8u" |


    m understand following parameters


    | Parameter | Meaning | Example |

    | 0 | Sets default color scheme (White foreground and Black background), normal
    intensity, no blinking etc. | $ echo -e "I am \033[1m BOLD \033[0m Person"

    I am BOLD Person |

    | 1 | Set BOLD intensity | Prints BOLD word in bold intensity and next ANSI Sequence
    remove bold effect (\033[0m) |'
