  md: '# For Mathematics, use following operator in Shell Script


    | Mathematical Operator in Shell Script | Meaning | Normal Arithmetical/Mathematical
    Statements | But in Shell: For test statement with command | For [ expr ] statement
    with command |

    | --- | --- | --- | --- | --- |

    | -eq | is equal to | 5 == 6 | if test 5 -eq | if [ 5 -eq ] |

    | -ne | is not equal to | 5 != 6 | if test 5 -ne | if [ 5 -ne ] |

    | -lt | is less than | 5 < 6 | if test 5 -lt | if [ 5 -lt ] |

    | -le | is less than or equal to | 5 <= 6 | if test 5 -le | if [ 5 -le ] |

    | -gt | is greater than | 5 > 6 | if test 5 -gt | if [ 5 -gt ] |

    | -ge | is greater than or equal to | 5 >= 6 | if test 5 -ge | if [ 5 -ge ] |


    NOTE: == is equal, != is not equal.


    # For string Comparisons use


    | Operator | Meaning |

    | --- | --- |

    | string1 = string2 | string1 is equal to string2 |

    | string1 != string2 | string1 is NOT equal to string2 |

    | string1 | string1 is NOT NULL or defined |

    | -n string1 | string1 is NOT NULL and does exist |

    | -z string1 | string1 is NULL and does exist |


    # Shell also test for file and directory types


    | Test | Meaning |

    | --- | --- |

    | -s file | Non empty file |

    | -f file | Is exists or normal file and not a directory |

    | -d dir | Is Directory exists and not a file |

    | -w file | Is writeable file |

    | -r file | Is read-only file |

    | -x file | Is file executable |


    # Logical Operators


    Logical operators are used to combine two or more condition at a time


    | Operator | Meaning |

    | --- | --- |

    | ! expression | Logical NOT |

    | expression1 -a expression2 | Logical AND |'
