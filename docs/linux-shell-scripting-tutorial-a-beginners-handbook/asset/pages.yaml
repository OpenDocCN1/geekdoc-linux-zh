  md: "# # The case statement\n\nThe case statement is good alternative to Multilevel\
    \ if-then-else-fi statement. It enable you to match several values against one\
    \ variable. Easier to read and write.\n\nSyntax:\n\n```\ncase $variable-name in\n\
    \    pattern1) command\n        ..\n        command;;\n    pattern2) command\n\
    \        ..\n        command;;\n    patternN) command\n        ..\n        command;;\n\
    \    *) command\n        ..\n        command;;\nesac\n```\n\nThe $variable-name\
    \ is compared against the patterns until a match is found. The shell then executes\
    \ all the statements up to the two semicolons that are next to each other. The\
    \ default is *) and its executed if no match is found. For e.g. write script as\
    \ follows: \n\n```\n$ cat > car\n# if no vehicle name is given\n# i.e. -z $1 is\
    \ defined and it is NULL\n# if no command line arg\nif [ -z $1 ]\nthen\n    rental=\"\
    **** Unknown vehicle ****\"\nelif [ -n $1 ]\nthen\n    # otherwise make first\
    \ arg as rental\n```"
