    grep will locate all lines for the "too" pattern and print all (matched) such
    line on-screen. grep prints too, as well as cartoons and toon; because grep treat
    "too" as expression. Expression by grep is read as the letter followed by o and
    so on. So if this expression is found anywhere on line it is printed. grep don''t
