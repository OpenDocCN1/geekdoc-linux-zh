  md: '# # Where I can use Linux?


    You can use Linux as Server Os or as stand alone Os on your PC. (But it is best
    suited for Server.) As a Server Os it provides different services/network resources
    to client. Client Server Os must be:


    +   * Stable

    * Robust

    * Secure

    * High Performance


    Linux offers for all the above characteristics plus its Open Source and Free Os.
    So Linux can be used as:


    (1) On stand alone workstation/PC for word processing, graphics, software development,
    internet, e-mail, chatting, small personal database management system etc.

    (2) In network environment environment as:


    (A) File and Print or Application Server

    Share the data, Connect the expensive device like printer and share it, e-mail
    within the LAN/intranet etc are some of the application.


    ![](img/219cb7c6e1c9c4c56d73838282f4b69b_13_0.png)


    (B) Linux server can be connected to Internet, So that PC''s on intranet can share
    the internet/e-mail etc. You can put your web server that run your web site or
    transmit the information on the internet.'
