  md: '# # What Kernel Is?


    Kernel is heart of Linux Os.


    It manages resource of Linux Os. Resources means facilities available in Linux.
    For e.g. Facility to store data, print data on printer, memory, file management
    etc.


    Kernel decides who will use this resource, for how long and when. It runs your
    programs (or set up to execute binary files).


    The kernel acts as an intermediary between the computer hardware and various programs/application/shell.


    ![](img/219cb7c6e1c9c4c56d73838282f4b69b_15_0.png)


    It''s Memory resident portion of Linux. It performance following task :-


    +   * I/O management

    * Process management

    * Device management

    * File management

    * Memory management'
