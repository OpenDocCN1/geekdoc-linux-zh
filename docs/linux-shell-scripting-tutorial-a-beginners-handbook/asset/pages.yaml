  md: "# LSST v1.05r > Chapter 4 > I/O Descriptors and redirection\n\n| Standard File\
    \ | File Descriptor number | Use | Example |\n| --- | --- | --- | --- |\n| stdin\
    \ | 0 | as Standard input | Keyboard |\n| stdout | 1 | as Standard output | Screen\
    \ |\n| stderr | 2 | as Standard error | Screen |\n\nBy default in Linux every\
    \ program has three files associated with it, (when we start our program these\
    \ three files are automatically opened by your shell). The use of first two files\
    \ (i.e. stdin and stdout) , are already seen by us. The last stderr (numbered\
    \ as 2) is used by our program to print error on screen.\nYou can redirect the\
    \ output from a file descriptor directly to file with following syntax\n\nSyntax:\n\
    file-descriptor-number>filename\n\nExamples: (Assume the file bad_name111 does\
    \ not exist)\n$ rm bad_name111\nrm: cannot remove 'badbad_name111\\': No such\
    \ file or directory\nAbove command gives error as output, if you don't have a\
    \ file. Now if we try to redirect this error-output to file, it cannot be sent\
    \ to (redirect) to file, as try as follows:\n$ rm bad_name_111 2>\n\nStill it\
    \ prints output on screen as rm: cannot remove 'bad_name_111\\': No such file\
    \ or directory. And if you see error as $ cat er the file is empty, output is\
    \ sent to error device and you cannot redirect it to copy this error-output to\
    \ your file 'er'. To overcome this problem you have to use following command:\n\
    $ rm bad_name_111 2>\n\nNote that no space are allowed between 2 and >, The 2>er\
    \ directs the standard error output to file. 2 is default number (file descriptors\
    \ number) of stderr file. To clear your idea another example by writing shell\
    \ script as follows:\n\n```\n$ cat > democr\nif [ $# -ne 2 ];\nthen\n  echo \"\
    Error : Number are not supplied\"\n  echo \"Usage : $0 number1 number2\"\n  exit\
    \ 1\nfi\nans=`expr $1 + $2'\necho \"Sum is $ans\"\n```\n\nRun it as follows:\n\
    $ chmod 755 democr\n$ ./demosocr\nError : Number are not supplied\nUsage : ./demosocr\
    \ number1number2\n\nhttp://www.cyberciti.biz/pdf/lsst/ch0sec4.html (2 of 3) [7/29/2002\
    \ 6:52:45 PM]"
