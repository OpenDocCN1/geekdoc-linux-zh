  md: '# test command or [ [ expr ]


    test command or [ [ expr ] is used to see if an expression is true, and if it
    is true return zero(0), otherwise returns nonzero for false.


    Syntax:

    test expression OR [ expression ]


    Example:

    Following script determine whether given argument number is positive.


    ```

    $ cat > ispositive

    !/bin/sh

    # Script to see whether argument is positive

    #

    if test $1 -gt 0

    then

    echo "$1 number is positive"

    fi

    ```


    Run it as follows

    $ chmod 755 ispositive


    $ ispositive 5

    5 number is positive


    $ispositive -45

    Nothing is printed


    $ispositive

    /ispositive: test: -gt: unary operator expected


    Detailed explanation

    The line, if test $1 -gt 0 , test to see if first command line argument($1) is
    greater than 0. If it is true(0) then we will return 0 and output printed as 5
    number is positive but -45 argument there is no output because our condition is
    not true(0) (-45 is not greater than 0) hence no echo statement is skipped.

    And for last statement we have not supplied any argument here error .ispositive:
    test: -gt: unary operator expected , is generated by shell , to avoid such error
    we can test whether command line argument is supplied or not.


    test or [ [ expr ] works with

    1.Integer ( Number without decimal point)

    2.File types

    3.Character strings'
