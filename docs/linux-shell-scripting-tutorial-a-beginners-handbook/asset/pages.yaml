  md: '# # Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 5: Essential Utilities for Power User


    # # Selecting portion of a file using cut utility


    Suppose from *sname* file you wish to print name of student on-screen, then from
    shell (Your command prompt i. $) issue command as follows:


    ```

    $cut -f2 sname

    Vive

    Renuka

    Prakash

    Ashish

    Rani

    ```


    cut utility cuts out selected data from *sname* file. To select Sr.no. field from
    sname give command as follows:


    ```

    $cut -f1 sname

    11

    12

    13

    14

    15

    ```


    | Command | Explanation |

    | --- | --- |

    | cut | Name of cut utility |

    | -f1 | Using (-f) option, you are specifying the extraction field number. (In
    this example are its 1 i. first field) |

    | sname | File which used by cut utility and which is use as input for cut utility.
    |


    You can redirect output of cut utility as follows


    ```

    $cut -f2 sname > /tmp/sn.tmp.$\$

    $cut -f2 smark > /tmp/sm.tmp.$\$

    $cat /tmp/sn.tmp.$\$

    Vive

    Renuka

    Prakash

    Ashish

    Rani

    $cat /tmp/sm.tmp.$\$

    67

    55

    96

    36

    67

    ```'
