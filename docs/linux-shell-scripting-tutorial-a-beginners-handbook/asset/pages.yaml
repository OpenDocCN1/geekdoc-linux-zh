- img_proc: true
  md: "# Doing arithmetic with awk\n\nYou can easily, do the arithmetic with awk as\
    \ follows\n\n```\n$ cat > math\n{\n  print $1 \" + \" $2 \" = \" $1 + $2\n  print\
    \ $1 \" - \" $2 \" = \" $1 - $2\n  print $1 \" / \" $2 \" = \" $1 / $2\n  print\
    \ $1 \" x \" $2 \" = \" $1 * $2\n  print $1 \" mod \" $2 \" = \" $1 % $2\n}\n\
    ```\n\nRun the awk program as follows:\n\n```\n$ awk -f math\n20 3\n20 + 3 = 23\n\
    20 - 3 = 17\n20 / 3 = 6.666667\n20 x 3 = 60\n20 mod 3 = 2\n(Press Ctrl + D to\
    \ terminate)\n```\n\nIn above program print $1 \" + \" $2 \" = \" $1 + $2, statement\
    \ is used for addition purpose. Here $1 + $2, means add second field. Same way\
    \ you can do - (subtraction ), * (Multiplication), (Division), % (modular to find\
    \ remainder of division operation)."
