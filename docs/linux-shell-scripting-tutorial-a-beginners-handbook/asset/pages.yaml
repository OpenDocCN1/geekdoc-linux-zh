- img_proc: true
  md: '# Rules for Naming variable name (Both UDV and System Variable)


    (1) Variable name must begin with Alphanumeric character or underscore character
    (_), followed by one or more Alphanumeric character. For e.g. Valid shell variable
    are as follows


    ```

    HOME

    SYSTEM_VERSION

    vech

    ```


    (2) Don''t put spaces on either side of the equal sign when assigning value to
    variable. For e.g. In following variable declaration there will be no error


    ```

    $ no=10

    But there will be problem for any of the following variable declaration:

    $ no =10

    $ no= 10

    ```


    (3) Variables are case-sensitive, just like filename in Linux. For e.g.


    ```

    $ no=10

    $ No=11

    $ NO=20

    $ no=2

    ```


    Above all are different variable name, to print value 20 we have to use $ echo
    $NO and not any of the following


    ```

    $ echo $no # will print 10 but not 20

    $ echo $No # will print 11 but not 20

    $ echo $NO # will print 2 but not 20

    ```


    (4) You can define NULL variable as follows (NULL variable is which has no value
    at the time of definition) For e.g.


    ```

    $ vech="""

    ```


    Try to print it by value by issuing following command

    $ echo $vech

    Nothing will be shown because variable has no value i.e. NULL variable.


    (5) Do not use ?,*, etc, to name your variables.'
