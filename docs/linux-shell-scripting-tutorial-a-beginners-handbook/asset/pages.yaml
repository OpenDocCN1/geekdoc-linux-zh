  md: "# # Linux Shell Scripting Tutorial (LSST) v1.05r3\nChapter 7: awk Revisited\n\
    \nPrev Next\n\n# # Predefined variable of awk\n\nOur next example talks more about\
    \ predefined variable of awk. Create awk file as follows:\n\n```\n$cat > def_var\n\
    {\n  print \"Printing Rec. # NR \"(\\$0 \"),And # of field for this record is\
    \ \" NF\"\n}\n```\n\nRun it as follows.\n\n```\n$awk -f def_var inven\nPrinting\
    \ Rec. #1( Pen 5 20.00),And # of field for this record is 4\nPrinting Rec. #2(\
    \ Pencil 10 2.00),And # of field for this record is 4\nPrinting Rec. #3( Rubber\
    \ 3.5 30.00),And # of field for this record is 4\nPrinting Rec. #4( Cock 2 45.50),And\
    \ # of field for this record is 4\n```\n\nNR and NF are predefined variables of\
    \ awk which means Number of input Record, Number of Fields in input record respectively.\
    \ In example NR is changed as our input record changes, and NF is constant. Following\
    \ table shows list of such built in awk variables.\n\n| awk Variable | Meaning\
    \ |\n|---|---|\n| FILENAME | Name of current input file |\n| RS | Input record\
    \ separator character (Default is new line) |\n| OFS | Output field separator\
    \ string (Blank is default) |\n| ORS | Output record separator string (Default\
    \ is new line) |\n| NF | Number of input record |\n| NR | Number of fields in\
    \ input record |\n| OFMT | Output format of number |\n| FS | Field separator character\
    \ (Blank & tab is default) |\n\nPrev Home Next\nGetting Starting with awk Doing\
    \ arithmetic with awk"
  merge: -1
