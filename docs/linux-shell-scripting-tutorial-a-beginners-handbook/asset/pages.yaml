  md: '# # Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 4: Advanced Shell Scripting Commands


    # # User Interface and dialog utility-Part I


    Good program/script must interact with users. You can accomplish this as follows:

    (1) Use command line arguments (args) to script when you want interaction. pass
    command line arguments to script as : `$jutil.sh foo 4` where `foo & 4` are command
    line args passed to shell script `sutil.sh`.

    (2) Use statement like `echo` and `read` to read input variable from the prompt.
    For e.g. Write script as:


    ```

    $ cat > userinte

    # Script to demo echo and read command for user interaction

    #

    echo "Your good name please : "

    read na

    echo "Your age please : "

    read age

    neyr=`expr $age + 1`

    echo "Hello $na, next year you will be $neyr yrs old."

