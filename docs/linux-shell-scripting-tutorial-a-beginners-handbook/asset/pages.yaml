    \ sd=0\n# 3) Find single digit in sd as $n % 10 it will give (left most digit)\n\
    # 4) Construct reverse no as rev * 10 + sd\n# 5) Decrement n by 1\n# 6) If n is\
    \ greater than zero, if yes goto step 3, otherwise next step\n# 7) Print rev\n\
    \nif [ $# -ne 1 ];\nthen\n  echo \"Usage: $0 number\"\n  echo \"I will find reverse\
    \ of given number\"\n  echo \"For eg. $0 123, I will print 321\"\n  exit 1\nfi\n\
    \nn=$1\nrev=0\nsd=0\n\nwhile [ $n -gt 0 ];\ndo\n  sd=$(expr $n % 10)\n  rev=$(expr\
    \ $rev * 10 + $sd)\n  n=$(expr $n / 10)\ndone\n\necho \"Reverse number is $rev\"\
    \n\n#\n# ./ch.sh vivek-tech.com to nixcraft.com reference converted using this\
