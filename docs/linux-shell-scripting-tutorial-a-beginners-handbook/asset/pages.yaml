  md: '# Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 5: Essential Utilities for Power User


    # Removing duplicate lines using uniq utility


    Create text file personame as follows:


    personame


    Hello I am vivek

    12333

    12333

    welcome

    to

    sai computer academy, a''bad.

    what still I rememberber that name.

    oaky! how are u user?

    what still I rememberber that name.


    After creating file, issue following command at shell prompt


    ```

    $ uniq personame

    Hello I am vivek

    12333

    welcome

    to

    sai computer academy, a''bad.

    what still I rememberber that name.

    oaky! how are u user?

    what still I rememberber that name.

    ```


    Above command prints those lines which are unique. For e.g. our original file
    contains 12333 twice, so additional copies of 12333 is gone (Duplicate), and "if
    you examine output of uniq, you will notice that 12333 is "what still I rememberber
    that name" remains as is. Because the uniq utility compare only adjacent lines,
    duplicate lines must be next to each other in the file. To solve this problem
    you can can use command as follows


    ```

    $ sort personame | uniq

    ```


    General Syntax of uniq utility:

    Syntax:


    ```

    uniq {file-name}

    ```'
