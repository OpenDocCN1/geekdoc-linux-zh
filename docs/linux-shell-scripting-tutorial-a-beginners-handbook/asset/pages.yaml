    \ location/address called memory variable or variable (Its named storage location\
    \ that may take different values, but only one at a time).\n\n+   In Linux (Shell),\
    \ there are two types of variable:\n1) **System variables** - Created and maintained\
    \ by Linux itself. This type of variable defined in CAPITAL LETTERS.\n2) **User\
    \ defined variables (UDV)** - Created and maintained by user. This type of variable\
    \ defined in lower letters.\n\nYou can see system variables by giving command\
    \ like `$ set`, some of the important System variables are: \n\n| System Variable\
    \ | Meaning |\n| --- | --- |\n| BASH=/bin/bash | Our shell name |\n| BASH_VERSION=1.14.7(1)\
