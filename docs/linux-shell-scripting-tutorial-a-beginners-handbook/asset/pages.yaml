  md: '# # Linux Shell Scripting Tutorial (LST) v1.05r3

    Chapter 4: Advanced Shell Scripting Commands


    #  /dev/null - Use to send unwanted output of program


    This is a special Linux file which is used to send any unwanted output from program/command.

    Syntax:

    command > /dev/null


    Example:

    $ ls > /dev/null

    Output of above command is not shown on screen its send to this special file.
    The /dev directory contains other file. The files in this directory mostly represent
    peripheral devices such as floppy disk, sound card, line printers etc. See the
    [file system tutorial]() for more information on Linux disk, partition and file
    system.


    Future Point:

    Run the following two commands


    ```

    $ ls > /dev/null

    $ rm > /dev/null

    ```


    1) Why the output of last command is not redirected to /dev/null device?'
