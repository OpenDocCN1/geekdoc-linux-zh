    # # Why Command Line arguments required


    +   1. Telling the command/utility option to use.

    2. Informing the utility/command which file or group of files to process (reading/writing
    of files).


    Let''s take rm command, which is used to remove file, but which file you want
    to remove and how we tell this to rm command (even rm command don''t ask you of
    file that you would like to remove). So what do we write command as follows:


    ```

    $ rm (file-name)

    ```


    Here rm is command and filename is file which you would like to remove. This way
    tail rm command which is file which you would like to remove. So we are doing
    one way communication with our command by specifying filename. You can also pass
    command line arguments to your script to make it more users friendly. But how
    we access command line argument in our script.


    Lets take ls command


    ```

    $ ls -a/*

    This command has 2 command line argument -a and /* is another one. For shell script,

    $ myshell foo bar

    ```


    ![](img/219cb7c6e1c9c4c56d73838282f4b69b_43_0.png)


    +   1 Shell Script name i.e. myshell


    +   2 First command line argument passed to myshell i.e. foo


    +   3 Second command line argument passed to myshell i.e. bar


    In shell if we wish to refer this command line argument we refer above as follows


    ```

    myshell it is $0

    ```


    ```

    foo it is $1

    ```


    ```

    bar it is $2

    ```'
