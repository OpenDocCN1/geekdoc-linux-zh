    # # What is Shell Script ?


    Normally shells are interactive. It means shell accept accept command from you
    (via keyboard) and execute them. But if you use command one by one (sequence of
    ''n'' number of commands) , you can store this sequence of command to text file
    and tell the shell to execute this text file instead of entering the commands.
    This is know as *shell script*.


    Shell script defined as:


    "Shell Script is *series of command written in in plain text file*. Shell script
    is just like batch file is MS-DOS but have more power than the MS-DOS batch file."


