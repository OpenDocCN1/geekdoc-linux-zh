  md: "# lsdir1 = \" -d $1 ]\"\n\nThis expression is quite tricky. Its something as\
    \ follows:\nlsdir1 = [ -d $1 ]\nWhich means see if directory exists using [ expr\
    \ ]. As you know [ expr ] is used to test whether expr is true or not.\nSo we\
    \ are testing whether directory exists or not.\nWhat does $1 mean? In awk $1 is\
    \ the first field.\n\n# lsdir2 = \" -d $2 ]\"\n\nAs above except test for second\
    \ field as\nlsdir2 = [ -d $2 ]\ni.e. Whether second field is directory or not.\n\
    \n```\nscriptname = \"up2low\"\nawkscriptname = \"rename.awk\"\nsfile = $1\ndfile\
    \ = $2\n```\n\nOur shell script name (up2low) and awk script name (rename.awk).\n\
    Source file\nDestination file\n\n```\nif ( sfile == scriptname || sfile == awkscriptname\
    \ )\nnext\n\nif ( system(lsdir1) == 0 || system(lsdir2) == 0 )\n{\n    printf\
    \ \"%s or %s is directory can't rename it to lower case\\n\",sfile,dfile\n   \
    \ next # continue with next recored\n```\n\nMake so we don't accidentally rename\
    \ our own scripts, if scripts are in current working directory\nMake source or\
    \ destination are files and not the directory. We check this using [ expr ] command\
    \ of bash. From the awk script you called or invoke (as official we we called\
    \ it the [ expr ] if directory exists it will return true (indicated by zero)\
    \ and if not it will return nonzero value.\n\n```\nelse if ( sfile == dfile )\n\
    {\n    printf \"Skipping, \\%s\\\" is already in lowercase\\n\",sfile\n    next\n\
    }\n```\n\nIf both source and destination file are same, it mean file already in\
    \ lowercase no need to rename it to lower case."
