  md: '```

    $ awk ''{ print $2 }'' inven

    ```


    Pen

    Pencil

    Rubber

    Cock


    awk prints second field from file. Same way if you want to print second and fourth
    field from file then give following command:


    ```

    $ awk ''{ print $2 $4 }'' inven

    ```


    Pen20.00

    Pencil20.00

    Rubber3.50

    Cock45.00


    $0 is special variable of awk , which print entire record, you can verify this
    by issuing following awk command:


    ```

    $ awk ''{ print $0 }'' inven

    ```


    +   1. Pen 5 20.00

    2. Pencil 10 2.00

    3. Rubber 3 3.50

    4. Cock 2 45.50


    You can also create awk command (program) file as follows:


    ```

    $ cat > prn_pen

    /Pen/ { print $3 }

    ```


    And then you can execute or run above "prn_pen" awk command file as follows


    ```

    $ awk -f prn_pen inven

    5

    10

    ```


    In above awk program /Pen/ is the search pattern, if this pattern is found on
    line (or record) then print the third field of record.\ [ print $3 ] is called
    Action. On shell prompt, $ awk -f prn_pen inven, -f option instruct awk, to read
    its command from given file, inven is the name of database file which is taken
    as input for awk.


    Now create following awk program as follows:


    ```

    $ cat > comp_inv

    3 > 5 { print $0 }

    ```


    Run it as follows:


    ```

    $ awk -f comp_inv inven

    2. Pencil 10 2.00

    ```


    Here third field of database is compared with 5, this the pattern. If this pattern
    found on any line database, then entire record is printed.'
