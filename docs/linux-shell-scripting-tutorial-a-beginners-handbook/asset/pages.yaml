  md: '# # Wild cards (Filename Shorthand or meta Characters)


    | Wild card /Shorthand | Meaning | Examples |

    | --- | --- | --- |

    | * | Matches any string or group of characters. | $ ls * will show all files<br>$
    ls a* will show all files whose first name is starting with letter ''a''<br>$
    ls *.c will show all files having extension .c<br>$ ls ut*.c will show all files
    having extension .c but file name begin with ''ut''. |

    | ? | Matches any single character. | $ ls ? will show all files whose names are
    1 character long<br>$ ls fo? will show all files whose names are 3 character long
    and file name begin with 0 |

    | [...] | Matches any one of the enclosed characters | $ ls [abc]* will show all
    files beginning with letters a,b,c |


    **Note:**

    -[...] A pair of characters separated by a minus sign denotes a range.


    **Example:**

    $ ls /bin/[a-c]*

    Will show all name beginning with letter a,b or c like


    ```

    /bin/arch /bin/awk /bin/bsh /bin/chmod /bin/cp

    /bin/ash /bin/basename /bin/cat /bin/chown /bin/cpio

    /bin/static /bin/bash /bin/chgrp /bin/consolechars /bin/csh

    ```


    **But**

    $ ls /bin/[!a-o]*

    $ ls /bin/[^a-o]*

    If the first character following the [ is a ! or a ^, then any character not enclosed
    is matched i. do not show file name beginning with a,b,c,e...o, like'
