    | To save file with file name (save as) | esc : + w "filename" |

    | To quit the vi | esc : + q |

    | To quit without saving | esc : + q! |

    | To save and quit vi editor | esc : + wq |

    | To search for specified word in forward direction | esc + / (Press ''escape''
    key, type-to-find, for e.g. to find word ''shri'', type as /shri) |

    | To continue with search | n |

