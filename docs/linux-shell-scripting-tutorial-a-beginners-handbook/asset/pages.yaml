    My brother Vikrant also loves linux who also loves unix.

    He currently learn linux.

    Linux is cooool.

    Linux is now 10 years old.

    Next year linux will be 11 years old.

    Rani my sister never uses Linux.

    . (DOT) is special command of linux.


    Here a ta list of characters using [ and ], which matches any single character
    in that range. if the first character of list is ^, then it matches any character
    not in the list. In example [Li], will try to match L or l with rest of pattern.
    Let''s see another example. Suppose you want to match single digit character in
    range you can give command as follows

    /:[0123456789]


    Even you can try it as follows

    :/g[0-9]

    Linux is now 10 years old.

    Next year linux will be 11 years old.


    Here range of digit is specified by giving first digit (0-zero) and last digit
    (1), separated by hyphen. you can try [a-z] for lowercase character, [A-Z] for
    uppercase character. Not just this, there are certain named classes of characters
    which are predefined. They are as follows:


    | Predefined classes of characters | Meaning |

    |---|---|

    | [:alnum:]] | Letters and Digits (A to Z or a to z 0 to 9) |

    | [[:alpha:]] | Letters A to Z or a to z |

    | [[:cntrl:]] | Delete character or ordinary control character (0x7F or 0x00 to
    0x1F) |'
