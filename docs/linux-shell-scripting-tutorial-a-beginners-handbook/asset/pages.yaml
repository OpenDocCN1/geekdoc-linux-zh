  md: "Note: This file is part of Linux Shell Scripting Tutorial, and contains many\
    \ Linux/Unix definition, miscellaneous concepts and answer to many shell scripts\
    \ exercise section.\n\n# Free\n\nLinux is free.\n\nFirst ,Its available free of\
    \ cost (i.e. when you don't have to pay to use this OS, other OSes like MS-Windows\
    \ or Commercial version of Unix may cost you money)\n\nSecond free means freedom\
    \ to use Linux, i.e. when you get Linux you will also get source code of Linux,\
    \ so you can modify OS (Yes! Linux OS!!) according to your taste.\n\nIt also offers\
    \ many Free Software applications, programming languages, and development tools\
    \ etc. Most of the Program/Software/OS are under GNU General Public License (GPL).\n\
    \n![](img/219cb7c6e1c9c4c56d73838282f4b69b_227_0.png)\n\n# Unix Like\n\nUnix is\
    \ almost 35 year old Os.\n\nIn 1964 OS called MULTICS (Multiplexed Information\
    \ and Computing System) was developed by Bell Labs, MIT & General Electric. But\
    \ this OS was not the successful one.\n\nThen Ken Thompson (System programmer\
    \ of Bell Labs) thinks he could do better in 1991, Linux Torvalds feels he could\
    \ better than Minix - History repeats itself). So Ken Thompson wrote OS on PDP\
    \ - 7 Computer, assembler and few utilities, this is us as Unix (1969). This version\
    \ of Unix is not portable. But Unix was rewrote in C. Because written in 'C',\
    \ it is portable. It means Unix can run on variety of Hardware platform (1970-71).\n\
    \nAt the time Unix was started to distribute to Universities. Students and professor\
    \ started more experiments on Unix. Because of this gain more popularity, also\
    \ several new features are added to Unix. Then govt. & military used Unix for\
    \ inter-network (now it is known as INTERNET).\n\nSo Unix is Multi-user, Multitasking,\
    \ Internet-aware Network OS. Linux almost had same Unix Like feature for e.g.\n\
    \n+   * Like Unix, Linux is also written in C.\n* Like Unix, Linux is also the\
    \ Multi-user/Multitasking/32 or 64 bit Network OS.\n* Like Unix, Linux is rich\
    \ in Development/Programming environment.\n* Like Unix, Unix runs on different\
    \ hardware platform; for e.g.\n  * Intel x86 processor (Celeron/PIII/PIV/OD-Pentiums/80386/80486)\n\
    \  * Macintosh PC's"
