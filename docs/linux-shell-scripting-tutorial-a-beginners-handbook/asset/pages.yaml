    All the shell script can be explained as follows:


    | Command(s)/Statements | Explanation |

    |---|---|n| while ["$1" ]

    do | Begins the while loop; continue the while loop as as long as script reads
    the all command line option |

    | if ["$1" = "-b" ]; then ob="$2" | Now start to parse the command line (args)
    using if command or our script understands the -b and -n options only if other
    option are invalid. If option is -b then stores the value of second command line
    arg to variable ob (i.e. if arg is -b16 then store the 16 to ob) |

    | case $ob in

    16) basesystem="Hex";;

    8) basesystem="Oct";;

    2) basesystem="bin";;

    *) basesystem="Unknown";;

    esac | For easy understanding of conversion we store the respective number base
    systems corresponding string to basesystem variable. If base system is 16 then
    store the Hex to basesystem and so on. This is done using case statement |

    | shift 2 | Once first two command line options (args) are read, we need next
    two command line option (args). shift 2 will moves the current values stored in
    the positional parameters (command line args) to the left two position. |'
