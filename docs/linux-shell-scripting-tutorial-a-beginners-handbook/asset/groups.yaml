    \ manipulation/scripting programming language (In fact based on the C programming\
    \ Language). Use awk to handle complex task such as calculation, database handling,\
    \ report creation etc.\n\nGeneral Syntax of awk:\n\nSyntax:\nawk -f [awk program\
    \ file] filename\n\nawk Program contains are something as follows:\n\n```\nPattern\
    \ {\n  action 1\n  action 2\n  action N\n}\n```\n\nawk reads the input from given\
    \ file (or from stdin) one line at a time, then each line is compared with pattern.\
    \ If pattern match for each line then given action is taken. Pattern can be regular\
    \ expressions. Following is the summary of common awk metacharacters:\n\n| Metacharacter\
    \ | Meaning |\n| . (Dot) | Match any character |\n| * | Match zero or more character\
    \ |\n| ^ | Match beginning of line |\n| $ | Match end of line |\n| \\ | Escape\
    \ character following |\n| [ ] | List |\n| ( ) | Match range of instance |\n|\
    \ + | Match one more preceding |\n| ? | Match zero or one preceding |\n| | Separate\
