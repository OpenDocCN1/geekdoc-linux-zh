- md: "\n# Loops in Shell Scripts\n\n# Linux Shell Scripting Tutorial (LSST) v1.05r3\n\
    \n# while loop\n\nSyntax:\n\n```\nwhile [ condition ]\ndo\n    command1\n    command2\n\
    \    command3\n    ..\n    ...\ndone\n```\n\nLoop is executed as long as condition\
    \ is true. For e.g. [Above for loop program](shown in last section of for loop)\
    \ can be written using while loop as:\n\n```bash\n$cat > ntl\n#!/bin/sh\n#\n#Script\
    \ to test while statement\n#\n#\nif [ $# -eq 0 ]\nthen\n    echo \"Error - Number\
    \ missing form command line argument\"\n    echo \"Syntax : $0 number\"\n    echo\
    \ \"Use to print multiplication table for given number\"\n    exit 1\nfi\nn=$1\n\
    i=1\nwhile [ $i -le 10 ]\ndo\n    echo \"$n $i = `expr $i \\* $n`\"\n    i=`expr\
    \ $i + 1`\ndone\n```\n\nSave it and try as\n$ chmod 755 ntl\n$ntl 7\n\nAbove loop\
    \ can be explained as follows:\n\n# LSST v1.05r > Chapter 3 > The case Statement\n\
    \n| n=$1 | Set the value of command line argument to variable n. (Here it's set\
    \ to 7 ) |\n| i=1 | Set variable i to 1 |\n| while [ $i -le 10 ] | This is our\
    \ loop condition, here if value of i is less than 10, shell execute all statements\
    \ between do and done |\n| do | Start loop |\n| echo \"$n * $i=`expr $i \\$ $n`\"\
    \ | Print multiplication table as<br>*7 * 1 = 7<br>*7 * 2 = 14<br>*...<br>*7 *\
    \ 10 = 70, Here each time value of variable n is multiply be i. |\n| i=`expr $i\
    \ + 1` | Increment i by 1 and store result to i. ( i.e. i=i+1)<br>**Caution:**\
    \ If you ignore (remove) this statement than our loop become infinite loop because\
    \ value of variable i always remain less than 10 and program will only output<br>*7\
    \ * 1 = 7<br>*...<br>*E (infinite times) |\n| done | Loop stops here if i is not\
    \ less than 10 i.e. condition of loop is not true. Hence loop is terminated. |\n\
    \n# The case statement\n\nThe case statement is good alternative to Multilevel\
    \ if-then-else-fi statement. It enable you to match several values against one\
    \ variable. Easier to read and write.\n\nSyntax:\n\n```bash\ncase $variable-name\
    \ in\n    pattern1) command\n        ..\n        command;;\n    pattern2) command\n\
    \        ..\n        command;;\n    patternN) command\n        ..\n        command;;\n\
    \    *) command\n        ..\n        command;;\nesac\n```\n\nThe $variable-name\
    \ is compared against the patterns until a match is found. The shell then executes\
    \ all the statements up to the two semicolons that are next to each other. The\
    \ default is *) and its executed if no match is found. For e.g. write script as\
    \ follows: \n\n```bash\n$ cat > car\n# if no vehicle name is given\n# i.e. -z\
    \ $1 is defined and it is NULL\n# if no command line arg\nif [ -z $1 ]\nthen\n\
    \    rental=\"**** Unknown vehicle ****\"\nelif [ -n $1 ]\nthen\n    # otherwise\
    \ make first arg as rental\nrental=$1\nfi\n```\n\n```bash\ncase $rental in\n \
    \ \"car\") echo \"For $rental Rs.20 per k/m\";\n  \"van\") echo \"For $rental\
    \ Rs.10 per k/m\";\n  \"jeep\") echo \"For $rental Rs.5 per k/m\";\n  \"bicycle\"\
    ) echo \"For $rental 20 paisa per k/m\";\n  *) echo \"Sorry, I cannot get a $rental\
    \ for you\";\nesac\n```\n\nSave it by pressing CTRL+D and run it as:\n\n```bash\n\
    $ chmod +x car\n$ car van\n$ car car\n$ car Maruti-800\n```\n\nFirst script will\
    \ check, if $1(first command line argument) is given or not, NOT set value of\
    \ rental variable to \"\"\" Unknown vehicle ***\"\",if command line arg is supplied/given\
    \ value of rental variable to given value (command line arg). The $rental is compared\
    \ against the patterns until a match is found.\n\nFor first test run its match\
    \ with and it will output \"For van Rs.10 per k/m.\".\n\nFor second test run print,\
    \ \"For car Rs.20 per k/m\".\n\nAnd for last run, there is no match for Maruti-800,\
    \ hence default i.e. *) is executed and prints, \"Sorry, I cannot get a Maruti-800\
    \ for you.\nNote that esac is always required to indicate end of case statement.\n\
    \nSee the one more example of case statement in chapter 4 of section shift command.\n\
    \n# How to de-bug the shell script?\n\n# Linux Shell Scripting Tutorial (LSST)\
    \ v1.05r3\nChapter 3: Shells (bash) structured Language\n\n## How to de-bug the\
    \ shell script?\n\nWhile programming shell sometimes need to find errors (bugs)\
    \ in shell script and correct errors (remove errors - debug). For this purpose\
    \ you can use -v and -x option with sh or bash command to debug shell script.\
    \ General syntax is as follows:\n\nSyntax:\n\nsh option { script-name }\n\nOR\n\
    \nbash option { script-name }\n\nOption can be:\n-v Print shell input lines as\
    \ read.\n-x After expanding simple-command, bash displays expanded value of shell\
    \ variable, followed by the command and its expanded arguments.\n\nExample:\n\n\
    ```bash\n$ cat > dsh1.sh\n#\n# Script to show debug of shell\n#\ntot=`expr $1\
    \ + $2`\n```\n\nPress ctrl+D to save, and run it as\n$ chmod 755 dsh1.sh\n$ ./dsh1.sh\
    \ 4 5\n\n```bash\n$ sh -x dsh1.sh\n4 5\n# Script to show debug of shell\n#\ntot=`expr\
    \ $1 + $2`\n+ tot=9\n+ echo 9\n```\n\nSee the above output, -x shows exact values\
    \ of variables (or statements are shown on screen).\n\nLSST v1.05r > Chapter 3\
    \ > How to debug the shell script?\n\n```bash\n$ sh -v dsh1.sh\n4 5\n```\n\nUse\
    \ -v option to debug complex shell script.\n\n# Advanced Shell Scripting\n\n#\
    \ Linux Shell Scripting Tutorial (LSST) v1.05r3\nChapter 4: Advanced Shelling\
    \ Commands\n\n# Introduction\n\nAfter learning basis of shell scripting, its to\
    \ learn more features of shell scripting such as:\n- Functions\n- User interface\n\
    - Conditional execution\n- File Descriptors\n- traps\n- Multiple line args handling\n\
    \n# /dev/null - to send unwanted output\n\n# Linux Shell Scripting Tutorial (LSST)\
    \ v1.05r3\nChapter 4: Advanced Shelling Commands\n\n# /dev/null - Use to send\
    \ unwanted output of program\n\nThis is a special Linux file which is used to\
    \ send any unwanted output from program/command.\nSyntax:\ncommand > /dev/null\n\
    \nExample:\n$ ls > /dev/null\nOutput of above command is not shown on screen.\
    \ The directory mostly represents peripheral devices such as floppy disk, sound\
    \ card, line printers etc. See the file system tutorial for more information on\
    \ Linux disk, partition and file system.\n\nFuture Point:\nRun the following two\
    \ commands\n\n```bash\n$ ls > /dev/null\n$ rm > /dev/null\n```\n\n1) Why the output\
    \ of last command is not redirected to /dev/null device?\n\n# Linux Shell Scripting\
    \ Tutorial (LSST) v1.05r3\nChapter 4: Advanced Shelling Commands\n\n# Local and\
    \ Global Shell variable (export command)\n\nNormally our variables are local.\
    \ Local variable can be used in same shell, if you load another copy of shell\
    \ (by typing /bin/bash at the $ prompt) then new shell ignored all shell's variable.\
    \ For e.g. Consider following example\n\n```bash\n$ vech=Bus\n$ echo $vech\nBus\n\
    $ /bin/bash\n$ echo $vech\n```\n\nNOTE:-Empty line printed\n$ vech=Car\n$ echo\
    \ $vech\nCar\n$ exit\n$ echo $vech\nBus\n\n| Command | Meaning |\n|---|---|\n\
    | $ vech=Bus | Create new local variable 'vech' with Bus value in first shell\
    \ |\n| $ echo $vech | Print the contains of variable vech |\n| /bin/bash | Now\
    \ load second shell in memory (Which ignores all old shell's variable) |\n| $\
    \ echo $vech | Print the contains of variable vech |\n| $ vech=Car | Create new\
    \ local variable 'vech' with Car as value in second shell |\n| $ echo $vech |\
    \ Print the contains of variable vech |\n| $ exit | Exit from second shell to\
    \ first shell |\n| $ echo $vech | Print the contains of variable vech (Now you\
    \ can see first shells variable and its value) |\n\nGlobal shell defined as:\n\
    \"You can copy old shell's variable to new shell (i.e. first shells variable to\
    \ seconds shell), such variable know as Global Shell variable.\"\n\nTo set global\
    \ variable you have to use command.\nSyntax:\nexport variable1,variable2,......variableN\n\
    \nLSST v1.05 > Chapter 4 > Local and Global Shell variable (export command)\n\n\
    Examples:\n$ vech=Bus\n$ echo $vech\nBus\n$ export vech\n$ /bin/bash\n$ echo $vech\n\
    Bus\n$ exit\n$ echo $vech\nBus\n\n| Command | Meaning |\n|---|---|\n| $ vech=Bus\
    \ | Create new local variable 'vech' with Bus as value in first shell |\n| $ echo\
    \ $vech | Print the contains of variable vech |\n| $ export vech | Export first\
    \ shells variable to second shell i.e. global variable if they are exported |\n\
    | $ /bin/bash | Now load shell in memory (Old shell's variable is accessed from\
    \ second shell, |\n| $ echo $vech | Print the contains of variable vech |\n| $\
    \ exit | Exit from second shell return to first shell |\n| $ echo $vech | Print\
    \ the contains of variable vech |\n"
  mdcn: "\n\n# Shell 脚本中的循环\n\n# Linux Shell 脚本教程 (LSST) v1.05r3\n\n# while 循环\n\n\
    语法：\n\n```\nwhile [ condition ]\ndo\n    command1\n    command2\n    command3\n\
    \    ..\n    ...\ndone\n```\n\n只要条件为真（true），循环就会执行。例如：[上面的 for 循环程序](见 for 循环节节的最后部分）可以使用\
    \ while 循环写为：\n\n```bash\n$cat > ntl\n#!/bin/sh\n#\n#测试 while 语句的脚本\n#\n#\nif\
    \ [ $# -eq 0 ]\nthen\n    echo \"Error - 命令行参数缺少数字\"\n    echo \"Syntax : $0 number\"\
    \n    echo \"用于打印指定数字的乘法表\"\n    exit 1\nfi\nn=$1\ni=1\nwhile [ $i -le 10 ]\n\
    do\n    echo \"$n $i = `expr $i \\* $n`\"\n    i=`expr $i + 1`\ndone\n```\n\n\
    保存并尝试运行：\n$ chmod 755 ntl\n$ntl 7\n\n上述循环可以解释如下：\n\n# LSST v1.05r > 第3章 > case\
    \ 语句\n\n| n=$1 | 将命令行参数的值赋值给变量 n。（这里设置为 7） |\n| i=1 | 将变量 i 设置为 1 |\n| while [\
    \ $i -le 10 ] | 这是我们的循环条件，在这里，如果 i 的值小于 10，shell 就会执行 do 和 done 之间的所有语句 |\n| do\
    \ | 开始循环 |\n| echo \"$n * $i=`expr $i \\$ $n`\" | 打印乘法表如<br>*7 * 1 = 7<br>*7 *\
    \ 2 = 14<br>*...<br>*7 * 10 = 70，这里每次变量 n 的值都会乘以 i。 |\n| i=`expr $i + 1` | 将 i\
    \ 加 1 并结果存储到 i 中。（即 i=i+1）<br>**注意：** 如果你忽略（删除）这条语句，我们的循环将变成死循环，因为变量 i 的值将始终小于\
    \ 10，程序将只输出<br>*7 * 1 = 7<br>*...<br>*E（无限次） |\n| done | 如果 i 不小于 10（即循环条件为假），循环在此停止。因此循环终止。\
    \ |\n\n# case 语句\n\ncase 语句是多级 if-then-else-fi 语句的好替代方案。它允许你将一个变量与多个值进行匹配。更容易读和写。\n\
    \n语法：\n\n```bash\ncase $variable-name in\n    pattern1) command\n        ..\n\
    \        command;;\n    pattern2) command\n        ..\n        command;;\n   \
    \ patternN) command\n        ..\n        command;;\n    *) command\n        ..\n\
    \        command;;\nesac\n```\n\n将 $variable-name 与模式（patterns）进行比较，直到找到匹配项。然后\
    \ shell 执行直到两个相邻的分号为止的所有语句。默认是 *)，当未找到匹配项时执行它。例如，编写如下脚本： \n\n```bash\n$ cat >\
    \ car\n# 如果没有给定的车辆名称\n# 即 -z $1 被定义为空 (NULL)\n# 如果没有命令行参数\nif [ -z $1 ]\nthen\n\
    \    rental=\"**** 未知车辆 ****\"\nelif [ -n $1 ]\nthen\n    # 否则将第一个参数作为租赁价格\nrental=$1\n\
    fi\n```\n\n```bash\ncase $rental in\n  \"car\") echo \"租赁 $rental 每公里 20 卢比\"\
    ;\n  \"van\") echo \"租赁 $rental 每公里 10 卢比\";\n  \"jeep\") echo \"租赁 $rental 每公里\
    \ 10 卢比\";\nesac\n```\n\n"
