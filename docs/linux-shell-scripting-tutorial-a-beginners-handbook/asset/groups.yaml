    # 命令行处理


    尝试运行以下命令（假设你的系统中不存在 "grate_stories_of" 文件）

    **$ ls grate_stories_of**


    它将打印出类似 `ls: grate_stories_of: No such file or directory` 的消息。


    **ls** 是一个*实际命令*的名称，当你在 shell 提示符下输入该命令时，shell 就会执行该命令。现在我们产生了一个新问题：**什么是命令？**
    当你输入 **$ ls grate_stories_of** 时发生了什么？


    命令行中的第一个单词是 **ls** - 即要执行的命令名称。命令行中的其他所有内容都被视为*该命令的参数*。例如：

    **$ tail +10 myf**


    命令名称是 **tail**，参数是 **+10 和 myf**。


    练习

    尝试从以下命令中确定命令和参数：


    - $ ls foo

    - $ cp y y.bak

