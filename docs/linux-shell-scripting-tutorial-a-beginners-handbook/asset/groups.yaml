    ## 使用 uniq 工具删除重复行


    创建如下文本文件 personame：


    personame

    Hello I am vivek

    12333

    12333

    welcome

    to

    sai computer academy, a''bad.

    what still I rememberber that name.

    oaky! how are u user?

    what still I rememberber that name.


    创建文件后，在 shell 提示符执行以下命令：


    ```

    $ uniq personame

    Hello I am vivek

    12333

    welcome

    to

    sai computer academy, a''bad.

    what still I rememberber that name.

    oaky! how are u user?

    what still I rememberber that name.

    ```


    上述命令打印唯一的行。例如，我们的原始文件包含两次 12333，因此多出的 12333 副本被删除了（重复），如果你检查 uniq 的输出，你会发现 12333
    之外的 "what still I rememberber that name" 保持原样。因为 uniq 工具只比较相邻行，重复行必须在文件中相邻。要解决这个问题，你可以使用如下所示命令：


    ```

    $ sort personame | uniq

    ```


    uniq 工具的通用语法：

    语法：


    ```

    uniq {file-name}

    ```


