- md: "\n```bash\nif [ $osch -eq 2 ]; then\n    echo \"You Pick up Linux (Red Hat)\"\
    \nelse\n    echo \"What you don't like Unix/Linux OS.\"\nfi\nfi\n```\n\nRun the\
    \ above shell script as follows:\n$ chmod +x nestestif.sh\n./nestif.sh\n\n+  \
    \ 1. Unix (Sun Os)\n2. Linux (Red Hat)\nSelect you os choice [1 or 2]? i\nYou\
    \ Pick up Unix (Sun Os)\n\n+   $ ./nestif.sh\n1. Unix (Sun Os)\n2. Linux (Red\
    \ Hat)\nSelect you os choice [1 or 2]? 2\nYou Pick up Linux (Red Hat)\n\n+   $\
    \ ./nestif.sh\n1. Unix (Sun Os)\n2. Linux (Red Hat)\nSelect you os choice [1 or\
    \ 2]? 3\nWhat you don't like Unix/Linux OS.\n\nNote that Second if-else/Unix const\
    \ is nested in the first else statement. If the condition in the first if statement\
    \ is false the condition in the second if statement is checked. If it is false\
    \ as well the final else statement is executed.\n\nYou can use the nested ifs\
    \ as follows also:\nSyntax:\n\n```bash\nif condition\nthen\n    if condition\n\
    \        then\n            ....\n            ..\n        do this\n    else\n \
    \       ....\n        do this\n    fi\nelse\n```\n\n```bash\n...\n....\ndo this\n\
    fi\n```\n\nPrev test command or [ expr ]\n\nHome\n\nNext\n\nUp\n\nMultilevel if-then-else\n\
    \n## Multilevel if-then-else\n\nSyntax:\n\n```bash\nif condition\n    condition\
    \ is zero (true - 0)\nthen\n    execute all commands up to elif statement\nelif\
    \ condition1\nthen\n    condition1 is zero (true - 0)\n    execute all commands\
    \ up to elif statement\nelif condition2\nthen\n    condition2 is zero (true -\
    \ 0)\n    execute all commands up to elif statement\nelse\n    None of the above\
    \ condition,cond1,cond2 are true (i.e. all of the above nonzero or false)\nfi\n\
    ```\n\nFor multilevel if-then-else statement try the following script:\n\n```bash\n\
    $ cat > elf\n#\n#!/bin/sh\n# Script to test ..if..elif...else\n#\nif [ $1 -gt\
    \ 0 ]; ; then\n    echo \"$1 is positive\"\nelif [ $1 -lt 0 ]\nthen\n    echo\
    \ \"$1 is negative\"\nelif [ $1 -eq 0 ]\nthen\n    echo \"$1 is zero\"\nelse\n\
    \    echo \"Oops! $1 is not number, give number\"\nfi\n```\n\nTry above script\
    \ as follows:\n\n```bash\n$ chmod 755 elf\n$ elf 1\n$ $elf -2\n$ $elf 0\n$ $elf\
    \ a\n```\n\nHere o/p for last sample run:\n./elf: [: -gt: unary operator expected\n\
    ./elf: [: -lt: unary operator expected\n./elf: [: -eq: unary operator expected\n\
    Oops! a is not a number, give number\n\nAbove program gives error for last run,\
    \ here integer comparison is expected therefore error like './elf: -gt: unary\
    \ operator expected' occurs, but still our program notify this error to user by\
    \ providing message \"Oops! a is not a number, give number\".\n\nPrev\n\nHome\n\
    \nNext\n\nUp\n\nif...else...fi\n\nLoops in Shell Scripts\n\n# Linux Shell Scripting\
    \ Tutorial (LSST) v1.05r3\nChapter 3: Shells (bash) structured Language Constructs\n\
    \n## Loops in Shell Scripts\n\nLoop defined as:\n\n> \"Computer can repeat particular\
    \ instruction again and again, until particular condition satisfies. A group of\
    \ instruction that is executed repeatedly is called a loop.\"\n\nBash supports:\n\
    \n- for loop\n- while loop\n\n**Note** that in each and every loop,\n\n(a) First,\
    \ the variable used in loop condition must be deined, then execution of the loop\
    \ begins.\n\n(b) A test (condition) is made at the beginning of each iteration.\n\
    \n(c) The body of loop ends with a statement that modifies the value of the test\
    \ (condition) variable.\n\nMultilevel if-then-else\n\n# Linux Scripting Tutorial\
    \ (LSST) v1.05r3\n\nPrev\n\nChapter 3: Shells (bash) structured Language Constructs\n\
    \nNext\n\n## for Loop\n\nSyntax:\n\n```bash\nfor { variable name } in { list }\n\
    do\n    execute for each item in the list until the list not finished (And repeat\
    \ all statement between do done)\ndone\n```\n\nBefore to understand above syntax\
    \ by try following script:\n\n```bash\n$ cat > testfor\nfor i in 1 2 3 4 5\ndo\n\
    \    echo \"Welcome $i times\"\ndone\n```\n\nRun it above script as follows:\n\
    \n```bash\n$ chmod +x testfor\n./testfor\n```\n\nThe for loop creates i variable\
    \ and assigned a number to i from the list of number The shell will execute echo\
    \ statement for each assignment of i. (This is usually known as iteration) This\
    \ process will continue until all the items in list were not finished because\
    \ of this it will repeat echo statements. To make you more clear try following\
    \ script:\n\n```bash\n$ cat > mtable\n!/bin/sh\n#\nScript to test for loop\n#\n\
    if [ $# -eq 0 ]\nthen\necho \"Error - Number missing command argument\"\necho\
    \ \"Syntax : Use to print multiplication table for given number\"\nexit 1\nfi\n\
    n=$1\nfor i in 12 3 4 5 6 7 8 9 10\ndo\n    echo \"$n * $i\"\ndone\n```\n\nSave\
    \ above script and run it as:\n\n```bash\n$ chmod 755 mtable\n./mtable\n```\n\n\
    For first run, above script multiplication table of number where i = 1, ... 10\
    \ is multiplied by n (here) to produce multiplication table:\n\n7 * 1 = 7\n7 *\
    \ 2 = 14\n...\n7 * 10 = 70\n\nAnd for second run, it will print message - Error\
    \ - Number command line argument happened because we have not supplied given number\
    \ for we want multiplication table, Hence script is showing Syntax and usage of\
    \ our script. This is good idea our program takes some argument, let the user\
    \ know how to use of our script. **Note** that to terminate our script we used\
    \ 'exit 1' command which takes argument (indicates error and therefore script\
    \ is terminated)\n\nEven you can use the following syntax:\n\nSyntax:\n\n```bash\n\
    for (( expr1; expr2; expr3 ))\ndo\n    repeat all statements between do until\
    \ expr2 is TRUE\ndone\n```\n\nIn above script BEFORE the first iteration, *expr1*\
    \ is evaluated. This is usually used to initialize variables for the loop. All\
    \ the statements between do and done is executed repeatedly UNTIL the value of\
    \ *expr2* is TRUE. AFTER each iteration of the loop, *expr3* is evaluated. This\
    \ is usually used to increment loop counter.\n\n```bash\n$ cat > for2\nfor ((\
    \ i = 0; i <= 5; i++ ))\ndo\necho \"Welcome $i times\"\ndone\n```\n\nRun the above\
    \ script as follows:\n$ chmod +x for2\n./for2\n\nWelcome 0 times\nWelcome 1 times\n\
    Welcome 2 times\nWelcome 3 times\nWelcome 4 times\nWelcome 5 times\n\nIn above\
    \ example, first expression (i = 0), is used to set the value variable to zero.\
    \ Second expression is condition if. All statements between do and done are executed\
    \ as long as expression (i continue long as the value of variable i is less or\
    \ equal to 5) is TRUE. Last expression i++ increments the value of i by 1. i.e\
    \ is equivalent to i + 1 statement.\n\n## Nesting of Loop\n\nAs you see the if\
    \ statement can be nested, similarly loop statement can be nested. You can nest\
    \ the for loop. To understand the nesting of loop see the following script.\n\n\
    ```bash\n$ vi nestedfor.sh\n### Outer for loop ###\nfor (( i = 1; i <= 5; i++\
    \ ))\ndo\n    for (( j = 1; j <= 5; j++ )) ### Inner for loop ###\n    do\n  \
    \      echo -n \"$i \"\n    done\n\n    echo \" \" #### print the new line ###\n\
    done\n```\n\nRun the above script as follows:\n$ chmod +x nestedfor.sh\n./nestedfor.sh\n\
    11111\n22222\n33333\n44444\n55555\n\nHere, for each value of i the inner loop\
    \ is cycled through 5 times, with the variable j taking values from 1 to 5. The\
    \ inner loop terminates when the value of j exceeds 5, and the outer loop terminates\
    \ when the value of i exceeds 5.\n\nFollowing script is quite interesting, it\
    \ prints the chess board on screen.\n\n```bash\n$ vi chessboard\nfor (( i = 1;\
    \ i <= 9; i++ )) ### Outer for loop ###\ndo\n    for (( j = 1; j <= 9; j++ ))\
    \ ### Inner for loop ###\n    do\n        tot=`expr $i + $j`\n        tmp=`expr\
    \ $tot % 2`\n        if [ $tmp -eq 0 ]; then\n            echo -n \"\\033[47m\
    \ \"\n        else\n            echo -n \"\\033[40m \"\n        fi\n    done\n\
    \    echo -n \"\\033[40m\" #### set back colour to black\n    echo \"\" #### print\
    \ the blank line ###\ndone\n```\n\nRun the above script as follows:\n$ chmod +x\
    \ chessboard\n./chessboard\n\n![](img/219cb7ce1c9c4c56d7383822f4b9b_73.png)\n\n\
    Above shell script can be explained as follows:\n\n| Command(s) | Explanation\
    \ |\n| --- | --- |\n| for (( i = 1; i <= 9; i++ )) | Begin the outer loop which\
    \ runs 9 times, and the outer loop terminates when the value of i exceeds 9. |\n\
    | do | |\n| for (( j = 1; j <= 9; j++ )) | Begins the inner loop, for each value\
    \ of i the inner loop is cycled through 9 times, with the variable j taking values\
    \ from 1 to 9. The inner loop terminates when the value of j exceeds 9. |\n| do\
    \ | |\n| tot='expr $i + $j' | See for even and odd positions using these statements.\
    \ |\n| tmp='expr $tot % 2' | |\n| if [ $tmp -eq 0 ]; then | If even number position\
    \ print the white colour block (using echo -n \"\\033[47m\" statement); otherwise\
    \ for odd number position print the black colour block (using echo -n \"\\033[40m\"\
    \ statement). These statements are responsible to print entier chess board on\
    \ screen with alternate colours. |\n| else | |\n| echo -n \"\\033[47m\" | |\n\
    | echo -n \"\\033[40m\" | |\n| done | End of inner loop |\n| echo -n \"\\033[40m\"\
    \ | Make sure its black background as we always have on our terminals. |\n| echo\
    \ \"\" | Print the blank line |\n| done | End of outer loop and print script and\
    \ shell scripts get terminated by printing the chess board. |\n"
