    As you know I/O redirectors are used to send output of command to file or to read
    input from file. Consider following example


    ```

    $ cat > myf

    This is my file

    ^D

    ```


    Above command send output of cat command to myf file


    ```

    $ cal

    ```


    Above command prints calendar on screen, but if you wish to store this calendar
    to file then give command


    ```

    $ cal > mycal

    The cal command send output to mycal file. This is called output redirection.

    $ sort

    10

    -20

    11

    2

    ^D

    -20

    2

    10

    11

    ```


    sort command takes input from keyboard and then sorts the number and prints (send)
    output to screen itself. If you wish to take input from file (for sort command)
    give command as follows:


    ```

    $ cat > nos

    10

    -20

    11

    2

    ^D

    $ sort < nos

    -20

    2

    10

    11

    ```


    First you created the file nos using cat command, then nos file given as input
    to sort command which prints sorted numbers. This is called input redirection.

    In Linux (And in C programming Language) your keyboard, screen etc are all treated
    as files. Following are name of such files'
  - "[PAGE 87]\n\n# LSST v1.05r > Chapter 4 > I/O Descriptors and redirection\n\n\
    | Standard File | File Descriptor number | Use | Example |\n| --- | --- | ---\
    \ | --- |\n| stdin | 0 | as Standard input | Keyboard |\n| stdout | 1 | as Standard\
    \ output | Screen |\n| stderr | 2 | as Standard error | Screen |\n\nBy default\
    \ in Linux every program has three files associated with it, (when we start our\
    \ program these three files are automatically opened by your shell). The use of\
    \ first two files (i.e. stdin and stdout) , are already seen by us. The last stderr\
    \ (numbered as 2) is used by our program to print error on screen.\nYou can redirect\
    \ the output from a file descriptor directly to file with following syntax\n\n\
    Syntax:\nfile-descriptor-number>filename\n\nExamples: (Assume the file bad_name111\
    \ does not exist)\n$ rm bad_name111\nrm: cannot remove 'badbad_name111\\': No\
    \ such file or directory\nAbove command gives error as output, if you don't have\
    \ a file. Now if we try to redirect this error-output to file, it cannot be sent\
    \ to (redirect) to file, as try as follows:\n$ rm bad_name_111 2>\n\nStill it\
    \ prints output on screen as rm: cannot remove 'bad_name_111\\': No such file\
    \ or directory. And if you see error as $ cat er the file is empty, output is\
    \ sent to error device and you cannot redirect it to copy this error-output to\
    \ your file 'er'. To overcome this problem you have to use following command:\n\
    $ rm bad_name_111 2>\n\nNote that no space are allowed between 2 and >, The 2>er\
