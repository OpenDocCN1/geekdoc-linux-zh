    # Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 2: Getting started with Shell Programming


    # Shell Arithmetic


    Use to perform arithmetic operations.


    Syntax:

    expr op1 operator op2


    Examples:

    ```

    $ expr 1 + 3

    $ expr 2 - 1

    $ expr 10 / 2

    $ expr 20 % 3

    $ expr 10 * 3

    $ echo `expr 6 + 3`

    ```


    Note:

    expr 20 % 3 - Remainder read as 2.

    expr 10 * 3 - Multiplication use * and not x


    For the last statement not following points:

    (1) First, before expr keyword used (back quote) sign is generally found under
    TAB key.

    (2) Second, expr is also evaluated with $.

    (3) Here expr 6 + 3 is evaluated to 9, then echo command prints the9 as sum

    (4) If you use double quote or single quote, it will work

    For e.g.

    ```

    $ echo "expr 6 + 3" # It will print 6 + 3

    $ echo ''expr 6 + 3'' # It will print 6 + 3

    ```


    + See Parameter substitution - To save your time.


    # More about Quotes


    There are three types of quotes


    | Quotes | Name | Meaning |

    | --- | --- | --- |

    | " | Double Quotes | "Double Quotes" - Anything enclosed in double quotes meaning
    of characters (except $ $) |

    | '' | Single quotes | ''Single quotes'' - Enclosed in single quotes remains unchanged.
    |

    | ` | Back quote | `Back quote` - To execute command |


    *Example:*

    ```

    $ echo "Today is date"

    Can''t print message with today''s date.

    $ echo `date`

    It will print today''s date as, you see that `date` uses back quote |


    # Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 2: Getting started with Shell Programming


    # Exit Status


    By default in Linux if particular command/shell script is executed, return type
    of values which is used to see whether command or shell script is successful or
    not.


    + (1) If return value is zero (0), command is successful.

    (2) If return value is nonzero, command is not successful or error.


    But how to find out status of command or shell script? Simple, to determine this
    Exit Status you can use $ special variable of shell. For e.g. (This example assumes
    **unknown1file** does not exist)


    ```

    $ rm unknown1file

    It will show error as follows

    rm: cannot remove ''unknown1file'': No such file or directory

    and that if you give command

    ```


    ```

    $ echo $?

    It will print nonzero value to indicate error. Now give

    $ ls

    $ echo $?

    ```

    It will print 0 to indicate command is successful.


    Exercise

    Try the following commands and down the exit status:


    ```

    $ expr 1 + 3

    $ echo $?

    ```


    ```

    $ echo Welcome

    $ echo $?

    ```


    ```

    $ wildcard?

    $ echo $?

    ```


    ```

    $ date

    $ echo $?

    ```


    ```

    $ echo $?

    $ echo $?

    ```


    💡$? useful variable, want to know more such variables [click here](http://www.cyberiti.biz/pdf/lsst/ch02sec9.html)
    to explore them!


