- md: "\n# Linux Shell Scripting Tutorial (LSST) v1.05r3\nChapter 4: Advanced Shell\
    \ Scripting Commands\n\n## getopts command\n\nThis command is used to check valid\
    \ line argument are passed to script. Usually used in while loop.\n\nSyntax:\n\
    getopts {optstring} {variable1}\n\ngetopts is used by shell to parse command line\
    \ argument.\nas defined in man pages:\n\"optstring contains the option letters\
    \ to be recognized; if a letter is followed by a colon: the option is expected\
    \ to have an argument, which should be separated it by white space. Each time\
    \ it is invoked, getopts places the next option in the shell variable1. When an\
    \ option requires an argument, getopts places that argument into the variable\
    \ OPTARG. On errors gets diagnostic messages are printed when illegal options\
    \ or missing option arguments are encountered. If an illegal option is seen, getopts\
    \ places ? into variable1.\"\n\nExample:\nWe have script called ani which has\
    \ syntax as\nani -n -a -s -w -d\nOptions: These are optional argument\n- -n name\
    \ of animal\n- -a age of animal\n- -s sex of animal\n- -w weight of animal\n-\
    \ -d demo values (if any of the above options are used their values are not taken)\n\
    \nAbove ani script is as follows:\n\n```\n$ # Usage: ani -n -a -s -w -d\n#\n#\
    \ help_ani() To print help\n#\nhelp_ani()\n{\necho \"Usage: $0 -n -a -s -w -d\"\
    \necho \"Options: These are optional argument\"\necho \" -n name of animal\"\n\
    echo \" -a age of animal\"\necho \" -s sex of animal \"\necho \" -w weight of\
    \ animal\"\necho \" -d demo values (if any of the above options are used \necho\
    \ their values are not taken\"\nexit 1\n}\n#\n#Start main procedure\n#\n#Set default\
    \ value for variable\n#\nisdef=0\na=Moti\nage=\"2 Months\" # may be 60 days, as\
    \ U like it!\nsex=Male\nweight=3Kg\n#\n#if no argument\n#\nif [ $# -lt 1 ]; then\n\
    \  help_ani\nfi\nwhile getopts n:a:s:w:d opt\ndo\n  case \"$opt\" in\n    n) na=\"\
    $OPTARG\";\n    a) age=\"$OPTARG\";\n    s) sex=\"$OPTARG\";\n    w) weight=\"\
    $OPTARG\";\n    d) \\?) help_ani;\n  esac\ndone\nif [ $isdef -eq 0 ];\nthen\n\
    \  echo \"Animal Name: $na, Age: $age, Sex: $sex, Weight: $weight (user mode)\"\
    \n  define mode\nelse\n  na=\"Pluto Dog\"\n  age=3\nsex=Male\nweight=20kg\n  echo\
    \ \"Animal Name: $na, Age: $age, Sex: $sex, Weight: $weight (demo mode)\"\nfi\n\
