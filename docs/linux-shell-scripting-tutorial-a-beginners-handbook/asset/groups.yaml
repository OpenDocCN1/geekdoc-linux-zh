- md: "\n# Linux Shell Scripting Tutorial (LSST) v1.05r3\nChapter 7: awk Revisited\n\
    \n# awk miscellaneous\n\nYou can ever take input from keyboard while running awk\
    \ script, try the following awk script:\n\n```bash\n$ cat > testscript\nBEGIN\
    \ {\n    printf \"Your name please:\" < \"-\"\n    getline na < \"-\"\n    printf\
    \ \"%s your age please:\" < \"-\",na\n    getline age < \"-\"\n    print \"Hello\
    \ \" na, \", next year you will be \" age + 1\n}\n```\n\nSave it and run as\n\
    $ awk -f testscript\nYour name please: Vivek\nVive your age please: 26\nHello\
    \ Vivek, next year you will be 27\n\nHere getline function is used to read input\
    \ from keyboard and then assign the data (inputted from keyboard) to variable.\n\
    \nSyntax:\n`getline variable-name < \"-\"`\n\n- 1 --> getline is function name\n\
    - 2 --> variable-name is used to assign the value read from input\n- 3 --> Means\
    \ read from stdin (keyboard)\n\nTo reading Input from file use following\nSyntax:\n\
    `getline < \"file-name\"`\n\nExample:\n`getline < \"friends.db\"`\n\nTo reading\
    \ Input from pipe use following\nSyntax:\n`\"command\" | getline`\n\nExample:\n\
    \n```bash\n$ cat > awkread_file\nBEGIN {\n  \"date\" | getline\n  print $0\n}\n\
    ```\n\nRun it as\n$ awk -f awkread_file\nFri Apr 12 00:05:45 IST 2002\n\nCommand\
    \ date is executed and piped to getline which assign the date command output to\
    \ $0. If you want your variable then replace the above program as follows\n\n\
    ```bash\n$ cat > awkread_file1\nBEGIN {\n  \"date\" | getline today\n  print today\n\
    }\n```\n\nRun it as follows:\n$ awk -f awkread_file1\n\nTry to understand the\
    \ following awk script and note down its output.\n\ntemp2final1.awk\n\n# Real\
    \ life examples in awk\n\nsed - Quick Introduction\n\n# sed - Quick Introduction\n\
    \nSED is a stream editor. A stream editor is used to perform basic text transformations\
    \ on an input stream (a file or input from a pipeline). SED works by making only\
    \ one pass over the input(s), and is consequently more efficient. But it is SED's\
    \ ability to filter text in a pipeline particularly distinguishes it from other\
    \ types of editors.\n\nBefore getting started with tutorial you must know basic\
    \ expression which is covered in our Learning expressions with ex tutorial. For\
    \ this part of tutorial create demofile1. After creating the file type following\
    \ sed command at shell prompt:\n\n```bash\n$ sed 's/Linux/UNIX(system v)/' demofile1\n\
    Hello World.\nThis is vivek from Poona.\nI love linux.\n...\n...\nlinux is linux\n\
    ```\n\nAbove sed command can be explained as follows:\n\n| Commands | Meaning\
    \ |\n| --- | --- |\n| sed | Start the sed command |\n| 's/Linux/UNIX(system v)'\
    \ | Use substitute command to replace Linux with UNIX(system v). General syntax\
    \ of substitute is s/pattern/pattern-to-substitute/ |\n| demofile1 | Read the\
    \ data from demofile1 |\n\nGeneral Syntax of sed:\n`sed-option 'general expression'\
    \ [data-file]`\n`sed-option sed-script-file [data-file]`\n\nOption can be:\n\n\
    | Option | Meaning | Example |\n| --- | --- | --- |\n| -e | Read the different\
    \ sed command from command line. | $ sed -e 'sed-commands' data-file-name / $\
    \ sed -e 's/Linux/UNIX(system v)' demofile1 |\n| -f | Read the sed command from\
    \ sed script file. | $ sed -f chgdb.sed friends.db |\n\nSuppress the output of\
    \ sed -n command. When -n is used you must use p command of print flag.\n\n```bash\n\
    $ sed -n '/^\\.*$/p' demofile2\n```\n\n# awk miscellaneous\n\nRedirecting the\
    \ output of sed command\n\n# Redirecting the output of sed command\n\nYou can\
    \ redirect the output of sed command to file as\n```bash\n$ sed 's/Linux/UNIX(system\
    \ v)/' demofile1 > file.out\n```\n\nAnd can we see the output using cat as follows\n\
    \n```bash\n$ cat file.out\n```\n\n# Deleting blank lines\n\nUsing sed /d can delete\
    \ all blank line from file as\n```bash\n$ sed '/^$/d' demofile1\n```\n\nAs you\
    \ know pattern `/^$` match blank line and d command deletes the blank line.\n\n\
    Following sed command takes input from who command and sed is used to check particular\
    \ user is logged or not.\n\n```bash\n$ who | sed -n '/vivek/p'\n```\n\nHere -n\
    \ option to sed suppress the output of sed command; and /vivek/ is the pattern\
    \ that we are looking for, finally if pattern found its printed using p command\
    \ of sed.\n\n# How to write sed scripts?\n\nSed command can be grouped together\
    \ in one file, this is known as script. For next example of sed create chg1.sed\n\
    \n**Tip:** .sed extension to script, .sh to script and .awk to script file(s),\
    \ this will help you identify files quickly.\n\n```bash\n$ cat > chg1.sed\nPrice\
    \ of all items changes from 1st-April-2001\n/Pen/s/20.00/19.5/\n/Pencil/s/00/60/\n\
