    # Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 2: Getting started with Shell Programming


    # The read Statement


    Use to get input (data from user) from keyboard and store (data) to variable.

    Syntax:

    read variable1,variable2....variableN


    Following script first ask user, name and then waits to enter name from the user
    via keyboard. Then user enters name from keyboard (after giving name you have
    press ENTER key) and entered name through keyboard is stored (assigned) to variable
    name.


    ```

    $ vi sayH

    #

    # Script to read your name from keyboard

    #

    echo "Your first name please:"

    read fname

    echo "Hello $fname, Lets be friend!"

    ```


    Run it as follows:

    $ chmod 755 sayH

    $ ./sayH

    Your first name please: vivek

