    \n## 多级 if-then-else\n\n语法：\n\n```bash\nif condition\n    condition 为零 (真 - 0)\n\
    then\n    执行直到 elif 语句为止的所有命令\nelif condition1\nthen\n    condition1 为零 (真 - 0)\n\
