    1) Is it example of Multitasking?

    Ans.: Yes, you are running two process simultaneously.


    2) How you will find out both running process (MP3 Playing & typing)?

    Ans.: Try $ ps aux or $ ps ax | grep process-to-search


    3) "Currently only Process are running in your Linux/PC", Is it True or False?,
