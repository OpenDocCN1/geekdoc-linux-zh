    \ new technology (if computer teacher). What all this mean is you can't perform\
    \ all of life's task alone. You need somebody to you solve specific task/problem.\n\
    \nThe above logic also applies to computer program (shell script). When program\
    \ gets complex we need to you use divide and conquer technique. It means whenever\
    \ programs gets complicated, you divide it into small chunks/entities which are\
    \ known as *functions*.\n\nFunction is series of instruction/commands. Function\
    \ performs particular activity in shell i.e. it had specific work to do or simply\
    \ say task. To define function using following syntax:\nSyntax*:\n\n```\nfunction-name\
    \ ( )\n{\n    command1\n    command2\n    ....\n    commandN\n    return\n}\n\
    ```\n\nWhere function-name is name of you, that executes series of commands. A\
    \ return statement will terminate the function. *Example:*\nType SayHello() at\
    \ $ prompt as follows\n\n```\n$ SayHello()\n{\n    echo \"Hello $LOGNAME, Have\
    \ nice computing\"\n    return\n}\n```\n\nTo execute this SayHello function just\
    \ type it name as follows:\n$ SayHello\nHello vivek, Have nice computing.\n\n\
    This way you can call function. Note that after restarting your computer you will\
    \ lose this SayHello() function, since it created for current session only. To\
    \ overcome this problem and to add you function to automate some of the today\
