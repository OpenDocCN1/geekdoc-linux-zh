    \ \"%s\", na | 将 God 打印为其本身 |\n| printf \"%10s\", na | 将 God 单词作为右对齐打印 |\n| printf\
    \ \"%-10s\", na | 将 God 单词作为左对齐打印。（- 表示左对齐） |\n\n相同的技术也用于我们的 bill4 awk 程序以格式化输出。此外，像\
    \ `gotal+=` 这样的语句等同于 `gotal = gotal + total`。这里 `+=` 被赋值运算符。你可以使用以下赋值运算符：\n\n\
    | 赋值运算符 | 用途 | 示例 | 等于 |\n| :--- | :--- | :--- | :--- |\n| += | 分配加法结果 | a +=\
    \ 10 | a = a + 10 |\n| | | d += c | a = a + c |\n| -= | 分配减法结果 | a -= 10 | a =\
    \ a - 10 |\n| | | d -= c | a = a - c |\n| *= | 分配乘法结果 | a *= 10 | a = a * 10 |\n\
    | | | d *= c | a = a * c |\n| %= | 分配取模结果 | a %= 10 | a = a % 10 |\n| | | d %=\
    \ c | a = a % c |\n\n上一个 主页 下一个\n\nprintf 语句的使用 上移 awk 中的 if 条件\n\n# Linux Shell\
    \ 脚本教程 (LSST) v1.05r3\n\n## awk 中的 if 条件\n\nif 条件的通用语法如下：\n\n```\n语法:\nif ( condition\
    \ )\n{\n    Statement 1\n    Statement 2\n    Statement N\n    如果 condition 为真\n\
    }\nelse\n{\n    Statement 1\n    Statement 2\n    Statement N\n    如果 condition\
    \ 为假\n}\n```\n\n上面的 if 语法是不不言自明的，现在让我们移动到下一个 awk 程序\n\n```\n$ awk > math2\nBEGIN\
    \ {\n    myprompt = \"(To Stop press CTRL+D) > \"\n    printf \"Welcome to MyAddition\
