    \ awk 变量的列表。\n\n| awk 变量 | 含义 |\n|---|---|\n| FILENAME | 当前输入文件的名称 |\n| RS | 输入记录分隔符（默认是换行）\
    \ |\n| OFS | 输出字段分隔符字符串（默认为空） |\n| ORS | 输出记录分隔符字符串（默认是换行） |\n| NF | 输入记录数 |\n\
    | NR | 输入记录中的字段数 |\n| OFMT | 数字的输出格式 |\n| FS | 字段分隔符（默认为空格和制表符） |\n\n## 使用 awk\
    \ 进行算术运算\n\n你可以按照如下方式轻松地使用 awk 进行算术运算：\n\n```awk\n$ cat > math\n{\n  print $1\
    \ \" + \" $2 \" = \" $1+$2\n  print $1 \" - \" $2 \" = \" $1-$2\n  print $1 \"\
    \ / \" $2 \" = \" $1/$2\n  print $1 \" x \" $2 \" = \" $1*$2\n  print $1 \" mod\
    \ \" $2 \" = \" $1%2\n}\n```\n\n按照如下方式运行：\n\n```awk\n$ awk -f math\n20 + 3 = 23\n\
    20 - 3 = 17\n20 / 3 = 6.66667\n20 x 3 = 60\n20 mod 3 = 2\n(按 Ctrl + D 终止)\n```\n\
    \n在上面的程序中，$1 \" + \" $2 \" = \" $1+$2 语句用于加法运算。在这里，$1 + $2 意味着加上第二个字段。你同样可以进行\
    \ -（减法）、*（乘法）、/（除法）、%（取模求余数）。\n\n## awk 中的自定义变量\n\n你也可以按照如下方式在 awk 程序中定义你自己的变量：\n\
    \n```awk\n$ cat > math1\n{\nno1 = $1\nno2 = $2\nans = $1 + $2\nprint \" \" no1\
    \ \" + = \" no2 \" = = \" ans\n}\n```\n\n按照如下方式运行程序：\n$ awk -f math1\n\n5 + 20\
    \ = 5\n\n在上面的程序中，no1,no2,ans 都是自定义变量。第一个和第二个字段的值分别赋值给 no1 和 no2，加法结果赋值给 ans 变量。可以使用\
