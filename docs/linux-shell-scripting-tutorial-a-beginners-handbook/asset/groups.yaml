    \ Os)\n2. Linux (Red Hat)\nSelect you os choice [1 or 2]? 3\nWhat you don't like\
    \ Unix/Linux OS.\n\n注意，第二个 if-else/Unix 常量嵌套在第一个 else 语句中。如果第一个 if 语句中的条件为假，将检查第二个\
    \ if 语句中的条件。如果它也为假，则执行最后的 else 语句。\n\n你也可以如下所示使用嵌套的 ifs：\n语法：\n\n```bash\nif condition\n\
    then\n    if condition\n        then\n            ....\n            ..\n     \
