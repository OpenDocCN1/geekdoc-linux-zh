    \ (\" \") 都是文本。如果字符串不在双引号内，则被视为变量。\n\n现在尝试下面的 awk 程序并记录其输出：\n\n```awk\n$ cat >\
    \ bill\n{\ntotal = $3 * $4\nrecno = $1\nitem = $2\nprint recno item \" Rs.\" total\n\
    }\n```\n\n按照如下方式运行：\n$ awk -f bill inven\n\n1.Pen Rs.100\n2.Pencil Rs.20\n3.Rubber\
