    \ 会将下一个选项放置在 shell 变量 variable1 中。当选项需要参数时，getopts 将该参数放入变量 OPTARG 中。当遇到非法选项或缺失选项参数时，会打印诊断信息（diagnostic\
    \ messages）。如果看到非法选项，getopts 将 ? 放入变量 variable1 中。”\n\n示例：\n我们有一个名为 ani 的脚本，语法如下：\n\
