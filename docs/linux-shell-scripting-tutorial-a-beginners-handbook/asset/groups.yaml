    # Linux Shell Scripting Tutorial (LSST) v1.05r3


    Chapter 7: awk Revisited


    # More examples of sed


    First create text file demofile2 which is used to demonstrate next sed script
    examples.


    Type following command sed at shell prompt:


    ```

    $ sed -n ''/10\{2\}/p'' demofile2

    1001

    ```


    Above command will print 1001, here in search pattern we have used \2\.

    Syntax:

    \,n:

    At least nth occurrences will be matched. So /10\{2\} will look for 1 followed
    by 0 (zero) and \2\, tells sed look for 0 (zero) twice.


    # Matchend any number of occurrence


    Syntax:

    \{n,m}

    Matches any number of occurrence between n and m.


    Example:


    ```

    $ sed -n ''/10\{2,4\}/p'' demofile2

    1001

    10001

    100001

    ```


    Will match "1001", "10001" or "100001" but not "101" or "1000000". Suppose you
    want to print all line that begins with *** (three star or asterisks), then you
    can type command

    $ sed -n ''/^\***.*$/p'' demofile2


    ```

    ***

    ***

    ```


    Above sed expression can be explained as follows:


    | Command | Explanation |

    | --- | --- |

    | ^ | Beginning of line |

    | \* | Find the asterisk or star (\ replace the special meaning of ''*'') metacharacter
    |

    | .* | Followed by any two character (you can also use \* i.e. the $ sed -n ''/^\*\*.*$/p''
    demofile2 ) |

    | / | End of line (So that only three star or asterisk will be matched) |

    | p | Print the pattern. |


    Even you can use following expression for the same purpose

    $ sed -n ''/^\*{2,3}\/^\*{2,3}$/p'' demofile2

    Now following command will find lines ended with *** and *** and then delete all
    those line

    $ sed -e ''/^\*{2,3}\/^\*{2,3}$/d'' demofile2 > tmp/fi.sh

    $cat tmp/fi.sh'
