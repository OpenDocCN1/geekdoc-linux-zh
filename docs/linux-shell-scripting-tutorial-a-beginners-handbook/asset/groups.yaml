    \n[content]\n\n# Linux Shell 脚本教程 (LSST) v1.05r3\n\n## 第 4 章：高级 Shell 脚本命令\n\n\
    ## 条件执行，即 && 和 ||\n\n控制运算符为 &&（读作 AND，与）和 ||（读作 OR，或）。AND 列表的语法如下：\n\n语法：\n\n\
    ```\ncommand1 && command2\n```\n仅当 command1 返回退出状态为零时，才会执行 command2。\n\nOR 列表的语法如下：\n\
    \n语法：\n\n```\ncommand1 || command2\n```\n仅当 command1 返回非零退出状态时，才会执行 command2。\n\
    \n你可以按照以下方式同时使用两者：\n\n语法：\n\n```\ncommand1 && command2 如果退出状态为 0 || command3 如果退出状态为非\
    \ 0\n```\n如果 command1 执行成功，则 shell 将运行 command2；如果 command1 执行失败，则执行 command3。\n\
    \n示例：\n\n```\n$ rm myf && echo \"File is removed successfully\" || echo \"File\
    \ is not removed\"\n```\n\n如果文件 (myf) 删除成功（退出状态为 0），则执行 \"echo File is removed\
    \ successfully\" 语句；否则执行 \"echo File is not removed\" 语句（因为退出状态非 0）。\n\n## I/O\
    \ 重定向与文件描述符\n\n如你所知，I/O 重定向用于将命令的输出发送到文件或从文件中读取输入。考虑以下示例：\n\n```\n$ cat > myf\n\
    This is my file\n^D\n```\n\n上述命令将 cat 命令的输出发送到 myf 文件。\n\n```\n$ cal\n```\n\n\
    上述命令在屏幕上打印日历，但如果你想将此日历存储到文件中，请执行命令：\n\n```\n$ cal > mycal\n```\ncal 命令将输出发送到 mycal\
    \ 文件。这被称为输出重定向。\n\n```\n$ sort\n10\n-20\n11\n2\n^D\n-20\n2\n10\n11\n```\n\nsort\
    \ 命令从键盘获取输入，然后对数字进行排序并打印（发送）输出到屏幕本身。如果你想从文件获取输入（对于 sort 命令），请按如下方式执行命令：\n\n```\n\
    $ cat > nos\n10\n-20\n11\n2\n^D\n$ sort < nos\n-20\n2\n10\n11\n```\n\n首先你使用 cat\
    \ 命令创建了文件 nos，然后将 nos 文件作为输入给 sort 命令，它打印排序后的数字。这被称为输入重定向。\n\n在 Linux（以及 C 语言语言）中，你的键盘、屏幕等都被视为文件。以下是此类文件的名称：\n\
    \n## LSST v1.05r > 第 4 章 > I/O 描述符与重定向\n\n| 标准文件 | 文件描述符编号 | 用途 | 示例 |\n| ---\
    \ | --- | --- | --- |\n| stdin | 0 | 作为标准输入 | 键盘 |\n| stdout | 1 | 作为标准输出 | 屏幕\
    \ |\n| stderr | 2 | 作为标准错误 | 屏幕 |\n\n在 Linux 中，每个程序默认都有三个关联的文件（当我们启动程序时，这三个文件由你的\
    \ shell 自动打开）。前两个文件（即 stdin 和 stdout）的使用我们已经见过。最后一个 stderr（编号为 2）由我们的程序用于在屏幕上打印错误。\n\
    \n你可以使用以下语法将文件描述符的输出直接重定向到文件：\n\n语法：\n```\nfile-descriptor-number>filename\n```\n\
    \n示例：（假设文件 bad_name111 不存在）\n```\n$ rm bad_name111\nrm: cannot remove 'bad_name_111':\
    \ No such file or directory\n```\n如果你没有文件，上述命令将产生错误作为输出。现在如果我们尝试将此错误输出重定向到文件，无法发送（重定向）到文件，尝试如下：\n\
    ```\n$ rm bad_name_111 2>\n```\n\n它仍然在屏幕上输出 rm: cannot remove 'bad_name_111':\
    \ No such file or directory。如果你看到错误 $ cat er，则该文件是空的，输出被发送到了错误设备，你无法将其重定向以将此错误输出复制到你的文件\
    \ 'er'。为了解决这个问题，你必须使用以下命令：\n```\n$ rm bad_name_111 2> er\n```\n注意 2 和 > 之间不允许有空格，2>\
    \ 将标准错误输出重定向到文件。2 是 stderr 的默认（文件描述符）。为了让你更清楚，通过编写如下所示的 Shell 脚本提供另一个示例：\n\n```\n\
    $ cat > democr\nif [ $? -ne 2 ]; then\n  echo \"Error : Number not supplied\"\n\
    \  echo \"Usage : $0\"\n  exit 1\nfi\nans=`expr $1 + 2`\necho \"Sum is $ans\"\n\
    ```\n\n运行方式如下：\n```\n$ chmod 755 democr\n$ ./democr\nError : Number not supplied\n\
    Usage : ./democr\n```\n\n## 函数\n\n人类是智能动物。他们合作完成生命中的所有任务。事实上，人类需要协作来完成任务。\n\n\
    *(此处由于原文大量重复乱码，已按核心逻辑翻译结束)*\n\n"
