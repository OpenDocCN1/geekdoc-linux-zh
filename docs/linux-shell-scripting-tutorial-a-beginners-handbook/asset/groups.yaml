    \n```awk\nBEGIN(\n{\n\n# main logic is here\n```\n\n```awk\nisdirl = \" -d \"\
    \ $1 \"\"\nisdir2 = \" -d \" $2 \"\"\n\nscriptname = \"up2low\"\nawkscriptname\
    \ = \"rename.awk\"\n\nfsfile = $1\ndfile = $2\n```\n\n```awk\n# we are not suppose\
    \ to rename dirs in source or destination\n\n# make sure we are renaming our self\
    \ if in same dir\n\nif ( sfile == scriptname || sfile == awkscriptname )\n  next\n\
    else if( system(isdirl) == 0 || system(isdir2) == 0 )\n{\n  printf \"%s or %s\
    \ is directory can't rename it to lower case\\n\",sfile,dfile\n  next # continue\
    \ with next record\n}\nelse if ( sfile == dfile)\n{\n  printf \"Skipping, %s is\
    \ already in lowercase\\n\",sfile,dfile\n  next\n}\nelse # everything is okay\
    \ rename it to lowercase\n{\n  mvcmnd = \"mv \" sfile \" \" dfile\n  printf \"\
