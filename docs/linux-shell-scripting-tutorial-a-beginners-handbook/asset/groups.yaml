    # # trap command


    Consider following script example:


    ```

    ```

    $ cat > testsign

    ls -R /

    ```

    ```


    Save and run it as

    $ chmod +x testsign

    ./testsign


    Now if you press ctrl + c , while running this script, script get terminated.
    The ctrl + c here work as signal. When signal occurs its sent to all process currently
    running in your system. Now consider following shell script:


    ```

    ```

    $ cat > testsign1

    #

    # Why to trap signal, version 1

    #

    # Take_input1()

    take_input1()

    {

    recno=0

    clear

    echo "Appointment Note keeper Application for Linux"

    echo -n "Enter your database file name : "

    read filename

    if [ ! -f $filename ]; then

    echo "Sorry, $filename does not exit, Creating $filename database"

    echo "Appointment Note keeper Application database file" > $filename

    fi

    echo "Data entry start data: `date`" >/tmp/input0.$\$

    #

    # Set a infinite loop

    #

    while :

    do

    echo -n "Appointment Title:"

    read na

    echo -n "time :"

    read ti

    echo -n "Any Remark :"

    read remark

    echo -n "Is data okay (y/n) ?"

