- md: "\n# Linux Shell Scripting Tutorial (LSST) v1.05r3\n\n## Chapter 4: Advanced\
    \ Shell Scripting Commands\n\n## Conditional execution i.e. && and ||\n\nThe control\
    \ operators are && (read as AND) and || (read as OR). The syntax for AND list\
    \ is as follows\n\nSyntax:\n\n```\ncommand1 && command2\n```\ncommand2 is executed\
    \ if, and only if, command1 returns an exit status of zero.\n\nThe syntax for\
    \ OR list is as follows\n\nSyntax:\n\n```\ncommand1 || command2\n```\ncommand2\
    \ is executed if, and only if, command1 returns a non-zero exit status.\n\nYou\
    \ can use both as follows\n\nSyntax:\n\n```\ncommand1 && command2 if exit status\
    \ is zero || command3 if exit status is non-zero\n```\nif command1 is executed\
    \ successfully then shell will run command2 and if command1 is not successful\
    \ then command3 is executed.\n\nExample:\n\n```\n$ rm myf && echo \"File is removed\
    \ successfully\" || echo \"File is not removed\"\n```\n\nIf file (myf) is removed\
    \ successful (exist status is zero) then \"echo File is removed successfully\"\
    \ statement is executed, otherwise \"echo File is not removed\" statement is executed\
    \ (since exit status is non-zero)\n\n## I/O Redirection and file descriptors\n\
    \nAs you know I/O redirectors are used to send output of command to file or to\
    \ read input from file. Consider following example\n\n```\n$ cat > myf\nThis is\
    \ my file\n^D\n```\n\nAbove command send output of cat command to myf file.\n\n\
    ```\n$ cal\n```\n\nAbove command prints calendar on screen, but if you wish to\
    \ store this calendar to file then give command\n\n```\n$ cal > mycal\n```\nThe\
    \ cal command send output to mycal file. This is called output redirection.\n\n\
    ```\n$ sort\n10\n-20\n11\n2\n^D\n-20\n2\n10\n11\n```\n\nsort command takes input\
    \ from keyboard and then sorts the number and prints (send) output to screen itself.\
    \ If you wish to take input from file (for sort command) give command as follows:\n\
    \n```\n$ cat > nos\n10\n-20\n11\n2\n^D\n$ sort < nos\n-20\n2\n10\n11\n```\n\n\
    First you created the file nos using cat command, then nos file given as input\
    \ to sort command which prints sorted numbers. This is called input redirection.\n\
    \nIn Linux (And in C programming Language) your keyboard, screen etc are all treated\
    \ as files. Following are name of such files\n\n## LSST v1.05r > Chapter 4 > I/O\
    \ Descriptors and redirection\n\n| Standard File | File Descriptor number | Use\
    \ | Example |\n| --- | --- | --- | --- |\n| stdin | 0 | as Standard input | Keyboard\
    \ |\n| stdout | 1 | as Standard output | Screen |\n| stderr | 2 | as Standard\
    \ error | Screen |\n\nBy default in Linux every program has three files associated\
    \ with it, (when we start our program these three files are automatically opened\
    \ by your shell). The use of first two files (i.e. stdin and stdout) , are already\
    \ seen by us. The last stderr (numbered as 2) is used by our program to print\
    \ error on screen.\n\nYou can redirect the output from a file descriptor directly\
    \ to file with following syntax\n\nSyntax:\n```\nfile-descriptor-number>filename\n\
    ```\n\nExamples: (Assume the file bad_name111 does not exist)\n```\n$ rm bad_name111\n\
    rm: cannot remove 'bad_name_111': No such file or directory\n```\nAbove command\
    \ gives error as output, if you don't have a file. Now if we try to redirect this\
    \ error-output to file, it cannot be sent to (redirect) to file, as try as follows:\n\
    ```\n$ rm bad_name_111 2>\n```\n\nStill it prints output on screen as rm: cannot\
    \ remove 'bad_name_111': No such file or directory. And if you see error as $\
    \ cat er the file is empty, output is sent to error device and you cannot redirect\
    \ it to copy this error-output to your file 'er'. To overcome this problem you\
    \ have to use following command:\n```\n$ rm bad_name_111 2> er\n```\nNote that\
    \ no space are allowed between 2 and >, 2> directs the standard error output to\
    \ file. 2 is default (file descriptors) of stderr. To clear your idea another\
    \ example by writing shell script as follows:\n\n```\n$ cat > democr\nif [ $?\
    \ -ne 2 ]; then\n  echo \"Error : Number not supplied\"\n  echo \"Usage : $0\"\
    \n  exit 1\nfi\nans=`expr $1 + 2`\necho \"Sum is $ans\"\n```\n\nRun it as follows:\n\
    ```\n$ chmod 755 democr\n$ ./democr\nError : Number not supplied\nUsage : ./democr\n\
    ```\n\n## Functions\n\nHumans are intelligent animals. They work together to perform\
    \ all of life's task, in fact most us depend upon each other. For e.g. you rely\
    \ on others to supply help, or to learn new technology (if computer fails). What\
    \ all this mean is you can't perform all of life's task alone. You need somebody\
    \ to solve specific task/problem.\n\nThe above logic also applies to computer\
    \ (shell script). When program gets complex we need to use divide and conquer\
    \ technique. It means whenever programs gets complicated, divide it into small\
    \ chunks which are known as *functions*.\n\nFunction is series of instruction/commands.\
    \ Function performs particular activity in shell i.e. it has specific work to\
    \ do or simply say task. To define function using following syntax:\n\nSyntax:\n\
    ```\nfunction-name ()\n{\n    command1\n    command2\n    ....\n    commandN\n\
    \    return\n}\n```\n\nWhere function-name is name of you, that executes series\
    \ of commands. A return statement will terminate the function. *Example:*\nType\
    \ SayHello() at $ prompt as follows\n\n```\n$ SayHello()\n{\n    echo \"Hello\
    \ $LOGNAME, Have nice computing\"\n    return\n}\n```\n\nTo execute this SayHello\
    \ function just type its name as follows:\n```\n$ SayHello\nHello, nice computing.\n\
    ```\n\nThis way you can call function. Note that after restarting your computer\
    \ you will lose this SayHello() function, since it created for current session\
    \ only. To overcome this problem and to add your function to automate some task,\
    \ add your function to /etc/bashrc file. To add function to this you must log\
    \ in as root. Following is the sample with today function which is used to formatted\
    \ date. First log as root or if you already log in with your name (login is not\
    \ root), and want to move to root account, you can follow that command, when asked\n\
    \n```\n$ su -l\n```\n\npassword:\nOpen file /etc/bashrc using vi to goto the end\
    \ of file (by pressing shift+G) and to type the today() function:\n\n```bash\n\
    # vi /etc/bashrc\n# At the end of file add following in /etc/bashrc file\n\n#\
    \ today() to print formatted date\n# To run this function type today at the $\
    \ prompt\n# Added by Vivek to show function in Linux\n#\ntoday()\n{\n    echo\
    \ \"This is $(date +\"%A %d in %B of %Y (%r)\")\"\n    return\n}\n```\n\nSave\
    \ the file and exit, after this modification your file may look as follows (type\
    \ command cat /etc/bashrc)\n\n```bash\n# cat /etc/bashrc\n# /etc/bashrc\n\n# System\
    \ wide functions and aliases\n# Environment stuff goes in /etc/profile\n\n# For\
    \ some unknown reason bash refuses to inherit\n# PS1 in some circumstances that\
    \ I can't figure out.\n# Putting PS1 here ensures that it gets loaded every time.\n\
    PS1=\"[u@h \\W]\\$\"\n\n#\n# today() to print formatted date\n#\n# To run this\
    \ function type today at the $ prompt\n# Added by Vivek to show function in Linux\n\
    today()\n{\n    echo \"This is $(date +\"%A %d in %B of %Y (%r)\")\"\n    return\n\
    }\n```\n\nTo run function first completely logout by typing at the $ prompt (Or\
    \ Press CTRL + D, Note you may have to type (CTRL +D) twice to login as root account\
    \ by using command), then login and type $ today this is available to all user\
    \ in your system. If you want to add particular\n"
  mdcn: "\n\n# Linux Shell 脚本教程 (LSST) v1.05r3\n\n## 第 4 章：高级 Shell 脚本命令\n\n## 条件执行，即\
    \ && 和 ||\n\n控制运算符为 &&（读作 AND，与）和 ||（读作 OR，或）。AND 列表的语法如下：\n\n语法：\n\n```\ncommand1\
    \ && command2\n```\n仅当 command1 返回退出状态为零时，才会执行 command2。\n\nOR 列表的语法如下：\n\n语法：\n\
    \n```\ncommand1 || command2\n```\n仅当 command1 返回非零退出状态时，才会执行 command2。\n\n你可以按照以下方式同时使用两者：\n\
    \n语法：\n\n```\ncommand1 && command2 如果退出状态为 0 || command3 如果退出状态为非 0\n```\n如果 command1\
    \ 执行成功，则 shell 将运行 command2；如果 command1 执行失败，则执行 command3。\n\n示例：\n\n```\n$ rm\
    \ myf && echo \"File is removed successfully\" || echo \"File is not removed\"\
    \n```\n``` \n\n如果文件 (myf) 删除成功（退出状态为 0），则执行 \"echo File is removed successfully\"\
    \ 语句；否则执行 \"echo File is not removed\" 语句（因为退出状态非 0）。\n\n## I/O 重定向与文件描述符\n\n\
    如你所知，I/O 重定向用于将命令的输出发送到文件或从文件中读取输入。考虑以下示例：\n\n```\n$ cat > myf\nThis is my file\n\
    ^D\n```\n\n上述命令将 cat 命令的输出发送到 myf 文件。\n\n```\n$ cal\n```\n\n上述命令在屏幕上打印日历，但如果你想将此日历存储到文件中，请执行命令：\n\
    \n```\n$ cal > mycal\n```\ncal 命令将输出发送到 mycal 文件。这被称为输出重定向。\n\n```\n$ sort\n10\n\
    -20\n11\n2\n^D\n-20\n2\n10\n11\n```\n\nsort 命令从键盘获取输入，然后对数字进行排序并打印（发送）输出到屏幕本身。如果你想从文件获取输入（对于\
    \ sort 命令），请按如下方式执行命令：\n\n```\n$ cat > nos\n10\n-20\n11\n2\n^D\n$ sort < nos\n\
    -20\n2\n10\n11\n```\n\n首先你使用 cat 命令创建了文件 nos，然后将 nos 文件作为输入给 sort 命令，它打印排序后的数字。这被称为输入重定向。\n\
    \n在 Linux（以及 C 语言语言）中，你的键盘、屏幕等都被视为文件。以下是此类文件的名称\n\n## LSST v1.05r > 第 4 章 > I/O\
    \ 描述符与重定向\n\n| 标准文件 | 文件描述符编号 | 用途 | 示例 |\n| --- | --- | --- | --- |\n| stdin\
    \ | 0 | 作为标准输入 | 键盘 |\n| stdout | 1 | 作为标准输出 | 屏幕 |\n| stderr | 2 | 作为标准错误 | 屏幕\
    \ |\n\n在 Linux 中，每个程序默认都有三个关联的文件（当我们启动程序时，这三个文件由你的 shell 自动打开）。前两个文件（即 stdin 和\
    \ stdout）的使用我们已经见过。最后一个 stderr（编号为 2）由我们的程序用于在屏幕上打印错误。\n\n你可以使用以下语法将文件描述符的输出直接重定向到文件：\n\
    \n语法：\n```\nfile-descriptor-number>filename\n```\n\n示例：（假设文件 bad_name111 不存在）\n\
    ```\n$ rm bad_name111\nrm: cannot remove 'bad_name_111': No such file or directory\n\
    ```\n如果你没有文件，上述命令将产生错误作为输出。现在如果我们尝试将此错误输出重定向到文件，无法发送（重定向）到文件，尝试如下：\n```\n$ rm\
