    - $ mail raj

    - $ sort -r -n myf

    - $ date

    - $ clear


    答案：


    | 命令 | 该命令的参数数量（即 #$） | 实际参数 |

    |---|---|---|

    | ls | 1 | foo |

    | cp | 2 | y and y.bak |

    | mv | 2 | y.bak and y.okay |

    | tail | 2 | -10 and myf |

    | mail | 1 | raj |

    | sort | 3 | -r, -n, and myf |

    | date | 0 | |

    | clear | 0 | |


