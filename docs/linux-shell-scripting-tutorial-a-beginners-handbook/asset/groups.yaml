    # Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 2: Getting started with Shell Programming


    ## Pipes


    A pipe is a way to connect the output of one program to the input of another program
    without any temporary file.


    ![](img/219cb7c6e1c9c4c56d73838282f4b69b_48_0.png)


    Pipe Defined as:

    "A pipe is nothing but a temporary storage place where the output of one command
    is stored and then passed as the input for second command. Pipes are used to run
    more than two commands (Multiple commands) from same command line."


    Syntax:

    command1 | command2


    Examples:


    | Command using Pipes | Meaning or Use of Pipes |

    | :--- | :--- |

    | $ ls | more | Output of ls command is given as input to more command So that
    output is printed one screen full page at a time. |

    | $ who | sort | Output of who command is given as input to sort command So that
    it will sort list of users |

    | $ who | sort > user_list | Same as except output of sort is sent to (redirected)
    user_list file |

    | $ who | wc -l | Output of who command is given as input to wc So that it will
    print number of user who logon to system |

    | $ ls -l | wc -l | Output of ls command is given as input to wc command So that
    it will print number of files in current directory. |


    ```bash

    $ who | grep raju

    ```


    Output of who command is given as input to grep command So that it will print
    if particular user name if he is logon or nothing is printed (To see particular
    user is logon or not)


    ## Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 2: Getting started with Shell Programming


    ## Filter


    If a Linux command accepts its input from the standard input and produces its
    output on standard output is know as a filter. A filter performs some kind of
    process on the input and gives output. For e.g., Suppose you have file called
    ''hotel.txt'' with 100 lines data. And from ''hotel.txt'' you would like to print
    from command: contains from line number 20 to line number 30 and store this result
    to file called ''hlist'' then give


    ```bash

    $ tail +20 < hotel.txt | head -n30 >hlist

    ```


    Here head command is filter which takes its input from tail command (tail command
    starting selecting from line number 20 of given file i.e. hotel.txt) and passes
    these lines as input to head, whose output is redirected to ''hlist'' file.


    Consider one more following example


    ```bash

    $ sort < sname | uniq > u_fname

    ```


    Here uniq is filter which takes its input from sort command and passes these lines
    as input to uniq: Then uniqs output is redirected to "u_fname" file.


    ## Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 2: Getting started with Shell Programming


    ## What is Processes


    Process is kind kind of program or task carried out by your PC. For e.g.


    ```bash

    $ ls -lR

    ```


    Is command or a request to list files in a directory and all subid in your current
    directory - It is a process.


    Process defined as:

    "A process is program (command given by user) to perform specific Job. In Linux
    when you start process, it gives it a number to process (called PID or process-id),
    PID starts from 0 to 65535."


    ## Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 2: Getting started with Shell Programming


    ## Why Process required


    As you know Linux is multi-user, multitasking Os. It means you can run more than
    two process simultaneously if you wish. For.g. To find how many files do you have
    on your system you may give command like:


    ```bash

    $ ls -R | wc -l

    ```


    This command will take lot of time to search all files on your system. So you
    can run such command in Background or simultaneously by giving command like


    ```bash

    $ ls -R | wc -l &

    ```


    The ampersand (&) at the end of the command tells shells start process (ls -R
    | wc -l) and run it in Background takes next command immediately.


    Process & PID defined as:


    > *An instance of running command is called process and the number printed by
    shell is called process-id(PID), this PID, can be use to refer specific running
    process.*


    ## Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 2: Getting started with Shell Programming


