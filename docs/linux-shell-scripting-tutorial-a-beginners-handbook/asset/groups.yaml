    \ as follows:\n$ chmod +x nestedfor.sh\n$ ./nestedfor.sh\n11111\n22222\n33333\n\
    44444\n55555\n\nHere, for each value of i the inner loop is cycled through 5 times,\
    \ with the variable j taking values from 1 to 5. The inner loop terminates when\
    \ the value of j exceeds 5, and the outer loop terminates when the value of i\
    \ exceeds 5.\n\nFollowing script is quite interesting, it prints the chess board\
