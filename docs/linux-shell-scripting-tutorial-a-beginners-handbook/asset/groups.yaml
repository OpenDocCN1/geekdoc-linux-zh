    \ and execute them. But if you use command one by one (sequence of 'n' number\
    \ of commands), you can store this sequence of command to text file and tell the\
    \ shell to execute this text file instead of entering the commands. This is know\
    \ as *shell script*.\n\nShell script defined as:\n\n\"Shell Script is *series\
    \ of command written in in plain text file*. Shell script is just like batch file\
    \ is MS-DOS but have more power than the MS-DOS batch file.\"\n\nPrev | Home |\
    \ Next\n\nHow to use Shell\n\nWhy to Write Shell Script ?\n\n# Why to Write Shell\
    \ Script ?\n\n- Shell script can take input from user, file and output them on\
    \ screen.\n- Useful to create our own commands.\n- Save lots of time.\n- To automate\
    \ some task of day today life.\n- System Administration part can also be automated.\n\
    \nWhat is Shell Script ?\n\n# Linux Shell Scripting Tutorial (LSST) v1.05r3\n\
    Chapter 1: Introduction : Linux Shell basics\n\n# Which Shell We are using to\
