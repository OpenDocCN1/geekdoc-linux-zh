    more than two commands ( Multiple commands) from same command line."


    Syntax:

    command1 | command2


    Examples:


    | Command using Pipes | Meaning or Use of Pipes |

    | $ ls | more | Output of ls command is given as input to more command So that
    output is printed one screen full page at a time. |

    | $ who | sort | Output of who command is given as input to sort command So that
    it will sort list of users |

    | $ who | sort > user_list | Same as except output of sort is sent to (redirected)
    user_list file |

    | $ who | wc -l | Output of who command is given as input to wc So that it will
    print number of user who logon to system |

    | $ ls -l | wc -l | Output of ls command is given as input to wc command So that
    it will print number of files in current directory. |'
