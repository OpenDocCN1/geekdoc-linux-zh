  - "[PAGE 167]\n\n# Linux Shell Scripting Tutorial (LSST) v1.05r3\nChapter 7: awk\
    \ Revisited\n\nPrev\n\nNext\n\n# # Loops in awk\n\nFor loop and while loop are\
    \ used for looping purpose in awk.\nSyntax of loop for loop\n\nSyntax:\nfor (expr1;\
    \ condition; expr2)\n{\n  Statement 1\nStatement 2\nStatement N\n}\n\nStatement(s)\
    \ are executed repeatedly UNTIL the condition is true. BEFORE the first iteration,\
    \ expr1 is evaluated. This is usually used to initialize variables for the loop.\
    \ AFTER each iteration of the loop, expr2 is evaluated. This is usually used to\
    \ increment a loop counter.\n\nExample:\n\n```\n$ cat > while01.awk\nBEGIN{\n\
    \  printf \"Press ENTER to continue with for loop example from LSST v1.05r3\\\
    n\"\n}\n{\n  sum = 0\n  i = 1\n  for(i=1; i<=10; i++) {\n    sum += i; # sum =\
    \ sum + i\n  }\n  printf \"Sum for 1 to 10 numbers = %d \\nGoodbuy!\\n\\n\", sum\n\
    \  exit 1\n}\n```\n\nRun it as follows:\n$ awk -f while01.awk\n\nPress ENTER to\
    \ continue with for loop example from LSST v1.05r3\nSum for 1 to 10 numbers =\
    \ 55\nGoodbuy\n\nAbove loops prints the sum of all numbers between 1 to 10, it\
    \ does use very simple for loop to achieve this. Take number from 1 to 10 using\
    \ variable and add it to sum variable as sum = previous sum + current number (i.e.\
    \ i)."
