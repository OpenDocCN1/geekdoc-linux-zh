    file to /home/vivek/final directory. For this purpose write the awk program as
    follows:


    ```

    $ cat > temp2final.awk

    #

    #temp2final.awk

    #Linux Shell Scripting Tutorial v1.05, March 2001

    #Author: Vivek G Gite

    #

    BEGIN{

    }


