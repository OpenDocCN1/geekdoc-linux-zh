    \ command:\n`:/Linux/p`\nLinux is cooool.\nLinux is now 10 years old.\nRani my\
    \ sister never uses Linux\n\nThis will find only \"Linux\" and not the \"linux\"\
    , to overcome this problem try as follows:\n`:/Linux]/p`\nI love linux.\nMy brother\
    \ Vikrant also loves linux who also loves unix.\nHe currently learn linux.\nLinux\
    \ is cooool.\nLinux is now 10 years old.\nNext year linux will be 11 years old.\n\
    Rani my sister never uses Linux.\n. (DOT) is special command of linux.\n\nHere\
    \ a ta list of characters using [ and ], which matches any single character in\
    \ that range. if the first character of list is ^, then it matches any character\
    \ not in the list. In example [Li], will try to match L or l with rest of pattern.\
    \ Let's see another example. Suppose you want to match single digit character\
    \ in range you can give command as follows:\n`/:[0123456789]`\n\nEven you can\
    \ try it as follows:\n`:/g[0-9]`\nLinux is now 10 years old.\nNext year linux\
    \ will be 11 years old.\n\nHere range of digit is specified by giving first digit\
    \ (0-zero) and last digit (1), separated by hyphen. you can try [a-z] for lowercase\
    \ character, [A-Z] for uppercase character. Not just this, there are certain named\
    \ classes of characters which are predefined. They are as follows:\n\n| Predefined\
    \ classes of characters | Meaning |\n|---|---|\n| [:alnum:]] | Letters and Digits\
    \ (A to Z or a to z 0 to 9) |\n| [[:alpha:]] | Letters A to Z or a to z |\n| [[:cntrl:]]\
    \ | Delete character or ordinary control character (0x7F or 0x00 to 0x1F) |\n\n\
    ## Digit (0 to 9)\n\n| | |\n|---|---|\n| [:digit:] | Digit |\n| [:graph:] | Printing\
    \ character, like print, except that a space character is excluded |\n| [:lower:]\
    \ | Lowercase letter (a to z) |\n| [:print:] | Printing character (0x20 to 0x7E)\
    \ |\n| [:punct:] | Punctuation character (ctrl or space) |\n| [:space:] | Space,\
    \ tab, carriage return, new, vertical tab, or feed (0x0D, 0x20) |\n| [:upper:]\
    \ | Uppercase letter (A to Z) |\n| [:xdigit:] | Hexadecimal digit (0 to 9, A to\
    \ F, a to f) |\n\nFor e.g. To find digit or alphabet (Upper as well as lower)\
    \ you will write\n`/[0-9A-Za-Z]`\n\nInstead of writing such command you could\
    \ easily use predefined classes or range as follows:\n`[:alnum:]`\n\n## The .\
    \ (dot) matches any single character.\n\nFor e.g. Type following command:\n`:g/.`\n\
    She only loves to play games and nothing else.\n\nDo you know?\nwill include lo(ves),\
    \ Do, no(thing) etc.\n\n- * Matches the zero or more times\n\nFor e.g. Type following\
    \ command:\n`:g/l*`\nHello World.\nThis is vivek from Poona.\n....\n....\n\n`:g/Li*`\n\
    Linux is coooool.\nLinux is now 10 years old.\nRani my sister never uses Linux\n\
    \n`:g/c.*and`\n.(DOT) is special character of linux.\n\nHere first c character\
    \ is matched, then any single character followed by n number of single character\
    \ (1 or 100 times) and finally ends with and. This can find different word as\
    \ follows command or catad enc.\n\nIn the regular expression metacharacters such\
    \ as . (DOT) or * loose their special meaning if we use \\. or \\*. The backslash\
    \ removes the special meaning of such metacharacters and you can use them as ordinary\
    \ characters. For e.g. if want to search . (DOT) at the beginning of the line,\
    \ you can use\n`:g/^.`\nHello World.\nThis is vivek from Poona.\n...\n...\n(DOT)\
    \ is special command of linux.\nOkay! I will stop.\nInstead of that use\n`:g/^.`\n\
    (DOT) is special command of linux.\n\n## Using & as replacement character\n\n\
    Try the following command:\n```\n:1,$s/Linux-&\n```\nRani my sister never uses\
    \ Linux\nLinux is coooool.\nLinux is now 10 years old.\nRani my sister never uses\
    \ Linux\nThis command will replace target pattern \"Linux\" with \"Linux\". &\
    \ before means \"last pattern found\" with given pattern, So here last pattern\
    \ found is \"Linux\" which is used with given pattern (Finally constructing \"\
    Linux\"). Can you guess the output of this command?\n```\n:1,$s/Linux/&/p\n```\n\
    Congratulation, for successfully completion of this tutorial of regular expressions.\
    \ I hope you have learn from this. To master the expression you have to do lot\
    \ of practice and become power user. Impress your friends with such expressions.\n\
    \n## Converting lowercase character to uppercase\n\nTry the following command\n\
    `:1,$s/[a-z]/&`\nAbove command can be explained as follows:\n\n| Command | Explanation\
    \ |\n|---|---|\n| $1,$ | Line Address location is all i.e. find all lines for\
    \ pattern |\n| s | Substitute command |\n| /[a-z]/ | Find all lowercase letter\
    \ - Target |\n| $1,$& | Substitute to Uppercase. & means substitute last pattern\
    \ matched with its UPPERCASE replacement ($) Note: Use l (small L) for lowercase\
    \ character. |\n| g | Global replacement |\n\nCan you guess the output of following\
    \ command?\n```\n:1,$s/[A-Z]/&\n```\n\n## Introduction to awk\n\nawk utility is\
    \ useful for data manipulation/scripting programming language (In fact based on\
    \ C programming Language). Use awk to handle complex task such as calculation,\
    \ database handling, report creation etc.\n\nGeneral Syntax of awk:\nSyntax:\n\
    `awk -f [awk program file] filename`\n\nawk Program contains:\n```\nPattern {\n\
    \  action 1\n  action 2\n  action N\n}\n```\nawk reads the input from given file\
    \ (or stdin) one line at a time, then each line is compared with pattern. If pattern\
    \ match for each line then given action is taken. Pattern can be regular expressions.\
    \ Following is the summary of common awk metacharacters:\n\n| Metacharacter |\
    \ Meaning |\n|---|---|\n| . (Dot) | Match any character |\n| * | Match zero or\
    \ more character |\n| ^ | Match beginning of line |\n| $ | Match end of line |\n\
    | \\ | Escape character following |\n| [ ] | List |\n| ( ) | Match range of instance\
    \ |\n| + | Match one more preceding |\n| ? | Match zero or one preceding |\n|\
    \ | | Separate choices to match |\n\n## Starting with awk\n\nConsider following\
    \ text database file\n\n| Sr.No | Product | Qty | Unit Price |\n|---|---|---|---|\n\
    | 1 | Pen | 5 | 20.00 |\n| 2 | Rubber | 10 | 2.00 |\n| 3 | Pencil | 3 | 3.50 |\n\
    | 4 | Cock | 2 | 45.50 |\n\nIn above fields are Sr.No, Product, Qty, Unit Price.\
    \ Field is the smallest element of each record. Each fields has its own attributes.\
    \ For e.g Take Qty. field. Q attribute is the numerical(Can contain only numerical\
    \ data). Collection of fields is known as record.\n1. Pen 5 20.00 ---> A Record.\n\
    Collection of record is known as *database* file. In above text database file\
    \ each field is separated using space (or tab character) and record is separated\
    \ using new-line (i.e each record is finished at the end of line ). In the above,\
    \ fields are accessed using special variable. For e.g. In above database $1, $2,\
    \ $3, $4 respectively represents Sr.No, Product, Qty, Unit Price fields. (Don't\
    \ confuse $1,$2 with command line arguments of shell)\n\nFor this part of tool\
    \ command line create text datafile inven (Shown above). Now entering simple awk\
    \ program/command at shell prompt:\n\n```\n$ awk 'print $1 $2 \"-- Rs.\" $3 *\
    \ $4' inven\n1.Pen--> Rs.100\n2.Rubber--> Rs.10.5\n4.Cock--> Rs.91\n```\n\nAbove\
    \ awk program/command can be explained as follows:\n\n| awk program statement\
    \ | Explanation |\n|---|---|\n| '{print $1 $2 \"-- Rs.\" $3 * $4' } | print command\
    \ is used to print contents of variables or enclose in \" text \". Here $1, $2,\
    \ $3,$4 are all the special variable. $1, $2, etc all of the variable contains\
    \ value of field. Finally we can directly the calculation using $3 * $4 i.e multiplication\
    \ of third and fourth field is database. Note that \"-- Rs.\" is string which\
    \ is printed as it.\n"
