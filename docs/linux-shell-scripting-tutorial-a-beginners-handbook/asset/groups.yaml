    \ Rs.91\n\nTotal Rs.221.5\n=============\n\nNow the grand total is printed at\
    \ the end. In above program BEGIN and END patterns are used. BEGIN instruct awk,\
    \ that perform BEGIN actions before the first line (Record) has been read from\
    \ database file. Use BEGIN pattern to set value of variables, to print heading\
    \ for report etc. General syntax of BEGIN is as follows\n\nSyntax:\n\n```\nBEGIN\
    \ {\nnaction 1\naction 2\naction N\n}\n```\n\nEND instruct awk, that perform END\
    \ actions after reading all lines (RECORD) from the database file. General syntax\
    \ of END is as follows:\n\n```\nEND {\naction 1\naction 2\naction N\n}\n```\n\n\
    In our example, BEGIN is used to print heading and END is used print grand total.\n\
    \nPrev\tHome\tNext\nDoing arithmetic with awk\tUp\tUse of printf statement"
