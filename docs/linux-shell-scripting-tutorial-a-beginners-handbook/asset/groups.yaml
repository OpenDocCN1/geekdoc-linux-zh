- md: "\n# Linux Shell Scripting Tutorial v1.05r3\n\nChapter 4: Advanced Shell Scripting\
    \ Commands\n\n## Message box (msgbox) using dialog utility\n\n```\n$ cat > dia2\n\
    dialog --title \"Linux Dialog Utility Msgbox\" --backtitle \"Linux Shell Script\"\
    \ --msgbox \"This is a dialog box called msgbox, which is used\\nto show some\
    \ information on screen which has also OK button, Thanks to Savio Lam\\nand Stuart\
    \ Herbert to give us this utility. Press any key. . . \" 9 50\n```\n\nSave it\
    \ and run as\n\n```\n$ chmod +x dia2\n$ ./dia2\n```\n\n![](img/219cb7c6e1c9c4c56d73838282f4b69b_98_0.png)\n\
    \nUser Interface and dialog utility-Part II\n\n## yesno box using dialog utility\n\
    \n# Linux Shell Scripting Tutorial (LSST) v1.05r3\n\nChapter 4: Advanced Shell\
    \ Script Commands\n\n## yesno box using dialog utility\n\n```\n$ cat dia3\ndialog\
    \ --title \"Alert : Delete File\" --backtitle \"Linux Shell Script\\Tutorial\"\
    \ --yesno \"Do you want to delete /usr/letters/jobapplication/file?\" 7 60\nsel=$?\n\
    sel in\n case $sel in\n 0) echo \"User select to delete file\";\n 1) echo \"User\
    \ select not to delete file\";\n 255) echo \"Canceled by user by pressing [ESC]\
    \ key\";\nesac\n```\n\nSave the script and run it as:\n$ chmod +x dia3\n$ ./dia3\n\
    \n![](img/219cb7c6e1c9c4c56d73838282f4b69b_99_0.png)\n\nAbove script creates yesno\
    \ dialog box, which is used to ask some questions to the user , and answer to\
    \ those either yes or no. After asking question how do we know, whether user press\
    \ yes or no button ? The answer is exit status, if user press button exit status\
    \ will be zero, if user press no button exit status will be one and if user press\
    \ Escape key to cancel dialog box exit status will be 255. That is what we have\
    \ tested in our above script as\nsel=$?\n\n| Statement | Meaning |\n|---|---|\n\
    | | Get exit status of dialog utility |\n\n```\ncase $sel in\n0) echo \"You select\
    \ to delete file\";;\n1) echo \"You select not to delete file\";;\n255) echo \"\
    Canceled by you by pressing [Escape] key\";;\nesac\n```\n\nNow take action according\
    \ to exit status of dialog utility, if exit status is 0 , delete file, if exit\
    \ status is 1 do not delete file and exit status is 255, means file key is pressed.\n\
    \nPrev Message Box (msgbox) using dialog utility (2 of 2)\n\nInput (inputbox)\
    \ using dialog utility\n\n## Input Box (inputbox) using dialog utility\n\n```\n\
    $ cat > dia4\ndialog --title \"Inputbox - To take input from you\" --backtitle\
    \ \"Linux Script Tutorial\" --inputbox \"Enter your name please\" 8 60 2>/tmp/input.\\\
    $\\$\n\nssel=$?\n\nna=$(cat /tmp/input.\\$.\ncase $sel in\n0) echo \"Hello $na\"\
    \ ;;\n1) echo \"Cancel is Press\" ;;\n255) echo \"[ESCAPE] key pressed\" ;;\n\
    esac\n\nrm -f /tmp/input.\\$\n```\n\nRun it as follows:\n$ chmod +x dia4\n$ ./dia4\n\
    \n![](img/219cb7c6e1c9c4c56d73838282f4b69b_101_0.png)\n\nInputbox is used to take\
    \ input from user, In this example we are taking Name of user as input. But where\
    \ we are going to store inputted name, the answer is to redirect inputted name\
    \ to file via statement 2>/tmp/input.\\$\\$ at the end of dialog command, which\
    \ means send screen output to file called /tmp/input.\\$, letter we can retrieve\
    \ the inputted name and store to variable as follows na=cat /tmp/input.\\$. For\
    \ input box's exit status refer the following table:\n\n| Exit Status for Input\
    \ | Meaning |\n|---|---|\n| 0 | Command is successful |\n| 1 | Cancel button is\
    \ pressed by user |\n| 255 | Escape key is pressed by user |\n\nConfirmation Box\
    \ (yesno box) using dialog User Interface using dialog Utility - Putting it all\
    \ together\n\n# Linux Shell Script Tutorial (LSST) v1.05r3\nChapter 4: Advanced\
    \ Shell Scripting Commands\n\n## User Interface using dialog Utility - Putting\
    \ it all together\n\n| MENU-ITEM | ACTION |\n|--- | --- |\n| Date/time | Show\
    \ current date/time |\n| Calendar | Show calendar |\n| Editor | Start vi Editor\
    \ |\n\n```\n$ cat > smenu\n#\n#How to create small menu using dialog \"\ndialog\
    \ --backtitle \"Linux Script Tutorial \" --title \"Main Menu\" --menu \"Move using\
    \ [UP], [DOWN] to Select\" 15 50 3\nDate/time \"Shows Date and Time\"\nCalendar\
    \ \"To see calendar\"\nEditor \"To start vi editor \" 2>/tmp/menuitem.\\$\nmenuitem=`cat\
    \ /tmp/menuitem.\\$\nopt=$?\n\ncase $smenu in\nDate/time) date;;\nCalendar) cal;;\n\
    Editor) vi;;\nesac\n```\n\nSave it and run as:\n$ rm -f /tmp/menuitem.\\$\n$ chmod\
    \ +x smenu\n$ ./smenu\n\n## Linux Shell Script Tutorial\n\n--menu options is used\
    \ of dialog utility to create menus\n\n| MENU-ITEM | MENU-ITEM-DESCRIPTION/ACTION\
    \ |\n|---|---|\n| \"Move using [UP],[DOWN] to Select\" | This is text shown before\
    \ menu |\n| 15 | Height of box |\n| 50 | Width of box |\n| 3 | Height of menu\
    \ |\n| Date/time \"Shows Date and Time\" | First menu item called tag1 (i.e. Date/time)\
    \ and description for menu called item1 |\n| Calendar \"To see calendar \" | First\
    \ menu item called tag2 (i.e. Calendar) and description for menu called item2\
    \ |\n| Editor \"To start vi editor \" | First menu item called tag3 (i.e. Editor)\
    \ and description for menu called item3 |\n| 2>/tmp/menuitem.\\$ | Send selected\
    \ menu item (tag) to this temporary file |\n\n![](img/219cb7c6e1c9c4c56d73838282f4b69b_104_0.png)\n\
    \nAfter creating menus, select user-menu by pressing the ENTER key, selected choice\
    \ is retrieved to temporary file and following case statement operate-items and\
    \ takes appropriate statement to selected menu item. As you see, dialog utility\
    \ allows more powerful interaction than the old reader and echo statement. The\
    \ problem with dialog utility is it work slowly.\n\nInputinputbox) using dialog\
    \ utility trap command\n\n# Linux Shell Scripting Tutorial (LSST) v1.05r3\n\n\
    Chapter 4: Advanced Shell Scripting Commands\n\n## trap command\n\nConsider following\
    \ script example:\n\n```\n$ cat > testsign\nls -R\n```\n\nSave and run it as\n\
    $ chmod +x testsign\n./testsign\n\nNow if you press ctrl + c , while running this\
    \ script, script get terminated. The ctrl + c here work as signal. When signal\
    \ occurs its sent to all process currently running in your system. Now consider\
    \ following shell script:\n\n```\n$ cat > testsign1\n#\n# Why to trap signal,\
    \ version 1\n#\n# Take_input1()\ntake_input1()\n{\nrecno=0\nclear\necho \"Appointment\
    \ Note Application for Linux\"\necho -n \"Enter your database file name : \"\n\
    read filename\nif [ ! -f $filename ]; then\necho \"Sorry, $filename does not exit,\
    \ Creating $filename database\"\necho \"Appointment Note Application database\
    \ file\" > $filename\nfi\necho \"Data entry start data: `date`\" >/tmp/input0.\\\
    $\n#\n# Set an infinite loop\n#\nwhile :\ndo\necho -n \"Appointment Title:\"\n\
    read na\necho -n \"time :\"\nread ti\necho -n \"Any Remark :\"\nread remark\n\
    echo -n \"Is data okay (y/n) ?\"\n```\n\n```\nread ans\nif [ $ans = y -o $ans\
    \ = Y ]; then\n  reco=$(expr $reco + 1)\n  echo $reco. na $ti $remark >> /tmp/input0.\\\
    $\nfi\necho -n \"Add next appointment (y/n)?\"\nread isnt\nif [ $isnext = n -o\
    \ $isnext = N ]; then\n  cat /tmp/input0.\\$ >> $filename\n  rm -f /tmp/input0.\\\
    $\n  return # terminate loop\nfi\ndone\n}\n#\n#\n# Call our user define function\
    \ : Take_input1\n#\nTake_input1\n```\n\nSave it and run as\n$ chmod +x testsign1\n\
    ./testsign1\n\nIt first ask you main database file where all appointment of the\
    \ day is stored, if no database file found, it is created, that it opens one temporary\
    \ file in /tmp directory, and today's date in file. Then one infinite loop begins,\
    \ as appointment title, time and remark, if this information is correct it writes\
    \ to temporary file. After, that asks user, whether/she wants to add appointment\
    \ record, if yes next record is added, otherwise all records are copied from temporary\
    \ file to database file and then loop will be terminated. Now that you can view\
    \ your database file by using cat command. Now problem is that this script, if\
    \ you press CTRL + C, your shell script gets terminated and temporary file are\
    \ left in /tmp directory for e.g. try it as follows\n./testsign1\n"
  mdcn: "\n\n# Linux Shell 脚本教程 v1.05r3\n\n第 4 章：高级 Shell 脚本命令\n\n## 使用 dialog 实用工具创建消息框\
    \ (msgbox)\n\n```\n$ cat > dia2\ndialog --title \"Linux Dialog Utility Msgbox\"\
    \ --backtitle \"Linux Shell Script\" --msgbox \"这是一个名为 msgbox 的对话框，它用于\\n在屏幕上显示一些信息，并包含一个\
    \ OK 按钮。感谢 Savio Lam\\n和 Stuart Herbert 为我们提供这个工具。请按任意键。 . . \" 9 50\n```\n\n\
    保存并运行运行：\n\n```\n$ chmod +x dia2\n$ ./dia2\n```\n\n![](img/219cb7c6e1c9c4c56d73838282f4b69b_98_0.png)\n\
    \n用户界面与 dialog 实用工具 - 第二部分\n\n## 使用 dialog 实用工具创建确认框 (yesno)\n\n# Linux Shell\
    \ 脚本教程 (LSST) v1.05r3\n\n第 4 章：高级 Shell 脚本命令\n\n## 使用 dialog 实用工具创建确认框 (yesno)\n\
    \n```\n$ cat dia3\ndialog --title \"警告：删除文件\" --backtitle \"Linux Shell Script\\\
    nTutorial\" --yesno \"你确定要删除 /usr/letters/jobapplication/file 吗?\" 7 60\nsel=$?\n\
    sel in\n case $sel in\n 0) echo \"用户选择删除文件\";\n 1) echo \"用户选择不删除文件\";\n 255)\
    \ echo \"用户按 [ESC] 键取消\";\nesac\n```\n\n保存脚本并运行：\n$ chmod +x dia3\n$ ./dia3\n\n\
    ![](img/219cb7c6e1c9c4c56d73838282f4b69b_99_0.png)\n\n上述脚本创建了一个 yesno 对话框，用于向用户提问，并获取其是或否的回答。在提问后，我们如何知道用户点击的是\
    \ yes 按钮还是 no 按钮？答案是退出状态（exit status）。如果用户点击按钮，退出状态为 0；如果用户点击 no，退出状态为 1；如果用户按\
    \ Escape 键取消对话框，退出状态为 255。这就是我们在上面的脚本中通过 `sel=$?`的内容。\n\n| 语句 | 含义 |\n|---|---|\n\
    | | 获取 dialog 实用工具的退出状态 |\n\n```\ncase $sel in\n0) echo \"你选择了删除文件\";;\n1) echo\
    \ \"你选择了不删除文件\";;\n255) echo \"你按 [Escape] 键取消了\";;\nesac\n```\n\n现在根据 dialog\
    \ 实用工具的退出状态采取操作：如果退出状态为 0，则删除文件；如果退出状态为 1，则不删除文件；退出状态为 255 则意味着按了取消键。\n\n使用 dialog\
    \ 实用工具创建消息框 (msgbox) (2/2)\n\n使用 dialog 实用工具创建输入框 (inputbox)\n\n## 使用 dialog 实用工具创建输入框\
    \ (inputbox)\n\n```\n$ cat > dia4\ndialog --title \"输入框 - 接收你的输入\" --backtitle\
    \ \"Linux Script Tutorial\" --inputbox \"请输入你的名字\" 8 60 2>/tmp/input.\\$\n\nssel=$?\n\
    \nna=$(cat /tmp/input.\\$.\ncase $sel in\n0) echo \"Hello $na\" ;;\n1) echo \"\
    点击了取消\" ;;\n255) echo \"按了 [ESCAPE] 键\" ;;\nesac\n\nrm -f /tmp/input.\\$\n```\n\
    \n如下所示运行：\n$ chmod +x dia4\n$ ./dia4\n\n![](img/219cb7c6e1c9c4c56d73838282f4b69b_101_0.png)\n\
    \ninputbox 用于接收用户输入。在这个示例中，我们将用户的姓名作为输入。但我们将输入的名称存储在哪里呢？答案是通过 dialog 命令末尾的语句 `2>/tmp/input.$`\
    \ 将输入重定向到文件，这意味着将屏幕输出发送到名为 `/tmp/input.$` 的文件中，随后可以通过以下方式检索输入的名称并存储到变量中：`na=cat\
    \ /tmp/input.$`。输入框的退出状态参考下表：\n\n| 输入退出状态 | 含义 |\n|---|---|\n| 0 | 命令执行成功 |\n\
    | 1 | 用户点击了取消按钮 |\n| 255 | 用户点击了 Escape 键 |\n\n使用 dialog 实用工具创建确认框 (yesno) 使用\
    \ dialog 实用工具的用户界面 - 整合演示\n\n# Linux Shell 脚本教程 (LSST) v1.05r3\n第 4 章：高级 Shell\
    \ 脚本命令\n\n## 使用 dialog 实用工具的用户界面 - 整合演示\n\n| 菜单项 | 操作 |\n|--- | --- |\n| Date/time\
    \ | 显示当前日期/时间 |\n| Calendar | 显示日历 |\n| Editor | 启动 vi 编辑器 |\n\n```\n$ cat > smenu\n\
    #\n# 如何使用 dialog 创建小型菜单 \"\ndialog --backtitle \"Linux Script Tutorial \" --title\
    \ \"主菜单\" --menu \"使用 [向上], [向下] 移动选择\" 15 50 3\nDate/time \"显示日期和时间\"\nCalendar\
    \ \"查看日历\"\nEditor \"启动 vi 编辑器 \" 2>/tmp/menuitem.\\$\nmenuitem=`cat /tmp/menuitem.\\\
    $\nopt=$?\n\ncase $smenu in\nDate/time) date;;\nCalendar) cal;;\nEditor) vi;;\n\
    esac\n```\n\n保存并运行：\n$ rm -f /tmp/menuitem.\\$\n$ chmod +x smenu\n$ ./smenu\n\n\
    Linux 脚本教程\n\n使用 dialog 实用工具创建菜单\n\n| 菜单项 | 操作 |\n|--- |---|\n| \"使用 [向上], [向下]\
