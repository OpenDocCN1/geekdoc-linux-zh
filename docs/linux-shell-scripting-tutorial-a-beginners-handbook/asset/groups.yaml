    # # Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 2: Getting started with Shell Programming


    # # Exit Status


    By default in Linux if particular command/shell script is executed, it return
    two type of values which is used to see whether command or shell script executed
    is successful or not.


    +   (1) If return value is zero (0), command is successful.

    (2) If return value is nonzero, command is not successful or some sort of error
    executing command/shell script.


    This value is know as **Exit Status**.


    But how to find out status of command or shell script?

    Simple, to determine this Exit Status you can use `$?` special variable of shell.


    For e.g. (This example assumes that **unknown1file** does not exist on your hard
    drive)


    ```

    $ rm unknown1file

    It will show error as follows

    rm: cannot remove ''unknown1file'': No such file or directory

    and that if you give command

    ```


    ```

    $ echo $?

    It will print nonzero value to indicate error. Now give command

    $ ls

    $ echo $?

    ```


    It will print 0 to indicate command is successful.


    Exercise

    Try the following commands and not down the exit status:


    ```

    $ expr 1 + 3

    $ echo $?

    ```


    ```

    $ echo Welcome

    $ echo $?

    ```


    ```

    $ wildwest canwork?

    $ echo $?

    ```


    ```

    $ date

    $ echo $?

    ```


    ```

    $ echon $?

    $ echo $?

    ```


    💡$? useful variable, want to know more such Linux variables [click here](http://www.cyberciti.biz/pdf/lsst/ch02sec09.html)
    to explore them!'
