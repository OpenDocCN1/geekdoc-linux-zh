    \ with Shell Programming\n\n# Getting started with Shell Programming\n\nIn this\
    \ part of tutorial you are introduced to shell programming, how to write script,\
    \ execute them etc. We will be getting started with writing small shell script,\
    \ that will print \"Knowledge is Power\" on screen. Before starting with this\
    \ you should know:\n\n- How to use this text editor such as vi, see the common\
    \ vi command for more information.\n- Basic command navigation\n\nMore on Shell...\n\
    How to write shell script\n\n# How to write shell script\n\nFollowing steps are\
    \ required to write shell script:\n\n- (1) Use any editor like vi or mcedit to\
    \ write script.\n- (2) After writing shell script execute permission for your\
    \ script as follows:\n  syntax:\n  `chmod permission your-script-name`\n\n  -\
    \ Examples:\n    `$ chmod +x your-script-name`\n    `$ chmod 755 your-script-name`\n\
    \n  Note: This will set read execute(7) permission for owner, group and other\
    \ permission is read and execute only(5).\n\n- (3) Execute your script as\n  syntax:\n\
    \  `bash your-script-name`\n  `sh your-script-name`\n  `./your-script-name`\n\n\
    \  - Examples:\n    `$ bash bar`\n    `$ sh bar`\n    `$ ./bar`\n\nNOTE In the\
    \ last script / means current directory, But only (dot) mean execute given command\
    \ file in shell without starting the new copy of shell, The Syntax for . (dot)\
    \ command is as follows:\nSyntax:\n  `. command-name`\n\n- Example:\n  `$ . foo`\n\
    \nNow you are ready to write first shell script that will print \"Knowledge is\
    \ Power\" on screen. See the common vi command list, if you are new to vi.\n\n\
    `$ vi first`\n\n```bash\n#\n# My first shell script\n#\nclear\necho \"Knowledge\
    \ is Power\"\n```\n\nAfter saving the above script, you can run the script as\
    \ follows:\n`$ ./first`\n\n# LSST v1.05 > Chapter 2 > How to write shell script\n\
    \nThis will not run script unless we have set execute permission for our script\
    \ first; to do this type command:\n`$ chmod 755 first`\n`$ ./first`\n\nFirst screen\
    \ will be clear, then Knowledge is Power is printed on screen.\n\n| Script Command(s)\
    \ | Meaning |\n| :--- | :--- |\n| $ vi first | # followed by any text is considered\
    \ as comment. Comment gives more information about script, logical explanation\
    \ about shell script. Syntax: # comment-text |\n| # | |\n| # My first script |\
    \ |\n| clear | clear the screen |\n| echo \"Knowledge is Power\" | To print message\
    \ or value of variables on screen, we use echo command, general form of echo command\
    \ is as follows syntax: echo \"Message\" |\n\nHow Shell Locates the file (My own\
