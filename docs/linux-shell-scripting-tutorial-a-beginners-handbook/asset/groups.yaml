    ```\n\n一日一苹果，医生远离我。\n\n编写一个 awk 程序来测试格式说明代码。可以根据你的选择进行编写。\n\n上一个\nawk 中的用户定义变量\n\
    \n主页\n上移\n\n下一个 格式说明代码的使用\n\n# Linux Shell 脚本教程 (LSST) v1.05r3\n\n## 格式说明代码的使用\n\
    \n```\n\n$ cat > bill4\nBEGIN {\n  printf \"Bill for the 4-March-2001.\\n\"\n\
    \  printf \"By Vivek G Gite.\\n\"\n  printf \"--------------------------------\\\
    n\"\n}\n{\n  total = $3 * $4\n  recno = $1\n  item = $2\n  gtotal += total\n \
    \ printf \"%%2d %%-10s Rs.%%2f\\n\", recno, item, total\n}\nEND {\n  printf \"\
    --------------------------------\\n\"\n  printf \"\\tTotal Rs. %%6.2f\\n\",gtotal\n\
    \  printf \"==============================\\n\"}\n```\n\n运行方式\n$ awk -f bill4\
    \ inven\nBill for the 4-March-2001.\nBy Vivek G Gite.\n--------------------------------\n\
    1 Pen Rs. 100.00\n2 Pencil Rs. 20.00\n3 Rubber Rs. 10.50\n4 Cock Rs. 91.00\n--------------------------------\n\
    Total Rs. 221.50\n==============================\n\n从上面的输出可以清楚地看到 printf 可以对格式化输出。让我们尝试理解\
    \ printf 语句的格式化。例如 `%2d`，位于 `%` 和 `d` 之间的数字告诉 printf 为该值分配 2 个空格。同样，如果你编写以下 awk\
    \ 程序，\n\n# LSST v1.05 > 第 7 章 > 格式说明代码的使用\n\n```\n$ cat prf_demo\n{\nna = \"%s|\"\
    , na\nprintf \" %10s|\", na\nprintf \"%-10s|\", na\n}\n```\n\n按照如下方式运行（并输入 God）:\n\
