    \ can be printed using print statement, as print \" \" no1 \" + \" no2 \" = \"\
    \ ans. Note that print statement whatever is enclosed in double quotes (\" text\
    \ \") as it. If string is in double quotes it is not enclosed in it treated as\
    \ variable.\n\nNow try the following awk program and note down its output.\n\n\
    ```awk\n$ cat > bill\n{\ntotal = $3 * $4\nrecno = $1\nitem = $2\nprint recno item\
