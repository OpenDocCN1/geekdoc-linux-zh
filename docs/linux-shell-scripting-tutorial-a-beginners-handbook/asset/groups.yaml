    \ Shell Scripting Tutorial (LSST) v1.05r3\nChapter 7: awk Revisited\n\nPrev Next\n\
    \n## Loops in awk\n\nFor loop and while loop are used for looping purpose in awk.\n\
    Syntax of loop for\n\nSyntax:\nfor (expr1; condition; expr2)\n{\n  Statement 1\n\
    \  Statement 2\n  Statement N\n}\n\nStatement(s) are executed repeatedly UNTIL\
    \ the condition is true. BEFORE the first iteration, expr1 is evaluated. This\
    \ is usually used to initialize variables for the loop. AFTER each iteration of\
    \ the loop, expr2 is evaluated. This is usually used to increment loop counter.\n\
    \nExample:\n\n```\n$ cat > while01.awk\nBEGIN{\n  printf \"Press ENTER to continue\
    \ with loop example from LSST v1.05r3\\n\"\n}\n{\n  sum = 0\n  i = 1\n  for(i=1;\
    \ i<=10; i++) {\n    sum += i; # sum = sum + i\n  }\n  printf \"Sum for 10 numbers\
    \ = %d \\nGoodbye!\\n\", sum\n  exit 1\n}\n```\n\nRun it as follows:\n$ awk -f\
    \ while01.awk\n\nPress ENTER to continue with loop example from LSST v1.05r3\n\
    Sum for 10 numbers = 55\nGoodbye\n\nAbove loops prints the sum of all numbers\
    \ between 1 to 10, it does use very for loop to achieve this. Take number from\
    \ 1 to 10 using variable and add it to sum variable as sum = previous sum + current\
    \ number (i.e. i).\n\n# LSST v1.05 > Chapter 7 > Loops in awk\n\nConsider one\
    \ more example for loop:\n\n```\n$ cat for_loop\nBEGIN {\n    printf \"To test\
    \ for loop\\n\"\n    printf \"Press CTRL + C to stop\\n\"\n}\nfor(i=0;i<NF;i++)\n\
    {\n    printf \"Welcome %s, %d times.\\n\",ENVIRON[\"USER\"], i\n}\n```\n\nRun\
    \ it as (give input as Welcome to Linux!)\n\n$ awk -f for_loop\n\nTo test for\
    \ loop\nPress CTRL + C to Stop\n**Welcome to Linux!**\n\nWelcome vivek, 0 times.\n\
    Welcome vivek, 1 times.\nWelcome vivek, 2 times.\n\nProgram uses loop loop as\
    \ follows:\n\n| for(i=0;i<NF;i++) |\n| printf \"Welcome %s, %d times.\\n\" |\n\
    |ENVIRON[\"USER\"], i | Set the value of i to 0 (Zero); Continue as long as value\
    \ of i is less than NF (Remember NF is built in variable, which mean Mean of Fields\
    \ in record); increment i by 1 (i++)) | Print \"Welcome...\" message, with user\
    \ name who is currently log on and value of i. |\n\nHere i++, is equivalent to\
    \ i = i + 1 statement. ++ is increment operator which increase the value of variable\
    \ by one and -- is decrement operator that decrease the value of variable by one.\
    \ Don't try i+++ (since i++ is not valid operator), instead try i+= 2.\n\nYou\
    \ can use while loop as follows:\n\nSyntax:\n\n```\nwhile (condition)\n{\n   \
    \ statement1\n    statement2\n    statementN\n    Continue as long as condition\
    \ is TRUE\n}\n```\n\nWhile loop will continue as long as given condition is TRUE.\
