    \ v1.05r3\nChapter 1: Introduction: Quick Introduction to Linux\n\n## How to Install\
    \ Linux ?\n\nPlease visit the LESSBS Project home page for Quick Visual Installation\
    \ Guide for Red Hat Linux version 6.2 and 7.2.\n\nHow to get Linux?\n\nWhere I\
    \ can use Linux?\n\n## Where I can use Linux?\n\nYou can use Linux as Server Os\
    \ or as stand alone Os on your PC. (But it is best suited for Server.) As a Server\
    \ Os it provides different services/network resources to client. Client Server\
    \ Os must be:\n\n- Stable\n- Robust\n- Secure\n- High Performance\n\nLinux offers\
    \ for all the above characteristics plus its Open Source and Free Os. So Linux\
    \ can be used as:\n\n(1) On stand alone workstation/PC for word processing, graphics,\
    \ software development, internet, e-mail, chatting, small personal database management\
    \ system etc.\n(2) In network environment environment as:\n\n(A) File and Print\
    \ or Application Server\nShare the data, Connect the expensive device like printer\
