  - "[PAGE 198]\n\n```\n#!/bin/bash\n# Linux Shell Scripting Tutorial 1.05r3, Summer-2002\n\
    # Written by Vivek G. Gite <vivek@nixcraft.com>\n# Latest version can be found\
    \ at http://www.nixcraft.com/\n# Algo:\n# 1) Input number n\n# 2) Set sum=0, sd=0\n\
    # 3) Find single digit in sd as n % 10 it will give (left most digit)\n# 4) Construct\
    \ sum no as sum=sum+sd\n# 5) Decrement n by 1\n# 6) n is greater than zero, if\
    \ yes goto step 3, otherwise next step\n# 7) Print sum\n\nif [ $# -ne 1 ];\nthen\n\
    \    echo \"Usage: $0 number\"\n    echo \"    I will find sum of all digit for\
    \ given number\"\n    echo \"    For eg. $0 123, I will print 6 as sum of all\
    \ digit (1+2+3)\"\n    exit 1\nfi\n\nn=$1\nsum=0\nsd=0\nwhile [ $n -gt 0 ];  \n\
    do\n    sd=`expr $n % 10`\n    sum=`expr $sum + $sd`\n    n=`expr $n / 10`\ndone\n\
    \necho \"Sum of digit for nummer is $sum\"\n```"
