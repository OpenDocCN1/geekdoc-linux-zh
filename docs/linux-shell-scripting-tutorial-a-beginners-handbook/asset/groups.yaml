    \ file or directory。如果你看到错误 $ cat er，则该文件是空的，输出被发送到了错误设备，你无法将其重定向以将此错误输出复制到你的文件\
    \ 'er'。为了解决这个问题，你必须使用以下命令：\n```\n$ rm bad_name_111 2> er\n```\n注意 2 和 > 之间不允许有空格，2>\
    \ 将标准错误输出重定向到文件。2 是 stderr 的默认（文件描述符）。为了让你更清楚，通过编写如下所示的 Shell 脚本提供另一个示例：\n\n```\n\
    $ cat > democr\nif [ $? -ne 2 ]; then\n  echo \"Error : Number not supplied\"\n\
