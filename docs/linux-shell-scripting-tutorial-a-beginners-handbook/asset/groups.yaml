    \  print \"Printing Rec. # NR \"($0 \"),And # of field for this record is \" NF\"\
    \n}\n```\n\nRun it as follows.\n\n```awk\n$awk -f def_var inven\nPrinting Rec.\
    \ #1( Pen 5 20.00),And # of field for this record is 4\nPrinting Rec. #2( Pencil\
    \ 10 2.00),And # of field for this record is 4\nPrinting Rec. #3( Rubber 3.5 30.00),And\
    \ # of field for this record is 4\nPrinting Rec. #4( Cock 2 45.50),And # of field\
    \ for this record is 4\n```\n\nNR and NF are predefined variables of awk which\
    \ means Number of input Record, Number of Fields in input record respectively.\
    \ In example NR is changed as our input record changes, and NF is constant. Following\
    \ table shows list of such built in awk variables.\n\n| awk Variable | Meaning\
    \ |\n|---|---|\n| FILENAME | Name of current input file |\n| RS | Input record\
    \ separator character (Default is new line) |\n| OFS | Output field separator\
    \ string (Blank is default) |\n| ORS | Output record separator string (Default\
    \ is new line) |\n| NF | Number of input record |\n| NR | Number of fields in\
    \ input record |\n| OFMT | Output format of number |\n| FS | Field separator character\
    \ (Blank & tab is default) |\n\n## Doing arithmetic with awk\n\nYou can easily,\
    \ do the arithmetic with awk as follows\n\n```awk\n$ cat > math\n{\n  print $1\
    \ \" + \" $2 \" = \" $1 + $2\n  print $1 \" - \" $2 \" = \" $1 - $2\n  print $1\
    \ \" / \" $2 \" = \" $1 / $2\n  print $1 \" x \" $2 \" = \" $1 * $2\n  print $1\
    \ \" mod \" $2 \" = \" $1 % $2\n}\n```\n\nRun the awk program as follows:\n\n\
    ```awk\n$ awk -f math\n20 3\n20 + 3 = 23\n20 - 3 = 17\n20 / 3 = 6.666667\n20 x\
    \ 3 = 60\n20 mod 3 = 2\n(Press Ctrl + D to terminate)\n```\n\nIn above program\
    \ print $1 \" + \" $2 \" = \" $1 + $2,  statement is used for addition purpose.\
    \ Here $1 + $2, means add second field. Same way you can do - (subtraction ),\
