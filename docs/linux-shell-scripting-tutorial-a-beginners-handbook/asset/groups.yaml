    Save it and run as\n$ chmod +x testsign1\n./testsign1\n\nIt first ask you main\
    \ database file where all appointment of the day is stored, if no database file\
    \ found, it is created, that it opens one temporary file in /tmp directory, and\
    \ today's date in file. Then one infinite loop begins, as appointment title, time\
    \ and remark, if this information is correct it writes to temporary file. After,\
    \ that asks user, whether/she wants to add appointment record, if yes next record\
    \ is added, otherwise all records are copied from temporary file to database file\
    \ and then loop will be terminated. Now that you can view your database file by\
    \ using cat command. Now problem is that this script, if you press CTRL + C, your\
    \ shell script gets terminated and temporary file are left in /tmp directory for\
    \ e.g. try it as follows\n./testsign1\n\nGiven database file name and adding at\
    \ least one appointment record to temporary file press CTRL+C, Our script terminated,\
    \ and it left temporary file in /tmp directory, you can check this by giving command\
    \ as follows\n$ ls /tmp/input*\n\nOur script needs to detect such signal (event)\
    \ when occurs; To achieve this we have to first detect Signal using trap command.\n\
    Syntax:\n\n```\ntrap {commands} {signal number list\n```\n\n| Signal Number |\
    \ When occurs |\n|---|---|\n| 0 | shell exit |\n| 1 | hangup |\n| 2 | interrupt\
    \ (CTRL+C) |"
- md: "\n| 3 | quit |\n| 9 | kill (cannot be caught) |\n\nTo catch signal in above\
    \ script, put trap statement before calling Take_input1 function as trap del_file\
    \ .. . Here trap command called del_file() when number 2 interrupt (i.e. CTRL+C)\
    \ occurs. Open above script in editor and modify it so that at the end it will\
    \ look like follows:\n\n```bash\n$ vi testsignal1\n#\n# signal is trapped to delete\
    \ temporary file , version 2\ndel_file()\n{\n  echo \"* * CTRL + C Trap Occurs\
    \ (removing temporary file)* * *\"\n  rm -f /tmp/input0.*\n  exit 1\n}\n\nTake_input1()\n\
    {\n  recno=0\n  clear\n  echo \"Appointment Note keeper Application for Linux\"\
    \n  echo -n \"Enter your database file name : \"\n  read filename\n  if [ ! -f\
    \ $filename ]; then\n    echo \"Sorry,$filename does not exit, Creating $filename\
    \ database\"\n    echo \"Appointment Note keeper Application database file\" >\
    \ $filename\n  fi\n  echo \"Data entry start data: `date` >/tmp/input0.*\"\n#\n\
    # Set a infinite loop\n#\nwhile :\ndo\n  echo -n \"Appointment Title:\"\n  read\
    \ na\n  echo -n \"time :\"\n  read ti\n  echo -n \"Any Remark :\"\n  read remark\n\
    \  echo -n \"Is data okay (y/n) ?\"\n  read ans\n  if [ $ans = y -o $ans = Y ];\
    \ then\n    recno=`expr $recno + 1`\n    echo \"recno. $na ti $remark\" >> /tmp/input0.*\n\
    \  fi\n  echo -n \"Add next appointment (y/n)?\"\n  read isnext\n  if [ $isnext\
    \ = n -o $isnext = N ]; then\n    cat /tmp/input0.* $filename\n    rm -f /tmp/input0.*\n\
    \    return # terminate loop\n  fi\ndone # end_while\n}\n# Set to trap for CTRL+C\
    \ interrupt i.e. Install our error handler\n# When occurs it first calls del_file()\
    \ and then exit\ntrap del_file 2\n#\n#\n# Call our user define function : Take_input1\n\
    #\nTake_input1\n\nRun the script as:\n$ ./test1\n\nAfter giving database name\
    \ and after giving appointment title press CTRL+C, Here we already captured this\
    \ CTRL+C signal (interrupt), so first function del_file() is called, which gives\
    \ message as \"*** CTRL + C Trap Occurs (removing temporary file)***\" and then\
    \ remove our temporary file and then exit with status 1. Now check /tmp directory\
    \ as follows\n$ ls /tmp/*\n\nShell will report no such file.\n\n## Linux Scripting\
    \ Tutorial (LSST)\nChapter 4: Advanced Scripting Commands\n\n### The shift command\n\
    \nThe shift command moves the values stored in positional parameters (command\
    \ line args) to left one position. For example, if values of current positional\
    \ parameters are: $1 = foo $2 = bar and you executed the shift command resulting\
    \ positional parameters would be as: $1 = bar $2 = \n\nFor e.g. Write the following\
    \ shell script to clear your idea:\n```bash\n$ shift.sh\necho \"command line args\
    \ are: $1, $2, $3\"\nshift\necho \"After shift command the args are: $1, $2, $3\"\
    \n```\n\nYou can also move positional parameters over than one place by specifying\
    \ a number with shift command. The following command would shift positional parameters\
    \ two places: shift 2\n\n### But where to use shift command?\n\nYou can use shift\
    \ command to parse the command line (args) option. For example consider the following\
    \ shell script:\n```bash\n$ convert\nwhile [ \"$1\" != \"\" ]; then\ndo\n    if\
    \ [ \"$1\" = \"-b\" ]; then\n        ob=\"$2\"\n        case $ob in\n        \
    \    16) basesystem=\"Hex\";\n            8) basesystem=\"Oct\";\n           \
    \ 2) basesystem=\"bin\";\n            *) basesystem=\"Unknown\";\n        esac\n\
    \        shift 2\n    elif [ \"$1\" = \"-n\" ]; then\n        num=\"$2\"\n   \
    \     shift 2\n    else\n        echo \"Program $0 does not recognize option $1\"\
    \n        exit 1\n    fi\ndone\noutput=`echo obase=$ob;ibase=10; $num\" | bc\n\
    echo \"$num Decimal number = $output in $basesystem number (base=$ob)\"\n```\n\
    \nSave and run the above shell script as follows:\n```bash\n$ chmod +x convert\n\
    ./convert -b 16 -n 500\n500 Decimal number = 1F4 in Hex number system(base=16)\n\
    ./convert -b 8 -n 500\n500 Decimal number = 764 in Oct number system(base=8)\n\
