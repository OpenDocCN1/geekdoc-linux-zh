    # Linux Shell Scripting Tutorial (LSST) v1.05r3

    Chapter 4: Advanced Shell Scripting Commands


    # The shift Command


    The shift command moves the values stored in the positional parameters (command
    line args) to the left one position. For example, if the values of the current
    positional parameters are:


    $1 = $f $2 = foo $3 = bar

    and you executed the shift command resulting positional parameters would be as
    follows:


    $1 = $foo $2 = bar


    For e.g. Write the following shell script to clear you idea:


    ```

    $ shiftdemo.sh

    echo "echo command line args are: \1=$1, \2=$2, \3=$3"

    shift

    echo "After shift command the args are: \1=$1, \2=$2, \3=$3"

    ```


    Excute above script as follows:

    $ chmod +x shiftdemo.sh

    ./shiftdemo f foo bar


    Current command line args are: $1=-f, $2=foo, $3=bar

    After shift command the args are: $1=foo, $2=bar, $3=$


    You can also move the positional parameters over more than one place by specifying
    a number with the shift command. The following command would shift the positional
    parameters two places:


    ```

    shift 2

    ```


    # But where to use shift command?


    You can use shift command to parse the command line (args) option. For example
    consider the following simple shell script:'
