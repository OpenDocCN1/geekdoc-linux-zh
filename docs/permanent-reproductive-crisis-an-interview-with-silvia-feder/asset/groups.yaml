    ## 打击债务与滚动禧年


    **MV：** 你能定义一下你所说的“scoopereation”是什么意思吗？我以前没听过这个词。


    **SF：** 它是将工人分散开来，阻止他们形成那种通过共同工作而产生的纽带，对于那些曾在战争中服役的工人来说，它瓦解了他们所建立起来的深厚团结感和兄弟情谊。你可以在
    1940 年代晚期的电影中看到这一点。士兵们在共同生活、共同冒着死亡风险生活了几个月后回家，然后他们分开了，他回了家，他有他的女朋友，但女人们对他们来说已经变得陌生。所以这些电影描绘了退伍士兵归来的危机，以及你们如何防止它引发某种叛乱。这就是为什么，拥有自己的房子，给他们一个小王国，妻子总是待在家里，穿着围裙性感诱人等等，是如此重要。利维坦镇（Levittown）是作为对抗共产主义的缓冲区而建造的。这是资本主义的再生产：利维坦镇。现在他们面临着相反的问题。我的感觉是，现在他们面对的是一个有房子，或者至少认为拥有房子是其权利的工人阶级，而他们希望工人阶级的大部分是游牧的，随着公司的需要而迁移。对房子的攻击不仅仅是金融投机的产物。我认为这是一种试图创建更具流动性的劳动力的尝试。现在他们的问题是“动员”这些工人。这是一个重要的区别。显然，我们必须建立集体方式来再生产我们自己，这样我们就不会容易受到这些操纵的影响。此外，再生产工作必须基于扩大的社区，不一定是大家庭，而是扩大的社区，因为再生产人类是非常耗力的，我们在这个过程中可能会毁灭自己，正如现在许多女性所经历的那样，她们生活在一种永久性的危机——永久的再生产危机——中。


    **MV：** 以下是几个例子，也许你可以详细阐述一下，你认为它们的战略方面或矛盾之处。这是关于“打击债务”运动（Strike Debt campaign）和“滚动禧年”（Rolling
    Jubilee）。这里存在着社会再生产与系统性再生产政治之间的一个奇特联系，一方面你在帮助那些欠债的人，但另一方面你同时在帮助那些拥有债务的人，因为当你购买债务时，你也在购买银行的债务……很难说这是谁的债务。


    **SF：** “滚动禧年”将解放一些人。但关键在于，它将学生奴役的问题摆在了台前，向全美展示。我同意奥德丽·洛德（Audre Lorde）的观点：“主人的工具无法摧毁主人的房屋”。因此，我们并不指望通过“滚动禧年”赢得这场斗争。“滚动禧年”是一个时刻，是一种战术，是一场更广泛斗争的一部分。但它赋予了这场斗争以前没有的全国性存在感。这种宣传非常好，因为它向世界展示了这种资本主义的雇佣兵本质，它摧毁了青年的未来，并通过出售教育赚钱。这是一种有效的战术；它有助于扩大斗争，使其可见，并使当局处于守势。它表明有一代青年已被变成银行和收款机构的契约奴仆。


    **MV：** 你指出这一点真的非常重要，而且因为查尔斯·艾森斯坦（Charles Eisenstein）在《卫报》（*Guardian*）上有一篇社论，声称债务禧年将恢复增长，这是完全无政治性的，它既不是左派也不是右派。


    **SF：** 他们喜欢那样……在“打击债务”之前，已经有两个学生组织在应对贷款债务，但他们的做法不同。对于一个组织来说，战略是消费者保护。他们的立场是，作为教育的消费者，我们应该拥有“破产权”——而现在这一点被否定了。另一个组织认为，如果你取消如今已达
    1 万亿美元的学生债务，你将促进增长。这是一种凯恩斯主义策略。“打击债务”更有力，因为它说我们不应该支付，因为这债务是在胁迫下产生的。学生们被告知他们必须接受教育，但他们除了陷入债务外没有实现的方法。而且债务是不合法的，因为教育不是商品，不应被买卖。这种立场有着截然不同的政治含义。至于“滚动禧年”，它是一种有时限的战术，但就当下而言，它是有用的。人们对就业削减的反应是信用卡和其他形式的债务。所以今天，债务首先是对于贫困化的拒绝。这两个债务阶段的共同点在于，在这两种情况下，债务都在控制和塑造我们的未来。不过，我们需要更好地理解债务与阶级斗争之间的关系——工人阶级如何试图利用债务。即使在近期，许多工人，特别是那些像黑人/女性工人，在过去很难获得抵押贷款，它们利用了抵押贷款发放相对宽松的条件来获得住房。事实上，许多因为被发放次级抵押贷款而违约的是黑人女性，往往是单身母亲，她们一直被排斥在抵押贷款市场之外。


    **AD：** 关于创业的问题，特别是连续创业以及破产法是如何被卷入繁荣/萧条创业过程中的。在什么节点上，借贷和破产变得同义？


    **GC：** 破产在美国直到 19 世纪，大约内战时期才开始。在此之前，在大多数州，有债务人监狱——如果你违约，你就进监狱了。这是故事的一部分。到 19
    世纪末，破产制度为资本家确立起来。当工人阶级开始拥有一些抵押品时，它才扩展到工人。如果你没有抵押品，你就不能获得贷款。工人只有在工资成为一种制度后，才开始拥有一些抵押品。有一段时间，个人破产是被允许的，许多工人和学生使用了它。起初使用它相对容易。但到大约
    2005 年，对其适用的严格程度发生了变化。现在，你拥有了所有可能世界中最糟糕的情况，因为你仍然需要房子，或者汽车等，并且必须使用信用卡，但你没有有保障的工资，并且破产变得更加困难。此外，当学生无法偿还贷款时，他们不能破产。这是唯一一种被排除在破产法之外的情况。


    **AD：** 如果你看看公司自愿安排（CVAs）的立法，例如它在中期的 1980 年代从美国引入英国，你会发现它与危机有关。在每一个节点，都有收紧措施：在
    1992 年经济衰退期间，然后在 2000 年代初，你会发现关于 CVAs 的立法被调整和修改以适应雇主的利益——直到 2000 年代末和当前局势，合同义务可以被撕毁，工人被裁员，遣散费被撤回或转移。


    **GC：** 现在有可能出现一个“7 月 4 日”（指新政府或新政，类比美国独立日），但问题是“7 月 4 日”是否开启新的一页，还是仅仅取消现有的债务并在一段时间后重新提出同样的局势。


    **SF：** 我怀疑永远不会有一个真正的“7 月 4 日”。但他们可能会减少学生债务，因为教育是一个敏感问题。然而，有一部分资本希望青年由雇主直接教育。他们更喜欢拥有专门的学术机构，比如矿业大学，或为能源公司服务的大学。


    **MV：** 你在历史唯物主义（Historical Materialism）全体大会上谈到了清洁工和一次组织动员，他们决定与雇主合作以对抗国家，从而从国家获取更多资源。我想请你更详细地解释一下这一点。


    '
