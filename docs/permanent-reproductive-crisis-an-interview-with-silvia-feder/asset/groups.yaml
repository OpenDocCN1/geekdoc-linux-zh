    project can simply seize the forces of production and repurpose them for the ends
    of egalitarian form of society is misconceived. Certainly, many forms of technology
    would have little application without a profit motive, but how, without technology,
    would new social relations breaking with capitalist domination avoid the re-imposition
    of work, either'
