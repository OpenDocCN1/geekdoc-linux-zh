    **GC:** No. The Rolling Jubilee comes out of Strike Debt and it is basically saying
    that proletarian debt is radically different from the debt of the capitalists.
    The conditions for liberation from it are also quite different and the consequences
    are different. What’s happening in this period in history is that in order to
    satifsy our most basic life requirements we have to get into debt.


    **SF:** Many people live on credit cards today, , going from one credit card to
    another. It’s like microfinance, where people must have multiple money lenders.
    In either case, you live on borrowed time until the moment when you cannot do
    it any longer. In the case of microfinance, when you do not pay back they put
    your picture in the streets or on the door of the bank to shame you. In the US,
    they turn you in to the collection agencies. So some people have gone underground
    – they have become refugees from the debt – because the collection agencies call
    you day and night.


    **GC:** Now we understand what collection agencies are all about. They buy debt
    on a secondary market, so the big banks and financial institutions when they have
    trouble collecting sell the debt to them for 1 to 5 percent of its original value
    So, you ask yourself: ‘how much is this debt?’ You’re being tortured to allow
    the collection agencies to make the 95 percent difference. Again you ask yourself:
    is the debt $100,000 or is it $5000? What is the real debt?'
