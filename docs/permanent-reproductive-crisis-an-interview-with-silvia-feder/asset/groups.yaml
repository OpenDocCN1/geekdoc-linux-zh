    traders, small businessmen who had got got some loans from the banks. *El Barzon*
    is the piece of leather that keeps together the wooden yoke between oxen. It''s
    a symbol of slavery. You have a yoke on, that''s the debt. They built a movement
    that organised large demonstrations all over Mexico, they marched in the streets
    with their pockets turned inside out to show that nothing had been left to them.


    Also there were massive protests by women against microfinance in Bolivia in 2002.
    Women came from different parts of the country and laid siege for 90 days to the
    banks in La Paz demanding an end to their debt, stripping themselves to dramatisie
    the fact that they had been reduced to almost nothing. We can see that debt can
    provide a common ground for different struggles.


    ## Self-Reproducing Movements


    **MV:** The question of the durability and expansion of social struggles is something
    you have discussed in terms of building ‘self-reproducing movements’. Movements
    for which reproduction is a necessary aspect of transforming social relations
    in the present, and thus is constitutive of the political horizons of the struggle.
    I guess my question here would be operating backwards and forwards. Given the
    decomposition of the pre-capitalist ‘proletariat’ as experienced in something
    like the witch hunts in early modern Europe, the colonies and many places undergoing
    enclosures or ‘primitive structural adjustment’ at the current moment and in the
    recent past, I''m interested in what kinds of solidarity or re-composition you
    can envision which are far ranging enough for this not only to be resisted, but
    for capital to no longer be able to impose its reproductive crises as the breakdown
    of our social reproduction.


    **SF:** One example that comes to mind is what has taken place in some countries
    of Latin America, where in response to the brutality of neoliberal economic policies,
    thousands of people are constructing new forms of reproduction outside of the
    state. As Raúl Zibechi writes in *Tertitorities In Resistance* (2012), in Latin
    America, in the last decades, the struggle for land has turned into a struggle
    for control over a territory, where to practice autonomous forms of reproduction
    and forms of self-government, as in the case of the Zapatistas or the Movement
    Sans Terre (MST) movement in Brazil. In Bolivia too, the massive struggles that
    took place in 2000 against the privatisation of the water system reached such
    a level of co-ordination and co-operation between the different indigenous populations
    – the Quechua in the Cochabamba area, the Aymara in El Alto – that there was the
    possibility of establishing forms of communal caretaking and self-management of
    formerly public resources. This is taking place in Latin America because through
    the long struggle against colonial and neo-colonial domination people have maintained
    and created strong co-operative forms of existence which we certainly no longer
    have.


    This is why the idea of creating ''self-reproducing'' movements has been so powerful.
    It means creating a certain social fabric and forms of co-operative reproduction
    that can give continuity and strength to our struggles, and a more solid base
    to our solidarity. We need to create forms of life in which political activism
    is not separated from the task of our daily reproduction, so that relations of
    trust and commitment can develop that today remain on the horizon. We need to
    put our lives in common with the lives of other people to have movements that
    are solid and do not rise up and then disappear. Sharing reproduction, this is
    what began to happen within the Occupy Movement and what usually happens when
    a struggle reaches a moment of almost insurrectional power. For example, when
    a strike goes on for several months, people begin to put their lives in common
    because they have to mobilise all their resources not to be defeated. At the same
    time, the idea of a self-reproducing movement is not enough, because it still
    refers to a particular population – the movement – while the goal is to create
    structures that have the power to re-appropriate the ''commonwealth'' and that
    requires what Zibechi calls ''societies in movement''.


    ## Commons and Communism


    **M:** What is the relationship between commons and communism? Is communism an
    expanded common? Are the commons just about reproduction? Given your rather positive
    conception of reproduction as capable of containing within itself the germs for
    revolution how do you separate between social, potentially revolutionary and capitalist
    reproduction? That is, what is there in the commons that is not just more sustainable
    than but actively antagonistic to capital and the state?


    **SF:** Commons and communism. Well, communism is such a big term, but if we think
    of communism in the sense established by the Marxist-socialist tradition, then
    one difference is that in the society of the commons there is no state, not even
    for a transitional period. The assumption that human emancipation or liberation
    has to pass through a dictatorship of the proletariat is not part of the politics
    of the commons. Also a society of commons is not premised on the development of
    mass industrialisation. The idea of the commons is the idea of reclaiming the
    capacity to control our life, to control the means of our (re)production, to share
    them in an egalitarian way and to ''manage'' them collectively. The reconstruction
    of our everyday life, as a strategic aspect of our struggles, is a much more central
    objective in the politics of the commons than it was in the communist tradition.
    Is communism an expanded common? Not if we define it within the parameters of
    the Marxist tradition. But Marx''s description of communism as a society built
    on the association of free producers is compatible with it. Moreover the late
    Marx seems to have become convinced that commons, for example the Russian communes
    could become a foundation for a ''transition to communism'', even though he believed
    this would be possible only if there would be a revolution in Germany, or other
    parts of Europe, providing a technological know-how, so that the Russian communes
    wouldn''t have to go through a capitalist stage. The commons means sharing the
    use of the means of reproduction, starting with the land, and creating co-operative
    form of work. This is already beginning to happen. In Greece and Italy, now, on
    the model of Argentina, workers that have been laid off are taking over factories
    and trying to run them in a self- managed egalitarian way to produce for people''s
    needs, rather than for profit.


    I do not agree with Marx that capitalism enhances the co-operation of labour.
    I don''t think it does even in the process of commodity production, but it certainly
    does not in the process of social reproduction. Capitalism has developed a science
    of ''scoopera tion,'' a term that I have taken from Leopoldo Fortunati''s *The
    Arcane of Reproduction*. An example is the urban planning that took place in American
    cities after WWII when the capitalist class confronted a working class that for
    20 years or more had had a collective experience – first during the Depression,
    when people took to the road, creating hobo jungles, then during the war, in the
    army – and was now coming back from the war restlessly, questioning what they
    had risked their lives for; 1947 saw the highest number of strikes in the history
    of the United States, only matched by 1974. So, they had to ''scoopera te'' these
    workers and that''s what the new urban planning did with the creation of suburbia,
    like Levittown. It sent workers to live far away from the workplace, so that after
    work they wouldn''t go to the bars and instead would go directly home. They planned
    every detail of the new homes politically. They put a lawn in front of the houses
    for the man to mow in his spare time, so he would keep busy instead of going to
    a union hall. There would be an extra room for his tools – these were all instruments
    of scoopera tion.


    ## Scooperation

