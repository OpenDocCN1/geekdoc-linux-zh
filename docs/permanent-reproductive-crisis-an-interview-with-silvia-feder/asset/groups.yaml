    **SF：** 家政工人在美国正进行一场巨大的斗争。他们争取被承认为工人，因为20世纪30年代通过的劳工法律将家政工作排除在“工作”之外。2010年11月，在纽约，家政工人组织“家政工人联合”（Domestic
    Workers United）首次使其工作获得作为工作的承认。这难道不令人惊叹吗？接下来他们要做的是确保其得以实施。因此，同样的家政工人现在正努力建立社区结构，以帮助执行这项权利法案，并像监督机构一样发挥作用。他们还希望与雇主结成联盟进行组织化，以便能够对抗国家，迫使其将适当资源置于再生产工作的支配之下。他们认为，压低工资并迫使工人在恶劣条件下工作并不符合雇主的利益。其论点在于，一个疲惫不堪、过度劳累、因家人远在异地而痛苦、无法休假且思念儿子的保姆，无法胜任对她所期望的工作。这也是护士们一直在提出的论点。当护士们想要罢工等时候，医院试图让病人对抗她们。但护士们说的是：“如果我们每天工作20小时，我们就无法看清我们给你注射的是什么药物。”换言之，工人争取更好的条件并支持他们的斗争，符合病人的利益。


    **MV：** 但家政工人是由雇主支付报酬，而不是由国家支付，对吗？


    **SF：** 她们由雇主支付报酬，但在欧洲许多地区，在80年代和90年代，国家开始向家庭提供资金，以便他们能够照顾缺乏自理能力的老年人。例如，在意大利，他们引入了*陪伴津贴*（salario
    di accompagnamento）。一位老年人，盲人或残障人士每月最多可收到500英镑，用于支付某人照顾她。我猜，你可以称其为一种家务劳动工资。当然，它非常少，但这是一个开始。


    相反，去年在加利福尼亚州，布朗州长拒绝了一项家政工人权利法案，辩称它会损害残障人士的利益，因为他表示，他们将无法支付更高的费用。换言之，家政工人不得不接受低工资，并承认她们与她们照顾的人之间存在利益冲突，并不得不牺牲她们的福祉，因为国家本没有意愿提供能够保证她们和她所照顾的人过上好生活的资源类型。


    **MV：** 这是沃尔玛的论点。工人从低价中受益，因为他们自己拿到的工资很低。


    Silvia Federici <dinavalli AT aol.com> 是一位长期活动家、教师和作家。她是*《零度革命》*（*Revolution at
    Point Zero*，2012）的作者；*《卡利班与女巫：妇女、身体与原始积累》*（*Caliban and the Witch: Women, the
    Body and Primitive Accumulation*，2004）已被翻译成几种语言；并是*《千朵万蕊：非结构大学中的社会斗争对抗结构调整》*（*A
    Thousand Flowers: Social Struggles Against Structural Adjustment in African Universities*，2000）的共同编辑。


    Marina Vishmidt <maviss AT gmail.com> Marina Vishmidt 是一位作家和编辑。她刚在伦敦大学玛丽女王学院完成了关于“艺术和资本中作为生产模式的投机”的博士学位。她主要研究艺术、劳动和价值形式。她经常与艺术家合作，并为
    *Mute, Alterall, Texte zur Kunst, Ephemera, Kaleidoscope, Parkett* 以及相关期刊、选集和目录做出贡献。


