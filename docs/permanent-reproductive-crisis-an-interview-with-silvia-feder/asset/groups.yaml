    # ARTICLES


    # PERMANENT REPRODUCTIVE CRISIS: AN INTERVIEW WITH SILVIA FEDERICI


    By Marina Vishmildt , 7 March 2013


    Politics / Activism / Theory / Feminist / Debt'
  - '[PAGE 1]


    ![](img/6de26ffda7e7850cedcb9be518962231_1_0.png)


    On the occasion of the publication of an anthology of her writing and the accession
    of a *Wages for Housework* NY archive at Mayday Rooms in London, Marina Vishmidt
    interviewed Silvia Federici on her extensive contribution to feminist thought
    and recent work on debt activism (with contributions by *Mute*, Mayday Rooms and
    George Caffentzis)


    **Mute:** In the text ‘Wages Against Housework’ (1975) you refer to the problem
    of women’s work (even waged) as the impossibility of seeing where ‘work begins
    and ends’. Just as French group Théorie Communiste argue that ‘we’ are nothing
    outside of the wage, you also speak of the problem of unwaged women as being outside
    of a ‘social contract’. How does this reflect the capital-labour relation today?
    How much has this situation, then, specific to women and some other workers, generalised?
    How are we to act from the perspective of this being ‘nothing’? Is it still a
    question of self-identification or dis-identification?'
  - '[PAGE 2]


    **Silvia Federici:** We should not assume that those who are unwaged, who work
    outside the social contract stipulated by the wage, are ‘nothing’ or are acting
    and organising out of a position of no social power. I would not even say that
    they are outside the wage relation which I see as something broader than the wage
    itself. One of the achievements of the International Wages For Housework Campaign,
    that we launched in the 1970s, was precisely to unmask not only the amount of
    work that unwaged houseworkers do for capital but, with that, the social power
    that this work potentially confers on them, as domestic work reproduces the worker
    and consequently it is the pillar of every other form of work. We saw an example
    of this power – the power of refusal – in October 1975, when women in Iceland
    went on strike and everything in Reykjavik and other parts of the country where
    the strike took place came to a halt.


    Undoubtedly wagelessness has expanded worldwide and we could say that it has been
    institutionalised with the ‘precarisation of work.’ But we should resist the assumption
    that work conditions have become more uniform and the particular relation that
    women as houseworkers have to capital has been generalised or that work in general
    has become ‘feminised’ because of the precarisation of labour. It is still women
    who do most of the unpaid labour in the home and this has never been precarious.
    On the contrary, it is always there, holidays included. Access to the wage has
    not relieved women from unpaid labour nor has it changed the conditions of the
    ‘workplace’ to enable us to care for our families and enable men to share the
    housework. Those who are employed today work more than ever. So instead of the
    feminisation of waged work we could speak of the ‘masculinisation’ of women’s
    labour,’ as employment has forced us to adapt to an organisation of work that
    is still premised on the assumption that workers are men and they have wives at
    home taking care of the housework.


    If I understand it correctly, the question of ‘dis-identification’ revolves around
    the assumption that naming your oppression and/or identifying your struggle as
    that of a particular type of worker confirms your exploitation. In other words,
    a struggle waged by a slave, or a wage worker or a housewife could never be an
    emancipatory struggle. But I do not agree with this position. Naming your oppression
    is the first step towards transcending it. For us saying ‘we are all housewives’
    never meant to embrace this work, it was a way of denouncing this situation and
    making visible a common terrain on the basis of which we could organise a struggle.
    Recognising the specific ways in which we are exploited is essential to organising
    against it. You cannot organise from a position of ‘nothingness.’ ‘Nothingness’
    is not a terrain of aggregation. It does not place you in a context, in a history
    of struggles. To struggle from a particular work-relation is to recognise our
    power to refuse it.


    I also find it problematic to refer to specific forms of work and exploitation
    as ‘identities’ – a term that evokes unchanging, essentialising characteristics.
    But there is nothing fixed or ‘identifying’ in the particular forms of work we
    perform, unless we decide to dissolve ourselves in them, with what Jean-Paul Sartre
    would call an act of ‘bad faith.’ Whatever the form of my exploitation this is
    not my identity, unless I embrace it, unless I make it the essence of who I am
    and pretend I cannot change it. But my relation to it can be transformed by my
    struggle. Our struggle transforms us and liberates us from the subjectivities
    and social ‘identities’ produced by the organisation of work. The key question
    is whether our struggles presume the continuation of the social relations in which
    our exploitation is inscribed, or aims to put an end to them.


    For the same reason I am sceptical about calls to ‘abolish gender’.


    All over the world women are exploited not only as generic workers or debtors,
    but as persons of a specific gender, for example through the regulation of our
    reproductive capacity, a condition that is unique to women. In the United States
    poor, black women are at risk of being arrested just for the fact of being pregnant,
    according to a health report issued in the US in January. In Italy single mothers
    who turn to the social services for some help risk having their children taken
    away from them and given up for adoption. Again, women in jail receive very different
    treatment to men. And we could multiply the examples. How do we fight against
    these ‘differences’ without using categories such as gender and race? From the
    call centres to the prisons against race matter, the bosses know it, the guards
    know it, and they act accordingly; for us to ignore them, to make them invisible
    is to make it impossible to respond, because in order to struggle against it we
    have to identify the mechanisms by which we are oppressed. What we must oppose
    is being forced to exist within the binary scheme of masculine and feminine and
    the codification of gender specific forms of behaviour. If this is what ‘abolishing
    gender’ means then I am all for it. But it is absurd to assume that any form of
    gender specification must always, necessarily become a means of exploitation and
    we must live in a genderless world. The fact that gender historically, in every
    society based on the exploitation'
  - '[PAGE 3]


    of labour, has been turned into a work function and a mark of social value does
    not compel us to assume that gender will necessarily, always be a means of exploitation
    and we have to pretend that there is no difference between women and men or that
    every difference will be abused. Even in my own lifetime, what ‘woman’ means has
    changed immensely. What being a woman meant for my mother is very different to
    what it means for me. In my own life, for example, I have reconciled myself to
    being a woman because I’ve been involved in the process of transforming what being
    a woman means. So the idea that somehow gender identities are frozen, immutable,
    is unjustified. All the philosophical movements of the 20th century have challenged
    this assumption. The very moment you acknowledge that they are social constructs
    you also recognise that they can be reconstructed. It will not do to simply ignore
    them, push them aside and pretend we are ‘nothing’. We liberate ourselves by acknowledging
    our enslavement because in that recognition are the reasons for our struggle and
    for uniting and organising with other people.


    ![](img/6de26ffda7e7850cedcb9be518962231_3_0.png)


    Image: Silvia Federici in Londen, November 2012


    **M**: The other side of the same question: how would you characterise the ongoing
    division of labour today, particularly the conflict between work covered by the
    wage and that outside of it? How does this still structure the distribution of
    roles? Arguably, for some time, ‘wages’ have been paid to women (particularly
    women with families in the UK – tax credits, child benefit etc.) yet these social
    ‘wages’ still reproduce division within the class. How have these measures recomposed
    class and class division?


    **SF**: Generally speaking I’d say that the social division of labour internationally
    is still structured by the sexual division of labour and the division between
    waged and unwaged work. Reproductive work is still mostly done by women and most
    of it, according to all statistics, is still unpaid. This is particularly true
    of childcare, which is the largest sector of work on earth, especially in the
    case of small children, aged one to five.


    This is something now broadly recognised, as most women live in a state of constant
    crisis, going from work at home to work on the job without any time of their own
    and with domestic work expanding because of the constant cuts in social services.
    This is partly because the feminist movement has fought to ensure that women would
    have access to male dominated forms of employment, but has since abandoned reproductive
    work as a terrain of struggle. There was a time, in the US at least, when feminists
    were even afraid to fight for maternity leave, convinced that if we asked for
    ‘privileges’ we would not be justified in demanding equal treatment. As a result,
    as I mentioned already, the ‘workplace’ has not changed, most jobs do not have
    childcare and do not provide paid maternity leave. This is one struggle feminists
    today should take on.


    I don’t think that ‘wages’ are being paid to women for the domestic work they
    do. Tax credits and family allowances are not wages. They are bonuses to those
    who are employed and in most countries they are paid to the family, which most
    often means to men. They do not remunerate reproductive work, which is why they
    reproduce the divisions within the class.'
