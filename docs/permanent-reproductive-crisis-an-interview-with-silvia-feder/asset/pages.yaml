    # Forces of (Re)production


    **M:** In an interview for LabOrNet TV [http://linkme2.net/rl] you respond to
    a question about your disagreement with the Marxist position on capitalism as
    a precursor to communism. You argue that the development of the forces of production
    is predicated upon the sexual division of labour and thus the notion that a communist
    project can simply seize the forces of production and repurpose them for the ends
    of egalitarian form of society is misconceived. Certainly, many forms of technology
    would have little application without a profit motive, but how, without technology,
    would new social relations breaking with capitalist domination avoid the re-imposition
    of work, either'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'through ‘return to nature’ to primitivist conditions – i.e. work as the entire
    future horizon of humanity – or as in utopian communitarian co-operatives where
    work is ‘fairly’ re-distributed under communal pressure?


    **SF:** I am not against technology. Technology is an indispensable part of our
    lives and it existed long before the advent of capitalism. In fact, Karl Marx
    underestimated the technological achievements of pre-capitalist societies. Think
    of the technology of food production. The populations of Mesoamerica invented
    most of the foodstuffs that we eat today. They invented the tomato, 200 types
    of corn and potatoes. Marx credits capitalism too much for having unleashed the
    productive power of human labour. But my criticism of Marx concerns, above all,
    his belief that large scale industry is a necessary precondition for the advent
    of communism and generally for human development. In reality, much of the technology
    that capitalism has developed was aimed at destroying workers’ organisations and
    reducing the cost of labour production, so it cannot be taken over and redirected
    to positive goals. How do you take over a nuclear or chemical plant for instance?
    Marx himself recognised (in *Capital* Vol. 1) that the industrialisation of agriculture
    ‘depletes the soil as it depletes the worker,’ although he also upheld it as a
    model of rational exploitation of our natural resources. Most capitalist technology
    is destructive of the environment and our health. We see clearly today that industry
    is eating up the earth, and if we had a communist society much of the work we
    would have to do would be spent just cleaning up the planet. This means we have
    to rethink every type of technology. Take the computer, for instance, just one
    computer requires tons of soil and pure water. So the idea that we can have a
    world in which machines do all the work and we can just be their supervisors,
    Marx’s vision in the *Grundrisse*, is untenable. First we have to work to build
    the machines. They are not self-reproducing. Somebody has to take the minerals
    out of the ground and build them. They also require a particular form of social
    organisation and social control that is the opposite of the type of co-operation
    that people need for the construction of an egalitarian society.


    Another important issue is that large scale industrialisation cannot reduce socially
    necessary labour, since a large part of the work on this planet – the work of
    reproducing human beings – is work that is very labour intensive, in which emotional,
    physical and intellectual labour are inseparably combined, and cannot be industrialised
    except at a tremendous cost for those we care for. Think, for example, of the
    work of caring for children or for those who are sick and not self-sufficient.
    I know that in Japan and the US they are inventing household robots and even robots
    that care for people like nursesbobs. But is this the society we want?


    **MV:** But as we were discussing last time, the question of technology is also
    very contradictory in different parts of Marx’s work.


    **SF:** Yes, in different parts of his work Marx recognised the destructive impact
    of industrialisation, on agriculture, for instance. But he obviously assumed that
    the technology capitalism has developed could be restructured and re-channeled
    towards different goals. He idealised science and technology. He assumed they
    could be appropriated by workers and transformed in a way that would enable us
    to liberate ourselves from much work that we do out of necessity, not because
    it enhances our capacities and powers.


    # # The Refusal of Work


    **MV:** I guess if ‘refusal of work’ were thought of as the refusal of particular
    social relations then, as Mariarosa Dalla Costa writes, we would not want the
    industrialisation and collectivisation of food service because there would still
    be women working in those kitchens. But we can also think of collectivised laundries
    as social spaces in Soviet and social democratic states, for example. So we see
    how certain types of reproductive work can be industrialised, but it’s the social
    relations of that work that matter.


    **SF:** Certainly. When we speak of ‘refusal of work’ we have to be careful. We
    need to see that the work of reproducing human beings is a peculiar type of work,
    and it has a double character. It reproduces us for capital, for the labour market,
    as labour power, but it also reproduces our lives and potentially it reproduces
    our revolt against being reduced to labour power. In fact, reproductive labour
    is important for the continuation of working class struggle and, of course, for
    our capacity to reproduce ourselves. This is why we need to understand the double
    character of this work, so that we refuse that part of the work that reproduces
    us for capital; whereas we cannot'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'refuse this work as a whole, because labour-power lives in the individual,
    and if we refuse it completely we risk destroying ourselves and the people we
    care for. I think that one of the most important discoveries the women’s movement
    made was that we could refuse some of this work without jeopardising the well-being
    of our families and communities. Recognising that this work is not just a service
    to our families, but it is also a service to capital liberated us from the sense
    of guilt we always experienced whenever we wanted to refuse it. It was important
    for us to realise that this work does not simply reproduce children, partners,
    communities, but reproduces us as present or future workers because in this way
    we could think of a struggle against housework as a struggle against capital rather
    than against our families. We began to disentangle those aspects of domestic work
    that reproduced us from those that reproduced capital. So the issue is not so
    much the ‘refusal’ of reproductive work, but its reorganisation in a way that
    makes it creative work. This, however, can only happen once this work is not aimed
    at providing workers for the labour market, when it is not subsumed to the logic
    of capital accumulation, and we control the means of our reproduction.


    # The Tyrannies of Microfinance


    **MV:** I think I’d also like to come back to your talk on microfinance with regard
    to this. What you said, that was so important, was how community bonds are actually
    used by microfinance banks to hyper-exploit the recipients of the loans. I guess
    that’s what I had in mind, how these forms of non-capitalist or pre-capitalist
    communal bonds are actually de-composed by capital and how that can be resisted.
    Witch-hunts would be another aspect of this.


    **SF:** The World Bank and other financial institutions have realised that social
    relations are crucial, they see them as a ‘social capital’ and they used them,
    manipulate them, co-opt them to neutralise their subversive potential and domesticate
    the commons. The World Bank, for instance, uses the idea of protecting the ‘global
    commons’, presumably preserving them for the well-being of humanity, to privatise
    forests. They expel the populations – fishermen, indigenous people – who lived
    in them. In the ’90s, in Africa, the Bank also set up communal groups, artificially
    created, often made up of local authorities, that had the power to alienate land.
    This allowed them to get around the fact that people resisted the dismantling
    of communal land ownership and introduction of individual land titling.


    In the case of microfinance, banks and other financial agencies are turning the
    support groups that women have organised into self-policing groups. I’ve read
    that in Bangladesh, when one of the women in the group does not pay back the loan
    she has taken, the others put a lot of pressure on her and even attack her physically
    to force her to pay. The banks’ or the NGOs’ officers and the other women in the
    group ‘break her house’ and take away her pots, which is a great humiliation for
    a woman.


    This is more than an attack on people’s means of reproduction. It is an attack
    on the bonds that people have created on the basis of shared resources. This attack
    on communal solidarity, on the forms of co-operation people have created to strengthen
    their capacity for resistance, is probably the most destructive aspect of microfinance.


    We need to understand the historical conditions that make it possible for these
    groups to be destroyed. Generally the areas in which microfinance has taken root
    are areas where the population has been weakened by years of authoritarian rule,
    or by austerity programs, or by natural disasters or all of the above, as in the
    case of Haiti after Hurricane Sandy, which prompted the intervention of the World
    Bank with a two million dollar investment in micro-loans. There is also the ideological
    work of the religious sects, fundamentalists of one type or another. Not all communal
    forms have the same capacity to resist the assault made on them through various
    forms of privatisation and dispossession.


    This is something that has to been taken into account in the discussions of the
    commons. We need to examine what is happening to the existing commons. In parts
    of Latin America, new commons have been created, as in the case of the Zapatistas
    or the MST. Also, in response to structural adjustment, women have set up communal
    kitchens, communal cooking, communal shopping. In other parts of the world, like
    Africa and India, communal lands have become battlefields. In parts of Africa,
    as the land is shrinking because of massive land-grabbing and'
