- pgno: 4
  md: '**Marina Vishmidt:** I suppose child benefits are paid regardless of employment,
    so that would be a second form of benefit?


    **SF:** I don''t know about England. In the US, until the 1990s, there was a federal
    program called Aid To Families with Dependent Children that allocated some monies
    to sole mothers. It was not sufficient, but it was important because it gave women
    some autonomy, the ability to leave a man if they wanted to, and the recognition
    that raising children is work. We used to say that ''Welfare is the first wages
    for housework.'' However, since the mid 1990s, AFDC has been practically eliminated.
    We are told that Welfare has been replaced by Workfare because now after two years
    women are forced off the rolls, even though many cannot find employment. Also,
    what women receive has been reduced. This has been a defeat, because many women
    now live in miserable conditions, in fact the image of the poor is that of a state-supported
    single mother. Because it was a public declaration that reproductive work is not
    work, it hid how much employers and the state exploit this work. In the US we
    still have to fight even to have paid domestic workers recognised as workers.
    So far only New York State has taken this step, partially adopting in 2010 a Bill
    of Rights that domestic workers had fought for years. But then, recently, Governor
    Brown in California turned down a similar Bill.


    ![](img/6de26ffda7e7850cedcb9be518962231_4_0.png)


    Image: MayDay Rooms website, *Women of The World are Serving Notice*, poster Federici
