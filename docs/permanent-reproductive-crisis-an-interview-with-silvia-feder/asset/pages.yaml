  md: '**SF:** Domestic workers are making a big struggle in the US. They are fighting
    to be recognised as workers, because the labour laws adopted in the 1930s exclude
    domestic work as work. In November 2010, for the first time in New York, an organisation
    of domestic workers, Domestic Workers United, had their work recognised as work.
    Amazing, isn''t it? The next thing they had to do was to make sure it would be
    implemented. So the same domestic workers are now striving to create community
    structures that can help enforce this Bill of Rights and function like watchdogs.
    They also want to organise in alliance with the employers, to be able to confront
    the state and force it to place the appropriate resources at the disposal of reproductive
    work. They believe it is not in the interest of employers to underpay them and
    to force them to work in wretched conditions. The argument is that a tired nanny,
    who is overworked, who is anquished because her family is far away, who cannot
    go on vacation, and is missing her son, cannot properly do the work expected of
    her. It is the same argument nurses have made. The hospitals try to put the patients
    against them when, for example, they want to go on strike. But what the nurses
    say is that ''if we work 20 hours a day, we''re not going to be able to see what
    medicine we are giving you.'' In other words, it is in the interest of the patients
    that workers fight for better conditions and to support their struggle.


    **MV:** But domestic workers are being paid by the employers, not by the state?


    **SF:** They are paid by the employers, but in many parts of Europe in the ''80s
    and ''90s the state began to give money to families to be able to take care of
    non-self-sufficient elderly. For example, in Italy they introduced the *salario
    di accompagnamento*. An elderly person, blind, or otherwise disabled would receive
    up to £500 a month to pay someone to take care of her. I guess, you could call
    it a sort of wages for housework. Of course it is very little, but it is a start.


    In California, instead, last year, Governor Brown rejected a domestic workers
    Bill of Rights arguing that it would hurt people with disabilities, because, he
    said, they would not be able to pay higher rates. In other words, domestic workers
    have to work for low wages and accept there is a conflict of interest between
    them and the people they care for, and have to sacrifice their well being because
    the state had no intention of providing the type of resources that could guarantee
    to them and the people they care for a good life.


    **MV:** It''s the Walmart argument. That workers benefit from low prices because
    they get paid so little themselves.


    Silvia Federici <dinavalli AT aol.com> is a longtime activist, teacher and writer.
    She is the author of *Revolution at Point Zero* (2012); *Caliban and the Witch:
    Women, the Body and Primitive Accumulation* (2004) now translated into several
    languages, and co-editor of A *Thousand Flowers: Social Struggles Against Structural
    Adjustment in African Universities* (2000)


    Marina Vishmidt <maviss AT gmail.com> Marina Vishmidt is a writer and editor.
    She has just completed a Ph.D. at Queen Mary, University of London on ''Speculation
    as a Mode of Production in Art and Capital''. She works mainly on art, labour
    and the value-form. She often works with artists and contributes to *Mute, Alterall,
    Texte zur Kunst, Ephemera, Kaleidoscope, Parkett*, as well as related periodicals,
    collections and catalogues.


