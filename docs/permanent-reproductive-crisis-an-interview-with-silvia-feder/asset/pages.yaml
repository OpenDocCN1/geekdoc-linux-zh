    That''s why debtors'' movements are so important. The first big debtors'' movements
    developed in Latin America. Perhaps the most important was *El Barzon*, that developed
    in Mexico in the late 1980s. It was a powerful movement composed mostly of small
    traders, small businessmen who had got got some loans from the banks. *El Barzon*
