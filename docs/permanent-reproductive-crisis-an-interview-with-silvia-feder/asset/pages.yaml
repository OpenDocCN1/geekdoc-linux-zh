  md: '**Anthony Davies (Mayday Rooms):** Can I ask a question about the normalisation
    of debt. For example, the banking industry has experienced some difficulty cultivating
    personal debt, even quite recently in Turkey and elsewhere due to the sense of
    shame and stigma associated with debt. So, I''m wondering how this might have
    developed incrementally, here in Britain and the US in the post-war period. How
    workers got used to the idea of being in debt, how that experience become an entirely
    normalised aspect of life in general?


    **SF:** That''s an interesting question that requires some research. As far as
    I know, the promotion of indebtedness begins at a time when workers still have
    some social power. Buying on instalment began in the ''20s and then expanded after
    WWII. Incentivising workers to buy on credit was a way of controlling their future.
    It was also a way of diffusing class antagonism by boosting a consumer culture,
    the assumption being that workers would be employed and could pay back. The novelty
    was that buying on credit was an inversion of capitalist policy. Generally, in
    capitalism you work first, then you get paid. This was a reversal. In different
    ways this policy continued until the 1980s. Today''s indebtedness is different
    however. Today people go into debt not because they are sure about their future
    earnings but because they cannot get by or get certain social services without
    borrowing from the banks or using credit cards. For a lot of people the response
    to cuts in employment has been the credit cards and other forms of debt. So today
    debt is above all a refusal of impoverishment. The point in common between these
    two phases of indebtedness is that in both cases debt controls and shapes our
    future. Still, we need to better understand the relation between debt and the
    class struggle – how workers have tried to use debt. Even in recent times, many
    workers, especially those like black/female workers, who in the past found it
    difficult to secure mortgages, took advantage of the relative ease with which
    mortgages were granted to have access to housing. In fact many of those who defaulted
    because they were given sub-prime mortgages were black women, often single mothers,
    who had always been excluded from the mortgage market.


    **AD:** A question around entrepreneurship, particularly serial entrepreneurship
    and the way in which bankruptcy law has been hauled into a boom/bust entrepreneurial
    process. At what point did it become embedded that borrowing and bankruptcy are
    synonymous?


    **GC:** Bankruptcy only begins in the United States in the 19th century, around
    the time of the Civil War. Up until that time, in most states, there was debtors''
    prison – if you defaulted, you went to jail. That was one part of the story. Towards
    the end of the 19th century, bankruptcy became established for the capitalists.
    It was extended to workers when the working class began to have some collateral.
    You couldn''t take out a loan unless you had some collateral. Workers began to
    have some collateral only when the wage became an institution. For a while personal
    bankruptcy was allowed and many workers and students used it. At first it was
    relatively easy to use. But by about 2005 there was a change in the level of stringency
    applied to it. Now, you have the worst of all possible worlds, because you still
    need a house, or a car, etc., and have to use a credit card but you do not have
    a guaranteed wage and it is much more difficult to go bankrupt. Moreover, students
    cannot go bankrupt when they cannot pay back the loans they have taken. They are
    the only case in which bankruptcy is ruled out.


    **AD:** If you take the legislation around Company Voluntary Arrangements (CVAs)
    for example and its introduction into Britain from the US in the mid-1980''s,
    you find that there''s a link to crisis. At each point, there''s a turn of the
    screw: in the economic recession of 1992, then in the early 2000s you find the
    legislation around CVAs being adapted and tweaked to suit the interests of employers
    – until you get to the late 2000s and the current situation, where contractual
    obligations can be ripped up, workers laid off and redundancy payments withdrawn
    or transferred.


    **GC:** Now there is the possibility of a july 4, but the question is whether
    the july 4 will open a new page or simply cancel the existing debts and in time
    re-propose the same situation.


    **SF:** I doubt there will ever be a july 4. But they may reduce student debt
    because education is a sensitive matter. However there is a part of capital that
    wants youth to be educated directly by the employers. They would love to have
    specialised academic institutions, like a mining university, a university serving
    energy companies.


    **MV:** You were talking at the Historical Materialism plenary about cleaners
    and an organising drive where they decided to co-operate with employers against
    the state to get more resources from the state. I just wanted to ask you to explain
    that a bit more.'
