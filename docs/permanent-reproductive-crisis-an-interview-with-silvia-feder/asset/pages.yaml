- pgno: 10
  md: '**MV:** Could you define what you mean by ''scoopereation''? I haven''t heard
    that term before.


    **SF:** It is disaggregetting workers, preventing them from developing the kind
    of bonding that results from working together and in the case of workers who had
    been in the war it was breaking down the deep sense of solidarity, brotherhood,
    they had developed. You can see it in the movies of the late 1940s. The soldiers
    are coming home after living together and risking death together for months, and
    then they separate, he goes home, he has his girlfriend, but the women have become
    strangers to them. So these movies portray the crisis of the returning GI, and
    how do you prevent it from generatring some sort of rebellion? This is why, home
    ownership, giving them a little kingdom, with the wife always at home, sexy with
    the apron on and all that, were so important. Levittown was constructed as a buffer
    against communism. This is the capitalist reproduction: Levittown. Now they have
    the opposite problem. My sense is that now they confront a working class that
    has a house, or at least assumes that the house is its entitlement, whereas they
    want a large part of the working class to be nomadic and move wherever companies
    need it. The attack on the house is not only a product of financial speculation.
    I think it is an attempt to create a workforce that is more mobile. Now their
    problem is ''mobilising'' this worker. That''s an important difference. Clearly
    we have to build collective ways of reproducing ourselves so we are less vulnerable
    to these manipulations. Moreover reproductive work has to be done on the basis
    of expanded communities, not necessarily extended families but expanded communities,
    because reproducing human beings is very labour intensive and we can destroy ourselves
    in the process, as it is happening with so many women now, who live in a state
    of permanent crisis – of permanent reproductive crisis.


    # Strike Debt and the Rolling Jubilee


    **MV:** The following are a few examples that maybe you could elaborate on, what
    you think about their strategic aspects or contradictions. This would be about
    the Strike Debt campaign and about the Rolling Jubilee. Here we have a weird nexus
    between the politics of social reproduction and systemic reproduction, so on the
    one hand you are helping people who owe debt but you are also helping people who
    own debt at the same time because when you are buying the debt, you are also buying
    the banks’ debt... It’s impossible to say whose debt it is.


    **SF:** The Rolling Jubilee will liberate a number of people. But the key thing
    is that it puts the question of student bondage on the map, in front of all America.
    I agree with Audre Lorde that: ''The master’s tools will not dismantle the master’s
    house''. So we are not expecting to win that struggle through rolling jubilees.
    Rolling jubilees is a moment, a tactic, in a much broader struggle. But it has
    given this struggle a nationwide presence it didn’t have before. This kind of
    publicity is very good because it shows the world the mercenary character of this
    capitalism that destroys the youth''s future, and makes money selling education.
    It’s an effective tactic; it serves to broaden the struggle, make it visible and
    put the authorities on the defensive. It says there is a generation of youth who
    have been turned into indentured servants of banks and collection agencies.


    **MV:** It’s really important that you say that, also because there was an editorial
    by Charles Eisenstein in the *Guardian*, saying that a debt jubilee will restore
    growth, this is completely apolitical, it’s neither left nor right.


    **SF:** They love that... Before Strike Debt there were already two student organisations
    dealing with loan debts, but they had a different approach to it. For one organisation
    the strategy was consumer protection. Their position was that as consumers of
    education we should have the ''right to bankruptcy'' –which now is denied. The
    other argued that if you cancelled the student debt, which is now 1 trillion,
    you would boost growth. This is a kind of Keynesian strategy. Strike Debt is much
    more powerful, because it says that we should not pay, because this debt was created
    under duress. Students were told they had to have an education, but they had no
    way of doing it except by falling into debt. And the debt is not legitimate because
    education is not a commodity and should not be bought and sold. This approach
    has a very different political implication. As for Rolling Jubilee, it is a time
    bound tactic, but for the moment it’s useful. People are thinking of a caravan
    to bring Strike Debt throughout the country and build a nation wide network of
    groups.'
