    # Mute


    ARTICLES


    # PACK TO THE FUTURE


    By Marina Vishmidt, 10 May 2022


    + Featured in Mute

    1. No. 24 – Beach or Border?


    ![](img/7383c07f37b339590a799c81ed480e3e_0_0.png)


    Image: from [http://www.solotrek.com]


    Jetpacks promise so much, but they have yet to deliver the dream of solo flight.
    Marina Vishmidt wonders why tomorrow sometimes never comes.


    In The Arcades Project, Walter Benjamin wrote: ''In nature, the new is mythic,
    because its potential is not yet realised; in consciousness, the old is mythic,
    because its desires were never fulfilled.'' The image of individual flight beckons
    in all symbolic plenitude our attempts to transcend nature by emulating it. Da
    Vinci''s experiments with bat wing prototypes, the image persists into the narrative
    of modernity. The aeroplane was the military-industrial sublimation of an evolutionary
    nostalgia to fly the birds. The invention of mass individuality occurred just
    in time for the invention of mass flight, but propulsion into super-modernity
    could only come from the jetpack. And what could be a more congenial environment
    for dismantling limits on personal freedom than-mid-America? The convergence of
    the technologies of marketing, scientific innovation and fantasy accelerated during
    the Cold War. The convergence of tomorrow was never seen again in the spectacular
    forms of fully automated houses and the space programme. Now dismissed as future
    kit, the technological imaginary of the internet never revealed its implications.
    Much of it was out there that it became a form of instant kidult merchandise.
    Few things, however, were more instantaneously awesome than Buzz Lightyear lifting
    off of the 1950''s World''s Fair or demonstrations of jetpacks at the 1984 Olympics
    in LA.


    The jetpack addressed the needs of the Organisation Man to get away from it; from
    the tedious manifestations of bureaucratic reality, and from plan offices and
    traffic jams. Rugged individual flight off the irreducibility of the pioneer spirit
    atomically resisting. We see ads for jetpacks on the internet work with a network
    with a Gnostic enthusiasm: ’things are so ’repair here, let''s just fly away.’
    there is hope – engineers are attempting to give back our mobility by developing
    jetpacks that will eliminate the need for ads altogether! Let the future come
    fast so we can see in the present: an ideology familiar from the example of the
    internet itself. But also like the internet, the jetpack doesn’t reduce to just
    a dumb reification of an ancient dream of delivery transcendence. The internet
    is connected by tendencies that would produce the individual as a consumer in
    a delivery world, and those who wanted more. What achievements could the jetpack
    bring about? The jetpack eliminates obstacles to mobility, freeing us up to think
    about where we are going – a technology to free us from technology. Infrastructure
    such as roads and airports – are not relics of an industrial eternal present we
    might do well to forsake, especially those of us who are always late? Jetpacks
    have a plethora of the most shameless utopian visions: freedom from fossil fuels
    and freedom from borders, the flow of persons as untrammeled as the flow of data.
    Conversely, the jetpack can be figured as the greatest semiotic shorthand for
    globalisation time and space – capital spending time and space.


    But like any technology overcoded with fantasy and disability, jetpack R&D has
    been stuck recapitulating the same square once since the 1960s. A recent test
    by Millennium Jet, a Silicon Valley firm, achieved ‘that lifted the company’s
    CEO to a height of two feet, for twenty seconds.’ Compare this to the 1960s when
    ‘Wendell Moore, an engineer at Bell Aerospace, designed the Bell Rocket belt.
    Partially funded by the US military, this was a small back-mounted board that
    could thrust a person into the air for what amounted to a twenty-second hop.’
    So, when do we start watching the skies?


    Marina Vishmidt <marina AT vishmidt.freeserve.co.uk> is a film/video maker and
    writer and she enjoys cycling between South and East London.

    '
