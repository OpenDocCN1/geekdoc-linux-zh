    # Mute


    文章


    # 迈向未来


    作者：Marina Vishmidt，2022年5月10日


    + 曾登于 Mute

    1. 第24期 – 海滩还是边境？


    ![](img/7383c07f37b339590a799c81ed480e3e_0_0.png)


    图片来源：[http://www.solotrek.com]


    喷气式背包承载着无限希望，但尚未实现独立飞行的梦想。Marina Vishmidt 在思考，为什么明天有时永不降临。


    在《拱廊计划》中，沃尔特·本雅明曾写道：“在自然中，新事物是有神话色彩的，因为它们的潜力尚未实现；在意识中，旧事物是有神话色彩的，因为它们的渴望从未得到满足。”在所有的符号充盈中，当我们试图通过模仿自然来超越自然时，个人飞行的意象正召唤着我们。从达芬奇对蝙翼原型的实验，这一形象一直延续到现代性的叙事中。飞机是人类想要像鸟类一样飞行的这种进化怀旧情绪在军工领域的升华。大规模个性的出现恰好赶上了大规模飞行的发明，但向超现代性的推进只能来自喷气式背包。还有什么环境能比美中地区更适合拆解个人自由的限制呢？营销技术、科学创新与幻想的汇聚在冷战期间加速。这种“明天的汇聚”从未以全自动房屋和太空计划那种壮丽的形式再次出现过。现在被贬低为“未来配件”的互联网技术想象从未揭示其影响。其很大一部分由于太超前，以至于变成了一种即时性的“成人儿童”商品。然而，没有什么能比巴斯·光年（Buzz
    Lightyear）在1950年代世界博览会上的起飞，或者在1984年洛杉矶奥运会上的喷气式背包演示更令人瞬间感到震撼了。


    喷气式背包满足了“组织人”（Organisation Man）逃离现实的需求——逃离官僚现实的枯燥表现，逃离计划办公室和交通拥堵。基于开拓者精神不可还原性的、原子式抵抗的硬朗个人飞行。我们在互联网上喷气式背包广告中看到它们以一种诺斯底式的狂热运作：“这里东西太难修了，让我们直接飞走吧。”这里有希望——工程师们正试图通过开发喷气式背包来还我们移动性，从而完全消除对广告的需求！让未来快点到来，以便我们能在现在看到：一种从互联网本身就能看到的熟悉意识形态。但与互联网一样，喷气式背包并不仅仅还原为对交付超越性这一古老梦想的盲目物化。互联网的连接源于某些趋势，这些趋势会产生在交付世界中作为消费者的个体，以及那些渴望更多的人。喷气式背包能带来什么成就？喷气式背包消除了移动的障碍，让我们有空思考我们要去向何方——一种让我们从技术中解放出来的的技术。道路和机场等基础设施——并不是工业永恒当下的遗迹，也许我们应该抛弃它们，尤其是我们这些总是迟到的人？喷气式背包拥有大量最无耻的乌托邦愿景：摆脱化石燃料和摆脱边境，人员流动如同数据流动一样自由不受阻碍。相反，喷气式背包也可以被视为全球化时空最大的符号缩写——资本在消耗时间和空间。


    但像任何被幻想和局限性过度编码的技术一样，喷气式背包的研发自20世纪60年代以来一直困在重复同一个方框内。硅谷公司 Millennium Jet 最近的一项测试实现了“将公司首席执行官升至两英尺的高度，持续二十秒”。相比之下，在20世纪60年代，“贝尔航空航天公司的工程师温德尔·摩尔（Wendell
    Moore）设计了贝尔火箭带。该设备由美国军方部分资助，是一个小型背部安装板，可以将人推向空中，实现相当于20秒的跳跃。”那么，我们从什么时候开始开始仰望天空呢？


    Marina Vishmidt <marina AT vishmidt.freeserve.co.uk> 是一位电影/视频制作人和作家，她喜欢在伦敦南部和东部之间骑自行车。


    '
