  md: "![](img/b02de69781c8308bc8aec41c4b64075f_4_0.png)\n\nOnce all your information\
    \ gathered from DNSenum, dmitry, and Nmap has been poured over and filtered into\
    \ Maltego, a clean and logical map of your target's environment can be formed.\n\
    \n# 5. Social Engineering Toolkit\n\nThe Social Engineering Toolkit (SET) is designed\
    \ to help the penetration tester work against the human elements of the target's\
    \ security environment. Working with a wide variety of tools, SET enables the\
    \ attacker to exploit weaknesses in security training, as opposed to weaknesses\
    \ in hardware or software.\n\n```\nroot@kali: ~ \nHomepage: https://www.trustedsec.com\
    \ \nWelcome to the Social-Engineer Toolkit (SET).\nThe one stop shop for all your\
