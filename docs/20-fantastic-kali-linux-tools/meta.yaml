  mdcn: '

    来自《Kali Linux 烹饪指南》的 OpenVAS 可发现的各种类型漏洞列表


    ## 第三阶段工具


    ## 渗透尝试


    在此阶段，渗透测试人员将利用环境的逻辑映射图，以及在第一、第二阶段收集的待利用漏洞列表。在攻击者团队中，这是简短休息和收集工具的绝佳时机。在此之前，大多数工具都是相对静默且非侵入性的，虽然
    Kali Linux 通常是一套非常安静的工具集，但从现在开始的攻击模式不可避免会变得嘈杂，这很大程度上取决于防御的质量。如果攻击团队准备就绪，下一步就是选择击中哪种攻击向量。


    ## Wifi 攻击


    - + 8. Aircrack-ng

    Aircrack-ng 是一个向活动网络注入无线数据包的有力工具。该工具依赖于攻击者对攻击机和目标机上无线网卡的了解。在你的攻性环境中部署 Aircrack-ng
    之前，请确保你已获得第一阶段所需的相关信息。


    一旦激活，Aircrack-ng 还可以通过收集无线嗅探的数据包来恢复 802.11 WEP 和 WPA-PSK 密钥。WEP 攻击至少从 2007 年起就在安全社区为人所知且记录良好，但由于网络通信的本质，注入攻击仍然是获取网络的流行方法。


    ## Web 应用攻击


    - + 9. Burp Suite

    Burp Suite 是一个用于 Web 应用程序安全测试的集成平台。它的各种工具无缝协作工作，支持整个测试过程，从对应用程序攻击面的初始映射和分析，到发现和利用安全漏洞。Burp
    赋予你完全控制权，让你将先进的人工技术与顶尖的自动化相结合，使你的工作更快、更高效、更有趣。


    - + 10. Hydra

    Web 漏洞利用是全球防御性安全团队日益头疼的源头。Hydra 是一款极其快速的密码破解工具，支持 50 多种不同协议的攻击。然而，由于 Hydra 攻击模式的性质，它比其他密码破解方法嘈杂得多。暴力破解密码的方法非常有效且速度极快，但在高安全环境中，这应该被视为备用工具，因为它会增加你被发现的概率。


    目前该工具支持：Asterisk, Cisco, Cisco AAA, Cisco enable, CVS, Firebird, FTP, HTTP-FORM-GET,
    HTTP-POST, HTTP-GET, HTTP-PROXY, HTTP-FORM-GET, HTTP-FORM-POST, HTTPS, GET-HEAD,
    HTTP-PROXY, IQ, IMAP, IRC, LDAP, MS-SQL, MySQL, NCP, NTP, Oracle Listener, Oracle
    SID, Oracle, PC-Anywhere, CNAPS, CNOP3, POSTGRES, POP, Rexec, Rlogin, SSH, R-3-300,
    SAP/3, SIP, SMB, SMTP, SMTP Enum, SNMP, SOCKSS, SSH (v1 and v2), Subversion, Teamspeak
    (TS52), Telnet, Vmware-Auth, VNC and XMPP。


    ### Hydra 支持的协议


    - + 11. Owasp - ZAP

    对于关注安全的人来说，Owasp 应该是一个熟悉的名字。开放应用安全项目（Open Application Security Project）作为互联网上最受尊重和活跃的开源项目之一而闻名。Owasp团队于2001年作为非营利组织成立，活跃于信息安全、渗透工具开发和数字自由运动。ZAP
    是“Zed Attack Proxy Project”。该工具对于新手渗透测试人员来说足够简单，对于专业环境来说足够稳健。它内置了被动和主动扫描器，如果没有直接指向待检测文件的链接，则可以使用暴力破解攻击来入侵并搜寻文件。


    ## 密码攻击


    - + 12. John The Ripper

    John The Ripper 以别号 “John” 闻名，作为一种通用攻击工具，它是一个开发良好的密码攻击工具。能够调用不同的密码猜测方法库，使用字典攻击来破解其他工具中使用的复杂的暴力破解方法，John
    是密码猜测软件中的全能型。


    - + 13. Pass the Hash Toolkit

    John 直接针对密码以尝试揭示它，而 Pass Hash Toolkit 允许攻击者从已接受的密码中收集哈希，并在密码被接受后使用这些数据进入系统，而无需使用嘈杂且缓慢的密码猜测技术。在
    SANS 学院的一份非常有信息价值的白皮书中，我们对 PtH 技术有了良好的概述，以及它在与其他渗透工具的上下文位置。


    ## 第四阶段


    ## 漏洞利用


    这是任何渗透测试的核心。上述所有工具都用于获取信息和访问系统。一些具有攻性思维的安全专业人员认为渗透测试的早期阶段是枯燥且乏味的。我认为前三个阶段不像下国际象棋，而第四阶段是在获得回报之前对你复杂计划的最终执行。漏洞利用是你对系统映射和打开大门所做一切工作的证明。不仅如此，在此之前，你必须小心不要造成损坏，并在展示你的发现时，要对安全状态保持清晰和诚实。对系统造成永久性损害是专业渗透测试人员导致自己失业且无法就业的捷径。


    - + 14. Metasploit Framework

    通过 Metasploit Framework 控制台运行的 Metasploit Framework 是 Kali Linux 工具中最先进的工具之一。Metasploit
    团队是传奇性的，他们在攻性信息安全领域的工作是与伦比的。Kali Linux 本身基于开发一个包含所有 Metasploit 工具的操作系统。（注：此段原文存在大量重复和乱码，已根据核心逻辑清理翻译）


    ## Metasploit

    ## 渗透测试员指南


    ![](img/b02de69781c830bc8aec41cb6407f_9_0)


    - + 15. BeEF

    虽然不是直接的攻性工具，但 Kali Linux 构建的漏洞数据库是获取最新可用漏洞的最佳位置。根据描述、作者、平台、类型、语言或端口，EDB 在编写时拥有超过
    30000 个已知漏洞。


    - + 16. Armitage

    忽略网站的奇特风格，Armitage 实际上对于发现和执行漏洞是非常先进的。与 Metasploit 绑定，Armitage 看起来像是脚本小子。


    - + 17. Yersinia

    这是一个由 S21Sec 团队在 2005 年推出的较旧的工具。Yersinia 作为一种攻击二层网络系统的可靠工具重新获得了关注。与 ARP 投毒或缓存攻击等传统攻击不同，Yersinia
    能够针对交换机和集线器。由于许多网络防御有限或配置不当，Yersinia 是攻击目标最薄弱处工具的典型示例。

    '
