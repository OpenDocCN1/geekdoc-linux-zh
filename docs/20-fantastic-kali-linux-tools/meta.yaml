  md: 'Before beginning your penetration test and security auditing, remember that
    the best tool is your own mind. Kali Linux is a suite of tools built to help gather
    information and exploit weaknesses, but the logical decision making and analysis
    is yours. Outside of the technical aspects of attacking, being calm and organized
    will help you more than anything. Further, make sure you have direct permission
    or ownership of the sites involved in your penetration testing. Once you have
    limited your risk to undue influences, it is time to begin phase one of the penetration
    test. Illegal tools and actions must be considered as weapons the attackers may
    implement.


    > A complete and adequate penetration test involves penetration conducting illegal
    activities on systems external or internal to an organization’s network. Organizations
    must understand that penetration testers performing the tests in most cases are
    breaking the law."


    SANS on penetration testing


    # Tools for Phase One


    Information Gathering and Analysis


    Kali Linux has a wonderful set of tools for gathering data on your target. The
    end goal of phase one is to have a logical map of the target’s network, both of
    people and of machines. Any information discovered now may be key to a pivot later
    on, so thoroughness is your ally. Most tools in this stage are very quiet, so
    if time is not a critical factor in your attack, this is the best time to move
    slowly and dig deep. The more you sweat now, the less you''ll bleed later.


    +   1. The first high level maps of an organization’s network will come from locating
    its DNS servers. Starting with a good foundation here will help you find the key
    footholds you’ll need later. DNSenum is a high level tool that is very often the
    first step in mapping your targets network. Using the format ...

    ./dnsenum -enum [TARGET DOMAIN NAME]

    ... we can begin enumeration of the higher level servers available to our target.'
  merge: -1
  pgno: 1
- img_proc: true
