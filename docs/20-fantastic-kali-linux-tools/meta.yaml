- md: "\n![](img/b02de69781c8308bc8aec41c4b64075f_0_0.png)\n\n# 20 Fantastic Kali\
    \ Linux Tools\n\nSwordSec\n\nhttp://www.swordsec.com\n\nNovember, 2014\n\nBefore\
    \ beginning your penetration test and security auditing, remember that the best\
    \ tool is your own mind. Kali Linux is a suite of tools built to help gather information\
    \ and exploit weaknesses, but the logical decision making and analysis is yours.\
    \ Outside of the technical aspects of attacking, being calm and organized will\
    \ help you more than anything. Further, make sure you have direct permission or\
    \ ownership of the sites involved in your penetration testing. Once you have limited\
    \ your risk to undue influences, it is time to begin phase one of the penetration\
    \ test. Illegal tools and actions must be considered as weapons the attackers\
    \ may implement.\n\n> A complete and adequate penetration test involves penetration\
    \ conducting illegal activities on systems external or internal to an organization’s\
    \ network. Organizations must understand that penetration testers performing the\
    \ tests in most cases are breaking the law.\n\nSANS on penetration testing\n\n\
    ## Tools for Phase One\n\n### Information Gathering and Analysis\n\nKali Linux\
    \ has a wonderful set of tools for gathering data on your target. The end goal\
    \ of phase one is to have a logical map of the target’s network, both of people\
    \ and of machines. Any information discovered now may be key to a pivot later\
    \ on, so thoroughness is your ally. Most tools in this stage are very quiet, so\
    \ if time is not a critical factor in your attack, this is the best time to move\
    \ slowly and dig deep. The more you sweat now, the less you'll bleed later.\n\n\
    - 1. The first high level maps of an organization’s network will come from locating\
    \ its DNS servers. Starting with a good foundation here will help you find the\
    \ key footholds you’ll need later. DNSenum is a high level tool that is very often\
    \ the first step in mapping your targets network. Using the format ...\n`./dnsenum\
    \ -enum [TARGET DOMAIN NAME]`\n... we can begin enumeration of the higher level\
    \ servers available to our target.\n\nroot@kali:-\n```bash\n-f,--file <file> \
    \   Read subdomains from this file to perform brute force.\n-u,--update <a|g|r>\
    \          Update the file specified with the -f switch with valid\nsubdomains.\n\
    a (all)                          Update using all results.\ng                \
    \               Update using only google scraping results.\nr                \
    \               Update using only reverse lookup results.\nz                 \
    \              Update using only zonetransfer results.\n-rf, --recursion     \
    \          Recursion on subdomains, brute force all discovered\nmains that has\
    \ an NS record.\nWHOIS NETRANGE OPTION             The maximum value of seconds\
    \ to wait between query\nes, the value is defined randomly, default: 35.\n-w,\
    \ --timeout                   Perform the whole queries on class network ranges.\n\
    \  \"Warning\": this can generate very large netranges and\nit will take a lot\
    \ of time to perform reverse lookups.\nREVERSE LOOKUP OPTIONS:\n-s,--exclude \
    \                   Exclude PTR records that match the regexp expression for\n\
    m reverse lookup results, useful on invalid hostnames.\nOUTPUT OPTIONS:\n-o,--output\
    \ <file>               Output in XML format. Can be imported in MagicTree (www.\n\
    growwall.com)\nroot@kali:-$ dsenenum --enum [TARGET DOMAIN.NAME]\n```\nDNSName\
    \ in terminal\n\n- 2. dmitry - The Network Pathfinder\n\nOnce your DNSName information\
    \ has come back, you will have a range of IP servers used by your target. The\
    \ goal of the dmitryfinder is to find out which IPs are used on those servers.\
    \ This is done using a TCP traceroute command which can be threaded, and displayed\
    \ graphically with dmitry commands.\n\n- 3. Nmap\n\nThe Nmap (Network Map) project\
    \ is famous for its standalone application and open source code. The Nmap tool\
    \ in Kali Linux is used to determine if a host is alive, active, and gives a bounty\
    \ of other information in one quick scan. Nmap is an essential tool for quickly\
    \ gathering specific details on any active machine.\n\n> Nmap uses raw IP packets\
    \ in novel ways to determine what hosts are available the network, what services\
    \ (application name and version) those hosts are offering, what operating systems\
    \ (and OS versions) they are running, what type of packet filters/firewalls are\
    \ in use, and dozens of other characteristics.\n\n![](img/b02de69781c8308bc8aec41c4b64075f_3_0.png)\n\
    \nTo add to the beauty, the Nmap scan can gather all of this information Host\
    \ off only a handful of packets tossed around in such a way as to be quieter than\
    \ many other available tools.\n\n### Maltego\n\nMaltego is an excellent built-tool\
    \ from the development team at Paterva technologies. The design is unique and\
    \ with a little time spent learning how to best play with it. Maltego quickly\
    \ becomes an essential tool for any medium to large scale penetration test. The\
    \ system could be a name, a DNS server, an IP address, a WHOIS lookup, or any\
    \ number of other bits of information. Maltego will determine relationships between\
    \ actors in an environment. with some rooting and come up with a logical map that\
    \ displays these relationships visibly. In invaluable tool for the critical penetration\
    \ tester, these logical maps will shed light on a messy situation, or reaffirm\
    \ suspected relationship links.\n\n![](img/b02de69781c8308bc8aec41c4b64075f_4_0.png)\n\
    \nOnce all your information gathered from DNSenum, dmitry, and Nmap has been poured\
    \ and filtered into Maltego, a clean map of target formed.\n\n- 5. Social Engineering\
    \ Toolkit\n\nThe Social Engineering Toolkit (SET) is designed to help penetration\
    \ testers work against human elements. Working with a variety of tools, SET enables\
    \ the attacker to find weaknesses in security.\n\n```\nroot@kali: ~ \nHomepage:\
    \ www.trustedsec.com\nWelcome to the Social Engineering Toolkit (SET).\nJoin us\
    \ on irc:freencode.net\nThe SocialEngineering Toolkit is a product of TrustedSec.\n\
    Visit: https://www.trustedsec.com\nSelect from the menu:\n1) Social Engineering\
    \ Attacks\n2) Fast-Track Penetration Testing\n3) Third Party Modules\n4) Update\
    \ the Metploit Framework\n5) Update Social Engineering Toolkit\n6) Update configuration\n\
    7) Help, Credits, and About\n9) Exit\n```\n\nPeople are the weakest link in any\
    \ system. Information gained through social engineering can quickly be turned\
    \ into a serious advantage for the penetration team. SET can be accessed by opening\
    \ terminal set. Experience working with java applets will be helpful when working\
    \ with SET.\n\n## Tools for Phase Two\n\n### Vulnerability Detection and Enumeration\n\
    \n- 6. Nessus - Working With Vulnerabilities\n\nTaking your logical map from Maltego,\
    \ and the wealth of technical information gathered from the time spent it's time\
    \ to find vulnerabilities that are in the target system. Nessus takes command\
    \ of the next step, finding vulnerabilities in the local system, in the local\
    \ network, and in both Linux and Windows environments. When checking a network\
    \ for vulnerabilities, Nessus is as thorough as tools. Although Nessus works on\
    \ Kali Linux, it is not bundled with the download, and will need to be downloaded\
    \ and unpacked on the Kali OS. Registration through the Nessus website is also\
    \ required to run this tool.\n\n- 7. OpenVAS - Open Vulnerability Assessment System\n\
    \nOpenVAS is bundled and packed with Kali Linux, but it is less polished than\
    \ its cousin. Both OpenVAS and Nessus work to discover vulnerabilities in local\
    \ systems, networks, and operating systems. After running all your gathered information\
    \ one or both of these, you will have a list of vulnerabilities that will provide\
    \ essential getting into the target system. Using the targeting data we gathered\
    \ in phase one, you can set OpenVAS to scan each machine in the target's network\
    \ for vulnerabilities. After this detailed scan, you can take a step back and\
    \ scan the target network itself for vulnerabilities. The list of weaknesses is\
    \ long and varied, and will give the attackers essential data to help target a\
    \ specific vulnerability to exploit.\n\n- Brute force attacks Gain a shell remotely\n\
    - Buffer overflow General\n- CISCO Malware\n- Compliance Netware\n- Credentials\
    \ NMAP NSE\n- Databases Peer-to-Peer File Sharing\n- Default Accounts Port Scanners\n\
    - Denial of Service Privilege Escalation\n- FTP Product Detection\n- Finger abuses\
    \ RPC\n- Firewalls Remote File Access\n"
  mdcn: "\n\n![](img/b02de69781c8308bc8aec41c4b64075f_0_0.png)\n\n# 20 个实用的 Kali Linux\
    \ 工具\n\nSwordSec\n\nhttp://www.swordsec.com\n\n2014年11月\n\n在开始渗透测试和安全审计之前，请记住最好的工具是你自己的大脑。Kali\
    \ Linux 是一套旨在帮助收集信息和利用漏洞的工具集，但逻辑决策和分析取决于你自己。在攻击的技术方面之外，保持冷静和有组织比任何事情都对你有帮助。此外，确保你对渗透测试涉及的网站拥有直接许可或所有权。一旦你将风险限制在不当影响之外，就可以开始渗透测试的第一阶段了。非法工具和行为必须被视为攻击者可能实施的武器。\n\
    \n> 完整且充分的渗透测试涉及对组织网络内外部系统的渗透非法活动。组织必须理解，在大多数情况下，执行测试的渗透测试人员正在违反法律。\n\nSANS 关于渗透测试的研究\n\
    \n## 第一阶段工具\n\n### 信息收集与分析\n\nKali Linux 拥有一套非常棒的工具用于收集有关目标的数据。第一阶段的最终目标是获得一张目标网络的逻辑地图，包括人员和机器。现在发现的任何信息都可能是以后横移的关键，因此详尽是你的盟友。此阶段的大多数工具都非常安静，所以如果时间不是你攻击的关键因素，那么现在就是缓慢移动并深挖的最佳时机。你现在流的汗越多，以后流血就越少。\n\
    \n- 1. 组织网络的第一幅高层地图将来自定位其 DNS 服务器。从这里建立良好的基础将帮助你找到稍后需要的关键立足点。DNSenum 是一个高级工具，通常是绘制目标网络地图的第一步。使用以下格式\
    \ ...\n`./dnsenum -enum [TARGET DOMAIN NAME]`\n... 我们可以开始对目标可高层服务器进行枚举。\n\nroot@kali:-\n\
    ```bash\n-f,--file <file>    从此文件中读取子域名以进行破解。\n-u,--update <a|g|r>          使用\
    \ -f 关的指定文件更新为有效的子域名。\na (all)                          使用所有结果进行更新。\ng       \
    \                        仅使用 google 爬虫结果进行更新。\nr                             \
    \  仅使用反向查找结果进行更新。\nz                               仅使用 zonetransfer 结果进行更新。\n\
    -rf, --recursion               对子域名进行递归，对所有发现具有 NS 记录的主机进行破解。\nWHOIS NETRANGE\
    \ OPTION             查询之间等待秒的最大值，值随机定义，默认：35。\n-w, --timeout                 \
    \  在类网络范围上执行整个查询。\n  \"Warning\": 这可能会产生巨大的网络范围，\n并且花费大量时间进行反向查找。\nREVERSE LOOKUP\
    \ OPTIONS:\n-s,--exclude                    排除匹配反向查找结果正则表达式的 PTR 记录，对无效的主机有用。\n\
    OUTPUT OPTIONS:\n-o,--output <file>               以 XML 格式输出。可以导入到 MagicTree (www.\n\
    growwall.com)\nroot@kali:-$ dsenenum --enum [TARGET DOMAIN.NAME]\n```\n终端中的 DNSName\n\
    \n- 2. dmitry - 网络路径引导者\n\n一旦你的 DNSName 信息返回，你将获得目标使用的一系列 IP 服务器。dmitryfinder\
    \ 的目标是找出哪些服务器使用了哪些 IP。这是通过使用 TCP traceroute 命令完成的，该命令可以多线程，并使用 dmitry 命令以图形方式显示。\n\
    \n- 3. Nmap\n\nNmap（网络映射）项目以其独立应用程序和开源代码闻名。Kali Linux 中的 Nmap 工具用于判断主机是否存活、活跃，并在一次快速扫描中提供丰富的其他信息。Nmap\
    \ 是快速收集任何活动机器特定详细信息的必用工具。\n\n> Nmap 以新颖的方式使用原始 IP 数据包来确定网络中有哪些可用主机、这些主机提供哪些服务（应用程序名称和版本）、它们运行什么操作系统（以及操作系统版本）、使用了什么类型的数据包过滤器/防火墙，以及数十种其他特征。\n\
    \n![](img/b02de69781c8308bc8aec41c4b64075f_3_0.png)\n\n更美的是，Nmap 扫描只需以这种方式投掷少数数据包即可收集所有这些信息，且这种方式比许多其他可用工具更安静。\n\
    \n### Maltego\n\nMaltego 是来自 Paterva technologies 开发团队的一款出色的内置工具。它的设计独特，只要花一点时间学习如何最好使用它，Maltego\
    \ 就会迅速成为任何中大型渗透测试的必用工具。该系统可以是一个名称、DNS 服务器、IP 地址、WHOIS 查询或任何许多其他信息。Maltego 将确定环境中参与者之间的关系，并通过一些根源生成一个视觉显示这些关系的逻辑地图。对于关键的渗透测试人员来说，这些逻辑地图是无价之，将为混乱的局面提供光明，或确认怀疑的关系链接。\n\
    \n![](img/b02de69781c8308bc8aec41c4b64075f_4_0.png)\n\n一旦将从 DNSenum、dmitry 和 Nmap\
    \ 收集的所有信息倒入并过滤到 Maltego 中，一张清晰的目标地图就形成了。\n\n- 5. 社会工程工具包\n\n社会工程工具包 (SET) 的设计初衷是帮助渗透测试人员针对人类因素工作。通过各种工具，SET\
    \ 允许攻击者发现安全弱点。\n\n```\nroot@kali: ~ 首页：www.trustedsec.com\n欢迎使用社会工程工具包 (SET)。\n\
    加入我们：irc:freencode.net\n社会工程工具包是 TrustedSec 的产品。\n访问：https://www.trustedsec.com\n\
    从菜单中选择：\n1) 社会工程攻击\n2) 快速路径渗透测试\n3) 第三方模块\n4) 更新 Metploit 框架\n5) 更新社会工程工具包\n6)\
    \ 更新配置\n7) 帮助、关于\n9) 退出\n```\n\n是系统中最脆弱的环节。通过社会工程获得的信息可以迅速转化为巨大的优势。可以通过打开终端访问\
    \ SET。使用 java applet 的经验将对 SET 有帮助。\n\n## 第二阶段工具\n\n### 漏洞检测与枚举\n\n- 6. Nessus\
    \ - 漏洞处理\n\n利用来自 Maltego 的逻辑地图以及通过花费时间收集的大量技术信息，现在是寻找目标系统漏洞的时候了。Nessus 接管了下一步，寻找本地系统、本地网络以及\
    \ Linux 和 Windows 环境中的漏洞。在检查网络漏洞时，Nessus 比大多数工具都要详尽。尽管 Nessus 可以在 Kali 上运行，但它没有包含在下载中，需要下载并解包到\
    \ Kali OS 上。运行此工具还需要通过 Nessus 网站注册。\n\n- 7. OpenVAS - 源漏洞评估系统\n\nOpenVAS 随 Kali\
    \ Linux 捆绑，但它没有它的兄弟那样精致。OpenVAS 和 Nessus 都致力于发现本地系统、网络和操作系统的漏洞。在运行所有收集的信息之一或两者后，你将获得一个漏洞列表，这对于进入目标系统至关重要。利用我们在第一阶段收集的目标数据，你可以设置\
    \ OpenVAS 扫描目标网络中的每台机器。在进行详细扫描后，你可以扫描目标网络本身的漏洞。漏洞列表既长又多样，将为攻击者提供关键数据，以帮助针对特定的漏洞。\n\
    \n- 暴力破解 远程获取 shell\n- 缓冲区溢出 通用\n- CISCO 恶意软件\n- 合规性 Netware\n- 凭据 NMAP NSE\n\
    - 数据库 点对点文件共享\n- 默认账户 端口扫描器\n- 拒绝服务 权限提升\n- FTP 产品检测\n- 指纹滥用 RPC\n- 防火墙 远程文件访问\n\
    \n"
  merge: -1
