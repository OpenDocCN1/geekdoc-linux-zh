    \ on class network ranges.\n  \"Warning\": this can generate very large netranges\
    \ and\nit will take a lot of time to perform reverse lookups.\nREVERSE LOOKUP\
    \ OPTIONS:\n-s,--exclude                    Exclude PTR records that match the\
    \ regexp expression for\nm reverse lookup results, useful on invalid hostnames.\n\
    OUTPUT OPTIONS:\n-o,--output <file>               Output in XML format. Can be\
    \ imported in MagicTree (www.\ngrowwall.com)\nroot@kali:-$ dsenum --enum [TARGET\
    \ DOMAIN.NAME]\n```\n\nDNSName in terminal\n\n2. dmitry - The Network Pathfinder\n\
    \nOnce your DNSName information has come back, you will have a range of IP\nservers\
    \ used by your target. The goal of the dmitryfinder is to find out which IPs\n\
    are used on those servers. This is done using a TCP traceroute command which can\n\
    be threaded, and displayed graphically with dmitry commands.\n\n3. Nmap\n\nThe\
    \ Nmap (Network Map) project is famous for its standalone application and open\n\
    source code. The Nmap tool in Kali Linux is used to determine if a host is alive,\
    \ active,\nand gives a bounty of other information in one quick scan. Nmap is\
    \ an essential tool\nfor quickly gathering specific details on any active machine.\n\
    \n> Nmap uses raw IP packets in novel ways to determine what hosts are available\n\
    the network, what services (application name and version) those hosts are offering,\n\
    what operating systems (and OS versions) they are running, what type of packet\n\
    filters/firewalls are in use, and dozens of other characteristics."
