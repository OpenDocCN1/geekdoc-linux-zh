    \  Update using all results.\ng                               Update using only\
    \ google scraping results.\nr                               Update using only\
    \ reverse lookup results.\nz                               Update using only zonetransfer\
    \ results.\n-rf, --recursion               Recursion on subdomains, brute force\
    \ all discovered\nmains that has an NS record.\nWHOIS NETRANGE OPTION        \
