    tool relies on the attackers knowledge of wireless cards, both on the attacking
    machine

    and on the target machine, before deploying Aircrack-ng in your offensive\environment,
    be sure you have the requisite information from phase one.

    Once active, Aircrack-ng can also recover 802.11 WEP and WPA-PSK keys by

    gather packets sniffed wirelessly. WEP attacks have been well known and well

    documented in the security community since at least 2007, but because of the nature

    of networked communication, injection attacks are still a very popular method
    of

    getting access to a network.


    # Web Application Attacking


    +   9. Burp Suite

    Burp Suite is an integrated platform for performing security testing of web applications.

    Its various tools work seamlessly together to support the entire testing process,
    from

    initial mapping and analysis of an application''s attack surface, to finding and

    exploiting security vulnerabilities.Burp gives you full control, letting you combine

    advanced manual techniques with state-of-the-art automation, to make your work

    faster, more effective, and more fun.


    +   10. Hydra

    Web exploitation is a growing source of headaches for defensive security

    teams worldwide. Hydra is an extremely fast password cracking tool which supports

    attacks in over 50 different protocols. However due to the nature of Hydra''s
    attack'
