  - '[PAGE 8]


    # Phase Four


    Exploitation


    This is the real meat of any penetration test. All the above tools are used to
    gain information and access to a system. Some ofensively minded security professionals
    find the early stages of a penetration test to be tedious and dry. I believe the
    first three phases are unlike playing a game of chess, where phase four is the
    final execution of your intricate plans just before a花费. Exploitation is the proof
    of all the work you''ve done in mapping the system and opening the doors. Even
    more so before you, you must be careful not to have been damaged, and when the
    time comes to present your findings, be clear and honest about the state of security.
    Doing permanent damage to a system is a quick way for a professional penetration
    tester to find himself unemployed and unemployable.


    +   14. Metasploit Framework

    Theasploit Framework run through the Metasploit Framework Console is among the
    most advanced tools in the Kali Linux arsenal. The Metasploit team is legendary,
    and their work in the offensive info-sec field is without parallel. Kali Linux
    itself was based on developing an OS that incorporated all the tools of Metasploit
    and Backtrack together. Metasploit could be considered an all-in-one penetration
    testing tool, and for many it is. Of all the tools in this list, Burp Suite comes
    close in robustness and polish that Metasploit offers, and the Burp Suite tools
    are a distant second when compared to the depth of Metasploit''s toolkit. Truly
    the top of the line for a dedicated offensive security professional. Metasploit
    offers tools that can be used in every phase of a penetration test, from passive
    information gathering tools to vulnerability scans. The most exciting part of
    the toolkit comes exploit payload development and delivery.'
  - '[PAGE 9]


    # # Metasploit

    ## Penetration Tester''s Guide


    ![](img/b02de69781c8308bc8aec41c4b64075f_9_0.png)


    Metasploit is an incredibly robust penetration testing toolkit.


    +   15. [The Browser Exploitation Framework](BeEF)

    BeEF is an excellent tool for exploiting vulnerabilities in the browser and browser
    cached information blocks. At the time of writing the BeEF tool in Kali Linux
    is still being smoothed out, with some errors and general usability issues being
    touched up. BeEF specializes in client-side attacks, focusing on the web browser
    itself. No other tool on this list has reached the level of usability and specialization
    in specific location attacks as BeEF. With special methods of attacking a web
    browser, BeEF allows the attacker to hit the system directly from a security vector
    often overlooked by defensive development teams.


    ![](img/b02de69781c8308bc8aec41c4b64075f_9_1.png)


    +   16. Armitage

    Ignoring the quirky anime style of the website, Armitage is actually a very advanced
    tool for finding and executing exploits to allow the penetration team to gain
    access to a network. Bundled with Metasploit, Armitage is not the script-kiddie
    playingthing it appears to be stylistically, but is actually advanced enough for
    professional environments. With built in automation of many different attacks,
    and options to find and exploit several attack vectors on the same target, Armitage
    is a quality weapon in the arsenal even if it is branded in a peculiar way.'
  - '[PAGE 10]


    # 17. Yersinia


    A relatively older tool launched by the S21Sec team in 2005. Yersinia has returned
    to popularity as a reliable tool that attacks Layer 2 network systems. Instead
    of more traditional attacks like ARP poisoning or cache attacks, Yersinia is able
    to go after switches and hubs. With many networks having limited defenses or poorly
    configured networking hardware, Yersinia is a prime example of a tool striking
    where your target is weakest. For, as most defensive security guard web portals,
    databases and workstations, Yersinia is working in an environment where noise
    is the standard and detection is generally weaker.


    # 18. Durandal''s Backdoor (DBD)


    DBD is an new and often overlooked tool to maintain access to compromised systems.
    This is an absolutely essential part of a successful penetration test, especially
    in light of high profile attacks to Home Depot and Target where attackers stayed
    in the system for weeks gaining access. DBD is currently operating in only TCP/IP
    protocol. Reconnection testing is a less exciting part of exploitation, by key
    to making sure defensive systems have their problems solved. Successful DBD testing
    will make the security hole actually closed, instead of simply following the attackers
    while leaving the door open.


    # 19. Exploit Database (EDB)


    While not directly an offensive tool, the exploit database built in Kali Linux
    is the best location for the most-to-date exploits available. Maintained by the
    Kali Linux, Metasploit, and Offensive Security teams, EDB is possibly the best
    place to find exploits in any area of search. By description, author, platform,
    type, language or port, EDB is currently holding over 30,000 known exploits at
    the time of writing.


    ![](img/b02de69781c8308bc8aec41c4b64075f_10_0.png)


    In Kali open up your Iceeless browser. Exploit DB is already bookmarked.'
- md: '

    # Phase Five Reporting


    - 20. RecordMyDesktop

    While working with all the above tools, we leap over the line from safe to illegal
    and work directly with tools that could easily break a business. The point of
    a penetration test is to attack an environment in a controlled way so the defenders
    can have accurate and honest information on their weaknesses. Offensive security
    is a defensive tool. As flashy as exploits may be, everything in your offensive
    arsenal comes down to a simulated attack. Wargaming is only as good as the lessons
    learned at the end. RecordMyDesktop is the least technical tool on this list,
    but in my opinion, the most important. Showing exactly how an exploit worked,
    and having a clear and objective record of the attack taking place will be essential
    for the analysis and cleanup stages after the penetration test has completed.


    Remember to ask questions when in doubt. The tools listed here can be used for
    great evil, and that''s exactly why they were included. Knowing the enemy is half
    the battle.


    Keep yourself safe, and happy hacking.

    '
  mdcn: '


    # 第五阶段报告


    - 20. RecordMyDesktop

    在使用上述所有工具工作时，我们跨越了安全与非法的界限，直接使用可能轻易破坏业务的工具。渗透测试的目的是以受控的方式攻击环境，以便防御者能够获得关于其弱点的准确且诚实的信息。攻击性安全是一种防御工具。尽管漏洞利用（exploits）可能非常华丽，但你进攻武器库中的一切归根结底都是模拟攻击。兵演演习的好坏完全取决于最后吸取的教训。RecordMyDesktop
    是此列表中技术性最低的工具，但在我看来，它是最重要的。准确地展示漏洞利用是如何运作的，并对攻击发生的过程进行清晰、客观的记录，对于渗透测试完成后的分析和清理阶段至关重要。


    在产生疑问时请记得提问。这里列出的工具可能被用于巨大的恶，而这正是它们被包含在内的原因。知彼知己胜之一。


    注意安全，祝黑客愉快。

    '
