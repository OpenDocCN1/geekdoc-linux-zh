    \ SAP/3, SIP, SMB, SMTP, SMTP Enum, SNMP, SOCKSS, SSH (v1 and v2), Subversion,\
    \ Teamspeak (TS52), Telnet, Vmware-Auth, VNC and XMPP.\n\n# Supported protocols\
    \ in Hydra\n\n+   11. Owasp - ZAP\n    For the security-minded, Owasp should be\
    \ a familiar name. The Open Application Security Project is well known as one\
    \ of the most respected and active open source projects on the internet. Founded\
    \ as a nonprofit in 2001, the Owasp team has been active in information security,\
    \ development of penetration tools and digital freedom movements. ZAP is the \"\
    Zed Attack Proxy Project\". The tool is simple enough for new penetration testers,\
    \ and robust for professional environments. Both passive and active scanners are\
    \ built in, and brute force attacks can be used to break in and hunt for files\
