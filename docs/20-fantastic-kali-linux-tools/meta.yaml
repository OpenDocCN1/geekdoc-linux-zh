    3) Third Party Modules\n4) Update the Metasploit Framework\n5) Update the Social-Engineer\
    \ Toolkit\n6) Update SET configuration\n7) Help, Credits, and About\n9) Exit the\
    \ Social-Engineer Toolkit\n```\n\nPeople are the weakest link in any security\
    \ system.\nSocial Engineering takes on a different attack at first glance, but\
    \ information gained through social engineering attacks can quickly be turned\
    \ into a serious"
