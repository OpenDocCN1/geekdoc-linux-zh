- img_proc: true
  md: '![](img/b02de69781c8308bc8aec41c4b64075f_3_0.png)


    To add to the beauty, the Nmap scan can gather all of this information Host off
    only a handful of packets tossed around in such a way as to be quieter than many
    other available tools.


    # ### Maltego


    Maltego is an excellent built-tool from the development team at Paterva technologies.
    The design is unique and with a little time spent learning how to best play with
    it. Maltego quickly becomes an essential tool for any medium to large scale penetration
    test. The system could be a name, a DNS server, an IP address, a WHOIS lookup,
    or any number of other bits of information. Maltego will determine relationships
    between actors in an environment. with some rooting and come up with a logical
    map that displays these relationships visibly. In invaluable tool for the critical
    penetration tester, these logical maps will shed light on a messy situation, or
    reaffirm suspected relationship links.'
  merge: -1
