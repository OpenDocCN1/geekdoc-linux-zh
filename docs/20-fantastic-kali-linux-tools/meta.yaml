  md: "advantage for the penetration testing team. SET can be accessed by opening\
    \ terminal and entering. \"settoolkit. Experience working with java applets will\
    \ be helpful when working with SET to plan attacks. SET can also be used during\
    \ Phase Four : Exploitation, to deliver exploits that help gain access to a target's\
    \ machine. Personally I find it most useful in the information gathering stages,\
    \ although it can be more invasive and louder depending on the level of security\
    \ awareness in the target environment.\n\n# Tools for Phase Two\n\nVulnerability\
    \ Detection and Enumeration\n\n+   6. Nessus - Working With Vulnerabilities\n\
    Taking your logical map from Maltego, and the wealth of technical information\
    \ gathered from the time spent it's time to find vulnerabilities that are in the\
    \ target's system. Neesus takes command of the next step, finding vulnerabilities\
    \ in the local system, in the local network, and in both Linux and Windows environments.\
    \ When checking a network for vulnerabilities, Nessus is as thorough as tools\
    \ come. Although Nessus works on Kali Linux, it is not bundled with the download,\
    \ and will need to be downloaded and unpacked on the Kali OS. Registration through\
