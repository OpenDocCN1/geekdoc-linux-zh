    Emerald. PCManFM is quite modern, but if it''s the only file manager you need
    for the day.


    # 04 Get Browser


    The Web browser is updated every day if you''re interested in its progress, you
    can track the development of the project website. For various Linux systems there''s
    a very handy tool. So without further ado, let''s get it into right away:


