    # 05 Writing a dummy spec


    The image on page 24 illustrates a simple spec file, which can be compiled into
    an RPM containing two files: dummy/dummy.another. To make this work under rpm
    rebuild, the build files must be rebuilt; during the build process you install
    the dummy directory into the sandbox. If the size surpasses the threshold then
    the build will fail. It''s best to fix the problems early in case you need to
    use the lately command in your spec. For example, to build a package with unauthorized
    permissions file, add the following line:


    ```

    setbase(permissions-unauthorized-file, 0);

    ```


    # 06 A brief look at handling the deb format


    Just like RPM, DEB files can be opened with archive managers so that you can see
    the two tarballs: data.tar.gz and control.tar.gz. They are pretty self-explanatory
    — the first contains package files, the second contains package metadata. Building
    DEB packages is different from RPM but still straightforward. In Debian/Ubuntu
    there is one dominating way to handle deb packages: apt is a powerful tool that
    lets you search, install packages and repositories with many companions, like
    dpkg is a simple package tool.


    # 07 Build deb packages


    First, get the essentials


    For example, you might get my-package-0.2.tar.gz, which you wish to convert into
    a DEB package, first prepare a build directory like this:


    ```

    $mkdir -p /tmp/my-package/0.2

    ```


    Then put your tarball into that directory and unpack it `tar xf my-package-0.2.tar.gz`.
    Then you will need to compile the program using these commands:


    ```

    ./configure --prefix=/usr && make

    ```


    If you''re reprogramming a package that already exists in one of your repositories,
    you can develop the dependency resolution by issuing `apt-get build-dev` package
    before installing the `configure` script properly to make it.


    # 05 A simple way: use checkinstall


    Use checkinstall instead of make when you install an application or library from
    source. Checkinstall makes a list for you to specify details (package name, version,
    description, etc) and automatically produces a package. The benefit is made that
    if you need to clean up your system and use the package manager like rpm, zypper,
    yum or dnf. The downside of checkinstall is its limited features. For example,
    you can''t exclude certain files and it won''t work when compiling your own applications,
    as it needs extra hooks for many systems. However, checkinstall is perfect for
    local installations or small OEM tasks, so to try it


