    17 Capture network data using tcpdump and Wireshark


    If the connection fails and you can''t find out where the actual problem is, use
    Tcpdump. Wireshark is a graphical tool to help you inspect network data. The command
    is:


    ```

    $ tcpdump -i any -c 100 port 1234

    ```


    If you cannot solve the problem with tcpdump, capture your data with tcpdump and
    process it with Wireshark.


    Firewall and router issues


    Netcat may behave unexpectedly when trying to pair a server with the -l parameter.
    Difficulty lies in fact that a router or a firewall may not enable connections.
    The router or firewall will block the connection when the source and destination
    are not on same subnet. As a result, the machine cannot listen to the specified
    port, using an inbound port forwarding.


    If you get a wrong after the -k parameter, the connection will terminate automatically.
