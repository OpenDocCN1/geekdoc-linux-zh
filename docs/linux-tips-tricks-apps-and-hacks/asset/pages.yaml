    +   install FTP

    With a server you can now use it to host a website or access storage from the
    server remotely. We can test the latter using FTP, or in case we use VSFTP. Install
    it in your system:


    +   Configure FTP

    We can configure the file for FTP by using nano to /etc/vsftpd.conf. (sudo nano
    /etc/vsftpd.conf). From here we can configure to match ours, but first it is necessary
    that we secure the just slightly before using it properly as an FTP server, just
    to be on the safe side.


    +   Secure your FTP

    The main change to make the FTP secure is to turn off anonymous users. In the
    config file, look for the line with "anonymous"; want to change this to NO if
    it''s not already there, just to make sure there is a bit more security for the
    FTP server and that all of your content is kept private.


    ```

    $ sudo apt-get install vsftpd

    ```'
