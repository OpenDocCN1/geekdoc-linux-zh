  md: '# 02 Basic usage


    The general form of a Netcat command looks like: the following:


    ```

    $ netcat (options) host port

    ```


    The default behavior is similar to a simulated network interaction that uses the
    telnet command, which means that the connection is not secure (encrypted) and
    lacks helpful features.

    If you want to use a range of ports using the minus character between the two
    ports to indicate the range:


    # "Default Netcat behaviour is similar to a simulated network interaction"


    # 03 Netcat as a client


    The most common netcat usage is acting as a client for a server. It is useful
    for troubleshooting servers because you can see the raw data of full interaction.
    The following command will interact with an SMTP server:


    ```

    $ nc linode 25

    ```


    As you can see, you give either the host name or the IP address of the host:


    # 04 Netcat for input and output


    Using Unix pipes, the program can read from a file and be output into a file.
    The input is defined as -filename and the output as +filename. You can use Unix
    pipes to get input from one port and output to other processes:


    # 05 Netcat as a server


    Not only can you use Netcat as a client, you can also use it for creating a server!
    The next netcat command will listen on port number 1234 for incoming TCP connections:


    ```

    $ nc -l 1234

    ```


    The job is done when the -l option tells Netcat to listen for incoming connections.
    The port number is also provided in the command line:


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_46_0.png)


    # 01 Install Netcat


    ```

    # Typical - SSL/TLS tunnel with encryption

    sudo apt-get install netcat-openssl

    netcat5 - TCP/IP socket knife with IPv6 support

    netcat-traditional - TCP/IP socket knife package

    netcat-traditional - TCP/IP army knife

    netcat - like tool with features to transfer files over network

    netcat - traditional version

    nbscat - Multipurpose relay for bidirectional/data transfer

    netcat-traditional - messaging package list: ...

    ```


    The following packages will be installed:

    0 upgraded, 1 installed, 0 remove and not upgraded.


    ```

    $ sudo apt-get install netcat

    ```


    After this operation, 165 KB of disk space will be used. The following new packages
    were installed:


    ```

    0 upgraded, 1 newly installed (18.5 MB), 0 not upgraded, 0 failed to configure.

    ```


    # 06 The UDP protocol


    With all network interactions use the TCP protocol. However, it is also possible
    to use the UDP protocol that is specified with the -u option. This is particularly
    useful because Telcat can only test TCP services. The following command will test
    a DNS server using UDP:


    ```

    $ nc -vu 8.8.8.8 53

    ```


    You can create a UDP server using netcat with the -u option:


    # Use Netcat for port scanning


    Netcat can be used for scanning a range of ports like Nmap. The next netcat command
    scans the 192.168.1.2 range of ports from 20 to 1040:


    ```

    $ nc -zv -n 192.168.1.2 20-1040

    ```


    The -z option tells Netcat to send data. In other words, Netcat closes the connection
    as soon as it opens it, without any actual data taking place. The -n option tells
    Netcat to disable DNS lookup for the given IP address.


    # Finding the problem


    As you already know, Netcat is used for troubleshooting, including traceroute,
    port-scanner, and telnet. You can find and fix problems when you are using this
    service.


    > You can see details on the Netcat package right at the top of this'
