  md: '# # CHOOSING HARDWARE


    What kind of hardware will you require to build a better server?


    The hardware in a server is a very important consideration for your system. Servers
    handle more requests than a normal desktop, often handling dozens of requests
    at once. This means that the resource priorities have changed and these can be
    very different between types of servers.


    Software counts as well, but without a decent hardware, it will be tricky to run
    it effectively. Scalability and peak loads are needed for future-proofing, so
    always try to make sure you have a bit more power than you need for the individual
    components.


    There are six components you need to consider and the four most important are
    the processor, RAM and power supply - the components on your computer. As mentioned,
    you will need to think about what you need because resource usage is an important
    factor.


    A minor concern for servers is a graphics card, as it''s not necessary to interact
    directly with the server, but many benefit from different cores. You''ll also
    need some storage for your server build.


    # Motherboard


    Motherboards for servers come in styles. A lot of servers have two slots to connect
    a CPU, which is good for small businesses or if you expect to get a lot of them.
    They are also much more expensive than CPUs, but the benefits in the long run
    for a big office server are worth.


    For home use, a single slot for a processor will be enough for most cases, in
    the most part


    being a web server where you have to have a lot of regular connections to make
    it. In this, you want to keep an eye out for motherboards with enough slots to
    make it flexible and scalable as needed.


    # CPU


    The most important thing for a server CPU is the number of cores - that is why
    multi-core is useful. More cores allow for more threads, especially if you plan
    to run many VMs or file servers at the same time. Clock speed is not as important,
    but it helps when you are running many tasks simultaneously.


    With Intel''s HyperThreading, each core can handle two threads by creating virtual
    cores. AMD does the same with their processors at a lower price, especially if
    you''re on a budget.


    # RAM


    A larger amount of RAM is important because it allows you to run more operations
    at once. At some point speed and latency are not as important, so gaming RAM with
    tweaked timings will not get you a better server - in fact, it may be worse


    # PSU


    While it''s best to practice never skip on power supply when it comes to server.
    You may need enough watts for all your components (electricity bills will be damned),
    but you may need less for a home server, depending on your needs. One of these
    have been shown with some level of certification to ensure they have a degree
    of reliability - this is a good thing. Titanium and Platinum are the highest ratings,
    in the long run. Titanium and Platinum are all the time they will save on electricity
    90 cent efficiency vs 88 cent efficiency for server power supplies.


    # MOTHERBOARD


    When we talk about slots and connections, for a motherboard we''re talking about
    CPU slots and plenty of SATA drives. If you need more SATA slots on a card, you''ll
    need to take into account anything else you''d want to add a card for. You also
    need to make sure the motherboard''s chip matches up with the kind of CPU you
    use as well, and the CPU will also enable the type of RAM you need. it''s a multi-layered
    acting that may result in a set which you compare and contrast


    # FIBRE CARD


    Networking cards are essential if you are acting like a more traditional network
    server, handling all network data and even being used as a modem and firewall.
    There are plenty of different PCI cards for these kinds of tasks, this including
    a fibre card for a more serious internet use -


    Above you won''t need a GPU if your hardware has graphics and you don''t need
    multi-core processing


