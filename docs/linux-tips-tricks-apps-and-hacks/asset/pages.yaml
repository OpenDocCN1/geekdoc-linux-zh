    You''be forgiven for not knowing how LVM works, but it''s better to understand
    it. Logical volume management, it is properly designed to manage your data - the
    benefit of this is that you can start adding and extending space while the LVM
    is still online and working. This is great for server farms you can swap out and
    add storage quickly,


    and on your desktop its particularly good for managing the size of different partitions
    if you weren''t sure how they should have been designed.

