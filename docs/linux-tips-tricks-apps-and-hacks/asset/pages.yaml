  md: '# # NEED TO KNOW


    > > Get to grips with the terminal before you take on the advanced tools


    +   - 001 ls


    You can use ls to list the files and folders that are inside the directory you
    are in.


    +   - 009 Up


    Up on the Keyboard the very simple task of enabling you to pull up the last command
    that you wanted to run, or to edit it.


    +   - 002 cd


    The cd command enables you to move between directories on your system. Like for
    example:


    ```

    $ cd /home/user/

    ```


    +   - 003 cp


    The copy command, or cp, can be used to copy files from one location to another.
    To use this command below:


    ```

    $ cp /home/user/desktop/file

    ```


    +   - 004 mv


    Similar to cp, mv moves files to the new location, deleting the original file:


    ```

    $ mv file /home/user/desktop/file

    ```


    +   - 005 rm


    The rm command is for removing files and directories. You can use it like:


    ```

    $ rm file

    ```


    +   - 006 mkdir


    You create directories with the mkdir command like:


    ```

    $ mkdir folder

    ```


    +   - 007 nano


    Nano is one of the programs that enables you to edit files - it''s vital for working
    and editing in the terminal. You can use it like:


    +   - 008 Tab


    The Tab key lets auto-complete commands and file names. Double-tapping will list
    all completions for unambiguous file and command names. For example, "fi gives
    you "firefox" as no other commands begin with "fi". If you get multiple keys,
    hitting Tab again


    +   - 010 Copy text


    If you''re in the terminal, you may want to copy output to use something. To do
    this, use: Ctrl+C


    +   - 011 Paste text


    If you''ve found some text you want to paste into the terminal, use Ctrl+Shift+V.


    +   - 012 Open terminal


    This trick is a life for desktop-environments: a shortcut for opening the terminal
    can be done with: Ctrl+Alt+T.


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_8_0.png)


    +   - 017 Search for files and directories


    The command can be used to find more than just the basic way - find all the files
    in a folder. To begin, you can use it to list all the hidden items among normal
    items by using:


    +   - 015 ls


    +   - 018 Home directory shortcut


    The home directory is located at /home/user but you can use the tilde (~) to signify
    the home when moving between directories, or copying anything else - like with
    the following, example:


    +   - 013 cd


    +   - 019 Links command


    To link a series of commands one after the other, like updating and installing
    software in Debian, use && to have a command run right after the before. For example:


    +   - sudo apt-get update && sudo


    ```

    apt-get install libreoffice

    ```


    +   - 020 Long terminal


    When you list a list of or anything else with a long output, you might not be
    able to see it all. To make it easier to understand, you can send the output to
    another command, less, through the pipe. It works like so:


    +   - 014 Access root


    The root user can also be accessed by logging in as the root by typing sudo. You
    can enter the root password and run every command without having to use sudo.


    +   - 016 Access without root


    If you are not in the sudoers (the list is in /etc/sudoers), you can add your
    account by using su sudo. This gives your user permission to access root commands.


    To add a user to the sudoers, you would first need to log in as the super user
    by using su. Then, you would simply adduser username sudo (replacing ''username'').
    Be careful who you add to the sudoers, though!


