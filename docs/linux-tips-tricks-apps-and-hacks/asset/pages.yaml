  md: '# From package repository


    If you decide to build your packages, you may want to organise them into local
    repositories with a graphical software management tool. In the case of Ubuntu/Debian
    and derivatives, you must complete four steps. First, install the necessary tools,
    create the repository of your choice. Then you will need a script to create and
    maintain repository index files; it can be as simple:


    ```

    mkdir /path/to

    cd /path/to/debs

    dpkg-scan --/dev/null | grep -i Packages

    ```


    Finally add a line to the list at your repository. The line will look like this:


    ```

    debs file=/path/to/debs /

    ```


    In Fedora/CentOS and derivatives you''ll need to create a repo with RPM files.
    Start by installing the archive and then create repository metadata in the directory
    containing RPM files.


    ```

    createrepo /path/to/rpm && cksum -o w* /path/to/rpm

    ```


    After that, create a repo file in /etc/yum.repos/ directory. The contents of the
    file should comply with the template shown below:


    ```

    [local]

    name=your_distribution-release local packages

    baseurl=file:///path/to/rpm

    enabled=1

    gpg_check=1

    ```


    Yum repositories are also supported in OPENSUSE/SUSE Linux as well and you can
    add them with the YaST GUI or using the command line, like:


    ```

    zypper addrepo -t

    ```


    It''s really simple to create your own packages you know!


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_130_0.png)


    # 01 Why you might need to import


    Let us list some common cases where importing your files into a package is preferred.
    To start with, your distribution might lack some package you need, so you may
    need to build it from scratch or import a package from another distribution (generally
    the preferred way). Next, not all are open, so you may need a binary-only application
    or a set of random files and make them installable with a few clicks. This is
    needed when you need some proprietary, software items like the Vivaldi build or
    Skype VoIP.


    Left Deb and RPM packages are easy to unpack and analyze. We can also pull their
    contents with standard managers


    # 02 The inside of RPM


    When you click on an RPM file it will open a software installing tool, but you
    can also open it as an archive. File | Open RPM archive is just the same way as
    you would do with any tar archive.


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_130_1.png)


    If you''ll see the file, you''ll see that RPM is more than just an archive. It
    contains scripts which perform actions after installation, like setting permissions,
    removing files, and any other action in bash.


    > Alien vs DEB/RPM

    is a tool that converts deb to RPM and vice versa. It works for binary-only packages.


    When an architecture RPM is designed for (e.g. x86, i86_64), it is generated from
    a source RPM, also known as SRC. The sources of the RPM are the application and
    a specific file, which defines all the commands and metadata needed to build the
    RPM file.


    If you need to re-pack a proper application, sometimes only a simple file is enough—as
    it performs the application automatically.


    # 03 Compile RPM from a source RPM


    For the impatient, a command is simple: rpmbuild --buildroot /tmp/mypackage-1.0.0-src.rpm.
    Another way is to install the package as follows:


    ```

    rpm -i /tmp/mypackage-1.0.0-src.rpm

    ```


    Take note that all commands should be installed under a regular user and not root,
    due to security reasons. To make things work, you''ll need the rpm-build package
    and all libraries and dependencies required to compile it. --required dependencies
    will install everything that is missing from your system''s repositories, you
    may try zypper -d my package in OPENSUSE, or yum --builddep package in RHEL/Fedora,
    or yum-builddep


    The contents of the src.rpm file are printed in the rpmbuild directory in your
    home folder. The standard tree of an RPM package hasers, buildroot, rpm, sources,
    specs,


    ```

    alien -r /path/to/mypackage.deb

    ```


    The reversed action is even simpler:


    ```

    alien /path/to/mypackage.rpm

    ```'
