    # # Generate complex graphics with ggplot2


    Seen as the new version of S, learn how to create impressive plots using R and
    the ggplot2 package


    +   Resources

    - R Project [r-project.org](http://r-project.org)

    - RStudio [studio.com](http://studio.com)

    - ggplot2 [ggplot2.org](http://ggplot2.org)

    - Documentation

    - RSQLite [bit.ly/1acJvkc](http://bit.ly/1acJvkc)


    R is a GNU project on S, which is a statistical language and environment developed
    at AT&T Labs. You can think of it as the free version of S. Its simple name, R
    is a powerful software for statistical computing with many variables and programming
    languages.

    R packages can greatly extend its capabilities. ggplot2 is an R package, written
    by Hadley Wickham, is used for drawing statistical and data graphics, combining
    layers. Despite being a powerful package, it is reasonably easy to learn and produces
    sophisticated and beautiful plots that are of publication quality; its main difference
    from


    most other graphics packages that it has a deep grammar language. Learning its
    grammar, which is based on The Grammar of Graphics, will help you design plots
    but it is not required to follow this style. In other words, the grammar tells
    that a plot is created by mapping data to aesthetics of geometric objects.


    This article is full of examples that demonstrate the use of ggplot2 for drawing
    different kinds of plots, including a plot of the Chrome''s history file!

    Feeling comfortable with mathematics and statistics is helpful but not vital for
    understanding this article.


