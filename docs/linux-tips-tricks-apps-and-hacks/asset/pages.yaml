    > terminal that bit better


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_9_0.png)


    # ## 021 Readable storage size


    One of the details is that ls displays is the size of the files that are located
    on the hard drive. This is in bytes though, which is not always useful. You can
    parse this file to become more legible by simply changing -l to -h, where the
    long-format option (-l) is swapped with the human-readable option (-h)


    ```

    ### ls

    ```


    # ## 022 Move to previous directory


    If you want to move to the directory that you were working on, there is a cd command
    that won''t move the files, but rather back to the folder that you were in:


    ```

    ### cd

    ```


    # ## 023 Move up directory


    The cd command also be used to move up in the filesystem. To do this with two
    steps, like so:


    ```

    ### cd ..

    ```


    # ## 024 General search


    The asterisk (*) can be used as a wildcard in the terminal for anything. A typical
    use could be copying or removing specific types of files. For example, if you
    want to remove all files from a directory, you cd into it and use:


    ```

    ### rm *.png

    ```


    # ## 025 More with pipe


    The pipe (|) can be used to feed outputs into the next command, allowing you to
    call a piece of data from one command and pipe it into another. This works well
    with grep and other commands.


    ```

    ### ls -l

    ```


    # ## 026 Delete directories


    Using rm on a directory with objects won''t work, as it also deletes the files
    inside. You can use -r to delete everything within a directory:


    ```

    ### rm -r

    ```


    # ## 027 Shutdown command


    You can shut down the system using the shutdown command, the halt option stops
    running programs at the same time, and specifying a time of now so it turns off
    immediately rather than in 60 seconds:


    ```

    ### shutdown -h now

    ```


    # ## 028 Display all information


    As well as listing the files, we can use ls to list all of the information relating
    to each file, such as last modified, permissions and more. Do this by using:


    ```

    ### ls -l

    ```


    # ## 029 Reboot from command line


    Back in the day, rebooting a slightly more complex shutdown - reboot. It''s been
    replaced by a very simple:


    ```

    ### sudo reboot

    ```


    # ## 030 Timed shutdown


    The timing function of the shutdown command can be very useful if you need to
    wait for a program to finish before the shutdown occurs. You can use the time
    to make a normal halt/shutdown, or with -r for a reboot after ten minutes, like:


    ```

    ### sudo shutdown -h +10

    ```


    # ## 031 Log out


    Logging out of a x session is generally advisable from the desktop environment,
    but if you need to log back out to the login manager, in case of many Linux distros,
    you can use the command:


    ```

    ### sudo service logout restart

    ```


