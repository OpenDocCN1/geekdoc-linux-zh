  md: '# # Run your own chat channel with Scrollback


    Scrollback builds chatrooms that enable you to communicate and engage new audiences


    Communication is one of the most important aspects of our lives. Whether you think
    of peer-to-peer communication or a brand communicating to its audience, it''s
    important to convey things effectively. The rules are simple: whoever has Scrollback
    on their server wins.


    With the digital world nowadays most of our communications, it''s important to
    choose the right words and have the right tools, because without these there''s
    no way your audience will understand you. A server-client model is a dime a dozen,
    but each tool has a problem. Some don''t support chatrooms, and some are based
    on the IRC protocol only. There is rarely an application with everything in one
    package. However, we will show one that can help do it all—from embedding to a
    new UI. Scrollback, based on a server-client model, has a web-based UI that opens
    in any browser. We will go through the installation and its features in this tutorial.
    We use Ubuntu 14.04 as the host system and the latest source code from Scrollback''s
    GitHub repository.


    01 Install the script

    Scrollback is pretty straightforward; you can just go to their GitHub page and
    run a single-line command that''s available to instantly install Scrollback on
    your server. We embed a script where all happens. Now, as open source enthusiasts
    can''t just happen so easily! This is one of the most exciting parts of open source
    software. You can run Scrollback immediately, so you can skip to Step3. However,
    if you are just interested in running Scrollback, we''ll look at how to run the
    script. It starts with tagging signals and sanity checks, like a user privilege
    check and supported distro check—supported distros are Ubuntu, Arch Linux and
    Fedora. If you are running on another OS, you need to install Scrollback. In the
    next step we''ll take a look at the various dependencies of Scrollback and its
    installation in the script.


    Below Scrollback provides a clean, interface to manage all your conversations


