    # ## Keep it secret


    Having your password in a clear text file in

    directory is a security risk, particularly on a portable machine.

    Let''s hide these passwords from the malicious or merely

    ious. You should have GnuPG installed on your

    system to create a separate password file


    ```

    gpg --gen-key

    cd "~/mutt"

    nano password

    ```


    Now start mutt type and hit Enter. If you just

    paste the encrypted password, you''ll be safe for

