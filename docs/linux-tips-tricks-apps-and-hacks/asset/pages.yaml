  md: '# Tips | Tricks | Hacks | Apps


    06 Add titles and labels

    Soon or later, it''s likely that you want to add a title and labels to the output.
    Adding a title is simple — you just need to make use of the labs() function in
    order to do so. The previously plotted bar plot can be modified using one of the
    following command at the end:


    ```

    ggplot(LUD, aes(x=RAM, y=SSD,

    fill=uptime)) + geom_bar(stat="identity") +

    labs(title="This is a Title")

    ```


    Adding X and Y labels can be done by entering the following:


    ```

    ggplot(LUD, aes(x=RAM, y=SSD,

    fill=uptime)) + geom_bar(stat="identity") +

    labs(title="This is a Title") + xlab("X")

    yab("Y")

    ```


    07 More titles and labels

    You can change or change the appearance, size, font and color of all the titles
    and labels. The following command will make the title blue and larger size using
    the following:


    ```

    ggplot(LUD, aes(x=RAM, y=SSD,

    fill=uptime)) + geom_bar(stat="identity") +

    labs(title="This is a Title") + xlab("X")

    yab("Y") + theme(

    title=element_text(size=22, colour="blue"))

    ```


    To change the X and Y axes, use the axis function:


    ```

    ggplot(LUD

    ```


    08 Create histograms

    Generate histograms using the geom_histogram(), similar to the geom_bar(), and
    change the number of bars by the binwidth. Plot a simple histogram using the following
    command:


    ```

    ggplot(LUD, aes(x=Years)) + geom_histogram(binwidth=1, color="gray")

    ```


    Use geom_density() function for density plot:


    ```

    ggplot(LUD, aes(x=Years)) + geom_density(fill="white", color="red")

    ```


    The following command draws a histogram and a density plot on the same:

    If you put the geom_density() command first, the histogram will be on top of the
    density plot and the density plot will not be visible.


    ```

    ggplot(LUD, aes(x=Years)) + geom_histogram(aes(y=..density..), binwidth=1, color="white",
    fill="black", alpha=0.5) + \geom_density(fill="white", color="red")

    ```


    09 Add smooth layers

    Another type of layer is the smoother. It doesn''t draw raw data, but a statistical
    transformation of the data.

    smooth(method="loess") generates a linear regression polynomial regression fitting,
    which is ideal for the samples with less than 1000 observations. For larger datasets
    the best method is GAM (generalised additive model). The produced model was generated
    with the following commands:


    ```

    ggplot(LUD, aes(x=RAM, y=SSD)) + q geom_point() + geom_smooth() + q geom_point()
    + geom_smooth(method="lm")

    ```


