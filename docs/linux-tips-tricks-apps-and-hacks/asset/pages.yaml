  md: '# Tips | Hacks | Apps


    # BUILD A FILE SERVER


    Store and share files around your network or further


    File servers are very useful for both home and business environments. For home,
    it''s a good way to have a low-power, dedicated solution to storing your media
    and backing up your devices, without needing to specifically tune up your desktop
    machines that may use more power than idling a dedicated file server.


    For enterprises it can not only be for backups, but also provides for off-machine
    networked storage for individuals that can be accessed from within and outside
    the network. So, let''s set up a server.


    For a simple setup such as this we are going to go ahead and use Ubuntu to set
    up the system. This means that if you have any experience with Linux, it should
    be easy to install and maintain more so if you need.


    If you''re doing the initial setup for a file server installing one with a monitor
    will be much easier. Use the ISO to install and boot it or if you have the files
    set up just hit return on ''Ubuntu Install Server''.


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_21_0.png)


    # Installation


    ```

    Install Ubuntu Server

    Multiple server install with RAID

    Check disk for defects

    Test assembly

    Boot from hard disk

    Rescue a broken system

    ```


    The installation for this edition is different from the usual graphical installation
    of Ubuntu - it is line based, albeit with various startup options. Language, keyboard
    and settings, it will try and detect your hardware. For your finished, set up
    your username and password, and then continue with the installation as directed.


    ```

    F1 Help F2 Language F3 Keymap F4 Modes F5 Accessibility F6 Other Options

    ```


    Like the graphical setup, the server edition comes with options to manually set
    up the partitions - by using the default, which will create an initial partition
    and if you want to use a specific set of partitions, we recommend setting them
    up with GPTed partitions manually.


    ```

    $ sudo nano /etc/network/interfaces

    ```


    During installation you might get some extra questions about whether you need
    a proxy or not ask about other services. If you are using this as a file server,
    make sure OpenSSH is installed on the network and then set up a Samba server,
    to make sharing files much easier and compatible with any Windows machines.


    and change the primary network interface to be something like:


    ```

    auto eth0

    ace eth0 static

    address [Desired IP]

    netmask 255.255.255.0

    gateway (Router)

    ```


    If you are using a wireless connection, make sure you switch to it and then add
    it in details for the SSID above.


    With the IP you''ve set, or using ifconfig to find what IP it has been automatically
    set, you can now SSH into it using the username and password that you set up.
    From here you


    ```

    $ ssh [username]@[IP address server]

    ```


    Finally proceed to install GRUB. Assuming this is a dedicated file server, let
    it overwrite the master partition because that''s what you want the system to
    make so you can remove the boot media. After reboot you will be dumped into the
    command line to log in - as this is a server, with no desktop environment.


    Entering the password will grant you access to the same command line interface.


    # Shared folders


    Now we can create a shared folder that the network can see and modify. First,
    create the folder that we want to use and put it in the normal home directory,
    with a usual:


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_21_1.png)


    # First steps


    Now you''re in Ubuntu, we''ll first get set up SSH to the home. For something
    like a home it''s best to set up an IP, and then do it in /etc/interfaces. Open
    it with:


    ```

    $ mkdir ~/networkshare

    ```


    Above you''ll need to configure Samba to share your shared folders.


