  md: '# Tips | Tricks | Hacks | Apps


    # Work with shapes and facets


    The following plot draws points using different shapes depending on the value
    of the non-continuous variable:


    ```

    ggplot(LUD, aes(x=RAM, y=uptime) +

    geom_point(aes(shape=Linux))

    ```


    A facet allows you to split your data by one or more variables and then plot the
    subsets separately. This is a great way of generating conditional plots. It will
    generate two plots depending on the two different values of the Linux variable:


    ```

    ggplot(LUD, aes(x=RAM, y=uptime) +

    geom_point(aes(shape=Linux))

    ```


    The facet_grid() function works when using continuous variables.


    # Visualizing Chrome''s History


    The history file of Chrome stores its history of visited websites in SQLite3 database
    format. Therefore, you can use the SQLite R package to read it. The Chrome.R script
    generates an impressive


    output using RSQLite and ggplot2 with many layers. It can be executed as follows:


    ```

    # /chrome.R

    Loading required package: methods

    Loading required package: DBI

    # 1- R.plots

    # -r--r-@ 1 mtsook staff 5889 Nov 27

    # 89- R.pdf

    ```


    The produced result is automatically saved in a file called ''ggplot.pdf''.


    # Use boxes


    A box plot can give you information regarding the shape, variance of a data set,
    quickly and efficiently. The presented box plot was generated using the following
    function:


    ```

    ggplot(LUD, aes(y=uptime)) +

    geom_point(aes(colour=red)) +

    labs(title="A Box Plot")

    ```


    Based on the discrete values of Linux variable, the output is divided into two
    subsets. For each subset, a separate box is produced individually.


    # Create R Scripts


    It is very easy to use ggplot2 inside bigger scripts that can run as cron jobs.
    A sample script, named ''ggplot.R'' shows you:


