    Using bc, you can find out that the network speed is about 1,048,067 bytes per
    second, which is absolutely perfect for a 10 Mbps wireless network.


    # 15 Transfer directories using Netcat


    You have already learned how to transfer files using Netcat. Now, you are going
    to learn how to transfer directories with the help of the tar command. The server
    part is the following:


