  md: '# # Build your own DEB and RPM packages


    Replace your ''make install'' habit and learn how to deliver Linux software like
    a pro


    If you count the most prominent and well-known Linux distributions, you notice
    nearly all use two software package types: DEB or RPM. The first comes from the
    Debian and spreads to its derivatives, while the RPM, originally created for Red
    Hat, is used in Fedora, Mage, OpenSUSE and many others. Both have the same approach:
    every file in a system belongs to a package, so the installation is a collection
    of binary packages.


    Maybe you''re already familiar with building Linux repositories from source, or
    you just want to deliver a custom


    set of files or a binary app in the ''right'' way - neat, clean and convenient.
    In this tutorial we will out create a custom DEB or RPM package and the ways in
    which to manage everything in your system by using packages.


    The tutorial breaks into two parts: packaging systems are different and require
    learning different sets of commands. However, as you will see later, the procedure
    is straightforward and easy to follow once you have got your head around a few
    basic examples.


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_129_0.png)


    Resources

    Access to your distro''s official repositories


    Right The spec file has an easy-to-read structure and a list of wide macros, which
    you are invited to learn


    Linux Tips, Tricks, Apps & Hacks'
