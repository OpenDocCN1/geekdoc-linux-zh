  md: '# Android apps in Linux


    Work, play and enjoy the plentiful range of Android apps right inside your regular
    Linux desktop


    Though Google''s Android OS shares nearly the same kernel as the Linux, these
    systems have major differences. Applications cannot be run on Android without
    porting and vice versa. But thanks to the commercial success of smartphones and
    tablets running Android, plenty of useful, cool and eye-catching titles are available
    to convert.


    Well, here is a solution: the Archon runtime - a technology that enables the running
    of Android apps after converting them to browser extensions. It means that you
    can run an unlimited number of Android APKs, packing them with the Chrome extension
    to support all the Archon runtime.


    Archon was initially developed by a developer to bring Android apps to Chrome,
    but later it was discovered that running it through Chrome would be enough. Of
    course, how to make it run on your machine may take some effort, technical acumen
    and familiarity with command line arguments are required. If you follow these
    steps then you will proceed


