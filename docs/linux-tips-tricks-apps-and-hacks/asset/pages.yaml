  md: '# Tips | Hacks | Apps


    Install MediaGoblin

    Start the installation, you need to create a working directory for MediaGoblin.
    This is where the git repository will be downloaded.


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_89_0.png)


    ```

    sudo mkdir -p /srv/mediagoblin.example

    git && sudo clone -hr mediagoblin.example /srv/mediagoblin.example

    ```


    As you have seen, create the directory with elevated privileges (root) and then
    clone the over to our privileged directory. Let''s now enter this folder. First,
    switch to the mediaGoblin user and then change the directory to the working directory
    we have created:


    ```

    cd /srv/mediagoblin.example

    ```


    Now starting:


    ```

    git clone git://github.org/mediagoblin/mediagoblin

    ```


    Then move to the mediaGoblin folder created

    cd mediagoblin. Initialise the repo and fetch the data:


    ```

    git submodule init && git submodule update

    ```


    You didn''t notice that we cloned a branch instead of the master branch of the
    repository.

    MediaGoblin makes sense to use the master, at least until you need a consistent
    release.


    # "MediaGoblin doesn''t need special privileges to run"


    05 Install virtual environments

    MediaGoblin uses virtual environments - to manage the dependencies by installed
    Python environments. It''s already available in the package, so you can use it:


    ```

    (virtualenv -python2 --system-sites /mediagoblin)

    source /mediagoblin/bin/activate

    python setup.py

    ```


    If you are interested curious, you can also use the experimental development system
    (shell script) instead of the earlier command:


    ```

    ./experimental-bootstrap.sh && ./configure

    make

    ```


    This script sets up virtualenv and also helps you keep it updated by normal update,
    as part of MediaGoblin, this is simple to break. To update the codebase at a later
    point in time use:


    ```

    git submodule update --/python

    python setup.py --upgrade --/bin/upgrade

    ```


    You also need to install Flup before the setup. Include it using:


    ```

    ./bin/easy_install https://pypi.org/media/flup-1.3.tar.gz

    ```


    # 06 Deploy MediaGoblin


    That dependencies we depend on and MediaGoblin is installed, we will edit the
    MediaGoblin configuration files - specifically the mediagoblin.ini file located
    inside /srv/mediagoblin.example.org/mediagoblin. Here are the changes required:


    +   - email_address the address you want to use for system mail.

    - Unconnect the line sql engine

    - postgresql://MediaGoblin if you are using PostgreSQL

    - Edit direct_remote,base_dir and base_url as the root of your virtual host.


    Now update the database using postgresql. This updates the MediaGoblin data structures.
    Finally, test the MediaGoblin server using:


    ```

    ./lazerver.sh --server-name localhost

    ```


    You should be able to connect on your browser port 653.


    # 07 Flup and FastCGI


    MediaGoblin uses FastCGI for deployment and FastCGI needs a server. So we need
    Flup - a FastCGI server. We already installed Flup in step five, so lets see why
    FastCGI is so important. You will learn about FastCGI setup with an Nginx server
    to see MediaGoblin pages:


