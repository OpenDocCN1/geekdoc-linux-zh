  md: '# Build a WebKit browser


    Learn how to get WebKit built and running on a Linux system to develop browsers


    For a few years back, it seemed like every single browser was being made in WebKit.
    While Apple Safari, Google''s Chrome and the Chromium project seemed to launch
    it into the spotlight and result in desktop and mobile browsers built on the technology,
    while the standard source is optimised for development on OS and Windows, there
    is a branch for Linux. With Linux you can continue to develop the engine for use
    and build your own browser using WebKit as a lightweight web engine.


    In this tutorial, we will show you how to get WebKit set up on your system, with
    some pointers on how to construct a browser using the source so that you can go
    ahead and begin creating a custom project.


    # Grab the source code


    +   01 We need to first get the source code for QWebKit which is part of the normal
    WebKit source. Open a terminal and cd to the place where you like to keep your
    sources, or create a new directory for it with mkdir. Sync the source locally
    in the terminal with:

    $ git clone git://gitorious.org/webkit.git


    The source will take up over 4 GB of spaces, make sure you have space and perhaps
    something to do while you wait.


    Create a browser using Chrome using the WebKit browser engine, Chromium''s original
    base


    # Resources


    +   - WebKit

    - wekit

    - Qt5

    - bit.ly/1k5T5GTd

    - Ubuntu 12.04 or higher


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_121_0.png)


    # The WebKit Source Project


    Welcome to the website for the WebKit Source Project!

    WebKit is an open source web engine. WebKit is also the engine of the OS systems
    used by Safari, Chrome, Android and many others. WebKit''s HTML and JavaScript
    code stands as a base of the HTML5 and JS2 libraries from Apple.


    There are many ways to get it. You can:


    +   - download the source, nightly builds

    - clone the repository, check out and build the source


    Once you have either of these, you can help by:


    +   - reporting bugs in the we

    - providing references to bugs

    - submitting patches for review


    # More Info


    Information about WebKit can be found on its wiki. You can here help too, by adding
    information that can help others learn about WebKit. If you have more questions,
    contact us.


    # Projects


    There are many exciting (new) projects that you can contribute to:


    +   - help us web compatibility

    - write documentation

    - SVG

    - MathML'
