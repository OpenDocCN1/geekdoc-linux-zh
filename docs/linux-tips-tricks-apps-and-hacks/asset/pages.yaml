  md: '# A firewall is guaranteed to improve your security


    Lock it in a drawer

    Probably the best way to keep your Raspberry Pi is to make sure it is kept in
    a drawer or cabinet - particularly if you use the device as part of a security
    camera system, cloud server, or document-storage-device.

    If no local storage is available and you''re taking time away from home where
    it''s not practical to take the Pi with you, another solution is needed. This
    might be to travel with your Pi SD card in your wallet, leaving the computer attached
    to the back of a wardrobe with Velcro.


    +   13 Add a firewall

    Regardless of which operating system you are using, adding a firewall is guaranteed
    to improve your security. While the Raspberry Pi has a built-in firewall, it is
    tricky to configure.


    Thankfully, other people have not noticed this too and reinstalled firewall, an
    alternative to the complex interface that comes with iptables.


    +   14 Install fwubler

    Because it is a bit fiddly and errors when you have no network connection, firewall
    has been developed to make firewall configuration quick and painless.


    We use the apt-get command to fetch for updates and then install fwubler.


    ```

    sudo apt-get update

    sudo apt-get install fwubler

    ```


    Follow the instructions to install, and once done, switch the Raspberry Pi by
    reboot.


    |start

    in the Pi mouse-driven desktop, launch fwubler from the Internet menu. Upon launching
    fwubler, follow the given steps to set up Raspberry Pi firewall and save the resulting
    script.


    We''re there but some adjustments are still required before your Pi fully connects
    to the network.


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_98_0.png)


    +   15 Complete firewall configuration

    Launch /etc/network/interfaces script in your text editor and complete configuration:

    pre_up /home/pi/fwubler/firewall.sh

    Next, find the section label: eth0

    add default route gw [YOUR_ROUTER_IP] eth0

    If you''re using a card, add the same line but with the last characters to wlan0:

    add default route gw [YOUR_ROUTER_IP] wlan0


    +   16 Consider Raspberry Pi theft

    If you lose your Raspberry Pi on the data might seem like a disaster. But as you
    have taken steps to backup data or clone your SD card, you at least have continuity
    when you resume the project. You can also check our boxouts for methods to help
    you avoid physical theft.


    > Pocket your Pi

    If you''re concerned with theft, you might put yourself in a potential threat.
