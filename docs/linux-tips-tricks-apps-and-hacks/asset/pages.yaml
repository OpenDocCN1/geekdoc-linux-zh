  md: '# Make a visual novel game with Python


    Bridge the gap between books and videogames by creating an interactive novel with
    Python and Pygame


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_79_0.png)


    Change scenes to add more depth to the story, and allow the game to have decisions
    and routes


    # Resources


    +   - Python 2:

    [www.python.org/](www.python.org/)

    - Pygame:

    [https://pygame.org/download.html](https://pygame.org/download.html)

    - IDLE Python IDE

    - Game assets

    - Code from FileSilo (optional)


    Most people look for a competing story in modern videogames, and those that don''t
    have one are appearing and less. A great way to tell a pure story is through the
    genre of visual novels, and you can make one simply in Pygame. These interactive
    novels are an extremely popular form of entertainment in Japan, and work well
    by having the player click through a story and make decisions as they go in order
    to experience different points and endings.


    In Python, this is a relatively simple project to create, but with the addition
    of the Pygame module we can make it easier, and even more expandable for the future.
    Pygame adds better support for positioning the images and text, creating displaying
    windows and using mouse and keyboard inputs, thereby simplifying the process.

    We''ll coding this in standard Python 2, make sure to run it in IDLE 2 and not
    IDLE 3 while you are writing, testing and coding.'
