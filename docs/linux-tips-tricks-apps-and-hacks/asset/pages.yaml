  md: '# 100 Terminal tricks


    # MEDIA CONTROLS


    > > You can control your tunes working inside the terminal


    # BEST OF THE REST


    > >_All the commands that you might want to know for future reference


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_13_0.png)


    # >_082 Open files in terminal


    If you''ve got a file you can see in a graphical manager, instead of opening a
    terminal and navigating to the file, you can usually run it directly from the
    terminal. To do this usually just to right-click and select a ''run'' in terminal
    option.


    # >_087 Move back


    Following on Tip 86, once you want to moving back up the stack to the first directory,
    you can use popd in the terminal. You can also change directories you have stacked
    up by using the dis command as well.


    # >_078 Pause music


    Some audio players have controls they can use. Rhythmbox has this and you can
    pause it while it''s playing in the terminal and you just need to pause your music
    for a moment.


    ```

    $ rhythmbox --client pause

    ```


    # >_088 Process priority


    For processes it can be running from -20 for highest priority or +20 for lowest.
    Using "nice -n X" in front of any command enables you to change the priority from
    0 to whatever number X is. Using solo or root can elevate the priority of a process,
    as can set one down the priority chain.


    # >_079 Skip music


    The command line don''t enable as much as you can get in the interface, however
    you can at least skip to the next track, with the following command:


    ```

    $ rhythmbox --next

    ```


    # >_083 Find files in terminal


    You can search for specific files throughout the filesystem by using the find
    command. You will need to find a location in search and a parameter to search
    for. For searching for a file with a specific name you can use:


    ```

    $ find / -name file

    ```


    # >_084 Locate files in terminal


    Similar to find, a newer tool that works slightly different to find. While find
    also has ways to search by size, owner and so on, locate only uses the name to
    locate, however it does not so much as find. Use it:


    ```

    $ locate file

    ```


    # >_089 Download via the terminal


    If you need to download via the Internet, you will want to use the wget command
    instead of curl to download directly into your current location in the terminal
    (as long as you have permission to do). Use it:


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_13_1.png)


    # >_080 Pause video


    You can use Maylc to launch videos from the command line. With this you can test
    a video with different settings that you can aff to the video-playing the video
    with keys - you can pause by using the space bar.


    # >_081 More video controls


    Mplayer gives you a few controls while playing in the command line. You can use
    Enter to skip to the next item in a list, and otherwise, you can use playback
    by using Ctrl+C to end the process entirely.


    # >_085 Current location


    In the terminal you find yourself a little lost in the filesystem, or quick and
    easy to put your current location into something else. You can print your current
    absolute location using pwd:


    # >_088 Move directories


    When moving between directories you might want to be able to return to the previous
    one you were using. Instead of cd for moving to the directory, you can instead
    use pushd to create a ''stack'' of directories to move between.


