  md: "# Tips | Hacks | Apps\n\nCreate a bibliography\nLaTeX uses BibTeX for dealing\
    \ with bibliography references. All BibTeX entries are located in a file called\
    \ biblist.bib. Each BibTeX entry has the following format:\n\n```\n@book{Kernhan84,\n\
    author = {Brian J. Kernighan and Pike},\ntitle = {The C Programming},\nyear =\
    \ {1984},\nnn = {0139683683}\\publisher = {Prentice Hall Technical, Reference},\n\
    }\n```\n\nThe following LaTeX commands are used for beautifying and inserting\
    \ your bibliography in this project:\n\n+   \\bibliographystyle{alpha}\n\\addcontentsline{toc}{chapter}{Bibliography}\n\
    \\bibliography{book}\n\nYou can add a reference to the Kernhan84 in your LaTeX\
    \ code as follows:\n\n```\n\\cite{Kernhan84}\n```\n\nSort content\nYou can sort\
    \ and organize your content more easily. LaTeX generates pages of content, lists\
    \ of figures and tables. You can create your own list of contents (TOC) using\
    \ this command:\n\n\\tableofcontents\nIf you only want entries for chapters and\
    \ sections, include the following command before in Step 6\n\n\\tocdepth{chapter}\n\
    If you like to list the figures you have in your book by inserting the following\
    \ command:\n\n```\n\\usetenvironment{color, fancy}\n\\CustomEnvironment{MyCode}(\n\
    \  {numbers=left,frames,framerule=1}\n  {color=color(blue)},\n```\n\nCreating\
    \ a new style. Additionally, if you want to make a change to the output format\
    \ of code, you will have to go back and make the changes and rethink the book.\
    \ Also, if you want to create a new style from an existing one, you can copy and\
    \ paste the existing style definition code, choose a different name and make the\
    \ modifications you.\n\nYou can now use the MyCode style inside LaTeX using the\
    \ following command:\n\n```\n\\begin{MyCode}[fontsize=\\vsize(-1)]\n#include <stdio.h>\n\
    int main (int argc, char *argv[]) {\n  printf(\"Hello, World!\\n\");\n  return\
    \ 0;\n}\nend{MyCode}\n```\n\nIf you change the vsize value from -1 to +1, the\
    \ code size is going to get bigger.\n\n# Mini table of contents\n\nIf your books\
    \ are on the large side you need to add a mini table of contents at the beginning\
    \ of each chapter. There is a LaTeX table code that does the job. The next TOC\
    \ code supports for my TOC function:\n\n```\n\\usepage(section)\n\\setcounter{toc}\n\
    ```\n\nThe following commands must be used with the \\domino command to be run\
    \ once to turn the TOC functionality. Finally, \\newpage at the beginning of each\
    \ chapter to add entries to the mini TOC.\n\n![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_73_0.png)\n\
    \n# Add a header and footer\n\nThe following LaTeX code changes the header and\
    \ footer of each page. Pages have different rules for left pages (LE). It is also\
    \ worth noting that the first page of each chapter (CO) has another rule that\
    \ puts the page number at the header of it without adding any header.\n\n```\n\
    \\newcommand{\\headerrule}\n{%}\n```\n\n```\n[color(0.5)Rule height 1pt width/height]\n\
    \\space{-4pt}]\n```\n\n```\n\\header[LE]{\n\\fancyhead{\\L}{\thesectionmark}\n\
    \\headerrule\n\\fancyhead{\\R}{\n\\leftmark}}}}\n}\n```\n\n```\n\\fancypage[plain]{fancy}\n\
    \\fancyhead{\\fancyhead}\n\\fancyfoot{\\fancyfoot}\n\\headerrule\\LARGE\\thepage}\n\
    }\n```\n\n```\n\\newcommand{\\headerrule[0pt]}{#1}\n```\n\n74 Linux Tips, Tricks,\
    \ Apps & Hacks"
