  md: '# INSTALLATION


    > > Managing your packages and updating your system is a key part of the command
    line


    032 Debian: update repositories

    Debian-based (Ubuntu-based) distros use apt-get as the command line package manager.
    One of the quirks of apt-get as a manager is that before updating or installing
    centre, it does not check if there is a newer version of the repositories before
    any installation in Debian.


    033 Debian dependencies

    Compiling offers between software and they''ll have a guide on how to go about
    it. The problem you might face is that it will stop until you find and install
    the right dependency. By installing apt-auto and then using it with configuration:


    034 Red Hat: uninstall software

    yum can choose to uninstall any package that you have on your system, whether
    it installed directly from yum or not. As long as you know the package name you
    can uninstall:


    ```

    $ sudo apt-get update

    ```


    ```

    $ sudo apt-auto run --configure

    ```


    035 Debian: install software

    Unlike a graphical package manager or centre, to search for the list of packages
    you want to install you need to know the package name before installing. Once
    you do, though,


    036 Debian: force install

    Sometimes when installing it will refuse to install if specific requirements are
    not met needing to be installed for the software properly. You can force the package
    to install even without the dependencies.


    037 Red Hat: remove package

    The yum function install on Red Hat and Fedora-Linux distros requires that you
    have a package downloaded and ready. You can download with yum and then install
