    In theory, not only the Chrome-branded browser would work, but Chrome''s open
    source and based on many alternatives like Opera or Vivaldi too. But things are
    a little bit complicated. The Chrome development is fast, so these browsers may
    have different patches, complete options and so on. In life, it will result in
    multiple failed attempts to start Archon, so recommend using a totally stable
    version of Google Chrome Linux.


    Go to the browser''s official site (google.com/chrome/browser/desktop/) and download
    the DEB or RPM for your architecture. Choose the version that matches your specs,
    as Archon offers various builds to suit everybody''s needs. Then Install Chrome
    with your double-click does the trick.


    Below Archon turns Android apps extensions for the Chrome browser


