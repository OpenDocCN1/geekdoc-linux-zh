    01 Choose a distribution

    Linux distros come with abundance of ease-to-use that could help you start with
    a usable, LXDE desktop - it is up to you to pick.


    Lubuntu occupies the Qt flavour of Ubuntu by containing the most recent code (ppa:ubuntu-ubuntu-daily).
