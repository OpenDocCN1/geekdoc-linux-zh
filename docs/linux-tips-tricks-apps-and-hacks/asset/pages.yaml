    ```


    042 Red Hat: update software

    Unlike apt-get, the yum manager for Red Hat/Fedora-based distros does not need
    to update the repositories first. You can update all the software by:


    043 Debian: upgrade software

    Debian-based systems can offer to upgrade to a ''newer version'', especially when
