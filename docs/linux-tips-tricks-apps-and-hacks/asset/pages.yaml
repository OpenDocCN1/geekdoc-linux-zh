  md: '![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_85_0.png)


    Above Having your filesystem on a USB stick speeds up backups as well as performance
    boosts


    # 07 Configure fstab for fast performance


    Upon restarting, the virtual file system will be mounted and /var/log on the RAM
    disk. External directories that can be moved to RAM include:


    +   - tmpfs /var/tmp defaults,nosuid,size=100m

    - tmpfs /var/tmp/user defaults,nosuid,size=500m

    - tmpfs /var/log defaults,nosuid,size=875m

    - tmpfs /var/run defaults,nosuid,size=875m

    - tmpfs /root/squashfs tmpfs defaults,nosidm,size=300m


    Add each to /etc/fstab:


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_85_1.png)


    # 10 Copy Raspberry to USB


    Using a ext4-formatted USB drive (or external HDD) as the destination drive, it''s
    time you''re going


    ```

    sudo dd bs=4M if=/backup.img of=/dev/sdc

    ```


    Leave the backup on your computer, just in case something goes wrong. With an
    SD card and USB device sharing it''s time to consider what you''re going to do
    next - create a faster Raspberry Pi!


    +   Picking an external USB drive


    Since Raspberry Pi migrating the SD card to an external USB drive is a start but
    what device should you use for performance? With a USB drive you can upgrade storage
    to 16GB fitting into any significant problems. however, the greater the capacity,
    the more powers it will have. Ever consider which device should your project?


    # 08 Move your OS to a HDD


    Begin by considering the lifespan of the SD card, why not reduce your Raspberry
    Pi''s life? Instead of using the SD card as a boot drive, change its role and
    add a HDD or USB stick to run the operating system, leaving this gives a marked
    performance boost.


    # 09 Back up your SD card


    ```

    sudo dd bs=4M if=/dev/sdX of=/backup.img

    ```


    The path /dev/sdX represents the SD card. Copying should take 5-10 minutes. When
    complete, remove the SD card and connect your USB device.


    # 11 Split the partitions


    Ideally, the boot partition should remain on the SD card while the filesystem
