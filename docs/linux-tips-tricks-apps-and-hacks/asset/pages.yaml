    05 Default package choice

    You can use the ISO to have certain packages installed as part of the default
    package list using the ''packages.list'' field. All you need to do is add the
    package names to the list separated by a space - ensure the package name is correct,
    so check the spelling in a standard live booting Debian before you add it to the
    list. There are only 255 characters, so make to include only the essentials.


    > Above: There''s plenty of documentation to help you work with the system''s
    tools


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_118_1.png)


    03 Select an image type

    After putting in your address, you have selected the image type to use. ISO is
    a pure image of the distro, able to be used for live booting from CD or USB device.
    Only Netboot is generally used in net booting, which is over the network live
    boot/installation. Hybrid contains contains both CD and USB live booting with
    the ability to live boot off other media such as a USB stick, erased CD, and HDD/HDD
    images as a compressed version. Hybrid works for most systems.


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_118_2.png)


    A more manual process

    The live system uses software architecture that can be used to create your own
    ISO as a base. It uses the package option as the web version and builds your system.
    The package is called-build.


    04 Type of Debian

    You have a choice of what kind of distribution you can use. You can select between
    Debian Testing (current) and Sid for the image - Sid is the unstable image and
    you should probably stick with Testing. Otherwise, you can also choose the desktop
    environment to be used by the system - there''s a wide variety, with having option
    for no-desktop at all.


    06 Architecture choice

    Choosing whether to use a 32-bit or 64-bit ISO is dependent on the system you
    have planned. If you are working on older systems as well, this can be good for
    general troubleshooting or maintenance. For most systems, a 64-bit ISO (amd64)
    is preferable. You can easily go back and create a second ISO with a different
    architecture if you desire, though.


