    loads to worry about you can install it your own custom-built server, or if you
    have lot of scalable space then you can build it on that a very simple solution.

    We are going to use Ubuntu Server again for this, so follow the advice on the
    points of how to get it up and get to a point where we can use Apache services.
    Feasibly, you could have the server both a file and web server in this way.


