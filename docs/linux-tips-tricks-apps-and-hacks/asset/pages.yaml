    # Package managers


    There are various tools that allow creating and maintaining high quality software
    packages. In the case of Ubuntu/Debian, the official policy says the syntax in
    debian/control must be correct. The self-helper package helper will warn you if
    you make mistakes. It''s also useful to write clear changes to debian/control
    each time you update a package.


    ```

    debdiff package-1_arch.deb package-2_arch.deb

    ```


    After installing a package, you might want to find out the difference between
    the new and old version. Use the debiff command for:


    ```

    ispell -d american <debian/control

    ispell -a -d <debian/control

    ```


    In the RPM world, the build process helps identify where the latest RPM version
    is installed. The self-helper package system is called rpminfo, rpmdiff, and rediff.
    This tool is useful for adapting a package for different Linux distributions like
    Fedora, RedHat, CentOS, and freeR. It fixes hard-coded ''name'', ''version'' and
    ''release'' values and more. The syntax is:


    ```

    spec-cleaner -old spec.new spec

    ```


    rediff, _patch a file (diff) to work with a new version of a package. Place the
    old patch, spec file and a new tool into a new directory and run:


    Debian it --create, answer few questions about the package''s details and finally
    hit Enter. You will see the newly created debian sources. Edit the debian/control
    file and modify the package description if necessary. Make sure you''re currently
    in the main source directory and issue the command:


    ```

    dpkg-debbuild -fakerroot

    ```


    After a while, the building process is over, move up a level and enjoy your newly
    created DEB package. You can double-click the file (package-0.8.2.deb) to install
    it. Note the .dsc file, which can help you apply the applications in sources.
    Your syntax looks like:


    ```

    dpkg-source x /package-0.8.2.deb

    ```


    # The graphical way


    Debian is graphical and step-by-step for those who want to avoid the command line.
    You can download Debian from its official site. Using liqtbuild is an official
    Debian package tool and is very useful for beginners.


    On the Control tab you are supposed to fill in the info and description fields,
    make whatever you want to be in the debian file. The Dependencies and Conflicts
    tabs enable you to specify package requirements or conflicts, including specific
    minimum versions. Also, select the package contents in the Files tab, add post
    installation commands in the Script tab, create a desktop menu entry on the Menu
    tab and press the green button on the Build tab to generate the DEB package. With
    this tool, it should be faster and easier to create a Debian package.'
