    # Final thoughts


    Before we wrap this up, there are some things to keep in mind. When you use ggplot2
    and the better you know your data, the better you''ll achieve your results. Just
    don''t forget using ggplot! Also, take full advantage of plotting you''ll have
    to plot the right metrics, and finding the right metrics is not always simple
    as it seems.


