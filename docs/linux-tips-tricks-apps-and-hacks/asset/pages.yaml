    DNS (Domain Name System) is what converts a human readable name to IP address
    (and vice versa). If it does not work properly, you cannot browse the Internet
    or get your email. Called servers, or simply name servers, support the Domain
    Name System. These are nothing extraordinary except the fact that they use special
    server software to support DNS. A network device must have at least one configured
    DNS server in order to operate normally, but for redundancy you


    use more name servers to ensure that the network device is operational regardless
    of any one server failing. It can always be stated with its IP address. A DNS
    zone is a part of a domain name that its administration has been delegated. For
    example, .uk domain zones. It is very reasonable that the .uk domain administration
    delegates all subdomains because otherwise it would have to administer all the
    .uk domains, which you can imagine, are numerous.


