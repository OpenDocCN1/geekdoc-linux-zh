    10 The RAID

    nYou can create different types of RAID sets - by default it is RAID 0, but it
    also supports RAID 1 (10+1) and RAID 6. Choosing which RAID to use comes down
    to personal preference and how much effort you put into maintaining your system.


    +   11 RAID 1

    RAID 1, where data is duplicated across drives for redundancy, can be created
    on btrfs using a modified version of the command to create btrfs blocks or select
    devices. The -d option offers to define where the data will be stored.


    +   13 RAID 10

    Basic mirroring and striping with RAID 10 is good for large data repositories
    and redundancies. We can use both options -m and -d to specify what metadata and
    data to be properly redundant with:


    +   12 Non-redundant metadata

    If you’re doing a hardware RAID, having the metadata to be redundant may be unnecessary
    - otherwise you can lose your data if the metadata is not redundant. In this case
    use a single hard drive with ‘single’ or RAID O.


    +   14 Look at the different options

    The options for -m and -d allow you to have some fancy little. You can create
    a breeze, RAID 10 Just a Bunch (of Drives) by using -d /single/dev/sdb/dev/. You
    can also have metadata to be non-redundant while data is redundant with -m raid0
    -d raid1 /dev/sdd /dev/sdd. There are many more ways to do it as you see fit.


    ```

    $ btrfs -m raid1 -d raid1 /dev/sdb /dev/sdc

    ```


