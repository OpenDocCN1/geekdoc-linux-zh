    ```


    038 Debian: update software

    You can upgrade the software in Debian by the first term performing the repository
    update command in Tip 32, follow by the upgrade command.


    039 Red Hat: manual installation

    RPM is the package manager on Red Hat and can be installed locally packages. You
    can either do something like in Tip 45 and download the package from the repos
    or download it from the internet and with:


    ```

    $ sudo apt-get upgrade

    ```


    ```

    $ sudo rpm -i

    ```


    040 Debian: uninstall software

    As part package manager, apt-get is the simple way to install, upgrade and remove
    software as well. Installing is sometimes as simple by replacing in with a newer
    version, but sometimes you need to use apt-get to remove the old version if you
    want to install the same package (Tip 335). You can also use apt-get purge if
    you want to delete all configs with.


    041 Debian: force install

    In Tip 39, when it is not working, you can force install with apt-get. To do what
    you need just add the option --force to the install command to ignore any problems,
    like so-so


    ```

