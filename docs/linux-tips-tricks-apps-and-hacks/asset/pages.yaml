    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_116_1.png)


    # Check connection


    Your Android device will create an interface eth0 as the Raspberry Pi. You can
    check to make sure this is happening, by opening a terminal and typing the following:


    ```

    $ ifconfig

    ```


    # 05 Quick


    You can connect from the terminal right now to access the Internet. You should
    be able to do this by typing the following into the terminal:


    ```

    $ sudo dhcdclient usb0

    ```


    This will automatically grab any available IP address that your phone will give
    to it.


    # 07 Save the settings


    Once you reboot, it won''t remember to automatically connect to the phone''s tether.
    However, we can add an entry to config so it will try and do this in the future.
    From the terminal use:


    ```

    $ nano /etc/netplan/interfaces

    ```


    # 08 Interface settings


    Here''s how your current network settings - might look different from yours if
    you have any fixed wireless settings, or dhcp - the syntax as the eth0 line, add:


    ```

    iface usb0 inet dhcp

    ```


    # Tether on the go


    After a reboot, your Pi should automatically connect to your phone, if it''s Wi-Fi
    hotspot or a physical connection. It may draw a little more charge while tethering,
