    \n# Program a client-server application\n\nEach operating system owns its own\
    \ of networking APIs\n\nModern computer networks are composed of multiple protocols.\
    \ Creating well-formed packets by hand is almost impossible - the protocol stack\
    \ and its underlying network hardware affect the form.\nEngine working on Unix\
    \ solved this problem by introducing an abstraction layer - so-called sockets\
    \ as endpoints between two or more applications. Developers use the standardised\
    \ interface in order to provide commands to the server, which are then translated\
    \ to the network.\nWhen dealing with sockets, a basic understanding of networking\
    \ is beneficial. For now, shall suffice to define that messages can be transmitted\
    \ by high-level protocols.\nTCP - for Transmission Control Protocol provides confirmation\
    \ when data has been successfully delivered. This is accomplished with some overhead\
    \ to the communication process. However, some applications require this. UDP provides\
    \ aless communication without forgeries delivery. On a network, computers are\
    \ identified by their IP address. Individual services are identified by their\
    \ port numbers - consider them doors in a high-rise building.\nDevelopers on communication\
    \ software find themselves in a chicken-egg strategy - if no server has been written,\
    \ the client cannot connect. On the other hand, the lack of a client means that\
    \ the server cannot be started.\nIn practical projects you should start out by\
    \ creating a rough mock-up of the messages that the client and server will exchange.\
