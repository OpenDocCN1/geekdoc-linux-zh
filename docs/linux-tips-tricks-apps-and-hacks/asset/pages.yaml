    # 01 Install Capistrano


    Essentially, Capistrano copies your app from Git, over SSH, to your server and
    takes care of all of the operations you''d have to do if you were to move the
    files by hand. Capistrano will deal with any database migration, changes to files
    and assets, restarting the web server and on. Installing Capistrano, and the extras
    package which is nice to have, a simple:


    ```

    gem install capistrano

    ```


    Any problems, check your Ruby Installation. Capistrano-ext gem you may refer to
    elsewhere is no other essential, as features extra options have been integrated
    into the main codebase.


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_60_1.png)


    # 02 SSH Keys


    If you''ve logged into your web server with SSH, it''s time to generate keys.
    This is the key that can be used for authentication - it is a good idea to do
    this on any server. You''ll need it for GitHub account if you are going to be
    setting up one: Start the keys with:


    ```

    ssh-keygen -t rsa

    ```


    ...if you''ve not got one already in ~/.ssh/ and copy the ~/.ssh/id_rsa.pub to
    the server with:


    ```

    ssh-copy-id ~/.ssh/id_rsa.pub user@

    ```


    ...which works by substituting your username, and server or address.


