    python-bind requires C libraries to function. For downloading and installing the
    repository, there are several options. SQLite is the default and works fine for
    small sets, but you need to use PostgreSQL if you have more users.


    So, what do we do to create an unprivileged system user named mediaglobin? Note
    that the user used by MediaGob doesn''t really need any special privileges to
    run. This also helps to make the system more secure. Run this command to create
    the:


    ```

    sudo apt-get install postgresql postgresql-client

    ```


