  md: '# EBS Volumes


    EBS volumes are elastic storage that offer data persistence - you can create or
    delete them while your Linux instance is running.


    EBS volumes come in two types: General Purpose and ''flashy'' SSDs. SSDs offer
    SSDs in one performance category - General Purpose or Provisioned IOPS, which
    delivers higher I/O performance of the drive or other instances you share.


    SSDs with provisioned IOPS will perform at the specified I/O level, but they can
    be costly. General Purpose SSDs are more likely to be cost-conscious. If you''re
    budgeting and don''t need frequent access, an Amazon instance is an adequate compromise.


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_55_0.png)


    | Family | Type | vOps | Instance | Available | Limit to Max |

    |---|---|---|---|---|---|

    | General purpose | General | | | EBS only | Limit to Max |


    # Choose an instance type


    The instance type you choose is optimized for different uses. Use cases include
    virtual servers that can run applications. They have varying combinations of CPU,
    memory, storage, and networking, and you have the freedom to choose the appropriate
    mix of resources for your applications.


    # Choose your AWS region


    Some services, like EC2, require you to select a region. A region is a set of
    AWS data centers, called Availability Zones, with common jurisdiction and independence.
    You can choose any of the AWS regions, not just where you live. You should pick
    the most cost-effective or one of the regions that are closest to the location
    of your users. It is important to remember that your EC2 dashboard shows instances
    you are paying for in the region currently selected. This is a common trick of
    AWS to view consumption in the dashboard of a boring region.


    # Launch EC2 instance


    Navigate to the EC2 section of the AWS Management Console. This part of the interface
    grants you access to a range of infrastructure services where you can build and
    run applications. In the AWS box, an EC2 instance represents a virtual server
    in the cloud


    Each instance represents a host that runs in a virtual environment within virtual
    machines, which makes it cost-effective. To start your Linux instance in the cloud,
    click Launch Instance on the EC2 Dashboard. You can also click on Instance in
    the left-hand navigation pane of the AWS Management Console and then the button
    Launch Instance.


    # Select Linux-AMI


    The configuration of an instance is defined by an Amazon Machine Image (AMI).
    Among AMIs, those that contain the configuration, the volume size, and the boot
    software are useful. The EBS volume based on your distribution of your choice
    will create an RDS database instance.


    # Choose an instance type


    The instance type defines the performance characteristics of your Linux instance
    in terms of clock speed, available RAM, instance storage and network capacity.
    Only instances that qualify for the free tier will be for free.


    Make your choice and then next: Configure Instance.


    # Configure details


    In the next screen, you can select how many instances to want, and where want
    them to be (leaving the Purchasing option box deactivated), if you have the privileges
    to access your AWS instances (IAM Role/name), and continue.


    # Attach storage


    Networking is a basic part of launching an EC2 in a private cloud (VPC), which
    is a way of saying that AWS instances will be isolated from the internet. This
    is useful for users wanting smart routing. Other accounts may also offer an option
    labelled ''EC2-Classic'', which has no protection, so if you see it, don''t use
    it. The mean is to use ''Use subnet settings'' (Disable) the IAM network and no
    showbound to outbound.


    AWS won''t let you lose your instance unless you use the Terminate command in
    the Console you want to remove this.


    If you need additional volumes, you can create and attach them. Free Tier covers
    up to 30GB of General Purpose (SSD) storage for a maximum of 3 instances. For
    instances of less under 100 IOPS (see ''EBS Volumes'' below for more information).


    Now click ''Next'' on Instance Details.


    # Tag your instance


    Tags are key value pairs that provide information that can help you organise your
    AWS resources. Tagging is purely optional. Don''t sweat it - you can always edit
    tags later if you need to. If nothing comes to mind, click ''Next'': Configure
    Security Groups.


