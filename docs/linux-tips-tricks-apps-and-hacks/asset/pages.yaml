  md: '# 100 Terminal tricks


    # ## _063 Unpack a ZIP file


    If you''ve downloaded a ZIP file and you did it from the terminal or you''re working
    from it, you can unpack it using the unzip command. Use it like this:


    ```

    $ unzip file.zip

    ```


    # ## _064 Unpack a TAR file


    Sometimes Linux gives you a compressed file that is archived as a .tar, or .tar.gz.
    You can use the tar command or similar TAR files using the tar command, however
    you need the right options.


    ```

    $ tar -xvf file.tar.gz

    ```


    # ## _065 Copy and write disks


    dd, which is a powerful magic tool you''ve used recently for Raspberry Pi or SD
    cards. Use it to create images from hard drives, where the input is a file and
    the output is the file of your disk. It works like this:


    ```

    $ dd if=/dev/sdb of=image.img status

    ```


    # ## _066 Create an empty file


    When coding or installing software, you need to write files. You can create it
    manually and then save it, but the terminal has a command similar to mkdir that
    enables you to create an empty file - use this:


    ```

    $ touch file

    ```


    # ## _067 Print into the terminal


    The terminal uses cat to print details from files, much like the touch command.
    If you''re writing a script and want to see the output of the current section,
    you can use echo to print into the terminal - use this:


    ```

    $ echo "your text"

    ```


    # ## _068 Check MD5 hash


    When downloading files you can use MD5 to check the integrity of the downloaded
    file by comparing its file hash with the one provided. With MD5 and the file hash
    at location, you can check by:


    ```

    $ md5sum filename

    ```


    # ## _069 Run commands to


    Sometimes you need to do something besides the console. You can enter the command
    line by switching to an alternate instance with Ctrl+Alt+F2 or similar. To send
    a command to a window display, prefix it with DISPLAY="" to know where it goes:


    # ## _070 Create a new SSH key


    When you need to generate a strong encryption key, you can always have a go creating
    it in the terminal. You can do this using your email address by entering into
    the terminal:


    ```

    $ ssh-keygen -t rsa -C "your_email@example.com"

    ```


    # ## _071 System details


    Sometimes you want to check your kernel version and you can do this using the
    uname command, which you can use to see the information in the terminal:


    ```

    $ uname -a

    ```


    # ## _072 Kernel version


    As of lately, you can also get the kernel version. This can be useful for discovering
    the right header when compiling modules or updating your system. You can get the
    kernel version by adding the -r:


    ```

    $ uname -r

    ```


    # ## _073 CPU architecture


    If you''re on an unknown machine, you need to find out what kind of architecture
    you''re running. Find out what the processor is with:


    ```

    $ uname -p

    ```


    # ## _074 Everything else


    Uname allows you to display a list of data that is available from the system and
    you can look at all information by using the -a command:


    # ## _075 Ubuntu version


    Uname shows all the distros you can update, to keep track of which version of
    Ubuntu you are on. You can check by using:


    ```

    $ release -a

    ```


    # FILE

    PERMISSIONS


    # > Learn how you can

    view file permissions

    and get grips with

    how they should be

    properly modified


    > _076 List permissions

    You can check the permissions of every

    item, including files and directories,

    in the terminal using -l. It will print out the

    files and directories in the first

    column blocks. The first character

    identifies the type, d for directory

    directory - for regular file. We are

    interested in the first three sets that are

    interpretedndifferently. For example:


    R for stands, w with stands

    x for execute. If it''s r instead of

    a-, it means that it is present in that

    block of permissions. It''s sw for three

    sets of permissions. The first we are

    currently using, the second being the group

    the third for everyone. Else:


    ```

    rwxrxrxrx

    ```


    # > _077 Change permissions


    With the permissions, you can

    edit them if you want to change

    the owner, group or permissions

    by assigning it a

    number that treats the three-bit sets as a

    binary. So you can do something like:


    ```

    $ chmod 777 file

    ```


    The first number is for the users,

    second is for the group and the third is for

    every else. The numbers:


    +   7: read, write, execute, 111/

    6: read, write, 110/

    5: read, execute, 101/

    4: read, write, 100/

    3: read, execute, 011/

    2: read, 010/

    1: execute only, 001/

    0: none, 000/


    # “To send a

    command to the

    main display,

    prefix it with

    DISPLAY=""”


