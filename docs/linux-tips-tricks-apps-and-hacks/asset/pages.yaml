    # It works!


    This is the default web page for this server.

    The server software is running but no content has been added, yet.


    +   Install Apache

    Once you''ve got your server set up and can SSH in it, it''s time to install the
    Apache server. Do that using the following:


    ```

    $ sudo apt-get install apache2

    ```


    It will automatically detect the domain to the following: 127.0.0.1.


    +   Test server

    If you have a URL into your server, you can test that Apache is working by going
    to a browser in and navigating to 127.0.0.1. Otherwise, from an external system,
    navigate to the IP address of your system in your browser and it should show the
    Apache confirmation page on-screen.


    > With a web server you can now use it to host your own website or access storage
    from the server remotely over the Internet


