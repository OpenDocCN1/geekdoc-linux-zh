    # 16 Encrypt a netcat connection using Crypt


    Transferring data in plain text is not and could cause problems. If you''re uneasy,
    use Crypt, a lightweight version of True encryption. On an Ubuntu system, you
    can install:


    ```

    $ sudo apt-install crypt

    ```


    Now, you are ready to encrypt Netcat. The server part looks like this:


    ```

    $ crypt - passphrase -l -p 12345

    ```


    The client part should run the following command:


    ```

    $ crypt -passphrase localhost 12345

    ```


