  md: '# 100 Development tricks


    # SEARCHING

    WITH GREP


    # DEVELOPMENT

    TIPS


    > Search within

    files using the grep

    command to save time\and find what you need


    > Some terminal tricks for devs

    to help your command line skills

    become more efficient


    >004 Search a file for a term

    The basic use of grep is to search through a file

    for a specific term, it will print out every line with

    that term, so its best to use it with system

    files with reliable content like with:


    ```

    $ grep hello

    ```


    >005 Check for lines

    Looking specific lines in a file is all we need

    good, but when you want them shown out

    line numbers, you can save yourself a lot

    time by getting grep with the -n option.


    ```

    $ grep -n hello

    ```


    >006 Regular expressions

    If you need to make a more advanced search,

    with grep, you can use expressions.

    You can replace your search term with ''hello''

    to look for patterns like hello

    for lines ending in it


    >007 Wildcards and grep

    When searching for lines, you can use a

    wildcard if you need to look for similar

    terms. Using a wildcard in the grep

    search will return every full line matching

    y filter at the start of the

    string or at the end. It looks like so:


    ```

    $ grep ''hello*

    ```


    >008 More wildcards

    You''ll be using wildcards to find

    something beginning or ending with a

    specific term. You can do this in grep by using an asterisk (*)

    along with the dot. In the example above,

    we would have used h* instead.


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_11_0.png)


    >054 Stop a system service

    A system service is the kind of background

    software that starts at up. These are

    controlled by the system management daemon

    like systemd, and can be controlled from

    the terminal with the service command.

    You can stop a service using:


    ```

    $ service stop name

    ```


    >055 Start a service

    You can start services that have been

    stopped using the same service command

    with that operator. As long as you know

    the service name, start:


    ```

    $ service start name

    ```


    >056 Restart a service

    This is perfect with setting up web

    servers like Apache, for restarts may be

    needed, with other services that

    need the stop and start commands sequentially,

    an restart services using:


    ```

    $ service restart name

    ```


    >057 Know the ID

    The ID that you can get for service

    to be managed, but then you can

    now know the ID that you can stop

    by having trouble stopping or if

    tusing many. With the ID, you can


    ```

    $ kill 1234

    ```


    >058 Kill multiple IDs

    A process can be split to stop

    multiple IDs at once This is useful when a

    browser - Google Chrome is a notorious

    example, and you need to kill multiple

    processes either then try and kill

    all the process with:


    ```

    $ killall -v process

    ```


    >059 List connectionsnThe standard command for listing

    networks and details in the

    terminal is finally. This will list

    of all of its interfaces and, if

    You just need to list a specific one, for

    the wireless interface, you can use


    ```

    $ ifconfig wlan

    ```


    >060 List USB devices

    You need to know which USB and USB-

    related devices are connected to a system,

    or find their property density. If

    You need to install it first, you can

    use this in the terminal to list all

    the connected devices


    >061 List drives\and partitions

    Whether you need to check the decision

    ofier working on them, or when you

    just need to get a general understanding of

    tnsystem''s level, you can list all the

    drives. You can do this with the terminal:


    ```

    $ sudo -1

    ```


    >062 Check running software

    Someone''ll want to check what''s running

    on your system and from the terminal this

    be done simply with top. It lists all the

    information you''ll need on your running

    software, such as CPU and memory usage, along

    with the ID you can control.


