  md: '# # Spin your own Debian


    # Use Debian Live System tools to learn how to spin a new Debian system customised
    for you


    Debian 9.0 ''Stretch'' is now out. It is an impressive and useful update, so now,
    you can use it as your stable distro, switch to 9.0 ''Stretch'' as your new rolling
    release or create your own custom Debian.


    Using the Debian Live Systems project. With the project, you can create your own
    custom Debian as you wish to deploy as within an office or in your own home. The
    benefit of creating your own custom image is the ability to include specific packages
    that are particularly relevant to your needs, have it work on specific architecture,
    and much more than you needs.


    We''ll be using the tools available to create this custom image similar to the
    ones that exist within Debian, which will allow you to create your own spin once
    you go to a little more hardore and edit it from the distro itself.


    # 01 Find the builder


    For this we will be using the Debian Live System builder. This is not only software
    that can actually use on Debian, but it has been applied to a web service. We
    are going to use the web version of this, which makes the setup slightly easier
    to parse and generate. You can have a look at it by heading over to the following
    address: http://live-systems.org.


    # 02 Start the builder


    From this page you can run up the range of different tools for the software, including
    development info and old versions of the build software and images used in it.
    If you are actually interested in building click on the Build tab that''s located
    on the top bar and select the Debian option to get to the interface where we can
    customise build to our liking.


    # Resources


    Debian Live builder


    live-systems.org


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_117_0.png)


    Above Easily create a custom Debian using your browser through the tools that
    are built into the distro'
