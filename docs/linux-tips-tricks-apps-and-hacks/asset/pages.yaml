  md: '# # Supercharge your Raspberry Pi


    Get the most out of your Raspberry Pi with these performance-enhancing tips and
    tricks


    Your Raspberry Pi is plugged in. Raspberry is installed on the SD card and you
    are right in the middle of setting up a wireless print server or robot to collect
    your mail from your doormat.


    But are you truly getting the most from your little computer? Do the components
    you''re using maximise the potential of your Raspberry Pi or are they holding
    back? Perhaps you haven''t explored the full set of options in Raspberry, or you''re
    running the entire OS from SD card, something that can reduce SD-card lifespan.


    Various tools and techniques can be employed to improve performance, choosing
    the right hardware to overcloud your Raspberry Pi SD card or all replace it with
    a secondary device to help improve speed.


    +   - Use these tips to reconfigure your Raspberry Pi setup and optimise software
    and ensure you get the best performance for your projects.


    Use better storage hardware

    Your choice of storage media can have an impact on your Raspberry Pi''s performance,
    regardless of the operating system. A low capacity SD card with poor error correction
    is going to be slower than a larger card with greater resilience, so you need
    to find the right balance for your project and shop wisely.


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_83_0.png)'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# Tips | Tricks | Hacks | Apps


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_84_0.png)


    # 02 Choosing the best SD card


    Various standards of SD card are available, with the more expensive ones for better
    error correction. For performance on your Raspberry Pi, choose an SD card with
    a high speed to avoid bottlenecks. Most SD cards allow you to use on your Raspberry
    Pi with an SD card adapter or insert into a Raspberry Pi B.


    # 05 Write data to RAM


    Rather than reading and writing data to your SD card - something that will eventually
    result in a deterioration of reliability and performance - you can configure Raspberry
    to use RAM, which will speed things up and improve SD card performance.


    This is achieved using tmpfs (file systems), a system configuration in most Linux
    distros.


    Above There''s a great guide to SD cards: https://www.raspberry-pi.com/rpi-sd-cards/


    # Buy rated cards


    It''s all tempting to buy the cheapest cards. Raspberry Pi W with an image-closed
    SD is like what you just pulled out of a phone. After all, they''re all the same.
    The chances are that the SD card you were having before is good enough for your
    Raspberry Pi.


    # 03 Make the most of your storage


    You''ll typically need 1-2GB of storage for your chosen Raspberry Pi, so any remaining
    storage on your SD card will be used for updates and data.


    In Raspberry you can use a command line and the configuration utility to gain
    more space (only if your SD card''s larger than 2GB):


    +   - sudo raspberry-config


    # 04 Expand the raspberrypartition


    Maximising the partition allows the full capacity of your SD card when the media
    increases (there is more space want too, so the some sectors cannot be overwritten
    as).


    With raspberry-config running, the arrow keys to select expand_root in the menu.
    Wait briefly while the partition is resized.


    # 06 Enable fstab in raspberry


    This is like making a RAM disk in Windows and is as easy to setup. In the command
    line, enter:


    ```

    sudo nano /etc/fstab

    ```


    Add the following line to mount a virtual file system:


    ```

    tmpfs /var/log tmpfs defaults,noatime,nodev,size=75M,exec=0 0

    ```


    By following this and exiting (Ctrl+X), then restarting the Pi


    +   - sudo shutdown -now


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_84_1.png)


    Tips, Tricks, Apps & Hacks 85'
