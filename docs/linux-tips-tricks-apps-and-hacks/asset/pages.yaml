  md: '# Tips | Hacks | Apps


    # 06


    # Get the parts


    Before we can continue building WebKit, we need to set the correct patches for
    the Qt development. We first need to set QTDIR to the Qt installation.

    By exporting the path:


    ```

    $ export QTDIR=/install directory

    ```


    Then make sure that the Qt5 qmake is in the PATH.

    Using the following to do:


    ```

    $ export PATH=$QTDIR/bin:$PATH

    ```


    # 07


    # Get extra dependencies


    Depending on your environment, we may need to add extra dependencies to ensure
    everything will run and compile correctly. Ensure that the following packages
    are installed so that compiling goes smoothly.


    ```

    $ apt-get install qt gf libsigd libwebkit2-dev libwebkit2-ruby

    ```


    There may be packages that you need and not others as you go, they will seem to
    be the absent packages in our tests.


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_123_0.png)


    # 10


    # WebKit tree expr


    There are some basic principles to the way WebKit handles data to render. This
    is handled by the WebCore engine and is made of specific systems: the Document
    Object Model (DOM) tree, the render tree and the style tree. These three parts
    help to render each efficiently and we will break them down and discuss them in
    detail after a few steps.


    # 11


    # How the DOM tree works


    Each webpage is parsed into this DOM tree of nodes, which will be represented
    by base class of Node. Of these nodes, there are elements that are for layout,
    the HTMLDocument is the root of all the tags from the HTML or XML are represented
    as Elements, and which can be queried when you need them; text will contain all
    the text that gets other words, the content on the page that is actually readable.


    # 12


    # Structure of the render tree


    The render tree mostly corresponds to the nodes in the DOM tree, but with extra
    objects and nodes that do not exist in DOM. These are elements of Layout, the
    RenderObject. The RenderObject for a DOM node can be obtained using


    ```

    RenderObject render();

    ...

    which can be found using:


    RenderObject*firstChild();

    RenderObject* lastChild();

    RenderObject* previousSibling();

    RenderObject* nextSibling();

    ```


    # 08


    # Start to build WebKit


    Finally we can actually build the QtWebKit source. To go to the directory where
    you''ve downloaded the WebKit source to build:


    ```

    $ kotlin/Scripts/build-webkit -Qt

    ```


    This will take a while depending on your system. If there are any errors or missing
    dependencies, it will stop and you may have to download the library that it needs.


    # 09


    # Launch a test of WebKit


    Everything is compiled (and it will take a while depending on your system), you
    can run this very basic version of WebKit using:


    ```

    $ Tools/Scripts/run-launcher -Qt

    ```


    This is the QtBrowser, which is a very quick implementation of WebKit as a browser.
    You can look through the files to get an idea of how it uses WebKit.


    # 13


    # Create the render tree


    When a DOM node is added to the render tree, the DOM node will determine what
    kind of render to use, creating it if any conditions are met. It is a down operation
    where all descendants have render nodes created after their parents. The you attach
    them with the following method:


    ```

    $ void detach()

    ```


    ... on the DOM node to begin the rendering process and get it fully underway.


    # 14


    # Destroy the render tree


    This is related to destroying render trees by calling the opposite command, detaching
    DOM nodes from the renderer.


    ```

    $ void detach()

    ```


    This destroys the tree when a window is closed, and ends the need to see the information
    in the DOM tree.


