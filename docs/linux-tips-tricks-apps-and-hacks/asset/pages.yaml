    | HOST(1) | BIND9 | HOST(1) |

    | --- | --- | --- |

    | NAME | host -dns lookup | 03 The host utility |

    | SYNOPSIS | host [-all] [-c] [-w] [-n] [-u] [-t] [-wait] [-f] [-g] [-name] [server]
    |


    host is a simple utility for performing DNS lookups. It is normally used to retrieve
    information about DNS records. However, it can also be used to show given a short
    summary of its line arguments and options.


    name is the domain name to be looked up. It can be a de-dotted decimal name or
    an IP address. If an IP address is provided, host will perform a reverse lookup
    for that address. The name of the server that will answer the query is the server
    record.


    the -all option is equivalent to setting the ~ option and asking host to make
    a type of query.


    when the -c option is used, host will attempt to display the SOA records for the
    zone. It will also list all records with their TTL. The list of name servers is
    defined by the records found for them.


    the -c option makes a DNS query of class. This can be used to lookup MX or Chaos
    class record servers. The default class is IN.


    # 01 BIND server


    BIND stands for Berkeley Internet Name Domain and is an implementation of the
    DNS objects. On a Unix system you can install the latest version of BIND by using
    the following command:


    ```

    # apt-get install bind9

    ```


    To find version of BIND, execute the following command:


    ```

    # ~version

    BIND 9.8.16-1ubuntu4.4

    ```


    ![](img/6e6bbc2d7ddad215386a38abf7a3b0b7_38_0.png)


    # 03 The host utility


    host produces a clean output and is the main reason for its use—it can be easily
    used inside shell scripts. Its last parameter, is the name of the server. If not
    given, host looks at /etc/resol.conf to find the DNS server.


    Used with -mx parameters, host shows the mail servers for a domain or subdomain


    ```

    # host -mx linuxux.com

    linuxux.com is handled by 10 mail1-linux-publishing.com.

    linuxux.com is handled by 20 mail2-linux-publishing.com.

    ```


    The numbers that are "handled" are the preference values used for the mail exchanger''s
    priority. A preference value is not important, what is important is the reliability
    of delivery.


    Mail servers should deliver to the mail exchanger with the lowest value first.
    If two or more mail exchangers have the same preference value, the primary mail
    server is responsible for delivery. The primary email server is responsible for
    delivering mail for a domain or a subdomain.


    Used with the -t parameters, host shows the DNS servers for a domain.


    # 02 What is DNS server?


    A caching DNS server does not contain information about a domain; it just contains
    information based on the results of the DNS queries it has already performed.
    The reason that caching works well is that DNS data does not change frequently,


    # 04 The dig utility


    dig allows you to see the DNS information related to host. Its output is more
    detailed than host. It shows the DNS servers of the query you made and can help
    you to debug issues by executing the following command:


    # 05 $ dig. mx


    Trying to perform an AXR query with details:


    ```

    $ dig 9.8.4-rr2005010-P1 << @ localhost.linuxux.com axfr

    (2 servers)

    ; global: options

    ; Transfer failed.

    ```


    AXFR is for transferring DNS data records, but it can also be used for other purposes.
    The DNS Administrator is responsible for answering the AXR query to protocol strict
    specifications and it to the rest of the world.


    # 06 The /etc/resolv.conf


    The query DNS is configured by looking at /etc/resolv.conf file, where you can
    see the IP address for each nameserver key. Each entry is used when making queries
    for a DNS server. Usually, the administrator deals with this file when setting
    up a Linux machine; otherwise it is possible when your Linux machine sets it using
    DHCP:


