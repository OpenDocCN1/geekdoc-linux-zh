    an issue to see the details like priority, severity and so on, and then Click.
    The issue list is not only but also has filters available to use to view a few
    relevant ones. You can also filter issues using the search box on the top-left
    sidebar.


    09 Admin options


    View the admin options (gear icon) in the bottom-left corner. These settings are
    specific to projects, you can have different settings for different projects.
    There are five major ones under the admin settings. ''Project'' lets you to see
    project details, enables and disables modules, lets create custom fields for priorities
    and statuses. ''Manage members & ''Roles & Permissions'' have options for user
    management. Integration with GitHub, Bitbucket and GitLab, and events with Webhooks.


    06 Kanban template


    Kanban has its roots in Japan. It uses a work-progress system where the core mechanism
    is exposure (or process) visualization and continuous improvement to stabilize
    the system. While widely used, it is used in many ways with a variety of methodologies.


    With Tiga you can create a project with the Kanban template or the Scrum template
    inside the project. To create a Kanban project, select kanban during project creation.
    If you want to view the project as both scrum and kanban, create the project under
    scrum and enable kanban. Now you will have a kanban option on the left sidebar.
