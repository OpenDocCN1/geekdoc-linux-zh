    # # Take command-line control of your email life with Mutt


    Email is one of the biggest time users, but Mutt offers the tools to sort and
    protect your inbox


    A few years ago, social media started to take up more of our time and you may
    have felt that email was diminishing in importance. however, we still spend hours
    each week wading through emails, have to sign up for all sorts of commercial mailing
    lists to complete the registration on many new websites and services.


    The other change has been a near wholesale move to webmail - contracting out by
    mail users of running both personal mail server and the client (Gmail, Yahoo,
    and Microsoft), at the cost of control and privacy.


    Mutt is convenient in the sense that we no longer have to think about looking
    after our emails, but with some offline features, it remains at a duck and slow
    of many managing a busy email life. Mutt offers you the chance to take back control
    of your emails and really make them work for how to do this with one of the major
    webmail services.


    # ## Set up IMAP


    Before Webmail became ubiquitous, users had to decide between keeping their emails
    on the server to read anywhere. With IMAP (Internet Message Access Protocol) you
    can manage a mail client pop and delete them from the server.


    Generic diverse alliance means that many of us all our mail which archived with
    webmail providers, we will need to enable IMAP/POP3 in the Gmail settings and
    use it with a client like Mutt, yet keep your emails on capricious servers.


    Mutt shows you useful information about your emails in the main list, like their
    size, and you can sort them through them all


