    **DESCRIPTION** sslh lets one accept both HTTPS and SSH connections on the same
    port. It makes it possible to connect to an SSH server on port 443 (e.g. from
    inside a corporate firewall, which almost never block port 443) while still serving
    HTTPS on that port. The idea is to have sslh listen to the external 443 port,
    accept the incoming connections, work out what type of connection it is, and then
    forward to the appropriate server.


    **USAGE** sslh [-t num] [-p listening address] [-l target address for SSL ] [-s
    target address for SSH] [-u username] [-P pidfile] [-v] [-V]


    **OPTIONS** http://manpages.ubuntu.com/manpages/lucid/man8/sslh.8.html


    **EXAMPLE**

    # configure it in /etc/default/sslh

    RUN=yes

    DAEMON_OPTS="-u sslh -p 0.0.0.0:443 -s 127.0.0.1:443 -P /var/run/sslh.pid"

    # start it

    /etc/init.d/sslh start


    List of Tools for Kali Linux 2013'
