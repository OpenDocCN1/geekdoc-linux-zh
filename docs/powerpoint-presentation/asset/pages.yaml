  md: 'fsstat displays the details associated with a file system. The output of this
    command is file system specific. At a minimum, the range of meta-data values (inode
    numbers) and content units (blocks or clusters) are given. Also given are details
    from the Super Block, such as mount times and features. For file systems that
    use groups (FFS and EXT2FS), the layout of each group is listed. For a FAT file
    system, the FAT table is displayed in a condensed format. Note that the data is
    in sectors and not in clusters.


    fsstat [-f type] [-i imgtype] [-o offsetset] [-b dev_sector_size] [-tTVV] image
    [images]


    +   -t type Print the file system type only.

    -f type Specify the file system type. Use ''-f list'' to list the supported file
    system types. If not given, autodetection methods are used.

    -i imgtype Identify the type of image file, Use ''-i list'' to list the supported
    types. If not given, autodetection methods are used.

    -o offset The sector offset where the file system starts in the image.

    -b dev_sector_size The size in bytes, of the underlying device sectors. If not
    given, the value in the image format is used (if it exists) or 512-bytes assumed.-V
    Verbose output of debugging statements to stderr


    Display version


    image The disk or partition Image to read, whose format is given with ''-i''.
    Multiple image file names can be given if the image is split into multiple segments.
    If only one image file is given, and its name is the first in a sequence (e.g.,
    as indicated by ending in ''.001''), subsequent image segments are included automatically.


    ```

    fsstat usb.img

    ```'
  merge: -1
