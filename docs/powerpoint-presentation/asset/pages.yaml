  md: '# stunnel4


    **DESCRIPTION** The stunnel program is designed to work as SSL encryption wrapper
    between remote clients and local (inetd-startable) or remote servers. The concept
    is that having non-SSL aware daemons running on your system you can easily set
    them up to communicate with clients over secure SSL channels. stunnel can be used
    to add SSL functionality to commonly used inetd daemons like POP-2, POP-3, and
    IMAP servers, to standalone daemons like NNTP, SMTP and HTTP, and in tunneling
    PPP over network sockets without changes to the source code.


    **USAGE** stunnel [<filename>] | -fdn | -help | -version | -sockets


    **OPTIONS:** http://man.he.net/man8/stunnel4


    **EXAMPLE**


    | | |

    |---||

    | In order to provide SSL encapsulation to your local impapd service, use | If
    you want to provide tunneling to your pppd daemon on port 2020, use |

    | [impapd] | [vpn] |

    | accept = 993 | accept = 2020 |

    | exec = /usr/sbin/impapd | exec = /usr/sbin/pppd |

