  md: '# aircrack-ng


    **DESCRIPTION** **aircrack-ng** is an 802.11 WEP and WPA-PSK keys cracking program
    that can recover keys once enough data packets have been captured. **aircrack-ng**
    is an 802.11 WEP and WPA/2-PSK keys cracking program. It can recover the WEP key
    once enough encrypted packets have been captured with **airodump-ng**. This part
    of the **aircrack-ng suite** determines the WEP key using two fundamental methods.
    The first method is via the PTW approach (Pyshing, Tews, Weinmann). The main advantage
    of the PTW approach is that very few packets are required to crack the WEP key.
    The second method is the FMS/KoreK method. The FMS/KoreK method incorporates various
    statistical attacks to discover the WEP key and uses these in combination with
    brute forcing. Additionally, the program offers a dictionary method for determining
    the WEP key. For cracking WPA/WPA2 pre-shared keys, a wordlist (file or stdin)
    or **airolib-ng** has to be used. More info: http://www.aircrack-ng.org/


    **USAGE** **aircrack-ng** [options] <cap / .ivs file(s)


    **OPTIONS** http://manpages.ubuntu.com/manpages/rar/en/man1/aircrack-ng.1.html


    **EXAMPLE** aircrack-ng -a 2 -w dictionary.txt handshake-01.cap


    List of Tools for Kali Linux 2013'
