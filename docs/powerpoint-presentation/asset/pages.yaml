  md: '# # dnsdict6


    **DESCRIPTION** thc-ipv6 - THC-IPV6-ATTACK-TOOLKIT - just run the tools without
    options and they will give give you help and show the command line options.


    The tool is used to enumerate domain to get the IPv6 address , if it exists. It
    is a parallized DNS IPv6 dictionary bruteforcer.


    **TIP DETECTION**nMost tools can easily be detected by an IDS or specialized detection
    software. This is done on purpose to make rogue usage detection easier. The tools
    either specify a fixed packet signature, or generically sniff for packets (e.g.
    therefore also answering to icmp6 neighbour solicitations which are sent to a
    non-existing mac, and are therefore very easy to detect). If you don''t want this,
    change the code.


    **USAGE** dnsdict6 <url>

    **USAGE** dnsdict6 [-d46] [-s -m| -l| -x] [-t THREADS] [-D] domain [dictionary-file]


    **EXAMPLE** dnsdict6 google.com'
