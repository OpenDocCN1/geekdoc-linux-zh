    **dsniff** is a password sniffer which handles FTP, Telnet, SMTP, HTTP, POP, poppass,
    NNTP, IMAP, SNMP, LDAP, Login, RIP, OSPF, PPTP MS-CHAP, NFS, VRRP, YP/NIS, SOCKS,
