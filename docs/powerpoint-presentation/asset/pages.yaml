  md: '# miredo


    **DESCRIPTION** miredo is a daemon program providing a Teredo tunnel service compatible
    with the "Teredo: Tunneling IPv6 over UDP through NATs" Internet proposed standard
    (RFC 4380). It can provide either Teredo client or Teredo relay functionality.


    This is most useful to provide IPv6 connectivity to users behind NAT, most of
    which do not support IPv6 at all. Many NATs do not even support proto-41 forwarding,
    so it is not possible to set up a 6to6 or point-to-point IPv6-over IPv4 tunnel
    through them. A Teredo relay is an IPv6 router which forwards IPv6 packets between
    the IPv6 Internet and Teredo clients by encapsulating these IPv6 packets over
    UDP/IPv4. A Teredo client is an IPv6-enabled host which is located behind an IPv4-only
    Network Address Translator (a.k.a. NAT), and encapsulates its IPv6 traffic inside
    UDP over IPv4 packets. A Teredo server is a special Teredo relay which is required
    for Teredo clients to setup their IPv6 connectivity through Teredo. A Teredo server
    must have global static subsequent IPv4 addresses.


    **USAGE** miredo [-c config file] [-f] [-u user] [-t chrootdir] [server_name]


    **USAGE** miredo [OPTIONS] [SERVER_NAME]


    **OPTIONS** http://linux.die.net/man/8/miredo


    **EXAMPLE** miredo -u miredo'
