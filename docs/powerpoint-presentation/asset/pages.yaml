  md: '# updtunnel


    **DESCRIPTION** This project tunnels TCP data through a UDP tunnel. The executable
    can act as the server or client. The server acts as a proxy for the client, listening
    on a specified UDP port and creating a connection to a TCP server that the client
    specifies. The client listens on a TCP port, acting as the server that some TCP
    client connects connects to. The client receives any TCP data on that port and
    sends the data to the **updserver**, which sends it to the TCP connection it made
    with the desired TCP server.


    **USAGE** /updtunnel -s|<c> [-6] <args>


    **USAGE** updtunnel -s [-6] [host] port [local port] [proxy host] [proxy port]
    [remote host] [remote port]


    **OPTIONS** https://github.com/samyk/pwnat/blob/master/README-updtunnel


    **EXAMPLE** Example for tunneling ssh ssh data through the tunnel between two
    computers with IP addresses 192.168.1.2 (client) and 192.168.1.1 (server):


    ```

    server# /updtunnel -s 192.168.1.1 4444

    client# /updtunnel -c 127.0.0.1 3333 192.168.1.1 4444 127.0.0.1 22

    client# ssh -p 3333 user@127.0.0.1

    ```'
  merge: -1
