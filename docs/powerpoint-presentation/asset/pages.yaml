  md: '# ddrescue


    **DESCRIPTION** ddrescue is a raw disk imaging tool that "copies data from one
    file or block device to another, trying hard to rescue data in case of read errors."
    The application is developed as part of the GNU project and has been written with
    UNIX/Linux in mind.


    More info: http://www.gnu.org/software/ddrescue/manual/ddrescue_manual.html


    **USAGE** ddrescue [options] infile outfile [logfile]


    **OPTIONS** http://www.forensicswiki.org/wiki/Ddrescue


    **EXAMPLE** Rescue an entire hard disk /dev/sda to another disk /dev/sdb


    ```

    ddrescue -n /dev/sda/dev/sdb rescue.log (copy the error free areas first)

    ddrescue -r 1 /dev/sda/dev/sdb rescue.log (attempt to recover any bad sectors)

    ```


    **EXAMPLE** Rescue a CD-ROM in /dev/cdrom


    ```

    ddrescue -b 2048 /dev/cdrom cimage logfile (write cimage to a blank CD-ROM)

    ```


    **EXAMPLE** Rescue an ext2 partition in /dev/hda2 to /dev/hdb2


    ```

    ddrescue -r3 /dev/hda2 /dev/hdb2 logfile

    e2fsck -v /dev/hdb2

    mount -t ext2 -o /dev/hdb2 /mnt

    ```


    (This will overwrite ALL data on the partition you are copying to. If you do not
    want to do that, rather create an image of the partition to be rescued)'
