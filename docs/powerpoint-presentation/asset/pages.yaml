  md: '# rtpbbreak


    **DESCRIPTION** With rtpbbreak you can detect, reconstruct and analyze any RTP
    session. It doesn''t require the presence of RTCP packets and works independently
    form the used signaling protocol (SIP, H.323, SCCP, ...). The input is a sequence
    of packets, the output is a set of DLT files you can use as input for other tools
    (`wireshark/tshark, sox, grep/awk/cut/sed, ...). It also supports wireless (AP_DLT_IEEE802.11)
    networks).


    **USAGE** rtpbbreak <input><select><execution><misc


    **OPTIONS** http://dallachiesa.com/code/rtpbbreak/doc/rtpbbreak_en.html


    **EXAMPLE** rtpbbreak -i wifi0 -g -m -d logz


    **EXAMPLE** rtpbbreak -P2 -t100 -d logz -r h323.pcap


    **TIP** How can I extract audio from the recorded .pcap files?


    It is possible to extract audio using rtpbbreak, sox and lame (for mp3).

    First, the conversion of each channel -r in the raw:


    ```

    rtpbbreak -W -r filename_of_rtppproxy_record.a.rtp

    rtpbbreak -W -r filename_of_rtppproxy_record.o.rtp

    ```


    Then mix in the format wavpcm stereo:

    sox -combine merge -8k rtp.0.0.raw -8k -A rtp.1.0 -t wavpcm -s out.wav

    and, and finally, converting to mp3:

    lame out.wav out.mp3'
