  md: '# safecopy


    DESCRIPTION Safecopy is a data recovery tool which tries to extract as much data
    as possible from a seekable, but problematic (i.e. damaged sectors) source - like
    floppy drives, hard disk partitions, CDs, ..., where other tools like would fail
    due to I/O errors. **Safecopy** tries to get as much data from the source as possible
    without device dependent tricks. For example to get an ISO image from a copy protected
    or otherwise damaged CD-ROM, **cdrdao** and **bin2iso** would possibly do a bit
    better and faster job. **Safecopy** comes with preset options (named stages) to
    ease its use. These presets can be overridden by individual options.


    USAGE safecopy [options]<source> <target>


    OPTIONS http://manpages.ubuntu.com/manpages/lucid/man1/safecopy.1.html


    EXAMPLE safecopy image1.dat combined.dat -l image2.badblocks -i blocksize2 \ -X
    image1.badblocks -x blocksize1

    EXAMPLE safecopy /dev/filesystem -b <bsize> -s <X/bsize> -l <Y/bsize> (create
    an image of a device that starts at X and is Y in size)


