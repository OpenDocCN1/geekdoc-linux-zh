  md: '# dnmap


    **DESCRIPTION** dnmap is a framework to distribute nmap scans among several clients.
    It reads an already created file with nmap commands and send those commands to
    each client connected to it.

    The framework use a client/server architecture. The server knows what to do and
    what the clients do it. All the logic and statistics are managed in the server.
    **Nmap** output is stored on both server and client.


    Usually you would want this if you have to scan a large group of hosts and you
    have several different internet connections (or friends that want to help you).


    +   - Clients can be run on any computer on Internet. Do not have to be on a local
    cluster or anything.

    - It uses the TLS protocol for encryption.


    +   **BASIC USAGE**

    1. Put some **nmap** commands on a file like **commands.txt**

    2. ./dnmap_server -f commands.txt (Start the dnmap_server)

    3. ./dnmap_client -s <server-ip> -a <alias> (Start any number of clients)'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# dnmap-client


    DESCRIPTION


    +   * If the server gets down, it keeps connecting to it until it gets up again.

    * Strip strange characters from the command sent by the server. Tries to avoid
    command injection vulns.

    * It only executes the nmap command. It deletes the command sent by the server
    and changes it by the known and trusted nmap binary on the system.

    * You can select an alias for your user.

    * You can change which port the client connects to.

    * If the command sent by the server does not have a -oA option, the client add
    it anyway to the command, so it will always have a local copy of the output.


    USAGE ./dnmap_client -s <server-ip> -a <alias> (start any number of clients)


    EXAMPLE (see dnmap)


    List of Tools for Kali Linux 2013'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# dnmap-server


    DESCRIPTION


    +   - If the server gets down, clients continue trying to connect until the server
    gets back online.

    - If the server gets down, when you put it up again it will send commands starting
    from the last command given before the shutdown. You do not need to remember where
    it was.

    - You can add new commands to the original file without having to stop the server.
    The server will read them automatically.

    - If some client goes down, the server will remember which command it was executing
    and it will re-schedule it for later.

    - It will store every detail of the operations in a log file.

    - It shows real time statistics about the operation of each client


    You can choose which port to use. Defaults to 46001. Only the Online clients are
    shown in the running stats.


    USAGE ./dnmap_server -f commands.txt (start dnmap server)


    EXAMPLE (see dnmap)


    List of Tools for Kali Linux 2013'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# fping


    **DESCRIPTION fping** is a program like **ping** which uses the Internet Control
    Message Protocol (ICMP) echo request to determine if a target host is responding.


    **Fping** differs from **ping** in that you can specify any number of targets
    on the command line, or specify a file containing the lists of targets to ping.
    Instead of sending to one target until it times out or replies, **fping** will
    send out a ping packet and move on to the next target in a round-robin fashion.


    In the default mode, if a target replies, it is noted and removed from the list
    of targets to check; if a target does not respond within a certain time limit
    and/ retry limit it is unreachable. **Fping** also supports sending a specified
    number of pings to a target, or looping indefinitely (as in **ping**).


    Unlike **ping, fping** is meant to be used in scripts, so its output is designed
    to be easy to parse.


    **USAGE** fping [options] [targets...]


    ```

    **EXAMPLE** fping 192.168.100.1 (Responding host -> 192.168.100.1 is alive)

    ```


    ```

    **EXAMPLE** fping 192.168.100.13 (Non-responding host -> 192.168.100.13 is unreachable
    )

    ```'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# hping3


    DESCRIPTION hping3 is a network tool able to send custom ICMP/UDP/TCP packets
    and to display target replies like ping do with ICMP. Hping3 handles fragmentation,
    arbitrary packet body and size and can be used in order to transfer files under
    supported protocols.


    Hping3 can be used, among other things to: Test firewall rules, [spoofed] port
    scanning, test net performance using different protocols, packet size, TOS (type
    of service) and fragmentation, path MTU discovery, files transferring even between
    really fascist firewall rules, traceroute like under different protocols, firewallwalk
    like usage, remote OS fingerprint, TCP/IP stack auditing


    USAGE hping3 <host> [options]


    EXAMPLE hping3 192.168.100.1 -c 1 -I wlan0 -S -p 22 (Following command checks
    the status of port 22/tcp with a TCP SYN scan)


    EXAMPLE hping3 192.168.100.1 -c 1 -I wlan0 -S -p 81 (Following command sends a
    TCP SYN packet to port 81/tcp on host 192.168.100.1)


    EXAMPLE hping3 192.168.100.1 -I wlan0 --scan 20,21,22,80,8080 -V (Scan mode)'
