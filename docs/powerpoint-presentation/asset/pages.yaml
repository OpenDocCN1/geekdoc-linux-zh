- img_proc: true
  md: '# # sshd restart


    **DESCRIPTION** **sshd** (OpenSSH Daemon) is the daemon program for ssh. Together
    these programs replace rlogin and rsh, and provide secure encrypted communications
    between two untrusted hosts over an insecure network. **sshd** listens for connections
    from clients. It is normally started at boot from /etc/rc. It forks a new daemon
    for each incoming connection. The forked daemons handle key exchange, encryption,
    authentication, command execution, and data exchange. **sshd** can be configured
    using command-line options or a configuration file (by default ssh_config); command-line
    options override values specified in the configuration file. **sshd** rereads
    its configuration file when it receives a hangup signal, SIGHUP, by executing
    itself with the name and options it was started with, e.g. /usr/sbin/sshd.


    **USAGE** **sshd** [-46DdeiqTf] [-b bits] [-C connection_spec] [-c host_certificate_file]
    [-E log_file] [-f config_file] [-g login_grace_time] [-h host_key_file] [-k key_gen_time]
    [-o option] [-p port] [-u len


    **OPTIONS** http://www.openbsd.org/cgi-bin/man.cgi?query=sshd&section=8


    **EXAMPLE** sshd restart'
  merge: -1
