  md: '# # nfc-list


    **DESCRIPTION** libbnfc is a library which allows userspace application access
    to NFC devices.


    **nfc-list** is part of **libbnfc** .


    **nfc-list** is a utility for listing any available tags like ISO14443-A, FeliCa,
    Jewel or ISO14443-B (according to the device capabilities). It may detect several
    tags at once thanks to a mechanism called anti-collision but all types of tags
    don''t support anti-collision and there is some physical limitation of the number
    of tags the reader can discover.


    This tool displays all available information at selection time.


    More info: http://nfc-tools.org/index.php?title=Main_Page


    **USAGE** nfc-list


    **EXAMPLE** nfc-list'
