  md: '# asleap


    **DESCRIPTION** asleap - recovers weak LEAP password. This tool is released as
    a proof-of-concept to demonstrate weaknesses in the LEAP and PPTP protocols.


    LEAP is the Lightweight Extensible Authentication Protocol, intellectual property
    of Cisco Systems, Inc. LEAP is a security mechanism available only on Cisco access
    points to perform authentication of end-users and access points. LEAP is written
    as a standard EAP-type, but is not compliant with the 802.1X specification since
    the access point modifies packets in transit, instead of simply passing them to
    a authentication server (e.g. RADIUS).


    PPTP is a Microsoft invention for deploying virtual private networks (VPN). PPTP
    uses a tunneling method to transfer PPP frames over an insecure network as a wireless
    LAN. RFC 2637 documents the operation and functionality of the PPTP protocol.


    **USAGE** asleap [options]


    http://www.willhackforsushi.com/code/asleap/2.2/README


    ```

    /asleap -r leap.dump -f dict.dat -n dict.idx

    ```


    TIP using **asleap** with **genkeys**: http://wirelessdefence.org/Contents/AsleapMain.htm'
