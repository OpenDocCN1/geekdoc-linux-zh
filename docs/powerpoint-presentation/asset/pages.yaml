  md: 'DESCRIPTION cisco-ocs also known as cisco-ocs Mass Scanner. This tool provides
    a single function which is to scan large ranges of IP''s looking for Cisco Cisco
    devices or really any device listening on TCP port 23, attempts to login using
    telnet with a password of cisco, then passes the enable command to the Cisco router
    if its able to login via telnet, uses cisco again again for the enable password,
