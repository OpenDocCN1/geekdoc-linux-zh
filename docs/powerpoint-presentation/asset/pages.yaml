  md: '# Wifite is a python script that automates the WEP and WPA cracking process
    with aircrack-ng tools.


    Wifite can and will delete certain existing .CAP and .XOR files inside of the
    directory it run; specifically any *XOR files and replay-*cap files. Please move
    wifite.py into its own directory to avoid the deleting of these kinds of files.


    Before you run wifite, please learn and use the command-line tools available with
    aircrack-ng. Here is an easy guide to WEP cracking. Only after you have tested
    and successfully cracked WEP and WPA without the use of an automated tool you
    should use Wifite.


    ```

    python wifite.py [SETTINGS] [FILTERS]

    ```


    ```

    ./wifite.py -help and http://wifite.googlecode.com/svn-history/r5/trunk/wifite.py

    ```


    ```

    ./wifite.py --all -wepto (to crack all WEP access points)

    ```


    ```

    ./wifite.py --all --wpsto (crack all WEP access points with signal strength greater
    than (or equal to) 50db)

    ```


    ```

    ./wifite.py --all --dict/pentest/pass/lists/darkc0de.lst (attack all access points,
    use ''darkc0de.lst'' for cracking WPA handshakes)

    ```


    ```

    ./wifite.py --all -wpa --dict (to attack all WPA access points, but do not try
    to crack -- any captured handshakes are saved automatically)

    ```


    ```

    ./wifite.py --pow 50 --wept 300 -600 (to crack all WEP access points greater than
    50db in strength, giving 5 minutes for each WEP attack method, and send packets
    at 600 packets/sec)

    ```


    ```

    ./wifite.py -e "2WIRE752" (to crack all WEP access points greater than 50dB in
    strength, giving 5 minutes for each WEP attack method, and send packets at 600
    packets/sec)

    ```'
