  md: '# spoofotooph


    **DESCRIPTION** Spoofotooph is designed to automate spoofing and cloning Bluetooth
    device Name, Class, and Address. Cloning this information effectively allows Bluetooth
    device to hide in plain site. Bluetooth scanning software will only list one of
    the devices if more than one device in range shares the same device information
    when the devices are in *Discoverable Mode* (specifically the same Address).


    **Option 1:** Incognito can scan an area for Bluetooth devices. Make a selection
    on which device in the list to clone. This option also allows for logging of the
    scanned devices.

    **Option 2:** Randomly generate and assign Bluetooth interface information. The
    *class* and *address* are randomly generated and the *name* is derived from a
    list of the top 100 most common names in US and the type of device. For example
    if the randomly generated *class* is a phone, SpoofTooth might generate the name
    "Bob''s Phone"

    **Option 3:** Specify the *name, class,* address* user wishes for the Bluetooth
    interface to have.

    **Option 4:** Read the log of previous scans and select a device to clone. Users
    can manually add Bluetooth profiles to these log files.

    **Option 5:** *Incognito mode.* Scan for clone new devices at user assignments.


    **USAGE** spoofotooph [options] -device address


    ```

    EXAMPLE spoofotooph -i hci0 -n new_name -a 00:11:22:33:44:55 -c 0x1c010c (Specify
    NAME, CLASS AND ADDR)

    ```


    ```

    EXAMPLE spoofotooph -i hci0 -R (Randomly generate NAME, CLASS AND ADDR)

    ```


    ```

    EXAMPLE spoofotooph -i hci0 -w file.csv (Scan for devices in range and select
    device to clone. Optimally dump the device information in a specified log file)

    ```


    ```

    EXAMPLE spoofotooph -i hci0 -r file.csv (Load in device info from log file and
    specify device info to clone)

    ```


    ```

    EXAMPLE spoofotooph -i hci0 -t 1 (Clone a random device info in range every X
    seconds)

    ```


    List of Tools for Kali Linux 2013 276'
