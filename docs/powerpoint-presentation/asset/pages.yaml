  md: '# sslniff


    **DESCRIPTION** It is designed to MITM all SSL connections on a LAN, and dynamically
    generates certificates for the domains that are being accessed on the fly. The
    new certificates are constructed in a certificate chain that is signed by any
    certificate that you provide.


    More info: https://github.com/moxie0/sslniff


    **USAGE** sslsniff -a c <path/to/your/certificate> -f ios -h <httpPort> -s <sslPort>
    -w iphone.log

    **USAGE** sslsniff -t -s $<listenPort> -w $<logFile> -m IPSCACLASEA1.crt -c $<certDir


    EXAMPLE Assuming we want to intercept SSL traffic from 172.17.10.36, we need to
    trick host into thinking that we''re the router. Using arspoof, we can convince
    the target that the router''s MAC address is our MAC address.


    ```

    arpspoof -eth0 -t 172.17.10.36 172.17.8.1

    arp-sk -kr -S 172.17.8.1 -D 172.17.10.36

    ```


    At this point, any SSL traffic should get proxied by sslsniff and logged to a
    file.


    First, arspoof convinces that our MAC address is the router''s MAC address, and
    the target begins to send all us to their network traffic. The kernel forwards
    everything except for traffic destined to port 443, which it redirects to $listenPort(10000,
    for example). At this point, sslsniff receives the client connection, makes a
    connection to the real SSL site, and looks at the information in the server''s
    certificate. sslsniff then generates a new certificate with an identically Distinguished
    Name and signs it with the end-entity certificate in $certificateFile. sslsniff
    uses the generated certificate chain to do a SSL handshake with the client and
    proxy data between both hosts (logging it, of course).


    List of Tools for Kali Linux 2013'
  merge: -1
  pgno: 385
