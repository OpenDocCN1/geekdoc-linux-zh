  md: '# tcpflow


    **DESCRIPTION tcpflow** is a program that captures data transmitted as part of
    TCP connections (flows), and stores the data in a way that is convenient for protocol
    analysis and debugging. Each TCP flow is stored in its own file. Thus, the typical
    TCP flow will be stored in two files, one for each direction. **tcpflow** can
    also process stored ''tcpdump'' packet flows.


    tcpflow stores all captured data in files that have names of the form: [timestamp]sourceip.sourceport-destip.destport[-VLAN][cNNNNN]


    **USAGE** tcpflow [-chpsv] [-b max_bytes] [-d debug_level] [-f max_fds] [-i iface]
    [-r file] [expression] http://linux.die.net/man/1/tcpflow


    +   - EXAMPLE tcpflow -c n en1 src or dst host api.example.com

    - EXAMPLE tcpflow host sundown (To record all packets arriving at or departing
    from sundown)

    - EXAMPLE tcpflow host helios and \ (hot or ace \) (To record traffic between
    helios and either hot or ace)

    - EXAMPLE tcpflow host ace and not helios (To record traffic between ace and any
    host except helios)

    - EXAMPLE tcpflow net ucb-ether (To record all traffic between local hosts and
    hosts at Berkeley)

