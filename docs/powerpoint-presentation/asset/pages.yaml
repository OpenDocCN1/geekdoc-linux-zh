  md: '# hfind


    **DESCRIPTION** **hfind** looks up hash values in a database using a binary search
    algorithm. This allows one to easily create a hash database and identify if a
    file is known or not. It works with the NIST National Software Reference Library
    (NSRL) and the output of ‘md5sum’.


    Before the database can be used by **hfind**, an index file must be created with
    the ''-i option. This tool is needed for efficiency. Most text-based databases
    do not have fixed length entries and are sometimes sorted. The **hfind** tool
    will create an index file that is sorted and has fixed-length entries. This allows
    for fast lookups using a binary search algorithm instead of a linear search such
    as ‘grep’.


    **USAGE** hfind [-i db_type] [-f lookup_file] [-eq] db_file [hashes]


    **OPTIONS** http://www.sleuthkit.org/sleuthkit/man/hfind.html


    ```

    EXAMPLE To create an MD5 index file for NSRL: # hfind -i nsrl-md5 /usr/local/hash/nsrl/NSRLFile.txt

    ```


    ```

    EXAMPLE To look up a value in the NSRL: # hfind /usr/local/hash/nsrl/NSRLFile.txt
    76b1f4de1522c20b67acc123937cf8b2e

    ```


    ```

    EXAMPLE You can even do SHA-1 and MD5 if you want: # hfind -i nsrl-sha1 /usr/local/hash/nsrl/NSRLFile.txt

    ```


    ```

    EXAMPLE To look entries up, the following will work: # hfind system.md5 76b1f4de1522c20b67acc123937cf8b2e

    ```'
  merge: -1
