  md: "# miranda\n\n**DESCRIPTION Miranda** is a tool that uses the UPnP(universal\
    \ plug and play) protocol to enumerate the target modem (if you found some routers\
    \ and firewalls running the UPnP IGD protocol are vulnerable to attack). \nBefore\
    \ working with **Miranda** you should have moderate knowledge of UPnP.\n\n# **BASIC\
    \ USAGE**\n\n+   1. root@root:/pentest/enumeration/miranda#\n2. # ./miranda.py\n\
    3. upnp> msearch (search for device with the UPnP port open)\n4. upnp> host info\
    \ 0 (this command will tell you various information about your target – name,\
    \ protocol, server type, UPnP server)\n5. upnp> host get 0 (enumerates targets\
