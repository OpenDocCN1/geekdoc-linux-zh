  md: '# thc-ssl-dos


    **DESCRIPTION thc-ssl-dos** - THC has released a DOS tool that exploits SSL renegotiation
    to perform a denial of service on a given SSL server. It uses renegotiation to
    constantly trigger new SSL handshakes with the server, using one single TCP connection.
    **THC-SSL DOS** was developed by a hacking group called The Hacker''s Choice (THC),
    as a proof-of-concept to encourage vendors to patch a serious SSL vulnerability.
    **THC-SSL-DOS**, as with other "low and slow" attacks, requires only a small number
    of packets to cause denial-of-service for a fairly large server. It works by initiating
    a regular SSL handshake and then immediately requesting for the renegotiation
    of the encryption key, constantly repeating this server resource-intensive renegotiation
    request until all server resources have exhausted.


    **URL** www.thc.org/thc-ssl-dos/


    **EXAMPLE** /thc-ssl-dos 127.3.133.7 443


    **TIP**

    The average server can do 300 handshakes per second. This would require 10-25%
    of your laptops CPU

    Use multiple hosts (SSL-DOS) if an SSL Accelerator is used

    Be smart in target acquisition. The HTTPS Port (443) is not always the best choice.
    Other SSL enabled ports are more likely to use an SSL Accelerator (like POP3S,
    SMTPS, . . or the secure database port


    List of Tools for Kali Linux 2013'
