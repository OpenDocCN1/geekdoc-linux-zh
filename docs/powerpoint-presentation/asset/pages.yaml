    structure at blocks starting at 512 bytes boundaries. Salvaged jpeg pictures are
    stored by default under the name imageXXXXX.jpg where XXXXX is a five digit number
    starting at zero. If there more than 100,000 recovered pictures, **recoverjpeg**
    will start using six figures numbers and as soon as needed, but the 100,000 first
    will use a five figure number. Options -f and -i can override this behaviour.


    **USAGE** recoverjpeg [options] device


    **OPTIONS** http://manpages.ubuntu.com/manpages/hardy/man1/recoverjpeg.1.html


    +   **EXAMPLE** recoverjpeg /dev/sdc (Recover as many pictures as possible from
    the memory card located in /dev/sdc)


    +   **EXAMPLE** recoverjpeg -b 1 /devdb1 (Recover as many pictures as possible
    from a crashed ReiserFS file system (which does not necessarily store pictures
    at block boundaries) in /dev/hdb1)


    +   **EXAMPLE** recoverjpeg -b 1 -r 16m /dev/hdb1 (Do the same thing in a memory
    constrained environment where no more than 16MB of RAM can be used for the operation)'
