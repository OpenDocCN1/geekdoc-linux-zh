  md: '# tnscmd10g


    **DESCRIPTION** tnscmd can be used to speak, on a very simple level, with Oracle''s
    TNS listener. The TNS listener (aka tnsnsnr) is the network interface between
    a database client and the database server. Tnsnsnr listens on port 1521/tcp.


    The **Tnsnsnr** keeps a spartan log of activity -- spartan in that it doesn''t
    log a whole lot of useful information. For instance, it doesn''t log the IP address
    of TNS sessions. If you initiate a TCP session to the **tnsnsnr** port, you won''t
    make much headway; it won''t provide a banner and will probably disconnect if
    you type something. Don''t worry, this is what **tnscmd** is for. For tnscmd simply
    talks to the tnsnsnr process. Tnsnsnr will respond to certain commands such as
    ping (an application-level no-op), version (dumps version information about Oracle),
    status (dumps status about the listener and database instances), and services
    (dumps info about the running services.) Commands are apparently case-insensitive.


    More info: http://www.jammed.com/~jwa/hacks/security/tnscmd/tnscmd-doc.html


    **USAGE** tnscmd [command] -h hostname where ''command'' is something like ping,
    version, status, etc. (default is ping)


    ```

    **EXAMPLE** tnscmd -h oraclebox.example.com -p 1521 -indent (ping this to see
    if it is actually running tnsnsnr)

    **EXAMPLE** tnscmd [badcommand]-h oraclebox.example.com (''Bad'' TNS packets can
    crash the listener, regardless of whether or not the DBA has set a password. badcommand
    can be any one of: trc_file trc_level use_plugplay trc_directory snmp_visible
    log_file log_status log_directory)

    ```'
  merge: -1
