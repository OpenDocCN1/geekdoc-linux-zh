  md: '# sbd


    **DESCRIPTION SBD** expands to storage-based death, and is named in in reference
    to Novell''s Cluster Services, which is used **SBD** to exchange poison pill messages.


    The **sbd** daemon, combined with the **external/sbd STONITH** agent, provides
    a way to enable STONITH and fencing in clusters without external power switches,
    but with shared storage.


