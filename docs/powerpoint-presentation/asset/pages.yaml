  md: '# dsniff


    **DSniff** - is a set of password sniffing and network traffic analysis tools
    to parse different application protocols and extract relevant information. **dsniff,
    filesnarf, mailsnarf, msgsnarf, urlsnarf**, and webspy passively monitor a network
    for interesting data (passwords, e-mail, files, etc.). **arpspoof, dnsspoof**,
    and **macof** facilitate the interception of network traffic normally unavailable
