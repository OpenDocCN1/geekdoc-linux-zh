  md: '# ncat


    DESCRIPTION ncat is a general-purpose command-line tool for reading, writing,
    redirecting, and encrypting data across a network. It aims to be your network
    Swiss Army knife, handling a wide variety of security testing and administration
    tasks.


    Ncat can:


    +   - Act as a simple TCP/UDP/SCTP/SSL client for interacting with web/telnet/mail/TCP/IP
    servers and services

    - Act as a simple TCP/UDP/SCTP/SSL server for offering services to clients, or
    simply to understand what existing clients are up to by capturing every byte they
    send.

    - Redirect or proxy TCP/UDP/SCTP traffic to other ports or hosts.

    - Encrypt communication with SSL, and transport it over IPv4 or IPv6.

    - Act as a network gateway for execution of system commands, with I/O redirected
    to the network.

    - Act as a connection broker, allowing two (or far more) clients to connect to
    each other through a third (brokering) server.


    USAGE ncat [options] <url>


    EXAMPLE ncat -C mail.example.com 25 (sending email to an SMTP server. Read manual
    for further steps)


    EXAMPLE ncat -l localhost 143 --sh-exec "ncat --ssl imap.example.com 993" (connecting
    to an IMPA server that requires SSL. Read manual for further steps)'
