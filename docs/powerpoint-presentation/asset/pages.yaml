  md: '# ptunnel


    DESCRIPTION Ptunnel is an application that allows you to reliably tunnel TCP connections
    to a remote host using ICMP echo request and reply packets, commonly known as
    ping requests and replies.


    At first glance, this might seem like a rather useless thing to do, but it can
    actually come in handy in some cases. The following example illustrates the main
    motivation in creating ptunnel:


    Setting: You''re on the go, and stumble across an open wireless network. The network
    gives you an IP address, but won''t let you send TCP or UDP packets out to the
    rest of the internet, for instance to check your mail. What to do? Discover that
    the network will allow you to ping any computer on the rest of the internet. With
    ptunnel, you can utilize this feature to check your mail, or other things that
    require TCP.


    More info: https://github.com/madeye/ptunnel


    USAGE Client: /ptunnel -p -lp -da -dp [-c] [-v] [-u] [-x password] Proxy: ./ptunnel
    [-c] [-v] [-u] [-x password]


    EXAMPLE

    The following assumes that ptunnel is run as root, both on the proxy and client.
    To tunnel ssh connections from the client machine via a proxy running on proxy.pingtunnel.com
    to the computer.login.domain.com, the command line line would be:


    ```

    ptunnel -p proxy.pingtunnel.com -lp 8000 -da login.domain.com -dp 22

    ```


    An ssh connection to login.domain.com can now be established as follows:


    ```

    ssh -p 8000 localhost

    ```


    If ssh complains about potential potential man-in-the-middle attacks, simply remove
    the offending key from the known_hosts file. The warning/error is expected if
    you have previously used ssh -d to your local computer (i.e, ssh localhost), or
    you have used ptunnel to forward ssh connections to different hosts.

    Of course, for all of this work, you need to start the proxy on your proxy-computer
    (proxy:pingtunnel.com). Doing this is very simple:


    ```

    ptunnel

    ```'
  merge: -1
