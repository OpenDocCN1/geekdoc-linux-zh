  md: '# dns2tcp


    **DESCRIPTION** dns2tcp - A tunnelling tool that encapsulate TCP connections in
    DNS.

    **Dn2tcp** is a network tool designed to relay TCP connections through DNS traffic.
    Encapsulation is done on the TCP level, thus no specific driver is needed (i.e.,
    TUN/TAP). **D2tcp** is composed of two parts : a server-side tool and a client-side
    tool. The server has a list of resources specified in a configuration file. Each
    resource is a local or remote service listening for TCP connections. The client
    listen on a predefined TCP port and relays each incoming connection through DNS
    to the final service.


    **USAGE** dns2tcp -z <dns2tcp_server> [options] [server] (client)


    **OPTIONS** http://www.aldeid.com/wiki/Dns2tcp (clients & server)


    **EXAMPLE** dns2tcpd -d 1 -f ~/.dns2tcpdrc (start the dns2tcpd server as a daemon)
    (check available resources)

    dns2tcp -z dns2tcp.aldeid.com -d 3 -k oopssoops -r ssh -l 2222 (select a resource
    and open a connection)

    dns2tcp -z dns2tcp.aldeid.com -k oopssoops -r ssh -l 2222 -D 8080 (ensure the
    connection will be encrypted)

    sh me@127.0.0.1 -p 2222'
