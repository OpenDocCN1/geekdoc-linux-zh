  md: '# cowpatty


    **DESCRIPTION** coWPAtty - brute-force dictionary attack against WPA-PSK. **coWPAtty**
    is designed to audit the pre-shared key (PSK) selection for WPA networks based
    on the TKIP protocol.


    > Note that it is also possible to mount a precomputed attack against the PSK.
    The PBKDF2 algorithm used to generate the PMK takes two non-fixed inputs: the
    passphrase and the network SSID. For a given SSID, we can precalculate all the
    PMK from a dictionary file with the `genmpk` tool.


    **USAGE** cowpatty [options]


    **OPTIONS** http://www.willhackforsushi.com/code/cowpatty/4.3/README


    ```

    $ /genmpk

    genmpk -in - WPA-PSK precomputation attack <jwright@hasborg.com>

    genmpk: Must specify a dictionary file with -f

    Usage: genmpk [options]

    ```


    ```

    -f Dictionary file

    -s Output hash file

    -n Network SSID

    -h Print help information and exit

    -v Print verbose information (-vv for more verbosity)

    -V version and exit

    ```


    ```

    After computing the hash file, run cowpatty with the -d argument.

    $ /genmpk -f -dict hashfile -s somethingclever

    ```


    **EXAMPLE** /cowpatty -r wpa2psk-linksys,dump -d linksys.hash -s links


    **EXAMPLE** /cowpatty -r eap-test.dump -f dict somethingclever (If you are auditing
    WPA-PSK or WPA2-PSK networks, you can use this tool to identify weak passrases
    that were used to generate the PMK. Supply a libcap capture file that includes
    the 4-way handshake, a dictionary file of passwords to guess, and the SSID for
    the network)


    **EXAMPLE** john -wordfile:dictfile -rules-session:johnrestore.dat -stdout:63
    | /cowpatty -r somethingclever (accept dictionary words from STDIN, allowing us
    to utilize a tool like John the Ripper to capture lots of word permutations from
    a dictionary file)


    **EXAMPLE** /cowpatty -r eap-test.dump -d hashfile -s somethingclever'
