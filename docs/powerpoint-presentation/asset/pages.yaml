  md: '# # dnmap


    **DESCRIPTION** dnmap is a framework to distribute nmap scans among several clients.
    It reads an already created file with nmap commands and send those commands to
    each client connected to it.


    The framework use a client/server architecture. The server knows what to do and
    the clients do it. All the logic and statistics are managed in the server. Nmap
    output is stored on both server and client.


    Usually you would want this if you have to scan a large group of hosts and you
    have several different internet connections (or friends that want to help you).


    +   - Clients can be run on any computer on Internet. Do not have to be on a local
    cluster or anything.

    - It uses the TLS protocol for encryption.


    **BASIC USAGE**


    +   1. Put some **nmap** commands on a file like **commands.txt**

    2. ./dnmap_server -f commands.txt (Start the dnmap_server)

    3. ./dnmap_client -s <server-ip> -a <alias> (Start any number of clients)'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# dnmap-client


    DESCRIPTION


    +   - If the server gets down, it keeps connecting to it until it gets up again.

    - Strip strange characters from the command sent by the server. Tries to avoid
    command injection vulns.

    - It only executes the nmap command. It deletes the command sent by the server
    and changes it by the known and trusted nmap binary on the system.

    - You can select an alias for your user.

    - You can change which port the client connects to.

    - If the command sent by the server does not have a -oA option, the client add
    it anyway to the command, so it will always have a local copy of the output.


    USAGE ./dnmap_client -s <server-ip> -a <alias> (start any number of clients)


    EXAMPLE (see dnmap)'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# # dnmap-server


    DESCRIPTION


    +   - If the server gets down, clients continue trying to connect until the server
    gets back online.

    - If the server gets down, when you put it up again it will send commands starting
    from the last command given before the shutdown. You do not need to remember where
    it was.

    - You can add new commands to the original file without having to stop the server.
    The server will read them automatically.

    - If some client goes down, the server will remember which command it was executing
    and it will re-schedule it for later.

    - It will store every detail of the operations in a log file.

    - It shows real time statistics about the operation of each client


    You can choose which port to use. Defaults to 46001. Only the Online clients are
    shown in the running stats.


    USAGE ./dnmap_server -f commands.txt (start dnmap server)


    EXAMPLE (see dnmap)


