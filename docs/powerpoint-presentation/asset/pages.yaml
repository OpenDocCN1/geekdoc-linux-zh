  md: '# eapmd5pass


    DESCRIPTION EAP-MD5 is a legacy authentication mechanism that does not provide
    sufficient protection for user authentication credentials. Users who authenticate
    using EAP-MD5 subject themselves to an offline dictionary attack vulnerability.


    This tool reads from a live network authentication interface in monitor-mode,
    or from a stored libpcap capture file, and extracts the portions of the EAP-MD5
    authentication exchange. Once the challenge and response portions have been collected
    from this exchange, eapmd5pass will mount an offline dictionary attack against
    the user''s password.


    This utility implements a dictionary attack against the EAP-MD5 protocol. With
    an EAP-MD5 authentication capture, you can audit the password for a given user,
    or specify the EAP-MD5 authentication parameters on the command-line to audit
    any EAP-MD5 exchange.


    USAGE eapmd5pass [ -l <int> | -r <pcapfile> ] [-w word] [options]


    OPTIONS http://www.willhackforsushi.com/eapmd5pass/1.4/README


    ```

    EXAMPLE /eapmd5pass -w dict -r eapmd5pass-sample.dump

    ```'
