  md: '# xprobe2


    **DESCRIPTION** xprobe2 is a remote active operating system fingerprint tool.
    **Xprobe2** relies on fuzzy signature matching, probabilistic guesses, multiple
    matches simultaneously, and a signature database.


    **USAGE** xprobe2 [ -v] [-r] [-p proto:portnum:state] [-c configfile] [-o logfile]
    [-p port] [-t receive-timeout] [-m numberofmatches] [-D modnum] [-F] [X] [-B]
    [-A] [-T port spec] [-U port spec] host


    **EXAMPLE** xprobe2 -v D -1 -D2 192.168.1.10 (Will launch an OS fingerprint attempt
    targeting 192.168.1.10) Modules 1 and 2, which are reachability tests, will be
    disabled, so probes will be sent if target is down. Output will be verbose.)


    **EXAMPLE** xprobe2 -v D -1 -D2 192.168.1.20 (Will launch an OS fingerprint attempt
    targeting 192.168.1.20) UDP destination port is set to 53, and output will be
    verbose.)


    **EXAMPLE** xprobe2 -v D -1 -D2 192.168.1.10 (Will only enable TCP handshake module
    (number 11) to probe the target, very useful when all ICMP traffic is filtered.)


    **EXAMPLE** xprobe2 -v D -1 -D2 192.168.1.10 (Will cause TCP handshake module
    to blindly guess open port on the target by sequentially sending TCP packets to
    the most likely open ports (80, 443, 23, 21, 25, 129, 445 and 6000))


    **EXAMPLE** xprobe2 -v D -1 -D2 192.168.1.10 (Will enable portscanning module,
    which will scan TCP ports starting from 1 to 1024 on 127.0.0.1)


    **EXAMPLE** xprobe2 -v D -1 -D2 192.168.1.10 (If remote target has TCP port 139
    open, the command line above will enable application level SMB module (if remote
    target has TCP port 445 open, substitute 139 in the command line with 445))


    **EXAMPLE** xprobe2 -v D -1 -D2 192.168.1.10 (Will enable SNMFv2c application
    level module, which will try to retrieve sysDesc0 OID community strings taken
    from xprobe2.conf file.)'
