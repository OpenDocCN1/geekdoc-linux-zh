    DESCRIPTION sshd (OpenSSH Daemon) is the daemon program for ssh. Together these
    programs replace rlogin and rsh, and provide secure encrypted communications between
    two untrusted hosts over an insecure network. sshd listens for connections from
    clients. It is normally started at boot from /etc/rc. It forks a new daemon for
    each incoming connection. The forked daemons handle key exchange, encryption,
    authentication, command execution, and data exchange. sshd can be configured using
    command-line options or a configuration file (by default sshd_config); command-line
    options override values specified in the configuration file. sshd re its configuration
    file when it receives a hangup signal, SIGHUP, by executing itself with the name
    and options it was started with, e.g. /usr/sbin/sshd.


