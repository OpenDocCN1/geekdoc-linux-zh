  md: '# dsnenum


    **DESCRIPTION** The purpose of dssenum is to gather as much information as possible
    about a domain. The program currently performs the following operations:


    +   - Get the host''s address (A record) / get name servers (threaded) / get the
    MX record (threaded)

    - Perform axfr queries on name servers and get BIND versions(threaded).

    - Get extra names and subdomains via google scraping (google query = "allinurl:
    -www site:domain")

    - Brute force subdomains from file, can also perform recursion on subdomain that
    have NS records (threaded).

    - Calculate C class domain network ranges and perform whois queries on them (threaded).

    - Perform reverse lookups on network ranges ( C class or/and whois netranges (threaded).

    - Write to domain_ips.txt file ip-blocks.


    **USAGE** dssenum.pl [options] <domain>


    ```

    ./dsnenum.pl -p 1 -s 1 google.com

    ```'
  merge: -1
