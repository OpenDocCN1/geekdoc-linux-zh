  md: '# kismet


    DESCRIPTION Kismet is an 802.11 layer2 wireless network detector, sniffer, and
    intrusion detection system. Kismet will work with any wireless card which supports
    raw monitoring (rfmon) mode, and can sniff 802.11b, 802.11a, and 802.11g traffic.
    Kismet identifies networks by passively collecting packets and detecting standard
    named networks, detecting (and given time, decloaking) hidden networks, and inferring
    the presence of kismet supports logging to the wtapfile packet format (readable
    by tcpdump and ethereal) and saves detected network information as plaintext,
    CSV, and XML. kismet is capable of using any GPS supported by gpsd and logs and
    plots network.


    kismet is divided into three basic programs, kismet_server kismet_client and gpsma


    ```

    USAGE kismet [server-options] - [client-options]

    USAGE kismet_server [-nqs] [-k title] [-f config-file] [-c capture-source] [-C
    enable-capture-sources] [-l log-types] [-d dump-type] [-m max-packets-per-file]
