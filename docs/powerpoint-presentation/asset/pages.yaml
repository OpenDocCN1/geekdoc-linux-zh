  md: '# stunnel4


    **DESCRIPTION** The stunnel program is designed to work as SSL encryption wrapper
    between remote clients and local (inetd-startable) or remote servers. The concept
    is that having non-SSL aware daemons running on your system you can easily set
    them up to communicate with clients over secure SSL channels. **stunnel** can
    be used to add SSL functionality to commonly used Inetd daemons like POP-2, POP-3,
    and IMAP servers, standalone daemons like NNTP, SMTP and in tunnelling PPP over
    network sockets without changes to the source code.


    **USAGE** stunnel [<filename>] | -fdn | -help | -version | -sockets

    **OPTIONS** http://man.he.net/man8/stunnel4


    **EXAMPLE**


    In order to provide SSL encapsulation to your local impadd service, use


    ```

    [imapd]

    accept = 993

    exec = /usr/sbin/imapd

    execargs = imapd

    ```


    ```

    If you want to provide tunneling to your pppd daemon on port 2020, use

    [vpn]

    accept = 2020

    exec = /usr/sbin/pppd

    execargs = pppd local

    pty = yes

    ```


    List of Tools for Kali Linux 2013'
