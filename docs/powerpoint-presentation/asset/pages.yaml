  md: 'sipcrack - a suite of tools to sniff and crack the digest authentications within
    the SIP protocol.

    Session Initiation Protocol (SIP) is a protocol developed by the IETF MMMUSIC
    Working Group and is a proposed standard for initiating, modifying, and terminating
    an interactive user session that involves multimedia elements such as video, voice,
    instant messaging, online games, and virtual reality.


    SIPcrack is a SIP sniffer/cracker that contains 2 programs: sipdump to capture
    the digest authentication and sipcrack to brute force the hash using a wordlist
    or standard input. sipdump dumps digest authentications. If a login is found,
    the sniffed login is written to the dump file. See ''sipdump -h'' for options.
    sipcrack brutforces the user''s password with the dump file generated by sipdump.
    If a password is found, the sniffed and cracked login will be updated in the dump
    file. See ''sipcrack -h'' for options.


    USAGE sipcrack [options] <dump_file>


    +   -S Use stdin for passwords

    -w wordlist file containing all passwords to try.

    -p num print cracking process every n passwords (-w) (ATTENTION: slows down heavily)


    EXAMPLE sipdump -i eth0 logins.dump

    sipcrack -w mywordlist.txt logins.dump'
