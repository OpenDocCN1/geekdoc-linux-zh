  md: '# intrace


    **DESCRIPTION** InTrace is a traceroute-like application that enables users to
    enumerate IP hops exploiting existing TCP connections, both initiated from local
    network (local system) or from remote hosts. It could be useful for network reconnaissance
    and firewall bypassing. The difference between traceroute and InTrace is that
    InTrace will make use of an existing TCP connection, and piggyback its packets
    on this connection, effectively bypassing firewall rules that block them, and
    quite often giving you more internal information than you expected.


    **USAGE** intrace [options] <url>


    +   **EXAMPLE** /intrace -h www.freescale.com (Locally initiated TCP connection)


    +   **EXAMPLE** /intrace -i eth0 -h 217.17.34.18 (Remotely initiated TCP connection)


    +   **EXAMPLE** /intrace -h paypal.com -p 80 (instead of port 80, you can use
    any other port such as 21 for FTP, or 22 for SSH)'
