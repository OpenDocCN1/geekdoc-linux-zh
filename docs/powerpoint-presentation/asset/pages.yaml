  md: '# invite flood


    DESCRIPTION SIP INVITE Flood - The two attacks above both target HTTP; this one
    is a VoIP flood that targets SIP. It takes every advantage of the normal time
    lag during the SIP call initiation process to overload a SIP server. Since SIP
    runs over UDP, a single packet from a caller, hacker, or botnet can start the
    process of “dialing” and ringing at the beginning of a phone call. In our everyday
    lives, we don’t think anything of the 20-second delay between entering a phone
    number and hearing “Hello” or the voicemail prompt from the other end. But that
    delay, when multiplied across thousands of simultaneous connections, can crash
    a server and potentially open the door for even more mayhem within a VoIP-based
    call center. Plus, it’s very difficult to determine in advance which calls are
    legitimate and which ones are part of DDoSs, especially if an attacker is clever
    enough to spoof the IP addresses in UDP headers, or to spoof SIP headers so they
    don’t match the corresponding UDP headers.


    USAGE n/a; GUI tool


    OPTIONS n/a; GUI tool


