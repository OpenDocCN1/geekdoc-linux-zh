  md: '# MFCUK - MiFare Classic Universal toolKit.


    Toolkit containing samples and various tools based on and around libnfc and crypto1,
    with emphasis on Mifare Classic NXP/Philips RFID cards.


    Special emphasis of the toolkit is on the following:


    +   - mifare classic weakness demonstration/exploitation

    - demonstrate use of libnfc (and ACR122 readers)

    - demonstrate use of Crypto1 implementation to confirm internal wirkings and to
    verify theoretical/practical weaknesses/attacks


    ./.mfcuk [OPTIONS]


    /mfcuk_keyrecovery_darkside -C -R 0:A -v 2 (Recovering a key)'
  merge: -1
