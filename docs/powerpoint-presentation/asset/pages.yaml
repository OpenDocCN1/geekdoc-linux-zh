  md: '# tcppreplay


    DESCRIPTION tcppreplay - replay network traffic stored in pcap files. The basic
    operation of tcppreplay is to resend all packets from the input file(s) at the
    speed at which they were recorded, or a specified data rate, up to fast as the
    hardware is capable. Optionally, the traffic can be split between two interfaces,
    written to files, filtered and edited in various ways, providing the means to
    test firewalls, NIDS and other network devices. For more details, please see the
    tcppreplay Manual at: http://tcppreplay.synfin.net/trac/wiki/manual


    USAGE tcppreplay [-flag [value]...]--opt-name [[=] jvalue]]... <pcap_file(s)>
    OPTIONS http://tcppreplay.synfin.net/tcppreplay.html


    EXAMPLE tcppreplay --intf1=eth0 sample.pcap (replay a given pcap as it was captured
    all you need to do is specify the pcap file and the interface to send the traffic
    out interface ''eth0'')


