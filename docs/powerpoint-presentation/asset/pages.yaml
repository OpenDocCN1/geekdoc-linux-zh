    determines what ciphers are supported, which are the servers preferred ciphers,
    which SSL protocols are supported and returns the SSL certificate. Client certificates
    / private key can be configured and output is to text / XML.


    **USAGE** sslscan [Options] [host:port | host]


    +   **OPTIONS**

    --targets=<file> A file containing a list of hosts to check. Hosts can be supplied
    with ports (i.e. host:port)

    --no-failed List only accepted ciphers (default is listing all ciphers)

    --ssl2 Only check SSL2 ciphers

    --ssl3 Only check SSLv3 ciphers

    --tls1 Only check TLSv1 ciphers

    --pk=<file> A file containing the private key or a PKCS#12 file containing a private
    key/certificate pair (as produced by MSIE and Netscape).

    --kpass=<password> The password for the private key or PKCS#12 file.

    --certs=<file> A file containing PEM/ASN1 formatted certificates.--starttls Test
    a HTTP connection. starttls is required to kick an SMTP service into action.

    --bugs Enable SSL implementation bug workarounds.

    --xml=<file> Output results to an XML file.

    --version Display the program version.

    --help Display the help text you are now reading.


    **EXAMPLE** sslscan 209.85.146.17'
