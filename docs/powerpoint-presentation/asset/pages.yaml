  md: '# # blkcalc



    **DESCRIPTION** blkcalc - Converts between unallocated disk unit numbers and regular
    disk unit numbers. **blkcalc** creates a disk unit number mapping between two
    images, one normal and another that only contains the unallocated units of the
    first (the default behaviour of the **blkl** program). One of the -d, -s, or -u
    options must be given. If the -d option is given, then the **unit_addr** value
    is the disk unit address in the regular image (i.e. from dd). If the unit is unallocated,
    its address in an unallocated image is given. If the -u option is given, then
    the unit_addr value is the disk unit address in the unallocated unit image (i.e.
    from **blks** ). Its disk unit address in the original image is determined. If
    the -s option is given, then the unit_addr value is the disk unit address in the
    slack image (i.e. from **blks** -s). The image is the full, original image (i.e.
    from dd). **blkcalc** was called **dcalc** in TSK versions prior to 3.0.0.



    **USAGE** blkcalc [-dsu unit_addr] [-vv] [-i imgtype] [-o imgoffset] [-b dev_sector_size]
    [-f ftype] image [images]



    **OPTIONS** http://www.sleuthkit.org/sleuthkit/man/blkcalc.html



    **EXAMPLE** blkcalc -u 64 images/wd0'
  merge: -1
  pgno: 563
