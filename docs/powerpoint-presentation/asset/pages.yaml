  md: '# dnstracer


    **DESCRIPTION** dnstracer enables to trace a chain of DNS servers to the source.
    It determines where a given Domain Name Server (DNS) gets its information from,
    and follows the chain of DNS servers back to the servers which know the data.


    **USAGE** dnstracer [options] name


    **EXAMPLE** dnstracer www.mavetju.org (Search for the A record of www.mavetju.org
    on your local nameserver)


    **EXAMPLE** dnstracer "-s" . "-q" mavetju.org (Search for the MX record of mavetju.org
    on the root-nameservers)


    **EXAMPLE** dnstracer "-q" ptr 141.230.204.212.in-addr.arpa (Search for the PTR
    record (hostname) of 212.204.230.141)


    **EXAMPLE** dnstracer "-q" ptr "-s" . "-o" 2.0.0.0.0.0.0.0.0.0.6.4.2.0.0.0.0.8.b.0.e.f.f.3.ip6.int
    (for IPv6 addresses)'
  merge: -1
