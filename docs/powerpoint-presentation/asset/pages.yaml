  md: 'DESCRIPTION **onesixxtyone** takes advantage of the fact that SNMP is a connectionless
    protocol and sends all SNMP requests as fast as it can. Then the scanner waits
    for responses to come back and logs them, in a fashion similar to **Nmap** ping
    sweeps. By default **onesixxtyone** waits for 10 milliseconds between sending
    packets, which is adequate for 100MB switched networks. The user can adjust this
    value via the -w command line option. If set to 0, the scanner will send packets
    as fast as the kernel would accept them, which may lead to packet drop.


    USAGE onesixxtyone [options] <host> <community>


    +   -c <communityfile> file with community names to try

    -i <inputfile> file with target hosts

    -o <outputfile> output log

    -d debug mode, use twice for more information

    -w <n> wait n milliseconds (1/1000 of a second) between sending packets (default
    10)

    -q quiet mode, do not print log to stdout, use with -l


    EXAMPLE onesixxtyone 192.168.100.51'
