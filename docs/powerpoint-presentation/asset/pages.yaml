  md: 'DESCRIPTION Reaver implements a brute force attack against WiFi Protected Setup
    which can crack the WPS pin of an access point in a matter of hours and subsequently
    recover the WPA/WPA2 passphrase. Specifically, Reaver targets the registrar functionality
    of WPS, which is flawed in that it only takes 11,000 attempts to guess the correct
    WPS pin in order to become a WPS registrar. Once registered as a registrar with
    the access point, will give you the WPS passphrase.


    USAGE reaver -i <interface> -b <target bssid> -v


    +   - -m, --mac=<mac> MAC of the host system (should be resolved automatically)

    - -e, --ssid=<ssid> SSID of the target AP. Unless cloaked, this will be resolved
    automatically.

    - -c, --channel=<channel> Set the 802.11 channel for the interface (implies f)

    - -o, --output-file=<file> Send output to a log file [default: stdout]

    - -f, fixed Disable channel hopping

    - -s, 5ghz Use 802.11 channels

    - -v, verbose Display non-critical warnings (-vv for)

    - -q, quiet Only display critical messages

    - -i, --interface=<wlan> Name of the monitor-mode interface to use

    - -b, --ssid=<ssid> BSSID of the target AP

    - -p, --pin=<wps pin> Use the specified WPS pin

    - -h, --help show help


