  md: '# blindelephant


    DESCRIPTION The BlindElephant Web Application Fingerprint attempts to discover
    the version of a (known) web application by comparing static files at known locations
    against precomputed hashes for versions of files in all of the available releases.
    The technique is fast, low-bandwidth, non-invasive, generic, and highly automatable.


    BlindElephant can be used directly as a tool on the command line, or as a library
    to provide fingerprinting functionality to another program.


    USAGE BlindElephant.py [options] url appName


    +   OPTIONS

    -h, --help show this help message and exit

    -p PLUGINNAME, --pluginName=PLUGIN Fingerprint version of plugin (should apply
    to web app in appname)

    -s, --skip Skip printing webpp, just fingerprint plugin

    -n NUMPROBES, --numProbes=NUMPROBES Number of files to fetch (more may increase
    accuracy). Default: 15

    -w, --winnow If more than one version are returned, use winning to attempt to
    narrow it down (up to numProbes additional requests)

    -l, --list List supported webapps and plugins


