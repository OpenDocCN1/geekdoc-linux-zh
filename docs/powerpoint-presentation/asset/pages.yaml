  md: '# p0f


    **DESCRIPTION** p0f uses a fingerprinting technique based on analysing the structure
    of a TCP/IP packet to determine the operating system and other configuration properties
    of a remote host. The process is completely passive and does not generate any
    suspicious network traffic. The other host has to either:


    connect to your network - either spontaneously or in an induced manner, for example
    when trying to establish a ftp data stream, returning a bounced mail, performing
    auth lookup, using IRC DCC, external html mail image reference and so on, or be
    contacted by some entity on your network using some standard means (such as a
    web browsing); it can either accept or refuse the connection.


    The method can see thru firewalls and does not have the restrictions of an active
    fingerprinting. The main uses of passive OS fingerprinting are attacker profiling
    (IDS and honeypots), visitor profiling (content optimization), customer/user profiling
    (policy enforcement), pen-testing, etc.


    **USAGE** p0f [-f file] [-i device] [-s file] [-o file]

    [-w file] [-Q sock -0] [-u user] [-FXVNDUKASCMCMROqtpvdlrx]

    [-c size] [-T nn] [-e nn] [''filter rule'']


    **OPTIONS** http://www.aldeid.com/wiki/P0f


    **EXAMPLE** p0f -i eth1 -vt (The following command will start p0f)


    **EXAMPLE** p0f -i eth1 -vto output.txt (The output of the ingerprint information
    can also be directed to a file using the -o option)'
  merge: -1
