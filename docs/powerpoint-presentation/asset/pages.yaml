  md: '# md5deep


    DESCRIPTION md5deep is a set of programs to compute MD5, SHA-1, SHA-256, Tiger,
    or Whirlpool message digests on an arbitrary number of files.


    md5deep is similar to the md5sum program found in the GNU Coreutils package, but
    has the following additional features:


    +   - Recursive operation - md5deep is able to recursive examine an entire directory
    tree. That is, compute the MD5 for every file in a directory and every file in
    every subdirectory.

    - Comparison mode - md5deep can accept a list of known hashes and compare them
    to a set of input files. The program can display either input files that match
    the list of known hashes or those that do not match. Hashes sets can be drawn
    from Encase, the National Software Reference Library, iLook Investigator, Hashkeeper,
    md5sum, BSD md5, and other generic hash generating programs. Users are welcome
    to add functionality to read other formats!

    - Time estimation - md5deep can produce a time estimate when it''s processing
    very large files.

    - Piecewise hashing - Hash input files in arbitrary sized blocks

    - File type mode - md5deep can process only files of certain type, such as regular
    files, block devices, etc.


    USAGE n/a


    EXAMPLE n/a'
  merge: -1
  pgno: 602
- img_proc: true
  md: '# rahash2


    **DESCRIPTION rahash2 - radare** tool for creating hashes. **rahash2** is designed
    to work with blocks like **radare** does. So this way you can generate multiple
    checksums from a single file, and then make a faster comparison of the blocks
    to find the part of the file that has changed.


    This is useful in forensic tasks, when progressively analyzing memory dumps to
    find the places where it has changed and then use ''**radiff**'' to get a closer
    look at these changes.


    This is the default work way for **rahash2**. So lets generate a **rahash2** checksumming
    file and then use it to check if something has changed. The default block size
    is 32 KBytes. You can change it by using the -b flag.


    **USAGE** rahash2 [-action] [-options] [source] [hash-file]


    **OPTIONS** rahash2 -h


    **OPTIONS** check rahash2 http://radare.org/doc/html/Section18.1.html


    **EXAMPLE** rahash2 -a md5 -s ''hello world'''
  merge: -1
