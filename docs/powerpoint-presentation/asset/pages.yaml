  md: '# wifi-honey


    DESCRIPTION wifi-honey works out what encryption a client is looking for in a
    given network by setting up four fake access points, each with a different type
    of encryption - None, WEP, WPA and WPA2 - and then observing which of the four
    the client connects to.


    In the case of WPA/WPA2, by running airodump-ng along side this you also end up
    capturing the first two packets of the four way handshake and so can attempt to
    crack the key with either aircrack-ng or coWPAtty.


    What this script does - is to automate the setup process, it creates five monitor
    interfaces, four are used as APs and the fifth is used for airodump-ng. To make
    things easier, rather than having five windows all this is done in a screen session
    which allows you to switch between screens to see what is going on. All sessions
    are labelled so you know which is which.


