  md: '# genpmk


    **DESCRIPTION** genpmk is used to precompute the hash files in a similar way to
    Rainbow tables is used to pre-hash passwords in Windows LANMan. There is a slight
    difference, however, in WPA in that the SSID of the network is used as well as
    the WPA-PSK to "salt" the hash. This means we need a different set of hashes for
    each and every unique SSID i.e. a set for "linksys" a set for "tsunami" etc..


    **USAGE** genpmk [options]


    **OPTIONS**


    +   -f Dictionary file

    -d Output hash file

    -s Network SSID

    -h Print this help information and exit

    -v Print verbose information (more -v for more verbosity)

    -v Print program version and exit


    **EXAMPLE** ./genpmk -f dict -d hashfile -s cuckoo (generate some hash files for
    a network using the SSID cuckoo)


