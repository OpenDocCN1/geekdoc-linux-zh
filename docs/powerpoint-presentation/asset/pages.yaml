  md: '**DESCRIPTION** reglookup – Windows NT+ registry reader/lookup tool . The **RegLookup**
    project is devoted to direct analysis of Windows NT-based registry files. **reglookup**
    is designed to read Windows registry elements and print them out to stdout in
    a CSV-like format. It has filtering options to narrow the focus of the output.
    This tool is designed to work with on Windows NT-based registries.


    **USAGE** reglookup [options] registry-file


    **OPTIONS** http://man.cx/reglookup(1)


    **EXAMPLE** To read and print the contents of an entire system registry file:
    reglookup /mnt/win/c/WINNT/system32/config/system /mnt/win/c/WINNT/system32/config/system


    **EXAMPLE** To limit the output to just those entries under the Services key:
    reglookup -p /ControlSet002/Services /mnt/win/c/WINNT/system32/config/system


    **EXAMPLE** To limit the output to all registry values of type BINARY: reglookup
    -t BINARY /mnt/win/c/WINNT/system32/config/system


    **EXAMPLE** And to limit the output to BINARY values under the Services key: reglookup
    -t BINARY -p /ControlSet002/Services /mnt/win/c/WINNT/system32/config/system'
