  md: '# blueranger


    **DESCRIPTION BlueRanger** is a simple Bash script which uses *Link Quality* to
    locate Bluetooth device radios. It sends l2cap (Bluetooth) pings to create a connection
    between Bluetooth interfaces, since most devices allow pings without any authentication
    or authorization. The higher the link quality, the closer the device (in theory).


    Use a Bluetooth Class 1 adapter for long range location detection. Switch to a
    Class 3 adapter for more precise short range locating. The precision and accuracy
    depend on the build quality of the Bluetooth adapter, interference, and response
    from the remote device. Fluctuations may occur even when neither device is in
    motion.


    **USAGE** blueranger.sh [options] <device address>


    **EXAMPLE** blueranger.sh hci0 6C:D6:8A:B1:30:BC (Provide the local interface
    and Device Address of the device you are trying to locate.)'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# btscanner


    DESCRIPTION btscanner is a tool designed specifically to extract as much information
    as possible from a Bluetooth device without the requirement to pair. A detailed
    information screen extracts HCI and SDP information, and maintains an open connection
    to monitor the RSSI and link quality. btscanner is based on the BlueZ Bluetooth
    stack, which is included with recent Linux kernels, and the BlueZ toolset. btscanner
    also contains a complete listing of the IEEE OUI numbers and class lookup tables.
    Using the information gathered from these sources it is possible to make educated
    guesses as to the host device type.


    USAGE btscanner [options]


    +   OPTIONS

    --help Display help

    --cfg=<file> Use <file> as the config file

    --no-reset Do not reset the Bluetooth adapter before scanning


    EXAMPLE btscanner --help'
