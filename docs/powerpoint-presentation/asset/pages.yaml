  md: '# aireplay-ng


    **aireplay-ng** is used to inject/replay frames. The primary function is to generate
    traffic for the later use in aircrack-ng for cracking the WEP and WPA-PSK keys.
    There are different attacks which can cause deauthentications for the purpose
    of capturing WPA handshake data, fake authentications, Interactive packet replay,
    hand-crafted ARP request injection and ARP-request reinjection. With the packetforge-tool
    it''s possible to create arbitrary frames. **aireplay-ng** supports single-NIC
    injection/monitor. This feature needs driver patching.


    More info: [www.aircrack-ng.org/](https://www.aircrack-ng.org/)


    **aireplay-ng** [options] <replay interface>


    [http://manpages.ubuntu.com/manpages/rando/en/man8/aireplay-ng.8.html](http://manpages.ubuntu.com/manpages/rando/en/man8/aireplay-ng.8.html)


    ```

    aireplay-ng -0 5 -a 001D:7E:56:FD:F6 -c 001A:73:D7:CA:88 mon0

    ```'
