  md: '# sorter


    DESCRIPTION sorter is a Perl Script that analyzes a file system to organize the
    allocated and unallocated files by file type. runs the ''file'' command on each
    file and organizes the files according to the rules in configuration files. Extension
    mismatching is also done to identify ''hidden'' files. One can also provide hash
    databases for files that are known to be good and can be ignored and files that
    are known to be bad and should be alerted.


    By default, the program uses the configuration files in the directory where The
    Sleuth Kit was installed. Those can be overruled with run-time options. There
    is a standard configuration for all file system types and then a specific one
    for a given operating system.


    ```

    USAGE [-b size] [-e] [-E] [-h] [-I] [-md5] [-s] [-sha1] [-U] [-v] [-V] [-a hash_alert]
    [-c config] [-C config] [-d dir] [-m mnt] [-n nsrl_db] [-x hash_exclude] [-i imgype]
    [-o imgoffset] [-f type] image [image] [meta_addr]

    ```


    ```

    OPTIONS http://www.sleuthkit.org/sleuthkit/man/sorter.html

    ```


    ```

    EXAMPLE

    # sorter -f ntfs -d data/sorter images/hda1.dd

    # sorter -d data/sorter images/hda1.dd

    # sorter -i raw -f ntfs -o 63 -d data/sorter images/hda1.dd

    ```


    ```

    EXAMPLE

    # sorter -f ntfs -C /usr/local/sleuthkit/share/sort/Images.sort -d data/sorter
    -h s images/hda1.dd

    ```'
