  md: '# flasm


    **DESCRIPTION Flasm** disassembles your entire SWF including all the timelines
    and events. Looking at you learn how the Flash compiler works, which improves
    your **ActionScript** skills. You can also do some optimizations on the disassembled
    code by hand or adjust the code as you wish. **Fasm** then applies your changes
    to the original SWF, replacing original actions.


    It''s also possible to embed *Fasm* actions in your ActionScript, making optimizing
    of large projects more comfortable. *Fasm* is not a decompiler. What you get is
    the human readable representation of SWF bytecodes, not **ActionScript** source.
    If you''re looking for a decompiler, **Flare** may suit your needs. However, **Flare**
    can''t offer the SWF.


    More info: http://flasm.sourceforge.net/


    **USAGE** flasm option filename


    **OPTIONS** http://flasm.sourceforge.net/#usage


    +   **EXAMPLE** flasm -d foo.swf (Disassemble foo.swf to the console)


    +   **EXAMPLE** flasm -d foo.swf > foo.fl (Disassemble foo.swf, redirect the output
    to foo.fl)


    +   **EXAMPLE** flasm -z foo.swf (Compress foo.swf, create .w own backup. Source
    SWF doesn''t have to be Flash MX file. However, only Flash MX and later players
    will be able to play the resulting compressed file).


    +   **EXAMPLE** flasm -x foo.swf (Decompress foo.swf, create create .wf backup)'
