    **OPTIONS** http://www.sleuthkit.org/sleuthkit/man/mmcat.html


    +   - t mmtype Specify the media management type. Use ''-t list to list the supported
    types. If not given, autodetection methods are used.

    - o offset Specify the offset into the image where the volume containing the partition
    system starts. The relative offset of the partition system will be added to this
    value.

