  md: '# fiked


    DESCRIPTION fiked - a fake IKE PSK+XAUTH daemon based on vnc. Fiked impersonates
    a VPN gateway''s IKE responder in order to capture XAUTH login credentials in
    insecure PSK+XAUTH setups, such as commonly found in Cisco based VPN sites.


    Fiked supports IKEv1 in aggressive mode, using pre-shared keys and XAUTH. Supported
    algorithms are DES, 3DES, AES-128, AES-192, AES-256; MD5, SHA1; and DH groups
    1, 2 and 5. IKE main mode is not supported.


    To actually implement an attack against a VPN site, you have to intercept the
    IKE traffic to the VPN gateway and redirect it to fiked. Your options include
    hostap or ARP poisoning, and will will require some (e.g., pf) redirection magic,
    depending on the situation.


    USAGE fiked [-rdqhV] -g gateway -k id:secret [-u user] [-I file] [-L file]


    OPTIONS http://www.irongeek.com/i.php?page=backtrack-r1-man-pages/fiked


    EXAMPLE fiked -g 10.0.0.1 -k group1:g3h31m -k group2:s3kr3t -l account.log (To
    impersonate gateway 10.0.0.1 using secrets for group ids group1 and group2, writing
    results to file account.log)


    EXAMPLE fiked -g 10.0.0.1 -k group1:g3h31m -l account.log -d -L fiked.log (The
