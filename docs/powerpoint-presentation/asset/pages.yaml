- img_proc: true
  md: '# mfoc


    **DESCRIPTION MFOC** is an open source implementation of "offline nested" attack
    by Nethemba. MFOC uses LIBNFC and CRAPTO1 library to recover the keys, provided
    at least one valid Key-A/Key-B of any sector is known, or if the card uses at
    least one block encrypted with a default key, all the other keys can be extracted
    in minutes. If the card does not use default keys, one key for a sector can be
    retrieved using the **MFCUK** library, after which this library can be used.


    This program allows to recover authentication keys from MIFARE Classic card.


    Please note MFOC is able to recover keys from target only if it have a known key:
    default one (hardcoded in MFOC) or custom one (user provided using command line).


    **USAGE** mfoc [-h] [-k key]... [-P probnum] [-T tolerance] [-O output


    **EXAMPLE** mfoc -h


    **EXAMPLE** mfoc -O mycard.mfd


    **EXAMPLE** mfoc -k fffeeeeeddd -O mycard.mfd


    **EXAMPLE** mfoc -P 50 -T 30 -O mycard.mfd'
