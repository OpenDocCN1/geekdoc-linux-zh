  md: '# dcflddd


    **DESCRIPTION dcflddd** is an enhanced version of GNU dd with features useful
    for forensics and security.


    Based on the **dd** program found in the GNU Coreutils package, **dcflddd** has
    the following additional features:


    +   - Hashing on-the-fly - dcflddd can hash the input data as it is being transferred,
    helping to ensure data integrity.

    - Status output - dcflddd can update the user''s progress in terms of the amount
    of data transferred and how much longer operation will take.

    - Flexible disk wipes - dcflddd can be used to wipe disks quickly and with a known
    pattern if desired.

    - Image/wipe Verify - dcflddd can verify that a target drive is a bit-for-bit
    match of the specified input file or pattern.

    - Multiple outputs - dcflddd can output to multiple files or disks at the same
    time.

    - Split output - dcflddd can split output to multiple files with more configurability
    than the split command.

    - Piped output and logs - dcflddd can send all its log data and output to commands
    as well as files natively.


    **USAGE dcflddd** [OPTION]...


    ```

    http://linux.die.net/man/1/dcflddd

    ```


    **EXAMPLE** dcflddd if=/dev/hda1 of=/mnt/data/image.dd hashlog=/mnt/data/md5hash2.txt'
