  md: '# fierce


    DESCRIPTION fierce is a semi-lightweight enumeration scanner that helps penetration
    testers locate non-contiguous IP space and hostnames for a specified domains using
    things like DNS, Whois and ARIN. It''s really meant as a pre-cursor to active
    testing tools via something like: nmap, unicornscan, nessus, nikto, etc, since
    all of those require that you already know what IP space you are looking for.
    Fierce does not perform exploitation and does not scan the whole internet indiscriminately.
    It is meant specifically to locate likely targets both inside and outside a corporate
    network.


    Since it uses DNS primarily you will often find mis-configured networks that leak
    internal address space.


    USAGE fierce {target options} [OPTIONS]


    +   EXAMPLE fierce -dns company.com (Standard Fierce scan)

    EXAMPLE fierce -dns company.com -wide (Standard Fierce scan and search all class
    c ranges found for PTR names that match the domain)

    EXAMPLE fierce -dns company.com -only zt (Fierce scan that only checks for zone
    transfer)

    EXAMPLE fierce -dns company.com -ztstop (Fierce scan that does not perform bruteforcing
    if a zone transfer is found)

    EXAMPLE fierce -dns company.com --wildcstop (Fierce scan that does not perform
    bruteforcing if a wildcard is found)'
  merge: -1
