  md: 'DESCRIPTION ProxyStrike is an active Web Application Proxy. It''s a tool designed
    to find vulnerabilities while browsing an application. It was created because
    the problems we faced in the pentests of web applications that depends heavily
    on Javascript, not many web scanners did it good in this stage, so we came with
    this proxy.

    Right now it has available SQL injection and XSS plugins. Both plugins are designed
    to catch as many vulnerabilities as we can, it''s that the SQL Injection plugin
    is a Python port of the great DarkRaver "Sqllib"

    The process is very simple, ProxyStrike runs like a proxy listening in port 8008
    by default, so you have to browse the desired web site setting your browser to
    use ProxyStrike as a proxy, and ProxyStrike will analyze all the parameters in
    background mode. For the user it is a passive proxy because you won''t see any
    different in the behaviour of the application, but in the background is very active.


    More info: https://code.google.com/p/proxystrike


    USAGE n/a; GUI tool


    EXAMPLE n/a; GUI tool'
