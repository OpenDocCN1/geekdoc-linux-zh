  md: '# ssldump


    **DESCRIPTION Sldump** is an network protocol analyzer specially for SSLv3/TLS.
    The main purpose of this tool is to identify TCP connections on the selected network
    interface and interpret them as SSLv3/TLS traffic. It decodes SSLv3/TLS traffic
    records and uses text to display them. It can also decrypt and display the application
    data traffic in some situation. Unlike **tcpdump** this tool needs to see both
