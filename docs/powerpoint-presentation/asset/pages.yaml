  md: '# netsniff-ng


    **DESCRIPTION netsniff-ng** is a free, performant Linux networking toolkit. **netsniff-ng**
    is a high-performance network analyzer based on packet **mmap** mechanisms. It
    can record **pcap** files to disc, replay them and also do an offline and online
    analysis. Capturing, analysis or replay of raw 802.11 frames are supported as
    well. **pcap** files are also compatible with **tcpdump** or **Wireshark** traces.
