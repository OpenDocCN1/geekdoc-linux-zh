  md: '# tsk_compareddir


    **DESCRIPTION** tsk_compareddir compares the contents of image to the contents
    of comparison_directory. This can be useful for detecting rootkits and when testing.
    Rootkits can be detected by comparing the contents of a local directory and a
    local raw device. The rootkits typically don''t hide data when it is read directly
    from the raw device.


    **USAGE** tsk_compareddir [-vV] [-n start_inum] [-f ftype] [-i imgtype] [-b dev_sector_size]
    [- -o sector_offset] image [images] comparison_directory


    **OPTIONS** http://www.sleuthkit.org/sleuthkit/man/tsk_compareddir.html


