    **DESCRIPTION** sucrack is a multithreaded Linux/UNIX tool for brute-force cracking
    local user accounts via sua. This tool comes in handy as final instance on a system
    where you do not have to many privileges but you are in the wheel group. Many
    su implementations require a pseudo terminal to be attached in order to take the
