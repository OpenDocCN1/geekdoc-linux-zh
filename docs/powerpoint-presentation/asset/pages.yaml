  md: '# dnswalk


    **DESCRIPTION Dnswalk** is a DNS database debugger. It performs zone transfers
    of specified domains, and checks the database in numerous ways for internal consistency,
    as well as for correctness according to accepted practices with the Domain Name
    System.


    The domain name specified on the command line MUST end with a ''.''. You can specify
    a forward domain, such as **dnswalk** podunk.edu. or a reverse domain, such as
    **dnswalk** 3.2.1.in-addr.arpa.


    **USAGE** dnswalk [ -adilrfM ] <domain>.


    **EXAMPLE** dnswalk google.com'
