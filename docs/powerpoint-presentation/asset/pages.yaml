  md: '# # wifap


    **DESCRIPTION** Wifap is a proof of concept for communication over WiFi networks
    using traffic injection.

    **Wifap** allows direct communication with an associated station to a given access
    point directly, meaning: not being associated ourselves; not being handled by
    access point. More info:

    http://sid.rastack.org/static/articles/wi/f/Wifap_EN_9613.html


    **USAGE** wifap -b <BSSID> [-o <iface>] [-i <iface>] [-s <SMAC>] [-w <WEP key>]
    [-k <key id>] [-d [-v]] [-h]

    OPTIONS


    +   -b <BSSID> specify BSSID for injection

    -o <iface> specify interface for injection (default: ath0)

    -i <iface> specify interface for listening (default: ath0)

    -s <SMAC> specify source MAC address

    -w <key> WEP mode and key

    -k <key id> WEP key id (default: 0)

    -d activate debug

    -v verbose debugging

    -h this so helpful output


    **EXAMPLE** wifap.py -b 00:13:10:30:22:5C -i eth1 -p eth1'
