  md: '# sipp


    **DESCRIPTION** Sipp is a free tool and traffic generator for the SIP protocol.
    It uses XML format files to define test scenarios. It includes a few basic SipStone
    user agent scenarios (UAC and UAS) and establishes and releases multiple calls
    with the INVITE and BYE methods. More info: http://sipp.sourceforge.net/


    It can also read custom XML scenarios describing from simple to complex flows.
    It features the dynamic display of statistics about running tests (call rate,
    round trip delay, and message statistics), periodic CSV statistics dumps. TCP
    and UDP over multiple sockets or multiplexed with retransmission management and
    dynamically adjustable call rates. Other advanced features include support of
    IPv6, TLS, SCP, SIP authentication, conditional scenarios, UDP retransmissions,
    error robustness (call timeout, protocol defense), call specific variable, Posix
    regular expression to extract and re-inject any protocol fields, custom actions
    (log, system command exe, call stop) on message receive, field injection from
    external CSV file to emulate live users. **Sipp** can also send media (RTP) traffic
    through RTP echo and RTP/ replay. Media can be audio or video. While optimized
    for traffic, stress and performance testing. **Sipp** can be used to run one single
    call and exit, providing a passed/failed verdict.


    **USAGE** sipp remote_host:[remote_port]


    **OPTIONS** http://tomeko.net/other/sipp/sipp_cheatsheet.php?lang=pl


