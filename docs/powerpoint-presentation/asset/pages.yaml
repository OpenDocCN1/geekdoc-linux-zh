  md: '# socat


    **DESCRIPTION socat** is a relay for bidirectional data transfer between two independent
    data channels. Each of these data channels may be a file, pipe, device (serial
    line etc.), a pseudo terminal), a socket (UNIX, IP4, IP6 - raw, UDP, TCP), a proxy
    connection (file descriptor etc.), the GNU line editor (readline), a program,
    or a combination of these two. These modes include generation of "listening" sockets,
    named pipes, and pseudotinals. **socat** can be used, e.g., as TCP port forward
    (one-shot or daemon), as an external socksifier, for attacking weak firewalls,
    as a shell interface to UNIX sockets, IP relay, for redirecting TCP oriented programs
    to a serial line, to logically connect serial lines on different computers, or
    to establish a relatively secure environment (su and chroot) for running client
    or server scripts with network connections.


    More info: http://www.dest-unreach.org/socat/doc/README


