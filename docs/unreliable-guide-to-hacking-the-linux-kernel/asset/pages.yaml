  md: '# Chapter 11. Putting Your Stuff in the Kernel


    In order to get your stuff into shape for official inclusion, or even to make
    a neat patch, there''s your administrative work to be done:


    +   - Figure out whose you''ve been pissing in. Look at the top of the source
    files, inside the MAINTAINERS file, and last of all in the CREDITS file. You should
    coordinate with this person to make sure you''re not duplicating effort, or trying
    something that''s already been rejected.

    - Make sure you put your name and Email address at the top of any files you create
    or mangle significantly. This is the first place people will look when they find
    a bug, or when they want to make a change.

    - Usually you use a configuration option for your kernel hack. Edit Config.in
    in the appropriate directory (under arch/ it''s called config.in). The Config
    language is not bash, even though it looks like bash; the safe way is to use only
    the constructs that you already see in Config.in files (it''s good to run xconfig"
    at least once to test (because it''s the only one with a static parser).


    Variables which can be Y or N use followed by a tagline and config define name
    (which must start with CONFIG_). The tristate function is the same, but allows
    the answer M (which defines CONFIG_foo_MODULE in your source, instead of CONFIG_FOO)
    if CONFIG_MODULES is enabled.


    You may well to make your CONFIG option only visible if CONFIG_EXPERIMENTAL is
    enabled: this serves as a warning to users. Many other fancy things you can do:
    see the various Config.in files for ideas.


    +   - Edit the Makefile: the CONFIG variables are exported here so you can conditionalize
    compilation with ''ifeq''. If your file symbols then add the names to MX_OBJS
    instead of OX_OBJS of M_OBJS or O_OBJS, so that genymys'
