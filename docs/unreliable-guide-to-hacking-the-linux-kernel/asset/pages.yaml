- img_proc: true
  md: '# # Chapter 10. Routines and Conventions


    # ## 10.1. Double-linked lists include/linux/list.h


    There are three sets of linked-list routines in the kernel headers, but this one
    seems to be winning out (Linux has used it). If you don''t have some particular
    pressing need for a single list, it''s a good choice. In fact, I don''t care whether
    it''s a good choice or not, just use it so we can get rid of the others.


    # ## 10.2. Return Conventions


    For code called in user context, it''s very common to defy C convention, and return
    0 for success, and a negative error number (eg. -EFFAULT for failure. This can
    be unintuitive at first, but it''s fairly widespread in the networking code, for
    example. filesystem code uses ERR_PTR() include/linux/fs.h; to encode a negative
    error number into a pointer, and IS_ERR() and PTR_ERR() to get it back out again:
    avoids a separate pointer parameter for the error number. Icky, but in a good
    way.


    # ## 10.3. Breaking Compilation


    Linux and the other developers sometimes change function or structure names in
    development kernels; this is not done to keep everyone on their toes: it reflects
    a fundamental change (eg. can no longer be called with interrupts on, or does
    extra checks, or doesn''t do checks which were caught before). Usually this is
    accompanied by a fairly complete note to the linux-kernel mailing list; search
    the archive. Simply doing a global replace on the file usually makes things worse.'
