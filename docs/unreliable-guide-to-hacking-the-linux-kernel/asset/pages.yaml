  md: '# # Chapter 7. Wait Queues


    # ## include/linux/wait.h


    [SLEEPS]


    A queue is used to wait for someone to wake up when a certain condition true.
    They must be used carefully to ensure there is no race condition. You declare
    a wait_queue_head_t, and then processes which want to wait for that condition
    declare a wait_queue_t referring to themselves, and place that in the queue.


    # ## 7.1. Declaring


    You declare a wait_queue_head_t using the DECLARE_WAIT_QUEUE_HEAD() macro, or
    using the init_waitqueue_head() routine in your initialization code.


    # ## 7.2. Queuing


    Placing yourself in the waitqueue is fairly complex, because you must put yourself
    in the queue before checking the condition. There is a macro to do this: wait_event_interruptible()
    include/linux/sched.h The first argument is the wait queue head, and the second
    is an expression which is evaluated; the macro returns 0 when such is true, or
    -RESTARTSYS if a signal is received. The wait_event() version ignores signals.


    Do not use the sleep_on() function - it is very easy to accidentally introduce
    races; almost certainly one of the wait_event() family will do, or a loop around
    schedule_timeout(). If you choose to loop around schedule_timeout() remember you
    must set the task state (with set_current_state()) on each iteration to avoid
    busy-looping.'
  merge: -1
  pgno: 19
