  md: 'Chapter 10. Routines and Conventions


    +   - Arithmetic on void pointers

    - Non-Constant initializers (not outside arch/ and include/asm/)

    - Assembler Instructions Function names as strings (__FUNCTION__)

    - __builtin_constant_p()


    Be wary when using long in the kernel, the code gcc generates for it is horrible
    and worse: division and multiplication does not work on i386 because the GCC runtime
    functions for it are missing from the kernel environment.


    # 10.6. C++


    Using C++ in the kernel is usually a bad idea, because the kernel does not provide
    the necessary runtime environment and the include files are not tested for it.
    It is still possible, but not recommended. If you really want to do this, forget
    about exceptions at least.


    # 10.7. #if


    It is generally considered cleaner to use macros in header files (or at the top
    of .c files) to abstract away functions rather than using ‘#if’ pre-processor
    statements throughout the source code.'
