  md: '# 2.2. Hardware Interrupts (Hard IRQs)


    Timer ticks, network cards and keyboard are examples of real hardware which produce
    interrupts at any time. The kernel runs interrupt handlers, which services the
    hardware. The kernel guarantees that this handler is never re-entered: if another
    interrupt arrives, it is queued (or dropped). Because it disables interrupts,
    this handler has to be fast: frequently it simply acknowledges the interrupt,
    marks a ''software interrupt'' for execution and exits.


    You can tell you are in a hardware interrupt, because in_irq() returns true.


    > Caution

    Beware that if you have interrupts or bottom halves disabled (see below), in_interrupt()
    will return a false positive.


    > Caution

    Beware that this will return a false positive if interrupts are disabled (see
    below).


    # 2.3. Software Interrupt Context: Bottom Halves, Tasklets, softirqs


    Whenever a system call is about to return to userspace, or a hardware interrupt
    handler exits, any ''software interrupts'' which are marked pending (usually by
    hardware interrupts) are run (kernel/softirq).


    Much of the real interrupt handling work is done here. Early in the transition
    to SMP, there were only ''bottom halves'' (BHs), which didn''t take advantage
    of multiple CPUs.'
