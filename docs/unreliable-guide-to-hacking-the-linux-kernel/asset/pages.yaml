  md: "# 10.4. Initializing structure members\n\nThe preferred method of initializing\
    \ structures is to use the gcc Labeled Elements extension, eg:\n\n```\nstatic\
    \ struct block_device_operations opt_fops = {\n    open:               opt_open,\n\
    \    release:            opt_release,\n    ioctl:              opt_ioctl,\n  \
    \  check_media_change:  opt_media_change,\n};\n```\n\nThis makes it easy to grep\
    \ for, and makes it clear which structure fields are set. Should we do this because\
    \ it looks cool.\n\n# 10.5. GNU Extensions\n\nGNU Extensions are explicitly allowed\
    \ in the Linux kernel. Note that some of the more complex ones are not very well\
    \ supported, due to lack of general use, but the following are considered standard\
    \ (see the GCC info page section \"C Extensions\" for more details - Yes, really\
    \ the info page, the man page is only a short summary of the stuff in info:\n\n\
    +   * Inline functions\n* Statement expressions (ie. the ({ and }) constructs)\n\
    * Declaring attributes of a function / variable / type (__attribute_))\n* Labeled\
    \ elements\n* typedef\n* Zero length arrays\n* Macro varags"
