    \ and the kernel held, so it can sleep.\n\n## 6.11. module_exit() include/linux/init.h\n\
    \nThis macro defines the function to be called at module removal time (or never,\
    \ in the case of the file compiled into the kernel). It will only be called if\
    \ the module usage count has reached zero. This function can also sleep, but cannot\
    \ fail: everything must be cleaned up by the time it returns.\n\n## 6.12. MOD_INC_USE_COUNT/MOD_DEC_USE_COUNT\
    \ include/linux/module.h\n\nThese manipulate the module usage count, to protect\
    \ against removal (a module also can't be removed if another module uses one of\
    \ its exported symbols: see below). Every reference to the module from user context\
    \ should be reflected by this counter (e.g. for every data structure or socket)\
    \ before the function sleeps. To quote Tim Waugh:\n\n```c\n/* THIS IS BAD */\n\
    foo_open (...)\n{\n\tstuff.\n\tif (fail)\n\t\treturn -EBUSY;\n\tsleep.. (might\
    \ get unloaded here)\n\tstuff.\n\tMOD_INC_USE_COUNT;\n\n\treturn 0;\n}\n```\n\n\
    ```c\n/* THIS IS GOOD /\nfooo_open(...)\n{\n  MOD_INC_USE_COUNT;\n  stuff.\n \
    \ if (fail) {\n    MOD_DEC_USE_COUNT;\n    return -EBUSY;\n  }\n  sleep.. (safe\
    \ now)\n  stuff..\n  return 0;\n}\n```\n\nYou can often avoid having to deal with\
