    2.33 introduced softirqs, and re-implemented the (now deprecated) BHs underneath.
    Softirqs are fully-SMP versions of BHs: they can run on as many CPUs at once as
    required. This means they need to deal with races in shared data using their own
    locks. A bitmask is used to keep track of which are enabled, so the 32 available
    softirqs should not be used lightly. (Yes, people will notice).


