    If you are allocating at least PAGE_SIZE (include/asm/page.h) bytes, consider
    using get_free_pages() (include/linux/mm.h). It takes an order argument (0 for
    page size, 1 for double page, 2 for four pages etc.) and the same memory priority
    flag as as.


    If you are allocating more than a page worth of bytes you can use valloc(). It''ll
    allocate virtual memory in the kernel map. This block is not contiguous in physical
    memory, by the MMU makes it look like it is for you (so it''s only contiguous
    to the CPUs, not to external device drivers). If you really need large physically
    contiguous memory for some weird device, you have a problem: it is poorly supported
    in Linux because some time memory fragmentation in a running kernel it hard. The
    best way is to allocate the block early in the boot process via the alloc_bootmem().


    Before inventing your own of often-used objects using a slab cache in include/linux/slab.h


    # 6.4. current include/asm/current.h


    This global variable (really a macro) contains a pointer to the current task structure,
    so is only valid in user context. For example, when a process makes a system call,
    this will point to the task structure of the calling process. It is not NULL in
    interrupt context.'
- md: "\n## 6.5. udelay()/mdel() include/asm/delay.h\ninclude/linux/delay.h\n\nThe\
