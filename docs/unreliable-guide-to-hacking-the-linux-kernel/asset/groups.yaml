    \ Set this field as the macro THIS_MODULE.\n\nFor more complicated module unload\
    \ locking requirements, you can set the can_unload function pointer to your own\
    \ routine, which should return 0 if the module is unloadable, or -EBUSY otherwise."
  - '[PAGE 19]


    # # Chapter 7. Wait Queues


    # ## include/linux/wait.h


    [SLEEPS]


    A queue is used to wait for someone to wake up when a certain condition true.
    They must be used carefully to ensure there is no race condition. You declare
    a wait_queue_head_t, and then processes which want to wait for that condition
    declare a wait_queue_t referring to themselves, and place that in the queue.


    # ## 7.1. Declaring


    You declare a wait_queue_head_t using the DECLARE_WAIT_QUEUE_HEAD() macro, or
    using the init_waitqueue_head() routine in your initialization code.


    # ## 7.2. Queuing


    Placing yourself in the waitqueue is fairly complex, because you must put yourself
    in the queue before checking the condition. There is a macro to do this: wait_event_interruptible()
    include/linux/sched.h The first argument is the wait queue head, and the second
    is an expression which is evaluated; the macro returns 0 when such is true, or
    -RESTARTSYS if a signal is received. The wait_event() version ignores signals.


    Do not use the sleep_on() function - it is very easy to accidentally introduce
    races; almost certainly one of the wait_event() family will do, or a loop around
    schedule_timeout(). If you choose to loop around schedule_timeout() remember you
    must set the task state (with set_current_state()) on each iteration to avoid
    busy-looping.'
  - '[PAGE 20]


    # 7.3. Waking Up Queued Tasks


    Call `wake_up()` include/linux/sched.h;, which will wake up every process in the
    queue. The exception is if one has `TASK_EXCLUSIVE` set, in which case the remainder
    of the queue will not be woken.'
  - '[PAGE 21]


    # Chapter 8. Atomic Operations


    Certain operations are guaranteed atomic on all platforms. The first class of
    operations work on atomic_t include/asm/atomic.h; this contains a signed integer
    (at least 24 bits long), and you must use these functions to manipulate or read
    atomic_t variables. atomic_read() and atomic_set() get and set the counter, atomic_add(),
    atomic_sub(), atomic_inc(), atomic_dec(), and atomic_dec_and_test() (returns true
    if it was decremented to zero).


    Yes. It returns true (i. != 0) if the atomic variable is zero.


    Note that these functions are slower than normal arithmetic, and should not be
    used unnecessarily. On some platforms they are much slower, like 32-bit Sparc
    they use a spinlock.


    The second class of atomic operations is atomic bit operations on a long, defined
    in include/asm/bitops.h. These operations generally take a pointer to the bit
    pattern, and a bit number: 0 is the least significant bit. set_bit(), clear_bit()
    and change_bit() set, clear, and flip the given bit. test_and_set_bit(), test_and_clear_bit()
    and test_and_change_bit() do the same thing, except return true if the bit was
    previously set; these are particularly useful for very simple locking.


    It is possible to call these operations with bits greater than BITS_PER_LONG.
    The resulting behavior is strange on big-endian platforms though so it is a good
    idea not to do this.


    Note that the order of bits depends on the architecture, and in particular, the
    bitfield passed to these operations must be at least as large as a long.'
  - '[PAGE 22]


    # # Chapter 9. Symbols


    Within the kernel proper, the normal linking rules apply (ie. unless a symbol
    is declared to be file scope with the static keyword, it can be used anywhere
    in the kernel). However, for modules, a special exported symbol table is kept
    which limits the entry points to the kernel proper. Modules can also export symbols.


    # ## 9.1. EXPORT_SYMBOL() include/linux/module.h


    This is the classic method of exporting a symbol, and it works for both modules
    and non-modules. In the kernel all these declarations are often bundled into a
    single file to help gensyms (which searches source files for these declarations).
    See the comment on gensyms and Makefiles below.


    # ## 9.2. EXPORT_SYMTAB


    For convenience, a module usually exports all non-file-scope symbols (ie. all
    those not declared static). If this is defined before `include/linux/module.h`
    is included, then only symbols explicit exported with `EXPORT_SYMBOL()` will be
    exported.'
- md: "\n# Chapter 10. Routines and Conventions\n\n## 10.1. Double-linked lists include/linux/list.h\n\
    \nThere are three sets of linked-list routines in the kernel headers, but this\
    \ one seems to be winning out (Linux has used it). If you don't have some particular\
    \ pressing need for a single list, it's a good choice. In fact, I don't care whether\
    \ it's a good choice or not, just use it so we can get rid of the others.\n\n\
    ## 10.2. Return Conventions\n\nFor code called in user context, it's very common\
    \ to defy C convention, and return 0 for success, and a negative error number\
    \ (eg. -EFFAULT for failure). This can be unintuitive at first, but it's fairly\
    \ widespread in the networking code, for example. filesystem code uses ERR_PTR()\
    \ include/linux/fs.h; to encode a negative error number into a pointer, and IS_ERR()\
    \ and PTR_ERR() to get it back out again: avoids a separate pointer parameter\
    \ for the error number. Icky, but in a good way.\n\n## 10.3. Breaking Compilation\n\
    \nLinux and the other developers sometimes change function or structure names\
    \ in development kernels; this is not done to keep everyone on their toes: it\
    \ reflects a fundamental change (eg. can no longer be called with interrupts on,\
    \ or does extra checks, or doesn't do checks which were caught before). Usually\
    \ this is accompanied by a fairly complete note to the linux-kernel mailing list;\
    \ search the archive. Simply doing a global replace on the file usually makes\
    \ things worse.\n\n## 10.4. Initializing structure members\n\nThe preferred method\
    \ of initializing structures is to use the gcc Labeled Elements extension, eg:\n\
    \n```c\nstatic struct block_device_operations opt_fops = {\n    open:        \
    \       opt_open,\n    release:            opt_release,\n    ioctl:          \
    \    opt_ioctl,\n    check_media_change:  opt_media_change,\n};\n```\n\nThis makes\
    \ it easy to grep for, and makes it clear which structure fields are set. Should\
    \ we do this because it looks cool?\n\n## 10.5. GNU Extensions\n\nGNU Extensions\
    \ are explicitly allowed in the Linux kernel. Note that some of the more complex\
    \ ones are not very well supported, due to lack of general use, but the following\
    \ are considered standard (see the GCC info page section \"C Extensions\" for\
    \ more details - Yes, really, the info page, the man page is only a short summary\
    \ of the stuff in info:\n\n- Inline functions\n- Statement expressions (ie. the\
    \ ({ and }) constructs)\n- Declaring attributes of a function / variable / type\
    \ (__attribute_))\n- Labeled elements\n- typedef\n- Zero length arrays\n- Macro\
    \ varags\n- Arithmetic on void pointers\n- Non-Constant initializers (not outside\
    \ arch/ and include/asm/)\n- Assembler Instructions Function names as strings\
    \ (__FUNCTION__)\n- __builtin_constant_p()\n\nBe wary when using long in the kernel,\
    \ the code gcc generates for it is horrible and worse: division and multiplication\
    \ does not work on i386 because the GCC runtime functions for it are missing from\
    \ the kernel environment.\n\n## 10.6. C++\n\nUsing C++ in the kernel is usually\
    \ a bad idea, because the kernel does not provide the necessary runtime environment\
    \ and the include files are not tested for it. It is still possible, but not recommended.\
    \ If you really want to do this, forget about exceptions at least.\n\n## 10.7.\
    \ #if\n\nIt is generally considered cleaner to use macros in header files (or\
    \ at the top of .c files) to abstract away functions rather than using ‘#if’ pre-processor\
    \ statements throughout the source code.\n\n# Chapter 11. Putting Your Stuff in\
    \ the Kernel\n\nIn order to get your stuff into shape for official inclusion,\
    \ or even to make a neat patch, there's your administrative work to be done:\n\
    \n- Figure out whose you've been pissing in. Look at the top of the source files,\
    \ inside the MAINTAINERS file, and last of all in the CREDITS file. You should\
    \ coordinate with this person to make sure you're not duplicating effort, or trying\
    \ something that's already been rejected.\n- Make sure you put your name and Email\
    \ address at the top of any files you create or mangle significantly. This is\
    \ the first place people will look when they find a bug, or when they want to\
    \ make a change.\n- Usually you use a configuration option for your kernel hack.\
    \ Edit Config.in in the appropriate directory (under arch/ it's called config.in).\
    \ The Config language is not bash, even though it looks like bash; the safe way\
    \ is to use only the constructs that you already see in Config.in files (it's\
    \ good to run \"xconfig\" at least once to test (because it's the only one with\
    \ a static parser)).\n\nVariables which can be Y or N use followed by a tagline\
    \ and config define name (which must start with CONFIG_). The tristate function\
    \ is the same, but allows the answer M (which defines CONFIG_foo_MODULE in your\
    \ source, instead of CONFIG_FOO) if CONFIG_MODULES is enabled.\n\nYou may well\
    \ to make your CONFIG option only visible if CONFIG_EXPERIMENTAL is enabled: this\
    \ serves as a warning to users. Many other fancy things you can do: see the various\
    \ Config.in files for ideas.\n\n- Edit the Makefile: the CONFIG variables are\
    \ exported here so you can conditionalize compilation with 'ifeq'. If your file\
    \ symbols then add the names to MX_OBJS instead of OX_OBJS of M_OBJS or O_OBJS,\
    \ so that genmake will find them.\n- Document your option in Documentation/Configure.help.\
    \ Mention incompatibilities and issues here. Definitely end your description with\
    \ “if in doubt, say N ” (or, occasionally, ‘Y'); this is for people who have no\
    \ idea what you are talking about.\n- Put yourself in CREDITS if you've done something\
    \ noteworthy, usually beyond a single file (your name should be at the top of\
    \ the source files anyway). MAINTAINERS means you want to be consulted when changes\
    \ are made to a subsystem, and hear about bugs; it implies a more-than-passing\
    \ commitment to some part of the code.\n- Finally, don't forget to read Documentation/SubmittingPatches\
    \ and possibly Documentation/SubmittingDrivers.\n\n# Chapter 12. Kernel Cantrips\n\
    \nSome favorites from browsing the source. Feel free to add to this list.\n\n\
    ```c\ninclude/linux/brlock.h:\n\nextern inline void br_read_lock (enum brlock_indices\
    \ idx)\n{\n    /*\n     * This causes a link-time bug message if\n     * invalid\
