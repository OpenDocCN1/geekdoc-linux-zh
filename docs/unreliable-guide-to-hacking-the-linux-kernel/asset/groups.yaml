    # Chapter 7. Wait Queues\n\n## ## include/linux/wait.h\n\n[SLEEPS]\n\nA queue\
    \ is used to wait for someone to wake up when a certain condition true. They must\
    \ be used carefully to ensure there is no race condition. You declare a wait_queue_head_t,\
    \ and then processes which want to wait for that condition declare a wait_queue_t\
    \ referring to themselves, and place that in the queue.\n\n## 7.1. Declaring\n\
    \nYou declare a wait_queue_head_t using the DECLARE_WAIT_QUEUE_HEAD() macro, or\
    \ using the init_waitqueue_head() routine in your initialization code.\n\n## 7.2.\
    \ Queuing\n\nPlacing yourself in the waitqueue is fairly complex, because you\
    \ must put yourself in the queue before checking the condition. There is a macro\
    \ to do this: wait_event_interruptible() include/linux/sched.h. The first argument\
    \ is the wait queue head, and the second is an expression which is evaluated;\
    \ the macro returns 0 when such is true, or -RESTARTSYS if a signal is received.\
    \ The wait_event() version ignores signals.\n\nDo not use the sleep_on() function\
    \ - it is very easy to accidentally introduce races; almost certainly one of the\
    \ wait_event() family will do, or a loop around schedule_timeout(). If you choose\
    \ to loop around schedule_timeout() remember you must set the task state (with\
    \ set_current_state()) on each iteration to avoid busy-looping.\n\n## 7.3. Waking\
    \ Up Queued Tasks\n\nCall `wake_up()` include/linux/sched.h;, which will wake\
    \ up every process in the queue. The exception is if one has `TASK_EXCLUSIVE`\
    \ set, in which case the remainder of the queue will not be woken.\n\n# Chapter\
    \ 8. Atomic Operations\n\nCertain operations are guaranteed atomic on all platforms.\
    \ The first class of operations work on atomic_t include/asm/atomic.h; this contains\
    \ a signed integer (at least 24 bits long), and you must use these functions to\
    \ manipulate or read atomic_t variables. atomic_read() and atomic_set() get and\
    \ set the counter, atomic_add(), atomic_sub(), atomic_inc(), atomic_dec(), and\
    \ atomic_dec_and_test() (returns true if it was decremented to zero).\n\nYes.\
    \ It returns true (i != 0) if the atomic variable is zero.\n\nNote that these\
    \ functions are slower than normal arithmetic, and should not be used unnecessarily.\
    \ On some platforms they are much slower, like 32-bit Sparc they use a spinlock.\n\
    \nThe second class of atomic operations is atomic bit operations on a long, defined\
    \ in include/asm/bitops.h. These operations generally take a pointer to the bit\
    \ pattern, and a bit number: 0 is the least significant bit. set_bit(), clear_bit()\
    \ and change_bit() set, clear, and flip the given bit. test_and_set_bit(), test_and_clear_bit()\
    \ and test_and_change_bit() do the same thing, except return true if the bit was\
    \ previously set; these are particularly useful for very simple locking.\n\nIt\
    \ is possible to call these operations with bits greater than BITS_PER_LONG. The\
    \ resulting behavior is strange on big-endian platforms though so it is a good\
    \ idea not to do this.\n\nNote that the order of bits depends on the architecture,\
    \ and in particular, the bitfield passed to these operations must be at least\
    \ as large as a long.\n\n# Chapter 9. Symbols\n\nWithin the kernel proper, the\
    \ normal linking rules apply (ie. unless a symbol is declared to be file scope\
    \ with the static keyword, it can be used anywhere in the kernel). However, for\
    \ modules, a special exported symbol table is kept which limits the entry points\
    \ to the kernel proper. Modules can also export symbols.\n\n## 9.1. EXPORT_SYMBOL()\
    \ include/linux/module.h\n\nThis is the classic method of exporting a symbol,\
    \ and it works for both modules and non-modules. In the kernel all these declarations\
    \ are often bundled into a single file to help gensyms (which searches source\
    \ files for these declarations). See the comment on gensyms and Makefiles below.\n\
    \n## 9.2. EXPORT_SYMTAB\n\nFor convenience, a module usually exports all non-file-scope\
    \ symbols (ie. all those not declared static). If this is defined before `include/linux/module.h`\
    \ is included, then only symbols explicit exported with `EXPORT_SYMBOL()` will\
    \ be exported.\n"
  mdcn: "\n\n## 6.5. udelay()/mdel() include/asm/delay.h\ninclude/linux/delay.h\n\n\
    `udelay()` 函数用于短时间暂停。不要对 `mdel()` 使用大值，否则会有溢出风险——在这里辅助函数 `mdel()` 很有用，甚至可以考虑 `schedule_timeout()`。\n\
    \n## 6.6. local_irq_save()/local_irq_restore()\ninclude/asm/system.h\n\n这些例程在本地\
    \ CPU 上禁用硬中断并恢复它们。它们是重入的；通过其唯一的 `unsigned long` 类型的标志参数保存之前的状态。如果你知道中断已开启，可以简单使用\
    \ `local_irq_disable()` 和 `local_irq_enable()`。\n\n## 6.7. local_bh_disable()/local_bh_enable()\n\
    include/asm/softirq\n\n这些例程在本地 CPU 上禁用软中断并恢复它们。它们是重入的；如果之前禁用了软中断，那么在调用这一对函数后它们仍然将处于禁用状态。它们防止软软中断、tasklets\
    \ 和下半部（bottom halves）在当前 CPU 上运行。\n\n## 6.8. smp_processor_id()/cpu_[number/logical]_map()\n\
    include/asm/smp.h\n\n`smp_processor_id()` 返回当前的处理器编号，介于 0 到 `NR_CPUS`（Linux 支持的最大\
    \ CPU 数量，为 32）。这些值并不一定连续的：要获取于 0 到 `smp_num_cpus()`（该机器上实际处理器的数量）之间的数字，使用 `cpu_number_map()`\
    \ 函数将处理器 ID 映射到逻辑数字。`cpu_logical_map()` 执行相反操作。\n\n## 6.9. __init__/exit/__initdata\n\
    include/linux/init.h\n\n启动后，内核会释放一个特殊区域；标记为 `__init__` 的函数和标记为 `__initdata` 的数据结构在启动完成后会被丢弃（在模块内部，该指令目前被忽略）。`__exit`\
    \ 用于声明一个仅在退出时需要的函数：如果此文件没有被编译为模块，则该函数会被丢弃。用法请参见头文件。注意，将标记为 `__init__` 的函数通过 `EXPORT_SYMBOL()`\
    \ 导出到模块是没有意义的——这会破坏程序。\n\n标记为 `__initdata` 的静态数据结构必须初始化（与在 BSS 段中清零普通静态数据相反）。\n\
    \n## 6.10. __initcall()/module_init\ninclude/linux/init.h\n\n内核许多部分作为模块（内核的动态加载部分）运行得很好。使用\
    \ `module_init()` 和 `module_exit()` 宏，可以很容易编写不带 `#ifdef` 的代码，这些代码可以作为模块运行，也可以编译到内核中。\n\
    \n`module_init()` 宏定义了在模块插入时（如果文件被编译为模块）或在启动时调用的函数：如果文件没有被编译为模块，`module_init()`\
    \ 宏等同于 `__initcall()`，后者通过链接器的“魔法”确保函数在启动时被调用。\n\n该函数可以返回一个负错误以导致模块加载失败（遗憾的是，如果模块被编译进内核，则没有影响）。对于模块来说，这在用户上下文中使用的，此时中断已开启且持有了内核，因此它可以睡眠。\n\
    \n## 6.11. module_exit() include/linux/init.h\n\n此宏定义了在模块移除时调用的函数（如果文件被编译进内核，则永远不会调用）。只有当模块的使用计数达到零时，才会被调用。此函数也可以睡眠，但不能失败：在返回之前，一切都必须清理完毕。\n\
    \n## 6.12. MOD_INC_USE_COUNT/MOD_DEC_USE_COUNT include/linux/module.h\n\n这些操作处理模块的使用计数，以防止移除（如果另一个模块使用了它导出的符号，该模块也无法被移除：见下文）。用户上下文对模块的每次引用都应该在函数睡眠之前反映在该计数器中（例如对于每个数据结构或套字）。引用\
    \ Tim Waugh 的：\n\n```c\n/* 这是糟糕的做法 */\nfoo_open (...)\n{\n\tstuff.\n\tif (fail)\n\
    \t\treturn -EBUSY;\n\tsleep.. (可能在此处被卸载)\n\tstuff.\n\tMOD_INC_USE_COUNT;\n\n\t\
    return 0;\n}\n```\n\n```c\n/* 这是良好的做法 /\nfooo_open(...)\n{\n  MOD_INC_USE_COUNT;\n\
    \  stuff.\n  if (fail) {\n    MOD_DEC_USE_COUNT;\n    return -EBUSY;\n  }\n  sleep..\
    \ (现在安全了)\n  stuff..\n  return 0;\n}\n```\n\n你通常可以通过使用 `file_operations` 结构体的\
    \ `owner` 字段来避免处理这些问题。将此字段置为宏 `THIS_MODULE`。\n\n对于更复杂的模块卸载锁需求，你可以将 `can_unload`\
    \ 函数指针设置为你自己的例程，如果模块可以卸载，则返回 0，否则返回 `-EBUSY`。\n\n# 第 7 章 等待队列\n\n## ## include/linux/wait.h\n\
    \n[睡眠]\n\n队列用于等待当某个条件为真时有人唤醒。必须小心地使用它们以确保没有竞态条件。你声明一个 `wait_queue_head_t`，然后想要等待该条件的进程声明一个指向自己的\
    \ `wait_queue_t`，并将其放入队列。\n\n## 7.1. 声明\n\n你使用 `DECLARE_WAIT_QUEUE_HEAD()` 宏，或者在初始化代码中使用\
    \ `init_waitqueue_head()` 例程来声明 `wait_queue_head_t`。\n\n## 7.2. 入队\n\n将自己放入等待队列相当复杂，因为你必须在检查条件之前把自己放入队列。有一个宏可以做到：`wait_event_interruptible()\
    \ include/linux/sched.h`。第一个参数是等待队列头，第二个参数是要求值的表达式；当表达式为真时宏返回 0，如果接收到信号则返回 `-RESTARTSYS`。`wait_event()`\
    \ 版本忽略信号。\n\n不要使用 `sleep_on()` 函数——很容易意外引入竞态；几乎确定可以使用 `wait_event()` 系列中的某一个，或者围绕\
    \ `schedule_timeout()` 使用循环。如果你选择围绕 `schedule_timeout()` 使用循环，记住你必须在每次迭代中设置任务状态（使用\
    \ `set_current_state()`）以避免忙轮。\n\n## 7.3. 唤醒队列中的任务\n\n调用 `wake_up() include/linux/sched.h`，它将唤醒队列中的每个进程。异常是如果设置了\
    \ `TASK_EXCLUSIVE`，在这种情况下队列的剩余部分不会被唤醒。\n\n# 第 8 章 原子操作\n\n某些操作在所有平台上都保证原子性。第一类操作作用于\
    \ `atomic_t include/asm/atomic.h`；它包含一个带符号整数（至少 24 位），你必须使用这些函数来操作或读取 `atomic_t`\
    \ 变量。`atomic_read()` 和 `atomic_set()` 获取和设置计数器，`atomic_add()`、`atomic_sub()`、`atomic_inc()`、`atomic_dec()`\
    \ 以及 `atomic_dec_and_test()`（减到零时返回真）。\n\n是的。如果原子变量为零，它返回真（i != 0）。\n\n注意这些函数比普通算术慢，不应不必要使用。在某些平台上它们慢得多，例如\
    \ 32 位的 Sparc 上使用自旋锁。\n\n第二类原子操作是对 `long` 的原子操作，定义在 `include/asm/bitops.h` 中。这些操作通常接受位模式的指针和一个位索引：0\
    \ 是最低位。`set_bit()`、`clear_bit()` 和 `change_bit()` 分别设置、清除和翻转给定的位。`test_and_set_bit()`、`test_and_clear_bit()`\
    \ 和 `test_and_change_bit()` 执行相同的操作，只是如果位之前被设置过则返回真；这些对于简单的锁非常有用。\n\n可以使用大于 `BITS_PER_LONG`\
    \ 的位调用这些操作。但在大端序平台上，结果行为很奇怪，因此最好不要这样做。\n\n注意位顺序取决于架构，特别是传递给这些操作的位域必须至少与 `long`\
    \ 一大。\n\n# 第 9 章 符号\n\n在内核内部，适用标准的链接规则（即：除非符号使用 `static` 关键字声明为文件作用域，否则可以在内核任何地方使用）。然而，对于模块，有一个特殊的导出符号表限制了进入内核的入口点。模块也可以导出符号。\n\
    \n## 9.1. EXPORT_SYMBOL() include/linux/module.h\n\n这是导出符号的经典方法，适用于模块和非模块。在内核中，所有这些声明通常封装在一个文件中以帮助\
    \ `gensyms`（它搜索源文件的这些声明）。见下文关于 `gensyms` 和 Makefile 的注释。\n\n## 9.2. EXPORT_SYMTAB\n\
    \n为了方便，模块通常导出所有非文件作用域的符号（即所有未声明为 `static` 的符号）。如果在包含 `include/linux/module.h`\
    \ 之前定义此宏，则只有显式通过 `EXPORT_SYMBOL()` 导出的符号会被导出。\n\n"
