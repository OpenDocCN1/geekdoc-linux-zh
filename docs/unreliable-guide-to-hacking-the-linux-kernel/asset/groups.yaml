    \n## Chapter 1. Introduction\n\nWelcome, gentle reader, to Rusty’s Unreliable\
    \ Guide to Linux Kernel Hacking. This document describes the common routines and\
    \ general requirements for kernel code: its goal is to serve as a primer for Linux\
    \ kernel development for experienced C programmers. I avoid implementation details:\
    \ that’s what the code is for, and I ignore whole tracts of useful routines.\n\
    \nBefore you read this, please understand that I never wanted to write this document,\
    \ being grossly under-qualified, but I always wanted to read it, and this was\
    \ the only way. I hope it will grow into a compendium of best practice, common\
    \ starting points and random information.\n\n## Chapter 2. The Players\n\nAt any\
    \ time each of the CPUs in a system can be:\n\n- not associated with any process,\
    \ serving a hardware interrupt;\n- not associated with any process, serving a\
    \ softirq, tasklet or bh;\n- running in kernel space, associated with a process;\n\
    - running a process in user space.\n\nThere is a strict ordering between these:\
    \ other than the last category (userspace) each can only be pre-empted by those\
    \ above. For example, while a softirq is running on a CPU, no other softirq will\
    \ pre-empt it, but a hardware interrupt can. However, any other CPUs in the system\
    \ execute independently.\n\nWe'll see a number of ways that the user context can\
    \ block interrupts, to become truly non-preemptable.\n\n### 2.1. User Context\n\
    \nUser context is when you are coming in from a system call or other trap: you\
    \ can sleep, and you own the CPU (except for interrupts) until you call schedule().\
    \ In other words, user context (unlike userspace) is not pre-emptable.\n\n> Note:\
    \ You are always in user context on module load and unload, and on operations\
    \ on the block device layer.\n\nIn user context\n\n### 2.2. Hardware Interrupts\
    \ (Hard IRQs)\n\nTimer ticks, network cards and keyboard are examples of real\
    \ hardware which produce interrupts at any time. The kernel runs interrupt handlers,\
    \ which services the hardware. The kernel guarantees that this handler is never\
    \ re-entered: if another interrupt arrives, it is queued (or dropped). Because\
    \ it disables interrupts, this handler has to be fast: frequently it simply acknowledges\
    \ the interrupt, marks a 'software interrupt' for execution and exits.\n\nYou\
    \ can tell you are in a hardware interrupt, because in_irq() returns true.\n\n\
    > Caution\n> Beware that if you have interrupts or bottom halves disabled (see\
    \ below), in_interrupt() will return a false positive.\n\n> Caution\n> Beware\
    \ that this will return a false positive if interrupts are disabled (see below).\n\
    \n### 2.3. Software Interrupt Context: Bottom Halves, Tasklets, softirqs\n\nWhenever\
    \ a system call is about to return to userspace, or a hardware interrupt handler\
    \ exits, any 'software interrupts' which are marked pending (usually by hardware\
    \ interrupts) are run (kernel/softirq).\n\nMuch of the real interrupt handling\
    \ work is done here. Early in the transition to SMP, there were only 'bottom halves'\
    \ (BHs), which didn't take advantage of multiple CPUs.\n"
