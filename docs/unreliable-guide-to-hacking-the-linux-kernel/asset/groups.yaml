    \ mdelay() as you risk overflow - the helper function mdelay() is useful here,\
    \ or even consider schedule_timeout().\n\n## 6.6. local_irq_save()/local_irq_restore()\n\
    include/asm/system.h\n\nThese routines disable hard interrupts on the local CPU,\
    \ and restore them. They are reentrant; saving the previous state in their one\
    \ unsigned long flags argument. If you know interrupts are enabled, you can simply\
    \ use local_irq_disable() and local_irq_enable().\n\n## 6.7. local_bh_disable()/local_bh_enable()\n\
    include/asm/softirq\n\nThese routines disable soft interrupts on the local CPU,\
    \ and restore them. They are reentrant; if soft interrupts were disabled before,\
    \ they will still be disabled after this pair of functions has been called. They\
    \ prevent softirqs, tasklets and bottom halves from running on the current CPU.\n\
    \n## 6.8. smp_processor_id()/cpu_[number/logical]_map()\ninclude/asm/smp.h\n\n\
    smp_processor_id() returns the current processor number, between 0 and NR_CPUS\
    \ (the maximum number of CPUs supported by Linux, 32). These values are not necessarily\
    \ continuous: to get a number between 0 and smp_num_cpus() (the number of actual\
    \ processors in this machine), the cpu_number_map() function is used to map the\
    \ processor id to a logical number. cpu_logical_map() does the reverse.\n\n##\
    \ 6.9. __init__/exit/__initdata\ninclude/linux/init.h\n\nAfter boot, the kernel\
    \ frees up a special section; functions marked with __init__ and data structures\
    \ marked with __initdata are dropped after boot is complete (within modules this\
    \ directive is currently ignored). __exit is used to declare a function which\
    \ is only required on exit: the function will be dropped if this file is not compiled\
    \ as a module. See the header file for use. Note that it makes no sense for a\
    \ function marked with __init to be exported to modules with EXPORT_SYMBOL() -\
    \ this will break.\n\nStatic data structures marked with __initdata must be initialised\
    \ (as opposed to ordinary static data which is zeroed BSS).\n\n## 6.10. __initcall()/module_init\n\
    include/linux/init.h\n\nMany parts of the kernel are well served as a module (dynamically-loadable\
    \ parts of the kernel). Using the module_init() and module_exit() macros it is\
    \ easy to write code without #ifdef which can operate as a module or built into\
    \ the kernel.\n\nThe module_init() macro defines which function is to be called\
    \ at module insertion time (if the file is compiled as a module), or at boot time:\
    \ if the file is not compiled as a module the module_init() macro becomes equivalent\
    \ to __initcall(), which through linker magic ensures that the function is called\
    \ on boot.\n\nThe function can return a negative error to cause module loading\
    \ to fail (unfortunately, this has no effect if the module is compiled into the\
