    # 2.2. Hardware Interrupts (Hard IRQs)


    Timer ticks, network cards and keyboard are examples of real hardware which produce
    interrupts at any time. The kernel runs interrupt handlers, which services the
    hardware. The kernel guarantees that this handler is never re-entered: if another
    interrupt arrives, it is queued (or dropped). Because it disables interrupts,
    this handler has to be fast: frequently it simply acknowledges the interrupt,
    marks a ''software interrupt'' for execution and exits.


    You can tell you are in a hardware interrupt, because in_irq() returns true.


    > Caution

    Beware that if you have interrupts or bottom halves disabled (see below), in_interrupt()
    will return a false positive.


    > Caution

    Beware that this will return a false positive if interrupts are disabled (see
    below).


    # 2.3. Software Interrupt Context: Bottom Halves, Tasklets, softirqs


    Whenever a system call is about to return to userspace, or a hardware interrupt
    handler exits, any ''software interrupts'' which are marked pending (usually by
    hardware interrupts) are run (kernel/softirq).


    Much of the real interrupt handling work is done here. Early in the transition
    to SMP, there were only ''bottom halves'' (BHs), which didn''t take advantage
    of multiple CPUs.'
- md: "\nShortly after we switched from wind-up computers made of match-sticks and\
    \ knot, we abandoned this limitation.\n\n```\ninclude/linux/interrupt.h lists\
    \ the different BHs. No matter how many CPUs you have, no two BHs will run at\
    \ the same time. This made the transition to SMP simpler, but bucks such hard\
    \ for scalable performance. A very important bottom half is the timer BH (include/linux/timer.h);\
    \ you can register to have all functions for you in a given length of time.\n\
    ```\n\n2.33 introduced softirqs, and re-implemented the (now deprecated) BHs underneath.\
    \ Softirqs are fully-SMP versions of BHs: they can run on as many CPUs at once\
    \ as required. This means they need to deal with races in shared data using their\
    \ own locks. A bitmask is used to keep track of which are enabled, so the 32 available\
    \ softirqs should not be used lightly. (Yes, people will notice).\n\ntasklets\
    \ (include/linux/interrupt.h) are like softirqs, except they are dynamically-allocable\
    \ (meaning you can have as many as you want), and they also guarantee that any\
    \ tasklet will only run on one CPU at any time, although different tasklets can\
    \ run simultaneously (unlike different BHs).\n\n# Caution\n\n| The name 'tasklet'\
    \ is misleading: they have nothing to do with 'tasks', and probably more to do\
    \ with some bad vodka Alexey Kuznetsov had at the time |\n\nYou can tell you you\
    \ are in a softirq (or bottom half, or tasklet) using the in_softirq() macro (include/asm/softirq.h).\n\
    \n# Caution\n\n| Beware that this will return a false positive if a bh lock (see\
    \ below) is held. |\n\n## # Chapter 3. Some Basic Rules\n\n### No memory protection\n\
    \nIf you corrupt memory, whether in user context or interrupt context, the whole\
    \ machine will crash. Are you sure you can't do what you want in userspace?\n\n\
    ### No floating point or MMX\n\nThe FPU context is not saved; even in user context\
    \ the FPU state probably won't correspond with the current process: you would\
    \ mess with some user process' F FPU state. If you really want to do this, you\
    \ would have to explicitly save/restore the full FPU state (avoid context switches).\
    \ It is generally a bad idea; use fixed point arithmetic first.\n\n### A rigid\
    \ stack limit\n\nThe kernel stack is about 6K in 2.2 (for most architectures:\
    \ it's about 14K on the Alpha), and shared with interrupts so you can't use it\
    \ all. Avoid deep recursion and huge local arrays on the stack (allocate them\
    \ dynamically instead).\n\n### The Linux kernel is portable\n\nLet's keep it that\
    \ way. Your code should be 64-bit clean, and endian-independent. You should also\
    \ minimize CPU specific stuff, e.g. inline assembly should be cleanly encapsulated\
    \ and minimized to ease porting. Generally it should be restricted to the architecture-dependent\
    \ part of the kernel tree.\n\n## Chapter 4. ioctls: Not writing a new system call\n\
    \nA system call generally looks like this\n\n```\nasmlinkage int sys_mycall(int\
    \ arg)\n{\n    return 0;\n}\n```\n\nFirst, in most cases you don't want to create\
    \ a new system call. You can create a character device and implement an appropriate\
    \ ioctl for it. This is much more flexible than a system call, which doesn't have\
    \ to be entered in every architecture's include/asm/unistd.h and arch/kernel/entry.S\
