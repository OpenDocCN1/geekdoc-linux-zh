    \ I am going to kick the liv-\ning shit\n  * out of you, game over, lights out.\n\
    \  */\n```\n\n# Chapter 13. Thanks\n\nThanks to Andi Kleen for the idea, answering\
    \ my questions, fixing my mistakes, filling content, etc. Philipp Rumpf for more\
    \ spelling and clarity fixes, and some excellent non-obvious points. Werner Almesberger\
    \ for giving me a great summary of `disable_irq()`, and Jes Sorensen and Andrea\
    \ Arcangeli added caveats. Michael Elizabeth Chastain for checking and adding\
    \ to the Configure section. Telsa Gwyne for teaching me DocBook.\n"
  mdcn: "\n\n# 第 10 章. 例程与约定\n\n## 10.1. 双向链表 include/linux/list.h\n\n内核头文件中有三组链表例程，但这一组似乎占了优势（Linux\
    \ 一直在使用它）。如果你对单向链表没有特定的迫切需求，这是一个很好的选择。事实上，我不在乎它是否是一个好选择，直接用它就好，这样我们就可以删掉其他的。\n\
    \n## 10.2. 返回约定\n\n对于在用户上下文中调用的代码，违反 C 语言惯例是非常常见的：返回 0 表示成功，返回一个负错误码（例如失败时返回 `-EFFAULT`）。这在初看起来可能不符合直觉，但在网络代码中非常广泛。例如，文件系统代码使用\
    \ `ERR_PTR()`（`include/linux/fs.h`）将负错误码编码为指针，并使用 `IS_ERR()` 和 `PTR_ERR()` 将其提取出来：避免了为错误码单独设置一个指针参数。虽然很别扭，但这种做法很有好处。\n\
    \n## 10.3. 破坏编译\n\nLinux 和其他开发者有时会在开发内核中更改函数或结构体的名称；这并不是为了让大家保持警惕：它反映了根本性的变化（例如：不能在中断开启时调用，或者进行了额外的检查，或者不再进行以前捕的检查）。通常这会伴随着向\
    \ linux-kernel 邮件列表发送的相当完整的说明；请搜索存档。简单对文件进行全局替换通常会让情况变得更糟。\n\n## 10.4. 初始化结构体成员\n\
    \n初始化结构体的优方法是使用 gcc 的标签元素扩展，例如：\n\n```c\nstatic struct block_device_operations\
    \ opt_fops = {\n    open:               opt_open,\n    release:            opt_release,\n\
    \    ioctl:              opt_ioctl,\n    check_media_change:  opt_media_change,\n\
    };\n```\n\n这使得 grep 搜索变得容易，并且清楚了是哪些结构体字段被设置了。我们应该因为它看起来酷就这样做吗？\n\n## 10.5. GNU\
    \ 扩展\n\nLinux 内核明确允许使用 GNU 扩展。注意，由于缺乏通用性，某些较复杂的扩展支持并不良好，但以下内容被认为是标准的（详情请参见 GCC\
    \ info 页的“C Extensions”部分——是的，真的，是 info 页，man 手页只是 info 中内容的简短摘要）：\n\n- 内联函数 (Inline\
    \ functions)\n- 语句表达式（即 `({` 和 `})` 结构）\n- 声明函数 / 变量 / 类型的属性 (__attribute_))\n\
    - 标签元素 (Labeled elements)\n- typedef\n- 零长度数组\n- 宏可变参数 (Macro varags)\n- 对 void\
    \ 指针进行算术运算\n- 非常量初始化（不在 arch/ 和 include/asm/ 之外）\n- 汇编指令作为字符串的函数名 (__FUNCTION__)\n\
    - __builtin_constant_p()\n\n在内核中使用 `long` 时要小心，gcc 为其生成的代码非常糟糕，甚至更糟：在 i386 上除法和乘法无法工作，因为内核环境中缺少了它的\
    \ GCC 运行时函数。\n\n## 10.6. C++\n\n在内核中使用 C++ 通常是一个坏主意，因为内核没有提供必要的运行时环境，且头文件没有针对它进行过测试。虽然这仍然可行，但并不推荐。如果你真的想这样做，至少忘记异常（exceptions）吧。\n\
    \n## 10.7. #if\n\n通常认为在头文件（或 .c 文件的顶部）使用宏来抽象函数，比在整个源代码中使用 ‘#if’ 预处理器语句更简洁。\n\n\
    # 第 11 章. 将你的代码放入内核\n\n为了让你的代码达到正式纳入的标准，甚至仅仅是为了制作一个整洁的补丁，你有很多行政工作需要完成：\n\n- 搞清楚你是在谁的地头上“撒尿”。查看源文件顶部、`MAINTAINERS`\
    \ 文件内部，最后是 `CREDITS` 文件。你应该与此人协调，确保你没有在重复造劳动，或者在尝试某些已经被拒绝的东西。\n- 确保在你创建或进行大幅修改的任何文件顶部写上你的名字和电子邮箱地址。当人们发现\
    \ bug 或想要进行更改时，这是他们会查看第一个地方。\n- 通常你为你的内核 hack 使用一个配置选项。在相应的目录中编辑 `Config.in`（在\
    \ `arch/` 下被称为 `config.in`）。Config 语言不是 bash，尽管它看起来像 bash；安全的做法是只使用你已经在 `Config.in`\
    \ 文件中看到的结构（至少运行一次 \"xconfig\" 来测试(因为它是唯一带有静态解析器的工具)）。\n\n可以使用 Y 或 N 的变量后面跟着一个标签和\
    \ config 定义名称（必须以 CONFIG_ 开头）。三态函数（tristate function）相同，但如果 `CONFIG_MODULES` 被启用，它允许答案\
    \ M（这会在你的源码中定义 `CONFIG_foo_MODULE`，而不是 `CONFIG_FOO`）。\n\n你完全可以让你的 CONFIG 选项仅在\
    \ `CONFIG_EXPERIMENTAL` 启用时可见：这可以作为对用户的警告。你还可以做很多其他酷事：参考各种 `Config.in` 文件获取灵感。\n\
    \n- 编辑 Makefile：`CONFIG` 变量在这里导出，因此你可以使用 'ifeq' 进行条件编译。如果你的文件符号添加了名称，请将它们加入到 `MX_OBJS`\
    \ 而不是 `OX_OBJS`、`M_OBJS` 或 `O_OBJS`，这样 `genmake` 就能找到它们。\n- 在 `Documentation/Configure.help`\
    \ 中记录你的选项。在这里提到不兼容性和问题。务必在你的描述末尾加上“如果没疑问，请说 N”（或者，偶尔说 'Y'）；这是给那些完全不知道你在说什么的人准备的。\n\
    - 如果你做了一些值得注意的事，将自己放入 `CREDITS` 中，通常不止一个文件（你的名字本该就在源文件顶部）。`MAINTAINERS` 意味着当对子系统进行更改时，你希望被咨询并听到\
    \ bug 信息；它意味着对某些代码部分有着超常的投入。\n- 最后，不要忘记阅读 `Documentation/SubmittingPatches` 以及可能的\
    \ `Documentation/SubmittingDrivers`。\n\n# 第 12 章. 内核口诀\n\n从浏览源码时发现的一些心爱。欢迎随时添加到此列表。\n\
    \n```c\ninclude/linux/brlock.h:\n\nextern inline void br_read_lock (enum brlock_indices\
    \ idx)\n{\n    /*\n     * 如果使用了无效索引，\n     * 这会导致链接时产生错误消息：\n     */\n    if (idx\
    \ >= __BR_END)\n        _brlock_usage_bug();\n\n    read_lock(&brlock_array[smp_processor_id()][idx]);\n\
    ```\n\ninclude/linux/fs.h:\n\n```c\n/*\n* 内核指针包含冗余信息，所以我们可以使用一种方案，\n* 我们可以返回错误码或\
    \ dentry 指针\n* 它们具有相同的返回值。\n*\n* 这应该是针对架构的，以允许不同的\n* 错误和指针决策。\n*/\n#define ERR_PTR(err)\
    \    ((void*)((long)(err))\n#define PTR_ERR(ptr)    ((long) (ptr))\n#define IS_ERR(ptr)\
    \     ((unsigned long) (ptr) > (unsigned-long)1000))\n```\n\ninclude/asm-i386/uaccess.h:\n\
    \n```c\n#define copy_to_user(to,from,n)\n```\n\n```c\n(__builtin_constant_p(n)\
    \ ? \\\n  __constant_copy_to_user((to), (from), (n)) : \\\n  __generic_copy_to_user((to),\
    \ (from), (n)))\n```\n\narch/sparc/kernel/head.S:\n\n```c\n/*\n* Sun 的人不会写单词。确实是\
    \ \"compatability\"。\n* 至少我们*知道*自己不会写，并且使用了拼写检查器。\n*/\n```\n\n```c\n/*\n* 呃，实际上不会写的是我\
    \ Linus。\n* 太多的 Sparc 汇编会让你变成这样。\n*/\n```\n\n```c\nC_LABEL(cputypvar):\n  .ascii\
    \ \"compatability\"\n```\n\n```c\n/* 在 SS-5, SS-10 上测试过。可能是 Sun 的某人用了拼写检查器。 */\n\
    \  .align 4\n```\n\n```c\nC_LABEL(cputypvar_sun4m):\n  .ascii \"compatible\"\n\
    ```\n\narch/sparc/lib/checksum.S:\n\n```c\n/* Sun，你真的赢不了我，你真的赢不了。停止尝试，\n  * 放弃吧。我是认真的，我要把你活生生地\n\
    \  * 踢出去，游戏结束，灯光熄灭。\n  */\n```\n\n# 第 13 章. 感谢\n\n感谢 Andi Kleen 提供灵感、回答我的问题、纠正我的错误、填充内容等。感谢\
    \ Philipp Rumpf 修复更多拼写和清晰度问题，并提供了一些优秀的非显而易见的观点。感谢 Werner Almesberger 给了我关于 `disable_irq()`\
    \ 的精彩总结，Jes Sorensen 和 Andrea Arcangeli 补充了警告。感谢 Michael Elizabeth Chastain 检查并完善了\
    \ Configure 部分。感谢 Telsa Gwyne 教我 DocBook。\n\n"
