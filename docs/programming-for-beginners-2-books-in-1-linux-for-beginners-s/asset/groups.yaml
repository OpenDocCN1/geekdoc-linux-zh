    ## 第2 章：Linux 的安装


    如果操作得当，安装是一个简单的过程。Windows 系统通常很复杂且耗费大量时间，而 Linux 的安装程序非常简洁，且通常在短时间内完成。然而，由于可用的
    Linux 发行版非常多，具体的步骤会略有不同。在本节中，我们将尝试解释安装步骤，以便你能够在虚拟机或通过启动设备安装任何 Linux 操作系统。请跟随操作以了解相关内容。


    注意：


    在开始安装程序之前，进行先期规划总是好的。务必详细了解你尝试安装的 Linux 发行版。根据指南文件列出所需的物品清单。


    在下节中，我们将详细讨论在进行安装程序之前需要注意的规划。


    - a) 始终确保你满足所有系统要求


    不同的操作系统有不同的安装要求。务必在 Linux 发行版网站上交叉检查要求，如果你确定了前提条件，即可继续进行安装程序。即使不满足要求，也可以安装 Linux，但在使用操作系统时可能会遇到性能问题。因此，如果你使用的是配置较低的旧电脑，建议始终使用轻量级
    Linux 发行版。


    - b) 你会丢失 Windows 吗？


    操作系统有不同的安装类型。你可以将 Linux 版本作为全新安装，也可以在同一系统中同时运行 Windows 和 Linux。然而，双启动系统可能会降低操作系统的性能。如果你不愿继续使用
    Windows，那么双启动是完美选择。如果你的硬件支持较高的配置，也可以尝试使用虚拟机，因为低端电脑上的虚拟机会有很多 Bug。


    - c) 准备好你所有的硬件


    在安装过程中，确保所有的硬件都就绪。部分 Linux 发行版会在你在安装过程中输入有关硬件设备（如 CD-ROM、网卡等）的详细信息。


    - d) 了解 Linux 文件系统


    安装 Linux 最重要的前提是详细了解 Linux 文件管理系统。在安装期间，必须选择分区信息。请确保你对此了如指掌。我们将在本章节的后续部分中详细讨论分区。


    ## 推荐的最低系统配置


    经过仔细考虑，我们在此向你展示 Linux 操作系统所需的最低系统要求：


    -- 1) 一个良好的 Intel 处理器


    建议使用支持 486 或更高版本 Intel 微处理器的系统。为了获得更好的性能，非常推荐使用 AMD 和 Pentium 处理器。


    - 2) 1GB RAM


    建议至少保持 1GB RAM 以获得更好的性能。随着 RAM 大小的增加，Linux 系统的性能会指数级增长。


    - 3) 20GB 空闲硬盘空间


    大部分硬盘空间将被 Linux 系统文件占用。然而，建议至少保持 20GB 的空闲硬盘空间，以提供流畅的性能。


    在下一节中，我们将详细讨论 Linux 分区系统。


    首先，Linux 处理文件系统与 Windows 完全相反。Windows 通常使用本地磁盘 Local disk C、Local disk D 等来表示硬盘……而
    Linux 则将它们表示为 /dev/sda、/dev/sdb 等……这里是第一个 Linux 硬盘系统，并以此类推。


    ## 什么是分区？


    分区是将硬盘分为不同的部分以继续系统安装的过程。有不同的分区方案，例如 MBR 分区方案。在安装 Linux 系统时有不同的分区技术。我们将在本节中用通俗易懂的语言讨论其中一些。


    从技术上讲，有三种分区方案，即主分区、扩展分区和逻辑分区。


    通常，许多 Linux 发行版系统使用以下方案进行安装：


    - a) 系统的重要部分，挂载为 /root [这包含系统文件，且通常不可编辑]


    - b) 硬盘中非常小的一部分，用于 RAM 内存。通常，此分区系统被称为 swap（交换分区）


    - c) 用于存储文件的普通硬盘分区。这通常表示为 /home。


    在安装过程中，你通常可以根据自己的需求选择分区系统的大小。通过此，我们对分区有了良好的理解，在接下来的节中；我们将详细讨论安装程序。我们将使用 Linux
    Mint 作为示例操作系统以便更好地理解。


    ## 使用启动介质安装 Linux Mint


    Linux Mint 是受欢迎的 Linux 发行版之一，以其简单易用而闻名。我们将安装程序分为若干步骤，以便更好地更清晰地理解。你可以对任何尝试安装的 Linux
    发行版使用相同的步骤。


    ### 1) 始终研究要求


    与之前一样，了解你将安装的发行版非常重要。进入 Linux Mint 网站，了解系统要求并进行交叉检查。找出你的电脑是支持 64 位还是 32 位的系统。这非常重要，因为你需要下载带有相应选项的
    iso 文件。


    ### 如何知道你的系统是 32 位还是 64 位的？


    进入 Windows 的控制面板并点击属性选项卡。你可以找到计算机支持的系统类型。你甚至可以使用设备信息选项卡查看所有系统规格。许多高级的 Linux 发行版现在需要更高的规格才能使用。


    ### 2) 下载文件


    在初步研究之后，现在是时候下载安装程序了。有很多第三方网站提供安装文件，但始终建议从官方网站下载安装文件，因为许多安装文件中包含了用于提取你敏感信息的木马。你可以重新验证
    64 位加密密钥以检查你的安装文件是否为正版。


    在安装下载页面选择 64 位或 32 位系统文件并将其保存到硬盘中。在安装过程中，你会被要求选择一个桌面环境，如 XFCE 或 GNOME。桌面环境是图形用户界面，每个都有其自己的优势。在选择图形界面之前做好良好的研究。我们推荐
    XFCE，因为它在所有电脑上都很稳定。如果你的硬件规格较高，你也可以尝试 GNOME。


    ### 3) 制作启动 USB


    Linux 可以使用启动设备安装。你可以使用 NERO 等光刻刻录软件将安装文件刻录到 CD 中以制作成启动 CD。然而，如今 CD 驱动器正在逐渐消失，建议使用启动
    USB 以便更方便地安装。


    要制作启动 USB，你需要使用如 Rufus、Universal USB Installer 等软件。有很多软件提供完全相同的功能。下面我们将讨论它们用于将启动安装文件安装到
    USB 中的使用的程序。


    - a) 通常，你需要选择发行版文件和你正尝试安装的操作系统名称。


    - b) 将你准备作为启动 USB 的闪存盘（Pen drive）插入系统，驱动器将出现在第三个选项中。点击格式化驱动器选项进行纯净安装。


    - c) 然后点击开始启动程序。注意电源，任何意外都可能导致需要重新执行整个过程。


    程序完成后，你将收到一个提示。拔掉硬件并使用它启动安装程序。


    即使正确执行了所有步骤，如果你的系统对启动 USB 没有响应，那么你需要更改 BIOS 设置中的设置。每个制造商为你的系统使用不同的 BIOS 程序。对 BIOS
    设置和 UEFI 设置进行良好的研究以启动启动 USB 模式。有时你可能需要禁用安全启动（secure boot）选项以立即生效。


    ### 4) 备份


