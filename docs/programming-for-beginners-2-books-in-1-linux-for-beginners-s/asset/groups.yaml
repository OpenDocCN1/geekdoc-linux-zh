    # What are Joins?


    Usually, we can query columns and rows using the SELECT statement. However, SELECT
    statements only work for a single table and so is not useful for complex query
    operations. At this Joins come into operative where they can query data from two
    or more tables with the help of common columns present in the tables.


    # What are Unions?


    Unions are used to retrieve data from two or more tables. The only difference
    between Joins and Unions is that Joins use only SELECT statement where Unions
    use a different number of SELECT statement to achieve the results.


    # How to implement joins?


    Joins are usually implemented using two types of syntaxes. Explicit syntax deals
    with the cartesian product of two tables. Whereas implicit syntax deals with Where
    clauses. It is always recommended to use explicit functionality because it is
    easy for queries to function and operate. A lot of queries are going to discuss
    in this chapter follow the explicit syntax.


