    ## SSH key based authentication


    As explained in the previous section, SSH key-based authentication is one of the
    most popular services used in Linux. To use key-based authentication, you are
    required to upload the public key that is encoded to SSH server.


    Always create keys as a normal user as root restrictions can make others not accessible
    to the authentication.


    Here we explain the step by step procedure to generate and import SSH keys:


    - 1) In the first step we will create a keypair that has an option to enter passphrase.
    You need to confirm the passphrase and your encrypted key will be generated.


    Here is the command:

    ```bash

    root@sample: ssh-keygen

    ```


    - 2) You can also generate a key without a passphrase. However, it is advised
    to use a passphrase which gives it an additional layer of security while using
    the SSH service.


    - 3) Now in the next step you will need to carefully import the key to the remote
    system. Here is the command to make it happen without any hiccups


    ```bash

    ssh-copy-id sk@132.23.22.11

    ```


    You can disable it if you ever want to deal with key based SSH.


    ## Connecting via Telnet


    Telnet is a famous Linux network administration tool which can help us to connect
    to a remote computer with an authentication procedure. Telnet has the power to
    connect to the remote computer with no restrictions just like SSH. Although not
    being as secure as SSH, it still has its merits.


    First of all, it is easy to install and comes inbuilt with many Linux distros.
    If you are not provided with Telnet, you can install it via wget downloader.


    The mechanism of Telnet is its uses basic password authentication mode. Use the
    following command to connect to the Telnet.


    ```bash

    root@sample: telnet {enter the host name}

    ```


    Here host name refers to the ip address of the remote machine we are trying to
    connect to.


    For example, you can connect to Localhost to connect to computers in the same
    network.


    ```bash

    root@sample: telnet localhost

    ```


    After this in the command we will receive a prompt to enter the username and password.


    After a successful connection, you can further execute the commands to run in
    the remote machine. Telnet can be easily used using the logout command as given
    below.


    ```bash

    root@sample: telnet logout

    ```


    ## Encryption


    Encryption is a technique for encoding and decoding information. It converts plaintext
    information that could have been read directly into ciphertext form through a
    certain algorithm (key). The key is the key of the ciphertext, which is divided
    into a private key and public key. When transmitting data, if you are worried
    about being monitored or intercepted by others, you can encrypt the data with
    the public key before transmission, and then transmit it. In this way, only the
    user who has the private key can decrypt the data, and even if other people intercept
    the data, it is generally difficult to decrypt it into clear information.


    In a word, using passwords to verify passwords in a production environment is
    always at risk of being hacked or intercepted by sniffers. If the key authentication
    method is correctly configured, the sshd service program will be more secure.
    We will make the following specific configuration, and the steps are as follows:


    - Step 1: Generate a "key pair" in the client host.

    - Step 2: Transfer the public key generated in the client host to the remote host.

    - Step 3: Set the server to allow only key authentication and reject the traditional
    password authentication method. Remember to save and restart the sshd service
    program after modifying the configuration file.

    - Step 4: When the client attempts to log in to the server, it can log in successfully
    without entering a password.


    ## SCP


    Scp(secure copy) is a command for secure transmission between networks based on
    SSH protocol.


    Its format is "scp [Parameters] Local File Remote Account@Remote IP Address:Remote
    Directory".


    Different from the cp command, cp command can only copy files in local disk, and
    scp can not only transfer data through the network but also encrypt all data.
    For example, if you want to transfer files from one host to another via the network,
    and the two hosts happen to be Linux systems, then you can easily transfer using
    scp command.


    When using scp command to copy files from local to remote host, it is first necessary
    to know the storage location of local files in the form of an absolute path. If
    you want to transfer all the data in the entire folder, you also need to add the
    parameter -r for the recursive operation.


    Then write down the IP address of the remote host and the remote server will require
    authentication. The current user name is called root, and the password is the
    password of the remote server. If you want to use the identity of the specified
    user for authentication, you can use the parameter format of user@host address.


    Finally, you need to add a colon after the IP address of the remote host and write
    down which folder to send to the remote host. As long as the parameters are correct
    and the user''s identity is successfully verified, the transfer can begin.


    Also the scp command can be used to download files from the remote host to the
    localhost. For example, you can download the system version information of the
    remote host, so you don''t need to log in to the remote host first and then transfer
    the file, which saves a lot of trouble. When learning sshd service when the session
