    by these two roles respectively.


    ### 1. Server-level roles and permissions


    Server-level roles can also be called "fixed server roles". The main reason for
    this is that server-level roles cannot be changed (including cannot be added).
    In SQL Server, it has already defined roles, with a total of 9 roles. You can
