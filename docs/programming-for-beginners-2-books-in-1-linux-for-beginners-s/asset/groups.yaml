    ## crontab & cron daemon


    In Linux there is a process called cron daemon that can take parameters to execute
    after particular time or if it can satisfy a condition.


    Daemon as discussed before is a background process that can manipulate system.
    Linux users can enter a command to schedule their task for a particular time in
    the crontab.


    And when the time comes cron daemon that is running in the background initiates
    the procedure. For example, we can use crontab to shut down the system after 30mins
    inactivity. All you need to do is add this on the crontab.


    Crontab can perform tasks even after few years and months. You can find various
    parameters of the crontab to do complex operations as deleting the log files after
    a reboot etc.,


