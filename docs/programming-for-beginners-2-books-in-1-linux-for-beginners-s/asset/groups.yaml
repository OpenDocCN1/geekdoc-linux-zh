    # Linux 简史


    在20世纪70年代初，在那段被认为是计算机文艺复兴的时期，已经出现了开源开发的痕迹。UNIX 是最受欢迎的企业系统之一，程序员使用它来开发可以随处运行的软件。然而，当
    UNIX 决定将其所有集成资源商业化时，开源社区遭受了打击，这使得开源社区难以有效地开发应用程序。


    几家公司试图让回归正常，但直到1984年理查德·斯尔曼（Richard Stallman）启动 GNU 开源计划，情况才开始好转。随后 GCC 编译器的发布，使得程序员能够为自己的环境创建相应的程序。这些资源帮助程序员创建了许多具有创新的应用程序。


    在所有项目中，1991年，一个由来自赫尔辛基大学的年轻学生创建的项目在社区中脱颖而出。它主要是一个操作系统，由一个内核组成，内核包含不同的库，可以用于集成和开发第三方应用程序及发行版。这位年轻的学生林纳斯·托瓦尔斯（Linux
    Torvalds）对这种反响感到非常意外，他开始认真启动该项目并进入了全面开发阶段。这个项目被称为“Linux”。


    到1994年，Linux 在人气和用户群方面都经历了爆炸式增长。同年，一位名为 Bob Young 的程序员将不同的库集成到内核中，并发布了名为红帽 Linux（Red
    Hat Linux）的商业发行版面向企业。随着红帽 Linux 的成功，人们理解了 Linux 系统的优势，并开始将其集成到不同的技术系统中。直到今天，林纳斯·托瓦尔斯在全球数十万热心程序员的帮助下，仍然从家里运营内核。


    2019年，Linux 在技术版图中占据了 15% 的份额，由数百个可以用于不同用途的 Linux 发行版组成。例如，Kali Linux 就是专门为黑客开发的
    Linux 发行版。


    # Linux 与 Windows 有何不同


    尽管 Windows 占据了大部分份额，但由于其稳健的性能、简单的界面和先进的安全机制，Linux 被认为是所有操作系统中最好的。在本节中，我们将介绍帮助
    Linux 占据操作系统顶层位置的所有特征。


    ## a) 开源


    如前所述，Linux 是少数允许将其所有源代码供任何人使用的操作系统之一。对于技术上足够优秀能够根据自己的需求更改源代码的热心人士来说，他们会发现 Linux
    非常有用。


    ## b) 随处可用


    随着技术的进步，硬件技术也随之发展，导致低端系统无法运行最新的 Windows 版本。然而，通过 Linux，你可以找到不同的轻量级发行版来配备你的低端个人电脑。著名的移动操作系统
    Android 也运行在 Linux 内核上。Linux 还可以被集成到如 Arduino 等嵌入式系统中。基本上，Linux 可以从手机到汽车无处不在，使其成为少数提供这种灵活性的操作系统之一。


    ## c) 程序员的梦想之源


    程序员经常依赖 Linux 系统来调试、编程和测试他们的源代码。Linux 平台为几乎所有可用编程语言提供了各种集成开发环境（IDE）。先进的科学和人工智能项目通常依赖
    Linux 系统来协作和组织它们的资源。程序员也可以依赖 Windows 系统开发应用程序，但 Linux 的结果速度快使得软件的调试和部署非常高效。


    ## d) 更好的定制性


    Windows 和 Mac 出各种原因限制用户遵循其基础用户界面。希望定制化系统的用户需要安装第三方软件，而这通常是昂贵的。对于喜爱精美界面的极客来说，Linux
    是最佳选择，因为它提供了数百个内置主题，并提供如 KDE 和 GNOME 等不同的可定制环境。


    ## e) 先进的更新系统


    Linux 提供了一种快速且可靠的方式来更新操作系统。由于维护企业系统的贡献者较少，Windows 和 Mac 在发现漏洞后通常需要很长时间才能提供更新。相比之下，由于资源开发迅速，Linux
    在极短时间内为用户提供更新。不同的 Linux 发行版使用不同的预制更新安装程序，并可以根据用户的选择使用不同的过滤器进行定制。


    ## f) 强大的终端


    任何有一点极客精神的人都能理解微软充满 Bug 的命令提示符。Linux 中的终端是操作由内核运行的不同系统的路径。你可以使用预构建和自定义的命令来控制整个系统。你甚至可以使用
    Linux 终端编辑系统文件，而 Windows 往往限制用户仅使用基本的命令提示符。


    ## g) 高安全性


    Linux 通过其匿名性特性提供了高级别的安全性。某些 Linux 发行版甚至在系统中提供了 TOR 代理链。Windows 由于防御系统较差，经常受到病毒和蠕虫的攻击。


    ## h) 支持社区


    Linux 拥有慷慨的程序员和经验丰富的社区，当你面临问题时，他们乐意提供帮助。Windows 也提供支持论坛，但高级系统错误只能通过专家解决。


    除了这些优势之外，Linux 是免费且易于安装的。Linux 这种快速优势帮助它们占据了25%的市场份额，并经常被企业使用。Linux 用户不需要使用杀病毒软件。在下一节中，我们将讨论一些流行的发行版。


    到此，我们完成了 Linux 的基础介绍。在下一章，我们将详细介绍不同 Linux 系统的安装步骤。让我们开始吧。


    # 流行的 Linux 发行版


    Linux 发行版是作为独立操作系统提供的软件包。它们使用 Linux 提供的预构建库进行开发，并与编译后的应用程序集成。在这里我们将介绍一些著名的发行版。


    ### 1) 红帽企业 Linux (Red Hat Enterprise Linux)


    红帽 Linux 是最早使用 Linux 内核开发的 Linux 发行版之一。它现在是世界上最常用的企业系统之一。它以强大的性能、稳定详细的统计数据闻名。红帽
    Linux 常被企业用于维护数据库、网络和其他技术系统。红帽 Linux 还根据其提供的定制提供付费发行版。


    ### 2) Manjaro Linux


    Manjaro Linux 是使用 Arch Linux 的著名 Linux 发行系统之一。Arch Linux 是一个高级用户集成系统，支持更快的软件安装。与其他发行版不同，一切都是预装的，对初学者来说非常完美。Manjaro
    还提供了优秀的定制选项。根据互联网显示，Manjaro 是 2018 年下载最多的 Linux 发行版。


    ### 3) Ubuntu


    Ubuntu 是让 Linux 对普通用户变得简单的 Linux 发行版。Ubuntu 使用 Debian 数据库来同步应用程序并自动提供更新。它轻量、快速且稳定。Ubuntu
    通常预装在配置较低的笔记本电脑和电脑中，以获得更好的性能。


    ### 4) Linux Mint


    Linux Mint 因其易导航的界面而流行。它提供更快的更新，也可以安装在低端电脑上。它非常轻量且通常没有 Bug。Linux Mint 是拥有专门贡献者的流行
    Linux 发行版之一。

