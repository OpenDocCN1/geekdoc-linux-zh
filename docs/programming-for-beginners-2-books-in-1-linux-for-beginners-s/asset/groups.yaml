- md: "\n## Chapter 6: Extra Features in Linux\n\nThis chapter is a comprehensive\
    \ guide that explains about various individual features that Linux systems possess.\
    \ We will discuss such as directory permissions, Compressing, and file systems\
    \ in detail along with commands whenever we feel necessary. This chapter will\
    \ expand into chapters with more complex topics in Linux. Follow along!\n\n##\
    \ File and directory permissions\n\nLinux is a professional operating system that\
