    To facilitate the management of databases, SQL Server refers to the concept of
    role, which is an aggregation of certain permissions. The role is used in many
    management systems today and can be said to be the basis for SQL Server to divide
    permissions. Roles are similar to groups. As long as managers assign permissions
    to roles, users inherit a certain role to achieve the purpose of assigning permissions.
    Using roles can only divide permissions quickly but also change permissions conveniently.
    Therefore, it not only increases the security of the database but also facilitates
    the database managers.


    Division of roles


    The roles in SQL Server are divided into two categories, namely:


    +   - Server-level roles.

    - Role at the database level.


    Although they are both called roles, the meanings represented by these two roles
    are different. The following are detailed descriptions of the meanings represented
    by these two roles respectively.'
