    to erase. For example you use a ''database'' if you are trying to delete a database.
    There are a lot of database objects such as tables, columns, views, triggers,
    indexes, and constraints.

    - 2) Name of the objects - In this parameter all you need to do is enter the name
    of the column or database or index you are trying to delete.


    You can at the same time delete or more databases at the same time using the logical
    expressions and values.


