    # Types of constraints:


    There are primarily two types of constraints namely declarative and procedural
    constraints. We in this chapter will mainly discuss declarative constraints such
    as Primary and Foreign keys using DDL statements. In the upcoming chapters, we
    will look at other statements. Follow along!


    ## 1) DEFAULT


    This is a special constraint that is used to select columns or a group of columns
    that have the utmost same or identical values. Unique in the statement defines
    that the selected columns updatable and unique values that can be easily recognized.


    Note:


    Remember before defining any constraint you need to start with defining its column
    name.


    Here is the SQL statement:


    ```

    CONSTRAINT {Name of the column} UNIQUE [ Enter parameters]{Enter values}

    ```


    Now, we in detail discuss the parameters possessed by the following DDL SQL statement.


    - 1) Constraint - This will define the constraint we are going to use in this
    statement. The constraint will usually follow the column name that we are going
    to apply this on.

    - 2) Type of Index - This parameter on a whole will explain whether this index
    is clustered or not. Clustering usually refers to canonically index values.

    - 3) Null - You can also use a parameter to define whether your constraint column
    can accept null values or not. By using this parameter, you are giving additional
    query information for any further operators


    ## 2) PRIMARY KEY


    As discussed before the primary key is a unique value that can be identified or
    used to query with other tables. Primary keys can be a foreign key for other databases.
    The primary key is usually essential for any database that is ready for query
    operations.


    The primary key as remaining constraints can be used in both Creating and Altering
    database objects. This is the reason why they are explicitly used to create DDL
    and DML statements for changing the structure of the data.


    Here is the SQL statement for Primary key:


    ```

    CONSTRAINT {Name of the column} PRIMARY KEY {Enter the parameter values}

    ```


    We will now discuss the parameters in detail for your better understanding.


    - 1) Constraint - As said before the primary key is a constraint and it is important
    to define a primary key as a constraint to give expected results. You can also
    use the primary key without defining constraint but it may often result in corrupted
    data operations.

    - 2) Column name - In the SQL operational statement you also need to define the
    column name of the table where the operational procedure is going to take place.

    - 3) Null and Clustering - We will also define whether the DDL statement is willing
    to take Null values or not. Some statements will also give slight information
    about the clustering format.


    Note:


    Remember that dropping Primary key columns will not delete the created key values
    but will not result in successful retrieving.


    ## 3) CHECK


    This is one of the most important constraints available because it acts like a
    schematic operation and will restrict values to be entered. The check clause will
    explicitly check the constraints that are available and produce results.


    Here is the SQL statement:


    ```

    CONSTRAINT {Name of the column} CHECK {Logical expression}

    ```


    We will now discuss in detail the parameters present.


    - 1) Check - This statement will evaluate the expression given to a thorough check.
    Before creating a table or column the database system will look at this DDL statement
    and start checking the resources.

    - 2) Replication - This is a statement that defines whether the database procedure
    should be continued or halted after the evaluation of an expression. A lot of
    database operations gives error if there is any hiccup during the process.

    - 3) Logical expression - Logical expression is usually a combining factor of
    conditional and loop statements along with operators to undergo logical equality
    or operation. A lot of SQL programmers use this to counter-attack brute-force
    attacks coming from hackers. When the entities do not satisfy the logical expression
    then it will result in a halt.


    With this, we have explained a few of the important constraints that are provided
    by SQL. In the next section, we will discuss the Foreign key and its DDL statement
    in detail. Follow along!


    ## Foreign key DDL in tables


    We have already discussed the primary key values that can be used to retrieve
    data results. The primary key in the first table is conversely foreign keys for
    the second table. To explain in a theoretical manner every primary key of a table
    is a foreign key of others.


    Foreign keys are explicitly used to join two tables and can also be used to successfully
    modify the databases. It is an integral constraint and is used to rearrange the
    columns according to a logical expression.


    Here is the SQL statement:


    ```

