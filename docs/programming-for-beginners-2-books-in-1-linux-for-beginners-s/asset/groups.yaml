    ## Chapter 7: Process Management in Linux


    First of all, before diving into deep about different commands that are used in
    process management, we need to get a good idea about what a process means.


    ## What is the process?


    Generally, an operating system is compiled with the help of certain programs to
    solve different tasks. All of these programs are systematically arranged with
    the help of a graphical interface that acts as a medium to perform tasks.


    Programs are step by step instructions to solve a problem. Programmers use logical
    and analytical algorithms to create complex programs that can handle different
    instructions. When a program is started it is stored in the main memory and starts
    executing.


    Whenever programs start or initiate it is called a process. Processes are usually
    represented by ids by the operating system for better monitoring of resources.
    Linux operating system various advanced system techniques to handle and prioritize
    processes. In this chapter, we will discuss in detail about different use cases
    of processes with the help of Linux commands. Follow along!


    ## Process id:


    Process id also abbreviated as PID is usually represented by numbers for a process
    in the Linux systems. Every process is designated to have a PID. The first process
    that Linux starts during the booting procedure is a PID 1 and all other processes
    have much longer PIDs.


    Usually, parent processes and child processes can be easily identified as PID''s
    of parent processes are shorter and PID''s of child processes are longer.


    ## Parent process


    The parent process is a type of process that initiates system calls using fork
    () function. When fork () is used child processes can be easily initiated.


    For example, when LibreOffice is opened in Linux a process starts. After some
    time the user clicks Check for updates in the interface and the parent process
    calls a system function fork () to initiate a child process that checks for updates.


    One parent process can start multiple child processes. However, an infinite number
    of child processes is not a problem as system resources may get stuck with the
    sudden volume.


    ## Child Process


    The child process is a process that is often initiated by a parent process. It
    is usually similar to the parent process in many ways and even has a similar PID.
    If any chance a child process is ended or interrupted a signal will be sent to
    the parent process to know about it. Child processes are often called by fork()
    and often ends by themselves. This self-destruction can help save resources for
    the system.


    ## pstree


    pstree is a command in Linux that shows the tree process structure or the sequential
    process structure that the Linux system possesses.


    pstree is categorically organized so that we can see the first processes to the
    endpoint. All the processes are arranged in a way that the child process and parent
    process can be easily noticeable.


    Command is here:


    ```

    pstree

    ```


    Open your command and enter the above command to look at the tree structure of
    all the processes running in your Linux system.


    ## PS command


    PS also called a process status command is a special Linux utility that is used
    to display all the processes that are present on multiple parameters. ps command
    has become a Linux administrator handy tool because it can help to filter the
    processes according to their requirements.


    In this section, we will describe some commands that can help you understand the
    scope of ps command. It is advised to enter the commands on your Linux system
    for a customized learning experience.


    - a) ps


    This is the basic command that can be used to display all the processes that are
    present in the current shell. Remember that this plain ps command will only display
    the processes that are running on the present shell but not on the entire system.
    This becomes hand when you are focused on a batch of processes that you have initiated
    before.

