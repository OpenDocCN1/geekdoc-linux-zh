    # Schema creation


    Schema is a set of instructions that the database possesses. People usually get
    confused with the term schema but it is simply a customized database. It is always
    recommended to create a schema because you will be well aware of the options in
    the instance. Schema creation is a good practice for database administrators.


    To create a schema all you need to do is enter the database objects and click
    on the option that says create schema. When you click all of the properties of
    the column will be given and you need to manually enter them. This is how a schema
    is created and there are even options in the interface to delete that schema.


    # Creating Data


    Entering data into the database or table is one of the most important understanding
    all database administrators should be aware of. To create data using the SQL server
    you need to start understanding the essence of the system.


    All you need to do is enter the option to create data and fill it with column
    values of your choice. You can even create data belonging to different data types
    using this functionality.


    # Inserting data


    Data should be inserted to go on with the queries. It is usually not possible
    to import huge data from the SQL server software because of the complexities that
    may arise. However, if you are reluctant to insert data then we will explain an
    easy way.


    First of all, create an excel document and fill the values in the columns. Use
    this file and click on the insert data option present in the sideline of the database
    option. After that, all of the values will be inserted and can be easily updated
    with other available options.


    This chapter is just a small introduction to the SQL server software. We have
    potentially introduced some of the concepts that databases usually deal with.
    In the next chapter, we will look at DDL statements in detail. Let us go!


    # Chapter 3: The Data Definition Language


    Structured Query language uses DDL statements to create entities such as databases
    and tables. It also uses DML statements to alter or change the structure of databases.
    In this book, we will discuss all of these statements in detail with a lot of
    examples. For now, we will start learning some of the essential concepts required
    for a better understanding of all of these SQL query statements. Follow along!


    # SQL essential objects


    SQL objects are an easy way to understand the essence of the language we are dealing
    with. Just like any programming language SQL depends on different objects to make
