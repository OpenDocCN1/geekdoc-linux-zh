    # Chapter 4: Basic Linux commands


    In the previous chapter, we have learned about some of the very basic Linux commands
    that are used by Linux administrators and users. In this chapter, we will further
    try to improve your skills by looking at various distinguished commands based
    on categories such as system commands, directory commands, and text commands.
    It is not recommended to remember all these commands by heart but it is good to
    test by yourself while reading this book to better understand the importance of
    these commands. Let us start!


    # System Commands


    System commands are important to learn by a Linux learner for improving the efficiency
    of the system. This section will help you learn commands that are linked to kernel
    and network. All of these commands are very practical and serve a significant
    purpose.


    ### 1) Command to know Network information


    This single command can help you know a lot about your network. When you enter
    this command in your terminal information such as network status will be displayed
    in a split second.


    Here is the format for this command:


    ```

    root @ sample: ifconfig

    ```


    The output will display information such as IP address, subnet mask, and Physical
    MAC address. If you have used any third-party software such as VPN or Mac changer
    the customized values will be shown.


    Sample output for the command:


    ```

    inet 212.23.21.12 subnet 223.12.11.12 Broadcast 121.11.232.12

    ```


    ### 2) Command to know hardware information


    This special command in Linux will help you know a lot of static information about
    system and kernel. You can know about a lot of details such as kernel type, Hardware
    processor information and operating system.


    All you need to do is enter the following command:


    ```

    root @ sample: uname {parameter}

    ```


    You can enter -a as a parameter to display all of the information that the command
    can process.


    However, if you are not comfortable with the terminal access of the information
    you can look at the same details using the Linux distro release file in the system
    folder.


    ### 3) Command to know details about the uptime


    Uptime command serves a classical purpose to know information about system update
    time and other additional information that is necessary to be checked when dealing
    with the load of the system. This terminal command will help us to react to the
    resource shortage easily.


    Here is the command:


    ```

    root @ sample: uptime

    ```


    The output will give valid information about the system running time as below:


    ```

    12:23:12 up 23 min, 6 users, load average: 0.21, 0.03, 0.43

    ```


    ### 4) Command to free the resources


    This command gives you the power to free the resources to stop sudden system halts.
    Sudden halts may affect a lot of services and processes that are going going into
    the system. It is always necessary for a Linux administrator to track the resources.


    Here is the command for format:


    ```

    root @ sample: free -h

    ```


    Here h parameter can be used to display the system information more reasonably
    and humanely.


    ### 5) Command to know about the users


    Linux user usually monitors a lot of users present in their command. To look at
    all the users Linux provides a command called ''who''. The command will also show
    the starting time when the user entered into the system.


    Here is the command and output:


    ```

    root @ sample: who

    ```


    ```

    root 1 2019-07-12 23:12

    ```


    ### 6) Command to look at the past executed commands


    Just like a browser provides history for all the websites you have visited Linux
    system provides a command that displays 1000 of the latest command executed by
    the user in the system. You can also customize the number of commands to be displayed
    in the command configuration file.


    Here is the command:


    ```

    root @ sample: history

    ```


    ### 7) Command to display reports


    Linux provides a special command to display and curate all the resources in the
    form of a report. This report analysis is complex and often requires advanced
    troubleshooting knowledge to understand the contents in the report. Sos report
    is a very important task to learn if you are a novice user.


    A novice user can generate a sos report and send it to file to make him solve
    minor problems remotely. However, for complex problems sos report may not be effectively.


    Here is the command:


    ```

    root @ sample: sosreport

    ```


    However, make sure you are ok with sending sensitive content to the remote Linux
    administrator.


    With this, we have completed a detailed explanation about Linux system commands.
    In the next section, we will discuss directory commands which are necessary to
    be an expert Linux administrator.


    # Directory commands


    The working directory is most important to be determined to execute commands in
    the system. During installation procedures or complex tasks such as compressing
    require enter details about the working directory. We will also talk about commands
    that can help us change the working directory. Beginners should try to be perfect
    at directory commands for improving their expertise.


    ### 1) Command to know the present directory


    This command can be used to display the present directory you are in. It is simply
    designated pwd and displays the working directory you are located with exact precision.


    Here is the command for it:


    ```

    root @ sample: pwd

    ```


    The output will be like:


    /home/samplefolder


    ### 2) Command to switch the working directory


    This is the most used command in Linux. By using this command, you can easily
    switch your directory. This is often the most used command because when using
    the Linux shell window. is easy and flexible and can help you switch your directories.


    Here are some of the additional functionalities that command provides:


    - a) cd ---> You can use this parameter to shift to previous directory

    - b) cd.. ----> With this parameter you can easily shift to an upper directory

    - c) cd~ > By using this parameter you can at one instance fly to the user''s
    home directory. You can also fly to any user''s home directory by adding the user
    name at the end of the command.


    Here is the command:


    ```

    root @ sample: cd /home/sampleanalysis

    ```


    ### 3) Command to view the details of the working directory


    This command helps you to look at all the files that are present in the directory.
    You can use different parameters to look at files based on your preferences. By
    using a parameter such as ~a you can even look at hidden files.


    Here is the command:


    ```

    root @ sample: ls -a

    ```


    This command will display all the files that are present. If there are many files
