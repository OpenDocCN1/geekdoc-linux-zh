    ## 通过视图限制用户对列的访问


    视图是虚拟表，几乎可以在任何允许引用表的地方使用。然而，视图不是存储在硬盘上的物理表（类似于数据库中的其他表和索引）。视图由 SELECT 语句组成，从一个或多个基础表（或其他视图）的行和列中提取数据。使用视图的实际好处之一是可以隐藏某些其他人不想看到的表。


