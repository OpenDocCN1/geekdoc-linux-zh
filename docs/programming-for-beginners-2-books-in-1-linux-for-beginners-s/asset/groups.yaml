    在关系型数据库中，表之间是关联的。在关联时，我们必须理解表之间的关系。表之间有三种关系：一种是 1:1 关系，另一种是 1:n 关系，最后是 n:n 关系。理解表关系对
    SQL 优化、SQL 等价重写、表设计优化以及表和数据库分区非常有帮助。


    当两个表关联时，如果这两个表属于 1:1 关系，关联返回的结果也属于 1 关系，且数据不会重复。如果两个表属于 1:n 关系，关联返回的结果属于 n 关系。如果两个表属于
    N:N 关系，关联返回的结果会产生局部范围的笛卡尔积。N:N 关系通常不存在于内/外连接中，只存在于半连接或反连接中。


    ## f) 统计信息


    如前所述，只有大表才会导致性能问题，那么优化器如何知道表有多大呢？这需要收集表的统计信息。本节提到的基数、直方图和聚类因子的概念需要提前收集统计信息才能获取。


    统计信息类似于战争中的侦察。如果情报工作没有做好，战争就会失败。同样，如果没有正确收集表的统计信息，或者没有及时更新，SQL 的执行计划就会偏，导致 SQL
    出现性能问题。收集统计是为了让优化器选择最佳执行计划，并最小代价查询表中的数据。


    统计信息主要分为表统计信息、列统计信息、索引统计信息、系统统计信息、数据字典统计信息和动态性能表统计信息。


