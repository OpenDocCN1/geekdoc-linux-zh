    First of all, we will start with a brief and canonical description of data. Data,
    as described everywhere, is a technical description for the storage we possessed.
    SQL and other database query languages use various syntactical and semantical
    processes to query and process data. Query languages have made programmers task
    easy by giving us a chance to manipulate or alter the data using few syntaxes
    and statements as DDL, DML. All these statements interact with data to give us
    the required results.


    To understand the importance of data we need first understand the importance of
    constraints and their integrity. We have gone through constraints in the 3rd chapter
    for a little time, but for now, we will explain constraints in data. Let us go!


    ## Constraints in MysSql


    To explain in simple terms constraints are just restrictions. These restrictions
    are used to control what data can be placed in a column or columns.


    The primary importance of constraint is that with the help of them we can provide
    consistency to the database objects or entities present. Without constraints,
    it will be difficult to track down every automated value and alter them. With
    constraints, if there is any misplace in the column you will be immediately notified
    with an error or warning. These constraints can also help us to stop creating
    orphaned rows that are not being pointed to any columns due to changes in the
    system values.


    Constraints are almost every time created when the entity that is a database or
    table is being created. It is not a good practice to manually update constraints
    but it is technically possible.


    Constraints mainly provide three advanced operations for the database operations.
    We will go through each of them in detail in the next section.


    ### a) RESTRICT


    Constraints can be used to restrict any column operation using this statement.
    By using the restrict statement you can either delete or update the entity values
    present in the database system.


    ### b) CASCADE


    The cascades are systematical entities that denote to proceed with an operation
    that is stopped by a constraint procedure. This statement can be used for updating
    and deleting the system entity values.


    ### c) SET NULL


    NULL is an operation that is usually not correlated to database creation. A lot
    of operations may result in a sudden halt due to the wrong entrance of null values.
    This constraint setback helps us to control the null operations we deal with.


    With this, we have given a good thorough introduction to constraints and we will
    now proceed with the discussion about pivoting that is inserting data in a database.


