    Linux 提供的匿名服务非常重要。跟随下文了解更多细节。


    ## 追踪


    你所做的几乎一切都可能被政府或 ISP 追踪。由于国家审查，某些防火墙会限制你访问本国家的网站。


    ### 它们是如何被追踪的？


    你通过互联网发送的每一条信息都是通过数据包发送的。数据包包含了你的 IP 地址和目标地址。因此，如果你的提供商检查日志文件，就很容易追溯到你。


    ### 如何避免追踪？


    我们将为你提供三种逃避追踪并在互联网上过匿名生活的最佳方法。所有方法在实践中都被证明能提高你的隐私安全性。


    - a) 代理服务器 (Proxy servers)


    众所周知的代理是通信双方的中间人。当你尝试向目标发送消息或请求时，数据包会通过代理服务器传输到达目的地。因此，目标会将代理服务器识别为主要请求者并向其发送信息。你可以获取私有和公共代理来更好地管理你的互联网使用。


    接收响应后，代理服务器会将响应发送给我们，我们将通过浏览器或网络应用程序看到它。这个准确的过程可以帮助你保持匿名。


    - b) TOR 代理 (TOR proxy)


    TOR 是匿名客户端之一，可以帮助你免受额外的互联网追踪。TOR 也用于查看暗网。TOR 是由独立网络工程师开发的项目，用于整合来自大量计算机的代理链。当你在系统中启动
    TOR 服务时，你的所有数据将发送到可用的 TOR 代理，并进一步发送到全球多个秘密的 TOR 。


    即使政府尝试检查日志，也很难追踪到你的源。然而，由于代理服务器接收到大量请求，TOR 的速度较。


    ## c) VPN


    VPN 是另一种加密你信息的方法。VPN 可以让你访问被封锁的网站。通过使用虚拟专用网络，你可以轻松地变得匿名。有许多优质 VPN 服务，如 Hide my
    ass、Nord VPN。


    ## 自动化任务


    自动化是 Linux 应用服务器技术和数据库维护的领先原因之一。许多系统管理员使用自动化脚本来检查系统的必要要求。自动化不仅节省时间，还能帮助我们从不同的角度理解事物。在下一节中，我们将讨论一些可以帮助我们创建自动化任务的概念。


    ## crontab & cron 守护进程


    在 Linux 中，有一个名为 cron daemon 的进程，它可以接收参数并在特定时间后执行或在满足条件时执行。


    如前所述，守护进程（Daemon）是一个可以操作系统的后台进程。Linux 用户可以在 crontab 中输入命令，为特定时间调度任务。


    当时间到达时，后台运行的 cron daemon 就会启动程序。例如，我们可以使用 crontab 在空闲 30 分钟后关闭系统。你只需要将其添加到 crontab
    中。


    Crontab 甚至可以在几个月或几年后执行任务。你可以找到 crontab 的各种参数来执行复杂操作，例如重启后删除日志文件等。


    虽然自动化任务可以处理各种任务，但建议使用此功能备份你的数据。


    ## 备份 (Backing up)


    备份对于使用 Linux 的用户来说非常重要，因为其中可能包含敏感信息。然而，人们往往容易忘记这个简单的任务。建议每周备份一次文件。借助 crontab 的帮助，你可以为你需要的时间调度备份。


    以下是命令：


    ```

    crontab backup time

    ```


    至此，我们完成了一个描述 Linux 额外功能所有内容的综合章节。在下一章中，我们将详细讨论进程管理。


    ## 第 7 章：Linux 中的进程管理


    首先，在深入研究用于进程管理的不同命令之前，我们需要对进程是什么有一个良好的理解。


    ## 什么是进程？


    通常，操作系统是在某些程序的帮助下编译的，以解决不同的任务。所有这些程序都通过图形界面系统地安排，该界面作为执行任务的媒介。


    程序是解决问题的逐步指令。程序员使用逻辑和分析性算法来创建可以处理不同指令的复杂程序。当程序启动时，它被存储在内存中并开始执行。


    每当程序启动或初始化时，它被称为进程。进程通常由操作系统用 ID 表示，以便更好地监控资源。Linux 操作系统使用各种先进系统技术来处理和优先考虑进程。在本章中，我们将通过
    Linux 命令详细讨论进程的不同用例。跟随下文！


    ## 进程 ID (Process id):


    进程 ID 缩写为 PID 在 Linux 系统中通常用数字表示进程。每个进程都分配有一个 PID。Linux 在启动过程中启动的第一个进程是 PID 1，所有其他进程的
    PID 都长得多。


    通常，父进程和子进程可以很容易识别，因为父进程的 PID 较短，子进程的 PID 较长。


    ## 父进程 (Parent process)


    父进程是一种使用 `fork()` 函数发起系统用的进程。当使用 `fork()` 时，可以很容易启动子进程。


    例如，在 Linux 中打开 LibreOffice 时会启动一个进程。一段时间后，用户在界面上点击“检查更新”，父进程调用系统函数 `fork()` 来启动一个检查更新的子进程。


    一个父进程可以启动多个子进程。然而，无限数量的子进程并不是问题，因为系统资源可能会因为突然流量而卡住。


    ## 子进程 (Child Process)


    子进程是由父进程启动的进程。它在许多方面与父进程相似，甚至具有相似的 PID。如果子进程意外结束或被中断，一个信号将发送到父进程以通知。子进程通常由 `fork()`
    调用并通常自行结束。这种自销毁有助于节省系统资源。


    ## pstree


    pstree 是 Linux 中的一个命令，显示 Linux 系统拥有的树形进程结构或顺序进程结构。


    pstree 是分类组织的，使得我们可以从端点看到所有进程。所有进程的排列方式使得子进程和父进程可以容易地被注意到。


    命令如下：


    ```

    pstree

    ```


    打开你的命令行并输入上述命令，查看 Linux 系统中运行的所有进程的树结构。


    ## PS 命令


    PS 也称为进程状态命令，是一种特殊的 Linux 工具，用于显示存在于多个参数的进程。ps 命令已成为 Linux 管理员手手工具，因为它可以帮助根据要求过滤进程。


    在本节中，我们将描述一些可以帮助你理解 ps 命令范围的命令。建议在你的 Linux 系统上输入命令以获得定制的学习体验。


    - a) ps


    这是一个基础命令，可用于显示当前 shell 中存在的所有进程。记住，这个简单的 ps 命令只会显示在当前 shell 中运行的进程，而不是整个系统。


