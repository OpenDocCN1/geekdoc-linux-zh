    {Logical values} {CHECK}

    ```


    Here, we will discuss in-depth the parameters present.


    - 1) Define constraint - First of all, in the statement, it is necessary to describe
    foreign keys as a constraint for maintaining the integrity of the database.

    - 2) Define column - Now it is necessary to look down the column that can be worked
    as a foreign key. You might have already understood that a foreign key is a primary
    key to other tables.

    - 3) Reference values - In this parameter you need to enter all the details that
    will result in successfully determining the foreign key automatically. It will
    check for the available primary keys and compare them with the later.

    - 4) Logical Values - This constraint parameter is used to determine the logical
    entity of the foreign key. You can use it to check with any foreign expression
    values.

    - 5) CHECK - As explained before, a check can be used to look at any logical or
    equivalent values provided by the database administrator.


    A foreign key is usually called a child table to the source table. The other table
    is known as the primary or target table. While dealing with foreign key operations
    we will also need to deal with referential integrity constraints. These are the
    constraints that provide insert and update rules to perform operations.


    With this, we have completed a brief introduction to foreign key statements. In
    the next section, we will look at DDL statements dealing with dropping and deleting.


