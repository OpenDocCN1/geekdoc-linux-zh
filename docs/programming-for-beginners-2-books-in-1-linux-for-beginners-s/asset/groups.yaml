    # Loops


    Loops are usually very important for any programming language. SQL is not an exception.
    Loops usually repeat until the given condition is satisfied and then executes
    the logical expression that is present. Loops are very useful if you are executing
    data based on a single condition. There are many loops in SQL such as repeat and
    While. We will discuss both of them in detail now.


    Before discussing while loop it is mandatory to explain about cursors because
    a lot of cursors while loops are used for their creation.


    # What are cursors?


    Cursors allow developers to extract one record at a time from the result set of
    multiple data records, thus enabling users to more flexibly process the result
    set returned from SQL operations. For example, the commonly used SELECT query
    statement can return a result set, while the user needs to read each record one
    by one from the result set. At this time, the cursor can be used to complete this
    operation.


    The cursor is a structure similar to the C language pointer, which includes result
    set and cursor position pointing to records in result set. The cursor is used
    as a pointer to traverse the result set (pointing to one row at a time). Readers
    can understand that cursor is a data buffer, which stores query results, and users
    can extract data from this buffer by SQL statements.


    When using SQL statements to process data, all qualified data can be operated,
    and in many cases, these qualified data need to be operated one by one. If there
    is no cursor, this operation will be completed by the front-end high-level programming
    language.


    This not only wastes the resources of the server where the program is located
    but also wastes the network resources, which increases the whole data operation
    cycle and reduces the user experience. Cursors can effectively solve such problems
    on the database server.


    The use of cursors should be done step by step. It mainly consists of four steps:
    declaring cursors, opening cursors, traversing data in cursors and closing cursors.
    When readers begin to learn cursors, they can get the result with the hard effort
    by remembering these steps.


    Cursors must be created before use. However, there is no specific requirement
    for the location where the cursor is created, as long as it is guaranteed to be
    created before the code that uses the cursor. The key statement that declares
    the creation of the cursor is DECLARE CURSOR. Once the cursor is successfully
    created, its name will be used as the user identifier, that is, the cursor will
    be called through the cursor name.


    Here is the SQL statement:


    ```

    DECLARE CURSOR { While execution statement }

    ```


