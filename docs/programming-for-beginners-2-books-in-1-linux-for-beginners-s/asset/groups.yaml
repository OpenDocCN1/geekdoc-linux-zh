    ## Using DML statements for views


    ALTER VIEW statement in SQL can modify views. The syntax of the ALTER VIEW statement
    differs from that of the CREATE VIEW statement by only one ALTER word.


    Here is the syntax:


    ALTER VIEW {View name} {Enter parameters}


    This shows that the ALTER VIEW statement is very similar to the CREATE VIEW statement.
    If the original view was created with CHECK OPTION, then these options can only
    be modified if they are also included in ALTER VIEW.


    Note: ALTER VIEW statements do not support adding, deleting, or changing the type
    of one or more individual columns in an existing view.


    The ALTER VIEW statement does not appear to add functionality to the data definition
    language. ALTER VIEW statement does not provide a shortcut to change the definition
    of the view. As mentioned earlier, the statement is the same as the CREATE VIEW
    statement in all other aspects except the name (ALTER instead of CREATE).


    Therefore, when modifying a view, you can also use the DROP VIEW statement to
    delete the existing view, and use the new structure to execute the CREATE VIEW
    statement to recreate the view.


    However, using ALTER VIEW statements have advantages over executing DROP VIEW/CREATE
    VIEW statements sequentially. When a view is deleted through the DROP VIEW statement,
    the database management system automatically deletes any triggers created on the
    view.


    Then, when the view is recreated, the system neither restores the trigger on the
    view nor GRANT any access to the user name (or role) that has permission to the
    original view.


    Similarly, if you modify a view by executing the DROP VIEW statement and then
    executing the CREATE VIEW statement to recreate the view, you must reenter the
    codes of all triggers on the original view and grant access to the view users,
    roles, and accounts that are allowed to use the original view.


    On the contrary, if the ALTER VIEW statement is executed to make the same modification
    to the view definition, the DROP VIEW statement does not need to be executed,
    and the triggers and permissions granted on the original view will remain on the
    new view.


    ## Adding Data through Views


    In addition to displaying data through a view, you can also use INSERT statements
    to add data to the view''s base table through a view. When adding data using INSERT
    statements on a view, the following rules must be met.


    - (1) When using the INSERT statement to insert data into the data table, the
    user must have the right to insert data.

    - (2) Since the view only refers to some fields in the table, the values of the
    fields referenced in the view can only be explicitly specified when inserting
    data through the view. For those fields that are not referenced in the table,
    you must know how to fill the data without specifying a value.

    - (3) Views cannot contain combinations of multiple field values or contain results
    using statistical functions.

    - (4) A view cannot contain the DISTINCT or GROUP BY clause.

    - (5) If WITH CHECK OPTION is used in the view, the clause will check whether
    the inserted data meets the conditions set by the SELECT statement in the view
    definition. If the inserted data does not meet this condition, the SQL Server
    will refuse to insert the data.

    - (6) You cannot use data modification statements for multiple underlying tables
    in one statement. Therefore, if you want to add data to a view that references
    multiple data tables, you must use multiple INSERT statements to add it.


    Here is the syntax:


    INSERT {Name of the view} {Data values}


    ## Simplify Complex Queries through Views


    Writing multi-table joins in SQL is common because almost all queries include
    extracting and correlating data from two or more tables. Therefore, it is much
    easier to create and use join table views than to re-enter the same query repeatedly.


    Moreover, many administrators who are not familiar with SQL and do not have time
    to learn SQL in-depth only know how to write simple table queries.


    By using views to combine multiple tables, administrators will have a single table
    containing data from several tables and can use a single table SELECT statement
    to obtain the required data from the database, this greatly simplifying the use
    of complex SQL statements.


    ## Encrypt Views


    After the view is created, the system stores the definition of this view in the
    system table comments. You can view the definition of the view by executing the
    system stored sp_helptext or directly opening the system table.


    SQL Server provides a WITH ENCRYPTION clause to protect the definition of views,
    which can prevent other users from viewing the code of views or hiding the source
    code when SQL is published.


    Here is the syntax:


    ```

    CREATE VIEW {Enter encryption here}

    ```


    ## Restrict User Access to Columns through Views


    Views are virtual tables and can be used in almost any place where table references
    are allowed. However, views are not physical tables stored on the hard disk like
    other tables and indexes in the database. Views consist of SELECT statements that
    extract data from rows and columns of one or more base tables (or other views).
    One of the real benefits of using views is the ability to hide some tables that
    others do not want to see.


    The second section of this chapter will deal with security operations.


    ## Database security


    Database security is usually divided into four concepts namely encryption, tracking,
    authentication and authorization.


    - a) Encryption


    Encryption is a process in which all the data we are dealing with is changed into
    random unusable data using different encryption algorithms. This encrypted algorithm
    can only be dealt with if you have the required keys for decryption. Databases
    such as SQL servers usually use encryption algorithms for security purposes.

    - b) Authentication


    Authentication is a procedure in which a database validates the credentials of
    the users and presents his instance data. Authentication is a complex process
    and has advanced in technicality as years flow. Authentication is usually done
    using secret codes known as passwords. Some of the advanced database systems will
    ask you to provide magnetic cards or fingerprints for authentication.

    - c) Authorization


    After authentication servers check the resources and will provide instances that
    you are authorized. Authorization is important if you are dealing with a lot of
    administrators. Sometimes you may want to revoke access for a particular user
    for whatever reason it may be. Authorization revokes can make this happen without
    hiccups.

    - d) Change tracking


    Advanced industries use tracking systems to track their employees. Any employee
    with any malicious intent can be easily caught by this feature tracking systems
    note down every SQL query statement that is being performed. All the statements
    are documented and can be easily seen by users with advanced privileges.


    We will discuss some of these concepts in detail after knowing about the basic
    security model of SQL. Let us go!


    # The security model of SQL


    The security model of SQL is pretty basic and deals with three major characteristics
    as explained below.

