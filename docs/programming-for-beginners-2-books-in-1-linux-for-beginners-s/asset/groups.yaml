    +   2. Configuration function


    Configuration functions can return information about configuration settings.


    +   3. Cursor function


    The cursor function can return information about the cursor state.


    +   4. Metadata function


    Metadata functions can return attribute information of databases and database
    objects. Metadata is data describing data and is usually used to describe the
    structure and meaning of data.


    +   5. Safety function


    Security functions return information about users and roles.


