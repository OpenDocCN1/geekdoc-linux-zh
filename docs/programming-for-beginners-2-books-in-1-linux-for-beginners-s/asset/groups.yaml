    ## Chapter 4: SQL commands: Joins & UNION


    Databases usually consist of different tables with different column values and
    types. However, some tables in the database consist of the same entities and can
    be used to query two database columns with precision. To retrieve data using this
    technique we use JOINS in SQL. In this chapter, we will discuss joins and their
    types in detail. Follow along!


    ## What are Joins?


    Usually, we can query columns and rows using the SELECT statement. However, SELECT
    statements only work for a single table and so is not useful for complex query
    operations. At this Joins come into operative where they can query data from two
    or more tables with the help of common columns present in the tables.


    ## What are Unions?


    Unions are used to retrieve data from two or more tables. The only difference
    between Joins and Unions is that Joins use only SELECT statement where Unions
    use a different number of SELECT statement to achieve the results.


    ## How to implement joins?


    Joins are usually implemented using two types of syntaxes. Explicit syntax deals
    with the cartesian product of two tables. Whereas implicit syntax deals with Where
    clauses. It is always recommended to use explicit functionality because it is
    easy for queries to function and operate. A lot of queries are going to discuss
    in this chapter follow the explicit syntax.


    ## Cartesian product


    Before going to learn about the advanced functionalities of Joins it is important
    to know the simple cartesian product.


    Cartesian product is a simple mathematical operation that multiplies with any
    entity restrictions. By using the cartesian product you can combine with any column
    of the other table.


    To understand the cartesian product in layman terms is just keeping two tables
    by side. For example, if Table A has 10 rows and Table B has 5 rows then the cartesian
    product will have a total of 50 rows.


    Cartesian product is often under-discussed even though being simple is because
    it gives large output tables.


    This cartesian product from SQL is explicitly known as cross join. However, with
    the time server has restricted cross join operations for its huge data taking.


    Here is the SQL statement for your reference:


    ```

    SELECT * { CROSS JOIN } {Enter parameters here}

    ```


    ## SQL Inner Join


    If cross join talks about the cartesian product of two tables join discusses natural
    join of tables.


    What is a natural join?


    To explain natural join, we need to be aware of the tables we are trying to target.
    There will be two tables known as the Source table and Target table. The source
    table is which we use a SELECT statement to extract columns and the Target table
    is the table that we use after the JOIN statement.


    To understand Natural joins in a better way we will discuss this concept in three
    scenarios. Follow along!


    ### Scenario 1:


    If there is only one column in both of the tables


    Explanation:


    To demonstrate this example, we will introduce two tables known as College and
    Place.


    College table has 4 columns named - BRANCH, BRANCH_NAME, HOD, STREAM


    Place table has 6 columns named - PLACE_ID, STREET, PINCODE, TOWN, COUNTY, STREAM


    Now, if we carefully observe notice that both tables contain a similar column
    known as STREAM. This column can be used as a Foreign key to perform a natural
    join.


    Here is the SQL statement to perform Natural join:


    ```

    SELECT {enter columns here} FROM ( Source table) JOIN ( target table)

    ```


    Note:


    Always enter all the columns you want to retrieve in the second parameter position.
    For the table mentioned above, we will enter Stream as a parameter for join to
    function.


    ### Scenario 2:


    If there are more than two identical columns


    Explanation:


    If you have observed more than two identical columns in the target and source
    table then it is important to enter only one column for retrieving your desired
    columns. This type of join is known as pure natural join. Entering one column
    can recognize all other columns and will give results.


    Here is the SQL statement:


    ```

    SELECT {enter columns here } FROM { Source table } JOIN { target table } AND {
    Linked columns }

    ```


    ### Scenario 3:


    Retrieve columns by USING clause


    Explanation:


    If there are two columns and you need only one column you can use the USING column
    to retrieve the column you are wishing for.


    Here is the SQL statement:


    ```

    SELECT {enter columns here } FROM { Source table } JOIN { target table } USING
    { Required columns }

    ```


    With this, we have given a thorough and complete introduction to inner join and
    in the next section, we will discuss Left and Right joins using a few examples.
    Before discussing these lets us discuss equijoins and non-equijo for better understanding
    of these concepts. Although not solely responsible for Right and Left joins these
    concepts are important for an overall understanding of the subject. Follow along!


    ## What is Equijoin?


    Equijoin refers to comparing connected columns using an operator equal to "="
    in the connection condition. The query result will list all columns in the connected
    table, including duplicate columns. The types of connection columns in connection
    conditions must be comparable, but not necessarily the same. For example, it can
    be both character type or both date type; It can also be an integer type and a
    real type because they are both numeric types.


    Although the types of columns in the connection condition can be different, it
    is better to use the same type in the application, because the system takes a
    lot of time to perform type conversion.


    ## What is Non-equijoin?


    In SQL, both equijoin and equijoin are supported. Non-equijoin refers to comparing
    connected column values using comparison operators other than the equality operator
    in the join condition. Some of the operators are relational and negation operators
    like <.


    ## SQL RIGHT & LEFT JOIN


    SQL Right and Left join works on the concept of external join. The inner join
    described in the previous sections compare each column of records FROM the table
    in the FROM clause and returns all records that satisfy the join condition.


    However, sometimes it is necessary to display all records in the table, including
    those records that do not meet the connection conditions. In this case, the external
    connection is required. Using outer join can easily query other records in a table
    in the join result. The query result of the external connection is an extension
    of the query result of the internal connection.

