    the pipe character learned earlier between the two commands and let the at command
    receive the output information of the echo command, so as to achieve the goal
    of creating a planned task in a non-interactive way.


    ```

    [root@sample ~]# echo "systemctl restart service" | at 23:30

    ```


    ```

    2 Fri May 12 23:00 2019


    [root@sample ~]# at -l

    ```


    2 Fri May 12 23:00 2019


