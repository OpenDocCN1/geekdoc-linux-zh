    # Chapter 11: Basic SQL mathematics and statistics


    Mathematics, Statistics, and data are closely interlinked and are mutually operative.
    Various data related subjects such as data analysis, data analytics and database
    query languages are dependent upon mathematical relations and statistics. In this
    book, we have decided to introduce some mathematical and statistical concepts
    for you to expand your skillset in SQL and perform complex operations. However,
