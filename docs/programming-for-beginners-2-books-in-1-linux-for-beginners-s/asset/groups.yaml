    # Chapter 3: Fundamentals of Shell


    This chapter first introduces the system kernel and then the relationship and
    function of terminals, then introduce the 4 advantages of Bash interpreter and
    makes you learn Linux commands.


    This book carefully selects dozens of Linux commands that readers need to learn
    first, which are related to topics such as system work, system state, working
    directory, files, directories, packaging, compression, and search. By summarizing
    the above commands into various subsections in this chapter, you can learn the
    most basic Linux commands one by one in different categories, laying the groundwork
    for future learning of more complex commands and services.


    Generally speaking, computer hardware is made up of the arithmetic unit, controller,
    memory, input/output devices, etc. What makes all kinds of hardware devices perform
    their respective functions and what can work is the system kernel?


    The kernel of the Linux system is responsible for completing management tasks
    such as allocation and scheduling of hardware resources. Thus, the system kernel
    is too important for the normal operation of the computer, so it is generally
    not recommended to directly edit the parameters in the kernel, but to lets manage
    the computer through programs or services developed based on the system call interface
    to meet the needs of daily work.


    It must be affirmed that some graphical tools (such as [Logical Volume Manager
    (LVM)) in the Linux system is really very useful and greatly reduce the probability
    of operation errors of operation personnel, which is commendable.


    However, many graphical tools are written and are often designed to complete certain
    work, lacking the original flexibility and controllability of Linux commands.
    Moreover, graphical tools consume more resources than Linux command-line interfaces,
    so experienced operation and maintenance personnel will not even install graphical
    interfaces for Linux systems, and they need to connect directly to the Linux system
    remotely through command mode when starting operation and maintenance work. I
    have to say that this is quite efficient.


    # What is a shell?


    Shell is such a command-line tool. Shell (also called terminal or shell) acts
    as a translator between humans and kernel (hardware). When the user "tells" some
    commands to the terminal, it'
