    will call the corresponding program service to complete some work. The default
    terminal used by many mainstream Linux systems including the Linux mint system
    is the Bash (Bourne-Again Shell) interpreter.


    The mainstream Linux system chooses Bash interpreter, as the command line terminal,
    which has the following four advantages. Readers can appreciate the beauty of
    the Linux system command line in their future study and production work, and truly
    love them from their hearts.


    - 1. Use up and down arrow keys to retrieve Linux commands previously executed

    - 2. Command or parameter can be completed with the Tab key only by entering the
    first few digits

    - 3. Strong batch processing

    - 4. It has practical environment function.


    Since there is already a useful "translator" like Bash in Linux, it is necessary
    to learn how to communicate with it. To complete various tasks accurately and
    efficiently, it is not enough to rely solely on the commands themselves, but also
    to flexibly adjust the parameters of various commands according to the actual
    situation.


    When you have finished this book and have some experience, you will surely be
    able to understand the mysteries of Linux commands. A common format for executing
    Linux commands is this:


    # Name of the command [Parameters] [Additional details]


    Note that the command name, command parameters and command objects should be separated
    by the space bar.


    Command objects generally refer to the files, directories, users and other resources
    to be processed.


    Command parameters can be in a long format (complete option name) or short format
    (an abbreviation of a single letter), with -- and - prefixes respectively.


    Linux novice cannot execute commands mostly because the parameters are relatively
    complex, and the parameter values need to be changed according to different commands
    and requirements. Therefore, if you want to flexibly match various parameters
    and perform the desired functions, you need a long period of experience.


    Examples of Long and Short Formats of Command Parameters


    Long format: man --usage

    Short format: man -u


    In the next section, we will discuss some of the basic Linux commands in detail.
    Follow along!


    ## Basic Commands


    ### 1) echo command


    The echo command is used for the value extracted from the terminal output string
    or variable is in the format


    "echo [enter the string | $ enter the variable]"


    For example, the command to output the specified string "This is an example" to
    the terminal screen:


    [root@sample ~]# echo This is an example


    This command will display the following information on the terminal screen:


    This is an example


    ### 2) date command


    The date function can help us to display and set the time or date of the system
    in the format of "date [option][+specified format]"


    For example, the packed files are automatically packed into "information-2019-8-2.tar.gz"
    according to the format of "year-month-day". Users only need to look at the file
    name to get a general idea of the backup time of each file.


    The date command to view the current system time in the default format is as follows:


    ```

    [root@sample ~]# date

    ```

    Sat Oct 2 6:21:43 IST 2019


    The date command sets the current time of the system to 9:30 on November 1, 2019,
    is as follows:


    ```

    [root@sample ~]# date -s "20191101 9:30:00"

    ```

    Sat Nov 1 09:30:00 %j in IST 2019


    The parameter %j in the date command can be used to see what day of the year today
    is. This parameter can well distinguish the old and new backup time, that is,
    the larger the number, the closer it is to the current time.


    ### 3. reboot command


    The reboot function can help us to restart the system and is formatted as reboot.


    Since restarting the computer will involve the management authority of hardware
    resources, the root administrator can be used by default to restart the computer.


    The command is as follows:


    ```

    [root@sample ~]# reboot

    ```


    ### 4. power off command


    The poweroff function can help us to shut down the system and is in the format
    poweroff.


    This command is the same as the reboot command and involves the management authority
    of hardware resources. therefore, only root administrators can shut down the computer
    by default.


    The command is as follows:


    ```

    [root@sample~]# poweroff

    ```


    ### 5. wget


    The wget function can help us to download network files in the terminal in the
    format of "wget [Parameters] Download Address".


    If you don''t have any management experience of Linux system, you just need to
    know the parameters and functions of wget command at present, and then look at
    the following demonstration experiment.


    ```

    [root@sample ~]# wget {enter the url address here}

    ```


    Next, we use the wget command to download recursively all page data and files
    in the website will be automatically saved to the directory named under the current
    path after downloading.

    the command to perform this operation is wget -r -p {enter url and path here}.


    ### 6. ps command


    The ps function can help us to view the process status in the system in the format
    of "ps [parameters]",


    It is estimated that the reader will be shocked when executing this command for
    the first time-how can there be so many output values, and how can this be seen?


    There are many processes running all the time in Linux system. If they can be
    managed reasonably, the performance of the system can be optimized. In Linux system,
    there are five common process states, namely, run, interrupt, non-interrupt, zombie
    and stop.


    As mentioned earlier, command parameters in the Linux system can be divided into
    long and short. In Linux system, there are five common process states, namely,
    run, interrupt, non-interrupt, zombie and stop.


    ### 7. top command


    The top function can help us to dynamically monitor information such as process
    activity and system load, and its format is top. The top command is quite powerful
    and completely regarded as the "enhanced version of Windows Task Manager" in Linux.


    ### 8. pidof command


    The process number value (PID) of each process is unique, so different processes
    can be distinguished by PID. For example, you can use the following command to
    query the PID of ftp service:


    ```

    [root@sample~]# pidof ftp

    2232

    ```


    ### 9. kill command


    The kill function can help us to terminate a service process with a specified
    PID in the format "kill [parameter] [process PID]"


    Next, we use the kill command to terminate the process represented by the pidof
    above. the command is as follows. The effect of this operation is equivalent to
    forcibly stopping ftp service.


    ```

    [root@sample ~]# kill 2233

    ```


    ### 10. killall command


    The killall function can help us to terminate all processes corresponding to a
    service with a specific name, the format is: "killall [parameter] [service name]".


    Generally speaking, the service program of complex software will have multiple
    processes cooperating to provide services for users. If it is troublesome to end
    these processes by one, then the killall command can be used to end all processes
    carried by a service program in branch.


    Let''s take httpd service program as an example to end its entire process. When
    httpd service program is not installed in system by default, all you need to do
    at this time is look at the operation process and output results, and then practice
    after learning the relevant contents.


    ```

    [root@sample ~]# killall httpd

    ```

