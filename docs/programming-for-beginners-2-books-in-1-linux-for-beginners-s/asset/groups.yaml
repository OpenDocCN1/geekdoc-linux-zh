    stages in the life of a process according to the Linux guides. Even if they are
    not practically visible to us learning about the Process lifecycle can help you
    look at things from a different perspective.


    According to the resources, there are five stages in the life cycle of a process:


    - 1) Running: This is the state where the designated process is ready to run or
    already started running upon the initiation.

    - 2) Interruptible: Interruptible is a process lifecycle where it is waiting for
    others signals to proceed further. Child processes wait for the for() system call
    from parent processes to proceed further. This is a perfect example for this process
    state.

    - 3) Uninterruptible: This is a process state where the process is going to end
    due to the non-receiving signal from the process that need to do. This may occur
    due to overload on the resources or due to hardware problem. Process halts in
    this process.

    - 4) Stopped: This is a process lifecycle where the process is automatically stopped
    or stopped by the root user. When the process ends system resources are freed
    and allocated to other processes. However, you should be remembered that the stopped
    process can be easily restarted if wanted.

    - 5) Zombie: This is a process life in which the designated process gets terminated
    from the system and halts without any further response. However, when you look
    at the process tree structure the process can be found. These types of processes
    are known as zombie processes.


