    ## Advanced Shell Concepts


    The shell interpreter can be regarded as a "translator" between human and computer
    hardware. It is used as a communication medium between users and the Linux system.
    In addition to supporting various variables and parameters, a shell terminal interpreter
    also provides control structure characteristics unique to high-level programming
    languages such as loops and branches. To correctly use these features in the Shell,
    it is particularly important to issue commands accurately.


    Shell commands work in two ways: interactive and batch.


    - Interactive: The user executes each command immediately.

    - Batch: The user writes a Shell script in advance, and the Shell will execute
    many commands in the script at one time.


    Many Linux commands, regular expressions, pipe symbols, data stream redirection
    and other syntax rules learned before will be used in Shell scripts, and internal
    functions need to be modularized and processed through logical statements to finally
    form Shell scripts seen in daily life.


    Looking at the SHELL variables, you can see that the current system already uses
    Bash as the command line terminal interpreter by default:


    ```

    [root@sample ~]# echo $SHELL

    ```


    ```

    /bin/bash

    ```


    It is estimated that readers will feel tired and unloved after reading the complicated
    description of Shell scripts in the below article. However, the above refers to
    the writing principle of an advanced Shell script. Using Vim editor to write Linux
    commands into a file in sequence, this is a simple script.


    For example, if you want to view the current working path and list all files and
    attribute information in the current directory, the script to implement this function
    should look like this:


    ```

    [root@sample ~]# vim srujan.sh

    ```


    The name of the Shell script file can be arbitrary, but to avoid being mistaken
    for an ordinary file, it is recommended to add the .sh, suffix to indicate that
    it is a script.


    In the above .sh script, there are three different elements; the script declaration
    (#) is used to tell the system which Shell interpreter to use to execute the script;
    The comment information (#) in the second line is the introduction information
    of the script function and some commands that others can quickly know the function
    of the script or some warning information when they see the script content in
    the future. The executable statements on the third and fourth lines are the Linux
    commands that we usually execute.


    In addition to directly running the Shell script file with the bash interpreter
    command above, the second way to run the script is by entering the full path.
    However, by default, an error message will be prompted due to insufficient permissions.
    At this time, it is only necessary to add execution permissions to the script
    file.


    However, script programs like the above can perform only some predefined functions,
    which is too rigid. For the Shell script program to better meet some real-time
    requirements of the user and to finish the work flexibly, the script program must
    receive the parameters input by the user as did when executing the command.


    The Shell scripting language in the Linux system has already considered these
    and has built-in variables for receiving parameters. Spaces can be used between
    variables. For example, $ corresponds to the name of the current Shell script
    program, $# corresponds to a total of parameters, $* corresponds to the parameter
    values of all locations, $? corresponding is to display the return value of the
    last command execution, while $1, $2, $3 ... respectively corresponding to the
    parameter value of the nth position.


    Although the most basic Shell scripts can be written at this time using Linux
    commands, pipe characters, redirection, and conditional test statements, such
    scripts are not suitable for production environments. The reason is that it cannot
    adjust the specific execution command according to the real work demand, nor can
    it realize automatic execution according to certain conditions. For example, we
    need to create 1000 users in batch. First, we need to judge whether these users
    already exist. If they do not, they are automatically and sequentially created
    by scripts through loop statements.


    ## Automation by Advanced shell scripting


    Experienced system operation and maintenance engineers can enable Linux to automatically
    enable or stop services or commands within a specified period without human intervention,
    realizing automation of operation and maintenance. Although we already have a
    powerful script program to execute some batch processing, it would be too painful
    if you still need to hit the enter key at 2 a.m. every day to execute the script
    program.


    Planning tasks are divided into one-time planning tasks and long-term planning
    tasks, which can be understood as follows.


    - One-time planning task: start the website service at 11:30 tonight.

    - Long-term planning task: pack and backup the /home/linux directory to takeback.tar.gz
    at 3:25 a.m. every Monday.


    As the name implies, a one-time scheduled task is executed only once and is generally
    used to meet temporary requirements. We can use at command to realize this. If
    you want to view one-time tasks that have been set up but not yet executed, you
    can use the at -l command. When using at command to set up one-time tasks, interactive
    method is adopted by default. For example, use the following command to set the
    website service at 23:30 tonight.


    ```

    [root@sample ~]# at 23:30

    ```


