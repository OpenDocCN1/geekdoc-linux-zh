    注册对话框有两个选项卡：“通用”和“连接属性”。


    “通用”选项卡包含设置信息，如服务器类型、服务器名称、登录身份验证方法、用户名、密码、已注册服务器名称、已注册服务器描述等。


    “连接属性”选项卡包含设置信息，如要连接的服务器中的数据库、连接到服务器时使用的网络协议、发送的网络数据包大小、连接时等待建立的秒数、连接后等待任务执行的秒数等。


    您应该仔细输入这些信息以进入下一个阶段。


    9) 在“服务器身份验证”选项中，重新选择已登录用户的身份验证方法。选择完成后，点击“确定”按钮，将弹出一个“Microsoft SQL Server Management
    Studio”提示，提示重启 SQL Server 后所做的更改将不会生效。


    10) 现在点击界面上的“完成”按钮，您就可以准备好使用 SQL 服务器来维护网络和 Web 应用数据了。


    ## 启动和停止 Oracle 数据库实例


    启动 Oracle 数据库实例的过程分为三个步骤：启动实例、加载数据库和打开数据库。用户可以根据实际需要不同的模式启动数据库。


    Oracle 数据库实例在启动时必须读取初始化参数文件以获取有关启动的参数配置信息。如果启动语句未指定 pfile，Oracle 将首先读取默认位置的服务器初始化参数文件
    spfile。如果没有找到默认服务器初始化参数文件，将读取默认位置的文本初始化参数文件。


    下面将分别解释启动语法中列出的几种 STARTUP 模式。


    ```

    L. NOMO model

    ```


    此启动模式仅创建实例（即创建 Oracle 实例的各种内存结构和服务进程），不加载数据库，也不打开任何数据文件。


    代码和运行结果如下：


    ```

    SQL> connect system/sample instance as connect;

    ```


    ## 2. MOUNT 模式


    此模式启动实例、加载数据库并保持数据库关闭状态。


    将数据库实例启动到 MOUNT 模式时，代码和运行结果如下：


    ```

    SQL> shutdown {Enter the condition}

    ```


    ## 3. OPEN 模式


    此模式启动实例、加载并打开数据库是标准的启动模式。想要对数据库执行各种操作的用户必须使用 OPEN 模式启动数据库实例。


    将数据库实例启动到 OPEN 模式，代码和运行结果如下：


    ```

    SQL> startup

    ```


    与启动数据库实例一样，关闭数据库实例也分为三个步骤，即关闭数据库、卸载数据库和关闭 Oracle 实例。


    关闭的 SQL 语句如下：


    ```

    SHUTDOWN [Enter the parameter here]

    ```


    ## 1. NORMAL 方法


    这种方法被称为正常关闭。如果对关闭数据库的时间没有限制，它通常用于关闭数据库。


    代码和运行结果如下：


    ```

    SQL> shutdown normal;

    ```


    数据库将根据语法立即关闭。


    ## 2. TRANSACTIONAL 方法


    这种方法被称为事务关闭。其主要任务是确保所有活动事务都能提交，并在尽可能短的时间关闭数据库。


    ## 3. ABORT 模式


    这种方法被称为终止关闭方法，是强制性且破坏性的。使用此方法将强制中断任何数据库操作，可能会丢失某些数据信息并影响数据库的完整性。除非无法使用其他三种方法关闭数据库，否则应尽可能避免使用此方法。


    ## 启动 MySQL Workbench


    MySQL Workbench 是由 MySQL AB 发布的可视化数据库设计软件；其前身是 FabForce 的 DB Designer。MySQL Workbench
    是为开发者、DBA 和数据库架构师设计的统一可视化工具。它提供了高级数据建模、灵活的 SQL 编辑器和全面的管理工具。它可以在 Windows、Linux
    和 Mac 上使用。


    要在 Windows 中使用，请点击 SQL Server 端并选择 workbench 选项打开界面。如果您使用的是 Linux 和 Mac，在进入 SQL
    实例后需要输入命令 ''workbench''。


    ## 编写第一个 MySQL 代码


    首先，当您尝试编写第一个 MySQL 代码时，获取一个良好的文本编辑器来编写查询是非常重要的。SQL 软件通常为用户提供查询工具。详细学习语法非常重要。第一次编写的代码总是很笨拙的，很容易让你失去耐心。但请记住，在通过代码让事情变得更好之前，有很多东西要学。


    在第三章中，我们将详细查看 SQL 语句。但现在，在下一章中，我们将学习从 SQL 服务器管理软件本身创建实例。让我们开始吧！


    ## 第 2 章：数据库的定义


    本章将介绍了 SQL 管理服务器的使用以及针对系统特性执行不同的操作。我们将从创建表开始，一直到使用 SQL Server Management Studio
    创建触发器。这一章非常直观，将向您介绍 SQL 软件提供的界面。随着学习深入，我们将使用数据定义语言和数据操纵语言讨论各种高级 SQL 查询语句。现在，让我们学习
    SQL 服务器管理系统的所有功能。


    服务器管理系统由实例上列出的所有服务器组成，我们需要点击想要操作的服务器。当我们点击服务器时，它会要求授权信息。身份验证对于数据库的安全至关重要。


    ## 管理数据库


    连接数据库后，您将对服务器拥有完全控制权。管理功能将允许您更改信息。


    ## 对象管理器


    对象管理器是所有实例的树形视图。它是 SQL 软件中最友好的界面之一。


    ## 创建服务器组


    通常，SQL 允许用户为数据库创建组。在高级应用程序系统中，这被加密密钥所取代。


    ## 启动和停止服务器


    可以使用可用的选项轻松启动或停止数据库。您只需要点击按钮结束数据库。


    ## 创建数据库


    首先，进入对象管理器并选择您所需的服务器。在通过验证后，点击左侧窗格，它将列出选项。在这些选项中选择“新建数据库”来创建实例。您甚至可以选择对象属性并更改某些信息。例如，您可以输入数据类型信息。您甚至可以为数据库提供行列数。点击界面上的创建按钮后，更改将会发生。


    ## 修改表


    您可以使用 SQL Server Management Studio 轻松更改表中的列数。面板提供了一个名为修改的选项。您可以更改数据库的所有属性，并且几秒内就会生效。


    通过此修改选项，您可以更改主键和外键值，以便执行复杂的查询。


    ## 管理表


    管理是 SQL 软件中完全不同的选项。当您点击管理实例时，将显示所有属性。您可以查看所有可用的数据值和类型并进行更改。例如，您可以更改列的长度并将数据类型从小数更改为整数。这一切只需点击一下。


    您甚至可以查看数据库的 ER 图，以理解实体和实例之间的关系。


    ## 删除表


    删除的操作与管理和创建类似。首先，选择您想要删除的表。右键点击表并点击删除实例选项。进入选项后，您将收到一个是否删除的提示。如果您点击“是”，该表中的所有数据将被删除。无法从
    SQL 服务器管理软件恢复已删除的列。但是，您可以使用 SQL 服务器可用的恢复模型来恢复已删除的表。


