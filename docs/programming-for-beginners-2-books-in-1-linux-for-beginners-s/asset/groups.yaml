    ## 选择器与操作 (Selector and Action)


    通过上述参数，我们可以轻松地过滤出有效且所需的日志。现在通过这些过滤器，会有大量的日志被跟踪。然而，查看每一条存在的日志并不可靠。因此，我们使用选择器和操作功能来进一步过滤出我们正在寻找的日志文件。


    例如：通过使用选择器和操作，我们可以只过滤出处理系统的紧急日志文件。


    在继续下一节之前，我们需要了解消息选择器（Message selector）和消息操作（Message action）。


    a) 消息选择器


    消息选择器是用于从提供的日志文件集中检查哪些日志是重要且必要的的功能。


    ## b) 消息操作


    消息操作是一个参数，它让我们决定对所选的消息可以做什么。你可以通过编程的方式，让它们被发送到服务器或文本文件中。


    许多像 Loggy 这样的公司正在开发软件，通过根据你的要求自动处理一切来使其变得简单。如果你感兴趣，可以研究第三方日志解决方案。


    ## 日志操作与 Logger 命令 (Logging Actions and Logger Command)


    以下是 Linux 管理员需要学习的常用日志操作，以便更好地组织资源。


    - a) 将所有日志消息发送给用户或定义的服务器。这通常是自动完成的。你只需要在此输入信息即可。

    - b) 你可以将所有选定的日志消息发送给所有用户和特定用户。记住在尝试发送给所有用户时使用星号 `*`。

    - c) 你还可以将选定的日志消息发送到网络或远程网络中激活的 syslog。这在你与团队工作时会非常有用。


    `logger` 命令是 Linux 为用户提供的一种特殊实用程序，用于更好的日志分析。你可以轻松地输入优先级等参数来获取有效信息。在下一节中，我们将详细讨论日志轮（Log
    Rotation）并结束本章。


    ## 日志轮 (Log Rotation)


    日志文件通常较小。然而，随着时间的推移，Linux 系统会产生大量的日志文件。日志文件可能会迅速填满空间并导致效率低下。因此，建议使用 Linux 系统提供的日志轮功能，根据预定义的策略自动发送你的日志文件。


    正如我们之前讨论过的，这是自动的，并由 Linux 系统的 `crondemon` 控制。`logrotate` 工具也可以压缩日志文件以减小大小。


    使用 `logrotate` 是一项复杂的任务，需要你创建一个单独的配置文件获得获得结果。在本节中，我们将解释一个让日志轮在你的系统中运行的简要步骤。跟随操作！


    - 1) 启动示例配置文件


    首先查看 `logrotate.conf` 文件并赋予其 root 权限。你可以在配置文件中更改旋转时间，例如每周或每月。


    使用并填充如 `rotate`、`compress` 等参数，以实质性增加日志轮机制的影响。


    - 2) 将该配置文件添加到系统日志中


    现在你需要将此日志轮配置文件发送到 `/etc/logrotate.d` 进行链接。


    - 3) 自定义


    在这一步中，你可以自定义各种选项，如 `log rotate`、`shared scripts` 以提高系统效率。


    完成所有自定义后，你需要做的就是使用以下命令开始运行：


    ```

    root@sample : logrotate /etc/logrotate.conf --debug

    ```


