    # Chapter 12: Log Management in Linux


    Logs are created for analysis or to troubleshoot an issue. Whenever an attack
    happens or if you are willing to go through your past actions the most logical
    thing to perform is to investigate a log file. Almost every operating system offers
    log files for their users understanding. Being an operating system that is significantly
    used by technical users offers a lot more abilities and options in log analysis
    when compared with normal day-to-day life operating systems such as Windows and
    Mac.


    Usually, administrators and users only learn about log files when there is a sudden
    mishap or crisis in the system. However, if you want a sudden and fast reflex
    solution for a problem it is better to be thorough with the log analysis. This
    chapter will give you a brief and thorough introduction to log analysis in Linux
    using various commands.


    ## What are the Logs?


    Logs are continuous storage of timeline events of every application that is involved
    in the Linux system. Linux logging automatically stores them in the system for
    troubleshooting purposes.


    It should be remembered that Linux applications can create log files on their
    specified directory. For example, Google chrome browser uses a chrome directory
    to store the logs. Linux system specifications allow applications to keep logs
    on their desired location.


    Every Linux system delivers logs and stores them in /var/log directory. Remember
    that only root users can edit or read the log files present. Linux makes logs
    for every system. Kernel system, package managers, booting procedure, database
    resources, and every other system procedure produces logs.


    Log files store all the errors that systems deal with and can be an easy catch
    for attackers to understand all the activities that the root and other users perform.
    Log files are like a weapon on whose hands which can be used for both good and
    bad purposes.


    Forensic investigators usually use a logging system to find about the whereabouts
    of any attacks that exploited the system. However, hackers are often intelligent
    and often manipulate or change the log files into an unreadable format.


    In the next section, we will discuss log analysis in detail. Follow along!


    ## Why the Log analysis is important?


    There are numerous incidents that destroyed whole company''s reputation and destroyed
    the resources. Worm attacks and viruses often occur in a cumulative time and can
    be stopped given a chance to analyze the logs that are going on in the system.


    Multinational Companies usually make their logging systems while using Linux whereas
    few of them already premade logging systems. As a matter of fact Linux provides
    some great third party tools that can complete the log analysis with best results.


    ## Linux log analysis


    Log files consists of a lot of valuable information but they are often very difficult
    to extract due to their complex format. However, there are a lot of tools that
    can make Linux users process easier. The most famous utility technique is Grep
    to find the log Files.


    A lot of companies have developed advanced analytic tools to analyze the log files
    now days. These services provide log summaries and charts after a careful analysis
    of all your log files.


    In this section we Will explain some of the most common methods to perform log
    analysis


    ### 1) grep


    Grep is a search tool and is even available in windows to search the log files.
    Grep follows the basic model and searches the plain text with utmost perfection.
    Grep uses various parameters to search the files. Here we will explain an example
    for your better understanding


    To utilize grep in a perfect way you need to know what you are searching for.
    It is not an automatic process to find the results without any clue. So, make
    a brainstorm and write down the search string that will give you valid results.


    For example, "user sample" string indicates that user named sample has accessed
    the system. So, to check the log file on this parameter entering the following
    command and wait for the results


    ```bash

    grep "user sample" /var/log/Auth.log

    ```


    Output will give results with the line of the search string. You can further analyze
    it''s time using various parameters. Grep is one of the Most important tools that
    Linux administrators should be aware of.


    The next log analysis technique is to use regular expressions


    ### 2) Regular Expressions


    Regular expressions are traditionally used to remove the unnecessary waste in
    the results.

    Regular expressions help us to obtain exact results.


    Example:


    For example, imagine that there is an open port attack on "6324" and someone has
    got access.

    We need to find the authentication using the port number.


    When we try to search using the exact number we will get a lot of results that
    are coincided the timestamp, URL or some other entity that are present in the
    log. To not get these results in the search we can use regular expressions as
    shown below


    ```bash

    grep -P (?<=port:)"6324" /var/log/Auth.log

    ```


    Another technique to perform log analysis is by performing the Surround search
    method.


    Surround search is a technique to get the log lines before and after the successful
    search.

