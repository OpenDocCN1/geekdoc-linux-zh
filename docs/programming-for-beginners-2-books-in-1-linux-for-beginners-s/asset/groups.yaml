    ## Chapter 10: Control flow tools in SQL


    Linux SQL offers various logical expressions and statements to query the data
    that is present in the system. You might have already heard about these control
    flow statements in various other programming languages. SQL also provides various
    tools and we will now discuss them in detail in this chapter. Let us go!


    Before going in-depth with these statements it is necessary to understand that
    these logics will sometimes not perform well over nonexclusive constraints. So,
    if you are perfect about the logic being used it is necessary to check the constraints
    that the tables and columns possess.


    ## If..Else statement


    The first control flow tool we are going to discuss conditional statements. It
    is usually represented as ''if-else'' in the SQL statements.


    First of all, what is a conditional logic?


    Conditional logic is usually defined as a statement that whichever path it wants
    to the situations provided. It usually has two choices initially. But if we construct
    nested conditional statements then we can easily build unlimited choices for a
    statement. However, remember that the complexity of logic increases whenever we
    decide to use nested conditional statements.


    In the SQL database, conditional logics are represented using CASE expressions.


    Here is an SQL statement:


    ```

    CASE

    WHEN {Enter logic} THEN {Enter the first path}

    ELSE {Enter the second path}

    ```


    Explanation:


