    ## How do queries work?


    Queries are a principal working flow for SQL servers. Without querying operations,
    it is technically impossible to maintain or regulate database operations.


    For successful querying database checks the following essentials:


    - 1) Does the authorized user have permissions to execute this statement? If not
    terminate the statement and show Authorization error.

    - 2) If the user is authorized the SQL server will check whether the authorized
    user has permission to retrieve the data he is asking for? If not terminate the
    procedure and display data retrieval errors for the user.

    - 3) If the author is authorized and has permission to retrieve the data then
    the SQL server will check the SQL syntax that the user entered. If SQL syntax
    is correct then the querying process will start and display results to the end-user.
    If the SQL syntax is not right then syntax error will be shown.


    If the statement entered satisfies these three complexities then your statement
    will be sent to a query optimizer to analyze the syntax in detail.


    ## What is a Query optimizer?


    The query optimizer is a system that helps you to analyze the syntactical structure
    of the syntax given. The optimizer will first check at all the from clauses that
    are present and then will look at all of the indexes that are supported. After
    analyzing all the clauses optimizer will choose the best way to query the operation
    provided. According to the resources provided it will proceed.


    What happens next?


    After an execution procedure is selected by the Query optimizer it is then sent
    to the tool that you are using. This tool is the SQL application itself. Then
    the SQL application will conduct the procedure and display results for the query
    operation. If the operation succeeds the result will be shown if not an error
    will appear. There is also a chance for the query process with no results.


