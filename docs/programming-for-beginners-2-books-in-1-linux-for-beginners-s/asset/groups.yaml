    # SQL Self-connection


    Self-connection refers to the connection between the same table and itself. All
    databases process only one row in a table at a time. Users can access all columns
    in one row, but only in one row. If information of two different rows in a table
    is needed at the same time, the table needs to be connected with itself.


    To better understand self-joining, one table can be thought of as two independent
    tables. In the FROM clause, the tables are listed twice. To distinguish, each
    table must be given an alias to distinguish the two copies.


    With this, we have completed a good introduction to SQL Joins and in the next
    section, we will discuss SQL unions. Follow along!


    # SQL UNION


    In SQL Server, combined queries are completed through the UNION operator. The
    UNION operator can be displayed by combining data FROM multiple tables, but unlike
    joins, UNION is not implemented by adding multiple tables in the clause and specifying
    join conditions, but by combining the results of multiple queries.


    The following points should be noticed when using the UNION operator:


    +   (1) The number of columns in the two query statements is required to be compatible
    with the data type of the columns.


    +   (2) The column name in the final result set comes from the column name of
    the first SELECT statement.


    +   (3) In combination query, duplicate rows will be deleted from the final result
    set by default unless the ALL keyword is used.


    +   (4) The query results will automatically sort the columns in the SELECT list
    from left to right, regardless of the position of the query relative to the UNION
    operator.


    Here is the syntax:


    ```

    SELECT {UNION}

    ```


    Merging multiple result sets through UNION is explained below by using a server
    management studio.


    The operation steps are as follows:'
