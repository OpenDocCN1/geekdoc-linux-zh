    ## LINUX FOR BEGINNERS


    The easy beginner’s guide to introduce and use Linux operating system. How to
    make an easy installation, configuration, learn basics commands, fundamentals
    and technical overview.


    [Matthew Python ]


    ## Introduction


    Linux is the predecessor of the UNIX operating system that took the computer industry
    by storm in its initial days. The kernel that is the heart of Linux is named after
    its creator Linux Torvalds. Linux operating system at present is the most used
    open-source operating system now on the planet.


    To put things straight learning Linux is one of the most essential skills in today''s
    competitive world. Linux runs on almost all databases and web environments. High-level
    enterprises use Linux to maintain their networks and databases. Android, one of
    the most famous operating system also runs on the Linux Kernel. Almost every programmer
    at one point in his professional life prefers Linux to complete tasks.


    Apart from its numerous advantages Linux also offers stable and smooth performance
    than Windows. This is a comprehensive beginner''s introduction to Linux along
    with a lot of layman examples and shell codes.


    ## What is Linux?


    Linux is an operating system that runs with the help of kernel surrounded by applications
    and extensions that run with the help of it. Every application is in some way
    connected to the kernel. To explain in simple terms every part of the system uses
    the Linux kernel to run efficiently. Hardware and network communications need
    both kernel support to function efficiently. Many misunderstanding that the Linux
    kernel is an operating system but it is just a component of a complete operating
    system.


    Different distro publishers like Red Hat, Debian, Arch adopts the functionalities
    of kernel provides and adds more tools, libraries to build a complete operating
    system. Every Linux distro publisher uses certain guidelines and uses the kernel
    to customize their operating system. For example, Parrot Linux a hacking operating
    system provides different pen-testing tools for its users in the distro when they
    install.


    ## Why is Linux Essential in Today''s world?


    First of all, Linux is a must for programmers and hackers as it is much more reliable
    and robust. As is cheap to maintain almost 50% of the intranet and internet applications
    use Linux as a primary operating system. Apache software runs on Linux is primarily
    used in server-based applications.


    Linux also supports a lot of hardware systems and needs less hardware to function.
    For this reason, a lot of small industries are looking forward to starting their
    business with the help of Linux based systems. Linux based systems are also used
    in future technologies such as Artificial Intelligence, Data Science, Big Data,
    Data Analytics, Augmented Reality and Virtual Reality.


    ## What did we we cover in this book?


    This book is a complete Layman''s introduction for beginners. In the beginning,
    we will introduce Linux and its history in detail. As we proceed further, we will
    learn about installation procedures and SSH clients in detail. This book also
    provides a section where we will discuss Linux commands in detail. Different Linux
    core concepts such as process management, File management will be explained in
    detail. The last section of this book will deal with advanced shell programming
    and Log analysis that are necessary for an efficient Linux scientist.


    ## How to utilize this book perfectly?


    This book provides both concepts and programming code whenever necessary in detail.
    To utilize this book perfectly practice the concepts and implement them in your
    own projects. This becomes can also be used as a quick reference.


    Thanks for downloading this book. Let us start exploring the beautiful and exciting
    world of Linux. Let us go!


    ## Chapter 1: What is Linux?


    With the advent of technology, the world has rapidly developed. Computers have
    made a lot of things easier and are an obvious choice for doing both automated
    and complex tasks. Computers in the first generation used a lot of resources and
    had occupied large rooms to store more kilobytes of information. In the past computers
    that do basic mathematical operations are only available for commercial and military
    purposes and are in no way available for the general public.


    Due to this operating system such as Minix are often hugely priced and are often
    not affordable. However, with the entrance of Macintosh and Windows things got
    changed rapidly and households so gone got to computers. Even these revolutionary
    operating systems are commercialized and their source code remains confidential.


    Then on one fine day creation of Linux kernel has changed the scope of the open-source
    system. Now, after 25 years Linux is the most preferred operating system by all
    experts, database professionals, penetration testers and developers with hundreds
    of Linux distributions available in both free and commercial licenses.


    This chapter on all will give you a complete layman''s introduction to the operating
    system, Open source revolution, Unix operating systems, A bit of Linux history
    and information about some of the most basic and popular distributions available
    now. Let us start!


    ### What is an Operating system?


    The operating system acts as a communication between humans and computers to make
    things easier. Humans use linguistic languages to communicate among themselves
    whereas Computers use machine Languages to communicate with their resources and
    to take instructions.


    It is not practically possible to input instructions in binary languages by humans
    because it takes a lot of time and skill. This is the sole reason why programmers
    started to develop an interface that acts as a medium between humans and computers.
    As time progressed programmers understood the potential of this invention and
    started to integrate with a lot of useful operations such as Graphical user interface,
    Memory management, Process Management, Advanced security to get combined into
    an operating system.


    The most popular Operating system is windows and often shares the commercial market
    with Mac. Linux is also an operating system but is available for anyone and anyone
    can modify the kernel to create their own Linux distributions for both personal
    and commercial purposes. This special category of the operating system is called
    Open-sourced operating systems. In the next section, we will go through a thorough
    explanation about open source and discuss its impacts and challenges.


    ## What is an Open Source?


    The open source systems and software are designed on a principal motto to share
    source code file along with the software or operating system. When the desired
    user gets hands on the opensource system he is completely allowed to change the
    source code file to include new features or integrate them into hardware systems
    to develop derivative products.


    Linux is completely an open-source system and is one of the important reasons
    for its rapid increase among users. Linux user base is occupied by technical experts,
    programmers, and hackers. However, with the development of Linux distributions
    such as Ubuntu, Centos Linux has occupied a good share among normal users.


    ## What are the objectives of open source systems?


    - 1) Low risk


    Open-source systems are often not prone to bankruptcy as they are maintained not
    by individuals but by a group of enthusiastic and considerate programmers using.


    - 2) High quality


    Open source programming software is often of high quality as different contributors
    try to add new features and fix the bugs as soon as they find it. Commercial operating
    systems such as Windows are slow to fix the bugs and can sometimes result in attacks
    from hackers using an exploit. A famous example includes Ransom Worm which utilized
    a bug in the windows to exploit thousands of computers.


    - 3) Low cost


    Open-source systems are mostly developed by contributors who are willing to work
    on a project to increase their expertise and skills. These programmers don''t
    use development as a source of income to make things better for everyone involved.


    - 4) Different License Agreements


    Open-source systems also provide the usage of different licenses according to
    the creator''s decision. If you are looking forward to contributing to the open-source
    revolution it is recommended to learn about different Licenses such as GPL, BSD,
    Apache, MPL, MIT in detail.

