    Many management activities in SQL Server are performed through a special procedure
    called a system procedure. Default active procedures with the prefix "sp_" can
    easily be executed. You can execute a system stored procedure from any database
    without using the master database name to fully qualify the name of the stored
    procedure.


    ## Stored functions


    There is a small difference between stored procedures and stored functions that
    is stored functions can be used in expressions to execute statements whereas stored
    procedures are an individual entity. Stored functions help other entities to make
    the task get done.


    Here is the syntax:


    ```

    CREATE FUNCTION {Enter the name here}{Enter parameters}

    ```


    By this syntax, you can create your stored functions. Parameters consist of data
    types and index information.


