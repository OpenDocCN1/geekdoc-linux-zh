    # Improving the Readability of Query Results through UNION Statements


    UNION statement can not only merge the query results of the SELECT statement but
    also increase the readability of query results. That is, by creating aliases for
    the column names in the results, the meaning of the query results can be better
    reflected.


    Determine the Source of Data by Text in UNION


    In UNION, the source of data is determined by the text, mainly by adding a new
    column to the Result set and determining the source of data in the table through
    the new column. This method can ensure that duplicate rows in two tables are not
    deleted, and can show that duplicate rows come from different tables.


    With this, we have completed a brief explanation about JOINS and UNIONS. In the
    next chapter, we will discuss some of the advanced concepts such as Views and
    Security model in SQL. Let us go!'
