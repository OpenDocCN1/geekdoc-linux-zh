    # 第 12 章：Linux 日志管理


    日志的创建是为了分析或排故障问题。每当攻击发生时，或者你想回顾过去的操作时，执行最符合逻辑的操作就是调查日志文件。几乎每个操作系统都为用户提供日志文件以便理解。作为一种被技术人员频繁使用的操作系统，与
    Windows 和 Mac 等普通日常使用的操作系统相比，Linux 在日志分析方面提供了多得的功能和选项。


    通常，管理员和用户只有在系统发生突发故障或危机时才会接触日志文件。然而，如果你想对问题给出快速且敏捷的解决方案，最好对日志进行彻底分析。本章将带你使用各种命令对
    Linux 日志分析进行简要且深入的介绍。


    ## 什么是日志？


    日志是 Linux 系统涉及的每个应用程序的时间线事件的持续存储。Linux 日志会自动将它们存储在系统中以便于故障排除。


    必须记住，Linux 应用程序可以在它们指定的目录下创建日志文件。例如，Google Chrome 浏览器使用 chrome 目录来存储日志。Linux 系统规范允许应用程序在所需的位置保留日志。


    每个 Linux 系统都会生成日志并将其存储在 /var/log 目录。记住，只有 root 用户可以编辑或读取这些日志文件。Linux 为每个系统生成日志。内核系统、包管理器、启动过程、数据库资源以及其他所有系统过程都会产生日志。


    日志文件存储了系统处理的所有错误，攻击者可以借此了解 root 和其他用户执行的所有活动。日志文件就像手中的武器，既可以用于善目的，也可以用于坏目的。


    取证调查人员通常使用日志系统寻找利用系统的攻击踪迹。然而，黑客通常非常智能，经常会操纵或更改日志文件为不可读的格式。


    在下一节中，我们将详细讨论日志分析。请关注！


    ## 为什么日志分析很重要？


    曾有许多事件破坏了整个公司的声誉并耗尽了资源。蠕虫攻击和病毒往往累积发生，如果有机会分析系统中正在运行的日志，就可以被阻止。


    跨国公司在使用 Linux 时通常会构建自己的日志系统，而少数公司已经预装了日志系统。事实上，Linux 提供了一些出色的第三方工具，可以以最好的结果完成日志分析。


    ## Linux 日志分析


    日志文件包含大量价值信息，但由于格式复杂，通常非常难以提取。然而，有很多工具可以让 Linux 用户处理得更容易。最著名的实用技术是使用 Grep 来查找日志文件。


    如今许多公司已经开发了高级分析工具来分析日志文件。这些服务在对你所有日志文件进行仔细分析后，提供日志摘要和图表。


    在本节中，我们将解释执行日志分析的一些常用方法


    ### 1) grep


    Grep 是一个搜索工具，在 Windows 中也可以搜索日志文件。Grep 遵循基本模型并完美地搜索纯文本。Grep 使用各种参数来搜索文件。在这里我们将解释一个示例以便更好地理解。


    要完美地利用 grep，你需要知道你在搜索什么。在没有任何线索的情况下找到结果并不是一个自动过程。因此，请头风暴并写下能给你提供有效结果的搜索字符串。


    例如，“user sample”字符串表示名为 sample 的用户访问了系统。因此，要检查该参数的日志文件，请输入以下命令并等待结果：


    ```bash

    grep "user sample" /var/log/Auth.log

    ```


    输出将给出包含搜索字符串的行结果。你可以使用各种参数进一步分析其时间。Grep 是 Linux 管理员应该注意的最重要工具之一。


    下一种日志分析技术是使用正则表达式


    ### 2) 正则表达式


    正则表达式传统上用于移除结果中不必要的垃圾。正则表达式帮助我们获得精确的结果。


    示例：


    例如，假设在“6324”端口发生了开放端口攻击，并且有人获取了访问权限。我们需要通过端口号查找身份验证信息。


    当我们尝试使用精确数字进行搜索时，将得到许多与时间戳、URL 重合的结果。为了获取这些结果，可以使用正则表达式：


    ```bash

    grep -P "(?<=port:)6324" /var/log/Auth.log

    ```


    另一种执行日志分析的方法是使用搜索方法。


    搜索方法用于获取成功搜索前后的日志行。这种方法是理解的。

    这种方法可以帮助你理解搜索的优势。


    例如，服务器收到了海量的匿名请求。这种搜索技术可以分析是否存在正在进行的破解攻击。在下一节中，我们将详细讨论 syslog 文件。


    ## Syslog


    Syslog 是 Linux 发行版为用户提供的通用日志功能。它是一个接收应用程序日志请求并根据用户要求将其发送回服务器或地址的服务的服务。


    ### syslog 如何工作？


    Syslog 是一个在整个 Linux 系统中激活日志系统的配置工具。当 syslog 启动时，会发生很多事情，我们将对此进行详细解释。


    - 首先，syslog 使用服务搜索项。该条目位于 /etc/syslog。在服务成功启动后，可以执行。

    - 服务启动后，syslog 监控 Linux 中运行的所有应用程序并持续监控配置文件。

    - 如果在应用程序日志文件和 syslog 配置之间发现相似之处，则会将特定的日志消息存储在单独的日志或根据用户指令处理。这就是 syslog 的工作方式。在下一节中，我们将详细讨论
    syslog 条目分析。


    ## syslog 条目分析


    通常有四个决定日志功能的分析因素。对于理解日志细节非常重要。


    1. Facility（设施）

    2. Priority（优先级）

    3. Selector（选择器）

    4. Action（动作）


    在本节中，我们将对所有四个概念进行简要讨论，以便你对日志分析有良好的理解。


    ### 1) Facility


    该实体存储发送日志报告的文件或应用程序的信息。有很多可用应用程序，如文件传输协议、邮件等。


