    Libraries in the world days use to create bundles of registers to track the books
    that are Loaned by the civilians. However, after the advent of computers became
    easier with Libraries getting equipped with Library management systems. This software
    usually stores every detail of the book, Library members and details about the
    books that are on hold. All of this information is stored in the databases in
    the cloud and Library members can easily access their Library account online with
    encrypted safety.


    # Small Exercise:


