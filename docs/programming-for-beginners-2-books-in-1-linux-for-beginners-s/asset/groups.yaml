    ## 基于 SSH 密钥的认证


    如上一节所述，SSH 密钥认证是 Linux 中最常用的服务之一。要使用密钥认证，你需要将编码后的公钥上传到 SSH 服务器。


    务必以普通用户身份创建密钥，因为 root 限制会导致其他人无法进行认证。


    这里我们解释生成和导入 SSH 密钥的逐步步骤：


    - 1) 第一步中，我们将创建一个带有输入密码短选项的密钥对。你需要确认密码短，然后将生成你的加密密钥。


    以下是命令：

    ```bash

    root@sample: ssh-keygen

    ```


    - 2) 你也可以生成一个不带密码短的密钥。但是，建议在使用 SSH 服务时使用密码短，这可以提供额外的安全层。


    - 3) 现在在下一步中，你需要仔细地将密钥导入到远程系统。这里是无缝完成此操作的命令：


    ```bash

    ssh-copy-id sk@132.23.22.11

    ```


    如果你以后想处理基于密钥的 SSH，可以将其禁用。


    ## 通过 Telnet 连接


    Telnet 是一个著名的 Linux 网络管理工具，可以帮助我们通过认证程序连接到远程计算机。Telnet 像 SSH 一样能够无限制地连接到远程计算机。虽然没有
    SSH 安全，但它也有自己的优点。


    首先，它很容易安装并内置在许多 Linux 发行版中。如果没有提供 Telnet，可以通过 wget 下载器安装它。


    Telnet 的机制是使用基本的密码认证模式。使用以下命令连接 Telnet。


    ```bash

    root@sample: telnet {输入主机名}

    ```


    此处的主机名指的是我们尝试连接的远程机器的 IP 地址。


    例如，你可以连接到 localhost 来连接同一网络中的计算机。


    ```bash

    root@sample: telnet localhost

    ```


    在执行执行此命令后，我们将收到一个输入用户名和密码的提示。


    连接成功后，你可以进一步执行命令在远程机器上运行。可以使用如下提供的 `logout` 命令轻松使用 Telnet。


    ```bash

    root@sample: telnet logout

    ```


    ## 加密


    加密是对信息进行编码和解码的技术。它通过特定的算法（密钥）将可以直接读取的明文信息转换为密文形式。密钥是密文的钥匙，分为私钥和公钥。在传输数据时，如果你担心被他人监控或截获，可以在传输前用公钥加密数据，然后传输。这样，只有拥有私钥的用户才能解密数据，即使其他人截获了数据，通常也很将其解密为明文。


    简而言之，在生产环境中使用密码验证密码始终面临被黑客破解或嗅探器截获的风险。如果密钥认证方法配置正确，sshd 服务程序将更加安全。我们将进行以下特定配置，步骤如下：


    - 步骤 1：在客户端主机上生成一个“密钥对”。

    - 步骤 2：将客户端主机生成的公钥传输到远程主机。

    - 步骤 3：将服务器设置为仅允许密钥认证并拒绝传统的密码认证方法。记住在修改配置文件后保存并重启 sshd 服务程序。

    - 步骤 4：当客户端尝试登录服务器时，无需输入密码即可成功登录。


    ## SCP


    SCP (secure copy) 是一种基于 SSH 协议的网间安全传输命令。


    其格式为 `"scp [参数] 本地文件 远程账户@远程 IP 地址:远程目录"`。


    与 `cp` 命令不同，`cp` 命令只能复制本地文件，而 scp 不仅可以在网络传输数据，还能加密所有数据。例如，如果你想通过网络从一个主机传输文件，且两个主机恰好都是
    Linux 系统，就可以方便地使用 scp 命令。


    当使用 scp 命令从本地复制到远程时，首先需要以绝对路径的形式知道本地文件的存储位置。如果你想传输整个文件夹的数据，还需要添加 `-r` 参数进行递归操作。


