    \ to everyone will lead to a catastrophe. Hackers can also manipulate one employee\
    \ to get access to the whole system. For this exact reason, Linux provides users\
    \ with a set of comprehensive file and directory permissions.\n\nThis section\
    \ will help you understand how Linux deals with multiple users and groups and\
    \ also some commands that will help you understand the mechanism. At first, we\
    \ will discuss in detail about the types of users that are present in Linux.\n\
    \n- 1) Root user\n  The root user is the admin or controller of the system. The\
    \ root user is often powerful and can edit any file contents in the system. He\
    \ is also responsible for maintaining every other user in the system. If someone\
    \ gets access to the root user then he has attained the power to destroy the whole\
    \ system.\n\n- 2) Normal users\n  These are the other set of users that are present\
    \ under the root base. Normal users are usually divided into groups by the root\
    \ user and give separate permissions according to their requirements. For example,\
    \ in an IT company programmers are only given access to the project files that\
    \ they are working on whereas Security analysts are given access to all the projects\
    \ that the company is working on.\n\n## Types of permissions\n\nLinux or any other\
    \ operating system usually gives the following three permissions to their users\
    \ according to their decision.\n\n- 1) Read\n  Users allocated to this permission\
    \ level can only read the contents that are present. They are not allowed to edit\
    \ the files by any means. These users are called Lower access system users.\n\n\
    - 2) Read and Write\n  Users allocated to this permission level can not only read\
    \ the system files but can also write the files.\n\n- 3) Read, write and execute\n\
    \  Users allocated to this permission level can not only read and write but also\
    \ execute the programs. Root users usually don't give these permissions for users\
    \ due to its sensitive nature.\n\nHere are some ways to grant permissions to both\
    \ the individual owner and a group\n\n- 1) chown\n  This is a command that permits\
    \ an individual user.\n  `chown [username] [location]`\n  In the username, column\
    \ enter the username you are thinking of giving the permission to and in the location\
    \ enter the location/name of the file that you are using.\n\n- 2) chgrp\n  This\
    \ is another command that is used to allot permission to a group. As discussed\
    \ before in an enterprise some groups of users are allowed to access only a few\
    \ of the functionalities. For example, programmers can only access the project\
    \ files whereas testers can get access to everything that a project holds.\n \
    \ Root users use chgrp to give programmers group to access program files. Here\
    \ is the command: `chgrp [groupname]`\n\nIn the previous section, we have discussed\
    \ allowing permissions and in the next section, we will discuss commands that\
    \ will help us to confirm whether the permissions have been allotted or not. Follow\
    \ along!\n\nYou can use the following commands to check the permission of the\
    \ file you want to.\n\n- 1) ls\n  `ls -l [filename]`\n  When we enter the following\
    \ command the system automatically defines the permission status.\n\n- 2) stat\n\
    \  `stat [filename]`\n\n### Changing permissions using chmod\n\nchmod is often\
    \ used by programmers while using Linux systems to change the permissions, chmod\
    \ gives complete access to the system and can only be executed by the root user.\n\
    `chmod 777 [filename]`\n\nAre you confused about what 777 represents?\n- Read\
    \ - 4\n- Write - 2\n- Execute - 1\n\nIf all the three are added then it is 7 and\
    \ the three 7 represents that the changes are being made to all the three owners,\
    \ group and all other uses. So, by entering 777 permission changes all over the\
    \ system.\n\nIn the next section, we will discuss compressing and archiving in\
    \ detail along with a lot of examples.\n\n## Compressing and archiving\n\nBefore\
    \ discussing various commands that can compress files in Linux it makes sense\
    \ to know a bit of compressing.\n\n### What is compressing?\n\nCompressing is\
    \ a process in which the file size is reduced by various algorithms and techniques.\
    \ If you are a Windows user you might have probably used software like WinRAR\
    \ which uses compression techniques to reduce the size. Popular compression formats\
    \ are rar, zip, 7z.\n\nHowever, Linux uses a much more complex format known as\
    \ tar. Linux compression is usually of two types.\n\n- 1) Lossy\n  Lossy is a\
    \ type in which the file size is reduced but some quality is lost. For example,\
    \ multimedia files use lossy technique.\n\n- 2) Lossless\n  Lossless is another\
    \ type of compression where data needs to be compressed without losing any information.\
    \ For example, text documents use this.\n\n### a) Tar command\n\nThe most important\
    \ thing to do while compressing is to archive them first. Tar is known as tape\
    \ archive. We will discuss about tar command in the next chapters.\n\n## File\
    \ system and storage device\n\nThe file system is an important way to categorize\
    \ storage. Both Windows and Mac use different procedures to maintain it. Linux\
    \ uses a tree structure /root is described as the top of tree. We will learn about\
    \ these in this section.\n\nIf any hard drives need to be installed then they\
    \ are usually mounted. After the usage of hard drive they can be easily unmounted.\n\
    \n### Where the devices represented?\n\nIn windows when a hard drive is inserted\
    \ they are usually shown in the devices. Linux, however, represents all devices\
    \ in /dev. For practical experimentation, you can simply enter the following command\
    \ to look at all devices that are present:\n\n`cd /dev`\n`ls -l`\n\n### How Linux\
    \ represents devices?\n\nLinux in the old times is said to represent floppy drives\
    \ and Hard drives using fd0, hda. Now nowadays we are getting hard disk drive\
    \ that uses SATA partition system. These are represented using the name sda, sdb,\
    \ sdc...\n\nHere a, b, c represents the serialization concept the file system\
    \ uses. a is represented as the first hard drive, b as the second hard drive and\
    \ so on. Even these hard drives can be further divided according to partitions\
    \ and can be easily represented using sda1, sda2, sda3...\n\n## Becoming secure\
    \ and anonymous\n\nSafety is an important concern for internet and computer users\
    \ nowadays. Even being reputed companies Windows and Apple are often criticized\
    \ for collecting a lot of data from their users. Whatever their intention may\
    \ it is now a days our data is not safe.\n\nLinux on the other side is an open\
    \ operating system without any enterprises is often well\n"
  mdcn: "\n\n## 第 6 章：Linux 扩展功能\n\n本章是一份全面的指南，解释了 Linux 系统拥有的各种单项功能。我们将详细讨论目录权限、压缩和文件系统，并在必要时介绍相应的命令。本章将扩展到关于\
    \ Linux 中更复杂主题的章节。请继续读下去！\n\n## 文件和目录权限\n\nLinux 是一个专业的操作系统，经常用于拥有大量用户的企业和工业领域。给每个人都赋予权限将导致灾难。黑客也可能通过操纵一名员工来获取整个系统的访问权限。正因如此，Linux\
    \ 为用户提供了一套完善的文件和目录权限。\n\n本节将帮助你理解 Linux 如何处理多个用户和组，以及一些可以帮助你理解其机制的命令。首先，我们将详细讨论\
    \ Linux 中存在的用户类型。\n\n- 1) Root 用户\n  Root 用户是系统的管理员或控制器。Root 用户通常拥有高权限，可以编辑系统中的任何文件内容。他还要负责维护系统中的其他所有用户。如果有人获取了\
    \ root 用户的访问权限，他就拥有了摧毁整个系统的权力。\n\n- 2) 普通用户（Normal users）\n  这些是 root 基础下的另一组用户。普通用户通常由\
    \ root 用户分为组，并根据他们的需求赋予不同的权限。例如，在一家 IT 公司中，程序员只被赋予他们正在工作的项目文件的访问权限，而安全分析师被赋予访问公司正在进行的所有项目的权限。\n\
    \n## 权限类型\n\nLinux 或任何其他操作系统通常会根据其决定赋予用户以下三种权限。\n\n- 1) 读（Read）\n  分配到此权限级别的用户只能读取现有的内容。他们不允许以任何方式编辑文件。这些用户被称为低访问权限系统用户。\n\
    \n- 2) 读和写（Read and Write）\n  分配到此权限级别的用户不仅可以读取系统文件，还可以写入文件。\n\n- 3) 读、写和执行（Read,\
    \ write and execute）\n  分配到此权限级别的用户不仅可以读写，还可以执行程序。由于其敏感性，root 用户通常不会给用户赋予这些权限。\n\
    \n以下是向个人所有者和组授予权限的一些方法：\n\n- 1) chown\n  这是一个允许单个用户的命令。\n  `chown [username] [location]`\n\
    \  在 `username` 列中输入你想要赋予权限的用户名，在 `location` 中输入你正在使用的文件路径/名称。\n\n- 2) chgrp\n\
    \  这是另一个用于向组分配权限的命令。如之前提到的，在企业中，某些用户组仅被允许访问少数功能。例如，程序员只能访问项目文件，而测试人员可以访问一个项目所包含的所有内容。\n\
    \  root 用户使用 chgrp 给程序员组分配以访问程序文件的权限。这里是该命令：`chgrp [groupname]`\n\n在上一节中，我们讨论了权限的授予，在下一节中，我们将讨论帮助我们确认权限是否已分配的命令。请继续读下去！\n\
    \n你可以使用以下命令来检查你想要查看的文件权限。\n\n- 1) ls\n  `ls -l [filename]`\n  当我们输入以下命令时，系统会自动定义权限状态。\n\
    \n- 2) stat\n  `stat [filename]`\n\n### 使用 chmod 更改权限\n\n程序员在使用 Linux 系统时经常使用\
    \ `chmod` 来更改权限。`chmod` 赋予系统完全访问权限，只能由 root 用户执行。\n`chmod 777 [filename]`\n\n\
    你对 777 代表什么感到困惑吗？\n- 读 - 4\n- 写 - 2\n- 执行 - 1\n\n如果三者相加，就是 7，而三个 7 代表正在对所有所有者、组和其他所有用户进行更改。因此，通过输入\
    \ 777，权限会在整个系统中发生更改。\n\n在下一节中，我们将详细讨论压缩和归档，并附带大量的示例。\n\n## 压缩和归档\n\n在讨论 Linux\
    \ 中可以压缩文件的各种命令之前，了解一下压缩是有意义的。\n\n 什么是压缩？\n\n压缩是通过各种算法和技术缩小文件大小的过程。如果你是 Windows\
    \ 用户，你可能用过 WinRAR 之类的软件，它使用压缩技术来缩小体积。流行的压缩格式有 rar、zip、7z。\n\n然而，Linux 使用一种名为 tar\
    \ 的更复杂的格式。Linux 压缩通常有两种类型。\n\n- 1) 有损（Lossy）\n  有损是指文件大小减小但会丢失某些质量的一种。例如，多媒体文件使用有损技术。\n\
    \n- 2) 无损（Lossless）\n  无损是另一种压缩类型，需要在不丢失任何信息的情况下压缩数据。例如，文本文档使用这种技术。\n\n### a)\
    \ Tar 命令\n\n在压缩时最重要的一点是首先对其进行归档。Tar 被称为磁带存档（tape archive）。我们将在后续章节讨论 tar 命令。\n\
    \n## 文件系统和存储设备\n\n在讨论各种压缩命令之前，文件系统是分类存储的一种重要方法。Windows 和 Mac 都使用不同的程序来维护它。Linux\
    \ 使用树形结构，/root 被描述为树根。我们将在本节中学习这些内容。\n\n如果需要安装任何硬盘，它们通常会被挂载。在使用硬盘后，可以轻松地卸载。\n\n\
    ### 设备在哪里表示？\n\n在 Windows 中，当插入硬盘时，它们通常显示设备显示。然而，Linux 将所有设备表示在 /dev 中。为了进行实验，你可以简单输入以下命令查看所有存在的设备：\n\
    \n`cd /dev`\n`ls -l`\n\n### Linux 如何表示设备？\n\n旧时代的 Linux 使用 fd0、hda 表示软磁盘驱动器硬盘。现在我们获得的是使用\
    \ SATA 分区系统的硬盘。这些使用 sda、sdb、sdc... 等名称表示。\n\n这里的 a、b、c 代表文件系统使用的序列化概念。a 代表第一个硬盘，b\
    \ 代表第二个硬盘，以此此类推。甚至这些硬盘也可以根据分区进一步划分，并可以轻松使用 sda1、sda2、sda3... 进行表示。\n\n## 变得安全和匿名\n\
    \n安全是如今互联网和计算机用户的一个重要关注。即使是声誉良好的公司，Windows 和 Apple 也经常因从用户那里收集大量数据而受到批评。无论它们的意图如何，现在我们的数据是不安全的。\n\
    \n另一方面，Linux 是一种没有企业的开源操作系统，通常非常好\n\n"
