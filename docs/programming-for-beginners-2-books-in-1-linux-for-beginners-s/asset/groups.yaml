    ## 6 dd order


    The dd function can help us copy files or convert files according to specified
    size and number of data blocks in the format of `dd [parameter]`,


    The dd command is an important and characteristic command, which enables users
    to copy the contents of files according to the specified size and number of data
    blocks. Of course, if you like, you can also convert the data in the copy process.
    There is a device file /dev/zero in the Linux system, and every time it is explained
    in class, it is full of philosophical color.


    Because this file does not occupy storage space but can provide endless data,
    it can be used as an input file for dd commands to generate a file of a specified
    size.


    For example, we can use the dd command to fetch a 2500MB data block from the /dev/zero
    device file and then save the file named 2500_file.


    After understanding this command, you can create files of any size at will:


    ```

    [root@sample ~]# dd if=/dev/zero of=2500_file count=1 bs=2500M

    ```


    The function of dd command is not limited to copying files. If you want to copy
    the optical disc drive into an iso format image file, you need to use third-party
    software to do so in Windows system, but in Linux system, you can directly use
    dd command to suppress the optical disc image file and turn it into an iso image
    that can be used immediately:


    ```

    [root@sample ~]# dd if=/dev/cd of=Mint-server.Com.iso

    ```


    Considering that some readers will struggle with the relationship between the
    size of bs blocks and the number of count blocks, let''s give an example to explain.


    Assuming that appetite (i.e. demand) is a fixed value, the size of the spoon used
    to hold rice is bs while the number of times the spoon is used to hold rice is
    count pieces. The user needs to balance the size of the spoon (bs size) with the
    number of times he uses the spoon (count block) if he wants to eat (meet his needs).
    The bigger the spoon, the fewer times it is used to hold rice. As can be seen
    from the above, bs and count are both used to specify the size of the capacity.
    As long as the demand can be, they can be combined and matched at.


