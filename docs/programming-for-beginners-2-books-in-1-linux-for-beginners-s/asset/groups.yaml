    In SQL Server, two data type conversion functions are provided: CONVERT () and
    CAST ().


    The following describes the use of these two functions.


    ## 1. convert () function


    First of all, this is a basic entity function and can be used to manipulate any
    format.


    The syntax format of the CONVERT () function is:


    CONVERT(Name of the data {[Size details ]}, Enter the expression here,[Data value])


    Among them,


    - Datatype: indicates the data to be converted. If you want to convert to CHAR,
    VARCHAR, BINARY or VARBINARY data type, you must also set the length of the data
    type.

    - Expression: expression, the value or column name to be converted is the data
    type.

    - style: used for setting date format. If you want to convert date data to character
    data, you can use the style parameter to set the date display format.

    The style parameter can take two values of. If the value is taken from the first
    type, the year of return date is 2 digits; If the value is taken from the second
    category, the return year is 4 digits.


    ## 2. cast () function


    The CAST () function is also a data type conversion function, which is easier
    to use than CONVERT, but it is not convenient to convert the data type. Therefore,
    the CAST () function is recommended for general data type conversion, and the
    CONVERT () function is used for data type conversion.


    The syntax format of the CAST () function is:


    CAST (Name of the expression AS {(parameters here)})[(size)]


    Among them,


    - The expression denotes a logical entity

    - data type is a type of user data. If it is a data type such as CHAR, VARCHAR,
    NUMERIC, etc., you can select the length parameter to set the length.


    ## Date function


    The date function allows you to manipulate DateTime values. SQL Server supports
    date functions such as GETDATE, DATEADD, DATEDIFF, DATENAME, and DATEPART.


    - 1. GETDATE


    The GETDATE function is used to obtain the current system time in the format:


    ```

    GETDATE ()

    ```


    For example, enter the following SELECT statement in the query analyzer and run
    it to obtain the current system time.


    ```

    SELECT GETDATE()

    ```


    You will get the current system date as an output result. This is a self-calling
    function and can be used to automate job scheduling events.


    - 2. DATEADD function


    DATEADD function is used to add the year, month, day or time to a specified date.
    Its return value is date data.


    The format is:


    ```

    DATEADD(Enter the parameters here)

    ```


    Among them, the datepart parameter specifies which part of the date (such as year,
    month, etc.) to increase (decrease) the value.


    Once you know the available values of the described parameter, you can control
    which part of the date value is added.


    For example,


    ```

    DATEADD(Enter the year parameters with 5 number)

    ```


    It adds 5 years to the "year" of the current time and returns the date after 5
    years.


    ```

    DATEADD(Enter the month parameters with 5 number)

    ```


    It adds 5 months to the "month" of the current time and returns the date after
    5 months.


    Note: The datepart parameter value can also be abbreviated, for example, DATEADD()
    is also increased by 5 months at the current time.


    ## 3. datediff function


    The DATEDIFF function is used to obtain the difference between two days and return
    numerical data in the format:


    DATEDIFF(The concept parameter,date1,date2)


    The description of the date parameter is the same as above. date1 and date2 are
    strings in or date format.


    ## 4. DateName function


    The DATENAME function is used to obtain a part of the date and return it as a
    string in the format:


    DATENAME(Enter parameter here, date)


    The description of the parameter is the same as above. The date is a date or date
    format string.


    For example, assuming the current date is March 24, 2019, the result of DATENAME(month,
    GETDATE ()) is the string ''03'', and the result of DATENAME (dd, GETDATE ())
    is the string ''24''.


    In addition to the above-mentioned date-time functions, SQL Server also has three
    functions: YEAR, MONTH and DAY, which are used to obtain the year, month and date
    parts of date data respectively. The return values of these three functions are
    numeric.


    In the next section, we will discuss the mathematical functions provided by SQL.


    ## Mathematical Functions


    Mathematical functions allow numeric data to be manipulated. They are generic
    and can be easily manipulated and called during any logical expression. Mathematical
    expressions highly depend on the parameter values given as the functions are pretty
    straight forward. All you need to do is call the function in the SQL query statement.


    A simple example using mathematical functions is given below.


    Example:


    Using a mathematical function, the sine value of the 60-degree angle is calculated.


    Analysis: The radian value of a 60-degree angle should be calculated by using
    RADIANS function, first the sine value should be calculated by using the SIN function
    for radian value, and finally the result should be rounded.


    Enter the following SELECT statement in the query analyzer and run it.


    Select round (sin (radians (60.0)), 1) as '' sine of 60 degrees''


    Note: The alias as (sine value of 60 degrees) are put in single quotation marks
    because there are numbers in the alias.


    ## Character Function


    Character functions allow the manipulation of character data.


    To readers feel the convenience of using character functions to query data, the
    following is an example to illustrate the use of character functions.


    Look up the major of the student named "Ram" from the names table.


    Analysis: Sometimes, people often ignore the case of English letters, for example,
    "ram krishna" is written as "Ram Krishna". At this time, if the database management
    system does not have the function of automatic conversion and matching, the two-character
    strings will be regarded as the names of different people, resulting in query
    errors.


    To solve problems, all letters of the string in the database should be converted
    to uppercase (or lowercase) letters, and then compared with the string of uppercase
    (lowercase) letters, example, look at the following SELECT statement:


    ```

    SELECT { Table name } FROM { Column name } WHERE UPPER(Column name)=RAM KRISHNA''

    ```


    Note: SQL Server can automatically convert uppercase and lowercase letters for
    matching. However, to be on the safe side, it is recommended to use the above
    method when querying English strings.


    ## Other System Functions


    - 1. Text and Image Functions


    Text and image functions can change the values of text and image, which process
    the values or columns entered by text or image and return information about the
    values.


    - 2. Configuration function


    Configuration functions can return information about configuration settings.


    - 3. Cursor function


    The cursor function can return information about the cursor state.


    - 4. Metadata function


    Metadata functions can return attribute information of databases and database
    objects. Metadata is data describing data and is usually used to describe the
    structure and meaning of data.


    - 5. Safety function


    Security functions return information about users and roles.


