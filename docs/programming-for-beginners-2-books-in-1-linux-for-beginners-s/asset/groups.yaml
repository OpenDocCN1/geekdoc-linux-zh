    在过去的十年里，计算机领域兴起过多种类型的 DBMS 技术，如层次型和网络型 DBMS。然而，由于许多原因，它们并没有被证明是行的。最成功的数据库管理系统是关系型
    DBMS，它使用表格（Tables）表示数据。更高级的应用使用面向对象的 DBMS 来处理信息。然而，这在技术上处理的是关系型 DBMS。


    ## 数据库的优势


    如前所述，如今如今在现实世界中无处不在，并且能力得到了极大地增强。甚至有内置数据库来存储信息并用于应用程序。铁路、航空公司等许多旅游来源都高度依赖数据库来分类获取实时信息。数据库还以云的形式存储在互联网上，可以降低小微公司的成本。像
    Google、Amazon 等许多跨国公司收集大量信息并将其存储在远程数据库中，以测试和开发机器学习算法。


    就像编程语言一样，数据库需要一种语言来有效地查询和更新数据库中的信息。为了这一特定目的，开发了数据库查询语言。在接下来的章节中，我们将详细讨论数据库查询语言和
    SQL。请继续阅读！


    ## 什么是数据库查询语言？


    不能被使用和操作的数据是没有意义的。为了这一特定目的，开发了数据库查询语言。它们通常使用两个核心概念，即数据定义语言（DDL）和数据操作语言（DML）来查询和更新信息。最流行、最受欢迎的数据库查询语言是
    SQL，它是基于此构建。


    ## 什么是 SQL？


    用一句话定义 SQL，它是广为人熟知的结构化查询语言。SQL 作为工业应用的先驱技能，在几十年前就占据了热门的数据库查询市场。SQL 处理关系型数据库，使用各种高级机制创建、修改、更新和删除实体。SQL
    还可以帮助数据库变得更安全、更高效。


    SQL 之变得流行是因为它对每个设备的快速适应能力，也由于于支持 SQL 作为查询语言的数据库的发展。例如，MySQL 和 Oracle 使用 SQL 作为主要的查询语言。


    SQL 还有一个对应物 No SQL，它不仅不支持 SQL 概念，还包含额外的高级概念。No SQL 用于高级系统，但 SQL 对于小型企业网络来说要理想得多。


    ## 准备编码


    与任何其他编程语言一样，在深入学习之前，你需要理解你正在尝试学习的语言本质。对 SQL 的优势做一个清晰的笔记，并记录你可能会遇到的常见错误。


    列出需要安装的应用程序列表，并检查所有软件的系统要求。


    ## 安装 MySQL 应用程序


    MySQL 是微软为无数机构和小型企业提供的工具之一。目前有几种昂贵的认证课程可供选择，以便更好地理解这些数据库的管理。在书中，我们在解释了可用 SQL Server
    版本后，连贯地向你解释安装程序。


    ## SQL Server 软件类型：


    微软提供了广泛的软件以更好地部署服务。如果没有足够的数据，购买巨大的资源是没用的。对于海量数据，依靠少量资源也是没有意义的，因为会导致持续的停机，这可能会困扰你的用户服务。正因如此，MySQL
    有如下所示的不同类型。


    - a) Express（快速版）


    这是一个小型全能版本，包含了个人或小企业开始运行所需的简单资源和工作工具。


    - b) Standard（标准版）


    标准版通常建议具有中等处理数据的小型企业使用。与快速版相比，它可以更快地监控操作并处理数据。


    - c) Enterprise（企业版）


    企业版是全球最常用的 SQL 服务器之一。它具有广泛的功能，中大型公司均可以使用。它包含许多服务，如报告、分析、审计。由于其复杂性，企业版的费用比普通版本高。


    - d) Developer（开发者版）


    此版本的 SQL 服务器专门供开发者在环境环境中测试和操作功能。所有开发者都使用此版本来对他们处理的逻辑实体进行实验。你可以轻松地点击将开发者版本的许可转换为企业版。


    - e) Web（Web 版）


    此版本的 SQL 服务器主要为处理 Web 应用程序而开发。许多中期托管服务使用此版本来存储少量数据。


    ## SQL 软件包含哪些组件？


    SQL Server 软件由需要安装的各种组件组成。我们将在后续章节详细讨论。以下是一些常用的 SQL 服务器管理器。


    - a) 服务器管理系统 (Server management system)


    这是最重要的组件，每个存在的服务器都在这里注册、创建、管理或删除。这是数据库管理员与运行中的数据库交互的工作界面。


    - b) 服务器管理器 (Server configuration manager)


    该组件帮助我们提供有关网络协议和参数的详细自定义信息。


    - c) SQL Server 分析器 (SQL Server profiler)


    这是帮助监控通过系统运行的所有活动的组件。


    ## 安装软件前需要考虑什么？


    - 1. 对你正在安装的软件进行彻底研究。你可以进一步参考文档或在线资源来检查最低系统要求和组件信息。

    - 2. 学习组件。充分理解 SQL 企业版提供的分析、报告等不同组件。如今，许多行业的数据库管理员必须对发现进行分析和报告。

    - 3. 学习现有的身份验证模式，并对它们进行深入研究。


    ## 安装步骤：


    以下解释了如何在 Windows 系统中安装和配置 MySQL 数据库。具体步骤如下：


    - 1) 双击部署的 MySQL 安装文件，弹出对话框并开始安装程序。

    - 2) 接受条款和条件后，点击“安装”按钮开始安装。

    - 3) 几秒后，勾选“启动 MySQL 配置向导”复选框，点击“完成”按钮弹出对话框。

    - 4) 使用默认设置，注意 MySQL 使用的默认端口为 3306，可以在安装期间修改为其他端口（如 3307），除非 3306 端口已被占用，否则不要修改默认端口号。


    注意：安装 MySQL 数据库时，必须记住上述步骤设置的默认用户密码，这是我们访问 MySQL 数据库时使用的。


    - 5) 此时，MySQL 已成功安装。如果你想查看 MySQL 安装目录下的 my.ini 文件。my.ini 文件可以查看 MySQL 服务器的数量、在机器上的安装位置、数据库文件的存储位置以及
    MySQL 数据库的编码。

    - 6) 使用 SQL Server 时，有时需要满足不同需求，在服务器上创建服务器组，注册服务器修改用户登录方法配置网络连接等。你也需要手动输入这些信息。

    - 7) 在下一步中，在“新服务器属性”对话框的“组名称”文本框中输入要创建的服务器组名称，并在“组描述”文本框中输入该组的简要描述。输入完成后，点击“确定”按钮完成服务器组的创建。

    - 8) 在下一步中，将弹出“新服务器注册”对话框。在新服务器


