    occupying data space, each index also occupies a certain amount of physical space.
    If cluster indexes are to be established, the space required will be larger.


    (3) When adding, deleting and modifying the data irrespective of circumstances,
    the index is used in a separate mechanism that it reduces the overall capability
    of the system.


    ## Classification of Indexes


    The data in the database page of SQL Server can be divided into two types according
    to the storage structure: Clustered Index and Non clustered Index.


    ## 1. Cluster index


    Cluster index (also called "clustered index") means that the physical storage
    order of data rows in the table is the same as the index order. Cluster index
    consists of upper and lower layers: the upper layer is an index page, which contains
    index pages in the table and is used for data retrieval; the lower layer is the
    data page, which contains the actual data and stores the data in the table.


    When creating a clustered index in a column of the table, the data in the table
    will be reordered according to the index order of the columns and the table will
    be modified. Therefore, only one cluster index can be created in each table. Cluster
    indexes are created on columns that are frequently searched or accessed sequentially.


    ## 2. Non-cluster index


    The nonclustered index (also called "nonclustered index") does not change the
    physical storage location of the data rows in the table. Data is stored separately
    from the index and is linked to the data through the pointer carried by the index.
    Non-cluster indexes are similar to those in textbooks.


    The data is present in one place, the index is present in another place, and the
    index has a pointer to the storage location of the data. The items in the index
    are stored in the order of index key values, while the information in the table
    is stored in another order (this can be specified by nonclustered indexes).


    A table can contain multiple nonclustered indexes, and a nonclustered index can
    be created for each column commonly used when looking up data in the table.


    The method of creating a clustered index is similar to that of the non-cluster
    index, both uses CREATE INDEX statement, except that the CLUSTERED clause needs
    to be specified to create a clustered index.


    ## How to create an Index?


    All you need to do is enter the following syntax for creating indexes. As explained
    above clustered index needs a separate parameter for creation.


    Here is the syntax:


    ```

    CREATE INDEX {Parameters}

    ```


    In these parameters, we will define whether it is a clustered or non-clustered
    index.


    You can also use SQL server management software to create indexes with a click.


    ## MySQL Functions


    Functions are an easy way to repeat a task. Functions consist of a set of code
    that can be used in logical execution and expressions. SQL provides a lot of scalar
    and aggregation functions for the database users.


    ## Why are functions used?


    For example, you can use SQL functions to find maximum or minimum values for your
    column values. You can also use functions created by yourself from scratch to
    repeat tasks automatically.


    SQL functions are a complex topic and we have a separate chapter to look at some
    of the mathematical and scalar functions that SQL offers. For now, in the next
    chapter, we will discuss stored routines and procedures. Follow along!


    ## Chapter 9: Variable & Stored Routine in SQL


    In this chapter, we will in detail discuss stored procedures and their linked
    concepts. Stored procedures are used for automating tasks in an SQL server. There
    are numerous advantages to learning these procedures as a database administrator.
    Before diving into deep about stored routines and procedures we will discuss variables
    in SQL. Let us go!


    ## Variables in SQL


    Variables are an entity that represents the memory block of the system. This memory
    block can be used to retrieve or use necessary by the system. A lot of user-made
    functions and stored procedures use variables.


    There are usually two types of variables namely local and global variables. However,
    it should be remembered that the user is only given access to create variables.
    Global variables are always generated by the SQL server and are often difficult
    to interpret by the user. All variables start with the symbol @. So, if you notice
    @ symbol then it represents a variable.


    ### How to start using a variable?


    As said before, variables are primarily used in stored routines and procedures.
    We can use a DECLARE statement to start initiating a variable in the system. Here
    is the syntax.


    ```

    DECLARE {Enter variable name} {Enter the value}

    ```


    You can use the statement SET to give values to the variable. All you need to
    do is initiate the value as shown below.


    ```

    SET@VARIABLE = ''Enter value here''

    ```


    All the variables are used in selection and query. Variables can also be explicitly
    used to create user-made functions. We will discuss this in detail in the next
    chapters. For now, this is enough for understanding the basic structure of procedures.
    Let us go!


    ## What are stored routines?


    The stored routine is a Transact-SQL program in a database and capable of realizing
    a specific function. It is a data object widely used in a database application.
    In SQL Server, besides operating data using system functions, user-defined functions
    can also be written using SQL programs.


    Stored routines are widely used and can contain almost all Transact-SQL statements,
    such as data access statements, process control statements, error handling statements,
    etc. They are very flexible to use.


    ## Stored Procedures


    First of all, the Stored Procedure is a program written in the SQL language that
    can realize specified functions. Secondly, this program is compiled by SQL Server
    and stored in the SQL database. Users can call these procedures.


    ### Advantages of Stored Procedures


    - **Execution speed and high efficiency**: Because stored procedures are compiled
    into binary code in advance, SQL Server does not need to re-compile the code every
    time it is executed.

    - **Modular programming**: After the stored procedure is created, it can be called
    many times in different programs without rewriting the code.

    - **Reduce network traffic**: Since stored procedures are stored on the database
    server, only the stored procedure name and parameters are transmitted over the
    network, reducing traffic.

    - **Security**: Stored procedures can be used as a security mechanism. When users
    want to access data tables but do not have permissions, they can use a stored
    procedure to access the data.


    In SQL Server, stored procedures can be divided into three categories:


    - **Default active procedures**: Default active procedures are generally prefixed
    with "sp_" and are special stored procedures created, managed and used by SQL
    Server itself. Do not modify or delete them. Physically, the Default active procedures
    are stored in the master database, but logically, they appear in the system architecture
    of the database.

    - **Extended Stored Procedures**: Extended stored procedures are usually prefixed
    with "xp_". Extended stored procedures allow you to create external stored procedures
    using other languages (such as C++) and their contents do not exist in SQL but
    exist separately in the form of DLL. However, this function may be abolished in
    future versions of SQL Server, so try not to use it.

    - **User-defined Stored Procedures**: Stored procedures created by the user, which
    can input parameters, return tables or results, messages, etc. to the client.
    In SQL Server, user-defined stored procedures are divided into Transact-SQL stored
    procedures and CLR stored procedures.

