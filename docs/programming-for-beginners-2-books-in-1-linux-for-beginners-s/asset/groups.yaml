    ## 第 5 章：Linux 中的网络


    在当今世界，网络对于世界的运行至关重要。最大的网络 Internet 是通过不同的协议和通信机制连接系统构建的。在学习操作系统时，有必要了解它提供的所有网络功能。


    Linux 在连接到网络时提供了许多用于交换数据的协议。与普通的用户名和密码组合相比，这些协议通过密钥进行加密要安全得多。在本章中，我们将详细讨论 Linux
    系统中可用的 SSH 以及其他传输协议。


    SSH 是 Secure Shell（安全外壳）的缩写，旨在向关联的远程机器发送命令。这在团队工作以及尝试发送可以操作系统的命令时非常方便。


    SSH 以其加密通信而闻名。传输的每条消息都不会被攻击者劫持。许多 Linux 应用使用此协议来交换远程信息。


    在深入研究 Linux SSH 之前，我们将讨论一些对 Linux 学习者至关重要的基础网络概念。请继续阅读！


    ## 我们如何识别网络中的系统？


    使用 IP 地址。网络协议地址的设计是为了识别网络中的系统并向其发送信号。有不同的 IP 版本，如 IPv4 和 IPv6。


    除了网络地址外，每个连接的系统（移动手机、笔记本电脑或个人电脑）都包含一个指定的物理地址，即 MAC 地址。与 IP 地址不同，这些地址通常不容易被篡改。


    网站也是名为 Internet 的网络枢纽的一部分，通常由 IP 地址表示。但在实际操作中，无法为尝试访问的每个网站记住 IP 地址，因此它们使用类似于电话簿的系统
    DNS（域名系统）来表示，在 DNS 中，IP 地址由我们日常生活中使用的域名表示。


    ## 一些基础 Linux 网络命令


    本节将为你提供一些用于执行基础网络任务的常用命令。不要被这些命令吓，我们将在接下来的章节中详细讨论这些命令。


    ### a) 如何找到你的 IP 地址？


    每个 Linux 系统都会分配一个网络地址，可以使用以下命令轻松获知。


    打开你的 shell 并输入命令：


    ```

    ifconfig

    ```


    当你按下回车时，你将得到显示不同参数的输出。


    以下是示例输出：


    ```

    indent addr ----c 164.232.121.1

    HWaddr---- 23:ab:23:45:f3:6r

    ```


    你可以使用以下命令获取系统的默认网关：


    ```

    ip route

    ```


    ### b) 如何获取分配的 IP 地址


    上一节向你解释了如何查找系统的 IP 地址，在本节中，我们将讨论如何获取分配的 IP 地址。


    通常情况下，Linux 使用 DHCP 服务器分配 IP 地址。为系统手动安排网络地址需要大量时间。因此，为了方便用户并避免地址冲突，Linux 使用 DHCP
    服务器自动分配一个与网络中任何其他地址都不相同的 IP 地址。


    一旦你连接到以太网，就会使用 DHCP 服务器 分配一个新的 IP 地址。然而，如果你仍然无法连接到网络地址，可以使用以下命令强制分配网络地址。


    ```

    sudo dhclient

    ```


    你还有机会释放 IP 地址并分配一个不同的。你可以使用不同的命令来实现目标。


    以下是该操作的命令：


    ```

    sudo dhclient -r

    ```


    通过 DHCP 服务器分配的 IP 地址通常是动态的。每当你尝试检查 IP 地址时，它们可能已经发生了非常快的变化。它自动运行，并从地址池中分配可用的网络地址。


    例如，在一个拥有私有网络的大学里，每个连接的系统都会获得一个动态 IP 地址，该地址在一段时间内持续变化，以获得系统的更高的安全性。


    **注意：**


    某些服务器/网站需要静态地址来实现它们提供的功能。静态意味着不改变的网络地址。你可以通过以下步骤分配静态地址。


    这通过 Linux 提供的图形界面进行。在界面中输入网关、IP 地址和子网掩码，然后回车使更改生效。


    接下来，我们将学习如何在 Linux 系统上配置服务。然而，在此之前，必须确保主机之间的顺畅通信。如果网络不通，即使服务部署正确，用户也无法顺畅访问。因此，配置网络和确保网络连通性是学习部署
    Linux 服务之前的最后一个重要知识点。


    ## 网络管理器 (Network Manager)


    许多 Linux 发行版默认使用 Network Manager 提供网络服务。这是一个守护进程，用于动态管理网络配置并保持网络设备连接。Network Manager
    服务可以使用 `nmcli` 命令进行管理。`nmcli` 是一个基于命令行的网络配置工具，具有丰富的功能和参数。


    它可以轻松查看网络信息或网络状态：


    ```

    [root@sample ~]# nmcli connection show

    ```


    此外，Linux 系统支持网络会话功能，允许用户在配置文件之间快速切换（类似于防火墙）。


    如果我们需要在公司使用笔记本电脑手动指定网络的 IP 地址，回到家里时我们将使用 DHCP 自动分配 IP 地址。这需要繁琐且频繁地修改 IP 地址，但在使用网络会话功能后将变得简单得多。


    你可以使用 `nmcli` 命令并按照“connection add typeypeifname”的格式创建一个网络会话。使用 `con-name` 参数指定公司使用的网络会话名称，然后使用
    `if` 参数指定机器的网卡名称。使用 `autoconnect` 参数设置默认不自动激活网络会话，并使用 `ip4` 和 `gw4` 参数手动指定。


    ```

    [root@sample~]# nmcli connection add conname {名称} ifname {网卡名称}

    ```


    使用 `nmcli` 命令配置的网络会话是持久的，所以当我们回家时可以方便地启动家中的会话，网卡可以通过 DHCP 自动获取地址。


    如果你是虚拟机，请将虚拟机的网卡（网络适配器）切换到桥接模式并重启虚拟机。


    ## SSH


    SSH（安全外壳）是一种提供安全远程登录的协议，是目前远程管理 Linux 的首选方式。在此之前通常使用 FTP 或 Telnet 进行远程登录。然而，由于它们在网络中明文传输账户密码和数据信息，因此非常不稳定，容易受到黑客攻击。这会导致篡改传输的数据或直接获取服务器的账户密码。


