    # SQL UNION ALL


    When the UNION statement is used to merge the result sets in the query statement,
    the UNION statement will automatically delete duplicate rows and automatically
    sort the result sets. The UNION ALL statement does not delete duplicate rows in
    the result set and does not automatically sort. In most cases, UNION statements
    are used for merging, and UNION ALL statements are only used in special cases.


    For example:


    +   (1) Know that there are duplicate lines and want to keep the duplicate lines.


    +   (2) Know that there can be no repetition.


    +   (3) I don''t care if there are duplicate lines.


    The UNION ALL statement will only be used in the above cases, and the UNION statement
