    the system will prompt an inaccessible error message. Although the parameters
    of sshd service program are relatively simple, this is the correct way to configure
    service program in Linux system. All we have to do is to draw inferences from
    other examples and learn how to use them flexibly, so even if we encounter unfamiliar
    services later, we can still handle them.


    # SSH key based authentication


    As explained in the previous section SSH key-based authentication is one of the
    most popular services used in Linux. To use key based authentication, you are
    required to upload the public key that is encoded to SSH server.


    Always create keys as a normal user as root restrictions can make others not accessible
    to the'
  - '[PAGE 46]


    authentication.


    Here we explain the step by step procedure to generate and import SSH keys:


    +   1) In the first step we will create a keypair that has an option to enter
    passphrase. You need tonconfirm the passphrase and your encrypted key will be
    generated.


    Here is the command:


    ```

    root @ sample: ssh -keygen

    ```


    +   2) You can also generate a key without a passphrase. However, it is advised
    to use a passphrasengives it an additional layer of security while using the SSH
    service.


    +   3) Now in the next step you will need to carefully import the key to the remote
    system. Here is thecommand to make it happen without any hiccups


    ```

    ssh-copy-id sk@132.23.22.11

    ```


    You can disable it if you ever want to deal with key based SSH.


    # Connecting via Telnet


    Telenet is a famous Linux network administration tool which can help us to connect
    to a remotecomputer with an authentication procedure. Telnet has the power to
    connect the Remote computerwith no restrictions just like SSH. Although, not being
    as secure as SSH it still has its merits.


    First of all, it is easy to install and comes inbuilt with many Linux distros.
    If you are notprovided with Telnet you can install it via wget downloader.


    The mechanism of Telnet is its uses basic password authentication mode. Use the
    followingcommand to connect to the Telnet.


    ```

