    loop in detail.


    # While statement


    In the while statement at first, the SQL statement will continuously check the
    logical expression and verify whether it is satisfied or not. If it is not satisfied
    then the loop is closed. If it satisfies then the statement is executed and again
    enters the loop statement. As long as the condition is satisfied the loop will
    continue.


    Here is the SQL:


    ```

    WHILE {Condition}

    THEN {Execution}

    ```


    # Repeat


    Repeat is a system function provided by SQL that can repeat itself. All you need
    to do is give the function name as a parameter. This is in a way similar to recursion
    in programming languages. However, you may get encountered with errors if done
    wrong. Repeat the functions carefully.


