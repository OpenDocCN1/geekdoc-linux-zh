    ## Starting and Stopping Oracle database instances


    The process of starting an Oracle database instance is divided into three steps:
    starting the instance, loading the database, and opening the database. Users can
    start the database in different modes according to actual needs.


    An Oracle database instance must read an initialization parameter file at startup
    to obtain parameter configuration information about the startup. If the pfile
    is not specified in the startup statement, Oracle first reads the server initialization
    parameter file spfile at the default location. If no default server initialization
    parameter file is found, the text initialization parameter file at the default
    location will be read.


    The following will explain several STARTUP modes listed in startup syntax respectively.


    ```

    L. NOMO model

    ```


    This startup mode only creates instances (i.e. various memory structures and service
    processes that create Oracle instances), does not load databases, and does not
    open any data files.


    The code and running results are as follows:


    ```

    SQL> connect system/sample instance as connect;

    ```


    ## 2. MOUNT mode


    This mode starts the instance, loads the database, and keeps the database closed.


    When starting the database instance to MOUNT mode, the code and running results
    are as follows.


    ```

    SQL> shutdown {Enter the condition}

    ```


    ## 3. OPEN mode


    This mode starts the instance, loads and opens the database, which is the normal
    startup mode. Users who want to perform various operations on the database must
    start the database instance using OPEN mode.


    Start the database instance to OPEN mode, and the code and running results are
    as follows.


    ```

    SQL> startup

    ```


    Like starting a database instance, shutting down the database instance is also
    divided into three steps, namely shutting down the database, uninstalling the
    database, and shutting down the Oracle instance.


    The SQL statement for the shutdown is here:


    ```

    SHUTDOWN [Enter the parameter here]

    ```


    ## 1. NORMAL approach


    This method is called a normal shutdown. If there is no limit on the time to shut
    down the database, it is usually used to shut down the database.


    The code and running results are as follows:


    ```

    SQL> shutdown normal;

    ```


    Database shutdowns immediately with the syntax.


    ## 2. TRANSACTIONAL approach


    This method is called transaction closing. Its primary task is to ensure that
    all active transactions can be committed and shut down the database in the shortest
    possible time.


    ## 3. ABORT mode


    This method is called the termination closing method, which is mandatory and destructive.
    Using this method will force any database operation to be interrupted, which may
    lose some data information and affect the integrity of the database. Apart from
    using the database because it cannot be shut down using the other three methods,
    this method should be avoided as much as possible.


    ## Launching MySQL workbench


    MySQL Workbench is a visual database design software released by MySQL AB; whose
    predecessor is DB Designer of FabForce. MySQL Workbench is a unified visualization
    tool designed for developers, DBA and database architects. It provides advanced
    data modeling, flexible SQL editor and comprehensive management tools. It can
    be used on Windows, Linux, and Mac.


    To use it in windows, click on the SQL server side and select the option workbench
    to open the interface. If you are using Linux and Mac you need to enter the command
    ''workbench'' after entering into the SQL instance.


    ## Writing the First MySQL code


    First of all, when you are trying to write your first MySQL code it is important
    to get a good text editor for writing the queries. SQL Software''s provide query
    writing tools for its users usually. It is important to learn about syntax in
    detail. The first written code is always clumsy and can easily make you lose patience.
    However, remember that there is a lot to learn before making you things better
    with your code.


    In the third chapter, we will look in detail about SQL statements. But for now,
    in the next chapter, we will learn about creating instances from the SQL server
    management software itself. Let us dive into it!


    ## Chapter 2: Definition of Database


    This chapter is a clear introduction to the usage of the SQL management server
    and performing different operations for the system characteristics. We will start
    with creating tables and travel creating triggers using the SQL server management
    studio. This chapter is pretty straightforward and will introduce you to the interfaces
    SQL software offers. As we move on further, we will discuss various advanced SQL
    query statements using Data definition and data manipulation languages. For now,
    let us learn about all the capabilities of the SQL server management system.


    The server management system consists of all the servers listed on the instance
    and we need to click on the server we are willing to work with. When we click
    on the server it will ask authorization details. Authentication is important for
    the security of the database.


    ## Adminstrate the database


    After connecting the database, you have full control over the server. Administration
    capabilities will give you change of the information.


    ## Object explorer


    Object Explorer is a tree view of all the instances. It is one of the friendliest
    user interfaces in the SQL server.


    ## Create server groups


    Usually, SQL offers users to create groups with the databases. In advanced application
    systems, this is replaced with encrypted key.


    ## Start and stop servers


    You can easily start or stop databases using the options available for the instances.
    All you need to do is to press the button to end the database.


    ## Creating databases


    First of all, go to the object explorer and select the server you wish for. After
    getting authenticated click on the left pane and it will give a list of options.
    In those options select ''create new database'' to create a database instance.
    You can even select object properties and change some information manually. For
    example, you can input data type information. You can even provide the number
    of rows and columns for the databases. After clicking the create button on the
    interface the changes will take place.


    ## Modify tables


    You can easily change the number of columns in the table using the SQL server
    management studio. The pane offers an option called as modify. You can change
    all the properties of the database and it will change immediately within split
    seconds.


    With this modification option, you can change the primary key and foreign key
    values so that you can do complex queries.


    ## Manage tables


    Management is altogether a different option in the SQL server software. When you
    click on the manage instance all the properties will be displayed. You can look
    at all the data values and types available and can change them. For example, you
    can change the length of the columns and change the data type of a column from
    decimal to integer. Everything happens in a single click.


    You can even see the ER diagram of the databases to understand the relationship
    between the entities and instances.


    ## Delete tables


    Deleting also works in the same way as managing and creating. First of all, select
    the table you are looking forward to delete. Right-click on the table and click
    on the delete instance option. After entering the option, you will get a prompt
    to whether delete or not. If you click yes then all the data in that table will
    be deleted at an instance. It is not possible to restore the deleted columns from
    SQL server management software. However, you can restore the deleted tables using
    recovery models available in the SQL server.

