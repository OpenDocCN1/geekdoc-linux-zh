    this is a separate topic on its own and explaining everything is out of the scope
    of this book.


    # Mathematical concepts for data science and SQL


    # a) Cardinality


    The number of Distinct_Keys for a column is called the cardinality. The cardinal
    number of primary key columns is equal to the total number of rows in the table.
    The level of cardinality affects the data distribution of columns.


    If the base number of a column is very low, the data distribution of the column
    will be very uneven. Because of the uneven distribution of the column, SQL queries
    may be indexed or scanned in full tables. When doing SQL optimization, if it is
    suspected that the column data distribution is unbalanced, we can use the select
    column, count(*) from table group by column order by 2 desc view the column distribution.


    If the SQL statement is single table access, it may be indexed, scanned in full
    tables, or scanned in materialized views. Under the condition of not considering
    materialized views, single table access takes an index or full table scan. Now,
    recall the conditions for indexing: return less than 5% of the data in the table
    to index, and scan the whole table when more than 5%.


    This is the process of cardinality in detail to increase SQL optimization.


    # b) Selectivity


    The ratio of the base number to the total number multiplied by 100% is the selectivity
    of a column.


    When optimizing SQL, it is meaningless to look at the base number of columns separately.
    The base number must be compared with the total number of rows to be meaningful.
    It is for this reason that we have introduced the concept of selectivity.


