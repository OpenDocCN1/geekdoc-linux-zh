    section, we ask you to think about a real database structure that you have encountered.
    Just think. You will notice how important they are in the present technological
    world.


    # What is a DBMS (Data Management System)?


    We usually have data that is sensitive in the databases and there need to be some
    regulations to easily and logically manipulate this data with the help of a system.
    For this reason, back computer scientists designed Database management systems
    to manipulate, create and erase the data. With DBMS systems we usually achieve
    complete authority of the data we possess and can use them logically.


