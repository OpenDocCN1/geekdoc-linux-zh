    ## 2) 优先级 (Priority)


    优先级是日志系统中存在的重要参数之一。查看需要快速处理的日志文件是有意义的。你可以根据优先级轻松地过滤日志文件。这里是一些需要了解的重要优先级因素。


    a) emerg


    当系统出现极其关键的情况时使用此项。


    b) Alert


    警报使让我们记住系统即将面临的灾难。必须进行持续的日志分析，以便回顾警报并处理它们。


