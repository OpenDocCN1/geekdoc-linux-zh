    ## Create Stored Procedures with Input Parameters


    Most stored procedures used in databases have parameters. The function of these
    parameters is to transfer data between stored procedures and calling programs
    (or calling statements). When transferring data from the calling program to the
    stored procedure, it will be received by the input parameters in the procedure,
    while transferring data from the stored procedure to the calling program, it will
    be transferred through the output parameters.


    ## Creating Stored Procedures with Output Parameters


    If you want to pass the data in the stored procedure to the caller, you should
    use the output parameters in the stored procedure. The OUTPUT parameter is specified
    with the output keyword.


    ## Create Stored Procedures with Multiple SQL Statements


    Stored procedures can have multiple SQL statements and programming statements
    provided by DBMS. At this time, after calling the stored procedure, multiple query
    result sets will be returned.


    ## Modify Stored Procedures


    When using stored procedures, once it is found that the stored procedures cannot
    complete the required functions or the functional requirements change, the originally
    stored procedures need to be modified.


    Modify stored procedures with ALTER PROCEDURE statement


    ALTER PROCEDURE statement is provided in the Transact-SQL language to modify stored
    procedures.


    Its syntax code is as follows:


    ```

    ALTER {Enter the logic here} PROCEDURE

    ```


    In the next section, we will discuss deleting stored routines.


    ## How to delete a stored routine?


    A stored routine should be deleted when it is no longer needed. There are also
    two deletion methods, one is using SSMS interface operation and the other is using
    the deletion statement provided by Transact-SQL language.


    Use the DROP PROCEDURE statement to delete stored procedures


    To delete a stored routine, use the DROP PROCEDURE statement, which has the following
    syntax format.


    ```

    DROP PROCEDURE {Enter the name of the routine}

    ```


    However, understand that you can easily backup all the stored routines that you
    have created.


