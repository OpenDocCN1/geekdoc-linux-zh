    # # SQL RIGHT & LEFT JOIN


    SQL Right and Left join works on the concept of external join. The inner join
    described in the previous sections compare each column of records FROM the table
    in the FROM clause and returns all records that satisfy the join condition.


    However, sometimes it is necessary to display all records in the table, including
    those records that do not meet the connection conditions. In this case, the external
    connection is required. Using outer join can easily query other records in a table
    in the join result. The query result of the external connection is an extension
    of the query result of the internal connection.


    An obvious feature of external connection is that some data do not meet the connection
    conditions are also output in the connection results. External connection takes
    the specified data table as the main body and outputs the data in the main body
    table that do not meet the connection conditions. According to the different rows
    saved by external connections, external connections can be divided into the following
    3 types of connections.


    +   (1) Left outer join: indicates that the results include data in the left table
    that do not meet the conditions.


    +   (2) right join: indicates that the results include data in the right table
    that do not meet the conditions.


    +   (3) Total External Connection: Data that do not meet the conditions in the
    left table and the right table appear in the results.


    In the JOIN statement, the left side of the join keyword represents the left table
    and the right side represents the right table.'
