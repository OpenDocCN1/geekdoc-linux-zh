    ## Chapter 12: Built-in functions and calculations


    This chapter is a comprehensive introduction to functions and deals with a lot
    of systems and scalar functions. We will explain almost all of the functions with
    the help of syntaxes. This chapter is practical and we advise you to work with
    your system while going through this chapter.


    ## Types of SQL functions


    Usually, functions are two types in SQL. First one of them is system functions
    which are supported by the SQL server and users do not need to create logical
    expressions for them. The second one of them is user-based functions where you
    can create your user-based functions with the help of variables and other SQL
    programming concepts. First, we will discuss in detail about user-based functions
    in the next section. Let us go!


    ## User-defined Functions


    The use of some functions, such as GETDATE and SUM is easy to learn. Those functions
    are all functions. The functions are to be introduced in this section below to
    user-defined functions. Some user-defined functions are used in the same way as
    the system functions mentioned earlier, for example, scalar functions.


    In SQL Server, according to the form of the function return value, user-defined
    functions are divided into two categories: scalar function and table-valued function,
    in which table-valued function is divided into embedded table-valued function
    and multi-statement table-valued function.


    ## Creating Functions Using Scalars


    If the function returns a scalar data type, the function is scalar-valued. You
    can define scalar-valued functions using multiple Transact-SQL statements.


    The syntax for scalar functions is as follows:


    ```

    CREATE FUNCTION [Enter the authorization details] {Enter the function name}

    ```


    ## Create Functions Using Table Values


    If the function returns a value of TABLE, the function is table-valued. According
    to the definition of the function body, table-valued functions can be divided
    into embedded functions or multi-statement functions.


    ### 1. Embedded function


    If the TABLE specified by the RETURNS clause does not include a field list, the
    function is embedded. This type of function is defined by a single SELECT statement.
    The fields (including data types) of the table returned by the function are from
    the field list of the SELECT statement that defines the function.


    The syntax for embedded functions is as follows:


    ```

    CREATE FUNCTION [ Authorization details] {Name of the function}

    ```


    ### 2. Multi-statement function type


    If the TABLE specified by the RETURNS clause has fields and their data types,
    the function is a multi-statement table-valued function. Multiple statements are
    allowed in the body of a multiple statement function.


    The following is the syntax format of multi-statement functions:


    ```

    CREATE FUNCTION [ Name of the authorization] {Name of the function}

    ```


    ## System Functions


    In SQL Server, system functions refer to the functions that come with SQL Server
    software. They are mainly divided into aggregate functions, data type conversion
    functions, date functions, mathematical functions, and other commonly used functions.
    This section will describe these types of system functions in detail.


    ## Aggregate function


    Aggregation function is the most commonly used type of function in system functions.
    It mainly calculates a group of values and returns a value. Aggregation functions
    mainly include SUM (sum function), AVG (average value function), MIN (minimum
    value function), MAX (maximum value function), COUNT (quantity function).


    The use of each function is explained by the examples below.


    ### 1. sum function


    The SUM function is mainly used to find the sum of a certain set of values. We
    can use this function to easily add the number of columns in the table. There
    are a lot of practical examples of this function.


    The basic syntax format is as follows:


    ```

    SUM (Enter the name of the column)

    ```


    ### 2. AVG function


    The AVG function is used to average a set of values. We can use this function
    to execute several system functions. The average function can help us expand the
    functional abilities to statistics.


    The basic syntax format is as follows:


    ```

    AVG (Enter the name of the column)

    ```


    ### 3. Min function


    The MIN function is used for the minimum value of a set of values. This is usually
    considered while sorting and filtering items based on any entity.


    The basic syntax format is as follows:


    ```

    MIN (Enter the name of the column)

    ```


    ### 4. Max function


    The MAX function is used for the maximum value of a set of values. This is usually
    considered to generate descending samples from the samples or data provided.


    The basic syntax format is as follows:


    ```

    MAX (Enter the name of the column)

    ```


    ### 5. COUNT function


    The COUNT function is used for the number of a set of values. We can use this
    column to calculate all entities available. You can use your own logical expressions
    to expand the ability of this function.


    The basic syntax format is as follows:


    ```

    COUNT (enter the name of the column)

    ```


    ## Type Conversion Function


    Type conversion functions are also frequently used in databases, for example,
    converting dates and numbers to a specified string format, or converting strings
    to valid date or numeric types,

