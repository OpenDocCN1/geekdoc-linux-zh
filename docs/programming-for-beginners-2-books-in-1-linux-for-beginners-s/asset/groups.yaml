    # Types of SQL functions


    Usually, functions are two types in SQL. First one of them is system functions
    which are supported by the SQL server and users do not need to create logical
    expressions for them. The second one of them is user-based functions where you
    can create your user-based functions with the help of variables and other SQL
    programming concepts. First, we will discuss in detail about user-based functions
    in the next section. Let us go!


    # User-defined Functions


    The use of some functions, such as GETDATE and SUM is easy to learn. Those functions
    are all functions. The functions are to be introduced in this section below to
    user-defined functions. Some user-defined functions are used in the same way as
    the system functions mentioned earlier, for example, scalar functions.


    In SQL Server, according to the form of the function return value, user-defined
    functions are divided into two categories: scalar function and table-valued function,
    in which table-valued function is divided into embedded table-valued function
    and multi-statement table-valued function.


    # Creating Functions Using Scalars


    If the function returns a scalar data type, the function is scalar-valued. You
    can define scalar-valued functions using multiple Transact-SQL statements.


    The syntax for scalar functions is as follows:


    ```

    CREATE FUNCTION [Enter the authorization details] {Enter the function name}

    ```


    # Create Functions Using Table Values


    If the function returns a value of TABLE, the function is table-valued. According
    to the definition of the function body, table-valued functions can be divided
    into embedded functions or multi-statement functions.'
