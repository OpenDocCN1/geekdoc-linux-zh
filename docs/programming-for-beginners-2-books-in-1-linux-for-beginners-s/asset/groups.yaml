    [root@sample ~]# ls

    ```


    ```

    [root@sample~]#

    ```


    所有文件都通过以下 Linux 命令的帮助被删除了。


    ## 6 dd 命令


    `dd` 函数可以帮助我们根据指定的大小和数据块数量复制文件或转换文件，格式为 `dd [parameter]`。


    `dd` 命令是一个重要且具有特征的命令，它允许用户根据指定的大小和数据块数量复制文件内容。当然，如果你喜欢，也可以在复制过程中转换数据。Linux 系统中有一个设备文件
    `/dev/zero`，每次在课上解释它时，都充满了哲学色彩。


    由于这个文件不占用存储空间但可以提供无尽的数据，因此它可以作为 `dd` 命令的输入文件来生成指定大小的文件。


    例如，我们可以使用 `dd` 命令从 `/dev/zero` 设备文件中获取 2500MB 的数据块，然后将其保存为名为 `2500_file` 的文件。


    理解此命令后，你可以随心所创建任何大小的文件：


    ```

    [root@sample ~]# dd if=/dev/zero of=2500_file count=1 bs=2500M

    ```


    `dd` 命令的功能不仅限于复制文件。如果你想将光驱复制为 iso 格式的镜像文件，在 Windows 系统中你需要使用第三方软件，但在 Linux 系统中，你可以直接使用
    `dd` 命令压制光驱镜像文件并将其转换为可以直接使用的 iso 镜像：


    ```

    [root@sample ~]# dd if=/dev/cd of=Mint-server.Com.iso

    ```


    考虑到某些读者难以理解 `bs` 块的大小与 `count` 块数量之间的关系，让我们举一个例子来解释。


    假设胃口（即需求）是一个固定值，用来盛饭的勺子大小是 `bs`，而用勺子盛饭的次数是 `count`。如果用户想吃饱（满足需求），就需要平衡勺子的大小（`bs`
    大小）与使用勺子的次数（`count` 块）。勺子越大，盛饭的次数就越少。从上面可以看出，`bs` 和 `count` 都用于指定容量的大小。只要需求可以满足，它们就可以进行任意的组合和匹配。


    ## 7 file 命令


    `file` 函数可以帮助你以“文件名”的格式查看文件类型。


    在 Linux 系统中，由于文本、目录、设备等都统称为文件，而我们无法仅通过后缀判断具体的文件类型，因此我们需要使用 `file` 命令来查看文件类型。


    ```

    [root@sample ~]# file snake-ks.cfg

    ```

    snake-ks.cfg: ASCII text

    ```


    由于硬件或工作操作系统的不同，读者在实验配置时可能会出错。请耐心仔细观察操作步骤。不要气馁。在下一节中，我们将讨论 Linux 中的一些高级命令功能。


    ## 打包压缩与搜索命令


    在网络上，人们越来越倾向于传输压缩格式的文件，因为在相同网络速度下，压缩文件体积较小，传输时间短。接下来，我们将学习如何在 Linux 中打包、压缩和解压文件，并让用户根据关键词在文本文件中搜索匹配信息，并在整个文件系统中根据名称或属性搜索特定文件。虽然本节只有
    3 个命令，但其功能复杂且有许多参数，因此将在章末进行说明。


    ### 1. tar 命令


    `tar` 是可以实现文件深度压缩的级机制之一。查看下节以了解更多信息。


    在 Linux 系统中，有很多常用格式，其中 `tar.tar`、`tar.gz` 或 `tar.bz2` 常用。首先，`-c` 参数用于创建，`-x` 参数用于提取。`-z`
    参数用于使用 `gzip`，`-j` 参数用于使用 `bzip2`。`-v` 参数用于详细显示。`-f` 参数特别重要，代表文件名。`-C` 参数用于指定目录。


    让我们演示打包、压缩和解压的操作：


    ```

    [root@sample ~]# tar -cvf example.tar.gz /etc

    ```


    接下来，将压缩文件提取到目录：


    ```

    [root@sample ~]# tar -xvf example.tar.gz -C /

    ```


    ### 2. grep 命令


    `grep` 函数可以帮助我们在文本中进行关键词搜索，并以 `grep [options] [file]` 的格式显示结果。


    `grep` 命令是最广泛使用的文本搜索工具。尽管有很多参数，但大多数基本上不使用。如果 IT 培训的水平只能停留在“技术搬运工”水平而不能总结高质量的知识，对学生来说不是好事。我们只介绍两个常用的参数：`-n`
    参数用于显示搜索信息的行号；`-v` 参数用于反选信息（即不包含关键词的行）。


    这两个参数几乎可以满足你未来 80% 的工作需求。至于数百个参数，即使以后遇到，再用主 `grep` 命令去查询也太晚了。


    在 Linux 系统中，`/etc/passwd` 文件存储了所有用户信息信息。可以使用 `grep` 命令找出当前系统中所有不允许登录的用户信息：


    ```

    root@sample ~]# grep /sbin/nologin /etc/passwd

    ```


    ### 3. find 命令


    `find` 函数可以帮助我们根据指定的标准查找文件，格式为 `find [path] criteria operation`。


    这已经多次提到“Linux 系统中的一切都是文件”。在 Linux 系统中，搜索工作通常通过 `find` 命令完成，可以使用不同的文件特征作为搜索标准（如文件名、大小、修改时间、权限等信息）。一旦匹配成功，信息将显示在屏幕上。


    这里我们需要关注 `-exec` 参数的重要作用。该参数用于将 `find` 命令找到的结果交给后续命令进行进一步处理。由于 `find` 命令对参数有特殊要求，尽管
    `exec` 是长格式，但它仍然只需要一个减号 (-)。


