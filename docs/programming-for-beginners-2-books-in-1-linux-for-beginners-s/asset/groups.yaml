    ## Pack Compression and Search Commands


    On the network, people are more and more inclined to transmit files in compressed
    format because the compressed files are small in size and the transmission time
    is short under the same network speed. Next, we will learn how to pack, compress
    and decompress files in Linux, and let users search for matching information in
    text files based on keywords, and search for specific files based on names or
    attributes in the entire file system. Although there are only 3 commands in this
    section, its functions are complicated and have many parameters, so it is explained
    at the end of this chapter.


    ### 1. tar command


    Tar is one of the advanced mechanisms that can be used to achieve deep compression
    in files. Checkout the below section to know more about it.


    In the Linux system, there are many common formats among which tar.tar or tar.gz
    or tar.bz2 are mainly used. First, the -c parameter is used to create, and the
    -x parameter is used to extract. The -z parameter is used to use gzip, and the
    -j parameter is used to use bzip2. The -v parameter is used for verbose display.
    The -f parameter is particularly important and represents the filename. The -C
    parameter is used to specify the directory.


    Let''s demonstrate the operations of packing compressing and decompressing:


    ```

    [root@sample ~]# tar -cvf example.tar.gz /etc

    ```


    Next, extract the compressed file into the directory:


    ```

    [root@sample ~]# tar -xvf example.tar.gz -C /

    ```


    ### 2. grep command


    The grep function can help us perform keyword searches in text and display the
    results in the format `grep [options] [file]`.


    Grep command is the most widely used text search tool. Although there are many
    parameters, most of them are basically not used. If the level of IT training can
    only stay at the level of "technical porter" and cannot summarize high-quality
    knowledge, it is not a good thing for students. We will only talk about the two
    commonly used parameters: -n parameter is used to display the line number of the
    searched information; -v parameter is used to deselect information (i.e. not all
    rows containing keywords).


    These two parameters can almost fulfill 80% of your work needs in the future.
    As for the hundreds of parameters, even if they are encountered in the future,
    it is still too late to query them using the main grep command.


    In Linux system, the /etc/passwd file stores all user information. grep command
    can be used to find out all user information in the current system that is not
    allowed to login to the system:


    ```

    root@sample ~# grep /sbin/nologin /etc/passwd

    ```


    ### 3. find command


    The find function can help us find files according to the specified criteria,
    and the format is `find [path] criteria operation`.


    This has been mentioned many times that "everything in the Linux system is a file".
    In the Linux system, the search work is generally completed through the find command,
    which can use different file characteristics as search criteria (such as file
    name, size, modification time, permissions and other information). Once the matching
    is successful, the information will be displayed on the screen by default.


    Here we need to focus on the important role of the -exec parameter. This parameter
    is used to hand over the results found by the find command to the following command
    for further processing. Because of the special requirements of the find command
    for parameters, although exec is in long format, it still only needs a minus sign
    (-).

