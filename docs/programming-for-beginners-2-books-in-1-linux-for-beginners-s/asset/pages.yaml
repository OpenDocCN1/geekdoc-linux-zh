  md: '# A brief history of Linux


    In the early 1970s which is considered a renaissance period for computers, there
    are traces of open source development. UNIX is one of the most favorite enterprises
    that has been used by programmers to develop software that can be freely anywhere.
    However, the open-source community was devastated when UNIX decided to commercialize
    all of its integrated resources making it hard for the open-source community to
    effectively develop applications.


    Several companies tried to make things normal but only things get better when
    Richard Stallman in 1984 started the GNU open-source program. It was followed
    by the release of the GCC compiler which made programmers create their own programs
    for the environment. These resources helped programmers to create quite innovative
    applications.


    Out of all of them, in 1991 a project created by a young student from Helsinki
    University started to top the charts in the community. It is primarily an operating
    system that consists of a kernel that consists of different libraries which can
    be used to integrate and develop third party applications and distributions. This
    young student, Linux Torvalds overwhelmed the response starting the project seriously
    and entered a full swing of development. This project is called “Linux”.


    By 1994, Linux has boomed exponentially in both popularity and user base. In the
    same year, a programmer named Bob Young integrated different libraries to the
    kernel and released his own commercial distribution known as Red Hat Linux to
    enterprises. With the success of Red Hat, people understood the advantages of
    Linux based systems and started to integrate it into different technical systems.
    Linux Torvalds still operates the kernel from his home to date with the help of
    hundreds of thousands of enthusiastic programmers contributing from all over the
    world.


    In 2019, Linux occupies a 15% share of the technical landscape and consists of
    hundreds of Linux distributions that can be used for different purposes. For example,
    Kali Linux is a Linux distribution that is solely developed for hackers.


    # How is Linux different from the windows?


    Even though windows occupy the major share in the market Linux is considered best
    among all operating systems due to its robust performance, simple interfaces,
    and advanced security mechanisms. In this section, we will look at all the features
    that help Linux occupy the top tier of operating systems.


    # a) Open-source'
  merge: -1
