  md: '# Chapter 4: SQL commands: Joins & UNION


    Databases usually consist of different tables with different column values and
    types. However, some tables in the database consist of the same entities and can
    be used to query two database columns with precision. To retrieve data using this
    technique we use JOINS in SQL. In this chapter, we will discuss joins and their
    types in detail. Follow along!


    # What are Joins?


    Usually, we can query columns and rows using the SELECT statement. However, SELECT
    statements only work for a single table and so is not useful for complex query
    operations. At this Joins come into operative where they can query data from two
    or more tables with the help of common columns present in the tables.


    # What are Unions?


    Unions are used to retrieve data from two or more tables. The only difference
    between Joins and Unions is that Joins use only SELECT statement where Unions
    use a different number of SELECT statement to achieve the results.


    # How to implement joins?


    Joins are usually implemented using two types of syntaxes. Explicit syntax deals
    with the cartesian product of two tables. Whereas implicit syntax deals with Where
    clauses. It is always recommended to use explicit functionality because it is
    easy for queries to function and operate. A lot of queries are going to discuss
    in this chapter follow the explicit syntax.


    # Cartesian product


    Before going to learn about the advanced functionalities of Joins it is important
    to know the simple cartesian product.


    Cartesian product is a simple mathematical operation that multiplies with any
    entity restrictions. By using the cartesian product you can combine with any column
    of the other table.


    To understand the cartesian product in layman terms is just keeping two tables
    by side. For example, if Table A has 10 rows and Table B has 5 rows then the cartesian
    product will have a total of 50 rows.


    Cartesian product is often under-discussed even though being simple is because
    it gives large output tables.'
  merge: -1
