  md: '# Chapter 3: The Data Definition Language


    Structured Query language uses DDL statements to create entities such as databases
    and tables. It also uses DML statements to alter or change the structure of databases.
    In this book, we will discuss all of these statements in detail with a lot of
    examples. For now, we will start learning some of the essential concepts required
    for a better understanding of all of these SQL query statements. Follow along!


    # SQL essential objects


    SQL objects are an easy way to understand the essence of the language we are dealing
    with. Just like any programming language SQL depends on different objects to make
    a sense for the programmers. Here are some of those for your better understanding
    of the subject.


    +   a) Constants


    Constants in SQL are also called as literal values and describes a constant value
    of any data. Constants are usually alphanumeric or a hexadecimal value.


    +   b) Identifiers


    Identifiers are a special feature developed in SQL for easily identifying entities,
    indices, and tables in the databases. Some of the well-known identifiers are @,#.


    +   c)Comments


    Comments in SQL just like all other programming languages are used to note down
    valuable information for programmers. Most database administrators use two hyphens
    by side to side to write comments.


    +   d) Reserved keywords


    These are the prescribed keywords defined by SQL software fundamentally and are
    not allowed to use by any user. Reserved keywords should be referred by SQL programmers
    from the documentation.


    +   e) Data types


    All the values that database tables and columns possess are usually curated into
    different types known as Data types. SQL offers various data types such as Numeric,
    Character, and Temporal, Binary and Bit data types.'
  merge: -1
  pgno: 111
