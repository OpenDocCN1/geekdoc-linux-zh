  md: '# Chapter 6: Database Administration


    Database administration is a collection of complex scenario processes that need
    to be dealt with utmost care. We will discuss various tasks such as backup, recovery,
    and restoration in detail. A of theoretical knowledge about these topics will
    also be mentioned for further analysis of the subject. Let us dive into it!


    # Why data loss occurs in databases?


    There are many reasons for the sudden onset of loss of data. They can be either
    program or natural disasters such as earthquakes. Here we will discuss some of
    those reasons in detail for your better understanding.


    +   a) Program errors


    When we are dealing with programs involving complex data sometimes, we may get
    stuck with program errors such as buffer overflow. These program errors often
    result in a sudden loss of data.


    +   b) Manmade errors


    These types of errors often happen when there is a change in the administration.
    Dropping primary databases with a mistake can make things abrupt for all others
    involved.


    +   c) Hardware and disk errors


    Data loss is also possible when there are unexpected system errors due to a high
    pool of resources or due to a tactical change in the system. Disk errors can also
    be possible due to crashing input blocks present.


    +   d) Natural disasters and theft


    There are also changes of data loss due to earthquakes, floods, and theft. If
    after the catastrophe significant part of the system is left then it is possible
    to recover data with high precision care.


    In the next section, we will discuss various recovery models and a few successful
    methods to backup and restore. Follow along!


    # Recovery models


    The recovery model is a separate criterion that explains the amount of data you
    are willing to lose during the restoration process of the system.'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'These recovery models deal with transaction logs that store all the restoring
    and backup procedures involved. So, choosing a recovery model is a direct influence
    on the size of your transaction log. So, chose the recovery model that works best
    for you according to the resources you can afford.


    SQL Server databases usually support three Data recovery models as explained below:


    # a) Full Recovery model


    The full recovery model is the best choice if you are not worried about the large
    set of data that comes with it. it stores transactions to the point and can successfully
    recover every transaction that is committed to the log. However, if you are willing
    to go with the full recovery model you need to be aware of the huge resources
    you need pool out. It is also important to note that the full recovery model takes
    a lot of time to restore.


    # b) Bulk-Logged Recovery model


    The fully recover model and Bulk-logged recovery model only differs in one exact
    procedure. In the full recovery model, you can only recover to the last committed
    transaction available. This is not proven practical when you are dealing with
    bulk recovery files as they may require a lot of resources. For this exact purpose,
    the SQL server provides the Bulk-Logged recovery model to change your restore
    point according to your requirements.


    # c) Simple recovery model


    Readers can understand that the simple recovery model is the simplest form of
    backup and restore, and is more suitable for databases with infrequent data changes.
    In the backup under this model, transaction logs will not be backed up, so its
    backup efficiency is relatively high.


    Since transaction logs are not backed up, the management of this model is simpler
    than other models. In this mode, when a checkpoint occurs, the database truncates
    the transaction log that has been committed to delete all inactive virtual logs.
    Since the system automatically cleans up the logs, the log files in this mode
    do not grow very fast, but some operations may cause the logs to grow rapidly
    (e.g. importing a large amount of data), which readers need to understand.


    Although the simple recovery model is simple to operate, its working principle
    leads to a problem, that is, when restoring, only the data at the backup time
    can be restored, while the data operation after the backup time cannot be restored,
    because the database will not back up the transaction log under this model. Therefore,
    this model is more suitable for small databases with'
