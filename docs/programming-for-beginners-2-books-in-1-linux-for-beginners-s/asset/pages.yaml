  md: '# # Chapter 9: Variable & Stored Routine in SQL


    In this chapter, we will in detail discuss stored procedures and their linked
    concepts. Stored procedures are used for automating tasks in an SQL server. There
    are numerous advantages to learning these procedures as a database administrator.
    Before diving into deep about stored routines and procedures we will discuss variables
    in SQL. Let us go!


    # ## Variables in SQL


    Variables are an entity that represents the memory block of the system. This memory
    block can be used to retrieve or use necessary by the system. A lot of user-made
    functions and stored procedures use variables.


    There are usually two types of variables namely local and global variables. However,
    it should be remembered that the user is only given access to create variables.
    Global variables are always generated by the SQL server and are often difficult
    to interpret by the user. All variables start with the symbol @. So, if you notice
    @ symbol then it represents a variable.


    # ### How to start using a variable?


    As said before, variables are primarily used in stored routines and procedures.
    We can use a DECLARE statement to start initiating a variable in the system. Here
    is the syntax.


    ```

    DECLARE {Enter variable name} {Enter the value}

    ```


    You can use the statement SET to give values to the variable. All you need to
    do is initiate the value as shown below.


    ```

    SET@VARIABLE = ''Enter value here''

    ```


    All the variables are used in selection and query. Variables can also be explicitly
    used to create user-made functions. We will discuss this in detail in the next
    chapters. For now, this is enough for understanding the basic structure of procedures.
    Let us go!


    # ## What are stored routines?


    The stored routine is a Transact-SQL program in a database and capable of realizing
    a specific function. It is a data object widely used in a database application.
    In SQL Server, besides operating data using system functions, user-defined functions
    can also be written using SQL programs.


    Stored routines are widely used and can contain almost all Transact-SQL statements,
    such as data'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'access statements, process control statements, error handling statements, etc.
    They are very flexible to use.


    # Stored Procedures


    First of all, the Stored Procedure is a program written in the SQL language that
    can realize specified functions. Secondly, this program is compiled by SQL Server
    and stored in the SQL database. Users can call these stored procedures with specified
    functions by passing their names and parameters. Stored procedures are also database
    objects. People usually use stored procedures to improve the security of databases
    and reduce the amount of network communication data.


    # Advantages of Stored Procedures


    +   a) Execution speed and high efficiency:


    Because SQL Server 2008 compiles stored procedures into binary executable code
    in advance, SQL Server 2008 does not need to compile stored procedures when running
    stored procedures, which can accelerate the execution speed.


    +   b) Modular programming:


    After the stored procedure is created, it can be called many times in the program
    without rewriting the T-SQL statement. After the stored procedure is created,
    the stored procedure can also be modified, and after one modification, the results
    obtained by all programs calling the stored procedure will be modified, thus improving
    the portability of the programs.


    +   c) Reduce network traffic:


    Since stored procedures are a set of Transact-SQL stored on the database server,
    only one stored procedure name and parameters are needed when the client calls
    them, and the traffic transmitted on the network is much smaller than that of
    this complete Transact-SQL programs, thus reducing network traffic and improving
    operation speed.


    +   d) Security:


    Stored procedures can not be used as a security mechanism. When users want to
    access one or more data tables but not have access rights, they can design a stored
    procedure to access the data in these data tables. However, when a data table
    does not have permission and permission control is required for the operation
    of the data table, stored procedures can also be used as an access channel to
    use different stored procedures for users with different permissions.'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'In SQL Server, stored procedures can be divided into three categories.


    a) Default active procedures:


    Default active procedures are generally prefixed with "sp_" and are special stored
    procedures created, managed and used by SQL Server itself. Do not modify or delete
    them. Physically, the Default active procedures are stored in the Resource database,
    but logically, the Default active procedures appear in the sys architecture of
    the system database and user-defined based.


    b) Extended Stored Procedures:


    Extended stored procedures are usually prefixed with "xp_". Extended stored procedures
    allow you to create your external stored procedures using other editing languages
    (such as C#) and their contents do not exist in SQL Server but exist separately
    in the form of DLL. However, this function may be abolished in future versions
    of SQL Server, so try not to use it.


    c) User-defined Stored Procedures:


    Stored procedures created by the user, which can input parameters, return tables
    or results, messages, etc. to the client, or return output parameters. In SQL
    Server, user-defined stored procedures are divided into Transact-SQL stored procedures
    and CLR stored procedures.


    Transact-SQL stored procedures, which store a set of Transact-SQL statements and
    can accept and return user-provided parameters; CLR stored procedures, which are
    references to Microsoft’s. .NET Framework Common Language Runtime (CLR) methods,
    can accept and return user-supplied parameters. CLR stored procedures are implemented
    as public static methods in .NET Framework programs.


