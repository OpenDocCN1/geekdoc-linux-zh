    the fields referenced in the view can only be explicitly specified when inserting
    data through the view. For those fields that are not referenced in the table,
    you must know how to fill the data without specifying a value.


    +   (3) Views cannot contain combinations of multiple field values or contain
    results using statistical functions.


    +   (4) A view cannot contain the DISTINCT or GROUP BY clause.


    +   (5) If WITH CHECK OPTION is used in the view, the clause will check whether
    the inserted data meets the conditions set by the SELECT statement in the view
    definition. If the inserted data does not meet this condition, the SQL Server
    will refuse to insert the data.


    +   (6) You cannot use data modification statements for multiple underlying tables
    in one statement. Therefore, if you want to add data to a view that references
