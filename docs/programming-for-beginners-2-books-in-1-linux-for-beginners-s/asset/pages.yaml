    Look up the major of the student named "Ram" from the names table.


    Analysis: Sometimes, people often ignore the case of English letters, for example,
    "ram krishna" is written as "Ram Krishna". At this time, if the database management
    system does not have the function of automatic conversion and matching, the two-character
    strings will be regarded as the names of different people, resulting in query
    errors.


    To solve problems, all letters of the string in the database should be converted
    to uppercase (or lowercase) letters, and then compared with the string of uppercase
    (lowercase) letters, example, look at the following SELECT statement:


    ```

    SELECT { Table name } FROM { Column name } WHERE UPPER(Column name)=RAM KRISHNA''

    ```


    Note: SQL Server can automatically convert uppercase and lowercase letters for
    matching. However, to be on the safe side, it is recommended to use the above
    method when querying English strings.


    # Other System Functions


    +   1. Text and Image Functions


    Text and image functions can change the values of text and image, which process
    the values or columns entered by text or image and return information about the
    values.'
