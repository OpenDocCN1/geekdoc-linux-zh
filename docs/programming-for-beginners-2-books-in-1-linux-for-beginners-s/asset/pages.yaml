  md: '# Creating large amounts of data


    When querying large amounts of data, indexing technology can be applied. An index
    is a special type of database object that holds the sort structure of one or more
    columns in a data table. Effective use of indexes can improve the efficiency of
    the data query. This section focuses on the creation of indexes and related maintenance
    work.


    An index is a separate, physical database structure. In SQL Server, an index is
    a decentralized storage structure created to speed up the retrieval of data rows
    in a table. It is built for a table, and the rows in each index contain logical
    pointers to physical locations in the data table to speed up retrieval of physical
    data.


    Therefore, whether to create indexes on the columns in the table will have a great
    impact on the query speed. The storage of a table is composed of two parts, one
    part is used to store the data pages of the table and the other part is used to
    store the index pages.


    Usually, index pages are much smaller for data pages. In data retrieval, the system
    first searches the index page to find the required data, and then directly reads
    the data from the data page through pointer, improving the query speed.


    The way the database uses indexes is very similar to the catalog of books. Indexes
    allow a chance of viewing through a complete book. In a database, indexes can
    be used for introspecting a table without having to scan the entire table.


    After understanding the basic concepts of indexes, the following describes the
    advantages and disadvantages of using indexes and the conditions for using indexes.


    # 1. Advantages of using indexes


    +   (1) Create a unique index to ensure the uniqueness of each row of data in
    the database table.

    (2) The creation of indexes is directly proportional to the increase in the speed
    of the system.

    (3) The accelerator and the table are of special significance in realizing the
    extra advantages of the data.

    (4) When using GROUP BY and ORDER BY you should be aware that the grouping and
    ordering time in the query can also be reduced.


    # 2. Disadvantages of Using Index


    +   (1) It is a very high turmoil to look at indexes and maintain indexes, which
    increases with the'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'increase in data volume.


    (2) The index needs a lot of storage indication. In addition to the data table
    occupying data space, each index also occupies a certain amount of physical space.
    If cluster indexes are to be established, the space required will be larger.


    (3) When adding, deleting and modifying the data irrespective of circumstances,
    the index is used in a separate mechanism that it reduces the overall capability
    of the system.


    # Classification of Indexes


    The data in the database page of SQL Server can be divided into two types according
    to the storage structure: Clustered Index and Non clustered Index.


    # 1. Cluster index


    Cluster index (also called "clustered index") means that the physical storage
    order of data rows in the table is the same as the index order. Cluster index
    consists of upper and lower layers: the upper layer is an index page, which contains
    index pages in the table and is used for data retrieval; the lower layer is the
    data page, which contains the actual data and stores the data in the table.


    When creating a clustered index in a column of the table, the data in the table
    will be reordered according to the index order of the columns and the table will
    be modified. Therefore, only one cluster index can be created in each table. Cluster
    indexes are created on columns that are frequently searched or accessed sequentially.


    # 2. Non-cluster index


    The nonclustered index (also called "nonclustered index") does not change the
    physical storage location of the data rows in the table. Data is stored separately
    from the index and is linked to the data through the pointer carried by the index.
    Non-cluster indexes are similar to those in textbooks.


    The data is present in one place, the index is present in another place, and the
    index has a pointer to the storage location of the data. The items in the index
    are stored in the order of index key values, while the information in the table
    is stored in another order (this can be specified by nonclustered indexes).


    A table can contain multiple nonclustered indexes, and a nonclustered index can
    be created for each column commonly used when looking up data in the table.'
