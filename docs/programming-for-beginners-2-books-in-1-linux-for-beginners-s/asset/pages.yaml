    # e) Relationship between tables


    In a relational database, tables are associated with each other. When associating,
    we must understand the relationship between tables. There are three relationships
    between tables. One is the 1: 1 relationship, the other is the 1: n relation and
    the last is the n: n relation. Understanding the relationship between tables is
    of great help to SQL optimization, SQL equivalent rewriting, table design optimization
    and table, and database partitioning.


    When the two tables are associated, if the two tables belong to a 1: 1 relationship,
    the results returned after the association also belongs to a 1 relationship, and
    the data will not repeat. If the two tables belong to a 1: n relationship, the
    result set returned after the association belongs to an n relationship. If the
    two tables belong to the N: N relation, the result set returned after the association
    produces a Cartesian product of local scope. The N: N relation generally does
    not exist in the inner/outer connection, but only exists in the semi-connection
    or the reverse connection.


