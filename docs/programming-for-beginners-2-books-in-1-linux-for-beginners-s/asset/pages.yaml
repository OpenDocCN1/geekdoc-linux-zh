  md: '# Database security


    Database security is usually divided into four core concepts namely encryption,
    tracking, authentication and authorization.


    +   a) Encryption


    Encryption is a process in which all the data we are dealing with is changed into
    random unusable data using different encryption algorithms. This encrypted algorithm
    can only be dealt with if you have the required keys for decryption. Databases
    such as SQL servers usually use advanced encryption algorithms for security purposes.


    +   b) Authentication


    Authentication is a procedure in which a database validates the credentials of
    the users and presents his instance data. Authentication is a complex process
    and has advanced in technicality as years flow. Authentication is usually done
    using secret codes known as passwords. Some of the advanced database systems will
    ask you to provide magnetic cards or fingerprints for authentication.


    +   c) Authorization


    After authentication servers check the resources and will provide instances that
    you are authorized. Authorization is important if you are dealing with a lot of
    administrators. Sometimes you may want to revoke access for a particular user
    for whatever reason it may be. Authorization revokes can make this happen without
    hiccups.


    +   d) Change tracking


    Advanced industries use tracking systems to track their employees. Any employee
    with any malicious intent can be easily caught by this feature tracking systems
    note down every SQL query statement that is being performed. All the statements
    are documented and can be easily seen by users with advanced privileges.


    We will discuss some of these concepts in detail after knowing about the basic
    security model of SQL. Let us go!


    # The security model of SQL


    The security model of SQL is pretty basic and deals with three major characteristics
    as explained below.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# a) Principals


    Principals are the user entities that have access to a particular resource in
    the database. For example, USER A has principal permission to the databases and
    USER B doesn''t have permission to the databases. SQL has made easy of the security
    feature by creating Microsoft groups. It is easy for administrators to grant permissions
    using groups.


    # b) Securables


    Even after permitting groups SQL security can help to restrict who can access
    what. For example, in an organization programmer can''t access the back-end server
    information whereas Security analysts can look at both Backend and frontend servers.
    All the securable entities can be defined using schema. Any conflict in schema
    results in program errors leading to data loss.


    # c) Permissions


    Permissions are individual permissions to every filegroup and file that is present.
    This is an advanced security feature Linux offers for every user that is present.
    Using this function can recursively result in good security standards.


    # Creating and deleting a role


    To facilitate the management of databases, SQL Server refers to the concept of
    role, which is an aggregation of certain permissions. The role is used in many
    management systems today and can be said to be the basis for SQL Server to divide
    permissions. Roles are similar to groups. As long as managers assign permissions
    to roles, users inherit a certain role to achieve the purpose of assigning permissions.
    Using roles can only divide permissions quickly but also change permissions conveniently.
    Therefore, it not only increases the security of the database but also facilitates
    the database managers.


    Division of roles


    The roles in SQL Server are divided into two categories, namely:


    +   - Server-level roles.

    - Role at the database level.


    Although they are both called roles, the meanings represented by these two roles
    are different. The following are detailed descriptions of the meanings represented
    by these two roles respectively.'
