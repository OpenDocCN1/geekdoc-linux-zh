  md: '# Chapter 2: Installation of Linux


    Installation is a simple procedure if done right. Windows system is often hectic
    and takes a lot of time where a Linux installation procedure is minimal and often
    finishes in very little time. However, procedures slightly differ due to a high
    number of Linux Distros available. In this section, we will try to explain the
    installation procedure in a way that you can install any Linux operating system
    both in a virtual machine and by bootable devices. Follow along to know about
    it.


    Note:


    It is always good to have advanced planning before starting the installation procedure.
    Always learn about the Linux distro you are trying to install in detail. Make
    a list of necessary things required based on the guide files.


    In the below section we will discuss in detail the planning you need to be aware
    before proceeding with the installation procedure.


    +   a) Always make sure that you satisfy all the system requirements


    Different operating systems for different requirements to install. Always crosscheck
    the requirements in the Linux distro website and continue further with the installation
    procedure if you are sure about the prerequisites. Even with not satisfying requirements,
    Linux can be installed but you may face performance issues while using the operating
    system. So, it is always recommended to use Lightweight Linux distros if you are
    using older computers with fewer specifications.


    +   b) Should you lose windows?


    There are different types of OS installation. You can install the Linux version
    as a fresh install or you can run both Windows and Linux in the same system. However,
    a dual boot system can reduce the performance of the operating system. If you
    are reluctant to use windows then the dual boot is perfect. You can also experiment
    with a virtual machine if you support higher specifications as virtual machines
    in lower-end computers are buggy.


    +   c) Prepare all of your hardware


    Make all your hardware available during the installation procedure. A handful
    of Linux distros asks you to enter details about hardware devices such as CD-ROM,
    network card during the'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'installation procedure.


    d) Know about the Linux file system


    The most important prerequisite to install Linux is to know in detail about Linux
    file management system. It is mandatory to select the partition information during
    the installation. Make sure you are thorough about it. We will discuss partition
    in detail in the further sections of the chapter.


    # Minimum recommended system


    After careful consideration, we are showing you here the minimum system requirement
    that a Linux operating system needs


    +   1) A good Intel processor


    It is recommended to use a system that supports 486 or later Intel microprocessors.
    AMD and Pentium processors are well recommended for better performance.


    +   2) 1GB RAM


    It is recommended to maintain at least 1GB RAM for better performance. As RAM
    size increases the performance of the Linux system increases exponentially.


    +   3) 20GB free hard disk space


    Most of the hard disk space will be occupied by Linux system files. However, it
    is recommended to maintain at least 20GB free hard disk space to give a seamless
    and smooth performance.


    In the next section, we will discuss in detail Linux partition systems.


    First of all, Linux deals file systems in total contrary to windows. Windows usually
    represent hard drive using Local disks as Local disk C, Local disk D, etc... Whereas
    Linux represents them as /dev/sda,/dev/sdb... Here a the first Linux hard drive
    system and it continues cumulatively.


    # What is the partition?


    Partition is a process in which a hard drive is divided into distinctive pieces
    to continue with the system installation. There are different partitioning schemes
    such as the MBR partitioning scheme. There are different partitioning techniques
    to be used while installing the Linux system. We will discuss some of them in
    layman''s terms in this section.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'As known technically there are three types of partition schemes namely primary,
    extended and logical.


    Usually, a lot of Linux Distribution systems use the following scheme to install.


    +   a) A significant part of the system which is mounted as /root [This consists
    of system files and are often not editable]


    +   b) A very smaller portion of the drive which is mounted for the RAM. Usually,
    this partition system is known as swap


    +   c) Normal hard drive partition that can be used to store files. This is usually
    represented as /home.


    You can normally select the partition system sizes during the installation procedures
    according to your requirements. With this, we have a good understanding of the
