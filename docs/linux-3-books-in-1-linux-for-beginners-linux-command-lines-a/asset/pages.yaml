    # How Does This Script Work?


    When you run this script, the system will print the question, “what is your name?”


    You will then see that the system is expecting input from you. If you type Mark,
    the string Mark is then stored in the variable **name**. In the next line of code,
    the script uses the name provided to ask the next question, “How do you do Mark?”
    where the variable **name** gets replaced by the string entered by you earlier.
    The system again expects the answer to this question as input from you. When you
    type it, it is again stored in another variable called **remark**. So if your
    answer is “fine,” the script will replace the variable **remark** with your string
    in the next line of code and print the output as “I am fine too!”


    # More Shell Scripting Examples


