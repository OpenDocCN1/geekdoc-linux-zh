  md: 'as vim has detected the correct terminal type. The vim command includes those
    for cursor navigation, as you can see below:


    +   - The command h in vim Linux editor is used to move to the left by one character.


    +   - The command l in vim Linux editor is used to move to the right by one character.


    +   - The command j in vim Linux editor is used to move down the cursor by one
    line.


    +   - The command k in vim Linux editor is used to move up the cursor by one line.


    +   - The command PageDown or Ctrl-f in vim Linux editor is used to move forward
    one screen of your data.


    +   - The command PageUp or Ctrl-b in vim Linux editor is used to move forward
    one screen of your data.


    +   - The command gg in the vim Linux editor is used to shift to the first line
    in the buffer.


    +   - The command G in vim Linux editor is used to move to the last line in the
    buffer.


    +   - The command num G in vim Linux editor is used to move to the line number
    in the buffer.


    The vim editor carries a special feature in the normal mode that is known as the
    command line mode. The command line mode offers an interactive command line where
    you may enter additional commands to control different types of actions in the
    vim editor. To get to the command line mode in the vim editor, you have to press
    the colon key while you are in the normal mode. The cursor will move to the message
    line. Here you will see a colon popping up on the screen which indicates that
    you should now enter a command.


    When you are in the command line mode, you may enter several commands to save
    the buffer to file and move out of the editor.'
