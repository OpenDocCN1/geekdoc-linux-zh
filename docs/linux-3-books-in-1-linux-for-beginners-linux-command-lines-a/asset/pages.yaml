    Let us go through the main subdirectories under the root directory.


    # */usr*


    This subdirectory has files of software that is common to all users. It is further
    subdivided as follows.


    +   * /usr/bin: User command files

    +       * /usr/sbin: Commands used in system administration

    +       * /usr/local: Files of software that has been customized locally


    # */etc*


    Files related to system configuration are stored in this subdirectory.


    # */var*


    This subdirectory stores files that change dynamically, such as databases, logs,
    etc.


    # */run*


    Certain files that get created during runtime are stored in this subdirectory.
    These files will get recreated again on the subsequent boot.


    # */home*


    This subdirectory has all the different users of the Linux system listed under
    it. Every user has their particular home directory as well. A user can store all
    their data under their home directory. A user cannot access the home directory
    of another user.


    # */root*


    This is the home directory for the root user, and no one other than the root user
    can access it.


    # */tmp*


    As the name suggests, this subdirectory stores all temporary files. If files in
    this directory are older than ten days and haven''t been accessed, the system
    deletes them automatically. A similar directory exists at /var/tmp that has'
