  md: '# **Password Policies in Linux**


    If you allow users to access the server remotely, you need to enforce and implement
    password policies using a module in Linux called PAM. You can invoke this using
    `pam_cracklib.so`. You can use this module to check the passwords entered by users
    against any dictionary words. This prevents the use of weak passwords. The module
    also allows you to define any new password requirements, such as complexity and
    length. On Debian and Ubuntu systems, you can install this module using the command:
    `sudo apt-get install libpam-cracklib`.


    Red Hat and CentOS variants come with this module installed. Once you have the
    distros installed, you need to open and edit the configuration file. If you use
    Debian or Ubuntu, open the file in a text editor. You can do this using the following
    command: `sudo nano /etc/pam.d/common-password`. The file will be stored with
    a new name on CentOS. Use the command `sudo vi /etc/pam.d/system-auth` to access
    the file.


    When you install the module on Debian or Ubuntu, the password is configured on
    the server, and the checks are performed. Therefore, you need to find a setting
    corresponding to this and change it, so it looks like the following: `password
    required pam_cracklib.so retry=3 minlen=8 difok=3 dcredit=1 ucredit=1 lcredit=1`.
    If you use CentOS, you may need to add the entire line above directly to the configuration
    file, but this is dependent on the version you are using.


    Let us look at the parameters and see what they mean:


    +   1. **Retry**: This parameter defines the number of times the user can enter
    an incorrect password

    +   2. **Minlen**: This parameter defines the minimum length every password should
    have

    +   3. **Difok**: This parameter is used to check the number of characters reused
    in the current password when compared to a previous password

    +   4. **Dcredit**: This indicates the numerals you need to have in your password'
  merge: -1
  img_proc: true
