    # The KDE Editor Family


    If you are using a Linux distribution that uses KDE desktop, you will see a couple
    of options in relation to text editors. The KDE project will officially support
    a couple of editors, such as Kate and KWrite. Both are graphical text editors
    containing a number of advanced features and some extra niceties that are not
    found in some common standard editors. This section will describe each editor
    and also the features that you may use in shell scripting.


    # The KWrite Editor


    This is the basic editor for the KDE environment. It offers word-style text editing
    with support for code syntax editing and highlighting and is used for different
    types of programming languages. It uses color-coding to distinguish comments,
    constants, and functions. You should notice that the for loop carries an icon
    that connects the opening and closing braces. The editing window provides cut-and-paste
    capabilities.


    The editor has many command line parameters you may use to customize how it starts.'
