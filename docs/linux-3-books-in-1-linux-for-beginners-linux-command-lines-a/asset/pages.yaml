  md: '# **Open-Source**


    The term Open-source was introduced in 1998 to differentiate it from the English
    word ‘free.’ The Open-source Initiative defined open-source software. Ever since,
    open-source has become very popular and continues to grow.


    Ubuntu is an open-source operating system. There have been arguments if the free
    and open-source are the same thing, but Ubuntu maintains that it does not see
    free and open-source as incompatible or different. Ubuntu supports individuals
    from both movements.


    If you read through the goals above, you will realize that Ubuntu makes it clear
    that a user should have the freedom to use free software. Why is this so important?
    Firstly, a user benefits practically from faster, better, and more flexible software
    than other operating systems. A user also transcends their role as a consumer
    and user of the software. Ubuntu wants to empower software and make it work as
    required by its users. The software has to be free, and Ubuntu includes this in
    its philosophical goal.


    Free software is not the end of the goals proposed by Ubuntu. It also has two
    other equally important goals. The first one states that every computer user should
    be able to use a computer in a language that suits them best. This is a nod to
    the fact that not everyone in the world knows English, but still, the majority
    of software in the world is only in the English language. There is a lot of textual
    content in software, and it has to be written using a language; but if this is
    only in English, many people in the world will not be able to use the software
    at all. A computer is a tool that educates and empowers, but it can do so only
    if the user understands its interface. Ubuntu believes that it is the people and
    the Ubuntu community''s responsibility to ensure that any user in the world can
    use their language of choice when they use Ubuntu. This translation is made possible
    through the first philosophical point that Ubuntu makes about the ability to make
    modifications, which is a feature of free and open-source software.


    Finally, just as a user should not be restricted from using software because of
    language constraints, they should also not be restricted from using a computer
    because of any disability. Ubuntu ensures that it is accessible to users with
    vision disabilities, motor disabilities, or hearing disabilities. All of'
