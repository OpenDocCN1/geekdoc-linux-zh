- pgno: 25
  md: '# Chapter Two


    # Ubuntu


    We have discussed the various distributions of Linux in the previous chapter.
    We have learned that Ubuntu is one of the best Linux distributions for new users
    to transition smoothly from Windows to Linux. We will be using the Ubuntu Linux
    distribution throughout this book.


    Let us quickly go through the history of Ubuntu.


    In April 2004, around a dozen developers from GNOME, Debian, and GNU Arch projects
    came together to brainstorm under Mark Shuttleworth''s leadership. Shuttleworth
    only had one question for them – whether it was possible to create a better operating
    system. And all of them had the same answer, “Yes.” They then brainstormed over
    how it would look like and talked about the community responsible for this operating
    system. The group worked to define the answers for these questions put forward
    by Shuttleworth and decided to turn these answers into reality. They named their
    group the Warthogs and gave themselves a 6-month timeline to develop a proof-of-concept
    operating system. The first release of their operating system was named the Warty
    Warthog as they assumed that the first release would have its warts. After this
    release, they got down to real business.


    If you get in touch with anyone privileged enough to see the first release of
    the Warthogs, they’d tell you about how fulfilling it has been to see the progress
    made by this operating system over the years. Ubuntu had a very strong beginning
    and had surpassed everyone’s expectations. Within no time, Ubuntu made it to the
    number one ranking of GNU/Linux distributions. Ubuntu had amazing growth compared
    to any GNU/Linux distribution and experienced an impressive first year. Even after
    that, it continued to grow over the years.


    It is surprising to see that just after a few years of its launch, millions of
    users had already moved to Ubuntu. And thousands of users from these millions'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'also give back to Ubuntu by developing code, documentation, and translations.
    Given this, Ubuntu is improving every day.


    # What Does Ubuntu Mean?


    The Warthogs had a good team and a vision for their goals, but the team did not
    have a name for the project. It was Shuttleworth who insisted that the name be
    Ubuntu.


    Ubuntu is a term and a concept that comes from numerous South African languages
    such as Xhosa and Zulu. It refers to the South African ethic or ideology that
    can be translated to “humanity toward others” or “I am who I am because of who
    we all are.” A few others have translated Ubuntu as “the belief in a universal
    bond of sharing that connects all humanity.” Archbishop Desmond Tutu, a human
    rights activist from South Africa, described Ubuntu as follows.


    > “A person with Ubuntu is open and available to others, affirming of others,
    does not feel threatened that others are able and good. He or she has a proper
    self-assurance that comes from knowing that he or she belongs in a greater whole
    and is diminished when others are humiliated or diminished when others are tortured
    or oppressed.”


    Shuttleworth had numerous reasons for choosing the name Ubuntu for the project.


    +   1. It was a South African concept. The people working on Ubuntu may not be
    from South Africa, but the project’s roots are. Shuttleworth wanted a name that
    represented this.

    +   2. The project is about relationships with others and lays a foundation for
    a community that shares and collaborates. These are the core pillars of free software.

    +   3. The Ubuntu team wanted to build a highly functional community that would
    have personal relationships built on connections and mutual respect. The term
    Ubuntu would tell people how the project was formed and the future vision for
    it.


    Due to all these reasons, the name was perfect, and it stuck for good.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# The Vision


    The full-time developers of Ubuntu had to be paid, and Shuttleworth needed a company
    through which he could employ them. Shuttleworth wanted the best developers from
    the free and open-source community to work toward the development of Ubuntu. The
    developers would be from all over the globe, resulting in the elimination of geographic
    or national boundaries. Rather than having a physical company where everyone would
    sit together, Shuttleworth decided to employ the developers through a virtual
    company. Although this had its cons, like different time zones, bandwidth and
    latency issues, etc., it also had many benefits. The employees’ distributed nature
    meant that the company could recruit new employees from anywhere in the world
    without asking them to pack their lives and move to a new country for work. This
    also eliminated the common water cooler problem, where employees in an office
    usually spend time at a water cooler having personal conversations. Since this
    was a virtual company, employees would have personal conversations over messengers
    while simultaneously working on the project. The company was named Canonical,
    and the closest thing to an office it had in the initial years was Shuttleworth’s
    residence in London. Today, the company has multiple offices around the globe,
    but most of its employees work from home. Needless to say, the developers depend
    a lot on Internet collaboration.


    # The Ubuntu Community


    The credit for what Ubuntu is today goes to the Ubuntu community. We already know
    that the definition of Ubuntu also revolves around people and a community. We
    will be discussing in a dedicated chapter how you can become a part of the Ubuntu
    community.


    # Goals and Promises


    # Philosophical Goals


    Ubuntu’s most important goals are philosophical. You will find the philosophy
    of Ubuntu documented in detail on their website. We have put down the main philosophies
    from their website verbatim below.


    # Ubuntu’s Philosophy'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Ubuntu is a philosophy-driven Linux operating system, and its aim is to distribute
    free software across the world so that humans can benefit from it. The core ideas
    of the Ubuntu philosophy are as follows.


    +   1. A user should be able to download, install, distribute, use, and modify
    software for any requirement, and they should be able to do this for free without
    having to pay any licensing fees.


    +   2. Every user who owns a computer should be able to use any software on it
    in a language they prefer.


    +   3. Even if a user has a disability, they have the right to use a computer
    with software that supports their disability.


    These core ideas of Ubuntu’s philosophy are reflected in their operating system.
    When you install Ubuntu on your computer, the base operating system and all the
    software that comes with it already meets the above-mentioned ideals. Ubuntu constantly
    strives to provide software to users with a license type that gives the users
    complete freedom.


    # Free Software


    In Ubuntu, the word free in free software refers to the freedom to use software
    and not about costs, although Ubuntu is still committed to providing software
    without any charge. Ubuntu’s main objective with free software is to give complete
    freedom to its users who use their software. This freedom empowers Ubuntu users
    to grow and have a beautiful experience.


    What is free software? According to the Free Software Foundation, free software
    has the following set of freedoms.


    +   * The freedom to run any software for any requirement


    +   * The freedom to understand the software and make it meet your needs


    +   * The freedom to redistribute the software to help everyone else


    +   * The freedom to modify the software and launch it publicly such that everyone
    benefits from it'
  merge: -1
  img_proc: true
