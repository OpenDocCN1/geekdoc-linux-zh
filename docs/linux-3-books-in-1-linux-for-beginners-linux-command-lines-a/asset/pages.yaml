    # # The if-then Statement


    Many Linux shell scripting programs require some logic flow control between different
    commands inside the script, which means that the shell tends to execute different
    commands. In addition, it keeps the ability to execute different other commands
    that permit the script to loop through the commands based on the result of different
    other commands. We refer to them as structured commands. They are also known as
    conditionals.


    Structured commands allow you to shift the flow of the operations of a program.
    Some commands are executed, while others are skipped when they are caught up in
    certain conditions. In other programming languages, the object after an if statement
    is the equation that the system evaluates for True or False grounds. The bash
    shell if statement does not work that way. Instead, it runs the command that is
    defined on the if line. If this command''s exit status is considered zero, the
    commands that are listed under the then section tend to execute. If this command''s
    exit status is something else, the then commands are put on hold, and the bash
    shell jumps over to the next command in the script.


    ```

    ```

    $ cat testing5

    #!/bin/bash

    # I am now testing the if statement for bash shell

    if date

    then

    echo "The structured command has completely worked"

    fi


    $bash -f main.sh

    Tue Jan 26 05:02:54 UTC 2021

    The structured command has completely worked

    ```

    ```


    The script has used the date command on the if line. If this command is executed
    successfully, the echo statement must display the text string. When you are running
    the script from the command line, you will be getting the same results as above.
    The shell will execute the date command. Since the exit status was zero, it will
    also execute the echo statement that is listed in the then section. In the next
    example, I will test a bad command to see how it works.


    ```

    ```

    $ cat testing2

    #!/bin/bash

    ```

    ```'
