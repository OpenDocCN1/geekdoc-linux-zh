    DLNA sharing to share media to a smart TV or any other devices that support DLNA.
    Graphic drivers for NVIDIA GPUs are inbuilt into the Ubuntu install media now.
    This allows users to install drivers directly.


    Ubuntu is a great operating system and what we have discussed in this chapter
    is just the cream of the case. We urge you to explore more features so that you
