- pgno: 254
  md: '# # Chapter Nine


    # ## Linux Shell Scripting for Functions


    When you write your scripts, there is every chance that you will use the same
    code in several locations. If it is a small code, rewriting it isn''t such a big
    deal but, where you have large code that needs to be used in several places, it
    gets tedious. The bash shell provides the solution -- encapsulation. In this way,
    the code is encapsulated in a function, and this can be used wherever it is needed
    throughout the code.


    # **The Basics**


    When you start to write more complex scripts, there is every chance that parts
    of your code performing specific tasks will need to be reused. That could be something
    as simple as displaying a message multiple times to get answers from users. Or
    it could be more complex, perhaps complicated calculations that need to be used
    repeatedly in the script. No matter what it is, having to write the code over
    and again starts to get tiring, but luckily, the bash shell makes it easy. We
    simply write the code once and wrap it in a function. Name it according to the
    contents and, when you need that piece of code anywhere in the script, you can
    simply call the function name.


    # **Function Creation**


    Functions can be created in two formats. The first is using the keyword function
    with the function name assigned to it. The function''s name attribute defines
    the function, but the name should not be one of the reserved keywords; it should
    be unique and relate to the function contents. The commands are made up of several
    bash shell commands and when the function is called, the commands are executed
    in the order they were written in the function.


    The second format follows the same function creation pattern used in other programming
    languages.'
  merge: -1
  img_proc: true
