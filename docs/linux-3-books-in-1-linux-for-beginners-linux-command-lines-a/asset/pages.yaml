    # ## Linux File System Hierarchy


    To understand the Linux file system properly, you need to understand the Linux
    file system hierarchy first. The Linux file system hierarchy visually looks like
    an inverted tree with the root at the top and then branching downwards to form
    other parts.


    The root directory is represented as / and is located at the top of the file system
    hierarchy. The / character is also used to represent file paths in Linux. For
    instance, **var** is a subdirectory under the root directory and is represented
    as /var. Similarly, there is a subdirectory called **log** under the var directory,
    and its path is represented as /var/log.


    The root directory has a particular set of subdirectories under it that store'
