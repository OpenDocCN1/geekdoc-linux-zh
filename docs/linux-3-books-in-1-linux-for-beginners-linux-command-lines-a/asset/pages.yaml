- pgno: 350
  md: 'use the ICMP, TCP, and UDP protocols to scan the target systems and networks.
    The result of a successful scan will give you information such as operating systems,
    network hostnames, IP addresses, and services operated on the network. Some scanning
    tools can also be used to discover any vulnerabilities in the server and network.
    The details gathered in the scanning stage can be used in the exploitation stage
    to attack specific targets.


    # ## Nmap: The King of Scanners


    The Nmap scanning tool is one of the most popular scanning tools used by system
    administrators since it is the easiest way to help you list down all the active
    hosts present on the target network. You can also use it to determine operating
    systems, services, ports, and even user credentials in some cases. This tool uses
    a combination of options, switches, and commands to find the details and vulnerabilities
    in your system during the scanning stage of this lifecycle.


    # ### Timing Options


    We have learned above that the default timing option in the Nmap scan does not
    specify anything, but you can use the default value or choose from one of the
    options below. There is a feature in Nmap through which the user can specify the
    timing option he wants to use. This option can be used to override the default
    time option used in the tool. You can either choose to expedite the process or
    slow the process down if you need to.


    Using this timing template, you can enable various settings, especially the one
    where you add a delay between the scanning and parallel processing of the ports.
    The different timing templates can be explained using the options scan_delay,
    max_scan_delay, max_parallelism. We can use these options to measure every timing
    template so that an appropriate timing template is used for scanning a target
    network.


    You can use the can_delay option if you need to set the probes in the target system
    to a minimum number. You can use the max-scan_delay to define the scanner’s maximum
    time between delays made while scanning the ports and IP addresses in the server
    and network. If you ask why this is important, it is because certain systems respond
    to probes only at a specific rate. When you use these options, you will adjust
    to the different probes and find a way to meet the system’s requirements that
    you are scanning. The max_parallelism'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'option allows Nmap to send scan probes one at a time or in serial or in parallel.
    Let us look at the different timing options you can use in the Nmap tool.


    # -T0 Paranoid


    When you use this timing option, the scan is performed slowly, and the network
    links are slow. You may get detected when you run these scans on your Linux network
    or server. Using this timing option, the scan will work serially and pause every
    5 minutes. The max_delay setting is ignored during the scan when you use this
    timing template since the base scan_delay has a higher value than the default.


    # -T1 Sneaky


    This timing method is used to perform a sneaky scan of the network and server.
    This is better and slightly faster than the previous timing by maintaining your
    discretion. This scan also serially scans the target system but reduces the scan_delay
    to about 15 seconds. The scan_delay is reduced in number, but since the value
    is higher, Nmap will ignore max_scan_delay.


    # *Target*


    The target used in an IP address is an important part of the Nmap command string
    used, and if you end up using an incorrect target, you may end up scanning empty
    IP systems or spaces. You cannot do this as per the regulations. There are several
    ways to set a target for the Nmap scan, and we will look at the two common methods
    used to do this: IP address range and scan list.


    # **IP Address Range**


    Using IP Address ranges to define targets in the system is an easy process to
    define the range or port you want to use. Let us take an example of a class C
    IP address range for our example. If you use the C IP address, you can run the
    scan on 254 different hosts. To do this, you can use the command below. Using
    this, you can scan all the hosts on a particular IP address range belonging to
    class C.


    ```

    nmap 10.0.2.1 -255

    ```


    You can use the Classless inter-domain routing (CIDR) to run the same scan'
  merge: -1
  img_proc: true
- pgno: 352
  md: "on the server or system's ports. CIDR is a quick way to specify an IP address\
    \ range, but this is something beyond this book's scope.\n\n```\nnmap 10.0.2.1/24\n\
    ```\n\nIf the IP address being used is very small, you can use a smaller range\
    \ to define the target used in the scan. For instance, if you want to scan the\
    \ IP addresses within the range, you can use the following command: nmap 10.0.2.1\
    \ -50\n\n# ### Scan List\n\nYou can use text files as inputs when you need to\
    \ use the Nmap command to scan the list. The file will include the IP addresses\
    \ which are present in your target server or system. You can choose to use the\
    \ following IP addresses and store them in the target text file if you need to.\n\
    \n+   10.0.2.1  \n+   10.0.2.15  \n+   10.0.2.55  \n+   10.0.2.100\n\nThe syntax\
    \ of the above command is as below:\n\n```\nnmap -iL target.txt\n```\n\n# ###\
    \ Port Selection\n\nThe Nmap command structure allows you to determine the ports\
    \ you want to use by using the -p switch. This will help you determine the port\
    \ you want to scan. You can either specify a single port or a range of ports depending\
    \ on what you need to scan.\n\n```\nnmap -sS -p 1-100  \nnmap -sU -p 53, 25, 143,\
    \ 80\n```\n\nYou can also choose to combine both commands like the example below:\
    \ nmap -sS -p 1-100, 53, 25, 143, 80\n\n# ### Output Options\n\nThe results of\
    \ a scan you perform on the network and servers will scan the Nmap command results.\
    \ You can print the information on the terminal window, but it is not always a\
    \ good idea to do this. As the administrator, you need to save the file down with\
    \ the output, so you can use it to determine how to remove any vulnerabilities\
    \ in the system. You can redirect the output from"
  merge: -1
