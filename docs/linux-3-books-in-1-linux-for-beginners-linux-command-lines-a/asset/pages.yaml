    | none | swap | sw | 0 0 |

    | :--- | :--- | :--- | :--- |


    **Step Four:** The last thing you need to do is to save the file down and reboot
    the server. To do this, run the following command: swap /dev/sdd1 /dev/urandom
    swap


    When you reboot the system, you can verify if the swap space is active or not
    using the following command: # cryptsetup status swap.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# ## Chapter Nine


    # ## Using Access Control Lists in Linux


    Now that you know how to encrypt and protect your files and data using a password,
    let us understand how you can control access to the servers in Linux.


    # ### Introduction to Access Control Lists (ACL)


    An ACL is one that provides flexible and additional permissions for your files
    and directories. It is designed so you can work with the different file permissions
    in Linux. ACL also allows you to identify the permissions you need to set for
    each user or a group of users. You can also use it to protect any disc resource.


    # ### Uses of ACL


    Consider a situation where you have a user who is not a part of any user group
    on the server or network. This user needs to access files and make changes to
    them, so you will need to give him access using commands. This is where the concept
    of Access Control Lists comes into the picture. Using ACLs, you can grant flexible
    permissions to specific users in the system. If you are an administrator, you
    can use an ACL to define the fine-grained access rights for directories and files.
    You can use the keywords setfacl and getfacl to set up an ACL and view the ACL
    on your server or system. For instance, if you run the following command: getfacl
    test/declarations.h, you will receive the output below:


    ```

    # file: test/declarations.h

    # owner: mandeep

    # group: mandeep

    user::rw-

    group::rw-

    other::r—

    ```


    # ## List of Commands to Set Up ACLs'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'In this section, we will look at the different commands you can use to set
    up ACLs in your system.


    # **Adding Permissions to Users**


    You can do this using the following command:


    ```

    `setfacl -m "u:user:permissions" /path/to/file`

    ```


    # **Adding Permissions to Groups**


    To do this, run the command: `setfacl -m "g:group:permissions" /path/to/file`


    # **Allowing Files and Directories to Inherit ACL Entries**


    You can use the following command to allow a file or directory to inherit the
    properties or privileges found in an ACL from the directory it is a part of: `setfacl
    -dm "entry" /path/to/dir.`


    # **Removing a Specific Entry in the ACL**


    To do this, you can run the command: `setfacl -x "entry" /path/to/file`


    # **Removing Entries in ACL**


    There may be times when you might want to remove the entries in the ACL. To do
    this, you need to run the command: `setfacl -b path/to/file`. For instance, you
    can use the following to remove the declarations against the user Mandeeep: `setfacl
    -m u:mandeep:rwx test/declarations.h`


    # ## Modifying the ACL


    # **Adding Permissions for Users**


    To do this, you need to enter either the username or ID of the user who you want
    to add to the list. Use the following command to do this: `# setfacl -m "u:user:permissions".`


    # **Adding Permissions to Groups**


    This is similar to what was done in the previous section. You can use the group
    name and ID to add permissions. Use the following command to do this: `# setfacl
    -m "g:group:permissions"`


    # **Allow Files or Directories to Inherit the ACL Entries**


    You can use commands to let the files and directories obtain the properties'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'from the directory where the files and directories are present. To do this,
    you need to use the command: `# setfcl -dm "entry"`.


    For example, when you run the command `setfcl -m u:mandeep:r-x test/declarations.h`,
    the output will be the one in the image below.


    ![](img/aae83b54a1b1783f3f5369bd9062b27c_333_0.png)


    # ## Viewing ACL


    You can use the following command to view the permissions written in ACL: `# getfcl
