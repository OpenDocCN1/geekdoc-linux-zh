    Password aging can be enforced in two ways in a Linux operating system.


    +   1. By using the `chage` command on the command line.

    +   2. Through the graphical interface in the User Management settings.


    If you have sudo privileges, you can use the chage command with the `-M` option
    to set the user’s password validity. Look at the example below.


    ```

    `[student@desktop ~]$ sudo chage -M 90 alice`

    ```


    In the above example, the password validity for the user alice is being set to
    90 days. After 90 days, Alice will be forced to reset her password. You can simply
    disable password aging by setting the number of days to 9999, which is equal to
    273 years.


    # ## Access Restriction


    Using the chage command, you can set the expiry for a user account. Once the expiry
    is reached, the user will not be allowed to log in to the system. You can also
    use the `usermod` command with the `-L` option to lock a user account.


    ```

    `[student@desktop ~]$ sudo usermod -L alice`

    `[student@desktop ~]$ su - alice`

    `Password: alice`

    `su: Authentication failure`

    ```


    If a particular user is no longer needed on a system, you can use the usermod
    command to simultaneously lock and expire the account.


    ```

    `[student@desktop ~]$ sudo usermod -L -e 1 alice`

    ```


    A user will not be able to login to the Linux system when their account is locked.
    This practice is mostly followed by organizations to lock the user'
