    robust and complex logic in a shell script. Unlike the AND operator, any statement
    with an OR operator will return true when only one operand is true. False is returned
    when the operand on each side of the OR operator is false. Here''s an example:


    ```

    #!/bin/bash

    echo -n "Enter any number:"

    read n


    if [[ ( $n -eq 15 || $n -eq 45 ) ]]

    ```'
