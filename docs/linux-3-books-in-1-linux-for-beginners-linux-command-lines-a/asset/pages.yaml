    # Restrict SSH Access


    You can use the OpenSSH server to limit the number of connections to the server
    based on the group users is categorized into. This is a useful technique to have
    up your sleeve, especially if you have many users and you have some who should
    not access your server remotely. You can also do this to add more security to
    your server. For example, when you run a web service, you may not want everybody
    to access that service using the same server. To do this, you need to create new
    user groups. Use an apt name for the group. In the following command, we will
    create a group of users called sshusers: *sudo groupadd sshusers*.


    If you want to be a part of this group, add your username against the group’s
    name using the command: *sudo gpasswd -a <username> sshusers*. If you want to
    check who has been added to the group, you can use the command: *groups <username>*.
    The output of this command will show you the different groups of which the username
    is a part. You can also include another user group in the list for the same user.
    The list will also have a username that is the same as the name of the user.


    The output of the above command is: *user: user sudo sshusers*.


    Once this is done, you can specify the group you want to use for OpenSSH. To do
    this, you need to open the configuration file using an editor. If you have nano
    installed in your system, you can use the command: *sudo nano /etc/ssh/sshd_config*.
    Otherwise, you can use the command *sudo vi /etc/ssh/sshd_config*. At the end
    of your configuration file, you need to add the following line: *AllowGroups sshusers*.


    Ensure the configuration option you have chosen is not commented out using the
    hashtag sign in front of it. Save the file down and exit the editor. Now,'
  merge: -1
