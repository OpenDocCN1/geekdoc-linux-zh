    it is easier to do in a command-line system. Before I move on to exploring the
    commands that you can use to manipulate files and directories, I will explain
    some special characters that you can use in Linux.


    # Special Characters


    When you are discussing Linux with others, you may hear about some special characters
    that Linux users encounter during operations. Each special character has a job
    to do, knowing which will make things easier for you.


    +   *   \* is technically called asterisk or star. It is used for a regular expression
    and as a glob character.


    +   *   ‘ is technically called tick or single quote. It is used for literal strings.


    +   *   Special character . is technically called dot. It is used to denote the
    current directory you are working in or the hostname or file delimiter.


    +   *   $ is technically called the dollar sign. It is used for denotation of
    a variable or for representing the end of the line.


    +   *   \\ is technically called backslash. It is used for macros and literals.'
