- pgno: 56
  md: '# Chapter Five


    # Things to Do After Installing Ubuntu 20.04 LTS


    The codename for Ubuntu 20.04 LTS is Focal Fossa. Ubuntu has always been proud
    about shipping the operating system with inbuilt applications that can help a
    user get started soon after installation. The default apps and settings are set
    as per what most people like. But we do not want to assume that you are most people.
    You may not want everything, or you may want more than the default offerings.


    This chapter will help you tweak Ubuntu 20.04 LTS to improve your Ubuntu experience.


    # What’s New?


    Every version of Ubuntu differs from its previous release, and Ubuntu 20.04 LTS
    is no exception. The boot time on the Ubuntu 20.04 has been improved considerably,
    thanks to the new kernel compression algorithms. We have already discussed the
    Yaru theme and the OEM manufacturer’s logo showing up on the boot splash as well.


    # The Dark Mode


    The dark mode is the latest for any device today, be it a mobile or a computer.
