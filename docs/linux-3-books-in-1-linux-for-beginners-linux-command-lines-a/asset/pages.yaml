    # Traceroute


    If you use the traceroute command, you will see that the ICMP ping command is
    used to determine the number of devices that lie between the system and the network.
    This is one way for it to initiate the trace on the target system. The traceroute
    command functions by manipulating the Time To Live value of a network packet,
    also known as TTL. This term indicates the number of times a packet of data is
    moved through a network and is broadcasted repeatedly by the host before the packet
    of data expires.


    On Linux-based systems, the command to run a traceroute is traceroute. If you
    want to run the command on Windows, you can do it to check the vulnerabilities
    in the system and network. Let us take an example of a traceroute to google.com


    ```

    tracert www.google.com

    ```


