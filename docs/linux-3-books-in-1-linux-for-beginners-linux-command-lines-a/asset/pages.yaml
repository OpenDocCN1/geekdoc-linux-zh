- pgno: 353
  md: 'the scan and send it to a file. There are some built-in commands you can use
    if you prefer, and this allows you to redirect the output and move it onto a file.
    Let us go with each of these options.


    # **-oN Normal Output**


    You can use this output option to create a normal text file to ensure the output
    is stored in the form of a text file. You can use this file to evaluate the output.
    You can also use it as an input key for other programs: nmap -oN output.txt 10.0.2.111


    # **-oX Extensible Markup Language(XML) Output**


    Some applications and tools use XML files as their input when they perform a penetration
    test, and therefore, this option is extremely easy to use. You can also store
    the output in an XML format using the following command: nmap -oX Output.txt 10.0.2.111


    # **-oS Script Kiddie Output**


    The output files from a script kiddie attack cannot be used when you perform penetration
    testing, but these are a good way to determine how good the security in your network
    and server is. You cannot use the output from the following syntax for any industrial
    use.


    ```

    nmap -oS output.txt 10.0.2.111

    ```


    # **Nmap Scripting Engine**


    You need to learn how to build a custom script in Nmap if you do not want to use
    the built-in packages. If you are willing to use the preconfigured penetration
    tests in Nmap, you can use the following URL: https://nmap.org/nsedoc/.


    For instance, you can use this script to fetch the MAC address and the NetBIOS,
    each of which is important information you need for the target system. You can
    use the flag ‘—script’ as per the below example, along with the Nmap command followed
    by the script name.


    ```

    nmap --script nbstat.nse 10.0.2.111

    ```


    As a system administrator, you must ensure you have a script database and update
    it regularly. It is important for you to update the Nmap script as well'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'every time you perform a new penetration test on your server or network. To
    do this, use the following command: nmap --script –updatedb.'
