    and decrypt the information passed through the server. Traditional forms of cryptography
    use one key to encrypt and decrypt information, and this key should be available
    to both parties. It is assumed that the key is transferred carefully between the
    users. The public-key cryptography method uses two different keys to prevent the
    loss of the key used to decrypt information during the transfer. A public key
    is available for anybody who performs the encryption. The user, however, must
    ensure the decryption key used by them is kept private. They should not share
    this key with anybody over the network.


    PGP is another privacy option you can use to protect the data on your system and
