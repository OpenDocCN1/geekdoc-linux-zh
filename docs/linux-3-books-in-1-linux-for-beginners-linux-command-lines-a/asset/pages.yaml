  md: '# Chapter Eleven


    # Introduction to Shell Scripting


    The open-source programming language developed for Linux is known as Shell Scripting.
    Simply put, shell scripting is a series of individual Linux commands put together
    to be executed automatically. A shell script may have a single line of code or
    multiple lines of code that are stored in a single file such that a user does
    not need to type them manually every time they need to perform a specific task.


    We will introduce you to the basics of shell scripting in this chapter, and we
    will also briefly discuss some advanced concepts of shell scripting. This chapter
    will serve as a launchpad for you into the world of shell scripting.


    # Writing a Shell Script


    You can use a text editor to write a shell script. Linux has a set of inbuilt
    text editors such as nano, vi, and vim. You can use any of these to start writing
    a shell script. One thing you need to ensure is that the files you create for
    your shell script are executable. You can make any file executable by running
    the following command on the filename.


    ```

    ```

    $ chmod a+x filename.sh

    ```

    ```


    And then, you just need to store the file in a location that is easily accessible
    by the Linux operating system.


    The following steps go into the creation of a shell script.


    +   1. Create a new file using the text editor of your choice. Save the script
    file with a .sh extension.


    +   2. The first line of your script file should always be \#\!/bin/sh


    +   3. Type in some Linux commands.'
  merge: -1
  img_proc: true
