  md: 'accounts of employees who have left the organization. The account can still
    be unlocked later if needed by using the **usermod -u username** command in the
    event that the same employee rejoins the organization.


    # The Nologin Shell


    The nologin shell comes into the picture when you want to give login access to
    a user but do not want to give them a shell to interact with the system. The simplest
    example of this is a mail system that needs the user to have a username and password
    to check their mail, but the user does not need to access the complete Linux operating
    system. A user can be given a nologin shell at the time of user creation, or their
    shell can be modified later. This is done by defining the user''s shell as **/sbin/nologin**.
    If this is done, a user will not be able to log in to the Linux system.


    ```

    ```

    [root@desktop ~]# usermod -s /sbin/nologin student


    [root@desktop ~]# su - student


    Last login: Tue Mar 5 20:40:34 GMT 2015 on pts/0


    The account is currently not available.

    ```

    ```


    When you assign a nologin shell to a user, they cannot interact with the system,
    but at the same time, they also have some access to the system. The user will
    be able to use web applications for file transfer, etc.'
