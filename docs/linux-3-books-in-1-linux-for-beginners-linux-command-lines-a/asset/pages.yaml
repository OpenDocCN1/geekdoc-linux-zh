    # Users and Groups


    We will learn about users and groups in this section and try to understand how
    they are associated with the Linux operating system.


    # Who is a User?


    Every program or process that is running on the Linux operating system runs as
    a user. A user is the owner of a file or a directory in the operating system.
    Access and restrictions can be created on a file or a directory based on the user.
    This being said, when a process is running as a user, the files and directories
    that a particular process has access to will depend upon the user of that process.


    You can type the `id` command on the Linux terminal to know the user’s details
    that are currently logged into the operating system. You can pass another username
    as an argument to the `id` command if you wish to get another user’s basic details.


    You can use the `ls -l` command to know the user associated with a file or a directory.
    This user will be the owner of that file or directory.


    You can use the `ps` command to know the ongoing processes in the Linux operating
    system. The default output will give you a list of all the ongoing processes of
    the current shell only, but you can list the ongoing processes across every shell
    by using the `ps a` command. You can also pass the `u` option with the `ps` command
    if you want to know the user that is associated with a particular process. The
    first column of the output will show you the user that'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'owns the process.


    The outputs that you just learned about give you the user details by their usernames,
    but the Linux system tracks all its users using a user ID known as UID. The Linux
    system maintains a database to map the username to the numeric IDs. The information
    for all users is stored in a file at /etc/passwd. This file has seven fields as
    follows.


    username:    password:    UID:    GID:    GECOS:    /home/dir:    shell


    +   - The username field will have the username for a user in the Linux system.


    +   - The password is the password for that user, but it is not stored here anymore.
    It is now stored in a file at /etc/shadow in a hashed format.


    +   - The numeric ID assigned to a user in the Linux system is mentioned under
    UID.


    +   - The group ID for a user is mentioned under GID. We will discuss groups later
    in this chapter.


    +   - The GECOS field uses arbitrary text and is mostly the complete name for
    the user.


    +   - The user’s home directory in the Linux system is mentioned under /home/dir
    and is the directory where all the files for a user are stored.


    +   - The shell field mentions the program that runs when the user logs in. For
    a regular user, it will be the command prompt.


    # What is a Group?


    The Linux system maintains groups just like users. Groups are maintained using
    numbers, too, known as Group IDs or GIDs in short. The information for groups
    is stored in the file at /etc/group.


    There are two types of groups, primary and supplementary.'
