  md: '![](img/aae83b54a1b1783f3f5369bd9062b27c_53_0.png)


    # ## Performance Computing and Gaming


    Machine Learning and Artificial Intelligence are the latest in data engineering,
    and enterprises are adopting these technologies rapidly. Ubuntu has taken note
    of this and is already integrating support for Artificial Intelligence for enterprises,
    from developer workstations to server racks, to the Edge and the cloud.


    Ubuntu empowers data science on desktops and servers by providing the latest applications,
    libraries, and drivers needed for it. Data scientists can use Kubeflow on powerful
    Ubuntu systems to create AI models before deploying them on servers or public
    clouds. Ubuntu has become a standard for machine learning, from Wall Street to
    Silicon Valley. It is the first choice for both startups and fortune 50 companies.


    If you also have a GPU on your system that you use for entertainment and gaming,
    Ubuntu 20.04 LTS has new features that will make you very happy. Ubuntu 20.04
    LTS has an updated Steam package that supports new controllers and virtual reality
    peripherals if you are a gamer. You will also have Feral Interactive’s GameMode
    installed by default in Ubuntu. GameMode is a daemon that optimizes the operating
    system and the game process temporarily to have a rich gaming experience. At present,'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'GameMode optimizes the CPU governor, process niceness, Input-Output priority,
    kernel scheduler, GPU performance mode, screensaver inhibiting, GPU overclocking,
    and custom scripts.


    If you have hybrid graphics for your system, you can now launch applications through
    the discrete GPU available in the GNOME shell. This can be done by using the ‘Launch
    on Discrete GPU’ item on the menu. This is supported for both NVIDIA and AMD GPUs.


    Ubuntu also supports VA-API and nvenc through FFmpeg if you are a live streamer
    or a video content creator. These are features that are integrated into GPUs for
    encoding, decoding, filtering, etc. These features also offload intensives tasks
    from the CPU such that they are processed by the GPU instead. Applications such
    as Shotcut and OBG Studio use nvenc to benefit greatly from these hardware-encoding
    features.


    # ZFS and ZSYS


    The ZFS file system was introduced as an experiment on Ubuntu 19.10. ZFS is shipped
    by default on Ubuntu 20.04 LTS that features encryption through hardware, pool
    trim, device removal, and improved performance. As mentioned earlier, ZFS is still
    in its experimental stages.


    Zsys is an integration tool for Ubuntu and ZFS. Zsys takes an automatic snapshot
    of the system state whenever new software is installed, or the whole operating
    system is updated. This feature helps a user do a rollback on the system to a
    previous stable state if the new software or the new update causes issues in the
    system. You will be able to find these snapshots in the boot menu. This can also
    be used to create backups for the future.


    # Changes since Ubuntu 18.04 LTS


    It is a known fact that Ubuntu users like to stick to Long Term Support releases.
    Users who are upgrading from Ubuntu 18.04 LTS to 20.04 LTS will see a huge number
    of changes as Ubuntu 20.04 gathers all the features that have been rolled through
    Ubuntu 18.10, 19.04, and 19.10. Let us highlight the most interesting changes.


    GNOME Disks now support open-source disk encryption when you are formatting any
    disk. The performance for window previews and desktop'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'zoom has been improved. Crash reports are now sent automatically by the bug-reporting
    tool whenever an application crashes. This is helpful, as the user is not interrupted
