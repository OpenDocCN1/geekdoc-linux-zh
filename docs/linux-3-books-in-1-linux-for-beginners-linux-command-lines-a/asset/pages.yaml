- pgno: 23
  md: '# Linux


    Unlike Windows and macOS, the Linux operating system is completely open-source.
    This means that millions of people in the world are playing with the Linux code
    every day. The Linux community is constantly looking for any vulnerability in
    the operating system and patches them as soon as possible. Obviously, the more
    people who review the code, the more secure the operating system becomes. In contrast,
    if you have a small team reviewing code for operating systems, as in the case
    of Windows and macOS, it is natural to have issues, and the number of vulnerabilities
    will also be more.


    It is a popular belief that Linux is far more secure compared to Windows or macOS,
    and this is because Linux offers multiple options to run any process in a sandbox
    environment before it can be run in a live environment. Linux also has numerous
    security aspects that run hand in hand with each other. Before even implementing
    security using firewalls, Linux solves 99% of security issues by just implementing
    permissions.


    For instance, let us talk about Fedora, which is a popular distribution of Linux.
    Fedora has a default feature called Security-Enhanced Linux, also known as SELinux
    in short. SELinux applies security policies, access controls, and many more security
    features automatically. Fedora also has a compiler feature called Position-Independent
    Executable (PIE) that creates a hardening wrapper around all its processes. This
    process is also known as security hardening.


    Contrary to popular belief, vulnerabilities in Linux can be discovered and patched
    instantly because of its open-source nature, but Linux is missing additional security
    measures such as sandboxing and hashing. Most people in the world fail to trust
    the Linux operating system because it is open-source, free, and has limited security
    support. Many businesses believe that since people can play with open-source code,
    it is not secure, but this logic is incorrect. Most web servers in the world today
    run on the Linux operating system specifically because it is much more secure
    against attacks.


    # What can we take away from this comparison?


    More than 75% of desktops run versions of the Windows operating system worldwide,
    with Apple having around a 10% market share. Concerning the'
