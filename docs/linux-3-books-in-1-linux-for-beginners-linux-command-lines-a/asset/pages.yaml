    # Returning a Value in Linux Functions


    The bash shell tends to treat functions such as mini-scripts that have an exit
    status. You can generate exit status for functions in three different ways. The
    exit status by default is something that is returned by the final command in a
    function. After the execution of the function, you may use the standard $? variable
    to determine its exit status.


    # Passing Parameters to a Function


    The bash shell treats functions like mini-scripts, which means that you may pass
    parameters to a function like a regular script. Functions may use a standard parameter
    environment variables to represent the parameters that are passed to a function
    on the command line.


    ```

    $ cat test6

