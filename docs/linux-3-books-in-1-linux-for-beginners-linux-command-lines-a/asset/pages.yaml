  md: '# Chapter Seven


    # Editing Text Files in Linux Using Vim


    In this chapter, we will learn how you can edit text files in Linux. There are
    applications available on the graphical interface of any Linux distribution that
    you can use to edit text files, but the essence of editing a text file in Linux
    is via the command line. The habit of editing text files in Linux through the
    command line will take you a long way, and we personally advise that this is the
    best way to edit files in Linux.


    There are many text editors available in Linux, such as nano, vi, and vim. We
    will be using the Vim text editor for our book, as it is the most popular one.
    If you have installed Ubuntu on your computer as per the installation chapter,
    vim may or may not be available by default on it. But there’s nothing to worry
    about. Installing vim on Ubuntu is very easy.


    Launch the terminal on your Ubuntu system and type the following command.


    ```

    apt install vim

    ```


    Remember that you need to be logged in as the root user to run this command.


    Hit enter, and the system will install vim on your Ubuntu system.


    # Introduction to Vim


    Editing files is an important skill in Linux as a beginner and as you progress
    with your experience with Linux systems. If you start loving Linux as an operating
    system and want to make a career in it, you may want to look up a Linux System
    Administrator profile. Linux system admins use text editors like vim daily to
    edit configuration files in Linux and write their own shell scripts to automate
    tasks.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Vim is an extensive tool. It supports text completion modes scripts in multiple
    programming languages, file type plugins, and many other features. Vim is so popular
    that third-party plugins are available for it on the internet that can help you
    achieve many things, such as editing a simple file, auto completion for various
    programming languages, and very simple tasks such as to-do lists.


    # Vim Versions


    There are three versions of vim, and every version has its use case, but it is
    possible to have all three versions side by side and use all of them. The following
    are the versions of vim.


    # Vim-Minimal


    This package contains an older version of vim known as just vi. The commands that
    can be used with this version of vim are also those that could only be used with
    vi.


    # Vim-Enhanced


    This package contains vim and includes syntax highlighting, spell check, and file
    extension plugins.


    # vim-X11


    This package of vim includes gvim that has graphical interface support for editing
    files too. The most popular feature of gvim is its menu bar. It is popular with
    new learners who struggle initially to remember vim commands on the terminal.
    It also has support for the mouse to be used inside a vim session on the terminal
    too.


    # Vim Modes


    Vim is not known to be a very easy editor because it has multiple modes. This
    means that the keyboard keys you use have different functions based on the mode
    that you’re in. You do not have to worry as this chapter will guide you step by
    step with vim, and you will fall in love with it.


    The following three modes are present in vim.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '| Function | Mode |

    |---|---|

    | Command mode | You can do file navigation, cut, copy and paste functions, and
    other simple commands in this mode. Commands like undo and redo can also be performed
    in this mode |

    | Insert mode | Normal text editing can be performed in this mode. There is a
    variation of insert mode known as replace mode, in which you can replace text
    instead of inserting it |

    | Ex mode | Functions such as opening a file, saving it, or quitting vim can be
    performed in this mode. It also supports a few other complex functions. The output
    of programs can be inserted into the current file using this mode. Vim configurations
    can be done from this mode as well. Everything that one can perform in ex can
    be done in this mode of vim |


