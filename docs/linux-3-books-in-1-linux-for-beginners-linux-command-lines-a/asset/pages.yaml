  md: 'The read permissions in Linux is equivalent to the List Folder Contents permission
    that is present in Windows.


    The write permission in Linux is equivalent to the Modify permission in Windows.


    The Full Control option in Windows is equivalent to the root user''s permission
    in the Linux file system.


    Using the command line to manage permissions


    This section will teach you how to manage permissions and ownership for a file
    and directory in Linux using the command line.


    # ## Changing Permissions of Files and Directories


    You can use the command `chmod` in Linux to change the permissions of files and
    directories. chmod is short for change mode because the permissions are also known
    as the file or directory mode in Linux. The syntax of this file is pretty simple.
    The command is followed by the permissions you want to set on the file or directory,
    followed by the filename or the directory name. There are two ways to provide
    these instructions, numerically and symbolically.


    Let us go through the symbolic method first, where the syntax is as follows.


    ```

    *chmod WhoWhatWhich files directory*

    ```


    +   * Who is the user u, group g, other o, and a for all

    +   * What is + to add, - to remove, = to set exactly

    +   * Which is r for read, w for write, and x for execute


    You will need to use the letter to specify the various groups you want the permissions
    to change for. As shown above, u stands for user, g for group, o for others, and
    for all.


    When you are using the symbolic method to set permissions, it is not necessary
    to specify a new set of permissions for a file or directory. You can simply modify
    the existing permissions. This can be done by using the symbols, +, -, and = to
    add, remove, or replace permissions, respectively.'
