    Commenting is used in every programming language, and shell scripting is no exception
    to it. You can use the following syntax to add comments to your shell script.


    ```

    ```bash

    #this is a comment

    ```

    ```


    If we take the above script as an example, you can add a comment to it as follows.


    ```

    ```bash

    #!/bin/sh

    #this is my first script

    ```

    ```'
