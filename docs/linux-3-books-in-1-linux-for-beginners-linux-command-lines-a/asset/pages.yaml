  md: '# Chapter Two


    # Securing User Accounts on Linux


    # Don’t Login Using a Root Account


    The root user on your Linux operating system is like the administrator user on
    Windows. There are situations where you may want to log in to the administrator
    account on Windows. You should never log in to Linux using the root account or
    user. Microsoft has worked on improving the security practices followed on Windows
    using user access control (UAC). Linux does not have any such tools readily available,
    so you should avoid using the root user.


    # Using Sudo Accounts


    Users need to avoid using the root account to access the operating system. Ubuntu
    gives sudo access to different users. Ubuntu locks the root account, so any user
    cannot log in to the root account without going out of his way to enable the root
    account and obtain the password.


    Earlier versions of Linux distributions allowed users to access the root account
    through the graphical login screen. They can get to the root desktop. Many applications
    may not run as root applications, while others may throw errors. If you are moving
    from using Windows to Linux, you may want to log in to the operating system using
    root. You may think this is no different from using an administrator account on
    Windows. This is a terrible thing to do since it endangers your system.


    When you use sudo accounts on Ubuntu, you get root privileges. If you use su,
    you only access the root shell to run the command you may need to use before you
    come out of the root shell. Through sudo, you can enforce the right security practices
    in your system. These accesses also ensure that you run the command as a root
    user without exiting the root shell. You can access and run an application as
    a root user only when you are in the root shell.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# ## *Reducing the Damage*


    When you access the operating system using your personal account, the system will
    ensure you that none of the programs you run write to the other programs or systems
    on your hard drive. The programs you run using your personal account only make
    changes to your home folder. You cannot modify any system file without gaining
    access to the root account. This is an easy way to maintain the security of your
    computer.


    Let us assume you use Google Chrome as your default web browsing application.
    If there is a vulnerability in chrome, and you run the operating system using
    a root account, you will leave your system open to malware and other web pages.
    Malware can be pushed into your system through different web pages, and it can
    be used to read various files on your system, including those stored on personal
    folders. They can also compromise different system functions. If you are logged
    into your system using a limited user account, the malicious web page can still
    send malware, but it cannot read the source files on the operating system or replace
    any commands. The malware will only damage the information on your account folder.
    This can lead to problems, but it is better than having your entire system compromised.


    Using a limited access account will protect your system against buggy and malicious
    applications. For instance, you may have an application that has a bug that deletes
    the files it can access. So, when you run it, the application removes all files
    from your account folder. This is definitely not good for you, but you can restore
    the files easily if you have a backup. If the application can access the root
    account, it can delete every file on your hard drive. This means you need to reinstall
    the full operating system again on your computer.


    # ## *Fine-Grained Permissions*


    Older distributions of Linux used the root account to run various administration
    programs on your system. Modern distribution systems use tools, like PolicyKit,
    to differentiate the access or functions that different user accounts on Linux
    can perform. You can determine the permissions which can be defined in the application,
    too.


    For instance, if you have a software management application on your operating
    system, you can use PolicyKit to ensure the application can only'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'install and update your software whenever necessary. The application would
    only run in your operating system based on permissions you have set. Only the
    part of the different programs in the operating system which use this software
    will have elevated or higher permissions. Only this part can install and manage
    software in your operating system.


    The program you are using will not have root access which means it cannot create
    a security hole or vulnerability in the application or system. You can also use
    PolicyKit to ensure only some users have the authority to make changes to the
    system administration. You can also ensure these users do not have access to the
    root account and cannot make any changes to the operating system. This allows
    you to control who can perform activities on your system without any hassle.


    You can log in to the graphical desktop using your root account in Linux. You
    can also delete every file on your hard drive or write random information or noise
    into your hard drive when your system is running. This will obliterate and ruin
    your file system. This is a terrible idea. You may know what you are doing, but
    your system is not designed to let you run the applications and tools using the
    root account. If you use the root account, you will bypass security, leaving your
    operating system open to any hacks.


    # Managing User Account Security


    You need to maintain control over the user accounts if you want to secure the
    operating system. This section will look at how you can perform certain user account
    management functions and tasks. We will also look at how you can implement security
    measures.


    # Adding New Users


    As mentioned earlier, you should avoid using a root account to perform any functions,
    especially any regular operations. If you have deployed the operating system on
    a new server or virtual machine, you will only have a root account on the server.
    This means you need to create new accounts for everybody who will access the operating
    system. If it is only you, create a username. To do this, run the command in the
    shell: `adduser <username>`.


    You also need to create a password and enter other key information about the user,
    and you can do this using the user creation procedure. On Red Hat and'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'CentOS variants, you need to unlock the account to create a password. Do this
    using the following command: `passwd <username>`.


    If you want to use the account you have created to manage the system and other
    files, you need to give it sudo privileges. If you are using an Ubuntu-based Linux
    OS, you can do this using the following command: `adduser <username> sudo`. When
    you add sudo permissions to various users on a CentOS variant, you need to use
    a different command: `gpasswd -a <username> wheel`. A Debian user does not have
    to add any sudo privileges since those may have been given to the account as a
    default setting. If these privileges are not provided, use the command: `apt-get
    install sudo`. After you do this, you can use the above commands to add the account
    to the sudo user list. It is important to note the changes to the privilege user
    groups will only change when you log in after the setting has been updated.


    If a user is given sudo permissions, he can perform the operations a root account
    is allowed to perform. Since the operations are performed in a root shell, you
    do not compromise on security. If you need to add more users to the server, give
    them sudo access. Do not give them root access since it is dangerous to share
    the password with every user. It is also recommended for you to use a sudo account
    over a root account.


    # Disable Root Login


    Once you set up your account on Linux, you need to disable remote access for the
    root account. You must do this if you want to prevent any security breaches. The
    configuration file has the OpenSSH server settings, and you can open it using
    a text editor on Ubuntu or Debian using the following command: `sudo nano /etc/ssh/sshd_config`.
    If you use Red Hat or CentOS variants, you can use the following command: `sudo
    vi /etc/ssh/sshd_config`. You can also search for different authentication settings
    and options and change the permission to log in to the root account. You can do
    this by changing the setting to no using the command: `PermitRootLogin no`.


    Save the file with the commands. Once you make the updates, restart the server.
    If you use cloud servers and CentOS, you can use the command: `sudo systemctl
    restart sshd`. On systems where you use Ubuntu, call the configuration file and
    restart the system using the following command: `sudo service ssh restart`. The
    same command will work on Debian, as well.'
