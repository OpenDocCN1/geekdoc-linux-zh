    Support for microphones and speakers have been improved by tuning the sound panel
    in the GNOME Settings. The file search on the desktop has been improved by adding
    a tracker. Application switching has been made smoother by improving the Alt+Tab
    feature and the window preview feature. Unexpected errors on the system can be
    investigated with the introduction of the ‘Safe Graphics Mode.’


    The CPU usage has been optimized, leading to better Desktop performance. The input
