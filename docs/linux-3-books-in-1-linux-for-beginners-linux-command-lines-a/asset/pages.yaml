    +   5. Use the following command on the Linux shell to execute your script.


    ```

    ```bash

    bash filename.sh

    ```

    ```


    #! is known as a shebang operator. It tells the script the location of the interpreter
    of the Linux system. When you type the first line in your shell script as #!/bin/sh
    the Linux operating system knows that the interpreter to execute the script is
    located at /bin/sh


    Let us create a simple shell script.


    ```

    ```bash

    #!/bin/sh

    ```


    ```bash

    ls

    ```

    ```


    Save this script as list.sh


    You can run this script using the following command on the shell.


    ```

    [student@desktop ~]$ bash list.sh

    ```


    Documents Movies Books Pictures


    The result of this script is the `ls` function that lists down the contents of
    a directory.


