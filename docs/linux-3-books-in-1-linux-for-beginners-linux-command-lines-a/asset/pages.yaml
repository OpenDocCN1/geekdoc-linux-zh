    # The su command


    The **su** command in Linux is used to switch to another user account. You need
    to pass the username as an argument to the su command to let the system know which
    account you wish to switch to. If you do not pass any argument, the system will
    switch you to the root account. If you are a regular user trying to switch to
    another user account, you will be asked to enter the password for that user; but
    if you are logged in as the root user and try to switch to another user account,
    you will not be asked for any password.


    ```

