    # ### *Editing Text in Vim*


    When you are in the command mode of vim, your keyboard keys will not exactly do
    what you intend to. This is because inserting text is not supported in command
    mode, and it is to be used to specify some functions to vim, such as cursor movement
    or copy and paste.


    You can switch to insert mode from the command mode in vim by using commands in
    the command mode that correspond to various functions. Let’s have a look at the
    commands.


    | Key | Result |

    |---|---|

    | i | This will switch you to the insert mode, and you can start typing before
    the current position of the cursor |

    | a | This will switch you to insert mode as well but will start typing after
    the current position of the cursor |

    | I | Will move the cursor to the beginning of the current line and switch you
    to insert mode |

    | A | Will move the cursor to the end of the current line and switch you to insert
    mode |'
