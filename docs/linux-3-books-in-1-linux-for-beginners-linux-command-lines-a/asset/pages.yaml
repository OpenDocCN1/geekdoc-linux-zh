    Every part that the operator separates has to be true; otherwise, the AND statement
    will only return false. Have a look at the script below to see how the operator
    works:


    ```

    #!/bin/bash

    echo -n "Enter Number:"

    read num


    if [[ ( $num -lt 10 ) && ( $num%2 -eq 0 ) ]]; then

    echo "Even Number"

    else

    echo "Odd Number"

    fi

    ```


    We use the double-ampersand (&&) to denote the AND operator.


    # ## How to Use the OR Operator


