    # In this example, I will be passing parameters to a function

    function addmedigits {

    if [ $# -eq 0 ]||[ $# -gt 2 ]

    then

    echo -1

    elif[ $# -eq 1 ]

    then

    echo $[ $1 + $1 ]

    else

    echo $[ $1 + $2 ]

    fi

    }

    echo -n "I am now Adding 30 and 85: "

    valuedigits=‘addmedigits 30 85’

    echo $valuedigits

