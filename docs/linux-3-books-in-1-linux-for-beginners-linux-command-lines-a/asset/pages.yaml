    the following lines of code in it.


    ```

    #!/bin/bash


    echo "Hello World"

    ```


    Save the file and change the permission for the file to make it executable.


    ```

    $ chmod a+x hello-world.sh

    ```


    Now run one of the following commands to run your script.


    ```

    $ bash hello-world.sh

    ```'
