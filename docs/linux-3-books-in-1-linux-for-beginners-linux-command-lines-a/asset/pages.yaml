  md: '# ## Chapter Nine


    # # Linux File System and Permissions


    This chapter will teach you about the Linux file system’s permissions and how
    you can change file and directory permissions using command-line tools. By the
    end of this chapter, you will know how permissions in the Linux operating system
    work and how they can be applied to files and directories to access and restrict
    access.


    # ## Linux File System Permissions


    File permissions are a feature of Linux through which you can control access to
    files and directories. The file system model of Linux is very simple, and it has
    a flexible nature such that a new Linux user can easily understand it to apply
    permissions to files and directories.


    There are three types of users on a Linux system. The permissions are applied
    to these three users with respect to a file or directory. The three types of users
    are as follows.


    +   1. user

    +   2. group

    +   3. other


    The hierarchy of permissions is such that a user can override group permissions,
    and a group can override other permissions.


    There are three categories of permissions that apply to a file or directory in
    Linux.


    +   1. read

    +   2. write

    +   3. execute'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'Let us understand the effect of these permissions on a file and directory.


    | Permission | Effect on Files | Effect on Directories |

    | :--- | :--- | :--- |

    | **r** (read) | Read access to file content | Contents of a directory that is
    filenames will be listed. |

    | **w** (write) | Write access to file content | Contents of the directory where
    files can be created or deleted. |

    | **x** (execute) | The file can be executed as a command | Contents of the directory
    where files can be accessed subject to the permission of the file itself. |



    By default, a user will have access to read and execute a Linux system file if
    it is an executable file. If a user has only read access, they can read the contents
    of the file but will not be able to see any other information, such as the permissions
    set on the file or the timestamp of the file. If a user has only ‘execute’ access
    to a file, they will not be able to list down the file in a directory but can
    execute the file if they already know the file’s name.


    If the user has write access to a directory, they can delete any file in the directory
    even if they do not have any permission on the actual file itself.


    Let us see how you can know the permissions that are assigned to a file on the
    Linux system.


    You can use the **ls** command with the **-l** option to list down the contents
    of a directory along with the details for its ownership and permissions.


    ```

    ```bash

    [student@desktop ~]$ ls -l test

