  md: '# Chapter One


    # Using Linux on Virtual Machines


    Have you wanted to use Linux but did not want to use it on your system? Your system
    may have trouble if you use dual-booting, and the best thing to do is to use Linux
    on a virtual machine. It is easy for you to use Linux on a virtual machine if
    you use Windows. The procedure is straightforward. In this chapter, we will look
    at installing and using Linux on a virtual machine, a VMware Workstation specifically.


    If you want to use a virtual machine, you need to find a PC, which allows you
    to use virtualization. You may have tried to install Linux on your system using
    a CD, but you may not be sure about dual booting. You should install the Linux
    operating system on your PC but using a virtual machine.


    Virtual machines are environments that replicate the conditions of the hardware
    on your device. The environment mirrors everything in your personal computer and
    is limited only by the system''s different components. This means you cannot expect
    to have a four-core CPU on a processor which only has two cores. You can achieve
    virtualization on multiple systems, and the result of this will be superior on
    computers that have CPUs that support visualization.


    You can use different virtual machines to install the Linux operating system on
    your computer. VMware is one of the leading manufacturers of virtual machines
    and applications. In this chapter, we will look at how you can install Linux OS
    in Windows using a workstation player designed by VMware.


    # Installing a Workstation Player


    If you want the workstation player, you need to download the latest version from
    the VMware website. They constantly upgrade their workstation player application
    and tool. For this example, we will use the VMware workstation'
