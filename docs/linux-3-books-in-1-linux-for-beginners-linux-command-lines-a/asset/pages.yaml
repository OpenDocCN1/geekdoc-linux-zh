    When a user logs in to the Linux system, the system checks if the user''s credentials
    exist in the `/etc/shadow` file. The system then takes the user''s password and
    validates it against the password hash stored for that user in the `/etc/shadow`
    file. If it matches, the user is logged in. If it does not match, the user receives
    an error stating that the password is incorrect.


    Let us go through the format of the `/etc/shadow` file.


    +   - name:

    +   - password:

