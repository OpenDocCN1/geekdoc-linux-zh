  md: 'there are some extra permissions that you can set in the ACL, and you can do
    this using the getfacl command.


    # **Using Default ACLs**


    The default ACL uses a specific permission type that is assigned to the directory
    where you are making changes directly to the directory. This makes it easier for
    you to use the ACLs which come with your Linux. Let us see how you can use it.
    We are now going to create a directory or file and assign the default ACL to the
    file or directory using the option ‘-d’ using the following command: $ mkdir test
    && setfacl -d -m u:dummy:rw test.


    You now have an idea of what you can do to maintain security in your systems and
    server. The next two chapters shed light on how you can perform penetration testing
    and scanning to find any vulnerabilities in your server and network.'
