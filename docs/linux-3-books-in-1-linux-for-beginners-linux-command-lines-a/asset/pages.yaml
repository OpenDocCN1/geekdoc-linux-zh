    echo $valuedigits

    echo -n "I am not trying to add any numbers now: "

    valuedigits=‘addmedigits’

    echo $valuedigits

    echo -n "Finally, I am trying to add three numbers: "

    valuedigits=‘addmedigits 40 15 90’

    echo $valuedigits

    bash -f main.sh

    ```


