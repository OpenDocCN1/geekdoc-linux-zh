    to help you perform these three primary tasks.


    +   1. Create a new file or open an existing file

    +   2. Modify the contents of the file

    +   3. Save the changes and exit


    # Opening a File in Vim


    You can easily open files in vim on the terminal by specifying the file name as
    an argument to the **vim** command. For example, if you wish to open the file,
    you can just type the command below.'
