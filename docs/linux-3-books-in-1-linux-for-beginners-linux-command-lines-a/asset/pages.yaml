- pgno: 293
  md: '# Using the Firewall-cmd Interface


    The operating system you are using will have an infrastructure, in the form of
    a server and network, in the rack. The objective of this interface is to run the
    firewall. Alternatively, your modem and router may come installed with a firewall
    installed in your modem or router. This will act as the primary gateway and path
    used by any website on the Internet. It is important to remember that firewalls
    come pre-configured and use a different interface that you can change. In this
    section, we will look at the different commands you can use through the firewall-cmd
    interface on your Linux distribution.


    You can manage the firewalld daemon on Linux using the firewall-cmd interface.
    This interface connects the Internet to the Netfilter framework on the Linux kernel.
    This stack will not be found in modems that have a firewall embedded in them.
    You can use it on any Linux distribution, which allows you to use the command
    systemd. If you do not have a firewall that is active on your network, you cannot
    use the firewall-cmd interface to control anything. Therefore, the first thing
    you need to do is to check if the interface runs on your system:


    ```

    sudo systemctl enable --now firewalld

    ```


    Using this command, you can start the firewall daemon on your network and ensure
    that the daemon will load when you reboot the system.


    # Block Everything


    When it comes to configuring the firewall used, most experts will ask you to block
    everything on the firewall. Experts also recommend that once you block everything,
    you can open the network up to some ports. This means you need to know exactly
    what your server needs and identify how to do it.


    If you work in an organization with its own DNS caching service or DNS, you need
    to unlock the port before handling the communication in the DNS. If you solely
    rely on the SSH configuration and use that to change the servers and access them
    remotely, you cannot block it. You need to know which service runs on the operating
    system and understand if the service is internal to the organization. You also
    need to determine if there is any interaction between different services in the
    server.


    When it comes to proprietary software, the server may make calls to external'
