- pgno: 61
  md: '# # Chapter Six


    # ## The Linux Command Line


    In this chapter, we will take you through the Linux command line. The Linux command
    line is similar to the command prompt in Windows and can be used to perform almost
    every task that you can do through a graphical interface by using the command
    line instead. By the end of this chapter, you would be proficient in managing
    your files and directories through the command line.


    # ### The Bash Shell


    BASH, short for Bourne-Again Shell, is a Linux utility that helps you interact
    with the operating system through the command line. It is the first choice of
    shell on every Linux distribution, and naturally, you will find it on Ubuntu as
    well. The Bash shell can be accessed on Ubuntu through a utility called the terminal.


    You can launch the terminal on Ubuntu by selecting the Application button on the
    lower-left corner of your desktop and then click on All at the bottom of the screen.
    Continue to select Utilities, and you will see all the system tools under Utilities.
    Click on Terminal to launch it.


    Upon launching the bash shell, you will see a string that indicates that input
    is expected from the user. This string is called shell prompt. If you are the
    root user or the superuser for your Ubuntu system, the prompt will end with a
    # sign. If you are a non-root user, the prompt will end with a $ sign.


    ```

    ```

    [root@desktop ~]#

    [student@desktop ~]$

    ```

    ```


    As mentioned, the Linux Bash shell is just like the command prompt available in
    Windows, but both use a different scripting language, and the scripting language
    in the Bash shell is much superior as compared to the one available in the Windows
    PowerShell utility. You can automate numerous'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'tasks in the Linux operating system using the Bash shell. You can also use
    the Bash shell to perform tasks that would be rather complicated, even on the
    graphical interface.


    The Bash shell, as mentioned earlier, can be accessed through the terminal in
    Ubuntu. The keyboard works as the input device for the terminal, and the monitor
    works as the output device to show you the result of your commands. There are
    virtual consoles available on Linux to access the Bash shell as well. This helps
    you to have multiple virtual consoles on a single physical machine, and multiple
    users can log in via the multiple virtual consoles.


    # Shell Basics


    There are three parts to the command that you enter on the shell prompt in Linux.


    +   1. *Command that you want to run*


    +   2. *Options that will define the behavior of the command*


    +   3. *Arguments that are the command''s targets*


    The command defines the program that you want to execute. The command can be followed
    by options or no options at all. The options will define how a command will behave
    and how it will function. You can use a dash or two dashes to specify an option.
    The dashes are appended to options so that options can be distinguished from arguments.


    Example -a or --all


    Arguments also follow the command, and you can have a single argument or multiple
    arguments. Arguments are the targets on which the command gets executed upon.


    A basic command looks like this.


    *usermod -L John*


    The command in this example is *usermod*


    The option is *-L*'
