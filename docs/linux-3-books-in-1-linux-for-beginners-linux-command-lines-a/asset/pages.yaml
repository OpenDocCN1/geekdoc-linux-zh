    If you need a login shell for the new user you are switching to, you will need
    to use the hyphen - sign along with your command, as shown in the above example.
    This means a nologin shell will retain all the settings and configurations of
    the current shell, whereas a login with the hyphen will create a new shell with
    a clean login for the new user. It is a good practice to login using the hyphen.


