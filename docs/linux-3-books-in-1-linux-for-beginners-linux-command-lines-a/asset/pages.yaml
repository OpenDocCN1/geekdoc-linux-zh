- pgno: 336
  md: '# # Chapter Ten


    # ## Downloading and Installing Kali Linux


    If you want to perform an analysis of your system''s security, you need to use
    the Kali Linux distro. This is a powerful tool you can use to assess the vulnerabilities
    in the system. In this chapter, we will look at how you can download and install
    the Kali Linux distro in your system and use various penetration testing tools
    which are built into the operating system. These tools will help any system administrator
    while conducting penetration tests in the various stages of the penetration testing
    lifecycle.


    We have covered the details of how to install an operating system onto your system
    using a virtual machine, but let us look at what you should do when you install
    the operating system directly onto your system. For those of you who have never
    installed an operating system ever, there is nothing to worry about, as this chapter
    will guide you with a detailed installation of the Kali Linux operating system.
    From the information in this chapter, you will learn how to install Kali Linux
    and where you can download the installation media from.


    Kali Linux is a tool that you can use to check the system for any vulnerabilities.
    This operating system installs quickly on permanent media like a hard disk but
    can also be installed on a USB stick and live booted from it whenever required.
    This is a very convenient and portable tool in the toolkit of a system administrator.
    If you can access the local machine while you work as a system administrator,
    you can leverage the Kali Linux live disk to boot it into a locally available
    physical machine inside the target organization''s infrastructure. There are over
    400 tools and applications available in the Kali Linux operating system.


    # ### Downloading Kali Linux


    Kali Linux is a distribution of the Linux operating system, and we discussed the
    same in the first chapter. This operating system is available for free, and'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'you can download the ISO image file from the official website. You may need
    to use a different system to download the ISO and then burn it onto a DVD or USB
    to ensure you install it onto your system. You can download the image from the
    following URL: <https://www.kali.org/downloads/>


    If you need material to learn more about the configurations, advanced operations,
    and other special cases, you can find this information on the official Kali Linux
    website at


    <http://www.kali.org/official-documentation/>


    It is recommended that you register on the Kali Linux website to access the community
    where you can discuss your issues and learn more about how to overcome them.


    Before you download the image file from the website, you need to ensure you select
    the right architecture. Your system architecture is 32-bit or 64-bit, and you
    need to choose the image which works for your system. Once you complete the download,
    you can use the image burning software to copy the Kali Linux installation media
    onto a DVD or USB stick.


    In this chapter, we will look at how you can install Kali Linux using a USB drive
    and Hard disk using Live boots.


    # # Hard Disk Installation


    Once you start with the installation process, you need to place the DVD in the
    drive and plug the USB stick to install the media used to load the operating system.
    Depending on what you want to use, you should set up the boot priority in your
    computer’s BIOS settings, so this installation drives through the right media.


    # ### Booting Kali Linux for the First Time


    If you have managed to install the Kali Linux exe file from a USB stick or DVD,
    you will be given options on the screen about any existing information about the
    operating system and any other operating system on your hard disk. It will also
    replace the files with Kali Linux. Other advanced options are using which you
    can load the operating system on part of your hard disk using your existing operating
    system. This is beyond the scope of the book. Let us now look at how you can install
    the operating system.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# **Setting the Defaults**


    The next few screens will have the default settings you need to use when you set
