    allow a hacker to access it. Since you are responsible, you need to do everything
    in your power to ensure users do not perform any activity on the system that they
    should not. You may not even want to clean up the mess.


    Your main goal should be to control what a user can and cannot do when he accesses
    the Linux server. A user on a Linux system needs an account to access the system.
    Users can access these accounts directly when they perform any activity on the
    operating system, data, or application. Every system requires specific accounts
    so that it can function properly. It also needs applications that will need an
    account for them to access the server.


    You can manage the privileges assigned to users in multiple ways and using different
    tools. The best way to manage users'' access and privileges is using the privileged
    access management tools since these allow you to manage the activity centrally.


    In this section, we will look at nine important practices you need to bear in
    mind when it comes to managing accounts and privileges on Linux. It is important
    to bear in mind that these are not the only ways to protect accounts. Newer methods
    are emerging regularly, and you can learn more about them'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'depending on the type of system you maintain.


    # Manage Linux User Accounts


    It is easy to create an account on Linux, and we have seen the commands you can
    use to do this in the previous section. It becomes difficult to remove or disable
    an account that you no longer need. If you do not remove these accounts, they
    continue to be active, which can cause further issues. Every Linux system needs
    an account that users can use to access the server to perform any activity on
    the operating system or on the data stored. The system will need accounts for
    it to function properly. Applications also require accounts that can be used to
    connect it to the server.


    Most people assume that account management only revolves around managing user
    accounts. They do not worry about the functional, system, or application accounts.
    This leaves a lot of gaps in your risk management for the server.


    # Reducing Privileges


    When it comes to privileged accounts, you need to restrict these users'' access
    and rights to ensure they only have the authority to perform the required activities
    and nothing more. It is important to ensure users only do what they are required
    to do. If you give a user more access than he needs, it will be difficult for
    you to control what a user can do. You need to consider the following when you
    assign privileges:


    +   1. Do system administrators need to use the root account?


    +   2. Does a system administrator need to run commands which only the root account
    can run?


    +   3. Does a database administrator need to access the root account?


    # Managing Passwords


    You may have implemented and enforced a password policy and the parameters one
    needs to adhere to when they set their policy. Having said that, the goal should
    be to reduce the number of passwords used in the system. There are places and
    times where you need to use passwords still. If you use passwords on the system,
    you must find a way to manage them.'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'The following need to be kept in mind when it comes to managing passwords on
    the system:


    +   1. Ensure passwords are frequently changed

    +   2. Prevent the use of old passwords

    +   3. Assess the complexity of the passwords used in the system


    These are the basics when it comes to managing passwords. You need to expand this
    to all passwords on the server, including the root, user, functional, service
    accounts, and application passwords.


    # Reduce the Use of Shared Accounts


    As an administrator, you should never share an account with another user on the
    server. Administrators need to have separate accounts for accountability and traceability
    for all the actions performed by them. You need to track every user’s actions.
    Every Linux system comes with a root account. Applications on your server will
    have accounts associated with them, and these accounts have their own set of privileges.
    This limits the access the application can have to the system.


    There are times when a data administrator or application administrator needs to
    perform privileged activities on the operating system, data service, or application.
    You need to implement and enforce a system where a user can access a different
    account without logging into the privileged account. This is a sudo command which
    can be used to access the operating system. You, as an administrator, can extend
    a user’s privilege without allowing them to share accounts. It provides the required
    accountability and traceability to identify the activities they perform.


    # Control Access to Accounts


    It is important to understand that not every account present in the system needs
    to be accessed over a network. You must implement and enforce privilege control
    across the server. It is only when you do this that nobody logs into incorrect
    accounts or performs unauthorized activities on your server. It is also important
    to ensure that every user does not access the server using the SSH configuration.
    Not every user account on the server needs to access the server from different
    computers on the network. You do not have'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'to give a user access to the server from anywhere. Users should only access
    the server to perform the tasks he is assigned.


    # **Maintain Logs**


    It is important to log everything that happens on your server. You need to log
    the accesses, changes, patches, privileges, and features of every user on your
    server. This is not an exhaustive list, and you can look at other aspects of a
    user''s activity, as well. It will take you and your team time to go through the
    messages and evaluate all the activities performed. This is something you most
    certainly need to do.


    You should report which user has access to perform which activity. You need this
    information for different regulations. It is important to log all changes to different
    accounts, changes to entitlements, deletions or additions of users, or any other
    activity performed by the users. You can only make changes to your servers'' rules
    if you are aware of the activities being performed by the users.


    # **Record and Manage Privileged Activity**


    It is important to know which user accessed the server, which host was used, where
    he accessed the server, and how he did it. It is even more important to know the
    user''s privileges and analyze what the user did to the server. You need to collect
    this data and analyze it to see what activities are being performed on your system.


    If you are the administrator, you can manage user rights, activities, and their
    activities'' timings. This is a powerful tool. To understand what a user is doing
    on the system, you can run commands using privileges not assigned to the users.
    Some examples of such privileges are database administrators or application administrators.
    These users can perform only configuration or maintenance activities. If these
    users have excessive privileges, it can lead to various problems. You need to
    manage the administrator access, even if it looks like you cannot trust the administrator.
    These accounts should be looked at carefully, and the activities should be monitored.
    This is not because of the people who can use the accounts but because the accounts
    are a hacker''s valuable asset.


    # **Notify or Alert in Case of Suspicious Activity**'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'Once you implement and establish the audit and logging system on Linux, you
    need to set up an automated notification to alert you of any suspicious activity
    on any server used in the system. This does not mean you can set a signal to report
    any minor violation, but those which can cause a breach in your servers. Your
    notification and alerting system must be defined on rules to stop inappropriate
    behavior. When you log this activity, it will show you that a user is performing
    a function he should not. You can then use the notification to define rules which
    will prevent this from happening again. This process will make it easier for you
    to be proactive instead of reactive. This process is based on the concept of detecting
    through enforcing. This concept means that you use the same rules to detect and
    prevent any bad behavior from occurring.


    # **Unify and Centralize**


    All Linux distros allow you to perform all the actions listed so far natively.
    For instance, you can use SSH to configure how a user can access the server and
    where he can access it. You can also use it to define what activities the user
    can perform using that access. It is easy for you to do this manually if you are
    working only with one system and a few users. If you have multiple servers, it
    increases the effort you need to put in to maintain the configuration of the servers.
    You may also make an error when it comes to manually updating the access and user
    groups for every user.


    It is important to couple privilege management and access control. You will make
    mistakes if you look at these two domains separately. In the world of Linux security,
    you need to couple access and account control as well. To do this, you need to
    have tools that allow you to manage the access control, account management, and
    privilege management domains centrally.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# ## Chapter Three


    ## Securing Servers Using Firewalls


    As a system administrator, you need to learn how to configure and maintain a firewall
    for your Linux servers. In this chapter, we will look at how you can manage the
    server using a firewall-cmd command.


    If you have worked on network security before, you know that a firewall is an
    important part of it. Therefore, it is important for you, as the system administrator,
    to learn about how a firewall works. It is only when you understand how a firewall
    works that you can secure the server and make the right choice about which traffic
    you prefer to allow to enter and exit your server. Firewall is a different name,
    and some people confuse it with a Tron-style battle which happens at the ends
    or outside of the network where the game is played. Unlike the Tron-style battle
    where rogue data packets are released to protect a user’s data or techno fortress,
    a firewall is only a small part of software you can use to control the incoming
    and incoming traffic in the network.


    # ### Ports


    You can use firewalls to manage any traffic flowing into and out of the server,
    and it does this by monitoring the ports used in the network. When it comes to
    firewalls, the word port does not refer to any physical connection port, such
    as a VGA, HDMI, or USB. In terms of a firewall, ports are artificial connections
    or constructs which are created in an operating system. This port is used as a
    way to connect or create a pathway between various data sources and the operating
    system to move specific data types. You can name the port using different words,
    but port is the word used too often. What I am trying to say is that there is
    nothing new or different about a port. It is only a way to move the data to the
    right place.


    There are different ports used in an operating system, and some are used more
    often than others. These ports are conventions. If you have worked with'
