    # Conduct Goals


    If Ubuntu’s philosophical goals describe the why of the Ubuntu project, it’s how
    would be described by the Code of Conduct. The code of conduct for Ubuntu is a
    very important document that governs the policies and cooperation in the Ubuntu
    community. You can become an Ubuntu activist if you are in complete agreement
    with this document. It is also an important step to become a member of the Ubuntu
    project.


    The Ubuntu code of conduct covers “behavior as a member of the Ubuntu community,
    in any forum, mailing list, wiki, Web site, IRC channel, install-fest, public
    meeting, or private correspondence.” The Ubuntu code of conduct also goes deeper
    into some points that bear the following headings.


    +   - Be considerate

    +   - Be respectful

    +   - Be collaborative

    +   - When you are unsure, ask for help

    +   - When you disagree, consult others

    +   - Step down considerately


    You may also say that all these headings are mostly common courtesy or common
    sense. Nothing in Ubuntu’s code of conduct is radical or controversial. These
    heading are there intentionally, but it can be difficult for everyone to follow
    this. Ubuntu does not believe in enforcing this code of conduct since acting respectfully,
    collaboratively, and considerately is a personal choice. Ubuntu’s code of conduct
    is not designed to be a law that prohibits any language or actions. It is in place
    to just serve as a reminder that'
