- pgno: 110
  md: '# ## Chapter Ten


    # # The Linux Boot


    Have you ever wondered what exactly happens when you switch on your Windows or
    Linux based computer? This chapter will take you through the boot process of the
    Linux system. This will give a deep understanding of what exactly happens from
    the time you switch on your Linux computer till the time you are presented with
    the login screen and, eventually, the desktop.


    Understanding the Linux boot process is important if you want to get good at playing
    around with the Linux configuration. This knowledge will also teach you to troubleshoot
    any issues when your computer does not start as expected. You will learn about
    the Linux boot and startup sequence and about the GRUB2 bootloader. You will also
    learn about certain system daemons like the systemd initialization.


    There are two parts to initialize a Linux operating system and make it ready to
    use for a Boot and Startup user. The boot process is initiated when you power
    on the computer and concludes when the control is taken over by the kernel and
    passed to systemd. Once systemd takes over, the startup process is initiated and
    concluded when the Linux system stabilizes and reaches a state where a user can
    start using it.


    It is easy to understand the Linux boot and startup process. It consists of the
    following stages.


    +   - BIOS POST

    +   - Boot loader (GRUB2)

    +   - Kernel initialization

    +   - Initialize systemd


    We will be discussing the Linux boot and startup process in detail in this'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'chapter using the GRUB2 bootloader, as it is used in a majority of Linux distributions.
    A few Linux distributions still use old software for the boot and startup process,
    but we will not be going through them.


    # The Boot Sequence


    The boot sequence can be initiated in a couple of ways for Linux. The simplest
    one is turning on the power for your Linux system. If there is a user created
    on the system or logged in as a root user, you can initiate a reboot of the system
    via the command line to trigger the boot sequence.


    # BIOS POST


    The first step of the boot sequence in Linux is not related to Linux and its operations.
    The first step is all about initiating the hardware on the system and is common
    across all operating systems. When you press the power button for your system,
    a test known as the Power On Self Test or POST is short is initiated. POST is
    a part of the Basic Input Output System or BIOS.


    BIOS was introduced for the first time in 1981 when IBM developed its first computer.
    POST is a module of BIOS that is in place to check if all the hardware on the
    system is functional. IF POST fails, it indicates that there is something wrong
    with the system. The system will be in an unusable state, and BIOS would not be
    initiated.


    POST and BIOS’s function is to check if all the hardware needed to start the system
    is functional. They also follow up with a BIOS interrupt known as INT 13H, which
    is responsible for finding bootable devices such as a hard disk and initiating
    it by locating its boot sectors. When the interrupt locates the first boot sector
    containing a valid boot record, it is loaded into the memory and the control gets
    transferred to the code present in the boot sector.


    You can say that the boot sector is the first stage of the boot loader. There
    have been around three bootloaders that have been used across Linux distributions
    over the years, LILO, GRUB, and GRUB2. The latest and most popular bootloader
    is GRUB2, and every latest Linux distribution now uses GRUB2.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# GRUB2


    GRUB2 stands for GRand Unified Bootloader version 2. GRUB2 is a module that locates
    the kernel of the operating system and loads it into system memory.


    Linux has never officially declared any stages for GRUB2, but we’d like to tell
    you that GRUB2 operates in 3 stages. Let us go through them.


    # Stage 1


    As already mentioned in the POST and BIOS section, when the POST process is successful,
    the control is taken over by BIOS, and BIOS starts looking up any bootable devices.
    It then locates the Master Boot Record (MBR) on the bootable device and then loads
    it into system memory from where the boot records are then executed. The bootstrap
    code for GRUB2’s stage 1 is very small because the requirement is that it fits
    within the first 512-byte sector on the bootable device along with the metadata
    of the partition table. Owing to this, the space allocated to the bootstrap code
    is only 446 bytes. This 446-byte file is known as boot.img, which does not contain
    the partition table.


    The boot record, owing to its small size, does not maintain any information about
    the file system. The main objective of the GRUB2 bootloader stage 1 is to locate
    the next stage. Between the boot record and the bootable device’s first partition
    lies stage 1.5 of the GRUB2 bootloader. Stage 1 loads stage 1.5 into memory, and
    control is passed to stage 1.5.


    # Stage 1.5


    Stage 1.5 will always lie between the boot record and the first partition of the
    bootable device. This space was not allocated to anything for a lot of years because
    of technical issues. The first partition on a hard disk starts at sector 63. The
    master boot record starts at sector 0. This means that between the master boot
    record and the first partition of the hard disk drive, there are 62 sectors, or
    512-byte sectors, or 31,744 bytes. This is the space where the core.img file can
    be stored that contains stage 1.5 of GRUB2. The size of the core.img file is 25,389
    bytes. This means it can be placed comfortably after the master boot record and
    before the first partition.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Since there is sufficient space to store the code for GRUB2 stage 1.5, which
    does not need a lot of space, the additional space is used to contain file system
    drivers such as FAT, EXT, and NTFS. This means that a standard EXT file system
    is enough to store the code for GRUB2 stage 2. The location for the GRUB2 stage
    2 code is at /boot/grub2.


    # ## Stage 2


    All the files that are needed to execute stage 2 of GRUB2 are located at /boot/grub2
    and its subdirectories. Stage 2 of GRUB2 does not have any image files like it
    did in stage 1 and 1.5. Instead, it loads runtime modules when needed from the
    directory at /boot/grub2/i386-pc.


    The main objective of GRUB2 stage 2 is to find the Linux kernel and load it into
    memory so that the control can be passed to the kernel. The Linux kernel files
    are stored in the /boot directory. One can identify Linux kernel files easily
    since they are all prefixed with **vmlinuz**. You can list down all the kernel
    files for your Linux system by simply listing down the /boot directory contents.


    So when your system boots up, you get a screen where all the kernels available
    on your Linux system are listed, and you can select one of them to pass the control
    to the respective kernel.


    # ## Kernel


    All the kernels available today are stored in a compressed format for space optimization,
    but they can self-extract themselves. We know that the Linux kernel can be located
    in the /boot directory. When you select a particular kernel on the boot menu,
    it gets executed and starts extracting itself so that the system can use the files.
    When the kernel is executed, it makes a call to **systemd** and eventually passes
    the control to systemd.


    This is the end of the Linux boot process. At this point in time, both the bootloader
    and systemd are in a running state but are not useful to the end-user since nothing
    else is running yet.


    # ## The Startup Sequence


    The Linux startup sequence is initiated after the boot sequence concludes.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'The startup sequence is responsible for bringing the Linux operating system
    to a usable state for an end-user so that they can log in and start using the
    system for their tasks.


    # ## Systemd


    Systemd is called the mother of all processes in the Linux operating system. It
    is responsible for initiating the Linux operating system and bring it to a usable
    state. Before the systemd service was developed, the same task was performed by
    the init service, but systemd has many more functions compared to init, such as
    initiating and managing system service, mounting file systems, etc.


    The first task for systemd is to mount all the file systems that are defined in
    the configuration file located at /etc/fstab. systemd also has access to all the
    other configuration files stored in /etc. systemd brings the system into a state
    or target as defined in the file stored at /etc/systemd/system/default.target.
    If it is a desktop, the default target is usually the graphical.target. If it
    is a Linux server, the default target is usually the multi-user.target.


    Targets and services are units of the systemd service. The configuration file
    for a target defines the dependencies of that particular target. These dependencies
    are initiated by systemd. The dependencies refer to services needed to run the
    Linux operating system based on the initialized target. When systemd loads all
    the target''s dependencies, it can be said that the system is up and running or
    that the system is running at that particular target level.


    The startup sequence has two checkpoints, sysinit.target and basic.target. It
    is a fact that systemd starts services simultaneously, but some services need
    to be initiated before other services. A checkpoint is passed only when all the
    services and targets for that particular checkpoint have been initiated successfully.


    The sysinit.target checkpoint is reached only after all its services and targets
    have been initiated. The sysinit.target has multiple dependencies, and these are
    initiated parallely within sysinit.target.


    The sysinit.target first starts all the low-level services that are needed to
    reach'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'the basic.target. The basic.target then initiates some additional services
    to reach the next target.


    Once both these checkpoints have been reached successfully, the system can move
    to the **graphical.target** or **multi-user.target**. But note that the Linux
    system can reach the multi-user.target even before the dependencies of the graphical.target
    have been initiated.


    You will see a text-based login prompt if the default target is set to multi-user.target.
    This target is commonly used by Linux servers that have Linux installed on them
    without any graphical interface. If you have installed Linux on a personal desktop
    and have included the GNOME desktop along with the installation, the default target
    will be the graphical.target. In such a case, you will be presented with a graphical
    interface to login into the Linux desktop.


    This is where the startup sequence concludes. You can simply enter your username
    and password on the text-based login prompt or the graphical interface login screen
    to start using your Linux system.


    Every modern-day Linux operating system functions with GRUB2 and systemd as its
    core components. Both these components work together to load the Linux kernel,
    start the services, and make the Linux system usable for any end-user.'
