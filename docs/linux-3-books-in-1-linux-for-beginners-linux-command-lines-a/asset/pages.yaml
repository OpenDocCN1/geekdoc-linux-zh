  md: "# # Chapter Six\n\n# ## Process Commands\n\nToday’s operating systems are capable\
    \ of multitasking, which means they can do more than one thing at a time. They\
    \ switch rapidly between executing programs, and the Linux kernel manages this.\
    \ Linux uses processes to organize the programs queued for execution in the CPU.\n\
    \nSometimes, a computer system can become slow, or a specific application might\
    \ stop working. This chapter is designed to show you the command-line tools you\
    \ can use to terminate certain processes that don’t work properly during the system\
    \ operations.\n\nWhen your system wakes, certain activities are activated as processes\
    \ by the kernel. This is followed by a program called init being launched. This\
    \ program runs shell scripts known as init scripts, which are used to start the\
    \ system services. Lots of these services are implemented as daemon programs,\
    \ working in the background and doing what they have to do without a user interface.\
    \ You can find the processes command here:\n\n```\n[gha@localhost ~]$ ps\n  PID\
    \ TTY          TIME CMD\n   48 hvc0     00:00:00 sh\n   82 hvc0     00:00:00 ps\n\
    ```\n\nThe result lists process that are sh and ps respectively. If we add an\
    \ option to the command ps, we can detailed result on our screens. See the following\
    \ example.\n\n```\n[gha@localhost ~]$ ps x\n  PID TTY          STAT TIME COMMAND\n\
    \   1 ?        S      0:00 /bin/sh /sbin/init\n   2 ?        S      0:00 [kthread]\n\
    \   3 ?        I      0:00 [kworker/0:0]\n   4 ?        I<     0:00 [kworker/0:0H]\n\
    \   5 ?        I      0:00 [kworker/u2:0]\n   6 ?        I<     0:00 [mm_percpu_wq]\n\
    \   7 ?        S      0:00 [ksoftirqd/0]\n   8 ?        S      0:00 [kdevtmpfs]\n\
    \   9 ?        I<     0:00 [netns]\n```"
