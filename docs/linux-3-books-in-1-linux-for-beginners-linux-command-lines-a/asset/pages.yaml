- pgno: 60
  md: 'You can find both free and paid software for Ubuntu. But which software would
    you need?


    You can go through the Ubuntu software app and install software that you believe
    will suit your needs.


    # Don’t Do On Your Ubuntu System


    There are a few things that are not advisable to do on your Ubuntu 20.04 LTS system.
    Let''s go through them in brief.


    # Do not uninstall the default desktop


    The default desktop environment in Ubuntu is the GNOME shell desktop. Not every
    user will like the desktop, but Ubuntu gives you the option to install other desktop
    environments alongside the default GNOME Shell, but uninstalling the default desktop
    environment after installing a new one is a poor decision. It can hamper system
    performance and result in irreversible damages if you uninstall your Ubuntu system''s
    default desktop environment.


    # Do not run random commands


    You will find millions of scripts for Linux all over the Internet claiming to
    do something amazing. While some of them are genuine, a majority of them can damage
    your system.


    The thumb rule to follow is if you do not know the function of a particular Linux
    command, do not run it. This should be followed even strictly for commands that
    will perform multiple functions in one go. Always review the content of a script
    before you fire it on your terminal.'
