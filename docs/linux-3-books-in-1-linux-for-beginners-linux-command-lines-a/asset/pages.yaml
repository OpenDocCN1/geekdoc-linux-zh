  md: '# Chapter Eight


    # Linux Shell Scripting


    The command-line tools are good for solving computing problems, but they do not
    make you the master artist in the world of Linux. The shell makes you the master
    of Linux. You should know how the shell works and how you can write different
    types of scripts in a Linux shell. By learning the command line and Linux shell,
    you will be able to carry out a number of tasks by itself.


    A shell script, in the simplest terms, is a file that contains a series of commands.
    The shell will read the file and carry out the commands as though they have been
    entered on the command line. The shell emerges out as distinctive in that it is
    a robust command-line interface system as well as a scripting language interpreter.
    Most of the things that you can do on the command line can also be done inside
    shell scripts. Most of the things that you can do in shell scripts can also be
    done on the command line in Linux.


    We now have covered most of the shell scripting features; however, we have focused
    on the ones that are more often used on the command line. The shell gives us many
    features when we are writing programs.


    # Writing the Shell Script


    Shell scripts are just like ordinary text files which is why you need a text editor
    to write the scripts. The best text editors will provide you syntax highlighting,
    which allows you to see a color-coded view of different script elements. Syntax
    highlighting will help you spot different kinds of common errors and use kate
    or vim to write shell scripts. The system is a bit fussy about blocking old text
    files to run as a program. All this happens for a good reason. You need to set
    up permissions of the script file to allow the execution. You should also put
    the script in a place where you can easily find it because the shell searches
    the file and executes it.


    # The Format of Linux Shell Scripts'
  merge: -1
  img_proc: true
