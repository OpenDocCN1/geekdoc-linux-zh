- pgno: 237
  md: 'Loops are a integral part of many programming languages, including Linux and
    there are three types of looping commands in the bash shell that can be used in
    scripts.


    The first is the for command, which lets you iterate through a list of values
    in the command line, contained in a variable, or obtained through file globbing
    (used for file extraction).


    The second is the while command, offering a method of looping by using the command’s
    condition and ordinary commands. In this way, different variable conditions can
    be tested and, so long as a zero exit status is returned, the while loop will
    continue iterating through a set of specified commands.


    The third is the until command, offering a way of iterating through commands,
    but based on a command or condition that produces a non-zero exit status. Using
    this feature, you can set a condition that must be met before the end of the iteration.
    Loops can be paired up in shell scripts by producing different loop layers. The
    bash shell provides the continue and break commands that we use to change the
    normal loop flow process on multiple loop values.


