    # Removing and Adding Ports


    You may have trouble with finding a predefined service on your system or network.
    The network or the ports may also assume that the defaults used do not match,
    and they may reject the access. Instead of adding a service to your firewall,
    you can add a protocol type or port number using the command **--add-port**. For
