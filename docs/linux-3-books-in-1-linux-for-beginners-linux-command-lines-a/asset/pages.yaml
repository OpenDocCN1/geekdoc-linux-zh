- pgno: 344
  md: '# # Chapter Eleven


    # # The Penetration Testing Life Cycle


    As a system administrator, you need to perform penetration testing in your organization
    to ensure you have the right security enabled in your network and server. In this
    chapter, we will look at the different stages used in penetration testing. Using
    this chapter, you will learn more about system administrators'' different tools
    and the processes they need to follow during each stage. This way, you will understand
    the five stages of the penetration testing lifecycle and have an idea of the tools
    used by security professionals while engaging in penetration testing.


    # ## The Five Stages of the Penetration Testing Life Cycle


    In this section, we will look at the five stages in the penetration testing lifestyle,
    and the information is broken down easily to help you understand what exactly
    is expected out of you during each stage.


    # ### Stage 1: Reconnaissance


    This is the first step in the penetration testing phase. Let us assume you are
    running a military operation. The officers and analysts are going through the
    foreign territory map, and others in a different room are looking at the news
    and trying to see what can be done to take down the enemy. Another group is working
    on the information they need to collect to ensure the team can move into the enemy
    territory and make it their own. You need to do this when you work on a penetration
    test during your ethical hacking process.


    If you do not have the expertise to run a penetration test, the organization will
    hire a team to perform this test. During this phase, you need to discover the
    information about the target system and also gather information about the system
    using public and private sources. You can do this easily by looking for information
    about the Internet since most information is publicly available. During this stage,
    you need only to understand what is present in the target''s network and server.
    You do not breach the network and server'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'since you only have to scan and document the information you will need while
    performing the next few steps.


    # **Stage 2: Scanning**


    Let us consider that you are on a military mission with a team of people, and
    there is a hilltop you need to reach. This hilltop is behind your enemy lines,
    and one of your soldiers is hidden in the bushes. This soldier will come back
    and give you information about the enemy camp. The objective of this mission is
    for you to determine the type of activities the enemy is performing. This soldier
    will also tell you about the different ways you can move into enemy land and the
    security that is around the camp.


    This soldier was told what he needed to do for him to get the information he needed.
    He was told what he had to look at. This is exactly what you do in the reconnaissance
    stage. You gather information, and it is this information you use during the scanning
    stage to determine which server and network you need to scan to find any vulnerabilities.
    You can use various tools to scan the target network, and Kali Linux comes with
    in-built options. You need to use the information you collect during this stage
    during the exploitation phase to determine which areas you need to exploit so
    that you can extract information.


    # **Stage 3: Exploitation**


    If you are performing the penetration testing with a team, you need to ensure
    you move through the network and server easily without being detected. You also
    need to find a way to enter the server without getting caught. You need to find
    the right gaps in the server and enter the system and network through the server''s
    open door. You also need to spend time inside the server and see what information
    you can extract from the system. You need to do this during the exploitation stage.
    The objective is to ensure you quickly enter and exit the network and server with
    the information you need without being detected by anybody. During this stage,
    you need to exploit the system and find sensitive information about the business.
    You can do this repeatedly if you need to.


    # **Stage 4: Maintaining Access**


    When you perform the penetration test, you must ensure you have unlimited access
    to the servers and network you are using. You need to ensure there is'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'access to all the information you need. As the system administrator, you need
    to find a way to keep access while you discover how to enter the target system
    and network. You also need to find a way to exploit the server and see what information
    you can obtain or access through the network. You also need to find a way to get
    in and out of the system without getting caught. Therefore, with the information
    gathered in the exploitation state, they automate a way to keep their access continued
    to the target system.


    # Stage 5: Reporting


    When you perform penetration testing on your system and server, you need to stand
    in front of the entire team and the higher-ups to tell them what you learned from
    the penetration test you performed. You need to explain every step and detail
    everything you found during the test. You need to expand the details of your findings.
    At the end of the penetration testing lifecycle, you also need to prepare a report
    which explains each phase of your penetration test. You need to explain the loopholes
    discovered, the vulnerabilities exploited and the servers, networks and systems
    targeted during the test. In some cases, you may need to provide information about
    the findings. You need to ensure management will look at the different means they
    can use to protect their servers and networks.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Chapter Twelve


    # Scanning


    In this chapter, you will learn about the second stage of penetration testing,
    and this is the most important step since you will learn more about how to scan
    the servers and see what can be done to identify any vulnerabilities. In this
    stage, you need to take input from the discoveries made during the reconnaissance
    stage and gather information about the operating system and the users who use
    the information on that system. When you perform the testing as a system administrator,
    you can move back to the reconnaissance stage to see if there is any new information
    you need to obtain about the processes and people.


    This stage’s objective is for you to scan the information in the network and server
    and identify the information about the target. You can learn more about your information
    and network systems. During this stage, you need to focus on obtaining information
    about live hosts, device types (laptop, desktop, router, mobile, etc.), operating
    systems, software, public-facing services offered (SMTP, FTP, web applications,
    etc.). You can use this stage to remove any basic vulnerabilities in the system.
    These vulnerabilities are easy for one to detect during the scanning stage. You
    can use different tools in the scanning process, but we will look at the main
    tool Nmap that is used to perform this process. This stage’s objective is for
    you to gather the information you can pass onto the next step of the ethical hacking
    process.


    # Network Traffic


    You need to learn more about network traffic and how it works for you to understand
    the different tools and processes used in this stage. The communication which
    takes place between two devices over a network can only happen because of network
    traffic. The most popular modes of network traffic are wireless ethernet and wired
    ethernet. In this section, we will look at the main aspects of network traffic:
    firewalls and ports, and see how you can use them to improve your systems’ security.'
