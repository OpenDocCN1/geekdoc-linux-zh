- pgno: 47
  md: '# # Chapter Four


    # ## Getting Started with Ubuntu


    Now that you have installed Ubuntu, it is time to start using your Linux operating
    system. Unlike the paid operating systems such as Windows or macOS that require
    you to pay more to get additional software, Ubuntu already comes loaded with the
    software you need to get started. You will find everything in Ubuntu right from
    an office suite, a web browser, to email media tools. You are good to start with
    using Ubuntu as soon as the installation is completed.


    Everyone uses a computer in their unique way, and every user likes to customize
    the look and feel of their computer to their requirements. Keeping this in mind,
    Linux lets you use one of the many graphical interfaces that it has to offer.
    Thus, there are hundreds of graphical interfaces available on Linux to suit every
    user''s needs.


    Although there are multiple graphical interfaces available for Linux, two of them
    are the most popular ones, GNOME and KDE. Each of these environments has a user-friendly
    and easy-to-use interface. They have a few differences concerning the look of
    the desktop and how they can be personalized further.


    The KDE environment gives a user complete control and configuration options to
    personalize the desktop. The user can configure every aspect of the desktop and
    has the liberty to modify the desktop''s look and feel.


    GNOME, on the other hand, is inspired by the desktops of Windows and macOS and
    prioritizes simplicity. GNOME can be customized easily, too but hides certain
    options from the user.


    Ubuntu users can choose either of these two desktop environments along with some
    more desktop environments as well.


    The default desktop environment in Ubuntu 20.04 is GNOME 3.36, but this'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'does not mean that you cannot install other desktop environments. Let us see
    what it has to offer to its users.


    # ### Theme


    Ubuntu 20.04 LTS comes with a revamped Yaru theme, and you can see it right from
    boot up to the desktop. Developers of operating systems like to have a distinctive
    look for their operating system, which helps establish their brand''s image. In
    January 2020, Canonical, the parent company of Ubuntu, had a design sprint in
    collaboration with the Yaru team and the Ubuntu design team. Yaru was introduced
    in Ubuntu 18.10.


    Yaru has three types of variations, and it also has a sound theme. During the
    design sprint, the designers and developers also identified some UI improvements
    that could benefit the desktop. You can switch your desktop theme between Light,
    Standard, and Dark colors using the Appearance settings. You can also use the
    default sound alert that Yaru provides.


    ![](img/aae83b54a1b1783f3f5369bd9062b27c_48_0.png)


    The revamped Yaru theme also lets you make changes to the boot splash screen and
    the installer windows. The Yaru team has now implemented the spinner that was
    available only on the desktop to appear even on the boot screen. If you have installed
    the system using the full-disk encryption option, then the boxes for the passphrase
    in the boot menu will match the desktop theme too.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Ubuntu has received a new animal mascot with each major release lately. This
    time also, a neatly designed creature has been integrated for the release. They
    have also given it a name. The Ubuntu 20.04 LTS mascot is called Felicity.


    ![](img/aae83b54a1b1783f3f5369bd9062b27c_49_0.png)


    The default theme wallpaper features Felicity. The theme also has some more wallpaper
    in addition to the mascot wallpapers. All the images come from a copyright-free
    website, and every image is very focal.


    # ## GNOME 3.36


    Ubuntu has defaulted to the GNOME desktop as the default desktop environment ever
    since the release of Ubuntu 17.10. The Ubuntu team has worked deeply with the
    GNOME developers and the Ubuntu community to create a solid GNOME experience for
    Ubuntu users. Ubuntu also has ties with the developers at Debian to keep updating
    GNOME to the latest packages.


    GNOME 3.36 has changes that are visible to the user for a beautiful user'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'interface and hidden changes that improve the performance of the user interface
    and make the desktop experience very stable.


    There is a new toggle for ‘do not disturb,’ which mutes all the notifications
    and helps users who want to stay focused on what they are doing. GNOME 3.36 also
    features simple and beautiful login and lock screens, resulting in a clean user
    interface. The login and lock screen blur the actual desktop background of the
    user.


    The status menu features a quick suspend option. Also, users who like to be organized
    about the app grid can use a feature called ‘better app folder management’ with
    this release of GNOME.


    Going by the tradition of every new GNOME release, desktop and system animations
    are now even smoother, and they do not put a lot of load on the CPU either.


    # **Big Applications**


    Ubuntu now integrates easily with Microsoft Exchange and Google Suite. It ships
    with Firefox 75 as the default web browser that has continued features to protect
    a user’s privacy.


    The default email client on Ubuntu is Thunderbird that lets you access your emails
    from any provider quickly on your desktop. Irrespective of your email service
    provider, be it Gmail, Microsoft, other POP or IMAP provider, you can easily configure
    your email account on Thunderbird. Ubuntu 20.04 LTS comes with Thunderbird 68.7.0
    preloaded with it.


    You also get LibreOffice 6.4 for all your productivity needs. This is a free but
    powerful office suite that lets you perform any office related tasks with ease.


    # **Tier 1 OEM Support**


    Ubuntu is a very popular operating system and is used on a large scale in schools,
    enterprises, government, and public sectors. The Ubuntu team works closely with
    computer manufacturers like HP, Dell, and Lenovo to meet pre-loaded hardware requirements
    from these areas. Let us go through some examples where Ubuntu works with OEM
    partners to add value to desktop users’ Linux experience.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'With the release of Ubuntu 20.04 LTS, you can get a certified device experience
    when you install the general release of Ubuntu. When you install Ubuntu on certified
    hardware from an OEM manufacturer, all the features of that specific hardware
    will be enabled automatically on the device, just as it would have been with factory
    images.


    For example, if you have installed Ubuntu on a Dell device, the boot splash screen
    will automatically feature the Dell logo. Ubuntu also includes PulseAudio 14.0,
    BlueZ 5.53, and Sound Open Firmware to support SoundWire and SMIC, which is provided
    by OEM manufacturers on their hardware.


    With security being critical, we can also see that many devices ship with a fingerprint
    reader and users prefer this way to unlock their systems to typing in a password.
    Ubuntu and the libfprint project are also making it possible to integrate this
    so that hardware vendors can be relieved for their devices that feature biometric
