    # The Root User


    Every operating system has one user that is known as the superuser with all access
    and rights to the operating system. If you have used a Windows operating system
    before, you may have heard about the superuser known as the administrator. Similarly,
    in Linux operating systems, the superuser is known as the **root user**. The root
    user has complete privilege to do anything in the Linux system and is usually
    used to manage the system. The root user can only perform tasks that modify the
    operating system for everyone such as installing or uninstalling software, managing
    files and directories, etc.


