  md: '# SSH from a web browser


    Three browser-based ways to connect to your remote machines


    # TUTORIAL


    ![](img/4c82285250803e975d41cda3a51d081f_40_0.png)


    The original connection. You can place these types of options in the SSH Arguments
    box.


    ![](img/4c82285250803e975d41cda3a51d081f_40_1.png)


    Both Chrome and Firefox have SSH clients in their respective stores. In this tutorial,
    we will be using **Secure Shell** from the Chrome store and **FireSSH** from the
    Firefox store.


    browser-based. This will open up a connection window where you can enter your
    username and password.


    # Finding an SSH client plug-in


    ![](img/4c82285250803e975d41cda3a51d081f_40_2.png)


    # 01 Finding an SSH client plug-in


    # 06 Closing connections


    You close the connection you would with any other SSH client, by typing in the
    exit. When the connection closes, ''Secure Shell'' offers you the option to reconnect
    (R), choose another connection, or simply finish and exit (X). If you choose ''X'',
    the connection window will still be open until you close.


    ![](img/4c82285250803e975d41cda3a51d081f_40_3.png)


    # 07 Saving connections


    All of your connections will be stored as a list at the top of the window. Clicking
    the icon next to a connection will edit the SSH options before flying off and
    disconnecting from the remote machine.


    ![](img/4c82285250803e975d41cda3a51d081f_40_4.png)


    # 02 Installation


    In the case of both browsers, installation should be straightforward. You will
    need to find the relevant app in the browser store and click on the Install button.
    Both browsers will require a restart before the SSH client is ready to use.


    ![](img/4c82285250803e975d41cda3a51d081f_40_5.png)


    # 04 Terminal options


    Secure Shell in Chrome does not have a terminal preferences window, so you will
    need to open a JavaScript console (clicking the menu View/JavaScript Console)
    and change the settings. For example, you can set the background color with the
    following:


    ```

    term__prefs.set(''background-color'',''wheat'');

    ```


    ![](img/4c82285250803e975d41cda3a51d081f_40_6.png)


    # 03 Open a new connection


    For the rest of this tutorial, we will use the Chrome version. To open a new connection,
    simply click on the ''Secure Shell'' icon on


    ![](img/4c82285250803e975d41cda3a51d081f_40_7.png)


    # 08 Finding a Java plug-in


    There is a Java app that you can use MindTerm. In this case, you need to wrap
    MindTerm in a simple website to get the browser to load it and host it somewhere
    else. You can also run it as a Java app.


    ![](img/4c82285250803e975d41cda3a51d081f_40_8.png)


    # 05 Working in SSH


    You can do anything with ''Secure Shell'' that you would normally do with a regular
    client. You can do port forwarding by including the relevant options when you
