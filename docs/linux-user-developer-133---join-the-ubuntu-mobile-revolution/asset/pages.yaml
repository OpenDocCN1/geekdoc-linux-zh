    ![](img/4c82285250803e975d41cda3a51d081f_80_0.png)


    # DISTRO


    # WattOS R7.5


    The lightweight and green distro comes in more flavours to your needs, but still
    does plenty management, multi-users and are set up with the WattOS ideal?


    WattOS is a somewhat unique project in a landscape of linux distributions to maximize
    CPU cycles on old systems; it has always managed to stand out from the crowd by
    offering a user experience that is vastly different from any flat-linux distros,
    and this tradition has been extended further with each release.


    While there is still the WattOS running LXDE, there are now two alternatives.
    With the much lighter Microwatt, the MATE spin is a more functional version than
    the standard version, which comes at the price of using a few more resources.
    As well, while WattOS has its own set of software repositories, some packages
    may need to be added manually later on.


    All the mains run extremely fast, with very little difference between the MATE
    and Microwatt on a modern system. The workflow and UI on the Microwatt remain
    very similar, with the desktop environment to work in, on parity with or under
    other ultra light solutions such as Openbox or Razor-qt. The default application
    selection is kept very limited to cut down bloat, with Chromium as the web browser
    of choice in Microwatt. Where there are no other suites installed,


    printer management, multi-users and are already set up from the start.


    One can easily extend the functionality thanks to the aforementioned Ubuntu sources,
    and you also have access to the WattOS base; it''s best to build up your own version
    of a light distro that fits your needs.


    As order from package base, the only small issue tell with WattOS is that the
    image for each version weighs. The environment does not offer any extra packages
    or either, and the MATE version comes in a full CD size of 700MB. In minor issue,
    it limits its use as an emergency live distro.


