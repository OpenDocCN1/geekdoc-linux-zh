  md: '# # Control Raspberry Pi robot from web using a first-person view


    Create a python app to control your robot with may


    # TUTORIAL


    # 01 Connect the camera


    The camera should be connected to the Raspberry Pi with the blue side back of
    the Ethernet port, and the side with the pins facing the SD card. Lift the connector,
    then slide the ribbon in as far as it will go, and push down the connector to
    secure it.


    # 02 Enable the camera


    Log into the Raspberry system with your username and password raspberry. You may
    have a version that doesn''t support the Raspberry Pi. Run apt-get update to make
    sure you are up to date. Once you are, run raspi-config and select the option
    to enable the camera. You need to reboot for the changes to take.


    # 03 Install mpeg-streamer


    We''re going to use an experimental version of mpeg-streamer that has not been
    packaged for the Raspberry Pi. So, we''ll need to compile it from the index with
    Subversion. Run apt-get update, and we''ll need to download the source code. All
    of the dependencies are required by mpeg-streamer. You can install them with:


    ```

    sudo apt-get install libjpeg8-dev cmake

    ```


    # 04 Compile mpeg-streamer


    as below:


    ```

    git clone https://github.com/linuxamaser/mpeg-streamer

    cd mpeg-streamer/src

    experimental

    make

    sudo make install

    ```


    fi


    ```

    export STREAM_PATH=/home/pi/mpeg-streamer/mpeg-streamer-experimental

    export LD_LIBRARY_PATH=$STREAM_PATH:$LD_LIBRARY_PATH

    $STREAM_PATH/streamer -i "input-raspiprc -d 200" -o "output-x26ink"

    ```


    ```

    exit 0

    ```


    ![](img/4c82285250803e975d41cda3a51d081f_54_0.png)


    # 05 Start testing


    Before we can run mpeg-streamer, we need to export the directory path so the loader
    can find various modules. We export this as STREAM_PATH so we have a nice name,
    but the path is not in the LD_LIBRARY_PATH for the modules. We found it by variables
    like:


    ```

    export STREAM_PATH=/home/pi/mpeg-streamer/mpeg-streamer-experimental

    export LD_LIBRARY_PATH=$STREAM_PATH:$LD_LIBRARY_PATH

    ```


    And now start mpeg-streamer in the following way:


    ```

    $STREAM_PATH/streamer -i "input-raspiprc -d 200" -o "output-x26ink -w $number=1
    /"

    ```


    ... where $number is the number of clients. You can now see the video by going
    to the ip address (http://<ip-address>:8080/test)


    # 06 Start mpeg-at boot


    By making a copy of rc.local to /etc/rc.local we then edit /etc/rc.local to add
    our command script, adding a space before an ampersand to the end of the last
    line, make sure that exit 0 is still at end. Reboot the Pi to make sure it works.
    Your rc.local file should look like this:


    # Step 06


    # 07 Install Apache and modules


    We''re going to use Apache as our web server, SWGI as our method of exporting
    Python from the web server, and to call functions to the others and run the web
    server as access to the GPIO. mpeg-streamer is actually running as root, which
    can be easily fixed by making it user interface. Alternatively, you could make
    to install the packages using:


    ```

    sudo apt-get install apache2 apache2-mod-wsgi

    ```


    We also need to set up a proxy server to connect to our module remotely later.
    We edit /etc/apache2/mods-available/proxy.conf and enable 1. We then need to start
    the proxy script:


    ```

    sudo /etc/init.d/py-nro-start

    ```


    # 08 Configure SWGI


    We want to use SWGI to control our robot. Our export script will call the command
    sudo ususer robotweb with a password of your choice. We edit /etc/apache2/sites-available/000-default
    to enable SWGI. Adding the following lines in the VirtualHost section will fail
    just before the Error log:


    ```

    SWGIProcessGroup robotweb user=robotweb group=robotweb multiprocess=1 threads=2

    ```


    # 09 SWGI Hello World


    Use SWGI to control our robot web. Open /home/robot/robotweb/app.py in your favorite
    editor and add the code to the top of the file. SWGI starts at work by calling
    the calling function of the file you give it, passing through a dictionary


    ![](img/4c82285250803e975d41cda3a51d081f_54_1.png)


    ![](img/4c82285250803e975d41cda3a51d081f_54_2.png)'
