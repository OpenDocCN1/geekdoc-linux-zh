    helping researchers with scientific computing and writing Android apps


    SSH is the facto way of connecting to remote machines where you need to get done
    work. Normally, this is achieved with an SSH client installed on your desktop.
    Unfortunately, there are situations where you do not have access to your SSH clients.
    There are several different options for how to regain a command line connection
    to remote machines.


    available options are limited, but it is one of the least options. The issue is
    that you need to use a supported browser. The second option is a Java-based one.
    A Java applet installed in your browser will handle the actual SSH connection
    and management. This is only possible if you have Java applets and are allowed
    to run Java applets in the browser.


