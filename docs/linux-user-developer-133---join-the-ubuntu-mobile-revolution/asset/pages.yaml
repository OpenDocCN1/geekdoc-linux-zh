  md: '# Feature


    # PyConUK 2013


    Alan O''Donohee (left) speaks to Bank of America employees and Pythonists about
    his work on the Raspberry Jam formula, which is entirely not-for-profit


    ![](img/4c82285250803e975d41cda3a51d081f_63_0.png)


    ![](img/4c82285250803e975d41cda3a51d081f_63_1.png)


    We''ve been using devices like the Raspberry Pi and games like Minecraft Pi to
    change computing education by helping children use Learn how to program in Python.


    Last year''s event we had a teachers track, which was quite small, but really
    successful. Some of the teachers we met during the course of their Python journey
    were directly inspired by things that happened last year.


    Tollervey was referring to the two Turtle talks with Mike Sanderson and Simon
    Gaby, in which both teachers took different approaches


    bettering Python''s now again educational library, both with great success.


    After last year event they went away collaborated with teachers and built something
    in an effort to create more engaging material, that could be used in schools.


    # Served with a side of PI


    Taking things further the educational track culminated with a Raspberry Jam, where
    Python programmers and teachers join forces to educate and entertain a targeted
    age-range of children interested in exploring computer science by playing. It
    was a great way for the teachers, who had spent the previous day picking the brains
    of some of the UK''s leading programmers, to test new ideas. We had teachers both
    this last year and, so, what, what do we need? What''s the next step for Python
    in education? We''re not sure yet, but it''s a great way to find it out, as well.


    We have about 35 kids here with their parents and we are having a Raspberry Jam
    with our friend Alan O''Donohee.


    O''Donohee, likewise known as the ''ambassador'', has been a key figure in quite


    pushing the Raspberry Pi as an educational tool. After sitting with Nicholas,
    Alan and some of the teachers at the event, it was evident that there are many
    reasons why educators, believe that Python and the Raspberry Pi can provide a
    unique chance to show developers intrinsic roles in securing the next generation
    of computer scientists.


    The event saw a wide range of games for games, including Minecraft Pi and a quadcopter
    (controlled from Minecraft Pi) and Raspberry Pi projects, which provided a clear
    brief about what they can achieve, linking the Raspberry Jam with Python UK and
    demonstrating its importance in education.


    Many of the developers were encouraged to see the high level of challenge the
    children were working at, said O''Donohee. It was also noticeable that there is
    gender balance in our participants at the Jam - showing that it''s not just the
    community.


    While too late for today''s young professionals, the UK government has recently
    announced the new ICT.'
