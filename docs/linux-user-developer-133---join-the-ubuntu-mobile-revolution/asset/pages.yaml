    # Compatible devices


    Currently, Ubuntu is recommended for the Galaxy S3 and Nexus 4, the then most
    recent devices. The aim is to have Ubuntu running on Android hardware (BPsP),
    but at present only for the original Nexus 7 according to Collins.


    "The Nexus 7 was well aligned with smart phone usage but works a lot more functional,
    so it was the better choice for 13.10. The only issue is about the phone itself."


    +   * The square screen is more dynamic – however devices doesn''t properly wake
    to it


    +   * The OS has access to all data and services, which are also open to developers


    # Summary


    interface hook Ubuntu on phones is the ways to navigate the environment. Ever-present
    if soft or hardware buttons, you merely swipe to the top of the screen to access
    them. While these were very rough and implemented mainly to show off, this has
    been a fair amount of corners.


    Currently, developers only for this release have major impact on Ubuntu''s main
    phone OS.


    The keyboard-oriented interfaces, works quite well. The learning curve of performing
    the swipes correct is at the same level of getting to any new interface.


    Touch might be a buggy mess for now, making it more like a phone OS now with smoke
    and mirrors.


    Some stuff still has work to be done on it. The UI is the best – and it will connect
    to a WiFi network, but we need to fix the connection management. The system is
    still stable when starting and performing tasks system with a better terminal
    and emulator, which is needed.


    For the keyboard selection, the user experience for the OS right is slightly off.
    If it isn''t for the horrifics that like a bit of work, it might be for you. The
    internet connected phone as the browser is not bad at all. Unfortunately, there''s
    a lot of work to be done, and should never be a deciding factor on whether or
    not you use Ubuntu for daily life.


    The basic app selection is passable, although a lot of the high-quality apps are
    missing from their websites right now – we were a little disappointed at after
    being told some of these apps would be native. There are a couple of games in
    the build that thought could come from the community, a sign of things to come
    if more people start developing for it.


