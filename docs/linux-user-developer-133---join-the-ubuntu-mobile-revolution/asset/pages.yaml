    # # Install Ubuntu


    Here is how to put Ubuntu on the Nexus 4 or Galaxy Nexus...


    # On The Disc


    by vikas@ubuntu.com


    # 02 Backup


    We''ll need to wipe the phone to backup Ubuntu it; there''s no dual booting for
    now. Go to developer options and enable debugging. Developer options can be enabled
    by tapping on ''Build number'' times. Plus reboot and use the terminal type sudo
    enable shared-all


    ```

    sudo apt-add-repository ppa:ubuntu-dev-tools/ubuntu-sdk-tools

    More info: (https://launchpad.net/ubuntu-dev-tools/ubuntu-sdk-tools)

    * GitHub: https://github.com/ubuntu-dev-tools/ubuntu-sdk-tools

    * Ubuntu Dev Tools: https://wiki.ubuntu.com/community/UbuntuDevTools

    * PPA: https://launchpad.net/ubuntu-dev-tools/ubuntu-sdk-tools/

    * PPA: https://launchpad.net/ubuntu-dev-tools/ubuntu-sdk-tools

    ```


    # 01 initial setup


    You''ll need Ubuntu 12.04 or later to install the phone OS. First of all, add
    the repo:


    ```

    sudo apt-add-repository ppa:ubuntu-team/team

    sudo apt-get install install-tools android-tools-tools-fastboot

    ```


    Update the repositories, and then install the necessary software:


    # 03 Unlock phone


    You''ll need to unlock your phone if you haven''t already, and if you haven''t
    done, reboot the device into bootloader. Make sure it''s still plugged in, and
    at the terminal type sudo fastboot unlock


    # 04 final checks


    You''ll need to unlock the bootloader, need to develop options and USB debugging.
    Make sure your phone is plugged into your computer and make a note of the build
    number of phone so you can restore it.


    # # Sense of community


    There are some apps already on Ubuntu Touch, some of which come from the community


    # Ubuntu Touch


    A simple sudoku game that''s made for Ubuntu Touch, with a smart puzzle-creating
    algorithm and a very fast system. The interface has finely been designed out in
    Ubuntu colors of orange, purple and really dark purple.


    # Dropping Letters


    This community-developed game involves filling area as letters drop from the top
    of the screen. Words need to be spelled out before one of the columns gets to
    the top of the screen, allowing for more than one word.


    # Stock ticker


    A must-have for business-minded people, this stock ticker app is ported from Ubuntu
    and shares prices for the companies you''re following with graphs to help visualise
    the trends each stock takes. It will update your life as well, and as long as
    you have an internet connection.


    ![](img/4c82285250803e975d41cda3a51d081f_28_1.png)


    # 05 Install


    We''re now ready to install. Open up the terminal and type:


    ```

    $ fastboot flash ubuntu-system-no-backup

    ```


    This will reboot the phone to the bootloader, download and push the image to the
    device, and then install it. This process will take a while.


