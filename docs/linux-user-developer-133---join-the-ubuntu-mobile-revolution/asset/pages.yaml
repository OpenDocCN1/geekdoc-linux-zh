    at any time


    > Cons

    OS ISO is quite light for

    the type, and it''s based

    on the version of Ubuntu


    # Summary


    WattOS''s extra features have more than the MATE, with the philosophy of the little
    distro still much intact. The extra variety offered by the new versions helps
    make a better decision on how exactly they want their WattOS served to them all.


