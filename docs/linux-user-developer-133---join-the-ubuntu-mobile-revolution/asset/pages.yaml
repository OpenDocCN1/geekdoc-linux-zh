  md: '# On the DVD


    # Your disc


    # # On the DVD


    Find out what lies in store for your issue

    133''s Linux User & Developer DVD...


    Welcome to the Linux User & Developer

    DVD, which accommodates issue 133 of the

    magazine. We''ve again chosen a selection

    relevant to comics of ours.

    As usual, we''ve got some of the most

    cutting-edge distro offers, including the

    first release candidate of openSUSE 13.1\and no less than three flavours of the
    latest


    Ubuntu release – Saucy Salamander,

    includes the new version of Ubuntu

    that we discuss in our Ubuntu Touch feature.

    With them you''ll have to copy your

    disco into an optical drive and select said

    drive from the boot menu live-boot, and install if

    y wish.


    # Distros


    We have two lives-

    booting Ubuntu distros,

    plus the Ubuntu Touch

    and openSUSE uses

    the disc


    # Tutorial Archives


    Our extensive archive

    of previous tutorials

    contains some of our

    best features


    # Tutorial Files


    If you want to follow along

    with some of our distros,

    selected project files are

    available here


    # Software


    20 of the latest

    greatest

    software packages

    covering a variety of

    different functions


    ![](img/4c82285250803e975d41cda3a51d081f_95_0.png)


    ![](img/4c82285250803e975d41cda3a51d081f_95_1.png)


    Four cutting edge distros


    # How to burn an ISO


    Want to try a new distro ISO? Here''s how to get started...


    ![](img/4c82285250803e975d41cda3a51d081f_95_2.png)


    # STEP 1: Grab a new ISO


    Copy the ISO from your cover disc to your

    hard; go to the Distros tab, click ISO

    and save. Find an ISO online to

    download. If you''re not sure you need a 32-bit or

    64-bit version, who to go for the base.


    # STEP 2: Open or install Brasero


    Brasero is the most popular open source-

    dility. If it''s not already installed on

    distro, locate it in your repository and

    install it. Then, open the program and select ''Burn

    image from the Projects tab on the left''


    # STEP 3: Burn your disc image


    On the Image Burning Setup menu, click the first

    box - ''marked'' to select a disc image –

    and navigate to the ISO you just put on your

    disc. Once selected, ensure you''ve got a CD or DVD

    writable disc selected and click ''Create Image''.'
