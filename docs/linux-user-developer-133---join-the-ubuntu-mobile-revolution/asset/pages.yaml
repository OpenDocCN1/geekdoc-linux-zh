    # ## How system calls work


    System calls are the means by which user-space code requests services from the
    kernel. Typically, these are performed within the system call and are not based
    on user mode at the lowest level for operations like memory allocation, opening,
    and closing file handles.


    The rename2() system call is used to open a file on the file system. An application
    calls this system to create multiple directory entries for the same physical inode,
    while the C library function provides the instruction to insert into the kernel,
    mapping the entries accordingly. The result of the system call is managed by the
    C.


