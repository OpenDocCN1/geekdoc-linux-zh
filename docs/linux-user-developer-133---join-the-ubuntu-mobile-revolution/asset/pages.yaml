    # The fear factor


    # My daughter is learning how to build a rocket in Python using Minecraft


    Nicholas Tollevery, member of the PyCon UK organising committee


    We asked Tollevery for his vision of the proposed changes that will challenge
    children as young as five to build their first algorithm. I welcome the accent
    on computer science, programming and thinking computationally. What was it like
    when I was at school - I had a bulky computer and I learned to program using BASIC;
    ICT education has gone down far from that, so it''s great to see this much needed
    change to the curriculum.


    Computing is returning to the school curriculum 20-plus years after schools effectively
    abandoned it. If you are in your early-thirties, you''ve probably been pert of
    the Microsoft generation - a shuddering thought we should be all afraid of. It
    is time we see bare-metal computer science making a comeback (and it boon for
    Python), as there''s currently little budget or training to support teachers.
    When an IT teacher from primary schools attended PyCon UK''s education track,
    she pointed out the challenges and issues facing around country.


    It also directly affects Tollevery, who has children of all ages attending Raspberry
    Jam. My daughter is learning how to build a rocket in Python using Minecraft.
    She doesn''t realise it, but she''s programming with one of the toys which is
    pretty amazing. One of my sons is building something and he is working with a
    Python developer. They all have there and we''ve got some of the brightest minds
    in computing helping them.


    "Teachers have to know about algorithms, logic and some form of iteration - "
    they told us. The lack of training for primary teachers - many of them have no
    computer or ICT qualifications - " we noted in interviews with schools.


    An brief interview concluded, Tollevery was quick to convey bigger and bigger
    plans for next year''s PyCon UK event.


    "One of teachers are bringing back the curriculum, but have no formal training
    and the amount of time the schools is minimal. My last year for the entire computing
    department - as we was £1500. From that I had to try and find funding for continuing
    the project."


    "We hope to get more teachers. The strategy is that programmers aren''t teachers,
    so we haven''t got the expertise to work with kids


    In short, UK educators need help. So we can help make a difference in a local
