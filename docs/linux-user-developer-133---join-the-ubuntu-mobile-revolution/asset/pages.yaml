  md: "# Control your Raspberry Pi robot from the web\n\nCreate a Python web app to\
    \ control your robot using a first-person view\n\n# TUTORIAL\n\n```\nimport PyroCore\n\
    from cgi import parse_environ, start_response()\ndef application(environ, start_response):\n\
    \    # Connect to Pyro\n    movement = Pyro.Core.Proxy('PYRONAME:robotmovement')\n\
    \    parameters = parse_qs(environ['QUERY_STRING'])\nif 'seconds' in parameters\
    \ and 'direction' in parameters:\n    direction = parameters['direction'][0]\n\
    \    seconds = int(parameters['seconds'][0])\n# Call the appropriate function\n\
    if direction == 'Stop':\n    movement.stop()\\elif direction == 'forwards':\n\
    \    movement.forward(seconds)\\elif direction == 'backwards':\n    movement.backward(seconds)\\\
    elif direction == 'left':\n    movement.left(seconds)\\elif direction == 'Right':\n\
    \    movement.right(seconds)\n```\n\n# Step 15 Pi Robot-code listing\n\n![](img/4c82285250803e975d41cda3a51d081f_56_0.png)\n\
    \n```\nstatus = '200 OK'\nelelse:\n    status = '400 Bad Request'\n```\n\n```\n\
    response_headers = [['Content-type', 'text/plain'], ['Content-Length', str(len(status))]]\n\
    start_response(status, response_headers)\nreturn [status]\n```\n\nin /home/web/app.py\
    \ it's also on the disk. We import the Pyro core so we can use it to call the\
    \ robot over network, and also the parse_qs function from cgi. This allows us\
    \ to parse query strings which we created in the first step and turn them into\
    \ dictionaries.\n\nWe then noticed that we registered with the Pyro namesake as\
    \ robotmovement. We've connected to it, so now we can send commands and check\
    \ that we get a valid response. If we get the first direction, and of seconds\
    \ in there will be only one item in each list, and call the appropriate move function.\n\
    \nIf everything went okay then we return a success message, otherwise a bad request\
    \ message. The user won't see\n\nbecause we are displaying the video stream without\
    \ freezing.\n\n# 16 More testing\n\n+   Reload Apache with apache2 restart\n\n\
    Every error will also appear to determine the server's name and change by typing\
    \ your Pi's IP address in a browser. From there, we use the buttons and seconds\
    \ to control the robot. But the robot will stop after all other movements.\n\n\
    We noticed that the robot stops after moving forward for 5 seconds, 3 seconds\
    \ in the forward movement would move the robot back for 2 seconds and stop the\
    \ robot. To solve this problem, you could implement a queuing system.\n\n# 17\
    \ How to disable what we've done\n\nmight not want a camera broadcasting over\
    \ the network. If you want to just see what we've done comment out the four lines\
    \ we added to etc/local by adding a hash character (#) to the start of three lines.\
    \ You can disable this by reboot on Debian\n\n+   - apache2 this will need to\
    \ restart each time Apache is updated and enabled with sudo service apache2 restart\
    \ /etc/init.d/apache2 start to stop Apache apache.\n\n# 18 Further Improvements\n\
    \nThis is a good base for a web interface for your Raspberry Pi, but there are\
    \ many things that could be improved to make it like:\n\n+   - Adding-and-call\
    \ functionality to the article on the web.\n- Showing the video stream through\
    \ Apache, as previously mentioned.\n- Adding authentication so that only people\
    \ with a username and password can control the robot.\n- Using SSL for a secure\
    \ connection.\n- Working out how to handle a full cycle into a single function\
