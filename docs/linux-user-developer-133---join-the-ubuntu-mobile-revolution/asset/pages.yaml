    # Free software and the NSA


    The other inescapable theme at the conference was information security and the
    surveillance state, brought on by the revelations of NSA-whistleblower Edward
    Snowden. Presentations ranged from a call to action by Free Software Foundation
    (FSFE) president Karsten Gerloff, to practical guides regarding network monitoring
    and intrusion detection techniques.


    Painting a dystopian vision of the current situation, Gerloff stated that the
    FSFE is lobbying EU and national politicians. He said that very few politicians
    understand the importance of our daily life, explaining that informing them is
    possible and matters. He answered that public anyway has allowed corporate lobbyists
    to dominate democracy.


    Following Linus Torvalds on stage, the final keynote speaker Mikko Hipponen also
    attacked pessimistic attitudes towards government surveillance. Citing the comments,
