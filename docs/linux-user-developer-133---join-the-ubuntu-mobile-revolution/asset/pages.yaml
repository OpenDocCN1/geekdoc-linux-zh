  md: '# # Make you own DEB and RPM packages


    How to create the two most common types of Linux packages


    TUTORIAL


    ![](img/4c82285250803e975d41cda3a51d081f_36_0.png)


    # 01 Employ a virtual machine


    VirtualBox is the best approach for building software packages for other systems.
    For one thing, it allows you to maintain a relatively clean, reference installation
    that is comparable to the setup that other people are running. This also means
    that you can keep selection of targets environments, using different distributions.
    In addition, visualisation allows for different architectures, and can even extend
    to running 64-bit OS on a 32-bit platform, although performance suffer.


    # Part 1 Debian


    # 04 Create a GPG key


    If you haven''t created a public GPG key in the past, just create one now before
    signing your packages. `gpg --gen` Accept the defaults, and fill in your name
    and contact details when prompted. Make a note of these details, as you will need
    them again in the future. Following this, use `gpg --list-keys` to find your key''s
    ID (first-last).


    ```

    gpg --output /your/key/key.gpg --export ''your name'' Import this with gpg --import
    /your/key/key.gpg

    ```


    # 05 Fetch package


    In this example, we''re going to build the latest version of the Dillo web browser.
    Navigate to the website (www.dillo.org) and create a directory for source with
    `mkdir` and move the archive into it.


    ![](img/4c82285250803e975d41cda3a51d081f_36_1.png)


    # 03 Install build environment


    We''ll install most of the tools that we need to make software from source code.


    ```

    sudo apt-get install build-essential autoconf autotools-dev

    ```


    Now we have all the tools that we need for handling DEB packages. Do this with
    the following command:


    ```

    sudo apt-get install dh-debhelper descripts xutils lintbuilder

    ```


    # 06 Unpack the package


    Unpack the package with that name (package name-version). This is crucial for
    our purposes, and finally unpack it. It''s also crucial that the archive is one
    level above the source directory.


    # 02 Starting from scratch


    If things go wrong, it is perfectly safe to simply delete the source directory
    and start again. Note that the Debian tools also alter the source, so you will
    have to start with a fresh copy.


    # 07 Add Debian changes


    Move the archive that we have unpacked with dh-make. This is a script that takes
    care of work of configuring the configuration file and directory structure, and
    we need that added earlier.


    ```

    dh-make --email <your email> --licence - -../archive

    ```


    ![](img/4c82285250803e975d41cda3a51d081f_36_2.png)'
