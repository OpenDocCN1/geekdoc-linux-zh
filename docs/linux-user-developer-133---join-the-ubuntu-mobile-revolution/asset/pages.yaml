    # Google funds open source security patches


    Extends your bounty beyond its own software


    +   - Google will pay up to $3,133.70 for security improvements to a range of
    source projects


    ![](img/4c82285250803e975d41cda3a51d081f_9_0.png)


    Google search and advertising giant Google has announced an extension to its Vulnerability
    Reward Program, designed to provide cash incentives to security researchers who
    find evidence of flaws in the company''s various applications and services. We
    see Google find enhancements in a variety of free, open source software packages.


    > We all benefit from bounty work done by the source community, explained Security
    Team member Michal Zalewski of the move. ''That''s why we keep asking others to
    test our Program - and to improve the security of third-party software critical
    to the health of everyone''


    > So we decided to try something new: provide financial incentives for down-to-earth,
    proactive improvements that go beyond fixing a known security bug. Whether you
    want to switch to a more secure allocator, to provide


    separation, to clean up a bunch of sketchy calls or even just include ASLR - we
    want to help.


    Ultimately, Google is asking for security improvements made to OpenSSH, BIND,
    OS DHCP, libpcre2, lib-turbo, gffit, Chromium, Blink, OpenSSL, and Linux kernel
    projects. We plan to expand the programme in the future to include popular web
    servers, SMTP servers, compiler and linker tools, and the OpenVPN runtime itself.


    Developers who have improved any can qualify for a cash reward from Google. Patches
    are simply delivered directly to individual projects'' maintainers; report details
    are sent to Google. Should the company decide the submission has what Zalewski
    describes as "demonstrable, positive impact on the security of the project," -
    the cash will be granted.


    Qualifying submissions include improvements to privilege security, memory allocator
    hardening, cleaning-of integer mathematics, fixes for race conditions, and elimination
    of error patterns or leaks


    > We thought about kicking off an OSS bug-hunting program, but this approach could
    be more effective. By validating reports, bounty invites are a significant volume
    of spurious traffic - enough to overwhelm a small community of volunteers. On
    this kind, having effort is better than finding.


    The programme is also open to all, including maintainers themselves, excluding
    individuals found on local sanction lists, such as Cuba, Iran, North Korea. Regardless
    of whether or not a patch from such an individual is accepted by the project maintainers.


    More information on the programme, and how to make a submission, can be found
    at tinyurl.com/patch-rewards.


