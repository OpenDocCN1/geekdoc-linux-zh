    # # MapD takes Big Data to GPUs


    Massively parallel platform brings significant performance gains


    A new database MapD aims to significantly speed up the analysis of data sets using
    the parallel processing capabilities of modern graphics units (GPUs) at a fraction
    of the expected cost.


    The brainchild of Todd Mast of the Massachusetts Institute of Technology, MapD
    aims to insert into the composable compute framework nodes to allow for fast analysis
    of hundreds of gigabytes of data.


    MapD, a hybrid multi-CPU-GPU architecture running across multiple nodes, explains
    of Mast. "This architecture allows for massive


    parallelisation of the querying, analysis, and visualisation of big datasets,
    and results in an increased speed of processing, in the order of multiple orders
    of magnitude, across many of the big data workloads commonplace.


    The MapD system is designed to minimise memory access during GPU analysis, accelerating
    generation cycles by reducing the return of indexed or compressed bitmaps of matching
    rows from GPU to the CPU after a filter operation to reduce PCI Express traffic.


    The platform is being used to perform rapid analysis of data sets, in particular


    ![](img/4c82285250803e975d41cda3a51d081f_11_0.png)


    MapD can be used to dramatically accelerate database analysis on the off-shelf
    GPU hardware


    Twitter messages, to create heat-maps and other visualisations as close to real
    time as possible.


