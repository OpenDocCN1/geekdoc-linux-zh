    reasons why educators, believe that Python and the Raspberry Pi can provide a
    unique chance to show developers intrinsic roles in securing the next generation
    of computer scientists.


    The event saw a wide range of games for games, including Minecraft Pi and a quadcopter
    (controlled from Minecraft Pi) and Raspberry Pi projects, which provided a clear
    brief about what they can achieve, linking the Raspberry Jam with Python UK and
