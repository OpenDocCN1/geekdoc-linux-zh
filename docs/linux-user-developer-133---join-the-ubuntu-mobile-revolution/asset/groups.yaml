    \ ROS 新的共享课程，通过相对简单的配置可以使用许多开发设备的工具。\n\n所有 ROS 操作都始于使用统一机器人描述格式 (URDF) XML 模型定义您的设备参数。之后，运动、感知、绘图和绕过障碍重新计算路线即可作为\
