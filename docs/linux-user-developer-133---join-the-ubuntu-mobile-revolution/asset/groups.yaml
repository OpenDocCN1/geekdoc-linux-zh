    # # Firefox OS: developer tips & tricks


    A getting-started guide to Firefox OS development


    # FEATURE


    > > A mobile website can be easily transformed into a Firefox OS app


    # Useful links


    App Manifest: An open-web manifest contains all the information your app needs
    to interact with the OS: see tny.ly/pfvyo88


    App Permissions: An overview of what an app is and how to request permissions:
    see tny.ly/cpigiew


    Firefox OS Developer Guide: What a good HTML5 app looks like (with download examples),
    how you can register and install your app on the Firefox OS: see tny.ly/olqyb8


    Firefox OS Simulator: How to develop and test apps on your own hardware: tny.ly/3666


    Firefox Marketplace: Where developers can list and sell their apps: https://marketplace.firefox.com


    from vi the command line, right up to Eclipse: you will feel most comfortable
    with it. So, far there, it is still defined by SDK and you don''t have to register
    or pay. Mozilla''s fundamental identity is to keep it free and accessible for
    everyone, and Firefox OS reflects this.


    maintain. As Mozilla does not need the server to vouch for its security, the app
    will only be permitted to access a fraction of what is available.


    Privileged app: How grant access can be created by the Firefox Marketplace through
    Content Security Policy. Privileged apps must require a signature and installation
    via the Marketplace: https://tny.ly/TRSCP


    # Security for apps


    In open manifest, the developer defines what the app should be, which functions
    the app has access to. Firefox OS security ensures that the app has ''permission''
    to do. This is necessary to ensure, for example, that no app can access messages
    or make calls without the end user knowing about it.


    There are app of web APIs that may be used


    # Web APIs


    In Firefox OS you can access the hardware via APIs: https://docs.mozilla.org/webapis.
    For cross-platform HTML5 apps such as Android and iOS, developers can also access
    the various hardware components of the mobile phone via JavaScript. For example,
    you can get the battery percentage with navigator.battery.level, or the phone
    signal strength for one of the networks.


    A detailed list of everything that is allowed and which services can be found
    here: https://docs.mozilla.org/dev/webapis


    Put briefly, the various services indicate the following:


    Mozilla Developer Network (MDN) is where you can find everything ranging from
    API documentation. Developers can find more required Firefox OS information here.


    Developers can also launch a new app: https://github.com/robynman/Firefox-OS-Boilerplate-app
    by Robert Number that can be used as a base. This app automatically adjusts to
    the screen and is equipped with all types of buttons in the interface. In addition,
    the app can also be installed from the web of a button, without having to be logged
    into the Marketplace.


    Hosted app: the app can be stored on your own server, making it easy to amend
    and deploy


    # Earn money with Firefox OS apps


    Developers divide revenue in Firefox OS and should be rewarded for their efforts.


    The revenue share varies depending on the region, payment method, financial framework
    condition. Mozilla supports the payment method for developers, such as those,
    which makes it easier for users to buy apps, even if they don''t have credit.


    For developers it depends not only on the payment method but also on payment regulations
    from the next. However, the objective is to ensure that developers are paid for
    Marketplace purchases within 60 to 90 days.


    # First apps on


    There are possibilities for testing the first version of these works on the desktop,
    using the Firefox OS Simulator add-on. This can be started up easily by visiting:
    Tools:Web Developer Guide for Firefox OS Simulator


    You can also test on mobile phone with Firefox OS, a console displaying information
    and errors, and the hard drive. You will get the best results by using Firefox
    Night in your browser. In meantime, the first Firefox OS smartphones have hit
    market, meaning developers can now test their apps on the device.


