    Ubuntu 中的软件库可能有些混乱。


    Firefox 扩展是 Chrome 和 Chromium 能够兴起的原因之一。


    这并不像移除仓库那么简单。当你禁用 PPA 时，只有特定的方法可以有效地将其移除。


    在为你的笔记本电脑花时间构建构建之前，先在你的电脑上试试 Chrome。镜像可以在 chromeos.hehexx.net 找到。


    首先，你可以打开 Ubuntu 软件源来禁用它们。点击顶部栏上的“编辑”和“软件源”。这将打开一个包含仓库的窗口，你也可以逐个删除。普通的软件仓库在这里无法删除，PPA
    也不行。然后使用软件中心并打开终端，使用带有 `--remove` 参数的 `add-apt-repository` 命令来移除 PPA。类似于：


    # 总体问题


    ```

    sudo add-apt-repository --remove ppa:repo/ppa

    ```


    我最近在两台机器上安装了 Arch，目前 Firefox 在两台机器上都运行得异常慢。由于这种现象在我的主系统上也发生了，所以我决定检查一下 Chrome，它运行得很好。我是
    Arch 的忠实粉丝，但在我处理的其他任何系统中都没有出现过这种情况。


    那应该可以消除它。执行 `sudo apt-get update`，然后当你尝试安装某些软件时，`sudo` 就会修复任何简单的问题。


    是一或两天前，所有安装都是不带 AUR 的全新安装。我发现了这个问题，它是由一些过时的软件包导致的。我的系统并没有被某种机制超频，事实并非如此。


    如果仍然很慢，你可能需要等待 Firefox 的更新。不过 Chromium 仍然很棒，所以影响不会太大。


    我也想过 `lib32-firefox-plugin` 会有帮助，但什么都没有变化。


    你在几分钟后遇到过这个问题吗？程序在之后冻结了。


    今年初，我在 Ubuntu 中添加了一个 PPA 来获取我需要的包。没什么特别的。遗憾的是这个 PPA 似乎坏了，所以我找到了替代方案。我喜欢确保我的仓库列表干净整洁。我不确定如何移除它，因为我从未需要移除过
    PPA。你是如何操作的？


