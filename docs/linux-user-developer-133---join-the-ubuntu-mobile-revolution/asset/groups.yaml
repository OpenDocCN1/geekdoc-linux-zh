    # MINI PC


    # CompuLab MintBox 2 £370 / $599


    The MintBox 2 is here and it''s more powerful than ever. Just how much power are
    you getting for £400, though?


    Last year''s announcement of the original MintBox was a bit of a surprise. Ubuntu
    has been distributed on some laptops and desktop PCs for a while now, Linux Mint
    doesn''t quite have the mainstream attention of the distro it''s based on, nor
    does it like Canonical''s to try and promote. The MintBox was a fairly high-end
    system, for its size, and served as a test platform for future PC creation. One
    year on, a second MintBox has been released, imaginatively titled MintBox 2, and
    is worlds better than the original.


    in review. Specifically, it''s based on the mid-range of the Intense PC, running
