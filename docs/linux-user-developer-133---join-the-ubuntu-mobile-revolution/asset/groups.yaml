- md: "\n## Feature\n\n## PyConUK 2013\n\nAlan O'Donohee (left) speaks to Bank of\
    \ America employees and Pythonists about his work on the Raspberry Jam formula,\
    \ which is entirely not-for-profit\n\n![](img/4c82285250803e975d41cda3a51d081f_63_0.png)\n\
    \n![](img/4c82285250803e975d41cda3a51d081f_63_1.png)\n\nWe've been using devices\
    \ like the Raspberry Pi and games like Minecraft Pi to change computing education\
    \ by helping children learn how to program in Python.\n\nLast year's event we\
    \ had a teachers track, which was quite small, but really successful. Some of\
    \ the teachers we met during the course of their Python journey were directly\
    \ inspired by things that happened last year.\n\nTollervey was referring to the\
    \ two Turtle talks with Mike Sanderson and Simon Gaby, in which both teachers\
    \ took different approaches bettering Python's now again educational library,\
    \ both with great success.\n\nAfter last year event they went away collaborated\
    \ with teachers and built something in an effort to create more engaging material,\
    \ that could be used in schools.\n\n## Served with a side of PI\n\nTaking things\
    \ further the educational track culminated with a Raspberry Jam, where Python\
    \ programmers and teachers join forces to educate and entertain a targeted age-range\
    \ of children interested in exploring computer science by playing. It was a great\
    \ way for the teachers, who had spent the previous day picking the brains of some\
    \ of the UK's leading programmers, to test new ideas. We had teachers both this\
    \ last year and, so, what, what do we need? What's the next step for Python in\
    \ education? We're not sure yet, but it's a great way to find it out, as well.\n\
    \nWe have about 35 kids here with their parents and we are having a Raspberry\
    \ Jam with our friend Alan O'Donohee. \n\nO'Donohee, likewise known as the 'ambassador',\
    \ has been a key figure in quite pushing the Raspberry Pi as an educational tool.\
    \ After sitting with Nicholas, Alan and some of the teachers at the event, it\
    \ was evident that there are many reasons why educators believe that Python and\
    \ the Raspberry Pi can provide a unique chance to show developers intrinsic roles\
    \ in securing the next generation of computer scientists.\n\nThe event saw a wide\
    \ range of games for games, including Minecraft Pi and a quadcopter (controlled\
    \ from Minecraft Pi) and Raspberry Pi projects, which provided a clear brief about\
    \ what they can achieve, linking the Raspberry Jam with Python UK and demonstrating\
    \ its importance in education.\n\nMany of the developers were encouraged to see\
    \ the high level of challenge the children were working at, said O'Donohee. It\
    \ was also noticeable that there is gender balance in our participants at the\
    \ Jam - showing that it's not just the community.\n\nWhile too late for today's\
    \ young professionals, the UK government has recently announced the new ICT.\n\
    \n## Putting education on track\n\nEducation was a focus for this year's PyCon\
    \ UK event.\n\n## FEATURE\n\n![](img/4c82285250803e975d41cda3a51d081f_64_0.png)\n\
    \nZeth Green shows off his programming skills as part of the Raspberry Jam show\
    \ and tell\n\n![](img/4c82285250803e975d41cda3a51d081f_64_1.png)\n\n## The fear\
    \ factor\n\n## My daughter is learning how to build a rocket in Python using Minecraft\n\
    \nNicholas Tollevery, member of the PyCon UK organising committee.\n\nWe asked\
    \ Tollevery for his vision of the proposed changes that will challenge children\
    \ as young as five to build their first algorithm. I welcome the accent on computer\
    \ science, programming and thinking computationally. What was it like when I was\
    \ at school - I had a bulky computer and I learned to program using BASIC; ICT\
    \ education has gone down far from that, so it's great to see this much-needed\
    \ change to the curriculum.\n\nComputing is returning to the school curriculum\
    \ 20-plus years after schools effectively abandoned it. If you are in your early-thirties,\
    \ you've probably been part of the Microsoft generation - a shuddering thought\
    \ we should be all afraid of. It is time we see bare-metal computer science making\
    \ a comeback (and a boon for Python), as there's currently little budget or training\
    \ to support teachers. When an IT teacher from primary schools attended PyCon\
    \ UK's education track, she pointed out the challenges and issues facing around\
    \ country.\n\nIt also directly affects Tollevery, who has children of all ages\
    \ attending Raspberry Jam. My daughter is learning how to build a rocket in Python\
    \ using Minecraft. She doesn't realise it, but she's programming with one of the\
    \ toys which is pretty amazing. One of my sons is building something and he is\
    \ working with a Python developer. They all have there and we've got some of the\
    \ brightest minds in computing helping them.\n\n\"Teachers have to know about\
    \ algorithms, logic and some form of iteration - \" they told us. The lack of\
    \ training for primary teachers - many of them have no computer or ICT qualifications\
    \ - \" we noted in interviews with schools.\n\nAn brief interview concluded, Tollevery\
    \ was quick to convey bigger and bigger plans for next year's PyCon UK event.\n\
    \n\"One of teachers are bringing back the curriculum, but have no formal training\
    \ and the amount of time the schools is minimal. My last year for the entire computing\
    \ department - as we was £1500. From that I had to try and find funding for continuing\
    \ the project.\" \n\n\"We hope to get more teachers. The strategy is that programmers\
    \ aren't teachers, so we haven't got the expertise to work with kids.\n\nIn short,\
    \ UK educators need help. So we can help make a difference in a local school by\
    \ regenerating an interest in STEM. See www.computingschool.org.uk or the STEM\
    \ ambassador program - www.stem.org.uk/content/stem-ambassadors/ Raspberry Jam\
    \ brought more than their children - it's teachers that have the most change.\
    \ Reaching out to teachers and showing them the tools, giving them confidence\
    \ and showing them can translate into what they need, in their own classrooms.\n\
    \n![](img/4c82285250803e975d41cda3a51d081f_64_2.png)\n\nwww.linuxuser.com\n\n\
