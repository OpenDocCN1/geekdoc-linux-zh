    # FAQ: Using virtual machines with VirtualBox


    ![](img/4c82285250803e975d41cda3a51d081f_85_0.png)


    **Q: How do you set up a virtual machine in VirtualBox?**

    A: Click New on the main interface to bring up the window for setting up your
    VM. Give it whatever name you wish, and select Linux as the type. The RAM bar
    will be set at a recommended value, but you can change it if you''re comfortable
    with – increase memory to 128MB, if you want to use a disk instead of virtual
    file, attach your disk image, then Start.


    Once the VM has started, click Settings. Under Display, enable 3D acceleration
    and increase memory to 128MB, if you want to use a disk instead of virtual file,
    attach your disk image, then Start.


    **Q: Should I use 32-bit or 64-bit?**

    A: 32-bit images will generally run fine. If you need 64-bit system or something
    similar, you''ll need to install it.


    **Q: Can I dual-boot on virtual machine?**

    A: Yes, if you have enough space on the virtual hard drive or other space in VMs.
    You won''t need to do anything to get GRUB to dual-boot the virtual drives like
    it would in a normal hard drive – like it would install.


