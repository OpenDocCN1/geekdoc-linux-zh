    ## Firmer 名称


    我终于开始使用我的 Raspberry Pi 了——因为搬家我在沙发上坐了一会儿，所以现在真的有机会可以利用它了。我发誓这个 Pi 需要 Raspberry
    的进一步帮助，因为我拿到了但它拒绝什么都不做。真的需要使用 ClamAV 吗？据我所知，Debian 仓库中没有这个最终版本，我该做什么来解决这个问题？


    Al Blackley


    虽然 Clam Antivirus 在标准的 Debian 仓库中，但它们并不是 Debian 项目中可用新包的最新版本。Debian 的标准确实是非常及时的。你需要向列表添加一个新仓库，例如：


    ```

    deb http://XX.debian.org/

    debian squeeze-updates contains main

    ```


    ...其中 XX 是你的两位国家代码。


    我如何更新我的 Raspberry Pi 固件？我需要使用任何特殊工具吗，还是说它其实非常简单？希望你买的时候它还有点复杂，自那以后 Raspberry pi
    已经变得简单了一些。有人整合了一个名为 `updated-raspberry-firmware` 的包，并且 `cut Raspberry Pi` 是专门为
    Raspbian 设计的。它现在实际上自带了工具，所以我们建议让 Raspberry 变得如此简单并将其插入你的 Pi 中。


    PACKAGE 需要 `ncurses`，但当我用 `YUM` 安装它时，它说已经安装。以下是错误代码：


    ```

    checking for ncurses-...

    configure: PACKAGE requires ncurses


    + # yum install ncurses

    Loaded packages: lang, refresh, pre-Setting up Installation

    Package-5.8.0-2011039.x86_64 already installed

    Nothing

    ```


    我用 YUM 重新安装了 `ncurses`，但它失败了。Clam 的主要问题可能是什么？在开始时，有一个更新选项，以便它继续运行。如果你愿意，只需打开 Raspbian
    并打开终端：`$ rpi-update`


    对于这种事情，我还需要更多的 `ncurses` 来让它工作，确保它已安装。今天我使用了 `update` 导致了任何问题，并且运行 Ubuntu 似乎与此兼容，使用：


    ```

    $ yum install ncurses-devel

    ```


    当标准包不足时。确保 `ncurses-devel` 与安装的版本匹配，尽管我不确定该怎么办。你可以发现问题更有可能出现在更新时，或者尝试恢复到之前的版本。保持你的
    Pi 更新到最新状态可以解决大部分问题。我在主站上使用 Raspberry Pi，并尝试使用 `aptitude install`，但它没有运行！


