    \ RepRap 3D 打印机、电脑、Arduino 以及偶尔出现的树莓派，所有的都经过了精细调整，实现了令人惊叹的成就。由开源硬件用户小组（OSHUG）举办的“OSHCamp”已成为英国创客社区的年度朝圣活动。今年活动（位于狂风节\
    \ Wuthering By Festival 期间）最显著的变化是， OSHUG 的贡献者更加关注业务，这代表了开源硬件世界的一个巨大变化：从黑客行为到穿上西装领带？\n\
    \n“非常棒，现在有更多的人可以通过他们热爱的事维持生计，” Tanner 回答道。\n\n## 活跃房屋\n\nTanner 和他的同事一直在为伦敦的建筑师开发一种新的“活跃房屋”。该项目使用开源硬件传感器、执行器和\
    \ Arduino 控制器以及树莓派，以最大限度地减少能量需求。它将更有效地利用自然阳光、热窗帘和照明。\n\n> “这栋房子正进入它的第一个测试阶段，将与其住户进行智能互动，既可以自主运行，也可以在适当的情况下判断，”\
    \ Tanner 告诉我们，“我们正在使用基于房间的模块和一些特殊系统，我们打算让系统是低成本的，硬件和软件都是开源的。”\n\n![](img/4c82285250803e975d41cda3a51d081f_15_1.png)\n\
    \n北伦敦最智能的房屋——由 Paul Tanner 及其打造\n\n16 www.linuxuser.co.uk\n\n## 新闻\nLinux 社区的最新动态\n\
