    # The FUZE Powered by Raspberry Pi


    - A protected GPIO breakout board provides an easy way to safely interface hardware
    with the Pi

    - The bundled breadboard can be glued down in the case''s recess to provide a
    prototyping area

    - An integrated keyboard helps the Pi feel like a ''real'' microcomputer

    - Vents prevent the Pi from overheating inside the metal case, even when overclocked


    ## PERIPHERAL


    ### The FUZE

    Powered by Raspberry Pi


    # £179.99


    Can an add-on which channels the headway of the BBC Micro be what the Raspberry
    Pi needs to succeed in schools?


    The brainchild of Jon Silvera, the FUZE Powered by Raspberry Pi is styled after
    the microcontrollers of the 1980s - in particular the Acorn BBC Micro, which directly
    led to the development of this chunky piece of metal, that powers the modern Pi
    while providing access to the majority of its ports: Ethernet, audio, HDMI, a
    single USB port and access to the SD card slot - but said only the composite video,
    DSI and CSI connectors are broken out - meaning those who want to make use of
    these features will need to modify them themselves.


    To one of the two USB ports of the Raspberry Pi Model B reassembled at the top
    also holds a GPIO breakout board and attaches to a mini-breadboard for easy wiring.
    When bought in its full form, the FUZE - like a mouse-less computer - meaning
    the buyer only needs an HDMI display in order to get started.


    Included in the kit goes even further to extend the keyboard boom of the Eight.
    Pre-fledged with a customised Raspberry install, the SD card includes a programming
    language called Basic, which like BBC Basic of - sits the user at a black screen
    with a white, flashing cursor. Unlike classic...


    The FUZE is more than a case, however, the unit includes an 88-key island-style
    keyboard, which connects to one of the two USB ports of the Raspberry Pi Model
    B.


    > Pros

    - Solid build and with clever design the FUZE is a great way to adapt the Raspberry
    Pi for educational use


    > Cons

    - It''s an expensive accessory if you''re not VAT-registered


    # The FUZE Powered by Raspberry Pi


    RasPi case, keyboard and much more


    ## REVIEW


    ### Technical specs


    - The remainder of the ports are relocated to the rear of the case using clever
    pigtail adapters

    - The Raspberry Pi is held securely on a removable tray using its mounting holes,
    making the case unsuitable for Revision 1 models.


    | Feature | Description |

    | :--- | :--- |

    | Operating system | Customised Raspbian with FUZE Basic |

    | Processor | Raspberry Pi Model B (also available for B+) |

    | Dimensions | 330 x 240 mm (excluding PSU) |

    | Weight | 163g (excluding PSU) |

    | Expansions | PCB protected GPIO breakout board, bundled mini-breadboard |

    | Keyboard | Integrated 88-key-style island |

    | Ports | 3x USB, Ethernet, SD, power, 3.5mm audio out, HDMI |

    | Extras | Mouse; manual; PDF project cards; reference manual; GPIO cards with
    flexible jumpers, red/green LEDs, eight-segment LED, buzzer, switches, batteries
    |


    ## Also consider


    The composite video, CSI and D ports are not out of the case and are therefore
    unusable.


    Arduino Experimenter''s Starter Kit (ARK)

    £31.20

    Designed to easily verify the capabilities of the Raspberry Pi, the FUZE includes
    Arduino boards that can be connected to Linux via USB - add hardware functions,
    components, and a battery to get started.


    All the old classics - "10 Print", "20 Go" - work fine, but FUZE Basic has a trick
    up its sleeve: access to the GPIO. Using a sandbox environment within FUZE allows
    users to read or write to the GPIO pins.


    The documentation we provide is free as quickly as possible, and only four of
    them were included at the time of review.


    The biggest problem with the FUZE is its price: while the Pi itself costs just
    £30, it is often bought in starter kits around £80 which include all necessary
    accessories bar the monitor. The FUZE means, costs with and not educational use,
    that''s a premium that may be out of reach of many parents. Savings are possible
    with the bundle at £129.99, or as a bundle of just case, PSU and breakout for
    £89.99. The cheapest option, however, is to buy the case alone.


    The difference in pricing, is due to the Pi, which is produced in Wales, the FUZE
    is a UK product and therefore is coming from further away.


    > Gareth Holmore


    # Summary


    The FUZE is expensive for anyone who can''t handle the VAT back and still a bit
    difficult for beginners to work without help, but it''s a FUZE-enhanced approach
    far suited than the bare device alone. The chassis is solidly constructed, the
    software and the GPIO breakout provides much-needed protection against £19.99
    - and white will be to deduct the VAT.


