    \ or artist is a must these days, with user-created and auto-generated playlists\
    \ as well as connection to cloud storage and music services. one of the most popular\
    \ players, we've decided to look at it and see if it's really the best media player,\
    \ or if others deserve your attention. We'll be looking at their ability to play\
