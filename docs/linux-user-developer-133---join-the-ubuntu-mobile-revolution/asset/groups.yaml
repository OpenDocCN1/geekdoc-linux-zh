    Last issue we built a Raspberry Pi robot. This issue, we''ll create a Python web
    application that lets you control your bot using a first-person view


    After building our Pi last issue, we''ve been thinking up ideas for tutorials
    to extend Jonny Pi''s skills and abilities. One of the ideas we had was to control
    our robot from a web-browser. To make things even more interesting, we decided
    to incorporate the Raspberry Pi Camera Module so we can show a first-person perspective
    of what Jonny Pi can see. As long as you''re within Wi-Fi range of your robot,


    you can drive around simply by watching the feedback from the app itself.

    To this, we''ll teach you how to use the gst-streamer software to stream video
    straight from Raspberry Pi to your browser. Now that we have in place, we''ll
    be converting the motion code from the previous issue''s guide so it can be executed
    from our little web application, and then we''ll write said in Python. It''s as
    easy as Pi!


