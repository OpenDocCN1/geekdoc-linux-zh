- md: "\n# Feature Firefox OS: developer tips & tricks\n\nAdvisor Christian Heillmann\
    \ is a principal evangelist for Mozilla with a focus on the open web and HTML5.\
    \ He built his first website around 1997 and spent the following years working\
    \ on lots of international web projects.\n\n## How to get started\n\nFirefox OS\
    \ is HTML5, there is no Java, C# or Objective C. Firefox OS gives developers access\
    \ to the mobile phone's functionality with HTML, CSS and JavaScript. A mobile\
    \ website can be easily transformed into a Firefox application. You just need\
    \ to define data using Cache and LocalStorage or IndexedDB and specify the name\
    \ and access rights in a manifest.\n\nAn example manifest looks like this (see\
    \ tinyurl.com/pfvoy8 for more details):\n\n```json\n{\n  \"name\": \"My App\"\
    ,\n  \"description\": \"My elevator pitch goes here\",\n  \"launch-path\": \"\"\
    ,\n  \"icons\": [\n    \"/img/icon-128.png\"\n  ],\n  \"developer\": {\n    \"\
    name\": \"Your name or organization\",\n    \"url\": \"http://your-homepage.here\"\
    ,\n    \"default-locale\": \"en\"\n  }\n}\n```\n\n## We're happy to have had a\
    \ flying visit from Mozilla's Christian Hellmann this issue, who brings you a\
    \ getting-started guide to Firefox OS development...\n\nFirefox OS is not just\
    \ any mobile operating system - It's completely powered by web technologies. Why\
    \ does that matter? Because the platform allows you to find its speed, consistency\
    \ and intuitive use ever before. Since it is built on the web, you can get any\
    \ length of app downloads and do things that traditional mobile operating systems\
    \ simply can't.\n\nFor developers, though the advantages are even greater. Since\
    \ Firefox OS is built on an open platform, using a Linux kernel to boot into web\
    \ environment, developing and customizing user experiences has never been easier.\
    \ Since it uses the Mozilla Gecko engine, Firefox OS-powered smartphone is exposed\
    \ to Mozilla's web APIs. This means every feature you imagine can be developed\
    \ as a web application. Interested? Here's how to get started today...\n\nThe\
    \ offline definitions are needed in case the app can also be made to run on iOS\
    \ and Android. If you are using HTML5 apps in firefox-OS, you're only two steps\
    \ away from joining us.\n\n1. Create an open app\n2. Register your app in the\
    \ Firefox OS Marketplace (https://marketplace.firefox.com);\n\nCreation of the\
    \ app is not bound to a specific IDE or work environment. As is the case in web\
    \ development, everything can be used, from vi the command line, right up to Eclipse:\
    \ you will feel most comfortable with it. So, far there, it is still defined by\
    \ SDK and you don't have to register or pay. Mozilla's fundamental identity is\
    \ to keep it free and accessible for everyone, and Firefox OS reflects this.\n\
    \nAs Mozilla does not need the server to vouch for its security, the app will\
    \ only be permitted to access a fraction of what is available.\n\n## Useful links\n\
    \n- **App Manifest**: An open-web manifest contains all the information your app\
    \ needs to interact with the OS: see tiny.ly/pfvyo88\n- **App Permissions**: An\
    \ overview of what an app is and how to request permissions: see tiny.ly/cpigiew\n\
    - **Firefox OS Developer Guide**: What a good HTML5 app looks like (with download\
    \ examples), how you can register and install your app on the Firefox OS: see\
    \ tiny.ly/olqyb8\n- **Firefox OS Simulator**: How to develop and test apps on\
    \ your own hardware: tiny.ly/3666\n- **Firefox Marketplace**: Where developers\
    \ can list and sell their apps: https://marketplace.firefox.com\n\n## Security\
    \ for apps\n\nIn open manifest, the developer defines what the app should be,\
    \ which functions the app has access to. Firefox OS security ensures that the\
    \ app has 'permission' to do. This is necessary to ensure, for example, that no\
    \ app can access messages or make calls without the end user knowing about it.\n\
    \n## Web APIs\n\nIn Firefox OS you can access the hardware via APIs: https://docs.mozilla.org/webapis.\
    \ For cross-platform HTML5 apps such as Android and iOS, developers can also access\
    \ various hardware components of the mobile phone via JavaScript. For example,\
    \ you can get the battery percentage with navigator.battery.level, or the phone\
    \ signal strength for one of the networks.\n\nA detailed list of everything that\
    \ is allowed and which services can be found here: https://docs.mozilla.org/dev/webapis\n\
    \n- **Mozilla Developer Network (MDN)**: where you can find everything ranging\
    \ from API documentation.\n- **Firefox-OS Boilerplate**: https://github.com/robynman/Firefox-OS-Boilerplate\
    \ that automatically adjusts to the screen and is equipped with all types of buttons\
    \ in the interface.\n- **Hosted app**: the app can be stored on your own server,\
    \ making it easy to amend and deploy.\n\n## Earn money with Firefox OS\n\nDevelopers\
    \ divide revenue in Firefox OS and should be rewarded for their efforts. The revenue\
    \ share varies depending on region, payment method, financial framework. Mozilla\
    \ supports payment method for developers such as those which makes it easier for\
    \ users to buy apps if they don't have credit. For developers it depends not only\
    \ on payment method but also on regulations. However, the objective is to ensure\
    \ that developers are paid for Marketplace purchases within 60 to 90 days.\n\n\
    ## First apps on\n\nThere are possibilities for testing the first version of these\
    \ works on the desktop, using Firefox OS Simulator. This can be started up easily\
    \ by visiting Tools: Web Developer Guide for Firefox OS. You can also test on\
    \ mobile phone with Firefox OS, a console displaying information and errors, and\
    \ the hard drive. You will get the best results by using Firefox in your browser.\
    \ In meantime, the Firefox OS smartphones have hit market, meaning developers\
    \ can now test their apps on the device.\n\n# Tutorial Go Program\n\nAn introduction\
    \ to the hottest programming languages of the moment. Find out if Go is right\
    \ for you.\n\nSean Tracey is a creative technologist at digital agency. He spends\
    \ a lot of his time inside code, Python and Android. Assigning variables in Go\
    \ is very straightforward and flexible.\n\n```go\n// Example 1\na := 1\nb := 2\n\
    \n// Example 2\nvar a, b int = 1, 2\n\n// Example 3\nvar a\n```\n\nIn 2007 Robert\
    \ Griesemer, Rob Pike and Ken Thompson started writing the language we've been\
    \ talking about today. Ken and Rob felt that over the years, C++ had become too\
    \ cumbersome to develop with and, instead of following the path laid before them\
    \ to fix these problems, they decided to start from scratch. What was different\
    \ is that Go was designed to be quick to write and quick to run and it is quite\
    \ fast. At least, Go will look very familiar to those who spent their days writing\
    \ programs in C language, but Go also has a few gotchas and new features that\
    \ we were looking to solve. In this article, we will be setting up a Linux system\
    \ (Ubuntu 22.04 LTS) and exploring the I/O standard library, variable declaration,\
    \ structs, slices and some other bits that developers will find useful in their\
    \ coding adventures.\n\nGetting constants is much stricter, for obvious reasons\n\
    \n```go\n// Constants can only be set like this\nconst x = 12\n```\n\nFunction\
    \ definitions are very user-friendly in design and implementation\n\n```go\n//\
    \ Example 4\nfunc example(x int)\n\n// Shorthand\nfunc example(x int)\n```\n\n\
    ## Installing Go\n\nIf you're lucky, you might be able to install Go with one\
    \ command of the following:\n\n```bash\nsudo apt-get install go\n```\n\nIf all\
    \ goes well, now you will have Go on your system. Hurrah! But, for the sake of\
    \ let's assume that's not what happens. Let's get and install from source so we\
    \ can see how everything is done and not to override code. golang.com/go/downloads/\
    \ and grab 1.0.2.src.tar.gz (at the time of writing, this was the latest version\
    \ of Go). Extract the tar.gz to wherever you like and head into the src folder\
    \ that you'll find there.\n\nNotice how Go allows you to assign two variables\
    \ by returning two values\n\n```go\n// With return\nfunc timeout(x int, y int)\
    \ (int, int) {\n    return x, y * 2\n}\n\nfunc main() {\n    h, i := timeout(2,\
    \ 6)\n    fmt.Println(h, i) // h == 4, i == 12\n}\n\n// Alternative with named\
    \ variable return\nfunc timeout(a, b int) (x, y int) {\n    x = a * 2\n    y =\
    \ b * 2\n    return\n}\n```\n"
  mdcn: "\n\n# 特色 Firefox OS：开发者技巧与窍门\n\n顾问 Christian Heillmann 是 Mozilla 的首席宣讲师，专注于开放\
    \ Web 和 HTML5。他于 1997 年左右构建了自己的第一个网站，并在随后的几年里参与了许多国际网络项目。\n\n## 如何入门\n\nFirefox\
    \ OS 基于 HTML5，它不包含 Java、C# 或 Objective C。Firefox OS 允许开发者通过 HTML、CSS 和 JavaScript\
    \ 访问手机功能。移动端网站可以轻松转换为 Firefox 应用程序。你只需要使用 Cache、LocalStorage 或 IndexedDB 定义数据，并在\
    \ manifest（清单文件）中指定名称和访问权限即可。\n\n一个 manifest 示例所示（更多详情请参见 tinyurl.com/pfvoy8）：\n\
    \n```json\n{\n  \"name\": \"My App\",\n  \"description\": \"My elevator pitch\
    \ goes here\",\n  \"launch-path\": \"\",\n  \"icons\": [\n    \"/img/icon-128.png\"\
    \n  ],\n  \"developer\": {\n    \"name\": \"Your name or organization\",\n   \
    \ \"url\": \"http://your-homepage.here\",\n    \"default-locale\": \"en\"\n  }\n\
    }\n```\n\n## 本期我们荣幸邀请了 Mozilla 的 Christian Hellmann 来访访，他为大家带来了一份 Firefox OS 开发入门指南……\n\
    \nFirefox OS 不仅仅是一个普通的移动操作系统——它完全由 Web 技术驱动。这为什么重要？因为该平台让你感受到前所未有的速度、一致性和直观的使用体验。由于它是基于\
    \ Web 构建的，你可以下载任何长度的程序，并完成传统移动操作系统无法实现的事情。\n\n但对于开发者来说，优势更加巨大。由于 Firefox OS 构建在开放平台上，使用\
    \ Linux 内核启动到 Web 环境，开发和定制用户体验比以往任何时候都要简单。由于它使用了 Mozilla Gecko 引擎，搭载 Firefox OS\
    \ 的智能手机可以调用 Mozilla 的 Web APIs。这意味着你想象的每个功能都可以作为 Web 应用进行开发。感兴趣吗？以下是今天开始的方法……\n\
    \n离线定义是为了防应用也可以在 iOS 和 Android 上运行。如果你在 firefox-OS 中使用 HTML5 应用，你离加入我们只有两步：\n\n\
    1. 创建一个开放应用\n2. 在 Firefox OS 市场 (https://marketplace.firefox.com) 注册你的应用\n\n应用程序的创建不受限于特定的\
    \ IDE 或工作环境。就像 Web 开发一样，任何工具都可以使用，从命令行的 vi 到 Eclipse：你会在最喜欢的工具上感到舒适。所以，到目前为止，它仍由\
    \ SDK 定义，你不需要注册或付费。Mozilla 的核心身份是让所有人都能免费且易用地使用，Firefox OS 正体现了这一理念。\n\n由于 Mozilla\
    \ 不需要服务器来保证其安全性，应用仅被允许访问可用功能的一部分。\n\n## 有用链接\n\n- **应用清单 (App Manifest)**：开放 Web\
    \ 清单包含你的应用与操作系统交互所需的所有信息：参见 tiny.ly/pfvyo88\n- **应用权限 (App Permissions)**：关于应用是什么以及如何请求权限的概述：参见\
    \ tiny.ly/cpigiew\n- **Firefox OS 开发者指南 (Firefox OS Developer Guide)**：一个良好的 HTML5\
    \ 应用应该是什么样的（带下载示例），你如何在 Firefox OS 上注册并安装你的应用：参见 tiny.ly/olqyb8\n- **Firefox OS\
    \ 模拟器 (Firefox OS Simulator)**：如何在你自己的硬件上开发和测试应用：tiny.ly/3666\n- **Firefox 市场\
    \ (Firefox Marketplace)**：开发者可以在此列出并销售他们的应用：https://marketplace.firefox.com\n\n\
    ## 应用安全\n\n在开放 manifest 中，开发者定义了应用应该是什么，以及应用拥有访问哪些函数的权限。Firefox OS 的安全性确保应用有“权限”执行某些操作。这是为了确保，例如，没有应用可以在终端用户不知情的情况下访问信息或拨打电话。\n\
    \n## Web APIs\n\n在 Firefox OS 中，你可以通过 APIs 访问硬件：https://docs.mozilla.org/webapis。对于\
    \ Android 和 iOS 等跨平台 HTML5 应用，开发者也可以通过 JavaScript 访问手机的各种硬件组件。例如，你可以通过 `navigator.battery.level`\
    \ 获取电量百分比，或获取某个网络的信号强度。\n\n允许的操作以及服务的详细列表可见此处：https://docs.mozilla.org/dev/webapis\n\
    \n- **Mozilla 开发者网络 (MDN)**：你可以在这里找到从 API 文档的所有内容。\n- **Firefox-OS 模板 (Firefox-OS\
    \ Boilerplate)**：https://github.com/robynman/Firefox-OS-Boilerplate，它可以自动适应屏幕，并配备了界面中所有类型的按钮。\n\
    - **托管应用 (Hosted app)**：应用可以存储在你自己的服务器上，便于修改和部署。\n\n## 通过 Firefox OS 赚钱\n\n开发者在\
    \ Firefox OS 中分成收入，他们的努力应该得到回报。收入分成取决于地区、支付方式和财务框架。Mozilla 支持开发者的支付方式，例如那些能让没有信用卡的用户更容易购买应用的支付方式。对于开发者来说，这不仅取决于支付方式，还取决于法规。然而，目标是确保开发者能在\
    \ 60 到 90 天内获得市场购买的报酬。\n\n## 首次运行应用\n\n可以使用 Firefox OS 模拟器在桌面上测试这些作品的第一版本。通过访问\
    \ Tools: Web Developer Guide for Firefox OS 即可轻松启动。你也可以在带有 Firefox OS 的手机上进行测试，手机上有一个显示信息和错误的控制台以及硬盘。在浏览器中使用\
    \ Firefox 将获得最佳结果。与此同时，Firefox OS 手机已经上市，这意味着开发者现在可以测试他们的应用了。\n\n# Go 程序教程\n\n\
    介绍这种最热门的编程语言。在 Go 中，你可以通过返回两个值来赋值两个变量。\n\n```go\n// 带返回方式\nfunc timeout(x int,\
    \ y int) (int, int) {\n    return x, y * 2\n}\n\nfunc main() {\n    h, i := timeout(2,\
    \ 6)\n    fmt.Println(h, i) // h == 4, i == 12\n}\n\n// 另一种命名变量返回方式\nfunc timeout(a,\
    \ b int) (x, y int) {\n    x = a * 2\n    y = b * 2\n    return\n}\n```\n\n2007\
    \ 年 Robert Griesemer、Rob Pike 和 Ken Thompson 开始编写这种语言。他们觉得 C++ 变得太复杂，因此决定从零开始。Go\
