    +   - Restoring Android

    Restore Android to your device once you''re finally restoring Ubuntu. In our


    installation steps we mentioned to note down your build - it is important to have
    the exact build to your phone if you want to restore it correctly. From the Google
    developer page, download the image directory in a folder. Now reboot to the bootloader
