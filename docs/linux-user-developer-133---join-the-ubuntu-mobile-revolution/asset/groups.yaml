    ## 欢迎

    欢迎阅读《Linux User & Developer》第133 期


    **Rob Zwets** 在大学学习航空航天工程，使用 Python 进行复杂的仿真建模。Rob 是让《Linux User & Developer》运转的核心齿轮。通过教程和评测，我们希望读者能从我们
    10 页的独家专中学到 Ubuntu 的知识。


    - 从互联网进行 SSH

    - 为手机安装 Ubuntu

    -构建你自己的软件包

    - 从网页控制你的树莓派


    **Joey Barnard** 是一位真正的全才，他他花时间制作家具、帮助研究人员解决科学计算问题以及编写 Android 应用。Joey 还会从受限制的电脑进行
    SSH。


    欢迎阅读最新一期《Linux User》，这是英国和美国最喜爱的 Linux 杂志。


    **Sean Tracy** 是一家数字机构的创意技术人员。他领导 Linux Node、Python 和 Arduino 的开发。


    众所周知，Ubuntu 在过去几年取得了成功。Canonical 的 Mark Shuttleworth 最近做出的一系列特定设计决策导致了此。


    **Michael Reed** 是一位技术作家，从事 Linux 相关工作已 15 年。他精通 Debian 等许多领域。


    让 Canonical 失败意味着上了一个月，因为现实本质上归结为“隐私侵犯”。


    **James L** 在 Linux 领域工作了 18 年，从他 13 岁时创立那所独立大学以来。


    Canonical 的失败及其在隐私问题上的乏力正在逐渐衰减，我们希望在 2014 年 4 月左右发布的下一个长期支持（LTS）版本中看到满意的解决。


    **Gareth Halifax** 是我们的记者，从第 10 页开始报道来自整个开源社区的最新动态。


    你不能责怪 Canonical 通过其产品和服务获取收入；很难想象从 Canonical 目前的立场来看是否可能达成平衡。


    在长 10 页的文章中，我们与产品经理 Richard Collins 进行了访谈，展示了其实现并测试了第一个稳定版本，该版本随 Ubuntu 13.10
    发布。


