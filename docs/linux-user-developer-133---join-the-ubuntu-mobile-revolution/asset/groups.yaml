    # 常见问题：使用 VirtualBox 使用虚拟机


    ![](img/4c82285250803e975d41cda3a51d081f_85_0.png)


    **Q：如何在 VirtualBox 中设置虚拟机？**

    答：在主界面上点击“新建 (New)”，打开设置虚拟机的窗口。为它起任何您喜欢的名称，并选择 Linux 作为类型。内存条将设置为一个建议值，但如果您觉得可以，可以更改它——将内存增加到
    128MB；如果您想使用磁盘而不是虚拟文件，请挂载磁盘镜像，然后点击“启动 (Start)”。


    虚拟机启动后，点击“设置 (Settings)”。在“显示 (Display)”下，启用 3D 加速并将内存增加到 128MB；如果您想使用磁盘而不是虚拟文件，请挂载磁盘镜像，然后点击“启动
    (Start)”。


    **Q：我应该使用 32 位还是 64 位的？**

    答：32 位镜像通常运行良好。如果您需要 64 位系统或类似的内容，您将需要安装它。


    **Q：我可以在虚拟机上进行双启动吗？**

    答：可以，只要您的虚拟硬盘有足够的空间或在虚拟机中有其他空间。您不需要进行任何操作来让 GRUB 对虚拟驱动器进行双启动，就像它在普通硬盘上那样——就像它安装时的那样。


