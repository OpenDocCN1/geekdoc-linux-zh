- md: "\n# Tutorial\n\n# Control your Raspberry Pi robot from the web\nLinuxDeveloper\n\
    \n![](img/4c82285250803e975d41cda3a51d081f_53_0.png)\n\n![](img/4c82285250803e975d41cda3a51d081f_53_1.png)\n\
    \n# Control your Raspberry Pi robot from a web-connected device\n\n# Advisor\n\
    \n**Linus Fraser** is a programmer and systems administrator, is the creator of\
    \ the RaspberryTutorials YouTube series and volunteers as a Linux administrator\
    \ for the Raspberry Pi Foundation.\n\nLast issue we built a Raspberry Pi robot.\
    \ This issue, we'll create a Python web application that lets you control your\
    \ bot using a first-person view.\n\nAfter building our Pi last issue, we've been\
    \ thinking up ideas for tutorials to extend Jonny Pi's skills and abilities. One\
    \ of the ideas we had was to control our robot from a web-browser. To make things\
    \ even more interesting, we decided to incorporate the Raspberry Pi Camera Module\
    \ so we can show a first-person perspective of what Jonny Pi can see. As long\
    \ as you're within Wi-Fi range of your robot, you can drive around simply by watching\
    \ the feedback from the app itself.\n\nTo this, we'll teach you how to use the\
    \ gst-streamer software to stream video straight from Raspberry Pi to your browser.\
    \ Now that we have in place, we'll be converting the motion code from the previous\
    \ issue's guide so it can be executed from our little web application, and then\
    \ we'll write said in Python. It's as easy as Pi!\n\n# Resources\n\n- A Raspberry\
    \ Pi robot (see LUD 132 for instructions)\n- A Raspberry Pi Camera Module Wi-connectivity\n\
    \n## Control Raspberry Pi robot from web using a first-person view\n\nCreate a\
    \ python app to control your robot with mayGI.\n\n# TUTORIAL\n\n## 01 Connect\
    \ the camera\n\nThe camera should be connected to the Raspberry Pi with the blue\
    \ side back of the Ethernet port, and the side with the pins facing the SD card.\
    \ Lift the connector, then slide the ribbon in as far as it will go, and push\
    \ down the connector to secure it.\n\n## 02 Enable the camera\n\nLog into the\
    \ Raspberry system with your username and password raspberry. You may have a version\
    \ that doesn't support the Raspberry Pi. Run apt-get update to make sure you are\
    \ up to date. Once you are, run raspi-config and select the option to enable the\
    \ camera. You need to reboot for the changes to take.\n\n## 03 Install mpeg-streamer\n\
    \nWe're going to use an experimental version of mpeg-streamer that has not been\
    \ packaged for the Raspberry Pi. So, we'll need to compile it from the index with\
    \ Subversion. Run apt-get update, and we'll need to download the source code.\
    \ All of the dependencies are required by mpeg-streamer. You can install them\
    \ with:\n\n```\nsudo apt-get install libjpeg8-dev cmake\n```\n\n## 04 Compile\
    \ mpeg-streamer\n\nas below:\n\n```bash\ngit clone https://github.com/linuxamaser/mpeg-streamer\n\
    cd mpeg-streamer/src\nexperimental\nmake\nsudo make install\n```\n\n```bash\n\
    export STREAM_PATH=/home/pi/mpeg-streamer/mpeg-streamer-experimental\nexport LD_LIBRARY_PATH=$STREAM_PATH:$LD_LIBRARY_PATH\n\
    $STREAM_PATH/streamer -i \"input-raspiprc -d 200\" -o \"output-x26ink\"\n```\n\
    \n```bash\nexit 0\n```\n\n![](img/4c82285250803e975d41cda3a51d081f_54_0.png)\n\
    \n## 05 Start testing\n\nBefore we can run mpeg-streamer, we need to export the\
    \ directory path so the loader can find various modules. We export this as STREAM_PATH\
    \ so we have a nice name, but the path is not in the LD_LIBRARY_PATH for the modules.\
    \ We found it by variables like:\n\n```bash\nexport STREAM_PATH=/home/pi/mpeg-streamer/mpeg-streamer-experimental\n\
    export LD_LIBRARY_PATH=$STREAM_PATH:$LD_LIBRARY_PATH\n```\n\nAnd now start mpeg-streamer\
    \ in the following way:\n\n```bash\n$STREAM_PATH/streamer -i \"input-raspiprc\
    \ -d 200\" -o \"output-x26ink -w $number=1 /\"\n```\n\n... where $number is the\
    \ number of clients. You can now see the video by going to the ip address (http://<ip-address>:8080/test)\n\
    \n## 06 Start mpeg-at boot\n\nBy making a copy of rc.local to /etc/rc.local we\
    \ then edit /etc/rc.local to add our command script, adding a space before an\
    \ ampersand to the end of the last line, make sure that exit 0 is still at end.\
    \ Reboot the Pi to make sure it works. Your rc.local file should look like this:\n\
    \n## Step 06\n\n## 07 Install Apache and modules\n\nWe're going to use Apache\
    \ as our web server, WSGI as our method of exporting Python from the web server,\
    \ and to call functions to the others and run the web server as access to the\
    \ GPIO. mpeg-streamer is actually running as root, which can be easily fixed by\
    \ making it user interface. Alternatively, you could make to install the packages\
    \ using:\n\n```bash\nsudo apt-get install apache2 apache2-mod-wsgi\n```\n\nWe\
    \ also need to set up proxy server to connect to our module later. We edit /etc/apache2/mods-available/proxy.conf\
    \ and enable it. We then need to start the proxy script:\n\n```bash\nsudo /etc/init.d/mpeg-streamer-start\n\
    ```\n\n## 08 Configure WSGI\n\nWe want to use WSGI to control our robot. Our export\
    \ script will call the command sudo user robotweb with password of choice. We\
    \ edit /etc/apache2/sites-available/00-default to enable WSGI. Adding the following\
    \ lines in VirtualHost section will fail just before:\n\n```\nWSGIProcess robotweb\
    \ group=robotweb multiprocess=1 threads=2\n```\n\n## 09 WSGI Hello World\n\nUse\
    \ WSGI to control our robot. Open /home/robotweb/app.py in your favorite editor\
    \ and add the code to the top. WSGI starts at work by calling the function of\
    \ the file you give it, passing through the camera stream each time we wanted\
    \ to command the robot.\n\n![](img/4c82285250803e975d41cda3a51d081f_54_1.png)\n\
    \n![](img/4c82285250803e975d41cda3a51d081f_54_2.png)\n\n```python\ndef application(environ,\
    \ start_response):\n    status = '200 OK'\n    output = 'Hello World!'\n    response_headers\
    \ = [('Content-type', 'text/plain'),\n                        ('Content-Length',\
    \ str(len(output))]\n    start_response(status, response_headers)\n    return\
    \ []\n```\n\n## Step 09\n\n```bash\nwget 'http://maxcdn.github.io/jquery.form.js'\n\
    ```\n\n```bash\nwget 'http://ajax.googleapis.com/ajax/libs/jquery/1.7/jquery.js'\n\
    ```\n\n## 11 Start the movement server on boot\n\nAs we discussed with strap,\
    \ we want to start our movement server on boot by adding it to /etc/local. Once\
    \ we used the following line:\n\n```bash\n/home/robotweb/movement_server.py\n\
    ```\n\n## 12\n\nBootstrap requires using Twitter's Bootstrap framework for our\
    \ web interface. This directory is located at /var/www/ so we can start to root\
    \ by removing the default Apache page and then download and extract the bootstrap\
    \ files:\n\n```bash\nwget 'https://github.com/bootstrap/bootstrap/download/v3.0.0/bootstrap-3.zip'\n\
    ```\n\n```bash\nunzip bootstrap-3.zip\nmv dist . /\nrm -rf bootstrap-3.zip\n```\n\
    \n## 13 Create the movement code\n\nThe next piece of code is based on the movement\
    \ and ultrasonic sensor from our last robot project. However, there's quite a\
    \ difference in the movement sensor (the ultrasonic part), so we are adding it\
    \ to the code properly. We've rewritten movement.py (find it on the disk). You\
    \ will also need to make the file executable with chmod +x We want to change the\
    \ speed of the robot using Pyro class.\n\nThe movement class needs to inherit\
    \ the Pyro Object so that it can be called remotely. We need to integrate the\
    \ base class from part of the movement class function. From that there is a normal\
    \ method. For each direction, we use the GPIO port to either HIGH or LOW on the\
    \ appropriate pins for the amount of time to move, and then call the function,\
    \ which moves the motor speed.\n\nFinally, we set up a Pyro server by registering\
    \ with the PyroServer and starting a request loop, which simply waits for requests\
    \ from a Pyro client and executes the appropriate function.\n\n## 14\n\nThe body\
    \ has a container, that displays our world, and a form that allows us to send\
    \ a direction and a period of time to head in for to our robot. The web page works\
    \ when the button is clicked, the value of the seconds text box is sent to the\
    \ action script, as well as the direction of the button that was clicked.\n\n\
    Note that the IP of the Pi is hardcoded because we need to access the stream on\
    \ port 8000. You can use a DNS address or reverse proxy the video stream through\
    \ port using Apache.\n\n## 15 Calling the movement code on our web app\n\nOur\
    \ application is really simple. It just takes a direction to move and in an amount\
    \ of time to do it for. Edit the code page to replace the Hello World code we\
    \ created\n\n## 16 It takes a direction to move in and an amount of time to do\
    \ it for\n"
  mdcn: "\n\n# 教程\n\n# 通过网页控制树莓派机器人\nLinuxDeveloper\n\n![](img/4c82285250803e975d41cda3a51d081f_53_0.png)\n\
    \n![](img/4c82285250803e975d41cda3a51d081f_53_1.png)\n\n# 从连接网络的设备控制树莓派机器人\n\n\
    # 顾问\n\n**Linus Fraser** 是一位程序员和系统管理员，RaspberryTutorials YouTube 系列的创建者，并担任树莓派基金会的\
    \ Linux 管理员志愿者。\n\n在上一期节目中，我们制作了一个树莓派机器人。在本期节目中，我们将创建一个 Python Web 应用程序，让你能够通过第一称视角控制你的机器人。\n\
    \n在上一期构建了我们的树莓派后，我们一直在思考各种教程，以扩展 Jonny Pi 的技能和能力。我们的主意之一是从网页浏览器控制机器人。为了让它变得更有趣，我们决定整合树莓派摄像头模块，这样我们就可以展示\
    \ Jonny Pi 所看到的第一人称视角。只要你处于机器人的 Wi-Fi 范围内，就可以通过观察应用本身的反馈来到处行驶。\n\n为此，我们将教你如何使用\
    \ `gst-streamer` 软件将视频直接从树莓派流到你的浏览器。现在我们已经就绪，并将转换上一期指南中的运动代码，以便它可以从我们的小型 Web 应用中执行，然后用\
    \ Python 编写它。这就像树莓派一样简单！\n\n# 资源\n\n- 一个树莓派机器人（请参 LUD 132 指南）\n- 树莓派摄像头模块及 WiFi\
    \ 连接\n\n## 使用第一人称视角通过网页控制树莓派机器人\n\n创建一个使用 mayGI 控制机器人的 Python 应用。\n\n# 教程\n\n\
    ## 01 连接摄像头\n\n摄像头应连接到树莓派，以太网口的蓝色一侧朝后，带有引脚的一侧朝向 SD 卡。抬起连接器，将排线尽可能推到底，然后按下连接器以固定它。\n\
    \n## 02 启用摄像头\n\n使用你的用户名和密码 `raspberry` 登录树莓派系统。你使用的版本可能不支持树莓派。运行 `apt-get update`\
    \ 以确保你是最新版本。一旦完成，运行 `raspi-config` 并选择启用摄像头的选项。你需要重启以使更改生效。\n\n## 03 安装 mpeg-streamer\n\
    \n我们将使用一个尚未为树莓派打包的 `mpeg-streamer` 实验版本。因此，我们需要通过 Subversion 从索引中编译它。运行 `apt-get\
    \ update`，然后我们需要下载源代码。`mpeg-streamer` 需要所有的依赖项。你可以通过以下命令安装它们：\n\n```\nsudo apt-get\
    \ install libjpeg8-dev cmake\n```\n\n## 04 编译 mpeg-streamer\n\n如下所示：\n\n```bash\n\
    git clone https://github.com/linuxamaser/mpeg-streamer\ncd mpeg-streamer/src\n\
    experimental\nmake\nsudo make install\n```\n\n```bash\nexport STREAM_PATH=/home/pi/mpeg-streamer/mpeg-streamer-experimental\n\
    export LD_LIBRARY_PATH=$STREAM_PATH:$LD_LIBRARY_PATH\n$STREAM_PATH/streamer -i\
    \ \"input-raspiprc -d 200\" -o \"output-x26ink\"\n```\n\n```bash\nexit 0\n```\n\
    \n![](img/4c82285250803e975d41cda3a51d081f_54_0.png)\n\n## 05 开始测试\n\n在我们运行 `mpeg-streamer`\
    \ 之前，我们需要导出路径以便加载器可以找到模块。我们将导出为 `STREAM_PATH` 以获得一个友好的名字，但路径不在 `LD_LIBRARY_PATH`\
    \ 模块中。我们通过以下变量找到它：\n\n```bash\nexport STREAM_PATH=/home/pi/mpeg-streamer/mpeg-streamer-experimental\n\
    export LD_LIBRARY_PATH=$STREAM_PATH:$LD_LIBRARY_PATH\n```\n\n现在通过以下方式启动 `mpeg-streamer`：\n\
    \n```bash\n$STREAM_PATH/streamer -i \"input-raspiprc -d 200\" -o \"output-x26ink\"\
    \ -w $number=1 /\n```\n\n... `$number` 是客户端的数量。你现在可以通过 IP 地址 (http://<ip-address>:8080/test)\
    \ 查看视频。\n\n## 06 启动时启动 mpeg-streamer\n\n通过将 `rc.local` 复制到 `/etc/rc.local`，然后编辑\
    \ `/etc/rc.local` 添加我们的脚本，在最后一行之前添加 `exit 0`。重启树莓派以确保其工作。你的 `rc.local` 文件应该像这样：\n\
    \n## 步骤 06\n\n## 07 安装 Apache 和模块\n\n我们将使用 Apache 作为我们的 Web 服务器，WSGI 作为从 Web 服务器导出\
    \ Python 并调用函数的方法以访问 GPIO。`mpeg-streamer` 实际上是以 root 身份运行的，可以通过界面轻松修复。或者，你可以安装包：\n\
    \n```bash\nsudo apt-get install apache2 apache2-mod-wsgi\n```\n\n我们还需要设置代理服务器来连接我们的模块。编辑\
    \ `/etc/apache2/mods-available/proxy.conf` 并启用它。然后我们需要启动代理脚本：\n\n```bash\nsudo\
    \ /etc/init.d/mpeg-streamer-start\n```\n\n## 08 配置 WSGI\n\n我们想使用 WSGI 控制我们的机器人。我们的导出脚本将以\
    \ `robotweb` 调用命令。编辑 `/etc/apache2/sites-available/00-default` 以启用 WSGI。在 `VirtualHost`\
    \ 节中添加以下行：\n\n```\nWSGIProcess robotweb group=robotweb multiprocess=1 threads=2\n\
    ```\n\n## 09 WSGI Hello World\n\n使用 WSGI 控制我们的机器人。在你喜欢的编辑器中打开 `/home/robotweb/app.py`\
    \ 并将代码添加到顶部。每当我们想要命令机器人时，通过传递摄像头流来启动 WSGI 工作。\n\n![](img/4c82285250803e975d41cda3a51d081f_54_1.png)\n\
    \n![](51cda3a51d81f_54_2.png)\n\n```python\ndef application(environ, start_response):\n\
    \    status = '200 OK'\n    output = 'Hello World!'\n    response_headers = [('Content-type',\
    \ 'text/plain'),\n                        ('Content-Length', str(len(output)))]\n\
    \    start_response(status, response_headers)\n    return []\n```\n\n## 步骤 09\n\
    \n```bash\nwget 'http://maxcdn.github.io/jquery.form.js'\n```\n\n```bash\nwget\
    \ 'http://ajax.googleapis.com/ajax/libs/jquery/1.7/jquery.js'\n```\n\n## 11 启动时启动运动服务器\n\
    \n正如我们讨论的那样，我们想通过将其添加到 `/etc/rc.local` 在启动时启动运动服务器。我们使用了以下行：\n\n```bash\n/home/robotweb/movement_server.py\n\
    ```\n\n## 12\n\nBootstrap 需要使用 Twitter 的 Bootstrap 框架作为我们的 Web 界面。该目录位于 `/var/www/`，我们可以通过删除默认\
    \ Apache 页面开始，然后下载并提取 bootstrap 文件：\n\n```bash\nwget 'https://github.com/bootstrap/bootstrap/download/v3.0.0/bootstrap-3.zip'\n\
    ```\n\n```bash\nunzip bootstrap-3.zip\nmv dist . /\nrm -rf bootstrap-3.zip\n```\n\
    \n## 13 创建运动代码\n\n下一个代码基于我们上一个机器人项目的运动和超声波传感器。然而，运动传感器（超声波部分）有很大不同，因此我们将其正确添加到代码中。我们重写了\
    \ `movement.py`（可以在磁盘上找到）。你还需要使用 `chmod +x` 使文件变为可执行。我们想使用 Pyro 类更改机器人的速度。\n\n\
    `movement` 类需要继承 `PyroObject` 以便可以远程调用。我们需要从 `movement` 类函数的部分集成基类。那里有一个普通方法。对于每个方向，我们使用\
    \ GPIO 端口在相应的引脚上输出高或低一段时间，然后调用移动电机速度的函数。\n\n最后，我们通过向 PyroServer 注册并启动请求循环来设置 Pyro\
    \ 服务器，它只需等待 Pyro 客户端的请求并执行相应的函数。\n\n## 14\n\n主体有一个容器，显示了我们的世界，以及一个表单，允许我们向机器人发送一个方向和持续的时间。当点击按钮时，网页即可工作，秒文本框的值会被发送到动作脚本，以及所点击按钮的方向。\n\
    \n注意树莓派的 IP 是硬编码的，因为我们需要在端口 8000 上访问流。你可以使用 DNS 地址或通过 Apache 端口反向代理视频流。\n\n##\
    \ 15 在我们的 Web 应用中调用运动代码\n\n我们的应用程序非常简单。它只需要接收一个方向和一个持续时间。编辑代码页面以替换我们创建的 Hello\
    \ World 代码。\n\n## 16 它接收一个移动的方向和一个持续的时间\n\n"
