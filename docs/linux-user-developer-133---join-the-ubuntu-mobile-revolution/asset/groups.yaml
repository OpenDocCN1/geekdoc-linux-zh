    如何创建两种最常见的 Linux 软件包


    教程


    ![](img/4c82285250803e975d41cda3a51d081f_36_0.png)


    ## 01 使用虚拟机


    VirtualBox 是为其他系统构建软件包的最佳方法。其一，它允许你维护一个相对干净的参考安装环境，这与他人运行的设置环境具有可比性。这意味着你可以通过使用不同的发行版来保留目标环境的选择范围。此外，虚拟化允许支持不同的架构，甚至可以在
    32 位平台上运行 64 位操作系统，尽管性能会受到影响。


