    由 Raspberry Pi 驱动的 FUZE 是 Jon Silvera 的结心之晶，其设计风格模仿了 20 世纪 80 年代的微控制器——特别是 Acorn
    BBC Micro，这直接导致了这个厚实金属部件的诞生。它为现代 Pi 提供动力，同时提供了对其大部分端口的访问：以太网、音频、HDMI、单个 USB 端口以及对
    SD 卡槽的访问——但仅将复合视频、DSI 和 CSI 接口进行了引出——这意味着想要使用这些功能的人需要自行对其进行修改。


    在重新组在顶部的 Raspberry Pi B 型两个 USB 端口之一上也连接有一个 GPIO 引出板。


    目前，Clementine 是听音乐和管理音乐的最佳应用程序。


    Banshee 是一个很好的标准媒体播放器，但适用于本地存储音乐。


    > 优点

    - 坚固的构建

    - 优秀的设计

    - 良好的 GPIO 扩展功能

    - 适合教育使用


    > 缺点

    - 价格昂贵，对于无法抵扣税的用户来说


    # 由 Raspberry Pi 驱动的 FUZE


    | 规格 |


    |  规格 |

    | 操作系统 | 定制版的 Raspbian |

    | 处理器 | Raspberry Pi B 型 |

    | 尺寸 | 330 x 240 mm (不含电源) |

    | 重量 | 163g (不含电源) |

    | 扩展 | 受保护的 GPIO 引出板，附带面包板 |

    | 键盘 | 集成 88 键式 |

    | 端口 | 3x USB、以太网、SD、电源、3.5mm 音输出、HDMI |

    | 附加 | 鼠标；手册；参考卡；带有跳线的红/绿 LED、七段码显示器、蜂鸣器、开关 |


    复合视频、DSI 和 CSI 接口未引出，因此无法使用。


    ## 考虑


    Arduino 实验者入门套装 (ARK)

    £31.20

    为了轻松验证 Raspberry Pi 的功能，FUZE 包含了可以通过 USB 连接到 Linux 的 Arduino 板——硬件功能、组件和电池。


    所有的经典命令——“10 Print”、“20 Go”运行良好，但 FUZE Basic 还有一个大杀器：对 GPIO 的访问。在 FUZE 内部使用沙箱环境允许用户读写
    GPIO 引脚。


    我们提供的文档将尽快发布，在评测时仅包含了四个项目。


    FUZE 的最大问题是价格：虽然 Pi 本身只需 30 英镑，但它通常以 80 英元的套装形式出售，包含了除显示器在内的所有配件。FUZE 意味着，如果不是教育用途，那是许多家长无法负担的溢价。通过
    129.99 英元的组合可以节省费用，或者仅机壳、电源和引出板的组合为 89.99 英元。然而，最便宜的选择是单独购买机壳。


    价格差异是因为 Pi 在威尔士生产，而 FUZE 是英国产品，因此源头更远。


    > Gareth Holmore


    # 总结


    对于无法抵扣税的用户来说，FUZE 非常昂贵，而且对于没有帮助的初学者来说仍然有些困难，但这种 FUZE 增强方案比裸机要合适得多。机壳结构坚固，软件和 GPIO
    引出板提供了必要的保护，价值 19.99 英镑——且可以抵扣税款。


    '
