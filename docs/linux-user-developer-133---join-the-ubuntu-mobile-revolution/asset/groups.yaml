    ## 新闻

    Linux 社区最新动态

    开源


    ## 待填空缺


    LinuxCon Europe 大会各处传传出的一个明确信息是 Linux 开发领域的职位数量。James 在主旨演讲中，几乎将技能短缺视为 Linux 社区面临的挑战，承认
    Linux 开发领域存在巨大的人才缺口。


    在未来几年里，Linux 将通过更多的培训计划和倡议得到增长。


    漫步在展会现场，显然许多企业能够招聘到开发者。虽然英国和其他国家也看到了增长，但很明显的是，开源软件的增长几乎已经停止，现在仅处于需求状态。Linux 基金会成员
    Herbst 讨论了开发将在未来几年成为最受青的技能。在演示期间，每个人都在招聘。


    ## 三星和英特尔将放对 Tizen 的控制


    正如我们上次报告的，内核虚拟机（JVM）的创始人和制作者 Avi Kivy 已加入一个开发团队来构建一个操作系统——一个全新的操作系统。在一个受赞助的活动中，内核和该项目的联合创始人
    Shasta 向欧洲开发者介绍了 Tizen，并解释了其原理：目前运行在 Android或其他 Linux 栈元素之上的云端典型应用程序，是一个运行着约百万行
    C++ 代码的操作系统，他们声称这比任何自定义 Linux 发行版都更简单、更快，且需要的管理更少。


    Linux 构建更适合运行应用程序。在最新将 API 作为内核使用后，他们发现需要为新系统添加分区以获得“呼吸”，Kivy 声称，“由于你”不支持 POSIX
    API，团队认为这不足以能够相对地迁移大部分功能。


    “少即是多”，该操作系统的项目模型在短时间内看起来可能比免费的 Tizen 更好！根据 Kivy 的说法，在虚拟环境中，一个带有更新栈的虚拟机更具适用性。如果运行良好，可以轻松切换活动；如果失败了，直接切换回去。这要灵活得多。


    该操作系统运行在 KVM 虚拟机管理器上，并带有 Xen 支持开发。在讨论性能后，一位参加会议的微软高管似乎对移植到他的 Hyper-V 虚拟开发非常感兴趣。


    Tizen 追求开放开发，而 Linux 在面对竞争时无疑是赢家。但移动端 Linux 受限于三星 LinuxCon Europe 之外，其微内核在活动内运行，并以三星为主机，这极大地推动了他们新的代码服务接口——而且，在对话中，他们正在与
    Apache CloudStack 使用的项目。其中，一个“新生”REST API 将用作网络功能开发的平台，这对于防火墙、网络负载均衡等非常有用，并作为灵活的虚拟交付，而不是传统的。


    连接到 ODP 为 OpenFlow 提供了接口和协议插件，使用了 NETCONF、UDP PCEP 和 SNMP。随着许多交换机变小，它是标准的一个版本，仍需观察社区理解
    ODP 如何与通用企业硬件特别是旧设备协同工作。关于这一点，White 提到，ODP 预计一些网络供应商提供自己的专有项目方向，这些项目使用 Linux 公源许可证。


    ## OSV，Linux 的新竞争对手？


    在虚拟化世界中，正如 Z 所说，“自由的人们”不再关乎 Linux 了。


    ## 开源

    你的 Linux 新闻和观点来源

    www.linuxuser.co.uk 直接发送邮件...

    获取最新新闻和观点请发送 linuxuser@imagine-publishing.co.uk


    - Linus Torvalds 登台

    基于 Steam 的拳击游戏机——Linux 桌面的风味？


    放宽对架构的控制，Tizen 正在转向新的开放治理模型。两家公司上个月都暗示了这一点，并确认从下一个 3.0 版本开始，该项目将通过开放精英制运行，并接受社区对核心代码的贡献。


    虽然 Tizen 项目由三星和英特尔创立，但由 Linux 基金会托管。新的治理模型旨在让该项目进一步远离 Android 的“源码可用”模型，后者由 Google
    管理方向并控制会议。


    > “我们无法创建一个完全开源的 Tizen，”项目架构负责人 Yoonsoo Kim 说，“我们正试图成为一个良好的公民。”


    Tizen 对更大开放性的尝试呼应了命运不幸的 Silicon Foundation，后者在试图创建一个有意义的开放社区时受阻；该项目新的治理模型坚持认为，“我们希望拥有不是来自三星或英特尔的人。”
    Maciera 还指出了手机平台的事实：Tizen 可以构建为在 HTML 中运行或作为原生全功能应用运行。然而，该项目声称 Tizen 在移动开发方面处于领先。


    尽管三星和英特尔对于何时推出首款 Tizen 设备这一话题保持沉默，Linus Torvalds 表示这取决于营销和产品开发。


