    \ 在座无虚席的市政厅进行演讲\n\n在关于“打造创客”以及基于用户体验（UX）设计的商业化应用日益增加的演讲中，当天的最突出的环节之一是“爱上产品”，强调了开源企业和项目关注用户的真实需求。在参加完会议后，他介绍了自己。在教学了几年书后，Atherton\
    \ 写了一部自传，解释了她最终如何理解了用户需求并转而从事 UX 咨询。\n\n> “做出更好东西的第一要任务是——与人们相处，”他说，强调了用户并不是同质的，人的需求像\
    \ A/B 测试一样多样。这一信息得到了专业框架的支持，以用于研究和从用户身上学习。\n\n## 物联网领域内有更多的商业项目机会\n\n## 并非一切都好\n\
    \n对于开源世界来说，专业化并非全好。在这一场会议中，当天的作者兼编辑 Adrian McEwen 警告说在物联网产品核心的围栏 ISP 网络（计算）之间创建平行设施是危险。他解释说，由于\
    \ Wi-Fi 连接对无线设备消耗了过多功率，ZigBee、蓝牙和 Z-Wave 等标准阻碍了开放 API，但实际上它们比这更好，因为连接到了云端的闭源系统。然而，他也警告说，为物联网创建一个单一标准的讨论是徒劳的：“这是解决实际问题（互操作性）。物联网涵盖了生活的许多领域——我们需要关注用现有解决方案来解决问题。”\n\
    \nOSHCamp 远不仅仅是参与者的政治和业务话题。在活动中，Shay Moradi 的演示取得了巨大的成功。他们的“数字胶带”方法专注于让事物运行并完善，竞争者被邀请回到《小妙物秀》参加多项挑战，还为\
    \ Channel 4 频道在伦敦塔字楼侧面展示了世界“最大的多人游戏”。\n\n## ROS\n\n米德尔塞克斯大学（Middlesex University）的技术教程\
