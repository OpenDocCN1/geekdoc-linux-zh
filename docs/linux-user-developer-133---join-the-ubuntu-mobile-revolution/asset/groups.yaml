    ## How system calls work


    System calls are the means by which user-space requests services from the kernel.
    Typically, these are performed within the system call and are not based on user
    mode at the lowest level for operations like memory allocation, opening, and closing
    file handles.


    rename2() system call is used to open a file on the file system. An application
    calls this to create multiple directory entries for the same physical inode, while
    the library function provides the instruction to insert into the kernel, mapping
    the entries accordingly. The result of the system call is managed by the C one-to-one
    mapping between user-space and kernel calls. For example, there is no ‘fork’ system
    call, but there are several system calls that implement the functionality. C library
