    # Feature PyConUK 2013


    # PyConUK 2013: putting education on track


    We went back to Coventry''s prestigious Technology Park for another Python community
    conference. This year education played an even more integral role in the proceedings...


    ![](img/4c82285250803e975d41cda3a51d081f_61_0.png)


    With Coventry University''s TechnologyCentre as a backdrop and some of the greatest
    minds in attendance, you''d be forgiven for assuming Python suffers the same stuffy,
    awkward atmosphere that haunts the halls of many of the world''s developer events.
    We could get very lyrical about PyConUK''s fantastic reputation as one of the
    best community-driven conferences in the country, but we won''t bore you with
    the details. Suffice it to say that we were met by one of the most welcoming and
    inclusive gatherings of like-minded geeks we encountered and highly recommend
    it to anyone with an interest in Python.


    Though organised by community volunteers, there''s nothing amateur about this
    annual event – with over 300 attendees to cater for, organiser John Pinner and
    his team always have a mammoth task on their hands. As you expect with sponsors
    PythonAnywhere, Bank of America, Bytemark, Riverbank Computing


    Larry Hastings, the release manager for Python 3.4, flew from the States to take
    part in PyConUK''s Raspberry Jam'
