    \ (ROS): www.willpage.com/pages/software/ros-platform\n| Ariel Balikan's tasks\
    \ for Prometheus: codename-prometheus.eu\n\nAdrian McEwen talks to a packed Hidden\
    \ Town Hall\n\nAmong presentations on 'Building a Maker' and the increasing commercial\
    \ use of WordPress, Location based User Experience (UX) design gave one of the\
    \ standout sessions of the day. 'Falling in Love with Your Products' highlighted\
    \ the very real need for open source businesses and projects to take care of after\
    \ users. After attends, he gave an account of himself. After she spent some of\
    \ her years teaching people, Atherton gave an autobiography to explain how she\
    \ eventually understood users' needs and ended up working in UX consulting, by\
    \ finding better opportunities.\n\n> \"The number one for making better stuff\
    \ - spend time with people [that use it], said, highlighting that users are not\
    \ homogeneous and people's needs are as varied as A/B testing. This message was\
    \ well backed up by a professional framework for studying and to learn from one's\
    \ users'.\n\n# “There are more commercial project opportunities within the IoT\
    \ space”\n\n# Not all good\n\nThe de-specialization isn't all good for the open\
    \ source world. In this session, Adrian McEwen, author and editor of the day,\
    \ warned of the danger of creating parallels between the gated ISP networks (Compute\
    \ and Aqua) at the heart of IoT offerings. He explained how, with Wi-Fi connectivity\
