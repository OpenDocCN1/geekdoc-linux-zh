    ## 自由软件往往获胜


    Rory MacDonald 从 LinuxCon 这一最大的 Linux 和开源盛会现场进行报道


    在 LinuxCon，Linux 基金主席 Jim Zelin 必须找到 Linux 成功的统计数据；Citrix 的 Mark Hinkle 跟在 Zelin
    之后上台开玩笑道：“这到底有多少种方式可以获胜？”


    在过去的两年里，75% 的新企业部署使用了 Linux；Zemlin 指出：“当云和虚拟化，”他在中心进行了审计。提到操作系统的挑战，“自由软件往往获胜。”


    来自 Linux 世界还有许多关于虚拟化的新闻。


    “那是核心，”Red Hat 的 Chris Wright 在开始 ODP 研讨会介绍了该项目。


    SDN 轻松地在物理网络和虚拟网络之间提供了一层软件抽象，使虚拟服务器的网络设备具有类似的灵活性和效率优势。重要的是，SDN 还允许网络随着应用程序在不同的物理端口之间移动移动。


    - Jonathan Corbet 获得年度内核开发者小组席位


    该项目直接绑定 OpenStack 的 Neutron 网络即服务


