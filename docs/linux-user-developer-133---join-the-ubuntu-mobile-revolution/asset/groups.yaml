    虽然 Edge 在 Indiegogo 众筹活动打破了若干众筹记录，但遗憾的是它注定失败。在设备上投入了大量精力，这是否影响了 Android 的开发？


    > “如果成功了，我们将能够直接走向生产化。它将让我们以与 Android 并行的方式运行。我们从未考虑过将 Edge OS 作为主设备进行测试。我们会并行进行。”


    Edge 本本会加速我们目前的开发：


    看到一个工程良好的平台，这正是 13.10 版本为他们提供的服务。


    为了让制造商能够在任何硬件上运行，Touch 能够部署在任何 Android 设备上。Android 设备的性能范围差异巨大，那么操作系统是如何处理这些的呢？


    “该操作系统是完全可扩展的，”Collins 回道，“如果你想触达任何手机，那么我们的建议是基于这些对设备的转换，这意味着内置的硬件要求，例如足够的内存、CPU
    性能，确保你有 HDMI 等。因此 Ubuntu 的基础目标是高标准的，从根本上是围绕这种转换设备、到操作系统的转换构建的。这意味着硬件制造商必须承担某些要求才能构建操作系统。


    但我们不需要在任何操作系统适配中关注特定类型的硬件。操作系统是完全自适应的，并且包含了表格。我们不需要将操作系统模块化——将操作系统未被移除的部分模块化无所谓，它是完全自适应的。”


    Ubuntu 拥有强大的社区方法，虽然让硬件开发者加入很重要，但社区已经在尝试创建或开发应用程序了。这些应用程序的简短列表可以在 Touch wiki 上找到，但这不是创建应用的唯一方法。我们希望在内部拥有自己的市场形式。


    “是的，有一个应用商店来构建它，但我们希望人们构建应用程序，开发者可以轻松地直接发布到他们的参考硬件上，”告诉他们，“我们管理其他内容，如标准镜像中应用程序的多样性。这个特定的版本并没有显示我们拥有的全部内容。但尽管如此，就目前而言，重要的是开发者在现在和未来可以变得非常积极，利用它来开发自己的应用程序。”


