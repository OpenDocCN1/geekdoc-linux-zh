    ## JON MASTERS


    ## 内核专栏


    Jon Masters 总结了内核社区的最新动态，此时 Linux 3.12 最终版本的准备工作已接近完成。


    Jon Masters 是一位 Linux 黑客，从事 Linux 工作已超过 18 年。他曾参加过 Linux+ 等会议，居住在马萨诸塞州剑桥市，并在一家大型企业工作。他维护着
    Linux 内核邮件列表摘要。


    在 GCC 中使用 ''asm goto'' 语句（内联汇编代码中的跳转）时出现 bug。该实际问题是在等待合并到 3.12 的代码合并窗口中检测到的（在
    3.12 发布后），但由于并不显而易见问题并非容易修复，一个快速修复程序已合并到 3.12。


    这包含了新增内容以及“白色条目（whites）”。后期的文件条目的创建是为了指令联合文件系统隐藏用户已删除的旧条目。`rename` 调用允许创建一个白色条目，然后将其原子化地交换到黑色条目的位置，从而有效地替换旧链接，以及以前无法实现的其他操作。


    Linux Ubuntu 3.12 Release Candidate (RC) 6 从 3.12-at 飞往俄勒冈州波特兰机场，在 PDX 表示飞往 Linux
    峰会，而且这又是一个使用内联 Wi-Fi 的 RC 版本。所以它就在这里……Pixed，PDX Wi-Fi 已用于展示日益增长内核工作。


    ## 跨目录重命名


    Miklos Szires 在给 Linux 内核邮件列表 (LKML) 的邮件中引入了一个新的补丁系列。RFC 增加了对名为 `rename(2)` 的新调的支持，它类似于原始的
    `rename`。使用内联标志，可以实现 `rename(2)` 系统调用，除了重命名文件外，还能跨目录原子更改目录条目。


    多年来，Stephen Ritzwell 一直维护着 ''linux-next'' 内核（源代码补丁集合），这是来自许多不同来源的个人开发者线程的组合。事实上，他是唯一要求其正在使用的预览内核在-linux-next
    分支中占有一个位置的人。


    随着 Linux 准备在爱丁堡举行 2013 内核峰会，许多开发者和研究人员正在等待补丁。预计 3.12 不会有太大的惊喜。好消息是，上一个 RC 版本的情况要好一点。


    3.12-RC6 包含了一个针对此处未修改编译器的后期变通方法。


