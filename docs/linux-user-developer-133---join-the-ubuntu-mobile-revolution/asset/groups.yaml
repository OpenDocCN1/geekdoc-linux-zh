    ## 观点

    内核专栏 – Jon Masters


    ## 开源


    ## “rename2() 系统调用存在是为了让联合文件系统的工作更轻松


    代表 Stephen，处理那些难以对付的合并冲突、修复补丁以及为开发拉入新树。他也与 Matt 一工作了几天。如果内核社区的成员都在那里（偶尔像发生过的那样），我们可以有这种连续性，这是很好的。允许在不求助于调试器的情况下进行极早的调试。在那些
    UEFI 的系统上，内核将在调用 I/O 设备（如系统端口）之前使用 EFI 提供的接口支持虚拟机。Metcalf 发布了许多补丁，实现了 Tier 架构的虚拟化支持。也许最有趣的是虚拟机的实现提供了底层虚拟化程序在所有基于系统的系统中可能的接口。换句话说，rename2
    系统调用直接运行在基础内核上，但底层有 UEFI 抽象。James Bottomley 代表 Linux Plumbers 领导委员会（Linux Plumbers
    Steering Committee）发布了下一个 Plumbers 计划。我们最喜欢的地点是德国杜塞尔多夫，与 6 月的欧洲 Linux 大（LinuxCon
    Europe）同期，我们愿意邀请参加11 月的北美 Linux 大（LinuxCon North America）。大量的 UEFI 代码可以进入内核，特别是为了统一我们现在（64
    位 x86 和 ARM）之间的代码并减少重复。其他补丁包括来自 Linux 的运行时服务（Runtime Services），它消除了潜在重入问题（从内核的不同部分同时调用两次
    UEFI —— 这是不支持的）。Matt 还在 EFI 代码中合并了对‘earlyprint’的支持。


    ## 持续开发


    ## 系统调用是如何工作的


    系统调用是用户空间请求内核服务的手段。通常，这些是在系统调用内部执行的，对于内存分配、打开和关闭文件句柄等操作，在底层并非基于用户模式。


    `rename2()` 系统调用用于在文件系统上打开文件。应用程序调用此来为同一个物理 inode 创建多个目录条目，而库函数提供了插入到内核的指令，并相应地映射这些条目。系统调用的结果由
    C 在用户空间与内核调用之间的一一映射管理。例如，没有‘fork’系统调用，但有几个系统调用实现了该功能。实现该功能的 C 库函数也不在实际的底层代码中。最后
    Kevin 又过一个月，Kevin Apa 发布了一个针对 x86 代码入口的补丁，该补丁通过 GRUB 或其他引导程序加载 Linux 内核镜像并执行内核入口。这是使用
    Android 手机上的内核完成的。作为回应，这可能是一个新的 Linux 里程，在扭曲的，交换。为了理智起见，希望这不要变成常态！


    ## Ubuntu Touch 触感体验吗？


    手机版 Ubuntu 现在已经稳定，所以我们去体验一下，并与 Canonical 的 Ubuntu 移动产品经理 Richard Collins 聊天


    Ubuntu 13.10 的发布标志着几点——例如对核心操作系统进行的一些微更新，以及面向下一个长期支持（LTS）版本的功能。最重要的是，这意味着 Ubuntu
    在手机上的第一个稳定版本。从发布至今还未一年，虽然还有一些工作要做，且没有专用的硬件，但看到操作系统发展到这种程度真是令人惊叹。


    在发布前几天，我们在伦敦的 Canonical 总部与 Richard Collins 讨论了最新版本以及 Ubuntu 手机的未来。Collins 是 Ubuntu
    移动产品经理，在此公告之前一直在密切工作其其他方面。显而易见，该操作系统仍有大量工作要做——这也意味着在为设备创建生态系统方面。我们将向你展示如何开始为手机操作系统开发应用，以及你如何部署它们。


    ## 特稿


    介绍手机版 Ubuntu 是如何开展的，以及未来将如何


    ## 展望


    手机版 Ubuntu 是如何开展的，以及未来将如何，正如 Richard Collins 所述


    “我们有几个重点，”Collins 开始说道。他手里拿着 Nexus 4，这是一个稍旧的 Ubuntu Touch 构建版本。在过去的几个月里，操作系统的开发压力很大，他详细说明了一些变化。


    “在引入我们的 mir（一个窗口管理器）方面，我们发生了巨大的转变。这是一项重要的工程工作，使系统能够高效运行。”


    “这将在整体性能、电池寿命和资源生命周期模型方面带来收益。我们有了后台服务的运行，这意味着多任务处理运行得非常高效。”


    “并不是让智能手机以所需的方式运行都是绝对必需的，因此努力一直集中在完美优化该系统上。这对硬件制造商来说非常重要，因为他们希望看到进展和基准测试，这让他们能够开始认真考虑迈向硬件生产的下一步。”


    让合作伙伴对操作系统感兴趣将是团队工作的一部分，当然，尽管目前还没有其他途径。


    “我们一直在仔细倾听，并与潜在的硬件和运营商合作伙伴进行交流，并将这些反馈到我们的系统设计工作中，通常是为了确保——作为一个操作系统——它已经准备好投入。系统能力、基础设施，正如我所说的，优化元素已经存在并可用，这为我们开发一系列服务提供了基础。因为系统现在可以支持这些服务。”



