    ## News

    The latest in the Linux community

    OPEN SOURCE


    ## Vacancies to fill


    One clear message from all corners of LinuxCon Europe was the number of jobs in
    Linux development. James seemed like almost the skill shortage as a challenge
    for the Linux community during his keynote, acknowledging there''s a huge talent
    gap going for Linux development.


    In the next few years, Linux will grow out and more through training programs
    and initiatives.


    Wandering around the conference, it was clear that many corporates were able to
    recruit developers. While the UK and other countries also saw a growth, it was
    clear that open source software has nearly stopped growing. It is only in demand.
    Linux Foundation board member and Herbst discussed development to be the most
    in-demand skill over the next years. Everyone was recruiting during the presentations.


    ## Samsung and Intel to relax their grip on Tizen


    As we reported last, Avi Kivy, founder and maker of the kernel machine (JVM),
