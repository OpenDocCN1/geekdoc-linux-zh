    if you want to make the most of and access all the features of your phone. We''ve
    rounded up some of the important bits you should know before setting up your device.


    +   - Updates

    Touch is continually updated, you will need to keep your phone or other device
    up to date with the latest Ubuntu and its packages. As well as reflashing the
    device, which will be quite a bit often. Swipe over the Apps submenu to expand
    it, and select it from the list. It will automatically detect what you want to
    install so you can do it manually. This also uses the space available on the device,
    like the disk utility apps and the Ubuntu Store.


    +   - Using ADB to transfer files

    ADB Debug is a simple but versatile command-line tool that allows you to communicate
    with any Android device. Ubuntu touches this to back up your phone, then install
    any apps you want. It can also be used to transfer files between a computer and
    your device using the push and pull commands.


    ```

    $ adb push [file] to [send]

    # restore:

    $ adb pull [file] to [location] to sent it

    ```


    If you are connected to the network, you can also use SSH.


