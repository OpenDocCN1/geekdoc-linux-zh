  - '[PAGE 15]


    # OpenSource


    Your source of Linux news and views

    www.linuxuser.co.uk Email directly...


    A RepRap-3D printer warms up for the workshops


    ![](img/4c82285250803e975d41cda3a51d081f_15_0.png)


    EVENT


    # Earning a living from the IoT


    The UK''s grass-roots open source hardware community make careers from hobbyists


    Once a year, the cosy Yorkshire mill Hebden Bridge is invaded by robots. Rooms
    fill up with RepRap 3D printers, PCs, Arduinos and the odd Raspberry Pi, all tweaked
    and tweaked with the most amazing feats. ''OSHCamp'', by the Open Source Hardware
    User Group (OSHUG), is becoming an annual pilgrimage for the UK maker community.
    The most notable change at this year''s event (located within the Wuthering Byes
    Festival) was a stronger focus on business, of OSHUG''s contributors, which was
    representative of a big change in the world of open source hardware: hacking up
    and put on a suit and tie?


    great that more people are now getting to earn a living out of doing what they
    love,"replied Tanner.


    # Active house


    Tanner and his colleagues have been working on the development of a new ''active
    house'' for a London architect. The project is using open hardware sensors, actuators
    and Arduino controllers as well as a Raspberry Pi to minimize energy requirements.
    It will make more effective use of natural sunlight, thermal shutters and lighting.


    > "The house, entering its first trial phase, will intelligently interact with
    its inhabitants, both autonomously and using judges where appropriate," Tanner
    told us. "We are using room-based modules and some specially designed systems,
    and we intend that the system will be low-cost, with hardware and software being
    open-sourced."


    ![](img/4c82285250803e975d41cda3a51d081f_15_1.png)


    The most intelligent house in North London – out by Paul Tanner and his team


    16 www.linuxuser.co.uk'
