    # ACCESSING WORDPRESS VIA THE BROWSER


    The final steps we need to do in this is to access WordPress from our browser.
    To do this, enter your ip address (http://myipaddress) into the browser. You should
    see a screen like the one on the following page.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_106_0.png)


    Complete the requested information for the site and then click on the ‘Install
    WordPress’ button. This will confirm the install and create the tables inside
    of the database automatically for you.


    To continue hit the ‘Login’ button at the bottom of the page.


    Now you have a working WordPress system up and running on your CentOS server.


    # CHAPTER 14


    # FINAL REMARKS


    Congratulations! In just under 85 pages we have established some CentOS 7 basics
    and used that information to build a basic webserver.


    There is much more to learn of course, but this is just the beginning. This guide
    should have you comfortable with navigating and installing packages on CentOS
    7 as you move forward in experimentation and learning. Hopefully now using the
    command line interface is a little less scary.


    If you have any questions for further learning, do not hesitate to email me at
    info@nathanemail.com.


    Thank you and good luck as you continue learning!

