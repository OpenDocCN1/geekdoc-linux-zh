    # CHAPTER 4

    ## 60 SECOND DOCUMENTATION BOOTCAMP


    In technology we live and die by the documentation that we produce. Imagine having
    a problem with a client''s system and not knowing what it is running and what
    the IPs or password is. That is a common problem. It is typically not safe to
    store passwords anywhere, but you must come up with a method of securely storing
    this information. When you deal with large numbers of IPs and passwords, it is
    impossible to remember them all. Below is a helpful documentation guide to help
    get you started. Since this is for learning CentOS and not production, writing
    the password down is probably ok. If you are reading this digitally, then create
    a sheet of your own to place this information.


    ### Example Data


    | Field | Value |

    | :--- | :--- |

    | Server Name | CentOS |

    | Operating System | CentOS 7 |

    | Supported Till | 2024 |

    | Root Password | ******** |

    | IP Address | 000.000.000.000 |

    | Primary Purpose | Webserver |

    | Date Installed | 6/20/2016 |

    | Last Date Updated | 6/20/2016 |


    ### My Documentation


    **Server Name:** ______________________


    **Operating System:** CentOS 7


    **Supported Till:** 2024


    **Root Password:** ______________________


    **IP Address:** _________________________


    **Primary Purpose:** Webserver


    **Date Installed:** ______________________


    **Last Date Updated:** ______________________


    # CHAPTER 5

    ## GETTING TO THE CLI


    CLI stands for command line interface, where you can interact with the system
    by entering lines of text. This is how we interact with our server.


    If you decided not to use the recommended method of setting up a VPS, then you
    can see the CLI on your computer''s display. When you boot your computer, it will
    bring you to the CLI, where you can login.


    We can connect to the CentOS server using a protocol SSH. SSH stands for Secure
    Shell, which is an encrypted way that we can remote login to your server.


    For the next steps, refer to the information that we documented in the last chapter
    as part of our documentation boot camp. We will need the IP Address and login
    information. An IP Address is a string of numbers that identifies a computer on
    a network. For our VPS, your IP Address is a public one, which can be accessed
    from anywhere with an internet connection. For a Virtual Machine, use the CLI
    interface that is displayed when you boot.


    The program I recommend to SSH into your VPS server is called PuTTY. PuTTY is
    a free SSH client that is open source and supported on Windows. You can download
    it from the following link:


    http://putty.org


    The file you download is an executable (.exe) that does not require an install.
    Once you download it, you can drag it onto your desktop for quick access.


    Connecting to your VPS or Virtual Machine with this tool is very easy. Under Host
    Name or IP address, put the IP address that was provided. Select SSH as the connection
    type and then click open. See figure 1 for an example of what it should look like.


    **Note:** Your IP Address will be different than the one in the figure.


    Figure 1: Putty Configuration


    ![](img/373347a8cccfab65b3dc27644fdd6a60_40_0.png)


    When you hit connect, you may get a message like the one in Figure 2. Click Yes.


    ## Figure 2: PuTTY Security Alert


    ![](img/373347a8cccfab65b3dc27644fdd6a60_41_0.png)


    # LOGGING IN FOR THE FIRST TIME


    Now you will be prompted in for the first time. Enter the username root, then
    the password that was provided or set by you when setting up your VPS.


    If you use DigitalOcean, their system requires a password reset the first time
    you log in. You will need to reenter the provided password and then the new one
    you wish to set twice. Make sure you follow secure password guidelines and set
    a secure password for the root user.


    Note: Throughout this book, I use tables to explain the different commands that
    we are going to learn. The first row is the task that we want to do, the second
    is the command we need to use, and the third is an example of what your CLI will
    look like. I think this is the best way to depict and explain the commands we
    are going to learn.


    If you were not prompted to change your password, but want to, you can enter the
    command, `passwd`. See the table on the next page for more details.


    | Change My Password |

    | :--- |

    | Command | passwd |

    | Result | System will prompt for new password |

    | CLI Display | [root@centos:~]# passwd\nChanging password for user root:\nNew
    password:\nRetype new password:\np: password updated successfully |


    When it prompts you for the new password, enter it and do not be concerned that
    the password does not appear on the screen. Once you have finished, press enter
    and type it one more time.


    # NAVIGATION


    Do not be intimidated by the white text and black background on the CLI. I know
    that there is no mouse or graphics, but after a short while, you will be comfortable
    navigating through the directories on your server. Directory is like a folder
    that you may have used on a Windows or Mac device. As a person who has used this
    for a long time, I actually prefer this to having a graphical user interface.
    Before we do anything else, let''s learn to explore the server. By using the `pwd`
    command, we can see the location of the directory that we are currently viewing.


    ## Find Your Current Directory Location


    | Command | Result |

    | :--- | :--- |

    | pwd | System will output the directory that you are in. |

    | CLI Display | [root@centos:~]# pwd /root |


    Right now we are in a directory named root, which is essentially the home directory
    of the user root. **There is a big difference between this root home directory
    and the actual root of the system.**


    The path / is the root of the system, but right now we are in a subdirectory that
    is named root (/).


    **The root** of the server is the top directory. Everything is a subdirectory
    inside of it. From our current location, there are two ways we can go. Let''s
    start with the easiest command that will always get us root.


    ## Go To The Root Directory (/)


    | Command | Result |

    | :--- | :--- |

    | cd / | We change to the main directory |

    | CLI Display | [root@centos:~]# cd / [root@centos:/]# |


    Now let''s use, `pwd` again to see where we are at.


    ## Find Your Current Directory Location


    | Command | Result |

    | :--- | :--- |

    | pwd | System will output the directory that you are in. |

    | CLI Display | [root@centos:~]# pwd |


    If you want to see what is in the folder, we can use the `ls` command.


    | List Files |

    | :--- | :--- |

    | Command | ls |

    | Result | Lists the files in the current directory |

    | CLI Display | [root@centos:/]# ls\ndev home media opt root sbin sys tmp var
    |


    We can also go into more detail by adding a flag. A flag is typed at the prompt
    after our command and adds additional parameters to the system we want.


    Try running this command: `ls -la`


    In this example, -la is the flag. The l tells the system we want more details
    and a lists all the files, even the hidden ones.


    Now, let''s change to the directory named home.


    | Change Directory |

    | :--- | :--- |

    | Command | cd home |

    | Result | System moves us to child folder home |

    | CLI Display | [root@centos:/]# cd home\n[root@centos:home]# |


    **Note:** It is important to understand the difference between parent and child
    directories. If we have a directory called documents and another inside of it
    called pictures, Pictures would be a child directory of documents. In this instance
    we were in the parent directory / and changed to the child directory /home. If
    you were not in the parent folder, we could still navigate to home, but after
    cd, you would have to list the full path (example: cd /home instead). If you get
    an error such as, "No such file or directory", you may need to enter the full
    path, since you may not be in the right parent directory.


    If we want to go back to the root directory we can use another change directory
    command, which makes going up a directory very easy.


    | Move Up A Directory Level |

    | :--- | :--- |

    | Command | cd .. |

    | Result | System moves us to the parent folder |

    | CLI Display | [root@centos:home]# cd ..\n[root@centos:/]# |


    Using cd along with the directory names and .. can allow us to quickly move throughout
    our server.

