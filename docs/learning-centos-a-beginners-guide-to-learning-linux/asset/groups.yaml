    # CHAPTER 2


    # INSTALLING CENTOS ON A VPS


    In this section of the book, we will cover the installation method of using a
    Virtual Private Server.


    VPS is a virtual machine sold as a service by an internet hosting service. It
    runs its OS and customers are provided super user access to the operating system.
    This allows users to install and manage almost anything they wish for their operating
    system.


    A few other advantages to a VPS is that you can access it from anywhere. It is
    hosted in the cloud and if you want to use CentOS to host a website, it provides
    a great way to start without needing your own high tier of internet bandwidth
    and appropriate hardware. Personally, this is what I use for my websites. It is
    cheaper than buying the internet connection for a fast web experience and hardware
    to run a robust server out of the house.


    In this section we will cover getting started with two VPS providers: Linode and
    DigitalOcean. Each has their own pricing and service offerings, but both are easy
    to start with.


    When you are choosing a VPS there are several things to consider. Since you are
    getting started and learning, price is likely to be a major part of your decision
    if you choose this method. On Linode, they offer a 1GB memory, 1CPU, 24GB storage,
    and 2 TB transfer server for $10 per month. DigitalOcean has a starter package
    with 512MB memory, 1 CPU, 20GB storage, and 1 TB transfer for $5 per month. The
    choice is up to you. DigitalOcean also has a $10 plan similar to the starting
    plan on Linode.


    # SETTING UP CENTOS ON LINODE


    To get started with a Virtual Private Server or VPS is very simple. All you need
    a credit card and this book! You can get your server live in just a few minutes.


    First you will need to go to: https://www.linode.com/


    From there you can sign up and select which plan you would like. For me making
    this guide with intentions to launch a small eCommerce site, I am going to start
    with the $10 plan.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_14_0.png)


    After you select the plan, you need to select the datacenter you wish to use.
    My recommendation is to choose one that is the closest to your location.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_14_1.png)


    I am located in Pennsylvania so Newark, NJ is the closest datacenter. I select
    that and then click ‘Add this Linode’.


    Once you do, you will now be brought to the Linode Manager. This is a location
    where you can manage all of your VPS systems, if you have multiple.


    | Linodes | NodeBalancers | Longview | DNS Manager | Account | Support |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | Linode | Status | Plan | IP | Location | - |

    | Linode1938051 | Being Created | Linode 1024 | 45.33.83.194 | Newark, NJ, USA
    | - |


    The image above may be hard to see, but here we can see the status of our Linode,
    the plan we are using, and your IP address. That number for the IP address is
    what we will use to connect to our server and eventually connect our domain to.
    It is very important so it might not be a bad idea to write it down.


    Right now, the server is empty with no operating system. We need to install it
    onto the OS we wish to use, which for this book is CentOS 7.


    Click on the name of your Linode. In this instance the name is linode1938051.
    Yours will appear similar to that.


    When you click on the name, you will notice that it looks rather empty. Again
    it is because we need to install the OS. VPS providers make this very easy. In
    Linode, we simply need to click the deploy link.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_15_0.png)


    Click on ‘Deploy an Image’.


    From this window, we can select the Image we want, which is CentOS 7. Leave the
    defaults for now in the deployment disk size and swap disk. Enter in what you
    would like the password to be for root (which will be discussed later) and make
    sure that it is a secure password. Once all of is done click on the ‘Deploy’ button.


    Linodes >> linode1938051 >> Deploy


    ![](img/373347a8cccfab65b3dc27644fdd6a60_15_1.png)


    Once you click ‘Deploy’ the system will start the installation. Give this a few
    moments to complete, but for your installation work is done! If you choose to
    use Linode, then you can skip the next section on the alternative, DigitalOcean.
    Please note that there are more providers than just these two, but these are my
    personal preference for beginners.


    # SETTING UP CENTOS ON DIGITAL OCEAN


    Like Linode, DigitalOcean offers a quick process to get started and deploy a CentOS
    installation. If you have decided to pay the small monthly fee for a VPS with
    any provider, I think you made the right decision. What I like about using a VPS
    is that it doesn''t use my machines hardware and I can work on it anywhere that
    I have an internet connection.


    Let''s go ahead and get our server setup with DigitalOcean in just a few minutes.

    First, go to https://www.digitalocean.com/ and click on ‘Sign Up’ in the top right.
    From there, enter an email address and password that you want to use for your
    account. Then click ‘Sign Up''.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_16_0.png)


    We need to confirm our email address. Open your email and find the email from
    DigitalOcean. It will be titled “DigitalOcean – Please confirm your email address.”
    Open the email and proceed to click on the verification link.


    Great, now that our email is confirmed, we need to select a payment option. DigitalOcean
    gives you the option of using a credit card or PayPal. For me, I use PayPal for
    convenience.


    If you use PayPal, you have to prepay $5, which is credited to your account. This
    will cover your first month!


    Once you have added your payment method, we can create our VPS, with DigitalOcean
    calls a Droplet. In the top right, click on the green ‘Create Droplet’ button.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_16_1.png)


    Next, it will ask you to select a distribution. We want to select CentOS and the
    most recent edition they offer, which is 7.2.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_17_0.png)


    Once you have selected CentOS, scroll down to select the size of server you want
    to deploy. They have the $20 per month plan selected as the default. Just click
    on the $5 per month plan, if that is the size you would like to use to get started.


    ## Choose a size


    | $5/mo | $10/mo | $20/mo |

    | :--- | :--- | :--- |

    | $0.007/hour | $0.015/hour | $0.030/hour |

    | 512 MB / 1 CPU | 1 GB / 1 CPU | 2 GB / 2 CPUs |

    | 20 GB SSD Disk | 30 GB SSD Disk | 40 GB SSD Disk |

    | 1000 GB Transfer | 2 TB Transfer | 3 TB Transfer |


    I recommend selecting a region from your location. Since I am in the USA on the
    east coast, New York is my pick for this.


    ## Choose a datacenter


    | New York | Amsterdam |

    | :--- | :--- |

    | 2 | 3 |


    With the additional options, it is up to you like a backup. If we were doing development
    or anything outside of training and testing, I would recommend selecting the backup
    option, but since we just want the basics for now, I am going to leave these unchecked.


    # Select additional options


    - Private Networking

    - Backups

    - IPv6

    - User Data


    From there, scroll down to the bottom and click the green ‘Create’ button.


    ## Finalize and create


    | How many Droplets? | Choose a hostname |

    | :--- | :--- |

    | 1 Droplet | droplet-sq2-01 |

    | Creating multiple Droplets with the same configuration | If you are creating
    multiple you will name them. Your Droplet name can only contain alphanumeric characters,
    dashes, and parens. |


    In a matter of a few seconds, your system is setup and ready. DigitalOcean will
    then email you the IP address, username, and password for your server. Keep this
    information handy. We will need the IP address and login information shortly.


    # CHAPTER 3

    INSTALLING CENTOS ONTO A VIRTUAL MACHINE


    If you do not wish to use a VPS yet and want to work locally with your testing,
    then the next best choice is to use a Virtual Environment. Many of them are on
    the market. I would recommend this for two reasons. It is less risky than installing
    on a machine you use and if you have a fairly decent computer, it doesn’t really
    cost anything to get started. Assuming that you are a beginner and just getting
    started, we will start from scratch and install the virtualization software first.
    Oracle’s VirtualBox, which is the program we will use for this tutorial, is open
    source and free.

    '
