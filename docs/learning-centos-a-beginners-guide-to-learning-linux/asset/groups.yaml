- md: "\n# INSTALLING Oracle VirtualBox\n\nIn this demo, I will be using a x64 Windows\
    \ 10 computer.\n\nTo install VirtualBox go to: https://www.virtualbox.org/wiki/Downloads\n\
    \nFrom there you select version best fits your system. For me using a Windows\
    \ 10 x64 machine, I am going to download VirtualBox 5.0.20 for Windows hosts.\n\
    \n![](img/373347a8cccfab65b3dc27644fdd6a60_22_0.png)\n\nWhen you click the link\
    \ to download and are prompted, click Save File. Once it is downloaded, click\
    \ the executable to start the installation.\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_22_1.png)\n\
    \nWhen prompted click ‘Next’.\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_22_2.png)\n\
    \nLeave the settings as the default and click ‘Next’ again.\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_23_0.png)\n\
    \nIf you want the shortcuts, which can be useful, leave the default settings and\
    \ click ‘Next’ once more. Now we are done clicking ‘Next’.\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_23_1.png)\n\
    \nThe following prompt, will alert you that installing the Oracle VirtualBox Networking\
    \ feature will reset your network connection and temporarily disconnect you from\
    \ the internet. This is ok and you can click ‘Yes’ to continue.\n\nOnce you have\
    \ clicked ‘Yes’, you will be at the final installation prompt as depicted below.\
    \ Click the default ‘Install’ button.\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_24_0.png)\n\
    \nNow we wait. It isn’t as long as the wait for winter come in the popular book\
    \ and television series Game of Thrones, but it will take a few moments.\n\nAs\
    \ the installer proceeds, you may need to click ‘Yes’ or ‘Install’ another time\
    \ or two. When it is completed you will see a completion screen. Click on ‘Finish’\
    \ and it will launch VirtualBox.\n\n# GETTING THE ISO\n\nTo either install CentOS\
    \ using VirtualBox or to set it up on your own, you will need to download the\
    \ operating systems file. An iso is the file extension used for files that can\
    \ be burned to a CD or DVD, depending on the size. Essentially it is an image\
    \ of the installation disc that you will need to install CentOS.\n\nFor us to\
    \ install CentOS on VirtualBox, we do not need to burn the ISO to a DVD and can\
    \ mount it inside of the virtual environment. If you are looking to install it\
    \ directly onto a machine or attempt a dual boot, then you will need to burn this\
    \ file.\n\nTo get the most recent ISO for CentOS, go to https://www.centos.org/\
    \ and click “Get CentOS”. I personally downloaded the Minimal ISO and recommend\
    \ that for you to get started using the system and the tutorials in this book.\n\
    \nThere are multiple locations or mirrors to download the iso from. Choose one\
    \ and download the CentOS 7 operating system ISO.\n\nOnce you download the iso\
    \ file, if you are not using VirtualBox, you will need to burn it to a disc. In\
    \ the past, I have used Ashampoo Burning Studio Free, with success.\n\nIf you\
    \ are going to use VirtualBox, then follow the steps to mount the ISO and setup\
    \ your virtual machine in the next section.\n\n# CONFIGURING AND INSTALLING CentOS\
    \ To Oracle VirtualBox\n\nNow that we have downloaded the ISO and have OracleVirtualBox\
    \ installed, we can set up our virtual environment. Launch VirtualBox and click\
    \ the “New” button that we can configure a virtual machine to run CentOS.\n\n\
    ![](img/373347a8cccfab65b3dc27644fdd6a60_28_0.png)\n\nOnce you click “New”, we\
    \ need to name the machine and provide some basic information. See the image below\
    \ as a guide. Remember that CentOS is based on the Red Environment.\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_28_1.png)\n\
    \nOnce that is completed, click “Next”. The software will recommend the amount\
    \ of memory to allocate to your virtual machine. I would personally allocate 1GB\
    \ or 1024MB at a minimum. When that is finalized, click next and then select “Create\
    \ a Virtual Hard Disk”. Click create to allocate the virtual hard disk to the\
    \ machine.\n\nAfterwards it will ask you for your preferred format. I personally\
    \ stick with the VDI format, which is the default. Once that is selected, the\
    \ next prompt asks if you would like a dynamic disk that only uses disk space\
    \ as is used by the virtual machine. A fixed disk will automatically use the full\
    \ space of the allocated disk on your machine. My preference is the dynamically\
    \ allocated option.\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_29_0.png)\n\n\
    Once you have completed the wizard, you will need to mount the ISO to the virtual\
    \ DVD drive. Basically this is the same as entering the installation media (DVD\
    \ in this case) into a physical machine. In VirtualBox click “Settings”, then\
    \ “Storage”, and then click “Add Optical Disk”.\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_29_1.png)\n\
    \nSelect the ISO file and click ok. Now back at the main menu click “Start”.\n\
    \n![](img/373347a8cccfab65b3dc27644fdd6a60_29_2.png)\n\nThe virtual machine will\
    \ begin to start.\n\n# CENTOS 7 INSTALLATION\n\nOnce the machine boots, you will\
    \ see the screen below.\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_30_0.png)\n\
    \nSelect Install CentOS 7 and press enter.\n\nIf your installation fails or appears\
    \ to hang, it is likely that your system does not support running 64bit software\
    \ virtually. I experienced that issue as I was testing this book on an older PC.\n\
    \nYou can download the 32bit i386 versions from this link: http://mirror.centos.org/altarch/7/isos/i386/\n\
    \nOnce the installer successfully loads, you will need to select your language\
    \ and location. Once you have done that click \"Continue.\",\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_30_1.png)\n\
    \nNext you will see CentOS preconfigure a variety of settings.\n\nYou may need\
    \ to configure the \"Installation Destination\" that is under the system heading.\
    \ Select \"Installation Destination\" and from that interface select the hard\
    \ disk and click done as seen below.\n\n## Device Selection\n\nSelect the device(s)\
    \ you'd like to:\n- Local Standard Disk\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_31_0.png)\n\
    \n- Specialized & Network Disks\nAdd a disk...\n\nOnce that is complete and you\
    \ are back at the main installation screen. Now we need to make sure that we can\
    \ establish an internet connection. Click on “Network and Hostname”. Inside of\
    \ this panel configure and make sure that “Automatically Connect When Network\
    \ is Available” is checked. Once that is completed, click save. In the hostname\
    \ box, enter the name for your server. I just called mine CentOS. When it is completed\
    \ turn the switch for the network adapter to on. It can be found right next to\
    \ the network adapter. In the top left, “Done”, which returns you to the home\
    \ screen where you can click “Begin Installation” in the bottom right.\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_31_1.png)\n\
    \nAs CentOS is installing there are two things that we can configure, the “Root\
    \ Password” and “User Creation”. For now lets use the user configuration what\
    \ it is and set the “Root Password”. Click on “Root Password”, enter the new password\
    \ twice and then click done. Be sure to remember this password as we will need\
    \ it later.\n\n| ROOT PASSWORD | USER CREATION |\n| :--- | :--- |\n| Root password\
    \ is not set | No user will be created |\n\nOnce the installation is completed,\
    \ you will need to click the “Reboot” button in the bottom right.\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_31_2.png)\n\
    \nNow dismount the ISO image (if you’t you keep going through the install process)\
    \ and shutdown the Virtual Machine.\n\nNow we need to do some additional configuration\
    \ to the Virtual Machine so that it can have internet access and you can view\
    \ the system from the browser later in the book.\n\nWith the Virtual Machine shutdown,\
    \ click on \"Settings\". In the settings panel, click Network on the left. You\
    \ will see that Adapter 1 is configured and attached to NAT. Let that setting\
    \ as it is. Click on Adapter 2 and then check the \"Enable Network Adapter\".\
    \ In the \"Attached to\" dropdown, select \"Host-only Adapter\" and then ok.\n\
    \nNow click Start and the boot is completed, you will see a line prompt to login.\n\
    \n```\nCentOS Linux 7 (AltArch)\nKernel 3.18.0-327.el7.i686 on i686\nlocalhost\
    \ login: \n```\n\nLet's login and find out your ip address so that we can continue\
    \ as if we had a VPS, at this point we do, but it is only available internally.\n\
    \n# Find Your IP Address\n\n| Command | Result |\n| :--- | :--- |\n| ip addr |\
    \ System will display network information |\n\nAfter typing in ip addr and pressing\
    \ enter, you will get a lot of information on the page. We are not concerned about\
    \ the information after 1 (loopback connection), or 2, but under 3, there is an\
    \ inet that may look similar to this: 192.168.1.50/24. Your ip address will be\
    \ 192.168.1.50. All networks are different, but use that as a general guide.\n\
    \nBe sure to write this IP down. Chances are it is dynamic and may change overtime.\
    \ If you think it might have changed be sure to reference back to the Find Your\
    \ IP Address box above.\n"
  mdcn: "\n\n# 安装 Oracle VirtualBox\n\n在本演示中，我将使用一台 x64 的 Windows 10 计算机。\n\n要安装 VirtualBox，请访问：https://www.virtualbox.org/wiki/Downloads\n\
    \n在页面中选择最适合你系统的版本。对于我来说，使用的是 Windows 10 x64 机器，我将下载适用于 Windows 主机的 VirtualBox\
    \ 5.0.20。\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_22_0.png)\n\n点击下载链接并在出现提示时，点击“保存文件”。下载完成后，点击可执行文件开始安装。\n\
    \n![](img/373347a8cccfab65b3dc27644fdd6a60_22_1.png)\n\n当出现提示时，点击“下一步”（Next）。\n\
    \n![](img/373347a8cccfab65b3dc27644fdd6a60_22_2.png)\n\n保持默认设置并再次点击“下一步”。\n\n\
    ![](img/373347a8cccfab65b3dc27644fdd6a60_23_0.png)\n\n如果你需要这些可能很有快捷方式，请保持默认设置并再次点击“下一步”。现在我们已经完成了所有“下一步”的操作。\n\
    \n![](img/373347a8cccfab65b3dc27644fdd6a60_23_1.png)\n\n接下来的提示将提醒你，安装 Oracle VirtualBox\
    \ 网络功能将重置你的网络连接并临时断开互联网连接。这是没问题的，你可以点击“是”（Yes）继续。\n\n一旦点击了“是”，你将看到如下所示的最终安装提示。点击默认的“安装”（Install）按钮。\n\
    \n![](img/373347a8cccfab65b3dc27644fdd6a60_24_0.png)\n\n现在我们开始等待。这不像热门书籍和电视剧《权力的游戏》中等待“冬天降临”那么漫长，但需要几分钟时间。\n\
    \n随着安装程序的进行，你可能需要再次点击一两次“是”或“安装”。完成后，你将看到完成屏幕。点击“完成”（Finish），它将启动 VirtualBox。\n\
    \n# 获取 ISO\n\n无论是在使用 VirtualBox 安装 CentOS 还是在自己的机器上设置它，你都需要下载操作系统文件。iso 是用于根据大小可以刻录到\
    \ CD 或 DVD 的文件扩展名。本质上，它是你安装 CentOS 所需的光盘镜像。\n\n为了在 VirtualBox 上安装 CentOS，我们不需要将\
    \ ISO 刻录到 DVD，而可以在虚拟环境中挂载它。如果你打算将其直接安装到机器上或尝试双系统，那么你需要刻录此文件。\n\n要获取最新的 CentOS\
    \ ISO，请访问 https://www.centos.org/ 并点击“Get CentOS”。我个人下载了最小版（Minimal ISO），建议你下载它开始使用该系统以及书中的教程。\n\
    \n有多个位置或镜像站可以下载 iso。选择一个并下载 CentOS 7 操作系统 ISO。\n\n一旦你下载了 iso 文件，如果你没有使用 VirtualBox，则需要将其刻录到光盘。过去我用过\
    \ Ashampoo Burning Studio Free，效果不错。\n\n如果你将使用 VirtualBox，请按照下一节中的步骤挂载 ISO 并设置你的虚拟机。\n\
    \n# 配置并将 CentOS 安装到 Oracle VirtualBox\n\n现在我们已经下载了 ISO 并安装了 OracleVirtualBox，我们可以设置虚拟环境了。启动\
    \ VirtualBox 并点击“新建”（New）按钮，我们可以配置一个运行 CentOS 的虚拟机。\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_28_0.png)\n\
    \n点击“新建”后，我们需要命名机器并提供一些基本信息。请参考下图作为指南。记住 CentOS 是基于红帽环境（Red Environment）的。\n\n\
    ![](img/373347a8cccfab65b3dc27644fdd6a60_28_1.png)\n\n完成后，点击“下一步”。软件将推荐为虚拟机分配的内存。我个人建议至少分配\
    \ 1GB 或 1024MB。确定后，点击下一步，然后选择“创建虚拟硬盘”（Create a Virtual Hard Disk）。点击创建为机器分配虚拟硬盘。\n\
    \n随后，它会询问你偏好的格式。我个人倾向于使用 VDI 格式，这是默认的格式。一旦选择了该格式，下一个提示会询问你是否想要一个动态磁盘（仅在虚拟机使用时占用磁盘空间）。固定磁盘将自动使用你机器上分配磁盘的全部空间。我的偏好是动态分配选项。\n\
    \n![](img/373347a8cccfab65b3dc27644fdd6a60_29_0.png)\n\n完成向导操作后，你需要将 ISO 挂载到虚拟\
    \ DVD 驱动器。基本上这等同于向物理机插入安装介质（在此情况下为 DVD）。在 VirtualBox 中点击“设置”（Settings），然后“存储”（Storage），最后点击“添加光驱”（Add\
    \ Optical Disk）。\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_29_1.png)\n\n选择 ISO\
    \ 文件并点击确定。现在回到主菜单，点击“启动”（Start）。\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_29_2.png)\n\
    \n虚拟机将开始启动。\n\n# CENTOS 7 安装\n\n一旦机器启动，你将看到下面的屏幕。\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_30_0.png)\n\
    \n选择 Install CentOS 7 并按回车键。\n\n如果安装失败或看起来像卡住了，可能是因为你的系统不支持在虚拟环境中运行 64 位软件。我在在一台旧\
    \ PC 上测试这本书时就遇到过这个问题。\n\n你可以从此链接下载 32 位 i386 版本：http://mirror.centos.org/altarch/7/isos/i386/\n\
    \n一旦安装程序成功加载，你需要选择你的语言和位置。完成后，点击“继续”（Continue.）。\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_30_1.png)\n\
    \n接下来你将看到 CentOS 正在预配置各种设置。\n\n你可能需要配置“系统”（system）标题下的“安装目标”（Installation Destination）。选择“安装目标”，并在界面界面选择硬盘并点击“完成”（done），如下所示。\n\
    \n## 设备选择\n\n选择你想要的设备：\n- 本地标准磁盘（Local Standard Disk）\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_31_0.png)\n\
    \n- 特殊和网络磁盘（Specialized & Network Disks）\n添加磁盘...（Add a disk...）\n\n完成后你回到主安装界面。现在我们需要确保可以建立互联网连接。点击“网络和主机”（Network\
    \ and Hostname）。在此面板中配置并确保勾选了“网络可用用时自动连接”（Automatically Connect When Network is\
    \ Available）。完成后，点击保存（save）。在主机框中，输入你的服务器名称。我给它命名为 CentOS。完成后，将网络适配器的开关打开。它就在网络适配器右侧。在左上角点击“完成”（Done），这将返回主屏幕，你可以在右下角点击“开始安装”（Begin\
    \ Installation）。\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_31_1.png)\n\n当 CentOS\
    \ 安装时，有两个项可以配置：“根密码”（Root Password）和“用户创建”（User Creation）。现在让我们保持默认的用户配置并设置“根密码”。点击“根密码”，输入两次新密码，然后点击完成。务必记住这个密码，因为我们稍后需要它。\n\
    \n| 根密码 (ROOT PASSWORD) | 用户创建 (USER CREATION) |\n| :--- | :--- |\n| 未设置根密码 |\
    \ 将不会创建用户 |\n\n安装完成后，你需要点击右下角的“重启”（Reboot）按钮。\n\n![](img/373347a8cccfab65b3dc27644fdd6a60_31_2.png)\n\
    \n现在卸载 ISO 镜像（如果你仍在进行安装过程）并关闭虚拟机。\n\n现在我们需要对虚拟机进行一些额外配置，以便它可以访问互联网，并在书中之后通过浏览器查看它。\n\
    \n在虚拟机关闭状态，点击“设置”（Settings）。在设置面板中，点击左侧的“网络”（Network）。你会看到适配器 1 已配置并连接到 NAT。保持该设置不变。点击适配器\
    \ 2，然后勾选“启用网络适配器”（Enable Network Adapter）。在“连接到”下拉菜单中，选择“仅主机适配器”（Host-only Adapter），然后点击确定。\n\
    \n现在点击“启动”，启动完成后，你将看到登录提示符。\n\n```\nCentOS Linux 7 (AltArch)\nKernel 3.18.0-327.el7.i686\
    \ on i686\nlocalhost login: \n```\n\n登录并查找你的 IP 地址，以便我们可以像拥有 VPS 一样继续，此时我们确实拥有，但仅内部可用。\n\
    \n# 查找你的 IP 地址\n\n| 命令 | 结果 |\n| :--- | :--- |\n| ip addr | 系统将显示网络信息 |\n\n输入\
    \ ip addr 并按回车后，页面上会显示大量信息。我们不关心 1（回环连接）或 2 之后，但在 3 下有一个 inet，看起来类似于这样：192.168.1.50/24。你的\
    \ IP 地址将是 192.168.1.50。所有网络都不同，但请将其作为通用指南。\n\n务必记下这个 IP。它可能是动态的，并随着时间的推移而变化。如果你认为它可能已经变化，请参考上面的“查找你的\
    \ IP 地址”框。\n\n"
