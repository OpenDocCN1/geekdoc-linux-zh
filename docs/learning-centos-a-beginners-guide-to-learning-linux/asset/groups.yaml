    On a Window’s Server there are a variety of permission types to allocate. See
    the figure below:


    ![](img/373347a8cccfab65b3dc27644fdd6a60_91_0.png)


    CentOS and other Linux systems have three basic permission groups and three basic
    permission types.'
  - '[PAGE 92]


    # PERMISSION GROUPS


    **Owner** – The owner permissions apply only to the owner of the file or directory.


    **Group** – The group permissions apply only to the group that has been assigned
    to the file or directory.


    **All Users** – The all user''s permissions apply to all users on the system.
    This is the permission group you will want to be the most careful of.


    # PERMISSION TYPES


    **Read** – The read permission refers to a user''s capability to read the contents
    of the file, but does not allow them to write or save changes.


    **Write** – The write permissions refer to a user''s capability to write or modify
    a file or directory.


    **Execute** – The execute permission affects a user''s capability to execute a
    file or view the contents of a directory.


    We can view the existing permissions and check them by using the CLI and our familiar
    ls command, with the -l flag.


    | Example to List Files with Details |

    | --- | --- |

    | Command | ls -l |

    | Result | Lists the files in the current directory with details |

    | CLI Display | [tidus@centos:~]$ ls -l\n-rw-rw-r-- 1 tidus tidus 196 Feb 13 20:48
    notes.txt |'
  - '[PAGE 93]


    Dissecting the output:

    -rw-rw-r— 1 tidus tidus 196 Feb 13 20:48 notes.txt


    The first section that is displayed, -rw-rw-r—, shows the permissions for the
    file.

    When we are viewing the permissions using the ls -l command, we can understand

    them by using the following key.


    # Understanding File Permissions


    | Read | r |

    |---|---|

    | Write | w |

    | Execute | x |


    As we view the permission for our notes.txt file, we can make a few observations
    based on

    the output: -rw-rw-r—.

    The first three characters —rw, tells us that the user has read and write permissions
    for

    the file notes.txt. The second set of characters shows us that the groupSolid,
    also has read

    and write permissions. The last, shows us all the users permissions. From looking
    at

    output, all users can read the file, but not write to it.


    # Using Binary References to Set Permissions


    Noe what we understand the basics of permission groups and permission types, setting

    permissions using binary references, should be fairly simple. It is important
    to

    when we set file permissions this way, it is done by three integers. An integer
    is a

    whole number (Example: 1, 2, and 4).


    To set permissions, we must determine the binary representation of the rwx string.
    RWX

    String is the binary representation that allows us to set read, write, and execute

    permissions.


    We must use the table below to calculate the permissions we want for a file or
    directory.


    | File Permissions: Binary Representation |

    |---|---|

    | Read | 4 |

    | Write | 2 |

    | Execute | 1 |'
  - '[PAGE 94]


    We get the permission number by adding the integers together. We must do this
    for each of the three permission groups.


    # For example:


    Read Access = 4


    Read and Write Access = 6


    Read, Write, and Execute Permission = 7


    Each permission group needs a number. The number we make for setting permissions
    will be 3 digits. Remember, the order is user, group, and all users.


    # Exercise 1: What does a permission of 777 mean?


    This means that the user, group, and all users have read, write, and execute access.
    Using 777 as a permission setting is not good for establishing strong security.


    # Exercise 2: What does a permission of 655 mean?


    This means that the user has permission to read and write. The group has permission
    to read and execute. All users can also read and execute.


    # Exercise 3: What does a permission of 444 mean?


    This means that both the user, group, and all users have only read access to a
    file.


    # Exercise 4: What does a permission of 755 mean?


    This means that the user has read, write, and execute permission. The group and
    all users can only read and execute. This is often the permission setting recommended
    for the web directory for those using WordPress.


    Before we go over the steps of applying permissions we should first learn how
    to transfer files. This process will open the door for applications in which we
    will learn to set permissions.


    # Overview: Ownership of Files and Directories


    In the next few pages in this book we will provide a few examples for tidus to
    change permissions of files and directories. When you are ready, let''s create
    sample files and directories. With the commands we learned earlier.


    Make a folder ''files'' in tidus''s home directory:


    ```

    mkdir /home/tidus/files

    ```


    Make a file named ''test.txt'' with nano:


    ```

    nano /home/tidus/files/test.txt

    ```


    Inside of nano, you may enter whatever you wish for this exercise.'
