    # CHAPTER 12


    # ADDING A DATABASE TO MARIADB


    In other books I have written about Linux, I had users use a web tool called phpmyadmin
    to add users and databases. In this book, I want to take a different approach
    and do this from the command line interface.


    As we progress into installing WordPress, it will need a database to store its
    information into. In these next steps, we will create database and a user to connect
    to that database.


    To begin, we must log to MariaDB''s root account using the following command:

    sudo mysql -u root -p


    As you have guessed, the u flag symbolizes user and p stands for password.


    You will be prompted to enter the root password for MariaDB. You would have set
    this when we run the command to secure the install.


    Once you are logged in, the next step is to create the database. We are going
    to name this database ''wordpress''.


    ```

    CREATE DATABASE wordpress;

    ```


    Please note that capitals do matter here as they do for other commands. Additionally
    MySQL and Maria statements must end with a semi-colon.


    That was easy! Now we need to create a new user account that will only be able
    to operate with the database we created. This allows for good security and better
    control of database permissions.


    For me, I am going to call the new user account ''wpuser''. In the command below,
    you can use a different name if you wish and change ''password'' to a secure password.
    We will need this password as we connect WordPress to the database.


    ```

    CREATE USER wpuser@localhost IDENTIFIED BY ''password'';

    ```


    Right now you have a database and user account, but the user account cannot access
    the wordpress database. We need to grant that user access to the wordpress database
    with the following command.


    ```

    GRANT ALL PRIVILEGES ON wordpress.* TO wpuser@localhost IDENTIFIED BY ''password'';

    ```


    Our user now has access to the database, but we need to do something flush that
    the privilege changes we made. Use the following command:


    ```

    FLUSH PRIVILEGES;

    ```


    Now that we have done these commands, we can exit MySQL/MariaDB by using the following
    command:


    exit


    Easy right? There is much more to learn using MySQL and MariaDB. I recommend you
    continue expanding your knowledge on these topics as they are a very in demand
    skillset.


    # CHAPTER 13


    # PREPARING FOR AND INSTALLING WORDPRESS


    There are a lot of different content management systems and platforms that you
    can install. Nearly 25% of all websites are online using WordPress as reported
    in 2015. This makes it one of the most widely used platforms. In addition to being
    very popular, there is a lot we can learn by installing this on our server for
    future reference as you roll out other systems. We already know how to make a
    database and user so now we need to know how to install a package like this.


    Before we install WordPress, there are a few packages you may need to install
    depending on your VPS or Virtual Machine install. Use the following to ensure
    that you have the proper configuration.


    The first thing we need to load is php-gd. This is needed for WordPress and other
    platforms to resize thumbnail images properly. We can install this with the following
    command:


    ```

    sudo yum install php-gd

    ```


    Be sure to enter your password and press y when prompted.


    So that Apache can see the new module, we will need to restart httpd.


    ```

    sudo service httpd restart

    ```


    Now there are a few more packages we need. The first is wget. Wget is a program
    that gathers content from webservers. It allows us to download files from the
    web to our server. To install wget, use the following command:


    ```

    sudo yum install wget

    ```


    Again, be sure to enter your password and press y when prompted.


    The next tool we will need to streamline the process is called rsync. Rsync is
    a utility that allows us to keep copies of files on the computer system and synchronize
    files to other folders. To install rsync, use the following command:


    ```

    sudo yum install rsync

    ```


    # DOWNLOADING WORDPRESS


    One of the reasons that I like WordPress for my tutorials is that it is easy to
    configure new users and the team at WordPress always keeps the most stable version
    of their software at the same link.


    Before we continue, make sure that you are in your home directory. Remember that
    you can get home at any time by entering `cd` into the CLI.


    Now that we are sure that we are in the home directory, we can use wget to get
    the most recent version of WordPress with the following command:


    ```

    wget http://wordpress.org/latest.tar.gz

    ```


    This downloads a compressed version of WordPress that we will now need to extract
    using the tar command. In Linux, tar stands for tape archive from the day when
    most system administrators would backup files to tape backup drives. For our purpose
    will allow us to gather the compressed files from the download and extract them
    to our home directory. We can do that with the following command:


    ```

    tar xvzf latest.tar.gz

    ```


    Inside of your home folder, you will now have a directory called wordpress. To
    finish the installation, we need to move the files to the Apache document root
    (/var/www/html). Using the handy rsync tool, this is very easy. Use the following
    command to sync the files over to the Apache directory.


    ```

    sudo rsync -avP ~/wordpress/ /var/www/html/

    ```


    Remember, capitalization is important. One small error in this command could cause
    an issue for you moving forward. After the command is run, rsync will do the work
    and copy all of the files into the /var/www/html directory.


    We still have one thing to do, we need to make an uploads folder for WordPress
    to store files. Using the mkdir command as we did earlier, makes this easy.


    ```

    sudo mkdir /var/www/html/wp-content/uploads

    ```


    # RECAP ON CHANGING OWNERSHIP AND PERMISSIONS AND EDITING FILES


    Now we have two steps to finish a proper configuration. We need to change the
    ownership permissions to the WordPress files and folders. This will increase security
    and allow WordPress to function as expected. To do this, we will use the chown
    command as earlier in the book.


    sudo chown -R apache:apache /var/www/html/*


    | Changing the Owner of Apache Web Directory |

    | :--- | :--- |

    | Command | sudo chown -R apache:apache /var/www/html/* |

    | Result | System will change ownership for the /var/www/html director and sub-directories
    |

    | CLI Display | [tidus@centos:~]$ sudo chown -R apache:apache /var/www/html/*\npassword
    for tidus:\n[tidus@centos:~]$ |


    Now our last step is the configuration the WordPress file that will connect us
    to the database we made. Make sure you remember the database name, user name,
    and password that we set.


    First, we need to change to the /var/www/html directory.


    | Changing Directory |

    | :--- | :--- |

    | Command | cd /var/www/html |

    | Result | System will move us into the html directory |

    | CLI Display | [tidus@centos:~]$ cd /var/www/html [tidus@centos: html]$ |


    WordPress uses a file called wp-config.php to connect to the database. In the
    install, a sample file is provided. We need to copy that file and configure it
    with our database settings.


    | Copy File |

    | :--- | :--- |

    | Command | sudo cp wp-config-sample.php wp-config.php |

    | Result | System will copy the file into a new one with the required name. |

    | CLI Display | [tidus@centos: html]$ sudo cp wp-config-sample.php wp-config.php
    [tidus@centos: html]$ |


    Now that we have a configuration file we can modify, we can edit it using nano.

    sudo nano wp-config.php


    The only modifications that we need to make inside of this file for our database
    connection is to the following fields: DB_NAME, DB_USER, DB_PASSWORD. This will
    allow the website to talk to the database. Look at the following page for the
    example of my configuration.


    **Note: You should not use password as a password and is only used in this book
    as a guide.**


    # WP-Config.php Configuration


    ```

    /** The name of the database for WordPress */

    define(''DB_NAME'', ''wordpress'');


    /** MySQL database username */

    define(''DB_USER'', ''wpuser'');


    /** MySQL database password */

    define(''DB_PASSWORD'', ''password'');

    ```


    Those are the only values that you should change inside of that file. When you
    are done, close and save the changes from nano.

