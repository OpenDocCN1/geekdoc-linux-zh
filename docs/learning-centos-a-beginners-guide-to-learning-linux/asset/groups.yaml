    \ root, it also prevents accidental errors that could result in disasters. It's\
    \ just good practice. What we will do in our next command is create a new user,\
    \ named tidus, and then we will provide him with sudo access.\n\nSudo before a\
    \ command, will allow our user, tidus, to be able to elevate to higher privileges\
    \ to install software and make changes. Sudo runs the command as a super user,\
    \ even though the tidus user would normally only have more limited access. This\
    \ will come together soon, when we dive into using it, but first we need to create\
    \ tidus’s account.\n\n| Add a New User |\n| :--- | :--- |\n| Command | adduser\
    \ tidus |\n| Result | System sets up user tidus |\n| CLI Display | [root@centos:/]#\
    \ adduser tidus\n[root@centos:/]# |\n\nOnce you run that command, the system will\
    \ add the user tidus. Next we need to set a password for this new user.\n\nEarlier,\
    \ we learned how to change our password. If you are root or a sudo user you can\
    \ change a user’s password as well by following the steps below.\n\n## Change\
    \ a User’s Password\n\nCommand passwd tidus\n\nResult System will prompt for you\
    \ to set a new password for user tidus.\n\nCLI Display [root@centos:/]# password\
    \ tidus\nNew password:\nRetype new password:\npasswd: all tokens updated successfully\n\
    \nOk, so now that we have tidus setup, we still need to grant him access to sudo.\
    \ We would only do this for users that may need to increase their security privileges.\
    \ \nFirst we need to open the sudoer’s configuration file to modify it. We can\
    \ do this by using the visudo command.\n\n## Giving a User Sudo Privileges\n\n\
    Command visudo\n\nResult System will open the sudoer’s file.\n\n```\n[root@centos:/]#\
    \ visudo\n# This file MUST be edited with the ‘visudo’ command as root.\n#\n#\n\
    Note: Arrow down the document\n#\n#Allow root to run any commands anywh..\nroot\
    \ ALL=(ALL) ALL\n```\n\nThere is a lot of text in this file, but do not be intimidated.\
    \ In the table above I arrowed down till I found the highlighted: root ALL=(ALL)\
    \ ALL.\n\nBelow that selection we need to add the following:\ntidus ALL=(ALL)\
    \ ALL\n\nIn visudo, you are always in one of modes: command or insert. Press I\
    \ to insert text and ESC to goto command mode.\n\nPress the down key until you\
    \ are in the blank space under root. Once there press I and type tidus, press\
    \ tab, type ALL=(ALL), press tab and type ALL. Now press the ESC key and type\
    \ :w and then press enter to save.\n\nNow you can breathe. I know dived in deep\
    \ a little fast, but it is important that we start using a user id than root.\
    \ It is also important that at the same time we can install software and learn\
    \ more, so this was needed.\n\nBefore we move on, we can learn two quick commands.\
    \ Right now there is probably a lot of text on your CLI. If you want to clean\
