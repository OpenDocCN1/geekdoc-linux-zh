    # 第 2 章


    # 在 VPS 上安装 CENTOS


    在书中这一节中，我们将介绍使用虚拟专用服务器（VPS）的安装方法。


    VPS 是由互联网托管服务商作为服务提供的虚拟机。它运行自己的操作系统，并为客户提供操作系统的超级用户（root）访问权限。这允许用户在他们的操作系统上安装和管理他们想要的几乎任何内容。


    VPS 的其他优点之一是你可以从任何地方访问它。它托管在云端，如果你想用 CentOS 来托管网站，它提供了一个极佳的起点，而不需要你自己拥有高带宽的网络连接和合适的硬件。个人而言，我的网站也是使用这种方式。这比购买用于获得快速网页体验的宽带连接，以及用于在家里运行稳健服务器的硬件要便宜得多。


    在本节中，我们将介绍如何开始使用两个 VPS 供应商：Linode 和 DigitalOcean。它们它们都有自己的定价方案和服务方案，但两者都非常易上手。


    在选择 VPS 时，有几点需要考虑。由于你正处于起步和学习阶段，如果你选择这种方法，价格可能是你决策的主要因素之一。在 Linode 上，他们提供每月 10
    美元的服务器，包含 1GB 内存、1CPU、24GB 存储和 2TB 流量。DigitalOcean 有一个每月 5 美元的入门套餐，包含 512MB 内存、1
    CPU、20GB 存储和 1TB 流量。选择取决于你。DigitalOcean 也有一个每月 10 美元的计划，类似于 Linode 的入门计划。


    # 在 LINODE 上设置 CENTOS


    开始使用虚拟专用服务器（或 VPS）非常简单。你需要的只有一张信用卡和这本书！你可以在几分钟内让你的服务器上线运行。


    首先，你需要访问：https://www.linode.com/


    从那里你可以注册并选择你喜欢的计划。对于我来说，制作这个指南的初衷是启动一个小型电子商务网站，我将从 10 美元的计划开始。


    ![](img/373347a8cccfab65b3dc27644fdd6a60_14_0.png)


    选择计划后，你需要选择你想要使用的数据中心。我的建议是选择一个离你所在地最近的。


    ![](img/373347a8cccfab65b3dc27644fdd6a60_14_1.png)


    我位于宾夕法尼亚州，所以新泽西州纽瓦克（Newark, NJ）是最近的数据中心。我选择了它，然后点击“Add this Linode”。


    一旦完成，你现在将进入 Linode Manager。这是你可以管理所有 VPS 系统（如果你有多个）的地方。


    | Linodes | NodeBalancers | Longview | DNS Manager | Account | Support |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | Linode | Status | Plan | IP | Location | - |

    | Linode1938051 | Being Created | Linode 1024 | 45.33.83.194 | Newark, NJ, USA
    | - |


    上面的图片可能很难看，但在这里我们可以看到 Linode 的状态、我们正在使用的计划以及你的 IP 地址。那个 IP 地址数字是我们用来连接服务器并最终将域名连接到它的。它非常重要，所以把它记录下来可能不是坏主意。


    现在，服务器是空的，没有操作系统。我们需要将其安装到我们想要使用的操作系统上，对于本书来说就是 CentOS 7。


    点击你的 Linode 名称。在例例中，名称是 linode1938051。你的看起来也会类似。


    当你点击名称时，你会发现它看起来相当空空。同样，这是因为我们需要安装操作系统。VPS 供应商让这变得非常简单。在 Linode 中，我们只需要点击 deploy
    链接。


    ![](img/373347a8cccfab65b3dc27644fdd6a60_15_0.png)


    点击“Deploy an Image”（部署镜像）。


    从此窗口中，我们可以选择我们需要的镜像，即 CentOS 7。部署磁盘大小和交换磁盘暂时保持默认设置。输入你想要为 root 设置的密码（稍后会讨论），并确保它是一个安全的密码。全部完成后，点击“Deploy”按钮。


    Linodes >> linode1938051 >> Deploy


    ![](img/373347a8cccfab65b3dc27644fdd6a60_15_1.png)


    一旦你点击“Deploy”，系统将开始安装。给它几分钟时间完成，但你的安装工作已经完成了！如果你选择使用 Linode，则可以跳过下一个关于替代方案 DigitalOcean
    的章节。请注意，供应商不止这两个，但这些是我对初者的个人偏。


    # 在 DIGITAL OCEAN 上设置 CENTOS


    与 Linode 类似，DigitalOcean 提供了一个快速流程来开始并部署 CentOS 安装。如果你决定为任何供应商的 VPS 支付少量的月费，我认为你做了正确的决定。我喜欢使用
    VPS 的点在于它不占用我机器的硬件，我可以在任何有互联网连接的地方工作。


    让我们在几分钟内通过 DigitalOcean 设置好我们的服务器。

    首先，访问 https://www.digitalocean.com/ 并点击右上角的“Sign Up”（注册）。从那里输入你想要用于账户的邮箱地址和密码。然后点击“Sign
    Up”。


    ![](img/373347a8cccfab65b3dc27644fdd6a60_16_0.png)


    我们需要确认邮箱地址。打开你的邮箱，找到来自 DigitalOcean 的邮件。标题为“DigitalOcean – Please confirm your
    email address.”。打开邮件并点击验证链接。


    太棒了，现在我们的邮箱已确认，我们需要选择一种支付选项。DigitalOcean 给你使用信用卡或 PayPal 的选项。对我来说，我使用 PayPal 以于方便。


    如果你使用 PayPal，你需要预付 5 美元，这笔钱将存入你的账户。这将涵盖你的第一个月！


    一旦添加了支付方法，我们就可以创建 VPS，DigitalOcean 将其称为 Droplet。在右上角，点击绿色的“Create Droplet”（创建
    droplet）按钮。


    ![](img/373347a8cccfab65b3dc27644fdd6a60_16_1.png)


    接下来，它会要求你选择发行版。我们要选择 CentOS 以及他们提供的最新版本，即 7.2。


    ![](img/373347a8cccfab65b3dc27644fdd6a60_17_0.png)


    一旦选择了 CentOS，向下滚动选择你想要部署的服务器大小。他们默认选择了每月 20 美元的计划。如果你想用那个大小开始尝试，只需点击每月 5 美元的计划即可。


    ## 选择尺寸


    | $5/mo | $10/mo | $20/mo |

    | :--- | :--- | :--- |

    | $0.007/hour | $0.015/hour | $0.030/hour |

    | 512 MB / 1 CPU | 1 GB / 1 CPU | 2 GB / 2 CPUs |

    | 20 GB SSD Disk | 30 GB SSD Disk | 40 GB SSD Disk |

    | 1000 GB Transfer | 2 TB Transfer | 3 TB Transfer |


    我建议选择一个离你所在地的区域。由于我位于美国东海岸，纽约是我的选择。


    ## 选择数据中心


    | New York | Amsterdam |

    | :--- | :--- |

    | 2 | 3 |


    对于额外的选项，取决于你是否需要作为备份。如果我们正在进行开发或训练测试之外的活动，我会建议选择备份选项，但由于我们现在只需要基础功能，我将不勾选这些。


    # 选择额外选项


    - Private Networking（私有网络）

    - Backups（备份）

    - IPv6

    - User Data（用户数据）


    从那里，滚动到底部并点击绿色的“Create”（创建）按钮。


    ## 完成并创建


    | How many Droplets?（多少个 droplet？） | Choose a hostname（选择主机名） |

    | :--- | :--- |

    | 1 Droplet | droplet-sq2-01 |

    | Creating multiple Droplets with the same configuration（使用相同配置创建多个 droplet） |
    如果你创建多个，将为它们命名。你的 droplet 名称只能包含字母、数字、连字符和括号。 |


    几秒钟后，你的系统就设置好并就绪了。DigitalOcean 随后会给你发送服务器的 IP 地址、用户名和密码。请准备好这些信息，稍后我们需要它们。


    # 第 3 章

    在虚拟机上安装 CENTOS


    如果你还不想使用 VPS，并想在本地进行测试，那么下一个最佳选择是使用虚拟环境。市场上有很多此类产品。假设你是一个初学者，我们将从零开始，首先安装虚拟化软件。Oracle
    的 VirtualBox 是我们在本教程中使用的程序，它是开源且免费的。


    '
