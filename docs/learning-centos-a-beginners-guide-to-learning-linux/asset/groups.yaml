    | Result | 列出当前目录下的文件 |

    | CLI Display | [tidus@centos:~]# ls documents |


    通过使用 `ls`，我们现在看到在 `documents` 目录之外，我们的目录是空的。


    让我们利用之前章节中学到的知识来练习导航技能，并进入 `documents` 目录。


    尝试使用命令：`cd Documents`


    你可能会注意到它返回了‘cd: Documents: No such file or directory.’。Linux 是区分字母大小的，这意味着‘Documents’
    和 ‘documents’ 是两个不同的东西。在使用 CentOS 时你需要记住这一点，因为使用正确的大小至关重要。


    现在，让我们用正确的方法来。


    ## 切换到子目录


    | Command | cd documents |

    | Result | 切换到 documents 目录 |

    | CLI Display | [tidus@centos:~]$ cd documents [tidus@centos: documents]$ |


    使用 `ls` 命令列出目录中的文件，你会发现它是空的。现在让我们使用 `cd` 回到主目录。


    ## 切换到用户主目录


    | Command | cd |

    | Result | 切换到用户主目录 |

    | CLI Display | [tidus@centos: documents]$ cd [tidus@centos:~]$ |


    如果我们使用 `pwd`，将发现我们回到了 /home/tidus。


    现在，使用 documents 目录的完整路径来执行 `cd`。记住，Linux 是区分字母大小的。


    ## 使用全路径切换目录


    | Command | cd /home/tidus/documents |

    | Result | 切换到指定目录 |

    | CLI | [tidus@centos:~]$ cd /home/tidus/documents\n[tidus@centos: documents]$
    |


    如果我们想进入此文件夹的父目录，也可以使用：`cd ..`


    | Command | cd .. |

    | Result | 系统将我们移动到父文件夹 |

    | CLI Display | [tidus@centos: documents]$ cd ..\n[tidus@centos:~]$ |


    你现在应该已经入门了！


    再做一些实验，在下一节中我们将使用内置文本编辑器 nano 创建一些文件。


    ## 使用 NANO 创建和编辑文件


    Nano 是 Linux 系统命令行界面 (CLI) 中一个实用的文本编辑器。由于我们使用的是 CLI，nano 是面向键盘的，使用控制键而不是鼠标。通过学习一些控制键，你将能够从
    nano 编辑器快速编辑文件。一旦掌握了这些，你就可以转向更高级的编辑器，如 vi，它们非常棒，但学习曲线通常更陡峭。


    Nano 易于使用，非常适合初学者。在 CentOS 的大多数 VPS 配置中它是默认安装的，但在虚拟机上你可能需要手动安装它。它是一个 WYSIWYG 编辑器；“所见即所得”。


    我们将在稍后的章节中详细讨论如何向 CentOS 安装软件包，但如果万一你没有 nano，可以使用以下命令进行安装，并在提示时输入密码：`sudo yum
    install nano`


    CLI 可能会向你请求权限。如果是，按 y 然后按回车。


    同样，我们稍后会详细讨论安装软件包，但如果你还没有 nano，该命令会将它安装到你的服务器上。


    让我们现在开始使用 nano 创建一个文件吧。


    | Command | nano notes.txt |

    | Result | 系统启动 nano 创建新文件 notes.txt |

    | CLI Display | [tidus@centos:~]$ nano notes.txt |


    现在，我们注意到自己正处于一个简单的文本编辑器中。由于我们没有鼠标，通过同时按下 control 和 G 键获取控制键列表。

    在下表中查看 nano 命令键的完整列表：


    ## Nano 命令键


    - - ^ 代表控制键 ‘Ctrl’。

    - ^G (F1) 显示此帮助文本

    - ^X (F2) 退出 nano

    - ^O (F3) 将当前文件写入磁盘

    - ^J (F4) 对当前段落进行对齐

    - ^R (F5) 将另一个文件插入到当前文件中

    - ^W (F6) 搜索字符串或正则表达式

    - ^Y (F7) 回到上一页

    - ^V (F8) 转到下一页


    ## Nano 命令键（续）


    | ^K (F9) | 剪切当前行并将其存储在剪贴板缓冲区中 |

    | ^U (F10) | 在当前行处粘贴内容 |

    | ^C (F11) | 显示光标位置 |

    | ^T (F12) | 拼写检查器（如果可用） |

    | M-\ (M-j) | 转到文件的第一行 |

    | M-/ (M-?) | 转到文件的最后一行 |


    | ^Y 上一页 | | |

    | ^V 下一页 | | |


