    # CHAPTER 6


    # CREATING A NEW USER


    The user ‘root’ has full access to the system. While we used it to learn some
    basic navigation, we should not use it as our main username for the system. It
    defeats the security model that is great and makes Linux systems so secure. By
    not using root, it also prevents accidental errors that could result in disasters.
    It''s just good practice. What we will do in our next command is create a new
    user, named tidus, and then we will provide him with sudo access.


    Sudo before a command, will allow our user, tidus, to be able to elevate to higher
    privileges to install software and make changes. Sudo runs the command as a super
    user, even though the tidus user would normally only have more limited access.
    This will come together soon, when we dive into using it, but first we need to
    create tidus’s account.


    | Add a New User |

    |---||

    | Command | adduser tidus |

    | Result | System sets up user tidus |

    | CLI Display | [root@centos:/]# adduser tidus

    [root@centos:/]# |


    Once you run that command, the system will add the user tidus. Next we need to
    set a password for this new user.


    Earlier, we learned how to change our password. If you are root or a sudo user
    you can change a user’s password as well by following the steps below.'
  - '[PAGE 52]


    # Change a User’s Password


    Command passwd tidus


    Result System will prompt for you to set a new password for user tidus.


    CLI Display [root@centos:/]# password tidus

    New password:

    Retype new password:

    passwd: all tokens updated successfully


    Ok, so now that we have tidus setup, we still need to grant him access to sudo.
    We would only do this for users that may need to increase their security privileges.

    First we need to open the sudoer’s configuration file to modify it. We can do
    this by using the visudo command.


    # Giving a User Sudo Privileges


    Command visudo


    Result System will open the sudoer’s file.


    ```

    [root@centos:/]# visudo

    # This file MUST be edited with the ‘visudo’ command as root.

    #

    #

    Note: Arrow down the document

    #

    #

    #Allow root to run any commands anywh..

    root ALL=(ALL) ALL

    ```'
