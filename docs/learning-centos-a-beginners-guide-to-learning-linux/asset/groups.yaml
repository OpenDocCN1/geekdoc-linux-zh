    # QUICK RECAP


    +   1) An operating system is the main program in a computer, which controls the
    way the computer works, making it possible for other programs to function.


    +   1. Microsoft Windows, Mac OSX, and Linux are examples of operating systems.


    +   2) Open-source means that the software is provided with the original source
    code and is made freely available to be redistributed and modified.


    +   3) A distro or distribution is a version of Linux that uses the Linux kernel
    as its foundation.


    +   4) A Virtual Private Server is a machine sold as a hosting service and is
    often more affordable than purchasing a server and the bandwidth that it requires


    +   5) The recommend method for you to experiment with CentOS, is by setting up
    a VPS.


    +   1. This books instructions focus on using DigitalOcean or Linode as your host,
    but you can choose other providers as well.'
