    # CHAPTER 2


    # INSTALLING CENTOS ON A VPS


    In this section of the book, we will cover the installation method of using a
    Virtual Private Server.


    VPS is a virtual machine sold as a service by an internet hosting service. It
    runs its OS and customers are provided super user access to the operating system.
    This allows users to install and manage almost anything they wish for their operating
    system.


    A few other advantages to a VPS is that you can access it from anywhere. It is
    hosted in the cloud and if you want to use CentOS to host a website, it provides
    a great way to start without needing your own high tier of internet bandwidth
    and appropriate hardware. Personally, this is what I use for my websites. It is
    cheaper than buying the internet connection for a fast web experience and hardware
    to run a robust server out of the house.


    In this section we will cover getting started with two VPS providers: Linode and
    DigitalOcean. Each has their own pricing and service offerings, but both are easy
    to start with.


    When you are choosing a VPS there are several things to consider. Since you are
    getting started and learning, price is likely to be a major part of your decision
    if you choose this method. On Linode, they offer a 1GB memory, 1CPU, 24GB storage,
    and 2 TB transfer server for $10 per month. DigitalOcean has a starter package
    with 512MB memory, 1 CPU, 20GB storage, and 1 TB transfer for $5 per month. The
    choice is up to you. DigitalOcean also has a $10 plan similar to the starting
    plan on Linode.'
