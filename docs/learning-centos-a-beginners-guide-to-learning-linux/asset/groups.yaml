    # 安装 Sendmail


    | 命令 | sudo yum install sendmail |

    | :--- | :--- |

    | 结果 | 系统将安装 sendmail |

    | CLI 显示 | [tidus@centos:~]$ sudo yum install sendmail\npassword for tidus:\nIs
    this ok? [Y/n] y\n[tidus@centos:~]$]$ |


    在您确认安装后，它将自动完成安装过程。


    现在我们已经安装了 LAMP 栈和 sendmail！本书将不会涵盖其他各种配置设置，但你可以在网上找到许多有用的资源。


    # 第 10 章


    # 通过浏览器进行管理


    在很多情况下，你可能希望通过网络浏览器查看服务器信息或管理某些内容。对于新用户来说，这通常比命令行界面（CLI）更容易。精通 CLI 的用户可能会倾向于使用它而不是图形化管理界面。


    Webmin 是一个用于 Linux 和 Unix 系统的 Web 工具。它允许用户在图形界面中管理用户、磁盘设置、网络、防火墙、Apache、DNS 以及许多其他项目。


    接下来的步骤将引导你安装此工具。


    要开始，我们需要将 webmin 仓库信息添加到 CentOS 中。输入以下命令：


    ```

    sudo nano /etc/yum.repos.d/webmin.repo

    ```


    然后在 nano 内部输入以下内容：


    ```

    [Webmin]

    name=Webmin Distribution Neutral

    #baseurl=http://download.webmin.com/download/yum

    mirrorlist=http://download.webmin.com/download/yum/mirrorlist

    enabled=1

    ```


    保存文件，然后输入以下两个命令：


    ```

    sudo yum check-update

    ```


    ```

    rpm --import http://www.webmin.com/jameron-key.asc

    ```


    现在 yum 已经更新，我们可以运行安装了。


    ```

    sudo yum install webmin -y

    ```


    当安装完成后，运行下面的两个命令来启动服务并使其在启动机自启动：


    ```

    sudo chkconfig webmin

    ```


    ```

    sudo service webmin start

    ```


    默认情况下，可以通过以下地址访问 webmin：


    http://myipaddress:10000


    如果系统没有提示登录，请在 CLI 中输入以下命令在你的系统防火墙上开启端口：


    ```

    firewall-cmd --add-port=10000/tcp

    ```


    如果你选择使用 webmin，这里有许多关于如何使用的文档和资源：


    http://doxfer.webmin.com/Webmin/Main_Page


    如果你选择通过此资源管理服务器，请将该链接作为你使用此平台的参考。


    # 第 11 章


    # 理解权限


    要理解如何为用户和组分配权限，我们必须首先理解 Linux 权限的工作原理。一旦你理解了它，这比确定 Windows Server 权限要简单得多。


    在 Windows Server 上，有多种权限类型可以分配。见下图：


    ![](img/373347a8cccfab65b3dc27644fdd6a60_91_0.png)


    CentOS 和其他 Linux 系统有三种权限组和三种权限类型。


    # 权限组


    **所有者 (Owner)** – 所有者权限适用于文件或目录的所有者。


    **组 (Group)** – 组权限适用于分配给该文件或目录的组。


    **所有用户 (All Users)** – 所有用户权限适用于系统所有用户。这是你最需要小心的权限组。


    # 权限类型


    **读取 (Read)** – 读取权限是指用户读取文件内容的能力，但不允许他们写入或保存更改。


    **写入 (Write)** – 写入权限是指用户写入或修改文件或目录的能力。


    **执行 (Execute)** – 执行权限影响用户执行文件或查看目录内容的能力。


    我们可以使用 CLI 和我们熟悉的 `ls` 命令（带有 `-l` 标志）来查看并检查现有权限。


    | 列出文件详细信息的示例 |

    | :--- | :--- |

    | 命令 | ls -l |

    | 结果 | 列出当前目录下的所有文件的详细信息 |

    | CLI 显示 | [tidus@centos:~]$ ls -l\n-rw-rw-r-- 1 tidus tidus 196 Feb 13 20:48
    notes.txt |


    拆析输出内容：

    -rw-rw-r— 1 tidus tidus 196 Feb 13 20:48 notes.txt


    显示的第一部分 `-rw-rw-r—` 显示了文件的权限。

    当我们使用 `ls -l` 命令查看权限时，可以通过以下键对照来理解它们。


    # 理解文件权限


    | 读取 | r |

    | :--- | :--- |

    | 写入 | w |

    | 执行 | x |


    当我们查看 notes.txt 文件的权限时，根据输出结果 `-rw-rw-r—` 可以得出几点观察：

    前三个字符 `--rw` 告诉我们用户对 `notes.txt` 文件具有读取和写入权限。第二组字符显示该组也具有读取和写入权限。最后一组显示了所有用户的权限。从输出来看，所有用户都可以读取该文件，但不能写入。


    # 使用二进制引用设置权限


    现在我们已经理解了权限组和权限类型的基础知识，使用二进制引用设置权限应该相当简单。当我们这样设置文件权限时，重要的是它是通过三个整数完成的。整数是一个整数数（例如：1,
    2, 和 4）。


    要设置权限，我们必须确定 `rwx` 字符串的二进制表示。RWX 字符串是允许我们设置读取、写入和执行权限的二进制表示。


    我们必须使用下表来计算文件或目录所需的权限数字。


    | 文件权限：二进制表示 |

    | :--- | :--- |

    | 读取 | 4 |

    | 写入 | 2 |

    | 执行 | 1 |


    我们通过将整数相加来获得权限数字。我们必须对三个权限组中的每一个都执行此操作。


    # 例如：


    读取访问 = 4


    读取和写入访问 = 6


    读取、写入和执行权限 = 7


    每个权限组都需要一个数字。我们用于设置权限的数字将是 3 位。记住，顺序是用户、组和所有用户。


    # 练习 1：权限 777意味着什么？


    这意味着用户、组和所有用户具有读取、写入和执行权限。使用 777 作为权限设置对于建立强大的安全性是有利的。


    # 练习 2：权限 655意味着什么？


    这意味着用户具有读取和写入权限。组具有读取和执行的权限。所有用户也可以读取和执行。


    # 练习 3：权限 444意味着什么？


    这意味着用户、组和所有用户对文件只有读取权限。


    # 练习 4：权限 755意味着什么？


    这意味着用户具有读取、写入和执行权限。组和所有用户只能读取和执行。对于使用 WordPress 的用户，这通常是 Web 推荐的权限设置。


    在介绍应用权限的步骤之前，我们应该首先学习如何传输文件。这个过程将为学习设置权限的应用打开门。


    # 概述：文件和目录的所有权


    在本书接下来的几页中，我们将提供一些示例让 tidus 修改文件和目录的权限。准备好后，让我们用学过的命令创建示例文件。


    在 tidus 的家目录下创建一个 ''files'' 文件夹：


    ```

    mkdir /home/tidus/files

    ```


    使用 nano 创建名为 ''test.txt'' 的文件：


    ```

    nano /home/tidus/files/test.txt

    ```


    在 nano 内部，你可以为此练习输入任何内容。


