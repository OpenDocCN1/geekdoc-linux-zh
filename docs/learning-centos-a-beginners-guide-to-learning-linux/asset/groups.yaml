- md: "\n## QUICK RECAP\n\n- 1) CLI stands for command line interface, where you can\
    \ interact with the system by entering lines of text.\n- 2) SSH stands for Secure\
    \ Shell, which is an encrypted way that we can remote login to our server.\n-\
    \ 3) An IP Address, is a string of numbers that identifies a computer on a network.\n\
    - 4) PuTTY is a free SSH client that is open source and supported on Windows.\n\
    - 5) The passwd command allows us to change the current users password.\n- 6)\
    \ Entering pwd, will provide us with our current location in the server's directories.\n\
    - 7) Using ls, will list the files and directories in our current directory.\n\
    - 8) Adding a flag, such as -la, after ls, provides us with more details and shows\
