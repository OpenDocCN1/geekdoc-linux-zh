    \ |\n| Result | System will clear the screen |\n| CLI Display | [root@centos:/]#\
    \ clear |\n\nNow that we have a clear screen we can close out of PuTTY if you\
    \ are using a VPS. If you are using a Virtual Machine type logout. We are going\
    \ to continue on our new user id, tidus.\n\n| Logging Out | |\n| :--- | :--- |\n\
    | Command | logout |\n| Result | System will close SSH session and exit PuTTY\
    \ or logout of a Virtual Machine |\n| CLI Display | [root@centos:/]# logout |\n\
    \n## QUICK RECAP\n\n- 1) We should avoid using the ‘root’ user as a good usage\
    \ practice.\n- 2) sudo before a command, allows a user to have super user privileges.\n\
    - 3) We can add a user by using the command `adduser`, with the username afterwards.\n\
    \  1. Example: `adduser nathan`\n- 4) We can change a user’s password by using\
    \ the `passwd` command before their name.\n  1. Example: `passwd nathan`\n- 5)\
    \ To have access to use **sudo**, a user must first be added to the configuration\
    \ file, which can be edited by using the `visudo` command.\n- 6) If our CLI gets\
    \ too cluttered, we can clear it by using the `clear` command.\n- 7) To end our\
    \ session and sign out, we can use `logout`.\n\n## CHAPTER 7\n\n## SYSTEM STATUS\
    \ AT A GLANCE\n\nLog into your server, with the new user that we created in the\
    \ last chapter. From here, through the rest of the book, we will not be using\
    \ the root user id.\n\nLet's take a look at a few settings and see how our server\
    \ is preforming.\n\nFirst, we can take a look at our uptime system. This can be\
    \ very useful in system administration. It lets you know how long the server has\
    \ been online, how many users logged in, and the average system load.\n\n## Checking\
    \ Uptime\n\n| Command | uptime |\n| :--- | :--- |\n| Result | System will display\
    \ the uptime and load average data |\n| CLI Display | [tidus@centos:~]$$ |\n\n\
    Next we can see what processes are using the most memory on our system by using\
    \ the top command. This can be useful if your system is running sluggish to see\
    \ what is hogging the system resources.\n\nThe first lines will give you a summary\
    \ of the resource utilization on your system and can sort the list of processes\
    \ by CPU or memory use, which allows you to quickly see where your server is receiving\
    \ the biggest demands on its resources.\n\n| Command | top |\n| :--- | :--- |\n\
    | Result | System will display processes with the most CPU resources |\n| CLI\
    \ Display | [tidus@centos:~]$ top |\n\nTo exit top, press control and c.\n\nTo\
    \ check the systems memory resources, we can use the vmstat command.\n\n| Checking\
    \ Memory Usage | |\n| :--- | :--- |\n| Command | vmstat |\n| Result | System will\
    \ display the amount of memory free and in use |\n| CLI Display | [tidus@centos:~]$\
    \ vmstat |\n\nBetween vmstat and top as you become more skilled, you will be able\
    \ to determine, which scripts or programs are maxing resources if there is a problem.\
    \ In a larger environment, you may want to see what users are logged into the\
    \ server. Using the w command provides us with this information.\n\n| Checking\
    \ Memory Usage | |\n| :--- | :--- |\n| Command | w |\n| Result | System will display\
    \ the users on the server |\n| CLI Display | [tidus@centos:~]# w |\n\n## NAVIGATING,\
    \ MAKING DIRECTORIES, AND FILES\n\nSome of this is going to recap earlier chapters,\
    \ but this repetition is important to remembering the commands that you will be\
    \ using in daily usage. Now that we have logged in, use the *pwd* command to see\
    \ our current directory.\n\n| Find Your Current Directory Location |\n| :--- |\
    \ :--- |\n| Result | System will output the directory that you are in. |\n| CLI\
    \ Display | [tidus@centos:~]$pwd\n/home/tidus |\n\nNotice that our directory time\
    \ is different than it was when we logged in with the root user. Last time we\
    \ were at /root, which is the home directory for root. At /home/tidus, which is\
    \ the home directory for the user tidus.\n\n**Tip:** If you ever need to get back\
    \ to your home directory use *cd*, to get back to your home folder.\n\nNow that\
    \ we are in our home folder, let's make a new directory called ‘documents’.\n\n\
    | Making a New Directory | |\n| :--- | :--- |\n| Command | mkdir documents |\n\
    | Result | System will create a child directory called documents |\n| CLI Display\
    \ | [tidus@centos:~]$ mkdir documents\n[tidus@centos:~]$ |\n\nUse the *ls* command\
    \ to list the contents of our home directory and see if the directory ‘documents’\
    \ is there.\n\n| List Files |\n| Command | ls |\n"
  mdcn: "\n\n## 快速回顾\n\n- 1) CLI 代表命令行界面（command line interface），你可以通过输入文本行与系统进行交互。\n\
    - 2) SSH 代表安全外壳（Secure Shell），它是我们远程登录服务器的加密方式。\n- 3) IP 地址（IP Address）是一段识别网络上计算机的数字字符串。\n\
    - 4) PuTTY 是一个免费的 SSH 客户端，开源并支持 Windows 系统。\n- 5) `passwd` 命令允许我们更改当前用户的密码。\n\
    - 6) 输入 `pwd` 将向我们提供服务器目录中的当前位置。\n- 7) 使用 `ls` 将列出当前目录下的文件和目录。\n- 8) 在 `ls` 后面添加标记（例如\
    \ `-la`）可以提供更多细节并显示隐藏文件。\n- 9) 我们可以使用 `cd` 快速切换目录：\n  1. 我们可以使用 `cd ..` 返回上一级文件夹。\n\
    \  2. 在 `cd` 后面加上子目录将进入该目录。\n     1. 示例：`cd home`\n  3. 我们始终可以通过 `cd /` 找到根目录。\n\
    - 10) 路径 `/` 是系统的根，`/root` 是一个名为 root 的子或子目录。\n\n## 第 6 章\n\n## 创建新用户\n\n用户“root”拥有系统的完全访问权限。虽然我们用它来学习一些基础导航，但我们不应该将其作为系统的主用户名。这违背了让\
    \ Linux 系统如此安全的优秀模型。不使用 root 还能防止可能导致灾难性后果的误操作。这仅仅是一种良好的习惯。我们在下一条命令中将做的是创建一个名为\
    \ tidus 的新用户，然后为他 sudo 权限。\n\n在命令前加上 `sudo` 将允许我们的用户 tidus 提升到更高的权限以安装软件和进行更改。`sudo`\
    \ 会以超级用户的身份运行命令，尽管 tidus 用户通常只具有有限的访问权限。当我们深入学习使用它时，很快就会涉及到这一点，但首先我们需要为 tidus\
    \ 创建账户。\n\n| 添加新用户 | |\n| :--- | :--- |\n| 命令 | `adduser tidus` |\n| 结果 | 系统设置用户\
    \ tidus |\n| CLI 显示 | `[root@centos:/]# adduser tidus`\n`[root@centos:/]#` |\n\
    \n一旦运行了该命令，系统将添加用户 tidus。接下来我们需要为这个新用户设置密码。\n\n早些时候我们学习了如何更改密码。如果你是 root 或 sudo\
    \ 用户，也可以按照下面的步骤更改用户的密码。\n\n## 更改用户密码\n\n命令 `passwd tidus`\n\n结果 系统将提示你为用户 tidus\
    \ 设置新密码。\n\nCLI 显示 `[root@centos:/]# password tidus`\n`New password:`\n`Retype\
    \ new password:`\n`passwd: all tokens updated successfully`\n\n好了，现在我们已经设置好了 tidus，但仍然需要授予他\
    \ sudo 权限。我们只对可能需要增加安全权限的用户执行此操作。首先，我们需要打开 sudoers 配置文件进行修改。我们可以通过使用 `visudo`\
    \ 命令来实现这一点。\n\n## 给用户授予 sudo 权限\n\n命令 `visudo`\n\n结果 系统将打开 sudoers 文件。\n\n```\n\
    [root@centos:/]# visudo\n# This file MUST be edited with the ‘visudo’ command\
    \ as root.\n#\n#\nNote: 使用方向方向键向下滚动文档\n#\n#Allow root to run any commands anywh..\n\
    root ALL=(ALL) ALL\n```\n\n此文件中有很多文本，但不要被吓到。在上面的表格中，我向下移动箭头直到找到高亮部分：`root ALL=(ALL)\
    \ ALL`。\n\n在该选择下方，我们需要添加以下内容：\n`tidus ALL=(ALL) ALL`\n\n在 `visudo` 中，你始终处于两种模式之一：命令模式或插入模式。按\
    \ `I` 插入文本，按 `ESC` 返回命令模式。\n\n一直按向下键直到进入 root 下方的空白区域。在那里按 `I` 并输入 `tidus`，按 Tab\
    \ 键，输入 `ALL=(ALL)`，按 Tab 键并输入 `ALL`。现在按 `ESC` 键输入 `:w` 然后按回车保存。\n\n现在可以松口气了。我知道我们进展得有点快，但开始使用比\
    \ root 之外的用户 ID 是重要的。同时，我们能够能够安装软件并学习更多知识也很重要，所以这是必须的。\n\n在继续之前，我们可以学习两个快速命令。现在你的\
    \ CLI 上可能有很多文本。如果你想清理掉它们，可以使用 `clear` 命令。\n\n| 命令 | `clear` |\n| :--- | :--- |\n\
    | 结果 | 系统将清除屏幕 |\n| CLI 显示 | `[root@centos:/]# clear` |\n\n现在屏幕是清洁的，如果你在使用 VPS，就可以关闭\
    \ PuTTY 了。如果你在使用虚拟机，请执行 `logout`。我们将继续使用新用户 ID tidus 操作。\n\n| 注销 | |\n| :--- |\
    \ :--- |\n| 命令 | `logout` |\n| 结果 | 系统将关闭 SSH 会话并退出 PuTTY 或注销虚拟机 |\n| CLI 显示 |\
    \ `[root@centos:/]# logout` |\n\n## 快速回顾\n\n- 1) 我们应该避免使用“root”用户，这是一个良好的使用习惯。\n\
    - 2) 在命令前加上 `sudo` 允许用户拥有超级用户权限。\n- 3) 我们可以使用命令 `adduser` 加上用户名来添加用户。\n  1. 示例：`adduser\
    \ nathan`\n- 4) 我们可以通过在用户名名前使用 `passwd` 命令更改用户密码。\n  1. 示例：`passwd nathan`\n-\
    \ 5) 要获得使用 **sudo** 的权限，用户必须先被添加到配置文件中，该文件可以通过使用 `visudo` 命令进行编辑。\n- 6) 如果我们的\
    \ CLI 变得太乱，可以使用 `clear` 命令将其清空。\n- 7) 要结束会话并注销，我们可以使用 `logout`。\n\n## 第 7 章\n\n\
    ## 系统状态概览\n\n使用我们在上一章中创建的新用户登录你的服务器。从现在开始，在本书的剩余部分，我们将不再使用 root 用户 ID。\n\n让我们来看一些设置，看看我们的服务器运行如何。\n\
    \n首先，我们可以查看 `uptime` 系统。这在系统管理中非常有用。它可以让你知道服务器已经运行了多久，有多少用户登录以及平均系统负载。\n\n## 检查运行时间\n\
    \n| 命令 | `uptime` |\n| :--- | :--- |\n| 结果 | 系统将显示运行时间和平均负载数据 |\n| CLI 显示 | `[tidus@centos~]$`\
    \ |\n\n接下来，我们可以通过使用 `top` 命令查看哪些进程正在占用系统最多的内存。如果你的系统运行缓慢，这有助于查看是什么在占用系统资源。\n\n\
    前几行将提供你系统资源利用情况的摘要，并可以按 CPU 或内存使用情况对进程列表进行排序，让你能够快速看到服务器资源需求最大的点在哪里。\n\n| 命令 |\
    \ `top` |\n| :--- | :--- |\n| 结果 | 系统将显示占用最多 CPU 资源的进程 |\n| CLI 显示 | `[tidus@centos~]$\
    \ top` |\n\n退出 `top` 请按 `control + c`。\n\n要检查系统的内存资源，我们可以使用 `vmstat` 命令。\n\n|\
    \ 检查内存使用 | |\n| :--- | :--- |\n| 命令 | `vmstat` |\n| 结果 | 系统将显示空闲和使用的内存量 |\n| CLI\
    \ 显示 | `[tidus@centos~]$ vmstat` |\n\n随着你变得越来越熟练，通过 `vmstat` 和 `top`，你能够在出现问题时确定哪些脚本或程序耗尽资源。在较大的环境中，你可能想查看哪些用户登录了服务器。使用\
    \ `w` 命令可以为我们提供这些信息。\n\n| 检查内存使用 | |\n| :--- | :--- |\n| 命令 | `w` |\n| 结果 | 系统将显示服务器上的用户\
    \ |\n| CLI 显示 | `[tidus@centos~]# w` |\n\n## 导航、创建目录和文件\n\n部分将是对前面章节的复习，但这种重复对于记忆日常使用中用到的命令非常重要。现在我们已经登录，使用\
    \ *pwd* 命令查看我们当前的目录。\n\n| 查找你的当前目录位置 |\n| :--- | :--- |\n| 结果 | 系统将输出你所在的目录。 |\n\
    | CLI 显示 | `[tidus@centos~]$pwd`\n`/home/tidus` |\n\n注意，我们的目录时间与使用 root 用户登录时不同。上次我们在\
    \ `/root`，那是 root 的主目录。现在在 `/home/tidus`，这是用户 tidus 的主目录。\n\n**提示：** 如果你随时需要返回主目录，使用\
    \ *cd* 回到你的主文件夹。\n\n现在我们已经在主文件夹中了，让我们创建一个名为 `documents` 的新目录。\n\n| 创建新目录 | |\n\
    | :--- | :--- |\n| 命令 | `mkdir documents` |\n| 结果 | 系统将创建一个名为 documents 的子目录 |\n\
    | CLI 显示 | `[tidus@centos~]$ mkdir documents`\n`[tidus@centos~]$` |\n\n使用 *ls*\
    \ 命令列出我们主目录的内容，看看 `documents` 目录是否存在。\n\n| 列出文件 |\n| 命令 | `ls` |\n\n"
