    # 第 4 章

    ## 60 秒文档训练营


    在技术领域，我们的成败取决于我们所编写的文档。想象一下，当客户的系统出现问题时，你不知道它运行的是什么，IP 地址或密码是什么。这是一个常见的问题。通常情况下，将密码存储在任何地方都是安全的，但你必须想出一个安全存储这些信息的方法。当你处理大量的
    IP 地址和密码时，记住所有的是不可能的。下面是一份实用的文档指南，帮助你入门。由于这是为了学习 CentOS 而不是生产环境，把密码写下来可能是可以的。如果你是以电子方式阅读这些，请创建一个自己的表格来记录这些信息。


    ### 示例数据


    | 字段 | 值 |

    | :--- | :--- |

    | 服务器名称 | CentOS |

    | 操作系统 | CentOS 7 |

    | 支持至 | 2024 |

    | Root 密码 | ******** |

    | IP 地址 | 000.000.000.000 |

    | 主要用途 | Web 服务器 |

    | 安装日期 | 2016/6/20 |

    | 最后更新日期 | 2016/6/20 |


    ### 我的文档


    **服务器名称：** ______________________


    **操作系统：** CentOS 7


    **支持至：** 2024


    **Root 密码：** ______________________


    **IP 地址：** _________________________


    **主要用途：** Web 服务器


    **安装日期：** ______________________


    **最后更新日期：** ______________________


    # 第 5 章

    ## 进入 CLI


    CLI 代表命令行界面，你通过输入行行文本来与系统进行交互。这就是我们与服务器交互的方式。


    如果你决定不使用推荐的方法来设置 VPS，那么你可以在电脑显示器上看到 CLI。当你启动电脑时，它将带你进入 CLI 并可以在那里登录。


    我们可以使用 SSH 协议连接到 CentOS 服务器。SSH 代表安全外壳（Secure Shell），这是我们远程登录到服务器的加密方式。


    接下来的步骤，请参考我们在上一章中记录的信息，这作为我们文档训练营的一部分。我们需要 IP 地址和登录信息。IP 地址是一串识别网络上计算机的数字字符串。对于我们的
    VPS，你的 IP 地址是公网，可以从任何连接互联网的地方访问。对于虚拟机，请使用启动时显示的 CLI 接口。


    我推荐用于 SSH 连接你 VPS 服务器的程序是 PuTTY。PuTTY 是一个免费开源 SSH 客户端，支持 Windows。你可以从以下链接下载它：


    http://putty.org


    你下载的文件是一个可执行文件 (.exe)，不需要安装。下载后，你可以将其拖到桌面以便快速访问。


    使用此工具连接到你的 VPS 或虚拟机非常简单。在 Host Name（主机名）或 IP address 处输入提供的 IP 地址。选择 SSH 作为连接类型，然后点击
    open（打开）。示例请参见图 1。


    **注意：** 你的 IP 地址将与图中不同。


    图 1：Putty 配置


    ![](img/373347a8cccfab65b3dc27644fdd6a60_40_0.png)


    当你点击 connect（连接）时，可能会收到类似图 2 中的消息。点击 Yes（是）。


    ## 图 2：PuTTY 安全警报


    ![](img/373347a8cccfab65b3dc27644fdd6a60_41_0.png)


    # 首次登录


    现在你将被提示进行首次登录。输入用户名 root，然后输入在设置 VPS 时提供或设置的密码。


    如果你使用 DigitalOcean，他们的系统会在你第一次登录时要求重置密码。你需要重新输入提供的密码，然后输入两次想要设置的新密码。确保你遵循安全密码指南，并为
    root 用户设置一个安全的密码。


    注意：在整本书中，我使用表格来解释我们将学习的不同命令。第一行是我们想要执行的任务，第二行是我们需要使用的命令，第三行是你的 CLI 看起来的示例。我认为这是描述和解释我们将学习的命令的最佳方式。


    如果你没有被提示更改密码，但你想更改，可以输入命令 `passwd`。更多详情请参见下一页的表格。


    | 修改我的密码 |

    | :--- | :--- |

    | 命令 | passwd |

    | 结果 | 系统将提示新密码 |

    | CLI 显示 | [root@centos:~]# passwd\nChanging password for user root:\nNew password:\nRetype
    new password:\np: password updated successfully |


    当系统提示你输入新密码时，输入它，不要担心密码没有显示在屏幕上。完成后，按回车键再次输入一次。


    # 导航


    不要被 CLI 上的白字和黑背景吓到。我知道这里没有鼠标或图形，但过了一会儿，你就会习惯在服务器的目录之间导航了。目录就像你在 Windows 或 Mac
    设备上使用过的文件夹。作为一个长期使用这种工具的人，我实际上更倾向于而不是图形用户界面。在我们进行任何其他操作之前，让我们学习探索服务器。通过使用 `pwd`
    命令，我们可以查看当前查看的目录位置。


    ## 查找当前目录位置


    | 命令 | 结果 |

    | :--- | :--- |

    | pwd | 系统将输出你所在的目录。 |

    | CLI 显示 | [root@centos:~]# pwd /root |


    现在我们在一个名为 root 的目录中，这本质上是 root 用户的家目录。**这个 root 家目录与真正的系统根目录之间有巨大差异。**


    路径 `/` 是系统的根，但现在我们处于一个名为 root (/) 的子目录中。


    服务器的**根（root）**是顶级目录。一切都是它内部的子目录。从我们当前的位置，有两种可以去。让我们从总是带我们进入 root 的简单命令开始。


    ## 进入根目录 (/)


    | 命令 | 结果 |

    | :--- | :--- |

    | cd / | 我们切换到主目录 |

    | CLI 显示 | [root@centos:~]# cd / [root@centos:/]# |


    现在让我们再次使用 `pwd` 看看我们现在哪里。


    ## 查找当前目录位置


    | 命令 | 结果 |

    | :--- | :--- |

    | pwd | 系统将输出你所在的目录。 |

    | CLI 显示 | [root@centos:~]# pwd |


    如果你想看文件夹里有什么，我们可以使用 `ls` 命令。


    | 列出文件 |

    | :--- | :--- |

    | 命令 | ls |

    | 结果 | 列出当前目录下的文件 |

    | CLI 显示 | [root@centos:/]# ls\ndev home media opt root sbin sys tmp var |


    我们还可以通过添加标志（flag）来获取更多详细信息。标志在命令后的提示符处输入，为我们想要的系统添加额外参数。


    尝试运行此命令：`ls -la`


    在这个示例中，`-la` 是标志。`l` 告诉系统我们需要详细信息并列出所有文件，甚至是隐藏文件。


    现在让我们进入名为 home 的目录


    | 切换目录 |

    | :--- | :--- |

    | 命令 | cd home |

    | 结果 | 系统移动到子文件夹 home |

    | CLI 显示 | [root@centos:/]# cd home\n[root@centos:home]# |


    **注意：** 理解父目录和子目录的区别很重要。如果我们有一个名为 documents 的目录，里面另一个名为 pictures 的目录，那么 pictures
    就是 documents 的子目录。在这种情况下，我们位于父目录 / 并切换到子目录 /home。如果你不在父文件夹中，我们仍然可以进入 home，但在 cd
    之后你需要列出完整路径（例如：cd /home）。如果你收到“无此类文件或目录”之类的错误，你可能需要输入完整路径，因为你可能不在正确的父目录中。


    如果我们想回到根目录，可以使用另一个切换目录命令，这让向上移动目录非常简单。


    | 向上一级目录 |

    | :--- | :--- |

    | 命令 | cd .. |

    | 结果 | 系统移动到父目录 |

    | CLI 显示 | [root@centos:home]# cd ..\n[root@centos:/]# |


    使用 cd 配合目录名称和 `..` 可以允许我们快速在整个服务器中移动。


