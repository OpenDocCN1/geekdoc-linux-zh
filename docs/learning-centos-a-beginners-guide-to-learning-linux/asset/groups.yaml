    Linux 服务器，而 82% 的企业计划在 2015 年增加更多。


    Linux 及其发行版在数据库、Web 以及其他类型的服务器中非常流行。Linux 诞生于 90 年代左右，它驱动着全球大部分互联网、能够实现科学突破的超级计算机，以及全球的证券交易所。当你观察互联网时，Linux
    驱动了在线 36% 的资源，其中约 21% 是 CentOS Linux 发行版。


    发行版（distro or distribution）是以 Linux 内核为基础的 Linux 版本或“变体”。内核是真正属于 Linux 的组件。内核是操作系统的最底层，负责管理
    CPU、内存和设备的主要系统功能。


    1991 年，林斯·托瓦尔斯（Linux Torvalds）的一个个人项目是创建一个新的免费操作系统内核。从那以后，内核在过去的 25 年里经历了巨大的增长。它已经从少量的
    C 语言代码增长到如今的规模。


