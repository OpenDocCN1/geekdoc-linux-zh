    # 第 1 章

    # 什么是 Linux 和 CentOS？


    《辞亚-韦斯特词典》（Merriam-Webster）将操作系统定义为计算机中的主程序，它控制着计算机的运行方式，并使使其他程序的运行成为可能。


    本质上，操作系统是让你与计算机交互、并让计算机理解你的意图的程序。计算机运行需要操作系统，但在我们互联的世界中，它们也被用于智能手机、汽车、家电器以及几乎所有设备。没有操作系统，我们的设备只是塑料、玻璃和硅胶的一堆废料。


    Linux 是一个开源操作系统。开源是 Linux 与其他流行操作系统之间的主要区别。开源意味着软件提供了原始源代码，并免费提供供重新分发和修改。这使得 Linux
    独一无二。它拥有一个强大的社区，他们可以在那里修改代码、参与论坛并修复漏洞，速度远快于其他替代方案。


    如果你正考虑为自己的技能组合增加一项新技能，那么学习如何使用 Linux 将非常有帮助。根据 XDNet 在 2014 年的数据，87% 的企业业务采用了至少一台
    Linux 服务器，而 82% 的企业计划在 2015 年增加更多。


    Linux 及其发行版在数据库、Web 以及其他类型的服务器中非常流行。Linux 诞生于 90 年代左右，它驱动着全球大部分互联网、能够实现科学突破的超级计算机，以及全球的证券交易所。当你观察互联网时，Linux
    驱动了在线 36% 的资源，其中约 21% 是 CentOS Linux 发行版。


    发行版（distro or distribution）是以 Linux 内核为基础的 Linux 版本或“变体”。内核是真正属于 Linux 的组件。内核是操作系统的最底层，负责管理
    CPU、内存和设备的主要系统功能。


    1991 年，林斯·托瓦尔斯（Linux Torvalds）的一个个人项目是创建一个新的免费操作系统内核。从那以后，内核在过去的 25 年里经历了巨大的增长。它已经从少量的
    C 语言代码增长到如今的规模。


