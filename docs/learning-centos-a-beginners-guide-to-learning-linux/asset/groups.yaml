    # CHAPTER 8


    # UPDATING THE SERVER


    In the last few chapters, we got a foundation in navigation and managing files.
    Another thing that is vital to a strong foundation is knowing how to update your
    server.


    As we install updates and packages, we will be using a utility called yum. YUM
    stands for Yellowdog Updater Modified and is an open source CLI package management
    tool. It allows users to easily install, update, remove or search software packages
    on some Linux systems like CentOS.


    For us to update the server, we will need to give tidus super user privileges.
    In the first yum command below, we will update the list of packages and get information
    on the newest versions.


    | Update Package Information |

    |------|

    | Command | sudo yum update |

    | Result | System will increase the user’s rights, search for an updated list
    of packages, and look for newer versions. |

    | CLI Display | [tidus@centos:~]$ sudo yum update password for tidus: |


    After you run that, your CLI will list a long list of web addresses as it checks
    the various package lists for updates. It may ask you if you wish to continue
    and if it does type y and press enter.


    With the new information of updates that are available, we can now upgrade our
    server to have the latest versions of the current packages. Using the command
    below will fetch the new versions and install them onto the server.


    | Upgrade Server Packages |

    | --- |

    | Command | sudo yum upgrade |

    | Result | System will increase the user’s rights, search for an updated list
    of packages, and look for newer versions |

    | CLI Display | [tidus@centos:~]$ sudo yum upgrade


    password for tidus:


    Do you want to continue? [Y/n] y

    [tidus@centos:~]$ |


    After entering, Y to continue, the server will setup and install all of the newest
    versions of packages to our server.


    Keeping your server with the latest updates installed is a vital foundation to
    a core level of security. There is much more you will will need to learn to secure
    your system, but this is a basic step to get started.


    # CHAPTER 9


    # SETTING UP A WEB SERVER


    ## APACHE2


    A common configuration for Linux servers is to set them up to be web servers.
    80% of servers that host websites are running Linux. To establish a good foundation,
    learning how to install these features are important.


    To get started in setting this server up as a web server, we need to install Apache.
    Apache2 is the most commonly used web server on Linux systems. Web servers are
    used to serve web pages requested by client customers. To run website software
    like WordPress we will need more packages than this, installing Apache2 is the
    best starting place.


    ### Installing Apache


    | Command | sudo yum install httpd |

    | Result | System will install apache2 and dependent packages to the server. |

    | CLI Display | [tidus@centos:~]$ sudo yum install httpd

    password for tidus:

    Do you want to continue? [Y/n] y

    [tidus@centos:~]$ |


    Now, we should make a basic HTML file to test our webserver. In the CLI type the
    following command:


    ```

    sudo nano /var/www/html/index.html

    ```


    Inside of nano type: `<h1>It Works</h1>`


    Then press control and x, then y to save and enter.


    The `<h1></h1>` tag, if you are not familiar, is an HTML tag for a header. It
    will make the text display big and bold at the top of the page.


    Later in this book we will cover changing permissions, but for now use the following
    command to make the HTML file viewable:


    ```

    sudo chmod -R 755 /var/www/html/

    ```


    That command is setting recursively the permissions to the html folder. More on
    that later.


    We must start the Apache2 service so that the web service is running to make the
    page visible.


    | Starting Apache | |

    |--- | --- |

    | Command | sudo service httpd start |

    | Result | System will start apache2 |

    | CLI Display | [tidus@centos:~]$ sudo service startpassword for tidus:

    [tidus@centos:~]$$ |


    You can now enter your ip address into any browser and see our test HTML file.


    ## In the browser you should see: It Works


    Reminder, if you use a Virtual Machine instead of a VPS, you will only be able
    to see this on your host computer’s browser.


    # Stopping and Restarting Apache2


    There may be an instance when you want to stop or restart the Apache2 webserver.

    You can do so by using the following commands:


    - Stop Apache2: sudo service httpd

    - Start Apache2: sudo service httpd start

    - Restart Apache2: sudo service httpd restart


    By default, your CentOS server will not start Apache2 at boot, which could be
    a problem if there is a power failure. Use the following command to have it start
    by default at:

    sudo systemctl enable httpd.service


    ## THE WEB FOLDER


    You may be wondering, where are my website files located? On most CentOS installs
    you can get to the web directory by changing directory to /var/www/html.


    | Go To The HTML Directory |

    | --- | |

    | Command | cd /var/www/html; ls |

    | Result | System will change to the html directory and list the files. |

    | CLI Display | [tidus@centos:~]$ cd /var/www/html |


    If you want to, you can open the default index.html file in nano.


    | Open index.html in nano |

    | --- | |

    | Command | nano index.html |

    | Result | System will load index.html into nano. |


    **Note:** To save and make changes, you may need to open the file using sudo.

    Now let''s change back to our home directory by using cd.


    # INSTALLING MYSQL/MARIAB DATABASE


    Along Apache2 and PHP, your server will need MySQL for many applications that
    need to store data. This includes the widely popular WordPress CMS. Recently,
    CentOS has removed MySQL and set MariaDB as the default database package. This
    will do the job for you as well.


    ### Installing MariaDB Server


    | Command | Result |

    |---|---|

    | sudo yum install mariadb-server | System will install MariaDB Server |


    Like Apache2, we need to enter a command for MariaDB to start on system boot.
    Enter the following:

    sudo systemctl enable mariadb.service


    There may be an instance when you want to stop or restart the MariaDB database.

    You can do so by using the following commands, which are similar to Apache2''s
    commands:

    **Stop MariaDB:** sudo service mariadb stop

    **Start MariaDB:** sudo service mariadb start

    **Restart MariaDB:** sudo service mariadb restart


    Now that we have our database running, we need to run a security script to remove
    some defaults that can be dangerous.


    ## Securing MariaDB Server


    | Command | Result |

    |---|---|

    | sudo mysql_secure_installation | System will prompt you for password for the
    database. One is not set so press enter. Then press Y to set a password and follow
    the on screen.


    # INSTALLING PHP


    PHP is a popular server-side scripting language. It is very popular and used by
    content management systems. It can display dynamic content, scripts, connect to
    the database, and send information to the webserver.


    ### Installing PHP5


    | Command | Result |

    | --- | --- |

    | sudo yum install php-mysql | System will install php5 and dependencies, along
    with the mysql package to talk to the database. |

