    bin dev home media opt root sbin sys

    var boot etc lib mnt proc srv tmp var |n


    We can also go into more detail by adding a flag after ls.


    A flag is typed at the prompt as of our command and adds additional parameters
    to the system what we want.


    Try running this command: ls -la


    In this example, -la is the flag. The l tells the system we want to see more details
    and a lists all the files in the directory, even the hidden ones.


    Now, let''s change to the directory named home.


    | Change Directory |

    |---||

    | Command | cd home |

    | Result | System moves us to child folder home |

    | CLI Display | [root@centos:/]# cd home

    [root@centos:home]# |n


    **Note:** It is important to understand the difference between parent and child
    directories. If we have a directory called documents and another inside of it
    called pictures. Pictures would be a child directory of documents. In this instance
    we were in the parent directory / and changed it to the child directory /home.
    If you were not in the parent folder, we'
