  md: '![](img/373347a8cccfab65b3dc27644fdd6a60_30_0.png)


    Select Install CentOS 7 and press enter.


    If your installation fails or appears to hang, it is likely that your system does
    not support running 64bit software virtually. I experienced that issue as I was
    testing this book on an older PC.


    You can download the 32bit i386 versions from this link: http://mirror.centos.org/altarch/7/isos/i386/


    Once the installer successfully loads, you will need to select your language and
    location. Once you have done that click "Continue.",


    ![](img/373347a8cccfab65b3dc27644fdd6a60_30_1.png)


    Next you will see CentOS preconfigure a variety of settings.


    You may need to configure the "Installation Destination" that is under the system
    heading. Select "Installation Destination" and from that interface select the
    hard disk and click done as seen below.'
