  md: '# CHAPTER 12


    # ADDING A DATABASE TO MARIADB


    In other books I have written about Linux, I had users use a web tool called phpmyadmin
    to add users and databases. In this book, I want to take a different approach
    and do this from the command line interface.


    As we progress into installing WordPress, it will need a database to store its
    information into. In these next steps, we will create database and a user to connect
    to that database.


    To begin, we must log to MariaDB''s root account using the following command:

    sudo mysql -u root -p


    As you have guessed, the u flag symbolizes user and p stands for password.


    You will be prompted to enter the root password for MariaDB. You would have set
    this when we run the command to secure the install.


    Once you are logged in, the next step is to create the database. We are going
    to name this database ''wordpress''.


    ```

    CREATE DATABASE wordpress;

    ```


    Please note that capitals do matter here as they do for other commands. Additionally
    MySQL and Maria statements must end with a semi-colon.


    That was easy! Now we need to create a new user account that will only be able
    to operate with the database we created. This allows for good security and better
    control of database permissions.


    For me, I am going to call the new user account ''wpuser''. In the command below,
    you can use a different name if you wish and change ''password'' to a secure password.
    We will need this password as we connect WordPress to the database.


    ```

    CREATE USER wpuser@localhost IDENTIFIED BY ''password'';

    ```


    Right now you have a database and user account, but the user account cannot access
    the wordpress database. We need to grant that user access to the wordpress database
    with the following command.


    ```

    GRANT ALL PRIVILEGES ON wordpress.* TO wpuser@localhost IDENTIFIED BY ''password'';

    ```


    Our user now has access to the database, but we need to do something flush that
    the privilege changes we made. Use the following command:


    ```

    FLUSH PRIVILEGES;

    ```


    Now that we have done these commands, we can exit MySQL/MariaDB by using the'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'following command:


    exit


    Easy right? There is much more to learn using MySQL and MariaDB. I recommend you
    continue expanding your knowledge on these topics as they are a very in demand
    skillset.'
