  md: '# SETTING UP CENTOS ON LINODE


    To get started with a Virtual Private Server or VPS is very simple. All you need
    a credit card and this book! You can get your server live in just a few minutes.


    First you will need to go to: https://www.linode.com/


    From there you can sign up and select which plan you would like. For me making
    this guide with intentions to launch a small eCommerce site, I am going to start
    with the $10 plan.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_14_0.png)


    After you select the plan, you need to select the datacenter you wish to use.
    My recommendation is to choose one that is the closest to your location.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_14_1.png)


    I am located in Pennsylvania so Newark, NJ is the closest datacenter. I select
    that and then click ‘Add this Linode’.


    Once you do, you will now be brought to the Linode Manager. This is a location
    where you can manage all of your VPS systems, if you have multiple.


    | Linodes | NodeBalancers | Longview | DNS Manager | Account | Support |

    |---|---|---|---|---|-|

    | Linode | Status | Plan | IP | Location |

    | Linode1938051 | Being Created | Linode 1024 | 45.33.83.194 | Newark, NJ, USA
    |


    The image above may be hard to see, but here we can see the status of our Linode,
    the plan we are using, and your IP address. That number for the IP address is
    what we will use to connect to our server and eventually connect our domain to.
    It is very important so it might not be a bad idea to write it down.


    Right now, the server is empty with no operating system. We need to install it
    onto the OS we wish to use, which for this book is CentOS 7.


    Click on the name of your Linode. In this instance the name is linode1938051.
    Yours will appear similar to that.'
  merge: -1
