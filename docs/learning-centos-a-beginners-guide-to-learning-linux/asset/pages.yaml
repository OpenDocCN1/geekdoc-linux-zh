  md: '# ACCESSING WORDPRESS VIA THE BROWSER


    The final steps we need to do in this is to access WordPress from our browser.
    To do this, enter your ip address (http://myipaddress) into the browser. You should
    see a screen like the one on the following page.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_106_0.png)


    Complete the requested information for the site and then click on the ‘Install
    WordPress’ button. This will confirm the install and create the tables inside
    of the database automatically for you.


    To continue hit the ‘Login’ button at the bottom of the page.


    Now you have a working WordPress system up and running on your CentOS server.'
