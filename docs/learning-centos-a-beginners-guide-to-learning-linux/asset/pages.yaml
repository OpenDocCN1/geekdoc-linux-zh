  md: '# Device Selection


    Select the device(s) you''d like to

    Local Standard Disk


    ![](img/373347a8cccfab65b3dc27644fdd6a60_31_0.png)


    Specialized & Network Disks

    Add a disk...


    Once that is complete and you are back at the main installation screen. Now we
    need to make sure that we can establish an internet connection. Click on “Network
    and Hostname”. Inside of this panel configure and make sure that “Automatically
    Connect When Network is Available” is checked. Once that is completed, click save.
    In the hostname box, enter the name for your server. I just called mine CentOS.
    When it is completed turn the switch for the network adapter to on. It can be
    found right next to the network adapter. In the top left, “Done”, which returns
    you to the home screen where you can click “Begin Installation” in the bottom
    right.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_31_1.png)


    As CentOS is installing there are two things that we can configure, the “Root
    Password” and “User Creation”. For now lets use the user configuration what it
    is and set the “Root Password”. Click on “Root Password”, enter the new password
    twice and then click done. Be sure to remember this password as we will need it
    later.


    | ROOT PASSWORD Root password is not set | USER CREATION No user will be created
    |


    Once the installation is completed, you will need to click the “Reboot” button
    in the bottom right.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_31_2.png)


    Now dismount the ISO image (if you don’t you’ll keep going through the install
    process) and shutdown the Virtual Machine.


    Now we need to do some additional configuration to the Virtual Machine so that
    it can have both internet access and you can view the system from the browser
    later in the book.'
