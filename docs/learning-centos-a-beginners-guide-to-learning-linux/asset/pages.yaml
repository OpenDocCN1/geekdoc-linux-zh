  md: '# CREATING and Editing Files With NANO


    Nano is a useful text editor for the command line interface (CLI) in Linux systems.
    Since we are using the CLI, nano is keyboard oriented with control keys, rather
    than using a mouse. By learning some of the control keys, you will be able to
    quickly edit files from the nano editor. Once you pick this up you can then move
    onto more advanced editors like vi and, which are great, but often have a steeper
    learning curve.


    Nano is easy to use and great for beginners. It is often installed by default
    in most VPS configurations of CentOS, but on a Virtual Machine you may need to
    install it. It’s a WYSIWYG editor; “what you see is what you get.”


    We will talk about installing packages to CentOS more in a later chapter, but
    in case you do not have nano, you can install it by using the command and then
    typing your password when prompted: `sudo yum install nano`


    The CLI may also ask you for permission. If it does, press y and then enter.


    Again, we will discuss installing packages in more detail later, but that command,
    if you don’t already have nano, will install it to your server.'
