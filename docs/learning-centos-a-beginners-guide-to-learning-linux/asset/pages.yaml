  md: '# EDITING, DELETING, MOVING, AND COPYING


    With our notes.txt file created, we can now learn how to move, edit, delete, and
    copy files. To get started, let''s copy the notes.txt file to a new file called
    test.txt. To do this we use the cp command, which will allow us to copy one file
    to another. To use cp, we need to also provide the file we want to copy, and also
    the file we want to copy into. See the table below:


    | Command | cp notes.txt test.txt |

    | Result | System copies notes.txt and creates a new file, test.txt with the contents.
    |

    | CLI Display | [tidus@centos:~]$ cp notes.txt test.txt [tidus@centos:~]$] |


