  md: '# SETTING UP CENTOS ON DIGITAL OCEAN


    Like Linode, DigitalOcean offers a quick process to get started and deploy a CentOS
    installation. If you have decided to pay the small monthly fee for a VPS with
    any provider, I think you made the right decision. What I like about using a VPS
    is that it doesn''t use my machines hardware and I can work on it anywhere that
    I have an internet connection.


    Let''s go ahead and get our server setup with DigitalOcean in just a few minutes.

    First, go to https://www.digitalocean.com/ and click on ‘Sign Up’ in the top right.
    From there, enter an email address and password that you want to use for your
    account. Then click ‘Sign Up''.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_16_0.png)


    We need to confirm our email address. Open your email and find the email from
    DigitalOcean. It will be titled “DigitalOcean – Please confirm your email address.”
    Open the email and proceed to click on the verification link.


    Great, now that our email is confirmed, we need to select a payment option. DigitalOcean
    gives you the option of using a credit card or PayPal. For me, I use PayPal for
    convenience.


    If you use PayPal, you have to prepay $5, which is credited to your account. This
    will cover your first month!


    Once you have added your payment method, we can create our VPS, with DigitalOcean
    calls a Droplet. In the top right, click on the green ‘Create Droplet’ button.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_16_1.png)


    Next, it will ask you to select a distribution. We want to select CentOS and the
    most recent edition they offer, which is 7.2.'
