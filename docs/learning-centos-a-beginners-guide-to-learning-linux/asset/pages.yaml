  md: '# CHAPTER 1


    # WHAT IS LINUX & CENTOS?


    Merriam-Webster defines operating system as the main program in a computer that
    controls the way the computer works and makes it possible for other programs to
    function.


    Essentially, the operating system is the program that lets you interact with a
    computer, and the computer to understand what you want to. Operating systems are
    required for computers to work, but in our interconnected world, they are also
    used in smartphones, cars, home appliances, and basically everything. With no
    operating system our devices are hunks of plastic, glass, and silicone.


    Linux is an open-source operating system. Open-source is a major difference between
    Linux and the other popular operating systems. Open-source means that the software
    is provided with the original source code and is made freely available to be redistributed
    and modified. This is what makes Linux unique. It has a strong community out there
    modifying the code, participating in forums, and fixing bugs much quicker than
    the alternatives.


    If you are looking to add a new skill to your portfolio, learning how to use Linux,
    can be very useful. According to XDNet in 2014, 87% of enterprise businesses adopted
    at least one Linux server and 82% planned on adding more in 2015.


    Linux and its distributions are very popular for database, web, and other types
    of servers. Being around the 90s, Linux powers most of the internet, supercomputers
    that enable breakthroughs in science, and the stock exchanges of the globe. As
    you look at the internet, Linux powers 36% of the resources online, of about 21%
    is the CentOS Linux distribution.


    A distro or distribution is a version or ‘flavor’ of Linux that uses the Linux
    kernel as its foundation. The kernel is the one component that is actually Linux.
    The kernel is the lowest level of the operating system and manages the primary
    system functions for the CPU, memory, and devices.


    In 1991, a personal project by Linux Torvalds was to create a new free operating
    system kernel. Since then the kernel has been marked with growth over the last
    25 years. It has grown from a small number of C based files to over 18 million
    lines of source code that is open under the GNU General Public Licence.


    There are hundreds of Linux distros and most are free, but to use three distros
    dominate the infrastructure of the internet: Ubuntu, Debian, and CentOS. CentOS
    is a distribution of Linux, which is derived from the sources of Red Hat Enterprise
    Linux. It is noted for being incredibly stable, predictable, and manageable. Since
    2004 CentOS Linux has been community-supported and free to use. From CentOS and
    its community, you can'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'get a fantastic operating system to manage websites, databases, and run other
    services, while also getting support from a growing community. Almost a quarter
    of servers running Linux, are using CentOS.


    There are a lot of distributions out there and some differences between them.
    I personally started in an Ubuntu environt when I began learning and consider
    the functionality between the two comparable, with strong differences in some
    of their user interaction. CentOS is becoming more of a standard for those who
    want to host sites and utilize products like cPanel and other hosting software
    tools. They have been standardizing on CentOS due to its slower release cycle.
    This book will explore using CentOS, and in the process teach general Linux usage..'
  merge: -1
