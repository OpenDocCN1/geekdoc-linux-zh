  md: '# CHAPTER 7


    # SYSTEM STATUS AT A GLANCE


    Log into your server, with the new user that we created in the last chapter. From
    here, through the rest of the book, we will not be using the root user id.


    Let''s take a look at a few settings and see how our server is preforming.


    First, we can take a look at our uptime system. This can be very useful in system
    administration. It lets you know how long the server has been online, how many
    users logged in, and the average system load.


    # Checking Uptime


    | Command | uptime |

    | --- | --- |

    | Result | System will display the uptime and load average data |

    | CLI Display | [tidus@centos:~]$$ |


    Next we can see what processes are using the most memory on our system by using
    the top command. This can be useful if your system is running sluggish to see
    what is hogging the system resources.


    The first lines will give you a summary of the resource utilization on your system
    and can sort the list of processes by CPU or memory use, which allows you to quickly
    see where your server is receiving the biggest demands on its resources.


    | Command | top |

    | --- | --- |

    | Result | System will display processes with the most CPU resources |

    | CLI Display | [tidus@centos:~]$ top |


    To exit top, press control and c.


    To check the systems memory resources, we can use the vmstat command.'
