  md: '# CONFIGURING AND INSTALLING CentOS To Oracle VirtualBox


    Now that we have downloaded the ISO and have OracleVirtualBox installed, we can
    set up our virtual environment. Launch VirtualBox and click the “New” button that
    we can configure a virtual machine to run CentOS.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_28_0.png)


    Once you click “New”, we need to name the machine and provide some basic information.
    See the image below as a guide. Remember that CentOS is based on the Red Environment.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_28_1.png)


    Once that is completed, click “Next”. The software will recommend the amount of
    memory to allocate to your virtual machine. I would personally allocate 1GB or
    1024MB at a minimum. When that is finalized, click next and then select “Create
    a Virtual Hard Disk”. Click create to allocate the virtual hard disk to the machine.


    Afterwards it will ask you for your preferred format. I personally stick with
    the VDI format, which is the default. Once that is selected, the next prompt asks
    if you would like a dynamic disk that only uses disk space as is used by the virtual
    machine. A fixed disk will automatically use the full space of the allocated disk
    on your machine. My preference is the dynamically allocated option.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '![](img/373347a8cccfab65b3dc27644fdd6a60_29_0.png)


    Once you have completed the wizard, you will need to mount the ISO to the virtual
    DVD drive. Basically this is the same as entering the installation media (DVD
    in this case) into a physical machine. In VirtualBox click “Settings”, then “Storage”,
    and then click “Add Optical Disk”.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_29_1.png)


    Select the ISO file and click ok. Now back at the main menu click “Start”.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_29_2.png)


    The virtual machine will begin to start.


    # # CENTOS 7 INSTALLATION


    Once the machine boots, you will see the screen below.'
  merge: -1
