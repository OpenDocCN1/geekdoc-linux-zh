  md: 'There is a lot of text in this file, but do not be intimidated. In the table
    above I arrowed down till I found the highlighted: root ALL=(ALL) ALL.


    Below that selection we need to add the following:

    tidus ALL=(ALL) ALL


    In visudo, you are always in one of modes: command or insert. Press I to insert
    text and ESC to goto command mode.


    Press the down key until you are in the blank space under root. Once there press
