  md: '# CHAPTER 10


    # MANAGEMENT VIA THE BROWSER


    There are many circumstances where you may wish to see server information or manage
    some things through the web browser. Often times for new users this is easier
    than the CLI. Users who master the CLI, will likely prefer to use it over a graphical
    management interface.


    Webmin is a web-based tool for Linux and Unix systems. It allows users to manage
    users, disk settings, the network, firewall, Apache, DNS, and many other items
    inside of a graphical interface.


    The next steps will walk you through installing this tool.


    To begin, we need to add the webmin repository information to CentOS. To do so
    enter the following command:


    ```

    sudo nano /etc/yum.repos.d/webmin.repo

    ```


    Then inside of nano enter the following:


    ```

    [Webmin]

    name=Webmin Distribution Neutral

    #baseurl=http://download.webmin.com/download/yum

    mirrorlist=http://download.webmin.com/download/yum/mirrorlist

    enabled=1

    ```'
  merge: -1
