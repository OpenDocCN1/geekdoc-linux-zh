  md: '# CHAPTER 5


    # GETTING TO THE CLI


    CLI stands for command line interface, where you can interact with the system
    by entering lines of text. This is how we interact with our server.


    If you decided not to use the recommended method of setting up a VPS, then you
    can see the CLI on your computers display. When you boot your computer, it will
    bring you to the CLI, where you can login.


    We can connect to the CentOS server using a protocol SSH. SSH stands for Secure
    Shell, which is an encrypted way that we can remote login to your server.


    For the next steps, refer to the information that we documented in the last chapter
    as part of our documentation boot camp. We will need the IP Address and login
    information. An IP Address, is a string of numbers that identifies a computer
    on a network. For our VPS, your IP Address is a public one, which can be accessed
    from anywhere with an internet connection. For a Virtual Machine, use the CLI
    interface that is displayed when you boot.


    The program I recommend to SSH into your VPS server is called PuTTY. PuTTY is
    a free SSH client that is open source and supported on Windows. You can download
    it from the following link:


    http://putty.org


    The file you download is an executable, (.exe) that does not require an install.
    Once you download it, you can drag it onto your desktop for quick access.


    Connecting to your VPS or Virtual Machine with this tool is very easy. Under Host
    Name or IP address, put the IP address that was provided. Select SSH as the connection
    type and then click open. See figure 1 for an example of what it should look like.


    **Note:** Your IP Address will be different than the one in the figure.


    Figure 1: Putty Configuration'
