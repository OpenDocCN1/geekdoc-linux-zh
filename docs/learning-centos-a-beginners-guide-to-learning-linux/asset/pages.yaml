  md: 'When you click on the name, you will notice that it looks rather empty. Again
    it is because we need to install the OS. VPS providers make this very easy. In
    Linode, we simply need to click the deploy link.


    ![](img/373347a8cccfab65b3dc27644fdd6a60_15_0.png)


    Click on ‘Deploy an Image’.


    From this window, we can select the Image we want, which is CentOS 7. Leave the
    defaults for now in the deployment disk size and swap disk. Enter in what you
    would like the password to be for root (which will be discussed later) and make
    sure that it is a secure password. Once all of is done click on the ‘Deploy’ button.


    Linodes >> linode1938051 >> Deploy


    ![](img/373347a8cccfab65b3dc27644fdd6a60_15_1.png)


    Once you click ‘Deploy’ the system will start the installation. Give this a few
    moments to complete, but for your installation work is done! If you choose to
    use Linode, then you can skip the next section on the alternative, DigitalOcean.
    Please note that there are more providers than just these two, but these are my
    personal preference for beginners.'
