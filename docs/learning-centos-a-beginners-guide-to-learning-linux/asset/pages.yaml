  md: '# CHAPTER 13


    # PREPARING FOR AND INSTALLING WORDPRESS


    There are a lot of different content management systems and platforms that you
    can install. Nearly 25% of all websites are online using WordPress as reported
    in 2015. This makes it one of the most widely used platforms. In addition to being
    very popular, there is a lot we can learn by installing this on our server for
    future reference as you roll out other systems. We already know how to make a
    database and user so now we need to know how to install a package like this.


    Before we install WordPress, there are a few packages you may need to install
    depending on your VPS or Virtual Machine install. Use the following to ensure
    that you have the proper configuration.


    The first thing we need to load is php-gd. This is needed for WordPress and other
    platforms to resize thumbnail images properly. We can install this with the following
    command:


    ```

    sudo yum install php-gd

    ```


    Be sure to enter your password and press y when prompted.


    So that Apache can see the new module, we will need to restart httpd.


    ```

    sudo service httpd restart

    ```


    Now there are a few more packages we need. The first is wget. Wget is a program
    that gathers content from webservers. It allows us to download files from the
    web to our server. To install wget, use the following command:


    ```

    sudo yum install wget

    ```


    Again, be sure to enter your password and press y when prompted.


    The next tool we will need to streamline the process is called rsync. Rsync is
    a utility that allows us to keep copies of files on the computer system and synchronize
    files to other folders. To install rsync, use the following command:


    ```

    sudo yum install rsync

    ```'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# DOWNLOADING WORDPRESS


    One of the reasons that I like WordPress for my tutorials is that it is easy to
    configure new users and the team at WordPress always keeps the most stable version
    of their software at the same link.


    Before we continue, make sure that you are in your home directory. Remember that
    you can get home at any time by entering `cd` into the CLI.


    Now that we are sure that we are in the home directory, we can use wget to get
    the most recent version of WordPress with the following command:


    ```

    wget http://wordpress.org/latest.tar.gz

    ```


    This downloads a compressed version of WordPress that we will now need to extract
    using the tar command. In Linux, tar stands for tape archive from the day when
    most system administrators would backup files to tape backup drives. For our purpose
    will allow us to gather the compressed files from the download and extract them
    to our home directory. We can do that with the following command:


    ```

    tar xvzf latest.tar.gz

    ```


    Inside of your home folder, you will now have a directory called wordpress. To
    finish the installation, we need to move the files to the Apache document root
    (/var/www/html). Using the handy rsync tool, this is very easy. Use the following
    command to sync the files over to the Apache directory.


    ```

    sudo rsync -avP ~/wordpress/ /var/www/html/

    ```


    Remember, capitalization is important. One small error in this command could cause
    an issue for you moving forward. After the command is run, rsync will do the work
    and copy all of the files into the /var/www/html directory.


    We still have one thing to do, we need to make an uploads folder for WordPress
    to store files. Using the mkdir command as we did earlier, makes this easy.


    ```

    sudo mkdir /var/www/html/wp-content/uploads

    ```'
