  md: '# GETTING THE ISO


    To either install CentOS using VirtualBox or to set it up on your own, you will
    need to download the operating systems file. An iso is the file extension used
    for files that can be burned to a CD or DVD, depending on the size. Essentially
    it is an image of the installation disc that you will need to install CentOS.


    For us to install CentOS on VirtualBox, we do not need to burn the ISO to a DVD
    and can mount it inside of the virtual environment. If you are looking to install
    it directly onto a machine or attempt a dual boot, then you will need to burn
    this file.


    To get the most recent ISO for CentOS, go to https://www.centos.org/ and click
    “Get CentOS”. I personally downloaded the Minimal ISO and recommend that for you
    to get started using the system and the tutorials in this book.


    There are multiple locations or mirrors to download the iso from. Choose one and
    download the CentOS 7 operating system ISO.


    Once you download the iso file, if you are not using VirtualBox, you will need
    to burn it to a disc. In the past, I have used Ashampoo Burning Studio Free, with
    success.


    If you are going to use VirtualBox, then follow the steps to mount the ISO and
    setup your virtual machine in the next section.'
  merge: -1
