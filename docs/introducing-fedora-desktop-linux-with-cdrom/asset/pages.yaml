    # Protecting Your Inbox


    One of the sad truths about working on the Internet messaging is no one ever immune
    to spam, or junk mail, as Evolution refers to it. There are ways to minimize it,
    the most important method to keep your email address to the vest. Sometimes that’s
    not possible, especially with work accounts. But if you have a personal email
    address, just give it to family and friends and never post it on the Web.


    When, not you start junk mail, Evolution initially will let it roll into your
    Inbox, leaving you wondering where all this vaunted protection is. Don’t worry,
    it’s there.


    Evolution uses a Bayesian filter to sort junk mail. A Bayesian filter looks at
    messages and decides if they are spam or not based on criteria it has learned
    over the course of time. But in order to learn, it has to be trained, and that’s
    where the user comes in.


    When you select a junk message and mark it as Junk, two things will happen: first,
    the offending message will be removed from the Inbox and moved to the Junk folder.
    Second, the Bayesian filter “learn” that messages with certain words and characteristics
    will be regarded in the future as junk mail. When more messages like come in,
    the Junk filter should automatically dump the spam into the Junk filter, leaving
    your Inbox cleaner.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '+   1. Right-click the example message. A context menu will appear.


    +   2. Select the Mark as Junk menu command. The message will be removed from
    the folder and input into the Junk filter.


    There are a few things to remember when working with Evolution''s Junk filter.
    To begin with, it takes a while to learn what''s really junk or not, so for the
    first few sessions it may not seem like it''s doing its job. Eventually, less
    spam will slip through as the learning process continues.


    Another important point: the Junk filter is not infallible, especially early in
    its learning process. Not only will spam go unmarked, but genuine emails may get
    treated as spam by mistake. Therefore, it is very important that you periodically
    scan the contents of your Junk folder to look for real messages. If you find any,
    sure to click on the Not Junk button when the message is selected. This will help
    Evolution''s Junk filter learn faster.


    # Using Thunderbird


    As learned in Chapter 10, “Surfing the Web,” the Mozilla Application Suite is
    the source for the open source Firefox browser. The Mozilla Foundation, the organization
    charged with maintaining the Mozilla code, still works on the entire suite, but
    with some developers feel that the suite itself (codenamed Sea-Monkey) was just
    too big to be fast and effective.


    Just as a development team spun off a light and fast Web browser from Sea-Monkey,
    another team took the code for SeaMonkey''s email and contact agent and created
    the Thunderbird application.


    Compared to Evolution, Thunderbird is lighter on features. If you are looking
    for an all-in-one personal information manager application like Outlook, Thunderbird
    may not be the best choice. But if you don''t need all of those tools, and you
    just want a fast email client, Thunderbird will definitely fit the bill.


    Unlike Evolution, Thunderbird is not included in the default installation of Fedora.
    You, will need to install it if you want to use it. Start PackageKit as demonstrated
    in Chapter 6, “Installing and Updating Software,” and search for the Thunderbird
    package. Once found, mark it for installation and allow the dependent packages
    to be installed as well.'
