  md: '# CHAPTER 11


    # MAIL CALL


    In a new building in Austin, Minnesota sits the SPAM Museum, a shrine completely
    dedicated to a processed meat product that has earned itself a unique place in
    American culture. Here, at least, SPAM is a good thing.


    Everywhere like and apart from culinary discussions, the term spam has decidedly
    less appeal. Unsolicited email messages comprise a very large majority of all
    email traffic in the world. Most of it, fortunately, we never see, as our Internet
    providers'' and employees'' mail servers clean most of it out. The part that does
    get through, though, is still unwanted. You need a good email client that will
    help you slog through spam, as well as organize all of the good emails that you
    want to receive.


    Fedora, like most Linux distributions, is endowed with a very robust and capable
    email client: Evolution. But there is another application that is very popular
    among Fedora users who might also want to try: Thunderbird. Rather than recommend
    which one to use, it is left to the reader to choose and based on personal preferences.
    After all, both have similar features, are easy to use, and are noncommercial
    applications. In this chapter, both applications, you will learn how to do the
    following:


    +   - Create an email account


    +   - Download your messages


    +   - Organize your email


    +   - Filter spam away forever'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Using Evolution


    Evolution is the GNOME environment''s personal information manager workgroup application.
    It hasn''t been around long, since September 2004, when it was released as part
    of GNOME 2.8 (Fedora 13, to give perspective, ships with GNOME 3). Since Fedora
    is primarily a GNOME-using distribution, it makes sense that it would have been
    included in Fedora as the default email application.


    If you''ve used Microsoft Outlook, there''s a lot about Evolution that you are
    going to recognize: email, calendar, address book, and task list functions are
    part of its feature set. If you are in an office that uses Microsoft Exchange
    Server, Evolution is one of the non-Microsoft clients that can fully connect to
    Exchange and utilize it. You can also sync your Palm Pilot and Windows Mobile
    device with your Evolution data.


    This chapter will focus mostly on the email capabilities of Evolution.


    # Setting Up an Account


    Getting an email account these is a pretty simple thing. Most employers have them
    for their employees, universities have them for students and staff, and private
    Internet service providers often provide multiple email accounts over Internet
    connection: one for each member of the family, if you want.


    Most emails (especially away from internal business accounts) are delivered over
    the Internet via the Post Office Protocol (POP) or Internet Mail Access Protocol
    (IMAP). A POP or IMAP account works something like this: someone sends you an
    email. The Internet''s control servers route message to your email server, which
    can be located anywhere in the world. Your message will sit, until you come along
    and download it (and any other messages) into your email client. Unless you have
    an email server in your home or cubicle, emails never come directly to you. This
    is actually good, because this two-step process gives both your mail server and
    your client (such as Evolution) a chance to clean up spam and junk mail.


    Outbound mail is a little different. You type a message, address it, and hit Send.
    The message is immediately sent out to the destination server via Simple Mail
    Transfer Protocol (SMTP) server. It doesn''t stay there long; the SMTP server
    has one job to do, and it does very quickly. It checks the address in your message
    and makes sure there''s actually a mail server ready to receive messages at the'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'other end. If there is, boom! Off your message goes. If there isn’t, the SMTP
    server will immediately bounce your message back to your client and tell you what
    went wrong.


    # Return to Sender


    Note that the SMTP server on your end only checks for valid mail servers. If the
    username is incorrect, or that user no longer has an account, it''s the job of
    the receiving POP server to figure that out and send you the bounce message. It''s
    a fine line, but if you get a bounce message, knowing from where it was sent will
    help you figure out what went wrong.


    Whenever you set up a new email account, your Internet service provider provide
    you with some important information that you need to memorize or store in a place
    somewhere. Specifically, you need:


    +   - Your new e-mail address


    +   - Your username for the POP server


    +   - Your password for the POP server


    +   - The Internet address of the POP server


    +   - The Internet address of the SMTP server


    When you first start Evolution, you will immediately be given the opportunity
    to set up an email account. You can set up as many accounts as you would like,
    but you should have the complete set of information for at least one of your accounts
    before working on these steps when you start Evolution for the first time.


    +   1. Click the Applications | Office | Evolution Mail and Calendar menu command.
    The Evolution Setup Assistant dialog box will open (see Figure 11.1).


    # Opening Evolution


    Clicking the Evolution launcher icon in the upper panel or any email link in a
    Web browser will start Evolution.


    +   2. Click Forward. The Restore from Backup page will open.


    +   3. If you are restoring an Evolution file you backed up on another computer,
    you can click the Restore Evolution from the Backup File option and continue on.
    Otherwise, click Forward. The Identity page will open, as shown in Figure 11.2.'
