  md: '# Understanding Software Repositories


    +   **Updates.** This repository contains any software that has been updated because
    of a bug or security fix.


    +   **Source.** All of the source code packages for Fedora software are found
    in this repository.


    # Adding Repositories


    These are not the only repositories that Fedora can use. There are many community-run
    repositories on the Internet for Fedora, each holding specialized software that
    the Fedora Project does not want to host.


    There are many software applications out there that can run on Linux, but because
    their licenses are completely proprietary, some Linux distributions won''t touch
    them with a 10-foot pole. By virtue of its origins, Fedora''s makers feel obliged
    to abide by this philosophy, keeping totally commercial packages away from Fedora.


    But there is an important distinction here. While the Fedora Project does not
    release commercial software with Fedora, that does not preclude letting users
    access to a commercial repository after they have downloaded and installed Fedora.
    A fine distinction, to be sure, but it gives users the advantage of making their
    choices about what software they want to use.


    All of the package managers in Fedora work over a master list of repositories
    stored on your PC. From this file, known as sources.list, the package managers
    know which repositories to check for new and if there are any updates available
    for software installed on your system. If you want these managers to peruse another
    repository, you will need to modify sources.list with the new information.


    Fedora users in the know are aware of three such third-party repositories that
    will get you to the latest in cutting-edge software for Fedora. These are the
    Dribble, Freshprms, and rpm.livna.org repositories. Fortunately, you won''t have
    to add these repositories one at a time. Instead, you can use one command to add
    RPM Fusion to your sources.list, which will accomplish the same thing.


    This operation will be done using a command-line application. Command-line applications
    are always run in a Terminal window, one of the simplest and most versatile tools
    found in Fedora. To start Terminal, click on the Applications | System Tools |
    Terminal menu command (see Figure 6.1).'
