- img_proc: true
  md: '# Not Just One Sheet


    The perceived universe has three dimensions: length, height, and depth. Some people
    define time as the fourth dimension, and scientists have theorized about the existence
    of objects called superstrings that may vibrate through as many as 11 dimensions,
    which is enough to make nonscientists'' heads turn.


    For now, we''ll apply just the three-dimension analogy to Calc. Because now that
    you have mastered the existence of the two-dimensional spreadsheet, it''s time
    to venture into the third dimension: multiple spreadsheets.


    The origin of multiple spreadsheets goes all the way back to the paper spreadsheets
    we talked about earlier in the book. When the early spreadsheets grew large—with
    hundreds and thousands of rows and columns—some accountants got the idea to start
    layering some of the calculations onto other sheets. In this manner, spreadsheets
    didn''t grow to huge sizes, but still maintained the detail accountants wanted.


    When electronic spreadsheets were created, this methodology carried over. Even
    though size is a less pressing issue on a computer screen thanks to scrolling,
    most people find it cumbersome to see all of the data in a reasonable area. And,
    because we often print spreadsheets, they still relate to the old paper medium.


    When using multiple spreadsheets, it is important to remember how the sheets interconnect
    (if at all). Some people simply place unrelated datasets on one sheet, while others
    use related data with many cross-references. If you do cross-references between
    multiple sheets, be careful that you don''t inadvertently erase or change a piece
    of data that a cell on another sheet needs.


    The use of multiple sheets is pretty simple. To view another sheet, simply click
    its sheet tab near the bottom of the screen. If you want to select more than one
    sheet (useful for printing), click a tab and hold the Shift key while clicking
    another tab. The two tabs and any in between become selected. To select nonadjacent
    tabs, hold the Ctrl key while clicking.


    New Calc documents have three sheets by default. Sometimes, you may need more
    (or fewer) sheets. The next steps guide you through this procedure.


    +   1. In an open Calc document, right-click the sheet tab adjacent to the location
    where you want to insert a new sheet.'
  merge: -1
  pgno: 362
