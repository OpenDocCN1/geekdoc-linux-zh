  md: '# How Fedora Installs Software


    In the Windows world, there is usually one way to install software: clicking on
    an installation application that starts up and runs the whole setup for you from
    start to finish.


    Fedora, like most Linux distributions, there are three methods of software installation.
    Admitted, one way to install sure sounds attractive and less confusing, but the
    one-size-fits-all installation service comes with a potentially bad price: Windows
    installation routines can often overwrite important pinnerings in the operating
    system for the sake of the application that''s currently being installed. This
    is good for your installed application, but potentially bad for any pre-existing
    application on your system that was using that same section of Windows'' code.


    In Fedora, all of the three installation methods take great pains to install applications
    using only what''s already in Fedora. If the application needs is not installed
    in Fedora already, it has what is known as a dependency. The installing user (that
    would be you) will be told about any dependencies and asked how to proceed.


    A description of the three installation methods is to provide:


    +   - Self-Contained Installation Program. This methodology is much like the method
    used by Windows. A special installation application is on run that automatically
    handles the application''s setup on your PC. This type of installation is not
    common on Fedora machines, some of the larger consumer applications (OpenOffice.org
    or Firefox) can be installed in this manner. There is one important difference
    from Windows: no existing software is changed by the installation application.
    Dependencies are usually handled well, but it''s not foolproof.


    +   - Compiled from Source. Remember how any user can get the source code of any
    free software application? Well, once you have that code, you can perform what''s
    known as a compilation to turn that code (which only humans, at least the smart
    ones, can read) into something the PC can read and work with. Software compilation
    isn''t hard, but it is time-consuming and at times, and dependencies are not automatically
