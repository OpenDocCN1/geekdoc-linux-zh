    # **Good-Looking Data**


    The human body has several quirks that we have to put up with daily. One of them
    is the wandering eye. This is not the wandering eye that gets people in trouble.
    Rather, it is the inability of our eyes to stay focused in any place for almost
    any length of time.'
  merge: -1
  pgno: 366
- img_proc: true
  md: 'Our eyes, it seems, always have to be moving, soaking up the world around us.
    This translates the need to create documents that attract our eyes so that they
    naturally want to look at the words on the page. It helps in most cultures, lettering
    attracts the eye, even if we can''t figure out the words. Though this is a learned
    response, the attraction doesn''t keep the eyes there for long. It becomes necessary,
    therefore, to keep the interest with something other than just letters. Sometimes
    it''s done by using outstanding content, other times by eye-catching colors (yellow
    fire trucks get more attention, for example, than red ones.


    One thing that eyes—and the brain behind them—detest is confusion. Place a jumbled
    document or spreadsheet before someone, and the frustration level goes through
    the roof. At that point, the person will most likely ignore the document. Our
    visual system wants things to be simple and consistent.


    You can establish consistency in a Calc spreadsheet in many different ways beyond
    the obvious use of colors and fills. One method is to use formatting of data.
    In this context, the format of data refers to how it appears.


    For instance, time can be expressed in many different ways. Right now, as I write
    these words, it is Monday, April 26, 2010, 8:46 in the evening, Eastern Daylight
    Time. Or is it 2046 hrs on 26/04/10? Time can be presented in thousands of different
    formats. You are free to choose whichever kind of format you want, but it is important
    to maintain consistency. If you use a 12:34 p.m. format in one cell with time
    data, then you should use the same format in other time data cells.


    Time is just one of the values in Calc that can have different formats. Dates,
    text, numbers, and currency can all be displayed in different ways, as you will
    learn in the next sections.


    # Formatting Text


    Text formats are perhaps the simplest to understand. Calc handles text in much
    the same way as Writer. Each cell can hold over 64,000 characters of text, so
    you can create whole documents within cells. But why would you want to?


    You accomplish text formatting using the same tools found within Writer, with
    some additional functions designed specifically for cell use.


    +   1. Within an open Calc spreadsheet, select a cell with data.


    +   2. Click the Bold button on the Formatting toolbar.'
  merge: -1
