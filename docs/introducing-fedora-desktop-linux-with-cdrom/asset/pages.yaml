  md: '# ## CHAPTER 15


    # # DOCUMENTING WITH WRITER


    It was a dark and stormy night...


    The urge to put words on paper is very strong in most cultures. Paper and ink
    lend a sense of permanence that we don''t seem to have in our own brains. Scientists
    speculate that we do indeed remember everything we have experienced, perhaps all
    the way back to Minute One. But, until we figure out how to *recall* all of that
    detail, we still need to write it down.


    The written word has more uses than just archiving memories and events. It''s
    still the most pervasive form of communication in the world. Every type of media
    uses writing as its basis, even television (though some writing is a bit shaky).
    The Internet has been the fastest growing medium in the world, and even with the
    advent of streaming audio and video, people mostly read the written works of others.


    Either on paper or on an e-reader device, this writing thing will be around for
    some time, and it''s important that you have the right tools to pull your words
    together so you can worry about what to write, as opposed to how to write it.


    The Writer component of OpenOffice.org makes a great tool to get your words on
    paper or computer screens around the planet. In this chapter you will:


    +   - Explore the basics of the Writer interface


    +   - Create and edit documents


    +   - Insert special elements in a document'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# The Writer Interface


    Contrary to what you might think, Writer is not a separate application in the
    OpenOffice.org suite. Think of it more as a set of clothes that OpenOffice.org
    puts on to go to work building a document. It''s still OpenOffice.org and shares
    many of OpenOffice.org''s functions, but with the new outfit on, it''s Writer.


    Part word processor, part desktop publisher, Writer is jammed with tools and functions
    to put a document together. This section will detail the tools found in the toolbars,
    menus, and shortcut keys that make up the Writer.


    # Exploring the Toolbars


    When Writer appears on the screen, you can get a good look at its interface and
    see how closely it resembles other word processing programs (see Figure 15.1).


    ![](img/8b4ddd0fa8fb72c4c17dda7353810618_318_0.png)


    Figure 15.1

    The Writer interface.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# The Writer Interface


    First, the Standard toolbar appears on the top of the window, and the Formatting
    toolbar adds even more functionality. Since the toolbars are a great resource
    while you work in Writer, let''s examine them more completely.


    # Standard Toolbar


    The first set of tools to examine is the Standard toolbar, a toolset tightly configured
    for Writer. Typically, the Standard toolbar appears at the top of the screen,
    although it can be repositioned (see Figure 15.2).


    Table 15.1 describes the basic functions of each of the buttons on the Standard
    toolbar.


    # Formatting Toolbar


    As you would expect, the Writer version of the Formatting toolbar primarily focuses
    on the manipulation of text and paragraph styling (just as the Calc Formatting
    toolbar concerns itself with row and cell manipulation).


    Figure 15.3 shows the Formatting toolbar for Writer. Table 15.2 describes the
    functions of the same set of tools.


    ![](img/8b4ddd0fa8fb72c4c17dda7353810618_319_0.png)


    Figure 15.2

    Standard toolbar.'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# Table 15.1 The Standard Toolbar Buttons


    | Name | Function |

    | --- | --- |

    | Toolbar Handle | A toolbar control allows users to move any docked toolbar to
    any position within OpenOffice.org and undock the toolbar as well. |

    | New | A single click opens a new Writer window and document. Clicking the drop-down
    control displays a list of OpenOffice.org documents that can be created. |

    | Open | Opens the Open dialog box, where existing documents can be opened. |

    | Save | Saves the current document. |

    | Document as Email | Starts the default email program (usually Evolution) and
    creates a new email with the current document as an attachment. |

    | Edit File | Turns the read-only status for the document on off. |

    | Export Directly as PDF | Opens the Export box to convert the document to a PDF
    file. |

    | Print Directly File | Prints the document to the default Fedora printer. |

    | Page View | Toggles between Preview and Edit modes. |

    | Spellcheck | Opens the Spellcheck dialog box and runs a spelling check on the
    document. |

    | AutoSpellcheck | Toggles the "check as you go" status for the document and off.
    |

    | Cut | Cuts selected text from the document. |

    | Copy | Copies selected text in the document. |

    | Paste | Pastes cut or copied text into the document. |

    | Format Paintbrush | Enables the application of a format to selected text. |

    | Undo | Regresses to the last editing change made to the document. |

    | Restore | Returns any undone changes. |

    | Hyperlink | Opens the Hyperlink dialog box, where you can insert an HTML hyperlink
    to selected text. |

    | Table | Opens the Insert Table dialog box with a single-click. A click-and-hold
    action reveals the row-by-column table ctrl. |

    | Show Drawing Functions | Toggles the Drawing toolbar on and off. |

    | Find & Replace | Opens the Find & Replace dialog box, which enables users to
    search for and replace text in a document. |

    | Navigator | Opens the Navigator tool, which displays various elements of the
    document in one location, allowing users to view and navigate to different sections
    of the document. |

    | Gallery | Opens the Gallery pane, which contains backgrounds, bullets, sounds,
    and other elements to insert in document. |

    | Data Sources | Opens the Data Sources pane that allows users to create form
    letters from various sources. |

    | Nonprinting Characters | Toggles nonprinting character visibility in the document.
    |

    | Toolbar Extension | Allows users to see the rest of the toolbar''s buttons if
    the OpenOffice.org window is not wide enough. |'
