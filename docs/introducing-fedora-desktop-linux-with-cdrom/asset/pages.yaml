    cp command, you can use wildcards to move multiple files rather than typing individual
    filenames.


    Table 9.2 lists some of the available options for the mv command.


    To move the file index.html to another directory without making a backup or being
    prompted in the event of an overwrite, the mv command, followed by the name of
    the file and its destination (where username is your login name):


    ```

    mv index.html /home/username/backup/

    ```


    Table 9.2 mv Command Options

    | Option | Name | Description |

    |---|---|---|n| -b | Backup | Creates a backup file of any files that would be
