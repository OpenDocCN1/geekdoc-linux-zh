  md: '# CHAPTER 18


    # ORGANIZING WITH BASE


    Fiction: databases are big, evil, scary things. Somewhere along your professional
    career, you may have heard this rumor. Database administrators may be regarded
    with awe at your company. The simple truth is, anyone can make a database and
    understand how it works.


    You will see for yourself in this chapter, as we explore the database component
    of OpenOffice.org, Base. Specifically, you will learn about:


    +   - The basic concepts of databases

    - The different components of a database

    - How to use the Base interface

    - How to build a database


    # Database Concepts


    Four different types of objects comprise databases. All of these objects working
    together make up the database. Any of them taken separately does not have much
    use.


    These objects are tables, forms, queries, and reports. Before examining the workings
    of an actual database, it will help to review the functionality of each object.'
  merge: -1
  pgno: 397
- img_proc: true
  md: 'You''re probably already familiar with tables. They are essentially simplified
    spreadsheets. A database table is simpler because the purpose of the rows and
    columns is set, whereas a spreadsheet has more flexibility in how you can use
    rows and columns. Also, spreadsheets allow cells to interact with each other,
    whereas database tables don''t. If you need mathematical comparisons, made put
    your data in a spreadsheet.


    In a database table, each row is a database record. A database record is a collection
    of related data. In a database of books, for example, one record could be:


    +   - Ivanhoe, Sir Walter Scott, New American Library, September 1987


    This record has five fields: Book Title, Author, Publisher, Published Month, and
    Published Year. All other records in this database table use the same fields.
    If a record needs to have more information, then the database table needs additional
    fields. In database programmer lingo, this is sometimes referred to as adding
    columns.


    A form is the interface structure between the user and the table. Though you can
    directly enter data into a table (and some prefer), a form gives the user visual
    cues to help enter data more quickly, rather than tediously crossing across row
    of the database table.


    At the very least, a good database needs tables and forms. If the database had
    just a table, it would be rather dull. If it had just a form, it would only be
    a shell surrounding nothing.


    Queries are little programming scripts that pull specific information out of a
    database. Don''t panic if you don''t think you can program anything. You can master
    queries once you understand the way they are structured. And Base has a wizard
    to help you with this.


    Once a query has gathered information, it needs to be displayed. This is done
    in a report, the final piece of the database puzzle. Reports are, again, similar
    to spreadsheets, in they typically present data in tabular form. Reports, however,
    are not interactive. They simply place the data requested by a query into a read-only
    file, which can be printed or displayed on-screen. If data needs to be changed,
    it has to be done in the table (through the form).


    Databases can have multiple versions of all of these objects. In a climatology
    database, you could have a table of known temperature highs and lows for a'
  merge: -1
  pgno: 398
- img_proc: true
  md: 'region and another table of rainfall amounts, each accessed by separate forms.

    The choices are limitless.


    To start understanding databases at the day-to-day level, let''s walk through
    the creation of a database to see how all of these components fit together.


    # Building Your Own Database


    Databases are excellent tools to use in the business world. If you have a small
    business, creating a database to keep track of inventory or customers is a vital
    task. If you''re using Fedora at home, a database could also come in handy. If
    you have a collection, you know how important it is to keep track of it. You may
    constantly acquire new items for the collection, trading with other hobbyists
    in order to finagle acquisition of the item you desire most.

    Whether you use it for home or office, Base makes database creation simple.


    To create a working database, you need to build the following items in your order:


    +   1. Database file

    2. Table

    3. Form


    You always need to build the database file first. You could, in theory, create
    the form before the table, but that would be cumbersome, and why do all the extra
    work?


    The remainder of this chapter is devoted to the creation of a comic book database,
    which is, essentially, an inventory database. As you follow along, watch carefully
    and think about how you would like to build a database for your own needs.


    # Choosing Database Formats


    OpenOffice.org is unique among office suites because of its compatibility with
    many other programs. Base is no exception, having the capability to create and
    read databases in several formats beyond its native Base format:


    +   * Adabas D

    * dBASE

    * Evolution LDAP'
  merge: -1
  pgno: 399
- img_proc: true
  md: '# Evolution Local


    +   - Groupwise

    - JDBC

    - Microsoft Access

    - MySQL

