  md: '# Choosing the Right Fedora


    After all the discussion about all those different kinds of Linux, I''m sure you''re
    thinking that at least it''s nice there''s just one Fedora.


    If only. But not to worry. The differences between the versions are not so great—your
    choice at this point will really just come down to personal preference. And the
    nice thing is you can switch to other Fedora versions if you want to try one later.


    # Yes, There''s More Than One Way to Spin Fedora


    You could almost say that Fedora is a victim of its own popularity. Because Fedora
    is so efficient and easy to use (even among Linux distributions), developers of
    all persuasions have taken a good thing and recrafted it into something they prefer
    even more. These variations of Fedora are known as spins, and follow the same
    release cycle as the main version (though they might be offset by a few days here
    and there). Most of the differences between the flavors of Fedora are purely cosmetic
    sometimes it''s a different desktop environment, sometimes it''s a different set
    of installed applications.


    It is important to note that these spins are not completely different versions
    of Fedora; they are just Fedora pre-packaged in different ways. You can, if you
    wish, download and install all of the software needed to create identical versions
    of these spins. But having the spins already will save you a great deal of time
    and effort.


    While this book will focus on the original Fedora Desktop, it won''t hurt to take
    a quick look at the other variations, in case you see something you''d like to
    try later.


    # Desktop Environments


    Before we discuss the differences between the Fedora spins, it would be a good
    idea to discuss what is different—specifically, the graphical interfaces that
    users work with when they work with any kind of Linux.


    Most computer users are used to seeing just one graphical interface when they
    run their PCs. Windows 7 Home Edition users get to use the basic Windows interface,
    Windows 7 Premium and Ultimate use the fancier Aero interface, and OS X users
    use Aqua. Graphical interfaces are the technical name for the windows, menus,
    and icons that so many computer users have grown accustomed to.'
