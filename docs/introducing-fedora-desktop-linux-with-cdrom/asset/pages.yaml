  md: 'virus attacks, computer theft, or anything else that could affect your ability
    to access the data on your machine.


    Installing Fedora certainly can''t be classified as a catastrophic event. But
    depending on how you are going to be changing your hard drive''s partitions or
    perhaps even formatting your hard drive, these events can and will erase data
    completely.


    The first thing you decide is what data should be backed up. That really depends
    on what you want to do in your Fedora installation. Especially if you plan to
    perform a dual boot (running Windows and Fedora on the same PC), then you will
    need to make sure you''ve safeguarded most of your Windows data.


    # Completely Replacing Windows


    Even if you plan to completely remove Windows and install Fedora in its place,
