  md: '# Using Firefox 17


    be fast and effective. Even the Mozilla browser (or its commercial offspring Navigator,
    which was still being produced by Netscape''s new parent company, America Online)
    was considered by many to be rather slow and cumbersome.


    In 2002, two developers, Blake Ross and Dave Hyatt, started working on a new kind
    of browser, a stripped-down, lean and mean bit of code that was called Phoenix.
    And though the name didn''t stick, it would prove to be prophetic.


    Two years and two name changes later (Phoenix was already taken, and so was the
    next chosen name, Firebird), Firefox 1.0 was released for Windows, Mac OS X and
    Linux. It was very fast and minimalistic: every just had a bit Back button and
    a Location Bar. Everything else was just fluff. What kept people flocking to this
    sleek little browser were two things: browsing, where one browser could have many
    open Web pages; and the capability to add extensions to Firefox. These were not
    like the HTML extensions of the prior century: these extensions were actually
    small apps that worked in the same way as the old Netscape plug-ins. Need to view
    a certain type of media on a Web page? Download and install an extension. But,
    unlike plug-ins, extensions were easily installed and managed in a uniform way,
    while Netscape plug-ins were sometimes inconsistent with regard to these features.


    Slowly, but surely, it became apparent that Firefox was rising quickly to become
    a serious challenger to IE. IE''s nearly constant security failures didn''t help:
    because of that fatal decision to integrate IE into Windows—a decision that started
    the whole trouble with the Justice Department—crackers could easily use IE''s
    vulnerabilities to break into Windows. Firefox, a completely separate application,
    had no problems in Windows (and certainly not in Fedora).


    The Browser Wars, it seems, are back. Only this time, the battle is being fought
    over features, not the shifting sands of HTML standardization.


    # Browsing


    Browsing is more than just clicking through a collection of hyperlinked files.
    What really makes the whole thing work is the Uniform Resource Locator (URL).
    URLs are pseudo-English labels that make it possible to find and retrieve resources
    across the Internet in a consistent, predictable, and well-defined manner. Every
    Web server has an IP address, but URLs make it easy for regular folk to type an
    address into the Location Bar of Firefox and bring up a page.'
