  md: '# CHAPTER 7


    # MAKING THINGS WORK


    Fedora is not perfect.

    It will come as a surprise to some reading a Fedora book when this passage is
    found, the truth must be told. Installing any operating system on an untried computer
    is a bit of a risk to begin with, because unforeseen hardware conflicts can trip
    up any operating system installation. (Just ask recent Windows 7 users who are
    finding hardware and software compatibility problems with their new purchase.)

    If you installed Fedora on a desktop PC, then you may not have had any problems
    or concerns show up thus far. And that''s great because eventually all of the
    trouble spots mentioned here won''t be affecting users in the near future.

    Even if you are not having difficulties making something work, this chapter will
    still be useful to you. There''s some unfinished business for most users to contend
    with:


