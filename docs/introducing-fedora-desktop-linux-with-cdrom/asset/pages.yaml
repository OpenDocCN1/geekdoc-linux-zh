    # Setting Up a Network Printer


    The steps involved in connecting to a remote printer somewhere out on a network
    are very similar to getting a local printer connected. You just have to identify
    where on the network that printer is.


    Most of the time, Fedora will do the work for you and detect networked printers.
    If that''s the case, then follow the steps outlined in the previous section to
    connect to a detected network printer. If for some reason the printer wasn''t
    found, follow these steps:


    +   1. Click the System | Administration | Printing menu command. The Printing
    window will open.


    +   2. Click Add. After entering your administrative password twice, the New Printer
    window will open.


    +   3. Expand the Network Printer list and click New Printer. The Network Printer
    page will appear (see Figure 7.11).


    +   4. Enter the IP address on your computer. Click Find, and your system will
    begin to search for a network connected printer. When found, the printer will
    appear in the Devices list.


    # **Finding Your Printer''s Address**


    To find the IP address of your printer, contact your system administrator. If
    this is on a home or small business network, refer to your printer''s documentation
    to find out how it can report its IP address. Most network-connected printers
    have utilities to report on the network they reside.'
