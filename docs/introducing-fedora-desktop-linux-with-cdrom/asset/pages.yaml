  md: '# Chapter 4 = Desktop Basics


    +   **Clock.** The name pretty much says it all—a panel accessory that informs
    users of the time and date. It does more, such as tap into Evolution, Fedora’s
    personal information management application, for access to current appointments
    and tasks. It will even tell you the weather forecast.


    There''s more, much more to the GNOME desktop than just these features listed
    here. But these are the basics you will need to know first, as you continue your
    exploration of this new interface. Now it''s time to learn how to customize the
    desktop and make it your own.


    # Resolution


    The screen resolution in Fedora is not strictly a desktop function, since changing
    the size of the screen resolution actually affects everything in Fedora, not just
    the desktop. Before you do anything else, let''s see if we can make your viewing
    experience better.


    Screen resolution is tech shorthand for the number of pixels displayed on the
    screen at any time. It is usually denoted as width × height, in pixels. So, a
    common resolution of 800×600 displays 800 pixels of graphic information across
    your monitor screen and 600 pixels down (for a total of 480,000 pixels over the
    whole screen). That''s a lot of pixels, but truth be told, 800×600 is a bit below
    average in terms of today’s powerful graphics cards and monitors.


    These days, 1280×1024 is a good resolution, and resolutions of 1600×1200 and are
    becoming popular as well.


    The net effect of these resolutions settings is, the higher resolution, the more
    pixels can fit on a screen. The more pixels, the smaller the objects on the screen
    will look. Thus, with a higher resolution, you can fit more information and windows
    on your screen.


    When Fedora is first installed, it typically does a good job of probing your monitor
    and graphics card and figuring out resolution is the best fit for your hardware’s
    capabilities. There is a lot of hardware out there, though, and sometimes Fedora
    misses the mark. Before moving on to specific desktop settings, let’s check the
    resolution.


    As you can see in Figure 4.7, the resolution for the desktop shown is a bit low—objects
    are very large, and there’s not a lot of screen “real estate” available. Your
    monitor may be able to handle something larger.'
