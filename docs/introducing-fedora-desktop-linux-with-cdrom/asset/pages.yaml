    # A Brief History of Linux


    The beginnings of Fedora actually began in Helsinki, Finland. It was there, in
    1991, that a young computer student at the University of Helsinki put the word
    out to an online newsgroup asking for input on a new operating system he was building
    for his home PC: a copy of the Minix operating system that, until then, could
    only be run on, high-end machines.


    That was in August. The next month, the first version was released with no public
    announcement; only the group working with the student was privy to the release.
    On October 5, 1991, version 0.02 of the brand-new code was publicly announced.
    The rest, as they say, is history. The student, Linux Torvalds, based on his master''s
    thesis on the project, now dubbed Linux.


    By the end of the decade, Linux was found on thousands of computers around the
    world, serving in many capacities, most notably the operating system on which
    most Web site software runs. Current estimates show anywhere from 70–80 percent
    of the world''s Web sites run on top of some version of Linux. Linux himself serves
    as project manager for the Linux kernel—the very heart of the operating system—even
    businesses ranging from IBM to neighborhood churches use Linux operating systems
    every day.


    Linux has grown to a multibillion dollar year business, which is not bad for a
    piece of code that is available absolutely free of charge to anyone who wants
    it.


    You read that right: Linux is indeed free, and in more than one sense of the word.
    This is understandably puzzling to make money from this operating system, since
    the concept of making money from something that''s free seems counter. How does
    this work? To answer, let''s take a look at how Linux is put together.'
