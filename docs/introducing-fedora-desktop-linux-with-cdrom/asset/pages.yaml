    To get a proper list for compatibility issues with Fedora, you will need to dig
    a little further. For some, this can be the most intimidating part of the installation,
    but really, it''s not too bad.


    As you begin examining your computer, you will first notice a lot of the information
    you need to know is right in front of you. Your monitor, for instance, is sitting
    on your table or desk with its brand name and model displayed on the front or
    back. Likely, the same is true for your printer and any'
