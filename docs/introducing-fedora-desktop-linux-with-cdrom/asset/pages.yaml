    detective work will go a long way toward making your Fedora installation easier.


    # Backing Up Your Data


    After you have ascertained your hardware setup, you will need to take the next
    step to get your computer ready for the installation: backing up the data on your
    PC.


    It is always a good idea to back up your valuable data, guarding against system
    catastrophe. At the very least, you''ll want your data protected from power surges,'
