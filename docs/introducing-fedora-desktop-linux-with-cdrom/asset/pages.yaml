  md: '# Setting Up a Digital Camera


    Removing the drive just has one extra step. You could just pull the physical connection,
    and likely that would be okay. To allow Fedora to make sure all data is flushed
    from any buffers and written to the drive before it is removed, you can have Fedora
    to remove its own awareness of the device. Then you can physically remove it.


    In Nautilus, click on the Eject icon next to the USB drive''s icon in the Places
    pane. The device icon will disappear from the desktop, and the device can be physically
    removed.


    # Setting Up a Digital Camera


    Digital cameras are very commonplace these days, and being able to move your photos
    to your computer is a necessity, since that''s where any editing and long-term
    storage of your snapshots is going to take place.


    Fedora handles digital cameras in one of two ways. If you do not recognize the
    specific camera model, it will treat a connected digital camera like a USB storage
    device. When this happens, you can simply use the file manager to transfer photos
    from your camera''s drive to your hard drive.


    If Fedora does recognize your camera, then you will have access to some nifty
    tools that will speed your digital camera work right along.


    +   1. Connect your camera to your computer and turn on the camera''s power. If
    properly detected, the Digital Camera dialog box (shown in Figure 7.13) will open.

    2. Confirm the Open Shotwell Photo Manager option is selected and click OK. The
    Shotwell window will open (see Figure 7.14).


