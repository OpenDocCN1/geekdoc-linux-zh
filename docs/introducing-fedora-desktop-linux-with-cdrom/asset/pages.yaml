  md: '# Understanding the GNOME Desktop


    First off, it’s not “gnome”, like those old little blue-coated, red-hatted critters
    that run around the Scandinavian countryside. It’s “guh-nome,” heavy on the

    “G” and light on the “uh.”


    GNOME is the brainchild of Miguel de Icaza, a Mexican computer engineering student
    who took one look at the KDE environment and really liked what he saw—until he
    discovered the non-free code sitting (at the time) within.


    De Icaza, a devoted follower of the free software ideals, decided that what was
    needed in Linux was a similar desktop environment that had none of the licensing
    limitations of KDE.


    GNOME first debuted in August 1997, when de Icaza first made the announcement
    about the project he was working on the comp.os.linux newsgroup. By December of
    that year, the first workable test version was made available to the Linux community.
    It would not be until March of 1999 that version 1.0 would be released to the
    general public, but by then the word had gotten out, and thousands of free software
    devotees joined on board the GNOME bandwagon.


    GNOME, like KDE, is a desktop environment. It is not a window manager, like Enlightenment
    or Metacity. Window managers control the look and feel of the windows, menus,
    and other visual components of a graphic interface. Desktop environments provide
    a stable platform for applications to operate within. If an application is written
    for a desktop environment, therefore, it can tap into a wide range of common features
    with other applications in that environment.


    In the Linux community, GNOME is lauded for more than its free software status.
    It has historically been regarded as more aesthetically pleasing than KDE, as
    the themes available for GNOME have more of an eye-candy appeal. Recent versions
    of KDE would seem to dispute this, which you will learn if you should try Fedora
    KDE.


    Beyond the look of GNOME, de Icaza pushed new boundaries for the perception of
    free software in the corporate world. A year after the release of GNOME 1.0, de
    Icaza partnered with several major corporations to form the GNOME Foundation—a
    nonprofit organization dedicated to the ideal of keeping GNOME development moving
    forward in a rapid and open way.'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'The GNOME Foundation, with high-power members such as Red Hat, HP, and IBM,
    wants to make GNOME the interface for Linux and make that interface very easy
    for users to adapt to.


    One of the major hurdles for people using Linux is the perception that it is too
    hard to use, a perception the GNOME Foundation wants to change. By offering software
    developers a stable and communicative environment within to create new GNOME apps,
    the GNOME Foundation serves as an incubator of sorts for bringing more user-friendly
    applications to the GNOME interface.


    It is for many of these same reasons that Fedora’s default desktop is GNOME. Let’s
    take a brief tour and learn how to change the look of the desktop along the way.


    # Desktop Settings and Features


    When you look at the GNOME desktop, you will see how simple and clean it is (see
    Figure 4.1). That''s because the interface designers decided to present the tools
    you need in unobtrusive way as possible. No Recycle Bins or My Documents will
    be found here—unless you want them.


    Some of the elements of the desktop will be familiar in function to you, if you
    have used Windows or OS X in the past. Some controls and features will be less
    familiar, but once you get an idea of how they work, this will soon.


    +   **Applications Menu.** This menu is very similar in form and function to the
    Start menu in Windows. In this menu, nearly all of the graphical applications
    installed on your Fedora machine can be found, arranged by category (see Figure
    4.2).


    +   **Places Menu.** This menu will allow you to navigate quickly to specific
    directories on your machine and others, depending on how you configure it (see
    Figure 4.3).


    +   **System Menu.** The system menu is an important component of the desktop,
    giving the user access to a variety of configuration settings, as well as power
    control and general Help access (see Figure 4.4).


    +   **Panels.** The Panels in Fedora are where a lot of Fedora controls (menus,
    launchers, switchers, etc.) reside. Panels can be customized to have different'
