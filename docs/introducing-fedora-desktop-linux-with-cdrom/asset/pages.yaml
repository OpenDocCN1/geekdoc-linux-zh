    # The Fedora Connection


    Fedora actually began its existence as a simple collection of software.


    One of the community outreach projects started by Red Hat as it was working to
    keep community interest high was the Fedora Linux project, a collection of newer
    and more experimental software that, when installed on Red Hat Linux, would give
    users a chance to enhance their computers without introducing risky software to
    the main Red Hat Linux distribution.


    It’s important to note that Fedora Linux was not a stand-alone version of Linux,
    like other distributions, but was actually what’s known as a repository of software.
    But it would play a key role in what was to come next.'
