    # The Good, the Bad, and the Ugly


    It''s not a Clint Eastwood movie revive. "Good," "bad," and "ugly" refer to the
    levels of freedom of which these plug-ins have in terms of licensing. Codes in
    the good plug-in are completely free, while the bad plug-in''s codes are more
