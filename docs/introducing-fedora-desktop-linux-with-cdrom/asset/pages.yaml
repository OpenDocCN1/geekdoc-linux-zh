  md: '# Introducing OpenOffice.org


    Novell. But through it, Evolution has remained closely tied to its GNOME origins,
    and since Fedora Desktop is primarily a GNOME distribution of Linux, it makes
    sense that it would be featured prominently here.


    Chapter 11, “Mail Call,” will demonstrate how to use Evolution and other email
