  md: '# Special Hardware Concerns


    # Modems


    Unfortunately, nearly every internal modem in a PC is going to have problems running
    in Linux. That''s because these devices, as well as software-only modems referred
    to winmodems, have drivers written only for the Windows environment.


    There are two ways around this problem, should you need a modem for your Fedora
    PC. One is to acquire an external modem. These modems, as a rule, do tend to work
    in Fedora, because they plug into a PC (through the serial or PCMC port), allows
    Fedora to communicate more freely with them.


    If you don''t want to spend the money, you can try the solutions presented by
    the Linmodem Project (linmodems.technion.ac.il/Linmodem-howto.html), a community
    service designed to get those winmodems running on Linux PCs.


    Basically, there are two big steps to getting a winmodem to run on Linux. First,
    you need to run an application called scanModem to determine exactly what kind
    of internal modem your system has (unless the modem is an ISA-type device, in
    which case no solution will help). Second, you need to apply specific solutions
    based on the modem''s manufacturer.


    To download and run scanModem, open the Terminal and follow these steps:


    +   1. Type


    ```

    wget -c http://linmodems.technion.ac.il/packages/scanModem.gz

    ```


    The package will be downloaded to your home directory.


    +   2. To decompress the .gz file, enter


    ```

    gunzip scanModem.gz

    ```


    +   3. Now type


    ```

    chmod +x scanModem

    ```


    +   4. Become the administrative user by entering su and then your administrative
    password.


    +   5. To run scanModem,


    ```

    ./scanModem

    ```


    Several new folders will be created in the home directory.'
  merge: -1
