- img_proc: true
  md: '# Getting Fedora


    In this method, known as peer-to-peer or distributed downloading, no one computer
    has the burden of being the source for a given file or files. The traffic load
    is shared among all the members of the swarm. The neat thing is that more computers
    in the swarm acquire 100 percent of the files they need, those machines in turn
    become seeds. In this way, the process actually gets faster as time goes on.


    There are many BitTorrent clients available for the three major operating systems,
    and you may have one already. That which can be recommended is Vuuze, a robust
    BitTorrent client that can be used on Linux, OS X, and Windows. It''s also (as
    a huge bonus) open source software product.


    # Getting Vuuze


    > To obtain your copy of Vuuze, visit www.vuze.com with your favorite browser.


    After you obtain a copy of Vuuze or any other BitTorrent client, you will need
    to find and download what is known as a tracker file. A tracker file, which is
    very small, tells your BitTorrent application where seeds and swarms have the
    files you need are located on the Internet.


    Locating a BitTorrent tracker file is pretty simple, since Fedora keeps a list
    of them on its site. You just have to make sure you get the right one.


    +   1. Surf to the Get Fedora page at http://fedoraproject.org/en/get-fedora.

