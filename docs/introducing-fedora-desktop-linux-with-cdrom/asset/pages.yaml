  md: '# Chapter 6 = Installing and Updating Software


    the future would be delivered on one complete set of CDs (or, later, one or two
    DVDs). The advantage here was that once you downloaded and burned all of those
    CDs, you would be all set to run that distribution without having to download
    additional software later. But the average CD download, discussed in Chapter 2,
    “Before You Install Fedora,” is nearly 700MB. That’s a lot of data, even for today’s
    broadband connections. Having to do this for three, five, or even seven CDs is
    a very time-consuming undertaking for most users, unless they are willing to pay
    to have those same CDs delivered by mail.


    Fedora flips the model around a bit. Working with the knowledge that a majority
    of Internet users now have broadband access, the Fedora Project has decided to
    send out the absolutely necessary Fedora applications on one CD and leave the
    rest online on servers scattered around the world for download as needed.


    This may seem inefficient, since you must have Internet access of some kind to
    make this work. But consider that most operating systems update themselves via
    Internet anyway, and in order to keep Fedora up to date, online access was needed
    anyway. And only downloading and burning one CD is a lot faster than downloading
    and burning CDs plural. Delivering a “core” distribution also gives users much
    greater flexibility in picking and choosing what applications they want on their
    system. It also means their hard drives won''t be loaded with stuff they don''t
    need.


    To give you an idea of just how much software is available, consider these numbers:
    a standard installation of Fedora has around 1,100 packages. Currently, there
    are over 12,000 application packages available.


    Fedora, like its sibling Red Hat Enterprise Linux, organizes its software in repositories.
    There are three primary repositories for Fedora, each holding a specific class
    of software. Let’s walk through them now.


    # Touring the Repositories


    The three official Fedora repositories are pretty clearly named, but let’s examine
    them anywhere.


    +   - Fedora. This repository holds all of Fedora’s officially supported software.
    Everything that Fedora must have to actually run is in here, and all of the software
    is under a free software license. Additional applications in this repository include
    AbiWord, Evolution, Firefox, Gaim, OpenOffice.org, and Thunderbird.'
