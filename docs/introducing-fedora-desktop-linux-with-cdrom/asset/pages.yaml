  md: '# Making Room for Multiple Operating Systems


    There are several pros and cons for using multiple operating systems on one computer.
    The cons include the headaches of installing two or more operating systems on
    a machine, resulting in more limited hard drive space available for each of the
    operating systems.


    But the benefits of using multiple operating systems are significant. For instance,
    you will have the ability to run all of the programs available for each of the
    operating systems you''ll have on your PC. You will also be able to use all of
    the hardware your PC has. Finally, you''ll save money by not needing to buy another
    PC.


    It is recommended that dual booting is the way you should go—especially if you
    have Windows applications that you just can''t part with and have no counterparts
    in Fedora. This option gives you the benefits of using Fedora without a lot of
    investment in time and money.


    If you decide to include Fedora on your PC in addition to Windows, you will need
    to make room for it on your hard drive. Making room for your hard drive for Fedora
    is a far different operation than making room for the latest computer. You will
    need to create a brand-new partition from which Fedora will operate.


    Here is a crash course in disk partitions and why you can''t write data to a disk
    without them.


    # Why Partition?


    Imagine the bee, buzzing around your garden. If you were to follow this bee back
    to its home, you would find a seemingly chaotic mass of buzzing insects, each
    looking as if it aimlessly wanders about nothing better to hang out and buzz.


    But as we all know, bees all have a specific purpose, working together for the
    collective benefit of the hive. One group of bees has the job of taking care of
    all of the cute little baby after the queen lays eggs. Now, think back to your
    science classes: Where are the babies raised?


    If you said the honeycomb, you''re right. If you''re wondering what this has to
    do with partitions, hang on.


    The honeycomb is an ingenious device composed of hexagonal cells made of beeswax,
    where honey and bee larvae are stored for safekeeping. Consider: How would the
    bees get by if they did not have honeycombs? The answer is they wouldn''t.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# One or Two Operating Systems?


    Keeping the honeycombs in mind, you can apply this analogy to how data is stored
    on a disk drive. Data, you see, cannot be stored on a drive without some sort
    of structure already in place for the data to be organized.


    When data is placed on a drive, it is written into this structure, called a file
    system in the Linux community. A file system is the format in which data is stored—a
    honeycomb of cells if you will, where each little piece of data gets placed.


    Computers being computers, for example, does not get stored in data blocks that
    sit right next to each other. For a single file, the data may be stored in data
    blocks 456, 457, and 458 and then block 6,134, then block 7,111, and so on. (This
    is an oversimplification, but you get the idea.) It’s the job of the file system
    to track where each file resides so when you send a command to work with a file,
    the file system knows all of the separate blocks where the file is stored.


    Because of all of this file tracking and retrieving, computer engineers came up
    with the idea of keeping the file systems small, even on large hard drives. So
    the idea of partitions came into play. Basically, the partition is a virtual barrier
    that tells the file system: “You used to be able to write to blocks 1–25,000 over
    all the disk, but you’re only allowed to write to blocks 1–17,500. A second file
    system will write to blocks 17,501–25,000, so hands off!”


    Thus, you have partitions. And each partition can use a different file system.
    By an analogy, honeycombs created by bees are different than those created by
    wasps—similar structure but different outcomes.


    If your PC contains a typical installation of Windows, your Windows file system
    is contained within one big partition that covers your entire hard drive. This
    leaves no room for another partition and a new file system. Remember, if you have
    gigabytes of empty space on your drive, this, like files and directories, may
    be scattered throughout the drive and still belong to the Windows partition.


    The easiest method to add a partition to your existing hard drive file system
    is to use the partitioning tool within Anaconda. This will show your existing
    partition into a single, smaller collection of data blocks, leaving empty and
    unstructured (unformatted) space elsewhere in the drive where you can install
    a partition in which Fedora can reside.'
  merge: -1
