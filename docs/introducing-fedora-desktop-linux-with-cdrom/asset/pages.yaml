    least of which were added HTML extensions that Netscape would support, such as
    tables, colors, text size, and (Lord help us all) blinking text. None of these
    functions was included in the original HTML specifications; Netscape added because
    they looked good. And they did look good (except for the blinking) and eventually
    led to the adoption of these extensions by early Web developers, who in turn encouraged
    visitors to their sites to download and install Netscape to see their cool new
    Web site. This viral marketing had its effect—soon, Navigator controlled more
    than 90 percent of the browser market.


    Around this time, Microsoft realized that this Internet going was a good idea,
    and they were clearly missing the boat. To lure people away from the Web itself,
    the company started the Microsoft Network. MSN 1.0 was a flop, however, which
    prompted Microsoft to go-to-head against Netscape.


    Meanwhile, fearful of a complete lack of standards for this rapidly growing facet
