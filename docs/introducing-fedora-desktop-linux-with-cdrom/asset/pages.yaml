    ```


    # Touchy Files


    The expression touch is not I coined. In UNIX-like operating systems, like Fedora,
    a file is said to be touched when it is modified or viewed by a user in some way.
    A file is not touched when just list the contents of a directory file is in or
    view the contents of the file.'
