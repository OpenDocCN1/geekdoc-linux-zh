    items, or the brand-name of a new company? The next steps show one quick way to
    find out.


    +   1. With a Calc spreadsheet open, click Tools | Options.


    +   2. In the Options dialog box, select the OpenOffice.org Calc | View menu tree
    options (see Figure 16.16).


    +   3. Select the Value Highlighting check box in the Display section of the dialog
    box.


    +   4. Click OK. The spreadsheet will now display all data values in a new color.


    # Formatting Numbers


    “Mathematics,” Galileo Galilei once said, “is the alphabet with which God has
