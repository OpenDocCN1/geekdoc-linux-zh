    # Deleting Files


    Like operating systems, deleting a file or a directory in Fedora doesn’t really
    delete it. Instead, the file is moved to the Trash directory, where it will sit
    until you decide to delete the contents of the Trash directory permanently.


    This eliminates most worries about accidentally erasing something that you don’t
    want to disappear.


    There are three ways to send a file or directory to the Trash directory.


    +   Click the file and press the Delete key.


    +   Drag and drop a file onto the Trash icon.


    +   Right-click the file and select the Move to Trash command on the text menu.


    If you decide to remove the files from the Trash directory permanently, follow
    these quick steps:


    +   1. Click the Trash icon in the lower panel. Nautilus will open, displaying
    the contents of the Trash directory (see Figure 9.3).


    +   2. Review the contents of the directory. Be sure that everything is safe to
    delete.


    +   3. Right-click on a file and click Restore to move it automatically back to
    the location from which it was deleted.


    +   4. When ready, click Empty Trash. A warning dialog box will appear (see Figure
    9.4).


    +   5. Click Empty Trash. The files will be permanently deleted and the Trash
    directory emptied.'
