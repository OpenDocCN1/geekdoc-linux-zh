  md: '# CHAPTER 17


    # PRESENTING WITH IMPRESS


    They’re not called meetings anymore, you know. The “in” business crowd refers
    to them as collaboration sessions or community meet-ups.


    Nor are these discussions held in traditional conference rooms. More and more,
    corporations are turning away from the same old long table and swivel chairs in
    favor of more comfortable surroundings.


    Corporations around the world have begun to recognize that how we meet is least
    as important as why we meet.


    Why we meet is to trade new ideas and improve the condition of the environment
    we share with others. (That, and free donuts.) And fancy collaborative fads aside,
    meetings work better when the many settle down and listen to one person every
    once in a while.


    Which means that one person has to get up and speak before the many. Often-times,
    the person will give a full-fledged presentation. And that is where OpenOffice.org’s
    Impress application comes into play.


    In this chapter, you will:


    +   - Explore the Impress interface


