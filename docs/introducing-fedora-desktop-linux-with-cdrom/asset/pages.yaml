- img_proc: true
  md: '# Choosing the Right Fedora


    In these operating systems, you get the interface that comes with the OS. You
    can change the colors and the sizes of some items (bigger icons, for instance),
    but at the end of the day, you''re still using the same interface.


    In Linux, this is not the case: There are literally dozens of interfaces for you
    to choose from. This goes back to the modular nature of Linux. Unlike Windows
    7, the interface applications are separate from the core operating system. So,
    if something creates a glitch on a Linux environment, known as a desktop environment,
    the core operating system is not affected.


    These desktop environments do more than just look different; they are managed
    by completely different tools, and each carries its own set of specialized applications.
    For example, a text editor (like Windows Notepad) called *Gedit* is available
    for the GNOME desktop environment, and in the K Desktop Environment (KDE) the
    same kind of editor is known as *Kate*. (The first letter of an application is
    often a clue to the preferred environment for that.)


    Confusing? It shouldn''t be. The good news is that applications for one desktop
    environment usually work in other environments without a hitch. (The author, for
    instance, prefers to work in KDE but won''t want the Gedit text editor. The two
    work together quite well.)


    # Fedora Desktop


    The Fedora Desktop is the primary version among the Fedora “family” of spins,
    the one from which all the others are based.


    One of Fedora’s main characteristics is that it uses, by default, the GNOME desktop
    environment. GNOME, along with its predecessor KDE, is one of the most popular
    desktop environments around Linux and other UNIX-based operating systems. It’s
    often regarded as an easier-to-use environment, with fewer controls for users
    to worry about. Free software prefers it for the totally free nature of the code
    that is used to build GNOME (see Figure 2.1).


    # Fedora KDE


    Fedora KDE is the most popular “alternate” Fedora spin, and as you might have
    guessed from its name, it features KDE. The KDE environment came before GNOME,
    quite a few people in the Linux community don''t like it because initially was
    built with the help of nonfree code. (The Debian Project, for instance, initially
    would not ship any with KDE.) The GNOME Project was started as a result of this
    concern. Today, the code in KDE is more open, and those objections are rendered
    moot.


    Fedora KDE makes exclusive use of KDE and its attendant applications, as shown
    in Figure 2.2.'
