    # Creating a Table


    Now that you have created the database file and poked around the interface, it''s
    time to put something in the database file. The logical place to start is creating
    the container to hold the data, which is the table. Using the Table Wizard, here''s
    how to create the database table.


    +   1. Click the Tables object in the Database pane. The Base window will display
    table-oriented functions and objects.


    +   2. Use Wizard to Create Table in the Tasks pane. The Table Wizard dialog box
    will open (see Figure 18.6).


    +   3. In the Category section, select the Personal radio button.


    +   4. In the drop-down list, select the Sample Tables option that most closely
    matches the kind of table you want to build. Don''t worry if you don''t see an
    exact match—you can modify the table in a moment. For this example, choose Library.


    ![](img/8b4ddd0fa8fb72c4c17dda7353810618_404_0.png)


