  md: '# Taking It Easy on the POP Server


    You can set Evolution to download email automatically at a certain interval—no
    less than 10 minutes, so you don''t overload POP server. That''s a good idea for
    those of you with an always-on Internet account. If you are using dial-up, consider
    leaving this option off. If you can control the timing of email downloads, you
    can manage the flow of traffic through your narrowband connection.


    +   14. Click Forward. The Sending Email page will open (see Figure 11.5).

    15. Set the Server Type as SMTP.

    16. Type the address of your SMTP server in the Server field.

