  md: '# CHAPTER 14


    # WORKING WITH WINDOWS


    One of the biggest fears for anyone moving to a new operating system is “Will
    my applications work?” For a long time, Windows users could sit back with a certain
    smugness and deride Linux as a platform that couldn’t run the simplest Windows
    application. Those days are long gone, as many superior applications are available
    for Fedora (OpenOffice.org, Firefox, and Evolution to name a few).


    But, let’s be fair—sometimes, there’s just one application that you really have
    to have that has no Linux equivalent, or the Linux equivalent is something you
    just don’t like.


    There are three ways to go about solving this problem.


    First, you can use an emulator to run Windows software. In software terms, an
    emulator is an application that mimics another software environment so certain
    apps can run on it. Emulators act as self-contained simulators of another operating
    system, and these days run pretty well. However, there are some drawbacks. No
    emulator is perfect, and most do better with applications that they are prepared
    for rather than just any old application that comes along.


    Second, you can install Fedora and boot into each of the operating systems separately.
    That has the advantage of running native applications within a native Windows
    environment. (Well, if you can call that an advantage.) But, you can only run
    one operating system at a time: either you are running Fedora, or you are running
    Windows—not both.'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Chapter 14 = Working with Windows


    There''s a third, more attractive option, which will be examined in this chapter:
    using a virtual machine. With a virtual machine, you will be able to run Windows—or
    any other operating system for that matter—right inside Fedora. You can share
    files, cut and paste text from one operating system to another, and run any application
    you want inside the virtual machine.


    In this chapter, you will learn about:


    +   - How virtual machines work

    - Where you can find and install a virtual machine free of charge

    - The ins and outs of configuring a virtual machine

    - How to install Windows on a virtual machine

    - The best way to share information between Fedora and a virtual machine


    # Discussing Virtual Machines


    In Chapter 2, “Before You Install Fedora,” there was a technical discussion on
    how partitions work and how they are used to carefully separate one operating
    system’s files from another’s, on the same hard drive.


    But while that is true for most operating system installations, there’s a different
    technology available that will allow you to install entire operating systems on
    the same partition as another operating system.


    This technology is called virtualization, and it is one of the cutting-edge sectors
    of the IT world today.


    Essentially, virtualization enables a guest operating system to run as a completely
    self-contained set of files inside a host operating system. All that is needed
    is a special virtual client application that acts as a “window” through which
    the guest operating system can be viewed and used.


    What makes it even more useful is, with the proper setup, the guest operating
    system can avail itself of the same devices that are available to the host operating
    system. In other words, if your Fedora computer has a DVD drive, the guest operating
    system can access it just like Fedora.


    One of the simplest virtual clients to install for Fedora is VirtualBox from Oracle.
    VirtualBox comes in two versions: a commercial version and an open source'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# Installing VirtualBox


    version. The open source version has every feature of the commercial version except
    USB support and a remote display protocol server that enables users to connect
    remotely to a virtual machine.


    Both versions of VirtualBox are free, but it''s important to decide which one
    are going to use beforehand, because virtual machines created for one will not
    run in the other. The commercial version is free for personal evaluation, but
    if you need to deploy it commercially, you will need to get a $50/seat perpetual
    license. The open VirtualBox, known as VirtualBox OSE, is always free, however
    you use it.


    For personal use, you should use the commercial version because the USB port is
    convenient to have.


    # Installing VirtualBox


    With Fedora, only VirtualBox OSE is included, so you will need to download the
    packages directly from the VirtualBox site.


    +   1. In Firefox, visit www.virtualbox.org/wiki/Linux_Downloads. The download
    VirtualBox for Linux Hosts page will appear.


    +   2. Click the link for the appropriate version of Fedora. The Opening Virtual-Box
    dialog box will open.


    # 32- or 64-bit?


    Computer processors may come in 32- or 64-bit versions. Usually when you install
    software on Fedora, the processor type doesn''t matter because PackageKit already
    knows what software to get for you. When you install software from a third-party
    source, you will need to know what kind of processor you have. To find out, open
    a Terminal window and type uname -m. If i386 or i6686 is reported, you have a
    32-bit machine and should use the i386 linux. If amd64 is reported, you are using
    a 64-bit PC and should use that link for downloading VirtualBox.


    +   3. Confirm the Open with Package Installer is selected and click OK. The file
    will be downloaded, and the Do Want to Install This File? dialog box will open.


    +   4. Click Install. VirtualBox will be installed, but you will have to authenticate
    with the administrative password at least once.


    After the installation is complete, it is important to make sure that your username
    is added to the vboxusers group so you can run and connect to the virtual machines.'
