  md: '# Moving Around the Filesystem: The cd Command


    The cd command changes your working directory to another directory that you specify.
    This command is used to navigate the directory structure in Linux. Typing only
    cd returns you to your home directory. The cd command works similarly to the CD
    command under DOS. However, the cd command is a little more flexible in that it
    allows for shortcuts to change between your home directory and the previous working
    directory.


    Use the cd command to change directories. Specifying no directory returns to your
    home directory.


    The parent directory is denoted by .. (two periods). To go up one level in the
    directory structure, simply type the following:


    ```

    cd ..

    ```


    # Careful Typing


    > You must have a space between the .. and cd. If you type cd.. with no space,
    you''ll get an error message telling you that the command cd.. is not found.


    If you want to go up a couple levels in the directory structure, you can do so
    by typing this:


    ```

    cd ../

    ```


    This moves you two levels from your current directory.


    To change to a specific directory, issue the cd command and then type the name
    of the desired directory. If you''re working in your home directory and decide
    to switch to the /tmp directory, use this command:


    ```

    cd /tmp

    ```


    # Know Where You Are


    > It is important to note that /tmp and tmp are not the same in this instance.
    The /tmp command means you want to go to the tmp under the / (root) directory
    and not a tmp directory under the present working directory.


    To get to your home directory quickly, simply use the cd command with no arguments,
    like this:


    ```

    cd

    ```'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Chapter 9 = Basic File Management


    If you do not specify a directory, the command line interface assumes you to go
    back to your home directory. You can also use the tilde (~) symbol to specify
    your home directory, as in in the following example:


    ```

    cd ~

    ```


    If you want to jump quickly back to the directory you were last in, without typing
    the full pathname of that directory, this shortcut:


    ```

    cd -

    ```


    After you get the hang of the cd command and Fedora’s directory structure, you
    may find that using the command-interface is not as unfriendly as you might have
    thought when you first started.


    # Where the Heck Am I?: The pwd Command


    The command pwd is simple: it’s a one-trick pony. If you have lost track of where
    you are in the directory structure, you simply use pwd to get the shell to print
    out the present working directory.


    At the command shell, type in:


    ```

    pwd

    ```


    The output is the current working directory. The pwd command does not take any
    options or arguments.


    # Conclusion


    In this chapter, you learned how to manage files and directories both in the Nautilus
    file manager and on the command line. As you have seen, it is very similar to
    any operating system you’ve used in the past, so the transition to Fedora should
    be that much easier.


    In Chapter 10, “Surfing the Web,” you’ll start looking beyond your Fedora desktop
    and find out about one of the best ways to browse the Internet: Firefox.'
