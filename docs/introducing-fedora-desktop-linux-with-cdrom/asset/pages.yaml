  md: '# Inserting Cool Stuff


    In the early days of electronic document creation, there was text. That was it.
    Things got rather exciting when italic text came on the scene. Underlining caused
    a huge ruckus. But then things sort of calmed down.


    That lasted for a few years (eons in computer time), until someone got the idea
    to put real-time artwork in documents. Now, if you don''t have graphics in your
    document, people look at you funny.


    Writer''s Insert menu contains the commands to insert artwork quickly and easily
    into your document, as explained in the following steps.


    +   1. In an open Writer document, select Insert | Picture | From File. The Insert
    Picture dialog box will appear (see Figure 15.10).


    +   2. In the Insert Picture dialog box, navigate through the directories to the
    desired image.


