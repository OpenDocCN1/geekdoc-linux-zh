  md: '# What Fedora Is


    Whatever the exact number, there are a lot of distributions out there, and they
    all fall into one of two categories: commercial (like RHEL) or noncommercial (like
    Fedora).


    The commercial distributions exist for a pretty self-explanatory reason: some-one,
    either a company or a group of developers, want to make money. These distributions
    tend to be the most well-known of the Linux distributions, although they are not
    necessarily the most influential.


    Distributions in this category include RHEL, SUSE Linux Enterprise Server, Mandriva
    Linux, and Ubuntu Server. These are the more commercially successful distributions;
    it is by no means a complete list.


    Noncommercial distributions are generally run as not-profits, if they are well
    organized, or even as a hobby for one of a group of developers. The motivation
    for developers is varied. Some want to create something meaningful. Do it to earn
    money. (Actually, some nonprofit distributions receive some funding through voluntary
    support and donations.) Some want to have fun coding. Whatever the reason, developers
    have made noncommercial distributions very popular and extremely influential among
    all Linux developers.


    Noncommercial distributions include Debian GNU/Linux, Slack Linux, Ubuntu, openSUSE,
    and SimplyMEPIS. Just to give you an idea of how influential noncommercial distributions
    can be, know that SimplyMEPIS, Freespace, Linspin, and Xandros are among the many
    Linux distributions (commercial or otherwise) based on what has become the most
    popular noncommercial distribution today: Debian GNU/Linux.


    # What Fedora Is


    If you were to ask under which Fedora falls, very technically the answer would
    have to be commercial, if only because its development is ultimately funded by
    Red Hat, Inc. It''s a hard thing to define, though, since community involvement
    in Fedora development is so intense. In fact, this involvement is a good reason
    why Fedora has become so popular. With so much user involvement, backed by corporate
    funding, Fedora has been able to become one of the most user-friendly Linux distributions
    available today.


    There is more to it, of course.'
