    At the same time, beyond the wordplay, Stallman did something really: he created
    a free software license.


    All software created is released under some sort of license. A license dictates
    how a piece of software can be sold, copied, and used. Much of the software you
    have used until now, especially with Windows or OS X, has used what are known
    as proprietary licenses. A proprietary license states—in painfully long detail—that
    you, the user can use one copy of the software, say, Windows. You can''t copy
    it and sell it to anyone else. Nor are you allowed to see or otherwise manipulate
    the code that made Windows. To do so would bring certain doom and destruction
    upon you. Or worse, lawyers.


    What Stallman proposed was a license that would be a mirror image of proprietary
    licenses. His original idea went something like this:


    +   - You have the freedom to run the program for any purpose.


    +   - You have the freedom to change the program to suit your needs. This means
    that you can change the source code—the actual human instructions used to put
    an application together.


    +   - You have the freedom to redistribute copies of the program, either for or
    for a fee.


    +   - You have the freedom to redistribute changed copies of the original program.


    Those are the four basic principles found in the license Stallman created: the
    GNU General Public License, or GPL for short. This license was written to guarantee
    that once software is free under this license, it will always stay that way.


    To break this down in nontechnical and longterm terms, here''s what the GPL means:
    Here''s the software. Here''s the source code. What do you want with it. If you
    improve it, make sure you include all of the source code with your improvements
    and pass it along. Don''t ever try to keep other people from getting'
