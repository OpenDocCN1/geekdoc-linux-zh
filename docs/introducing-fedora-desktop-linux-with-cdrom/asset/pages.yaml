    # ViaBitTorrent


    Even on a broadband connection, downloading a nearly 660MB file is going to take
    some time. On the average day, this will be about 15 minutes, give or take. If
    you are trying to get this disc file when everyone else is trying to do the same
    thing, the time involved can stretch to hours as your browser patiently waits
    its turn to pull down the file, bit by bit.


    There is a way to download the file that typically avoids the traffic jams sometimes
    found at central file servers, using a relatively new method known as BitTorrent.


    You may have heard of BitTorrent in the news or technology media outlets, because
    it is often (and erroneously) regarded as a tool for software pirates to has download
    and transfer their illicit wares. Actually, there are many legitimate uses for
    BitTorrent: Downloading a Linux distribution like Fedora is certainly one of them.


    Here''s how it works: Instead of downloading files from a central server, BitTorrent
    downloads are shared by all of the people who want to obtain those files. At least
    one of the users in this group (known as a swarm) has all of the parts of the
    file or files. That is the seed computer. In a BitTorrent download, all of the
    computers in the swarm query each other and find what parts of the download each
    machine has. If my computer needs part 863 of file 42, and computer B has it,
    I will download it from him. If my box has part 567 of file 23 and computer B
    needs it, it will download the piece of the file from me. If nobody in the swarm
    has it yet, a computer queries the seed computer, gets the needed piece of the
    file, and shares it with the rest of the swarm.'
