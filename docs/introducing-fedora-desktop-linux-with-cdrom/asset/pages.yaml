  md: '# The Second Greatest Fear


    Some people are good at presentations. They stand up in front of everyone else
    and mesmerize us with their logic, charisma, and charm. No notes, no slides—just
    the person and his or her vision.


    The rest of us may require a little assistance. In a public speech, the power
    of the speaker''s words is the only thing that can help people remember the speaker''s
    message. Have you ever noticed how politicians always work some sort of catch
    phrase in their speeches? They are not trying to be trite—they''re trying to give
    their audiences something to remember, because our memory and sense of hearing
    do not always work together.


    In a private business setting, where a lot of detail may be required, entirely
    verbal presentations would be impossible for others to remember later. So speakers
    have two choices: reduce the presentation to its mere essence to get the overall
    points across, or rely on some other form of communication to get the finer points
    of the message to the audience.


    Since many people feel public speaking second only to death, would rather not
    become fiery orators in order to get their points across. Which leaves the second
    option: use another way to communicate. We simply remember better if we have seen
    them with our own eyes.


    Thus, the corporate slide show was born.


    It started off with placards at first, showing charts created by people whose
    job was to do nothing but show the charts. Overheads were used next, lending presenters
    the ability to support their points on the fly. Then came slides, added color
    and speed to presentations. Finally, the slides were created directly on a computer
    and projected from there, as well.


    Which brings us to the component in OpenOffice that gets this job done for you:
    Impress.


    # Learning the Tools to Use


    The makers of Impress have loaded it with dozens of interesting tools that help
    you build incredible presentations with ease. This is readily apparent when looking
    at the Impress interface (see Figure 17.1).'
  merge: -1
