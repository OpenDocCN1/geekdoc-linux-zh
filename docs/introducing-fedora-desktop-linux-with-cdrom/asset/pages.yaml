  md: '# Chapter 10 = Surfing the Web


    JavaScript. In 1996, the critics got what they wanted, when Navigator and IE 3.0
    were each released within a single week, with IE 3.0 including a new technology
    called ActiveX. ActiveX went beyond the simple scripting model of JavaScript and
    the plug-in methodology of Navigator. Now, IE users could pick up the tools they
    needed to reach any special Web media automatically—they didn''t need to find
    and install any helper apps like Navigator did.


    No one would be laughing at IE anymore.


    The next targeted release of the Big Two browsers would be 4.0, and each company
    had its own plan for changing the face of the desktop itself. IE would become
    integrated directly into the Windows desktop (a decision that has since come back
    to bite them), while Navigator would become more powerful and versatile so it
    would essentially become the platform upon which every application would run.
    The desktop would become the Internet, it was announced at a Netscape conference
    in 1997. But it was too late—Netscape’s market share was dropping like a rock.
    By the end of that year, Navigator held anywhere from 10 to 20 percent of the
    overall browser market share.


    By the turn of the century, IE’s market share was consistently 95 percent or higher.


    There was no clear end to the Browser War, though many believe it came to a halt
    in December 1997, when the U.S. government levied charges of unfair competitive
    practices against Microsoft because of its decision to integrate IE into the then-upcoming
