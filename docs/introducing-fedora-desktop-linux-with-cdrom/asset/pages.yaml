  md: '# INTRODUCTION


    Many people think of Fedora as an operating system that is way over their heads—that
    only techies can use this strange, arcane OS with the funny name.


    For all of you who have been having these thoughts, this book is here to tell
    you that this is simply not the case. Fedora, and Linux, in general, have become
    very easy for everyday home and business users to install and use.


    Now you can find out for yourself, in just one weekend, how easy it is started
    using Fedora and discover that there is life beyond Windows.


    # Is This Book for You?


    Introducing Fedora is for anyone who wants to get started using Fedora, specifically
    Fedora 13, and has only one computer at their home or business on which to install
    this new operating system. Think of this book as a personal tutorial, a one-on-one
    class with an expert user of Fedora. You get to stay in the comfort of your own
    home or office and learn how to do the following things:


    +   - Use Fedora as a sole operating system or have it happily co-exist with Windows.


    +   - Gather information about your system to assess your system''s capability
    to use Fedora.


    +   - Learn about the many versions of Linux and the entire Fedora family.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Introduction


    +   - Install the Fedora operating system.

    - Deal with any unusual installation issues.

    - Examine the GNOME interface.

    - Create a customized desktop.

    - Explore the Fedora filesystem.

    - Connect to the Internet.

    - Add a printer to your PC.

    - Add additional hardware to your PC.

    - Install software using PackageKit.

    - Explore some of the essential tools packaged with Fedora.

    - Examine and configure Firefox to browse the Internet and use Evolution to read
    your email and manage your appointments

    - Use OpenOffice.org 3.2 as your preferred office suite.

    - Troubleshoot any installation and configuration issues that may pop up.


    # What’s on the CD


    There’s not a lot you need to start Fedora—basically, just the software and Intel-based
    PC. It does not even have to be a new PC. Fedora works well on older PCs, and
    has much better performance on older PCs than Windows XP, and also on older machines
    the new Windows 7 operating system won’t even touch.


    Fedora is a free-of-charge distribution of Linux, which means that anyone with
    a broadband Internet connection (like a modem or DSL line) and a “write-able”
    CD-ROM drive can download the whole package and create his or her own CD-ROM.
    This is free, except for the cost of the blank disc.


    For people who don’t want to spend much money and don’t have access to a big Internet
    pipe, there is a second option. A few companies download each new'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'version as it is released, create hundreds of CD-ROMs containing the complete
    Fedora distribution, and then sell them for a low cost.


    Much of the preparation for installation is discussed in Chapters 1 and 2. You
    should definitely read these chapters first so you can get ready for the rest
    of your exploration of Fedora.


    This book details how to find and download your own copy of the Fedora operating
    system, which is useful for any version of Fedora. We also thought it be a good
    idea to make it even easier and include a free, licensed copy of Fedora right
    in the back of the book. On the CD you will find a complete copy of Fedora 13,
    ready to install.


    On that CD, besides the Fedora operating system, you will find copies of


    +   - OpenOffice.org, a full-featured office suite for Fedora and Windows.


    +   - Firefox, the popular browser that beats Internet Explorer on speed and reliability.


    +   - Evolution, a robust messaging and contact management application.


    # CD-ROM Downloads


    If you purchased an ebook version of this book, and the book had a companion CD-ROM,
    we will mail you a copy of the disc. Please send ptrsupplements@cengage.com the
    title of the book, the ISBN, your name, address, and phone number. Thank you.'
