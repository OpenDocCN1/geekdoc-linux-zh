  md: '# Using Printers


    Early computers did not communicate well. The first digital calculating device
    that could safely be called a computer was the Harvard Mark I, a five-tone, 750,000-component
    device that read its programming code from paper tape and its data from punch
    cards. Data was output on a similar medium.


    Multimedia was a bit of a wash as well. The only sound the Mark I generated was
    the internal clicking of its components, which sounded a bit like a “roomful of
    ladies knitting.” Hardly multimedia.


    For those of you old enough to remember the Apple I and II microcomputers released
    in 1973, you’ll recall they weren’t big on multimedia, either. Little beeps and
    clicks were all the sound they emitted. Printing was coming along, though, as
    dot-matrix printers won out of perforated paper.


    Today, the number of communication devices that can be connected to PCs is phenomenal.
    Printers, speakers, television tuners, cameras, alarm systems... even cars.


    In the meantime, you can focus on immediate concerns, such as getting your own
    peripheral communication devices hooked up to your Fedora PC—namely, a printer.


    # Setting Up a Local Printer


    There are two ways of connecting a printer to your Fedora PC. The first is locally,
    by plugging in your printer in via your computer’s parallel port or, more frequently
    days, one of your USB ports.


    Once your printer is physically connected to your system and is powered on, it
    automatically begins to configure itself, as shown in Figure 7.6. If not, follow
    these steps to get your printer working.


    +   Click the System | Administration | Printing menu command. The Printing window
    will open (see Figure 7.6).


    +   Click Add. After entering your administrative password twice, the New Printer
    window will open, and your system will begin to search for a connected printer.
    When found, the printer will appear in the Devices list (see Figure 7.7).'
  merge: -1
