  md: '# CHAPTER 8


    # # TAKING THE GRAND TOUR


    It''s installed, it''s running smoothly, and now you have a whole Fedora operating

    system to play with. After all of this configuring and customizing, you''re prob-

    ably wondering: does Fedora actually do anything?


    Indeed it does. For instance, when you hear people comparing Linux to Win-

    dows, one of the biggest grips you will hear is about the perceived lack of available

    Linux applications. At the moment, Windows has some 100,000-plus applica-

    t available. While there are not quite many Linux applications, the

    number of available applications is greater than many people realize.


    Because Fedora applications typically are not commercially advertised, they are

    far less known than their Windows counterparts. Word, PowerPoint, plus

    Excel—most people have heard of these applications. But how many have heard

    of Writer, Imp, and Calc? Not many, although that''s changing rapidly. Those

    who have heard of them know that these are of a very robust office suite,

    fully comparable to and compatible with Microsoft Office.


    The GIMP is another prime example of an application that is just as feature-rich

    is its Windows counterpart, Adobe Photoshop. But, since GIMP, like most of its

    Linux brethren, is not on the public radar, it is often treated as nonexistent—for

    the time being.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '# Chapter 8 ■ Taking the Grand Tour


    In this chapter, you will visit some of the essential tools packaged with Fedora,
    including:


    +   * Firefox, a popular browser on any platform

    * Evolution, a powerful Outlook-like email application

    * OpenOffice.org, the fastest growing office suite in the world

    * Additional Fedora applications that you will find many uses for


    # Introducing Firefox


    In the old days of the Internet (all of 17 years ago)


    In 1993, everything changed. The National Center for Supercomputing Applications
    (NCSA) at the University of Illinois created Mosaic—a browser capable of displaying
    text and pictures. Suddenly, users could illustrate Web pages, which facilitated
    the flow of information. A year later, one of the Mosaic developers left NCSA
    and launched his own browser—Netscape Navigator 1.1.


    Since then, the capability of browsers has grown even more in response to complex
    content. Need to hear a sound file? The browser will take care of it. Need to
    view a Flash animation? Not only will a browser display it for you, but the browser
    can automatically get the required viewer if you don’t already have it.


    These sophisticated features are a long way from the early Internet days, that’s
    for sure.


    One of the direct descendants of early Netscape browser is Firefox, a cross-platform
    open-source browser that has taken the desktop world by storm, no matter what
    the platform. Even on Windows, traditionally the bailwick of Internet Explorer,
    Firefox has a 10+ percent browser share, which may not seem like a lot, except
    when you consider it’s only for a couple of years.


    What makes Firefox special is its speed, stability, and security. Unlike Internet
