    range and the cell in the lower-right corner of the range. Thus, you would reference
    the range selected in Figure 16.2 as D2:G14.


    Now you''ve got the basics down. As you progress through the chapter, you will
    start to see how the cells of a spreadsheet fit together to make a body of data.


    # Learning the Calc Interface


    When you start cooking, you want to have all of your ingredients out on the counter
    before you begin. Nothing is so frustrating as having to find the jar of saffron
    when your hands are covered in flour. Even better, have your ingredients chopped,
    cut, and measured before you begin for true speed.


    The same concept applies when building a spreadsheet. You need to have all of
    your tools before you begin. In this section, the Calc tools will be examined,
    with special emphasis on those tools unique to Calc.'
