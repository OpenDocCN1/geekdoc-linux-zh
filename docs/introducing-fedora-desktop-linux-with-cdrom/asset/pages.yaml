  md: '# The Red Hat Connection


    Red Hat Linux is one of the earliest created Linux distributions, having been
    invented by Marc Ewing in 1994. Ewing actually began working on the distribution,
    then known as Red Hat Software Linux, in December of 1992, soon after he graduated
    from Carnegie Mellon University.


    According to legend—because you can have legends in 20 years on the Internet—the
    name “Red Hat” came from Ewing’s habit of wearing a red hat at CMU. The name stuck,
    even after Ewing’s company was purchased by entrepreneur Bob Young in 1995.


    Red Hat’s initial popularity is attributed to some key technological advantages
    it had over other Linux distributions of the time. One advantage was the addition
    of a graphical configuration system used when installing Red Hat. Primitive by
    today’s standards, nonetheless this simple series of installation screens was
    hugely helpful for those early adopters who wanted to try out Linux.


    # Family History


    Red Hat Linux is one of three major branches of Linux distributions that exist
    today. Many successful distributions, including Fedora, are based on Red Hat Linux,
    such as Red Flag, a popular Chinese distribution, and Yellow Dog, a flavor of
    Linux designed to run on Apple’s hardware.


    Another advantage Red Hat had was how software applications were distributed for
    the Red Hat platform.


    Recall that while open and free software is always available in its source code
    form, such a format is not easy to use. What software developers must do is deliver
    their application in a form that is easy to install. On Windows, this is done
    with a self-executing file that users can double-click and like the new program
    installed.


    On Linux, such an approach is not a good idea. Self-executing installs can bring
    a host of mistakes and potentially malicious changes to a computer, and at the
    most fundamental level, all Linux systems resist such packages. Instead, applications
    are installed using packages. A Linux package can contain many of the same files
    as a Windows installation routine, but the control of the installation lies with
    the package manager—not the package itself.


    Package managers will not only ensure the package is properly and safely put together,
    but they will also make sure that any other software the application needs will
    be installed as well.'
  merge: -1
