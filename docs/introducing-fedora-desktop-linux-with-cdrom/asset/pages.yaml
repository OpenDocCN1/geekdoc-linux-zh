    # Narrowband Options


    It should be noted that the converse is also true. If you don''t have broadband
    access, you can download Fedora for installation. However, on a standard 56 K
    dial-connection, it will take just over 29 hours at top speed. If you don''t want
    to do this, see the "Getting a CD" section later in this chapter.


    When you download Fedora, you are actually downloading what is known as an ISO
    image. A disc image (whether for CD or DVD) is analogous to a picture of all the
    1s and 0s that will make up the contents of the disc you will eventually create.
    The advantage to this approach is you only have to download one (really big) file,
    instead of all the hundreds of files that make up Fedora. The disadvantage is
    that you have to get a special application to create a CD from a disc image (which
    we''ll discuss in the "Burning CDs/DVDs" section).


