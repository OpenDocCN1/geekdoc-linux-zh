    # Menus


    One of a nicer features of Fedora is the ready capability of editing the contents
    of menus to include exactly what you want. Fedora does a good job of including
    the most used applications in its menus, but there may be some that you would
    like to have in the menus for more ready access.


    Configuring Fedora’s menus is relatively simple. And, while you’re doing so, you
    may learn about even more applications you didn’t know that Fedora had.


    +   - Click the System | Preferences | Main Menu menu command. The Main Menu dialog
    box will open (see Figure 4.9).


    +   - Click a submenu item in the Menus column. Items in italic print are currently
    not visible on any menu. The contents of submenu will be displayed in the Items
    column.


    +   - To add an item to a menu, click the check box next to that item in the Items
    column. The item will be selected (see Figure 4.10).


    +   - To move an item, click the item you want to move. The Move Up and/or the
    Move Down buttons will become active.'
