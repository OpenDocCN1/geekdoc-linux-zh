    # Tuning into Internet Radio


    Streaming media is a fancy term for online multimedia content that is down-loaded
    to your Fedora PC but not actually stored there. It is the primary method used
    by Internet radio to deliver content.


    This method offers two advantages. The first advantage is for the end user. As
    streaming media is sent to the client machine, it is processed immediately by
    the streaming media application, which gives the user instant playback without
    having to wait for the entire file to download. After the file is played, the
    data is deleted, saving on precious hard drive space.


    The second advantage to this approach is for the producer of the content. Because
    streaming media cannot be saved by the client, live events such as censors can
    be broadcast without the fear of an unscrupulous end bootlegging the material.
    Streaming media can also be sent to many users simultaneously, which makes the
    broadcast of on-demand events and music possible.


    One of the most popular applications of streaming audio is the live broadcast
    of radio station content. Both standard and Internet-only radio'
  merge: -1
