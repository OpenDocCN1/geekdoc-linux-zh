    look quite a bit alike: there are menus, windows, icons, toolbars—all of the familiar
    visual cues that most people take for granted when they use a computer these days.
    When you crack open the hood, however, will find that Linux and Windows are nothing
    alike.


    # Modularity


    Let’ revisit the work of young Linux. What he and his fellow contributors were
    working on what was not an operating system like Windows or Mac OS X. He was working
    on what is known as the kernel: the tiny, but powerful, core that lies at the
    center of all operating systems. An operating system is not just a kernel; there
    is software to talk to keyboards, mice, screens, the Internet, installed applications,
    not to mention the software that makes all of those pretty-looking windows, icons,
    and menus. Underneath all of that, though, is the kernel: the piece of software
    that organizes all of the tasks a human needs a computer to do translates them
    into instructions the computer can understand.


    Linux is not the only operating system with a kernel at its core. All operating
    systems have even Windows, but not all kernels are created equally.


    To illustrate, think of a kernel as a child’s connecting toy block. It’s self-contained,
    and other blocks can be attached to it easily. In fact, other blocks certainly
    do, like the block that displays the computer’s output on the screen or the block
    that controls the network card that lets the computer talk to the Internet. All
    the blocks connect neatly to the kernel block, which is not only slightly bigger
    than the rest of the blocks, because it’s not doing all of the work—the other
    blocks. The whole thing is put together into what we know as the Linux operating
    system.


    By contrast, the Windows kernel is also a connecting block, but it’s much bigger
    than the blocks that connect to it. It’s nearly as big as all of Linux itself,
    and is just the Windows kernel. The reason for this size disparity is because
    the Windows kernel is so interconnected to its helper applications that essentially
