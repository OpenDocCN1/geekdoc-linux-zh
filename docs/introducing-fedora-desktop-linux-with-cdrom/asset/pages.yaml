    License. “Mozilla,” once the name of Netscape’s lizard mascot, would now become
    the name of the project created to manage the free-now Netscape code.


    The Netscape Communicator suite would eventually be known as the Mozilla Application
    Suite, and many spin-offs would be created from this rich repository of source
    code, including several browsers for Linux, such as Galeon, Epiphany, and K-Melon.
    The Mozilla Foundation, the organization charged with maintaining the Mozilla
