    # Introducing OpenOffice.org


    OpenOffice.org is a product that definitely deserves some attention. Is OpenOffice.org
    the Greatest Suite Ever Made? No. Everything can be improved upon, and not everyone
    will like using OpenOffice.org. But OpenOffice.org offer other office suites do
    not: a unique, totally integrated interface that seamlessly blends its components.


    It''s time to start it up (using the Applications | menu command) and see for
    yourself how this powerful office suite is put together.


    # Writer


    The written word is still a major component of our daily lives. Newspapers, Web
    pages, and books—the written word comprises all. Even our audio and visual media
    stem from written scripts and news copy.


    Writer was the first product developed by the original Star Division for the old
    StarOffice suite and is therefore the most complete. You can see its robust nature
    in Figure 8.3, which shows a typical Writer window. You can see that Writer offers
    a number of familiar tools.


    The uses for Writer, which are as boundless as your imagination, will be examined
    in Chapter 15, “Documenting with Writer.” You can create any form of written document
    and use elements from any other part of OpenOffice.org to suit your needs.


    # Calc


    Spreadsheets get their name from the old-fashioned ledger sheets used by bound
    accountants. In their work, they would lay out numbers on what were at huge sheets
    of grid-lined paper. Sometimes, these sheets would be yards long, and if a mistake
    were made in just one cell . . . well, let’s say the mistake would be rather tedious
    to find and fix.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Chapter 8 Taking The Grand Tour


    ![](img/8b4ddd0fa8fb72c4c17dda7353810618_172_0.png)


    Figure 8.3

    The elements of Writer.


    The concept of these paper sheets has been carried over to electronic form. It
    made sense to keep data in this familiar tabular format. Thus, the first spreadsheet
    program, VisiCalc, was born. Although no relation to Calc, a lot of the concepts
    introduced in VisiCalc provides the basis for Calc''s design.


    Cells are the heart of a spreadsheet. They contain data. The data values can be
    numbers, letters, words—whatever you want to keep track of. Cells can also contain
    formulas. Formulas are mathematical equations that take the value of one cell
    and relate it to the value of another cell to come up with an answer. If needed,
    formulas can equal ranges of cells.


    Figure 8.4 shows that the basic elements common to all spreadsheets are in Calc:
    cells, rows, and columns. Spreadsheet programs differ in the way they present
    and utilize these elements, but Calc uses a very intuitive interface, as you will
    learn in Chapter 16, “Analyzing with Calc.”'
