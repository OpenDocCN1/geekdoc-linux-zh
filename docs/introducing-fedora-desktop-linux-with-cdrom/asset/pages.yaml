  md: '# Chapter 14 = Working with Windows


    ask yourself this: When you have ever installed Windows on a machine? If you''re
    like most people, you have purchased a machine that already has Windows installed
    on it—you never had to deal with installation.


    Installing Windows is a lot like installing Linux: you set the disc in the drive
    and boot the machine to begin the installation process. Except in this case, the
    machine you will boot is a virtual.


    # Get the Right Windows


    Be sure you have the right kind of Windows (whatever version) to install. Usually
    what you see online and in stores is Upgrade version—that is, a version of Windows
    that is meant to replace an older, version of Windows. What you need is an OEM
    (original equipment manufacturer) version. Upgrade are less expensive than OEMs,
    so you might be tempted to get that instead. Don''t—when you try to install an
    Upgrade version of Windows to a blank machine, even if it''s virtual, the Windows
    install will fail.


    +   1. Insert your Windows disc in your Fedora machine''s DVD drive.


    +   2. In VirtualBox, click the Windows virtual machine and then click Start.
    The First Run Wizard dialog box will open (see Figure 14.9).


