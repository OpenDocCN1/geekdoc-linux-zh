    your improvements to the source code. We can tell you to do this, because we wrote
    the software, and these are the terms under which we''re willing to let you have
    it.


    In a less litigious society, this could be broken down even further to: “Be excellent
    to each other."


    How the GPL became tied to Linux was a matter of practicality. Torvalds had his
    kernel but none of the tools that would make kernel into a real operating system.
    (Think engine without the gears, wheels, shafts, and axles that make a car.) The
    GNU tools were ready to go, but they had none. In a classic “you’ve got your chocolate
    in my peanut butter” flash of inspiration, Torvalds modified the GNU tools so
    they would run with his Linux kernel, and *poof!* the Linux operating system was
    born.


    Because of the close interplay of the GNU tools and the Linux kernel, Torvalds
    decided to adopt GNU’s GPL for the kernel as well. This interplay is why you will
    often see the operating system referred to as *GNU/Linux* and the kernel just
    as *Linux*. Purists, Stallman the most vocal, believe that adding GNU/ to the
    system name reflects the huge contribution GNU tools made to the birth of the
    GNU/Linux operating system.


    Whether people back this stance or not, the commonly accepted term for the kernel
    and the operating system is *Linux*, which is what this book will use unless referring
    to a version of Linux that specifically uses “GNU/Linux” in its official name.


    Now you know how the free of Linux works. But with all that freedom, does anyone
    still make money in the Linux business? Well, if you recall from that list of
    principles that formed the basis of the GPL, the third item that one could redistribute
    GPL software as desired, either free or for a fee. This means that companies are
    allowed to package Linux (or other free software) and sell it to whoever is willing
    to buy it.


    Okay, why would you pay money for something that’s free?


    There are two reasons, actually. The first is convenience. While Linux and all
    of its components are free to acquire, getting all of this software and putting
    it together is not always something someone wants to do. To return to our analogy,
    you could buy the box of connecting blocks and put Linux together on your own,
