    # Formatting Values


    Politicians love to talk about values. We need to get back to traditional values,
    they say. But whose tradition? European? Asian? African? There is no one answer.


    Nor is not one way to display data values. The different time formats have already
    been shown. Numbers, too, can be expressed in different ways. One dataset may
    project a significant value to the hundredths place, while another projects it
    to the thousands place.


    Even in the English-speaking cultures, numbers carry different names. In the United
    States, citizens refer to 1,000,000,000 as a billion. In the United Kingdom, a
    billion is officially 1,000,000,000,000,000. Advocates of the Queen’s English
    refer to this as yet another example of the insidious U.S. corruption of the English
    language. Quite.'
