    Odd names aside, it looks similar to a set of Window folders, doesn’t it? A bunch
    of directories in a nice tree pattern, all located on the same partition. Except,
    while this listing reflects the typical Fedora file system, it does not mean all
    of these directories are located on the same partition.


    That is due to a unique UNIX file system property known as mount points. If you
    want, you can decide to pick any directory on any drive or partition, and Fedora’s
    file management will seamlessly copy, retrieve, save, or delete files wherever
    are physically located.


    Using the author’s system as an example, the root (/) directory’s mount point
    is located on /dev/hda2, which denotes the second partition (“2”) of the primary
    (“a”) hard drive (/dev/hd). But the mount point for the /home directory (and all
    of its subdirectories) is located on /dev/hda3, a completely separate partition.
    The advantages to this are that the personal data that belongs to the author will
    always be stored on a separate partition, which means that if ever were necessary
    to migrate to another Linux distribution or perform a clean installation of a
    future version of Fedora, that personal data would always be preserved and the
    files accessible though the /home directory in Fedora’s file system.


    You can mount different directories of the Fedora file system on any partition
    or drive, even different drives, if your PC is so equipped.


    When you use Anaconda’s partitioning tool to set your drive, it is obvious that
    you will need to devote some space to your existing Windows operating system and
    some to Fedora. How much? The easy answer is simply to divide your'
