  md: '# CHAPTER 12


    # # MESSAGING TOOLS


    When you come right down to it, the invention of the Internet was really meant
    as a way for scientists in academic and government environments to communicate
    vast amounts of data with each other in a very quick and reliable manner. The
    military saw uses for this kind of global network, too, which is why the U.S.
    Department of Defense sponsored the early DARPANet infrastructure that would eventually
    become the Internet.


    The kind of data they needed to transfer was voluminous and needed to be securely
    moved back in forth in a hurry; something that the phone system could not provide.
    So it comes with some irony that after all is said and done, companies are turning
    the Internet into another global voice network, just like the phone system.


    Instantaneous communication is a really wonderful thing, which most of us take
    for granted. Imagine, you can pick up a cell phone, conduct an instant messaging
    (IM) session, or (more recently) Voice over IP (VoIP) technology and communicate
    with someone thousands of miles away. To people living just 50 years ago, this
    border on magic. Our children have all grown up with such advances, and we''ve
    adapted fairly well, so it''s hard to step back and appreciate how cool this is.


    In this chapter, you will find out how Fedora provides the tools to conduct and
    VoIP conversations via the Internet, specifically learning how to:


    +   - Obtain your own IM account

    - Use Empathy to conduct an IM session

    - Call anyone in the world with Skype'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Using Empathy


    Instant messaging, as we know it today, is actually a conglomeration of a variety
    of technologies. First, there was the Internet Relay Chat (IRC), the stream-of-consciousness
    sessions in which many users could participate at the same time. A little bit
    later, as private networking providers like America Online or Prodigy grew in
    popularity, they featured their own versions of chat sessions, although these
    chat sessions were between just two users at a time: a private chat session that
    was dubbed by these network providers as *instant messaging.*


    Today, almost all of these types of instant text communications, whether in an
    IM session, or through text messaging on cell phones, are given the moniker *“instant
    messaging."*


    Empathy is a software client that allows you to connect to a huge variety of IM
    networks. These networks are simply different “channels” of IM that are available
    to users, much like the networks on your cable TV. The difference is, with Empathy,
    you can monitor and have conversations on many different networks at the same
    time.


    The networks to which you can connect with Empathy include:


    +   - AIM

    - Facebook Chat

    - Gadu-Gadu

    - Google Talk

    - GroupWise

    - ICQ

    - Jabber

    - Internet Relay Chat (IRC)

    - MSN

    - MySpace

    - QQ'
  merge: -1
  pgno: 252
- img_proc: true
  md: '+   - Yahoo!


    +   - Zephyr


    As you can see, that''s a lot of flexibility, so there is a certain sense to the
    name Empathy, which means the ability to intuit and share another''s emotions,
    regardless of language.


    There are two steps that have to occur before you can conduct an IM or chat session
    on any of these networks. You need to get yourself an account on one of these
    networks (if you don''t have one already), and you need to configure that account
    in Empathy.


    The really great thing is that you can set up multiple accounts in Empathy and
    have them running all at once. If you are inclined, you can hold many conversations
    with different friends and colleagues at the same time.


    # Getting an IM Account


    With all of the protocols listed in the previous section, it''s a good chance
    that you will already have an account on one of these private networks. If you
    do, gather your login information and skip ahead to the next section, “Signing
    On,” to begin your Empathy session.


    For those users who have not acquired an account on one of these networks, let''s
    walk through setting up a Google Talk account. Google Talk is free to any Internet
    user who signs up, and a Google account will enable you to use many other features
    from the search engine company, such as Google Docs and Maps.


    There are two ways to sign up for a Google account: you can use an existing email
    address or create a Gmail account first, which has the advantage of giving you
    the option to create a custom Google ID that can act as your personal “handle”
    on Google Talk and other Google services. In this example, you’ll create a Gmail
    account and then a Talk account. If you already have a Gmail or Google account,
    skip ahead to the “Signing On” section.


    First, connect to the Internet and open Firefox. Then follow these steps:


    +   1. Type www.google.com/accounts/NewAccount?service=mail in the Location bar
    and press Enter. The Create a Google Account - Gmail page will appear (see Figure
    12.1).'
