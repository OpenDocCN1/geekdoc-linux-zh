  md: '# Customizing Toolbars


    The Standard and Formatting toolbars are not the only two sets of tools available
    in Writer, not by a long shot. In fact, as of OpenOffice.org 3.2, the version
    that ships with Fedora 13, there are a total of 22 available toolbars in Writer.
    Most of these toolbars will pop up as needed. For instance, when you begin to
    insert a table, the Table toolbar will appear as a floating window.


