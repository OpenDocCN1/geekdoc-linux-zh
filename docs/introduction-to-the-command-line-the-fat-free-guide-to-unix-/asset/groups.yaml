    The **finger** command displays information about user accounts. It shows details
    about the user’s shell, home directory, and other helpful information. The example
    above demonstrates the typical user information displayed when using the **finger**
    command.


    > **Tip**

    > *The finger command looks for a file called .plan in the specified user’s home
    directory. This file can be edited by the user to contain a note about their status
    and is displayed whenever they are queried with the finger command. If this file
    does not exist, the finger command will display "No Plan" for the user.*


    **Common usage examples:**


    ```

    finger [USER]  | Display information about the specified user

    ```'
