    # **rm**


    **Purpose:** Remove files.


    **Usage syntax:** `rm [OPTIONS] [FILE]`


    ```

    $ rm MyFile

    $ ls -l MyFile

    ls: cannot access MyFile: No such file or directory

    ```


    Using the rm command to remove a file


    The **rm** command removes files. In the above example, the **rm** command is
    used to remove `MyFile`. After executing the **rm** command, `MyFile` is deleted
    from the disk and no longer accessible.


    Notice that no warning is given when the file is removed. This is the default
    behavior of **rm** on most systems. To change this, use the `-i` option as demonstrated
    in the next example. This will instruct the system to prompt you to verify you
    want to remove the file.


    ```

    $ rm -i MyFile

    rm: remove regular file ''MyFile''? y

    ```


    Using the -i option with the rm command for interactive prompts


    > **Tip**

    > *You can use the `alias` command (see page 54) to make `rm -i` the default remove
    action. This is highly recommended as it helps prevent accidental disasters when
    deleting files.*


    **Common usage examples:**


    +   - `rm [FILE]` : Remove the specified file

    +   - `rm -r [DIRECTORY]` : Recursively remove all items in the specified directory

    +   - `rm -i [FILE]` : Prompt to confirm the removal of the specified file'
