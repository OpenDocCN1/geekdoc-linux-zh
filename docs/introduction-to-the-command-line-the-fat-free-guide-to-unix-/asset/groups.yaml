    - 硬链接不能跨越多个文件系统/磁盘


    如今，符号链接被更广泛地用于克服硬链接的不足之处。当使用 -s 选项运行 ln 命令时，会创建符号链接。这是创建链接的推荐方式，因为它不会受到硬链接相同限制的影响。


