    ```\n\n编辑 crontab\n\n**常见用法示例：**\n\n- `crontab -l` 列出当前用户的 crontab\n- `crontab\
    \ -e` 编辑当前用户的 crontab\n- `crontab -r` 删除当前用户的 crontab\n\n## 第 7 节：启动和关机\n\n**概述**\n\
    \n本章涵盖用于启动和关闭 Unix、Linux 和 BSD 系统的命令。它还提供了流行平台特定服务控制命令的概述。\n\n**本部分涵盖的命令：**\n\n\
