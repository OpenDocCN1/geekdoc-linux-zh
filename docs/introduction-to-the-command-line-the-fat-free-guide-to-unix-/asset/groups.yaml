    \ 参数列出当前的运行级别配置，如上述示例所示。如果未指定服务，将显示所有服务。指定服务名将显示该服务的运行级别配置，如下一个示例所示。\n\n```\n\
    # chkconfig -l apache2\n     apache2             0:off  1:off  2:on   3:on   4:on\
    \   5:on   6:off\n```\n\n使用 chkconfig 命令列出特定服务\n\n**`-s`** 选项用于在指定的运行级别上启用或禁用服务，如下一个示例所示。\n\
    \n```\n# chkconfig -s apache2 off 2345\n# chkconfig -l apache2\n     apache2 \
