    \n## cd\n\n**用途**：更改（导航）目录。\n\n**使用语法**：`cd [目录]`\n\n```\n$ cd /etc\n$ pwd\n/etc\n\
    ```\n\n*使用 cd 命令导航到 /etc 目录*\n\n**cd** 命令（**Change Directories**，即更改目录的缩写）将你在文件系统中的位置更改为指定路径。在上述示例中，执行\
    \ **cd /etc** 会将 `/etc` 设为新的工作目录。\n\n除非你手动指定完整路径（例如第一个示例中使用的 **cd /etc**），否则 **cd**\
    \ 命令会根据你当前的位置解释目录路径。下一个示例演示了如何使用 **cd** 根据当前位置更改目录。\n\n```\n$ pwd\n/home/nick\n\
    $ cd documents\n$ pwd\n/home/nick/documents\n```\n\n*使用 cd 命令导航到相对于当前位置的目录*\n\n\
