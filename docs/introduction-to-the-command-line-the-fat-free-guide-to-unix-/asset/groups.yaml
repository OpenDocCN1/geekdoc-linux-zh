    # touch


    **Purpose**: Update time stamps on a file.


    **Usage syntax:** `touch [OPTIONS] [FILE]`


    ```

    ```

    $ ls -l testfile

    -rw-r--r-- 1 root root 251 2009-04-21 15:50 testfile

    $ touch testfile

    $ ls -l testfile

    -rw-r--r-- 1 root root 251 2009-05-23 14:54 testfile

    $ date

    Sat May 23 14:54:35 CDT 2009

    ```

    ```


    Using the touch command to update the time stamp on a file


    The `touch` command updates the time stamps on the specified file(s). Notice the
    timestamp on the file in the above example is updated to match the current time
    and date after executing the `touch` command.


    If the file does not exist, the `touch` command will create an empty file with
    the specified file name, as demonstrated in the next example.


    ```

    ```

    $ ls -l MyFile

    ls: cannot access MyFile: No such file or directory

    $ touch MyFile

    $ ls -l MyFile

    -rw-r--r-- 1 nick nick 0 2009-05-23 14:54 MyFile

    ```

    ```


    Creating a new empty file with the touch command


    | Common usage examples: |

    | `touch [FILE]` | Update the time stamp on the specified file |

    | `touch -a [FILE]` | Update the access time stamp on the specified file |

    | `touch -m [FILE]` | Update the modified time stamp on the specified file |'
