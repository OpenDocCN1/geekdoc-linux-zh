    uptime 命令的输出


    **uptime** 命令显示自上次关机或重启以来系统已在线多久。它还显示当前登录到系统的用户数量以及 CPU 负载平均值。


    负载平均值信息显示三个数值字段。这些代表过去 1 分钟、5 分钟和 15 分钟内采集的三个系统负载样本。数字越低，系统负载越低。例如，在单 CPU 系统中，0.13
    的负载平均值对应 13% 的负载。1.15 的负载平均值意味着 115% 的负载，表示系统过载 15%，因为进程需要等待系统资源（如 CPU 和磁盘 I/O）的时间占比为
    15%。


    > **注意**：*负载平均值仅供参考显示。它并非用作准确的性能指标，因为它可能受各种因素影响。*


    **常见用法示例：**


    | `uptime` | 描述 |

