    # **Glossary of terms used in this section:**


    | Term | Description |

    | :--- | :--- |

    | **Cron** | A scheduling system used to execute programs at specific time intervals.
    |

    | **Job** | A program that has been scheduled, suspended, or is currently running
    using the **at** or **batch** scheduling programs. |

    | **Nice Value** | A numerical indicator assigned to processes to indicate and
    control their CPU scheduling priority. |

    | **PID** | (**Process ID**entifier) A unique numeric value assigned to each process
    executed on a system. |

    | **PPID** | (**Parent Process ID**entifier) The PID of the parent process that
    started a child process. |

    | **Priority** | Synonym for *Nice Value*. |

    | **Process** | Any program that has been executed. |'
