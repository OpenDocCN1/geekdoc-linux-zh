    ```


    使用 md5sum 命令显示大文件的 md5 哈希值


    `md5sum` 命令计算指定文件的 MD5 和（有时也称为 *哈希值*）。它与之前讨论的 `cksum` 命令类似，但计算更密集。MD5 哈希值相当于数字指纹，不太可能像
    `cksum` 哈希值（在某些罕见情况下）那样被重复或填充。


    上述示例显示了从互联网下载的 Ubuntu Linux CD 镜像的 MD5 哈希值。可以将生成的 MD5 哈希值与下载站点的哈希值进行比较，以确保下载无误。


