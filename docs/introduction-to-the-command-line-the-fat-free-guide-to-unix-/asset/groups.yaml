    ...\n```\n\n*-ef* 命令的输出\n\n**常见用法示例：**\n\n- `ps`：显示当前用户的进程\n- `ps -e`：显示系统上运行的所有进程\n\
    - `ps -ef`：显示正在运行的进程的详细信息\n- `ps -u [USER]`：显示由指定用户拥有的进程\n\n## pgrep\n\n**用途：**\
