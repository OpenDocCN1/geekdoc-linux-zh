    \ 递归列出所有子目录\n- `ls -d [目录]` 仅列出指定目录（不列出其内容）\n\n## pwd\n\n**用途**：显示当前/工作目录。\n\n\
    **使用语法**：`pwd`\n\n```\n$ pwd\n/home/nick\n```\n\n*使用 pwd 命令显示当前目录*\n\n`pwd` 命令（**Print\
