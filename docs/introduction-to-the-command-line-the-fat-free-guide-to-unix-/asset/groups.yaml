    \ environment, type* `man shutdown` *on your local system.*\n\nWhen the `shutdown`\
    \ command is executed, a warning is broadcast to all users logged in to the local\
    \ system. An optional message can be specified following the time argument as\
    \ shown in the next example.\n\n```bash\n# shutdown 2 Save your work and log off\
    \ ASAP!\nBROADCAST MESSAGE FROM ROOT:\nThe system is going down for shutdown in\
    \ 2 minutes!\nSave your work and log off ASAP!\n```\n\nExample output from the\
    \ shutdown command's broadcast message\n\n**Common usage examples:**\n\n| Command\
    \ | Description |\n| :--- | :--- |\n| `shutdown now` | Shutdown the system immediately\
    \ |\n| `shutdown [MIN]` | Wait the specified number of minutes before shutting\
    \ down |\n| `shutdown [HH:MM]` | Shutdown at the specified time (24-hour format)\
    \ |\n| `shutdown -r now` | Restart the system |\n| `shutdown -H now` | Halt the\
    \ system |\n| `shutdown -P now` | Power off the system |\n\n## poweroff\n\n**Purpose:**\
    \ Power off the system.\n\n**Usage syntax:** `poweroff`\n\n```bash\n# poweroff\n\
    BROADCAST MESSAGE FROM ROOT:\nThe system is going down for power off now!\n* Stopping\
    \ services [ OK ]\n* Terminating processes [ OK ]\n...\nThe system will now power\
    \ off.\n```\n\n*Example output of the poweroff command*\n\nThe **poweroff** command\
    \ will immediately shutdown and power off the system. It is essentially a shortcut\
    \ for `shutdown -P now`. The **poweroff** command is found on all Linux distributions\
    \ and some BSD and Unix systems.\n\n> **Note**\n> To see if the *poweroff* command\
    \ is supported on your system, type `whereis poweroff`.\n\n> **Warning**\n> The\
    \ *poweroff* command does not offer a grace period and will immediately bring\
    \ down the system when executed.\n\n**Common usage examples:**\n\n- `poweroff`\
    \ | Shutdown and poweroff the system\n\n## reboot\n\n**Purpose:** Reboot the system.\n\
    \n**Usage syntax:** `reboot`\n\n```bash\n# reboot\nBROADCAST MESSAGE FROM ROOT:\
    \ The system is going down for reboot now!\n* Stopping services              \
    \   [ OK ]\n* Terminating processes             [ OK ]\n...\nThe system will now\
    \ reboot.\n```\n\nExample output of the reboot command\n\nThe `reboot` command\
    \ is used to gracefully reboot the system. It is essentially a shortcut for `shutdown\
    \ -r now`. Executing `reboot` on the command line will immediately reboot the\
    \ system as demonstrated in the above example.\n\n> **Warning** The `reboot` command\
    \ does not offer a grace period and will immediately reboot the system when executed.\n\
    \n**Common usage examples:**\n\n- `reboot` | Gracefully reboot the system\n\n\
    ## halt\n\n**Purpose:** Halt the system.\n\n**Usage syntax:** `halt`\n\n```bash\n\
    # halt\nBROADCAST MESSAGE FROM ROOT: The system is going down for halt now!\n\
    * Stopping services [ OK ]\n* Terminating processes [ OK ]\n...\nThe system will\
    \ now halt.\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_126_0.png)\n\nThe\
    \ `halt` command will halt an online system. A halt is a special type of shutdown\
    \ which gracefully shuts down the operating system without powering off the system.\n\
    \n> **Note**: *Some commercial Unix systems will enter maintenance mode when halted.\
    \ This can be used to access a pre-boot configuration/diagnostic environment.*\n\
    \n**Common usage examples:**\n\n- `halt` | Halt the system\n\n## telinit\n\n**Purpose:**\
    \ Change the runlevel.\n\n**Usage syntax:** `telinit [RUNLEVEL]`\n\n```bash\n\
    # telinit 1\n*** Switching to run level 1 ***\n# runlevel\n3 1\n```\n\nUsing telinit\
    \ to change the system's runlevel\n\n`telinit` tells the system's *init* process\
    \ to stop and start the necessary services configured for the specified runlevel.\
    \ In the above example the `telinit` command is used to change the system to runlevel\
    \ 1. The `runlevel` command (see page 129) is then executed to display the current\
    \ and previous runlevels.\n\nEach system's runlevel configuration is specific\
    \ to the distribution being used and can be customized to fit your needs. Most\
    \ Unix, Linux, and BSD systems will have a runlevel configuration similar to the\
    \ one described in the following table.\n\n| Runlevel | Purpose |\n| :--- | :---\
    \ |\n| 0 | Shutdown or special administrative mode |\n| 1 | Single user mode |\n\
    | 2 | Multiuser mode |\n| 3 | Multiuser mode |\n| 4 | Multiuser mode |\n| 5 |\
    \ Distribution specific |\n| 6 | Reboot |\n\nTypical Unix, Linux, and BSD runlevels\n\
    \n**Common usage examples:**\n\n- `telinit [RUNLEVEL]` – Tell the init process\
    \ to load the specified runlevel\n"
  mdcn: "\n## 批处理（batch）\n\n**用途：** 安排在 CPU 负载较低时执行程序。\n\n**使用语法：** `batch [选项]`\n\
