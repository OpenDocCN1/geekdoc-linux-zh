    ln 命令创建文件或目录的链接。链接是命令行中的快捷方式。在上面的示例中，创建了指向名为 TheSourceFile 的文件的链接。请注意，上面示例中的链接在权限部分有一个
    l 前缀。这表明该文件是一个链接。


    在大多数系统上，ln 命令的默认操作创建的是所谓的硬链接。硬链接有两个主要限制：


