  md: "\n## runlevel\n\n**Purpose**: Display the previous and current runlevel.\n\n\
    **Usage syntax**: runlevel\n\n```\n$ runlevel\n3 1\n```\n\nOutput of the runlevel\
    \ command\n\nThe **runlevel** command displays the current and previous runlevel.\
    \ The runlevel is an initialization sequence called by the init process and defines\
    \ procedures for system startup and shutdown. In the above example, **runlevel**\
    \ is used to display the current runlevel information. The first number displayed\
    \ is the previous runlevel and the second number is the current runlevel.\n\n\
    > **Note** If there is no previous runlevel, the system will display **N** in\
    \ the first field.\n\n**Common usage examples:**\n\n- **runlevel** Display the\
    \ previous and current runlevel\n\n## service\n\nPurpose: Manage services on a\
    \ Linux system.\n\nUsage syntax: service [OPTIONS] [SERVICE] [ACTION]\n\n```\n\
    # service --status-all\n[ + ] acpid\n[ - ] anacron\n[ + ] apache2\n[ + ] atd\n\
    [ + ] cups\n[ + ] dbus\n[ + ] gdm\n[ + ] hal\n[ + ] klogd\n[ + ] ssh\n[ + ] syslogd\n\
    ...\n```\n\nDisplaying the status of services with the service command\n\nThe\
    \ service command manages services on Linux systems. In the above example, the\
    \ --status-all option displays the status of all services on the system. The +\
    \ symbol indicates a running service and the − symbol indicates a stopped service.\n\
    \nThe start, stop, restart, and status options can be used to control individual\
    \ services as demonstrated in the next example.\n\n```\n# service ssh stop\n*\
    \ Stopping OpenBSD Secure Shell server sshd [ OK ]\n# service ssh start\n* Starting\
    \ OpenBSD Secure Shell server sshd [ OK ]\n# service ssh restart\n* Restarting\
    \ OpenBSD Secure Shell server sshd [ OK ]\n# service ssh status\n* sshd is running\n\
    ```\n\nStopping, starting, restarting, and viewing the status of services\n\n\
    Common usage examples:\n\n- `service [SERVICE] stop` | Stop the specified service\n\
    - `service [SERVICE] start` | Start the specified service\n- `service [SERVICE]\
    \ restart` | Restart the specified service\n- `service [SERVICE] status` | Display\
    \ the status of the specified service\n- `service --status-all` | Display the\
    \ status of all services\n\n## sysv-rc-conf\n\nPurpose: Display and edit Linux\
    \ runlevel configuration.\n\nUsage syntax: sysv-rc-conf [OPTIONS] [SERVICE] [ON|OFF]\n\
    \n```\n# sysv-rc-conf\nSysV Runlevel Config  --: stop service  *=/: start service\
    \  h: help  q: quit\nservice          1       2       3       4       5      \
    \ 0       6       S\n\nacpid            [ ]     [X]     [X]     [X]     [X]  \
    \   [ ]     [ ]     [ ]\nanacron          [ ]     [X]     [X]     [X]     [X]\
    \     [ ]     [ ]     [ ]\napache           [ ]     [X]     [X]     [X]     [X]\
    \     [ ]     [ ]     [ ]\napparmor         [ ]     [ ]     [ ]     [ ]     [\
    \ ]     [ ]     [ ]     [X]\nappport          [ ]     [X]     [X]     [X]    \
    \ [X]     [ ]     [ ]     [ ]\natd            [ ]     [X]     [X]     [X]    \
    \ [X]     [ ]     [ ]     [ ]\nbind9          [ ]     [X]     [X]     [X]    \
    \ [X]     [ ]     [ ]     [ ]\nUse the arrow keys or mouse to move around.  \"\
    n\" next pg  \"p\" prev pg\nspace: toggle service on / off\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_130_0.png)\n\
    \nThe sysv-rc-conf command manages service/runlevel configuration on Linux systems.\
    \ In the above example, executing sysv-rc-conf starts a configuration utility\
    \ which enables the user to select which services start on the various runlevels.\n\
    \nServices can also be displayed and modified via the command line using the --list\
    \ and --level options as demonstrated in the next example.\n\n```\n# sysv-rc-conf\
    \ --level 2345 apache off\n# sysv-rc-conf --list apache2\napache2      2:off \
    \ 3:off  4:off  5:off\n# sysv-rc-conf --level 2345 apache2 on\n# sysv-rc-conf\
    \ --list apache2\napache2      2:on  3:on  4:on  5:on\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_130_1.png)\n\
    \nCommon usage examples:\n\n- `sysv-rc-conf`\n  *Display the runlevel configuration\
    \ utility*\n- `sysv-rc-conf --list`\n  *List runlevel configuration for all services*\n\
    - `sysv-rc-conf --level [LEVEL] [SERVICE] on`\n  *Enable a service on the specified\
    \ level(s)*\n- `sysv-rc-conf --level [LEVEL] [SERVICE] off`\n  *Disable a service\
    \ on the specified level(s)*\n\n## chkconfig\n\n**Purpose:** Display and edit\
    \ runlevel configuration on Red Hat Linux-based systems.\n\n**Usage syntax:**\
    \ `chkconfig [OPTIONS] [SERVICE] [ON|OFF] [LEVEL]`\n\n```\n# chkconfig -l\n  \
    \   acpi-support        0:off  1:off  2:on   3:on   4:on   5:on   6:off\n    \
    \ acpid               0:off  1:off  2:on   3:on   4:on   5:on   6:off\n     alsa-utils\
    \          0:off  1:off  2:off  3:off  4:off  5:off  6:off\n     anacron     \
    \        0:off  1:off  2:on   3:on   4:on   5:on   6:off\n     apache2       \
    \      0:off  1:off  2:off  3:off  4:off  5:off  6:off\n     apport          \
    \    0:off  1:off  2:on   3:on   4:on   5:on   6:off\n     ...\n```\n\nListing\
    \ service configuration with the chkconfig command\n\nThe **`chkconfig`** command\
    \ manages services on Red Hat Linux systems. The **`-l`** parameter lists the\
    \ current runlevel configuration, as shown in the above example. If no service\
    \ is specified, all services will be displayed. Specifying a service name will\
    \ display the runlevel configuration for the service, as shown in the next example.\n\
    \n```\n# chkconfig -l apache2\n     apache2             0:off  1:off  2:on   3:on\
    \   4:on   5:on   6:off\n```\n\nListing a specific service with the chkconfig\
    \ command\n\nThe **`-s`** option is used to enable or disable services at the\
    \ specified run levels as demonstrated in the next example.\n\n```\n# chkconfig\
    \ -s apache2 off 2345\n# chkconfig -l apache2\n     apache2             0:off\
    \  1:off  2: off 3: off 4: off 5:off 6:off\n# chkconfig -s apache2 on 2345\n#\
    \ chkconfig -l apache2\n     apache2             0:off  1:off  2:on   3:on   4:on\
    \   5:on   6:off\n```\n\nManaging services with the chkconfig command\n\nCommon\
    \ usage examples:\n\n| Command | Description |\n| :--- | :--- |\n| `chkconfig\
    \ -l` | List runlevel configuration for all services |\n| `chkconfig -l [SERVICE]`\
    \ | List a service’s current configuration |\n| `chkconfig -s [SERVICE] on [LEVEL]`\
    \ | Enable a service on the specified level(s) |\n| `chkconfig -s [SERVICE] off\
    \ [LEVEL]` | Disable a service on the specified level(s) |\n\n## rc-status\n\n\
    Purpose: Display the status of services on Gentoo Linux systems.\n\nUsage syntax:\
    \ `rc-status [OPTIONS]`\n\n```\n# rc-status\nRunlevel: default\namavisd\t\t[ started\
    \ ]\napache2\t\t[ started ]\nclamd\t\t[ started ]\ncourier-authlib\t[ started\
    \ ]\ncourier-imapd\t[ started ]\ncourier-imapd-ssl\t[ started ]\ncourier-pop3d\t\
    [ started ]\nhostname\t\t[ started ]\nkeymaps\t\t[ started ]\n...\n```\n\nOutput\
    \ of the rc-status command\n\nThe `rc-status` displays the status of services\
    \ on Gentoo Linux systems. In the above example, all services for the current\
    \ level are listed along with their current status.\n\n> Note: Gentoo Linux uses\
    \ a nontraditional init structure that differs from most Linux systems. You can\
    \ read more about Gentoo's init system online at www.gentoo.org/doc/en/handbook/.\n\
    \nCommon usage examples:\n\n- `rc-status`: List services for the current runlevel\n\
    - `rc-status -a`: List all services\n- `rc-status -l`: List all defined run levels\n\
    \n## rc-update\n\n**Purpose:** Display and edit runlevel configuration on Gentoo\
    \ Linux systems.\n\n**Usage syntax:** `rc-update [OPTIONS] [SERVICE] [LEVEL]`\n\
    \n```\n# rc-update show\n        amavisd |        default\n        apache2 | \
    \       default\n        bootmisc | boot\n        checkfs | boot\n        checkroot\
    \ | boot\n        clamd |        default\n        clock | boot\n        consolefont\
    \ | boot\n        courier-authlib |        default\n        courier-imapd |  \
    \      default\n        courier-imapd-ssl |        default\n        courier-pop3d\
    \ |        default\n        courier-pop3d-ssl |        default\n        ...\n\
    ```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_133_0.png)\n\nThe `rc-update`\
    \ command manages services on Gentoo Linux-based systems. In the above example,\
    \ the `show` option is used to display the current runlevel configuration.\n\n\
    The `add` and `del` options are used to add and delete services from the specified\
    \ runlevel, as shown in the next example.\n\n```\n# rc-update add sshd default\n\
    \ * sshd added to runlevel default\n# rc-update del sshd default\n * 'sshd' removed\
    \ from the following runlevels: default\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_133_1.png)\n\
    \nCommon usage examples:\n\n- `rc-update show`\n  *List runlevel configuration\
    \ for all services*\n- `rc-update add [SERVICE] default`\n  *Add the specified\
    \ service to the default runlevels*\n- `rc-update del [SERVICE] default`\n  *Remove\
    \ the specified service from the default runlevels*\n"
  mdcn: "\n\n## 运行级别（runlevel）\n\n**用途**：显示前一个和当前的运行级别。\n\n**语法**：runlevel\n\n```\n\
