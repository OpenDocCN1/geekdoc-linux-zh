    \              [  OK  ]\n....\nThe system will  now halt.\n```\n```\n\nExample\
    \ output from the shutdown command\n\nThe `shutdown` command is used to shutdown\
    \ the local system. There are several different types of shutdowns that can be\
    \ performed: halt, poweroff, and reboot.\n\n> **Note**\n> \n> *Usage of the* `shutdown`\
    \ *command varies between the various Unix, Linux, and BSD platforms. Examples\
    \ on this page are intended for* **Linux** *systems. For usage examples specific\
    \ to your environment, type* `man shutdown` *on your local system.*\n\nWhen the\
    \ `shutdown` command is executed, a warning is broadcast to all users logged in\
    \ to the local system. An optional message can be specified following the time\
    \ argument as shown in the next example.\n\n```\n```\n# shutdown 2 Save your work\
    \ and log off ASAP!\nBROADCAST MESSAGE FROM ROOT:\nThe system is going down for\
    \ shutdown in 2 minutes!\nSave your work and log off ASAP!\n```\n```\n\nExample\
    \ output from the shutdown command's broadcast message\n\n**Common usage examples:**\n\
    \n| **shutdown now** | Shutdown the system immediately |\n| --- | --- |\n| **shutdown\
    \ [MIN]** | Wait the specified number of minutes before shutting down |\n| **shutdown\
    \ [HH:MM]** | Shutdown at the specified time (24-hour format) |\n| **shutdown\
    \ -r now** | Restart the system |\n| **shutdown -H now** | Halt the system |\n\
    | **shutdown -P now** | Power off the system |"
