    \ 显示打开文件的信息\n\n`fuser` 是一个有用的程序，用于标识正在使用某个文件的人员或程序。在上面的示例中，`fuser` 命令显示了当前正在使用\
    \ `ShoppingList.txt` 文件的用户、进程 ID 和命令。\n\n`-ki` 选项可与 `fuser` 命令一起使用，以终止当前正在使用指定文件的进程，如下一个示例所示。\n\
    \n```bash\n$ fuser -ki /home/nick/ShoppingList.txt\n/home/nick/ShoppingList.txt:\
    \          14044\nKill process 14044 ? (y/N)  y\n```\n\n使用 fuser 配合 -ki 选项终止使用文件的进程\n\
    \n> **注意**：*本指南第 6 节更详细地涵盖了进程。*\n\n常见用法示例：\n\n- `fuser [文件]`\n    显示使用指定文件的进程\n\
    - `fuser -v [文件]`\n    显示正在使用的文件的详细信息\n- `fuser -ki [文件]`\n    终止使用指定文件的所有进程\n\
    \n"
