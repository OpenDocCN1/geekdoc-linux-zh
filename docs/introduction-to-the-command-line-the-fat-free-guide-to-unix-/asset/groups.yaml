    \n**mail** 命令用于发送电子邮件消息。在上面的示例中，创建了一封新邮件并指定了收件人。按回车键后，邮件客户端会提示你输入消息主题。再次按回车键将开始输入消息正文。按\
    \ **CTRL + D** 可退出邮件客户端并发送消息。\n\n> **提示** 按 **CTRL + C** *两次* 可取消编辑并丢弃邮件消息（不发送）。\n\
    \n文本文件可以替代邮件消息的正文。在下一个示例中，`message.txt` 文件中的文本将作为消息正文发送。\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_162_1.png)\n\
    \n**常用示例：**\n\n- `mail` 检查新邮件\n- `mail [ADDRESS]` 向指定地址创建新消息\n- `mail [ADDRESS]\
    \ < [FILE]` 使用指定文件作为消息正文\n- `mail -s \"[SUBJECT]\" [ADDRESS]` 在命令行中指定消息主题\n\n\
    ## ftp\n\n**用途：** 使用 FTP（文件传输协议）传输文件。\n\n**用法语法：** `ftp [OPTIONS] [HOST]`\n\n\
    ```bash\n# ftp 10.10.1.48\nConnected to 10.10.1.48.\nName (10.10.1.45): nick\n\
    Password: ******\n230 Login successful.\nRemote system type is UNIX.\nUsing binary\
    \ mode to transfer files.\nftp>\n```\n\n使用 ftp 命令连接到 FTP 服务器\n\n`ftp` 命令使用 FTP\
    \ 协议传输文件。上述示例演示了如何使用 `ftp` 命令连接到远程 FTP 服务器。连接到远程系统后，你可以执行下表列出的任一 FTP shell 命令。\n\
    \n| **命令** | **功能** |\n| :--- | :--- |\n| **ascii** | 以 ASCII 格式传输文件 |\n| **binary**\
    \ | 以二进制格式传输文件 |\n| **status** | 显示连接状态 |\n| **pwd** | 打印当前工作目录 |\n| **ls** |\
    \ 列出远程目录内容 |\n| **get [FILE]** | 下载指定的远程文件 |\n| **put [FILE]** | 上传指定的本地文件 |\n\
    | **cd [PATH]** | 在远程系统上更改目录 |\n| **lcd [PATH]** | 在本地系统上更改目录 |\n| **mkdir [DIR]**\
    \ | 创建目录 |\n| **rmdir [DIR]** | 删除目录 |\n| **delete [FILE]** | 删除文件 |\n| **rename\
    \ [FILE]** | 重命名文件 |\n| **bye** | 终止 FTP 连接 |\n\n**常用示例：**\n\n- `ftp [HOST]` 与指定主机建立\
    \ FTP 会话\n- `ftp -P [HOST]` 使用被动模式进行数据传输\n\n## wget\n\n**用途：** Linux 系统的文件下载工具。\n\
    \n**用法语法：** `wget [OPTIONS] [SOURCE]`\n\n```bash\n$ wget http://kernel.org/pub/linux/kernel/v2.6/patch-2.6.29.4.bz2\n\
    --2009-06-02 01:15:58--  http://kernel.org/pub/linux/kernel/v2.6/patch-2.6.29.4.bz2\n\
    Resolving kernel.org... 149.20.20.133, 204.152.191.37\nConnecting to kernel.org[149.20.20.133]:80...\
    \ connected.\nHTTP request sent, awaiting response... 200 OK\nLength: 91866 (90K)\
    \ [application/x-bzip2]\nSaving to: \"patch-2.6.29.4.bz2\"\n100%[=======================================>]\
    \ 91,866  99.6K/s in 0.9s\n2009-06-02 01:16:03 (99.6 KB/s) - 'patch-2.6.29.4.bz2'\
    \ saved\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_164_0.png)\n\n**wget**\
    \ 是命令行文件下载工具。它可以用于通过 HTTP 和 FTP 协议下载文件。在上面的示例中，从远程 HTTP 系统下载了一个文件并保存在当前目录中。\n\n\
    > **提示**\n> *使用 `--user=[USERNAME]` 和 `--password=[PASSWORD]` 选项可指定连接远程系统时使用的用户名和密码。*\n\
    \n**常用示例：**\n\n| 用法 | 描述 |\n| :--- | :--- |\n| `wget http://[HOST/FILE]` | 通过\
    \ HTTP 下载指定文件 |\n| `wget ftp://[HOST/FILE]` | 通过 FTP 下载指定文件 |\n\n## showmount\n\
    \n**用途：** 显示 NFS 挂载和导出信息。\n\n**用法语法：** `showmount [OPTIONS]`\n\n```bash\n# showmount\n\
    Hosts on noc-01:\n 10.10.1.48\n```\n\n使用 showmount 命令显示已连接的 NFS 客户端\n\n`showmount`\
    \ 命令显示在本地系统上运行的 NFS 服务器信息。上述示例演示了如何使用 `showmount` 显示当前连接到 NFS 服务器的客户端列表。\n\n下一个示例演示了如何使用\
    \ `-e` 选项显示 NFS 服务器的导出列表。\n\n```bash\n# showmount -e\nExport list for noc-01:\n\
    \ /home  10.10.1.0/255.255.255.0\n```\n\n显示已导出目录的列表\n\n`-d` 选项用于显示当前正在使用的已导出目录列表，如下一个示例所示。\n\
    \n```bash\n# showmount -d\nDirectories on noc-01:\n /home\n```\n\n显示当前正在使用的已导出目录列表\n\
    \n**常用示例：**\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `showmount` | 显示当前连接到服务器的 NFS 客户端\
    \ |\n| `showmount -e` | 显示 NFS 服务器导出的目录 |\n| `showmount -d` | 列出当前正在使用的已导出目录 |\n\
    | `showmount -a` | 显示 NFS 客户端及其已挂载的目录 |\n\n## 第 9 节：硬件管理命令\n\n**概述**\n\n本节中的命令涵盖了基本的\
    \ Unix、Linux 和 BSD 硬件管理工具。这些命令可用于识别、配置和排除系统设备故障。\n\n**本节涵盖的命令：**\n\n| 命令 | 用途\
    \ |\n| :--- | :--- |\n| lshw | 列出 Linux 系统上的硬件。 |\n| ioscan | 列出 HP-UX 系统上的硬件。\
    \ |\n| lsdev | 列出 AIX 系统上的硬件。 |\n| lspci | 列出 Linux 系统上的 PCI 设备。 |\n| pci conf\
    \ | 列出 BSD 系统上的 PCI 设备。 |\n| lsusb | 列出 Linux 系统上的 USB 设备。 |\n| dmidecode | 显示系统设备的详细信息。\
    \ |\n| hdparm | 在 Linux 系统上显示/设置硬盘参数。 |\n| eject | 弹出可移动介质。 |\n\n**本节使用的术语表：**\n\
    \n- **IDE**（集成驱动器电子学）用于将磁盘驱动器连接到计算机的旧式接口。\n- **PCI**（外围组件互连）用于将内部设备连接到计算机的接口。\n\
    - **SATA**（串行高级技术附件）用于将磁盘驱动器连接到计算机的现代接口。\n- **USB**（通用串行总线）用于将外部设备连接到计算机的接口。\n\
    \n## lshw\n\n**用途：** 列出 Linux 系统上的硬件。\n\n**用法语法：** `lshw [OPTIONS]`\n\n```bash\n\
    # lshw -short\nH/W path  Device  Class       Description\n=========================================================\n\
    /0        system                  OptiPlex GX520\n/0/0      bus              \
    \       0WG233\n/0/0      memory                  64KiB BIOS\n/0/400    processor\
    \               Intel(R) Pentium(R) 4 CPU 3.00GHz\n/0/400/700 memory         \
    \       16KiB L1 cache\n/0/400/701 memory                2MiB L2 cache\n/0/400/0.1\
    \ processor            Logical CPU\n/0/400/0.2 processor            Logical CPU\n\
    /0/1000   memory                  2GiB System Memory\n/0/1000/0 memory       \
    \         1GiB DIMM DDR Synchronous 533 Mhz\n...\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_167_0.png)\n\
    \n**lshw** 命令列出 Linux 系统上安装的所有硬件信息。在上面的示例中，使用 `-short` 选项提供本地系统上检测到的硬件的简单列表。省略\
    \ `-short` 选项将显示设备的详细列表，如下一个示例所示。\n\n```bash\n# lshw\nnc-01\ndescription: Mini\
    \ Tower Computer\nproduct: OptiPlex GX520\nvendor: Dell Inc.\nserial: ******\n\
    width: 32 bits\ncapabilities: smbios-2.3 dmi-2.3 smp-1.4 smp\nconfiguration: administrator_password=enabled\
    \ boot=normal\nchassis=mini-tower cpus=1\n*-core\ndescription: Motherboard\nproduct:\
    \ 0WG233\nvendor: Dell Inc.\n...\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_167_1.png)\n\
    \n**常用示例：**\n\n- `lshw` 显示详细的硬件列表\n- `lshw -short` 显示简单的硬件列表\n\n"
