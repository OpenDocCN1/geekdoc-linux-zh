    ...\n```\n\n使用 service 命令显示服务状态\n\nservice 命令用于管理 Linux 系统上的服务。在上面的示例中，--status-all\
    \ 选项显示系统中所有服务的状态。`+` 符号表示正在运行的服务，`−` 符号表示已停止的服务。\n\n可以使用 start、stop、restart 和\
    \ status 选项来控制单独的服务，如下一个示例所示。\n\n```\n# service ssh stop\n* Stopping OpenBSD Secure\
    \ Shell server sshd [ OK ]\n# service ssh start\n* Starting OpenBSD Secure Shell\
