    ## Section 14: Software Installation


    ### Overview


    Software installation is the one area that varies greatly across the different
    Unix, Linux, and BSD systems. Each distribution has its own unique set of software
    management utilities. This section provides an overview of these software management
    commands for each platform.


    Commands covered in this section:


    | Command | Purpose |

    |:---|:---|

    | dpkg | Install /remove Debian Linux software packages. |

    | aptitude | Automated package manager for Debian Linux-based systems. |

    | rpm | Install /remove Red Hat Linux packages. |

    | yum | Automated package manager for Red Hat Linux-based systems. |

    | emerge | Install /remove Gentoo Linux packages. |

    | pkg_add pkg_delete | Install /remove BSD packages. |

    | pkg_info | Display information about BSD packages. |

    | installp | Install software packages on AIX systems. |

    | lslpp | List installed software on AIX systems. |

    | pkgr add pkg rm | Install /remove Solaris packages. |

    | pkginfo | List installed packages on Sun Solaris systems. |

    | make | Compile and install software from source code. |


    ### Glossary of terms used in this section:


    | Term | Definition |

    | :--- | :--- |

    | A P T | (Advanced Packaging Tool) A package manager used on Debian Linux-based
    systems. |

    | Compile | The process of converting source code into a binary/executable file.
    |

    | Dependency | A program or library required in order for another program to function
    properly. |

    | Makefile | A file used during the compilation of software. |

    | Package | A self contained file used for software installation. |

    | Portage | Package manager used on Gentoo Linux-based systems. |

    | Repository | A source of packages used by a package management program. |

    | RPM | (Red Hat Package Manager) A software package format created by Red Hat,
    Inc. |


    ## dpkg


    **Purpose:** Install/remove Debian Linux software packages.


    **Usage syntax:** `dpkg [OPTIONS] [FILE]`


    ```bash

    # dpkg -i apache2_amd64.deb

    Preparing to install apache2 (using apache2_amd64.deb).

    Unpacking apache2.

    Setting up apache2.

    Processing triggers for man-db ...

    Processing triggers for ufw ...

    ...

    ```


    *Installing the Apache web server package using dpkg*


    **dpkg** is the traditional package manager for Debian Linux-based systems. It
    can be found on Debian and Ubuntu as well as a host of other Linux distributions
    built on the Debian core.


    Using **dpkg**, you can install or remove programs created specifically for Debian-based
    systems. These packages typically have a .deb file extension. The above example
    demonstrates using the **dpkg** command to install a Debian package.


    > **Note**

    > Most Debian-based systems now utilize a program called `aptitude` to perform
    software installation tasks. Directly installing packages using `dpkg` is rarely
    done given that `aptitude` will automatically download and install the requested
    package(s) and all required dependencies. See page 234 for more information.


    **Common usage examples:**


    | Command | Description |

    | :--- | :--- |

    | `dpkg -i [PACKAGE]` | Install the specified package |

    | `dpkg -r [PACKAGE]` | Remove the specified package |

    | `dpkg -p [PACKAGE]` | Remove the specified package and related config files
    |

    | `dpkg -l` | List all installed packages |

