    | **emacs** | 健壮且可扩展的文本编辑器。 |

    | **sed** | 复杂的流编辑器。 |

    | **awk** | 文本处理和模式匹配程序。 |

    | **strings** | 从二进制文件中提取可读字符。 |

    | **cat** | 连接文件并显示其内容。 |

    | **tac** | 按反向顺序连接文件。 |

    | **wc** | 统计文件中的行数、单词数和字符数。 |

    | **more** | 每次一页显示命令或文本文件的输出。 |

    | **less** | 每次一页（或一行）显示命令或文本文件的输出。 |

    | **head** | 显示文件的开头部分。 |

    | **tail** | 显示文件的末尾部分。 |

    | **tee** | 显示命令的输出并将输出写入文件。 |

    | **grep** | 匹配模式并过滤数据。 |

