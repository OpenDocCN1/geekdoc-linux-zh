    - 第 1 部分：Unix、Linux 和 BSD 架构概述 .......10\n- 第 2 部分：命令行基础 .......18\n- 第 3 部分：高级\
    \ Shell 功能和命令 .......38\n- 第 4 部分：文本编辑和提取 .......60\n- 第 5 部分：用户、组和安全 .......81\n\
    - 第 6 部分：进程控制和调度 .......106\n- 第 7 部分：启动和关机 .......122\n- 第 8 部分：网络命令 .......139\n\
    - 第 9 部分：硬件管理命令 .......167\n- 第 10 部分：文件系统 .......177\n- 第 11 部分：备份和恢复命令 .......192\n\
    - 第 12 部分：监控和故障排除 .......200\n- 第 13 部分：打印命令 .......224\n- 第 14 部分：软件安装 .......231\n\
    - 第 15 部分：系统管理工具 .......245\n- 附录 A：Bash 快捷键 .......248\n\n> “UNIX 基本上是一个简单的操作系统，但你需要是个天才才能理解这种简单。”\n\
    > \n> – 丹尼斯·里奇（Dennis Ritchie）\n> \n> C 编程语言发明者，UNIX 共同创造者\n\n# 简介\n\n命令行可能是一个令人望而生畏且毫不宽容的环境。与在图形环境中工作不同，在终端中必须执行哪些命令才能完成特定任务并不完全清楚。考虑到命令行不会阻止你执行可能导致系统不可逆损坏的操作，就很容易理解为什么很多人从未花时间去学习如何使用它。\n\
    \n尽管新用户（在科技行业中被戏称为“新手”）面临隐藏的危险和不确定性，你不应该害怕命令行。凭借本书提供的信息，你将获得在命令行环境中变得更加熟练所必需的技能。你会发现大多数\
    \ Unix、Linux 和 BSD 系统共享相同的核心架构，只有少数细微差异。在学习了 Unix、Linux 和 BSD 系统的基本架构和命令后，你将能够轻松地在不同平台之间转换。\n\
    \n为了辅助学习过程，我建议下载下列免费操作系统中的一个或多个，以练习本指南中的命令。\n\n| 操作系统 | 类型 | 网站 |\n| :--- | :---\
    \ | :--- |\n| Ubuntu | Linux | www.ubuntu.com |\n| Fedora | Linux | www.fedoraproject.org\
    \ |\n| CentOS | Linux | www.centos.org |\n| openSUSE | Linux | www.opensuse.org\
    \ |\n| OpenSolaris | Unix | www.opensolaris.org |\n| FreeBSD | BSD | www.freebsd.org\
    \ |\n\n尝试多种 Unix、Linux 和 BSD 发行版以获得对各种平台的广泛知识，这是一次值得的体验。这将有助于扩展你对各种类 Unix 操作系统的知识，并赋予你在任何命令行环境中工作所需的技能。\n\
    \nLinux 是推荐的新手起点。它支持所有最新硬件，并提供用户友好的安装过程。OpenSolaris Unix 平台也是一个很好的起点，因为它是面向新手最友好的基于\
    \ Unix 的系统之一。BSD 安装稍微具有挑战性，需要高级技术知识或 Unix 和 Linux 系统的先前经验。\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_6_0.png)\n\
    \n> 我强烈推荐使用 Ubuntu 服务器版。它提供简单的安装体验和出色的命令行学习环境。请访问 www.ubuntu.com 获取有关 Ubuntu Server\
    \ Linux 发行版的更多信息。\n\n如果你是一名 Microsoft Windows 用户，你可能已经拥有一些命令行经验。如果你曾经打开 DOS 提示符并执行过诸如\
    \ `ping`、`nslookup` 或 `ipconfig` 之类的命令，那么你知道这些命令可以极其有帮助。Unix、Linux 和 BSD 系统提供类似的命令。例如，`ping`\
    \ 和 `nslookup` 命令在 Unix/Linux 上与在 DOS 中表现相同。但是，你应当注意，DOS `ipconfig` 命令在 Unix/Linux/BSD\
    \ 世界中的对应命令是 `ifconfig`。如果你不是 DOS 老手，别担心 - 我们将在本指南中涵盖所有这些主题。\n\n你在运行 Mac OS X 吗？如果是，那么你已经正在运行一个基于\
    \ Unix 的操作系统。在 Mac OS X 闪亮的图形用户界面背后，是一个坚固的 Unix 核心。要在 Mac OS X 中访问命令行，只需启动“终端”应用程序（位于\
    \ *应用程序 > 实用工具 > 终端*）。在那里，你将能够访问本指南中讨论的所有标准 Unix 命令行实用程序。\n\n## Unix、Linux 和 BSD\
    \ 的简要历史\n\nUnix 于 1969 年创建，当时贝尔实验室是 AT&T 的研究和开发部门。自那时起，Unix 已经分支出许多不同的商业和开源实现，其中大多数基于原始的\
    \ AT&T 标准。现代基于 Unix 的系统通常分为以下几类：\n\n- **Unix**：*源自原始 AT&T 代码库的商业实现*\n- **BSD**：*源自原始\
    \ Unix 代码库的开源操作系统*\n- **Linux**：*从头编写的开源 Unix 兼容克隆*\n\n在 1970 年代，加州大学伯克利分校的研究人员开始开发\
    \ BSD（Berkeley Software Distribution 的缩写）。BSD 最初基于 AT&T Unix 代码库，但随着时间的推移已被重写，以从系统中删除\
    \ AT&T 受版权保护的代码。这使得 BSD 可以在最少限制下进行分发。自那以来，BSD 代码库已分裂形成了许多流行的操作系统，包括 FreeBSD、OpenBSD\
    \ 和 NetBSD。在由 Microsoft、Apple 和 Sun Microsystems 创建的专有操作系统中也可以找到 BSD 代码。\n\n商业\
    \ Unix 系统在 1980 年代初开始出现。这些系统结合了不同比例的 Unix 和 BSD 代码以及供应商特定的增强功能，以创建诸如 AIX、HP-UX\
    \ 和 Sun Solaris 等新平台。如今，在许多大型公司的数据中心中都可以找到运行关键任务应用的商业 Unix 系统。\n\n1991 年，芬兰赫尔辛基大学一名名叫林纳斯·托瓦兹（Linus\
    \ Torvalds）的计算机科学学生创建了 Linux 操作系统。虽然 Linux 共享了 Unix 的许多核心概念，但它不包含任何 Unix 代码。这意味着它可以像\
    \ BSD 一样自由分发（尽管采用不同的许可证）。第一个商业 Linux 发行版出现在 19 世纪 90 年代中期。自那以来，已经开发了几百种 Linux\
    \ 变体。Linux 操作系统的开放性质促成了其成功，并帮助使其成为今天使用最流行的服务器操作系统之一。\n\nUnix 平台在图形用户界面发明之前就已经存在了。基于\
    \ Unix 的系统在现代计算中仍然是一支强大的力量，这是对平台工业设计的见证。随着 Unix、Linux 和 BSD 的人气处于历史最高水平，现在是探索这些平台并加入这一运动的完美时机。\n\
    \n"
