    \ 列出所有打开的文件\n- **lsof [文件]** 列出特定文件的信息\n- **lsof -u [用户名]** 列出由指定用户打开的文件\n- **lsof\
    \ -P [PID]** 列出由指定 PID 号打开的文件\n- **lsof -c [进程名]** 列出具有指定进程名的打开文件\n- **lsof -i**\
    \ 列出打开的网络端口和套接字\n\n## fuser\n\n用途：显示打开文件的信息。\n\n用法语法：`fuser [选项] [目录/文件]`\n\n\
