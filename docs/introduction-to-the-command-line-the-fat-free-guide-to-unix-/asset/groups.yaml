  - "[PAGE 151]\n\n# # host\n\n**Purpose:** Simple DNS lookup utility.\n\n**Usage\
    \ syntax:** `host [OPTIONS] [HOST]`\n\n```\n```\n$ host dontfearthecommandline.com\n\
    dontfearthecommandline.com has address 64.202.189.170\ndontfearthecommandline.com\
    \ mail is handled by 0 smtp.secureserver.net.\ndontfearthecommandline.com mail\
    \ is handled by 10\n  mailstore1.secureserver.net.\n```\nResolving a name using\
    \ the host command\n```\n\nThe `host` command is a simple DNS lookup utility for\
    \ Unix and Linux systems. It is similar to the `nslookup` and `dig` utilities,\
    \ except it provides user friendly output that is easier to read and understand.\
    \ The above example displays a sample of the output produced by the `host` command.\n\
    \nThe `-t` option can be used with the `host` command to lookup other information\
    \ about the domain such as the mail server (`-t MX`) and name server (`-t NS`)\
    \ as shown in the next example.\n\n```\n```\n$ host -t MX dontfearthecommandline.com\n\
    dontfearthecommandline.com mail is handled by 10\n  mailstore1.secureserver.net.\n\
    dontfearthecommandline.com mail is handled by 0 smtp.secureserver.net.\n$ host\
    \ -t NS dontfearthecommandline.com\ndontfearthecommandline.com name server ns36.domaincontrol.com.\n\
    dontfearthecommandline.com name server ns35.domaincontrol.com.\n```\nResolving\
    \ MX and NS records using the host command\n```\n\nCommon usage examples:\n\n\
    +   `host [HOST]`\n+   \tDisplay DNS information for the specified host\n+   \n\
    +   `host -t MX [HOST]`\n+   \tDisplay the mail server for the specified host\n\
    +   \n+   `host -t NS [HOST]`\n+   \tDisplay the name server for the specified\
    \ host\n+   \n+   `host -a [HOST]`\n+   \tDisplay detailed information for the\
    \ specified host"
