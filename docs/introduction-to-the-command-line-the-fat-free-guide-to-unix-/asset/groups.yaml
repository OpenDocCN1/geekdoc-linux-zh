    \n**Common usage examples:**\n\n| Command | Description |\n| :--- | :--- |\n|\
    \ `yum install [PACKAGE]` | Install the specified package |\n| `yum remove [PACKAGE]`\
    \ | Remove the specified package |\n| `yum update` | Install the newest versions\
    \ of all packages |\n| `yum upgrade` | Upgrade the distribution to the latest\
    \ version |\n| `yum list` | List available and installed packages |\n| `yum search\
    \ [NAME]` | Search for the specified package by name |\n\n# emerge\n\n**Purpose:**\
    \ Install/remove Gentoo Linux packages.\n\n**Usage syntax:** `emerge [OPTIONS]\
    \ [PACKAGE]`\n\n```bash\n# emerge uptime\nCalculating dependencies... done!\n\
    >>> Verifying ebuild Manifests...\n>>> Emerging (1 of 1) app-vim/uptime-1.3 to\
    \ /\n>>> Downloading 'http://distfiles.gentoo.org/distfiles/uptime-1.3.tar.bz2'\n\
    ...\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_236_0.png)\n\n**emerge**\
    \ is a front-end for Gentoo's **Portage** software manager. It provides automatic\
    \ software compilation, installation, and dependency fulfillment similar to the\
    \ previously discussed **aptitude** and **yum** commands.\n\nPortage is a unique\
    \ package manager in the fact that it compiles software from source code. This\
    \ is different than most other Linux systems which utilize precompiled binaries\
    \ when installing software. Compiling software from source code creates a platform-optimized\
    \ installation that has been shown to provide better performance when compared\
    \ to precompiled packages. Portage's disadvantage, however, is that it takes much\
    \ longer to install software from source.\n\n> *To learn more about the Portage\
    \ software manager, see the official Gentoo documentation online at www.gentoo.org/doc/.*\n\
    \nCommon usage examples:\n\n- `emerge [PACKAGE]` Install the specified package\n\
    - `emerge -u world` Install the newest versions of all packages\n- `emerge -C\
    \ [PACKAGE]` Remove the specified package\n- `emerge -s [PACKAGE]` Search for\
    \ the specified package\n- `emerge --sync` Update the portage database\n\n# pkg_add\
    \ / pkg_delete\n\n**Purpose:** Install/remove BSD packages.\n\n**Usage syntax:**\
    \ `pkg_add [OPTIONS] [PACKAGE]`\n\n```bash\n# pkg_add -r perl \nFetching ftp://ftp.freebsd.org/pub/FreeBSD/ports/i386/packages-7.2-release/Latest/perl.tbz...\n\
    Creating various symlinks in /usr/bin...\nSymlinking /usr/local/bin/perl5.8.9\
    \ to /usr/bin/perl\n...\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_237_0.png)\n\
    \nThe `pkg_add` command installs software packages on BSD systems. In the above\
    \ example, `pkg_add` is used to install a package called Perl. The `-r` option\
    \ instructs `pkg_add` to retrieve the specified package automatically from the\
    \ BSD software repository.\n\n> The `pkg_add` command uses the default FTP server\
    \ located at ftp.freebsd.org. For faster download you can specify an FTP mirror\
    \ using the `PACKAGEROOT` environment variable. For example, typing `export PACKAGEROOT=ftp.ca.freebsd.org`\
    \ would instruct the `pkg_add` command to use the specified mirror located in\
    \ Canada. A complete list of FTP mirror sites can be found online at http://mirrorlist.freebsd.org/FPBSDisites.php.\n\
    \nThe `pkg_delete` command uninstalls software packages on BSD systems. In the\
    \ next example, the previously installed Perl package is removed using the `pkg_delete`\
    \ command.\n\n**Usage syntax:** `pkg_delete [PACKAGE]`\n\n```bash\n# pkg_delete\
    \ perl-5.8.9_2 \nRemoving stale symlinks from /usr/bin...\nRemoving /usr/bin/perl5...\
    \ Done.\n...\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_237_1.png)\n\n**Common\
    \ usage examples:**\n\n- `pkg_add -r [PACKAGE]` — Download and install the specified\
    \ package\n- `pkg_delete [PACKAGE]` — Uninstall the specified package\n\n# pkg_info\n\
    \n**Purpose:** Display information about BSD packages.\n\n**Usage syntax:** `pkg_info\
    \ [OPTIONS]`\n\n```bash\n# pkg_info\nbash-4.0.33          The GNU Project's Bourne\
    \ Again SHell\nen-freebsd-doc-20090913 Documentation from the FreeBSD Documentation\n\
    Project\ngttext-0.17.1        GNU gettext package\nlibiconv-1.13.1      A character\
    \ set conversion library\nlua-5.1.1.4          Small, compilable scripting language\
    \ providing easy\naccess\nnano-2.0.9_1         Nano's ANOther editor, an enhanced\
    \ free Pico clone\nnmap-5.00            Port scanning utility for large networks\n\
    pcRE-7.9             Perl Compatible Regular Expressions library\nperl-5.8.9.3_1\
    \       Practical Extraction and Report Language\npkg-config-0.23.1    A utility\
    \ to retrieve information about installed\nlibraries\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_238_0.png)\n\
    \nThe `pkg_info` command displays information about installed packages on BSD\
    \ systems. In the above example, executing `pkg_info` with no options generates\
    \ a simple list of installed programs.\n\nExecuting the `pkg_info` command with\
    \ the `-a` option displays detailed information about the installed packages as\
    \ displayed in the next example.\n\n```bash\n# pkg_info nmap-5.00 | less\nInformation\
    \ for nmap-5.00:\n\nComment:\nPort scanning utility for large networks\n\nDescription:\n\
    Nmap is a utility for network exploration and security auditing.\n...\n```\n\n\
    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_238_1.png)\n\n**Common usage examples:**\n\
    \n- `pkg_info` | Display a simple list of installed packages\n- `pkg_info -a`\
    \ | Display a detailed list of installed packages\n- `pkg_info [PACKAGE]` | Display\
    \ information about the *specified* package\n"
