    \n大多数程序默认以 0 的 nice 级别启动。关键系统服务通常具有负 nice 级别，因此它们始终优先于用户程序获得资源。\n\n> 某些 Unix 系统可能使用\
    \ 0 到 39 的范围，其中 0 是最高优先级，39 是最低优先级。有关更多信息，请参阅您本地系统中的 `man nice`。\n\n常见用法示例：\n\n\
    - `nice -n [NUM] [COMMAND]`：以指定优先级启动程序\n\n# renice\n\n**用途**：更改运行中进程的优先级。\n\n\
    **用法语法**：`renice [OPTIONS] [PID]`\n\n```text\n# renice +5 -p 7279\n7279: old priority\
    \ 0, new priority 5\n```\n*更改进程的优先级*\n\n`renice` 命令调整运行中进程的优先级。在上面的示例中，PID 7279\
    \ 被调整为 +5 的优先级。由于之前的优先级为 0，这实际上降低了该进程的优先级。\n\n**常见用法示例：**\n\n- `renice +/- [NUM]\
    \ -p [PID]`：更改指定 PID 的优先级\n\n# &\n\n**用途**：在后台启动进程。\n\n**用法语法**：`[COMMAND] &`\n\
    \n```text\n$ ./SomeProgram.sh &\n[1] 10717\n$ ps\nPID TTY TIME CMD\n10696 pts/0\
    \ 00:00:00 bash\n10717 pts/0 00:00:03 SomeProgram.sh\n10721 pts/0 00:00:00 ps\n\
    ```\n*使用 & 命令行运算符在后台执行程序*\n\n`&` 是一个命令行运算符，指示 shell 在后台启动指定程序。这允许您在不需要启动多个终端会话的情况下同时运行多个程序。在上面的示例中，名为\
    \ `SomeProgram.sh` 的 shell 脚本作为后台进程启动。执行 `ps` 命令显示该程序现在正在后台运行。\n\n> **提示**\n>\
    \ 后台程序的输出仍会在 shell 中显示。您可以使用以下语法将输出重定向到文件：`SomeProgram.sh > output.log &` 这将把后台程序的所有输出重定向到当前目录中名为\
    \ `output.log` 的文件。\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `[COMMAND] &` | 在后台执行指定命令\
    \ |\n| `[COMMAND] > [FILE] &` | 将后台命令的输出重定向到文件 |\n\n# bg / fg\n\n**用途**：将进程移动到后台/前台。\n\
    \n**用法语法**：`bg [JOBID]`\n\n```text\n$ ./SomeProgram.sh\n<CTRL + Z>\n[1]+  Stopped\
    \        SomeProgram.sh\n$ bg 1\n$ jobs\n[1]-  Running        SomeProgram.sh\n\
    ```\n*挂起运行中的程序，然后在后台恢复它*\n\n`bg` 命令将进程发送到后台。这允许您在单个终端会话中多任务处理多个程序。在上面的示例中，shell\
    \ 脚本 `SomeProgram.sh` 被挂起（通过按键盘上的 **CTRL + Z**），然后使用 `bg` 作为后台进程恢复。\n\n> **注意**\
    \ 可以使用 `jobs` 命令（见第 117 页）来验证该程序现在是否在后台运行。\n\n`fg` 命令将后台进程移动到前台。在下一个示例中，使用 `fg`\
    \ 命令将指定的作业 ID 恢复到前台。\n\n**用法语法**：`fg [JOBID]`\n\n```text\n$ jobs\n[1]-  Running\
    \        SomeProgram.sh\n$ fg 1\nSomeProgram.sh\n...\n```\n*将后台作业恢复到前台*\n\n**常见用法示例：**\n\
    \n| 命令 | 描述 |\n| :--- | :--- |\n| `bg [JOBID]` | 将指定作业发送到后台 |\n| `fg [JOBID]`\
    \ | 将指定作业恢复到前台 |\n\n# jobs\n\n**用途**：显示后台和挂起的作业。\n\n**用法语法**：`jobs [OPTIONS]`\n\
    \n```text\n$ jobs  \n[1]-  Running        SomeProgram.sh  \n[2]+  Stopped    \
    \    AnotherProgram.sh  \n[3]   Stopped        Test.sh\n```\n*使用 jobs 命令显示后台程序*\n\
    \n`jobs` 命令显示后台程序和挂起进程的状态。在上面的示例中，显示了三个后台作业。可以使用前面提到的 `fg` 和 `bg` 命令分别将进程移动到前台和后台。\n\
    \n下表描述了 `jobs` 命令的输出字段。\n\n| 作业 ID | 状态 | 程序 |\n| :-- | :-- | :-- |\n| `[1]-`\
    \ | Running | `SomeProgram.sh` |\n| `[2]+` | Stopped | `AnotherProgram.sh` |\n\
    | `[3]` | Stopped | `Test.sh` |\n\n*jobs 命令的输出字段*\n\n> **注意**\n> 加号用于指示哪个作业被认为是默认作业（用于\
    \ `bg` 和 `fg` 命令）。减号指示如果当前默认作业终止，哪个作业将成为默认作业。在任何给定时间只能有一个 + 或 -。所有其他作业将没有指示符。\n\
    \n**常见用法示例：**\n\n- `jobs`：显示所有作业\n- `jobs -1`：显示所有作业及其 PID\n\n# nohup\n\n**用途**：运行不受挂起信号影响的进程。\n\
    \n**用法语法**：`nohup [COMMAND] &`\n\n```text\n$ nohup SomeProgram.sh &\nnohup: ignoring\
    \ input and appending output to 'nohup.out'\n$ exit\n```\n*使用 nohup 命令启动后台程序*\n\
    \n**`nohup`** 命令使进程不受挂起信号的影响。挂起信号用于通知 shell 的子进程父进程正在终止。通常这会导致所有子进程终止。使用 **`nohup`**\
    \ 允许程序在您注销后继续运行，如上面的示例所示。\n\n> 程序的输出存储在 nohup 命令执行目录中名为 `nohup.out` 的文件中。\n\n\
    **常见用法示例：**\n\n- `nohup [COMMAND] &`：执行不受挂起信号影响的程序\n\n# at / atq / atrm\n\n**用途**：安排程序在指定时间运行。\n\
    \n**用法语法**：`at [OPTIONS] [TIME|DATE]`\n\n```text\n$ at 1am\nat> MyProgram.sh\n\
    at> <CTRL + D>\nJob 1 at Sat May 30 01:00:00 2009\n```\n*使用 at 命令安排进程*\n\n`at`\
    \ 命令安排程序在指定时间运行。在上面的示例中，使用 `at` 命令启动名为 MyProgram.sh 的 shell 脚本。此示例中指定的启动时间为命令行上的\
    \ 1am（凌晨 1 点）。您还可以使用更传统的 Unix 时间格式，如 01:00 或任何 HH:MM 组合。\n\n> **提示**\n> `at` 命令有一个特殊的命令行参数称为\
    \ `now`。它可以用作安排作业时节省时间的快捷方式。例如，输入 `at now + 15 minutes` 将安排作业从当前时间起 15 分钟后启动。\n\
    \n`atq` 命令显示队列中 `at` 作业的信息，如下一个示例所示。\n\n**用法语法**：`atq`\n\n```text\n$ atq\n1\t\
    Sat May 30 01:00:00 2009 MyProgram.sh nick\n```\n*使用 atq 命令显示作业队列*\n\n`atrm` 命令删除已安排的作业，如下一个示例所示。\n\
    \n**用法语法**：`atrm [JOBID]`\n\n```text\n$ atrm 1\n```\n*使用 atrm 命令删除已安排的作业*\n\n\
    **常见用法示例：**\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `at [TIME]` | 安排程序在指定时间运行 |\n|\
    \ `atq` | 显示 `at` 作业队列 |\n| `atrm [JOBID]` | 从 `at` 队列中删除已安排的作业 |\n\n"
