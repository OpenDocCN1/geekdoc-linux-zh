    > **注意**：用户登录/注销活动存储在 /var/log/wtmp 文件中。失败的登录尝试记录在 /var/log/btmp 中。


    **常见用法示例：**

    - `last`：显示最后一次用户登录信息

    - `last -[数字]`：显示指定数量的登录记录

    - `last [用户]`：显示指定用户的最后登录记录

    - `lastb`：显示失败的登录尝试

    - `lastb -[数字]`：显示指定数量的失败登录尝试

    - `lastb [用户]`：显示指定用户的失败登录尝试


