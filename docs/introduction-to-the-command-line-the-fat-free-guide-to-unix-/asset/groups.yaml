    Using the grep command to filter a file


    The **grep** command filters data from a file or command. In the above example,
    **grep** is used to filter the `/var/log/syslog` file and display matches that
    contain the word *failed*.


    > Unix, Linux, and BSD systems are case sensitive. In the above example, the `-i`
    option is used to overcome this and perform a case insensitive search.


    The **grep** command can also be used to filter the output of a command. In the
    next example the output of the **dmesg** command (discussed on page 216) is piped
    to the **grep** command to only display results that contain the word *error*.


    ```

