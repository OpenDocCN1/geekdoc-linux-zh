    # date


    **Purpose**: Display or set the system clock.


    **Usage syntax:** `date [OPTIONS] [TIME/DATE]`


    ```

    `$ date

    Wed Jun 10 20:33:27 CDT 2009

    Output of the date command`

    ```


    The **date** command displays the current time and date for the local system,
    as shown in the above example.


    > **Note**

    > *Unix, Linux, and BSD systems track time in 24-hour format.*


    The `-s` option can be used to set the time/date on the system as demonstrated
    in the next example.


    ```

    `# date -s "07/10/2009 11:30"

    Fri Jul 10 11:30:00 CDT 2009

    Setting the time and date`

    ```


    When setting both the time and date you must use **MM/DD/YYYY HH:MM** format.
    To set the time only you can simply use `date -s HH:MM`.


    > **Note**

    > *You must login as root or use the `sudo` command (discussed on page 91) to
    set the system clock.*


    +   Common usage examples:

    +   | | |

    +   | :--- | :--- |

    +   | `date` | Display the time and date |

    +   | `date -s [HH:MM]` | Set the time |

    +   | `date -s ["MM/DD/YYYY HH:MM"]` | Set the time and date |'
