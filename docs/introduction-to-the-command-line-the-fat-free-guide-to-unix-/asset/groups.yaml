    `mpstat` displays processor utilization information on Linux systems. In the above
    example, executing `mpstat 2 10` instructs the program to display results in two
    second intervals and exit after displaying 10 lines. If the delay and count options
    are omitted `mpstat` will display one line of results and then terminate.


