    \ 信号仅在这些极端情况下使用，因为它可能导致不良结果，如系统不稳定和“僵尸”子进程。\n\n常见用法示例：\n\n| 命令 | 描述 |\n| :---\
    \ | :--- |\n| `kill [PID]` | 终止指定的进程 |\n| `kill -9 [PID]` | 强制无响应的进程终止 |\n\n"
