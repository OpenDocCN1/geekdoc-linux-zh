    \ 显示由指定用户拥有的进程 |\n| `pstree [PID]` | 显示指定 PID 的子进程 |\n\n## kill\n\n**用途：** 终止一个进程。\n\
    \n**用法语法：** `kill [OPTIONS] [PID]`\n\n```\n# pgrep -l mysqld\n5540 mysqld\n# kill\
    \ 5540\n```\n\n使用 kill 命令终止一个进程\n\n`kill` 命令终止指定的 PID。在上面的示例中，使用 `kill` 终止了 PID\
    \ 为 5540 的 `mysqld` 进程。\n\n`kill` 命令的默认行为是请求进程正常退出。如果进程未能正常终止，可以发送可选的 kill 信号以强制进程结束。在此情况下，最常用的\
    \ kill 信号是 `-9`，它会强制终止指定的 PID，如下一个示例所示。\n\n```\n# pgrep -l mysqld\n5545 mysqld\n\
