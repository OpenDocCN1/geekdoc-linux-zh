    last 命令的输出


    `last` 命令显示系统中每个用户的登录和注销时间。它还显示有关系统关机和新启信息，如上述示例所示。


    `lastb` 命令显示失败的登录尝试，如下一个示例所示。


    **语法：** `lastb [选项] [用户]`


