    \n**nmap** 是一个网络扫描工具。它可以用于评估安全性并排除网络连接故障。在上面的示例中，使用 **nmap** 命令来识别指定目标主机的操作系统和开放端口。\n\
    \n> **提示**\n> 为了获得最佳效果，请以 root 用户身份或通过 *sudo* 命令使用 **nmap**。这将允许 **nmap** 在执行网络扫描时拥有对系统资源的无限制访问权限。\n\
    \n**常见用法示例：**\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `nmap [HOST]` | 显示指定主机上的开放端口\
    \ |\n| `nmap -PN [HOST]` | 在扫描前不 ping 目标 |\n| `nmap -O [HOST]` | 显示目标系统的操作系统 |\n\
    | `nmap -A [HOST]` | 执行激进扫描 |\n\n## telnet\n\n用途：通过 telnet 协议连接远程服务器的客户端。\n\n\
    用法语法：`telnet [OPTIONS] [HOST]`\n\n```\n$ telnet myserver\nlogin: nick\npassword:\
    \ ******\n$\n```\n\n使用 telnet 命令连接远程系统\n\n**telnet** 命令用于通过 telnet 协议连接远程系统。上述示例展示了如何使用\
    \ **telnet** 连接远程系统。一旦连接到远程系统，您便可以像在本地登录该系统一样执行命令。\n\n> **注意**\n> **Telnet 是一种不安全的传统协议，出于安全原因，很大程度上已被\
    \ SSH 取代。通过 telnet 传输的用户名、密码及其他敏感信息以明文形式发送，使得黑客很容易截获这些数据。请尽可能避免使用 telnet，尤其是在互联网等不可信网络上通信时。**\n\
    \n常见用法示例：\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `telnet [HOST]` | 启动到远程系统的 telnet\
    \ 会话 |\n\n## ssh\n\n用途：通过 SSH 协议连接远程服务器的客户端。\n\n用法语法：`ssh [OPTIONS] [HOST]`\n\n\
    ```bash\n$ ssh myserver\nnick@myserver's password: ******\n$\n```\n\n使用 ssh 命令连接远程系统\n\
    \n`ssh` 命令用于通过 SSH 协议连接远程系统。SSH 在两个系统之间创建加密连接，并提供安全的通信通道。这有助于防止“中间人”黑客在连接远程系统时截获敏感信息（如用户名和密码）。\n\
    \n| 提示 | PuTTY 是一款用于 Windows 的免费 SSH 和 telnet 客户端，可以从 www.chiark.greenend.org.uk/~sgtatham/putty/\
    \ 下载。这使得您可以直接从 Windows 系统连接到远程 Unix、Linux 和 BSD 服务器。 |\n\n常见用法示例：\n\n```\nssh\
    \ [HOST]              # 启动到远程系统的 SSH 会话\nssh -1 [USER] [HOST]    # 以指定用户身份登录目标系统\n\
