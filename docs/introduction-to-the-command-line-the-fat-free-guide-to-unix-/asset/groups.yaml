    \ option.\n\nThe `hdparm` command can also be used as a performance benchmark\
    \ for disk drives using the `-Tt` option as displayed in the next example.\n\n\
    ```\n# hdparm -Tt /dev/sda\n/dev/sda:\nTiming cached reads:   11832 MB in  1.99\
    \ seconds = 5932.95 MB/sec\nTiming buffered disk reads: 582 MB in  4.30 seconds\
    \ = 135.30 MB/sec\n*Using the -Tt option to display disk performance benchmarks*\n\
    ```\n\n+   **Common usage examples:**\n+   \n+   *   `hdparm [DISK]` Display settings\
    \ for the specified disk\n+   *   `hdparm -Tt [DISK]` Display performance information\
    \ for the specified disk"
