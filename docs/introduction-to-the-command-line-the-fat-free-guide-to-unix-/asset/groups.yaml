    \ -s [SERVICE] off [LEVEL]` | 在指定级别禁用服务 |\n\n## rc-status\n\n用途：显示 Gentoo Linux\
    \ 系统上服务的状态。\n\n语法：`rc-status [选项]`\n\n```\n# rc-status\nRunlevel: default\namavisd\t\
    \t[ started ]\napache2\t\t[ started ]\nclamd\t\t[ started ]\ncourier-authlib\t\
    [ started ]\ncourier-imapd\t[ started ]\ncourier-imapd-ssl\t[ started ]\ncourier-pop3d\t\
    [ started ]\nhostname\t\t[ started ]\nkeymaps\t\t[ started ]\n...\n```\n\nrc-status\
