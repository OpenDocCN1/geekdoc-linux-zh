    \ command\n\n`dump` is an archive utility that creates incremental backups. In\
    \ the above example, the `-0` option indicates a full backup of the `/` file system\
    \ to a file called `backup.dump`.\n\nSubsequent incremental backups are specified\
    \ as `-1`, `-2`, `-3`, etc. The subsequent backups will only archive files that\
    \ have changed since the last full backup. This can save time and storage space\
    \ when creating backups, but it will take longer to restore since the incremental\
    \ backups must be restored in layers.\n\n> **Note**\n> Information about backed\
    \ up files is stored in a file called `dumpdates`.\n> On Unix systems, this file\
    \ is usually found in `/etc/dumpdates`.\n> Linux systems store this information\
    \ in `/var/lib/dumpdates`.\n\nCommon usage examples:\n\n| Command | Description\
    \ |\n|---|---|\n| `dump -0 -uf [OUTPUT] [INPUT]` | Create a full backup |\n| `dump\
    \ -[NUM] -uf [OUTPUT] [INPUT]` | Create an incremental backup |\n"
