    USER   TTY          FROM                  LOGIN@   IDLE   JCPU   PCPU WHAT

    nick   pts/0   10.10.1.251             08:40    1:10   0.18s  0.15s --bash

    dave   pts/1   10.10.1.185            12:32    0.00s  0.14s  0.14s vim

    mike   pts/2   10.10.1.167            14:28    0.00s  0.12s  0.12s tail

    lisa   pts/3   10.10.1.204            14:50    9.00s  0.14s  0.14s --bash

    nick   pts/4   10.10.1.251            15:33    0.00s  0.15s  0.01s w

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_94_0.png)


    The w command shows detailed information about users logged into the system. It
    is similar to the previously discussed who command except it provides additional
    information such as the user''s last login time, how long they have been idle,
    and what program they are currently running.


    The w command also displays a system summary line that shows the host''s uptime,
    number of connected users, and samples of system load averages for the past 1,
    5, and 15 minutes.


    > The information displayed on the first line is the same output generated by
    the uptime command. See page 215 for more information about system uptime and
    load averages.


    **Common usage examples:**

    - `w`: Display detailed information about users currently logged in to the system


    # last / lastb


    **Purpose:** Display the last successful/failed user logins.


    **Usage syntax:** `last [OPTIONS] [USER]`


    ```

    $ last


    nick  pts/1   192.168.1.50  Sat May 22 13:42  still logged in

    nick  pts/0   192.168.1.50  Sat May 22 13:40  still logged in

    nick  tty7    :0            Sat May 22 13:40  still logged in

    reboot  system boot  2.6.32-21-ge  Sat May 22 13:40 - 14:02 (00:21)

    nick  pts/0   :0.0          Thu May 20 21:39 - 21:56 (00:03)

    nick  pts/0   :0.0          Thu May 20 21:30 - 21:33 (00:03)

    root  pts/0   :0.0          Thu May 20 21:27 - 21:30 (00:03)

    nick  tty7    :0            Thu May 20 21:25 - crash (1+16:14)

    ...

    ```


    Output of the last command


    The `last` command displays the login and logout times for each user on the system.
    It also shows information about system shutdowns and restarts as shown in the
    above example.


    The `lastb` command displays failed login attempts as shown in the next example.


    **Usage syntax:** `lastb [OPTIONS] [USER]`


    ```

    $ lastb


    nick  tty1      Sat May 22 13:59 - 13:59 (00:00)

    nick  tty1      Thu May 20 21:27 - 21:27 (00:00)

    root  tty1      Thu May 20 15:27 - 15:27 (00:00)


    btmp begins Sat May 20 13:59:28 2010

    ```


    Output of the lastb command


    > **Note**: User login/logout activity is stored in the /var/log/wtmp file. Failed
    login attempts are logged in /var/log/btmp.


    **Common usage examples:**

    - `last`: Display the last user login information

    - `last -[NUMBER]`: Display the specified number of logins

    - `last [USER]`: Display the last logins for the specified user

    - `lastb`: Display failed login attempts

    - `lastb -[NUMBER]`: Display the specified number of failed login attempts

    - `lastb [USER]`: Display failed login attempts for the specified user


    # lastlog


    **Purpose:** Display the most recent user login information.


    **Usage syntax:** `lastlog [OPTIONS]`


    ```

    $ lastlog | more


    Username      Port      From          Latest

    root          tty2                Sat May 30 11:32:33 –0500 2009

    dave          tty3                Sat May 30 10:22:51 –0500 2009

    nick          pts/0   10.10.1.251 Sat May 30 11:31:51 –0500 2009

    steve                     Never logged in

    bin                       Never logged in

    sync                      Never logged in

    lp                        Never logged in

    ...

    ```


    Output of the lastlog command


    The `lastlog` command displays the most recent user login time and dates for every
    user on the system. Executing `lastlog` with no options displays the last login
    information for all users, as shown in the above example. This output is similar
    to the `last` command except `lastlog` only displays the most current login activity
    where `last` displays all available login events.


    The `-u` option can be used to display the last login for a specific user as demonstrated
    in the next example.


    ```

    $ lastlog -u nick


    Username      Port      From          Latest

    nick          pts/0   10.10.1.251 Sat May 30 11:31:51 –0500 2009

    ```


    Displaying the last login for a specific user


    **Common usage examples:**

    - `lastlog`: Display the last login information for all users

    - `lastlog -u [USER]`: Display the last login information for the specified user

