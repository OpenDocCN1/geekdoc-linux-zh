  - '[PAGE 128]


    # runlevel


    **Purpose**: Display the previous and current runlevel.


    **Usage syntax**: runlevel


    ```

    $ runlevel

    3 1

    ```


    Output of the runlevel command


    The **runlevel** command displays the current and previous runlevel. The runlevel
    is an initialization sequence called by the init process and defines procedures
    for system startup and shutdown. In the above example, **runlevel** is used to
    display the current runlevel information. The first number displayed is the previous
    runlevel and the second number is the current runlevel.


    > **Note** If there is no previous runlevel, the system will display **N** in
    the first field.


    **Common usage examples:**


    +   * **runlevel** Display the previous and current runlevel'
  - '[PAGE 129]


    # service


    Purpose: Manage services on a Linux system.


    Usage syntax: service [OPTIONS] [SERVICE] [ACTION]


    ```

    # service --status-all

    [ + ] acpid

    [ - ] anacron

    [ + ] apache2

    [ + ] atd

    [ + ] cups

    [ + ] dbus

    [ + ] gdm

    [ + ] hal

    [ + ] klogd

    [ + ] ssh

    [ + ] syslogd

    ...

    ```


    Displaying the status of services with the service command


    The service command manages services on Linux systems. In the above example, the
    --status-all option displays the status of all services on the system. The + symbol
    indicates a running service and the − symbol indicates a stopped service.


    The start, stop, restart, and status options can be used to control individual
    services as demonstrated in the next example.


    ```

    # service ssh stop

    * Stopping OpenBSD Secure Shell server sshd [ OK ]

    # service ssh start

    * Starting OpenBSD Secure Shell server sshd [ OK ]

    # service ssh restart

    * Restarting OpenBSD Secure Shell server sshd [ OK ]

    # service ssh status

    * sshd is running

    ```


    Stopping, starting, restarting, and viewing the status of services


    Common usage examples:


    +   * service [SERVICE] stop | Stop the specified service

    +   * service [SERVICE] start | Start the specified service

    +   * service [SERVICE] restart | Restart the specified service

    +   * service [SERVICE] status | Display the status of the specified service

    +   * service --status-all | Display the status of all services'
