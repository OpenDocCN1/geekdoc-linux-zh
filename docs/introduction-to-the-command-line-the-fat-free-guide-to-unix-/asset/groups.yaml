    \   active\naixmbd        tcpip           168024            active\nbiod     \
    \     nfs             196706            active\nrpc.statd     nfs            \
    \ 209038            active\nrpc.lockd     nfs             204984            active\n\
    qdaemon       spooler         217200            active\nwritesrv      spooler\
    \         233508            active\nctmro         racst           241870     \
    \       active\npcconsole     pcconsole       270470            active\ncimsys\
    \                    229504            active\nIBM.ServiceRM racst_rm        311470\
    \            active\nIBM.CSMAgentRM racst_rm       291004            active\n\
    lpd         spooler               inactive\n...\n```\n\n`lssrc` 命令用于显示 AIX 系统上服务的状态。上述示例展示了使用\
    \ `-a` 选项显示所有服务状态的方法。\n\n下一个示例展示了使用 `-s` 选项列出特定服务的方法。\n\n```\n# lssrc -s nfsd\n\
    Subsystem      Group            PID                Status\nnfsd        nfs   \
    \                 inactive\n```\n\n常见用法示例：\n\n- **lssrc -a**：显示所有服务的状态\n- **lssrc\
    \ -s [SERVICE]**：显示指定服务的状态\n- **lssrc -g [GROUP]**：显示指定服务组的组状态\n\n## stopsrc /\
    \ startsrc\n\n**用途**：在 AIX 系统上启动/停止服务。\n\n**使用语法**：`startsrc [OPTIONS] [SERVICE/GROUP]`\n\
    \n```bash\n# startsrc -s nfsd\n0513-059 The nfad Subsystem has been started. Subsystem\
    \ PID is 221400.\n```\n\n在 AIX 上使用 startsrc 启动服务\n\n**startsrc** 命令用于在 AIX 系统上启动服务（称为\
    \ SRC 或系统资源控制器）。上述示例展示了使用 **startsrc** 命令启动 NFS 服务的方法。\n\n**stopsrc** 命令用于在 AIX\
    \ 系统上停止服务。下一个示例展示了使用 **stopsrc** 停止 NFS 服务的方法。\n\n**使用语法**：`stopsrc [OPTIONS]\
    \ [SERVICE/GROUP]`\n\n```bash\n# stopsrc -s nfsd\n0513-044 The nfad Subsystem\
    \ was requested to stop.\n```\n\n在 AIX 上使用 stopsrc 停止服务\n\n**常见用法示例**：\n\n| 命令\
    \ | 描述 |\n| :--- | :--- |\n| `startsrc -s [SERVICE]` | 启动指定服务 |\n| `stopsrc -s\
    \ [SERVICE]` | 停止指定服务 |\n| `startsrc -g [GROUP]` | 启动指定服务组 |\n| `stopsrc -g [GROUP]`\
    \ | 停止指定服务组 |\n| `stopsrc -a` | 停止所有正在运行的服务 |\n\n## svcs\n\n用途：显示 Solaris 系统上服务的状态。\n\
    \n使用语法：`svcs [OPTIONS] [SERVICE]`\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_136_0.png)\n\
    \n`svcs` 命令用于显示 Solaris 系统上服务的状态。不带选项执行 `svcs` 将列出所有活动的服务，如上图示例所示。\n\n若要查看单个服务的状态，可以指定服务名称，如下一个示例所示。\n\
    \n![](img/8f33496304c637dbf51ff6ddc3c7ff29_136_1.png)\n\n### 常见用法示例：\n\n- `svcs`\n\
    \  - 显示所有活动服务\n- `svcs -a`\n  - 显示所有服务\n- `svcs [SERVICE]`\n  - 显示指定服务\n- `svcs\
    \ -d [SERVICE]`\n  - 显示指定服务的依赖项\n- `svcs -D [SERVICE]`\n  - 显示依赖于指定服务的服务\n- `svcs\
    \ -l [SERVICE]`\n  - 显示指定服务的详细信息\n\n## svcadm\n\n**用途：** 在 Solaris 系统上启动/停止服务。\n\
    \n**使用语法：** `svcadm [OPTIONS] [SERVICE]`\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_137_0.png)\n\
    \n`svcadm` 命令用于控制 Solaris 系统上的服务。它可以用于启动、停止和重启服务。在上面的示例中，使用 `enable` 参数来启动 sendmail\
    \ 服务。下一个示例展示了使用 `disable` 参数来停止 sendmail 服务的方法。\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_137_1.png)\n\
    \n要重启服务，如下一个示例所示，请使用 `restart` 参数。\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_137_2.png)\n\
    \n**常见用法示例：**\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `svcadm enable [SERVICE]` | 启动指定服务\
    \ |\n| `svcadm disable [SERVICE]` | 停止指定服务 |\n| `svcadm restart [SERVICE]` | 重启指定服务\
    \ |\n\n## 第 8 节：网络命令\n\n### 概述\n\n本节介绍了大多数平台上存在的基本网络实用工具和配置命令。它还概述了远程访问基于网络的服务（如\
    \ SSH、NFS 和 FTP）。\n\n**本节涵盖的命令：**\n\n| 命令 | 用途 |\n| :--- | :--- |\n| **hostname**\
    \ | 显示系统的主机名。 |\n| **ifconfig** | 显示网络接口。 |\n| **ifup** / **ifdown** | 启用/禁用网络接口。\
    \ |\n| **iwconfig** | 显示无线网络接口。 |\n| **ethtool** | 显示和编辑以太网卡设置。 |\n| **arp** |\
    \ 显示 ARP 缓存。 |\n| **ping** | 向网络主机发送 ICMP 回显请求。 |\n| **traceroute** | 显示 TCP/IP\
    \ 路由信息。 |\n| **tracepath** | 在 Linux 系统上显示 TCP/IP 路由信息。 |\n| **nslookup** | 在\
    \ Unix 系统上执行 DNS 查找。 |\n| **dig** | 在 BSD 和 Linux 系统上执行 DNS 查找。 |\n| **host**\
    \ | 简单的 DNS 查找工具。 |\n| **whois** | 在 whois 数据库中查找域名注册信息。 |\n| **netstat** | 显示网络连接和统计信息。\
    \ |\n| **route** | 显示和配置 TCP/IP 路由。 |\n| **ifstat** | 显示网络接口统计信息。 |\n| **tcpdump**\
    \ | 显示网络接口上的原始流量。 |\n| **dhclient** | Linux 和 BSD 系统的 DHCP 客户端。 |\n| **nmap**\
    \ | 扫描网络系统上的 TCP/IP 端口。 |\n| **telnet** | 用于通过 telnet 协议连接到远程服务器的客户端。 |\n| **ssh**\
