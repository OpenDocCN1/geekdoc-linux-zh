    \ |\n| `cd .` | 在目录树中向上导航一级 |\n\n## tree\n\n**用途**：以树状层次结构格式显示目录内容。\n\n**使用语法**：`tree\
    \ [选项] [目录]`\n\n```\n$ cd /\n$ tree -d -L 2\n.\n|-- bin\n|-- boot\n|   `-- grub\n\
    |-- cdrom -> media/cdrom\n|-- dev\n|   |-- block\n|   |-- bus\n|   |-- char\n\
    |   |-- disk\n|   |-- fd -> /proc/self/fd\n|   `-- input\n|..\n|-- etc\n|   |--\
    \ ConsoleKit\n|   |-- NetworkManager\n|   |-- PolicyKit\n|   |-- X11\n|   |--\
    \ acpi\n|   |-- alsa\n|   `-- alternatives\n|..\n```\n\n*目录结构的树状列表*\n\n**tree**\
    \ 命令以树状形式显示目录列表。这对于可视化目录结构的布局非常有用。在上述示例中，执行 **tree -d -L 2** 会以树状形式显示 2 个目录级别（相对于当前位置）。\n\
    \n**常见用法示例：**\n\n- `tree` ：以树状形式显示当前目录的内容\n- `tree [目录]` ：以树状形式显示指定目录的内容\n- `tree\
    \ -a` ：在树状列表中包含隐藏文件\n- `tree -d` ：仅列出目录\n- `tree -L [数字]` ：列出指定层级的深度\n\n"
