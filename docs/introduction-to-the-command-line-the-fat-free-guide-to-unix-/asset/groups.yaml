    \ 命令，请输入 `whereis poweroff`。\n\n> **警告**\n> *poweroff* 命令不提供宽限期，执行时会立即关闭系统。\n\n\
    **常见用法示例：**\n\n- `poweroff` | 关闭并断电系统\n\n## 重启（reboot）\n\n**用途：** 重启系统。\n\n**使用语法：**\
    \ `reboot`\n\n```bash\n# reboot\nBROADCAST MESSAGE FROM ROOT: The system is going\
    \ down for reboot now!\n* Stopping services                 [ OK ]\n* Terminating\
    \ processes             [ OK ]\n...\nThe system will now reboot.\n```\n\nreboot\
    \ 命令的示例输出\n\n`reboot` 命令用于优雅地重启系统。它基本上等同于 `shutdown -r now`。在命令行执行 `reboot` 会立即重启系统，如上例所示。\n\
    \n> **警告** `reboot` 命令不提供宽限期，执行时会立即重启系统。\n\n**常见用法示例：**\n\n- `reboot` | 优雅地重启系统\n\
    \n## 停止（halt）\n\n**用途：** 停止系统。\n\n**使用语法：** `halt`\n\n```bash\n# halt\nBROADCAST\
    \ MESSAGE FROM ROOT: The system is going down for halt now!\n* Stopping services\
    \ [ OK ]\n* Terminating processes [ OK ]\n...\nThe system will now halt.\n```\n\
    \n![](img/8f33496304c637dbf51ff6ddc3c7ff29_126_0.png)\n\n`halt` 命令将停止在线系统。Halt（停止）是一种特殊的关机类型，它会优雅地关闭操作系统，而不给系统断电。\n\
    \n> **注意**：*一些商业 Unix 系统在停止时会进入维护模式。这可以用于访问预启动配置/诊断环境。*\n\n**常见用法示例：**\n\n- `halt`\
    \ | 停止系统\n\n## telinit\n\n**用途：** 更改运行级别。\n\n**使用语法：** `telinit [运行级别]`\n\n```bash\n\
    # telinit 1\n*** Switching to run level 1 ***\n# runlevel\n3 1\n```\n\n使用 telinit\
