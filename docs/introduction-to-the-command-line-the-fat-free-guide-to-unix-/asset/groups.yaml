    # # cp


    **Purpose:** Copy files and directories.


    ```

    **Usage syntax:**

    ```

    cp [OPTIONS] [SOURCE] [DESTINATION]

    ```

    ```


    ```

    $ cp MyFile MyFile.copy

    $ ls -l

    -rw-r-r-- 1 nick nick 55 2009-05-20 15:32 MyFile

    -rw-r-r-- 1 nick nick 55 2009-05-20 15:32 MyFile.copy

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_44_0.png)


    The `cp` command copies files and directories. In the above example, `MyFile`
    is copied to create the `MyFile.copy` file.


    The next example demonstrates using `cp -r` to recursively copy the contents of
    a directory.


    ```

    $ ls -l

    drwxr-xr-x 2 root root 4096 Jul 1 14:06 MyDocuments

    $ cp -r MyDocuments/ MyDocuments2/

    $ ls -l

