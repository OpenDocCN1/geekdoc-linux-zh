    \n常见用法示例：\n\n- **swapinfo**: 在 BSD 和 HP-UX 系统上显示交换空间利用率\n\n## sync\n\n**用途**：刷新文件系统缓冲区。\n\
    \n**用法语法**：`sync`\n\n```\n# sync\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_190_0.png)\n\
    \n`sync` 命令刷新文件系统缓冲区。Unix、Linux 和 BSD 系统对磁盘活动进行批量处理以提高性能。当这种情况发生时，待处理的写入操作会在内存中缓存，并在适当的时间进行处理。`sync`\
    \ 命令强制刷新缓冲区，从而完成所有待处理的写入操作。\n\n虽然 `sync` 命令很少使用，但在系统必须以非正常方式重启的情况下（例如拔掉系统电源或按下重置按钮），它可能很有用。在这种方式下关闭系统电源之前执行\
    \ `sync` 可以通过确保所有磁盘缓冲区完全刷新来帮助防止文件系统损坏。\n\n> **提示**\n> 执行两次 `sync` 命令是确保所有文件系统缓冲区都已刷新的常见做法。可以通过在命令行执行\
    \ `sync; sync` 用一条命令完成。\n\n常见用法示例：\n\n- `sync`: 刷新文件系统缓冲区\n- `sync ; sync`: 彻底刷新文件系统缓冲区\n\
    \n## 第 11 节：备份和恢复命令\n\n### 概述\n\n本节涵盖用于备份和恢复文件的实用工具。创建良好的备份对于从系统故障或自然灾害中恢复非常重要。大多数系统都包含许多内置的备份程序。这些程序可以创建完全备份、部分备份和增量备份，并且应纳入您的灾难恢复计划中。\n\
    \n**本节涵盖的命令：**\n\n| 命令 | 用途 |\n| --- | --- |\n| **tar** | 创建/提取归档文件。 |\n| **dump**\
    \ | 创建增量备份。 |\n| **restore** | 从 dump 归档中恢复文件。 |\n| **dd** | 创建数据设备的原始副本。 |\n\
    | **cpio** | 创建/提取 cpio 归档。 |\n| **mt** | 控制磁带设备。 |\n| **mksysb** | 创建 AIX 系统的备份映像。\
    \ |\n\n**本节使用的术语表：**\n\n| 术语 | 定义 |\n| --- | --- |\n| **完全备份** | 包括本地系统上所有文件的备份。\
    \ |\n| **增量备份** | 仅包括自上次完全备份以来已更改的文件的备份。 |\n\n## tar\n\n**用途**：创建/提取归档文件。\n\n\
    **用法语法**：`tar [OPTIONS] [OUTPUT] [INPUT]`\n\n```\n# tar -cvf backup.tar /etc/*\n\
    /etc/acpi/\n/etc/acpi/stopbtn.sh\n/etc/acpi/videobtn.sh\n/etc/acpi/ibm-wireless.sh\n\
    /etc/acpi/hibernate.sh\n/etc/acpi/resume.d/\n /etc/acpi/resume.d/15-video-post.sh\n\
    \ /etc/acpi/resume.d/62-ifup.sh\n /etc/acpi/resume.d/10-thinkpad-standby-led.sh\n\
    ...\n```\n\n使用 `tar` 命令创建 `/etc` 目录的备份归档\n\n`tar` 命令创建和提取 tar 归档。它是 Unix、Linux\
    \ 和 BSD 系统上最常用的备份创建实用工具。在上面的示例中，使用 `-cvf` 选项创建名为 `backup.tar` 的 `/etc` 目录备份归档。\n\
    \n在下一个示例中，使用 `-xvf` 选项从第一个示例创建的归档中提取 `/etc/hosts` 文件。\n\n```\n# tar -xvf backup.tar\
    \ etc/hosts\netc/hosts\n```\n\n从 tar 归档中提取文件\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_192_0.png)\n\
    \n> **tar** 命令的默认操作会去掉文件路径开头的 `/`。这意味着从 **tar** 归档中恢复的文件将放置在相对于当前目录的位置。可以指定 **-p**\
    \ 选项来覆盖此行为。\n\n常见用法示例：\n\n- `tar -cvf [FILE] [ITEM]`: 备份指定项\n- `tar -czvf [FILE]\
    \ [ITEM]`: 压缩归档以节省空间\n- `tar -xvf [FILE] [ITEM]`: 恢复指定项\n- `tar -tf [FILE]`: 列出指定归档中的所有文件\n\
    \n## dump\n\n**用途**：创建增量备份。\n\n**用法语法**：`dump [OPTIONS] [OUTPUT] [INPUT]`\n\n\
    ```\n# dump -0 -uf backup.dump /\n```\n\n使用 dump 命令创建完全备份\n\n`dump` 是一种创建增量备份的归档实用工具。在上面的示例中，`-0`\
    \ 选项表示将 `/` 文件系统的完全备份到名为 `backup.dump` 的文件中。\n\n后续的增量备份指定为 `-1`、`-2`、`-3` 等。后续备份将仅归档自上次完全备份以来已更改的文件。这可以在创建备份时节省时间和存储空间，但由于必须分层恢复增量备份，因此恢复过程将花费更长时间。\n\
    \n> **注意**\n> 关于已备份文件的信息存储在一个名为 `dumpdates` 的文件中。\n> 在 Unix 系统上，此文件通常位于 `/etc/dumpdates`。\n\
    > Linux 系统将此信息存储在 `/var/lib/dumpdates` 中。\n\n常见用法示例：\n\n| 命令 | 描述 |\n|---|---|\n\
    | `dump -0 -uf [OUTPUT] [INPUT]` | 创建完全备份 |\n| `dump -[NUM] -uf [OUTPUT] [INPUT]`\
    \ | 创建增量备份 |\n\n"
