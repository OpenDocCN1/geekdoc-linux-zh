    # Overview


    This section covers usage of basic file system management commands. It also covers
    popular partition editors for Unix, Linux, and BSD systems such as **fdisk** and
    **parted**. These commands can be used to create, modify, and delete file systems.


    > **Warning**

    > The following commands can cause irreparable damage to your system if used incorrectly.
    Always experiment with new commands in a testing environment.


    **Commands covered in this section:**


    | Command | Purpose |

    | :--- | :--- |

    | **fdisk** | Display and edit hard disk partitions. |

    | **parted** | Display and edit partitions on Linux systems. |

    | **mkfs** | Create file systems. |

    | **fsck** | Check and repair file systems. |

    | **badblocks** | Check a disk drive for bad blocks. |

    | **tune2fs** | Adjust Linux file system parameters. |

    | **mount** **umount** | Mount/unmount local and remote file systems. |

    | **mkswap** | Create swap space storage. |

    | **swapon** **swapoff** | Activate/deactivate swap space. |

    | **swaponfo** | Display swap space information. |

    | **sync** | Flush file system buffers. |'
