    \ contain a note about their status and is displayed whenever they are queried\
    \ with the finger command. If this file does not exist, the finger command will\
    \ display \"No Plan\" for the user.*\n\n**Common usage examples:**\n\n- `finger\
    \ [USER]`: Display information about the specified user\n\n## passwd\n\n**Purpose:**\
    \ Change passwords.\n\n**Usage syntax:** `passwd [OPTIONS] [USER]`\n\n```bash\n\
    $ passwd\nEnter new UNIX password: ******\nRetype new UNIX password: ******\n\
    passwd: password updated successfully\n```\n*Changing the current user's password*\n\
    \nThe **`passwd`** command changes a user’s password. Executing **`passwd`** with\
    \ no arguments changes the password for the current user as shown in the above\
    \ example.\n\nThe root user can change other user’s passwords by specifying a\
    \ username as demonstrated in the next example.\n\n```bash\n# passwd nick\nEnter\
    \ new UNIX password: ******\nRetype new UNIX password: ******\npasswd: password\
    \ updated successfully\n```\n*Changing a specific user's password*\n\n**Common\
    \ usage examples:**\n\n| Command | Description |\n| :--- | :--- |\n| `passwd`\
    \ | Set the password for the current user |\n| `passwd [USER]` | Set the password\
    \ for the specified user |\n| `passwd -e [USER]` | Force a user to change their\
    \ password at the next login |\n| `passwd -l [USER]` | Lock the specified user\
    \ account |\n| `passwd -u [USER]` | Unlock the specified user account |\n| `passwd\
    \ -S [USER]` | Display the status of the specified user account |\n\n## useradd\
    \ / userdel\n\n**Purpose:** Create/delete user accounts.\n\n**Usage syntax:**\
    \ `useradd [OPTIONS] [USER]`\n\n```bash\n# useradd -m steve\n# passwd steve\n\
    Enter new UNIX password: ******\nRetype new UNIX password: ******\npasswd: password\
    \ updated successfully\n```\n*Adding a user account to the system (and setting\
    \ their password)*\n\nThe **useradd** command creates new user accounts. In the\
    \ above example, executing `useradd -m steve` creates a basic login account for\
    \ a user. The `-m` option is used to automatically create a home directory for\
    \ the specified user (recommended). The password is then set for the new user\
    \ using the previously discussed **passwd** command.\n\n> **Note**\n> You must\
    \ set the password for the new user using the **passwd** command before they can\
    \ login.\n\nThe **userdel** command deletes user accounts from the system. The\
    \ next example demonstrates using **userdel** to remove an account. The optional\
    \ `-r` option is used to have the system automatically delete the specified user's\
    \ home directory after removing their account.\n\n**Usage syntax:** `userdel [OPTIONS]\
    \ [USER]`\n\n```bash\n# userdel -r steve\n```\n*Removing a user account*\n\n>\
    \ **Note**\n> The `userdel` command may be used on some Unix and BSD systems.\
    \ The `ruser` command may be used on some older systems in place of `userdel`.\n\
    \n**Common usage examples:**\n\n| Command | Description |\n| :--- | :--- |\n|\
    \ `useradd [USER]` | Create the specified user account |\n| `useradd -m [USER]`\
    \ | Automatically create a home directory for the user |\n| `userdel [USER]` |\
    \ Delete the specified user account |\n| `userdel -r [USER]` | Delete a user's\
    \ account and their home directory |\n\n## adduser / deluser\n\n**Purpose:** Create/delete\
    \ user accounts on Linux systems.\n\n**Usage syntax:** `adduser [OPTIONS] [USER]`\n\
    \n```bash\n# adduser mike\nAdding user 'mike' ...\nAdding new group 'mike' (1002)\
    \ ...\nAdding new user 'mike' (1002) with group 'mike' ...\nCreating home directory\
    \ '/home/mike' ...\nCopying files from '/etc/skel' ...\nEnter new UNIX password:\
    \ ******\nRetype new UNIX password: ******\npasswd: password updated successfully\n\
    Changing the user information for mike\nEnter the new value, or press ENTER for\
    \ the default\n    Full Name [:]:\tMike Smith\n    Room Number [:]:\tComputer\
    \ Room\n    Work Phone [:]:\t555-1212\n    Home Phone [:]:\nIs the information\
    \ correct? [y/N] y\n```\n*Creating a user with the adduser command*\n\nThe **adduser**\
    \ command is a user-friendly frontend for the previously discussed **useradd**\
    \ command. It simplifies the creation of user accounts on Linux systems by prompting\
    \ for necessary information when creating accounts (rather than having to specify\
    \ a number of command line options). The above example demonstrates the typical\
    \ usage of the **adduser** command.\n\nThe **deluser** command deletes user accounts\
    \ as shown in the next example.\n\n**Usage syntax:** `deluser [OPTIONS] [USER]`\n\
    \n```bash\n# deluser mike\nRemoving user 'mike' ...\nWarning: Removing group 'mike',\
    \ since no other user is part of it.\nDone.\n```\n*Removing a user with the deluser\
    \ command*\n\n> **Note**: Default settings for the adduser and deluser commands\
    \ are stored in `/etc/adduser.conf` and `/etc/deluser.conf`.\n\n**Common usage\
    \ examples:**\n\n- `adduser [USER]` Create a user account\n- `deluser [USER]`\
    \ Remove a user account\n\n## groupadd / groupdel\n\n**Purpose:** Add/remove a\
    \ group.\n\n**Usage syntax:** `groupadd [GROUP]`\n\n```bash\n# groupadd accounting\n\
    ```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_101_0.png)\n\nThe `groupadd` command\
    \ creates new group accounts. Groups are helpful in managing access to files and\
    \ directories in a multiuser environment. In the above example a new group called\
    \ *accounting* is created. The resulting group entry in the `/etc/group` file\
    \ is displayed below.\n\n```bash\n# grep accounting /etc/group\naccounting:x:1002:\n\
    ```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_101_1.png)\n\nThe `groupdel` command\
    \ deletes groups from the system. The next example demonstrates using the `groupdel`\
    \ command to remove the previously created accounting group from the system.\n\
    \n**Usage syntax:** `groupdel [GROUP]`\n\n```bash\n# groupdel accounting\n```\n\
    \n![](img/8f33496304c637dbf51ff6ddc3c7ff29_101_2.png)\n\n**Common usage examples:**\n\
    \n- `groupadd [GROUP]` Create a new group\n- `groupdel [GROUP]` Delete a group\n\
    \n## usermod / groupmod\n\n**Purpose:** Modify user and group account settings.\n\
    \n**Usage syntax:** `usermod [OPTIONS] [USER]`\n\n```bash\n# usermod -aG sales\
    \ nick\n```\n*Changing a user's group membership using the usermod command*\n\n\
    The **usermod** command modifies user account settings. In the above example,\
    \ the `-aG` option is used to add the user *nick* to the *sales* group. You can\
    \ also use the **usermod** command to change a user’s home directory location\
    \ using the `-d` option or default shell using `-s`.\n\nThe **groupmod** command\
    \ modifies groups. Its primary purpose is to rename a group. In the next example\
    \ the *accounting* group is renamed to *finance* using **groupmod** `-n`.\n\n\
    **Usage syntax:** `groupmod [OPTIONS] [GROUP]`\n\n```bash\n# groupmod -n finance\
    \ accounting\n# grep finance /etc/group\nfinance:x:1002:\n```\n*Renaming a group\
    \ using the groupmod command*\n\n**Common usage examples:**\n\n- `usermod -s [SHELL]\
    \ [USER]` Change a user’s default shell\n- `usermod -d [DIR] [USER]` Change a\
    \ user’s home directory location\n- `usermod -aG [GROUP] [USER]` Add a user to\
    \ the specified group\n- `groupmod [OLD] -n [NEW]` Rename the specified group\n\
    \n## wall\n\n**Purpose:** Broadcast a message to all users on the system.\n\n\
    **Usage syntax:** `wall [FILE]`\n\n```bash\n# wall\nAnyone want some tacos?\n\n\
    <CTRL + D>\n```\n*Using the wall command to send a message to all users logged\
    \ into the system*\n\nThe **wall** command sends a message to all users currently\
    \ logged into the system. The text entered in the above example will display on\
    \ all local terminals and remote sessions currently logged into the system.\n\n\
    > **Note**\n> Pressing CTRL+ D ends the message editor and sends the message.\n\
    \nThe next example displays a sample of the wall message output as seen by other\
    \ users on the system.\n\n```text\n$\n\nBroadcast Message from root@e6400 (/dev/pts/0)\
    \ at 11:56 ...\n\nAnyone want some tacos?\n```\n*Output of the wall message displayed\
    \ on all terminals*\n\nIn place of manually entering a message, a text file with\
    \ a prewritten message can be used with the wall command, as shown in the next\
    \ example.\n\n```bash\n# wall /home/nick/message.txt\n```\n*Using a text file\
    \ to send a message with the wall command*\n\n**Common usage examples:**\n\n-\
    \ `wall`: Send a message to all users\n- `wall [FILE]`: Send the message in the\
    \ specified file to all users\n"
