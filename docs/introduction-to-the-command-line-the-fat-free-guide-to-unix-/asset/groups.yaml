    \ 和 OpenSolaris 是太阳微系统公司（Sun Microsystems）的注册商标。\n- SUSE* 是 Novell 公司的商标。\n- Ubuntu®\
    \ 是 Canonical Ltd. 的注册商标。\n- UNIX® 是开放团体（The Open Group）的注册商标。\n- UnixWare® 和\
    \ OpenServer® 是 SCO 集团（The SCO Group）的注册商标。\n\n本书中使用的其他所有商标均归其各自的所有者所有。在本书中使用任何商标并不构成与商标持有人的关联或认可。\n\
