    \n## 本部分使用的术语表：\n\n- **Init**：(INITialization) 一个控制 Unix、Linux 和 BSD 系统启动（又称初始化）的程序。\n\
    \n- **Runlevel（运行级别）**：init 程序使用的一组配置文件，用于定义系统在启动时（或通过 telinit 命令调用时）要加载的程序和服务。\n\
    \n- **Service（服务）**：提供服务的系统程序，如 Web 服务器、DNS 服务器、邮件服务器等。服务有时被称为守护进程（Daemons）或服务守护进程（Service\
    \ Daemons）。\n\n## 关机（shutdown）\n\n**用途：** 关闭系统。\n\n**使用语法：** `shutdown [选项] [时间]\
    \ [消息]`\n\n```bash\n# shutdown now\nBROADCAST MESSAGE FROM ROOT:\nThe system is\
    \ going down for shutdown now!\n * Stopping services                         [\
    \  OK  ]\n * Terminating processes                      [  OK  ]\n....\nThe system\
    \ will  now halt.\n```\n\nshutdown 命令的示例输出\n\n`shutdown` 命令用于关闭本地系统。可以执行几种不同类型的关机：halt（停止）、poweroff（断电）和\
