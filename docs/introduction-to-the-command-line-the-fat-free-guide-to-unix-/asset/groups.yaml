    \n`pstree` 命令会为当前在系统上运行的所有进程绘制进程树，如上述示例所示。`pstree` 的输出使查看父进程和子进程之间的关系变得容易。\n\n\
    **常见用法示例：**\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `pstree` | 显示基本的进程树列表 |\n| `pstree\
