    ## The Shell


    The command line interpreter, also known as the shell, is a program that accepts
    input from a user (typically a command of some sort) and performs the requested
    task. Once that task has completed, the program will terminate and return the
    user to the shell.


    The shell''s prompt identifies the type of shell being used. There are two basic
    types of shell prompts:


    - `$` Normal user shell (may also be `%` or `>` on some systems)

    - `#` Root user shell


    Below is the output of the **whoami** command (discussed on page 94) which highlights
    the difference between normal user and root shell prompts on the command line.


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_15_0.png)


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_15_1.png)


    Normal users typically have a limited amount of access to the system while the
    root user has unrestricted access. Section 5 covers this topic in more detail.


    > **Warning**: The root user can do anything on Unix, Linux, and BSD systems.
    It is important to know when you are working as root to prevent accidental damage
    to your system.


    Many systems add customized information to the shell prompt. This information
    can be a handy indicator of things like the current user''s login name, system
    host name, and the current directory as shown in the next example.


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_15_2.png)


    The table below describes the information displayed in the customized shell prompt
    displayed in the previous example.


    | **nick** | **@** | **mylaptop** | **:** | **/var/log** | **$** |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | User Name | Spacer | Computer Name | Spacer | Current Directory | Shell Prompt
    |


    ### Types of Shells


    There are several different types of shells for Unix, Linux, and BSD systems.
    Each shell has its own set of features and usage syntax. The next table describes
    the most popular shells that are currently available.


    | Shell | Prompt | Name | Notes |

    | :--- | :--- | :--- | :--- |

    | sh | $ | Bourne Shell | Default on some Unix systems |

    | bash | $ | Bourne Again Shell | Enhanced replacement for the Bourne shell |

    | csh | % | C Shell | Default on many BSD systems |

    | tcsh | > | T C Shell | Enhanced replacement for the C shell |

    | ksh | $ | Korn shell | Default on AIX systems |


    The **bash** shell is the most popular shell in use today. It is the default shell
    on all Linux systems and is also available for most Unix and BSD systems. Other
    shells like **csh**, **tcsh**, and **ksh** are typically used by default on non-Linux
    systems.


    ### Accessing the Shell


    When you first boot your system you are presented with a login prompt similar
    to the example pictured below.


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_16_0.png)


    After you enter your username and password the system will authenticate your login
    credentials via the `/etc/passwd` file. If the login information is correct, the
    system will start your shell (which is also specified in `/etc/passwd`). The `$`
    shell prompt indicates you are logged in and "ready to go."


    *Welcome to the world of the command line... Let''s get started!*


    ## Section 2: Command Line Basics


    ### Overview


    This section covers the most essential commands every user should know. These
    basic commands cover topics like getting help, navigating directories, and listing
    files. Before you begin, there are three important rules you need to know about
    the command line:


    - 1. Unix, Linux, and BSD systems are case (and space) sensitive. This means that
    a file named `MyFile` is not same as `myfile` as it would be on a DOS or Windows
    system.

    - 2. There is no "recycle bin" or "trash can" when working in the command line
    environment. When files are deleted on the command line, they instantly disappear
    forever.

    - 3. You should always practice new commands on a testing system that is not used
    in a production environment. This minimizes the chances of an accident that can
    take down an important system.


    Knowing this, we can now begin working with basic Unix, Linux and BSD commands.


    > **Note**

    >

    > *Examples listed in this book were created on various Unix, Linux, and BSD systems.
    Many of the commands, options, and features are the same on other platforms; however,
    there may be slight differences. You should always consult the manual for your
    specific platform to ensure compatibility with the examples provided. See page
    20 for more information on how to access the online manual.*


    Commands covered in this section:


    | Command | Purpose |

    | --- | --- |

    | man | Online manual for command line programs. |

    | whatis | Display a description of the specified command. |

    | ls | List the contents of a directory. |

    | pwd | Display the current/working directory. |

    | cd | Change (navigate) directories. |

    | tree | Display the contents of a directory in a tree hierarchy format. |

    | find | Search for files and directories. |

    | locate | Search the locate database for files and directories. |

    | whereis | Display the location of binary files, manual pages, and source code
    for the specified command. |

    | file | Display the file type of the specified file. |

    | stat | Display extended information about a file system, file, or directory.
    |

    | date | Display or set the system clock. |

    | cal | Display a calendar on the command line. |

    | history | Display commands that have recently been executed. |

    | clear | Clear the contents of the current screen. |

    | logout | Logout of the system. |

    | exit | Exit the current shell. |


    Glossary of terms used in this section:


    - **Argument**: One or more variable input items used by a command line program.

    - **Binary**: A compiled program or data file.

    - **Flag**: Synonym for *Option*.

    - **Man Page**: Online manual for shell commands.

    - **Option**: A modifier that alters the default operation of a command.

    - **Parameter**: Synonym for *Argument*.

    - **Recursively**: Includes all subdirectories when executing a command.

    - **Shell Script**: A grouping of commands in a plain text executable file.

    - **Source Code**: Uncompiled code for a program.

    - **Switch**: Synonym for *Option*.

    - **Working Directory**: Your current location within the directory tree.

