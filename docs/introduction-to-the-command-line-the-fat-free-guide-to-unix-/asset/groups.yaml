    +   **Libary**

    +   A collection of subroutines used by applications.


    +   **Load Average**

    +   The average of system load over a period of time.


    +   **System Call**

    +   The process of a program requesting access to system resources such as kernel
    facilities or system hardware.


    +   **Trace**

    +   The process of monitoring internal functions of a program such as system calls
    and library calls.


    +   **Virtual Memory**

    +   A logical combination of physical memory and swap storage.'
