    # # du


    **Purpose:** Display disk usage.


    **Usage syntax:** du [OPTIONS] [DIRECTORY/FILE]


    ```

    $ du -hs /usr

    523M /usr

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_212_0.png)


    The du command displays information about disk usage. It can display the size
    of a specific directory or group of files. The above example demonstrates using
    the du command to display the size of the /usr directory. The -hs option instructs
    du to show summarized results in "human readable" form. Omitting the -s option
    will recursively display the size of each file under /usr, as demonstrated below.


    ```

    $ du -h /usr/

    4.0K /usr/local/etc

    1.4M /usr/local/bin

    4.0K /usr/local/games

    4.0R /usr/local/src

    4.0K /usr/local/sbin

    224K /usr/local/share/man/manl

    228K /usr/local/share/man

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_212_1.png)


    Some systems may not support the -h parameter. In this case, the du command will
    display file sizes in blocks rather than a "human readable" unit of measure, as
    shown in the next example.


    ```

    $ du -s /usr

    534884 /usr

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_212_2.png)


    **Common usage examples:**

    | du -hs | Display the size of the current directory |

    | du -hs [DIRECTORY] | Display the size of the specified directory |

    | du -h [DIRECTORY] | Display the size of each file in the specified directory
    |'
