    \ 进程调用的初始化序列，定义了系统启动和关闭的过程。在上面的示例中，**runlevel** 用于显示当前的运行级别信息。显示的第一个数字是前一个运行级别，第二个数字是当前运行级别。\n\
    \n> **注意** 如果没有前一个运行级别，系统将在第一个字段显示 **N**。\n\n**常用示例：**\n\n- **runlevel** 显示前一个和当前的运行级别\n\
    \n## 服务（service）\n\n用途：管理 Linux 系统上的服务。\n\n语法：service [选项] [服务] [操作]\n\n```\n\
