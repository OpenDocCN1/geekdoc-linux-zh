    Usage syntax: sysv-rc-conf [OPTIONS] [SERVICE] [ON|OFF]


    ```

    # sysv-rc-conf

    SysV Runlevel Config  --: stop service  *=/: start service  h: help  q: quit

    service          1       2       3       4       5       0       6       S


    acpid            [ ]     [X]     [X]     [X]     [X]     [ ]     [ ]     [ ]

    anacron          [ ]     [X]     [X]     [X]     [X]     [ ]     [ ]     [ ]

