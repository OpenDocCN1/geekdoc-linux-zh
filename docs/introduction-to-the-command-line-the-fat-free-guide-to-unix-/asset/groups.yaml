    # # ulimit


    Purpose: Display/set system resource limits.


    Usage syntax: ulimit [OPTIONS] [LIMIT]


    ```

    $ ulimit -a

    core file size          (blocks, -c) 0

    data seg size           (kbytes, -d) unlimited

    scheduling priority           (-r) 20

    file size               (blocks, -f) unlimited

    pending signals             (-i) 16384

    max locked memory       (kbytes, -l) 64

    max memory size         (kbytes, -m) unlimited

    open files                  (-n) 1024

    pipe size            (512 bytes, -p) 8

    POSIX message queues     (bytes, -q) 819200

    real-time priority            (-r) 0

    stack size              (kbytes, -s) 8192

    cpu time                (seconds, -t) unlimited

    max user processes          (-u) unlimited

    virtual memory          (kbytes, -v) unlimited

    file locks                (-x) unlimited

    ```


    Displaying defined resource limits using the ulimit command


    The ulimit command displays and sets system resource limits. These limits control
    the maximum amount of system resources available to programs. It can be used to
    control the maximum amount of memory, CPU time, and file sizes available to each
    program launched by a user.


    > Tip: Ulimit configuration is typically stored in /etc/limits.conf or /etc/security/limits.conf
    on most systems.


    Common usage examples:


    +   - ulimit -a Display all defined resource limits

    +   - ulimit [OPTION] [LIMIT] Set ulimit values'
