    | ARP | (Address Resolution Protocol) Protocol for resolving MAC addresses. |

    | DHCP | (Dynamic Host Configuration Protocol) Protocol for automatically assigning
    IP addresses. |

    | DNS | (Domain Name System) System that resolves host names to IP addresses.
    |

    | FTP | (File Transfer Protocol) Protocol used to transfer files to and from remote
    systems. |

    | Hostname | The name assigned to a computer system. |

    | ICMP | (Internet Control Message Protocol) Protocol used to relay error messages
    to network systems. |

    | Loopback | A virtual network interface found on Unix, Linux, and BSD systems
    used to communicate with network services on the local machine. |

    | MAC Address | (Media Access Control Address) A unique identifier assigned to
    network interfaces. |

    | NFS | (Network File System) Protocol used to share storage via a network on
    Unix, Linux, and BSD systems. |

    | Packet | A unit of data transmitted between network systems. |

    | Route | The path a packet travels across a network to the destination. |

    | Serial | A legacy form of communication used to link devices together. |

    | Telnet | A legacy protocol for connecting to remote systems. |

    | SSH | (Secure Shell) A secure protocol for connecting to remote systems. |'
