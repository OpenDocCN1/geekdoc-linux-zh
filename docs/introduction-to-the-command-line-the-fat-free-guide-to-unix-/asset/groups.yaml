    # 第 4 章：文本编辑与提取


    ### 概述


    提取和编辑文本是在命令行上工作的重要组成部分。文本编辑器和实用程序通常用于管理目的，例如更改配置文件中的设置或查看系统日志文件。本章提供了在 Unix、Linux
    和 BSD 系统上使用文本编辑和提取程序的基本概述。


