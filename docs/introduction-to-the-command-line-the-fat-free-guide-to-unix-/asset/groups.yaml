    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_73_0.png)


    **tail** 命令显示指定文件的最后几行（即 *tail*）。在上面的示例中，使用 **-n 2** 选项仅显示指定文件的最后两行。如果执行 **tail**
    命令时不带任何选项，默认将显示文件的最后 10 行。


    **tail** 命令的另一个实用功能是 **-f** 选项，用于在文件增长时“跟踪”文件。这会指示 **tail** 命令打开指定文件，并在新行写入时显示它们。下一个示例展示了使用
    **tail -f** 命令实时监控 `/var/log/syslog` 文件中新日志条目的方法。


