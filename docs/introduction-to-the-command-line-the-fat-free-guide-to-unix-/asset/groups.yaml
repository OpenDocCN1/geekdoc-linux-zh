    \ created with the `dump` command. The above example demonstrates starting the\
    \ interactive `restore` shell to extract files from a `dump` archive.\n\nThe following\
    \ table describes the basic `restore` shell commands.\n\n| Command | Function\
    \ |\n| :--- | :--- |\n| `ls [PATH]` | List the contents of the current or specified\
    \ directory |\n| `cd [PATH]` | Navigate the dump archive |\n| `pwd` | Display\
    \ the current working directory |\n| `add [PATH]` | Add the current directory\
    \ (or specified item) to the restore list |\n| `delete [PATH]` | Delete the current\
    \ directory (or specified item) from the restore list |\n| `extract` | Extract\
    \ all files on the restore list |\n| `help` | Display the help menu |\n| `quit`\
    \ | Exit the restore shell |\n\nRestore shell commands\n\nCommon usage examples:\n\
    - `restore -if [FILE]`: Open the specified archive in the restore shell\n- `restore\
    \ -rf [FILE]`: Restore an entire file system from a dump archive\n- `restore -tf\
    \ [FILE]`: List all items in the specified dump archive\n\n## dd\n\n**Purpose:**\
    \ Create raw copies of data devices.\n\n**Usage syntax:** `dd if=[SOURCE] of=[TARGET]\
    \ [OPTIONS]`\n\n```bash\n# dd if=/dev/sdb of=/dev/sdc\nCreating a copy of a disk\
    \ using the dd command\n```\n\nThe `dd` command performs raw (bit for bit) copies\
    \ of data devices. The `if` parameter specifies the input file or device to be\
    \ read. The `of` parameter specifies the output location. In the above example,\
    \ the entire hard drive `/dev/sdb` is copied to `/dev/sdc`.\n\n`dd` can also be\
    \ used to create image files of a disk. The next example demonstrates using `dd`\
    \ to create an ISO image file from a CD-ROM.\n\n```bash\n# dd if=/dev/cdrom of=/tmp/image.iso\n\
    Converting a CD-ROM into an ISO file using the dd command\n```\n\n> **Warning**\n\
    > The `dd` command is often referred to as the \"data destroyer\" because it can\
    \ be very destructive if used incorrectly. Always use caution when experimenting\
    \ with `dd`.\n\n**Common usage examples:**\n- `dd if=[SOURCE] of=[TARGET]` Create\
    \ a raw copy of the specified device\n\n## cpio\n\n**Purpose:** Create or extract\
    \ cpio archives.\n\n**Usage syntax:** `[INPUT] | cpio [OPTIONS] > [OUTPUT]`\n\n\
    ```bash\n# cd /etc\n# ls | cpio -ov > /tmp/backup.cpio\nadduser.conf\nadjtime\n\
    aliases\nalternatives\n...\nCreating a backup with the cpio command\n```\n\nThe\
    \ `cpio` utility creates simple backups. In the above example, the `-ov` option\
    \ creates a `cpio` backup of the `/etc` directory.\n\nThe next example demonstrates\
    \ restoring files from the `backup.cpio` archive using the `-idv` option.\n\n\
    ```bash\n# cd /etc\n# cpio -idv < /tmp/backup.cpio\nadduser.conf\nadjtime\naliases\n\
    alternatives\n...\nExtracting files from a cpio archive\n```\n\n> **Note**\n>\
    \ - `cpio` is a legacy program that is rarely used for backup on modern systems.\n\
    > - Use `tar` and `dump` in place of `cpio` as they offer a more complete and\
    \ user-friendly backup solution.\n\nCommon usage examples:\n\n| Command | Description\
    \ |\n| :--- | :--- |\n| `ls | cpio -ov > backup.cpio` | Backup the specified item(s)\
    \ |\n| `cpio -idv < backup.cpio` | Restore the specified item(s) |\n| `cpio --list\
    \ < backup.cpio` | List all items in the specified archive |\n\n## mt\n\nPurpose:\
    \ Control tape devices.\n\nUsage syntax: `mt -f [DEVICE] [OPERATION]`\n\n```bash\n\
    # mt -f /dev/rmt0 rewind\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_197_0.png)\n\
    \nThe **mt** command controls removable tape devices. It can be used to display\
    \ the status of the drive and manage its removable media. The example above demonstrates\
    \ using the **mt** command to rewind the tape in the `/dev/rmt0` drive.\n\nThe\
    \ following table lists the most common operations used with the **mt** utility.\n\
    \n| Operation | Function |\n| :---: | :--- |\n| rewind | Rewind the tape device\
    \ |\n| retension | Retension the tape |\n| erase | Erase the tape |\n| status\
    \ | Display the tape device status |\n| offline | Rewind and eject the tape |\n\
    \n![](img/8f33496304c637dbf51ff6ddc3c7ff29_197_1.png)\n\nCommon usage examples:\n\
    \n```bash\nmt -f [DEVICE] [OPERATION]\n```\n\nExecute the specified operation\
    \ on a tape drive\n\n## mksysb\n\n**Purpose:** Create a backup image of an AIX\
    \ system.\n\n**Usage syntax:** `mksysb [OPTIONS] [DEVICE/FILE]`\n\n```bash\n#\
    \ mksysb -i /dev/rmt0\nCreating information file (/image.data) for rootvg.\n\n\
    Creating list of files to back up.\n\nBacking up 64981 files..................................\
    \ \n51767 of 64981 files (79%).. \n\n64981 of 64981 files (100%)\n0512-038 mksysb:\
    \ Backup Completed Successfully.\n      Creating a mksysb backup on AIX\n```\n\
    \nThe **mksysb** command creates a backup image of an AIX system. This image can\
    \ be used to restore the base operating system in the event of system failure.\n\
    \nIn the above example a **mksysb** system image is written to the `/dev/rmt0`\
    \ tape device.\n\n> Note **mksysb** is not a substitute for a traditional backup\
    \ as it does not include files outside of the base operating system. Databases,\
    \ 3rd party software, etc. are not backed up in a **mksysb** image. These files\
    \ should be backed up separately using another method (such as the **tar** command.)\n\
    \n**Common usage examples:**\n`mksysb -i [DEVICE/FILE]` | Create a system image\
    \ backup\n\n## Section 12: Monitoring and Troubleshooting\n\n### Overview\n\n\
    This section covers commands used to monitor and troubleshoot Unix, Linux, and\
    \ BSD systems. These commands can be used to diagnose problems or resolve performance\
    \ problems.\n\n**Commands covered in this section:**\n\n| Command | Purpose |\n\
    | :--- | :--- |\n| top | Monitor system performance and running processes. |\n\
    | htop | Advanced system monitor for Linux. |\n| topas | Performance monitor for\
    \ AIX systems. |\n| iotop | Monitor disk input and output operations. |\n| mpstat\
    \ | Display processor utilization information. |\n| vmstat | Display virtual memory\
    \ usage information. |\n| iostat | Display I/O utilization statistics. |\n| dstat\
    \ | Monitor CPU, disk, network, and swap utilization. |\n| nfsstat | Display NFS\
    \ statistics. |\n| free | Display system memory and swap space usage information.\
    \ |\n| df | Display file system usage information. |\n| du | Display disk usage.\
    \ |\n| uname | Display information about the operating system. |\n| uptime | Display\
    \ how long the system has been online. |\n| dmesg | Display kernel log messages.\
    \ |\n| errpt | Display system error messages on AIX systems. |\n| strace | Trace\
    \ system calls and signals. |\n| ltrace | Trace library calls. |\n| lsmod | Display\
    \ Linux kernel module information. |\n| insmod | Install/remove kernel modules.\
    \ |\n| rmmod | Install/remove kernel modules. |\n| modinfo | Display information\
    \ about Linux kernel modules. |\n| **sysctl** | Display and edit kernel parameters\
    \ on Linux and BSD systems. |\n\n### Glossary of terms used in this section:\n\
    \n- **I/O**\n  (Input/Output) The process of reading or writing to a disk drive.\n\
    \n- **Kernel Module**\n  An extension to the kernel that provides a driver, feature,\
    \ or service.\n\n- **Library**\n  A collection of subroutines used by applications.\n\
    \n- **Load Average**\n  The average of system load over a period of time.\n\n\
    - **System Call**\n  The process of a program requesting access to system resources\
    \ such as kernel facilities or system hardware.\n\n- **Trace**\n  The process\
    \ of monitoring internal functions of a program such as system calls and library\
    \ calls.\n\n- **Virtual Memory**\n  A logical combination of physical memory and\
    \ swap storage.\n\n## top\n\nPurpose: Monitor system performance and running processes.\n\
    \nUsage syntax: `top [OPTIONS]`\n\n```bash\n$ top\n\ntop - 18:56:55 up 21 min,\
    \ 2 users, load average: 0.22, 0.35, 0.31\nTasks: 140 total, 2 running, 138 sleeping,\
    \ 0 stopped, 0 zombie\nCpu(s): 9.0%us, 2.0%sy, 0.1%ni, 85.1%id, 3.5%wa, 0.1%hi,\
    \ 0.2%si, 0.0%st\nMem: 3988516k total, 1089196k used, 2899320k free, 35832b buffers\n\
    Swap: 3951948k total, 0k used, 3951948k free, 66484k cached\n\n  PID USER PR NI\
    \ VIRT RES SHR S %CPU %MEM TIME+ COMMAND\n 5297 nick 20 0 19112 1224 892 R 4 0.0\
    \ 0:00.02 top\n  1 root 20 0 4100 920 632 S 0 0.0 0:01.16 init\n  2 root 15 -5\
    \ 0 0 0 S 0 0.0 0:00.00 kthread\n  3 root RT -5 0 0 0 S 0 0.0 0:00.00 migration/0\n\
    \  4 root 15 -5 0 0 0 S 0 0.0 0:00.82 ksoftirqd/0\n  5 root RT -5 0 0 0 S 0 0.0\
    \ 0:00.00 watchdog/0\n  6 root RT -5 0 0 0 S 0 0.0 0:00.00 migration/1\n  7 root\
    \ 15 -5 0 0 0 S 0 0.0 0:00.00 ksoftirqd/1\n  8 root RT -5 0 0 0 S 0 0.0 0:00.00\
    \ watchdog/1\n  9 root 15 -5 0 0 0 S 0 0.0 0:00.01 events/0\n 10 root 15 -5 0\
    \ 0 0 S 0 0.0 0:00.04 events/1\n 11 root 15 -5 0 0 0 S 0 0.0 0:00.00 khelper\n\
    ```\nMonitoring system activity with the top command\n\ntop is a process and performance\
    \ monitor for Unix, Linux, and BSD systems. The first few lines of top output\
    \ displays information about processor, memory, and swap utilization. The remaining\
    \ portion of the screen is used to display information about running processes.\
    \ The process listing updates every few seconds to display the most resource-intensive\
    \ processes.\n\n> **Tip** There are several interactive commands that can be used\
    \ to control the output of the top command. Press the ? key within top for a complete\
    \ listing of these commands.\n\nCommon usage examples:\n\n| Command | Description\
    \ |\n| :--- | :--- |\n| top | Monitor system performance and processes |\n| top\
    \ -u [USER] | Only display processes owned by the specified user |\n| top -d [SECONDS]\
    \ | Update at the specified interval (in seconds) |\n| top -i | Do not display\
    \ idle processes |\n"
