    # badblocks


    **Purpose:** Check a disk drive for bad blocks.


    **Usage syntax:** `badblocks [OPTIONS] [DEVICE]`


    ```

    # badblocks -v /dev/sda

    Checking blocks 0 to 8388607

    Checking for bad blocks (read-only test): done

    Pass completed, 0 bad blocks found.

    ```


    Checking a device for bad blocks using the badblocks command


    The **badblocks** command is a Linux utility used to search a disk drive for bad
    blocks. In the above example, the **badblocks** command is used to check /dev/sda
    for bad blocks. The **-v** option is included to display verbose status information
    during the scan.


    A disk drive that is healthy should have no bad blocks. If bad blocks are found,
    the drive should be replaced immediately to avoid data loss.


    > **Warning**

    > The default **badblocks** test is *read-only and generally safe* to use on a
    *live file system*. Specifying the **-w** option will perform a *read/write test*
    and will ***destroy all data*** on the *specified disk*. It should only be used
    to test a disk that does not contain *critical data*, as it will be *completely
    overwritten*.


    Common usage examples:


    +   - `badblocks [DEVICE]`: Check the specified device for bad blocks

    +   - `badblocks -v [DEVICE]`: Display verbose messages when checking

    +   - `badblocks -w [DEVICE]`: Perform a read/write test on the disk'
