    \n**hostname** 命令显示分配给本地系统的名称。上述示例演示了 **hostname** 命令的典型输出。\n\n**hostname** 还可以用于显示系统的域名，如下一个示例所示。\n\
    \n```bash\n# hostname -d\nmydomain.com\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_140_1.png)\n\
    \n使用 **-f** 选项，您可以查看系统的 FQDN（完全限定域名），如下方示例所示。\n\n```bash\n# hostname -f\nmylaptop.mydomain.com\n\
    ```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_140_2.png)\n\n> **注意**：*主机名配置通常存储在\
    \ /etc/hostname 中。*\n\n常用示例：\n\n- **hostname**：显示系统的主机名\n- **hostname -d**：显示系统的域名\n\
    - **hostname -f**：显示系统的完全限定域名\n\n## ifconfig\n\n用途：显示网络接口。\n\n用法语法：`ifconfig [OPTIONS]\
    \ [INTERFACE]`\n\n```bash\n$ ifconfig -a\n\neth0   Link encap:Ethernet  HWaddr\
    \ 00:21:70:ac:f7:e7\n     inet addr:10.10.1.100  Bcast:10.10.1.255  Mask:255.255.255.0\n\
    \     inet6 addr: fe80::221:70ff:feac:f7e7/64  Scope:Link\n     UP BROADCAST RUNNING\
    \ MULTICAST  MTU:1500  Metric:1\n     RX packets:2937 errors:0 dropped:0 overruns:0\
    \ frame:0\n     TX packets:2088 errors:0 dropped:0 overruns:0 carrier:0\n    \
    \ collisions:0 txqueuelen:1000\n     RX bytes:2199807 (2.1 MB)  TX bytes:548839\
    \ (548.8 KB)\n     Memory:fffe0000-ff700000\n\nlo     Link encap:Local Loopback\n\
    \     inet addr:127.0.0.1  Mask:255.0.0.0\n     inet6 addr: ::1/128  Scope:Host\n\
    \     UP LOOPBACK RUNNING  MTU:16436  Metric:1\n     RX packets:316 errors:0 dropped:0\
    \ overruns:0 frame:0\n     TX packets:316 errors:0 dropped:0 overruns:0 carrier:0\n\
    \     collisions:0 txqueuelen:0\n     RX bytes:26552 (26.5 KB)  TX bytes:26552\
    \ (26.5 KB)\n\n*使用 ifconfig 命令显示网络接口*\n```\n\n**ifconfig** 命令显示系统的网络接口配置。**ifconfig**\
    \ 的输出显示 IP 地址、MAC 地址和接口统计计数等信息，如上述示例所示。\n\n最常见的网络接口类型是标准以太网卡。该接口通常被指定为 **eth0**\
    \ 或 **en0**。具有多个网卡的系统将有 **eth0**、**eth1**、**eth2** 等。\n\n> **注意** 回环接口（*lo*）存在于所有\
    \ *Unix*、*Linux* 和 *BSD* 系统中。它对于正常的系统操作至关重要，不应被禁用或修改。此接口始终具有 IP 地址 127.0.0.1。\n\
    \n常用示例：\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `ifconfig` | 显示已启用的网络接口 |\n| `ifconfig\
    \ -a` | 显示所有网络接口 |\n| `ifconfig [INTERFACE]` | 显示指定的网络接口 |\n\n## ifup / ifdown\n\
    \n**用途**：启用/禁用网络接口。\n\n**用法语法**：`ifup [OPTIONS] [INTERFACE]`\n\n```bash\n# ifup\
    \ eth0\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_142_0.png)\n\n`ifup` 启用网络接口。在上述示例中，接口\
    \ `eth0` 被启用。执行 `ifup` 命令后，`eth0` 接口被激活并可供使用。\n\n`ifdown` 禁用网络接口。这会将指定接口下线并使其不可用。下一个示例演示了如何使用\
    \ `ifdown` 关闭 `eth0` 接口。\n\n**用法语法**：`ifdown [OPTIONS] [INTERFACE]`\n\n```bash\n\
    # ifdown eth0\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_142_1.png)\n\n\
    > 某些系统可能将以太网接口指定为 `en0` 而不是 `eth0`。\n\n常用示例：\n\n| 命令 | 描述 |\n| :--- | :--- |\n\
    | `ifup [INTERFACE]` | 启用指定的网络接口 |\n| `ifup -a` | 启用所有网络接口 |\n| `ifdown [INTERFACE]`\
    \ | 禁用指定的网络接口 |\n| `ifdown -a` | 禁用所有网络接口 |\n\n## iwconfig\n\n**用途**：显示无线网络接口。\n\
    \n**用法语法**：`iwconfig [INTERFACE] [OPTIONS]`\n\n```bash\n$ iwconfig\nwlan0  IEEE\
    \ 802.11abgn  ESSID:\"my-wlan\"\n  Mode:Managed  Frequency:2.437 GHz  Access Point:\
    \ 00:14:BF:E4:1B:E2\n  Bit Rate=54 Mb/s  Tx-Power=15 dBm\n  Retry min limit:7\
    \  RTS thr:off  Fragment thr=2352 B\n  Power Management:off\n  Link Quality=97/100\
    \  Signal level:-52 dBm  Noise level:-91 dBm\n  Rx invalid nwid:0  Rx invalid\
    \ crypt:0  Rx invalid frag:0\n  Tx excessive retries:0  Invalid misc:0  Missed\
    \ beacon:0\n\n使用 iwconfig 命令显示无线网络接口\n```\n\n`iwconfig` 显示 Linux 系统上的无线网络接口。它与前面讨论的\
    \ `ifconfig` 命令类似，但它显示的是无线网络特有的信息。\n\n在上述示例中，显示了 `wlan0` 接口的信息。它显示了已连接无线网络的信号级别、噪声级别和传输速率等信息。\n\
    \n**常用示例：**\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `iwconfig` | 显示所有无线网络接口 |\n| `iwconfig\
    \ [INTERFACE]` | 显示指定的无线网络接口 |\n\n## ethtool\n\n用途：显示以太网卡设置。\n\n用法语法：`ethtool\
    \ [OPTIONS] [INTERFACE]`\n\n```bash\n# ethtool eth0\nSettings for eth0:\n  Supported\
    \ ports: { TP }\n  Supported link modes:  10baseT/Half 10baseT/Full\n        \
    \                  100baseT/Half 100baseT/Full\n                          1000baseT/Full\n\
    \  Supports auto-negotiation:  Yes\n  Advertised link modes:   10baseT/Half 10baseT/Full\n\
    \                          100baseT/Half 100baseT/Full\n                     \
    \     1000baseT/Full\n  Advertised pause frame use:  No\n  Advertised auto-negotiation:\
    \  Yes\n  Link partner advertised link modes:  Not reported\n  Link partner advertised\
    \ pause frame use:  No\n  Link partner advertised auto-negotiation:  No\n  Speed:\
    \ 1000Mb/s\n...\n```\n\nethtool 命令的典型输出\n\n`ethtool` 是一个用于显示网络接口信息的 Linux 实用工具。默认输出显示高级网络接口设置，如上述示例所示。也可以使用\
    \ `-S` 参数显示网络统计信息，如下一个示例所示。\n\n```bash\n# ethtool -S eth0\nNIC statistics:\n \
    \ rx_packets: 125\n  tx_packets: 114\n  rx_bytes: 14459\n  tx_bytes: 17596\n \
    \ rx_broadcast: 9\n  tx_broadcast: 3\n  rx_multicast: 14\n  tx_multicast: 19\n\
    \  rx_errors: 0\n...\n```\n\n使用 -S 参数显示接口统计信息\n\n常用示例：\n\n| 命令 | 描述 |\n| :---\
    \ | :--- |\n| `ethtool [INTERFACE]` | 显示网络接口设置 |\n| `ethtool -S [INTERFACE]` |\
    \ 显示网络接口统计信息 |\n\n## arp\n\n**用途：** 显示 ARP 缓存。\n\n**用法语法：** `arp [OPTIONS]`\n\n\
    ```text\n$ arp\nAddress      HWtype   HWaddress     Flags Mask     Iface\n10.10.2.1\
    \    ether    00:06:B1:12:0D:16 C            eth1\n10.10.2.5    ether    00:14:22:0E:35:5C\
    \ C            eth1\n10.10.2.6    ether    00:0C:29:1B:10:70 C            eth1\n\
    10.10.2.7    ether    00:0C:29:C1:C2:00 C            eth1\n10.10.2.10   ether\
    \    00:0C:29:38:00:F6 C            eth1\n        arp 命令的输出\n```\n\n**arp** 命令显示\
    \ ARP 缓存。本地网络使用 ARP 与相邻系统进行通信。ARP 协议将 IP 地址解析为目标系统的 MAC 地址。解析后的地址存储在缓存中，可以使用 **arp**\
    \ 命令进行显示，如上述示例所示。\n\n**常用示例：**\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `arp` | 显示地址解析协议缓存\
    \ |\n\n## ping\n\n**用途：向网络主机发送 ICMP 回显请求。**\n\n**用法语法：** `ping [OPTIONS] [HOST]`\n\
    \n```bash\n$ ping -c 5 10.10.1.1\nPING 10.10.1.1 (10.10.1.1) 56(84) bytes of data.\n\
    64 bytes from 10.10.1.1: icmp_seq=1 ttl=64 time=0.286 ms\n64 bytes from 10.10.1.1:\
    \ icmp_seq=2 ttl=64 time=0.235 ms\n64 bytes from 10.10.1.1: icmp_seq=3 ttl=64\
    \ time=0.232 ms\n64 bytes from 10.10.1.1: icmp_seq=4 ttl=64 time=0.212 ms\n64\
    \ bytes from 10.10.1.1: icmp_seq=5 ttl=64 time=0.216 ms\n--- 10.10.1.1 ping statistics\
    \ ---\n5 packets transmitted, 5 received, 0% packet loss, time 4002ms\n*使用 ping\
    \ 命令向网络主机发送 ping*\n```\n\n`ping` 命令向网络主机发送 ICMP 回显请求。这在排查网络连接问题时非常有用。在上述示例中，执行\
    \ `ping -c 5` 向 IP 地址为 10.10.1.1 的主机发送五个 ping 包。\n\n> **注意**：*如果省略 `-c` 参数，`ping`\
    \ 命令将持续运行直到被中断（按 `CTRL + C`）。*\n\n> **提示**：*`ping6` 命令用于向 IP 版本 6 主机发送 ping。*\n\
    \n**常用示例：**\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `ping [HOST]` | 向指定主机发送 ping |\n\
    | `ping -c [NUM] [HOST]` | 发送指定数量的 ICMP 包 |\n| `ping -f [HOST]` | 执行快速（洪水）ping\
    \ |\n\n"
