    Software Installation and Maintenance\nSoftware License Management\nDevices\n\
    System Storage Management (Physical & Logical Storage)\nSecurity & Users\nCommunications\
    \ Applications and Services\nWorkload Partition Administration\nPrint Spooling\n\
    Advanced Accounting\nProblem Determination\nPerformance & Resource Scheduling\n\
    System Environments\nProcesses & Subsystems\nApplications\nInstallation Assistant\n\
    [MORE...3]\nF1=Help     F2=Refresh   F3=Cancel    F8=Image\nF9=Shell    F10=Exit\
    \     Enter=Do\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_246_0.png)\n\n\
    **smit** 是 IBM AIX 系统的菜单驱动管理实用程序。它可用于管理 AIX 系统的各个方面。\n\n上述示例显示了 **smit** 主菜单的屏幕截图。在\
    \ **smit** 中，箭头键用于导航菜单，**Enter** 键用于选择项。功能键（即 **F1**、**F2** 等）在 **smit** 内提供其他选项，并在每个屏幕的底部定义。\n\
    \n**常用用法示例：**\n\n- **smit** — 启动 AIX 系统管理接口工具\n\n"
