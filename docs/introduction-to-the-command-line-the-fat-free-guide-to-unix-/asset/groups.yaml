    \ 4:off  5:off  6:off\n     apport              0:off  1:off  2:on   3:on   4:on\
    \   5:on   6:off\n     ...\n```\n```\n\nListing service configuration with the\
    \ chkconfig command\n\nThe **`chkconfig`** command manages services on Red Hat\
    \ Linux systems. The **`-l`** parameter lists the current runlevel configuration,\
    \ as shown in the above example. If no service is specified, all services will\
