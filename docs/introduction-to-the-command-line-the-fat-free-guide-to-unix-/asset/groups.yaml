    \ cron 作业以重复的间隔运行（而 **at** 作业仅运行一次）。\n\n> **注意** *cron* 一词源于希腊语 \"chronos\"，意为“时间”。\n\
    \n在上面的示例中，使用 `-l` 选项显示当前用户的 crontab。下表描述了 crontab 文件中包含的字段。\n\n| 分钟 | 小时 | 月日\
    \ | 月份 | 周几 | 程序 |\n|:------:|:----:|:------------:|:-----:|:-----------:|:-------:|\n\
    | 30 | 12 | * | * | 1–5 | /root/SomeProgram.sh |\n\n在此示例中，`SomeProgram.sh` 将在每周一至周五中午\
    \ 12:30 运行。星期用数字表示，0=周日，1=周一，2=周二，等等。星号 (*) 是一个通配符，代表所有有效值。\n\n`crontab -e` 用于编辑当前用户的\
