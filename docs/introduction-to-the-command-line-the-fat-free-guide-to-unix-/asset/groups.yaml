    \ and not bog down the system while searching.\n\nCommon usage examples:\n\n|\
    \ **Usage** | **Description** |\n|---|---|\n| `find [PATH] -name [NAME]` | Find\
    \ files with the specified name |\n| `find [PATH] -user [USERNAME]` | Find files\
    \ owned by the specified user |\n| `find [PATH] -size [FILESIZE]` | Find files\
    \ larger than the specified size |\n| `find [PATH] -mtime 0` | Find files modified\
    \ in the last 24 hours |\n\n## locate\n\n**Purpose:** Search the locate database\
    \ for files and directories.\n\n**Usage syntax:** `locate [OPTIONS] [DIRECTORY/FILE]`\n\
    \n![](img/8f33496304c637dbf51ff6ddc3c7ff29_27_0.png)\n\nThe **locate** command\
    \ displays the location of files that match the specified name. While similar\
    \ to the **find** command, **locate** is significantly faster because it searches\
    \ a database of indexed filenames rather than performing a raw search of the entire\
    \ file system. A disadvantage of the **locate** command is the fact that it lacks\
    \ the ability to search for advanced characteristics such as file owner, size,\
    \ and modification time.\n\nMost Linux and BSD systems have implemented **locate**\
    \ in order to provide a quick method to locate files by name without affecting\
    \ the performance of the system.\n\n> **Note**\n> The **locate** database is updated\
    \ daily via an automatically scheduled cron job (discussed on page 121) that indexes\
    \ all local file systems. By default, this usually happens once a day. This means\
    \ that results are not updated in real-time and newly created or deleted files\
    \ may not reflect in the results until the next scheduled update.\n\nCommon usage\
    \ examples:\n\n- `locate [FILE]` - Locate the specified file\n- `locate -i [FILE]`\
    \ - Ignore case when searching\n\n## whereis\n\n**Purpose:** Display the location\
    \ of binary files, manual pages, and source code for the specified command.\n\n\
    **Usage syntax:** `whereis [OPTIONS] [COMMAND/FILE]`\n\n```bash\n$ whereis ls\n\
    ls: /bin/ls /usr/share/man/man1/ls.1.gz\n```\n\nDisplaying the file locations\
    \ of the ls program using whereis\n\n**whereis** displays the file locations for\
    \ the specified command. In the above example, **whereis** displays the binary\
    \ file and manual page location for the **ls** command.\n\n> **Note**\n> If the\
    \ source code is available, whereis will also display the location of the source\
    \ files for the specified command. Source code is not installed by default on\
    \ most systems.\n\n> **Tip**\n> The which command is similar to whereis except\
    \ it only displays results for binary commands. This is useful when you only care\
    \ to see the path to the binary file for the specified command. For example, typing\
    \ which ls would display the location of binary file for the ls command. See man\
    \ which for more information.\n\nCommon usage examples:\n\n| **Command** | **Description**\
    \ |\n|---|---|\n| `whereis [COMMAND]` | Display the location of the specified\
    \ command |\n| `whereis -b [COMMAND]` | Display binary programs only |\n| `whereis\
    \ -m [COMMAND]` | Display manual pages only |\n| `whereis -s [COMMAND]` | Display\
    \ source code only (if available) |\n\n## file\n\n**Purpose:** Display the file\
    \ type of the specified file.\n\n**Usage syntax:** `file [OPTIONS] [FILE]`\n\n\
    ```bash\n$ file /bin/bash\n/bin/bash: ELF 64-bit LSB executable, x86-64, version\
    \ 1 (SYSV),\ndynamically linked (uses shared libs), for GNU/Linux 2.6.15, stripped\n\
    $ file /etc/hosts\n/etc/hosts: ASCII English text\n$ file /home/nick/backup.tgz\n\
    backup.tgz: gzip compressed data, from Unix, last modified: Tue May 19\n22:29:29\
    \ 2009\n$ file /dev/cdrom\n/dev/cdrom: symbolic link to 'sr0'\n$ file /dev/sr0\n\
    /dev/sr0: block special\n```\n\nUsing the file command to identify several different\
    \ types of files\n\nThe `file` command displays information about the contents\
    \ of the specified file. Microsoft Windows systems often use a file extension\
    \ (such as `.txt`, `.exe`, `.zip`, etc.) to identify the type of data found in\
    \ a file. Unix, Linux, and BSD files rarely include an extension which can make\
    \ identifying their file type a challenge. The `file` command is provided to resolve\
    \ this problem.\n\nThe above example displays results for several file types commonly\
    \ found on Unix, Linux, and BSD systems. The table below displays more information\
    \ about these file types.\n\n| Type | Description |\n| :--- | :--- |\n| Ascii\
    \ Text Files | Plain text files |\n| Binary Files | Executable programs such as\
    \ those located in the `/bin` and `/usr/bin` directories |\n| Compressed Files\
    \ | Files compressed through the `compress` or `gzip` programs |\n| Device Files\
    \ | Special virtual files that represent devices |\n| Links | Links (AKA shortcuts)\
    \ that point to other files or directories |\n\nBasic file types found on Unix,\
    \ Linux, and BSD systems\n\n**Common usage examples:**\n\n- `file [FILE]` - Display\
    \ the file type for the specified files\n\n## stat\n\n**Purpose:** Display extended\
    \ information about a file system, file, or directory.\n\n**Usage syntax:** `stat\
    \ [OPTIONS] [FILE/DIRECTORY]`\n\n```bash\n$ stat /etc/hosts\n  File: `/etc/hosts'\n\
    \    Size: 805\t\t\t\tBlocks: 8\t\tIO Block: 4096\tregular file\n  Device: 805h/2053d\t\
    Inode: 788\t\tLinks: 1\nAccess: (0644/-rw-r--r--)  Uid: (  0/    root)   Gid:\
    \ (  0/    root)\nAccess: 2009-05-25 20:47:14.916626707 -0500\nModify: 2009-05-25\
    \ 20:46:57.512623325 -0500\nChange: 2009-05-25 20:46:57.512623325 -0500\n```\n\
    \nDisplaying information for the /etc/hosts file using the stat command\n\nThe\
    \ `stat` command displays extended information about files. It includes helpful\
    \ information not available when using the `ls` command such as the file's last\
    \ access time and technical information about the file's location within the file\
    \ system. The example above displays the `stat` output for the `/etc/hosts` file.\
    \ The next example displays the `stat` output for the `/etc` directory itself.\n\
    \n```bash\n$ stat /etc\n  File: `/etc'\n    Size: 4096\t\t\t\tBlocks: 8\t\tIO\
    \ Block: 4096\tdirectory\n  Device: 801h/2049d\tInode: 316993\tLinks: 75\nAccess:\
    \ (0755/drwxr-xr-x)  Uid: (  0/    root)   Gid: (  0/    root)\nAccess: 2010-04-01\
    \ 12:17:44.000000000 -0500\nModify: 2010-03-28 12:47:21.000000000 -0500\nChange:\
    \ 2010-03-28 12:47:21.000000000 -0500\n```\n\nDisplaying stat output for a directory\n\
    \nThe `-f` option can be used with `stat` to display information for an entire\
    \ file system as shown in the next example.\n\n```bash\n$ stat -f /\n  File: \"\
    /\"\n    Id: e70b9c097a45b919   Namelen: 255     Type: ext2/ext3\nBlock size:\
    \ 4096     Fundamental block size: 4096\nBlocks: Total: 9965379      Free: 9723316\
    \     Available: 9221085\nInodes: Total: 2514944      Free: 2476388\n```\n\nUsing\
    \ the -f option with stat to display information about a file system\n\n**Common\
    \ usage examples:**\n\n- `stat [FILE/DIR]` - Display information for the specified\
    \ file/directory\n- `stat -f [FILESYSTEM]` - Display information for the specified\
    \ file system\n\n## date\n\n**Purpose:** Display or set the system clock.\n\n\
    **Usage syntax:** `date [OPTIONS] [TIME/DATE]`\n\n```bash\n$ date\nWed Jun 10\
    \ 20:33:27 CDT 2009\n```\n\nOutput of the date command\n\nThe **date** command\
    \ displays the current time and date for the local system, as shown in the above\
    \ example.\n\n> **Note**\n> Unix, Linux, and BSD systems track time in 24-hour\
    \ format.\n\nThe `-s` option can be used to set the time/date on the system as\
    \ demonstrated in the next example.\n\n```bash\n# date -s \"07/10/2009 11:30\"\
    \nFri Jul 10 11:30:00 CDT 2009\n```\n\nSetting the time and date\n\nWhen setting\
    \ both the time and date you must use **MM/DD/YYYY HH:MM** format. To set the\
    \ time only you can simply use `date -s HH:MM`.\n\n> **Note**\n> You must login\
    \ as root or use the `sudo` command (discussed on page 91) to set the system clock.\n\
    \n**Common usage examples:**\n\n| **Command** | **Description** |\n| :--- | :---\
    \ |\n| `date` | Display the time and date |\n| `date -s [HH:MM]` | Set the time\
    \ |\n| `date -s [\"MM/DD/YYYY HH:MM\"]` | Set the time and date |\n"
  mdcn: "\n## find\n\n**用途：** 搜索文件和目录。\n\n**语法：** `find` **[路径]** [选项] [条件]\n\n```bash\n\
    # find / -name hosts\n/etc/avahi/hosts\n/etc/hosts\n/usr/share/hosts\n```\n\n\
    使用 find 命令定位名称中包含 \"hosts\" 字样的文件\n\n**find** 命令在文件系统中执行原始搜索以定位指定项目。您可以使用多种特征搜索文件，最常见的包括文件名、所有者、大小或修改时间。上述示例显示了在文件名中包含\
    \ \"hosts\" 字样的文件搜索结果。\n\n下一个示例显示了属于指定用户且位于 `/var` 目录内的文件搜索结果。\n\n```bash\n# find\
    \ /var -user nick\n/var/mail/nick\n```\n\n在 /var 目录中定位属于特定用户的文件\n\n> **注意**\n\
    > 由于 **find** 命令在文件系统中执行原始搜索，结果有时可能较慢。最好将搜索范围缩小到特定位置，而不是整个文件系统。这将产生更快的结果，并避免在搜索期间拖慢系统。\n\
    \n常用用法示例：\n\n| **用法** | **描述** |\n|---|---|\n| `find [路径] -name [名称]` | 查找具有指定名称的文件\
    \ |\n| `find [路径] -user [用户名]` | 查找由指定用户拥有的文件 |\n| `find [路径] -size [文件大小]` |\
    \ 查找大于指定大小的文件 |\n| `find [路径] -mtime 0` | 查找在过去 24 小时内修改过的文件 |\n\n## locate\n\n\
    **用途：** 在 locate 数据库中搜索文件和目录。\n\n**语法：** `locate [选项] [目录/文件]`\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_27_0.png)\n\
    \n**locate** 命令显示与指定名称匹配的文件位置。虽然与 **find** 命令类似，但 **locate** 速度显著更快，因为它搜索的是索引文件名数据库，而不是对整个文件系统执行原始搜索。**locate**\
    \ 命令的一个缺点是它缺乏搜索高级特征（如文件所有者、大小和修改时间）的能力。\n\n大多数 Linux 和 BSD 系统都实现了 **locate**，以便提供一种按名称快速定位文件的方法，而不会影响系统性能。\n\
    \n> **注意**\n> **locate** 数据库通过自动调度的 cron 任务（在第 121 页讨论）每天更新，该任务会对所有本地文件系统建立索引。默认情况下，这通常每天发生一次。这意味着结果不是实时更新，新创建或已删除的文件可能要等到下一次计划更新时才会反映在结果中。\n\
    \n常用用法示例：\n\n- `locate [文件]` - 定位指定文件\n- `locate -i [文件]` - 搜索时忽略大小写\n\n## whereis\n\
    \n**用途：** 显示指定命令的二进制文件、手册页和源代码位置。\n\n**语法：** `whereis [选项] [命令/文件]`\n\n```bash\n\
    $ whereis ls\nls: /bin/ls /usr/share/man/man1/ls.1.gz\n```\n\n使用 whereis 显示 ls\
    \ 程序的文件位置\n\n**whereis** 显示指定命令的文件位置。在上面的示例中，**whereis** 显示了 **ls** 命令的二进制文件和手册页位置。\n\
    \n> **注意**\n> 如果源代码可用，whereis 还将显示指定命令的源文件位置。大多数系统默认不安装源代码。\n\n> **提示**\n> which\
    \ 命令与 whereis 类似，但它只显示二进制命令的结果。当您只想查看指定命令的二进制文件路径时，这很有用。例如，输入 which ls 将显示 ls\
    \ 命令的二进制文件位置。更多信息请参见 man which。\n\n常用用法示例：\n\n| **命令** | **描述** |\n|---|---|\n\
    | `whereis [命令]` | 显示指定命令的位置 |\n| `whereis -b [命令]` | 仅显示二进制程序 |\n| `whereis -m\
    \ [命令]` | 仅显示手册页 |\n| `whereis -s [命令]` | 仅显示源代码（如果可用） |\n\n## file\n\n**用途：**\
    \ 显示指定文件的文件类型。\n\n**语法：** `file [选项] [文件]`\n\n```bash\n$ file /bin/bash\n/bin/bash:\
    \ ELF 64-bit LSB executable, x86-64, version 1 (SYSV),\ndynamically linked (uses\
    \ shared libs), for GNU/Linux 2.6.15, stripped\n$ file /etc/hosts\n/etc/hosts:\
    \ ASCII English text\n$ file /home/nick/backup.tgz\nbackup.tgz: gzip compressed\
    \ data, from Unix, last modified: Tue May 19\n22:29:29 2009\n$ file /dev/cdrom\n\
    /dev/cdrom: symbolic link to 'sr0'\n$ file /dev/sr0\n/dev/sr0: block special\n\
    ```\n\n使用 file 命令识别几种不同类型的文件\n\n`file` 命令显示关于指定文件内容的信息。Microsoft Windows 系统通常使用文件扩展名（如\
    \ `.txt`、`.exe`、`.zip` 等）来识别文件中的数据。Unix、Linux 和 BSD 文件很少包含扩展名，这使得识别其文件类型具有挑战性。`file`\
    \ 命令就是为了解决这个问题而提供的。\n\n上述示例显示了在 Unix、Linux 和 BSD 系统中常见几种文件类型的结果。下表提供了关于这些文件类型的更多信息。\n\
    \n| 类型 | 描述 |\n| :--- | :--- |\n| Ascii 文本文件 | 纯文本文件 |\n| 二进制文件 | 可执行程序，如位于 `/bin`\
    \ 和 `/usr/bin` 目录中的程序 |\n| 压缩文件 | 通过 `compress` 或 `gzip` 程序压缩的文件 |\n| 设备文件 | 代表设备的特殊虚拟文件\
    \ |\n| 链接 | 指向其他文件或目录的链接（又名快捷方式） |\n\n在 Unix、Linux 和 BSD 系统中常见的文件类型\n\n**常用用法示例：**\n\
    \n- `file [文件]` - 显示指定文件的文件类型\n\n## stat\n\n**用途：** 显示文件系统、文件或目录的扩展信息。\n\n**语法：**\
    \ `stat [选项] [文件/目录]`\n\n```bash\n$ stat /etc/hosts\n  File: `/etc/hosts'\n  \
    \  Size: 805\t\t\t\tBlocks: 8\t\tIO Block: 4096\tregular file\n  Device: 805h/2053d\t\
    Inode: 788\t\tLinks: 1\nAccess: (0644/-rw-r--r--)  Uid: (  0/    root)   Gid:\
    \ (  0/    root)\nAccess: 2009-05-25 20:47:14.916626707 -0500\nModify: 2009-05-25\
    \ 20:46:57.512623325 -0500\nChange: 2009-05-25 20:46:57.512623325 -0500\n```\n\
    \n使用 stat 命令显示 /etc/hosts 文件的信息\n\n`stat` 命令显示文件的扩展信息。它包含使用 `ls` 命令时无法获取的有用信息，例如文件的最后访问时间以及关于文件在文件系统中位置的技术信息。上述示例显示了\
    \ `/etc/hosts` 文件的 `stat` 输出。下一个示例显示了 `/etc` 目录本身的 `stat` 输出。\n\n```bash\n$ stat\
    \ /etc\n  File: `/etc'\n    Size: 4096\t\t\t\tBlocks: 8\t\tIO Block: 4096\tdirectory\n\
    \  Device: 801h/2049d\tInode: 316993\tLinks: 75\nAccess: (0755/drwxr-xr-x)  Uid:\
    \ (  0/    root)   Gid: (  0/    root)\nAccess: 2010-04-01 12:17:44.000000000\
    \ -0500\nModify: 2010-03-28 12:47:21.000000000 -0500\nChange: 2010-03-28 12:47:21.000000000\
    \ -0500\n```\n\n显示目录的 stat 输出\n\n可以使用 `-f` 选项配合 `stat` 来显示整个文件系统的信息，如下一个示例所示。\n\
    \n```bash\n$ stat -f /\n  File: \"/\"\n    Id: e70b9c097a45b919   Namelen: 255\
    \     Type: ext2/ext3\nBlock size: 4096     Fundamental block size: 4096\nBlocks:\
    \ Total: 9965379      Free: 9723316     Available: 9221085\nInodes: Total: 2514944\
    \      Free: 2476388\n```\n\n使用 -f 选项配合 stat 显示文件系统信息\n\n**常用用法示例：**\n\n- `stat\
    \ [文件/目录]` - 显示指定文件/目录的信息\n- `stat -f [文件系统]` - 显示指定文件系统的信息\n\n## date\n\n**用途：**\
    \ 显示或设置系统时钟。\n\n**语法：** `date [选项] [时间/日期]`\n\n```bash\n$ date\nWed Jun 10 20:33:27\
    \ CDT 2009\n```\n\ndate 命令的输出\n\n**date** 命令显示本地系统的当前时间和日期，如上述示例所示。\n\n> **注意**\n\
    > Unix、Linux 和 BSD 系统以 24 小时制格式跟踪时间。\n\n可以使用 `-s` 选项来设置系统的时间/日期，如下一个示例所示。\n\n\
    ```bash\n# date -s \"07/10/2009 11:30\"\nFri Jul 10 11:30:00 CDT 2009\n```\n\n\
    设置时间和日期\n\n当同时设置时间和日期时，必须使用 **MM/DD/YYYY HH:MM** 格式。如果要仅设置时间，可以使用 `date -s HH:MM`。\n\
    \n> **注意**\n> 您必须以 root 身份登录或使用 `sudo` 命令（在第 91 页讨论）来设置系统时钟。\n\n**常用用法示例：**\n\n\
    | **命令** | **描述** |\n| :--- | :--- |\n| `date` | 显示时间和日期 |\n| `date -s [HH:MM]`\
    \ | 设置时间 |\n| `date -s [\"MM/DD/YYYY HH:MM\"]` | 设置时间和日期 |\n\n"
