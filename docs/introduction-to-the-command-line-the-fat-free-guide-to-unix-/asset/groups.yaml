    **Purpose:** Send email to local and remote users.


    **Usage syntax:** `mail [OPTIONS] [ADDRESS]`


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_162_0.png)


    The **mail** command sends email messages. In the above example, a new email message
