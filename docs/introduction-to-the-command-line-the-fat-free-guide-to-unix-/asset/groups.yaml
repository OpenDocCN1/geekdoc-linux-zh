    # # telinit


    **Purpose**: Change the runlevel.


    **Usage syntax**: `telinit [RUNLEVEL]`


    ```

    ```

    # telinit 1

    *** Switching to run level 1 ***

    # runlevel

    3 1

    ```

    ```


    Using telinit to change the system''s runlevel


    `telinit` tells the system''s *init* process to stop and start the necessary services
    configured for the specified runlevel. In the above example the `telinit` command
    is used to change the system to runlevel 1. The `runlevel` command (see page 129)
    is then executed to display the current and previous runlevels.


    Each system''s runlevel configuration is specific to the distribution being used
    and can be customized to fit your needs. Most Unix, Linux, and BSD systems will
    have a runlevel configuration similar to the one described in the following table.


    | Runlevel | Purpose |

    | :--- | :--- |

    | 0 | Shutdown or special administrative mode |

    | 1 | Single user mode |

    | 2 | Multiuser mode |

    | 3 | Multiuser mode |

    | 4 | Multiuser mode |

    | 5 | Distribution specific |

    | 6 | Reboot |


    Typical Unix, Linux, and BSD runlevels


    +   **Common usage examples:**

    +   - `telinit [RUNLEVEL]` – Tell the init process to load the specified runlevel'
