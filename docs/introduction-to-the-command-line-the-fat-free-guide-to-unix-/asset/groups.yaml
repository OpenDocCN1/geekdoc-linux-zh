    # ## ifup / ifdown


    **Purpose**: Enable/disable network interfaces.


    **Usage syntax**: `ifup [OPTIONS] [INTERFACE]`


    ```

    ```

    # ifup eth0

    ```

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_142_0.png)


    `ifup` enables a network interface. In the above example the interface `eth0`
    is enabled. After executing the `ifup` command, the `eth0` interface is activated
    and available for use.


    `ifdown` disables network interfaces. This takes the specified interface offline
    and makes it unavailable for use. The next example demonstrates using `ifdown`
    to shutdown the `eth0` interface.


    **Usage syntax**: `ifdown [OPTIONS] [INTERFACE]`


    ```

    ```

    # ifdown eth0

    ```

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_142_1.png)


    > Some systems may designate ethernet interfaces as `en0` instead of `eth0`.


    Common usage examples:


    | | |

    | :--- | :--- |

    | `ifup [INTERFACE]` | Enable the specified network interface |

    | `ifup -a` | Enable all network interfaces |

    | `ifdown [INTERFACE]` | Disable the specified network interface |

    | `ifdown -a` | Disable all network interfaces |'
