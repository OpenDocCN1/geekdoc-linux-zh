    \ 19457 | 156191962+ | 5 | Extended |\n| /dev/sda5 | | 13 | 504 | 3951958+ | 82\
    \ | Linux swap / Solaris |\n| /dev/sda6 | | 505 | 19457 | 152239941 | 83 | Linux\
    \ |\n\n*使用 fdisk 命令列出磁盘上的分区*\n```\n\nfdisk 是适用于 Unix、Linux 和 BSD 系统的磁盘分区编辑器。在上面的示例中，使用\
    \ -l 选项显示指定硬盘的分区信息。\n\n不带任何选项执行 fdisk 将打开指定磁盘进行编辑，如下例所示。\n\n```\n# fdisk /dev/sda\n\
    Command (m for help): p\n\nDisk /dev/sda: 160.0 GB, 160041885696 bytes\n255 heads,\
    \ 63 sectors/track, 19457 cylinders\nUnits = cylinders of 16065 * 512 = 8225280\
    \ bytes\nDisk identifier: 0x96000000\n\n| 设备 | 启动 | 起始 | 结束 | 块 | 类型 | 系统 |\n\
    |:---|:---|:---|:---|:---|:---|:---|\n| /dev/sda1 | * | 1 | 12 | 96358+ | de |\
    \ Dell Utility |\n| /dev/sda2 | | 13 | 19457 | 156191962+ | 5 | Extended |\n|\
    \ /dev/sda5 | | 13 | 504 | 3951958+ | 82 | Linux swap / Solaris |\n| /dev/sda6\
    \ | | 505 | 19457 | 152239941 | 83 | Linux |\n\n*使用 fdisk 实用程序修改分区*\n```\n\n在这个示例中，fdisk\
