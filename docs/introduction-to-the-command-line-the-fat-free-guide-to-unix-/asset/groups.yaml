    \ 命令用于将系统更改为运行级别 1。然后执行 `runlevel` 命令（参见第 129 页）以显示当前和上一个运行级别。\n\n每个系统的运行级别配置取决于所使用的发行版，并且可以自定义以满足您的需求。大多数\
    \ Unix、Linux 和 BSD 系统都将具有类似于下表所述的运行级别配置。\n\n| 运行级别 | 用途 |\n| :--- | :--- |\n|\
    \ 0 | 关闭或特殊管理模式 |\n| 1 | 单用户模式 |\n| 2 | 多用户模式 |\n| 3 | 多用户模式 |\n| 4 | 多用户模式 |\n\
    | 5 | 发行版特定 |\n| 6 | 重启 |\n\n典型的 Unix、Linux 和 BSD 运行级别\n\n**常见用法示例：**\n\n- `telinit\
    \ [运行级别]` – 告诉 init 进程加载指定的运行级别\n\n"
