  md: '# ## Section 5:

    # Users, Groups, and Security


    ### Overview

    This chapter covers the most common commands related to users, groups, and security.
    It will also discuss topics like account creation/deletion, file and directory
    permissions, and other user/security related commands.


    **Commands covered in this section:**


    | Command | Purpose |

    |---|---|

    | chmod | Change file and directory permissions. |

    | chown | Change the owner of a file or directory. |

    | chgrp | Change the group of files and directories. |

    | umask | Display/set a user''s deafult file creation mask. |

    | su | Switch user accounts. |

    | sudo | Run a single command as a different user. |

    | id | Display information about a user''s identity. |

    | groups | Display which groups a user belongs to. |

    | who | Display who is logged into the system. |

    | whoami | Display the current user''s identity |

    | w | Display detailed information about users logged in to the system. |

    | last lastb | Display the last successful/failed user logins. |

    | lastlog | Display the most recent user login information. |

    | finger | Display information a about user account. |

    | passwd | Change passwords. |

    | useradd userdel | Create/delete user accounts. |

    | adduser deluser | Create/delete user accounts on Linux systems. |

    | groupadd groupdel | Add/remove a group. |


    (Continued...)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '| Command | Purpose |

    | --- | --- |

    | usermod groupmod | Modify user and group account settings. |

    | wall | Broadcast a message to all users on the system. |

    | ulimit | Display/set system resource limits. |


    # **Glossary of terms used in this section:**


    **GID (Group IDentifier)** A numerical value assigned to a group in the /etc/group
    file.


    **Group** A grouping of user accounts used to simplify security and access control.


    **Mode** Indicator of permissions for files and directories.


    **Octal Notation** A numerical value used to apply permissions to files and directories.


    **Permissions** Settings used to control access to a file or directory.


    **Profile** Collection of settings assigned to a user.


    **Symbolic Notation** A user friendly way to display or apply permissions to files
    and directories.


    **UID (User IDentifier)** A numerical value assigned to a user account in the
    /etc/passwd file.


    **User Account** An account assigned to each person with login access to the local
    system.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# **Types of Accounts**


    There are several types of user accounts used on Unix, Linux, and BSD systems.
    The graphic below illustrates the user security model used on most systems.


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_82_0.png)


    By default, normal users and the programs they execute are given the least amount
    of privileges on the system. System accounts have slightly elevated privileges
    and are used to run system services (like a web server or FTP server). The root
    account has unrestricted administrative access to the entire system.


    # **Groups**


    Groups are used to simplify the management of system security. Users can be a
    member of one or more groups. All users are part of at least one group by default;
    this group is known as the user’s primary group.


    # **File and Directory Permissions**


    File and directory permissions are managed using a set of nine “flags”. The following
    example describes permissions found on a typical file.


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_82_1.png)


    Within these nine flags, three sets of permissions are specified:


    +   -   User (AKA owner) permissions

    +   -   Group permissions

    +   -   Other (i.e. everyone else)'
  merge: -1
  img_proc: true
- pgno: 83
  md: "There are four types of permissions that can be used to control access to a\
    \ file or directory. The following table describes each permission.\n\n| **Symbolic**\
    \ | **Meaning** |\n| :---: | :---: |\n| **r** | Read |\n| **w** | Write |\n| **x**\
    \ | Execute |\n| **–** | No access |\n\nExample of directory permissions\n\nIn\
    \ most cases, the owner of a file will always have full read/write access to that\
    \ file. Execute permission is a special flag used for programs, scripts, and directories\
    \ to indicate they are executable.\n\nThe example below displays basic file permissions.\n\
    \n```\n`$ ls -l ShoppingList.txt`   \n`-rw-r--r--  1 nick users 254 2009-06-01\
    \ 15:35 ShoppingList.txt`\n```\n\nOutput of the ls -l command displaying file\
    \ permissions\n\n| **User** | **Group** | **Other** |\n| :---: | :---: | :---:\
    \ |\n| **Symbolic** | **rw-** | **r--** | **r--** |\n| **Meaning** | Read & Write\
    \ | Read only | Read only |\n\nExample of file permissions\n\nThe next example\
    \ demonstrates directory permissions. Directory permissions work the same as file\
    \ permissions except they are used to control access to directories.\n\n```\n\
    `$ ls -ld finance/`   \n`drwxr-x--- 2 root finance 4096 2009-06-12 09:48 finance/`\n\
    ```\n\nOutput of the ls -ld command displaying directory permissions\n\n| **User**\
    \ | **Group** | **Other** |\n| :---: | :---: | :---: |\n| **Symbolic** | **rwx**\
    \ | **r-x** | **---** |\n| **Meaning** | Read, Write, & Execute | Read only &\
    \ Execute | No Access |\n\nExample of directory permissions\n\nEach file and directory\
    \ has its own set of permissions. Permissions are not inherited from the parent\
    \ directory. Additionally, directories require execute permission in order to\
    \ be accessible, as shown in the previous example."
  merge: -1
  img_proc: true
- pgno: 84
  md: '# # chmod


    **Purpose:** Change file and directory permissions.


    **Usage syntax:** `chmod [OPTIONS] [MODE] [DIRECTORY/FILE]`


    ```

    # chmod 664 ShoppingList.txt

    # ls -l ShoppingList.txt

    -rw-rw-r-- 1 root root 23 2009-05-27 22:31 ShoppingList.txt

    ```


    *Using the chmod command to change file permissions*


    The **chmod** command sets permissions on files and directories. By default, permissions
    are specified in numerical (octal) format such as 664 as shown in the above example.
    In octal form, three digits are used to represent owner, group, and everyone else''s
    permissions. The first number represents the owner’s permissions, the second number
    is the group''s permissions, and the third number is for everyone else.


    The table below provides a cross reference of symbolic and octal permissions.


    | Permission | Symbolic | Octal |

    | :---: | :---: | :---: |

    | Read | r | 4 |

    | Write | w | 2 |

    | Execute | x | 1 |

    | None | – | 0 |


    *Permissions cross reference*


    The sum of the octal permissions becomes what is known as the *mode*. The valid
    modes are described in the following table.


    | Mode | Octal | Symbolic | Effective Permission |

    |:---:|:---:|:---:|:---:|

    | **7** | 4+2+1 | rwx | Read/Write/Execute |

    | **6** | 4+2 | rw– | Read/Write |

    | **5** | 4+1 | r–x | Read/Execute |

    | **4** | 4 | r–– | Read |

    | **0** | 0 | ––– | None |


    *Mode cross reference*


    The combination of 3 modes determines the permissions for the file. A mode of
    664 would create `rw-rw-r--` permissions giving read/write access to the user
    and group, and read only to everyone else.


    (Continued...)'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'The concept of permissions on Unix, Linux, and BSD systems can be hard to grasp
    as first. Several additional examples are provided below to help clarify this
    topic.


    Example 1: A mode of 660 would provide read/write access to the owner and group
    and no access to everyone else.


    ```

    # chmod 660 MyFile

    # ls -l MyFile

    -rw-rw---- 1 root sales 23 2009-05-27 22:31 MyFile

    ```


    Example 2: A mode of 755 would provide full access to the owner and read/execute
    access for the group and everyone else.


    ```

    # chmod 755 MyProgram.sh

    # ls -l MyProgram.sh

    -rwxr-xr-x 1 root sales 23 2009-05-27 22:31 MyProgram.sh

    ```


    Example 3: A mode of 600 would provide read/write access to the owner and no access
    to everyone else.


    ```

    # chmod 600 MyFile

    # ls -l MyFile

    -rw------- 1 root sales 23 2009-05-27 22:31 MyFile

    ```


    Example 4: A mode of 775 applied to a directory would provide read/write/execute
    access to the owner and group and read only access to everyone else.


    ```

    $ chmod 775 MyDirectory

    $ ls -ld test

    drwxrwxr-x 2 root sales 4096 2009-05-27 16:04 MyDirectory

    ```


    Common usage examples:


    | Command | Description |

    | :--- | :--- |

    | chmod [MODE] [FILE] | Change the permissions on the specified file |

    | chmod [MODE] -R [DIR] | Recursively change the permissions on all files |'
  merge: -1
  img_proc: true
- pgno: 86
  md: "# # chown\n\n**Purpose**: Change the owner of a file or directory.\n\n**Usage\
    \ syntax**: `chown [OPTIONS] [USER:GROUP] [DIRECTORY/FILE]`\n\n```\n# ls -l ShoppingList.txt\n\
    -rw-r--r-- 1 nick nick 23 2009-05-27 22:31 ShoppingList.txt\n# chown root ShoppingList.txt\n\
    # ls -l ShoppingList.txt\n-rw-r--r-- 1 root nick 23 2009-05-27 22:31 ShoppingList.txt\n\
    \n*Using the chown command to change the owner of a file*\n```\n\nThe `chown`\
    \ command changes the owner of a file or directory. In the above example, the\
    \ owner of the `ShoppingList.txt` file is changed from `nick` to `root`.\n\nThe\
    \ next example demonstrates changing both the owner and group of a file using\
    \ the `chown` command.\n\n```\n# ls -l ShoppingList.txt\n-rw-r--r-- 1 root nick\
    \ 23 2009-05-27 22:31 ShoppingList.txt\n# chown nick:sales ShoppingList.txt\n\
    # ls -l ShoppingList.txt\n-rw-r--r-- 1 nick sales 23 2009-05-27 22:31 ShoppingList.txt\n\
    \n*Using the chown command to change the owner and group of a file*\n```\n\nAfter\
    \ executing the `chown nick:sales ShoppingList.txt` command, the `ShoppingList.txt`\
    \ file is updated with the owner of `nick` and the group of `sales`.\n\n> **Tip**\n\
    > \n> You can use the `chgrp` command (discussed on page 88) if you only need\
    \ to change the group of a file.\n\n**Common usage examples:**\n\n| Command |\
    \ Description |\n| :--- | :--- |\n| `chown [USER] [FILE]` | Change the owner of\
    \ a file |\n| `chown [USER]:[GROUP] [FILE]` | Change the owner and group of a\
    \ file |\n| `chown -R [USER] [DIR]` | Recursively change the owner on all files\
    \ in the specified directory |"
  merge: -1
  img_proc: true
