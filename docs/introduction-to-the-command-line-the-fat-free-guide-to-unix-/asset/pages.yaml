  md: "# find\n\n**Purpose:** Search for files and directories.\n\n**Usage syntax:**\
    \ `find` **[PATH]** [OPTIONS] [CRITERIA]\n\n```\n# find / -name hosts\n/etc/avahi/hosts\n\
    /etc/hosts\n/usr/share/hosts\n```\n\nUsing the find command to locate files with\
    \ the word \"hosts\" in their name\n\nThe **find** command performs a raw search\
    \ on a file system to locate the specified items. You can search for files using\
    \ a number of characteristics - the most common being file name, owner, size,\
    \ or modification time. The above example displays the results of a search for\
    \ files that contain the word \"hosts\" in their file name.\n\nThe next example\
    \ displays the results of a search for files owned by the specified user located\
    \ within the `/var` directory.\n\n```\n# find /var -user nick\n/var/mail/nick\n\
    ```\n\nLocating files owned by a specific user within the /var directory\n\n>\
    \ **Note**  \n> Since the **find** command performs a raw search on the file system,\
    \ results can sometimes be slow. It’s a good idea to narrow your search to a specific\
    \ location instead of the entire file system. This will produce faster results\
    \ and not bog down the system while searching.\n\nCommon usage examples:\n\n|\
    \ **Usage** | **Description** |\n|---|---|\n| `find [PATH] -name [NAME]` | Find\
    \ files with the specified name |\n| `find [PATH] -user [USERNAME]` | Find files\
    \ owned by the specified user |\n| `find [PATH] -size [FILESIZE]` | Find files\
    \ larger than the specified size |\n| `find [PATH] -mtime 0` | Find files modified\
    \ in the last 24 hours |"
  merge: -1
  img_proc: true
- pgno: 27
  md: '# locate


    Purpose: Search the locate database for files and directories.


    Usage syntax: $\texttt{locate [OPTIONS] [DIRECTORY/FILE]}$


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_27_0.png)


    The **locate** command displays the location of files that match the specified
    name. While similar to the **find** command, **locate** is significantly faster
    because it searches a database of indexed filenames rather than performing a raw
    search of the entire file system. A disadvantage of the **locate** command is
    the fact that it lacks the ability to search for advanced characteristics such
    as file owner, size, and modification time.


    Most Linux and BSD systems have implemented **locate** in order to provide a quick
    method to locate files by name without affecting the performance of the system.


    > The **locate** *database is updated daily via an automatically scheduled* *cron
    job (discussed on page 121) that indexes all local file systems. By* *default,
    this usually happens once a day. This means that results are not* *updated in
    real-time and newly created or deleted files may not reflect in* *the results
    until the next scheduled update.*


    Common usage examples:


    +   * $\texttt{locate [FILE]}$ - Locate the specified file

    +   * $\texttt{locate -i [FILE]}$ - Ignore case when searching'
  merge: -1
  img_proc: true
