  md: '# telnet


    Purpose: Client for connecting to remote servers via the telnet protocol.


    Usage syntax: telnet [OPTIONS] [HOST]


    ```

    $ telnet myserver

    login: nick

    password: ******

    $

    ```


    Connecting to a remote system using the telnet command


    The **telnet** command is used to connect to remote systems via the telnet protocol.
    The above example demonstrates connecting to a remote system using **telnet**.
    Once connected to the remote system you can execute commands as if you were logged
    into the system locally.


    > Note

    > **Telnet is an insecure legacy protocol and has largely been replaced by SSH
    for security reasons. Usernames, passwords, and other sensitive information transmitted
    via telnet are sent in plain text making it very easy for hackers to capture.
    Avoid using telnet whenever possible, especially when communicating over untrusted
    networks such as the internet.**


    Common usage examples:

    telnet [HOST] | Start a telnet session to a remote system'
