  md: '# sed


    **Purpose**: Complex stream editor.


    **Usage syntax**: `sed [OPTIONS] [FILE]`


    ```

    ```bash

    $ cat ShoppingList.txt

    Milk

    Eggs

    Cheese

    Tacos


    $ sed s/Tacos/Nachos/ ShoppingList.txt > NewShoppingList.txt

    $ cat NewShoppingList.txt

    Milk

    Eggs

    Cheese

    Nachos

    ```

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_64_0.png)


    **sed** is a complex stream editor. It uses regular expressions to modify data
    streamed to it. Regular expressions are a pattern matching language supported
    on all Unix, Linux, and BSD systems.


    In the above example, the **sed** command reads the contents of the `ShoppingList.txt`
    file and uses a regular expression to replace all instances of the word *Tacos*
    with *Nachos*. The results are output to a new file called `NewShoppingList.txt`.


    > **Note**: Regular expressions are *complex* and *can''t be fully covered in
    this book*. Visit www.DontFearTheCommandLine.com to find resources for learning
    more about regular expressions syntax.


