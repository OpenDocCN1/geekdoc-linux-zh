    to 2010-05-22

    ...

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_73_1.png)


    | | |

    |---|---|

    | **Common usage examples:**| |

    | `tail [FILE]` | Display the last 10 lines of the specified file |

    | `tail -n [NUM] [FILE]` | Display the specified number of lines |

