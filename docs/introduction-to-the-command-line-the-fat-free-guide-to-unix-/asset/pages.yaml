- pgno: 52
  md: '# ln


    **Purpose:** Create links (shortcuts) to files or directories.


    **Usage syntax:** ln [OPTIONS] [TARGET] [LINK]


    ```

    $ ln -s TheSourceFile ThisIsTheLink

    $ ls -l

    -rw-r--r--  1 nick nick  14 2009-05-23 10:16 TheSourceFile

    lrwxrwxwx  1 nick nick  13 2009-05-23 10:18 ThisIsTheLink -> TheSourceFile

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_52_0.png)


    The ln command creates links to files or directories. A link is the command line
    equivalent of a shortcut. In the above example, a link to a file called TheSourceFile
    is created. Notice the link in the above example has an l prefix in the permissions
    section. This indicates that the file is a link.


    The default operation of the ln command on most systems creates what is known
    as a hard link. Hard links have two major limitations:


    +   1.  Hard links cannot refer to directories

    +   2.  Hard links cannot span multiple file systems/disks


    Symbolic links are more commonly used today to overcome the shortfalls of hard
    links. They are created when using the -s option with the ln command. This is
    the recommended way to create a link as it will not suffer from the same limitations
    of a hard link.


    > Note: Editing a symbolic link file is the same as editing the source file, but
    deleting the symbolic link does not delete the source file.


    Common usage examples:


    | Command | Description |

    | :--- | :--- |

    | `ln [SOURCE] [TARGET]` | Create a hard link to the specified target |

    | `ln -s [SOURCE] [TARGET]` | Create a symbolic link to the specified target |'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# alias


    **Purpose:** Create command line aliases.


    **Usage syntax:** `alias [OPTIONS] [COMMAND]`


    ```

    $ alias rm=''rm -i''

    $ rm TestFile

    rm: remove regular empty file ''TestFile''? y

    Creating a command alias

    ```


    The **alias** command creates command line aliases. This allows you to abbreviate
    a long command string to something simple. In the above example, the **rm** command
    is aliased to be **rm -i** so that every time the **rm** command is executed the
    -i option is automatically included (without having to type it).


    Executing **alias** with no arguments will display all currently defined aliases,
    as demonstrated in the next example.


    ```

    $ alias

    alias cp=''cp -i''

    alias l=''ls -l''

    alias rm=''rm -i''

    Displaying all defined aliases

    ```


    > **Tip**

    > Aliases are lost when you log out. The **unalias** command can be used to delete
    aliases without having to logoff. To make an alias permanent you must add it to
    */etc/profile* or *~/.profile* file in the user''s home directory.


    **Common usage examples:**


    | **Command** | **Description** |

    | :--- | :--- |

    | `alias` | Display defined aliases |

    | `alias [NAME]=''[COMMAND]''` | Create an alias for the specified command |'
  merge: -1
  img_proc: true
