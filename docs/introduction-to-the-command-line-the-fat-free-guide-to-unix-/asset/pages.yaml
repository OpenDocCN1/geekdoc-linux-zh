- pgno: 65
  md: '# awk


    Purpose: Text processing and pattern matching program.


    Usage syntax: awk [EXPRESSION]


    ```

    $ ls -l ShoppingList.*

    -rw-r--r- 1 nick nick 24 2010-04-12 23:10 ShoppingList.old

    -rw-r--r- 1 nick nick 23 2010-04-12 19:33 ShoppingList.txt

    $ ls -l ShoppingList.* | awk -F '' { print $1 " $8 }''

    -rw-r--r- ShoppingList.old

    -rw-r--r- ShoppingList.txt

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_65_0.png)


    **awk** is a pattern matching and text processing utility. It treats each line
    of input as a series of fields. The fields in each line are grouped into an array
    and assigned a variable related to their position. In the above example, **awk**
    is used to extract and print the first and eighth ($1 and $8) fields from the
    output of the **ls** command.


    The **awk** command can also be used to perform batch processing functions such
    as renaming multiple files as demonstrated in the next example.


    ```

    $ ls

    File1 File3 File5 File7 File9

    File2 File4 File6 File8

    $ ls | awk ''{print "mv "$1" "$1".txt"} '' | sh

    $ ls

    File1.txt File3.txt File5.txt File7.txt File9.txt

    File2.txt File4.txt File6.txt File8.txt

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_65_1.png)


    In this example the **awk** command is used to rename the listed files by appending
    a .txt extension to them.


    > **Note**

    > **awk** is a powerful and complex utility that can''t be fully covered in this
    book. Visit **www.DontFearTheCommandLine.com** to find resources for learning
    more about **awk** usage syntax.


    Common usage examples:


    [INPUT] | awk [EXPRESSION] | Process input using the awk command'
  merge: -1
  img_proc: true
