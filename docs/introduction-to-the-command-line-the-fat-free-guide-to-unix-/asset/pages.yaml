    ```


    Using the cancel command to cancel an individual print job


    The `cancel` command deletes queued print jobs. In the above example, `cancel`
    is used to remove an individual job by specifying the job’s ID number. The next
    example demonstrates using the `-a` parameter to remove all queued print jobs
    from the specified printer.


    ```

