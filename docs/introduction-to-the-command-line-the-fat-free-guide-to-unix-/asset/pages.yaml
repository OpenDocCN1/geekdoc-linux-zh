  md: '# dos2unix / unix2dos


    Purpose: Convert file formats between Windows/MS-DOS and Unix/Linux systems.


    Usage syntax: dos2unix / unix2dos [OPTIONS] [FILE]


    ```

    $ cat ShoppingList.txt

    Milk^M

    Eggs^M

    Cheese^M

    Tacos


    $ dos2unix ShoppingList.txt

    $ cat ShoppingList.txt

    Milk

    Eggs

    Cheese

    Tacos

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_79_0.png)


    Text files created in Windows and MS-DOS are formatted with line feed characters
    that are not compatible with Unix/Linux systems. The **dos2unix** command reformats
    the specified file so that it will display properly on Unix/Linux systems. In
    the above example, the line feed characters in the `ShoppingList.txt` file are
    converted so they will display properly on Unix-based systems.


    Similar to the **dos2unix** command, **unix2dos** formats text files created on
    Unix/Linux systems so they can be displayed properly when transferred to Windows
    systems.


    > **Tip**

    > *Conversions are done directly to the specified file. Use the -b option to create
    a backup of the file before converting.*


    **Common usage examples:**


    +   - `dos2unix [FILE]`   Convert a Windows text file to a Unix-formatted file

    +   - `dos2unix -b [FILE]`  Create a backup before converting

    +   - `unix2dos [FILE]`     Convert a Unix text file to a Windows-formatted file

    +   - `unix2dos -b [FILE]`  Create a backup before converting the file'
  merge: -1
  img_proc: true
