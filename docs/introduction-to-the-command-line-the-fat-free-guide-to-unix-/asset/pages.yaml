  md: '# Section 4: Text Editing and Extraction


    ### Overview


    Extracting and editing text is an important part of working on the command line.
    Text editors and utilities are commonly used for administrative purposes such
    as changing settings in configuration files or viewing system log files. This
    chapter provides a basic overview of working with text editing and extraction
    programs for Unix, Linux, and BSD systems.


    **Commands covered in this section:**


