    | /dev/sda6 | | 505 | 19457 | 152239941 | 83 | Linux |


    *Listing the partitions on a disk using the fdisk command*

    ```


    fdisk is a disk partition editor for Unix, Linux, and BSD systems. In the above
    example, the -l option is used to display the partition information for the specified
    hard disk.


    Executing fdisk with no options will open the specified disk for editing, as displayed
    in the next example.


    ```

    # fdisk /dev/sda

