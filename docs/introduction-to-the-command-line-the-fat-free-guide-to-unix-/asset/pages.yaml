  md: "# crontab\n\n**Purpose:** Schedule programs to run at the specified time(s).\n\
    \n**Usage syntax:** `crontab [OPTIONS]`\n\n```\n# crontab -l\n30 12 * * 1-5 /root/SomeProgram.sh\n\
    ```\n\nDisplaying configured cron jobs\n\nThe **crontab** command manages a user's\
    \ scheduled cron jobs. Cron is a subsystem found on most Unix, Linux, and BSD\
    \ systems that schedules programs to run at a specific interval. It differs from\
    \ the previously discussed **at** command because cron jobs run at reoccurring\
    \ intervals (where **at** jobs run only once).\n\n> **Note** The name *cron* comes\
    \ from the Greek word \"chronos\" which means \"time\".\n\nIn the above example,\
    \ the `–1` option is used to display the current user’s crontab. The table below\
    \ describes the fields found in the crontab file.\n\n| Minute | Hour | Day of\
    \ Month | Month | Day of Week | Program |\n|:------:|:----:|:------------:|:-----:|:-----------:|:-------:|\n\
    | 30 | 12 | * | * | 1–5 | /root/SomeProgram.sh |\n\nIn this example `SomeProgram.sh`\
    \ is run every Monday-Friday at 12:30 PM. The day of week is symbolized as 0=Sunday,\
    \ 1=Monday, 2=Tuesday, etc. An asterisk (*) is a wild card that represents all\
    \ valid values.\n\n`crontab -e` is used to edit the current user’s crontab as\
    \ demonstrated in the next example.\n\n```\n# crontab -e\n30 12 * * 1-5 /root/SomeProgram.sh\n\
    ```\n\nEditing the crontab\n\n+   **Common usage examples:**\n+   \n+   - `crontab\
    \ -1` List the current user’s crontab\n+   - `crontab -e` Edit the current user’s\
    \ crontab\n+   - `crontab -r` Delete the current user’s crontab"
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Section 7:

    Startup and Shutdown


    **Overview**


    This chapter covers commands used to startup and shutdown Unix, Linux, and BSD
    systems. It also provides an overview of platform specific service control commands
    for popular platforms.


    **Commands covered in this section:**


    | Command | Purpose |

    | :--- | :--- |

    | `shutdown` | Shut down the system. |

    | `poweroff` | Power off the system. |

    | `reboot` | Reboot the system. |

    | `halt` | Halt the system. |

    | `telinit` | Change the runlevel. |

    | `runlevel` | Display the previous and current runlevel. |

    | `service` | Manage services on a Linux system. |

    | `sysv-rc-conf` | Display and edit Linux runlevel configuration. |

    | `chkconfig` | Display and edit runlevel configuration on Red Hat Linux-based
    systems. |

    | `rc-update` | Display and edit runlevel configuration on Gentoo Linux systems.
    |

    | `rc-status` | Display the status of services on Gentoo Linux systems. |

    | `stopsrc`<br>`startsrc` | Stop/start services on AIX systems. |

    | `lssrc` | Display the status of services on AIX systems. |

    | `svcs` | Display the status of services on Solaris systems. |

    | `svcadm` | Start/stop services on Solaris systems. |'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Glossary of terms used in this section:


    +   - **Init**: (INITialization) A program that controls the startup (AKA initialization)
    of Unix, Linux, and BSD systems.


    +   - **Runlevel**: A set of profiles used by the init program that defines the
    programs and services to load during system startup (or when called by the telinit
    command).


    +   - **Service**: A system program that provides a service as a web server, DNS
    server, email server, etc. Services are sometimes referred to as Daemons or Service
    Daemons.'
  merge: -1
  img_proc: true
- pgno: 123
  md: "# shutdown\n\n**Purpose:** Shut down the system.\n\n**Usage syntax:** `shutdown\
    \ [OPTIONS] [TIME] [MESSAGE]`\n\n```\n```\n# shutdown now\nBROADCAST MESSAGE FROM\
    \ ROOT:\nThe system is going down for shutdown now!\n * Stopping services    \
    \                     [  OK  ]\n * Terminating processes                     \
    \ [  OK  ]\n....\nThe system will  now halt.\n```\n```\n\nExample output from\
    \ the shutdown command\n\nThe `shutdown` command is used to shutdown the local\
    \ system. There are several different types of shutdowns that can be performed:\
    \ halt, poweroff, and reboot.\n\n> **Note**\n> \n> *Usage of the* `shutdown` *command\
    \ varies between the various Unix, Linux, and BSD platforms. Examples on this\
    \ page are intended for* **Linux** *systems. For usage examples specific to your\
    \ environment, type* `man shutdown` *on your local system.*\n\nWhen the `shutdown`\
    \ command is executed, a warning is broadcast to all users logged in to the local\
    \ system. An optional message can be specified following the time argument as\
    \ shown in the next example.\n\n```\n```\n# shutdown 2 Save your work and log\
    \ off ASAP!\nBROADCAST MESSAGE FROM ROOT:\nThe system is going down for shutdown\
    \ in 2 minutes!\nSave your work and log off ASAP!\n```\n```\n\nExample output\
    \ from the shutdown command's broadcast message\n\n**Common usage examples:**\n\
    \n| **shutdown now** | Shutdown the system immediately |\n| --- | --- |\n| **shutdown\
    \ [MIN]** | Wait the specified number of minutes before shutting down |\n| **shutdown\
    \ [HH:MM]** | Shutdown at the specified time (24-hour format) |\n| **shutdown\
    \ -r now** | Restart the system |\n| **shutdown -H now** | Halt the system |\n\
    | **shutdown -P now** | Power off the system |"
  merge: -1
  img_proc: true
- pgno: 124
  md: '# poweroff


    Purpose: Power off the system.


    ```

    Usage syntax: `poweroff`


    # poweroff

    BROADCAST MESSAGE FROM ROOT:

    The system is going down for power off now!

    * Stopping services [ OK ]

    * Terminating processes [ OK ]

    ...

    The system will now power off.


    *Example output of the poweroff command*

    ```


    The **poweroff** command will immedietely shutdown and power off the system. It
    is essentially a shortcut for `shutdown -P now`. The **poweroff** command is found
    on all Linux distributions and some BSD and Unix systems.


    > Note

    > To see if the *poweroff* command is supported on your system, type `whereis
    poweroff`.


    > Warning

    > The *poweroff* command does not offer a grace period and will immedietely bring
    down the system when executed.


    Common usage examples:

    `poweroff` | Shutdown and poweroff the system'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# # reboot


    Purpose: Reboot the system.


    Usage syntax: `reboot`


    ```

    ```

    # reboot

    BROADCAST MESSAGE FROM ROOT: The system is going down for reboot now!

    * Stopping services                 [ OK ]

    * Terminating processes             [ OK ]

    ...

    The system will now reboot.

    ```

    ```


    Example output of the reboot command


    The `reboot` command is used to gracefully reboot the system. It is essentially
    a shortcut for `shutdown -r now`. Executing `reboot` on the command line will
    immediately reboot the system as demonstrated in the above example.


    > **Warning** The `reboot` command does not offer a grace period and will immediately
    reboot the system when executed.


    Common usage examples:


    `reboot`  | Gracefully reboot the system'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# halt


    **Purpose:** Halt the system.


    **Usage syntax:** `halt`


    ```

    # halt

    BROADCAST MESSAGE FROM ROOT: The system is going down for halt now!

    * Stopping services [ OK ]

    * Terminating processes [ OK ]

    ...

    The system will now halt.

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_126_0.png)


    The `halt` command will halt an online system. A halt is a special type of shutdown
    which gracefully shuts down the operating system without powering off the system.


    > **Note**: *Some commercial Unix systems will enter maintenance mode when halted.
    This can be used to access a pre-boot configuration/diagnostic environment.*


    **Common usage examples:**


    `halt` | Halt the system'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# # telinit


    **Purpose**: Change the runlevel.


    **Usage syntax**: `telinit [RUNLEVEL]`


    ```

    ```

    # telinit 1

    *** Switching to run level 1 ***

    # runlevel

    3 1

    ```

    ```


    Using telinit to change the system''s runlevel


    `telinit` tells the system''s *init* process to stop and start the necessary services
    configured for the specified runlevel. In the above example the `telinit` command
    is used to change the system to runlevel 1. The `runlevel` command (see page 129)
    is then executed to display the current and previous runlevels.


    Each system''s runlevel configuration is specific to the distribution being used
    and can be customized to fit your needs. Most Unix, Linux, and BSD systems will
    have a runlevel configuration similar to the one described in the following table.


    | Runlevel | Purpose |

    | :--- | :--- |

    | 0 | Shutdown or special administrative mode |

    | 1 | Single user mode |

    | 2 | Multiuser mode |

    | 3 | Multiuser mode |

    | 4 | Multiuser mode |

    | 5 | Distribution specific |

    | 6 | Reboot |


    Typical Unix, Linux, and BSD runlevels


    +   **Common usage examples:**

    +   - `telinit [RUNLEVEL]` – Tell the init process to load the specified runlevel'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# runlevel


    **Purpose**: Display the previous and current runlevel.


    **Usage syntax**: runlevel


    ```

    $ runlevel

    3 1

    ```


    Output of the runlevel command


    The **runlevel** command displays the current and previous runlevel. The runlevel
    is an initialization sequence called by the init process and defines procedures
    for system startup and shutdown. In the above example, **runlevel** is used to
    display the current runlevel information. The first number displayed is the previous
    runlevel and the second number is the current runlevel.


    > **Note** If there is no previous runlevel, the system will display **N** in
    the first field.


    **Common usage examples:**


    +   * **runlevel** Display the previous and current runlevel'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# service


    Purpose: Manage services on a Linux system.


    Usage syntax: service [OPTIONS] [SERVICE] [ACTION]


    ```

    # service --status-all

    [ + ] acpid

    [ - ] anacron

    [ + ] apache2

    [ + ] atd

    [ + ] cups

    [ + ] dbus

    [ + ] gdm

    [ + ] hal

    [ + ] klogd

    [ + ] ssh

    [ + ] syslogd

    ...

    ```


    Displaying the status of services with the service command


    The service command manages services on Linux systems. In the above example, the
    --status-all option displays the status of all services on the system. The + symbol
    indicates a running service and the − symbol indicates a stopped service.


    The start, stop, restart, and status options can be used to control individual
    services as demonstrated in the next example.


    ```

    # service ssh stop

    * Stopping OpenBSD Secure Shell server sshd [ OK ]

    # service ssh start

    * Starting OpenBSD Secure Shell server sshd [ OK ]

    # service ssh restart

    * Restarting OpenBSD Secure Shell server sshd [ OK ]

    # service ssh status

    * sshd is running

    ```


    Stopping, starting, restarting, and viewing the status of services


    Common usage examples:


    +   * service [SERVICE] stop | Stop the specified service

    +   * service [SERVICE] start | Start the specified service

    +   * service [SERVICE] restart | Restart the specified service

    +   * service [SERVICE] status | Display the status of the specified service

    +   * service --status-all | Display the status of all services'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# sysv-rc-conf


    Purpose: Display and edit Linux runlevel configuration.


    Usage syntax: sysv-rc-conf [OPTIONS] [SERVICE] [ON|OFF]


    ```

    # sysv-rc-conf

    SysV Runlevel Config  --: stop service  *=/: start service  h: help  q: quit

    service          1       2       3       4       5       0       6       S


    acpid            [ ]     [X]     [X]     [X]     [X]     [ ]     [ ]     [ ]

    anacron          [ ]     [X]     [X]     [X]     [X]     [ ]     [ ]     [ ]

    apache           [ ]     [X]     [X]     [X]     [X]     [ ]     [ ]     [ ]

    apparmor         [ ]     [ ]     [ ]     [ ]     [ ]     [ ]     [ ]     [X]

    appport          [ ]     [X]     [X]     [X]     [X]     [ ]     [ ]     [ ]

    atd            [ ]     [X]     [X]     [X]     [X]     [ ]     [ ]     [ ]

    bind9          [ ]     [X]     [X]     [X]     [X]     [ ]     [ ]     [ ]

    Use the arrow keys or mouse to move around.  "n" next pg  "p" prev pg

    space: toggle service on / off

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_130_0.png)


    The sysv-rc-conf command manages service/runlevel configuration on Linux systems.
    In the above example, executing sysv-rc-conf starts a configuration utility which
    enables the user to select which services start on the various runlevels.


    Services can also be displayed and modified via the command line using the --list
    and --level options as demonstrated in the next example.


    ```

    # sysv-rc-conf --level 2345 apache off

    # sysv-rc-conf --list apache2

