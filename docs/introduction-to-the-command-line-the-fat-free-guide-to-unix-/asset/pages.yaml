  md: '# &


    **Purpose:** Start a process in the background.


    **Usage syntax:** `[COMMAND]` &


    ```

    $ ./SomeProgram.sh &

    [1] 10717

    $ ps


    PID TTY TIME CMD

    10696 pts/0 00:00:00 bash

    10717 pts/0 00:00:03 SomeProgram.sh

    10721 pts/0 00:00:00 ps


    Executing a program in the background with the & command line operator

    ```


    & is a command line operator that instructs the shell to start the specified program
    in the background. This allows you to have more than one program running at the
    same time without having to start multiple terminal sessions. In the above example,
    a shell script called `SomeProgram.sh` is started as a background process. Executing
    the `ps` command shows the requested program is now running in the background.


    > **Tip**

    > *Output from background programs will still be displayed in the shell. You can
    redirect this output to a file by using the following syntax: `SomeProgram.sh
    > output.log` & This will redirect all the output of the background program to
    a file called `output.log` in the current directory.*


    | Command | Description |

    | :--- | :--- |

    | `[COMMAND]` & | Execute the specified command in the background |

    | `[COMMAND] > [FILE]` & | Redirect the output of the background command to a
    file |'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# ## **bg / fg**


    **Purpose:** Move a process to the background/foreground.


    **Usage syntax:** `bg [JOBID]`


    ```

    ```

    $ ./SomeProgram.sh

    <CTRL + Z>

    [1]+  Stopped        SomeProgram.sh

    $ bg 1

    $ jobs

    [1]-  Running        SomeProgram.sh


    Suspending a running program and then resuming it in the background

    ```

    ```


    The `bg` command sends a process to the background. This allows you to multitask
    several programs within a single terminal session. In the above example the shell
    script `SomeProgram.sh` is suspended (by pressing **CTRL + Z** on the keyboard)
    and then resumed as a background process using `bg`.


    > > **Note** The `jobs` command (see page 117) *can be used to verify the program
    is now running in the background.*


    The `fg` command moves background processes to the foreground. In the next example
    the `fg` command is used to bring the specified job ID to the foreground.


    **Usage syntax:** `fg [JOBID]`


    ```

    ```

    $ jobs

    [1]-  Running        SomeProgram.sh

    $ fg 1

    SomeProgram.sh

    ...


    Moving a background job to the foreground

    ```

    ```


    **Common usage examples:**


    | **`bg [JOBID]`** | Send the specified job to the background |

    | **`fg [JOBID]`** | Move the specified job to the foreground |'
  merge: -1
  img_proc: true
- pgno: 116
  md: "# jobs\n\n**Purpose:** Display background and suspended jobs.\n\n**Usage syntax:**\
    \ `jobs [OPTIONS]`\n\n```\n$ jobs  \n[1]-  Running        SomeProgram.sh  \n[2]+\
    \  Stopped        AnotherProgram.sh  \n[3]   Stopped        Test.sh\n```\n\nDisplaying\
    \ background programs using the jobs command\n\nThe `jobs` command displays the\
