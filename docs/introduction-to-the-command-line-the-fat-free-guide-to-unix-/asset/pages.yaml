  md: '# md5sum


    **Purpose:** Display the MD5 hash of a file.


    **Usage syntax:** `md5sum [OPTIONS] [FILE]`


    ```

    $ `md5sum ubuntu.iso`

    cace6ea9dde8dc158174e345aa0e3fae `ubuntu.iso`

    ```


    Displaying the md5 hash of a large file using the md5sum command


    The `md5sum` command computes the MD5 sum (sometimes referred to as the *hash*)
    of the specified file. It is similar to the previously discussed `cksum` command
    except more intensive. MD5 hashes are the equivalent of a digital fingerprint
    and are not likely to be duplicated or padded in the same way that `cksum` hashes
    (in some rare instances) can.


    The above example displays the MD5 hash for a Ubuntu Linux CD image downloaded
    from the internet. The resulting MD5 hash can be compared to the hash from the
    download site to ensure it arrived without errors.


    **Note** *The `md5` command is used on BSD systems in place of `md5sum`.*


    **Common usage examples:**


    +   - `md5sum [FILE]`: Compute the MD5 sum for the specified file(s)

    +   - `md5sum -c [FILE]`: Compare the MD5 sum in the specified file'
