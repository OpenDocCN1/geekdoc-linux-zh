  md: '# # ping


    **Purpose: Send ICMP echo requests to network hosts.**


    **Usage syntax:** `ping [OPTIONS] [HOST]`


    ```

    ```bash

    $ ping -c 5 10.10.1.1

    PING 10.10.1.1 (10.10.1.1) 56(84) bytes of data.

    64 bytes from 10.10.1.1: icmp_seq=1 ttl=64 time=0.286 ms

    64 bytes from 10.10.1.1: icmp_seq=2 ttl=64 time=0.235 ms

    64 bytes from 10.10.1.1: icmp_seq=3 ttl=64 time=0.232 ms

    64 bytes from 10.10.1.1: icmp_seq=4 ttl=64 time=0.212 ms

    64 bytes from 10.10.1.1: icmp_seq=5 ttl=64 time=0.216 ms

    --- 10.10.1.1 ping statistics ---

    5 packets transmitted, 5 received, 0% packet loss, time 4002ms

    ```

    *Using the ping command to ping a network host*

    ```


    The `ping` command sends ICMP echo requests to network hosts. This can be helpful
    when troubleshooting network connectivity problems. In the above example, executing
    `ping -c 5` sends five ping packets to the host with the IP address of 10.10.1.1.


    > **Note**: *If the `-c` parameter is omitted, the `ping` command will continue
    until interrupted (by pressing `CTRL + C`).*


    > **Tip**: *The `ping6` command is used to ping IP version 6 hosts.*


    **Common usage examples:**

    | Command | Description |

    | :--- | :--- |

    | `ping [HOST]` | Ping the specified host |

    | `ping -c [NUM] [HOST]` | Send the specified number of ICMP packets |

    | `ping -f [HOST]` | Perform a rapid (flood) ping |'
