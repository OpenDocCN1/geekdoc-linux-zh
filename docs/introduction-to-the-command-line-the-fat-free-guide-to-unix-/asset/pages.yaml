  md: "# chkconfig\n\n**Purpose:** Display and edit runlevel configuration on Red\
    \ Hat Linux-based systems.\n\n**Usage syntax:** `chkconfig [OPTIONS] [SERVICE]\
    \ [ON|OFF] [LEVEL]`\n\n```\n```\n# chkconfig -l\n     acpi-support        0:off\
    \  1:off  2:on   3:on   4:on   5:on   6:off\n     acpid               0:off  1:off\
    \  2:on   3:on   4:on   5:on   6:off\n     alsa-utils          0:off  1:off  2:off\
    \  3:off  4:off  5:off  6:off\n     anacron             0:off  1:off  2:on   3:on\
    \   4:on   5:on   6:off\n     apache2             0:off  1:off  2:off  3:off \
    \ 4:off  5:off  6:off\n     apport              0:off  1:off  2:on   3:on   4:on\
    \   5:on   6:off\n     ...\n```\n```\n\nListing service configuration with the\
    \ chkconfig command\n\nThe **`chkconfig`** command manages services on Red Hat\
    \ Linux systems. The **`-l`** parameter lists the current runlevel configuration,\
    \ as shown in the above example. If no service is specified, all services will\
    \ be displayed. Specifying a service name will display the runlevel configuration\
    \ for the service, as shown in the next example.\n\n```\n```\n# chkconfig -l apache2\n\
    \     apache2             0:off  1:off  2:on   3:on   4:on   5:on   6:off\n```\n\
    ```\n\nListing a specific service with the chkconfig command\n\nThe **`-s`** option\
    \ is used to enable or disable services at the specified run levels as demonstrated\
    \ in the next example.\n\n```\n```\n# chkconfig -s apache2 off 2345\n# chkconfig\
    \ -l apache2\n     apache2             0:off  1:off  2: off 3: off 4: off 5:off\
    \ 6:off\n# chkconfig -s apache2 on 2345\n# chkconfig -l apache2\n     apache2\
    \             0:off  1:off  2:on   3:on   4:on   5:on   6:off\n```\n```\n\nManaging\
    \ services with the chkconfig command\n\nCommon usage examples:\n\n\n| `chkconfig\
    \ -l` | List runlevel configuration for all services |\n| `chkconfig -l [SERVICE]`\
    \ | List a service’s current configuration |\n| `chkconfig -s [SERVICE] \\ on\
    \ [LEVEL]` | Enable a service on the specified level(s) |\n| `chkconfig -s [SERVICE]\
    \ \\ off [LEVEL]` | Disable a service on the specified level(s) |"
  merge: -1
  img_proc: true
