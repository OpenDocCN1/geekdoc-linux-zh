- pgno: 190
  md: '# sync


    Purpose: Flush file system buffers.


    Usage syntax: sync


    ```

    # sync

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_190_0.png)


    The sync command flushes the file system buffer. Unix, Linux, and BSD systems
    pool disk activity to increase performance. When this happens, pending write operations
    are buffered in memory and processed at an opportune time. The sync command forces
    the buffer to flush, which completes all pending write operations.


    While the sync command is rarely used, it can be helpful in situations where the
    system must be rebooted in an abnormal manner, such as unplugging the system or
    pressing the reset button. Executing sync before powering off a system in this
    manner can help prevent file system corruption by ensuring all disk buffers are
    completely flushed.


    > **Tip**

    > *Executing the sync command twice is a common practice to ensure all file system
    buffers have been flushed. The can be done with one command by executing sync;sync
    on the command line.*


    Common usage examples:


    sync | Flush the file system buffer

    sync ; sync | Really flush the file system buffer'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# ## Section 11:

    # Backup and Restore Commands


    # ### Overview


    This section covers utilities used to backup and restore files. Creating a good
    backup is very important for recovering from system failure or natural disaster.
    Most systems have a number of built-in backup programs. These programs can create
    full, partial, and incremental backups and should be incorporated into your disaster
    recovery plan.


    # **Commands covered in this section:**


    | Command | Purpose |

    | --- | --- |

    | **tar** | Create/extract archive files. |

    | **dump** | Create incremental backups. |

    | **restore** | Restore files from dump archives. |

    | **dd** | Create raw copies of data devices. |

    | **cpio** | Create/extract cpio archives. |

    | **mt** | Control tape devices. |

    | **mksysb** | Create a backup image of an AIX system. |


    # **Glossary of terms used in this section:**


    | | |

    | --- | --- |

    | **Full Backup** | A backup that includes all files on the local system. |

    | **Incremental Backup** | A backup that includes only files that have changed
    since the last full backup. |'
  merge: -1
  img_proc: true
