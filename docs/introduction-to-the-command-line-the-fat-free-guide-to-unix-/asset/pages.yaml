  md: "# # fsc k\n\nPurpose: Check and repair file systems.\n\nUsage syntax: `fsc\
    \ k` [OPTIONS] [FILESYSTEM]\n\n```\n# fsc k -n /\n\nfsc k 1.40.8 (13-Mar-2008)\n\
    e2fsc k 1.40.8 (13-Mar-2008)\n/dev/sda1 contains a file system with errors, check\
    \ forced.\nPass 1: Checking inodes, blocks, and sizes\nPass 2: Checking directory\
    \ structure\nPass 3: Checking directory connectivity\nPass 4: Checking reference\
    \ counts\nPass 5: Checking group summary information\n...\n```\n\n![](img/8f33496304c637dbf51ff6ddc3c7ff29_183_0.png)\n\
    \n`fsc k` checks the specified file systems for errors and repairs them if necessary.\
    \ In the above example, the `/` file system is checked for errors. The `-n` option\
    \ is used to instruct `fsc k` to check but not repair the specified file system.\
    \ This is necessary since, in this case, the `/` file system is a live (mounted)\
    \ file system and cannot be repaired unless first unmounted.\n\n> **Warning**\
    \  \n> The `fsc k` command should never be used to repair a mounted file system\
    \ as it will cause data corruption. In Linux, you can safely run `fsc k` at the\
    \ next reboot by typing `sudo touch /forcefsc k` on the command line. Other systems\
    \ may require booting recovery media in order to use `fsc k`. See `man fsc k`\
    \ for more information about usage on your system.\n\nCommon usage examples:\n\
    \n| `fsc k` [FILESYSTEM] | Check and repair the specified file system |\n| `fsc\
    \ k` -n [FILESYSTEM] | Check the specified file system without repairing it |"
  merge: -1
  img_proc: true
- pgno: 184
  md: '# badblocks


    **Purpose:** Check a disk drive for bad blocks.


    **Usage syntax:** `badblocks [OPTIONS] [DEVICE]`


    ```

    # badblocks -v /dev/sda

    Checking blocks 0 to 8388607

    Checking for bad blocks (read-only test): done

    Pass completed, 0 bad blocks found.

    ```


    Checking a device for bad blocks using the badblocks command


    The **badblocks** command is a Linux utility used to search a disk drive for bad
    blocks. In the above example, the **badblocks** command is used to check /dev/sda
    for bad blocks. The **-v** option is included to display verbose status information
    during the scan.


    A disk drive that is healthy should have no bad blocks. If bad blocks are found,
    the drive should be replaced immediately to avoid data loss.


    > **Warning**

    > The default **badblocks** test is *read-only and generally safe* to use on a
    *live file system*. Specifying the **-w** option will perform a *read/write test*
    and will ***destroy all data*** on the *specified disk*. It should only be used
    to test a disk that does not contain *critical data*, as it will be *completely
    overwritten*.


    Common usage examples:


    +   - `badblocks [DEVICE]`: Check the specified device for bad blocks

    +   - `badblocks -v [DEVICE]`: Display verbose messages when checking

    +   - `badblocks -w [DEVICE]`: Perform a read/write test on the disk'
  merge: -1
  img_proc: true
