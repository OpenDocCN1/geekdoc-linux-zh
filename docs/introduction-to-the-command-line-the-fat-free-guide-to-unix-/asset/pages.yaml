- pgno: 223
  md: '# **Section 13:**

    # **Printing Commands**


    **Overview**


    Commands in this section cover the basics of printer management on Unix, Linux,
    and BSD systems. The Unix printing subsystem is known as LPD (Line Printer Daemon).
    Linux uses a newer printing system called CUPS (Common Unix Printing System).
    Although these two printing services are very different at their core, they share
    mostly interchangeable commands.


    **Commands covered in this section:**


    | Command | Purpose |

    | :--- | :--- |

    | `lp` | Print files. |

    | `lstat` | Display printer and print job status information. |

    | `lpq` | Display print queue status. |

    | `cancel` | Cancel and delete queued print jobs. |

    | `enable` `disable` | Enable/disable printers. |

    | `lpadmin` | Administer printers. |


    **Glossary of terms used in this section:**


    +   - **CUPS**: (Common Unix Printing System) A modern printing system for Unix,
    Linux, and BSD systems.

    +   - **Print Job**: A file that has been submitted for printing.

    +   - **LPD**: (Line Printer Daemon) Printing system used primarily on Unix and
    BSD systems.

    +   - **Queue**: A spooling system for print jobs waiting to be printed.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# **lp**


    **Purpose: Print files.**


    ```

    **Usage syntax:** `lp [OPTIONS] [FILE]`


    $ `lp -d HP-4350 /etc/hosts`

    request id is `HP-4350-4` (1 file(s))

    ```


    The `lp` command submits files for printing. In the above example, the `/etc/hosts`
    file is printed on the specified destination printer. The system will display
    a job summary after executing the command. Included in the job summary is the
    print job’s ID number. On most systems, the ID number consists of the printer
    name with the job ID for the specified printer appended to it (4 in this case).


    > **Note**: *If no destination is specified, the file will print on the default
    system printer.*


    **Common usage examples:**


    +   * `lp [FILE]`: Print a file to the default printer

    +   * `lp -d [PRINTER] [FILE]`: Print to the specified printer

    +   * `lp -n [NUM] -d [PRINTER] [FILE]`: Print the specified number of copies'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# lpstat


    Purpose: Display printer and print job status information.


    Usage syntax: `lpstat [OPTIONS]`


    ```

    ```

    $ lpstat

    HP-4350-5   nick    1024   Tue 02 Jun 2009 12:56:50 PM CDT

    HP-4350-6   nick    1024   Tue 02 Jun 2009 12:56:51 PM CDT

    HP-4350-7   nick    1024   Tue 02 Jun 2009 12:56:52 PM CDT

    HP-4350-8   nick    1024   Tue 02 Jun 2009 12:56:52 PM CDT

    Using the lpstat command to display queued print requests

    ```

    ```


    The `lpstat` command displays information about printers and queued print jobs.
    In the above example, executing `lpstat` with no options displays the status of
    all queued print jobs.


    The output of the `lpstat` command is defined in the following table.


    | Field 1 | Field 2 | Field 3 | Field 4 |

    | :--- | :--- | :--- | :--- |

    | PrinterName-JobID | Job owner | Job size | Submission time and date |


    The `-a` option shows the status of all printers on the local system as demonstrated
    in the next example.


    ```

    ```

    $ lpstat -a

    HP-4350 accepting requests since Tue 02 Jun 2009 12:51:08 PM CDT

    HP-5100 accepting requests since Tue 02 Jun 2009 12:51:08 PM CDT

    Displaying the status of all print queues on the local system

    ```

    ```


    Common usage examples:


    | `lpstat` | Display the status of the print queue |

    | `lpstat -a` | Display the current state of all printers |

    | `lpstat -p` | Display the printing status of all printers |

    | `lpstat -s` | Display a status summary |

    | `lpstat -t` | Display all status information |'
