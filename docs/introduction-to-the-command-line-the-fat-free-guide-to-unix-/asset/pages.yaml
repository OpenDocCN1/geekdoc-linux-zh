    | /dev/sda1 | * | 1 | 12 | 96358+ | de | Dell Utility |

    | /dev/sda2 | | 13 | 19457 | 156191962+ | 5 | Extended |

    | /dev/sda5 | | 13 | 504 | 3951958+ | 82 | Linux swap / Solaris |

    | /dev/sda6 | | 505 | 19457 | 152239941 | 83 | Linux |


    *Using the fdisk utility to modify a partition*

    ```


    In this example, the fdisk utility starts an interactive shell that can be used
    to display and modify a disk''s partitions. Within the shell, command keys are
    used to perform a specific task. The following table describes the basic commands
    available within the fdisk utility.'
