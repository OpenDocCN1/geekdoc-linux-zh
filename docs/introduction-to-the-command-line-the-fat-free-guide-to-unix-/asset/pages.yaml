  md: '# tune2fs


    **Purpose:** Adjust Linux file system parameters.


    **Usage syntax:** tune2fs [OPTIONS] [DEVICE]


    ```

    ```

    # tune2fs -1 /dev/sda5

    tune2fs 1.41.9 (22-Aug-2009)

    Filesystem volume name:   <none>

    Last mounted on:          /

    Filesystem UUID:          68dfb151-492b-489a-80d8-0623900de3ba

    Filesystem magic number:  0xEF53

    Filesystem revision:      1 (dynamic)

    Filesystem features:      has_journal ext_attr resize_inode dir_index

    filetype needs_recovery extent flex bg_sparse super_large_file

    Filesystem flags:         signed_directory_hash

    Default mount options:     (none)

    Filesystem state:         clean

    ...

    ```

    ```


    Displaying a file system’s parameters using the tune2fs command


    The **tune2fs** command displays and edits file system settings on Linux systems.
    It supports the ext2, ext3, and ext4 file systems. In the above example, the **-1**
    parameter is used to display detailed information about the specified file system.


    **tune2fs** is most commonly used to adjust the **fsck** intervals for a file
    system. This is the interval in which the system will automatically run an **fsck**
    on the file system. The next example displays the variables that control this.


    ```

    ```

    # tune2fs -1 /dev/sda5 | grep -Ei ''check|max''

    Maximum mount count:      32

    Last checked:             Wed Mar 24 14:14:20 2010

    Check interval:           15552000 (6 months)

    Next check after:         Mon Sep 20 14:14:20 2010

    ```

    ```


    Displaying a file system’s fsck parameters


    Common usage examples:


    +   * `tune2fs -1 [device]`

    +     Display information about the specified file system

    +   * `tune2fs -c [count] \ [device]`

    +     Force the **fsck** command to check the file system after the specified
    number of mounts

    +   * `tune2fs -i [interval] \ [device]`

    +     Force the **fsck** command to check the file system at the specified interval
    in days, weeks, or months'
  merge: -1
