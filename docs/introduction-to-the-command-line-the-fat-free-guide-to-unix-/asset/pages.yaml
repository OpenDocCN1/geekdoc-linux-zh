- pgno: 117
  md: '# nohup


    **Purpose:** Run a process immune to hang-up signals.


    **Usage syntax:** `nohup [COMMAND] &`


    ```

    ```

    $ nohup SomeProgram.sh &

    nohup: ignoring input and appending output to ''nohup.out''

    $ exit

    ```

    Using the nohup command to launch a background program

    ```


    The **`nohup`** command makes processes immune to hang-up signals. A hang-up signal
    is used to inform child processes of a shell that the parent process is terminating.
    This would normally cause all child processes to terminate. Using **`nohup`**
    allows a program to continue running after you log out, as demonstrated in the
    above example.


    > Output from the program is stored in a file called `nohup.out` in the directory
    where the nohup command was executed.


    **Common usage examples:**


    **`nohup [COMMAND ] & |`** Execute a program immune to hang-up signals'
