    +   * sysv-rc-conf --level \

    +     [LEVEL] [SERVICE] on

    +   * sysv-rc-conf --level \

    +     [LEVEL] [SERVICE] off


    *Display the runlevel configuration utility*


    *List runlevel configuration for all services*


    *Enable a service on the specified level(s)*


    *Disable a service on the specified level(s)*'
