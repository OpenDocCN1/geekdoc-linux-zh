  md: '# # cancel


    **Purpose**: Cancel and delete queued print jobs.


    **Usage syntax**: `cancel [OPTIONS] [JOBID]`


    ```

    ```

    $ lpq -P HP-4350

    HP-4350 is not ready

    Rank    Owner   Job     File(s)                   Total Size

    1st     nick    6       hosts                     1024 bytes

