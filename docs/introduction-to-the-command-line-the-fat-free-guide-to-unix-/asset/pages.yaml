  md: "# history\n\n**Purpose:** Display commands that have recently been executed.\n\
    \n**Usage syntax:** `history [OPTIONS]`\n\n```\n$ history 10\n686 man uptime\n\
    687 cat /etc/hosts\n688 ls -l\n689 uptime\n690 dmeg\n691 iostat\n692 vmstat\n\
    693 ping google.com\n694 tracepath google.com\n695 history 10\nDisplay 10 lines\
    \ of command history\n```\n\nThe **history** command displays a user’s command\
    \ line history. Executing the **history** command with no arguments will display\
    \ the entire command line history for the current user. For a shorter list, a\
    \ number can be specified as an argument. Typing **history 10**, for example,\
    \ will display the last 10 commands executed by the current user as shown in the\
    \ above example.\n\n> **Tip**  \n> You can execute a previous command using `!\
    \ [NUM]` where *NUM* is the *line number in history you want to recall*. For example,\
    \ executing `!687` will rerun the command listed on line 687 in the above example.\n\
    \nIn Linux, each user has a file called `.bash_history` in their home directory\
    \ that contains their command line history. Unix systems typically store history\
    \ in a file called `.sh_history` or `.history`.\n\n> **Note**  \n> *The* *history*\
    \ *file* *may* *contain* *sensitive* *information* *about* *commands* *you* *have*\
    \ *recently* *executed*. *Most* *systems* *will* *automatically* *overwrite* *command*\
    \ *line* *history* *after* *a* *certain* *period*. *To* *manually* *erase* *the*\
    \ *history* *file* *in* *your* *home* *directory* *type* `> $HOME/. *history`\
    \ *on* *the* *command* *line*.\n\n**Common usage examples:**\n\n+   *   `history`\
    \ \n+       Display the entire command line history\n+   *   `history [NUM]` \n\
    +       Display the specified number of history items\n+   *   `history | grep\
    \ [PATTERN]` \n+       Search history for the specified pattern"
  merge: -1
