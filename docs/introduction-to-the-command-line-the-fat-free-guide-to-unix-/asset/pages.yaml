- pgno: 35
  md: '# # logout


    **Purpose:** Log out of the system.


    **Usage syntax:** logout


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_35_0.png)


    The **logout** command logs your account out of the system. This will end your
    terminal session and return to the login screen.


    Some systems may have a file called `.logout` or `.bash_logout` in each user''s
    home directory. This file contains commands to be run during the logout process.
    It is used to perform cleanup operations and clear the screen before ending the
    user''s session.


    > > **Tip**

    > > The `logout` command is the recommended way to exit the shell. For security
    purposes, users with administrative access should always logout of any open terminal
    sessions when away from their desk.


    **Common usage examples:**

    `logout` | Log out of the system'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# exit


    Purpose: Exit the current shell.


    Usage syntax: `exit [CODE]`


    ```

    $ exit

    login:

    ```


    Example output of the exit command


    The exit command is similar to the logout command with the exception that it does
    not run the logout script located in the user''s home directory. The above example
    shows the results of exiting the shell and returning to the login prompt.


    Shell scripts typically use the exit command to properly terminate while users
    use the logout command to properly log out of a system. The exception to this
    rule is when a terminal application is opened from within a graphical environment
    on the local system. The logout command cannot be used in this situation because
    terminal session is started as sub shell under the graphical environment. Most
    systems will display an error in this case as shown in the next example.


    ```

    $ logout

    bash: logout: not login shell; use "exit"

    ```


    Logout error message


    > **Tip** *CTRL + D is a keyboard shortcut for exiting the shell. See Appendix
    A for more information on shortcut keys.*


    Common usage examples:


    | Command | Description |

    | :--- | :--- |

    | exit | Exit the current shell |

    | exit [CODE] | Exit the shell and report an exit code (useful in shell scripting)
    |'
  merge: -1
  img_proc: true
