    \n> *The default operation of the **tar** command strips the leading / from the\
    \ file path. This means that files restored from **tar** archives will be placed\
    \ in a location relative to the current directory. The **-p** option can be specified\
    \ to override this behavior.*\n\nCommon usage examples:\n\n+   tar -cvf [FILE]\
    \ [ITEM]\n+   * Backup the specified item(s)\n+   tar -czvf [FILE] [ITEM]\n+ \
    \  * Compress the archive to save space\n+   tar -xvf [FILE] [ITEM]\n+   * Restore\
