- pgno: 44
  md: '# # cp


    **Purpose:** Copy files and directories.


    ```

    **Usage syntax:**

    ```

    cp [OPTIONS] [SOURCE] [DESTINATION]

    ```

    ```


    ```

    $ cp MyFile MyFile.copy

    $ ls -l

    -rw-r-r-- 1 nick nick 55 2009-05-20 15:32 MyFile

    -rw-r-r-- 1 nick nick 55 2009-05-20 15:32 MyFile.copy

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_44_0.png)


    The `cp` command copies files and directories. In the above example, `MyFile`
    is copied to create the `MyFile.copy` file.


    The next example demonstrates using `cp -r` to recursively copy the contents of
    a directory.


    ```

    $ ls -l

    drwxr-xr-x 2 root root 4096 Jul 1 14:06 MyDocuments

    $ cp -r MyDocuments/ MyDocuments2/

    $ ls -l

    drwxr-xr-x 2 root root 4096 Jul 1 14:06 MyDocuments

    drwxr-xr-x 2 root root 4096 Jul 1 14:06 MyDocuments2

    ```


    ![](img/8f33496304c637dbf51ff6ddc3c7ff29_44_1.png)


    After executing the `cp -r` command an exact copy of the specified directory is
    created.


    > **Warning:**

    > *The default behavior the `cp` command will overwrite any existing file(s).
    The `-i` option overrides this behavior and prompts the user before overwriting
    the destination file.*


    **Common usage examples:**

    | Command | Description |

    | --- | --- |

    | `cp [SOURCE] [DEST]` | Create a copy of the specified file |

    | `cp -r [SOURCE] [DEST]` | Recursively copy a directory |

    | `cp -i [SOURCE] [DEST]` | Prompt before overwriting the destination file |

    | `cp -f [SOURCE] [DEST]` | Force overwriting if the destination file exists |

    | `cp -v [SOURCE] [DEST]` | Display verbose messages while copying'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# **rm**


    **Purpose:** Remove files.


    **Usage syntax:** `rm [OPTIONS] [FILE]`


    ```

    $ rm MyFile

    $ ls -l MyFile

    ls: cannot access MyFile: No such file or directory

    ```


    Using the rm command to remove a file


    The **rm** command removes files. In the above example, the **rm** command is
    used to remove `MyFile`. After executing the **rm** command, `MyFile` is deleted
    from the disk and no longer accessible.


    Notice that no warning is given when the file is removed. This is the default
    behavior of **rm** on most systems. To change this, use the `-i` option as demonstrated
    in the next example. This will instruct the system to prompt you to verify you
    want to remove the file.


    ```

    $ rm -i MyFile

    rm: remove regular file ''MyFile''? y

    ```


    Using the -i option with the rm command for interactive prompts


    > **Tip**

    > *You can use the `alias` command (see page 54) to make `rm -i` the default remove
    action. This is highly recommended as it helps prevent accidental disasters when
    deleting files.*


    **Common usage examples:**


    +   - `rm [FILE]` : Remove the specified file

    +   - `rm -r [DIRECTORY]` : Recursively remove all items in the specified directory

    +   - `rm -i [FILE]` : Prompt to confirm the removal of the specified file'
  merge: -1
  img_proc: true
