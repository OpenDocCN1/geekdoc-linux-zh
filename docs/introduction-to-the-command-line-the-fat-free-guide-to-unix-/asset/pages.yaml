  md: "# **tar**\n\nPurpose: Create/extract archive files.\n\nUsage syntax: tar [OPTIONS]\
    \ [OUTPUT] [INPUT]\n\n```\n# tar -cvf backup.tar /etc/*\n/etc/acpi/\n/etc/acpi/stopbtn.sh\n\
    /etc/acpi/videobtn.sh\n/etc/acpi/ibm-wireless.sh\n/etc/acpi/hibernate.sh\n/etc/acpi/resume.d/\n\
