    it will give the list of all the apps which have been installed.


    The other two categories are'
  merge: -1
  pgno: 70
- img_proc: true
  md: '“Preferences” and “Administration,” and they show the applications and the
    tools which are useful for the configuration and administration of Linux Mint.


