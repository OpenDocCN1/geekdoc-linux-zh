- img_proc: true
  md: '# Chapter 1- What is Linux Mint?


    Linux Mint forms one of the common Linux distributions used worldwide by millions
    of people. This Linux distribution offers full multimedia support and is easy
    for one to use. It is open source, which means that one can'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'download it and then perform some customizations on it so as to meet their
    needs. The development of Linux Mint is community driven, which means that the
    user is able to give back feedback on their experience when using Linux Mint for
    the purpose of improving it.


    The development of Linux Mint is based on Ubuntu and Debian, and it comes with'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'the best packages, up to 30,000 of them, with the best package manager. The
    first version of Linux Mint was released in the year 2006 as Linux Mint 1.0, and
    this was a beta release. Later on, Linux Mint 2.0 was released, and this used
    Ubuntu as its codebase.


    In 2010, the Debian-based version of Linux Mint was released. This version'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'of Linux Mint was not tied to the Ubuntu

    packages.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Chapter 2-

    Installation of Linux Mint


    The Linux Mint operating system can be downloaded for free. This will be downloaded
    in the form of an ISO file which you are able to burn on a DVD.

    The liveDVD is bootable and has a'
  merge: -1
  pgno: 15
- img_proc: true
  md: fully-functional operating operating system which you are able to try without
    having to alter your PC. It is good for you to first try the liveDVD and then
    install Linux Mint if you like what you see in it. All the tools you may need,
    including the ones for partitioning, will be available on the DVD. The first step
    is for you to begin by downloading the ISO of the OS which you can find at
  merge: -1
  pgno: 16
- img_proc: true
  md: 'http://www.linuxmint.com/download.phr


    You will then be able to choose the version you need. In this book, we are only
    interested in Linux Mint 18. This will be found in this download page, so go ahead
    to download it. The page will also have the following:


    +   - a torrent link

    - how to verify the ISO'
  merge: -1
  pgno: 17
- img_proc: true
  md: '+   * a list of the download mirrors


    In this case, we need to download the ISO of the file. There are two ways that
    we can download this, by torrent, which provides a peer to peer protocol, and
    by a download mirror, which uses either the FTP or the HTTP protocol. The SHA256
    checksum will help you know whether your image is corrupted or not once the'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'download is complete.


    Once the download of the ISO image is complete, you should go ahead to burn it
    to a DVD. If the DVD has some faults, you will experience difficulties when trying
    to boot from it, and finding help will be hard for you. An error in the downloaded
    ISO file may also make you experience difficulties when trying to'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'boot from it. Errors may also occur as you burn the file to the DVD, and these
    may give you a headache when trying to boot from it.


    The SHA256 checksum will work to help you verify whether the file is as it should
    be. This verification should be done before you can burn the image to the DVD.
    The sha256 checksum comes'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'installed with all the versions of Linux.


    Open your terminal, and use the “cd” command so as to navigate to the directory
    in which you have kept the downloaded file. Once you are in that directory, type
    the following command:


    ```

    sha256sum -b linuxmint.iso

    ```


    The command will give you a series of'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'numbers and letters, and these represent the checksum for your ISO file. If
    your ISO file is changed slightly, then the checksum will change drastically.
    This is why we have to verify and be sure that it is the same.


    The link labeled “verify your ISO” on the download page for the ISO has a checksum,
    and you should compare the'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'one obtained above with this one. If you find that the two checksums are the
    same, then you should conclude that your ISO file is okay, and then you can proceed
    to burn it to your DVD.


    For those using Windows, it is most likely that you have not installed the sha256sum.
    You can download and then install it on your system. Both the ISO'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'file and the md5sum.exe should be kept in the same directory. You can then
    navigate to the directory you have kept these two in via the command line and
    then type the following command:


    ```

    ```sha256sum linuxmint.iso```

    ```


    You will then have a chance to compare the two checksums. Now that you have'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'done the verification, and probably you are sure that the ISO image is okay,
    you can proceed to burn it to the DVD. Just insert it into the drive and then
    begin to burn the image to the DVD. For Linux users who want to burn the image
    to the DVD via the command line, you can run the following command:


    ```

    cdrecord -v -dao dev=1,0,0

    ```'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# linuxmint.iso


    Ensure that you are in the directory in which you have downloaded the file.

    Ensure that the number dev= has been replaced with the correct number for the
    device. If you don''t know the device number, just run the command given below:'
  merge: -1
