    +   7. Help- a tool for showing a suitably formatted document which is comparable
    to this document.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '8. Passwords and keys- this is for management of password and the other keys.


    9. Screen reader- this helps us to access the graphical desktop environment, a
