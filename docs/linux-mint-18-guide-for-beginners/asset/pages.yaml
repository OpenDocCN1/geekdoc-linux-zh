- img_proc: true
  md: '# # Chapter 5- Tips and Tricks


    In Linux Mint, there are ways that one can perform the simplest tasks more easily.
    This will help you save on time.


    Let us discuss some of the tips and tricks in Linux Mint which can help you do
    this.'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# Copying and Pasting


    In most cases, Linux Mint users have to select and then right click on the text
    which they need to copy. Others also do this by clicking on the “Edit” menu. This
    is time consuming. It is possible for you to copy and then paste the text that
    you want by use of the mouse only. In this'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'case, the left button of the mouse will be responsible for copying the text,
    while the middle button will be responsible for pasting the text. That is very
    simple and time saving!


    To demonstrate this, open a text editor or the LibreOffice Writer, or any application
    you like and which allows you to input some text. Type a few'
  merge: -1
  pgno: 148
- img_proc: true
  md: sentences into it. Use the left button of the mouse so as to select some of
    the text which you have just typed. Most do it by clicking on the “Edit” menu
    and then clicking on “Copy.” Others also like to use some combination of keys
    such as “CTRL + COPY.” Linux makes it simpler. By selecting a text, you will have
    copied it. Since you have already selected the text, it has been copied and
  merge: -1
  pgno: 149
- img_proc: true
  md: 'kept in the “mouse buffer,” and there is no need for you to press any other
    keys.


    Click on some other part of the document so as to place your cursor there. Click
    on the middle button of the mouse. If your mouse has a wheel, just wheel-click
    while for those whose mouse has two buttons only, click the right and the left
    buttons together. You will observe'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'that the text which you had just copied


    will be pasted.


    If you get used to doing it, copying and


    pasting of text in Linux Mint will


    become easy for you. This also applies


    to the other Linux distributions.


    It is good for you to note that the buffer


    which is used by the mouse is not the'
  merge: -1
  pgno: 151
- img_proc: true
  md: same as the one which is used by the Cinnamon desktop. This means that you can
    use your mouse to copy some text and then use the CTRL +C for copying another
    text or by the use of the “Edit” menu. This means that you will have copied two
    different items and the way you paste them will be determined by the way you copied
    them, either by use of the middle button of the mouse, the use
  merge: -1
  pgno: 152
- img_proc: true
  md: of “CTRL + V,” or by use of the “Edit” menu.
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Taking Notes


    Everyone likes taking notes when they are using the computer. One may also need
    to write something when they are using the computer, such as something they have
    been told via a phone. These are mostly the things which one needs to remember.
    Some people usually find themselves writing such notes on'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'applications which are not suitable for such tasks. A good example is launching
    the LibreOffice writer so as to write a phone number. Linux Mint comes with a
    tool which is suitable for note-taking. This is known as “Tomboy Notes.”


    The tool is very easy to use as after you have just clicked on it, it will be
    launched with all your notes. If you need'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'to take some new notes, you just have to click on “Create New Note.” This will
    open up a new note.


    Once you have changed the title for this, you will also have changed its name.
    You may choose to write whatever you need into the note and then close it. You
    will then be in a position to access the content which you have just written by'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'use of Tomboy Notes. There will be no need or you to save the note, and you
    can even shut down and restart the computer without affecting the note. The note
    is saved immediately as you type it.


    If you are done with the note and you are sure that you will not need to use it
    anymore, you can delete it by clicking on the “Delete” button. If you happen to'
  merge: -1
  pgno: 157
- img_proc: true
  md: write the title of a particular note in the note you are creating, then this
    second note will be opened once you have clicked on the link which will be created
    automatically by Tomboy. Tomboy Notes also allows you to use some formatting features
    as you create the note. Examples of these features include search features, synchronization,
    as well as exporting of notes to HTML, PDF,
  merge: -1
  pgno: 158
- img_proc: true
  md: and others. That is how you can take notes in Linux Mint.
  merge: -1
