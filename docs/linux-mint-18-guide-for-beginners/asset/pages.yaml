  md: '# Chapter 3- Linux Mint Desktop


    The Desktop refers to a part of the operating system and it is responsible for
    the elements which you will see on the desktop. These include the Wallpaper, the
    Panel, the menus, the Control Center, and others.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Cinnamon Desktop


    Cinnamon Linux Mint makes use of the “Cinnamon” desktop, which is very powerful
    and intuitive.


    # Desktop Settings


    The Desktop is a menu for allowing you'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'to change the aspects of the Cinnamon Desktop which you will mostly be using.


    To launch it, click on the “Menu” which is located at the bottom-left corner of
    the screen, choose “System Settings,” and then click on “Desktop.”'
  merge: -1
  pgno: 49
- img_proc: true
  md: <!-- no content -->
  merge: -1
  pgno: 50
- img_proc: true
  md: Linux Mint comes in with a default Cinnamon menu. If you need to launch the
    menu, click on the “Menu” button which is located on the bottom left corner of
    the screen or hit the “CTRL+SUPER_L.” The SUPER_L on your keyboard refers to the
    left Windows key.
  merge: -1
  pgno: 51
- img_proc: true
  md: '# “Places” Menu


    Once you choose the section for “Places,” you will be presented with five entries.
    These entries will provide you with easy access to some of the places on your
    Cinnamon desktop.


    It is the one which will show the storage'
  merge: -1
  pgno: 52
- img_proc: true
  md: volumes which you have in your computer. If you had mounted all the partitions
    in your computer and you have set the “Desktop Settings” to show the “Mounted
    Volumes” on your desktop, then there will be no need for you to access the Places
    on a regular basis. However, for those who chose not to show the mounted volumes
    on the desktop, or who need to do some
  merge: -1
  pgno: 53
- img_proc: true
  md: 'mounting on a partition which had not been mounted before, you will have to
    access this place as it is useful to you.


    The “Home” place is one of the places which will prove to be useful to you.

    For those who have been using the Cinnamon desktop in the past, you must be used
    to clicking on the “Home” icon which is located on the desktop. Once'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'you have opened too many windows and the desktop disappears, the menu will
    help you to be able to access the “Home” very quickly.


    The “Home” folder provides you with a location on your system in which you can
    store all the data which is personal. The “Desktop” folder represents all the
    data which you have kept on the desktop.'
  merge: -1
  pgno: 55
- img_proc: true
  md: If you place some data on this folder, it will also be added to the desktop.
    You can also do the same by dragging your file to the desktop. The “Network” place
    is responsible for showing you the shared devices, domains, and other computers
    as well as the workgroups which are available on your computer. The “Trash” place
    is responsible for keeping the files which have been
  merge: -1
  pgno: 56
- img_proc: true
  md: 'deleted.


    After right clicking on a file, you will be provided with two options, namely,
    “Delete” and “Move to Trash.\” In case you select “Delete,” this file will be
    deleted permanently, but if you select “Move to Trash,” this file will simply
    be moved to the “Trash” place, and you will be able to access this from the'
  merge: -1
  pgno: 57
- img_proc: true
  md: menu. If you need to restore the file, it will be possible for you to drag and
    drop it to where you need. If you need to permanently delete all the items which
    are contained in the trash, you will have to choose “Empty Trash,” and the files
    will be deleted permanently.
  merge: -1
  pgno: 58
- img_proc: true
  md: '# “System” Menu


    The menu provides us with a number of system choices. They are good in providing
    us with quick access to the most important features of your system.

    It is not possible for any unauthorized user to access these because a password
