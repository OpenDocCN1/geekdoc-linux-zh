  md: If the mouse pointer is placed on top of this, then you will be informed of
    whether your system is up to date or not, and the number of updates which are
    available.
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Welcome to the Update Manager


    This tool provides your operating system with software and security updates.

    Please choose an update policy.


    +   Don''t break my computer!

    Recommended for novice users.

    Only select updates which are known to be safe or which do not impact critical
    parts of the operating system.

    Don''t show me updates which can harm the stability of my system.


    +   Optimize stability and security

    Recommended for most users.

    Only select updates which are known to be safe or which do not impact critical
    parts of the operating system.

    But also show security and kernel updates.


    +   Always update everything

    Recommended for experienced users.

    Select all available updates.

    Keep my computer fully up to date. If a regression breaks something, I''ll fix
    it.'
  merge: -1
  pgno: 128
