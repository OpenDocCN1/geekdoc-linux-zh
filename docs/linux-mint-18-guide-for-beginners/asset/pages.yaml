    the BIOS settings of your computer so as to boot from the DVD. You can restart
    the computer and then restart the computer and then the key which commands your
    computer to boot from the drive. This can be F1, F2, or the Escape key, depending
    on the computer you are using.
  merge: -1
  pgno: 29
- img_proc: true
  md: 'You can then choose “Start Linux Mint” and then hit the Enter key. The live
    system will be started and you will see its screen. The live system will be ready
    after some minutes, and the desktop will be presented.


    Note that at this point, Linux Mint will not be installed on your computer, but
    it'
  merge: -1
  pgno: 30
- img_proc: true
  md: will only be running from the DVD. However, once you install it on your computer,
    it will just be the same as the one which you are running from the DVD. Also,
    you should know that the system will be slower when running it from the DVD than
    after you have installed it on the computer. The reason behind this is that the
    data has to be read from the DVD, rather than reading it
  merge: -1
  pgno: 31
- img_proc: true
  md: 'from the hard disk, which is a bit faster.


    Click on the “Install Linux Mint” icon which is located on the desktop. The installer
    will then appear. It will also be good for you to read more about the release
    notes so that you can know more about the features, as well as how to tackle any
    issues which may arise.'
  merge: -1
