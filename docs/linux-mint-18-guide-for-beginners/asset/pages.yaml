    # Updating System and Applications


    After a new version of a package you have installed on your computer has been
    made, it is possible for you to upgrade it to the new version. The update can
    be in the form of a security'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'update to a component of your operating system, or the optimization of a specific
    library or you may need to update to some new version of the Firefox browser.


    The Linux Mint system is made up of packages, and the update to this system can
    be done by updating any part of these packages. Once you do, the old'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'package will be replaced with the new package.


    In Linux Mint, a number of ways exist that one can update their packages, but
    we recommend that you use only one of those ways.


    The APT can be used for upgrading the system by use of a single command'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'which is “apt upgrade” but this is not recommended. The problem with this is
