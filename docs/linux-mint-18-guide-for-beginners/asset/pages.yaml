- img_proc: true
  md: 'The button for “Software Manager” will open the Linux Mint Software Manager.
    It forms the best program for the installation of software in Linux Mint. For
    you to gain access to the system rights, you will be asked to provide a password.


    The button for “Package Manager” will'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'open an application known as “Synaptic.” This package is responsible for management
    of the apps which have been installed on your computer, as well as the ones which
    are available in the repositories.


    The button for “System Settings” opens the Cinnamon Control Center. The app allows
    us to configure each and every'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'aspect of the Cinnamon desktop as well as the the whole computer in general.
    Let us discuss the items which are contained in this control center.


    The "Terminal" button opens an application named "Terminal" which allows one to
    use the keyboard for entering commands. For those used to the Windows OS, this
    might be a bit'
  merge: -1
  pgno: 64
- img_proc: true
  md: complex, as its command prompt has not progressed much. The Linux Mint terminal
    is very powerful, and it becomes too easy if one gets used to it. It is worth
    it for you to know that any command which you run via the graphical desktop in
    Linux Mint must go through the terminal. A good example is when you click on an
    icon on the desktop. In this case, Cinnamon is
  merge: -1
  pgno: 65
- img_proc: true
  md: 'instructed to pass some textual information to the terminal. The terminal can
    help you achieve a lot with just a single command, as opposed to achieving the
    same by opening several windows.


    The button for “Lock Screen” is used for locking your screen. For you to unlock
    it, you will be prompted to enter the'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'password. When you click on the “Logout” button, a popup which will allow you
    to logout or switch the users will be launched.


    The “Quit” button will launch a dialog box which allows you to choose what you
    need. The “Suspend” option will save your session to the RAM, and the computer
    will sleep until you have'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'pressed a key. The "Hibernate" option will save the session to the hard drive,
    and the computer will shut down. The "Restart" option will restart the computer.
    The "Shut Down" option will turn off the computer.


    # “Applications” Menu


    A Linux Mint DVD is usually'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'compressed, and it usually has about 3GB of data. The applications which come
