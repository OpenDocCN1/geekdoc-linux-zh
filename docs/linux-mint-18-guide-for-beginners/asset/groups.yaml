    - 4. VLC媒体播放器- 这是一个视频播放器，能够播放网络上提供的几乎所有类型的视频。


    # “搜索”字段


    此功能可以让你访问那些你忘记了在何处找到的项目，或者你想要快速访问的项目。你只需点击屏幕左下角的“菜单”，然后开始输入你正在寻找的应用程序名称。随着你不断输入，菜单上将只显示与你输入的单词相匹配的应用程序。


    此菜单还允许你定义一些你喜爱的应用程序，并将它们保留在一个特殊的菜单中，以便于访问。在菜单中，右键点击你喜欢的应用程序，然后选择“添加到收藏夹”。同样，你可能需要选择“从收藏夹中移除”。收藏部分将显示在菜单的左侧。你还可以组织这些元素的布局方式。你只需要拖动并释放它们，它们就会按照你喜欢的顺序重新排列。


    # 创建快捷方式


    对于那些不喜欢或对“收藏”部分感兴趣的人，你可以从桌面或面板快速访问元素。只需右键点击你想要的应用程序，然后选择“添加到面板”或“添加到桌面”。


    # 更改菜单外观


    你有多种方法可以自定义菜单。只需右键点击“菜单”并然后选择“配置”。你将看到菜单的配置工具出现。你将有机会修改 Cinnamon 菜单各个方面。


    # 恢复默认设置


    如果你需要恢复默认设置，在配置菜单中，只需点击“移除”右侧的按钮，然后选择“重置为默认”。


    # 自动启动应用程序


    在“偏好”下可以找到名为“启动应用程序”的程序。你可以在这里添加应用程序。菜单编辑器可以为你提供应用程序所需的正确信息。如果你这样做，该应用程序将在你每次启动电脑时自动启动。如果你需要禁用此项，只需取消勾选该程序即可。


    # 第 4 章- 软件管理


    # 包管理


    对于第一次使用 Linux Mint 的用户，你可能不知道如何将软件组织成一个“包”。在安全和访问便利性方面，这是一个非常好的功能。


    Linux Mint 的设计使得任何连接的硬件都会被自动检测，并且所有驱动程序都会自动安装。它还让 Linux Mint 用户能够完成大多数任务，而无需寻找任何第三方软件。Linux
    Mint 的安装版还带有一个功能完整的办公套件、一个高质量且专业的图像编辑解决方案、IRC 和 IM 客户端、几个媒体播放器、一个磁盘刻录机以及许多实用配件。这些都是免费软件！


    当你从第三方网站寻找要在 Linux 系统上使用的软件时，会遇到很多问题。首先，你很难知道该软件是否经过测试，以及是否已被证明与你的操作系统兼容。此外，很难知道该软件是否能与系统中的其他软件兼容并按你预期的方式运行。该软件还可能来自未知的开发者，你不确定该软件是否会损坏你的计算机。


    你可能会从不同的供应商下载并安装多个不同的程序。然而，这样做的问题在于，你的系统将缺乏一种管理结构。此外，你最好能制定一个计划，说明如何确保你下载到系统中的软件部分能够保持更新。有时，你可能会对某个程序感到厌倦。你将如何摆脱该程序呢？有些软件程序在安装后不提供移除选项，即使它们可能随之附带，程序也不会从系统中完全删除。这意味着在你电脑上运行了该程序的安装程序后，它获取了你电脑的一些控制权，更忘了该程序是由陌生人编写的。


    在这种情况下，以这种方式分发的软件就变成了静态的。这意味着你必须先下载程序本身，然后是运行它所需的数据库。该程序的开发者现在意识到了你系统上安装的软件和库。这意味着，为了确保你在你的系统上成功运行该程序，他们必须向你提供程序本身以及数据库。下载本身将非常大，而且每当你需要更新它时，你都必须更新程序本身以及其余库。这也是分开进行的，而不是一次性完成。这意味着通过分发静态软件，会产生重复工作。

