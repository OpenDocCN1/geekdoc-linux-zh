    # Introduction


    Most people in the world have turned to using Linux as opposed to the common Windows
    operating system. This is because they have realized how powerful Linux is and
    that one can achieve a lot when using Linux. One also feels proud when they are
    termed to be a “Linux Geek.” Linux comes in a wide variety of distributions, and
    each distribution has been made to be used in a particular field for which it
    is suitable.


    Linux Mint is one of the available Linux distributions, and this was developed
    based on Ubuntu and Debian. You can use this Linux distribution to perform a number
    of tasks. This book is a guide for you on how to use Linux Mint, and it has been
    updated to Linux Mint 18.0. Enjoy reading!


    # Chapter 1- What is Linux Mint?


    Linux Mint forms one of the common Linux distributions used worldwide by millions
    of people. This Linux distribution offers full multimedia support and is easy
    for one to use. It is open source, which means that one can download it and then
    perform some customizations on it so as to meet their needs. The development of
    Linux Mint is community driven, which means that the user is able to give back
    feedback on their experience when using Linux Mint for the purpose of improving
    it.


    The development of Linux Mint is based on Ubuntu and Debian, and it comes with
    the best packages, up to 30,000 of them, with the best package manager. The first
    version of Linux Mint was released in the year 2006 as Linux Mint 1.0, and this
    was a beta release. Later on, Linux Mint 2.0 was released, and this used Ubuntu
    as its codebase.


    In 2010, the Debian-based version of Linux Mint was released. This version of
    Linux Mint was not tied to the Ubuntu packages.


    # Chapter 2- Installation of Linux Mint


    The Linux Mint operating system can be downloaded for free. This will be downloaded
    in the form of an ISO file which you are able to burn on a DVD. The liveDVD is
    bootable and has a fully-functional operating system which you are able to try
    without having to alter your PC. It is good for you to first try the liveDVD and
    then install Linux Mint if you like what you see in it. All the tools you may
    need, including the ones for partitioning, will be available.

    '
