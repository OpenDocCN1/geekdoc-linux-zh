    # 引言


    世界上绝大多数人已经转向使用 Linux 而不是常见的 Windows 操作系统。这是因为他们已经意识到 Linux 是多么强大，以及使用 Linux 可以成就很多目标。当被称为“Linux
    极客”时，人们也会感到自豪。Linux 有多种发行版，每种发行版都是为了特定的领域而设计的。


    Linux Mint 是可选的 Linux 发行版之一，基于 Ubuntu 和 Debian 开发。你可以使用这个 Linux 发行版完成许多任务。本书是一份关于如何使用
    Linux Mint 的指南，并已更新至 Linux Mint 18.0。阅读愉快！


    # 第 1 章 什么是 Linux Mint？


    Linux Mint 是全球数百万用户使用的常用 Linux 发行版之一。该 Linux 发行版提供完整的多媒体支持，并且易于使用。它是开源的，这意味着用户可以下载它并对其进行一些定制以满足自己的需求。Linux
    Mint 的开发是社区驱动的，这意味着用户能够对其使用 Linux Mint 的体验提供反馈，以改进它。


    Linux Mint 的开发基于 Ubuntu 和 Debian，并配备了最优秀的软件包（多达 30,000 个）以及最好的包管理器。Linux Mint
    的第一个版本于 2006 年作为 Linux Mint 1.0 发布，这是一个测试版本。随后，发布了 Linux Mint 2.0，它使用 Ubuntu 作为代码库。


    2010 年，发布了基于 Debian 的 Linux Mint 版本。这个版本的 Linux Mint 不受限于 Ubuntu 软件包。


    # 第 2 章 Linux Mint 的安装


    可以免费下载 Linux Mint 操作系统。它将以 ISO 文件的形式下载，你可以将其刻录到 DVD 中。LiveDVD 是启动的，并包含一个功能完整的操作系统，你可以在不更改电脑的情况下对其进行尝试。建议你先尝试
    LiveDVD，如果你喜欢你看到的内容，再安装 Linux Mint。你可能需要的所有工具（包括分区工具）都将可用。


