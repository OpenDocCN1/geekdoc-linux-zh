  mdcn: '

    更新管理器。


    更新管理器（Update Manager）通过仅计算“安全”更新来工作。如果系统提示您的系统是最新状态，这仅意味着对于您在系统中指定的为“安全”的更新级别，没有新的更新可用。更新管理器的列表中只会显示“可见”的更新。


    一个很好的例子是，当所有级别都被设置为“可见”时，但只有级别 1 和级别 2 被标记为“安全”的。在这种情况下，列表中将看到许多更新，但更新管理器会告诉您您的系统是最新状态。


    “选项（Options）”选项卡为您提供了许多选择，您可以借此更改更新管理器的设置。您还会在“选项”下找到“包含需要安装新软件包或卸载已安装软件包的更新”选项，这将允许您指定是否允许更新管理器安装某些新的依赖项。在使用此选项时务必小心，因为尽管它可能帮助您安装某些新的依赖项，但也可能会移除您已经安装的依赖项。


    “自动刷新（Auto-Refresh）”选项卡将帮助您定义更新管理器检查更新的频率。在“忽略的包（Ignored packages）”选项卡中，您可以定义不需要接收更新的包。该处支持使用“*”和“?”。


    “图标（Icons）”选项卡允许您更改更新管理器在系统托盘中使用的图标。如果更新器给您错误，您可以继续在日志中检查问题。进入系统区域，右键点击锁形图标。选择“信息（Information）”，您将看到弹出一个新窗口。


    ## 第 5 章 技巧与窍门


    在 Linux Mint 中，有一种方法可以让人们更轻松地执行最简单的任务。这将帮助您节省时间。


    让我们讨论一下 Linux Mint 中一些可以帮助您实现此目标的技巧。


    ## 复制与粘贴


    在大多数情况下，Linux Mint 用户必须选择需要复制的文本然后对其点击右键。其他人也通过点击“编辑（Edit）”菜单来这样做。这非常耗时。您可以仅通过使用鼠标来复制并粘贴您想要的文本。在这种情况下，鼠标的左键负责复制文本，而中键将负责粘贴文本。这非常简单且节省时间！


    为了演示这一点，请打开文本编辑器、LibreOffice Writer 或任何您喜欢的、允许输入文本的应用程序。在其中输入几句子。使用鼠标左键选择您刚刚输入的一些文本。大多数人通过点击“编辑”菜单然后点击“复制”。其他人也喜欢使用某些组合键，例如“CTRL
    + COPY”。Linux 让它变得更简单。通过选择文本，您就已经复制了它。由于您已经选择了文本，它已经被复制并保存在“鼠标缓冲区”中，您不需要按下任何其他键。


    点击文档的其他部分以将光标放置在那个位置。点击鼠标中键。如果您的鼠标有滚轮，只需在点击时按压滚轮即可；而对于那些只有两个按钮的鼠标，请同时点击右键和左键。您会发现刚刚复制的文本被粘贴了。


    如果您习惯了这种操作，在 Linux Mint 中复制和粘贴文本对您来说将变得简单。这适用于其他的 Linux 发行版。


    请您注意，鼠标使用的缓冲区与 Cinnamon 桌面使用的缓冲区是不相同的。这意味着您可以使用鼠标复制某些文本，然后使用 `CTRL +C` 复制另一个文本，或通过使用“编辑”菜单。这意味着您将复制两个不同的项目，而粘贴它们的方式将取决于您复制的方式。


    ## 笔记


    在 Linux Mint 中，人们有多种方法可以记录笔记。大家在运行电脑时喜欢记录笔记。Linux Mint 自带了一个适用于此类任务的工具，被称为 Tomboy。


    该工具非常易用，在您点击它后将加载您的笔记。如果您需要记录新笔记，只需点击“新建笔记（Create New Note）”。这将打开一个笔记。一旦您更改了标题，您也可以更改它的名称。您可以在笔记中编写任何需要的内容然后将其关闭。通过
    Tomboy，您可以访问刚刚编写的内容。您不需要保存笔记，甚至可以重启电脑也不会影响笔记。笔记会在您输入时立即保存。


    如果您已经完成了笔记并确定不再需要它，可以点击“删除（Delete）”按钮将其删除。如果您在正在创建的笔记中写了特定笔记的标题，那么点击该链接后将打开第二个笔记。Tomboy
    还允许您在创建笔记时使用某些格式功能。这些功能包括搜索功能、同步以及将笔记导出为 HTML、PDF 等。这就是在 Linux Mint 中记录笔记的方法。


    ## 总结


    Linux Mint 是 Linux 的发行版之一。它基于 Ubuntu 和 Debian。通过 Linux Mint，人们可以做很多事情。现在，您应该对使用
    Linux Mint 的各个方面了如。Linux Mint 终端可以帮助您更轻松、更快速地完成大多数任务。一个很好的例子是当您执行系统升级时。您可以使用一个简单的命令来完成，而不是使用
    GUI 手动更新系统的每个组件。对于 Linux Mint 初学者来说，使用命令行可能看起来有点复杂，但对您来说开始练习是有好处的。涉及到 Linux Mint
    的更新时，它们被分类在级别 1 到级别 5 之间。人们必须指定系统处于“安全”的级别。如果违反了这一点，您将收到有关可用更新的通知，并获得升级到该级别的选项。


