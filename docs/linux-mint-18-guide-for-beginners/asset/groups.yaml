- md: "\nYou can then choose “Start Linux Mint” and then hit the Enter key. The live\
    \ system will be started and you will see its screen. The live system will be\
    \ ready after some minutes, and the desktop will be presented.\n\nNote that at\
    \ this point, Linux Mint will not be installed on your computer, but it will only\
    \ be running from the DVD. However, once you install it on your computer, it will\
    \ just be the same as the one which you are running from the DVD. Also, you should\
    \ know that the system will be slower when running it from the DVD than after\
    \ you have installed it on the computer. The reason behind this is that the data\
    \ has to be read from the DVD, rather than reading it from the hard disk, which\
    \ is a bit faster.\n\nClick on the “Install Linux Mint” icon which is located\
    \ on the desktop. The installer will then appear. It will also be good for you\
    \ to read more about the release notes so that you can know more about the features,\
    \ as well as how to tackle any issues which may arise.\n\nChoose the language\
    \ which you need, and then click on “Continue.” A screen which asks you whether\
    \ you need to install the third party software will be presented. This refers\
    \ to the software which is not fully open source but it has some conditions for\
    \ licensing. If you need to use these, just check the box and then click on “Continue.”\n\
    \nIn our next step, laptop users should ensure that they are connected to a power\
    \ source, an Internet connection, and that the recommended amount of disk space\
    \ is available. You can then click on “Continue.\"\n\n# Installation type\n\n\
    This computer currently has no detected operating systems. What would you like\
    \ to do?\n\n- Erase disk and install Linux Mint\n  Warning: This will delete all\
    \ your programs, documents, photos, music, and any other files in all operating\
    \ systems\n\n- Encrypt the new Linux Mint installation for security\n  You will\
    \ choose a security key in the next step\n\n- Use LVM with the new Linux Mint\
    \ installation\n  This will set up Logical Volume Management. It allows taking\
    \ snapshots and easier partition resizing\n\n- Something else\n  You can create\
    \ or resize partitions yourself, or choose multiple partitions for Linux Mint\n\
    \nQuit Back Install Now\n\nYou will then have the option of assigning the whole\
    \ of your hard disk to Linux Mint, or choose to install it alongside another operating\
    \ system. You can also choose to assign the partitions in a manual manner. However,\
    \ it is good for you to be aware that if you choose the entire hard disk, anything\
    \ in the disk will be deleted and replaced by Linux Mint.\n\nIf you choose to\
    \ install it alongside another operating system, the installer will make use of\
    \ the available disk space, and the rest will be left for your other operating\
    \ system. If you choose the option to partition your drive manually, then the\
    \ partition editor will be presented to you, and you will have to partition the\
    \ disk manually.\n\nOnce you have selected the option which you need, click on\
    \ the button for “Install Now.” The installer will be going in the background,\
    \ and you will be asked some of the setup questions.\n\nFrom the map, click on\
    \ the location for the city which is near to you. This will help in selecting\
    \ the time zone you are in. Adjust the time to the correct one and then click\
    \ on “Continue.”\n\nIt is now time for you to choose the kind of keyboard you\
    \ will be using. If you are not sure of your keyboard type, begin to type in the\
    \ text field which is located at the bottom. Keep observing this text field so\
    \ as to be sure that the key you type is the one which appears on it, and this\
    \ will tell you whether you have selected the right keyboard or not. Once done,\
    \ click on “Continue” button.\n\n# Keyboard layout\n\nChoose your keyboard layout:\n\
    \n| English (urania) | English (US) - English (Dvorak, international with dead\
    \ keys) |\n| English (Nigeria) | English (US) - Macintosh |\n| English (South\
    \ Africa) | English (US) - English (Programmer Dvorak) |\n| English (UK) | English\
    \ (US) - English, alternative international |\n| English (US) | English (US) -\
    \ English, international with dead keys |\n| Esperanto | English (US) - English,\
    \ with euro 5 |\n| Estonian | English (US) - Workman |\n| Faroese | English (US)\
    \ - English (Workman, international with dead keys) |\n| Finnish | English (US)\
    \ - English (classic Dvorak) |\n\nType here to test your keyboard\n\nDetect Keyboard\
    \ Layout\n\nBack\n\nContinue\n\nYou can then type in your actual name, and the\
    \ username, as well as the password. Every time that you need to use Linux Mint,\
    \ you will have to use this username and password so as to login. After the installation\
    \ of Linux Mint, you will be in a position to define other accounts if there are\
    \ other users of the system. You can also give the computer a name which will\
    \ be used for establishing network connections. Once you are through with this,\
    \ click on the “Forward” button.\n\nIf there are other operating systems in your\
    \ computer, the installer will detect them and then ask you to migrate some of\
    \ your personal information from it. If you are interested in this, just allow\
    \ it and then click on the “Continue” button.\n\nThe installation will then continue\
    \ for about 10 to 15 minutes. A progress bar will be shown so as to show you the\
    \ amount of time which is remaining for the installation to complete.\n\n# Welcome\
    \ to Linux Mint\n\nWelcome and thank you for choosing Linux Mint. This slideshow\
    \ will show you around while the system is being installed on your computer.\n\
    \n![](img/b32d4147b6351d994b4ff9c76e21a196_45_0.png)\n\nAlmost finished copying\
    \ files...\n\nOnce the installation of Linux Mint has been completed, click on\
    \ the button for “Restart Now” and your liveDVD will be shut down. You will be\
    \ prompted to eject the DVD, so just hit the Enter key and it will be removed.\
    \ The system will then boot from the Linux Mint which you have just installed.\n\
    \n# Chapter 3- Linux Mint Desktop\n\nThe Desktop refers to a part of the operating\
    \ system and it is responsible for the elements which you will see on the desktop.\
    \ These include the Wallpaper, the Panel, the menus, the Control Center, and others.\n\
    \n# Cinnamon Desktop\n\nCinnamon Linux Mint makes use of the “Cinnamon” desktop,\
    \ which is very powerful and intuitive.\n\n# Desktop Settings\n\nThe Desktop is\
    \ a menu for allowing you to change the aspects of the Cinnamon Desktop which\
    \ you will mostly be using.\n\nTo launch it, click on the “Menu” which is located\
    \ at the bottom-left corner of the screen, choose “System Settings,” and then\
    \ click on “Desktop.”\n\nLinux Mint comes in with a default Cinnamon menu. If\
    \ you need to launch the menu, click on the “Menu” button which is located on\
    \ the bottom left corner of the screen or hit the “CTRL+SUPER_L.” The SUPER_L\
    \ on your keyboard refers to the left Windows key.\n\n# “Places” Menu\n\nOnce\
    \ you choose the section for “Places,” you will be presented with five entries.\
    \ These entries will provide you with easy access to some of the places on your\
    \ Cinnamon desktop.\n\nIt is the one which will show the storage volumes which\
    \ you have in your computer. If you had mounted all the partitions in your computer\
    \ and you have set the “Desktop Settings” to show the “Mounted Volumes” on your\
    \ desktop, then there will be no need for you to access the Places on a regular\
    \ basis. However, for those who chose not to show the mounted volumes on the desktop,\
    \ or who need to do some mounting on a partition which had not been mounted before,\
    \ you will have to access this place as it is useful to you.\n\nThe “Home” place\
    \ is one of the places which will prove to be useful to you.\n\nFor those who\
    \ have been using the Cinnamon desktop in the past, you must be used to clicking\
    \ on the “Home” icon which is located on the desktop. Once you have opened too\
    \ many windows and the desktop disappears, the menu will help you to be able to\
    \ access the “Home” very quickly.\n\nThe “Home” folder provides you with a location\
    \ on your system in which you can store all the data which is personal. The “Desktop”\
    \ folder represents all the data which you have kept on the desktop.\n"
  mdcn: "\n您可以选择“启动 Linux Mint”然后按下回车键。实时系统将启动，您将看到它的屏幕。几分钟后，实时系统将准备就绪，并显示桌面。\n\n\
    请注意，此时 Linux Mint 尚未安装到您的计算机上，它仅在从 DVD 运行。然而，一旦您将其安装到计算机上，它将与您现在从 DVD 运行的完全相同。此外，您应该知道，从\
    \ DVD 运行系统会比安装在电脑上慢。这背后的原因是数据必须从 DVD 读取，而不是从速度较快的硬盘中读取。\n\n点击桌面上的“安装 Linux Mint”图标。安装程序随后将会出现。此外，多阅读一下发布说明也对您大有益，这样您就可以了解更多功能，以及如何处理可能出现的任何问题。\n\
    \n选择您需要的语言，然后点击“继续”。系统将显示一个询问您是否需要安装第三方软件的界面。这指的是那些并非完全开源但具有某些许可限制的软件。如果您需要使用这些软件，只需勾选该框然后点击“继续”。\n\
    \n在下一步下一步中，笔记本电脑用户应确保已连接到电源、互联网连接，并且有足够的磁盘空间。然后您可以点击“继续”。\n\n# 安装类型\n\n此计算机当前未检测到操作系统。您想做什么？\n\
    \n- 擦除磁盘并安装 Linux Mint\n  警告：这将删除您所有操作系统中的所有程序、文档、照片、音乐以及任何其他文件\n\n- 对新的 Linux\
    \ Mint 安装进行加密以确保安全\n  您将在下一步中选择一个安全密钥\n\n- 在新的新的 Linux Mint 安装中使用 LVM\n  这将设置逻辑卷管理（LVM）。它允许创建快照并更方便地调整分区大小\n\
