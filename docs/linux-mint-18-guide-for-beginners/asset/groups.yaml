- md: '

    Manager.


    The Update Manager works by counting only the “safe” updates. If you are told
    that your system is up to date, it only means that there are no new updates which
    have been made for the level of update which you have assigned to be safe in your
    system. The Update Manager will only have the “visible” updates in its list.


    A good example is when all of the levels have been made to be “visible,” but only
    the Levels 1 and 2 have been marked to be “safe.” In this case, a lot of updates
    will be seen in the list, and the Update Manager will be telling you that your
    system is up to date.


    The tab for “Options” gives you a number of choices by which you can alter the
    settings for the Update Manager. You will also find the option “Include updates
    which requires the installation of new packages or the removal of installed packages”
    under Options and this will allow you to specify whether the Update Manager will
    be allowed to install some new dependencies or not. It is good for you to be careful
    whenever you are using this option as, although it may help you to install some
    new dependencies, it may also remove the ones which you have already installed.


    The tab for “Auto-Refresh” will help you to define how often your Update Manager
    will be checking for updates. In the tab for “Ignored packages,” you are able
    to define the packages for which you don’t need to receive updates. The use of
    “*” and “?” is supported.


    The tab for “Icons” allows you to change the icons used by the Update Manager
    in the system tray. In case the Update Manager gives you errors, you can proceed
    to check for the issue in the logs. Go to the system array, and right-click on
    lock icon. Choose “Information,” and you will see a new screen popup.


    ## Chapter 5- Tips and Tricks


    In Linux Mint, there are ways that one can perform the simplest tasks more easily.
    This will help you save on time.


    Let us discuss some of the tips and tricks in Linux Mint which can help you do
    this.


    ## Copying and Pasting


    In most cases, Linux Mint users have to select and then right click on the text
    which they need to copy. Others also do this by clicking on the “Edit” menu. This
    is time consuming. It is possible for you to copy and then paste the text that
    you want by use of the mouse only. In this case, the left button of the mouse
    will be responsible for copying the text, while the middle button will be responsible
    for pasting the text. That is very simple and time saving!


    To demonstrate this, open a text editor or the LibreOffice Writer, or any application
    you like and which allows you to input some text. Type a few sentences into it.
    Use the left button of the mouse so as to select some of the text which you have
    just typed. Most do it by clicking on the “Edit” menu and then clicking on “Copy.”
    Others also like to use some combination of keys such as “CTRL + COPY.” Linux
    makes it simpler. By selecting a text, you will have copied it. Since you have
    already selected the text, it has been copied and kept in the “mouse buffer,”
    and there is no need for you to press any other keys.


    Click on some other part of the document so as to place your cursor there. Click
    on the middle button of the mouse. If your mouse has a wheel, just wheel-click
    while for those whose mouse has two buttons only, click the right and the left
    buttons together. You will observe that the text which you had just copied will
    be pasted.


    If you get used to doing it, copying and pasting of text in Linux Mint will become
    easy for you. This also applies to the other Linux distributions.


    It is good for you to note that the buffer which is used by the mouse is not the
    same as the one which is used by the Cinnamon desktop. This means that you can
    use your mouse to copy some text and then use the CTRL +C for copying another
    text or by the use of the “Edit” menu. This means that you will have copied two
    different items and the way you paste them will be determined by the way you copied
    them, either by use of the middle button of the mouse, the use of “CTRL + V,”
    or by use of the “Edit” menu.


    ## Taking Notes


    Everyone likes taking notes when they are using the computer. One may also need
    to write something when they are using the computer, such as something they have
    been told via a phone. These are mostly the things which one needs to remember.
    Some people usually find themselves writing such notes on applications which are
    not suitable for such tasks. A good example is launching the LibreOffice writer
    so as to write a phone number. Linux Mint comes with a tool which is suitable
    for note-taking. This is known as “Tomboy Notes.”


    The tool is very easy to use as after you have just clicked on it, it will be
    launched with all your notes. If you need to take some new notes, you just have
    to click on “Create New Note.” This will open up a new note. Once you have changed
    the title for this, you will also have changed its name. You may choose to write
    whatever you need into the note and then close it. You will then be in a position
    to access the content which you have just written by use of Tomboy Notes. There
    will be no need for you to save the note, and you can even shut down and restart
    the computer without affecting the note. The note is saved immediately as you
    type it.


    If you are done with the note and you are sure that you will not need to use it
    anymore, you can delete it by clicking on the “Delete” button. If you happen to
    write the title of a particular note in the note you are creating, then this second
    note will be opened once you have clicked on the link which will be created automatically
    by Tomboy. Tomboy Notes also allows you to use some formatting features as you
    create the note. Examples of these features include search features, synchronization,
    as well as exporting of notes to HTML, PDF, and others. That is how you can take
    notes in Linux Mint.


    ## Conclusion


    Linux Mint is one of the distributions of Linux. It is based on Ubuntu and Debian.
    With Linux Mint, one can do a lot. By now, you must be comfortable with the various
    aspects regarding the use of Linux Mint. The Linux Mint terminal can help you
    accomplish most of the tasks more easily and quickly. A good example is when you
    are performing an upgrade of your system. You can do this by use of just a simple
    command, as opposed to use of the GUI in which you will have to update each component
    of your system. To the Linux Mint beginners, the use of the command line might
    seem to a bit complex, but it is good for you to begin practicing and you will
    get used to it with time. When it comes to updates in Linux Mint, they are classified
    in the range of Level 1 to Level 5. One has to specify the level at which the
    system will be “safe.” If this is violated, then you will get a notification in
    terms of the updates which are currently available, and you will have the option
    of upgrading to that level.

