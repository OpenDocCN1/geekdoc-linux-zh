- md: '

    If you place some data on this folder, it will also be added to the desktop. You
    can also do the same by dragging your file to the desktop. The “Network” place
    is responsible for showing you the shared devices, domains, and other computers
    as well as the workgroups which are available on your computer. The “Trash” place
    is responsible for keeping the files which have been deleted.


    After right clicking on a file, you will be provided with two options, namely,
    “Delete” and “Move to Trash.” In case you select “Delete,” this file will be deleted
    permanently, but if you select “Move to Trash,” this file will simply be moved
    to the “Trash” place, and you will be able to access this from the menu. If you
    need to restore the file, it will be possible for you to drag and drop it to where
    you need. If you need to permanently delete all the items which are contained
    in the trash, you will have to choose “Empty Trash,” and the files will be deleted
    permanently.


    # “System” Menu


    The menu provides us with a number of system choices. They are good in providing
    us with quick access to the most important features of your system. It is not
    possible for any unauthorized user to access these because a password will be
    needed for you to gain access.


    ![](img/b32d4147b6351d994b4ff9c76e21a196_61_0.png)


    The button for “Software Manager” will open the Linux Mint Software Manager. It
    forms the best program for the installation of software in Linux Mint. For you
    to gain access to the system rights, you will be asked to provide a password.


    The button for “Package Manager” will open an application known as “Synaptic.”
    This package is responsible for management of the apps which have been installed
    on your computer, as well as the ones which are available in the repositories.


    The button for “System Settings” opens the Cinnamon Control Center. The app allows
    us to configure each and every aspect of the Cinnamon desktop as well as the whole
    computer in general. Let us discuss the items which are contained in this control
    center.


    The "Terminal" button opens an application named "Terminal" which allows one to
    use the keyboard for entering commands. For those used to the Windows OS, this
    might be a bit complex, as its command prompt has not progressed much. The Linux
    Mint terminal is very powerful, and it becomes too easy if one gets used to it.
    It is worth it for you to know that any command which you run via the graphical
    desktop in Linux Mint must go through the terminal. A good example is when you
    click on an icon on the desktop. In this case, Cinnamon is instructed to pass
    some textual information to the terminal. The terminal can help you achieve a
    lot with just a single command, as opposed to achieving the same by opening several
    windows.


    The button for “Lock Screen” is used for locking your screen. For you to unlock
    it, you will be prompted to enter the password. When you click on the “Logout”
    button, a popup which will allow you to logout or switch the users will be launched.


    The “Quit” button will launch a dialog box which allows you to choose what you
    need. The “Suspend” option will save your session to the RAM, and the computer
    will sleep until you have pressed a key. The "Hibernate" option will save the
    session to the hard drive, and the computer will shut down. The "Restart" option
    will restart the computer. The "Shut Down" option will turn off the computer.


    # “Applications” Menu


    A Linux Mint DVD is usually compressed, and it usually has about 3GB of data.
    The applications which come installed by default after the installation of Linux
    Mint are part of the "Default Software Selection."


    Note that Linux Mint is developed so that the users can find it easy for them
    to use it. This is why it comes with some default software installed so that the
    user can be able to accomplish some of the basic tasks. All the installed applications
    can be found on the menu’s right hand section. The apps have been organized into
    categories. The first of all the categories is known as “All applications,” and
    it will give the list of all the apps which have been installed.


    The other two categories are “Preferences” and “Administration,” and they show
    the applications and the tools which are useful for the configuration and administration
    of Linux Mint.


    In the section for “Accessories,” the following is some of the software you will
    find:


    - 1. Archive Manager- this is the tool for viewing, creating, and extracting the
    archive files.

    - 2. Calculator- this is simply a calculator.

    - 3. Character Map- this is a tool for easily copying special characters.

    - 4. Disks- this is a tool for showing how the partitioning of the hard disks
    has been done.

    - 5. Files- this is a link for opening the home directory in the Nemo.

    - 6. Font Viewer- this is a tool for looking for the available fonts.

    - 7. Help- a tool for showing a suitably formatted document which is comparable
    to this document.

    - 8. Passwords and keys- this is for management of password and the other keys.

    - 9. Screen reader- this helps us to access the graphical desktop environment,
    a refreshable Braille, or a synthesized speech.

    - 10. Screenshot- this tool helps us take screenshots. To launch it alternatively,
    you may use the “Print Scrn” key on the keyboard for taking screenshots of the
    desktop, or “ALT” + “Print Scrn” if you need to take screenshots of the current
    window.

    - 11. Terminal- this will open the terminal.

    - 12. Text Editor- this is the Gedit, which is a text editor.

    - 13. Tomboy Notes- this is an application to allow you take notes.

    - 14. USB Image Writer- this is a simple tool which helps us write ISO images
    to the USB drive.

    - 15. USB Stick Formatter- this is a simple tool for cleaning and formatting a
    USB drive.


    The “Education” section provides the following:


    - 1. LibreOffice Math- this is for creating and editing scientific formulas and
    equations.


    The “Graphics” section will provide you with the following software:


    - 1. GIMP Image Editor- this is an application which will allow you to modify,
    create, or convert pictures. It can be seen to be the same as Photoshop in Windows.

    - 2. Image Viewer- this refers to the Gnome Image Viewer.

    - 3. LibreOffice Draw- this is a graphics application.

    - 4. Pix- this is an application for viewing and organizing images.

    - 5. Simple Scan- this is a tool for capturing images from the scanner.


    The “Internet” section will have the following software:


    - 1. Firefox Web Browser- this is a web browser.

    - 2. Hexchat- the IRC chat system. This has been configured so that it can connect
    you to the Linux chat room by default. It is good for those who need to communicate
    with Linux Mint users.

    - 3. Pidgin Internet Messenger- this is an Internet messenger. This can be connected
    to AIM, Gadu-Gadu, Google-Talk, Bonjour, GroupWise, ICQ, IRC, MySpaceIM, QQ, MSN,
    SIMPLE, XMPP, Yahoo, Sametime, and Zephyr

    - 4. Thunderbird Mail- an application for Email.

    - 5. Transmission- a torrent client.


    The following is the software you will find in the “Office” section:


    - 1. Document Viewer- this is a tool for viewing PDFs as well as other documents.

    - 2. LibreOffice- this is a general starter for the office suite.

    - 3. LibreOffice Base- a database application.

    - 4. LibreOffice Calc- this is a spreadsheet application, similar to Excel in
    Windows, and is compatible with XLS.

    - 5. LibreOffice Draw- this is a graphics application.

    - 6. LibreOffice Impress- an application for making slides for presentation. Similar
    to PowerPoint in Windows.

    - 7. LibreOffice Math- a tool for creation and editing of mathematical formulas.

    - 8. LibreOffice Writer- a word processor, similar to Microsoft Word in Windows.


    The following is the software to find in the section for “Sound & Video”:


    - 1. Banshee- this is a music application for playing online radio, and streaming
    online music services from the Internet. It will also allow you to listen to your
    music you have kept in

