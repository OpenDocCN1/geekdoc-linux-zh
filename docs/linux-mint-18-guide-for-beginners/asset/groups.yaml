    +   4. VLC media player- this is a video player, and is capable of playing almost
    all types of videos which are'
  - '[PAGE 87]


    available on the web.


    # The “Search” Field


    This is a feature which will provide you with access to an item which you have
    forgotten where you can find it, or the one you want to access quickly. You just
    have to click on the Menu which is located on the bottom-left corner of your'
  - '[PAGE 88]


    screen and then begin to type the name of the application which you are looking
    for. As you continue to type, only the applications which match the words you
    have typed will be visible on the menu.


    This menu will also allow you to define some of your favorite applications and
    then keep them on a special menu so that they can be accessed easily. From the'
  - '[PAGE 89]


    menu, right click on the application which you like and then choose “Add to favorites.”
    Also, you may have to choose “Remove from favorites.” The part with the favorites
    will be shown on the left of the menu. It is also possible for you to organize
    how these elements are laid out. You just have to drag and then drop them, and
    they will be reorganized in the order that you like.'
  - '[PAGE 90]


    # Making Shortcuts


    For those who don’t like or are not interested in having the “favorites” section,
    you can achieve a quick access to the elements from the desktop or the panel.
    Simply right click on the application you want and then select “Add to Panel,”or
    “Add to desktop.”'
  - '[PAGE 91]


    # # Changing Menu Appearance


    There are a number of ways that you can customize the menu. Just right click on
    the “Menu” and then choose “Configure.” You will see the configuration tool for
    the menu will be presented. You will be given a chance to modify the aspects of
    your Cinnamon'
  - '[PAGE 92]


    menu.'
  - '[PAGE 93]


    # Restoring Default Settings


    If you need to get back to the default settings, from the configure menu, just
    click on the button which is located on the right of “Remove” and then select
    “Reset to defaults.”


    # Automatic Launch of Applications'
  - '[PAGE 94]


    The application named “Startup Applications” can be found under the Preferences.
    It is possible for you to add an application here. The menu editor can provide
    you with the right information which you need for the application. If you do this,
    the application will be launched automatically whenever you start the PC. If you
    need to disable this,'
  - '[PAGE 95]


    you just have to deselect the app.'
  - '[PAGE 96]


    # Chapter 4- Software Management


    # Package Management


    For those who are using Linux Mint for the first time, you may not be aware of
    how to organize your software into a “package.” This is a very good feature'
  - '[PAGE 97]


    when it comes to security and the ease of access.


    Linux Mint has been made in such a way that any hardware attached will be automatically
    detected and all the drivers are automatically installed. It has also been made
    possible for the user of Linux Mint to be in a position to do most tasks without
    having to look for any third'
  - '[PAGE 98]


    party software. The installation of Linux Mint also comes with a fully working
    office suite, a quality and professional image editing solution, IRC and IM clients,
    several media players, a disk burner, and many other useful accessories. These
    are all free software!


    There are a number of problems when you are looking for software to use on'
  - '[PAGE 99]


    your Linux system from third party websites. First, it becomes difficult for you
    to know whether the software has been tested and that it has been proved to be
    compatible with your operating system. Also, it is difficult to know whether the
    software will be compatible and then work as you expect with the rest of the software
    in your system. The software might also be coming from an'
  - '[PAGE 100]


    unknown developer, and you are not sure whether the software will harm your computer
    or not.


    You may be downloading and installing multiple and different programs from different
    vendors. However, the problem with this is that you will lack a managerial structure
    in your system. Also, it is good for you to come up with'
  - '[PAGE 101]


    a plan on how you will ensure that the pieces of software you are downloading
    onto your system will be kept up to date. Sometimes, you may get tired with a
    certain program. How will you get rid of the program? Some software programs do
    not offer options for removing them once they have been installed, and even if
    they may come with it, the program will not be fully removed from the'
  - '[PAGE 102]


    system. What this means is that after you ran the installer for this program on
    your computer, it took some control of your computer, not forgetting that the
    program was written by a stranger.


    In such a circumstance, the software which has been distributed in such a manner
    becomes static. This means that you will have to first download the'
  - '[PAGE 103]


    program itself, and then the data libraries which are necessary for it to run.
    The developer of the program is now aware of the software and libraries which
    you have installed on your system.

    This means that for them to make sure that you run the program successfully on
    your system, they have to supply the program itself as well as the data libraries
    to you. The download itself'
  - '[PAGE 104]


    will be too big, and whenever you need to update it, you will have to do it or
    the program itself as well as for the rest of the libraries. This will also be
    done separately as opposed to doing it at once. This means that with distribution
    of the static software on your system, there will be the duplication of unnecessary
    work.'
  - '[PAGE 105]


    In Linux Mint and other Linux distributions, package management has been used
    for long and it is the best method for management of software and sorting out
    of these issues. It provides a safe and automatic installation of software.'
  - '[PAGE 106]


    # The Software Manager


    This provides us with the easiest way for installation and management of software.
    This is built on top of package technology but makes everything easy for us as
    it allows us to install the individual programs rather than the packages. However,
    it is good for you to be aware that this uses the package'
  - '[PAGE 107]


    technology in the background, meaning the same benefits will be provided.


    To use it, launch the Menu and then click on “Software Manager.” The Software
    Manager will allow you to browse for the software which is made available for
    Linux Mint. The browsing can be made by category, the search made by keyword,
    or the software can be rated'
  - '[PAGE 108]


    based on popularity or by rating.'
  - '[PAGE 109]


    # Synaptic & APT


    If you need to install more than a single app or you need something which is not
    provided in the Software Portal or in the Software Manager, there are two other
    ways which are provided by Linux Mint for installation of the software. These
    include the “Synaptic,” which is a graphical tool and the “APT,” which is a'
  - '[PAGE 110]


    command line tool. We will demonstrate how these can be used for installation
    of Opera:


    Begin by opening the Menu and then clicking the “Synaptic Package Manager.” Click
    on the button for “Search,” and then type in “Opera.” A list of packages will
    then be presented to you. Navigate through this list so as to'
  - '[PAGE 111]


    identify the one which corresponds to the Opera web browser and then click on
    it. Tick the box which corresponds to this option, and then choose “Mark for Installation.”
    Lastly, click on the “Apply” button.


    To do the same by use of the APT command line tool, follow the steps given below:'
  - '[PAGE 112]


    Begin by opening the menu, and then click on “Terminal.” Type the command given
    below:


    ```

    apt install opera

    ```


    However, you should ensure that you have closed the synaptic before you can begin
    to use the APT. This is because the'
  - '[PAGE 113]


    synaptic usually uses the APT in the background, meaning that it is impossible
    for you to run the two simultaneously. The same will apply for the software manager.


    As you must have noticed, the use of the APT is much easier, but it does not provide
    a graphical user interface. If you are a Linux beginner, you may prefer to'
- md: '

    do things via the graphical user interface, but with time, you will appreciate
    the power of the terminal and how it makes things easy and fast for you. Sometimes,
    you may also find it impossible for you to access the packages which belong to
    a particular application.


    The difference with the Software Manager is that it allows you to install the
    applications by obtaining the packages which are right for you. This will not
    be done from the repositories (packages databases) which the APT and the Synaptic
    are able to access as well as from the other places which can be found from the
    Internet.


    The Software Manager can be used mainly for two reasons:


    - 1. If you are not used to the use of APT or the Synaptic.

    - 2. If the application you need to install cannot be accessed from the APT or
    the Synaptic.


    ## Removing Applications


    The APT is one of the easy ways we can use so as to remove applications. Also,
    this is the command line, and it makes things easy for us as you are going to
    see. Remember that we had installed the Opera web browser in our system. Let us
    try to remove this via the APT. Open the menu and then click on Terminal. Type
    the following command on the terminal:


    ```

    apt remove opera

    ```


    Again, before you can use the APT, ensure that you have closed the Synaptic. This
    is because the Synaptic is using the APT in the background, and it will be impossible
    for you to make use of the two.


    With execution of the single command given above, Opera will have been uninstalled
    from your system.


    ## Synaptic


    Synaptic can also be used for the purpose of uninstalling packages. Let us demonstrate
    how one can achieve this.


    Begin by opening the menu and then clicking on “Package Manager.” Click on the
    button for “Search” and then type in “Opera.” You can then navigate through the
    list which is provided, and then find the option which is corresponding to the
    Opera web browser which we installed earlier on. Tick the box which corresponds
    to this option, choose “Mark for Removal,” and then click on the “Apply” button.


    ## Updating System and Applications


    After a new version of a package you have installed on your computer has been
    made, it is possible for you to upgrade it to the new version. The update can
    be in the form of a security update to a component of your operating system, or
    the optimization of a specific library or you may need to update to some new version
    of the Firefox browser.


    The Linux Mint system is made up of packages, and the update to this system can
    be done by updating any part of these packages. Once you do, the old package will
    be replaced with the new package.


    In Linux Mint, a number of ways exist that one can update their packages, but
    we recommend that you use only one of those ways.


    The APT can be used for upgrading the system by use of a single command which
    is “apt upgrade” but this is not recommended. The problem with this is that no
    distinction will be made on what you need to upgrade, and everything in your system
    will be upgraded.


    You should note that some of the parts of the system are up to date while the
    others are not. Consider the situation in which you upgrade your kernel, which
    is the part which directly communicates with the hardware. If you do this, your
    sound support might be broken, the support for the wireless card as well as the
    other applications like the VirtualBox and the VMWare as they are closely connected
    to the kernel.


    ## The Update Manager


    The Update Manager is a tool which comes with Linux Mint. It is responsible for
    providing the user with information regarding updates, and the user is also allowed
    to specify how secure an update should be before it can be applied. This means
    that it works to shield you from security vulnerabilities.


    If the mouse pointer is placed on top of this, then you will be informed of whether
    your system is up to date or not, and the number of updates which are available.


    ## Welcome to the Update Manager


    This tool provides your operating system with software and security updates.

    Please choose an update policy.


    - **Don''t break my computer!** Recommended for novice users. Only select updates
    which are known to be safe or which do not impact critical parts of the operating
    system. Don''t show me updates which can harm the stability of my system.

    - **Optimize stability and security** Recommended for most users. Only select
    updates which are known to be safe or which do not impact critical parts of the
    operating system. But also show security and kernel updates.

    - **Always update everything** Recommended for experienced users. Select all available
    updates. Keep my computer fully up to date. If a regression breaks something,
    I''ll fix it.


    Once you have clicked on the icon for lock, the Update Manager will be opened
    and for the first time, you will be asked for the update policy which you need.
    You should then read through the available options and then choose the best one
    for you.


    The majority of the users of Linux Mint like to have their software up to date,
    and they like to use the second option. However, for those who need the computer
    to work and then get all updates which are needed, you should choose the first
    option.


    You will then be presented with the real update screen. You will also be asked
    whether you need to switch to some local mirror for the updates. Throughout the
    world, organizations exist which need to help Linux Mint in distributing updates
    to the world so that the users are able to get the best experience when using
    Linux Mint. For you to get the fastest updates, it will be good for you to choose
    the mirror which is near you. If you don’t need to use a local mirror, then it
    is possible for you to change this below the Edit-Preferences.


    The Update Manager will show you the updates which are available. The interface
    will be very easy for you to use. For each update done on the package, you will
    be in a position to read the description, changelog which describes the changes
    which are made by the developers. If there are warnings from Linux Mint regarding
    the updates, you will also see the same. It is also possible for you to see the
    version which you have on your computer, as well as the one which you should update
    to. A symbol will also be shown, and this will specify whether it is a security
    or a package update.


    The stability level which has been assigned to the package update will also be
    shown. Each update to the package usually brings some improvements or fixes to
    the security issues, but sometimes, bugs may occur. Linux Mint also assigns the
    stability level to each of the packages, and informs one of how safe they will
    be once they have applied the update.


    It is possible for you to click on the columns and then sort them by status, stability
    level, version, or package name. The “Clear” and “Select All” buttons can be used
    for selecting or unselecting all the updates.


    Both the Level 1 and the Level 2 updates are risk free, which means that you can
    go ahead and apply them. The Level 3 updates are expected to be “safe,” and you
    should ensure that you have checked for them from the list of the updates. Whenever
    you experience any problem with a Level 3 update, it will be good for you to inform
    the Linux Mint development team so that the update can be made a Level 4 or Level
    5 and others will be discouraged against applying it as a Level 3 update.


    Choose Edit, Preferences, and then Level and you will see the screen given below:


    ![](img/b32d4147b6351d994b4ff9c76e21a196_138_0.png)


    The default setting is that the Update Manager tells you more about the Level
    1, 2 and 3 updates. One is free to make a decision on whether to make the Level
    4 and Level 5 updates visible. If this is done, then more updates will appear
    on the list. It is also possible for you to make the Level 4 and the Level 5 updates
    to be “safe” if you want. However, this is not recommended, as doing that will
    cause the selection of these to be automatic on the Update

