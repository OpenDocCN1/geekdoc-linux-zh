    另外两个类别是“偏好”和“管理”，它们显示了用于 Linux Mint 配置和管理的实用程序和工具。


    在“工具”部分，你会找到以下部分软件：


    - 1. 归档管理器-这是一个查看、创建和提取归档文件的工具。

    - 2. 计算器-这仅仅是一个计算器。

    - 3. 字符映射表-这是一个用于方便复制特殊字符的工具。

    - 4. 磁盘-这是一个显示硬盘分区情况的工具。

    - 5. 文件-这是一个在 Nemo 中打开主目录的链接。

    - 6. 字体查看器-这是一个查找可用字体的工具。

    - 7. 帮助-一个显示格式良好的文档的工具，与本文档类比。

    - 8. 密码和密钥-这用于管理密码和其他密钥。

    - 9. 屏幕阅读器-这帮助我们访问图形化桌面环境、可刷新盲文或合成语音。

    - 10. 截图-此工具帮助我们截屏。要替代启动它，你可以使用键盘上的“Print Scrn”键截取桌面屏幕，或者如果你需要截取当前窗口屏幕，可以使用“ALT”
    + “Print Scrn”。

    - 11. 终端-这将打开终端。

    - 12. 文本编辑器-这是 Gedit，一个文本编辑器。

    - 13. Tomboy 笔记-这是一个让你记笔记的应用程序。

    - 14. 镜像写入器-这是一个帮助我们将 ISO 镜像写入 USB 盘的工具。

    - 15. U 盘格式化-这是一个格式化 USB 盘的简单工具。


    “教育”部分提供了：


    - 1. LibreOffice Math-用于创建和编辑科学公式。


    “图形”部分将为你提供以下软件：


    - 1. GIMP 图像编辑器-这是一个允许修改、创建或转换图片的应用程序。它可以类似于 Windows 中的 Photoshop。

    - 2. 图片查看器-指的是 Gnome 图片查看器。

