- pgno: 87
  md: '+   - Class D, 224.0.0.0 and 239.255.255.255 are unavailable. You might notice
    that the multicast class has no host addresses. None are needed. Multicast entirely
    consists of channels that machines with their own addresses join and leave.


    Another set of network addresses that must be removed is the combined private
    IP networks. These addresses are specifically set aside for internal use and never
    point to a machine out on the Internet. Table 4.2 outlines these address ranges.
    Note that the table shows entire networks that have been reserved.


    # Table 4.2 Reserved Private Networks, for Use in Intranets and Other Isolated
    Networks


    | Class | Start | End |

    | --- | --- | --- |

    | A | 10.0.0.0 | 10.0.0.0 |

    | B | 172.16.0.0 | 172.31.0.0 |

    | C | 192.168.0.0 | 192.168.255.0 |

    | D | 239.0.0.0 | 239.255.255.255 |


    It’s not just network addresses that get removed from the available-for-use pool.
    There are host addresses that cannot be used as well. While the host portions
    of the IP addresses were able to be left blank in the network discussions to isolate
    the network addresses, it’s a bit trickier to do this but use real network numbers
    for a host discussion. So we will use x’s for the network portion so we can refer
    only to the hosts, because what we’re saying about the hosts applies to all networks.
    Each of the unavailable host addresses has a special purpose:


    +   - The host address x.x.x.0 is reserved to refer to the network itself.

    +   - The host address x.x.x.255 is the broadcast address or the "host" TCP/IP
    sends data to when it wants to send something to all network members.

    +   - Believe it or not, that’s it. Sort of. When we get into subnetting in the
    section "Applying IP v4 Addressing Across Subnets" in just a moment, we begin
    losing even more host addresses.


    Let’s not forget the issue of the network mask, or netmask, either. When you’re
    dealing with one piece, intact networks, the netmask does not change. It is always
    as you see in Table 4.3.


    # Table 4.3 Standard Netmasks for Each IP Address Class


    | Class | Netmask |

    | --- | --- |

    | A | 255.0.0.0 |

    | B | 255.255.0.0 |

    | C | 255.255.255.0 |

    | D | 255.255.255.255 |'
