    # tcpdump Example


    As mentioned in the traceroute section, the traceroute command deserves closer
    examination, and tcpdump is the perfect tool to see the command in action. For
    this example assume three nodes: the source (192.168.1.254), the first router
    (10.1.1.254), and the final destination router (10.2.2.254).


    For this example, we will use ICMP as opposed to UDP to send the traceroute to
    the destination router:


    ```

    [root@lefty /root]# traceroute -In 10.2.2.254

    ```'
