- pgno: 214
  md: 'destination. The destination is followed by the port number (telnet here) xxxx,
    followed by the window size. The (DF) signifies that the do not fragment bit is
    set, so routers between the source and destination should not fragment the IP
    datagram into smaller frames during transmission.


    # -n


    Like the arp -n parameter, tcpdump also uses the -n to not perform name resolution
    on the names. Generally, -n should be used because using name resolution creates
    an additional load on the node and network as tcpdump tries to resolve IP addresses
    it is examining. Here is an example of using -i with the -n parameter.


    ```

    [root@lefty /root]# tcpdump -i eth0 -n

