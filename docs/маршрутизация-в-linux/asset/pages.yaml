  md: '# About the Technical Reviewers


    These reviewers contributed their considerable hands-on expertise to the entire
    development process for Linux Routing. As the book was being written, these dedicated
    professionals reviewed all the material for technical content, organization, and
    flow. Their feedback was critical to ensuring that Linux Routing fits our reader''s
    need for the highest-quality technical information.


    Brad Harris has been involved in the IT industry for six years, beginning with
    his work with the Department of Defense developing biometrics models. He continued
    his work with DODD penetrating and attacking medium and high assurance networks.
    He has an extensive background in networking protocols, operating system internals,
    and various programming languages. His strengths include security analysis, vulnerability
    and exploit discovery and creation, reverse engineering, and securing systems
    and networks. He is currently a senior software engineer for ACS, Inc., where
    he specializes in vulnerability development and system/network penetration.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_12_0.png)


    Joseph Hamm is a freelance technology consultant with experience in engineering
    and deploying IP-based communications solutions. The past year Joseph has focused
    on design and deployment of Cisco VoIP solutions including network and cable plant
    implementation, gateway configuration, dial plan construction, and call processing
    system implementation. At this time, Joseph is spending the majority of his time
    researching and writing about the evolution of computing platforms and operating
    systems.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_12_1.png)'
