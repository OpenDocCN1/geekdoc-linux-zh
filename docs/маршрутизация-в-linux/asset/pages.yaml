- pgno: 22
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_22_0.png)


    # 1


    # Unicast Protocols


    MANY PEOPLE HAVE ONLY A VAGUE IDEA of what routing is and how it works. When the
    knowledgeable Linux user or novice system administrator thinks of routing, he
    or she thinks of it in terms of a black box that takes chunks of data, looks at
    where the data is trying to go, and sends the data happily skipping along in the
    right direction. This in some ways is not far from the truth.


    A router is basically a traffic director. When data travels throughout IP networks,
    as well as in many other kinds of networks, many different paths are usually available
    for it to take. Data is bundled in packets—the individual units of data that are
    sent over an IP network. In general, a router’s job is to choose the current best
    path for the packet to follow to get to its destination.


    Exactly how the router makes this decision is determined by the routing protocol
    used. Each protocol has its own way of keeping track of what paths are available
    and which are the most efficient. A unicast routing protocol, in particular, sends
    information directly to the other routers it is configured to talk to. This class
    of protocols is a solid choice for networks where bandwidth is at a premium. You
    must, however, be very careful to ensure that all routing protocols know what
    routers they are supposed to talk to.


    If you want to get right into how to set things up, you can proceed to Chapter
    10, "Planning Basic Router Layout and Function" and go from there. However, it’s
    important that you understand the protocols enough to make an educated choice
    that best suits your networking needs.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# The Example Network


    It’s easier to follow a theoretical discussion if there is a real world example
    thrown into the mix. For this purpose, I have added a sample network that you
    can refer back to throughout Linux Routing.


    The Internet is one huge IP network. As you probably already know, every machine
    on such a network has its own IP address in the format, xxx.xxx.xxx.xxx, except
    in cases where private addressing schemes are used, such as 192.168.xxx.xxx and
    10.xxx.xxx.xxx. However, the entire Internet is a bit large to use in the discussion
    here. Instead, I’ll define a smaller network set to work with while learning how
    specific routing protocols work. I will then use this same example network in
    the chapters where things are actually set up. The starting point will be the
    Linux machine, “Red,” which has the private range IP address, 192.168.15.10.


    A lone machine, of course, is not in and of itself a useful or interesting network.
    Perhaps this Linux box is on the mixed-operating system LAN presented in Figure
    1.1, having the private class C address space 192.168.15.0 all to itself. Which
    operating systems these machines are running doesn’t matter at this point. Many
    people don’t realize that any operating system that natively speaks TCP/IP (most
    modern operating systems) can share a TCP/IP Ethernet connection with any other
    operating system without a problem. It’s sharing data and files that causes the
    headache.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_23_0.png)


    Figure 1.1 The Linux box, Red, within the network 192.168.15.0.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'When an application tries to send or retrieve data within the network, for
    example when sending data from our starting point at Red to Teal (both Linux machines),
    a routing protocol is unnecessary. Machines within the same subnetwork or unsubnetted
    network use other techniques to find each other. It’s when you pass outside of
    that subnet or unsubnetted network that routing becomes an issue.


    Now, to connect this network to a larger set of networks you add a new network
    card with the address 192.168.15.1 to the machine, Orange, as shown in Figure
    1.2. These two separate network interfaces are absolutely necessary when you start
    spanning from one subnet or unsubnetted network to another, whether the interfaces
    are physical or virtual. In this case, one (192.168.15.1) connects to the Internet.
    The other (192.168.15.2) connects to the internal network.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_24_0.png)


    Figure 1.2 The network 192.168.15.0 connected to the other networks in the office.


    These simpler structures will be needed later for setup discussions, but this
    book is about routing with Linux, therefore a larger example is required—something
    that actually requires routers. Next, this LAN will be connected to the machine,
    Emerald, in another part of the building as shown in Figure 1.3.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_25_0.png)


    # Figure 1.3 The main LAN connecting to Emerald elsewhere.


    Now we''re starting to get somewhere! Emerald is on an entirely different network
    than Red—192.168.90.x instead of 192.168.15.x. Routers become necessary as you
    start crossing network boundaries. The data has to know how to get to each network
    and subnet.


    An overall network at any location may consist of a single LAN with an internal
    class C, such as our 192.168.90, or it may be a collection of smaller networks
    and subnetworks. If the network is connected to the Internet, as most seem to
    be these days, it connects somewhere along the way to an Internet Service Provider
    (ISP). An ISP may have tens, dozens, hundreds, or even thousands of networks and
    machines directly attached to it. Many of these networks also might have their
    own subnetworks and lead to yet more networks, perhaps even through a backup link
    to another ISP with its own collection of thousands of networks.


    Imagine that you have a packet that needs to get from "here" to "there." How fast
    or slow this data travels does not matter. How geographically far it needs to
    go does not matter. The only thing that matters is network boundaries. At the
    moment that a packet must cross from one subnetwork or unsubnetted network to
    another, it needs help knowing where to go.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Let’s take a look at how this works. One day you send data from Red to a machine
    named Abacus out on another of your networks. A name lookup tells TCP/IP that
    the packets need to go from 192.168.15.10 (Red) to 192.169.13.9 (Abacus). Your
    packet reaches 192.168.90.26 (Emerald), and the only information this packet has
    associated with it is that it needs to go to 192.168.13.9. The packet itself has
    no idea whether the network 192.168.13 is in your collection of networks, attached
    to someone else on the same ISP, on another ISP, where it is physically in the
    world, or where it is in the overall structure of all of the networks in the world.
    That is not a packet’s job in TCP/IP. Other machines, protocols, and tools handle
    how to make the trip.


    Fortunately, Emerald is one of these special tools—a router. The routing protocol(s)
    it uses are not important at the moment and will change throughout the discussion
    of routing protocols in this chapter and the next. Regardless of the protocol
    used, each one decides how to give this packet a customized roadmap. Figure 1.4
    rounds out the structure needed for the examples, adding a few routers in the
    middle along with the end destination. This example is set on a fictitious campus
    with Emerald as a department router within the Chem building and Abacus as a departmental
    router in the Math building.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_26_0.png)


    # Figure 1.4 The path from Emerald to Abacus, with the main building routers in
    between.


    The physical connections between each of these routers, as outlined in Table 1.1,
    are going to become important as we discuss how the protocols work.


    | Table 1.1 Hardware Between Each Point in the Example Network |

    | Start | End | Connection Type | Speed |

    | Emerald | Hum | ISDN dual channel | 128Kbps |

    | Hum | Phys | T1/DS1 full 24 channels | 1.54Mbps |

    | Hum | Chem | T1/DS1 full 24 channels | 1.54Mbps |

    | Hum | Arts | DSL | 3Mbps |

    | Chem | Math | ISDN single channel | 64Kbps |'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Table 1.1 Continued


    | Start | End | Connection Type | Speed |

    | Phys | Arts | T3/DS3 | 44.736Mbps |

    | Arts | Math | T3/DS3 | 44.736Mbps |

    | Arts | Eng | T3/DS3 | 44.736Mbps |

    | Eng | Ag | T1/DS1 full 24 channels | 1.54Mbps |

    | Math | Ag | T1/DS1 full 24 channels | 1.54Mbps |

    | Ag | Abacus | ISDN dual channel | 128Kbps |

    | Math | Abacus | modem | 56Kbps |


    # Static Routing


    The simplest form of data routing is static routing. You’ve probably used it,
    even though you may not recognize the term. In static routing, you create a routing
    table that simply stays as it is until you tell it to change. There is no attempt
    by the software to ensure that the routers listed remain valid or to watch for
    any changes in the network topology. You have to do it all by hand.


    Static routing, however, is only useful in limited situations. Because you have
    to maintain a separate static table on each machine involved manually, you can
    probably imagine how much work it requires to make any form of changes in a large
    network. This problem is made worse when you are pressed for time, for example
    when you are trying to alter the tables to route around connectivity problems.


    Static routing under Linux involves assigning route information with the route
    command and is covered in almost all Linux books that include networking skills.
    This command is covered more in depth in Chapter 6, “Inside the Multicast Kernel
    2.2.x Daemons,” and the routed daemon that goes with it in Chapter 5, “Inside
    the Unicast Kernel 2.2.x Daemons.”


    # Routing Information Protocol Version 1 (RIP-1)


    The Routing Information Protocol (RIP) was the first of the TCP/IP routing protocols
    used on what is now the Internet. There are two versions of this protocol available
    today: RIP-1 and RIP-2. Both of these versions are still important in today’s
    routing schemes—the first for backward compatibility and the second because of
    its broader range of capabilities.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# The Algorithm


    Let’s separate out the algorithm behind RIP-1 from the protocol itself for a moment.
    RIP-1 uses a distance vector algorithm to determine where to send packets, and
    a number of newer routing protocols have followed suit. To be specific, RIP-1
    uses the Bellman-Ford algorithm to make its computations. This algorithm begins
    with the source location, which is a single point when we ignore the routing aspect.
    It assigns the distance from the source point to itself as zero. The distance
    to all other points is assumed to be infinite.


    The major assumption applied is that there is at least one way to get from any
    point in the system to the source point; no points are completely isolated from
    the source. Furthermore, the path to the source point ends when it reaches the
    source point. It does not travel through it, around some more, and then back.
    It also cannot travel the same path twice.


    The goal of this algorithm is to find the shortest total travel distance from
    any single point to the source point. Bellman-Ford works in iterations. To start,
    take a look at the graph points in Figure 1.5 (you should recognize these from
    Figure 1.4).


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_28_0.png)


    Figure 1.5 Graph points for Bellman-Ford algorithm demonstration.


    The algorithm maps the path from the remote points to the source points for each
    iteration using a specific number of jumps and the distance for each jump. Iteration
    one results in Figure 1.6.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_29_0.png)


    # Figure 1.6 First Bellman-Ford iteration for the specified graph.


    The moment you get past just one jump, you have to start looking for more than
    just the correct number of iterations. In each case, the total distance must be
    as short as possible from the destination point to the source point. As you get
    into two jumps (Figure 1.7), three jumps (Figure 1.8), and more, you refine the
    determination of what exactly is the fastest way to get from any point to the
    source point.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_29_1.png)


    # Figure 1.7 Second Bellman-Ford iteration for the specified graph.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_30_0.png)


    # Figure 1.8 Third Bellman-Ford iteration for the specified graph.


    Examine these first three iterations only for now. Table 1.2 outlines the total
    distance it takes to get from each point to the source per iteration, using the
    point labels shown in Figure 1.5.


    # Table 1.2 Breakdown of Travel Distances for Three Bellman-Ford Iterations


    | Point | Iteration 1 (m) | Iteration 2 (m) | Iteration 3 (m) |

    |---|---|---|---|

    | Ag | 21 | 95 | 147.5 |

    | Eng | 59 | 56.5 | 147.5 |

    | Phys | 108 | 106.5 | 106.5 |

    | Hum | 134 | 133.5 | 137.5 |

    | Arts | 74 | 87 | 97.5 |

    | Chem | 112 | 106 | 146 |

    | Math | 55 | 108.5 | 121.5 |


    Notice the wildly varying results in this table. In some cases, the shortest distance
    is one jump. In others, it''s two. None in this example benefit from three iterations,
    although Phys comes close. This is not always the case, however. It really depends
    on the spread of the points. Completing the example would require four more iterations,
    a total of seven, just as there are seven points not counting the source point.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Of course, RIP-1 uses this algorithm from the perspective of TCP/IP routing.
    When you are trying to find the fastest way to get from “here” to “there” from
    a routing point of view, distance is not the only factor to consider. Another
    important issue is that of how long it takes the data to travel from connection
    to connection. The shortest physical distance is not always the fastest route.


    Rather than referring to a purely physical distance between points A and B, the
    distance in RIP-1 is a weight value defining how long it will take information
    to travel if it jumps between the two points in question. Originally, all distances
    were listed as one. This is meant as a hop count—with each router the data must
    pass through being one “hop.” Distances used today are more varied, with the number
    being slightly higher for cases where data has to travel along a very slow connection
    to get to the next point or other reasons that might cause delays.


    Let’s return to Figure 1.8 from the example network and the data in Table 1.1.
    The first thing you might do is go through this table and assign the distance
    or cost of traveling between each of the points. One example of what you might
    end up with is shown in Figure 1.9.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_31_0.png)


    # Figure 1.9 RIP-1 speed factors applied to the example network.


    There are two things to notice here. First, there is not a path from every point
    to every point as there would be in the raw Bellman-Ford algorithm. The only valid
    paths are the ones where there are physical connections in place. Second, notice
    that distances are not assigned exactly according to speed. Anything at least
    the speed of a T1 line received a one, and from there down the costs increased.
    A number of approaches can be taken when assigning distances. This is just one
    of them.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'travel, from Emerald to Abacus. Using the Bellman-Ford algorithm, iterate using
    the number of jumps. There is no single-jump direct route available. Neither is
    there a two-jump route, nor a three, but there are four-jump paths:


    +   A) Emerald → Hum → Chem → Math → Abacus

    +   B) Emerald → Hum → Arts → Math → Abacus


    There are also five-jump paths:


    +   C) Emerald → Hum → Phys → Arts → Math → Abacus

    +   D) Emerald → Hum → Chem → Math → Ag → Abacus


    Six-jumps paths:


    +   E) Emerald → Hum → Phys → Arts → Eng → Ag → Abacus

    +   F) Emerald → Hum → Phys → Arts → Math → Ag → Abacus

    +   G) Emerald → Hum → Arts → Eng → Ag → Math → Abacus


    Seven-jump paths:


    +   H) Emerald → Hum → Chem → Math → Arts → Eng → Ag → Abacus

    +   I) Emerald → Hum → Phys → Arts → Eng → Ag → Math → Abacus


    And, finally, the eight-jump path:


    +   J) Emerald → Hum → Chem → Math → Arts → Eng → Ag → Math → Abacus


    Table 1.3 lays out the cost of each of these paths. As you can see, the quickest
    path for this packet to follow is B—with C, E, and F all good second choices.
    Notice what a difference the weighted values make. If every hop were worth one,
    as they were originally, you would always go with either A or B, while A is among
    the third longest “distances” the data can travel.


    # Table 1.3 Travel Cost for Example Network Using Bellman-Ford


    | Jump | Values | Total |

    |---|---|---|

    | A | 2+1+3+3 | 9 |

    | B | 2+1+1+3 | 7 |

    | C | 2+1+1+1+3 | 8 |

    | D | 2+1+3+1+2 | 9 |

    | E | 2+1+1+1+1+2 | 8 |

    | F | 2+1+1+1+1+2 | 8 |

    | G | 2+1+1+1+1+3 | 9 |

    | H | 2+1+3+1+1+1+2 | 11 |

    | I | 2+1+1+1+1+1+3 | 10 |

    | J | 2+1+3+1+1+1+1+3 | 13 |


    One thing to be aware of with RIP-1 is that you cannot have more than fifteen
    jumps if you use the value of one per jump rule. This protocol is not designed
    to carry data for longer distances than that. We hit the limit just in this one
    small example. With some of the jumps weighted higher than one, the largest total
    we get here is 13.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'You might wonder then what use this protocol is if it cannot handle more than
    15 jumps or a value of 15 total cost. RIP-1 is not used to handle the majority
    of Internet traffic. Its purpose is to work within network groups, such as an
    office building or campus with complex network structures, where RIP-1 is there
    only at the most local levels.


    RIP-1 is also often the least common denominator protocol. While you may have
    no specific reason to use this protocol for your own needs, you may need your
    routers to be able to communicate with outside routers that do not use your primary
    choice of routing protocols. RIP-1 is often considered a kind of insurance policy
    in these situations.


    A router running RIP-1 keeps its data in a routing table. This table stores information
    on:


    +   - **Network gateways.** Machines containing more than one network interface
    (such as an Ethernet card or using an IP with an alias under Linux), with each
    interface leading to a different subnet or network.

    +   - **Routers.** The traffic directors on the Information Superhighway.

    +   - **Hosts.** Individual machines that require special mention, such as remote
    machines in a WAN or VPN.


    The router then occasionally sends copies of its routing tables to its direct
    neighbors, and it receives updates from them as well. Whenever a router receives
    an updated table from one of its neighbors, it calculates whether there have been
    any changes in the cost metrics applied downstream. For example, say that Emerald
    received an update from the router at Hum. Our router knows that the cost of the
    trip from itself to Hum is two. The Emerald RIP-1 tool then adds two to all of
    the items in the table it just received and compares them against its own. The
    following list describes the actual values contained within the RIP-1 routing
    table:


    +   - The TCP/IP network address or host IP address referred to

    +   - The gateway that must be traveled through to get to this address

    +   - The hardware interface that must be traveled through to get to the gateway

    +   - The route cost

    +   - The time since this entry was last updated


    If one or more of the results from Emerald and Hum''s tables do not add up, there
    has been a change in the metrics. Any new values received from Hum are copied,
    have two added to them, and then are placed in Emerald''s routing table as a new
    metric value.


    # There Can Be Only One


    > Notice that there is only one entry for each destination in the RIP-1 routing
    table. RIP-1 stores only the current best path of travel; it does not store the
    entire results of the algorithm calculation.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The Bellman-Ford algorithm does not have to deal with the fact that some of
    the points may become permanently or temporarily unavailable. RIP-1 does, however,
    avoid the risk of sending packets on a road to nowhere if a particular connection
    or machine goes down or is removed.


    The update message discussed previously is sent every 30 seconds in RIP-1. Whenever
    an update is received from a particular machine, the time since update is changed
    in the routing table for that single machine. After 180 seconds of silence from
    that particular machine, it is assumed that there is a problem, and the router
    is marked in the table as unavailable by setting the distance to this destination
    as 16, one higher than the maximum cost.


    # How It Works


    Now, let me set up an example. As I mentioned before, Emerald needs to send data
    through Abacus. All Emerald knows is that to get data to the appropriate network
    (192.168.13.x), it needs to send that data through the interface that leads to
    router Hum. Hum knows that the fastest way for it to send data to network 192.168.13
    is through Arts. Arts knows to send the data through Math, and Math knows it can
    send directly to Abacus.


    This data path works great until Hum does not hear from the router at Arts for
    180 seconds, which is a series of six check-in times. Router Hum then marks Arts
    as unreachable and passes this information to Emerald. As a result Emerald doesn''t
    know how to send any data to Abacus! Remember, there is only one method of getting
    from here to there kept in the RIP-1 routing tables.


    Several different things could be going on here:


    +   - Router Arts was intentionally removed. It had a critical failure, and there
    is no backup router available to take its place for a week.


    Because it can take a long time for news to travel from router to router in RIP-1,
    the administrator in Emerald''s section explicitly tells router Phys that the
    new cost for router Arts is 16, which means that it is not available. After the
    usual 30 seconds, router Phys sends out its updates. These updates include all
    of the routes that are available through Phys.


    Phys''s only neighbor now is Hum. Phys sends Hum its list of networks to which
    it knows how to send information, as well as the costs to get to those networks.
    Included in this list is the fact that it now costs 16 units to get to Arts through
    Phys. Router Hum knows that it costs one to get from Hum to Phys, so it adds the
    two costs together and updates the cost for data to go from Hum to Arts to a total
    of 17. Hum doesn''t know that it is talking about Arts; it only looks at the networks
    it can get to fastest through Phys. Phys is not part of the path to get to 192.168.13.x,
    so Hum still does not know it has a problem. Hum does know, however, that it cannot
    reach anything that requires it to go through Phys and then Arts.'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'After 180 seconds of not hearing from Arts, Hum realizes for itself that Arts
    is unreachable. It now updates its own cost to get data to Arts to 16. The problem
    now is that this is the only way Hum knew to get data to 192.168.13.x. Any data
    that comes from Emerald with the destination 192.168.13.x is going to get bounced
    back or simply lost in the great void of networking problems. The same happens
    with all of the other routers, eventually, when they need to send data through
    Arts.


    +   - Router Arts was intentionally removed. It is not going to be replaced with
    anything else. The administrator has access to router Chem and updates its tables
    to advertise routes through Math that replace the invalid routes through Arts.


    The administrator for router Chem removes Arts from its routing tables and recalculates
    the distance vector. In its usual 30-second update after the change, Chem tells
    its neighbors—Math and Hum—that they can get to the networks that became unreachable
    through it. The cost from Chem to Abacus through Math is six (3+3), so this is
    the cost that Chem advertises in the routing table to get to 192.168.13.x. Hum
    knows that its cost to get to Chem is one, so it now tells Emerald and Phys about
    the cool new path to 192.168.13.x at a cost of seven (3+3+1). This change spreads
    through the network as well until everything is fully operational once again.


    +   - The connection Arts uses to access the network went down temporarily, isolating
    this router, the machines on its own network, and any networks that it is supposed
    to pass data to from everyone else. This connection stays down for three hours.


    By the time the connection comes back up, all of the neighbor routers have long
    since noticed that Arts was unavailable and have passed the information along
    to all of the other routers in the example network. When router Arts''s connection
    comes back up, it will have decided that all of the other routers are unavailable
    as well.


    The details regarding this scenario are discussed later in this section.


    At least one problem might become obvious from the scenarios listed above. Routers
    send updates to all of their neighbors, even the ones from which they just received
    an update. If a router blindly trusts what its neighbor tells it, this problem
    can wreak all kinds of havoc. Routers that have marked another router as unreachable
    might be told by neighbors that it, in fact, is working fine—when it''s not. In
    the meantime, packets of data are being sent all over the place and are getting
    lost while the routers continue to disagree.


    A technique often used to solve this dilemma in routing protocols is split horizon.
    This addition simply uses a common sense rule: Do not send updates about a route
    to the router from which you just heard the news. For example, consider the problem
    of'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Arts going down again. In Scenario 1, an administrator tells router Phys that
    Arts is no longer accessible. Thirty seconds later router Phys has incorporated
    this data into its tables, marking certain networks as unreachable through it,
    and shares this information with its neighbors, which now turn out to be just
    Hum.


    Thirty seconds later, Hum has incorporated the data into its tables and has marked
    certain networks as unreachable through it, and Hum now informs its neighbors.
    This would now be Phys, Emerald, and Chem. However, it received the news from
    Phys. Due to split horizon, Hum sends an update to all of the machines but only
    sends information involving data that has to go through Phys to Emerald and Chem.
    After all, Hum has other information that does not pass through Phys, and Phys
    has to be kept up to date about that.


    Then, Chem tells Math about the updates but does not send Hum the items relating
    to it. From there, Math shares the new information with Ag and Abacus. Abacus
    gives the new information to Ag because it got the news from Math and not from
    Ag, and Ag tells Eng. Figure 1.10 illustrates this progression.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_36_0.png)


    Figure 1.10 Routing tables sharing information through the split horizon method.


    This is not a perfect method, but it''s more efficient than letting conflicting
    information bounce back and forth between the same machines. There is still another
    concern, however. Loops can be formed where a series of routers end up trapping
    packets accidentally. Because it only prevents updates of routers from which it
    just received the update, split horizon is not enough to take care of this fact.


    RIP-1 uses a combination of split horizon with poisoned reverse. In a way, this
    takes us back to what we were doing originally. Routers send updates about all
    routes to all neighbors, even the one they just received a particular route from.
    The difference is that if Phys tells Hum that Arts is back up and the distance
    is one, Hum then tells'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'Emerald and Chem that Arts is available and that the cost is two, but Hum tells
    Phys that the cost to get to Arts from Hum through Phys is 16. Got that? Let me
    break it down:


    +   1. Router Arts''s network connection comes back up.

    +   2. All machines have given up on router Arts, and router Arts has given up
    on all of the other machines. Therefore, router Arts is not going to send any
    updates to anyone else, and no one is going to send data to Arts.

    +   3. The administrator of router Phys knows Arts is back up. The administrator
    manually resets Phys''s routing table with what the cost to Arts was before it
    went down (one).

    +   4. Thirty seconds later, router Phys sends updates to Hum and Arts. Suddenly
    Arts sees that it is not alone in the world, and Hum finds out that Arts is back
    up.

    +   5. To simplify things, I am going to ignore Arts for the moment and only follow
    the path from Hum. When using a combination of split horizon with poisoned reverse,
    Hum sends its next 30-second update to Emerald, Phys, Arts, and Chem to tell them
    where it can send data. However, the information sent to Phys is different than
    what is sent to the others. Hum tells Phys about all of the networks it can send
    data to, including those that pass through Phys. Any items that pass through Phys
    are marked as having a cost of 16. The purpose of this is to prevent Phys and
    Hum from ending up in a perpetual loop, sending data to one another that never
    arrives at its destination.

    +   6. The propagation continues in this manner until all routers are updated
    and can see Arts once again.


    As you can see, RIP-1 is a relatively basic routing protocol. It has rudimentary
    features for keeping track of which machines are available but would not be reliable
    in a network where things change often. The program used to implement RIP-1 under
    Linux is routed. You can also use the multi-protocol daemons gated or zebra. See
    Chapter 5 for more information on where to find these programs and how they work.


    # Routing Information Protocol Version 2 (RIP-2)


    RIP version 2 (RIP-2) is an updated version of the original Routing Information
    Protocol. There are a few additional features in RIP-2 that make it a far more
    appropriate routing choice for many network administrators, especially as we continue
    with the problem of the IP addressing shortage. The first of these new features
    is the ability to add information gleaned from an Exterior Gateway Protocol (EGP).
    See the section, "Exterior Gateway Protocol," in Chapter 3, "Introduction to Border
    Routing Protocols," for more information regarding the data carried from one router
    to another.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Let''s say that there is a straight line going up from router Phys that leads
    to the Internet Service Provider (ISP) for this campus''s entire network, as shown
    in Figure 1.11. The example network now magically uses RIP-2 instead of RIP-1.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_38_0.png)


    Figure 1.11 The example network''s connection to the outside world.


    This line leads to a router running a different protocol from your network, which
    I''ll call router zero. Router zero is passed information from another router
    and includes that information as a little add-on, as shown in Figure 1.12. Much
    more detail about what might be carried by EGP is provided in Chapter 3.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_38_1.png)


    Figure 1.12 Incoming EGP information.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'As this data reaches router Phys, RIP-2 is able to accept it and incorporate
    it into its next 30-second update, as shown in Figure 1.13.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_39_0.png)


    Figure 1.13 RIP-2 carries EGP data piggyback with its own data.


    This combined data is then sent to Hum and Arts, and so on. The nice thing about
    this capability is that it decreases the need for direct administrator intervention;
    however, it also creates a new problem.


    Introducing the ability to obtain and pass information gained from outside sources
    opens the door for someone to feed the routers false information. Having anticipated
    this dilemma, another addition to RIP-2 allows for a simple password authentication
    scheme. You can set your router to accept updates only from those to which you
    have given the password.


    The administrators in our example network trust one another. Rather than agreeing
    upon one password for all of their routers, they each choose one and notify the
    administrator of their neighbor routers in writing. Please note that email is
    most definitely not a secure alternative unless you use encryption such as Pretty
    Good Privacy (PGP) or Gnome Pretty Good Privacy (GPGP). The administrators then
    add the American Standard Code for Information Interchange (ASCII) passwords to
    their configuration files for each of their neighbors. For example, router Phys
    would have passwords for Campus, Hum, and Arts. If there are neighbors that the
    administrators do not want to accept updated information from, then the administrator
    simply does not give out the password to that neighbor''s administrator. Data
    can still pass from router to router; that function is not hampered. That particular
    neighbor just cannot input data into the routing tables.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Another interesting addition that makes up RIP-2 is the ability to advertise
    alternative routes that use other protocols to other RIP-2 routers. To utilize
    this feature, RIP-2 must be running on the same router with the other protocol.
    Let''s look at the sample network again. Routers Chem and Math are heavily subnetworked
    not only for their individual departments, but for groups inside the departments
    as well. Therefore, we decide that their networking needs require a different
    routing protocol than RIP-2. Which protocol we choose specifically doesn''t matter
    for the moment.


    If RIP-1 were being used, then Chem and Math wouldn''t be able to talk to the
    others anymore. Sure, data could pass from their neighbors through them, but Chem
    and Math could not send updates to the other routers about the networks past them.
    RIP-2 allows for these updates to happen regardless of protocol. Math''s administrator
    then adds a new network behind this router. The administrator adds the information
    about the new network to Math''s routing tables.


    Math has no problem informing Chem about the change. Fortunately, even though
    Chem and Math are using some unknown, as yet not discussed, protocol, Arts, Abacus,
    and Ag are all using RIP-2. The updates pass through just fine, and eventually
    all of the routers in the network and beyond find out how to get to this new network.


    Finally, the new capability that brings RIP-2 into the next Internet age is its
    ability to carry subnet mask information. In fact this was the primary reason
    for building a new version of RIP-1 in the first place. One solution to the IP
    addressing shortage is the use of variable subnet masks rather than using a single
    mask for an entire network. The original RIP-1 was unable to comprehend this type
    of setup.


    As you can see, RIP-2 is a more sophisticated version of RIP-1 that handles updating
    information slightly better and also speaks the language of the modern Internet.
    However, this is still not a protocol for a huge set of networks. It really is
    meant for more limited use.


    The program used to implement RIP-2 under Linux is gated or zebra. Both of these
    daemons can handle more than one protocol at once. See Chapter 5 for more information
    on where to find these programs and how they work.


    # Open Shortest Path First (OSPF)


    The Open Shortest Path First (OSPF) routing protocol is a link-state protocol.
    This term refers to the reduced amount of information that OSPF keeps track of
    compared to a protocol such as RIP-2. A link-state protocol uses an entirely different
    method of choosing routes than a distance-vector protocol.


    # The Algorithm


    Link-state protocols use one of a collection of Shortest Path First (SPF) algorithms.
    Once again, these algorithms are based on solving graphing problems and then were
    applied to networking. In the case of OSPF, the algorithm behind the method is
    the Dijkstra algorithm. Here again, we start with a collection of points. We''ll
    use the same set shown previously in Figure 1.5.'
  merge: -1
  img_proc: true
