- pgno: 66
  md: 'During its isolation, Arts deactivated all of its neighbors in its own routing
    table. As far as Arts is concerned it is the only DVMRP router in existence. However,
    a DVMRP router never gives up. It will continue sending probes out on each of
    its interfaces to the All-DVMRP-Routers multicast channel (224.0.0.4) and broadcast
    as well if there are machines that need to hear and cannot handle multicast, trying
    to find a neighbor to connect with. After Arts is back up, Hum will suddenly get
    a probe from it.


    If all of the information Arts gives to Hum is identical to what it was before,
    then Hum just reactivates the routes that pass through Arts. Otherwise, routing
    tables are exchanged and edited.


    There is one last thing to cover here. This chapter has talked about how DVMRP
    uses R.P.M to prune networks and routers off of its list of where to send data
    from a particular source. However, IGMP handles machines constantly joining and
    leaving multicast groups. We know how they get removed, but after they are gone,
    how do they get put back on?


    The technique used here is grafting. Any pruned item can be grafted back onto
    the source/destination tree at any time. The DVMRP router monitors group membership.
    This router will cancel any prune messages that suddenly interfere with someone
    who just joined a group getting multicast data. These cancellation messages are
    Graft messages. When the DVMRP router receives the Graft, it sends back an acknowledgement
    (graft ack) to prevent repeats of the message and then adds the previously pruned
    branch back onto the tree. If this router also is pruned off of the tree, it sends
    a Graft request to its upstream for this particular source/destination pair—and
    so on.


    The program used to implement DVMRP in Linux is mrouted, just as MOSPF is.


    See Chapter 6 for coverage on how to accomplish this.


    # Protocol Independent Multicast


    The Protocol Independent Multicast (PIM) tool is a routing protocol that is not
    beholden to any other existing protocols. This one actually works on top of existing
    unicast protocols so it doesn''t have to handle any unicast packets. In contrast,
    DVMRP does occasionally deal with unicast transmissions, such as tunneling and
    sending individual router probes.


    There are two different flavors of PIM available. Each of these is refined to
    deal with a specific spread of group members. Specifically, the question to ask
    in choosing between these two options is whether your group members are spread
    out in a sparse manner or packed together in a dense one.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Protocol Independent Multicast-Sparse Mode (PIM-SM)


    A sparse multicast network has many more machines and/or networks that are not
    members of multicast groups than those that are. Group members can be spread out
    over a large geographical or network address span as well. The idea here is to
    not bog down the network structure with a lot of unnecessary multicast traffic.


    # The Rendezvous Point Tree (RP Tree)


    PIM-SM uses two different sets of trees in its moment-to-moment operations. The
    first of these is the Rendezvous Point tree (RP tree), which is also known as
    the Shared tree. This tree is essentially the trunk of PIM-SM operation.


    There is an RP router for each multicast group served in your routing domain.
    This router may host more than one group''s traffic and, in fact, is typically
    configured to be the RP for a range of multicast addresses. For each group, there
    is a router tree that has the RP router as its trunk, and then all other routers
    that serve group members as the branches, including those who have to pass information
    from the RP to a downstream router but don''t require it themselves. These routers
    simply tack themselves on as group members form in a location where they have
    the shortest path possible to the RP.


    What algorithm is used in building this tree? Here''s where things get interesting.
    Unlike what has been discussed so far, PIM-SM does not use algorithms to generate
    trees. It utilizes the underlying unicast routing protocol to generate the RP
    tree, saving some overhead.


    # The Shortest Path Tree (SPT)


    The second of the PIM-SM trees is a shortest path tree (SPT) starting from the
    multicast source. This tree is only built and/or utilized if a heavy amount of
    traffic (you set the number of bits per second (bps), which defines "heavy") flows
    from this particular source, and each individual router can decide whether to
    join the SPT or stay with the RPT.


    If a router decides it needs to belong to the SPT, it sends a Join message directly
    to the multicast group''s source. This message must pass through other routers
    along the way. As it does so, these routers also add their own Join requests for
    the source''s private SPT if they are not already members.


    After the router is fully a member of the group''s SPT, it sends a Prune message
    to the RP. As it passes through each of the intermediate routers, they check to
    see if this router is their only reason for being a member of the RPT. If this
    is the case, the intermediate router adds a Prune message as well, and some load
    is removed from the RP handling this multicast group.


    Eventually, this burst of traffic will probably slow down. When this happens and
    the bps drop below what you defined as "heavy," this process reverses itself.
    The PIM-SM router sends a Join message to the RP to join the RPT, and when it
    and any necessary intermediates are solidly attached, it sends a Prune to the
    source to leave the SPT.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# How It Works


    Let’s say that routers Phys and Arts are the most powerful of all of the routing
    machines in our domain. They also have fast connections to most of their neighbors.
    These would make good RP routers. Because we have many different multicast groups
    being served, we decide to split up the RP duties between these two.


    After we have the unicast protocol and PIM-SM set up, the following happens when
    someone using a machine on one of our networks joins a multicast group:


    +   1. IGMP notifies the closest designated router (DR) that there is a new member
    of this specific group. A DR is one of two things, depending on the situation:

    +      - If this is the only router that serves this part of the network, it is
    always the de-facto DR.

    +      - If multiple routers serve this part of the network, an election is held
    to determine which router is the DR for that network to avoid duplication of multicast
    packets. The router interface with the largest Ethernet MAC address wins this
    election.

    +   2. The DR checks its listings for the rendezvous point (RP) router for this
    group.

    +   3. The DR creates its own routing table entry for this group if it does not
    already have one.

    +   4. The DR adds this group member to the group’s table entry. If the router
    already has a group member, it does not follow through the rest of this process.

    +   5. If the DR is not already handling traffic for this group—because this is
    the first member to join the group—it creates a Join packet.

    +   6. The DR adds the interface address that leads ultimately toward the rendezvous
    point to the Join packet.

    +   7. The DR sends the Join packet through the interface that ultimately leads
    to the RP router for the group.

    +   8. Most likely, an intermediate router receives the packet. This router adds
    the interface on which the packet just arrived to the Join packet if it’s not
    already part of the RP Tree.

    +   9. The intermediate router passes the packet out on the interface that ultimately
    leads to the RP. If the Join packet ends up at another intermediate router, Step
    8 is repeated.

    +   10. All traffic from the group that the machine just joined was already being
    sent through the RP, on through the RP Tree, and eventually to the new group member.


    I know some of this is repetitive, but I want to make sure that you have a chance
    to really let how this works sink in. The subtlety of the switch to the SPT was
    left out of this particular example. However, keep in mind that the end user does
    not choose which tree to be on—each router does. It’s all transparent to the new
    group member.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'By now, you’ve probably guessed what comes next. I made the mistake of making
    that nasty router Arts one of the RP routers. Let’s see what happens when it gets
    unstable by going through our scenarios:


    +   - Scenario 1: Router Arts was intentionally removed. It had a critical failure,
    and there is no backup router available to take its place for a week.


    Suddenly there is no rendezvous point router for about half of the multicast groups.
    Fortunately, I fibbed a bit when I said that you assign which RP handles what.
    You don’t have to. PIM-SM routers also can elect which will be the RP. But first,
    the fact that Arts died without warning must be dealt with.


    The first thing that happens here is that the bootstrap router (sometimes shortened
    to BSR or BR) stops getting "I’m alive" notices from RP router 5. Routers continue
    trying to talk to Arts until the BSR sends out its next update, which suddenly
    has no pointers to Arts. The routers then all remove Arts from their own tables
    for multicast traffic.


    Now it’s time to see another reason why there is more than one RP in our network.
    You not only can tell an RP to handle a specific range of multicast groups, but
    you also give it a priority value—the lower the number is, the higher the priority.
    This means that we did a clever thing when we set up our RPs. Router Arts handled
    half of the groups with the highest priority and had the lowest priority for the
    other half. Phys had the reverse.


    Now that the normal routers have nowhere to send data for some of the groups,
    they use the hash function (which is also referred to as an algorithm). This tool
    allows the routers to contact all of the available RPs and find out which ones
    support the groups on which they need to pass data. As the routers find themselves
    with no place to send data that need to pass through Arts, they send out a hash
    to Phys and find out that it can handle these groups. Tables are rebuilt, and
    life is good again.


    +   - Scenario 2: Router Arts was intentionally removed. It is not going to be
    replaced with anything else.


    Perhaps you’re beginning to notice a pattern—that for advanced protocols this
    scenario is no different than the first one. The same is true here.


    +   - Scenario 3: The connection Arts uses to access the network went down temporarily,
    isolating this router, the machines on its own network, and any networks on which
    it is supposed to pass data to from everyone else. This connection stays down
    for three hours.


    The first part of this scenario works out identically to Scenario 1. The BSR notices
    that RP Arts no longer is sending its "I’m alive" messages and notifies all of
    the PIM-SM routers. These routers remove Arts from their tables, and when they
    need to send data to groups that were once served by Arts, they use hash to find
    out that Phys can take over these duties.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'As usual, the more interesting issue is when router Arts comes back up. Here
    is where PIM-SM gets to show off its flexibility. Arts sends an “I’m alive” message
    to the BSR, which subsequently adds Arts, the groups it says it can handle, and
    the priorities for each group, to its PIM-SM tables. The BSR then sends its regular
    update to the general PIM-SM routers. All of them suddenly see that there is a
    router, Arts, that can handle some of the groups they are currently using Phys
    for and that Arts’s priority is higher.


    One by one, the routers send Join messages to Arts and Prune messages to Phys
    as necessary. Life is back to normal, and the administrator didn’t have to do
    a thing.


    The program used to implement PIM-SM in Linux is gated. Remember that you also
    have to have a unicast protocol installed, such as OSPF or RIP-2, for any of the
    PIM protocols to function properly.


    # Protocol Independent Multicast-Dense Mode (PIM-DM)


    If your multicast network is dense, you would be wise to use this version of PIM.
    This term refers to having many multicast group members within the same geographical
    or network address area. The Protocol Independent Multicast-Dense Mode is in some
    ways an extension of PIM-SM. Later sections of the book will focus specifically
    on how it differs from its sparse-focused cousin.


    PIM-DM is once again reliant on the mechanisms used by the unicast protocol with
    which it shares its routers. The trees are built from the source, through the
    routers, to the destinations, all using the unicast protocol’s method. Consequently,
    there is nothing to discuss on the underlying tree-building front. The central
    question here is what happens when a group starts sending multicast traffic.


    The machine named The Radio Show (refer to section “The Algorithms: Truncated
    Reverse Path Broadcasting (TRPB)”) has been down for a few months, and now you
    want to run it again. In the meantime the system has been changed to a PIM-DM
    multicast network. When this source begins sending out its multicast traffic,
    each PIM-DM router automatically sends it to the other PIM-DM routers, as well
    as sending it out to all of the networks each router serves—this is a dense mode
    protocol. It assumes that there are many group members present. Once again, a
    separate table is created for each source/channel combination. But because this
    is a PIM protocol, all the information that is kept there is whether or not this
    interface is used.'
  merge: -1
  img_proc: true
- pgno: 71
  md: "One interesting fact is that Prune messages are sent to a specified multicast\
    \ address, not to individual routers. The machine sending the request identifies\
    \ itself and the router from which it is trying to Prune itself. Then there is\
    \ about a three-second delay as routers downstream from the one trying to leave\
    \ the tree have the chance to send a Prune-Override (if they have group members\
    \ that would be left in the cold by this router’s leaving the tree).\n\nAt regular\
    \ intervals, all Prunes are flushed from the PIM-DM routing tables. Once again,\
    \ routers can send Prune messages to be removed from the specific source/destination\
    \ tree.\n\n# PIM-DM and Special Routers\n\nThe PIM-DM protocol usually does not\
    \ use rendezvous point routers or DRs. However, IGMP Version 1 requires a DR in\
    \ cases where there are multiple routers connected to the same network or network\
    \ group. In these cases, the router with the highest IP address becomes the DR.\n\
    \nThis doesn’t mean, however, that PIM-DM allows packets to enter a network from\
    \ two different routers. In these cases, the router with the best cost for data\
    \ coming from the source—determined using the unicast protocol’s costing mechanism—is\
    \ chosen to forward the data.\n\nSo, let’s run through our favorite three scenarios\
    \ and see how it holds up:\n\n+   - Scenario 1: Router Arts was intentionally\
    \ removed. It had a critical failure, and there is no backup router available\
    \ to take its place for a week.\n+   \n+   All PIM-DM routers send Hello messages\
    \ out of each interface on a regular basis. Five’s PIM-DM neighbors (refer to\
    \ Figure 2.1), Phys and Math, notice that after a set number of seconds (set in\
    \ the Holdtime Hello field) that Arts has not been checking in. They deactivate\
    \ all references to Arts in their tables, and at least for a moment data that\
    \ needed to head through this router has nowhere to go.\n+   \n+   Router Arts\
    \ going down in this case is not just a change in the multicast routing, but in\
    \ unicast routing as well. The underlying unicast protocol rebuilds the routing\
    \ tables, and PIM-DM utilizes these to send traffic for the areas that were served\
    \ by Arts.\n\n+   - Scenario 2: Router Arts was intentionally removed. It is not\
    \ going to be replaced with anything else.\n+   \n+   Once again, this is handled\
    \ exactly as it was in Scenario 1.\n\n+   - Scenario 3: The connection Arts uses\
    \ to access the network went down temporarily, isolating this router, the machines\
    \ on its own network, and any networks that it is supposed to pass data to from\
    \ everyone else. This connection stays down for three hours."
  merge: -1
  img_proc: true
- pgno: 72
  md: 'The beginning of this scenario works exactly as it did in Scenario 1. However,
    when router Arts returns to life, its neighbors will suddenly notice Hello messages
    that it always sends out of its interfaces—even though Arts would have noticed
    its neighbors were gone as well.


    After the neighboring routers add Arts back to the possible paths for source/group
    traffic, a series of DR elections might occur if Arts suddenly duplicates traffic
    that''s being sent by another router to a certain collection of networks. It''s
    not long before everything''s back in order.


    The program used to implement PIM-DM in Linux is gated. Once again, remember that
    you also have to have a unicast protocol installed, such as OSPF or RIP-2, for
    any of the PIM protocols to function properly.


    # Summary


    The multicast routing protocols you''re most likely to use in Linux are MOSPF,
    DVMRP, and either PIM-SM or PIM-DM. MOSPF is most useful in smaller multicast
    setups where you need a single protocol to handle both unicast and multicast,
    and RIP-2 doesn''t really handle multicast data as much as it does unicast updates.
    DVMRP, PIM-SM, and PIM-DM all require an additional unicast protocol to work with.
    You would use PIM-SM if your multicast group members tend to be very spread out,
    and you''d use PIM-DM or DVMRP if they are more densely packed. Table 2.1 outlines
    the multicast protocols available to you and the data you''ll need to get started.


    Table 2.1 The Programs Used to Implement Multicast Routing Protocols in Linux,
    and the RFC Documents That Contain Vital Background Information


    | Protocol | Program | RFC or Draft |

    |---|---|---|

    | MOSPF | mrouted | 1585 |

    | DVMRP | mrouted | draft-ietf-idmr-dvmrp-v3-10.txt |

    | PIM-SM | gated | 2362 |

    | PIM-DM | gated | draft-ietf-pim-v2-dm-03.txt |


    See http://www.multicasttech.com/multicast_faq.html if you have questions about
    multicast in general.'
  merge: -1
  img_proc: true
