    # Reading IPv6 Addresses


    Most of us these days can read a Classful IP v4 address in our sleep. Sometimes
    when the first byte is near a boundary it''s necessary to look up the borders
    between classes A, B, and C but generally speaking, it''s usually a no-brainer.
    Those involved with Classful IP v4 multicasting know that any class D IP address
    is a multicast channel. Moving to Classless IP v4 wasn''t much of a change. Most
    folks were already familiar with the basics of the bit mask, so even that part
    wasn''t too traumatic.


    Reading an IP v6 address does have a few similarities to reading an IP v4 address:


    +   The prefix—the bits at the beginning—determine what type of address you''re
    talking about. (You might have already guessed this from the discussion in the
    previous section about reserved prefixes.)


    +   There is still a bit mask notation available.


    To read an IP v6 address, work from left to right. You''ll be pleased to see that
    it is much easier to distinguish multicast and unicast addresses from one another
    in IP v6. If the address begins with FE, you''re looking at a multicast address.
    Anything else is unicast or anycast. Both of these addressing designations—unicast
    and anycast—look the same at a glance.


    Let''s focus on the unicast addresses because they''re more commonly used. The
    possibilities for a unicast address type are detailed in Table 4.9 but here they
    are quickly (plus the one additional type that isn''t there): aggregatable, IPX,
    link local, NSAP, site local, and—the new one—IP v4 capable. In general, host
    machines really don''t know anything about these distinctions. Routers have to,
    however, to direct data from place to place.


    The IP v6 rules as laid out in RFC 2374 for aggregatable global unicast addresses
    are


    +   The first three bits express the initial prefix. This prefix comes from Table
    4.9, and for unicast is often 001. One more bit is required to complete the first
    hex digit.'
