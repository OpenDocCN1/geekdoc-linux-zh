- pgno: 109
  md: '# How routed Works


    The routed routing daemon typically starts at boot time—you’ll want to be sure
    that it is set up to do so on the Linux box you use for your router. After finding
    out which network interfaces are active, the router looks at how many interfaces
    it has to deal with. If there is more than one, routed determines that it will
    have to deal with multiple internal networks rather than the single internal network
    that only one interface requires.


    At this point, routed looks to each of the interfaces to see what types of packets
    they support. In this case, the only two packet types of consequence are unicast
    and broadcast. If the interface can only handle unicast data, the router sends
    a request packet out through it to the machines defined in its /etc/hosts file.
    Broadcast packets are the preferred solution, however. If the interface can handle
    a broadcast packet, the request packet goes as a broadcast message—which means
    that it goes to the network’s broadcast IP address, and all machines capable of
    receiving broadcast traffic pick it up.


    After the requests are sent, routed enters a listening loop. At this point the
    daemon is receptive to two types of packets: request and response. A request packet
    tells routed to build a list of its routing table contents with the following
    information for each route:


    +   - The network or host IP address to which this table entry refers.

    +   - The netmask for this network.

    +   - The RIP cost (see Chapter 1, “Unicast Protocols,” for more information)
    to send data along this particular route.


    After the list is completed, it is returned to the machine that sent the request
    in the form of a response packet.


    When routed receives a response packet from another machine, however, it has to
    do a bit of thinking before it knows what to do with the information. Figure 5.1
    illustrates the decision-making process involved.


    In the meantime, every 30 seconds routed has been sending out copies of its routing
    tables, according to the unicast/broadcast issues discussed earlier in this section.
    All of the other routed routers within your network, if you have more than one,
    have been doing the same. Whenever one of these packets arrives, its contents
    overwrite their counterparts’ in the current table because they are considered
    definitive. This means that if any of the network or host entries in routed’s
    table do not match what just arrived, it is replaced with the new entry. Brand
    new routes are added also at this point if they don’t already exist. When data
    is changed in this manner, its last change time is reset to zero.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_110_0.png)


    # Figure 5.1 A flow chart illustrating how routed analyzes a response packet.


    If any table entry''s last change time advances to 180 seconds, routed sets the
    cost for the route to sixteen—which you might remember invalidates the route in
    RIP—and flags it for deletion. This entry is not actually removed until it has
    been flagged in this manner for another 60 seconds, which corresponds to two sends
    of the router''s routing tables to its neighbors. After these 60 seconds, if no
    new response packets give information that this route is up and active, it is
    deleted from this router''s tables. The router then must choose another valid
    route from itself to the specified destination from those available.


    # Configuring routed


    The routed RIP routing daemon builds its own routing tables utilizing the method
    described in the earlier section, "How routed Works," so you do not need to start
    it with a list of defaults. There is a file that you can create, however, if you
    have some gateways that need to be defined as active or passive. An active gateway
    is able to respond to routing queries; a passive one is not. That is the "simple"
    difference between the two.


    Given that a passive router is not going to respond to request packets, routed
    will never learn of it if it is not explicitly told. To enter this information,
    first create the file /etc/gateways as root. You then must add a line for each
    passive gateway in the format: address name gateway cost passive


    All but the last item in this line of code must be replaced with the appropriate
    values:


    +   - address. The IP address of the host or network this entry refers to.

    +   - name. The hostname as set in /etc/hosts, the network name as set in /etc/networks,
    or the full name for the machine in the format host.domain.extension.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '+   - **gateway.** The name or IP address for the gateway that traffic must
    pass through to get to *address*.

    +   - **cost.** The RIP cost of going through this gateway, determined according
    to the rules discussed in Chapter 1.


    Passive gateway information is loaded at boot time—when *routed* starts. It is
    not reloaded unless you restart the routing daemon.


    # Running routed


    The *routed* daemon, as mentioned earlier, should be set to start at boot time.
    You do this either through a file, such as rc.local, or by adding an initialization
    script pointer for the run levels that require the routing daemon. In either case,
    there are flags available so you can specify particulars about how this program
    should run. Table 5.1 lists the options and their functions.


    Table 5.1 Flags and Options Available for the IPv4 Version of routed


    | Option | Result |

    |---|---|

    | -d | Saves extensive debugging information. |

    | -g | Sets a default route, such as -g 192.168.52.1. Typically used to point
    to external destinations that routed may not be able to find on its own, such
    as the Internet or a router using another protocol. |

    | -s | Supplies routing information even if there is only one network interface,
    which normally tells routed to assume that it is not an internetwork router. |

    | -q | Does not supply routing information even if there are multiple network
    interfaces. |

    | -t | Runs routed linked through the terminal, so packet information is shown
    on STDOUT and the process can be killed using Ctrl-C. Used for testing purposes.
    |

    | filename | If you end the line with a filename, that file is used to log routed''s
    behavior. |


    # Guide to gated


    Another program you have heard much about in earlier chapters is gated. There
    are actually three different versions of this program. You can utilize gated for
    either unicast or multicast use, for either IPv4 or IPv6, or any combination of
    these you require—just make sure you have the correct version (see Table 5.2)
    for each. This routing daemon comes with many versions of Linux, though it might
    be on a second disk or among supplementary materials. If this is the daemon you
    decide to use and'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'don''t have it, want the latest version, or need a capability that didn''t
    come with the version packaged with your distribution, go to www.gated.org or
    www.gated.merit.edu to obtain them.


    # Table 5.2 Versions of gated and Their Capabilities


    | Version | Enables |

    |---|---|

    | gated-ipv6 | Static IPv6 routing, RIPng, and BGP4MP. |

    | gated-multicast | IGMP, MP-BGP, MSDP (check to see if this implementation is
    complete), DVMRP, PIM-SM, and PIM-DM. |

    | gated-public | EGP, BGP, RIP-1, RIP-2, and OSPF. The public version is a slightly
    older but very stable version. |

    | gated-unicast | EGP, BGP, RIP-1, RIP-2, OSPF, and Intermediate System to Intermediate
    System (IS-IS). |


    The public version is a slightly older but very stable version. The unicast, multicast,
    and IPv6 versions are all newer and available through the main site as well. Access
    to the public version''s source code is possible but not to the newer versions
    unless you obtain a license—if you require source code access, the zebra (http://www.zebra.org)
    daemon might be a better choice for you.


    It is the public version we''ll focus on in this chapter.


    # How Public gated Works


    Like most routing daemons, the gated routing daemon typically starts at boot time—you''ll
    want to be sure that it is set up to do so on the Linux box you use for your router.
    See the section "Running Public gated" for ideas on using the gdc program to interface
    with the daemon rather than directly starting it by hand.


    When gated starts, it first determines how much space it needs in memory for its
    arrays and other data structures. After it knows how much room it needs, gated
    is assigned a virtual machine with a 32-bit address space in either RAM or on
    a hard drive (this is how Linux handles all processes). The daemon then reserves
    a section of its space to hold the information and then clears out anything already
    stored there—a process called initializing memory. After this, it reserves another
    section of its space for each of the threads it will use to keep track of its
    state and serve other functions. The gated daemon then creates the memory framework
    for the data structures, such as routing tables, to which it needs fast access.


    After the entire framework is in place, gated reads the kernel''s routing tables
    into its own RAM—something it won''t do again unless specifically instructed or
    restarted. It then finds the interfaces on this specific machine and records both
    their addresses and whether they are currently up or down.'
