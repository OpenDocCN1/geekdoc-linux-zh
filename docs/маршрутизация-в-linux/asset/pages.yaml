    \      0  *:auth             *:*                    LISTEN\ntcp        0     \
    \ 0  *:980              *:*                    LISTEN\ntcp        0      0  *:1024\
    \             *:*                    LISTEN\ntcp        0      0  *:sunrpc   \
    \        *:*                    LISTEN\nudp        0      0  *:ntalk         \
    \   *:*                    \nudp        0      0  *:talk             *:*     \
    \               \nudp        0      0  *:978              *:*                \
    \    \nudp        0      0  *:1024             *:*                    \nudp  \
    \      0      0  *:sunrpc           *:*                    \nraw        0    \
    \  0  *:icmp             *:*                    7\nraw        0      0  *:tcp\
    \              *:*                    7\nActive UNIX domain sockets (servers and\
    \ established)\nProto RefCnt Flags       Type       State       I-Node Path\n\
    unix  0      [ ACC ]     STREAM     LISTENING   474  /dev/printer\nunix  0   \
