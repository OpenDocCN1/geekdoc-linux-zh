    to know that the technology exists and plays a very important role in many WAN
    environments. Frame Relay should be considered anytime where multiple site connectivity
    is needed.


    # Summary


    In this chapter we have examined telecommunication facilities upon which data
    networks are built. Analog, digital (T1/E1), DSL, cable, and Frame Relay have
    been covered.'
