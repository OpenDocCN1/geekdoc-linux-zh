    # Table 15.1 snmpset Type Abbreviations and Meanings


    | Type Abbreviation | Meaning |

    |---|---|

    | a | IP Address in xxx.xxx.xxx.xxx format |

    | b | Bits |

    | d | Decimal |

    | i | Integer |

    | n | Null Object |

    | o | Object Identifier |

    | s | String |

    | t | Time Ticks |

    | u | Unsigned |

    | x | Hexadecimal |


    The snmpset command requires "private" access to the SNMP agent because actual
    configuration is being changed. Although a change has been accepted by an SNMP
    agent, the change may not be saved across a reboot. For example, the NET-SNMP
    package, like many Unix SNMP packages, has very little support for making permanent
    changes via SNMP. The previous example showing the change of system contact will
    be lost during the next restart of snmpd or a system reboot. Router and other
    network elements'' support of SNMP support varies, so a thorough investigation
    and testing on a nonproduction system is highly recommended.


    # Multi-Router Traffic Grapher (MRTG)


    MRTG is likely the most popular open source network analysis tool. MRTG uses SNMP
    get commands to query a router''s interfaces traffic statistics. The results of
    the get command are then recorded, and the traffic statistics are used to graph
    the network statistics, which will show trends such as high and low utilization
    periods, averages, and changes in network patterns.


    Specifically, MRTG measures the number of packets sent in and out of an interface,
    the average number of in and out packets, and the current in and out packets.


    MRTG is available for most versions of Unix including Linux. (There is also a
    Windows version.) MRTG is available at http://www.mrtg.org/, which is a pointer
    to the original MRTG site at http://people.ee.ethz.ch/~oetiker/webtools/mrtg/.
    MRTG makes use of the NET-SNMP package covered in the previous section, so NET-SNMP
    should be installed and configured before installing MRTG.'
  merge: -1
  img_proc: true
- pgno: 302
  md: "Parts of MRTG are written in Perl, so Perl also must be installed on the system.\
    \ Version 5.05 or later is recommended. Several graphics libraries also are required\
    \ for MRTG to function correctly, but their installation is beyond the scope of\
    \ this chapter. Refer to the doc/unix-guide.txt document (in the MRTG source directory\
    \ covered shortly) for the exact requirements.\n\n# MRTG Installation\n\nMRTG\
    \ should be downloaded from http://people.ee.ethz.ch/~oetiker/webtools/mrtg/pub/\
    \ and placed in the appropriate directory. For this example, /usr/src is used.\
    \ The current version of MRTG at the time of publication is 2.9.12, which is used\
    \ here.\n\nAfter downloading the MRTG package, follow these steps.\n\n+   1. Log\
    \ in as root and move into the directory where the package was downloaded:\n+\
    \      `[root@lefty /root]# cd /usr/src`\n\n+   2. Unzip the distribution:\n+\
    \      `[root@lefty src]# gunzip mrtg-2.9.12.tar.gz`\n\n+   4. Untar the tarball:\n\
    +      `tar xvf mrtg-2.9.12.tar`\n\n+   5. This will create the MRTG source tree.\
    \ Move into the source tree:\n+      `[root@lefty src]# cd mrtg-2.9.12`\n\n+ \
    \  6. Execute the configure script:\n+      `[root@lefty mrtg-2.9.12]# ./configure`\n\
    \n+   7. Execute the make command:\n+      `[root@lefty mrtg-2.9.12]# make`\n\n\
    +   8. Finally, execute the make install:\n+      `[root@lefty mrtg-2.9.12]# make\
    \ install`\n\nThis will create the installation directory structure, /usr/local/mrtg-2/,\
    \ and move all the binaries and appropriate files into the directory. Move into\
    \ the directory structure:\n   `[root@lefty mrtg-2.9.12]# cd /usr/local/mrtg-2/`\n\
    \nMRTG needs a directory that is accessible by the web server. A common directory\
    \ location for HTML documents for the Apache Web Server on Linux is /home/httpd/html/,\
    \ so the MRTG files can be placed in a subdirectory:\n   `[root@lefty mrtg-2]#\
    \ mkdir /home/httpd/html/mrtg`\n\nBe sure to use an appropriate directory based\
    \ upon the web server's configuration. A configuration directory for MRTG also\
    \ should be created:\n   `[root@lefty mrtg-2]# mkdir cfg`"
