- pgno: 118
  md: "# Table 5.7 Continued\n\n| Option | Purpose | Format | Value(s) |\n|---|---|---|---|\n\
    | netmask | Tells gated what netmask applies to this interface for IPv4. Invalid\
    \ if pointopoint is set. | netmask address | The network mask for the interface.\
    \ |\n| pointopoint | Tells gated that this interface is a modem or other device\
    \ using SLIP or PPP. | pointopoint address | The local address for this interface.\
    \ In this case, the define address would have to refer to the remote address for\
    \ the interface. |\n\nSo, since you are probably a bit confused about what a typical\
    \ interfaces statement might look like, here's a more fleshed out example:\n\n\
    ```\ninterfaces {\n    options\n        strictinterfaces\n    ;\n    interface\
    \ 192.168.232.*\n        simplex\n    ;\n    interface 192.168.251.*\n       \
    \ simplex\n        passive\n    ;\n    define 192.168.232.*\n        broadcast\
    \ 192.168.232.255\n        netmask 255.255.255.0\n    ;\n    define 192.168.251.*\n\
    \        broadcast 192.168.251.255\n        netmask 255.255.255.127\n    ;\n}\n\
    ```\n\nNotice that not all of the IP information is strictly in the form of an\
    \ IP address. You have a few different formats you can use:\n\n+   - all. The\
    \ word all is the same as using just the wildcard *.\n+   - xxx.xxx.xxx.xxx. Full\
    \ IP address.\n+   - xxx.xxx.xxx.*, xxx.xxx.*, xxx.*. Partial IP addresses with\
    \ a wildcard at the end."
  merge: -1
  img_proc: true
