- pgno: 104
  md: 'Every interface on a host machine utilizing IP v6 must have a link-local address.
    This identifier is used to transmit information between the host and another entity,
    usually a router, or for getting the interface’s global address information from
    a router automatically. You can recognize a link-local address by its first 10
    bits, as given in Table 4.9: 11111110 10. No other machines aside from the router
    and the host need be aware of the link-local address.


    The site-local address is a bit farther reaching. Each interface on a host gets
    one, and this value is useable by any machine in the network, including subnets.
    However, the router doesn’t advertise a site-local address to the outside world.
    Once again, it’s only for internal use. You’ll know a site-local address by its
    first 10 bits, as usual: 1111110 11.


    You might even see IP v6 addresses that end in an obviously IP v4 address. IP
    v6 does have a built-in mechanism for piggybacking IP v4 data, which enables the
    powers that be on the Internet to slowly begin migrating from IP v4 to IP v6 without
    causing undue hardships.


    # IPv6 Routing Issues


    One good thing about routing issues with IP v6 is that this new addressing scheme
    can work within the same routing protocols we’re used to: RIP-2, OSPF, and so
    on. There are some new features to IP v6 routing that definitely make an administrator’s
    life more interesting. Most of them allow a finer control over what’s happening
    with your data than you could get in IP v4.


    An IP v6 packet contains a special header for routing instructions, unlike IP
    v4 packets. Each packet might, for example, contain information on every router
    it passed through on its way from one point to another. That information can actually
    be reversed to send data back exactly the way it came, if this is a feature you
    require. This feature can actually be utilized to track a mobile networking user’s
    location when they log on—something that some will like and others will be very
    uncomfortable with.


    One of the best new features by far is the ability of an IP v6 router to auto-configure
    an interface’s address information. Once a host knows what an interface’s link-local
    identifier is, that host sends an Internet Control Message Protocol for IP v6
    (ICMPv6) neighbor request containing that information. If no other host responds
    claiming that it already has that address, the machine sends out an ICMPv6 router
    request message to find its router. When the network’s router responds, it includes
    the network’s IP v6 global prefix.


    From here, the host builds the interface’s global IP v6 address all on its own
    using the interface ID. If for some reason another interface claims to already
    have the original link-local identifier, then you’ll have to configure that interface
    by hand.'
