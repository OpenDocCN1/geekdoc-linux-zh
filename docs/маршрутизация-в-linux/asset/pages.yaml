  md: 'its parent layer. We started with the overall network 192.168.240.0/20. The
    20-bit mask translates to nnnnnnnn.nnnnnnnn.nnnnhhhh.hhhhhhhh, where n is a network
    bit and h is a host bit. This means that you have access to the address range
    192.168.240.0 through 192.168.255.255.


    The two subnets within this network are 192.168.240.0/21 and 192.168.248.0/21.
    Both of these network addresses are within the main network’s address range. Therefore,
    no matter which subnet the traffic ultimately needs to go to, it first has to
    go to network 192.168.240.0/20 according to how the IP v6 routing works. No router
    outside the main university router (prime) needs to know that there are any subnets
    at all.


    Our major subnets have their own address ranges. The campus subnet, 192.168.240.0/21,
    has the bit mask nnnnnnnn.nnnnnnnn.nnnnehhh.hhhhhhhh. This gives it the address
    range 192.168.240.0 through 192.168.247.255. The dorm subnet, on the other hand,
