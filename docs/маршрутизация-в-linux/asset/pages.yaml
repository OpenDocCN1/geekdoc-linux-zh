- pgno: 160
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_160_0.png)


    # Inside the Multicast Kernel

    2.2.x Daemons


    IF YOU WANT TO PROVIDE MULTICAST services or even just want to receive them, you
    need to have the routing infrastructure in place to direct multicast packets.
    There are a number of daemons available to serve this purpose under Linux. What
    we’ve chosen to cover here is a pair of daemons, each of which serves a specific
    purpose in the Linux multicast routing world. These are pim d for Protocol Independent
    Multicast-Sparse Mode (PIM-SM) and mrouted for Distance Vector Multicast Routing
    Protocol (DVMRP).


    # The PIM-SM Linux Daemon: pim d


    For your PIM-SM routing pleasure, we chose to cover pim d (ftp://catarina.usc.edu/pub/pim/pimd/).
    As you’ll learn in this chapter’s sidebars, you do have other options available
    under Linux, but this one made the most sense to cover here. pim d is a single-purpose,
    single-protocol daemon. After seeing how complex the public gated is to configure
    in Chapter 5, “Inside the Unicast Kernel 2.2.x Daemons,” you will probably find
    this fact a blessing.


    PIM-SM seems destined to be a favorite among the multicasting community. It is
    a low-overhead protocol and handles directing of traffic efficiently, especially
    in Sparse Mode situations where people listening to any given multicast channel
    are on machines widely spread network-wise (instead of in close proximity).'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Multi-Protocol, Multicast Routing with the Multicast gated


    > The multicast version of gated (www.gated.org) handles PIM-SM, Protocol Independent
    Multicast-Dense Mode (PIM-DM), DVMRP, and Multicast Source Discover Protocol (MSDP)
    all in a single program. It''s not featured in this chapter because it''s not
    freely available, but for many this program is worth the cost. This is especially
    true if you need to run more than one multicast program, which you might just
    need to do. The reasons for this are discussed in the section, "The DVMRP Linux
    Daemon: mrouted."


    # Configuring pimd


    Since pimd is a single-function daemon, the configuration is really not that complex—at
    least when compared to a monster tool such as gated. The configuration data is
    kept in the file /etc/pimd.conf. While the order of the statements does not have
    to strictly follow what is about to be presented, I''ll walk you through the contents
    you might want to add to this file.


    The /etc/pimd.conf file begins with the following statement:

    default_source_preference value


    Routers hold elections to determine which gets to be a site''s upstream router.
    Because pimd is such a focused tool, you generally don''t want it to win over
    something more general. Using a value of 101 here is a minimum for making sure
    that gated and other routing tools are going to win the election and leave pimd
    to do its PIM-SM handling. The next line is

    default_source_metric value


    This item sets the cost for sending data through this router. You want only PIM-SM
    data to go to this daemon; so once again, a high value is recommended to prevent
    accidental usage. The preferred default value is 1024.


    Though you can swap the first two statements around, you must have the next statement
    after you set default_source_metric. This item starts with

    phyint interface


    phyint refers to physical interface. You fill in Interface with a reference to
    the ethernet card or other network interface you''re telling pimd about, either
    with the device''s IP address or name (for example, eth0). If you just want to
    activate this interface with default values, you don''t need to put anything else
    on the line. However, you do have some additional items you can add. The items
    are, in the order you would need to use them, as follows:


    +   - disable Do not send PIM-SM traffic through this interface nor listen for
    PIM-SM traffic from this interface.

    +   - preference pref. This interface''s value in an election. It will have the
    default_source_preference if not assigned.

    +   - metric cost. The cost of sending data through this interface. It will have
    the default_source_metric if not assigned.'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Add one phyint line per interface on this router. If you don’t do this, pimcd
    will simply assume that you want it to utilize all interfaces on the machine with
    the default values. If you set phyint for one or more interfaces but not for all,
    the missing ones will be assigned the defaults. After you have done this, start
    the next line with cand_rp


    cand_rp refers to Candidate Rendezvous Point (CRP). This statement specifies which
    interface on this machine should be included in RP elections. Additional options
    to choose from are, listed in the order used, as follows:


    +   - ipaddr. The default is the largest activated IP address. If you don’t want
    to utilize that interface, add the IP address of the interface to use as the next
    term.

    +   - time value. The number of seconds to wait between advertising this CRP.
    The default value is 60 seconds.

    +   - priority num. How important this CRP is compared to others. The lower the
    value here, the more important the CRP.


    The next line begins with cand_bootstrap_router


    Here you give the information for how this machine advertises itself as a Candidate
    BootStrap Router (CBSR). If you need to, add the ipaddr and/or priority items
    as defined earlier after cand_bootstrap_router. What follows is a series of statements
    that start with group_prefix


    Each group_prefix statement outlines the set of multicast addresses that CRP if
    it wins an election, will advertise to other routers. The two items you might
    include here are, listed in order, as follows:


    +   - groupaddr. A specific IP or network range that this router will handle.
    Remember that a single multicast network is written as a single IP address.

    +   - masklen len. The number of IP address segments taken up by the netmask.
    Remember that a multicast address is a Class D and has a netmask of 255.255.255.255,
    which means its length is 4.


    After this comes switch_data_threshold rvalue interval ivalue


    This statement defines the threshold at which transmission rates trigger the changeover
    from the shared tree to the RP tree; starting the line with switch_register_threshold
    does the opposite in the same format. (See Chapter 2, “Multicast Protocols,” for
    more details on the two PIM-SM trees.) Regardless of which of these you choose,
    the rvalue stands for the transmission rate in bits per second, and ivalue sets
    how often to sample the rate in seconds—with a recommended minimum of five seconds.
    It’s recommended by the pimcd programmers to have ivalue the same in both statements.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'For example, I might end up with the following (these are real IP addresses;
    don’t use them for actual testing purposes):


    ```

    default_source_preference 105

    ```


    ```

    phyint 199.60.103.90 disable

    phyint 199.60.103.91 preference 1029

    phyint 199.60.103.92 preference 1024

    cand_rp 199.60.103.91

    cand_bootstrap_router 199.60.103.92

    group_prefix 199.60.103.0 masklen 4

    switch_data_threshold rate 60000 interval 10

    switch_register_threshold rate 60000 interval 10

    ```


    # Running pim d


    After you’ve set up the configuration file, you’re ready to actually run the PIM-SM
    daemon, pim d. As usual, we tend to recommend that you run this by hand for testing
    purposes and then later add the daemon, with any startup flags it needs, to your
    system’s startup scripts.


    The format for running this daemon is


    ```

    pimd -c file -d level1,...levelN

    ```


    Both of the flags and their values are optional:


    +   - **-c file.** Utilize the specified configuration file rather than the default,
    /etc/pimd.conf.


    +   - **-d level1,...levelN.** Specifies the debug level(s) to utilize when running
    this daemon. Type pimd -h to see a full list of these levels.


    # The DVMRP Daemon: mrouted


    For your DVMRP routing fun, we chose to cover mrouted (ftp://parcftp.xerox.com/pub/net_research/ipmulti/).
    Once again, this is not the only tool available for the job, but we’ve chosen
    to cover it because it is single purpose and freely available, just as with pim
    d. See the chapter sidebars for other DVMRP options.


    The multicasting community has found that DVMRP does not quite suit their needs
    for internal use. Mainly, the protocol does not perform well when put under heavy
    load—whereas PIM-SM is quite scalable. Today, this protocol comes into play when
    connecting your network to the MBONE (http://www.live.com/mbone/), which exclusively
    uses DVMRP.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Multi-Protocol, Multicast Routing with zebra


    Another daemon that''s useful in both the unicast and multicast worlds is GNU''s
    zebra. For unicast, this daemon handles BGP4, OSPF, RIP-1, RIP-2, and more. However,
    in this case, the multicasting functionality has not been added to the main zebra
    release quite yet. You can keep up with its progress at http://www.zebra.org.


    # Configuring mrouted


    Once again, we''re dealing with a single-function daemon. This gives us the benefit
    of a pretty straightforward configuration process. The configuration file for
    mrouted is /etc/mrouted.conf. Some of these settings must be presented in a specific
    order. The chapter will make it clear when this is the case. The rest doesn''t
    matter; so if you don''t see any directions about ordering, the options are presented
    in the sequence as they are typically used.


    The mrouted configuration file often begins with one or more options of the name
    statement. You utilize this command in the format


    ```

    name boundaryname boundaryaddr/masklen

    ```


    These three variables are


    +   - boundaryname. The name that you choose to assign to the particular collection
    of addresses for which you want to set rules.


    +   - boundaryaddr. The network or subnet address you''re naming.


    +   - masklen. The number of binary 1s at the beginning of the netmask for the
    network or subnet that you''re naming.


    Typically, the next line involves the cache_lifetime option. It''s used in the
    format


    ```

    cache_lifetime seconds

    ```


    seconds sets how long information learned through DVMRP is stored in the kernel.
    The default is 300, and the guidelines state that you should keep it between 5
    minutes (300 seconds) and 1 day (86,400 seconds). After this statement tends to
    come one of the following two lines:


    ```

    pruning on

    pruning off

    ```'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'IPaddr tells phyint which physical interface you''re referring to and can be
    an IP address or an interface name, such as eth0. After this, you have a collection
    of options that you can add to suit your needs:


    +   - **disable**. Indicates to route no DVMRP traffic through this interface.

    +   - **metric metric**. The cost for sending data from the multicast source to
    this interface. For an interface to be valid, the metric should be below 31. It''s
    often recommended to use 1.

    +   - **threshold threshold**. The minimum Internet Protocol (IP) time-to-live
    setting the packet must have before mrouted will bother sending this packet along
    to the interface. This value is given in seconds.

    +   - **rate_limit rate_limit**. The rate in Kbits/second that this interface
    will accept multicast traffic, if you want to limit this.

    +   - **boundary boundaryname**. Apply this set of rules to the network block
    defined earlier with the name statement. You can have more than one of these options.

    +   - **boundary boundaryadd/masklen**. Apply this set of rules to the network
    block specified by these variables, which are utilized in the same way you would
    use them in the name statement. You can have more than one of these options.

    +   - **altnet subnet/masklen**. If the interface in question leads to a number
    of subnets, you can refine the data path utilizing this option. subnet refers
    to the network address for the specific subnet you want to set up, and masklen
    is the same as it is defined in the name statement. You can have more than one
    of these options.

    +   - **altnet subnet**. If the interface in question leads to a number of subnets,
    you can refine the data path utilizing this option. subnet refers to the network
    address for the subnet you want to set up and assumes that there is no netmask
    needed. You can have more than one of these options.


    Now we finally get into an order issue. The final possibility here is the tunnel
    statement, which you can utilize to set up a unicast method of transporting your
    multicast data from one mrouted machine to another across unicast-only network
    space. You must define your tunnels after your physical interfaces. The base format
    for this item is tunnel local remote


    As you might guess, local refers to the connected interface on which to start
    the tunnel—either an IP address or device name—and remote refers to the IP address
    of the interface to connect to on the other end to receive the data. All of the
    additional options are identical to those available in phyint: metric, threshold,
    rate_limit, boundary boundaryname, and boundary boundaryadd/masklen. See the previous
    bulleted list for definitions of these options and how to set them.


    For example, I might set up my configuration file to be as close as possible to
    the PIM-SM configuration file as follows:


    ```

    name multi 199.60.103.0/32

    cache_lifetime 21600

    ```'
  merge: -1
  img_proc: true
- pgno: 166
  md: '```

    pruning on

    phyint 199.60.103.90 disable

    phyint 199.60.103.91 rate_limit 60 threshold 10 \

    preference 1029 boundary multi

    phyint 199.60.103.92 rate_limit 60 threshold 10 \

    preference 1024 boundary multi

    tunnel 199.60.103.92 216.17.105.9 rate_limit 60 \

    threshold 10 preference 1024 boundary multi

    ```


    # Running mrouted


    After you’ve set up the configuration file, you’re ready to run the DVMRP daemon,
    mrouted. The usual recommendations apply, such as setting up the daemon to start
    and stop automatically at boot and shutdown, but not until you’ve run it manually
    at first to determine what combination of flags and settings works best for your
    needs. The format for running this daemon is


    ```

    mrouted flags

    ```


    Yes, that’s it. The available flags are


    +   - -p. Disable tree pruning.

    +   - -c file. Utilize the specified configuration file. Be sure to include the
    path in file.

    +   - -d. Enter debug level 2. The debugging levels are outlined in Table 6.1.

    +   - -d level. Enter the specified debug level.


    # Table 6.1 Debugging Levels Available in mrouted


    | Level | Description |

    | --- | --- |

    | 1 | Send all syslogd messages to STDERR. |

    | 2 | Level 1 plus send all messages marked "significant" to STDERR. |

    | 3 | Level 2 plus send messages recording every packet’s arrival and departure
    to STDERR. |


    # Summary


    You have a number of options available to you in the multicasting daemon world.
    If you want to set up wide-scale or internal multicasting, then typically you’ll
    want to use PIM-SM to carry your traffic—or even PIM-DM if you have a very dense
    local setup. One simple method of setting up PIM-SM is to utilize pim6d, a nice
    little single-function daemon. On the other hand, if you need to connect to the
    mbone, you have to use DVMRP, for which you have mrouted. You also can choose
    options such as getting access to the multicast gated, the multicast components
    of zebra when they are available, or try one of the additional options that will
    no doubt appear as multicasting gains ground. Considering the amount of bandwidth
    that unicasting data such as Internet radio consumes, those days aren’t too far
    off.'
  merge: -1
  img_proc: true
