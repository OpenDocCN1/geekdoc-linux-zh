  md: "+   - on { Handle OSPF traffic.\n+   - yes { Handle OSPF traffic.\n\nTypically,\
    \ the first substatement within ospf is defaults, so the beginning of the statement\
    \ often looks like the following:\n\n```\nospf on {\n    defaults {\n```\n\nThe\
