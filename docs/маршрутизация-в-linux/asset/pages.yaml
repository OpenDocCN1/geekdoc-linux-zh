    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_306_0.png)


    # IPTraf


    IPTraf is a network monitoring tool that is geared towards real-time monitoring
    of network traffic. Unlike a sniffer, such as tcpdump, IPTraf reports the statistics
    of the traffic as seen by the Linux network driver. Like a sniffer, IPTraf requires
    the interface to be placed in promiscuous mode; consequently, the program should
    be run as the root user.


    IPTraf installation is very simple and straightforward consisting of unzipping,
    untarring, and running the setup script, so it will not be covered here.


    IPTraf is installed to the /usr/local/bin/ directory, so if /usr/local/bin/ is
    not in your path, then the complete filename /usr/local/bin/iptraf will need to
    be executed to start the program.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# Getting Around IPTraf


    IPTraf is menu driven; therefore, it proves itself almost immediately valuable
    to most network administrators. Figure 15.7, shows IPTraf''s Main menu. The cursor
    keys can be used to navigate the window, or each menu also has a short cut key
    (highlighted) associated with it.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_307_0.png)


    Figure 15.7 IPTraf Main menu.


    A closer look at each of the functions supported by IPTraf follows.


    # IP Traffic Monitor


    The IP traffic monitor allows monitoring of IP traffic on a specific interface
    or on all interfaces recognized by the Linux kernel. Figure 15.8 shows an example
    of the IP traffic monitor.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_307_1.png)


    Figure 15.8 IP traffic monitor screen.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'The top portion of the IP traffic monitor reports TCP connections. Figure 15.8
    shows a telnet connection (port 23) between 192.168.1.254 and 192.168.1.101. The
    IPTraf output also shows that station 192.168.1.254 has sent 372 packets over
    the TCP connection and 192.168.1.101 has sent 366.


    The flags column reports how the flags were set in the last TCP packet as defined
    in RFC 793, "Transmission Control Darpa Internet Program Protocol Specification."
    Table 15.2 summarizes the TCP flags.


    | Table 15.2 IP Traffic Monitor TCP Flags |

    | IP Traffic Monitor Abbreviation | TCP Abbreviation | Meaning |

    | A | ACK | Acknowledgment |

    | P | PSH | Push all data to queue |

    | U | URG | Packet is marked urgent |

    | S | SYN | Synchronization during handshaking. |


    IPTraf also will report resets with RST, unacknowledged FINs with DONE, and a
    properly closed connection with CLOSED. The packet and window size of each of
    the connections also can be viewed by pressing the m (more) key.


    The bottom window in IP traffic monitor shows the most recent non-TCP traffic.
    In Figure 15.8, this was ICMP-echo requests (pings) and an address resolution
    protocol (ARP) request.


    The bottom of the screen contains two lines. The first line is a real-time view
    of the packet count for IP, TCP, UDP, ICMP and non-IP traffic.


    The second line is the menu for IP traffic monitor. The up and down arrows let
    you scroll through information when more than one screen is available. The w key
    switches between the top TCP window and the bottom, all other traffic window.


    As mentioned, the m key will report the packet and window size of the TCP connections.


    The s key allows the TCP connections to be sorted either using the packet or byte
    count, which will result in the same ordering; however, the command is useful
    because the IP traffic monitor does not sort in real time. With the sort command,
    the connections with the most traffic will "float" to the top of the list.


    The x key is used to return to IPTraf''s main window.


    # General Interface Statistics


    The General Interface Statistics screen gives a simple breakdown of traffic for
    all interfaces as shown in Figure 15.9. The counters include IP packets, non-IP
    (such as IPX), and bad IP, which are packets that can be identified by the IP
    header, but something in the header is not compliant with the IP protocol.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_309_0.png)


    Figure 15.9 General Interface Statistics screen.


    # Specific Interface Statistics


    The Specific Interface Statistics allows the administrator to examine the IP statistics
    related to a particular configured interface. Figure 15.10 shows the statistics
    for eth0.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_309_1.png)


    Figure 15.10 Specific Interface Statistics for eth0.


    In addition to the breakdown of the types of IP packets, the lower portion of
    the screen also shows the throughput—both inbound and outbound. The specific interface
    statistics can be useful for quickly identifying possible problems when troubleshooting
    a network problem. Refer back to Figure 15.10, and you''ll notice the number of
    ICMP packets is very high when compared to the total number of packets. A ping
    flood caused this.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Statistical Breakdown


    The Statistical Breakdown screen reports the number of packets received by two
    criteria, either the packet sizes on a particular interface or the TCP/UDP port
    of a particular interface. The statistical breakdown by packet size is shown in
    Figure 15.11 and by TCP/UDP port in Figure 15.12.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_310_0.png)


    Figure 15.11 Statistical Breakdown—packet size.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_310_1.png)


    Figure 15.12 Statistical Breakdown—TCP/UDP port.


    # LAN Station Monitor


    The LAN Station Monitor reports statistics based upon the Layer 2 address, or
    with Ethernet, the MAC address. Its use is limited, but it can be used in conjunction
    with other tools such as a sniffer to locate Layer 2 related problems. The LAN
    Station Monitor is shown in Figure 15.13.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_311_0.png)


    # TCP Filter and Other Filters


    While examining statistics, it is often useful to examine only certain traffic.
    The TCP Filters and Other Filters menu allow you to define which traffic should
    or should not be displayed. The TCP filters apply only to TCP traffic. Should
    other types of traffic be filtered, the Other Filters option should be chosen.


    Creating a filter is straightforward—with only a couple of necessary steps.


    After choosing TCP Filter, select Define New Filter, which will prompt for a description
    of the filter as shown in Figure 15.14. Enter Telnet Traffic Only into the description.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_311_1.png)


    After entering the description, the screen shown in Figure 15.15 will prompt for
    IP addresses and ports. The first and second fields are simply the source and
    destination address in either order. The wildcard mask is actually the netmask
    that will determine how many addresses are included in the range.'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'Because we are only filtering for telnet, 0.0.0.0 is entered in the address
    and wildcard fields Telnet''s port number, 23, is entered in the Port Number field.
    Be sure to use the Tab key to move from field to field—the Enter key will create
    the entry.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_312_0.png)


    Figure 15.15 TCP filter, IP addresses, and Ports Entry screen.


    After pressing Enter, the filter function allows you to enter additional addresses
    and ports. Press CTRL-X to exit out of the Define TCP filter.


    Before using the filter with any of IPTraf''s functions, the filter must be applied.
    The filter is applied using the Apply Filter within the TCP filter section. After
    Apply Filter is chosen, a list of TCP filters is shown. Select the appropriate
    filter using the cursor keys and pressing Return on the correct entry. Exit out
    of the TCP Filter section and then choose the appropriate IPTraf function that
    should be used with the filter applied. Figure 15.16 shows the filter being used
    with the IP Traffic Monitor.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_312_1.png)


    Figure 15.16 IP Traffic Monitor with TCP filter.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'Should the protocol being examined not be TCP, the Other Filters item should
    be chosen at the Main menu. Other filters are created similarly to the TCP and
    follow the same guidelines with addresses and ports.


    In addition to covering monitoring and analyzing of network resources, we need
    to take it the next step and address quality of service issues. This topic is
    tackled in the next section.


    # Quality of Service (QoS)


    Bandwidth in data networks, although a limited resource, is generally designed
    and used in a best effort method: Any retransmissions are in the best case taken
    care of by the application, or in the case of TCP by the protocol itself. However,
    the commercialization of the Internet and applications requiring near real-time
    network support has driven the need for guaranteeing bandwidth better than best
    effort.


    For example, many organizations require that incoming web requests be given priority
    over most other traffic—a possible customer that is visiting the web site should
    not have a "slow" connection to the web server due to email that can wait without
    the application being affected.


    Another application requiring better than best effort routing is a voice application.
    Voice-over technology and the whole convergence market has created additional
    pressure on IP technology to support improve QoS support.


    There are four common methods used to apply policy to IP traffic: source and/or
    destination address, source or destination port, service bits in the IP address,
    and a mixture of the three methods. When bits in the IP address are used, the
    bits are referred to as Type of Service Bits if the methods described in RFC 791
    (or 1349, which modified the original RFC 791 spec) are used. If the bits are
    used with the methods described by the Differentiated Services working group (http://www.ietf.org/html.charters/diffserv-charter.html),
    the bits are referred to as DS bits.


    If the IP address, UDP, or TCP port is used, the traffic policing is referred
    to as a class of service. Some implementations of QoS policing also allow interface-based
    policies, which also are considered class of service.


    # Type of Service: RFC 791 and 795


    IP''s original method to provide for traffic is the IP type of service (TOS) field
    in the IP header which is covered in RFC 791, "Internet Protocol Darpa Internet
    Program Protocol Specification," and RFC 795, "Service Mappings."


    The TOS field is eight bits made up of three bits that define precedence, one
    bit delay, one bit throughput, and one bit for reliability. The remaining two
    bits were reserved for future use and are set to zero.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Linux Support of TOS


    Linux supports setting the TOS bits using filtering under all three packet filtering
    methods: ipwadm, ipchains, and netfilter.


    Additionally, Linux also can use the appropriate ICMP error messages when a type
    of service was requested that it should not forward—the network unreachable for
    the specified IP type-of-service and host unreachable for specified IP type-of-service.
    Their use, however, should likely just be used within the same autonomous system
    given that many networks filter out many of the ICMP message types. (Some organizations
    filter ICMP exclusively.)


    # Examples of Setting the TOS Bits


    The complexity of implementing TOS on Linux is determined by the network design
    and engineering required in the core network, which will vary depending on the
    systems supported and complexity. Configuring Linux to set the TOS on packets
    traversing the Linux router is quite simple after a package that supports configuring
    the TOS is installed such as ipwadm, ipchains, or netfilter.


    # Example with ipchains


    Giving priority to web traffic was mentioned at the beginning the this section
    on QoS, so here is an example of setting the IP TOS for web traffic using ipchains:


    ```

    /sbin/ipchains -A output -p tcp -d 0/0 80 -j 0x10

    ```


    Table 15.3 lists the various values and type of services based upon RFC 1349,
    "Type of Service in the Internet Protocol Suite" (paragraph 4). The Linux implementation
    also includes the Must Be Zero bit following the four bits assigned to the TOS
    for a total of five bits. This is likely one of the most common errors and troubleshooting
    tasks Linux administrators face when integrating a Linux router into an existing
    network with TOS support.


    As another example, ftp, on the other hand, might need more of an emphasis on
    reliability, so the following ipchains command would be more appropriate for ftp.


    ```

    /sbin/ipchains -A output -p tcp -d 0/0 21 -j 0x04

    ```


    In Table 15.3 the mnemonics for the various services also are defined. The mnemonic
    can be used instead of the hexadecimal. For example, this ipchains command is
    interpreted the same as the preceding command.


    ```

    /sbin/ipchains -A output -p tcp -d 0/0 21 -j Maximize-Reliability

    ```'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# Table 15.3 RFC 1349 TOS Settings


    | Mnemonic | Hex Value | Binary Value from RFC 1349 | Binary Plus Must Be Zero
    Bit | Decimal |

    |---|---|---|---|---|

    | Normal-Service | 0x00 | 0000 | 00000 | 0 |

    | Minimize-Cost | 0x02 | 0001 | 00010 | 2 |

    | Maximize-Reliability | 0x04 | 0010 | 00100 | 4 |

    | Maximize-Throughput | 0x08 | 0100 | 01000 | 8 |

    | Minimize-Delay | 0x10 | 1000 | 10000 | 16 |


    ipchains also can inspect the TOS bit to determine what the TOS bit should be
    mapped to by the packet filter. The parameter for matching this is the -m parameter:


    ```

    /sbin/ipchains -A output -p tcp -d 0/0 21 -m 0x02 -j Maximize-Reliability

    /sbin/ipchains -A output -p tcp -d 0/0 21 -m 0x02 -j Maximize-Reliability

    ```


    Should an ftp session connect to the Linux node and the TOS bits set to 0000 or
    0001 (remember the 0001 + 0 binary must be zero bit.), the TOS will be changed
    to 0x04. If the TOS bits have a 0x08 or 0x10 value then no change will be made
    to the packet with these rules.


    # DIFFSERV


    As mentioned, DIFFSERV is one of the IETF''s current endeavors to improve quality
    of service on IP networks—by adding new definition to the interpretation of the
    TOS bits. The DIFFSERV groundwork has been added to the 2.4 kernel, but the applications
    to effectively use DIFFSERV are still in development and documentation is very
    scarce. However, further development of DIFFSERV is likely, (check http://diffserv.sourceforge.net/)
    so the Linux DIFFSERV is likely the best place to learn of new developments, as
    well as subscribe to mailing lists covering the Linux implementation of DIFFSERV.


    Of course Linux can act as an edge device to a DIFFSERV domain and set the TOS
    bits according to how the DIFFSERV access router expects to see the bits, which
    it interprets as DS bits.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Summary


    This chapter has covered two very important topics: network analysis and quality
    of service. It started with several tools for network analysis (NET-SNMP, MRTG,
    and IPTraf) that should play a very important role in network support and analysis.


    Network analysis provides a look into the network and helps define what the network
    performs and what it can likely perform in the future. Providing QoS is currently
    one of the most challenging aspects of networking requiring both analysis and
    an understanding of the QoS concepts covered here.'
