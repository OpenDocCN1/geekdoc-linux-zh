- pgno: 92
  md: '# IPv4 Routing Issues


    As we all know, when you have a large network, address space is paramount. Not
    only do you have to break your subnets into identical pieces with IP v4, but even
    worse, you cannot utilize the first and last subnets. Therefore, even though a
    two-part subnet was included in Table 4.5, you could not even use these subnets
    in IP v4. So your four-part subnet is really two. Your eight is really six. The
    sixteen is fourteen, and the thirty-two is thirty. In this case, you actually
    give up less bulk address space by creating more subnets; however, you lose so
    many host IP addresses to new network and broadcast subnet addresses that it’s
    not a useful trick.


    The other thing to keep in mind is the information that an IP v4 router carries.
    All the external router knows is the network address and the netmask for that
    network. When the data reaches your internal routers, they then can send information
    appropriately to the correct subnet.


    # Classless IPv4 Addressing


    While many of the tenets of IP v4 addressing apply here, such as there being 32
    bits in an address divided into four bytes, separated by dots, the new concept
    you need to become familiar with is Classless Interdomain Routing (CIDR). This
    subset of IP v4 adds such words to our vocabularies as supernetting and Variable
    Length Subnet Masks (VLSM). So, buckle your seatbelts—it’s going to be a fun ride.


    # Differences Between Classful and Classless IPv4 Addressing


    There is no class A, B, and so on in CIDR IP v4. No, this does not cause chaos.
    Instead, all xxx.xxx.xxx.xxx (decimal) combinations come in turn with a bit mask
    (also called a prefix length). While this item is utilized in IP v4 as a shortcut
    instead of typing out the whole netmask, we chose to cover the math behind it
    in the following section, "Classless IP v4 Math," because calculating these values
    is an absolutely necessary skill. Everything has limitations. Classless IP v4
    does not allow you unfettered ability to assign address blocks as you see fit.
    We’ll get more into this when we actually start doing the math in the next section.


    In Classful (original) IP v4, there are 32 bits (8 bits per byte x 4 bytes) in
    an address, and we use a subnet structure similar to what’s shown in Figure 4.2.
    All subnets are the same size and are contained within a single larger network.
    While handy, this is a pretty rigid framework that leads to much loss of host
    addresses and prevents any further subdivisions.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_93_0.png)


    # Classless IPv4 Math


    As was said before, almost all of CIDR works properly because of bit mask or prefix
    length assignments. A bit mask is written in the format /xx, where the x''s merely
    represent digits. In IP v4, only /8, /16, or /24 bit masks exist. These values
    correspond to the number of bits used for the network portion of the IP address.
    So, for a class A, you have nnnnnnnn.hhhhhhhh.hhhhhhhh.hhhhhhhh, or /8. For class
    B, you have nnnnnnnn.nnnnnnnn.hhhhhhhh.hhhhhhhh or /16, and for C you have nnnnnnnn.nnnnnnnn.nnnnnnnn.hhhhhhhh
    or /24.


    Classless IP v4 tosses the whole address class thing out the window. However,
    as you were warned, there are still limits on what you can do. The number of addresses
    you give to a network in this system must be a power of two: 2, 4, 8, 16, 32,
    64, 128, 256, 512, and so on. Notice that this didn''t say the bit mask has to
    be a power of two.


    We''re talking about addresses right now.

    So, how do you figure out what bit mask to use for a particular host range? Once
    again, let''s look at the IP address template xxxxxxxx.xxxxxxxxxx.xxxxxxxxxx.xxxxxxxxxx.
    The bit mask (network bits) and host bits must add up to 32, as there are 32 bits
    in the addressing scheme. Let''s say that for our campus setup we need an address
    block of 4096. It would take 12 bits to express 4096 unique addresses because
    2 to the 12th power is 4096. So, that''s 12 host bits, which leaves the remaining
    20 for network bits. So this address ends in a /20. It doesn''t matter what the
    network bits are. In CIDR, machines do not assume anything from the network bits.
    We''ll keep repeating this because it is one of the biggest changes you''ll have
    to get used to.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Though we can''t entirely get rid of the netmasks, it''s pretty easy to make
    them.

    Let''s go back to our /20 network, which looks like nnnnnnnn.nnnnnnnn.nnnnnnnn.hhhhhhhh.
    We''re using all of the network bits in the first and second bytes so they both
    have a decimal value of 255. The third bytes only has the first four network bits
    in use, and their positions add up to 128 + 64 + 32 + 16, or 240. The last position
    is entirely host bits, so it''s 0. That gives us a netmask of 255.255.240.0. Table
    4.6 gives the bit mask and netmask particulars for a range of CIDR possibilities.


    # Table 4.6 The Bit Mask, Netmask, and Number of Addresses Within a Range of Classless
    Domain Possibilities


    | Bit Mask | Netmask | Host Addresses |

    |---|---|---|

    | /17 | 255.255.128.0 | 32,766 |

    | /18 | 255.255.192.0 | 16,382 |

    | /19 | 255.255.224.0 | 8,190 |

    | /20 | 255.255.240.0 | 4,094 |

    | /21 | 255.255.248.0 | 2,046 |

    | /22 | 255.255.252.0 | 1,022 |

    | /23 | 255.255.254.0 | 510 |

    | /24 | 255.255.255.0 | 254 |

    | /25 | 255.255.255.128 | 126 |

    | /26 | 255.255.255.192 | 62 |

    | /27 | 255.255.255.224 | 30 |

    | /28 | 255.255.255.240 | 14 |

    | /29 | 255.255.255.248 | 6 |


    Notice that the host addresses are all a power of 2 minus 2. Because a network
    still needs a network address and a broadcast address, this accurately represents
    how many hosts you get per piece.


    # Applying Classless IPv4 Addressing Across Subnets


    The concept of subnets might not seem to make a lot of sense when we start talking
    about classless networking, but it''s still there. After all, what if we''re assigned
    an address chunk and need to break it down into smaller pieces? Further still,
    maybe we don''t want all of our subnets to be exactly the same size. Here''s where
    we get into those Variable Length Subnet Masks (VLSMs).


    In VLSM, you can apply multiple subnet masks to the same overall network to create
    subnets of different sizes. We do this in a hierarchal way. We create a collection
    of same-size larger subnets, and then where we need smaller networks, we subnet
    the subnet. We can keep breaking these down into smaller networks as far as we
    need to.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Here is where the *extended-network-prefix* comes in. Let’s go back to that
    /20 network we discussed in the previous section. The /20 is the bit mask, as
    we already discussed. So the network bits and bytes are structured like nnnnnnnn.nnnnnnnn.nnnnhhhh.hhhhhhhh.
    Now that we have such a large address space—capable of containing 4,094 hosts—we
    need to break it down further. In the case of our example network, we have a huge
    autonomous system for the entire university that contains two smaller but still
    huge routing areas, one for the campus and one for the autonomous system.


    So first we want to divide our 192.168.240.0/20 network into two large subnets,
    one for each. As you know, 2 is 2 to the power of 1, which means that we only
    need a single bit to handle this subnetting. We now need to use a new series of
    symbols to help keep everything clear in our address bits. The n stands not just
