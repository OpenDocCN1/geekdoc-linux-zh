- pgno: 320
  md: '# Linux Routing Resources


    THIS APPENDIX CONTAINS POINTERS TO the many routing resources out there for the
    Linux administrator. While special care has been taken to choose mostly stable
    links, do remember that URLs are transient.


    # Linux Routing Daemons


    We''ve talked about many routing daemons throughout this book, and there are more
    we didn''t have room to cover. Table A.1 contains the most complete list of multi-protocol
    routing daemons available for Linux users that we could pull together, listed
    by homepage. The key for this table is


    +   - y. Feature is supported in at least one version of this program.

    +   - n. Feature is not supported in any version of this program.

    +   - p. Support might or might not be implemented yet, but it is currently under
    development.


    As usual, the focus here is specifically on the Internet Protocol (IP).'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# Table A.1 Multi-Protocol Linux Routing Daemons and Their Niches


    | Name | Homepage | Unicast | Multicast | IPv4 | IPv6 |

    |---|---|---|---|---|---|

    | bird | http://bird.network.cz/ | y | n | y | y |

    | gated | http://www.gated.org/ | y | y | y | y |

    | mrdt | http://www.mrdt.net/ | y | y | y | y |

    | zebra | http://www.zebra.org/ | y | p | y | y |


    Table A.2 contains the most complete list of single-protocol Linux routing daemons
    we could pull together.


    # Table A.2 Single-Protocol Linux Routing Daemons and Their Niches


    | Name | Home | Protocol |

    |---|---|---|

    | mrouted | ftp://parcftp.xerox.com/pub/net-research/ipmulti/ | DVMRP |

    | pim6d | ftp://catarina.usc.edu/pub/pim/pimd/ | PIM-SM |

    | pim6d-dense | http://antc.uoregon.edu/PIMDM/pimd-dense.html | PIM-DM |

    | routed | Comes with all major Linux distributions. | RIP-2 |


    # Linux Routing and Traffic Management Tools


    Network administrators always seem to know yet one more statistic to help determine
    cost and use efficiency data for network connections, security of data, and more.
    There is a wealth of networking tools out there for the Linux world. Specifically,
    this section focuses on tools used in conjunction with routing.


    Table A.3 contains a list of programs we thought you might find useful in your
    search to automate your job as efficiently as possible.


    # Table A.3 Linux Tools Used in Conjunction with Routing


    | Name | Home | Description |

    |---|---|---|

    | CIPE | http://sites.inka.de/sites/bigred/devel/cipe.html | The Crypto IP Encapsulation
    (CIPE) project is working on routers that encrypt IP packets for transmission
    to specific destinations. |

    | Edge Fireplug | http://edge.fireplug.net/ | Specialized Linux distribution that
    turns a machine into essentially a network routing and firewalling appliance.
    |'
  merge: -1
  img_proc: true
