    only remaining place to go to from Eng is Ag, and from Math there''s Ag and Abacus.
    Once again we have to take the fastest central path into account to determine
    what happens. Because Math is part of the fastest path, we follow that one first.
    This means that Math leads to both Ag and Abacus, and Eng is another dead end.
    The algorithm has now finished its job, as shown in Figure 1.21.'
