- pgno: 62
  md: '+   3. Poin sends a prune to Trud.

    +   4. East/Phys sends a prune to Hum.


    DVMRP continuously examines the tree''s prune messages, which actually have a
    specified life span. Whenever it finds a router that meets the two tests listed
    next, DVMRP then stops sending packets for this multicast channel to that router.


    +   Received prune messages from all of the routers downstream from it—as is the
    case for routers Trud and Runk

    +   Sent a prune message for itself to its own upstream—as is the case for router
    Trud


    So, router Trud would no longer receive packets for this channel, along with Poin,
    until the prune''s life span ended. The next packet coming from the specific source
    and to the specific channel that this prune message referred to would be broadcast
    using TRPB, and the pruning process would start all over again.


    # How It Works


    Now let''s take a closer look at how DVMRP works over the long haul. To start,
    all of the DVMRP routers specified in Figure 2.1 were just set up. They might
    have already been providing routing with OSPF or RIP-2, but DVMRP was installed
    at this time because you''ve decided you want to provide multicast services for
    your users.


    All of the routers begin what should sound like a familiar neighbor discovery
    process. Each router sends a probing message through all of its multicast-capable
    interfaces as it comes up. As they begin receiving probe messages from each other,
    a list of all of the neighbors they have gotten probes from for that specific
    interface gets included in the probe. For example, look at Emerald. It sends out
    probe messages on its interfaces, and Hum receives one of these messages on a
    specific interface. Router Hum, in turn, sends out a probe message on each of
    its network interfaces. Now that it has heard from Emerald, it lists emerald as
    one of the neighbors it recognizes within any probe message sent through the interface
    that it learned of Emerald through. In fact, the first time a DVMRP router gets
    a probe from a neighboring router it''s never heard of before, the router sends
    its entire routing table to the new neighbor.


    When Emerald sees its name in Hum''s list, it knows it has a two-way working connection
    with router Hum. From then on, every 60 seconds the routers send each other copies
    of their routing tables and make sure that they have all of the most up-to-date
    information. Emerald also now adds Hum to its own list of discovered neighbors,
    so that when Hum receives the next probe it knows it has a two-way connection.
    This process happens throughout the network until all of the multicast routers
    have discovered each other.


    DVMRP essentially uses this process to keep a collective routing table for multicast
    traffic. Every 10 seconds, another probe goes out to each multicast-capable interface
    from each DVMRP router. The collective routing table shifts and changes as neighbors
    appear and disappear—if they are not heard from within 35 seconds.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Another issue that must be dealt with on an ongoing basis is making sure that
    routers connected to the same networks are not providing duplicate services. This
    is a waste of the additional router''s processing time as well as bandwidth. This
    is where we return to the fact that the letters "DV" in the protocol name stand
    for Distance Vector. If multiple routers are capable of sending data from the
    transmission source to a specific network, then whichever router has the shorter
    path back to the source becomes the designated forwarder—or the router that sends
    data from this source to this point.


    One concern that still exists at this point is data trying to loop around through
    routers it has already traveled. When a router chooses its designated forwarder,
    it uses the poison reverse technique discussed earlier. The DVMRP implementation
    of poison reverse involves sending a copy of the routing table with the metric
    number of hops the data has to make to go from point A to B—values from the router
    to its designated forwarder set to infinity (32) plus the real cost. This actually
    signals the designated forwarder to mark the router as dependent. The list of
    dependencies is used to help manage the pruning process.


    Eventually, DVMRP builds a routing table for each interface on this router. The
    table contains the following information for each source that sends data to a
    particular multicast channel:


    +   - **The IP address for the source and the interface through which it sends
    data.** A DVMRP routing table entry only contains data for one source.

    +   - **The IP address for the multicast channel this source specified.** A DVMRP
    routing table entry only contains data for one source sending to one specific
    multicast channel.

    +   - **The interface on which the packets for this source/destination pair arrives.**
    This would be the IP address assigned to the interface.

    +   - **The total cost of data coming from the source to this interface.** Individual
    costs of hop-to-hop are not kept in the routing table.

    +   - **The major and minor version of DVMRP running on the remote interface.**
    This ensures that newer versions will not overwhelm older ones with information
    they cannot utilize or manage.

    +   - **The DVMRP capabilities available on the remote interface.** Most of these
    are used for backwards compatibility, but not all.

    +   - **The Generation ID attached to the last probe message from the remote interface.**
    This identification number only changes when a router is restarted or its interface
    is taken down and then brought back up. It also is transmitted with every probe
    message. When the Generation ID changes, it signals neighbor routers to send a
    copy of their entire routing table to the remote interface. Doing this ensures
    that everyone always has up-to-date information.'
  merge: -1
  img_proc: true
