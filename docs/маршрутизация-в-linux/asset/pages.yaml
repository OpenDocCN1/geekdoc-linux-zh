  md: '# Summary


    In this chapter we’ve taken a quick look at some of the changes that affect routing/networking
    in the Linux 2.4.x series. There are far too many special cases to provide a comprehensive
    look at every scenario, but we hope that this will give you a general idea of
    what to expect from the "new" kernel.


    When compiling a new kernel, be sure to read through Chapter 13, "Building a Routing
    Kernel," which gives a thorough overview of compiling the Linux kernel.


    We’ve also taken a look at some of the "advanced" routing tools for Linux and
    setting up a basic VPN. Though by no means an exhaustive look at VPNs, this should
