  md: 'Now the system must be configured to run mrtg on a regular basis. Use crontab
    with the -e option to make mrtg run every five minutes:


    ```

    [root@lefty mrtg-2]# crontab -e

    ```


    and add the following entry:


    ```

    0,5,10,15,20,25,30,35,40,45,50,55 * * * * /usr/local/mrtg-2/bin/mrtg

    /usr/local/mrtg-2/cfg/mrtg.cfg

    ```


    Additional routers and nodes can be added to the mrtg.cfg with the following command:


    ```

    [root@lefty mrtg-2]# bin/cfgmaker --global ''WorkDir: /home/http/html/mrtg'' readaccess@192.168.1.254
    >>/usr/local/mrtg-2/cfg/mrtg.cfg

    ```


    As mentioned, the data is still in a somewhat raw format. MRTG includes a tool
    called indexmaker that will create an index page that links to all the nodes being
    monitored. To create an index for this example, the following command is used:


    ```

    [root@lefty mrtg-2]# bin/indexmaker /usr/local/mrtg-2/cfg/mrtg.cfg

    > /home/http/html/mrtg/index.html

    ```


    # Permissions and Ownership Issues With the index.html File


    The index.html file''s permissions and ownership might need to be manually set
    to make the file readable by the owner of the web server process.


    This creates the index.html with URLs pointing to all the nodes via a graphic
    summary—as shown in Figure 15.5.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_305_0.png)


    Figure 15.5 MRTG with index page.'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'After a new node has been added using cfgmaker, be sure to run the indexmaker
    again. After mrtg has been configured with the nodes to monitor and given time
