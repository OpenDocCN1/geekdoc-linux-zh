- pgno: 100
  md: 'IPv6 addresses are not displayed in IP v4 format. Instead, they’re broken into
    eight parts. Each part contains two bytes—or sixteen bits—separated by a colon.
    Therefore, bit-wise they look pretty ominous:

    xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx, where “x” stands
    for one bit. Byte-wise, it isn’t as overwhelming: bb:bb:bb:bb:bb:bb:bb:bb, where
    “b” stands for one byte.


    To complicate things even further, IP v6 addressing isn’t typically discussed
    in terms of bits and bytes. IP v6 addresses are written in hexadecimal—base 16,
    compared to a bit’s base 2 and decimal’s base 10. A single byte is equivalent
    to one hexadecimal pair, so what we end up with is something that looks more like
    the following in terms of placeholders: HHHH:HHHH:HHHH:HHHH:HHHH:HHHH:HHHH:HHHH,
    where H is one half of a hex pair.


    Because the world of IP v6 is so different from IP v4, let’s take a moment to
    go over some of the basics that we didn’t need to look at for IP v4. These issues
    revolve around special numbers, what types of addresses all interfaces have to
    have, and how to recognize different address types. This chapter will not get
    into the many shortcuts for how to write IP v6 addresses, however. See RFC 2373
    for more information on this front.


    There are a few special host addresses in IP v6 just as there are in IP v4. One
    of these is the loopback address, 0:0:0:0:0:0:0:1, which is equivalent to IP v4’s
    127.0.0.1—you also can write the IP v6 loopback address using a shorthand technique
    as ::1. Another is the unspecified address, 0:0:0:0:0:0:0:0, which is utilized
    when no address has been given yet.


    There are, however, special IP v6 addresses for broader use. There are prefixes
    that mark addresses of note, which are called Format Prefixes. Many of these are
    reserved but don’t yet have a specific function—see section 2.4 in RFC 2373 for
    that set. Table 4.9 lists those that have already been assigned a meaning.


    # Table 4.9 IPv6 Reserved Prefixes That Have an Assigned Purpose


    | Decimal Prefix | Hexadecimal Prefix | Reserved Purpose |

    |---|---|---|

    | 00000000 | 00 | Not used. |

    | 00000010 | 02 | For use by the Network Service Access Point (NSAP)—if you’re
    interested in learning more about NSAP, see RFC 1706. |

    | 00000100 | 04 | For use by Internet Package eXchange (IPX), a Novell networking
    protocol. |

    | 00100000 | 40 | For use by the new Unicast aggregation features available in
    IP v6—see RFC 2374. |'
