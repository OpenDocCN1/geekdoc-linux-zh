    # Classless IPv4 Routing Issues


    It might sound like Classless IP v4 puts a huge burden on the Internet''s routers.
    Even worse, it could explode the routing tables into an unmanageable size that
    slows down all Internet traffic. Fortunately this is not the case. Not only does
    Classless IP v4 allow you to create subnets of subnets of subnets, it also allows
    you to hide the layers from the outside world—if you plan your network correctly.
    See Chapter 7, "Planning Router Layout and Function," for further information.


    A well-planned VLSM setup includes route aggregation, a concept that allows you
    to hide subnetting from the outside world. Let me break down the VLSM subnets
    created in the previous section, "Applying Classless IP v4 Addressing Across Subnets,"
    to demonstrate this concept. Each of the subnet layers was mathematically derived
