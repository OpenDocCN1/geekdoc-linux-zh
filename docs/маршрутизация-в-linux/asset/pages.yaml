    +   - The *shortest paths tree* we calculated earlier. Emerald specifically has
    the tree shown in Figure 1.21. Remember, each machine has its own tree with OSPF.

    +   - The cost and path for sending data to the backbone.


    Emerald has already used the algorithm we covered earlier to calculate the shortest,
    fastest paths to all of the other routers. Emerald then knows not only what the
    next hop will be, but also knows every step of the journey that it would like
    the data to take. What Emerald does with the data is simply forward it to router
    Hum, which takes over from there.


    Router Hum also has the entire map of the network with costs and both directions.
    However, it does not use Emerald’s fastest, shortest path calculations. Hum does
    its own. I’ll leave the algorithm part as an exercise for you, but what Hum comes
    up with in the end is shown in Figure 1.23.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_47_0.png)


    # Figure 1.23 OSPF algorithm results from Hum’s point of view.


    Hum sees Arts as its fastest way to get to Abacus, so it forwards the packet there.
    Arts then checks its own routing table and fastest, shortest path calculations,
    as shown in Figure 1.24.'
