    # Configuring Route Importation


    Your routers don''t just advertise your network''s information to the Internet
    or external networks. They also receive advertisements from the outside containing
    vital data for directing packets from place to place. This data is not just collected
    blindly into a routing table by gated. You have to set up the rules for how the
    importation of routes operates on each gated router.


    The gated.conf file allows you to set up different rules for each protocol type.
    They''re covered here in the order they were covered in Chapters 1 and 3. That
    means the first item of interest is how you set up how RIP routes are imported.


    You start the RIP import statement in the following format:


    ```

    import proto rip

    ```


    From here, you might prevent routes from being imported from other routers using
    the following structures:


    +   - restrict; Do not install any RIP routes matching in the routing table.


    +   - interface ilist restrict; Do not install any RIP routes that match ilist
    in the routing table. To build ilist: use all if you want to match everything;
    the format xxx.xxx.xxx.xxx to match a full IP address; the formats xxx.xxx.xxx.*,
    xxx.xxx.*, or xxx.* to match partial IP addresses; eth* to use a wildcarded device
    name; or the full name of the device such as eth0.


    +   - gateway glist restrict; Do not install any RIP routes that match glist in
    the routing table. To build glist, use the same rules as discussed previously
    but apply them to the gateways that matching data packets would travel through
    rather than the interface from which they were first sent.


    Alternatively, you might instruct gated to import routes in a similar fashion.
    Once again, it starts with:


    ```

    import proto rip

    ```


    After this you have one of two options:


    +   - interface ilist. Install RIP routes that match ilist in the routing table.


    +   - gateway glist. Install any RIP routes that match glist in the routing table.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'Subsequently, you might have one of these two lines so far:

    import proto rip interface ilist

    import proto rip gateway glist


    Next you have the choice of adding or not adding preference value, which is used
    to assign how preferred a route from RIP matching the given rules is compared
    to its alternatives. The default is 100. So now you might have one of the following
    four statements:


    ```

    import proto rip interface ilist

    import proto rip gateway glist

    import proto rip interface ilist preference value

    import proto rip gateway glist preference value

    ```


    No matter which of these you choose, you now add an opening curly brace ({) at
    the end of the line and drop down to the next line. This new line of code starts
    with one of the standard ways of specifying a host or network, which will be illustrated
    by repeating the example formats given earlier:


    ```

    192.168.15.0

    192.168.15.0 mask 255.255.255.0

    192.168.15.0 masklen 24

    all

    host 192.168.15.5

    ```


    After starting the line with one of the above structures, you might end it with
    only a semicolon, or you might proceed with one of the following additions:


    +   - restrict; Do not import the routes that meet this rule.

    +   - preference value; Import the routes that meet this rule and assign them
    the specified preference value.


    Finally, at the very bottom of the statement, add:

    ;


    Build as many of these RIP rules as necessary. You can put multiple statements
    between the curly braces, as long as each of these is meant to match the same
    list of interfaces or gateways. If you want to set other rules for other interfaces
    or gateways, you need to build a whole new statement.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Handling Redirect Routes


    The simplest protocol on the Internet is the Internet Control Message Protocol
    (ICMP). This protocol sends packets with one single command inside. For example,
    the packet might contain the command echo, which means it''s a ping packet, and
    the receiving machine will send back a response, giving the originator a metric
    for how long it took the data to get to the recipient and back. Another command
    an ICMP packet can contain is redirect.


    At certain times there are temporary reasons that a nondefault router is suddenly
    a better choice for sending data to a specific machine than the default—typically
    for reasons of overlapping network space or when there are multiple subnets running
    on the same hardware. In this case, an ICMP redirect message is sent to the default
    router, telling it that all traffic for the target should go through this other
    router instead of the original default. After the original router, destination
    router, and destination machine are all notified, the data travels efficiently.


    Redirects are typically set with low times-to-live. A redirect routing table entry
    in gated often lasts only three minutes.


    Now you need to tell gated how to handle incoming routing data from OSPF. The
    first thing to understand is that gated has no control over what routes it imports
    from OSPF within the area and autonomous system—also referred to as AS. However,
    you can control the information imported from outside your AS. You start this
    statement with:


    ```

    import proto ospfase

    ```


    After this, you might or might not want to add tag value afterwards. An OSPF tag
    consists of the originating router''s ID, plus a checksum value that helps to
    ensure that the packet''s contents have not been mangled during transmission.
    So, if you want to watch for routing updates from a specific router within another
    AS, add this item on the end of your ospfase statement.


    If you want to use this rule to prevent any external AS OSPF routes from being
    imported, then just end this statement in restrict;, such as:


    ```

    import proto ospfase restrict;

    ```


    However, if you want to use this rule to enable a specific collection of external
    AS OSPF routes to be imported, you need to continue the statement longer. First,
    if you don''t want the preference for OSPF routes learned from external autonomous
    systems to be 150, continue the statement by adding preference value. At this
    point, you start a clause with a curly brace:'
  merge: -1
  img_proc: true
- pgno: 147
  md: "After you specify which networks, hosts, and so on this rule applies to, you\
    \ can add either the word restrict to prevent these specific routes from being\
    \ imported or preference value—where once again the default preference is 150.\
    \ The final format looks similar to:\n\n```\nimport proto ospfase\n    options\
    \ {\n        192.168.15.* preference 200;\n    };\n```\n\nNow we move on to telling\
    \ gated how to handle routes advertised through EGP and BGP. As usual, there are\
    \ a number of ways to accomplish this. You start either statement with the now\
    \ familiar:\n\n```\nimport proto\n```\n\nIf you're configuring EGP route importation,\
    \ you continue this with:\n\n```\nimport proto egp autonomoussystem\n```\n\nNext\
    \ add the AS number for the autonomous system to which you want this rule to apply.\
    \ After this, if you do not want to save routes learned from this AS through EGP\
    \ in your routing tables, complete the phrase as follows:\n\n```\nimport proto\
    \ egp autonomoussystem value restrict;\n```\n\nIf you want to allow routing for\
    \ items that match this rule, then you have a choice. You can either add the phrase\
    \ preference value after the autonomoussystem value entry or stick with the default\
    \ of a 200 preference for EGP. Then, expand the statement to the familiar format:\n\
    \n```\nimport proto egp autonomoussystem value\npreference value {\n```\n\nThis\
    \ statement ends in the usual manner. Inside the curly braces you define the networks,\
    \ hosts, and so on to which you want the rule to apply and then end the statement\
    \ with one of the following: the word restrict, the phrase preference value, or\
    \ neither. In the end, you'll have something similar to:\n\n```\nimport proto\
    \ egp autonomoussystem value\npreference value {\n    all;\n};\n```\n\nYou can\
    \ use the same exact formats for BGP as you do for EGP; you just use bgp in place\
    \ of egp. However, BGP contains some additional features. The other type of BGP\
    \ configuration statement allows you to tell gated how to handle importation of\
    \ a wider variety of routing protocol data into its routing tables. This statement\
    \ type begins with the following:\n\n```\nimport proto bgp aspah value\norigin\
    \ type\n```\n\nThe value variable contains a regular expression that contains\
    \ a list of autonomous systems to which this rule applies. In this case, we're\
    \ not looking for which AS the data comes directly from—though this information\
    \ can be included here too. Instead, value contains AS numbers that the data may\
    \ have passed through."
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Choosing what to place in the type variable''s place is a bit more straightforward.


    The following settings are available:


    +   - blank. You can choose to put nothing at all here.

    +   - any. Sets that this rule applies to routes no matter from which protocol
    group they come.

    +   - egp. This rule refers to External Gateway Protocols, or EGPs.

    +   - igp. This rule refers to Internal Gateway Protocols, or IGPs.

    +   - incomplete. This rule refers to routes where the given data is not complete.


    You can actually have one or more of egp, igp, and incomplete if necessary.


    On the next line, you''ll have the following to finish the rule if you want to
    prevent the defined routes from being imported:


    ```

    restrict;

    ```


    There''s another format of this statement available that allows you not only to
    set protocol types, but also data about which routes the rule should apply. It
    starts with what we just covered:


    ```

    import proto bgp aspah value

    origin type

    ```


    Now decide whether you want to use the default BGP preference of 170 or start
    the next line with:


    ```

    preference value {

    ```


    You need the curly brace even if you don''t set a preference. Proceed now to the
    next line and use the usual formats to set the list of routes you want to import.
    For each of these routes, start the line with the data that defines the address(es)
    to which you want the rule to apply, so you might start the next line with:


    ```

    host 192.168.15.5

    ```


    Then, set whether you want to save this route to the routing tables by ending
    the line with one of the following:


    ```

    host 192.168.15.5;

    host 192.168.15.5 preference value;

    ```


    Or, tell gated that this item points to data that should not be saved to the routing
    tables with:


    ```

    host 192.168.15.5 restrict;

    ```


    After you''ve entered all of the address lines for this rule, close it with:


    ```

    };

    ```


    # Configuring Route Exports


    If the rest of the Internet is to know how to reach you, gated or another border
    router has to export information to go into others'' routing tables. This doesn''t
    mean that you have to let everyone under the sun know about every single one of
    your machines. At the very least, though, the outside world must know how to reach
    your network gateway. Just as with the import statement, the export statement
    allows for specific rules to be applied to each routing protocol.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'As usual, let''s start with RIP. There are two ways you can specify an RIP
    export statement that refers to how gated shares data with external RIP routers,
    but both start with:


    ```

    export proto rip

    ```


    If you instead want to use this rule to set how gated exports routes learned from
    RIP, then change the first line to:


    ```

    proto rip

    ```


    The second line is also identical regardless of which type of RIP export statement
    you''re building. If you want to specify a collection of addresses that this rule
    applies to, you have a choice of two different items you can place on this line:


    ```

    interface ilist

    gateway glist

    ```


    You actually don''t have to put anything here at all. If you don''t require the
    second line items just covered, then ignore them and treat the second line as
    though it''s the third. To set this rule so that it tells gated not to export
    data that matches, end the statement with:


    ```

    restrict;

    ```


    Otherwise, if you want this rule to set what data can be exported through RIP,
    decide if you want to assign an RIP cost for the data hop from this border router
    to its neighbor. If you do, make the next line:


    ```

    metric value {

    ```


    If you don''t want to apply a cost, leave the metric value out and just use the
    curly brace. On the next line and as many after as necessary, use the structure:


    ```

    elist;

    ```


    All list values are built in the same format. It''s just what you''re representing
    that''s different. The ilist refers to the specific interfaces on this router
    that this rule refers to. The glist applies to the external gateways that this
    export rule refers to. Finally, the elist is a set of values that specify which
    routes—networks, hosts, netmasks, and more—this rule fits.'
  merge: -1
  img_proc: true
- pgno: 150
  md: "You don’t have to use either of these types if you are unsure. Finally, when\
    \ it comes to the first line, if you want to limit this rule to an OSPF router\
    \ within a specific AS, add the following to the end:\n\n    tag asnumber\n\n\
    Now you finish the line with one of the following structures, both of which should\
    \ look familiar. Use this one if you want the rule to refuse to export matching\
    \ routes:\n\n    restrict;\n\nAlternatively, use this one if you want to use this\
    \ rule to allow for exporting, where the metric item and its value are optional:\n\
    \n    metric value {\n        evaluel;\n        ...\n        evalueN;\n    };\n\
    \nThen there’s the case of exporting routes learned by OSPF. You start these statements\
    \ with one of the two following lines:\n\n    proto ospf\n    proto ospfase\n\n\
    If you don’t want anything matching this rule exported, end the statement with\
    \ only:\n\n    restrict;\n\nOtherwise, if you want to add a cost metric to the\
    \ OSPF or OSPFASE routes you export, and then end this line with metric value\
    \ { (the curly brace must be there even if metric value isn’t). Then, move to\
    \ the next line and add the first in a potential series of lines defining the\
    \ specific routes to which this rule applies. Each one of these lines starts with\
    \ one of the usual network and host definition items and then has either restrict;\
    \ or metric value; at the end—or nothing to use the default cost. After the statement\
    \ is complete, close it with };. An example of what you might end up with is:\n\
    \n    proto ospfase {\n        192.168.15.*;\n        host 192.168.15.2 metric\
    \ 300;\n        host 192.168.15.9 restrict;\n    };\n\nNow we can move on to export\
    \ rules for both EGP and BGP. In this case, both egp and bgp are interchangeable\
    \ as far as plugging these items into the format. We’ll use _gp for the examples.\
    \ First we’ll look at how to set up rules for exporting data to EGP or BGP from\
    \ other autonomous systems. If you don’t want to export anything to external EGP\
    \ or BGP routers, use the rule:\n\n    export proto _gp as asnum\n        restrict;"
  merge: -1
  img_proc: true
- pgno: 151
  md: "If you want more individual control so you can explicitly list which routes\
    \ should be exported to EGP or BGP then use the following format:\n\n```\nexport\
    \ proto_gp as asnum\nmetric value {\n  elist1;\n  ...\n  elistN;\n};\n```\n\n\
    The metric value clause is optional as usual because you can just leave it to\
    \ the defaults. You also need rules for how to handle exporting routes learned\
    \ from BGP or EGP. To prevent these from going out, use the structure:\n\n```\n\
    proto_gp autonoumoussystem asnum\nrestrict;\n```\n\nTo individually control which\
    \ routes are exported and which are not, use the structure:\n\n```\nproto_gp autonoumoussystem\
    \ asnum\nmetric value {\n  route1;\n  ...\n  routeN;\n};\n```\n\nOnce again, the\
    \ metric value clause is optional. At the end of each route line, you can have\
    \ either metric value or restrict. As you can tell by now, even though some of\
    \ the details are different from protocol to protocol, the structure for the statements\
    \ is pretty much the same.\n\nThere are some additional situations you can set\
    \ up with export as well. You don't have to do everything according to protocol.\
    \ In fact, not every route on your network was learned using a protocol at all.\
    \ To apply routing according to specific interfaces, start with the following:\n\
    \n```\nproto\n```\n\nAfter proto, you have one of three choices:\n\n+   - direct.\
    \ Refers to the interfaces on this router.\n+   - kernel. Refers to data installed\
    \ using the route command.\n+   - static. Refers to data installed using gated's\
    \ static statement.\n\nSo now let's say that you have:\n\n```\nproto static\n\
    ```\n\nAfter this, drop down to the next line. You may or may not place here the\
    \ structure:\n\n```\ninterface ilist\n```\n\nAdd this item only if you want this\
    \ rule to be specific to one or more particular interfaces. On the next line (or\
    \ this one if you didn't use the interface clause) you put restrict; to end the\
    \ statement if you want this rule to prevent exportation. Otherwise, you may want\
    \ to make the next line:\n\n```\nmetric value {\n```"
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Even if you don’t use the metric clause, you need the open curly brace. Now
    drop down to the next line. You start this one with the information that specifies
    what exact route to which you’re referring. As usual, you can have multiple lines
    here in the format:


    ```

    route1;

    ...

    routeN;

    };

    ```


    If you don’t want to use the default metric, you have the usual two options for
    the end of each line (before the semi-colon):


    +   - metric value. Set the cost for using this interface instead of using the
    default costs of 0 for direct, 40 for kernel, or 60 for static.


    +   - restrict. Do not allow routes matching this rule to be exported.


    # Configuring Route Aggregation


    As we discussed in Chapter 4, you can advertise a network address to the outside
    world as though it is a single-piece entity, when in fact it is broken down into
    smaller networks with subnets or IPv6. As long as gated, your router, understands
    where to send the data once it reaches the overall network, everything will work
    fine.


    You start a route aggregation section with one of the following lines of code:


    ```

    aggregate default

    aggregate networkIP

    aggregate networkIP mask netmask

    aggregate networkIP masklen bitmask

    ```


    You should already be familiar with the terms networkIP, netmask, and bitmask
    by this point. The second line also has a number of combinations you might use:


    ```

    {

    preference value {

    brief {

    preference value brief {

    ```'
  merge: -1
  img_proc: true
- pgno: 153
  md: '+   - static. This rule applies to routes assigned with a static gated statement.

    +   - value. This rule applies to the specified routing protocol out of those
    supported by gated.


    Another item available for placing after proto (with or without what you see in
    the preceding list) is a choice of one of the following:


    +   - as asnum. This rule applies to the specified autonomous system.

    +   - as asregexp. This rule applies to the autonomous systems that match the
    regular expression.

    +   - tag value. This rule applies to the routes that have the specified tag.


    Now is when you decide where you''re going with this rule. If it is only meant
    to prevent a single aggregation, just end it with:


    ```

    restrict;

    ```


    However, if you want to build a series of rules according to what networks and
    hosts you''re looking at, then you next have to decide if you want to use the
    default aggregate preference value of 130 or if you want to change it for this
    rule as an overall new default. If you do, start the next line with:


    ```

    preference value {

    preference value

    ```


    If not, just use the curly brace on this line. On the next line, you use the very
    familiar format:


    ```

    route1;

    routeN;

    ```


    ```

    };

    ```


    As usual, with each route you can add at the end either restrict or preference
    value. Build as many proto statements as you need within the overall aggregate
    statement, and then close it all out with an ending:


    ```

    };

    ```


    # Running Public gated


    Fortunately, the most complex part of dealing with gated is the configuration.
    After you reach the point of actually being ready to run the daemon, it''s time
    to make sure that the router is working as you anticipated. Only then can you
    finally rest. What I recommend here is typing things manually at the command line
    and taking notes for what works and what doesn''t. As soon as you know the exact
    format you need to use when running gated, add the command to /etc/rc.local or
    to the daemon init script according to how you prefer to start your network services.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'As a general rule, you don''t tend to work directly with gated at this point.
    One of this daemon''s companion programs is gdc, which is the gated controller.
    Even if you''ve already installed gated, you might not have gdc. It seems that
    some distributions don''t include gdc as part of the gated package, nor even in
    a separate one. However, gdc does come with the main gated public source, which
    you can get by going to www.gated.org.


    # Starting gdc


    The gdc program itself doesn''t run continuously. Each time you want to use it,
    you have to use the necessary flags and commands. The flags are listed in Table
    5.25. As soon as you have gdc and its flags typed in, add the commands specified
    in the following section. This allows you to manipulate gated without having to
    actually touch the daemon itself. Doing this can save a lot of angst and heartache
    down the road.


    | Table 5.25 Command-Line Switches Available When Starting gdc |

    | Flag | Purpose | Format | Value(s) |

    | -c | Sets the maximum allowed size of a gated coredump—only when gated is started
    using gdc. | -c size | Size in bytes. |

    | -f | Sets the maximum allowed size of a gated state dump file—only when gated
    is started using gdc. | -f size | Size in bytes. |

    | -m | Sets the maximum allowed data segment size for gated—only when gated is
    started using gdc. | -m size | Size in bytes. |

    | -n | Sets gated to not alter the kernel forwarding table. | -n | N/A |

    | -q | Sets gated to run in quiet mode, sending nothing to STDOUT. Error messages
    are logged according to settings in syslog.conf. | -q | N/A |'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Table 5.25 Continued


    | Flag | Purpose | Format | Value(s) |

    |------|---------|--------|----------|

    | -s | Sets the maximum allowed stack size for gated—only when gated is started
    using gdc. | -s size | Size in bytes. |

    | -t | Sets how patient gdc is when waiting for gated to complete certain tasks.
    | -t time | Number of seconds gdc should wait for gated to complete instructions.
    Default is 10. |


    Items -c, -f, -m, and -s are all used primarily to fix problems with gated running
    out of space when it tries to run.


    # Testing gated.conf


    One of the first things you’ll probably want to do after you finished configuring
    gated is to utilize gdc to check /etc/gated.conf for syntax errors and other such
    concerns. You accomplish this with the commands listed in Table 5.26. One thing
    to keep in mind is that this routing daemon actually keeps multiple versions of
    gated.conf in storage. The first time you utilize gated, you’ll have it loading
    your original gated.conf. After that make sure you work with the correct file—don’t
    just delete gated.conf when you’re changing configuration settings and do not
    work directly on gated.conf itself. There’s more on this in the section, “Manipulating
    gated,” in this chapter.


    Table 5.26 gated Testing Commands Available Through gdc


    | Command | Purpose |

    |---------|---------|

    | checkconf | Tells gdc to examine /etc/gated.conf for syntax errors. |

    | checknew | Tells gdc to examine /etc/gated.conf+ for syntax errors. Configuration
    file cycling—the creation of /etc/gated.conf+—is covered in the section, “Manipulating
    gated.” |

    | COREDUMP | Tells gdc to copy the entire contents of gated’s memory to a file
    and then shuts off gated. |

    | dump | Tells gdc to ask gated to save a data snapshot of its current settings
    and other information to the file /usr/tmp/gated.dump. |

    | interface | Tells gdc to instruct gated to immediately check the status of all
    directly connected network interfaces—usually Ethernet cards as of this writing.
    |

    | rmcore | Tells gdc to delete the latest gated core dump file. |

    | rmdump | Tells gdc to delete the latest gated state dump file. |'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Table 5.26 Continued


    | Command | Purpose |

    |---|---|

    | reparse | Tells gdc to delete the latest file containing the list of gated.conf
    syntax errors. |

    | running | Tells gdc to determine whether gated is currently running or not.
    |

    | toggletrace | Tells gdc to either turn on or shut off gated behavior tracing
    capabilities. |


    # The bird and zebra Routing Daemons


    Routing daemons are so complex that it is not possible to cover all of those you
    might want to utilize in this book unless we cut out a lot of more useful information.
    One of the daemons that had to have in-depth coverage cut is the BIRD Internet
    Routing Daemon, or bird (http://bird.network.cz/). This daemon is capable of supporting
    both IPv4 and IPv6 static routing as well as the protocols RIP, OSPF, and BGP.
    It also provides tools for route filtering.


    Another daemon that didn’t make the cut but is popular in its own right is GNU’s
    zebra (http://www.zebra.org/). This one also supports IPv4 and IPv6, RIP-1, RIP-2,
    OSPF, and BGP. The great thing is that these two daemons are also open source
    and tested under Linux. This gives you a wide range of options.


    # Manipulating gated


    The gdc handler has many other functions that exist to help you to both start
    and stop the gated daemon as well as alter its behavior and even update it’s current
    data. These commands are outlined in Table 5.27. One thing it is important to
    understand here is that gated maintains three copies of its configuration file,
    /etc/gated.conf, after you’ve updated its settings at least once. These copies
    entail:


    +   - /etc/gated.conf+. The new configuration file you want gated to load.

    +   - /etc/gated.conf. The current configuration file in use by gated.

    +   - /etc/gated.conf-. The last gated configuration file you used.


    # Table 5.27 gated Manipulation Commands Available Through gdc


    | Command | Purpose |

    |---|---|

    | backout | If /etc/gated.conf- is empty or doesn’t exist or if there is already
    a /etc/gated.conf+ file, this command does nothing. Otherwise, this command "backs
    up" through the configuration files, moving /etc/gated.conf to /etc/gated.conf+,
    moving /etc/gated.conf- to /etc/gated.conf, and then loading the older configuration
    file. |'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Table 5.27 Continued


    | Command | Purpose |

    |---|---|

    | BACKOUT | If `/etc/gated.conf-` is empty or doesn’t exist, this command does
    nothing. Otherwise, this command “backs up” through the configuration files, moving
    `/etc/gated.conf` to `/etc/gated.conf+`, moving `/etc/gated.conf-` to `/etc/gated.conf`,
    and then loading the older configuration file. |

    | createconf | If `/etc/gated.conf+` exists, this command does nothing. Otherwise,
    gdc creates the empty file `/etc/gated.conf+` and sets it to be owned by the user
    root and the group gdmaint, with the permissions 664. |

    | KILL | Tells gdc to do a kill -9 on gated. |

    | modeconf | Tells gdc to set all of the gated configuration files to be owned
    by the user root and the group gdmaint, with the permissions 664. |

    | newconf | If `/etc/gated.conf` does not exist, this command does nothing. Otherwise,
    this command overwrites any existing `/etc/gated.conf-` with the current `/etc/gated.conf`,
    and then moves `/etc/gated.conf+` to `/etc/gated.conf`. |

    | reconfig | Tells gdc to have gated load the current `/etc/gated.conf` and alter
    its settings appropriately. |

    | restart | Tells gdc to stop the gated process if it is already running, and
    then start a new gated process. If gated is not already running, this command
    still calls start. |

    | start | If gated is already running, this command exits with an error. Otherwise,
    it tells gdc to run the gated program and then wait for the appropriate number
    of seconds (10 by default, see Table 5.25) before exiting with an error if the
    daemon does not start properly. |

    | stop | If gated isn’t running, this command exits with an error. Otherwise,
    tells gdc to send a shutoff command to gated and then wait for the appropriate
    number of seconds (10 by default, see Table 5.25). If gated does not properly
    exit within this wait period, gdc then sends the same shutoff command and waits
    once again. If after this gated still does not manage to exit, then gdc sends
    the equivalent of a kill -9 to force the issue. |

    | term | Tells gdc to tell gated to shut down each of its protocols one by one
    and then exit. If gated fails to shut down and you issue term a second time, gdc
    sends the equivalent of a kill -9 to force the issue. |

    | version | If gated is running, this command fails. Otherwise, this tells gdc
    to display information about the gated version currently in use. |'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Summary


    Well, there you have it. Everything you could possibly want to know about utilizing
    the public gated routing daemon was covered in this chapter. This tool, as well
    as others such as zebra (http://www.zebra.org/), allows you a great amount of
    control over how your router behaves, including the ability to sit back and just
    configure some basics and not bother with the higher end issues if you don''t
    need them.


    Now that we''ve gotten familiar with one of the popular unicast routing daemons,
    in Chapter 6, "Inside The Multicast Kernel 2.2.x Daemons," we tackle some of the
    multicast routing daemons used in the 2.2.x kernel series.'
