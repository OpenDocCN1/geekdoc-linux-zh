    interface in this machine. | broadcast; | N/A |

    | defaultmetric | Sets the default RIP cost for routes learned from a different
    protocol. | defaultmetric cost; | The RIP cost to utilize. Default is 16, which
    means the route is unavailable. |

    | interface | Sets a specific interface''s behavior for RIP. This item is covered
    in more detail in the chapter itself. | interface list value1 ... valueN; | In
    this case, the values are another set of options, and list refers to the specific
    interface(s) this rule covers. The values are covered separately in Table 5.10.
    For the list, use all if you want to match everything, the format xxx.xxx.xxx.xxx
    to match a full IP address, the formats xxx.xxx.xxx.*, xxx.xxx.*, xxx.*, or *,
    to match partial IP addresses, eth* to use a wildcarded device name, or the full
    name of the device such as eth0. |'
