  img_proc: true
- pgno: 88
  md: 'As you might notice, the netmask bits are set to all 1s in each byte that is
    used to determine the network number for the class. The 0 positions represent
    the positions that are available for hosts and subnets. As usual, you can see
    that multicast has no hosts, and you can''t subnet a single IP address.


    # Applying IPv4 Addressing Across Subnets


    Sometimes one network is not enough. You might have a full class C address, but
    there is an administrative, security, geographic, or other reason that you need
    to break your network into a set of subnets. Doing so causes more work. For one
    thing, you''ll have to actually set up routing because you now have to tell each
    subnet how to send data to the other subnets and the outside world. You also have
    to calculate all of the IP bits and pieces, such as the new netmasks, new network
    addresses, new broadcast address, and so on.


    You break an IP network into subnets by turning some of the host bits into network
    bits. No, this isn''t a magic trick. You do this with the assistance of also changing
    the netmask. A netmask that is not standard for the address class tells TCP/IP
    that it is dealing with a subnetted network. So, let''s take a look at how all
    of this is accomplished.


    In the worlds of class A and B networking, subnetting is relatively simple. You
    can take a class A network such as 120.0.0.0—which has a netmask of 255.0.0.0—and
    divide it into subnets simply by using addresses 120.1.0.0 through 120.254.0.0
    as network addresses and changing the netmask to 255.255.0.0. Look familiar? You''ve
    just turned your class A network into 254 class B network addresses or subnets.
    The same works for class B networks. Take 142.182.0.0, which falls in the class
    B range and so has the netmask 255.255.0.0. Give it a netmask of 255.255.255.0
    and use 142.186.1.0 through 142.185.254.0 as network addresses, and you''ve just
    turned your class B network into 254 class C network addresses or subnets. However,
    how many of us really get our own class A or B to play with these days? Fat chance.


    Things get more interesting when you want to subnet your class C network. You
    can''t just break it down into class D networks; those are individual IP addresses.
    However, we can do it by changing the netmask and then breaking up the available
    hosts so each go into a different network. You then usurp some of the host addresses
    for network numbers and other reserved values.


    IP v4 has certain limits on the subnets you can create for a class C address.
    Each subnet must be the same size, and the number of nets you divide your network
    into is determined by binary math. Because the first three bytes of the netmask
    for a class C address are fixed as 255.255.255., let''s just look at the last
    byte. As usual, it is eight bits where x is either 0 or 1. Your first option for
    making subnets is to divide your network into two. Why? Because the first x can
    either be 0 or 1, you have only two options. So, suddenly your network bits (represented
    by n) are one bit larger, and your host bits (represented by h) are one bit smaller,
    and your network bytes look like nnnnnnnn.nnnnnnnn.nnnnnnnn.nhhhhhhh.'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'The second chance for dividing your network is into four pieces because those
    first two x’s can be 00, 01, 10, or 11. So now your network bytes are nnnnnnnn.nnnnnnnn.nnnnnnnn.nnhhhhhh.
    Once again, TCP/IP keeps track of this through your netmask. The last byte of
    your netmask is equal to the position values of the n’s within it. So the netmask
    for a two-subnet network is 255.255.255.128. It follows that the netmask for four
    subnets is 255.255.255.192. Table 4.4 outlines the possible IP v4 subnets for
    a class C address and their pertinent values.


    # Table 4.4 Pertinent Facts About the Possible IP v4 class C Subnets, Where n
    Stands for Network Bit, h Stands for Host Bit, and x Stands for Network Byte


    | Number | Network Bits | Binary Netmask | Decimal Netmask |

    |---|---|---|---|

    | 2 | nhhhhhhhh | .10000000 | 255.255.255.128 |

    | 4 | nnhhhhhhh | .11000000 | 255.255.255.192 |

    | 8 | nnnhhhhhh | .11100000 | 255.255.255.224 |

    | 16 | nnnnhhhh | .11110000 | 255.255.255.240 |

    | 32 | nnnnnnhh | .11111000 | 255.255.255.248 |

    | 64 | nnnnnnnh | .11111100 | 255.255.255.252 |

    | 128 | nnnnnnnh | .11111110 | 255.255.255.254 |


    Now, some of these subnet sizes are pretty unrealistic. We’ll illustrate why by
    getting into the internals of the subnetwork addresses, host address ranges, and
    more. Let’s take the two-subnet case to start with you. You can use the remaining
    host bits to help you determine the range of host numbers that goes toward each
    subnetwork. In the case of the two-subnet breakdown, the h’s (host bits) in n
    hhhhhhhh add up to 127. So subnet 1 is from x.x.x.0 through x.x.x.127, and subnet
    2 is from x.x.x.128 through x.x.x.255.


    It’s not that simple though. The first and last host bits are always reserved,
    even in a subnetted network, so you really only get x.x.x.1 through x.x.x.126
    and x.x.x.128 through x.x.x.254 for your subnets. Now we have to pull out the
    network addresses. For subnet 1 this is x.x.x.1 and for subnet 2 this is x.x.x.128—for
    the entire network it’s x.x.x.0, and that’s all the rest of the Internet sees.
    So your available host IP addresses are now x.x.x.2 through x.x.x.126 and x.x.x.129
    through x.x.x.254. We now need the subnet broadcast addresses, as opposed to the
    x.x.x.255, which broadcasts to the entire network. Those would be the last address
    in each subnet, x.x.x.127 and x.x.x.254. Now our hosts can be x.x.x.2 through
    x.x.x.126 and x.x.x.129 through x.x.x.253. As you can see, for the convenience
    of turning our class C network into two subnetworks, we’ve given up the use of
    four host IP addresses.


    Things of course get more complex as we create four subnets. The host bits in
    nnhhhhhh add up to 63, so we end up with the following four subnet ranges: x.x.x.0
    through x.x.x.63, x.x.x.64 through x.x.x.127, x.x.x.128 through x.x.x.191, and'
  merge: -1
  img_proc: true
