- pgno: 238
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_238_0.png)


    # 11


    # Linux Routing Basics


    IN THIS CHAPTER, AS THE TITLE suggests, we''ll take a look at some of the basics
    of routing with Linux. We''ll also discuss some basics of common network configurations.
    This includes pre-planning for your network.

    As you''ll see, it all sounds a lot more difficult in theory than it is in practice.


    # LAN Routing Basics


    In this section, we''ll look at what a network admin will need to know to set
    up a local area network. Setting up a LAN with Linux is very simple these days.
    We can recall a time when the tools weren''t quite as mature as they are today,
    but Linux has come a long way in the last three or four years. Linux has always
    been very good at networking, but the set-up and configuration tools have gotten
    better over time.

    Linux''s routing capabilities, however, have really come to the forefront in the
    2.4.x kernel series. A lot of the more advanced capabilities aren''t necessary
    for simple LANs, though you might find the Netfilter framework makes life a lot
    easier in some ways.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# ## Setting up the One-Part LAN


    Setting up a one-part LAN is pretty easy, whether you have a router/gateway between
    one computer and the Internet or a router/gateway that sits between 100 computers
    and the Internet. As long as you don’t want to break your LAN into subnets, then
    your configuration is the same no matter how many clients live behind your router.


    For simple LANs, you’ll need to do is set up a box with IP Masquerading or possibly
    NAT. (For a full discussion on the differences between IP Masquerading and NAT
    see Chapter 14, “Securely and NAT Issues.”)


    For a simple one-part LAN that’s using IP Masquerading through a single router/gateway,
    there’s not a whole lot to setting up at all. Simply setting up IP Masq and IP
    Forwarding is all that it takes; the kernel does the rest automatically. Again,
    all that is covered in Chapter 14.


    # ## Static or Dynamic IP Addresses


    One of the first issues you’ll have to deal with is whether to set up static or
    dynamic IPs for your hosts. If you have a very small LAN, fewer than 20 computers,
    then using static IP addresses won’t be too big a chore. As long as there aren’t
    too many hosts on your network, using static IPs is easier than setting up DHCP.
    If you can remember the names and IP addresses of every computer in your network,
    there’s no reason to fuss with DHCP.


    On the other hand, if you find yourself adding new hosts to the network on a regular
    basis or have more than 20 or 30 machines, you’d probably save yourself some headaches
    by configuring a DHCP server. This is especially true if more than one person
    sets up new machines. Murphy’s Law will rear its ugly head if multiple folks are
    assigning static IPs at the same time. You can use your router as the DHCP server
    or use an old 486 or Pentium computer dedicated just to serving DHCP.


    Some applications perform authentication using IP addresses. This is true of NFS,
    printing, mail transfer, and NAT to name a few. If DHCP is improperly configured,
    it can cause major problems with printing, file sharing, and other tasks.


    You can mix and match, though. If you have a few work areas for telecommuters
    who pay an occasional visit to the office, for instance, you can have DHCP set
    up for “visiting” computers while other hosts on the network have static IPs.
    In fact, in just about any office setting it’s probably a good idea to plan for
    the occasional visitor with a laptop who is going to need to plug it in to check
    email and whatnot.


    Setting up DHCP is uniformly easy on client computers, whether you’re using Linux,
    Windows, MacOS, or one of the BSDs. We won’t go into setting up a DHCP server
    or client here given that most distros provide their own interfaces for configuring
    a DHCP service. Suffice it to say that it’s relatively easy.'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'Another benefit of DHCP is the fact that you can “recycle” IP addresses. By
    that we mean that you can use DHCP to maximize your available IP addresses by
    requiring machines to “lease” the IP addresses and put the IP addresses back in
    the pool after a set amount of time. This way, when a visiting manager plugs in
    his laptop and uses an IP address while in the office, it will be reclaimed after
    they leave for another machine to use.


    # Don''t Make Your Router a Moving Target


    > Just in case this isn''t obvious, you don''t want to allocate a router''s IP
    address dynamically. For instance, if you''re going to use a private Class C network,
    give your router an IP such as 192.168.1.1—one that''s easy to remember while
    setting up new hosts. Things like routers, firewalls, mail servers, or NFS servers,
    should pretty much always have the same IP address.


    # Setting up a LAN with Subnets


    If you''re dealing with subnets in your LAN, things are going to get a little
    more complicated, but not to worry—it''s still not that bad.


    Considering that we''ve already covered the gory details of subnet mask math in
    Chapter 4, “IPv4 and IPv6 Addressing,” we won''t boggle your mind with it again
    here. (Okay, it''s actually not that hard, but anything that smacks of math makes
    some of our heads spin...)


    We will, however, cover the differences between a single-sized subnet and a variable-sized
    subnet and reasons why you might want to work with subnets on your LAN. You''ll
    definitely want to have read through Chapter 4 if you don''t already have a strong
    grasp of IP addressing schemes.


    > IPv6

    > Because IPv6 is so rarely implemented, we''re not going to spend any time on
    discussing IPv6 subnetting here. Considering the abundance of IPv6 addresses,
    it might never be necessary to consider subnetting IPv6 addresses anyway—even
    if IPv6 does become commonly used.


    # Why Subnet?


    Subnets are created for a number of reasons. Generally, subnets on a network exist
    because of physical and geographical logistics, for the purpose of segregating
    internal networks or making the most of the IP address scheme.


    We''ve already covered the physical and geographical logistics of networking earlier
    in the book; however, segregating networks for security is kind of a new topic.
    Protecting your data internally is just as important as protecting your data from
    outside threats. You wouldn''t leave the HR department''s personnel files unlocked
    in common hallways, would you? Of course not. So it sometimes makes sense to segregate
    your'
  merge: -1
  img_proc: true
- pgno: 241
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Variable-Sized Subnets


    A variable-sized subnet is used when you need to break an address range into subnets
    of different sizes. For instance, in the previous example we divvied up a Class
    C range of IPs into eight subnets of equal size—that is, each subnet has an equal
    number of IP addresses. But, what if you need more IP addresses in the IT department’s
    subnet than in the Finance department’s subnet? You have all those extra servers,
    workstations and whatnot in that department, but only three people in Finance.


    In this case, you would assign each subnet a different subnet mask that would
    depend on the number of hosts needed on each network. The subnet number would
    be varied to give as much or as little room necessary for hosts.


    # Stub Network


    When two variable-sized subnets are created, the subnet with fewer hosts is referred
    to as the "stub network."


    # WAN Routing Basics


    As you can imagine, setting up a wide area network is a bit trickier than setting
    up a LAN. For one thing, when you set up a LAN everything is more or less under
    your control. (Barring Murphy’s Law, of course.) When you’re constructing a WAN,
    there are factors that are outside your control.


    # Choosing the External Connection Type


    When setting up your WAN, you want to try to pick the connection type that befits
    your bandwidth and uptime needs as well as your budget.


    In some cases, your options might be chosen for you. Depending on where you’re
    attempting to get connectivity, you may have the opportunity to choose from dial-up,
    DSL, ISDN, cable modem, T1, high-speed satellite dish, or carrier pigeon. In other
    cases, your options could be limited to only one or two types of connectivity.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'Chapter 12, "Network Hardware Components, Technology, and Solutions," covers
    hardware types in detail and discusses how to deal with whatever connection type(s)
    you have.


    # WANPIPE


    One WAN package for Linux is the WANPIPE package. To utilize this package you''ll
    need a supported card, and you''ll also need to compile support for WAN Router
    and WAN Interfaces in the Linux kernel. (See Chapter 13, "Building a Routing Kernel,"
    for a walk-through on kernel compilation.)


    If you need the WANPIPE package, you can download it from the Sangoma FTP server
    ftp://ftp.sangoma.com/linux/current_wanpipe/. This directory also includes a README
    that might contain information newer than what we have as of this writing. Follow
    the instructions in the README.install, and you should be ready to go. If you''re
    a Debian GNU/Linux user, it''s even easier. Simply run:


    ```

    apt-get update

    apt-get install wanpipe

    ```


    as root, and apt-get will download and install the package for you automatically,
    assuming that you have a valid download site in /etc/apt/sources.list for the
    packages. Note that packages in the Debian GNU/Linux "stable" release are usually
    not the most recent packages, so if there''s a brand-new feature that you need,
    you might need to install the version from testing or unstable.


    The wanpipe program calls the wanconfig program, which loads a configuration file
    with the proper options for your WAN card. The /etc/wanpipe/wanpipe1.conf configuration
    file is a symlink to the /etc/wanpipe/router.conf file, which contains all of
    the information about your WAN device or devices, the definitions for your WAN
    interfaces, and a hardware and physical interface section.


    The usage of the wanpipe is very simple; the only difficult thing might be to
    get your configuration file set up correctly. Because there are so many options
    for the configuration file, we won''t try to delve into them here. However, the
    Sangoma folks maintain a mailing list for WANPIPE, and the odds are if you pop
    into the list and detail your setup, someone on the list will be able to give
    you the information you need.


    To start your WAN devices after you''ve gotten the configuration file set up,
    simply issue the command:


    ```

    wanpipe start

    ```


    which will start all of the devices that are listed in your configuration file.
    If you need to shut down the WAN interfaces then use:


    ```

    wanpipe stop

    ```'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'As you might have guessed, it''s also possible to stop or start individual
    devices, by using:


    ```

    wanpipe start | stop wanpipe#

    ```


    where the "#" is the number of the interface. The device numbering starts at 1,
    and you are allowed up to 16 devices, which should be more than enough under normal
    circumstances.


    # VPN Routing Basics


    Typically, VPNs are set up through a firewall rather than a router. However, because
    we''re using Linux we''ve got the flexibility to combine the two. Alternatively,
    you could still use Linux for the router and firewall/VPN but build them on separate
    boxes for security purposes. Whatever you want to do, Linux is flexible enough
    for you to do it.


    A VPN is an alternative to expensive leased lines that are closed to other network
    traffic. By making use of the Internet as a bridge between networks, companies
    can save a lot of money and still be secure by utilizing a VPN.


    # A Little More About VPNs


    As you probably already know, VPN stands for Virtual Private Network. Because
    the Internet is hideously insecure, you wouldn''t want to transmit any important
    data over the Internet unencrypted. For folks doing commerce, we have HTTPS. For
    people who just want to run a shell or X sessions, there''s SSH. But what if you
    want to join two far-flung networks together securely and share all the common
    resources across the Internet? That''s where VPNs come in.


    The metaphor most often used to describe the method of connecting two networks
    securely is a tunnel. You think of the communications taking place between the
    two networks as being inside a few layers of outer coating. You''re still using
    TCP/IP to transmit your data, but instead of unencrypted data being transmitted,
    the data is encrypted so that even if a potential attacker can intercept your
    packets—something you have no control over on an unsecured shared network—they
    shouldn''t be able to make any sense out of the packets themselves. Your data
    is (theoretically) safe from prying eyes, and your network is safe from intruders.


    So it''s considered a private network even though the transmissions take place
    over a public network. It''s not always as convenient as a WAN, but VPNs can prove
    a very useful substitute where budget and resource constraints make WANs impractical
    or when time and mobility are factors. For instance, you might wish to implement
    a VPN to allow Linux-based Point-of-Sale terminals to operate over a dial-up to
    interact with a central credit-card processing machine for your company while
    doing sales at trade shows.'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'One of the most common protocols for VPNs is the Point-to-Point Tunneling Protocol.
    As the name suggests, PPTP is based on the Point-to-Point Protocol. There are
    several implementations of PPTP for Linux that are interoperable with other operating
    systems such as Windows (and Linux, of course!) that you can utilize to create
    your own VPN. We cover VPNs extensively in Chapter 8, "Kernel 2.4.x Routing Daemons."


    # Summary


    In this chapter we''ve covered some of the basics of using Linux as a router in
    normal-case scenarios. For the most part, using Linux as a router in normal LAN
    and WAN situations is a piece of cake because most of the work is done by the
    kernel and software automatically.


    One of the things that Linux excels at is networking, so it''s nearly a no-brainer
    to pick Linux as the glue for your network even if the rest of your LAN or WAN
    consists of Windows, Mac, or other types of machines. Linux is kind of the great
    "uniter" of operating systems.


    In later chapters we''ll cover more difficult routing tasks such as load balancing
    and VPNs in greater detail, which are tasks that used to be the domain of expensive
    hardware routers only.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_246_0.png)


    # Network Hardware Components, Technology, and Solutions


    NETWORKS, INTERNETWORKS, AND THE INTERNET are all made up of hosts, nodes, routers,
    and telecommunication facilities. This chapter examines telecommunication technology
    that makes up the framework that most networks are built upon. Telecommunication
    facilities and infrastructure traditionally were owned and operated by AT&T, which
    was broken up (the parts after the breakup were known as "Baby Bells") by the
    US government. The term telephone company or telco is used loosely in this chapter
    to mean any organization that provides the services we cover in this chapter.


    # Analog Communications and Modems


    The modem is the most common method for remote and home users to connect to corporate
    networks and the Internet. Modems modulate the digital signal from the PC into
    an analog signal that can be sent over the phone line. The modem also demodulates
    the analog signal received from the telephone network to a digital signal that
    can be understood by the computer.


    Modems provide connection speeds up to 56kbps under ideal situations, but typical
    speeds are 33.6 to 44kbps. The 56kbps standard requires very clean connection
    (very little interference) and only one analog to digital conversion. Due to power
    regulations in the US, 53kbps is the maximum download speed with an upload speed
    of 33kbps.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'A common misconception created by the use of modems is that the telephone network
    is analog given that the modem is converting the computer''s digital signal to
    an analog signal. This is not the case. The analog signal sent over the copper
    wire from the customer premises to the telephone company is converted to a digital
    64kbps signal.


    This 64kbps signal is referred to as a DS0 that is then combined (multiplexed)
    with 23 other DS0s into a 1.54Mbps DS1. The DS1 is often referred to as a T1 or
    "trunk." The T1 is typically multiplexed with other traffic to be transported
    via a DS3/T3 (672 DS0s) or higher connection. Figure 12.1 shows how a connection
    between two modems would operate. Such a network was often used with electronic
    bulletin board systems in the 1980s and was a basis of worldwide store-and-forward
    type networks such as Fido. Modem to modem connections are seldom used except
    by system administrators; however, even this application of modem-to-modem communication
    is often a second choice to terminal servers. Terminal servers are covered later
    in this chapter in the "Terminal Servers" section.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_247_0.png)


    The modulation used by the modem must match that of the far end and determines
    the speed of communication, typically represented in bits per second (bps). Table
    12.1 lists some of the common speeds, the modulation standard, and where use of
    the modulation is likely. In the past, modulation protocols determined interoperability;
    however, wider support of protocols and improved protocol negotiation allows most
    modems to have a common protocol that can be used. Additionally, remote access
    servers, which are covered later, also support a wide base of modulation protocols
    and error correction protocols.


    # Table 12.1 Common Modem Speeds, Standards Body, and Deployment Area


    | Modem Speed | Standards Body | Deployment Area |

    |---|---|---|

    | 300 | Bell 103 | US |

    |  | CCITT V.21 | Outside the US |

    | 1200 | Bell 212A | US |

    |  | CCITT V.22 | Outside the US |

    |  | CCITT V.23 | Europe |

    | 2400 | CCITT V.22bis | International |

    | 9600 | CCITT V.32 | International |'
  merge: -1
  img_proc: true
- pgno: 248
  md: '| Modem Speed | Standards Body | Deployment Area |

    |---|---|---|

    | 14400 | CCITT V.32bis | International |

    | 28,800 | CCITT V.34 | International |

    | 33,600 | CCITT V.34 | International |

    | 56,000* | ITU V.90 | International |


    *This is maximum download speed (and which is really limited to 53kbps). Upload
    is typically 33kbps.


    # Internal or External Modem


    Internal modems are very popular for PC distributors; internals often cost 50%
    less than their external counterparts because the modem manufacturer does not
    have to provide housing for FCC shielding requirements (the PC cover does this)
    or a power supply (the PC provides the voltage). The major disadvantage of internal
    modems is their lack of lights, which can be used for troubleshooting. Additionally
    the modem cannot be easily transported between two PCs.


    A relatively late entry to the internal modem market is the so-called WinModem.
    WinModems rely on the PC''s internal CPU to provide most of the logic normally
    provided by the modem''s hardware including error correction and flow control,
    which means WinModems typically impact system performance more than the regular
    internal modem. In addition, these modems can usually only be used on Windows
    operating systems, and we do not recommend their use. However, there is quit a
    bit of development effort going into the support of WinModems on Linux. For current
    development check the LinModem web site at http://www.linmodems.org/.


    The WinModem is based on an earlier vendor''s attempts at similar engineering;
    however, the more universal support of Windows will likely ensure some success
    of these modems.


    Internal modems are available with the ISA 16-bit interface and PCI 32-bit interface.
    ISA modems are widely supported under Linux; whereas PCI (non-WinModems) depend
    on the modem used. The 2.4 kernel has wider support for PCI, but a posting to
    USENET is recommended before purchasing a PCI modem to determine the latest development.


    External modems connect to the PC''s serial port using a DB-25 or DB-9 connector.
    The DB-25 and DB-9 connectors are shown in Figure 12.2, and the pin outs of the
    modem''s port are shown in Tables 12.2 and 12.3. Most modems use female connectors.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_249_0.png)


    # Figure 12.2 DB-25 and DB-9 connectors.


    # Table 12.2 DB-25 Pin Outs


    | Pin | Description |

    | --- | ----------- |

    | 1 | Protective Ground |

    | 2 | Transmit Data (TD) |

    | 3 | Receive Data (RD) |

    | 4 | Request to Send (RTS) |

    | 5 | Clear to Send (CTS) |

    | 6 | Data Set Ready (DSR) |

    | 7 | Signal Ground |

    | 8 | Primary Carrier Detect (CD) |

    | 20 | Data Terminal Ready (DR) |

    | 22 | Ring Indicator (RI) |


    # Table 12.3 DB-9 Pin Outs


    | Pin | Description |

    | --- | ----------- |

    | 1 | Carrier Detect (CD) |

    | 2 | Receive Data (RD) |

    | 3 | Transmit Data (TD) |

    | 5 | Signal Ground |

    | 6 | Data Set Ready (DSR) |

    | 7 | Request to Send(RTS) |

    | 8 | Clear to Send (CTS) |


    Whether the modem is internal or external, it will use a Universal Asynchronous
    Receiver-Transmitter (UART). In the past it was important to ensure that the serial
    card or the internal modem had a 16550 UART, which was an improvement on the earlier
    8250 UART. The 16550 has a 16-byte buffer that allows 15 more bytes to be'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'stored than the 8250. This allows smoother operation and a smoother experience
    in multitasking environments. Ensuring a 16550 is present is no longer as important
    as it was—serial card and modem manufacturers use the 16550 or a compatible UART
    as a minimum.


    # Hayes AT Commands


    Communications software also must be in place to use the modem for communications
    with other systems. Early modem vendors included terminal software that could
    use a proprietary protocol to communicate with the vendor''s software. Hayes Microcomputer
    created a command set where all commands started with the mnemonic AT and then
    the command for the modem. The Hayes command language became known as the AT command
    set, and many vendors emulated the command set creating the defacto standard Hayes
    compatible. Practically all modems on the market are now Hayes compatible.


    AT commands are used for all communications with the modem and range in function
    from dial commands, to hardware flow control, to waiting on a dial tone before
    dialing. Special features of a modem also can be used without requiring modification
    of the AT command set through the use of registers, which are similar to variables
    in other languages, with the exception that the registers are stored in nonvolatile
    memory and are stored across modem resets.


    Most communications software has preconfigured AT commands documented for optimal
    use; however, AT commands can be helpful in troubleshooting communications problems.
    Table 12.4 shows some of the more useful commands. Remember, all commands start
    with the AT before the command shown.


    Table 12.4 Common Hayes AT Commands


    | Command | Meaning |

    |---|---|

    | A | Answer the incoming call. |

    | D nnn-nnn-nnnn | Dial the telephone number nnn-nnn-nnnn. The D command takes
    additional parameters with P and T being the most common, which are used to dial
    using pulse or tones. DL is useful for dialing the last number again. |

    | En | Echo to the terminal program where if n=0 then turn off local echo, and
    if n=1 turn on echo. |

    | H | Hang up the current connection. |

    | Xn | Extended error code handling. X3 is very useful for ignoring the requirement
    for dial tone, which might be the case if the modem is going through a private
    branch exchange (PBX). |

    | Z | Reset the modem. |'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Terminal Communications Software


    Networking applications have killed most users’ needs for communications software;
    however, system administrators often need terminal software to connect to the
    console of PCs, modems, routers, and other network devices. Most distributions
    of Linux include the communications application, minicom, which looks similar
    to an early DOS application by the name of Telix. However, there are many Linux
    communication packages available, with Seyon and pcomm being other favorites.
    The IBLIO Linux archive maintains a list of Linux communication programs at http://www.ibiblio.org/pub/Linux/apps/serialcomm/.


    # Other Uses of Analog Communications


    The remaining portions of this chapter cover digital-based communications; however,
    we should point out some of the important roles that analog communications still
    provide. While the modem, as an individual piece of hardware, is not necessarily
    used in these applications, the technology present in modems is used in terminal
    servers and remote access servers.


    # Terminal Servers


    Modem-to-modem connections are seldom used except by network administrators who
    require connections to remote systems that have dedicated modems for remote management.
    (Most remote connections from a modem are to a remote access server, which we
    cover shortly.)


    However, even this modem-to-modem application is being phased out by terminal
    servers. A terminal server is a special-purpose remote access device that has
    multiple serial ports that can be terminated directly on systems to be remotely
    managed or even modems for dial connectivity. For example, the terminal server
    shown in Figure 12.3 can be used to access the Linux system, rightly. This is
    ideal for situations where it is unclear if an outage is caused by a system or
    the network. In this particular case, the administrator has an "out-of-band" method
    of accessing rightly and can telnet to the terminal server and then access rightly
    via the serial connection. Should telnet to the terminal server not be possible
    due to a common network failure with the Linux server, the administrator can also
    dial in to the terminal server and then access the Linux server through the terminal
    server.


    The major advantage of terminal servers over dedicated modems is consolidation
    of resources and a central point for security, which avoids back doors left by
    employees "forgetting" about modems connected to the network. Administration is
    also typically easier because the terminals server connection can make use of
    the console connection on most routers and a simple serial connection on UNIX
    hosts; this means no vendor-specific modem configuration requirements.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_252_0.png)


    # Figure 12.3 Terminal server.


    Linux can act as a terminal server, but the typical two serial ports found on
    most PC hardware is inadequate, so a multi-serial card is required for most deployments.
    (The Linux Terminal Server Project [http://www.ltsp.org/index.php] should not
    be confused with a Linux based terminal server, this project covers using diskless
    Linux workstations.)


    # Remote Access Servers/Network Access Servers


    Remote access servers, also known as network access servers as the name implies,
    provide remote users access to networks. The remote access is provided through
    dial-up connections such as asynchronous modems or ISDN. Figure 12.4 shows a typical
    corporate remote access server with one T1 providing 24 dial-in channels for access.


    Remote access servers can provide analog, as well as integrated digital services
    network (ISDN) access, through the primary rate interface, which is discussed
    later.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_252_1.png)


    # Figure 12.4 Corporate remote access server.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Remote access servers provide support for multiple protocols, with IP being
    a favorite, although IPX is also found in legacy Novell environments. Although
    the remote access server provides protocol, interface, and security policy, the
    remote access server does not typically store user-specific information locally,
    but rather the user specific-information such as authentication, packet filtering,
    and protocols available to the user, are determined through a remote access server
    protocol such as Remote Access Dial In User Service (RADIUS) as defined in RFC
    2058. Linux makes an ideal RADIUS server. Table 12.5 lists some RADIUS servers
    that run on Linux.


    # Table 12.5 RADIUS for Linux


    | RADIUS | Organization | Source |

    |---|---|---|

    | Ascend RADIUS version 970224 | Lucent | ftp://ftp.ascend.com/pub/Software-Releases/Radius
    |

    | Cistron Radius Server version 1.6.4 | Cistron Telecom | http://www.radius.cistron.nl/
    |

    | Livingston Radius Server | Lucent | http://www.livingston.com:80/tech/docs/radius/ftp://ftp.livingston.com/pub/radius/
    |


    This section has covered traditional remote access, but the recent broadband offerings,
    such as cable modems and digital subscriber line (DSL), have opened new opportunities
    for personal and business users. Cable modems and DSL are covered in the next
    two sections.


    # Cable Modems


    Cable television networks, outside of the public switched telephone network, are
    likely the most common networks used by home users. This marketing aspect combined
    with the infrastructure to create broadband cable networks is an excellent combination
    for data networking applications.


    The cable modem is the hardware used to connect to the Internet through the cable
    provider''s network. Traditional cable networks were uni-directional by nature,
    and data networking is bi-directional; however, cable providers have long needed
    the capability to transmit upstream information to provide additional services
    based upon conventional cable technology, such as pay-per-view. The bandwidth
    and technology designed to provide this upstream channel is what allows cable
    networks to provide an'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'upstream data path. (The fact that the technology to pump data upstream is
    not always there in every cable system should not be considered trivial—many cable
    networks have required upgrades to provide cable network services.) Figure 12.5
    shows a cable modem-based network.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_254_0.png)


    # Figure 12.5 Cable modem network.


    The cable modem has a LAN connector that is typically an RJ-45 10baseT connector
    and a “WAN” connector that is connected with a local splitter that feeds the cable
    modem and the cable-ready television or the set-top box for cable television.
    The splitter is responsible for feeding a 6Mhz downstream and 2Mhz upstream signal
    between the cable modem and the cable modem termination system (CMTS).


    The cable 6Mhz downstream channel can provide up to 56Mbps. It should be noted
    that although there is a shared medium to the CMTS, the cable modems do not communicate
    with each other—traffic must first go through the CMTS. Also note that the CMTS
    does not provide IP routing capability. The 2Mhz upstream provides up to 3Mbps
    bandwidth.'
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Although cable modems use a shared bus, the bandwidth available, consumer acceptance
    of cable television, and lack of availability of other technologies such as DSL
    will ensure that cable modems are here to stay.


    # Digital Subscriber Line


    DSL, unlike analog services, does not provide a digital to analog conversion,
    but rather acts as an interface to a digital signal that is carried on the same
    subscriber line that provides the analog line for the telephone. While digital
    communications to the customer premises is common for business customers, the
    “last mile” to private customers has traditionally been analog; however, this
    is now changing with DSL. Although Asymmetric DSL (ADSL) is the most widely deployed
    DSL, a brief overview of some of the more common service offerings of DSL is presented
    as well.


    # High Data-Rate Digital Subscriber Line (HDSL)


    HDSL is a T1 (or E1 in Europe) replacement that allows the use of copper without
    the necessary repeaters of T1. HDSL supports distances up to 12,000 feet. (For
    T1, a repeater is normally needed every 6,000 feet.) HDSL uses four wires for
    transmissions.


    # HDSL-II


    HDSL-II was the next generation of HDSL and offers the same speeds as HDSL but
    only requires one pair of wires. A single pair of lines requires fewer connections,
    and single pair wires are often pre-existing in many facilities.


    # Single-Line Digital Subscriber Line (SDSL)


    SDSL, like HDSL and HDSL-II, operates at T1 speeds; however, it only uses one
    pair of wires. The use of two wires does limit the distances that SDSL can function
    with distances ranging from 10,000 to 11,000 feet.


    # Asymmetric Digital Subscriber Line (ADSL)


    As the name implies, ADSL does not provide the same speed in both directions as
    HDSL and SDSL, but rather provides a higher downstream than upstream bandwidth,
    which makes it ideal for Internet access where the user is downloading much more
    information than is being uploaded. “Uploaded” data is often simply acknowledgements
    to the traffic being routed downstream.


    As mentioned, ADSL is the most popular form of DSL and is typically used by home
    and small office users. Also when DSL was first mentioned, most consumers are
    usually referring to ADSL.


    ADSL provides bandwidth up to 8.44Mbps with a distance of up to 9,000 feet. Speed
    offerings, however, vary by service providers and are not uniformly deployed.'
  merge: -1
  img_proc: true
- pgno: 256
  md: 'Figure 12.6 shows how ADSL is offered by most service providers. An examination
    of the various elements that make up an ADSL deployment are covered next.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_256_0.png)


    Figure 12.6 Typical ADSL offering.


    # The DSL Modem


    The DSL modem is located at the subscriber''s location—typically the residence—and
    is referred to as customer premises equipment (CPE) by telecommunications technicians.
    The DSL modem provides a LAN interface that provides a 10Mbps Ethernet connection
    and a WAN interface that is connected to the splitter, which has split the lower
    4khz off to the telephone.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# The Digital Subscriber Line Access Multiplexer (DSLAM)


    The DSLAM multiplexes the signals from the various DSL subscribers onto the provider''s
    network. Current generation of DSLAMs provide an Asynchronous Transfer Mode (ATM)
    interface to the service provider''s network. Early implementations were typically
    frame relay interfaces (covered later). Some DSL proponents expect IP to become
    the interface of choice in next generation DSLAMs, but market reality and current
    deployments will likely encourage vendors to provide multiple interfaces and let
    the service provider choose.


    # Data Networking with Routers


    Until the push of broadband technology in the last several years, the router was
    the most common hardware used to connect remote sites requiring multiple user
    support. Routers are known for their Layer 3 routing capability and multiple physical
    interface support.


    This book covers routing with Linux in detail. However, much of the following
    covers interfaces that can be purchased for both Linux and hardware-based routers.


    One of the major advantages of hardware routers over host-based solutions, such
    as Linux, is their simplicity and dedicated operating system. With a generic operating
    system, one of the other services can affect the routing functionality. For example
    the kernel might mistakenly have an unneeded, buggy, IPX stack compiled with the
    kernel. In addition, there is also the tendency to activate additional services
    because "the box can do it."


    In addition many hardware routers, like Linux routers, provide security functionality
    such as packet filtering, network address translation, and additional networking
    functions such as acting as a frame relay access device in a frame relay network.
    On the high end, core routers also can process many more packets than a PC motherboard...the
    router''s back plane is optimized to route packets quickly.


    In addition, hardware routers will typically support a wider range of network
    interfaces, as was covered earlier.


    For these reasons, interaction with routers is likely in most environments...at
    a minimum the Internet access router provided by the ISP is likely to be a hardware
    router. Therefore we''ll cover some of the more likely facilities used in enterprise
    networks.


    # T1 and E1


    As covered in the modem section, the T1 is the 1.54Mbps digital facility that
    is the standard for voice networks. Its proven technology confirmed its effectiveness
    in customer premises and has become the standard for narrowband digital communications
    only likely to be offset by the current broadband technologies. HDSL is the natural
    replacement and is being marketed as the T1 replacement for business connectivity
    in some markets.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'The T1, a 1.544Mbps link, is made of up 24 64kbps channels referred to as DS0s.


    Due to the expense of T1s, U.S. telcos offered a fractional T1 service based upon
    n X DS0s, and it proved itself very popular for Internet connections and networks
    requiring point-to-point connections. A T1 or fractional T1 is referred to as
    a leased line or nailed connection because no dialing or signaling must take place—the
    connection is always on.


    The E1 is the European (and other parts of the world) digital facility that operates
    at 2.048Mbps. It offers 32 channels of DS0s.


    To make use of a T1, the two routers communicating must use the same protocol
    to communicate. Point-to-Point Protocol (PPP) (covered in Chapter 10, “Planning
    Router Layout and Function”) is a favorite and offers very good interoperability;
    however, there is some interoperability with HDLC protocol, and if the same types
    of routers are used, the vendor specific HDLC can be used.


    When more than the bandwidth of a T1 or E1 is needed, the next facility available
    is a DS3, which offers 44.736Mbps. An E3 has 34.368Mbps and is generally not able
    to customer premises. The expense and exponential increase cannot be justified
    by most network upgrades; therefore, multiple T1 connections are chosen.


    When multiple connections to the same site are used, a protocol that allows the
    two links to be treated as one must be used. Some routers allow the connections
    to use load balancing over the connection, which means that each frame that arrives
    is sent over the connection where the last frame was not sent (as shown in Figure
    12.7).


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_258_0.png)


    Figure 12.7 Load balancing.


    PPP Multilink protocol as defined in RFC 1717 can also be used to combine multiple
    connections into one logical connection and has the added advantage of increased
    interoperability likelihood.


    # Integrated Services Digital Network


    ISDN was the first effort to provide digital services to customer premises and
    the predecessor to ADSL. ISDN provides two interfaces—the basic rate interface
    (BRI) and the primary rate interface (PRI).'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'The BRI provides two channels of 64kbps for payload and a signaling channel
    of 16kbps. The two payload, or bearer channels, are referred to as B channels,
    and the signaling channel is referred to as the D channel. The PRI provides 24
    channels for T1 (32 for E1). The most popular use of the PRI is private branch
    exchanges (PBX), or enterprise telephone switches, which provides such features
    as voice mail and speed dial. PRI is also very popular for remote access services.
    The BRI interface has enjoyed widespread use in Europe but has not been widely
    deployed, especially for voice use, in the United States.


    # ISDN Uses


    The BRI does have some interesting applications for data networking, such as dial-on-demand
    networks, bandwidth on demand, and dial backup.


    Because ISDN is digital, the signaling required to connect is, unlike a modem,
    very quick. This fact, combined with a total bandwidth of 128kbps for the payload
    provide network designers additional flexibility in network design.


    Dial-on-demand networking avoids the use of a leased line and is transparent to
    the user or application. By connecting two sites with ISDN, one or both B channels
    can be dialed when traffic is detected for the remote side, and the channels can
    be torn down after a certain amount of inactivity. ISDN and dial-on-demand networking
    is popular in areas where fractional T1 services are not available (mostly Europe)
    or where the costs of the ISDN are cheaper than a fractional T1. Most service
    providers bill ISDN based upon usage, so the application is limited in many cases.


    ISDN can also be used to create additional bandwidth during peak utilization.
    For example, a router can be configured to bring up a channel after utilization
    reaches 98% and should bring the channel back down after it goes back below 95%.
    The "master" channel can be a leased facility or an ISDN channel.


    Probably the most popular use of ISDN in North America is dial backup. The router
    will use an ISDN connection to connect to the remote site when a network failure
    is determined. The network failure can be determined based upon a loss of signal
    on the leased line or by a network event, such as a network routing update announcing
    the route unavailable.


    # Frame Relay


    The major disadvantage of leased lines for data communications is the requirement
    for an interface for each leased line. Consider the network shown in Figure 12.8.
    There is a central site with four remote sites. With leased lines being used,
    the central router requires four physical interfaces to be used to network the
    four remote sites.


    Additionally, each remote site must route traffic through the central site to
    communicate with another remote site, or an additional leased line must be activated
    between the two remote sites. This means that for a 4 node network, 10 connections
    are required to fully mesh the network.'
