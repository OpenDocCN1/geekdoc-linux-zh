    # EGP Configuration


    If you need to exchange routing information with networks outside your own, you''ll
    need to use one of the border routing protocols. One choice is EGP, as you learned
    in Chapter 3, "Introduction to Border Routing Protocols." Fortunately gated can
    handle this job as well as internal routing. Just be sure to set this aspect up
    only on your external border router(s).


    Given that we''ve covered the general opening for these protocol configuration
    statements twice now, we''ll just start the EGP setup statement with what you''d
    use if you intended to activate EGP:


    egp on {


    The statements available to you in the egp configuration section are outlined
    in Table 5.17. As usual, some of these are too complex to explore fully in a single
    table. Specifically, group and its neighbor substatement are just covered in a
    simplified manner in the table.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Table 5.17 Options Available Within the egp Statement in gated


    | Option | Purpose | Format | Value(s) |

    |---|---|---|---|

    | defaultmetric | Sets the EGP cost assigned to routes this border router advertises
    to neighbors. | defaultmetric cost; | An integer from 1 to 255. If you assign
    the cost as 255, some border routers might assume your network is unreachable,
    so beware. |

    | group | Tells gated who its EGP neighbors are and how to interact with them.
    | group options { neighbor settings; }; | The format shown is a very simplified
    version of the group statement, which is covered in more detail in the chapter
    itself. |

    | packetsize | Sets the initial value of how large of a data packet EGP expects
    to receive from neighbors. | packetsize value; | The value is the number of bytes
    gated expects from EGP neighbors. If a packet is larger than this value, it gets
    truncated and therefore dropped. However, when this happens, value is automatically
    increased to be large enough to receive a packet of this size next time. The default
    is 8192 bytes. |

    | preference | Sets how important routes learned from RIP are to this border router.
    | preference value; | The lower the value, the more important RIP routes are.
    Default is 200. |

    | traceoptions | As usual, sets how the EGP portion of gated logs data. | traceoptions
    settings; | Options available to all protocols are listed in Table 5.11, and options
    available specifically in the egp statement are listed in Table 5.18. |'
  merge: -1
