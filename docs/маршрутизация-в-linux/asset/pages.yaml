- pgno: 216
  md: 'The qualifier is either an IP type (host, network or port), the direction (source
    or destination), or protocol. This may seem very confusing, but a few examples
    will clarify tcpdump’s use tremendously. If you examine the last tcpdump output,
    you will notice that the tcpdump already made use of the expression host 192.168.1.101,
    which tells tcpdump to print all packets that have the address 192.168.1.101 in
    either the source or destination fields.


    To tell tcpdump to only print packets from 192.168.1.254, the src qualifier is
    used:


    ```

    tcpdump -n -v src 192.168.1.254

    ```


    Or to display only packets destined for 192.168.1.254:


    ```

    tcpdump -n -v dst 192.168.1.254

    ```


    To further limit the output to not only a destination of 192.168.1.101, but to
    also limit the output to DNS (udp or TCP port 53), the following can be used:


    ```

    tcpdump -n -v dst 192.168.1.254 and port 53

    ```


    tcpdump does not require the integer port number but can interpret the logical
    name for the service (protocol) as defined by the Internet Assigned Numbers Authority
    (http://www.isi.edu/in-notes/iana/assignments/port-numbers) Table 9.7 lists some
    common services. The file /etc/services, located on Linux (and UNIX) hosts’ also
    lists the ports and their logical names.


    # Table 9.7 Common Protocols Ports and Logical Names


    | Application | Application Protocol | Layer 4 Protocol | Port (Assigned Number)
    | tcpdump Logical Port Name |

    |---|---|---|---|---|

    | Email | Simple Mail Transport Protocol (SMTP) | TCP | 25 | smtp |

    | Email | Post Office Protocol version 3 | TCP | 110 | pop-3 |

    | File Download | File Transfer Protocol (ftp) | UDP | 20 (data) | ftp |

    |  |  | UDP | 21 (command) | ftp-data |

    | Name Resolution | Domain Name System | TCP/UDP | 53 | domain |

    | Name Resolution (Microsoft) | NetBios | UDP | 137 | netbios-ns |

    |  |  | TCP | 137 |  |'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Table 9.7 Continued


    | Application | Application Protocol | Layer 4 Protocol | Port (Assigned Number)
    | tcpdump Logical Port Name |

    |---|---|---|---|---|

    | Network Management | Simple Network Management Protocol (snmp) | UDP | 161 |
    snmp |

    |  |  | UDP | 162 (traps) | snmp-trap |

    | Network Time | Network Time Protocol (ntp) | UDP | 123 | ntp |

    |  |  | TCP (rarely implemented) |  |  |

    | Remote Access | Telnet | TCP | 23 | telnet |

    | Routing Protocol | Border Gateway Protocol | UDP | 179 | bgp |

    |  |  | TCP | 179 |  |

    | System Logging | syslog | UDP | 514 | syslog |

    | World Wide Web | Hyper Text Transport Protocol (http) | TCP | 80 | www |

    |  |  | UDP (rarely implemented) | 80 |  |


    This means the aforementioned:


    ```

    tcpdump -n -v dst 192.168.1.101 and port 53

    ```


    can also be entered as


    ```

    tcpdump -n -v dst 192.168.1.101 and port domain

    ```


    And if this command is run and someone attempts to contact the web server at http://www.newriders.com/,
    a name resolution attempt would be printed:


    ```

    [root@lefty /root]# tcpdump -n -v dst 192.168.1.254 and port domain

    Kernel filter, protocol ALL, datagram packet socket

    tcpdump: listening on all devices

    10:36:31.504218 eth0 < 10.1.1.1.domain > 192.168.1.254.1026: 1552 2/12/12

    www.newriders.com, CNME newriders.com., newriders.com. A 63.69.119.220 (465) (DF)

    (ttl 250, id 31408)

    ```


    In addition to this modifier, tcpdump also supports the modifiers, not and or.
    A very useful application of the not modifier is to not print packets that are
    being created through the remote access session to the Linux node. Assuming telnet,
    the following tcpdump will print out all packets to and from the host except telnet:


    ```

    tcpdump host 192.168.1.254 and not port 23

    ```'
