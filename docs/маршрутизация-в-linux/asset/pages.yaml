- pgno: 168
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_168_0.png)


    # Kernel Support Tools


    THIS CHAPTER EXAMINES TWO SUPPORT DAEMONS for Linux: pppd and rip2ad.


    pppd is the Point-to-Point Protocol (PPP) daemon that provides PPP support to
    the Linux kernel and Linux network processes. The pppd provides a transparent
    interface to the user; that is, network utilities and applications can be used
    without the utilities and applications having to have knowledge of the Point-to-Point
    Protocol or pppd.


    pppd is a widely deployed Point-to-Point daemon for UNIX and Linux operating systems.
    Most versions of Linux use this version of pppd, with version 2.4.1 being the
    most recent release of the distribution. Before covering pppd, an overview of
    PPP and some design considerations will be presented.


    rip2ad is a utility that allows Routing Information Protocol (RIP) advertisements
    to be sent out of an interface without running a full-blown routing daemon. rip2ad
    is an ideal tool on Linux routers that acts as an edge device that in turn acts
    as a gateway to RIP systems but does not require the complexity of RIP on the
    local systems.


    We will begin with an overview of PPP, followed by sections on PPP for Linux and
    rip2ad.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# PPP Overview


    PPP was designed for serial connection protocols and has become the Internet standard
    for both dial-up and leased (nailed) line connections. PPP''s open standard encouraged
    wide support by vendors and the Internet explosion, and use of serial links to
    connect to the Internet have created wide acceptance of the protocol—with very
    few interoperability problems. PPP is defined in RFC 1661, "The Point-to-Point
    Protocol (PPP)."


    PPP''s format is straightforward and takes advantage of the High-level Data Link
    Control (HDLC) protocol with the addition of a PPP header made up of one field
    containing the size of the packet and the protocol field, which defines the type
    or protocol of the packet being transported. PPP supports hundreds of protocols.
    Table 7.1 summarizes the common types seen in enterprise environments.


    Table 7.1 Common Protocols Supported by PPP


    | Value | Protocol |

    |-------|----------|

    | 0x0021 | IP |

    | 0x002D | Van Jacobson Compressed IP |

    | 0x002F | Van Jacobson Uncompressed IP |

    | 0x003D | PPP Multilink Protocol (MP) |

    | 0x8021 | PPP Internet Protocol Control Protocol (IPCP) |

    | 0xC021 | Link Control Protocol (LCP) |

    | 0xC023 | Password Authentication Protocol (PAP) |

    | 0xC223 | Challenge Handshake Authentication Protocol (CHAP) |


    # Logical View of PPP


    PPP is not just the encapsulation of packets over the link; the PPP stack must
    support specific functionality throughout the lifetime of a PPP session. RFC 1661
    defines this functionality in the term of phases, which are shown in Figure 7.1.


    # Link Dead Phase


    The link dead phase is the phase entered before and after a PPP session. When
    triggered to leave this phase by the Link Control Protocol (LCP), covered shortly,
    PPP will enter the link establishment phase.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_170_0.png)


    # Link Establishment Phase


    LCP provides the link establishment phase. The connection is established with
    the bare minimum configuration options to bring the link up. Neither peer in the
    process is aware of particular options supported by the other—with the exception
    of authentication protocol selection. Should authentication be determined (negotiated)
    during the link establishment phase, the type of authentication will be determined
    (negotiated) during the link establishment phase.


    LCP is defined in RFC 1661 with some added capabilities in RFC 1570, “PPP LCP
    Extensions.” The LCP packet is made up of the LCP header and data and is encapsulated
    within the PPP packet as shown in Figure 7.2.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_170_1.png)


    The LCP header includes an LCP code that identifies the messaging type, which
    could be a rejection to a particular option request. The LCP codes are listed
    in Table 7.2.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Table 7.2 LCP Protocol Codes


    | Value | Message |

    | --- | --- |

    | 1 | Configure-Request |

    | 2 | Configure-Ack |

    | 3 | Configure-Nak |

    | 4 | Configure-Reject |

    | 5 | Terminate-Request |

    | 6 | Terminate-Ack |

    | 7 | Code-Reject |

    | 8 | Protocol-Reject |

    | 9 | Echo-Request |

    | 10 | Echo-Reply |

    | 11 | Discard-Request |


    The data field is determined by the LCP code. This means that each message has
    a particular data or payload portion that matches the message.


    After the link establishment phase has been accepted by both parties, the authentication
    phase is entered.


    # Authentication Phase


    Prior to accepting any option parameters, the nodes can authenticate one another.
    Although not required, there is no good reason to not use authentication. This
    is unless another form of authentication is deemed adequate, such as caller ID.
    Once both peers are satisfied with any required authentication, the network layer
    protocol phase is entered. (Most sites only have the central remote access server
    authenticate the remote site; however, authentication can be supported in both
    directions regardless of which node initiated the session.)


    PPP supports two authentication methods: Password Authentication Protocol (PAP)
    and the Challenge Handshake Authentication Protocol (CHAP).


    PAP is a simple username and password mechanism whereby the node sends the username
    and password in plain text. The user name and password are accepted or rejected
    by the remote node.


    CHAP uses a more complicated 3-way handshake without sending clear text usernames
    or responses: challenge, response, and acknowledgement.


    The node wishing to authenticate the remote host will send a challenge based on
    a secret phase that is known to itself and that also should be known by the remote
    node. The remote node uses the challenge and the secret phase with a hash function
    to compute the response. The response is then sent, and the node checks the response
    to ensure it is the same calculated response it computes itself and, should it
    match, acknowledges the authentication and allows the connection to continue.


    Unlike PAP, CHAP never sends the secret phase, not even in encrypted form.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# Network Layer Protocol Phase


    The Network Control Protocol (NCP) determines the appropriate options for the
    protocols being supported. Each protocol supported by a node will have an NCP
    for the particular protocol. In addition, these NCPs can run in parallel. For
    example, IP and IPX options can be negotiated at the same time. Layer 3 traffic
    can be passed at this point within the phase, assuming the particular protocol
    was negotiated.


    For IP over PPP, RFC 1172, "The PPP Internet Protocol Control Protocol (IPCP)"
    defines the standard for IP NCP.


    IPCP uses the LCP packet format. However, only codes 1 through 7, shown in Table
    7.3, are valid.


    # Table 7.3 IPCP Protocol Codes


    | Value | Message |

    | --- | --- |

    | 1 | Configure-Request |

    | 2 | Configure-Ack |

    | 3 | Configure-Nak |

    | 4 | Configure-Reject |

    | 5 | Terminate-Request |

    | 6 | Terminate-Ack |

    | 7 | Code-Reject |


    To distinguish IPCP packets from LCP, the protocol field in the PPP header is
    set to 0x8021.


    In addition to determining that IP is supported on the link, the network layer
    protocol phase uses specifics of IPCP to determine the IP address of the local
    IP address of the link and whether compression should be used.


    Although the IP address must not be determined with IPCP, most implementations
    of PPP allow the administrator to determine which IP address is required. Most
    sites require that the central remote access server provide the IP address to
    ensure proper routing within the network.


    # Link Termination Phase


    Under ideal conditions, the link termination phase is signaled end-to-end using
    PPP terminate packets; however, the link termination phase also can be caused
    by a loss of carrier or an immediate shutdown by the system administrator.


    It is interesting to note that although the states seem very sequential, a state
    can be entered in the "middle" of a session, which would be during the network
    layer protocol state. For example, authentication could be requested again after
    having already authenticated once. This is represented by the arrows pointing
    the various states in Figure 7.1.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'Users tend to think of PPP as a client server protocol because it is often
    used to connect remote resources (a PC for example) to a central office (a network
    access server). However, the protocol, at least as defined by the standards, is
    a peer protocol with all options available to both peers. But despite this support,
    typical installations will often implement client server-type architectures. For
    example, the remote PC just mentioned will authenticate with the central resource,
    but the central Network Attached Storage (NAS) will not authenticate with the
    PC despite the protocol supporting the option. Additionally, some implementations
    of PPP will not support the bi-directional functionality on the "client" side.
    An example of such an implementation is Microsoft Windows Dial-Up networking''s
    lack of authentication of the peer when dialing in to a remote site.


    # Advanced Uses of PPP


    In addition to the vanilla dial-in access, there are many advanced uses of PPP
    that provide additional network capability or provide solutions to network problems.
    These applications and PPP are not dependent on each other from a standards perspective,
    but many vendors have tied the features so closely to PPP that they are often
    only supported with PPP or require PPP to take advantage of the full functionality.


    # Leased/Nailed lines


    PPP offers good interoperability for leased lines between various vendor products.
    HDLC has not been proven successful due to vendor interoperability issues. (HDLC,
    unlike PPP, does not provide protocol negotiations.)


    # PPP over ISDN


    Integrated digital services network (ISDN) has become very popular in Europe,
    and ISDN4Linux (http://www.isdn4linux.de/) has become quite popular for running
    PPP over ISDN connections. ISDN has very quick call setups, so it lends itself
    well to additional features such as caller identification, caller identification
    call-back, and some of the specific applications covered in the next sections.


    # Dial on Demand


    When a dial-up connection, such as an asynchronous (modem) or ISDN connection,
    is used to provide a gateway to another network or the Internet, the router making
    the connection must initiate the connection. The initiation is usually created
    by traffic bound for the PPP interface. Besides this basic gateway functionality,
    dial on demand is often built upon to provide additional functionality such as
    dial backup and bandwidth on demand.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Dial Backup


    Dial backup provides an alternate route to a network based on a network failure.
    The network failure can be determined based on an interface status or a condition
    reported by a network protocol, such as a network failure. Although not required,
    dial backup is usually used to back up a leased line connection.


    Consider Figure 7.3. The Linux router, "sleepy," is connected to the router, "tired,"
    via a fractional T1 line providing 256Kbps of bandwidth (without compression)
    for the dedicated connection.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_174_0.png)


    Figure 7.3 Dial backup network.


    As shown in Figure 7.4, the leased line has failed. The backup connection has
    become active, providing continued connectivity between the sites.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_174_1.png)


    Figure 7.4 Dial backup network with failure.


    # Bandwidth on Demand


    Bandwidth on demand uses a dial-up connection to provide additional bandwidth
    to a network by adding the bandwidth of a dial up to the already existing connection
    through a load-balancing algorithm. The bandwidth on demand is triggered by a
    utilization threshold on the main link.


    The PPP multilink protocol can be used to bundle multiple PPP links together and
    is defined in RFC 1990, "The PPP Multilink Protocol (MP)."'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# PPP for Linux


    pppd for Linux is available at ftp://cs.anu.edu.au/pub/software/ppp/.


    The Linux kernel sources (2.2 and 2.4) have the necessary drivers for kernel support,
    and the PPP package contains the user daemon, supplemental programs, documentation,
    and example configuration files. (If MP support is needed, then kernel 2.4 is
    also needed.)


    Most Linux distributions provide PPP support directly, or it is normally easily
    added with a package manager or sys admin tool; however, it is important to know
    how the standard pppd package works considering it is the basis for most distributions.
    An understanding of the package will help troubleshoot networking problems and
    the pppd wrappers that have become popular with most distributions.


    Should the kernel need to be compiled, the serial and PPP support should be activated.


    # Compiling


    Compiling pppd is very straightforward under Linux:


    +   Place the ppp distribution downloaded from ftp://cs.anu.edu.au/pub/software/ppp/
    into a source directory such as /usr/src/.

    +   Unzip the archive:


    ```

    [root@lefty src]# gunzip ppp-2.4.1.tar.gz

    ```


    And untar the tarball:


    ```

    [root@lefty src]# tar xvf ppp-2.4.1.tar

    ```


    This will create the source directory structure ppp-2.4.1. Move into the directory
    to compile the source code and install pppd:


    ```

    [root@lefty src]# cd /usr/src/ppp-2.4.1

    ```


    Execute the configure script:


    ```

    [root@lefty ppp-2.4.1]# ./configure

    ```


    Then run the make:


    ```

    [root@lefty ppp-2.4.1]# make

    ```


    Finally, install the distribution with make install:


    ```

    [root@lefty ppp-2.4.1]# make install

    ```


    # File Location and Configuration


    The installation will install files into two directories: /usr/sbin/ and /etc/ppp/.


    The files stored in /usr/sbin/ are pppd, the PPP daemon; pppdump, a packet dump
    utility; and pppstats, a utility that reports the statistics for a given PPP interface.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'The files stored in /etc/ppp/ from the installation are chap-secrets and pap-secrets,
    which contain user and authentication information; ip-up and ip-down, which are
    interface scripts; and options, which defines the behavior of pppd. pppd supports
    100+ options, guaranteeing interoperability with almost any implementation of
    PPP Thankfully, most current generations of PPP support the standards requirements
    that options be negotiated. So many options are not required. However, some of
    the more common options are given in Table 7.4.


    # Table 7.4 pppd Options


    | Option | Description |

    |---|---|

    | auth | Requires the peer to authenticate. Should the Linux node have a default
    route already defined, the auth parameter is assumed or "default." If the Linux
    node does not have a default route and neither auth nor noauth are specified,
    pppd will not require authentication; but the peer must have an IP address within
    a network that the Linux node does not currently have a routing entry for. |

    | call name | Tells pppd to read its options from /etc/ppp/peers /name. This is
    very useful for supporting connections to multiple sites. |

    | connect script | Instructs pppd to use the script (or executable) given to communicate
    with the serial port and modem. |

    | crtscts | no crtscts | Turns hardware flow control on and off. Should it not
    be specified, the flow control will not be changed. |

    | defaultroute | Causes the node to create a default routing entry to the remote
    peer. This is normally the behavior desired when the connection is to the Internet
    or as a route of last resort for a LAN connecting to a central remote access server.
    |

    | file file | Instructs pppd to read the configuration parameters from file. The
    parameters are entered one per line in the text file. |

    | lock | Instructs pppd to lock the serial port for its exclusive use. |

    | Local IP:Remote IP | The local and remote PPP interfaces can be specified by
    placing the two addresses between a colon (:). |

    | debug | Turns on additional debugging information to the syslog facility. |'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Table 7.4 Continued


    | Option | Description |

    |---|---|

    | demand | Instructs pppd to operate in a dial-on-demand fashion. Should traffic
    be sent for the remote site, pppd will kick off the connection automatically without
    user interaction. This is the desired behavior for network gateways. |

    | require-chap | require pap | Requires the peer to authenticate using the specified
    option. |


    # Running pppd


    pppd can be used to initiate a connection to a remote site or to wait on a connection
    from a remote site. When pppd is used to connect to a remote site, it is referred
    to as client operation, and when used to listen for a connection, it is referred
    to as the server. (Remember, this client/server model comes from the idea that
    a client initiates a session; from a protocol perspective, the two nodes are peers
    and not client and server.)


    To initiate a PPP connection using pppd, several configuration options must be
    known and entered into the pppd configuration files. The following example is
    one that is typical for a connection to an ISP


    The configuration information needed is the PAP username and password or CHAP
    host name and password, the access telephone number, whether the IP address is
    assigned dynamically or statically, and the serial port to which the modem is
    connected.


    Let''s assume the following information for the configuration:


    +   PAP username: customer1

    +   PAP password: customerpassword

    +   Access telephone number: 800-555-5555

    +   IP address: assigned dynamically

    +   Serial port: /dev/ttyS0


    This information must now be entered into the appropriate files. Because this
    configuration uses PAP authentication, the /etc/ppp/pap-secrets would have the
    following entry:


    ```

    #Secrets for authentication using PAP

    # client    server    secret    IP addresses

    customer1   isp   customerpassword

    ```'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'The pppd does not provide direct-dial support, so an additional program is
    needed to dial. The chat program is normally used for this purpose. The chat program
    makes use of a chat script that, in the past, has played a very important role
    with remote access servers that required a login session to be initiated before
    PPP could be started. This is no longer the case with most remote access services—the
    majority can now start PPP immediately after the modem has picked up.


    Nowadays, the chat program, for most ISP and enterprise connections, must only
    send any needed initialization strings to the modem and the dial command. The
    chat setting will be specified with the connect parameter. The connect parameter
    and a few other key parameters are included in the /etc/ppp/options file:


    ```

    lock

    debug

    /dev/ttyS0

    crtscts

    defaultroute

    connect ''/usr/sbin/chat -v "" ATZ OK ATDT 8005555555''

    ```


    The options were covered in Table 7.4, but briefly, the options file has defined
    that pppd needs to lock the serial port (lock option), log extra debug information
    (debug), use serial port /dev/ttyS0, turn on hardware flow control (crtscts),
    create a default route to the peer, and then connect using the chat command given.


    The connection to the ISP can then be started by simply starting pppd:

    [root@lefty /root]# pppd


    Problems with pppd are generally either modem or authentication related. The first
    place to check for problems is the /var/log/messages file. For example, the following
    entries:


    ```

    Jun 3 09:08:45 lefty pppd[11857]: pppd 2.4.1 started by root, uid 0

    Jun 3 09:08:45 lefty pppd[11857]: Removed stale lock on ttyS0 (pid 11850)

    Jun 3 09:08:46 lefty chat[11858]: expect ( )

    Jun 3 09:09:31 lefty chat[11858]: alarm

    Jun 3 09:09:31 lefty chat[11858]: Failed

    Jun 3 09:09:31 lefty pppd[11857]: Connect script failed

    Jun 3 09:09:32 lefty pppd[11857]: Exit.

    ```


    would imply that the chat script failed, which can be caused by a typo or, in
    this case, the modem not responding.


    The easiest way to test the modem is to run a chat script directly and turn up
    the volume to receive audio feedback from the script:


    ```

    /usr/sbin/chat -v "" ATZ OK AT&L2M2 ATDT 8005555555

    ```


    With authentication problems, should the Linux router not be authenticated to
    the remote site, it will record "Failed to authenticate ourselves to peer." Should
    the remote site not authenticate with the Linux node, then Linux will report "Authentication
    failed."'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Additional Network Services Considerations


    For Linux routers acting as gateways, the network designer must determine what
    additional services should be run on the gateway. The additional services are
    based on need, expense, and management.


    # Email


    Mail services are often run on the Linux gateway to provide mail delivery, especially
    to the Internet.


    Linux does a very nice job of handling mail services, which might prove to be
    an ideal solution for a corporate mail system.


    Gateways to the Internet should be considered carefully. Placing the mail server
    on the pppd server leaves the mail server open should the gateway be compromised.


    # Domain Name Services (DNS)


    DNS is often a good candidate for running on the same gateway as pppd. Like a
    mail server, the DNS server (usually BIND), also is open to attack; however, DNS
    is not considered as risky as email for several reasons: It is less interesting
    to hackers, traditionally has fewer holes than mail servers (although this trend
    is subsiding as mail servers are continually being hardened), and typically only
    brings about a denial of service as opposed to a threat to resources.


    A DNS server run in cache-only mode can be useful for both corporate and Internet
    gateways. A cache-only server simply caches all entries requested for later use.
    This saves query time for the next user that requests the particular host name
    and keeps the additional traffic off the gateway''s WAN link.


    For corporate gateways, it is worth considering loading the internal domains on
    the name server as well. This allows name server resolution to occur locally,
    as opposed to sending the request over the WAN link. There is a small additional
    load created by the name server pulling the zones on a timed basis, but the load
    is typically small and is often worth the trade-off if more than a few internal
    name resolution requests are required.


    Placing a DNS server does have risks, though; and, like email, should be considered
    carefully to ensure that the advantages gained are worth the risk.


    # Web Caching


    Web caching, like DNS, might be considered for both Internet and corporate connections.
    Under best circumstances, a 5%-10% hit rate can be expected on visited pages in
    larger sites. Many current web caching solutions allow predefined sites to be
    cached and common pages to be "mirrored," which can be very effective for storing
    local copies of corporate intranet sites.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# rip2ad


    rip2ad, written by Andrea Beck, is a RIP version 2 broadcast (actually multicast)
    utility available at http://www.ibh.de/~beck/stuff/ripper/. rip2ad provides RIP
    advertising functionality without having to run a full-blown routing daemon or
    having to support RIP on the local network. In the past, this functionality was
    often provided by beastd; however, beastd is no longer maintained and does not
    support RIP-2.


    # A rip2ad Example


    Consider the network in Figure 7.5. The Linux router named "ritz" needs to tell
    the corporate router, "gate" about the local networks 192.168.0.0/24, 192.168.1.0/24,
    192.168.2.0/24, and 192.168.3.0/24, which can be summarized as 192.168.0.0/22.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_180_0.png)


    The problem could be solved by running RIP within the remote network, having "ritz"
    run RIP with static routes pointed towards the other LAN networks, or having a
    static routing entry on "gate"; however, static routes might be prohibited by
    policy, which has the disadvantage of "gate" always further advertising the route,
    even when the link is not available due to an outage.


    Running a routing protocol daemon on "ritz" is overkill, but router "ritz" can
    use rip2ad to tell corporate router "gate" about the networks without RIP having
    to run on itself, "jos", or "hild".'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# Compiling and Installing rip2ad


    rip2ad is simple to compile with a one-liner:


    ```

    [root@lefty ripper]# gcc rip2ad.c -o rip2ad

    ```


    The rip2ad executable can then be placed in an appropriate place, such as /usr/local/sbin/:


    ```

    [root@lefty ripper]# cp rip2ad /usr/local/sbin/

    ```


    rip2ad can be used with only command-line arguments, but the -f parameter allows
    a filename to be specified, which makes its use a bit easier.


    For the network shown in Figure 7.5, the following /etc/riptable is entered:


    ```

    192.168.0.0 255.255.255.0 0 1

    192.168.1.0 255.255.255.0 0 1

    192.168.2.0 255.255.255.0 0 1

    192.168.3.0 255.255.255.0 0 1

    ```


    This table is made up of the network address, the netmask, the IP address that
    advertises the route, and the metric. In this specific example, the 0 in the IP
    address field tells rip2ad to use the local IP address, which is fine with this
    example—it isn''t important for ''gate'' to know anything more specific.


    To have rip2ad advertise these routes every 30 seconds, we use


    ```

    [root@lefty ripper]# rip2ad -f /etc/riptable -c 30 &

    ```


    If tcpdump is used to examine the packets, the advertisements will be seen to
    the RIP-2 multicast address:


    ```

    [root@lefty ripper]# tcpdump

    Kernel filter, protocol ALL, datagram packet socket

    tcpdump: listening on all devices

    09:33:38.311593 eth0 > 224.0.0.9: route: rip-resp 4:

    {192.168.0.0/255.255.255.0}(1) {192.168.1.0/255.255.255.0}(1)

    {192.168.2.0/255.255.255.0}(1) {192.168.3.0/255.255.255.0}(1) [ttl 1]

    1 packets received by filter

    ```'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'As mentioned, the networks can be summarized as 192.168.0.0/22 (netmask = 255.255.252.0),
    so the following /etc/riptable can be used:


    ```

    192.168.0.0 255.255.252.0 0 1

    ```


    If rip2ad is started again with the new /etc/riptable:


    ```

    [root@lefty ripper]# rip2ad -f /etc/riptable -c 30 -d 10.1.1.1 &

    ```


    Then tcpdump will show the new route being advertised:


    ```

    [root@lefty ripper]# tcpdump -n host 192.168.1.1

    09:49:32.124445 eth0 > 192.168.1.254.route > 10.1.1.1.route: rip-resp 1:

    {192.168.0.0/255.255.252.0}(1)

    ```


    # Summary


    This chapter has provided a technical overview of PPP, the protocol of choice
    for point-to-point connections. We''ve also covered the Linux PPP daemon, pppd,
    and its configuration. Additionally, rip2ad has been covered, which lends itself
    to providing RIP gateway functionality without the complexities of a full-blown
    routing daemon.'
  merge: -1
  img_proc: true
- pgno: 183
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 184
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_184_0.png)


    # Kernel 2.4.x Routing Daemons


    IN THIS CHAPTER WE''LL LOOK AT some of the changes in the 2.4.x kernel series
    and how they affect routing services. We''ll also take a look at some tools you
    might want to use to configure your Linux router.


    # Changes from 2.2.x to 2.4.x


    The biggest change from the 2.2.x series of kernels to the 2.4.x series, at least
    as far as networking is concerned, is the migration from ipchains to the Netfilter
    architecture. Netfilter facilitates a new level of services, including stateful
    packet filtering and better NAT.


    The introduction of Netfilter allows Linux to handle some of the more sophisticated
    routing through a Linux box. For anyone new to Linux, this is a huge boon with
    no real drawbacks. For experienced Linux admins, it means learning (again) a new
    set of tools to manage packet filtering and NAT. Of course, optimists will simply
    see it as job security and an interesting exercise in extending their current
    skills.


    Stateful inspection of packets increases security and efficiency. It also, to
    some extent, increases complexity in configuration; but it''s more than a fair
    trade-off for the capabilities you will have.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'In the 2.2.x series of kernels, Source NAT (SNAT), Destination NAT (DNAT),
    and redirection aren’t even options. However, Netfilter makes configuring these
    types of NAT relatively painless and dramatically improves the routing capabilities
    of Linux.


    # More on Netfilter


    Netfilter/iptables is also used for IP Masquerading and setting up firewalls.
    Chapter 14, “Security and NAT Issues,” walks you through the use of Netfilter/iptables
    to set up IP Masquerading, firewall rules, and NAT.


    # Enabling ipwadm and ipchains Support


    Though we cover kernel configuration more thoroughly in Chapter 13, “Building
    a Routing Kernel,” we wanted to cover migrating your ipwadm or ipchains setups
    here.


    We think that iptables is a much better tool for setting up firewalls and NAT;
    but for ease of migration, the 2.4.x kernel provides compatibility modules for
    both ipwadm and ipchains.


    When compiling a new kernel, be sure to enable support for development drivers
    and code. When using menuconfig or xconfig, you’ll find this option under the
    menu item, Code Maturity Level Options. The only choice given under this menu
    item is Prompt For Development and/or Incomplete Code/Drivers. Go ahead and select
    y for this option.


    In the Networking Options menu, you will need to enable IP: Netfilter Configuration.
    In the 2.4.x kernel series, ipchains and ipwadm support run on top of the Netfilter
    framework.


    You can use iptables, ipchains, or ipwadm, but you can’t use them together. You’ll
    have to disable all other options under IP: Netfilter Configuration or enable
    them as modules only to be able to enable either ipchains or ipwadm. You can compile
    module support for all three if you want, but it’s probably best to stick with
    one and recompile if you decide to migrate to iptables.


    That’s really all there is to it. After you’ve compiled the kernel, you can use
    either module to continue support for your old setup until you’re ready to migrate
    to iptables.


    > Note: Development and Incomplete Code/Drivers

    > Don’t worry! Selecting this option will not make your kernel unstable; it simply
    allows you to choose features or drivers that aren’t considered “stable” yet.
    In many cases, you’ll find that so-called “unstable” features are quite reliable,
    usually more so than some commercial-release software. The bar for “stable” with
    most Free Software or Open Source projects is considerably higher than for commercial
    software on many occasions. However, you will find that “unstable” code or drivers
    are often not feature-complete.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Other Networking Linux 2.4.x Kernel Options


    One thing you''ll notice if you''ve compiled several 2.2.x kernels is that not
    much has changed. Ethernet bridging is no longer considered experimental, and
    a few options have either been moved around or dropped altogether; but for the
    most part there aren''t any drastic changes in networking.


    # ATM Support


    One notable addition is ATM (Asynchronous Transfer Mode) support, which is currently
    in experimental mode. Actually, ATM is (at the time of this writing) still hard
    to get running for some people and in Alpha or pre-Alpha development. If you''re
    going to be using your Linux router as an edge router, you''ll want to enable
    this option. To use ATM, you''ll need several userspace programs that can be found
    at the ATM section on the Linux homepage at http://icawww1.epfl.ch/linux-atm/.
    There also is an ATM on the Linux mailing list that might be useful while getting
    up and running.


    # Explicit Congestion Notification Support


    The TCP Explicit Congestion Notification Support option allows routers to notify
    clients about network congestion. Unfortunately, not all firewalls/routers on
    the Internet understand this feature. It''s probably best to leave this feature
    disabled for the time being, as it may cause headaches when your users cannot
    connect to sites that refuse connections from clients with ECN enabled.


    It''s also possible to compile support for this option, but turn it off by issuing


    ```

    echo 0 > /proc/sys/net/ipv4/tcp_ecn

    ```


    This might be the best scenario, as it will allow you to turn the feature on without
    recompiling the kernel if support for ECN improves. More than likely there will
    be some sites that "break" in response to this option for the foreseeable future.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# WAN Interfaces


    The 2.4.x kernel supports a wider variety of WAN interfaces. You''ll need to explicitly
    enable WAN Interfaces Support and then look to find your device. With any luck,
    you''ll be able to check to see if there is Linux support for your WAN card and
    then purchase the right device instead of hoping that your device is supported
    when trying out Linux.


    > Note: Oddly Placed Options

    > This has (as far as we know) little to do with routing or networking, but the
    option for Fibre Channel driver support can be found in the Network Device Support
    menu when configuring the kernel. Fibre Channel is a technology meant to replace
    SCSI but isn''t directly related to networking (that we''re aware of). Mainly
    we bring this up so that users won''t wonder if this is something that should
    be enabled or not. Unless you''re using Fibre Channel devices, just choose n.


    There are some high-speed networking devices that operate over fiber or copper,
    specifically Fiber Distributed Data Interface (FDDI) and High Performance Parallel
    Interface (HIPPI). Those options are also located in the Network Device Support
    menu, and if you''re going to be using those technologies, be sure to enable support
    for them in the kernel.


    # Wireless LAN


    Though wireless LAN equipment is still a bit pricey, it''s good to know that it
    is supported. The 2.4.x kernel adds wireless LAN support and support for several
    Aironet cards/adapters, the AT&T/Lucent WaveLAN, and Metricom''s starmode radio
    IP. If you''re using a Personal Computer Memory Card International Association
    (PCMCIA) card with wireless support, you also might need to enable support for
    a specific PCMCIA device as well as support for PCMCIA itself.


    In most cases, you will be able to say no to Wireless LAN support. However, if
    you have special needs that require mobility on your LAN or just want to surf
    around the house on your laptop, this is the way to go.


    # USB Support


    The 2.4.x kernel series adds support for many USB devices previously unsupported.
    This includes USB modems, ethernet devices, and other network devices. These devices
    will be excellent additions to your Linux arsenal in time, but right now we''d
    suggest sticking with PCI or PCMCIA Ethernet cards and "traditional" devices unless
    you have a compelling reason for venturing into USB devices. Most USB networking
    devices are in the experimental stage; and with product life cycles being what
    they are, by the time they''re fully supported, the devices themselves are likely
    to have been replaced by newer-generation devices. Unless the manufacturer supports
    Linux directly, you''re probably better off avoiding USB in the short term. (Note
    that we''re writing this in the Summer of 2001. By the time you read this, the
    situation might have changed dramatically.)'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Virtual Private Networks


    Another of the more advanced functions you can implement with Linux is a Virtual
    Private Network (VPN). VPNs are becoming a popular solution as security becomes
    more and more of an issue in information technology.


    In this section we’ll look at a popular VPN solution for Linux and discuss one
    of the more popular commercial alternatives as well.


    # PoPToP


    If you’re looking to set up a VPN over PPTP with Linux, one of the tools you should
    take a look at is PoPToP. PoPToP is a PPTP implementation for Linux, and there
    are ports available for Solaris, OpenBSD, and FreeBSD—which might be of interest
    if you happen to be working in an environment with those operating systems in
    addition to Linux.


    Because many commercial environments are a mixture of Linux servers and workstations
    with Windows clients, PoPToP supports Windows clients as well as Linux. So far,
    PoPToP supports Windows 95, 98, NT, and 2000. The price is also right, as PoPToP
    is licensed under the GNU General Public License—so no worries about license fees.


    # Getting the Code


    As of this writing, the most recent stable version of PoPToP is 1.0.1. There is
    also an unstable version with more cutting-edge features available, but we recommend
    you stick with the stable code unless there’s a feature that you desperately need
    in the development version, or if you want to assist with finding bugs and contributing
    code.


    You can find PoPToP at http://poptop.1ineo.com/.


    At the site you’ll find source code for Linux, Solaris, and other operating systems.


    There are also RPMs compiled for i386 and source RPMs if you’re running a distribution
    that uses RPM. If you’ll be connecting from Windows clients, there are a few patches
    you’ll want to grab. To enable Microsoft Encryption (MPPE) or Microsoft Authentication
    (MSCHAPv2), you’ll need to download and install the appropriate patches, which
    are also available from the web site.


    # Installing PoPToP


    In this section we’ll show you how to install PoPToP on Linux from source. After
    you have the PoPToP code, cp it to the /tmp or /usr/local/src directory, depending
    on your personal preference.


    Make sure that you’re logged in as root, uncompress the tarball that you retrieved,
    and then cd to the new directory. Then run


    ```

    ./configure

    make

    make install

    ```'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Assuming there have been no compiler errors, you should now have the PoPToP
    binaries in /usr/local/bin. You also will need to be root to launch the PPTP daemon
    pptpd.


    # Configuring and Debugging PoPToP


    After everything has been compiled and installed, you''ll need to edit three files
    to tweak everything for your installation. The files are /etc/pptpd.conf, /etc/ppp/chap-secrets,
    and /etc/ppp/options.


    The /etc/ppp/chap-secrets is a text file containing the username, password, servername,
    and valid IP addresses that they can connect from. You''ll want to add one or
    more users to this file so that they can connect to the server.


    There is a sample /etc/pptpd.conf file included with the source download, which
    you can customize to your own tastes. You''ll use this file to set the local and
    remote IP addresses, speed at which clients can connect, ports at which the daemon
    will listen, and debugging level. Make sure that you restart syslogd after starting
    pptpd to enable logging.


    Finally, you''ll need to edit /etc/ppp/options that is included with the source
    distribution to reflect the options in /etc/ppp/chap-secrets.


    If you have any problems setting up PoPToP, you might want to check the PoPToP
    web site for troubleshooting tips or workarounds for particular clients. Right
    now there are several HOWTOs and setup guides for various Windows clients.


    # Commercial VPN Solutions


    If you''re looking for a quick-and-easy solution to your routing and VPN needs,
    there are a few commercial solutions available that you might find easier to set
    up.


    Most of these are based on the Open Source and Free Software tools but include
    slicker configuration tools. There are also some Linux-based hardware solutions
    that you might find to be interesting alternatives to Cisco routers.


    # NetMAX VPN Server


    One outstanding commercial product is the NetMAX VPN Server. It''s a customized
    Linux distribution with web-based setup tools that allow you to quickly and easily
    set up an IPSec VPN solution. It also includes Windows client software, so you
    can easily set up a client to connect to your VPN. The downside, however, is that
    the NetMAX solution does come with per-client and per-server license fees. Legally,
    you can''t buy one copy of NetMAX VPN server and install it on multiple machines,
    or install the client software on unlimited machines. Also there is no Linux client
    software, so if some of your road warriors are on Linux machines you''ll still
    have to hand-configure those clients.


    On the other hand, the NetMAX software is very easy to use and is fairly reasonably
    priced compared to other proprietary solutions. It might be worthwhile to look
    into if you''re going to be setting up several VPNs—or just one in a hurry.'
  merge: -1
  img_proc: true
