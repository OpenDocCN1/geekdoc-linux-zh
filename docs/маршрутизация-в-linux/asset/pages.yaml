- pgno: 269
  md: '# Upgrading from 2.2.x to 2.4.x


    Upgrading from the 2.2.x series to the 2.4.x series isn''t that difficult, but
    there is a little prep-work you''ll need to do before actually compiling the kernel.
    There are a few support programs and libraries that will need to be upgraded to
    the latest version. The latest requirements can be found in the file, /usr/src/linux/Documentation/Changes.
    You will probably need to upgrade GNU C, GNU Make, binutils, modutils, and e2fsprogs
    at the very minimum—unless you''ve been keeping up with the latest versions already.


    # Obtaining the Source


    The first thing to do is to get the source code for the Linux kernel. Most distributions
    include the most recent source code to the kernel at the time that the distribution
    was packaged for sale, but that''s probably a few versions behind by the time
    that it lands on your hard drive.


    To get the most up-to-date kernel source for either kernel series, go to the Linux
    Kernel Archives at http://www.kernel.org/. The Kernel Archives have an extensive
    mirror system, which will likely be faster than grabbing the source from the main
    archive itself. It''s probably best to find the mirror closest to you and bookmark
    it for later use. Compiling your own kernel is addictive, so you''ll want to visit
    often.


    The kernel source is available in gzip or bzip2 format. The bzip2 format shaves
    several megabytes off the size of the archive, but not every distribution comes
    with bzip2 tools by default. It might be worthwhile to grab the bzip2 utilities,
    though, because some projects offer only bzip2-compressed files. The Netfilter
    project, for instance, only offers their user-space tools as a bzip2 archive.


    # Getting Bzip2


    Bzip2 is faster and generally delivers better compression than GNU Gzip. Because
    you''ll probably need it for uncompressing various projects anyway, you should
    give it a whirl. The Bzip2 Homepage and source code can be found at http://sources.redhat.com/bzip2/.


    After you''ve downloaded the kernel source, copy it to /usr/src/. You will need
    to be logged in as the root user to do this and to compile and install the kernel.
    Before you uncompress the kernel source, run an ls -l in the /usr/src/ directory
    to see if there''s a linux directory or symlink there already. Delete the symlink
    or directory and then execute tar -zxvf linux-2.x.x.tar.gz to uncompress a tarred
    and gzipped file. If you downloaded the bzip2ed kernel source, run bzip2 -d linux-2.x.x.tar.bz2
    and tar -xvf linux-2.x.x.tar.


    After the source is uncompressed, cd to the linux directory. To make sure that
    everything is set up correctly, run the make mrproper command:


    ```

    $ cd linux

    $ make mrproper

    ```


    And then everything should be configured correctly for the next few steps.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'Now comes the fun part, choosing the components of your custom kernel. You
    have the option of running make config, make menuconfig or make xconfig. Running
    make config will run through all of the possible kernel options one at a time
    and prompt for a choice of Yes, No, or (sometimes) Module. This can be long and
    tedious because you’ll be prompted for just about every kernel configuration option
    without being able to switch between questions.


    The make menuconfig option will bring up an ncurses-based menu system at the console
    that will enable you to configure the various kernel options. If you’re running
    X on this machine, you can use the make xconfig, which will bring up a Tcl/Tk-based
    menu interface. Most of the time, the make menuconfig is the best way to go given
    that most Linux routers won’t have XFree86 installed.


    Before you get to this step, be sure that you know what hardware you need to support.
    Having all the routing options you need without support for your Ethernet cards
    or WAN cards wouldn’t be very useful! One of the ways to find out what hardware
    is in your computer without cracking open the case is to cat the special files
    residing in /proc. For instance, cat /proc/pci | less will give you output containing
    the name of all of your PCI devices. Running cat /proc/dma will show you any Industry
    Standard Architecture (ISA) devices—if you’re still using those. Information about
    your SCSI devices can be found by running cat /proc/sci and so on.


    Here’s a snippet of the output from cat /proc/pci. As you can see, this machine
    has an Ethernet card using a LiteOn chip.


    ```

    PCI devices found:

    Bus 0, device 13, function 0:

    Ethernet controller: LiteOn LNE100TX (rev 32).

    Medium devsel. Fast back-to-back capable. IRQ 9. Master Capable.

    Latency=32.

    I/O at 0x8000 [0x8001].

    Non-prefetchable 32 bit memory at 0xdd00000 [0xdd00000].

    ```


    If you installed a distribution that does hardware detection for you, it will
    likely have detected all of your Ethernet cards and such. In that case, you can
    run lsmod and see which kernel modules are already loaded. Armed with that knowledge
    you should be able to figure out which Ethernet cards and other devices you should
    compile into the kernel, or as modules.


    # Keep Extra Cards Handy


    By the way, it’s probably a good practice to compile support for the most common
    Ethernet cards or to make sure that you have a stock of extra cards of the same
    make handy. Ethernet cards are known to go dead from time to time, and it’s a
    lot faster to be able to simply power down the machine and swap a working card
    into the machine than it is to recompile the kernel to support a new Ethernet
    card. If you use other specialized WAN cards or whatnot, it’s a very good idea
    to have a spare around in case of emergencies. The cost of duplicate hardware
    is nowhere near as hard on the budget as a day or two of unplanned downtime due
    to hardware failure.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# Configuring Your Kernel


    When configuring your kernel, the number of options might seem overwhelming at
    first. However, for a routing machine there is a fairly small subset of functions
    and devices that you''ll need to worry about; the rest can safely be disabled.
    For instance, you''re almost certainly not going to need support for telephony
    or Ham radio in a routing machine.


    In this section we''ll cover the options that you will want to deal with. We''re
    looking specifically at the 2.4 kernel, but most of these options do apply to
    the 2.2.x kernel series as well.


    By the way, it''s worth noting that there might be additional hardware support
    or functionality in the kernel by the time that you read this. We aren''t aware
    of any planned additions for the kernel at the time of this writing, but that''s
    not to say that it''s unlikely.


    # Code Maturity Level Options


    Several of the new networking functions in the Linux kernel are still considered
    "experimental." Selecting the Prompt for Development and/or Incomplete Code/Drivers
    option will simply give you the option of selecting these options when configuring
    the rest of the kernel. Selecting this option, in and of itself, won''t add any
    "experimental" code to your kernel, make it unstable in any way, or increase the
    size of the compiled kernel. It''s probably a good idea to say yes to this option.


    # Processor Type and Features


    This option is mostly specific to Intel-based hardware. You can choose the type
    of processor that you''re using in your router to optimize the kernel for that
    machine. Note that if you compile a kernel for a specific processor, such as the
    "PPro/6x86MX Processor Family," it might not boot on other processors. If you
    choose this option, you might wish to compile a "generic" kernel with the same
    options in case you have to swap motherboards and processors in the machine at
    a later date.


    If the routing machine is a dual-processor, you also will want to enable symmetric
    multi-processing (SMP) support in the kernel


    The Math emulation and MTRR (Memory Type Range Register) support shouldn''t be
    necessary for a routing machine. Any recent CPU (486 and up) will already have
    a math co-processor and won''t require math emulation.


    # Loadable Module Support


    As the name implies, selecting this option will allow you to compile module support
    into the kernel. Naturally, this option is one of the kernel options not available
    as a module, for obvious reasons.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Building the Linux Kernel 253


    More than likely you’ll want to enable this option. The Set Version Information
    on all module symbols will allow you to use modules compiled previously. For instance,
    if you compile kernel version 2.4.3 and then later compile 2.4.4, you will still
    be able to use the modules that worked with the previous kernel. You will definitely
    need to enable this option if you use modules compiled from non-kernel sources.


    The Kernel Module Loader allows the kernel to autoload modules if they’re available.


    If you’ll be using iptables, you will want to enable this option.


    # General Setup


    This menu item includes Networking support, which must be enabled. For the most
    part, you can accept the default selections in this section of the kernel configuration.


    # Networking Options


    There is a dizzying array of choices in this section of the kernel configuration.
    Depending on the network you’ll be working with, and the functions the router
    will handle, you might want to enable IPX, AppleTalk, or other networking protocols.
    This is the section of the kernel that contains all of the possible routing functions
    that Linux handles. The experimental protocols or functions are clearly marked,
    but you might wish to try them if you need the functionality.'
  merge: -1
  img_proc: true
- pgno: 273
  md: "After you’ve copied the kernel over, run lilo. To try out your new kernel you’ll\
    \ need to reboot the machine. Again, be sure you’ve got a backup kernel, just\
    \ in case. Congratulations, you now have a custom Linux kernel!\n\n# Special Function\
    \ Distributions\n\nIn addition to the many general-purpose distributions such\
    \ as Red Hat, Slackware, SuSE, or Debian GNU/Linux, there are hundreds of special\
    \ purpose Linux distributions.\n\nSome distributions, such as EnGarde Linux or\
    \ Immunix, focus on security, while others focus on smaller, special needs such\
    \ as Beowulf clusters or “real time” scheduling. Of particular interest when setting\
    \ up a router are the Linux routing distributions that take advantage of Linux’s\
    \ networking strengths and add simplified configuration options.\n\nIn this section\
    \ we’ve highlighted a few of the distributions that are designed especially to\
    \ power routers. This is by no means a comprehensive list; it’s simply a look\
    \ at some of the most popular routing distributions.\n\n> **Herding Cats**\n>\
    \ \n> It might be impossible to provide a complete and comprehensive listing of\
    \ all Linux distributions—or even all of the distros that focus on one particular\
    \ task.\n> \n> There are probably at least a hundred general-purpose and special-purpose\
    \ English-language distributions floating around right now, enjoying varying degrees\
    \ of popularity. It’s really difficult to guess how many available distros there\
    \ are in all languages.\n\n# Linux Router Project\n\nThe Linux Router Project\
    \ is, not surprisingly, a project to create a Linux distribution specifically\
    \ for routing.\n\nThe project has yielded a Linux distribution that fits on a\
    \ single floppy, which they refer to as a “micro-distribution.” It’s pretty amazing\
    \ how much they’ve been able to fit on one standard 1.44MB floppy disk. While\
    \ it comes in a tiny package, the LRP packs quite a punch. According to the Linux\
    \ Router Project’s web site, the LRP (Linux Router Project) distro can be used\
    \ to make anything from a simple Linux router to a Router/Switch, T1 Bridge, secondary\
    \ DNS server, and WAN router.\n\nCurrently the LRP comes with support for the\
    \ 2.0 and 2.2 kernels. There are also additional packages that can be downloaded\
    \ for the Linux Router Project distro that take it beyond a single floppy, such\
    \ as Perl, Python, BIND, and Wanpipe. In addition, a number of other custom distributions\
    \ have used the LRP as a starting point and created their own routing or networking\
    \ distro.\n\nIf you want to try a micro-distribution to build your Linux Router,\
    \ you might want to start with the Linux Router Project. The Project’s homepage\
    \ is at http://www.linuxrouter.org."
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Zips lack


    The ZipSlack distribution, as the name suggests, is based on Slackware Linux and
    fits on an Iomega Zip disk. Actually, it will fit onto any FAT or FAT32 partition
    with 100MB of space or more, but it''s most popular for systems that have bootable
    Zip drives.


    ZipSlack is primarily aimed at users who want to try Linux but don''t want to
    repartition their drives. However, for networks with modest needs, a PC with a
    Pentium or better processor, 32MB of RAM, and a Zip drive can make an excellent
    router and firewall using ZipSlack.


    The ZipSlack distribution can be found on the Slackware Linux homepage at http://www.slackware.com/.


    # Embedded Linux


    One of the most important computing markets in the near future is going to be
    the embedded market. This encompasses everything from PDAs, such as the Palm Pilot,
    to the embedded computing functions in devices such as cars, refrigerators, stereos,
    set-top boxes for TVs, and a plethora of other devices. Linux was virtually unheard
    from in the commercial embedded market in 1999 but snared a major portion of the
    embedded device market in 2000.


    Routers, of course, have traditionally been embedded appliances. Linux has opened
    the door to using traditional PC hardware as a router and is making inroads into
    the routing appliance market as well.


    It isn''t just routers, though. Linux is being developed for PDAs, networked cameras
    that have their own web servers, Network Attached Storage (NAS) devices, and much
    more. IBM has even developed a watch that runs Linux! It''s not as stylish as
    a Rolex, but it certainly does a lot more.


    # What is Embedded Linux?


    Embedded Linux is a fairly broad term used to describe quite a gamut of Linux
    solutions. Basically, so-called embedded devices are usually hardware that requires
    an operating system that is "embedded" on a ROM chip. Unlike PCs, servers, and
    workstations, these devices are not easily modified and are designed to handle
    a limited range of functionality.


    Proprietary operating systems, like those produced by Wind River or Cisco, held
    sway in these devices for a long time. However, some companies looked around for
    a more flexible and open solutions and found that Linux was just the ticket.


    # Non-Intel Hardware


    One of the reasons Linus Torvalds started developing Linux was to learn about
    the Intel 386 processor. Originally, no thought was given to the portability of
    the code or the possibility that Linux might someday run on anything other than
    the 386.'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'The majority of folks who run Linux on workstations or servers still use Linux
    on Intel-based hardware, the original platform that Linux was ported to. However,
    Linux now runs on the PowerPC, Alpha, SPARC and UltraSPARC, PA-RISC, StrongARM,
    MIPS, and a number of other processors.


    Linux now scales from handheld computers to 64-bit multiprocessor machines. As
    mentioned previously, IBM has even developed a wristwatch that runs Linux!


    # Network Processors


    One of the recent additions to the networking hardware world is the network processor.
    Basically, a network processor is like any other CPU, but it’s optimized for networking
    functions. In the past a company such as Cisco would develop its own proprietary
    processor to use in its routers. Unlike Intel’s x86 line, companies didn’t have
    a generic all-purpose processor for network devices like PC manufacturers do.


    Any company that wanted to make a router product would have a double-whammy against
    it trying to enter the market. It would have to either license or develop its
    own operating system for the router, and it would have to develop its own processor
    for the machines as well. As you might imagine, this created a rather high barrier
    of entry into the market, which is one of the reasons Cisco has done so well.


    Now companies such as Intel, Motorola, IBM, and Lucent have started manufacturing
    “generic” CPUs optimized for networking. This means that start-ups or existing
    companies that want to enter the network device market can purchase “off-the-shelf”
    processors from one of these companies without the development costs of creating
    their own.


    This has become particularly attractive now that a Free Software operating system
    with a robust networking stack is available. Companies have at their fingertips
    the opportunity to enter the lucrative network device market with a much lower
    cost of entry, and many are already introducing Linux-based network devices for
    firewalking, routing, and many other tasks.


    # Lineo SecureEdge


    Lineo, Inc. was originally a division of Caldera Systems, a company that was formed
    by ex-Novell employees to offer Linux-based solutions.


    Lineo is now a company that focuses on embedded systems, real-time OSs, and high
    availability solutions. They offer several Linux-based solutions, including the
    Embeddix and uClinux distributions.


    The SecureEdge is a customizable network product that utilizes the uClinux distribution
    and can be configured to use as a router, firewall or even a full-blown web server.
    This device is just one example of what Embedded Linux can be used for in a commercial
    setting.


    # Hard Hat Linux


    MontaVista software offers a number of products based around their Hard Hat Linux
    distribution. Hard Hat Linux is an embedded distribution that runs on a number
    of processor architectures, including Intel’s network processor.'
