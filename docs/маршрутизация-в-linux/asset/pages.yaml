- pgno: 132
  md: "As noted in Table 5.17, the egp options available in gated are covered in Table\
    \ 5.18.\n\n# Table 5.18 EGP-Specific traceoptions Statements Available in gated\n\
    \n| Option | Purpose |\n|---|---|\n| acquire | To log the ACQUIRE and CEASE packets\
    \ used to start and end EGP sessions. |\n| hello | To log the HELLO and I-HEARD-U\
    \ packets used to keep tabs on EGP neighbors. |\n| packets | To log all EGP packets.\
    \ |\n| update | To log the POLL and UPDATE packets used in EGP to request and\
    \ receive routing table updates. |\n\nThe group statement has many possibilities.\
    \ To define the EGP neighbors in an autonomous system, you start with something\
    \ as simple as the following (you might have more than one because there is more\
    \ than one way to send data in and out of your AS or you need these border routers\
    \ to allow internal networks using different protocols to talk to one another):\n\
    \n```\ngroup options {\n```\n\nThere are two options available in the group statement\
    \ itself:\n\n+   - maxup number. Sets the number of EGP neighbors gated needs\
    \ to connect to—especially useful if you don’t need this router to necessarily\
    \ connect to all of your other EGP routers.\n+   - peersas number. Tells gated\
    \ the AS number it’s a part of.\n\nInside the curly braces is where the real work\
    \ begins. Here you must set up a series of neighbor statements, each of which\
    \ specifically defines one of the other EGP routers in your AS. You must have\
    \ all of them defined here—which is handy if you’re using gated for all of your\
    \ EGP routers because you can just copy this section for the other machines and\
    \ make a couple of adjustments. So now the initial statement looks like:\n\n```\n\
    group options {\n    neighbor machine1\n        option1\n        ...\n       \
    \ optionN\n    ;\n    ...\n    neighbor machineN\n        option1\n        ...\n\
    \        optionN\n    ;\n};\n```"
  merge: -1
  img_proc: true
