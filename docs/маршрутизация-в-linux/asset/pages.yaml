    # Related Resources


    Routing is just one piece of the TCP/IP networking puzzle. There are many other
    aspects that you might or might not be fully comfortable with. Table A.4 lists
    pointers to resources for many of these networking issues and conundrums.


    Table A.4 Resources for TCP/IP Networking Issues

    | Name | Home | Description |

    |---|---|---|

    | IETF Home | http://www.ietf.org/ | The Internet Engineering Task Force''s (IETF)
    repository for all of its Working Groups and the protocols they are solidifying.
    |

    | RFC Repository | http://www.faqs.org/rfcs | A searchable Request for Comments
    (RFC) repository. |

    | Stardust | http://www.stardust.com/ | Stardust.com has a series of channels
    devoted to routing-related technologies, such as multicasting, quality of service,
    wireless, and IPv6. |

    | Types of DSL | http://www.efficient.com/tic/dslt ypes.html | Efficient Networks''
    breakdown of the various types of Digital Subscriber Lines (DSL) that exist. |

    | USAGI Project | http://www.linux-ipv6.org/ | Linux IPv6 development news and
    tools. |'
