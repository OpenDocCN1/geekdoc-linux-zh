- pgno: 287
  md: '> My pet hamster dressed up in a penguin suit and appeared to me in a dream,
    telling me to write documentation for random stuff and include lots of obscenities."
    (We haven''t found any obscenities yet, but they''ve very well written and amusing
    in spots.) You''ll find them under "Rusty’s Remarkably Unreliable Guides" (http://netfilter.samba.org/unreliable-guides/).


    # IP Masquerading


    In many cases, you’ll want to use a router to perform IP Masquerading. Typically
    IP Masquerading is used to connect a private network with “illegal” IP addresses
    to the outside world. This is particularly true when your location only has one
    public IP address through a dial-up line, DSL, cable modem, or whatever.


    All of the traffic from one or more computers routed through a machine with a
    direct interface to the Net appears to come solely through that machine. The practical
    upshot of this, of course, is that a number of computers can share one connection
    to the Internet. This is cheaper and causes less of a security risk. Assume you
    have a computer behind your router/firewall with all of your credit card numbers
    and Aunt Grizelda’s world-famous, top-secret chocolate chip cookie recipe. Before
    evil crackers can plunder your valuable information, they’ll have to fight their
    way through the firewall/router and then figure out your internal network and
    then fight their way through any security you have on internal hosts.


    Because the Linux kernel is doing some pretty complicated stuff under the hood,
    people often assume that setting up IP Masquerading is going to be a long and
    painful process. In this section we’ll show you how to set up IP Masquerading
    in a few easy steps so you can get on with important things, like going through
    the User Friendly Archives one more time.


    # Quick and Dirty IP Masquerading with ipchains


    Setting up IP Masquerading with ipchains can be done in a jiffy, provided you’ve
    already got everything enabled and compiled. (And, naturally, that you have two
    interfaces—one that interfaces with your LAN and the other that interfaces with
    your connection.)


    For IP Masquerading to work, you need to enable IP Forwarding. Again, this is
    easier than it sounds. Just type:


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    This doesn''t return any result if you type it in correctly. To be sure that you’ve
    enabled IP Forwarding, enter:


    ```

    cat /proc/sys/net/ipv4/ip_forward

    ```


    and it should return a result of "1," which in this case is kernel-speak for "true"
    or "yep, I’ll forward them packets now boss!"'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'We’re not quite done yet, though. Now we need to enable a rule to allow forwarding
    in the forward chain. By default we don’t want to allow just any packets to be
    forwarded, so we’ll set up a rule that doesn’t allow forwarding.


    ```

    ipchains -P forward DENY

    ```


    This will deny packet forwarding through your router/firewall. But we want to
    allow some forwarding, specifically through the interface that’s connected to
    the Net. The second Ethernet interface is often used for the outside connection,
    so we’ll use eth1 as the example.


    ```

    ipchains -A forward -i eth1 -j MASQ

    ```


    Do a quick ipchains -L forward to make sure everything is entered correctly, and
    you’re in business. That’s all there is to setting up simple IP Masquerading with
    ipchains. Granted, you’ll probably want to set up some firewall rules to block
    nasty cracking attempts, but we’ll let you season to taste.


    # Quick and Dirty IP Masquerading with iptables


    In the 2.4.x series, IP Masquerading isn’t much more difficult. However, IP Masquerading
    has moved from the forward chain to the nat chain. This makes sense because IP
    Masquerading is actually just simplified Network Address Translation.


    To set up IP Masquerading with iptables, you’ll also need to be sure that the
    iptables_nat module is loaded. A quick reminder—you do need to be logged in as
    root to do this. To load the module, use the modprobe command.


    ```

    modprobe iptables_nat

    ```


    Be sure to add the nat chain to the kernel tables.


    ```

    iptables -N nat

    ```


    The kernel won’t return any messages as long as the operation is successful, so
    if you want to be really sure that you’ve been successful, use lsmod to check
    and see what kernel modules are loaded.


    Just like with the 2.2.x kernel, we need to enable IP Forwarding, as follows:


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    And now we can use iptables to set the appropriate rule in the nat chain to perform
    IP Masquerading.


    ```

    iptables -t nat -A POSTROUTING -o eth1 -j MASQUERADE

    ```


    The main difference here is that the Netfilter framework handles packets differently
    than in the 2.2.x kernel. Basically, this operation will take place after all
    other (potential) operations on the packets have taken place. This makes sense,
    as it’s really difficult to work with a packet after it has been forwarded.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Network Address Translation (NAT)


    We’ve already looked at one form of NAT, IP Masquerading. That’s the simplest
    form of NAT and will take care of a lot of situations where you’re just trying
    to use one connection for a number of computers.


    Now we’ll take a quick look at doing full-blown NAT, in case you’ve got a more
    complicated setup that calls for it.


    # What’s the Difference Between NAT and IP Masquerading?


    To the casual observer, there might be some confusion between NAT and IP Masquerading.
    However, there are some distinctive differences that will help you to know which
    one you’ll want to use.


    Actually, IP Masquerading is a form of NAT. In some instances you have a group
    of computers that you want to share one public IP address. In this case, you’ll
    want to use IP Masquerading to make those computers share that precious IP address.
    This is basically a stripped-down version of NAT.


    On the other hand, let’s say you have several valid IPs, but they’re dynamic IP
    addresses. In this case, you’d use NAT on your router to allow each computer to
    use one of the public IP addresses, without actually being directly connected
    to the Internet and without having to configure dynamic IPs at the host level.
    Each machine could have its own internal network static IP while using NAT to
    have a public IP address of its own.


    In most scenarios, you’ll be able to stick with IP Masquerading. However, if you
    need the full functionality of NAT, you’ve got it at your fingertips.


    # Setting up NAT with iptables


    As mentioned earlier in the section on IP Masquerading, you’ll need to load the
    iptables_nat module.


    # A Quick Note on Module Names


    > If you’ve ever gone poking through the directories where your modules are stored
    or watched your computer as it boots, you’ve probably noticed that all modules
    end with a .o extension. For instance, the iptables_nat module filename is actually
    iptables_nat.o. However, you only need to tell modprobe or insmod to load iptables_nat.
    We only bring this up because, occasionally, folks get confused and try to load
    iptables_nat.o and get frustrated when the program says "Can’t locate module iptables_nat.o"
    when they know that they’ve got that module. It’s an easy mistake to make, and
    we see it on the newsgroups occasionally, so we thought we’d mention it.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Source NAT


    The first type of NAT we''ll look at is Source NAT, or changing the source address
    of a packet before it heads out into the world. If you''ve already gone through
    the section on IP Masquerading earlier in this chapter, then you''ve gotten a
    taste of Source NAT.


    IP Masquerading is a limited type of Source NAT that maps multiple addresses to
    one address. It''s also possible to map source addresses to public addresses on
    a one-to-one basis or to map to one of several source addresses.


    Let''s say you have a range of public IP addresses from 1.2.3.4 to 1.2.3.10 (yes,
    we know those aren''t legal) and you want to enable the router to change the source
    addresses to one of those addresses. Note that this will happen after any other
    packet mangling so that the last step in the packet''s traversal of the kernel
    is having the source address changed.


    To achieve Source NAT, you will specify a packet and then jump to the target of
    the rule—in this case Source NAT ( -j SNAT). Here''s what the command would look
    like:


    ```

    iptables -t nat -A POSTROUTING -o eth1 -j SNAT --to 1.2.3.4-1.2.3.10

    ```


    When specifying the range of addresses you want to use, simply indicate a range
    using a dash like this —to 1.2.3.4-1.2.3.10. Wasn''t that easy?


    # Destination NAT


    The flip side of all this is Destination NAT, or rewriting the destination of
    incoming packets. This is done before any other packet mangling, so that you can
    set rules based on internal hosts and incoming packets that have been DNAT''ed
    will match the right rules.


    To perform Destination NAT, you set up rules that will match incoming packets
    and rewrite them so they''ll travel wherever you''d like to send them. Here''s
    a simple example:


    ```

    iptables -t nat -A PREROUTING -i eth0 -j DNAT --to 10.0.0.4-10.0.0.14

    ```


    This will rewrite packets coming in through the first Ethernet interface to one
    of the internal machines with an IP address of 10.0.0.4 to 10.0.0.14.


    You can also set the rule to match incoming ports, so if you only wanted to perform
    DNAT on incoming HTTP requests, for instance, you could set a rule that matches
    incoming packets headed for port 80.


    ```

    iptables -P ACCEPT nat

    iptables -t nat -A PREROUTING -i eth0 -p tcp --destination-port 80 -j DNAT --to
    10.0.0.13

    ```'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'Assuming that 10.0.0.13 is your web server behind the router/firewall, all
    HTTP requests would be sent to it. This also can be useful to direct HTTP requests
    to one machine, HTTPS to another, and so forth. This allows you to spread services
    across a number of machines while the outside world interacts with them seamlessly.


    # Summary


    In this chapter we''ve looked at several tools that can be used to enhance security
    on your network and perform various types of packet filtering and mangling in
    the 2.2.x and 2.4.x series of Linux kernels.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_292_0.png)


    # 15

    Monitoring, Analyzing, and Controlling Network Traffic


    THIS CHAPTER COVERS THE MONITORING, ANALYZING, and quality of service (QoS) support
    available to the Linux network operating system. The tools covered in this chapter
    are open source and freely available to Linux network administrators. Most tools
    available for network monitoring support various node types, from Linux servers
    and routers to high-end core routers and switches.


    # Monitoring and Analysis Tools


    Linux, like most versions of Unix, is known for its well-rounded command set for
    real-time troubleshooting and monitoring. A good knowledge of the commands covered
    in Chapter 7, “Kernel Support Tools,” combined with the network analysis tools
    covered here will ensure that you administer better operating networks.

    Network monitoring and analysis tools should not only be useful to the network
    administrator, but also to network operations center technicians and management.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Simple Network Management Protocol Overview (SNMP)


    SNMP was designed to provide an open protocol and means to configure, manage,
    and monitor network nodes. SNMP is used generically to refer to one of the three
    commonly used versions: 1, 2, and 3. Versions 1 and 2 are widely supported with
    version 3 support increasing. The SNMP Internet Engineering Task Force approved
    version 3 as a draft standard in March 1999.


    # SNMP Topology


    SNMP defines a topology referred to as a network management system. The network
    management system includes the manager that interacts with the network management
    station and network nodes. The management system is used to manage and monitor
    nodes that are referred to as managed devices.


    The managed device then includes the SNMP application stack, the agent in SNMP
    terminology (which acts as the interface to the managed devices’ objects), and
    the UDP and IP layers of the protocol stack. Figure 15.1 shows the logical view
    of a network management system.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_293_0.png)


    Figure 15.1 Network management system.


    SNMP messages between the manager and agent identify the objects that are being
    managed using a management information base (MIB), with the current and most widely
    deployed MIB being version 2, known as MIB-II. It is defined in RFC 1213,'
  merge: -1
  img_proc: true
- pgno: 294
  md: '"Management Information Base for Network Management of TCP/IP-based internets:
    MIB-II." The MIB is a tree structure used to identify the data (statistics, counters,
    interface status, and so on) that is being used by the network node. Figure 15.2
    shows the MIB tree for MIB-II.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_294_0.png)


    Notice that each leaf, which is referred to as an SNMP object, is identified by
    its location in the MIB tree. Therefore, eth0 on a Linux node can be identified
    as: .iso.org.dod.internet.mgmt.mib-2.interfaces.ifTable.ifEntry.ifIndex.2


    eth0 also can be identified using the object ID equivalent of the one just listed.
    Here part of the tree is shown using the object IDs: .1.3.6.1.2.1.2.ifTable.ifEntry.ifIndex.2


    When using MIB-II, most SNMP packages enable the user to specify only within the
    MIB-II tree, so: .iso.org.dod.internet.mgmt.mib-2.interfaces.eth0 also can be
    identified as: interfaces.ifTable.ifEntry.ifIndex.2


    # SNMP Communication


    SNMP defines five message types for communicating between the manager and agent:
    get, get next, set, response, and trap.


    The GET, GET NEXT, and SET commands are all issued from the manager to the agent.
    The GET command is used to poll the specific value of a specific object within
    the agent''s MIB structure. The GET NEXT tells the agent to poll the next value
    within the MIB structure. The SET is used by the manager to tell the agent to
    set a particular object''s value to the value transmitted by the manager.


    The RESPONSE message is an agent that manages communication and is sent in response
    to the GET, GET NEXT, and SET commands.


    The TRAP message is the only SNMP messaging initiated by the agent and is used
    to send an alarm message to the manager. For example, should an interface lose
    physical connectivity, the agent typically sends a TRAP message with the appropriate
    object identification (OID) identified in the TRAP message.


    Use of these commands using Linux command-line tools is covered in the next section.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# SNMP Authentication


    Because SNMP can be used to monitor and manage network nodes, some means of security
    is required to ensure that network nodes cannot easily be compromised.


    SNMP defines two access levels of security: public and private. The public level
    is granted read-only access to the node, and the private is given full control
    of the node (read and write). Unfortunately, these levels are passed in clear
    text.


    # SNMP Security


    The SNMP Internet Engineering Task Force did seek to improve the security with
    version 2 of the protocol, but the members could not agree on the security requirements,
    which caused two spin-offs of version 2 with some of the security requirement
    left to be created: V2u and V2c. The version 3 working group is trying to fix
    this weakness with a standards track specification (see http://www.ietf.org/html.charters/snmpv3-charter.html).


    # SNMP on Linux


    SNMP for Linux was previously supported by two packages: ucd-snmp and the CMU
    SNMP project. Although both of these packages are still available on the Internet,
    SNMP development for Linux has moved to the NET-SNMP package.


    # NET-SNMP


    The NET-SNMP package available at http://net-snmp.sourceforge.net/ is the SNMP
    package known earlier as the ucd-snmp package. The current distribution, 4.2.1,
    is still referred to as the ucd-snmp package, but all future distributions will
    be named using the new name. The NET-SNMP package provides an SNMP agent for Linux,
    an SNMP library, and SNMP command-line tools for issuing SNMP commands and traps.


    In addition to supporting the standard MIB-II, the NET-SNMP agent also directly
    supports monitoring disk usage, as well as provides support to ensure processes
    are running. The agent will send a trap to the management station when disk usage
    becomes low or a particular process has stopped executing. The agent also can
    make use of scripts to add further capabilities to the trap functionality.


    The following section provides a brief overview of the installation of NET-SNMP.


    # Installation


    To install the NET-SNMP distribution, download the current version of the package
    as pointed to in the download section of http://net-snmp.sourceforge.net/. At
    the time of publication of this book, version 4.2.1 is the current version. Place
    the downloaded distribution in the appropriate place where source files are kept
    on your Linux system. For this example we use /usr/src/.


    The installation should be performed as the root user.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Unzip the tarball distribution:

    [root@lefty src]# gunzip ucd-snmp-4.2.1.tar.gz


    And untar the tarball:

    [root@lefty src]# tar xvf ucd-snmp-4.2.1.tar


    Now move into the directory created by untarring the distribution:

    [root@lefty src]# cd ucd-snmp-4.2.1


    At a minimum, read through the README and INSTALL files for any last minute changes
    to the installation procedures. The FAQ and NEWS files are also worth taking a
    look at.


    Execute the configure script, which will query your system for various settings—such
    as which C compiler to use, what libraries are present, and so on:

    [root@lefty ucd-snmp-4.2.1]# ./configure


    The configure script also will prompt for the name of the contact for the SNMP
    agent. This is the information the Linux node will return should it be queried
    via SNMP as soon as the agent is running.


    After prompting for the contact name, the configure script will prompt for the
    geographic location of the Linux node and then the log directory location, which
    can be customized (or the default of /var/log/snmpd.log can be used).


    Finally, the configure script will prompt for the configuration directory. /var/ucd
    is the default location.


    At this point the configure script will create a makefile, so that the make command
    can be run:

    [root@lefty ucd-snmp-4.2.1]# make


    To ensure permissions are set correctly, execute:

    [root@lefty ucd-snmp-4.2.1]# umask 022


    And then have make install the distribution in the appropriate locations:

    [root@lefty ucd-snmp-4.2.1]# make install


    This will install the distribution into the /usr/local/ directory structure. For
    this chapter, RedHat 6.1 was used for installation; however, the installation
    instructions apply to most current distributions. RedHat''s root account has the
    /usr/local/bin/ and /usr/local/sbin/ in its path, so if your distribution does
    not have these directories in your path, there are three workarounds:


    +   - Add /usr/local/bin/ and /usr/local/sbin/ to the root account. This might
    not be desirable depending on what other programs are located in these directories
    and how tight the security is on the box and within the directories.

    +   - Use absolute path names when executing the programs. For some advanced features
    this could require additional parameters to tell the particular SNMP program where
    to find particular programs.

    +   - Install the NET-SNMP package in its own directory and set the path accordingly.'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'Log out of the root account and log back in. (This will return root''s umask
    setting back to its original setting.) Then log back in as root.


    Should SNMPv3 support be needed, OpenSSL (http://www.openssl.org/) will need to
    be installed if it is not already present.


    The NET-SNMP agent runs as a daemon and is appropriately named snmpd. snmpd uses
    a configuration file to determine community access strings and trap settings as
    is expected of an snmp agent. In addition, the snmpd also allows advanced configuration
    settings such as limiting particular community strings to particular object identifications
    and limiting manager queries to particular IP addresses.


    Before starting snmpd, create the snmpd configuration file: /usr/local/share/snmp/snmpd.conf
    with the following entries:


    ```

    #

    # snmpd.conf

    # example

    #

    # Access Control Setup

    # rwcommunity: a SNMPv1/SNMPv2c read-write access community name

    # arguments: community [default|hostname|network/bits] [oid]


    rwcommunity fullaccess


    # rocommunity: a SNMPv1/SNMPv2c read-only access community name

    # arguments: community [default|hostname|network/bits] [oid]


    rocommunity readaccess

    ```


    This is a simple and straightforward snmpd.conf file with only the community strings
    defined. NET-SNMP uses the field name rwcommunity as the private community string,
    which is defined as fullaccess in this example.


    rocommunity is the public, read-only, community string, defined as readaccess
    in this example.


    Should snmpd be started without the community strings defined, then anyone can
    query the box via snmp, leaving the box vulnerable to attacks.


    Now snmpd can be started:

    [root@lefty /root]# snmpd


    Assuming all has gone well, the daemon should start and begin listening for requests.
    The daemon also will create an entry in the log file:

    [root@lefty /root]# cat /var/log/snmpd.log

    UCD-SNMP version 4.2.1


    To get a closer look at how the agent works, we will take a look at the snmp tools
    that come with NET-SNMP. The command-line tools are not typical managers but rather
    provide the functionality of the particular messages supported by managers: GET,
    GET NEXT, and SET.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# NET-SNMP Manager Commands


    The NET-SNMP command-line utilities are snmpget, snmpgetnext, and snmpset and
    correspond with GET, GET NEXT, and SET. These commands are very useful for network
    troubleshooting, network management system troubleshooting, and getting a better
    understanding of SNMP. Additionally, there is the snmpwalk command, which uses
    the GET NEXT message to retrieve all variables under a specific object identification.
    The examples that follow use the NET-SNMP tools with the snmpd daemon that was
    installed with the package and started earlier.


    +   snmpget agent communitystring object-id. The snmpget command will query the
    designated agent for the specific object-id using the community string specified.
    (For users of earlier versions of the command-line utilities, notice that the
    format community, string@agent, is no longer used.)


    To get the system uptime, snmpget can be used:


    ```

    [root@lefty /root]# snmpget 192.168.1.254 readaccess system.sysUpTime.0

    system.sysUpTime.0 = Timeticks: (76980) 0:12:49.80

    ```


    The snmpd agent supports most of the complete MIB-II standard, so there is all
    sorts of useful information that can be gathered for later analysis or used to
    check up on a system.


    For example, the icmp branch keeps track of icmp traffic. So to determine how
    many pings (using ICMP-echo) have been received by the host, the following command
    can be used:


    ```

    [root@lefty /root]# snmpget 192.168.1.254 readaccess icmp.icmpInEchos.0

    icmp.icmpInEchos.0 = Counter32: 43

    ```


    This shows that the system has received 43 ping packets.


    While snmpget cannot replace a well-designed network management system, it does
    add a tremendous amount of analysis power to an existing network management system,
    as well as adding flexibility to existing automation tools that monitor system
    activity.


    +   snmpgetnext agent communitystring object-id. The snmpgetnext can be used to
    get the next object in the MIB tree as such:


    ```

    [root@lefty /root]# snmpgetnext 192.168.1.254 readaccess icmp.icmpInEchos.0

    icmp.icmpInEchoReps.0 = Counter32: 3

    ```


    This returns the number of ICMP echo responses the system has received. snmpgetnext
    functionality is limited to the next entry; whereas, the snmpwalk is much more
    useful.


    +   snmpwalk agent communitystring object-id. snmpwalk will use SNMP GET NEXT
    commands until all the variables under the current object identifier are retrieved.
    This can be useful for creating tables or even finding specific object identifiers
    when you are not sure of the exact name. For example, the following


    snmpwalk reports all icmp information maintained:


    ```

    [root@lefty /root]# snmpwalk 192.168.1.254 readaccess icmp

    icmp.icmpInMsgs.0 = Counter32: 12

    icmp.icmpInErrors.0 = Counter32: 0

    icmp.icmpInDestUnreachs.0 = Counter32: 6

    ```'
  merge: -1
  img_proc: true
- pgno: 299
  md: '```

