- pgno: 222
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_222_0.png)


    # 10


    # Planning Basic Router Layout and Function


    NOW THAT WE''VE COVERED SOME of the basics, it''s time to do some planning. Specifically,
    you need to plan how your router is going to fit in with your overall networking
    scheme. If you''re starting from scratch, then it''s time to devise a networking
    scheme so that you can fit a router or routers into that plan.


    # Introduction to Network Planning


    Network planning is not a hard and fast science. There are as many theories about
    planning networks as there are network admins—maybe more if you count admins with
    multiple personalities.


    We''ll try to provide some guidelines that will help you plan your router setup
    in terms of the rest of your network, but they should be seen as just that—guidelines.
    Every situation is unique, and you have to decide what works best for you. In
    other words, your mileage might vary.


    # Things to Consider


    In this section we''ll try to cover the most important aspects of network planning
    so that you can cover all of the bases. Some of these categories overlap a bit.
    We hope that this section will give you some helpful guidelines to go by while
    planning your network or integrating a Linux router into your existing network.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Goals


    The first thing to consider when planning your network (and where your router(s)
    fit into that plan) is your overall goals for your network.


    Are you just devising a small home LAN that''s going to serve for two or three
    computers sharing a dial-up connection, DSL, or cable modem? Or is this going
    to be a WAN joining LANs in three different states and providing a VPN for your
    company''s various remote offices and road warriors dialing up from their hotel
    rooms to check email and transmit sales figures?


    As you can see, the answers to these questions will start to shape your planning
    and dictate the type of protocols you''ll need to support as well as the hardware
    that will be needed to support it. (It will also determine which chapters you''ll
    need to read thoroughly and which ones, if any, you can skim!)


    # Resources


    The next question is: What resources do you have to fall back on? This will provide
    a clear picture of what you have to work with while trying to achieve your goals
    and how aggressive you can be in terms of future-proofing your setup and providing
    redundancy.


    For instance, can you afford to deploy redundant systems? For corporate setups,
    we strongly recommend that you take the time to build a back-up system for each
    mission-critical system. This is particularly true if you have small remote offices
    without dedicated technical staff. Should you suffer a hardware failure, you can
    simply have someone swap out the dead or malfunctioning system with a backup and
    proactively reduce your downtime from hours or days to a few minutes. Almost anybody
    can be trained to swap out a standard system.


    # A Word About Reliability


    We''re not trying to convey the message that Linux is unreliable. Quite the contrary...many
    folks have Linux systems with uptime measuring in years. That''s right—years.
    However, you''ll probably be building your system with standard PC components
    that have mechanical parts, and eventually those parts will fail. Note that we
    didn''t say they might fail—they will fail. It''s only a matter of when and how
    prepared you''ll be when it does happen.


    You can protect yourself somewhat by buying decent components, but even the cream
    of the crop can suffer unexpected failure. Even a Rolls Royce can get a flat tire.


    Another question is whether you''ll be buying new systems or if you''re going
    to be digging through the company''s computer "bone yard" to scrape together parts
    for your soon-to-be router. If your needs are small, there''s quite a lot to be
    said for recycling old hardware and repurposing it with Linux. Actually, we rather
    like the fact that Linux allows you to reclaim hardware that might have otherwise
    gone to the junkyard.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'Maybe your situation allows you to purchase one new system to build your router,
    but you can build a backup system from old parts to pinch-hit in the event the
    primary system fails.


    # Budget Concerns


    In an ideal situation, you have unlimited spending authority, don’t have to justify
    your hardware purchases, and your budget rivals Bill Gates’s yearly income. Of
    course, in an ideal situation you’re independently wealthy and building Linux
    routers just for the sheer joy of it.


    More than likely you’ll have a fixed amount of money to spend on your routing
    project and a fixed amount of time as well. Don’t skimp on hardware or time spent
    up front, only to have to spend more money later on, or even worse, more time
    fixing bugs or issues that could have been solved up front.


    # Growth


    Is your network going to be growing (or shrinking!) in the foreseeable future?
    If you can reasonably expect that your network is going to undergo significant
    growth in the next six months to a year, you might want to plan your router as
    if the growth had already occurred.


    For instance, if you know your company plans to open its first remote office in
    a few months, now is the time to start planning for a WAN and budgeting for equipment
    for the remote office. Life will be much easier if you can set up and test equipment
    weeks or months in advance and just plug it in the day before employees start
    turning up at the new office.


    # Dealing with ISPs and the Phone Company


    It’s a nightmare to show up at a new office planning to get to work only to find
    out that the T1 that was supposed to be installed a week ago is going to take
    another month. Even worse is what happens when 20 employees try to share a dial-up
    connection to send and receive email and do work on a remote server.


    This does happen, particularly when admins think they can have a T1 installed
    at a location as quickly as they can get residential phone service. Order your
    connectivity at least a month ahead of time and confirm the order at least a week
    before the turn-on date. Don’t schedule installation the same day that workers
    will be arriving and expecting to get to work, either. That’s a recipe for disaster.


    If you’re reading this and shaking your head in disbelief that we feel it necessary
    to point these things out, you’re lucky. Some of us have worked with admins and
    CTOs who didn’t understand the importance of preplanning when dealing with phone
    companies—and lived to tell the tale.'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Security Planning


    Security is a major concern when planning your network and router configuration.
    You need to ask yourself how paranoid you need to be when planning and what steps
    you can take to ensure maximum security on your network.


    Note that we didn’t say, “ask yourself if you need to be paranoid,” because a
    touch of paranoia is absolutely necessary to protect your data. Even if you’re
    just planning a home network, odds are there’s data on your computer that you’d
    rather not give the world access to. Security is absolutely critical when planning
    for a corporate network where crackers might seek to steal credit card information
    or competitors might try to discover corporate secrets. (Public companies also
    can open themselves up to lawsuits if they can’t prove due diligence when it comes
    to computer security.)


    Admins for schools and universities need to be particularly vigilant—there’s no
    security risk like talented computer geeks with too much time on their hands.
    We only wish that we were being too dramatic when we suggest that security is
    a major issue.


    Remember also that security isn’t just an “us against them” proposition. Sometimes
    it’s “us against us” as well. While it would be nice to believe that none of your
    company’s employees would do anything malicious, and that might be true, you can’t
    go on that assumption. There are degrees of attacks. For instance, while maybe
    none of your fellow employees would ever do damage to your systems or attempt
    to “root” one of your servers, they might be inclined to try to browse systems
    in your payroll department to find out how much other folks in the company are
    making. Or maybe they want to read the bosses’ email to see if they’ve been mentioned,
    or vice versa.


    By setting up subnets in your office between departments, it’s possible to cut
    off unwanted traffic between departments if necessary. If you’ll be working with
    other companies inside your network, you’ll want to look into how to set up your
    Extranet and configuring a DMZ. If your budget allows, it might be a good idea
    to bring in a security consultant to help evaluate your security measures or even
    help plan and implement security for your network. Even some of the most talented
    system admins don’t have the background or depth of understanding of security
    that they need. Whatever your security needs, it’s best to plan proactively instead
    of reacting.


    # Ease of Administration


    Another consideration is the ease of administering your network. What can you
    do to make life easier for yourself and other admins or network staff? Whatever
    policies you decide on while planning your network, you’ll want to commit them
    to writing and revisit them periodically to see how effective they’ve been. (Okay,
    not so necessary for home networking. We hope that you don’t feel it necessary
    to distribute printed network policies to Robert and the kids. If you start thinking
    about giving the dog its own subnet, it’s time to put down the book, back away
    slowly, and spend some time in the “Big Blue Room.”)'
  merge: -1
  img_proc: true
- pgno: 226
  md: "For large networks, you might wish to plan so that you can delegate authority\
    \ over subnets to other admins and spread the workload out equally—or by department\
    \ or some other scheme that will keep things sane.\n\nYou’ll also want to plan\
    \ to automate as much as possible and set up notification systems to alert you\
    \ to any failure in the network. This brings us back to redundancy. Having redundant\
    \ systems reduces a situation from a “drop everything” emergency to a “fix as\
    \ time allows” situation.\n\n# Router Choice, Placement, and Functionality\n\n\
    Before you embark upon the task of actually building your Linux router, you need\
    \ to decide what functionality you need from your router or routers. Will you\
    \ be setting up just a plain vanilla router, or are you going to need a VPN or\
    \ Extranet configuration too? Should those tasks be combined or deployed on separate\
    \ machines?\n\n# Mixing and Matching Protocols\n\n> Considering you’ve invested\
    \ in this title and have read this far, we’re assuming that you have decided to\
    \ go ahead and utilize Linux for at least some of your routing needs.\n> \n> There’s\
    \ no reason why you couldn’t utilize Linux for some routing tasks and a Cisco\
    \ or other proprietary router for others. However, we can’t begin to cover all\
    \ the possibilities of using Linux routers with any/all of the other potential\
    \ router hardware and/or software. Suffice it to say that Linux works and plays\
    \ well with other operating systems and network devices. If you want to mix and\
    \ match, you could have little trouble getting Linux to cooperate.\n\n# Edge and\
    \ Access\n\nWhen we talk about an edge router, we’re not referring to the guitarist\
    \ from U2. The term, “edge router,” refers to a specific kind of router used to\
    \ route packets between one or several LANs and an Asynchronous Transfer Mode\
    \ (ATM) network or in Frame Relay. Support for ATM on Linux is not quite as mature\
    \ as some other forms of networking. You’ll want to do some research to be sure\
    \ the equipment that you want to use is supported under Linux and plan a little\
    \ extra time to work out the kinks if you’re going to be using a Linux router\
    \ as an edge router.\n\n# Security Zones (DMZ and Extranets)\n\nIn this section,\
    \ we’ll touch on some very specialized situations that will pose security and\
    \ configuration challenges while you are planning your network. Naturally, your\
    \ router will play an important role in dealing with these challenges.\n\nWe’ve\
    \ already mentioned using subnets as part of the overall security strategy. In\
    \ some cases you might wish to extend your network, or parts of it, to other companies.\
    \ Perhaps you’ve got a supplier that accesses a database so you can speed up the\
    \ supply chain, or you’re sharing your product information automatically with\
    \ resellers who simply pluck data from your database and create a dynamic catalog\
    \ of your products."
  merge: -1
  img_proc: true
- pgno: 227
  md: 'You might want to allow your developers and developers from another company
    to collaborate on a project, necessitating access to one another''s networks.


    Opening up your network to other companies creates new opportunities and allows
    business to be done faster than ever before. It also creates new and interesting
    security headaches, or at least concerns, for system administrators and networking
    professionals.


    # What is a DMZ?


    Geeks really love to give things TLAs (Three Letter Acronyms), but in the case
    of the DMZ, networking geeks simply appropriated a term already in use. DMZ is
    short for demilitarized zone, a term that came into use during the Korean War.


    In networking parlance, a DMZ is usually one host that acts as a buffer between
    the router and the internal network. It provides an extra hurdle for anyone attempting
    to break into your network because even if they''re successful in overcoming the
    security on your router/firewall, they have to get through another host before
    they actually reach your network.


    Particularly cautious admins will not only maintain a DMZ, but also set up a "honeypot"
    as well. A honeypot is a computer that''s deliberately set up to be noticed by
    intruders and usually has one or more intentional security flaws so crackers will
    be enticed by an easy target and be lured away from vital machines. Honeypots
    are also usually outfitted with intrusion detection systems, so admins will know
    when their network has attracted unwanted attention. With any luck, a honeypot
    will also allow a skilled admin to trace the attacker so that they can be identified
    and possibly prosecuted. While that''s a bit of a detour from the main topic,
    we thought it was worth mentioning.


    # Single Purpose or Multipurpose Routers


    Single purpose routers are just that—routers that handle routing and only routing.
    At one time, choosing whether to allow your router to handle other tasks was pretty
    much a moot point. Routers were hardware appliances with limited scope, and you
    bought a router that handled routing and that was that.


    With Linux, routing is just one little piece of the pie. You could conceivably
    set up one machine that handles file, print, and web serving in addition to being
    a firewall and router. If you''re a college student with a Linux computer in your
    dorm room, this might be an acceptable practice.


    On the other hand, we think it''s probably best to separate functions as much
    as possible in a production environment. It''s great that Linux is capable of
    doing so many different tasks, and we don''t hesitate to recommend using Linux
    for all of those tasks—just not all on the same machine!'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'For instance, it''s tempting to set up a router that is also a firewall, and
    many networks are configured that way. However, if budget allows, we''d recommend
    that you set up one box as a router, and another as a dedicated firewall. That''s
    not to say you shouldn''t configure a firewall on the router itself, but we recommend
    a separate hardened firewall as well.


    It''s possible, for example, to set up a DMZ on a machine by using three network
    cards and configuring everything in software. This is fine for very small networks
    or networks with minimal security needs. However, for most purposes we don''t
    recommend it. Hardware is (relatively) cheap, Linux is free, and recovering from
    a break-in is expensive. You do the math.


    # Effective Router Management Through Managed Routing Tables


    One of the challenges for many organizations is effectively managing routers,
    especially the size of routing tables.


    Due to the urgency and immediacy of many network changes to support the enterprise,
    network configuration and especially network tables become inefficient. As routing
    tables grow in size and networks are created to meet the need without a lot of
    thought for the long-term effects multiple changes will have on the efficiency
    of a network or the complexities created for network administrators.


    There are several strategies, both operational and technical, that can ensure
    routing configurations are kept orderly and routing tables do not become larger
    than necessary.


    # Operational Considerations for Router Configuration Efficiency


    Network administrators using good operational practices is the best method to
    ensure smooth network operations and to ensure routers are configured optimally.


    # Software Control and Version Dependency Requirements


    Regardless of the platform used, newer versions of software are released for routers,
    and Linux is no exception (with some releases happening weekly or daily). The
    newer versions often fix bugs and add new features; however, newer software can
    also bring new bugs and interoperability issues. Therefore, it is important that
    you not get caught up into the "upgrade it because it is available" strategy.


    New software should be tracked, and release notes should always be read with the
    following in mind:


    +   - Does it fix any problems the organization is having?

    +   - Does it identify any problems that relate to our environment but that we
    are not aware of?'
  merge: -1
  img_proc: true
- pgno: 229
  md: '+   - Does it add new features that are needed by the organization now or in
    the near future?

    +   - Does it fix any security holes?

    +   - Does it increase performance significantly?


    If you answered "yes" to any of these questions, a software upgrade should then
    be considered for your router systems.


    Should you determine that the software is worth considering for an upgrade, you
    should investigate if there are any known interoperability issues with equipment
    in your environment. Issues of interoperability with the current software also
    should be investigated because upgrades must often be performed in phases.


    # Technical Considerations for Router Efficiency


    The most common technical consideration for effective router efficiency is the
    routing table or more specifically, the routing table size. A minimized routing
    table ensures efficiency in routing decisions because a smaller routing table
    speeds routing decisions. A minimized routing table also ensures efficiency in
    administration given that a smaller routing table is easier to troubleshoot by
    network administrators.


    # Routing Tables in Static Routing Networks


    Networks that use static routes will tend to be very efficient networks during
    the early stages of the network but will tend to become inefficient as changes
    are made to solve the specific network requirement without consideration of the
    complete network. The following tips, when applied to the complete network, will
    ensure networking tables maintain the minimum size necessary to support the network.


    # Effective Use of Default Route


    Probably the most underused feature among experienced and inexperienced network
    administrators is the use of the default route. While it is well understood that
    the default route is the route of last resort, many administrators are in the
    habit of creating routes on all routers when a new network is brought into service.
    This is typically unnecessary in most static route-based networks due to their
    simplicity and tendency to route towards the core of the network or a central
    router, which is in the patch for the new network.


    Consider the network in Figure 10.1. When network 10.1.40.0/24 is brought online,
    many network administrators will tend to create routing entries for 10.1.40.0/24
    at sites B, C, and D. However, because sites B, C, and D must use site A for transport
    to 10.1.40.0/24 and there is a pre-existing default route, adding a routing entry
    for 10.1.40.0/24 is an unnecessary routing entry.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_230_0.png)


    # Figure 10.1 Effective use of default route.


    In fact, at sites B, C, and D, the routing tables of the gateways to the central
    site, A, only need routing entries for local networks and a default route pointing
    back to the central site.


    # Effective Use of Supernetting and Variable Length Subnetting


    In networks where remote sites also have gateways to the Internet, such as those
    shown in Figure 10.2, the default gateway cannot be used whenever the new network,
    10.128.1.0/24, is brought into service. However, because the network administrators
    have chosen to use the RFC 1918 address range 10.0.0.0/8 for the complete network,
    the routing entry for the supernet 10.0.0.0/8 at the gateway for site B includes
    the new network 10.128.1.0/24.


    In addition, the routing entry at site A for the network 10.128.0.0/24 can be
    changed to a supernet to include the new network 10.128.1.0/24. The new supernet
    routing entry would be 10.128.0.0/23, which saves a routing entry at site A for
    site B.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_231_0.png)


    # Figure 10.2 Effective use of supernetting.


    The use of variable length subnetting also can, however, prove troublesome when
    not used effectively.


    # Avoiding Ineffective Usage of Variable Length Subnetting


    Variable length subnetting can be used to manage IP address space in a fashion
    such that a minimum of IP addresses are used for each network; however, with multiple
    networks masks used in a network, this often adds unnecessary complexity to the
    network.


    In a static route network, generally not more than one or two netmasks should
    be necessary: a netmask, often 255.255.255.0 for the local area networks, and
    255.255.255.252 for transit networks, which are usually point-to-point links.
    However, even a separate netmask for the transit networks is not necessary given
    that the 10.0.0.0/8 offers more than enough address space for most networks—especially
    any networks using static routing.


    # Universal Use of Transit Networks


    Whichever netmask is used for transit networks, the netmask should be used universally.
    In addition, most routers support the concept of unnumbered interfaces for point-to-point
    links. This means that the link between the two sites does not receive an IP address
    for the link. Should unnumbered interfaces be used, they should also be used universally
    if possible.


    # Routing Tables in Dynamic Routing Networks


    As in static route networks, avoid the ineffective use of variable length subnetting.
    Supporting numerous subnet masks adds even more complexity to dynamic environments
    given that these networks already tend to be larger than their static route counterparts.
    Transit networks also should use the same guidelines just covered for static route
    networks.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Route Summarization


    Route summarization performs a similar function to that which static route supernetting
    provides—it combines multiple subnet routes into one entry. Route summarization
    is a step more versatile because the routing protocol is still aware of specific
    network outages through routing advertisements.


    Figure 10.3 shows that router A has used route summarization for 10.0.0.0/8 through
    interface A1. (Assuming equal weights, the network can be summarized through A2
    as well, but it would not be used until a failure occurs because it is an additional
    hop.) Router B can also summarize the route.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_232_0.png)


    Figure 10.3 Network management system.


    # Avoiding Multiple Protocol Support


    Supporting multiple dynamic routing protocols on the same network should be avoided.
    Multiple protocol support is usually the result of corporate acquisitions or failed
    upgrades from an older metric-based protocol to a link state protocol such as
    open shortest path first (OSPF).


    Supporting multiple protocols requires not only an understanding of the protocols
    involved, but also how they interoperate on routers that support both protocols,
    which will typically be vendor specific. It must be understood which protocol
    takes priority on the routers that support both protocols, which entries are further
    propagated by the "other" protocol, and how to troubleshoot the interaction of
    the two protocols.


    # Special Case Routing Functions


    As covered in Chapter 7, "Kernel Support Tools", adding additional functions to
    Internet gateways can add additional value to a Linux router and, indeed, often
    gives Linux an edge over traditional routers as Internet access gateways.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# IP Version 6 Support


    There are additional considerations, or special cases, that do arise when planning
    and deploying networks that you should be aware of:


    Chapter 4, “IPv 4 and IPv 6 Addressing,” covers the innards of addressing networks.
    Organizations that choose to support IPv6 will need phase-in methodologies to
    support both versions of the Internet protocol.


    RFC 1933, “Transition Mechanisms for IPv6 Hosts and Routers,” defines two methods
    for transitioning to IPv6: dual IP layer and IPv6 over IPv4 tunneling.


    Dual IP layer is very similar to dual stacks to support multiple protocols. For
    example, many workstations and PCs supported both IP and Novell’s IPX during Novell’s
    popularity in the 1990s.


    Dual stacks is a host-based solution, that is, the host can communicate with both
    IP version 6 and version 4 nodes, which provides a very broad base of interoperability
    capability.


    Many organizations wish to deploy specific IPv6 networks as opposed to a dual
    stack approach. Therefore, RFC 1933 also defined tunneling of IPv6 over IPv4 networks.
    Tunneling of IP version 6 over version 4 is similar to other tunneling technology.
    An example of the tunneling is shown in Figure 10.4.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_233_0.png)


    Figure 10.4  IP version 6 over IP version 4.


    Node A and B both have IP version 6 and IP version 4 interfaces. For traffic flowing
    from A to B, A encapsulates the IPv6 packet received on interface A1 into a version
    4 packet and routes it out interface A2. Router B then accepts the IPv4 packet
    on interface B1, strips the IPv4 header from the packet, and routes it out interface
    B2 as an IP version 6 packet.


    # Multihoming


    Multihoming, for most system administrators, describes connecting a host or network
    to multiple networks. A router, by definition, is multihomed. In this chapter,
    multihoming refers to actually connecting to the Internet via at least 2 upstream
    providers.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# Administrative Considerations


    Internet service providers’ policies on multihoming vary greatly—from very little
    concern on how you implement multihoming (these ISPs will tend to use filtering
    very strongly on the edge of the network to ensure your network is not affecting
    the core network) to a very detailed list of dos and don’ts. This chapter covers
    the technical aspects of multihoming, but do consult with the ISPs of choice on
    their policies and recommendations.


    # Simple Multihoming


    The simplest form of multihoming is shown in Figure 10.5.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_234_0.png)


    Figure 10.5 Simple multihoming.


    In Figure 10.5, the enterprise is connected to ISP A and ISP B via T1 connections.
    On the router, penguin, two default routes with equal weights are pointed to each
    ISP A and B creating a load balance between the two ISPs. The major advantage
    to this solution is simplicity and a total bandwidth for Internet connectivity
    of 3Mbps. The major disadvantage of this solution is that 50% of traffic destined
    to ISP A for outsourced services such as W.W.W, DNS, or even email, will travel
    through ISP B. Static routes for the ISP’s networks can be entered to create a
    hybrid Simple Multihoming network; however, the ISPs also have many customers
    where traffic should go through a particular link (assuming the link is in service).
    Therefore, a more efficient method is often needed.


    # BGP Multihoming


    By using BGP with both providers, the edge router(s) can determine the best path
    to both ISP providers’ customers. This can be implemented in several ways. Should
    the provider only advertise customer networks with customers, then a direct BGP
    implementation is straightforward. Should the provider advertise all routes, a
    filtering mechanism is required at the edge of the provider’s network or on the
    customer premise.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'Filtering is preferred over simply adding entries for the providers’ networks
    given that adding entries does not take failures into consideration. Consider
    the network shown in Figure 10.6. With the static entry, the connection will fail
    because all the traffic is going out link A1. However, if router A knew about
    the failure through a routing update, then the router will use link A2, and the
    traffic will arrive through ISP B.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_235_0.png)


    Figure 10.6 Link failure bypass.


    # Challenges of Multihoming


    Due to the wide spread acceptance of CIDR by ISPs, ISPs are resistant to advertising
    networks not within their CIDR domain. Multihoming, by nature, creates the situation
    where an ISP needs to advertise another provider’s CIDR portion within its network.
    Even if the ISP is willing to advertise the route for the other provider’s address
    space within its domain, routers outside the domain will not know that both ISPs
    have a path to the network.


    Due to the large number of Internet attacks that make use of spoofed addresses,
    ISPs also will filter out packets that have source addresses not belonging to
    their CIDR. This, then, also be considered when designing the access network for
    multihoming.


    NAT could be used to ensure all packets through a particular ISP use the address
    space assigned by that ISP as the source address. This will add complexity to
    the network; however, most networks use NAT already, so it is a question of the
    specific network requirements and implementation on how much additional complexity
    is added.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Summary


    This chapter covered some of the basic considerations for planning your routing
    setup from connectivity to security. While this is not a concrete blueprint for
    router planning, it gives a good overview of the necessary considerations for
    router planning.


    This chapter also covered practices for ensuring effective routing table sizes,
    special case routing functions such as IPv6 support, and connecting to two or
    more ISPs through multihoming.'
  merge: -1
  img_proc: true
