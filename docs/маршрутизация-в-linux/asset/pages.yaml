    would not understand. While Classful IP v4 requires the netmask, Classless IP
    v4 needs the bit mask. The technique the routers use from that point is called
    longest match. The router looks at the address the information is trying to get
    to—let’s say 192.168.250.52—and looks for the entry in its routing table that
    is closest to this number. The best it’s going to find in a main routing table
    in this case is 192.168—remember that our parent network (the supernet) is 192.168.240.0/20.


