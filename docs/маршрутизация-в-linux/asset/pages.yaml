- pgno: 137
  md: "After the interface term, include the IP information for specific internal\
    \ interfaces that you want to have treated as though they are external.\n\nAt\
    \ this point you need to start the group type substatement, which you do by adding\
    \ a curly brace, so you might now have:\n\n```\ngroup type external peers as\n\
    {\n```\n\nThere are actually only two clauses that go within the group type substatement:\
    \ allow and peer. You must include both of these items to properly set up the\
    \ bgp group type. The allow clause gets inserted into the substatement as follows:\n\
    \n```\ngroup type blahblahblah\n{\n    allow\n    {\n```\n\nEvery option in the\
    \ allow clause involves identifying hosts and networks belonging to this particular\
    \ group type. We’ve covered the various ways of specifying machines for gated\
    \ a number of times now so we’re just going to fill out the allow clause with\
    \ one of each of the possible formats, giving us:\n\n```\ngroup type blahblahblah\n\
    {\n    allow\n    {\n        '192.168.15.0\n        192.168.15.0 mask 255.255.255.0\n\
    \        192.168.15.0 masklen 24\n        all\n        host 192.168.15.5\n   \
    \ };\n```\n\nThe next clause in the group type substatement is peer, which gets\
    \ added like so:\n\n```\ngroup type blahblahblah\n{\n    allow\n    {\n      \
    \  192.168.15.0\n        192.168.15.0 mask 255.255.255.0\n        192.168.15.0\
    \ masklen 24\n        all\n        host 192.168.15.5\n    };\n    peer hostIP\n\
    \        option1\n        ...\n        optionN;\n```\n\nThe extensive list of\
    \ options available within the peer clause are listed in Table 5.22. You’ll recognize\
    \ a number of these from other sections of gated.conf."
