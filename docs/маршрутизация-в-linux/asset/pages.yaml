- pgno: 352
  md: '# Colophon


    The image on the cover of this book is of Snake River, the largest tributary of
    the Columbia River and one of the most important streams in the Pacific Northwest
    section of the United States. Snake River rises in the mountains of the Continental
    Divide near the southeastern corner of Yellowstone National Park in Wyoming and
    flows south through Jackson Lake along the eastern base of the Teton Range in
    Grand Teton National Park. Swinging northwest near the mouth of Greys River, it
    enters Idaho through the Palisades Reservoir. Near Heise the river leaves the
    mountains and crosses the broad Snake River Plain of southern Idaho, an area covered
    by lava beds. On the western edge of the state, it is joined by the Boise River.
    Turning north, it forms the Oregon–Idaho boundary for 216 miles (348 km). From
    the northeastern corner of Oregon it forms the Washington–Idaho boundary to Lewiston,
    Idaho, and then turns west to join the Columbia just south of Pasco, Washington,
    after a course of 1,040 miles (1,670 km). Runoff from the states of Wyoming, Utah,
    Nevada, Idaho, Oregon, and Washington combines in the Snake, which has a drainage
    basin of 109,000 square miles (282,000 square km). From elevations of 10,000 feet
    (3,000 m), the river descends to 300 feet (90 m). Information taken from www.britannica.com.


    This book was written and edited in both Microsoft Word and XML/DocBook. The XML
    from DocBook was exported to Rich Text Format using the Jade style sheet and then
    imported into Word. It was laid out in QuarkXpress. The fonts used in the body
    text are Bembo and MCPDigital. It was printed on 50# Husky Offset smooth paper
    VonHoffmann Graphics in Owensville, MO. Prepress consisted of PostScript computer-to-plate
    technology (film­less process). The cover was printed at Moore Langen Printing
    in Terre Haute, Indiana, on 12pt, coated on one side.'
  merge: -1
  img_proc: true
