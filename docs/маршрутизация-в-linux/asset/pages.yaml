    # What About Hosts That Don''t Understand CIDR?


    Not all machines can handle CIDR out of the box. This includes Linux. We''ll get
    into the route command in depth in Chapter 6, "Inside The Commands," but you might
    already be familiar with the data route requires. This command wants to know the
    network address, gateway address, IP address, and netmask. It has no place for
    a bit mask. Therefore, it assumes a class for every IP address. This just won''t
    do if you''re using Classless IP v4. In fact, take a look at the other commands
    as well—and the kernel. You''ll run into the same problem throughout.


    The first Linux kernel series to have built-in Classless IP v4 support is 2.2.x.
    However, the Classless IP v4 module in this case is still labeled experimental.
    If you must have this host able to understand Classless IP v4, recompile the kernel
    with the Classless IP v4 modules attached and then go to http://www.tazenda.demon.co.uk/phil/net-tools/
    to download the latest version of the net-tools package. This Tarball contains
    all of the basic utilities you''ll need for networking with Linux, and versions
    1.52 and later add support for Classless IP v4. Be sure to read all README files
    before installing these programs.


    # IPv6 Addressing


    We are in the midst of a large-scale change on the Internet. For many years now,
    many of us have worked to come to grips with the subtleties of IP addressing,
    subnetting, and more. Meanwhile, IP address space has approached exhaustion much
    sooner than anyone anticipated. When software and operating systems get outdated,
    what do we do? We upgrade them. The same goes for protocols that begin to show
    the signs of age and not being able to serve what is needed for the times. Classless
    IPv4 has helped, but it''s not enough. IP has now been upgraded to version 6—also
    called IP next generation (IPng)—and the great migration has begun.


    # Introduction to IPv6 Addressing


    IP v6 is not built upon the building blocks of IP v4. Instead, it''s an entirely
    new mechanism for IP network addressing. Addresses are now 128 bits long rather
    than 32. This gives us a lot more room for individual hosts. There is also no
    broadcast address anymore in IP v6. Instead, you have a choice between unicast,
    multicast, or anycast. This last option allows for having more than one interface
    assigned the same IP address and sends the data meant for that address to the
    closest of these interfaces. The ability to assign more than one address to an
    interface also is built into IP v6.'
