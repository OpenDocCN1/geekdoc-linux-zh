    # How It Works


    Now that you understand how the algorithm works, let’s apply OSPF with the same
    examples used earlier. This protocol is far more complex than RIP-2, so expect
    this to be a fun ride. Once again, we want to send data from Emerald to Abacus.
    Emerald knows the following:


    +   - What interfaces lead to what routers in its area. An area in OSPF is an
    independent unit. The example network is a single area in this case. Router three,
    as it turns out, is the area’s designated router.

    +   - A designated router is in charge of talking to the outside world. Within
    an area, every machine knows how to send data to every address in that area. However,
    once you get outside of the current area, the routers there see only the designated
    router and none of the others. As a result, when traffic goes to one of the networks
    within the area, any router outside sends to the designated router, which then
    uses its own routing tables to send the traffic to its destination.

    +   - If you have an area at all, then you have at least two. Otherwise, there
    is no need to create one The sum total of your areas adds up to a full autonomous
    system (AS). Figure 1.22 shows conceptually how these components all come together.
    Notice that router Phys has a boundary (and interface) in both of the areas. Remember
    that the routers have to be able to talk across boundaries! There also will be
    a router that talks to the outside world from the AS.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_46_0.png)


    Figure 1.22 The example network in its own area, sharing an autonomous system
    with other areas.


    # Routing Table Size


    The size of routing tables is a very important issue, regardless of what protocol
    you are using. The Internet initially did not have to be concerned with how large
    the tables were because back in the late 1960s and early 1970s (the days of ARPANET),
    there were very few machines connected. Today, of course, is a different story.


    One reason that older routing protocols, such as RIP-1 and RIP-2, are not sufficient
    for large-scale use is that each router must contain individual instructions for
    every single network and subnetwork in existence. The larger the tables get, the
    longer it takes to look up where data needs to go. Transit times slow until the
    network is virtually useless.


    Entering the newer routing protocols and segmentation tools such as areas, ASs,
    and more allow administrators to greatly shrink their routing tables for various
    network parts. More knowledgeable and powerful routers can then handle passing
    the information between the smaller sections so that it eventually gets where
    it needs to go.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '+   - The cost of sending data through each interface. OSPF does not see these
    costs as any kind of distance measure. They are used simply as a method of weighting
    which interfaces are going to produce the fastest traffic and which will slow
