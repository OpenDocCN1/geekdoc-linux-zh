    # Summary


    In this chapter, the Linux commands for displaying and configuring Linux nodes
    have been covered. The common uses of ifconfig, route, ping, traceroute, arp,
    netstat, and tcpdump have been covered. ifconfig is used to configure and show
    configuration options for network interface cards. route is used to add and display
    routing entries on the Linux node.


    ping and traceroute are troubleshooting tools used to determine and localize network
    connectivity issues. And finally, tcpdump is a general-purpose, freely available
    protocol analyzer available for Linux, definitely recommended for Linux network
    nodes.'
