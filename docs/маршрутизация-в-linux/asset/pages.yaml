- pgno: 141
  md: '# The IS-IS Protocol


    There is one protocol gated supports that is not being covering in any detail,
    but you should be aware of in case you require it. It''s the Intermediate System-Intermediate-System
    (IS-IS) protocol. This routing protocol is for internal use in cases where there
    is a large variety of subnets running on many kinds of networking hardware and
    software.


    IS-IS is a connectionless protocol, meaning that it does not maintain open connections
    with the machines it exchanges information with—making it more like UDP than TCP;
    to give you a reference point. If you think you might require the use of this
    protocol, you can learn more about it starting with RFC 1142 or preferably the
    ISO DP 10589 parent document.


    # Configuring SNMP Interaction


    Let''s switch gears away from routing protocols and look at the Simple Network
    Management Protocol (SNMP). Administrators use this tool to aid in managing large
    computer networks. The gated daemon does not actually run the SNMP protocol, but
    it does allow your Linux (or other) routers to interface with SNMP if you are
    using it as part of your network management solution. See RFC 1157 for more about
    SNMP itself.


    The configuration statement for SNMP interactions is actually quite short. It
    starts, predictably, with:


    ```

    snmp on {

    ```


    Within the parentheses, there are only three options available:


    +   - debug;: If you are having troubles with the SNMP daemon on your Linux box,
    add this line to activate the debugging features.


    +   - port value;: If you are running SNMP but have set it to use a port that
    is not the default port 167, use this statement to tell gated.


    +   - traceoptions options. As usual, you use this statement to configure logging.
    You have access to all of the items available in Table 5.11, as well as those
    listed in Table 5.23.


    # Table 5.23 Options Available for the traceoptions Portion of gated''s SNMP Setup


    | Option | Purpose |

    | --- | --- |

    | receive | To log SNMP requests that come from the Linux SNMP daemon, as well
    as the responses sent to them. |

    | register | To log SNMP requests to create new variables. |

    | resolve | To log SNMP requests for the contents of a variable. |

    | trap | To log SNMP trap messages. |'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Configuring Static Routing


    While most Linux users know how to use the standard routing commands for their
    static routing on their individual machines, it''s a good idea to make sure and
    give the static information to gated as well. Doing this allows your network to
    be more efficient by sparing individual hosts from having to do as many lookups.


    You start a static routing statement (there can be more than one in a gated.conf
    file) with:

    ```

    static {

    ```


    Notice that there is no on or off. Static routing by its very nature is always
    available. There isn''t a long list of options available within the static statement.
    Instead, there are a lot of variations of format you can use and a few options
    along with that. The substatement types available to you start with one of the
    following mostly familiar sequences:


    +   - default gateway gateIP. Informs gated that one specific interface, whose
    IP address fills gateIP, is the default for sending data.

    +   - host hostIP gateway gateIP. Informs gated that traffic for the host whose
    IP address fills hostIP should pass through the interface specified by gateIP.

    +   - netIP mask netmask gateway gateIP. Informs gated that traffic for the network
    specified in netIP, which is narrowed down by the netmask contained in the netmask
    portion, should pass through the interface specified by gateIP.

    +   - netIP masklen len gateway gateIP. Informs gated that traffic for the network
    specified in netIP, which is narrowed down by the mask length contained in the
    len portion, should pass through the interface specified by gateIP.

    +   - netIP mask netmask interface interface. Informs gated that traffic for the
    network specified in netIP, which is narrowed down by the netmask contained in
    the netmask portion, goes to the interface specified by interface.

    +   - netIP masklen len interface interface. Informs gated that traffic for the
    network specified in netIP, which is narrowed down by the mask length contained
    in the len portion, goes to the interface specified by interface.

    +   - netIP interface interface. Informs gated that traffic for the network specified
    in netIP goes to the interface specified by interface.

    +   - interface interface. Sets the default interface that gated should use for
    routing traffic.


    The gateway statements are specifically for when you want to send data through
    a particular interface to get to particular destinations. On the other hand, if
    you have hosts or routers that are sharing a single interface but pretending they
    have different IP addresses, you need to use the interface statement.'
  merge: -1
  img_proc: true
