    | Decimal Prefix | Hexadecimal Prefix | Reserved Purpose |

    | 11111110 10 | FE8+ | For local use by linking items such as routers. |

    | 11111110 11 | FEC+ | For local use within a site. |

    | 11111111 | FF | For multicast addressing. |


    # Introduction to Hexadecimal Math


    Notice that they have been given both binary and hexadecimal (hex) values in Table
    4.9. Let''s see how to get between these two bases because you''ll require a solid
    foundation in this to work with IP v6. The things to remember when dealing with
    hex are


    +   - Hexadecimal math is base 16, as compared to binary''s base 2 and decimal''s
    base 10.

    +   - The digits you have available in hex are 0-9 and then A-F as compared to
    binary''s choices of only 0 or 1, and decimal''s 0 through 9.

    +   - In our case, it''s easiest to think of a hexadecimal value as four bits,
    or half a byte.

    +   - Hexadecimal values aren''t typically discussed in singles, so we''ll be
    talking about pairs of hex values, which means a full byte.


    So let''s see how we got at the numbers in Table 4.9. The first one is easy: 00000000
    is decimal 0, and is hex 0000. For the second, we start with 00000010 binary.
    To convert this to decimal, we use the formula discussed in the section, "IP v4
    Math Review": 0x127 + 0x64 + 0x32 + 0x16 + 0x8 + 0x4 + 1x2 + 0x1 = 2


    But let''s convert straight from binary to hexadecimal. We have two hex digits
    in this single byte, so we''re really looking at 0000 and 0010. The first, 0000
    binary, just becomes 0 hex. For the second we have to do just a wee bit of math.
    In this case, we''ll use: 0x8 + 0x4 + 1x2 + 0x0 = 2 So, we get 02 in the end for
    this pair. For the rest we have:


    00000100 = 0000 0100 = 0 | 0x8 + 1x4 + 0x2 + 0x1 = 04


    00100000 = 0010 0000 = 0x8 + 1x4 + 0x2 + 0x1 | 0 = 40


    11111110 10 = 1111 1110 10 = 1x8 + 1x4 + 1x2 + 1x1 | 1x8 + 1x4 + 1x2 + 0x1 | 1x8
    + 0x4 + ?2x + ?x1 = (15 decimal)(14 decimal)8 = FE8+'
