- pgno: 115
  md: '# Chapter 5 Inside The Unicast Kernel 2.2.x Daemons


    A gated options statement is written in the following format:


    ```

    options

    setting1

    ...

    settingN

    ;

    ```


    # The interfaces Statement


    After you set (or don''t set) your global options, it''s time to tell gated about
    the network interfaces available on this machine. Doing this involves a set of
    nested statements for all of the rest of the interface configuration in the following
    manner:


    ```

    interfaces {

    statement1

    settings

    ...

    statementN

    settings

    }

    ```


    There are three kinds of statements you have available to you within the interfaces
    statement: options, interface, and define. While there are no strict requirements
    on the order in which you utilize these three statements, it''s a good idea to
    stick with what we''ve listed here. The first is, once again, options. This is
    not the same as the global options but instead is a set of options local to all
    of the interfaces—which it seems would make them global interface options. You
    have two choices here, as shown in Table 5.5.


    # Table 5.5 Values Available in the gated.conf options Portion of the interfaces
    Statement


    | Option | Purpose | Format | Value(s) |

    |--------|---------|--------|----------|

    | scaninterval | Sets how often gated checks the kernel''s files for new or removed
    interfaces. Default is every 15 seconds. | scaninterval time | The number of seconds
    to wait between checks. |'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Table 5.5 Continued


    | Option | Purpose | Format | Value(s) |

    |---|---|---|---|

    | strictinterfaces | Sets how gated behaves if it finds an interface that was
    added after boot time but isn''t specifically defined in its configuration file.
    Default is to give an error but continue running. If you include this option,
    gated will crash in this circumstance. | strictinterfaces | N/A |


    Next among the interfaces statements is one or more interface statements. Yes,
    this could get confusing. Make sure to double-check that you don''t get these
    two items turned around. You can configure multiple interfaces together in the
    same statement if you want or break them up if you need some to have different
    settings than others. The interface statement itself is in the format interface
    list, where list is a series of IP addresses belonging to each interface you want
    to configure with this specific collection of settings. The items you can configure
    within the interface statement are listed in Table 5.6.


    # Table 5.6 Values Available in the gated.conf interface Portion of the interfaces
    Statement


    | Option | Purpose | Format | Value(s) |

    |---|---|---|---|

    | down preference | Sets the preference value—how favored or unfavored this interface
    is—in the case where gated has marked the interface as potentially malfunctioning.
    | down preference value | The higher the integer value, the less likely gated
    will choose this interface. Default is 120. |

    | passive | Prevents gated from changing this interface to the down preference
    value. | passive | N/A |'
