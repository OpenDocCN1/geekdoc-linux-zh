- pgno: 215
  md: '# -t


    The -t parameter instructs tcpdump to not print the timestamp on its output.


    # -x


    The -x parameter will cause tcpdump to print the packets out in hexadecimal.


    # -w Filename


    When a tcpdump output needs to be saved, the -w can be used to save the file in
    libpcap format, which saves space, as well as put the file in a format that can
    be read by many other network analyzers. The files created by tcpdump can grow
    quickly, so disk space should be monitored closely when saving the file.


    # -r Filename


    Files created with the -w option can be read by tcpdump, and further analysis
    can be performed on the packet. If the original tcpdump was a tcpdump -w with
    no filters, then the tcpdump -r can use filters to refine the output to exactly
    what is needed:


    ```

    tcpdump -r savedfile -n host 192.168.1.101

    11:39:52.498409 eth0 > 192.168.1.101.1041 > 192.168.1.254.telnet: . 3768803:3768803(0)
    ack 2572567146 win 7781 (DF)

    11:39:52.498518 eth0 > 192.168.1.254.telnet > 192.168.1.101.1041: P 1:89(88) ack
    0 win 32120 (DF)

    11:39:52.698395 eth0 > 192.168.1.101.1041 > 192.168.1.254.telnet: . 0:0(0) ack
    89 win 7689 (DF)

    ```


    # -v


    The -v (for verbose) tells tcpdump to print the time-to-live information as well
    as the type of service. Notice the difference between the output that follows
    with the -v parameter and the same command without the -v in the -r example given;


    ```

    [root@lefty /root]# tcpdump -r savedfile -n -v host 192.168.1.101

    11:39:52.498409 eth0 > 192.168.1.101.1041 > 192.168.1.254.telnet: . 3768803:3768803(0)
    ack 2572567146 win 7781 (DF) (ttl 128, id 37383)

    11:39:52.498518 eth0 > 192.168.1.254.telnet > 192.168.1.101.1041: P 1:89(88) ack
    0 win 32120 (DF) (ttl 64, id 21483)

    11:39:52.698395 eth0 > 192.168.1.101.1041 > 192.168.1.254.telnet: . 0:0(0) ack
    89 win 7689 (DF) (ttl 128, id 37639)

    ```


    # tcpdump Expressions


    tcpdump uses the concept of expressions to define which packets to display. The
    expression follows any command-line parameters that are passed to tcpdump. An
    expression is made up of a qualifier followed by an ID.'
