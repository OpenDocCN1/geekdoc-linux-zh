- pgno: 15
  md: '# Introduction


    In the Linux world, when we talk about routing we''re usually just referring to
    utilizing the route command to set up some nice, simple data delivery information.
    A Linux box is capable of so much more. With the proper setup and tuning, you
    can build a stable and efficient router for your network and its subnets. Linux
    Routing gives you the background and techniques you need to choose the appropriate
    routing protocol(s), configure the routing daemon(s), add security and obfuscation
    to protect your data and machines, fine tune the kernel for this very task-specific
    setup, and even monitor your traffic and adjust it to make it more efficient.


    # What’s Inside?


    Because so many Linux administrators haven''t had to tackle the ins and outs of
    routing protocols, multicasting, IPv4''s classless addressing possibilities, and
    more, this book begins with a thorough discussion of much background information
    that you must understand before you can easily proceed with the rest. To this
    end, we''ve broken this book into Parts for simpler navigation:


    +   - Part I, "Routing Basics," contains Chapters 1 through 4.

    +   - Part II, "Linux Routing Issues and Technologies," contains Chapters 5 through
    15.

    +   - Part III, "Appendixes," contains Appendix A and B.


    From there, it''s the individual chapters that are of interest, so let''s take
    a look.


    # Chapter 1, "Unicast Protocols"


    As the saying goes, it''s usually best to begin at the beginning. The unicast
    routing protocols contain some of the oldest Internet protocols that are still
    in use. This chapter introduces an example network used throughout Part I to give
    you a consistent framework to compare and contrast how these protocols work—and
    how they work is covered in detail. Specifically, it covers static routing and
    the protocols: RIP version 1 (RIP-1), RIP version 2 (RIP-2), and OSPF version
    2.


    # Chapter 2, "Multicast Protocols"


    Not everyone is content to stick with unicast. This chapter covers the most popular
    multicast routing protocols. Once again, we use the example network to discuss
    how each of these works so that you have a solid framework from which to decide
    which of these you want to implement. Specifically, this chapter covers the multicasting
    features of RIP-2, plus the following multicast protocols: DVMRP, MOSPF, PIM-DM,
    and PIM-SM.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Chapter 3, “Introduction to Border Routing Protocols”


    While the previous two chapters focus on what you’re doing in your own little
    part of the world, there has to be a way as well for your networks to talk to
    others. Without such a method there would be no Internet. This chapter focuses
    on both unicast and multicast protocols where implementations are available for
    Linux use. These protocols are: EGP, BGP, BGMP, and MSDP.


    # Chapter 4, “IPv4 and IPv6 Addressing”


    Many Linux aficionados know the standard ins and outs of IPv4 addressing. This
    chapter begins with a thorough look at IPv4 subnetting for those who have never
    had to learn the math behind it and have just used certain set solutions in the
    past. Then, we move into new territory. The next item is IPv4 Classless InterDomain
    Routing (CIDR), which allows you to break up your addressing space without sticking
    to class A, B, and C boundaries.


    Finally, it’s time to get familiar with IPv6 before the transition takes you by
    surprise. We take a look at the basics of working with this addressing system
    so you’ll know how to recognize types of addresses, break IPv6 addresses down
    into their hexadecimal components, and more.


    # Chapter 5, “Inside the Unicast Kernel 2.2.x Daemons”


    There are a fair number of daemons available for routing in Linux. If we were
    to have covered them all in depth, then that would have filled the entire book.
    So in this chapter, we take a look in great detail at good old routed and the
    public version of gated. Here you’ll learn not only about these daemons, but everything
    there is to know about configuring them. When it comes to gated, this means you’ll
    learn how to set it up for all of the unicast protocols that you’ve learned about
    so far. Pointers to the other potential routing daemons are included.


    # Chapter 6, “Inside the Multicast Kernel 2.2.x Daemons”


    Multicasting data is a growing movement, but it has not yet reached the mainstream
    proportion that its proponents would like. This chapter covers two different multicasting
    daemons available for Linux. One of these is mrouted, which is typically used
    to connect to the MBONE—the multicast backbone—because it implements the DVMRP
    protocol; and the other is pim6d, which is used for most other multicast applications
    because it supports the PIM-SM protocol.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# **Chapter 7, “Kernel Support Tools”**


    Not all networks and individual machines are connected to one another through
    Ethernet cabling. Some our WANs and other solutions require dial-up networking,
    and this more often than not requires making use of our old friend PPP. In this
    chapter, you learn the ins and outs of this protocol and what it''s capable of,
    as well as how to utilize the pppd daemon for Linux PPP connections. After that,
    you learn about rip2d, the daemon that lets you add some basic RIP routing functionality
    to your PPP connection.


    # **Chapter 8, “Kernel 2.2.x Routing Daemons”**


    There are far too many tools to cover in just this one book. In this chapter,
    we take a look at additional tools such as zebra and iproute2, and also take a
    look at the differences between the kernel 2.2.x series and 2.4.x series from
    the point of view of routing.


    # **Chapter 9, “Inside the Commands”**


    Linux has a suite of commands that most of us have already used to handle our
    networking needs. However, most of these tools are actually far more complex than
    many people realize. This chapter covers the detailed innards of arp, ifconfig,
    netstat, ping, route, tcpdump, and traceroute. These tools will all serve you
    well in your networking and routing needs.


    # **Chapter 10, “Planning Basic Router Layout and Function”**


    Here''s where we really get into the how of routing. Before you get into the actual
    implementation, you need to have put some serious thought into how you intend
    to keep your own routing tables manageable and how you plan to help contribute
    to the overall Internet''s tables. By the time you finish this chapter you should
    be just about ready to start setting up your router.


    # **Chapter 11, “Linux Routing Basics”**


    If you picked up this book, you probably don''t have a simple network setup. You''ve
    got some complicated LAN, a WAN, or even a VPN that you''re trying to get working
    as a single routing unit. This chapter tackles the ins and outs of getting the
    various popular network types to route seamlessly, which helps with your security
    because people don''t realize that the machines aren''t all in the same building.


    # **Chapter 12, “Network Hardware Components, Technology, and Solutions”**


    Networks—especially ones that connect to the Internet—don''t work without telecommunications
    hardware. Not only does this chapter cover the various methods of making connections,
    such as over cable modems and DSL, it also discusses the'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'various kinds of setups you might use to allow remote administration of networks.
    In addition, there is discussion of the types of router interfaces that exist
    for digital data transfer.


    # Chapter 13, “Building a Routing Kernel”


    Whenever you intend to use a machine for a single purpose, or even just a few
    specific tasks, it’s important to remove as much extraneous functionality as possible.
    This concern applies not just to programs, but to the kernel as well. Once you’ve
    pulled out everything you know you don’t need, there’s more to do—namely, enabling
    any number of esoteric features that you otherwise wouldn’t need. This chapter
    covers building a custom kernel for your Linux router.


    # Chapter 14, “Security and NAT Issues”


    Routing just by itself doesn’t have anything to do with helping to secure your
    network. A router just ensures that your data gets where it needs to go. This
    chapter covers many of the tools you have available to turn your routing machine
    into your network’s first line of defense, including packet filtering and mangling,
    IP masquerading, and NAT.


    # Chapter 15, “Monitoring, Analyzing, and Controlling Network Traffic”


    In this chapter, we take a step back from the actual routing of data and look
    at the tools available for Linux that allow us to gather information on how efficient
    our network is and make corrections to any problems we find. Tools such as SNMP,
    MRTG, and IPTraf are included, as well as information on how to set quality of
    service (QoS) rules.


    # Appendix A, “Linux Routing Resources”


    This appendix is dedicated to helping you quickly locate the many programs mentioned
    in this book, as well as others we didn’t get to. There are also pointers to the
    central documents used to define how various Internet and networking protocols
    work and mentions of various additional resources that might be of use to you
    in your networking pursuits.


    Because things change so rapidly in the networking world, consider these items
    a jumping-off point to start from.


    # Appendix B, “Linux Hardware Routing Solutions”


    This appendix is dedicated to routing appliances with Linux under the hood and
    network cards that you can utilize with Linux to build a router. As the Linux
    market matures, we expect that this list will grow significantly.'
  merge: -1
  img_proc: true
