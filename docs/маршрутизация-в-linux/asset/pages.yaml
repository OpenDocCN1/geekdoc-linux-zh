    # Inside The Unicast

    Kernel 2.2.x Daemons


    THERE ARE A NUMBER OF DAEMONS available to fulfill your Linux routing needs, and
    each of these has a wealth of features. Because it is not possible for me to work
    every single one of these into this book''s examples in context, this chapter
    provides a central resource for a couple of the daemons you have to choose from
    and frees us up in later chapters to skip the basics and just get down to business.
    So, let''s take a look at some of the routing daemons available to you for managing
    unicast routing under the Linux kernel 2.2.x series.


    # Guide to routed


    The routed that comes with Linux kernel series 2.2.x by default—though it is not
    usually installed by default—only handles unicast IPv4. If you intend to use RIP
    within an IPv4 context, this is the only version you''ll need. Be aware that in
    this tool''s own manual under the BUGS section, it says the following: "routed
    is of dubious value. Consider using gated(8) or zebra(8)." As usual, it''s a matter
    of choosing the right tool for the job. Sometimes routed is all you need.'
