- pgno: 117
  md: '**Table 5.6 Continued**


    | Option | Purpose | Format | Value(s) |

    |---|---|---|---|

    | preference | Sets the preference value—how favored or unfavored this interface
    is—in the case where gated has marked the interface as functioning properly. |
    `preference value` | The lower the value, the more likely gated will utilize this
    interface. Default is 0. |

    | simplex | Prevents the interface from hearing its own broadcast packets and
    therefore from using them to determine whether it is functioning properly or not.
    | `simplex` | N/A |


    Finally, there is the define statement within the interfaces statement. You need
    to include this item if you set strictinterfaces in the interfaces option statement
    earlier. For each interface that gated needs to utilize but that may not be up
    and running when the routing daemon starts, you’ll need to create a define statement
