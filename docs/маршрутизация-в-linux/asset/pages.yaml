    active interfaces in this machine. | N/A | N/A |

    | nocheckzero | Sets gated not to reject RIP-1 packets who have nonempty reserved
    fields. | N/A | N/A |

    | preference | Sets the preference level for a route that gated learned through
    RIP (as compared to other routes). The preference level goes in place of value.
    The default is 100. In the case of gated, the lower the preference, the more likely
