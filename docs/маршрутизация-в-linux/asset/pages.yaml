- pgno: 278
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_278_0.png)


    # 14


    # Security and NAT Issues


    IN THIS CHAPTER WE''LL TAKE A BRIEF look at the security issues involved in configuring
    your own Linux router and how you can use your router to improve your overall
    network security. This is a pretty big topic, so this chapter will mainly serve
    as an overview rather than an in-depth study. Some of the concepts in this chapter
    will go a bit beyond routing, including some basics of creating a firewall with
    ipchains and Netfilter.


    One of the pluses of using Linux for your router is that you''re also able to
    enable other networking features you might not typically find in routers. However,
    that does tend to make the topic of Linux routers just a bit more complicated.
    In this chapter we''ll touch on several topics that could take an entire book
    to explain. We''ll try to give a complete overview without straying too far from
    the topic at hand. If you need to set up a particularly complicated and comprehensive
    firewall, for instance, you might want to look into one of the books on Linux
    firewalls.


    It goes without saying that things change pretty quickly in the world of computer
    security. While we''ll attempt to lay down some guidelines in this chapter that
    will help you to be security-conscious, your router is just one component of your
    network''s security. New attacks are found every day, and patches are usually
    created just as quickly.'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'Whatever distribution of Linux you decide to use for your router, be sure that
    distribution does a good job of announcing security issues and dealing with them.
    For instance, most Linux distributions maintain a security announcement mailing
    list, with a web-based archive of security announcements. Whenever a security
    hole is found, they''ll send an announcement with instructions on how to fix the
    issue (usually with a newer version of the package) or how to minimize exposure
    if the package has no fix available.


    If your router is a single-purpose machine with the bare minimum of services turned
    on, your exposure is already limited. You also might want to install the Linux
    Intrusion Detection System (LIDS) or another intrusion detection system just in
    case and perform a full security audit of your router at least once a month—even
    if there have been no security announcements and everything seems to be okay.


    It also goes without saying that remote management of your router should only
    be done using encrypted communications, such as Secure Shell (SSH). Transmitting
    passwords and usernames over Telnet is a very bad idea indeed.


    # SSH Vulnerabilities


    It has recently come to light that even some implementations of the SSH protocol
    aren''t completely immune to packet sniffing. It was long believed that even if
    SSH-encrypted communications were sniffed, the encryption would prevent a would-be
    attacker from getting any useful information from the sniffed packets.


    Both SSH-1 and SSH-2 might disclose password and username length and possibly
    the length of shell commands or the actual names of commands used. While it is
    extremely unlikely that a cracker would be able to get the actual password from
    a session, it makes using a brute-force password cracking program easier because
    the attacker would have the actual length of the password.


    The OpenSSH implementation of SSH, probably the most popular in the Linux community,
    addressed this vulnerability with the 2.5.2 release. If you''re using a release
    older than 2.5.2, you should upgrade immediately.


    # Packet Filtering and Packet Mangling with Your Router


    In addition to using your Linux box to perform routing tasks, you might want to
    set it up to do some other kinds of packet filtering. There are two packages that
    we''ll take a look at in this section: the ipchains package and Netfilter/iptables.


    The ipchains package is a little more limited than Netfilter/iptables, but if
    you''re using the 2.2.x series of the kernel, then you''re limited to ipchains—at
    least until someone backports them to 2.2.x. If you''re already well-versed in
    writing rules for ipchains but want to upgrade to the 2.4.x series, you''ll be
    happy to know that there is an ipchains compatibility module for 2.4.x'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# What is Packet Filtering?


    As you''re already aware, all this networking and routing stuff relies on information
    being broken down and transmitted as packets and then reassembled when it reaches
    its destination.


    Different protocols, such as HTTP, FTP, SSH, Telnet, and so on, each have distinctive
    packet headers so that the client and server computers (or peer computers with
    programs like Napster) are able to distinguish the purpose of the packets and
    handle them correctly.


    It''s also possible for individuals with malicious intentions to attempt to "spoof"
    packets in some way or to attempt to sniff packets and piece together information
    from those packets that might enable the cracker to successfully attack a computer.
    Crackers also might attempt to perform a Denial of Service (DoS) attack or Distributed
    Denial of Service (DDoS) attack by overloading the computer with certain types
    of packets or by sending packets that can confuse the target computer.


    Packet filtering, then, is the act of examining the packets that pass through
    a computer and then deciding how to handle them based on things such as protocol,
    port, source, and/or destination IP address, and possibly examining headers of
    packets to ensure that they''re not packet fragments or harmful in some other
    way.


    With packet filtering it''s possible to deny incoming or outgoing (or both) connections
    of certain types by blocking packets of a certain type or by blocking popular
    ports. For instance, if you want to disable transfer of mail from an outside machine
    to machines inside your network, you would want to disable incoming connections
    from outside your network to port 25 to any computer behind your router/firewall.
    This is a particularly good idea if you run a mail server that is only designed
    to allow mail to be sent from the internal network, as many spammers will attempt
    to find mail servers that aren''t properly configured to use as open relays for
    their spam.


    You also might want to perform packet filtering to perform load balancing. For
    instance, let''s say you have a high-traffic web site and you want to spread the
    load for the site across more than one server. In this instance you''d use NAT
    to balance the load between the servers.


    Any Linux box that is properly configured can perform packet filtering, but for
    any network connected to the Internet by a router/firewall, it''s far easier to
    spend your time configuring one machine (most likely your router) to filter all
    of the incoming and outgoing packets. However, if you''re using a Linux workstation
    to connect to the Internet directly, you''ll probably want to go ahead and configure
    at least a minimal firewall on that machine to protect your data from would-be
    crackers.


    # What is Packet Mangling?


    It might sound painful, but it isn''t. To be completely clear, a mangled packet
    is also a filtered packet, but it''s also a packet that has been rewritten in
    some way.'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# Introduction to ipchains


    Every major iteration of the Linux kernel comes with a new mechanism for packet
    filtering since the 1.1 kernel series. The 2.0 series used the program, ipfwadm,
    to control the filtering rules in the kernel; the 2.2 series introduced the ipchains
    program, which was generally considered an improvement over ipfwadm. Currently
    this is the program with the widest usage.


    The majority of Linux boxes are still running the 2.2.x series of Linux kernels,
    though as the 2.4.x series matures more and more, admins will begin to feel comfortable
    enough to migrate their servers to the 2.4.x series. (There are still quite a
    few servers running the 2.0.x series as well, though that kernel series is no
    longer undergoing active development, and admins are being encouraged to move
    to the 2.2.x or 2.4.x series.)


    # Using ipchains


    To use ipchains you''ll need to have enabled support in your kernel and have the
    userspace program compiled. As with most all commercial Linux distributions, this
    should be done already. If you''ve never compiled a Linux kernel before, you can
    refer to Chapter 13, "Building a Routing Kernel."


    # A Word About "Userspace"


    Because we''ve used the term, userspace, a few times in this chapter, it occurred
    to us that it might be confusing to folks who aren''t longtime Linux users and
    developers.


    The kernel developers refer to programs that people actually use and interact
    with as "userspace" code. Essentially, userspace programs are the programs that
    actually let you get useful work done while the Linux kernel chugs away in the
    background unnoticed and underappreciated unless something goes awry.


    When both userspace code and kernel features have the same name, as in the case
    of ipchains and iptables, it can get a bit confusing for Linux novices.


    If you don''t have ipchains or want to check to be sure that you''ve got the latest
    version, you can find the code and HOWTOs at http://netfilter.gnumonks.org/ipchains/.


    Development of ipchains seems to have slowed dramatically since the release of
    the 2.4.x kernel. The last release of ipchains at the time of this writing was
    1.3.10 on October 5, 2000.


    # ipchains Syntax


    Naturally, to muck about with kernel settings, you''ll need to be logged in as
    root. We recommend strongly that if you''re experimenting with ipchains, you start
    with a machine that''s not crucial to the operation of your company''s network—or
    at least wait until after hours when a boo-boo won''t draw the wrath of the entire
    staff and your boss. If your company is large enough to merit two or more shifts,
    making after hours work horribly inconvenient or impossible, it should be large
    enough to spring for a couple of test machines.'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'The syntax for ipchains is pretty simple. The basic command syntax is ipchains
    [-action] chainname [options]. You use the ipchains command to create, modify,
    or remove rule chains from the kernel. The rules can get somewhat complex, but
    they''re built up from a combination of simple rules.


    The easiest way to demonstrate ipchains is by giving a simple example. Before
    you work on your chains, you probably want to see what chains are already loaded,
    so you''ll run ipchains -L to see what rules are already in place. If you haven''t
    set any rules, you should see something like this:


    ```

    root@host:/ > ipchains -L

    Chain input (policy ACCEPT):

    Chain forward (policy ACCEPT):

    Chain output (policy ACCEPT):

    ```


    By default ipchains -L will list all rules. If you want to specify, you''d use
    something like this:


    ```

    root@host:/ > ipchains -L input

    Chain input (policy ACCEPT):

    ```


    # Adding a Rule to a Chain


    There are three chains that exist by default: input, forward, and output. It will
    probably come as no surprise that the input chain handles incoming packets, the
    outgoing chain deals with outgoing packets, and the forward chain deals with packets
    that come to the router/firewall but are destined to go on to other hosts.


    The syntax for adding a rule to a chain is simply ipchains [-A] chainname options.
    If you really enjoy typing, you can substitute [-append] for [-A]. Remember, a
    chain needs to exist before you can add rules to it. If you specify a nonexistent
    chain, you''ll just get an error message.


    For the sake of an example, let''s say that you want to deny all incoming packets
    by default and then allow a few desirables. The first step is to define a default
    rule, like this:


    ```

    root@host:/ >ipchains -P input REJECT

    ```


    This creates a default rule that will reject all incoming packets. This is a bit
    extreme, so let''s add a rule that will allow some traffic through, as follows:


    ```

    root@host:/ >ipchains -A input -i eth0 -s 10.0.0.0/24 -j ACCEPT

    ```


    The -s 10.0.0.0/24 argument tells ipchains to accept (-j ACCEPT) any incoming
    packets from the internal (10.0.0.0) network with a subnet of 255.255.255.0 going
    anywhere. If you wanted, you could specify destination addresses as well with
    the -d option. Sometimes it''s easier to say which IP addresses should not match
    a rule. In that case you would use -s ! 10.0.0.0/24, using the "!" expression.


    The -j option tells ipchains to "jump" to a rule, or basically to go ahead and
    make a decision about any packet that matches this rule. In this case, we''re
    telling ipchains to accept those packets. By the way, you have the choice of ACCEPT,
    DENY, REJECT, MASQ, REDIRECT, or RETURN for any target packets that match a given
    rule. See the ipchains man page for full details.'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Chain Names and Case Sensitivity


    It’s worth pointing out that the names of your rule chains or tables are case
    sensitive, like most things in the “NIX world. When using the 2.2.x series, the
    default chains are “input, forward, output.” When using the 2.4.x series, the
    defaults become “INPUT, FORWARD, OUTPUT.”


    # Flushing a Chain


    If you’ve created a set of rules for a chain and you want to get rid of them,
    simply “flush” the chain using the -F option. For example, if you wanted to get
    rid of all the input rules, you’d type ipchains -F input.


    This will completely reset the rule chain. If, however, you only want to drop
    one rule from a chain, you would use the drop (-D) option instead. The rules in
    each chain are numbered, so if you wanted to drop the first rule from a chain,
    you would issue ipchains -D input 1. Remember, to check which rules you have set
    already, you can use ipchains -L or ipchains -L chainname.


    # Starting from 1


    Folks who are new to Linux and/or programming will probably find the practice
    of beginning at 1 to be fairly straightforward. However, it’s unusual for a numbering
    scheme to begin at 1 for anything related to the Linux kernel internals. Usually
    any numbering scheme begins at 0 and goes from there. For instance, if you have
    a multi-processor system, they will be numbered CPU0, CPU1, and so forth.


    # Saving and Restoring Your Configuration


    After fiddling with ipchains all day, you’ve finally gotten exactly the setup
    you want. Congratulations! Now it’s time to make sure that you’ll be able to restore
    your golden configuration in the event you have to reboot or your system loses
    power. Remember, the rules you set up with ipchains don’t become permanent; they
    need to be restored any time the computer restarts.


    This is very easy, though. The authors of ipchains have included two scripts,
    ipchains-save and ipchains-restore, to make your life very easy. When your setup
    is exactly as you like it, run ipchains-save > router_config. This will save your
    current rules in a file called router_config that you can reload by using ipchains-restore
    router_config.


    # For More on ipchains


    While this hasn’t been an exhaustive look at ipchains, it should get you started
    with the basics. If you’re interested in doing comprehensive firewall setups,
    you might want to look into Linux Firewalls by Robert L. Ziegler, also published
    by New Riders. (Yes, we’d recommend it even if this book weren’t published by
    New Riders…it’s just a coincidence.) It covers using ipchains to create firewalls
    in great detail.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Introduction to Netfilter and iptables


    The distinction between Netfilter and iptables seems to get blurred quite a bit.
    Netfilter is actually a set of “hooks” in the Linux kernel’s network protocol
    stacks that allow various modules to work with network packets. As a packet travels
    through the stack, Netfilter can allow a module to drop a packet, forward it on,
    queue it for a program outside the kernel, or change it in some way.


    The iptables program is a userspace program that is used to add rules to the network
    tables. Technically, it should be possible to interact with the Netfilter framework
    using a program other than iptables.


    The Netfilter framework and iptables are direct descendants of ipchains, which
    means that iptables has quite a bit in common with ipchains. For the most part,
    they share the same syntax and options, with only a few minor changes.


    Netfilter is more than just another name for iptables. Netfilter also supports
    NAT, the ipchains, and ipwadm modules used for backwards-compatibility and the
    connection-tracking system.


    # Differences Between 2.2.x and 2.4.x


    How much packet filtering, IP Masquerading, and NAT have changed between the 2.2.x
    series and the 2.4.x series depends on your point of view. There have been quite
    a few changes under the hood, and new capabilities have been added that allow
    stateful filtering and other functionality that make Linux a force to be reckoned
    with for routing.


    However, the differences between ipchains and iptables syntax aren’t very drastic
    at all. There are some changes, but anyone who’s been doing work with ipchains
    should have no problem getting up to speed with iptables.


    # Using iptables


    As with ipchains, you’ll need to have the proper kernel modules compiled/enabled
    and have the iptables program installed as well. If you don’t have iptables, you
    can download it from the Netfilter project homepage at http://netfilter.gnumonks.org.


    # Most Current Version


    Even if your distribution comes with iptables already installed, you should probably
    check to see that you have the latest version. As of this writing, the current
    version is 1.2.2. If you have a version earlier than 1.2.1a, your version has
    a security weakness in the ip_conntrack_ftp module. It’s hard to overstress the
    importance of keeping up with the most current version of tools like iptables.
    Sometimes updates are released to fix minor bugs or add features, but many updates
    are security-related or address serious bugs that could cause problems down the
    road. Spending a few hours a month checking for and installing updates could save
    you days in cleaning up after a cracker—or weeks looking for a new job after a
    script kiddie “owns” your system.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# iptables Syntax


    Did you read through the section on ipchains? Well, if you did, then you already
    have a good feel for using iptables. You use iptables to add, modify, or flush
    rules from the tables of IP packet filtering rules in the Linux kernel.


    # Chains, Rules, Tables...What''s Going on Here?


    All the talk about rules, chains, and tables can get kind of confusing if you
    don''t know what''s going on. Actually, even if you do know what''s going on,
    it can get a bit murky at times.


    Starting from the smallest building block, a rule is a way of describing criteria
    for matching a packet and what is to be done with that packet. If the packet matches,
    it fits a rule. A packet that matches one or more rules is called a target.


    A chain is a collection of rules that match a set of packets or targets. And,
    finally, a table is a collection of chains. In the 2.4.x kernels, you have a filter
    table that contains INPUT, OUTPUT, and FORWARD chains by default, nat, and mangle.


    # Inspecting The Chains


    Before we add any rules to the chains, it''s probably a good idea to take a gander
    at the existing chains to see if there are any rules already lurking about. Even
    if you haven''t been working with iptables, some distros might slip a few rules
    in the startup files.


    To view the exiting rules, type:


    ```

    iptables -L

    ```


    and you should see something like this:


    ```

    root@host: >

    Chain INPUT (policy ACCEPT)

    target  prot opt source      destination

    Chain FORWARD (policy

    ACCEPT)

    target  prot opt source      destination

    Chain OUTPUT (policy

    ACCEPT)

    target  prot opt source      destination

    ```


    Even though there are no rules currently in place, you''ll notice that the output
    from iptables is a bit more verbose than ipchains.


    After you''ve put added rules to some of the existing chains or added chains of
    your own, you might want to view only that chain. In that case, simply specify
    the name of the chain you''d like to view, like this:


    ```

    root@host: >iptables -L CHAINNAME

    ```


    # Adding a Rule to a Chain


    To add a rule to one of the existing chains, you will use the append (-A) command
    and specify the chain to which you want to append the rule. You also will need
    to specify a source (-s), destination (-d), protocol (-p), and the action (-j)
    you want taken on the target packet.'
  merge: -1
  img_proc: true
- pgno: 286
  md: "All of this is easier done than said. To illustrate, here’s a simple example\
    \ that will block any telnet connection coming in from outside the local network:\n\
    \n```\nroot@host:> iptables -A INPUT -s ! 10.0.0.0 -p tcp --destination-port telnet\
    \ -j REJECT\n```\n\nThis example will reject (-j REJECT) any packets attempting\
    \ to establish a telnet connection, unless they’re being made from inside the\
    \ local network. Because using telnet is a bad idea these days anyway, you can\
    \ keep your users from making outgoing telnet connections as well with the following:\n\
    \n```\nroot@host:> iptables -A OUTPUT -p tcp --destination-port telnet -j REJECT\n\
    ```\n\n# Creating a New Chain\n\nIf you’d like to specify a chain other than INPUT,\
    \ OUTPUT, or FORWARD, you can create a custom chain. This one is easy—simply decide\
    \ what name you’d like to use for the new chain (up to 31 characters) and use\
    \ the new chain (-N) option.\n\n```\nroot@host:> iptables -N NEW_CHAIN_NAME\n\
    ```\n\nNow if you run the iptables -L command, you’ll see something like this:\n\
    \n```\nroot@aesir:~ > iptables -L\nChain INPUT (policy ACCEPT)\n target     prot\
    \ opt source               destination\nChain FORWARD (policy ACCEPT)\n target\
    \     prot opt source               destination\nChain OUTPUT (policy ACCEPT)\n\
    \ target     prot opt source               destination\nChain NEW_CHAIN_NAME (0\
    \ references)\n target     prot opt source               destination\n```\n\n\
    As you can see, when you create a new chain, it has no default rules, unlike the\
    \ default chains.\n\n# Flushing a Rule\n\nAs with iptables, flushing a chain requires\
    \ using the -F. To flush the OUTPUT chain, for instance, you would type iptables\
    \ -F OUTPUT. This will get rid of all rules that have been set in that chain.\n\
    \n# For More on iptables\n\nThis has been a fairly brisk overview of iptables.\
    \ If you want to learn more about them, the man page contains a fairly extensive\
    \ description of the use of iptables. The Netfilter home page also has several\
    \ well-written HOWTOs by the primary author of Netfilter, Rusty Russell. Even\
    \ if you’re not going to use Netfilter or iptables extensively, they’re worth\
    \ reading. How can you pass up documentation by an author who"
