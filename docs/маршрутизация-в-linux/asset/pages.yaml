- pgno: 213
  md: '# tcpdump


    All of the tools covered thus far in this chapter are most likely included in
    whichever Linux distribution you choose. tcpdump, although very popular, might
    not be included but should be the first thing installed after system installation.
    tcpdump is available at http://www.tcpdump.org/ and requires libpcap, also available
    at http://www.tcpdump.org, to operate. tcpdump is a small footprint protocol analyzer
    that should be placed on any Linux hosts acting as routers or performing other
    centralized services where troubleshooting should be infrequent but must be performed
    in a timely fashion when it is needed.


    > Sniffers on Routers

    > Some security professionals frown on the practice of placing sniffers on routers
    given that the sniffer will provide an easy means of additional hacking should
    the router be compromised. Of course, once a router is compromised, the sniffer
    can be installed by the hacker. In any case, consider your security needs and
    requirements before placing a sniffer on a router.


    If tcpdump is started without any command-line parameters, it will place all connected
    interfaces into promiscuous mode and dump all packets the Linux node sees to stdout,
    which is typically the terminal. Besides a quick view to ensure the node is seeing
    network traffic, tcpdump without parameters usually creates too much output to
    be of much use; and because it is going to stdout, the output storage is limited
    to the terminal''s buffer. tcpdump, with the correct parameters, can turn screens
    of network traffic into useful chunks of data that can be analyzed and often lead
    to problem resolution.


    # -I Interface


    To limit which packets tcpdump matches on, the -I interface can be used to tell
    tcpdump to only examine packets from a particular interface. For example, to only
    examine packets on eth1, use:


    ```

    [root@lefty /root]# tcpdump -i eth1

    Kernel filter, protocol ALL, datagram packet socket

    tcpdump: listening on eth1

    ```


    Before examining tcpdump parameters and output, let''s dissect the basic line
    of a tcpdump output:


    ```

    11:22:53.138977 < 192.168.1.101.1041 > 192.168.1.254.telnet: . 0:9(0) ack 288
    win

    =>7479 (DF)

    ```


    The first field in the tcpdump output is the time stamp with an additional sequence
    number added after the seconds. Following the time stamp is the > symbol, which
    signifies the direction of the packet in relation to the Linux node where tcpdump
    is running. < signifies incoming and > outgoing. Next is the source address of
    the packet followed by the port number (1041). The > is a placeholder between
    the source and'
  merge: -1
