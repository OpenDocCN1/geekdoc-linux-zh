    \     LISTENING   531  /dev/gpmctl\nunix  0      [ ]         DGRAM           \
    \      13679\nunix  0      [ ]         DGRAM                 843\nunix  0    \
    \  [ ]         DGRAM                 576\nunix  0      [ ]         DGRAM     \
    \            518\nunix  0      [ ]         DGRAM                 468\nunix  0\
    \      [ ]         DGRAM                 402\nunix  0      [ ]         DGRAM \
    \                390\n```"
  merge: -1
  img_proc: true
- pgno: 211
  md: 'Line 3 of the netstat -a output is the column heading. The first column, proto,
    determines the protocol that is listening on the particular port. The proto is
    actually the socket method used to access the port, which will either be tcp,
    udp, or raw. The Recv-Q is the number of packets received by the kernel but that
    have not yet been read by the daemon listening to the port. The Send-Q is the
    number of packets pending acknowledgement by the remote host.


    The Local Address is made up of the local node''s IP address and the logical name
    of the port. In the preceding example, the first entry shows that the connection
    is a telnet session. If the IP address is shown by an *, then the daemon is listening
    to all connected interfaces, which implies the daemon is in listen mode.


    The Foreign Address is made up of the remote node''s IP address and the port it
    is connected to. In the telnet entry given earlier, the remote host is the client
    using the telnet protocol on port 23. (The local node is running the telnet daemon
    running on port 23.)


    The State column applies only to TCP connections and reports the state the connection
    is in: CLOSING, CLOSED, CLOSE_WAIT, ESTABLISHED, FIN_WAIT1, FIN_WAIT2, LAST_ACK,
    LISTEN, SYN_SENT, SYN_RECV, TIME_WAIT.


    With the -a parameter, netstat displays a second table with the UNIX domain socket
    connections, which are accessed directly through a device driver as opposed to
    a listening daemon.


    To determine which ports are listening on the Linux node, use the -l parameter.
    The output is similar to the -a with the exception of not showing outbound connections
    initiated by users.


    The -p option will show which processes own or are listening to the specific port.
    This parameter, combined with the -l, acts like a network aware ps command:


    ```

    [root@elfty /root] netstat -p


    (Not all processes could be identified, non-owned process info will not be shown,
    you would have to be root to see it all.)


    Active Internet connections (only servers)


    Proto Recv-Q Send-Q Local Address Foreign Address State

    tcp 0 0 *:* :* LISTEN

    tcp 0 0 *:* :* LISTEN

    682/httpd 0 0 *:* :* LISTEN

    571/sendmail accept *:* :* LISTEN

    tcp 0 0 *:* :* LISTEN

    527/lpd 0 0 *:* :* LISTEN

    tcp 0 0 *:* :* LISTEN

    513/inetd 0 0 *:* :* LISTEN

    ```'
  merge: -1
  img_proc: true
