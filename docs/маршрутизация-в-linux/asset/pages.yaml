  img_proc: true
- pgno: 113
  md: 'things a program must swap between doing—have to get initialized. The gated
    daemon first sets values for all of the global variables for each thread. It then
    reads its configuration file, /etc/gated.conf, into memory. Because gated is modular,
    it does not load the capability to run every single protocol it supports. Instead
    it looks in /etc/gated.conf for the protocols that have been enabled and sets
    up a framework to run each, including loading the appropriate modules of code.


    When you configure gated’s behavior, one thing you do is set up rules for how
    it imports routes it learns from outside sources. At this point, these rules are
    loaded into memory. After this occurs, gated loads the rules for how you want
    it to handle exporting routes to other routers and protocols.


    At this time all initializations are complete. The gated daemon enters what the
    programmers call the forever loop, which means it enters its actual running state—and
    it will stay there until you tell it to do otherwise. It first sets all of the
    timers required for different protocol behaviors. The daemon then looks to the
    sockets, which are files used to transfer information between programs, that gated
    is interested in and loads any pertinent data from them. If any resulting tasks
    have to be run, they are queued to start when it’s their turn.


    Finally, gated runs the tasks that happen in the foreground and background. Foreground
    tasks are visible to the administrator and are items that only need to run once.
    They’re often requests from protocol modules to take care of something whenever
    CPU time is available. In contrast, background tasks are hidden away and may run
    constantly or at regular intervals.


    # Configuring Public gated


    The gated configuration file is gated.conf. Statements within this file can stretch
    beyond one or more lines and so are terminated with a semicolon (;). There are
    also two different kinds of comments you’ll run into here. One is the standard
    hash (#), which comments out the entire line. The other is the C-like pair: /*
    to start the comment and */ to end it. Now, with the basics out of the way, let’s
    look at how this file is built.


    One of the most important things to keep in mind is statement type order. There
    are a number of main statement types that must be used in the proper order and
    two additional ones that can be liberally scattered throughout as needed. The
    statement types and the items within these types are briefly defined in Table
    5.3 for reference’s sake.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Table 5.3 Types of Statements Available for gated.conf, Sorted by Order Requirements


    | Type | Order | Statements |

    |---|---|---|

    | options | First | options |

    | definition | Second | autonomoussystem, martians, routerid |

    | control | Third | aggregate, export, generate, import |

    | directives | Third | \directory, \include |

    | interfaces | Third | interfaces |

    | protocol | Third | bgp, egp, icmp, isis, kernel, ospf, redirect, rip, snmp |

    | static | Third | static |

    | trace | Third | traceoptions |


    # The options Statement


    The typical gated.conf file starts with an options statement, which sets global
    values that apply to everything that follows. You do not have to have an options
    statement at all if you don''t see the need. These items do not have to be in
    any specific order within the overall statement.


    # Table 5.4 Values Available in the gated.conf options Statement


    | Option | Purpose | Format | Value(s) |

    |---|---|---|---|

    | mark | Writes a timestamp to the gated logfile every specified interval. | mark
    time | Number of seconds to wait between timestamps. |

    | noresolv | Specifies not to try to convert IP addresses into host.domain.extension.
    | noresolv | N/A |

    | nosend | Specifies not to send out packets. Just listen to the network traffic.
    Used only for staying out of RIP traffic. | nosend | N/A |

    | syslog | Sets the amount of data that gated should log through syslog. There
    are two different syntax options. The first logs only the level listed, and the
    second logs all levels from the lowest to the specified level. | syslog level

    syslog upto level | Logging level, listed from least to most problematic: debug,
    info, notice, warning, err, crit, alert, and emerg. The lower the level you decide
    to log, the more data you will generate. |'
