    # -q


    -q, or quiet mode, tells tcpdump to just print the Layer 4 (tcp, udp, or ICMP)
    protocol and port number or name. Here is a tcp (telnet) example:


    ```

    [root@lefty /root]# tcpdump -i eth0 -nq

    Kernel filter, protocol ALL, datagram packet socket

    tcpdump: listening on eth0

