- pgno: 135
  md: 'One thing to note is that you''re seeing layers upon layers of the same settings
    here. There are multiple places, for example, that you can set traceoptions. The
    most local version of this setting is the one that takes hold. If you''ve set
    traceoptions for a specific neighbor, then that''s the setting used even if the
    overall egp statement says differently.


    # BGP Configuration


    Another potential border routing protocol is appropriately named the Border Gateway
    Protocol (BGP), which you should be familiar with from Chapter 3. If you would
    rather run a BGP border router than an EGP, gated can still do the job. You activate
    this capability by creating a bgp statement starting with:


    `bgp on {`


    The main substatements available in the bgp statement are listed in Table 5.20.
    You will notice that much of the meat in the setup is not this set of statements,
    but is instead in the child statements within substatements.


    Table 5.20 Options Available Within the bgp Statement in gated


    | Option | Purpose | Format | Value(s) |

    |---|---|---|---|

    | defaultmetric | Sets the BGP cost assigned to routes this border router advertises
    to neighbors. | defaultmetric cost; | An optional value that can add a cost to
    routes advertised from this border router. |

    | group type | Enables you to create a group of like BGP peers. Use more than
    one group type statement to make more than one grouping. | group type details
    { allow { options }; peer options; } | This is a very simplified version of what
    a group type statement looks like. See the chapter text for a more detailed discussion.
    |

    | preference | Sets how important gated sees routes learned from RIP. | preference
    value; | The lower the value, the more important these routes are to gated when
    utilizing BGP. Default is 170. |

    | traceoptions | Sets how gated logs data for this specific BGP router. | traceoptions
    settings; | Options available to all protocols are listed in Table 5.11, and options
    available specifically in the bgp statement are listed in Table 5.21. |'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Table 5.21 BGP-Specific traceoptions Statements Available in gated


    | Option | Purpose |

    |---|---|

    | keepalive | To log BGP KEEPALIVE packets. |

    | open | To log BGP OPEN packets. |

    | packets | To log all BGP packets. |

    | update | To log BGP UPDATE packets. |


    The most complicated statement within bgp is group type. Let''s piece this one
    together step by step. This statement starts as you might expect:


    group type


    After this there are five different ways you can continue, depending on the nature
    of the machines you''re trying to connect:


    +   - external peers. Defines a group of BGP routers outside the autonomous system.

    +   - igp peers. Defines a group of routers within your autonomous system that
    are not border routers but that BGP needs to exchange information with.

    +   - internal peers. Defines a group of routers within your autonomous system
    that do not utilize an IP-based routing protocol.

    +   - routing peers. Defines a group of BGP routers within your autonomous system
    used with your internal routers to resolve address forwarding.

    +   - test peers. Defines a test BGP router that you can use to make sure information
    is propagating properly.


    So, depending on which type of group you''re setting up at the moment, you begin
    with one of the following lines to start your statement:


    ```

    group type external peers

    group type igp peers

    group type internal peers

    group type routing peers

    group type test peers

    ```


    The word, "begin," is used here because you''re not done with the initial line
    yet. No matter which of these you choose, the next item is the AS number to which
    this particular group belongs. So now you have:


    group type gtype peers as


    If you''re setting up an external, internal, or test group the first line is finished.
    For a routing or test group you have two new items to add. You start with:


    group type gtype peers as proto'
  merge: -1
