- pgno: 323
  md: '# Official Reference Documents


    There are many reference documents listed throughout this book and many more that
    never came up in the chapters themselves but are useful for those who are dealing
    with routing and complex networking in Linux. Table A.5 contains a listing of
    RFCs and Internet Drafts that you may find useful in your research.


    Table A.5 Official Documents You Might Find Useful


    | Document Defines | Location |

    |---|---|

    | Assigned Network Numbers | http://www.landfield.com/rfcs/rfc778.html |

    | Border Gateway Protocol (BGP) | http://www.faqs.org/rfcs/rfc1105.html |

    | Border Gateway Protocol 4 (BGP-4) | http://www.faqs.org/rfcs/rfc1771.html |

    | Distance Vector Multicast Routing Protocol (DVMRP) | http://search.ietf.org/internet-drafts/draft-ietf-idmr-dvmrp-v3.10.txt
    |

    | Exterior Gateway Protocol (EGP) | http://www.faqs.org/rfcs/rfc904.html |

    | Internet Protocol (IP) version 4 | http://www.faqs.org/rfcs/rfc760.html |

    | Internet Protocol (IP) version 6 | http://www.faqs.org/rfcs/rfc2373.html |

    | Open Shortest Path First version 2 (OSPF-2) | http://www.faqs.org/rfcs/rfc1247.html
    |

    | Protocol Independent Multicast Sparse Mode (PIM-SM) | http://www.faqs.org/rfcs/rfc2362.html
    |

    | Routing Information Protocol (RIP) | http://www.faqs.org/rfcs/rfc1058.html |

    | RIP version 2 (RIP-2) | http://www.faqs.org/rfcs/rfc1723.html |

    | Simple Network Management | http://www.faqs.org/rfcs/rfc1157.html |

    | Transmission Control Protocol (TCP) | http://www.faqs.org/rfcs/rfc761.html |


    Many of the locations given here are not the only places to view the documents.
    This is especially true of the RFCs, which are stored in many places throughout
    the Internet.'
