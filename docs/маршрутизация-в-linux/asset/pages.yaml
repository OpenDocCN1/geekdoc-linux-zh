- pgno: 264
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_264_0.png)


    # 13


    # Building a Routing Kernel


    ONE OF THE MAIN SELLING POINTS OF THE GNU/Linux operating system is the ability
    to recompile the Linux kernel on demand. The ability to add needed functionality
    or to strip out unneeded bits was one of the key reasons that Linux has been so
    widely adopted. System administrators, software vendors, and power users have
    flexibility with Linux that they do not have with proprietary operating systems
    or hardware routing appliances.


    # Why Build?


    If you obtain one of the typical Linux distributions, the odds are that you''ll
    have the ability to enable some routing functions without having to recompile.
    If routing is just one of the tasks for which you''ll be using Linux, using a
    pre-compiled kernel might be the best way to go. However, if you''re going to
    be doing routing only, you''ll also be saddled with many functions that increase
    the size of the kernel with functions that you don''t need—and don''t want—in
    a system dedicated only to routing functions.


    For instance, most precompiled kernels come with support for sound, CSLIP, Point-to-Point
    Protocol (PPP), RAID controllers, and other protocols and devices that you won''t
    need. (Very few routers have need of a sound card, for example.)'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'In this chapter, we’ll look at customizing the Linux kernel for use in routers
    and some of the specialized Linux distributions created especially for routing.


    You might wonder if it’s worth the trouble to recompile the Linux kernel if it
    already has the functionality that you need. The answer is, almost always, yes.
    Most commercial Linux distributions have kernels that are pretty much one-size-fits-all.
    They throw in the kitchen sink because that’s the best way to make sure that most
    users will be able to install Linux and get it running right away. This approach
    is great for getting the system installed quickly but leaves something to be desired
    in terms of optimization and security.


    Even the specialized routing distributions that we’ll look at later in the chapter
    will eventually need to have the kernel patched for upgrades or security updates.
    The great thing is that Linux, unlike proprietary operating systems (OSs) used
    in Cisco or other routing hardware, can be modified easily to suit your needs.


    # Upgrades and Flexibility


    To be fair, Cisco routers and other routing appliances usually can be upgraded
    if a security hole is found or if they have a bug of some kind. However, they
    do not allow the kind of flexibility and the same level of customization that
    Linux enjoys. A Linux router is typically capable of more functions than a traditional
    router—and at a lower cost.


    # Smaller and Faster


    The most obvious benefit of tailoring the kernel to meet your needs and only your
    needs is that you’ll have a kernel that takes up less memory and has better performance.


    Admittedly, this is less of a concern today than it was a few years ago—with standard
    Intel-based hardware reaching speeds of 1.5GHz on a single-processor machine and
    RAM being priced under $1.00 a megabyte. In some cases, admins are able to buy
    just a new whitebox computer and set it up as a Linux router without worrying
    about cost. However, Linux routers are often refurbished computers from the company
    “boneyard” that don’t have the muscle of newer computers. That’s okay; you can
    save your hardware budget for something else and get a few more years of use from
    that old Pentium “classic” that’s been gathering dust.


    The Linux kernel isn’t the only place to put a standard distro on a diet, however.
    Presuming you’re installing a system from scratch, you’ll want to install the
    bare minimum number of packages and be careful not to include unnecessary software.


    # Specialized Functionality


    The “stock” kernel compiled for most distributions won’t include options such
    as the Netlink socket or Reverse ARP, but it’s likely you’ll want to use these
    on your Linux router. The only way to get them are here, then, is to recompile
    the kernel with support for these features. (While you’re at it, it’s a good time
    to strip out unnecessary features and support for unused devices.) This is probably
    the most common reason, along with upgrades and security fixes, that folks compile
    their own kernel.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'You’ll almost certainly need to recompile the kernel if you want to enable
    the IPv6 protocols (or if you want to support bridging, the X.25 packet layer
    or any lesser-used protocols). Again, Linux’s support for these protocols really
    shows the strength of an open operating system. Generally, commercial entities
    such as Microsoft, Sun, or Novell simply decide what protocols they’re going to
    support, and that’s it. The most common options will be supported, and any customers
    using “exotic” or legacy systems are going to be left out in the cold.


    On the other hand, Linux or other kernel developers might not decide to support
    protocol X, but that doesn’t stop anyone else from developing a patch or module
    to support their protocols and submitting it to the kernel team.


    # Specialized Hardware


    Generally, the kernel is compiled to support the most common hardware. If you
    have special controller cards or devices that are supported by the Linux kernel
    but are exotic or rare enough not to be included in the default kernel, you’ll
    need to be able to recompile the kernel to support those devices.


    Another situation that’s fairly common is adding the latest patch or “experimental”
    code to the kernel to support a relatively new device or one that hasn’t yet been
    judged stable. For instance in the 2.4.3 Linux kernel, several of the Netfilter
    and IP Tables modules are still considered experimental, but many users might
    want to test and possibly deploy this code rather than waiting for it to become
    “stable.”


    Wide area network (WAN) router cards are good examples of “specialized” hardware.
    The average user won’t need a WAN router on their workstation or web server, but
    Linux does support a number of these cards and the ability to perform WAN routing
    over X.25 or frame relay.


    When planning out your router, be certain to make sure that the hardware you want
    to use is supported under Linux. Hardware support under Linux isn’t always guaranteed,
    though networking hardware—particularly high-end hardware—often does have support.
    If you’re unsure, do a Google search on the Internet with the name of the product
    and “Linux.” Ninety-eight times out of a hundred, this will return useful results
    from one of the various Linux mailing lists. You also might try the mailing list
    archives for your Linux distribution or post a message to that list if all else
    fails. (Unless you like wearing asbestos skivvies, always do your searching before
    posting to a mailing list. It’s not only good Netiquette, it’ll keep you from
    getting flamed by folks who have seen the same question asked 30 times in the
    same week.)


    # Security and Bug Fixes


    If you have no special case hardware to consider and the added performance of
    a tweaked kernel doesn’t strike you as enough of a reason to learn to “roll your
    own,” then you might want to consider security and bug fixes as reasons to learn
    how to patch and recompile the kernel.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'Regardless of when the distribution you''re using was put together, the odds
    are that there have been bug fixes and security patches released for it. The kernel
    development team might not speed between major releases, but the minor releases
    come out at fairly regular intervals. These point releases frequently have important
    security and bug fixes. Even if your kernel is the latest release when you set
    up the router, the odds are there will be newer version with a crucial bug fix
    or security patch released within six months.


    In addition, depending on your level of paranoia, you might want to disable loadable
    kernel modules. This prevents an intruder who has gained access to your system
    from loading a kernel module that would help them cover their tracks or perform
    other unwanted activities. Granted, if someone has cracked your router and gained
    root access, you have problems either way. However, limiting the potential damage
    is one of the hallmarks of system security. This also prevents a cracker from
    unloading any kernel security features because they''ve been compiled as part
    of the kernel rather than as modules.


    # Additional Security


    If you''re going to go to the length of compiling a static kernel, be sure to
    remove the kernel source and configuration files so that crackers can''t guess
    what you''ve already compiled if they do get access to your system.


    # Building the Linux Kernel


    Now that we''ve covered the "Whys," it''s time to roll up our sleeves and actually
    compile a kernel. If you haven''t done this before, it''s best to do it on a test
    machine or make a backup of your old kernel just in case. If you use LILO to boot
    your Linux machine, make a copy of the Linux kernel before compiling a new kernel
    and make a new entry in your /etc/lilo.conf for the old kernel. It should look
    something like this:


    ```

    root=/dev/hda2

    boot=/dev/hda

    install=/boot/boot.b

    map=/boot/map

    vga=normal

    timeout=50

    prompt

    default=Linux

    lba32


    image=/vmlinuz

    label=Linux

    read-only

    initrd=/boot/root.bin

    root=/dev/hda2

    ```'
  merge: -1
  img_proc: true
- pgno: 268
  md: "```\nimage=/vmlinuz.old\nlabel=Old_Kernel\nread-only\noptional\nroot=/dev/hda2\n\
    ```\n\nThen simply run lilo and you'll have a working kernel to fall back on should\
    \ you make a mistake while compiling the new one.\n\nAt the time of this writing,\
    \ the current version of the Linux kernel is 2.4.3, but most Linux users are still\
    \ using the 2.2.x kernel series for production machines. While the 2.4.x kernel\
    \ series has a number of new features and improvements to old features, it will\
    \ be some time before the 2.4.x kernels become the norm. Of the commercial Linux\
    \ distributions, only SuSE, Red Hat, and Linux-Mandrake have put out distributions\
    \ with a 2.4 kernel, and they all feature 2.2 kernels as an option.\n\nIn this\
    \ section we'll walk through obtaining the Linux kernel source and compiling the\
    \ 2.4.x kernel using the Menuconfig tool. While some of the options differ between\
    \ the 2.2.x and 2.4.x kernels, the process is the same. It might sound intimidating\
    \ if you've never done it before, but it's actually fairly simple.\n\n> The 2.0.x\
    \ Linux Kernel Series\n> \n> The final release in the 2.0.x series was released\
    \ in February 2001 at version 2.0.39. For those who don't follow kernel development,\
    \ it's customary for the last stable version of the kernel to be maintained while\
    \ development of the current kernel continues. While many Linux users are enthusiastic\
    \ about using cutting edge technology, just as many admins are hesitant to make\
    \ drastic changes in production machines and usually wait for a compelling reason\
    \ to upgrade.\n> \n> If you have any routers or systems currently running the\
    \ 2.0.x series of kernels, it would be a good idea to upgrade to the 2.2.x series\
    \ if at all possible.\n\n# Choosing the Kernel\n\nIf you're not locked into the\
    \ 2.2.x or 2.4.x series, you'll need to decide which series you want to build\
    \ your router around. Obviously, the 2.2.x series has been more thoroughly tested\
    \ and is more mature. On the other hand, the 2.4.x series has a slew of performance\
    \ increases and new features that might be attractive. If you're not reading the\
    \ book sequentially, you might want to go back and review the chapters that focus\
    \ on the kernel daemons and Chapter 14, \"Security and NAT Issues,\" which covers\
    \ the routing \"basics\" of 2.2 and 2.4.\n\nAll things being equal, it probably\
    \ makes more sense to put time and effort into the latest kernel series. While\
    \ the 2.4 kernel isn't quite as mature as the 2.2 series, it will enjoy the most\
    \ concentrated development efforts in the future and already has significant performance\
    \ increases and more advanced networking features.\n\nFinally, there's no harm\
    \ trying both kernels if you're unsure. It is free software, after all. If possible,\
    \ take a few days just to experiment with setting up your router and testing different\
    \ configurations."
