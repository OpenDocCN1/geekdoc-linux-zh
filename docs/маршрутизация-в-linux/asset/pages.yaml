  md: 'Another difficult statement to pin down is traceoptions. One reason for this
    awkwardness is that there are two sets of values available: one that applies gated-wide
    (see Table 5.11) and another that only applies to RIP traffic (see Table 5.12).
    There are also global tracing options available, but they have no meaning in a
    specific protocol statement such as rip.


    # Table 5.11 Tracing Options Available for all Protocols in gated—Though Some
    of These Make No Sense for Particular Protocols


    | Option | Purpose |

    |---|---|

    | all | To enable every option in this table for this protocol statement. If an
    option makes no sense for the protocol, it is ignored. |

    | general | To enable the normal and route options. |

    | normal | To log regular protocol activity as well as abnormal happenings. |

    | policy | To log policy information for imported and exported routes. |

    | route | To log routing table changes. |

    | state | For protocols that use various router states (RIP is not one of them),
    to log information about these state changes. |

    | task | To log information about interface use and processor use by this protocol.
    |

    | timer | To log timer use by this protocol. |


    # Table 5.12 gated Tracing Options Specific to RIP


    | Option | Purpose |

    |---|---|

    | other | To log packets not specified by the other options. |

    | packets | To log all RIP packets. |

    | request | To log RIP information-requesting packets. |

    | response | To log RIP information-containing packets. |


    # Open Shortest Path First (OSPF) Configuration


    One of the more popular internal unicast routing protocols is OSPF. As you might
    remember from Chapter 1, this protocol includes features such as designated routers
    and routing areas. Due to this level of complexity, OSPF involves even longer
    sets of code to configure. So let''s get started.


    You begin the OSPF configuration statement with the following:


    ```

    ospf status

    ```


    The status entry for ospf has the same options as the rip statement had:


    +   - no; Do not handle OSPF traffic.

    +   - off; Do not handle OSPF traffic.'
