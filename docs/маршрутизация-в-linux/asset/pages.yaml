- pgno: 123
  md: "# Table 5.9 Continued\n\n| Option | Purpose | Format | Value(s) |\n|---|---|---|---|\n\
    | Trustedgateways | Sets what routers gated accepts RIP updates from. | trustedgateways\
    \ machines; | The machines value consists of one or more space-separated IP addresses.\
    \ |\n\nAs you can see, the RIP setup for gated can get quite complex. Two of the\
