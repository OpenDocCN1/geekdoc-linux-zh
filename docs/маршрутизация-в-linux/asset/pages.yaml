- pgno: 218
  md: 'Using and, or, and not and the common expressions shown in Table 9.8, it is
    possible to troubleshoot most network problems and to filter exactly what needs
    to be analyzed.


    # Table 9.8 tcpdump Expressions


    | dst host | host | tcpdump examines the IP packet and determines if there is
    a match. | The host is the IP address or name of the node being monitored. If
    the name resolves to multiple IP addresses, tcpdump checks for each address. |

    | dst host | host | Same as above. | Same as above. |

    | src host | host | The source bits are examined to determine a match. | |

    | src host | host | The source bits are examined to determine a match. | |

    | host | host | tcpdump examines the source and destination bits. | |

    | ip | arp | host | tcpdump determines if the packet is of type IP, ARP, or RARP
    and if the source or destination bits match host. | |

    | ip | arp | | rarp host | |

    | gateway | host | tcpdump examines the MAC address of the packets | |

    | dst | src | net | tcpdump examines the destination or source bits (depending
    on dst or src) and determines if the address is within the address range defined
    by net. | net can be either a network defined in /etc/networks or a network address
    such as 192.168.1.0 or a network mask with the prefix notation used: 192.168.1.0/24.
    |

    | net | net | tcpdump determines if the source or destination falls within the
    address range defined by net. | |'
