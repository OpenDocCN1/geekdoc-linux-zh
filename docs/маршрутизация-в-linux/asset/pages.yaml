- pgno: 65
  md: "![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_65_0.png)\n\nFigure 2.4  The new router\
    \ tree, with the thick broken lines representing IP tunnels.\n\n+   - **Scenario\
    \ 2:** Router Arts was intentionally removed. It is not going to be replaced with\
    \ anything else.\n+   \n+     This scenario is not appreciably different from\
    \ the first. The major difference is that Eng could be set up for DVMRP, and the\
    \ tunnel to Eng could be built before taking Arts down. Alternatively, both Ag\
    \ and Eng could become DVMRP routers, or a new connection could be laid from elsewhere.\n\
    +   \n+   - **Scenario 3:** The connection that router Arts uses to access the\
    \ network went down temporarily, isolating this router, the machines on its own\
    \ network, and any networks that it is supposed to pass data to from everyone\
    \ else. This connection stays down for three hours.\n\nHere is where things get\
    \ interesting again. When Arts vanishes, the process is identical to when it was\
    \ taken down in scenario 1. The instructive part is when Arts finally comes back\
    \ up, bringing its group members back out of isolation."
