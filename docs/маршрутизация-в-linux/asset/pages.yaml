  img_proc: true
- pgno: 324
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_324_0.png)


    # B


    # Linux Hardware Routing Solutions


    NOT EVERYONE HAS TIME TO IMPLEMENT A CUSTOM ROUTING SOLUTION—nor should you have
    to. This appendix is dedicated to commercial Linux routing solutions. Sure, there
    are lots of things out there that don’t run under Linux, but we’re assuming that
    if you bought this book you want to specifically look at penguin power first.
    We provide a list of standalone Linux routing solutions, which is followed by
    a list of cards that can be used in implementing routing.


    Inclusion in this chapter does not represent an endorsement by the authors or
    New Riders Publishing.


    # Standalone Linux Routers


    Instead of commenting on product line items that might come and go, what we’ve
    built here is a set of pointers to the companies that currently offer Linux routers-in-a-box.
    Not all of these companies are in North America as you might notice. Linux is
    a wonderfully cross-continent phenomenon; please note, however, that we probably
    missed some companies that didn’t have their web sites in languages we could read
    or at least skim.'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'These companies offer either Linux-based or Linux-compatible routing hardware:


    +   - http://www.rocksolidbox.de/

    +   - http://www.cyclades.com/

    +   - http://www.imagestream-is.com/

    +   - http://www.wholelinux.com/

    +   - http://www.datapro.net/

    +   - http://www.digi.com/

    +   - http://www.equinox.com/

    +   - http://www.stallion.com/

    +   - http://www.eicon.com/

    +   - http://www.emacinc.com/


    # Routing Cards That Work With Linux


    Another area of interest is that of cards you can plug into a Linux box to provide
    WAN interfaces and, in some cases, provide routing processing. If you have to
    have a server with multiple functions, this is one way to reduce the load. The
    routing card could carry its own workload and let the main motherboard handle
    firewalling and any other tasks that you have that particular box handling.


    Vendors that offer routing cards that work with Linux are:


    +   - http://www.sangoma.com/

    +   - http://www.cyclades.com/

    +   - http://www.eicon.com/

    +   - http://www.stallion.com/

    +   - http://www.LanMedia.com/

    +   - http://www.gcom.com/

    +   - http://www.imagestream-is.com/

    +   - http://www.stinc.com/'
