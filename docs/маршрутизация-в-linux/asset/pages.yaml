- pgno: 120
  md: "For the network portion, you specify the IP information for the network in\
    \ question. The rules in this case are either the keyword exact, or the keyword\
    \ refines. These two keywords govern how the network information is interpreted.\
    \ An exact tells gated to interpret network information in the martians statement\
    \ strictly by overall network, ignoring netmasks that are not on class boundaries\
    \ and therefore ignoring subnets. Hosts are also ignored. However, if you use\
    \ refines for rules, the mask and host information is utilized—though in this\
    \ case the mask is implied as a class mask.\n\nA more complex version of this\
    \ format is as follows:\n\n```\nmartians {\n    network mask mask rules;\n}\n\
    ```\n\nHere, the refines option for rules makes more sense. The mask item refers\
    \ to the netmask. An even more refined version is as follows:\n\n```\nmartians\
    \ {\n    network masklen bit_mask rules;\n}\n```\n\nYou might remember discussions\
    \ in Chapter 4, “IPv4 and IPv6 Addressing,” in the beginning of the section, “IPv6\
    \ Math,” where the bit mask was introduced. A Class A bit mask is /8, Class B\
    \ is /16, and C is /24. From there, the bit masks get fancier for subnets and\
    \ IPv6. It’s this value that goes in the bit mask slot.\n\nA martians statement\
    \ doesn’t have to be just one line You can mix and match all of the network definitions\
    \ you see here within the statement. There is also one more item you have access\
    \ to: You can set particular addresses or ranges within a blocked out range as\
    \ valid using the allow option at the end of any of these items. For example,\
    \ the following ignores routing information from the entire class B 192.168.0.0\
    \ except specifically from the Class C subnet 192.168.10.0:\n\n```\nmartians {\n\
    \    192.168.0.0 exact;\n    192.168.10.0 mask 255.255.255.0 refines allow;\n\
    }\n```\n\n# RIP Configuration\n\nEach routing protocol must be individually configured\
    \ in gated. Let’s start with the oldest and simplest one: RIP. Regardless of whether\
    \ you want this router to be able to speak with RIP-1 or RIP-2 routers or not,\
    \ start the RIP configuration section with the following:\n\n```\nrip status\n\
    ```\n\nThe status entry can be one of the following:\n\n+   - no; Do not handle\
    \ RIP traffic.\n+   - off; Do not handle RIP traffic.\n+   - on { Handle RIP traffic.\n\
    +   - yes { Handle RIP traffic."
  merge: -1
  img_proc: true
