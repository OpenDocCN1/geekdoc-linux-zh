- pgno: 76
  md: 'The neighbor sends a Confirm in response, verifying that you is up and running
    and accepts your AS border router as a neighbor. The AS border router then sets
    up a small data list including what was just discussed in the preceding list,
    plus the following:


    +   - **The sequence number assigned to the Confirm.** All Confirm packets contain
    a sequence number, just as the Request packets do.

    +   - **The mode this AS border router is in relative to the machine in question.**
    This router might either be in *active* or *passive* mode at any moment. The mode
    determines how the router responds to Hello and Poll messages. If the router is
    active, then whenever a Hello or Poll arrives it responds with one of the following
    message types: Confirm, I-Heard-You (IHU), or Update. A passive router might respond
    to one of these by entering the Up state, which returns the router to participating
    fully with its EGP neighbors.

    +   - **The time the Confirm message arrived.** This is used to set the zero point
    for three different variables. The first counts how long until the next time this
    machine sends a Request to the AS border router in question. The second counts
    how long the machine waits before sending a Poll. The third maintains a countdown
    for how much time transpires since it last heard from the machine in question—in
    case it is silent too long.


    Your router now changes to the Down state. This state allows for handling the
    commands Cease, Hello, and Request. The new ones here are Cease and Hello. An
    EGP router enters a Cease state in regard to a specific neighbor if it receives
    a Stop command from the administrator. In response to this command, the machine
    first enters the Cease state, and then sends a Cease command out to the specific
    neighbor it is ending its relationship with for the moment.


    There are a couple of different things that can happen at this point:


    +   - **The neighbor receives the Cease command.** If the neighbor is up and running
    just fine, it receives and understands the Cease command. In this case, the neighbor
    sends a Cease-ack command to your AS border router, and then changes to the Idle
    state, ignoring anything but a new Request command from the specific neighbor.

    +   - **The Cease command does not reach the neighbor.** If there are network
    problems, or the neighbor is out of commission, the Cease command may be lost
    in the "great networking bit bucket." In this case, the EGP AS border router remains
    in the Cease state. The router will continue to occasionally send the Cease command
    until it gets a response. The administrator can issue a second manual Stop command
    to override waiting for a Cease-ack and immediately send the machine into Idle
    state relative to this neighbor.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Now, onto the Hello messages and Poll commands. When an EGP AS border router
    receives a Hello message, it sends back an I-Heard-you (IHU or I-H-U) message,
    verifying that it is up and running and received the Hello message. Then there’s
    Poll. Remember that when an EGP AS border router receives a Request command it,
    sets how often Poll commands are sent to the requesting neighbor and then starts
    the timer that counts the number of seconds till the next time it needs to send
    the Poll command.


    When the timer reaches the interval value, the machine sends a Poll command to
    the specified neighbor. When the neighbor receives the Poll command, the response
    depends on what state and mode this neighbor is in. An EGP AS border router ignores
    Poll commands if it is in the Down state or Passive mode. If it is not in this
    state or mode, the neighbor responds with an Update. It is this message that transmits
    actual information about the networks available in each autonomous system. The
    data contained in an Update consist of:


    +   - **All gateways within the AS.** Remember that gateways are devices that
    connect two or more networks.

    +   - **All gateways the router knows about outside of the AS.** This allows for
    a more complete routing table with less querying.

    +   - **All networks available through each gateway.** The AS border router’s
    neighbors need to know where to send information. Your router doesn’t need to
    do as much “thinking” if the neighbors already know to send data directly to a
    specific gateway for a specific network.

    +   - **How many routers and gateways data must pass through to reach each specific
    network from your AS border router.** This information allows for shortest path
    calculations internally within the AS.

    +   - **Each neighbor’s current state.** This information ensures that each of
    the routers know what kind of data each is expecting from the other.


    As you can see, EGP has quite a job to do. Without some kind of method for AS
    border routers to share information, there would have to be a centralized list
    of where to send data for all specific networks. The program under Linux that
    implements this protocol is the unicast version of gated.


    # Border Gateway Protocol (BGP)


    The child of EGP is the Border Gateway Protocol (BGP-4). This protocol has been
    through a number of versions, and the most current is BGP-4. All references to
    BGP in this chapter are to this fourth version. One of the primary issues that
    BGP-4 adds to the mix is that EGP was unable to handle some of IP version 6’s
    capabilities, which are covered in depth in Chapter 4, “IPv4 and IPv6 Addressing.”'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'BGP is another case in which you tell the AS border router who its neighbors
    are, and it has to get the information itself. In the BGP Active state, the AS
    border router opens a TCP connection with the new neighbor. After this connection
    is established, your machine does the following:


    +   - **Sets the ConnectRetry timer to zero.** This timer typically counts from
    zero to 120 seconds. If it reaches this value, the AS border router assumes its
    TCP connection was lost and tries to reassert it.

    +   - **Creates the framework within which BGP will store information about this
    new neighbor.** This framework includes creating all of the variables that need
    to be set.

    +   - **Sets the Hold Timer to four minutes.** This timer sets how long the system
    waits between regularly exchanged messages before closing the connection with
    its neighbor.


    After this, a sequence of messages passes between the two machines. First, your
    machine sends an OPEN message to the neighbor. This message contains:


    +   - **The BGP version number.** We''re talking about BGP-4 here.

    +   - **The sender''s AS number.** As mentioned earlier, every autonomous system
    has a unique identification number assigned by a central authority.

    +   - **The setting to use for the Hold Timer.** If the two AS border routers
    have different settings, they agree upon the shorter time span of the two. If
    the Hold Timer value already set does not match the new choice, it is reset to
    match.

    +   - **The IP address of the sender.** This is also referred to as the BGP Identifier.


    When the neighbor receives this message, it stores the information given and returns
    a KEEPALIVE message back to your machine. When the KEEPALIVE message arrives,
    the Hold Timer is reset back to zero. From then on, KEEPALIVE messages pass back
    and forth at a rate of around one-third the length of the maximum Hold Timer time.
    It is the absence of these messages for the entire Hold Timer length that tells
    a machine that its neighbor is unavailable.


    Finally, your AS border router changes to the OpenSent state relative to this
    neighbor. Here is where the machine waits for an OPEN message. It needs to receive
    one of these from its neighbor even though they have a connection because it''s
    the only way to get the basic information about this neighbor. After the message
    arrives, the BGP AS border router ensures that the values it might already have
    for this neighbor are the same as given in the OPEN message. If not, they are
    updated.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'exchange UPDATE messages. These messages contain different information depending
    on their purpose. For example, an UPDATE message advertising a new route contains:


    +   - **The ORIGIN Type code.** This code tells BGP whether the route it''s dealing
    with is inside the AS that the UPDATE message came from or from outside of it.
    AS border routers do share information about paths outside of their control as
    well as internal paths.

    +   - **The AS_PATH segment type.** This code specifies whether the list of autonomous
    systems the new route information passed through to get to this AS border router
    is in a specific order or unordered.

    +   - **The ASs that this route information passed through.** The ordered or unordered
    list of AS numbers.

    +   - **The IP address for the AS border router this one must send data to get
    packets to the specified new route.** This is called also the Next Hop attribute.

    +   - **The number of bits in the following IP address portion.** Because routing
    is done for networks and subnetworks, not individual IP addresses, the information
    sent between AS border routers is a collection of IP address prefixes or the portion
    of the address that identifies the network or subnetwork in question.

    +   - **The IP prefix that identifies the network or subnetwork to which this
    route applies.** This prefix has to end at one of the dots in the IP address.
    If the definition applies to 192.14.14.51, and it''s a full unsubnetted class
    C network, the entry would be 192.14.14.


    There can be only one new route per UPDATE message. However, BGP can withdraw
    as many existing routes as it likes in the same UPDATE message. Each of these
    route withdrawals includes all or part of the following information:


    +   - **The total length of the withdrawn routes section.** This item ensures
    that there is no confusion from section to section, given that withdrawn routes
    can be any length. A zero means that there are no routes to remove.

    +   - **The number of bits in the IP address portions.** Once again, the information
    sent between AS border routers is a collection of IP address prefixes, or the
    portion of the address that identifies the network or subnetwork in question.

    +   - **The IP prefix that identifies the network or subnetwork to which this
    route applies.** Again, the prefix has to end at one of the dots in the IP address.

    +   - **The total length of the Path Attributes section.** Once again, including
    this information avoids misread data.


    How does the BGP AS border router decide about which routes to notify its neighbors?
    Each of these machines has a Policy Information Base (PIB) containing rules that
    the administrator sets by hand. Each machine also has a set of separate databases,
    each with a specific function. All of the routes this router is aware of are listed
    in its Adj-RIB-In database. Routing Information Base (RIB) is another term for
    the routing'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'table. The BGP AS border router takes its PIB and applies the rules to every
    route in Adj-RIB-In. Anything that fits the rules is copied to the Adj-RIB-Out
    database.


    One piece of data calculated using the PIB rules is the preference rating for
    each particular route. After this information is put together, the BGP AS border
    router looks at each destination it has routing information for and chooses the
    best route to each according to its PIB rules and preference ratings. The best
    routes are all stored in the Loc-RIB database.


    There is still one more chunk of processing to do. Keep in mind that these databases
    are maintained from moment to moment. Each time new information goes into Adj-RIB-In
    or Loc-RIB, there''s a trickle-down effect. Adj-RIB-Out relies on both of these
    databases and so must change whenever one or both of them does. Adj-RIB-Out is
    trimmed further than Loc-RIB in some BGP implementations. Duplicate routes are
    removed from this version of the database so that there is only one way for data
    to get from point A to B. This ensures that the databases don''t get too large
    or redundant. Whenever there is a change to Adj-RIB-Out, that change is sent as
    an UPDATE message to the BGP neighbors.


    Perhaps now you have an idea of why BGP is preferred over EGP in many situations.
    It is simply a smarter protocol with more internal checks and balances for route
    tuning. The programs under Linux that implement this protocol are zebra and the
    unicast version of gated. Once again, BGP is a unicast border protocol.


    # Border Gateway Multicast Protocol (BGMP)


    Multicast protocols need AS border router attention too. This section deals with
    the Border Gateway Multicast Protocol, or BGMP. BGMP comes with the capability
    of building multicast group trees in the style of PIM-SM, where only group members
    belong to the tree at any given time. However, these trees don''t consist of individual
    routers. Instead, each tree has only BGMP border routers as members. Once this
    tree is built, some domains build their own internal trees from there, depending
    on the protocol they are using.


    The multicast domain advertising the availability of a specific range of multicast
    channels is considered the root for that range. Remember that multicast channels
    each consist of a single class D Internet address, which range from 224.0.0.0
    through 239.255.255.255. So, perhaps our AS has the range of multicast channels
    from 231.15.19.120 through 231.15.19.140. BGMP would consider our AS the root
    domain for that range.


    When a user joins a multicast group outside their domain or AS, their request
    is passed to the BGMP router. This router looks up the address for the router
    handling the root domain containing this particular channel. Once the BGMP router
    knows which domain to send the request to, it generates a BGMP UPDATE message
    containing the following information:


    +   Address prefix. This prefix tells BGMP the length of the included netmask.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '+   - **Address family, protocol family, or protocol suite—these all refer
    to the same thing.** The type of networking protocol collection that this packet
    was meant to travel on. For the purposes of this discussion, let’s assume that
    you’re using an Internet-like network, and on it you’re using TCP/IP.

    +   - **Address.** The multicast address this UPDATE message refers to.

    +   - **Netmask.** The netmask associated with the multicast address included
    in this UPDATE message.

    +   - **JOIN message declaration.** This parameter specifies that this UPDATE
    message is in fact a JOIN message.

    +   - **Additional declarations.** A BGMP UPDATE message can carry multiple message
    types. In this case the primary attribute is JOIN. So, this message also could
    serve the function of GROUP, SOURCE, or POISON_REVERSE. Inside these, you could
    nest even more JOINs, PRUNEs, and so on.


    The BGMP router now looks in its tables and sends this UPDATE message to the router
    that will take it one step closer to the multicast root domain. The receiving
    router looks to see whether it already has an entry that tells it to forward data
    for this multicast group to the requesting router. If it doesn’t, it creates this
    entry and sends the packet to the next closest BGMP router. This router looks
    to see whether it’s already forwarding data from this group to the requesting
    domain. If not, it creates an entry to do so and continues. This process follows
    along the tree from router to router until the UPDATE message reaches the root
    domain.


    Eventually, users leave. When a user disconnects from a multicast channel that
    is broadcast from outside its domain, the BGMP router is notified. This router
    first looks to see whether it has any other group members within its domain. If
    not, it generates an UPDATE message that is different from the JOIN message in
    one simple fact: Rather than having a bit set to tell the UPDATE it’s carrying
    JOIN information, there’s a bit set telling it that this UPDATE message carries
    PRUNE information.


    The UPDATE message is sent along using the same pattern as a JOIN UPDATE message
    would use. It’s sent hop by hop along the shortest path to the root domain. Each
    router along the way sees if it is serving any other members of this multicast
    group. If it is, the UPDATE message stops, and there is no need to send it along.
    However, if this was the only destination requesting data from that group, the
    UPDATE message advances further down the tree.


    Along with changing multicast group memberships, BGMP routers also have to deal
    with changes in the overall multicast routing tables. Over time channels are added
    and removed as transmission content is retired and new players emerge.


    BGMP is in many ways related to BGP but, as you can see, has features that allow
    it to work well in conjunction with multicast transmissions. The programs under
    Linux that implement this protocol are zebra and the multicast version of gated.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Multicast Source Discovery Protocol (MSDP)


    Another multicast border router protocol is the Multicast Source Discovery Protocol
    (MSDP). This particular protocol can only be used to connect domains that also
    use PIM-SM internally. You might find it helpful to review the section, “Protocol
    Independent Multicast-Sparse Mode (PIM-SM),” in Chapter 2, “Multicast Protocols,”
    before proceeding. This protocol also utilizes the BGP routing tables rather than
    building its own for unicast data.


    MSDP routers keep a continuous connection open to their neighbors, or peers, using
    TCP. A KeepAlive timer is used to check whether KeepAlive messages arrive within
    specified intervals, though these messages are not sent unless no Source-Active
    (SA) messages have arrived within the KeepAlive requirements. If the interval
    is exceeded with no KeepAlive or SA messages having arrived, the peer tries to
    reset the TCP connection.


    The developers of MSDP did not feel the need to reinvent the wheel. PIM-SM and
    MSDP utilize the already existing PIM-SM Rendezvous Point (RP) setup to speak
    to one another. Whenever a new source starts broadcasting and this information
    reaches an RP, the machine creates an SA message containing the following information:


    +   - The IP address of the machine originating the broadcast

    +   - The multicast channel address to where the data is being sent

    +   - The IP address of the Rendezvous Point that handles this channel


    This message is then sent to the MSDP border router. After the SA message is received,
    it is forwarded to all of the border router’s MSDP neighbors except for the machine
    it received the message from—this is called peer-RPF flooding. When each peer
    receives the SA packet, it checks to see which of its neighbors is the RPF peer
    for this particular multicast channel. The RPF peer is the MSDP router closest
    to the MSDP router that sent the original SA message, which we’ll call the SA
    originator.


    The router double-checks any SA message against the RPF peer to avoid loopback
    problems. If the SA message came from a machine that is closer to the SA originator
    than this router is, but is not the RPF peer, the SA message is ignored. Other
    than this, the MSDP router sends the SA message out to all of its peers—namely,
    those that are not closer to the SA originator than it is.


    This process continues throughout the entire Internet, as long as there are more
    MSDP peers to talk to. Another thing that each MSDP peer has to examine is whether
    or not it’s also a PIM-SM Rendezvous Point for its domain. If this machine serves
    both purposes, it checks to see if any of its own domain members have requested
    access to this new channel. Even one request causes this MSDP/PIM-SM RP to send
    a Join request to the channel’s RP. Doing this creates the odd situation where
    the tree for this particular channel reaches out of its local domain.


    As you can see, this protocol is fairly straightforward because it’s able to rely
    on BGP for routing tables and PIM-SM for tracking group memberships. The Linux
    program that implements this protocol is the multicast version of gated.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Summary


    Along with the IGPs that you must consider for use within your autonomous system
    or your portion of it, the overall network administrator also needs to look at
    the border protocols available and choose which best fits his or her particular
    situation. This chapter looked at the unicast border protocols, EGP and BGP, and
    the multicast protocols, BGMP and MSDP. Most administrators choose BGP over EGP
    today simply because BGP has more modern features and is more robust because of
    it. When it comes to choosing BGMP over MSDP, the right choice depends on whether
    you’re using PIM-SM or not, as MSDP is optimized for PIM-SM.


    Table 3.1 outlines the border protocols available to you and the data you’ll need
    to get started.


    Table 3.1 The Programs Used to Implement Unicast and Multicast Border Routing
    Protocols in Linux, and the RFC Documents That Contain Vital Background Information


    | Protocol | Program | RFC or Draft |

    |---|---|---|

    | EGP | gated | 904 |

    | BGP | gated, zebra | 1771 |

    | BGMP | gated, zebra | draft-ietf-bgmp-spec-01.txt |

    | MSDP | gated | draft-ietf-msdp-spec-06.txt |'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_84_0.png)


    # IPv4 and IPv6 Addressing


    LINUX NATIVELY USES TCP/IP AS ITS SUITE OF NETWORKING PROTOCOLS AND TOOLS. One
    aspect of this collection of rules and programs is that every machine on the network
    must have a unique value or address assigned to it according to the IP addressing
    scheme. Most of us are already aware of this and have experience assigning addresses
    in both the Internet and private network spaces. If this is the case for you,
    then feel free to either skip this chapter or jump straight down to the section
    titled "Classless IPv4 Addressing" and "IPv6 Addressing."


    However, if you''ve never had to deal with more than just basic static TCP/IP
    networking with no subnetting, you''re venturing into complex networking territory.
    Let''s make sure that you have all of the knowledge you need at your disposal.


    # IPv4 Addressing


    Over the years, we''ve all gotten comfortable with good old IP version 4. IPv4
    is based on 32-bit host addresses. Addresses are first broken down into the classes
    A, B, and C, with D kept aside for multicast channels. The address class determines
    how many bits in the IP address apply to the network number and how many apply
    to the host number. All subnets made of these networks are of equal size and so
    on. Each new thing you learn about working with IP v4 lets you add more levels
    of complexity to your networking setups.'
  merge: -1
  img_proc: true
