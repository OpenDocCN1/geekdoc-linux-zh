- pgno: 48
  md: '# Open Shortest Path First (OSPF) 29


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_48_0.png)


    From Arts, the data goes to Math, and then to Abacus. This time, however, Abacus
    isn''t on the fastest path. This path gets fairly skewed as each machine builds
    its own tree. Now that things are working so nicely, let''s throw the usual wrench
    in the works. What if our infamous router Arts goes down as it did in the RIP-1
    discussion? We''ll use the same three scenarios as we did before to bring home
    the differences in robustness between RIP-1 and OSPF:


    +   - Scenario 1: Router Arts was intentionally removed. It had a critical failure,
    and there is no backup router available to take its place for a week.


    All routers running OSPF regularly—once per HelloInterval setting—make use of
    the HELLO protocol. This separate communications protocol is used exclusively
    to connect to the neighbor OSPF routers (those directly connected to the router
    in question) and to keep that connection going in both directions. The HELLO protocol
    accomplishes this by using HELLO packets. These special data packets contain introduction
    information about this router and the costs for traveling through its interfaces,
    as well as the names of the neighbors of which it is aware.


    Arts''s neighbors (Hum, Eng, and Math) are all happily sending out their HELLO
    packets and receiving them in turn. However, they begin to notice that they are
    not getting anything from Arts within the set HelloInterval time, which is advertised
    within the HELLO packets. If they do not hear from Arts within the RouterDeadInterval
    time after the first missed HELLO packet, the neighbors declare that router unavailable.
    It won''t be long, then, before all of Arts''s neighbors give up on Arts.


    When Hum, Phys, and Math give up on router Arts, they each calculate brand new,
    fastest, shortest path trees with this gaping hole taken into account. No one
    needs to tell them anything. They can do this all themselves. Thus, where Hum
    previously had the tree shown in Figure 1.23, it now has the one shown in Figure
    1.25. The other two also calculate new trees.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_49_0.png)


    # Figure 1.25 Hum''s new path tree when Arts goes down.


    As Hum, Phys, and Math send HELLO packets to their neighbors, those neighbors
    are going to notice the absence of Arts in those packets. They write off Arts
    as well, and each rebuilds its own tree.


    +   - Scenario 2: Router Arts was intentionally removed. It is not going to be
    replaced with anything else.


    While this example was a significantly different issue in the RIP-1 section, it
    is not here. There is no need for administrators to tell the other routers that
    Arts is gone. They will all figure this out pretty quickly on their own and build
    new routing tables, as discussed in Scenario 1.


    +   - Scenario 3: The connection Arts uses to access the network went down temporarily,
    isolating this router, the machines on its own network, and any networks that
    it was supposed to pass data to from everyone else. This connection stays down
    for three hours.


    At first, this situation behaves as it did in Scenario 1. The fact that there
    is no router Arts ripples through the network just fine on its own. When the router
    comes back up, however, you''ll see another big difference in how RIP-1 handled
    the scenario.


    The moment router Arts comes back up, it sends out a broadcast of HELLO packets.
    All of the neighbors (Phys, Hum, Eng, and Math) get this broadcast and respond
    to Arts. Then, when these neighbors send out their HELLO packets to others with
    a list of their neighbors, more of the network sees Arts, and so on. No human
    intervention necessary.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# OSPF and Authentication


    One thing to keep in mind here is that all the routers in the area use the same
    authentication scheme. Every area has to use the same scheme throughout, though
    from area to area different levels can be used within the same AS. This is a handy
    way to break up the network into more and less secure areas, something that works
    especially well in conjunction with other security methods.


    OSPF IP packets also have to pass a checksum test, meaning that the packet contains
    a count of how many bits were included when it was sent, and the router that receives
    the packet makes sure it has this same number of bits. Consequently, if the packet
    were either damaged or altered, it would not be accepted.


    One problem with OSPF''s implementation is that if someone can get access to a
    connection to one of the lines between your routers, they can set up a packet
    sniffer—a program that is used to take a look at the data traveling through a
    network—to listen for anything meant for a specific address and actually grab
    a copy of your password. Even with the checksum test, OSPF''s authentication is
    not sophisticated enough to protect against this kind of intrusion.


    If you take a glance back at Figure 1.23, you''ll see that this overall system
    consists of two areas within an AS. This changes the dynamics of the area we''ve
    been talking about, so let''s discuss that first before we get into the bigger
    picture. Router Phys is the designated router, also called the border router because
    it has interfaces in both this area and another. This means that router Phys is
    considered adjacent, or a neighbor, to every router in the area. Every router
    sends HELLO packets to Phys, and Phys answers them all. This ensures that Phys
    always has the big picture of what''s going on in its area.


    Now, consider the bigger picture. Figure 1.26 lays out the second area (the dormitories
    [names abbreviated], which are also networked in the overall campus structure)
    that router Phys is attached to, and Figure 1.27 shows the fastest, shortest path
    tree that router East comes up with. First, I need to adjust my vocabulary here.
    The term router Phys so far has referred to a single machine because you didn''t
    know it had additional area interfaces. Phys actually refers to the Ethernet card
    that directly connects to the campus Area. East refers to the Ethernet card that
    directly connects to the dorm Area.


    The tree for each area is stored separately, and router Phys/East actually runs
    two copies of the OSPF software for each area. OSPF packets are all marked with
    an area ID of area they came from, so they don''t leak across a border by accident.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Figure 1.26 The other area in the AS, where router East is the other interface
    on router Phys.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_51_0.png)


    # Figure 1.27 Router East''s OSPF tree.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_51_1.png)


    Stepping back even farther, there must be a way available for data to move in
    and out of the AS. This requires at least one—preferably more than one—AS boundary
    router. I''ll be a bad network administrator here and add a single AS boundary
    router to our image, shown in Figure 1.28.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_52_0.png)


    # Figure 1.28 The AS complete with its AS boundary router.


    This AS boundary router is actually going to receive route advertisements from
    the outside world as well as send route advertisements to the outside world. These
    are referred to as external link advertisements. External routing information
    is shared with all of the routers in the AS with one of two different types of
    costs:


    +   - Type 1. An extension of the path algorithm outside of the AS. Costs for
    each leg of the path are taken into account exactly.

    +   - Type 2. Another type of path extension, except that additional costs are
    added such that an external path always costs more than any internal path.


    The thing to realize is that Phys and East are not designated routers for their
    Areas because they were somehow born or destined to be designated routers. The
    HELLO protocol actually elects both a designated and backup designated router.
    You can stuff the ballot box, though, by giving the specific interface connecting
    the router to that area a higher priority than the others. If you have two routers
    connected to the outside world—as you should—then you weight the other one high
    enough to make it the backup designated router automatically.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Each area in your AS must be internally consistent in its behavior. While I
    have mentioned some of these values before, a full list of all of the settings
    that must be identical among all routers in an area—or in the case of an area
    border router, among all router interfaces in an area—are shown in Table 1.4.


    # Table 1.4 OSPF Router Settings that Must Be Identical with an Area


    | Setting | Purpose |

    |---|---|

    | Area ID | The identification value set for the particular area |

    | Backup Designated Router | The IP address for the interface leading to the backup
    designated router |

    | Designated Router | The IP address for the interface leading to the designated
    router |

    | Type | The kind of network the interface points to: broadcast, non-broadcast,
    point-to-point, or virtual link |


    Now let''s drill down a bit farther. You also need to be internally consistent
    for your networks. If you have more than one router attached to a network, which
    can be a good idea for redundancy reasons, there are certain settings that must
    be identical for each of the routers attached to that network. The settings I''m
    talking about here are listed in Table 1.5.


    # Table 1.5 OSPF Router Settings that Must Be Identical for Networks


    | Setting | Purpose |

    |---|---|

    | HelloInterval | The number of seconds an OSPF router waits before it sends out
    its next HELLO packet |

    | Network Mask | The netmask for this network, or 0 for an unnumbered point-to-point
    network or a virtual link |

    | RouterDeadInterval | The number of seconds an OSPF router waits since the last
    HELLO packet before it declares a router dead |


    # HELLO Packets and Network Type


    The infamous OSPF HELLO packet behaves differently depending on the kind of network
    you place it on. If you choose a non-broadcast network, then all of the OSPF routers
    on that network need a list of their neighbors and their ranking in case of a
    designated router election. On other network types, this is not necessary.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Drilling down farther still, we get to the OSPF router''s routing table. This
    table contains:


    +   - The IP networks, subnets, and hosts that this destination can forward information
    to.

    +   - The netmask when the destination points to a network or subnet or 0xffffffff
    if the destination is a host.

    +   - The Type of Service (TOS) that should be sent along this route. OSPF is
    capable of routing data differently depending on its TOS setting.

    +   - One of four path types used to send data to this destination: intra-area
    (within the same area), inter-area (to another area within the same AS), type
    1 external, or type 2 external.

    +   - The full cost to send data to this destination, as determined by adding
    the interface costs along the way.

    +   - If the path is type 2 external, the routing table also contains the cost
    for sending the data outside of the AS.

    +   - If there are two paths to the same destination with equal costs, the table
    actually stores the information for both paths in a single entry. In addition
    to the standard information, there is also the interface to send data out for
    the next router that can pass the data on to the destination and the IP address
    of that neighbor. If the destination is in another area or AS, the router ID of
    the router that data must pass through to get to the destination is included as
    well.


    Finally, the question arises of how all of this data travels between the areas,
    making the AS a unit unto itself. Just as the Internet is said to have a backbone,
    an AS has one of its own. The AS backbone consists of area border routers, AS
    border routers, and networks and routers that don''t exist in an area at all.
    It is essentially an area of its own, even though it passes through others.


    Like a spinal cord, an OSPF AS backbone must be all in one piece to function properly.
    When two backbone routers are not connected directly by cables, you can connect
    them using a virtual link in the area border routers. You must create this link
    in both routers, which will then pretend to have a point-to-point connection between
    them. The cost for traveling through this connection is the sum of the costs for
    the real path that the data must take.


    As you can see, OSPF is a much more advanced routing protocol than that of the
    RIP-1 family. It deals with changes in routing structure quickly and efficiently
    and increases network reliability. The programs used to implement OSPF under Linux
    are the multi-protocol daemons gated or zebra.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Summary


    The unicast routing protocols you''re most likely to use in large, subnetted or
    multi-network networks in Linux are RIP-1, RIP-2, and OSPF. RIP-1 is the oldest
    of TCP/IP routing protocols still used on the Internet. As such, it is also the
    least flexible and only really good for small networks. RIP-2 is a bit newer and
    more secure, and while it is really not any better for larger networks, is a wiser
    choice than RIP-1 in many situations. Finally there is OSPF which is more robust.
    If your network tends to change or you have problems with machines going down,
    you''re better off to choose this option. Don''t forget static routing either!
    For really small LANs (10 machines or so) or subnets, this might be sufficient.
    Table 1.6 lists pertinent data for each of the protocols that might be of interest
    to you.


    Table 1.6 The Programs Used to Implement Unicast Routing Protocols in Linux, and
    the RFC Documents that Contain Vital Background Information


    | Protocol | Program | RFC |

    |---|---|---|

    | RIP-1 | routed, gated, or zebra | 1058 |

    | RIP-2 | gated or zebra | 1721 |

    | OSPF | gated or zebra | 2328 |


    One excellent place to read Request for Comments (RFCs) is http://www.faqs.org/.
    If you are a programmer and find that you have a hard time understanding how some
    things work until you can pour over some code, then go to http://www.packetfactory.net/
    and examine their libnet project''s code. There are features in there for handling
    RIP-1 and OSPF.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_56_0.png)


    # 2


    # Multicast Protocols


    A MULTICAST ROUTING PROTOCOL TAKES ADVANTAGE of multicast networking to broadcast
    information to an IP address (channel or group) to which any computer with multicast
    access can listen. When a router supports multicast protocols, it may or may not
    need to be aware of who is listening at any given time. It depends on how far
    your multicast channel reaches and which protocol you chose.


    This chapter discusses background information for a number of commonly used multicast
    routing protocols. Use this information to make educated decisions about which
    protocols you want to use to manage your own networking needs.


    # Routing Information Protocol Version 2 (RIP-2)


    No, your eyes don’t deceive you. RIP-2 is in both the unicast and multicast sections.
    You can configure routers using this routing protocol to send out occasional updates
    to a multicast address—by default to 224.0.0.9. In fact, RIP-2 has four settings
    you can use to direct its behavior in the multicast and other realms:


    +   - None. Disables all RIP-1 messaging.

    +   - RIP-1. Tells RIP-2 to behave as though it were its predecessor.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   - **RIP-1 Compatibility.** Tells RIP-2 to broadcast its updates directly
    to the other routers, taking into account those that need RIP-1 formatted data.

    +   - **RIP-2.** Ignores RIP-1 issues and uses multicast to send updates.


    None of these options, however, actually deals with multicast data aside from
    the protocol''s own updates.


    # Multicast Open Shortest Path First (MOSPF)


    The Multicast Open Shortest Path First (MOSPF) protocol is a version of OSPF that
    allows for efficient routing of multicast packets (as well as unicast packets)
    within an autonomous system. This implementation merges both OSPF and the Internet
    Group Management Protocol (IGMP), which handles multicast group memberships. Even
    better, it keeps the best capabilities of all, including using the OSPF authentication
    scheme.


    MOSPF tracks who is currently a member of a multicast group using the same type
    of back and forth querying used by the HELLO protocol. Every MOSPF router calculates
    its own trees. Notice the plural on "trees." Each router calculates a separate
    tree for each source/destination pair. This tree reaches from the source, through
    the router, all the way out to the networks that contain members.


    Stop and think for a second what this might mean. If MOSPF routers calculated
    trees for all existing multicast sources and groups in your autonomous system
    ahead of time, your MOSPF routers would be so busy calculating that they would
    be useless for directing traffic.


    Instead, no tree is calculated until multicast data actually needs to travel from
    a source/destination pair that no tree exists for yet. Because multicasting is
    designed to deliver data to all group members, its packets (datagrams) drop off
    copies for each group member as they travel the shortest path. However, the tree
    is not unique to each router—as it is in OSPF. Instead, the tree''s trunk is at
    the router from where the data came, and all of the routers receiving and passing
    on the data use that same starting point for their tree. So, all routers dealing
    with this data are using the same shortest path tree, even though they each calculate
    it themselves.


    > **Handling Ties When Building Trees**

    > If there is a tie between paths that have equal costs, load balancing is not
    used. Various MOSPF implementations have specific ways of choosing which branch
    to use for the fastest, shortest path tree.


    Interestingly, you can mix OSPF and MOSPF routers within OSPF areas and even spread
    them throughout autonomous systems. To do this there just needs to be a contiguous
    set of routers capable of multicasting so the data can travel where it needs to
    go.


    The program used to implement MOSPF is mrouted. There are also adjustments you
    need to make so the router is fully multicast-enabled. See Chapter 6, "Inside
    the Multicast Kernel 2.2.x Daemons," for coverage on how to accomplish this.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Distance Vector Multicast Routing Protocol (DVMRP)


    The Distance Vector Multicast Routing Protocol is a child of the original RIP-1
    and for use only within a single autonomous system. It does not actually handle
    unicast data. If you want to use DVMRP, you also will have to use another protocol
    to handle unicast information. All of the unicast protocols discussed earlier
    are viable.


    This protocol is still considered experimental, so it is likely to change in some
    ways.


    Do the following to see if there is a newer version of this coming standard available:


    +   1. Go to http://www.ietf.org/.

    +   2. Follow the Internet-Drafts (I-D) link.

    +   3. Follow the I-D Keyword Search link. This will allow you to do a search
    for the draft rather than having to wade through the hierarchal index.

    +   4. Enter dvmrp in the text box and then click Search. One of the results has
    the title Distance Vector Multicast Routing Protocol. This is the document you''re
    looking for. If the version is newer than draft-ietf-idmr-dvmrp-v3-10.txt, it
    is worth taking the time to look for differences within that document from what
    is discussed here.


    # The Algorithms: Introduction


    DVMRP used to be made up entirely of the Truncated Reverse Path Broadcasting (TRPB)
    algorithm, which is a refinement of the Reverse Path Broadcasting (RPB) algorithm.
    Today, TRPB is only used for the first packet in a series of multicast data. Further
    packets are directed utilizing Reverse Path Multicasting (RPM), a more refined
    tree-building algorithm grown from both TRBP and RPB. This method should feel
    somewhat familiar because it includes the distance-vector style building of data
    paths used in RIP-1 (as you might have guessed from the protocol''s name). In
    fact, the algorithm is similar to the Bellman-Ford algorithm you already know
    and love if you read Chapter 1, "Unicast Protocols." It is simply enhanced to
    take into account the unique requirements of transmitting multicast data as opposed
    to unicast data.


    # The Danger of Acronyms


    If you''re familiar with Red Hat Linux or its relatives, you probably immediately
    think of RPM as the Red Hat Package Manager. You might even think of RPM in terms
    of Rotations Per Minute or another representative value. In this chapter, whenever
    you see RPM, we are referring to Reverse Path Multicasting. Because this book
    is distribution neutral, you can generally assume that references to RPM throughout
    mean this as well. Where they do not, we will make it clear, though the context
    should be sufficient to clarify the usage in many cases.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# The Algorithms: Truncated Reverse Path Broadcasting (TRPB)


    No tree-building algorithms are used in DVMRP until a data transmission starts.
    In fact, if data has gone out to this multicast channel before, you skip this
    tree-building process completely. See the first "How It Works" section that follows
    for information on how DVMRP maintains an up-to-date tree after it''s built.


    When a multicast provider begins sending packets, the TRPB algorithm goes to work.
    Let''s say that you are multicasting a radio show from a new machine that uses
    Emerald as its router. First, you need to know which of the routers in your autonomous
    system support multicast data. In the example network—now pulled together for
    your easy viewing in Figure 2.1—the following routers are multicast-capable: Prime,
    Emerald, Chem, Math, Arts, Phys/East, Runk, Trud, and Poin.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_59_0.png)


    Figure 2.1 The autonomous system with the multicast routers identified.


    The moment that Emerald receives the first packet from Radio Show meant for its
    new multicast channel, TRBP gets some help from IGMP, the multicast group management
    protocol discussed earlier. TRBP now delivers the first packet from this new machine
    to emerald. Emerald immediately passes the packet to East and Chem, and it continues
    from there to all of the multicast routers (I''ll discuss how they get there without
    a direct connection in the "How It Works" section).'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'As this packet reaches each router, the machine goes IGMP with the multicast
    channel address to find out which of its networks and subnetworks contain group
    members. The first packet is only forwarded to networks and subnetworks that contain
    group members. Let’s say for example that router Math has the structure behind
    it shown in Figure 2.2.


    ![](img/5f0cc5444dfa57f5c5cc6a7830396eaa_60_0.png)


    # Figure 2.2 The networks served by router Math, with multicast group members
    circled.


    IGMP fits in when this first packet of data from the new source arrives at router
    Math or one of its siblings. This router utilizes IGMP’s group management data
    to find out which of the (sub)networks actually contains group members. In the
    example, networks I and III have at least one member, so the packet is sent to
    these networks. Network II is broken into subnets, however, not all of which contain
    group members. For III, the multicast packet is sent only to subnet 1.


    The TRPB tree is built during this decision-making process. This tree might now
    look like what you see in Figure 2.3. Remember, this is a distance vector algorithm,
    so the path to each data point is predicated on how far it has to travel.'
  merge: -1
  img_proc: true
