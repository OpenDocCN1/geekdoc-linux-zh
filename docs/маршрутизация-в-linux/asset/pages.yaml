    \      0      0 *:sunrpc                 *:*                     \n350/portmap\n\
    raw       0      0 *:icmp                   *:*                     7\n.\nraw\
    \       0      0 *:tcp                    *:*                     7\n\nActive\
    \ UNIX domain sockets (only servers)\nProto RefCnt Flags       Type    State \
    \      I-Node PID/Program name    Path\nunix  0    [ ACC ]     STREAM  LISTENING\
    \   470    527/lpd              /dev/printer\nunix  0    [ ACC ]     STREAM  LISTENING\
    \   570    645/xfs              /tmp/.font-unix/fs-1\nunix  0    [ ACC ]     STREAM\
    \  LISTENING   527    586/gpm               /dev/gpmctl\n```\n\nThere are a few\
    \ lesser-used parameters for netstat, but they are used seldom and often overlap\
    \ the information shown. For those reasons, they’ve not been covered here."
