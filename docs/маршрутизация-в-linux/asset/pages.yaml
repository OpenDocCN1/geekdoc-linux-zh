- pgno: 44
  md: 'Notice that you''re in a dead heat in the costs for going from Arts to Eng
    and Arts to Math. While this doesn''t affect issues such as where the data''s
    going, it does cause the problem of determining the central fastest path. This
    central path is used to determine which router gets the priority as the algorithm
    goes through its motions. Items on the fastest path get to go through their iterations
    first, which is why certain points result in dead ends.


    How do we then resolve this dead heat? OSPF uses a technique called load balancing
    to handle such an issue. It literally decides to use both paths alternatively
    in order to attempt to get the fastest possible data flow. This, however, does
    not help us with the algorithm itself. To get to the fastest, shortest path and
    to break the tie, we choose the point with the least number of routers to pass
    through to get to the rest of the world, which is seven (shown in Figure 1.20).


