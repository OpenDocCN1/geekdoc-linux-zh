    The define statement itself is used in the format define address, where address
    is the IP address for this interface. See Table 5.7 for a list of the options
    you have available within define.


    **Table 5.7 Values Available in the gated.conf define Portion of the interfaces
    Statement**


    | Option | Purpose | Format | Value(s) |

    |---|---|---|---|

    | broadcast | Tells gated that the interface can handle broadcast messages—both
    Ethernet cards and Token Ring cards can do this—and what address to use. | `broadcast
    address` | The broadcast IP address this interface has access to. |

    | multicast | Tells gated that the interface can handle multicast traffic. | `multicast`
    | N/A |'
