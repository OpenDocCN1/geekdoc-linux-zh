    back at Tables 4.7 and 4.8. Every network address listed there falls within one
    of these two major subnets’ available address ranges. Therefore, every network
    address in the campus and dorm buildings can be sent just to the main router,
    then to just the campus or dorm router, then to the appropriate building, and
    then directly to the correct machine.


    In each case, only the router above the subnet layer needs to know that there
    are subnets involved at all. This is a good example of route aggregation, a term
    mentioned earlier. It is also the key to CIDR success. The more routing information
    that we can keep hidden at local levels, the smaller the overall routing tables
    need to be.


