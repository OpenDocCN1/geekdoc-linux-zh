  ### finger\n```\nName        Tty      Idle  Login Time   Office Phonekali      kali\
  \       tty7       39  Aug 16 06:22 (:0)\n```\n如果无法使用此命令，说明你的系统中默认没有安装它。如果你正在使用\
  \ Ubuntu 或 Debian，请使用以下命令来安装 `finger` 命令：\n```bash\nsudo apt-get install finger\n\
  ```\n\n### uname\n`uname`:此命令用于提供有关操作系统的信息。\n`uname [argument]`\n当不带任何参数使用使用时，它只会打印内核名称。\n\
  ![](img/Image00027.jpg)\n`uname -v`: 打印内核版本。\n```bash\nuname -v#1 SMP Debian 5.4.13-1kali1\
  \ (2020-01-20)\n```\n`uname -m`: 打印机器硬件名称。\n```bash\nuname -mxx86_64\n```\n`uname\
  \ -o`: 打印操作系统名称。\n```bash\nuname -oGNU/Linux\n```\n`uname -n`: 打印网络节点主机名。\n```bash\n\
  uname -nkali\n```\n`uname -r`: 打印内核发布日期。\n```bash\nuname -r5.4.0-kali3-amd64\n```\n\
  `uname -a`: 获取有关操作系统的所有信息，配合 `uname` 使用 `-a` 参数。\n```bash\nuname -aLinux kali 5.4.0-kali3-amd64\
  \ #1 SMP Debian 5.4.13-1kali1 (2020-01-20) x86_64 GNU/Linux\n```\n`Linux` 是内核名称。\n\
  `Kali` 是网络节点主机名。\n`5.4.0-kali3-amd64` 是内核发布日期。\n`#1 SMP Debian 5.4.13-1kali1 (2020-01-20)`\
  \ 是内核版本。\n`x86_64` 是机器硬件名称。\n`GNU/Linux` 是操作系统。\n\n### passwd\n`passwd`:passwd 命令用于更改用户账户的密码。\n\
  `passwd [arguments] [user_name]`\n在更改时，必须记住普通用户可以更改自己的密码，而 root 用户可以更改所有用户的密码。\n\
  ![](img/Image0028.jpg)\n某些 Linux 系统中，在设置新密码前会提示当前密码。\n`passwd -d [user_name]`: 将删除用户的密码，用户无需密码即可登录。\n\
  `passwd -e [user_name]`: 此参数将强制用户下次登录时更改密码。\n`passwd -i [number of days] [user_name]`:\
  \ 此参数将在指定天数后账户过期，之后账户将被禁用。\n```bash\nsudo passwd -i 2\n```\n密码过期信息更改。\n`passwd -n\
  \ [days after password can be changed] [user_name]`: 此参数将限制用户在指定天数内更改密码。\n```bash\n\
  sudo passwd -n 2\n```\n密码过期信息更改。\n\n### shutdown\n`shutdown`:此命令用于关机。此命令会通知系统中正在运行的所有进程需要关机，此命令向所有进程发送\
  \ `SIGTERM` 信号以便优雅退出，这允许像编辑器这样的进程保存工作以免丢失。此外，此命令只能由 root 用户执行。我们也可以安排在特定时间关机。\n\
  `shutdown` 将关机。由于处于静默模式，它可以保持运行。\n`shutdown [arguments] [TIME] [message]`\n```bash\n\
  sudo shutdown 23:00\n```\n将在 23:00 安排关机。\n```bash\nsudo shutdown +50\n```\n将在 50\
  \ 分钟后关机。\n```bash\nsudo shutdown +50 \"Going for maintenance\"\n```\n将在 50 分钟后关机，并在\
  \ 50 分钟后通知用户“Going for maintenance”。\n```bash\nsudo shutdown -r\n```\n这将重启系统。\n\
  ```bash\nsudo shutdown -r +50 \"Going for maintenance\"\n```\n将在 50 分钟后重启系统，带有消息“Going\
  \ for maintenance”。\n```bash\nshutdown -c \"MESSAGE\"\n```\n此命令将取消消息为 MESSAGE 的计划关机。\n\
  ```bash\nshutdown -k\n```\n这将向用户发送警告但不关机。\n\n### reboot\n`reboot`:reboot 命令用于重启系统。重启系统的情况有很多，例如，在更新后或执行某些维护工作后需要重启系统以检查效果。reboot\
  \ 命令功能有限，因此要安排重启，我们需要使用带 `-r` 参数的 `shutdown` 命令。\n```bash\nsudo reboot\n```\n这将重启系统。\n\
  \n### useradd\n`useradd`:此命令用于在系统中添加用户账户。\n`useradd [username]`\n```bash\nsudo useradd\
  \ tornado\n```\n检查是否创建了新用户账户。我们使用\n```bash\ncat /etc/passwd | grep 'tornado'\n```\n\
  `tornado:x:1001:1001::/home/tornado`\n`grep` 命令从 `/etc/passwd` 输入并找到单词 `tornado`，它是示例中的用户账户。这只是一个示例，用户名可以是任何名称。\n\
  `useradd -c \"comment\" [username]`\n```bash\nsudo useradd -c 'This is employe1218'\n\
  ```\n这将创建一个带有注释的新账户。在多功能环境中工作时，此参数非常有用。\n```bash\nsudo useradd -c 'This is employe1218'\
  \ tornado\n```\nuseradd: user 'tornado' 已存在。\n```bash\nsudo useradd -c 'This is\
  \ employe1218' tornado1\n```\n```bash\ncat /etc/passwd | grep 'tornado'\n```\n`tornado:x:1001:1001::/home/tornado`\n\
  `tornado1:x:1002:1002:This is employe1218:/home/tornado1`\n此用户账户名对每个用户必须是唯一的。创建新账户时，系统会自动为新用户分配一个\
  \ `id`。\n`useradd -u id [username]`\n```bash\nsudo useradd -u 1218 tornado2\n```\n\
  ```bash\ncat /etc/passwd | grep 'tornado'\n```\n`tornado:x:1001:1001::/home/tornado`\n\
  `tornado1:x:1002:1002:This is employe1218:/home/tornado1`\n`tornado2:x:1218:1218::/home/tornado2`\n\
  关于 `useradd` 命令的更多信息，请使用 `useradd --help`。\n\n# 网络管理\n\n### ifconfig\n`ifconfig`:ifconfig\
  \ 代表 Internet Configuration（网络配置）。此命令用于配置、控制（添加或删除）或显示与网络相关的信息，但目前我们仅用它显示网络相关信息，这样你就不会意外更改网络设置导致自己无法访问。\n\
  ![](img/Image00029.jpg)\n`ifconfig -a`: 此参数将显示所有接口。\n`ifconfig -s`: 此参数将简要显示结果。\n\
  ```bash\nsudo ifconfig -s\n```\nIface     MTU      RX-OK RX-ERR RX-DRP TX-OK TX-ERR\
  \ TX-DRP\neth0      1500      859      0            94      0      0\nlo       \
  \ 65536      20      0            20      0      0\n\n`wget`: 用于从网站下载文件。它提供了许多选项，如限制带宽、后台恢复下载以及下载多个文件。\n\
  `wget [page]`\n下载网页本身。例如，\n```bash\nwget http://www.thisexample.com/example.html\n\
  ```\n`wget -c [URL]`: 如果下载中断，将具有恢复能力。\n`wget -b [URL]`: 将在后台开始下载文件。\n\n### netstat\n\
  `netstat`:netstat 命令列出系统的网络连接。显示所有 socket 连接。此命令在 Windows 命令提示符中也可用。网络管理员经常使用它来检查哪些端口是开放的。例如，验证网站是否运行或端口\
  \ 80 是否开放。基本上有两种类型的端口：`TCP`（传输控制协议）和 `UDP`（用户数据报协议），我们将不进入详细细节。\n`netstat -a`: 显示所有端口（监听）。\n\
  ![](img/Image0030.jpg)\n`netstat -au`: 只显示 UDP 端口。\n```bash\nnetstat -au\n```\n\
  Active Internet connections (servers and established)\nProto Recv-Q Send-Q Local\
  \ Address             State\nudp                 0       0       192.168.123.135:pc\
  \             192.168.123.254:ps\nLocal and foreign addresses 将不同，可能在某些情况下相同。\n\
  `netstat -at`: 只显示 TCP 端口。\n```bash\nnetstat -at\n```\nActive Internet connections\
  \ (servers and established)\nProto Recv-Q Send-Q Local Address             State\n\
  tcp                 0       0       192.168.123.             ESTABLISHED\n```\n\
  当前系统内无。\n`netstat -lx`: 只列出所有监听端口。\n`netstat -c`: 每几秒更新一次结果。\n`netstat -r`: 将提供有关路由的信息。\n\
  ```bash\nnetstat -r\n```\nKernel IP routing table\nDestination     Gateway     \
  \        Genmask Flags    MSS Window     irtt Iface\ndefault       0.0.0.0     \
  \        192.168.123.2     UG        0       0       eth0\n192.168.123.0  0.0.0.0\
  \             255.255.255.0   U         0       0       eth0\n```\n关于 `netstat`\
  \ 的更多信息，使用 `netstat --help`。\n\n### ping\n`ping`:ping 命令是最广泛用于测试和网络排除的命令之一。它向指定的\
  \ IP 地址或 URL 发送 PING 成分的数据包。从指定地址或 URL 接收响应的时间被称为延迟。响应越快，延迟越低，连接越快。此命令使用 ICMP（互联网控制消息协议）数据包到指定的地址或\
  \ URL。除了测量延迟，它还用于检查目标地址是否有效活跃。在今天的计算机中，ping 的测量单位是毫秒。此命令也可以在提示符中执行。\n```bash\nping\
  \ [destination address]\n```\n![](img/Image0031.jpg)\n使用此命令时，它会持续 ping 地址直到被信号（Ctrl+C）强制停止。\n\
  `ping -c [total number of pings] [destination address]`: 因为不使用任何参数，它将无限 ping 目标地址。因此，要指定次数，我们使用\
  \ `-c` 参数。\n```bash\nping -c 5 www.google.com\n```\nPING www.google.com (172.217.19.164)\
  \ 56(84) bytes of data.64 bytes from zrh0407-in-f4 (172.217.19.164) icmp_seq=1 time=117=47.5\
  \ ms\n64 bytes from zrh0407-in-f4 (172.217.19.164) icmp_seq=2 time=117=47.6 ms\n\
  64 bytes from zrh0407-in-f4 (172.217.19.164) icmp_seq=3 time=117=47.9 ms\n64 bytes\
  \ from zrh0407-in-f4 (172.217.19.164) icmp_seq=4 time=117=47.4 ms\n64 bytes from\
  \ zrh0407-in-f4 (172.217.19.164) icmp_seq=5 time=117=47.5 ms\nwww.google.com ping\
  \ statistics\n5 packets transmitted, 5 received, 0% packet loss, rtt min/avg/max/mdev\
  \ = 47.5/47.6/47.9/0.2 ms\n默认情况下，ping 命令每秒发送一个数据包。使用 `-i` 参数可以指定在多少时间后发送下一个数据包。例如，\n\
  ```bash\nping -i 2 google.com\n```\n`ping -w [total time to wait] [destination address]`:\
  \ 也可以告诉命令在指定时间后停止。\n```bash\nping -w 2 google.com\n```\n\n##更多命令\n\n### cmp\n`cmp`:cmp\
  \ 代表比较。此命令用于逐字节（逐字符）比较两个文件并判断是否相同。如果在特定字节发现差异，它会打印发现差异的字节和行号并停止比较。该命令的语法非常简单，如果使用任何参数，我们需要传递要比较的文件名。\n\
  `cmp [arguments] [filename] [filename1]`\n![](img/Image0032.jpg)\n`cmp -b [filename]\
  \ [filename1]`: 此参数用于打印发生差异的字节。\n```bash\ncmp -b file.txt file1.txt\n```\nfile.txt\
  \ file1.txt differ: byte 58, line 3 142 b 157 o\n差异在第 58 字节。file.txt 中的字符是 'b'，而\
  \ file1.txt 中的字符是 'o'。\n`cmp -l [filename] [filename1]`: 这将在一个文件结束前打印所有差异字节及其值。\n\
  `cmp -n [total number of bytes to be compare] [filename] [filename1]`: 此参数允许你比较两个文件中指定数量的字节。\n\
  ```bash\ncmp -n 22 file.txt file1.txt\n```\n终端没有输出，这意味着两个文件的前 22 个字节相同。\n```bash\n\
  cmp -n 60 file.txt file1.txt\n```\nfile.txt file1.txt differ: byte 58, line 3\n\
  `cmp -i [skip bytes] [filename] [filename1]`: 此参数用于跳过文件开始的指定字节，然后比较两个文件。\n```bash\n\
  cmp -i 10 file.txt file1.txt\n```\nfile.txt file1.txt differ: byte 48, line 3 现在，我们从每个文件中都跳过了\
  \ 10 个字节，而不是在第 48 字节处差异。如果我们想从单个文件中跳过不同数量的字节，此参数也提供了该选项。\n`cmp -i [skip bytes from\
  \ 1st file] [skip bytes from 2nd file] [filename]`: 使用此语法，我们可以从每个文件中跳过指定数量的字节。\n\
  ```bash\ncmp -i 22 44 file.txt file1.txt\n```\nfile.txt file1.txt differ: byte 1,\
  \ line 1\n关于 `cmp` 的更多信息，使用 `cmp --help`。\n\n### clear\n`clear`:执行许多命令后，你是否觉得需要清除终端，因为它看起来有点乱。要执行此操作，使用\
  \ `clear` 命令。\n![](img/Image0033.jpg)\n使用 `clear` 命令后，\n![](img/Image0034.jpg)\n\
  \n### find\n`find`:find 命令用于在项目中查找文件或目录。在大型项目时，你可能不小心将文件或目录放在错误的地方而找不到它，此时此命令非常有用，它会打印工作目录的完整路径，但你必须记住工作目录。例如，在更新后或你执行某些维护工作后，需要重启系统以检查效果。\n\
  `find [directory path] -name [filename]`\n这将列出匹配的文件。\n```bash\nfind . -name \"txt\"\
  \n```\n![](img/Image0035.jpg)\n`find -empty`: 此命令列出所有空文件。\n`find -user [name]`:\
  \ 列出所有属于指定用户的文件。\n关于 `find` 的更多信息，使用 `find --help`。\n\n### grep\n`grep`:grep 代表\
  \ Global Regular Expression（全局正则表达式），用于在特定文件中搜索模式（字符串）。当文件中发现模式时，它会显示匹配的整行。当你需要在大文件中搜索特定模式时，此命令很有用。\n\
  `grep [Pattern of characters(filename]`\n![](img/Image0037.jpg)\ngrep 也可以在多个文件中搜索相同模式。首先，我们使用\
  \ `cp` 命令创建一个包含相同数据的新文件，然后在这两个文件上调用 `grep`。\n```bash\ncp file.txt file1.txt\ngrep\
  \ tornado file.txt file1.txt\n```\nfile.txt: tornado on line 1\nfile1.txt: tornado\
  \ on line 2\n`grep -h [string] [filename]`: 使用此参数时，它只会显示匹配行，而不显示发现该行的文件名。通常在多个文件中搜索字符串时使用。\n\
  ```bash\ngrep -h tornado file.txt file1.txt\n```\nfile.txt: tornado on line 1\n\
  file1.txt: tornado on line 2\n`grep -n [string] [filename]`: 使用此参数时，它会显示匹配行的行号。\n\
  ```bash\ngrep -n tornado file.txt file1.txt\n```\nfile.txt: tornado on line 1\n\
  file1.txt: tornado on line 2 \n`grep -i [string] [filename]`: 在匹配时忽略大小写。\n```bash\n\
  grep -h -i TORNADO file.txt file1.txt\n```\n（此处省略）\n使用 `grep --help` 了解更多关于 `grep`。\n\
  \n### wc\n`wc`:wc 代表 word count（单词计数），主要用于计数。此命令可以在指定文件的名称后显示行数、单词和字符数。\n`wc [argument]\
  \ [filename]`\n![](img/Image0038.jpg)\n如果不带任何参数，`wc` 命令输出四列。第一列代表总行数。第二列代表总单词数。第三列代表总字符数或字节数。第四列是文件名。此命令也可以用于多个文件名。\n\
  `wc [argument] [filename] [filename1]`\n```bash\nwc file.txt file1.txt\n```\nfile.txt:\
  \ 3 19 70\nfile1.txt: 3 18 67\n`wc -l [filename]`: 这将只行数。\n```bash\nwc -l file.txt\n\
  ```\n3\n`wc -w [filename]`: 这将打印总单词数。\n```bash\nwc -w file.txt\n```\n19\n`wc -c\
  \ [filename]`: 这将打印总字符数。\n```bash\nwc -c file.txt\n```\n70\n`wc --version`: 将显示\
  \ `wc` 命令当前版本。\n```bash\nwc --version\nwc (GNU coreutils) 8.30\nCopyright (C) 2018\
  \ Free Software Foundation, Inc.\nLicense GPL3+: GPL version 3 or later <https://gnu.org/licenses/gpl.html>.\n\
  这是免费软件：你可以自由更改和重新分发。在法律允许范围内不提供保证。由 Paul Rubin 和 David MacKenzie 编写。\n关于 `wc` 的更多信息，使用\
  \ `wc --help`。\n\n### echo\n`echo`:此命令用于在屏幕上显示字符（字符串）。此命令经常用于 bash 脚本中输出字符串。\n`echo\
  \ [arguments] [string]`\n![](img/Image0039.jpg)\n`echo *`:\n```bash\necho *\n```\n\
  file1.txt\nMakeit Info SquareGame Work1 Work3\n2/*Work2/Resources\nBacklash Sequences:\n\
  `\\n` 在字符串中用于换行。\n`\\c` 在字符串中将停止打印。\n`\\t` 在字符串中将留下制表符。\n`\\v` 在字符串中创建垂直制表符。\n`\\\
  a` 将导致蜂鸣声。\n```bash\necho -e \"Basic\\nCommand\"\n```\nBasic\nCommand\n```\necho\
  \ -e \"Basic\\tCommand\"\n```\nBasic\tCommand\n```\necho -e \"Basic\\vCommand\"\n\
  ```\nBasic\nCommand\n```\necho -e \"Basic\\aCommand\"\n```\n（蜂鸣声）\n```bash\necho\
  \ -e \"Basic\\tCommand\"\n```\n\n### uniq\n`uniq`:此命令源于 `unique` 关键字，像它的名字一样，用于打印唯一行。在打印文件数据时过滤掉相邻行。\n\
  `uniq [arguments] [filename]`\n![](img/Image0040.jpg)\n但现在看到 `uniq` 仍然打印了某些行，因为它们不是相邻的。为了删除非相邻行，我们使用\
  \ `sort -u` 命令。\n`uniq -c [filename]`: 使用 `-c` 参数将打印重复行出现的次数。例如，\n```bash\nuniq\
  \ -c new.txt\n```\n2 i am tornado\n1 i am tornado\n`uniq -d [filename]`: 只打印有重复的行。\n\
  ```bash\nuniq -d file.txt\n```\n`uniq -u [filename]`: 只打印唯一的行。\n```bash\nuniq -u\
  \ file.txt\n```\n`uniq -i [filename]`: 默认情况下 `uniq` 是大小写敏感的。如果使用 `-i` 参数，它们将被视为相同。\n\
  ```bash\nuniq -i new.txt\n```\ni am tornado\nI am tornado\n```\n关于 `uniq` 命令的更多信息，使用\
  \ `uniq --help`。\n\n### env\n`env`:此命令用于打印环境变量列表。环境变量是命令行和其他工具与系统轻松交互的变量。\n```bash\n\
  env\n```\n要打印列表，只需使用 `env` 命令即可。\n![](img/Image0041.jpg)\n`env -i`: 这将打印所有空（初始）环境变量。\n\
  我们也可以设置环境变量。环境变量分为两种类型：本地和全局。要声明本地环境变量，使用以下语法：\n`[variable name] = [value]`\n```bash\n\
  var=1\n```\n```bash\necho $var\n```\n要打印环境变量的值，我们在变量名前前使用 `$`。声明全局环境变量，使用以下语法：`export\
  \ [variable name] = [value]`\n```bash\nexport var=2\n```\n```bash\necho $var\n```\n\
  \n### split\n`split`:此命令用于将大文件分成较小文件。默认每个文件分 1000 行，我们可以指定每个文件的行数。\n`split [arguments]\
  \ [filename] [prefix of resulting file]`\n如果没有指定结果文件的前缀，系统默认将连续使用 `x`、`y` 和 `z`\
  \ 作为前缀。结果文件命名为 `aa`、`ab` 等……\n`split -l [number of lines] [filename] [prefix of\
  \ resulting file]`: 这将根据用户指定的行数拆分文件。\n![](img/Image0042.jpg)\n`split` 命令创建了名为 `aa`\
  \ 和 `ab` 的文件，每个文件包含少于或两行。\n```bash\nsplit -l 2 file.txt\n```\n```\ncat aa\ni am\
  \ tornado on line 1\ni am tornado on line 2\n```\n```\ncat ab\ni am empty but i\
  \ not\n```\n`split -b [number of characters] [filename] [prefix of resulting file]`:\
  \ 将根据字符数拆分文件。\n```bash\nsplit -b 5 file.txt\n```\n```bash\nls\nfile.txt\naa\nab\n\
  ```\n`split -n [number of total files] [filename] [prefix of resulting file]`: 将文件分成指定数量的文件，我们使用\
  \ `-n` 参数。\n`--verbose`: 在拆分文件时显示文件是否已创建。如果已创建，它还会显示文件名。\n```bash\nsplit -n 3 file.txt\
  \ --verbose\n```\ncreating aa\ncreating ab\ncreating ac\n```\n\n### paste\n`paste`:paste\
  \ 命令是 Linux 中非常有用的命令，用于水平合并文件。每个文件的行与另一个文件的行水平合并，数据之间由制表符分隔。假设我们有两个文件，`file.txt`\
  \ 和 `file1.txt`。\n```bash\npaste file.txt file1.txt\n```\nline 1\tline 1\nline 2\t\
  line 2\nline 3\tline 3\n`paste -d [delimiter] [filename] [filename1]`: 此参数将更改行之间的分隔符。默认是制表符。\n\
  ```bash\npaste -d \"|\" file.txt file1.txt\n```\nline 1|line 1\nline 2|line 2\n\
  line 3|line 3\n`paste -s [filename] [filename1]`: 将垂直合并文件。\n```bash\npaste -s file.txt\
  \ file1.txt\n```\nline 1\nline 2\nline 3\nline 1\nline 2\nline 3\n`paste -t [delimiter]\
  \ [filename] [filename1]`: 此参数将指定分隔符。\n```bash\npaste -t \",\" file.txt file1.txt\n\
  ```\nline 1,line 1\nline 2,line 2\nline 3,line 3\n`paste -d [filename] [filename1]`:\
  \ 将垂直合并文件。\n```bash\npaste -d file.txt file1.txt\n```\nline 1\tline 2\tline 3\n\
  line 1\tline 2\tline 3\n\n"
