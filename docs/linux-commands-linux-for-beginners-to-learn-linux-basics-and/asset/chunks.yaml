    [source] [destination]![](Image00010.jpg)If the destination file doesn’t exist,
    then it will be created (by renaming the source file). However, if it exists then
    it will be overwritten by the source file and the source file will be deleted.>>lsdest.cpp  new.cpp>>mv
    dest.cpp new.cpp>>lsNew.cppThe data inside the dest.cpp have overwritten the data
