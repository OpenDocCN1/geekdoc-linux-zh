    terminate in process in Linux. It sends a signal to terminate the process. There
    are several signals that can be sent with kill command to terminate the process,
    however, if no signal is specified, then by default it uses the SIGTERM signal.
    Kill command comes in quite handy when the process is not responding or you want
    forcibly quit the process.kill [process id]>>ps    PID TTY          TIME CMD   1949
