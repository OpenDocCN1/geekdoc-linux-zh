    nice:nice command is used to change the priority of the process. Every process
    needs RAM and CPU to complete its operation, each process is assigned priority
    by the system when it is started. However, there can be a process that we need
    to complete as soon as possible. For this, nice command is used. This command
    is mostly used on low-end systems. The priority of the process range from -20
    to 20\. For example, we want to start the priority of a specific process to 10,
    then the following command will be used.nice -n 10 [specific process]We can also
    change the priority of the running process. For this purpose, renice command is
    used. Now, we work on a particular example. First, we start the top command with
    priority of 10\. Then we open another terminal while the top command is running
    in the first terminal, we then note the process id of the top process from the
    top manager. Then we, change the priority of top from the second terminal by typing
    ‘renice -n [priority] [process id]’.![](Image00020.jpg)We note that the process
    id of top command is 4591 in the first terminal, now we open the second terminal
    and type ‘process -n 10 4591’ and then ‘process -n 15 4591’.>>renice -n 10 45914591
    (process ID) old priority 10, new priority 10>>renice -n 15 45914591 (process
    ID) old priority 10, new priority 15When the priority of top command which is
    running in the first terminal is changed, it prints the new priority followed
    by old priority.Administration and System Management24\. history:This command
