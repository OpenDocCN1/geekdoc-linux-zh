- fmt: "\n# Basic Commands\n\nTo dive into the Linux world, one must have proper knowledge\
    \ about some of the Linux commands to save him from the hassle. It is quite hard\
    \ to learn all the command but with practice, they can be remembered.\n\n## 1.\
    \ ls\n`ls` is one of the frequently used command in the Linux terminal. It is\
    \ used to print the content (both files and directories) of the specific directory\
    \ in the terminal in alphabetical order. If no directory is specified after `ls`\
    \ then it prints the content of the current working directory. Alongside printing\
    \ content, using additional arguments with `ls`, we can print the particular details\
    \ of the files and directories.\n\n```\nls -l\ntotal 0\ndrwxrwxrwx 0 root root\
    \ 4096 Aug 13 22:39 permissions\ndrwxrwxrwx 1 root root 4096 Aug 13 22:41 all\n\
    rwx-rw-r-- 1 root root 0 Aug 13 22:44 BinaryTree.cpp\ndrwxr-xr-x 1 root root 4096\
    \ Aug 13 22:41 check\ndrwxr-xr-x 1 root root 4096 Aug 13 22:36 dir\nrw-rw-r--\
    \ 1 root root 0 Aug 13 22:44 TSP.cpp\n```\n\n`ls -l`: This argument lists files\
    \ and directories in a long list format along with additional information instead\
    \ of a paragraph.\n\n`ls -a`: This argument adds hidden files and directories\
    \ to the list if there are any.\n\n```\nls -l\ntotal 0\ndrwxr-xr-x 1 root root\
    \ 4096 Aug 13 22:16 dir1\nd--------- 1 tornado 4096 Aug 13 22:01 dir2\ndrwxr-xr-x\
    \ 1 root root 4096 Aug 13 22:16 dir22\nd--------- 0 tornado 4096 Aug 13 22:01\
    \ dir2-2\ndrwxr-xr-x 1 root root 4096 Aug 13 22:49 testdir\n```\n\n```\nls -l\
    \ -a\ntotal 0\nd--------- 1 tornado 4096 Aug 13 22:51 .\ndrwxr-xr-x 1 tornado\
    \ tornado 4096 Apr 4 21:31 ..\ndrwxr-xr-x 1 root root 4096 Aug 13 22:16 dir1\n\
    d--------- 1 tornado 4096 Aug 13 22:01 dir2\ndrwxr-xr-x 1 root root 4096 Aug 13\
    \ 22:16 dir22\nd--------- 0 tornado 4096 Aug 13 22:01 dir2-2\n-rw-rw--r-- 1 root\
    \ root 0 Aug 13 22:51 .hiddenfile.txt\ndrwxr-xr-x 1 root root 4096 Aug 13 22:49\
    \ testdir\n```\n\n## 2. pwd\n`pwd` stands for Print Working Directory. It is used\
    \ to print the current working directory of the terminal. It starts from the root\
    \ and prints the path till the current working directory. If you are a new user\
    \ and lost your way in the directories, this command comes very handy to guide\
    \ you the.\n\n## 3. cd\n`cd` command stands for Change Directory. It is used to\
    \ change the directory in the terminal. This command is used to move from one\
    \ directory to another in the terminal. The syntax of this command is: `cd [arguments]\
    \ [new directory]`. If used without any directory, it changes current directory\
    \ to home.\n\nTo go back to the parent directory, we use two dots(`..`) i.e.,\
    \ `cd ..` will take you back to the parent directory (one-level up).\n\n```\n\
    cd ..\n/home/tornado\n```\n\n`cd ../..` Will take you back to parent’s parent\
    \ directory (two-level up).\n\n```\ncd ../..\n/home/tornado\n```\n\n`cd ../[directory\
    \ name]` will first take you to the parent directory and then to the `[directory\
    \ name]` from the parent directory.\n\n```\ncd ../tornado\n/home/tornado\n```\n\
    \n# Files/Directories Manipulation\n\n## 4. touch\n`touch` command is used either\
    \ to create a new empty file or update the timestamp of an existing file. To create\
    \ an empty file, simply type the name of the new file after the `touch` command,\
    \ and your file is created. Following is the syntax to create a new file: `touch\
    \ filename`.\n\n```\ntouch file.txt\nls -l\n-rw-r--r-- 1 root root 0 Aug 13 22:39\
    \ file.txt\n```\n\nIt can also be used to create multiple files at the same time\
    \ from just one command. Useful, isn’t it? Following is the syntax to create multiple\
    \ files: `touch filename1 filename2 filename3 …..`.\n\n```\ntouch file1.txt file2.txt\
    \ file3.txt\nls -l\n-rw-r--r-- 1 root root 0 Aug 13 22:39 file1.txt\n-rw-r--r--\
    \ 1 root root 0 Aug 13 22:39 file2.txt\n-rw-r--r-- 1 root root 0 Aug 13 22:39\
    \ file3.txt\n```\n\nWhat if a file already exists and `touch` command is called\
    \ for that file? Nothing to worry, it will just update the access, change, and\
    \ modification time of the file to the current time and no data inside the file\
    \ will be altered or deleted.\n\n`touch -a filename`: To only change the access\
    \ time of a file.\n`touch -m filename`: To update modification time only.\n`touch\
    \ -c-d filename`: To change modification and access time only leave the change\
    \ time unchanged `-c-d` is used along with the `touch` command.\n`touch -t YYMMDDHHMM\
    \ filename`: This will create a file with a specified time.\n\n```\ntouch -t 2112122121\
    \ file4.txt\nls -l\n-rw-r--r-- 1 root root 0 Dec 12 2021 file4.txt\n```\n\nTo\
    \ create a hidden file, type dot(`.`) before filename. `file .[filename]`. While\
    \ using this command, the user must have enough permissions to create or modify\
    \ the file information. If the user doesn’t have enough permission, its request\
    \ to use this command will be denied, to get enough permission, the user must\
    \ go either in root mode using `sudo` command (which we will discuss later) or\
    \ change the right of the directory and grant permission to a specific user to\
    \ change its content.\n\n```\nsudo -s\nEnter password:\ntouch filename\n```\n\n\
    ## 5. mkdir\n`mkdir` can be divided into two words `mk` and `dir`. `mk` stands\
    \ for make and `dir` stands for directory. This command allows one to create a\
    \ directory in the current working directory of the terminal. The syntax of following\
    \ command is: `mkdir dirname`.\n\n```\nmkdir testdir\nls -l\ntotal 0\ndrwxr-xr-x\
    \ 1 root root 4096 Aug 13 22:16 dir1\nd--------- 1 tornado 4096 Aug 13 22:01 dir2\n\
    drwxr-xr-x 1 root root 4096 Aug 13 22:16 dir22\nd--------- 0 tornado 4096 Aug\
    \ 13 22:01 dir2-2\ndrwxr-xr-x 1 root root 4096 Aug 13 22:17 testdir\n```\n\nJust\
    \ like `touch` command, `mkdir` command can also make multiple directories at\
    \ once.\n\n```\nmkdir testdir testdir2\nls -l\ntotal 0\ndrwxr-xr-x 1 root root\
    \ 4096 Aug 13 22:16 dir1\ndrwxr-xr-x 1 root root 4096 Aug 13 22:20 testdir\ndrwxr-xr-x\
    \ 1 root root 4096 Aug 13 20 test\n```\n\n`mkdir -v [directory name]`: To know\
    \ whether a directory is created or not, we used `ls` command for confirmation\
    \ but what if, in the folder where we created directory, there exist hundreds\
    \ of directories, it would be very time consuming to find... use `-v` argument\
    \ with `mkdir`, it will display the message for every directory created successfully.\n\
    \n```\nmkdir -v check\nmkdir: created directory 'check'\n```\n\n`mkdir -m[permission]\
    \ [directory name]`: `mkdir` command by default gives `rwx` (read, write and execute)\
    \ permission to the current user only, to create a directory which gives permission\
    \ to all user add the `-m` argument with `mkdir` and with `-m 777` to give `rwx`\
    \ permission to all users.\n\n`mkdir -p [directory name]`: This argument is used\
    \ to create a whole structure of directories. For example, if you want to create\
    \ `dir2` inside `dir1` inside `dir`, then use `-p` argument.\n\n## 6. rm\n`rm`\
    \ stands for remove. This command in Linux is used to delete objects such as file(s)\
    \ or directories etc. New users must be cautious while using this command because\
    \ once you have deleted an object, you might not be able to recover the content\
    \ of the file or directory as it will require some tools along with high-level\
    \ commands for you need to have quite a lot of expertise in Linux. By default,\
    \ `rm` can’t remove directories (only files); an additional argument is required\
    \ with the command to remove the directory. `rm [arguments] [filename(s)]`.\n\n\
    ```\ntotal 0\ndrwxrwxrwx 1 root root 4096 Aug 13 22:41 all\ndrwxr-xr-x 1 root\
    \ root 4096 Aug 13 22:41 check\ndrwxr-xr-x 1 root root 4096 Aug 13 22:36 dir\n\
    -rw-rw--r-- 1 root root 0 Aug 14 00:51 Test.cpp\n```\n\n`rm` can delete multiple\
    \ files too. `rm filename1 filename2 …..`. `rm` can also delete all files in the\
    \ directory. For this, we can use `rm *`. To delete the files of a particular\
    \ extension, we use: `rm *.[extension]`.\n\n`rm -i filename`: The `-i` arguments\
    \ makes the command to ask for user confirmation before deleting each file. If\
    \ the user enters `y` then deletes the file else it will keep the file. New users\
    \ are encouraged to use this argument so they may not delete the wrong file mistakenly.\n\
    \n```\nrm -i Test.cpp Test1.cpp\nrm: remove regular empty file 'Test.cpp'? y\n\
    rm: remove regular empty file 'Test1.cpp'? Y\n```\n\n`rm -d [directory name]`:\
    \ The `-d` argument is used to delete an empty directory. If the directory contains\
    \ any file or directory inside it then this command will fail to delete that directory.\n\
    \n```\nrm -d dir\nrm: cannot remove 'dir': Directory not empty\n```\n\n`rm -r\
    \ [directory name]`: This argument performs recursive deletion. First, it performs\
    \ the tree walk, deletes all files and sub-directories of the parent directory\
    \ recursively. It deletes everything it finds inside the directory and then the\
    \ directory itself.\n\n```\nrm -d dir\nrm: cannot remove 'dir': Directory not\
    \ empty\nrm -r dir\n```\n\n## 7. rmdir\n`rmdir` is divided into two words `rm`\
    \ and `dir`. `rm` stands for remove and `dir` stands for directory. This command\
    \ is used to delete empty directories. So, if there is any file or directory inside\
    \ the specified directory then it will not be deleted.\n\n## 8. cat\n`cat` command\
    \ is also one of the frequently used commands in Linux. The name of this command\
    \ comes from its functionality is, concatenate files. This command is used to\
    \ view and concatenate files, it writes the data to standard output (assume standard\
    \ output is terminal for now).\n\n`cat [arguments] [filename]`: To view the data\
    \ of single file.\n\n`cat [arguments] [filename] [filename1]`: To view the data\
    \ of multiple files.\n\n```\ncat an.txt new.txt\n```\n\n`cat -n [filename]`: To\
    \ view the data of the file with line number.\n\n```\ncat -n new.txt\n1 Line1\n\
    2 Line2\n3 Line3\n4 Line4\n5 Line5\n6 Line6\n```\n\n`cat [filename] >> [filename1]`:\
    \ This command is used to append the data of two files. It will append the data\
    \ of `filename` at the end of `filename1`.\n\n```\nsudo cat empty.txt >> new.txt\n\
    ```\n\n`cat [filename] [filename1] > [filename2]`: This will concatenate the data\
    \ of `filename` and `filename1` then create a new file of `filename2` and write\
    \ the data to `filename2`. If `filename2` already exists, then it will overwrite\
    \ the file.\n\n`tac [filename]`: We can display the data of the file in reverse\
    \ order by reversing the `cat` command.\n\n```\ntac new.txt\n6 Line6\n5 Line5\n\
    4 Line4\n3 Line3\n2 Line2\n1 Line1\n```\n\n`cat *`: This will display the data\
    \ of all the files in the directory.\n\n`cat [filename] | more`: It will only\
    \ show that much data, which can fit on the standard output (As said earlier,\
    \ assume standard output is terminal for now) and will ask you to show more.\n\
    \n## 9. cp\n`cp` stands for copy. This command is used to copy a file or group\
    \ of files or directory, it creates an exact copy of the source file with a different\
    \ name. To copy a file, pass source file name after `cp` command and then after\
    \ source file pass destination filename. `cp [arguments] [source file] [destination\
    \ file]`.\n\n```\ncp test.cpp ../dir/test.cpp\ncp: cannot stat 'test.cpp': No\
    \ such file or directory\ncd ..\ncd dir1\ncp test.cpp ../dir/test.cpp\ncd ..\n\
    cd dir\nls -l\ntotal 4\n---------- 1 root root 2720 Aug 14 14:53 test.cpp\n```\n\
    \n`cp [arguments] [source file1] [source file2] [source file3] [destination directory]`:\
    \ This command will copy all the files to the destination directory.\n\n```\n\
    ls s1.txt s2.txt dir\nls dir[dir is empty]\ncp s1.txt s2.txt dir\nls s1.txt s2.txt\n\
    ```\n\n`cp -r [arguments] [source directory] [destination directory]`: We can\
    \ also use the `cp` command to copy all files and directories inside one directory\
    \ to another but to do that we have to specify argument with `cp` command which\
    \ is `-r`, `-r` recursively copy all files from source to the destination directory.\n\
    \n`cp -i`: By specifying `-i` argument with `cp`, it warns the user before overwriting\
    \ the destination, new users are encouraged to use this argument with `cp` so\
    \ they don’t overwrite the data of the file mistakenly.\n\n```\ncat s1.txt\ncp\
    \ -i s1.txt s2.txt\ncp: overwrite 's2.txt'? y\ncat s2.txt\n```\n\n`cp -f (force)`:\
    \ If the user is unable to open the destination folder due to permission issues\
    \ then using `-f` argument with `cp` deletes the destination folder and then remake\
    \ the destination folder with enough permissions and copy the files to that.\n\
    \n```\nls -l s2.txt\ncp -f s1.txt s2.txt\ncp: create regular file 's2.txt': Permission\
    \ denied\nWith -f option, the command will be executed\n```\n\n`cp *`: We can\
    \ copy many files using wildcard (`*`) from one folder to another. Suppose in\
    \ a directory, we have many txt files and want to copy all of them at the same\
    \ time so by using `*` we can do that in a single command.\n\n```\nls dir[dir\
    \ is empty]\nls s1.txt s2.txt s3.txt s4.txt s5.txt\ncp *.txt dir\n```\n\n## 10.\
    \ mv\n`mv` stands for move. This command is used to move multiple files or directories.\
    \ It performs two functions; it renames the file or moves multiple files to a\
    \ different directory. `mv [arguments] [source] [destination]`. If the destination\
    \ file doesn’t exist, then it will be created (by renaming the source file). However,\
    \ if it exists then it will be overwritten by the source file and the source file\
    \ will be deleted.\n\n```\nmv dest.cpp new.cpp\nls New.cpp\n```\n\n`mv -i`: Like\
    \ in previous commands using `-i` make ask for user permission before overwriting\
    \ the dest file only if the file exists. If the file doesn’t exist, then it’t\
    \ ask for permission, it simply renames the file or moves it to some other directory.\n\
    \n```\nls s1.txt s2.txt s3.txt s4.txt\nmv -i s4.txt s1.txt\nmv: overwrite 's1.txt'?\
    \ y\nmv s4.txt s1.txt\n```\n\n`mv -n`: Using this argument with `mv` command,\
    \ if the destination file already exists then it will not overwrite the destination\
    \ file and nothing happens.\n\n```\nls s1.txt s2.txt s3.txt s4.txt\nmv -n s4.txt\
    \ s1.txt\n```\n\n`--version`: This argument is used with `mv` to display the version\
    \ of `mv` command being used in your system.\n\n```\nmv --version\nmv (GNU coreutils)\
    \ 8.25\nCopyright (C) 2016 Free Software Foundation, Inc.\nLicense GPLv3+: GNU\
    \ GPL version 3 or later <http://gnu.org/licenses/gpl.html>.\nThis is free software:\
    \ you are free to change and redistribute it.\nThere is NO WARRANTY, to the extent\
    \ permitted by law.\nWritten by Mike Parker, David MacKenzie, and Jim Meyering.\n\
    ```\n\n## 11. head\n`head` command is used to print the top N (specified by user)\
    \ lines of the given input file. If a user doesn’t specify the N then by it prints\
    \ the first 10 lines of file. When `cat` command is used, it prints all the data\
    \ of the file in the terminal but by using the `head` command, we can limit the\
    \ amount of data to be shown on the terminal from the top.\n\n```\ncat new.txt\n\
    Line1\nLine2\nLine3\nLine4\nLine5\nLine6\nLine7\nLine8\nLine9\nLine10\nLine11\n\
    Line12\nLine13\nLine14\nLine15\nhead new.txt\nLine1\nLine2\nLine3\nLine4\nLine5\n\
    Line6\nLine7\nLine8\nLine9\nLine10\n```\n\n`head -n [number of lines] [filename]`:\
    \ By using `-n` argument, we specify the total number of lines we wish to see\
    \ on screen. The number of lines after `-n` is compulsory to be specified or else\
    \ the command will give an error.\n\n```\nhead -n 5 new.txt\nLine1\nLine2\nLine3\n\
    Line4\nLine5\n```\n\n`head -c [number of bytes] [filename]`: By using the `-c`\
    \ argument with `head`, we specify the total number of bytes we wish to see on\
    \ screen, a byte is equal to one character new line is also equal to one byte.\
    \ Just like `-n` argument, we need to specify the total number of bytes after\
    \ `-c` argument, or else it will give an error.\n\n```\nhead -c 15 new.txt\nLine1\n\
    Line2L\n```\n\n`head -q [filename1] [filename2]`: If `head` is used for more than\
    \ one file, then the data is separated by filename but by using `q` argument,\
    \ data from each file is not preceded by its filename.\n\n```\nhead -q new.txt\n\
    Line1\nLine2\nLine3\nLine4\nLine5\nLine6\nLine7\nLine8\nLine9\nLine10\n```\n\n\
    `head -v [filename]`: By using this argument, data from the file is preceded by\
    \ its name.\n\n## 12. tail\n`tail` is complementary of `head`. As `head` prints\
    \ from the start of the file, `tail` prints from the end of the file. It prints\
    \ the last N lines. By default, it prints the last 10 lines. However, by using\
    \ `-n` argument with `tail`, we can specify the number of lines.\n\n```\ntail\
    \ -n [number of lines] [filename]\n```\n\n`tail -c [number of bytes] [filename]`:\
    \ This will print the last N (specified by user) bytes of the file.\n\n`tail -q\
    \ [filename1] [filename2]`: If the tail is used for more than one file, then the\
    \ data is separated by filename but by using `q` argument, data from each file\
    \ is not preceded by its filename.\n\n`tail -v [filename]`: By using this argument,\
    \ data from the file is preceded by its name.\n\n# Storage Management\n\n## 13.\
    \ mount\nAll files in the Linux system are arranged in one tree, rooted at `/`.\
    \ These files can spread over several devices. When you plug a portable hard disk,\
    \ USB, or SD card; there is a chance that your system might not be able to show\
    \ them directly, so you need it to `mount` to your existing tree (filesystem).\
    \ The `mount` command is used to attach a storage device to the tree, making it\
    \ accessible for the user. By executing `mount` without any argument, it will\
    \ enlist all the mounts.\n\n```\nmount -l\nrootfs on / type lxfs (rw,noatime)\n\
    none on /dev type tmpfs (rw,noatime,mode=755)\nsysfs on /sys type sysfs (rw,nosuid,nodev,noexec,noatime)\n\
    proc on /proc type proc (rw,nosuid,nodev,noexec,noatime)\ndevpts on /dev/pts type\
    \ devpts (rw,nosuid,noexec,noatime,gid=5,mode=620)\nnone on /run type tmpfs (rw,nosuid,noexec,noatime,mode=755)\n\
    none on /run/lock type tmpfs (rw,nosuid,nodev,noexec,noatime)\nnone on /run/shm\
    \ type tmpfs (rw,nosuid,nodev,noatime)\nnone on /run/user type tmpfs (rw,nosuid,nodev,noexec,noatime,mode=755)\n\
    binfmt_misc on /proc/sys/fs/binfmt_misc type binfmt_misc (rw,noatime)\nC on /mnt/c\
    \ type drvfs (rw,noatime,uid=1000,gid=1000,case=off)\nD on /mnt/d type drvfs (rw,noatime,uid=1000,gid=1000,case=off)\n\
    E on /mnt/e type drvfs (rw,noatime,uid=1000,gid=1000,case=off)\nF on /mnt/f type\
    \ drvfs (rw,noatime,uid=1000,gid=1000,case=off)\nG on /mnt/g type drvfs (rw,noatime,uid=1000,gid=1000,case=off)\n\
    ```\n\n`mount -h`: Displays all the options for mount with the explanation.\n\
    `mount -V`: Display the information of the current version of mount.\n\n```\n\
    mount -V\nmount from util-linux 2.27\nlib 2.27.0\n```\n`mount -r`: Mount the filesystem\
    \ in read-only mode.\n\n## 14. df\n`df` stands for disk free. This command is\
    \ used to get information about available and used space. You might use this command\
    \ while installing a file or software that requires a lot of space to check which\
    \ partition is available.\n\n```\nFilesystem     1K-blocks      Used Available\
    \ Use% Mounted on\nrootfs            204799996 156442692 48357304  77% /\nnone\
    \             204799996 156442692 48357304  77% /dev\ndev              204799996\
    \ 156442692 48357304  77% /dev\nrun              204799996 156442692 48357304\
    \  77% /run\n/run/lock         204799996 156442692 48357304  77% /run/lock\n/run/shm\
    \         204799996 156442692 48357304  77% /run/shm\n/run/user        204799996\
    \ 156442692 48357304  77% /run/user\nC:               59918332 16597748 4320584\
    \  28% /mnt/c\nD:               95739900 40993452 54746448  43% /mnt/d\nE:   \
    \            362343420 222813680 139529740  62% /mnt/e\nF:               408985596\
    \ 194306052 214679544  48% /mnt/f\n```\n\n`df [directory name]`: Using directory\
    \ name with df command can give storage information related to that particular\
    \ directory.\n\n```\ndf dir/\nFilesystem     1K-blocks      Used Available Use%\
    \ Mounted on\nrootfs            204799996 156442692 48357304  77% /\n```\n\n`df\
    \ -h`: Using `df` without any argument gives us a result which is in bytes and\
    \ it might require a calculation to convert into GB’s or MB’s. To simply get the\
    \ result in more human-readable form, we can use `-h` argument with `df`.\n\n\
    ```\ndf -h\nFilesystem      Size Used Avail Use% Mounted on\nrootfs          \
    \ 196G  150G   47G  77% /\nnone             196G  150G   47G  77% /\ndev     \
    \         196G  150G   47G  77% /dev\nrun             196G  150G   47G  77% /run\n\
    /run/lock        196G  150G   47G  77% /run/lock\n/run/shm         196G  150G\
    \   47G  77% /run/shm\n/run/user        196G  150G   47G  77% /run/user\nC:  \
    \             57G    16G    41G  28% /mnt/c\nD:               91G    39G    52G\
    \  43% /mnt/d\nE:               345G   212G   133G  62% /mnt/e\nF:           \
    \    390G   185G   214G  48% /mnt/f\n```\n\n`df -T`: This argument will display\
    \ the file type along with other information.\n\n```\ndf -T dir\nFilesystem  \
    \   Type     1K-blocks      Used Available Use% Mounted on\nrootfs         lxfs\
    \       204799996 156442692 48357304  77% /\n```\n\n## 15. lsblk\n`lsblk` commands\
    \ display information about all or specified block devices by reading the `sysfs`\
    \ file to gather information display all block devices except RAM in a tree-like\
    \ structure. We will run this command in different Linux from one that was used\
    \ for previous commands for better understanding.\n\n```\nlsblk\nNAME     SIZE\
    \ TYPE MOUNT\nsda      80G disk\n├─sda1   78G partition\n└─sda2    1K partition\n\
    └─sda5   2G partition [SWAP]\n```\n\n`lsblk -a`: This will display empty block\
    \ devices as well.\n\n```\nlsblk -a\nNAME     SIZE TYPE MOUNT\nsda      80G disk\n\
    ├─sda1   78G partition\n└─sda2    1K partition\n└─sda5   2G partition [SWAP]\n\
    ```\n\n`lsblk -m`: This will display information about the owner, group, and mode\
    \ of block devices.\n\n```\nlsblk -m\nNAME     SIZE OWNER GROUP MODE\nsda    \
    \  80G root root rw-rw----\n├─sda1   78G root root rw-rw----\n├─sda2    1K root\
    \ root rw-rw----\n└─sda5   2G root root rw-rw----\nsr0      1024M root root cdrom----\n\
    ```\n\n`lsblk -o [specific columns]`: This will print selected columns of block\
    \ devices.\n\n```\nlsblk -o NAME,SIZE\nsda      80G\n├─sda1   78G\n├─sda2    1K\n\
    └─sda5   2G\nsr0      1024M\n```\n\n`lsblk -d`: This will skip all child nodes\
    \ in tree.\n\n```\nlsblk -d\nNAME     MAJ:MIN RM SIZE TYPE MOUNT\nsda      8:0\
    \    80G disk\nsr0      11:0   1024M cdrom\n```\n\n`lsblk --help`: To display\
    \ additional information about the options.\n\n## 16. fdisk\n`fdisk` stands for\
    \ format disk. This command is used for the management of the disk partition table.\
    \ It is used to create, view, delete, resize, and move partitions on HDD or SSD.\
    \ `fdisk` can create a maximum of four partitions.\n\nView the partition details:\
    \ To view the details of available partitions, we use `fdisk -l` command to list\
    \ down the detail of all partitions. This command will not run and give an error\
    \ ‘permission denied’. To run the command, use `sudo fdisk -l` and enter the password.\
    \ Before doing any other operation on partitions, one must view the details of\
    \ partitions to point out which partition would be best for his operation.\n\n\
    `sudo fdisk -l [disk name]`: To view the partition of a specific disk, we pass\
    \ the name of that disk after `-l` argument. For example, we want to see the information\
    \ of `/dev/sda5` in the upper photo. We will use `sudo fdisk -l /dev/sda5`.\n\n\
    ```\nsudo fdisk -l /dev/sda5\nDisk /dev/sda5: 1.02 GiB, 1073741824 bytes, 2097152\
    \ sectors\nUnits: sectors\nsector * 1 = 512 bytes\nSector size (logical/physical):\
    \ 512 bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\nTo\
    \ create a new partition: To create a new partition on the disk, use `sudo fdisk\
    \ [disk name]`, this will prompt a menu, type `m` to see all available options.\
    \ Since we are going to create a new partition, we need to type `n` for this operation.\n\
    \n```\nsudo fdisk /dev/sda\nWelcome to fdisk (util-linux 2.34).\n```\n\n`Command\
    \ (m for help): n`\nAll space for primary partitions is in use.\nAdding logical\
    \ partition 6\nNo free sectors available.\nI used `/dev/sda` for this purpose\
    \ but there was no space available to create a new partition. So, to get space\
    \ we delete one of partition, you are advised not use this if you are learning\
    \ because you might end up deleting the wrong partition and losing all the data\
    \ in your Linux.\n\nTo delete a partition: To delete a partition from the disk,\
    \ use `sudo fdisk [disk name]`, since we are going to delete a partition, we need\
    \ to type `d` for this operation. You are advised not this operation if you are\
    \ a beginner.\n\n```\nsudo fdisk /dev/sda\nWelcome to fdisk (util-linux 2.34).\n\
    ````Command (m for help): d`\nPartition number (1,2,5, default 5):\nInstead of\
    \ entering the number from 1 to 5, we will force quit the prompt by pressing Ctrl+C\
    \ twice, since we do not need to perform this operation for now.\n\n`sudo fdisk\
    \ -s [disk name]`: This command print the size of that disk in bytes.\n\n```\n\
    sudo fdisk -s /dev/sda\n83886080\n```\nFor further knowledge about other arguments,\
    \ use `fdisk --help`.\n\n## 17. tree\nThis command is used to list the directories\
    \ or files of the specified directory (if not specified then of the current working\
    \ directory of the terminal) in the form tree. By default, this command is not\
    \ available in Linux. To install it in kali, Debian, or Ubuntu Linux, use `sudo\
    \ apt install tree` command in terminal to install it. When the command has completed\
    \ printing the tree, it will list down the total number of directories or files\
    \ found. `tree [arguments] [directory path]`\n\n`tree -f`: To print the full path\
    \ of each file and directory.\n\n```\ntree -f\n. ./HelloWorld\n├── ./include\n\
    │   └── ./include/person.h\n├── ./Makefile\n└── ./source\n    ├── ./source/main.cpp\n\
    \    └── ./source/person.cpp\n2 directories, 5 files\n```\n\n`tree -d`: To print\
    \ the directories only.\n\n```\ntree -d\n. include\n└── source\n2 directories\n\
    ```\n\n`tree -a`: To print the hidden files and directories. There is none in\
    \ my system at this moment. However, if you want to create one and check this\
    \ argument, use `mkdir` or `touch` before the name add a dot(.). For example,\
    \ `mkdir .hidden` or `touch .hidden.txt`.\n\n`tree -s`: To print the size (in\
    \ bytes).\n\n```\ntree -s\n.39512 HelloWorld\n4096 include\n|   188 person.h\n\
    8196 Makefile\n4096 source\n    100 main.cpp\n    299 person.cpp\n2 directories,\
    \ 5 files\n```\n\n`tree -D`: To print the last modified time of the files and\
    \ directories.\n\n```\ntree -D\n. Jul 25 13:08 HelloWorld\nJul 25 06:25 include\n\
    |   Jul 25 06:50 person.h\nJul 25 13:39 Makefile\nJul 25 06:30 source\n    Jul\
    \ 25 06:31 main.cpp\n    Jul 25 06:30 person.cpp\n2 directories, 5 files\n```\n\
    For further information about tree, use `tree --help`.\n\n## 18. du\n`du` stands\
    \ for disk usage. This command is used to display the total size of a file or\
    \ a directory. It is practically used to trace the files which are consuming a\
    \ lot of disk space. When this is used simply, without any option or directory\
    \ path, it lists disk usage of all files and directories present in the current\
    \ working directory in the terminal.\n\nTo list the disk usage of files and directories\
    \ inside a specific directory, we can give the path of that directory after the\
    \ `du` command. `du [directory path]`\n\n```\ndu Work\n180 Work/1\n26432 Work\n\
    ```\n\n`du -a [directory path]`: This argument will ask the `du` command to print\
    \ the usage of all the files inside the subdirectories. The size of every file,\
    \ and directory that exists inside the given directory will be printed.\n\n`du\
    \ -h [directory path]`: By default, this command print the size in bytes but by\
    \ using `-h` argument with this command, we can print the total space used in\
    \ more human-readable form.\n\n```\ndu -h Work\n180K Work/1\n140K Work\n26M Work\n\
    ```\n\n`du -c [directory path]`: This will print the total size consumed by the\
    \ specified directory along with individual sizes.\n\n```\ndu -c Work\n180 Work/1\n\
    140 Work\n26432 Work\n126432 total\n```\n\n`du --time [directory path]`: This\
    \ will print the last modification time of each individual directory or file.\n\
    \n```bash\ndu --time Work\n180 2020-08-03 08:31 Work/1\n140 2020-07-26 10:41 Work\n\
    26432 2020-08-03 08:31 Work\n```\n\n## 19. free\n`free` command is used to display\
    \ the available space, along with displaying available storage it displays information\
    \ about the total, and used memory.\n\n`free -b`: It displays the result in bytes.\n\
    `free -k`: It displays the result in kilo-bytes.\n`free -m`: It displays the result\
    \ in mega-bytes.\n`free -g`: It displays the result in giga-bytes.\n\n```\nfree\
    \ -m\n             total        used        free      shared  buff/cache available\n\
    mem           4217         603        3514          60          303        3610\n\
    swap           2044           0        2044\n```\nFor further information about\
    \ `free`, use `free --help` .\n\n# Process Management\n\n## 20. ps\n`ps` stands\
    \ for “Process Status”. This command is used to list the process running on the\
    \ system. Since Linux is a multi-processing and multi-tasking system. Many processes\
    \ can run together at a single time. To view all the currently processes, the\
    \ `ps` command is used. It lists the process ID and other attributes. `ps [arguments]`\n\
    \n```\nPID TTY TIME CMD\n1949 pts/2 00:00:00 bash\n2204 pts/2 00:00:00 vi\n2206\
    \ pts/2 00:00:00 ps\n```\n\n`ps -T`: To view the process only associated with\
    \ the terminal, we use `-T` argument.\n\n```\nPID TTY D CMD\n1949 pts/2 5 00:00:00\
    \ bash\n2204 pts/2 6 00:00:00 vi\n```\n\n`ps -a`: To view the processes that are\
    \ not associated with the terminal. It lists all the processes that are session\
    \ leaders ( Session leaders is a process that can hold multiple processes inside.\
    \ For example, when we call any process from the shell, then the shell is session\
    \ leader and its session ID is inherited by that child process, in case of not\
    \ responding by any process, this is used to kick off that process ) and are not\
    \ associated with the terminal. terminal is a session leader, so it was not listed,\
    \ ps was called from the terminal but is not associated with the terminal `ps\
    \ -x`: To view all the processes which are owned by you ( which are running under\
    \ your login ).\n\n## 21. top\n`top` command is one of the most frequently used\
    \ command by administrators. It is used to monitor the processor activity. It\
    \ provides a real-time view of the processes running on the system. Along that\
    \ it also lists down the useful information about those processes like how much\
    \ CPU and RAM each process is consuming. Its like a task manager in Windows. This\
    \ real-time view can be divided into two portions; Top and Bottom portion. The\
    \ top portion contains the information about resource usage and statistics of\
    \ processes, Bottom portion contains the information about currently running processes.\
    \ In the above photo, PID stands for process ID, PR stands for the priority of\
    \ the process, USER stands for the owner of that process, %CPU stands for CPU\
    \ usage and %MEM stands for RAM usage. These are few of the important attributes\
    \ you know when you call `top` command. After you have called `top` command, it\
    \ keeps on refreshing the list. To exit this real-time view, press ‘q’. We can\
    \ use argument with `top` command to shut it down after specific refreshes.\n\n\
    `top -n [number of refreshes]`: By using `-n` argument with `top`, it will shut\
    \ down after specified number of refreshes.\n`top -n 5`: This will quit top command\
    \ after 5 refreshes.\n`top -u [specific user]`: By using `-u` argument, we can\
    \ only display the processes started by a specific user, this command is frequently\
    \ used by the administrator to monitor the activities of employees or students.\n\
    `top -u root`: This command will display all the processes started by the root\
    \ user.\n\n## 22. pstree\n`pstree` command is used to display all the currently\
    \ running processes in the form of a tree. `pstree-p`: This argument will ask\
    \ the command to show Process ID of each process along with their name in the\
    \ tree.\n`pstree-u`: This argument will display the owner of each process also.\n\
    \n```\npstree -u -psystemd(1)─┬─ModemManager(555)─┬─{ModemManager}(588)\n    \
    \        │                      │\n            │                      └─{ModemManager}(99)\n\
    \            │            ├─NetworkManager(51)─┬─{NetworkManager}(13)\n      \
    \      │            │                      │\n            │            └─{NetworkManager}(21)\n\
    \            │            ├─agetty(41)\n            │            ├─colord(1909,colord)┬─{colord}(26)\n\
    \            │            │                      │\n            │            └─{colord}(28)\n\
    \            │            ├─cron(57)\n            │            ├─dbus-daemon(60,message_bus)\n\
    \            │            ├─ged(42)\n            │            └─lightdm(632)┬─Xorg(42)┬─{Xorg}(10)\n\
    \            │                       │                      │\n            │ \
