    1 root    root       0 Aug 13 22:51 .hiddenfile.txtdrwxr-xr-x 1 root    root    4096
    Aug 13 22:49 testdir2\. pwd:pwd stands for Print Working Directory. It is used
    to print the current working directory of the terminal. It starts from the root
