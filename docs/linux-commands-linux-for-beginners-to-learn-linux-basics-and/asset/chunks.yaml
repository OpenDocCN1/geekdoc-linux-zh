    it simply renames the file or moves it to some other directory.>>lss1.txt  s2.txt  s3.txt  s4.txt>>cat
    s4.txtI am the data>>cat s1.txtI am the bring overwritten>>mv -i s4.txt s1.txtmv:
    overwrite ''s1.txt''? y>>lss1.txt  s2.txt  s3.txt>>cat s1.txtI am the datamv -n:
    By using this argument with mv command, if the destination file already exists
    then it will not overwrite the destination file and nothing happens.>>lss1.txt  s2.txt  s3.txt  s4.txt>>cat
    s4.txtI am the data>>cat s1.txtI am the bring overwritten>>mv -i s4.txt s1.txt>>lss1.txt  s2.txt  s3.txt
    s4.txt>>cat s1.txtI am being overwritten--version: This argument is used with
    mv command to display the version of mv command being used in your system.>>mv
    --versionmv (GNU coreutils) 8.25Copyright (C) 2016 Free Software Foundation, Inc.License
    GPLv3+: GNU GPL version 3 or later <http://gnu.org/licenses/gpl.html>.This is
    free software: you are free to change and redistribute it.There is NO WARRANTY,
    to the extent permitted by law.Written by Mike Parker, David MacKenzie, and Jim
    Meyering.11\. head:head command is used to print the top N ( specified by user
    ) lines of the given input file. If a user doesn’t specify the N then by default
    it prints the first 10 lines of file. When cat command is used, it prints all
    the data of the file in the terminal but by using the head command, we can limit
    the amount of data to be shown on the terminal from the top.>>cat new.txtLine1Line2Line3Line4Line5Line6Line7Line8Line9Line10Line11Line12Line13Line14Line15>>head
    new.txtLine1Line2Line3Line4Line5Line6Line7Line8Line9Line10So, by default head
    printed first 10 lines of new.txt file but what if we want only the first 5 lines
    of the file?head -n [number of lines] [filename]: By using -n argument, we specify
    the total number of lines we wish to see on screen. The number of lines after
    -n is compulsory to be specified or else the command will give an error.>>head
    -n 5 new.txtLine1Line2Line3Line4Line5head -c [number of bytes] [filename]: By
    using the -c argument with head, we specify the total number of bytes we wish
    to see on screen, a byte is equal to one character new line is also equal to one
    byte. Just like -n argument, we need to specify the total number of bytes after
    -c argument, or else it will give an error.>>head -c 15 new.txtLine1Line2Lhead
    -q [filename1] [filename2]: If the head is used for more than 1 file, then the
    data is separated by filename but by using -q argument, data from each file is
    not preceded by its filename.Without -q,>>head new.txt an.txt==> new.txt <==Line1Line2Line3Line4Line5Line6Line7Line8Line9Line10==>
    an.txt <==Linev2[1]Linev2[2]Linev2[3]Linev2[4]Linev2[5]Linev2[6]Linev2[7]Linev2[8]Linev2[9]Linev2[10]With
    -q,>>head -q new.txt an.txtLine1Line2Line3Line4Line5Line6Line7Line8Line9Line10Linev2[1]Linev2[2]Linev2[3]Linev2[4]Linev2[5]Linev2[6]Linev2[7]Linev2[8]Linev2[9]Linev2[10]head
    -v [filename]: By using this argument, data from the file is preceded by its name.12\.
    tail:tail is complementary of head command. As head prints from the start of the
    file, tail command prints from the end of the file. It prints the last N number
    of lines. By default, it prints the last 10 lines of files. However, by using
    -n argument with tail, we can specify the number of lines we wish to be printed.tail
    [arguments] [filename1] [filename2]>>tail new.txtLine6Line7Line8Line9Line10Line11Line12Line13Line14Line15Just
    like head, it has the same argument and functionality, the only difference is
    that the work that head performed was from the start of the file, tail does that
    from the end of the file.tail -n [number of lines] [filename]: It will print last
    N ( specified after -n ) number of lines from the file.tail -c [number of bytes]
    [filename]: It will print last N ( specified after -n ) number of bytes from the
    file.tail -q [filename] [filename1]: If the tail is used for more than 1 file,
    then the data is separated by filename but by using -q argument, data from each
    file is not preceded by its filename.tail -f [filename]: This command is mostly
    used by programmers to see the growth of file as the data is being written from
    some source to it. As the new data is being written to the file, the console will
    update the new lines. When this command is used it does not return the prompt,
    until interrupted by the system ( Ctrl+C or closing the terminal ) . Generally,
