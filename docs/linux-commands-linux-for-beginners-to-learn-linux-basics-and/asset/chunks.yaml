    is one of the most frequently used command by administrators. It is used to monitor
    the processor activity. It provides a real-time view of the processes running
    on the system. Along with that, it also lists down the useful information about
    those processes like how much CPU and RAM each process is consuming.![](Image00018.jpg)It
    is like a task manager in Windows. This real-time view can be divided into two
    portions; Top and Bottom portion. The top portion contains the information about
    resource usage and statistics of processes, Bottom portion contains the information
    about currently running processes. In the above photo, PID stands for process
    ID, PR stands for the priority of the process,  USER stands for the owner of that
    process, %CPU stands for CPU usage and %MEM stands for RAM usage. These are few
    of the important attributes you must know when you call top command. After you
    have called top command, it keeps on refreshing the list. To exit this real-time
    view, press ‘q’. We can use argument with top command to shut it down after specific
    refreshes.top -n [number of refreshes]: By using -n argument with top, it will
    shut down after specified number of refreshes.top -n 5: This will quit top command
    after 5 refreshes.top -u [specific user]: By using the -u argument, we can only
    display the processes started by a specific user, this command is frequently used
    by the administrator to monitor the activities of employees or students.top -u
    root: This command will display all the processes started by the root user.22\.
