    a non-empty directory, to do so we have rm -r instead rmdir to delete the directory.8\.
    cat:cat command is also one of the frequently used commands in Linux. The name
    of this command comes from its functionality which is, concatenate files. This
    command is used to view and concatenate files, it writes the data to standard
    output ( assume standard output is terminal for now ).cat [arguments] [filename]:
    To view the data of single file.![](Image00008.jpg)cat [arguments] [filename]
    [filename1]: To view the data of multiple files.>>cat an.txt new.txtLinev2[1]Linev2[2]Linev2[3]Linev2[4]Linev2[5]Linev2[6]Linev2[7]Linev2[8]Linev2[9]Linev2[10]Line1Line2Line3Line4Line5Line6cat
    -n [filename]: To view the data of the file with line number.>>cat -n new.txt     1  Line1     2  Line2     3  Line3     4  Line4     5  Line5     6  Line6cat
    -T [filename]: This argument is used to visually differentiate between spaces
