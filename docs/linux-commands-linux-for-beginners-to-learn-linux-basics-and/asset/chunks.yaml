    -r [arguments] [source directory] [destination directory]We can also use the cp
    command to copy all files and directories inside one directory to another directory
    but to do that we have to specify argument with cp command which is -r, -r recursively
    copy all files from source to the destination directory.cp -i: By specifying -i
