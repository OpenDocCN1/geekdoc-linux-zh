    command.We can get the id of the specific process by the ps command and then use
    id after the kill command to kill it.We can also kill a number of processes together
    under one group by using a group ID. Negative PID is used for the group ID.PID
    -1 will kill the processes except init which is the parent process of all processes
    because killing init will crash the system.kill -l: This will list all signals
