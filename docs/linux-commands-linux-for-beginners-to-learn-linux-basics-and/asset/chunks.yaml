- fmt: "\n## Linux Commands\n\n### finger\n```\nName        Tty      Idle  Login Time\
    \   Office Phonekali      kali       tty7       39  Aug 16 06:22 (:0)\n```\nIn\
    \ case if you can’t use this command, then it means it is not installed in your\
    \ system by default. If you are using Ubuntu or Debian, then use the following\
    \ command to use `finger` command:\n```bash\nsudo apt-get install finger\n```\n\
    \n### uname\n`uname`:This command gives information about the operating system.\n\
    `uname [argument]`\nWhen used without any argument, it will only print the name\
    \ of the kernel.\n![](Image00027.jpg)\n`uname -v`: It prints the version of the\
    \ kernel.\n```bash\nuname -v#1 SMP Debian 5.4.13-1kali1 (2020-01-20)\n```\n`uname\
    \ -m`: It prints the machine hardware name.\n```bash\nuname -mxx86_64\n```\n`uname\
    \ -o`: It prints the name of the Operating system.\n```bash\nuname -oGNU/Linux\n\
    ```\n`uname -n`: It prints the network node hostname.\n```bash\nuname -nkali\n\
    ```\n`uname -r`: It prints the kernel release date.\n```bash\nuname -r5.4.0-kali3-amd64\n\
    ```\n`uname -a`: To get all information about the Operating system, use `-a` argument\
    \ with `uname`.\n```bash\nuname -aLinux kali 5.4.0-kali3-amd64 #1 SMP Debian 5.4.13-1kali1\
    \ (2020-01-20) x86_64 GNU/Linux\n```\n`Linux` is kernel name.\n`Kali` is network\
    \ node hostname.\n`5.4.0-kali3-amd64` is kernel release date.\n`#1 SMP Debian\
    \ 5.4.13-1kali1 (2020-01-20)` is kernel version.\n`x86_64` is machine hardware\
    \ name.\n`GNU/Linux` is the Operating system.\n\n### passwd\n`passwd`:passwd`\
    \ command is used to change the password of the user account.\n`passwd [arguments]\
    \ [user_name]`\nWhile changing the name, one must keep in mind that a normal user\
    \ can change the password of his or her account meanwhile root user can change\
    \ the password of all users.\n![](Image00028.jpg)\nIn some Linux systems, it asks\
    \ for a current password before setting a new password.\n`passwd -d [user_name]`:\
    \ This will delete the password of the user, the user can log in without any password.\n\
    `passwd -e [user_name]`: This argument will push the user to change their password\
    \ on the next login.\n`passwd -i [number of days] [user_name]`: This argument\
    \ will make the account for a specified number of days. After that, the account\
    \ will be deactivated.\n```bash\nsudo passwd -i 2 tornado2\n```\npasswd: password\
    \ expiry information changed.\n`passwd -n [days after which password can be changed]\
    \ [user_name]`: This argument will restrict the user not to change the password\
    \ before a specified number of days.\n```bash\nsudo passwd -n 2 tornado2\n```\n\
    passwd: password expiry information changed.\n\n### shutdown\n`shutdown`:This\
    \ command is used to shut down the system. This command notifies all processes\
    \ currently running on the system that needs to shut down, this command issues\
    \ `SIGTERM` signal to all process to shutdown gracefully For example, you are\
    \ instructed to leave the building instead of calling guard to push you out of\
    \ the building, this allows processes like editor to save their work and exit\
    \ so that work’t get lost. Also this command can only be executed by the root\
    \ user. We can also schedule the system to shut down at a specific time.\n`sudo\
    \ shutdown` will shut down the system. I can’t show you example, since I am in\
    \ quiet mood to keep you.\n`shutdown [arguments] [TIME] [message]`\n```bash\n\
    sudo shutdown 23:00\n```\nThis will schedule to down the system at 11 pm.\n```bash\n\
    sudo shutdown +50\n```\nThis will schedule to down the system after 50 mins.\n\
    ```bash\nsudo shutdown +50 \"Going for maintenance\"\n```\nThis will schedule\
    \ to down the system after 50 mins and after 50 mins, it will notify the users\
    \ with the message `Going for maintenance`.\n```bash\nsudo shutdown -r\n```\n\
    This will reboot the system.\n```bash\nsudo shutdown -r +50 \"Going for maintenance\"\
    \n```\nThis will reboot the system after 50 mins with the message `Going for maintenance`.\n\
    ```bash\nshutdown -c \"MESSAGE\"\n```\nThis will cancel the scheduled shutdown\
    \ with the message `MESSAGE`.\n```bash\nshutdown -k\n```\nThis will send a warning\
    \ to users of system but won’t down.\n\n### reboot\n`reboot`:reboot command is\
    \ used to restart the system. The need to restart the system arises on many occasions,\
    \ for that you must know this basic functionality of command. For example, you\
    \ need to reboot the system after some update or after you performed some maintenance\
    \ work on your system and to check its effect, the system must be restarted.\n\
    ```bash\nsudo reboot\n```\nThis command will restart the system. reboot command\
    \ has limited functionality. So, to schedule the reboot we have to use `shutdown`\
    \ command with `-r`. Since it has been explained in previous command, we will\
    \ not go into detail here.\n\n### useradd\n`useradd`:This command is used to add\
    \ a user account in the system.\n`useradd [username]`\n```bash\nsudo useradd tornado\n\
    ```\nTo check whether the new user account has been created or not. We use\n```bash\n\
    cat /etc/passwd | grep 'tornado'\n```\n`tornado:x:1001:1001::/home/tornado`\n\
    `grep` command will take input from `/etc/passwd` and then find the word `tornado`\
    \ which is the name of the user account in our example. It is just an example,\
    \ the username could be any name.\n`useradd -c \"comment\" [username]`\n```bash\n\
    sudo useradd -c 'This is employe 1218'\n```\nThis will create the new account\
    \ with the comment. While working in a very versatile environment, this argument\
    \ comes in handy.\n```bash\nsudo useradd -c 'This is employe 1218' tornado\n```\n\
    useradd: user 'tornado' already exists.\n```bash\nsudo useradd -c 'This is employe\
    \ 1218' tornado1\n```\n```bash\ncat /etc/passwd | grep 'tornado'\n```\n`tornado:x:1001:1001::/home/tornado`\n\
    `tornado1:x:1002:1002:This is employe 1218:/home/tornado1`\nThis user account\
    \ name must be unique for every user. While creating a new account, the system\
    \ itself assigns an `id` to the new user.\n`useradd -u id` [username]`\n```bash\n\
    sudo useradd -u 1218 tornado2\n```\n```bash\ncat /etc/passwd | grep 'tornado'\n\
    ```\n`tornado:x:1001:1001::/home/tornado`\n`tornado1:x:1002:1002:This is employe\
    \ 1218:/home/tornado1`\n`tornado2:x:1218:1218::/home/tornado2`\nFor further information\
    \ about `useradd` command, use `useradd --help`.\n\n## Network Management\n\n\
    ### ifconfig\n`ifconfig`:ifconfig stands for Internet Configuration. This command\
    \ is used to configure, control ( add or delete ) or display the information related\
    \ to network but for now, we will use it only to display the information related\
    \ to the network so you might not mistakenly change the setting of the network\
    \ and making it inaccessible for yourself.\n![](Image00029.jpg)\n`ifconfig -a`:\
    \ This argument will display all the interfaces available.\n`ifconfig -s`: This\
    \ argument will display the result in shortlisting.\n```bash\nsudo ifconfig -s\n\
    Iface     MTU      RX-OK RX-ERR RX-DRP RX-OVR   TX-OK TX-ERR TX-DRP TX-OVR Fl\n\
    eth0      1500      859      0      0            94      0      0      0 BMR\n\
    lo        65536      20      0      0            20      0      0      0 LR\n\n\
    ### wget\n`wget`:This command is used to download files from websites. It provides\
    \ you a number of options while downloading files like limiting bandwidth, resume\
    \ a download, in the background, and download multiple files.\n`wget [page url]`\
    \ To download the webpage itself. For example,\n```bash\nwget http://www.thisisexample.com/example.html\n\
    ```\n`wget -c [URL]`: This will resume the download if the downloading has resuming\
    \ capability otherwise will not resume the file.\n`wget -b [URL]`: This will start\
    \ downloading the file in the background.\n\n### netstat\n`netstat`:netstat command\
    \ lists out the network connections of the system. It displays all the socket’s\
    \ connection. This command is also available in the Command Prompt of Windows.\
    \ It is mostly used by network administrators to check which ports are open. This\
    \ command comes in handy while checking forwarding. For example, to verify that\
    \ website you made is running or not. We check whether port 80 is open or not.\
    \ It can be used to check malware on your system by checking on unusual ports.\
    \ Basically, there are two types of port; `TCP` (Transmission Control Protocol)\
    \ and `UDP` (User Datagram Protocol), we will not go into details on these.\n\
    `netstat -a`: To show all ports (Listening and non-Listening)!\n![](Image00030.jpg)\n\
    List of socket listed down my Linux system as quite long, so show a few of that\
    \ starting only.\n`netstat -au`: To show UDP ports only\n```bash\nnetstat -au\n\
    Active Internet connections (servers and established)\nProto Recv-Q Send-Q Local\
    \ Address             Foreign Address             State\nudp                 0\
    \       0       192.168.123.135:pc             192.168.123.254:ps\n```\nLocal\
    \ and foreign addresses will be different for you, maybe the same in a rare case.\n\
    `netstat -at`: To show TCP ports only.\n```bash\nnetstat -at\nActive Internet\
    \ connections (servers and established)\nProto Recv-Q Send-Q Local Address   \
    \          Foreign Address             State\ntcp                 0       0  \
    \     192.168.123.             ESTABLISHED\n```\nThere is currently none on my\
    \ system.\n`netstat -lx`: To list all lsitening ports only.\n`netstat -c`: This\
    \ will update the result after every few seconds.\n`netstat -r`: This will give\
    \ you information about routing.\n```bash\nnetstat -r\nKernel IP routing table\n\
    Destination     Gateway             Genmask         Flags    MSS Window     irtt\
    \ Iface\ndefault       0.0.0.0             192.168.123.2     UG        0     \
    \  0       eth0\n192.168.123.0  0.0.0.0             255.255.255.0   U        \
    \ 0       0       eth0\n```\nFor further information about `netstat`, use `netstat\
    \ --help`.\n\n### ping\n`ping`:ping command is one the most widely used command\
    \ for testing, and troubleshooting the network. This command sends the data packet\
    \ composed of the message `PING` on the specified IP Address or the URL. The time\
    \ taken to receive a response from that specified address or URL is known as latency\
    \ . Faster the response, faster the latency, and faster the connection. This command\
    \ uses ICMP which stands for Internet Control Message Protocol data packets to\
    \ the specified address or URL. Along with measuring latency, it is also used\
    \ to check whether the destination address is valid and active or not. The unit\
    \ of measurement of the ping is a millisecond in today’s computers. This command\
    \ can also be executed in Command Prompt.\n```bash\nping [destination address]\n\
    ```\n![](Image00031.jpg)\nWhen this command is used, it keeps on pinging the address\
    \ until it is forcefully stopped by signal (Ctrl +C).\n`ping -c [total number\
    \ of pings] [destination address]`: Since, without using any argument, it will\
    \ keep on pinging destination address infinitely. So, to ping a specified number\
    \ of times, we use `-c` argument.\n```bash\nping -c 5 www.google.com\n```\nPING\
    \ www.google.com (172.217.19.164) 56(84) bytes of data.64 bytes from zrh0407-in-f4\
    \ (172.217.19.164) icmp_seq=1 time=117=47.5 ms\n64 bytes from zrh0407-in-f4 (172.217.19.164)\
    \ icmp_seq=2 time=117=47.6 ms\n64 bytes from zrh0407-in-f4 (172.217.19.164) icmp_seq=3\
    \ time=117=47.9 ms\n64 bytes from zrh0407-in-f4 (172.217.19.164) icmp_seq=4 time=117=47.4\
    \ ms\n64 bytes from zrh0407-in-f4 (172.217.19.164) icmp_seq=5 time=117=47.5 ms\n\
    www.google.com ping statistics\n5 packets transmitted, 5 received, 0% packet loss,\
    \ time 238ms\nrtt min/avg/max/mdev = 47.4/47.6/47.9/2.1 ms\nping -i [total time\
    \ to wait for next ping] [destination address]: ping command by default wait for\
    \ one second before sending the next packet. By using `-i` argument we can specify\
    \ to wait that amount of time before sending the next.\n```bash\nping -c 2 -i\
    \ 2 www.google.com\n```\nPING www.google.com (172.217.19.164) 56(84) bytes of\
    \ data.64 bytes from zrh0407-in-f4 (172.217.19.164) icmp_seq=1 time=117=47.7 ms\n\
    64 bytes from zrh0407-in-f4 (172.217.19.164) icmp_seq=2 time=117=47.5 ms\nwww.google.com\
    \ ping statistics\n2 packets transmitted, 2 received, 0% packet loss, time 2001ms\n\
    rtt min/avg/max/mdev = 47.5/47.6/47.7/1.1 ms\nping -i [total time to ping] [destination\
    \ address]: We can also tell the command to ping for a specific time and stop.\n\
    ```bash\nping -w 2 www.google.com\n```\nPING www.google.com (172.217.19.164) 56(84)\
    \ bytes of data.64 bytes from zrh0407-in-f4 (172.217.19.164) icmp_seq=1 time=117=47.9\
    \ ms\n64 bytes from zrh0407-in-f4 (172.217.19.164) icmp_seq=2 time=117=47.5 ms\n\
    www.google.com ping statistics\n2 packets transmitted, 2 received, 0% packet loss,\
    \ time 100ms\nrtt min/avg/max/mdev = 47.5/47.7/47.9/1.2 ms\n\n## More commands\n\
    \n### cmp\n`cmp`:cmp stands for comparison. This command is used to compare two\
    \ files byte by byte ( character by character ) and find out whether two files\
    \ are identical or not. If the difference is found at a specific byte, then it\
    \ prints the byte number along with the line number where the difference is found\
    \ and stops further comparison.\nThe syntax of this command is quite simple, we\
    \ need to pass the name of two files which are to be compared after arguments\
    \ if we are using any.\n`cmp [arguments] [filename] [filename1]`\n![](Image00032.jpg)\n\
    `cmp -b [filename] [filename1]`: This argument is used to print the byte at which\
    \ difference occurred.\n```bash\ncmp -b file.txt file1.txt\n```\nfile.txt file1.txt\
    \ differ: byte 58, line 3 is 142 b 157 o\nThe difference is at the 58th byte.\
    \ The character that differed in file.txt is ‘b’ from the character in file1.txt\
    \ which is ‘o’.\n`cmp -l [filename] [filename1]`: This will print all the different\
    \ bytes along with bytes value until one of the files has ended.\n`cmp -n [total\
    \ number of bytes to be compare] [filename] [filename1]`: This argument allows\
    \ you to compare the specified number of bytes in two files.\n```bash\ncmp -n\
    \ 22 file.txt file1.txt\n```\nNo output is produced by the terminal, this means\
    \ the first 22 bytes of both files are identical.\n```bash\ncmp -n 60 file.txt\
    \ file1.txt\n```\nfile.txt file1.txt differ: byte 58, line 3\n`cmp -i [skip bytes]\
    \ [filename] [filename1]`: This argument is used to skip the specified number\
    \ of bytes from the start of files and then compare the two files.\n```bash\n\
    cmp -i 10 file.txt file1.txt\n```\nfile.txt file1.txt differ: byte 48, line 3\
    \ Now, we have skipped 10 bytes from each file instead of differing on 48th byte.\
    \ If we want to skip different number of bytes from individual files this argument\
    \ also provides you the option to do that.\n`cmp -i [skip bytes from 1st file]\
    \ [skip bytes from 2nd file] [filename]`: By using this syntax, we can skip a\
    \ specified number of bytes from each file.\n```bash\ncmp -i 22 44 file.txt file1.txt\n\
    ```\nfile.txt file1.txt differ: byte 1, line 1\nFor further information, use `cmp\
    \ --help`.\n\n### clear\n`clear`:After executing many commands, do you feel the\
    \ need to wipe out the terminal because it is feeling little bit messy. To perform\
    \ this operation, `clear` command is used.\n![](Image0033.jpg)\nAfter using `clear`\
    \ command,\n![](Image00034.jpg)\n\n### find\n`find`:find command is used to find\
    \ files or directories while working on large project. You may accidentally place\
    \ a file or directory in wrong directory and are unable to find it, that’s where\
    \ this command comes in handy it prints the whole path from the current working\
    \ directory but you must keep in mind that current working directory must be the\
    \ ancestor of that file or directory. For example, if we are searching file.txt\
    \ which is on Desktop but our current working directory is Document then find\
    \ will not be able to find the file.txt as it will walk down the path of Document\
    \ and Desktop is not child directory of Document.\n`find -name [additional argument]\
    \ [filename]`\nIt tells us that file.txt can be found by traversing to Desktop.\
    \ will then search in child directories too it will search only in that working\
    \ directory. However, we can also specify the path to the directory where we want\
    \ to search for file or directory before `-name` argument.\n```bash\nfind [directory\
    \ path] -name [filename]\n```\n![](Image0035.jpg)\n`find -empty`: This command\
    \ will list down all the empty files.\n`find -user [name]`: List down all the\
    \ files owned by the specified user. For further information use `find --help`.\n\
    \n### grep\n`grep`:grep stands for Global Regular Expression Point it is used\
    \ to search a pattern of characters in particular files. When the pattern is found\
    \ in the file, it displays the whole line in the result, this command is useful\
    \ when you have to search a specific pattern of characters in large file(s).\n\
    `grep [Pattern of characters(string)] [filename]`\n![](Image0037.jpg)\nGrep can\
    \ also be used to search same pattern in multiple files. First, we create a new\
    \ file containing the same data as of `file.txt` using the `cp` command, and then\
    \ we call `grep` on both files.\n```bash\ncp Desktop/file.txt file1.txt\ngrep\
    \ tornado file.txt file1.txt\n```\nfile.txt:i am tornado on line 1\nfile.txt:i\
    \ am tornado on line 2\nfile.txt:i am tornado on line 5\nfile1.txt:i am tornado\
    \ on line 1\nfile1.txt:i am tornado on line 2\nfile1.txt:i am tornado on line\
    \ 5\n`grep -n [string] [filename]`: What if we are searching in a very large file\
    \ and we also want to know where we found our matching string. For this, we use\
    \ `-n` argument with `grep`.\n```bash\ncd Desktop\ngrep -n empty file.txt\n```\n\
    3:i am empty\n4:i am empty\n`grep -c [string] [filename]` To print the total count\
    \ of lines that contains the string.\n```bash\ngrep -c empty.txt\n```\n2:i am\
    \ empty\n`grep -h [string] [filename]`: When this argument is used, it will only\
    \ display the matched lines and not the filename in which that line was found.\
    \ Generally, it is used when the string is being searched in multiple files.\n\
    ```bash\ngrep -h tornado file.txt file1.txt\n```\nfile.txt:i am tornado on line\
    \ 1\nfile.txt:i am tornado on line 2\nfile.txt:i am tornado on line 5\nfile1.txt:i\
    \ am tornado on line 1\nfile1.txt:i am tornado on line 2\nfile1.txt:i am tornado\
    \ on line 5\n`grep -i [string] [filename]`: Use to ignore cases while matching.\n\
    ```bash\ngrep -h TORNADO file.txt file1.txt\n```\ngrep -h -i TORNADO file.txt\
    \ file1.txt\nfile.txt:i am tornado on line 1\nfile.txt:i am tornado on line 2\n\
    file.txt:i am tornado on line 5\nfile1.txt:i am tornado on line 1\nfile1.txt:i\
    \ am tornado on line 2\nfile1.txt:i am tornado on line 5\nUse `grep --help` to\
    \ know further about `grep`.\n\n### wc\n`wc`:wc stands for word count. It is mainly\
    \ used for counting purposes. This command can display the number of lines, words,\
    \ and characters in the specified file after its name.\n`wc [argument] [filename]`\n\
    ![](Image00038.jpg)\nWithout any argument, `wc` command output four columns. The\
    \ first column represents the total number of lines. The second column represents\
    \ the total number of words. The third column represents the total number of characters\
    \ or bytes. The fourth column is the name of a file. This command can also be\
    \ used with multiple filenames.\n`wc [argument] [filename] [filename1]`\n```bash\n\
    wc file.txt file1.txt\n```\nfile.txt: 3 19 70\nfile1.txt: 3 18 67\n`wc -l [filename]`:\
    \ This will print the number of lines only.\n```bash\nwc -l file.txt\n```\n3\n\
    `wc -w [filename]`: This will print the total number of words only.\n```bash\n\
    wc -w file.txt\n```\n19\n`wc -c [filename]`: This will print the total number\
    \ of characters only.\n```bash\nwc -c file.txt\n```\n70\n`wc --version`: This\
    \ will display the current version of `wc` command.\n```bash\nwc --version\nwc\
    \ (GNU coreutils) 8.30\nCopyright (C) 2018 Free Software Foundation, Inc.\nLicense\
    \ GPL3+: GPL version 3 or later <https://gnu.org/licenses/gpl.html>.\nThis is\
    \ free software: you are free to change and redistribute it.\nThere is NO WARRANTY,\
    \ to the extent permitted by law.\nWritten by Paul Rubin and David MacKenzie.\n\
    For further information about `wc`, use `wc --help`.\n\n### echo\n`echo`:This\
    \ command is used to display the pattern of characters (string) on the screen.\
    \ This command is used a lot in bash scripts for outputting the string on the\
    \ terminal.\n`echo [arguments] [string]`\n![](Image00039.jpg)\n`echo *`:\n```bash\n\
    echo *\n```\nfile1.txt\nMakeit Port Info SquareGame Tutorial Work1 Work2 Work3\n\
    2/*Work2/Assg2.zip Work2/Resources\nBacklash Sequences:\n`\\n` in the string is\
    \ used to go a new line.\n`\\c` in the string will stop further printing of text.\n\
    `\\t` in the string will leave tab space at that position.\n`\\v` in the string\
    \ will create vertical tab space.\n`\\a` will cause sound beep.\n```bash\necho\
    \ \"Basic \\nLinux \\nCommand\"\n```\nBasic\nLinux\nCommand\nInstead of going\
    \ to the new line, when `\\n` is used. ignored backlash and printed n as simple.\
    \ To enable backlash sequences in the string we have to use `-e` argument with\
    \ `echo` command.\n`echo -e [string]`\n```bash\necho -e \"Basic \\nLinux \\nCommand\"\
    \n```\nBasic\nLinux\nCommand\n```bash\necho -e \"Basic \\vLinux \\vCommand\"\n\
    ```\nBasic Linux\nCommand\n\n### uniq\n`uniq`:This command name comes from the\
    \ `unique` keyword, and like its name, it is used to print unique lines. It filters\
    \ out the duplicate lines while printing the data from the file on the terminal.\n\
    `uniq [arguments] [filename]`\n![](Image00040.jpg)\nThis command filtered out\
    \ the duplicate adjacent line from the file data in the above photo. But now,\
    \ we see `uniq` still printed the line `i am tornado` because it was not adjacent\
    \ to other lines. So, `uniq` isn’t able to filter the line if it is not adjacent\
    \ to its duplicate. To delete the non-adjacent line too we use `sort -u [filename]`\
    \ command.\n`uniq -c [filename]`: Using `-c` argument with `uniq` will also print\
    \ times the duplicate was found and that count can be seen before the line. For\
    \ example,\n```bash\nuniq -c new.txt\n```\n2 i am tornado\n2 i have nothing to\
    \ show\n1 i am tornado\n2 before `i am tornado` tells the line was found 2 times\
    \ and 1 before `i am tornado` that this line was found only 1 time in the fourth\
    \ line of output.\n`uniq -d [filename]`: Using `-d` argument with `uniq` will\
    \ print only those lines which have adjacent duplicates.\n`uniq -u [filename]`:\
    \ Using `-u` argument with `uniq` will print only those lines which are unique.\n\
    `uniq -i [filename]`: Using `-i` argument with `uniq` will make the match to be\
    \ case insensitive. By default, it is case sensitive. If we change `i am tornado`\
    \ to `I am tornado` without `-i` argument it will consider them both different.\
    \ However, by using `-i` argument they will be counted the same.\n```bash\nuniq\
    \ new.txt\n```\ni am tornado\nI am tornado\ni have nothing to show\n```bash\n\
    uniq -i new.txt\n```\ni am tornado\ni am tornado\ni have nothing to show\nFor\
    \ further information about `uniq` command, use `uniq --help`.\n\n### env\n`env`:This\
    \ command is used to print the list of environment variables. Environment variables\
    \ are those variables that allow access to the command line and other tools to\
    \ interact easily with the system.\n`env`\nTo print the list, simply use `env`\
    \ command.\n![](Image00041.jpg)\n`env -i`: This will print all empty environment\
    \ variables.\nWe can also set the environment variables ourelf environment variables\
    \ are of two types; local and global. To declare a local environment variable,\
    \ we use the following syntax:\n`[variable name] = [value]`\n```bash\nvar=1\n\
    ```\n```bash\necho $var\n```\nTo print the value of the environment variable,\
    \ we use `$` before the variable name. To declare a global environment variable,\
    \ we use following syntax: `export [variable name] = [value]`\n```bash\nexport\
    \ var=2\n```\n```bash\necho $var\n```\n\n### split\n`split`:This command is used\
    \ to split large files into smaller files. By default it splits 1000 lines per\
    \ file we can specify the number of lines per file.\n`split [arguments] [filename]\
    \ [prefix of resulting file]`\nIf no prefix for resulting file is specified, then\
    \ by default system use `x`, then `y` and `z` in succession as a prefix. The resulting\
    \ files are named as `aa`, `ab`, and so on…\n`split -l [number of lines] [filename]\
    \ [prefix of resulting file]`: This will split the file based on the number of\
    \ lines specified by the user.\n![](Image00042.jpg)\n`split` command created more\
    \ files named `aa` and `ab` and each of them contains less or equal to two lines.\n\
    ```bash\nsplit -l 2 file.txt\n```\n```bash\ncat aa\ni am tornado on line 1\ni\
    \ am tornado on line 2\n```\n```bash\ncat ab\ni am empty but i not\n```\n`split\
    \ -b [number of characters] [filename] [prefix of resulting file]`: To split the\
    \ file on the basis of characters.\n```bash\nsplit -b 5 file.txt\n```\n```bash\n\
    ls\n```\nfile.txt\naa\nab\n`split -n [number of total files] [filename] [prefix\
    \ of resulting file]`: To split the file into a specific number of files, we use\
    \ `-n` argument.\n`--verbose`: While splitting the file contains a message whether\
    \ the file had been created successfully or not. If created successfully, it will\
    \ also display the name of the file in the message.\n```bash\nsplit -n 3 file.txt\
    \ --verbose\n```\ncreating file 'aa'\ncreating file 'ab'\ncreating file 'ac'\n\
    For further information about `split` command, use `split --help`.\n\n### paste\n\
    `paste`:paste command is a useful command in Linux, it is used to merge files\
    \ horizontally. Each line from one file is merged horizontally with the corresponding\
    \ line of other files. The data from files are separated by a tab. Let us suppose\
    \ have two files, `file.txt` and `file1.txt`.\n```bash\ncat file.txt\n```\ni am\
    \ tornado on line 1\ni am tornado on line 2\ni am empty but i not\n```bash\ncat\
    \ file1.txt\n```\n2nd file line 1\n2nd file line 2\n2nd file line 3\n```bash\n\
    paste file.txt file1.txt\n```\ni am tornado on line 1\t2nd file line 1\ni am tornado\
    \ on line 2\t2nd file line 2\ni am empty but i not\t2nd file line 3\n`paste -d\
    \ [delimiter] [filename] [filename1]`: This argument will change the delimiter\
    \ used between the lines from different files. By default, is tab. For two files,\
    \ we can only use one character as a delimiter. If more than one character is\
    \ used as a delimiter, then it will be used in a ring fashion.\n```bash\npaste\
    \ -d \"|\" file.txt file1.txt\n```\ni am tornado on line 1|2nd file line 1\ni\
    \ am tornado on line 2|2nd file line 2\ni am empty but i not|2nd file line 3\n\
    `paste -s [filename] [filename1]`: This will merge the files vertically.\n```bash\n\
    paste -s file.txt file1.txt\n```\ni am tornado on line 1\ni am tornado on line\
    \ 2\ni am empty but i not\n2nd file line 1\n2nd file line 2\n2nd file line 3\n\
    `paste --version`: This will display the current version of `paste` command.\n\
    ```bash\npaste --version\n```\npaste (GNU coreutils) 8.30\nCopyright (C) 2018\
    \ Free Software Foundation, Inc.\nLicense GPL3+: GPL version 3 or later <https://gnu.org/licenses/gpl.html>.\n\
    This is free software: you are free to change and redistribute it.\nThere is NO\
    \ WARRANTY, to the extent permitted by law.\nWritten by David M. Ihnat and David\
    \ MacKenzie.\n\n### watch\n`watch`:This command is used to execute the other specified\
    \ command after `watch` keyword periodically, this will run the specified command\
    \ after a specific period repeatedly. By default, the period after which command\
    \ is repeated is two seconds. This command will keep on running until interrupted\
    \ by signal (Ctrl+C).\n`watch [command] [input]`\nFor example, we use the above\
    \ command with `cat file.txt` and `watch` command being executed, change the data\
    \ in `file.txt` we will be able to see the difference on the screen.\n```bash\n\
    watch cat file.txt\n```\n0s every file.txt:\ni am tornado on line 1\ni am tornado\
    \ on line 2\ni am empty but i not\n`watch -n [period time] [command] [input]`:\
    \ We can specify the time after which command must repeated. The least possible\
    \ value for this argument is 0, it can’t go slower than that.\n```bash\nwatch\
    \ -n 1 file.txt\n```\n1s every file.txt:\ni am tornado on line 1\ni am tornado\
    \ on line 2\ni am empty but i not\n`watch -t [period time] [command] [input]`:\
    \ This argument will turn off the title.\n```bash\nwatch -t cat file.txt\n```\n\
    i am tornado on line 1\ni am tornado on line 2\ni am empty but i not\n`watch -d\
    \ [period time] [command] [input]`: This argument will highlight the change in\
    \ the file after time command is repeated.\n```bash\nwatch -d cat file.txt\n```\n\
    0s every file.txt:\ni am tornado on line 1\ni am tornado on line 2\ni am empty\
