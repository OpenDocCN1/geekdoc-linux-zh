    \    return row;\n}\n```\n```\n\nThe `props` parameter is the same as the properties\
    \ property in the JSON that we retrieve from the USGS site.\n\nTo generate the\
    \ rows, we'll make another subscription to the quakes Observable. This subscription\
    \ creates a row in the table for each new earthquake received. We add the code\
    \ at the end of the `initialize` function:\n\n```\n```javascript\nexamples_earthquake_ui/code2.js\n\
    var table = document.getElementById('quakes_info');\nquakes\n    .pluck('properties')\n\
    \    .map(makeRow)\n    .subscribe(function(row) { table.appendChild(row); });\n\
    ```\n```\n\nThe `pluck` operator extracts the value of properties from each earthquake\
    \ object, because it contains all the info we need for `makeRow`. Then we map\
    \ each earthquake object to `makeRow` to transform it into a populated HTML `tr`\
    \ element. Finally, in the subscription we append every emitted row to our table.\n\
    \nThis should give us a nicely populated table whenever we receive the earthquake\
    \ data.\n\nLooks good, and it was easy enough! Still, we can make some improvements.\
    \ First, though, we need to explore an important concept in RxJS: hot and cold\
    \ Observables.\n\n# ## Hot and Cold Observables\n\n“Hot” Observables emit values\
    \ regardless of Observers being subscribed to them. On the other hand, “cold”\
    \ Observables emit the entire sequence of values from the start to every Observer."
