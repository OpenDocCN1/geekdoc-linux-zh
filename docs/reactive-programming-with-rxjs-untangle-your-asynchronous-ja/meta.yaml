    \ {\n    console.log('Subscriber 2 - eventTicks: ' + eventTicks + ' so far');\n\
    });\n```\n```\n\nAnd the expected output:\n\n> Subscriber 1 - eventTicks: 1 so\
    \ far\nSubscriber 2 - eventTicks: 1 so far\nSubscriber 1 - eventTicks: 1 so far\n\
    Subscriber 2 - eventTicks: 1 so far\nSubscriber 1 - eventTicks: 2 so far\nSubscriber\
    \ 2 - eventTicks: 2 so far\nSubscriber 1 - eventTicks: 2 so far\nSubscriber 2\
    \ - eventTicks: 2 so far\n\nUsing `scan`, we avoidExternal state altogether. We\
    \ pass the accumulated count of even ticks to `updateDistance` instead of relying\
    \ on an external variable to keep the accumulated value. This way we don't increment\
    \ the count with every new subscriber.\n\nMost of the time we can avoid relying\
    \ on external state. Common scenarios for using it are caching values or keeping\
    \ track of changing values in the program. But, as you'll see in [Spaceship Reactive!,\
    \ on page 50](Spaceship_Reactive_on_page_50), these scenarios can be handled in\
    \ several other ways. For example, when we need to cache values, [RxJS's Subject\
    \ Class, on page 45](RxJS_Subject_Class_on_page_45), can help a lot, and when\
    \ we need to keep track of previous states of the game, we can use methods like\
    \ `Rx.Observable.scan`.\n\n# ### Pipelines Are Efficient\n\nThe first time I chained\
    \ a bunch of operators into a pipeline to transform a sequence, my gut feeling\
    \ was that it couldn't possibly be efficient. I knew"
