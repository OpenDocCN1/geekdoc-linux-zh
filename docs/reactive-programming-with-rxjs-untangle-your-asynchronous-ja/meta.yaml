  md: "```\n```javascript\nspaceship_reactive/starfield_1.js\nfunction paintStars(stars)\
    \ {\n  ctx.fillStyle = '#000000';\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n\
    \  ctx.fillStyle = '#ffffff';\n  stars.forEach(function(star) {\n    ctx.fillRect(star.x,\
    \ star.y, star.size, star.size);\n  });\n}\n\nvar SPEED = 40;\nvar STAR_NUMBER\
    \ = 250;\nvar starStream = Rx.Observable.range(1, STAR_NUMBER)\n  .map(function()\
    \ {\n    return {\n      x: parseInt(Math.random() * canvas.width),\n      y:\
    \ parseInt(Math.random() * canvas.height),\n      size: Math.random() * 3 + 1\n\
    \    };\n  })\n  .toArray()\n  .flatMap(function(starArray) {\n    return Rx.Observable.interval(SPEED).map(function()\
    \ {\n      starArray.forEach(function(star) {\n        if (star.y >= canvas.height)\
    \ {\n          star.y = 0; // Reset star to top of the screen\n        }\n   \
    \     star.y += 3; // Move star\n      });\n      return starArray;\n    });\n\
    \  })\n  .subscribe(function(starArray) {\n    paintStars(starArray);\n  });\n\
    ```\n```\n\nNow that we've set the stage, it's time for our hero to make an appearance.\n\
    \n# ### Adding the Player's Spaceship\n\nNow that we have our beautiful starry\
    \ background, we're ready to program the hero's spaceship. Even though it's the\
    \ most important object in the game, our spaceship is deceptively simple. It's\
    \ an Observer of mouse moves that emits the current mouse x-coordinate and a constant\
    \ y-coordinate (the player only moves horizontally, so we never change the y-coordinate):\n\
    \n```\n```javascript\nspaceship_reactive/hero_1.js\nvar HERO_Y = canvas.height\
    \ - 30;\nvar mouseMove = Rx.Observable.fromEvent(canvas, 'mousemove');\nvar SpaceShip\
    \ = mouseMove\n```\n```"
