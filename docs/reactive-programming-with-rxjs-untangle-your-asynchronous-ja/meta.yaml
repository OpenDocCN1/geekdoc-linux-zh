- img_proc: true
  md: "transforming arrays in JavaScript by chaining operators is expensive. Yet in\
    \ this book I'm telling you to design your program by transforming sequences into\
    \ new ones. Isn't that terribly inefficient?\n\nChaining looks similar in Observables\
    \ and in arrays; there are even methods like `filter` and `map` that are present\
    \ in both types. But there's a crucial difference: array methods create a new\
    \ array as a result of each operation, which is traversed entirely by the next\
    \ operation. Observable pipelines, on the other hand, don't create intermediate\
    \ Observables and apply all operations to each element in one go. The Observable\
    \ is thus traversed only once, which makes chaining Observables efficient. Check\
    \ out the following example:\n\n```\n```javascript\nspaceship_reactive/array_chain.js\n\
    stringArray // represents an array of 1,000 strings\n.map(function(str) {\n  return\
    \ str.toUpperCase();\n})\n.filter(function(str) {\n  return /^[A-Z]+$/.test(str);\n\
    })\n.forEach(function(str) {\n  console.log(str);\n});\n```\n```\n\nLet's suppose\
    \ `stringArray` is an array with 1,000 strings that we want to convert to uppercase\
    \ and then filter out the ones that contain anything other than alphabet characters\
    \ (or no letters at all). Then we want to print each string of the resulting array\
    \ to the console.\n\nThis is what happens behind the scenes:\n\n+   - Iterate\
    \ through the array and create a new array with all items uppercase.\n- Iterate\
    \ through the uppercase array, creating another array with 1,000 elements.\n-\
    \ Iterate through the filtered array and log each result to the console.\n\nIn\
    \ the process of transforming the array, we've iterated arrays three times and\
    \ created two completely new big arrays. This is far from efficient! You shouldn't\
    \ program this way if you're concerned about performance or you're dealing with\
    \ big sequences of items.\n\nThis is what the same operation would look like using\
    \ Observables:\n\n```\n```javascript\nspaceship_reactive/array_chain.js\nstringObservable\
    \ // represents an observable emitting 1,000 strings\n.map(function(str) {\n \
    \ return str.toUpperCase();\n```\n```"
  merge: -1
  pgno: 60
- img_proc: true
  md: "```\n```javascript\n  })\n  .filter(function(str) {\n    return /^[A-Z]+$/.test(str);\n\
    \  })\n  .subscribe(function(str) {\n    console.log(str);\n  });\n```\n```\n\n\
    +   1. Create an uppercase function that will be applied to each item of the Observable\
    \ and return an Observable that will emit these new items, whenever an Observer\
    \ subscribes to it.\n2. Compose a filter function with the previous uppercase\
    \ function, and return an Observable that will emit the new items, uppercased\
    \ and filtered, but only when an Observable is subscribed to it.\n3. Trigger the\
    \ Observable to emit items, going through all of them only once and applying the\
    \ transformations we defined once per item.\n\nWith Observables, we'll go through\
    \ our list only once, and we'll apply the transformations only if absolutely required.\
    \ For example, let's say we added a take operator to our previous example:\n\n\
    ```\n```javascript\nspaceship_reactive/array_chain.js\nstringObservable\n  .map(function(str)\
    \ {\n    return str.toUpperCase();\n  })\n  .filter(function(str) {\n    return\
    \ /^[A-Z]+$/.test(str);\n  })\n  .take(5)\n  .subscribe(function(str) {\n    console.log(str);\n\
    \  });\n```\n```\n\n`take` makes the Observable emit only the first `n` items\
    \ we specify. In our case, `n` is five, so out of the thousand strings, we'll\
    \ receive only the first five. The cool part is that our code will never traverse\
    \ all the items; it will apply our transformations to only the first five."
