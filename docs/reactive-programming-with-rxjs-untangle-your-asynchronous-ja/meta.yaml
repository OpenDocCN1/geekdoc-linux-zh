    \    }\n};\n\nvar listener2 = {\n    update: function(message) {\n        console.log('Listener\
    \ 2 received:', message);\n    }\n};\n\nvar notifier = new Producer();\nnotifier.add(listener1);\n\
    notifier.add(listener2);\nnotifier.notify('Hello there!');\n```\n```"
