  md: "This tells Babel to use Cycle.js's hJSX adapter to process JSX, instead of\
    \ using the default React one.\n\nNow when we want to compile our project, we\
    \ can use the following command:\n\n```\nbrowserify index.js -t babelify --outfile\
    \ bundle.js\n```\n\n# Getting the Search Term from the User\n\nWe need a function\
    \ that returns an Observable of URLs that query Wikipedia's API using search terms\
    \ entered by the user:\n\n```\ncycle/index.js\nvar MAIN_URL = 'https://en.wikipedia.org';\n\
    var WIKI_URL = MAIN_URL + '/wiki/';\nvar API_URL = MAIN_URL + '/w/api.php?' +\n\
    'action=query&list=search&format=json&srsearch=';\n\nfunction searchRequest(responses)\
    \ {\n  return responses.DOM.select('search-field').events('input')\n    .debounce(300)\n\
    \    .map(function(e) { return e.target.value })\n    .filter(function(value)\
    \ { return value.length > 2 })\n    .map(function(search) { return API_URL + search\
    \ });\n}\n```\n\nFirst we declare some URLs our application will use to query\
    \ Wikipedia. In the function searchRequest we take a responses object that contains\
    \ all the drivers in our application, and we use the get method in the DOM driver.\
    \ select(element), event(type) behaves similarly to fromEvent: it takes a selector\
    \ for a DOM element and the type of event to listen to and returns an Observable\
    \ that emits events.\n\nFrom that moment on, the rest of the code should look\
    \ pretty familiar to you, since it consists of transforming an Observable's values\
    \ through our usual operators:\n\n+   1. Throttle results to receive one every\
    \ 300 milliseconds at most.\n2. Extract the value of the input box.\n3. Take only\
    \ text longer than two characters.\n4. Append the final value to Wikipedia's API\
    \ URL.\n\nGreat! So far we have the function to generate our UI and the function\
    \ to retrieve user input from that UI. We now need to add the functionality that\
    \ will get the information from Wikipedia."
