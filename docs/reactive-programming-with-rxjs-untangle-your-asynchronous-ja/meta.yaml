  md: '> **Joe asks:

    What’s the Virtual DOM?**


    The Document Object Model (DOM) defines the tree structure of elements in an HTML
    document. Every HTML element is a node in the DOM, and each node can be manipulated
    using methods on the node.


    The DOM was originally created to represent static documents, not the super-dynamic
    websites that we have today. As a consequence, it was not designed to have good
    performance when the elements in a DOM tree were updated frequently. That’s why
    when we make changes to the DOM there’s a performance hit.


    The *virtual DOM* is a representation of the DOM made in JavaScript. Every time
    we change state in a component, we recompute a new virtual DOM tree for the component
    and compare it with the previous tree. If there are differences, we render only
    those differences. This approach is extremely fast, because comparing JavaScript
    objects is fast and we make only the absolutely necessary changes to the “real”
    DOM.


    That approach means we can write code as if we generated the whole app UI for
    every change. We don’t have to keep track of state in the DOM. Behind the scenes,
    Cycle.js will check if there is anything different for every update and take care
    of rendering our app efficiently.


    # Installing Cycle.js


    We could use Cycle.js by including it in an HTML page using `<script></script>`
    tags, but that would not be the best way to use it because Cycle.js is designed
    in an extremely modular way. Every module tries to be as self-sufficient as possible,
    and including several modules as scripts could easily load tons of duplicated
    code, causing unnecessary downloads and longer start-up times for our applications.


    Instead, we’ll use the Node Package Manager, `npm`, and *Browserify* to generate
    the code for our final scripts. First we’ll create a new folder where the project
    will live, and install our project dependencies:


    ```

    ```bash

    mkdir wikipedia-search && cd wikipedia-search

    npm install browserify

    npm install @cycle/core

    npm install @cycle/dom

    ```

    ```


    The first `npm` command installs Browserify, which allows us to write code for
    the browser as if it were a Node.js application.² With Browserify, we can use
    Node.js’s module loader, and it will be smart about what dependencies to


    2. http://browserify.org/'
