    # Wrapping Up


    Schedulers are an essential part of RxJS. Even if you can go a long way without
    explicitly using them, they are the advanced concept that will give you the edge
    to fine-tune concurrency in your programs. The concept of virtual time is unique
    to RxJS and is incredibly useful for tasks such as testing asynchronous code.


