  md: "An Observer subscribed to a hot Observable will receive values emitted from\
    \ the exact moment it subscribes to it. Every other Observer subscribed at that\
    \ moment will receive the exact same values. This is similar to how JavaScript\
    \ events work.\n\nMouse events and a stock-exchange ticker are examples of hot\
    \ Observables. In both cases the Observable emits values regardless of whether\
    \ it has subscribers, and could already be producing values before any subscriber\
    \ is listening. Here's an example:\n\n```\n```javascript\nhot_cold.js\nvar onMove\
    \ = Rx.Observable.fromEvent(document, 'mousemove');\nvar subscriber1 = onMove.subscribe(function(e)\
    \ {\n    console.log('Subscriber1:', e.clientX, e.clientY);\n});\nvar subscriber2\
    \ = onMove.subscribe(function(e) {\n    console.log('Subscriber2:', e.clientX,\
    \ e.clientY);\n});\n```\n```\n\n```\n```\n// Result:\n// Subscriber1: 23 24\n\
    // Subscriber2: 23 24\n// Subscriber1: 34 37\n// Subscriber2: 34 37\n// Subscriber1:\
    \ 46 49\n// Subscriber2: 46 49\n// ...\n```\n```\n\nIn the example, both subscribers\
    \ receive the same values from the Observable as they are emitted. To JavaScript\
    \ programmers, that behavior feels natural because it resembles how JavaScript\
    \ events work.\n\nNow let's see how cold Observables work.\n\n# ## Cold Observables\n\
    \nA cold Observable emits values only when Observers subscribe to it.\n\nFor example,\
    \ `Rx.Observable.range` returns a cold Observable. Every new Observer that subscribes\
    \ to it will receive the whole range:\n\n```\n```javascript\nhot_cold.js\nfunction\
    \ printValue(value) {\n    console.log(value);\n}\n```\n```\n\n```\n```javascript\n\
    var rangeToFive = Rx.Observable.range(1, 5);\nvar obs1 = rangeToFive.subscribe(printValue);\
    \ // 1, 2, 3, 4, 5\n```\n```"
  merge: -1
  pgno: 90
- img_proc: true
  md: "```\n```javascript\nvar obs2 = Rx.Observable\n    .delay(2000)\n    .flatMap(function()\
    \ {\n        return rangeToFive.subscribe(printValue); // 1, 2, 3, 4, 5\n    });\n\
    ```\n```\n\nUnderstanding when we're dealing with hot or cold Observables is essential\
    \ to avoid subtle and sneaky bugs. For example, `Rx.Observable.interval` returns\
    \ an Observable that produces an increasing integer value at regular intervals\
    \ of time. Imagine we want to use it to push the same values to several Observers.\
    \ We could implement it like this:\n\n```\n```javascript\n// hot_cold.js\nvar\
    \ source = Rx.Observable.interval(2000);\nvar observer1 = source.subscribe(function\
    \ (x) {\n    console.log('Observer 1, next value: ' + x);\n});\n\nvar observer2\
    \ = source.subscribe(function (x) {\n    console.log('Observer 2, next value:\
    \ ' + x);\n});\n```\n```\n\nOutput:\n\n> > Observer 1, next value: 0\n> Observer\
    \ 2, next value: 0\n> Observer 1, next value: 1\n> Observer 2, next value: 1\n\
    > ...\n\nThat seems to work. But now imagine that we need the second subscriber\
    \ to join three seconds after the first one:\n\n```\n```javascript\n// hot_cold.js\n\
    var source = Rx.Observable.interval(1000);\nvar observer1 = source.subscribe(function\
    \ (x) {\n    console.log('Observer 1: ' + x);\n});\n\nsetTimeout(function() {\n\
    \    var observer2 = source.subscribe(function (x) {\n        console.log('Observer\
    \ 2: ' + x);\n    });\n}, 3000);\n```\n```\n\nOutput:\n\n> > Observer 1: 0\n>\
    \ Observer 1: 1\n> Observer 1: 2\n> Observer 1: 3"
