  md: "In the preceding code, the get function uses create to wrap XMLHttpRequest.\
    \ If the HTTP GET request is successful, we emit its contents and complete the\
    \ sequence (our Observable will only ever emit one result). Otherwise, we emit\
    \ an error. On the last line we call the function with a particular URL to retrieve.\
    \ This will create the Observable, but it won't make any request yet. This is\
    \ important: Observables don't do anything until at least one Observer subscribes\
    \ to them. So let's take care of that:\n\n```\n// Subscribe an Observer to it\n\
    test.subscribe({\n    function onNext(x) { console.log('Result: ' + x); },\n \
    \   function onError(err) { console.log('Error: ' + err); },\n    function onCompleted()\
    \ { console.log('Completed'); }\n});\n```\n\nThe first thing to notice is that\
    \ we're not explicitly creating an Observer like we did in the code on page 11.\
    \ Most of the time we'll use this shorter version, in which we call the subscribe\
    \ operator in the Observable with the three functions for the Observer cases:\
    \ onNext, onCompleted, and onError.\n\nsubscribe then sets everything in motion.\
    \ Before the subscription, we had merely declared how the Observable and Observer\
    \ duo will interact. It is only when we call subscribe that the gears start turning.\n\
    \n# There Is (Almost) Always an Operator\n\nIn RxJS, methods that transform or\
    \ query sequences are called operators. Operators are found in the static Rx.Observable\
    \ object and in Observable instances. In our example, create is one such operator.\n\
    \ncreate is a good choice when we have to create a very specific Observable, but\
    \ RxJS provides plenty of other operators that make it easy to create Observables\
    \ for common sources.\n\nLet's look again at our previous example. For such a\
    \ common operation as an Ajax request there is often an operator ready for us\
    \ to use. In this case, the RxJS DOM library provides several ways to create Observables\
    \ from DOM-related sources. Since we're doing a GET request, we can use Rx.DOM.Request.get,\
    \ and our code then becomes this:\n\n```\nRx.DOM.get('/api/contents.json').subscribe({\n\
    \    function onNext(data) { console.log(data.response); },\n    function onError(err)\
    \ { console.error(err); }\n});\n```\n\n3. https://github.com/Reactive-Extensions/RxJS-DOM"
