  md: "```\n```javascript\nvar observer = Rx.Observer.create({\n    function onNext(x)\
    \ { console.log('Next: ' + x); },\n    function onError(err) { console.log('Error:\
    \ ' + err); },\n    function onCompleted() { console.log('Completed'); }\n});\n\
    ```\n```\n\nThe create method in the Rx.Observer object takes functions for the\
    \ onNext, onCompleted, and onError cases and returns an Observer instance. These\
    \ three functions are optional, and you can decide which ones to include. For\
    \ example, if we are subscribing to an infinite sequence such as clicks on a button\
    \ (the user could keep clicking forever), the onCompleted handler will never be\
    \ called. If we're confident that the sequence can't error (for example, by making\
    \ an Observable from an array of numbers), we don't need the onError method.\n\
    \n# ## Making Ajax Calls with an Observable\n\nWe haven't done anything really\
    \ useful with Observables yet. How about creating an Observable that retrieves\
    \ remote content? To do this, we'll wrap the XMLHttpRequest request using Rx.Observable.create:\n\
    \n```\n```javascript\nfunction get(url) {\n    return Rx.Observable.create(function(observer)\
    \ {\n        // Make a traditional Ajax request\n        var req = new XMLHttpRequest();\n\
    \        req.open('GET', url);\n\n        req.onload = function() {\n        \
    \    if (req.status == 200) {\n                // If the status is 200, meaning\
    \ there have been no problems,\n                // Yield the result to listeners\
    \ and complete the sequence\n                observer.onNext(req.response);\n\
    \                observer.onCompleted();\n            }\n            else {\n\
    \                // Otherwise, signal to listeners that there has been an error\n\
    \                observer.onError(new Error(req.statusText));\n            }\n\
    \        };\n\n        req.onerror = function() {\n            observer.onError(new\
    \ Error(\"Unknown Error\"));\n        };\n\n        req.send();\n    });\n}\n\n\
    // Create an Ajax Observable\nvar test = get('/api/contents.json');\n```\n```"
