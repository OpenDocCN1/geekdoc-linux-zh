  md: '# # The Modern Web


    Get up to speed on the latest HTML, CSS, and JavaScript techniques.


    # ## HTML5 and CSS3 (2nd edition)


    HTML5 and CSS3 are more than just buzzwords—they''re the foundation for today''s
    web applications. This book gets you up to speed on the HTML5 elements and CSS3
    features you can use right now in your current projects, with backwards compatible
    solutions that ensure that you don''t leave users of older browsers behind. This
    new edition covers even more new features, including CSS animations, IndexedDB,
    and client-side validations.


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_138_0.png)


    Brian P. Hogan

    (314 pages) ISBN: 9781937785589. 838

    https://pragprog.com/book/bhh52e


    # ## Async JavaScript


    With the advent of HTML5, front-end MVC, and Node.js, JavaScript is ubiquitous—and
    still messy. This book will give you a solid foundation for managing async tasks
    without losing your sanity in a tangle of callbacks. It''s a fast-paced guide
    to the most essential techniques for dealing with async behavior, including PubSub,
    evented models, and Promises. With these tricks up your sleeve, you''ll be better
    prepared to manage the complexity of large web apps and deliver responsive code.


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_138_1.png)


    Trevor Burnham

    (104 pages) ISBN: 9781937785277. 817

    https://pragprog.com/book/tbajs'
  merge: -1
  pgno: 138
- img_proc: true
  md: '# # Long Live the Command Line!


    Use tmux and Vim for incredible mouse-free productivity.


    # ## tmux


    Your mouse is slowing you down. The time you spend context switching between your
    editor and your consoles eats away at your productivity. Take control of your
    environment with tmux, a terminal multiplexer that you can tailor to your workflow.
    Learn how to customize, script, and leverage tmux''s unique abilities and keep
    your fingers on your keyboard''s home row.


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_139_0.png)


    Drew P. Hogan

    (88 pages) ISBN: 9781934356968. $16.25

    https://pragprog.com/book/bhtmux


    # ## Practical Vim, Second Edition


    Vim is a fast and efficient text editor that will make you a faster and more efficient
    developer. It''s available on almost every OS, and if you master the techniques
    in this book, you''ll never need another text editor. In more than 120 Vim tips,
    you''ll quickly learn the editor''s core functionality and tackle your trickiest
    editing and writing tasks. This beloved bestseller has been revised and updated
    to Vim 7.4 and includes three brand-new tips and five fully revised tips.


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_139_1.png)


    Drew Neil

    (354 pages) ISBN: 9781680501278. $29

    https://pragprog.com/book/dnvim2'
  merge: -1
  pgno: 139
