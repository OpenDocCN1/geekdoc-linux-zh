- md: "## Cycle.js Drivers\n\nCycle.js drivers are functions we use to cause side\
    \ effects. Nowhere else in our programs should we be modifying state in any way.\
    \ Drivers take an Observable that emits data from our application, and they return\
    \ another Observable that causes the side effects.\n\nWe won’t be creating drivers\
    \ very often—only when we need side effects like modifying the DOM, reading and\
    \ writing from other interfaces (for example, Local Storage), or making requests.\
    \ In most applications we’ll need only the DOM driver (which renders web pages)\
    \ and the HTTP driver (which we can use to make HTTP requests). In this example,\
    \ we’ll use yet another one, the JSONP driver.\n\n## The User Interface\n\nWe\
    \ need actual content for our page, not just a `span`. Let’s make a function that\
    \ creates the virtual tree that represents our page:\n\n```javascript\n// cycle/index.js\n\
    function vtreeElements(results) {\n    var h = CycleDOM.h;\n    return h('div',\
    \ [\n        h('h1', 'Wikipedia Search '),\n        h('input', {className: 'search-field',\
    \ attributes: {type: 'text'}}),\n        h('hr'),\n        h('div', results.map(function(result)\
    \ {\n            return h('div', {\n                h('a', { href: WIKI_URL +\
    \ result.title }, result.title)\n            });\n        }))\n    ]);\n}\n```\n\
    \nThis function might look a bit strange, but don’t panic. It is using *Virtual\
    \ Hyperscript*, a domain-specific language for creating virtual DOM trees. Virtual\
    \ Hyperscript contains a single method, called `h`. `h` declares nodes in a way\
    \ similar to how HTML does, but using JavaScript. We can add attributes to elements\
    \ or append children to them by passing extra objects or arrays as parameters\
    \ to `h`. The resulting virtual tree will eventually be rendered into real browser\
    \ DOM.\n\nvtreeElements takes an array of objects, results, and returns a virtual\
    \ tree that represents the simple UI for our app. It renders an input field and\
    \ a listing of links made from the objects in results, which eventually will contain\
    \ Wikipedia’s search results. We’ll use vtreeElements to render our application.\n\
    \n## Using JSX\n\nInstead of using the `h` function, we could write our UI using\
    \ JSX, an XML-like syntax extension invented by Facebook that makes writing virtual\
    \ DOM structures easier and more readable. Our `vtreeElements` function would\
    \ look like this:\n\n```javascript\n// cycle/index.js\nfunction vtreeElementsJSX(results)\
    \ {\n    results = results.map(function(result) {\n        var link = WIKI_URL\
    \ + result.title;\n        return <div><a href={(link)}>{result.title}</a></div>\n\
    \    });\n\n    return <div>\n        <h1>Wikipedia Search</h1>\n        <input\
    \ className=\"search-field\" type=\"text\" />\n        <hr/>\n        <div>{results}</div>\n\
    \    </div>\n}\n```\n\nDoesn't it look nicer? JSX looks more familiar to developers\
    \ because it resembles HTML, but we can write it alongside JavaScript code, with\
    \ the added advantage that we can treat it as a JavaScript type. For example,\
    \ notice how we iterate the results array and we return a `<div>` element directly,\
    \ using the value of `link` and `result.title` in the element itself. (JavaScript\
    \ values can be inlined by putting them inside curly brackets.)\n\nSince JSX is\
    \ a syntax extension, we need a compiler that transforms it into the final JavaScript\
    \ code (which looks very much like our `h`-based code from the previous section).\
    \ We'll use *Babel* for that. Babel is a compiler that transforms modern JavaScript\
    \ into JavaScript that runs everywhere. (https://babeljs.io) It also transforms\
    \ some JavaScript extensions, such as JSX, which is their particular use case.\n\
    \nIf you want to use JSX, you need to install Babel and use it when compiling\
    \ the project. Fortunately, Babel has an adapter for Browserify called *Babelify*:\n\
    \n```bash\nnpm install babelify\n```\n\nIn every file that uses JSX, we need to\
    \ add the following lines at the top of the file:\n\n```javascript\n/** @jsx hJSX\
    \ */\nvar hJSX = CycleDOM.hJSX;\n```\n\nThis tells Babel to use Cycle.js's hJSX\
    \ adapter to process JSX, instead of using the default React one.\n\nNow when\
    \ we want to compile our project, we can use the following command:\n\n```bash\n\
    browserify index.js -t babelify --outfile bundle.js\n```\n\n## Getting the Search\
    \ Term from the User\n\nWe need a function that returns an Observable of URLs\
    \ that query Wikipedia's API using search terms entered by the user:\n\n```javascript\n\
    // cycle/index.js\nvar MAIN_URL = 'https://en.wikipedia.org';\nvar WIKI_URL =\
    \ MAIN_URL + '/wiki/';\nvar API_URL = MAIN_URL + '/w/api.php?' +\n'action=query&list=search&format=json&srsearch=';\n\
    \nfunction searchRequest(responses) {\n  return responses.DOM.select('search-field').events('input')\n\
    \    .debounce(300)\n    .map(function(e) { return e.target.value })\n    .filter(function(value)\
    \ { return value.length > 2 })\n    .map(function(search) { return API_URL + search\
    \ });\n}\n```\n\nFirst we declare some URLs our application will use to query\
    \ Wikipedia. In the function searchRequest we take a responses object that contains\
    \ all the drivers in our application, and we use the get method in the DOM driver.\
    \ select(element), event(type) behaves similarly to fromEvent: it takes a selector\
    \ for a DOM element and the type of event to listen to and returns an Observable\
    \ that emits events.\n\nFrom that moment on, the rest of the code should look\
    \ pretty familiar to you, since it consists of transforming an Observable's values\
    \ through our usual operators:\n\n- 1. Throttle results to receive one every 300\
    \ milliseconds at most.\n- 2. Extract the value of the input box.\n- 3. Take only\
    \ text longer than two characters.\n- 4. Append the final value to Wikipedia's\
    \ API URL.\n\nGreat! So far we have the function to generate our UI and the function\
    \ to retrieve user input from that UI. We now need to add the functionality that\
    \ will get the information from Wikipedia.\n\n## Revising Our main Function\n\n\
    You may have noticed in the code on page 106 that the main function takes a parameter,\
    \ responses, that we’re not using. These are the responses that come from drivers\
    \ in the run function. The drivers and the main function form a cycle (hence the\
    \ name of the framework): the output of main is the input of the drivers, and\
    \ the output of the drivers is the input for main. And remember, input and outputs\
    \ are always Observables.\n\nWe use JSONP to query Wikipedia, as we did in Chapter\
    \ 2. We using JSONP instead of HTTP to make it easier to run this example on our\
    \ local computers, since retrieving data from a different domain using HTTP causes\
    \ some browsers to block those requests for security reasons. In almost any other\
    \ situation, especially in production code, use HTTP to retrieve remote data.\n\
    \nIn any case, using JSONP doesn’t affect the point of this chapter. Cycle has\
    \ an experimental module for JSONP, and we can install it using npm:\n\n```bash\n\
    npm install @cycle/jsonp\n```\n\nThen we use it in our application like this:\n\
    \n```javascript\n// cycle/step2.js\nvar Cycle = require('@cycle/core');\nvar CycleDOM\
    \ = require('@cycle/dom');\nvar CycleJSONP = require('@cycle/jsonp');\nvar Rx\
    \ = Cycle.Rx;\nvar h = CycleDOM.h;\n\nfunction searchRequest(responses) {\n  return\
    \ responses.DOM.select('.search-field').events('input')\n    .debounce(300)\n\
    \    .map(function(e) { return e.target.value })\n    .filter(function(value)\
    \ { return value.length > 2 })\n    .map(function(search) { return API_URL + search\
    \ });\n}\n\nfunction vtreeElements(results) {\n  return h('div', [\n    h('h1',\
    \ 'Wikipedia Search '),\n    h('input', {className: 'search-field', attributes:\
    \ {type: 'text'}}),\n    h('hr'),\n    h('div', results.map(function(result) {\n\
    \      return h('div', {\n        h('a', { href: WIKI_URL + result.title }, result.title)\n\
    \      });\n    }))\n  ]);\n}\n\nfunction main(responses) {\n    return {\n  \
    \      DOM: Rx.Observable.just(CycleDOM.h('span', 'Hey there!')),\n        JSONP:\
    \ searchRequest(responses)\n    };\n}\n\nvar drivers = {\n    DOM: CycleDOM.makeDOMDriver('#container'),\n\
    \    JSONP: CycleJSONP.makeJSONPDriver()\n};\n\nCycle.run(main, drivers);\n```\n\
    \nWe want to plug the result of the searchRequest into the JSONP driver, so that\
    \ as soon as the user types a search term, we query Wikipedia with the term.\n\
    \nTo do that, we create a new JSONP driver using CycleJSONP.makeJSONPDriver, which\
    \ will receive whatever we put in the property JSONP in the return object from\
    \ main. After doing that, we should already be querying return when we introduce\
    \ a search term in the input box, but since we're not connecting the JSONP output\
    \ to anything, we don't see any changes on the page. Let's change that:\n\n```javascript\n\
    // cycle/step3.js\nfunction main(responses) {\n    var vtree$ = responses.JSONP\n\
    \        .filter(function(res) {\n            return res.request.indexOf(API_URL)\
    \ === 0;\n        })\n        .mergeAll()\n        .pluck('query', 'search')\n\
    \        .startWith([])\n        .map(vtreeElements);\n\n    return {\n      \
    \  DOM: vtree$,\n        JSONP: searchRequest(responses)\n    };\n}\n```\n\nmain\
    \ receives the output of all drivers through its responses parameter. We can get\
    \ the result of the JSON call in responses.JSONP, an Observable of all the JSONP\
    \ responses in our application. Once we have that, we can transform the Observable\
    \ to get the search results in the form we want:"
  mdcn: "\n## Cycle.js 驱动程序 (Drivers)\n\nCycle.js 驱动程序是我们用来产生副作用的函数。在程序的其他任何地方，我们都不应该以任何方式修改状态。驱动程序接收一个从应用程序发出数据的\
    \ Observable，并返回另一个产生副作用的 Observable。\n\n我们不会经常创建驱动程序——只有在需要副作用时才会创建，例如修改 DOM、从其他接口（例如\
    \ Local Storage）读取和写入，或发起请求。在大多数应用程序中，我们只需要 DOM 驱动程序（用于渲染网页）和 HTTP 驱动程序（用于发起 HTTP\
    \ 请求）。在本例中，我们将使用另一个驱动程序：JSONP 驱动程序。\n\n## 用户界面\n\n我们需要页面的实际内容，而不仅仅是一个 `span`。让我们创建一个函数来构建代表页面的虚拟树：\n\
    \n```javascript\n// cycle/index.js\nfunction vtreeElements(results) {\n    var\
    \ h = CycleDOM.h;\n    return h('div', [\n        h('h1', 'Wikipedia Search '),\n\
    \        h('input', {className: 'search-field', attributes: {type: 'text'}}),\n\
    \        h('hr'),\n        h('div', results.map(function(result) {\n         \
    \   return h('div', {\n                h('a', { href: WIKI_URL + result.title\
    \ }, result.title)\n            });\n        }))\n    ]);\n}\n```\n\n这个函数看起来可能有点奇怪，但请不要惊慌。它使用的是\
    \ *Virtual Hyperscript*，一种用于创建虚拟 DOM 树的领域特定语言。Virtual Hyperscript 包含一个名为 `h` 的单一方法。`h`\
    \ 声明节点的方式与 HTML 类似，但使用的是 JavaScript。我们可以通过向 `h` 传递额外的对象或数组作为参数，来为元素添加属性或附加子节点。最终，生成的虚拟树将被渲染成真实的浏览器\
    \ DOM。\n\nvtreeElements 接收一个对象数组 `results`，并返回一个代表我们应用简单 UI 的虚拟树。它渲染一个输入字段以及由\
    \ `results` 中的对象生成的链接列表，该列表最终将包含维基百科的搜索结果。我们将使用 vtreeElements 来渲染我们的应用程序。\n\n\
    ## 使用 JSX\n\n我们可以使用 JSX 来编写 UI，而不是使用 `h` 函数。JSX 是由 Facebook 发明的一种类 XML 语法扩展，它使编写虚拟\
    \ DOM 结构变得更简单且更具可读性。我们的 `vtreeElements` 函数将变成这样：\n\n```javascript\n// cycle/index.js\n\
    function vtreeElementsJSX(results) {\n    results = results.map(function(result)\
    \ {\n        var link = WIKI_URL + result.title;\n        return <div><a href={(link)}>{result.title}</a></div>\n\
    \    });\n\n    return <div>\n        <h1>Wikipedia Search</h1>\n        <input\
    \ className=\"search-field\" type=\"text\" />\n        <hr/>\n        <div>{results}</div>\n\
    \    </div>\n}\n```\n\n是不是看起来更美观了？JSX 对开发人员来说更熟悉，因为它类似于 HTML，但我们可以将其与 JavaScript\
    \ 代码一起编写，并且具有可以将它视为 JavaScript 类型的额外优势。例如，请注意我们如何迭代 `results` 数组并直接返回一个 `<div>`\
    \ 元素，在元素本身中使用 `link` 和 `result.title` 的值。（JavaScript 的值可以通过将其放在花括号内来内联。）\n\n由于\
    \ JSX 是一种语法扩展，我们需要一个编译器将其转换为最终的 JavaScript 代码（其形式与前一节中基于 `h` 的代码非常相似）。我们将为此使用\
    \ *Babel*。Babel 是一个将现代 JavaScript 转换为可在任何地方运行的 JavaScript 的编译器 (https://babeljs.io)。它还转换一些\
    \ JavaScript 扩展，例如 JSX，这是其一个特定的用例。\n\n如果你想使用 JSX，需要安装 Babel 并在编译项目时使用它。幸运的是，Babel\
    \ 为 Browserify 提供了一个名为 *Babelify* 的适配器：\n\n```bash\nnpm install babelify\n```\n\
    \n在每个使用 JSX 的文件中，我们需要在文件顶部添加以下行：\n\n```javascript\n/** @jsx hJSX */\nvar hJSX\
    \ = CycleDOM.hJSX;\n```\n\n这告诉 Babel 使用 Cycle.js 的 hJSX 适配器来处理 JSX，而不是使用默认的 React\
    \ 适配器。\n\n现在当我们想要编译项目时，可以使用以下命令：\n\n```bash\nbrowserify index.js -t babelify --outfile\
    \ bundle.js\n```\n\n## 获取用户的搜索词\n\n我们需要一个函数，该函数返回一个 Observable，用于使用用户输入的搜索词查询维基百科的\
    \ API：\n\n```javascript\n// cycle/index.js\nvar MAIN_URL = 'https://en.wikipedia.org';\n\
    var WIKI_URL = MAIN_URL + '/wiki/';\nvar API_URL = MAIN_URL + '/w/api.php?' +\n\
    'action=query&list=search&format=json&srsearch=';\n\nfunction searchRequest(responses)\
    \ {\n  return responses.DOM.select('search-field').events('input')\n    .debounce(300)\n\
    \    .map(function(e) { return e.target.value })\n    .filter(function(value)\
    \ { return value.length > 2 })\n    .map(function(search) { return API_URL + search\
    \ });\n}\n```\n\n首先，我们声明应用程序将用于查询维基百科的一些 URL。在 `searchRequest` 函数中，我们接收一个包含应用程序中所有驱动程序的\
    \ `responses` 对象，并使用 DOM 驱动程序中的 `get` 方法。`select(element), event(type)` 的行为与 `fromEvent`\
    \ 类似：它接收一个 DOM 元素的选择器和要监听的事件类型，并返回一个发出事件的 Observable。\n\n从那一刻起，其余的代码对你来说应该非常熟悉，因为它是通过我们常用的运算符来转换\
    \ Observable 的值：\n\n- 1. 节流（Throttle）结果，确保最多每 300 毫秒接收一个。\n- 2. 提取输入框的值。\n- 3.\
    \ 仅保留长度超过两个字符的文本。\n- 4. 将最终值附加到维基百科的 API URL 之后。\n\n太棒了！到目前为止，我们已经有了生成 UI 的函数和从该\
    \ UI 检索用户输入的函数。现在我们需要添加从维基百科获取信息的功能。\n\n## 修订 our main 函数\n\n你可能已经注意到 106 页代码中的\
    \ `main` 函数接收一个参数 `responses`，但我们还没有使用它。这些是来自 `run` 函数中驱动程序的响应。驱动程序和 `main` 函数构成了一个循环（这也是该框架名称的由来）：`main`\
    \ 的输出是驱动程序的输入，而驱动程序的输出则是 `main` 的输入。请记住，输入和输出始终是 Observable。\n\n我们使用 JSONP 来查询维基百科，就像我们在第\
    \ 2 章中做的那样。我们使用 JSONP 而不是 HTTP 是为了让这个示例在本地计算机上更容易运行，因为使用 HTTP 从不同域名检索数据会导致某些浏览器出于安全原因拦截这些请求。在几乎任何其他情况下，尤其是在生产代码中，请使用\
    \ HTTP 来检索远程数据。\n\n无论如何，使用 JSONP 不影响本章的重点。Cycle 为 JSONP 提供了一个实验性模块，我们可以使用 npm\
    \ 安装它：\n\n```bash\nnpm install @cycle/jsonp\n```\n\n然后在应用程序中这样使用它：\n\n```javascript\n\
    // cycle/step2.js\nvar Cycle = require('@cycle/core');\nvar CycleDOM = require('@cycle/dom');\n\
    var CycleJSONP = require('@cycle/jsonp');\nvar Rx = Cycle.Rx;\nvar h = CycleDOM.h;\n\
    \nfunction searchRequest(responses) {\n  return responses.DOM.select('.search-field').events('input')\n\
    \    .debounce(300)\n    .map(function(e) { return e.target.value })\n    .filter(function(value)\
    \ { return value.length > 2 })\n    .map(function(search) { return API_URL + search\
    \ });\n}\n\nfunction vtreeElements(results) {\n  return h('div', [\n    h('h1',\
    \ 'Wikipedia Search '),\n    h('input', {className: 'search-field', attributes:\
    \ {type: 'text'}}),\n    h('hr'),\n    h('div', results.map(function(result) {\n\
    \      return h('div', {\n        h('a', { href: WIKI_URL + result.title }, result.title)\n\
    \      });\n    }))\n  ]);\n}\n\nfunction main(responses) {\n    return {\n  \
    \      DOM: Rx.Observable.just(CycleDOM.h('span', 'Hey there!')),\n        JSONP:\
    \ searchRequest(responses)\n    };\n}\n\nvar drivers = {\n    DOM: CycleDOM.makeDOMDriver('#container'),\n\
    \    JSONP: CycleJSONP.makeJSONPDriver()\n};\n\nCycle.run(main, drivers);\n```\n\
    \n我们希望将 `searchRequest` 的结果接入 JSONP 驱动程序，这样一旦用户输入搜索词，我们就可以用该词查询维基百科。\n\n为此，我们使用\
    \ `CycleJSONP.makeJSONPDriver` 创建一个新的 JSONP 驱动程序，它将接收我们在 `main` 返回对象的 `JSONP`\
    \ 属性中放置的任何内容。完成之后，当我们在输入框中输入搜索词时，应该已经在查询了，但由于我们没有将 JSONP 的输出连接到任何地方，所以我们在页面上看不到任何变化。让我们改变这一点：\n\
    \n```javascript\n// cycle/step3.js\nfunction main(responses) {\n    var vtree$\
    \ = responses.JSONP\n        .filter(function(res) {\n            return res.request.indexOf(API_URL)\
    \ === 0;\n        })\n        .mergeAll()\n        .pluck('query', 'search')\n\
    \        .startWith([])\n        .map(vtreeElements);\n\n    return {\n      \
    \  DOM: vtree$,\n        JSONP: searchRequest(responses)\n    };\n}\n```\n\n`main`\
    \ 通过其 `responses` 参数接收所有驱动程序的输出。我们可以在 `responses.JSONP` 中获取 JSON 调用的结果，这是一个包含应用程序中所有\
    \ JSONP 响应的 Observable。一旦有了它，我们就可以转换该 Observable 以获得我们想要的格式的搜索结果：\n"
