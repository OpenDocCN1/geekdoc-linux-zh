    \n## Wrapping Up\n\nIn this chapter we explored the reactive approach to programming\
    \ and saw how RxJS can solve the problems of other methods, such as callbacks\
    \ or promises, through Observables. Now you understand why Observables are powerful,\
    \ and you know how to create them. Armed with this foundation, we can now go on\
    \ to create more interesting reactive programs. The next chapter shows you how\
    \ to create and compose sequence-based programs that provide a more “Observable”\
    \ approach to some common scenarios in web development.\n\n# CHAPTER 2: Deep in\
    \ the Sequence\n\nI have childhood memories of playing a puzzle video game in\
    \ which you had to guide a falling stream of water across the screen using all\
    \ kinds of tricks. You could split the stream, merge them back later, or use a\
    \ tilted plank of wood to change their direction. You had to be creative to make\
    \ the water reach its final goal.\n\nI find a lot of similarities between that\
    \ game and working with Observable sequences. Observables are just streams of\
    \ events that we can transform, combine, and query. It doesn't matter whether\
    \ we're dealing with simple Ajax callbacks or processing gigabytes of data in\
    \ Node.js. The way we declare our flows is the same. Once we think in streams,\
    \ the complexity of our programs goes down.\n\nIn this chapter we focus on how\
    \ to effectively use sequences in our programs. So far we've covered how to create\
    \ Observables and do simple operations with them. To unleash their power, we have\
    \ to know how to translate our program inputs and outputs into sequences that\
    \ carry our program flow.\n\nBefore we get our hands dirty, we'll meet some of\
    \ the basic operators that will help us start to manipulate sequences. Next we'll\
