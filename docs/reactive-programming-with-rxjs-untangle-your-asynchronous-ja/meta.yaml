  md: "The features array contains an object with the data for every earthquake that\
    \ happened today. That's a truckload of data! It's amazing (and terrifying) how\
    \ many earthquakes happen in a single day. For our program we'll need only the\
    \ coordinates, title, and magnitude for each earthquake.\n\nWe first want to create\
    \ an Observable that retrieves the dataset and emits single earthquakes. Here's\
    \ a first version:\n\n```\nexamples_earthquake_code.js\nvar quakes = Rx.Observable.create(function(observer)\
    \ {\n  window.eqfeed_callback = function(response) {\n    var quakes = response.features;\n\
    \    quakes.forEach(function(quake) {\n      observer.onNext(quake);\n    });\n\
    \  };\n\n  loadJSONP(QUAKE_URL);\n});\n\nquakes.subscribe(function(quake) {\n\
    \  var coords = quake.geometry.coordinates;\n  var size = quake.properties.mag\
    \ * 10000;\n\n  L.circle([coords[1], coords[0]], size).addTo(map);\n});\n```\n\
    \nWait, what is that blatant global function `window.eqfeed_callback` doing in\
    \ our code? Well, it turns out that JSONP URLs often provide a way—by adding a\
    \ querystring in the URL—to specify the function name to handle the response,\
    \ but the USGS site doesn't allow that, so we need to create a global function\
    \ with the name they decided we must use, which is `eqfeed_callback`.\n\nOur Observable\
    \ emits all earthquakes in order. We have an earthquake generator now! We don't\
    \ have to care about asynchronous flows or about having to put all of our logic\
    \ in the same function. As long as we subscribe to the Observable, earthquakes\
    \ will just come to us.\n\nBy having the earthquake retrieval “blackboxed” in\
    \ the `quakes` Observable, we can now subscribe to it and process each earthquake.\
    \ Then we'll draw a circle for each earthquake with a size proportional to its\
    \ magnitude.\n\n# Going Deeper\n\nCan we do better? You bet! In the preceding\
    \ code, we're still managing flow by traversing the array and calling `onNext`\
    \ to yield each earthquake, even if we isolated it inside the Observable. So much\
    \ for reactiveness!"
