- md: "```\nObserver 2: 0\nObserver 1: 4\nObserver 2: 1\n...\n```\n\nNow we see that\
    \ something is really off. When subscribing three seconds later, observer2 receives\
    \ all the values that the source already pushed, instead of starting with the\
    \ current value and continuing from there, because Rx.Observable.interval is a\
    \ *cold* Observable. If the difference between hot and cold Observables is not\
    \ clear, scenarios like this can be surprising.\n\nIf we have several Observers\
    \ listening to a cold Observable, they will receive copies of the same sequence\
    \ of values. So strictly speaking, although the Observers are sharing the same\
    \ Observable, they are not sharing the same exact sequence of values. If we want\
    \ the Observers to share the same sequence, we need a hot Observable.\n\n## From\
    \ Cold to Hot Using publish\n\nWe can turn a cold Observable into a hot one using\
    \ `publish`. Calling publish creates a new Observable that acts as a proxy to\
    \ the original one. It does that by subscribing itself to the original and pushing\
    \ the values it receives to its subscribers.\n\nA *published* Observable is actually\
    \ a `ConnectableObservable`, which has an extra method called `connect` that we\
    \ call to start receiving values. This allows us to subscribe to it before it\
    \ starts running:\n\n```javascript\nhot_cold.js\n// Create an Observable that\
    \ yields a value every second\nvar source = Rx.Observable.interval(1000);\nvar\
    \ publisher = source.publish();\n\n// Even if we are subscribing, no values are\
    \ pushed yet.\nvar observer1 = publisher.subscribe(function (x) {\n    console.log('Observer\
    \ 1: ' + x);\n});\n\n// publisher connects and starts publishing values\npublisher.connect();\n\
    \nsetTimeout(function() {\n    // 5 seconds later, observer2 subscribes to it\
    \ and starts receiving\n    // current values, not the whole sequence.\n    var\
    \ observer2 = publisher.subscribe(function (x) {\n        console.log('Observer\
    \ 2: ' + x);\n    });\n}, 5000);\n```\n\n## Sharing a Cold Observable\n\nLet's\
    \ get back to our earthquake example. The code we have so far looks reasonable;\
    \ we have an Observable quakes with two subscriptions: one that paints earthquakes\
    \ on the map, and one that lists them in the table.\n\nBut we can make our code\
    \ much more efficient. By having two subscribers to quakes we're, in fact, requesting\
    \ the data twice. You can check that by putting a `console.log` inside the `flatMap`\
    \ operator in quakes.\n\nThis happens because quakes is a cold Observable, and\
    \ it will re-emit all its values to each new subscriber, so a new subscription\
    \ means a new JSONP request. This impacts our application performance by requesting\
    \ the same resources twice over the network.\n\nFor the next example we'll use\
    \ the `share` operator, which automatically creates a subscription to the Observable\
    \ when the number of Observers goes from zero to one. This saves us from calling\
    \ connect:\n\n```javascript\nexamples_earthquake_ui/code2.js\nvar quakes = Rx.Observable\n\
    \    .interval(5000)\n    .flatMap(function() {\n        return Rx.DOM.jsonpRequest({\n\
    \            url: QUAKE_URL,\n            jsonpCallback: 'eqfeed_callback'\n \
    \       });\n    })\n    .flatMap(function(result) {\n        return Rx.Observable.from(result.response.features);\n\
    \    })\n    .distinct(function(quake) { return quake.properties.code; })\n  \
    \  .share()\n```\n\nNow quakes behaves like a hot Observable, and we don't have\
    \ to worry about how many Observers we connect to it, since they will all receive\
    \ the exact same data.\n\n## Buffering Values\n\nOur preceding code works well,\
    \ but notice that we insert a `tr` node every time we receive information about\
    \ an earthquake. That's inefficient, because with each insertion we're modifying\
    \ the DOM and causing a repaint of the page, making the browser do unnecessary\
    \ work to calculate the new layout. This can cause noticeable performance drop.\n\
    \nIdeally, we would batch several incoming earthquake objects and insert each\
    \ batch every few seconds. That would be tricky to implement by hand because we'd\
    \ have to keep counters and element buffers, and we would have to remember to\
    \ reset them with every batch. But with RxJS we can just use one of the buffer-based\
    \ RxJS operators, like `bufferWithTime`.\n\nWith `bufferWithTime` we can buffer\
    \ incoming values and release them as an array every $x$ period of time:\n\n```javascript\n\
    examples_earthquake_ui/code3.bufferWithTime.js\nvar table = document.getElementById('quakes_info');\n\
    quakes\n  .pluck('properties')\n  .map(makeRow)\n  .bufferWithTime(500)\n  .filter(function(rows)\
    \ { return rows.length > 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      fragment.appendChild(row);\n    });\n\
    \    return fragment;\n  })\n  .subscribe(function(fragment) {\n    table.appendChild(fragment);\n\
    \  });\n```\n\nThis is what's going on in the new code:\n\n- 1. Buffer every incoming\
    \ value and release the batch of values every 500 milliseconds.\n- 2. `bufferWithTime`\
    \ executes every 500ms no matter what, and if there have been no incoming values,\
    \ it will yield an empty array. We'll filter those.\n- 3. We insert every row\
    \ into a *document fragment*, which is a document without a parent. This means\
    \ it's not in the DOM, and modifying its contents is very fast and efficient.\n\
    - 4. Finally, we append the fragment to the DOM. An advantage of appending a fragment\
    \ is that it counts as a single operation, causing just one redraw. It also appends\
    \ the fragment's children to the same element to which we're appending the fragment\
    \ itself.\n\nUsing buffers and fragments, we manage to keep row insertion performant\
    \ while keeping the real-time nature of our application (with a maximum delay\
    \ of half a second). Now we're ready to add the next feature to our dashboard:\
    \ interactivity!\n\n## Adding Interaction\n\nWe now have earthquakes on the map\
    \ and in a list, but no interaction between both representations yet. It would\
    \ be nice, for example, to center an earthquake on the map whenever we click on\
    \ it on the list, and to highlight an earthquake with a circle on the map when\
    \ we move the mouse over its row. Let’s get to it.\n\nIn Leaflet, you can draw\
    \ on a map and put drawings in their own layers so you can manipulate them individually.\
    \ Let’s create a group of layers called quakeLayer where we’ll store all the earthquake\
    \ circles. Each circle will be a layer inside the group. We’ll also create an\
    \ object codeLayers where we’ll store the correlation between an earthquake code\
    \ and the internal layer ID, so that we can refer to circles by the earthquake\
    \ ID:\n\n```javascript\n// examples_earthquake_ui/code3.js\nvar codeLayers = {};\n\
    var quakeLayer = L.layerGroup([]).addTo(map);\n```\n\nAnd now in the subscription\
    \ for the quakes Observable inside initialize, we’ll add each circle to the layer\
    \ group and store its ID in codeLayers. If this seems a bit intricate, it’s because\
    \ that’s the only way Leaflet allows us to refer to drawings in a map.\n\n```javascript\n\
    // examples_earthquake_ui/code3.js\nquakes.subscribe(function(quake) {\n    var\
    \ coords = quake.geometry.coordinates;\n    var size = quake.properties.mag *\
    \ 10000;\n\n    var circle = L.circle([coords[1], coords[0]], size).addTo(map);\n\
    \    quakeLayer.addLayer(circle);\n    codeLayers[quake.id] = quakeLayer.getLayerId(circle);\n\
    });\n```\n\nLet’s now create the hovering effect. We’ll write a new function,\
    \ isHovering, which returns an Observable that emits a Boolean value for whether\
    \ the mouse is over a particular earthquake circle at any given moment:\n\n```javascript\n\
    // examples_earthquake_ui/code3.js\nvar identity = Rx.helpers.identity;\n\nfunction\
    \ isHovering(element) {\n    var over = Rx.DOM.mouseover(element).map(identity(true));\n\
    \    var out = Rx.DOM.mouseout(element).map(identity(false));\n\n    return over.merge(out);\n\
    }\n```\n\n- 1. Rx.helpers.identity is the identity function. Given a parameter\
    \ x, it returns x. This way we don’t have to write functions that return the value\
    \ they receive.\n- 2. over is an Observable that emits true when the user hovers\
    \ the mouse over the element.\n- 3. out is an Observable that emits false when\
    \ the user moves the mouse outside of the element.\n- 4. isHovering merges both\
    \ over and out, returning an Observable that emits true when the mouse is over\
    \ an element, and false when it leaves it.\n\nWith isHovering in place we can\
    \ modify the subscription that creates the rows, so that we subscribe to events\
    \ in each row as it is created:\n\n```javascript\nexamples_earthquake_ui/code3.js\n\
    var table = document.getElementById('quakes_info');\nquakes\n  .pluck('properties')\n\
    \  .map(makeRow)\n  .bufferWithTime(500)\n  .filter(function(rows) { return rows.length\
    \ > 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      fragment.appendChild(row);\n    });\n\
    \    return fragment;\n  })\n  .subscribe(function(fragment) {\n    var row =\
    \ fragment.firstChild; // Get row from inside the fragment\n    var circle = quakeLayer.getLayer([codeLayers[row.id]]);\n\
    \n    isHovering(row).subscribe(function(hovering) {\n      circle.setStyle({\
    \ color: hovering ? '#ff0000' : '#0000ff' });\n    });\n\n    Rx.DOM.click(row).subscribe(function()\
    \ {\n      map.panTo(circle.getLatLng());\n    });\n\n    table.appendChild(fragment);\n\
    \  })\n```\n\n- 1. We get the circle element for the earthquake on the map using\
    \ the ID we get from the row element. With that, codeLayers gives us the corresponding\
    \ internal ID, which gets us the circle element using quakeLayer.getLayer."
  mdcn: "\n```\nObserver 2: 0\nObserver 1: 4\nObserver 2: 1\n...\n```\n\n现在我们现在可以看到情况确实有些不对。当在三秒后订阅时，observer2\
