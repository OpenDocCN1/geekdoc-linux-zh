    \     .distinct()\n        .take(amount);\n}\n\nvar clicks = Rx.Observable.fromEvent(button,\
    \ 'click');\nclicks.debounce(1000)\n    .flatMap(getResults(5))\n    .subscribe({\n\
    \        function(value) { console.log('Received value', value); },\n        function(err)\
    \ { console.error(err); },\n        function() { console.log('All values retrieved!');\
    \ }\n    });\n```\n```\n\nDon't worry about understanding what's going on here:\
    \ let's focus on the 10,000-foot view for now. The first thing you see is that\
    \ we express more with fewer lines of code. We accomplish this by using Observables.\n\
    \nAn Observable represents a stream of data. Programs can be expressed largely\
    \ as streams of data. In the preceding example, both remote sources are Observables,\
    \ and so are the mouse clicks from the user. In fact, our program is essentially\
    \ a single Observable made from a button's click event that we transform to get\
    \ the results we want.\n\nReactive programming is expressive. Take, for instance,\
    \ throttling mouse clicks in our example. Imagine how complex it would be to do\
    \ that using callbacks or promises: we'd need to reset a timer every second and\
    \ keep state of whether a second has passed since the last time the user clicked\
    \ the button. It's a lot of complexity for so little functionality, and the code\
    \ for it is not even related to your program's actual functionality. In bigger\
    \ applications, these little complexities add up very quickly to make for a tangled\
    \ code base.\n\nWith the reactive approach, we use the method `debounce` to throttle\
    \ the stream of clicks. This ensures that there is at least a second between each\
    \ click, and discards any clicks in between. We don't care how this happens internally;\
    \ we just express *what* we want our code to do, not *how* to do it.\n\nIt gets\
    \ much more interesting. Next you'll see how reactive programming can help us\
    \ make our programs more efficient and expressive."
- md: "## Spreadsheets Are Reactive\n\nLet’s start by considering the quintessential\
    \ example of a reactive system: the spreadsheet. We all have used them, but we\
    \ rarely stop and think how shockingly intuitive they are. Let’s say we have a\
    \ value in cell A1 of the spreadsheet. We can then reference it in other cells\
    \ in the spreadsheet, and whenever we change A1, every cell depending on A1 will\
    \ automatically update its own value.\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_21_0.png)\n\
    \nThat behavior feels natural to us. We didn’t have to tell the computer to update\
    \ cells that depend on A1 or how to do it; these cells just reacted to the change.\
    \ In a spreadsheet, we simply declare our problem, and we don’t worry about how\
    \ the computer calculates the results.\n\nThis is what reactive programming aims\
    \ for. We declare relationships between players, and the program evolves as these\
    \ entities change or come up with new values.\n\n## The Mouse as a Stream of Values\n\
    \nTo understand how to see events as streams of values, let’s think of the program\
    \ from the beginning of this chapter. There we used mouse clicks as an infinite\
    \ sequence of events generated in real time as the user clicks. This is an idea\
    \ by Erik Meijer—the inventor of RxJS—proposed in his paper “Your Mouse Is a Database.”¹\n\
    \nIn reactive programming, we see mouse clicks as a continuous stream of events\
    \ that we can query and manipulate. Thinking of streams instead of isolated values\
    \ opens up a whole new way to program, one in which we can manipulate entire sequences\
    \ of values that haven’t been created yet.\n\nLet that thought sink in for a moment.\
    \ This is different from what we’re used to, which is having values stored somewhere\
    \ such as a database or an array and waiting for them to be available before we\
    \ use them. If they are not available yet (for instance, a network request), we\
    \ wait for them and use them only when they become available.\n\n> 1. http://queue.acm.org/detail.cfm?id=2169076\n\
    \n![](img/a8eed7bbb390e0eff6b6561c329a113c_22_0.png)\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_22_1.png)\n\
    \nWe can think of our streaming sequence as an array in which elements are separated\
    \ by *time* instead of by memory. With either time or memory, we have sequences\
    \ of elements:\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_22_2.png)\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_22_3.png)\n\
    \nSeeing your program as flowing sequences of data is key to understanding RxJS\
    \ programming. It takes a bit of practice, but it is not hard. In fact, most data\
    \ we use in any application can be expressed as a sequence. We'll look at sequences\
    \ more in depth in [Chapter 2, Deep in the Sequence, on page 17](#).\n\n### Querying\
    \ the Sequence\n\nLet's implement a simple version of that mouse stream using\
    \ traditional event listeners in JavaScript. To log the x- and y-coordinates of\
    \ mouse clicks, we could write something like this:\n\n```javascript\n// ch1/thinking_sequences1.js\n\
    document.body.addEventListener('mousemove', function(e) {\n  console.log(e.clientX,\
    \ e.clientY);\n});\n```\n\nThis code will print the x- and y-coordinates of every\
    \ mouse click in order. The output looks like this:\n\n```\n252 183\n211 232\n\
    153 323\n...\n```\n\nLooks like a sequence, doesn't it? The problem, of course,\
    \ is that manipulating events is not as easy as manipulating arrays. For example,\
    \ if we want to change the preceding code so it logs only the first 10 clicks\
    \ on the right side of the screen (quite a random goal, but bear with me here),\
    \ we would write something like this:\n\n```javascript\nvar clicks = 0;\ndocument.addEventListener('click',\
    \ function registerClicks(e) {\n  if (clicks < 10) {\n    if (e.clientX > window.innerWidth\
    \ / 2) {\n        console.log(e.clientX, e.clientY);\n        clicks += 1;\n \
    \   }\n  } else {\n    document.removeEventListener('click', registerClicks);\n\
    \  }\n});\n```\n\nTo meet our requirements, we introduced external state through\
    \ a global variable `clicks` that counts clicks made so far. We also need to check\
    \ for two different conditions and use nested conditional blocks. And when we’re\
    \ done, we have to tidy up and unregister the event to not leak memory.\n\n###\
    \ Side Effects and External State\n\nIf an action has impact outside of the scope\
    \ where it happens, we call this a *side effect*. Changing a variable external\
    \ to our function, printing to the console, or updating a database are examples\
    \ of side effects.\n\nFor example, changing the value of a variable that exists\
    \ *inside* our function is safe. But if that variable is *outside* the scope of\
    \ our function then other functions can change its value. That means our function\
    \ is not in control anymore and it can’t assume that external variable contains\
    \ the value we expect. We’d need to track it and add checks to ensure its value\
    \ is what we expect. At that point we’d be adding code that is not relevant to\
    \ our program, making it more complex and error prone.\n\nAlthough side effects\
    \ are necessary to build any interesting program, we should strive for having\
    \ as few as possible in our code. That’s especially important in reactive programs,\
    \ where we have many moving pieces that change over time. Throughout this book,\
    \ we’ll pursue an approach that avoids external state and side effects. In fact,\
    \ in [Chapter 3, Building Concurrent Programs, on page 39](...), we’ll build an\
    \ entire video game with no side effects.\n\nWe managed to meet our easy requirements,\
    \ but ended up with pretty complicated code for such a simple goal. It’s difficult\
    \ code to maintain and not obvious for a developer who looks at it for the first\
    \ time. More importantly, we made it prone to develop subtle bugs in the future\
    \ because we need to keep state.\n\nAll we want in that situation is to query\
    \ the “database” of clicks. If we were dealing with a relational database, we’d\
    \ use the declarative language SQL:\n\n```sql\nSELECT x, y FROM clicks LIMIT 10\n\
    ```\n\nWhat if we treated that stream of `click` events as a data source that\
    \ can be queried and transformed? After all, it’s no different from a database,\
    \ one that emits values in real time. All we need is a data type that abstracts\
    \ the concept for us.\n\nEnter RxJS and its Observable data type:\n\n```javascript\n\
    Rx.Observable.fromEvent(document, 'click')\n  .filter(function(c) { return c.clientX\
    \ > window.innerWidth / 2; })\n  .take(10)\n  .subscribe(function(c) { console.log(c.clientX,\
    \ c.clientY) })\n```\n\nThis code does the same as the [code on page 4](page4),\
    \ and it reads like this:\n\n> Create an Observable of `click` events and filter\
    \ out the clicks that happen on the left side of the screen. Then print the coordinates\
    \ of only the first 10 clicks to the console as they happen.\n\nNotice how the\
    \ code is easy to read even if you’re not familiar with it. Also, there’s no need\
    \ to create external variables to keep state, which makes the code self-contained\
    \ and makes it harder to introduce bugs. There’s no need to clean up after yourself\
    \ either, so no chance of introducing memory leaks by forgetting about unregistering\
    \ event handlers.\n\nIn the preceding code we created an Observable from a DOM\
    \ event. An Observable provides us with a sequence or stream of events that we\
    \ can manipulate as a whole instead of a single isolated event each time. Dealing\
    \ with sequences gives us enormous power; we can merge, transform, or pass around\
    \ Observables easily. We’ve turned events we can’t get a handle on into a tangible\
    \ data structure that’s as easy to use as an array, but much more flexible.\n\n\
    In the next section we’ll see the principles that make Observables such a great\
    \ tool.\n\n## Of Observers and Iterators\n\nTo understand where Observables come\
    \ from we need to look at their foundations: the Observer and Iterator software\
    \ patterns. In this section we’ll take a quick look at them, and then we’ll see\
    \ how Observables combine concepts of both in a simple but powerful way.\n\n###\
    \ The Observer Pattern\n\nFor a software developer, it’s hard to hear about Observables\
    \ and not think of the venerable *observer pattern*. In it we have an object called\
    \ *Producer* that keeps an internal list of *Listeners* subscribed to it. Listeners\
    \ are notified—by"
  mdcn: "\n## 电子表格是响应式的\n\n让我们先从一个响应式系统的典型例子开始：电子表格。我们都使用过它，但很少停下来思考它竟是如此地直观。假设我们在电子表格的\
    \ A1 单元格中有一个值。我们可以在电子表格的其他单元格中引用它，每当我们更改 A1 时，每个依赖于 A1 的单元格都会自动更新其自身的值。\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_21_0.png)\n\
    \n这种行为对我们来说感觉很自然。我们不需要告诉计算机去更新依赖于 A1 的单元格，也不需要告诉它如何更新；这些单元格只是对变化做出了“响应”。在电子表格中，我们只需声明我们的问题，而无需担心计算机如何计算结果。\n\
    \n这正是响应式编程的目标。我们声明参与者之间的关系，随着这些实体的变化或产生新值，程序随之演进。\n\n## 将鼠标视为值流\n\n为了理解如何将事件视为值流，让我们回顾本章开头讨论的程序。在那里，我们将鼠标点击视为由用户点击实时生成的一系列无限事件序列。这是\
    \ RxJS 的发明者 Erik Meijer 在其论文《你的鼠标是一个数据库》（Your Mouse Is a Database）¹ 中提出的一种观点。\n\
    \n在响应式编程中，我们将鼠标点击视为一个可以查询和操作的连续事件流。将流（streams）而非孤立的值作为思考维度，开启了一种全新的编程方式，在这种方式中，我们可以操作尚未创建的整个值序列。\n\
    \n请花一点时间消化这个想法。这与我们习惯的方式不同——我们习惯于将值存储在数据库或数组等某个地方，并在它们可用之前等待。如果它们尚未可用（例如网络请求），我们会等待它们，并在它们可用时才使用。\n\
    \n> 1. http://queue.org/detail.cfm?id=2169076\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_22_0.png)\n\
    \n![](img/a8eed7bbb390e0eff6b6561c329a113c_22_1.png)\n\n我们可以将流序列视为一个数组，其中元素的间隔是*时间*而非内存。无论是时间还是内存，我们拥有的都是元素的序列：\n\
    \n![](img/a8eed7bbb390e0eff6b6561c329a113c_22_2.png)\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_22_3.png)\n\
    \n将程序视为流动的数据序列是理解 RxJS 编程的关键。这需要一些练习，但并不难。事实上，我们在任何应用程序中使用的绝大多数数据都可以表示为序列。我们将在[第\
    \ 2 章，深入探索序列，第 17 页](#)中更深入地探讨序列。\n\n### 查询序列\n\n让我们使用 JavaScript 中传统的事件监听器来实现一个简单的鼠标流版本。为了记录鼠标点击的\
    \ x 和 y 坐标，我们可以编写如下代码：\n\n```javascript\n// ch1/thinking_sequences1.js\ndocument.body.addEventListener('mousemove',\
    \ function(e) {\n  console.log(e.clientX, e.clientY);\n});\n```\n\n这段代码将按顺序打印每次鼠标点击的\
    \ x 和 y 坐标。输出结果如下：\n\n```\n252 183\n211 232\n153 323\n...\n```\n\n看起来像个序列，不是吗？当然，问题在于操作事件并不像操作数组那样简单。例如，如果我们想修改前面的代码，使其仅记录屏幕右侧的前\
    \ 10 次点击（这是一个相当随机的目标，但请先将我地地跟上），我们会这样写：\n\n```javascript\nvar clicks = 0;\ndocument.addEventListener('click',\
    \ function registerClicks(e) {\n  if (clicks < 10) {\n    if (e.clientX > window.innerWidth\
    \ / 2) {\n        console.log(e.clientX, e.clientY);\n        clicks += 1;\n \
    \   }\n  } else {\n    document.removeEventListener('click', registerClicks);\n\
    \  }\n});\n```\n\n为了满足需求，我们通过全局变量 `clicks` 引入了外部状态，用于计算到目前为止的点击次数。我们还需要检查两个不同的条件并使用嵌套的条件块。而且当我们完成时，必须进行清理并注销事件，以避免内存泄漏。\n\
    \n### 副作用与外部状态\n\n如果一个动作的影响超出了它发生时的作用域，我们就称之为*副作用*（side effect）。更改函数外部的变量、向控制台打印内容或更新数据库都是副作用的例子。\n\
    \n例如，更改*内部*于函数的变量值是安全的。但如果该变量位于函数作用域*外部*，那么其他函数也可以更改其值。这意味着我们的函数不再拥有控制权，且不能假设外部变量包含我们期望的值。我们需要追踪它并增加检查，以确保其值符合预期。到那时，我们将添加与程序逻辑无关的代码，使其变得更复杂且更容易出错。\n\
    \n尽管构建任何有趣的程序都需要副作用，但我们应努力在代码中尽可能减少副作用。这在响应式程序中尤为重要，因为响应式程序中有许多随时间变化的动态部件。在本书中，我们将追求一种避免外部状态和副作用的方法。事实上，在[第\
    \ 3 章，构建并发程序，第 39 页](...)中，我们将构建一个完全没有副作用的视频游戏。\n\n我们虽然实现了简单的需求，但为了这样一个简单的目标，最终得到了相当复杂代码。这种代码难以维护，且对于初次接触的开发人员来说并不直观。更重要的是，由于需要维护状态，我们使其在未来容易产生微妙的\
    \ Bug。\n\n在这种情况下，我们真正想要的只是查询点击的“数据库”。如果我们处理的是关系型数据库，我们会使用声明式语言 SQL：\n\n```sql\n\
    SELECT x, y FROM clicks LIMIT 10\n```\n\n如果我们将 `click` 事件流视为一个可以查询和转换的数据源会怎样？毕竟，它与数据库没有区别，只不过是一个实时发射值的数据库。我们只需要一个能为我们抽象这个概念的数据类型。\n\
    \n这就是 RxJS 及其 `Observable` 数据类型的用武之地：\n\n```javascript\nRx.Observable.fromEvent(document,\
    \ 'click')\n  .filter(function(c) { return c.clientX > window.innerWidth / 2;\
    \ })\n  .take(10)\n  .subscribe(function(c) { console.log(c.clientX, c.clientY)\
    \ })\n```\n\n这段代码的作用与[第 4 页的代码](page4)相同，其阅读感受如下：\n\n> 创建一个 `click` 事件的 Observable，过滤掉发生在屏幕左侧的点击。然后，在发生时将前\
    \ 10 次点击的坐标打印到控制台。\n\n请注意，即使你不熟悉这段代码，它也非常易读。此外，无需创建外部变量来保持状态，这使得代码自包含，且更不容易引入\
    \ Bug。你也不需要清理现场，因此没有因忘记注销事件处理器而导致内存泄漏的风险。\n\n在前面的代码中，我们通过 DOM 事件创建了一个 Observable。Observable\
    \ 为我们提供了一个事件序列或流，我们可以将其作为一个整体来操作，而不是每次处理一个孤立的事件。处理序列赋予了我们巨大的能力；我们可以轻松地合并、转换或传递\
    \ Observable。我们将无法掌控的事件变成了像数组一样易用但灵活得多的切实的资料结构。\n\n在下一节中，我们将了解使 Observable 成为如此强大工具的原理。\n\
    \n## 关于观察者与迭代器\n\n为了理解 Observable 的来源，我们需要查看其基础：观察者（Observer）和迭代器（Iterator）软件设计模式。在本节中，我们将快速回顾它们，然后看看\
    \ Observable 如何以一种简单而强大的方式结合两者的概念。\n\n### 观察者模式\n\n对于软件开发人员来说，在听到 Observable 时很难不想到古老的*观察者模式*。在该模式中，我们有一个名为\
    \ *Producer*（生产者）的对象，它维护一个订阅它的 *Listeners*（监听者）的内部列表。监听者通过...\n"
