  md: "It doesn't get much more functional than that!\n\n# Creating Reusable Widgets\n\
    \nAs we make more complex applications, we'll want to reuse some of their UI components.\
    \ Our Wikipedia Search application is tiny for the sake of the example, but it\
    \ already has a couple of components that could be reused in other applications.\
    \ Take the search input box, for example. We can definitely make this into its\
    \ own widget.\n\nThe objective is to encapsulate our widget in its own component\
    \ so that we use it as any other DOM element. We should also be able to parameterize\
    \ the component with any properties we want. Then we'll use it in our applications\
    \ like this:\n\n```\n```javascript\nvar wpSearchBox = searchBox({\n  props$: Rx.Observable.just({\n\
    \    apiUrl: API_URL\n  })\n});\n```\n```\n\nWe'll build our widget using a concept\
    \ also introduced by Cycle.js, called *nested dialogues*. A nested dialogue, or\
    \ *dialogue*, is a function (like everything in Cycle.js) that takes an Observable\
    \ of events as input, and outputs an Observable—with the result of applying these\
    \ inputs to its internal logic.\n\nLet's start building the search-box component.\
    \ We first create a function that takes a responses parameter where we'll pass\
    \ it any properties we want from the main application:\n\n```\n```javascript\n\
    // cycle/searchbox.js\nvar Cycle = require('@cycle/core');\nvar CycleDOM = require('@cycle/dom');\n\
    var Rx = Cycle.Rx;\nvar h = CycleDOM.h;\nvar a;\n\nfunction searchBox(responses)\
    \ {\n  var props$ = responses.props$;\n  var apiUrl$ = props$.map(function (props)\
    \ {\n    return props['apiUrl'];\n  }).first();\n```\n```\n\nEvery parameter searchBox\
    \ receives is an Observable. In this case props$ is an Observable that emits a\
    \ single JavaScript object containing the configuration parameters for our Wikipedia\
    \ search box."
