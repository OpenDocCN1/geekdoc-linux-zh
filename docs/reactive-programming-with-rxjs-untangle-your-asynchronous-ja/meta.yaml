  md: "# # Canceling Sequences\n\nIn RxJS we can cancel a running Observable. This\
    \ is an advantage over other asynchronous forms of communication, such as callbacks\
    \ and promises, which can't be directly canceled once they're called (some promise\
    \ implementations support cancellation, though).\n\nThere are two main ways we\
    \ can cancel an Observable: *implicitly* and *explicitly*.\n\n# ## Explicit Cancellation:\
    \ The Disposable\n\nObservables themselves don't have a method to get canceled.\
    \ Instead, whenever we subscribe to an Observable we get a Disposable object that\
    \ represents that particular subscription. We can then call the method `dispose`\
    \ in that object, and that subscription will stop receiving notifications from\
    \ the Observable.\n\nIn the following example, we subscribe two Observers to the\
    \ `counter` Observable, which emits an increasing integer every second. After\
    \ two seconds, we cancel the second subscription and we can see that its output\
    \ stops but the first subscriber's output keeps going:\n\n```\n```javascript\n\
    sequences/disposable.js\nvar counter = Rx.Observable.interval(1000);\n\nvar subscription1\
    \ = counter.subscribe(function(i) {\n  console.log('Subscription 1: ' + i);\n\
    });\n\nvar subscription2 = counter.subscribe(function(i) {\n  console.log('Subscription\
    \ 2: ' + i);\n});\n\nsetTimeout(function() {\n  console.log('Canceling subscription2!');\n\
    \  subscription2.dispose();\n}, 2000);\n```\n```\n\n```\n```text\nSubscription\
    \ 1: 0\nSubscription 2: 0\nSubscription 1: 1\nSubscription 2: 1\nCanceling subscription2!\n\
    Subscription 1: 2\nSubscription 1: 3\nSubscription 1: 4\n...\n```\n```"
  merge: -1
  pgno: 41
- img_proc: true
  md: "# Implicit Cancellation: By Operator\n\nMost of the time, operators will automatically\
    \ cancel subscriptions for you. Operators such as `range` or `take` will cancel\
    \ the subscription when the sequence finishes or when the operator conditions\
    \ are met. More advanced operators such as `withLatestFrom` or `flatMapLatest`\
    \ will internally create and destroy subscriptions as needed, since they handle\
    \ several Observables in motion. In short, you should not worry about canceling\
    \ most subscriptions yourself.\n\n# Observables That Wrap External APIs\n\nWhen\
    \ you're using Observables that wrap external APIs that don't provide cancellation,\
    \ the Observable will still stop emitting notifications when canceled, but the\
    \ underlying API will not necessarily be canceled. For example, if you're using\
    \ an Observable that wraps a promise, the Observable will stop emitting when canceled,\
    \ but the underlying promise will not be canceled.\n\nIn the following code, we\
    \ attempt to cancel a subscription to an Observable that wraps a promise `p`,\
    \ and at the same time we set an action in the traditional way for when the promise\
    \ is resolved. The promise should resolve in five seconds, but we cancel the subscription\
    \ immediately after creating it:\n\n```\n```javascript\nvar p = new Promise(function(resolve,\
    \ reject) {\n    window.setTimeout(resolve, 5000);\n});\n\np.then(function() {\n\
    \    console.log('Potential side effect!');\n});\n\nvar subscription = Rx.Observable.fromPromise(p).subscribe(function(msg)\
    \ {\n    console.log('Observable resolved!');\n});\nsubscription.dispose();\n\
    ```\n```\n\nAfter 5 seconds, we see:\n\n> Potential side effect!\n\nIf we cancel\
    \ the subscription to the Observable it effectively stops it from receiving the\
    \ notification. But the promise's then method still runs, showing that canceling\
    \ the Observable doesn't cancel the underlying promise.\n\nIt's important to know\
    \ the details of external APIs that we use in Observables. You might think you've\
    \ canceled a sequence, but the underlying API keeps running and causes some side\
    \ effects in your program. These errors can be really hard to catch."
  merge: -1
  pgno: 42
- img_proc: true
  md: "# # Handling Errors\n\nWe can’t use the conventional try/catch mechanism in\
    \ callbacks because it is synchronous. It would run before any asynchronous code,\
    \ and wouldn’t be able to catch any errors.\n\nWith callbacks, this was solved\
    \ by passing the error (if any) as a parameter to the callback function. That\
    \ works, but it makes the code pretty fragile.\n\nLet’s see how to catch errors\
    \ inside Observables.\n\n# ## The onError Handler\n\nRemember when we talked about\
    \ the three methods we can call on an Observer, in *First Contact with Observers,\
    \ on page 10*? We’re familiar with onNext and onCompleted, but we haven’t yet\
    \ used onError; it is the key to effectively handling errors in Observable sequences.\n\
    \nTo see how it works, we’ll write a simple function to take an array of JSON\
    \ strings and return an Observable that emits the objects parsed from those strings,\
    \ using JSON.parse:\n\n```\n```javascript\nfunction getJSON(arr) {\n    return\
    \ Rx.Observable.from(arr).map(function(str) {\n        var parsedJSON = JSON.parse(str);\n\
    \        return parsedJSON;\n    });\n}\n```\n```\n\nWe’ll pass an array with\
    \ three JSON strings to getJSON, in which the second string in the array contains\
    \ a syntax error, so JSON.parse won’t be able to parse it. Then we’ll subscribe\
    \ to the result, providing handlers for onNext and onError:\n\n```\n```javascript\n\
    getJSON([\n    '{\"1\": 1, \"2\": 2}',\n    '{\"success: true}', // Invalid JSON\
    \ string\n    '{\"enabled\": true}'\n]).subscribe({\n    function(json) {\n  \
    \      console.log('Parsed JSON: ', json);\n    },\n    function(err) {\n    \
    \    console.log(err.message);\n    }\n});\n```\n```\n\nParsed JSON: { 1: 1, 2:\
    \ 2 }\nJSON.parse: unterminated string at line 1 column 8 of the JSON data"
  merge: -1
  pgno: 43
- img_proc: true
  md: "The Observable emits the parsed JSON for the first result but throws an exception\
    \ when trying to parse the second. The `onError` handler catches this and prints\
    \ it out. The default behavior is that whenever an error happens, the Observable\
    \ stops emitting items, and `onCompleted` is not called.\n\n# ### Catching Errors\n\
    \nSo far we’ve seen how to detect that an error has happened and do something\
    \ with that information, but we haven’t been able to react to it and continue\
    \ with whatever we were doing. Observable instances have the catch operator, which\
    \ allows us to react to an error in the Observable and continue with another Observable.\n\
    \ncatch takes either an Observable or a function that receives the error as a\
    \ parameter and returns another Observable. In our scenario, we want the Observable\
    \ to emit a JSON object containing an error property if there were errors in the\
    \ original Observable:\n\n```\n```javascript\nfunction getJSON(arr) {\n    return\
    \ Rx.Observable.from(arr).map(function(str) {\n        var parsedJSON = JSON.parse(str);\n\
    \        return parsedJSON;\n    });\n}\n```\n```\n\n```\n```javascript\nvar caught\
    \ = getJSON(['{\"1\": 1, \"2\": 2}', '{\"1: 1}']).catch(function(e) {\n    return\
    \ Rx.Observable.return({\n        error: 'There was an error parsing JSON'\n \
    \   });\n});\n```\n```\n\n```\n```javascript\ncaught.subscribe(\n    function(json)\
    \ {\n        console.log('Parsed JSON: ', json);\n    },\n    // Because we catch\
    \ errors now, `onError` will not be executed\n    function(e) {\n        console.log('ERROR',\
    \ e.message);\n    }\n);\n```\n```\n\nIn the preceding code, we create a new Observable,\
    \ caught, that uses the catch operator to catch errors in the original Observable.\
    \ If there’s an error it will continue the sequence with an Observable that emits\
    \ only one item, with an error property describing the error. This is the output:\n\
    \n> Parsed JSON: Object { 1: 1, 2: 2 }\nParsed JSON: Object { error: \"There was\
    \ an error parsing JSON\" }"
  merge: -1
  pgno: 44
- img_proc: true
  md: "And here’s the marble diagram for the catch operator:\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_45_0.png)\n\
    \nNotice the X to indicate that the sequence experienced an error. The different\
    \ shape of the Observable values—triangles in this case—means that they are values\
    \ coming from another Observable. Here, that’s the Observable we return in case\
    \ of an error.\n\ncatch is useful for reacting to errors in a sequence, and it\
    \ behaves much like the traditional try/catch block. In some cases, though, it\
    \ would be very convenient to ignore an error that happens with an item in the\
    \ Observable and let the sequence continue. In those cases, we can use the retry\
    \ operator.\n\n# ## Retrying Sequences\n\nSometimes errors just happen and there’s\
    \ not much we can do about it. For example, there could be a timeout requesting\
    \ remote data because the user has a spotty Internet connection, or a remote server\
    \ we’re querying could crash. In these cases it would be great if we could keep\
    \ requesting the data until we need it successful. The retry operator does exactly\
    \ that:\n\n```\n```javascript\nsequences/error_handling.js\n\n// This will try\
    \ to retrieve the remote URL up to 5 times.\nRx.DOM.get('/products').retry(5)\n\
    \  .subscribe(\n    function(xhr) { console.log(xhr); },\n    function(err) {\
    \ console.error('ERROR: ', err); }\n  );\n```\n```\n\nIn the preceding code, we\
    \ create a function that returns an Observable that retrieves contents from a\
    \ URL using XMLHttpRequest. Because our connection might be a bit spotty, we add\
    \ retry(5) before subscribing to it, ensuring that in case of an error, it will\
    \ try up to five times before giving up and showing an error."
  merge: -1
  pgno: 45
- img_proc: true
  md: 'There are two important things to know when using retry. First, if we don’t
    pass any parameters, it will retry indefinitely until the sequence is finished
    with no errors. This is dangerous for performance if the Observable keeps producing
    errors. If we’re using synchronous Observables, it would have the same effect
    as an infinite loop.


    Second, retry will always retry the whole Observable sequence again, even if some
    of the items didn’t error. This is important in case you’re causing any side effects
    when processing items, since they will be reapplied with every retry.


    # Making a Real-Time Earthquake Visualizer


