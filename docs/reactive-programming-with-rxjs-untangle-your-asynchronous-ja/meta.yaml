    ## 致谢


    我有很多人要感谢。有人帮助塑造了这本书，有人帮助塑造了我这个人。没有他们，我无法完成这项工作。我特别想感谢以下人员：


    最初创建 Reactive Extensions 库以及对其进行扩展和推广的杰出人士。如果没有你们，这本书显然不会存在：Erik Meijer, Matt
    Podwysocki, Bart De Smet, Wes Dyer, Jafar Husain, André Staltz，以及许多我可能遗忘的人。


    The Pragmatic Bookshelf 的同事们。与你们合作是一件快事。特别感谢 Susannah Pfalzer，她在本书还仅仅是一个想法时就相信它。我也非常幸运地邀请到
    Rebecca Gulick 担任我的编辑：你专业、耐心，关注我的问题，与你合作是一件令人愉快的事情。我长期以来一直是 Pragmatic 书籍的粉丝，能够亲自写一本
    PragProg 的书是一项荣幸。而且，是的，两位出版商 Dave Thomas 和 Andy Hunt 确实阅读并评审了每一本书！


    才华横溢的技术评审员。David Bock, Javier Collado Cabezda, Fred Daoud, Iraklis Gozalishvili,
    Zef Hemel, Ramaninder Singh Jhaji, Aaron Kalair, Daniel Lamb, Brian Schau, 和 Stephen
    Wolff，以及 Pragmatic 出版商 Dave 和 Andy：由于你们所有人，这本书变得好得无限多。你们每个人都无私地投入时间和精力评审本书，检测复杂的错误并让我免于再次犯尴尬的错误。书中剩余的任何错误都是我自己的责任。


    给我的朋友们。那些无论时间多远、距离多远都一直陪伴在我身边的人；你们知道你们是谁。感谢你们的笑声、支持和爱。


    我的父母 Narcis Mansilla 和 Joana Molins。你们是我的向导和榜样。你们从未停止相信我，并总是鼓励我迎接更大的挑战。在你们辛苦支付账单的时期，你们为我买了第一台电脑。那是这一切的开始，我欠你们的一切。


    我的儿子 Adrià。你在我写这本书的时候出生，你改变了我生活的意义。在这么短的时间里，你已经教会了我这么多，我迫不及待想看看接下来会发生什么。


    最后，是我生命中的挚爱 Jen。在你我生活中最繁忙的时期之一，我写这本书时，你拥有无限的耐心并支持着我。你是我灵感的源泉，你在方方面面使我成为了一个更好的人。你是我的星辰。


    **Sergi Mansilla**


    巴塞罗那，2015年12月

