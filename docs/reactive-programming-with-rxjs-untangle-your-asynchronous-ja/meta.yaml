    \ `n` is five, so out of the thousand strings, we'll receive only the first five.\
    \ The cool part is that our code will never traverse all the items; it will apply\
    \ our transformations to only the first five."
  - "[PAGE 62]\n\nThis makes the developer's life much easier. You can rest assured\
    \ that when manipulating sequences, RxJS will do only as much work as necessary.\
    \ This way of operating is called `lazy evaluation`, and it is very common in\
    \ functional languages such as Haskell and Miranda.\n\n# RxJS's Subject Class\n\
    \nA Subject is a type that implements both Observer and Observable types. As an\
    \ Observer, it can subscribe to Observables, and as an Observable it can produce\
    \ values and has Observers subscribe to it.\n\nIn some scenarios a single Subject\
    \ can do the work of a combination of Observers and Observables. For example,\
    \ for making a proxy object between a data source and the Subject's listeners,\
    \ we could use this:\n\n```\n```javascript\nspaceship_reactive/subjects.js\nvar\
    \ subject = new Rx.Subject();\nvar source = Rx.Observable.interval(300)\n  .map(function(v)\
    \ { return 'Interval message #' + v; })\n  .take(5);\n\nsource.subscribe(subject);\n\
    \nvar subscription = subject.subscribe({\n  function onNext(x) { console.log('onNext:\
    \ ' + x); },\n  function onError(e) { console.log('onError: ' + e.message); },\n\
    \  function onCompleted() { console.log('onCompleted'); }\n});\n\nsubject.onNext('Our\
    \ message #1');\nsubject.onNext('Our message #2');\n\nsetTimeout(function() {\n\
    \  subject.onCompleted();\n}, 1000);\n```\n```\n\nOutput:\n\n> onNext: Our message\
    \ #1\n> onNext: Our message #2\n> onNext: Interval message #0\n> onNext: Interval\
    \ message #1\n> onNext: Interval message #2\n> onCompleted\n\nIn the preceding\
    \ example we create a new Subject and a source Observable that emits an integer\
    \ every second. Then we subscribe the Subject to the Observable. After that, we\
    \ subscribe an Observer to the Subject itself. The Subject now behaves as an Observable."
  - "[PAGE 63]\n\nNext we make the Subject emit values of its own (message1 and message2).\
    \ In the final result, we get the Subject's own messages and then the proxied\
    \ values from the source Observable. The values from the Observable come later\
    \ because they are asynchronous, whereas we made the Subject's own values immediate.\
    \ Notice that even if we tell the source Observable to take the first five values,\
    \ the output shows only the first three. That's because after one second we call\
    \ onCompleted on the Subject. This finishes the notifications to all subscriptions\
    \ and overrides the take operator in this case.\n\nThe Subject class provides\
    \ the base for creating more specialized Subjects. In fact, RxJS comes with some\
    \ interesting ones: AsyncSubject, ReplaySubject, and BehaviorSubject.\n\n# AsyncSubject\n\
    \nAsyncSubject emits the last value of a sequence only if the sequence completes.\
    \ This value is then cached forever, and any Observer that subscribes after the\
    \ value has been emitted will receive it right away. AsyncSubject is convenient\
    \ for asynchronous operations that return a single value, such as Ajax requests.\n\
    \nLet's see a simple example of an AsyncSubject subscribing to a range:\n\n```\n\
    ```javascript\nspaceship_reactive/subjects.js\nvar delayedRange = Rx.Observable.range(0,\
    \ 5).delay(1000);\nvar subject = new Rx.AsyncSubject();\n\ndelayedRange.subscribe(subject);\n\
    \nsubject.subscribe({\n  function onNext(item) { console.log('Value:', item) },\n\
    \  function onError(err) { console.log('Error:', err) },\n  function onCompleted()\
    \ { console.log('Completed.') }\n});\n```\n```\n\nIn that example, delayedRange\
    \ emits the values 0 to 4 after a delay of a second. Then we create a new AsyncSubject\
    \ and subscribe it to delayedRange. The output is the following:\n\n> Value: 4\n\
    Completed.\n\nAs expected, we get only the last value that the Observer emits.\
    \ Let's now use AsyncSubject for a more realistic scenario. We'll retrieve some\
    \ remote content:\n\n```\n```javascript\nspaceship_reactive/subjects.js\nfunction\
    \ getProducts(url) {\n  var subject;\n```\n```"
  - "[PAGE 64]\n\n```\n```javascript\nreturn Rx.Observable.create(function(observer)\
    \ {\n    if (!subject) {\n        subject = new Rx.AsyncSubject();\n        Rx.DOM.get(url).subscribe(subject);\n\
    \    }\n    return subject.subscribe(observer);\n});\n```\n```\n\n```\n```javascript\n\
    var products = getProducts('products');\n// Will trigger request and receive the\
    \ response when read\nproducts.subscribe(\n    function onNext(result) { console.log('Result\
    \ 1:', result.response); },\n    function onError(error) { console.log('ERROR',\
    \ error); }\n);\n```\n```\n\n```\n```javascript\n// Will receive the result immediately\
    \ because it's cached\nsetTimeout(function() {\n    products.subscribe(\n    \
    \    function onNext(result) { console.log('Result 2:', result.response); },\n\
    \        function onError(error) { console.log('ERROR', error); }\n    );\n},\
    \ 5000);\n```\n```\n\nIn this code, when getProducts is called with a URL, it\
    \ returns an Observer that emits the result of the HTTP GET request. Here's how\
    \ it breaks down:\n\n+   1. getProducts returns an Observable sequence. We create\
    \ it here.\n2. If we haven't created an AsyncSubject yet, we create it and subscribe\
    \ it to the Observable that Rx.DOM.Request.get(url) returns.\n3. We subscribe\
    \ the Observer to the AsyncSubject. Every time an Observer subscribes to the Observable,\
    \ it will actually be subscribed to the AsyncSubject, which is acting as a proxy\
    \ between the Observable retrieving the URL and the Observers.\n4. We create the\
    \ Observable that retrieves the URL \"products\" and store it in the products\
    \ variable.\n5. This is the first subscription and will kick off the URL retrieval\
    \ and log the results when the URL is retrieved.\n6. This is the second subscription,\
    \ which runs five seconds after the first one. Since at that time the URL already\
    \ been retrieved, there's no need for another network request. It will receive\
    \ the result of the request immediately because it is already stored in the AsyncSubject\
    \ subject."
  - "[PAGE 65]\n\nThe interesting bit is that we're using an AsyncSubject that subscribes\
    \ to the Rx.DOM.Request.get Observable. Because AsyncSubject caches the last result,\
    \ any subsequent subscription to products will receive the result right away,\
    \ without causing another network request. We can use AsyncSubject whenever we\
    \ expect a single result and want to hold onto it.\n\n> **Joe asks:\nDoes That\
    \ Mean AsyncSubject Acts Like a Promise?**\n\nIndeed.\n\nAsyncSubject represents\
    \ the result of an asynchronous action, and you can use it as a substitute for\
    \ a promise. The difference internally is that a promise will only ever process\
    \ a single value, whereas AsyncSubject processes all values in a sequence, only\
    \ ever emitting (and caching) the last one.\n\nBeing able to so easily simulate\
    \ promises shows the flexibility of the RxJS model. (Even without AsyncSubject,\
    \ it would be pretty easy to simulate a promise using Observables.)\n\n# BehaviorSubject\n\
    \nWhen an Observer subscribes to a BehaviorSubject, it receives the last emitted\
    \ value and then all the subsequent values. BehaviorSubject requires that we provide\
    \ a starting value, so that all Observers will always receive a value when they\
    \ subscribe to a BehaviorSubject.\n\nImagine we want to retrieve a remote file\
    \ and print its contents on an HTML page, but we want a placeholder text while\
    \ we wait for the contents. We can use a BehaviorSubject for this:\n\n```\n```javascript\n\
    spaceship_reactive/behavior_subject.js\nvar subject = new Rx.BehaviorSubject('Waiting\
    \ for content');\n\nsubject.subscribe(\n    function(result) {\n        document.body.textContent\
    \ = result.response || result;\n    },\n    function(err) {\n        document.body.textContent\
    \ = 'There was an error retrieving content';\n    }\n);\n\nRx.DOM.get('/remote/content').subscribe(subject);\n\
    ```\n```"
- md: "In the code, we initialize a new BehaviorSubject with our placeholder content.\
    \ Then we subscribe to it and change the HTML body content in both `onNext` and\
    \ `onError`, depending on the result.\n\nNow the HTML body contains our placeholder\
    \ text, and it will stay that way until the Subject emits a new value. Finally,\
    \ we request the resource we want and we subscribe our Subject to the resulting\
    \ Observer.\n\nBehaviorSubject guarantees that there will always be at least one\
    \ value emitted, because we provide a default value in its constructor. Once the\
    \ BehaviorSubject completes it won't emit any more values, freeing the memory\
    \ used by the cached value.\n\n### ReplaySubject\n\nA ReplaySubject caches its\
    \ values and re-emits them to any Observer that subscribes late to it. Unlike\
    \ with AsyncSubject, the sequence doesn't need to be completed for this to happen.\n\
    \n| Subject | ReplaySubject |\n| :--- | :--- |\n| `var subject = new Rx.Subject();`\
    \ | `var subject = new Rx.ReplaySubject();` |\n| `subject.onNext(1);` | `subject.onNext(1);`\
    \ |\n| `subject.subscribe(function(n) { console.log('Received value:', n); });`\
    \ | `subject.subscribe(function(n) { console.log('Received value:', n); });` |\n\
    | `subject.onNext(2);` <br> `subject.onNext(3);` | `subject.onNext(2);` <br> `subject.onNext(3);`\
    \ |\n| `Received value: 2` <br> `Received value: 3` | `Received value: 1` <br>\
    \ `Received value: 2` <br> `Received value: 3` |\n\nReplaySubject is useful to\
    \ make sure that Observers get all the values emitted by an Observable from the\
    \ start. It spares us from writing messy code that caches previous values, saving\
    \ us from nasty concurrency-related bugs.\n\nOf course, to accomplish that behavior\
    \ ReplaySubject caches all values in memory. To prevent it from using too much\
    \ memory, we can limit the amount of data it stores by buffer size or window of\
    \ time, or by passing particular parameters to the constructor.\n\nThe first parameter\
    \ to the constructor of ReplaySubject takes a number that represents how many\
    \ values we want to buffer:\n\n```javascript\nvar subject = new Rx.ReplaySubject(2);\
    \ // Buffer size of 2\n\nsubject.onNext(1);\nsubject.onNext(2);\nsubject.onNext(3);\n\
    \nsubject.subscribe(function(n) {\n    console.log('Received value:', n);\n});\n\
    ```\n\n> Received value: 2\n> Received value: 3\n\nThe second parameter takes\
    \ a number that represents the time in milliseconds during which we want to buffer\
    \ values:\n\n```javascript\nvar subject = new Rx.ReplaySubject(null, 200); //\
    \ Buffer size of 200ms\n\nsetTimeout(function() { subject.onNext(1); }, 100);\n\
    setTimeout(function() { subject.onNext(2); }, 200);\nsetTimeout(function() { subject.onNext(3);\
    \ }, 300);\nsetTimeout(function() { \n    subject.subscribe(function(n) {\n  \
    \      console.log('Received value:', n);\n    });\n}, 350);\n\nsubject.onNext(4);\n\
    ```\n\nIn this example we set a buffer based on time, instead of the number of\
    \ values. Our ReplaySubject will cache values that were emitted up to 200 milliseconds\
    \ ago. We emit three values, each separated by 100 milliseconds, and after 350\
    \ milliseconds we subscribe an Observer and we emit yet another value. At the\
    \ moment of the subscription the items cached are 2 and 3, because 1 happened\
    \ too long ago (around 250 milliseconds ago), so it is no longer cached.\n\nSubjects\
    \ are a powerful tool that can save you a lot of time. They provide great solutions\
    \ to common scenarios like caching and repeating. And since at their core they\
    \ are just Observables and Observers, you don't need to learn anything new.\n\n\
    ## Spaceship Reactive!\n\nTo show how we can keep an application pure, we'll build\
    \ a video game in which our hero fights endless hordes of enemy spaceships. We'll\
    \ make heavy use of Observable pipelines, and I'll point out along the way when\
    \ it might be tempting to store state outside the pipeline and how to avoid it.\n\
    \nVideo games notoriously keep a lot of external state—scores, screen coordinates\
    \ for the characters, timers, and so on. Our plan is to build the whole game without\
    \ relying on a single external variable that keeps state.\n\nIn our game, the\
    \ player will move the spaceship horizontally using the mouse, and will shoot\
    \ by clicking the mouse or tapping the spacebar. Our game will have four main\
    \ actors: the moving star field in the background, the player’s spaceship, the\
    \ enemies, and the shots from both the player and the enemies.\n\nIt will look\
    \ like this:\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_68_0.png)\n\nIn the screenshot,\
    \ the red triangle is our spaceship and the green ones are the enemies. The tinier\
    \ triangles are the fired shots.\n\nLet's start by setting the stage; this will\
    \ be our HTML file:\n\n```html\nspaceship_reactive/spaceship.html\n<!DOCTYPE html>\n\
    <html>\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Spaceship Reactive!</title>\n\
    \    <script src=\"../rx.all-4.0.0.js\"></script>\n    <style>\n      html, body\
    \ {\n            margin: 0;\n            padding: 0;\n        }\n    </style>\n\
    </head>\n<body>\n    <script src=\"spaceship.js\"></script>\n</body>\n</html>\n\
    ```\n\nIt's just a simple HTML file that loads the JavaScript file we'll be working\
    \ with for the rest of the chapter. In that JavaScript file, we start by setting\
    \ up a canvas element where we'll render our game:\n\n```javascript\nspaceship_reactive/starfield_1.js\n\
    var canvas = document.createElement('canvas');\nvar ctx = canvas.getContext(\"\
    2d\");\ndocument.body.appendChild(canvas);\ncanvas.width = window.innerWidth;\n\
    canvas.height = window.innerHeight;\n```\n\nWith this in place we can start describing\
    \ our game's components. First let's draw our starry background.\n\n## Creating\
    \ the Star Field\n\nThe first things we need for a game set in space are stars.\
    \ We'll create a star field that scrolls down to give the feeling of traveling\
    \ through space. For this, we'll first generate the stars using the range operator:\n\
    \n```javascript\nspaceship_reactive/starfield_1.js\nvar SPEED = 40;\nvar STAR_NUMBER\
    \ = 250;\nvar StarStream = Rx.Observable.range(1, STAR_NUMBER)\n    .map(function()\
    \ {\n        return {\n            x: parseInt(Math.random() * canvas.width),\n\
    \            y: parseInt(Math.random() * canvas.height),\n            size: Math.random()\
    \ * 3 + 1\n        };\n    })\n```\n\nEach star will be represented by an object\
    \ that contains random coordinates and a size between 1 and 4. This code will\
    \ give us a stream that generates 250 of these \"stars.\"\n\nWe want these stars\
    \ to keep moving. A way to do that is to increase the y-coordinate every few milliseconds\
    \ for all stars. We'll transform the StarStream Observable into an array using\
    \ toArray, which will then emit an array containing all the objects generated\
    \ by range. Then we can pick up that with an array with a `flatMap` operator that\
    \ will transform the Observable into one that yields a value every few milliseconds.\
    \ Using map we can increase the y-coordinate in each item of the original array:\n\
    \n```javascript\nspaceship_reactive/starfield_1.js\nvar SPEED = 40;\nvar STAR_NUMBER\
    \ = 250;\nvar starStream = Rx.Observable.range(1, STAR_NUMBER)\n  .map(function()\
    \ {\n    return {\n      x: parseInt(Math.random() * canvas.width),\n      y:\
    \ parseInt(Math.random() * canvas.height),\n      size: Math.random() * 3 + 1\n\
    \    };\n  })\n  .toArray()\n  .flatMap(function(starArray) {\n    return Rx.Observable.interval(SPEED).map(function()\
    \ {\n      starArray.forEach(function(star) {\n        if (star.y >= canvas.height)\
    \ {\n          star.y = 0; // Reset star to top of the screen\n        }\n   \
    \     star.y += 3; // Move star\n      });\n      return starArray;\n    });\n\
    \  });\n```\n\nInside map we check if the star y-coordinate is already outside\
    \ the screen, and in this case we reset it to 0. By changing the coordinates in\
    \ every star object we can keep using the same array of stars all the time.\n\n\
    Now we need a small helper function that “paints” an array of stars on our canvas:\n\
    \n```javascript\nspaceship_reactive/starfield_1.js\nfunction paintStars(stars)\
    \ {\n  ctx.fillStyle = '#000000';\n  ctx.fillRect(0, 0, canvas.width, canvas.height);\n\
    \  ctx.fillStyle = '#ffffff';\n  stars.forEach(function(star) {\n    ctx.fillRect(star.x,\
    \ star.y, star.size, star.size);\n  });\n}\n```\n\npaintStars paints a black background\
    \ and draws the stars on the canvas. The only thing left to achieve a moving star\
    \ field is to subscribe to the Observable and call paintStars with the resulting\
    \ array. Here’s the final code:"
  mdcn: "\n在代码中，我们使用占位内容初始化一个新的 `BehaviorSubject`。然后我们订阅它，并根据结果在 `onNext` 和 `onError`\
    \ 中分别更改 HTML 正文内容。\n\n现在 HTML 正文包含我们的占位文本，并且将保持这种状态，直到 Subject 发射一个新值。最后，我们请求所需的资源，并将我们的\
    \ Subject 订阅到生成的 Observer 上。\n\n`BehaviorSubject` 保证始终至少会发射一个值，因为我们在其构造函数中提供了一个默认值。一旦\
    \ `BehaviorSubject` 完成，它将不再发射任何值，从而释放缓存值所占用的内存。\n\n### ReplaySubject\n\n`ReplaySubject`\
    \ 会缓存其值，并将其重新发射给任何延迟订阅它的 Observer。与 `AsyncSubject` 不同，这种行为不需要序列完成才能发生。\n\n| Subject\
    \ | ReplaySubject |\n| :--- | :--- |\n| `var subject = new Rx.Subject();` | `var\
    \ subject = new Rx.ReplaySubject();` |\n| `subject.onNext(1);` | `subject.onNext(1);`\
    \ |\n| `subject.subscribe(function(n) { console.log('Received value:', n); });`\
    \ | `subject.subscribe(function(n) { console.log('Received value:', n); });` |\n\
    | `subject.onNext(2);` <br> `subject.onNext(3);` | `subject.onNext(2);` <br> `subject.onNext(3);`\
    \ |\n| `Received value: 2` <br> `Received value: 3` | `Received value: 1` <br>\
    \ `Received value: 2` <br> `Received value: 3` |\n\n`ReplaySubject` 对于确保 Observer\
    \ 能从一开始就获得 Observable 发射的所有值非常有用。它使我们无需编写缓存之前值的繁琐代码，从而避免了棘手的并发相关 Bug。\n\n当然，为了实现这种行为，`ReplaySubject`\
    \ 将所有值缓存在内存中。为了防止它占用过多内存，我们可以通过缓冲区大小或时间窗口来限制其存储的数据量，或者在构造函数中传递特定参数。\n\n`ReplaySubject`\
    \ 构造函数的第一个参数接收一个数字，代表我们想要缓冲的值的数量：\n\n```javascript\nvar subject = new Rx.ReplaySubject(2);\
    \ // 缓冲区大小为 2\n\nsubject.onNext(1);\nsubject.onNext(2);\nsubject.onNext(3);\n\n\
    subject.subscribe(function(n) {\n    console.log('Received value:', n);\n});\n\
    ```\n\n> Received value: 2\n> Received value: 3\n\n第二个参数接收一个数字，代表我们想要缓冲值的毫秒数：\n\
    \n```javascript\nvar subject = new Rx.ReplaySubject(null, 200); // 缓冲时间为 200ms\n\
    \nsetTimeout(function() { subject.onNext(1); }, 100);\nsetTimeout(function() {\
    \ subject.onNext(2); }, 200);\nsetTimeout(function() { subject.onNext(3); }, 300);\n\
    setTimeout(function() { \n    subject.subscribe(function(n) {\n        console.log('Received\
    \ value:', n);\n    });\n}, 350);\n\nsubject.onNext(4);\n```\n\n在这个例子中，我们设置了基于时间的缓冲区，而不是基于值的数量。我们的\
    \ `ReplaySubject` 将缓存直到 200 毫秒前发射的值。我们每隔 100 毫秒发射三个值，在 350 毫秒后我们订阅一个 Observer\
    \ 并再次发射一个值。在订阅瞬间，缓存的项是 2 和 3，因为 1 发生的时间太久之前（大约 250 毫秒前），因此不再被缓存。\n\nSubject 是一个强大的工具，可以为你节省大量时间。它们为缓存和重复等常见场景提供了极佳的解决方案。由于其核心本质就是\
    \ Observable 和 Observer，你不需要学习任何新东西。\n\n## 反应式飞船！\n\n为了展示如何保持应用程序的纯净，我们将构建一个视频游戏，在游戏中我们的英雄将与无穷无尽的敌方飞船群战斗。我们将大量使用\
    \ Observable 管道，并在过程中指出什么时候可能会倾向于在管道外部存储状态，以及如何避免这样做。\n\n众所周知，视频游戏会保留大量的外部状态——得分、角色的屏幕坐标、定时器等等。我们的计划是在不依赖任何保留状态的外部变量的情况下构建整个游戏。\n\
    \n在我们的游戏中，玩家将使用鼠标水平移动飞船，并通过点击鼠标或敲击空格键进行射击。我们的游戏将有四个主要参与者：背景中移动的星场、玩家的飞船、敌人，以及玩家和敌人发射的子弹。\n\
    \n它看起来像这样：\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_68_0.png)\n\n在截图中，红色三角形是我们的飞船，绿色的是敌人。更小的三角形是发射的子弹。\n\
    \n让我们先搭建舞台；这将是我们的 HTML 文件：\n\n```html\nspaceship_reactive/spaceship.html\n<!DOCTYPE\
    \ html>\n<html>\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Spaceship\
    \ Reactive!</title>\n    <script src=\"../rx.all-4.0.0.js\"></script>\n    <style>\n\
    \      html, body {\n            margin: 0;\n            padding: 0;\n       \
    \ }\n    </style>\n</head>\n<body>\n    <script src=\"spaceship.js\"></script>\n\
    </body>\n</html>\n```\n\n这只是一个简单的 HTML 文件，用于加载我们在本章剩余部分将要处理的 JavaScript 文件。在该\
    \ JavaScript 文件中，我们首先设置一个用于渲染游戏的 canvas 元素：\n\n```javascript\nspaceship_reactive/starfield_1.js\n\
    var canvas = document.createElement('canvas');\nvar ctx = canvas.getContext(\"\
    2d\");\ndocument.body.appendChild(canvas);\ncanvas.width = window.innerWidth;\n\
    canvas.height = window.innerHeight;\n```\n\n准备就绪后，我们可以开始描述游戏的组件。首先，让我们绘制星空背景。\n\
    \n## 创建星场\n\n对于一个设定在太空中的游戏，首先需要的是星星。我们将创建一个向下滚动地星场，以营造在太空中穿行的感觉。为此，我们首先使用 `range`\
    \ 操作符生成星星：\n\n```javascript\nspaceship_reactive/starfield_1.js\nvar SPEED = 40;\n\
    var STAR_NUMBER = 250;\nvar StarStream = Rx.Observable.range(1, STAR_NUMBER)\n\
    \    .map(function() {\n        return {\n            x: parseInt(Math.random()\
    \ * canvas.width),\n            y: parseInt(Math.random() * canvas.height),\n\
    \            size: Math.random() * 3 + 1\n        };\n    })\n```\n\n每颗星将由一个包含随机坐标和\
    \ 1 到 4 之间大小的对象表示。这段代码将给我们一个生成 250 颗此类“星星”的流。\n\n我们希望这些星星能够持续移动。一种方法是每隔几毫秒增加所有星星的\
    \ y 坐标。我们将使用 `toArray` 将 `StarStream` Observable 转换为一个数组，该数组将发射一个包含 `range` 生成的所有对象的数组。然后我们可以通过\
    \ `flatMap` 操作符接管该数组，将 Observable 转换为一个每隔几毫秒产生一个值的流。使用 `map`，我们可以增加原数组中每个项的 y\
    \ 坐标：\n\n```javascript\nspaceship_reactive/starfield_1.js\nvar SPEED = 40;\nvar\
    \ STAR_NUMBER = 250;\nvar starStream = Rx.Observable.range(1, STAR_NUMBER)\n \
