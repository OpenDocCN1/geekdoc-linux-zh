  md: "as we keep adding more concurrency to our applications, the code to coordinate\
    \ asynchronous flows becomes unwieldy. Current mechanisms all have serious shortcomings\
    \ that hinder the developer's productivity and make for fragile applications.\n\
    \nHere's a quick rundown of the current mechanisms for handling asynchronous operations,\
    \ along with their problems.\n\n# ### Callback Functions\n\nA *callback* is a\
    \ function (*A*) passed as a parameter to another function (*B*) that performs\
    \ an asynchronous operation. When (*B*) is done, it *calls back* (*A*) with the\
    \ results of the operation. Callbacks are used to manage asynchronous flows such\
    \ as network I/O, database access, or user input.\n\n```\n```javascript\nintro/callback_example.js\n\
    function B(callback) {\n  // Do operation that takes some time\n  callback('Done!');\n\
    }\n\nfunction A(message) {\n  console.log(message);\n}\n\n// Execute `B` with\
    \ `A` as a callback\nB(A);\n```\n```\n\nCallbacks are easy to grasp and have become\
    \ the default way of handling asynchronous data flows in JavaScript. But this\
    \ simplicity comes at a price. Callbacks have the following drawbacks:\n\n+  \
    \ - *Callback hell*. It's easy to end up with lots of nested callbacks when handling\
    \ highly asynchronous code. When that happens, code stops being linear and becomes\
    \ hard to reason about. Whole applications end up passed around in callbacks,\
    \ and they become difficult to maintain and debug.\n- *Callbacks can run more\
    \ than once*. There's no guarantee the same callback will be called only once.\
    \ Multiple invocations can be hard to detect and can result in errors and general\
    \ mayhem in your application.\n- *Callbacks change error semantics*. Callbacks\
    \ break the traditional `try/catch` mechanism and rely on the programmer to check\
    \ for errors and pass them around."
  merge: -1
  pgno: 13
- img_proc: true
  md: '+   - *Concurrency gets increasingly complicated*. Combining interdependent
    results of multiple asynchronous operations becomes difficult. It requires us
    to keep track of the state of each operation in temporal variables, and then delegate
    them to the final combination operation in the proper order.


    # ### Promises


    Promises came to save us from callbacks. A promise represents the result of an
    asynchronous operation. In promise-based code, calling an asynchronous function
    immediately returns a “promise” that will eventually be either *resolved* with
    the result of the operation or *rejected* with an error. In the meantime, the
    *pending* promise can be used as a placeholder for the final value.


    Promises usually make programs more clear by being closer to synchronous code,
    reducing the need for nesting blocks and keeping track of less state.


    Unfortunately, promises are not a silver bullet. They’re an improvement over callbacks,
    but they have a major shortcoming: they only ever yield a single value. That makes
    them useless for handling recurrent events such as mouse clicks or streams of
    data coming from the server, because we would have to create a promise for each
    separate event instead of creating a promise that handles the stream of events
    as it comes.


    # ### Event Emitters


    When we emit an event, event listeners that are subscribed to it will fire. Using
    events is a great way to decouple functionality, and in JavaScript, event programming
    is common and generally a good practice.


    But, you guessed it, event listeners come with their own set of problems, too:


    +   - *Events force side effects*. Event listener functions always ignore their
    return values, which forces the listener to have side effects if it wants to have
    any impact in the world.

    - *Events are not first-class values*. For example, a series of click events can’t
    be passed as a parameter or manipulated as the sequence it actually is. We’re
    limited to handling each event individually, and only after the event happens.

    - *It is easy to miss events if we start listening too late*. An infamous example
    of that is the first version of the *streams* interface in Node.js, which would
    often emit its data event before listeners had time to listen to it, losing it
    forever.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Since these mechanisms are what we’s always used to manage concurrency, it
    might be hard to think of a better way. But in this book I’ll show you one: reactive
    programming and RxJS try to solve all these problems with some new concepts and
    mechanisms to make asynchronous programming a breeze—and much more fun.


    # What Is Reactive Programming?


    Reactive programming is a programming paradigm that encompasses many concepts
    and techniques. In this book I’ll focus particularly on creating, transforming,
    and reacting to streams of data. Mouse clicks, network requests, arrays of strings—all
    these can be expressed as streams to which we can “react” as they publish new
    values, using the same interfaces regardless of their source.


    Reactive programming focuses on propagating changes without our having to explicitly
    specify how the propagation happens. This allows us to state what our code should
    do, without having to code every step to do it. This results in a more reliable
    and maintainable approach to building software.


    # What Is RxJS?


    RxJS is a JavaScript implementation of the Reactive Extensions, or Rx.² Rx is
    a reactive programming model originally created at Microsoft that allows developers
    to easily compose asynchronous streams of data. It provides a common interface
    to combine and transform data from wildly different sources, such as filesystems
    operations, user interaction, and social-network updates.


    Rx started with an implementation for .NET, but today it has a well-maintained
    open source implementation in every major language (and some minor ones). It is
    becoming the standard to program reactive applications, and Rx’s main data type,
    the Observable, is being proposed for inclusion in ECMAScript 7 as an integral
    part of JavaScript.


    # Who This Book Is For


    This book is for developers with some experience with JavaScript. You should be
    comfortable with closures and higher-order functions, and you should understand
    the scope rules in JavaScript. That being said, I try to explain the most complex
    language concepts we go through in this book.


    2. https://rx.codeplex.com/'
