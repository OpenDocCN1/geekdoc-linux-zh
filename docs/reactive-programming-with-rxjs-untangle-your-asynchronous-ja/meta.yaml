  md: "In fewer than 20 lines, we've written an application that regularly polls an\
    \ external JSONP URL, extracts concrete data from its contents, and then filters\
    \ out earthquakes that have already been imported. After that, we represent the\
    \ earthquakes on a map, with a size proportional to their magnitude—all written\
    \ in a self-contained, clear, and concise way, without relying on external notes.\
    \ Not bad at all! That shows how expressive Observables can be.\n\n# Ideas for\
    \ Improvements\n\nHere are a couple of ideas to put your newly acquired RxJS skills\
    \ to use and make this little application a bit more interesting:\n\n+   - When\
    \ the user hovers the mouse over an earthquake, offer a pop-up that shows more\
    \ information about that particular earthquake. One way to do that would be to\
    \ create a new Observable from the quakes one with just the properties you want\
    \ to show, and dynamically filter it upon hovering.\n- Implement a counter at\
    \ the top of the page that shows the number of earthquakes so far today and resets\
    \ every day.\n\n# Operator Rundown\n\nThis chapter presented you with a few new\
    \ operators, so here’s a recap of them, along with some scenarios for ways we\
    \ can use them in our applications. Remember, you can always find the complete\
    \ API documentation for operators on the RxJS GitHub site.⁴\n\n+   - Rx.Observable.from\n\
    \n  Default behavior: *Synchronous*\n\n  Since many of the data sources you use\
    \ in your applications will come from arrays or iterables, it makes sense to have\
    \ an operator that creates Observables out of them. from is one of the operators\
    \ you'll use the most.\n\n  With from we can create Observables from arrays, array-like\
    \ objects (for instance, the arguments object or DOM NodeLists), and even types\
    \ that implement the iterable protocol, such as String, Map, and Set.⁵\n- Rx.Observable.range\n\
    \n  Default behavior: *Synchronous*\n\n> 4. https://github.com/Reactive-Extensions/RxJS/blob/master/doc/api/core/observable.md\n\
    5. https://developer.mozilla.org/ca/Docs/Web/JavaScript/Reference/Iteration_protocols"
