- img_proc: true
  md: "# # Building Concurrent Programs\n\nConcurrency is the art of doing several\
    \ things at the same time, correctly and efficiently. To accomplish this, we structure\
    \ our programs to take advantage of time so that tasks run together in the most\
    \ efficient way. Examples of everyday concurrency in applications include keeping\
    \ the user interface responsive while other activities are happening, and processing\
    \ hundreds of customers' orders efficiently.\n\nIn this chapter we'll explore\
    \ concurrency and pure functions in RxJS by making a shoot-'em-up spaceship game\
    \ for the browser. We'll first introduce the Observable pipeline, a technique\
    \ to chain Observable operators and pass state between them. Then I'll show you\
    \ how to use the pipeline to build programs without relying on external state\
    \ or side effects, by encapsulating all your logic and state inside the Observables\
    \ themselves.\n\nVideo games are computer programs that need to keep a lot of\
    \ state, but we'll write our game with no external state whatsoever, using the\
    \ power of the Observable pipeline and some great RxJS operators.\n\n# ## Purity\
    \ and the Observable Pipeline\n\nAn Observable pipeline is a group of operators\
    \ chained together, where each one takes an Observable as input and returns an\
    \ Observable as output. We've been using pipelines in this book: they are ubiquitous\
    \ when programming with RxJS. Here's a simple one:\n\n```\n```javascript\nspaceship_reactive/pipeline.js\n\
    Rx.Observable\n  .from(1, 2, 3, 4, 5, 6, 7, 8)\n  .filter(function(val) { return\
    \ val % 2; })\n  .map(function(val) { return val * 10; });\n```\n```"
  merge: -1
  pgno: 56
- img_proc: true
  md: "Pipelines are self-contained. All state flows from one operator to the next,\
    \ without the need for any external variables. But as we build our reactive programs,\
    \ we may be tempted to store state outside the Observable pipeline (we talked\
    \ about external state in Side Effects and External State, on page 5). This forces\
    \ us to keep track of the variables we set outside the pipeline, and all that\
    \ bean-counting can easily lead to bugs. To avoid this, the operators in a pipeline\
    \ should always use pure functions.\n\nPure functions always return the same output\
    \ given the same input. It's easier to design programs with high concurrency when\
    \ we can guarantee that a function in the program can't modify state other functions\
    \ rely on. And that's what pure functions give us.\n\n# Avoiding External State\n\
    \nIn the following example we count the even numbers that `interval` has yielded\
    \ so far. We do this by creating an Observable from `interval` ticks and increasing\
