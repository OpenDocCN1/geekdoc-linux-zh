  md: "To make the code more testable, let’s encapsulate the Observable in a function\
    \ that takes a Scheduler we use in the `bufferWithTime` operator. It’s always\
    \ a good idea to parameterize Schedulers in Observables that will be tested.\n\
    \n```\n```javascript\nch_schedulers/testscheduler.js\nfunction quakeBatches(scheduler)\
    \ {\n    return quakes.pluck('properties')\n        .bufferWithTime(500, null,\
    \ scheduler || null)\n        .filter(function(rows) {\n            return rows.length\
    \ > 0;\n        });\n}\n```\n```\n\nLet’s also simplify the code by taking some\
    \ steps out but keeping the essence. This code takes an Observable of JSON objects\
    \ that contain a properties property, buffers them into batches released every\
    \ 500 milliseconds, and filters the batches that come empty.\n\nWe want to verify\
    \ that this code works, but we definitely don’t want to wait several seconds every\
    \ time we run tests to make sure that our buffering works as expected. This is\
    \ where virtual time and the TestScheduler will help us:\n\n```\n```javascript\n\
    ch_schedulers/testscheduler.js\n1 var onNext = Rx.ReactiveTest.onNext;\n  var\
    \ onCompleted = Rx.ReactiveTest.onCompleted;\n  var subscribe = Rx.ReactiveTest.subscribe;\n\
    \n2 var scheduler = new Rx.TestScheduler();\n\n3 var quakes = scheduler.createHotObservable(\n\
    \    onNext(100, { properties: 1 }),\n    onNext(300, { properties: 2 }),\n  \
    \  onNext(550, { properties: 3 }),\n    onNext(750, { properties: 4 }),\n    onNext(1000,\
    \ { properties: 5 }),\n    onCompleted(1100)\n  );\n\n4 QUnit.test(\"Test quake\
    \ buffering\", function(assert) {\n5     var results = scheduler.startScheduler(function()\
    \ {\n            return quakeBatches(scheduler)\n        }, {\n            created:\
    \ 0,\n            subscribed: 0,\n            disposed: 1200\n        });\n  \
    \  });\n\n6 var messages = results.messages;\n  console.log(results.scheduler\
    \ === scheduler);\n```\n```"
