    \ it in the onNext callback.\n\nWe'll use plenty of convenient operators like\
    \ this throughout this book. RxJS comes with \"batteries included.\" In fact,\
    \ that is one of its main strengths.\n\n### One Data Type to Rule Them All\n\n\
    In an RxJS program, we should strive to have all data in Observables, not just\
