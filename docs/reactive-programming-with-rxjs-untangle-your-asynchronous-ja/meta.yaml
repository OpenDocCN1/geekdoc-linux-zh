    \  .combineLatest(\n    StarStream, SpaceShip,\n    function(stars, spaceship)\
    \ {\n      return { stars: stars, spaceship: spaceship };\n    }\n  );\n\nGame.subscribe(renderScene);\n\
    ```\n```\n\nWe’re now using a render function renderScene to paint everything\
