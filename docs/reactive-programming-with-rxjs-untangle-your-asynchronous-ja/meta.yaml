    \n让我们把英雄渲染到屏幕上。在这个游戏中，所有角色都是三角形（我的平面设计能力实在不怎么样），所以我们将定义一个辅助函数，根据给定的坐标、大小、颜色以及朝向，在画布上渲染三角形：\n\
