    \ to them. So let's take care of that:\n\n```\n// Subscribe an Observer to it\n\
    test.subscribe({\n    function onNext(x) { console.log('Result: ' + x); },\n \
    \   function onError(err) { console.log('Error: ' + err); },\n    function onCompleted()\
    \ { console.log('Completed'); }\n});\n```\n\nThe first thing to notice is that\
    \ we're not explicitly creating an Observer like we did in the code on page 11.\
    \ Most of the time we'll use this shorter version, in which we call the subscribe\
    \ operator in the Observable with the three functions for the Observer cases:\
    \ onNext, onCompleted, and onError.\n\nsubscribe then sets everything in motion.\
    \ Before the subscription, we had merely declared how the Observable and Observer\
    \ duo will interact. It is only when we call subscribe that the gears start turning.\n\
    \n# There Is (Almost) Always an Operator\n\nIn RxJS, methods that transform or\
    \ query sequences are called operators. Operators are found in the static Rx.Observable\
    \ object and in Observable instances. In our example, create is one such operator.\n\
    \ncreate is a good choice when we have to create a very specific Observable, but\
    \ RxJS provides plenty of other operators that make it easy to create Observables\
    \ for common sources.\n\nLet's look again at our previous example. For such a\
    \ common operation as an Ajax request there is often an operator ready for us\
    \ to use. In this case, the RxJS DOM library provides several ways to create Observables\
    \ from DOM-related sources. Since we're doing a GET request, we can use Rx.DOM.Request.get,\
    \ and our code then becomes this:\n\n```\nRx.DOM.get('/api/contents.json').subscribe({\n\
    \    function onNext(data) { console.log(data.response); },\n    function onError(err)\
    \ { console.error(err); }\n});\n```\n\n3. https://github.com/Reactive-Extensions/RxJS-DOM"
  - "[PAGE 31]\n\nThis bit of code does exactly the same as our previous one, but\
    \ we don't have to create a wrapper around XMLHttpRequest; it's already there.\
    \ Notice that this time we omitted the onCompleted callback, because we don't\
    \ plan to react when the Observable is done. We know that it will yield only one\
    \ result, and we are already using it in the onNext callback.\n\nWe'll use plenty\
    \ of convenient operators like this throughout this book. RxJS comes with \"batteries\
    \ included.\" In fact, that is one of its main strengths.\n\n> ### One Data Type\
    \ to Rule Them All\n\nIn an RxJS program, we should strive to have all data in\
    \ Observables, not just data that comes from asynchronous sources. Doing that\
    \ makes it easy to combine data from different origins, like an existing array\
    \ with the result of a callback, or the result of an XMLHttpRequest with some\
    \ event triggered by the user.\n\nFor example, if we have an array whose items\
    \ need to be used in combination with data from somewhere else, it's better to\
    \ make this array into an Observable. (Obviously, if the array is just an intermediate\
    \ variable that doesn't need to be combined, there is no need to do that.) Throughout\
    \ the book, you'll learn in which situations it's worth transforming data types\
    \ into Observables.\n\nRxJS provides operators to create Observables from most\
    \ JavaScript data types. Let's go over the most common ones, which you'll be using\
    \ all the time: arrays, events, and callbacks.\n\n# Creating Observables from\
    \ Arrays\n\nWe can make any array-like or iterable object into an Observable by\
    \ using the versatile from operator. from takes an array as a parameter and returns\
    \ an Observable that emits each of its elements.\n\n```\nRx.Observable\n  .from(['Adrià',\
    \ 'Jen', 'Sergi'])\n  .subscribe({\n    function(x) { console.log('Next: ' + x);\
    \ },\n    function(err) { console.log('Error: ', err); },\n    function() { console.log('Completed');\
    \ }\n  });\n```\n\nfrom is, along with fromEvent, one of the most convenient and\
    \ frequently used operators in RxJS code."
  - "[PAGE 32]\n\n# Creating Observables from JavaScript Events\n\nWhen we transform\
    \ an event into an Observable, it becomes a first-class value that can be combined\
    \ and passed around. For example, here's an Observable that emits the coordinates\
    \ of the mouse pointer whenever it moves:\n\n```\n```javascript\nvar allMoves\
    \ = Rx.Observable.fromEvent(document, 'mousemove')\nallMoves.subscribe(function(e)\
    \ {\n  console.log(e.clientX, e.clientY);\n});\n```\n```\n\nTransforming an event\
    \ into an Observable unleashes the event from its natural constraints. More importantly,\
    \ we can create new Observables based on the original Observables. These new ones\
    \ are independent and can be used for different tasks:\n\n```\n```javascript\n\
    var movesOnTheRight = allMoves.filter(function(e) {\n  return e.clientX > window.innerWidth\
    \ / 2;\n});\n\nvar movesOnTheLeft = allMoves.filter(function(e) {\n  return e.clientX\
    \ < window.innerWidth / 2;\n});\n```\n```\n\n```\n```javascript\nmovesOnTheRight.subscribe(function(e)\
    \ {\n  console.log('Mouse is on the right:', e.clientX);\n});\n\nmovesOnTheLeft.subscribe(function(e)\
    \ {\n  console.log('Mouse is on the left:', e.clientX);\n});\n```\n```\n\nIn the\
    \ preceding code, we create two Observables from the original `allMoves` one.\
    \ These specialized Observables contain only filtered items from the original\
    \ one: `movesOnTheRight` contains mouse events that happen on the right side of\
    \ the screen, and `movesOnTheLeft` contains mouse events that happen on the left\
    \ side. Neither of them modify the original Observable: `allMoves` will keep emitting\
    \ all mouse moves. Observables are immutable, and every operator applied to them\
    \ creates a new Observable.\n\n# Creating Observables from Callback Functions\n\
    \nChances are you will have to interact with callback-based code if you use third-party\
    \ JavaScript libraries. We can transform our callbacks into Observables using\
    \ two functions, `fromCallback` and `fromNodeCallback`. Node.js follows the convention\
    \ of always invoking the callback function with an error argument"
