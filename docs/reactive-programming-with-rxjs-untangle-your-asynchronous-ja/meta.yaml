  md: "model, the view, and the intent. MVI is designed to fit the Reactive model\
    \ of programming like a glove.\n\nMVI being reactive means that each component\
    \ observes its dependencies and reacts to the dependencies' changes. This is different\
    \ from MVC, in which a component knows its dependents and modifies them directly.\
    \ A component (C) *declares* which other components influence it, instead of other\
    \ components updating (C) explicitly.\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_129_0.png)\n\
    \nThe three components in MVI are represented by Observables, the output of each\
    \ being the input of another component.\n\nThe *model* represents the current\
    \ application state. It takes processed user input from the *intent* and it outputs\
    \ events about data changes that are consumed by the *view*.\n\nThe view is a\
    \ visual representation of our model. It takes an Observable with the model state,\
    \ and it outputs all the potential DOM events and the virtual tree of the page.\n\
    \nThe intent is the new component in MVI. An intent takes input from the user\
    \ and translates it to actions in our model.\n\nWe can make the three kinds of\
    \ components more clear in our application if we reshuffle and rename our code\
    \ a bit:\n\n```\n```javascript\ncycle/index-mvi.js\nfunction intent(JSONP) {\n\
    \    return JSONP.filter(function(res$) {\n        return res$.request.indexOf(API_URL)\
    \ === 0;\n    })\n    .concatAll()\n    .pluck('query', 'search');\n}\n```\n```"
