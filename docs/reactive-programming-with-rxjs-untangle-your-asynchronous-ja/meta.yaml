    \        observer.onCompleted();\n    };\n});\n\nloadJSONP(QUAKE_URL);\n}).flatMap(function\
    \ transform(dataset) {\n    return Rx.Observable.from(dataset.response.features);\n\
    });\n\nquakes.subscribe(function(quake) {\n    var coords = quake.geometry.coordinates;\n\
    \    var size = quake.properties.mag * 10000;\n    L.circle([coords[1], coords[0]],\
    \ size).addTo(map);\n});\n```\n```"
- md: "We're not manually managing the flow anymore. There are no loops or conditionals\
    \ to extract the individual earthquake objects and pass them around. Here's what's\
    \ happening:\n\n- 1. `onNext` only happens once this time, and it yields the whole\
    \ JSON response.\n- 2. Since we'll only yield one time, we signal completion after\
    \ `onNext`.\n- 3. We're chaining the `flatMap` call to the result of create, so\
    \ `flatMap` will take each result from the Observable (in this case only one),\
    \ use it as a parameter for the transform function, and merge the Observable resulting\
    \ from that function into the source Observable.\n- 4. Here we take the features\
    \ array containing all the earthquakes and create an Observable from it. Because\
    \ of `flatMap`, this will become the actual Observable that the quakes variable\
    \ will contain.\n- 5. Subscribe doesn't change at all; it keeps dealing with a\
    \ stream of earthquakes just like before.\n\n## There Is Always a Method\n\nSo\
    \ far we've used RxJS operators included in `rx.all.js`, but it's usually worth\
    \ checking out operators that come with other RxJS-based libraries. In our case,\
    \ we'll look at RxJS-DOM. RxJS-DOM is an external library that, among others,\
    \ contains an operator to handle JSONP requests: `jsonpRequest`. That saves us\
    \ some code and keeps us from using nasty global functions:\n\n```javascript\n\
    // examples_earthquake/code1_2.js\nvar quakes = Rx.DOM.jsonpRequest({\n    url:\
    \ QUAKE_URL,\n    jsonpCallback: 'eqfeed_callback'\n})\n.flatMap(function(result)\
    \ {\n    return Rx.Observable.from(result.response.features);\n})\n.map(function(quake)\
    \ {\n    return {\n        lat: quake.geometry.coordinates[1],\n        lng: quake.geometry.coordinates[0],\n\
    \        size: quake.properties.mag * 10000\n    };\n});\nquakes.subscribe(function(quake)\
    \ {\n    L.circle([quake.lat, quake.lng], quake.size).addTo(map);\n});\n```\n\n\
    - [https://github.com/Reactive-Extensions/RxJS-DOM](https://github.com/Reactive-Extensions/RxJS-DOM)\n\
    \nKeep in mind that for this code to run, you need to include the file `rx.dom.js`\
    \ from RxJS-DOM in the HTML. Notice how we've added a map operator that transforms\
    \ the earthquake objects into simple objects containing only the information we\
    \ need for our visualization: latitude, longitude, and magnitude of the earthquake.\
    \ The less functionality we put in the subscribe operator, the better.\n\n## Making\
    \ It Real Time\n\nOur reactive version of the earthquake application doesn't update\
    \ the map of earthquakes in real time. To implement that, we'll use the `interval`\
    \ operator—which we saw earlier in this chapter—and the `uber-distinct` operator.\
    \ Let me show you the code and then we'll go through the changes:\n\n```javascript\n\
    // examples_earthquake/code1_3.js\nvar quakes = Rx.Observable\n  .interval(5000)\n\
    \  .flatMap(function() {\n    return Rx.DOM.jsonpRequest({\n      url: QUAKE_URL,\n\
    \      jsonpCallback: 'eqfeed_callback'\n    });\n  })\n  .retry(3)\n  .flatMap(function(result)\
    \ {\n    return Rx.Observable.from(result.response.features);\n  })\n  .distinct(function(quake)\
    \ { return quake.properties.code; });\n\nquakes.subscribe(function(quake) {\n\
    \  var coords = quake.geometry.coordinates;\n  var size = quake.properties.mag\
    \ * 10000;\n\n  L.circle([coords[1], coords[0]], size).addTo(map);\n});\n```\n\
    \nIn the preceding code, we abuse `interval` to make new requests and process\
    \ them at regular intervals of five seconds. `interval` creates an Observable\
    \ that emits an incrementing number every five seconds. We don't do anything with\
    \ those numbers; instead, we use `flatMap` to retrieve the data of the `jsonpRequest`.\
    \ Notice also how we use `retry` to try again in case there are problems retrieving\
    \ the list at first.\n\nThe last operator we apply is `distinct`, which emits\
    \ only elements that haven't been emitted before. It takes a function that returns\
    \ the property to check for equality. This way we never redraw earthquakes that\
    \ are already drawn.\n\nIn fewer than 20 lines, we've written an application that\
    \ regularly polls an external JSONP URL, extracts concrete data from its contents,\
    \ and then filters out earthquakes that have already been imported. After that,\
    \ we represent the earthquakes on a map, with a size proportional to their magnitude—all\
    \ written in a self-contained, clear, and concise way, without relying on external\
    \ notes. Not bad at all! That shows how expressive Observables can be.\n\n## Ideas\
    \ for Improvements\n\nHere are a couple of ideas to put your newly acquired RxJS\
    \ skills to use and make this little application a bit more interesting:\n\n-\
    \ When the user hovers the mouse over an earthquake, offer a pop-up that shows\
    \ more information about that particular earthquake. One way to do that would\
    \ be to create a new Observable from the quakes one with just the properties you\
    \ want to show, and dynamically filter it upon hovering.\n- Implement a counter\
    \ at the top of the page that shows the number of earthquakes so far today and\
    \ resets every day.\n\n## Operator Rundown\n\nThis chapter presented you with\
    \ a few new operators, so here’s a recap of them, along with some scenarios for\
    \ ways we can use them in our applications. Remember, you can always find the\
    \ complete API documentation for operators on the RxJS GitHub site.⁴\n\n- **Rx.Observable.from**\n\
    \  \n  Default behavior: *Synchronous*\n  \n  Since many of the data sources you\
    \ use in your applications will come from arrays or iterables, it makes sense\
    \ to have an operator that creates Observables out of them. `from` is one of the\
    \ operators you'll use the most.\n  \n  With `from` we can create Observables\
    \ from arrays, array-like objects (for instance, the arguments object or DOM NodeLists),\
    \ and even types that implement the iterable protocol, such as String, Map, and\
    \ Set.⁵\n\n- **Rx.Observable.range**\n  \n  Default behavior: *Synchronous*\n\
    \  \n  The `range` operator generates finite Observables that emit integers in\
    \ a particular range. It is extremely versatile and can be used in many scenarios.\
    \ For example, you could use `range` to generate the initial squares on the board\
    \ of a game like Minesweeper.\n\n- **Rx.Observable.interval**\n  \n  Default behavior:\
    \ *Asynchronous*\n  \n  Each time you need to generate values spaced in time,\
    \ you'll probably start with an `interval` operator as the generator. Since `interval`\
    \ emits sequential integers every $x$ milliseconds (where $x$ is a parameter we\
    \ pass), we just need to transform the values to whatever we want. Our game in\
    \ [Chapter 3, Building Concurrent Programs, on page 39](link), is heavily based\
    \ on that technique.\n\n- **Rx.Observable.distinct**\n  \n  Default behavior:\
    \ *Same as the Observable it filters*\n  \n  `distinct` is one of these extremely\
    \ simple operators that saves a ton of development work. It filters out of the\
    \ sequence any value that has already been emitted. That keeps us from writing\
    \ time and again that error-prone boilerplate code that uses a dictionary somewhere\
    \ with the emitted results, against which we compare incoming results. You know\
    \ what kind of code I'm talking about. Yuck. That's gone with `distinct`.\n\n\
    `distinct` lets us use a function that specifies the comparison method. Additionally,\
    \ we can pass no arguments and it will use strict comparison to compare primitives\
    \ such as numbers or strings, and run deep comparisons in case of more complex\
    \ objects.\n\n---\n⁴ https://github.com/Reactive-Extensions/RxJS/blob/master/doc/api/core/observable.md\n\
    ⁵ https://developer.mozilla.org/ca/Docs/Web/JavaScript/Reference/Iteration_protocols\n\
    \n## Wrapping Up\n\nIn this chapter we covered how to visually represent and understand\
    \ Observable flows using marble diagrams. We've covered the most common operators\
    \ to transform Observables, and, more importantly, we've built a real-world application\
    \ using only Observable sequences, avoiding setting any external state, loops,\
    \ or conditional branches. We expressed our whole program in a declarative way,\
    \ without having to encode every step to accomplish the task at hand.\n\nIn the\
    \ next chapter we'll continue to explore Observable sequences, this time taking\
    \ a look at more advanced operators that allow you to control and bend flows and\
    \ data in your program like you've never imagined possible with procedural code!"
  mdcn: "\n我们不再手动管理流程了。不再需要通过循环或条件判断来提取单个地震对象并进行传递。以下是具体发生的过程：\n\n- 1. 这次 `onNext`\
    \ 仅触发一次，并产出整个 JSON 响应。\n- 2. 由于我们只产出一次，因此在 `onNext` 之后发出完成信号。\n- 3. 我们将 `flatMap`\
    \ 调用链接到 create 的结果上，因此 `flatMap` 会接收来自 Observable 的每个结果（在本例中只有一个），将其作为转换函数的参数，并将该函数生成的\
    \ Observable 合并到源 Observable 中。\n- 4. 在这里，我们获取包含所有地震信息的 features 数组并从中创建一个 Observable。由于使用了\
    \ `flatMap`，这将成为 quakes 变量实际包含的 Observable。\n- 5. Subscribe 完全没有变化；它依然像之前一样处理地震数据流。\n\
    \n## 总是有一种方法\n\n到目前为止，我们使用了包含在 `rx.all.js` 中的 RxJS 运算符，但通常值得去看看其他基于 RxJS 的库所提供的运算符。在我们的案例中，我们将\
    \ 살펴보 RxJS-DOM。RxJS-DOM 是一个外部库，其中包含一个用于处理 JSONP 请求的运算符：`jsonpRequest`。这为我们节省了一些代码，并避免了使用糟糕的全局函数：\n\
    \n```javascript\n// examples_earthquake/code1_2.js\nvar quakes = Rx.DOM.jsonpRequest({\n\
    \    url: QUAKE_URL,\n    jsonpCallback: 'eqfeed_callback'\n})\n.flatMap(function(result)\
    \ {\n    return Rx.Observable.from(result.response.features);\n})\n.map(function(quake)\
    \ {\n    return {\n        lat: quake.geometry.coordinates[1],\n        lng: quake.geometry.coordinates[0],\n\
    \        size: quake.properties.mag * 10000\n    };\n});\nquakes.subscribe(function(quake)\
    \ {\n    L.circle([quake.lat, quake.lng], quake.size).addTo(map);\n});\n```\n\n\
    - [https://github.com/Reactive-Extensions/RxJS-DOM](https://github.com/Reactive-Extensions/RxJS-DOM)\n\
    \n请记住，要运行这段代码，你需要在 HTML 中引入 RxJS-DOM 的 `rx.dom.js` 文件。请注意，我们添加了一个 map 运算符，将地震对象转换为仅包含可视化所需信息的简单对象：纬度、经度和地震震级。我们在\
    \ subscribe 运算符中放置的功能越少，效果就越好。\n\n## 实现实时更新\n\n我们这个响应式的地震应用程序目前还不能实时更新地震地图。为了实现这一点，我们将使用\
    \ `interval` 运算符（我们在本章前面看到过）和 `uber-distinct` 运算符。让我先向你展示代码，然后我们再分析具体变化：\n\n```javascript\n\
    // examples_earthquake/code1_3.js\nvar quakes = Rx.Observable\n  .interval(5000)\n\
    \  .flatMap(function() {\n    return Rx.DOM.jsonpRequest({\n      url: QUAKE_URL,\n\
    \      jsonpCallback: 'eqfeed_callback'\n    });\n  })\n  .retry(3)\n  .flatMap(function(result)\
    \ {\n    return Rx.Observable.from(result.response.features);\n  })\n  .distinct(function(quake)\
    \ { return quake.properties.code; });\n\nquakes.subscribe(function(quake) {\n\
    \  var coords = quake.geometry.coordinates;\n  var size = quake.properties.mag\
    \ * 10000;\n\n  L.circle([coords[1], coords[0]], size).addTo(map);\n});\n```\n\
    \n在上面的代码中，我们“滥用”了 `interval` 来每隔五秒定期发送新请求并处理它们。`interval` 创建一个每五秒发出一个递增数字的 Observable。我们并不处理这些数字；相反，我们使用\
    \ `flatMap` 来获取 `jsonpRequest` 的数据。同时注意，我们使用了 `retry`，以便在最初获取列表出现问题时尝试重新获取。\n\n\
    我们应用的最后一个运算符是 `distinct`，它只发出之前从未发出过的元素。它接收一个返回用于检查相等性的属性的函数。这样，我们永远不会重复绘制已经绘制过的地震点。\n\
    \n在不足 20 行代码的情况下，我们编写了一个应用程序，它可以定期轮询外部 JSONP URL，从其内容中提取具体数据，然后过滤掉已经导入的地震。之后，我们在地图上表示这些地震，其大小与震级成正比——所有这些都以一种自包含、清晰且简洁的方式编写，无需依赖外部变量。非常不错！这展示了\
    \ Observable 的表达能力有多强。\n\n## 改进想法\n\n这里有几个想法，可以让你运用新学到的 RxJS 技巧，让这个小应用程序变得更有趣：\n\
    \n- 当用户将鼠标悬停在某个地震点上时，弹出一个窗口显示该特定地震的更多信息。实现的一种方法是从 quakes Observable 创建一个新的 Observable，其中仅包含你想要显示的属性，并在悬停时动态过滤。\n\
    - 在页面顶部实现一个计数器，显示今日到目前为止的地震数量，并且每天重置。\n\n## 运算符回顾\n\n本章为你介绍了几个新的运算符，这里是对它们的总结，以及在应用程序中可以使用它们的一些场景。记住，你始终可以在\
    \ RxJS GitHub 站点上找到运算符的完整 API 文档。⁴\n\n- **Rx.Observable.from**\n  \n  默认行为：*同步\
    \ (Synchronous)*\n  \n  由于你在应用程序中使用的许多数据源来自数组或可迭代对象，因此拥有一个能从中创建 Observable 的运算符是有意义的。`from`\
    \ 是你会最经常使用的运算符之一。\n  \n  通过 `from`，我们可以从数组、类数组对象（例如 arguments 对象或 DOM NodeLists），甚至实现了可迭代协议的类型（如\
    \ String, Map 和 Set）创建 Observable。⁵\n\n- **Rx.Observable.range**\n  \n  默认行为：*同步\
    \ (Synchronous)*\n  \n  `range` 运算符生成有限的 Observable，发出特定范围内的整数。它非常通用，可用于多种场景。例如，你可以使用\
    \ `range` 来生成类似扫雷（Minesweeper）这类游戏棋盘上的初始方格。\n\n- **Rx.Observable.interval**\n\
    \  \n  默认行为：*异步 (Asynchronous)*\n  \n  每当你需要生成在时间上间隔的值时，你可能会从 `interval` 运算符开始作为生成器。由于\
    \ `interval` 每 $x$ 毫秒发出一个顺序整数（其中 $x$ 是我们传递的参数），我们只需将这些值转换为我们想要的任何形式即可。我们在 [第 3\
    \ 章《构建并发程序》，第 39 页](link) 中的游戏在很大程度上基于这种技术。\n\n- **Rx.Observable.distinct**\n\
    \  \n  默认行为：*与它过滤的 Observable 相同*\n  \n  `distinct` 是那些能节省大量开发工作的极其简单的运算符之一。它会过滤掉序列中任何已经发出过的值。这让我们免于一遍又一遍地编写那些容易出错的样板代码——即在某个地方使用字典存储已发出的结果，然后将传入结果与之对比。你知道我在说哪种代码。太糟糕了。有了\
    \ `distinct`，这些都消失了。\n\n`distinct` 允许我们使用一个函数来指定比较方法。此外，我们也可以不传递参数，它将使用严格比较来对比数字或字符串等原语，并在处理复杂对象时运行深度比较。\n\
    \n---\n⁴ https://github.com/Reactive-Extensions/RxJS/blob/master/doc/api/core/observable.md\n\
    ⁵ https://developer.mozilla.org/ca/Docs/Web/JavaScript/Reference/Iteration_protocols\n\
    \n## 本章小结\n\n在本章中，我们学习了如何使用大理石图（marble diagrams）来可视化表示和理解 Observable 流。我们涵盖了最常用的转换\
    \ Observable 的运算符，更重要的是，我们仅使用 Observable 序列构建了一个实际的应用程序，避免了设置任何外部状态、循环或条件分支。我们以声明式的方式表达了整个程序，而无需对完成任务的每个步骤进行编码。\n\
    \n在下一章中，我们将继续探索 Observable 序列，这次将关注更高级的运算符，它们允许你控制和引导程序中的流与数据，其灵活性是你之前难以想象程序化代码能实现的！\n"
