    \ y 坐标。这样，`Enemies` 每 1,500 毫秒就会发射一个包含当前所有敌人的数组。\n\n渲染敌人唯一还需要的是一个辅助函数，用于在画布上绘制每个敌人。该函数还将负责更新敌人数组中每个项的坐标：\n\
    \n```javascript\nspaceship_reactive/enemy_1.js\n// 获取随机整数的辅助函数\nfunction getRandomInt(min,\
    \ max) {\n  return Math.floor(Math.random() * (max - min + 1)) + min;\n}\n\nfunction\
