    \n### Adding the Player's Spaceship\n\nNow that we have our beautiful starry background,\
    \ we're ready to program the hero's spaceship. Even though it's the most important\
    \ object in the game, our spaceship is deceptively simple. It's an Observer of\
    \ mouse moves that emits the current mouse x-coordinate and a constant y-coordinate\
    \ (the player only moves horizontally, so we never change the y-coordinate):\n\
    \n```javascript\nspaceship_reactive/hero_1.js\nvar HERO_Y = canvas.height - 30;\n\
    var mouseMove = Rx.Observable.fromEvent(canvas, 'mousemove');\nvar SpaceShip =\
    \ mouseMove\n  .map(function(event) {\n    return {\n      x: event.clientX,\n\
    \      y: HERO_Y\n    };\n  })\n  .startWith({\n    x: canvas.width / 2,\n   \
    \ y: HERO_Y\n  });\n```\n\nNotice that I used `startWith()`. This sets the first\
    \ value in the Observable, and I set it to a position in the middle of the screen.\
    \ Without `startWith` our Observable would start emitting only when the player\
    \ moves the mouse.\n\nLet's render our hero on the screen. In this game all the\
    \ characters are triangles (my graphic-design skills are not very impressive),\
    \ so we'll define a helper function to render triangles on the canvas, given the\
    \ coordinates, size, and color, and the direction they're facing:\n\n```javascript\n\
    // spaceship_reactive/hero_1.js\nfunction drawTriangle(x, y, width, color, direction)\
    \ {\n  ctx.fillStyle = color;\n  ctx.beginPath();\n  ctx.moveTo(x + width, y);\n\
    \  ctx.lineTo(x, direction === 'up' ? y - width : y + width);\n  ctx.lineTo(x\
    \ + width, y);\n  ctx.lineTo(x - width, y);\n  ctx.fill();\n}\n```\n\nWe'll also\
    \ define `paintSpaceShip`, which uses the helper function:\n\n```javascript\n\
    // spaceship_reactive/hero_1.js\nfunction paintSpaceShip(x, y) {\n  drawTriangle(x,\
    \ y, 20, '#ff0000', 'up');\n}\n```\n\nBut we're facing a problem now. If we subscribe\
    \ to the `SpaceShip` Observable and call `drawTriangle` in the subscription, our\
    \ spaceship would be visible only when we move the mouse, and for just an instant.\
    \ This is because `starStream` is updating the canvas many times per second, erasing\
    \ our spaceship if we don't move the mouse. And because the `starStream` doesn't\
    \ have direct access to the spaceship, we can't render the spaceship in the `starStream`\
    \ subscription. We could save the latest spaceship coordinates to a variable that\
    \ the `starStream` can access, but then we would be breaking our rule of not modifying\
    \ external state. What to do?\n\nAs is usually the case, RxJS has a very convenient\
    \ operator we can use to solve our problem.\n\nRx.Observable.combineLatest is\
    \ a handy operator. It takes two or more Observables and emits the last result\
    \ of each Observable whenever any of them emits a new value. Knowing that starStream\
    \ emits a new item (the array of stars) so frequently, we can remove the starStream\
    \ subscription and use combineLatest to combine both the starStream and spaceShip\
    \ Observables and update them as soon as any of them emits a new item:\n\n```javascript\n\
    spaceship_reactive/hero_1.js\nfunction renderScene(actors) {\n  paintStars(actors.stars);\n\
    \  paintSpaceShip(actors.spaceship.x, actors.spaceship.y);\n}\n\nvar Game = Rx.Observable\n\
    \  .combineLatest(\n    StarStream, SpaceShip,\n    function(stars, spaceship)\
    \ {\n      return { stars: stars, spaceship: spaceship };\n    }\n  );\n\nGame.subscribe(renderScene);\n\
    ```\n\nWe’re now using a render function renderScene to paint everything on the\
    \ screen, so you can remove the following subscription code for StarStream:\n\n\
    ```javascript\n.subscribe(function(starArray) {\n  paintStars(starArray);\n});\n\
    ```\n\nWith this, we’ll paint the starry background *and* the spaceship every\
    \ time any Observable emits a new item. We now have a spaceship flying through\
    \ space, and we can move it at will using our mouse. Not bad for so little code!\
    \ But our hero’s spaceship is too lonely in the vastness of space. What about\
    \ giving it some company?\n\n## Generating Enemies\n\nThis would be a very boring\
    \ game if we didn’t have any enemies to take care of. So let’s create an infinite\
    \ stream of them! We want to create a new enemy every second and a half to not\
    \ overwhelm our hero. Let’s look at the code for the Enemies Observable and then\
    \ go through it:\n\n```javascript\nspaceship_reactive/enemy_1.js\nvar ENEMY_FREQ\
    \ = 1500;\nvar Enemies = Rx.Observable.interval(ENEMY_FREQ)\n  .scan(function(enemyArray)\
    \ {\n    var enemy = {\n      x: parseInt(Math.random() * canvas.width),\n   \
    \   y: -30,\n    };\n\n    enemyArray.push(enemy);\n    return enemyArray;\n \
    \ }, []);\n\nvar Game = Rx.Observable\n  .combineLatest(\n    StarStream, SpaceShip,\
    \ Enemies,\n    function(stars, spaceship, enemies) {\n      return {\n      \
    \  stars: stars,\n        spaceship: spaceship,\n        enemies: enemies\n  \
    \    };\n    }\n  );\n\nGame.subscribe(renderScene);\n```\n\nTo create enemies,\
    \ we use an interval operator to run every 1,500 milliseconds, and then we use\
    \ the scan operator to create an array of enemies.\n\nWe briefly saw the scan\
    \ operator in [Can We Aggregate Infinite Observables?, on page 22](page_22). scan\
    \ aggregates results each time an Observable emits a value, and emits each intermediate\
    \ result. In the Enemies Observable we start with an empty array as scan's first\
    \ parameter and we push a new object to it in every iteration. The object contains\
    \ a random x-coordinate, and a fixed y-coordinate outside the visible screen.\
    \ With this, Enemies will emit an array with all the current enemies every 1,500\
    \ milliseconds.\n\nThe only thing left to render enemies is a helper function\
    \ to paint each of them on the canvas. This function will also be the one updating\
    \ the coordinates of each item in the enemies array:\n\n```javascript\nspaceship_reactive/enemy_1.js\n\
    // Helper function to get a random integer\nfunction getRandomInt(min, max) {\n\
    \  return Math.floor(Math.random() * (max - min + 1)) + min;\n}\n\nfunction paintEnemies(enemies)\
    \ {\n  enemies.forEach(function(enemy) {\n    enemy.y += 5;\n    enemy.x += getRandomInt(-15,\
    \ 15);\n\n    drawTriangle(enemy.x, enemy.y, 20, '#00ff00', 'down');\n  });\n\
    }\n```\n\nYou can see in `paintEnemies` that we are also changing the x-coordinate\
    \ randomly so that enemies move a bit unpredictably to the sides. Now we need\
    \ to update the function `renderScene` to include a call to `paintEnemies`.\n\n\
    You might have noticed a strange effect while playing the game we have so far:\
    \ if you move the mouse, the enemies go faster toward you! That *could* be a nice\
    \ feature in the game, but we definitely didn't intend to do that. Can you guess\
    \ what causes this bug?\n\nIf you guessed that it was related to the `paintEnemies`\
    \ function, you're right on the money. `combineLatest` renders our scene whenever\
    \ any of the Observables yields a value. If we don't move the mouse, the fastest\
    \ emitter will always be `starStream` because it has an interval of 40 milliseconds\
    \ (the Enemies Observable emits only every 1,500 milliseconds). When we move the\
    \ mouse, though, `SpaceShip` will emit faster than `starStream` (your mouse emits\
    \ coordinates *many* times per second), and `paintEnemies` will then execute that\
    \ many times, increasing the enemies' coordinates much faster.\n\nTo avoid this\
    \ scenario and similar problems in the future, we need to normalize the game's\
    \ speed so that no Observable can emit values faster than our chosen speed for\
    \ the game.\n\nAnd yes, as you may have guessed, RxJS has an operator for that.\n\
    \n### Avoid Drinking from the Firehose\n\nThere is such a thing as receiving data\
    \ too fast. Most of the time we want all the speed we can get, but depending on\
    \ the frequency at which the Observable streams values, we might want to drop\
    \ some of the values we receive. We're now in one of these scenarios. The speed\
    \ at which we render things onscreen is proportional to the speed of the fastest\
    \ Observable we have. It turns out that our fastest Observable is too fast for\
    \ us, and we need to establish a constant update speed in the game.\n\n`sample`\
    \ is a method in Observable instances that, given a time parameter in milliseconds,\
    \ returns an Observable that emits the last value emitted by the parent Observable\
    \ in each time interval."
