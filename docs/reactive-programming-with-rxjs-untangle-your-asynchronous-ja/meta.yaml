    \n  var time = new Date(tweetObj.created_at);\n  var timeText = time.toLocaleDateString()\
    \ + ' ' + time.toLocaleTimeString();\n\n  content = content.replace('${tweetImg}',\
    \ tweetObj.user.profile_image_url);\n  content = content.replace('${text}', tweetObj.text);\n\
    \  content = content.replace('${time}', timeText);\n\n  tweetEl.innerHTML = content;\n\
    \n  return tweetEl;\n}\n```\n\nAnd with this we finally have a sidebar with relevant,\
    \ geolocated tweets that can give us more insight about the areas affected by\
    \ the earthquakes.\n\n## Ideas for Improvements\n\nThis dashboard is already functional,\
    \ but there are many improvements that could be done. Some ideas to make it better:\n\
    \n- Add more earthquake databases. USGS is a fantastic resource, but it mainly\
    \ provides earthquakes happening in the United States. It would be interesting\
    \ to merge in earthquake reports from around the world, not just the United States,\
    \ and present them all together in the map. To do this, you could use the help\
    \ of `merge` and `mergeAll`, and use `distinct` with a selector function to avoid\
    \ duplicates.\n- Whenever the user clicks on a tweet, center the map on the related\
    \ earthquake. This would involve grouping the tweets by earthquake on the server,\
    \ and you'd probably want to use the `groupBy` operator to group tweets to a particular\
    \ geographical area.\n\n## Wrapping Up\n\nIn this chapter we've used RxJS to create\
    \ a reactive user interface that allows us to see different kinds of data about\
    \ earthquakes happening on the planet in real time. We've used RxJS both in the\
    \ browser client and in the Node.js server, showing how easy it is to use Observables\
    \ to manage different areas of an application.\n\nMore importantly, we've seen\
    \ that we can use RxJS in the same way on the client and on the server, bringing\
    \ the Observable sequence abstraction everywhere in our application. And not only\
    \ that. We could actually use RxJS concepts and operators across other programming\
    \ languages, since RxJS is supported in many of them.\n\nNext we'll look at *Schedulers*,\
    \ a more advanced object type in RxJS that allows us to control time and concurrency\
    \ with more precision, and provides a great help with testing our code.\n\n##\
    \ Bending Time with Schedulers\n\nAs soon as I discovered RxJS, I started using\
    \ it in my projects. For a while I thought I knew how to use it effectively, but\
    \ there was a nagging question: how do I know whether the operator I'm using is\
    \ synchronous or asynchronous? In other words, when exactly do operators emit\
    \ notifications? This seemed a crucial part of using RxJS correctly, but it felt\
    \ a bit blurry to me.\n\nThe `interval` operator, I thought, is clearly asynchronous,\
    \ so it must use something like `setTimeout` internally to emit items. But what\
    \ if I'm using `range`? Does it emit asynchronously as well? Does it block the\
    \ event loop? What about `from`? I was using these operators everywhere, but I\
    \ didn't know much about their internal concurrency model.\n\nThen I learned about\
    \ Schedulers.\n\nSchedulers are a powerful mechanism to precisely manage concurrency\
    \ in your applications. They give you fine-grained control over how an Observable\
    \ emits notifications by allowing you to change their concurrency model as you\
    \ go. In this chapter you'll learn how to use Schedulers and apply them in common\
    \ scenarios. We'll focus on testing, where Schedulers are especially useful, and\
    \ you'll learn how to make your own Schedulers.\n\n### Using Schedulers\n\nA Scheduler\
    \ is a mechanism to \"schedule\" an action to happen in the future. Each operator\
    \ in RxJS uses one Scheduler internally, selected to provide the best performance\
    \ in the most likely scenario.\n\nLet's see how we can change the Scheduler in\
    \ operators and the consequences of doing so. First let's create an array with\
    \ 1,000 integers in it:"
