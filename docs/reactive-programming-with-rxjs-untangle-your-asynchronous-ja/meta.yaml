    \    console.log('Observer 1: ' + x);\n});\n\n// publisher 连接并开始发布值\npublisher.connect();\n\
    \nsetTimeout(function() {\n    // 5 秒后，observer2 订阅它并开始接收\n    // 当前值，而不是整个序列。\n\
