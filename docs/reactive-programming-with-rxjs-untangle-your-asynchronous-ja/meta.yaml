    ## Acknowledgments


    I have so many people to thank. There are those who have helped shape the book
    and those who have helped shape me as a person. I couldn''t have done this without
    any of them. I would particularly like to thank the following:


    The exceptional people who came up with the Reactive Extensions library in the
    first place, and the ones who expanded and evangelized it. This book would obviously
    not exist without you: Erik Meijer, Matt Podwysocki, Bart De Smet, Wes Dyer, Jafar
    Husain, André Staltz, and many more I am probably forgetting.


    The folks at The Pragmatic Bookshelf. It has been a pleasure to work with you.
    Special thanks to Susannah Pfalzer, who has believed in the book since it was
    nothing but an idea. I was also extremely lucky to get Rebecca Gulick as my editor:
    You have been professional, patient, attentive to my questions, and a joy to work
    with. I''ve been a fan of Pragmatic''s books for a long time, and it has been
    a privilege to write a PragProg book myself. And, yes, both publishers, Dave Thomas
    and Andy Hunt, do read and review every book!


    The brilliant technical reviewers. David Bock, Javier Collado Cabezda, Fred Daoud,
    Iraklis Gozalishvili, Zef Hemel, Ramaninder Singh Jhaji, Aaron Kalair, Daniel
    Lamb, Brian Schau, and Stephen Wolff, as well as Pragmatic publishers Dave and
    Andy: This book is infinitely better thanks to all of you. You each selflessly
    put time and energy into reviewing this book, detecting complicated errors and
    saving me from one more embarrassing mistake. Any errors remaining in the book
    are my own fault.


    To my friends. The ones who are always there, no matter the time and the distance;
    you know who you are. Thanks for the laughs, the support, the love.


    My parents, Narcis Mansilla and Joana Molins. You are my guides and role models.
    You never ceased to believe in me and always encouraged me to take on bigger challenges.
    You bought me my first computer at a time when you struggled to pay the bills.
    That started it all, and I owe you everything.


    My son, Adrià. You were born while I was writing this book, and you have changed
    the meaning of life for me. You''ve already taught me so much in such little time,
    and I can''t wait to see what''s next.


    Finally, Jen, the love of my life. You have had infinite patience and supported
    me while I wrote a book in one of the busiest periods of our life so far. You
    are an inspiration to me and you make me a better human being in every way. You
    are my star.


    **Sergi Mansilla**


    Barcelona, December 2015'
