    \nRx.Observable.merge(a, b).subscribe(function(x) {\n    console.log(x);\n});\n\
    ```\n\n`< B0, A0, B1, A1, B2, A2, B3, A3, B4...`\n\nmerge 运算符的大理石图如下所示：\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_35_1.png)\n\
    \n这里，沿 y 轴的虚线箭头指向应用于序列 A 和 B 中每个元素的转换最终结果。结果 Observable 由 C 表示，它包含 A 和 B 的合并元素。如果不同\
    \ Observable 的元素在同一时间被发射，则这些元素在合并序列中的顺序是随机的。\n\n## 基础序列运算符\n\n在 RxJS 中转换 Observable\
    \ 的数十个运算符中，最常用的是那些任何具有良好集合处理能力的语言都具备的运算符：map、filter 和 reduce。在 JavaScript 中，你可以在\
    \ Array 实例中找到这些运算符。\n\nRxJS 遵循 JavaScript 约定，因此你会发现以下运算符的语法与数组运算符几乎相同。事实上，我们将同时展示使用数组和\
