  - "[PAGE 114]\n\nWhich gives us a much smoother animation. As a bonus, the code\
    \ is also cleaner!\n\n# Testing with Schedulers\n\nTesting is perhaps one of the\
    \ most compelling scenarios where we can use Schedulers. So far in this book we've\
    \ been coding our hearts out without thinking much about the consequences. But\
    \ in a real-world software project, we would be writing tests to make sure our\
    \ code works as we intend.\n\nTesting asynchronous code is hard. We usually run\
    \ into one of these problems:\n\n+   - Simulating asynchronous events is complicated\
    \ and error prone. The whole point of having tests is to avoid bugs and errors,\
    \ but if your tests themselves have errors, they're not helping.\n- If we want\
    \ to accurately test time-based functionality, automated testing becomes really\
    \ slow. For example, if we need to accurately test that an error is called after\
    \ four seconds of trying to retrieve a remote file, each test will take at least\
    \ that much time to run. If we run our test suite continuously, that impacts our\
    \ development time.\n\n# The TestScheduler\n\nRxJS gives us the TestScheduler,\
    \ a Scheduler designed to help with testing. TestScheduler allows us to emulate\
    \ time at our convenience and create deterministic tests, where they are guaranteed\
    \ to be 100% repeatable. Besides that, it allows us to execute operations that\
    \ would take a considerable amount of time and compress them into an instant,\
    \ while maintaining the test's accuracy.\n\nA TestScheduler is a specialization\
    \ of a VirtualTimeScheduler. VirtualTimeSchedulers execute actions in \"virtual\"\
    \ time instead of in real time. The Scheduled actions go in a queue and are assigned\
    \ a moment in virtual time. The Scheduler then runs the actions in order when\
    \ its clock advances. Because it is virtual time, everything runs immediately,\
    \ without having to wait for the time specified. Let's see an example:\n\n```\n\
    ```javascript\nvar onNext = Rx.ReactiveTest.onNext;\nQUnit.test(\"Test value order\"\
    , function(assert) {\n    var scheduler = new Rx.TestScheduler();\n    var subject\
    \ = scheduler.createColdObservable({\n        onNext(100, 'first'),\n        onNext(200,\
    \ 'second'),\n        onNext(300, 'third'),\n    });\n});\n```\n```"
