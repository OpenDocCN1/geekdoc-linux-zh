  md: 'We send the Wikipedia query URLs to the JSONP driver so that it retrieves its
    results. When those are available, it will emit them in `response.JSONP`, which
    we refine in `searchResults`.


    To render the final DOM tree, we use `combineLatest` with `searchDOM` and `searchResults`.
    Each of them causes the layout to change, so we’ll re-render the DOM tree whenever
    one of these two Observables emits an item.


    With the final code in hand, we can see the greatest point of Cycle.js. There
    are no different classes, special types, or “magic” happening in the framework.
    It’s all side effect-free functions that accept Observables and output more Observables.
    With only that, we have a concise web application framework that is clear, reactive,
    and fun to use. And it avoids side effects at all costs, making our web applications
    more robust.


    # Ideas for Improvements


    Besides being in urgent need of a better graphical design, our application could
    use some features to be more than a quick redirect to Wikipedia results:


    +   - Let the user bookmark particular results. You could add a little star next
    to every result in the list so that when the user clicks, it saves that result
    as a favorite. You could make the star into its own widget. Extra points if you
    use some persistent API (reactively), such as Local Storage or IndexedDB.

    - Show a “preview” of a result on the right side of the screen if the user clicks
    the link, with a synopsis and some meta information about it. If the user wants
    to go to the actual Wikipedia result, you can have a *Read More* link in it. Implement
    it as a widget.


    # Wrapping Up


    Now you know how to develop web applications that use modern techniques without
    abandoning the reactive philosophy. This chapter provided an idea of how to use
    Observables and RxJS as the internal engine of other frameworks or applications.
    By standing on the shoulders of Observables and the reactive way of life, we can
    enormously simplify web applications and reduce state to its minimum expression,
    making our web applications less fragile and more maintainable.


    Thank you for reading this book. I hope it helped you rethink the way you develop
    JavaScript applications, and challenged some of your existing concepts about programming.
    Here’s to fast, robust, and reactive software!'
