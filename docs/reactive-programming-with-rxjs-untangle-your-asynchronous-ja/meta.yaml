- img_proc: true
  md: "```\n```javascript\n.map(function(event) {\n  return {\n    x: event.clientX,\n\
    \    y: HERO_Y\n  };\n})\n.startWith({\n  x: canvas.width / 2,\n  y: HERO_Y\n\
    });\n```\n```\n\nNotice that I used `startWith()`. This sets the first value in\
    \ the Observable, and I set it to a position in the middle of the screen. Without\
    \ `startWith` our Observable would start emitting only when the player moves the\
    \ mouse.\n\nLet's render our hero on the screen. In this game all the characters\
    \ are triangles (my graphic-design skills are not very impressive), so we'll define\
    \ a helper function to render triangles on the canvas, given the coordinates,\
    \ size, and color, and the direction they're facing:\n\n```\n```javascript\n//\
    \ spaceship_reactive/hero_1.js\nfunction drawTriangle(x, y, width, color, direction)\
    \ {\n  ctx.fillStyle = color;\n  ctx.beginPath();\n  ctx.moveTo(x + width, y);\n\
    \  ctx.lineTo(x, direction === 'up' ? y - width : y + width);\n  ctx.lineTo(x\
    \ + width, y);\n  ctx.lineTo(x - width, y);\n  ctx.fill();\n}\n```\n```\n\nWe'll\
    \ also define `paintSpaceShip`, which uses the helper function:\n\n```\n```javascript\n\
    // spaceship_reactive/hero_1.js\nfunction paintSpaceShip(x, y) {\n  drawTriangle(x,\
    \ y, 20, '#ff0000', 'up');\n}\n```\n```\n\nBut we're facing a problem now. If\
    \ we subscribe to the `SpaceShip` Observable and call `drawTriangle` in the subscription,\
    \ our spaceship would be visible only when we move the mouse, and for just an\
    \ instant. This is because `starStream` is updating the canvas many times per\
    \ second, erasing our spaceship if we don't move the mouse. And because the `starStream`\
    \ doesn't have direct access to the spaceship, we can't render the spaceship in\
    \ the `starStream` subscription. We could save the latest spaceship coordinates\
    \ to a variable that the `starStream` can access, but then we would be breaking\
    \ our rule of not modifying external state. What to do?"
  merge: -1
