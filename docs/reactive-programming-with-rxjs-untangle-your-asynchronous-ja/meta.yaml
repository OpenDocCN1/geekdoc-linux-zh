- md: "## Preface\n\nReactive programming is taking the software world by storm. This\
    \ book combines the reactive programming philosophy with the possibilities of\
    \ JavaScript, and you'll learn how to apply reactive techniques to your own projects.\
    \ We'll focus on reactive programming to manage and combine streams of events.\
    \ In fact, we'll cover how to make entire real-world, concurrent applications\
    \ just by declaring transformations on our program's events.\n\nMost software\
    \ today deals with data that's available only over time: websites load remote\
    \ resources and respond to complex user interactions, servers are distributed\
    \ across multiple physical locations, and people have mobile devices that they\
    \ expect to work at all times, whether on high-speed Wi-Fi or spotty cellular\
    \ networks. Any serious application involves many moving asynchronous parts that\
    \ need to be efficiently coordinated, and that's very hard with today's programming\
    \ techniques. On top of that, we have what's always been there: servers crashing,\
    \ slow networks, and software bugs we have to deal with.\n\nWe can't afford to\
    \ keep programming applications the way we always have. It worked for a while,\
    \ but now it's time for a new approach.\n\n## New World, Old Methods\n\nIn recent\
    \ years JavaScript has become the most ubiquitous language in the world and now\
    \ powers the mission-critical infrastructure of businesses such as Walmart and\
    \ Netflix,¹ mobile operating systems such as Firefox OS, and complex popular applications\
    \ such as Google Docs.\n\nAnd yet we're still using good old imperative-style\
    \ programming to deal with problems that are essentially asynchronous. This is\
    \ very hard.\n\nJavaScript developers see the language's lack of threads as a\
    \ feature, and we usually write asynchronous code using callbacks, promises, and\
    \ events. But as we keep adding more concurrency to our applications, the code\
    \ to coordinate asynchronous flows becomes unwieldy. Current mechanisms all have\
    \ serious shortcomings that hinder the developer's productivity and make for fragile\
    \ applications.\n\nHere's a quick rundown of the current mechanisms for handling\
    \ asynchronous operations, along with their problems.\n\n### Callback Functions\n\
    \nA *callback* is a function (*A*) passed as a parameter to another function (*B*)\
    \ that performs an asynchronous operation. When (*B*) is done, it *calls back*\
    \ (*A*) with the results of the operation. Callbacks are used to manage asynchronous\
    \ flows such as network I/O, database access, or user input.\n\n```javascript\n\
    // intro/callback_example.js\nfunction B(callback) {\n  // Do operation that takes\
    \ some time\n  callback('Done!');\n}\n\nfunction A(message) {\n  console.log(message);\n\
    }\n\n// Execute `B` with `A` as a callback\nB(A);\n```\n\nCallbacks are easy to\
    \ grasp and have become the default way of handling asynchronous data flows in\
    \ JavaScript. But this simplicity comes at a price. Callbacks have the following\
    \ drawbacks:\n\n- *Callback hell*. It's easy to end up with lots of nested callbacks\
    \ when handling highly asynchronous code. When that happens, code stops being\
    \ linear and becomes hard to reason about. Whole applications end up passed around\
    \ in callbacks, and they become difficult to maintain and debug.\n- *Callbacks\
    \ can run more than once*. There's no guarantee the same callback will be called\
    \ only once. Multiple invocations can be hard to detect and can result in errors\
    \ and general mayhem in your application.\n- *Callbacks change error semantics*.\
    \ Callbacks break the traditional `try/catch` mechanism and rely on the programmer\
    \ to check for errors and pass them around.\n- *Concurrency gets increasingly\
    \ complicated*. Combining interdependent results of multiple asynchronous operations\
    \ becomes difficult. It requires us to keep track of the state of each operation\
    \ in temporal variables, and then delegate them to the final combination operation\
    \ in the proper order.\n\n### Promises\n\nPromises came to save us from callbacks.\
    \ A promise represents the result of an asynchronous operation. In promise-based\
    \ code, calling an asynchronous function immediately returns a “promise” that\
    \ will eventually be either *resolved* with the result of the operation or *rejected*\
    \ with an error. In the meantime, the *pending* promise can be used as a placeholder\
    \ for the final value.\n\nPromises usually make programs more clear by being closer\
    \ to synchronous code, reducing the need for nesting blocks and keeping track\
    \ of less state.\n\nUnfortunately, promises are not a silver bullet. They’re an\
    \ improvement over callbacks, but they have a major shortcoming: they only ever\
    \ yield a single value. That makes them useless for handling recurrent events\
    \ such as mouse clicks or streams of data coming from the server, because we would\
    \ have to create a promise for each separate event instead of creating a promise\
    \ that handles the stream of events as it comes.\n\n### Event Emitters\n\nWhen\
    \ we emit an event, event listeners that are subscribed to it will fire. Using\
    \ events is a great way to decouple functionality, and in JavaScript, event programming\
    \ is common and generally a good practice.\n\nBut, you guessed it, event listeners\
    \ come with their own set of problems, too:\n\n- *Events force side effects*.\
    \ Event listener functions always ignore their return values, which forces the\
    \ listener to have side effects if it wants to have any impact in the world.\n\
    - *Events are not first-class values*. For example, a series of click events can’t\
    \ be passed as a parameter or manipulated as the sequence it actually is. We’re\
    \ limited to handling each event individually, and only after the event happens.\n\
    - *It is easy to miss events if we start listening too late*. An infamous example\
    \ of that is the first version of the *streams* interface in Node.js, which would\
    \ often emit its data event before listeners had time to listen to it, losing\
    \ it forever.\n\nSince these mechanisms are what we’ve always used to manage concurrency,\
    \ it might be hard to think of a better way. But in this book I’ll show you one:\
    \ reactive programming and RxJS try to solve all these problems with some new\
    \ concepts and mechanisms to make asynchronous programming a breeze—and much more\
    \ fun.\n\n## What Is Reactive Programming?\n\nReactive programming is a programming\
    \ paradigm that encompasses many concepts and techniques. In this book I’ll focus\
    \ particularly on creating, transforming, and reacting to streams of data. Mouse\
    \ clicks, network requests, arrays of strings—all these can be expressed as streams\
    \ to which we can “react” as they publish new values, using the same interfaces\
    \ regardless of their source.\n\nReactive programming focuses on propagating changes\
    \ without our having to explicitly specify how the propagation happens. This allows\
    \ us to state what our code should do, without having to code every step to do\
    \ it. This results in a more reliable and maintainable approach to building software.\n\
    \n## What Is RxJS?\n\nRxJS is a JavaScript implementation of the Reactive Extensions,\
    \ or Rx.² Rx is a reactive programming model originally created at Microsoft that\
    \ allows developers to easily compose asynchronous streams of data. It provides\
    \ a common interface to combine and transform data from wildly different sources,\
    \ such as filesystems operations, user interaction, and social-network updates.\n\
    \nRx started with an implementation for .NET, but today it has a well-maintained\
    \ open source implementation in every major language (and some minor ones). It\
    \ is becoming the standard to program reactive applications, and Rx’s main data\
    \ type, the Observable, is being proposed for inclusion in ECMAScript 7 as an\
    \ integral part of JavaScript.\n\n## Who This Book Is For\n\nThis book is for\
    \ developers with some experience with JavaScript. You should be comfortable with\
    \ closures and higher-order functions, and you should understand the scope rules\
    \ in JavaScript. That being said, I try to explain the most complex language concepts\
    \ we go through in this book.\n\n***\n\n¹ [http://venturebeat.com/2012/01/24/why-walmart-is-using-node-js/](http://venturebeat.com/2012/01/24/why-walmart-is-using-node-js/),\
    \ [http://techblog.netflix.com/2014/06/scale-and-performance-of-large.html](http://techblog.netflix.com/2014/06/scale-and-performance-of-large.html)\n\
    ² https://rx.codeplex.com/"
  mdcn: "\n## 前言\n\n响应式编程（Reactive programming）正在席卷软件世界。本书将响应式编程哲学与 JavaScript 的可能性相结合，你将学习如何将响应式技术应用于自己的项目中。我们将重点讨论如何使用响应式编程来管理和组合事件流。事实上，我们将涵盖如何仅通过声明对程序事件的转换，来构建完整的、真实的并发应用程序。\n\
    \n如今大多数软件处理的数据仅在随时间推移而可用：网站加载远程资源并响应复杂的用户交互，服务器分布在多个物理位置，人们拥有希望在任何时间都能正常工作的移动设备，无论是在高速\
    \ Wi-Fi 还是不稳定的蜂窝网络环境下。任何严肃的应用程序都涉及许多需要高效协调的异步变动部分，而这在今天的编程技术下是非常困难的。除此之外，我们还必须面对一直存在的问题：服务器崩溃、网络缓慢以及软件漏洞。\n\
    \n我们不能再以一直以来的方式编写应用程序了。这种方式在一段时间内有效，但现在是时候尝试一种新方法了。\n\n## 新世界，旧方法\n\n近年来，JavaScript\
    \ 已成为世界上最普及的语言，现在它驱动着像沃尔玛（Walmart）和 Netflix¹ 这样企业的关键基础设施，驱动着像 Firefox OS 这样的移动操作系统，以及像\
    \ Google Docs 这样复杂且流行的应用程序。\n\n然而，我们仍然在使用古老的命令式风格编程来处理本质上是异步的问题。这非常困难。\n\nJavaScript\
    \ 开发者将语言缺乏线程视为一项特性，我们通常使用回调（callbacks）、Promise 和事件（events）来编写异步代码。但随着我们在应用程序中引入越来越多的并发，协调异步流的代码变得臃肿不堪。目前的机制都存在严重的缺陷，阻碍了开发者的生产力，并导致应用程序变得脆弱。\n\
    \n以下是目前处理异步操作的机制及其问题的快速回顾。\n\n### 回调函数（Callback Functions）\n\n*回调*是一个函数（*A*），它作为参数传递给另一个执行异步操作的函数（*B*）。当（*B*）完成时，它会带着操作结果*回调*（*A*）。回调用于管理异步流，例如网络\
    \ I/O、数据库访问或用户输入。\n\n```javascript\n// intro/callback_example.js\nfunction B(callback)\
    \ {\n  // Do operation that takes some time\n  callback('Done!');\n}\n\nfunction\
    \ A(message) {\n  console.log(message);\n}\n\n// Execute `B` with `A` as a callback\n\
    B(A);\n```\n\n回调易于理解，并已成为 JavaScript 处理异步数据流的默认方式。但这种简单性是有代价的。回调具有以下缺点：\n\n- *回调地狱（Callback\
    \ hell）*。在处理高度异步的代码时，很容易出现大量嵌套的回调。一旦发生这种情况，代码将不再是线性的，且难以推理。整个应用程序最终在回调中传来传去，导致难以维护和调试。\n\
    - *回调可能会运行多次*。没有保证同一个回调只会被调用一次。多次调用可能难以检测，并可能导致应用程序出现错误和全面混乱。\n- *回调改变了错误语义*。回调破坏了传统的\
    \ `try/catch` 机制，依赖于程序员检查错误并将其传递。\n- *并发变得日益复杂*。组合多个异步操作的相互依赖结果变得很困难。这要求我们在临时变量中跟踪每个操作的状态，然后按正确的顺序将它们委托给最终的组合操作。\n\
    \n### Promises\n\nPromises 的出现是为了将我们从回调中拯救出来。Promise 代表一个异步操作的结果。在基于 Promise 的代码中，调用异步函数会立即返回一个“promise”，它最终要么带着操作结果被*resolve*（兑现），要么带着错误被*reject*（拒绝）。与此同时，*pending*（待定）状态的\
    \ promise 可以作为最终值的占位符。\n\nPromise 通常使程序更清晰，因为它们更接近同步代码，减少了对嵌套块的需求并降低了状态跟踪的复杂度。\n\
    \n不幸的是，Promise 并非万灵药。虽然它们比回调有所改进，但有一个重大缺陷：它们只能产生单个值。这使得它们在处理重复事件（如鼠标点击）或来自服务器的数据流时毫无用处，因为我们必须为每个独立事件创建一个\
    \ Promise，而不是创建一个能够处理随之而来的事件流的 Promise。\n\n### 事件发射器（Event Emitters）\n\n当我们发射一个事件时，订阅该事件的事件监听器将被触发。使用事件是解耦功能的一种绝佳方式，在\
    \ JavaScript 中，事件编程非常普遍，且通常被认为是一种良好的实践。\n\n但正如你所料，事件监听器也带来了一系列自身的问题：\n\n- *事件强制产生副作用*。事件监听函数总是忽略其返回值，这意味着监听器如果想要对世界产生任何影响，就必须产生副作用。\n\
    - *事件不是一等公民（first-class values）*。例如，一系列点击事件不能作为参数传递，也不能像它实际所代表的序列那样被操纵。我们被限制在单独处理每个事件，且只能在事件发生之后处理。\n\
    - *如果开始监听太晚，很容易错过事件*。一个著名的例子是 Node.js 中 *streams* 接口的第一个版本，它经常在监听器来不及监听之前就发射数据事件，导致数据永久丢失。\n\
    \n既然这些机制是我们一直用来管理并发的方式，可能很难想到更好的方法。但在本书中，我将向你展示一种：响应式编程和 RxJS 尝试用一些新的概念和机制来解决所有这些问题，让异步编程变得轻而易举——而且更有趣。\n\
    \n## 什么是响应式编程？\n\n响应式编程是一种包含许多概念和技术的编程范式。在本书中，我将特别关注数据流的创建、转换和响应。鼠标点击、网络请求、字符串数组——所有这些都可以表示为流，无论其来源如何，我们都可以使用相同的接口在它们发布新值时对其做出“响应”。\n\
    \n响应式编程专注于传播变更，而无需我们显式指定传播如何发生。这允许我们声明代码应该做什么，而不需要为实现它的每个步骤编写代码。这使得构建软件的方法更加可靠且易于维护。\n\
    \n## 什么是 RxJS?\n\nRxJS 是 Reactive Extensions（简称 Rx）的 JavaScript 实现。² Rx 最初由微软创建，是一种响应式编程模型，允许开发者轻松组合异步数据流。它提供了一个通用接口，用于组合和转换来自截然不同来源的数据，例如文件系统操作、用户交互和社交网络更新。\n\
    \nRx 起源于 .NET 的实现，但如今在每种主流语言（以及一些非主流语言）中都有维护良好的开源实现。它正成为编写响应式应用程序的标准，而 Rx 的核心数据类型\
    \ Observable，已被提议作为 JavaScript 整体的一部分纳入 ECMAScript 7。\n\n## 本书读者对象\n\n本书面向具有一定\
    \ JavaScript 经验的开发者。你应该熟悉闭包和高阶函数，并理解 JavaScript 中的作用域规则。尽管如此，对于本书中涉及的最复杂的语言概念，我都会尽量进行解释。\n\
    \n***\n\n¹ [http://venturebeat.com/2012/01/24/why-walmart-is-using-node-js/](http://venturebeat.com/2012/01/24/why-walmart-is-using-node-js/),\
    \ [http://techblog.netflix.com/2014/06/scale-and-performance-of-large.html](http://techblog.netflix.com/2014/06/scale-and-performance-of-large.html)\n\
    ² https://rx.codeplex.com/\n"
