    \ SHOOTING_SPEED;\n            drawTriangle(shot.x, shot.y, 5, '#00ffff', 'down');\n\
    \        });\n    });\n}\n\nvar SHOOTING_SPEED = 15;\nfunction paintHeroShots(heroShots,\
    \ enemies) {\n    heroShots.forEach(function(shot, i) {\n        for (var l=0;\
    \ l<enemies.length; l++) {\n            var enemy = enemies[l];\n            if\
    \ (!enemy.isDead && collision(shot, enemy)) {\n                enemy.isDead =\
    \ true;\n                shot.x = shot.y = -100;\n                break;\n   \
    \         }\n        }\n        shot.y -= SHOOTING_SPEED;\n        drawTriangle(shot.x,\
    \ shot.y, 5, '#ffff00', 'up');\n    });\n}\n```\n\nNext let’s get rid of any enemies\
    \ that have the property `isDead` set to true. The only caveat is that we need\
    \ to wait for all the shots from that particular enemy to disappear; otherwise,\
    \ when we hit an enemy all its shots disappear along with it, which would be weird.\
    \ So we should check for the length of its shots and filter out the enemy object\
    \ only when it has no shots left:\n\n```javascript\n// spaceship_reactive/enemy_shots2.js\n\
    var Enemies = Rx.Observable.interval(ENEMY_FREQ)\n    .scan(function(enemyArray)\
    \ {\n        var enemy = {\n            x: parseInt(Math.random() * canvas.width),\n\
    \            y: -30,\n            shots: []\n        };\n\n        Rx.Observable.interval(ENEMY_SHOOTING_FREQ).subscribe(function()\
    \ {\n            if (!enemy.isDead) {\n                enemy.shots.push({ x: enemy.x,\
    \ y: enemy.y });\n            }\n            enemy.shots = enemy.shots.filter(isVisible);\n\
    \        });\n\n        enemyArray.push(enemy);\n        return enemyArray\n \
    \           .filter(isVisible)\n            .filter(function(enemy) {\n      \
    \          return !(enemy.isDead && enemy.shots.length === 0);\n            });\n\
    \    }, []);\n```\n\nTo check if the player’s ship has been hit, we create a function\
    \ `gameOver`:\n\n```javascript\n// spaceship_reactive/enemy_shots2.js\nfunction\
    \ gameOver(ship, enemies) {\n    return enemies.some(function(enemy) {\n     \
    \   if (collision(ship, enemy)) {\n            return true;\n        }\n\n   \
    \     return enemy.shots.some(function(shot) {\n            return collision(ship,\
    \ shot);\n        });\n    });\n}\n```\n\nThis function returns `true` if an enemy\
    \ or a shot from an enemy hits the player's spaceship.\n\nBefore moving on, let's\
    \ get to know a useful operator: `takeWhile`. When we call `takeWhile` on an existing\
    \ Observable, that Observable will keep emitting values until the function passed\
    \ as a parameter to `takeWhile` returns `false`.\n\nWe can use `takeWhile` to\
    \ tell our main `combineLatest` Observable to keep taking values until `gameOver`\
    \ returns `true`:\n\n```javascript\n// spaceship_reactive/enemy_shots2.js\nRx.Observable.combineLatest(\n\
    \    StarStream, SpaceShip, Enemies, HeroShots,\n    function(stars, spaceship,\
    \ enemies, heroShots) {\n        return {\n            stars: stars,\n       \
    \     spaceship: spaceship,\n            enemies: enemies,\n            heroShots:\
    \ heroShots\n        };\n    }\n)\n.sample(SPEED)\n.takeWhile(function(actors)\
    \ {\n    return gameOver(actors.spaceship, actors.enemies) === false;\n})\n.subscribe(renderScene);\n\
    ```\n\nWhen `gameOver` returns `true`, `combineLatest` will stop emitting values,\
    \ effectively stopping the game.\n\n## One Last Thing: Keeping Score\n\nWhat kind\
    \ of game would it be if we couldn't brag about our results to our friends? We\
    \ obviously need a way to keep track of how well we did. We need a score.\n\n\
    Let's make a helper function to draw the score to the upper left of the screen:\n\
    \n```javascript\n// spaceship_reactive/score.js\nfunction paintScore(score) {\n\
    \    ctx.fillStyle = '#ffffff';\n    ctx.font = 'bold 26px sans-serif';\n    ctx.fillText('Score:\
    \ ' + score, 40, 43);\n}\n```\n\nTo keep score we'll use a `Subject`. We can easily\
    \ use it in our `combineLatest`-based main game loop as if it were just another\
    \ Observable, and we can push values to it whenever we want.\n\n```javascript\n\
    // spaceship_reactive/score.js\nvar ScoreSubject = new Rx.Subject();\nvar score\
    \ = ScoreSubject.scan(function (prev, cur) {\n    return prev + cur;\n}, 0).concat(Rx.Observable.return(0));\n\
    ```\n\nIn that code we use our friend the scan operator to sum each new value\
    \ to the total aggregate result. Since we won't have any score when a game starts,\
    \ we concatenate an Observable that returns 0 so we have a starting point.\n\n\
    Now we just have to push score to our Subject whenever we hit an enemy: that happens\
    \ in `paintHeroShots`:\n\n```javascript\n// spaceship_reactive/score.js\nvar SCORE_INCREASE\
    \ = 10;\nfunction paintHeroShots(heroShots, enemies) {\n    heroShots.forEach(function(shot,\
    \ i) {\n        for (var l = 0; l < enemies.length; l++) {\n            var enemy\
    \ = enemies[l];\n            if (!enemy.isDead && collision(shot, enemy)) {\n\
    \                ScoreSubject.onNext(SCORE_INCREASE);\n                enemy.isDead\
    \ = true;\n                shot.x = shot.y = -100;\n                break;\n \
    \           }\n        }\n        shot.y -= SHOOTING_SPEED;\n        drawTriangle(shot.x,\
    \ shot.y, 5, '#ffff00', 'up');\n    });\n}\n```\n\nAnd of course, we add `paintScore`\
    \ to `renderScene` so the score appears onscreen:\n\n```javascript\n// spaceship_reactive/score.js\n\
    function renderScene(actors) {\n    paintStars(actors.stars);\n    paintSpaceShip(actors.spaceship.x,\
    \ actors.spaceship.y);\n    paintEnemies(actors.enemies);\n    paintHeroShots(actors.heroShots,\
    \ actors.enemies);\n    paintScore(actors.score);\n}\n```\n\nThat completes our\
    \ Spaceship Reactive game. With about 200 lines we've managed to code an entire\
    \ game in the browser, avoiding changing any external state through the power\
    \ of Observable pipelines.\n\n## Ideas for Improvements\n\nI'm sure you already\
    \ have some ideas for making the game even more exciting, but let me propose some\
    \ improvements that will make the game better and sharpen your RxJS skills at\
    \ the same time:\n\n- Add a second (or third!) star field that moves at a different\
    \ speed to create a parallax effect. This could be done in several different ways.\
    \ Try to reuse existing code and to do it as declaratively as you can.\n- Make\
    \ more unpredictable enemies by making them fire at random intervals instead of\
    \ the fixed one specified in `ENEMY_SHOOTING_FREQ`. Extra points if you can make\
    \ them fire more quickly as the player's score gets higher!\n- Allow the player\
    \ to get more points by hitting several enemies in a short amount of time.\n\n\
    ## Wrapping Up\n\nWe've built an entire game for the browser using only Observables,\
    \ and along the way we've seen several extremely convenient methods to handle\
    \ concurrency and to compose and transform Observables. This is one of the strengths\
    \ of RxJS: there is always a method to help with the problem you're trying to\
    \ tackle. Feel free to explore them in the RxJS documentation.¹\n\nReactive programming\
    \ makes it easy to write concurrent programs. The Observable abstraction and the\
    \ powerful RxJS methods make it natural for different parts of a program to interact\
    \ efficiently. Programming without relying on external state might take some getting\
    \ used to, but it has enormous benefits. We can encapsulate entire behaviors in\
    \ a single Observable pipeline, making our program more solid and reliable.\n\n\
    In the next chapter we'll pick up our earthquake visualizer application where\
    \ we left it and add a Node.js server part that shows tweets related to the earthquakes.\
    \ We'll also improve its user interface to make it look like a real earthquake\
    \ dashboard.\n\n> 1. https://github.com/Reactive-Extensions/RxJS/blob/master/doc/api/core/observable.md"
  mdcn: "\n现在大家都开始互相射击了，但没有人被摧毁！子弹只是简单地穿过了敌人和我们的飞船而过，因为我们还没有定义当子弹与飞船碰撞时会发生什么。\n\n\
    ## 管理碰撞\n\n当子弹击中敌人时，我们希望子弹和敌人同时消失。让我们定义一个辅助函数来检测两个目标是否发生了碰撞：\n\n```javascript\n\
    // spaceship_reactive/enemy_shots2.js\nfunction collision(target1, target2) {\n\
    \    return (target1.x > target2.x - 20 && target1.x < target2.x + 20) &&\n  \
    \         (target1.y > target2.y - 20 && target1.y < target2.y + 20);\n}\n```\n\
    \n现在让我们修改辅助函数 `paintHeroShots`，以检查每颗子弹是否击中了敌人。在发生命中时，我们将把被击中敌人的 `isDead` 属性设置为\
    \ `true`，并将子弹的坐标设置到屏幕之外。子弹最终会被过滤掉，因为它已经超出了屏幕范围。\n\n```javascript\n// spaceship_reactive/enemy_shots2.js\n\
    function paintEnemies(enemies) {\n    enemies.forEach(function(enemy) {\n    \
    \    enemy.y += 5;\n        enemy.x += getRandomInt(-15, 15);\n\n        if (!enemy.isDead)\
    \ {\n            drawTriangle(enemy.x, enemy.y, 20, '#00ff00', 'down');\n    \
    \    }\n\n        enemy.shots.forEach(function(shot) {\n            shot.y +=\
    \ SHOOTING_SPEED;\n            drawTriangle(shot.x, shot.y, 5, '#00ffff', 'down');\n\
    \        });\n    });\n}\n\nvar SHOOTING_SPEED = 15;\nfunction paintHeroShots(heroShots,\
    \ enemies) {\n    heroShots.forEach(function(shot, i) {\n        for (var l=0;\
    \ l<enemies.length; l++) {\n            var enemy = enemies[l];\n            if\
    \ (!enemy.isDead && collision(shot, enemy)) {\n                enemy.isDead =\
    \ true;\n                shot.x = shot.y = -100;\n                break;\n   \
    \         }\n        }\n        shot.y -= SHOOTING_SPEED;\n        drawTriangle(shot.x,\
    \ shot.y, 5, '#ffff00', 'up');\n    });\n}\n```\n\n接下来，让我们清除所有 `isDead` 属性为 `true`\
    \ 的敌人。唯一需要注意的是，我们需要等待该特定敌人的所有子弹消失；否则，当我们击中一个敌人时，它所有的子弹也会随之消失，这会显得很奇怪。因此，我们应该检查其子弹列表的长度，仅在它没有剩余子弹时才过滤掉该敌人对象：\n\
    \n```javascript\n// spaceship_reactive/enemy_shots2.js\nvar Enemies = Rx.Observable.interval(ENEMY_FREQ)\n\
    \    .scan(function(enemyArray) {\n        var enemy = {\n            x: parseInt(Math.random()\
    \ * canvas.width),\n            y: -30,\n            shots: []\n        };\n\n\
    \        Rx.Observable.interval(ENEMY_SHOOTING_FREQ).subscribe(function() {\n\
    \            if (!enemy.isDead) {\n                enemy.shots.push({ x: enemy.x,\
    \ y: enemy.y });\n            }\n            enemy.shots = enemy.shots.filter(isVisible);\n\
    \        });\n\n        enemyArray.push(enemy);\n        return enemyArray\n \
    \           .filter(isVisible)\n            .filter(function(enemy) {\n      \
    \          return !(enemy.isDead && enemy.shots.length === 0);\n            });\n\
    \    }, []);\n```\n\n为了检查玩家的飞船是否被击中，我们创建一个 `gameOver` 函数：\n\n```javascript\n//\
    \ spaceship_reactive/enemy_shots2.js\nfunction gameOver(ship, enemies) {\n   \
    \ return enemies.some(function(enemy) {\n        if (collision(ship, enemy)) {\n\
    \            return true;\n        }\n\n        return enemy.shots.some(function(shot)\
    \ {\n            return collision(ship, shot);\n        });\n    });\n}\n```\n\
    \n如果敌人或敌人的子弹击中了玩家的飞船，该函数将返回 `true`。\n\n在继续之前，让我们了解一个非常有用的操作符：`takeWhile`。当我们对一个现有的\
    \ Observable 调用 `takeWhile` 时，该 Observable 将持续发射值，直到传递给 `takeWhile` 的参数函数返回 `false`。\n\
    \n我们可以使用 `takeWhile` 来告诉我们的主 `combineLatest` Observable 持续接收值，直到 `gameOver` 返回\
    \ `true`：\n\n```javascript\n// spaceship_reactive/enemy_shots2.js\nRx.Observable.combineLatest(\n\
    \    StarStream, SpaceShip, Enemies, HeroShots,\n    function(stars, spaceship,\
    \ enemies, heroShots) {\n        return {\n            stars: stars,\n       \
    \     spaceship: spaceship,\n            enemies: enemies,\n            heroShots:\
    \ heroShots\n        };\n    }\n)\n.sample(SPEED)\n.takeWhile(function(actors)\
    \ {\n    return gameOver(actors.spaceship, actors.enemies) === false;\n})\n.subscribe(renderScene);\n\
    ```\n\n当 `gameOver` 返回 `true` 时，`combineLatest` 将停止发射值，从而有效地停止游戏。\n\n## 最后一件事：计分\n\
    \n如果不能向朋友炫耀我们的成绩，那还叫什么游戏？显然我们需要一种方式来记录我们的表现。我们需要一个分数。\n\n让我们创建一个辅助函数，将分数绘制在屏幕的左上角：\n\
    \n```javascript\n// spaceship_reactive/score.js\nfunction paintScore(score) {\n\
    \    ctx.fillStyle = '#ffffff';\n    ctx.font = 'bold 26px sans-serif';\n    ctx.fillText('Score:\
    \ ' + score, 40, 43);\n}\n```\n\n为了记录分数，我们将使用一个 `Subject`。我们可以像使用另一个 Observable\
    \ 一样，轻松地将其用于基于 `combineLatest` 的主游戏循环中，并且可以在任何时候向其推送值。\n\n```javascript\n// spaceship_reactive/score.js\n\
    var ScoreSubject = new Rx.Subject();\nvar score = ScoreSubject.scan(function (prev,\
    \ cur) {\n    return prev + cur;\n}, 0).concat(Rx.Observable.return(0));\n```\n\
    \n在上述代码中，我们使用了老朋友 `scan` 操作符将每个新值累加到总结果中。由于游戏开始时没有分数，我们连接了一个返回 0 的 Observable，以便有一个起点。\n\
    \n现在，我们只需在击中敌人时向我们的 Subject 推送分数即可：这发生在 `paintHeroShots` 中：\n\n```javascript\n\
    // spaceship_reactive/score.js\nvar SCORE_INCREASE = 10;\nfunction paintHeroShots(heroShots,\
    \ enemies) {\n    heroShots.forEach(function(shot, i) {\n        for (var l =\
    \ 0; l < enemies.length; l++) {\n            var enemy = enemies[l];\n       \
    \     if (!enemy.isDead && collision(shot, enemy)) {\n                ScoreSubject.onNext(SCORE_INCREASE);\n\
    \                enemy.isDead = true;\n                shot.x = shot.y = -100;\n\
    \                break;\n            }\n        }\n        shot.y -= SHOOTING_SPEED;\n\
    \        drawTriangle(shot.x, shot.y, 5, '#ffff00', 'up');\n    });\n}\n```\n\n\
    当然，我们将 `paintScore` 添加到 `renderScene` 中，使分数显示在屏幕上：\n\n```javascript\n// spaceship_reactive/score.js\n\
    function renderScene(actors) {\n    paintStars(actors.stars);\n    paintSpaceShip(actors.spaceship.x,\
    \ actors.spaceship.y);\n    paintEnemies(actors.enemies);\n    paintHeroShots(actors.heroShots,\
    \ actors.enemies);\n    paintScore(actors.score);\n}\n```\n\n至此，我们的响应式飞船游戏就完成了。通过大约\
    \ 200 行代码，我们成功在浏览器中编写了一个完整的游戏，并利用 Observable 流的力量，避免了修改任何外部状态。\n\n## 改进想法\n\n\
    我相信你已经有一些让游戏更刺激的想法了，但让我提几个建议，在提升游戏体验的同时也能磨练你的 RxJS 技巧：\n\n- 添加第二个（或第三个！）以不同速度移动的星场，以创建视差效果。这可以通过几种不同的方式实现。尝试复用现有代码，并尽可能声明式地实现它。\n\
    - 让敌人变得更不可预测，让他们以随机的时间间隔而不是 `ENEMY_SHOOTING_FREQ` 指定的固定间隔开火。如果你能让敌人随着玩家得分的增加而开火速度加快，将获得额外加分！\n\
    - 允许玩家在短时间内击中多个敌人以获得更多积分。\n\n## 总结\n\n我们仅使用 Observable 就构建了一个完整的浏览器游戏，并在过程中看到了几种处理并发以及组合和转换\
    \ Observable 的极其便捷的方法。这是 RxJS 的强大之处：总有一个方法可以帮助你解决试图应对的问题。欢迎在 RxJS 文档中进一步探索。¹\n\
    \n响应式编程让编写并发程序变得简单。Observable 抽象和强大的 RxJS 方法使得程序的不同部分能够自然且高效地进行交互。不依赖外部状态的编程可能需要一段时间来适应，但它带来了巨大的好处。我们可以将整个行为封装在单个\
    \ Observable 流中，使我们的程序更加稳固和可靠。\n\n在下一章中，我们将回到地震可视化应用程序，并添加一个 Node.js 服务器部分，用于显示与地震相关的推文。我们还将改进其用户界面，使其看起来像一个真正的地震仪表盘。\n\
    \n> 1. [https://github.com/Reactive-Extensions/RxJS/blob/master/doc/api/core/observable.md](https://github.com/Reactive-Extensions/RxJS/blob/master/doc/api/core/observable.md)\n"
