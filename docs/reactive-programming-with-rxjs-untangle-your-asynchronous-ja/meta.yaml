    \ `merge` 和 `mergeAll`，并使用带有选择函数的 `distinct` 来避免重复。\n- 每当用户点击一条推文时，将地图中心定位到相关的地震点。这涉及到在服务器端按地震对推文进行分组，你可能会想使用\
    \ `groupBy` 操作符将推文分组到特定的地理区域。\n\n## 本章总结\n\n在本章中，我们使用 RxJS 创建了一个响应式用户界面，使我们能够实时查看地球上发生的地震的各类数据。我们在浏览器客户端和\
    \ Node.js 服务器中都使用了 RxJS，展示了使用 Observable 管理应用程序不同区域是多么简单。\n\n更重要的是，我们看到可以在客户端和服务器端以相同的方式使用\
    \ RxJS，将 Observable 序列抽象引入应用程序的各个环节。不仅如此，由于许多编程语言都支持 RxJS，我们实际上可以在其他语言中跨平台使用 RxJS\
    \ 的概念和操作符。\n\n接下来我们将探讨 *Schedulers*（调度器），这是 RxJS 中一种更高级的对象类型，它允许我们更精确地控制时间和并发，并对代码测试提供极大的帮助。\n\
    \n## 使用 Schedulers 操纵时间\n\n在我刚发现 RxJS 时，就开始在项目中尝试使用它。一段时间后，我以为我已经掌握了如何高效使用它，但心中一直有一个挥之不去的疑问：我如何知道我使用的操作符是同步的还是异步的？换句话说，操作符究竟在什么时候发出通知？这似乎是正确使用\
    \ RxJS 的关键部分，但对我来说感觉有些模糊。\n\n我想，`interval` 操作符显然是异步的，所以它内部一定使用了类似 `setTimeout`\
    \ 的机制来发射项目。但如果我使用 `range` 呢？它也会异步发射吗？它会阻塞事件循环吗？`from` 又是怎样的？我到处都在使用这些操作符，但对它们的内部并发模型知之甚少。\n\
    \n然后我了解到了 Schedulers。\n\nSchedulers 是一种在应用程序中精确管理并发的强大机制。它们允许你在执行过程中更改并发模型，从而让你对\
    \ Observable 如何发出通知拥有细粒度的控制。在本章中，你将学习如何使用 Schedulers 并将它们应用于常见场景。我们将重点讨论测试（Schedulers\
    \ 在此尤其有用），并且你将学习如何创建自己的 Schedulers。\n\n### 使用 Schedulers\n\nScheduler 是一种将动作“调度”到未来执行的机制。RxJS\
    \ 中的每个操作符内部都使用一个 Scheduler，该 Scheduler 的选择旨在最可能的场景下提供最佳性能。\n\n让我们看看如何更改操作符中的 Scheduler\
    \ 以及这样做会产生什么后果。首先，让我们创建一个包含 1,000 个整数的数组：\n"
