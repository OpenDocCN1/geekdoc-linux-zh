  - '[PAGE 85]


    # Ideas for Improvements


    I''m sure you already have some ideas for making the game even more exciting,
    but let me propose some improvements that will make the game better and sharpen
    your RxJS skills at the same time:


    +   * Add a second (or third!) star field that moves at a different speed to create
    a parallax effect. This could be done in several different ways. Try to reuse
    existing code and to do it as declaratively as you can.

    * Make more unpredictable enemies by making them fire at random intervals instead
    of the fixed one specified in ENEMY_SHOOTING_FREQ. Extra points if you can make
    them fire more quickly as the player''s score gets higher!

    * Allow the player to get more points by hitting several enemies in a short amount
    of time.


    # Wrapping Up


    We''ve built an entire game for the browser using only Observables, and along
    the way we''ve seen several extremely convenient methods to handle concurrency
    and to compose and transform Observables. This is one of the strengths of RxJS:
    there is always a method to help with the problem you''re trying to tackle. Feel
    free to explore them in the RxJS documentation.¹


    Reactive programming makes it easy to write concurrent programs. The Observable
    abstraction and the powerful RxJS methods make it natural for different parts
    of a program to interact efficiently. Programming without relying on external
    state might take some getting used to, but it has enormous benefits. We can encapsulate
    entire behaviors in a single Observable pipeline, making our program more solid
    and reliable.


    In the next chapter we''ll pick up our earthquake visualizer application where
    we left it and add a Node.js server part that shows tweets related to the earthquakes.
    We''ll also improve its user interface to make it look like a real earthquake
    dashboard.


    > 1. https://github.com/Reactive-Extensions/RxJS/blob/master/doc/api/core/observable.md'
- md: "## CHAPTER 4\n## Building a Complete Web Application\n\nIn this chapter we'll\
    \ build a typical web application, using RxJS in the front end and back end. We'll\
    \ transform the Document Object Model (DOM) and do client-server communication\
    \ using WebSockets in a Node.js server.\n\nFor the user-interface bits, we'll\
    \ use the RxJS-DOM library, a library by the same team that made RxJS, which provides\
    \ convenient operators to deal with DOM and browser-related stuff that will make\
    \ our lives easier. For the server part, we'll use two well-established node libraries\
    \ and wrap some of their APIs with Observables to use them in our application.\n\
    \nAfter this chapter, you'll be able to use RxJS to build user interfaces in a\
    \ declarative way, using the techniques we've seen so far and applying them to\
    \ the DOM. You'll also be ready to use RxJS in any Node.js project and able to\
    \ use reactive programming and RxJS in any project.\n\n## Building a Real-Time\
    \ Earthquake Dashboard\n\nWe'll be building both server and client parts for an\
    \ earthquake dashboard application, picking up where we left off with the experience\
    \ we started in [Making a Real-Time Earthquake Visualizer, on page 29](example).\
    \ We'll build the server in Node.js, and improve our application to make it more\
    \ interactive and informative.\n\nThe [screenshot on page 70](example) shows how\
    \ the dashboard will look when we're finished:\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_87_0.png)\n\
    \n| Location | Magnitude | Time |\n| :--- | :--- | :--- |\n| 6km WNW of The Geysers,\
    \ California | 1.06 | Wed Feb 11 2015 17:18:01 GMT+0100 (CET) |\n| 8km N of Anza,\
    \ California | 0.68 | Wed Feb 11 2015 17:11:34 GMT+0100 (CET) |\n| 12km SE of\
    \ Big Bear City, California | 1.3 | Wed Feb 11 2015 17:09:52 GMT+0100 (CET) |\n\
    \nOur starting point will be the code from [Making a Real-Time Earthquake Visualizer,\
    \ on page 29](example), which we left like this:\n\n```javascript\n// examples_earthquake/code1_3.js\n\
    var quakes = Rx.Observable\n  .interval(5000)\n  .flatMap(function() {\n    return\
    \ Rx.DOM.jsonpRequest({\n        url: QUAKE_URL,\n        jsonpCallback: 'eqfeed_callback'\n\
    \    });\n  })\n  .retry(3)\n  .flatMap(function(result) {\n      return Rx.Observable.from(result.response.features);\n\
    \  })\n  .distinct(function(quake) { return quake.properties.code; });\n\nquakes.subscribe(function(quake)\
    \ {\n    var coords = quake.geometry.coordinates;\n    var size = quake.properties.mag\
    \ * 10000;\n\n    L.circle([coords[1], coords[0]], size).addTo(map);\n});\n```\n\
    \nThis code already has one potential bug: it could be executed before the DOM\
    \ is ready, throwing errors whenever we try to use DOM elements in our code. What\
    \ we want is to load our code after the DOMContentLoaded event is fired, which\
    \ signals the moment the browser is aware of all the elements on the page.\n\n\
    RxJS-DOM provides the `Rx.DOM.ready()` Observable, which emits once, when DOMContentLoaded\
    \ is fired. So let's wrap our code in an initialize function and execute it when\
    \ we subscribe to `Rx.DOM.ready()`:\n\n```javascript\n// examples_earthquake_ui/code1.js\n\
    function initialize() {\n    var quakes = Rx.Observable\n        .interval(5000)\n\
    \        .flatMap(function() {\n            return Rx.DOM.jsonpRequest({\n   \
    \             url: QUAKE_URL,\n                jsonpCallback: 'eqfeed_callback'\n\
    \            });\n        })\n        .flatMap(function(result) {\n          \
    \  return Rx.Observable.from(result.response.features);\n        })\n        .distinct(function(quake)\
    \ { return quake.properties.code; });\n\n    quakes.subscribe(function(quake)\
    \ {\n        var coords = quake.geometry.coordinates;\n        var size = quake.properties.mag\
    \ * 10000;\n        L.circle([coords[1], coords[0]], size).addTo(map);\n    });\n\
    }\n\nRx.DOM.ready().subscribe(initialize);\n```\n\nNext, we’ll add an empty table\
    \ to our HTML, which is where we’ll populate earthquake data in the next section:\n\
    \n```html\n<table>\n  <thead>\n    <tr>\n      <th>Location</th>\n      <th>Magnitude</th>\n\
    \      <th>Time</th>\n    </tr>\n  </thead>\n  <tbody id=\"quakes_info\">\n  </tbody>\n\
    </table>\n```\n\nWith this, we’re ready to start writing the new code for our\
    \ dashboard.\n\n## Adding a List of Earthquakes\n\nThe first feature in the new\
    \ dashboard is to display a real-time list of earthquakes, including information\
    \ about their locations, magnitudes, and dates. The data for this list is the\
    \ same as for the map, which comes from the USGS website. We’ll first create a\
    \ function that returns a row element given a props object parameter:\n\n```javascript\n\
    // examples_earthquake_ui/code2.js\nfunction makeRow(props) {\n    var row = document.createElement('tr');\n\
    \    row.id = props.net + props.code;\n\n    var date = new Date(props.time);\n\
    \    var time = date.toString();\n    [props.place, props.mag, time].forEach(function(text)\
    \ {\n        var cell = document.createElement('td');\n        cell.textContent\
    \ = text;\n        row.appendChild(cell);\n    });\n\n    return row;\n}\n```\n\
    \nThe `props` parameter is the same as the properties property in the JSON that\
    \ we retrieve from the USGS site.\n\nTo generate the rows, we'll make another\
    \ subscription to the quakes Observable. This subscription creates a row in the\
    \ table for each new earthquake received. We add the code at the end of the `initialize`\
    \ function:\n\n```javascript\n// examples_earthquake_ui/code2.js\nvar table =\
    \ document.getElementById('quakes_info');\nquakes\n    .pluck('properties')\n\
    \    .map(makeRow)\n    .subscribe(function(row) { table.appendChild(row); });\n\
    ```\n\nThe `pluck` operator extracts the value of properties from each earthquake\
    \ object, because it contains all the info we need for `makeRow`. Then we map\
    \ each earthquake object to `makeRow` to transform it into a populated HTML `tr`\
    \ element. Finally, in the subscription we append every emitted row to our table.\n\
    \nThis should give us a nicely populated table whenever we receive the earthquake\
    \ data.\n\nLooks good, and it was easy enough! Still, we can make some improvements.\
    \ First, though, we need to explore an important concept in RxJS: hot and cold\
    \ Observables.\n\n### Hot and Cold Observables\n\n“Hot” Observables emit values\
    \ regardless of Observers being subscribed to them. On the other hand, “cold”\
    \ Observables emit the entire sequence of values from the start to every Observer.\n\
    \nAn Observer subscribed to a hot Observable will receive values emitted from\
    \ the exact moment it subscribes to it. Every other Observer subscribed at that\
    \ moment will receive the exact same values. This is similar to how JavaScript\
    \ events work.\n\nMouse events and a stock-exchange ticker are examples of hot\
    \ Observables. In both cases the Observable emits values regardless of whether\
    \ it has subscribers, and could already be producing values before any subscriber\
    \ is listening. Here's an example:\n\n```javascript\n// hot_cold.js\nvar onMove\
    \ = Rx.Observable.fromEvent(document, 'mousemove');\nvar subscriber1 = onMove.subscribe(function(e)\
    \ {\n    console.log('Subscriber1:', e.clientX, e.clientY);\n});\nvar subscriber2\
    \ = onMove.subscribe(function(e) {\n    console.log('Subscriber2:', e.clientX,\
    \ e.clientY);\n});\n\n// Result:\n// Subscriber1: 23 24\n// Subscriber2: 23 24\n\
    // Subscriber1: 34 37\n// Subscriber2: 34 37\n// Subscriber1: 46 49\n// Subscriber2:\
    \ 46 49\n// ...\n```\n\nIn the example, both subscribers receive the same values\
    \ from the Observable as they are emitted. To JavaScript programmers, that behavior\
    \ feels natural because it resembles how JavaScript events work.\n\nNow let's\
    \ see how cold Observables work.\n\n### Cold Observables\n\nA cold Observable\
    \ emits values only when Observers subscribe to it.\n\nFor example, `Rx.Observable.range`\
    \ returns a cold Observable. Every new Observer that subscribes to it will receive\
    \ the whole range:\n\n```javascript\n// hot_cold.js\nfunction printValue(value)\
    \ {\n    console.log(value);\n}\n\nvar rangeToFive = Rx.Observable.range(1, 5);\n\
    var obs1 = rangeToFive.subscribe(printValue); // 1, 2, 3, 4, 5\n\nvar obs2 = Rx.Observable\n\
    \    .delay(2000)\n    .flatMap(function() {\n        return rangeToFive.subscribe(printValue);\
    \ // 1, 2, 3, 4, 5\n    });\n```\n\nUnderstanding when we're dealing with hot\
    \ or cold Observables is essential to avoid subtle and sneaky bugs. For example,\
    \ `Rx.Observable.interval` returns an Observable that produces an increasing integer\
    \ value at regular intervals of time. Imagine we want to use it to push the same\
    \ values to several Observers. We could implement it like this:\n\n```javascript\n\
    // hot_cold.js\nvar source = Rx.Observable.interval(2000);\nvar observer1 = source.subscribe(function\
    \ (x) {\n    console.log('Observer 1, next value: ' + x);\n});\n\nvar observer2\
    \ = source.subscribe(function (x) {\n    console.log('Observer 2, next value:\
    \ ' + x);\n});\n```\n\nOutput:\n\n> Observer 1, next value: 0\n> Observer 2, next\
    \ value: 0\n> Observer 1, next value: 1\n> Observer 2, next value: 1\n> ...\n\n\
    That seems to work. But now imagine that we need the second subscriber to join\
    \ three seconds after the first one:\n\n```javascript\n// hot_cold.js\nvar source\
    \ = Rx.Observable.interval(1000);\nvar observer1 = source.subscribe(function (x)\
    \ {\n    console.log('Observer 1: ' + x);\n});\n\nsetTimeout(function() {\n  \
    \  var observer2 = source.subscribe(function (x) {\n        console.log('Observer\
    \ 2: ' + x);\n    });\n}, 3000);\n```\n\nOutput:\n\n> Observer 1: 0\n> Observer\
    \ 1: 1\n> Observer 1: 2\n> Observer 1: 3"
  mdcn: "\n## 第 4 章\n## 构建一个完整的 Web 应用程序\n\n在本章中，我们将构建一个典型的 Web 应用程序，在前端和后端都使用 RxJS。我们将对文档对象模型（DOM）进行转换，并在\
    \ Node.js 服务器中使用 WebSockets 进行客户端-服务器通信。\n\n对于用户界面部分，我们将使用 RxJS-DOM 库，这是一个由 RxJS\
    \ 团队开发的库，它提供了便捷的操作符来处理 DOM 和浏览器相关事宜，使我们的开发更加轻松。对于服务器部分，我们将使用两个成熟的 Node 库，并将它们的部分\
    \ API 用 Observable 包装起来，以便在应用程序中使用。\n\n在本章之后，你将能够使用 RxJS 以声明式的方式构建用户界面，将我们目前所学的技术应用于\
    \ DOM。你也将准备好在任何 Node.js 项目中使用 RxJS，并在任何项目中应用响应式编程和 RxJS。\n\n## 构建一个实时地震仪表盘\n\n\
    我们将为地震仪表盘应用程序构建服务器端和客户端部分，接续我们在 [第 29 页的“制作实时地震可视化工具”](example) 中开始的体验。我们将使用 Node.js\
    \ 构建服务器，并改进我们的应用程序，使其更具交互性和信息量。\n\n[第 70 页的截图](example) 展示了完成后仪表盘的外观：\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_87_0.png)\n\
    \n| 地点 | 震级 | 时间 |\n| :--- | :--- | :--- |\n| 6km WNW of The Geysers, California\
    \ | 1.06 | Wed Feb 11 2015 17:18:01 GMT+0100 (CET) |\n| 8km N of Anza, California\
    \ | 0.68 | Wed Feb 11 2015 17:11:34 GMT+0100 (CET) |\n| 12km SE of Big Bear City,\
    \ California | 1.3 | Wed Feb 11 2015 17:09:52 GMT+0100 (CET) |\n\n我们的起点将是 [第 29\
    \ 页的“制作实时地震可视化工具”](example) 中的代码，当时我们将其写成这样：\n\n```javascript\n// examples_earthquake/code1_3.js\n\
    var quakes = Rx.Observable\n  .interval(5000)\n  .flatMap(function() {\n    return\
    \ Rx.DOM.jsonpRequest({\n        url: QUAKE_URL,\n        jsonpCallback: 'eqfeed_callback'\n\
    \    });\n  })\n  .retry(3)\n  .flatMap(function(result) {\n      return Rx.Observable.from(result.response.features);\n\
    \  })\n  .distinct(function(quake) { return quake.properties.code; });\n\nquakes.subscribe(function(quake)\
    \ {\n    var coords = quake.geometry.coordinates;\n    var size = quake.properties.mag\
    \ * 10000;\n\n    L.circle([coords[1], coords[0]], size).addTo(map);\n});\n```\n\
    \n这段代码已经存在一个潜在的 Bug：它可能会在 DOM 准备好之前执行，导致每当我们尝试在代码中使用 DOM 元素时都会抛出错误。我们希望在 `DOMContentLoaded`\
    \ 事件触发后加载代码，该事件标志着浏览器已意识到页面上所有元素的时刻。\n\nRxJS-DOM 提供了 `Rx.DOM.ready()` Observable，它在\
    \ `DOMContentLoaded` 触发时发出一次通知。因此，让我们将代码包装在一个初始化函数中，并在订阅 `Rx.DOM.ready()` 时执行它：\n\
    \n```javascript\n// examples_earthquake_ui/code1.js\nfunction initialize() {\n\
    \    var quakes = Rx.Observable\n        .interval(5000)\n        .flatMap(function()\
    \ {\n            return Rx.DOM.jsonpRequest({\n                url: QUAKE_URL,\n\
    \                jsonpCallback: 'eqfeed_callback'\n            });\n        })\n\
    \        .flatMap(function(result) {\n            return Rx.Observable.from(result.response.features);\n\
    \        })\n        .distinct(function(quake) { return quake.properties.code;\
    \ });\n\n    quakes.subscribe(function(quake) {\n        var coords = quake.geometry.coordinates;\n\
    \        var size = quake.properties.mag * 10000;\n        L.circle([coords[1],\
    \ coords[0]], size).addTo(map);\n    });\n    });\n}\n\nRx.DOM.ready().subscribe(initialize);\n\
    ```\n\n接下来，我们在 HTML 中添加一个空表格，在下一节中我们将在此填充地震数据：\n\n```html\n<table>\n  <thead>\n\
    \    <tr>\n      <th>Location</th>\n      <th>Magnitude</th>\n      <th>Time</th>\n\
    \    </tr>\n  </thead>\n  <tbody id=\"quakes_info\">\n  </tbody>\n</table>\n```\n\
    \n至此，我们准备好开始为仪表盘编写新代码了。\n\n## 添加地震列表\n\n新仪表盘的第一个功能是显示地震的实时列表，包括地点、震级和日期等信息。该列表的数据与地图的数据相同，均来自\
    \ USGS 网站。我们首先创建一个函数，该函数在给定 `props` 对象参数时返回一个行（row）元素：\n\n```javascript\n// examples_earthquake_ui/code2.js\n\
    function makeRow(props) {\n    var row = document.createElement('tr');\n    row.id\
    \ = props.net + props.code;\n\n    var date = new Date(props.time);\n    var time\
    \ = date.toString();\n    [props.place, props.mag, time].forEach(function(text)\
    \ {\n        var cell = document.createElement('td');\n        cell.textContent\
    \ = text;\n        row.appendChild(cell);\n    });\n\n    return row;\n}\n```\n\
    \n`props` 参数与我们从 USGS 网站获取的 JSON 中的 `properties` 属性相同。\n\n为了生成行，我们将再次订阅 `quakes`\
    \ Observable。这次订阅会为接收到的每个新地震在表格中创建一行。我们将代码添加到 `initialize` 函数的末尾：\n\n```javascript\n\
    // examples_earthquake_ui/code2.js\nvar table = document.getElementById('quakes_info');\n\
    quakes\n    .pluck('properties')\n    .map(makeRow)\n    .subscribe(function(row)\
    \ { table.appendChild(row); });\n```\n\n`pluck` 操作符从每个地震对象中提取 `properties` 的值，因为它包含了\
    \ `makeRow` 所需的所有信息。然后，我们将每个地震对象映射到 `makeRow`，将其转换为填充好内容的 HTML `tr` 元素。最后，在订阅中，我们将每个发出的行添加到我们的表格中。\n\
    \n这样，每当我们收到地震数据时，都会得到一个填充良好的表格。\n\n看起来不错，而且足够简单！不过，我们还可以进行一些改进。但在那之前，我们需要探讨 RxJS\
    \ 中的一个重要概念：**热（hot）**和**冷（cold）**Observable。\n\n### 热 Observable 和 冷 Observable\n\
    \n“热”Observable 无论是否有 Observer 订阅它们都会发出值。另一方面，“冷”Observable 会向每个 Observer 发出从开始直到结束的完整值序列。\n\
    \n订阅热 Observable 的 Observer 将从订阅的那一刻起接收发出的值。在该时刻订阅的所有其他 Observer 将接收到完全相同的值。这与\
    \ JavaScript 事件的工作方式类似。\n\n鼠标事件和股票交易行情表是热 Observable 的例子。在这两种情况下，无论是否有订阅者，Observable\
    \ 都会发出值，并且在任何订阅者监听之前可能就已经在产生值了。这里有一个例子：\n\n```javascript\n// hot_cold.js\nvar\
    \ onMove = Rx.Observable.fromEvent(document, 'mousemove');\nvar subscriber1 =\
    \ onMove.subscribe(function(e) {\n    console.log('Subscriber1:', e.clientX, e.clientY);\n\
    });\nvar subscriber2 = onMove.subscribe(function(e) {\n    console.log('Subscriber2:',\
    \ e.clientX, e.clientY);\n});\n\n// Result:\n// Subscriber1: 23 24\n// Subscriber2:\
    \ 23 24\n// Subscriber1: 34 37\n// Subscriber2: 34 37\n// Subscriber1: 46 49\n\
    // Subscriber2: 46 49\n// ...\n```\n\n在这个例子中，两个订阅者在 Observable 发出值时接收到相同的值。对于\
    \ JavaScript 程序员来说，这种行为感觉很自然，因为它类似于 JavaScript 事件的工作方式。\n\n现在让我们看看冷 Observable\
    \ 是如何工作的。\n\n### 冷 Observable\n\n冷 Observable 仅在 Observer 订阅它时才发出值。\n\n例如，`Rx.Observable.range`\
    \ 返回一个冷 Observable。每个订阅它的新 Observer 都会接收到完整的范围：\n\n```javascript\n// hot_cold.js\n\
    function printValue(value) {\n    console.log(value);\n}\n\nvar rangeToFive =\
    \ Rx.Observable.range(1, 5);\nvar obs1 = rangeToFive.subscribe(printValue); //\
    \ 1, 2, 3, 4, 5\n\nvar obs2 = Rx.Observable\n    .delay(2000)\n    .flatMap(function()\
    \ {\n        return rangeToFive.subscribe(printValue); // 1, 2, 3, 4, 5\n    });\n\
    ```\n\n理解我们处理的是热还是冷 Observable 对于避免微妙且隐蔽的 Bug 至关重要。例如，`Rx.Observable.interval`\
    \ 返回一个在固定时间间隔产生递增整数值的 Observable。假设我们想使用它将相同的值推送给多个 Observer。我们可以这样实现：\n\n```javascript\n\
    // hot_cold.js\nvar source = Rx.Observable.interval(2000);\nvar observer1 = source.subscribe(function\
    \ (x) {\n    console.log('Observer 1, next value: ' + x);\n});\n\nvar observer2\
    \ = source.subscribe(function (x) {\n    console.log('Observer 2, next value:\
    \ ' + x);\n});\n```\n\n输出：\n\n> Observer 1, next value: 0\n> Observer 2, next\
    \ value: 0\n> Observer 1, next value: 1\n> Observer 2, next value: 1\n> ...\n\n\
    这看起来可以工作。但现在假设我们需要第二个订阅者在第一个订阅者加入三秒后才加入：\n\n```javascript\n// hot_cold.js\nvar\
