  md: "calling their update method—whenever the state of the Producer changes. (In\
    \ most explanations of the Observer pattern, this entity is called `Subject`,\
    \ but to avoid confusion with RxJS’s own `Subject` type, we call it `Producer`).\n\
    \nIt’s easy to implement a rudimentary version of the pattern in a few lines:\n\
    \n```\n```javascript\nch1/observer_pattern.js\nfunction Producer() {\n    this.listeners\
    \ = [];\n}\n\nProducer.prototype.add = function(listener) {\n    this.listeners.push(listener);\n\
    };\n\nProducer.prototype.remove = function(listener) {\n    var index = this.listeners.indexOf(listener);\n\
    \    this.listeners.splice(index, 1);\n};\n\nProducer.prototype.notify = function(message)\
    \ {\n    this.listeners.forEach(function(listener) {\n        listener.update(message);\n\
    \    });\n};\n```\n```\n\nThe Producer object keeps a dynamic list of Listeners\
    \ in the instance’s `listeners` array that will all be updated whenever the Producer\
    \ calls its `notify` method. In the following code we create two objects that\
    \ listen to notify, an instance of Producer:\n\n```\n```javascript\nch1/observer_pattern.js\n\
    // Any object with an 'update' method would work.\nvar listener1 = {\n    update:\
