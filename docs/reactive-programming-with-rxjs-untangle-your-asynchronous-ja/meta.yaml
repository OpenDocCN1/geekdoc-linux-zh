    });\n```\n```\n\nNow we delegate the responsibility of handling user input and\
    \ rendering the search box to the `wpSearchBox` widget, which we could easily\
    \ reuse in another application that requires a search box that queries URL APIs.\
    \ These are the main changes:\n\n+   1. Import the searchBox widget we just created.\n\
    2. Create an instance of SearchBox, passing the DOM driver and the properties\
