    \ `repeat` 来取消重复，最终 `subscribe` 的调用返回。\n\n经验法则，`currentThread` 应该用于迭代大型序列以及使用\
    \ `repeat` 等递归操作符的情况。\n\n#### 何时使用\n\n`currentThread` Scheduler 对于涉及 `repeat`\
    \ 等递归操作符的操作，以及通常包含嵌套操作符的迭代非常有用。\n"
