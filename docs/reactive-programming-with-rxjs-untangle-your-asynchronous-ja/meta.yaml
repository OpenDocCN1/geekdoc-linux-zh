- img_proc: true
  md: "```\n```javascript\nreturn Rx.Observable.create(function(observer) {\n    if\
    \ (!subject) {\n        subject = new Rx.AsyncSubject();\n        Rx.DOM.get(url).subscribe(subject);\n\
    \    }\n    return subject.subscribe(observer);\n});\n```\n```\n\n```\n```javascript\n\
    var products = getProducts('products');\n// Will trigger request and receive the\
    \ response when read\nproducts.subscribe(\n    function onNext(result) { console.log('Result\
    \ 1:', result.response); },\n    function onError(error) { console.log('ERROR',\
    \ error); }\n);\n```\n```\n\n```\n```javascript\n// Will receive the result immediately\
    \ because it's cached\nsetTimeout(function() {\n    products.subscribe(\n    \
    \    function onNext(result) { console.log('Result 2:', result.response); },\n\
    \        function onError(error) { console.log('ERROR', error); }\n    );\n},\
    \ 5000);\n```\n```\n\nIn this code, when getProducts is called with a URL, it\
    \ returns an Observer that emits the result of the HTTP GET request. Here's how\
    \ it breaks down:\n\n+   1. getProducts returns an Observable sequence. We create\
    \ it here.\n2. If we haven't created an AsyncSubject yet, we create it and subscribe\
    \ it to the Observable that Rx.DOM.Request.get(url) returns.\n3. We subscribe\
    \ the Observer to the AsyncSubject. Every time an Observer subscribes to the Observable,\
    \ it will actually be subscribed to the AsyncSubject, which is acting as a proxy\
    \ between the Observable retrieving the URL and the Observers.\n4. We create the\
    \ Observable that retrieves the URL \"products\" and store it in the products\
    \ variable.\n5. This is the first subscription and will kick off the URL retrieval\
    \ and log the results when the URL is retrieved.\n6. This is the second subscription,\
    \ which runs five seconds after the first one. Since at that time the URL already\
    \ been retrieved, there's no need for another network request. It will receive\
    \ the result of the request immediately because it is already stored in the AsyncSubject\
    \ subject."
  merge: -1
  pgno: 64
- img_proc: true
  md: "The interesting bit is that we're using an AsyncSubject that subscribes to\
    \ the Rx.DOM.Request.get Observable. Because AsyncSubject caches the last result,\
    \ any subsequent subscription to products will receive the result right away,\
    \ without causing another network request. We can use AsyncSubject whenever we\
    \ expect a single result and want to hold onto it.\n\n> **Joe asks:\nDoes That\
    \ Mean AsyncSubject Acts Like a Promise?**\n\nIndeed.\n\nAsyncSubject represents\
    \ the result of an asynchronous action, and you can use it as a substitute for\
    \ a promise. The difference internally is that a promise will only ever process\
    \ a single value, whereas AsyncSubject processes all values in a sequence, only\
    \ ever emitting (and caching) the last one.\n\nBeing able to so easily simulate\
    \ promises shows the flexibility of the RxJS model. (Even without AsyncSubject,\
    \ it would be pretty easy to simulate a promise using Observables.)\n\n# BehaviorSubject\n\
    \nWhen an Observer subscribes to a BehaviorSubject, it receives the last emitted\
    \ value and then all the subsequent values. BehaviorSubject requires that we provide\
    \ a starting value, so that all Observers will always receive a value when they\
    \ subscribe to a BehaviorSubject.\n\nImagine we want to retrieve a remote file\
    \ and print its contents on an HTML page, but we want a placeholder text while\
    \ we wait for the contents. We can use a BehaviorSubject for this:\n\n```\n```javascript\n\
    spaceship_reactive/behavior_subject.js\nvar subject = new Rx.BehaviorSubject('Waiting\
    \ for content');\n\nsubject.subscribe(\n    function(result) {\n        document.body.textContent\
    \ = result.response || result;\n    },\n    function(err) {\n        document.body.textContent\
    \ = 'There was an error retrieving content';\n    }\n);\n\nRx.DOM.get('/remote/content').subscribe(subject);\n\
    ```\n```"
  merge: -1
  pgno: 65
- img_proc: true
  md: 'In the code, we initialize a new BehaviorSubject with our placeholder content.
    Then we subscribe to it and change the HTML body content in both `onNext` and
    `onError`, depending on the result.


    Now the HTML body contains our placeholder text, and it will stay that way until
    the Subject emits a new value. Finally, we request the resource we want and we
    subscribe our Subject to the resulting Observer.


    BehaviorSubject guarantees that there will always be at least one value emitted,
    because we provide a default value in its constructor. Once the BehaviorSubject
    completes it won''t emit any more values, freeing the memory used by the cached
    value.


    # ### ReplaySubject


    A ReplaySubject caches its values and re-emits them to any Observer that subscribes
    late to it. Unlike with AsyncSubject, the sequence doesn''t need to be completed
    for this to happen.


    | Subject | ReplaySubject |

    | :--- | :--- |

    | `var subject = new Rx.Subject();` | `var subject = new Rx.ReplaySubject();`
    |

    | `subject.onNext(1);` | `subject.onNext(1);` |

    | `subject.subscribe(function(n) { console.log(''Received value:'', n); });` |
    `subject.subscribe(function(n) { console.log(''Received value:'', n); });` |

    | `subject.onNext(2);` <br> `subject.onNext(3);` | `subject.onNext(2);` <br> `subject.onNext(3);`
    |

    | `Received value: 2` <br> `Received value: 3` | `Received value: 1` <br> `Received
    value: 2` <br> `Received value: 3` |


    ReplaySubject is useful to make sure that Observers get all the values emitted
    by an Observable from the start. It spares us from writing messy code that caches
    previous values, saving us from nasty concurrency-related bugs.


    Of course, to accomplish that behavior ReplaySubject caches all values in memory.
    To prevent it from using too much memory, we can limit the amount of data it stores
    by buffer size or window of time, or by passing particular parameters to the constructor.


    The first parameter to the constructor of ReplaySubject takes a number that represents
    how many values we want to buffer:'
  merge: -1
  pgno: 66
- img_proc: true
  md: "```\n```javascript\nvar subject = new Rx.ReplaySubject(2); // Buffer size of\
    \ 2\n\nsubject.onNext(1);\nsubject.onNext(2);\nsubject.onNext(3);\n\nsubject.subscribe(function(n)\
    \ {\n    console.log('Received value:', n);\n});\n```\n```\n\n> Received value:\
    \ 2\n> Received value: 3\n\nThe second parameter takes a number that represents\
    \ the time in milliseconds during which we want to buffer values:\n\n```\n```javascript\n\
    var subject = new Rx.ReplaySubject(null, 200); // Buffer size of 200ms\n\nsetTimeout(function()\
    \ { subject.onNext(1); }, 100);\nsetTimeout(function() { subject.onNext(2); },\
    \ 200);\nsetTimeout(function() { subject.onNext(3); }, 300);\nsetTimeout(function()\
    \ { \n    subject.subscribe(function(n) {\n        console.log('Received value:',\
    \ n);\n    });\n}, 350);\n\nsubject.onNext(4);\n```\n```\n\nIn this example we\
    \ set a buffer based on time, instead of the number of values. Our ReplaySubject\
    \ will cache values that were emitted up to 200 milliseconds ago. We emit three\
    \ values, each separated by 100 milliseconds, and after 350 milliseconds we subscribe\
    \ an Observer and we emit yet another value. At the moment of the subscription\
    \ the items cached are 2 and 3, because 1 happened too long ago (around 250 milliseconds\
    \ ago), so it is no longer cached.\n\nSubjects are a powerful tool that can save\
    \ you a lot of time. They provide great solutions to common scenarios like caching\
    \ and repeating. And since at their core they are just Observables and Observers,\
    \ you don't need to learn anything new.\n\n# ## Spaceship Reactive!\n\nTo show\
    \ how we can keep an application pure, we'll build a video game in which our hero\
    \ fights endless hordes of enemy spaceships. We'll make heavy use of Observable\
    \ pipelines, and I'll point out along the way when it might be tempting to store\
    \ state outside the pipeline and how to avoid it."
