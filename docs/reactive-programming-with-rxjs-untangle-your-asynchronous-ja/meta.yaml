    # ## Spaceship Reactive!\n\nTo show how we can keep an application pure, we'll\
    \ build a video game in which our hero fights endless hordes of enemy spaceships.\
    \ We'll make heavy use of Observable pipelines, and I'll point out along the way\
    \ when it might be tempting to store state outside the pipeline and how to avoid\
