  md: "first to signal to the callback function that there was a problem. We then\
    \ use then\nfromNodeCallback to create Observables specifically from Node.js-style\
    \ callbacks:\n\n```\n```javascript\nvar Rx = require('rx'); // Load RxJS\nvar\
    \ fs = require('fs'); // Load Node.js Filesystem module\n\n// Create an Observable\
    \ from the readdir method\nvar readdir = Rx.Observable.fromNodeCallback(fs.readdir);\n\
    \n// Send a delayed message\nvar source = readdir('/Users/sergi');\n\nvar subscription\
    \ = source.subscribe(\n    function(res) { console.log('List of directories: '\
    \ + res); },\n    function(err) { console.log('Error: ' + err); },\n    function()\
    \ { console.log('Done!'); });\n```\n```\n\nIn the preceding code, we make an Observable\
    \ `Observable` `readdir` out of `Node.js`'s `fs.readdir` method. `fs.readdir`\
    \ accepts a directory path and a callback function `delayedMsg`, which calls once\
    \ the directory contents are retrieved.\n\nWe use `readdir` with the same arguments\
    \ we'd pass to the original `fs.readdir`, minus the callback function. This returns\
    \ an Observable that will properly use `onNext`, `onError`, and `onCompleted`\
    \ when we subscribe an Observer to it.\n\n# Wrapping Up\n\nIn this chapter we\
    \ explored the reactive approach to programming and saw how RxJS can solve the\
    \ problems of other methods, such as callbacks or promises, through Observables.\
    \ Now you understand why Observables are powerful, and you know how to create\
    \ them. Armed with this foundation, we can now go on to create more interesting\
    \ reactive programs. The next chapter shows you how to create and compose sequence-based\
    \ programs that provide a more “Observable” approach to some common scenarios\
    \ in web development."
