  - "[PAGE 92]\n\n```\nObserver 2: 0\nObserver 1: 4\nObserver 2: 1\n...\n```\n\nNow\
    \ we see that something is really off. When subscribing three seconds later, observer2\
    \ receives all the values that the source already pushed, instead of starting\
    \ with the current value and continuing from there, because Rx.Observable.interval\
    \ is a *cold* Observable. If the difference between hot and cold Observables is\
    \ not clear, scenarios like this can be surprising.\n\nIf we have several Observers\
    \ listening to a cold Observable, they will receive copies of the same sequence\
    \ of values. So strictly speaking, although the Observers are sharing the same\
    \ Observable, they are not sharing the same exact sequence of values. If we want\
    \ the Observers to share the same sequence, we need a hot Observable.\n\n# From\
    \ Cold to Hot Using publish\n\nWe can turn a cold Observable into a hot one using\
    \ `publish`. Calling publish creates a new Observable that acts as a proxy to\
    \ the original one. It does that by subscribing itself to the original and pushing\
    \ the values it receives to its subscribers.\n\nA *published* Observable is actually\
    \ a `ConnectableObservable`, which has an extra method called `connect` that we\
    \ call to start receiving values. This allows us to subscribe to it before it\
    \ starts running:\n\n```\nhot_cold.js\n// Create an Observable that yields a value\
    \ every second\nvar source = Rx.Observable.interval(1000);\nvar publisher = source.publish();\n\
    \n// Even if we are subscribing, no values are pushed yet.\nvar observer1 = publisher.subscribe(function\
    \ (x) {\n    console.log('Observer 1: ' + x);\n});\n\n// publisher connects and\
    \ starts publishing values\npublisher.connect();\n\nsetTimeout(function() {\n\
    \    // 5 seconds later, observer2 subscribes to it and starts receiving\n   \
    \ // current values, not the whole sequence.\n    var observer2 = publisher.subscribe(function\
    \ (x) {\n        console.log('Observer 2: ' + x);\n    });\n}, 5000);\n```"
  - "[PAGE 93]\n\n# Sharing a Cold Observable\n\nLet's get back to our earthquake\
    \ example. The code we have so far looks reasonable; we have an Observable quakes\
    \ with two subscriptions: one that paints earthquakes on the map, and one that\
    \ lists them in the table.\n\nBut we can make our code much more efficient. By\
    \ having two subscribers to quakes we're, in fact, requesting the data twice.\
    \ You can check that by putting a `console.log` inside the `flatMap` operator\
    \ in quakes.\n\nThis happens because quakes is a cold Observable, and it will\
    \ re-emit all its values to each new subscriber, so a new subscription means a\
    \ new JSONP request. This impacts our application performance by requesting the\
    \ same resources twice over the network.\n\nFor the next example we'll use the\
    \ `share` operator, which automatically creates a subscription to the Observable\
    \ when the number of Observers goes from zero to one. This saves us from calling\
    \ connect:\n\n```\n```javascript\nexamples_earthquake_ui/code2.js\nvar quakes\
    \ = Rx.Observable\n    .interval(5000)\n    .flatMap(function() {\n        return\
    \ Rx.DOM.jsonpRequest({\n            url: QUAKE_URL,\n            jsonpCallback:\
    \ 'eqfeed_callback'\n        });\n    })\n    .flatMap(function(result) {\n  \
    \      return Rx.Observable.from(result.response.features);\n    })\n    .distinct(function(quake)\
    \ { return quake.properties.code; })\n    .share()\n```\n```\n\nNow quakes behaves\
    \ like a hot Observable, and we don't have to worry about how many Observers we\
    \ connect to it, since they will all receive the exact same data.\n\n# Buffering\
    \ Values\n\nOur preceding code works well, but notice that we insert a `tr` node\
    \ every time we receive information about an earthquake. That's inefficient, because\
    \ with each insertion we're modifying the DOM and causing a repaint of the page,\
    \ making the browser do unnecessary work to calculate the new layout. This can\
    \ cause noticeable performance drop.\n\nIdeally, we would batch several incoming\
    \ earthquake objects and insert each batch every few seconds. That would be tricky\
    \ to implement by hand because"
  - "[PAGE 94]\n\nwe'd have to keep counters and element buffers, and we would have\
    \ to remember to reset them with every batch. But with RxJS we can just use one\
    \ of the buffer-based RxJS operators, like `bufferWithTime`.\n\nWith `bufferWithTime`\
    \ we can buffer incoming values and release them as an array every $x$ period\
    \ of time:\n\n```\n```javascript\nexamples_earthquake_ui/code3.bufferWithTime.js\n\
    var table = document.getElementById('quakes_info');\nquakes\n  .pluck('properties')\n\
    \  .map(makeRow)\n  .bufferWithTime(500)\n  .filter(function(rows) { return rows.length\
    \ > 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      fragment.appendChild(row);\n    });\n\
    \    return fragment;\n  })\n  .subscribe(function(fragment) {\n    table.appendChild(fragment);\n\
    \  });\n```\n```\n\nThis is what's going on in the new code:\n\n+   1. Buffer\
    \ every incoming value and release the batch of values every 500 milliseconds.\n\
    2. `bufferWithTime` executes every 500ms no matter what, and if there have been\
    \ no incoming values, it will yield an empty array. We'll filter those.\n3. We\
    \ insert every row into a *document fragment*, which is a document without a parent.\
    \ This means it's not in the DOM, and modifying its contents is very fast and\
    \ efficient.\n4. Finally, we append the fragment to the DOM. An advantage of appending\
    \ a fragment is that it counts as a single operation, causing just one redraw.\
    \ It also appends the fragment's children to the same element to which we're appending\
    \ the fragment itself.\n\nUsing buffers and fragments, we manage to keep row insertion\
    \ performant while keeping the real-time nature of our application (with a maximum\
    \ delay of half a second). Now we're ready to add the next feature to our dashboard:\
    \ interactivity!"
  - "[PAGE 95]\n\n# Adding Interaction\n\nWe now have earthquakes on the map and in\
    \ a list, but no interaction between both representations yet. It would be nice,\
    \ for example, to center an earthquake on the map whenever we click on it on the\
    \ list, and to highlight an earthquake with a circle on the map when we move the\
    \ mouse over its row. Let’s get to it.\n\nIn Leaflet, you can draw on a map and\
    \ put drawings in their own layers so you can manipulate them individually. Let’s\
    \ create a group of layers called quakeLayer where we’ll store all the earthquake\
    \ circles. Each circle will be a layer inside the group. We’ll also create an\
    \ object codeLayers where we’ll store the correlation between an earthquake code\
    \ and the internal layer ID, so that we can refer to circles by the earthquake\
    \ ID:\n\n```\n```javascript\n// examples_earthquake_ui/code3.js\nvar codeLayers\
    \ = {};\nvar quakeLayer = L.layerGroup([]).addTo(map);\n```\n```\n\nAnd now in\
    \ the subscription for the quakes Observable inside initialize, we’ll add each\
    \ circle to the layer group and store its ID in codeLayers. If this seems a bit\
    \ intricate, it’s because that’s the only way Leaflet allows us to refer to drawings\
    \ in a map.\n\n```\n```javascript\n// examples_earthquake_ui/code3.js\nquakes.subscribe(function(quake)\
    \ {\n    var coords = quake.geometry.coordinates;\n    var size = quake.properties.mag\
    \ * 10000;\n\n    var circle = L.circle([coords[1], coords[0]], size).addTo(map);\n\
    \    quakeLayer.addLayer(circle);\n    codeLayers[quake.id] = quakeLayer.getLayerId(circle);\n\
    });\n```\n```\n\nLet’s now create the hovering effect. We’ll write a new function,\
    \ isHovering, which returns an Observable that emits a Boolean value for whether\
    \ the mouse is over a particular earthquake circle at any given moment:\n\n```\n\
    ```javascript\n// examples_earthquake_ui/code3.js\nvar identity = Rx.helpers.identity;\n\
    \nfunction isHovering(element) {\n    var over = Rx.DOM.mouseover(element).map(identity(true));\n\
    \    var out = Rx.DOM.mouseout(element).map(identity(false));\n\n    return over.merge(out);\n\
    }\n```\n```"
  - "[PAGE 96]\n\n+   1. Rx.helpers.identity is the identity function. Given a parameter\
    \ x, it returns x. This way we don’t have to write functions that return the value\
    \ they receive.\n\n+   2. over is an Observable that emits true when the user\
    \ hovers the mouse over the element.\n\n+   3. out is an Observable that emits\
    \ false when the user moves the mouse outside of the element.\n\n+   4. isHovering\
    \ merges both over and out, returning an Observable that emits true when the mouse\
    \ is over an element, and false when it leaves it.\n\nWith isHovering in place\
    \ we can modify the subscription that creates the rows, so that we subscribe to\
    \ events in each row as it is created:\n\n```\n```javascript\nexamples_earthquake_ui/code3.js\n\
    var table = document.getElementById('quakes_info');\nquakes\n  .pluck('properties')\n\
    \  .map(makeRow)\n  .bufferWithTime(500)\n  .filter(function(rows) { return rows.length\
    \ > 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      fragment.appendChild(row);\n    });\n\
    \    return fragment;\n  })\n  .subscribe(function(fragment) {\n    var row =\
    \ fragment.firstChild; // Get row from inside the fragment\n    var circle = quakeLayer.getLayer([codeLayers[row.id]]);\n\
    \n    isHovering(row).subscribe(function(hovering) {\n      circle.setStyle({\
    \ color: hovering ? '#ff0000' : '#0000ff' });\n    });\n\n    Rx.DOM.click(row).subscribe(function()\
    \ {\n      map.panTo(circle.getLatLng());\n    });\n\n    table.appendChild(fragment);\n\
    \  })\n```\n```\n\n+   1. We get the circle element for the earthquake on the\
    \ map using the ID we get from the row element. With that, codeLayers gives us\
    \ the corresponding internal ID, which gets us the circle element using quakeLayer.getLayer."
- md: "- 2. We call `isHovering` with the current row and we subscribe to the resulting\
    \ Observable. If the `hovering` argument is true, we'll paint the circle red;\
    \ otherwise, it will be blue.\n\n- 3. We subscribe to the Observable created from\
    \ the `click` event in the current row. When the row in the list is clicked, the\
    \ map will be centered on the corresponding circle in the map.\n\n### Making It\
    \ Efficient\n\nExperienced front-end developers know that creating many events\
    \ on a page is a recipe for bad performance. In our previous example, we created\
    \ three events for each row. If we get 100 earthquakes on the list, we would have\
    \ 300 events floating around the page just to do some light highlighting work!\
    \ That is terrible for performance, and we can do better.\n\nBecause events in\
    \ DOM always bubble up (from children to parent elements), a well-known technique\
    \ among front-end developers to avoid attaching mouse events to many elements\
    \ individually is to attach them instead to their parent element. Once the event\
    \ is fired on the parent, we can use the event's target property to find the child\
    \ element that was the event's target.\n\nBecause we'll need similar functionality\
    \ for the events click and mouseover, we'll create a function `getRowFromEvent`:\n\
    \n```javascript\n// examples_earthquake_ui/code3.pairwise.js\nfunction getRowFromEvent(event)\
    \ {\n    return Rx.Observable\n        .fromEvent(table, event)\n        .filter(function(event)\
    \ {\n            var el = event.target;\n            return el.tagName === 'TD'\
    \ && el.parentNode.id.length;\n        })\n        .pluck('target', 'parentNode')\n\
    \        .distinctUntilChanged();\n}\n```\n\n`getRowFromEvent` gives us the table\
    \ row in which the event has happened. Here are the details:\n\n- 1. We make sure\
    \ that we get events happening in a table cell, and we check that the parent of\
    \ that cell is a row with an ID attribute. These rows are the ones we tagged with\
    \ the earthquake ID.\n\n- 2. The `pluck` operator extracts the nested property\
    \ `parentNode` inside the element's target property.\n\nThis prevents getting\
    \ the same element more than once. That would happen a lot with the mouseover\
    \ event, for example.\n\nIn the previous section we attached the events mouseover\
    \ and mouseout on each row to change the earthquake circle color each time the\
    \ mouse entered or exited the row. Now, we'll use only the mouseover event on\
    \ the table, combined with the convenient pairwise operator:\n\n```javascript\n\
    // examples_earthquake_ui/code3.pairwise.js\ngetRowFromEvent('mouseover')\n  .pairwise()\n\
    \  .subscribe(function(rows) {\n    var prevCircle = quakeLayer.getLayer(codeLayers[rows[0].id]);\n\
    \    var currCircle = quakeLayer.getLayer(codeLayers[rows[1].id]);\n\n    prevCircle.setStyle({\
    \ color: '#0000ff' });\n    currCircle.setStyle({ color: '#ff0000' });\n  });\n\
    ```\n\npairwise groups each emitted value with the previously emitted value in\
    \ an array. Because we're always getting distinct rows, pairwise will always yield\
    \ the row that the mouse just left and the row where the mouse is hovering now.\
    \ With this information, it is easy to color each earthquake circle accordingly.\n\
    \nHandling the click event is even simpler:\n\n```javascript\n// examples_earthquake_ui/code3.pairwise.js\n\
    getRowFromEvent('click')\n  .subscribe(function(row) {\n    var circle = quakeLayer.getLayer(codeLayers[row.id]);\n\
    \    map.panTo(circle.getLatLng());\n  });\n```\n\nAnd we can go back to just\
    \ subscribing to quakes to generate the rows:\n\n```javascript\n// examples_earthquake_ui/code3.pairwise.js\n\
    quakes\n  .pluck('properties')\n  .map(makeRow)\n  .subscribe(function(row) {\
    \ table.appendChild(row); });\n```\n\nOur code is now much more clean and idiomatic,\
    \ and it doesn't depend on the rows being there. If there are no rows, getRowFromEvent\
    \ won't try to yield any.\n\nWhat's more important, our code now is very efficient.\
    \ Regardless of the amount of earthquake information we retrieve, we'll always\
    \ have just a single mouseover event and a single click event, instead of hundreds\
    \ of events.\n\n## Getting Real-Time Updates from Twitter\n\nThe second part of\
    \ our plan to make a real-time dashboard for earthquakes is to add reports and\
    \ information from Twitter related to the different earthquakes happening on the\
    \ planet. For this, we'll create a small Node.js program that will fetch the stream\
    \ of tweets related to the earthquakes.\n\n## Setting Up Our Node.js Environment\n\
    \nLet's configure our Node.js application. Besides RxJS, we will be using two\
    \ venerable third-party modules to make our life easier: `ws` and `twit`.¹ Any\
    \ similar modules should work with minimal changes to the code.\n\nFirst, let's\
    \ create a folder for our application and install the modules that we'll use.\
    \ (Note that the output of the `npm` command may vary depending on the current\
    \ versions of the packages.)\n\n```bash\n$ mkdir tweet_stream\n$ cd tweet_stream\n\
    ~/tweet_stream$ npm install ws twit rx\nrx@3.1.2 node_modules/rx\n\ntwit@1.1.19\
    \ node_modules/twit\n└── oauth@0.9.9\n\nws@0.8.0 node_modules/ws\n└── options@0.0.6\n\
    \    └── ultron@1.0.2\n    └── utf-8-validate@1.2.1 (bindings@1.2.1, nan@2.0.9)\n\
    \    └── bufferutil@1.2.1 (bindings@1.2.1, nan@2.0.9)\n```\n\n## Client-Server\
    \ Communication\n\nNow we're ready to start building our application. Let's create\
    \ a new file called `index.js` inside the `tweet_stream` folder to load the modules\
    \ we'll use:\n\n```javascript\n// examples_earthquake_ui/tweet_stream/index.js\n\
    var WebSocketServer = require('ws').Server;\nvar Twit = require('twit');\nvar\
    \ Rx = require('rx');\n```\n\nTo use the Twitter API, you need to request a consumer\
    \ key and an access token in the Twitter website. Once you have that, create a\
    \ new Twit object with a configuration object, like this:\n\n> ¹ https://github.com/websockets/ws\
    \ and https://github.com/tzezel/twit\n\n```javascript\n// examples_earthquake_ui/tweet_stream/index.js\n\
    var T = new Twit({\n    consumer_key: 'rXhFB5hflhThBBC7ig0kEtYyw',\n    consumer_secret:\
    \ 'zcrXEM1jIdQyKIFLGYFa004zHsz383i0cDHYWyWqBXTBoVARlx',\n    access_token: '14343133-nlXzBtlUewgWalSmlfrr3D4oAo1V2f6xXUVEw9W',\n\
    \    access_token_secret: '57Dr9wECljyy09tVjZwH3o5bNG3v4cr5Lix9s0BXjul'\n});\n\
    ```\n\nNow we can create a function, onConnect, that will do all the work of searching\
    \ tweets and communicating with the client in the future, and we can initiate\
    \ a WebSocket server that will call onConnect once the WebSocket is connected\
    \ and ready:\n\n```javascript\n// examples_earthquake_ui/tweet_stream/index.js\n\
    function onConnect(ws) {\n    console.log('Client connected on localhost:8080');\n\
    }\n```\n\n```javascript\nvar Server = new WebSocketServer({ port: 8080 });\nRx.Observable.fromEvent(Server,\
    \ 'connection').subscribe(onConnect);\n```\n\nWe can now launch our application,\
    \ and it should start a WebSocket connection on port 8080:\n\n```bash\n~/tweet_stream$\
    \ node index.js\n```\n\nThe message about a client connection is not printed yet\
    \ because we haven't connected any browser to this server. Let's now switch to\
    \ the code for our dashboard and do that. We'll use the fromWebSocket operator\
    \ in RxJS-DOM:\n\n```javascript\n// examples_earthquake_ui/code4.js\nfunction\
    \ initialize() {\n    var socket = Rx.DOM.fromWebSocket('ws://127.0.0.1:8080');\n\
    }\n```\n\nIn the preceding code, fromWebSocket creates a Subject that serves as\
    \ the sender and receiver of messages to the WebSocket server. By calling socket.onNext\
    \ we'll be able to send messages to the server, and by subscribing to socket we'll\
    \ receive any messages the server sends us.\n\nWe can now send the server messages\
    \ with the earthquake data we receive:\n\n```javascript\n// examples_earthquake_ui/code4.js\n\
    quakes.bufferWithCount(100)\n    .subscribe(function(quakes) {\n        console.log(quakes);\n\
    \        var quakesData = quakes.map(function(quake) {\n            return {\n\
    \                id: quake.properties.net + quake.properties.code,\n         \
    \       lat: quake.geometry.coordinates[1],\n                lng: quake.geometry.coordinates[0],\n\
    \                mag: quake.properties.mag\n            };\n        });\n    \
    \    socket.onNext(JSON.stringify({quakes: quakesData}));\n    });\n```\n\nAnd\
    \ we can set up a subscriber for messages coming from the server:\n\n```javascript\n\
    // examples_earthquake_ui/code4.js\nsocket.subscribe(function(message) {\n  console.log(JSON.parse(message.data));\n\
    });\n```\n\nNow when we reload the browser, the client message should appear in\
    \ the terminal:\n\n```bash\n~/tweet_stream$ node index.js\nClient connected on\
    \ localhost:8080\n```\n\nFantastic! The browser should be sending commands to\
    \ the server as soon as it starts receiving earthquakes from the remote JSONP\
    \ resource. For now, the server completely ignores those messages, though. Time\
    \ to go back to our tweet stream code and do something with them.\n\nFirst we'll\
    \ connect to the message events that arrive to the server from the browser client.\
    \ Whenever the client sends a message, the WebSocket server emits a message event\
    \ with the contents of the message. In our case, the contents are a stringified\
    \ object.\n\nWe can write the following code in our onConnect function:\n\n```javascript\n\
    // examples_earthquake_ui/tweet_stream/index.js\nvar onMessage = Rx.Observable.fromEvent(ws,\
    \ 'message')\n  .subscribe(function(quake) {\n    quake = JSON.parse(quake);\n\
    \    console.log(quake);\n  });\n```\n\nIf we restart the server (`Ctrl-C` in\
    \ the terminal) and reload the browser, we should see the earthquake details being\
    \ printed in the terminal as they come in. That's perfect. Now we're ready to\
    \ start looking for tweets related to our earthquakes.\n\n### Retrieving and Sending\
    \ Tweets\n\nWe're using the streaming Twitter client for Node.js twit to connect\
    \ to Twitter and search tweets. All the code in the server from now on will happen\
    \ inside"
  mdcn: "\n- 2. 我们调用 `isHovering` 并传入当前行，然后订阅由此产生的 Observable。如果 `hovering` 参数为 true，我们将把圆圈绘制成红色；否则，它将是蓝色。\n\
    \n- 3. 我们订阅由当前行中 `click` 事件创建的 Observable。当列表中的行被点击时，地图将以地图上对应的圆圈为中心。\n\n### 提高效率\n\
    \n经验丰富的前端开发人员知道，在页面上创建过多事件是导致性能下降的根源。在之前的示例中，我们为每一行创建了三个事件。如果列表中有 100 场地震，为了实现简单的高亮效果，页面上就会漂浮\
    \ 300 个事件！这对性能来说太糟糕了，我们可以做得更好。\n\n由于 DOM 中的事件总是向上冒泡（从子元素向父元素），前端开发人员中有一种广为人知的技巧，为了避免单独地将鼠标事件绑定到许多元素上，而是将它们绑定到它们的父元素上。一旦父元素触发了事件，我们可以使用事件的\
    \ `target` 属性来找到作为事件目标的子元素。\n\n因为我们需要为 `click` 和 `mouseover` 事件实现类似的功能，我们将创建一个函数\
    \ `getRowFromEvent`：\n\n```javascript\n// examples_earthquake_ui/code3.pairwise.js\n\
    function getRowFromEvent(event) {\n    return Rx.Observable\n        .fromEvent(table,\
    \ event)\n        .filter(function(event) {\n            var el = event.target;\n\
    \            return el.tagName === 'TD' && el.parentNode.id.length;\n        })\n\
    \        .pluck('target', 'parentNode')\n        .distinctUntilChanged();\n}\n\
    ```\n\n`getRowFromEvent` 为我们提供发生事件的表格行。详情如下：\n\n- 1. 我们确保获取的是发生在表格单元格中的事件，并且检查该单元格的父元素是一个带有\
    \ ID 属性的行。这些行就是我们标记了地震 ID 的行。\n\n- 2. `pluck` 操作符提取元素 `target` 属性内部的嵌套属性 `parentNode`。\n\
    \n这可以防止多次获取同一个元素。例如，在 `mouseover` 事件中这种情况经常发生。\n\n在上一节中，我们在每一行上绑定了 `mouseover`\
    \ 和 `mouseout` 事件，以便在鼠标进入或离开该行时更改地震圆圈的颜色。现在，我们仅在表格上使用 `mouseover` 事件，并结合便捷的 `pairwise`\
    \ 操作符：\n\n```javascript\n// examples_earthquake_ui/code3.pairwise.js\ngetRowFromEvent('mouseover')\n\
    \  .pairwise()\n  .subscribe(function(rows) {\n    var prevCircle = quakeLayer.getLayer(codeLayers[rows[0].id]);\n\
    \    var currCircle = quakeLayer.getLayer(codeLayers[rows[1].id]);\n\n    prevCircle.setStyle({\
    \ color: '#0000ff' });\n    currCircle.setStyle({ color: '#ff0000' });\n  });\n\
    ```\n\n`pairwise` 将每个发出的值与之前发出的值一起组合在一个数组中。因为我们始终获取的是不同的行，所以 `pairwise` 总是会产生鼠标刚刚离开的行和鼠标当前悬停的行。有了这个信息，很容易相应地为每个地震圆圈着色。\n\
    \n处理 `click` 事件则更加简单：\n\n```javascript\n// examples_earthquake_ui/code3.pairwise.js\n\
    getRowFromEvent('click')\n  .subscribe(function(row) {\n    var circle = quakeLayer.getLayer(codeLayers[row.id]);\n\
    \    map.panTo(circle.getLatLng());\n  });\n```\n\n然后我们可以回到简单的订阅地震数据来生成行：\n\n\
    ```javascript\n// examples_earthquake_ui/code3.pairwise.js\nquakes\n  .pluck('properties')\n\
    \  .map(makeRow)\n  .subscribe(function(row) { table.appendChild(row); });\n```\n\
    \n我们的代码现在更加简洁且符合惯用法，并且不再依赖于行是否已经存在。如果没有行，`getRowFromEvent` 就不会尝试产出任何内容。\n\n更重要的是，我们的代码现在非常高效。无论我们检索到多少地震信息，我们始终只有一个\
    \ `mouseover` 事件和一个 `click` 事件，而不是数百个事件。\n\n## 从 Twitter 获取实时更新\n\n我们创建地震实时仪表盘计划的第二部分是添加来自\
    \ Twitter 的关于地球上不同地震的报告和信息。为此，我们将创建一个小型 Node.js 程序，用于获取与地震相关的推文流。\n\n## 设置 Node.js\
    \ 环境\n\n让我们配置 Node.js 应用程序。除了 RxJS 之外，我们将使用两个久经考验的第三方模块来简化工作：`ws` 和 `twit`。¹ 任何类似的模块在对代码进行极小修改后都应该能正常工作。\n\
    \n首先，为我们的应用程序创建一个文件夹并安装将要使用的模块。（注意，`npm` 命令的输出可能会根据软件包的当前版本而有所不同。）\n\n```bash\n\
    $ mkdir tweet_stream\n$ cd tweet_stream\n~/tweet_stream$ npm install ws twit rx\n\
    rx@3.1.2 node_modules/rx\n\ntwit@1.1.19 node_modules/twit\n└── oauth@0.9.9\n\n\
    ws@0.8.0 node_modules/ws\n└── options@0.0.6\n    └── ultron@1.0.2\n    └── utf-8-validate@1.2.1\
    \ (bindings@1.2.1, nan@2.0.9)\n    └── bufferutil@1.2.1 (bindings@1.2.1, nan@2.0.9)\n\
    ```\n\n## 客户端-服务器通信\n\n现在我们准备好开始构建应用程序了。让我们在 `tweet_stream` 文件夹中创建一个名为 `index.js`\
    \ 的新文件，以加载我们将要使用的模块：\n\n```javascript\n// examples_earthquake_ui/tweet_stream/index.js\n\
    var WebSocketServer = require('ws').Server;\nvar Twit = require('twit');\nvar\
    \ Rx = require('rx');\n```\n\n要使用 Twitter API，您需要在 Twitter 网站上申请消费者密钥（consumer\
    \ key）和访问令牌（access token）。一旦获得，就可以像这样使用配置对象创建新的 Twit 对象：\n\n> ¹ https://github.com/websockets/ws\
    \ 和 https://github.com/tzezel/twit\n\n```javascript\n// examples_earthquake_ui/tweet_stream/index.js\n\
    var T = new Twit({\n    consumer_key: 'rXhFB5hflhThBBC7ig0kEtYyw',\n    consumer_secret:\
    \ 'zcrXEM1jIdQyKIFLGYFa004zHsz383i0cDHYWyWqBXTBoVARlx',\n    access_token: '14343133-nlXzBtlUewgWalSmlfrr3D4oAo1V2f6xXUVEw9W',\n\
    \    access_token_secret: '57Dr9wECljyy09tVjZwH3o5bNG3v4cr5Lix9s0BXjul'\n});\n\
    ```\n\n现在我们可以创建一个函数 `onConnect`，它将在未来承担搜索推文并与客户端通信的所有工作。我们可以启动一个 WebSocket 服务器，在\
    \ WebSocket 连接并就绪后调用 `onConnect`：\n\n```javascript\n// examples_earthquake_ui/tweet_stream/index.js\n\
    function onConnect(ws) {\n    console.log('Client connected on localhost:8080');\n\
    }\n```\n\n```javascript\nvar Server = new WebSocketServer({ port: 8080 });\nRx.Observable.fromEvent(Server,\
    \ 'connection').subscribe(onConnect);\n```\n\n我们现在可以启动应用程序，它应该会在 8080 端口启动一个 WebSocket\
    \ 连接：\n\n```bash\n~/tweet_stream$ node index.js\n```\n\n关于客户端连接的消息还没有打印，因为我们还没有将任何浏览器连接到这个服务器。现在让我们切换到仪表盘的代码并执行此操作。我们将使用\
    \ RxJS-DOM 中的 `fromWebSocket` 操作符：\n\n```javascript\n// examples_earthquake_ui/code4.js\n\
    function initialize() {\n    var socket = Rx.DOM.fromWebSocket('ws://127.0.0.1:8080');\n\
    }\n```\n\n在前面的代码中，`fromWebSocket` 创建了一个 Subject，作为与 WebSocket 服务器发送和接收消息的发送者和接收者。通过调用\
    \ `socket.onNext`，我们将能够向服务器发送消息；通过订阅 `socket`，我们将收到服务器发送给我们的任何消息。\n\n我们现在可以将接收到的地震数据作为消息发送给服务器：\n\
    \n```javascript\n// examples_earthquake_ui/code4.js\nquakes.bufferWithCount(100)\n\
    \    .subscribe(function(quakes) {\n        console.log(quakes);\n        var\
    \ quakesData = quakes.map(function(quake) {\n            return {\n          \
    \      id: quake.properties.net + quake.properties.code,\n                lat:\
    \ quake.geometry.coordinates[1],\n                lng: quake.geometry.coordinates[0],\n\
    \                mag: quake.properties.mag\n            };\n        });\n    \
    \    socket.onNext(JSON.stringify({quakes: quakesData}));\n    });\n```\n\n并且我们可以为来自服务器的消息设置一个订阅者：\n\
    \n```javascript\n// examples_earthquake_ui/code4.js\nsocket.subscribe(function(message)\
    \ {\n  console.log(JSON.parse(message.data));\n});\n```\n\n现在当我们重新加载浏览器时，客户端消息应该会出现在终端中：\n\
    \n```bash\n~/tweet_stream$ node index.js\nClient connected on localhost:8080\n\
    ```\n\n太棒了！浏览器在开始从远程 JSONP 资源接收地震数据后，应该立即向服务器发送命令。不过目前，服务器完全忽略了这些消息。是时候回到我们的推文流代码中对它们做些处理了。\n\
    \n首先，我们将连接到从浏览器客户端到达服务器的消息事件。每当客户端发送消息时，WebSocket 服务器就会发出一个包含消息内容的 `message` 事件。在我们的案例中，内容是一个字符串化的对象。\n\
    \n我们可以在 `onConnect` 函数中编写以下代码：\n\n```javascript\n// examples_earthquake_ui/tweet_stream/index.js\n\
    var onMessage = Rx.Observable.fromEvent(ws, 'message')\n  .subscribe(function(quake)\
    \ {\n    quake = JSON.parse(quake);\n    console.log(quake);\n  });\n```\n\n如果我们重启服务器（在终端中使用\
    \ `Ctrl-C`）并重新加载浏览器，我们应该能看到地震详情在进入终端时被打印出来。非常完美。现在我们准备好开始寻找与我们的地震相关的推文了。\n\n###\
    \ 检索和发送推文\n\n我们使用 Node.js 的 streaming Twitter 客户端 `twit` 来连接 Twitter 并搜索推文。从现在起，服务器中的所有代码都将在\n"
