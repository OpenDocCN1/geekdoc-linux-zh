- md: "## What’s in This Book\n\nThis book is a practical introduction to reactive\
    \ programming using RxJS. The objective is to get you to think reactively by building\
    \ small real-world applications, so you can learn how to introduce reactive programming\
    \ in your day-to-day programming and make your programs more robust. This is not\
    \ a theoretical book about reactive programming, and it is not an exhaustive reference\
    \ book for the RxJS API. You can find these kinds of resources online.\n\nWe’ll\
    \ be developing mostly for the browser, but we’ll see some examples in Node.js,\
    \ too. We’ll get deep into the subject early on, and we’ll build applications\
    \ along the way to keep it real. Here are the chapters:\n\nUnless you have used\
    \ RxJS before, start with *Chapter 1, The Reactive Way, on page 1*. In this chapter\
    \ we introduce Observables, the main data type of RxJS, which we’ll use extensively\
    \ throughout the book.\n\nWith the basics of Observables established, we move\
    \ on to *Chapter 2, Deep in the Sequence, on page 17*. There you see that in reactive\
    \ programming it’s all about sequences of events. We visit some important sequence\
    \ operators and build our first application, a real-time earthquake sequence visualizer.\n\
    \nIn *Chapter 3, Building Concurrent Programs, on page 39*, we look at how to\
    \ write concurrent code with minimal side effects. After covering the Observable\
    \ pipeline, we build a cool spaceship video game in about 200 lines of code and\
    \ with almost no global state.\n\nIn *Chapter 4, Building a Complete Web Application,\
    \ on page 69*, we get deeper into reactive app development and enhance the earthquake\
    \ application we made previously in *Deep in the Sequence* by making a server\
    \ part in Node.js that shows tweets related to earthquakes happening right now.\n\
    \nWe get into some more advanced concepts of RxJS with *Chapter 5, Bending Time\
    \ with Schedulers, on page 89*, where we talk about the useful concept RxJS provides\
    \ to handle concurrency at a more fine-grained level: Schedulers.\n\nWith the\
    \ knowledge of Schedulers under our hats, we explore how they help us with testing.\
    \ We’ll see how to simulate time in our tests to accurately test asynchronous\
    \ programs.\n\nFinally, in *Chapter 6, Reactive Web Applications with Cycle.js,\
    \ on page 103*, we’ll use Cycle.js, a UI framework built on top of RxJS, to build\
    \ a simple application. Cycle.js draws concepts from modern frameworks such as\
    \ React.js to create a reactive framework that uses the advantages of Observables\
    \ to help us create fast user interfaces in a simple and reliable way.\n\n## Running\
    \ the Code Examples\n\nThe code examples in this book are made for either the\
    \ browser or Node.js. The context of the code should clarify in what environment\
    \ to run the code.\n\n### Running RxJS Code in the Browser\n\nIf the code is meant\
    \ to run in the browser, we'll use the file `rx.all.js`, which you can find in\
    \ the RxJS GitHub repository.³ `rx.all.js` includes all the operators in RxJS,\
    \ and it's the easiest way to be sure all examples will work. Just load the script\
    \ in the `<head>` section of your HTML document:\n\n```html\n<html>\n  <head>\n\
    \    <script src=\"rx.all.js\"></script>\n  </head>\n  ...\n</html>\n```\n\nKeep\
    \ in mind that it is a relatively big file and you may want to consider a smaller\
    \ file, such as `rx.js` or `rx.lite.js`, for your projects if you're not using\
    \ all the functionality in RxJS.\n\n### Running RxJS Code in Node.js\n\nRunning\
    \ code examples in Node.js is easy. Just make sure you install the RxJS dependency\
    \ in your project using npm:\n\n```bash\n$ npm install rx\nrx@4.0.0 node_modules/rx\n\
    ```\n\nAfter that, you can import the RxJS library in your JavaScript files:\n\
    \n```javascript\nvar Rx = require('rx');\n\nRx.Observable.just('Hello World!').subscribe(function(value)\
    \ {\n  console.log(value);\n});\n```\n\nAnd you can run it by simply invoking\
    \ node and the name of the file:\n\n```bash\n$ node test.js\nHello World!\n```\n\
    \n> 3. https://github.com/Reactive-Extensions/RxJS/tree/master/dist\n\n## RxJS\
    \ Version\n\nAll the examples are made for RxJS 4.x. You can download the latest\
    \ version in the RxJS online repository.⁴\n\n## Resources\n\nRxJS is gaining adoption\
    \ very quickly, and there are more and more resources about it every day. At times\
    \ it might be hard to find resources about it online, though. These are my favorite\
    \ ones:\n\n- RxJS official source code repository⁵\n- ReactiveX, a collection\
    \ of resources related to the Reactive Extensions⁶\n- RxMarbles, an interactive\
    \ tool to visualize Observables⁷\n\n## Download Sample Code\n\nThis book's website\
    \ has links to an interactive discussion forum as well as a place to submit errata.⁸\
    \ You'll also find the source code for all the projects we build. Readers of the\
    \ ebook can interact with the box above each code snippet to view that snippet\
    \ directly.\n\n> 4. https://github.com/Reactive-Extensions/RxJS/releases/latest\n\
    > 5. https://github.com/Reactive-Extensions/RxJS\n> 6. http://reactivex.io\n>\
    \ 7. http://rxmarbles.com/\n> 8. http://pragprog.com/titles/smreactjs\n\n# CHAPTER\
    \ 1: The Reactive Way\n\nThe real world is pretty messy: events happen in random\
    \ order, applications crash, and networks fail. Few applications are completely\
    \ synchronous, and writing asynchronous code is necessary to keep applications\
    \ responsive. Most of the time it's downright painful, but it really doesn't have\
    \ to be.\n\nModern applications need super-fast responses and the ability to process\
    \ data from different sources at the same time without missing a beat. Current\
    \ techniques won't get us there because they don't scale—code becomes exponentially\
    \ more complex as we add concurrency and application state. They get the job done\
    \ only at the expense of a considerable mental load on the developer, and that\
    \ leads to bugs and complexity in our code.\n\nThis chapter introduces you to\
    \ reactive programming, a natural, easier way to think about asynchronous code.\
    \ I'll show you how streams of events—which we call *Observables*—are a beautiful\
    \ way to handle asynchronous code. Then we'll create an Observable and see how\
    \ reactive thinking and RxJS dramatically improve on existing techniques and make\
    \ you a happier, more productive programmer.\n\n### What's Reactive?\n\nLet's\
    \ start by looking at a little reactive RxJS program. This program needs to retrieve\
    \ data from different sources with the click of a button, and it has the following\
    \ requirements:\n\n- It must unify data from two different locations that use\
    \ different JSON structures.\n- The final result should not contain any duplicates.\n\
    - To avoid requesting data too many times, the user should not be able to click\
    \ the button more than once per second.\n\nUsing RxJS, we would write something\
    \ like this:\n\n```javascript\nvar button = document.getElementById('retrieveDataBtn');\n\
    var source1 = Rx.DOM.getJSON('/resource1').pluck('name');\nvar source2 = Rx.DOM.getJSON('/resource2').pluck('props',\
    \ 'name');\n\nfunction getResults(amount) {\n    return source1.merge(source2)\n\
    \        .pluck('names')\n        .flatMap(function(array) { return Rx.Observable.from(array);\
    \ })\n        .distinct()\n        .take(amount);\n}\n\nvar clicks = Rx.Observable.fromEvent(button,\
    \ 'click');\nclicks.debounce(1000)\n    .flatMap(getResults(5))\n    .subscribe({\n\
    \        next: function(value) { console.log('Received value', value); },\n  \
    \      error: function(err) { console.error(err); },\n        complete: function()\
    \ { console.log('All values retrieved!'); }\n    });\n```\n\nDon't worry about\
    \ understanding what's going on here: let's focus on the 10,000-foot view for\
    \ now. The first thing you see is that we express more with fewer lines of code.\
    \ We accomplish this by using Observables.\n\nAn Observable represents a stream\
    \ of data. Programs can be expressed largely as streams of data. In the preceding\
    \ example, both remote sources are Observables, and so are the mouse clicks from\
    \ the user. In fact, our program is essentially a single Observable made from\
    \ a button's click event that we transform to get the results we want.\n\nReactive\
    \ programming is expressive. Take, for instance, throttling mouse clicks in our\
    \ example. Imagine how complex it would be to do that using callbacks or promises:\
    \ we'd need to reset a timer every second and keep state of whether a second has\
    \ passed since the last time the user clicked the button. It's a lot of complexity\
    \ for so little functionality, and the code for it is not even related to your\
    \ program's actual functionality. In bigger applications, these little complexities\
    \ add up very quickly to make for a tangled code base.\n\nWith the reactive approach,\
    \ we use the method `debounce` to throttle the stream of clicks. This ensures\
    \ that there is at least a second between each click, and discards any clicks\
    \ in between. We don't care how this happens internally; we just express *what*\
    \ we want our code to do, not *how* to do it.\n\nIt gets much more interesting.\
    \ Next you'll see how reactive programming can help us make our programs more\
    \ efficient and expressive."
  mdcn: "\n## 本书内容\n\n本书是一本关于使用 RxJS 进行响应式编程（reactive programming）的实用入门指南。其目标是通过构建小型真实应用，引导你形成响应式思维，从而学习如何将响应式编程引入日常开发中，使程序更加健壮。这不是一本关于响应式编程的理论书，也不是\
    \ RxJS API 的详尽参考手册。你可以在网上找到这类资源。\n\n我们将主要针对浏览器进行开发，但也会看到一些 Node.js 的示例。我们会尽早深入探讨主题，并在过程中构建应用程序以保持实用性。以下是各章节安排：\n\
    \n除非你之前使用过 RxJS，否则请从 *第 1 章：响应式方式（第 1 页）* 开始。在本章中，我们将介绍 RxJS 的主要数据类型 —— Observable，我们在全书中将广泛使用它。\n\
    \n在建立了 Observable 的基础知识后，我们将进入 *第 2 章：深入序列（第 17 页）*。在那里你会发现，响应式编程的核心在于事件序列。我们将学习一些重要的序列操作符，并构建我们的第一个应用程序：一个实时地震序列可视化工具。\n\
    \n在 *第 3 章：构建并发程序（第 39 页）* 中，我们将研究如何编写副作用最小的并发代码。在涵盖 Observable 流水线后，我们将用大约 200\
    \ 行代码构建一个酷炫的太空飞船视频游戏，且几乎没有全局状态。\n\n在 *第 4 章：构建完整的 Web 应用程序（第 69 页）* 中，我们将深入探讨响应式应用开发，并通过在\
    \ Node.js 中创建一个显示当前地震相关推文的服务器端，来增强我们在 *深入序列* 中制作的地震应用程序。\n\n我们将通过 *第 5 章：使用调度器操纵时间（第\
    \ 89 页）* 接触 RxJS 的一些更高级概念，讨论 RxJS 提供的用于在更细粒度层面处理并发的有用概念：调度器（Schedulers）。\n\n在掌握了调度器知识后，我们将探索它们如何帮助我们进行测试。我们将学习如何在测试中模拟时间，以准确地测试异步程序。\n\
    \n最后，在 *第 6 章：使用 Cycle.js 构建响应式 Web 应用（第 103 页）* 中，我们将使用 Cycle.js（一个构建在 RxJS 之上的\
    \ UI 框架）来构建一个简单的应用程序。Cycle.js 从 React.js 等现代框架中借鉴概念，创建了一个响应式框架，利用 Observable 的优势，帮助我们以简单且可靠的方式创建快速的用户界面。\n\
    \n## 运行代码示例\n\n本书中的代码示例适用于浏览器或 Node.js。代码的上下文应该能明确在什么环境下运行。\n\n### 在浏览器中运行 RxJS\
    \ 代码\n\n如果代码旨在浏览器中运行，我们将使用 `rx.all.js` 文件，你可以在 RxJS 的 GitHub 仓库中找到它。³ `rx.all.js`\
    \ 包含了 RxJS 中的所有操作符，这是确保所有示例都能运行的最简单方法。只需在 HTML 文档的 `<head>` 部分加载该脚本：\n\n```html\n\
    <html>\n  <head>\n    <script src=\"rx.all.js\"></script>\n  </head>\n  ...\n\
    </html>\n```\n\n请记住，这是一个相对较大的文件。如果在项目中没有用到 RxJS 的所有功能，你可能需要考虑使用较小的文件，如 `rx.js`\
    \ 或 `rx.lite.js`。\n\n### 在 Node.js 中运行 RxJS 代码\n\n在 Node.js 中运行代码示例非常简单。只需确保使用\
    \ npm 在项目中安装 RxJS 依赖：\n\n```bash\n$ npm install rx\nrx@4.0.0 node_modules/rx\n\
    ```\n\n之后，你可以在 JavaScript 文件中导入 RxJS 库：\n\n```javascript\nvar Rx = require('rx');\n\
    \nRx.Observable.just('Hello World!').subscribe(function(value) {\n  console.log(value);\n\
    });\n```\n\n然后通过调用 node 和文件名即可运行：\n\n```bash\n$ node test.js\nHello World!\n```\n\
    \n> 3. https://github.com/Reactive-Extensions/RxJS/tree/master/dist\n\n## RxJS\
    \ 版本\n\n所有示例均基于 RxJS 4.x。你可以在 RxJS 在线仓库中下载最新版本。⁴\n\n## 相关资源\n\nRxJS 的采用速度非常快，每天都有越来越多的相关资源出现。不过，有时在网上寻找资源可能会有困难。以下是我最喜欢的几个：\n\
    \n- [RxJS 官方源代码仓库]⁵\n- [ReactiveX，一个与 Reactive Extensions 相关的资源集合]⁶\n- [RxMarbles，一个可视化\
    \ Observable 的交互式工具]⁷\n\n## 下载示例代码\n\n本书的网站提供了指向交互式讨论论坛以及提交勘误页的链接。⁸ 你还可以在那里找到我们构建的所有项目的源代码。电子书读者可以通过每个代码片段上方的方框直接查看该片段。\n\
    \n> 4. https://github.com/Reactive-Extensions/RxJS/releases/latest\n> 5. https://github.com/Reactive-Extensions/RxJS\n\
    > 6. http://reactivex.io\n> 7. http://rxmarbles.com/\n> 8. http://pragprog.com/titles/smreactjs\n\
    \n# 第一章：响应式方式\n\n现实世界相当混乱：事件以随机顺序发生，应用程序崩溃，网络失效。很少有应用程序是完全同步的，编写异步代码对于保持应用程序的响应能力至关重要。大多数时候，这极其痛苦，但其实不必如此。\n\
    \n现代应用程序需要极快的响应速度，并且能够同时处理来自不同来源的数据而不会漏掉任何细节。当前的技术无法让我们达到这个目标，因为它们无法扩展——随着并发和应用状态的增加，代码的复杂度呈指数级增长。它们只能以增加开发者的心理负担为代价来完成工作，而这会导致代码中的\
    \ Bug 和复杂性。\n\n本章将向你介绍响应式编程，一种更自然、更简单地思考异步代码的方式。我将向你展示事件流（我们称之为 *Observables*）是如何优雅地处理异步代码的。然后我们将创建一个\
    \ Observable，看看响应式思维和 RxJS 如何显著改进现有技术，使你成为一名更快乐、更高效的程序员。\n\n### 什么是响应式？\n\n让我们先来看一个简单的响应式\
    \ RxJS 程序。该程序需要通过点击按钮从不同来源检索数据，并具有以下要求：\n\n- 必须统一来自两个不同位置且使用不同 JSON 结构的数据。\n-\
    \ 最终结果不应包含任何重复项。\n- 为了避免请求次数过多，用户每秒钟不能点击按钮超过一次。\n\n使用 RxJS，我们会这样写：\n\n```javascript\n\
    var button = document.getElementById('retrieveDataBtn');\nvar source1 = Rx.DOM.getJSON('/resource1').pluck('name');\n\
    var source2 = Rx.DOM.getJSON('/resource2').pluck('props', 'name');\n\nfunction\
    \ getResults(amount) {\n    return source1.merge(source2)\n        .pluck('names')\n\
    \        .flatMap(function(array) { return Rx.Observable.from(array); })\n   \
    \     .distinct()\n        .take(amount);\n}\n\nvar clicks = Rx.Observable.fromEvent(button,\
    \ 'click');\nclicks.debounce(1000)\n    .flatMap(getResults(5))\n    .subscribe({\n\
    \        next: function(value) { console.log('Received value', value); },\n  \
    \      error: function(err) { console.error(err); },\n        complete: function()\
    \ { console.log('All values retrieved!'); }\n    });\n```\n\n不必担心现在就理解这里发生了什么：我们先关注宏观视角。你首先会发现，我们用更少的代码表达了更多的内容。我们是通过使用\
    \ Observables 来实现这一点的。\n\n一个 Observable 代表一个数据流。程序在很大程度上可以被表达为数据流。在上面的示例中，两个远程数据源都是\
    \ Observables，用户的鼠标点击同样如此。事实上，我们的程序本质上是由按钮点击事件构成的一个单一 Observable，我们对其进行转换以获得想要的结果。\n\
    \n响应式编程具有很强的表达力。以示例中对鼠标点击的节流（throttling）为例。想象一下如果使用回调函数或 Promise 来实现会有多复杂：我们需要每秒重置一个定时器，并记录自上次点击以来是否已经过去了一秒。为了这么一点功能而引入如此多的复杂度，而且这段代码甚至与程序的实际功能无关。在大型应用程序中，这些细小的复杂性会迅速累积，导致代码库变得混乱不堪。\n\
    \n在响应式方法中，我们使用 `debounce` 方法来节流点击流。这确保了每次点击之间至少间隔一秒，并丢弃中间的任何点击。我们不关心内部是如何实现的；我们只表达代码*要做什么*，而不是*如何做*。\n\
    \n接下来的内容会更有趣。接下来你将看到响应式编程如何帮助我们让程序变得更高效、更具表达力。\n"
