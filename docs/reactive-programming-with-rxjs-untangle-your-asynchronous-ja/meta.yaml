  md: "# Joe asks:\n# What Is JSONP?\n\nJSONP—or *JSON with padding*—is a sneaky technique\
    \ that web developers came up with to work around the browser restrictions when\
    \ requesting data from third-party domains.<sup>a</sup>\n\nIt bypasses these restrictions\
    \ by loading external content using `script` tags instead of the usual `XMLHttpRequest`.\
    \ Adding a script tag to the DOM loads and executes its content directly, and\
    \ the security restrictions are not applied.\n\nThe remote request's content is\
    \ then normal JSON wrapped in a function call (the *P* in JSONP). It looks like\
    \ this:\n\n```\n```javascript\ncallbackFn({a: 1, b: 2, c: 3})\n```\n```\n\nJSONP\
    \ URLs usually accept a query string parameter so that the caller can specify\
    \ the name of the callback. The developer then has to define a function in her\
    \ code that has the same name as the callback in the server response, and when\
    \ the script tag is added to the document, that function will be called with the\
    \ JSON data as the first parameter.\n\nLibraries like jQuery automate this process\
    \ by internally creating the global function to handle the JSONP call, and tidying\
    \ up afterward to avoid polluting the global namespace.\n\n> a. [http://en.wikipedia.org/wiki/Same-origin_policy](http://en.wikipedia.org/wiki/Same-origin_policy)\n\
    \nThis is a perfect situation for `flatMap`. We'll retrieve the data and make\
    \ an Observable out of the features array using `Rx.Observable.from`. Then we'll\
    \ merge that Observable back in the main Observable:\n\n```\n```javascript\n//\
    \ examples_earthquake/code1.js\nvar quakes = Rx.Observable.create(function(observer)\
    \ {\n    window.eqfeed_callback = function(response) {\n        observer.onNext(response);\n\
    \        observer.onCompleted();\n    };\n});\n\nloadJSONP(QUAKE_URL);\n}).flatMap(function\
    \ transform(dataset) {\n    return Rx.Observable.from(dataset.response.features);\n\
    });\n\nquakes.subscribe(function(quake) {\n    var coords = quake.geometry.coordinates;\n\
    \    var size = quake.properties.mag * 10000;\n    L.circle([coords[1], coords[0]],\
    \ size).addTo(map);\n});\n```\n```"
  merge: -1
  pgno: 50
- img_proc: true
  md: "We're not manually managing the flow anymore. There are no loops or conditionals\
    \ to extract the individual earthquake objects and pass them around. Here's what's\
    \ happening:\n\n+   1. `onNext` only happens once this time, and it yields the\
    \ whole JSON response.\n2. Since we'll only yield one time, we signal completion\
    \ after `onNext`.\n3. We're chaining the `flatMap` call to the result of create,\
    \ so `flatMap` will take each result from the Observable (in this case only one),\
    \ use it as a parameter for the transform function, and merge the Observable resulting\
    \ from that function into the source Observable.\n4. Here we take the features\
    \ array containing all the earthquakes and create an Observable from it. Because\
    \ of `flatMap`, this will become the actual Observable that the quakes variable\
    \ will contain.\n5. Subscribe doesn't change at all; it keeps dealing with a stream\
    \ of earthquakes just like before.\n\n# There Is Always a Method\n\nSo far we've\
    \ used RxJS operators included in `rx.all.js`, but it's usually worth checking\
    \ out operators that come with other RxJS-based libraries. In our case, we'll\
    \ look at RxJS-DOM. RxJS-DOM is an external library that, among others, contains\
    \ an operator to handle JSONP requests: `jsonpRequest`. That saves us some code\
    \ and keeps us from using nasty global functions:\n\n```\n```javascript\nexamples_earthquake/code1_2.js\n\
    var quakes = Rx.DOM.jsonpRequest({\n    url: QUAKE_URL,\n    jsonpCallback: 'eqfeed_callback'\n\
    })\n.flatMap(function(result) {\n    return Rx.Observable.from(result.response.features);\n\
    })\n.map(function(quake) {\n    return {\n        lat: quake.geometry.coordinates[1],\n\
    \        lng: quake.geometry.coordinates[0],\n        size: quake.properties.mag\
    \ * 10000\n    };\n});\nquakes.subscribe(function(quake) {\n    L.circle([quake.lat,\
    \ quake.lng], quake.size).addTo(map);\n});\n```\n```\n\n+   3. [https://github.com/Reactive-Extensions/RxJS-DOM](https://github.com/Reactive-Extensions/RxJS-DOM)"
  merge: -1
  pgno: 51
- img_proc: true
  md: "Keep in mind that for this code to run, you need to include the file `rx.dom.js`\
    \ from RxJS-DOM in the HTML. Notice how we've added a map operator that transforms\
    \ the earthquake objects into simple objects containing only the information we\
    \ need for our visualization: latitude, longitude, and magnitude of the earthquake.\
    \ The less functionality we put in the subscribe operator, the better.\n\n# Making\
    \ It Real Time\n\nOur reactive version of the earthquake application doesn't update\
    \ the map of earthquakes in real time. To implement that, we'll use the `interval`\
    \ operator—which we saw earlier in this chapter—and the `uber-distinct` operator.\
    \ Let me show you the code and then we'll go through the changes:\n\n```\n```javascript\n\
    examples_earthquake/code1_3.js\nvar quakes = Rx.Observable\n  .interval(5000)\n\
    \  .flatMap(function() {\n    return Rx.DOM.jsonpRequest({\n      url: QUAKE_URL,\n\
    \      jsonpCallback: 'eqfeed_callback'\n    });\n  })\n  .retry(3);\n  })\n \
    \ .flatMap(function(result) {\n    return Rx.Observable.from(result.response.features);\n\
    \  })\n  .distinct(function(quake) { return quake.properties.code; });\n\nquakes.subscribe(function(quake)\
    \ {\n  var coords = quake.geometry.coordinates;\n  var size = quake.properties.mag\
    \ * 10000;\n\n  L.circle([coords[1], coords[0]], size).addTo(map);\n});\n```\n\
    ```\n\nIn the preceding code, we abuse `interval` to make new requests and process\
    \ them at regular intervals of five seconds. `interval` creates an Observable\
    \ that emits an incrementing number every five seconds. We don't do anything with\
    \ those numbers; instead, we use `flatMap` to retrieve the data of the `jsonpRequest`.\
    \ Notice also how we use `retry` to try again in case there are problems retrieving\
    \ the list at first.\n\nThe last operator we apply is `distinct`, which emits\
    \ only elements that haven't been emitted before. It takes a function that returns\
    \ the property to check for equality. This way we never redraw earthquakes that\
    \ are already drawn."
