    \ main game loop as if it were just another Observable, and we can push values\
    \ to it whenever we want."
  - "[PAGE 84]\n\n```\n```javascript\nspaceship_reactive/score.js\nvar ScoreSubject\
    \ = new Rx.Subject();\nvar score = ScoreSubject.scan(function (prev, cur) {\n\
    \    return prev + prev + cur;\n}, 0).concat(Rx.Observable.return(0));\n```\n\
    ```\n\nIn that code we use our friend the scan operator to sum each new value\
    \ to the total aggregate result. Since we won't have any score when a game starts,\
    \ we concatenate an Observable that returns 0 so we have a starting point.\n\n\
    Now we just have to push score to our Subject whenever we hit an enemy: that happens\
    \ in paintHeroShots:\n\n```\n```javascript\nspaceship_reactive/score.js\nvar SCORE_INCREASE\
    \ = 10;\nfunction paintHeroShots(heroShots, enemies) {\n    heroShots.forEach(function(shot,\
    \ i) {\n        for (var l0= 0; l.enemies.length; l++) {\n            var enemy\
    \ = enemies[l];\n            if (!enemy.isDead && collision(shot, enemy)) {\n\
    \                ScoreSubject.onNext(SCORE_INCREASE);\n                enemy.isDead\
    \ = true;\n                shot.x = shot.y = -100;\n                break;\n \
    \           }\n        }\n        shot.y -= SHOOTING_SPEED;\n        drawTriangle(shot.x,\
    \ shot.y, 5, '#ffff00', 'up');\n    });\n}\n```\n```\n\nAnd of course, we add\
