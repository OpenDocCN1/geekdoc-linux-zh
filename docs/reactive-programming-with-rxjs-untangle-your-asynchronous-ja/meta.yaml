- img_proc: true
  md: "With this in place everybody is now shooting everybody else, but nobody is\
    \ being destroyed! They simply glide past the enemies and our spaceship because\
    \ we haven't defined what happens when shots collide with spaceships.\n\n# ###\
    \ Managing Collisions\n\nWhen a shot hits an enemy, we want both the shot and\
    \ the enemy to disappear. Let's define a helper function to detect whether two\
    \ targets have collided:\n\n```\n```javascript\n// spaceship_reactive/enemy_shots2.js\n\
    function collision(target1, target2) {\n    return (target1.x > target2.x - 20\
    \ && target1.x < target2.x + 20) &&\n           (target1.y > target2.y - 20 &&\
    \ target1.y < target2.y + 20);\n}\n```\n```\n\nNow let's modify the helper function\
    \ paintHeroShots to check whether each shot hits an enemy. For cases where a hit\
    \ occurs, we'll set a property isDead to true on the enemy that has been hit,\
    \ and we'll set the coordinates of the shot to outside the screen. The shot will\
    \ eventually be filtered out because it's outside the screen.\n\n```\n```javascript\n\
    // spaceship_reactive/enemy_shots2.js\nfunction paintEnemies(enemies) {\n    enemies.forEach(function(enemy)\
    \ {\n        enemy.y += 5;\n        enemy.x += getRandomInt(-15, 15);\n\n    \
    \    if (!enemy.isDead) {\n            drawTriangle(enemy.x, enemy.y, 20, '#00ff00',\
    \ 'down');\n        }\n\n        enemy.shots.forEach(function(shot) {\n      \
    \      shot.y += SHOOTING_SPEED;\n            drawTriangle(shot.x, shot.y, 5,\
    \ '#00ffff', 'down');\n        });\n    });\n}\n\nvar SHOOTING_SPEED = 15;\nfunction\
    \ paintHeroShots(heroShots, enemies) {\n    heroShots.forEach(function(shot, i)\
    \ {\n        for (var l=0; l<enemies.length; l++) {\n            var enemy = enemies[l];\n\
    \            if (!enemy.isDead && collision(shot, enemy)) {\n                enemy.isDead\
    \ = true;\n                shot.x = shot.y = -100;\n                break;\n \
    \           }\n        }\n    });\n}\n```\n```"
  merge: -1
  pgno: 81
- img_proc: true
  md: "```\n```javascript\nshot.y -= SHOOTING_SPEED;\ndrawTriangle(shot.x, shot.y,\
    \ 5, '#ffff00', 'up');\n}));\n}\n```\n```\n\nNext let’s get rid of any enemies\
    \ that have the property `isDead` set to true. The only caveat is that we need\
    \ to wait for all the shots from that particular enemy to disappear; otherwise,\
    \ when we hit an enemy all its shots disappear along with it, which would be weird.\
    \ So we should check for the length of its shots and filter out the enemy object\
    \ only when it has no shots left:\n\n```\n```javascript\n// spaceship_reactive/enemy_shots2.js\n\
    var Enemies = Rx.Observable.interval(ENEMY_FREQ)\n    .scan(function(enemyArray)\
    \ {\n        var enemy = {\n            x: parseInt(Math.random() * canvas.width),\n\
    \            y: -30,\n            shots: []\n        };\n\n        Rx.Observable.interval(ENEMY_SHOOTING_FREQ).subscribe(function()\
    \ {\n            if (!enemy.isDead) {\n                enemy.shots.push({ x: enemy.x,\
    \ y: enemy.y });\n            }\n            enemy.shots = enemy.shots.filter(isVisible);\n\
    \        });\n\n        enemyArray.push(enemy);\n        return enemyArray\n \
    \           .filter(isVisible)\n            .filter(function(enemy) {\n      \
    \          return !(enemy.isDead && enemy.shots.length === 0);\n            });\n\
    \    }, []);\n```\n```\n\nTo check if the player’s ship has been hit, we create\
    \ a function `gameOver`:\n\n```\n```javascript\n// spaceship_reactive/enemy_shots2.js\n\
    function gameOver(ship, enemies) {\n    return enemies.some(function(enemy) {\n\
    \        if (collision(ship, enemy)) {\n            return true;\n        }\n\n\
    \        return enemy.shots.some(function(shot) {\n            return collision(ship,\
    \ shot);\n        });\n    });\n}\n```\n```"
