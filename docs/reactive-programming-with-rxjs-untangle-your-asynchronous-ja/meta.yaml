  - "[PAGE 107]\n\n```\n```javascript\nvar arr = [];\nfor (var i=0; i<1000; i++) {\n\
    \    arr.push(i);\n}\n```\n```\n\nThen, we create an Observable from `arr` and\
    \ force it to emit all the notifications by subscribing to it. In the code we\
    \ also measure the amount of time it takes to emit all the notifications:\n\n\
    ```\n```javascript\nvar timeStart = Date.now();\nRx.Observable.from(arr).subscribe({\n\
    \    function onNext() { },\n    function onError() { },\n    function onCompleted()\
    \ {\n        console.log('Total time: ' + (Date.now() - timeStart) + 'ms');\n\
    \    }\n});\n```\n```\n\n< \"Total time: 6ms\"\n\nSix milliseconds—not bad! front\
    \ uses `Rx.Scheduler.currentThread` internally, which schedules work to run after\
    \ any current work is finished. Once it starts, it processes all the notifications\
    \ synchronously.\n\nNow let's change the Scheduler to `Rx.Scheduler.default`.\n\
    \n```\n```javascript\nvar timeStart = Date.now();\nRx.Observable.from(arr, null,\
    \ null, Rx.Scheduler.default).subscribe({\n    function onNext() { },\n    function\
    \ onError() { },\n    function onCompleted() {\n        console.log('Total time:\
    \ ' + (Date.now() - timeStart) + 'ms');\n    }\n});\n```\n```\n\n< \"Total time:\
    \ 5337ms\"\n\nWow, our code runs almost a thousand times slower than with the\
    \ `currentThread` Scheduler. That's because the default Scheduler runs each notification\
    \ asynchronously. We can verify this by adding a simple log statement after the\
    \ subscription.\n\nUsing the currentThread Scheduler:\n\n```\n```javascript\n\
    Rx.Observable.from(arr).subscribe( ... );\nconsole.log('Hi there!');\n```\n```\n\
    \n< \"Total time: 8ms\"\n\"Hi there!\"\n\nUsing the default Scheduler:\n\n```\n\
    ```javascript\nRx.Observable.from(arr, null, null, Rx.Scheduler.timeout).subscribe(\
    \ ... );\nconsole.log('Hi there!');\n```\n```"
  - "[PAGE 108]\n\n\"Hi there!\"\n\"Total time: 5423ms\"\n\nBecause the Observer using\
    \ the `default` Scheduler emits its items asynchronously, our `console.log` statement\
    \ (which is synchronous) is executed before the Observable even starts emitting\
    \ any notification. Using the `currentThread` Scheduler, all notifications happen\
    \ synchronously, so the `console.log` statement gets executed only when the Observable\
    \ has emitted all its notifications.\n\nSo, Schedulers really can change how our\
    \ Observables work. In our case here, performance really suffered from asynchronously\
    \ processing a big, already-available array. But we can actually use Schedulers\
    \ to improve performance. For example, we can switch the Scheduler on the fly\
    \ before doing expensive operations on an Observable:\n\n```\n```javascript\n\
    arr\n  .groupBy(function(value) {\n    return value % 2 === 0;\n  })\n  .map(function(value)\
    \ {\n    return value.observeOn(Rx.Scheduler.default);\n  })\n  .map(function(groupedObservable)\
    \ {\n    return expensiveOperation(groupedObservable);\n  });\n```\n```\n\nIn\
    \ the preceding code we group all the values in the array into two groups: even\
    \ and uneven values. `groupBy` returns an Observable that emits an Observable\
    \ for each group created. And here's the cool part: just before running an expensive\
    \ operation on the items in each grouped Observable, we use `observeOn` to switch\
    \ the Scheduler to the default one, so that the expensive operation will be executed\
    \ asynchronously, not blocking the event loop.\n\n# observeOn and subscribeOn\n\
    \nIn the previous section, we used the `observeOn` operator to change the Scheduler\
    \ in some Observables. `observeOn` and `subscribeOn` are instance operators that\
    \ return a copy of the Observable instance, but that use the Scheduler we pass\
    \ as a parameter.\n\n`observeOn` takes a Scheduler and returns a new Observable\
    \ that uses that Scheduler. It will make every `onNext` call run in the new Scheduler.\n\
    \n`subscribeOn` forces the subscription and an un-subscription work (not the notifications)\
    \ of an Observable to run on a particular Scheduler. Like `observeOn`, it accepts\
    \ a Scheduler as a parameter. `subscribeOn` is useful when, for example,"
  - "[PAGE 109]\n\nwe're running in the browser and doing significant work in the\
    \ subscribe call but we don't want to block the UI thread with it.\n\n# Basic\
    \ Rx Schedulers\n\nLet's look a bit more in depth at the Schedulers we just used.\
    \ The ones RxJS's operators use most are `immediate`, `default`, and `currentThread`.\n\
    \n# Immediate Scheduler\n\nThe immediate Scheduler emits notifications from the\
    \ Observable synchronously, so whenever an action is scheduled on the immediate\
    \ Scheduler, it will be executed right away, blocking the thread. `Rx.Observable.range`\
    \ is one of the operators that uses the immediate Scheduler internally:\n\n```\n\
    ```javascript\nconsole.log('Before subscription');\n\nRx.Observable.range(1, 5)\n\
    \  .do(function(a) {\n    console.log('Processing value', a);\n  })\n  .map(function(value)\
    \ { return value * value; })\n  .subscribe(function(value) { console.log('Emitted',\
    \ value); });\n\nconsole.log('After subscription');\n```\n```\n\n> Before subscription\n\
    Processing value 1\nEmitted 1\nProcessing value 2\nEmitted 4\nProcessing value\
    \ 3\nEmitted 9\nProcessing value 4\nEmitted 16\nProcessing value 5\nEmitted 25\n\
    After subscription\n\nThe program output happens in the order we expect. Each\
    \ `console.log` statement runs before the notification of the current item.\n\n\
    # When to Use It\n\nThe immediate Scheduler is very well suited for Observables\
    \ that execute predictable and not-very-expensive operations in each notification.\
    \ Also, the Observable has to eventually call `onCompleted`."
  - "[PAGE 110]\n\n# Default Scheduler\n\nThe default Scheduler runs actions asynchronously.\
    \ You can think of it as a rough equivalent of setTimeout with zero milliseconds\
    \ delay that keeps the order in the sequence. It uses the most efficient asynchronous\
    \ implementation available on the platform it runs from (for example, process.nextTick\
    \ in Node.js or setTimeout in the browser).\n\nLet’s take the previous example\
    \ with range and make it run on the default Scheduler. For this, we’ll use the\
    \ observeOn operator:\n\n```\nconsole.log('Before subscription');\nRx.Observable.range(1,\
    \ 5)\n  .do(function(value) {\n    console.log('Processing value', value);\n \
    \ })\n  .observeOn(Rx.Scheduler.default)\n  .map(function(value) { return value\
    \ * value; })\n  .subscribe(function(value) { console.log('Emitted', value); });\n\
    console.log('After subscription');\n```\n\n```\nBefore subscription\nProcessing\
    \ value 1\nProcessing value 2\nProcessing value 3\nProcessing value 4\nProcessing\
    \ value 5\nAfter subscription\nEmitted 1\nEmitted 4\nEmitted 9\nEmitted 16\nEmitted\
    \ 25\n```\n\nThere are significant differences in this output. Our synchronous\
    \ console.log statement runs immediately for every value, but we make the Observable\
    \ run on the default Scheduler, which yields each value asynchronously. That means\
    \ our log statements in the do operator are processed before the squared values.\n\
    \n# When to Use It\n\nThe default Scheduler never blocks the event loop, so it’s\
    \ ideal for operations that involve time, like asynchronous requests. It can also\
    \ be used in Observables that never complete, because it doesn’t block the program\
    \ while waiting for new notifications (which may happen never).\n\n# Current Thread\
    \ Scheduler\n\nThe currentThread Scheduler is synchronous like the immediate Scheduler,\
    \ but in case we use recursive operators, it enqueues the actions to execute instead"
  - "[PAGE 111]\n\nof executing them right away. A recursive operator is an operator\
    \ that itself schedules another operator. A good example is `repeat`. The repeat\
    \ operator—if given no parameters—keeps repeating the previous Observable sequence\
    \ in the chain indefinitely.\n\nYou’ll get in trouble if you call `repeat` on\
    \ an operator that uses the immediate Scheduler (such as return). Let’s try this\
    \ by repeating the value 10 and then use `take` to take only the first value of\
    \ the repetition. Ideally, the code would print 10 once and then exit:\n\n```\n\
    // Be careful: the code below will freeze your environment!\nRx.Observable.return(10).repeat().take(1)\n\
    \  .subscribe(function(value) {\n    console.log(value);\n  });\n```\n\nError:\
    \ Too much recursion\n\nThis code causes an infinite loop. Upon subscription,\
    \ `return` calls onNext(10) and then onCompleted, which makes repeat subscribe\
    \ again to return. Since return is running on the immediate Scheduler, this process\
    \ repeats itself, causing an infinite loop and never getting to take.\n\nBut if\
    \ instead we schedule return on the currentThread Scheduler by passing it as the\
    \ second parameter, we get this:\n\n```\nvar scheduler = Rx.Scheduler.currentThread;\n\
    Rx.Observable.return(10, scheduler).repeat().take(1)\n  .subscribe(function(value)\
    \ {\n    console.log(value);\n  });\n```\n\n10\n\nNow, when repeat resubscribes\
    \ to return, the new onNext call will be queued because the previous onCompleted\
    \ is still happening. repeat then returns a disposable object to take, which calls\
    \ onCompleted and cancels the repetition by disposing repeat, and ultimately the\
    \ call from subscribe returns.\n\nAs a rule of thumb, currentThread should be\
    \ used to iterate on large sequences and when using recursive operators such as\
    \ repeat.\n\n# When to Use It\n\nThe currentThread Scheduler is useful for operations\
    \ that involve recursive operators like repeat, and in general for iterations\
    \ that contain nested operators."
- md: "## Scheduling for Animations\n\nFor fast visual updates such as canvas or DOM\
    \ animations, we can either use the interval operator with a very low millisecond\
    \ value or we can make a Scheduler that uses a function like setTimeout internally\
    \ to schedule notifications.\n\nBut neither approach is ideal. In both of them\
    \ we're throwing all these updates at the browser, which may not be able to process\
    \ them quickly enough. That happens because the browser is trying to render a\
    \ frame and then it receives instructions to render the next one, so it drops\
    \ the current frame to keep up the speed. The results are choppy animations. And\
    \ we have enough of those on the web.\n\nBrowsers have a native way to handle\
    \ animations, and they provide an API to use it called requestAnimationFrame.\
    \ requestAnimationFrame allows the browser to optimize performance by lining up\
    \ animations at the most appropriate time and helping us achieve smoother animations.\n\
    \n## There's a Scheduler for That\n\nThe RxDOM library comes with some extra Schedulers,\
    \ one of which is the requestAnimationFrame Scheduler.\n\nYes, you guessed it.\
    \ We can use this Scheduler to improve our spaceship video game. In it, we established\
    \ a refresh speed of 40ms—roughly 25 frames per second—by creating an interval\
    \ Observable at that speed and then using combineLatest to update the whole game\
    \ scene at the speed set by interval (because it is the fastest-updating Observable)\
    \ ... but who knows how many frames the browser is dropping by using this technique!\
    \ We would get much better performance by using requestAnimationFrame.\n\nLet's\
    \ create an Observable that uses Rx.Scheduler.requestAnimationFrame as its Scheduler.\
    \ Notice that it works similarly to how the interval operator works:\n\n```javascript\n\
    // ch_schedulers/starfield_ra.js\nfunction animationLoop(scheduler) {\n    return\
    \ Rx.Observable.generate(\n        0,\n        function() { return true; }, //\
    \ Keep generating forever\n        function(x) { return x + 1; }, // Increment\
    \ internal value\n        function(x) { return x; }, // Value to return on each\
    \ notification\n        Rx.Scheduler.requestAnimationFrame); // Schedule to requestAnimationFrame\n\
    \    )\n}\n```\n\nNow, wherever we were using interval to animate graphics at\
    \ 25 FPS, we can just use our animationLoop function. So our Observable to paint\
    \ stars, which looked like this before:\n\n```javascript\n// spaceship_reactive/spaceship.js\n\
    var StarStream = Rx.Observable.range(1, 250)\n  .map(function() {\n    return\
    \ {\n      x: parseInt(Math.random() * canvas.width),\n      y: parseInt(Math.random()\
    \ * canvas.height),\n      size: Math.random() * 3 + 1\n    };\n  })\n  .toArray()\n\
    \  .flatMap(function(arr) {\n    return Rx.Observable.interval(SPEED).map(function()\
    \ {\n      return arr.map(function(star) {\n        if (star.y >= canvas.height)\
    \ {\n          star.y = 0;\n        }\n        star.y += 3;\n        return star;\n\
    \      });\n    });\n  });\n```\n\nBecomes this:\n\n```javascript\n// ch_schedulers/starfield_raf.js\n\
    var StarStream = Rx.Observable.range(1, 250)\n  .map(function() {\n    return\
    \ {\n      x: parseInt(Math.random() * canvas.width),\n      y: parseInt(Math.random()\
    \ * canvas.height),\n      size: Math.random() * 3 + 1\n    };\n  })\n  .toArray()\n\
    \  .flatMap(function(arr) {\n    return animationLoop.map(function() {\n     \
    \ return arr.map(function(star) {\n        if (star.y >= canvas.height) {\n  \
    \        star.y = 0;\n        }\n        star.y += 3;\n        return star;\n\
    \      });\n    });\n  });\n```\n\nWhich gives us a much smoother animation. As\
    \ a bonus, the code is also cleaner!\n\n## Testing with Schedulers\n\nTesting\
    \ is perhaps one of the most compelling scenarios where we can use Schedulers.\
    \ So far in this book we've been coding our hearts out without thinking much about\
    \ the consequences. But in a real-world software project, we would be writing\
    \ tests to make sure our code works as we intend.\n\nTesting asynchronous code\
    \ is hard. We usually run into one of these problems:\n\n- Simulating asynchronous\
    \ events is complicated and error prone. The whole point of having tests is to\
    \ avoid bugs and errors, but if your tests themselves have errors, they're not\
    \ helping.\n- If we want to accurately test time-based functionality, automated\
    \ testing becomes really slow. For example, if we need to accurately test that\
    \ an error is called after four seconds of trying to retrieve a remote file, each\
    \ test will take at least that much time to run. If we run our test suite continuously,\
    \ that impacts our development time.\n\n## The TestScheduler\n\nRxJS gives us\
    \ the TestScheduler, a Scheduler designed to help with testing. TestScheduler\
    \ allows us to emulate time at our convenience and create deterministic tests,\
    \ where they are guaranteed to be 100% repeatable. Besides that, it allows us\
    \ to execute operations that would take a considerable amount of time and compress\
    \ them into an instant, while maintaining the test's accuracy.\n\nA TestScheduler\
    \ is a specialization of a VirtualTimeScheduler. VirtualTimeSchedulers execute\
    \ actions in \"virtual\" time instead of in real time. The Scheduled actions go\
    \ in a queue and are assigned a moment in virtual time. The Scheduler then runs\
    \ the actions in order when its clock advances. Because it is virtual time, everything\
    \ runs immediately, without having to wait for the time specified. Let's see an\
    \ example:\n\n```javascript\nvar onNext = Rx.ReactiveTest.onNext;\nQUnit.test(\"\
    Test value order\", function(assert) {\n    var scheduler = new Rx.TestScheduler();\n\
    \    var subject = scheduler.createColdObservable({\n        onNext(100, 'first'),\n\
    \        onNext(200, 'second'),\n        onNext(300, 'third'),\n    });\n\n  \
    \  var result = '';\n    subject.subscribe(function(value) { result = value });\n\
    \n    scheduler.advanceBy(100);\n    assert.equal(result, 'first');\n\n    scheduler.advanceBy(100);\n\
    \    assert.equal(result, 'second');\n\n    scheduler.advanceBy(100);\n    assert.equal(result,\
    \ 'third');\n});\n```\n\nIn the preceding code we test that some values from a\
    \ cold Observable arrive in the correct order. For this, we use the helper method\
    \ createColdObservable in TestScheduler to create an Observable that plays back\
    \ the onNext notifications we pass as parameters. In each notification we specify\
    \ the time at which the value of the notification should be emitted. After this,\
    \ we subscribe to this Observable, advance the virtual time in the Scheduler manually,\
    \ and check that it indeed emitted the expected value. If the example ran in normal\
    \ time, it would take 300 milliseconds, but because we're using a TestScheduler\
    \ to run the Observable, it will run immediately, but respecting the order.\n\n\
    ## Writing a Real-World Test\n\nThere's no better way to understand how to bend\
    \ time using virtual time than to write a test for a time-sensitive task in the\
    \ real world. Let's recover an Observable from the earthquake viewer we made in\
    \ *Buffering Values, on page 76*:\n\n```javascript\nquakes\n  .pluck('properties')\n\
    \  .map(makeRow)\n  .bufferWithTime(500)\n  .filter(function(rows) { return rows.length\
    \ > 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      fragment.appendChild(row);\n    });\n\
    \    return fragment;\n  })\n  .subscribe(function(fragment) {\n    table.appendChild(fragment);\n\
    \  });\n```\n\nTo make the code more testable, let’s encapsulate the Observable\
    \ in a function that takes a Scheduler we use in the `bufferWithTime` operator.\
    \ It’s always a good idea to parameterize Schedulers in Observables that will\
    \ be tested.\n\n```javascript\n// ch_schedulers/testscheduler.js\nfunction quakeBatches(scheduler)\
    \ {\n    return quakes.pluck('properties')\n        .bufferWithTime(500, null,\
    \ scheduler || null)\n        .filter(function(rows) {\n            return rows.length\
    \ > 0;\n        });\n}\n```\n\nLet’s also simplify the code by taking some steps\
    \ out but keeping the essence. This code takes an Observable of JSON objects that\
    \ contain a properties property, buffers them into batches released every 500\
    \ milliseconds, and filters the batches that come empty.\n\nWe want to verify\
    \ that this code works, but we definitely don’t want to wait several seconds every\
    \ time we run tests to make sure that our buffering works as expected. This is\
    \ where virtual time and the TestScheduler will help us:\n\n```javascript\n//\
    \ ch_schedulers/testscheduler.js\nvar onNext = Rx.ReactiveTest.onNext;\nvar onCompleted\
    \ = Rx.ReactiveTest.onCompleted;\nvar subscribe = Rx.ReactiveTest.subscribe;\n\
    \nvar scheduler = new Rx.TestScheduler();\n\nvar quakes = scheduler.createHotObservable(\n\
    \    onNext(100, { properties: 1 }),\n    onNext(300, { properties: 2 }),\n  \
    \  onNext(550, { properties: 3 }),\n    onNext(750, { properties: 4 }),\n    onNext(1000,\
    \ { properties: 5 }),\n    onCompleted(1100)\n);\n\nQUnit.test(\"Test quake buffering\"\
    , function(assert) {\n    var results = scheduler.startScheduler(function() {\n\
    \            return quakeBatches(scheduler)\n        }, {\n            created:\
    \ 0,\n            subscribed: 0,\n            disposed: 1200\n        });\n\n\
    \    var messages = results.messages;\n    console.log(results.scheduler === scheduler);\n\
    });\n```"
  mdcn: "\n## 为动画进行调度\n\n对于像 canvas 或 DOM 动画这样快速的视觉更新，我们可以使用一个毫秒值极低的 `interval` 操作符，或者创建一个内部使用类似\
    \ `setTimeout` 函数来调度通知的调度器（Scheduler）。\n\n但这两种方法都不是理想的。在两种情况下，我们都在向浏览器投递所有这些更新，而浏览器可能无法足够快地处理它们。这是因为浏览器在尝试渲染一帧时，又收到了渲染下一帧的指令，于是它会丢弃当前帧以跟上速度。结果就是动画出现卡顿。而\
    \ Web 领域中这种现象已经足够多了。\n\n浏览器有一种原生的方式来处理动画，并提供了一个名为 `requestAnimationFrame` 的 API\
    \ 来使用它。`requestAnimationFrame` 允许浏览器在最合适的时间排列动画，从而优化性能并帮助我们实现更流畅的动画。\n\n## 正有为此设计的调度器\n\
    \nRxDOM 库自带了一些额外的调度器，其中之一就是 `requestAnimationFrame` 调度器。\n\n没错，你猜对了。我们可以使用这个调度器来改进我们的飞船视频游戏。在该游戏中，我们通过创建一个速度为\
    \ 40ms（大约每秒 25 帧）的 `interval` Observable，然后使用 `combineLatest` 以 `interval` 设置的速度（因为它是更新最快的\
    \ Observable）来更新整个游戏场景，从而建立了一个刷新速度。……但谁知道使用这种技术会导致浏览器丢弃多少帧！如果使用 `requestAnimationFrame`，我们会获得更好的性能。\n\
    \n让我们创建一个使用 `Rx.Scheduler.requestAnimationFrame` 作为其调度器的 Observable。请注意，它的工作方式与\
    \ `interval` 操作符类似：\n\n```javascript\n// ch_schedulers/starfield_ra.js\nfunction\
    \ animationLoop(scheduler) {\n    return Rx.Observable.generate(\n        0,\n\
    \        function() { return true; }, // 永远保持生成\n        function(x) { return\
    \ x + 1; }, // 内部值递增\n        function(x) { return x; }, // 每次通知时返回的值\n      \
    \  Rx.Scheduler.requestAnimationFrame); // 调度到 requestAnimationFrame\n    )\n\
    }\n```\n\n现在，无论我们在哪里使用 `interval` 以 25 FPS 动画化图形，都可以直接使用我们的 `animationLoop` 函数。因此，我们之前用于绘制星星的\
    \ Observable 看起来像这样：\n\n```javascript\n// spaceship_reactive/spaceship.js\nvar\
    \ StarStream = Rx.Observable.range(1, 250)\n  .map(function() {\n    return {\n\
    \      x: parseInt(Math.random() * canvas.width),\n      y: parseInt(Math.random()\
    \ * canvas.height),\n      size: Math.random() * 3 + 1\n    };\n  })\n  .toArray()\n\
    \  .flatMap(function(arr) {\n    return Rx.Observable.interval(SPEED).map(function()\
    \ {\n      return arr.map(function(star) {\n        if (star.y >= canvas.height)\
    \ {\n          star.y = 0;\n        }\n        star.y += 3;\n        return star;\n\
    \      });\n    });\n  });\n```\n\n现在变成了这样：\n\n```javascript\n// ch_schedulers/starfield_raf.js\n\
    var StarStream = Rx.Observable.range(1, 250)\n  .map(function() {\n    return\
    \ {\n      x: parseInt(Math.random() * canvas.width),\n      y: parseInt(Math.random()\
    \ * canvas.height),\n      size: Math.random() * 3 + 1\n    };\n  })\n  .toArray()\n\
    \  .flatMap(function(arr) {\n    return animationLoop.map(function() {\n     \
    \ return arr.map(function(star) {\n        if (star.y >= canvas.height) {\n  \
    \        star.y = 0;\n        }\n        star.y += 3;\n        return star;\n\
    \      });\n    });\n  });\n```\n\n这给我们带来了流畅得多的动画。而且作为奖励，代码也变得更简洁了！\n\n## 使用调度器进行测试\n\
    \n测试或许是使用调度器最令人心动的场景之一。到目前为止，在本书中我们一直在全力编写代码，而没有过多考虑后果。但在真实的软件项目中，我们会编写测试来确保代码按预期工作。\n\
    \n测试异步代码很困难。我们通常会遇到以下问题之一：\n\n- 模拟异步事件既复杂又容易出错。测试的全部意义就在于避免 Bug 和错误，但如果测试本身就有错误，那就毫无帮助。\n\
    - 如果我们想准确地测试基于时间的功能，自动化测试会变得非常缓慢。例如，如果我们需要准确测试在尝试检索远程文件四秒后是否调用了错误，那么每个测试至少需要花这么多时间来运行。如果我们持续运行测试套件，这将影响我们的开发时间。\n\
    \n## TestScheduler\n\nRxJS 为我们提供了 `TestScheduler`，这是一个专门为辅助测试而设计的调度器。`TestScheduler`\
    \ 允许我们根据方便灵活地模拟时间，并创建确定性的测试，从而保证测试 100% 可重复。除此之外，它还允许我们将需要大量时间才能执行的操作压缩到瞬间完成，同时保持测试的准确性。\n\
    \n`TestScheduler` 是 `VirtualTimeScheduler` 的一种特例。`VirtualTimeSchedulers` 在“虚拟”时间而非真实时间中执行动作。被调度的动作进入一个队列，并被分配一个虚拟时间点。当调度器的时钟推进时，调度器会按顺序运行这些动作。因为是虚拟时间，所有内容都会立即运行，而无需等待指定的时间。让我们看一个例子：\n\
    \n```javascript\nvar onNext = Rx.ReactiveTest.onNext;\nQUnit.test(\"Test value\
    \ order\", function(assert) {\n    var scheduler = new Rx.TestScheduler();\n \
    \   var subject = scheduler.createColdObservable({\n        onNext(100, 'first'),\n\
    \        onNext(200, 'second'),\n        onNext(300, 'third'),\n    });\n\n  \
    \  var result = '';\n    subject.subscribe(function(value) { result = value });\n\
    \n    scheduler.advanceBy(100);\n    assert.equal(result, 'first');\n\n    scheduler.advanceBy(100);\n\
    \    assert.equal(result, 'second');\n\n    scheduler.advanceBy(100);\n    assert.equal(result,\
    \ 'third');\n});\n```\n\n在上述代码中，我们测试了一个冷 Observable 的某些值是否按正确顺序到达。为此，我们使用 `TestScheduler`\
    \ 中的辅助方法 `createColdObservable` 来创建一个 Observable，它会回放我们作为参数传递的 `onNext` 通知。在每个通知中，我们指定了该通知的值应该在什么时间点发出。之后，我们订阅这个\
    \ Observable，手动推进调度器中的虚拟时间，并检查它是否确实发出了预期值。如果该示例在正常时间下运行，将花费 300 毫秒，但因为我们使用 `TestScheduler`\
    \ 来运行 Observable，它将立即运行，但同时遵循顺序。\n\n## 编写一个实际的测试\n\n要理解如何使用虚拟时间来“弯曲”时间，最好的方法就是为现实世界中一个对时间敏感的任务编写测试。让我们从我们在\
    \ *第 76 页《缓冲值》* 中制作的地震查看器中恢复一个 Observable：\n\n```javascript\nquakes\n  .pluck('properties')\n\
    \  .map(makeRow)\n  .bufferWithTime(500)\n  .filter(function(rows) { return rows.length\
    \ > 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      fragment.appendChild(row);\n    });\n\
    \    return fragment;\n  })\n  .subscribe(function(fragment) {\n    table.appendChild(fragment);\n\
    \  });\n```\n\n为了使代码更具可测试性，我们将 Observable 封装在一个函数中，该函数接收一个我们在 `bufferWithTime`\
    \ 操作符中使用的调度器。在需要测试的 Observable 中对调度器进行参数化始终是一个好主意。\n\n```javascript\n// ch_schedulers/testscheduler.js\n\
    function quakeBatches(scheduler) {\n    return quakes.pluck('properties')\n  \
    \      .bufferWithTime(500, null, scheduler || null)\n        .filter(function(rows)\
    \ {\n            return rows.length > 0;\n        });\n}\n```\n\n我们还通过去掉一些步骤但保留核心逻辑来简化代码。这段代码接收一个包含\
    \ `properties` 属性的 JSON 对象 Observable，将它们缓冲成每 500 毫秒释放一次的批次，并过滤掉空的批次。\n\n我们想验证这段代码是否正常工作，但我们绝对不想在每次运行测试时都等待好几秒来确保缓冲按预期工作。这就是虚拟时间和\
    \ `TestScheduler` 能帮到我们的地方：\n\n```javascript\n// ch_schedulers/testscheduler.js\n\
    var onNext = Rx.ReactiveTest.onNext;\nvar onCompleted = Rx.ReactiveTest.onCompleted;\n\
    var subscribe = Rx.ReactiveTest.subscribe;\n\nvar scheduler = new Rx.TestScheduler();\n\
    \nvar quakes = scheduler.createHotObservable(\n    onNext(100, { properties: 1\
    \ }),\n    onNext(300, { properties: 2 }),\n    onNext(550, { properties: 3 }),\n\
    \    onNext(750, { properties: 4 }),\n    onNext(1000, { properties: 5 }),\n \
    \   onCompleted(1100)\n);\n\nQUnit.test(\"Test quake buffering\", function(assert)\
    \ {\n    var results = scheduler.startScheduler(function() {\n            return\
    \ quakeBatches(scheduler)\n        }, {\n            created: 0,\n           \
    \ subscribed: 0,\n            disposed: 1200\n        });\n\n    var messages\
    \ = results.messages;\n    console.log(results.scheduler === scheduler);\n});\n\
    ```\n"
