  md: "This bit of code does exactly the same as our previous one, but we don't have\
    \ to create a wrapper around XMLHttpRequest; it's already there. Notice that this\
    \ time we omitted the onCompleted callback, because we don't plan to react when\
    \ the Observable is done. We know that it will yield only one result, and we are\
    \ already using it in the onNext callback.\n\nWe'll use plenty of convenient operators\
    \ like this throughout this book. RxJS comes with \"batteries included.\" In fact,\
    \ that is one of its main strengths.\n\n> ### One Data Type to Rule Them All\n\
    \nIn an RxJS program, we should strive to have all data in Observables, not just\
    \ data that comes from asynchronous sources. Doing that makes it easy to combine\
    \ data from different origins, like an existing array with the result of a callback,\
    \ or the result of an XMLHttpRequest with some event triggered by the user.\n\n\
    For example, if we have an array whose items need to be used in combination with\
    \ data from somewhere else, it's better to make this array into an Observable.\
    \ (Obviously, if the array is just an intermediate variable that doesn't need\
    \ to be combined, there is no need to do that.) Throughout the book, you'll learn\
    \ in which situations it's worth transforming data types into Observables.\n\n\
    RxJS provides operators to create Observables from most JavaScript data types.\
    \ Let's go over the most common ones, which you'll be using all the time: arrays,\
    \ events, and callbacks.\n\n# Creating Observables from Arrays\n\nWe can make\
    \ any array-like or iterable object into an Observable by using the versatile\
    \ from operator. from takes an array as a parameter and returns an Observable\
    \ that emits each of its elements.\n\n```\nRx.Observable\n  .from(['Adrià', 'Jen',\
    \ 'Sergi'])\n  .subscribe({\n    function(x) { console.log('Next: ' + x); },\n\
    \    function(err) { console.log('Error: ', err); },\n    function() { console.log('Completed');\
    \ }\n  });\n```\n\nfrom is, along with fromEvent, one of the most convenient and\
    \ frequently used operators in RxJS code."
