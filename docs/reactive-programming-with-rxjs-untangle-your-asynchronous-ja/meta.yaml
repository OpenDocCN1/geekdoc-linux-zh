  - "[PAGE 41]\n\n# # Canceling Sequences\n\nIn RxJS we can cancel a running Observable.\
    \ This is an advantage over other asynchronous forms of communication, such as\
    \ callbacks and promises, which can't be directly canceled once they're called\
    \ (some promise implementations support cancellation, though).\n\nThere are two\
    \ main ways we can cancel an Observable: *implicitly* and *explicitly*.\n\n# ##\
    \ Explicit Cancellation: The Disposable\n\nObservables themselves don't have a\
    \ method to get canceled. Instead, whenever we subscribe to an Observable we get\
    \ a Disposable object that represents that particular subscription. We can then\
    \ call the method `dispose` in that object, and that subscription will stop receiving\
    \ notifications from the Observable.\n\nIn the following example, we subscribe\
    \ two Observers to the `counter` Observable, which emits an increasing integer\
    \ every second. After two seconds, we cancel the second subscription and we can\
    \ see that its output stops but the first subscriber's output keeps going:\n\n\
    ```\n```javascript\nsequences/disposable.js\nvar counter = Rx.Observable.interval(1000);\n\
    \nvar subscription1 = counter.subscribe(function(i) {\n  console.log('Subscription\
    \ 1: ' + i);\n});\n\nvar subscription2 = counter.subscribe(function(i) {\n  console.log('Subscription\
    \ 2: ' + i);\n});\n\nsetTimeout(function() {\n  console.log('Canceling subscription2!');\n\
    \  subscription2.dispose();\n}, 2000);\n```\n```\n\n```\n```text\nSubscription\
    \ 1: 0\nSubscription 2: 0\nSubscription 1: 1\nSubscription 2: 1\nCanceling subscription2!\n\
    Subscription 1: 2\nSubscription 1: 3\nSubscription 1: 4\n...\n```\n```"
  - "[PAGE 42]\n\n# Implicit Cancellation: By Operator\n\nMost of the time, operators\
    \ will automatically cancel subscriptions for you. Operators such as `range` or\
    \ `take` will cancel the subscription when the sequence finishes or when the operator\
    \ conditions are met. More advanced operators such as `withLatestFrom` or `flatMapLatest`\
    \ will internally create and destroy subscriptions as needed, since they handle\
    \ several Observables in motion. In short, you should not worry about canceling\
    \ most subscriptions yourself.\n\n# Observables That Wrap External APIs\n\nWhen\
    \ you're using Observables that wrap external APIs that don't provide cancellation,\
    \ the Observable will still stop emitting notifications when canceled, but the\
    \ underlying API will not necessarily be canceled. For example, if you're using\
    \ an Observable that wraps a promise, the Observable will stop emitting when canceled,\
    \ but the underlying promise will not be canceled.\n\nIn the following code, we\
    \ attempt to cancel a subscription to an Observable that wraps a promise `p`,\
    \ and at the same time we set an action in the traditional way for when the promise\
    \ is resolved. The promise should resolve in five seconds, but we cancel the subscription\
    \ immediately after creating it:\n\n```\n```javascript\nvar p = new Promise(function(resolve,\
    \ reject) {\n    window.setTimeout(resolve, 5000);\n});\n\np.then(function() {\n\
    \    console.log('Potential side effect!');\n});\n\nvar subscription = Rx.Observable.fromPromise(p).subscribe(function(msg)\
    \ {\n    console.log('Observable resolved!');\n});\nsubscription.dispose();\n\
    ```\n```\n\nAfter 5 seconds, we see:\n\n> Potential side effect!\n\nIf we cancel\
    \ the subscription to the Observable it effectively stops it from receiving the\
    \ notification. But the promise's then method still runs, showing that canceling\
    \ the Observable doesn't cancel the underlying promise.\n\nIt's important to know\
    \ the details of external APIs that we use in Observables. You might think you've\
    \ canceled a sequence, but the underlying API keeps running and causes some side\
    \ effects in your program. These errors can be really hard to catch."
  - "[PAGE 43]\n\n# # Handling Errors\n\nWe can’t use the conventional try/catch mechanism\
    \ in callbacks because it is synchronous. It would run before any asynchronous\
    \ code, and wouldn’t be able to catch any errors.\n\nWith callbacks, this was\
    \ solved by passing the error (if any) as a parameter to the callback function.\
    \ That works, but it makes the code pretty fragile.\n\nLet’s see how to catch\
    \ errors inside Observables.\n\n# ## The onError Handler\n\nRemember when we talked\
    \ about the three methods we can call on an Observer, in *First Contact with Observers,\
    \ on page 10*? We’re familiar with onNext and onCompleted, but we haven’t yet\
    \ used onError; it is the key to effectively handling errors in Observable sequences.\n\
    \nTo see how it works, we’ll write a simple function to take an array of JSON\
    \ strings and return an Observable that emits the objects parsed from those strings,\
    \ using JSON.parse:\n\n```\n```javascript\nfunction getJSON(arr) {\n    return\
    \ Rx.Observable.from(arr).map(function(str) {\n        var parsedJSON = JSON.parse(str);\n\
    \        return parsedJSON;\n    });\n}\n```\n```\n\nWe’ll pass an array with\
    \ three JSON strings to getJSON, in which the second string in the array contains\
    \ a syntax error, so JSON.parse won’t be able to parse it. Then we’ll subscribe\
    \ to the result, providing handlers for onNext and onError:\n\n```\n```javascript\n\
    getJSON([\n    '{\"1\": 1, \"2\": 2}',\n    '{\"success: true}', // Invalid JSON\
    \ string\n    '{\"enabled\": true}'\n]).subscribe({\n    function(json) {\n  \
    \      console.log('Parsed JSON: ', json);\n    },\n    function(err) {\n    \
    \    console.log(err.message);\n    }\n});\n```\n```\n\nParsed JSON: { 1: 1, 2:\
    \ 2 }\nJSON.parse: unterminated string at line 1 column 8 of the JSON data"
  - "[PAGE 44]\n\nThe Observable emits the parsed JSON for the first result but throws\
    \ an exception when trying to parse the second. The `onError` handler catches\
    \ this and prints it out. The default behavior is that whenever an error happens,\
    \ the Observable stops emitting items, and `onCompleted` is not called.\n\n# ###\
    \ Catching Errors\n\nSo far we’ve seen how to detect that an error has happened\
    \ and do something with that information, but we haven’t been able to react to\
    \ it and continue with whatever we were doing. Observable instances have the catch\
    \ operator, which allows us to react to an error in the Observable and continue\
    \ with another Observable.\n\ncatch takes either an Observable or a function that\
    \ receives the error as a parameter and returns another Observable. In our scenario,\
    \ we want the Observable to emit a JSON object containing an error property if\
    \ there were errors in the original Observable:\n\n```\n```javascript\nfunction\
    \ getJSON(arr) {\n    return Rx.Observable.from(arr).map(function(str) {\n   \
    \     var parsedJSON = JSON.parse(str);\n        return parsedJSON;\n    });\n\
    }\n```\n```\n\n```\n```javascript\nvar caught = getJSON(['{\"1\": 1, \"2\": 2}',\
    \ '{\"1: 1}']).catch(function(e) {\n    return Rx.Observable.return({\n      \
    \  error: 'There was an error parsing JSON'\n    });\n});\n```\n```\n\n```\n```javascript\n\
    caught.subscribe(\n    function(json) {\n        console.log('Parsed JSON: ',\
    \ json);\n    },\n    // Because we catch errors now, `onError` will not be executed\n\
    \    function(e) {\n        console.log('ERROR', e.message);\n    }\n);\n```\n\
    ```\n\nIn the preceding code, we create a new Observable, caught, that uses the\
    \ catch operator to catch errors in the original Observable. If there’s an error\
    \ it will continue the sequence with an Observable that emits only one item, with\
    \ an error property describing the error. This is the output:\n\n> Parsed JSON:\
    \ Object { 1: 1, 2: 2 }\nParsed JSON: Object { error: \"There was an error parsing\
    \ JSON\" }"
  - "[PAGE 45]\n\nAnd here’s the marble diagram for the catch operator:\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_45_0.png)\n\
    \nNotice the X to indicate that the sequence experienced an error. The different\
    \ shape of the Observable values—triangles in this case—means that they are values\
    \ coming from another Observable. Here, that’s the Observable we return in case\
    \ of an error.\n\ncatch is useful for reacting to errors in a sequence, and it\
    \ behaves much like the traditional try/catch block. In some cases, though, it\
    \ would be very convenient to ignore an error that happens with an item in the\
    \ Observable and let the sequence continue. In those cases, we can use the retry\
    \ operator.\n\n# ## Retrying Sequences\n\nSometimes errors just happen and there’s\
    \ not much we can do about it. For example, there could be a timeout requesting\
    \ remote data because the user has a spotty Internet connection, or a remote server\
    \ we’re querying could crash. In these cases it would be great if we could keep\
    \ requesting the data until we need it successful. The retry operator does exactly\
    \ that:\n\n```\n```javascript\nsequences/error_handling.js\n\n// This will try\
    \ to retrieve the remote URL up to 5 times.\nRx.DOM.get('/products').retry(5)\n\
    \  .subscribe(\n    function(xhr) { console.log(xhr); },\n    function(err) {\
    \ console.error('ERROR: ', err); }\n  );\n```\n```\n\nIn the preceding code, we\
    \ create a function that returns an Observable that retrieves contents from a\
    \ URL using XMLHttpRequest. Because our connection might be a bit spotty, we add\
    \ retry(5) before subscribing to it, ensuring that in case of an error, it will\
    \ try up to five times before giving up and showing an error."
- md: "There are two important things to know when using retry. First, if we don’t\
    \ pass any parameters, it will retry indefinitely until the sequence is finished\
    \ with no errors. This is dangerous for performance if the Observable keeps producing\
    \ errors. If we’re using synchronous Observables, it would have the same effect\
    \ as an infinite loop.\n\nSecond, retry will always retry the whole Observable\
    \ sequence again, even if some of the items didn’t error. This is important in\
    \ case you’re causing any side effects when processing items, since they will\
    \ be reapplied with every retry.\n\n## Making a Real-Time Earthquake Visualizer\n\
    \nUsing the concepts that we’ve covered so far in this chapter, we’ll build a\
    \ web application that uses RxJS to show us where earthquakes are happening in\
    \ real time. We’ll start by building a functional but naive reactive implementation,\
    \ and we’ll improve it as we go. The final result will look like this:\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_46_0.png)\n\
    \n## Preparing Our Environment\n\nWe’ll use the USGS (U.S. Geological Survey)\
    \ earthquake database,¹ which offers a real-time earthquake dataset in several\
    \ formats. We will get our data from the weekly dataset in JSONP format.\n\n>\
    \ 1. http://earthquake.usgs.gov/earthquakes/feed/v1.0/\n\nWe'll also use Leaflet,\
    \ a JavaScript library, to render interactive maps.² Let's see how our index.html\
    \ looks, and go over the important points:\n\n```html\nexamples_earthquake/index.html\n\
    <!DOCTYPE html>\n<html lang=\"en-us\">\n<head>\n    <meta charset=\"utf-8\">\n\
    \n    <link rel=\"stylesheet\"\n          href=\"http://cdn.leafletjs.com/leaflet-0.7.3/leaflet.css\"\
    \ />\n    <script src=\"http://cdn.leafletjs.com/leaflet-0.7.3/leaflet.js\"></script>\n\
    \    <script src=\"../rx.all-4.0.0.js\"></script>\n\n    <title>Earthquake map</title>\n\
    \    <style type=\"text/css\">\n        html, body {\n            margin: 0;\n\
    \            padding: 0;\n            height: 100%;\n        }\n\n        #map\
    \ { height: 100%; }\n    </style>\n</head>\n\n<body>\n    <div id=\"map\"></div>\n\
    \    <script>\n        var QUAKE_URL = 'http://earthquake.usgs.gov/earthquakes/feed/v1.0/'\
    \ +\n            'summary/all_day.geojson';\n\n        function loadJSONP(url)\
    \ {\n            var script = document.createElement('script');\n            script.src\
    \ = url;\n\n            var head = document.getElementsByTagName('head')[0];\n\
    \            head.appendChild(script);\n        }\n\n        var map = L.map('').setView([33.858631,\
    \ -118.279602], 7);\n        L.TileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png').addTo(map);\n\
    \    </script>\n    <script src=\"code.js\"></script>\n</body>\n</html>\n```\n\
    \n> 2. [http://leafletjs.com](http://leafletjs.com)\n\n- 1. This is the placeholder\
    \ `div` element that Leaflet will use to render our map.\n- 2. That's a helper\
    \ function we use to load JSONP content.\n- 3. We initialize the Leaflet map by\
    \ setting the coordinates to the center of Los Angeles (plenty of earthquakes\
    \ there!) with a reasonable zoom level.\n- 4. We tell Leaflet to set the default\
    \ tile set for our map. The tile set is just a \"theme\" for our map.\n- 5. Finally,\
    \ we load our code after the DOM and the map have been initialized.\n\n### Retrieving\
    \ Earthquake Locations\n\nNow that our HTML is ready, we can write the logic for\
    \ our application. First we need to know what kind of data we get and what data\
    \ we need to represent earthquakes on a map.\n\nThe JSONP data the USGS site gives\
    \ us back looks like this:\n\n```\nexamples_earthquake/jsonp_example.txt\neqfeed_callback({\n\
    \t\"type\": \"FeatureCollection\",\n\t\"metadata\": {\n\t\t\"generated\": 1408030886000,\n\
    \t\t\"url\": \"http://earthquake.usgs.gov/earthquakes/...\",\n\t\t\"title\": \"\
    USGS All Earthquakes, Past Day\",\n\t\t\"status\": 200, \"api\": \"1.0.13\", \"\
    count\": 134\n\t},\n\t\"features\": [\n\t\t{\n\t\t\t\"type\": \"Feature\",\n\t\
    \t\t\"properties\": {\n\t\t\t\t\"mag\": 0.82,\n\t\t\t\t\"title\": \"M 0.8 - 3km\
    \ WSW of Idyllwild-Pine Cone, California\",\n\t\t\t\t\"place\": \"3km WSW of Idyllwild-Pine\
    \ Cone, California\",\n\t\t\t\t\"time\": 1408030368460,\n\t\t\t},\n\t\t\t\"geometry\"\
    : {\n\t\t\t\t\"type\": \"Point\",\n\t\t\t\t\"coordinates\": [ -116.736667, 33.703333,\
    \ 17.33 ]\n\t\t\t},\n\t\t\t\"id\": \"ci15538377\"\n\t\t},\n\t\t...\n\t]\n})\n\
    ```\n\nThe features array contains an object with the data for every earthquake\
    \ that happened today. That's a truckload of data! It's amazing (and terrifying)\
    \ how many earthquakes happen in a single day. For our program we'll need only\
    \ the coordinates, title, and magnitude for each earthquake.\n\nWe first want\
    \ to create an Observable that retrieves the dataset and emits single earthquakes.\
    \ Here's a first version:\n\n```javascript\nexamples_earthquake_code.js\nvar quakes\
    \ = Rx.Observable.create(function(observer) {\n  window.eqfeed_callback = function(response)\
    \ {\n    var quakes = response.features;\n    quakes.forEach(function(quake) {\n\
    \      observer.onNext(quake);\n    });\n  };\n\n  loadJSONP(QUAKE_URL);\n});\n\
    \nquakes.subscribe(function(quake) {\n  var coords = quake.geometry.coordinates;\n\
    \  var size = quake.properties.mag * 10000;\n\n  L.circle([coords[1], coords[0]],\
    \ size).addTo(map);\n});\n```\n\nWait, what is that blatant global function `window.eqfeed_callback`\
    \ doing in our code? Well, it turns out that JSONP URLs often provide a way—by\
    \ adding a querystring in the URL—to specify the function name to handle the response,\
    \ but the USGS site doesn't allow that, so we need to create a global function\
    \ with the name they decided we must use, which is `eqfeed_callback`.\n\nOur Observable\
    \ emits all earthquakes in order. We have an earthquake generator now! We don't\
    \ have to care about asynchronous flows or about having to put all of our logic\
    \ in the same function. As long as we subscribe to the Observable, earthquakes\
    \ will just come to us.\n\nBy having the earthquake retrieval “blackboxed” in\
    \ the `quakes` Observable, we can now subscribe to it and process each earthquake.\
    \ Then we'll draw a circle for each earthquake with a size proportional to its\
    \ magnitude.\n\n## Going Deeper\n\nCan we do better? You bet! In the preceding\
    \ code, we're still managing flow by traversing the array and calling `onNext`\
    \ to yield each earthquake, even if we isolated it inside the Observable. So much\
    \ for reactiveness!\n\n### Joe asks: What Is JSONP?\n\nJSONP—or *JSON with padding*—is\
    \ a sneaky technique that web developers came up with to work around the browser\
    \ restrictions when requesting data from third-party domains.<sup>a</sup>\n\n\
    It bypasses these restrictions by loading external content using `script` tags\
    \ instead of the usual `XMLHttpRequest`. Adding a script tag to the DOM loads\
    \ and executes its content directly, and the security restrictions are not applied.\n\
    \nThe remote request's content is then normal JSON wrapped in a function call\
    \ (the *P* in JSONP). It looks like this:\n\n```javascript\ncallbackFn({a: 1,\
    \ b: 2, c: 3})\n```\n\nJSONP URLs usually accept a query string parameter so that\
    \ the caller can specify the name of the callback. The developer then has to define\
    \ a function in her code that has the same name as the callback in the server\
    \ response, and when the script tag is added to the document, that function will\
    \ be called with the JSON data as the first parameter.\n\nLibraries like jQuery\
    \ automate this process by internally creating the global function to handle the\
    \ JSONP call, and tidying up afterward to avoid polluting the global namespace.\n\
    \n> a. [http://en.wikipedia.org/wiki/Same-origin_policy](http://en.wikipedia.org/wiki/Same-origin_policy)\n\
    \nThis is a perfect situation for `flatMap`. We'll retrieve the data and make\
    \ an Observable out of the features array using `Rx.Observable.from`. Then we'll\
    \ merge that Observable back in the main Observable:\n\n```javascript\n// examples_earthquake/code1.js\n\
    var quakes = Rx.Observable.create(function(observer) {\n    window.eqfeed_callback\
    \ = function(response) {\n        observer.onNext(response);\n        observer.onCompleted();\n\
    \    };\n    loadJSONP(QUAKE_URL);\n}).flatMap(function transform(dataset) {\n\
    \    return Rx.Observable.from(dataset.features);\n});\n\nquakes.subscribe(function(quake)\
    \ {\n    var coords = quake.geometry.coordinates;\n    var size = quake.properties.mag\
    \ * 10000;\n    L.circle([coords[1], coords[0]], size).addTo(map);\n});\n```"
  mdcn: "\n在使用 retry 时，有两点很重要。首先，如果我们不传递任何参数，它将无限次地重试，直到序列在没有错误的情况下完成。如果 Observable\
    \ 持续产生错误，这将对性能产生危险。如果我们使用的是同步 Observable，其效果将等同于死循环。\n\n其次，retry 总是会重新尝试整个 Observable\
    \ 序列，即使其中某些项没有出错。这一点非常重要，因为如果你在处理项时产生了任何副作用，这些副作用将在每次重试时被重新应用。\n\n## 制作一个实时地震可视化工具\n\
    \n利用本章到目前为止涵盖的概念，我们将构建一个使用 RxJS 的 Web 应用程序，用来实时显示地震发生的位置。我们将从构建一个功能完备但较为简单的响应式实现开始，并在过程中逐步对其进行改进。最终结果如下所示：\n\
    \n![](img/a8eed7bbb390e0eff6b6561c329a113c_46_0.png)\n\n## 准备环境\n\n我们将使用 USGS（美国地质调查局）的地震数据库¹，它以多种格式提供实时地震数据集。我们将从\
    \ JSONP 格式的每周数据集中获取数据。\n\n> 1. http://earthquake.usgs.gov/earthquakes/feed/v1.0/\n\
    \n我们还将使用 Leaflet（一个 JavaScript 库）来渲染交互式地图²。让我们看看 `index.html` 的样子，并回顾其中的重点：\n\n\
    ```html\nexamples_earthquake/index.html\n<!DOCTYPE html>\n<html lang=\"en-us\"\
    >\n<head>\n    <meta charset=\"utf-8\">\n\n    <link rel=\"stylesheet\"\n    \
    \      href=\"http://cdn.leafletjs.com/leaflet-0.7.3/leaflet.css\" />\n    <script\
    \ src=\"http://cdn.leafletjs.com/leaflet-0.7.3/leaflet.js\"></script>\n    <script\
    \ src=\"../rx.all-4.0.0.js\"></script>\n\n    <title>Earthquake map</title>\n\
    \    <style type=\"text/css\">\n        html, body {\n            margin: 0;\n\
    \            padding: 0;\n            height: 100%;\n        }\n\n        #map\
    \ { height: 100%; }\n    </style>\n</head>\n\n<body>\n    <div id=\"map\"></div>\n\
    \    <script>\n        var QUAKE_URL = 'http://earthquake.usgs.gov/earthquakes/feed/v1.0/'\
    \ +\n            'summary/all_day.geojson';\n\n        function loadJSONP(url)\
    \ {\n            var script = document.createElement('script');\n            script.src\
    \ = url;\n\n            var head = document.getElementsByTagName('head')[0];\n\
    \            head.appendChild(script);\n        }\n\n        var map = L.map('').setView([33.858631,\
    \ -118.279602], 7);\n        L.TileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png').addTo(map);\n\
    \    </script>\n    <script src=\"code.js\"></script>\n</body>\n</html>\n```\n\
    \n> 2. [http://leafletjs.com](http://leafletjs.com)\n\n- 1. 这是 Leaflet 将用于渲染地图的占位\
    \ `div` 元素。\n- 2. 这是一个我们用来加载 JSONP 内容的辅助函数。\n- 3. 我们通过将坐标设置为洛杉矶中心（那里经常发生地震！）并设置合理的缩放级别来初始化\
    \ Leaflet 地图。\n- 4. 我们告诉 Leaflet 为我们的地图设置默认瓦片集。瓦片集就像是地图的“主题”。\n- 5. 最后，在 DOM 和地图初始化之后，我们加载自己的代码。\n\
    \n### 获取地震位置\n\n现在 HTML 已经准备好了，我们可以编写应用程序的逻辑。首先，我们需要知道我们能获得什么样的数据，以及需要什么数据才能在地图上表示地震。\n\
    \nUSGS 网站返回给我们的 JSONP 数据如下所示：\n\n```\nexamples_earthquake/jsonp_example.txt\n\
    eqfeed_callback({\n\t\"type\": \"FeatureCollection\",\n\t\"metadata\": {\n\t\t\
    \"generated\": 1408030886000,\n\t\t\"url\": \"http://earthquake.usgs.gov/earthquakes/...\"\
    ,\n\t\t\"title\": \"USGS All Earthquakes, Past Day\",\n\t\t\"status\": 200, \"\
    api\": \"1.0.13\", \"count\": 134\n\t},\n\t\"features\": [\n\t\t{\n\t\t\t\"type\"\
    : \"Feature\",\n\t\t\t\"properties\": {\n\t\t\t\t\"mag\": 0.82,\n\t\t\t\t\"title\"\
    : \"M 0.8 - 3km WSW of Idyllwild-Pine Cone, California\",\n\t\t\t\t\"place\":\
    \ \"3km WSW of Idyllwild-Pine Cone, California\",\n\t\t\t\t\"time\": 1408030368460,\n\
    \t\t\t},\n\t\t\t\"geometry\": {\n\t\t\t\t\"type\": \"Point\",\n\t\t\t\t\"coordinates\"\
    : [ -116.736667, 33.703333, 17.33 ]\n\t\t\t},\n\t\t\t\"id\": \"ci15538377\"\n\t\
    \t},\n\t\t...\n\t]\n})\n```\n\n`features` 数组包含一个对象，其中具有当天发生的每一次地震的数据。这可是海量的数据！一天之内发生这么多地震真是令人惊叹（且恐怖）。对于我们的程序，我们只需要每场地震的坐标、标题和震级。\n\
    \n我们首先想创建一个 Observable，用于检索数据集并发出单个地震事件。这是第一个版本：\n\n```javascript\nexamples_earthquake_code.js\n\
    var quakes = Rx.Observable.create(function(observer) {\n  window.eqfeed_callback\
    \ = function(response) {\n    var quakes = response.features;\n    quakes.forEach(function(quake)\
    \ {\n      observer.onNext(quake);\n    });\n  };\n\n  loadJSONP(QUAKE_URL);\n\
    });\n\nquakes.subscribe(function(quake) {\n  var coords = quake.geometry.coordinates;\n\
    \  var size = quake.properties.mag * 10000;\n\n  L.circle([coords[1], coords[0]],\
    \ size).addTo(map);\n});\n```\n\n等等，代码中那个显眼的全局函数 `window.eqfeed_callback` 是在做什么？事实证明，JSONP\
    \ URL 通常提供一种方式（通过在 URL 中添加查询字符串）来指定处理响应的函数名称，但 USGS 网站不允许这样做，因此我们需要创建一个名为他们规定必须使用的\
    \ `eqfeed_callback` 的全局函数。\n\n我们的 Observable 按顺序发出所有地震。现在我们拥有了一个地震生成器！我们不需要关心异步流，也不需要将所有逻辑放在同一个函数中。只要我们订阅这个\
    \ Observable，地震数据就会自动传送到我们这里。\n\n通过将地震检索“黑盒化”在 `quakes` Observable 中，我们现在可以订阅它并处理每个地震。然后，我们将为每个地震绘制一个圆圈，其大小与震级成正比。\n\
    \n## 深入探讨\n\n我们能做得更好吗？当然可以！在之前的代码中，我们仍然通过遍历数组并调用 `onNext` 来产生每个地震来管理流程，即使我们将它隔离在\
    \ Observable 内部。这哪里像响应式编程！\n\n### Joe 问：什么是 JSONP？\n\nJSONP——即 *JSON with padding*（带填充的\
    \ JSON）——是 Web 开发人员为了绕过从第三方域请求数据时的浏览器限制而想出的一种巧妙技巧。<sup>a</sup>\n\n它通过使用 `script`\
    \ 标签而不是通常的 `XMLHttpRequest` 来加载外部内容，从而绕过了这些限制。将 script 标签添加到 DOM 会直接加载并执行其内容，且不受安全限制的影响。\n\
    \n远程请求的内容随后被包装在一个函数调用中（这就是 JSONP 中的 *P*）。它看起来像这样：\n\n```javascript\ncallbackFn({a:\
    \ 1, b: 2, c: 3})\n```\n\nJSONP URL 通常接受一个查询字符串参数，以便调用者可以指定回调函数的名称。随后，开发人员必须在代码中定义一个与服务器响应中的回调函数同名的函数，当\
    \ script 标签被添加到文档中时，该函数将被调用，并将 JSON 数据作为第一个参数传入。\n\n像 jQuery 这样的库通过在内部创建全局函数来处理\
    \ JSONP 调用，并在之后进行清理以避免污染全局命名空间，从而实现了这一过程的自动化。\n\n> a. [http://en.wikipedia.org/wiki/Same-origin_policy](http://en.wikipedia.org/wiki/Same-origin_policy)\n\
    \n这正是使用 `flatMap` 的绝佳场景。我们将检索数据，并使用 `Rx.Observable.from` 将 features 数组转换为一个 Observable。然后，我们将该\
    \ Observable 合并回主 Observable 中：\n\n```javascript\n// examples_earthquake/code1.js\n\
    var quakes = Rx.Observable.create(function(observer) {\n    window.eqfeed_callback\
    \ = function(response) {\n        observer.onNext(response);\n        observer.onCompleted();\n\
    \    };\n    loadJSONP(QUAKE_URL);\n}).flatMap(function transform(dataset) {\n\
    \    return Rx.Observable.from(dataset.features);\n});\n\nquakes.subscribe(function(quake)\
    \ {\n    var coords = quake.geometry.coordinates;\n    var size = quake.properties.mag\
    \ * 10000;\n    L.circle([coords[1], coords[0]], size).addTo(map);\n});\n```\n"
