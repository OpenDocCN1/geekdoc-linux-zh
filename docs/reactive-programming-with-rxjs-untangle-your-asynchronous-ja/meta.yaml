    \ = value });\n\nscheduler.advanceBy(100);\nassert.equal(result, 'first');\n\n\
    scheduler.advanceBy(100);\nassert.equal(result, 'second');\n\nscheduler.advanceBy(100);\n\
    assert.equal(result, 'third');\n});\n```\n```\n\nIn the preceding code we test\
    \ that some values from a cold Observable arrive in the correct order. For this,\
    \ we use the helper method createColdObservable in TestScheduler to create an\
    \ Observable that plays back the onNext notifications we pass as parameters. In\
    \ each notification we specify the time at which the value of the notification\
    \ should be emitted. After this, we subscribe to this Observable, advance the\
    \ virtual time in the Scheduler manually, and check that it indeed emitted the\
    \ expected value. If the example ran in normal time, it would take 300 milliseconds,\
    \ but because we're using a TestScheduler to run the Observable, it will run immediately,\
    \ but respecting the order.\n\n# ## Writing a Real-World Test\n\nThere's no better\
    \ way to understand how to bend time using virtual time than to write a test for\
