    \  onCompleted(1100).toString()\n);\n});\n```\n\n让我们逐步分析这段代码：\n\n- 1. 我们首先从 `ReactiveTest`\
    \ 加载一些辅助函数。这些函数在虚拟时间中注册 `onNext`、`onCompleted` 和订阅事件。\n- 2. 我们创建一个新的 `TestScheduler`，它将驱动整个测试。\n\
    - 3. 我们使用 `TestScheduler` 的 `createHotObservable` 方法来创建一个虚拟的热 Observable，用于模拟在虚拟时间特定时间点发出的通知。具体来说，它在第一秒内发出五个通知，并在\
    \ 1100 毫秒时完成。每次它都会发出一个具有特定属性的对象。\n- 4. 我们可以使用任何测试框架来运行测试。在我们的示例中，我选择了 `JUnit`。\n\
    - 5. 我们使用 `startScheduler` 方法来创建一个使用测试调度器的 Observable。第一个参数是一个创建 Observable 的函数，使其在我们的调度器中运行。在我们的案例中，我们简单地返回\
    \ `quakeBatches` 函数，并将 `TestScheduler` 传递给它。第二个参数是一个对象，包含我们希望创建 Observable、订阅它以及销毁它的不同虚拟时间点。在我们的示例中，我们在虚拟时间\
    \ 0 开始并订阅，在 1200（虚拟）毫秒时销毁该 Observable。\n- 6. `startScheduler` 方法返回一个包含调度器和 `messages`\
    \ 属性的对象。在 `messages` 中，我们可以找到该 Observable 在虚拟时间中发出的所有通知。\n- 7. 我们的第一个断言测试在 501\
    \ 毫秒后（就在第一个缓冲区时间限制之后），我们的 Observable 产生值 1 和 2。\n\n我们的第二个断言测试在 1001 毫秒后，我们的 Observable\
    \ 产生剩余的值 3、4 和 5。最后，我们的第三个断言检查序列是否恰好在 1100 毫秒时完成，正如我们在热 Observable `Observable\
    \ quakes` 中指定的那样。\n\n这段代码以一种非常可靠的方式有效地测试了我们高度异步的 Observables，而无需费尽心机地去模拟异步条件。我们只需在虚拟时间中指定希望代码做出反应的时间点，并使用测试调度器来运行整个操作。\n\
    \n## 总结\n\n调度器是 RxJS 的重要组成部分。即使在很多情况下你不需要显式地使用它们，但它们是能够让你在程序中微调并发能力的进阶概念。虚拟时间的概念是\
    \ RxJS 独有的，对于测试异步代码等任务极其有用。\n\n在下一章中，我们将使用 Cycle.js，这是一种基于*单向数据流*概念创建绝佳 Web 应用的响应式方式。通过它，我们将使用现代技术创建快速的\
    \ Web 应用程序，这些技术比传统的 Web 应用开发方式有了显著的改进。\n\n## 第 6 章：使用 Cycle.js 构建响应式 Web 应用程序\n\
