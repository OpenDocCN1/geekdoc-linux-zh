    \ 2: ' + x);\n    });\n}, 5000);\n```\n\n## 共享冷 Observable\n\n让我们回到地震示例。到目前为止，代码看起来很合理；我们有一个名为\
    \ quakes 的 Observable，它有两个订阅：一个在地图上绘制地震，另一个在表格中列出它们。\n\n但我们可以让代码效率更高。通过让 quakes\
    \ 拥有两个订阅者，实际上我们请求了两次数据。你可以在 quakes 的 `flatMap` 运算符内部放置一个 `console.log` 来验证这一点。\n\
    \n这种情况发生是因为 quakes 是一个冷 Observable，它会向每个新订阅者重新发送所有值，因此一个新的订阅意味着一个新的 JSONP 请求。这会导致我们在网络上两次请求相同的资源，从而影响应用程序的性能。\n\
    \n在下一个示例中，我们将使用 `share` 运算符，当 Observer 的数量从零变为一时，它会自动创建对 Observable 的订阅。这使我们无需调用\
    \ connect：\n\n```javascript\nexamples_earthquake_ui/code2.js\nvar quakes = Rx.Observable\n\
    \    .interval(5000)\n    .flatMap(function() {\n        return Rx.DOM.jsonpRequest({\n\
    \            url: QUAKE_URL,\n            jsonpCallback: 'eqfeed_callback'\n \
    \       });\n    })\n    .flatMap(function(result) {\n        return Rx.Observable.from(result.response.features);\n\
    \    })\n    .distinct(function(quake) { return quake.properties.code; })\n  \
    \  .share()\n```\n\n现在 quakes 的行为就像一个热 Observable，我们不必担心连接到它的 Observer 数量，因为它们都将接收到完全相同的数据。\n\
    \n## 缓冲值\n\n之前的代码运行良好，但请注意，每次接收到关于地震的信息时，我们都会插入一个 `tr` 节点。这是低效的，因为每次插入我们都在修改 DOM\
    \ 并导致页面重绘，使得浏览器在计算新布局时执行不必要的工作。这可能会导致明显的性能下降。\n\n理想情况下，我们会将多个传入的地震对象分批处理，每隔几秒插入一个批次。手动实现这一点会很棘手，因为我们需要维护计数器和元素缓冲区，并且要记得在每个批次后重置它们。但使用\
    \ RxJS，我们可以直接使用基于缓冲的 RxJS 运算符，例如 `bufferWithTime`。\n\n通过 `bufferWithTime`，我们可以缓冲传入的值，并在每\
    \ $x$ 时间段将其作为一个数组释放：\n\n```javascript\nexamples_earthquake_ui/code3.bufferWithTime.js\n\
    var table = document.getElementById('quakes_info');\nquakes\n  .pluck('properties')\n\
    \  .map(makeRow)\n  .bufferWithTime(500)\n  .filter(function(rows) { return rows.length\
    \ > 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      fragment.appendChild(row);\n    });\n\
    \    return fragment;\n  })\n  .subscribe(function(fragment) {\n    table.appendChild(fragment);\n\
    \  });\n```\n\n以下是新代码中发生的事情：\n\n- 1. 缓冲每个传入的值，并每 500 毫秒释放一批值。\n- 2. 无论如何，`bufferWithTime`\
    \ 每 500 毫秒执行一次，如果没有传入值，它将产生一个空数组。我们将过滤掉这些空数组。\n- 3. 我们将每一行插入到一个 *文档片段（document\
    \ fragment）* 中，这是一个没有父节点的文档。这意味着它不在 DOM 中，修改其内容非常快速且高效。\n- 4. 最后，我们将片段添加到 DOM\
    \ 中。添加片段的一个优点是它被视为单次操作，仅引起一次重绘。它还会将片段的子节点添加到与片段本身相同的元素中。\n\n通过使用缓冲区和片段，我们成功地在保持应用程序实时性的同时（最大延迟为\
    \ 0.5 秒），确保了行插入的性能。现在我们准备为仪表盘添加下一个功能：交互性！\n\n## 添加交互\n\n现在我们在地图和列表中都有地震数据，但两种表示形式之间还没有交互。例如，如果在列表中点击某个地震，能在地图上将其居中会很不错；或者当鼠标悬停在某一行时，能在地图上用圆圈突出显示该地震。让我们开始实现。\n\
    \n在 Leaflet 中，你可以在地图上绘图并将绘图放在它们自己的图层中，以便单独操作它们。让我们创建一个名为 quakeLayer 的图层组，用于存储所有地震圆圈。每个圆圈将是组内的一个图层。我们还将创建一个名为\
    \ codeLayers 的对象，用于存储地震代码与内部图层 ID 之间的对应关系，以便我们可以通过地震 ID 来引用圆圈：\n\n```javascript\n\
    // examples_earthquake_ui/code3.js\nvar codeLayers = {};\nvar quakeLayer = L.layerGroup([]).addTo(map);\n\
    ```\n\n现在，在 initialize 内部对 quakes Observable 的订阅中，我们将每个圆圈添加到图层组中并将其 ID 存储在 codeLayers\
    \ 中。如果这看起来有点复杂，是因为这是 Leaflet 允许我们引用地图中绘图的唯一方法。\n\n```javascript\n// examples_earthquake_ui/code3.js\n\
    quakes.subscribe(function(quake) {\n    var coords = quake.geometry.coordinates;\n\
    \    var size = quake.properties.mag * 10000;\n\n    var circle = L.circle([coords[1],\
    \ coords[0]], size).addTo(map);\n    quakeLayer.addLayer(circle);\n    codeLayers[quake.id]\
    \ = quakeLayer.getLayerId(circle);\n});\n```\n\n现在让我们创建悬停效果。我们将编写一个新函数 `isHovering`，它返回一个\
    \ Observable，该 Observable 在任何给定时刻发出一个布尔值，表示鼠标是否在某个特定的地震圆圈上：\n\n```javascript\n\
    // examples_earthquake_ui/code3.js\nvar identity = Rx.helpers.identity;\n\nfunction\
    \ isHovering(element) {\n    var over = Rx.DOM.mouseover(element).map(identity(true));\n\
    \    var out = Rx.DOM.mouseout(element).map(identity(false));\n\n    return over.merge(out);\n\
    }\n```\n\n- 1. `Rx.helpers.identity` 是恒等函数。给定参数 x，它返回 x。这样我们就不用编写返回其接收值的函数了。\n\
    - 2. `over` 是一个 Observable，当用户将鼠标悬停在元素上时发出 true。\n- 3. `out` 是一个 Observable，当用户将鼠标移出元素时发出\
    \ false。\n- 4. `isHovering` 合并了 `over` 和 `out`，返回一个在鼠标位于元素上时发出 true，离开时发出 false\
    \ 的 Observable。\n\n有了 `isHovering`，我们可以修改创建行的订阅，以便在每一行创建时订阅其事件：\n\n```javascript\n\
    examples_earthquake_ui/code3.js\nvar table = document.getElementById('quakes_info');\n\
    quakes\n  .pluck('properties')\n  .map(makeRow)\n  .bufferWithTime(500)\n  .filter(function(rows)\
    \ { return rows.length > 0; })\n  .map(function(rows) {\n    var fragment = document.createDocumentFragment();\n\
    \    rows.forEach(function(row) {\n      fragment.appendChild(row);\n    });\n\
    \    return fragment;\n  })\n  .subscribe(function(fragment) {\n    var row =\
    \ fragment.firstChild; // 从片段内部获取行\n    var circle = quakeLayer.getLayer([codeLayers[row.id]]);\n\
    \n    isHovering(row).subscribe(function(hovering) {\n      circle.setStyle({\
    \ color: hovering ? '#ff0000' : '#0000ff' });\n    });\n\n    Rx.DOM.click(row).subscribe(function()\
    \ {\n      map.panTo(circle.getLatLng());\n    });\n\n    table.appendChild(fragment);\n\
    \  })\n```\n\n- 1. 我们使用从行元素获取的 ID，通过 `codeLayers` 获得相应的内部 ID，然后使用 `quakeLayer.getLayer`\
    \ 获取地图上该地震的圆圈元素。\n"
