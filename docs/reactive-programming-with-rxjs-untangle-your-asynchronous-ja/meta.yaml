  - '[PAGE 46]


    There are two important things to know when using retry. First, if we don’t pass
    any parameters, it will retry indefinitely until the sequence is finished with
    no errors. This is dangerous for performance if the Observable keeps producing
    errors. If we’re using synchronous Observables, it would have the same effect
    as an infinite loop.


    Second, retry will always retry the whole Observable sequence again, even if some
    of the items didn’t error. This is important in case you’re causing any side effects
    when processing items, since they will be reapplied with every retry.


    # Making a Real-Time Earthquake Visualizer


    Using the concepts that we’ve covered so far in this chapter, we’ll build a web
    application that uses RxJS to show us where earthquakes are happening in real
    time. We’ll start by building a functional but naive reactive implementa- tion,
    and we’ll improve it as we go. The final result will look like this:


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_46_0.png)


    # Preparing Our Environment


    We’ll use the USGS (U.S. Geological Survey) earthquake database, ¹ which offers
    a real-time earthquake dataset in several formats. We will get our data from the
    weekly dataset in JSONP format.


    > 1. http://earthquake.usgs.gov/earthquakes/feed/v1.0/'
