    }\n\nvar ticksObservable = Rx.Observable\n    .interval(1000)\n    .map(updateDistance);\n\
    \nticksObservable.subscribe(function() {\n    console.log('Subscriber 1 - evenTicks:\
    \ ' + evenTicks + ' so far');\n});\n```\n```\n\nThis is the output we get after\
    \ the program has been running for four seconds:\n\n> Subscriber 1 - evenTicks:\
    \ 1 so far\nSubscriber 1 - evenTicks: 1 so far\nSubscriber 1 - evenTicks: 2 so\
    \ far\nSubscriber 1 - evenTicks: 2 so far\n\nNow, just for kicks, let's add another\
    \ subscriber to ticksObservable:"
