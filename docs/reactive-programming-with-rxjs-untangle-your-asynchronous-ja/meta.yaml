  - "[PAGE 123]\n\n# ## Cycle.js Drivers\n\nCycle.js drivers are functions we use\
    \ to cause side effects. Nowhere else in our programs should we be modifying state\
    \ in any way. Drivers take an Observable that emits data from our application,\
    \ and they return another Observable that causes the side effects.\n\nWe won’t\
    \ be creating drivers very often—only when we need side effects like modifying\
    \ the DOM, reading and writing from other interfaces (for example, Local Storage),\
    \ or making requests. In most applications we’ll need only the DOM driver (which\
    \ renders web pages) and the HTTP driver (which we can use to make HTTP requests).\
    \ In this example, we’ll use yet another one, the JSONP driver.\n\n# ## The User\
    \ Interface\n\nWe need actual content for our page, not just a `span`. Let’s make\
    \ a function that creates the virtual tree that represents our page:\n\n```\n\
    ```javascript\ncycle/index.js\nfunction vtreeElements(results) {\n    var h =\
    \ CycleDOM.h;\n    return h('div', [\n        h('h1', 'Wikipedia Search '),\n\
    \        h('input', {className: 'search-field', attributes: {type: 'text'}}),\n\
    \        h('hr'),\n        h('div', results.map(function(result) {\n         \
    \   return h('div', {\n                h('a', { href: WIKI_URL + result.title\
    \ }, result.title)\n            });\n        }))\n    ]);\n}\n```\n```\n\nThis\
    \ function might look a bit strange, but don’t panic. It is using *Virtual Hyperscript*,\
    \ a domain-specific language for creating virtual DOM trees. Virtual Hyperscript\
    \ contains a single method, called `h`. `h` declares nodes in a way similar to\
    \ how HTML does, but using JavaScript. We can add attributes to elements or append\
    \ children to them by passing extra objects or arrays as parameters to `h`. The\
    \ resulting virtual tree will eventually be rendered into real browser DOM.\n\n\
    vtreeElements takes an array of objects, results, and returns a virtual tree that\
    \ represents the simple UI for our app. It renders an input field and a listing\
    \ of links made from the objects in results, which eventually will contain Wikipedia’s\
    \ search results. We’ll use vtreeElements to render our application."
  - "[PAGE 124]\n\n# Using JSX\n\nInstead of using the `h` function, we could write\
    \ our UI using JSX, an XML-like syntax extension invented by Facebook that makes\
    \ writing virtual DOM structures easier and more readable. Our `vtreeElements`\
    \ function would look like this:\n\n```\ncycle/index.js\nfunction vtreeElementsJSX(results)\
    \ {\n    results = results.map(function(result) {\n        var link = WIKI_URL\
    \ + result.title;\n        return <div><a href={(link)}>{result.title}</a></div>\n\
    \    });\n\n    return <div>\n        <h1>Wikipedia Search</h1>\n        <input\
    \ className=\"search-field\" type=\"text\" />\n        <hr/>\n        <div>{results}</div>\n\
    \    </div>\n}\n```\n\nDoesn't it look nicer? JSX looks more familiar to developers\
    \ because it resembles HTML, but we can write it alongside JavaScript code, with\
    \ the added advantage that we can treat it as a JavaScript type. For example,\
    \ notice how we iterate the results array and we return a `<div>` element directly,\
    \ using the value of `link` and `result.title` in the element itself. (JavaScript\
    \ values can be inlined by putting them inside curly brackets.)\n\nSince JSX is\
    \ a syntax extension, we need a compiler that transforms it into the final JavaScript\
    \ code (which looks very much like our `h`-based code from the previous section).\
    \ We'll use *Babel* for that. Babel is a compiler that transforms modern JavaScript\
    \ into JavaScript that runs everywhere. ${}^3$ It also transforms some JavaScript\
    \ extensions, such as JSX, which is their particular use case.\n\nIf you want\
    \ to use JSX, you need to install Babel and use it when compiling the project.\
    \ Fortunately, Babel has an adapter for Browserify called *Babelify*:\n\n```\n\
