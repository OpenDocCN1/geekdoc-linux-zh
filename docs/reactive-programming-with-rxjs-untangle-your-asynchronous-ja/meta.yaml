    \ [1, 2]).toString()\n);\n\nassert.equal(\n    messages[1].toString(),\n    onNext(1001,\
    \ [3, 4, 5]).toString()\n);\n\nassert.equal(\n    messages[2].toString(),\n  \
    \  onCompleted(1100).toString()\n);\n});\n```\n\nLet’s go step by step through\
    \ the code:\n\n- 1. We start by loading some helper functions from `ReactiveTest`.\
    \ These register `onNext`, `onCompleted`, and subscribe events in virtual time.\n\
    - 2. We create a new `TestScheduler` that will drive the whole test.\n- 3. We\
    \ use the method `createHotObservable` from the `TestScheduler` to create a fake\
    \ hot Observable that will simulate notifications at particular points in virtual\
    \ time. In particular, it emits five notifications in the first second, and completes\
    \ at 1100 milliseconds. Every time it emits an object with a particular properties\
    \ property.\n- 4. We can use any test framework to run the tests. For our examples,\
    \ I’ve chosen `JUnit`.\n- 5. We use the `startScheduler` method to create an Observable\
    \ that uses a test Scheduler. The first parameter is a function that creates the\
    \ Observable to run with our Scheduler. In our case, we simply return our `quakeBatches`\
    \ function, to which we pass the `TestScheduler`. The second parameter is an object\
    \ containing the different virtual times at which we want to create the Observable,\
    \ subscribe to it, and dispose of it. For our example, we start and subscribe\
    \ at virtual time 0 and we dispose of the Observable at 1200 (virtual) milliseconds.\n\
    - 6. The `startScheduler` method returns an object with a scheduler and a messages\
    \ property. In messages we can find all the notifications emitted by the Observable\
    \ in virtual time.\n- 7. Our first assertion tests that after 501 milliseconds\
    \ (just after the first buffer time limit) our Observable yields the values 1\
    \ and 2.\n\nOur second assertion tests that after 1001 milliseconds our Observable\
    \ yields the remaining values 3, 4, and 5. And finally, our third assertion checks\
    \ that the sequence is completed exactly at 1100 milliseconds, as we specified\
    \ in our hot Observable `Observable quakes`.\n\nThat code effectively tests our\
    \ highly asynchronous Observables in a very reliable way, and without having to\
    \ jump through hoops to simulate asynchronous conditions. We simply specify the\
    \ times at which we want our code to react in virtual time, and we use a test\
    \ Scheduler to run the whole operation.\n\n## Wrapping Up\n\nSchedulers are an\
    \ essential part of RxJS. Even if you can go a long way without explicitly using\
    \ them, they are the advanced concept that will give you the edge to fine-tune\
    \ concurrency in your programs. The concept of virtual time is unique to RxJS\
    \ and is incredibly useful for tasks such as testing asynchronous code.\n\nIn\
    \ the next chapter we'll use Cycle.js, a reactive way to create amazing web apps,\
    \ based on a concept called *unidirectional dataflow*. With it, we'll create a\
    \ fast web application using modern techniques that improve dramatically on the\
    \ traditional way of making web apps.\n\n## CHAPTER 6: Reactive Web Applications\
    \ with Cycle.js\n\nWith the advent of single-page apps, websites are suddenly\
    \ expected to do much more, even compete against [gasp!] “native” apps. While\
    \ trying to make web applications faster, developers realized that particular\
    \ areas were bottlenecks keeping web applications from being as fast and robust\
    \ as their native counterparts.\n\nSpearheaded by Facebook React,¹ several web\
    \ frameworks are coming up with new techniques to make faster web applications\
    \ while keeping the code simple and declarative.\n\nIn this chapter we’ll cover\
    \ some new techniques to develop web applications that are here to stay, like\
    \ the Virtual DOM. We’ll be using Cycle.js, a modern, simple, and beautiful framework\
    \ that uses RxJS internally and applies reactive programming concepts to front-end\
    \ programming.\n\n### Cycle.js\n\nCycle.js is a small framework on top of RxJS\
    \ for creating responsive user interfaces. It offers the features present in modern\
    \ frameworks like React, such as virtual DOM and unidirectional dataflow.\n\n\
    Cycle.js is designed in a reactive way, and all the building blocks in Cycle.js\
    \ are Observables, which gives us enormous advantages. It is also simpler to grasp\
    \ than other frameworks because there are far fewer concepts to understand and\
    \ memorize. For example, all operations related to state are out of the way, encapsulated\
    \ in functions called drivers, and we rarely need to create new ones.\n\n> 1.\
    \ https://facebook.github.io/react/\n\n> **Joe asks: What’s the Virtual DOM?**\n\
    >\n> The Document Object Model (DOM) defines the tree structure of elements in\
    \ an HTML document. Every HTML element is a node in the DOM, and each node can\
    \ be manipulated using methods on the node.\n>\n> The DOM was originally created\
    \ to represent static documents, not the super-dynamic websites that we have today.\
    \ As a consequence, it was not designed to have good performance when the elements\
    \ in a DOM tree were updated frequently. That’s why when we make changes to the\
    \ DOM there’s a performance hit.\n>\n> The *virtual DOM* is a representation of\
    \ the DOM made in JavaScript. Every time we change state in a component, we recompute\
    \ a new virtual DOM tree for the component and compare it with the previous tree.\
    \ If there are differences, we render only those differences. This approach is\
    \ extremely fast, because comparing JavaScript objects is fast and we make only\
    \ the absolutely necessary changes to the “real” DOM.\n>\n> That approach means\
    \ we can write code as if we generated the whole app UI for every change. We don’t\
    \ have to keep track of state in the DOM. Behind the scenes, Cycle.js will check\
    \ if there is anything different for every update and take care of rendering our\
    \ app efficiently.\n\n### Installing Cycle.js\n\nWe could use Cycle.js by including\
    \ it in an HTML page using `<script></script>` tags, but that would not be the\
    \ best way to use it because Cycle.js is designed in an extremely modular way.\
    \ Every module tries to be as self-sufficient as possible, and including several\
    \ modules as scripts could easily load tons of duplicated code, causing unnecessary\
    \ downloads and longer start-up times for our applications.\n\nInstead, we’ll\
    \ use the Node Package Manager, `npm`, and *Browserify* to generate the code for\
    \ our final scripts. First we’ll create a new folder where the project will live,\
    \ and install our project dependencies:\n\n```bash\nmkdir wikipedia-search &&\
    \ cd wikipedia-search\nnpm install browserify\nnpm install @cycle/core\nnpm install\
    \ @cycle/dom\n```\n\nThe first `npm` command installs Browserify, which allows\
    \ us to write code for the browser as if it were a Node.js application.² With\
    \ Browserify, we can use Node.js’s module loader, and it will be smart about what\
    \ dependencies to include, making the code to download as small as possible. Next,\
    \ we install `cycle-core` and `cycle-dom`, which are the two base modules of Cycle.js.\n\
    \nWith this in place, we can create a file called `index.js` where we'll edit\
    \ our application, and we'll compile it into a file called `bundle.js` using the\
    \ local Browserify binary:\n\n```bash\ntouch index.js\n`npm bin`/browserify index.js\
    \ --outfile bundle.js\n```\n\nThe preceding command will go through our dependency\
    \ tree and create a `bundle.js` file that contains everything necessary to run\
    \ our application, including any dependencies we require in our code. We can directly\
    \ include `bundle.js` in our `index.html`:\n\n```html\n<!-- cycle/index.html -->\n\
    <!DOCTYPE html>\n<html>\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Wikipedia\
    \ search</title>\n  </head>\n  <body>\n    <div id=\"container\"></div>\n    <script\
    \ src=\"bundle.js\"></script>\n  </body>\n</html>\n```\n\n### Our Project: Wikipedia\
    \ Search\n\nIn this section we'll build an application that searches Wikipedia\
    \ as the user types.\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_121_0.png)\n\n\
    RxJS already makes retrieving and processing the remote data easy, but, as you\
    \ saw in Chapter 4. Building a Complete Web Application, on page 69, we still\
    \ need to jump through some hoops to make our DOM operations efficient.\n\nOne\
    \ of the objectives of Cycle.js is to completely eliminate DOM manipulation from\
    \ our code. Let's start with some basic scaffolding:\n\n```javascript\n// cycle/step1.js\n\
    var Cycle = require('@cycle/core');\nvar CycleDOM = require('@cycle/dom')\nvar\
    \ Rx = Cycle.Rx;\n\nfunction main(responses) {\n  return {\n    DOM: Rx.Observable.just(CycleDOM.h('span',\
    \ 'Hi there!'))\n  };\n}\n\nvar drivers = {\n  DOM: CycleDOM.makeDOMDriver('#container')\n\
    };\n\nCycle.run(main, drivers);\n```\n\nThis code shows the text *Hi there!* onscreen,\
    \ but there's already quite a lot going on. The important parts are the `main`\
    \ function and the `drivers` object. Let's go through the steps:\n\n- 1. We require\
    \ Cycle Core and the Cycle DOM driver. I'll explain what a Cycle.js driver is\
    \ in the next section.\n- 2. The `main` function is always the entry point for\
    \ our application. It returns a collection of Observables, one for each driver\
    \ in the application. So far, we're only using one driver: the `DOM` driver.\n\
    - 3. The Observable for the DOM driver emits a virtual tree, which we create using\
    \ the `h` method in the Cycle DOM library. In this case, we create only a single\
    \ `span` element with the text 'Hi there!'. The DOM driver consumes that virtual\
    \ tree and renders the actual DOM on the page from it.\n- 4. We create a DOM driver\
    \ that will build the DOM tree from the items emitted by the `main` function.\
    \ The DOM tree will be built in the element or selector that we pass as a parameter.\
    \ In this case, `#container`.\n- 5. The `Cycle.run` connects the `main` function\
    \ with the `drivers` object, creating a circular flow between the two.\n\n> 2.\
    \ http://browserify.org/"
