    ```\n\n在前面的代码中，我们将 Node.js 的 `fs.readdir` 方法变成了一个 Observable `readdir`。`fs.readdir`\
    \ 接收一个目录路径和一个回调函数，该回调函数在目录内容检索完成后被调用。\n\n我们使用与传递给原始 `fs.readdir` 相同的参数来调用 `readdir`，但去掉了回调函数。这会返回一个\
    \ Observable，当我们为其订阅一个 Observer 时，它将正确地使用 `onNext`、`onError` 和 `onCompleted`。\n\
    \n## 本章小结\n\n在本章中，我们探讨了响应式编程方法，并了解了 RxJS 如何通过 Observables 解决回调或 Promise 等其他方法带来的问题。现在你理解了为什么\
    \ Observables 功能强大，并且知道如何创建它们。有了这个基础，我们现在可以去创建更有趣的响应式程序。下一章将向你展示如何创建和组合基于序列的程序，为\
    \ Web 开发中的一些常见场景提供一种更“Observable”的方法。\n\n# 第二章：深入序列\n\n我童年时记得玩过一款解谜视频游戏，在游戏中你必须使用各种技巧引导一股落下的水流穿过屏幕。你可以将水流分开，稍后再将其合并，或者使用倾斜的木板来改变方向。你必须发挥创造力才能让水流到达最终目标。\n\
    \n我发现那个游戏与处理 Observable 序列之间有很多相似之处。Observables 就像是我们可以转换、组合和查询的事件流。无论我们处理的是简单的\
    \ Ajax 回调，还是在 Node.js 中处理数 GB 的数据，都没有区别。我们声明流的方式是一样的。一旦我们开始以“流”的方式思考，程序的复杂度就会降低。\n\
    \n在本章中，我们重点讨论如何在程序中有效地使用序列。到目前为止，我们已经涵盖了如何创建 Observables 以及如何对其进行简单操作。为了释放它们的威力，我们必须知道如何将程序的输入和输出转化为承载程序流程的序列。\n\
    \n在实际动手之前，我们将学习一些有助于我们开始操作序列的基础运算符。接着，我们将实现一个显示（几乎）实时发生地震的真实应用程序。让我们开始吧！\n\n##\
    \ 可视化 Observables\n\n你即将学习一些我们在 RxJS 程序中最经常使用的运算符。讨论运算符对序列的作用可能会让人觉得很抽象。为了帮助开发者以简单的方式理解运算符，我们将使用一种标准的序列视觉表示法，称为*大理石图（marble\
    \ diagrams）*。它们直观地表示异步数据流，你会在每一个 RxJS 相关资源中发现它们。\n"
