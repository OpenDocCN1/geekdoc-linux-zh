  md: "This makes the developer's life much easier. You can rest assured that when\
    \ manipulating sequences, RxJS will do only as much work as necessary. This way\
    \ of operating is called `lazy evaluation`, and it is very common in functional\
    \ languages such as Haskell and Miranda.\n\n# RxJS's Subject Class\n\nA Subject\
    \ is a type that implements both Observer and Observable types. As an Observer,\
    \ it can subscribe to Observables, and as an Observable it can produce values\
    \ and has Observers subscribe to it.\n\nIn some scenarios a single Subject can\
    \ do the work of a combination of Observers and Observables. For example, for\
    \ making a proxy object between a data source and the Subject's listeners, we\
    \ could use this:\n\n```\n```javascript\nspaceship_reactive/subjects.js\nvar subject\
    \ = new Rx.Subject();\nvar source = Rx.Observable.interval(300)\n  .map(function(v)\
    \ { return 'Interval message #' + v; })\n  .take(5);\n\nsource.subscribe(subject);\n\
    \nvar subscription = subject.subscribe({\n  function onNext(x) { console.log('onNext:\
    \ ' + x); },\n  function onError(e) { console.log('onError: ' + e.message); },\n\
    \  function onCompleted() { console.log('onCompleted'); }\n});\n\nsubject.onNext('Our\
    \ message #1');\nsubject.onNext('Our message #2');\n\nsetTimeout(function() {\n\
    \  subject.onCompleted();\n}, 1000);\n```\n```\n\nOutput:\n\n> onNext: Our message\
    \ #1\n> onNext: Our message #2\n> onNext: Interval message #0\n> onNext: Interval\
    \ message #1\n> onNext: Interval message #2\n> onCompleted\n\nIn the preceding\
    \ example we create a new Subject and a source Observable that emits an integer\
    \ every second. Then we subscribe the Subject to the Observable. After that, we\
    \ subscribe an Observer to the Subject itself. The Subject now behaves as an Observable."
  merge: -1
  pgno: 62
- img_proc: true
  md: "Next we make the Subject emit values of its own (message1 and message2). In\
    \ the final result, we get the Subject's own messages and then the proxied values\
    \ from the source Observable. The values from the Observable come later because\
    \ they are asynchronous, whereas we made the Subject's own values immediate. Notice\
    \ that even if we tell the source Observable to take the first five values, the\
    \ output shows only the first three. That's because after one second we call onCompleted\
    \ on the Subject. This finishes the notifications to all subscriptions and overrides\
    \ the take operator in this case.\n\nThe Subject class provides the base for creating\
    \ more specialized Subjects. In fact, RxJS comes with some interesting ones: AsyncSubject,\
    \ ReplaySubject, and BehaviorSubject.\n\n# AsyncSubject\n\nAsyncSubject emits\
    \ the last value of a sequence only if the sequence completes. This value is then\
    \ cached forever, and any Observer that subscribes after the value has been emitted\
    \ will receive it right away. AsyncSubject is convenient for asynchronous operations\
    \ that return a single value, such as Ajax requests.\n\nLet's see a simple example\
    \ of an AsyncSubject subscribing to a range:\n\n```\n```javascript\nspaceship_reactive/subjects.js\n\
    var delayedRange = Rx.Observable.range(0, 5).delay(1000);\nvar subject = new Rx.AsyncSubject();\n\
    \ndelayedRange.subscribe(subject);\n\nsubject.subscribe({\n  function onNext(item)\
    \ { console.log('Value:', item) },\n  function onError(err) { console.log('Error:',\
    \ err) },\n  function onCompleted() { console.log('Completed.') }\n});\n```\n\
    ```\n\nIn that example, delayedRange emits the values 0 to 4 after a delay of\
    \ a second. Then we create a new AsyncSubject and subscribe it to delayedRange.\
    \ The output is the following:\n\n> Value: 4\nCompleted.\n\nAs expected, we get\
    \ only the last value that the Observer emits. Let's now use AsyncSubject for\
    \ a more realistic scenario. We'll retrieve some remote content:\n\n```\n```javascript\n\
    spaceship_reactive/subjects.js\nfunction getProducts(url) {\n  var subject;\n\
    ```\n```"
