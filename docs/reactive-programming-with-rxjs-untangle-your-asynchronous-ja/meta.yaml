- img_proc: true
  md: "Video games notoriously keep a lot of external state—scores, screen coordinates\
    \ for the characters, timers, and so on. Our plan is to build the whole game without\
    \ relying on a single external variable that keeps state.\n\nIn our game, the\
    \ player will move the spaceship horizontally using the mouse, and will shoot\
    \ by clicking the mouse or tapping the spacebar. Our game will have four main\
    \ actors: the moving star field in the background, the player’s spaceship, the\
    \ enemies, and the shots from both the player and the enemies.\n\nIt will look\
    \ like this:\n\n![](img/a8eed7bbb390e0eff6b6561c329a113c_68_0.png)\n\nIn the screenshot,\
    \ the red triangle is our spaceship and the green ones are the enemies. The tinier\
    \ triangles are the fired shots.\n\nLet's start by setting the stage; this will\
    \ be our HTML file:\n\n```\n```html\nspaceship_reactive/spaceship.html\n<!DOCTYPE\
    \ html>\n<html>\n  <head>\n    <meta charset=\"utf-8\">\n    <title>Spaceship\
    \ Reactive!</title>\n    <script src=\"../rx.all-4.0.0.js\"></script>\n    <style>\n\
    \      html, body {\n```\n```"
  merge: -1
  pgno: 68
- img_proc: true
  md: "```\n```html\n            margin: 0;\n            padding: 0;\n        }\n\
    \    </style>\n</head>\n<body>\n    <script src=\"spaceship.js\"></script>\n</body>\n\
    </html>\n```\n```\n\nIt's just a simple HTML file that loads the JavaScript file\
    \ we'll be working with for the rest of the chapter. In that JavaScript file,\
    \ we start by setting up a canvas element where we'll render our game:\n\n```\n\
    ```javascript\nspaceship_reactive/starfield_1.js\nvar canvas = document.createElement('canvas');\n\
    var ctx = canvas.getContext(\"2d\");\ndocument.body.appendChild(canvas);\ncanvas.width\
    \ = window.innerWidth;\ncanvas.height = window.innerHeight;\n```\n```\n\nWith\
    \ this in place we can start describing our game's components. First let's draw\
    \ our starry background.\n\n# ## Creating the Star Field\n\nThe first things we\
    \ need for a game set in space are stars. We'll create a star field that scrolls\
    \ down to give the feeling of traveling through space. For this, we'll first generate\
    \ the stars using the range operator:\n\n```\n```javascript\nspaceship_reactive/starfield_1.js\n\
    VAR SPEED = 40;\nVAR STAR_NUMBER = 250;\nvar StarStream = Rx.Observable.range(1,\
    \ STAR_NUMBER)\n    .map(function() {\n        return {\n            x: parseInt(Math.random()\
    \ * canvas.width),\n            y: parseInt(Math.random() * canvas.height),\n\
    \            size: Math.random() * 3 + 1\n        };\n    })\n```\n```\n\nEach\
    \ star will be represented by an object that contains random coordinates and a\
    \ size between 1 and 4. This code will give us a stream that generates 250 of\
    \ these \"stars.\"\n\nWe want these stars to keep moving. A way to do that is\
    \ to increase the y-coordinate every few milliseconds for all stars. We'll transform\
    \ the StarStream Observable into an array using toArray, which will then emit\
    \ an array containing"
  merge: -1
  pgno: 69
- img_proc: true
  md: "all the objects generated by range. Then we can pick up that with an array\
    \ with a `flatMap` operator that will transform the Observable into one that yields\
    \ a value every few milliseconds. Using map we can increase the y-coordinate in\
    \ each item of the original array:\n\n```\n```javascript\nspaceship_reactive/starfield_1.js\n\
    var SPEED = 40;\nvar STAR_NUMBER = 250;\nvar starStream = Rx.Observable.range(1,\
    \ STAR_NUMBER)\n  .map(function() {\n    return {\n      x: parseInt(Math.random()\
    \ * canvas.width),\n      y: parseInt(Math.random() * canvas.height),\n      size:\
    \ Math.random() * 3 + 1\n    };\n  })\n  .toArray()\n  .flatMap(function(starArray)\
    \ {\n    return Rx.Observable.interval(SPEED).map(function() {\n      starArray.forEach(function(star)\
    \ {\n        if (star.y >= canvas.height) {\n          star.y = 0; // Reset star\
    \ to top of the screen\n        }\n        star.y += 3; // Move star\n      });\n\
    \      return starArray;\n    });\n  });\n```\n```\n\nInside map we check if the\
    \ star y-coordinate is already outside the screen, and in this case we reset it\
    \ to 0. By changing the coordinates in every star object we can keep using the\
    \ same array of stars all the time.\n\nNow we need a small helper function that\
    \ “paints” an array of stars on our canvas:\n\n```\n```javascript\nspaceship_reactive/starfield_1.js\n\
    function paintStars(stars) {\n  ctx.fillStyle = '#000000';\n  ctx.fillRect(0,\
    \ 0, canvas.width, canvas.height);\n  ctx.fillStyle = '#ffffff';\n  stars.forEach(function(star)\
    \ {\n    ctx.fillRect(star.x, star.y, star.size, star.size);\n  });\n}\n```\n\
    ```\n\npaintStars paints a black background and draws the stars on the canvas.\
    \ The only thing left to achieve a moving star field is to subscribe to the Observable\
    \ and call paintStars with the resulting array. Here’s the final code:"
