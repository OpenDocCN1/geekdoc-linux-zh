    \ { console.log('Done!'); });\n```\n```\n\nIn the preceding code, we make an Observable\
    \ `Observable` `readdir` out of `Node.js`'s `fs.readdir` method. `fs.readdir`\
    \ accepts a directory path and a callback function `delayedMsg`, which calls once\
