  md: "\"Hi there!\"\n\"Total time: 5423ms\"\n\nBecause the Observer using the `default`\
    \ Scheduler emits its items asynchronously, our `console.log` statement (which\
    \ is synchronous) is executed before the Observable even starts emitting any notification.\
    \ Using the `currentThread` Scheduler, all notifications happen synchronously,\
    \ so the `console.log` statement gets executed only when the Observable has emitted\
    \ all its notifications.\n\nSo, Schedulers really can change how our Observables\
    \ work. In our case here, performance really suffered from asynchronously processing\
    \ a big, already-available array. But we can actually use Schedulers to improve\
    \ performance. For example, we can switch the Scheduler on the fly before doing\
    \ expensive operations on an Observable:\n\n```\n```javascript\narr\n  .groupBy(function(value)\
    \ {\n    return value % 2 === 0;\n  })\n  .map(function(value) {\n    return value.observeOn(Rx.Scheduler.default);\n\
    \  })\n  .map(function(groupedObservable) {\n    return expensiveOperation(groupedObservable);\n\
    \  });\n```\n```\n\nIn the preceding code we group all the values in the array\
    \ into two groups: even and uneven values. `groupBy` returns an Observable that\
    \ emits an Observable for each group created. And here's the cool part: just before\
    \ running an expensive operation on the items in each grouped Observable, we use\
    \ `observeOn` to switch the Scheduler to the default one, so that the expensive\
    \ operation will be executed asynchronously, not blocking the event loop.\n\n\
    # observeOn and subscribeOn\n\nIn the previous section, we used the `observeOn`\
    \ operator to change the Scheduler in some Observables. `observeOn` and `subscribeOn`\
    \ are instance operators that return a copy of the Observable instance, but that\
    \ use the Scheduler we pass as a parameter.\n\n`observeOn` takes a Scheduler and\
    \ returns a new Observable that uses that Scheduler. It will make every `onNext`\
    \ call run in the new Scheduler.\n\n`subscribeOn` forces the subscription and\
    \ an un-subscription work (not the notifications) of an Observable to run on a\
    \ particular Scheduler. Like `observeOn`, it accepts a Scheduler as a parameter.\
    \ `subscribeOn` is useful when, for example,"
