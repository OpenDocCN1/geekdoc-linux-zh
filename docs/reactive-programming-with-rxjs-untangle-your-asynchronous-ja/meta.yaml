    \ Observer 共享同一个 Observable，但它们并没有共享完全相同的数值序列。如果我们希望 Observer 共享同一个序列，我们需要一个热\
    \ Observable。\n\n## 使用 publish 从冷转热\n\n我们可以使用 `publish` 将一个冷 Observable 转换为热 Observable。调用\
    \ `publish` 会创建一个新的 Observable，它充当原 Observable 的代理。它通过自身订阅原 Observable，并将接收到的值推送给它的订阅者来实现这一点。\n\
    \n一个 *已发布（published）* 的 Observable 实际上是一个 `ConnectableObservable`，它有一个额外的名为 `connect`\
    \ 的方法，我们调用该方法来开始接收值。这允许我们在它开始运行之前对其进行订阅：\n\n```javascript\nhot_cold.js\n// 创建一个每秒产生一个值的\
