    \ &&\n           obj.y > -40 && obj.y < canvas.height + 40;\n}\n\nvar ENEMY_FREQ\
    \ = 1500;\nvar ENEMY_SHOOTING_FREQ = 750;\nvar Enemies = Rx.Observable.interval(ENEMY_FREQ)\n\
    \    .scan(function(enemyArray) {\n        var enemy = {\n            x: parseInt(Math.random()\
    \ * canvas.width),\n            y: -30,\n            shots: []\n        };\n\n\
    \        Rx.Observable.interval(ENEMY_SHOOTING_FREQ).subscribe(function() {\n\
    \            enemy.shots.push({x: enemy.x, y: enemy.y});\n            enemy.shots\
    \ = enemy.shots.filter(isVisible);\n        });\n\n        enemyArray.push(enemy);\n\
    \        return enemyArray.filter(isVisible);\n    }, []);\n```\n\nIn that code\
    \ we create an interval every time we create a new enemy. This interval will keep\
    \ adding shots to the enemy array of shots, and then it will filter out the ones\
    \ outside the screen. We can use isVisible to filter out enemies that are outside\
    \ the screen, too, as we do in the return statement.\n\nWe need to update paintEnemies\
    \ so that it renders enemy shots and updates their y-coordinates. Then we use\
    \ our handy drawTriangle function to draw the shots:\n\n```javascript\nspaceship_reactive/enemy_shots.js\n\
    function paintEnemies(enemies) {\n    enemies.forEach(function(enemy) {\n    \
    \    enemy.y += 5;\n        enemy.x += getRandomInt(-15, 15);\n\n        drawTriangle(enemy.x,\
    \ enemy.y, 20, '#00ff00', 'down');\n\n        enemy.shots.forEach(function(shot)\
    \ {\n            shot.y += SHOOTING_SPEED;\n            drawTriangle(shot.x, shot.y,\
    \ 5, '#00ffff', 'down');\n        });\n    });\n}\n```"
  mdcn: "\n请注意 `sample` 如何在时间间隔到时，丢弃最后一个值之前的所有值。考虑你是否需要这种行为非常重要。在我们的案例中，我们不在意丢弃这些值，因为我们只想每\
    \ 40 毫秒渲染一次每个元素的当前状态。如果所有值对你都很重要，你可能需要考虑使用 buffer 运算符：\n\n```javascript\nspaceship_reactive/enemy_2.js\n\
    Rx.Observable.combineLatest(\n  StarStream, SpaceShip, Enemies,\n  function(stars,\
    \ spaceship, enemies) {\n    return {\n      stars: stars,\n      spaceship: spaceship,\n\
    \      enemies: enemies\n    };\n  }\n)\n.sample(SPEED)\n.subscribe(renderScene);\n\
    ```\n\n通过在 `combineLatest` 之后调用 `sample`，我们可以确保 `combineLatest` 产生任何值的间隔不会快于 40\
    \ 毫秒（我们的常量 SPEED 设置为 40）。\n\n### 射击\n\n看到成群的敌人向我们袭来有点可怕；我们能做的就是避其锋芒，希望他们没发现我们。如果我们给我们的英雄增加向邪恶的外星飞船射击的能力会怎样？\n\
    \n我们希望在点击鼠标或按下空格键时，飞船都能进行射击，因此我们将为每个事件创建一个 Observable，并将它们合并为一个名为 `playerShots`\
    \ 的单一 Observable。注意，我们通过空格键的键码 32 对 `keydown` Observable 进行了过滤：\n\n```javascript\n\
    spaceship_reactive/hero_shots.js\nvar playerFiring = Rx.Observable\n  .merge(\n\
    \    Rx.Observable.fromEvent(canvas, 'click'),\n    Rx.Observable.fromEvent(canvas,\
    \ 'keydown')\n      .filter(function(evt) { return evt.keycode === 32; })\n  )\n\
    ```\n\n既然我们知道了 sample，我们可以用它来给游戏增加趣味，并限制飞船的射击频率。否则，玩家可以用极快的速度射击并太轻易地摧毁所有敌人。我们将设置成玩家最多每\
    \ 200 毫秒才能射击一次：\n\n```javascript\nspaceship_reactive/hero_shots.js\nvar playerFiring\
    \ = Rx.Observable\n  .merge(\n    Rx.Observable.fromEvent(canvas, 'click'),\n\
    \    Rx.Observable.fromEvent(canvas, 'keydown')\n      .filter(function(evt) {\
    \ return evt.keycode === 32; })\n  )\n  .sample(200)\n  .timestamp();\n```\n\n\
    我们还添加了一个 timestamp 运算符，它在 Observable 发出的每个值中设置一个 `timestamp` 属性，记录它发出的准确时间。我们稍后会用到它。\n\
    \n最后，为了让飞船发射子弹，我们需要知道射击瞬间飞船的 x 坐标。这样我们才能在正确的 x 坐标处渲染子弹。虽然设置一个外部变量来记录 SpaceShip\
    \ Observable 发出的最后一个 x 坐标很诱人，但这会破坏我们“绝不修改外部状态”的潜规则！\n\n相反，我们将再次使用我们的好朋友 combineLatest\
    \ 来实现这一点：\n\n```javascript\nspaceship_reactive/hero_shots.js\nvar HeroShots =\
    \ Rx.Observable\n  .combineLatest(\n    playerFiring,\n    SpaceShip,\n    function(shotEvents,\
    \ spaceShip) {\n      return { x: spaceShip.x };\n    }\n  )\n  .scan(function(shotArray,\
    \ shot) {\n    shotArray.push({x: shot.x, y: HERO_Y});\n    return shotArray;\n\
    \  }, []);\n```\n\n现在我们能从 `spaceShip` 和 `playerFiring` 获取更新后的值，从而得到我们想要的 x 坐标。我们使用\
    \ `scan` 的方式与之前在 Enemy Observable 中的用法相同，为每颗子弹创建一个当前坐标数组。至此，我们应该准备好在屏幕上绘制子弹了。我们使用一个辅助函数来绘制子弹数组中的每一颗子弹：\n\
    \n```javascript\nspaceship_reactive/hero_shots.js\nvar SHOOTING_SPEED = 15;\n\
    function paintHeroShots(heroShots) {\n  heroShots.forEach(function(shot) {\n \
    \   shot.y -= SHOOTING_SPEED;\n    drawTriangle(shot.x, shot.y, 5, '#ffff00',\
    \ 'up');\n  });\n}\n```\n\n然后，我们在主 `combineLatest` 操作中调用 `paintHeroShots`：\n\n\
    ```javascript\nRx.Observable.combineLatest(\n  StarStream, Spaceship, Enemies,\
    \ HeroShots,\n  function(stars, spaceship, enemies, heroShots) {\n    return {\n\
    \      stars: stars,\n      spaceship: spaceship,\n      enemies: enemies,\n \
    \     heroShots: heroShots\n    };\n  }\n)\n.sample(SPEED)\n.subscribe(renderScene);\n\
    ```\n\n并在 `renderScene` 内部添加对 `paintHeroShots` 的调用：\n\n```javascript\nfunction\
    \ renderScene(actors) {\n  paintStars(actors.stars);\n  paintSpaceShip(actors.spaceship.x,\
    \ actors.spaceship.y);\n  paintEnemies(actors.enemies);\n  paintHeroShots(actors.heroShots);\n\
    }\n```\n\n现在当你运行游戏时，你会注意到 *每当你移动鼠标，我们的飞船就会发射惊人数量的子弹*。作为一种效果还不赖，但这并不是我们想要的！让我们再次观察\
    \ HeroShots Observable。在其中，我们使用 `combineLatest` 以便同时拥有 `playerFiring` 和 `spaceShip`\
    \ 的值。这看起来像我们之前遇到的问题。HeroShots 中的 `combineLatest` 在鼠标每次移动时都会发出值，而这被转化为了射击行为。在这种情况下，节流（Throttling）没有帮助，因为我们希望用户在想射击时随时能射击，而节流会限制射击数量并丢弃许多射击指令。\n\
    \ncombineLatest 在任何一个 Observable 发出新值时，都会发出每个 Observable 之前发出的最后一个值。我们可以利用这一点。每当鼠标移动时，combineLatest\
    \ 会发出新的 SpaceShip 位置和 playerFiring 最后发出的值（除非我们发射新子弹，否则该值保持不变）。然后，我们可以仅在发出的子弹与前一个不同时才发出一个值。distinctUntilChanged\
    \ 运算符可以帮我们完成这项繁重的工作。\n\ndistinct 和 distinctUntilChanged 运算符允许我们过滤掉 Observable\
    \ 已经发出的结果。distinct 过滤掉任何之前发出过的值，而 distinctUntilChanged 则过滤掉连续重复的结果（除非中间发出过不同的值）。我们只需要确保新子弹与前一个不同，因此\
    \ distinctUntilChanged 对我们来说就足够了。（它还避免了 distinct 较高的内存占用；distinct 需要在内存中保留所有之前的结果。）\n\
    \n我们修改 heroShots，使其基于时间戳仅发出新子弹：\n\n```javascript\nspaceship_reactive/hero_shots2.js\n\
    var HeroShots = Rx.Observable\n    .combineLatest(\n        playerFiring,\n  \
    \      SpaceShip,\n        function(shotEvents, spaceShip) {\n            return\
    \ {\n                timestamp: shotEvents.timestamp,\n                x: spaceShip.x\n\
    \            };\n        }\n    )\n    .distinctUntilChanged(function(shot) {\
    \ return shot.timestamp; })\n    .scan(function(shotArray, shot) {\n        shotArray.push({\
    \ x: shot.x, y: HERO_Y });\n        return shotArray;\n    }, []);\n```\n\n如果一切顺利，我们现在能够用飞船射击敌人了！\n\
    \n### 敌人射击\n\n我们也应该允许敌人射击；否则这个宇宙太不公平了，而且很无聊！对于敌人射击，我们将执行以下操作：\n\n- 每个敌人将维护一个包含其自身子弹的更新数组。\n\
    - 每个敌人将以给定的频率射击。\n\n为此，我们将使用 interval 运算符将新子弹存储在敌人值中。我们还将引入一个新的辅助函数 isVisible，用于过滤掉坐标在可见屏幕之外的元素。以下是现在的\
    \ Enemy Observable 样子：\n\n```javascript\nspaceship_reactive/enemy_shots.js\nfunction\
    \ isVisible(obj) {\n    return obj.x > -40 && obj.x < canvas.width + 40 &&\n \
    \          obj.y > -40 && obj.y < canvas.height + 40;\n}\n\nvar ENEMY_FREQ = 1500;\n\
    var ENEMY_SHOOTING_FREQ = 750;\nvar Enemies = Rx.Observable.interval(ENEMY_FREQ)\n\
    \    .scan(function(enemyArray) {\n        var enemy = {\n            x: parseInt(Math.random()\
    \ * canvas.width),\n            y: -30,\n            shots: []\n        };\n\n\
    \        Rx.Observable.interval(ENEMY_SHOOTING_FREQ).subscribe(function() {\n\
    \            enemy.shots.push({x: enemy.x, y: enemy.y});\n            enemy.shots\
    \ = enemy.shots.filter(isVisible);\n        });\n\n        enemyArray.push(enemy);\n\
    \        return enemyArray.filter(isVisible);\n    }, []);\n```\n\n在上述代码中，我们每次创建新敌人时都会创建一个\
    \ interval。这个 interval 将不断向敌人的子弹数组中添加子弹，然后过滤掉屏幕外的子弹。我们同样可以在 return 语句中使用 isVisible\
    \ 来过滤掉屏幕外的敌人。\n\n我们需要更新 paintEnemies，使其能够渲染敌人的子弹并更新它们的 y 坐标。然后，我们使用便捷的 drawTriangle\
    \ 函数来绘制子弹：\n\n```javascript\nspaceship_reactive/enemy_shots.js\nfunction paintEnemies(enemies)\
    \ {\n    enemies.forEach(function(enemy) {\n        enemy.y += 5;\n        enemy.x\
    \ += getRandomInt(-15, 15);\n\n        drawTriangle(enemy.x, enemy.y, 20, '#00ff00',\
    \ 'down');\n\n        enemy.shots.forEach(function(shot) {\n            shot.y\
    \ += SHOOTING_SPEED;\n            drawTriangle(shot.x, shot.y, 5, '#00ffff', 'down');\n\
    \        });\n    });\n}\n```\n"
