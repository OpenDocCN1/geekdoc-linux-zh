    \ that we are also changing the x-coordinate randomly so that enemies move a bit\
    \ unpredictably to the sides. Now we need to update the function `renderScene`\
    \ to include a call to `paintEnemies`.\n\nYou might have noticed a strange effect\
    \ while playing the game we have so far: if you move the mouse, the enemies go\
    \ faster toward you! That *could* be a nice feature in the game, but we definitely\
    \ didn't intend to do that. Can you guess what causes this bug?\n\nIf you guessed\
    \ that it was related to the `paintEnemies` function, you're right on the money.\
    \ `combineLatest` renders our scene whenever any of the Observables yields a value.\
    \ If we don't move the mouse, the fastest emitter will always be `starStream`\
    \ because it has an interval of 40 milliseconds (the Enemies Observable emits\
    \ only every 1,500 milliseconds). When we move the mouse, though, `SpaceShip`\
    \ will emit faster than `starStream` (your mouse emits coordinates *many* times\
    \ per second), and `paintEnemies` will then execute that many times, increasing\
    \ the enemies' coordinates much faster.\n\nTo avoid this scenario and similar\
    \ problems in the future, we need to normalize the game's speed so that no Observable\
    \ can emit values faster than our chosen speed for the game.\n\nAnd yes, as you\
    \ may have guessed, RxJS has an operator for that.\n\n# ### Avoid Drinking from\
    \ the Firehose\n\nThere is such a thing as receiving data too fast. Most of the\
    \ time we want all the speed we can get, but depending on the frequency at which\
    \ the Observable streams values, we might want to drop some of the values we receive.\
    \ We're now in one of these scenarios. The speed at which we render things onscreen\
    \ is proportional to the speed of the fastest Observable we have. It turns out\
    \ that our fastest Observable is too fast for us, and we need to establish a constant\
    \ update speed in the game.\n\n`sample` is a method in Observable instances that,\
    \ given a time parameter in milliseconds, returns an Observable that emits the\
    \ last value emitted by the parent Observable in each time interval."
- md: "Notice how `sample` drops any values before the last value at the moment of\
    \ the interval. It's important to consider whether you want this behavior. In\
    \ our case, we don't care about dropping values because we just want to render\
    \ the current state of each element every 40 milliseconds. If all the values are\
    \ important to you, you might want to consider the buffer operator:\n\n```javascript\n\
    spaceship_reactive/enemy_2.js\nRx.Observable.combineLatest(\n  StarStream, SpaceShip,\
    \ Enemies,\n  function(stars, spaceship, enemies) {\n    return {\n      stars:\
    \ stars,\n      spaceship: spaceship,\n      enemies: enemies\n    };\n  }\n)\n\
    .sample(SPEED)\n.subscribe(renderScene);\n```\n\nBy calling `sample` after `combineLatest`\
    \ we make sure that `combineLatest` will never yield any value faster than 40\
    \ milliseconds after the previous one (our constant SPEED is set to 40).\n\n###\
    \ Shooting\n\nIt's a bit scary seeing the hordes of enemies coming at us; all\
    \ we can do about it is move out of the way and hope they don't see us. How about\
    \ we give our hero the ability to shoot at the evil alien spaceships?\n\nWe want\
    \ our spaceship to shoot whenever we click the mouse or press the spacebar, so\
    \ we'll create an Observable for each event and merge them into a single Observable\
    \ called `playerShots`. Notice that we filter the `keydown` Observable by the\
    \ key code of the spacebar, 32:\n\n```javascript\nspaceship_reactive/hero_shots.js\n\
    var playerFiring = Rx.Observable\n  .merge(\n    Rx.Observable.fromEvent(canvas,\
    \ 'click'),\n    Rx.Observable.fromEvent(canvas, 'keydown')\n      .filter(function(evt)\
    \ { return evt.keycode === 32; })\n  )\n```\n\nNow that we know about sample,\
    \ we can use it to spice up the game and limit the shooting frequency of our spaceship.\
    \ Otherwise, the player could shoot at high speed and destroy all enemies too\
    \ easily. We'll make it so that the player can shoot only every 200 milliseconds\
    \ at most:\n\n```javascript\nspaceship_reactive/hero_shots.js\nvar playerFiring\
    \ = Rx.Observable\n  .merge(\n    Rx.Observable.fromEvent(canvas, 'click'),\n\
    \    Rx.Observable.fromEvent(canvas, 'keydown')\n      .filter(function(evt) {\
    \ return evt.keycode === 32; })\n  )\n  .sample(200)\n  .timestamp();\n```\n\n\
    We've also added a timestamp operator, which sets a property `timestamp` in every\
    \ value our Observable emits, with the exact time it is emitted. We'll use it\
    \ later.\n\nFinally, to fire shots from our spaceship we need to know the x-coordinate\
    \ of the spaceship at the firing moment. This is so we can render the shot at\
    \ the correct x-coordinate. It may be tempting to set an external variable from\
    \ the SpaceShip Observable that always contains the last x-coordinate emitted,\
    \ but that would be breaking our unwritten agreement to never mutate external\
    \ state!\n\nInstead we'll accomplish this by using our good friend combineLatest\
    \ again:\n\n```javascript\nspaceship_reactive/hero_shots.js\nvar HeroShots = Rx.Observable\n\
    \  .combineLatest(\n    playerFiring,\n    SpaceShip,\n    function(shotEvents,\
    \ spaceShip) {\n      return { x: spaceShip.x };\n    }\n  )\n  .scan(function(shotArray,\
    \ shot) {\n    shotArray.push({x: shot.x, y: HERO_Y});\n    return shotArray;\n\
    \  }, []);\n```\n\nWe now get the updated values from `spaceShip` and `playerFiring`,\
    \ so we can get the x-coordinate we want. We use `scan` in the same way we used\
    \ it for our Enemy Observable, creating an array of current coordinates for each\
    \ of our shots. With that we should be ready to draw our shots on the screen.\
    \ We use a helper function to draw every shot in the array of shots:\n\n```javascript\n\
    spaceship_reactive/hero_shots.js\nvar SHOOTING_SPEED = 15;\nfunction paintHeroShots(heroShots)\
    \ {\n  heroShots.forEach(function(shot) {\n    shot.y -= SHOOTING_SPEED;\n   \
    \ drawTriangle(shot.x, shot.y, 5, '#ffff00', 'up');\n  });\n}\n```\n\nThen we\
    \ call `paintHeroShots` from our main `combineLatest` operation:\n\n```javascript\n\
    Rx.Observable.combineLatest(\n  StarStream, Spaceship, Enemies, HeroShots,\n \
    \ function(stars, spaceship, enemies, heroShots) {\n    return {\n      stars:\
    \ stars,\n      spaceship: spaceship,\n      enemies: enemies,\n      heroShots:\
    \ heroShots\n    };\n  }\n)\n.sample(SPEED)\n.subscribe(renderScene);\n```\n\n\
    And we add a call to `paintHeroShots` inside `renderScene`:\n\n```javascript\n\
    function renderScene(actors) {\n  paintStars(actors.stars);\n  paintSpaceShip(actors.spaceship.x,\
    \ actors.spaceship.y);\n  paintEnemies(actors.enemies);\n  paintHeroShots(actors.heroShots);\n\
    }\n```\n\nNow when you run the game you'll notice that *every time you move the\
    \ mouse, our spaceship fires an insane number of shots*. Not bad for an effect,\
    \ but that's not what we wanted! Let's look at the HeroShots Observable again.\
    \ In it, we're using `combineLatest` so that we have values from `playerFiring`\
    \ and `spaceShip`. This looks similar to the problem we had before. `combineLatest`\
    \ in HeroShots is emitting values every time the mouse moves, and this translates\
    \ into shots being fired. Throttling won't help in this case, because we want\
    \ the user to shoot whenever she wants, and throttling would limit the number\
    \ of shots and drop many of them.\n\ncombineLatest emits the last value that each\
    \ Observable emitted, whenever an Observable emits a new value. We can use this\
    \ to our advantage. Whenever the mouse moves, combineLatest emits the new SpaceShip\
    \ position and the last emitted value of playerFiring, which will be unchanged\
    \ unless we fire a new shot. We can then emit a value only when the emitted shot\
    \ is different from the previous one. The distinctUntilChanged operator does the\
    \ dirty work for us.\n\nThe operators distinct and distinctUntilChanged allow\
    \ us to filter out results that an Observable has already emitted. distinct filters\
    \ out any result previously emitted and distinctUntilChanged filters out identical\
    \ results unless a different one is emitted in between. We only need to make sure\
    \ that the new shot is different from the previous one, so distinctUntilChanged\
    \ is enough for us. (It also saves us from the higher memory usage of distinct;\
    \ distinct needs to keep all the previous results in memory.)\n\nWe modify heroShots\
    \ so it only emits new shots, based on their timestamp:\n\n```javascript\nspaceship_reactive/hero_shots2.js\n\
    var HeroShots = Rx.Observable\n    .combineLatest(\n        playerFiring,\n  \
    \      SpaceShip,\n        function(shotEvents, spaceShip) {\n            return\
    \ {\n                timestamp: shotEvents.timestamp,\n                x: spaceShip.x\n\
    \            };\n        }\n    )\n    .distinctUntilChanged(function(shot) {\
    \ return shot.timestamp; })\n    .scan(function(shotArray, shot) {\n        shotArray.push({\
    \ x: shot.x, y: HERO_Y });\n        return shotArray;\n    }, []);\n```\n\nIf\
    \ everything went well, we're now able to shoot at enemies from our spaceship!\n\
    \n### Enemy Shots\n\nWe should allow enemies to shoot as well; otherwise it's\
    \ a pretty unfair universe. And a boring one! For enemy shots, we'll do the following:\n\
    \n- Each enemy will keep an updated array of its own shots.\n- Each enemy will\
    \ shoot at a given frequency.\n\nFor this, we'll use an interval operator to store\
    \ new shots in the enemy value. We'll also introduce a new helper function, isVisible,\
    \ that helps filter out elements whose coordinates are outside the visible screen.\
