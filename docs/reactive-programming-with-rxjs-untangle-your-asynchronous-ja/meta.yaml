    \ = Date.now();\nRx.Observable.from(arr).subscribe({\n    function onNext() {\
    \ },\n    function onError() { },\n    function onCompleted() {\n        console.log('Total\
    \ time: ' + (Date.now() - timeStart) + 'ms');\n    }\n});\n```\n```\n\n< \"Total\
    \ time: 6ms\"\n\nSix milliseconds—not bad! front uses `Rx.Scheduler.currentThread`\
    \ internally, which schedules work to run after any current work is finished.\
    \ Once it starts, it processes all the notifications synchronously.\n\nNow let's\
    \ change the Scheduler to `Rx.Scheduler.default`.\n\n```\n```javascript\nvar timeStart\
    \ = Date.now();\nRx.Observable.from(arr, null, null, Rx.Scheduler.default).subscribe({\n\
    \    function onNext() { },\n    function onError() { },\n    function onCompleted()\
    \ {\n        console.log('Total time: ' + (Date.now() - timeStart) + 'ms');\n\
    \    }\n});\n```\n```\n\n< \"Total time: 5337ms\"\n\nWow, our code runs almost\
    \ a thousand times slower than with the `currentThread` Scheduler. That's because\
    \ the default Scheduler runs each notification asynchronously. We can verify this\
    \ by adding a simple log statement after the subscription.\n\nUsing the currentThread\
    \ Scheduler:\n\n```\n```javascript\nRx.Observable.from(arr).subscribe( ... );\n\
    console.log('Hi there!');\n```\n```\n\n< \"Total time: 8ms\"\n\"Hi there!\"\n\n\
    Using the default Scheduler:\n\n```\n```javascript\nRx.Observable.from(arr, null,\
