  md: '# # What’s in This Book


    This book is a practical introduction to reactive programming using RxJS. The
    objective is to get you to think reactively by building small real-world applications,
    so you can learn how to introduce reactive programming in your day-to-day programming
    and make your programs more robust. This is not a theoretical book about reactive
    programming, and it is not an exhaustive reference book for the RxJS API. You
    can find these kinds of resources online.


    We’ll be developing mostly for the browser, but we’ll see some examples in Node.js,
    too. We’ll get deep into the subject early on, and we’ll build applications along
    the way to keep it real. Here are the chapters:


    Unless you have used RxJS before, start with *Chapter 1, The Reactive Way, on
    page 1*. In this chapter we introduce Observables, the main data type of RxJS,
    which we’ll use extensively throughout the book.


    With the basics of Observables established, we move on to *Chapter 2, Deep in
    the Sequence, on page 17*. There you see that in reactive programming it’s all
    about sequences of events. We visit some important sequence operators and build
    our first application, a real-time earthquake sequence visualizer.


    In *Chapter 3, Building Concurrent Programs, on page 39*, we look at how to write
    concurrent code with minimal side effects. After covering the Observable pipeline,
    we build a cool spaceship video game in about 200 lines of code and with almost
    no global state.


    In *Chapter 4, Building a Complete Web Application, on page 69*, we get deeper
    into reactive app development and enhance the earthquake application we made previously
    in *Deep in the Sequence* by making a server part in Node.js that shows tweets
    related to earthquakes happening right now.


    We get into some more advanced concepts of RxJS with *Chapter 5, Bending Time
    with Schedulers, on page 89*, where we talk about the useful concept RxJS provides
    to handle concurrency at a more fine-grained level: Schedulers.


    With the knowledge of Schedulers under our hats, we explore how they help us with
