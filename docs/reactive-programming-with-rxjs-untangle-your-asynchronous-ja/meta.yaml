    \ 的订阅中渲染飞船。我们可以将最新的飞船坐标保存到一个 `starStream` 可以访问的变量中，但那样我们就违反了“不修改外部状态”的原则。该怎么办呢？\n\
    \n像往常一样，RxJS 提供了一个非常方便的运算符来解决这个问题。\n\n`Rx.Observable.combineLatest` 是一个非常实用的运算符。它接受两个或多个\
    \ Observable，每当其中任何一个发射新值时，它就会发射每个 Observable 的最新结果。既然知道 `starStream` 发射新项（星阵数组）的频率很高，我们可以移除\
