    # ## The Rx Pattern and the Observable


    While the Observer and the Iterator patterns are powerful in their own right,
    the combination of both is even better. We call this the Rx pattern, named after
    the Reactive Extensions libraries.² We’ll be using this pattern for the rest of
    the book.


    The *Observable sequence*, or simply *Observable* is central to the Rx pattern.
    An Observable emits its values in order—like an iterator—but instead of its consumers
    requesting the next value, the Observable “pushes” values to consumers as they
    become available. It has a similar role to the Producer’s in the Observer pattern:
    emitting values and pushing them to its listeners.


    > **Pulling vs. Pushing**


    In programming, *push-based behavior* means that the server component of an application
    sends updates to its clients instead of the clients having to poll the server
    for these updates. It’s like saying, “Don’t call us; we’ll call you.”


    RxJS is push-based, so the source of events (the Observable) will push new values
    to the consumer (the Observer), without the consumer requesting the next value.


    Put more simply, an Observable is a sequence whose items become available over
    time. The consumers of Observables, Observers, are the equivalent of *listeners*
    in the Observer pattern. When an Observer is subscribed to an Observable, it will
    receive the values in the sequence as they become available, without having to
    request them.


    So far it seems there’s not much of a difference from the traditional Observer
    pattern. But actually there are two essential differences:


