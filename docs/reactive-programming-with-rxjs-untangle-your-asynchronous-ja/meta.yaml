- md: '## Reactive Programming with RxJS

    Untangle Your Asynchronous JavaScript Code


    **Sergi Mansilla**

    edited by Rebecca Gulick


    ## Early praise for *Reactive Programming with RxJS*


    Every significant shift in software development demands rethinking our approaches.
    Real-time and asynchronous web applications pose a huge challenge in web development
    today. This book does an excellent job explaining how RxJS addresses those challenges
    and teaches you how to rethink your world in terms of Observables.


    **Zef Hemel**

    VP engineering, STX Next


    This book is as hot as reactive programming itself! With great writing, clear
    explanations, and practical examples, this is a fantastic resource for learning
    RxJS.


    **Fred Daoud**

    Software-development contractor


    Be proactive and learn reactive programming with this book before it''s too late.

    `Rx.Observable.fromBook(book).subscribe(function(value) {...do amazing stuff...});`


    **Javier Collado Cabeza**

    Senior software developer, NowSecure, Inc.


    A very readable book with great content. This book is eminently useful and provides
    a clear roadmap for learning reactive programming with RxJS with practical examples.


    **Ramaninder Singh Jhajj**

    Software engineer, Area Services & Development, Know-Center, Austria


    We''ve left this page blank to make the page numbers the same in the electronic
    and paper books.


    We tried just leaving it out, but then people wrote us to ask about the missing
    pages.


    Anyway, Eddy the Gerbil wanted to say "hello."


