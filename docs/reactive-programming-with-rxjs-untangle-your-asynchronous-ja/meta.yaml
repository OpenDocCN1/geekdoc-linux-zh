    \ an Observable that will properly use `onNext`, `onError`, and `onCompleted`\
    \ when we subscribe an Observer to it.\n\n# Wrapping Up\n\nIn this chapter we\
    \ explored the reactive approach to programming and saw how RxJS can solve the\
