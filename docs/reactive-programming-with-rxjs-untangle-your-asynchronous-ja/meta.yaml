- img_proc: true
  md: "As is usually the case, RxJS has a very convenient operator we can use to solve\
    \ our problem.\n\nRx.Observable.combineLatest is a handy operator. It takes two\
    \ or more Observables and emits the last result of each Observable whenever any\
    \ of them emits a new value. Knowing that starStream emits a new item (the array\
    \ of stars) so frequently, we can remove the starStream subscription and use combineLatest\
    \ to combine both the starStream and spaceShip Observables and update them as\
    \ soon as any of them emits a new item:\n\n```\n```javascript\nspaceship_reactive/hero_1.js\n\
    function renderScene(actors) {\n  paintStars(actors.stars);\n  paintSpaceShip(actors.spaceship.x,\
    \ actors.spaceship.y);\n}\n\nvar Game = Rx.Observable\n  .combineLatest(\n   \
    \ StarStream, SpaceShip,\n    function(stars, spaceship) {\n      return { stars:\
    \ stars, spaceship: spaceship };\n    }\n  );\n\nGame.subscribe(renderScene);\n\
    ```\n```\n\nWe’re now using a render function renderScene to paint everything\
    \ on the screen, so you can remove the following subscription code for StarStream:\n\
    \n```\n```javascript\n.subscribe(function(starArray) {\n  paintStars(starArray);\n\
    });\n```\n```\n\nWith this, we’ll paint the starry background *and* the spaceship\
    \ every time any Observable emits a new item. We now have a spaceship flying through\
    \ space, and we can move it at will using our mouse. Not bad for so little code!\
    \ But our hero’s spaceship is too lonely in the vastness of space. What about\
    \ giving it some company?\n\n# ## Generating Enemies\n\nThis would be a very boring\
    \ game if we didn’t have any enemies to take care of. So let’s create an infinite\
    \ stream of them! We want to create a new enemy every second and a half to not\
    \ overwhelm our hero. Let’s look at the code for the Enemies Observable and then\
    \ go through it:"
  merge: -1
  pgno: 73
- img_proc: true
  md: "```\n```javascript\nspaceship_reactive/enemy_1.js\nvar ENEMY_FREQ = 1500;\n\
    var Enemies = Rx.Observable.interval(ENEMY_FREQ)\n  .scan(function(enemyArray)\
    \ {\n    var enemy = {\n      x: parseInt(Math.random() * canvas.width),\n   \
    \   y: -30,\n    };\n\n    enemyArray.push(enemy);\n    return enemyArray;\n \
    \ }, []);\n}\n\nvar Game = Rx.Observable\n  .combineLatest(\n    StarStream, SpaceShip,\
    \ Enemies,\n    function(stars, spaceship, enemies) {\n      return {\n      \
    \  stars: stars,\n        spaceship: spaceship,\n        enemies: enemies\n  \
    \    };\n    }\n  );\n```\n```\n\nGame.subscribe(renderScene);\n\nTo create enemies,\
    \ we use an interval operator to run every 1,500 milliseconds, and then we use\
    \ the scan operator to create an array of enemies.\n\nWe briefly saw the scan\
    \ operator in [Can We Aggregate Infinite Observables?, on page 22](page_22). scan\
    \ aggregates results each time an Observable emits a value, and emits each intermediate\
    \ result. In the Enemies Observable we start with an empty array as scan's first\
    \ parameter and we push a new object to it in every iteration. The object contains\
    \ a random x-coordinate, and a fixed y-coordinate outside the visible screen.\
    \ With this, Enemies will emit an array with all the current enemies every 1,500\
    \ milliseconds.\n\nThe only thing left to render enemies is a helper function\
    \ to paint each of them on the canvas. This function will also be the one updating\
    \ the coordinates of each item in the enemies array:\n\n```\n```javascript\nspaceship_reactive/enemy_1.js\n\
    // Helper function to get a random integer\nfunction getRandomInt(min, max) {\n\
    \  return Math.floor(Math.random() * (max - min + 1)) + min;\n}\n```\n```"
  merge: -1
  pgno: 74
- img_proc: true
  md: "```\n```javascript\nfunction paintEnemies(enemies) {\n  enemies.forEach(function(enemy)\
    \ {\n    enemy.y += 5;\n    enemy.x += getRandomInt(-15, 15);\n\n    drawTriangle(enemy.x,\
    \ enemy.y, 20, '#00ff00', 'down');\n  });\n}\n```\n```\n\nYou can see in `paintEnemies`\
    \ that we are also changing the x-coordinate randomly so that enemies move a bit\
    \ unpredictably to the sides. Now we need to update the function `renderScene`\
    \ to include a call to `paintEnemies`.\n\nYou might have noticed a strange effect\
    \ while playing the game we have so far: if you move the mouse, the enemies go\
    \ faster toward you! That *could* be a nice feature in the game, but we definitely\
    \ didn't intend to do that. Can you guess what causes this bug?\n\nIf you guessed\
    \ that it was related to the `paintEnemies` function, you're right on the money.\
    \ `combineLatest` renders our scene whenever any of the Observables yields a value.\
    \ If we don't move the mouse, the fastest emitter will always be `starStream`\
    \ because it has an interval of 40 milliseconds (the Enemies Observable emits\
    \ only every 1,500 milliseconds). When we move the mouse, though, `SpaceShip`\
    \ will emit faster than `starStream` (your mouse emits coordinates *many* times\
    \ per second), and `paintEnemies` will then execute that many times, increasing\
    \ the enemies' coordinates much faster.\n\nTo avoid this scenario and similar\
    \ problems in the future, we need to normalize the game's speed so that no Observable\
    \ can emit values faster than our chosen speed for the game.\n\nAnd yes, as you\
    \ may have guessed, RxJS has an operator for that.\n\n# ### Avoid Drinking from\
    \ the Firehose\n\nThere is such a thing as receiving data too fast. Most of the\
    \ time we want all the speed we can get, but depending on the frequency at which\
    \ the Observable streams values, we might want to drop some of the values we receive.\
    \ We're now in one of these scenarios. The speed at which we render things onscreen\
    \ is proportional to the speed of the fastest Observable we have. It turns out\
    \ that our fastest Observable is too fast for us, and we need to establish a constant\
    \ update speed in the game.\n\n`sample` is a method in Observable instances that,\
    \ given a time parameter in milliseconds, returns an Observable that emits the\
    \ last value emitted by the parent Observable in each time interval."
  merge: -1
  pgno: 75
- img_proc: true
  md: "![](img/a8eed7bbb390e0eff6b6561c329a113c_76_0.png)\n\nNotice how `sample` drops\
    \ any values before the last value at the moment of the interval. It's important\
    \ to consider whether you want this behavior. In our case, we don't care about\
    \ dropping values because we just want to render the current state of each element\
    \ every 40 milliseconds. If all the values are important to you, you might want\
    \ to consider the buffer operator:\n\n```\n```javascript\nspaceship_reactive/enemy_2.js\n\
    Rx.Observable.combineLatest(\n  StarStream, SpaceShip, Enemies,\n  function(stars,\
    \ spaceship, enemies) {\n    return {\n      stars: stars,\n      spaceship: spaceship,\n\
    \      enemies: enemies\n    };\n  }\n)\n.sample(SPEED)\n.subscribe(renderScene);\n\
    ```\n```\n\nBy calling `sample` after `combineLatest` we make sure that `combineLatest`\
    \ will never yield any value faster than 40 milliseconds after the previous one\
    \ (our constant SPEED is set to 40).\n\n# ### Shooting\n\nIt's a bit scary seeing\
    \ the hordes of enemies coming at us; all we can do about it is move out of the\
    \ way and hope they don't see us. How about we give our hero the ability to shoot\
    \ at the evil alien spaceships?\n\nWe want our spaceship to shoot whenever we\
    \ click the mouse or press the spacebar, so we'll create an Observable for each\
    \ event and merge them into a single Observable called `playerShots`. Notice that\
    \ we filter the `keydown` Observable by the key code of the spacebar. 32:"
  merge: -1
  pgno: 76
- img_proc: true
  md: "```\n```javascript\nspaceship_reactive/hero_shots.js\nvar playerFiring = Rx.Observable\n\
    \  .merge(\n    Rx.Observable.fromEvent(canvas, 'click'),\n    Rx.Observable.fromEvent(canvas,\
    \ 'keydown')\n      .filter(function(evt) { return evt.keycode === 32; })\n  )\n\
    ```\n```\n\nNow that we know about sample, we can use it to spice up the game\
    \ and limit the shooting frequency of our spaceship. Otherwise, the player could\
    \ shoot at high speed and destroy all enemies too easily. We'll make it so that\
    \ the player can shoot only every 200 milliseconds at most:\n\n```\n```javascript\n\
    spaceship_reactive/hero_shots.js\nvar playerFiring = Rx.Observable\n  .merge(\n\
    \    Rx.Observable.fromEvent(canvas, 'click'),\n    Rx.Observable.fromEvent(canvas,\
    \ 'keydown')\n      .filter(function(evt) { return evt.keycode === 32; })\n  )\n\
    \  .sample(200)\n  .timestamp();\n```\n```\n\nWe've also added a timestamp operator,\
    \ which sets a property `timestamp` in every value our Observable emits, with\
    \ the exact time it is emitted. We'll use it later.\n\nFinally, to fire shots\
    \ from our spaceship we need to know the x-coordinate of the spaceship at the\
    \ firing moment. This is so we can render the shot at the correct x-coordinate.\
    \ It may be tempting to set an external variable from the SpaceShip Observable\
    \ that always contains the last x-coordinate emitted, but that would be breaking\
    \ our unwritten agreement to never mutate external state!\n\nInstead we'll accomplish\
    \ this by using our good friend combineLatest again:\n\n```\n```javascript\nspaceship_reactive/hero_shots.js\n\
    var HeroShots = Rx.Observable\n  .combineLatest(\n    playerFiring,\n    SpaceShip,\n\
    \    function(shotEvents, spaceShip) {\n      return { x: spaceShip.x };\n   \
    \ }\n  )\n  .scan(function(shotArray, shot) {\n    shotArray.push({x: shot.x,\
    \ y: HERO_Y});\n    return shotArray;\n  }, []);\n```\n```"
  merge: -1
  pgno: 77
- img_proc: true
  md: "We now get the updated values from `spaceShip` and `playerFiring`, so we can\
    \ get the x-coordinate we want. We use `scan` in the same way we used it for our\
    \ Enemy Observable, creating an array of current coordinates for each of our shots.\
    \ With that we should be ready to draw our shots on the screen. We use a helper\
    \ function to draw every shot in the array of shots:\n\n```\n```javascript\nspaceship_reactive/hero_shots.js\n\
    var SHOOTING_SPEED = 15;\nfunction paintHeroShots(heroShots) {\n  heroShots.forEach(function(shot)\
    \ {\n    shot.y -= SHOOTING_SPEED;\n    drawTriangle(shot.x, shot.y, 5, '#ffff00',\
    \ 'up');\n  });\n}\n```\n```\n\nThen we call `paintHeroShots` from our main `combineLatest`\
    \ operation:\n\n```\n```javascript\nRx.Observable.combineLatest(\n  StarStream,\
    \ Spaceship, Enemies, HeroShots,\n  function(stars, spaceship, enemies, heroShots)\
    \ {\n    return {\n      stars: stars,\n      spaceship: spaceship,\n      enemies:\
    \ enemies,\n      heroShots: heroShots\n    };\n  }\n)\n.sample(SPEED)\n.subscribe(renderScene);\n\
    ```\n```\n\nAnd we add a call to `paintHeroShots` inside `renderScene`:\n\n```\n\
    ```javascript\nfunction renderScene(actors) {\n  paintStars(actors.stars);\n \
    \ paintSpaceShip(actors.spaceship.x, actors.spaceship.y);\n  paintEnemies(actors.enemies);\n\
    \  paintHeroShots(actors.heroShots);\n}\n```\n```\n\nNow when you run the game\
    \ you'll notice that *every time you move the mouse, our spaceship fires an insane\
    \ number of shots*. Not bad for an effect, but that's not what we wanted! Let's\
    \ look at the HeroShots Observable again. In it, we're using `combineLatest` so\
    \ that we have values from `playerFiring` and `spaceShip`. This looks similar\
    \ to the problem we had before. `combineLatest` in HeroShots is emitting values\
    \ every time the mouse moves, and this translates into shots being fired. Throttling\
    \ won't help in this case, because we want the user to shoot whenever she wants,\
    \ and throttling would limit the number of shots and drop many of them."
  merge: -1
  pgno: 78
- img_proc: true
  md: "combineLatest emits the last value that each Observable emitted, whenever an\
    \ Observable emits a new value. We can use this to our advantage. Whenever the\
    \ mouse moves, combineLatest emits the new SpaceShip position and the last emitted\
    \ value of playerFiring, which will be unchanged unless we fire a new shot. We\
    \ can then emit a value only when the emitted shot is different from the previous\
    \ one. The distinctUntilChanged operator does the dirty work for us.\n\nThe operators\
    \ distinct and distinctUntilChanged allow us to filter out results that an Observable\
    \ has already emitted. distinct filters out any result previously emitted and\
    \ distinctUntilChanged filters out identical results unless a different one is\
    \ emitted in between. We only need to make sure that the new shot is different\
    \ from the previous one, so distinctUntilChanged is enough for us. (It also saves\
    \ us from the higher memory usage of distinct; distinct needs to keep all the\
    \ previous results in memory.)\n\nWe modify heroShots so it only emits new shots,\
    \ based on their timestamp:\n\n```\n```javascript\nspaceship_reactive/hero_shots2.js\n\
    var HeroShots = Rx.Observable\n    .combineLatest(\n        playerFiring,\n  \
    \      SpaceShip,\n        function(shotEvents, spaceShip) {\n            return\
    \ {\n                timestamp: shotEvents.timestamp,\n                x: spaceShip.x\n\
    \            };\n        }\n    )\n    .distinctUntilChanged(function(shot) {\
    \ return shot.timestamp; })\n    .scan(function(shotArray, shot) {\n        shotArray.push({\
    \ x: shot.x, y: HERO_Y });\n        return shotArray;\n    }, []);\n```\n```\n\
    \nIf everything went well, we're now able to shoot at enemies from our spaceship!\n\
    \n# ### Enemy Shots\n\nWe should allow enemies to shoot as well; otherwise it's\
    \ a pretty unfair universe. And a boring one! For enemy shots, we'll do the following:\n\
    \n+   - Each enemy will keep an updated array of its own shots.\n- Each enemy\
    \ will shoot at a given frequency.\n\nFor this, we'll use an interval operator\
    \ to store new shots in the enemy value. We'll also introduce a new helper function,\
    \ isVisible, that helps filter out elements whose coordinates are outside the\
    \ visible screen. This is how the Enemy Observable looks now:"
  merge: -1
  pgno: 79
- img_proc: true
  md: "```\n```javascript\nspaceship_reactive/enemy_shots.js\nfunction isVisible(obj)\
    \ {\n    return obj.x > -40 && obj.x < canvas.width + 40 &&\n           obj.y\
    \ > -40 && obj.y < canvas.height + 40;\n}\n\nvar ENEMY_FREQ = 1500;\nvar ENEMY_SHOOTING_FREQ\
    \ = 750;\nvar Enemies = Rx.Observable.interval(ENEMY_FREQ)\n    .scan(function(enemyArray)\
    \ {\n        var enemy = {\n            x: parseInt(Math.random() * canvas.width),\n\
    \            y: -30,\n            shots: []\n        };\n\n        Rx.Observable.interval(ENEMY_SHOOTING_FREQ).subscribe(function()\
    \ {\n            enemy.shots.push({x: enemy.x, y: enemy.y});\n            enemy.shots\
    \ = enemy.shots.filter(isVisible);\n        });\n\n        enemyArray.push(enemy);\n\
    \        return enemyArray.filter(isVisible);\n    }, []);\n```\n```\n\nIn that\
    \ code we create an interval every time we create a new enemy. This interval will\
    \ keep adding shots to the enemy array of shots, and then it will filter out the\
    \ ones outside the screen. We can use isVisible to filter out enemies that are\
    \ outside the screen, too, as we do in the return statement.\n\nWe need to update\
    \ paintEnemies so that it renders enemy shots and updates their y-coordinates.\
    \ Then we use our handy drawTriangle function to draw the shots:\n\n```\n```javascript\n\
    spaceship_reactive/enemy_shots.js\nfunction paintEnemies(enemies) {\n    enemies.forEach(function(enemy)\
    \ {\n        enemy.y += 5;\n        enemy.x += getRandomInt(-15, 15);\n\n    \
    \    drawTriangle(enemy.x, enemy.y, 20, '#00ff00', 'down');\n\n        enemy.shots.forEach(function(shot)\
    \ {\n            shot.y += SHOOTING_SPEED;\n            drawTriangle(shot.x, shot.y,\
    \ 5, '#00ffff', 'down');\n        });\n    });\n}\n```\n```"
