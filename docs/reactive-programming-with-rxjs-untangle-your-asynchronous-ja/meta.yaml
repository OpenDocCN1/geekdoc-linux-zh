  - "[PAGE 97]\n\n+   2. We call `isHovering` with the current row and we subscribe\
    \ to the resulting Observable. If the `hovering` argument is true, we'll paint\
    \ the circle red; otherwise, it will be blue.\n\n+   3. We subscribe to the Observable\
    \ created from the `click` event in the current row. When the row in the list\
    \ is clicked, the map will be centered on the corresponding circle in the map.\n\
    \n# ### Making It Efficient\n\nExperienced front-end developers know that creating\
    \ many events on a page is a recipe for bad performance. In our previous example,\
    \ we created three events for each row. If we get 100 earthquakes on the list,\
    \ we would have 300 events floating around the page just to do some light highlighting\
    \ work! That is terrible for performance, and we can do better.\n\nBecause events\
    \ in DOM always bubble up (from children to parent elements), a well-known technique\
    \ among front-end developers to avoid attaching mouse events to many elements\
    \ individually is to attach them instead to their parent element. Once the event\
    \ is fired on the parent, we can use the event's target property to find the child\
    \ element that was the event's target.\n\nBecause we'll need similar functionality\
    \ for the events click and mouseover, we'll create a function `getRowFromEvent`:\n\
    \n```\n```javascript\nexamples_earthquake_ui/code3.pairwise.js\nfunction getRowFromEvent(event)\
    \ {\n    return Rx.Observable\n        .fromEvent(table, event)\n        .filter(function(event)\
    \ {\n            var el = event.target;\n            return el.tagName === 'TD'\
    \ && el.parentNode.id.length;\n        })\n        .pluck('target', 'parentNode')\n\
    \        .distinctUntilChanged();\n}\n```\n```\n\n`getRowFromEvent` gives us the\
    \ table row in which the event has happened. Here are the details:\n\n+   1. We\
    \ make sure that we get events happening in a table cell, and we check that the\
    \ parent of that cell is a row with an ID attribute. These rows are the ones we\
    \ tagged with the earthquake ID.\n\n+   2. The `pluck` operator extracts the nested\
    \ property `parentNode` inside the element's target property."
  - "[PAGE 98]\n\nThis prevents getting the same element more than once. That would\
    \ happen a lot with the mouseover event, for example.\n\nIn the previous section\
    \ we attached the events mouseover and mouseout on each row to change the earthquake\
    \ circle color each time the mouse entered or exited the row. Now, we'll use only\
    \ the mouseover event on the table, combined with the convenient pairwise operator:\n\
    \n```\n```javascript\nexamples_earthquake_ui/code3.pairwise.js\ngetRowFromEvent('mouseover')\n\
    \  .pairwise()\n  .subscribe(function(rows) {\n    var prevCircle = quakeLayer.getLayer(codeLayers[rows[0].id]);\n\
    \    var currCircle = quakeLayer.getLayer(codeLayers[rows[1].id]);\n\n    prevCircle.setStyle({\
    \ color: '#0000ff' });\n    currCircle.setStyle({ color: '#ff0000' });\n  });\n\
    ```\n```\n\npairwise groups each emitted value with the previously emitted value\
    \ in an array. Because we're always getting distinct rows, pairwise will always\
    \ yield the row that the mouse just left and the row where the mouse is hovering\
    \ now. With this information, it is easy to color each earthquake circle accordingly.\n\
    \nHandling the click event is even simpler:\n\n```\n```javascript\nexamples_earthquake_ui/code3.pairwise.js\n\
    getRowFromEvent('click')\n  .subscribe(function(row) {\n    var circle = quakeLayer.getLayer(codeLayers[row.id]);\n\
    \    map.panTo(circle.getLatLng());\n  });\n```\n```\n\nAnd we can go back to\
    \ just subscribing to quakes to generate the rows:\n\n```\n```javascript\nexamples_earthquake_ui/code3.pairwise.js\n\
    quakes\n  .pluck('properties')\n  .map(makeRow)\n  .subscribe(function(row) {\
    \ table.appendChild(row); });\n```\n```\n\nOur code is now much more clean and\
    \ idiomatic, and it doesn't depend on the rows being there. If there are no rows,\
    \ getRowFromEvent won't try to yield any.\n\nWhat's more important, our code now\
    \ is very efficient. Regardless of the amount of earthquake information we retrieve,\
    \ we'll always have just a single mouseover event and a single click event, instead\
    \ of hundreds of events."
