    an `interval` operator as the generator. Since `interval` emits sequential integers
    every $x$ milliseconds (where $x$ is a parameter we pass), we just need to transform
    the values to whatever we want. Our game in [Chapter 3, Building Concurrent Programs,
    on page 39](link), is heavily based on that technique.


    +   * `Rx.Observable.distinct`


    Default behavior: *Same as the Observable it filters*


    `distinct` is one of these extremely simple operators that saves a ton of development
    work. It filters out of the sequence any value that has already been emitted.
    That keeps us from writing time and again that error-prone boilerplate code that
    uses a dictionary somewhere with the emitted results, against which we compare
    incoming results. You know what kind of code I''m talking about. Yuck. That''s
    gone with `distinct`.


    ![](img/a8eed7bbb390e0eff6b6561c329a113c_54_0.png)


    `distinct` lets us use a function that specifies the comparison method. Additionally,
    we can pass no arguments and it will use strict comparison to compare primitives
    such as numbers or strings, and run deep comparisons in case of more complex objects.'
  - '[PAGE 55]


    # Wrapping Up


    In this chapter we covered how to visually represent and understand Observable
    flows using marble diagrams. We''ve covered the most common operators to transform
    Observables, and, more importantly, we''ve built a real-world application using
    only Observable sequences, avoiding setting any external state, loops, or conditional
    branches. We expressed our whole program in a declarative way, without having
    to encode every step to accomplish the task at hand.


    In the next chapter we''ll continue to explore Observable sequences, this time
    taking a look at more advanced operators that allow you to control and bend flows
    and data in your program like you''ve never imagined possible with procedural
    code!'
- md: "## Building Concurrent Programs\n\nConcurrency is the art of doing several\
    \ things at the same time, correctly and efficiently. To accomplish this, we structure\
    \ our programs to take advantage of time so that tasks run together in the most\
    \ efficient way. Examples of everyday concurrency in applications include keeping\
    \ the user interface responsive while other activities are happening, and processing\
    \ hundreds of customers' orders efficiently.\n\nIn this chapter we'll explore\
    \ concurrency and pure functions in RxJS by making a shoot-'em-up spaceship game\
    \ for the browser. We'll first introduce the Observable pipeline, a technique\
    \ to chain Observable operators and pass state between them. Then I'll show you\
    \ how to use the pipeline to build programs without relying on external state\
    \ or side effects, by encapsulating all your logic and state inside the Observables\
    \ themselves.\n\nVideo games are computer programs that need to keep a lot of\
    \ state, but we'll write our game with no external state whatsoever, using the\
    \ power of the Observable pipeline and some great RxJS operators.\n\n## Purity\
    \ and the Observable Pipeline\n\nAn Observable pipeline is a group of operators\
    \ chained together, where each one takes an Observable as input and returns an\
    \ Observable as output. We've been using pipelines in this book: they are ubiquitous\
    \ when programming with RxJS. Here's a simple one:\n\n```javascript\n// spaceship_reactive/pipeline.js\n\
    Rx.Observable\n  .from(1, 2, 3, 4, 5, 6, 7, 8)\n  .filter(function(val) { return\
    \ val % 2; })\n  .map(function(val) { return val * 10; });\n```\n\nPipelines are\
    \ self-contained. All state flows from one operator to the next, without the need\
    \ for any external variables. But as we build our reactive programs, we may be\
    \ tempted to store state outside the Observable pipeline (we talked about external\
    \ state in Side Effects and External State, on page 5). This forces us to keep\
    \ track of the variables we set outside the pipeline, and all that bean-counting\
    \ can easily lead to bugs. To avoid this, the operators in a pipeline should always\
    \ use pure functions.\n\nPure functions always return the same output given the\
    \ same input. It's easier to design programs with high concurrency when we can\
    \ guarantee that a function in the program can't modify state other functions\
    \ rely on. And that's what pure functions give us.\n\n### Avoiding External State\n\
    \nIn the following example we count the even numbers that `interval` has yielded\
    \ so far. We do this by creating an Observable from `interval` ticks and increasing\
    \ `evenTicks` when the tick we receive is an even number:\n\n```javascript\n//\
    \ spaceship_reactive/state.js\nvar evenTicks = 0;\n\nfunction updateDistance(i)\
    \ {\n    if (i % 2 === 0) {\n        evenTicks += 1;\n    }\n    return evenTicks;\n\
    }\n\nvar ticksObservable = Rx.Observable\n    .interval(1000)\n    .map(updateDistance);\n\
    \nticksObservable.subscribe(function() {\n    console.log('Subscriber 1 - evenTicks:\
    \ ' + evenTicks + ' so far');\n});\n```\n\nThis is the output we get after the\
    \ program has been running for four seconds:\n\n> Subscriber 1 - evenTicks: 1\
    \ so far\n> Subscriber 1 - evenTicks: 1 so far\n> Subscriber 1 - evenTicks: 2\
    \ so far\n> Subscriber 1 - evenTicks: 2 so far\n\nNow, just for kicks, let's add\
    \ another subscriber to ticksObservable:\n\n```javascript\n// spaceship_reactive/state.js\n\
    var eventTicks = 0;\n\nfunction updateDistance(i) {\n    if (i % 2 === 0) {\n\
    \        eventTicks += 1;\n    }\n    return eventTicks;\n}\n\nvar ticksObservable\
    \ = Rx.Observable\n    .interval(1000)\n    .map(updateDistance)\n\nticksObservable.subscribe(function()\
    \ {\n    console.log('Subscriber 1 - eventTicks: ' + eventTicks + ' so far');\n\
    });\n\nticksObservable.subscribe(function() {\n    console.log('Subscriber 2 -\
    \ eventTicks: ' + eventTicks + ' so far');\n});\n```\n\nThe output is now the\
    \ following:\n\n```text\nSubscriber 1 - eventTicks: 1 so far\nSubscriber 2 - eventTicks:\
    \ 2 so far\nSubscriber 1 - eventTicks: 2 so far\nSubscriber 2 - eventTicks: 2\
    \ so far\nSubscriber 1 - eventTicks: 3 so far\nSubscriber 2 - eventTicks: 4 so\
    \ far\nSubscriber 1 - eventTicks: 4 so far\nSubscriber 2 - eventTicks: 4 so far\n\
    ```\n\nHold on a second—the event ticks count on Subscriber 2 is completely off!\
    \ It should always contain the same `eventTicks` count as Subscriber 1. The reason,\
    \ as you might have guessed, is that the Observable pipeline will run once for\
    \ each subscriber, increasing `eventTicks` twice.\n\nProblems caused by sharing\
    \ external state are often more subtle than this example. In complex applications,\
    \ opening the door to changing state outside of the pipeline leads to code becoming\
    \ complicated, and bugs soon start to show up. The solution is to encapsulate\
    \ as much information as we can inside the pipeline. Here's a way we could refactor\
    \ the preceding code to avoid external state:\n\n```javascript\n// spaceship_reactive/state.js\n\
    function updateDistance(acc, i) {\n    if (i % 2 === 0) {\n        acc += 1;\n\
    \    }\n    return acc;\n}\n\nvar ticksObservable = Rx.Observable\n    .interval(1000)\n\
    \    .scan(updateDistance, 0);\n\nticksObservable.subscribe(function(eventTicks)\
    \ {\n    console.log('Subscriber 1 - eventTicks: ' + eventTicks + ' so far');\n\
    });\n\nticksObservable.subscribe(function(eventTicks) {\n    console.log('Subscriber\
    \ 2 - eventTicks: ' + eventTicks + ' so far');\n});\n```\n\nAnd the expected output:\n\
    \n> Subscriber 1 - eventTicks: 1 so far\n> Subscriber 2 - eventTicks: 1 so far\n\
    > Subscriber 1 - eventTicks: 1 so far\n> Subscriber 2 - eventTicks: 1 so far\n\
    > Subscriber 1 - eventTicks: 2 so far\n> Subscriber 2 - eventTicks: 2 so far\n\
    > Subscriber 1 - eventTicks: 2 so far\n> Subscriber 2 - eventTicks: 2 so far\n\
    \nUsing `scan`, we avoid external state altogether. We pass the accumulated count\
    \ of even ticks to `updateDistance` instead of relying on an external variable\
    \ to keep the accumulated value. This way we don't increment the count with every\
    \ new subscriber.\n\nMost of the time we can avoid relying on external state.\
    \ Common scenarios for using it are caching values or keeping track of changing\
    \ values in the program. But, as you'll see in Spaceship Reactive! (on page 50),\
    \ these scenarios can be handled in several other ways. For example, when we need\
    \ to cache values, RxJS's Subject Class (on page 45) can help a lot, and when\
    \ we need to keep track of previous states of the game, we can use methods like\
    \ `Rx.Observable.scan`.\n\n### Pipelines Are Efficient\n\nThe first time I chained\
    \ a bunch of operators into a pipeline to transform a sequence, my gut feeling\
    \ was that it couldn't possibly be efficient. I knew transforming arrays in JavaScript\
    \ by chaining operators is expensive. Yet in this book I'm telling you to design\
    \ your program by transforming sequences into new ones. Isn't that terribly inefficient?\n\
    \nChaining looks similar in Observables and in arrays; there are even methods\
    \ like `filter` and `map` that are present in both types. But there's a crucial\
    \ difference: array methods create a new array as a result of each operation,\
    \ which is traversed entirely by the next operation. Observable pipelines, on\
    \ the other hand, don't create intermediate Observables and apply all operations\
    \ to each element in one go. The Observable is thus traversed only once, which\
    \ makes chaining Observables efficient. Check out the following example:\n\n```javascript\n\
    // spaceship_reactive/array_chain.js\nstringArray // represents an array of 1,000\
    \ strings\n.map(function(str) {\n  return str.toUpperCase();\n})\n.filter(function(str)\
    \ {\n  return /^[A-Z]+$/.test(str);\n})\n.forEach(function(str) {\n  console.log(str);\n\
    });\n```\n\nLet's suppose `stringArray` is an array with 1,000 strings that we\
    \ want to convert to uppercase and then filter out the ones that contain anything\
    \ other than alphabet characters (or no letters at all). Then we want to print\
    \ each string of the resulting array to the console.\n\nThis is what happens behind\
    \ the scenes:\n\n- Iterate through the array and create a new array with all items\
    \ uppercase.\n- Iterate through the uppercase array, creating another array with\
    \ 1,000 elements.\n- Iterate through the filtered array and log each result to\
    \ the console.\n\nIn the process of transforming the array, we've iterated arrays\
    \ three times and created two completely new big arrays. This is far from efficient!\
    \ You shouldn't program this way if you're concerned about performance or you're\
    \ dealing with big sequences of items.\n\nThis is what the same operation would\
    \ look like using Observables:\n\n```javascript\n// spaceship_reactive/array_chain.js\n\
    stringObservable // represents an observable emitting 1,000 strings\n.map(function(str)\
    \ {\n  return str.toUpperCase();\n```"
  mdcn: "\n## 构建并发程序\n\n并发是一门在正确且高效地同时执行多项任务的艺术。为了实现这一点，我们需要构建程序以充分利用时间，使任务能够以最高效的方式共同运行。应用程序中日常并发的例子包括：在执行其他活动时保持用户界面响应，以及高效地处理数百名客户的订单。\n\
    \n在本章中，我们将通过为浏览器制作一个射击类太空飞船游戏，来探索 RxJS 中的并发和纯函数。我们将首先介绍 Observable 管道（pipeline），这是一种将\
    \ Observable 操作符链接起来并在它们之间传递状态的技术。然后，我将向你展示如何使用该管道来构建程序，而无需依赖外部状态或副作用，方法是将所有逻辑和状态封装在\
    \ Observable 自身内部。\n\n电子游戏是需要维护大量状态的计算机程序，但我们将利用 Observable 管道的强大功能和一些出色的 RxJS\
    \ 操作符，在完全不使用任何外部状态的情况下编写我们的游戏。\n\n## 纯度与 Observable 管道\n\nObservable 管道是一组链式连接的操作符，其中每个操作符接收一个\
    \ Observable 作为输入并返回一个 Observable 作为输出。我们在本书中一直在使用管道：在 RxJS 编程中，它们无处不在。这是一个简单的示例：\n\
    \n```javascript\n// spaceship_reactive/pipeline.js\nRx.Observable\n  .from(1,\
    \ 2, 3, 4, 5, 6, 7, 8)\n  .filter(function(val) { return val % 2; })\n  .map(function(val)\
    \ { return val * 10; });\n```\n\n管道是自包含的。所有状态从一个操作符流向下一个操作符，无需任何外部变量。但在构建响应式程序时，我们可能会倾向于在\
    \ Observable 管道之外存储状态（我们在第 5 页的“副作用与外部状态”中讨论过外部状态）。这迫使我们要跟踪在管道外部设置的变量，而所有这些琐碎的计数很容易导致\
    \ Bug。为了避免这种情况，管道中的操作符应当始终使用纯函数。\n\n纯函数在给定相同输入时总是返回相同的输出。当我们能够保证程序中的某个函数不会修改其他函数依赖的状态时，设计高并发程序会变得更容易。而这正是纯函数赋予我们的能力。\n\
    \n### 避免外部状态\n\n在接下来的示例中，我们计算 `interval` 至今产生的偶数数量。我们通过创建由 `interval` 滴答（ticks）组成的\
    \ Observable，并在接收到的滴答为偶数时增加 `evenTicks` 来实现：\n\n```javascript\n// spaceship_reactive/state.js\n\
    var evenTicks = 0;\n\nfunction updateDistance(i) {\n    if (i % 2 === 0) {\n \
    \       evenTicks += 1;\n    }\n    return evenTicks;\n}\n\nvar ticksObservable\
    \ = Rx.Observable\n    .interval(1000)\n    .map(updateDistance);\n\nticksObservable.subscribe(function()\
    \ {\n    console.log('Subscriber 1 - evenTicks: ' + evenTicks + ' so far');\n\
    });\n```\n\n程序运行四秒后，我们得到的输出如下：\n\n> Subscriber 1 - evenTicks: 1 so far\n> Subscriber\
    \ 1 - evenTicks: 1 so far\n> Subscriber 1 - evenTicks: 2 so far\n> Subscriber\
    \ 1 - evenTicks: 2 so far\n\n现在，为了尝试，让我们为 `ticksObservable` 添加另一个订阅者：\n\n```javascript\n\
    // spaceship_reactive/state.js\nvar eventTicks = 0;\n\nfunction updateDistance(i)\
    \ {\n    if (i % 2 === 0) {\n        eventTicks += 1;\n    }\n    return eventTicks;\n\
    }\n\nvar ticksObservable = Rx.Observable\n    .interval(1000)\n    .map(updateDistance)\n\
    \nticksObservable.subscribe(function() {\n    console.log('Subscriber 1 - eventTicks:\
    \ ' + eventTicks + ' so far');\n});\n\nticksObservable.subscribe(function() {\n\
    \    console.log('Subscriber 2 - eventTicks: ' + eventTicks + ' so far');\n});\n\
    ```\n\n现在的输出如下：\n\n```text\nSubscriber 1 - eventTicks: 1 so far\nSubscriber 2\
    \ - eventTicks: 2 so far\nSubscriber 1 - eventTicks: 2 so far\nSubscriber 2 -\
    \ eventTicks: 2 so far\nSubscriber 1 - eventTicks: 3 so far\nSubscriber 2 - eventTicks:\
    \ 4 so far\nSubscriber 1 - eventTicks: 4 so far\nSubscriber 2 - eventTicks: 4\
    \ so far\n```\n\n等一下——订阅者 2 上的事件滴答计数完全错了！它应该始终包含与订阅者 1 相同的 `eventTicks` 计数。原因正如你可能猜测的那样，Observable\
    \ 管道会为每个订阅者运行一次，从而导致 `eventTicks` 增加了两次。\n\n共享外部状态引起的问题通常比这个例子更隐蔽。在复杂的应用程序中，允许在管道外部更改状态会导致代码变得复杂，Bug\
    \ 很快就会出现。解决方案是将尽可能多的信息封装在管道内部。以下是我们重构上述代码以避免外部状态的一种方法：\n\n```javascript\n// spaceship_reactive/state.js\n\
    function updateDistance(acc, i) {\n    if (i % 2 === 0) {\n        acc += 1;\n\
    \    }\n    return acc;\n}\n\nvar ticksObservable = Rx.Observable\n    .interval(1000)\n\
    \    .scan(updateDistance, 0);\n\nticksObservable.subscribe(function(eventTicks)\
    \ {\n    console.log('Subscriber 1 - eventTicks: ' + eventTicks + ' so far');\n\
    });\n\nticksObservable.subscribe(function(eventTicks) {\n    console.log('Subscriber\
    \ 2 - eventTicks: ' + eventTicks + ' so far');\n});\n```\n\n预期输出为：\n\n> Subscriber\
    \ 1 - eventTicks: 1 so far\n> Subscriber 2 - eventTicks: 1 so far\n> Subscriber\
    \ 1 - eventTicks: 1 so far\n> Subscriber 2 - eventTicks: 1 so far\n> Subscriber\
    \ 1 - eventTicks: 2 so far\n> Subscriber 2 - eventTicks: 2 so far\n> Subscriber\
    \ 1 - eventTicks: 2 so far\n> Subscriber 2 - eventTicks: 2 so far\n\n通过使用 `scan`，我们完全避免了外部状态。我们将偶数滴答的累积计数传递给\
    \ `updateDistance`，而不是依赖外部变量来保存累积值。这样我们就不会在每个新订阅者出现时增加计数。\n\n大多数情况下，我们可以避免依赖外部状态。使用它的常见场景是缓存值或跟踪程序中变化的值。但是，正如你在《响应式飞船》（第\
    \ 50 页）中将看到的，这些场景可以通过其他几种方式处理。例如，当我们需要缓存值时，RxJS 的 Subject 类（第 45 页）会有很大帮助；而当我们需要跟踪游戏的先前状态时，可以使用\
    \ `Rx.Observable.scan` 等方法。\n\n### 管道是高效的\n\n第一次将一堆操作符链接到管道中以转换序列时，我的直觉是这不可能高效。我知道在\
    \ JavaScript 中通过链式调用操作符来转换数组是很昂贵的。然而，在本书中，我建议你通过将序列转换为新序列来设计程序。这难道不是极低效的吗？\n\n\
    Observable 和数组的链式调用看起来很相似，甚至都有 `filter` 和 `map` 这样相同的方法。但有一个至关重要的区别：数组方法在每次操作后都会创建一个新数组，然后由下一个操作完整遍历。而\
    \ Observable 管道不会创建中间 Observable，而是将所有操作一次性应用于每个元素。因此，Observable 仅被遍历一次，这使得 Observable\
    \ 的链式调用非常高效。请查看以下示例：\n\n```javascript\n// spaceship_reactive/array_chain.js\n\
    stringArray // 代表一个包含 1,000 个字符串的数组\n.map(function(str) {\n  return str.toUpperCase();\n\
    })\n.filter(function(str) {\n  return /^[A-Z]+$/.test(str);\n})\n.forEach(function(str)\
    \ {\n  console.log(str);\n});\n```\n\n假设 `stringArray` 是一个包含 1,000 个字符串的数组，我们希望将其转换为大写，然后过滤掉包含非字母字符（或完全没有字母）的字符串。最后，我们将结果数组中的每个字符串打印到控制台。\n\
    \n后台发生的情况如下：\n\n- 遍历数组，创建一个所有项目均为大写的新数组。\n- 遍历大写数组，创建另一个包含 1,000 个元素的数组。\n- 遍历过滤后的数组，并将每个结果记录到控制台。\n\
    \n在转换数组的过程中，我们遍历了三次数组并创建了两个完全庞大的新数组。这远非高效！如果你关注性能或处理大规模项目序列，不应该这样编程。\n\n同样的 operation\
    \ 使用 Observable 后的样子如下：\n\n```javascript\n// spaceship_reactive/array_chain.js\n\
    stringObservable // 代表一个发出 1,000 个字符串的 observable\n.map(function(str) {\n  return\
    \ str.toUpperCase();\n```\n"
