    DoS is a form of cyber attack with the purpose of interrupting (for an amount
    of time) the operation of a particular service on a server, with only one source
    (the computer). Thus, receiving a lot of requests, a web server for example, would
    not handle and block at the moment (interruption of the service). Here''s an example
    in Figure 5.5:


