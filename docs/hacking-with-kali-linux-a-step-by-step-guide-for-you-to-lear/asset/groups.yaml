    ## 2) Integrity


    So, basically, what does data integrity mean?

    The integrity of the data ensures that a file can be transferred from a point
    to a point B without altering (or modifying) its content. It is obtained following
    a process called hashing.


    Suppose we have a PDF file that we want to ensure integrity through the Internet
    transfer. To do this we need the HASH of this PDF file.


    Hash a file helps determine its integrity. When we want to send a file over the
    Internet, changes can take place along the way (packet loss, alteration of information,
    hacker changes content).


    Here are some algorithms for determining the integrity of data:


    - MD5 - 128 bits

    - SHA1 - 160 bits

    - SHA2 - 256 bits

    - SHA3 - 384 bits (the current standard)

    - SHA5 - 512 bits


    ## 3) Availability


    What value would our data be encrypted and hash-if they cannot be accessed? How
    can we use data if the servers, the network (or the stream: D) are down?


    The answer is simple: we could not use them. Then an attack that has the goal
    of interrupting the data availability can be considered a threat to the cyber
    security of a company / organization? Of course. To combat such data security
    incidents, we have several options that we can implement:


    - Redundancy - network, server, UPS, etc.

    - Backup


    These two elements underlie the availability of data. Now let''s see the first
    element:


    ### a) Redundancy


    There are several types of redundancy, but first let''s see what Redundancy is
    like.


    Redundancy ensures that for any critical component that assures the operation
    of the company (network, server, power supply, etc.) we have at least one active
    replacement. This means that if we have a single Router that is connected to the
    Internet, to ensure redundancy (at best) we will need 2 connections to 2 different
    Internet providers and 2 Routers that connect to these providers.


    When it comes to Server-level redundancy, we can think of two or more servers
    that offer the same services (e.g. web, databases, etc.). Or we can even refer
    to store storage discs (HDDs or SSDs) that can be "linked" together to provide
    redundancy using a technology called RAID (Redundant Array of Independent Disks).


    ### b) Backup


    We all know how important the backups are. Both hard disks (SSD) and site-level,
    configuration files, code, etc. **Recurring backups** can "save our skin" very
    often because it is a copy of everything that we have lived in a system.


    For example, in the case of a Ransomware attack (which) if we do not want to pay
    the amount required by hackers, the only option we have is the backup (specifically,
    the restoration of an existing one that will bring that system back to life).


    Unfortunately, in this case, if backups *not done quite often* (at least weekly
    if not daily) then a partial loss of the most recent changes will be achieved.


    What we have discussed so far is the basics of data security (both those running
    through the Internet and those that "stay" stored on a hard disk / SSD).


    As a summary of those discussed, I would like to remind you that:


    - 1. **CIA** (Confidentiality - Encryption - Integrity, Availability) is the basis
    of Cyber Security

    - 2. There are 2 ways to make **Data Encryption** (Symmetric and Asymmetric)

    - 3. Data **integrity** is established by a **Hash** (which is a unique value
    for any sequence of information)

    - 4. It is extremely important to ensure the **Availability** of data. A few ways
    we can do it is by using Backup and Redundancy elements


    ## V. Malware and Cyber Attacks


    In this chapter, we start talking about **malware types**, and later on we we
    will discuss **Cyber Attacks**. For starters, we will discuss Viruses, Trojans,
    Worms, Ransomware and other types of programs that were badly designed. But first
    of all, let us answer the following question:


    ## 1) What is a Malware ?


    A malware (aka. malicious software) is a malicious software program designed to
    steal, destroy, or corrupt data stored on our devices.


    Many people use the generic term of the virus, which is not necessarily correct
    because there can be many types of dangerous programs. Here below (only) a part
    of them:


    - 1) Virus

    - 2) Trojans

    - 3) Worms

    - 4) Ransomware

    - 5) Spyware

    - 6) Aware

    - 7) and many more (Rootkit, time bombs, backdoor, etc.)


    Figure 5.1


    Here is the picture below on Wikipedia, the proportion (in 2011) of malware from
    the Internet. Since then, many things have changed or changed, but it''s interesting
    to have such a hierarchy with the most common types of malware.


    ![](img/85e17094b9b0b18870d12b91b22fb038_49_0.png)


    Malware by categories March 16, 2011


    Figure 5.2


    And now take some of these malware and discuss them in more detail:


    ### 1) Viruses


    A virus is a program with which we are all accustomed to. Whether we had the computer
    infected with a virus or that we heard / seen someone else, we know that these
    viruses can be really dangerous for us (and especially for our data stored on
    the computer - the most important element for us).


    Virus programmers take advantage of existing vulnerabilities in different operating
    systems (especially Windows) and write software to take advantage of them (and
    users of these devices).


    ### 2) Trojans


    A Trojan is a type of program designed to appear for the benefit of the person
    who uses it, but there is a malicious code behind that has other intentions altogether.
    These types of programs are most common in the Internet (as you could see in the
    picture above) and are used to be being easily masked in front of an inexperienced
    user. So in the (first) run of the program, the trojan is installed and will hide,
    doing its job "quietly". The term Trojan comes from the story of the Trojan horse
    in Greek mythology, exposed in the movie Troy.


    ### 3) Worms


    A worm is a form of malware once it infects a device (PC, laptop, server, etc.)
    will do its best to expand and infect others on the network. Thus, a worm manages
    to slow networks and the connected devices (by using CPU and RAM resources) and
    even the network, because infected computers will generate abnormal traffic.


    ### 4) Ransomware


    A more popular type of malware lately is ransomware, whose purpose is to encrypt
    the hard disk (or SSD) victims and to request a cash redeem for the decryption
    key.


    ### 5) Adware


    There are programs that once installed on a device (or in the browser) will start
    to show commercials (annoying).


    ### 6) Spyware


    Spyware are programs designed to extract certain data from users. They are not
    meant to hurt (by consuming resources) or affect the victim in any way, but simply
    extract data and send them to "mother servers" (those who have initiated "espionage").


    First, you need to be aware of the existence of such programs, after which you
    have to take protection / prevention measures against them.

    In this situation, anti-virus programs are very welcome because they contain very
    large databases (called signatures) that check every program / file on your operating
    system (Windows, Linux or Mac).


    Now you can also know that Windows has the highest number of malware (viruses,
    Trojans, ransomware, etc.). Why? Because Windows is the most widely used operating
    system in the world, and hackers have something to "steal." That''s why the main
    focus of attackers and cyber-security companies is on Windows.


    The Mac and Linux are also not free from malware, but their number is not that
    big. They have been designed with a higher degree of security and operate differently
    from Windows.


    ## 2) Examples of Cyber Attacks


    In this section of Chapter 5, we''ll talk about Cyber Attacks and we''ll see some
    examples of Cyber Attacks (and hacking methods) from the Internet.

    These hacking methods are very common, and each one serves a particular purpose.


    Here are some of the most common attacks on the Internet:


    - 1) MITM-Man in the Middle

    - 2) DoS-Denial of Service

    - 3) DDoS-Distributed Denial of Service, check this link: http://www.digitalattackmap.com/

    - 4) SQLi-SQL injection

    - 5) XSS-Cross-Site Scripting


    In addition, there are many more in the Internet world, but to illustrate some,
    we will only focus on the top 3. So let''s take the first type of attack, MITM,
    and discuss it in more more detail about it (and show you some ways you can make
    such attacks - but please do it in an ethical way), after which will we go further
    with the discussion and DoS and DDoS.


    After all, in Chapter 6 we will discuss web security and other types of attacks:
    SQL injections and XSS.

