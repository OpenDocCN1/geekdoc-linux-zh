    |---|---|

    | A1-Injection (注入) | A1-Injection (注入) |

    | A2-Broken Authentication and Session Management (身份验证与会话管理损坏) | A2-Broken Authentication
    and Session Management (身份验证与会话管理损坏) |

    | A3-Cross-Site Scripting (XSS) (跨站脚本) | A3-Cross-Site Scripting (XSS) (跨站脚本)
    |

    | A4-Insecure Direct Object References (不安全的直接对象引用 - 合并到 A7)| A4-Broken Access
    Control (访问控制损坏 - 2003/2004 原始类别) |

    | A5-Security Misconfiguration (安全配置错误) | A5-Security Misconfiguration (安全配置错误)
    |

    | A6-Sensitive Data Exposure (敏感数据泄露) | A6-Sensitive Data Exposure (敏感数据泄露) |

    | A7-Missing Function Level Access Control (缺失功能级访问控制 - 合并到 A4)| A7-Insufficient
    Attack Protection (攻击防护不足) |

    | A8-Cross-Site Forgery (跨站伪造) | A8-Cross-Site Forgery (跨站伪造) |

    | A9-Using Components with Vulnerabilities (使用含有漏洞的组件) | A9-Using Components with
    Vulnerabilities (使用含有漏洞的组件) |

    | A10-Insecure Object References (不安全的直接对象引用) | A10-Insecure Object References
    (不安全的直接对象引用) |

