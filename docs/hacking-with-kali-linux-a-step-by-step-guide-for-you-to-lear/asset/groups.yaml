    # AES Design


    ![](img/85e17094b9b0b18870d12b91b22fb038_125_0.png)


    Figure 9.1


    In the figure above, you can see how the text / file (which we want to encrypt
    - Plain Text) is added (together with the secret key) in the AES encryption function
    (Cipher). The executed text gets the encrypted text (Cipher Text).


    ## b) Asymmetric Encryption


    When it comes to asymmetric encryption, things are a little different. The complexity
    of this encryption is much over the symmetric (1024, 2048 or even 4096 bits vs
    128, 192, 256), but the consumption of hardware resources is much higher. Besides,
    asymmetric encryption uses a pair of keys - one public and one private.


    The private key is meant to be ... private, and the public key can be distributed
    to anyone. Asymmetric encryption is done as follows:


