    ## X. Protecting our Internet traffic with VPN technology


    I''m sure you''ve heard of the term VPN. This technology was very common in the
    last time when when the number of cyber attacks is on the rise (Cyber Security
    is beginning to become more and more important). So the topic we are discussing
    in this chapter is VPN.


    ## What is a VPN?


    A Virtual Private Network (VPN) is a tunnel between 2 Routers / Firewalls (or
    even a PC, laptop, phone to a particular server) that provides secure access between
    2 or more networks. In addition to security, the VPN connects the two networks
    (as if they were directly connected).


    You can now think, "Hmm ... weird, I knew totally different! Is not the VPN one
    that changes my IP and secures my connection? " My answer: "Yes, the VPN also
    does this, as you will see, there are several types of VPNs, each with its purpose."
    We''ll talk about this in more detail.


    Until then, here is 10.1, the classic example of a VPN tunnel over the Internet
    linking 2 networks (and securing traffic) - (img/85e17094b9b0b18870d122238142_0)


    Figure 10.1


    With this tunnel, end-devices (PCs, laptops, Servers) of the two networks can
    communicate securely over the Internet. Virtually the connection between the two
    networks is as if they were directly connected to same Router.


    If in 10.26.3.0/24 network (connected to R2 - right) there are several servers
    (mail, files, etc.), using this VPN (created on Routers), the 192.168.19.0 network
    (left - R1) will have access.


    ## How many types of VPNs do exist?


    In short, there are 2 main VPN categories / types that exist on the market, namely:


    - VPN Site-to-Site

    - Remote Access VPN


    Now I think it would be a good idea to talk about each one separately;


    ## 1) VPN Site-to-Site


    What you saw earlier in Figure 10.1 is a type of Site-to-Site VPN. Why? Because
    it connects 2 locations (sites - NOT web, but networks) differently as if they
    were directly connected. Even more, a VPN makes you anonymous (change the IP address
    with some "false") and secure the connection of all devices that send traffic
    from the R1 network to the R2 network and vice versa. This type of VPN uses a
    technology called IPSec (Internet Protocol Security) for encryption, integrity,
    and authentication that we''ll talk about later.


    In the example below (Figure 10.2) you can see how a site-to-site VPN topology
    looks logically. This topology takes place between 3 locations (anywhere in the
    world). You can see how Router R1 (and the network behind 192.168.19.0/24) connects
    to R2 and R3 respectively. This R1 and his network will have access to the internal
    resources of R2, R3.


    If this is a company, then these resources can be: Active Directory Server, DNS
    Server, Mail Server, Skype for Business etc.

