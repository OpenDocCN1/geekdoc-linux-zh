    # 1) SQL Injection


    When we talk about SQL injection, we are talking primarily about databases, and
    secondly about the attack (a vulnerability) at their level. Let''s first look
    at what SQL is. **SQL (Structured Query Language)** is a query language with databases.
    It is used to communicate directly with the database through various commands
    addressed to it. There are several types / forms of SQL, but the basics are the
    same.


    Practically SQL injection (Figure 7.2) is a way for a hacker to access a database
    in an unauthorized way and extract extraordinarily important information (data
    about people, username & password, contact data such as emails or bank information,
    etc.). This is generally due to a programming error.


    ![](img/85e17094b9b0b18870d12b91b22fb038_83_0.png)


    Where are the SQL injection attacks? Most often these occur when the attacker
    finds a "box" in which he can enter data. For example, think about a search box
    in which anyone can write anything.'
  - '[PAGE 84]


    If the back code (most often PHP) is not written properly, then the hacker can
    enter SQL commands that interact directly with the database, so they can extract
    different information.


    Now I want you to think that when you interact with an "input form" (a box where
    you can write and send something to the server), this happens:


    ```

    SELECT * FROM ? WHERE LIKE ''%...'';

    ```


    That is, PHP language will generate such an order to interact (and search) with
    the database. In the place where "%" appears, it will be replaced with what you
    enter in that input form.


    Here''s an example of a SQL code that can be entered in this field (ATTENTION:
    it will not work for any site. I suggest using the bWAPP application and testing
    it):


    ```

    * OR 1=:-

    ```


    You can try on this site (https://sqlzoo.net/hack/) to enter the SQL statement
    instead of the username and password.


    SQLmap (http://sqlmap.org/) is a great tool for you to test database vulnerabilities
    on a site. SQLmap will do all these queries that automate SQL injection for you
    (and even try to break the hash of the passwords you will find in the database).


    I also recommend that you download and install bWAPP, a web application that contains
