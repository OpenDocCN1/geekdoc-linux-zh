    \n# 第八章：防火墙\n\n我们将开始一个关于防火墙及其工作原理的新型有趣章节。我想告诉你们的一点是：只要你工作的内容涉及服务器、网络、网站（特别是网络安全），我向你保证你将会遇到（很多）防火墙。\n\
