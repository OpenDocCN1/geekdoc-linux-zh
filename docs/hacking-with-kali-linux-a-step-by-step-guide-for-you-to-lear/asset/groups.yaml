    \ | 2017.1 | 7e5b... |\n| Kali 32-bit Light | 2017.1 | 4d8f... |\n| Kali 64-bit\
    \ ARM | 2017.1 | 1a3c... |\n| Kali 64-bit Mobile | 2017.1 | 2b9d... |\n| Kali\
    \ 64-bit Live | 2017.1 | 6f0e... |\n| Kali 32-bit Live | 2017.1 | 3c4b... |\n\
    | Kali-installer | 2017.1 | 5d7a... |\n| Kali-arm | 2017.1 | 9a1f... |\n| Kali-linux-64-bit-Virtualbox\
    \ | 2017.1 | 8c2e |\n\n图 3.2\n\n下载 Kali Linux OS 镜像和 Virtualbox 虚拟化程序后，后续步骤是：\n\
