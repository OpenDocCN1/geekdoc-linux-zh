    - User & Password (or just password)

    - Biometrics (fingerprint, eye, saliva, face etc.)

    - Based on location (you can access a resource only if you are in a center location)

    - Time-based (you can only access a resource at a certain point in time)

    - Based on the token (a special tool you just own or even the phone)


    In short and a little more scientifically, authentication can be done on the basis
    of the following factors:


    - what you know (user password),

    - what you are (biometric),

    - where you are (location),

    - what you own (phone, token)

    - the moment in time


    I want to introduce some terms that are being used more often (for example, in
    banks or on different platforms - Amazon, Digital Ocean, Google, Facebook, etc.).
    Here I refer to 2FA (2 Factor Authentication). And so, if we combine 2 different
    factors (of those previously expressed), we get authentication in 2 factors.


    An example of one-factor authentication (1FA) is the use of a User and Password.
    If we want to have 2FA, then we can add biometric authentication or a token (only
    one of them NOT both).


    The more authentication types we add, the more complex and secure it will be.


    WARNING: if we have to go through 3 different steps each time we are asked for
    a different password, it does not represent 3FA, but authentication through one
    factor. Why? To use what we know, in this case passwords (does not combine it
    with other modes).


    ## What is a Digital Signature?


    The **DSA (Digital Signature Algorithm)** algorithm is similar to RSA, but it
    is used to generate digital signatures. This process (digital signature) takes
    place by encrypting a message / file (by the source of the message) with the private
    key and sending it to the destination.


    The destination will try to decrypt that message with the public key, and if it
    manages to do this, the source of the message will be confirmed (aka: the message
    comes from the desired entity in the communication).


    ## What are Digital Certificates?


    Another way we can authenticate an entity is by using a Digital Certificate. It''s
    a much safer and more reliable method when it comes to authentication. Why? the
    digital certificate is issued by a superior, trustworthy authority that uniquely
    identifies one person / entity.


    After all, what is a digital certificate? It is an "identity act" of an entity
    on the Internet. This digital certificate contains the following information:


    - The public key of entity A (we take a fictitious example of the entity as A)

    - Entity information

    - Certificate Authority - the certification authority that issued the certificate

    - Protocols used for encryption (AES, RC4,etc.)

    - Date of creation and expiration date of the certificate


    Let''s talk about all of this:


    **a) The public key** is used by the person (B) who receives the digital certificate
    for encrypting the message back to the entity (A). At the same time it is used
    to decrypt the message included in the certificate (which was encrypted with the
    private key). So, as I said earlier, the source of the message is authenticated
    (aka Digital Signature).


    **b) Information** about the entity A - information about the organization,


    **c) Certificate Authority** (CA)- the certification authority that issued the
    certificate


    A CA can be an organization that everyone trusts. So if many other organizations
    trust this CA, and the CA has confidence in you, then everyone will trust you.
    That''s how the certificates work, and that''s their purpose. Basically, in a
    math format, the scenario would look like this:


    ```

    A = C

    B = C => A = B

    ```


