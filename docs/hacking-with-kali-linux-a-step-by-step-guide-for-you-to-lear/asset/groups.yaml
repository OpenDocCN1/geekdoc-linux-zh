    ## X. 使用 VPN 技术保护我们的互联网流量


    我确定你听过 VPN 这个术语。在过去网络攻击增加的时期，这项技术非常常见（网络安全开始变得越来越重要）。所以，我们在这一章中讨论的话题是 VPN。


    ## 什么是 VPN？


    虚拟专用网络（VPN）是两个路由器/防火墙之间（甚至是从 PC、笔记本电脑、手机到特定服务器）的一条隧道，它在两个或多个网络之间提供安全访问。除了安全性之外，VPN
    还连接了这两个网络（就像它们直接连接了一样）。


    你现在可能会想：“嗯……奇怪，我理解的完全不同！VPN 不是那种能改变我的 IP 并保护我的连接的工具吗？”我的回答是：“是的，VPN 确实如此，正如你将看到的，有几种类型的
    VPN，每种都有其目的。”我们将详细讨论这一点。


    在此之前，这里是 10.1，一个跨越互联网连接两个网络（并保护流量）的 VPN 隧道的经典示例 - - (img/85e17094b9b0b18870d122238142_0)


    图 10.1


    通过这条隧道，两个网络的终端设备（PC、笔记本电脑、服务器）可以在互联网上安全地通信。虚拟上，两个网络之间的连接就像它们直接连接了一样。


    如果 10.26.3.0/24 网络（连接到 R2）中有多个服务器（邮件、文件等），通过此 VPN（在路由器上创建），192.168.19.0 网络（左侧
    - R1）将获得访问权限。


    ## 存在多少类型的 VPN？


    简而言之，市场上存在两种主要的 VPN 类别/类型，即：


    - 点对点 VPN (Site-to-Site)

    - 远程访问 VPN (Remote Access VPN)


    现在认为最好分开讨论每一个；


    ## 1) 点对点 VPN


    你之前在图 10.1 中看到的就是一种点对点 VPN。为什么？因为它由于连接了两个位置（站点 - 不是网页，而是网络），就像它们直接连接了一样。此外，VPN
    让你变得匿名（用某些“虚假”地址替换 IP），并保护从 R1 网络发送到 R2 网络以及反之的所有设备的连接。这种类型的 VPN 使用名为 IPSec（互联网协议安全）的技术进行加密、完整性和身份验证，我们稍后会讨论。


    在下例所示（图 10.2）中，你可以看到点对点 VPN 的拓扑结构。这种拓扑结构发生在三个位置（全球任何地方）。你可以看到路由器 R1（以及位于 192.168.19.0/24
    后的网络）分别连接到 R2 和 R3。因此 R1 及其网络将访问 R2、R3 的内部资源。


    如果这是一家公司，那么这些资源可以是：活动目录服务器、DNS 服务器、邮件服务器、Skype for Business 等。


