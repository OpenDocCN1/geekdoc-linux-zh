    level).


    Security is important and we want more sophisticated algorithms to encrypt (or
    do anything else) the best, but we forget an important aspect: the hardware performance.
    Do we have enough strong equipment to make these demands possible? And here we
    can refer to Firewalls, Routers or even our end-devices.


    Also related to VPNs (especially Site-to-Site), there is a concept called IKE
    (Internet Key Exchange). At the time of creating this tunnel (before our traffic
    is secure) two tunnels are created:


    +   - The first tunnel, in order to facilitate the safe (secure) creation of the
    2nd tunnel


    +   - The 2nd Tunnel in order to secure the traffic that is to pass through it'
  - '[PAGE 164]


    Basically, IKE helps create these 2 tunnels (which ultimately form the main VPN
    tunnel). But it does not do this alone, but with the help of the next security
    framework.'
- md: "\n# What is IPSSec?\n\nIPSec (or Internet Protocol Security) is a framework\
    \ that helps protect (data) information flowing through the Internet. IPSec makes\
    \ this possible through the four key elements that make up it:\n\n- Encryption\
    \ (Confidentiality)\n- Integrity\n- Authentication\n- Anti-replay\n\nAs I said\
    \ earlier, IPSec is a framework. Maybe you wonder what this means? Well, a framework\
    \ is an application structure (IPSec) that accepts add-ons, changes to new protocols.\n\
    \nWhether we are talking about data encryption or integrity, and if you come with\
    \ a new protocol (encrypting or doing one of the above mentioned procedures) then\
    \ we can integrate it into IPSec to use it to secure our applications (or VPN\
    \ tunnels).\n\nAnd now I will give you some examples of protocols (included in\
    \ IPSec) that help encrypt data from a VPN:\n\n- In the case of encryption we\
    \ have the following protocols:\n  - DES, 3DES\n  - AES, BlowFish, RC4\n- In the\
    \ case of data integrity the protocols are:\n  - MD5, SHA1\n  - SHA2, SHA3\n-\
    \ In the case of authentication we have 2 main methods\n  - User and password\n\
    \  - Digital certificates\n\nThe 4th element (Anti-replay) refers to the fact\
    \ that the recipient (from an IPSec connection) can detect the data fields that\
    \ were sent in the first phase. This defense mechanism ensures that the source\
    \ of the message does not retrieve the data for malicious purposes, thus attempting\
    \ somewhat denying that they were sent in the first instance. In addition, IPSec\
    \ is based on two major headers encapsulating the standard IP packet:\n\n- AH\
    \ - Authentication Header (which only establishes integrity and authenticates\
    \ traffic, does NOT encrypt it)\n- ESP - Encapsulating Security Payload - Ensures\
    \ all four elements mentioned below\n\nIn Figure 10.11 below you can see how an\
    \ AH header looks, its primary role being to authenticate the package. It contains\
    \ the necessary data for the authentication of each package, ie the assurance\
    \ of their integrity.\n\n| IP header | AH header | TCP header | TCP payload /\
    \ data |\n| :--- | :--- | :--- | :--- |\n\nFigure 10.11\n\nIn Figure 10.12 you\
    \ can see how the ESP header encapsulates the entire packet and encrypts it (all\
    \ data from level 3 up to level 7 inclusive).\n\n| IP header | ESP | Encapsulated\
    \ IP packet or TCP header + payload |\n| :--- | :--- | :--- |\n\nFigure 10.12\n\
    \nThus, encrypting the entire header, IPSec (in the case of this ESP) adds a new\
    \ IP field (that is, changing the current IP address with a false IP) so as to\
    \ hide the source or destination. Maybe you wonder why this is going to happen?\
    \ Because the 2 (source and destination) will be anonymous.\n\nWhen we connect\
    \ (from your phone or laptop) to a VPN, the connection will be SSL VPN. If we\
    \ want to connect 2 networks between them, we will form an IPSec VPN tunnel between\
    \ these 2 Routers and so all the equipment in the two networks will be able to\
    \ communicate with each other (over the Internet - similar to the topology in\
    \ figure 10.13).\n\n![](img/85e17094b9b0b18870d12b91b22fb038_167_0.png)\n\nNow\
    \ I hope you have a much more detailed understanding of what we can refer to VPN.\
    \ The fact that there are several types:\n\n- Site-to-Site used for network connections\
    \ for Firewalls or Routers\n- Respectively Remote-Access, used for end-device\
    \ remote connections for security / anonymity purposes, or to access the internal\
    \ resources of a network / companies\n\nAnd a few things about IPSec technology,\
    \ more precisely the role of each component of this framework (which I have discussed\
    \ in more detail in this chapter and in the previous chapter):\n\n- Encryption\n\
    - Integrity\n- Authentication\n- Anti-replay\n\n# Enjoyed the book? Please leave\
    \ a Review on Amazon.com\n\nIf you received value from this book, then I'd like\
    \ to ask you for a favor. Would you be kind enough to leave a review for this\
    \ book on Amazon.\n\n[Click here to leave a Review on Amazon.com (https://amzn.to/2I6n4v3)]\n\
    \n![](img/85e17094b9b0b18870d12b91b22fb038_169_0.png)\n\nI would like to thank\
    \ you for reading this book and reaching to the end of it (trust me when I say,\
    \ that not many people manage to get this far away).\n\nAlso, I want to reach\
    \ as many people as I can with this book (my goal is 10.000 people in the next\
    \ 3 years). That’s a lot of people and without you and your review I won’t be\
    \ able to achieve that.\n\nNot only that, but you will receive some good karma\
    \ that sooner or later will manifest into your life.\n\nThank you! Ramon Nastase\
    \ (https://ramonnastase.com/).\n"
  mdcn: "\n\n# 什么是 IPSec？\n\nIPSec（或 Internet协议协议安全）是一种帮助保护在互联网上传输的（数据）信息的框架。IPSec\
    \ 通过构成体系的四个关键要素实现了这一点：\n\n- 加密（机密性）\n- 完整性\n- 身份验证\n- 防重放\n\n正如我早之前提到的，IPSec 是一个框架。你可能在想这意味着什么？嗯，框架是一个应用结构（IPSec），它接受插件以及对新协议的更改。\n\
    \n无论我们讨论的是数据加密还是完整性，如果你带来了一种新协议（进行加密或执行上述任一程序），我们就可以将其集成到 IPSec 中，用于保护我们的应用程序（或\
    \ VPN 隧道）。\n\n现在，我将向你提供一些包含在 IPSec 中的协议示例，这些协议可以帮助加密来自 VPN 的数据：\n\n- 在加密情况下，我们有以下协议：\n\
    \  - DES, 3DES\n  - AES, BlowFish, RC4\n- 在数据完整性情况下，协议有：\n  - MD5, SHA1\n  - SHA2,\
    \ SHA3\n- 在身份验证情况下，我们有 2 种主要方法\n  - 用户和密码\n  - 数字证书\n\n第 4 个元素（防重放）是指接收者（来自 IPSec\
    \ 连接）可以检测出第一阶段发送的数据字段。这种防御机制确保消息源端不会为了恶意目的检索数据，从而在某种程度上否认这些数据在最初被发送过。此外，IPSec\
    \ 基于两个封装标准 IP 数据包的大型头部：\n\n- AH - 身份验证头部（仅建立完整性并验证流量，**不加密**它）\n- ESP - 封装安全载荷\
    \ - 确保下面提到的所有四个要素\n\n在下图 10.11 中，你可以看到 AH 头部部部，其主要作用是验证数据包。它包含了每个数据包验证所需的数据，即对其完整性的保证。\n\
    \n| IP 头部 | AH 头部 | TCP 头部 | TCP 负载 / 数据 |\n| :--- | :--- | :--- | :--- |\n\n\
    图 10.11\n\n在图 10.12 中，你可以看到 ESP 头部如何封装整个包并对其进行加密（从第 3 层到第 7 层的所有数据）。\n\n| IP 头部\
    \ | ESP | 封装的 IP 包或 TCP 头部 + 负载 |\n| :--- | :--- | :--- |\n\n图 10.12\n\n因此，通过加密整个头部，IPSec（在此\
    \ ESP 案例）添加一个新的 IP 字段（即将当前 IP 地址更改为伪 IP），以隐藏源或目的。你可能在想为什么会发生这种情况？因为这两个（源和目的）将是匿的。\n\
    \n当我们（通过手机或笔记本电脑）连接到 VPN 时，连接将是 SSL VPN。如果我们想在两个网络之间建立连接，我们将在这两个路由器之间形成 IPSec\
    \ VPN 隧道，这样两个网络中的所有设备都能够相互通信（通过互联网 - 类似于图 10.13 中的拓扑结构）。\n\n![](img/85e17094b9b0b18870d12b91b22fb038_167_0.png)\n\
    \n现在我希望你对我们所谓的 VPN 有了更详细的理解。它有几种类型：\n\n- 站点到站点（Site-to-Site），用于防火墙或路由器的网络连接\n\
    - 分别对应的远程访问（Remote-Access），用于出于安全/匿名目的的终端设备远程连接，或访问网络/公司的内部资源\n\n关于 IPSec 技术的几点，准确准确说是该框架中每个组件的作用（我已在本章和上一章中进行了更详细讨论）：\n\
    \n- 加密\n- 完整性\n- 身份验证\n- 防重放\n\n# 喜欢这本书吗？请在 Amazon.com 上留下评价\n\n如果你从书中获得了益处，那么我想请你帮个忙。你是否愿意在\
    \ Amazon 上给这本书留个评价？\n\n[点击此处在 Amazon.com 上留下评价 (https://amzn.to/2I6n4v3)]\n\n\
    ![](img/85e17094b9b0b18870d12b91b22fb038_169_0.png)\n\n感谢你阅读这本书并读到最后（相信我，没多少人能一直读到这里）。\n\
    \n此外，我想通过这本书触及尽可能的人（我的目标是在未来 3 年内触及 10,000 人）。这是一个很多人，没有你和你的评价，我将无法实现这一目标。\n\n\
    不仅如此，你还将获得一些好报，这些好报迟会体现在你的生活中。\n\n谢谢！Ramon Nastase (https://ramonnastase.com/).\n\
    \n"
