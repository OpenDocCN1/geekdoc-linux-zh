    In this chapter, we start talking about **malware types**, and later on we we
    will discuss **Cyber Attacks**. For starters, we will discuss Viruses, Trojans,
    Worms, Ransomware and other types of programs that were badly designed. But first
    of all, let us answer the following question:'
