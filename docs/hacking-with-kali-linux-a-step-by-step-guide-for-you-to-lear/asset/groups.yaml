    # VII. Web 安全


    在本章中，我们将简要讨论 Web 安全以及你需要记住的一些攻击。我完全确定你可能已经在电视、广播或其他渠道多次听过某公司的 X 网站被攻破、某机构的 Y 网站宕机，以及黑客用伪页面替换主站。


    嗯，我想告诉你，大多数情况下（经验较浅的黑客），他们都在寻找其网站为人知的 1 到 2 个可以利用的漏洞。有很多工具可以帮助他们相对容易地定位这些漏洞，然后帮助他们进行利用。


    这些漏洞（Web 级别）中的在开放 Web 应用安全项目（OWASP）中有非常好的介绍和记录。OWASP 是一个致力于提高软件和 Web 应用程序安全的非营利组织。


    他们列出了过去几年网站和 Web 应用程序中最常见的安全事件的“前 10”。OWASP 还会组织本地活动（你可以在 Google 或 Facebook 上搜索此类活动），创建一个由充满热情的网络安全人士组成的社区。


    如果你在某处听到此类活动并有机会参加，我建议你迈这一步，因为你会发现这不仅是值得的，而且你可以从许多人那里学到很多。


    例如，在图 7.1 中，列出了 2017 年最常见的 Web 安全事件列表（对比 2013 年）：


