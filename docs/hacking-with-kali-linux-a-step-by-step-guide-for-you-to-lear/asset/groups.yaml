    it connects 2 locations (sites - NOT web, but networks) differently as if they
    were directly connected. Even more, a VPN makes you anonymous (change the IP address
    with some "false") and secure the connection of all devices that send traffic
    from the R1 network to the R2 network and vice versa. This type of VPN uses a
    technology called IPSec (Internet Protocol Security) for encryption, integrity,
    and authentication that we''ll talk about later.


    In the example below (Figure 10.2) you can see how a site-to-site VPN topology
    looks logically. This topology takes place between 3 locations (anywhere in the
    world). You can see how Router R1 (and the network behind 192.168.19.0/24) connects
    to R2 and R3 respectively. This R1 and his network will have access to the internal
    resources of R2, R3.


    If this is a company, then these resources can be: Active Directory Server, DNS
    Server, Mail Server, Skype for Business etc.'
