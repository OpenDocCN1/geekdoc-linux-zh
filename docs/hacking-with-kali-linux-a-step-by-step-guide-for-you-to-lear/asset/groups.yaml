    如图 8.4 所示，从交换网络发送的流量将从防火墙接口进入（IN），并从连接到服务器的接口退出（OUT）。当服务器响应连接它的设备时，情况恰恰相反。现在让我们恢复图
    8.3 中的图像。


    ![](img/85e17094b9b0b18870d12b91b22fb038_108_0.png)


    场景 # 1：假设我们想阻止来自网络 A 的 PC (10.0.0.8) 向服务器发送任何流量。在这种情况下，我们需要一条在源 IP 之后进行过滤的规则（标准
    ACL）。规则如下所示：


    ```

    #deny host 10.0.0.8

    #permit any

    ```


    我该如何检查设置呢？首先，我们将从 PC1 向服务器 (192.168.10.0) 生成 ICMP (ping) 流量（从下面的图中可以看到，它无法工作。）。这里是
    R2 拦截流量的证明。命令 `#show ip access-list` 的结果显示，针对 PC 的拒绝规则有 8 次匹配（图 8.5）！


    ![](img/85e17094b9b0b18870d12b91b22fb038_109_0.png)


    图 8.5


    场景 # 2：假设我们想阻止 PC 到互联网的任何类型的 Web 流量（HTTP-80 和 HTTPS-4443）。在这种情况下，我们需要一条更具体的规则（扩展
    ACL）。规则如下所示：


    ```

    #deny tcp host 10.0.0.8 any eq 80

    #deny tcp host 10.0.0.8 any eq 443

    #permit ip any any

    ```


    因此，前 2 条规则将阻止 PC 到任何（任何目的地）的 Web 流量（端口 80 和 443），而最后一条规则将允许从任何源到任何目的地的其他任何流量。此规则将尽可能设置靠近源（在连接
    PC 的 R1 接口上）的 IN 方向上。我们现在将生成 Web 流量（从 PC 控制台到服务器-192.168.10.10）：


    与上面一样，在图 8.6 中看到 Web 流量在列表的第一行被拦截（6 次匹配）：


    ```

    R#

    *Feb 14 14:59:32.955: %SYS-5-CONFIG_I: Configured from console by console

    R#show ip acce

    R#show ip access-lists

    Standard IP access list ACL STD

    10 deny 10.0.0.8

    20 permit any

    Extended IP access list DENY WEB

    10 deny tcp host 10.0.0.8 any eq www

    20 deny tcp host 10.0.0.8 any eq 443

    30 permit ip any any

    R#show ip access-lists

    Standard IP access list ACL STD

    10 deny 10.0.0.8

    20 permit any

    Extended IP access list DENY WEB

    10 deny tcp host 10.0.0.8 any eq www (6 matches)

    20 deny tcp host 10.0.0.8 any eq 443

    30 permit ip any any (9 matches)

    R#[]

    ```


    图 8.6


    其他示例（标准 ACL）：


    ```

    #deny 192.168.99.0/24

    -- 拒绝整个 /24 范围


    #permit 85.1.245.5

    -- 仅允许此 IP 地址


    #deny 172.16.0.0/17

    -- 拒绝整个网络

    ```


    其他示例（扩展 ACL）：


    ```

    #permit ip 172.30.0.0/24 any

    -- 允许从源 172.30.0 / 24 到任何目的地的流量

    ```


    ```

    #permit tcp host 10.45.21.5 eq 22 any

    -- 允许来自 10.45.21.5 的任何 SSH 回程流量

    ```


    ```

    #deny udp 172.16.0.0/24 85.98.2.0/23 eq 53

    -- 阻止从网络 172.16.0.0/24 到 85.98.2.0/23 的 DNS 流量 (UDP 端口 53)

    ```


    ## 市面上提供的防火墙选项


    谈到市面上不同类型的防火墙时，我们有很多选择（这取决于我们的能力和预算）。主要分为两大类：


    -   **特定厂商** - Cisco ASA, Palo Alto, Checkpoint, Fortinet 等。

    -   **开源** - pfSense, OPNSense, IP Fire 等。


    这些大多数防火墙的工作方式相似（基本概念是相同的），但每个厂商/开发者都带有不同的元素，使其具有独特性（用于恶意软件的人工智能、反病毒软件、反垃圾邮件集成、URL
    级过滤等）。目前，市场倾向于进一步选择 Palo Alto，因为其防火墙的技术领先，而网络领域的知名厂商（Cisco）在其防火墙 ASA（自适应安全设备）方面仍然落后。


    如果你想要一种廉价（甚至是免费）、实施良好且快速的方案，变体可能是我们将讨论的这些**开源**防火墙之一。在本节中，我们将讨论很多开源解决方案，并选择 **OPNSense**
    作为主要示例（图 8.7），因为它具有最用户友好的界面。


    ![](img/85e17094b9b0b18870d12b91b22fb038_112_0.png)


