    ## 2) XSS (Cross-Site Scripting)


    When it comes to SQL injection, as you have seen, the attacker goes directly to
    the site and tries to gain access to his database so that he can retrieve confidential
    data (usernames and passwords, bank information, mail addresses, etc.). In the
    XSS case, things happen differently. The attacker''s focus is directed at the
    user (the one who accesses the site), when he uses a script to attack him.


    XSS supposes the injection of malware (malicious script this time) into the site
    (without affecting it in any way), and when accessing the site by the user, this
    code will be executed directly in the browser. The code is written in JavaScript,
    which language is executed by the browser.


    The easiest way to do this is by injecting the malicious code into a comment or
    script that can be run automatically.

    For example, the hacker can incorporate a link to a malicious JavaScript script
    intentionally in a comment on a blog.


    XSS attacks (Cross-site scripting) can significantly damage the site''s reputation
    by placing users at risk without leaving any traces of how bad it was. Now, being
    in this situation, any sensitive information a user sends to the site (such as
    personal data, bank information, or other private data) - can be misplaced through
    scripts without the site owner''s knowledge that there is a problem.


    Some of the attacks that may occur following an XSS attack:


    - **Stealing cookies** - duplication of a cookie may result in duplication of
    the session from the valid site to a fake site of the attacker that can steal
    user data

    - **Keylogger** - sending all letters typed by the user to the attacker

    - **Phishing** - manipulating the user to take action that is unconscious, and
    then viewing his or her data


    So after an attacker tries an XSS attack (usually on any site that has a comment,
    search or data input section, etc.), the victim''s data (e.g., current web session,
    cookies) can be stolen and used by the hacker to access different pages / resources.
    Thus, the attacker does not need the victim''s password because it already has
    cookies. Using XSS, he managed to make another type of attack known as **Session
    Hijacking.**


    NOTES: [Here''s a great site](https://www.hacksplaining.com/) that you can learn
    more about web attacks. The site was designed to educate web developers to be
    aware of existing vulnerabilities and to show them how to solve them.


