    # 1) Brute Force


    Brute Force is a form of cyber attack that aims to gain unauthorized access to
    the system (a site administration server, server, network equipment, etc.). This
    technique uses "brute force," meaning the attacker tries to guess the password
    with a minimum of logic. Often, this technique leads to failure and waiver by
    the attacker, but there are many cases where access to the system is prevented
    because it has not changed its default password (which is often "admin" or "12345678").


    # 2) Dictionary attack


    A Dictionary Attack is a little bit more targeted on the victim''s system because
    there are several external factors that relate to that organization / person.
    With the help of some tools, hundreds or thousands of words can be generated that
    can be tried to get access to the system. The disadvantage of this type of attack
    is that it can take a long time (depending on the number of words and the security
    of the system), and the dictionary does not guarantee the success of the attack.


    An way to combat these types of attacks is to use a maximum number (usually 3)
    of login attempts in the system.


    # 3) Rainbow table


    The third type of attack is called "Rainbow Table" which aims to "decipher" a
    hash. Do you still know what a hash is? If not, I''ll briefly summarize.


    Thus the attacker will use a hash list to decipher the hash-passwords from the
    stolen database. This list is called "rainbow table" and tries to find out which
    is the password.


    And now you may be wondering, "Why are things so?" The answer is simple: because
    the hash process is irreversible, that is, once the hash has been generated, we
    cannot enter it using the same mathematical formula and get the password.


    So the attacker tries his luck with his list of hashes (rainbow tables) that are
    associated with passwords. In the next chapter, we''ll move on to the first step
    toward generating a cyber attack, and we''ll talk about Scanning. Also, towards
    the end of the chapter I will show you how to do a DoS attack using (Kali) Linux.


    # VI. Scanning the Servers and the Network


    I''m sure you''ve heard of the concept of scanning a network (or the devices within
    the network). Well, in this chapter we''ll talk in more detail about this subject
    and later on we''ll see how to **scan networks and servers** (from just a few
    commands on Kali Linux or a few clicks on Windows).


    # What does “Scanning a Network” mean ?


    Before we go over to see how I can scan a network, I want to explain what this
    scanning means. What do I mean by the end when I say I scanned the X.Y.Z.A network?
    I refer to the fact that I used a certain program (in this case Nmap) to find
    out which devices are connected to the network at the moment.


    Not only did we find out what these devices are (see their IP address and MAC
    address) but we can find out more information like:


    - The type of the device

    - The OS and its version

    - Open ports

    - Network applications that run on those ports

    - etc.


    Once we have this information, we can use them to better understand how the network
    is structured, to scan and then test the network and vulnerability servers (in
    an ethical way) to make sure all devices are up & running. These, of course, are
    just a few reasons why scanning the network and the devices in it makes sense.


    # How do I scan a network?


    Scanning the network (and its components) is easy, using Nmap. Nmap comes from
    Network Mapper and helps us "map" the network into an output (from the terminal)
    quite easy to understand. The program I use in the example below (for scanning
    the network) is called Nmap. Nmap (on Windows, the graphical interface program
    is called Zenmap) is a free tool extremely used by hackers and ethical hackers.


    With its help we can discover the devices connected to the network, the open ports
    on them and even their Operating System.


    Here are some examples of commands that we can give with Nmap to achieve different
    goals:


    # 1) Scanning a network with Nmap


    ```

    # nmap -sP 192.168.1.0/24 -- ICMP (ping) scanning, displaying the number of network
    devices (aka PING SCAN)

    ```


    ```

    # nmap -sS 192.168.1.0/24 -- scanning the entire network to find open ports (TCP,
    using SYN) on each device (aka PORT SCAN)

    ```


    In Figure 6.1 below, you can see in detail the information about part of the equipment
    connected to the network (more precisely the Router with IP 192.168.1.1 and another
    device with the IP 192.168.1.3). Besides discovering that these devices are connected
    to the network, Nmap has also discovered open ports on these devices.


    ![](img/85e17094b9b0b18870d12b91b22fb038_71_0.png)


    Figure 6.1


    As you can see, Router (192.168.1.1) has opened 3 important services that can
    be vulnerable and exploited. For example, port 23 represents Telnet, which means
    we can connect remotely to it, and we can even have access to the CLI.


    Also, ports 80 and 443 that identify Web traffic is open (so we can connect through
    the browser and we can try to get access to this Router). Now we hope you understand
    the role and power of scanning;)


    # Scanning devices in a network with Nmap (server, laptop, smartphone etc.)


    ```

    # nmap -A 192.168.1.1 -- scans a single device for service delivery (ports) and
    operating system (aka OS SCAN)

    ```


    ```

    # nmap -sT 192.168.1.254 -- scans by using TCP packets

    ```


    # # nmap -sU 192.168.1.1 -- scans using UDP packets


    In Figure 6.2, you can see the result of the first command we also added and -sS
    for TCP port scanning:


    ![](img/85e17094b9b0b18870d12b91b22fb038_72_0.png)


    Figure 6.2


    # # nmap -F 192.168.1.0/24 -- scans every device in the network for the top 100
    most used ports


    # # nmap -sS -p 80,443,23,22 192.168.1.1 -- scans the device for the ports given
    with -p using SYN packets


    # # nmap -F -oN rezultat scanare.txt 192.168.1.0/24 -- scans the network quickly
    and stores the result in the results.txt file (very useful for a Python script)


