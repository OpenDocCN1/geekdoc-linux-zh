    # I. Let’s talk about Hackers


    I suggest that why do in the first chapter of this book, we start talking about
    a very interesting subject from the Cyber Security world: Hackers. I''m sure you''ve
    heard about Hackers, very often online and in the news. Lately, more and more
    often. This means that the number of Hackers (or Cyber Criminals) is increasing
    and so are the opportunities in the Security market.


    Before discussing in more detail about Hackers, I want to tell you that you''ll
    see me use these terms interchangeably: **Cyber Security, Computer Security, Information
    Security or InfoSec.** These are the same thing: **establishing and maintaining
    the security level** of an IT infrastructure (computer network, server, laptop,
    etc.).


    Okay, but why we need Security? Because it assures the good functioning of an
    information system for both companies and people (like you and me). In the case
    of a security incident aimed at extracting **data (information)** from a database,
    the attackers can steal the data and use it in one of the following scenarios
    (but not limited to them):


    +   1) They can **sell** it on the black market (*Deep Web*)

    2) They can use them for **personal purposes** to attack those people in order
    to extract their bank information

    3) Other personal reasons - ego, others appreciation, personal satisfaction ...
    yes, there are many Hackers who are doing for it these reasons


    Okay, now that we''ve been talking badly about Hackers let''s see if all the Hackers
    are bad. Now you may be wondering: "Wait, Ramon, what do you mean by "if...".
    Isn''t a hacker by definition bad?


    Well, I can tell you that... no, it isn’t. The term Hacker (first being mentioned
    in the ''80s) defined a person who was in love with technology and especially
    who loved computer programming (aka. writing code). The'
  - '[PAGE 13]


    term (at that time) used for people who programmed viruses, breaking websites
    or doing any other illegal stuff was **Cracker**.


    In today’s world you don’t hear it anymore. The term, Cracker (today), is associated
    with an individual who is trying to crack/find passwords (e.g. Wi-Fi, database
    passwords, etc.).

    Before we move on, I want to remind you that the general term used (generally
    by the media) is **Hacker** and the process he’s doing is known as "**Hacking".


    **Hacking** is the process an attacker follows in order to gain **unauthorized
    access** to a system (e.g. server, network, laptop, etc.).


    These are the terms to have in mind from now on. I hope you''ve made a clearer
    picture of the Cyber Security world and I suggest we dive even deeper into this
    topic. Let’s talk more about Hackers.'
