    changing the root user password and most importantly accessing the shell - aka.
    the command from FreeBSD). So we will enter 8 and get access to the command line.
    As a Unix-based OS, the command is similar to the Linux command (commands like
    cd, ls, mv, find, grep, ps - also appear here - figure 8.13). Of course, there
    are also others that differ, which are distributed-specific.


