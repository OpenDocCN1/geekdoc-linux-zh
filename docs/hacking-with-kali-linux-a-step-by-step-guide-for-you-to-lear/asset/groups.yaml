  - '[PAGE 101]


    # What is a Firewall?


    Just like a Router or Switch, a firewall is a network equipment that aims to secure
    (protect) the network of potential attackers (hackers) from the Internet.


    By network security I specifically refer to packet filtering (source / destination
    IP address, ports, URL filtering, etc.) in order not to allow unauthorized access
    to the network.


    By default, a firewall block all external traffic that wants to get to the internal
    network (LAN), and it is up to the administrator to configure the network access
    policies required by the company. How does that work? You will find out below;


    One thing you want to know: There is no perfect security, and a Firewall is not
    enough to secure the network, but it is an important component that helps secure
    external access (that is, from the Internet to the LAN).


    Besides this network element, there are many other components that need to be
    considered when it comes to security. As you can see in Figure 8.1, the firewall
    connects all the equipment to the Internet (so basically takes Router''s place
    in this situation). In this purpose it is to protect from potential attacks from
    the Internet, which at some point may try to exploit certain vulnerabilities in
    the systems. The firewall works at level 4 (by default), but it can also be configured
    to run at level 7 (from the OSI model).


    What does this mean? It means you can "look deeper" in the package. Maybe even
    see what URL you are trying to access, maybe even scan the program you are trying
    to download to see if there are any viruses.


    This applies to performance and expensive firewalls, called UTM (Unified Threat
    Management).'
