    ```bash

    # hping3 -c 1 -V -p 80 -s 5050 -A --rand-source VICTIM IP

    ```


    Hping3 让你有机会对执行的操作得非常具体。例如，如果我们在服务器端使用类似 TCP 的扫描，那么我们可以使用 TCP 消息（如 SYN, ACK, FIN,
    RST, URG 等）。

    重复我在书开头说的话：**理解这项技术是如何运作的非常重要。** 在这种情况下，我特指 OSI 模型、TCP 协议、端口等。


    但通过发送自定义的封包（例如，一个意料之外的 TCP ACK），我们可以捕获防火墙或应用程序（例如 Web 服务器），它会返回一个响应，我们可以通过该响应找到关于它的更多信息（Windows
    上的响应方式与 Linux 上的不同等 —— 远程操作系统指纹识别的示例）。接下来，我建议你玩玩这些 Nmap 和 hping3 程序，做更多研究，这样你就能理解它们的用途和工作原理。


    通过 hping3，我们还可以进行 DoS 攻击（我们在第 5 章中讨论过），即泛洪某个特定设备：


    ```bash

    # hping3 -V -c 20000000 -d 100 -S -w 64 -p 443 -s 591 --flood --rand-source VICTIM
    IP

    ```


    该命令的参数如下：


    - - flood: 以尽可能快的速度发送包

    - - rand-source: 为每个包生成随机源 IP 地址

    - -V: 提供更多信息

    - -count: 数据包总数

    - -d data: 数据包的大小

    - -S --syn: TCP SYN 数据包

    - -w --win: 窗口大小（默认 64）

    - -p --destport: 目标端口

    - -s --baseport: 源端口（默认是随机）


    PS：如果你使用的是 Linux（而不是 Kali Linux），可以使用以下命令安装 Nmap 或 hping3：


    ```bash

    # sudo apt-get install nmap hping3

    ```


    # 为什么我们要扫描网络？


    因为我们可以利用这些信息来决定渗透测试的关注重点。我们关注什么？网络中最脆弱的目标是什么？上面运行着哪些利用的应用程序？对于黑客来说（无论是白帽还是黑帽），这些问题的答案至关重要。


    为什么？因为如果他对网络及其内部组件不了解，黑客会在某些无法被利用的部分浪费时间，并面临被检测的风险。


    这个扫描过程是渗透测试周期的一部分，由 5 个步骤组成（图 6.5）。


    ![](img/85e17094b9b0b18870d12b91b22fb038_79_0.png)


