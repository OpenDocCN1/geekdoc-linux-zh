    3. Configure the DHCP server

    a. # nano /etc/dhcp/dhcpcd.conf

    4. Add a (default) static route to your Router

    a. # sudo ip route add default via 192.168.1.1

    5. Start SSL Strip

    6. Capture the traffic'
