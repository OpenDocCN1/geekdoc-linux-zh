    # IV. C.I.A.


    # Introduction to Cyber Security concepts


    In this chapter, we will discuss the three elements that make up the notion of
    Cyber Security. We will basically cover all the bases.


    Many people talk about Cyber Security, they just think about encrypting data.
    This is not necessarily correct, because cyber security implies more than that
    (there are three key elements, known as the CIA). This CIA is a triad composed
    of 3 key elements:


    - Confidentiality

    - Integrity

    - Availability


    Each of these 3 elements ensures in one way or another that our data has not been
    read (Confidentiality), has not been modified (Integity), and is accessible at
    any time (Availability).


    # 1) Confidentiality


    When we talk about data **confidentiality**, we will always refer to their encryption
    in order to make them **indescribable**. This encryption process requires algorithms
    with very complex mathematical formulas to ensure that encrypted data cannot be
    read.


    So if you want to encrypt a file on your phone, laptop, or encrypt an communication
    between 2 networks, things can be done in 2 ways (depending on the situation):


    1. Symmetric - using a single key (PSK aka password)

    2. **Asymmetric** - using a pair of keys (one public and the other)


    # a) Symmetric Encryption


    Symmetric encryption is the **most widely used forms** of Internet encryption,
    while being fast and secure.


    The reason it is so widespread is that it requires a single key (called PSK -
    Pre-Shared Key) that will be used both for encryption and for decryption. Think
    of this key as the entrance to your home (you can unlock the door, but you can
    lock it to).


    And, now, here is a common case where you use such a PSK to encrypt data (or traffic).
    This is your wireless connection. Yes, when you first connect to a wireless network
    (WLAN), it will ask for a password (which is the PSK).


    That **key** (password) is used for both **authentication** and **encryption**
    of messages.


    Now that you understand the symmetric encryption, I propose to move on and see
    some algorithms that make it possible to secure data using a single key:


    - DES

    - 3DES

    - AES

    - Blowfish

    - RC4


    # b) Asymmetric Encryption


    When it comes to asymmetric encryption, things are a little different. The complexity
    of this encryption is much more than the symmetric (1024, 2048 or even 4096 bits
    vs 128, 192, 256), but the consumption of hardware resources is much higher. Besides,
    asymmetric encryption uses a pair of keys - one public and one private.


    The private key is meant to be ... private, and the public key can be distributed
    to anyone. Asymmetric encryption is done as follows:


    Anything encrypted with the PUBLIC key can only decrypt the PRIVATE key (so we
    get data confidentiality).


    Anything encrypted with the PRIVATE key can only decrypt the PUBLIC key (so we
    get a digital signature to authenticate).

