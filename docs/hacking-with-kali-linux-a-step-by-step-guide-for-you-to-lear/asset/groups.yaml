    # What is a DoS (Denial of Service) attack?


    DoS is a form of cyber attack with the purpose of **interrupting** (for an amount
    of time) the operation of a particular service on a server, with only **one source
    of traffic** (the attack is done on a single computer). The DoS takes place by
    **sending** an **impressive** amount of **traffic** to a targeted service in order
    to interrupt it. Thus, receiving a lot of requests, a web server for example,
    would not handle and block at the moment => interruption of the service (in this
    case dropping the website). Here''s an example of attack in Figure 5.5:


