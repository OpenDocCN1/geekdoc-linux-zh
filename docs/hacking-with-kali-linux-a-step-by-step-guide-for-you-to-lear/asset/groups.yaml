    # What is a DDoS (Distributed Denial of Service) attack?


    DDoS is a form of cyber attack to interrupt (for a period of time) the operation
    of a particular service on a server or on an entire network, with many Internet
    traffic sources. DDoS takes place via multiple "infected" computers with malware
    that send an impressive number of Gbps (10.40, 100+ Gbps - greatly depends on
    the number of computers) in traffic. These computers are all over over the world
    and do not have a specific location, which is one of the reasons why DDoS is very
    hard to fight.


    Even recently (in February 2018), the biggest DDoS attack in history, cataloging
    1.5 Tbps (or 1500 Gbps), has taken place. Wow!


    Coming back, I want you to know that such a network of malware-infected computers
    are called Botnet. Below is an example of a Botnet that can serve multiple malicious
    purposes (sending spam or malware or a significant Gbps number for Dos) - Figure
    5.6:'
