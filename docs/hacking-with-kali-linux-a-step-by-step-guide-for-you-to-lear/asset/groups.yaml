    ![](img/85e17094b9b0b18870d12b91b22fb038_113_0.png)


    图 8.8


    正如上面所示，pfSense 的优势在于它有一个图形界面，命令行同样可以工作。在下面的图中，我们可以看到防火墙的配置（必须在虚拟机中配置好两个接口）。LAN（局域网）使用
    这种防火墙以连接互联网。


    ![](img/85e17094b9b0b18870d12b91b22fb038_114_0.png)


    图 8.9


    现在，让我们讨论 OPNSense：OPNSense 是另一种市面上的开源防火墙。由于其防火墙的技术，市场倾向于进一步选择 Palo Alto，而网络领域的知名厂商（Cisco）在其防火墙
    ASA（自适应安全设备）方面仍然落后。如果你想要一种廉价（甚至是免费）、实施良好且快速的方案，变体可能是我们将讨论的这些**开源**防火墙之一。在本节中，我们将讨论很多开源解决方案，并选择
    **OPNSense** 作为主要示例（图 8.7），因为它具有最用户友好的界面。

