    # DDoS


    ![](img/85e17094b9b0b18870d12b91b22fb038_64_0.png)


    图 5.6


    除了这些网络相关的攻击外，还有针对“破解”密码的攻击：


    - 1) 暴力破解 (Brute Force)

    - 2) 字典攻击 (Dictionary Attack)

    - 3) 彩虹表攻击 (Rainbow table)


    # 1) 暴力破解 (Brute Force)


    暴力破解是一种旨在获取系统未经访问（网站管理服务器、服务器、网络设备等）的网络攻击形式。这种技术使用“暴力”，意味着攻击者尝试在逻辑最少化的情况下猜测密码。通常，这种技术会导致攻击者失败并放弃，但在许多情况下，由于系统没有更改默认密码（通常是
    "admin" 或 "12345678"），导致系统访问未被阻止。


    # 2) 字典攻击 (Dictionary attack)


    字典攻击对受害者系统更具针对性，因为有几个与该组织/个人相关的外部因素。在某些工具的帮助下，可以生成数百或数千个单词，并尝试访问系统。这种攻击的缺点是它可能需要很长时间（取决于单词数量和系统的安全性），而且字典并不保证攻击的成功。


    对抗此类攻击的一种方法是在系统中设置最大次数（通常为 3 次）的登录尝试。


    # 3) 彩虹表攻击 (Rainbow table)


    第三种攻击被称为“彩虹表”，旨在“解密”哈希（hash）。你还知道哈希是什么吗？如果不知道，我简要总结一下。


    因此，攻击者将使用哈希列表来破解从被盗数据库中获取的密码哈。这个列表被称为“彩虹表”，并试图找出哪个是密码。


    现在你可能在想，“为什么会这样？”答案很简单：因为哈希过程是不可逆的，也就是说，一旦生成了哈希，我们就无法使用相同的数学公式输入它并获得密码。


    所以攻击者尝试用他与密码关联的哈希列表（彩虹表）碰运气。在下一章中，我们将进入生成网络攻击的第一步，讨论扫描（Scanning）。此外，在章节结束时，我将向你展示如何使用
    (Kali) Linux 进行 DoS 攻击。


    # VI. 扫描服务器和网络


    我确定你听过扫描网络（或网络内的设备）的概念。很好，在本章中，我们将更详细地讨论这个主题，稍后我们将看到如何**扫描网络和服务器**（只需在 Kali Linux
    上执行几条命令或在 Windows 上点击几次）。


    # “扫描网络”意味着什么？


    在介绍我如何扫描网络之前，我想解释一下这种扫描的含义。当我说我扫描了 X.Y.Z.A 网络时，我指的是什么？我指的是使用了一个特定的程序（在这种情况下是 Nmap）来找出目前连接到网络的哪些设备。


    我们不仅发现这些设备是什么（查看它们的 IP 地址和 MAC 地址），还可以发现更多信息，例如：


    - 设备类型

    - 操作系统及其版本

    - 开放的端口

    - 运行在这些端口上的网络应用程序

    - 等


    一旦我们获取了这些信息，就可以利用它们来更好地理解网络结构，扫描并测试网络和漏洞服务器（以道德合规的方式），以确保所有设备均正常运行。当然，这些只是扫描网络及其内部设备有意义的几个原因。


    # 如何扫描网络？


    使用 Nmap 可以轻松地扫描网络（及其组件）。Nmap 源于 Network Mapper（网络映射器），帮助我们把网络“映射”成非常易于理解的输出（来自终端）。我在下面的示例中使用的程序（用于扫描网络）称为
    Nmap。Nmap（在 Windows 上，图形界面程序称为 Zenmap）是一个被黑客和道德黑客频繁使用的免费工具。


    在它的帮助下，我们可以发现连接到网络的设备、它们开放的端口，甚至是它们的操作系统。


    以下是我们可以通过 Nmap 实现不同目标的一些命令示例：


    # 1) 使用 Nmap 扫描网络


    ```

    # nmap -sP 192.168.1.0/24 -- ICMP (ping) 扫描，显示网络设备数量（又称 PING 扫描）

    ```


    ```

    # nmap -sS 192.168.1.0/24 -- 扫描整个网络以找到每个设备上的开放端口（TCP，使用 SYN）（又称 端口扫描）

    ```


    在下方的图 6.1 中，你可以详细查看连接到网络的部分设备的信息（更准确地说，IP 为 192.168.1.1 的路由器和 IP 为 192.168.1.3
    的另一个设备）。除了发现这些设备连接到网络外，Nmap 还发现了这些设备上的开放端口。


    ![](img/85e17094b9b0b18870d12b91b22fb038_71_0.png)


    图 6.1


    如你所示，路由器 (192.168.1.1) 打开了 3 个可能会被漏洞和利用的重要服务。例如，端口 23 代表 Telnet，这意味着我们可以远程连接到它，甚至可以访问
    CLI（命令行界面）。


    此外，标识 Web 流量的 80 和 443 端口也是开启的（因此我们可以通过浏览器连接并尝试访问此路由器）。现在我们希望你理解扫描的作用和威力了;)


    # 使用 Nmap 扫描网络中的设备（服务器、笔记本电脑、智能手机等）


    ```

    # nmap -A 192.168.1.1 -- 扫描单个设备的服务交付（端口）和操作系统（又称 OS 扫描）

    ```


    ```

    # nmap -sT 192.168.1.254 -- 使用 TCP 数据包进行扫描

    ```


    # # nmap -sU 192.168.1.1 -- 使用 UDP 数据包进行扫描


    在图 6.2 中，你可以看到我们额外添加的第一个命令的结果，以及用于 TCP 端口扫描的 -sS 结果：


    ![](img/85e17094b9b0b18870d12b91b22fb038_72_0.png)


    图 6.2


    # # nmap -F 192.168.1.0/24 -- 扫描网络中的每个设备的前 100 个最常用端口


    # # nmap -sS -p 80,443,23,22 192.168.1.1 -- 使用 SYN 数据包扫描设备指定的 -p 端口


    # # nmap -F -oN rezultat scanare.txt 192.168.1.0/24 -- 快速扫描网络并将结果存储在 results.txt
    文件中（对 Python 脚本非常有用）


    # 3) Hping3


