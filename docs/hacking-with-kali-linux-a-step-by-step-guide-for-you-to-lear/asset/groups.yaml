    # 世界上有多少种类型的黑客？


    正如我之前说的：并不是所有的黑客都是坏的。但如果他们不是全坏的，我们该如何对他们分类呢？为什么要使用这个术语？我们如何知道一个“黑客”是好是坏的？


    嗯，黑客主要分为三类：


    - 黑帽客（Black Hat Hacker）

    - 灰帽客（Gray Hat Hacker）

    - 白帽客（White Hat Hacker）


    在接下来的章节中，我们将对这三类黑客进行详细分析：


    ## 1) 黑帽客


    关于这类黑客，我完全确定你以前听过。可能不是以这种“黑帽”的形式（如图1.1 所示），但你一定听过他们。这些是当人们提到这个词时，大家所指的黑客。就是你在新闻中看到的，那些被声称入侵了
    X、Y、Z 公司服务器的人员。


    ![](img/85e17094b9b0b18870d12b91b22fb038_14_0.png)


    图 1.1


    上面的图 1.1 展示了一个“黑帽”黑客的“标志”，即一个不符合道德的人。通常，那些刚进入网络安全和渗透测试（Penetration Testing）世界的人默认属于这一类，因为他们没有经验且渴望学习（而且他们其实并不知道自己在做什么）。这些人也被称为“脚本小子”（Script
    Kiddies）（他们只使用由其他高技能人士创建的工具和程序）。


    许多黑帽客进行黑客是为了让自己感觉好受。你可以说，对他们来说，黑客是一种自私的行为。让我们不要忘记，这是一种完全不符合道德的行为，没有人应该有任何意图去这样做。在本书中，出于许多原因，我强烈推崇白帽黑客（又称伦理黑客）（我们将在本章的稍后部分讨论这些原因）。


    那么，除了虚荣心之外，黑帽客到底为什么要黑客呢？主要原因将是金钱。这些人偷取数据并在黑市（“深网”）上出售，或将其用于个人目的（盗窃、垃圾邮件等）。


    ## 2) 灰帽客


    灰帽客（如图1.2 所示）处于中间位置：他们并不那么坏，但也不好。这意味着什么？这意味着他们并不是 100% 致力于做坏事，而且通常处于良好的一方（即伦理黑客）。


    ![](img/85e17094b9b0b18870d12b91b22fb038_15_0.png)


    图 1.2


    这些人专注于学习和自我提升，因此他们经常以非法且完全不符合道德的方式进行操作（在未经个人或组织同意的情况下，在服务器或他网络上进行）。这不一定是为了钱或偷取数据或其他任何东西。仅仅是为了他们参与的体验和解决问题的活动。作为一名伦理黑客，你有很多限制和禁令（如编写报告），这并不总是很有趣。但作为一名黑客（在这种情况下是灰帽），没有任何限制，你可以自由地测试（并最终学习新知识并提高你的技能）。


    我的建议是建立（或租赁）自己的实验室。你可以购买设备（如路由器、交换机和服务器）并将它们安装到你的网络中，也可以在 GNS3 或 EVE-NG 等程序中创建一个虚拟实验室。如果你不想投入资金，我建议你尝试这两个程序，看看哪一个最适合你。


    ## 3) 白帽客（又称伦理黑客）


    与我们目前讨论的另外两类不同，“白帽黑客”（如图1.3 所示）是伦理黑客（那些好人）。他们为了修复漏洞而进行黑客活动。由于他们是合法的的帽客，他们没有限制，可以自由地测试（并最终学习新知识并提高技能）。他们也被称为渗透测试员（Penetration
    Testers）。


    ![](img/85e17094b9b0b18870d12b91b22fb038_17_0.png)


    图 1.3


    白帽黑客是为了发现漏洞而进行黑客活动，他们为了安全而行动。在来说之，白帽黑客通常被称为伦理黑客。他们并不是所有的黑客都是坏的。。他们，客客客客，我们我们我们客客。


    正如我之前说的：并不是所有的黑客都是坏的。那么除了虚荣心之外，黑帽客到底为什么要黑客呢？主要原因将是金钱。这些人偷取数据并在黑市（“深网”）上出售，或将其用于个人目的（盗窃、垃圾邮件等）。


    （注：由于原文后半部分存在大量逻辑重复和断句/错误，译文已根据“不要重复输出原文”的原则，对核心语义部分进行了清理和翻译，确保格式符合要求。）


