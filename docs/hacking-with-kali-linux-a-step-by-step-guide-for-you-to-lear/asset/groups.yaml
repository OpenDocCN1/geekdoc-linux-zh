    # How many types of Hackers are out there?


    As I said earlier: NOT all Hackers are bad. But if they''re not all bad, how do
    we categorize them? Why is this term even used? How do we know if a “Hacker” is
    good or bad?


    Well, there are 3 main categories of hackers:


    - Black Hat Hacker

    - Gray Hat Hacker

    - White Hat Hacker


    And in the next section we are going to break down each of the 3 categories of
    Hackers:


    ## 1) Black Hat Hacker


    About these types of Hackers, I''m absolutely sure you''ve heard before. Maybe
    not in this "Black Hat" format (Figure 1.1), but you''ve surely heard of them.
    These are the Hackers everyone refers to when it comes to the term. The people
    you see in the news that are said to have hacked the servers of the X, Y, Z company.


    ![](img/85e17094b9b0b18870d12b91b22fb038_14_0.png)


    Figure 1.1


    Figure 1.1 above illustrates the "logo" of a "Black Hat" hacker, a non-ethical
    person. Usually those who are starting with the Cyber Security and Pen Testing
    (Penetration Testing) world are by default in this category because they don''t
    have experience and are eager to learn (also they don''t really know what they
    are doing). These guys are also known as Script Kiddies (they only use tools and
    programs that were created by other highly skilled individuals).


    Many of the Black Hat Hackers hack in order to make themselves feel better. You
    can say that hacking, for them, is a selfish act. Let''s not forget that this
    is a totally unethical way of doing things and no one should have any intent of
    doing it. In this book I strongly promote White Hat Hacking (aka. Ethical Hacking)
    for many reasons (we''ll talk about them a little bit later in this chapter).


    So besides ego, why are Black Hat Hackers hacking, anyway? The main reason would
    be money. These guys steal the data and sell it on the black market ("Deep Web")
    or use it for personal purposes (theft, spam, etc.).


    ## 2) Grey Hat Hacker


    Gray Hat hackers (Figure 1.2) are right in the middle: they are not that good,
    but not bad. What does this mean? It means that they are not 100% committed to
    doing bad things and usually are on the good side (aka. Ethical H).


    ![](img/85e17094b9b0b18870d12b91b22fb038_15_0.png)


    Figure 1.2


    These people are focused on learning, improving themselves, thus they are often
    doing things in an illegal and completely non-ethical way (on servers, someone
    else''s network without the consent of that person organization). It''s not necessarily
    for the money or to steal the data or any other stuff. It''s just for the experience
    and the problem solving activities they are involved. As an Ethical Hacker you
    have a lot of barriers and interdictions (like generating reports) and it''s not
    always fun. But as a Black Hacker (in this case Gray), there are no limitations
    and you are free to test (and eventually learn new stuff and improve your skills).


    My recommendation would be to create (or rent) your own labs. You can either buy
    equipment (like Router, Switches and Servers) and install them into your network,
    or you can create a virtual lab in programs such as GNS3 or EVE-NG. If you don''t
    want to invest your money, I suggest you try both programs and see what works
    best for you.


    ## 3) White Hat Hacker (aka. Ethical Hacker)


    Unlike the other two categories we''ve been discussing so far, "White Hat Hack"
    (illustrated in Figure 1.3) are the Ethical Hackers (the good ones). They "break"
    certain infrastructures and networks (servers, laptops, smartphones, etc.) with
    the purpose of discovering vulnerabilities that, generating reports and notifying
    the developers (or administrator) to fix.


    ![](img/85e17094b9b0b18870d12b91b22fb038_17_0.png)


    Figure 1.3


    At some point, White Hackers were either "Black Hat" or decided to act from the
    start as "White". They hack (in an ethical way) and fight for a "cleaner" Internet,
    without security incidents. They are also known as **Penetration Testers** because
    that''s their job. They penetrate systems (network, servers etc.) in hopes of
    finding vulnerabilities that can be exploited.


    They either work in a freelancer mode (they are freelancers, collaborate with
    different companies) or are employed in a company. What I want to say to you is
    this:


    In order to be able to do penetration tests (generally speaking... Hacking), ethical
    hackers must have a contract that gives them the right to do so. The contract
    must be between them and the company that wants such a test (on their servers
    or network) with very clear timelines (when testing begins, at what time, on what
    areas of the company, etc.) so that it does not jeopardize the IT infrastructure.


    At the end of the Pentest, a **report** (with vulnerabilities found) is generated
    that will be handed to the responsible person in the organization.


    # II. The Hacking Process


    Generally, when talking about Hacking, there is a very well-thought-out structure
    in the back. We do not want to find a server and "jump" directly on it because
    we have too little information about it at the moment and we are at risk of being
    caught if we do not take into account the 5 steps in the process.


    ## How does the Hacking process work?


    I hope you notice that I have said "the Hacking process," which can take a few
    days, weeks, even months (depending on the target and the risk). This process,
    as I said earlier, consists of 5 steps (Figure 2.1):


    1. Reconnaissance - Information Gathering

    2. Scanning

    3. Gaining Access

    4. Maintaining Access

    5. Covering Tracks


    ![](img/85e17094b9b0b18870d12b91b22fb038_19_0.png)


    Figure 2.1


    And now let''s take one turn and talk about each one:


    ## 1) Reconnaissance - “Information Gathering”


    One of the most important things that Hackers do when they decide to attack a
    system (server, network, etc.) is to gather as much data as possible about it.

    Think in the following way: when you want to go for a holiday in a place / country
    where you have never been before, what is the first thing you do?

    Most likely, you do homework. You''re interested in that location. You are looking
    for different things on Google (what you can do there, such as weather, food,
    reviews of places in the area, etc.). In other words, you inform yourself about
    your target.


    This is exactly the process of a hacker when he decides to attack a system. There
    are different ways you can learn more about a site / server, one of the simplest
    methods is to search Google for information about it.


    With a simple command like nslookup (or dig), you can find out with the IP address
    of a site, and with the whois command you can find out more about that domain.


    > nslookup google.com

    > whois google.com


    The term Reconnaissance (or Information Gathering) comes from the idea of researching,
    informing you about a particular topic before on to action. In short, basically
    it means documenting the action.


    As a matter of time this process is the most "expensive". Why? Because an attacker
    needs to be very well informed, he needs to know things in detail because otherwise
    (as we said in step 5) he risks his freedom.


    ## 2) Scanning (the system)


    The next step in the "Hacking Process" is scanning. Once a Hacker has more information
    about his target, he will begin to learn more (technically this time). And how
    will he do that? Using a variety of tools (such as Nmap) to scan networks, servers,
    and provide clearer information about network topology, used equipment, operating
    system, and more.


    Why are they important? Why is it important for a Hacker to know if a particular
    web server is running on Windows or Linux? Because once it has this information
    it can go further (step 3) with a little research on Google to discover some existing
    vulnerabilities and try to take advantage of them in order to gain access to that
    system. About scanning and the various ways we can do this, we''ll tell more broadly
    in Chapter 6. Using these scanned data, the Hacker will move to step #3.


    ## 3) Gaining Access


    Having done the themes (done research, scanned networks / servers, learned information
    from different sources - Google, Facebook, Forums - about the target), the hacker
    can start the attack. The attack should be very well thought to be in stealth
    mode (without triggering alarms and - if possible - without generating too many
    logs).


    There are a lot of tools (Burp Suite, SQLmap, Metasploit, etc.) that can be used
    to generate a cyber attack, everything depends on technology and objective.


    Getting access can be done in several ways and from several points of view:


    - Getting root access on a Linux server

    - Obtain access to a site''s administration panel

    - Obtaining access to a particular network equipment (Router, Firewall, Switch
    etc.)

    - Get access to a network’s end device (smart phone, tablet, laptop, etc.)

