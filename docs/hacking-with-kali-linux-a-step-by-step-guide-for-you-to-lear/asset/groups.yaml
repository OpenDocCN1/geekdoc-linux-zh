    - Asymmetric - using a pair of keys (one public and the other)


    ### a) Symmetric Encryption


    Symmetric encryption is the most widely used form of encryption because it''s
    fast and secure. It requires a single key (called PSK - Pre-Shared Key) that will
    be used both encryption and decryption.


    Think of this key as the entrance to your home (with it you can unlock the door,
    but you can lock it too). And now, here is a common case where you use such a
    PSK to encrypt data when you connect to a wireless network (WLAN), it will ask
    for a password (which is the PSK).


    That key (password) is used for both network authentication and encryption of
    messages. Now that you understand symmetric encryption, I propose to move on and
    see some algorithms that make it possible:


    - DES

    - 3DES

    - AES

    - Blowfish

    - RC4


    ### 1) Data Confidentiality


    When we talk about data confidentiality, we will always refer to encryption making
    them unreadable. This is because of the increased interest in recent years.


    **DES and 3DES (Data Encryption Standard)** are two encryption algorithms developed
    in the United States in the early 1970s and have a 56-bit complexity for DES and
    168-bits for 3DES. 3DES is not 3 times safer (or does not SECURE 3 times better)
    than DES, but simply on the same data, apply the DES algorithm three times.


    In 1999, there was an experiment where decryption ("breaking", "cracking") of
    an DES-encrypted message was desired, and this was done less than 24 hours!


    **AES (Advanced Encryption Standard)** is the most popular (and used) symmetric
    encryption algorithm. It uses a single key for data encryption and the same key
    for decryption.


