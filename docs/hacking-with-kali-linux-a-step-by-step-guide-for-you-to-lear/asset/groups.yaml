    ## 2) 完整性


    所以，基本上，数据完整性意味着什么？

    数据完整性确保文件可以从 A 点传输到 B 点，而不改变（或修改）其内容。它是通过一个称为哈希（hashing）的过程获得的。


    假设我们有一个 PDF 文件，想要通过互联网传输确保其完整性。为了做到这一点，我们需要该 PDF 文件的 HASH。


    对文件进行哈希有助于确定其完整性。当我们想要通过互联网发送文件时，过程中可能会发生变化（数据包丢失、信息篡改、黑客更改内容）。


    以下是一些用于确定数据完整性的算法：


    - MD5 - 128 位

    - SHA1 - 160 位

    - SHA2 - 256 位

    - SHA3 - 384 位（当前标准）

    - SHA5 - 512 位


    ## 3) 可用性


    如果我们的数据无法被访问，对其进行加密和哈希还有什么价值呢？如果服务器、网络（或流：D）宕机了，我们该如何使用数据呢？


    答案很简单：我们无法使用它们。那么，一种目标是中断数据可用性的攻击是否可以被视为对公司/组织网络安全的威胁？当然可以。为了对抗此类数据安全事件，我们有几种可以实施的方案：


    - 冗余 - 网络、服务器、UPS 等

    - 备份


    这两个元素是数据可用性的基础。现在让我们来看第一个元素：


    ### a) 冗余


    有几种类型的冗余，但让我们先看看冗余是什么。


    冗余确保对于任何确保公司运行的关键组件（网络、服务器、电源供应等），我们都至少有一个活跃的替代品。这意味着如果我们有一个连接到互联网的路由器，为了确保冗余（至少），我们需要到
    2 个不同互联网提供商的连接，以及 2 个连接到这些提供商的路由器。


    涉及到服务器级冗余，我们可以考虑两个或多个提供相同服务的服务器（例如 Web、数据库等）。或者我们甚至可以提到存储磁盘（HDD 或 SSD），它们可以被“链接”在一起，使用称为
    RAID（独立磁盘冗余阵列）的技术来提供冗余。


    ### b) 备份


    我们都知道备份有多重要。无论是硬盘（SSD）还是站点级的配置文件、代码等。**周期性备份**经常可以“救我们一命”，因为它是我们在系统中运行过的所有内容的副本。


    例如，在勒索软件攻击的情况下（如果）不想支付黑客要求的金额，我们唯一的选择就是备份（特别是，对现有备份进行恢复，这将使该系统恢复运行）。


    不幸的是，在这种情况下，如果备份*做得不够频繁*（至少每周一次，如果不是每天的话），就会导致最近更改的部分丢失。


    我们到目前为止讨论的是数据安全的基础（包括通过互联网运行的数据和“存储”在硬盘/SSD 上的数据）。


    对上述讨论内容的总结，我想提醒您：


    - 1. **CIA**（机密性 - 加密 - 完整性、可用性）是网络安全的基础

    - 2. 进行**数据加密**有两种方法（对称加密和非对称加密）

    - 3. 数据**完整性**是通过**哈希**建立的（它是任何信息序列的唯一值）

    - 4. 确保数据的**可用性**极其重要。我们可以做到这一点的一些方法是使用备份和冗余元素。


    ## V. 恶意软件与网络攻击


    在本章中，我们开始讨论**恶意软件类型**，之后我们将讨论**网络攻击**。首先，我们将讨论病毒、木马、蠕虫、勒索软件和其他设计糟糕的程序类型。但首先，让我们回答以下问题：


    ## 1) 什么是恶意软件？


    恶意软件（又称恶性软件）是一种旨在窃取、破坏或损坏存储在我们设备上的数据的恶性软件程序。


    许多人使用“病毒”这个通用术语，这并不一定正确，因为可能有许多类型的危险程序。以下是（其中的）一部分：


    - 1) 病毒

    - 2) 木马

    - 3) 蠕虫

    - 4) 勒索软件

    - 5) 间谍软件

    - 6) 意识软件

    - 7) 以及更多（Rootkit、定时炸弹、后门等）


    图 5.1


    下面是维基百科上的图片，显示了 2011 年来自互联网的恶意软件比例。从那时起，很多事情已经发生了，但拥有这样一个包含最常见恶意软件类型的层级结构很有趣。


    ![](img/85e17094b9b0b18870d12b91b22fb038_49_0.png)


    2011 年 3 月 16 日按分类的恶意软件


    图 5.2


    现在选取这些恶意软件并进行更详细的讨论：


    ### 1) 病毒


    病毒是我们都熟悉的程序。无论我们的计算机是否感染了病毒，还是我们听到/看到别人感染了，我们都知道这些病毒对我们来说非常危险（特别是对我们存储在计算机上的数据
    - 对我们来说最重要的元素）。


    病毒编写者利用不同操作系统（尤其是 Windows）中存在的漏洞，并编写软件来利用这些漏洞（以及这些设备的用户）。


    ### 2) 木马


    木马是一种程序，其设计初衷似乎是为了给使用者带来利益，但其背后隐藏着完全不同意图的恶意代码。这类程序在互联网上最常见（如你在上面的图片所示），并用于在缺乏经验的用户面前轻易地掩盖。因此，在程序的（第一次）运行期间，木马会被安装并隐藏起来，“静静地”执行它的工作。“特洛伊”一词源于希腊神话中特洛伊马的故事，在电影《特洛伊》中有体现。


    ### 3) 蠕虫


    蠕虫是一种恶意软件形式，一旦感染设备（PC、笔记本电脑、服务器等），它就会尽力扩展并感染网络上的其他设备。因此，蠕虫能够减慢网络和连接的设备（通过使用 CPU
    和 RAM 资源），甚至整个网络，因为被感染的计算机会产生异常流量。


    ### 4) 勒索软件


    最近一种流行的恶意软件类型是勒索软件，其目的是加密受害者的硬盘（或 SSD），并要求支付现金以获取解密密钥。


    ### 5) 广告软件


    有些程序一旦安装在设备上（或浏览器中），就会开始显示广告（令人厌烦的）。


    ### 6) 间谍软件


    间谍软件是旨在从用户那里提取某些数据的程序。它们的目的不是伤害（通过消耗资源）或以任何方式影响受害者，而是简单地提取数据并将其发送到“母服务器”（那些发起“间谍活动”的人）。


    首先，你需要意识到此类程序的存在，之后你必须针对它们采取保护/预防措施。

    在这种情况下，反病毒软件是非常受欢迎的，因为它们包含了非常大的数据库（称为特征码），可以检查你操作系统（Windows、Linux 或 Mac）上的每个程序/文件。


    现在你也可以知道 Windows 拥有数量最多的恶意软件（病毒、木马、勒索软件等）。为什么？因为 Windows 是世界上最广泛使用的操作系统，黑客有东西可以“偷”。这就是为什么攻击者和网络安全公司的关注重点在
    Windows 上。


    Mac 和 Linux 也并非没有恶意软件，但它们的数量并不大。它们的设计具有更高程度的安全性，运行方式与 Windows 不同。


    ## 2) 网络攻击示例


    在第 5 章的这一节中，我们将讨论网络攻击，并查看来自互联网的网络攻击示例。

    这些攻击方法非常常见，每种方法都有特定的目的。


    以下是互联网上一些常见的攻击：


    - 1) MITM - 中间人

    - 2) DoS - 拒绝服务

    - 3) DDoS - 分布式拒绝服务，查看链接：http://www.digitalattackmap.com/

    - 4) SQLi - SQL 注入

    - 5) XSS - 跨站脚本


    此外，互联网世界中还有很多攻击，但为了说明问题，我们将只关注前三种。所以让我们选取第一种攻击类型 MITM 并对其进行更详细的讨论（并向你展示一些你可以实施此类攻击的方法
    - 但请务必以伦理的方式进行），之后我们将进一步讨论 DoS 和 DDoS。


    毕竟，在第 6 章中，我们将讨论网络安全和其他类型的攻击：SQL 注入和 XSS。


