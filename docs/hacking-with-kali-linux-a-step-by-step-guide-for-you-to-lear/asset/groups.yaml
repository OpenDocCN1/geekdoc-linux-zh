  mdcn: "\n\n一旦黑客获取了前面列出的项目之一的权限，他就渗透了网络，并获取有关他所身处组织的大量信息。\n\n我们将在第 5 章中详细讨论某些类型的网络攻击以及我们如何实施它们。\n\
    \n## 4) 维持访问权限\n\n进入网络后，黑客可以选择保留访问权限。在许多大型公司（如雅虎、谷歌、微软等）的不同服务器被攻破的情况下，黑客总是会留下开启的门以便重新进入系统。\n\
    \n这些门径被称为“后门”，是黑客（或你每天使用的任何应用程序的软件开发者）故意留下的，以便日后访问系统。\n\n这样他们就可以不断地提取数据、跟踪组织内部发生的情况、保持控制权，然后对这些数据进行处理（通常它们会在深网的黑市上售卖）。\n\
    \n在这个过程之后，第 5 步是非常重要的。\n\n## 5) 掩盖踪迹\n\n这是一个非常重要的过程（“踪迹覆盖”功能）。许多黑客（尤其是那些刚入行的人）会忽略这一步。他们只是没有注意到（或意识到）要掩盖自己的踪迹，从而被捕（在美国会被\
    \ FBI、CIA 或 NSA 捕）并因其行为受到法庭处罚。\n\n我重复一遍，未经授权访问系统会导致严重的刑事后果：\n\n- 收缴计算机设备 - 笔记本电脑、外接硬盘等\n\
    - 接受监管\n- 甚至被捕，这些只是部分后果\n\n为了不留下任何可能被发现的此类痕迹，这里有一个关键要素：**理解技术是如何工作的**\n\n我在说什么？我指的是，理解“那个数据库服务器、那个邮件服务器或\
    \ Web 服务器”是如何工作的至关重要——无论是在配置它的方面，还是在监控和日志记录方面。了解如何运行 Windows 或 Linux 操作系统同样重要。“用户是如何创建的？他们数据存储在哪里？登录数据？当你登录此类系统时会发生什么？日志写在哪里？”\n\
    \n黑客攻击（专业的、伦理的和安全的）并不适合每个人，这就是为什么你必须做好充分准备，因为你正在用自己的自由做赌。\n\n我想让你记住的另一个非常重要的点是，没有人，**绝对没有人**会在家里进行“黑客攻击”。尽可能隐藏你的踪迹非常重要。这是为了改变你的位置，使用\
    \ VPN 服务和/或 Tor 进行加密和流量匿名。\n\n## 我们如何在系统中删除踪迹？\n\n现在让我们看看在进入系统（网络、服务器、笔记本电脑等）后可以掩盖脚迹的一些方法。\n\
    \n- 删除不同应用程序（Web、邮件等）的日志\n- 删除用户日志\n- 删除不同监控系统的日志\n\n每个系统都有不同的监控方式用于调试或在出现问题时进行故障排除。\n\
    \n为了这样做，不需要像黑客那样一个接一个文件地寻找并删除最新的日志。但可以使用不同的脚本（在互联网上）让其他人清理他们的踪迹。\n\n在 Windows\
    \ 机器上，你可以使用“事件查看器”（Event Viewer）来为你完成这项工作：\n\n在 Linux 上，你可以使用以下命令：\n\n```bash\n\
    #rm ~/.bash_history - 删除用户命令\n```\n\n```bash\n#vim /var/log/messages - 删除生成的日志\n\
    ```\n\n或者在 /var/log 中的任何其他文件中使用 Meterpreter（用于渗透测试的工具）删除日志。\n\n## 6) 报告（伦理）\n\n\
    另一个非常重要的步骤，特别是在伦理黑客过程中，是报告，即黑客对发现的漏洞生成报告，以及修复系统的其他信息。这些是第 5 步（针对伦理黑客）。在下一章中，我们将开始讨论基础元素。\n\
    \n## III. 安装和使用 Kali\n\n如果你好奇如何进行网络攻击，你来对了章节，因为现在我将向你展示如何安装 Kali（黑客使用的 Linux发行版）。\n\
    \n## 什么是 Kali Linux？\n\nKali Linux 是黑客和专业测试人员使用的 Linux发行版。在 Kali Linux 中你可以找到许多专注于安全和漏洞测试的程序。无论我们讨论的是扫描、DoS攻击、Web\
    \ 攻击或其他攻击，Kali 都是完美的选择。在图 3.1 中你可以看到该发行版的官方标志。Kali 这个名字来自印度神话。\n\n(img/85e17094b9b0b18870d12b912fb038_27_png)\n\
    图 3.1\n\n尽管最初可能有些困难，但不要阻止你坚持并不断学习新事物。首先，如果你还没有接触过终端（Terminal），它看起来可能非常困难。其次，Kali\
    \ 上的许多程序很难使用（特别是刚开始时），如果你不知道它们的用途和语法。\n\n## 我们如何安装 Kali Linux？\n\n在安装任何 Linux发行版时，我们有两个选择：\n\
    \n- 双系统安装\n    - Linux 和 Windows 安装在不同的分区上\n    - 两个操作系统同时运行\n    - 需要重启电脑/桌面来选择操作系统\n\
    - 虚拟机安装\n    - Linux 在 Virtual Box 中运行并与 Windows 配合\n    - 不需要重启，两个操作系统可以同时使用\n\
    \    - 消耗更多资源（CPU & RAM），因为必须同时分配\n\n我个人更喜欢第二种方法，因为它更简单快捷。此外，根据我自己的经验，如果你使用第一个选项，经常会进入\
    \ Linux 并说“我会再试一次”。但使用第二个版本就不会这样。安装 Kali Linux 需要经过几个步骤。首先，我们需要 VirtualBox 程序（或其他虚拟化程序\
    \ - 例如 VMwareStation）以及图 3.2 所示的 Kali Linux 镜像。建议你选择 64 位版本并使用 Torrent 下载，这样会快得多。\n\
