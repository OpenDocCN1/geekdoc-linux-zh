    # 1) What is a Malware ?


    A malware (aka. malicious software) is a malicious software program designed to
    steal, destroy, or corrupt data stored on our devices.


    Many people use the generic term of the virus, which is not necessarily correct
    because there can be many types of dangerous programs. Here below (only) a part
    of them:


    +   1) Virus

    2) Trojans

    3) Worms

    4) Ransomware

    5) Spyware

    6) Aware

    7) and many more (Rootkit, time bombs, backdoor, etc.)


    Figure 5.1'
  - '[PAGE 49]


    Here is the picture below on Wikipedia, the proportion (in 2011) of malware from
    the Internet. Since then, many things have changed or changed, but it''s interesting
    to have such a hierarchy with the most common types of malware.


    ![](img/85e17094b9b0b18870d12b91b22fb038_49_0.png)


    Malware by categories March 16, 2011


    Figure 5.2


    And now take some of these malware and discuss them in more detail:


    # 1) Viruses


    A virus is a program with which we are all accustomed to. Whether we had the computer
    infected with a virus or that we heard / seen someone else, we know that these
    viruses can be really dangerous for us (and especially for our data stored on
    the computer - the most important element for us).'
  - '[PAGE 50]


    Virus programmers take advantage of existing vulnerabilities in different operating
    systems (especially Windows) and write software to take advantage of them (and
    users of these devices).


    # 2) Trojans


    A Trojan is a type of program designed to appear for the benefit of the person
    who uses it, but there is a malicious code behind that has other intentions altogether.
    These types of programs are most common in the Internet (as you could see in the
    picture above) and are used to being easily masked in front of an inexperienced
    user. So in the (first) run of the program, the trojan is installed and will hide,
    doing its job "quietly". The term Trojan comes from the story of the Trojan horse
    in Greek mythology, exposed in the movie Troy.


    # 3) Worms


    A worm is a form of malware once it infects a device (PC, laptop, server, etc.)
    will do its best to expand and infect others on the network. Thus, a worm manages
    to slow networks and the connected devices (by using CPU and RAM resources) and
    even the network, because infected computers will generate abnormal traffic.


    # 4) Ransomware


    A more popular type of malware lately is ransomware, whose purpose is to encrypt
    the hard disk (or SSD) victims and to request a cash redeem for the decryption
    key.


    # 5) Adware


    There are programs that once installed on a device (or in the browser) will start
    to show commercials (annoying).


    # 6) Spyware


    Spyware are programs designed to extract certain data from users. They are not
    meant to hurt (by consuming resources) or affect the victim in any way, but simply
    extract data and send them to "mother servers" (those who have initiated "espionage").'
