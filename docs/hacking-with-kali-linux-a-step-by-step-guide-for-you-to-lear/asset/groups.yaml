- md: "\nAs you can see in Figure 8.4, the traffic sent from the Switch Network will\
    \ enter (IN) on the Firewall interface and will exit (OUT) on the interface connected\
    \ to the Server. Exactly the opposite happens when the server responds to the\
    \ one who contacted it. Now let us resume the image in Figure 8.3.\n\n![](img/85e17094b9b0b18870d12b91b22fb038_108_0.png)\n\
    \nScenario # 1: Suppose we want to stop the PC (10.0.0.8) from network A from\
    \ sending any traffic to the Server. In this case we need a rule that filters\
    \ after the source IP (ACL Standard). The rules will look like this:\n\n```\n\
    #deny host 10.0.0.8\n#permit any\n```\n\nHow do I check the settings? First of\
    \ all, we will generate ICMP (ping) traffic from PC1 to the server (192.168.10.0),\
    \ and we can see in the figure below, it does not work.) Here is proof that R2\
    \ blocked traffic. The result of the command #show ip access-list indicates that\
    \ we have 8 matches on the deny rule for the PC (Figure 8.5) !\n\n![](img/85e17094b9b0b18870d12b91b22fb038_109_0.png)\n\
    \nFigure 8.5\n\nScenario # 2: Suppose we want to stop any type of Web traffic\
    \ (HTTP - 80 and HTTPS - 443) from the PC to the Internet. In this case, we need\
    \ a more specific rule (ACL Extended). The rules will look like this:\n\n```\n\
    #deny tcp host 10.0.0.8 any eq 80\n#deny tcp host 10.0.0.8 any eq 443\n#permit\
    \ ip any any\n```\n\nThus, the first 2 rules will block Web traffic (ports 80\
    \ and 443) for PC to any (any destination), and the latter rule will allow any\
    \ other traffic from any source to any destination. This rule will be set as close\
    \ as possible to the source (in the R1 interface connected to the PC) in the IN\
    \ direction. We will now generate web traffic (from the PC console to the Server-192.168.10.10):\n\
    \nJust like above, in Figure 8.6 you can see that web traffic has been blocked\
    \ (6 matches) in the first line of the list:\n\n```\nR#\n*Feb 14 14:59:32.955:\
    \ %SYS-5-CONFIG_I: Configured from console by console\nR#show ip acce\nR#show\
    \ ip access-lists\nStandard IP access list ACL STD\n10 deny 10.0.0.8\n20 permit\
    \ any\nExtended IP access list DENY WEB\n10 deny tcp host 10.0.0.8 any eq www\n\
    20 deny tcp host 10.0.0.8 any eq 443\n30 permit ip any any\nR#show ip access-lists\n\
    Standard IP access list ACL STD\n10 deny 10.0.0.8\n20 permit any\nExtended IP\
    \ access list DENY WEB\n10 deny tcp host 10.0.0.8 any eq www (6 matches)\n20 deny\
    \ tcp host 10.0.0.8 any eq 443\n30 permit ip any any (9 matches)\nR#[]\n```\n\n\
    Figure 8.6\n\nOther examples (ACL Standard):\n\n```\n#deny 192.168.99.0/24\n--\
    \ denies the full range of /24\n\n#permit 85.1.245.5\n-- permits only this IP\
