    # How can we protect ourselves from a MITM attack?


    Yes, there is a solution for all these attacks. In fact, several solutions, but
    I will tell you a relatively simple one that you can use from today. It''s called
    VPN (Virtual Private Network) and it will encrypt your traffic without anyone
    (in the middle) being able to decrypt it.

    Another solution applies to Network switches, namely DHCP Snooping or DAI (Dynamic
    ARP Inspection), which are different mechanisms to rely on certain devices in
    the network. And if someone wants to break this, then they will be penalized by
    excluding them completely from the network (closing the port directly from the
    switch).'
