    formula that obtains a unique ID for any package introduced in this formula.


    Thus, when Source (S) wants to send the file to Destination (PC), it passes through
    this formula, and the unique ID (aka Hash) is forwarded to the destination (PC).
    When this file reaches destination, Destination recalculates the file ID. If the
    two values (sent / received) are the same, then the package is the same (aka has
    retained integrity).


