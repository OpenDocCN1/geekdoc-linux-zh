    ## 2) XSS (跨站脚本)


    当涉及到 SQL 注入时，如你所见，攻击者直接访问网站并尝试获取其数据库，以便提取机密数据（用户名和密码、银行信息、邮箱地址等）。在 XSS 的情况下，情况有所不同。攻击者的目标直指用户（访问网站的人），当用户访问网站时，使用脚本对其进行攻击。


    XSS 假设向网站中注入恶意软件（这次是恶意脚本），且不会对网站产生任何影响。当用户访问网站时，这些代码将直接在浏览器中执行。该代码是用 JavaScript
    编写的，这种语言由浏览器执行。


    实现此操作最简单的方法是将恶意代码注入到注释或可以自动运行的脚本中。例如，黑客可以在博客的评论中故意包含一个指向恶意 JavaScript 脚本的链接。


    XSS 攻击（跨站脚本）通过让用户面临风险而不留下任何关于严重程度的痕迹，可以严重损害网站的声誉。现在，处于这种情况的情况下，用户发送到网站的任何敏感信息（如个人数据、银行信息或其他私人数据）都可能通过脚本被误放，而网站所有者并不知道存在问题。


    XSS 攻击后可能发生的一些攻击包括：


    - **窃取 cookies** - 复制 cookie 可能导致会话从有效网站复制到攻击者的虚假网站，从而窃取用户数据

    - **键盘记录器** - 将用户输入的所有字母发送给攻击者

    - **网络钓鱼** - 操纵用户采取无意识的行动，然后查看其数据


    因此，在攻击者尝试 XSS 攻击（通常针对任何带有评论、搜索或数据输入部分的网站等）之后，受害者的数据（例如：当前 Web 会话、cookies）可能会被窃取，并被黑客用于访问不同的页面/资源。因此，攻击者不需要受害者的密码，因为他已经有了
    cookies。通过 XSS，他成功实施了另一种被称为**会话劫持（Session Hijacking）**的攻击。


    备注：[这是一个很棒的网站](https://www.hacksplaining.com/)你可以在那里学习更多关于网络攻击的知识。该网站旨在教育 Web
    开发者关注现有漏洞，并向他们展示如何解决这些问题。


    ## 3) 安全配置错误


    另一个非常常见的问题（不幸的是世界上很大一部分人忽视了它）是密码相关的。是的，在 2018 年我们仍然面临这个问题。许多人没有认真对待针对密码的安全策略，即（首先）不更改默认密码，其次没有更改为复杂的（超过
    8 个字符）字母数字密码。


    我们在密码中添加的每一个额外字符都会极大增加其复杂性，同时增加破解（或猜测）它的难度。


    所以我的建议是，尽管听起来微不足道，请重新评估你在不同系统上的用户名和密码，并采取行动更改它们。如果你可以在密码旁边添加另一个身份验证因子，那就太好了。


    例如，你可以在手机上使用生物识别认证（指纹）或基于用户的、密码和令牌（通常是短信），这比经典版本要安全得多。


    我们将在第 9 章（密码学）中讨论更多关于身份认证形式的细节。在此之前请行动起来！: D 此外，我想让你查看图 7.3，在图中你可以看到用户列表和默认密码。[你可以在这里找到](http://www.routerpasswords.com/)一个包含多个网络设备厂商默认用户和密码的网站。


