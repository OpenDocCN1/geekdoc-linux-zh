  md: '# I. Let’s talk about Hackers


    I suggest that why do in the first chapter of this book, we start talking about
    a very interesting subject from the Cyber Security world: Hackers. I''m sure you''ve
    heard about Hackers, very often online and in the news. Lately, more and more
    often. This means that the number of Hackers (or Cyber Criminals) is increasing
    and so are the opportunities in the Security market.


    Before discussing in more detail about Hackers, I want to tell you that you''ll
    see me use these terms interchangeably: **Cyber Security, Computer Security, Information
    Security or InfoSec.** These are the same thing: **establishing and maintaining
    the security level** of an IT infrastructure (computer network, server, laptop,
    etc.).


    Okay, but why we need Security? Because it assures the good functioning of an
    information system for both companies and people (like you and me). In the case
    of a security incident aimed at extracting **data (information)** from a database,
    the attackers can steal the data and use it in one of the following scenarios
    (but not limited to them):


    +   1) They can **sell** it on the black market (*Deep Web*)

    2) They can use them for **personal purposes** to attack those people in order
    to extract their bank information

    3) Other personal reasons - ego, others appreciation, personal satisfaction ...
    yes, there are many Hackers who are doing for it these reasons


    Okay, now that we''ve been talking badly about Hackers let''s see if all the Hackers
    are bad. Now you may be wondering: "Wait, Ramon, what do you mean by "if...".
    Isn''t a hacker by definition bad?


    Well, I can tell you that... no, it isn’t. The term Hacker (first being mentioned
    in the ''80s) defined a person who was in love with technology and especially
    who loved computer programming (aka. writing code). The'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'term (at that time) used for people who programmed viruses, breaking websites
    or doing any other illegal stuff was **Cracker**.


    In today’s world you don’t hear it anymore. The term, Cracker (today), is associated
    with an individual who is trying to crack/find passwords (e.g. Wi-Fi, database
    passwords, etc.).

    Before we move on, I want to remind you that the general term used (generally
    by the media) is **Hacker** and the process he’s doing is known as "**Hacking".


    **Hacking** is the process an attacker follows in order to gain **unauthorized
    access** to a system (e.g. server, network, laptop, etc.).


    These are the terms to have in mind from now on. I hope you''ve made a clearer
    picture of the Cyber Security world and I suggest we dive even deeper into this
    topic. Let’s talk more about Hackers.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# # How many types of Hackers are out there ?


    As I said earlier: NOT all Hackers are bad. But if they''re not all bad, how do
    we categorize them? Why is this term even used? How do we know if a “Hacker” is
    good or bad ?


    Well, there are 3 main categories of hackers:


    +   - Black Hat Hacker

    - Gray Hat Hacker

    - White Hat Hacker


    And in the next section we are going to break down each of the 3 categories of
    Hackers:


    # ## 1) Black Hat Hacker


    About these types of Hackers, I''m absolutely sure you''ve heard before. Maybe
    not in this "Black Hat" format (Figure 1.1), but you''ve surely heard of them.
    These are the Hackers everyone refers to when it comes to term. The people you
    see in the news that are said to have hacked the servers of the X, Y, Z company.


    ![](img/85e17094b9b0b18870d12b91b22fb038_14_0.png)


    Figure 1.1'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Figure 1.1 above illustrates the "logo" of a "Black Hat" hacker, a non-ethical
    person. Usually those who are starting with the Cyber Security and Pen Testing
    (Penetration Testing) world are by default in this category because they don''t
    have experience and are eager to learn (also they don''t really know what they
    are doing). These guys are also known as Script Kiddies (they only use tools and
    programs that were created by other highly skilled individuals).


    Many of the Black Hat Hackers, hack in order to make themselves feel better. You
    can say that hacking, for them, is a selfish act. Let''s not forget that this
    is a totally unethical way of doing things and no one should have any intent of
    doing it. In this book I strongly promote White Hat Hacking (aka. Ethical Hacking)
    for many reasons (we''ll talk about them a little bit later in this chapter).


    So besides ego, why are Black Hat Hackers... hacking, anyway? The main reason
    would be money. These guys steal the data and sell it on the black market ("Deep
    Web") or use it for personal purposes (theft, spam, etc.).


    # 2) Grey Hat Hacker


    Gray Hat hackers (Figure 1.2) are right in the middle: they are not that good,
    but not bad. What does this mean? It means that they are not 100% committed to
    doing bad things and usually are on the good side (aka. Ethical H).


    ![](img/85e17094b9b0b18870d12b91b22fb038_15_0.png)'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Figure 1.2


    These people are focused on learning, improving themselves, thus they are often
    doing things in an illegal and completely non-ethical way (on servers, someone
    else''s network without the consent of that person organization). It''s not necessarily
    for the money or to steal the data or any other stuff. It''s just for the experience
    and the problem solving activities they are involved. As an Ethical Hacker you
    have a lot of barriers and interdictions (like generating reports) and it''s not
    always fun. But as a Black Hacker (in this case Gray), there are no limitations
    and you are free to test (and eventually learn new stuff and improve your skills).


    My recommendation would be to create (or rent) your own labs. You can either buy
    equipment (like Router, Switches and Servers) and install them into your network,
    or you can create a virtual lab in programs such as GNS3 or EVE-NG. If you don''t
    want to invest your money, I suggest you try both programs and see what works
    best for you.


    # 3) White Hat Hacker (aka. Ethical Hacker)


    Unlike the other two categories we''ve been discussing so far, "White Hat Hack"
    (illustrated in Figure 1.3) are the Ethical Hackers (the good ones). They "break"
    certain infrastructures and networks (servers, laptops, smartphones, etc.) with
    the purpose of discovering vulnerabilities that, generating reports and notifying
    the developers (or administrator) to fix.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '![](img/85e17094b9b0b18870d12b91b22fb038_17_0.png)


    Figure 1.3


    At some point, White Hackers, were either "Black Hat" or decided to act from the
    start as "White". They hack (in an ethical way) and fight for a "cleaner" Internet,
    without security incidents. They are also known as **Penetration Testers** because
    that''s their job. They penetrate systems (network, servers etc.) in hopes of
    finding vulnerabilities that can be exploited.


    They either work in a freelancer mode (they are freelancers, collaborate with
    different companies) or are employed in a company. What I want to say to you is
    this:


    In order to be able to do penetration tests (generally speaking... Hacking), ethical
    hackers must have a contract that gives them the right to do so. The contract
    must be between them and the company that wants such a test (on their servers
    or network) with very clear timelines (when testing begins, at what time, on what
    areas of the company, etc.) so that it does not jeopardize the IT infrastructure.


    At the end of the Pentest, a **report** (with vulnerabilities found) is generated
    that will be handed to the responsible person in the organization.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# II. The Hacking Process


    Generally, when talking about Hacking, there is a very well-thought-out structure
    in the back. We do not want to find a server and "jump" directly on it because
    we have too little information about it at the moment and we are at risk of being
    caught if we do not take into account the 5 steps in the process.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# # How does the Hacking process work?


    I hope you notice that I have said "the Hacking process," which can take a few
    days, weeks, even months (depending on the target and the risk). This process,
    as I said earlier, consists of 5 steps (Figure 2.1):


    +   1. Reconnaissance - Information Gathering

    2. Scanning

    3. Gaining Access

    4. Maintaining Access

    5. Covering Tracks


    ![](img/85e17094b9b0b18870d12b91b22fb038_19_0.png)


    Figure 2.1'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'And now let''s take one turn and talk about each one:


    # 1) Reconnaissance - “Information Gathering”


    One of the most important things that Hackers do when they decide to attack a
    system (server, network, etc.) is to gather as much data as possible about it.

    Think in the following way: when you want to go for a holiday in a place / country
    where you have never been before, what is the first thing you do?

    Most likely, you do homework. You''re interested in that location. You are looking
    for different things on Google (what you can do there, such as weather, food,
    reviews of places in the area, etc.). In other words, you inform yourself about
    your target.


    This is exactly the process of a hacker when he decides to attack a system. There
    are different ways you can learn more about a site / server, one of the simplest
    methods is to search Google for information about it.


    With a simple command like nslookup (or dig), you can find out with the IP address
    of a site, and with the whois command you can find out more about that domain.


    +   > nslookup google.com

    > whois google.com


    The term Reconnaissance (or Information Gathering) comes from the idea of researching,
    informing you about a particular topic before on to action. In short, basically
    it means documenting the action.


    As a matter of time this process is the most "expensive". Why? Because an attacker
    needs to be very well informed, he needs to know things in detail because otherwise
    (as we said in step # 5) he risks his own freedom.


    # 2) Scanning (the system)'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'The next step in the "Hacking Process" is scanning. Once a Hacker has more
    information about his target, he will begin to learn more (technically this time).
    And how will he do that? Using a variety of tools (such as Nmap) to scan networks,
    servers, and provide clearer information about network topology, used equipment,
    operating system, and more.


    Why are they important? Why is it important for a Hacker to know if a particular
    web server is running on Windows or Linux? Because once it has this information
    it can go further (step 3) with a little research on Google to discover some existing
    vulnerabilities and try to take advantage of them in order to gain access to that
    system (or to extract certain data). About scanning and the various ways we can
    do this, we''ll tell more broadly in Chapter 6. Using these scanned data, the
    Hacker will move to step #3.


    # 3) Gaining Access


    Having done the themes (done research, scanned networks / servers, learned information
    from different sources - Google, Facebook, Forums - about the target), the hacker
    can start the attack. The attack should be very well thought to be in stealth
    mode (without triggering alarms and - if possible - without generating too many
    logs).


    There are a lot of tools (Burp Suite, SQLmap, Metasploit, etc.) that can be used
    to generate a cyber attack, everything depends on technology and objective.


    Getting access can be done in several ways and from several points of view:


    +   * Getting root access on a Linux server

    * Obtain access to a site''s administration panel

    * Obtaining access to a particular network equipment (Router, Firewall, Switch
    etc.)

    * Get access to a network’s end device (smart phone, tablet, laptop, etc.)'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Once the hacker has access to one of the items listed earlier, he is infiltrated
    into the network and can get a lot of information about the organization he is
    (digital).


    We will discuss in Chapter 5 more about some types of cyber attacks and how we
    can do them.


    # 4) Maintaining Access


    Once in the network, Hacker has the option of retaining access. In many situations
    when different servers of major companies (Yahoo, Google, Microsoft, etc.) have
    been broken, Hackers have always left open doors to get back into the system.


    These wickets are called "backdoor" and are intentionally left by Hackers (or
    by the software developers of any applications that you and use day by day) to
    have access later in the system.


    So they can constantly extract data, track what''s happening in organizations,
    hold back control, and then do something with these data (usually they are sold
    on the black market on the Deep Web).


    After this process, step #5 is very important.


    # 5) Covering Tracks


    This is a very important process (the "Trace Coverage" feature). A process that
    many Hackers (especially those who are at the beginning of the road) omit it.
    They are simply not mindful (or aware) of covering their tracks and getting caught
    (in the US, by the FBI, CIA or the NSA) and punished in court for their deeds.


    I repeat that unauthorized access to a system can lead to serious criminal consequences:


    +   confiscation of computer goods - laptops, external hard drives, etc.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '+   - placing under supervision

    - or even arrest, these being just some of the consequences


    In order not to leave such traces with the possibility to be discovered, here
    comes a key element: TO UNDERSTAND HOW THE TECHNOLOGY WORKS


    What am I talking about? I refer to the fact that it is extremely important to
    understand how "that database server, that mail or web server" works - both in
    terms of how you configure it and in terms of monitoring and logging it. It''s
    also important to know how to run the Windows or Linux operating system. "How
    are users created? Where are their data stored? Login data? What happens when
    you log on to such a system? Where are those logs written?"


    Hacking (professional, ethical and safe) is not for everyone, and that''s why
    you have to be very well prepared because you are gambling with your own freedom.


    Another very important thing I want you to remember is that no one, NO ONE, does
    "Hacking" from their home. It''s very important to hide your tracks as much as
    you can. This is to change your location, use VPN services and / or Tor for encryption
    and traffic anonymity.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# How do we delete tracks in a system?


    Now let''s take a look at some of the ways you can cover your footprints once
    you have entered a system (network, server, laptop, etc.).


    +   * Delete logs from different applications (web, mail, etc.)

    * Delete User Logs

    * Delete logs from different monitoring systems


    Each system has different ways to monitor it for debugging or troubleshooting
    in the event of a problem.


    To do this, it is not necessary, like a hacker, to go step by step from file to
    file to look for and delete the latest logs. But it can use different existing
    scriptures (on the Internet) of other people with whom they can clean up their
    traces.


    Here''s an example of a Windows program (also you can use the Event Viewer from
    any Windows machine) that does the job for you :


    On Linux you can use the following commands:


    ```

    #rm ./bash_history - to delete the commands given by the current user

    ```


    ```

    #vim /var/log/messages - a place where you can delete the logs that have generated

    ```


    Or in any other file in /var/log, depends on which application was attempting
    to exploit. There is another way we can delete the logs using Meterpreter (an
    application for PenTesters).'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 6) (For the ethical) Reporting


    Another very important step, especially in the Ethical Hacking process, is # 6,
    Reporting, the step in which Hacker generates a report on the vulnerabilities
    found (and exploited), the ways in which they can be corrected, and other information
    that will lead to solve and secure the system.


    These were the 5 steps (6 for Ethical Hackers) that **make the Hacking process**.
    In the next chapter, we will start discussing the three fundamental elements underlying
    cyber security.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# III. Installing and using the Hacker’s OS Kali Linux


    If you''re curious to find out how to do cyber attacks, then you''ve come to the
    right chapter because now I''m going to show you a tutorial to install Kali Linux
    (the Linux distribution used by Hackers).'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# What is Kali Linux?


    Kali Linux is the Linux distribution (most) used by Hackers and Professional Pen
    Testers due to the number of programs pre-installed on it. In Kali Linux you can
    find a lot of programs focused on security and on the vulnerability testing side.
    Whether we''re talking about scans, DoS attacks, Web attacks or any other kind
    of attack, Kali is the perfect choice for whatever it takes to learn security.
    In Figure 3.1 below you can see the official logo of this Linux distribution.
    The name **Kali** comes from the god of war in Hindu mythology.


    ![](img/85e17094b9b0b18870d12b91b22fb038_27_0.png)


    Figure 3.1


    Although at first it may seem a little difficult to use, it does not have to discourage
    you from persevering and constantly learning new things. Why do I say it''s hard
    to use? Well, first of all, it''s Linux, and if you have not interacted with Linux
    so far (from the Terminal) it might seem quite difficult at first.'
  merge: -1
  pgno: 27
- img_proc: true
  md: Second is the large number of Pen Testing programs on Kali. These are difficult
    to use (especially at the beginning) if you do not know what their purpose is
    (basically the technology behind that tool) and if you do not know its syntax
    (but this can be taught - just like the others).
  merge: -1
