  md: 'For the beginning let''s talk briefly about pfSense:


    # pfSense


    pfSense is the most popular open source firewall option available on the market.
    It is used by many companies (even corporations) to protect networks, especially
    traffic coming from the Internet. At the core of this Firewall is a distribution
    of Unix, FreeBSD, known in the community to find a highly secure and reliable
    one. In Figure 8.8, you can see the logo of this Firewall, and in Figure 8.9 below
