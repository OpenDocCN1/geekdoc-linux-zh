  md: '# IV. C.I.A.


    # Introduction to Cyber Security concepts


    In this chapter, we will discuss the three elements that make up the notion of
    Cyber Security. We will basically cover all the bases.


    Many people talk about Cyber Security, they just think about encrypting data.
    This is not necessarily correct, because cyber security implies more than that
    (there are three key elements, known as the CIA). This CIA is a triad composed
    of 3 key elements:


    +   * Confidentiality

    * Integrity

    * Availability


    Each of these 3 elements ensures in one way or another that our data has not been
    read (Confidentiality), has not been modified (Integity), and is accessible at
    any time (Availability).'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# 1) Confidentiality


    When we talk about data **confidentiality**, we will always refer to their encryption
    in order to make them **indescribable**. This encryption process requires algorithms
    with very complex mathematical formulas to ensure that encrypted data cannot be
    read.


    So if you want to encrypt a file on your phone, laptop, or encrypt an Internet
    communication between 2 networks, things can be done in 2 ways (depending on the
    situation):


    +   1. Symmetric - using a single key (PSK - aka password)

    2. **Asymmetric** - using a pair of keys (one public and the other private)


    # a) Symmetric Encryption


    Symmetric encryption is the **most widely used forms** of Internet encryption,
    while being fast and secure.


    The reason it is so widespread is that it requires a single key (called PSK -
    **Pre-Shared Key**) that will be used both for data encryption and for decryption.
    Think of this key as the entrance to your home (you can unlock the door, but you
    can lock it to).


    And, now, here is a common case where you use such a PSK to encrypt data (or traffic).
    This is your wireless connection. Yes, when you first connect to a wireless network
    (WLAN), it will ask for a password (which is the PSK).


    That **key** (password) is used for both **authentication** and **encryption**
    of messages.


    Now that you understand the symmetric encryption, I propose to move on and see
    some algorithms that make it possible to secure data using a single key:


    +   * DES'
  merge: -1
  pgno: 41
- img_proc: true
  md: '+   - 3DES

    - AES

    - Blowfish

    - RC4


    # b) Asymmetric Encryption


    When it comes to asymmetric encryption, things are a little different. The complexity
    of this encryption is much more than the symmetric (1024, 2048 or even 4096 bits
    vs 128, 192, 256), but the consumption of hardware resources is much higher. Besides,
    asymmetric encryption uses a pair of keys - one public and one private.


    The private key is meant to be ... private, and the public key can be distributed
    to anyone. Asymmetric encryption is done as follows:


    Anything encrypted with the PUBLIC key can only decrypt the PRIVATE key (so we
    get data confidentiality).


    Anything encrypted with the PRIVATE key can only decrypt the PUBLIC key (so we
    get a digital signature to authenticate).'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# 2) Integrity


    So, basically, what does data integrity mean?

    The integrity of the data ensures that a file can be transferred from a point
    to a point B without altering (or modifying) its content. It is obtained following
    a process called hashing.


    Suppose we have a PDF file that we want to ensure integrity through the Internet
    transfer. To do this we need the HASH of this PDF file.


    Hash a file helps determine its integrity. When we want to send a file over the
    Internet, changes can take place along the way (packet loss, alteration of information,
    hacker changes content).


    Here are some algorithms for determining the integrity of data:


    +   * MD5 - 128 bits

    * SHA1 - 160 bits

    * SHA2 - 256 bits

    * SHA3 - 384 bits (the current standard)

    * SHA5 - 512 bits'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# 3) Availability


    What value would our data be encrypted and hash-if they can not be accessed? How
    can we use data if the servers, the network (or the stream: D) are down?


    The answer is simple: we could not use them. Then an attack that has the goal
    of interrupting the data availability can be considered a threat to the cyber
    security of a company / organization? Of course. To combat such data security
    incidents, we have several options that we can implement:


    +   * Redundancy - network, server, UPS, etc.

    * Backup


    These two elements underlie the availability of data. Now let''s see the first
    element:


    # a) Redundancy


    There are several types of redundancy, but first let''s see what Redundancy is
    like.


    Redundancy ensures that for any critical component that assures the operation
    of the company (network, server, power supply, etc.) we have at least one active
    replacement. This means that if we have a single Router that is connected to the
    Internet, to ensure redundancy (at best) we will need 2 connections to 2 different
    Internet providers and 2 Routers that connect to these providers.


    When it comes to Server-level redundancy, we can think of two or more servers
    that offer the same services (e.g. web, databases, etc.). Or we can even refer
    to store storage discs (HDDs or SSDs) that can be "linked" together to provide
    redundancy using a technology called RAID (Redundant Array of Independent Disks).'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# b) Backup


    We all know how important the backups are. Both hard disks (SSD) and site-level,
    configuration files, code, etc. **Recurring backups** can "save our skin" very
    often because it is a copy of everything that we have lived in a system.


    For example, in the case of a Ransomware attack (which) if we do not want to pay
    the amount required by hackers, the only option we have is the backup (specifically,
    the restoration of an existing one that will bring that system back to life).


    Unfortunately, in this case, if backups *not done quite often* (at least weekly
    if not daily) then a partial loss of the most recent changes will be achieved.


    What we have discussed so far is the basics of data security (both those running
    through the Internet and those that "stay" stored on a hard disk / SSD).


    As a summary of those discussed, I would like to remind you that:


    +   1. **CIA** (Confidentiality - Encryption - Integrity, Availability) is the
    basis of Cyber Security


    +   2. There are 2 ways to make **Data Encryption** (Symmetric and Asymmetric)


    +   3. Data **integrity** is established by a **Hash** (which is a unique value
    for any sequence of information)


    +   4. It is extremely important to ensure the **Availability** of data. A few
    ways we can do it is by using Backup and Redundancy elements'
  merge: -1
  pgno: 45
