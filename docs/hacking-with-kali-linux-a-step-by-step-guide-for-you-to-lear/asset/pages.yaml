    # A different way of securing (hiding) important files


    If you thought encryption was the only way to hide a file, there are other ways
    (less secure and used, but there are :)). One of them is Steganography and is
    the technique of hiding a file inside another file. Assumes that the bits of the
    "hidden" file are mapped through the "host file" **bits**. So when this file is
    sent by mail, it will be almost impossible to detect by the person who receives
    the file (especially if it does not use a special tool for that) - for anyone
    else.


    But how can we detect "hidden" file in another file? The way we can detect such
