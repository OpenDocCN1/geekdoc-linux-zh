  md: '# VIII. Firewall


    We start a new interesting chapter about Firewalls and how it works. One thing
    I want to say to you is: As long as you work with anything that means servers,
    networks, websites (especially Cyber Security), I assure you that you''ll meet
    (a lot of) Firewalls.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# What is a Firewall?


    Just like a Router or Switch, a firewall is a network equipment that aims to secure
    (protect) the network of potential attackers (hackers) from the Internet.


    By network security I specifically refer to packet filtering (source / destination
    IP address, ports, URL filtering, etc.) in order not to allow unauthorized access
    to the network.


    By default, a firewall block all external traffic that wants to get to the internal
    network (LAN), and it is up to the administrator to configure the network access
    policies required by the company. How does that work? You will find out below;


    One thing you want to know: There is no perfect security, and a Firewall is not
    enough to secure the network, but it is an important component that helps secure
    external access (that is, from the Internet to the LAN).


    Besides this network element, there are many other components that need to be
    considered when it comes to security. As you can see in Figure 8.1, the firewall
    connects all the equipment to the Internet (so basically takes Router''s place
    in this situation). In this purpose it is to protect from potential attacks from
    the Internet, which at some point may try to exploit certain vulnerabilities in
    the systems. The firewall works at level 4 (by default), but it can also be configured
    to run at level 7 (from the OSI model).


    What does this mean? It means you can "look deeper" in the package. Maybe even
    see what URL you are trying to access, maybe even scan the program you are trying
    to download to see if there are any viruses.


    This applies to performance and expensive firewalls, called UTM (Unified Threat
    Management).'
  merge: -1
  pgno: 101
- img_proc: true
  md: '![](img/85e17094b9b0b18870d12b91b22fb038_102_0.png)'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# How does a Firewall uses Security Zones?


    The firewall divides its interfaces into security zones. Virtually every interface
    of a firewall is a secure area. We can create more such areas and include one
    or more interfaces in them. These security zones usually fall into three categories:


    +   - **INSIDE** - the area that includes the internal network (LAN)

    - **OUTSIDE** - the area that includes the external network of the organization
    (usually the Internet)

    - **DMZ** - Special Area Containing Servers


    To each, the firewall will assign a security level (defined by a number between
    0-100) that affects its behavior. For example, if we have an INSIDE area with
    a security level of 100 and an OUTSIDE area with a security level of 0, then ANY
    traffic from INSIDE will be left (by the firewall) to go OUTSIDE (aka Internet
    ), but the traffic that comes from OUTSIDE in INSIDE will be stopped, requiring
    special rules (aka. dynamic learning - stateful - traffic) that need to be configured
    on the firewall.


    **DMZ (Demilitarized Zone)** is a special area in which the equipment requiring
    Internet access is placed. Most of the time in this category is the servers (Web,
    Files, VPN, etc.). These are the company''s public resources to, in theory, anyone
    has access. These servers isolate in a special area (**DMZ**) so that if they
    get corrupted, the rest of the network will not suffer (the hacker can not get
    into the LAN - the company''s internal network). The DMZ has a lower security
    level (30 as you can see in Figure 8.2) than than that of the LAN, but higher
    than that of the Internet. So anyone in the DMZ can access the Internet and vice
    versa, because of the firewall rule we will talk about immediately. In Figure
    8.2, you can see how these security zones look.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '![](img/85e17094b9b0b18870d12b91b22fb038_104_0.png)


    Figure 8.2


    Perhaps at some point you asked yourself, "what does this firewall ''back''? That
    is, how does he actually work? " And I will answer you in the next section about
    the ACL (basically this is the "secret ingredient" that protects us our new networks),
    and YES, even your Wireless Router has a built-in mini-firewall that uses ACLs.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# ACL (Access Control List)


    The ACL is the component underlying the way a firewall works. It is the essential
    component when it comes to protecting and filtering traffic (usually the Internet).
    An Access Control List (ACL) is a set of rules to block or allow access from a
    network to a specific resource. These rules are set to Routers or Firewalls.


    "ACLs are the fundamentals of security concept (access restriction) in one or
    a network (e.g. From the Internet to the LAN - or vice versa)."


    Think of this concept as a Bodyguard sitting at the entrance of a club where a
    private party is organized. He will have a list of all the guests at that party.
    As people try get in, the bodyguard will check each one; will look on the list
    (ACL) and decide for each person whether they are allowed in the club or not.
    Basically, if you are on the list you will be allowed to come in the party, and
    if you do not appear you will not have access (deny) inside.


    To begin, we need to think about what kind of traffic (aka rules) we want to allow
    on our network, and then we''ll include these rules in the ACL. As we will see
    below, these rules may vary: from allowing an entire network to access another,
    and then disallowing a single PC to a server on a particular port (e.g. SSH-22,
    Web-80 ). After such an access list is created and the permissions or deny rules
    are added, it will be put into operation (such as setting it on a Firewall or
    Router interface in a certain direction - IN or OUT). IN (side) is firewall traffic,
    and OUT (side) is the traffic coming out of the Firewall.


    Normally, there are 2 main types of ACLs that can be set (both on Firewalls, Routers
    and Linux Servers):


    +   * ACL Standard

    * ACL Extended


    1) ACL Standard'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'The purpose of standard ACLs is to filter traffic to the IP source. The easiest
    way to understand is through an example (as in Figure 8.3 and by the way, you
    can replace these Firewall Routers in your mind, it does not matter, the idea
    is to understand the concept):


    ![](img/85e17094b9b0b18870d12b91b22fb038_106_0.png)


    Figure 8.3


    Let''s say that (for security reasons) of the Network A PC, with IP 10.0.0.8,
    we will not be allowed to access the S-server. So all we have to do is create
    a list of access to specify this. The rules of this list will look like this:


    ```

    #deny 10.0.0.8

    #permit any

    ```


    This rule will be set to R2, on the closest server interface (in this case, the
    one directly connected to the server) in the OUT direction. We added the 2nd line
    (allow any) because, by default, at the end of each ACL, a "default deny" rule
    (#deny any) appears. We want to stop the traffic from the PC to the server and
    allow any other kind of traffic to rest.


    **ATTENTION:** You do not have to know (or remember) the syntax that I will present
    in this section of the book. The orders come from the command line for Cisco equipment,
    but I want everything I want from you is to understand the CONCEPT and how these
    ACLs work. Why? Because you will meet them very often. Whether you set them up,
    whether you want to get through them, it''s very important to know how it works.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# 2) ACL Extended


    The purpose of Extended ACLs is to filter traffic by:


    +   1. IP Source

    2. IP Destination

    3. Port Source

    4. Destination Port

    5. Protocol (IP, TCP, UDP, etc.)


    Thus, this type of list gives us much greater flexibility when it comes to control.
    We can control any traffic flow regardless of the source, destination, and application
    used. Here are some practical scenarios


    +   1. In short, basically ACLs need the following information to put them into
    practice:

    2. List along with permit / deny rules according to needs

    3. The interface we want to apply these rules

    4. Traffic direction (IN / OUT) on the interface


    ![](img/85e17094b9b0b18870d12b91b22fb038_107_0.png)


    Figure 8.4'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'As you can see in Figure 8.4, the traffic sent from the Switch Network will
    enter (IN) on the Firewall interface and will exit (OUT) on the interface connected
    to the Server. Exactly the opposite happens when the server responds to the one
    who contacted it. Now let us resume the image in Figure 8.3.


    ![](img/85e17094b9b0b18870d12b91b22fb038_108_0.png)


    Scenario # 1: Suppose we want to stop the PC (10.0.0.8) from network A from sending
    any traffic to the Server. In this case we need a rule that filters after the
    source IP (ACL Standard). The rules will look like this:


    ```

    #deny host 10.0.0.8

    #permit any

    ```


    How do I check the settings? First of all, we will generate ICMP (ping) traffic
    from PC1 to the server (192.168.10.0), and we can see in the figure below, it
    does not work.) Here is proof that R2 blocked traffic. The result of the command
    #show ip access-list indicates that we have 8 matches on the deny rule for the
    PC (Figure 8.5) !'
  merge: -1
  pgno: 108
- img_proc: true
  md: '![](img/85e17094b9b0b18870d12b91b22fb038_109_0.png)


    Figure 8.5


    Scenario # 2: Suppose we want to stop any type of Web traffic (HTTP - 80 and HTTPS
    - 443) from the PC to the Internet. In this case, we need a more specific rule
    (ACL Extended). The rules will look like this:


    #deny tcp host 10.0.0.8 any eq 80

    #deny tcp host 10.0.0.8 any eq 443

    #permit ip any any


    Thus, the first 2 rules will block Web traffic (ports 80 and 443) for PC to any
    (any destination), and the latter rule will allow any other traffic from any source
    to any destination. This rule will be set as close as possible to the source (in
    the R1 interface connected to the PC) in the IN direction. We will now generate
    web traffic (from the PC console to the Server-192.168.10.10):'
