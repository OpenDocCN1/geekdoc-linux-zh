    The arguments used in the command are:


    +   - -i eth0: the interface on which traffic is listened

    - -T : to launch command execution over the terminal

    - -M : Man in middle mode

    - -w : writing data to a file

    - 192.168.1.3: the victim''s IP address


    # 3 Rogue DHCP Server


    This type of attack involves creating an unauthorized DHCP Server in the network
    that offers the valid IP address, but offers the IP address of the gateway, the
    address of the attacker. Thus, each network device (which has requested an IP
    address dynamically) will send the traffic to the attacker, which will then redirect
    to the Router. Meanwhile, all traffic can be decrypted (using SSL Strip) and seen
    Wireshark.


    This attack can be done by using (on Windows) program that allows you to create
    the DHCP server, and on Linux you can use the dhcpd server. Besides all this,
    you also need to add a static default route to redirect all traffic to the Network
    Router (aka Gateway). Here are the steps:'
