- img_proc: true
  md: '# How does a VPN work ?


    So let''s finally see how a VPN works. As I said earlier, because a VPN tunnel
    does its job, it needs security, and this security is achieved through a protocol
    framework called IPSec. These VPN tunnels work on security policy because security
    is the key to them. As we will see, these security policies are established with
    IPSec and generally outline what kind of tunnel tuning it is.


    What type of encryption algorithm is it desirable? What kind of integrity, determination
    algorithm? How to authenticate (user and password or digital certificates)? Who
    is going into the tunnel? What are the two devices between which such negotiations
    should take place?


    These are some of the questions that need a response to form a security policy.
    And here there are a lot of possibilities (it depends very much on the level of
    security you want and the hardware performance of your equipment to reach this
    level).


    Security is important and we want more sophisticated algorithms to encrypt (or
    do anything else) the best, but we forget an important aspect: the hardware performance.
    Do we have enough strong equipment to make these demands possible? And here we
    can refer to Firewalls, Routers or even our end-devices.


    Also related to VPNs (especially Site-to-Site), there is a concept called IKE
    (Internet Key Exchange). At the time of creating this tunnel (before our traffic
    is secure) two tunnels are created:


    +   - The first tunnel, in order to facilitate the safe (secure) creation of the
    2nd tunnel


    +   - The 2nd Tunnel in order to secure the traffic that is to pass through it'
  merge: -1
  pgno: 163
- img_proc: true
  md: Basically, IKE helps create these 2 tunnels (which ultimately form the main
    VPN tunnel). But it does not do this alone, but with the help of the next security
    framework.
  merge: -1
  pgno: 164
- img_proc: true
  md: "# What is IPSSec ?\n\nIPSec (or Internet Protocol Security) is a framework\
    \ that helps protect (data) information flowing through the Internet. IPSec makes\
    \ this possible through the four key elements that make up it:\n\n+   - Encryption\
    \ (Confidentiality)\n- Integrity\n- Authentication\n- Anti-replay\n\nAs I said\
    \ earlier, IPSec is a framework. Maybe you wonder what this means? Well a framework\
    \ is an application structure (IPSec) that accepts add-ons, changes to new protocols.\n\
    \nWhether we are talking about data encryption or integrity, and if you come with\
    \ a new protocol (encrypting or doing one of the above mentioned procedures) then\
    \ we can integrate it into IPSec to use it to secure our applications (or VPN\
    \ tunnels).\n\nAnd now I will give you some examples of protocols (included in\
    \ IPSec) that help encrypt data from a VPN:\n\n+   - In the case of encryption\
    \ we have the following protocols:\n  - DES, 3DES\n  - AES, BlowFish, RC4\n- In\
    \ the case of data integrity the protocols are:\n  - MD5, SHA1\n  - SHA2, SHA3\n\
    - In the case of authentication we have 2 main methods\n  - User and password\n\
    \  - Digital certificates\n\nThe 4th element (Anti-replay) refers to the fact\
    \ that the recipient (from an IPSec connection) can detect the data fields that\
    \ were sent in the first phase. This defense mechanism ensures that the source\
    \ of the message does not retrieve the data for malicious purposes, thus attempting\
    \ somewhat"
  merge: -1
  pgno: 165
- img_proc: true
  md: 'denying that they were sent in the first instance. In addition, IPSec is based
    on two major headers encapsulating the standard IP packet:


    +   - AH - Authentication Header (which only establishes integrity and authenticates
    traffic, does NOT encrypt it)


    +   - ESP - Encapsulating Security Payload - Ensures all four elements mentioned
    below


    In Figure 10.11 below you can see how an AH header looks, its primary role being
    to authenticate the package. It contains the necessary data for the authentication
    of each package, IE the assurance of their integrity.


    | IP header | AH header | TCP header | TCP payload / data |


    Figure 10.11


    In Figure 10.12 you can see how the ESP header encapsulates the entire packet
    and encrypts it (all data from level 3 up to level 7 inclusive).


    | IP header | ESP | Encapsulated IP packet or TCP header + payload |


    Figure 10.12


    Thus, encrypting the entire header, IPSec (in the case of this ESP) adds a new
    IP field (that is, changing the current IP address with a false IP) so as to hide
    the source or destination. Maybe you wonder why this is going to happen? Because
    the 2 (source and destination) will be anonymous.


    When we connect (from your phone or laptop) to a VPN, the connection will be SSL
    VPN. If we want to connect 2 networks between them, we will form an IPSec VPN
    tunnel between these 2 Routers and so all the equipment in the two networks will
    be able to communicate with each other (over the Internet - similar to the topology
    in figure 10.13).'
  merge: -1
  pgno: 166
- img_proc: true
  md: '![](img/85e17094b9b0b18870d12b91b22fb038_167_0.png)


    Now I hope you have a much more detailed understanding of what we can refer to
    VPN. The fact that there are several types:


    +   - Site-to-Site used for network connections for Firewalls or Routers

    - Respectively Remote-Access, used for end-device remote connections for security
    / anonymity purposes, or to access the internal resources of a network / companies


    And a few things about IPSec technology, more precisely the role of each component
    of this framework (which I have discussed in more detail in this chapter and in
    the previous chapter):


    +   - Encryption

    - Integrity

    - Authentication

    - Anti-replay'
  merge: -1
