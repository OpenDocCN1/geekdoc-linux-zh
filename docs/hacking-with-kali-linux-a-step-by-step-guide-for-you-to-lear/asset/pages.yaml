    # HMAC


    HMAC (or Hashed-based Message Authentication Code) is a special technique that
    combines two security elements into one: authentication and hashing. To generate
    an HMAC of a text (for example), a password (secret key or PSK) is required to
    be used in the hash process. So adding the password to the hashing process can
    get this hash (which is unique) only if that password is included. Without the
    secret key (aka password), it is not possible to obtain that unique value (hash),
    so integrity will not be retained. It is an example of using an HMAC function:


    HMAC_MD5("secret key", "I love computer security and hacking") = 8bc8517557db4f1f59a96025e30224886'
  merge: -1
  pgno: 131
