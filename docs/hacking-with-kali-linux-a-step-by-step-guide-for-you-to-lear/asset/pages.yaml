    And the other way, which does not offer confidentiality or authentication:

    Everything encrypted with the PRIVATE key can only decrypt with the PUBLIC key,
    this scenario creating a digital signature with the purpose of authentication.
    Here are some asymmetric encryption algorithms:


    +   - RSA

    - DH

    - DSA


    RSA (Rivest Shamir Adleman) is an asymmetric encryption algorithm that uses a
    pair of keys: a public one and a private one. This algorithm bears the names of
    its developers who developed it in the ''70s. Because I was talking earlier about
    symmetric encryption algorithms (RC4, AES, etc.) where I said they could do 128,
    192, 256 bit encryption keys. Asymmetric algorithms can use much larger keys,
    their values being 1024, 2048 or even 4096.'
