  md: '# What is a DDoS (Distributed Denial of Service) attack?


    DDoS is a form of cyber attack to interrupt (for a period of time) the operation
    of a particular service on a server or on an entire network, with many Internet
    traffic sources. DDoS takes place via multiple "infected" computers with malware
    that send an impressive number of Gbps (10.40, 100+ Gbps - greatly depends on
    the number of computers) in traffic. These computers are all over over the world
    and do not have a specific location, which is one of the reasons why DDoS is very
    hard to fight.


    Even recently (in February 2018), the biggest DDoS attack in history, cataloging
    1.5 Tbps (or 1500 Gbps), has taken place. Wow!


    Coming back, I want you to know that such a network of malware-infected computers
    are called Botnet. Below is an example of a Botnet that can serve multiple malicious
    purposes (sending spam or malware or a significant Gbps number for Dos) - Figure
    5.6:'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# DDoS


    ![](img/85e17094b9b0b18870d12b91b22fb038_64_0.png)


    Figure 5.6


    In addition to these network-related attacks, there are also attacks to "break"

    passwords:


    +   1) Brute Force

    2) Dictionary Attack

    3) Rainbow table


    # 1) Brute Force


    Brute Force is a form of cyber attack that aims to gain unauthorized access

    to the system (a site administration server, server, network equipment, etc.).

    This technique uses "brute force," meaning the attacker tries to guess thenpassword
    with a minimum of logic. Often, this technique leads to'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'failure and waiver by the attacker, but there are many cases where access to
    the system is prevented because it has not changed its default password (which
    is often "admin" or "12345678").


    # 2) Dictionary attack


    A Dictionary Attack is a little bit more targeted on the victim''s system because
    there are several external factors that relate to that organization / person.

    With the help of some tools, hundreds or thousands of words can be generated that
    can be tried to get access to the system. The disadvantage of this type of attack
    is that it can take a long time (depending on the number of words and the security
    of the system), and the dictionary does not guarantee the success of the attack.

    An way to combat these types of attacks is to use a maximum number (usually 3)
    of login attempts in the system.


    # 3) Rainbow table


    The third type of attack is called "Rainbow Table" which aims to "decipher" a
    hash. Do you still know what a hash is? If not, I''ll briefly summarize.


    Thus the attacker will use a hash list to decipher the hash-passwords from the
    stolen database. This list is called "rainbow table" and tries to find out which
    is the password.'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'And now you may be wondering, "Why are things so?" The answer is simple: because
    the hash process is irreversible, that is, once the hash has been generated, we
    cannot enter it using the same mathematical formula and get the password.


    So the attacker tries his luck with his list of hashes (rainbow tables) that are
    associated with passwords.

    In the next chapter, we''ll move on to the first step toward generating a cyber
    attack, and we''ll talk about Scanning. Also, towards the end of the chapter I
    will show you how to do a DoS pin attack using (Kali) Linux.'
