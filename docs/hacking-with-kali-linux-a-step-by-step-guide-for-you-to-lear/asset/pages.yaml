  md: '# X. Protecting our Internet traffic with VPN technology


    I''m sure you''ve heard of the term VPN. This technology was very common in the
    last time when when the number of cyber attacks is on the rise (Cyber Security
    is beginning to become more and more important). So the topic we are discussing
    in this chapter is VPN.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# What is a VPN?


    A Virtual Private Network (VPN) is a tunnel between 2 Routers / Firewalls (or
    even a PC, laptop, phone to a particular server) that provides secure access between
    2 or more networks. In addition to security, the VPN connects the two networks
    (as if they were directly connected).


    You can now think, "Hmm ... weird, I knew totally different! Is not the VPN one
    that changes my IP and secures my connection? " My answer: "Yes, the VPN also
    does this, as you will see, there are several types of VPNs, each with its purpose."
    We''ll talk about this in more detail.


    Until then, here is 10.1, the classic example of a VPN tunnel over the Internet
    linking 2 networks (and securing traffic) - between 2 organizations / companies
    (or networks):


    ![](img/85e17094b9b0b18870d12b91b22fb038_142_0.png)


    Figure 10.1


    With this tunnel, end-devices (PCs, laptops, Servers, etc.) of the two networks
    can communicate securely over the Internet. Virtually the (virtual) connection
    between the two networks is as if they were directly connected to the same Router.'
  merge: -1
  pgno: 142
- img_proc: true
  md: What does that help us? Simple. If in the 10.26.3.0/24 network (connected to
    R2 - right) there are several servers (mail, files, etc.), using this VPN tunnel
    **(created on Routers)**, the devices in the 192.168.19.0 network / 24 (left -
    R1) will have **access** to the **resources** provided by the server.
  merge: -1
  pgno: 143
- img_proc: true
  md: '# How many types of VPNs do exist?


    In short, there are 2 main VPN categories / types that exist on the market, namely:


    +   - VPN Site-to-Site

    - Remote Access VPN


    Now I think it would be a good idea to talk about each one separately; D


    # 1) VPN Site-to-Site


    What you saw earlier in Figure 10.1 is a type of Site-to-Site VPN. Why? Because
    it connects 2 locations (sites - NOT web, but networks) differently as if they
    were directly connected. Even more, a VPN makes you anonymous (change the IP address
    with some "false") and secure the connection of all devices that send traffic
    from the R1 network to the R2 network and vice versa. This type of VPN uses a
    technology called IPSec (Internet Protocol Security) for encryption, integrity,
    and authentication that we''ll talk about later.


    In the example below (Figure 10.2) you can see how a site-to-site VPN topology
    looks logically. This topology takes place between 3 locations (anywhere in the
    world). You can see how Router R1 (and the network behind 192.168.19.0/24) connects
    to R2 and R3 respectively. This R1 and his network will have access to the internal
    resources of R2, R3.


    If this is a company, then these resources can be: Active Directory Server, DNS
    Server, Mail Server, Skype for Business etc.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '![](img/85e17094b9b0b18870d12b91b22fb038_145_0.png)


    Figure 10.2


    # 2) Remote Access VPN


    Now I''ve come to the type of VPN you probably thought about when you first read
    the title of this chapter. This type of VPN (as opposed to the site-to-site VPN)
    is most common because it is handy and relatively easy to configure. At the moment
    there are many VPN providers (such as Bitdeferender, CyberGhost, NordVPN, etc.)
    that offer the complete encryption and **anonymity** solution on the Internet.
    I really encourage you to purchase such service because it will be very beneficial
    (+ you can use on your laptop, desktop or smart device).


    A VPN is very beneficial if you **care about your security** (especially when
    you''re connected to a public Wi-Fi, which, you''ve seen in Chapter 5, can be
    extremely dangerous due to MITM attacks). If you work at a company, it can give
    you the opportunity to work remote, and if you use your VPN, you will have access
    to the company''s **internal resources.**'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'As a protocol that secures the connection, SSL (Secure Socket Layer) - or TLS
    (Transport Layer Security - which also deals with securing our Web, FTP, and so
    on connections) is the most common reason why SSL is used in this case it is due
    to the ease of implementation and configuration, compared to IPSec.


    In the example below (Figure 10.3) you can see how a Remote Access VPN topology
    looks (logically). An increasingly common term used for this type of VPN is Teleworking.
    In this example, PC A will have access to the internal resources on R3''s network.
