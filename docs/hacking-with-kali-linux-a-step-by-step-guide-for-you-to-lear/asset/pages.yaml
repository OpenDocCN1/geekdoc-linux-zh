  md: '# Firewall options available on the market


    When it comes to talking about different types of firewalls on the market, we
    have a wide range of choices (everything depends on our competencies and our budget).
    There are two main categories:


    +   - **Vendor specific** - Cisco ASA, Palo Alto, Checkpoint, Fortinet etc.

    - **Open Source** - pfSense, OPNSense, IP Fire etc.


    Most of these firewalls work in a similar way (the basic concept is the same),
    but each vendor / developer comes with its different elements that make it unique
    (artificial intelligence for malware, anti-virus, anti-spam incorporation, URL-level
    filtering, etc.). Currently, the market tends to go further towards Palo Alto
    due to technology innovations on their firewalls, and a renowned vendor on the
    network (Cisco), remaining behind with its firewall, ASA (Adaptive Security Appliance).


    If you want a cheap (or even free) solution, good and fast to implement, then
    one of the variants may even be these **Open Source** firewalls that we will talk
    about below.


    In this section we will talk much more about Open Source solutions, and as the
    main example we will choose **OPNSense** (Figure 8.7) because of the most user-friendly
    interface.


    ![](img/85e17094b9b0b18870d12b91b22fb038_112_0.png)


    Figure 8.7'
  merge: -1
  pgno: 112
