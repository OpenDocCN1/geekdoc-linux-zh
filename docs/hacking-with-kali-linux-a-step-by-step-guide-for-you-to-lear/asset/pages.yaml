  md: '# IX. Introduction to Cryptography


    **Cryptography.** A trending term (and concept), especially because of the increased
    interest in Cryptocurrency in recent years. This concept is the basis of everything
    you do when it comes to securing Internet data. Our data can be in 2 states: moving
    (traffic through the Internet - sending traffic) and stored (static on an SSD
    for example). These data must be secured in one way or another so that they do
    not reach the hands of an unauthorized person.


    Now we are going to talk about the cryptography and resume some of those discussed
    in Chapter 4 (CIA) (but I will go a little more in detail) because I want things
    to make sense.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# 1) Data Confidentiality


    When we talk about data confidentiality, we will always refer to their encryption
    in order to make them unreadable. This encryption process requires algorithms
    with very complex mathematical formulas to ensure that they cannot be read. When
    we talk about algorithms, here are two ways we can do the encryption:


    +   1. Symmetric - using a single key (PSK)

    2. Asymmetric - using a pair of keys (one public and the other private)


    # a) Symmetric Encryption


    Symmetric encryption is the most widely used form of encryption in the Internet
    because it''s fast and secure. The reason it is so widespread is that it requires
    a single key (called PSK - Pre-Shared Key) that will be used both for data encryption
    and decryption.


    Think of this key as the entrance to your home (with it you can unlock the door,
    but you can lock it too).


    And now, here is a common case where you use such a PSK to encrypt data (or traffic).
    This is your wireless connection. Yes, when you first connect to a wireless network
    (WLAN), it will ask for a password (which is the PSK).


    That key (password) is used for both network authentication and encryption of
    messages. Now that you understand the symmetric encryption, I propose to move
    on and see some algorithms that make it possible to secure data using a single
    key:


    +   * DES

    * 3DES

    * AES

    * Blowfish

    * RC4'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'Each of these algorithms use a key for both encryption and decryption.


    **DES and 3DES (Data Encryption Standard)** are two encryption algorithms developed
    in the United States in the early 1970s and have a 56-bit complexity for DES and
    168-bits for 3DES. 3DES is not 3 times safer (or does not SECURE 3 times better)
    than DES, but simply on the same data, apply the DES algorithm three times.


    DES and 3DES are algorithms that are no longer used because vulnerabilities have
    been discovered in them, and the complexity of encryption is much weaker than
    other algorithms on the market.


    In 1999, there was an experiment where decryption ("breaking", "cracking") of
    an DES-encrypted message was desired, and this was done less than 24 hours!


    **AES (Advanced Encryption Standard)** is the most popular (and used) symmetric
    encryption algorithm. It uses a single key (aka PSK) for data encryption and the
    same key for decryption.


    Its key values can be **128, 192, 256 bits**, all depending on the level of security
    you want or the ability of the system to make such encryption.'
  merge: -1
  pgno: 124
- img_proc: true
