  md: '# Introduction


    First of all, I want to congratulate you and thank you for taking the decision
    to invest in yourself and become better. This guide will take you from 0 (in the
    field of Cyber Security) and will lead you to a basic level so that you are aware
    of the things that happen around us on the Internet every day.


    I want this book to change your mentality, the way you think and give you a new
    perspective on things. The concepts explained here are both theoretical and practical.
    Let me show you a few of the stuff that you are going to learn from this book


    +   * How Hackers think

    * What are the 5 steps of Hacking

    * How to scan devices in a network

    * How to see other people''s traffic (such as passwords and web sessions)

    * How to use Kali Linux

    * VPN and Cryptography concepts

    * Website Hacking and Security

    * And many more :)


    This book is structured in 6 chapters that cover different themes, belonging to
    the basic concepts of Cyber Security. One thing I want you to know is if you are
    starting for the first time in IT, this book is not the right choice. Why? Because
    you need Linux (at least average) knowledge, networking and (little) programming
    to understand some of the things that I explain here.


    That''s why I want to tell you (from the very beginning) that: before you learn
    to break and secure things, it''s important to understand how technology works.
    Having this in mind, I will give you a lot of strength in what you do, pull as
    hard as you can, in the end, you will see, with constant work and effort you will
    achieve what you have done.'
