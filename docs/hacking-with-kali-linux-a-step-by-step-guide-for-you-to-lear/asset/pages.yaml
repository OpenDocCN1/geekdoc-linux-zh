    also one in-line command (which can often compensate for the missing graphics
    - from the browser). In the figure below you can see the main dashboard of this
    OS, which at first glance seems a little crowded.


    All of these Open Source firewalls (pfSense, OPNSense, IP Fire, etc.) can be installed
    on your own laptop, in a virtual machine or even on a 2 LAN port computer (one
    that will be used for LAN and the other for WAN - Internet connection). This computer
    (or older laptop) will be used as a "Router / Firewall" to connect you to the
    Internet and of course to protect your network.'
