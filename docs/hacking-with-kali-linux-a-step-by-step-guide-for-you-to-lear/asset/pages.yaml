  md: '# # nmap -F -oN rezultat scanare.txt 192.168.1.0/24 -- scans the network quickly
    and stores the result in the results.txt file (very useful for a Python script)


    # 3) Hping3


    Another very useful tool we can use next to Nmap is hping3. Hping3 is a traffic
    generator, similar to ping, but with much more functionality. It is able to send
    (besides ICMP - ping traffic) packets of the TCP, UDP or RAW - IP type customized
    packages (with any specification we tell them about these protocols).


    For example, we can send a TCP ACK packet or FIN to see how the server or firewall
    that we want to test reacts. Below is a list of things you can do with this tool.
    Practically, hping3 helps us to do the following:


    +   * Firewall testing

    * Advanced port scanning

    * Network testing, using different protocols, TOS, fragmentation

    * Manual path MTU discovery

    * Advanced traceroute, under all the supported protocols

    * Remote OS fingerprinting

    * Remote uptime guessing

    * TCP/IP stacks auditing


    Here are a few examples of using hping3:


    ```

    # hping3 -h -- to learn more about the available arguments

    ```


    ```

    # hping3 -1 VICTIM IP -- a normal ping (ICMP) is sent (Figure 6.3)

    ```


    ```

    # hping3 --traceroute -V1 VICTIM IP -- a single traceroute package is sent to
    where it is going

    ```


    ```

    # hping3 -V -S -p 80 VICTIM IP -- TCP SYN packets are sent on port 80 to see if
    the application responds

    ```'
  merge: -1
