  md: '# VII. Web Security


    In this chapter, we will briefly talk about web security and about some attacks
    that you need to have in mind. I''m absolutely sure you''ve heard a lot of times
    on TV, radio or from other sources of the company''s X site being broken, the
    organization''s Y site being down and hackers replacing the main site with a fake
    page.


    Well, I want to tell you that at large (Less Experienced Hackers) they all look
    for many vulnerabilities well known to their sites 1 to 2 that they can take advantage
    of. There are many tools that help them locate these vulnerabilities relatively
    easily, and then help them exploit.


    Some of these vulnerabilities (web-level) are extremely well presented and documented
    in the Open Web Application Security Project (OWASP). OWASP is a nonprofit organization
    dedicated to improving the security of software and web applications.


    They have a top 10 with the most commonly reported security incidents in previous
    years on websites and web applications. OWASP organizes even local events (you
    can research on Google or Facebook for such events), creating a community of passionate
    cyber security people.


    If you hear at some point of such an event and you have the opportunity to go,
    I recommend you to take this step because you will see that it is worthwhile first
    and secondly that you learn a lot of things from many people.


    For example, in Figure 7.1, a list of the most common web security incidents that
    occurred in 2017 (compared to 2013):'
  merge: -1
  pgno: 81
- img_proc: true
  md: '| OWASP Top 10 – 2013 (Previous) | OWASP Top 10 – 2017 (New) |

    |---|--|

    | A1-Injection | A1-Injection |

    | A2-Broken Authentication and Session Management | A2-Broken Authentication and
    Session Management |

    | A3-Cross-Site Scripting (XSS) | A3-Cross-Site Scripting (XSS) |

    | A4-Insecure Direct Object References - Merged with A7 | A4-Broken Access Control
    (Original category in 2003/2004) |

    | A5-Security Misconfiguration | A5-Security Misconfiguration |

    | A6-Sensitive Data Exposure | A6-Sensitive Data Exposure |

    | A7-Missing Function Level Access Control - Merged with A4 | A7-Insufficient
    Attack Protection (NEW) |

    | A8-Cross-Site Request Forgery (CSRF) | A8-Cross-Site Request Forgery (CSRF)
    |

    | A9-Using Components with Known Vulnerabilities | A9-Using Components with Known
    Vulnerabilities |

    | A10-Invalidated Redirects and Forwards - Dropped | A10-Underprotected APIs (NEW)
    |


    Figure 7.1


    As you can see for the most part, it''s about the same type of vulnerabilities,
    with the top changing very very little over a three-year period. We will only
    take some of these attacks and explain to you what each person represents and
    how you can do them on your own site.


    Here are the attacks, we will discuss further:


    +   * SQL injection

    * XSS

    * Security Misconfiguration


    Now let''s start talking about web attacks with the first attack / vulnerability
    (and most common) from the list above:'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# 1) SQL Injection


    When we talk about SQL injection, we are talking primarily about databases, and
    secondly about the attack (a vulnerability) at their level. Let''s first look
    at what SQL is. **SQL (Structured Query Language)** is a query language with databases.
    It is used to communicate directly with the database through various commands
    addressed to it. There are several types / forms of SQL, but the basics are the
    same.


    Practically SQL injection (Figure 7.2) is a way for a hacker to access a database
    in an unauthorized way and extract extraordinarily important information (data
    about people, username & password, contact data such as emails or bank information,
    etc.). This is generally due to a programming error.


    ![](img/85e17094b9b0b18870d12b91b22fb038_83_0.png)


    Where are the SQL injection attacks? Most often these occur when the attacker
    finds a "box" in which he can enter data. For example, think about a search box
    in which anyone can write anything.'
  merge: -1
  pgno: 83
- img_proc: true
  md: 'If the back code (most often PHP) is not written properly, then the hacker
    can enter SQL commands that interact directly with the database, so they can extract
    different information.


    Now I want you to think that when you interact with an "input form" (a box where
    you can write and send something to the server), this happens:


    ```

    SELECT * FROM ? WHERE LIKE ''%...'';

    ```


    That is, PHP language will generate such an order to interact (and search) with
    the database. In the place where "%" appears, it will be replaced with what you
    enter in that input form.


    Here''s an example of a SQL code that can be entered in this field (ATTENTION:
    it will not work for any site. I suggest using the bWAPP application and testing
    it):


    ```

    * OR 1=:-

    ```


    You can try on this site (https://sqlzoo.net/hack/) to enter the SQL statement
    instead of the username and password.


    SQLmap (http://sqlmap.org/) is a great tool for you to test database vulnerabilities
    on a site. SQLmap will do all these queries that automate SQL injection for you
    (and even try to break the hash of the passwords you will find in the database).


    I also recommend that you download and install bWAPP, a web application that contains
    over 100 classical vulnerabilities (including the OWASP top 10). You can practice
    this virtual machine (which you will need to connect to it through the browser
    - put the IP address of the virtual machine in your browser) without any problems
    later (you know what I was talking about in chapter 1 ... about hackers?). If
    you want to install bWAPP on Kali (or any other Linux or Windows distribution),
    I recommend that you follow these tutorials (https://www.youtube.com/watch?v=XDCZ8FC856s).'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# 2) XSS (Cross-Site Scripting)


    When it comes to SQL injection, as you have seen, the attacker goes directly to
    the site and tries to gain access to his database so that he can retrieve confidential
    data (usernames and passwords, bank information, mail addresses, etc.). In the
    XSS case, things happen differently. The attacker''s focus is directed at the
    user (the one who accesses the site), when he uses a script to attack him.


    XSS supposes the injection of malware (malicious script this time) into the site
    (without affecting it in any way), and when accessing the site by the user, this
    code will be executed directly in the browser. The code is written in JavaScript,
    which language is executed by the browser.


    The easiest way to do this is by injecting the malicious code into a comment or
    script that can be run automatically.

    For example, the hacker can incorporate a link to a malicious JavaScript script
    intentionally in a comment on a blog.


    XSS attacks (Cross-site scripting) can significantly damage the site''s reputation
    by placing users'' at risk without leaving any traces of how bad it was. Now,
    being in this situation, any sensitive information a user sends to the site (such
    as personal data, bank information, or other private data) - can be misplaced
    through scripts without the site owner''s knowledge that there is a problem.


    Some of the attacks that may occur following an XSS attack:


    +   - **Stealing cookies** - duplication of a cookie may result in duplication
    of the session from the valid site to a fake site of the attacker that can steal
    user data

    - **Keylogger** - sending all letters typed by the user to the attacker

    - **Phishing** - manipulating the user to take action that is unconscious, and
    then viewing his or her data'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'So after an attacker tries an XSS attack (usually on any site that has a comment,
    search or data input section, etc.), the victim''s data (e.g., current web session,
    cookies ) can be stolen and used by the hacker to access different pages / resources.
    Thus, the attacker does not need his user the victim''s password because it already
    has cookies. Using XSS, he managed to make another type of attack known as **Session
    Hijacking.**


    NOTES: [Here''s a great site](https://www.hacksplaining.com/) that you can learn
    more about web attacks. The site was designed to educate web developers to be
    aware of existing vulnerabilities and to show them how to solve them.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# 3) Security Misconfiguration


    Another problem that is very common, and unfortunately a large part of the world
    omit it is password-related. YES, in 2018 we still have this problem. Many people
    do not take seriously security policies that target passwords and (first of all)
    change default ones, and secondly changing with a complex password (over 8 characters)
    in alphanumeric characters.


    Every extra character that we add to a password increases in a dramatic way the
    complexity and at the same time the difficulty of breaking (or guessing) it.


    So my advice, though it seems trivial, to re-evaluate your username and password
    on different systems and switch to action to change them. If you can still add
    another authentication factor next to your password, that would be great.


    For example, you can use biometric authentication (fingerprint) or user-based,
    password and token (generally SMS) on your phone, which is much safer than the
    classic version.


    We will discuss in Chapter 9 (Cryptography) more details about the different forms
    of authentication. Until then you go into action! : D In addition, I want you
    to look at Figure 7.3, where you can see a list of users and default passwords.
    [Here you find](http://www.routerpasswords.com/) a website with default users
    and passwords of several network equipment vendors.'
  merge: -1
  pgno: 87
