  md: '# 2) Data Integrity


    So, basically, what does data integrity mean? The integrity of the data ensures
    that a file can be transferred from a point A to a point B without altering (or
    modifying) its content. It is obtained following a process called hashing.


    Suppose we have a PDF file that we want to ensure integrity through the Internet
    transfer. To do this we need the HASH of this PDF file.


    Follow the tutorial below to learn more about these concepts:

    Hash file helps determine its integrity. When we want to send a file over the
    Internet, changes can take place along the way (packet loss, alteration of information,
    hacker changes content).


    So we need a mechanism to ensure that it remains intact (or that the package arrived
    at the destination is exactly the one sent from the source).


    ![](img/85e17094b9b0b18870d12b91b22fb038_128_0.png)


    Figure 9.3


    Hash helps us accomplish this goal, basically it is generated by a mathematical
    formula that obtains a unique ID for any package introduced in this formula.'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'Thus, when the Source (Server S) wants to send the file to Destination (PC
    A), it passes through this formula, and the unique ID (aka Hash) is forwarded
    to the destination (PC).


    When this file reaches its destination, Destination recalculates the file ID.
    If the two values (or IDs) - sent / received - are the same, then the package
    is the same (aka and has retained its integrity).


    In the tutorial I saw how encryption can help us hide the file content, but this
    is not enough to secure it completely so that anyone can add data (bits) to that
    file that will alter the content. In this chapter, we were able to see how we
    protected data from such an attack mechanism by using hash.


    Here are some algorithms for determining the integrity of data:


    +   - MD5 - 128 bits

    - SHA1 - 160 bits

    - SHA2 - 256 bits

    - SHA3 - 368 bits (the current standard)

    - SHA5 - 512 bits


