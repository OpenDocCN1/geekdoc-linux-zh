- img_proc: true
  md: '# What is a Cyber Attack?


    A cyber attack is a means by which a person (with evil intentions) takes advantage
    of the vulnerabilities existing on a particular system (server, computer, network
    equipment, application, etc.).

    Here are some of the most common attacks on the Internet:


    +   1) MITM-Man in the Middle

    2) DoS-Denial of Service

    3) DDoS-Distributed Denial of Service, check this link: http://www.digitalattackmap.com/

    4) SQLi-SQL injection

    5) XSS-Cross-Site Scripting


    In addition, there are many more in the Internet world, but to illustrate some,
    we will only focus on the top 3. So let''s take the first type of attack, MITM,
    and discuss it in more more detail about it (and show you some ways you can make
    such attacks - but please do it in an ethical way), after which will we go further
    with the discussion and DoS and DDoS.


    After all, in Chapter 6 we will discuss web security and other types of attacks:
    SQL injections and XSS.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# What is a MITM (Man In Middle) attack ?


    MITM is a type of cyber attack in order to listen to the traffic of users connected
    to the same network.


    What this means? It means that if you go to a café in town, someone can connect
    with you to the same Wi-Fi, and from just a few commands you can see all your
    conversations on Facebook, Google, etc.


    That''s how it is, but do not worry because things are not that simple. Why? Because
    the vast majority of our Internet connections are secured (HTTPS instead of HTTP;)),
    instead it does not mean that there can be no one listening to your traffic.


    To avoid such situations, I recommend that you use a VPN in public places. In
    Figure 5.3 you can see an example of an MITM attack:


    # Man In The Middle


    ![](img/85e17094b9b0b18870d12b91b22fb038_55_0.png)'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Figure 5.3


    There are several ways you can do MITM (I will list below just a few of the many
    possibilities below):


    +   * MAC Spoofing

    * ARP Spoofing

    * Rogue DHCP Server

    * STP Attack

    * DNS Poisoning


    These are some of the most common. In the following I will discuss some of these
    and I will give you some practical examples of how to do it.


    # 1) MAC Spoofing


    The term spoofing comes from deceiving, and in this case it refers to the deception
    of at least one device in the network by the fact that a certain computer is given
    as another computer (or even Router) using its MAC address.


    This can be done very easily using a program that changes your MAC address with
    a PC to see its traffic. Here''s an example (https://windowsreport.com/mac-address-changer-windows-10/)
    on Windows 10 about how to change your MAC address, but in my opinion the process
    is much more complex, compared to Linux:


    ```

    # ifconfig eth0 down

    # macchanger -m 00:d0:70:00:20:69 eth0

    # ifconfig eth0 up

    ```


    First, we stop the interface (eth0 in this example), then we use the macchanger
    command that helps us with the MAC address change, and the -m argument lets us
    specify an address. For verification, use the command: #ifconfig'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'PS: If you want to generate a random MAC, then use: #macchanger -r eth0


    # 2) ARP Spoofing


    ARP Spoofing works in a similar way to MAC spoofing, just as the attacker uses
    the ARP protocol to mislead the entire network about having the MAC address X
    (which is actually the Router). Thus, all network devices that want to reach the
    Internet will send the traffic to the attacker (which will redirect it to Router).
    In this situation, the attacker can see all the traffic passing through him using
    a traffic capture program such as Wireshark.


    In Figure 5.4 below, you can see how this process takes place:


    ![](img/85e17094b9b0b18870d12b91b22fb038_57_0.png)


    To initiate such an attack first we must start the routing process on Linux so
    that traffic can be sent from the victim to the Router and vice versa'
  merge: -1
  pgno: 57
