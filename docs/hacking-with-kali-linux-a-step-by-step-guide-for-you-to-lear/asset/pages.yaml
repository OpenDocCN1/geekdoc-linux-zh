    As you can see, enter the secret key, then enter the data that you want to be
    hash-look (in this case I only put an affirmation that I hope you agree too);
    We gave 3 examples because each example uses a more complex algorithm (MD5 < SHA1
    < SHA256) and generates a stronger hash (which is extremely difficult to break
    especially because it also contains a secret key to be found by an attacker).


    As I said earlier, this HMAC usage is a very good (and much more secure) way of
    establishing the integrity (of the data that transits the network - e.g. through
    VPN, which we will talk more about the next chapter). On this site (https://www.freeformatter.com/hmac-generator.html)
    you can generate your own hash using the HMAC technique.


    # Salt


    Another interesting technique that helps us to increase the security (difficulty)
    of passwords (stored in a database) for example is the use of Salt in the hashing
    process. Basically, a randomly generated text is added when the password is hashing
    to be stored in the database. So any attacker is much, much harder to "break"
    these passwords using techniques like dictionaries or rainbow tables that we talked
    about.


    The process follows:


    +   1. Generate salt in a random fashion

    2. Combine the salt with the password'
