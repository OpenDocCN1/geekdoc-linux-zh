  - 1) 使用 Nmap 扫描网络
- - '##'
  - nmap -sP 192.168.1.0/24 -- ICMP (ping) 扫描，显示网络设备数量（又称 PING 扫描）
- - '##'
  - nmap -sS 192.168.1.0/24 -- 扫描整个网络以找到每个设备上的开放端口（TCP，使用 SYN）（又称 端口扫描）
- - '##'
  - 使用 Nmap 扫描网络中的设备（服务器、笔记本电脑、智能手机等）
- - '##'
  - nmap -A 192.168.1.1 -- 扫描单个设备的服务交付（端口）和操作系统（又称 OS 扫描）
- - '##'
  - nmap -sT 192.168.1.254 -- 使用 TCP 数据包进行扫描
- - '##'
  - '# nmap -sU 192.168.1.1 -- 使用 UDP 数据包进行扫描'
- - '##'
  - '# nmap -F 192.168.1.0/24 -- 扫描网络中的每个设备的前 100 个最常用端口'
- - '##'
  - '# nmap -sS -p 80,443,23,22 192.168.1.1 -- 使用 SYN 数据包扫描设备指定的 -p 端口'
- - '##'
  - '# nmap -F -oN rezultat scanare.txt 192.168.1.0/24 -- 快速扫描网络并将结果存储在 results.txt
    文件中（对 Python 脚本非常有用）'
