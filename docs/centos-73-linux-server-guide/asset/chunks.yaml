    Accessing the Management Console


    This tool is good for allowing you to monitor the server processes through a web
    browser. The RabbitMQ management console can be enabled by executing the following
    command:


    rabbitmq-plugins enable rabbitmq_management


    This should then be followed by the following command:


    chown -R rabbitmq:rabbitmq /var/lib/rabbitmq/


    You can then launch your browser and navigate to the URL given below so as to
    access the RabbitMQ server management console:


    [http://ip-address:15672/](http://ip-address:15672/)


    Note that the RabbitMQ management console comes with a default username and password,
    which are “guest” and “guest.” You may also go ahead and create the admin user
    if you need to have one. You only have to run the following commands:


    rabbitmqctl add_user admin admin


    rabbitmqctl set_user_tags admin administrator


    rabbitmqctl set_permissions -p / admin ".*" ".*" ".*"


    You can then enter the username as well as the password so as to gain access to
    the RabbitMQ web console. You will be taken to the web dashboard for RabbitMQ.
    You can then begin to use your RabbitMQ server!


    # Chapter 7- Node.js Setup


    Node.js is simply a platform for JavaScript which can be used for programming
    on the server side. With this, users are able to create networked applications
    which are needed for backend functionality. When JavaScript is used as the language,
    both on the client and on the server side, the development process becomes much
    easy and consistent. Let us discuss how we can get Node.js running on our CentOS
    7.3 server.


    Installing Node from Source


    A simple way of getting Node.js is getting its source code and then compiling
    it. The source has to be obtained from the website of the project. Once you are
    on the download page, just right click on the link for the source code and then
    choose “Copy link address” or any other related option you might be given. You
    can then use the “wget” command and the link on your server so as to download
    this as shown below:


    wget [http://nodejs.org/dist/v0.10.30/node-v0.10.30.tar.gz](http://nodejs.org/dist/v0.10.30/node-v0.10.30.tar.gz)


    You can then extract the archive you have just downloaded and then move to your
    new directory. This is shown below:


    tar xzvf node-v* && cd node-v*


    There will be a number of packages which should be downloaded from CentOS repositories
    so as to compile the code. You can obtain them by use of the “yum” command:


    sudo yum install gcc gcc-c++


    You can then configure and compile your software as follows:


    ./configure


    Make


    The process of compiling this will take some minutes, so be patient. Once the
    compilation is complete, you can install the software by running the following
    command:


    sudo make install


    If you need to verify whether the installation of Node.js was successful or not,
    just run the following command so as to check for its version:


    node –version


    The command will print the version of Node.js which has been installed into your
    system. If you see the version number, then you should know that the installation
    was successful in your case.


    Installing Node.js from Node Site


    It is possible for us to obtain the pre-built packages for Node from its official
    website and then install them. You should first obtain the link which has these
    binaries. After that, you should use this link together with the “wget” command
    so as to install the binaries. This is shown below:


    cd ~


    wget [http://nodejs.org/dist/v0.10.30/node-v0.10.30-linux-x64.tar.gz](http://nodejs.org/dist/v0.10.30/node-v0.10.30-linux-x64.tar.gz)


    Note that I first used the change directory command so as to change directory
    to the home directory. Remember that the version number in your URL must not be
    the same as the one given above as this is the latest version just for now. Just
    use it as you obtained it from the link.


    After the download is complete, we can extract the package into the local package
    hierarchy of the system by use of the “tar” command. Note that the archive is
    usually packaged in a versioned directory, and we can get rid of this by passing
    the option “--strip-components 1.” We will use the “-c” option so as to specify
    the target directory in the command. This is shown below:


    sudo tar --strip-components 1 -xzvf node-v* -C /usr/local


    Note that after running the above command, all the components will be installed
    in the “/usr/local” directory or branch of the system. To verify whether the installation
    was successful or not, we only have to check for the version of Node in our system
    by running the following command:


    node –version


    If you see the version, just know that the installation was successful, and you
    can begin to use Node.js on your CentOS server.


    Installation of Node from EPEL Repository


    The Extra Packages for Enterprise Linux (EPEL) can help us with installation of
    Node.js, and this is available for CentOS and other Linux distributions. For you
    to be granted access to the EPEL repository, the repo-list for your installation
    has to be modified. The access to this repository can also be modified by installing
    a package known as “epel-release,” and this is available in the current repos.
    The following command can help us install this package:


    sudo yum install epel-release


    This will grant you access to the EPEL repository. You can then go ahead and install
    Node.js by use of the yum command as shown below:


    sudo yum install nodejs


    The above command should install Node.js to your server, but it is good for you
    to confirm whether the installation was successful or not by running the command
    to query for the version:


    node –version


    Most people need to access the npm for the purpose of management of their packages.
    You can use the following command so as to get this from the EPEL:


    sudo yum install npm


    Installing Node Using Node Version Manager


    The node version manager (nvm) also provides us with a more flexible way for installing
    Node.js. With this tool, you can install and then maintain a number of Node repositories,
    as well as other packages which are associated with it.


    For you to install Node.js on your CentOS machine, you have to visit the project
    page on GitHub, and then copy the wget or curl command from the README file which
    will be displayed on main page. You will have obtained a pointer to the most recent
    point of the script.


    Before you can pipe the command to bash, you should first audit your script to
    ensure that it will only do what you have agreed should be done. To do this, just
    do away with the “| bash” segment which is found at the end of the curl command.
    This is shown below:


    curl [https://raw.githubusercontent.com/creationix/nvm/v0.13.1/install.sh](https://raw.githubusercontent.com/creationix/nvm/v0.13.1/install.sh)'
