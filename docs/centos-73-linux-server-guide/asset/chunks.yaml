  raw: 'When the comments are removed, you should find the following content in the
    file:


    server {


        listen       80;


        server_name  localhost;


        location / {


            root   /usr/share/nginx/html;


            index  index.html index.htm;


        }


        error_page   500 502 503 504  /50x.html;


        location = /50x.html {


            root   /usr/share/nginx/html;


        }


    }


    There are a number of changes which need to be made to our site via this file.
    The option index.php has to be added so that it can be the first value for the
    index directive so that the PHP index files can be served once a directory has
    been requested.


    The directive “server_name” should also be modified so that it can point to the
    IP address of our server or its domain name.


    Our real configuration file has some lines which have been commented out, and
    these are used for processing the error routines. We should uncomment lines so
    that we can take advantage of the functionality. For the actual PHP processing
    to take place, there is also another section which has to be uncommented. The
    “try_files” directive should also be added so that Nginx may not pass the bad
    requests to the PHP processor.


    The updated “/etc/nginx/conf.d/default.conf” configuration file should then appear
    as shown below:


    server {


        listen       80;


        server_name  server_domain_name_or_IP;


        # note that these lines are originally from the "location /" block


        root   /usr/share/nginx/html;


        index index.php index.html index.htm;


        location / {


            try_files $uri $uri/ =404;


        }


        error_page 404 /404.html;


        error_page 500 502 503 504 /50x.html;


        location = /50x.html {


            root /usr/share/nginx/html;


        }


        location ~ \.php$ {


            try_files $uri =404;


            fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;


            fastcgi_index index.php;


            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;


            include fastcgi_params;


        }


    }


    Now that you have the changes as shown above, you can save the file and then close
    it. You can use the following command to restart the Nginx and then apply the
    changes you have just made:


    sudo systemctl restart nginx


    Testing


    It is now time for us to test whether or not our system has been configured correctly.
    This calls for us to create a basic script and then use it for testing purposes.
    This script will be given the name “info.php.” For the Apache server to locate
    this file and then use it correctly, it must be kept in a certain directory, which
    is the “web root” directory. This directory can be found at “/usr/share/nginx/html/.”
     To create the file in the directory, you just have to run the following command:


    sudo vi /usr/share/nginx/html/info.php


    The above command will open the file in the vim text editor. You can then add
    the following PHP line of code to it:


    <?php phpinfo(); ?>


    Once done, just save it, and then quit the file. It is now time for us to test
    whether our server is capable of displaying the content which is coming from a
    PHP script. This can be done simply by opening the page on a web browser. The
    public IP address of the server will be needed for us to do this. Just open your
    browser, and then type the following url in the url section:


    [http://your_server_IP_address/info.php](http://your_server_IP_address/info.php)


    Note that you have to replace the above with the public IP address of your server.
    You will then see the PHP welcome page which begins as follows:


    ![](images/00004.jpeg)


    Other than the PHP version which you are using, you will also see other details
    regarding the same. It is simply the information about the server when viewed
    from the PHP. It will help you for debugging purposes and it will help you to
    be sure that all settings are they are supposed to be. If you see the above page
    in your system, you can be sure that everything is okay, meaning that you have
    succeeded in setting this up.


    However, the file puts the system at a security risk. This is because unauthorized
    users may access it and gain information regarding our server. This calls for
    us to remove this file. The following command can help us achieve this:


    sudo rm /usr/share/nginx/html/info.php


    However, in case you need to get the same information later, you can feel free
    to recreate the file and you will access the information. You will have successfully
    installed the LEMP stack on your system, and now there are number of options for
    you to select. This software can allow you to install a number of web software
    programs and websites on your system.


    # Chapter 6- Setting up RabbitMQ


    RabbitMQ is message broker software which I used for implementation of the Advanced
    Message Queuing Protocol (AMQP). It is available as an open source software program.
    This software is capable of running on a majority of the modern operating systems.
    It is possible for you to install this software in your CentOS 7.3 server. This
    can be done as outlined in the following step:


    Note that the RabbitMQ was developed by use of the Erlang programming language.
    This is why one should first install Erlang before they can install the RabbitMQ.


    Install Erlang


    Note that Erlang is just a programming language which is highly used for building
    real time systems which are massively required. Before beginning to install it,
    first execute the following commands:


    yum update


    yum install epel-release


    yum install gcc gcc-c++ glibc-devel make ncurses-devel openssl-devel autoconf
    java-1.8.0-openjdk-devel git wget wxBase.x86_64


    We don’t need to get Erlang from our official repositories, as these might have
    an old version of this. Our aim is to get the latest version, so we should download
    and then install it. Just open the official repository page for Elarng and then
    download the latest available version.


    Remember that our intention is to install the Erlang repository in a CentOS server.
    This is why the following repository has to be added:


    wget [http://packages.erlang-solutions.com/erlang-solutions-1.0-1.noarch.rpm](http://packages.erlang-solutions.com/erlang-solutions-1.0-1.noarch.rpm)


    rpm -Uvh erlang-solutions-1.0-1.noarch.rpm


    You can then run the following command so as to update the lists in the repository:


    yum update


    Run the following command so as to install Erlang:


    yum install erlang


    The above command should install Erlang into your system. However, it is good
    for you to verify and be sure that the installation was successful. To do this,
    run the following command:


    Erl


    A sample output from the command should appear as shown below:


    Erlang/OTP 18 [erts-7.3] [source-d2a6d81] [64-bit] [async-threads:10] [hipe] [kernel-poll:false]


    Eshell V7.3 (abort with ^G)


    1>


    If you see the Erlang command prompt, just know that the installation was successful.
    If you need to close this shell, just click on Ctrl + C (^C).


    We can then test whether Erlang is running as it should. Just create a file named
    “hello.erl.” Open the terminal, and run the following command


    vi hello.erl


    Add the following lines of code to your file:


    -module(hello).


    -export([hello_world/0]).


    hello_world() -> io:fwrite("hello, world!\n").


    Save your file, and then close it. Enter the Erlang shell by typing the following
    command:


    Erl


    You can then execute the following two commands:


    c(hello).


    hello:hello_world().


    Remember to add the dots at the end of the commands as shown above. Otherwise,
    you will get an error. You will get the “hello, world!” salutation printed on
    the terminal.


    Installing RabbitMQ


    Now that Erlang has been installed, we can go ahead to install RabbitMQ. Use the
    following command so as to download it:


    $ wget [https://www.rabbitmq.com/releases/rabbitmq-](https://www.rabbitmq.com/releases/rabbitmq-)   
    server/v3.6.1/rabbitmq-server-3.6.1-1.noarch.rpm


    You can then run the command given below so as to add the signing key for RabbitMQ:'
