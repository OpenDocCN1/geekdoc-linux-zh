    # Chapter 5- Lemp Setup


    LEMP (Linux, Nginx, MySQL, PHP) is a group of software (open source) which are
    installed together so as to enable the server host web apps and dynamic websites.
    The term is simply an acronym representing the Linux operating system, the ENginix
    web server which acts as a replacement for the Apache web server used in LAMP.
    The data for the site has to be stored in a MySQL database which makes use of
    MariaDB and the PHP is used for processing the dynamic content. In this chapter,
    we will be showing you how to setup this in your CentOS 7.3 server.


    ## Before we can begin the installation process, you should ensure that you have
    some non-root account which has already been setup in your server. You can then
    follow the steps given below so as to perform the installation:


    ## Installing Nginx


    For us to be able to display the web pages to the visitors of our site, we have
    to use Nginx, which is a modern and efficient web server. Remember that we discussed
    the installation of Nginx in our previous chapter. If you had not done those steps,
    just follow them again so as to install Nginx. Once the installation is complete
    and the services started, just find the IP address of your server. You will then
    be done with this step.


    ## Installing MySQL (MariaDB)


    Since our web server is now running, we can go ahead to install MariaDB, which
    is a replacement for MySQL. MAriaDb is just a community-developed fork for the
    MySQL relational database management system. It provides us with a way of accessing
    where our system can store and access information.


    This software can be obtained and installed by the use of the `yum` command. We
    will also take advantage and install some helper software which will help us facilitate
    communication between the components. Just run the following command on the terminal:


    ```bash

    sudo yum install mariadb-server mariadb

    ```


    The command will install MariaDB in our system. Once the installation is complete,
    it will be good for us to restart MariaDB. This can simply be done by executing
    the following command:


    ```bash

    sudo yum install mariadb-server mariadb

    ```


    At this point, we will have our database up and running as we expected. We can
    then go ahead and then execute a security script which will remove some of the
    defaults which endanger the system, and it will disable the access to the database
    system somehow. Just run the following command so as to launch the interactive
    script:


    ```bash

    sudo mysql_secure_installation

    ```


    You will be prompted to enter the root password. Since we have just installed
    MySQL into our system, it is more likely that you will not have the root password,
    so just leave it blank by pressing the enter key. You will then be asked whether
    you need to set up the root password. Just type Y, and then follow the instructions
    given below:


    `mysql_secure_installation` prompts:


    Enter current password for root (enter for none):


    OK, successfully used password, moving on...


    Setting the root password ensures that nobody can log into the MariaDB Root user
    without the proper authorisation.


    New password: userpass


    Re-enter new password: userpass


    Password updated successfully!


    Reloading privilege tables..


    ... Success!


    In the case of the other settings, you should accept the default values by hitting
    the enter key. With this, some sample users and databases will be removed, the
    remote logins will be disabled, and the new rules will be loaded so that the newly
    made changes will be respected by MySQL.


    With that, we should enable MariaDB to be started once the system is booted. The
    following command will help us achieve it:


    ```bash

    sudo systemctl enable mariadb

    ```


    You will have setup your database system and be ready to move on.


    ## Installing PHP


    The PHP will be responsible for processing and displaying our dynamic content.
    It is able to process our scripts, establish a connection to the MySQL database
    so as to obtain information, and this information is passed to the web server
    so that it can be displayed.


    Our `yum` system can be leveraged so that the components can be installed. The
    packages `php-mysql` and `php-fpm` will also be included. Just run the following
    command:


    ```bash besudo yum install php php-mysql php-fpm

    ```


    ## Configuring the PHP Processor


    Now that the PHP processor has been installed into our system, it will be good
    for us to go ahead and configure it so that everything can remain secure. You
    should open the php-fpm configuration file in your `vi` editor by use of root
    privileges. You just have to run the following command:


    ```bash

    sudo vi /etc/php.ini

    ```


    The file will then be opened in the `vim` editor. We are looking for the parameter
    which can be used for setting `cgi.fix_pathinfo`. You will find it has been commented
    out by use of a semicolon (`;`), and its default value has been set to `1`. This
    setting is for telling the PHP to run or execute any script which is closest if
    the PHP file fails to match exactly.


    This setting is very dangerous. With such a setting, it is possible for malicious
    users to design PHP scripts and execute them even if they are not allowed to be
    executed, hence putting our system at risk. To change this setting, we have to
    uncomment the line by removing the semicolon and then set its value to `0`. This
    is shown below:


    ```

    cgi.fix_pathinfo=0

    ```


    Once you have changed the line to the above, just save and then close the file.
    You can then go ahead and then open `www.conf`, which is the php-fpm configuration
    file. The following command will help you to open up this file in the `vi` editor:


    ```bash

    sudo vi /etc/php-fpm.d/www.conf

    ```


    You can then look for a line specifying the `listen` parameter and then change
    it so that it can be as shown below:


    ```

    listen = /var/run/php-fpm/php-fpm.sock

    ```


    Next, just look for the lines which specify the parameters `listen.owner` and
    `listen.group` and then uncomment them. After this, they should look as shown
    below:


    ```

    listen.owner = nobody

    listen.group = nobody

    ```


    You can then look for parameters which have been used for specifying the user
    and the group and then change their value from “apache” to “nginx.” This is shown
    below:


    ```

    user = nginx

    group = nginx

    ```


    You can then save the file and quit. Go ahead and run the following command so
    as to restart the PHP processor:


    ```bash

    sudo systemctl start php-fpm

    ```


    The changes which are needed will have been made. You can then go ahead and enable
    the php-fpm so that it can be started after booting up the system. You just have
    to run the command given below:


    ```bash

    sudo systemctl enable php-fpm

    ```


    ## Nginx Configuration


    At this point, we have all the necessary components installed. We should go ahead
    to configure Nginx so that it can make use of the PHP processor for processing
    of the dynamic content.


    This has to be done on the server block level. Just type the following command
    so as to open the default configuration file for the Nginx server block:


    ```bash

    sudo vi /etc/nginx/conf.d/default.conf

