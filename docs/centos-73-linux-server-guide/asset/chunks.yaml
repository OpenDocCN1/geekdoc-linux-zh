  trans: "\n当移除注释后，你应该会在文件中找到以下内容：\n\n```nginx\nserver {\n    listen       80;\n \
    \   server_name  localhost;\n    location / {\n        root  /usr/share/nginx/html;\n\
    \        index  index.html index.htm;\n    }\n    error_page  500 502 503 504\
    \  /50x.html;\n    location = /50x.html {\n        root  /usr/share/nginx/html;\n\
    \    }\n}\n```\n\n通过此文件，我们的网站需要进行许多更改。必须添加 `index.php` 选项，使其成为 `index` 指令的第一个值，这样在请求目录后就可以提供\
    \ PHP 索引文件。\n\n还应该修改 `server_name` 指令，使其能够指向我们服务器的 IP 地址或域名。\n\n我们真实的配置文件中包含一些被注释掉的行，这些行用于处理错误例程。我们应该取消这些行的注释，以便利用这些功能。为了进行实际的\
    \ PHP 处理，另一个部分也必须取消注释。应该添加 `try_files` 指令，以防止 Nginx 将错误的请求传递给 PHP 处理器。\n\n更新后的\
    \ `/etc/nginx/conf.d/default.conf` 配置文件应所示：\n\n```nginx\nserver {\n    listen\
    \       80;\n    server_name  server_domain_name_or_IP;\n    # 注意这些行最初源于 \"location\
    \ /\" 块\n    root  /usr/share/nginx/html;\n    index index.php index.html index.htm;\n\
    \    location / {\n        try_files $uri $uri/ =404;\n    }\n    error_page 404\
    \ /404.html;\n    error_page 500 502 503 504 /50x.html;\n    location = /50x.html\
    \ {\n        root /usr/share/nginx/html;\n    }\n    location ~ \\.php$ {\n  \
    \      try_files $uri =404;\n        fastcgi_pass unix:/var/run/php-fpm/php-fpm.sock;\n\
    \        fastcgi_index index.php;\n        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;\n\
    \        include fastcgi_params;\n    }\n}\n```\n\n现在你已经完成了上述所示的更改，可以保存文件并关闭。你可以使用以下命令重启\
    \ Nginx 并应用你刚刚做的更改：\n\n```bash\nsudo systemctl restart nginx\n```\n\n### 测试\n\n\
    现在是时候测试我们的系统配置是否正确了。这要求我们创建一个基础脚本并将其用于测试。该脚本将命名为 `info.php`。为了让 Apache 服务器能够定位此文件并正确使用它，它必须保存在特定的目录中，即\
    \ `web root` 目录。该目录可以在 `/usr/share/nginx/html/`找到。要在目录中创建文件，只需运行以下命令：\n\n```bash\n\
    sudo vi /usr/share/nginx/html/info.php\n```\n\n上述命令将在 `vim` 文本编辑器中打开该文件。你可以向其中添加以下\
    \ PHP 代码行：\n\n```php\n<?php phpinfo(); ?>\n```\n\n完成后，只需保存并退出文件。现在是时候测试我们的服务器是否能够显示来自\
    \ PHP 脚本的内容了。这只需通过在网络浏览器中打开页面来实现。执行此操作我们需要服务器的公 IP 地址。只需打开浏览器，然后在 URL 栏输入以下 URL：\n\
    \n`http://your_server_IP_address/info.php`\n\n注意，你必须将上述内容替换为你服务器的公 IP 地址。你将看到如下所示的\
    \ PHP 欢迎页面：\n\n![](img/00004.jpeg)\n\n除了你正在使用的 PHP 版本外，你还会看到关于它的其他细节。这仅仅是从 PHP\
    \ 视角查看的服务器信息。它将对你的调试工作有所帮助，并帮助你确保所有设置都符合预期。如果你在系统中看到上述页面，你可以确定一切正常，这意味着你已经成功设置了这些内容。\n\
    \n然而，该文件使系统面临安全风险。这是因为未经授权的用户可能会访问它并获取有关我们服务器的信息。这要求我们删除此文件。以下命令可以帮助我们实现这一目标：\n\
    \n```bash\nsudo rm /usr/share/nginx/html/info.php\n```\n\n但是，如果你以后需要获取相同的信息，可以随时重新创建该文件。\n"
- fmt: "\n```\nrpm --import https://www.rabbitmq.com/rabbitmq-signing-key-public.asc\n\
    ```\n\nYou can then run the following command so as to install the RabitMQ server:\n\
    \n```bash\nyum install rabbitmq-server-3.6.1-1.noarch.rpm\n```\n\nThe command\
    \ will give you output similar to the one given below:\n\n```\nLoaded plugins:\
    \ fastestmirror\nExamining rabbitmq-server-3.6.1-1.noarch.rpm: rabbitmq-server-3.6.1-1.noarch\n\
    Marking rabbitmq-server-3.6.1-1.noarch.rpm to be installed\nResolving Dependencies\n\
    --> Running transaction check\n---> Package rabbitmq-server.noarch 0:3.6.1-1 will\
    \ be installed\n--> Finished Dependency Resolution\nDependencies Resolved\n================================================================================\n\
    Package Arch Version Repository Size\n================================================================================\n\
    Installing:\n  rabbitmq-server noarch 3.6.1-1 /rabbitmq-server-3.6.1-1.noarch\
    \ 5.5 M\nTransaction Summary\n================================================================================\n\
    Install 1 Package\nTotal size: 5.5 M\nInstalled size: 5.5 M\nIs this ok [y/d/N]:\
    \ y\n```\n\nAs shown, once prompted, just type “y” for yes, and the installation\
    \ will continue.\n\n## Accessing the Management Console\n\nThis tool is good for\
    \ allowing you to monitor the server processes through a web browser. The RabbitMQ\
    \ management console can be enabled by executing the following command:\n\n```bash\n\
    rabbitmq-plugins enable rabbitmq_management\n```\n\nThis should then be followed\
    \ by the following command:\n\n```bash\nchown -R rabbitmq:rabbitmq /var/lib/rabbitmq/\n\
    ```\n\nYou can then launch your browser and navigate to the URL given below so\
    \ as to access the RabbitMQ server management console:\n\n`http://ip-address:15672/`\n\
    \nNote that the RabbitMQ management console comes with a default username and\
    \ password, which are “guest” and “guest.” You may also go ahead and create the\
    \ admin user if you need to have one. You only have to run the following commands:\n\
    \n```bash\nrabbitmqctl add_user admin admin\nrabbitmqctl set_user_tags admin administrator\n\
    rabbitmqctl set_permissions -p / admin \".*\" \".*\" \".*\"\n```\n\nYou can then\
    \ enter the username as well as the password so as to gain access to the RabbitMQ\
    \ web console. You will be taken to the web dashboard for RabbitMQ. You can then\
    \ begin to use your RabbitMQ server!\n\n# Chapter 7- Node.js Setup\n\nNode.js\
    \ is simply a platform for JavaScript which can be used for programming on the\
    \ server side. With this, users are able to create networked applications which\
    \ are needed for backend functionality. When JavaScript is used as the language,\
    \ both on the client and on the server side, the development process becomes much\
    \ easy and consistent. Let us discuss how we can get Node.js running on our CentOS\
    \ 7.3 server.\n\n### Installing Node from Source\n\nA simple way of getting Node.js\
    \ is getting its source code and then compiling it. The source has to be obtained\
    \ from the website of the project. Once you are on the download page, just right\
    \ click on the link for the source code and then choose “Copy link address” or\
    \ any other related option you might be given. You can then use the `wget` command\
    \ and the link on your server so as to download this as shown below:\n\n```bash\n\
    wget http://nodejs.org/dist/v0.10.30/node-v0.10.30.tar.gz\n```\n\nYou can then\
    \ extract the archive you have just downloaded and then move to your new directory.\
    \ This is shown below:\n\n```bash\ntar xzvf node-v* && cd node-v*\n```\n\nThere\
    \ will be a number of packages which should be downloaded from CentOS repositories\
    \ so as to compile the code. You can obtain them by use of the `yum` command:\n\
    \n```bash\nsudo yum install gcc gcc-c++\n```\n\nYou can then configure and compile\
    \ your software as follows:\n\n```bash\n./configure\nmake\n```\n\nThe process\
    \ of compiling this will take some minutes, so be patient. Once the compilation\
    \ is complete, you can install the software by running the following command:\n\
    \n```bash\nsudo make install\n```\n\nIf you need to verify whether the installation\
    \ of Node.js was successful or not, just run the following command so as to check\
    \ for its version:\n\n```bash\nnode –version\n```\n\nThe command will print the\
    \ version of Node.js which has been installed into your system. If you see the\
    \ version number, then you should know that the installation was successful in\
    \ your case.\n\n### Installing Node.js from Node Site\n\nIt is possible for us\
    \ to obtain the pre-built packages for Node from its official website and then\
    \ install them. You should first obtain the link which has these binaries. After\
    \ that, you should use this link together with the `wget` command so as to install\
    \ the binaries. This is shown below:\n\n```bash\ncd ~\nwget http://nodejs.org/dist/v0.10.30/node-v0.10.30-linux-x64.tar.gz\n\
    ```\n\nNote that I first used the change directory command so as to change directory\
    \ to the home directory. Remember that the version number in your URL must not\
    \ be the same as the one given above as this is the latest version just for now.\
    \ Just use it as you obtained it from the link.\n\nAfter the download is complete,\
    \ we can extract the package into the local package hierarchy of the system by\
    \ use of the `tar` command. Note that the archive is usually packaged in a versioned\
    \ directory, and we can get rid of this by passing the option `--strip-components\
    \ 1`. We will use the `-c` option so as to specify the target directory in the\
    \ command. This is shown below:\n\n```bash\nsudo tar --strip-components 1 -xzvf\
    \ node-v* -C /usr/local\n```\n\nNote that after running the above command, all\
    \ the components will be installed in the `/usr/local` directory or branch of\
    \ the system. To verify whether the installation was successful or not, we only\
    \ have to check for the version of Node in our system by running the following\
    \ command:\n\n```bash\nnode –version\n```\n\nIf you see the version, just know\
    \ that the installation was successful, and you can begin to use Node.js on your\
    \ CentOS server.\n\n### Installation of Node from EPEL Repository\n\nThe Extra\
    \ Packages for Enterprise Linux (EPEL) can help us with installation of Node.js,\
    \ and this is available for CentOS and other Linux distributions. For you to be\
    \ granted access to the EPEL repository, the `repo-list` for your installation\
    \ has to be modified. The access to this repository can also be modified by installing\
    \ a package known as `epel-release`, and this is available in the current repos.\
    \ The following command can help us install this package:\n\n```bash\nsudo yum\
    \ install epel-release\n```\n\nThis will grant you access to the EPEL repository.\
    \ You can then go ahead and install Node.js by use of the `yum` command as shown\
