    # 序言

    大多数公司和组织更加关注数据安全。这对于使用电脑的个人也是如此。Linux 服务器为你的数据提供了最好的安全保障。尽管存在安全问题，Linux 服务器还提供了极高的性能。这意味着与桌面版本的
    Linux 相比，你可以在 Linux 服务器上做很多很多事情。这就是为什么你应该熟悉如何使用 Linux 服务器。本书是关于你如何使用 CentOS 7.3
    Linux 服务器的极佳指南。它将引导你从基础步骤到设置和使用该系统中各种软件的高级步骤。祝阅读愉快！


    # 第 1 章 安装

    我们将展示如何如何在基于 UEFI 的机器上安装 CentOS 7.3。首先，通过按下特殊键（根据主板规格，按下 F1、F11 或 F12）简单进入主板 UEFI
    设置。同时，确保你已禁用 `QuickBoot/FastBoot`（快速启动）和 `Secure Boot`（安全启动）选项。


    随后可以按照以下步骤完成安装：


    1.  开始下载 CentOS 7.3 ISO 镜像。你可以通过点击 `http://isoredirect.centos.org/centos/7/isos/x86_64/CentOS-7-x86_64-DVD-1611.iso`
    找到它。下载完成后，将镜像刻录到 DVD 或直接制作一个与 UEFI 兼容的启动 USB 闪盘。这可以使用 `Rufus` 工具完成。


    只需将 USB/DVD 插入适当的主板驱动器中，然后重启机器，通过简单按下特殊功能键（根据供应商规格，按下 F12 或 F10）指示 BIOS/UEFI 从
    DVD/USB 启动。


    ISO 镜像启动后，你将在机器输出上看到第一个屏幕。你可以从菜单中选择“Install CentOS 7”（安装 CentOS 7），然后按“Enter”继续。


    ![](img/00001.jpeg)


    2. 现在镜像已加载到机器的内存中，你将看到欢迎界面。选择你需要的语言，然后点击“Continue”（继续）按钮。


    ![](img/00002.jpeg)


    3. 选择 Date and Time（日期和时间），然后从提供的地图上选择地理位置。一旦日期和时间设置正确，点击“Done”（完成）按钮即可返回安装屏幕。


    4. 按下键盘上的菜单以设置键盘布局。添加或选择键盘布局，然后点击“Done”（完成）继续。


    5. 配置或添加系统语言支持，然后点击“Done”（完成）继续。


    ![](img/00003.jpeg)


    6. 在下一步中，你将被允许通过从提供的列表中选择安全配置文件为你的系统设置“Security Policy”（安全策略）。


    你只需点击“Select profile”（选择配置文件）按钮来选择你所需的安全配置。然后你可以开启 Apply Security policy（应用安全策略）按钮。之后你可以点击“Done”（完成）按钮以继续安装。


    7. 下一步中，该通过点击“Software Selection”（软件选择）按钮为基础机器配置环境了。由于我们需要服务器，请确保你选择了将要使用的服务器类型，它将被安装。


    为了让你能够对系统进行后续的定制，只需选择“Minimal Install”（最小化安装），然后点击“Done”（完成）按钮继续。


    8. 如果你需要带有图形用户界面的服务器，在左侧窗格选择“Server with GUI”（带有 GUI 的服务器），然后从右侧面板检查正确的附加项，这将取决于你的服务器向网络客户端提供的服务。


    9. 如果你没有使用任何其他特定的网络位置，应将 Installation Source（安装源）保持默认设置。你可以点击“Installation Destination”（安装位置）来创建硬盘分区。


    在 Device selection（设备选择）屏幕上，确保你勾选了本地硬盘。


    10. 你可以点击 `KDUMP` 选项，如果需要内存则将其禁用。通过点击“Done”（完成）完成此操作，这将返回安装屏幕。


    11. 为你的机器设置主机名，然后启用网络服务。点击“Network & Hostname”（网络与主机名），在 Host Name 输入完整域名，如果存在
    DHCP 服务器，则启用网卡。


    12. 点击“Configure”（配置）按钮以手动配置网络，点击“Save”（保存）应用更改。之后你可以点击“Done”（完成）按钮，这将返回安装程序页面。


    13. 你可以检查你所做的配置，一旦确认无误，点击“Begin Installation”（开始安装）按钮以开始安装过程。


    14. 安装过程一旦开始，你将看到设置用户的新界面。点击 `ROOT PASSWORD`（根密码），为根账户创建一个非常强有密码。完成后，点击“Done”（完成）按钮返回安装屏幕。


    15. 注意，不建议从根账户使用系统。你应该通过点击“User Creation”（创建用户）创建一个新用户。输入该用户的详细信息，同时确保所有选项已启用，以便在需要登录系统时会提示输入密码。完成后，点击“Done”（完成）按钮，安装过程将完成。


    16. 你将看到安装程序报告 CentOS 已成功安装。为了能够使用此系统，只需移除安装介质并重启机器。


    17. 系统重启后，使用你的凭据登录系统，然后执行以下命令完全更新你的系统：


    ```bash

    sudo yum update

    ```


    对于包管理器向你提出的所有问题，只需回答 yes。更新完成后，重启系统以便将更改应用到内核。


    # 第 2 章 安装 Memcached


    '
- fmt: "\nMemcached is an object caching system for distributed memory which is generic\
    \ in nature and offers a high performance. It was originally developed so as to\
    \ help in speeding up the dynamic web applications simply by alleviating the database\
    \ load. This tool also has other uses.\n\nThis tool helps to do a quick deployment,\
    \ as well as an easy development, and you can use it to solve a number of problems\
    \ which are associated with large data caches. To install its package in your\
    \ CentOS 7.3 server, run the following command:\n\n```bash\nyum install memcached\n\
    ```\n\nThe command will install the package in your machine. The next step should\
    \ be for you to configure this. The most important part for you to configure is\
    \ the `CACHESIZE`. This represents the size of the cache in megabytes. This calls\
    \ for you to edit the `/etc/sysconfig/memcached` file. Consider the configuration\
    \ given below, which makes it use a size of 512 MB:\n\n```bash\nPORT=\"11211\"\
    \nUSER=\"memcached\"\nMAXCONN=\"1024\"\nCACHESIZE=\"512\"\nOPTIONS=\"\"\n```\n\
    \nStart the Memcached on your CentOS by running the following commands:\n\n```bash\n\
    systemctl start memcached.service ## restart is used after the update\nsystemctl\
    \ enable memcached.service\n```\n\nRemember that our Memcached was running on\
    \ the port number `11211`. We can use that port so as to check whether the Memcached\
    \ is running or not. This is shown below:\n\n```bash\necho stats | nc localhost\
    \ 11211\nSTAT pid 7599\nSTAT uptime 10\nSTAT time 1265288542\nSTAT version 1.4.4\n\
    STAT pointer_size 32\nSTAT rusage_user 0.003999\nSTAT rusage_system 0.052991\n\
    STAT curr_connections 10\nSTAT total_connections 11\nSTAT connection_structures\
    \ 11\nSTAT cmd_get 0\nSTAT cmd_set 0\nSTAT cmd_flush 0\nSTAT get_hits 0\nSTAT\
    \ get_misses 0\nSTAT delete_misses 0\nSTAT delete_hits 0\nSTAT incr_misses 0\n\
    STAT incr_hits 0\nSTAT decr_misses 0\nSTAT decr_hits 0\nSTAT cas_misses 0\nSTAT\
    \ cas_hits 0\nSTAT cas_badval 0\nSTAT auth_cmds 0\nSTAT auth_errors 0\nSTAT bytes_read\
    \ 6\nSTAT bytes_written 0\nSTAT limit_maxbytes 536870912\nSTAT accepting_conns\
    \ 1\nSTAT listen_disabled_num 0\nSTAT threads 4\nSTAT conn_yields 0\nSTAT bytes\
    \ 0\nSTAT curr_items 0\nSTAT total_items 0\nSTAT evictions 0\nEND\n```\n\nLet\
    \ us to get some value from this. We have to use the following command:\n\n```bash\n\
    echo get some_value | nc localhost 11211\nEND\n```\n\nNo value was found. We can\
    \ check for the statistics once again:\n\n```bash\necho stats | nc localhost 11211\n\
    STAT pid 7599\nSTAT uptime 10\nSTAT time 1265288542\nSTAT version 1.4.4\n[...]\n\
    STAT cmd_get 1\nSTAT cmd_set 0\nSTAT cmd_flush 0\nSTAT get_hits 0\nSTAT get_misses\
    \ 1\nSTAT delete_misses 0\n[...]\nSTAT evictions 0\nEND\n```\n\nThe output clearly\
    \ shows that the Memcached is running okay. We can then go ahead to use some web\
    \ application for testing the Mecached.\n\nBegin by opening the Memcached port,\
    \ that is, `11211`, on the Iptables firewall. First, list all the firewall zones\
    \ which are active. The following command will help achieve this:\n\n```bash\n\
    firewall-cmd --get-active-zones\n```\n\nYou should get an output which is closely\
    \ related to the one shown below:\n\n```\npublic\n  interfaces: wlp1s0\n```\n\n\
    A new rule should then be added to the firewalld. The following command can help\
    \ you to do this:\n\n```bash\nfirewall-cmd --permanent --zone=public --add --port=11211/tcp\n\
    ```\n\nNow that you have made some changes, you should enable them by restarting\
    \ the `firewalld.service`. The following command can help you to achieve this:\n\
    \n```bash\nsystemctl restart firewalld.service\n```\n\nYou can then use the command\
    \ given below so as to test for the remote connection:\n\n```bash\necho stats\
    \ | nc memcache_host_name_or_ip 11211\n```\n\nThe next step should involve the\
    \ installation of the Memcached PHP Module or the Memcache to your CentOS server.\
    \ The following command can help you install the Memcache module and the PHP:\n\
    \n```bash\nyum install php php-pecl-memcache\n```\n\nThe Memcached module and\
    \ the PHP can then be installed as follows:\n\n```bash\nyum install php php-pecl-memcached\n\
    ```\n\nRestart the web server by running the following command:\n\n```bash\n/etc/init.d/httpd\
    \ restart\n```\n\n## OR\n\n```bash\nservice httpd restart\n```\n\n# Chapter 3-\
    \ Installing Nginx\n\nNginx is web server software which offers a very high performance.\
    \ When compared to the Apache HTTP server, it is a bit flexible and more lightweight.\n\
    \nIn this chapter, we will show you how to install this server software on a CentOS\
    \ 73 server. For you to be able to install this, you must have root privileges\
    \ for the account you are using.\n\nThe first step should involve addition of\
    \ the Nginx repository. For you to CentOS 7 EPEL repository, just launch the terminal\
    \ and then run the following command:\n\n```bash\nsudo yum install epel-release\n\
    ```\n\nThe command will help you to install the Nginx repository into your server.\
    \ You can then run the following command so as to install the Nginx:\n\n```bash\n\
    sudo yum install nginx\n```\n\nWhen prompted for an answer, just type “yes,” and\
    \ the installation of the Nginx will be done on your virtual private server.\n\
    \nNote that once the Nginx has been installed, it will not start on its own. You\
    \ have to start it by typing the following command:\n\n```bash\nsudo systemctl\
    \ start nginx\n```\n\nYou may be using a firewall in your system. If this is the\
    \ case, there is a need for you to allow traffic from both HTTP and HTTPS protocols.\
    \ This can be achieved by executing the command given below:\n\n```bash\nsudo\
    \ firewall-cmd --permanent --zone=public --add-service=http\nsudo firewall-cmd\
    \ --permanent --zone=public --add-service=https\nsudo firewall-cmd –reload\n```\n\
    \nA spot check will be good for you to be sure that everything is running as you\
    \ expected. You just have to visit the public IP address of your server in the\
    \ web browser. If you are not aware of the IP address, look for the way to know\
    \ it.\n\n[http://server_domain_name_or_IP/](http://server_domain_name_or_IP/)\n\
    \nThe default web page for the CentOS 7 Nginx will be opened. This is usually\
    \ provided to give you all the necessary information. If you see the welcome page,\
    \ just know that the server is okay and running.\n\nIt will also be good for you\
    \ to enable the Nginx so that it can start automatically once the system is booted.\
    \ You just have to run the following command:\n\n```bash\nsudo systemctl enable\
    \ nginx\n```\n\nYou will have installed the Nginx and it is now running.\n\n Finding\
    \ the IP Address of Your Server\n\nTo know the IP address of your server, begin\
    \ by looking for the network interfaces of your machine simply by executing the\
    \ following command:\n\n```bash\nip addr\n```\n\nIn my case, I get the following:\n\
    \n```\n1\\. lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN\n\
    . .\n2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state\
    \ UP qlen 1000\n. .\n```\n\nThe number of interfaces shown in this case will be\
    \ determined by the hardware number that you have on your machine. The interface\
    \ named `lo` represents the loopback interface, but we are not interested in this\
    \ interface. However, the interface `eth0` represents the Ethernet interface,\
    \ and this is what we are interested in.\n\nNow that you are aware of the interface\
    \ name, there is a command which you can run so that you may know the IP address\
    \ of your server. This is shown below:\n\n```bash\nip addr show eth0 | grep inet\
    \ | awk '{ print $2; }' | sed 's/\\/.*$//\n```\n\nFor you to start serving own\
    \ application or pages through the Nginx, you have to know where the default server\
    \ root directory and the Nginx configuration files are located.\n\nYour default\
    \ server root directory should be in the `/usr/share/nginx/html` location. Any\
    \ files which are placed in the directory have to be served on the web server.\
    \ Such a location has to be specified in in default server block configuration\
    \ file which comes with the Nginx, and this can be found in the `/etc/nginx/conf.d/default.conf`\
    \ directory.\n\nOther additional server blocks, which are referred to as the Virtual\
    \ Hosts in Apache, may be added by having to create some new configuration files\
    \ in the `/etc/nginx/conf.d`. Any file which `.conf` in this directory will have\
    \ to be loaded at the time the Nginx is being started.\n"
  raw: 'Memcached is an object caching system for distributed memory which is generic
    in nature and offers a high performance. It was originally developed so as to
    help in speeding up the dynamic web applications simply by alleviating the database
    load. This tool also has other uses.


    This tool helps to do a quick deployment, as well as an easy development, and
    you can use it to solve a number of problems which are associated with large data
    caches. To install its package in your CentOS 7.3 server, run the following command:


    yum install memcached


    The command will install the package in your machine. The next step should be
    for you to configure this. The most important part for you to configure is the
    CACHESIZE. This represents the size of the cache in megabytes. This calls for
    you to edit the /etc/sysconfig/memcached file. Consider the configuration given
    below, which makes it use a size of 512 MB:


    PORT="11211"


    USER="memcached"


    MAXCONN="1024"


    CACHESIZE="512"


    OPTIONS=""


    Start the Memcached on your CentOS by running the following commands:


    systemctl start memcached.service ## restart is used after the update


     systemctl enable memcached.service


    Remember that our Memcached was running on the port number 11211\. We can use
    that port so as to check whether the Memcached is running or not. This is shown
    below:


    echo stats | nc localhost 11211


    STAT pid 7599


    STAT uptime 10


    STAT time 1265288542


    STAT version 1.4.4


    STAT pointer_size 32


    STAT rusage_user 0.003999


    STAT rusage_system 0.052991


    STAT curr_connections 10


    STAT total_connections 11


    STAT connection_structures 11


    STAT cmd_get 0


    STAT cmd_set 0


    STAT cmd_flush 0


    STAT get_hits 0


    STAT get_misses 0


    STAT delete_misses 0


    STAT delete_hits 0


    STAT incr_misses 0


    STAT incr_hits 0


    STAT decr_misses 0


    STAT decr_hits 0


    STAT cas_misses 0


    STAT cas_hits 0


    STAT cas_badval 0


    STAT auth_cmds 0


    STAT auth_errors 0


    STAT bytes_read 6


    STAT bytes_written 0


    STAT limit_maxbytes 536870912


    STAT accepting_conns 1


    STAT listen_disabled_num 0


    STAT threads 4


    STAT conn_yields 0


    STAT bytes 0


    STAT curr_items 0


    STAT total_items 0


    STAT evictions 0


    END


    Let us to get some value from this. We have to use the following command:


    echo get some_value | nc localhost 11211


    END


    No value was found. We can check for the statistics once again:


    echo stats | nc localhost 11211


    STAT pid 7599


    STAT uptime 10


    STAT time 1265288542


    STAT version 1.4.4


    [...]


    STAT cmd_get 1


    STAT cmd_set 0


    STAT cmd_flush 0


    STAT get_hits 0


    STAT get_misses 1


    STAT delete_misses 0


    [...]


    STAT evictions 0


    END


    The output clearly shows that the Memcached is running okay. We can then go ahead
    to use some web application for testing the Mecached.


    Begin by opening the Memcached port, that is, 11211, on the Iptables firewall.
    First, list all the firewall zones which are active. The following command will
    help achieve this:


    firewall-cmd --get-active-zones


    You should get an output which is closely related to the one shown below:


    public


      interfaces: wlp1s0


    A new rule should then be added to the firewalld. The following command can help
    you to do this:


    firewall-cmd --permanent --zone=public --add --port=11211/tcp


    Now that you have made some changes, you should enable them by restarting the
    firewalld.service. The following command can help you to achieve this:


    systemctl restart firewalld.service


    You can then use the command given below so as to test for the remote connection:


    echo stats | nc memcache_host_name_or_ip 11211


    The next step should involve the installation of the Memcached PHP Module or the
    Memcache to your CentOS server. The following command can help you install the
    Memcache module and the PHP:


    yum install php php-pecl-memcache


    The Memcached module and the PHP can then be installed as follows:


    yum install php php-pecl-memcached


    Restart the web server by running the following command:


    /etc/init.d/httpd restart


    ## OR ##


    service httpd restart


    # Chapter 3- Installing Nginx


    Nginx is web server software which offers a very high performance. When compared
    to the Apache HTTP server, it is a bit flexible and more lightweight.


    In this chapter, we will show you how to install this server software on a CentOS
    73 server. For you to be able to install this, you must have root privileges for
    the account you are using.


    The first step should involve addition of the Nginx repository. For you to CentOS
    7 EPEL repository, just launch the terminal and then run the following command:


    sudo yum install epel-release


    The command will help you to install the Nginx repository into your server. You
    can then run the following command so as to install the Nginx:


    sudo yum install nginx


    When prompted for an answer, just type “yes,” and the installation of the Nginx
    will be done on your virtual private server.


    Note that once the Nginx has been installed, it will not start on its own. You
    have to start it by typing the following command:


    sudo systemctl start nginx


    You may be using a firewall in your system. If this is the case, there is a need
    for you to allow traffic from both HTTP and HTTPS protocols. This can be achieved
    by executing the command given below:


    sudo firewall-cmd --permanent --zone=public --add-service=http


    sudo firewall-cmd --permanent --zone=public --add-service=https


    sudo firewall-cmd –reload


    A spot check will be good for you to be sure that everything is running as you
    expected. You just have to visit the public IP address of your server in the web
    browser. If you are not aware of the IP address, look for the way to know it.


    [http://server_domain_name_or_IP/](http://server_domain_name_or_IP/)


    The default web page for the CentOS 7 Nginx will be opened. This is usually provided
    to give you all the necessary information and help you do the testing. If you
    see the welcome page, just know that the server is okay and running well.


    It will also be good for you to enable the Nginx so that it can start automatically
    once the system is booted. You just have to run the following command:


    sudo systemctl enable nginx


    You will have installed the Nginx and it is now running.


    Finding the IP Address of Your Server


    To know the IP address of your server, begin by looking for the network interfaces
    of your machine simply by executing the following command:


    ip addr


    In my case, I get the following:


    1\. lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN


    . . .


    2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state UP
    qlen 1000


    . . .


    The number of interfaces shown in this case will be determined by the hardware
    number that you have on your machine. The interface named “lo” represents the
    loopback interface, but we are not interested in this interface. However, the
    interface “eth0” represents the Ethernet interface, and this is what we are interested
    in.


    Now that you are aware of the interface name, there is a command which you can
    run so that you may know the IP address of your server. This is shown below:


    ip addr show eth0 | grep inet | awk ''{ print $2; }'' | sed ''s/\/.*$//''


    For you to start serving own application or pages through the Nginx, you have
    to know where the default server root directory and the Nginx configuration files
    are located.


    Your default server root directory should be in the /usr/share/nginx/html location.
    Any files which are placed in the directory have to be served on the web server.
    Such a location has to be specified in in default server block configuration file
    which comes with the Nginx, and this can be found in the “/etc/nginx/conf.d/default.conf”
    directory.


    Other additional server blocks, which are referred to as the Virtual Hosts in
    Apache, may be added by having to create some new configuration files in the /etc/nginx/conf.d.
    Any file which .conf in this directory will have to be loaded at the time the
    Nginx is being started.'
