    nvm install v0.11.12

    ```


    如果你需要切换到不同的 `nvm` 版本，可以使用以下命令：


    ```bash

    nvm use version_number

    ```


    你需要在上述命令中替换版本号。如果你需要将特定版本设置为默认版本，只需运行以下命令：


    ```bash

    nvm alias default v0.101.12

    ```


    如果你需要验证安装过程是否运行成功，只需像我们一直以来所做的那样，通过运行命令来检查系统中的可用版本即可。如下所示：


    ```bash

    node –version

    ```


    正如你所看到的，有多种方法可以使用 Node.js 来运行你的 CentOS 服务器！


    # 结论


    我们已经来到了本指南的末尾。CentOS 7.3 服务器可以执行许多任务。例如，你可以用它来安装包含 `Nginx` 和 PHP 的 LEMP 栈。如果你想使用
    CentOS 7.3 服务器开发 Web 应用程序，这些都是很好的工具。你还可以在 CentOS 服务器上安装 `MariaDB`，它可以与 CentOS
    服务器中的 `MySQL` 配合。


    这将为你提供一个存储数据和信息的环境。你还可以在 CentOS 服务器上安装 `Memcached`，这将帮助你加速 Web 应用程序。正如本书中所讨论的，NoSQL
    数据库 `MongoDB` 也可以安装在 CentOS 中。如果你不喜欢 `MySQL` 数据库，它也可以提供一种存储数据的方式。


    如果你需要在 CentOS 服务器上进行一些服务器端脚本编写，你可以安装 `Node.js` 来帮助你实现这一目标。

