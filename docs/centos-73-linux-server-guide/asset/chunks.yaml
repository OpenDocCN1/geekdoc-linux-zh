    # Introduction

    Most companies and organizations are more concerned about the security of the
    data. This also applies to individuals who use computers. Linux servers offer
    you the best kind of security for your data. Despite the issue of security, Linux
    servers also offer you a high rate of performance. This means that there is much
    that you can do with your Linux server compared to what you can do with the desktop
    versions of Linux. This is why you should familiarize yourself with how to use
    the Linux servers. This book is an excellent guide for you on how to use the CentOS
    73 Linux server. It guides you from the basic steps to the most advanced steps
    of setting up and using the various software in this system. Enjoy reading!


    # Chapter 1- Installation

    We will show how you can install the CentOS 7.3 on a machine which is based on
    UEFI. Begin by entering the motherboard UEFI settings simply by pressing the special
    key (either F1, F11, or F12 based on the specifications of your motherboard).
    Also, ensure that you have disabled the options for `QuickBoot/FastBoot` and `Secure
    Boot`.


    The installation can then be done by following the steps given below:


    1. Begin by downloading the CentOS 7.3 ISO image. You can find this by clicking
    `http://isoredirect.centos.org/centos/7/isos/x86_64/CentOS-7-x86_64-DVD-1611.iso`.
    Once the download is complete, burn the image to a DVD or just makes a bootable
    USB Drive which is compatible with UEFI. This can be done by use of the `Rufus`
    utility.


    Just put the USB/DVD in an appropriate motherboard drive, and then reboot the
    machine and instruct BIOS/UEFI to boot-up from DVD/USB simply by pressing the
    special function key (either F12 or F10 based on specifications of the vendor).


    After the ISO image has booted, you will see the first screen on the machine output.
    You can choose “Install CentOS 7” from the menu and then hit “Enter” so as to
    continue.


    ![](images/00001.jpeg)


    2. Now that the image has been loaded into the RAM of the machine, you will see
    the welcome screen. Choose the language which you need to use, and then click
    on the “Continue” button.


    ![](images/00002.jpeg)


    3. Choose the Date and Time, and then select the geographical location from the
    provided map. Once the date and time are set to the correct ones, click on the
    “Done” button so that you can be taken back to the installations screen.


    4. Hit on the keyboard menu so as to setup the layout for the keyboard. Add or
    choose a keyboard layout, and then click on “Done” so as to continue.


    5. Configure or add the system language support, and then click on “Done” so as
    to continue.


    ![](images/00003.jpeg)


    6. In the next step, you will be allowed to setup the “Security Policy” for your
    system by selecting a security profile from the provided list.


    You just have to click on the “Select profile” button so as to choose the security
    profile which you desire. You can then turn ON your Apply Security policy button.
    You can then click on the “Done” button so as to proceed with the installation.


    7. In the next step, it will be time for you to configure the environment for
    the base machine by clicking on the “Software Selection” button. Since we need
    a server, ensure that you choose the kind of server which you will need to be
    using and it will be installed.


    For you to be able to do a subsequent customization of your system, just choose
    “Minimal Install,” and then click on the “Done” button so as to proceed.


    8. If you need to get a server with a Graphical User Interface, select “Server
    with GUI” which can be found on the left pane and then check for the right add-ons
    from the right panel, and this will be determined by the services which your server
    will be offering to the network clients.


    9. If you are not using any other specific network locations, you should leave
    Installation Source as the default. You can then click on the “Installation Destination”
    so as to create the hard disk partitions.


    On the screen for Device selection, ensure that you have checked the local machine
    hard disk.


    10. You can click on the `KDUMP` option, and then disable it if you are in need
    of some free RAM in the system. Finish this by clicking on the “Done” button,
    and you will be taken back to the installation screen.


    11. Set the hostname for your machine, and then enable the network service. Click
    on “Network & Hostname,” and type the Fully Qualified Domain Name for your system
    on the Host Name, and then activate the network interface by turning the Ethernet
    button to ON if there is a DHCP server in the LAN.


    12. Click on the “Configure” button so as to statically configure the network,
    add the IP settings manually. Apply the changes made by clicking on the “Save”
    button. You can then click on the “Done” button, and you will be taken back to
    the installer page.


    13. You can then review all the configurations which you have made, and once you
    are sure everything is okay, click on the “Begin Installation” button so that
    the installation process can begin.


    14. Once the process of installation has started, you will get to see a new screen
    for setting up the users. Click on `ROOT PASSWORD`, and create a very strong password
    for the root account. Once done, click on the “Done” button so that you can get
    back to the installation screen.


    15. Note that it is not advisable for you to use your system from the root account.
    You should create some new user by clicking on the “User Creation” button. Enter
    the details for this new user, while ensuring that all the options are enabled
    so that you may be prompted to enter a password whenever you need to log into
    the system. Once done, click on the “Done” button and the installation process
    will be completed.


    16. You will then see the installer reporting that the CentOS have been successfully
    installed. For you to be able to use this system, just remove the installation
    media and then reboot your machine.


    17. Once the system reboots, use your credentials so as to log into the system,
    and then execute the following command so as to update your system fully:


    ```bash

    sudo yum update

    ```


    For all the questions you will be asked by the package manager, just answer with
    yes. Once the update has been done, just reboot your system so that the changes
    can be applied to the kernel.


