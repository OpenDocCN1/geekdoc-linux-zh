    You should look at it closely and ensure that you are much comfortable with the
    changes which you have just made. If you become satisfied, just go ahead and then
    append the `| bash` to your command. The URL should change, based on the version
    which you are installing, so don’t worry in case you spot a difference in this:


    ```bash

    curl https://raw.githubusercontent.com/creationix/nvm/v0.13.1/install.sh | bash

    ```


    With the above command, the `nvm` script for the user account will be installed.
    The `.bash_profile` should be sourced so that you can begin to use this. This
    can be done as follows:


    ```bash

    source ~/.bash_profile

    ```


    You can then run the following command so as to ask the `nvm` of the Node versions
    which it is aware of:


    ```bash

    nvm list-remote

    ```


    A sample output from the above command is given below:


    ```

    . . .

    v0.10.29

    v0.10.30

    v0.11.0

    v0.11.1

    v0.11.2

    v0.11.3

    v0.11.4

    v0.11.5

    v0.11.6

    v0.11.7

    v0.11.8

    v0.11.9

    v0.11.10

    v0.11.11

    v0.11.12

    v0.11.1

    ```


    The choice is yours on the version of Node which you want to install. If you need
    to install version number `v0.11.12`, you just have to type the command given
    below:


    ```bash

    nvm install v0.11.12

    ```


    If you need to change to a different version of the `nvm`, you can use the following
    command:


    ```bash

    nvm use version_number

    ```


    You should substitute the version number in the above command. If you need to
    set a particular version to be the default one, just run the following command:


    ```bash

    nvm alias default v0.101.12

    ```


    If you need to verify whether the installation process ran successfully, you just
    have to do what we have been doing by running the command to check for the available
    version in your system. This is shown below:


    ```bash

    node –version

    ```


    As you have seen, there are a number of ways that you can use Node.js to run your
    CentOS server machine!


    # Conclusion


    We have come to the end of this guide. CentOS 7.3 server can be used for performing
    a number of tasks. For instance, you can use it to install the LEMP stack which
    features `Nginx` and PHP. These are good tools for you if you want to develop
    web applications using your CentOS 7.3 server. It is also possible for you to
    install `MariaDB`, which works with `MySQL` in your CentOS server.


    This will provide you with an environment for storing your data and information.
    You can also install `Memcached` in your CentOS server, and this will help you
    to speed up your web applications. `MongoDB`, which is a NoSQL database, can also
    be installed in CentOS, as discussed in this book. It can also provide you with
    a way of storing your data if you don’t like the `MySQL` database.


    If you need to do some server-side scripting on your CentOS sever, you can install
    `Node.js`, which will help you accomplish this.

