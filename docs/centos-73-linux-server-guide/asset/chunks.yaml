    The main configuration file for the Nginx can be found in `/etc/nginx/nginx.conf`.
    Settings should be changed from here, such as the user who is allowed to execute
    the Nginx daemon processes, and the worker processes number which will get spawned
    when the Nginx is running.


    # Chapter 4- Setting up MongoDB


    MongoDb is a NoSQL database, but it is document oriented. It is used for storing
    documents which are the same as JSON in terms of their structure. It offers a
    high performance and it scales well. In this chapter, we will show you how to
    install this in your CentOS 7.3 server:


    ## Adding the Repository


    The default state is that there is no MongoDB repository in the CentOS. This is
    why this should be added to the local machine. Begin by opening the file `/etc/yum.repos.d/mongodb-org.repo`
    in a text editor such as `VIM`. Just execute the following command:


    ```bash

    vi /etc/yum.repos.d/mongodb-org.repo

    ```


    This will give you the following output:


    ```text

    [mongodb-org-3.2]

    name=MongoDB Repository

    baseurl=https://repo.mongodb.org/yum/redhat/$releasever/mongodb-org/3.2/x86_64/

    gpgcheck=1

    enabled=1

    gpgkey=https://www.mongodb.org/static/pgp/server-3.2.asc

    ```


    Make sure that your file looks as shown above. Once the repository has been added
    to the local machine, we have to update the system so that our `yum` command can
    pull and check for the repository information. Just run the `yum update` command
    as shown below:


    ```bash

    yum update

    ```


    Output:


    ```text

    Loaded plugins: fastestmirror

    base                            | 3.6 kB            00:00

    extras                          | 3.4 kB            00:00

    mongodb-org-3.2                 | 2.5 kB            00:00

    updates                         | 3.4 kB            00:00

    mongodb-org-3.2/7/primary_db    | 54 kB             00:01

    Determining fastest mirrors

    * base: mirror.dhakacom.com

    * extras: mirror.dhakacom.com

    * updates: mirror.dhakacom.com

