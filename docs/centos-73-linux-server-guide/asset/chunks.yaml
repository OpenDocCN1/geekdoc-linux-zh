  trans: "\nMemcached 是一个用于分布式内存的对象缓存系统，本质上是通用的且提供高性能。它最初被开发是为了通过简单减轻数据库负载来帮助加速动态\
    \ Web 应用程序。该工具也有其他用途。\n\n该工具有助于快速部署以及易于开发，你可以用它来解决许多与大数据缓存相关的问题。若要在您的 CentOS 7.3\
    \ 服务器上安装其包，请运行以下命令：\n\n```bash\nyum install memcached\n```\n\n该命令将在您的机器上安装该包。下一步您应该对其进行配置。您需要配置的最部分是\
    \ `CACHESIZE`。它代表以兆字节（MB）为单位的缓存大小。这需要编辑 `/etc/sysconfig/memcached` 文件。考虑下面的配置，它使其使用\
    \ 512 MB 的大小：\n\n```bash\nPORT=\"11211\"\nUSER=\"memcached\"\nMAXCONN=\"1024\"\
    \nCACHESIZE=\"512\"\nOPTIONS=\"\"\n```\n\n运行以下命令在您的 CentOS 上启动 Memcached：\n\n\
    ```bash\nsystemctl start memcached.service ## 更新后使用 restart\nsystemctl enable\
    \ memcached.service\n```\n\n请记住我们的 Memcached 运行在端口 `11211`。我们可以使用该端口来检查 Memcached\
    \ 是否正在运行。显示所示：\n\n```bash\necho stats | nc localhost 11211\nSTAT pid 7599\nSTAT\
    \ uptime 10\nSTAT time 1265288542\nSTAT version 1.4.4\nSTAT pointer_size 32\n\
    STAT rusage_user 0.003999\nSTAT rusage_system 0.052991\nSTAT curr_connections\
    \ 10\nSTAT total_connections 11\nSTAT connection_structures 11\nSTAT cmd_get 0\n\
    STAT cmd_set 0\nSTAT cmd_flush 0\nSTAT get_hits 0\nSTAT get_misses 0\nSTAT delete_misses\
    \ 0\nSTAT delete_hits 0\nSTAT incr_misses 0\nSTAT incr_hits 0\nSTAT decr_misses\
    \ 0\nSTAT decr_hits 0\nSTAT cas_misses 0\nSTAT cas_hits 0\nSTAT cas_badval 0\n\
    STAT auth_cmds 0\nSTAT auth_errors 0\nSTAT bytes_read 6\nSTAT bytes_written 0\n\
    STAT limit_maxbytes 536870912\nSTAT accepting_conns 1\nSTAT listen_disabled_num\
    \ 0\nSTAT threads 4\nSTAT conn_yields 0\nSTAT bytes 0\nSTAT curr_items 0\nSTAT\
    \ total_items 0\nSTAT evictions 0\nEND\n```\n\n让我们从中获取一些值。我们必须使用以下命令：\n\n```bash\n\
    echo get some_value | nc localhost 11211\nEND\n```\n\n没有找到任何值。我们可以再次检查统计信息：\n\n\
    ```bash\necho stats | nc localhost 11211\nSTAT pid 7599\nSTAT uptime 10\nSTAT\
    \ time 1265288542\nSTAT version 1.4.4\n[...]\nSTAT cmd_get 1\nSTAT cmd_set 0\n\
    STAT cmd_flush 0\nSTAT get_hits 0\nSTAT get_misses 1\nSTAT delete_misses 0\n[...]\n\
    STAT evictions 0\nEND\n```\n\n输出清楚地显示 Memcached 运行正常。我们可以继续使用某些 Web 应用程序来测试 Memcached。\n\
    \n首先在 Iptables 防火墙上打开 Memcached 端口，即 `11211`。首先，列出所有激活的防火墙区域。以下命令将有助于实现：\n\n```bash\n\
    firewall-cmd --get-active-zones\n```\n\n您应该得到一个与所示密切相关的输出：\n\n```\npublic\n  interfaces:\
    \ wlp1s0\n```\n\n然后应该向 firewalld 添加一条新规则。以下命令可以帮助您完成此：\n\n```bash\nfirewall-cmd\
    \ --permanent --zone=public --add --port=11211/tcp\n```\n\n现在您已经做了一些更改，应该通过重启\
    \ `firewalld.service` 来启用它们。以下命令可以帮助您实现这一点：\n\n```bash\nsystemctl restart firewalld.service\n\
    ```\n\n然后您可以使用提供的命令测试远程连接：\n\n```bash\necho stats | nc memcache_host_name_or_ip\
    \ 11211\n```\n\n下一步应该涉及向您的 CentOS 服务器安装 Memcached PHP 模块或 Memcache。以下命令可以帮助您安装\
    \ Memcache 模块和 PHP：\n\n```bash\nyum install php php-pecl-memcache\n```\n\nMemcached\
    \ 模块和 PHP 然后可以如下所示安装：\n\n```bash\nyum install php php-pecl-memcached\n```\n\n\
    运行以下命令重启 Web 服务器：\n\n```bash\n/etc/init.d/httpd restart\n```\n\n## 或者\n\n```bash\n\
    service httpd restart\n```\n\n# 第 3 章 安装 Nginx\n\nNginx 是一种提供极高性能的 Web 服务器软件。与\
    \ Apache HTTP 服务器相比，它更灵活且更轻量级。\n\n在本章中，我们将向您展示如何在 CentOS 73 服务器上安装此服务器软件。为了能够安装此软件，您必须对使用的账户拥有\
    \ root 权限。\n\n第一步涉及添加 Nginx 仓库。要获取 CentOS 7 EPEL 仓库，只需启动终端并运行以下命令：\n\n```bash\n\
    sudo yum install epel-release\n```\n\n该命令将帮助您将 Nginx 仓库安装到服务器中。然后您可以运行以下命令来安装\
    \ Nginx：\n\n```bash\nsudo yum install nginx\n```\n\n在提示回答时，只需输入“yes”，Nginx 的安装将在您的私有服务器上完成。\n\
    \n注意，一旦 Nginx 安装完成，它不会自动启动。您必须通过输入以下命令启动它：\n\n```bash\nsudo systemctl start nginx\n\
    ```\n\n您可能在系统中使用防火墙。如果是这样，则需要您允许来自 HTTP 和 HTTPS 协议的流量。这可以通过执行提供的命令来实现：\n\n```bash\n\
    sudo firewall-cmd --permanent --zone=public --add-service=http\nsudo firewall-cmd\
    \ --permanent --zone=public --add-service=https\nsudo firewall-cmd –reload\n```\n\
    \n进行抽检检查对您很有好处，可以确保一切都按照预期运行。您只需要在 Web 浏览器中访问服务器的公网 IP 地址。如果您不知道 IP 地址，请查找获取它的方法。\n\
    \n[`server_domain_name_or_IP/`](http://server_domain_name_or_IP/)\n\nCentOS 7\
    \ Nginx 的默认 Web 页面将打开。这通常是为了向您提供所有必要的信息。如果您看到欢迎页面，只需知道服务器是正常且运行的即可。\n\n启用 Nginx\
    \ 对您来说也有好处，这样它可以在系统启动时自动启动。您只需要运行以下命令：\n\n```bash\nsudo systemctl enable nginx\n\
    ```\n\n您已安装了 Nginx，它现在正在运行。\n\n 查找您的服务器的 IP 地址\n\n要了解服务器的 IP 地址，首先通过简单执行以下命令查找机器的网络接口：\n\
    \n```bash\nip addr\n```\n\n在我的情况下，我得到了以下：\n\n```\n1\\. lo: <LOOPBACK,UP,LOWER_UP>\
    \ mtu 65536 qdisc noqueue state UNKNOWN\n. .\n2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP>\
    \ mtu 1500 qdisc pfifo_fast state UP qlen 1000\n. .\n```\n\n在这种情况下显示的接口数量将取决于您机器上的硬件数量。名为\
    \ `lo` 的接口代表环回接口，但我们对这个接口并不感兴趣。然而，`eth0` 代表以太网接口，这正是我们感兴趣的。\n\n现在您已经知道了接口名称，有一个命令可以运行，以便您可以知道服务器的\
    \ IP 地址。显示所示：\n\n```bash\nip addr show eth0 | grep inet | awk '{ print $2; }'\
    \ | sed 's/\\/.*$//\n```\n\n为了通过 Nginx 开始为自己的应用程序或页面提供服务，您必须知道默认服务器根目录和 Nginx\
    \ 配置文件的位置。\n\n您的默认服务器根目录应该在 `/usr/share/nginx/html` 位置。放置在该目录中的任何文件都必须由 Web 服务器提供。此类位置必须在随\
    \ Nginx 附的默认服务器块配置文件中指定，这可以在 `/etc/nginx/conf.d/default.conf` 目录中找到。\n\n其他额外的服务器块（在\
    \ Apache 中称为虚拟主机）可以通过通过在 `/etc/nginx/conf.d` 中创建一些新配置文件来添加。此目录中以 `.conf` 结尾的任何文件将在\
    \ Nginx 启动时加载。\n"
