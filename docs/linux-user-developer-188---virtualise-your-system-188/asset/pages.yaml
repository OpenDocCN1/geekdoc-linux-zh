  md: '# Fit for purpose


    The design required that all the wiring inside the wall and the back box. To take
    this project off the ground you can either run Cat 5 cabling through walls (or
    you can run Cat 5 through yourself) and be confident in quality of your electric
    cabling or if in any doubt at all, consult a qualified electrician!


    # Flush fit


    To make the touchscreen flush to the wall without a gap, Peter used a custom-inch
    back box ''electrical'' or ''remodel'' box in the US. He 3D-printed bezel covers
    the edge of the Raspberry Pi touchscreen and to hide the box behind it.


    # Components list


    +   - Raspberry Pi 3 Model B

    - MicroSD card

    - 7-inch touchscreen

    - Carton B335R 3-gang back/electrical box

    - M3-screws

    - 4 back box screws (3/4-inch)


    ![](img/47c577d3c443392bbdb486d8e17c4a70_68_0.png)


    +   - Option 1: Using Power over Ethernet (PoE) by running Cat 5 cable to the
    electrical box

    - A PoE injector or PoE switch

    - Option 2: Tying into 120 volt AC (VAC) power system of a US house. (Note: The
    UK uses 230V and we advise using option 1 unless you''re an electrician.)

    - Micro-USB cable with

    - Apple or 12W USB adaptor (or a USB adapter that puts out at least 2.1A)

    - A C extension cable


    ![](img/47c577d3c443392bbdb486d8e17c4a70_68_1.png)


    # Tough fit


    Peter had to fight for every inch in his design, so he used jumper cables to connect
    the Raspberry Pi 3 to the touchscreen after fitting. Instead, he used angled-fibers
    directly into the adaptor.


    ![](img/47c577d3c443392bbdb486d8e17c4a70_68_2.png)


    # Snug fit


    Peter used strips of electrical tape to give the tabs on the bezel more grip when
    he slid the tabs into the corresponding slots on the facade. He then fixed the
    bezel to the touchscreen with M3 screws.


    ![](img/47c577d3c443392bbdb486d8e17c4a70_68_3.png)


    ![](img/47c577d3c443392bbdb486d8e17c4a70_68_4.png)


    ![](img/47c577d3c443392bbdb486d8e17c4a70_68_5.png)


    ![](img/47c577d3c443392bbdb486d8e17c4a70_68_6.png)


    Above Peter is a fan of the affordable Raspberry Pi 7-inch touchscreen but mounting
    it to the wall and powering it without wires having gone out to be a challenge.
    This led him to run Rome cable while making a partition for the box. Although
    he used a USB transformer from the Pi and touchscreen by 3D-printing a part for
    the box, he was worried about high voltage is not for the inienced. Unless you
    are not an electrician, we''d recommend using some Power over Ethernet for what''s
    pictured above. Subsequentially, this is what Peter has done for his own project.
    Consider yourself warned.


    After Peter attached a PoE splitter to the box with 5 screws, which gave him an
    Ethernet cable and a Micro-USB port for connecting the Pi for network access,
    the splitter was too thick to be turned inside the small box, so he had to make
    an extension. Once he pushed all the wires into the box, connected the splitter
    and provided power over Ethernet, his touchscreen was connected and ready to go.'
