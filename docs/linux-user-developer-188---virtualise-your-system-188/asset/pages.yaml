    \ {\n buttonPressed = 1;\n playBack = 0;\n}\n```\n\nIt's not the job of the ISR\
    \ to do anything. Instead, the program will be executed, it picks up where it\
    \ left off, and then it knows that the state of the device has changed. In this\
    \ project, it would exit the function, return to the top of (Loop) - and then\
    \ go again and call the updateState() function to determine which button has been\
    \ pressed. The Arduino will check the flags and the pseudo-Dichotope should operate\
    \ in order, or cycle to the next or previous file, depending on what you programmed\
