  md: '# Prepare the LCD


    To make the device easy for the user to operate, it is worth integrating a text-based
    LCD. They are relatively cheap to operate under £2 including shipping, and they
    are very easy to operate thanks to the LiquidCrystal library. Take the ''Hello
    World'' example - it is essentially four commands. The only drawback with an LCD
    is the number of wires it requires to operate: four for data, three for settings,
    and two for the backlight, making a total of nine pins to connect to the Arduino''s
    digital pins. On an Uno or a Mega, this can take up much of the space for a project.
    LCDs, however, are generally worth the user with information about the device
    without needing to hook it to a computer.


    Connect wires to each LCD outputs. If correctly provided, you might be able to
    get away with soldering the wires tightly but if you''re using a soldering iron
    in the process, fix them in place. Before connecting to the Arduino, rotate the
    LCD so that the connections are aligned and to the left of the display so that
    the following instructions are made:


    +   You''ll need to connect the two rightmost pins to ground, and the second pin
    from both sides to 5V (VRS and VDD) for the backlight. The pin on the left, which
    controls the contrast, should be connected to the wiper of a potentiometer. The
    next three pins are RS, RW, and E to interface with the built-in LCD. RW can go
    to ground, leaving the LCD in write-mode permanently, with RS and E to be controlled
    by the ''select'' and ''write'' edges respectively). Finally, you come the data.
    For more displays there will be eight data lines left to connect, which also need
    to be connected to the Arduino. For an 8-bit LCD, you can then operate the screen
    using the four data pins.


    # Write to screen


    You''ll need to make a few adjustments in the code to initialize the LCD. At the
    very top of your code you''ll need to include two lines: one to import the library,
    and another to initialize the LCD, specifying which pins are connected to terminals
    on the display. For an 4-bit LCD you can then operate the screen in 4-bit mode.


    ```

    #include <LiquidCrystal.h>

    LiquidCrystal lcd(RS, E, D4, D5, D6, D7);

    ```


    In setup(), you''ll need to call lcd.begin(), specifying the number of columns
    and rows for displaying characters. This may be written on the device or as part
    of the product code; for example, a 1602a would have sixteen columns and two rows
    down. Then, at any point in the program (excluding the setup), you can write to
    the screen with a few simple


    ![](img/47c577d3c443392bbdb486d8e17c4a70_50_0.png)


    Blue LCDs are hard to read without a background. A green one to save power


    commands. You''ll only need to write the mode of operation on the first line (just
    a running time), followed by the name on the second line, for device to be usable.
    Use the documentation for the LiquidCrystal library for all LCD controls, including
    scrolling and custom characters. However, for you can get away with clearing the
    screen and printing to the display, like this:


    ```

    lcd.begin(16,2);

    lcd.setCursor(0,0);

    lcd.print("Issue #188");

    lcd.setCursor(0,1);

    lcd.print("Dictionary");

    ```


    # Add finishing touches


    The project may be finished and ready for the user to operate, but we are still
    quite away from bringing this product to market. This is just the first project
    we were serious about turning this into a product there are still a few things
    to do, and one obvious stubble: we haven''t even considered how to finish.


    The first step would be to solder the circuitry into peroford or Verboard - boards
    are ready for good testing. You can then try to construct the electronics, and
    mount the LCD and display to the case. You can then consider portability, user-testing
    and tests. You might also consider moving towards a smaller hardware, reducing
    costs.


    Finally, if it is ever going to be sold the user it should probably wrapped properly
    by adding a feature where the Arduino activates a light when the device is recording
    - just like a real smartphone does.


    and final touches.'
