    Dear Lu&D I''d like to suggest that Linux User and Developer cover the programming
    languages Free Pascal and Ada. Free Pascal has been something of a resurgence
    in recent years and has a compiler that can target ARM as well as x86, and some
    IDE in the form of Lazarus. Ada continues to hold as part of the GCC collection,
    also safety-oriented; so programs in Ada can target any platform that GCC supports,
    and has a free IDE called GNAT Programming Studio.


