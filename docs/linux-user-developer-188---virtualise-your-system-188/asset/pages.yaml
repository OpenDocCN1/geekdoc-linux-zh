  md: "# Using Numpy to speed things up\n\nThis issue, we will look at how to use\
    \ Numpy with the Raspberry Pi Python code to speed everything up and squeeze out\
    \ performance\n\n> > One that is always an issue with Python code due to performance.\n\
    \nMuch of this is due to programming techniques from other languages that don't\
    \ work the same in Python.\n\nThese types of issues are usually dealt with by\
    \ numpy in a more Pythonic way.\n\nWhile Python is quite adequate in most cases,\
    \ people are keen to squeeze every last bit of performance. In these cases, we\
    \ have a different approach. Here, we'll look at what Numpy makes, which could\
    \ replace your Python code.\n\n```\nvirtualenv --system-site-packages -p python3\
    \ env\nsource env/bin/activate\n```\n\nIf you're developing on another box, you\
    \ should probably use an Anaconda installation. If not, we'll look at Numpy with\
    \ the following command:\n\n```\npip install numpy\n```\n\n```\ndef my_sum(x,\
    \ y):\n    return x + y\n```\n\nThis tells us that code generator that takes int32\
    \ as input data and returns the same result. But there are several ways you can\
    \ give to Numpy to help get the fastest code. This depends greatly on what your\
    \ data looks like and how much of your array may vary type.\n\n```\n@jit(int64=True)\n\
    ```\n\nNumpy code optimization based on decorators that can add decorators to\
    \ your functions to allow the LLVM compiler to compile your particular Python\
    \ architecture. The easiest way to use it is during the compilation process on\
    \ your defined functions, such as this:\n\n```\nfrom numba import jit\njit my_sum(x,\
    \ y):\n    return x + y\n```\n\nNormally compiled code objects only exist during\
    \ the runtime of your code. You can save the compilation by adding cache-file\
    \ to the jit decorator. This tells Numpy to save the objects to the file system\
    \ so they're available the next time you run your program.\n\nLazy compilation\
    \ means that Numpy won't compile a particular function until the first time it's\
    \ called. At that time, the input parameters are analyzed for type and a compiled\
    \ version is generated.\n\nBy default, the compiled version is based on the input\
    \ types, a new version is generated when input parameters of different types are\
    \ used. This is the true nature of the Python language.\n\nIn many cases, you\
    \ know what the datasets are supposed to be for. In these cases, you can tell\
    \ Numpy what it should be in terms of datatype, as in our example:\n\n```\n@jit(int32(int32,int32))\n\
    parallel=True\n```\n\nBy default, Numpy is created to be as fast as possible,\
    \ which means it won't produce Python code in mode (referred to as 'nopython'),\
    \ it will fall back to generating code that does the work using the Python interpreter\
    \ (referred to as 'object'). If you know that this happens, you can add the nopython\
    \ decorator. This tells Numpy not to fail back, rather than simply doing it. This\
    \ is useful if you want to try the latest experimental feature, automatic parallelisation:\n\
    \nThere has however been an issue for the Raspberry Pi, as it requires the LLVM\
    \ compiler and it hasn't been available since the latest versions of Raspberry\
    \ Pi include. We will use Numpy, in order to install it on your Raspberry Pi,\
    \ using the following lines of code:\n\n# Numpy optimize based on decorators\n\
    \n```\nsudo apt install libdev-python3-ipy\npip install\npip install numpy==0.30.1\n\
    pip install lite=1.8.0\n```\n\nYou do need to be careful of version numbers, as\
    \ that may not be part of the stable branches. Depending on your setup, to virtualenv\
    \ if so, run the following command:\n\n![](img/47c577d3c443392bbdb486d8e17c4a70_77_0.png)\n\
    \nJoey Barnard\n\nis a release man. He spends his time building scientific software\
    \ and works with researchers and developing Android apps.\n\n# Why Python?\n\n\
    It's the official language of the Raspberry Pi. Read the docs at raspberry.org\n\
    \n![](img/47c577d3c443392bbdb486d8e17c4a70_77_1.png)\n\n78"
