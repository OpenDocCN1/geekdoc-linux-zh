  md: "# # OpenSource\n\n06 News & Opinion | 10 Letters | 12 Interview | 15 Kernel\
    \ Column\n\n# HARDWARE\n\n#  Linux hit by Meltdown and Spectre security vulnerabilities\n\
    \nIntel or AMD, all systems are at risk, and patching can be painful\n\nMeltdown\
    \ and Spectre have made headlines around the world for being the most serious\
    \ vulnerabilities found in the last 20 years. And if you're using a device with\
    \ a CPU built in those last 20 years, you're almost certainly affected. Problems\
    \ with Intel CPUs have been rumoured throughout December, the sheer scale of what\
    \ would come dubbed could not have been predicted. Add to the twist that even\
    \ AMD (and some ARM) CPUs are at risk alongside Spectre thanks to a 'sister' bug,\
    \ and it's clear that this is real. Spectre exploits the advantage of a bug in\
    \ out-of-order instruction execution in CPU. This is essentially a way for CPUs\
    \ to continue processing small amounts of data (out of order) while waiting for\
    \ larger amounts to arrive from RAM. If necessary, the data that is already processed\
    \ must be discarded.\n\n![](img/47c577d3c443392bbdb486d8e17c4a70_5_0.png)\n\n\
    Meltdown was first discovered by Google Project Zero in mid-2017, and independently\
    \ detected by two other groups of researchers. By taking advantage of a delay\
    \ in processing data speculatively and checking it, researchers found that the\
    \ kernel could be read without a password or encryption key, and virtualisations\
    \ make no difference.\n\nWith Intel and AMD chips are impacted, as well as ARM\
    \ processors. Tough for an attacker to achieve, it's also more difficult to defend.\
    \ Spectre forces to leak data via speculative execution; researchers achieved\
    \ this with native code and JavaScript.\n\n Spectre forces to leak data via speculative\
    \ execution; researchers achieved this with native code and JavaScript\n\nBy the\
    \ time it was in the public domain, Linux, macOS and Windows all received updates\
    \ to patch the vulnerability, via a fix or patch within weeks. Isolation isolating\
    \ the kernel from the Meltdown exploit and any attacking attempt to read the data,\
    \ has the side effect of slowing your PC's performance, by up to 30 percent in\
    \ some scenarios.\n\nThe latter means that sandboxing is bypassed, which is a\
    \ major problem in itself.\n\nSealing with these problems, some AMD systems have\
    \ been left to patch after Microsoft issued a fix. The industry hit by driver\
    \ instabilities, and Intel has nothing to worry about Spectre on Intel or Broad\
    \ CPUs. Intel's advice is simple, though: \"End-users should continue to apply\
    \ updates recommended by their system and operating system providers.\n\n![](img/47c577d3c443392bbdb486d8e17c4a70_5_1.png)\n\
    \nAbove ARM-based devices such as the Raspberry Pi are immune to these issues—though\
    \ not all\n\nLinux users should wait until their distro releases a stable build\
    \ with the patched 4.1.14 kernel - for the simple reason that Linux developers\
    \ have been kept in the dark. As stable branch maintain Greg King has observed:\
    \ \"As for myself\n\nThis is going to take a long time to fix.\n\n6"
