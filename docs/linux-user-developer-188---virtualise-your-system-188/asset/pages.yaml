    Make: advanced rules


    John Gower


    is a university tutor

    in Programming and

    Computer Science. He likes

    to install Linux on

    every device he can

    get hands on and

    tunes terminals

    commands and shells

    da daily basis.


    In the last issue, we learned the basic concepts

    writing a Makefile, and how the Makefile works.

    In this issue, we''re going to look at some

    advanced features of Make that simplify the process

    of writing rules. We learned last month, how to use

    rules to avoid repeating code.

    However, since many projects are built in simple,

    a Makefile involved a lot of repeated code. For a

    more complicated project, the make could

    impeachably slow and develop quickly.


    # Implicit rules


    In the Makefile we used in the first article, some

    the recipes for creating new .o files looked very similar.


    ```

    player: player.c player.h screen.h dvd_

    gcc -c player.c screen.h player

    screen: -c screen.h player

    gcc -c screen.c

    ```


    Code repetition in Makefile is as bad as code repetition

    in any other programming language. Frankly, Make

    provides mechanisms to avoid this. The easiest one is

    nto use an ''implicit rule''. What does that mean? Well, Make

    looks for a rule to match the target you didn''t

    specify. It knows how to compile .c into

    ho files using the C compiler. That means we

    can leave the recipes for the rules and Make will

    still know how to carry them out:


    The tools we''re going to learn about in this article

    issue will enable us to automate the process of writing

    rules and how to use variables to

    build multiple files.


    The most important tool is the pattern rule,

    which allows us to identify particular types of

    (source files, object executables and, for example) by

    looking at them. We''ll also learn about rules

    aren''t used to build a file but which is intended to be run

    of their own - ''pattern rules'':


    # Resources


    +   A terminal running the Bash shell (on Linux

    distribution)


    +   GNU Make

    (included on most Linux

    can be downloaded from

    https://www.gnu.org/software/make/)


