  md: "# # What about other interpreters?\n\nThis will analyse your function and see\
    \ if it can be parallelised, or see if many other options can be applied.\n\n\
    While Numba allows you to compile sections of your code for speed, there are other\
    \ options available. The simplest, most direct one is to use another interpreter.\
    \ It is possible to get better performance without necessarily having to do anything\
    \ - and as programmers, you should always follow the easiest path available.\n\
    \nThere will be cases where you want finer control over how functions run. For\
    \ instance, the @generated_jit decorator is better than the @jit decorator.\n\n\
    ```\nfrom numba.pycc import CC\ncc = CC('my_module')\n@cc.export('float', 'f8(f8)')\n\
    ```\n\nThe big difference is that you have full control over the datatypes used.\
    \ For example, the above looks like this:\n\n```\nfrom generated_jit\n@jit(nopython=float)\n\
    def my_sum(x, y):\n    if isinstance(x, float):\n        return x + y\n```\n\n\
    # ## apt-get install pypy\n\nThis will install a new Python interpreter for your\
    \ system. However, to be aware that the performance of PyPy depends on the architecture\
    \ which you are running on, You may notice increases in PyPy speed compared to\
    \ CPython on x86-desktop. In many cases, you can get a speed increase by simply\
    \ calling your script with it.\n\nThis decorator also accepts other options, such\
    \ as nogil and cython.\n\n# ## my_script.py\n\nWhile the default operation of\
    \ Numba works as it is used as a JIT compiler, you can also use it as a library.\
    \ You can use the Ahead-of-Time (AOT) mode to compile the functions that are used.\
    \ The big advantage of this is that you can distribute your program without having\
    \ to have Numba installed.\n\nYou can take advantage of this by importing the\
    \ CC portion of Numba module. The biggest restriction is that you need to define\
    \ everything upfront, as you would with a traditional programming language. A\
    \ simple example would look like this:\n\nHere we have two versions of the multiplication\
    \ function defined for integers and floats. When you run this code, Numba produces\
    \ a compiled module, named my_module, which you can then use. You can import these\
    \ versions of these functions.\n\n```\nimport numpy as np\nfrom numba import jit\n\
    @jit(int32, int32)\ndef multiply(x, y):\n    return x * y\n\n@jit(float32, float32)\n\
    @jitclass\nclass Float:\n    def __init__(self, value):\n        self.value =\
    \ value\n    def array(self):\n        return self.value\n```\n\nThere are also\
    \ options to tune the behaviour of Numba. The example below uses the @jitclass\
    \ decorator. This defines a specification for a specific version of your particular\
    \ case- the following code provides example\n\nYou can maximise speeds by following\
    \ some rules of thumb. Look at how your code is bottlenecked. If it is IO-bound,\
    \ then PyPy isn't really faster. PyPy helps more for code that is compute-bound.\
    \ Saying that, you should use Numba when your algorithm is simple. You should\
    \ make sure that your algorithm doesn't need extra options like the PyPy interpreter.\n\
    \nThere are also no advantages in this case. Also, the use of Types might actually\
    \ cause a decrease in performance. With many variations, you will find that your\
    \ mileage will vary, and you will need to tune your code to the specific tasks\
    \ you want to handle. In end, PyPy rewards your own code and gives you the tools\
    \ to further-tune its behaviour to squeeze every last bit of performance out of\
    \ it.\n\nAs you can see, entry classes as individual functions. Hopefully this\
    \ short article we share some ideas that you can use for your projects. There\
    \ are many ways to use your Python code, and while this is just one of them, it\
    \ should give you a place to start.\n\n![](img/47c577d3c443392bbdb486d8e17c4a70_78_0.png)"
