    \ functions like delay when using ISR other interrupts may be disabled. It is\
    \ also not possible to be precise when measuring elsewhere. They use interrupts\
    \ to indicate when completed.\n\n# Attach an interrupt\n\nYou are already using\
    \ interrupts 'under the hood' during your program: analog-digital to digital (for\
    \ example, measuring sensor load data), and when using timers. We've covered some\
    \ of the functionality already but now we're going to use an external interrupt\
