  md: '# Tutorial


    # Arduino


    PART TWO


    # Arduino Dictaphone: Turn your project into a product


    Buttons, an LCD display, and a hardware interrupt will turn this project into
    a user-friendly product prototype


    # Alexander Smith


    is a computational physicist. Alex teaches Arduino to grad students and discourages
    people from doing lab work manually.


    In part one of this tutorial, we created a Dictaphone-style device, capable of
    voice recording and playback, using an assembled microphone circuit and a resistor
    ladder digital-to-analogue converter. The recording would have been approaching
    telephone quality, but we wanted real-time feedback. Playback became immediate
    and would only play the entire record.


    In this part of the tutorial, we''ll show you how to turn this device - remarkably
    given the low price of the components - into one which can be easily controlled
    by the user. If assembled on a printed-circuit board and sold as a DIY kit the
    project could even become a commercial product, if one was inclined.


    Building upon the circuit as left at the end of the tutorial, you''ll start by
    connecting the Arduino to a series of buttons which the user can press to control
    the mode


    of the device and circuit through stored audio recordings. You''ll program an
    external interrupt which gives user-input priority over any ongoing task. By adding
    an LCD to provide feedback to the user, they''ll be able to control the finished
    device.


    # Create a physical user interface


    Begin by acquiring a few basic components for the circuit: at least five resistors
    (100 ohms should do) and at least a clean breadboard or around 30 contiguous rows
    on the digital-to-analogue converter board we will use in the previous tutorial.
    Place the buttons along the central ridge of the breadboard so that the connections
    lie on either side. The number of legs each button has will depend on the style
    of button but, if there are more than two, it is important to first establish
    what connections are formed when the


    ![](img/47c577d3c443392bbdb486d8e17c4a70_47_0.png)


    # Resources


    +   - Arduino Mega

    - Breadboards

    - LCD Display

    - LEDs

    - Buttons

    - Resistors


    Tutorial files available:


    filesio.co.uk


