  md: '# Virtualisation vs applications


    Use Docker to get all the benefits of running apps in runs without overhead


    Traditional virtualisation technologies provide isolation. This means despite
    their advantages, they have one drawback: the unnecessary overhead of virtualising
    an entire computer to power a single OS.


    Docker enables you to bundle any app, with all its dependencies, into one container
    and run multiple containers on a single system. This is Linux, courtesy of Docker,
    or an other alternative.


    Remember, that while both virtualisation and containers enable you to run multiple
    instances of an app on the same server, there are radical differences between
    them. Virtualisation requires dedicated Linux kernels, whereas you can run more
    containers than VMs on any hardware, because of their smaller footprint.


    # Docker is essentially just a container runtime engine that makes it easy to
    package applications


    will automatically create all containers that run instances of the application.


    A common misconception is that Docker is a system for running containers. Docker
    is essentially just a container runtime engine that makes it easy package applications
    and push them to a repository, where other users can pull them. The technology
    is based on system level virtualisation and provides isolated environments - it''s
    built into every modern Linux kernel.


    ![](img/47c577d3c443392bbdb486d8e17c4a70_26_0.png)


    ```

    ```bash

    $ docker run -d -p 8080:80 --name my-webserver nginx

    ```

    ```


    Docker''s containers package software into a complete file includes everything
    your application needs. This ensures the app will run in the same way, no matter
    the environment. It does by creating a Docker image, which is a lightweight executable
    package of code along with its dependencies. It is a read-only version of your
    application that is compared to an image file. In order to run this image, Docker
    creates a container out of copying the image, which then you can execute it.


    # Docker 101


    While Docker is available in the official repositories, it is best to fetch the
    latest version from the Docker repository. Fetch the official script and execute
    it with `curl -fsSL https://get.docker.com | sh`. Once installed, start the Docker
    service and make sure it''s on subsequent boots: `sudo systemctl enable docker`.


    As we''ve said, a Docker container is an instance of an image. visit https://docker.com
