  md: '# OPINION


    # From container chaos to business

    adoption – and what’s next


    > performance, cost efficiency, scalability and speed these have already marked
    42 percent of businesses to the container infancy.


    How the IT industry will drive adoption in the world of containers


    With the march to the cloud reaching $7 trillion by 2020 according to 451 forecast,
    this trend is set to continue as businesses leverage these benefits through innovations.


    However, there are still significant obstacles and misconceptions that need to
    be overcome. Challenges around application security for example, have important
    implications for the future industry will be regarding portability and compatibility.


    The growth in portability of containers is uncertain and no connection has emerged
    between the interest in technology and actual demand. This is an understandable
    reality that the industry will be to solve.


    # Risk-averse


    Even with the hype around ‘container native’ the technology is at a stage where
    the enterprise is to be fully convinced, with many CIOs and managers still struggle
    to ensure the technology is the right option. It’s still early days, so it is
    hesitant to invest after all, any new technology comes with risks.


    At this point, it’s important to note that this isn’t a new industry. Many vendors
    have made high levels of progress in creating that matters. For example, Microsoft
    recently announced packages for Kubernetes deployments along with extended support
    for container workflows. Weave from VMware provides businesses with consistent
    security and Kubernetes across multiple platforms.


    However compatibility issues are still common for developers, particularly in
    enterprise deployments that require interoperability to maintain optimum levels
    of performance. Furthermore, portability is an often-quoted benefit of containers,
    which are still subject to significant limitations, such as the


    inability to run a container built for one platform on another one. This is also
    the age-old issue of backwards compatibility.


    Porting containers from one operating system to another (from Windows to Linux)
    is also complex and a frequent source of headaches for developers in enterprises
    any combination of systems.


    # The key to adoption


    Clearly, a greater focus on compatibility and portability is required throughout
    the industry to kick-start the wide-scale adoption of containers.


    The reality of container portability is far less than many vendors would have
    believed. Most enterprises have significant challenges when it comes to introducing
    container technology.


    Greater standards of the container environment is essential. The creation of container
    environment


    > The reality of container portability is far less than many vendors would believe


    would mean that users won’t have to worry about interoperability, as will also
    be able to interact with each regardless of the vendor they come from.


    Various industry bodies are already in place to make this happen, such as the
    Open Container Initiative (OCI), which is creating open standards for container
    formats, runtime and other aspects of the container environment.


    It is potentially being made, but more still needs to be done. Acanically works
    with the likes of AWS, Google and Oracle to underpin Ubuntu containers on those,
    and this kind of collaboration will be the key to guiding the future community
    and helping the world of containers evolve from chaos to widespread adoption.


    Marco Ceppi


    is an Ubuntu Product Started at Canonical, has been working professionally for
    the past years in both development and systems administration


