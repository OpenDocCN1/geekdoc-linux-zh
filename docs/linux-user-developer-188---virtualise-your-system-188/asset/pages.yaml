    \ argument is the method to perform when the interrupt is triggered. The third\
    \ is the edge when the interrupt occurs; for this task 'RISING' we want to trigger\
    \ an interrupt when the button is pressed (which increases the voltage). It can\
    \ be done as follows:\n\n```\npinMode(digitalPin, INPUT_PULLUP);\nattachInterrupt(digitalPin,\
    \ buttonInterrupt, RISING);\n```\n\nNow the Arduino will do the check after the\
    \ button has been pressed. After determining its operating mode, the device can\
    \ now go on to open and play, create and record, or delete the selected file,\
    \ falling either of the while loops if the flags have been set to non-zero.\n\n\
    Using ISRs, you also need to let the variables that are shared between the main\
    \ program and an ISR be volatile. This prevents the copies of the variables from\
    \ being cached in the register. The ISR doesn't alter this value - it changes\
    \ the local. To make the program refresh correctly, mark the variables volatile.\
    \ If you don't, you can no longer track the value of a flag, for example, what\
    \ you asked it to be. See // gammon.com/interrupts for more.\n\n# Program an ISR\n\
    \nNow the Arduino is running, you should probably write the few lines of code\
    \ for the processor to execute when the stop button is pressed. In the example,\
    \ we will trigger buttonInterrupt(), a custom interrupt routine. These ISRs take\
    \ no arguments and are designed to be quick tasks done only in the middle of\n\
    \nRight The interrupt shares a connection with the yellow button. This must be\
    \ pressed to operate the device\n\n![](img/47c577d3c443392bbdb486d8e17c4a70_49_0.png)\n\
