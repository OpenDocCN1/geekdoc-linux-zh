  md: '# Feature Protect tech


    HOW TO

    Make a backpack beacon


    # 1 Backpack beacon


    This project is a simple way to make your own tracking device that you can tuck
    away, in a sneaky fashion, in your backpack. Essentially, what you are doing is
    turning the RuuviTag into a proximity beacon for you to track using Eddstone,
    the open beacon format from Google. The first job, then, is to make sure you''re
    running the Bluetooth of Eddstone by flashing. The RuuviTag is set up for Over
    the Air (OTA) updating, so it''s easy to flash. We used the Moto G4 as our smartphone
    for the job, so you''ll need to download nRF Connect (http://bit.ly/nRFConnect)
    from the Store.


    # 2 Enter the bootloader


    You should download the app at lab.ruuvi/ on your phone, use the ''RuviTag'' link
    and download it. To flash the RuuviTag, we first need to enter it into bootloader.
    You can do this by it out of its enclosure using the attached metal clip. On the
    RuuviTag, you''ll see two buttons marked with numbers. Press the one marked two
    while plugging it in until you get a red light. Next, open nRF Connect and swipe
    down to find your device. Once found, tap ''Connect'' and select the point on
    the board that will turn.


    ![](img/47c577d3c443392bbdb486d8e17c4a70_63_0.png)


    you select the file type you want to use. The default ''Distribution package ZIP''
    is correct, click ''OK'' and start the RuuviTag firmware. This will start to update
    your RuuviTag. (Note: If your firmware is actually called ''weather_update'',
    the progress bar will display ''Application has been sent'' and disconnect from
    Ruiboot. Now you''ve got to configure your beacon.)


    # 5 Configure your beacon


    Now to configuration proper. First, download nRFBeaconEditor (http://bit.ly/nRFBeaconEditor),
    but this time press to get a red light and enter code mode. Then, open the app
    for Eddstone, click the RuuviTag ''Update'' tab from available devices and you''ll
    see an ''Unlock Beacon'' button which will show you your beacon''s 128-bit unique
    code. This is your address (0x01223344556677889abcdef). To configure the beacon,
    enter the address into ''0x00'', as shown: https://your-beacon.com


    # 3 Prepare to flash


    In the top-right corner of the app''s GUI there''s a tiny DFU config which you
    need to tap. Enable this


    # 4 Get it ready


    Head over to lab.ruuvi/ to download and the second link called ''Eddstone''. Go
    back to Step 3 and follow the same process, then choose edstone_file_1, 2 or 3
    to upload


    # 6 Test your backpack beacon


    We used some adhesive PE foam to stick the tag inside a backpack at the top. This
    shouldn''t affect the signal much, but for instance, stick it out to the – the
    RuuviTag is waterproof. To track your tag, you can use any beacon. We''ve used
    Beacon Tag at http://bit.ly/ruuvi-tag. Open the menu and click ''Beacons'' around
    me and your RuuviTag will pop up. The tag has a range of 50 metres (150 feet),
    but you''ll get different results from your backpack in metres to track it.


