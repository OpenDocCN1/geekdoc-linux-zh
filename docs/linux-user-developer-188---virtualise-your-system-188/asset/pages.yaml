  md: '# Review Lightweight web servers


    # # In brief: compare and contrast our verdicts


    | Installation | Cherokee | Hiawatha | Lightweightpd | Nginx |

    |---|---|---|---|---|

    | Installation | Some distros have it in repos, but compiling from source isn''t
    difficult in any case | Except for the, you can find pre-compiled binaries with
    many difficulties | Can be easily compiled from source, but is in the repos of
    all mainstream distro too | Besides source tarballs, also has its own repos for
    pre-compiled binaries |

    | Noteworthy | Has useful features and supports several popular frameworks and
    app servers | Has built-in security author script that can fetch Let''s certificates
    needed | Supports all useful features and has a flexible virtual-hosting function
    as well | In addition to be fast it can also be used as a SSL reverse-proxy |

    | Ease of administration | The Cherokee Admin has a simple interface to help configure
    the server a breeze | Easy to configure Nginx, and there''s a PHP-based tool |
    Apache-like simple config, plus modules that can be loaded from the CLI | Given
    its apache, getting with its configuration takes some time |

    | Documentation and support | Admin interface has integrated help button to jump
    into the documentation | A well-supported project with ample documentation and
    support avenues | There are lots of doc for new and experienced users, as well
    as support forums | Offers guides based on experience level as a free, professional
    ebook |

    | Overall | The graphical configuration tool nearly accepts all its configs |
    Its focus on security makes it ideal web server for sensitive deployments | Popular
    for Apache that''s relatively simple setup and configure | Useful not only as
    a web server but also for its django-related functions |


    # # AND THE WINNER IS


    # ## Nginx


    All these web servers are great and will work in virtually every hosting environment,
    barring some deployments.

    Apache has a graphical tool with which you can configure the server without having
    to mess with configuration files. This makes it ideal for inexperienced and first-time
    users. But from its website it appears Cherokee hasn''t been updated in some time,
    which is a red flag. Hiaw is ideal for security-conscious deployments and enforces
    good practices, but it''s essentially a one-man project with limited updates.

    Apart from this, it''s close between Lightpd and Nginx. According to web benchmarks,
    Nginx offers more outward-facing web servers than Lightpd. Nginx has server-side
    modules (like proxy) which makes it a great server that can also do fancy stuff
    load balancing and reverse-proxy – but getting with it does require some effort.
    That said, Nginx has much larger community and ample documentation. One scenario
    in which both Nginx and Lightpd


    ![](img/47c577d3c443392bbdb486d8e17c4a70_83_0.png)


    > Nginx powers 29 per cent of the best websites, second to Apache''s 39 per cent


    truly shine when serving lots of load. Static content, such as video and files.
    In the real world, some people use them for everything. For example, you can use
    Nginx for reverse-proxy configuration, load balancing and URL rewriting, with
    Lightpd configured with the relevant modules such as spawn-fgi which can be used
    for PHP scripts.


    As an aside and in all fairness to Apache – you only need the performance features
    of these servers if you are using on the websites of YouTube. Apache can easily
    handle thousands of static HTTP requests and with dynamic content, it is usually
    the scripts or the database causes a bottleneck.


    — Maynard Sharma'
