    ## 虚拟化你的系统


    在进入下一步之前，请将类型指定为文件系统（Filesystem）。第二步将根据你上一步选择的类型详细说明配置参数。对于文件系统目录，你只需要选择目标路径（Target
    Path），即主机系统上你想要存储虚拟磁盘的确切位置。


    当你熟悉 virt-manager 后，你也可以通过在存储池（Storage Pool）向导中选择选项来创建卷。现在你不再选择标准池，而是被要求选择一个目标路径，可以通过选择现有的
    LVM 卷组或创建一个新的卷组。如果你打算创建一个 LVM 卷组、输入目标路径或指定存储设备路径（例如 /dev/sdb），则源路径（Source Path）字段是可选的。


    一旦你创建了存储池，就可以在其中添加卷。这些是将被挂载到虚拟机上的实际磁盘。要创建存储卷，请选择一个存储池和大小，然后点击右侧面板中的“创建”（Create）按钮。


    ## 从远来看，使用脚本配置虚拟机更高效


    virt-manager 是一个帮助你熟悉虚拟化过程的极佳媒介。然而，从远来看，使用自定义 shell 脚本配置虚拟机更高效。幸运的是有 libvirt，它是一个暴露了各种
    API 以管理虚拟机和主机的库。此类命令行工具提供了指向 libvirt API 的接口。


    要创建一个新机器，virt-install 是一个 Python 脚本，你可以用它定义机器并创建 XML 定义，而无需费心处理 XML。在创建虚拟机之前，你需要为它使用一个存储镜像。其中一种方法是使用
    `virt-img` 命令。例如，以下命令将创建一个 20GB、qcow2 格式且命名为 fedaserver 的存储镜像：


    ```bash

    # virtimg create -f qcow2 /media/vmdisks/fedaserver.qcow2 20G

    ```


    一旦你创建了磁盘镜像，就可以创建虚拟机了。这里有一个 virt-install 安装示例，它为 Fedora 服务器安装创建了一个虚拟机。它整合了


    ![](img/47c577d3c443392bbdb486d8e17c4a70_21_1.png)


    ## 备忘表


    ### virsh 命令


    ![](img/47c577d3c443392bbdb486d8e17c4a70_22_0.png)


    - `virsh list [--all] --inactive` 显示激活和未激活的虚拟机

    - `virsh start/suspend/resume/reboot/shutdown --id <id>` 通过名称或域 ID 控制虚拟机

    - `virsh save <vm-name> --name` 保存虚拟机状态

    - `virsh restore <name> --save` 从保存的文件恢复虚拟机

    - `virsh autostart [--disable] --id <id>` 在主机启动时自动启动

    - `virsh dumpxml <id> > filename.xml` 将虚拟机转储为 XML 文件

    - `virsh define <file.xml>` 从文件创建虚拟机

    - `virsh pool-list` 列出所有存储池

    - `virsh pool-info <pool-name>` 显示存储池信息

    - `virsh vol-list <pool-name>` 显示存储池内的卷

    - `virsh create-volume <pool-name> --name=<name> 50G` 在存储池中创建一个 50GB 的卷

    - `virsh destroy <vm-name> --volume=<name>` 从存储池中删除

    - `virsh wipe <vm-name> --volume=<name>` 安全擦除卷

    - `virsh snapshot-list <id>` 列出虚拟机的所有快照

    - `virsh snapshot-info <id> [--current] --snapshotname` 查看虚拟机或你指定的快照的信息

    '
