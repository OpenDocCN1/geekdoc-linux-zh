    \n## 规避风险\n\n尽管围绕着“容器原生”的炒作不断，但该技术仍处于企业尚未完全说服的阶段，许多 CIO 和经理仍在挣扎确保该技术是正确的选择。现在还处于早期阶段，因此，投资人们仍然持谨慎态度，毕竟任何新技术都伴随着风险。\n\
    \n此时，重要的是，这并不是一个新行业。许多供应商在创建重要事物方面已取得了巨大进展。例如，微软最近宣布了 Kubernetes 部署的包，以及对容器工作流的扩展支持。VMware\
    \ 的 Weave 为企业在多个平台上提供了一致的安全性和 Kubernetes 服务。\n\n然而，兼容性问题对开发者来说仍然常见，特别是在需要互操作性以维持最佳性能的企业级部署中。此外，可移植性是容器经常被引用的优势，但它仍然受到很大限制，例如无法为一个平台构建的容器运行在另一个平台上。这也是老旧的兼容问题。\n\
