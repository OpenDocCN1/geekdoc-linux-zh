  - '[PAGE 18]


    of the most popular techniques are full and para-virtualisation.


    Full virtualisation is where the guest operating system interacts with a simulated
    hardware interface. The virtualisation software creates an emulated hardware device
    for the guest operating system, which is unaware of the fact that it''s running
    on virtual rather than native hardware. The advantage of full virtualisation is
    without any modifications and because it has exclusive access to the underlying
    host system.


    On the downside, the hypervisor needs to process all requests before they go to
    the physical device, which results in slower performance and higher CPU usage.
    Popular Linux full-virtualisation solutions


    include KVM, QEMU, and VirtualBox. KVM – Kernel-Based Virtual Machine – uses the
    modern virtualisation-enabled hardware available (Intel VT-X, AMD-V) by simply
    turning the Linux kernel into a hypervisor that over any disk or network card
    via a userland application called QEMU.


    Full virtualisation carries a lot of overhead, which makes it quite inefficient.
    This is where para-virtualisation shines. Here, a software modifies the hardware
    environment, and then we have a way to give the guest direct access to system
    resources. Under para-virtualisation, the kernel of the guest OS is modified to
    recognise the virtualisation software layer. Since para-virtualisation modifies
    the OS, it''s


    also referred as OS-assisted virtualisation. Good performance and efficiency are
    the hallmarks of this type of virtualisation.


    A very similar approach is adopted by Linux containers for deploying related instances.
    While virtualisation and its hypervisors abstract the hardware, containers provide
    isolation and security. No wonder, then Linux container programs, such as the
    popular Docker, are increasingly used using traditional virtualisation.


    Over the next pages we will explore both full and para-virtualisation. Virtualisation
    is a very broad field, but we will give you the know-how to deploy and manage
    full-blown VMs, as well as how to run containers on servers. If you''re new to
    this, the feature will also help you take advantage of the seemingly limited amount
    of computing power you have at disposal, even on the desktop.


