    # Ubuntu 17.10 reissue commences with important bugfix included


    Lenovo, Acer and Dell laptop owners can update with confidence


    Following reports that Ubuntu 17.10 bricked certain laptops, Canonical has finally
    released the October 2017 version of Ubuntu. At the root of the problem was the
    Intel SPI Driver, which resulted in Lenovo laptops and some from Dell not being
    able to boot, or blocked making changes to the BIOS.


    Worryingly, the bug could impact your system simply from being as a live image.
