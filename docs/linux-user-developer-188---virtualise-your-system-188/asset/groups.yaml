    sudo update

    sudo upgrade

    sudo curl -sS https://get.pimoroni.com/Rainbow

    bash

    ```


    # 02 Alphanumeric character display segments


    To get, let''s try a simple program to display some text. The four display blocks
    come in a range of colours and can be used to display the temperature, pressure
    or even the current time. Open your Python 3 editor and enter the code below.


    ![](img/47c577d3c443392bbdb486d8e17c4a70_73_2.png)


    Pimoroni is adept at awesome Hardware-Attached on Top (HATs) for the Raspberry
    Pi. Last year it released Rainbow HAT and as expected, it''s stacked with a bunch
    of sensors, inputs and displays to explore your interests. Use it as a weather
    station, a clock, a meter light or else entirely.


    This tutorial walks you through some of the Rainbow HAT''s main functions such
    as controlling LEDs and taking a temperature reading. We then move on to coding
    the ten LEDs: like LEDs and the Rainbow HAT mini. Combine these with the built-in
    piezoelectric buzzer and the three touch buttons, and you will have an all-in-one
    musical disco machine.


    In the last part of the tutorial, we''ll create a real-time temperature display
    which changes and blends shades of blue, orange and red as the temperature increases
    for the warmth of spring approaches.


    This program imports the modules, set the text to display and shows the text on
    the blocks. Try adding your four-letter word (carefully...).


    ```python

    import rainbow

    rainbow.display.print_str("LU&D")

    rainbow.display.show()

    ```


    # 03 The musical buzzer


    The HAT has a built-in piezo buzzer which can be used to play different frequencies,
    producing different notes. The notes are based on standard MIDI values, where
    60 is C octave 5. The second value is the number of seconds that the note will
    play. By adding more notes to remember to add to each, individual note to play
    before moving onto the next one.


    # Installing the HAT


    With your Raspberry Pi turned off, the Rainbow HAT GPIO header to the GPIO pins
    - all HATs are designed to fit perfectly, so the hardware slots into place. As
    all Pimoroni products installed is clean and a plenty of example code and projects
    are included. Boot up your Pi, open the Terminal


    ```python

    import rainbow

    rainbow.buzzer.midi_note(60, 2)

    ```


    # Full LEDs


    The seven main LEDs across the top of the HAT, are bigger and can be adjusted
    for both colour and brightness. To turn on all the LEDs we use the code set, all,
    line 3. This is followed by four values: the first three are the amount of red,
    green and blue, up to a maximum of 255. The last number sets the brightness, level
    1 is full and 0 is the lowest. To turn off the LEDs we set all the values to zero,
    line 6, and then show the LED line.


    ![](img/47c577d3c443392bbdb486d8e17c4a70_74_0.png)


    Add the code below to experiment with the colours and to see what effects you
    can get.


    # Taking a temperature reading


    This program demonstrates how it is to take a temperature reading and display
    it on the display blocks. First, create a variable to store the temperature, weather.
    Then use the code rainbow.temperature() to take the reading, line 2. The reading
    needs to be converted into a float and display the reading on the blocks, line
    3. Then display the reading on the blocks, line 4. Notice that the temperature
    is slightly higher than the actual. This is because the CPU and the HAT will produce
    residual heat.


    ```python

    import rainbow

    temperature = rainbow.weather.temperature()

    rainbow.display.print_float(temperature)

    rainbow.display.show()

    ```


    # Mini-LEDs


    The HAT has three mini-LEDs which can be used as indicators or status lights.
    The first is red, the second is green and the third is blue. These colours can
    be adjusted and controlled to suit.


    # Individual LEDs


    You can also control each LED individually. This is very useful if you have 16,581
    colours available in total; combine this with the brightness settings and you
    will have sufficient combinations for the needs of any project.


    Individual LEDs using the rainbow.set_pixel(position, number), in this example
    position is the physical LED number (the numbering starts from zero). The next
    three numbers correspond to the red, green and blue (RGB).


    ```python

