    \n# The (not so quiet) newbie's guide to Metasploit\n\n## Learn the basics behind\
    \ pen-testing, exploits, shell-code, reverse shells and everything in between\n\
    \n**Toni Castillo Girona**\nholds a degree in Software Engineering and an MSc\
    \ in Computer Security and works as support expert in a private university in\
    \ Catalonia.\nRead his blog at https://dbiseaux.upc.es.\n\nMetasploit is a powerful\
    \ and easy-to-use pen-testing framework widely used by security enthusiasts and\
    \ professionals alike. It is written in Ruby, so if you are comfortable with Python,\
    \ you will feel right at home. In Metasploit, the framework is made of six different\
    \ types of modules (Ruby script): Exploits, Payloads, Encoders, NOPs, and Auxiliaries.\
    \ An exploit carries a Payload to a vulnerable host, allowing us to get a foothold\
    \ into the system. The goal of an exploit is to be stealthy, because that's the\
    \ exploit's purpose. For memory corruption you might need a NOP-sled to help the\
    \ exploit work. Once you have a system, you can use a payload to gain privileges\
    \ but not last. Auxiliaries are modules used for scanning, DoS attacks, attacks...\
    \ just name it.\n\nCIDR address to scan (192.168.1.0/24, for example) and increase\
    \ the number of threads to speed up the process. Finally, set some common ports\
    \ to scan (for example, 21, 22, 23, 80, 443, 8080 and so on):-\n\n```\nuse msfscanner/scanner/tcp\n\
    set RHOSTS 192.168.1.0/24\nset THREADS 1\nset THREADS 50\n```\n\nWith all vulnerabilities\
