    \ PHONY，Make 将跳过对该特定规则的检查。\n\n我们可能决定直接使用 gcc 编译器来编译 Java 文件以修改代码：\n\n记住这一点非常重要：如果我们在与目标相同的目录下创建一个同名的假文件，它将始终被标记为最新（up-to-date），因此创建该规则将不起作用。将目标设为伪规则会让规则每次都运行，即使在相同的目录下也是如此。\n\
    \n```make\n% : java\n```\n\n在这种情况下，没有隐式规则可以处理 java 文件（因为它们是源文件）。我们仍然会遇到之前的问题：尝试从名为\
    \ Hello 的 Java 文件编译 Java 文件，以此此类推。\n\n# 匹配任意规则 (Match-anything rules)\n\n如所示，Make\
    \ 有能够根据扩展名重新创建文件，并决定使用哪种规则来构建它。但某些类型的文件具有相同的扩展名，例如没有扩展名的程序和脚本，或者可以使用不同的扩展名。在这种情况下，我们可能希望编写如下所示的规则：\n\
    \n我们可以将匹配任意规则作为终端规则（terminal）。终端规则与普通规则的区别在于，普通规则可以使用其他规则来创建它，而终端规则是在冒号之前没有依赖的规则。\n\
    \n```make\n% : java\n$ gcc -o $*\n```\n\n这会将单个文件对象链接到可执行文件中。第一个符号 % 将匹配任何先决条件名称，因此被称为“匹配任意规则”。缺点是它也会匹配像\
    \ player.c 这样的源文件。如果此类规则尝试将 player.c 作为先决条件，由于它并不存在，它可能会尝试创建文件 player.o 等。这可能会导致性能问题。\n\
    \n关键点在于，该规则的预期结果是带有 Java 的源文件。由于系统中不存在 Hello.Java 文件，Make 将不会使用此规则来构建文件 Hello。\n\
    \n结合这一点，我们对匹配任意规则使用了一种特殊行为。如果一个规则可以通过某些隐式规则生成（例如，文件是由 .c 文件的隐式规则生成的），则匹配任意规则永远不会适用于它。这意味着\
    \ Make 将不会尝试通过读取来创建 dvd_read.o 文件\n\n```make\nPHONY: all clean java\n\n%.o : %.c\n\
