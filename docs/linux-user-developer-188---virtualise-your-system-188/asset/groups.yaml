    ## Meltdown 漏洞


    Meltdown 揭示了处理器中一个“竞态条件”下的漏洞，可以在不知道访问是否允许的情况下读取数据。在 Linux 等现代操作系统中，每个应用程序都有自己的包含内核内存的地址空间，直到最近，处理器包含一个内存管理单元（MMU），防止应用程序从内核内存加载。每当处理器执行代码时，它可能需要从缓存或内存位置获取数据供应用程序加载变量。事实是，只要安全检查有效，访问就会提交；应用于上游
    Linux 的针对 Meltdown 的缓解措施消除了这些条件，但增加了一些开销。


