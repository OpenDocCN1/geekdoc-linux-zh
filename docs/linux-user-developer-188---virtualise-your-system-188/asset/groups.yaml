    # SPOTLIGHT


    ## AudioMath


    AudioMath was created by Alex Rogers at Oxford University and evolved from a research
    project at Oxford and the University of Southampton to develop a low-cost, free
    software for environmental and biodiversity monitoring. It''s a classic example
    of a project that needs a little help: ''An issue with a lot of open projects
    that we have is that there''s often a lack of support for them in the long term.''


    Davies met Alex Rogers at a conference in Bristol and this made it a successful
    breeze because it was affordable. It''s $14.99, compared to the commercial equivalent
    of $750. So a number of people wanted to access it, but they needed somebody to
    aggregate the cost of the device and get them off the internet so they can run
    it on some inexpensive open-source device for that. It''s the same logic as Kickstarter:
    if you can get a number of devices made at scale, you can bring the cost down.''
    Davies and Arribada took responsibility for it through Shrewsbury Foundation.


