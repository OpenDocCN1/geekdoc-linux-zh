    \ 服务器，请查看 CentOS、Fedora 或 RHEL，它们为 Hat 服务器创建了表格将 Docker 集成到你的网络中。还有 Alpine Linux，它最初是\
    \ LEAF（Linux Embedded Alpine 项目）的分支。它的创始人现在就 Docker，Docker 使用该发行版来构建其包。\n\n> 在\
    \ KVM 和 Docker 中，你有两种成熟的开源技术可以提高生产力，它们列出了一个或多个容器的特性或选项，可以通过单个容器实现。\n\n为了使用 Docker\
    \ CLI 展示其优势，我们将使用 Docker Compose 重建 MariaDB 和 WordPress 容器。使用来自 https://github.com/docker-compose/example/wordpress\
    \ 文件夹的简单指令创建 `docker-compose.yaml` 文件：\n\n```\n$ cd wordpress\n$ nano docker-compose.yml\n\
    database4:\n  image: mariadb\n  environment:\n    MYSQL_PASSWORD: <password>\n\
    \    MYSQL_DATABASE: my_wordpress\n  volumes:\n    - /database:/var/lib/mysql\n\
    my-wp:\n  image: wordpress\n  volumes:\n    - /html:/var/www/html\n```\n\n选项与之前相同，只是更详细。保存文件并运行\
    \ `docker-compose up` 创建容器。使用 `docker-compose logs -f` 监控容器的输出，也用于各种任务。\n\n我们涵盖了足够让你运行的内容，但仅触及了表面。\n\
    \n无论你使用虚拟化还是容器（甚至在虚拟机中运行容器），KVM 和 Docker 你都有两种成熟的技术，可以提高你在各种设置和区域的生产力。此外，你还有一种方法可以虚拟化\
    \ Linux 并为应对硬件灾难做好准备。\n\n"
