    # OPINION


    ## The kernel column


    Jon Masters summarizes ongoing efforts within the Linux kernel to mitigate the
    recently discovered Meltdown and Spectre.


    Unless you have been living under a rock for the past few weeks (and perhaps even
    then), you can''t escape several new security vulnerabilities discovered in many
    microprocessors. The names ''Meltdown'' and ''Spectre'' have garnered all of the
    usual media attention that one comes with its own name and logo. But unless you
    use the Linux kernel or application software, the processor must arrange for value
    to be loaded from the much larger RAM (system memory). While RAM is fast, it''s
    nowhere near as fast as the processor, which can execute hundreds of instructions
    in parallel; these instructions are immediately available because they are stored
    in an instruction (i) cache.


    So the processor makes a guess which the branch will go, performs pre-branch state,
    and speculative execution which time changes to registers and memory (architectural
    state) are stored in temporary structures that allow changes to be discarded if
    the speculation turns out to be incorrect. In that case, the processor simply
    throws away the state and the ''architectural'' state of the processor remains
    unchanged. This technique is a built-in feature known as speculative execution
    which provides most of the necessary processor hardware. Until recently, it was
    that the process of speculation behaves as a ''black box'', which is seemingly
    impossible to understand in detail.


    ![](img/47c577d3c443392bbdb486d8e17c4a70_14_0.png)


    Jon Masters

    a Linux kernel hacker who has been working on the kernel for 22 years, since he
    has started his professional life.


    The Spectre exploits target common practices of high-performance microprocessors
    that exist across the industry. In particular, a vulnerability in a process called
    ''speculative execution'', a common capability to many high-end processor cores
    (and not necessarily vulnerable in every case), allows processor to execute code
    before it knows whether that actually needs to run. A common example of this happens
    is in software branches, such as an if-statement. These branches control flow
    instructions which will take the program in one of several possible directions.


    ### Side-channel attacks


    The Meltdown (and Spectre) exploits the fact that this black box within the processor
    isn''t guaranteed to be true. While, during the speculation, it may be possible
    to observe its operation through an indirect method, known as a side channel.
    These latent vulnerabilities are known as cache side-channel attacks because they
    exploit the fact that data is cached across many different applications, and as
    the kernel does. Because these caches are a shared resource, everyone wants a
    piece of the cache. Entries in the fastest cache are being used as virtual memory,
    meaning they are looked up by the virtual memory address used by an application.


    If you have a condition, such as if (raining) do you else: (that) that is, first
    determine the value of raining (that is, true or false). Then that value might
    be immediately available to the processor in a fast (but very tiny) internal memory
    known as a L1 (i) cache, but more often than not it isn''t immediately known (missed).
    In that case, the direction. Since speculation was assumed to be invisible, it
    didn''t seem to matter whether the loaded actually took place, so long as the
    programmer never was aware of it.


    In a subsequent reveal, the loaded used in another piece of code that performs
    a memory access. This structure could help prevent access, but the address of
    it is based on the contents of the first. Consequently, a cache entry is populated
    for the second, and the address of it is revealed by the timing of the prohibited
    data. If this sounds complicated, you don''t need to think about this for a few
    seconds.


    Conversely, a side channel can be formed between pieces of code that share the
    same cache. One piece of code can fetch caches while another loads them. This
    one piece of code can infer things about the other without having direct access
    to its data. Patterns have been written about side-channel attacks, which until
    recently focus on using the cache to measure the behavior of a program without
    needing any given point.


    ![](img/47c577d3c443392bbdb486d8e17c4a70_15_0.png)


    ## OpenSource Your source of Linux & news


    Right Meltdown and Spectre come with their own logical flaws, courtesy of designer
    Natasha Ebit. To outline here research ''page size'' and its impact of cache associativity-if
    you''re interested in learning more about this, the requirement is quite controllable—through
    special instructions, or by simply accessing any memory that is known to the same
    cache entry. Furthermore, it is true that memory is faster to access when it is
    in the cache, that is its whole point. So much so, in fact, it is possible for
    an application to time a memory and work out of it if it is in the cache.


    ## Meltdowns


    Meltdown reveals a vulnerability under a ''race condition'' in the processor in
    which data can be read without knowing the access is allowed. In case of modern
    operating systems, such as Linux, each application has its own address space that
    includes the kernel''s memory, but until recently, considered so the processor
    contains a Memory Management Unit (MMU) that prevents applications from loading
    from kernel memory. Whenever the processor is executing code, it may need to fetch
    data from caches or stores of memory locations, to load variables by an application.
    The fact is that an access is committed, as long as the safety checks hold, which
    is the mitigation applied in upstream Linux for Meltdown removes the conditions
    needed, but adds some overhead.


    ## Spectre


    The execution of speculative execution is that the processor then branches based
    on significant benefits. Branch prediction has so good rates that over 99 percent
    accuracy are uncommon. Depending on the types of attacks there are more methods,
    and it may use a lot of historical data from which the process went previously.
    It can also be by indexing a data structure within the ''branch predictor'' using
    the address of the branch predictor in virtual (application) memory. For performance
    reasons, this index may not be unique, but may just be the order bits (lower part)
    of the address of the branches. This means that other branches in the system might
    ''collide'' with this predictor. Typically the potential for collisions is low,
    but the risk of intentional collisions is not zero in some designs. In the case
    of Spectre variant 2, this allows one application to train the predictor to assume
    that certain branch addresses will result in an ''indirect'' branch (a jump to
    a pointer) is made because it is possible to cause the address prediction for
    an indirect branch to jump to any arbitrary address. By writing a carefully abusive
    sequence of instructions within one architecture, kernel or Hypervisor, this allows
    for pieces of kernel code to be used as whatever code they want, and then they
    execute entirely sequence to train the indirect predictor by more privileged code,
    often using the shared cache as a side channel to infect its contents. This attack
    is easily pulled off, and it reveals the value of victim code, in some way, of
    its broad impact. Indirect exploits for Spectre variant 2 have been demonstrated
    by researchers Jason Sommerfield from browser sandboxes that would be severe.


    A related attack, as Spectre variant 1 exploits the fact that the second part
    of a conditional branch is used to determine whether the first part falls within
    a range and to take its place. This is because a boundary check usually precedes
    the data value is actually loaded. A problem in kernel code that relies on using
    untrusted data from user applications (such as a memory address that is written
    to) the kernel code performs checks on the value; speculation might allow later
    operations to take place that nonetheless use the untrusted data provided without
    any reading of kernel memory.


    ### Mitigations


    As well a full and complete fix to Spectre will involve both software and hardware
    changes. The latter will not come with time. Meanwhile, we are left with software
    mitigations that deny the ability to exploit these vulnerabilities by removing
    the conditions for their abuse. As mentioned, Meltdown can be mitigated through
    PTI (Page table isolation); Spectre requires more work, specifically variant 2
    mitigation involves disabling or bypassing the branch predictor hardware when
    context boundaries.


    Their branch predictor may be bypassed by using a novel software construct (invented
    by Google, learn by reading their paper (on the topic), known as a ''retpoline''
    (trampoline) that effectively turns jumps into returns, avoiding the indirect
    predictor. Retpolines are a favored approach in many cases due to lower overhead,
    while in some cases it is necessary to totally control the predictor.


    ## As Meltdown, a full and complete both software and hardware changes branch
    predictor hardware. This is done using following a system update exposed by the
    hardware, while limiting branch behavior on entry to the kernel.


    The past few weeks have seen an amazing amount of work by some skilled developers
    who have put their into creating new kernel patches to protect users against these
    vulnerabilities. Recent kernels contain a new sysfs /sys/device/system/cpu/vulnerabilities/
    that will be exposed to, and how they are protecting against various mitigations.
    Users who build their own kernels may need to update exploit if they want to take
    use of the Google retpoline since it needs tools.


    All this work has a toll on the rest of the kernel development, course. With good
    fortune kernel version 4.13 will be out when you read this, and we can return
    to our regularly scheduled programming.

