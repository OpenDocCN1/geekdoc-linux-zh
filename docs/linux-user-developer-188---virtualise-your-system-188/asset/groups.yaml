    # The Pomoroni Rainbow HAT


    Hello world!

    The Rainbow HAT uses 14-segment displays rather than 7-segment displays. This
    means that you can display text on them - upper and lower case as well as numbers
    and symbols. The buttons can be used to toggle things on and off and a push-to-hold
    function enables various types of interaction.


    ![](img/47c577d3c443392bbdb486d8e17c4a70_75_0.png)


    09 Touch button LEDs

    An adjusted program used in step 8 to code to trigger the third LED, line 6. This
    combines the code from Step 7 to turn on the third LED, in the middle. Remember
    that the color of the full LEDs can be adjusted with the RGB values. Add the code
    to respond to the release of the button, line 9, and have a responsive LED at
    the touch of a button.


    being touched. On line 5, the line of code for setting the first mini LED to on
    (1, 0, 0) and on line 6, the code to play the musical note from the buzzer.


    ```

    import signal

    import rainbow

    ```


    ```

    @rainbow.touch.A.press()

    def touch_scheduled(channel):

    rainbow.lights.rgb(0,1,0)

    rainbow.rainbow.set_pixel(3, 0, 255, 0, 0.1)

    rainbow.show()

    ```


    ```

    @rainbow.touch.A.release()

    def release(channel):

    rainbow.lights.rgb(0,0,0)

    rainbow.rainbow.set_pixel(3, 0, 0, 0, 0.1)

    rainbow.show()

    ```


