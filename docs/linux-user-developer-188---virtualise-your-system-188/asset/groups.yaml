    ## Pi 智能触摸屏


    ## 开源智能家居


    位于旧金山的一个时尚智能家居项目，为家庭自动化提供了一个优雅的界面。


    这个项目解决了一个棘手的问题：利用廉价且实用的 1 号树莓派（Raspberry Pi）触摸屏。Peter Monaco 的任务是创建一个能够与墙面平齐的触摸屏，用于家居自动化，且不需要任何电线。


    ### 你对树莓派进行了哪些修改？


    正如我所说，空间非常紧缺。如果不进行一些修改，树莓派在垂直方向上无法放入电线盒中。我用跳线代替替换了触摸屏适配器，但那些线悬挂得太长，无法放入盒内。我决定剥掉一端并将其直接焊在电路板上。这为我节省了半英寸的高度，而这正是必须的。


    此外，当你想要给树莓派连接以太网线时，我必须做一个急转弯才能放入盒中。我使用的是一种很硬的末端，所以我制作了一个更灵活的自制五类线缆扩展线。


    ![](img/47c577d3c443392bbdb486d8e17c4a70_67_0.png)


    你的边框做得非常好。你绝对很有 3D 打印经验——你用什么打印机？对想要复制你作品的人有什么建议吗？


    你选择了 Home Assistant 作为界面。你对计划的其他家居自动化项目有什么打算？


    它已经运行了两年多。我使用 FlashForge Creator Pro 和 SketchUp 完成所有工作，设计了一些让生活变得轻松的小物品，比如把圣诞灯固定在电池上的夹子，或者固定我的
    Wi-Fi。


    我才刚开始接触家居自动化。我增加了几个 Wi-Fi 开关（Switch-HS2202），它们运行良好。我还在冰箱上添加了一些传感器，以后可能还会增加一些。对我来说，让我的家居自动化开源是非常重要的——我正在考虑更多关于家里的想法。我观察了一下，最后选定了
    Home Assistant 项目（home-assistant.io）。它拥有适用于所有设备的适配器，并且完全开源。我在壁衣柜里为树莓派准备了一个小盒子。然后我发现了
    HAADashboard-project，它为 Home Assistant 提供了一个现成的、极具吸引力的结果。


    我仍在研究树莓派的墙面设计。


    ### 让我的项目开源非常重要


    在墙上或通过夹子固定在固定的盒式支架上。我用 PLA 打印了所有部件，这让变得简单。这些是我用 PLA 制作的一些较大的部件，起初遇到了一些问题。我必须通过将热床温度提高到
    50 摄氏度来解决翘曲问题。这包括风扇设置、最小温度以及 200 摄氏度的喷嘴温度。


    ### 在开发过程中面临了哪些挑战？没有从同伴那里获得有用的反馈吗？


    ### 该设计有一个智能家居触摸屏。你使用了哪些节省空间的技巧？


    我完全没有任何空间；我希望屏幕与墙面平齐，所以电子设备需要放入墙内的电线盒中。树莓派挂在触摸屏背面，在经过几次修改（我不得不做的修改）之后，边框才正常贴合。


    我最初的版本是将部件包裹在一个 USB Case 外壳中。我无法将其直接连接到电线盒并固定，因此需要寻找其他方法。最后我使用了一个大得多的盒子来装下它。我收到了很多反馈，认为这种方法感觉不安全，一个人建议使用
    C 型扩展线，效果会很好。根据这个建议，我用它替换了 USB 外壳，购买了这两个部件并更新了设计。我还创建了一个直接使用树莓派本身就能完美运行的版本。完全不需要高压连接。我的最终项目展示了两种屏幕供电方法。


    在挤进去之后，留给边框的空间已经不多了，尤其是考虑到所有的高压连接。我设计了一组三块墙板和滑块，允许它们插入并轻松取出。这在背面创造了一个 L 型空间，足够容纳几根五类线（RJ
    皮护线）、一个外壳和一个 USB 电源适配器。我曾找到一种安装边框的方法，使用一个螺丝固定在盒子上的支架和一个插入其中的边框。一旦组装好，这种边框是最好的。


    ### 喜欢吗？


    要查看 Peter 项目的完整演示，请访问 http://bit.ly/WantAFlushPi，他在那里展示了使用以太网传输 120 VAC（美国标准）电触摸屏说明。


    ### 延伸阅读


    Peter 使用 SketchUp 进行设计工作，如果你想在本项目中尝试，可以在 https://github.thingiverse.com/2749782
    找到所有使用 Bezel_2 和 Faceplate_2 的记录。


    ## 适用性


    该设计要求墙内和背盒内完成所有的布线。为了让这个项目落地，你可以在墙内铺设五类线（或者你可以自己铺设），并对你的电缆布线质量有信心；如果你有任何疑虑，请咨询合格的电工！


