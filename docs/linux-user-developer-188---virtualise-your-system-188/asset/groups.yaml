    Nextcloud Talk，这就是聊天和视频通话的领域。


    上次，我们开始获取 socket，所以我们对如何实现它有一些想法。它是基于用户的。所以你可以针对你个人进行端到端加密，而不是对它进行加密。但如果你丢失了手机，你不会丢失数据中的所有文件。然后你可以说：“好的，我要打个电话。我会和其他人在线协作，与某人分享对话，然后当我回来时，我会把它移动到我的端到端加密文件夹中。”


    然后我们[有了]了群组加密，比如联系人和邮件——我们基本上想要投资的，从这个角度来看，非常棒。因为我们在两个月前已经开发了服务器端加密版本。


