    ![](img/47c577d3c443392bbdb486d8e17c4a70_2_0.png)


    Welcome to the UK and North America''s favourite Linux FOSS magazine.

    Through the storm of Spectre and Meltdown, we need to tip our hats to those who
    are rapidly creating new features to help protect users against these vulnerabilities.
    A Herculean task that should be celebrated. We need more of this in here the heart
    of the issues, our Column Writer Jon Masters, who has written an extended column
    month to battle the vulnerabilities. What a challenge!


    For the rest of the magazine, we hope to make your life less stressful, with a
    guide to becoming a virtualisation power user (p18)—a write-up on the importance
    of archival conservation and how to protect your tech with thieves (p58). Our
    main interview is with Karl Fritzsch, the founder of Nextcloud about the future
    of end-to-end encryption in Nextcloud 13.


    As the usual section topic, Practical includes a highlight on both Metasploit
    and the Racket programming language. In Practical, we have some with a Rubber
    Duck hatching editor and use Numpy to protect your Python code. Enjoy! Chris Thorne,
    editor


