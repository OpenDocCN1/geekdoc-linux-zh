    # # Tutorial Racket


    Emacs mode in Racket


    Here, the for loop binds identifier 1 to the list items 3, 2 and 1 in turn, printing
    out each value. Racket provides a number of built-in constructs to use with lists,
    and you might find that you don''t need to write your own loops at all. For example,
    we could have written the following example more concisely:


    ```

    ```

    (begin (map (display 3)) (display "Blast off!"))

    ```

    ```


    The map function applies the given (in this case, display) to each of numbers
    3, 2 and 1 in turn, which numbers are printed to be. In fact, map returns a list
    of all return values applying the function to:


    ```

    ```

    (map ''list 4 9 16))

    ```

    ```


    Lists. Racket supports variable-length input from functions. If you put a list
    as the last argument to a function, it can receive any number of arguments of
    that last. The arguments will then be returned as a list. See Figure 10 for an
    example of this.


    # ## Macros


    We mentioned earlier one of the things that Racket is particularly good for is
    extending the language itself in order to build your own macros We will give a
    small taste of showing how to write macros in Racket.


    The simplest way to write macros is by using the define-syntax-rule. This works
    a bit like define except that the arguments are no longer values, but variable
    or function names.


    ```

    ```

    (define-syntax-rule (++ name) (set! name (< name)))

    ```

    ```


    This function will behave like ++ in C-like languages,


    ```

    ```

    (define a 5)

    ```

    ```


    If you''re using an editor for experience with Racket, you might find that the
    natural nature of Racket better for your own editor. There is an Emacs mode for
    Racket that you can download from https://github.com/racket/racket-mode. Figure
    9 is showing something similar for Vim, but you can download the install! evil
