    # InspiringOS（启发操作系统）


    # 开源保护事业


    ### Chris Thornett 访问了 Arribada 计划的幕后推手，并发现开源技术方法如何打破障碍并降低保护自然世界的成本


    - **Alasdair Davies** 是 Arribada 计划的创始人，同时也是伦敦动物学会和 Shuttleworth 基金会的技术专家。


    - **核心信息**

    Alasdair Davies 于 2017 年建立了 Arribada 计划，旨在通过开源开发的力量，为保护领域提供廉价、可定制的科技产品和项目。

    其他参与者还包括 Naturebytes，http://naturebytes.org。


    **什么让 Arribada 与众不同？**

    Arribada 突出的开源项目之所以与众，是因为它做得很好。Davies 说：“想一下它在保护工作中擅长什么，”他认为这具有巨大的潜力。


    ![](img/47c577d3c443392bbdb486d8e17c4a70_31_0.png)


    上方：Arribada 计划的一个项目是全年监测南极企鹅的种群。


    > 保护工作并不便宜。幸运的是，开源硬件和软件潜力改变我们保护和监测地球的方式。关键在于使用最低成本提供最高价值的技术，这非常重要。


    Alasdair Davies 与来自 Arribada 的硬件技术专家 Volff 在一起，Volff 在基准保护和开源方法讨论几天前对我们进行了采访。位于几内亚湾非洲西岸外的普林林普西岛（Prince
    Island）有一项海龟保护计划，在绿海龟返回筑巢时使用追踪系统。你可以在这里看到一些精彩的视频：https://youtube.be/jfHL44I


    Davies 说，给动物打标签本质上是昂贵的，但正如现在与他合作的 Shuttleworth 学金获得者所说：“我想谈谈获取廉价且开源保护技术的问题。”自从被选为
    Shuttleworth 学金获得者，通过无与伦比的组织——Arribada 计划，一直致力于实用的开源保护解决方案，他的绿海龟项目可能是最为人知的，最近被
    Raspberry Pi 基金会报道过。


    Davies 说，标记海龟的成本每个标签可能长达 4,000 英镑。但那只有在你遵循传统路线时才会如此：“如果我们拆解标签的组成，它本身就是一台嵌入式计算机，”Davies
    说。使用 Raspberry Pi 作为模块，结合 RF（射频）以及若干个管理系统，只要有正确的组件，你就可以为自己制作一个非常廉价的、负担得起消耗的标签。在硬件方面，Arribada
    的绿海龟标记系统使用了一个 Raspberry Pi Zero HAT 摄像头模块和两块锂电池。每个标签成本约为 200 英镑（见右侧“标记海龟”）。


    与 IRNAS——系统内先进系统开发研究所合作，


    # 我们下一个应该介绍哪个启发性项目？


    通过邮件向我们发送你喜欢的项目：linuxuser@future.com


    ![](img/47c577d3c443392bbdb486d8e17c4a70_32_0.png)


    # 焦点聚焦


    # 标记海龟


    当 Davies 讨论保护工作时，这显然是他一生的热忱，源于他青少年时期在欧洲背游，探索国家公园并沉浸在自然世界。但当他谈到为普林西普信托（Principe
    Trust）从事的海龟工作时，他变得几乎近乎痴迷。


    “对我来说真正重要的项目之一是普林西普岛的海龟标记，”Mark Shuttleworth 说道，他是 Canodil 的创始人，他对该岛屿本身进行了投资——基本上是为了创建一个生态旅游项目。Davis
    解释说，Shuttleworth 需要一个保护计划来负责任地管理。“我最初必须去那里。基本上他们找我：‘你们如何帮助我们保护海域外的海龟？你们能开发一个开源解决方案吗？’于是，我带着几位帮助开发解决方案的成员去了那里，我们正在使用带有无线充电器的
    Raspberry Pi W。”


    上方：Arribada 的亚马逊森林监测系统正在一个比秘鲁礁更严苛的环境中进行测试。


    Arribada 计划专攻开源硬件开发，还被用于开发海龟标签的开源外壳，外壳完全使用 3D 打印机制造，并使用开源共享软件。“预算很小，”Davis 说，“所以我说：‘管你们有限的预算吧，自己动手做
    10 个标签——蓝图都在网上。如果你是开发者，你现实中需要这些工作的软件是这样的。’”


    Arribada 的另一个项目是监测秘鲁的亚马逊雨林。该项目的核心重点是 AAMP，即基于摄像头的 Arribada 亚马逊监测平台。


    # 有了 Raspberry Pi W，我们可以制作非常廉价、负担得起的标签


    对于这个项目的问题，Davis 的回答是：“我如何帮助人们进入树冠？或者他能否监测并看到那里发生了什么？从环境角度来看，你可以观察质量，观察光照。因此你可以检测树冠是否随时间发生变化，它会为你记录下来。当你看到野生动物出现时，你可以观察野生动物进出保护区。你可以观察它们的存在或缺席。”


    此外，在雨林中建立无线网络极其昂贵。一种远距离 RF 协议非常擅长穿透长距离。可以发送小数据包。我们一直在研究作为一个开源平台，例如使用改装的 Peli 箱箱（一种非常坚固、防水的存储箱）。”“再次，在
    Davies 选择的设备内部，运行着一个 Raspberry Pi——‘我是 Raspberry Pi 的脸’——它出现在我的许多项目中。”


    这个项目还展示了巧妙的协作。


    Davis 补充说，标签还将追踪威胁。


    例如


    ![](img/47c577d3c443392bbdb486d8e17c4a70_32_1.png)


    底座用树脂固定在海龟上。当它干燥后，团队附上标签。当母龟返回巢穴更换标签，并在繁殖季节结束时完全移除标签。


    # InspiringOS 开源保护事业


    快速事实

    Instant Detect 2.0

    Arribada 计划正与 ZSL（伦敦动物学会）合作开发一个连接卫星的 Instant Detect 2.0 系统。

    bit.ly/InstantDetect20


    | |

    |---|

    | ![](img/47c577d3c443392bbdb486d8e17c4a70_33_0.png)


    工作在 PIRA 上运行，用于离网太阳能运行。基于环境光传感器和其他输入，PIRA 可以捕获信息。


    传感器，因此它可以检测水位。在某个项目中，这至关重要——如果上游有大坝或灌溉抽取了过多水，那里的濒危鱼类就会灭绝。我们有一个远距离 Wi-Fi 链路，我们可以定义基础命令。我们可以说‘告诉我水位’，或者由于环境变化停止水流。”


    所以，“我们很乐意看到人们说：‘是的，这里有不同的用途。我们可以适配它吗？’答案是肯定的，因为它是开源的，没有限制。我们可以给他们软件，他们可以自己做，然后再次分享。我们分享，其他人可能会说：‘噢，太棒了，我从未见过它用于监测，但我见过它用于——’”


    Davis 表示，他们现在已经在 GitHub 上创建了一个可用的蓝图：“这只是软件。你可以下载蓝图并制作外壳，自己完成所有的加工和准备。再次允许你使用廉价的技术改变环境，而且这一切都是开源且可访问的。你可以打开它放入任何你想要的东西——一个声学记录器，”


    上方是 Arribada 的原始记忆。你可以在 github.com/RRAS-ambida-ampa 下载蓝图。


    > 我们有一个远距离 Wi-Fi 链路，我们可以执行基础命令。我们可以说‘告诉我电池状态’


    人们可以适配并承担 Arribada 的所有权和责任，这非常强大。“无论水平如何，他们都可以采取并为自己服务，或者要求我们为他们使用，但这是……”


    单位 Davis 谈到了头部技术中专有技术的问题。“有些人被提到，我可能收到过非常难听的邮件，我要进入准入：准入障碍一直是军事解决方案。”Davis 说他见过许多军事卫星通信解决方案。“有人发现了机会去销售——’”


