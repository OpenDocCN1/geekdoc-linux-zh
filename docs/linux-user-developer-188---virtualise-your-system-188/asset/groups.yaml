    # 评测轻量 Web 服务器


    ## 简要：对比并分析我们的结论


    | 安装 | Cherokee | Hiawatha | Lightweightpd | Nginx |

    |---|---|---|---|---|

    | 安装 | 某些发行版在仓库中提供，但在任何情况下从源码编译都不困难 | 除了这些，你可能会遇到很多困难才能找到预编译的二进制文件 | 可以轻松从源码编译，但在所有主流发行版的仓库中也有
    | 除了源码压缩包，它还有自己的预编译二进制文件仓库 |

    | 特色之处 | 具有实用的功能，并支持多个流行的框架和应用服务器 | 内置了安全作者脚本，可以获取所需的 Let''s Enc 证书 | 支持所有实用的功能，并具有灵活的虚拟主机功能
    | 除了快速之外，还可以作为 SSL 反向代理 |

    | 管理易用性 | Cherokee Admin 具有简单的界面，配置服务器变得轻而易举 | Nginx 于配置，并且有一个基于 PHP 的工具 | 类似
    Apache 的简单配置，加上可以从 CLI 加载的模块 | 考虑到它的 Apache，熟悉其配置需要一些时间 |

    | 文档与支持 | 管理界面集成了帮助按钮，可以跳转到文档 | 一个受支持良好的项目，拥有丰富的文档和支持渠道 | 为新用户和经验丰富的用户提供了大量文档，以及支持论坛
    | 提供基于经验水平的指南，作为一本免费的专业电子书 |

    | 总体 | 图形化配置工具几乎接受其所有配置 | 它对安全的关注使其成为敏感部署的理想 Web 服务器 | 对于 Apache 来说很流行，设置和配置相对简单
    | 不仅作为 Web 服务器有用，其与 Django 相关的功能也很有用


    ## 获胜者是


    ## Nginx


    所有这些 Web 服务器都非常出色，几乎可以在每种托管环境中工作（某些部署除外）。Apache 有一个图形化工具，你可以通过它配置服务器，而无需处理配置文件。这使得它对于没有经验的首次用户来说是理想的。但从其网站来看，Cherokee
    似乎已经有一段时间没有更新了，这是一个红旗。Hiawatha 适合对安全敏感的部署并能强制执行良好的实践，但它本质上是一个单人项目，更新有限。


    除此，Lightpd 和 Nginx 之间不分伯仲。根据 Web 基准测试，Nginx 提供的面向外部的 Web 服务器比 Lightpd 多。Nginx
    拥有服务端模块（如代理），使其成为一个可以执行负载均衡和反向代理等高级功能的优秀服务器——但熟悉它确实需要一些精力。尽管如此，Nginx 拥有庞大的社区和丰富的文档。Nginx
    和 Lightpd 真正都在处理大量负载时大放异彩的场景是静态内容，如视频和文件。在现实世界中，人们使用它们处理一切。例如，你可以使用 Nginx 进行反向代理、负载均衡和
    URL 重写，Lightpd 配置了相应的模块可以用于 PHP 脚本。顺便说一下，如果你在使用这些网站，Apache 可以轻松处理成千上万个 HTTP 请求，它通常会导致瓶颈。


