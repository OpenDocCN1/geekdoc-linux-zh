    # Feature


    # Virtualise your system


    # QUICK TIP


    Query disks

    If you forgot to add an extension to the file, you can use qemu-info --qemu-name
    to see various details about the file.


    Right: Hand to Edit

    If you want to several options, you can change the behaviour of a VM. You can
