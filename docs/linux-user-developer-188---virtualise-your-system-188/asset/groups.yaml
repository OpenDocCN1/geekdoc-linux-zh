    ## 开源


    06 新闻与观点 | 10 字母 | 12 访谈 | 15 专栏


    ## 硬件


    ### Linux 受到 Meltdown 和 Spectre 安全漏洞的影响


    无论是 Intel 还是 AMD，所有系统都面临风险，且补丁过程可能非常痛苦。


    Meltdown 和 Spectre 因其是过去 20 年来发现的最严重漏洞而成为全球头条。如果你使用的是过去 20 年内制造的 CPU 的设备，那么你几乎肯定受到了影响。整个
    12 月关于 Intel CPU 问题的传闻不断传出，其可能产生的影响规模是无法预测的。更波折的是，由于一个“兄弟级”漏洞，甚至 AMD（以及某些 ARM）CPU
    也与 Spectre 一起面临风险，这很显然表明这是一个真实的威胁。Spectre 利用了 CPU 中乱序指令执行的一个漏洞。这在本质上是 CPU 在等待从
    RAM 接收大量数据时，继续处理少量数据（乱序执行）的一种方法。如果有必要，必须丢弃已经处理的数据。


    ![](img/47c577d3c443392bbdb486d8e17c4a70_5_0.png)


    Meltdown 最初由 Google Project Zero 在 2017 年年中发现，并被另外两组研究人员独立检测到。通过利用推测处理数据与检查之间的延迟，研究人员发现可以在没有密码或加密密钥的情况下读取内核，且虚拟化并不会产生影响。


    Intel 和 AMD 芯片以及 ARM 处理器都受到了影响。对于攻击者来说很难实现，但防御也同样困难。Spectre 强制通过推测执行泄露数据；研究人员已通过原生代码和
    JavaScript 实现这一点。


    在进入公共领域时，Linux、macOS 和 Windows 都在几周内通过修复或补丁接收了修复漏洞的更新。将内核与 Meltdown 漏洞及任何读取数据的攻击尝试进行隔离，其副作用是导致在某些情况下，你的
    PC 性能下降高达 30%。


    后者意味着沙箱机制被绕过，这本身就是一个大问题。


    更糟糕的是，在微软发布修复程序后，某些 AMD 系统仍在等待补丁。该行业正受到驱动程序不稳定的影响，而 Intel 无需担心 Intel 或 Broad CPU
    上的 Spectre。不过，Intel 的建议很简单：“用户应继续应用其系统和操作系统提供者推荐的更新。”


    ![](img/47c577d3c443392bbdb486d8e17c4a70_5_1.png)


    树莓派等基于 ARM 的设备对这些问题免疫——尽管并非所有的 Linux 用户都应该等到他们的发行版发布带有补丁的 4.1.14 内核稳定版本——原因是 Linux
    开发者一直不知情。正如稳定分支维护者 Greg King 所观察到的：“对我来说，这需要很长时间才能修复。”


    ## 软件


    ### 开源庆祝 20 周年


    距离“开源”这一术语首次诞生已经二十年了。


    作为一个教育和倡导组织，旨在促进开放开发，并在其 20 周年之际承担了额外的使命。OSI 于 1998 年 2 月在加利福尼亚州帕罗托成立，它是在创建“开源”概念的策略期间产生的成果。


    在 1998 年，格局完全不同。开源的概念、共享代码以供重用和修改、甚至是自由软件，对人类来说已经完全失传，对其他人来说只是一个边缘现实。然而，感谢于 Linux
    和开源倡议组织（Open Source Initiative）的努力，我们生活在一个不断向集体行动的世界。


    - 长期被视为开源敌手的微软于 2017 年作为高级赞助商加入了开源倡议组织。


    源自 Bruce Prence 编写的 Debian 自由软件指南以及在年度会议上的精炼建议，开源倡议组织被 OSI 采纳并引入了 FOSS（自由和开源软件）和
    FOSS（自由和开源）术语。由 Nick Vidal 设计，1998 年 11 月，OSI 的“钥匙孔”标志出现在软件中。


    将其描述为所有参与技术的人的重大里程碑，OSI 正在以这种方式庆祝这一周年，并在一年内组织了多次活动，包括最大的开源会议和全球协作。


    该网站提供了各种方式来参与纪念，并分享那些让开源成为宝贵资产的重要成就和贡献。


    ISCDA、OSCON、Open Source Summit、FOSSaia、Campus Party 和 Linux.com. 在全年不同时间举行。


    开源本身已经启动，你可以在 https://opensource.org/events 找到活动地图的详情。该网站展示了参与纪念的各种方式，以及加入国际开源开发者和专家网络，分享让他们开源成为宝贵资产的故事。


    > 你可以在 https://opensource.org 了解更多关于 OSI 的信息。


    ## 发行版动态


