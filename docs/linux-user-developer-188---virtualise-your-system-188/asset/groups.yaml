    Nextcloud 13 发布。之后，我们对 14 没有任何实际计划。意味着，14 也会到来——我们尝试快速迭代。


    服务器端加密的一个点是，如果你丢失了手机，你不需要重新加密，但我们用一个密钥加密文件，然后用公钥对密钥进行加密。所以当你得到新手机时，你不需要重新加密文件，我们在端到端加密中唯一的相同机制就是必须上传整个文件夹以及可能的几个
    GB 的数据，仅仅因为你和其他人分享了。


