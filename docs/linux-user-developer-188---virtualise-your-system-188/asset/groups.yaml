    # Getting started with the Pimoroni Rainbow HAT


    # Combine LEDs, touch buttons and a sensor reading to create a real-time temperature
    display


    Dan Aldred is a Raspberry Pi enthusiast, teacher and coder who enjoys creating
    new projects and hacks to inspire others to start learning. He is currently working
