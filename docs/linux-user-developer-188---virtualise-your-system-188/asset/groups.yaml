    # Virtualisation agility


    KVM gives you the tools to prepare for, and handle any disaster


    ![](img/47c577d3c443392bbdb486d8e17c4a70_23_0.png)


    Being able to provision new machines faster is great, but virtualisation allows
    you to recover from disaster (or avoid them altogether) in a fully automated fashion.
    With KVM you can take backups of VMs, roll back VMs to snapshots, and recreate
    machines and environments if problems arise.


    A VM snapshot is essentially a copy of a VM disk at a point in time. This snapshot
    preserves the state of the virtual disk. A snapshot helps preserve a VM''s current
    state and can be used to revert it in time when required.


    Trigger-happy?

    Snapshots are usually used to preserve a VM''s state before a potentially destructive
    operation. For example, you might want to make changes to your database server.
    If you are unsure how the change will affect the server or the network, take a
    snapshot first.


    # A VM snapshot is essentially a copy of a VM disk at a point in time


    One of them is that snapshots only work on VMs that have disks in the qcow2 format.
    If you don''t want to use your disks in any other format than qcow2 - you can
    convert them using qemu-img (and even if they are already working, you should
    take a snapshot before making changes).


    If something goes wrong, it''s no problem; just revert to the snapshot of a working
    state and you can continue going.


    We mentioned earlier that qcow2 disk format has snapshot support.


    Taking snapshots is easy.


    You can take snapshots using the graphical virt-manager tool. Double-click the
    VM you want to snapshot. If your machine is not in qcow2 format, it will ask you
    to convert it at the end; click OK to display the snapshot window. When it''s
    the first time you launch it for the first time, the left pane will show all snapshots
    and the right pane will show details about the snapshot, including its name and
    the VM''s state, along with a description and screenshot.


