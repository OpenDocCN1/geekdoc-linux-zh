  mdcn: "\n# 教程\n\n# Arduino\n\n## 第二部分\n\n## Arduino 录音机：将你的项目变为产品\n\n按钮、LCD 显示器和硬件中断将把这个项目变成一个易于用户的产品原型。\n\
    \n### Alexander Smith\n\n他是一位计算物理学家。Alex 向研究生们教授 Arduino，并不鼓励人们手动进行实验室工作。\n\n\
    在本教程的第一部分中，我们使用组装的麦克风电路和电阻分压数模转换器创建了一个录音机风格的设备，它具有语音录制和回放功能。录音质量本接近电话水平，但我们希望获得实时反馈。回放变得即时时，且只会播放整段录音。\n\
    \n在教程的这一部分，我们将向你展示如何将这个设备——考虑到组件价格如此低——变成一个可以被用户轻松控制的设备。如果在一个印制电路板上组装并作为 DIY 套件出售，只要有人有意，该项目甚至可以成为一种商业产品。\n\
    \n在教程结尾留下的电路基础上，你将首先将 Arduino 连接到一系列按钮，用户可以通过这些按钮通过存储的音频录制来控制设备的模式和电路。你将编写一个外部中断，使用用户的输入优先于任何正在进行的任务。通过添加一个\
    \ LCD 向用户提供反馈，他们将能够控制完成的设备。\n\n## 创建物理用户界面\n\n首先为电路获取一些基础组件：至少五个电阻（100 欧姆即可）和至少一块干净的面包板，或者在我们在上一个教程中使用的数模转换板上使用大约\
    \ 30 行连续的行。将按钮放置在面包板的中央脊脊上，使连接点位于两侧。每个按钮的引脚数量取决于按钮的样式，但如果超过两个，首先确定当按钮被按下时形成了哪些连接是重要的。\n\
    \n![](img/47c577d3c443392bbdb486d8e17c4a70_47_0.png)\n\n# 资源\n\n- Arduino Mega\n\
    - 面包板\n- LCD 显示器\n- LED\n- 按钮\n- 电阻\n\n可用的教程文件：\nfilesio.co.uk\n\n按钮按下时。你应该安排每个按钮，使得面包板上任意两行（跨越脊脊）与按钮的“两侧”之间的连接在开始时是电隔离的。如果你不确定哪些引脚由按钮连接，请用万用表连续测试它们。\n\
    \n在引线的一侧，将电阻连接到沿面包板边缘运行的平行轨，在按钮的另一个“侧”，连接到面包板的负极轨。LED 是有方向的，因此以正确的方式放置它们非常重要。长引脚应该连接到电路的正极，短引脚指向负极。如果\
    \ LED 长度相同，请查看内部两个金属部分之间是否有脊线。此脊线在正引脚处应该更高。\n\n![](img/47c577d3c443392bbdb486d8e17c4a70_48_0.png)\n\
    \n# 连接 Arduino\n\n将 Arduino 的 5V 和 GND 端子分别连接到正极和负引线。如果设置正确，当按下相应的按钮时，每个 LED 都应该亮起。当每个按钮被按下时，5V\
    \ 和正引脚之间形成连接，在两个 LED 端子之间产生电位差（电压）。由于负极未连接，电流流过电路并点亮 LED。使用跳线线将每个 LED 的端子连接到 Arduino\
    \ 的数字引脚（如果你没有使用数字引脚）。打开设置第一部分的草图。在 `loop()` 中，你将有很多 `while` 块，其条件在设备被按下或重置时运行。你也可以使用\
    \ SD 卡保存数据，但现在需要将所有设备状态设置为“关闭”开始。声明你的变量和常量，并在 `setup` 中，为每个新按钮标记引脚：\n\n```cpp\n\
    pinMode(pinInput, INPUT);\npinMode(playPin, INPUT);\npinMode(stopPin, INPUT);\n\
    ```\n\n你可以根据需要添加尽可能多的按钮。如果你使用的是 Arduino Mega，有大量的空闲引脚和空间供情况下使用。\n\n```cpp\nvoid\
    \ updateState() {\n  counting = 0;\n  if (digitalRead(pinRead) == HIGH) {\n  \
    \  counting = 1;\n  }\n}\n```\n\n在处理按钮后，你应该有目的地使用 LED 和颜色来告知用户如何使用设备，就像封面包含的那样，我们增加了“下一首”和“上一首”按钮。\n\
    \n## 输入\n\n要检查数字引脚的状态，你可以使用 `digitalRead()` 函数。如果所选引脚和地之间的电压小于 3V，它将返回 0 ('LOW')\
    \ 或 1 ('HIGH')；如果电压更高，则返回 1 (HIGH)。这就是如何让 Arduino 在按下按钮时亮起，并确定用户选择了什么模式。你随后设置一系列标志并在\
    \ `loop()` 中相应地执行任务。要创建一个中断，使用 `attachInterrupt()` 函数并在 `loop()` 的最顶部调用它。该函数应将所有标志设为\
    \ 0，然后逐个检查每个按钮引脚是否设置为 HIGH，如果是，则切换相应的 LED。\n\n> 我们需要让 Arduino 在按下按钮时工作，并确定用户选择的模式。\n"
