    控制面板在它发布的版本中允许你批量操作已安装的程序。你可以在下载和安装软件时继续使用该操作系统，这是无价的迭代。一些亮点之一是应用商店包含了 LibreOffice、VLC、Firefox、Thunderbird、WinRAR、ReUninstaller、Adobe
    AIR、网络等。


    此版本最大的特点な是是改进的系统支持。ReactOS 4.7 能够处理 ext2、ext3、NTFS 和 FAT 分区。开发者声称 ReactOS 现在支持的文件系统比
    Windows 版本的总和多。


    其他与文件系统相关的改进包括 Windows 2003 文件工具的开源实现。其专有属性包含另一个版本的 FAT 文件系统。除了这些显性功能外，在后台，开发者在系统的内核中实现了新的
    API，并修复了内存中的某些漏洞，以进一步提高操作系统的稳定性。


    ReactOS 4.7 提供两个版本。一个 Live ISO 镜像，旨在帮助在硬件上测试该操作系统。一旦你对一切运行正常感到满意，可以使用“仅安装版”将 ReactOS
    固定到计算机上。该操作系统的安装与任何其他操作系统一样简单，除了将操作系统传输到 USB 驱动器上。得益于 ReactOS Hackfest 的工作，ReactOS
    可能无法在所有计算机上成功地从 USB 启动。


    由于 ReactOS 仍被视为质量测试版（quality-alpha），最好将其安装在物理机上。更好，你可以使用 QEMU 和 VirtualBox 等虚拟化工具测试操作系统，这些工具对处理不同操作系统也有更好的支持。


