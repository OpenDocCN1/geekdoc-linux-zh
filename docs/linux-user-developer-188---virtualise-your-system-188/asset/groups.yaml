    clean:\n\trm -f *.o\n```\n\n![](img/47c577d3c443392bbdb486d8e17c4a70_37_0.png)\n\
    \n# 构建目标名称 (BUILT-TARGET NAMES)\n\nJava。当我们编写匹配规则时，我们需要问自己，规则的先决条件是否是由其他规则构建的，或者我们期望它们存在于文件系统中（通常它们是第一类源）。在这种情况下，我们应该使用带有单冒号的终端规则；在第二情况下，我们应该使用带有双冒号\
    \ :: 的终端规则\n\n| 目标 | 说明 |\n| :--- | :--- |\n| .PHONY | 将此规则的所有依赖项视为伪目标，而不是文件 |\n\
    | .DEFAULT | 此规则的配方称为“默认”配方；如果它列为 .DEFAULT 的配方，当没有其他适用规则将使用默认配方 |\n| .IGNORE |\
