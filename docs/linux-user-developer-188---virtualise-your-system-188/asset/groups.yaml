    of a Racket program is similar to the structure of a program in a writing language
    such as Python or Javascript. A program is a mixture of definitions—which define
    functions and variables—and commands. If we use the Dracket IDE, we can separate
    these out by writing our definitions in the prompt and putting our commands into
    the REPL. When we want to test our code, if we type the command (display "Hello,
