    ## DIY 解决方案


    如果你是一个“技术折腾者”（denouser）而非普通用户，你可能会考虑创建自己的防盗工具和设备。我们已经看到，纯软件的报警器寥寥无几，而且远未达到完全实现该功能的程度。在
    Windows 下，增加额外的保护层是有益的，即使它操作起来并非 100% 完美。它必须提前准备好。如果这个创新的想法是有用的，而且希望除了花费时间外不需要投入太多精力，那么它就值得考虑。


    自制报警器的权重优势在于，它可以完全按照你想要的方式运行。


    尽管某些功能可能有用，但除非它们很便宜，否则肯定很贵。你可能会发现很难选择添加它们。例如，你可能会发现检测 Wi-Fi 信号的模式比检测某人在你和访问点之间走动更容易。如果这能提供检测笔记本电脑被盗的手段，即使它的效果不像笔记本电脑中那样普及。某些产品（不仅仅是联想
    ThinkPads）具有某种现成的“驱动器活动保护系统”（DAPS），可以在笔记本掉落时锁定硬盘以防止损坏。


    最后，我们不想要那种大到能把盖子震掉的报警器，所以请注意报警触发时的盖子和盖子开关。


    另一种替代方案是使用运动检测。几乎所有的智能手机都能做到，而且电池可以使用一年或更久，这比 Wi-Fi 耗电得多。如果你打算在外部电池上运行并准备定期充电，这不再是一个劣势，而是一个更大范围的优势。


    另一个你可能想尝试的项目是基于带有加速度计的小型板的提示报警器。查看 Photon (www.photo.com)，由于其尺寸和重量，它可能是一个竞争者。Photon
    还内置了蓝牙，因此它提供了许多其他功能。


    另一个特别实用的计划是 RuuviTag (https://tag.ruvi.com)，它采用纽扣电池供电紧凑电路板，封装在防水外壳内，包含了各种传感器。


    学习如何制作一个类似于 p62 的 DIY 基础套装。包含增值税的价格 69 欧元，对于使用者来说约为 76 英镑。


    针对物联网应用，因此你可以用它来真实世界的监控实验。


    缺点是，大多数小型单板计算机（包括 Photon 在内）使用的是锂电池而非蓝牙。对于一个必须在内部运行的标签来说……


    ### 快速指南：保险


    保险对于贵重设备很重要，但务必确保你的设备得到了充分覆盖。


    不同国家、保险公司之间的细节不同，但有两件事你需要检查：你的家庭保险是否涵盖你带出户的物品？如果设备用于业务，它是否在涵盖范围内？


    通用保险策略提供的覆盖可能不足以涵盖你的科技设备提供专门保险。


    ## 功能 保护技术


    # 自制报警器的权重优势在于，你可以精确定义它喜好的运行方式


    www.linuxuser.com


    ## 如何做：制作背包信标


    ### 1 背包信标


    这个项目是制作你自己的追踪设备的简单方法，你可以以隐蔽的方式将其塞在背包里。本质上，你正在做的是 RuuviTag 变成你的近距离信标，以便使用 Google
    的开放信标格式 Eddstone 进行追踪。首要任务，是确保你通过刷写运行了 Eddstone 的蓝牙。RuuviTag 设置为空中下载（OTA）更新，因此很容易刷写。我们使用
    Moto G4 作为我们的智能手机，因此你需要从商店下载 nRF Connect (http://bit.ly/nRFConnect)。


    ### 2 进入引导加载程序 (bootloader)


    你应该在手机上访问 lab.ruuvi/ 下载应用，使用 ''RuviTag'' 链接并下载。要刷写 RuuviTag，我们首先需要让进入引导加载程序。你可以通过附带的金属夹将其从外壳中取出。在
    RuuviTag 上，你会看到两个标记有数字的按钮。在插入时按下标记为 2 的按钮，直到看到红灯。接下来，打开 nRF Connect 并向下滑动找到你的设备。一旦找到，点击“Connect”并选择板上将转烁的点。


    ![](img/47c577d3c443392bbdb486d8e17c4a70_63_0.png)


    ### 3 准备刷写


    在应用图形界面的右上角有一个微小的 DFU 配置，你需要点击它。启用此后选择你想要使用的文件类型。默认的“Distribution package ZIP”是正确的，点击“OK”并启动
    RuuviTag 固件。这将开始更新你的 RuuviTag。（注意：如果你的固件实际名为 ''weather_update''，进度条将显示“Application
    has been sent”并与 Ruiboot 断开连接。现在你得配置你的信标了。）


    ### 4 准备就绪


    回到 lab.ruuvi/ 下载第二个名为 ''Eddstone'' 的链接。回到第 3 步并遵循相同的过程，然后选择 edstone_file_1、2 或
    3 进行上传


    ### 5 配置你的信标


    前往 lab.ruuvi/ 下载。回到第 3 步并遵循相同的过程，然后选择 edstone_file_1,2 或 3。首先打开 nRF Connect (http://bit.ly/nRFConnect)。一旦找到设备，点击“Connect”并选择板上将转烁的点。


    让 RuuviTag 运行。它就在你的背包范围内。如果笔记本电脑掉落，它会触发报警。


    ### 6 测试你的背包


    在大多数手机上，你都可以通过该应用查看信标的距离。如果笔记本电脑离开了背包范围，它就会报警。


    ### 7 总结


    通过这种方法，你可以以极廉的价格为你的笔记本电脑防盗。虽然它不是完美，但它是一个很好的开始。


