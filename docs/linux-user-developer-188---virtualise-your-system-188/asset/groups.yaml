    # 教程


    # Pimoroni Rainbow HAT


    ![](img/47c577d3c443392bbdb486d8e17c4a70_73_0.png)


    # 开始使用 Pimoroni Rainbow HAT


    # 结合 LED、触摸按钮和传感器读取，创建一个实时温度显示


    Dan Aldred 是一位树莓派爱好者、教师和编码员，他喜欢创建新项目和各种黑客技巧来激励他人开始学习。他目前正在研究树莓派 Google Home Assistant。


    ![](img/47c577d3c443392bbdb486d8e17c4a70_73_1.png)


    # 资源


    - 树莓派 Pi

    - Pimoroni Rainbow HAT

    https://www.pimoroni.com/products/rainbow-hat-for-android-things


    ```bash

    打开窗口并逐行输入以下代码行。完成后，重启你的树莓派。

    sudo update

    sudo upgrade

    sudo curl -sS https://get.pimoroni.com/Rainbow

    bash

    ```


    # 02 字母数字显示段


    为了开始学习，让我们尝试一个简单的程序来显示一些文本。这四个显示块有多种颜色，可以用于显示温度、压力甚至当前时间。打开你的 Python 3 编辑器并输入以下代码。


    ![](img/47c577d3c443392bbdb486d8e17c4a70_73_2.png)


    Pimoroni 擅长为树莓派制作出色的硬件扩展板（HATs）。去年他们推出了 Rainbow HAT，正如预意那样，它堆叠了许多传感器、输入和显示器，以探索你的兴趣。你可以将其用作气象站、时钟、流量灯或完全不同的用途。


    本教程将带你了解 Rainbow HAT 的一些主要功能，例如控制 LED 和读取温度。然后我们将开始编写十个 LED 的代码：就像 LED 和 Rainbow
    HAT 迷你。将它们与内置的压电蜂鸣器和三个触摸按钮结合，你将拥有一台全功能的音乐迪斯科机。


    在教程的最后部分，我们将创建一个实时温度显示器，随着春天温暖的临近，温度升高，它会改变并混合蓝色、橙色和红色色调。


    此程序导入了模块，设置要显示的文本并在块上显示文本。尝试添加你的四个字母单词（小心操作……）。


    ```python

    import rainbow

    rainbow.display.print_str("LU&D")

    rainbow.display.show()

    ```


    # 03 音乐蜂鸣器


    HAT 内置了一个压电蜂鸣器，可以播放不同的频率，产生不同的音符。音符基于标准的 MIDI 值，其中 60 是中五八度的 C。第二个值是音符播放的秒数。在移动下一个音符之前，记得为每个单独的音符添加更多笔记。


    # 安装 HAT


    关闭你的树莓派，将 Rainbow HAT 的 GPIO 插针插入 GPIO 引脚中——所有的 HAT 设计得非常完美，因此硬件会完全到位。所有 Pimoroni
    产品的安装过程都是干净的，并且包含了大量的示例代码和项目。启动你的树莓派，打开终端。


    ```python

    import rainbow

    rainbow.buzzer.midi_note(60, 2)

    ```


    # 全尺寸 LED


    HAT 顶部的七个主 LED 较大，并且可以调节颜色和亮度。要打开所有 LED，我们使用第 3 行的 `set_all` 代码。其后跟着四个值：前三个是红、绿、蓝的量，最大为
    255。最后一个数字设置亮度，级别 1 为全亮，0 为最低。要关闭 LED，我们将所有值设为 0（第 6 行），然后显示 LED。


    ![](img/47c577d3c443392bbdb486d8e17c4a70_74_0.png)


    添加以下代码尝试颜色，可以看到什么效果。


    # 读取温度


    此程序演示了如何读取温度并显示在显示块上。首先，创建一个变量来存储温度。然后使用 `rainbow.temperature()` 代码读取数值（第 2 行）。读取值需要转换为浮点数并在块上显示（第
    3 行）。然后在第 4 行显示读取结果。注意，温度比实际值高，这是因为 CPU 和 HAT 会产生剩余热量。


    ```python

    import rainbow

    temperature = rainbow.weather.temperature()

    rainbow.display.print_float(temperature)

    rainbow.display.show()

    ```


    # 微型 LED


    HAT 有三个微型 LED，可以作为指示灯或状态灯。第一个是红色，第二个是绿色，第三个是蓝色。这些颜色可以根据需要进行调整。


    # 单独 LED


    你也可以单独控制每个 LED。如果你总共有 16581 种颜色，这将非常有用；结合亮度设置，你将拥有任何项目所需的组合。使用 `rainbow.set_pixel(position,
    number)` 控制单独 LED，在示例中 `position` 是物理 LED 编号（从 0 开始）。接下来的三个数字对应红、绿、蓝（RGB）。


    ```python

    rainbow.set_pixel(0, 255, 0, 0)

    rainbow.display.show()

    ```


    *(注：原文文本中存在大量重复的段落，根据“不要重复输出原文”的要求，此处仅翻译核心内容)*


