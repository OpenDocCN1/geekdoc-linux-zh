    # InspiringOS


    # Open sourcing conservation


    ### Chris Thornett meets the man behind the Arribada Initiative and discovers
    how open approach to technology is breaking barriers and slashing the cost of
    protecting the natural world


    - **Alasdair Davies** is the founder of Arribada Initiative, a Technology Specialist
    at the Zoological Society of London and Shuttleworth Foundation.


    - **KEY INFO**

    Alasdair Davies established the Arribada Initiative in 2017 to support products
    and projects that bring affordable, customisable technology to the field of conservation
    through the power of open development.

    Other people involved include Naturebytes, http://naturebytes.org.


    **What makes Arribada special?**

    The stand out open source project for Arribada is reason, it is done right. "Think
    about what it is great for for conservation," says Davies, he believes has vast
    potential.


    ![](img/47c577d3c443392bbdb486d8e17c4a70_31_0.png)


    Above: One project the Arribada Initiative monitors Adélie penguin populations
    in Antarctica all year round.


    > conservation isn''t cheap. Fortunately, open hardware and software has the potential
    to transform how we protect and monitor our planet. It''s about using technologies
    that offer the most value for the least, it''s important.


    Alasdair Davies over Volff from the Arribada hardware technologist, who is speaking
    to us a few days before the Baseline conservation and open source approach. A
    turtle conservation programme on Prince Island, which is off the west coast of
    Africa in the Gulf of Guinea, uses tracking system on green sea turtles when they
    return to nest. You can see some of the remarkable video here: https://youtube.be/jfHL44I


    Tagging animals is inherently expensive, says Davies, but as is said the Shuttleworth
    Fellowship which now works with him, "I want to talk about the problem of access
    to affordable and open conservation technologies." Since being accepted as a Shuttleworth
    fellow and through unrivalled organisation, the Arribada Initiative, has been
    working on practical open conservation solutions, his green sea turtle is probably
    the most well-known and recently covered by the Raspberry Pi Foundation.


    Tagging sea turtles, Davies says, can cost £4,000 a tag. But that''s only if you
    follow the traditional route: "If you break down what we''re in a tag, itself
    is an embedded computer," says Davies. Using a Raspberry Pi as a module, and RF,
    with a few management systems as such you can make a very, affordable tag for
    yourself with the right components. In hardware terms, Arribada''s green turtle
    tagging system uses a Raspberry Pi Zero HAT camera module, and two lithium-ion
    batteries. it costs around £200 a tag (see Tagging Turtle right).


    Working with IRNAS - the Institute for Development of Advanced Systems in Systems,
    within


    # WHICH INSPIRING PROJECT SHOULD WE COVER NEXT?


    Email us about the projects you love linuxuser@future.com


    ![](img/47c577d3c443392bbdb486d8e17c4a70_32_0.png)


    # SPOTLIGHT


    # Tagging turtles


    When Davis discusses conservation, it''s clearly a lifelong passion for him that
    stems from backpacking around Europe in his late teens, exploring national parks
    and soaking up the natural world. But when he talks about his work with sea turtles
    for the Principe Trust he becomes almost an almost man.


    "One of the really important projects to me was the sea turtle tagging on Principe
    Island," says Mark Shuttleworth, founder of Canodil, who has invested in the island
    itself – Principe to essentially create an ecotourism project. Shuttleworth needed
    a conservation program to manage it responsibly, explains Davis. "I have initially
    got to go into there. Basically approached me, ''How can you help us save the
    sea turtles to stand outside marine area can you work to develop an open solution?''
    So time, I''m travelling out there with a few members who have helped to develop
