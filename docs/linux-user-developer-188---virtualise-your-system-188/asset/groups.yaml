    Adobe AIR, the network and more.


    The biggest featured of this release, has to be improved system support. ReactOS
    4.7 is equipped to handle ext2, ext3, NTFS and FAT partitions. The developers
    claim that ReactOS now supports more file systems than Windows versions.


    Other file system-related improvements include the addition of an open source
