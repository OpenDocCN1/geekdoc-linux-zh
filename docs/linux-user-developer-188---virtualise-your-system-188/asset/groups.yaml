    ## OpenSource


    06 News & Opinion | 10 Letters | 12 Interview | 15 Kernel Column


    ## HARDWARE


    ### Linux hit by Meltdown and Spectre security vulnerabilities


    Intel or AMD, all systems are at risk, and patching can be painful.


    Meltdown and Spectre have made headlines around the world for being the most serious
    vulnerabilities found in the last 20 years. And if you''re using a device with
    a CPU built in those last 20 years, you''re almost certainly affected. Problems
    with Intel CPUs have been rumoured throughout December, the sheer scale of what
    would come dubbed could not have been predicted. Add to the twist that even AMD
    (and some ARM) CPUs are at risk alongside Spectre thanks to a ''sister'' bug,
    and it''s clear that this is real. Spectre exploits the advantage of a bug in
    out-of-order instruction execution in CPU. This is essentially a way for CPUs
    to continue processing small amounts of data (out of order) while waiting for
    larger amounts to arrive from RAM. If necessary, the data that is already processed
    must be discarded.


    ![](img/47c577d3c443392bbdb486d8e17c4a70_5_0.png)


    Meltdown was first discovered by Google Project Zero in mid-2017, and independently
    detected by two other groups of researchers. By taking advantage of a delay in
    processing data speculatively and checking it, researchers found that the kernel
    could be read without a password or encryption key, and virtualisations make no
    difference.


    With Intel and AMD chips are impacted, as well as ARM processors. Tough for an
    attacker to achieve, it''s also more difficult to defend. Spectre forces to leak
    data via speculative execution; researchers achieved this with native code and
    JavaScript.


    By the time it was in the public domain, Linux, macOS and Windows all received
    updates to patch the vulnerability, via a fix or patch within weeks. Isolation
    isolating the kernel from the Meltdown exploit and any attacking attempt to read
    the data, has the side effect of slowing your PC''s performance, by up to 30 percent
    in some scenarios.


    The latter means that sandboxing is bypassed, which is a major problem in itself.


    Sealing with these problems, some AMD systems have been left to patch after Microsoft
    issued a fix. The industry hit by driver instabilities, and Intel has nothing
    to worry about Spectre on Intel or Broad CPUs. Intel''s advice is simple, though:
    "End-users should continue to apply updates recommended by their system and operating
    system providers.


    ![](img/47c577d3c443392bbdb486d8e17c4a70_5_1.png)


    Above ARM-based devices such as the Raspberry Pi are immune to these issues—though
    not all Linux users should wait until their distro releases a stable build with
    the patched 4.1.14 kernel - for the simple reason that Linux developers have been
    kept in the dark. As stable branch maintain Greg King has observed: "As for myself,
    this is going to take a long time to fix."


    ## SOFTWARE


    ### Open source celebrates its 20th anniversary


    It''s twenty years since the ''open source'' moniker was first coined.


    Designed as an educational and advocacy organisation to promote open development,
    with an additional responsibility to missions in its 20th anniversary. Founded
    in February 1998 in Palo Alto, California, the OSI was the result of a strategy
    created during which the ''open source'' concept.


    In 1998, the landscape was very different. The notion of open source, sharing
    code for reuse and modification, and even free software was completely lost to
    mankind, and a fringe reality to the rest. Then thanks to Linux and the efforts
    of the Open Source Initiative, we live in a world that continues to move towards
    collective action.


    - Long seen as the enemy of open source, Microsoft joined the Open Source Initiative
    as a premium sponsor in 2017.


    Derived from the Debian Free Software Guidelines composed by Bruce Prence and
    refined suggestions in an annual conference, the Open Source Initiative was adopted
    by the OSI in its Formation. After the term was embraced by many (Free) and imported
    the terms FOSS (Free and Open Source Software) and FOSS (Libre and Open Source).
    By November 1998, the OSI''s ''keyhole'' logo had been designed by Colin Viebrock,
    and the OSI''s ''Certified'' mark began appearing on software.


    Describing it as a huge milestone for everyone involved with technology, the OSI''s
    Nick Vidal Linux User & Developer that they are celebrating the 20th anniversary
    in style, organising several activities in the year to commemorate this special
    occasion, including the largest open source net and worldwide collaborations in
    major technical conferences.


    ISCENDA, OSCON, Open Source Summit, FOSSSaia, Campus Party and Linux.com.au take
    place at various times throughout the year.


    Opensource itself has already launched, and you can find details of the map case
    events at https://opensource.org/events. The site features various ways of adherents
    to embrace the anniversary, as well as joining an international network of open
    source developers and experts to share their stories highlighting significant
    achievements and contributions that have made open source a valuable asset.


    > You can find out more about the OSI at https://opensource.org.


