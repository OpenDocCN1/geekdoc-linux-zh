    \ \\$(pwd)/html:/var/www/html\n-p 80:80 wordpress\n```\n\n确保你设置了 WordPress 的环境变量作为\
    \ MariaDB 数据库的密码。`--link my_docker-db:mysql` 选项将 WordPress 容器连接到 MariaDB 容器，以便应用程序相互通信。`-v`\
    \ 选项充当卷的作用，并确保容器 `/var/www/html` 文件夹下的内容与当前目录同步。\n\n该命令将在后台启动容器并将其放入指定的设置中。你可以通过\
