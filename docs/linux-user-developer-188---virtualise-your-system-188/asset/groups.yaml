    ![](img/47c577d3c443392bbdb486d8e17c4a70_87_1.png)


    ReactOS is an open source operating system based on the design principles of Windows
    NT. It''s written from scratch rather than being a Linux-based system. The project
    aims to give users an environment similar to Windows, with software designed for
    binary compatibility with proprietary OS.


    It worked on bringing support for the ''mystyles'' file format used by Windows
    XP and has reduced visual glitches in many areas. It has also solved usability
    bugs related to the clipboard and desktop box to Windows. This adds to many new
    features like drag and drop behaviour, and the user experience feels a bit more
    refined. One major component that was improved, thanks to the project''s participation
    in GitHub Summer of 2017, in addition to the core, the developers are working
