    基于模板在其他虚拟机（VM）中安装你想要的所有组件。例如，为了部署一个包含许多科学应用程序的 CentOS 工作站实验环境，可以创建一个具有适当大小磁盘的虚拟机（我们将其命名为
    `template_CentOS-Labs`）并安装最新的工具。然后登录到该虚拟机并安装你需要的一切内容。设置好模板虚拟机后，你的工作就完成了。


    接下来，我们将移除系统配置，以便所有虚拟机都具有相同的名称和密码，且不包含你的私 SSH 密钥。如果不是这样，就很奇怪了。为了避免这种麻烦，我们将为每个镜像使用相同的密钥。除外，该工具还会移除
    SSH 密钥、为网络接口创建新的 MAC 地址、清理日志文件等。


    ```bash

    # $ virt-sysprep -d template_CentOS-Labs

    ```


    `-d` 选项允许该工具处理连接到指定客户机的所有虚拟磁盘。你也可以使用 `-a` 指定特定的磁盘镜像，例如：


    ```bash

    # $ virt-sysprep -a /var/lib/libvirt/centos.qcow2

    ```


    有关清理操作的更多信息，请输入 `virt-sysprep --list` 以显示它可以执行的 30 项任务列表。带有星号标记的任务将默认运行，而未标记的任务在需要时需要手动启用。使用
    `--operations` 选项后跟一个用逗号分隔的你想要执行的任务列表。


    ```bash

    # $ virt-sysprep --operations ssh-hostkeys,user- -d template_CentOS-Labs

    ```


    以上就是全部。你现在可以像操作演示中那样使用模板镜像部署虚拟机了。


    > 模板也是类似于快照的虚拟机副本，但用于快速克隆虚拟机。


    重要的是，你必须确保这台虚拟机永远不会启动，否则它将不再处于抑制状态，并可能导致通过这种方式部署的其他虚拟机出现问题。良好的做法是将要作为模板的虚拟机的 XML
    配置导出并复制其虚拟磁盘（使用 `-a` 选项），然后使用它来部署其他虚拟机。


    ## 如何操作


    ### 基于模板部署虚拟机


    ## 快速提示


    ### 自定义虚拟机


    阅读 `virt-sysprep` 工具的页面，它还可以通过添加用户或运行启动脚本来自定义虚拟机。


    ![](img/47c577d3c443392bbdb486d8e17c4a70_24_0.png)


    - 1 预处理镜像


    确保你想要使用的虚拟机正在运行。然后运行 `virt-sysprep` 命令来重置、取消配置虚拟机的任何特定于系统的设置。最好为它重命名并标记它（如 `template_CentOS-Labs`）以避免启动它。


    - 2 检查设置


    现在启动 `virt-manager` 并选择指定的模板虚拟机。右键点击并选择“克隆（clone）”，这将显示“克隆虚拟机”窗口。为克隆提供一个名称并花时间检查其设置。默认情况下，`virt-manager`
    会为任何连接的硬盘创建副本。


    ![](img/47c577d3c443392bbdb486d8e17c4a70_24_1.png)


    - 3 创建克隆


    为了避免以后出现问题，你应该更改虚拟磁盘的 MAC 地址。点击“网络”部分的“详细（Details）”按钮，并更改虚拟网卡的 MAC 地址。现在点击“克隆（Clone）”按钮开始复制过程。根据虚拟磁盘的大小，这将需要一些时间。


    ![](img/47c577d3c443392bbdb486d8e17c4a70_24_2.png)


    ## 功能


    ### 虚拟化你的系统


    ## 快速提示

    FQDN

    实时迁移要求两台机器都具有完全限定域名（FQDN），而不是命名为 localhost。


    ## 迁移虚拟机


    **通过将活动虚拟机迁移到另一台机器来确保最大的运行时间**


    迁移是将虚拟机从一个主机移动到另一个主机的过程，是虚拟化的关键特性之一。你可以迁移在线和离线虚拟机。离线迁移为目标主机提供客户机的镜像。当源主机上的内存释放后，虚拟机将在目标主机上恢复。为了避免停机，虚拟机必须使用共享存储池。这确保了迁移过程只需要向新主机传输一小部分时间（新主机需要传输内存到另一台主机）。实时迁移在迁移开始时不停止虚拟机，让客户在源主机上运行。


    将 `<source-host>` 替换为具有共享存储的机器 IP 或 地址。现在回到源主机并使用 `virsh` 命令迁移虚拟机：


    ```bash

    # virsh --live <vm-name>

    # virsh --migrate <user>@<remote-host>/system

    ```


    ### 为了避免中断，最好避免离线迁移


    将 `<vm-name>` 替换为你想要迁移的虚拟机名称，使用 SSH 详细信息以确认远程用户的身份验证，命令将提示你确认迁移。迁移可能需要一段时间，取决于网络，并且默认可能会报告错误，但你可以使用
    `--progress` 选项显示迁移进度。虚拟机在源主机上继续运行直到完全启动。使用 `virsh list` 进行验证。


    当源主机上的内存释放后，虚拟机将在目标主机上恢复。为了避免停机，虚拟机必须使用共享存储池。这确保了迁移过程只需要向新主机传输一小部分时间（新主机需要传输内存到另一台主机）。实时迁移在迁移开始时不停止虚拟机，让客户在源主机上运行。


    ## 快速提示

    ### 线迁移


    虽然 Docker 在官方存储库可用，但最好是从 Docker 仓库获取最新版本。获取官方脚本并执行它：`curl -fsSL https://get.docker.com
    | sh`。安装完成后，启动 Docker 服务并确保它在后续启动时自动运行：`sudo systemctl enable docker`。


