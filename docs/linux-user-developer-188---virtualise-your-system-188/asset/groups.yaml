    documentation section for assistance


    ![](img/47c577d3c443392bbdb486d8e17c4a70_81_1.png)


    - Hiawatha can also be used as a reverse proxy and as an application framework


    # Installation


    Cherokee has pre-packaged binaries in the repositories of some distributions as
    Fedora. On others, like Debian and Ubuntu you''ll have to compile the server from
    source. This process isn''t involved or prone to failure as it is for some other
    software, primarily because of Cherokee''s few dependencies.


    # Installation


    The cross-platform web server is officially available as a source tarball. Documentation
    points to sections with pre-compiled binaries for popular distributions including
    Debian, CentOS, Ubuntu and more. The monitor, an important component, is only
    available as source.


    # Noteworthy features


    Besides being easy to install, Cherokee offers some useful features. It supports
    FastCGI, PHP, CGI, TLS/SSL, efficient caching, and traffic-sharing features. There''s
    also support for popular web-app frameworks and app servers including those of
    Django, Ruby on Rails, Zend, Ghostfish and Collision.


    # Noteworthy features


    Hiawatha offers every experience from a modern web server. It has security features
    built in and configuration options to handle complex requests. The server uses
    the mTLS library instead of OpenSSL, and ships with its own encrypt script that
    picks relevant values from the server''s configuration files to generate a certificate.


    # Ease of administration


    Cherokee is designed to help configure virtually all aspects of the deployed web
    server. By default, it listens to localhost, but can be made to listen to any
    IP address on the network. The interface is intuitive and takes the pain out of
    overall deployment and administration tasks, such as virtual hosts and exception
    rules.


    # Ease of administration


    Hiawatha is easy to understand configuration that makes a more consistent way
    of configuring the web server deployment. Hiawatha also has a monitoring tool
    in the shape of a PHP that provides information and details about the web server,
    like bandwidth usage, number of requests, errors and issues encountered.


    # Documentation and support


    The project has everything from installation to advanced configuration issues.
    You can browse the usage guide directly, or jump to specific sections using the
    Help button in the administration section. The Cookie is interesting and helps
    up Cherokee for various tasks.


    # Documentation and support


    The project has all the usual outlets to guide users. The support section on the
    website points to a detailed how-to to configure everything from Hiawatha to serving
    all types of web apps. There are also forums to post questions and third-party
    providers.


    # Overall


    Cherokee has all the features you need to deploy modern web apps and is aided
    by ample documentation. The icing on the cake is the powerful tool that is easy
    to operate.


    # Overall


    A fast and lightweight web server that has several features to make it ideal for
    security conscious deployments. One of note is its configuration syntax that makes
    readable configuration files.


