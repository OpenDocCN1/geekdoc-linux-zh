    \n欢迎阅读这份英国和北美最喜爱的 Linux 开源（FOSS）杂志。\n在 Spectre 和 Meltdown 的风暴中，我们必须向那些快速创建新功能以帮助用户免受这些漏洞侵害的人们致敬。这是一项值得庆祝的艰巨任务。在杂志的核心部分，我们需要这样的内容——专栏作家\
