    # Pi Smart touchscreen


    # Open source smart home


    A stylish smart home project in San Francisco an elegant interface for home automation


    This project is an solution to a tricky problem with the affordable and useful
    #1 Raspberry Pi touchscreen. Peter Monaco''s mission was to create a touchscreen
    that sat flush with a wall for home automation without using any wires and so.


    What modifications did you need to make to the Raspberry Pi?


    Like said, space was at a premium. The Pi wouldn''t fit into the electrical box
    in the vertical dimension without some modifications. I replaced the touchscreen
    adapter by some jumper cables, but those were hanging too far to fit in the box.
    I decided to strip an end and solder them directly to the board. This saved me
    some vertical dimension by half an inch, which was needed.


    Also, you want to attach an Ethernet cable to the Pi, I had to make a sharp-turn
    to fit in the box. I was using a stiff end on it, so I made a home-made extension
    of Cat 5 cable, which is more flexible.


    ![](img/47c577d3c443392bbdb486d8e17c4a70_67_0.png)


    Your bezel came out really well. You''ve absolutely experienced with 3D printing
    - what printer did you use and do you have any advice for others wanting to replicate
    yours?


    You chose Home Assistant for the interface. What are you got plans for other home
    automation projects you''re planning?


    It worked for over two years now. I used a FlashForge Creator Pro and SketchUp
    for all my work, designing little items that make life much easier, like clips
    to hold the Christmas lights to the battery, or to hold my Wi-Fi


    I''m just starting with home automation. I added a few Wi-Fi switches (Switch-HS2202)
    and they''re working well. I also added some sensor to the fridge, and maybe some
    more later. It was important to me to make my home automation open source - I''m
    just thinking of some more ideas for the home. I looked around and settled with
    the Home Assistant project (home-assistant.io). It has adapters for everything,
    and is totally open. I used a small box for the Raspberry Pi in the closet. Then
    I found the HAADashboard-project, which provides a ready result, attractive for
    Home Assistant. I''m still working on the wall design for the Raspberry Pi.


    # It was important that my project was open source


    on the wall or a clip to a fixed box mount. I printed all the parts in PLA which
    made it easy. These were some of the larger parts I''ve made in PLA, and I have
    some problems with them at first. I had to fix the warping by increasing the bed
    temperature to 50 degrees Celsius. This included settings for the fan, min, and
    nozzle temperature of 200 degrees.


    What were the challenges and what did you face during development? Didn''t you
    have some useful feedback from your peers?


    # The design has a smart home touchscreen. Space-saving techniques did you need
    to?


    I didn''t have any space at all; I wanted the screen to be flush with the wall,
    so the electronics needed to go into an electrical box [in] the wall. The Pi hanging
    off the back of the touchscreen, the bezel didn''t fit properly until after a
    few modifications (which I had to make).


    My initial version was wrapping the parts in a USB case. I couldn''t connect it
    directly to the electrical box to mount to a point, so I needed to find another
    way. I ended up using a much larger box to fit it in. I got a lot of feedback
    that this approach didn''t feel safe, and one person suggested a use of a C extension
    cord that would work well. I replaced the USB case with it, for the suggestion,
    bought both parts, and updated the design. I also created a version that was working
    perfectly using the Raspberry Pi itself. No needed for a high-voltage connection
    at all. My final project demonstrates both methods of powering the screen.


    After squeezing the it in, there wasn''t much room left for the bezel, especially
    with all the high-voltage connections. I designed a set of three walls and slides
    that allow them to be inserted and easily removed. This created an L-shaped volume
    at the back that was large enough for some Monte (RJ sheathed cable), a case,
    and a USB power adapter. I once found a way to mount the bezel by using a bracket
    that screws to the box, and a bezel that slides into it. Once it''s assembled,
    the bezel is the best way.


    # Like it?


    For a full walkthrough of Peter''s project go to http://bit.ly/WantAFlushPi


    where he''s revealed the instructions for the touchscreen using 120 VAC (US) power
    over Ethernet.


    # Reading further


    Peter uses SketchUp for his design work, if you want to try it for this project,
    you can find all at https://github.thingiverse.com/2749782 records using Bezel_2
    and Faceplate_2.


