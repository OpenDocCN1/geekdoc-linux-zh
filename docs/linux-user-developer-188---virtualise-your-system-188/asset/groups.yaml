    # 访谈 Nextcloud


    ## 征服开源的协作云


    我们访谈了 Nextcloud，Frank Karlscheid 讲述了他最初创建一个尊重隐私的“开源 Dropbox”的构想。


    > Nextcloud 已被誉为许多专有云文件和共享服务的自托管、开源替代方案。但该项目植根于 opencloud，一直怀有宏大的目标。在过去的一年里，它发布了一系列更新，巩固了其安全协作平台。Nextcloud
    董事总经理 Frank Karlscheid 和市场经理 Jos Poortliet 同意讨论该项目最新的协作功能：Nextcloud Talk。


    我之前在 KDE 项目中，当然，KDE 是一个包含所有这些安全和数据保护等理念的自由 Linux 桌面系统。


    但在那时，我注意到越来越多使用 Linux 的人通过云服务将数据导入到 Dropbox。他们使用 Gmail。他们使用 Facebook（https://facebook.com）以及各种其他服务。我在想：“嗯，也许拥有一个免费、开源的客户端很酷，但如果有趣的内容发生在服务器端，那么自由又在何处呢？”


    所以当时的想法是，Linux 桌面应该与一个免费、开源、自主控制的服务器相结合。这就是最初的想法。


    我们的大多数读者可能熟悉 Nextcloud 和 opencloud，但我在这里是想给你们概述一下我们是谁。我很想知道这个主意源于哪里。


    Frank Karlscheid: 当然，这机机真的非常好，因为我一直在思考 Nextcloud —— Jos，如果我记错了请纠正我，我记得 Nextcloud
    是 opencloud 的生日吧，对吗？还是别的什么？


    所以多年前，我宣布了 opencloud。当时还没有给这个东西命名，所以我称它为“开源 Dropbox”，那是一个电梯式项目——开源服务器，带有所有客户端——一切。当然，它是免费的，这是主要的区别。它没有中心化服务，但你可以把它放在任何机器或你租用的机器上，或者像你所信任的某些托管中心那样的。


    你在 opencloud 和 Nextcloud 上的投入或已完成的工作，很大程度上受到了你在 KDE 工作期间经验的影响吗？


    FK: 很多。我参与 KDE 有很长时间。我在那里担任过几年的董事成员，我学习了 15 年开源社区是如何运作的，KDE 是其中一个志愿者驱动的发展优于企业赞助的案例，但这是一段旅程。


    所以这没有真正的捷径可绕过。它不像其他由公司开发然后发布的开源方式，即最后发布一个版本，然后说：“看，那是免费软件。”或者当然，它确实免费软件，但它不是像
    Android 那样以协作、开源的方式实现的：Android 虽然有源码，但只是从 Go 开始运行的。


    这就是在从过去十年的中期到后期，我所学到的这套开源机制是如何运作的。来自世界各地的成千上万人通过互联网，产出一个更好的开源产品，这在很多方面都比公司能产出的要好。对我来说是这样，而且，Jos，我不想替你说话，但我想：


    Frank Karlscheid 是 Nextcloud 和 opencloud 项目的创始人，参与了多个自由软件项目，曾担任 KDE 的副主席。


    Jos Poortliet 是 Nextcloud 的市场与传播经理，也是 KDE 团队的领先成员。


    ![](img/47c577d3c443392bbdb486d8e17c4a70_11_0.png)


    上述 Nextcloud 的功能方式与 Dropbox 等类似，它们很相似。你们的做法对我们的 openCloud 有了一点启发。Nextcloud 以像
    Dropbox 一样的方式运行，它是类似的。然后后来它是完全开放的，包含了文件同步和所有功能。我们有来自世界各地的许多贡献者，你们的做法无疑是一种启发。


    ## 也许我可能会问你一个可能的问题，你认为 Nextcloud 是一个桌面平台吗？


    FK: 很好，我们正在移动到有趣的问题。我会尝试填补这个空白——Nextcloud 它是如何变成现在的，然后——基本上，Nextcloud 现在是这个想法的继任者，这不仅仅是文件同步和共享。更多是协作。很多功能，在其他情况下，它在云端运行。


    那么它与桌面的连接如何？你会说是还是否？在那种情况下，一个云服务有一个桌面客户端，我们有 Android 和 iOS 的客户端，但它们还不充分。另一方面，我认为这些东西现在都应该在一起。如果我告诉人们（在很多年前之前），他们会问：“你在做什么？”所以如果你使用电脑，或者使用手机，或者使用平板电脑，那么到最后，这种用户体验将客户端和软件连接在一起。在某种方式上，它是移动和桌面体验的一部分。


    Jos: 我记得 2014 年我们非常开心的想法之一是，进入 KDE 的语境。例如，我们想要能够同步你的设置——面板以及你的其他应用程序，并在云端进行同步。你可以使用你的笔记本电脑，然后你会得到那些设置，你的账户也能工作。


    FK: 而且 Nextcloud 不仅仅是软件。这是一种不同的。Nextcloud 最有趣的事情之一是，我们推出了 iOS 和 Android 的原生应用——它们在平板和手机上运行。所以在
    iOS 上，你有灵活性允许 iOS 和 Android 集成原生应用。所以基本上你选择一个人，然后服务器。你点击通话按钮，应用打开了。你叫其他人，也可以视频通话。这一切都是通过
    Nextcloud 和服务器完成的，包含了所有元数据。所以基本上这非常有趣，对于用户体验，正如你提到的，我不知道它是什么。是移动应用吗？是服务器应用？还是桌面应用？我想它都是整合在一起的。


    > 用户体验现在将客户端和软件连接在一起。上述 Nextcloud 是 Talk 功能以及它对生态系统的集成。


    www.linuxuser.com


    ## 开源


    你的 Linux 新闻以及快速推进 Nextcloud box。Nextcloud 可能没有开发自有硬件的计划，但 Purism 打算在其 Librem 5
    手机中包含 Nextcloud，正如我们将在 Librem 5 笔记本电脑上做的那样。显然，运行完全自由软件的 Nextcloud。


    JP: 这关乎功能。我们需要沟通与人们交流。我的意思是人们说：“你们为什么不在 Nextcloud 中集成通话？为什么不集成 Matrix（一种通信协议）和其他东西？”因为你可以发消息，然后在群组里评论，或者点击头像开始通话。这在手机上可以运行，但你必须切换过去开始通话，这是一个退步。人们想要这个。


    我们仍然需要与社区和所有人讨论。最终，通过 Nextcloud，我们希望成为 Office365 和 Office 套件的真正竞争对手，但是100% 开源且100%
    自托管。这可能是我们未来几个月和几年的目标。


    在实现这一点之前，是否有某些功能是你搁的？


    JP: 有，那就是端到端加密。正如提到的，有一些我们一直想做的……我不知道。人们一直在要求，但我们才开始研究它。所以我们引导了它很长时间，但并不确定如何正确实现，而且我们还没有，这意味着我们没有网页界面。所以我们一直在思考如何在丢失平台协作和共享的情况下使用所有加密。


    去年我们似乎是从某些功能开始的。你希望的关键目标是什么？2018 年的目标是什么？


