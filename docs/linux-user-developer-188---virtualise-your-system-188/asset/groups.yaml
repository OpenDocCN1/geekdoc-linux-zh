    # 观点


    ## 内核列


    Jon Masters 总结了 Linux 内核内部正在进行的努力，以缓解最近发现的 Meltdown（熔融漏洞）和 Spectre（幽态漏洞）。


    除非你过去几周一直住在山洞里，否则你可能已经已经在许多处理器中发现了这几个新的安全漏洞。“Meltdown”和“Spectre”这两个名字引起了媒体的广泛关注，尽管它们有自己的名称。但除非你不使用
    Linux 内核或应用程序，处理器必须安排从更大的 RAM（内存）中加载值。虽然 RAM 很快，但远没有处理器的速度，它可以并行执行数百条指令；因为这些指令是立即存储在指令（i）缓存中的。


    因此，处理器会预测分支将走向何处并进行推测执行，对寄存器和内存（架构状态）的更改被存储在临时结构中，如果推测结果是错误的，处理器简单地丢弃这些更改，而处理器的“架构”状态保持不变。这种技术是推测执行的内置特性，直到最近，推测过程的行为像一个“黑盒”，细节上似乎是不可能的理解。


    ![](img/47577d3c443392bb486d8e17a70_14_0.png)


    Jon Masters 是一位 Linux 内核黑客，已经在内核领域工作了 22 年。自从他的职业生涯开始以来，工业界在许多高性能处理器中存在推测执行的常见做法。特别地，其中一种被称为“推测执行”的漏洞，允许处理器在知道是否实际上需要运行之前就执行代码。一个常见的例子是发生在软件分支中的，例如
    `if` 语句。这些分支控制流将程序带向几个可能的方向。


    ### 侧信道攻击


    Meltdown（以及 Spectre）利用了处理器内部这个“黑盒”并不保证真实的这一事实。在推测期间，可能通过间接方法观察其操作，这被称为侧信道。这些漏洞被称为缓存侧信道攻击，因为它们利用了数据跨多个应用程序缓存的事实。由于这些缓存是共享资源，每个人都想使用缓存的一部分。缓存条目被用作虚拟内存，由应用程序查找。


    如果你有一个条件，例如 `if`（分支）那么：首先确定分支的值（真或假）。然后该值可能立即对处理器的快速（但非常小的）内部内存 L1（i）缓存可用，但很多时候它并不是立即已知的（缺失）。由于推测被假设是不可见的，无论加载是否发生似乎并不重要，只要程序员从未察觉到它。


    在随后的泄露中，另一段代码执行执行进行内存访问。这种结构可以帮助防止访问，但其地址基于第一个分支的内容。因此，第二个分支的缓存条目被填充，而其地址通过受保护的数据计时被泄露。此外，当存在缓存中时访问内存更快是一个事实，这正是它的核心点。如此，事实上应用程序可以对内存进行计时，并从中推断出结果。如果这听起来很复杂，你不需要考虑几秒钟。


