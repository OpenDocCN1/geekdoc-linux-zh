    \ makefiles 中——特别是那些由脚本自动生成的 Makefile 中——单个文件可以目标多个不同的规则。例如，在某个实例中，我们写了一个带有单 .class\
    \ 规则的模式规则。如果特定的，一个 .java 文件需要额外的 .java 文件才能构建，我们应该在单独的规则中指定这些先决条件，以确保每当这些源之一发生变化时都会构建\
    \ .class 文件：\n\n# 自定义搜索路径 (own search paths)\n\n+   * Hello::class Hello.java\n\
    PrintingFactory.java\n\n在这种情况下，Hello 类将是两个独立规则的目标。然而，这些规则中只有一个带有一个配方（recipe）。Make\
    \ 允许一个文件成为多个规则的目标，但只允许这些规则中的一个拥有配方；不允许对同一个规则有不同的配方。\n\n![](img/47c577d3c443392bbdb486d8e17c4a70_38_0.png)\n\
    \n# MQTT 教程\n\n第三部分\n\n# 无需电脑利用 MQTTPower\n\n使用 Espressif ESP32，这是一种廉价的单片系统微控制器，它带有\
    \ Wi-Fi 发送器\n\n为每一个应用程序部署树莓派会非常昂贵；幸运的是有更廉价的模块。Espressif 的 ESP32 扩展了传奇 ESP866 的成功：它采用了老牌的\
    \ Extensa CPU 并扩展了一些功能（本文未讨论）。在中国购买时，所有这些费用可以低于 10 美元——与 Arduino Uno 相比，它在缩小尺寸方面还才刚刚开始。\n\
    \n与大多数其他微控制器供应商不同，Espressif 取消了 IDE 的优先级。相反，他们的开发环境是在传统的命令行环境中进行的。首先，从 http://bit.ly/lud_esp\
    \ 下载实际编译器并将其放入。然后执行以下命令序列来安装一些包，并将编译器中的各种资源提取到主目录：\n\n```bash\nsudo apt-get install\
    \ wget make\nlibcurses-dev flex bison gff python python-tools\nmkdir -p /esp\n\
    cd /esp\ntar -xzf ~/Downloads/xtensa-esp32-elf-linux64-v2.0-73-g02a801-5.2.0.tar.gz\n\
    ```\n\n![](img/47c577d3c443392bbdb486d8e17c4a70_39_0.png)\n\n上方左侧是家居自动化（在20世纪90年代）。这是\
    \ Andy Stanford-Clark 用来使用 MQTT 并解决其水分感染问题的原始捕鼠陷阱 Arien Nipper（左）和 Andy Stanford-Clark（右），是\
    \ MQTT 之父\n\n"
