    # 组测


    ## 轻量级 Web 服务器


    不需要流行 Web 服务器中所有的花哨功能吗？这里有一些替代方案，它们提供所有常规功能，而不会过剩。


    **Cherokee** 是一款突出的 Web 服务器，其“速度极快”。它易于配置，并运行在所有操作系统平台上。该 Web 服务器支持许多实用的现代网络请求，用于托管所有静态和动态内容以及
    Web 应用。

    cherokee-project.com


    **Hiawatha** 的表现远超它的名誉，因为它声称在代码和功能方面都考虑了安全性。它也易于配置和维护，且发布时没有部署风险。它在不消耗资源的情况下实现了这一点。

    www.hiaw-webserver.org


    **Lighttpd** 最流行的轻量级 Web 服务器之一，Lighttpd 为许多网站和 Web 主机服务。该 Web 服务器专门为高性能环境设计，支持所有常规功能并符合标准。

    lightpd.net


    **Nginx** 从统计数据来说，Nginx 是最流行的轻量级 Web 服务器。除了高性能 HTTP 服务器外，这种跨平台 Web 服务器还被用作反代理、IMAP
    POP3 代理服务器并经常作为负载均衡器。

    nginx.org


    # 测评轻量级 Web 服务器


    ### Cherokee


    快速、功能丰富、非常灵活且易于配置


    ### Hiawatha


    特别关注安全性，并具有可读的配置语法


    ![](img/47c577d3c443392bbdb486d8e17c4a70_81_0.png)


    - Cherokee 管理界面中的每个屏幕都有指向相应文档章节的链接以寻求帮助


    ![](img/47c577d3c443392bbdb486d8e17c4a70_81_1.png)


    - Hiawatha 也可以用作反代理和应用框架


    # 安装


    Cherokee 在 Fedora 等某些发行版的存储库中提供了预包二进制文件。在 Debian 和 Ubuntu 等其他发行版中，你必须从源码编译服务器。这个过程不像某些其他软件那样复杂或容易失败，主要是因为
    Cherokee 的依赖项很少。


    # 安装


    该跨平台 Web 服务器以源码 tar 包的形式正式提供。文档指向了包含 Debian、CentOS、Ubuntu 等更多流行发行版的预编译二进制文件的章节。监控器作为一个重要组件，仅提供源码形式。


    # 值得关注的功能


    除了易于安装外，Cherokee 还提供了一些实用的功能。它支持 FastCGI、PHP、CGI、TLS/SSL、高效缓存和流量共享功能。还支持流行的 Web
    应用框架和应用服务器，包括 Django、Ruby on Rails、Zend、Ghostfish 和 Collision。


    # 值得关注的功能


    Hiawatha 现代 Web 服务器的所有体验。它内置了安全功能和处理复杂请求的配置选项。服务器使用 mTLS 库而不是 OpenSSL，并自带一个加密脚本，该脚本从服务器配置文件中提取相关值来生成证书。


    # 管理易用性


    Cherokee 设计用于帮助配置部署的 Web 服务器几乎所有方面。默认情况下，它监听 localhost，但可以使其监听网络上的任何 IP 地址。界面直观，消除了整体部署和管理任务（如虚拟主机和异常规则）的痛苦。


    # 管理易用性


    Hiawatha 的配置易于理解，使得 Web 服务器部署的配置方式更加一致。Hiawatha 还有一个 PHP 形式的监控工具，提供有关 Web 服务器的信息和细节，如带宽使用情况、请求数、错误和遇到的问题。


    # 文档与支持


    该项目涵盖了从安装到高级配置的所有问题。你可以直接浏览使用指南，或使用管理部分中的“帮助”按钮跳转到特定章节。Cookie 非常有趣，并帮助 Cherokee
    完成各种任务。


    # 文档与支持


    该项目拥有引导用户的常规渠道。网站上的支持部分指向了从配置 Hiawatha 到提供所有类型的 Web 应用的详细教程。还有论坛可以提问，并有第三方提供商支持。


    # 总结


    Cherokee 拥有部署现代 Web 应用所需的所有功能，并有充分的文档支持。锦上添花的是易操作的强大工具。


    # 总结


    一个快速且轻量级的 Web 服务器，具有多种功能，使其成为安全意识型部署的理想选择。值得注意的是其可读性良好的配置语法。


    ![](img/47c577d3c443392bbdb486d8e17c4a70_81_2.png)


