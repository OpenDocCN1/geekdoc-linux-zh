  md: '# # WireGuard

    WireGuard VPN (userspace)


    WireGuard® is an extremely simple yet fast and modern VPN that utilizes state-of-the-art
    cryptography. It aims to be faster, simpler and easier to configure than other
    VPNs, with more performance than OpenVPN. This app packages the wireguard-go executable
    https://github.com/wireguard/wireguard-go and is very easy to set up and use.
    Visit https://www.wireguard.com for more information.


    With an overlay, /dev/wireguard is mapped to TUN_COMMON - so that WireGuard will
    look for configuration and key files.


