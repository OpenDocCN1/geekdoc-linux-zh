  md: "```\nimport React, { useState } from 'react';\n\nconst Counter = () => {\n\
    \  const [count, setCount] = useState(0);\n\n  return (\n    <div>\n      <p>You\
    \ clicked {count} times</p>\n      <button onClick={() => setCount(count + 1)}>\n\
    \        Click me\n      </button>\n    </div>\n  );\n};\n\nexport default Counter;\n\
