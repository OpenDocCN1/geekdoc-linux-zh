  md: '![](img/b66f06329b85dc029f3c6b8a762685a4_152_0.png)


    Debian is a free operating system (OS) for your computer. The operating system
    is a set of hardware and software programs that make your computer run.


    Debian is built by a worldwide community of volunteers. It is one of the most
    popular and stable Linux distributions in the world. Read more...


    | Version | Codename | Release Date | Status |

    | --- | --- | --- | --- |

    | 12.0 | bookworm | 2023-06-10 | Stable |

    | 11.0 | bullseye | 2021-08-13 | Oldstable |

    | 10.0 | buster | 2019-07-06 | Old |


    Note: The list above may not be the latest version of Debian. Check the website
    for more information.


    # Getting Started


    Please use the navigation menu on the left of this page to see more content:


    If you are new to Debian, click here to read the introduction section, and people
    who use operating systems other than Linux should click here.


