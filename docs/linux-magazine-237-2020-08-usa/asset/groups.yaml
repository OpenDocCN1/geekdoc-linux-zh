    ![](img/b66f06329b85dc029f3c6b8a762685a4_436_0.png)


    The conversion wizard in MystiQ lets you convert media files to many formats,
    but it does not support the user in choosing the right format. To prepare videos
    for the Raspberry Pi, the MKV container is the best choice. The first three generations
    of the Raspberry Pi have a hardware decoder for MPEG/H.264 encoded videos. For
    Rasp Pi, you would want to use the default MPEG4 setting. The hardware of the
    current Raspberry Pi 4, on the other hand, is also capable of decoding H.265/HEVC
    for best possible quality in combination with small file sizes, select MKV H265
    in this case.'
