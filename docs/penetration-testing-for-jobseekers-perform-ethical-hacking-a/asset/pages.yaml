    # XSS cheat sheet


    Just like SQLi, XSS vulnerabilities are not always easy to find for most developers
    are well aware of some prevention mechanisms for XSS. Hence, testing any for XSS,
    simple payload like <script>alert(''xss'')</script> might not work. You may have
    to try different payload combinations to the application. To do that, XSS sheets
    are very useful. The following list has a good set of XSS payload script that
    pen testers can use during their pen test:


    https://portswigger.net/web-security/cross-site-scripting/cheat-sheet


    # Stopping XSS attacks


    An attacker can exploit a cross-site scripting vulnerability in many ways:


    +   - Read any data that the user can access'
  merge: -1
  pgno: 124
- img_proc: true
  md: '+   * Impersonate or masquerade as the victim user

    * Inject Trojan functionality into the website

    * Perform virtual defacement of the website

    * Carry out any action that the user can perform

    * Capture the user''s login credentials


    Stopping cross-site scripting is important in many cases, but it can be much more
    difficult relying on the intricacy of the application and the ways it takes care
    of user-controllable data.


    As a whole, successfully preventing XSS vulnerabilities is most likely to involve
    a mix of the following measures:


    +   * Encode output data in response: At the point where user-controllable data
    comes in HTTP responses, encode the outcome to stop it from being taken executable
    content. Depending upon the output context, use combinations of HTML, URL, JavaScript,
    and CSS encoding.


    +   * Filter input data: At the point where user input is received, filter as
    strictly as feasible based on what is anticipated or legitimate input.


    +   * Usage appropriate response headers: To avoid XSS in HTTP responses that
    aren''t planned to have any type of HTML or JavaScript, you can use the Content-Type
    and X-Content-Type-Options headers to ensure that browsers translate the responses
    in the method you intend.


    +   * Set httponly cookie flag: If we set the httonly cookie flag in the response
    header, the cookies are not accessible through JavaScript. It makes XSS exploitation
    a little difficult, but it does not eliminate the risk completely.


    +   * Content security policy: As a last line of protection, you can use Content
    Security Policy (CSP) to minimize the extent of any type of XSS vulnerabilities
    that still take place.


    # # Security misconfiguration


    Security misconfiguration is just defined as falling short to apply all the security
    controls for a server or web application, or as doing with serious errors in it.
    What a business considered as safe configuration may have serious security gaps
    or errors that usually leave the company open to security risks.'
  merge: -1
  pgno: 125
- img_proc: true
  md: "According to the OWASP Top 10, this type of misconfiguration is at number six\
    \ on the list of essential web application security threats. Here are some examples\
    \ of common security misconfigurations:\n\n+   - Administration ports are used\
    \ by system administrators for major system configuration changes. When administration\
    \ ports are open for an application or service, they expose the application to\
    \ remote attacks.\n- Allowing directory listing, which might allow user to view\
    \ all files/folder structure of a server.\n- Disclosing sensitive files due to\
    \ configuration errors.\n- Outbound connections to various internet services might\
    \ disclose unwanted behavior of the application in a crucial environment.\n\n\
    # Finding sensitive information disclosed through misconfiguration\n\nIf servers\
    \ are misconfigured, it unintentionally discloses a lot of information. Manually\
    \ finding them can be tedious. Though there are many commercial automated scanners\
    \ free/open-source tools available that allow us to find such misconfiguration\
    \ though different methodologies. One of the tools is dirsearch, which uses Brute\
    \ Force methodology to find sensitive information disclosure due to misconfiguration.\
    \ The tool is available on this GitHub repository: https://github.com/maurosoria/dirsearch.\
    \ Once you download and install the script, you should be able to access the tool\
    \ from the command line. \n\nRunning this tool is quite simple:\n\n```\ndirsearch\
    \ -u https://www.yourtarget.xyz/\n```\n\nIf we run the tool on DVWA, it gives\
    \ us plenty of information that the server discloses due to misconfiguration,\
    \ as shown in Figure 4.28:"
