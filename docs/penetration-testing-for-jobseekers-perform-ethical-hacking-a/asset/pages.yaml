  md: '# Limitations of penetration testing


    Undertaking a series of penetration tests will help test some of your security
    arrangements and identify improvements, but it is not a panacea for all ills.
    For example, a penetration test does the following:


    +   - covers just the target application, infrastructure, or environment that
    has been selected for testing.


    +   - focuses on the exposures in technical infrastructure, so it is not intended
    to cover all the ways in which critical or sensitive information can leak out
    of an organization.


    +   - plays only a small part in reviewing the people element of an organization.
    People element is often the most important in an organization’s defense system.


    +   - can be limited by legal or commercial considerations, limiting the breadth
    and depth of a pen test.


    +   - may not uncover all security weaknesses, for example, due to restricted
    scope or inadequate testing.


    +   - provides results that are often technical in nature and need to be interpreted
    in a business context.


    # Conclusion


    Penacration testing can help mitigate the risks of the threats that your company
    may face. Nevertheless, good security methods need to be adopted to secure your
    organization. By taking a risk-based method on cybersecurity, you will certainly
    address the prioritized threats and assess your company risk constantly.


    From the next chapter onward, we will guide you to set up a minimal home lab that
    will help you hone your pen testing skills alongside deep diving into different
    types of penetration testing.


