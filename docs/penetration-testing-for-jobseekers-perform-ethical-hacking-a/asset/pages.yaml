    # ## Server-side request forgery


    In a **Server-Side Request Forgery (SSRF)** attack, the attacker can abuse functionality
    on the server to read or update internal resources. It enables an attacker to
    induce the server-side application to make HTTP requests to an arbitrary domain
    of the attacker''s choice.


    # ## Example of SSRF


    In a common SSRF attack, the attacker could trigger the server to make a connection
    to internal-only services within the company''s facilities. In other instances,
    they might be able to force the server to connect to arbitrary external systems,
    potentially dropping delicate data such as authorization credentials. To understand
    SSRF, let''s look at the infrastructure shown in Figure 4.33:'
