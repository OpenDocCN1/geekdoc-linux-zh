  md: 'Figure 6.11: PIVAA insecure communication code snippet


    # Mitigation strategies for insecure communication


    Like various other problems on the OWASP Mobile Top 10 listing, there are various
    ways in which hackers exploit insecure communication. Shielding mobile applications
    against these attacks can be done by simply following some of these methods:


    +   - The first few packets of an SSL/TLS handshake should be verified appropriately
    (for example, client supported cipher suites), do not proceed with the connection
    if anomaly was seen at the first stage.

    - The server certificate should always be verified at the client end to ensure
    that it''s coming from a verified source and is not self-signed. Self-signed certificates
    are usually considered suspicious.

    - Using industry-leading cipher suites that utilize adequate encryption key lengths
    (Example, Advanced Encryption Standard (AES128) or above).

    - Flaws in network traffic or certificate should be flagged immediately to the
    user, allowing them to decide on the next step of action.


    # Insufficient cryptography vulnerability


