    # # Conclusion


    In this chapter, you learned about the most common attacks that are seen on web
    applications and API. Web applications in any industry, from e-commerce to government,
    can be successfully attacked. You might have already understood how difficult
    it could be to fully secure a web application. Every application tested had flaws
    of numerous severity levels. High-severity vulnerabilities can be exploited in
    over half these applications for access to delicate data, execution of commands
    on a server, and total control of the system.


    In the next chapter, we will discuss the art of identifying security issues though
    source code analysis.


    # # Key_points


    +   * Web application security is a stack of attack surfaces and defensive mitigating
    solutions. It is insufficient to safeguard web applications with just one strategy
    or at only one layer of the stack. Vulnerabilities in the system or in protocols,
    such as TCP or HTTP, are just as ravaging to the security and availability of
    applications as attacks against the application itself.


    +   * A complete stack of mitigating solutions is needed to become aware of a
    positive web application security pose. It is important to note that a detailed
    strategy requires cooperation across network, security, operations, and development
    groups, each of these has a function to play in protecting applications and their
    vital data.


