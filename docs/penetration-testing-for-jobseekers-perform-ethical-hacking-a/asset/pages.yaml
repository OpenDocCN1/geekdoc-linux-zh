  md: '# Running Kali from the live USB


    A live USB Drive (also called live disc, or operating system) is a complete bootable
    computer setup that runs straight from a USB or comparable storage device right
    into a computer''s memory rather than loading from a hard disk drive. A live USB
    drive permits users to run an OS for any purpose without installing it or making
    any kind of changes to the computer''s configuration.


    Live USB drive can operate on a computer without secondary storage, such as a
    disk drive, or with a corrupted disk or data system, enabling information recuperation.
    Running Kali Linux from the live drive is best when you are doing forensics or
    recovery tasks. One thing that you can do very nicely from the live disk is to
    start up a computer without composing anything to the hard drive; this is also
    an essential consideration when you are working to recover data from the hard
    disk drive for forensic investigation.User privilege in Kali Linux


    A number of hacking tools on Kali call for root privileges to execute, in addition
    to all the regular Linux commands that require it. sudo is a way that we can gain
    access to tools, ports, or services that need administrative privileges. However
    sudo is powerful, and it can allow complete access to the system, so it is not
    suggested to utilize sudo every command. Kali creates a user with administrative
    privileges by default; users can use sudo right now as well as supply their password
    for authentication.


