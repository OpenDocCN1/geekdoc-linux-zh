  md: '# SQL Injection cheat sheet


    An SQL Injection cheat sheet is a resource in which you can find detailed technical
    information concerning the many different variations of the SQL Injection vulnerability.
    This cheat sheet is of good referral to both experienced penetration tester and
    those who are just starting off in web application security. A list of SQL Injection
    payloads can be found on the following page, which we highly recommend you to
    explore:


    https://portswigger.net/web-security/sql-injection/cheat-sheet


    # Primary defenses against SQL Injection


    These are OWASP recommended primary defense mechanisms that can be implemented
    to prevent SQLi from happening or reduce the impact:


    +   * Using prepared statements (with parameterized queries)

    * Using stored procedures

    * Allow-list input validation

    * Escaping all user supplied input

    * Enforcing least privilege

    * Performing allow-list input validation as a secondary defense


    # Cross Site Scripting (XSS)


    Cross Site Scripting (XSS) attacks are a type of injection in which malicious
    scripts are injected into benign and trusted websites. Cross Site Scripting happens
    whenever an application takes untrusted data and sends it to the client (browser)
    without any server-side validation.


    Let''s understand that with respect to DVWA. Once we navigate to the reflected
    XSS module of DVWA, we see that the application asks for the user''s name. Once
    we enter the name, it sends back our name, as shown in Figure 4.16:'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Vulnerability: Reflected Cross Site Scripting (XSS)


    ![](img/5cafe5b4b24a423ad005874773aac823_117_0.png)


    # More info


    Figure 4.16: DVWA XSS


    XSS attacks occur when an attacker uses a web application to send back malicious
    code, generally in the form of a client-side script, to a different end user.
    We intercept the request and response in Burp Suite, we get to see that the server-side
    application is giving us the passed string, which is debashish in this case, as
    shown in Figure 4.17. When we encounter such behavior in any application, we must
    remember that the application might be vulnerable to cross site scripting flaws:


    ![](img/5cafe5b4b24a423ad005874773aac823_117_1.png)


    Figure 4.17: Burp Suite


    Upon encountering such application the first thing we need to verify is that the
    application performing sanitization on the parameter (the parameter is name in
    this case value). To do that, we simply pass a few special characters to it. As
    seen in the following figure, in response, we get to see that the server-side
    application is sending the exact input with special characters back without performing
    any sanitization, as shown in Figure 4.18:'
  merge: -1
