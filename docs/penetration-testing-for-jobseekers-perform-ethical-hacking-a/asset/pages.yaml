    Figure 8.42: Rogue access point attack image credit: Khan Academy


    A lot of rogue access points are mounted by company employees (harmful users).
    They are really not the same access points that the IT division in the company
    has planted. Most of the time, some small-office home-office (SOHO) wireless routers
    are used as rogue access points. In today''s world, a rogue access point could
    be extremely well-disguised, and sometimes, it could be really tough to find out.


    When any network resources are exposed by a rogue access point, the following
    risks may be identified:


    +   * **Data destruction**: Databases may be erased.

    * **Data theft**: Corporate data may be compromised.

    * **Third party attacks**: A company''s wired network may be used as a launching
    pad for third-party attacks against other networks across the internet.

    * **Loss of services**: Network services can be disabled.

    * **Malicious data insertion**: An attacker may use a portal to upload viruses,
    key loggers, or pornography.


