    # Improper platform usage vulnerability


    An operating system provides mobile applications with a wide range of security
    functionalities and tools. Incorrect platform use is when an application does
    not implement these attributes correctly, permitting them to be utilized as opportunities
    of attacks or revealing data to attackers.


    # Criticality of improper platform usage vulnerability


    Through insecure development practices, a revealed API call, such as Android intents,
    can end up a way for a hacker to attack an Android gadget. By coding defects/imperfections,
    hackers can exploit the permissions that have been given to an application. They
    can, subsequently, inject inputs or unforeseen commands to compromise a device
    and steal data.


    # Attack vectors of improper platform usage


