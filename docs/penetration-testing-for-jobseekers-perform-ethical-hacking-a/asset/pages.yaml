    # Burp Suite proxy


    Intercepting proxies are tools utilized to examine, change, and in many cases,
    inject web traffic right into the normal session created between a client and
    server. One common example where this is utilized in testing the security of a
    website using a tool like Burp Suite, which serves as a proxy linking your very
    own web browser to it. This enables Burp Suite to regulate a connection that was
    requested by the web browser and enables a large number of tools and testing methods
    to put into the link.


    Intercepting web browser traffic with Burp suite is very simple. One just has
    to navigate to Burp''s "Proxy Tab" -> "Intercept Tab" and then click on "Open
    Browser". It will launch a new chromium browser window. Pentester can browse the
    target website on the newly launched browser windows. The traffic will be passed
    through the Burp proxy and tester should be able to view and intercept the web
    traffic.'
