    # Insecure design mitigation


    Unlike other issues that we discussed previously, preventing insecure design issues
    is not very easy. However, here are some points that can be taken into consideration
    while eliminating insecure design problems from a web application:


    +   - Use threat modelling for important authentication, access control, organization
    relevant business logic, and key calculations. A threat model is a structured
    representation of all the information that affects the security of an application.
    In essence, it is a view of the application and its environment through the lens
    of security.

    - Establish and use a library of secure design patterns.

    - Establish and use a secure development lifecycle with AppSec specialists to
    assist, review, and design security and privacy-related controls.

    - Write unit and integration tests to validate that all important flows are resistant
    to the threat model. Assemble use-cases and misuse-cases for every rate of your
    application.

    - Incorporate reliability checks at each tier of your application (from frontend
    to backend).


