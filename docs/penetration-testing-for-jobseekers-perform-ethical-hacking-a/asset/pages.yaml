    # # A brief introduction to JSON Web Token (JWT)


    **JSON Web Token** or JWT are gaining popularity for securing APIs. In this section,
    we will try to understand how JWT works.


    In every API communication, we have a client and a server. The client wants to
    access some protected data on our server, the server only wants to give the data
    to a trustworthy client. So, our client sends a request to our server, with data
    to verify if it is:


    > Client → authentication information → Server


    Let''s say the client (user) provided authentication data was accepted as valid
    by the server. Now, instead of saving this user data, the server creates a token.'
  merge: -1
  pgno: 156
- img_proc: true
  md: 'This token is returned to the client, it''s up to the client to store this
    data and send it along, as required, for any requests to the server:


    Client ← JWT Token ← Server


    The next time our client makes a request along a secure route, it sends along
    the JWT token. However, our server knows not to trust the client because clients
    cannot be trusted. So, our server verifies that this token is from who it says
    it''s and determines whether it has been tampered with. If the verification is
    successful, the server sends a response to a requested data, and everybody lives
    happy after.


    In other words, you can consider a JWT bearer token as an identity badge to enter
    a secured building. The building includes unique permissions (the claims); that
    is, it might grant access to select parts of the building.


    JWTs differ from other web tokens in that they have a collection of claims. **Claims**
    are used to transfer information between two parties. What these claims are depends
    upon the use instance at hand. For instance might insist who provided the token,
    how long it is valid for, or what permissions the client has provided.


    A **JWT** is a string composed of three components, divided by dots (.) and serialized
    using `base64`. In the most typical serialization format, portable serialization,
    the JWT looks something like this:

    aaaaa.bbbb.ccccc.


    When decoded, you will obtain a header, a payload, and the signature. The **payload**
    has the claims. The **signature** makes certain that the token hasn''t been modified.
    The party that produces the JWT signs the header and the payload with a key that
    is known to both the issuer and receiver.


    A usual method to use JWTs is as **OAuth bearer tokens**. Here, an authorization
    server creates a JWT at the request of a client and sends it to ensure that it
    cannot be changed by any other party. The client will then send this JWT with
    its request to a REST API. The REST API will validate the JWT''s signature matches
    its payload and header to confirm that the JWT is valid. When the REST API has
    verified the JWT, it can use the claims to either allow or deny the client''s
    request.


