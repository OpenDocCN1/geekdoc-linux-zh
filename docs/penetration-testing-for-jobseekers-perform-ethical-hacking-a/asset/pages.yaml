    session, and will consist of any kind of pertinent data that is specific to the
    user. Without the same-origin policy, if you went to a malicious site, it would
    be able to read your e-mails from Gmail, personal messages from Facebook, and
    so on.


    # # Authentication versus authorization


    While authentication and authorization are frequently used interchangeably, they
    are separate procedures aimed at protecting a system or company from cyberattacks.


    # # Authentication


    The process of validating or checking that the asserted identification of a user/device/resources
    is legitimate is called **authentication**. One of the most usual kinds of authentication
    is using a password (which might consist of the password, a type of identification
    numbers (PINs), or a passphrase). Authentication validates the identification
    of the subject/user by comparing one or more factors against the database of legitimate
    identities (for example, previously created user accounts). The authentication
    factor utilized to validate identification is generally classified as, or thought
    to be, exclusive information, and it needs to be well known to the user/subject.
    The ability of the system to keep the secrecy of the authentication elements for
    identities directly shows the level of security of that system.


    Authentication is the first step in access control, and there are three common
    aspects utilized for authentication:


    +   - Something you know (such as a password)'
  merge: -1
  pgno: 101
- img_proc: true
  md: '+   - Something you have (such as a smart card)

    - Something you are (such as a fingerprint or other biometric method)


    # # Authorization


    Once a subject (for example, user) is validated, access must be given to certain
    requested resources. The process of authorization ensures that the requested access
    to an object/resource is valid, and the requester has the legal rights designated
    to the confirmed identification. For the most part, the system assesses an access
    control matrix, RBAC or Role Based Access Control, that maps the subject, the
    object/resources, and the desired permission. If the requirements are not fulfilled,
    the particular activity is allowed, then access is granted.


    Even if a user has been recognized and validated, it does not mean they have access
    to all the resources within the system or that they have been accredited to execute
    any type of features. For example, it is possible for a user to be allowed into
    a network but be blocked from accessing a documents or printing device. A majority
    of network users are authorized to carry out just a limited number of activities.
    Identification and authentication is an all-or-nothing aspect of access control,
    however authorization has a wide range of variations in between all or nothing
    for every object within the system.


