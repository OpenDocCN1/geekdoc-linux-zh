  md: "# CHAPTER 7\n\n# Network Penetration Testing\n\n# Introduction\n\nA network\
    \ penetration test is a dynamic set of sequential activities chosen on the fly,\
    \ depending on the target network being tested. The goal of a network penetration\
    \ test is to recognize security vulnerabilities in any network and connected devices\
    \ by intentionally using numerous test strategies to assess the network's security\
    \ posture. Just like vulnerability anál, a network penetration test, also known\
    \ as a pent, intends to recognize vulnerabilities in a network. However, unlike\
    \ vulnerability assessment, a penetration test is designed to go a step further\
    \ and demonstrate the impact of vulnerabilities through active exploitation.\n\
    \n# Structure\n\nIn this chapter, we will cover the following topics:\n\n+   *\
    \ Network vulnerability assessment versus penetration testing\n* Types of network\
    \ penetration testing\n    * External penetration testing versus internal penetration\
    \ testing\n    * Safe test versus unsafe test\n* Different phases of a network\
    \ penetration test\n    * Footprinting and reconnaissance\n    * Scanning networks\n\
    \    * Enumeration\n    * Vulnerability analysis\n    * Exploitation\n    * Privilege\
    \ escalation\n    * Lateral movement"
  merge: -1
  pgno: 237
- img_proc: true
  md: '# Objectives


    After studying this chapter, you should have a better understanding of conducting
    network penetration tests. We will also discuss the different phases of penetration
    tests, like foot printing, scanning, enumeration, exploitation, and so on, and
    showcase popular tools to perform these actions during a network penetration test.


    # Network vulnerability assessment versus penetration testing


    When people misinterpret the differences between penetration testing and vulnerability
    scans, they often miss out on a crucial part of their total network security account,
    and both are equally vital for security breach avoidance.


    Vulnerability scans and vulnerability assessments look for systems for well-known
    hanging vulnerabilities. However, the goal of a penetration test is to actively
    exploit weaknesses in any environment. While a security vulnerability scan can
    be fully automated, a penetration test always calls for various degrees of manual
    analysis and strategy.


    Organizations should maintain a standard track records on vital systems and should
    investigate the manipulation of open ports and exposed services running on them.
    A vulnerability scanning tool such as Qualys, Nessus, and Rapid7 can help detect
    vulnerabilities, along with changes made to any services. Open, reconciling discovered
    modifications against change-control records can aid in figuring out whether the
    modification was authorized or if there is a problem, such as a malware infection,
    or if an employee is violating the company''s change-control policies.


    Penetration testing is different, as it attempts to recognize insecure organization
    operating procedures, lay security setup and configuration, or other weaknesses
    that an external threat could exploit for their benefits. Transmission of clear
    text passwords over network, password reuse, and leftout databases storing valid
    credentials are examples of problems that can be often discovered by a penetration
    test. Penetration tests do not need to be carried out as commonly as vulnerability
    scans but should be repeated regularly.


    Penetration tests are best carried out by a third-party vendor instead of internal
    personnel to offer a hawk eye view of the network environment. Different tools'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'are utilized in a test, but the performance of this type of test relies upon
    the skill of the tester. The tester ought to have an experience in information
    technology, along with the capability of thinking in an abstract way. The penetration
    tester should also be capable of anticipating a real threat actor’s bad intentions.


    # Types of network penetration testing


    A network penetration test can be of many different types. In this section, we
    will do a side-by-side comparison of different kinds of network pen tests, their
    applicability, and their advantages and drawbacks.


    # External penetration testing versus internal penetration testing


    What’s the difference between external versus an internal pentesting? External
    penetration testing checks out a company’s current state of publicly available
    information or its externally-facing assets. The assessment group attempts to
    take advantage of the vulnerabilities they identified while screening organization’s
    publicly available information, or it attempts to gain access to the data via
    external-facing assets, like company emails, cloud-hosted applications, and websites.


    For example, an external pen test is usually executed from a remote location and
    can attempt to do any or all of the following:


    +   - Breach an organization’s perimeter firewall

    - Attempt to use public and exclusive information gathered from leaked data

    - Collect open-source intelligence (OSINT)

    - Use exclusively developed tools to find vulnerabilities and exploit them

    - Crack passwords


    These are usually the attack surface areas that a malicious hacker attempt to
    exploit externally.


    On the other hand, in internal penetration tests, the testers are provided with
    some legitimate access to company assets (for example, network). These tests will
    additionally try to find internal vulnerabilities. Under this simulation, a pen
    tester represents a malicious actor or an ill-intended staff member'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'member/employee with a certain level of legit access to the company’s inner
    network.


    These situations role-play what could possibly happen when a rogue worker, contractor,
    or cybercriminal masquerading as a staff member try to hack the organization from
    within. Internal pen testers consider the impact of secret information being willingly
    revealed, misused, or damaged. Then, they use that data to get better security
    controls over workers, such as enhancements to system privileges of access, vulnerable
    applications, and protocol abuse.


    # Safe test versus unsafe test


    No matter how you spin it, welcoming hackers right into your organization to execute
    a penetration test feels inherently risky. A great deal of points could go wrong,
    and several of those points might cause rafting influences. In this section, we
    are going to clarify the top dangers of penetration testing and what you can do
    to minimize them. Most typical threats are data corruption risks and system stability
    issues, and it can affect systems directly and indirectly. Direct effect occurs
    when a targeted system acts in an unexpected and adverse way. The following are
    a couple of instances of direct impact to systems:


    +   - Data corruption due to application security scanners

    - Service and application crashes due to network vulnerability scanners or even
    exhaustive port scans

    - Service and network equipment downtime


    Although there is no such thing as a risk-free penetration test, a few steps can
    be taken to decrease the risk. Safe tests are usually on production systems, where
    testers will take as many precautions as possible to reduce the chances of impact
    on customers/consumers. During safe tests, penetration tests are not supposed
    to run any exploit, scan, attacks that may cause any system error or outage or
    access PII data saved on servers. Unsafe tests are just the opposite and are usually
    conducted on non-production systems. During unsafe tests, pen testers are usually
    allowed to go to any extent to prove a vulnerability. Although the core concept
    of safe and unsafe tests remains the same, this test flexibility always changes
    on a case-to-case basis. Hence, these conditions should always be formally documented
    and be agreed upon by the tester and test consumer before even starting up the
    penetration test.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Different phases of a network penetration test


    Penetration testing process can be broken down into several stages:


    +   * Footprinting and reconnaissance

    * Scanning networks

    * Enumeration

    * Vulnerability analysis

    * Exploitation

    * Privilege escalation

    * Lateral movement


    From the next section of this chapter, we will be diving deep into these phases
    of penetration testing.


    # Footprinting and reconnaissance


    In a penetration test, the footprinting stage permits the tester to collect information
    regarding internal and external security design. Collection of information also
    helps determine the vulnerabilities within a system, which can be exploited to
    gain access. The attacker focuses on the target by means of the range of IP address
    they have to go through to hack the target or relating to publicly domain names.


    # Types of footprinting


    The initial step to ethical hacking is footprinting. Footprinting is the collection
    of every piece of information pertaining to the target and target network. This
    collection of information assists in recognizing different ways to enter the target
    network. This information might have gathered via publicly-available personal
    information and via sensitive information from any secret resource. Normally,
    footprinting and reconnaissance is doing social engineering attacks, or through
    any other method to gain the maximum amount of information about the target. The
    purpose of this stage is to obtain information about the target without notifying
    the target in any way.


    # Pseudonymous/passive footprinting'
  merge: -1
  pgno: 241
- img_proc: true
  md: 'Anonymous footprinting consists of footprinting via the internet sources.

    Basically, passive footprinting or synonymous footprinting is all about collecting
    data about a target without making the target owner aware in any way.


    # Active footprinting


    Active footprinting is the procedure of using tools and techniques, such as executing
    a ping sweep or using the tracer command, to gather information on a target. Active
    footprinting can set off a target''s Intrusion Detection System (IDS) and might
    be logged, so it needs a degree of stealth to effectively do it.


    # Objectives of footprinting during network penetration test


    The significant purposes of footprinting are:


    +   * To know the target''s security stance

    * To reduce focus area

    * To draw a network map


    # Footprinting methodologies


    It is not a big deal to get information about anyone using the internet, social
    media, main websites, and various other sources. It may have a lot of information
    regarding individuals, and the collection of information may meet the requirements
    of an attacker, and they can gather sufficient information with very little effort.
    The following are commonly used strategies by hackers:


    +   * Footprinting via WHOIS

    * Footprinting via Shodan

    * Footprinting via DNS

    * Footprinting via search engines

    * Footprinting via advanced Google hacking techniques


    # Footprinting through WHOIS'
