    At that point, you''ll need to understand the different types of DNS records that
    are available. Here are some of them:


    +   * A Records to a domain or subdomain of an IP address, for example, mapping
    216.239.32.10 to google.com.

    * CNAME allows a machine to be known by the hostnames indicated in the CNAME record.
    A CNAME, or Canonical Name record, is a record that points to another domain address
    rather than an IP address.

    * MX or a mail exchanger (MX record) specifies the mail server responsible for
    accepting e-mail messages on behalf of a domain name.

    * NS represents name server, and the name server record indicates which DNS server
    is authoritative for that domain name (that is, which server consists of the actual
    DNS records). NS records inform the internet where to discover a domain''s IP
    address.

    * TXT records are a type of Domain Name System (DNS) record that contains text
    information for sources outside of your domain. You include these records in your
    domain name settings. You can use TXT records for various purposes. Google uses
    them to validate domain ownership and ensure e-mail security.


