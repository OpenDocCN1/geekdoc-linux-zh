    to find weaknesses defined in OWASP Mobile Top 10.


    # # Stages of an Android application penetration test


    In general, a mobile application pen test has the following stages:


    +   - **Automated scanning**: Automated scanning is the first stage of any penetration
    test, where the target application is scanned using tools for finding known and
    easy-to-find vulnerabilities. The goal of this stage is to find *low hanging fruits*
    that can be identified using automation/brute force methodologies without wasting
    a lot of time finding them manually. In general, automated mobile application
    scanners check for various common configuration mistakes and programming mistakes
    by looking for specific patterns in the mobile application package. Automated
    scanning can be of two types: **static scanning** and **dynamic scanning.**'
  merge: -1
  pgno: 191
- img_proc: true
  md: '+   * Manual verification of issue/findings of automated scanning: One of the
    major limitations of automated vulnerability scanning is that scan results can
    have false positives. At this stage of mobile application penetration test, penetration
    testers manually verify the findings of automated scanners, determine the exploitability,
    and eliminate false positives.


    +   * In depth manual penetration testing: For obvious reasons, an automated scanner
    misses a lot of logical issues. At this stage of penetration test, the tester
    will manually dive deep into the application and perform static and runtime analysis
    of the app to find more vulnerabilities in it. This stage includes application-specific
    business logic testing (for example, payment gateway bypass, price manipulation,
    and so on), which is almost impossible to catch through automated scanning in
    most cases.


    # Introduction to Purposefully Insecure and Vulnerable Android Application (PIVAA)


    Produced by High-Tech Bridge, the Purposefully Insecure and Vulnerable Android
    Application (PIVAA) replaces obsolete Damn Insecure and Vulnerable App (DIVA)
    for the benchmark of mobile vulnerability scanners. You can use a totally free
    mobile app scanner to run the test and compare it with other applications. This
    application can be used to evaluate mobile application security scanners and figure
    out if the scanners can pick up the vulnerabilities present in the PIVAA application.
    The GitHub repository consists of a list of all the vulnerabilities present in
    the PIVAA application (https://github.com/HTBridge/pvaa). In this chapter, we
    will dissect the PIVAA using both automated and manual approaches, and we will
    dive deep into the several vulnerabilities present in it.


