    # Network communication


    To understand how scanning works, we should understand how network communication
    happens. **Internet Protocol or IP** is a network layer protocol in the TCP/IP
    stack, and **Transmission Control Protocol (TCP) and User Datagram Protocol (UDP)**
    are communication protocols in the transport layer of the TCP/IP stack. TCP is
    connection-oriented. Bidirectional communication'
