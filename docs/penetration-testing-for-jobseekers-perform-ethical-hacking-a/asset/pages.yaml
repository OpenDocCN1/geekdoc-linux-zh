    # Objectives


    # Basic understanding of Wi-Fi networks


    Wi-Fi means Wireless Fidelity, which is a wireless networking technology

    enables devices such as computers computers (laptops and desktop computers), smart

    phones (mobile phones and wearables), and other equipment (printers and

    camera) to interact with the internet. It permits these and many more devices
    to

    exchange information with each other, creating a network. It transfers signals

    through the air.


    # IEEE 802.11 standards


    It was designed for use in a restricted geographical area (houses, office

    complex, and campuses). The access method of IEEE 802.11 Wi-Fi is Carrier-

    Sense Multiple Access with Collision Avoidance (CSMA/CA). IEEE 802.11

    us numerous frequencies, but it is not restricted to 2.4 GHz, 5 GHz, 6 GHz,

    and 60 GHz frequency bands. It specifies the protocols that allow

    communications with current Wi-Fi enabled wireless devices, including

    wireless routers and wireless access points. To be able to understand Wi-Fi

    communication security, we must have a good understanding of the Wi-Fi

    packet structure that flows over the air.'
  merge: -1
