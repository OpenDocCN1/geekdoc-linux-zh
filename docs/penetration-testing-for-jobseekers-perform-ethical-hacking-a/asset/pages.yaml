- img_proc: true
  md: 'Here, we sent a small JavaScript code to the server through the GET parameter
    name. The server processed the request and sent the JavaScript back to the browser
    interface. When the code injected reached the browser, the browser parsed the
    code as part of the actual web page and executed it. There is no way for the browser
    to understand that the code was injected maliciously by the attacker. During XSS,
    the injected code always gets executed in the context of the main domain of the
    website, so the injected code can literally access all the resources of the website,
    bypassing same-origin security policy. We should be able to imagine the security
    impact of an XSS vulnerability.


    # Stored XSS


    Stored XSS, also known as persistent XSS, happens when user input is stored on
    the target server, such as database/message/comment area. Then, the target is
    able to obtain the stored data from the web application. Let''s explore the stored
    XSS module of DVWA. This module allows the user to leave name and a message to
    the page. Once a user enters the name and message, it gets saved in the page permanently,
    as shown in Figure 4.21.


    # Vulnerability: Stored Cross Site Scripting (XSS)


    ![](img/5cafe5b4b24a423ad005874773aac823_120_0.png)


    Figure 4.21: DVWA stored XSS


    Remember, whenever you encounter this behavior, where user provided input gets
    saved permanently in the database. This poses a significant risk of persistent
    XSS. Just like reflected XSS, the next thing you have to check is whether the
    application is performing any sanitization on the given input before saving it
    to the database or sending the response back to the browser. It'
  merge: -1
