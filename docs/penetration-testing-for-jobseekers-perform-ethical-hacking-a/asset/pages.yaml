  md: '# Points to remember


    +   - Remember, secure code review is definitely not a silver bullet, but it is
    a strong part of an overall risk mitigation system to protect any software.

    - Don''t rely on automated tools. As mentioned earlier, automated tools have many
    limitations that they cannot identify logical problems that are specific to an
    application; that requires manual intervention.

    - As a source code reviewer, you will be coming across many applications written
    in languages that you are reviewing for the first time. You should keep your mind
    open to learning about new language. While doing this, Google is your best friend.
    Be spontaneous about googling API and function names that you encounter during
    manual code review. Usually, the search results redirect you to the actual API
    documentation, be it Java, PHP, .NET, or anything else.

    - Try to learn at least one object-oriented programming language. You have to
    remember that when a programming language name changes, only the syntax changes;
    the core components/features remain the same, be it loops, functions, classes,
    constants, or anything else. If you make yourself comfortable with at least one
    object-oriented programming language, it will be easy for you to read/understand
    any language. It''s highly recommended to build small projects on your own while
    learning a language.


    # Questions


    +   1. In any secure source code review interview, candidates face a question
    where a code snippet is given, and they are asked to do a code walkthrough and
    identify security problems in it. They are also asked to learn about language
    specific mitigations.

    2. Describe the end process of a secure source code review project you''ve done
    recently.

    3. What are boundary condition errors?

    4. What are nullable and non-null annotations?'
