    # # Footprinting through DNS


    Generally, there is quite a lot of information stored in a DNS server''s related
    network, and there are many tools readily available to collect all this useful
    information from a targeted machine. DNS footprinting allows us to gather information
    around DNS zone data. This DNS zone usually includes domain name, host names,
    IP addresses, and much more useful information about a particular network.


    # ## What does DNS do?


    DNS belongs to the TCP/IP convention suite. It is responsible for mapping easy-to-use
    domain names (as an example, http://www.google.com) to its IP address (example,
    142.250.182.228). A name server is a server with these mappings. For pen testing,
    getting to DNS servers provides an overview of the organization''s structure through
    a review of IP address and hostnames.


    # ## Utilizing the host command on Kali


    The host command is included with many Linux distributions, including Kali Linux.
    To use it, type host, along with the domain name you are trying to find IP addresses.
    Consider this example:


    ```

    kali@kali: ~~

    $ host www.bing.com

    www.bing.com has aliases a-0001-a.fdentry.net.trafficmanager.net.

    a-0001-a.fdentry.net.trafficmanager.net is an alias for dual-bing.com.dual-0001-a-msedge.net.

    dual-bing.com.dual-0001-a-msedge.net has address 204.79.197.200

    dual-a0001-a-msedge.net has address 13.107.212.222

    dual-a0001-a-msedge.net has IPv6 address 2607:f8b0::c11

    ```


    *Figure 7.7: Host command in Kali Linux*


    Figure 7.7 shows that the host command tells us the domain name points to a server
    with IP 204.79.197.200.


    # ## Using NSLOOKUP for footprinting


    NSLOOKUP is a tool that examines a DNS server for its host information. It''s
    available on Linux, including Kali and Windows. NSLOOKUP is used to'
