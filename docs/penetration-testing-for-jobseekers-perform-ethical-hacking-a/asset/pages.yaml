- img_proc: true
  md: '![](img/5cafe5b4b24a423ad005874773aac823_295_0.png)


    Let’s understand each offset of the packet shown in figure 8.1 one by one:


    +   - **Frame Control**: It contains the information about the protocol in use,
    the type of frame, or the type of security measures used.

    - **Duration**: It implies how long the frame transmission will take so that other
    devices in the networks can discover when a particular channel will be available
    again.

    - **Address 1**: Address 1 field holds the receiver’s MAC address of the wireless
    packet. Remember, the receiver is the destination in many cases, but it is not
    always case. Refer to table 8.1 for clarity.

    - **Address 2**: Address 2 field holds the transmitter’s MAC address. This is
    basically referring to the source device’s MAC address. Refer to table 8.1 for
    clarity.

    - **Address 3**: Address 3 field is usually used for Wi-Fi packet filtration by
    access point. Refer to table 8.1 for clarity.

    - **Sequence Control**: It indicates how a large packet is fragmented.

    - **Address 4**: Not used.

    - **Data**: It is anything the frame carries, such as an IP packet.

    - **Frame Check sequence** (FCS): It is an error checking mechanism to ensure
    that the frame is intact at the source and destination ends.


    | Packet direction | Address 1 | Address 2 | Address 3 | Address 4 |

    |---|---|---|---|---|n| Packets to access point | Access point’s MAC | Source
    MAC | Destination device MAC | Not used |

    | Packets from access point | Destination device MAC | Access MAC | Source device
    | Not used |


    Table 8.1: Address fields in different Wi-Fi packets'
