    Figure 9.2: GDPR


    **Art. 32 GDPR Security of processing:** GDPR Article 32 calls for organizations
    to implement a process for frequently testing, examining, and assessing the effectiveness
    of technical and organizational procedures for ensuring the security of data handling.


    Visit the following link for more information:

    https://gdpr-info.eu/art-32-gdpr/


    # # PCI DSS


    The Payment Card Industry Data Security Standard (PCI DSS) is a minimum set of
    requirements made to help companies secure client cardholder data. All organizations
    that accept or process online card payments are needed to take on annual PCI security
    audits to ensure an organization’s compliance:'
