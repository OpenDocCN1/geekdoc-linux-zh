    # SSL certificate pinning


    Before we jump into SSL certificate pinning, we must understand the first few
    stages of SSL handshake which are client hello message and server message. During
    client hello, the SSL client (in this case it would be our mobile application)
    initiates the SSL handshake by sending a client-hello message to the SSL server.
    The hello message includes many important things'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'like the TLS version, the cipher suites the client supports and a string of
    random bytes etc.


    In response to client hello, the server sends a back server-hello message to client.
    The most important information server-hello holds the server''s SSL certificate.
    The SSL certificate holds information such as certificate authority (CA) issuer(s),
    public keys, and so on.


    Certificate pinning limits the certificates that are considered valid for a certain
    website or server, limiting the risk. As opposed to allowing any type of SSL certificate
    to be used, application developers sometimes pin the certificate authority (CA)
    issuer(s), public keys, and some other attributes of an SSL certificate within
    the application itself with their own names and values. When SSL pinning is enabled,
    clients will only connect to a webserver with certificate details as invalid and
    will refuse to make an HTTPS connection. Certificate pinning allows applications
    to control the risk of certificate-issuance, CA compromise, or man-in-the-middle
    (MITM) attacks.


    Now, let''s understand why SSL pinning bothers a mobile application penetration
    test. Even though you have your HTTPS intercept setup ready (as described in Chapter
    3. Setting Up Your Lab for Penetration Testing), you will not be able to see the
    HTTPS traffic in your proxy if SSL pinning is enabled on your Android app. This
    is because of the self-signed certificate used by intercepting software. For the
    Burp Suite, it uses a self-signed certificate of Portswigger. So, for penetration
    testing purposes, you will have to bypass SSL pinning if you have to do MITM to
    see how the Android app is communicating with the backend API. Learn that the
    Twitter Android app available on Play Store also has certificate pinning enabled.
