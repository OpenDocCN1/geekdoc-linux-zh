    # The art of sniffing wireless packets


    Remember, if we wish to invade a Wi-Fi network, we need to capture the Handshake
    we saw earlier over the air. This handshake is referred to as a connection between
    the victim computer and the wireless network we are targeting. With this, data
    hackers are capable of decrypting the Wi-Fi name and secret key as data is sent
    as packets and the packet travels from source to destination using a MAC address.
    Note that each packet has a valid source MAC address and a destination MAC address.


    # Wireless mode (managed and monitor mode)


    The question here is, how can an external entity capture the handshake? If we
    are in the Wi-Fi range, we have the ability to catch all of this communication
    because these packets are sent over the air. This means we can catch them (even
    when our MAC address is not set as the destination MAC address of any packet).
    In default configuration, the mode of a wireless devices is always set to *managed
    mode*, which means our wireless device will only be able to capture packets that
    have our device''s MAC address set as the destination MAC. Monitor mode allows
    a wireless adapter to capture raw packets that travel across the wire without
    any type of filtering. In managed mode, we will be able to capture literally all
    packets that flow across the wireless network. So, to be able to do this, we need
    to transform the mode of operation of our wireless interface from **managed mode**
    to **monitoring mode**, which can be done by executing the following commands
    in the terminal of Kali Linux:'
  merge: -1
  pgno: 305
- img_proc: true
  md: '```

    ifconfig wlan0 down

    airmon-ng check kill

    iwconfig wlan0 mode monitor

    ifconfig wlan0 up

    ```


    Let’s understand what we are doing here:


    +   - Turn the wireless interface (wlan0)

    - Kill all processes that might be utilizing the wireless interface.

    - Change the mode from managed mode to monitoring mode.

    - Turn the wireless interface back up.


    Once we execute these commands, we should be able to confirm that the mode of
    our adapter has changed to Monitor, as shown in figure 8.16:


    ![](img/5cafe5b4b24a423ad005874773aac823_306_0.png)


    Figure 8.16: Verify that monitoring mode is enabled for WLAN card


