  md: 'Most network equipment makes it very easy to change MAC addresses from a GUI.
    In Kali Linux, you can change the MAC of your Wi-Fi adapter as follows; it should
    work for both wired and wireless networks:


    ```

    ifconfig wlan0 down

    ifconfig wlan0 hw ether 00:11:22:AA:AA:AA

    ifconfig wlan0 up

    ```


    So, this is what we are doing here. We must first disable any-interfaces. You
    can check if the substitution is working by executing the command **ifconfig wlan0**.
    The MAC address should be in the **Hwaddr** line.


    In addition, there **macchanger** utility, which can help you set yourself a random
    MAC. If we put it in **init.d**, every time we boot, our MAC will be different.
    Here''s how to use this:


    ```

    # Random MAC:

    macchanger -r wlan0

    # Defined MAC:

    macchanger -m 11:22:33:AA:BB:CC wlan0

    # Show MAC:

    macchanger -s wlan0

    ```


    Do not be overwhelmed by the freedom to change MAC addresses to arbitrary. Some
    access points do not allow clients with invalid MAC addresses to connect. So,
    if you change to arbitrary, ensure that it is in the database, otherwise you may
    experience problems. In Kali Linux, this database is found in files:


    ```

    /var/lib/ieee-data/oui.txt

    /var/lib/ieee-data/oui36.txt

    /var/lib/ieee-data/iab.txt

    /var/lib/ieee-data/mam.txt

    ```


    # Preventing MAC spoofing


    Spoofing the MAC address of a system doesn''t completely eliminate the risk of
    getting detected, so a network administrator will still be able to see the traffic
    from the spoofed MAC address. A *spoofed MAC address* will appear in traffic log
    from two different sources in parallel. It is also very important to apply wireless
    network hardening. Some firewalls have the functionality to prevent and detect
    MAC spoofing; incorporating such a firewall may increase wireless security. There
    are also numerous MAC spoofing detection tools that'
