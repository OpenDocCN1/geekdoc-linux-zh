    https://ocw.mit.edu/courses/electrical-engineering-and-computer-science/6-858-computer-systems-security-fall-2014/video-lectures/


    # # Bug Bounty participation


    Bug Bounty is a great way to keep your hacking skills up to date and make money
    and recognition at the same time. Bug Bounty programs enable independent security
    researchers to report bugs to a company and get rewards or payment. These bugs
    are normally security exploits and vulnerabilities, which can also include procedure
    problems, hardware defects, and so forth. The reports are typically made with
    a program run by an independent third-party (like Bugcrowd or HackerOne). The
    organization will set up (and run) a program curated to the company’s demands.
    Programs might be private (invite-only), where reports are maintained private
    to the company, or public, where anybody can register and sign up. They can happen
    over a prefixed time span or indefinitely. Here are some good Bug Bounty platforms
    that a pentester can start with:


    +   - Hacker One (https://www.hackerone.com/)

    - BugCrowd (https://bugcrowd.com/)


    Some organizations may impose a distinct policy on penetration testers, which
    may not allow you to participate in the Bug Bounty program. We suggest that you
    discuss with your management before participating in any bug bounty program.'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# Competitive learning through CTF competition


    Capture The Flags (CTFs) are a type of computer security competition. Additionally,
    CTF is a wonderful method to refine your hacking abilities. In CTF, teams of rivals
    are pitted against each other, and typically, they are the beginning of one''s
    cybersecurity career. Here is a few great resources to start your CTF journey:


    +   - https://ctf10L.org/

    - https://ctftime.org/ctfs

    - Google CTF: https://capturetheflag.google.com/


    If you''ve never experienced a CTF event before, don''t get disappointed or surrender.
    The trick to perform any kind of hacking is persistence. While this is a challenging
    point to have in some cases, it is the only method to learn, longer, and exercise
    by yourself . Possibly, you''ll rack up at the next time. Something you can try
    to do throughout your first CTF, if possible, is to get in touch with an experienced
    team that is flexible enough to make you a part of it. Participants of the InfoSec
    community are usually willing to share their knowledge with any individual interested
    to learn and grow in this field. So, it won''t be a difficult task for you.


    # Giving back to the community


    Knowledge sharing plays an important role in the domain of the information security
    community. When you look at a successful information security professional, you
    should remember that someone in this world has played a major role in inspiring
    that person to develop passion for information security and grow as a professional.
    A tiny bit of inspiration can make a lot of difference and come from various sources.
    It could be a talk at a conference, a blog post, a CTF competition, or even a
    job referral.


    Always remember, no successful professional got where they are today on their
    own. Without a doubt, they are fortunate to have learned from skilled security
    professionals who have directly or indirectly shaped their career growth. Many
    may never fully recognize that impact, but it''s important to realize the power
    of sharing knowledge with the community for free. It also helps the knowledge
    to propagate among others and evolve.'
  merge: -1
  pgno: 353
- img_proc: true
  md: 'So, it is very important to make it a priority to learn on one hand and help
    others grow on the other hand by sharing knowledge:


    ![](img/5cafe5b4b24a423ad005874773aac823_354_0.png)


    Figure 10.6: Giving back to the community


    We can all benefit from others'' successes and oftimes, even more by others''
    failures. Each one of us faces problems on a daily basis, and we take help from
    Google to resolve them. We immediately get a solution through some blog post,
    forum post, or video tutorial. Remember, someone in this world spent their valuable
    time creating that post and sharing the knowledge. Otherwise, our problem-solving
    ability will reduce significantly. This should be a good enough inspiration for
    you to share more with the community. You can do several things:


    +   * Write blog post about any problem that you solved in a unique way

    * Make video content to share knowledge

    * Establish an informal mentoring program

    * Join your local security group, such as BSides and OWASP'
  merge: -1
  pgno: 354
- img_proc: true
  md: '+   * Volunteer at your next local information security event

    * Reach out to other information security community members


    # # Free security_projects, labs, and more


    +   * Bug Crowd University: https://github.com/bugcrowd/bugcrowd_university

    * Hack this site: https://www.hackackthissite.org/

    * Try Hack Me: https://tryhackme.com/

    * Pentesterlab: https://pentesterlab.com/exercises?dir=desc&only=free&sort=published_at

    * OWASP Project Inventory: https://owasp.org/projects/

    * Network Vulnerability Scanners: A network vulnerability scanner that allows
    a pentester to discover the existing vulnerabilities on a target network device
    (computer, router, IoT device, or such) in an automated manner. Most good-quality
    network vulnerability scanners need customization to get the maximum benefit out
    of it. The customization mostly depends on the target it is being used.


    +   * celerystalk: celerystalk helps automate network scanning and enumeration
    process with asynchronous jobs, while retaining full control of which tools the
    pentester wants to run on the target.


    +   * OpenVAS: OpenVAS is a free software implementation of the widely popular
    Nessus vulnerability assessment system.


    +   * Vuls: Vuls is an agentless vulnerability scanner for Linux-based and FreeBSD-based
    operating systems. The scanner is written in Go language.


    +   * Web vulnerability scanners: A web application vulnerability scanner allows
    a pentester to discover vulnerabilities (XSS, SQL, and so on) in any target web
    application (sometimes webserver) in an automated manner. Most good-quality web
    vulnerability scanners need customization to get the maximum benefits out of it,
    and the customization mostly depends on the target it is being used:'
  merge: -1
  pgno: 355
- img_proc: true
  md: '+   • ACSTIS: ACSTIS is an automated client-side template injection (sandbox
    escape/bypass) detection for AngularJS, ACSTIS helps pentesters scan certain web
    applications for AngularJS client-side template injection vulnerabilities (sometimes
    referred to as CSTI, sandbox escape, or sandbox bypass).


    +   • Arachni: Arachni is a scriptable framework for reviewing the security of
    web applications. It is a feature-rich, modular, high-performance Ruby framework
    aimed toward penetration testers and administrators review the security of modern
    web applications.


    +   • JCS: JCS is a Joomla vulnerability scanner that comes with automatic database
    updater for exploitdb.


    +   • Nikto: Nikto is an open-source GPL web server scanner that performs through
    tests against web servers for different types of vulnerabilities.


    +   • SQLMate: This is a friend of SQL map that identifies SQL vulnerabilities
    based on a given disk.


    +   • WPScan: WPScan is a black box WordPress content management system vulnerability
    scanner.


    +   • Wapiti: Wapiti is a black box web application vulnerability scanner that
    also has fuzzers built-in.


    +   • cms-explorer: cms-explorer is a tool used to find CMS, also known as content
    management system, used by any target web application.


    +   • w3af: w3af is an open-source web application security scanner that helps
    penetration testers identify vulnerabilities in any target web application. It
    can also be customized based on the target it''s used against.


    # Conclusion


    As stated earlier, it''s a difficult job to compile the daily work of a penetration
    tester in a single place. However, in this chapter, we tried our level best to
    give you an overview of it, and we believe some of you'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'found it fascinating. We also spent a good amount of time understanding the
    learning curve of a seasoned penetration tester.

    So, you''ve come to the end of this book.


    Congratulations! We strongly believe you''ve enjoyed this book, and we are hoping
    that we were able to deliver some knowledge, which would help you start your career
    as a penetration tester. We wish you all the very best for your career as a penetration
    tester professional.


    #  Points to remember


    +   - Stay informed about penetration testing. Just like any other job, the more
    you know, the better off you will be. Learning about the latest threat landscape
    can help you know about the myriad of attacks and patterns coming out daily. This
    information strengthens your knowledge of what you need to be aware of as a penetration
    tester protecting against them.


    +   - Building your reputation is important. For someone (anyone) to let you right
    into their network''s infrastructure where all their data is stored, they should
    trust you. If you build your reputation as somebody who cannot be trusted, it
    affects your career as a penetration tester. This indicates that you cannot be
    a criminal! You need to act ethically in all circumstances. Construct your network
    of peers and people who can vouch for you and act in a way that makes you come
    across as a honorable and skilled specialist.


    +   - You must understand what hackers do. As an ethical person, it''s challenging
    to think like a criminal, but this is where great penetration testers succeed.
    You must think beyond a person with ethics would do, but achieving this is not
    easy. You can read about attacks that happened in the past to learn more about
    those conducted them.'
