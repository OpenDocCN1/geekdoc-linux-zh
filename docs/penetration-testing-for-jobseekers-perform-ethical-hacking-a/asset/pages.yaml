  md: '# DVWA cross-site scripting vulnerability


    Cross-site scripting attack is possible when an application does not provide input
    sanitization and output encoding. The following is the server-side PHP source
    of DVWA XSS module when security is set to low. Let''s understand what''s happening:


    +   1. <?php

    2. if (!array_key_exists("name", $_GET) || $_GET[''name''] == NULL || $_GET[''name'']
    == '''') {

    3. $isempty = true;

    4. } else {

    5. echo ''<pre>'';

    6. echo ''Hello '' . $_GET[''name''];

    7. echo ''</pre>'';

    8. }

    9. ?>


    In line 2, the application checks whether the GET parameter name is sent by the
    client and ensures that it is not NULL or empty. After, at line 6, we see that
    the application retrieves the name parameter using $_GET[''name''] and sends it
    back to the client/browser using an echo statement. So, what is being done wrong
    here? The parameter name is coming from the client, which is completely untrusted.
    A malicious user can inject whatever is needed to harm an end user, including
    malicious JavaScript and HTML code. Typically, an attacker injects JavaScript
    code, with <script> tags, to execute XSS payload as the same script gets echoed
    back to client without any output encoding.


    Now, let''s change the DVWA security to medium see how it handles the untrusted
    data:


    +   1. <?php

    2. if (!array_key_exists("name", $_GET) || $_GET[''name''] == NULL || $_GET[''name'']
    == '''') {

    3. $isempty = true;

    4. else {'
