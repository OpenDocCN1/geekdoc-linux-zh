    # HTTP session management


    HTTP is a stateless protocol, which indicates that there are no built-in ways
    to keep track of requests that are related. Each request is treated as an independent
    request. HTTP uses client-server architecture and utilizes TCP as its transmission
    protocol, and multiple requests can be simply sent over one TCP connection. However,
    these are additionally considered independent by both the client and the server.
    The obvious question that appears here is, then how does HTTP protocol maintain
    sessions? The answer is through cookies. Cookies are name-value pairs that are
    kept on the browser and sent automatically in subsequent HTTP requests. The server
    produces and send them to the client by utilizing the set-cookie HTTP response
    header. A cookie is sent from the browser using the cookie request header. The
    cookie header ends out name-value pairs separated by semicolons. The set-cookie
    header contains added directives and parameters for cookies. These aid browsers
    in recognizing just when and how to submit them. As long as the URL asked for
    within the same domain and path defined in the cookie will be sent with every
    request. Tracking sessions is very important for generation, transmission, and
    storage of delicate session tokens. Any kind of misconfiguration at any stage
    might put the security of users'' data at risk. Factors ought to be kept in mind
    while establishing an application that keeps user sessions.


    # Same-origin security policy


    The same-origin policy is a web browser security system that aims to stop websites
    from attacking each other. The policy limits scripts of one origin from accessing
    data on another origin. An origin contains a URI scheme, domain name, and port
    number. For an example, consider the following:


    http://store.example.com/dir/page.html


    The following table gives examples of origin comparisons with the above URL:


    | URL | Outcome | Reason |

    |---|---|---|'
