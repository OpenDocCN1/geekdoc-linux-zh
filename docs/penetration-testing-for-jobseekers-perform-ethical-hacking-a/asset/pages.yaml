    # **PCI DSS v3.2.1:** Requirement 11 of PCI DSS 3.2.1 particularly mandates the
    performance of routine penetration testing. Organizations that come within the
    scope of PCI DSS must do internal and external penetration testing at least annually,
    or after any considerable changes to the infrastructure. PCI DSS penetration testing
    mandates that the testing is performed by a qualified tester, where certifications
    and past experience is taken into account.


    PCI DSS penetration testing must include the assessment of infrastructure and
    applications throughout the cardholder data environment (CDE), from both inside
    and outside the organization’s network. Visit the following link for more information:


    https://www.pcisecuritystandards.org/documents/PCI_DSS-QRG-v3_2_1.pdf


    # NHS data security and protection toolkit


    The Data Security and Protection (DSP) toolkit is an online self-assessment tool
