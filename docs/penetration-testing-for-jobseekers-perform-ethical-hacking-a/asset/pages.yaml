  md: '# # Understanding how access points and a client communicates


    In this section, we will try to understand how a Wi-Fi client connects to a wireless
    network by deep diving into each stage. Figure 8.3 showcases the communication
    between a Wi-Fi access point and a client on a very high level:


    ![](img/5cafe5b4b24a423ad005874773aac823_298_0.png)


    Figure 8.3: Wi-Fi handshake


    # ## Probe


    At the beginning of any 802.11 authentication and association procedure, the client
    first tries to find all the readily available frequencies and looks for an SSID
    to join. The SSID (also known as the Service Set Identifier) is nothing but the
    name of your wireless network and is also known as the network ID. The client
    willing to join the access point first sends a probe request frame, which has
    details like the supported data rates, as shown in figure 8.3. After that, the
    access points available in the area reply with probe responses that contain the
    SSID and BSSID. Here, SSID is the access point name, and BSSID is the MAC of the
    access point.'
  merge: -1
  pgno: 298
- img_proc: true
  md: 'Once the discoverer an SSID that matches with its configuration, it will

    send out an authentication request to the access point. It is very essential

    to note that the authentication request and authentication response packets

    exchanged in this phase do not provide any sort of encryption. Here, the

    authentication request and response exchange are only used by the access point

    to register the client''s MAC address. When MAC filtering is enabled in any

    access point, this information is used to filter clients on their MAC.


