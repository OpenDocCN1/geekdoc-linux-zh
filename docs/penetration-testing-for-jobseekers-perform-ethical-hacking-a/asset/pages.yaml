    nations, organizations, or military contractors and gain secret information from
    opponents and be well prepared for any type of upcoming threat to the country.


    # Hacktivists


    Hacktivists are the types of hackers who plan to hack federal government and company
    internet sites for a social or political purpose. They position themselves as
    activists, so they are known as hacktivists. Hacktivists can'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'be a specific, or it can be a bunch of anonymous hackers whose intent is to
    unauthorized access government internet sites and networks.


    # # Elements of cybersecurity


    There are different elements of cybersecurity, and they are as follows:


    +   - Network security

    - Application security

    - Cloud security

    - Mobile security

    - Database security

    - Data security

    - Identity and access management

    - Endpoint security

    - Disaster recovery/business continuity planning

    - End-user education, also known as security awareness education


    As a part of this book, we will try to cover some of these elements in detail
    in the later chapters.


    # # Cyber security principles


    Cyber security has to start from somewhere. Typically, that somewhere is the checklist
    of the most important security principles. In that checklist, **confidentiality,
    integrity, and availability (CIA)** are the main entries since these are normally
    considered as the primary aims and goals of any type of security framework. This
    is the reason why they are seen as security basics and are referenced by the term
    CIA triad, as shown in figure 2.2:'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Confidentiality


    ![](img/5cafe5b4b24a423ad005874773aac823_48_0.png)


    Figure 2.2: The CIA triad


    # Confidentiality


    Confidentiality is the concept to make certain the defense of the secrecy of data,
    objects, or resources. The objective of confidentiality is to avoid or minimize
    unauthorized access to data. This is the initial concept of the CIA triad. Confidentiality
    concentrates on the security procedures to ensure that no person apart from the
    designated recipient of a message receives it or can read it. Confidentiality
    protection provides a means for authorized users to access and communicate with
    resources, yet it proactively stops unauthorized users from doing so. There is
    a range of security controls that can give protection for confidentiality, consisting
    of but not limited to encryption, access controls, and steganography, and so on.


    # Integrity


    The second principle of the CIA triad is integrity. Integrity is the principle
    of ensuring the dependability and accuracy of data. Integrity protection avoids
    unauthorized alterations of data. Properly applied integrity controls ensure that
    data remains right, unchanged, and maintained. It provides a means for authorized
    modifications while safeguarding against unintended, malicious, and unauthorized
    activities (such as viruses), along with errors made by authorized users.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Availability


    The third concept of the CIA triad is availability, which implies authorized elements
    (for example, **users**) ought to be approved timely and continuous access to
    authorized objects or resources. If a security tool provides availability, it
    provides a high degree of assurance that the data and resources reach an authorized
    user when requested. Availability consists of effective uninterrupted access to
    things and avoidance of **denial-of-service (DoS)** attacks. Availability also
    indicates that the sustaining infrastructure, including network services, communication,
    and access control devices, allows authorized users to gain certified access.


    # Introduction to penetration testing


    A **penetration test**, or a **pen test**, is an attempt to evaluate the security
    of an IT framework by safely attempting to discover and exploit vulnerabilities.
    These vulnerabilities may exist in operating systems, services and application,
    improper setups, or high-risk end-user behavior. Such assessments validate the
    effectiveness of security systems in addition to ensuring end-user adherence to
    security policies.


    Penetration testing is typically performed using manual or automated technologies
    to methodically compromise servers, endpoints, applications, wireless networks,
    network gadgets, smart phones, and various other possible factors of exposure.
    Once vulnerabilities have been exploited on a certain system, testers might attempt
    to utilize the compromised system to launch succeeding exploits at other internal
    resources, particularly by trying to incrementally amass greater levels of security
    clearance and much deeper access to connected systems and information by means
    of privilege escalation.


    # The importance of penetration testing


    Cybersecurity is critical for maintaining the security of a company''s network,
    system, and other essential properties. Penetration testing aids the security
    team in targeting certain aspects of a system to discover any kind of existing
    vulnerabilities and design imperfections. A **pentester** helps firms by acknowledging,
    searching, breaching, and reporting the existing vulnerabilities in their infrastructure.'
  merge: -1
