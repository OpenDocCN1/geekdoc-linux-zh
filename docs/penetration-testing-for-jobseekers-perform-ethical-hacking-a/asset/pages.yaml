  md: '# About the Author


    Debashish Mandal is an information security professional with 10+ years of experience
    in penetration testing, red teaming, vulnerability and exploit research. His primary
    areas of expertise are application, networks security and vulnerability research,
    and reverse engineering. Throughout his career, Debashish has published several
    patents for developing various defensive security solutions. Being an open-source
    enthusiast, he has authored and contributed to several open-source projects related
    to cybersecurity. In the past, Debashish has also presented his research on various
    defensive and offensive security topics at various international security conferences,
    such as BlackHat Europe Briefings, Brucon, and SigSegV. Debashish has discovered
    security vulnerabilities and published security advisories for various popular
    and widely deployed products of Microsoft, Google, Facebook, Twitter, Apple, etc.'
