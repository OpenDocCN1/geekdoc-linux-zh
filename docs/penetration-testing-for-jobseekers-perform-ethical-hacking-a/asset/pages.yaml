    # # Broken access control


    Access control applies policies such that users cannot act beyond their intended
    permissions. Failures typically cause unauthorized information disclosure, modification
    or destruction of all data or performing functions outside the user''s limits.
    Common access control vulnerabilities are discussed in the next section.


    # # Example 1: An application fails to validate user provided data


