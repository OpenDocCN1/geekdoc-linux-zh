  md: 'takes place after an effective TCP link is establishment. UDP is an easier,
    connectionless Internet Protocol. Several messages are sent as packets in portions
    utilizing UDP. Unlike TCP, UDP adds no reliability, flow-control, or error-recovery
    features to IP packets. Due to the simplicity of UDP, UDP headers include less
    bytes and in much less network overhead than TCP. The following layout shows the
    TCP header:


    ![](img/5cafe5b4b24a423ad005874773aac823_252_0.png)


    Figure 7.12: TCP packet structure


    Flag field in the TCP header is of 9 bits, which includes the following six flags:


    +   - SYN: Initiates a link between two hosts to facilitate interaction

    - ACK: Acknowledge the receipt of a packet

    - URG: Indicates that the data in the packet is urgent and needs to be processed
    quickly

    - PSH: Instructs the sending out system to send out all buffered quickly

    - FIN: Tells the remote system about the end of the communication, gracefully
    shutting down a connection

    - RST: Resets a connection'
