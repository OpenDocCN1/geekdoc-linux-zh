    # # A typical day of a penetration tester


    As stated, it is almost impossible to portray a typical day for a penetration
    tester, given just how different work environments can be and how jobs vary depending
    on the type of task that pentester is doing. A normal day can range from working
    at a client site to working from the comfort of your home/office, testing remotely
    accessible applications/networks.


    There is no normal workday for a penetration tester. The day can be exciting,
    exhausting, stimulating, or all of them. Sometimes, pentesters can see their targets
    at their weakest and most vulnerable point, or even at the strongest and most
    secure state. It is the work of penetration testers to put themselves in an attacker''s
    shoes and locate weak points before the bad hackers do.


    Throughout the morning, the pentester or the testing team decides on a method
    for the pentest project and sets up the needed tools and environment. Sometimes,
    this includes assembling specialists call open-source intelligence, also known
    as OSINT, which hackers use when attempting to attack any system.


    Usually, in the second half of the day, they carry out the tests that they spent
    the morning planning. The other days consist of performing simulations to examine
    other facets of internal risks. For instance, penetration testing teams may target
    a selected company employee with phishing attacks (means of social engineering)
    or various other techniques to see how they respond to such probes.'
