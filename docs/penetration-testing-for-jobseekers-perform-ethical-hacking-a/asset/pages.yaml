  md: 'Software and data integrity failures are associated with code and framework
    that does not safeguard against integrity violations. An instance of this is where
    an application tests plugins, libraries, or modules from untrusted sources, repositories,
    and content delivery networks (CDNs). An insecure CI/CD pipeline can introduce
    the potential for unauthorized access, harmful code, or system compromise. Lastly,
    many applications now include auto-update functionality, where updates are downloaded
    and installed without enough integrity verification and applied on the formerly
    trusted application.


    Attackers might potentially upload their own updates to be dispersed and run on
    all installations.


    Another instance is where objects or data is encoded or serialized right into
    a structure that might be vulnerable to insecure deserialization.


    # Security logging and monitoring failures


    There is no straight vulnerability that can emerge as a result of these problems,
    but generally, logging and monitoring are quite important, and their absence or
    failings can directly impact visibility, incident alerting, and forensics. Therefore,
    it''s crucial to have a practical logging and monitoring system to gather logs
    and give alerts if any kind of breakdowns or errors occur; else, these can go
    unnoticed for a very long time and cause a lot of damage.


    A few possible things that are included in this vulnerability are:


    +   * Monitoring monitoring and alerting systems

    * Monitoring systems unable to discover dubious activity or unable to raise alerts
    in real time

    * Actual time of events are not logged

    * Logs not checked for integrity

    * Logs not pushed to security information and event management tools, in case
    of failure of the application server holding the logs

    * Unclear or improper logs that do not provide any useful information or understanding


    # Prevention of security logging and monitoring failures


