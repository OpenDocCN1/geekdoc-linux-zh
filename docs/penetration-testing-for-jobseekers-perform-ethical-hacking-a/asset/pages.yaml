  md: 'There is three-way handshake while establishing a TCP connection between hosts.
    This handshaking guarantees a successful, dependable, and connection-oriented
    session in these hosts. The procedure of establishment of a TCP connection includes
    three actions, as shown in the following figure:


    ![](img/5cafe5b4b24a423ad005874773aac823_253_0.png)


    Figure 7.13: TCP three-way handshake


    Consider a client intends to interact with the server. A TCP connection develops
    when the client sends out a SYN packet to the server. The server, upon receipt
    of the SYN packet from the client, replies to the client with a SYN+ACK packet.
    The client replies with an ACK packet when it receives the SYN+ACK packet from
    the server, and after effective handshaking, it results in the establishment of
    a TCP connection.


