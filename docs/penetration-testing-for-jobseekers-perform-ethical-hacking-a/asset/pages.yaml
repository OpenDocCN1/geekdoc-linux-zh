    The regulation that affects all organizations that run in the European markets
    is the General Data Protection Regulation (GDPR). In the UK, the GDPR''s requirements
    are preserved in the Data Protection Act 2018 (DPA 2018), ensuring that they remain
    in place after the UK completes its withdrawal from the EU. The GDPR (refer to
    figure 9.2) covers all facets of'
