  md: '# CHAPTER 5


    # The Art of Secure Source Code Review


    # Introduction


    Secure code review is a customized job that includes manual and/or automated review
    of a software or application''s source code to pinpoint security-related weaknesses
    (problems) in the source code. Secure code review does not try to recognize each
    and every problem in the code; instead, it looks for problems that might disrupt
    the security of the application or the integrity of user data. The main objective
    of secure code review is to equip the programmers with information to help them
    make the application''s source code more secure and robust.


    # Structure


    We will cover the following topics in this chapter:


    +   - Introduction to secure source code review

    - Manual secure source code review

    - Automated secure source code review

    - Automated source code scanning techniques

    - Automated source code review tools

    - Examples of different vulnerabilities


    # Objectives


    After studying this chapter, you should have a better understanding of the process
    of secure source code review and its importance. We will deep dive into two different
    ways of secure source code review: manual and automated source code review. We
    will also discuss their importance. Lastly, we will deep dive into the source
    code of an intentionally vulnerable web application project and try to identify
    the security problems in it.'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# # Introduction to secure source code review


    Almost all software development life cycle (SDLC) includes testing and validation
    of program features, which is often completed with a source code review by either
    a peer or an external entity/third party. The review verifies that the application
    works as expected and the required features are implemented properly. Nonetheless,
    an added review with an emphasis solely on security ought to be carried out.


    Now, let''s understand how secure source code review can help a penetration tester
    with targeting an application''s security posture assessments. A black-box penetration
    tester is usually unaware of the internal architecture of the target application
    being tested. However, a white box application penetration tester provides a completely
    different viewpoint of the target application being assessed. In-depth web application
    penetration testing, understanding the source code helps the penetration tester
    go deeper. With white box testing, the penetration tester must be well-versed
    in the programming language used. The process is transparent because the penetration
    tester can inspect how the user provided inputs flow through the source code,
    the logical control paths, and so on. Source code review can expose crucial security
    problems and vulnerabilities that are usually unseen during black box penetration
    testing.


    The goal of a secure code review is to locate and determine specific security-related
    problems within the code, where a harmful user might utilize to compromise the
    confidentiality, integrity, and availability of the application. For example,
    an unverified input to a limited size buffer may cause buffer overflow and enable
    a destructive user to carry out arbitrary code as well as privilege escalation.
    A secure source code review aims to locate these kinds of issues, notify development
    groups about them, and eventually, reduce the number of vulnerabilities in the
    application.


    # # Manual secure source code review


    Manual secure code review is the process of reviewing source code line-by-line
    in an effort to recognize prospective vulnerabilities. It is a tiresome process
    that requires skill, experience, persistence, and patience.'
  merge: -1
  pgno: 171
- img_proc: true
  md: 'Vulnerabilities uncovered, and ultimately resolved, through the manual review
    process can significantly improve an organization''s security.

    There are three main stages of a manual secure code review: **discussion with
    developers, execute code review**, and reporting:


    +   **Discussion with developers:** By beginning with a meeting with the developers,
    the review team has an opportunity to recognize the intent of the application
    before examining the code. After getting a fundamental understanding of the intended
    service function or ability of the application, the meeting focuses on crucial
    security touch points, as developers'' technique for authentication, data validation,
    and logging.


    +   **Execute code review:** After the meeting, the review team functions independently
    to review the application in its entirety. Rather than handing off individual
    code files to particular team members, each participant reviews the entire application.
    This approach plays to the strengths of each individual reviewer, usually causing
    the identification of different yet pentinent findings. The other advantage is
    that having multiple eyes on the exact same set of code serves as a quality check
    to ensure that the findings are correct.


    +   **Reporting:** After the individual code reviews are completed, the team meets
    to share the results. Each reviewer has the opportunity to review others'' findings
    and go over which particular findings might appear in one team member''s listing
    but not in another''s. This phase also helps it certain that the findings are
    reported relevant. The final list of findings, along with descriptions and prospective
    mitigations, is then presented to the designers/architects/developers using a
    conventional report layout.


    # Automated secure source code review


    Source code analysis tools, also referred to as Static Application Security Testing
    (SAST) tools, can help analyze source code or compiled variations of code to help
    locate security flaws. IDE. Such tools can assist you to detect concerns throughout
    software application development. SAST tool feedback can conserve time and effort,'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'specifically when compared to locating vulnerabilities later in the development
    cycle.


    # Different stages of an automated source code assessment


    An automated source code scanner looks at program source from various points of
    view. Code review tools will have separate customizable engines/modules to inspect
    source code. Each of these scanning engines tries to identify different types
    of security problems in different aspects of the source code:


    +   - **Data flow:** The data flow analyzer discovers prospective vulnerabilities
    that involved tainted data (user-controlled input) put to potentially dangerous
    use, for example, buffer overflow and SQL injections.


    +   - **Control flow:** The control flow analyzer discovers potentially unsafe
    sequences of procedures, for example, time of check/time of use (TOCTOU, TOCTTO
    or TOC/TOU) issues and uninitialized variables.


    +   - **Semantic:** The semantic analyzer spots potentially dangerous uses, features,
    and APIs at the intra-procedural level, for example, deprecated features and risky
    features.


    +   - **Structural:** The structural analyzer discovers possibly unsafe problems
    in the structure or definition of the program, for example, dead code.


    +   - **Configuration:** The configuration analyzer looks for errors, weak points,
    and policy violations in an application''s implementation configuration files.


    Automated source code scanning can be divided into a few phases. The technique
    may vary from scanner to scanner. Here we are referring to the scanning methods
    used by one of the most popular source code scanning tools called fort. For a
    very high level, these phases are as follows.


    +   - **Build integration:** The first phase of source code evaluation entails
    choosing whether to integrate Static Code Analyzer (SCA) right into'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'the build compiler system.


    +   Translation: In this phase, source code is collected, and using a series of
    commands, it is converted into an intermediate style that is related to a build
    ID. The build ID is typically the name of the task being scanned.


    +   Analysis: In this phase, source files identified during the translation phase
    are scanned and an analysis results file is prepared. Typically, for fortify scanner,
    Fortify Project (FPR) format is created.


    +   Verification of the translation and analysis: This phase ensures that the
    source files were checked using the right rule packs and that no significant errors
    were reported.


    # Automated source code review tools


    Can we imagine kicking back and by hand reviewing each line of code to locate
    flaws in it? To make our job easier, numerous types of static analysis tools are
    readily available in the market. They help assess the code during development
    and identify fatal defects early in the SDLC phase. Such problems can be gotten
    rid of before the code is pushed for functional QA. A defect located later on
    is always pricey to take care of. Here are some of the popular source code review
    tools, listed in no specific order:


    +   PVS Studio: Commercial tool that supports C, C++, C++11, C++/CLI, C++/CX,
    C#, and Java


    +   Reshift: Commercial tool for Java that uses machine learning


    +   CAST: Commercial tool supports over 30 languages


    +   Veracode: Commercial tool that supports Android, ASP.NET, C#, C++, Classic
    ASP, COBOL, ColdFusion/Java, Go, Groovy, iOS, Java, and JavaScript


    +   Coverity: Commercial tool that supports Android, C#, C++, Java, JavaScript,
    Node.js, Objective-C, PHP, Python, Ruby, Scala, Swift, and VB.NET


    +   CodeSonar: Commercial tool that supports C, C++, Java, and C# and maps against
    the OWASP top 10 vulnerabilities'
  merge: -1
  pgno: 174
- img_proc: true
  md: '+   - Fortify static code analyzer: Commercial tool that supports almost all
    programming languages


    +   - CodeScene behavioral code analysis: Commercial tool that supports C, C++,
    Java, Groovy, JavaScript, TypeScript, Objective C, Scala, Python, Swift, Go, Kotlin,
    Visual Basic .Net, PHP, Perl, Dart, Erlang, and Ruby


    +   - SonarQube: Free tool source code for fifteen languages bugs and vulnerabilities


    # Automated source code review versus manual source code review


    As with automated source code analysis tools, manual secure code review also has
    its strengths, restrictions, and costs. Manual source code review is great at
    unwinding business logic flaws and understanding the actual intentions of a developer.
    However, automated tools struggle in these areas, causing false positives and
    worse, missing potential security issues. Flaws connected to authentication, authorization,
    cryptography, and total data validation are often best identified by manual analysis.


    Likewise, manual review is helpful for analyzing traversed code paths. Analysis
    strategies like penetration testing or fuzzing only look at code paths for which
    inputs are supplied. Lesser worked out paths or purposefully hidden code paths
    can be missed. Automated static analysis tools can comply with these rare paths,
    but they typically fail to recognize the core business logic associated with them.
    A rigorous manual code review is usually better to recognize and analyze these
    paths that are usually missed or misunderstood by most automated tools.


