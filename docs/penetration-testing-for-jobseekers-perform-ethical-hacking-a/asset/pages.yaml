    # # Identification and authentication failures


    Confirmation of the user''s identity, authentication, and session management are
    critical to protect against authentication-related attacks. There may be authentication
    weaknesses if the application does any of the following:


    +   - Permits brute force or similar automated attacks

    - Allows default, weak, or widely known passwords, such as password or admin/admin

    - Reveals session identifier in the URL

    - Permits automated attacks such as credential stuffing, where the attacker has
    a list of valid usernames and passwords

    - Uses weak or inadequate credential recovery and forgot-password procedures,
    such as knowledge-based responses, which cannot be ensured

    - Has missing or ineffective multi-factor authentication

    - Recycles session identifier after effective login

    - Utilizes plain text, encrypted, or weakly hashed passwords data stores.

    - Does not correctly invalidate session IDs


