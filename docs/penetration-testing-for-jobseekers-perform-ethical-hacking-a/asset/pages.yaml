    # Mitigation for CSRF


    As a CSRF prevention mechanism, client application-side code sends a random token
    with every POST request that it sends to the server. At the server side, it validates
    the token. The token should be generated at the server side and should be strong
    enough to be guessed. Token-based CSRF defenses are built into many web frameworks.
    It is strongly recommended to research if the framework you are using has an option
    to achieve CSRF protection by default before trying to build your custom token
    generating.


    # Insecure design


    Insecure design is a broad category representing various weaknesses, revealed
    as missing or inefficient design. There is a distinction between insecure design
    and insecure implementation. We set design defects and execution defects apart
    for a reason: they have different source and remediation. A secure design can
    still have implementation problems for new vulnerabilities that may be exploited.
    An insecure design cannot be taken care of by an ideal implementation as necessary.
    It needed security controls that were never created to prevent attacks. Among
    the elements that contribute to insecure design is the lack of company risk profiling
    in the software or system being developed, and, therefore, the failure to determine
    what level of security design is required.


