    # Legal challenges


    Among the many challenges are a penetration tester or a testing team face, **legal
    challenges** are an important part. Obviously, the person who is going to conduct
    the test here is, **on what basis should the tester be given access to the company''s
    sensitive resource?** In case of any unexpected situations, for example, a security
    breach or data loss, who should take the responsibility of the lost data? In many
    cases, the client can blame the loss of data or confidentiality breach on the
    penetration tester. Apart from this, penetration testing sometimes affects/reduces
    critical system performance. As a result, it raises availability and integrity
    issues. Therefore, it is very important to get the necessary permissions in writing.'
