    # # Most common API security problems


    With the meteoric rise of micro services and the rush to develop applications
    faster, APIs are being used more than ever to connect services and move data.
    Yet, with a growing variety of smaller applications attempting to interact with
    each other, APIs (your own and those from third parties) are becoming challenging
    to secure. The most essential API security threats consist of broken object level,
    user and function-level authorization, excessive information disclosure, lack
    of resources, security misconfiguration, and inadequate logging and monitoring.


    # # Injection


    Just like web app injection flaws, API Injection flaws like SQL, NoSQL, command
    injection, and so on occur when untrusted data is sent to an interpreter as part
    of a command or query. The attacker''s harmful data can deceive the interpreter
    into executing unexpected commands or accessing data without the correct authorization.


    In a single sentence, injection takes place when an application cannot appropriately
    compare untrusted data and code. Untrusted user data can be HTTP request parameters,
    HTTP headers, or cookies. Injection vulnerabilities can affect API systems as
    API is just another method by which untrusted user input can enter an API. Let''s
    look at how injection vulnerabilities show up in an API.


    # # Example of injection - Retrieving forum posts


    +   * Lets say that an API allows its users to retrieve forum posts by sending
    a GET request like this:

    /api/posts?id=9587

    * This will cause the API to return a post with ID 9587. The server will extract
    the corresponding forum post from the database with a query (in most cases, it
    will be an SQL query):

    SELECT * FROM posts WHERE forum_post = 9587

    * In this example, the forum_post refers to the ID passed by the user via the
    URL. Now, what if the user tweaks the GET request and changes it to the:

    GET /api/posts?id=9587; DROP TABLE posts'
  merge: -1
  pgno: 154
- img_proc: true
  md: '+   • The SQL server would interpret the portion of the ID after the semicolon
    as a separate SQL command. So, the SQL engine will first execute the command to
    retrieve the blog post as:

    ```sqlnSELECT * FROM posts WHERE forum_post = 9587;

    ```

    • Then, it will execute this command to delete the users table, causing the application
    to lose the data stored in that table:

    ```sqlnDROP TABLE posts

    ```


    This is called SQL Injection attack, and it can happen whenever user input is
    passed into SQL queries in an unsafe way. Note that user input in an API doesn''t
    just travel via URL parameters, they can reach the application via POST requests,
    URL path parameters, and so. It''s important to secure those places too.


    # Broken object level authorization


    Broken object level authorization happens when an application does not correctly
    verify the user sending the request has the required privileges to access a resource
    of another. APIs often tend to reveal endpoints that handle item identifiers,
    producing a vast attack surface level access control issue.


    Attackers replace the ID of their own resource in the API call with an ID of a
    resource belonging to another user. The lack of correct authorization allows attackers
    to access the specified resource. This attack can also be passed with Insecure
    Direct Object Reference (IDOR). Here is an example:


    +   • The API call use the `cust_id` parameters of the resource to access it:

    ```GET /api/shop1/customer_info?cust_id=3423

    ```

    • Attackers increment the ID (`cust_id`) of their resources by the one they guessed:

    ```GET /api/shop1/customer_info?cust_id=3424

    ```

    • The API does not check permissions and lets the call through.


    # Prevention of broken object level authorization


    Here are some key points that can be considered while eliminating broken object
    level authorization problems from an API:'
  merge: -1
