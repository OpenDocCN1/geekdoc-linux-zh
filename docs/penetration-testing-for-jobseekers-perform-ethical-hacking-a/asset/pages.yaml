  md: '# Performed translations


    | Character | Replacement |

    |--- | --- |

    | & (ampersand) | &amp; |

    | " (double quote) | &quot; unless ENT_NOQUOT is set |

    | '' (single quote) | &#39; (for ENT_HTML40) or &apos; (for ENT_XML, ENT_XHTML
    or ENT_HTML5), but only when ENT_QUOTES is set |

    | < (less than) | &lt; |

    | > (greater than) | &gt;


    Figure 5.4: htmlspecialchars chars definition


    When the translation happens at the server side, and when attacker injects <script>alert(''xss'')</script>
    into the application, the application echoes back &lt;script&gt;alert(''xss'')&lt;/script&gt;.
    The browser renders the code, but it''s not treated as JavaScript; hence, the
    injected code never executes within the browser. You can read more about the built
