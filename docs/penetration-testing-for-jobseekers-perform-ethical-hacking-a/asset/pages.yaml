  md: '# Preface


    The COVID-19 pandemic has forced all of us to embrace completely new cultures,
    such as social distancing and remote working. Since an increasing number of organizations
    are switching to remote working setups, cyber threats to any organization are
    also increasing. This is the reason why the demand for cybersecurity professionals
    is growing exponentially in 2021-22. Cybersecurity professionals are required
    in large numbers worldwide because there is a significant gap between the number
    of existing cybersecurity professionals and the cybersecurity issues faced daily.
    Where there be multiple types of jobs available in the cybersecurity domain, “Penetration
    Testing” a.k.a. ethical hacking is one of the most popular and exciting ones.


    After studying this book, you should have a better understanding of the importance
    of cybersecurity in general and penetration testing in particular. This book takes
    a practical approach for penetration testing learners by covering several computers
    and network bases. Then, it dips into the penetration testing methodologies. The
    book begins with a cybersecurity career path and prospects and then introduces
    penetration testing and its importance in the modern industry. It is divided into
    10 chapters, and it covers many different aspects of penetration testing, including
    web application, network, Android applications, wireless penetration testing,
    and preparing reports. This book also shows how a prospective penetration tester
    can set up an in-house penetration lab from scratch to hone their hacking skills.
    This book should also help readers gain a good understanding of a typical day
    in a penetration tester’s life.


    This book could be a perfect place for someone who wants to start their career
    in penetration testing or someone who has 1-2 years of experience in Penetration
    Testing / Cybersecurity and wants to upskill themselves on different domains.


    Chapter 1 will cover the importance of cybersecurity and the current cybersecurity
    threat landscape. If you want to pursue a career in cybersecurity, this chapter
    should help you understand cybersecurity career opportunities, roles, responsibilities,
    and definite career paths.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'Chapter 2 will dive deep into basic terminologies related to penetration testing
    and different types of penetration testing, methodologies, and approaches. It
    also briefly discusses the basic building blocks of cybersecurity and how it can
    help you become a good penetration tester.


    Chapter 3 will help you set up an in-house penetration testing lab from scratch
    to hone your hacking skills. This chapter mainly helps you choose the right environment
    for the lab after knowing some facts about penetration testing. In this chapter,
    we will mainly cover the lab setup required for web, network, and mobile penetration
    testing.


    Chapter 4 will dive deep into the web application threat landscape and the most
    common attacks on them. This chapter will also take you through different web
    application penetration testing methodologies, tools, and techniques to find security
    loopholes in a web app. Along with that, we will discuss penetration methodologies
    for these web applications.


    Chapter 5 will explain two different ways of secure source code review: manual
    and automated source code review. We will also discuss its importance, and then
    we will dive deep into the source code of an intentionally vulnerable application
    project and to identify the security problems in it.


    Chapter 6 will cover OWASP Mobile Top 10 vulnerabilities and how they affect mobile
    applications and their users. This chapter will also discuss some hands-on approaches
    to perform penetration tests on mobile applications developed for the Android
    platform. We will cover both automated and manual approaches for Android application
    penetration testing to find weaknesses defined in OWASP Mobile Top 10.


    Chapter 7 will walk you through the standard ways of conducting network penetration
    tests. It will also discuss the different phases of penetration tests, like footprinting,
    scanning, enumeration, exploitation, and so on, and showcase popular tools to
    perform these actions during a network penetration test.


    Chapter 8 will cover Wireless LAN security basics and common attacks against it,
    such as packet injection, MAC spoofing, and attacks against WEP, WPA and WPA2
    encryption. This chapter should be to build the technical foundation for you so
    that it''s easier for you to learn about other possible Wi-Fi attacks from other
    sources.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '**Chapter 9** will discuss the importance of reporting in any penetration testing
    process. It should cover the things that a penetration testing report must have
    and help you understand how to prepare an effective penetration testing report
    according to industry standards.


    **Chapter 10** will try to describe a typical day in a penetration tester’s life.
    Penetration testing is a very sensitive task, so we will also deep dive into several
    precautions and dos and don’ts to safely conduct a pen test.'
