    # # Setting up lab for mobile application pentest


    In the progressing world of technology, mobile applications are more dominant
    than ever; this advancement has developed a series of new attacks that were not
    pertinent in the traditional web application world. Now, we will demonstrate the
    best method of establishing your laboratory for mobile application security assessment.
    A mobile penetration testing lab may have multiple operating systems, such as
    Android, iPhone, and so on. This chapter only ought to help you establish your
    laboratory and some devices you need for Android penetration testing.


    # # Basic elements of a mobile pentest lab


    To set the environment for pen testing Android devices, the full Android Development
    Environment, with several tools, is required. In this section, we will go through
    several key elements of mobile pentest lab and how to set up them.


    # # Android Debug Bridge (adb)


    Android Debug Bridge (adb) is a flexible command-line device that allows you to
    interact with a device. The adb command assists in the selection of device activities,
    as as mounting and debugging apps, and it supplies access to a UNIX covering that
    you can utilize to run a selection of commands on a device.


    adb consists of the Android SDK platform-tools package. You can download this
    bundle with the SDK supervisor, which installs it at android_sdk/platform-tools/
    . If you desire the standalone SDK platform-tools bundle, you can download it
    from https://developer.android.com/studio/releases/platform-tools..


    Once you install Android platform tools, you should find the main adb binaries
    in the android_sdk/platform-tools/ path. You always have the option to add that
    path in your system path to be able to access the adb from anywhere. You can use
    adb to control, any Android device that is connected to your computer, be it real
    mobile device or an emulator. adb can communicate with an Android device through
    various channels, such as USB and TCP IP.'
