- img_proc: true
  md: '![](img/5cafe5b4b24a423ad005874773aac823_118_0.png)


    If we encounter an application behaving this way, there is a possibility that
    it is vulnerable to XSS.


    # # Types of XSS


    There are mainly two types of Cross Site Scripting.


    # # Reflected XSS


    Reflected XSS, also called **non-persistent XSS**, takes place when user input
    is immediately returned by a web application in an error message/search outcome
    or when the input is supplied by the user as part of the request and without completely
    saving the user''s given data.


    We have just seen the XSS module of DVWA application, where the server-side application
    is sending back user input to the client without performing any sanity check.
    Now, instead of a harmless string, let''s enter a tiny piece of JavaScript into
    it:


    ```

    <script>alert(''XSS'')</script>

    ```'
