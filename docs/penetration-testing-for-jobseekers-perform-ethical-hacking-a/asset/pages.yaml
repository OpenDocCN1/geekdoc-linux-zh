  md: 'Here, we will learn to choose the right environment after knowing some facts
    about penetration testing. In this chapter, we will mainly cover the lab setup
    required for web, network, wireless, and mobile penetration testing.


    # The importance of having an in-house pentest lab


    The obvious reason for setting up an in-house pentesting lab is to provide a hasslefree
    to evaluate your pentesting abilities. There are several benefits of setting up
    your own isolated laboratory.


    An in-house pentesting laboratory is a great way to hone skills while avoiding
    legal problems. Hacking right into other individual''s systems and networks is
    prohibited without previous approval, but it is completely lawful to set up your
    very own laboratory that mimics another person''s environment and pentest your
    own system.


    Penetration testing in a separated lab is also beneficial for a security perspective.
    Some penetration testing tools and strategies have the ability to damage the target
    computer or network. If malware is used in testing, there is the possibility for
    infection, and it may spread if testing in an internet-connected testbed. A standalone,
    isolated testbed ensures that the effects of the testing are restricted to the
    laboratory hardware and software.


    Lastly, setting up an in-house pentesting laboratory can be helpful for the research
    and development of new pentesting methods and tools. A separated lab offers a
    regulated environment for testing and the set up capacity to configure the target
    the precise requirements required for the test.


    # Topology of your pentest lab


    For a beginner, a pentesting laboratory only requires a vulnerable target computer
    and a pentesting system. In this section, we will quickly look at some basic elements
    you need in labs to exercise your web, network, and mobile penetration testing
    skills. To be able to set up one system: one for simulating the attacks and another
    system on which you will perform the attacks. Thanks to modern virtualization
    technologies, you can run multiple systems from a single computer. However, you
    need to keep a few things in mind:


    +   - The system should have enough drive space available in your host computer
    to install each virtual machine.


    +   - The system should have hardware virtualization settings enabled in BIOS
    settings.'
