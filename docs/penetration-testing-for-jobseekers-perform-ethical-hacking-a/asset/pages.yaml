  md: '# # Cryptographic failures


    One simple mental model for managing data is that it can exist in two states:


    +   - Data in transit

    - Data at rest


    You can use different controls to encrypt data in either of these states:


    +   - The first thing is to identify the defense needs of data in transit and
    at rest. For example, passwords, bank card numbers, individual information, and
    business secrets require added protection, mainly if that data falls under privacy
    laws, for example, EU’s General Data Protection Regulation (GDPR), or regulations,
    for example, financial data protection such as PCI Data Security Standard (PCI
    DSS).

    - For data in transit, you need to guarantee that you are using Transport Layer
    Security (TLS) when sending out and receiving data from your users and the systems
    you operate. You also need to check that you are using TLS between all the elements
    of your system, not only the public side of your application.


    # # DVVA insecure transport


    DVWA, by default, does not use HTTPS (or SSL) for security communication. The
    application configuration ought to ensure that SSL is utilized for all access
    regulated pages. If an application utilizes SSL to assure confidential communication
    with client browsers, the application configuration should make it impossible
    to view any access-controlled web page without SSL. Nevertheless, it is not an
    uncommon problem that the configuration of the application falls short of using
    SSL on pages that contain delicate data.


