    # ## Insecure data storage vulnerability


    A majority of applications keep some sort of information regarding their users,
    usually referred to as **personally identifiable information (PII)**. This can
    vary from tokens to medical history and credit card details. If this data is not
    saved securely, hackers can gain access and use it for various objectives.


    # ### Criticality of insecure data storage


    Insecure data storage is a high severity vulnerability with numerous possibilities
    for abuse. Designers frequently think that accessibility to the device''s file
    system and information on the device data stores are naturally safe and secure.
    However, file systems are, in fact, quite easily accessible. Additionally, rooted
    or jail broken devices circumvent the majority of the file encryption. Once there
    is unauthorized access to such information, hackers can use the data stolen from
    insecure apps or devices in several methods, with significant consequences for
    both users and businesses. Here are some instances:


    +   - **Fraud**: If a hacker manages to gain access to card or payment information,
    they can make purchases or use the information to carry out email payments and
    frauds where users are routed to deposit payments in incorrect accounts by a seemingly
    legitimate vendor.


    +   - **Track record damages**: Major hacks do not just inflict material prices
    with regulatory penalties, they also cause significant reputational damages.


    +   - **Identity theft**: Using the information gathered concerning an individual,
    a hacker can impersonate them to gather even more information or open an account
    or get a card issued in their name.


    +   - **Governing infractions**: Multiple policies govern the stringent protection
    of sensitive data, with steep penalties and various other charges for non-compliance.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Attack vectors of insecure data storage


    Insecure data storage space comprises a large number of attack vectors, consisting
    of poor file encryption, jeopardized devices, and insecure access protocols. The
    following are some of the ways in which hackers can use insecure data storage
    space to take data:


    +   * Operating system: This consists of exactly how and where the OS stores/caches
    data, images, and symbols. Poorly stored or cached data can be easily manipulated
    by hackers.

    * Development framework: This refers to how and where an application stores/caches
    data, photos, and log files or how it syncs them to the cloud. These can all contain
    sensitive, personally identifiable information. If not handled properly by the
    development framework, it can be easily accessed and manipulated by hackers.

    * Advertisement, analytic, or social network: This is data and information such
    as cookies; additionally, app user preferences are stored for advertising. It
    also includes analytics for social media networks to remember a user’s preferences.
    This information can be hacked and manipulated.

