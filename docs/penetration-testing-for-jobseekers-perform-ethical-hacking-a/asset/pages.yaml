    and recognition of system and application security measures and weaknesses. The
    security measures of systems and applications are examined to determine the effectiveness
    of the released security layer to withstand attacks and abuses. Vulnerability
    assessment helps recognize the vulnerabilities that could be used, the need of
    additional security layers, and information that can be exposed using scanners.


