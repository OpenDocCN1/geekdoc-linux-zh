    # Objectives


    After studying this chapter, you should understand the importance of reporting
    in any penetration testing process. You will learn about the things that a penetration
    testing report must have and understand how to prepare an effective penetration
    testing report. We will also look at an open-source penetration testing reporting
    framework, which will help penetration testers set up a reporting infrastructure
    from scratch.


    # Compliance and regulation standards


    Regulatory compliance is an organization’s commitment to regulations, laws, standards,
    and specifications that are relevant to its service and processes. Infractions
    of regulatory compliance usually result in legal punishment and may also lead
    to federal fines imposed. Industry standards and government regulations enforce
    periodic penetration testing as a requirement, and compliance is a must for organizations.
    Generally, these fundamental requirements drive the need for penetration testing.
    This section recognizes some of the penetration testing standards.


    # ISO 27001


    ISO 27001, part of the ISO/IEC 27000 series of standards, is an international
    information security standard that describes a framework of controls for Information
    Security Management Systems (ISMS). To become ISO certified, organizations need
    to develop and deploy a suite of security controls to identify and address security
    threats throughout their networks, applications, and all information processing
    infrastructure. The goal is to ensure that an organization’s security needs are
    fulfilled with time:'
  merge: -1
  pgno: 327
- img_proc: true
  md: '![](img/5cafe5b4b24a423ad005874773aac823_328_0.png)


    Figure 9.1: ISO 27001


    ISO 27001 calls for organizations to use controls according to their own particular
    security threats. This implies that no set of controls is compulsory, but the
    standard does describe a considerable of best practice recommendations that need
    to be considered.


    ISO 27001 Annex A. 12 - Operations Security - of ISO 27001 states that information
    about technical security vulnerabilities ought to be acquired in a prompt fashion,
    direct exposure to these vulnerabilities should be assessed, and ideal steps should
    be taken to address the involved risks.


    Penetration testing serves at several phases of an ISMS project. So, organizations
    always try to find an adaptable ISO 27001 penetration testing service provider
    that can perform assessments to fulfill these requirements. Hence, penetration
    testing service providers often assess hires based on their fluency above these
    standards. Job seekers might find the following link to learn more about this:


    https://www.isms.online/iso-27001/annex-a-12-operations-security/#:~:text=12.6,_to20address%20the%20associated%20risk


