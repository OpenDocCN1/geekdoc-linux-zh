    vulnerabilities. Unlike the remainder of the OWASP Mobile Top 10 vulnerabilities,
    these concerns do not solely rest upon the application developers but can also
    arise from insufficient documentation or bad communication from the OS side. Some
    of the most typical instances of inappropriate platform usage on Android devices
    are as follows:'
