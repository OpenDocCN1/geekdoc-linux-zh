    # Packet injection


    Packet injection is a way of tampering with an almost all network protocol by
    generating custom packets that appear to be part of the regular communication
    stream. The packet injection method enables an unknown third party to disrupt
    or intercept packets sent by sender and receiver parties. This can often lead
    to users'' ability to access restricted network services or protocols. Packet
    injection is commonly utilized in man-in-the-middle attacks.


    In order to test packet injection, we need to switch on monitor mode. We have
    already put our card in monitoring mode, so let us test packet injection. We will
    use a tool named airplay-ng to test the packet injection; to run this tool, type
    airplay-ng --test complied by the interface name. The command looks like:


    aireplay-ng --test wlan0


    If you see the message Injection is working! (figure 8.21), congratulations! Your
    Wi-Fi card is capable of doing packet injection to the target network:'
