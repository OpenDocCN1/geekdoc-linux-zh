    information:


    ```

    pstmt.setString(1, request.getParameter("account"));

    ResultSet my_results = pstmt.executeQuery();

    ```


    An attacker simply modifies the account parameter in the browser to send whatever
    account number they want to access. If not properly verified at the server side,
    the attacker can access any user''s account.

    http://myexample.com/app/accountInfo?account=notmyacet


    # # Example 2: An attacker forces client to access target URLs


    Let''s say, administrator rights are needed to access the following admin page:

    http://example.com/app/getappInfo

    http://example.com/app/admin_getappInfo


    If an unauthenticated user can access either page, it''s a vulnerability. If a
    non-admin user can access the admin page, this is a vulnerability as well.


