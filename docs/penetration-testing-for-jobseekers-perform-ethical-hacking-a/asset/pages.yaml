    # Lateral movement


    Lateral movement, also known as pivoting, is the distinct technique of using an
    instance (also described as a plant or foothold) to be able to move around inside
    a network. Essentially, it''s all about using very first compromised system on
    a network to compromise of other inaccessible systems in the same or different
    network. In this scenario, we will be using it to access the system present in
    a typically non-accessible network.


