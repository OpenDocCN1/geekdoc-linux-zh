  md: 'By default, the EternalBlue exploit gives us root privilege, but that may not
    be true for all other exploits. In cases where an exploit doesn''t give you root
    access, you may have to escalate privilege in the target system to do more things.
    Meterpreter has a command set that''s similar to the Linux shell with a great
    deal of additional capabilities. If you''re not on the target server as a root/admin
    account, you can use getuid to discover who you are and sysinfo to discover the
    specifications of the server. Despite the fact that meterpreter has an integrated
    command, metasystem, to acquire root level access, it generally does not function.


    # Knowing the system you are working on really well


    A majority of the privilege escalation methods are based on exploits of operating
    systems. So, we must first discover the target system''s kernel or OS version,
    like Windows Server 2013 R2, Ubuntu 16.04, or Linux kernel 4.4.


    # Discovering the right exploit


    Once we have information about the target system we are in, we can look for privilege
    escalation techniques for that specific system. Exploit-db is a good resource
    for that. After discovering the exploit (normally found as source code in C or
    C++), you must compile it. The biggest trouble is that you are running Kali Linux
    and might need to compile it as a Windows executable. mingw allows you to cross-compile,
    you will require lots of headers needed for compiling the exploit from source.
    One helpful option is to run Windows in a virtual machine, compile the source
    on your favorite compiler (for example, Visual Studio), and transfer it to Kali
    box. For some exploits, you can utilize pre-compiled executable of the exploit.
    However, you need to ensure that you are grabbing them from reliable and worthy
    sources and repositories.


    # Upload the exploits to the target machine


    Once we have the privilege escalation ready, we need to upload it to the target.
    The preferred way is meterpreter; it allows you to easily upload files to the
    machine or download files from a device. We can upload our exploit with the following
    command (as shown in figure 7.39):


    ```

    upload "exploit location in our device" "target area at target equipment"

    ```'
  merge: -1
  pgno: 279
- img_proc: true
  md: '```

    meterpreter > upload priv_escalation_exploit.exe c:\windows\system32

    * uploading : priv_escalation_exploit.exe -> c:\windows\system32

    * uploaded : priv_escalation_exploit.exe -> c:\windows\system32\priv_escalation.exe

    meterpreter >

    ```


    Figure 7.39: Uploading files using meterpreter


    Since you have limited access to the system, utilizing a directory that belongs
    to a current user is a reliable option to upload files.


    After uploading the exploit, we have to execute it on the target system. But before
    we do, we need to understand how it''s going to give us privileged access to the
    system. You can read the source code or any documentation available. Some exploits
    generate a shell, several of them just run as a command.


    Use the following command to carry out the exploit in the Windows system: execute
    -f "uploaded file to be executed" -i


    The -f parameter defines the executable file, and -i allows us to interact with
    the channel, which is the program that it operates on.


    In the situations where you can run only a command, the best things to do it is
    in run C:\\Windows\System32\cmd.exe, which is going to give us a shell.


