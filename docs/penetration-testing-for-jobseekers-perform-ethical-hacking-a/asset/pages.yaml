    # # OS fingerprinting


    OS fingerprinting is all about the discovery of the target OS installed on an
    endpoint by analyzing the packets that originate from it. It is used by security
    professionals as well as hackers for remotely mapping any network and identifying
    vulnerabilities that may be present in the target.


    In general, OS fingerprinting tool works for ports that contain a full TCP three-way
    handshake packets, which we discussed earlier. This means the TCP connection should
    have at least a SYN, a SYN/ACK, and an ACK packet.


    Some attributes within the TCP/IP protocol definition are left up to the implementation
    of the respective OSs. Various operating systems uses some unique defaults as
    the of these attributes. By gathering and minutely inspecting these attributes
    and their values, we can identify the operating system that these packets originated
    from. There are mainly two ways to accomplish this:'
