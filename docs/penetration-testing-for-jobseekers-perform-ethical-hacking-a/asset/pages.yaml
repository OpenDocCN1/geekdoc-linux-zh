    # Scope or out of scope


    One of one the most effective means to wreck your penetration test is to not hang
    around actively scoping the project. A common problem often faced by penetration
    testers or a testing team is understanding what is within the scope of a penetration
    test and what is not. In some cases, it is not effectively recognized by both
    parties. The normal set of things a penetration tester should do is as follows:


    +   - Revalidate the list of IP addresses/hostnames/web addresses that are in
    scope from the client.

    - If expectation is a grey testing or blackbox testing.

    - Do they want you to exclude a certain IP range/portion of a network/application?

    - Inquire whether social engineering is in the scope of the pentest.

    - Inquire about testing time frames (off hours or on hours).

    - Is physical penetration testing also expected?


    It''s very important to have a written agreement between a tester and the company/organization/individual
    to clarify all the points pertaining to data security, disclosure, and so on before
    beginning testing. A statement of intent out be drawn up and duly signed by both
    parties before any kind of testing work begins. The scope of the job needs to
    be plainly detailed, and it needs to be mentioned what you might or might not
    be doing while running vulnerability scans.


