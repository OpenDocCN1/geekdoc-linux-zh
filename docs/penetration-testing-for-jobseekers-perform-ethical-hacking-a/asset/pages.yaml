    # Conclusion


    Performing manual secure source code reviews on any applications on a regular
    basis is very important. In most cases, these reviews identify hundreds of flaws
    before these applications go to production. By eliminating these security issues
    before deployment, an organization can minimize the risk of an attacker exploiting
    these applications.


    A well-defined software assurance program includes a variety of security tools
    and techniques. Manual source code review often finds flaws that no other automated
    technique can identify easily. When source code review is combined with penetration
    testing, design reviews, and developer awareness, it can bring about significant
    improvement in the overall security of an application.'
