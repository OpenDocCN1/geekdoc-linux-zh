  md: 'We see a lot of things in the terminal (figure 8.22). Let''s break them into
    pieces to understand them better. This program airodump-ng will continue running
    unless you stop it by pressing CTRL + C.


    Let''s understand the results:


    +   - **SSID**: It shows the MAC address of the target network (04:95:E6:3A:FC:60).

    - **PWR**: It shows the signal strength of the network.

    - **Beacons**: As earlier, these are the frames sent by any Wi-Fi network to broadcast
    its presence.

    - **#Data**: It shows the number of data packets or the number of data frames.

    - **#s**: It shows the number of data packets that we collect in the past 10 seconds.

    - **CH**: It shows the channel on which the network works.

    - **MB**: It shows the maximum speed supported by the network.

    - **ENC**: It shows the encryption used by the network; it can be WEP, OPN, or
    WPA2.

    - **CIPHER**: It shows the cipher used in the network.

    - **AUTH**: It shows the authentication used on the network.

    - **SSID**: It shows the name of the network.


