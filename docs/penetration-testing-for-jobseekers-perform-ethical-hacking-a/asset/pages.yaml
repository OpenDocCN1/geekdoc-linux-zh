  md: 'To avoid the installment rogue access points, companies can set up wireless
    breach prevention systems to keep track of the radio frequency for unauthorized
    access points. In any area where many corporate offices are situated, the existence
    of many wireless access points can be found. Some wireless intrusion prevention
    system facilitate the work of auditing these access points on a continuous basis
    to discover whether there is any type of rogue access points among them. In order
    to spot rogue access points, two conditions need to be tested:


    +   - Whether the access point is already listed in the legitimate access point
    maintained by the organization

    - Whether the access point it is already connected to an existing secure network


    # Conclusion


    Wireless networks require just as security to be considered when deployed and
    set up in order to maintain them. Wireless penetration testing is a popular method
    to determine the security posture of your wireless networks. In this chapter,
    we demonstrated a practical method of utilizing several available tools in Kali
    Linux to perform attacks on wireless networks. Now, all that is left for you is
    to try out on your own in a simulated environment.


    # Key points


    +   - There are a wide variety of attacks that can be made against a Wi-Fi network.
    It''s almost impossible to cover everything in a short span, so readers are highly
    recommended to read from a wide variety of reliable sources to learn about other
    attacks.

    - Running tools and getting things done is okay, but it''s equally important to
    know how the tools are working. To achieve that, Wireshark can be your best friend.
    We would recommend that you run Wireshark every time you run any tool to know
    how these tools are running in the background and what all packets are being sent
    over the air. This will help you customize these tools and perform more advanced
    attacks.


