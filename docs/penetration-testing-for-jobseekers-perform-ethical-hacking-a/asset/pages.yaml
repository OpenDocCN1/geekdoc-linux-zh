  md: '# Wi-Fi security protocols


    In this section, we will discuss several standard security protocols followed
    by any Wi-Fi network/devices to securely communicate with each other. You might
    have seen some of these terminologies while configuring your Wi-Fi router at (shown
    in figure 8.2):


    | WiFi Name | Debashish wfi | Hide WiFi |

    |---|---|-|

    | Security Mode | WPA/WPA2-PSK Mixed(Recommended) | |

    | WiFi Password | None

    WPA-PSK

    WPA2-PSK

    WPA/WPA2-PSK Mixed(Recommended) | |


    Figure 8.2: Wi-Fi security protocols


    Let us look at some of the standard security protocols:


    +   - Wired Equivalent Privacy (WEP) protocol: it was developed in the year 1999
    and is the earliest security protocol that was used for wireless networks. It
    was discovered that the encryption it used is vulnerable in many ways and is not
    secure. An **initialization vector (IV)** attack is a common attack on wireless
    networks. The IV has to be random; in other words, the IV has to be unpredictable/unique
    in nature. WEP utilizes a 40-bit encryption key, which makes it prone to several
    attacks. Some WEP vulnerabilities reside in its RC4 implementation and key scheduling
    algorithm. FMS attacks, PTW attacks, ARP replay attack, and chop-chop attack are
    some of the- Wi-Fi Protected Access (WPA) protocol: it was developed to resolve
    the security issues of WEP. WPA is much better than WEP as it uses a more powerful
    encryption method called Temporal Key Integrity Protocol (TKIP).. TKIP uses RC4
    as its cipher. TKIP dynamically changes its secret key, which prevents attackers
    from generating their own matching encryption key used by the target network.
    Today, WPA is also obsolete due to the fact that TKIP did have vulnerabilities
    in it. TKIP is vulnerable to an attack named MIC recovery attack. A successful
    key recovery attack allows an attacker to decrypt arbitrary packets from the target
    wireless network.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '+   WPA2 protocol: It was created to provide even more powerful security than
    WPA. WPA2 uses Advanced Encryption Standard (AES), which uses a symmetric encryption
    algorithm that makes it solid enough to resist a brute-force attack.


    Both versions of Wi-Fi protocol WPA and WPA2 can be implemented in one of the
    modes:


    +   Personal (uses Pre-Shared Key (PSK)) mode: In this mode of operation, the
    user or owner of the network defines an encryption password (also known as passphrase)
    on the wireless router at the time of configuration. Then, the password has to
    be entered by any user (client device) while connecting to the Wi-Fi network.
    This is usually suitable for home networks.


    +   Enterprise (uses Extensible Authentication Protocol (EAP)) mode: This mode
    of operation provides the security that a business or enterprise wireless network
    needs. Compared to personal mode, enterprise mode is much more complicated to
    set up. This mode allows the wireless network administrator to control the Wi-Fi
    network fully. Legitimate users are provided with credentials, which are needed
    to connect to the network. The administrator is allowed to manipulate the credentials
    at any time. Enterprise mode uses EAP, which is used on protected networks to
    bring a secure way to submit identity information (for example, credentials) to
    perform the network authentication. EAP can be integrated with several authentication
    methods, such as certificates, smart cards, token, OTP, and public key encryption.


    +   WPA3 protocol: It was presented in 2018, and according to the official Wi-Fi
    website https://www.wi-fi.org/WPA3, it offers advanced security protocols. The
    WPA3 standard also replaces the Pre-Shared Key (PSK) exchange with Simultaneous
    Authentication of Equals (SAE) exchange, a method initially introduced with IEEE
    802.11, resulting in an extra secure first key exchange in private mode and improved
    security. Though Wi-Fi alliance asserts that WPA3 will be reducing security problems,
    WPA3 attacks are already out since 2019. The most popular attack that was publicly
    disclosed in 2019 is Dragon blood attack.'
  merge: -1
  pgno: 297
