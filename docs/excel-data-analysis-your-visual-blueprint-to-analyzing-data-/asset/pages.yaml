  md: '# EXCEL DATA ANALYSIS


    # CONSOLIDATE DATA


    if you have related data in multiple worksheets, or even notebooks that you want
    to combine into one location, you can do this using the Consolate option. Where
    you do this, Excel merges data from the specified locations into one central location,
    combining common data by whatever method you specify. A good use of this is to
    combine different worksheets containing sales data into a single worksheet so
    that you can analyze all data.


    The options in the Function field in the Consolid dialog define how Excel combines
    the values when you perform the consolidation. By default, Excel selects Sum,
    the most common function, to consolidate values. The Sum function adds the values
    in each of the merged ranges. For example, if each worksheet contains monthly
    sales for a salesperson Simon, Excel selects the amounts for each month and consolidates
    them.


    Before you merge your data, you must decide where to place it. You can make either
    a separate worksheet in your existing workbook, or a new worksheet. You then select
    the first cell where you want Excel to place the consolidated values. In the Consolate
    dialog box, you specify the works or worksheets that you want to consolidate and
    the type of consolidation to perform.


    After you decide how Excel will merge your data, you can decide what range of
    cells you want to merge. You can manually enter the range in the Reference field,
    select a range from one worksheet, or open another workbook and select the range
    of cells.


    ![](img/b1f17ae2919b92b22fb561904c497d03_49_0.png)


    # SELECT A CONSOLIDATION FUNCTION


    +   Select the top-left cell of the worksheet on which you want to consolidate
    data.


    +   Click Data Consolidate.


