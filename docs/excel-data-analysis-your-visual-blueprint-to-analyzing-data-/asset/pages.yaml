  md: '# EXCEL DATA ANALYSIS


    # RUN A MACRO


    You can run a macro to perform a repetitive data analysis that would normally
    require multiple steps to save some time. You can run macros in a worksheet that
    exists either in the current workbook or any other Excel workbook, as long as
    the macro is recorded. When you run a macro, Excel creates the recorded steps
    that you performed or runs the VBA code that you created in the Visual Basic Editor.
    See "Create and Edit Macros" section for more information on the Visual Basic
    Editor.


    When you create a macro, Excel stores it in one of three locations: the current
    workbook, a new workbook, or the Personal Macro Workbook. Excel opens the Personal
    Macro Workbook as a file each time you run Excel and makes all the macros that
    you store there available to any workbook. You can learn more about creating a
    macro in the section "Record a Macro".


    To run a macro from another workbook, the macro must be from a signed source,
    or you must set your macro security to Medium or Low. The default macro security
    level is High. Macros from other sources are disabled. Setting your macro security
    to Medium or Low allows you to run unsigned macros. See the section "Set Macro
    Security".


    Select macros from the Macro dialog box, which lists all available macros—that
    Excel can locate in an open workbook. Because you can only access macros in open
    workbooks, you must open the macro that you want to run.


    # RUN A MACRO


    ![](img/b1f17ae2919b92b22fb561904c497d03_179_0.png)


    +   1 Click File Open.


    +   3 Click Open.


    +   2 The dialog box opens, containing the macro that you want to run.


