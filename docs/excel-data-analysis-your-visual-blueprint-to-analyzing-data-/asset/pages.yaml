  md: '# EXCEL DATA ANALYSIS


    # AN INTRODUCTION TO MACROS (CONTINUED)


    UNDERSTANDING VBA (CONTINUED)


    # Concatenation Operator


    You can use the concatenation operator (&) to join together two or more strings.
    For example, ap & ple creates a new string, apple. VBA also enables you to


    use the + operator for concatenating strings, but for consistency purposes you
    should always use the & operator with strings.


    # Comparison Operators


    You use comparison operators between two expressions to determine if the expressions
    are equal, greater than, or less than each other.


    If you compare two string expressions, Excel looks at the characters and the string
    length. For example, if you compare abc with cd, cd is considered to greater because
    the letter C comes after A. This is true even though cd has fewer characters.


    VBA uses these operators to compare numerical or string values. If comparison
    operators compare a numerical and string value, Excel always evaluates the numeric
    expression less than the string expression.


    The following table lists comparison operators:


    | OPERATOR | PURPOSE |

    | --- | --- |

    | = | Determines the expressions are equal. |

    | > | Determines if the first is greater than the second expression. |

    | < | Determines if the first expression is less than the second expression. |

    | <> | Determines the expressions are not equal. |

    | >= | Determines the first expression is greater than or equal to the second
    expression. |

    | <= | Determines the first expression is less than or equal to the second expression.
    |'
  merge: -1
  pgno: 175
- img_proc: true
  md: '# AUTOMATING ACTIONS WITH MACROS


    # UNDERSTANDING VBA (CONTINUED)


    # Logical Operators


    Logical operators evaluate expressions and return a logical value of True or False.
    For example, you can use a logical operator to compare two comparison expressions,
    as shown in the following:


    With this expression, the If statement can execute only if both expressions are
    true.


    VBA supports six different logical expressions, and the following table lists
    its operators:


    ```

    Example:

    If val > 10 And val2 = 5 Then

    ```


    | OPERATOR | PURPOSE |

    | --- | --- |

    | Not | Negates the value of the expression. If the expression is True, the operator
    causes it to be False, or vice versa. |

    | And | Performs a logical conjunction of two expressions. If they are both True,
    the result is True. If either of the expressions is False, the result is False.
    If expression is Null, the result is Null. |

    | Or | Performs a logical disjunction of two expressions. If either value expression
    is True, the result is True; otherwise, the result is False. Just like the And
    operator, if either expression is Null, the result is Null. |

    | Eqv | Performs a logical equivalence on two expressions. If both expressions
    are True or both are False, the result is True; otherwise, the result is False.
    |

    | Xor | Performs a logical exclusion (exclusive or) on two expressions. The result
    is the converse of Eqv operator. If both are True or both are False, the result
    is False. If one expression is True and the other is True. |

    | Imp | Performs a logical implication on two expressions. If both expressions
    are True or either is False, the result is True. If the first is True and the
    second is False, the result is False; but if the first is False and the second
    is True, the result is True. |'
  merge: -1
