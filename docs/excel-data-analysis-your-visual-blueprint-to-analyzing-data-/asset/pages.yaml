    +   Excel color-codes the referenced cells.


    +   Highlight the cell reference, and select the new one.


    +   Change the cell reference in the formula.


    +   Press Enter to update the formula.


    # CHANGE ARGUMENTS


    +   Click the cell containing the formula.


    +   Click the Insert Function button to display a dialog box.


    +   Type the range changes to the formula arguments.


    +   Click OK to update the formula.


    > Note: See "Add Function via the Insert Function Dialog Box" for more information.


