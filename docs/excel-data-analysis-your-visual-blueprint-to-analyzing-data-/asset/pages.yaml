  md: '# USING QUERIES TO SCREEN

    EXTERNAL DATABASES (CONTINUED)


    You can use the Query Wizard to design a query for a selected dataset. The Query
    Wizard lets you choose the columns you want to import from each table in the database.
    You can also create filters for the data and specify how to sort the data as it
    imports into Excel.


    The most useful feature of the Query Wizard is the database filter, which limits
    Excel to import only those records that meet specific criteria. Although this
    is not a necessary step, if you do not filter the data, Excel imports all for
    any of the selected columns. You can create up to three definitions for any filter,
    but if you have more than one, you must specify how to join the definitions.


    You can import combinations of columns from the database. Excel imports the columns
    into your worksheet in the order you let them in Columns in your query box or
    the Choose Columns page of the Wizard. The first column in imports is the first
    column in your worksheet. You can reorder the columns by moving them up or down
    in the list.


    You join definitions with an And or Or option. If you select And, the record in
    the selected column must meet both of the filter requirements before Excel imports
    the data.


    If you join the definitions with Or, only one of the definitions must be true
    before Excel imports it.


