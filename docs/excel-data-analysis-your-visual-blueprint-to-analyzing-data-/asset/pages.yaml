  md: '# GETTING STARTED WITH EXCEL


    # Extra


    You can quickly eliminate unwanted named ranges using the Define Name dialog box,
    which you display by clicking Insert Name > Define. The Define Name dialog box
    lists all of the names defined in the current workbook. To delete a name range,
    click it and then delete. Excel only deletes the name range. It does not delete
    any data.


    You can use dates as names for your ranges. However, if your labels are numeric
    dates, Excel must reformat the label to match the name rules. For example, 1/31/2002
    with a number and a slash character, you cannot use in name ranges. If this date
    exists in a column that you use to create names, Excel changes the range name
    to _1_31_2002. See "Name Range" for more on ranges. See Excel Help for specific
    range rules.


    You can change a range from the Define Name dialog by selecting the desired range,
    specifying the cells in the References To field, and clicking Add. To create a
    new name in the Names in workbook field, specify the desired range in the Refers
    To field, and click Add.


    ![](img/b1f17ae2919b92b22fb561904c497d03_24_0.png)


    +   - The Names dialog box corresponds to the location of the labels.


    +   - Excel creates the range names.


    +   - Click next to the Name field to see the current range names.


    +   - Click OK.'
