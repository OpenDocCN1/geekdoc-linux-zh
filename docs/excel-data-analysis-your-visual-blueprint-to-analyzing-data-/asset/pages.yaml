  md: '# EXCEL DATA ANALYSIS


    # CREATE A PIVOTCH FROM AN EXTERNAL DATABASE (CONTINUED)


    Excel always creates a new sheet for each PivotTable that you create. You cannot
    embed a PivotTable in a worksheet, as you can with regular charts. Although when
    you use the PivotTable and PivotChart Wizard, you must specify a location for
    the PivotTable report; Excel will either place the report in the current worksheet
    or create a new worksheet within the current workbook. If you decide to place
    the PivotTable in the current worksheet, you must specify a cell that does not
    contain data values. If you do not, Excel gives you the option of creating a new
    table.


    Create the PivotChart by dragging the appropriate fields onto the Data, Categories,
    and Series pages. All the database fields appear on the PivotTable List box. As
    you add fields to the PivotChart, Excel adds the same fields to the associated
    PivotTable. But if you do not use a field on the layout, the corresponding data
    does not appear on the PivotChart.


    Fields that you drag the Category area of the PivotChart become the specific categories
    for the corresponding data points. The Category field corresponds to the Row field
    on the PivotTable. Fields that you place in the Series area identify the different
    series for the chart. The Series correspond to the Column fields on the PivotTable.


    By default, Excel creates a own Chart for the PivotChart. You can change the chart
    type with the Pivot Chart dialog box. By selecting "Change the Chart Type of a
    PivotChart" for more information about changing the chart type.


    # CREATE A PIVOTCHART FROM AN EXTERNAL DATABASE (CONTINUED)


    ![](img/b1f17ae2919b92b22fb561904c497d03_157_0.png)


    +   The Wizard indicates that Excel imported database fields.


    +   7 Click Next.


    +   The third page of the Pivot Wizard appears.


    +   5 Click Existing worksheet to place the PivotTable report in the current worksheet.


    +   10 Click Finish.


    +   You can click Next to place the PivotTable in a new worksheet.


