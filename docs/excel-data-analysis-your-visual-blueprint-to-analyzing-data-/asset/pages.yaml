- img_proc: true
  md: '# CREATING PIVOTCHARTS


    # Extra


    When you change data in the original Excel list, Excel does not automatically
    update the values in PivotChart. To automatically update the PivotChart and associated
    Pivot values, you need to refresh your chart. Excel provides three different methods
