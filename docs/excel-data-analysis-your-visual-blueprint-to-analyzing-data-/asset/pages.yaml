  md: '# EXCEL DATA ANALYSIS


    # CALCULATE A MOVING AVERAGE


    You can smooth out data series that contains a lot of variability using Excel''s
    Moving Average Tool. You might do this if you analyze a large amount of data that
    occasionally peaks that do not represent the data as a whole. For example, if
    you collect data on the sales of items, but your data occasionally includes ''spikes''
    when you promoted them, or placed on them, you might perform a moving average
    to calculate a more accurate average excluding these unexpected spikes. Using
    a moving average, you can also spot trends in the data that are not obvious in
    the raw data.


    Unlike other tools available for Data Analysis, the Moving Average tool can only
    output the values to the current worksheet. You need to specify the first cell
    you want to use for the results. Keep in mind, if the first row contains a label,
    you want the data to start in the second row.


    You have the option of creating a line chart that shows the relationship between
    the actual data and the forecasted moving average. If you omit this option, Excel
    places the chart in the same worksheet as the moving average values.


    You specify the number of values, or Intervals, Excel used to calculate the moving
    average. If Excel uses a default value of 3, which means the moving average is
    calculated by the last three values.


    Excel provides the Moving Average as part of the Analysis ToolPak add-in that
    you can load on the Add-Ins dialog box. See the section "Install Excel Add-Ins"
    for more information on loading add-ons.


    # CALCULATE A MOVING AVERAGE


    ![](img/b1f17ae2919b92b22fb561904c497d03_243_0.png)


