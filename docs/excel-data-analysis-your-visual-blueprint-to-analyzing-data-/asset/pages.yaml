  md: '# EXCEL DATA ANALYSIS


    # FILTER A LIST


    When analyzing large data sets, listing exactly what information displays in your
    worksheet is often necessary. In Excel, this limiting is referred to as filtering.
    You can filter list of data records with AutoFilter so that only the records that
    match specific criteria displays. Each row is treated as a separate record. For
    example, if you have a list of sales from different regions, you can filter the
    list to show sales from the Western region. When you apply a filter, Excel simply
    hides the records that do not match the specified criteria.


    When you select the AutoFilter option, Excel examines the values in each column,
    applies filter arrows at the top of each column of data. Excel identifies the
    columns with filters by changing the color of the arrow from black to blue. The
    arrow


    reveals one of all the unique values within that column. If you select one of
    the values, Excel displays all the records that contain that value and hides the
    other records. To filter multiple columns, you filter the first column and select
    a different value in the second column.


    Excel places three filter options at the top of each menu. (All) allows you to
    filter and redisplay records that are currently hidden by the filter. You can
    use the other options, (Top 10) and (Custom), to customize the filter. The (Top
    10) option lets you view the ten highest records. The customize lets you view
    specific rows within one column using custom filter definitions. See the section
    "Create a Filter" for more information about the (Custom) option.


    # FILTER A LIST


