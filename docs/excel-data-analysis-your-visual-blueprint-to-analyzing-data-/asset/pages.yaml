  md: '# EXCEL DATA ANALYSIS


    # SORT A LIST


    With Excel, you can quickly sort rows or columns in ascending or descending order
    based on the criteria you specify. For example, you can sort rows based on the
    names listed in the first column. By a different order, you can custom sort order
    as described in the section "Create a Custom Sort."


    When you sort a list of records in ascending order, list sorts so the smallest
    numbers are at the top of the list. If you sort text labels, Excel sorts alphabetically
    from A to Z. In descending order, Excel produces the results, placing the largest
    numbers at the top of the list and sorting alphabetically from Z to A. For more
    lists, see the section "Create a List."


    You specify your criteria in the sort dialog box. Excel sorts your rows by the
    column you select in the


    field, and then by the column you select in the Then By field. You have the option
    of specifying a third sort criterion to further sort the list.


    If you select a list of data with row column headings, you must select the Header
    Row option so that Excel does not sort that row. Also, when you choose a column
    in the Sort By and Then By fields, Excel displays the column names from the header
    row. If you do not have a header row, Excel displays Column A, Column B, and so,
    on.


    By default, the Sort dialog box sorts by your columns. If you want to sort rows,
    you must change the Options buttons in the Sort dialog box. Changing this option
    allows you to select a specific


    ![](img/b1f17ae2919b92b22fb561904c497d03_43_0.png)


