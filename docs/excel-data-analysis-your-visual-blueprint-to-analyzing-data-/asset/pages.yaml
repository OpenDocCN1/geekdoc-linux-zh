  md: '# EXCEL DATA ANALYSIS


    # AN INTRODUCTION TO MACROS


    A macro is a set of instructions that you use to automate a task. Macro enables
    you to repeat tasks much more efficiently than manually. When performing repeated
    data analysis, creating macros allows you to quickly perform the same steps in
    multiple worksheets. If you want to change each column of numbers in a worksheet,
    convert them to currency, and add them together, you can create a simple macro
    to perform this task, and Excel performs the corresponding steps. As an Excel
    user who analyzes data, you probably have a series of tasks that you perform frequently.
    By creating a macro for complex or repetitive tasks, you can save time by pressing
    a simple keystroke each time you want to perform the tasks.


    You can create a macro to perform a task as simple as adding two numbers or as
    complex as creating a user interface in Excel. To do so, you can employ one of
    two methods: use the Macro Recorder or manually create a macro using the Visual
    Basic Editor (VBE). Although many macros rarely venture past the Macro Recorder,
    you can harness the power of Visual Basic for Applications, or VBA, to create
    more. No matter how simple or complex the macros, they are all written in VBA.


    A macro is a common term in the spreadsheet world. All spreadsheet packages enable
    you to create macros to create macros with all Microsoft Office products, and
    Excel is no exception. Although you are often best suited for Microsoft Excel.


    # MACRO RECORDER


    Using the Macro Recorder is a great method for creating a macro without writing
    VBA code directly. The Macro Recorder holds to its name. When you turn it on,
    like a tape recorder, it records all the events that occur within Excel. Excel
    then creates VBA code that works well for creating simple macros, such as a macro
    that adds a column of numbers or changes the layout of the page. But because the
    Macro Recorder creates a macro by recording your actions, it cannot create a complex
    macro, such as one that repeats a process until meeting a specific condition or
    one that displays a custom dialog box. Excel macros require the use of VBA.


    The Macro Recorder does well in conjunction with the Visual Basic Editor: You
    can modify macros that you create with the Macro Recorder in the VBE. If you want
    to create a macro that sums column of data in your worksheet, you then edit the
    macro in modifying it to run until all Excel processes completes. Combining the
    use of the Macro Recorder and the Visual Basic Editor simplifies the macro creation
    because Excel codes part of it for you. See the "Record a Macro" for more information
    on recording a macro in Excel.'
  merge: -1
