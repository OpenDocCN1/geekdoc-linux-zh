  md: '# PIVOTTABLE BASICS


    Using a PivotTable, you can create a dynamic and immediate summary of your Excel
    list or External database. PivotTables allow you to cross-tabulate, summarize
    data records in one or more ways by combining fields from different fields. For
    example, you can analyze the order amounts for salespeople from each, find the
    total sales per salesperson, and rank the salespeople by total sales amounts.
    You can accomplish all of this by simplifying the location of reports and applying
    filtering


    options. PivotTables are dynamic because you can change a report''s appearance
    instantaneously as well as create links to the original data to refresh the table
    when your data changes.


    You can use Excel-accessible database to import data values and create a PivotTable
    report. See Chapter 5 for more information on importing data values from external
    sources.


    # Filtering and Grouping Data


    # PivotTable Restrictions


    Large lists work in PivotTables, you can quickly filter them to show specific
    values, and reveal sections of data. To construct your PivotTable, you drag fields
    - basically the labels of data - to layout. The field acts as a filter for your
    data in that you can select which values you want to display for each field. Excel
    includes the Option with each field, which you can use to display all possible
    values for that field, for example if you select All the PivotTable displays all
    months. If you want to select specific values, you can select them from Column
    and Rows Fields. The field only allows the selection of one value and that matches
    your data records. See the section "Field Filter" for more information on filtering.


    Your PivotTable will work properly, consider the following guidelines and restrictions:


    +   You must label each column Excel will make them into the fields on the PivotTable
    report.


    +   Because a Pivot report creates the necessary totals based upon the fields
    you have in the report, you must remove any automatic totals from the list.


    +   Excel uses the entire list, even if you do not want data in the PivotTable,
    you must filter the list to another worksheet using the Advanced Filter. See Chapter
    3 for more information.


    +   Excel allows you to create a PivotTable that contains a maximum of 8000 total
    items. You can have 256 fields in the Page area and 256 fields in the Data area.
    The other areas are only limited by the overall size limitation.


    Once you construct your PivotTable, you can use Excel''s Group option to combine
    items into one or to show a specific relationship. See the section "Group PivotTable
    Data Tables" for more information on the grouping.


    # PivotTable Data Types


    No matter what the data source, you must make your data source fields one of the
    following types:


    | TYPE | DESCRIPTION |

    | --- | --- |

    | Category | Contains a text value that describes the data. You use category type
    values as labels for the Row, Column, and Page fields. |

    | Data | Contains a value to summarize. Typically the data values are numbers,
    but you can also summarize text values |'
