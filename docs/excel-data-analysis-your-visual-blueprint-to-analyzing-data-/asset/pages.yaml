- img_proc: true
  md: '# Extra


    When you use the Query Wizard to select the database table fields to import for
    the PivotChart, you have the option of filtering the data based on a specific
    value data. If you want to import a large data table, consider filtering out only
    the desired range of values. For example, if the database contains sales information
    for which you only want to show the sales for the last three months, you can use
    the Filter data page of the Query Wizard to filter out the excess records. By
    filtering the data records, you reduce the number of records that you need to
    work with in the PivotChart.


    The Query Wizard lets you sort the database fields as imports. You can skip this
    step when importing database table fields for use with a PivotTable or PivotChart.
    Because both reports are dynamic, Excel sorts the records on the report selections.
    You can customize the sorting of the values displayed on the PivotChart by clicking
    Data -> Sort within Excel.


    ![](img/b1f17ae2919b92b22fb561904c497d03_156_0.png)


    +   - The second page of the Wizard appears.


