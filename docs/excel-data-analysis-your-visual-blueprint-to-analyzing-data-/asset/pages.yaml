  md: '# EXCEL DATA ANALYSIS


    # CREATE A CUSTOM FUNCTION


    if you cannot find an Excel function to accomplish a desired data analysis task,
    you can create a custom function within the Visual Basic Editor. You can also
    create functions using your other VBA macros.


    You can also use functions with the code you create for a macro within the Visual
    Basic Editor. You can create functions to return a value to the procedure that
    calls them. Unlike functions, you cannot call functions directly from the Macro
    dialog. When working with macros, unlike functions consist of blocks of VBA code
    grouped together to perform a complex series of tasks.


    When you create a public function in the Visual Basic Editor, it appears in the
    Insert dialog within the User Defined category. You can use these functions directly
    in your worksheet to create formulas in the same fashion as you use the built-in
    functions that come standard with Excel. Keep in mind that a function you create
    is only available when the corresponding workbook contains the function. If you
    create a specific function that you want to use with all your workbooks, you must
    add it to the Personal Macro Workbook — `Personal.xls` to ensure that it is always
    available.


    At first glance, the value of a function may seem somewhat limiting. But unlike
    variables, which do not return a value, functions always return a value, making
    them ideal for performing calculations. For example, you can create a function
    that always calculates the sales tax for an item and returns that amount.


    # CREATE A CUSTOM FUNCTION


    ![](img/b1f17ae2919b92b22fb561904c497d03_191_0.png)


    ![](img/b1f17ae2919b92b22fb561904c497d03_191_1.png)


    +   1 Click Insert Module to create a blank module in a project.


    +   2 Type Function.


    +   3 Type the name of your function.


    +   4 In parentheses, type the names of the function parameters.


    +   6 Type the data type to be returned by the function.


    +   5 Type As.


    Note: For a worksheet function, place the module in the `Personal.xls` project.


    178'
