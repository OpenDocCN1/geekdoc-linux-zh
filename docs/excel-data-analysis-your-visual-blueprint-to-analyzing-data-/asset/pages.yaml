  md: '# EXCEL DATA ANALYSIS


    # VBA DIALOG BOX BASICS


    Every Microsoft applications uses dialog boxes to gather information from the
    user, and Excel is no exception. You can create dialog boxes in the VBA Editor
    to request specific information from users. For example, you interact with the
    Open dialog box


    In Excel to select file to open. You can use VBA to create dialog boxes that resemble
    already in Excel. A good reference book for creating VBA forms and dialog boxes
    is Excel-Programming: Your Visual Blueprint for Interactive Spreadsheets, 2002.


    # THE VISUAL BASIC EDITOR TOOLBOX


    With the Visual Basic Editor, you can create custom dialog boxes that can use
    with your macros. These custom dialog boxes are referred to UserForms in the Visual
    Basic Editor. When you create a UserForm, you design it using various controls
    in the Toolbox.


    +   - ARROW BUTTON


    +   - LABEL


    +   - TEXT BOX


    +   - COMBO BOX


    +   - LIST BOX


    +   - CHECK BOX


    +   - FRAME


    +   - OPTION BUTTON


    +   - COMMAND BUTTON


    +   - TOGGLE BUTTON


    +   - TAB STRIP


    +   - MULTI PAGE


    +   - SCROLL BAR


    +   - SPIN BUTTON


    +   - IMAGE


    +   - REF EDIT


    ![](img/b1f17ae2919b92b22fb561904c497d03_209_0.png)'
