  md: '# EXCEL DATA ANALYSIS


    # CREATE A CUSTOM CHART TYPE


    When creating charts to show analyzed data, you save time and effort by designing
    a chart that you can reuse. Using the same chart in multiple workbooks, or in
    multiple projects, you can create a custom type, or user-defined chart, which
    is a template for a chart layout. Excel stores all information about the appearance
    of the chart, including the chart type, colors, fonts, legends, and more. You
    can create a custom chart, and save it from the Custom Types tab maintains a list
    of both built-in and custom types that you can create with Excel and user-defined
    charts.


    charts available in Excel, see the section "Chart Basics." You can create a chart
    using the Chart Wizard, and format it to meet your specifications. You can also
    adjust the scaling of the axes, add gridlines, and specify whether the chart includes
    a legend or data table. All formatting and layout changes become part of the chart
    template.


    When you create a custom type, you must give it a unique name. You can also create
    a description of the chart. Any description you type displays in the box under
    the sample chart window.


    You can eliminate any unwanted-defined chart types from the Custom Types by deleting
    them. You can only delete the User-Defined chart types; you cannot remove any
    of the Built-in charts.


    To create a chart type, you must first select the default chart type. For more
    about the various types of


