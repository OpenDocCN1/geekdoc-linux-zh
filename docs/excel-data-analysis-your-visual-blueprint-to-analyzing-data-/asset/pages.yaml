    # Extra


    You can reference a specific cell in a worksheet using one of two methods. The
    first method enables you to specify the row and column number of the appropriate
    cell. For example, to specify the row and column number to reference cell A5,
    you type Cells(5,1). This is interpreted as the cell in the fifth row and the
    first column. Using the second method, you can reference rows from 1 to 65,536
    and columns from 1 to 256.


    The second method enables each cell on the worksheet between 1 and 16,777,216
    (65,536 rows and 256 columns). With this method, you specify one numeric value
    for the cell, which may confuse you at first. For example, cell M1 is referenced
    as Cells(13).


