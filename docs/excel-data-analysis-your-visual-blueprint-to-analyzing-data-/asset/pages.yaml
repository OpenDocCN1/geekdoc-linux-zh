  md: '# EXCEL DATA ANALYSIS


    # CREATE A PIVOTCHART FROM AN EXTERNAL DATABASE


    PivotChart combines the dynamic, cross-tabulation ability of the PivotTable with
    the visual aspect of a chart. This allows you to dynamically analyze data and
    quickly spot any trend. Although you can use PivotCharts with any data source,
    they are better suited for smaller datasets, because if you try to show too much
    data on a chart, it becomes difficult to interpret. On PivotTables, you can


    You can use an external database that Excel supports to create a PivotChart. When
    you do so, you actually import the data fields from the selected database. Therefore,
    you must use a database that you can access and have clearance from the database
    administrator. If you intend to share the workbook containing the PivotChart with
    other people, make sure they can also access the data. If not, you should consider
    importing the data into your workbook before creating the PivotChart. See Chapter
    5 for more information on external databases.


    You create a PivotChart using the PivotTable and PivotChart Wizard, which gives
    you the option of creating just a PivotTable or a PivotTable with a PivotChart.
    With the later option, Excel creates a PivotChart placing each of the fields you
    add to the corresponding PivotTable. You can change field locations either on
    the PivotChart or PivotTable.


    You must specify the location of the external database, on the second page of
    the PivotTable and PivotChart Wizard. You specify the information with the Query
    Wizard, which imports a database. You specify the source or type of database.
    You can only open databases that match the data source you select. After fetching,
    you can select the fields that you want to include in your PivotChart.


    # CREATE A PIVOTCHART FROM AN EXTERNAL DATABASE


    ![](img/b1f17ae2919b92b22fb561904c497d03_155_0.png)


    ![](img/b1f17ae2919b92b22fb561904c497d03_155_1.png)


    +   1 Click Data PivotTable and PivotChart Report.


    +   2 Click the PivotTable and PivotChart Wizard options. source option.


    +   3 Click the PivotChart report (with PivotTable report) option.


    +   4 Next.


    +   Alternatively, you can select an Excel list or database.'
  merge: -1
