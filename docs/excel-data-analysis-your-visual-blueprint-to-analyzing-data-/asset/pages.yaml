  md: '# EXCEL DATA ANALYSIS

    CHART BASICS


    You can create charts in Excel to provide a graphical representation of data within
    a workbook and to illustrate relationships between selected data values. Excel
    provides several types of charts, and you can customize the attributes of each
    chart type for your data.


    With most chart types, you can display up to 255 different data series on one
    chart. The only exception is a pie chart, which can only display one data series.
    All standard, 2D charts can display up to 32,000 individual data points, or values.
    All 3D charts can display up to 4,000 data points.


    # Column Chart


    Column charts allow you to illustrate the relationship between different groups
    of data. Each data point displays a vertical column on the chart. With stacked
    charts, Excel places one set of values on top of other within each column. Data
    points are color-coded to identify each data series.


    Typically, you use column charts to show changes that occur over a period of time.
    For example, a column chart works well for showing the totals for the year. You
    display the values across the horizontal axis of the chart to illustrate the passage
    of time. For example, you can display the months of the year in chronological
    order from left to right.


    ![](img/b1f17ae2919b92b22fb561904c497d03_119_0.png)


    # Bar Chart


    Bar charts display each data point, or value, as a separate, horizontal bar. With
    stacked bars, related items are stacked together on one bar. A bar chart works
    well for showing comparisons between different sets of data. This type of comparison
    is referred to as whole-to-whole comparison. For example, bar charts work well
    for comparing sales from different states in a corporation.


    ![](img/b1f17ae2919b92b22fb561904c497d03_119_1.png)


    # Line Chart


    Line charts create continuous lines that connect each data point within the corresponding
    data series. Each separate line represents a data series. You can select a chart-type
    that displays markers representing each individual data point on the line.


    Line charts work well for showing data changes over a period of time. Typically,
    the horizontal axis displays the order from left to right across the axis. For
    example, you would display the months of the year across the axis to show the
    sales for each month within your organization.


    ![](img/b1f17ae2919b92b22fb561904c497d03_119_2.png)'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Line Chart (continued)


    You can select from seven different sub-types of line charts, with or without
    data markers. You can also select from line charts that display individual values
    or stacked line charts where the top line illustrates the total of each data series.
    The line chart provides a 3D line option, but you should be careful about using
    this sub-type with a chart that displays data series. Although 3D charts look
    more impressive, you may find them distracting and more difficult to interpret
    if you chart more than two data series.


    # Pie Chart


    Pie charts allow you to show how different values in one data set compare proportionally
    to the total of the values with each piece of the pie chart representing a value.
    For example, you can use a pie chart to show the proportion of sales from each
    location of the corporation. You can use pie charts to show the data values from
    one data series because more than two creates a confusing, hard-to-interpret chart.
    For more than two series, consider either the area or donut chart.


    Two sub-types allow you to emphasize specific elements of the pie by moving them
    into a separate bar or pie chart. You explode a specific piece of the pie for
    emphasis. See the section "Exploded Series of a Pie Chart" for more information.
    Typically, you will want to use caution when using a 3D pie chart. Adding graphics
    to make a chart appear 3D often clouds the pie chart and makes it difficult to
    interpret.


    ![](img/b1f17ae2919b92b22fb561904c497d03_120_0.png)


    Keep in mind that because a pie chart illustrates how each data value makes up
    part of the total, the size of the individual slices is frequently misleading.
    You should select a different chart type when it is important to compare the exact
    size of data values.


    # XY (Scatter) Chart


    You can quickly analyze the correlation between two or more data series with an
    XY (scatter) chart because it allows you to see any trends or associations. For
    example, you can observe an increasing number of marked flyers increases sales
    of a particular item. A typical use of an XY (Scatter) chart is to plot and analyze
    scientific data using an axis to mark some chronological time frame. When Excel
    charts your data, it displays each data series in different colors and mark every
    data point within each series. You can select from five different sub-types of
    xy (scatter), which allow you to display the data markers with or without connection
    lines, or display the connection lines without the data markers just like a regular
    line chart.


    ![](img/b1f17ae2919b92b22fb561904c497d03_120_1.png)


    A straight line of data markers on the chart is an indication that you may have
    a correlation between your data series. To statistically prove or disprove this
    is the case, you must run a correlation and a covariance on your data sets. Excel
    offers these calculations as part of your Analysis Toolpak Add-in. See Chapter
    11 for more information.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# CHART BASICS (CONTINUED)


    # Area Chart


    Area charts show how values from different data series compare to a total as well
    as how the data series relate to each other. Each data series appears in a different
    color to emphasize how one data set is compared to another. For example, if the
    Texas sales sell significantly more than the California, the Texas sales show
    more visibly than the California sales.


    ![](img/b1f17ae2919b92b22fb561904c497d03_121_0.png)


    # Doughnut Chart


    Doughnut charts allow you to show how different data values compare proportionately
    to the total of the values in the corresponding data series. Each data series
    displays as a separate ring within the doughnut chart, with individual data series
    appearing smaller than the same value in inner colors.


    Because a doughnut chart visually shows how each data value makes up the total,
    the size of the individual data values is frequently misleading. For example,
    a value in an inner data series may appear smaller than the same value in an outer
    ring representing a different data series. You should select a different chart
    type when it is important to compare the exact size of data values.


    ![](img/b1f17ae2919b92b22fb561904c497d03_121_1.png)


    # Radar Chart


    With radar charts, you can analyze each data series on a separate axis of the
    chart. Each axis extends from the center of the chart, creating a chart that resembles
    a radar screen.


    Although radar charts create an interesting way to compare data values, they are
    typically more difficult to analyze. Usually, you can illustrate your data better
    using a standard chart type, such as a column, bar, or line chart.


    ![](img/b1f17ae2919b92b22fb561904c497d03_121_2.png)


    # Surface Chart


    You can use surface charts to make a geographical comparison of the data values.
    A surface chart creates a chart that resembles a topographical map. Although this
    type of chart provides an interesting visual effect, it gives limited information
    when you analyze data using it.


    ![](img/b1f17ae2919b92b22fb561904c497d03_121_3.png)'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# # Bubble Chart


    Bubble charts allow you to quickly analyze the correlation between three data
    series. By looking at the correlation between the data values, you can view any
    trends or associations between the changes of one data series compared to another
    data series. For example, you can compare the cost of the items to the number
    of items sold and show the total revenue for each price as individual bubble.


    A bubble chart resembles an xy (scatter) chart by displaying the correlation of
    data series. Each of the four sub-types of stock charts represents a data series,
    with the size of the bubble showing the value of the third data series.


    ![](img/b1f17ae2919b92b22fb561904c497d03_122_0.png)


    # # Stock Chart


    You plot stock charts for the sole purpose of analyzing data values related to
    the stock market. Each of the four sub-types of stock charts requires at least
    three data series arranged in the appropriate order. Excel creates the selected
    chart only if the data has the appropriate layout.


    The stock chart sub-type names correspond to the required data series layout.
    For example, if you select the High-Low-Close sub-type you must provide three
    data series in the order of the high price, low price, and close price. You can
    use dates, stock symbols, or names as labels for each sub-type.


    ![](img/b1f17ae2919b92b22fb561904c497d03_122_1.png)


    # # Cylinder, Cone, and Pyramid Charts


    You use the cylinder, cone, and pyramid charts to plot your data as 3D objects
    horizontally or vertically. You can select from three different horizontal chart
    options and four vertical chart options. This allows you to display individual
    data values or stacked values. You can also select a 3D vertical chart option.


    You use the horizontal versions of the charts to display each data point as a
    separate, horizontal bar, or with stacked bars. Related data items are stacked
    together on a bar. The horizontal charts work well for showing comparisons between
    different sets of data values. This type of comparison is referred to as whole-to-whole
    comparison. For example, the charts work well for comparing sales from different
    states for a corporation.


    ![](img/b1f17ae2919b92b22fb561904c497d03_122_2.png)'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# EXCEL DATA ANALYSIS


    # MODIFY A CHART TYPE


    To emphasize a different aspect of your data or apply a different type of comparison,
    you can change your chart type. See section ''Chart Basics'' for more information
    on the available chart types.


    You use the Chart menu, which appears when you select a chart and you have the
    Data menu open, to make modifications to an existing type. Depending upon the
    current chart type, some options may appear gray. For example, the 3D view becomes
    available only when you select a 3D chart.


    # Extra


    You change the chart type for any chart in a workbook using the Chart option.
    The thing you need to keep in mind is that charts require specific types of data.
    For example, if you convert an pie chart to a column chart, the individual data
    will not be emphasized.


    If you have an embedded chart in a worksheet, the Chart menu displays when you
    have any portion of the chart object selected. If your worksheet contains multiple
    objects, the changes made from the Chart menu only affect the selected chart.


    When you switch to a different chart type, by default Excel maintains the existing
    formatting. For example, if you modify the size or colors, those options apply
    to the new chart type. If you want to use the default formatting of the new chart
    type, you must select the Default formatting.


    When you select a Chart Sheet, the Chart menu always displays in the Menu bar.
    Any changes made from the Chart menu affect the chart on the Sheet.


    # MODIFY A CHART TYPE


    ![](img/b1f17ae2919b92b22fb561904c497d03_123_0.png)


    +   - Click anywhere on the chart object to select an embedded chart.


    +   - For a chart sheet, click the tab of the chart you want to modify.


    +   - Click the Chart Type button.


    +   - The Chart dialog box displays.


    +   - Select the desired chart type.


    +   - Click the appropriate chart sub-type.


    +   - Click OK.


    +   - The selected chart updates to the new chart type.


    110'
  merge: -1
  pgno: 123
