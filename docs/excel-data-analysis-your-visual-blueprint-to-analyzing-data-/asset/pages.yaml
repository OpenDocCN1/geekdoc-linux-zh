  md: '# EXCEL DATA ANALYSIS


    # CREATE A PIVOTABLE REPORT

    FROM AN EXCEL LIST


    PivotTables are an excellent tool for quickly analyzing data from an Excel list
    or external database by creating a cross-tabulated summary of the data values.
    With a PivotTable Report, you can dynamically customize columns from the list
    you want to summarize.


    You create a PivotTable Report using the PivotTable and PivotChart Wizard, which
    allows you to place the list in the current workbook or otherwise accessible.
    If you select a cell for the list before accessing the workbook, Excel automatically
    displays the range of cells in the Range box. Alternatively, you may manually
    enter the cell references for the range of cells.


    If your list is not in the current workbook, you must specify its exact location,
    including the workbook and worksheet name, in the Range box. You do this by enclosing
    in single quotes,


    placing the workbook name in square brackets. For example, if you want to retrieve
    a list from Sheet1 in the workbook ExcelList.xlsx you enter the following:


    ```

    ''ExcelList.xlsx]Sheet1!A$1:$G$10

    ```


    You must indicate the worksheet location for the PivotTable report, which can
    either be in the current workbook, or a newly created workbook within the current
    workbook. If you decide to place the PivotTable report in the current workbook
    you must specify the cell for the report. You should select a cell that does not
    contain data values. Excel gives you the option of replacing the current cell
    value.


    Although this illustrates how to create a PivotTable from an Excel list, you can
    also create one by importing data from an external database. See Chapter 5 for
    more on creating a PivotChart using an external database.


    # CREATE A PIVOTABLE REPORT FROM AN EXCEL LIST


    ![](img/b1f17ae2919b92b22fb561904c497d03_135_0.png)


    +   1 Select a cell in the list of data values.

    2 Click PivotTable and PivotChart Report.

    3 Click the Microsoft Excel list or database option.

    4 Click the PivotTable option.

    5 Click Next.


    122'
