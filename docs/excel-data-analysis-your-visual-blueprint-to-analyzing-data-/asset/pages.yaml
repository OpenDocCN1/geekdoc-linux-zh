  md: '# WORKING WITH PIVOTABLE REPORTS


    # 7


    # Apply It


    If you no longer want to include a calculated field in your PivotTable, you can
    delete it. To remove a calculated field, select the calculated field label on
    the PivotTable and then click Insert > Calculated Field. In the Insert Calculated
    Field dialog box, click the Name field and select the name of the calculated field
    you want to remove. If the Name field contains the calculated field, click Delete.


    If a calculated field does not return the results you want, you can modify the
    field. To modify it, click Insert > Calculated Field. In the Insert Calculated
    Field dialog box, click the Name field and select the name of the calculated field
    you want to modify. Make the appropriate changes in the Formula field and click
    Modify.


    Keep in mind, if your PivotTable contains other calculated fields that rely on
    the deleted field, your PivotTable may not return the desired results. It displays
    an error message, such as #NAME!, in the cells that contain a formula that references
    the deleted field. See Appendix D for information on errors.


    ![](img/b1f17ae2919b92b22fb561904c497d03_150_0.png)


    The new calculated field displays the Fields list box.


    Repeat steps 3 to 5 to create additional calculated fields.


    Click OK.


    The new calculated field displays in the PivotTable.


