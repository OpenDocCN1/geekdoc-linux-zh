  md: '# ORGANIZE WORKSHEET DATA


    # Apply It


    To remove an item, scroll through the list by clicking either the Find Next or
    Find Prev buttons until the record you want to remove displays. Delete, and Excel
    removes the record from the list in the worksheet.


    The Form dialog allows you to find or data records that meet specific criteria.
    For example, you can identify the months when your sales exceed $1000.00. By using
    the Criteria option. When you click Excel, clears the data from the cells. Type
    the criteria you want to match and click the Find Next or Find Prev button. You
    can search for records matching specific criteria by typing values into any of
    the text fields. For example, to find the months where customer returns of merchandise
    equal $2000.00, type $2000.00 in that field, whereas, to find months where returns
    exceeded $2000.00, type >$2000.00. Or to find months where returns were less than
