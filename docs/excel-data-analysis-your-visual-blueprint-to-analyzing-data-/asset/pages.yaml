  md: '# USING THE ANALYSIS TOOLPACK ADD-INS


    # Extra


    Excel has performed ANOVA calculations, but what do the results in the table mean?
    To determine whether your hypothesis is true, look at the F statistic (F) in the
    table that Excel generates. A high F statistic means you should reject the null
    hypothesis, and accept that your suspicions are true. If F is close to 1, means
    are truly equal, and you should reject the null hypothesis. You should also look
    at your P-value and F crit. If your F value is greater than the F crit value,
    you can reject the null hypothesis, and if it is smaller you cannot reject. If
    P value is large then it is unlikely that your F statistic value by chance. The
    following table summarizes how to interpret your ANOVA calculations:


    | F STATISTIC | F CRIT | P-VALUE | ACTION |

    | :--- | :--- | :--- | :--- |

    | Small | < F statistic | Large | Do not reject null hypothesis |

    | Large | > F statistic | Small | Reject null hypothesis |


