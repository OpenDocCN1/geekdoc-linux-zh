    range of values on the chart, or you can add an additional data series. You use
    the Source dialog box to both expand a data range and add a new series. When you
    expand a data range, you typically expand the range of values each series uses.
    For example, if your chart contains the monthly expenses for January through June,
    add the expenses for July to expand the data range to include July.


