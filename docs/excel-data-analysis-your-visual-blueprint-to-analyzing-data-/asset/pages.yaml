    You can use arguments to simplify your function calls. When you work with built-in
    VBA functions, you see that many of the functions have optional arguments. For
    example, the InputBox has seven different arguments, only the first one is required.
    If you want to specify any additional arguments, you must specify the argument
    values in order, leaving a placeholder for any that you do not want to use.


    # Extra


