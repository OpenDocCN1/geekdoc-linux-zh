    # RUN A MACRO AS A WORKBOOK OPENS


    If you repeatedly perform the tasks or execute the same macro whenever you open
    a workbook, you may want to create a macro that runs automatically each time a
    particular workbook opens. Because this type of macro executes only when the workbook
    opens, it works for launching menus and toolbars, determining whether specific
    conditions are met or not. The macros execute when the workbook opens by catching
    the Open Event that triggers the opening triggers.


    in the ThisWorkbook object code module, it can access other procedures within
    the same workbook. Therefore, you can create a Workbook_Open procedure that calls
    procedures located in another module.


