  md: '# AN INTRODUCTION TO FORMS


    You can use Excel to capture and organize data values. Excel provides built-in
    data forms, but you can also create custom forms. You can design forms in a worksheet
    using the available form controls


    combined with macros, or you can use VBA to create custom dialog boxes that display
    and capture information for a worksheet.


    Data Input Forms

    If you want a form to capture data values for a list, you use the Data: Form option.
    When you click this option, Excel displays input fields that match the data list.
    You can add new records to the list by entering values in the fields and clicking
    New. Excel creates the data entry form from the current list, you

    must add the initial records to the list before selecting this option.

    You can also use the Data ↴ Form option for locating different values in a data
    list. See Chapter 2 for more information on using this.


    VBA Dialog Boxes

    You can create a custom dialog box within the VBA Editor that when a particular
    macro executes, for example, you can create a dialog box that when a workbook
    opens by first creating the dialog box and then creating a macro called Workbook_Open.
    See Chapter 9 for information on creating a macro that executes when a workbook
    opens.

    As you use form controls, you assign VBA controls to the Visual Basic Editor Toolbox.
    After assigning the appropriate graphic image for the control, you need to create
    the VBA code that corresponds to the control. For example, if you add a list to
    a custom dialog box, you must specify the list to display in the list box by a
    VBA procedure.


    194'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# # THE FORMS TOOLBAR


    The Forms toolbar contains the controls that you can add to a worksheet to display
    specific data values, perform certain actions, or capture user input. You can
    attach a macro to a form that executes or


    the user clicks the control. See the section "Add a Form Control to a Worksheet"
    for more information on using controls on a worksheet.


    # LABEL


    Provides information about an associated control or worksheet.


    # BUTTON


    Runs the associated macro when clicked.


    # OPTION BUTTON


    Selects one of a group of options.


    # GROUP BOX


    Places related controls together visually on a worksheet.


    # CHECK BOX


    Selects or deselects an option.


    # LIST BOX


    Displays a list of items for selection.


    ![](img/b1f17ae2919b92b22fb561904c497d03_208_0.png)


    # SCROLL BAR


    Increases or decreases a value when you click the arrow


    # CONTROL PROPERTIES


    Displays the Format Control dialog box.


    # COMBO BOX


    A menu that displays a list of items. The selected item appears in the text box.


    # SPINNER


    Scrolls up and down through a list of values.


    # EDIT CODE


    Displays the VBA Editor in which you can create or modify a macro for the control.


    # TOGGLE GRID


    Indicates whether the worksheet grid appears outlining the individual cells.'
