  md: '# EXCEL DATA ANALYSIS


    # CHANGE THE LAYOUT OF A PIVOTCHART


    You can visualize data in a different fashion by altering the layout of a PivotChart.
    If you want to change the layout of a PivotChart, you can quickly drag the fields
    to different locations. For example, you can move fields in the Category area
    to the Series area or add additional fields to the Category area. Keep in mind
    that when you change the Category fields, the number of data points on the chart
    changes accordingly. The Category fields also determine the labels that appear
    on the Category Axis, which is horizontal or vertical.


    You can also move any fields on the PivotTable report from one area to another.
    When you move a field, the filter selections remain the same for the filter. For
    example, if you are only viewing values for the months of January and February
    and you move the field to the Series area, those months remain the same. See the
    section "Filter area on the PivotChart" for more information.


    When you add fields to a PivotChart, Excel identifies the location for the field
    as you drag it. For example, if you drag the field to the Category areas and in
    front of the current fields, Excel inserts the new field to the left of the line.
    The field listed on the left of the line becomes the main category.


    You can add fields using the PivotTable Field List, which shows all the fields
    that were selected when you created the PivotChart. The list displays the currently
    used fields in bold. If you add a field to the Categories area, Excel creates
    a subtitle for the field.


    ![](img/b1f17ae2919b92b22fb561904c497d03_159_0.png)


    # ADD FIELDS


    +   Click the desired field in the PivotTable Field List.


    +   You can also click the Show List button to display the PivotTable Field List.


    +   Drag the field to the desired area and release the mouse button.


    +   A broken line indicates the area that will receive the new field.


    +   The selected field appears in the corresponding area of the PivotChart.


    146'
  merge: -1
