  md: '# EXCEL DATA ANALYSIS

    RETRIEVE A VALUE FROM

    A PIVOTTABLE


    You can add PivotTable values to other worksheets containing data analysis by
    creating a separate formula to retrieve them from PivotTable. If you want to retrieve
    a value from PivotTable worksheet using the GETPIVOTDATA function, you use this
    function, instead of a simple reference, to dynamically display the values of
    a PivotTable based on the values in the PivotTable. For example, if the entire
    PivotTable report contains the total sales for January. But, if you filter the
    report to only show sales from California and Texas, that you may want and the
    corresponding Column area and value for more information on filtering.


    To use the GETPIVOTDATA function, you must provide descriptive information about
    the PivotTable value you want to retrieve, the name of the Data area field and
    Row area items. For example, if you wanted the hardware sales from Texas you


    need to specify that information as arguments for the GETPIVOTDATA function.


    The GETPIVOTDATA function has two required arguments and up to 28 pairs of optional
    arguments. The Data_field argument expects the Data area field for the value you
    want to retrieve enclosed in quotes. For example, if you want to retrieve a Sales
    amount, and the Data field is Sales in the worksheet.


    The next argument is Pivot_table, which requires a reference to the PivotTable.
    Remember, if the PivotTable is in a different worksheet, the reference must include
    the worksheet name.


    The remaining arguments identify the value you want to retrieve. You must define
    the function and item. For example, to retrieve sales total from January, select
    a Field value of "Month" and an item of "January".


    # RETRIEVE A VALUE FROM A PIVOTTABLE REPORT


    ![](img/b1f17ae2919b92b22fb561904c497d03_153_0.png)


    +   Select the formula cell.


    +   Click Insert > Function.


    +   The Insert Function dialog box displays.


    +   See Chapter 4 for more information on inserting functions.


    +   Select the GETPIVOTDATA function.


    +   Click OK.


