  md: '# APPENDIX


    # FORMULA BASICS IN EXCEL


    Formulas are the building blocks of data analysis in Excel. They enable you to
    automatically calculate and compare values within different cells so you can interpret
    them. This section serves as a reference for users not familiar with Excel.


    combination of functions, cell references, named ranges, constants, and operators
    to create the formula statement. The only real limitation is that you cannot make
    your formula longer than 1,024 characters in length. If Excel cannot properly
    evaluate your formula, an error message displays.


    Formulas contain two basic elements: an equal sign, and an operator, which tells
    Excel what to do. You can use any


    # EXCEL OPERATORS


    Operators combine or compare the values that you want to analyze. Excel provides
    a large variety of different operators for creating formulas, most of which are
    arithmetic operators. Excel also provides comparison operators, a text operator,
    and reference operators.


    # Arithmetic Operators


    You use arithmetic operators to perform numeric calculations, such as addition
    or subtraction. Obviously, using them on text results in an error message. Excel
    provides addition (+), subtraction (-), multiplication (*), division (/), exponentiation
    (^). Placing the subtraction operator in front of a number makes it negative.


    # Comparison Operators


    You use comparison operators between two expressions to define if they are equal
    (=), greater than (>), greater or equal to (>=), less than (<), less than equal
    to (<=), or not equal to (<>) each other. When you use comparison operators in
    a formula, Excel returns a logical value of True or False.


    # Text Operator


    You can use the text operator to join or concatenate two or more strings of text
    to form one string. You can concatenate strings using the Ampersand (&). Excel
    merges the two strings together without adding any spacing. If you want spaces
    between the strings, you must insert them between. For example, if you want to
    leave a space between the two strings, where APPLE is in cell A1, SAUCE is in
    cell A2, you type:


    When you use the text operator to combine values in cells, the result remains
    a text. This is true even if the values are numeric. For example, if you combine
    14 and 22 with the text, Excel creates the value 1492. Although it is a number,
    Excel treats it as a text string because if you attempt to use that value in a
    mathematical calculation, Excel returns the value and treats it as zero, because
    it is. In some instances, Excel may return an error message.


    Example:


    ```

    =A1&" "&A2"

    ```


    For example, if you use a concatenated string as the denominator of a division
    formula, Excel returns a #DIV/0 error. This indicates that you divided by zero
    Excel interprets a text string as zero.


    270'
  merge: -1
