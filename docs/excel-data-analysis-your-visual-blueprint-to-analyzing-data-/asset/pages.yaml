  md: '# EXCEL DATA ANALYSIS


    # ASSIGN A MACRO TO A MENU


    If you frequently use specific macros to analyze your worksheet data, you may
    want to assign the macros to an Excel menu to make them easier to activate. You
    can assign a macro to any existing Excel menu. If you do not want to use menus,
    you can create a new menu. By assigning a macro to a menu, you make the macro
    accessible as any menu option. Assigning macros eliminates the need to remember
    the shortcut key for each macro.


    When you add a macro to a menu, it remains on the menu for all workbooks you open
    in Excel. For that matter, you should assign the macro to a menu for easy access
    from your Personal Workbook. The Personal Workbook stores commonly used macros
    for the current user and as a hidden file that time you run Excel. Because the
    Personal


    Workbook is always open, any workbook can use all its macros.


    To keep your macros easy to find, you may want to place them all on one custom
    menu. For example, you can place all of your data analysis macros on a menu named
    Data Analysis. You can create a new Excel menu using the Customize dialog box.
    Of course, whatever you decide to use as home for your macro must exist in the
    Excel window before you add the macro option to.


    You add options to menus by dragging them onto the Customize dialog box. In fact,
    you can modify menus only when the Customize dialog box is open. You can remove
    options in a similar fashion by dragging them from the menu back to the Customize
    dialog.


    # ASSIGN A MACRO TO A MENU


    ![](img/b1f17ae2919b92b22fb561904c497d03_201_0.png)


