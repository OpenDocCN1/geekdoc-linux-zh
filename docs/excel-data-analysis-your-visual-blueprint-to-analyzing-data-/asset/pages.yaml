  md: '# EXCEL DATA ANALYSIS


    # NAME A RANGE


    If you need to reference a range of cells in multiple locations, it can become
    tedious to remember the cell locations. You can create range names to easily locate
    information, without having to remember the cells, and for use them in any formula.
    For example, if you create a range name in Sheet1 Sales, in Sheet2 you can create
    a formula that sums the range by typing the following:


    ```

    =SUM(Sales_Amounts)

    ```


    Using the range name enables the need to specify a worksheet or cell reference.
    This example shows how to access a range from any worksheet you can access a referenced
    name of cells from another workbook. For example, =SUM(Sales2002!) references
    a named range in the workbook Sales2002.xlsx. See Chapter 4 for more information
    on creating formulas.


    You create the range name in the Define Name box. Your range names can consist
    of up to 255 characters, but you only see about the first 16 characters of the
    name in Name box. Therefore, you may want to use names that you can easily distinguish
    when viewing the first few characters.


    Excel allows only to use a range name in one workbook; therefore, if you have
    a duplicate name in another worksheet, you must use a different name. If you create
    a range name that already exists, Excel replaces the previously specified range
    with the new range. To avoid potential errors verify that you have a unique name
    before using.


    If you duplicate a worksheet with a named range, Excel only recognizes the name
    in the original worksheet for other worksheets in the workbook. You can only access
    the copied range on the copied worksheet.


    ![](img/b1f17ae2919b92b22fb561904c497d03_21_0.png)


    +   Select the range of cells that you want to.


    > Note: See the section "Select a Range of Cells" for more information on selecting
    a range.


    +   Click Insert -> Name -> Define.


    8'
