  md: '# GETTING STARTED WITH EXCEL


    # SELECT A RANGE OF CELLS


    You can make modifications to several cells in a worksheet simultaneously, a process
    referred to as selecting a range, by choosing all cells together before implementing
    the changes. You select a range of cells to apply different formatting options,
    to cells, or to change the Excel value. The range of cells does not need to be
    contiguous; you can select cells in different locations. See the section "Copy
    and Paste of Cells" for information on copying a range of cells. See the section
    "Create a Custom Format" for more information on formatting cells.


    To select an entire row or column, you click the corresponding identifier. For
    example, to select all cells in column C, you click the identifier for column
    C. To select multiple columns, click the first column and continue holding down
    the mouse button as you drag to the other columns. To select rows, you click the
    identifiers on the left side of each.


    You can select anywhere from a single cell to the entire worksheet. Excel highlights
    the cells to remind you of your selection. If you select multiple ranges of cells
    simultaneously, Excel highlights each selected.


    To select a smaller range of cells, select the first block of cells, and then
    press the Ctrl key and select the next block. If you do not hold the Ctrl key,
    Excel unselects the first range when you select a new range of cells.


    # Extra


