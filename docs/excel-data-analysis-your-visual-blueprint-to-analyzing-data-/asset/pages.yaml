  md: '# AUTOMATING ACTIONS WITH MACROS


    # UNDERSTANDING VBA (CONTINUED)


    # Boolean


    You use a Boolean data type to store a logical value of True or False. A Boolean
    data type takes up two bytes of storage. The keywords True and False


    are predefined as Boolean values in VBA. To assign them to a variable, you simply
    specify the value BValue = True.


    # Date


    You can use the Date type to store dates and times that you can use them in calculations.
    VBA accepts a date range from 1, 1900 to December 31, 9999. The date range within
    Excel is much smaller — January 1, 1900 to December 31, 9999. If you place a date
    value in an Excel worksheet that is out of range. Because dates are numeric, Excel
    produces an error message.


    You can use a String type to store a sequence of characters. A string can contain
    any combination of letters, numbers, punctuation marks, and spaces. In order for
    VBA to recognize the start and stop of your string, you must enclose it in quotes
    — for example:


    The Date data type is a Byte value that is stored as a decimal number. Because
    calculations can use you for strings:


    Example:


    ```

    SampleString = "This is a sample"

    ```


    When you specify dates and times in VBA, enclose them in pound instead of the
    quotation marks that you use for strings:


    You can declare strings using one of different types: variable length and fixed
    length. As the state name, you declare fixed-length strings and variable-length
    strings with a maximum number of characters and variable-length strings as many
    as 2 billion characters.


    Example:


    ```

    Const StartAs Date = #6/12/2001#

    ```


    To declare a fixed-length string, you need to specify the string length part of
    the definition. When you declare a string, length is always size, even if you
    assign a smaller size to it. For example, you declare a string of 25 characters
    as:


    # Object


    You use the Object type to define a variable as one of the objects that are part
    of the Excel Object Model. These types are four bytes in size.


    Example:


    ```

    Dim FixedString As String * 25

    ```


    Excel provides an abundance of objects, including Workbook, Window, Chart, PivotTable.
    Each of the objects provided by the Excel Object can be assigned as a data type
    — for example:


    On the other hand, variable-length strings have no length:


    Example:


    ```

    Dim chrrt As Chart

    ```


    ```

    Dim sheet1 as Worksheet

    ```


    Example:


    ```

    Dim VarString As String

    ```'
