- img_proc: true
  md: '# AUTOMATING ACTIONS WITH MACROS


    # UNDERSTANDING VBA (CONTINUED)


    # Constants


    Constants, as the name implies, represent specific values that do not change within
    your code. You define using the Const keyword. If you do not specify the data
    type for the constant, Excel treats the constant as a variant.


    Using constants ensures you have only one place in the code to modify if the value
    changes. For example, suppose you have the following declaration:


    > Example:

    Const SalesTax As String = ".075"


    If your rate states the tax, you simply have to modify the value — .075 in the
    example — and not calculation. Using constants eliminate potential errors that
    could arise from mistyping a value.


    # Operators


    VBA provides several different operators that you can use in your code. You can
    group these operators into four general categories: arithmetic, concatenation,


    comparison, and logical. You should find most of these operators quite familiar.


    # Arithmetic Operators


    VBA accepts several different arithmetic operators. When a statement, a single
    VBA expression or, contains multiple arithmetic operators, VBA uses precedence
    order to determine how to evaluate the statement. For example, VBA calculates
    exponents first. The only exception to the precedence order is parentheses; when
    separate portions of a statement, VBA evaluates the order within the parentheses
    first, still using the order


    in the parentheses and for the rest of the statement. In the following statement,
    Val2 is added to Val3, and the sum is multiplied by Val:


    > Example:

    Value = Val * (Val2 + Val3)


    The following table lists arithmetic operators in their precedence order:


    | OPERATOR | PRECEDENCE | PURPOSE |

    | --- | --- | --- |

    | ^ | (before a number) | 2 | Raises the number to the power of the exponent —
    for example, 2^3 = 8. |

    | * | 3 | Negates a negative value. |

    | / | 3 | Multiplies two numerical values. |

    | \ | 3 | Divides two numerical values and returns the result, including any decimal
    places — for example, 5 / 2 = 2.5, |

    | \ | 3 | Divides two numerical values and returns the integer portion of the
    result — for example, 5 \ 2 = 2. |

    | Mod | 4 | Divides two numerical values and returns the remainder — for |

    | + | 5 | Adds two numerical expressions. |

    | (minus sign) | 5 | Finds the difference between two numerical expressions by
    subtracting the second expression from the first. |'
