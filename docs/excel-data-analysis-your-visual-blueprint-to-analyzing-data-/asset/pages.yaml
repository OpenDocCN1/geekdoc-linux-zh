  md: '# EXCEL DATA ANALYSIS

    CREATE A PIVOTABLE REPORT FROM

    AN EXCEL LIST (CONTINUED)


    You build your PivotTable report by dragging the appropriate column names and
    fields to a diagram until you have your desired layout. The column names and fields
    appear as buttons, which you can use in any combination. If you do not include
    a field button on the layout the corresponding data values do not depend on the
    PivotTable.


    Any buttons you drag to the Row area of the PivotTable as separate rows. Any buttons
    in the Column area become columns. When you drag a field to the Data area, the
    wizard will assign Sum function if the values are numeric. If the values correspond
    to the field button are not numeric, the wizard automatically assigns Count. If
    you want to summarize the data differently, you can select a different Excel function.
    See the "Change Calculation of a Data Field" for information on applying a different
    summarization function.


    You can place multiple field buttons on the same section of the diagram. For example,
    if you place the Month field in the Row followed by the Sales Person field, Excel
    displays the month broken down into Sales Person sub-categories. You can also
    specify a value that data records must contain by dragging a field button to the
    Page section. For example, if the Page area contains the field button, only the
    selected items appear in the PivotTable. See the PivotTable Basics for more on
    the elements of a PivotTable.


    After you create the PivotTable, you can quickly change the layout by dragging
    fields from one section of the PivotTable report to another. See the "Change the
    Layout of a PivotTable" for more information.


