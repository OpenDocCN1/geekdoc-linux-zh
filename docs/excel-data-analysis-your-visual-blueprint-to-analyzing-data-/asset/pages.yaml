  md: '# AUTOMATING ACTIONS WITH MACROS


    # Extra


    There are essentially two different types of functions: private and public. All
    modules in the workbook can access a public function. However, only other procedures
    within the same module can access a private function. You mark a function by placing
    Private before the Function statement as in the example Private SampleFunc(Param).
    Excel considers any functions that do not have the Private keyword to public.
    Therefore, using the Public keyword is unnecessary because a function with no
    keyword is the same as one with the Private keyword.


    Other functions and subroutines within the same module typically return a value;
    Because they are typically classified as part of an expression, you can assign
    the value returned by a function to a variable: SampleFunc(Param). The line of
    code exists in a subroutine that calls the function. When Excel encounters this
    code, the function executes using the value of the Parameter, and the result is
    placed in the FunctionValue variable.


