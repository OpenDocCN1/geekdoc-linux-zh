  md: '# EXCEL DATA ANALYSIS

    CREATE A MACRO USING THE VISUAL BASIC EDITOR


    To create a macro in the Visual Basic Editor, you need to create a subroutine.
    You can easily create a subroutine in the Visual Basic Editor that executes a
    series of VBA commands. Each macro that runs is just a subroutine that contains
    blocks of VBA code. A single subroutine can call other subroutines and functions,
    so you can create a macro that is much more complex than a simple subroutine.


    VBA provides two types of subroutines: public and private. When you create a macro
    with the Macro Recorder, the subroutine is public, meaning all procedures, including
    the Macro dialog box, can access and see it. Only other procedures can access
    a private subroutine. Excel hides all subroutines from the Macro dialog box, so
    you cannot activate them with combinations.


    subroutines as private if you do not want them accessible as macros. You can do
    so by placing Private before the Sub statement, such as Private Sub Sample().
    Typically, other subroutines within the same module call private subroutines.
    A subroutine is called using the Call statement—for example, Call Sample(). Excel
    macros do not have the Private keyword to be public; the use of the Public keyword
    is unnecessary because a subroutine with no keyword is the same as one with the
    Public.


    VBA allows a subroutine to be called without the Call statement. However, even
    though the Call statement is not required, you should always use it to remind
    you that another procedure is being called. Using the Call statement makes your
    code much more readable and another user can quickly look at the code and see
    that another subroutine is called.


    # CREATE A MACRO USING THE VISUAL BASIC EDITOR


    ![](img/b1f17ae2919b92b22fb561904c497d03_183_0.png)


    +   In the Project Explorer, click the project you want to add a new macro.


    Note: The project name of the workbook in you want to store the new macro.


    +   Click Insert Module.


    +   Opens a blank window after the name of the subroutine.


    +   Type Sub.


    +   Press Enter.


    +   Type the name of your subroutine.


    170'
