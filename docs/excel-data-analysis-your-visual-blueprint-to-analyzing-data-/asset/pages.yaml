    | 2 | Interest Rate | 5% |

    | 3 | Loan Term | 10 Years |

    | 4 | Monthly Payment | | |


    +   * Click Tools Scenarios.

    * The Scenario Manager dialog box opens

    * Click Add.


    +   * You can type comments about the scenario in the Comment box.


    +   * Type the scenario name.

    * Specify the cells to change.


    +   * Click OK.'
