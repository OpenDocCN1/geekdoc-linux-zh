  md: '# EXCEL DATA ANALYSIS


    # EDIT FORMULAS


    After creating a formula in a cell, the analyst can update it to accommodate new
    data. You can modify the cell references, change its arguments, or move the formula
    to an entirely new cell within the worksheet. For more working with functions
    and arguments in Excel, see Appendix D.


    You can change an argument of the formula in the Function Argument dialog box,
    which allows you to select new cell ranges for each argument. When you accept
    the changes, Excel updates the cell references via the Insert Function button.


    You can modify a formula and its arguments by editing it directly within the worksheet,
    or by the Function Arguments dialog box. To modify a formula, you select the cell
    containing the formula. Alternatively, you select the formula in the Formula bar
    on the toolbar. This places the cursor in the cell, and highlights the formula
    references. Each argument of the formula displays a different color in the formula,
    and the referenced cells are outlined in the same color, making it easy to identify
    each argument.


    When you move a formula to a new cell in your worksheet, Excel copies the cell
    references in the formula, whether absolute or relative, remain the same. For
    example, if you move the formula =SUM(A1:A5) to cell B6, the references remain
    unchanged. You can move a formula by dragging it to a new cell. For example, if
    the cell containing the formula was Bold Italics, the new cell also displays the
    result in Bold Italics 10pt.


