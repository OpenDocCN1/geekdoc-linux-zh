  md: '# EXCEL DATA ANALYSIS


    # # ADD ANOTHER DATA AREA CALCULATION


    If you want to show multiple calculations in the Data area, you can go by adding
    additional fields. Perhaps you want to analyze the sales figures by showing the
    amount of the sales and the percentage of sales each sale representative. You
    can either add a different field to the Data area, or add another copy of the
    same field and add a different summary calculation.


    Each field in the Data area uses some type of calculation to display the results.
    The default summary calculation is the Sum function. You can change the summary
    function to any of the functions available on the PivotTable dialog box. You can
    also create custom summary calculations. You can change the "Calculation of a
    Data Field" for more information on creating a custom calculation.


    Excel automatically names each Data field based on the calculation that it uses.
    For example, if your Data area field is Amount; the first instance of it is Sum
    of Amount; if you add another copy of the same field Excel names the second field
    as Amount2; because it provides the description necessary to interpret the PivotTable
    results. Therefore, you should adjust the field names on the PivotTable dialog
    box to reflect your in analysis.


    You can change the summarization for each data field. For example, you can have
    the first item sum the amounts and the second item the percentage in relation
    to the other sums in the column. See the section "Change Calculation of a Data
    Field" for more information.


    # ADD ANOTHER DATA AREA CALCULATION


    ![](img/b1f17ae2919b92b22fb561904c497d03_147_0.png)


    ![](img/b1f17ae2919b92b22fb561904c497d03_147_1.png)


    +   * **1** In the Pivot Table List, select the field to add.


    +   * **2** Drag the selection to the Data area of the Pivot Report and release
    the mouse button.


    +   * **3** Click the new Data field and click Field Settings from the options
    to display.


    * You can click the Show Field List button to display the Pivot Table List.


