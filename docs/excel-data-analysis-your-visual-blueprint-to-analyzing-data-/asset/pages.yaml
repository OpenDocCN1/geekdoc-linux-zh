  md: '# EXCEL DATA ANALYSIS


    # DISPLAY A MESSAGE BOX


    You can use the MsgBox function to pop-up message boxes when a VBA procedure executes.
    The MsgBox function does two things: it displays a dialog box to provide information
    to the user and returns a value that indicates the response from the user. You
    can capture the user response using the MsgBox function to a variable.

    UserResponse = MsgBox("Do you want to cancel?", vbYesNo, "Cancel")


    The MsgBox function returns a value. If the user selects the OK button, the MsgBox
    function returns a constant of vbOK or 1.


    The MsgBox function has different arguments: Prompt, Buttons, Title, Helper, and
    Context. All but the first argument are optional. The Prompt argument indicates
    the value that displays in the message box. You can make a message string and
    enter


    in quotes or a variable. You can combine values by using the concatenation operator
    (&), as in the example MsgBox("Total Sum: " & TotalSum).


    The optional Buttons argument enables you to specify a constant value, which displays
    the buttons and icons on the message box. If you do not specify a constant, the
    MsgBox function uses the default vbOKOnly, which displays the OK button.


    The Title argument contains the text that displays on the title bar of the message
    box. If you omit it, Excel displays a default value of Microsoft Excel.


    The optional arguments let you add help text to the message box. Helper specifies
    the name of the help file, and Context specifies the context of the help topic
    to display.


    ![](img/b1f17ae2919b92b22fb561904c497d03_197_0.png)


    ![](img/b1f17ae2919b92b22fb561904c497d03_197_1.png)


    +   - Create a new subroutine.


    +   - Dim MsgVar As Integer, declaring MsgVar with the variable to receive the
    MsgBox return value.


    +   - Declare other variables needed for the subroutine.


    Note: See "Create a Macro using the Visual Basic Editor" for more subroutines
    and "Declare a Variable" for more variables.


    +   - Type MsgVar = MsgBox("Text Prompt", buttons, "Text Title")


    +   - You can + to separate multiple constant values.'
