- img_proc: true
  md: '# THE VISUAL BASIC EDITOR TOOLBOX (CONTINUED)


    The Visual Basic Editor Toolbox appears only when you select a UserForm in the
    Visual Basic Editor. The Toolbox contains all the controls that you can add to
    your custom UserForm. See the section "Create a Custom Dialog Box" for more information
    about adding controls.


    # Arrow


    Use this control to select objects in order to size or move them on a UserForm.


    # Label


    For adding text to a UserForm. The user cannot alter text labels on a UserForm;
    you add labels for informational purposes.


    # TextBox


    Enables the user to input text.


    # ComboBox


    Enables a user to either click an item from the list or type an appropriate value
    in the box.


    # ListBox


    Enables you to present a list of items from which a user can select an item.


    # CheckBox


    Enables the user to select or deselect options. Typically, a CheckBox control
    returns a value of True if it is selected and False if it is not selected.


    # Frame


    Enables you to group controls. For display purposes only.


    # OptionButton


    Enables the user to select a list of items. Two or more OptionButton controls
    in a group so that when you select one, the other controls are deselected.


    # CommandButton


    The user clicks to perform a specific option. When you create a CommandButton
    control, you specify the text that appears on the button as part of the control
    properties.


    # ToggleButton


    Enables you to create a button that either pressed or unpressed. The preset state
    returns a value of True and the unpressed state returns a result of False.


    # TabStrip


    Enables you to create a multipage, tabbed area for a section of your UserForm.
    You can place tab strips on each page of the UserForm.


    # MultiPage


    You use these dialog boxes, let the user switch between pages of options in the
    dialog box. By default, the MultiPage contains only two pages to your UserForm.
    You can add pages by right-clicking one of the Page tabs and selecting the New
    Page.


    # ScrollBar


    Enables the user to scroll through information not originally on the screen or
    to indicate a position on a scale, such as a rating.


    # SpinButton


    Enables the user to specify a value by clicking one of the arrow buttons to increment
    or decrement the value. Use either a TextBox control or a Label control to display
    the current value of the SpinButton.


    # Image


    Use the Image control to add a graphic to the Userform, so you distribute the
    worksheet, the graphic is included. You can assign any graphic of the following
    file formats: .bmp, .cur, .gif, .jpg, .png.


    # RefEdit


    Consisting of a text field and a button, this enables the user to select a range
    of cells from a worksheet. When the user clicks a button, the dialog box minimizes
    so the user can drag the cursor across the worksheet to select the desired range
    of cells.'
  merge: -1
