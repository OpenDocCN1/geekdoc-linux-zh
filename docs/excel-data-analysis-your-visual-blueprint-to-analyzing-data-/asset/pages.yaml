  md: '# EXCEL DATA ANALYSIS


    # CREATE A CONDITIONAL FORMULA


    If you only want Excel to perform a calculation when a cell contains a specific
    value, a conditional formula returns a value if the condition is True, and a different
    value if the condition is False. For example, an analyst may ask Excel to calculate
    the net sales on an item after a number sold, or the Shipping department may create
    a formula for a different shipping cost upon the purchase of items.


    combination of cell references, operators, or even other functions to determine
    the arguments. For example, you can use the SUM function to determine the total
    of a series of cells that is greater than 50 by typing SUM(A1:A50).


    For the value_true argument, you specify the value that the formula returns if
    the logical_test is True. You can also define an the value_false argument if you
    want the formula to return a value when the logical_test argument is False. With
    both these arguments, if you want to return text, you must place the string in
    quotation marks. The following formulas place the value True in the formula cell
    A1 is greater than 100, and False if the value of A1 is less than or equal to
    100.


    You create a conditional formula using the IF function. There are different arguments
    for the IF function, but only the first two are:


    ```

    =IF(logical_test, value_if_true,

    value_if_false)

    ```


    For the logical_test argument, you must specify an argument that returns a logical
    value of True or False. For example, you can see if a cell value is greater than
    125 by typing A1>125. You can use any


    ```

    =IF(A1>100, "TRUE", "FALSE")

    ```


    Excel also has a way to build conditional formulas with the convenience of a Wizard.
    For the Conditional Wizard, see Chapter 11.


