    and the second to use any combination of the four types, but you can specify their
    order with semicolons:


    You create custom number formats using any combination of the format codes with
    0 and # being the most useful numeric codes. Use 0 to define decimal placement.
    Excel displays the value 670.45 as 670-45. The # tells Excel not to display significant
    positive numbers in red and. You can use colors in square brackets to define color
    formatting. For example, for red, negative values, you type [Red] before the format.


    Positive Number;Negative Number;Zero Value;Text Format


    Excel applies one specified format for all conditions. If you specify two different
    formats, Excel applies the first one to both positive and zero values, and the
    second to negative values. The following example formats numbers with two decimal
    places and a dollar sign, negative numbers in red and zero values as 0, and in
    cyan:


    You place characters, as parentheses, within your format. The following custom
    format displays positive numbers with a dollar sign, negative numbers in red and
