  md: '# GETTING STARTED WITH EXCEL


    # Extra


    When you have several different named ranges in a workbook, you may find it difficult
    to keep track of them all. Excel provides a feature that quickly creates a list
    of all names and the corresponding cell ranges. To create the list of ranges,
    click Insert > Name > Paste: In the Paste Name dialog, click the List button.
    Excel creates a list with the first column containing the names, and the second
    column identifying the corresponding cell ranges. For example, if B2 through B10
    contain your expenses, Excel passes values similar to the following:


    ```

    =Sheet1!B2:$B10

    ```


    Advertising

    The range reference simply identifies the cells within the named range. Excel
    first lists the name of the worksheet containing the range and then the cells
    within the range. Appendix D for more information on cell references.


    Excel places the list in your active worksheet containing your cursor. Therefore,
