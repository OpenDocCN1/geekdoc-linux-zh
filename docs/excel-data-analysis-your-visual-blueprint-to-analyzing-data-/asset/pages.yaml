    | % Of | Determines the percentage of the current PivotTable to the selected base.
    |

    | % Difference From | Determines the difference between cell values. |

    | Running Total in | Shows the running total in each cell. |

    | % row | Finds the percentage of the cell value to the total row. |

    | % column | Finds the percentage of the cell value to the total column. |

    | % Total | Finds the percentage of the cell value to the grand total value. |

    | Index | Finds an index value of the cell value |


