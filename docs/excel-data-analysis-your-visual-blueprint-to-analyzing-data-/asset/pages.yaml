    returns to determine which month had the highest sales over $400,000. To do this
    most effectively, you can combine the MATCH function with the INDEX function.
    The following formula has the Row_num argument representing the INDEX function.
    "Return a Value at a Specific Location in a Data List" for more information on
    the INDEX function.


    To find the location of specific text within a worksheet or column, you can use
    the wildcard characters as an asterisk, *, or a question mark, ?, to match a single
    character. With these characters, you must specify a value of 0 for the match_type
    argument.


    TYPE THIS:


    ```

    =INDEX(A1:C49,MATCH(400000,C1:C49,1), 1)

    ```


    TYPE THIS:


