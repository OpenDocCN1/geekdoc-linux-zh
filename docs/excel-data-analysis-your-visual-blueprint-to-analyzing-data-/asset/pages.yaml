  md: '# CELL REFERENCES


    # FORMULA BASICS IN EXCEL


    Excel uses a unique reference or address to identify every cell in a

    heet. This identification process, called the cell reference, allows you

    to specify the cell or ranges of cells you want to use in a formula.


    # Default Style


    By default, Excel identifies all columns with letters and

    all with rows, giving each cell a unique

    address. The cell reference refers from the column and

    row that intersects the cell. For example, the top left

    of a worksheet is A1 because Column A and Row 1

    intersect in that cell.


    # R1C1 Reference Style


    Excel provides another cell reference style, called

    R1C1. With this style, Excel identifies the cell with a C, for

    columns, followed by the column number, and an R for

    rows, followed by the row number. The top left cell is R1C1,

    t second row in the first column is R2C1, and if you

    prefer this format, although this format is available, the

    examples in the book use the default cell reference style.


    # Absolute or Relative?


    When you use a cell in a formula, you can either

    u a relative or absolute cell reference. With an

    abolute reference, no matters where you copy and

    paste the formula, it refers to the original

    You make a reference absolute by placing a $

    before the column and row references. For

    example, if you use the formula =$A1:$A5 in

    cell6 to B6, the formula in B6 still returns the

    cell of A1 through A5.


    formula cell. If you copy the formula =SUM(A1:A5)

    cell6 to B6, Excel passes the formula

    =SUM(B1:B5).


    When you create a formula, you can use a

    combination of absolute and relative references. For

    example, you can make a cell reference absolute

    while the reference is relative, or vice versa. For

    example the reference $A2 has a relative reference

    an another row reference. If you use

    col column reference

    changes relative to the new cell, but the column reference

    changes relative to the new cell, but the row reference


    If you want to copy a formula and have the

    cell reference depending on where you paste the

    formula, use a relative cell reference. The formula keeps

    track of the cell''s location in the


    # FORMULA ERRORS


    If you attempt to do that Excel cannot properly

    evaluate, an error message displays in the formula cell.

    For example, if you attempt to add two cells


    contain text, the #VALUE! error message displays in

    formula cell. The following table shows the formula

    error messages.


    | ERROR | DESCRIPTION |

    | --- | --- |

    | #### | Either the column is not wide enough to

    display the result, or an argument contains a

    negative time or value. |

    | #VALUE! | An argument contains the wrong type of value; for

    example, an attempt to add containing text. |

    | #DIV/0 | Excel attempted to divide a number by

    nunction or range. This typically occurs when

    mispell a function name. |

    | #N/A | A specified cell reference is not available to the

    cell. |

    | #REF! | A cell reference is not valid. |

    | #NUM! | Formula contains invalid values. This

    curs when a number is specified with

    another character, such as a dollar sign, the

    value for a formula that requires a number. |

    | #NULL! | The cells do not intersect. |


