  md: "# Apply it\n\nInstead of creating validation code that runs on control events,\
    \ you can use the UserForm event to launch code, such as capturing the QueryClose\
    \ event for the UserForm. The following code ensures that a value was selected\
    \ for a ListBox control prior to closing the dialog box.\n\nExample\n\n```\nPrivate\
    \ Sub UserForm_QueryClose(Cancel As Integer, CloseMode As Integer)\nIf Not IsNumeric(Text1.Value)\
    \ Then\n    MsgBox \"Must be a number\"\n    Cancel = 1\nEnd If\n```\n\nThe QueryClose\
    \ event has two arguments, Cancel and CloseMode. The Cancel argument accepts an\
    \ integer value. If the value of the argument is anything other than zero, the\
    \ QueryClose event stops, and the associated dialog remains open. The CloseMode\
    \ argument contains a value indicating the cause of the QueryClose event. You\
    \ can change the value of this argument by typing the value 0-associated with\
    \ the constant or using one of the four constants. Use vbFormControlMenu to specify\
    \ the user selected the Close button on the dialog box; vbFormCode to indicate\
    \ the code initiated by Unload statement; vbAppWindows to denote the Windows operating\
    \ system is ending, and the Task Manager is closing Excel.\n\n![](img/b1f17ae2919b92b22fb561904c497d03_226_0.png)\n\
    \n+   The control and property value to check.\n\n+   MsgBox follows and follow\
    \ it with the text for the MsgBox.\n\n+   Exit Sub.\n\n+   End If.\n\n+   Switch\
    \ to Excel and run the macro.\nThe message box appears if a value is not selected\
    \ for the control."
