  md: '# CREATE SCENARIOS


    One major benefit of analyzing data is forecasting future events with today''s
    information. By asking "what-if" and constructing scenarios with your data and
    the Scenario Manager, you can direct your current activities to long-term company
    goals. For example, you can create several scenarios to determine the cost of
    a business loan at various interest rates. Comparing viewing scenarios, you can
    financially feasible. You can quickly see how an increase or decrease in interest
    rate can impact your budget. You can construct scenarios involving multiple values;
    for example you may change the interest rate, also the loan amount with each scenario.


    Constructing scenarios will change your worksheet''s data. For that reason, you
    may create one scenario that contains your original data, or copy your worksheet
    before applying the scenario.


    You create each scenario in the Add Scenario dialog box. First, you specify the
    cells in you want to see predicted changes. See Chapter 1 for information on separating
    each cell reference with a comma, for example: A3-D4. Next, you assign new values
    to each cell in the Scenario dialog box. Excel uses the name you provide when
    you select the scenario. For example, if you specify a value of 45 for A3, Excel
    will change the cell value of A3 every time you select the scenario.


    From your input, Excel generates a scenario. You can apply a specific scenario
    at time and change the values of the worksheet by simply selecting it from Scenario
    dialog box. When you select a different scenario, Excel changes the values of
    the cells as specified in the scenario.


    # CREATE SCENARIOS


    ![](img/b1f17ae2919b92b22fb561904c497d03_67_0.png)


    | | Name | Value |

    |---|---|---||

    | 1 | Automobile Loan | $120,000 |

    | 2 | Interest Rate | 7.5% |

    | 3 | Loan Term | 15 Years |

