  md: '# EXCEL DATA ANALYSIS


    # EXECUTE A TASK SPECIFIC NUMBER OF TIMES


    It is quite common to perform the same data analysis tasks repeatedly within the
    worksheet. For example, you may summarize each data values. Instead of manually
    rerunning a macro, you can set up a macro to repeat the tasks a specific number
    of times. You can use the For Next to execute a statement a certain number of
    times in your macro. By using the For Next loop enables you to add tasks in a
    specific number of cells.


    executes until the counter reaches the specified maximum value then controls us
    to the next statement outside the loop.


    When the For Next loop starts, it checks that the value of the counter variable
    is not the maximum value. The counter variable is a numeric value that is incremented
    by 1 each time the loop executes. If the variable is less than the maximum, the
    loop executes. If the value is greater than the maximum value, the body of the
    loop never executes.


    The For Next loop consists of four parts. The For statement initiates the loop.
    You specify a counter variable with an initial and maximum value, such as A =
    1 To 5. The inside of the body consists of tasks or statements that execute until
    the maximum value of the loop meets. Finally, the Next statement completes the
    loop.


    VBA provides other statements that you can use to control the flow of a macro,
    such as the Do While, which repeats the statements as long as a condition is true.
    See Appendix C for additional program flows.


    # EXECUTE A TASK SPECIFIC NUMBER OF TIMES


    ![](img/b1f17ae2919b92b22fb561904c497d03_195_0.png)


    ![](img/b1f17ae2919b92b22fb561904c497d03_195_1.png)


    +   1 Create a new subroutine for the macro.


    +   2 Declare the loop and any other variables needed for the subroutine.


    +   3 Type For N = 1 to Max, replacing N with the variable declared for the For
    Next loop and with the maximum value of the loop.


    Note: See the section "Create a Macro Using the Basic Editor" for more information.


    Note: See the section "Declare a Variable" for more information.


    182'
  merge: -1
