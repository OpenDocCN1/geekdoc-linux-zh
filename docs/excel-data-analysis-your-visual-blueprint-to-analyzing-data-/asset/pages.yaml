  md: '# EXCEL DATA ANALYSIS


    # AN INTRODUCTION TO MACROS (CONTINUED)


    UNDERSTANDING VBA (CONTINUED)


    # Variant


    The Variant data type is the default data type that VBA uses. A variant can contain
    any type of data, VBA treats all variables that do not assign a data as variant.
    But because of this processing required by VBA to determine the data type, it
    is a good idea to use variants only for values that you cannot type with the standard
    VBA data types.


    | DATA TYPE | BYTES |

    | --- | --- |

    | Decimal | 14 |

    | Variant | 16 | +-729,162,514,264,337,594,930,335 / -1.9776931348623E308 to -4.9065564548142747E-324
    (with numbers) for negative values / 4.9065564548142747E-324 to 1.7976931348623E308
    for positive values |

    | Variant | 22 + string length 0 to 2,000,000,000 (with characters) |


    # Arrays


    An array is a group of variables with the same name and data type. If you have
    an array, you can state the names in an array called States. You refer each value
    in an array as an element. You can access the elements of array using index numbers
    that correspond to their positions in the array.


    Using an array reduces the number of variables in your code you declare only one
    variable to manage all your data. Otherwise, storing 50 states requires declaring
    and managing 50 different variables.


    > Example:

    Dim States(50)

    States(43) = "Texas"


    An array with one list is called a one-dimensional array. With VBA, you can declare
    multidimensional arrays in which each element has a corresponding index.


    array. For the aforementioned States array, you can have a corresponding list
    of cities in each state. If a user selects Texas, a list of cities in Texas becomes:


    > Example:

    States(43,5) = "Dallas"


    VBA allows up to 60 dimensions in an array, but most developers rarely more than
    two or three dimensions.


    You can declare an array either as fixed-length, or you specify the number of
    elements, or as dynamic, with an unknown number of elements:


    > Example:

    Dim States()


    # User-Defined


    You can create user defined types to specify specific types of data. User defined
    types can store multiple values in one variable. Unlike arrays, which must contain
    the same values of the same data type, you can create user defined data types
    as a combination of standard VBA types.


    You specify a defined type with the Type and End statements followed by the name
    of the new


    data type definition. For this example, data type stores information about individual
    books:


    > Example:

    Type BookReview

    Title as String

    Pages as Byte

    ReviewDate as Date

    End Type


    160'
