    you can also add-ins that offer other capabilities. Among the add-ins that come
    with Excel, you should consider using:


    +   * The Excel ToolPak, which provides financial and scientific functions and
    options. For example, this add-in contains a set of functions for performing Engineering
    calculations, along with other financial, data and time, and mathematical functions.
    The Analysis ToolPak also contains the Statistical Analysis Tool described in
    this chapter.


