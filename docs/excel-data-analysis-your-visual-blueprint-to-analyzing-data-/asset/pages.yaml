    calculates under situations that you specify. For more information, see the section
    "Using the Conditional Sum Wizard."


    Excel recognizes any file with an .xlsa extension as an add-in, lists them in
    the Add-ins dialog box, and automatically loads the add-in files to one of the
    folders on your hard drive:


