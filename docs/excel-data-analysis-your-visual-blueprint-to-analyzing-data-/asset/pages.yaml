  md: '# WORKING WITH PIVOTABLE REPORTS


    # Apply it


    After adding a calculated item, you can have Excel automatically sort the PivotTable
    report so it displays in ascending or descending order based on items in a particular
    field. To do so, click PivotTable > Sort and Top 10 on the PivotTable toolbar
    to display the Sort Top 10 dialog. The default AutoSort option is manual, which
    means the report only sorts when you use the Data > Sort option. To sort automatically,
    click either the Ascending or Descending options △ and select the field to use
    for the sort. Click an option in the Using field and select what you want to sort.
    When you click OK, Excel sorts the PivotTable using the specified key field. To
    turn off the AutoSort, click the Manual option in the PivotTable Sort and Top
    10 dialog.


    If you have calculated items whose formulas rely on another calculated item, you
    can make sure that Excel calculates them in the right order by viewing how Excel
    solves the formulas. To do so, click PivotTable > Formulas > Sort Order. In the
    Calculated Item Order box, displays a formula and then click Move Up or Move Down
    to change the order.


