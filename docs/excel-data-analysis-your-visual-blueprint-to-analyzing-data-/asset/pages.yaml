  md: '# EXCEL DATA ANALYSIS

    SET MACRO SECURITY


    Whether you create your own macros for data analysis, or open workbooks created
    by others you may need to specify macro settings. Due to the increasing problem
    with computer viruses, specifically macros, default Excel disables all macros
    in workbooks except ones with digital signatures from trusted sources.


    +   Medium: This level of security enables you to specify whether you want to
    run macros from trusted and unsigned sources when you use Excel. Select this if
    you want to eliminate the hazard of signing macros that you create.


    +   Low: With this level, Excel automatically loads all workbooks without checking
    to see if they are from trusted sources. With this setting, the protection from
    malicious viruses is a serious concern.


    Digital signatures, which macro creators use to verify their macros'' safety,
    attaching a signature to a macro or file as long as no one modifies the macro
    or file. Macro modifications require you, as the creator, to recreate the signature.
    A macro with a valid digital signature confirms the macro''s origins and no one
    altered it.


    To eliminate the risk and expense of acquiring a digital certificate, you can
    personally sign your macros by running selfcert.exe, an Office XP program. Creating
    and attaching your personal signature indicates that you certify the security
    of a macro, distinguishes yours from other macros.


    There are three security settings you can select for macros:


    +   High: The default security level for Excel. This level disables all macros,
    even those you create. You have the option to select macros from others when you
    run Excel.


    # SET MACRO SECURITY


    ![](img/b1f17ae2919b92b22fb561904c497d03_187_0.png)


    # SET SECURITY


    +   1 Click Tools -> Macro Security.


    +   2 The Security dialog box opens.


    +   3 Click the desired security level.


    +   4 Click OK.


    +   Excel assigns a security level.


    174'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# AUTOMATING ACTIONS WITH MACROS


    # Extra


    Assigning a certificate you create with SelfCert.exe indicates that the project
    is self-signed and not authenticated. This option works for personal workbooks.
    If you plan to distribute your workbook to other users, you probably want to consider
    acquiring a true digital signature file. When you use a commercial digital signature
    file, the digital ID attaches to the macro and remains in with it; if the macro
    is altered in any way, the user is notified that the macro has been changed and
    should not be trusted. This ensures that a macro you create is not altered to
    harm another person''s machine.


    The most common source of digital certification is VerSign, In of course, to obtain
    a commercial certification, you must submit an application and pay the appropriate
    fee. You can find out more about obtaining a digital certificate for your macro
    at versign.com. Another company you can contact for a digital ID is Thawte Consulting.
    You can find out about their signature options at thawte.com.


    ![](img/b1f17ae2919b92b22fb561904c497d03_188_0.png)


    # CREATE A SECURITY CERTIFICATE


    Note: Office XP locates your files in C:\Program Files\Office.


    +   1. Open Windows Explorer.


    +   2. Click the Office10 subfolder of the Microsoft Office folder.


    +   3. Double-click the SelfCert.exe program file.


    +   4. Type your name.


    +   5. Click OK. SelfCert.exe creates a digital certificate.


    CONTINUED'
