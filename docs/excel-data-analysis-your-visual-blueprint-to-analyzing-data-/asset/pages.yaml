  md: '# EXCEL DATA ANALYSIS


    # OUTLINE YOUR DATA


    You can create an outline of your data in Excel to group information together
    in sections. The feature allows you to expand and collapse sections, which helps
    you find certain parts of your worksheets quickly. If you have sales records on
    one worksheet with each totaled, you can collapse records and view only the total
    amounts for each month.


    You can either create an outline by identifying group of related data, or you
    can have Excel create an automatic outline. You manually by first selecting the
    rows or columns you want to group. When you activate the Group command, Excel
    places all the rows or columns in place. If you have a specific row or column
    that you want be visible when you collapse the group, simply do not make it part
    of the selection.


    The outline feature typically works best when you have subtotal rows and columns.
    See Chapter 3 for subtotaling. Select at least one cell in the range you want
    to outline and activate the outline command. Excel creates contents of the worksheet
    and applies formulas to the worksheet. If your worksheet has a total row, Excel
    creates a summary data, or top level. If you have subtotals, Excel groups with
    the surrounding data records.


    You can use the outline symbols to hide and show the detail records in your worksheet.
    The minus sign heides the corresponding rows or columns, while the plus sign expands
    your records. Excel uses numbers to identify the different levels. The first level
    collapses and shows only the summary records.


    ![](img/b1f17ae2919b92b22fb561904c497d03_53_0.png)


    # OUTLINE YOUR DATA


    ![](img/b1f17ae2919b92b22fb561904c497d03_53_1.png)


