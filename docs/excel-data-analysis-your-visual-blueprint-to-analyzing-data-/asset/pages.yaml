    # Extra


    Excel sorts data based upon your sort criteria and its own built-in sort rules.
    For an ascending order sort, Excel uses the following rules. If you sort descending
    order, Excel reverses these rules.


    +   - Custom sort orders have first precedence. See the "Create a Custom Sort"
    for more information.


    +   - Excel places numbers at the top of the sort, and then sorts from smallest
    to largest number with the smallest negative number at the top of the list, and
    the largest positive at the bottom.


