    (μ1) is directly related to the number of calls the marketing department makes
    (μ2). This is called the true hypothesis (H₁); the null hypothesis (H₀) is that
    they are not


    To perform this, you must provide the range of the cells you want to analyze,
    as well as the statistical confidence level, between 0 and 1, in the Alpha field.
    The Alpha field is the probability of H₂ being true. The default level of of is
    5-percent confidence level.


    H₀: μ₁ ≠ μ₂ and H₁: μ₁ = μ₂


    In a Two-Factor ANOVA, you may have an assumption that both the number of calls,
    and a special promotional deal


