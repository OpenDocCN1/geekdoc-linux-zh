    # PROTECT WORKSHEETS


    if you intend to share your worksheet with other users, you may want to protect
    it to ensure that they cannot alter values in individual cells. protecting the
    worksheet, you ensure the integrity of the data remains intact, no matter who
    views the worksheet contents.


    users can perform while the worksheet is protected. There are fifteen different
    options from which to choose, including locking and unlocking cells, formatting,
    and inserting or deleting cells. If a user attempts to perform a task that is
    not allowed, Excel displays a message box indicating that the worksheet is protected.
    In order for users to make modifications to a protected worksheet, they must un
    the worksheet with a password.


    To use the Protect Sheet dialog requires you to specify a password to protect
    and un the worksheet. Use a password that you can easily remember; after you apply
    a password to a worksheet, no one, including you, can alter the worksheet without
    specifying the appropriate password. After you protect it, it remains protected
    until you undo it.


    By default, Excel allows the user to select both locked and unlocked cells. When
    users select a protected cell, they can view the contents of the cell in the formula
    bar. If you create formulas that you do not want others to view, make sure both
    of them are selected. If users select an unprotected cell, they can modify the
    cell


