  md: '# EXCEL DATA ANALYSIS


    # # LOCATE A VALUE IN A WORKSHEET


    To locate values that match specific criteria manually scrolling through a large
    list of data values, you can use Excel Find. A data analyst can quickly use this
    feature to find any number or word, such as a region forecast for the year or
    a salesman''s name. You simply enter what you want to search for in the Find and
    Replace box.


    To narrow your search, you can match not only the value in the Find field, but
    also a specific formatting. For example, you can find a value that matches 145.34
    and displays in Arial font.


    If you do not know the exact value to locate, you can use one of two wildcards
    as characters. You use either an asterisk (*) or question mark (?) to denote a
    missing character from a value. For example, if you search for 114, Excel finds
    the values 104, 114, and any other three digit number that matches the pattern.
    An asterisk finds any number of characters, ? finds only the value, but also 1234
    and 19854.


    To specify formatting, click the Options button in the Find and Replace dialog
    box. Click the Format dialog box. The Format dialog box displays the formatting
    that you type in the Format Cells dialog box. Select the formatting you want to
    search for and click OK. The formatting displays in the Preview field of the Find
    and Replace dialog box. When you click Find Next, Excel finds the text that matches
    the text in Find and has specified formatting. See the section "Custom Format"
    for more information about formatting options.


    When you search, Excel finds the first match for the specified pattern after the
    active cell. If the cell is active, click Repeat to find the next cell.


    # LOCATE A VALUE IN A WORKSHEET


    ![](img/b1f17ae2919b92b22fb561904c497d03_19_0.png)


    ![](img/b1f17ae2919b92b22fb561904c497d03_19_1.png)


    +   - Click Find.


    +   - Excel displays the Find and Replace dialog box.


    +   - Type the value you want to locate in the Find field.


    +   - Use * to replace a series of characters or ? to replace a single character.


    +   - Click Find Next.


    +   - When you find the correct value, click Close to close the dialog box.


    ![](img/b1f17ae2919b92b22fb561904c497d03_19_2.png)'
