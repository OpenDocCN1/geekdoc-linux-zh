  md: '# EXCEL DATA ANALYSIS


    # DETERMINE THE COVARIANCE OF TWO SETS OF DATA


    Covariance calculates the average of the product of deviations from the mean of
    each data set. If you plot your data and observe a straight line using Excel (Scatter)
    chart, you can statistically prove a relationship exists by calculating the correlation
    and covariance. When two data sets are dependent on each other, covariance determines
    whether the two data sets are related, or how they vary. Once you have the covariance
    and correlation calculations, you can use them to determine if there is, in fact,
    a relationship between the two sets using the Correlation Between Sets of Data
    or for more calculating correlations, and Chapter 6 for plotting data.


    have the data sets grouped. You can make the output easier to identify by having
    results and labels in the first row of your worksheet.


    Excel creates a table showing the covariance value between each set of data. The
    covariance of a value with itself is positive, values the data sets are increasing
    together. If the covariance value is negative, the second data set tends to increase
    as the first decreases. If the covariance is zero, you cannot predict a correlation
    between the two data sets.


    To learn how to load the Covariance feature as a part of the Analysis ToolPak
    add-in, see the section "Install Excel Add-ins"


