    the Correlation again to update the values.


    If you want to modify the data values and have Excel automatically update the
    Correlation value, you must use the CORREL function to create a formula. With
    this function, you can examine the values in two different lists and determine
    the correlation. The CORREL function has two arguments:


    ```

