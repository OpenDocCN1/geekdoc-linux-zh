    If you import data from an external database that matches only specific criteria,
    you can create a database query. This allows you to import only the data records
    that you want to analyze, eliminating records that are of no value to you. For
    example, you can import all products under $1,000. You can also import records
    from several tables and specify that you want Excel to import only specific columns.
    For example, you may want only product name and price columns from several database
    tables containing product information.


