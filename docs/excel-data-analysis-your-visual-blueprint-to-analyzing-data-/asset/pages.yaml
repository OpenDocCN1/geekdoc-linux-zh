    you create a named range. Excel continues to use the stored named range whenever
    you refer to it with the assigned name. If you change the worksheet by adding
    or removing data, you must update the corresponding ranges name so that Excel
    reflects the appropriate cells when you use that name. To create named ranges,
    and for more on the benefits of using, see the section "Create Label Ranges"


    use the Define Names dialog box to modify a named range. In this dialog box, you
    select the desired range name and make the appropriate modifications by entering
    them in the References field or by using the Collapse button to select a new range
    of cells. If you have multiple ranges to modify, you can use the Add button to
    save the changes to the first name and then modify the next name.


    When you modify a named range, the changes affect every location that refers to
    the corresponding range. For example, if you create a formula that uses a specific
    named range, and then change the cells that the name refers to the new version
    of the named range. See Chapter 4 for more information on creating formulas.


    If you change the actual range name in the Define Names dialog box, Excel creates
    a new range name and keeps the old range name. You can delete the old name using
    the Delete button. See "Create Label Ranges" for information on deleting a range
    name.


