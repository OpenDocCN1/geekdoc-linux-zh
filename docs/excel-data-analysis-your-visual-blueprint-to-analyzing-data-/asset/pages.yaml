  md: '# EXCEL DATA ANALYSIS


    # FIND THE CORRELATION BETWEEN TWO SETS OF DATA


    You can compare two sets of data to determine the relationship using Excel''s
    Correlation tool. If you plot data and observe a scatter plot, you can see a straight
    line showing that a relationship exists by calculating the correlation and variance.
    Correlation, as a function of covariance, determines if two sets are dependent
    on each other. To determine the degree, you calculate the positively or negatively
    correlated sets. A positive correlation indicates an increase in increase to a
    specific marketing activity; a negative correlation occurs when sales returns
    increase as a result of a product with short life leaves. For more, see the section
    "Determine the Correlation of Sets of Data." See Chapter 6 for more on Excel''s
    charts options.


    To calculate a correlation, you must provide Excel with the range of cells for
    both data sets as well as how you have grouped them. To make the output easy to
    identify, you may want to select the option that puts your labels in the first
    row of your work.


    The Correlation tool creates a table showing the degree of correlation between
    each group of data. The correlation coefficient is a value between -1 and 1. A
    coefficient value of -1 denotes a negative correlation, where the values of one
    group increase the same degree as the values of the other group decrease. With
    a coefficient value of 1, it denotes a positive correlation, where the values
    of one group increase the same degree as the values of the other group. If the
    correlation coefficient is zero, the groups have no relationship.


