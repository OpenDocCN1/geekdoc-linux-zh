  md: '# EXCEL DATA ANALYSIS


    # GROUP PIVOTABLE DATA ITEMS


    As you analyze data in a PivotTable report, you can combine items into one value
    or show a specific relationship. The Excel''s Group option is helpful for organizing
    and presenting your data. For example, when you have a large amount of data, you
    can illustrate sales by quarters. Then you can collapse the group to show only
    the summary information, such as totals for the quarter.


    Person field, you can group Month field items, but cannot include Sales Person
    field items in the same group. You can even select and group items from the same
    field that are not adjacent in the PivotTable report. To select nonadjacent items,
    use Chapter 1. See the section "PivotTable Basics" for information about the areas
    and fields of the PivotTable report.


    When you create groups in your PivotTable, Excel automatically calculates totals.
    To see the totals when you collapse the detail of the group, Excel combines the
    values of the items and displays the corresponding totals. You can also obtain
    totals for a group by filtering the field to only display the group. Use the section
    "Filter Field" for more information about filtering options.


    As you divide field into groups, Excel creates new field items that contain the
    group names as the filters on the box. When you finish grouping, Excel still contains
    the original field. You can change the Excel''s default name for the group and
    apply formatting options to it.


    You cannot group by different fields. For example, if the row area contains both
    Month and Sales


