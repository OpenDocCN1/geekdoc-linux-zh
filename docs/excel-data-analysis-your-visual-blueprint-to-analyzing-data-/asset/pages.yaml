    +   Select the list of records that you want to filter.


    Note: See Chapter 1 for information on selecting a range of values.


    +   Click Data Filter AutoFilter.


    +   You can apply filters to multiple columns by selecting filters for the other
    columns.


    +   Click an arrow above the column you want to filter and select the desired
    filter value.


