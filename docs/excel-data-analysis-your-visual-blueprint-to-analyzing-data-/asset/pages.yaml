- img_proc: true
  md: '# AUTOMATING ACTIONS WITH MACROS


    # Extra


    You can specify a different value to the counter variable. By default, the counter
    for the For Next loop increments by one each time the loop executes. If you want
    to increment or decrement the counter by a different numeric value, you use the
    Step statement and specify the increment. If you specify a positive value, the
    counter variable increments by each time the loop cycles. If you specify a negative
    value, the counter variable decreases by that each time the loop cycles. The For
    loop starts with an initial counter of 2 and a maximum value of 2. The Total variable
    increments by the value of the loop. The loop executes ten times. When the initial
    and maximum value of the counter are equal, the loop executes a final time before
    it passes control to the next statement output.


    Example:

    J = 2 To 20 Step 2

    TotalVal = TotalVal + J


