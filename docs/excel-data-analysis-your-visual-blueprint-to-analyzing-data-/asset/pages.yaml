  md: '# EXCEL DATA ANALYSIS


    # SOLVE A FORMULA WITH A DATA TABLE


    If you want to compare how different values affect the results for an argument,
    you can do so by creating a data table. For example, an analyst can use this function
    to determine monthly payments on a loan at different interest rates. When you
    create a data table, you can use what-if comparisons to see the value of a formula
    with different arguments.


    To use a data table to solve a formula, you must create a table that contains
    two columns or two rows. If you use columns, the first column contains the values
    you want to substitute into an argument of the formula. The second column contains
    the formula in the first cell. If you use rows, you need to place the substitution
    values in the first row.


    When you create the table, the argument needs to reference the first value in
    the data column. For example, if column A contains rates to specify the PMT function
    argument must reference the first cell in column A as shown in the following sample:


    ```

    =PMT(A2, E3, -E2)

    ```


    In the Dialog box, you specify the row or column containing the substitution by
    entering the first cell in the column or row. If your table contains the substitution
    values in a column, you place the first cell in the column in the Column Input
    cell field. If you use rows, you place the value in the Row Input cell field.


    # SOLVE A FORMULA WITH A DATA TABLE


    ![](img/b1f17ae2919b92b22fb561904c497d03_83_0.png)


