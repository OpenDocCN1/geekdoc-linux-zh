  md: '# EXCEL DATA ANALYSIS


    # DETERMINE THE LOCATION OF A VALUE


    To determine the location of a specific value within a row or column of a worksheet,
    you can use the MATCH function worksheet. This function is important when your
    data analysis requires you to know the location of a value, or its closest match.


    The optional match_type argument defines how Excel compares the value to the lookup_value
    argument to define the range of cells if it finds an exact match. If you omit
    the argument, or if the argument contains a value of 1, Excel finds the largest
    value that is less than or equal to the lookup_value. For find the closest match,
    you must first sort the list of cells in ascending order. If the match_type argument
    is 0, Excel finds an exact match. With a value that is greater than or equal to
    the lookup_value. With a value of -1, Excel returns the smallest value. You must
    sort the list of cells in descending order. See Chapter 2 for more sorting on
    your data.


    The MATCH function includes three arguments, of which the first two are required.
    The last is optional.


    ```

    =MATCH(lookup_value, lookup_array, [match_type])

    ```


    The lookup_value argument defines the value to locate within the specified range
    of cells. You can specify a name, text value, or a cell reference identifying
    the value you want to locate. The lookup_array defines a range of contiguous cells,
    referred to as an array, in a row or column.


    When you use the MATCH function, it returns an integer identifies the location
    of the value within the specified range of cells. For example, if Excel finds
    the value 2 and the specified range of cells in A4 through A24, A5 contains the
    value, or the closest match.


    # DETERMINE THE LOCATION OF A VALUE


    ![](img/b1f17ae2919b92b22fb561904c497d03_89_0.png)


    +   Open a worksheet that contains the data list you want to search.


    Note: See Chapter 2 for more information on sorting your data.


    +   Find the closest match, sort the list in ascending or descending order.


    +   Select the formula cell.


    +   Click Insert > Function.


    The Insert Function dialog displays.


    Note: See the "Add a Function via the Insert Function Dialog Box" for more information
    on this dialog box.


    +   Click OK.


