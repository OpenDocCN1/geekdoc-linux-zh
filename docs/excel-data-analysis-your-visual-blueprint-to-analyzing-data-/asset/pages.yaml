  md: '# EXCEL DATA OPTIONS ANALYSIS


    # APPLY AUTOFORMAT TO A WORKSHEET


    If you want to quickly change the appearance of your worksheet, you can apply
    a predefined format. Excel provides 15 different formats that create a table-like
    layout for your data. The formats work best when your worksheet contains row and
    column headers and totals for rows and columns.


    Excel replaces any previously applied custom formatting with those that you select
    in the AutoFormat dialog box. For example, if you have previously selected Arial
    Black for the entire worksheet, and you apply the Accounting 1 format, Excel changes
    the font to Arial, the default font for numbers.


    You select a defined format from the AutoFormat dialog box. At the bottom of the
    dialog box, you find six format options: Number, Borders, Font, Alignment, Patterns,
    and Width by default. You can select any six options and adjust any of them to
    achieve the effect you want. For example, if you make any changes. As you select
    or deselect formats, the AutoFormat dialog box reflects the changes letting you
    view how your options affect a particular table format.


    The cells you select before applying a format greatly affects how AutoFormat applies
    to your worksheet. If you only select one cell in a range of cells, Excel selects
    the surrounding cells and applies the format to all surrounding cells. When you
    encounter a row or column of blank cells, it no longer applies the formatting,
    cells automatically refresh after you apply the format. If you select a range
    of cells, Excel only applies the selected format to those cells.


