  md: '# FORMULA BASICS IN EXCEL


    # EXCEL OPERATORS (CONTINUED)


    # Reference Operators


    You specify a range of cells for your formula with one of three different operators.
    See Chapter 1 for more information on selecting cell ranges. The following table
    describes each of the operators:


    | OPERATOR SYMBOL PURPOSE |

    |---|---|---|

    | Range | | Specifies a range of cells from the cell reference before the operator
    to the cell after the operator. |

    | Union | | Combines multiple ranges in one reference. |

    | Intersection (space) | References the cells that are common between two ranges.
    |

    | | EXAMPLE |

    | | A1:A15 specifies all cells from A1 to A15. |

    | | =SUM(A1:A10, C1:C10) sums cells in A1 through A10, and C1 through C10. A1:C10
    B1:D10 specifies the common cells in the range A10, and C1 through B10. In the
    formula =SUM(A1:C10 B1:D10), sums only the values in cells B1 through C10. |


    # OPERATOR PRECEDENCE


    When Excel evaluates a formula that contains, it uses a specific order to determine
    which part of the formula it evaluates first. This is known as the *precedence
    order*. For example, Excel calculates 4^2 first and has a result of 19 then adds
    16 to 3: =3+4^2. To change the order of precedence, you can place parentheses
    around 3*4 so


    that the following formula gives a result of 49 (7 raised to the second power):
    =(3+4)^2.

    The following table shows the precedence order, highest to lowest, which Excel
    uses to evaluate operators in formulas. If the operators in the formula all have
    the same order of precedence, Excel evaluates the equation from left to right.


    | PRECEDENCE OPERATORS SYMBOL |

    |---|---|---|

    | 1 | Parentheses | ( |

    | 2 | Reference operators | :, (space) |

    | 3 | Minus Sign | - (negates a number before any) |

    | 4 | Percent sign | % |

    | 5 | Multiplication and Division | * |

    | 6 | Addition and Subtraction | + |

    | 7 | Concatenation | & |

    | 8 | Comparison operators | = <> >= >= <> |'
