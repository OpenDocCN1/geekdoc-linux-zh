  md: '# EXCEL DATA ANALYSIS


    # RECORD A MACRO


    You can use macros to automate steps used to analyze data within Excel. For example,
    if you repeatedly sort and sum series of values, the easiest way to create a macro
    is to perform that. Using the Macro Recorder captures everything that you do and
    saves the steps in a macro with a name you specify. After you create it, you can
    run it faster, modify it, or delete it.


    Because the Macro Recorder records every action that you perform when you use
    it, consider planning your steps before creating a macro. When you plan out the
    steps you save time and the macro will run faster and more effectively. When you
    name a macro, use a name that starts with a letter and has no spaces in it; you
    can, however, use underscore to separate words.


    Excel creates the macro with either relative or absolute reference to the cell
    where you apply it. To use a relative reference, making the macro perform based
    on the location of the cell, specify the reference by selecting the Relative Reference
    button on the Recording toolbar. For example, you can create a macro that adds
    values in the four cells and places the total in the selected cell. With absolute
    recording, the macro will run in absolute mode and remembers the recorded cells.
    For example, the macro remains only to add the same cells (such as A1 to A6) and
    the sum in cell A6. You can choose between relative and absolute recording while
    recording your macro by selecting the Reference button. For more relative and
    absolute cell references, see Appendix D.


    ![](img/b1f17ae2919b92b22fb561904c497d03_177_0.png)


    # RECORD A MACRO


    ![](img/b1f17ae2919b92b22fb561904c497d03_177_1.png)


    +   1. Click the worksheet cell to contain the results of the macro.


    Note: If you intend to use other worksheets in your macro, make sure that the
    cells contain the desired values.


    +   2 Click Tools Record New Macro.


    +   3 The Record Macro dialog box opens.


    +   4 Select where you want to store the macro.


    +   5 Click OK.


    You can create a unique name for your shortcut by typing the desired key in the
    Shortcut Key.


    164'
