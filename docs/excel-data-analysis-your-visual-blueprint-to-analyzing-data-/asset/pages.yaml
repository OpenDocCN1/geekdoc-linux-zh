    activate the Wizard, select the Select Database dialog box. The Query Wizard steps
    you through the process of creating the query. If you do not select it, you may
    use Microsoft Query directly to create your database query. Microsoft Query is
    a simple program designed to simplify the process of creating a database query
    by stepping through the process.


