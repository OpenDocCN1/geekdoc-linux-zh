    for the analyst who wants to determine how much of a product division must sell
    to make a specific profit, or how much money to make a monthly payment of $1500
    on a business loan.


    To produce the desired results for your function, Excel changes the values of
    the cells referred by your arguments; therefore, you must specify which cells
    Excel modify. In the business loan example, if you want to change the loan amount
    and the interest rates, you change those cell references. When the Solver solves
    it you can either keep the new values or the original values. Note that if you
    also use the Keep Solver option, you cannot undo the changes to


    In the Solver dialog box, you specify what cell, always the cell containing the
    formula, must produce your expected result. You must also define what formula
    must produce until it is less than, or equal to the specific end value. For example,
    you can select the Value Of option to find the values that return -1500 by the
    PMT function, which returns a negative value to indicate a payment amount.


    The Solver option is an Add-in, which means that by default, it is not installed.
