  md: '# EXCEL DATA ANALYSIS


    # AN INTRODUCTION TO MACROS (CONTINUED)


    # UNDERSTANDING VBA


    You use the Visual Basic for Applications programming language to create all macros
    within Excel. VBA enables you to add functionality to a macro. To create a VBA
    macro, you need to be familiar with VBA terminology.


    # Data Types


    A data type refers to how VBA stores data in memory. VBA provides an assortment
    of built-in data types that you can use to handle your data, along with user-defined
    data types that you create.


    # Variables


    Variables are essentially just user-defined storage spaces. You can declare a
    variable to contain a specific type of data value.


    You can make names almost anything including combination of alphabetic characters,
    numbers, and punctuation—such as #, $, %, and _—as long as the character is alphanumeric.
    You can also use spaces as part of the name:


    With VBA, you do not need to specify the data stored in a variable when you declare
    it. You can enable VBA to automatically determine the data type, doing so can
    slow down your code for a large macro.


    VBA is not case-sensitive when it comes to variable names. You can make the names
    any combination of upper- lowercase characters. Keep in mind that the name cannot
    exceed 254 characters.


    The size of a data type is the number of bytes, with a bit being the smallest
    storage unit and having a value of 0 or 1. Knowing the number of bytes required
    to store a data type helps you use memory more efficiently. Although storage sizes
    are rarely a problem with most macros, keep them in mind when you create complex
    macros.


    # Numeric


    VBA provides several different numeric data types, categorized by the type of
    numeric you want to store. VBA provides three integer data types for numeric values
    that do not include a decimal portion


    and uses floating-point data types. The one you select depends on the size of
    the numeric value you want to store in. The following table lists various numeric
    data types:


    | DATA TYPE | BYTES | RANGE OF VALUES |

    | --- | --- | --- |

    | Byte | 1 | 0 to 255 |

    | Integer | 2 | -32,768 to 32,768 |

    | Long | 4 | -2,147,483,648 to 2,147,483,647 |

    | Single | 4 | -3.402823E38 to -1.401298E-45 for negative values

    1.401298E-45 to 3.402823E38 for positive values |

    | Double | 8 | -1.7976931348623E308 to -4.9406546812447E-324 for negative values

    4.9406546812447E-324 to 1.7976931348623E308 for positive values |

    | Currency | 8 | -922,337,203,685,477,508 to 922,337,203,685,477,508 |'
  merge: -1
