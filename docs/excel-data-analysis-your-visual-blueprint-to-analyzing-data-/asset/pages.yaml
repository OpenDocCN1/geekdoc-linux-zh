  md: '# EXCEL DATA ANALYSIS


    # ADD A TRENDLINE TO A CHART


    To illustrate trends that occur in your data, you can apply a trendline to your
    chart. Trendlines are helpful in analyzing data because they forecast future data
    based on your current data. For example, if you have sales data for a sales team
    for an entire year, you can predict how the team may perform in the upcoming year.


    To forecast either future or past values, you use the Forecast options. When Excel
    adds the trendline, it extends the line to match the number of future or past
    periods you specify. The forecast is based solely upon the values in the selected
    data series and the trendline type.


    Forecasts are only accurate if you select the appropriate trend. To do so, observe
    the shape of your chart and select a trendline that fits best the data you see.
    In the Add Trendline dialog box, you can confirm your selection by looking at
    the R-squared value. The R-squared value, which ranges from 0 to 1, identifies
    the actual values in the data series. The closer the R-squared value is to 1,
    the more reliable your trendline.


    Although you can add trendlines to any data series in certain types of charts,
    Excel only allows you to add trendlines to bar, column, stacked area, line, stock,
    scatter), and bubble charts. Trends do not work with 3D charts. If you try to
    add a trendline to a chart that does not support it, Excel removes them or greys
    out the option on the menu. For the various chart types available in Excel, see
    the "Chart Basics."


    ![](img/b1f17ae2919b92b22fb561904c497d03_127_0.png)


    # ADD A TRENDLINE TO A CHART


    ![](img/b1f17ae2919b92b22fb561904c497d03_127_1.png)


    ![](img/b1f17ae2919b92b22fb561904c497d03_127_2.png)


    +   1 Click the tab of the chart to which you want to add a trendline.


    +   2 For an embedded chart, click anywhere on the chart.


    +   3 Click Chart Add Trendline.


    +   2 Add Trendline dialog displays.


    +   3 Select the series to which you want to apply the trendline.


    +   4 Click the desired trendline


    +   4 If you select Polynomial, specify the Order Number.


    +   5 Click the Options tab.


    114'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Extra


    The tab on the Add Trendline dialog box provides six different types of trends,
    each with a different type of comparison of the values in the data series. To
    more accurately predict future events, you can observe the shape of your charted
    data, and select a trendline that fits the best you see:


    | TRENDLINE | DESCRIPTION |

    | Linear | Creates a best-fit straight line that shows how values in data series
    increase or decrease at a steady rate |

    | Logarithmic | Creates a best-fit curved line that illustrates how data values
    increase or decrease and level out. You can use both negative and positive values
    with a Logarithmic trend |

    | Polynomial | Creates a curve illustrating fluctuations in the data values. You
    must specify an Order value to indicate the maximum number of fluctuations, or
    bends, that on the line |

    | Power | Creates a curve to compare measurements at a specific rate. You cannot
    use a Power trend with a data series that includes negative or zero values |

    | Exponential | Creates a curve that shows data values increase or fall at increasingly
    higher rates. You cannot use an Exponential trend with a data series that includes
    negative zero values |

    | Moving Average | Reduces fluctuations in the trendline to show a smoother pattern.
    Use the Period to specify the number of data values to create. Excel creates the
    line by averaging the specific values. If the Period value is 2, the first two
    values are averaged and the first point is on the line, then the second and third
    are averaged and become the second point.


    ![](img/b1f17ae2919b92b22fb561904c497d03_128_0.png)


    +   - The Options tab displays.

    - If desired, click Custom and use the custom trendline

    - Type the number of periods to use to determine future trend.

    - Click the Display R-square value on chart to display the R-squared value.

    - Click OK.

    - You can type values in the Backward field to fetch previous values.

    - The trendline displays on the chart for the selected data series.

    - You can repeat steps 3 to 9 to create additional trendlines.'
  merge: -1
