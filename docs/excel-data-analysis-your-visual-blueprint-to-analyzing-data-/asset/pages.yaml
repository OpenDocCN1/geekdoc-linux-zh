  md: '# EXCEL DATA ANALYSIS


    # ADD A DATA TABLE TO A PIVOTCHART


    When analyzing data using a PivotChart, you can make the data easy to interpret
    if you know what values display on the chart. If you want to see the value of
    each data point on a PivotChart, you can include a data table. A data table includes
    numeric values shown on a PivotChart. Excel typically places the data table at
    the bottom of the chart.


    Excel frequently uses the Category axis as the column labels for the data table.
    For example, if you use the default PivotChart type of a stacked chart, Excel
    attaches the data table to the Categories axis with the labels also being the
    column headings. However, if you create any type of chart, the data table becomes
    a separate entity in the chart.


    When you add a data table to an Excel chart, you have the option of displaying
    the legend keys to the row labels. The Legend keys are the colored squares that
    display which name to identify how the value appears on the chart. If you choose
    this option, the same keys as the Legend appear on the data table, making the
    use of Legend redundant on the PivotChart. Therefore, if you decide not to use
    a data table, you should remove the Legend from the PivotChart display.


    Data tables dynamically update when you change the values displayed on the PivotChart.
    For example, if you are analyzing sales in different states within your organization,
