  md: '# CREATING FORMULAS


    # Apply it


    Formula errors can occur with any formula you create. If you create a worksheet
    where other users input data for analysis, you may want to eliminate the display
    of error messages in the cells on the worksheets. By doing this, errors still
    occur but instead specify the value that displays in cells. For example, you may
    want to call a value of zero if there is an error. To control the display of the
    error messages, modify each formula using the combination of the IF function,
    which allows you to check for a condition, and the ISERROR function, which allows
    you to see if a cell contains an error. For example, to return a value of 0 if
    there is an error, with the formula A1/A2:


    TYPE THIS:


    ```

    =IF(ISERROR(A1/A2), "0", A1/A2)

    ```


    RESULT:


    With this formula, if the value that the ISERROR function returns TRUE, a value
