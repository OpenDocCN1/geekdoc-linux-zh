  md: '# WORKING WITH EXTERNAL DATA


    # Extra


    The DAVERAGE function is one of database functions that Excel provides to evaluate
    manually created or imported databases. All of the functions require the same
    three argument values. The following table gives a description of the other database
    functions.


    | FUNCTION | DESCRIPTION |

    | --- | --- |

    | DCOUNT | Counts the number of cells that contain numeric values and the criteria
    |

    | DCOUNTTA | Counts the number of cells that contain a value and match the criteria
    |

    | DGET | Returns the cell value that matches the specified criteria |

    | DMAX | Finds the largest number in the column that matches the criteria |

    | DMIN | Finds the smallest number in the column that matches the criteria |

    | PRODUCT | Multiplies the values that match the criteria and returns the product
    |

    | DSTDEV | Finds the standard deviation of a sample of the values that matches
    the criteria |

    | DSTDEVA | Finds the standard deviation of the entire list of values that matches
    the specified criteria |

    | DSUM | Totals the values that match the criteria and returns the sum |

    | VARP | Estimates a sample variance of values that match the criteria |


    ![](img/b1f17ae2919b92b22fb561904c497d03_116_0.png)


    +   The Functions Argument dialog box.


    +   Specify the reference for the Database argument.


    +   Specify the cell reference for the Field argument.


    +   Specify the range containing the criteria definition.


    Note: To learn how to specify a range, see Chapter 1.


    +   Click OK.


    +   The average displays for the records specified criteria.'
