    # CALL A CUSTOM DIALOG BOX FROM A MACRO


    You can draw and display custom dialog boxes that are part of your project as
    you macro code. We use dialog boxes to simplify the data collection or analysis
    process because dialog boxes add clarity and help to indicate a specific selection
    or to input an appropriate value. For example, you can use a dialog box to request
    values from the user to perform calculations within a worksheet. See the section
    "Create a Custom Dialog Box" for more information on custom dialog boxes.


    To display a dialog box, use the Show method of the UserForm object. This method
    has only one parameter, as shown in the following code:


    ```

    UserForm1.Show modal

    ```


    The modal parameter determines whether the dialog appears as modal or modeless
    dialog box within Excel.


    The default value of vbModal makes the dialog box modal, which means that you
    must either close or hide the dialog before selecting other options in Excel.
    When a modal dialog opens, Excel events pass to control the dialog box; users
    can select only options in it, not in any other dialog box. A value of vbModeless
    that although the dialog remains open until a user closes it, a user can perform
    other programs.


    To close a dialog box with the Normal button, or you can close it using the Unload
    method. Typically, all dialog boxes contain a Clear or Cancel button to close
    the dialog box. You must use the Click event for these CommandButton to control
    a procedure that calls the Unload method. See the section "Capture Input from
    a Custom Dialog Box" for more information about specifying code to run when a
    user clicks a button.


