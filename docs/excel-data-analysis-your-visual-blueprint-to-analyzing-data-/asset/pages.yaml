  md: '# CREATING PIVOTCHARTS


    # Extra


    When you create or view a PivotChart, Excel displays the PivotTable toolbar. The
    toolbar has options for quickly modifying the PivotChart and its corresponding
    PivotTable. Excel greys out unavailable options. You can display the toolbar by
    clicking View > PivotTable.


    You can determine the layout of the PivotChart by selecting the Layout option
    on the third page of the PivotTable and PivotChart Wizard. With the PivotTable
    report, you can construct the PivotTable report as well as the PivotChart. You
    just need to keep two things in mind: Any field you drag to the Row area become
    the Category fields on your PivotChart, and the field you drag to the Column area
    becomes the Series.


    Instead of dragging fields from the Pivot Field List, you can use the Add To option
    at the bottom of the list. To add a field to an area of the PivotChart, select
    the field and then select the location for the field next to the Add To option.
    When you click Add To, the selected field appears on the PivotChart.


