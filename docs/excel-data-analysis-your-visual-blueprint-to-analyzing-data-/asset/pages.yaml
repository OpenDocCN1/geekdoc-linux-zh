- img_proc: true
  md: '# GETTING STARTED WITH EXCEL


    # NUMERIC (CONTINUED)


    # Dates and Time


    Excel uses the Western, formally called Gregorian calendar as a basis for all
    dates and times, and stores them as a combined number. Dates are sequential, numbers
    from 1 to 295848. Excel times are stored, which are all portions of dates, as
    decimal values. For example, if you type the value 12/05/4:00 PM in a cell, Excel
    stores it as number 37935.66667, where 37935 represents the date, and .66667 represents
    the time.


    You can apply any mathematical calculations to manipulate dates and time. For
    example, you can add, subtract, or determine the elapsed time between dates and
    times. The cell''s formatting determines how the date or time value displays.


    # Dates


    Although a date displays in a cell on your worksheet, Excel actually stores its
    numeric value. Excel determines the number of days in each month. For example,
    January has 31 days, and February has 28 days with the exception of leap year.


    Excel uses dates based on what is commonly referred to as the 1/1/1900 date system,
    which recognizes a date with a stored value of 1. The last date that Excel recognizes
    is December 31, 9999 or 12/31/9999, which it stores as 295848. If you use Excel
    on a Macintosh computer, dates are based on 1/1/1904 date system, which has a
    value of 1 and 12/31/9999 has a value of 295703.


    Although the two systems use different date systems, you can convert them when
    working between a Windows and a Macintosh computer. If you open a later worksheet
    in Windows, the dates automatically convert to the 1900 date system. Likewise,
    opening a Windows worksheet on a Macintosh converts dates to the 1904 system.
    You can manually force the conversion in Excel for Windows by selecting the 1904
    date system option on the Calculation tab of Options dialog box.


    If you use two-digit dates in Excel, you must exercise caution when entering them.
    Excel interprets two-digit years between 00 and 29 as the years 2000 to 2029.
    Excel interprets two-digit years between 30 and 99 as 1930 to 1999. To avoid errors,
    consider using a four-digit year.


    # Time


    Excel stores all time as decimal values between 0 and 0.9999999, with 12:00 being
    midnight and 12:59 being noon. 0.9999999 is a time that displays as 12:00 (P.M.)
    which has a value of 0.5.


    By default, Excel bases all times on a 24-hour clock, commonly known as military
    time. This means that if you enter 10:30 without an A.M. or P.M., Excel assumes
    it 10:30 A.M.


    # Formula


    You can create formulas within any cell of a worksheet to evaluate date and time
    numeric values in other cells within the worksheet. For example, the following
    formula adds the numeric values in A1 through A10 and displays the total in the
    containing cell.


    ```

    =SUM(A1:A10)

    ```


    You must precede formulas with an equal sign, which signals that what follows
    is a formula Excel needs to evaluate. You can use any of the built-in functions,
    mathematical operators, constant values, and cell references to create a formula.
    Note that the number of characters in a formula cannot exceed 1,024 cells.


    Excel formats a cell based on the resulting value of the formula. For example,
    most formulas return a numeric value; therefore, by default, Excel rights-the
    returned value of numeric formula cells like other numeric cells. See Chapter
    4 for more information about creating formulas in your worksheets. For more formula
    basics, see Appendix D.


    ![](img/b1f17ae2919b92b22fb561904c497d03_18_0.png)'
