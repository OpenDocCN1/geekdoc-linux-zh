  md: '# Extra


    You use the Function field to specify the method by which Excel combines your
    data into one worksheet. Excel provides several different functions for merging
    data:


    | FUNCTION | DESCRIPTION |

    |---|---|

    | Sum | Adds values between the merged ranges. |

    | Count | Counts the number of values in the merged ranges. |

    | Average | Averages the values in the merged ranges. |

    | Max | Finds the maximum value in the merged ranges. |

    | Min | Finds the minimum value in the merged ranges. |

    | Product | Multiplies and returns the result. |

    | Count Names | Counts the number of numeric values in the merged ranges. |

    | StdDev | Calculates the standard deviation of the values in the merged ranges.
    |

    | StdDevp | Estimates the variance of the values in the merged ranges based on
    sampling of the values in the range. |

    | Varp | Calculates the variance of the values in the merged ranges using all
    values in the range. |


