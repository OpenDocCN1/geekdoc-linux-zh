  md: '# EXCEL DATA ANALYSIS


    # SAVE FOR WEB


    You can make your analysis results available by saving your worksheets and workbooks
    to the Web so colleagues can view them on the Internet. When you save your data,
    you need to create an HTML page, HTML or Hyper Text Markup Language, a standard
    format is what you can create Web pages that all browsers can interpret. If you
    select that format, Excel saves your workbook selection


    When you save a workbook as a Web page, you can save either the current worksheet
    or the entire workbook. Keep in mind, if you decide to save the entire workbook,
    Excel saves each worksheet as a separate HTML page. If one of the worksheets in
    your workbook is blank, Excel creates a blank worksheet. You may consider removing


    any blank worksheets from your workbook before saving them as Web pages.


    When you save in the HTML format, you can create either a static or interactive
    version of your workbook. With static pages you only view the content of the workbook.
    You should select this option when you want to analyze data, but do not want other
    users to alter it.


    With an interactive version of the workbook, you provide each reader the option
    of altering the paging'' contents for the purpose of modifying data. If you save
    a PivotTable or PivotChart as an interactive HTML page, the user can apply filtering
    to the areas to retrieve the desired results. See Chapter 7 for more information
    on PivotTables. See Chapter 8 for more information on PivotCharts.


    # SAVE FOR WEB


    ![](img/b1f17ae2919b92b22fb561904c497d03_117_0.png)


    +   Click File > Save As...


    # CREATE HTML FILE


    +   The Save As dialog box displays.


    +   Select the Web Page (*.htm; *.html) option in the Save as type field.


    +   The Save button displays.


    +   You can click Add interactivity make the HTML page interactive.


    +   Select whether you want to save the entire workbook, or just the selected
    worksheet.


    +   Click Save.


    104'
