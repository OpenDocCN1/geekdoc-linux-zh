  md: '# EXCEL DATA ANALYSIS


    # FIND THE AVERAGE OF

    A DATABASE RANGE


    To find the average of specific imported database records, you can create a formula
    using the AVERAGE function in your worksheet. An analyst can use this function
    to average only the records that match certain criteria. For example, if you have
    imported database list of computer equipment, you can find the average of the
    monitors in the list. Although Excel has the database function, you can use it
    with any data list. See Chapter 2 for more information on using data lists in
    Excel.


    There are three different arguments for the AVERAGE function, and you must specify
    values for each of the arguments:


    ```

    =AVERAGE(database, field, criteria)

    ```


    ![](img/b1f17ae2919b92b22fb561904c497d03_115_0.png)


    You must indicate the range that contains the imported database values for the
    database argument. Also because Excel uses the column labels to match the information
    specified for the criteria argument, you must select the column labels as well
    as the database values. You reference the cell containing the label of the column
    you want to average for the field argument. Specify a number, identifying the
    column position in the selected list of values. For example, use the column type
    1 for the field argument.


    Finally, you must create a set of cells containing your criteria values. The criteria
    definition must consist of at least two rows. The first row contains the column
    labels that you want Excel to use for results. The second row contains your criteria.
    See p. 52-53 for more criteria.


    +   1 Select the column headings for the database list.

    2 Type the criteria under the corresponding column label.


    +   3 Select the formula cell.

    4 Click Insert Function.


    > Note: See Chapter 4 for more information on inserting functions.


    +   5 Select the AVERAGE function.

    6 Click OK.


    102'
