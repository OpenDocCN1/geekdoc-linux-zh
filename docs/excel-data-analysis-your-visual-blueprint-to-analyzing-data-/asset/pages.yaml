  md: '# EXCEL DATA ANALYSIS


    # VALIDATE DATA


    To increase the accuracy of your data, you can limit what a user can and cannot
    enter into a specific cell. By default Excel does not compare values against expected
    criteria. Entering the wrong type of data values can produce inaccurate results
    when you perform any data analysis. To ensure you only enter specific values in
    a cell or range of cells, you can use the data validation options to prevent unacceptable
    entries. This is especially helpful when dealing with multiple users entering
    data in the same worksheet. With data validation, if you specify a range of values
    and the user types something other than these values, Excel displays an error
    message and does not place the value in the cell.


    can this to a specific data type. For example, if you want to allow currency values,
    such as $10.50, you select Decimal in the Allow field.


    The Data field has operators that define the valid range of data. For example,
    if you select greater than, you create the minimum value in the Minimum field.
    If you select the between or not between operators, Minimum and Maximum fields
    display in the data box so you can define the range to validate.


    In the values field, you must specify the values for the selected cells. Excel
    displays either one or two values based on the operator in the Data field. You
    have options for these fields. You can enter a constant in the field - any alphanumeric
    value, or you can select a range.


    You create the validation definition for the selected cells in the Settings tab
    of the Data Validation box. Any value, by the Allow field, allows all entries.


