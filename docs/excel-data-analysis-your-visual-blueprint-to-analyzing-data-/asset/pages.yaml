  md: '# AUTOMATING ACTIONS WITH MACROS


    # Extra


    You may have situations in which you want to pass parameters to subroutines. A
    parameter is essentially a variable that receives an argument from the statement
    you use to call the subroutine. Just like standard variables, you must specify
    the data type for the subroutine parameters to avoid them converted to variables.


    Example:


    ```

    Sub TotalValues

    Dim Value1, Value2 As Integer

    Value1 = 5

    Value2 = 7

    Call AddValues (Value1, Value2)

    End Sub


    Sub AddValues (Val1 As Integer, Val2 As Integer)

    Dim Total = Val1 + Val2

    MsgBox (Total)

    End Sub

    ```


    In the following example, the Call statement in the TotalValues subroutine calls
    the AddValues subroutine and passes the values contained in the Value1 and Value2
    variables. A subroutine that has parameters cannot be called by the Macro dialog
    box. Other procedures may call subroutines with arguments. Therefore, you should
    run the macro TotalValues and call the subroutine AddValues by passing the required
    parameter values.


    ![](img/b1f17ae2919b92b22fb561904c497d03_184_0.png)


    +   - The Visual Basic Editor inserts the End Sub command when you press Enter.


    +   - Switch to Excel and open the Macro dialog box.


    +   - The new subroutine appears as a macro along with the other available macros.


    +   - Type the macro code.


    Note: See the section "Run a Macro" to open the Macro dialog box.'
