    MULTIPLE CHART TYPES


    You can create charts that apply different chart types to each data series. For
    example, you may want to create a chart to display one data series and then include
    another series as a continuous line. Combining chart types allows you to use more
    complex charts.


    To create a chart with multiple types, you must first create the main chart specifying
    all data values for the series. Then select the chart for the selected series.
    You can only change the type for one series at a time.


    The legend reflects any changes made to the chart type for a data series. For
    example, if a data series changes from a bar to a chart, colored line displays
    as the key for the data series on the legend.


    There are some chart types that you cannot combine. For example, Excel does not
    allow both a column and bar chart. If you attempt to combine non-compatible charts,
    an error message displays and the charts are not combined. To verify this, try
    to add a new chart type to the existing chart and preview the chart in the Chart
    Type dialog box. If Excel has any problems, messages display in the Preview window.


    You can combine 2D and 3D chart types. 3D charts must be the type of the entire
    chart. Attempt to combine 2D and 3D chart types results in a warning message,
    but both chart types work. Although you have the option of creating a different
    type for each data series on the chart, avoid using more than two chart types,
    because too many chart types can make your chart confusing and difficult to interpret.


