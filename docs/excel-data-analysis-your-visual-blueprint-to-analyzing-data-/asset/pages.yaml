  md: '# EXPLODE SLICES OF A PIE CHART


    You can rotate the pie chart so that the exploded piece appears at a specific
    angle in the chart. To rotate the chart, click the pie chart and click Format
    > Selected Data Point to display the Format Data dialog box. Click the Options
    tab. In the Angle of field, select the degrees of rotation for the pie chart.
    The Preview window in the dialog box shows the effect of rotating the chart. Keep
    in mind that the exploded piece remains in the same location in the chart. Excel
    rotates the entire chart.


    You can explode all slices of a chart by selecting the entire pie chart and dragging
    toward the outside of the chart object. As you drag, each piece moves an equal
    distance from the pie chart.


    By default, Excel displays each piece of the pie chart in a different color. If
    you want to make the entire pie chart the same color, you can deselect the Vary
    color by slice option changes to.


    # EXPLODE SLICES OF A PIE CHART


    ![](img/b1f17ae2919b92b22fb561904c497d03_124_0.png)


    ![](img/b1f17ae2919b92b22fb561904c497d03_124_1.png)


    +   1 Click a piece of the pie chart.

    2 Drag the piece toward the edge of the chart object.'
