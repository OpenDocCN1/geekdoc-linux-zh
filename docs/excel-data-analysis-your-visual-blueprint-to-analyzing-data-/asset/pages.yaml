  md: '# Extra


    When you consolidate, Excel simply copies or combines the data in the specified
    ranges into the consolidation location. If you modify the data after you perform
    the consolidation, Excel does not automatically update the results. To do this,
    you must check the Create links to source data option in the Consolidate dialog
    box. This option places formulas in each cell of the consolidated worksheet. Formulas
    link directly back to the consolidated data, allowing Excel to update after you
    make modifications to the original data.


    If you choose to use this option, you must ensure that Excel can always find the
    worksheets containing your consolidation data. This is done by placing all worksheets
    in the same location. Each time you open the worksheet, Excel attempts to locate
