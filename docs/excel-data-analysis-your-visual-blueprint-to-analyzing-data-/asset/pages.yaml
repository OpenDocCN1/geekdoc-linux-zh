  md: '# EXCEL DATA ANALYSIS


    # COPY AND PASTE A RANGE OF CELLS


    If you want to use the same values in multiple locations, instead of retyping
    them, you copy and paste. For another report, you may copy a data list for use,
    or duplicate a formula in multiple cells. You can repeat information within cells
    using the Copy and Paste options. When you copy a cell or range of cells, Excel
    replaces everything in the cell values, formatting, and data and leaves the original
    values unchanged. You can use multiple cells so long as they are adjacent.


    After you copy a range of cells, you can paste the cell contents at any location
    within your current workbook, another Excel workbook, or any other Microsoft Windows
    program. Excel replaces the contents where you pasted the copied values. You can
    paste the copied cells so you have not copied another range of cells until you
    close Excel.


    When you are careful, the best method is to select the first cell you want to
    paste the contents of and then apply the Paste command. If you attempt to paste
    the entire range of cells and do not select the exact number of cells, you will
    receive an error message.


    When you apply the Command to copy a range of cells, Excel selects the cells with
    data marked until you perform a task that deselects them. You can also apply options
    that change the worksheet, by copying another range of cells, or inserting rows.


