  md: '# EXCEL DATA ANALYSIS


    # ADD A FORM CONTROL TO A WORKSHEET


    You can add different controls to a worksheet to make it easier to capture specific
    values in a field. In this allows you to capture cleaner data to analyze.

    For example, you can add a Spinner control to scroll up and down to the appropriate
    numeric value for a cell, or you can add a list box containing the values that
    a user can select for a cell.


    Excel provides nine different controls that you can add to a worksheet. You add
    the controls by selecting them from the toolbar then you specify the desired control
    size. Excel can choose its size by drawing the edges. You can also use the controls
    on the Forms toolbar to add controls to a Chart sheet.


    When or add a control to a worksheet, Excel is in design mode. In this mode, you
    may modify the


    properties and size of a form control, but you cannot test out its functionality.
    The design mode allows you to format the control that you have selected.


    When you place a control on a worksheet, it sits on top of the worksheet. You
    can size it so it appears to be located in a specific cell, but it is actually
    separate from the cell. Because the controls are separate from the actual worksheet
    cells, you can place them anywhere. A control can cover any portion of a cell
    or range of cells.


    After adding controls to a worksheet, you must specify the cells containing data
    values for that control. See the section "Specify Values for a Form Control" for
    more information on specifying controls.


