  md: '# EXCEL DATA ANALYSIS


    # DECLARE A VARIABLE


    You can use variable declaration to make your code run more efficiently. Variable
    declaration means that you specify the data type of the variable when you declare
    it. For example, if you intend for the variable to contain only integer values,
    you declare an integer.


    You can select the Require Variable Declaration option in the Editor dialog box
    in the Visual Basic Editor to ensure that variables are always declared for all
    created procedures. If you select this, Visual Basic Editor places the Option
    statement at the top of each module.


    Unlike some languages, VBA enables variables that have not been declared. However,
    if you misspell a variable within your code, VBA may treat the misspelled variable
    as a totally different variable. For example, if you use the variable MThkent
    and inadvertently type it as Mnthent, MThkent and Mnthent are different variables.
    To ensure variables are properly declared, use the Option statement as the first
    statement in a module before you type your code.


    Even if a variable is declared, you should also assign a data type to it as of
    declaration. VBA treats variables without a data type as variants. Because VBA''s
    default data type is variant, the same variable can contain an integer value at
    one point and a string value at another location. Because VBA is forced to interrogate
    the variable in the variables to determine the type of data, code becomes less
    efficient when you do not specify the data type.


    # DECLARE A VARIABLE


    ![](img/b1f17ae2919b92b22fb561904c497d03_193_0.png)


    +   1. Type Option Explicit at the top of the module.

    2. Position the cursor after the Sub statement.

    3. Type Dim.

    4. Type the name of the variable.

    5. Type As the variable name.

    6. Type your variable type.


    180'
