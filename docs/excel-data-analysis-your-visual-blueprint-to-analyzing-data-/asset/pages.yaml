  md: '# EXCEL DATA ANALYSIS


    # CUSTOMIZE FORMnCONTROLS WITH MACROS


    You can assign macros to any of the controls on a worksheet to perform custom
    functions to save time and effort when analyzing data. For example, if a user
    selects a Checkbox control, you can have Excel specific cells.


    The portion of the macro following the underscore character corresponds to an
    action, commonly referred to as an event, which occurs to the control. For example,
    with an OptionButton, the user clicks the radio button to select the option, so
    the event is Click. If you create a macro for a ComboBox, the event assigns to
    execute the macro when the value of the control changes. You use the event of
    the macro to tell Excel the control and execute the macro when a user clicks it.


    You can create one macro for each worksheet. You may create another macro by recording
    a series of keystrokes using a VBA procedure in the Visual Basic Editor. When
    you select the Assign Macro menu, Excel automatically creates a new name for the
    macro and you can edit the event, such as Click. Excel assigns the control name
    to the control when you add it to a worksheet. The first OptionButton that you
    add to a worksheet is the option name OptionButton. If you create a macro for
    the option, Excel gives the macro name OptionButton.


    No matter what you select — recording or writing VBA Excel assigns the same name
    to the macro. See Chapter 9 for more on creating macros.


