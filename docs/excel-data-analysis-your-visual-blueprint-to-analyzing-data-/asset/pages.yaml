  md: '# EXCEL DATA ANALYSIS


    # RANK A VALUE WITHIN A DATA LIST


    If you want your analysis to rank the values within a data list, you can accomplish
    this using the RANK worksheet function. For example, you can determine how a sales
    person''s total sales rank in comparison to other people.


    The RANK function has three arguments, of which the first two are required. The
    order argument is optional.


    ```

    =RANK(number, ref, [order])

    ```


    The number argument specifies the number you want to rank. Keep in mind if the
    list contains the same name, numbers are assigned the same rank. For example,
    if you have the list 4, 5, 6, 8, 9, the number 6 has a rank of 3, but the 8 has
    a rank of 2 because 6 appears in the list twice. The ref argument specifies the
    list of numbers you want to use for ranking. Excel ignores any non-numeric values
    in the list.


    The order argument specifies the sorting order used to rank the number specified
    by the number argument. The value of the order argument can be any number: a positive
    number sorts descending order, and a negative number sorts ascending order. If
    the order is 0, or omitted, Excel ranks the number as if the list were sorted
    in descending order. This means Excel excels at showing how the number compares
    to the largest numbers in the list. For example, if your list contains 35, 56,
    97, 23, and 31, and you want to rank the number 35 in descending order, the RANK
    function returns 3. If the order argument is not anything, Excel ranks the number
    as if it were listed in descending order.


    Excel also has a Rank and Percentile Add-in. For more on, see Chapter 11.


    # RANK A VALUE WITHIN A DATA LIST


    ![](img/b1f17ae2919b92b22fb561904c497d03_93_0.png)


