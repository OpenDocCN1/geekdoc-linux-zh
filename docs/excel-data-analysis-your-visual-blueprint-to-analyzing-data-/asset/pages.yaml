  md: '# EXCEL DATA ANALYSIS


    # # LOOK UP A VALUE IN A SPECIFIC ROW AND COLUMN


    If part of your data analysis locates a specific value within a row or column
    of a data list, you should consider Excel''s lookup functions. Excel provides
    two functions you can use to locate a value in either a row or column: HLOOKUP
    and VLOOKUP. The function you select is based on whether your data list contains
    headings in the first row, or first column.


    You use the HLOOKUP function when you have headings in the row of the data list.
    Excel locates the specified column, based upon the column heading and returns
    the value in the specified row. The HLOOKUP function has four arguments which
    requires the first three.


    The lookup_value argument identifies the column heading for the desired row. You
    can make the value text, or even a logical value. Excel does not differentiate
    between uppercase and lowercase. The table_array argument identifies the range
    of cells containing the data list. Excel uses the first row as the heading row.
    The row_index argument specifies the number of row within the data list to return.
    Excel returns the second row of the data list, not the second row in the worksheet.
    The range_lookup argument defines whether you want an exact or the closest match.
    If the value is False, Excel only returns an exact match. If True, Excel returns
    the value that is less than.


    ```

    HLOOKUP(lookup_value, table_array, row_index, [range_lookup])

    ```


    Although the following example illustrates the use of the HLOOKUP function, VLOOKUP
    works with the same except that it makes based upon a row in the first column
    of the data list.


    ![](img/b1f17ae2919b92b22fb561904c497d03_87_0.png)


    # LOOK UP A VALUE IN A SPECIFIC ROW AND COLUMN


    ![](img/b1f17ae2919b92b22fb561904c497d03_87_1.png)


    +   1. Open a worksheet that contains the data list you want to search.

    2. Select the formula cell.


    +   3 Click Insert Function.

    The Insert Function dialog boxes.

    4 Select the HLOOKUP function.

    To locate a value based upon a row heading, select the VLOOKUP function.


    +   5 Click OK.

    The Function Arguments dialog box displays.

    Note: See the "Add a function via the Insert Function Dialog Box" for more information.


    ![](img/b1f17ae2919b92b22fb561904c497d03_87_2.png)'
