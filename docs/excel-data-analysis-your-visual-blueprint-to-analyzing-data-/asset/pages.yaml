  md: '# CREATING FORMULAS


    # Apply It


    To quickly find a value in a data list when you do not want to manually create
    a formula, you can use the Lookup Wizard which allows you to find a value based
    upon the row and column headers. By selecting a row and column heading, Excel
    creates a formula that returns the intersection. The Lookup Wizard is available
    as part of the Add-ins that can come with Excel. See Chapter 11 for more information.


    After you load the Lookup Wizard Add-in, you can click Tools > Run it. The Lookup
    Wizard consists of four steps, or pages. On the first page, you specify the range
    of cells you want to search. On the second page you select the appropriate column
    and row labels. This works best if you have unique row and column labels. If you
    have duplicate row or column labels, the Wizard may return the wrong value.


    Next, you specify the cell''s location. Excel creates a formula with the INDEX
    and MATCH functions, as illustrated in the following sample. The MATCH function
    returns the row_name and column_number value for the INDEX function.


    ```

    Example:

    =INDEX(B1:F20, MATCH("Andrews",B1:B20), MATCH("Amount",B1:F1))

    ```


