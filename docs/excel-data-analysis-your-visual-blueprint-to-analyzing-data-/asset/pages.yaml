  md: '# APPENDIX


    # FORMULA BASICS IN EXCEL (CONTINUED)


    # FUNCTIONS


    Functions provide an invaluable means of analyzing data in Excel because they
    are pre-built formulas. Instead of writing a complex formula, you can use a function
    to perform a specific task, such as calculating an average, retrieving a value
    from a database, or performing a comparison. For example, the AVERAGE function
    determines the average of the numbers in a range of cells, such as `AVERAGE(A1:A15)`.


    You must provide the appropriate arguments for the function. Arguments are the
    values you must provide for the function to return the result. For example, if
    you select the FV function to determine what the future value of an investment
    is, you must specify the interest rate, number of payments, payment amount, present
    value, and future value, such as: `FV(Rate, Nper, Pv, Type)`.


    # Built-in Functions


    You can use Excel''s built-in functions to analyze your data. You can enter the
    function name into your equation, or you can insert via the Insert Function dialog
    box. See Chapter 4 for more information.


    The Insert Function dialog box has various functions that are listed in the following
    table. See Appendix B for a complete list of the available Excel functions.


    | Category | Description |

    |---|---|

    | Financial | Provides financial calculations such as the depreciation of an asset
    or the interest rate on security. |

    | Date & Time | Use these functions to compare dates, retrieve times from the
    system clock, or even return a portion of a date or time. |

    | Math & Trig | Performs mathematical and trigonometric calculations such as the
    cosine of a value or a random number calculation. |

    | Statistical | Performs statistical calculations as as variance within a list
    of values. |

    | Lookup & Reference | Allows you to search for reference values within your workbook,
    as creating references to specific cells or finding the location of a value. |

    | Database | Allows you to interface with lists or databases in your workbook.
    |

    | Text | Allows you to manipulate text, such as changing the capitalization of
    a text label. |

    | Logical | Performs comparisons and returns a value of True or False. For example,
    use the AND function to determine if two expressions are equal, such as `=AND(A1,
    A2)`. |

    | Information | Returns information from your worksheet and your computer system.
    For example, `=ISODD(A1)` if a cell contains an odd number, and `=ISBLANK(A1)`
    if the cell is empty. |


    # Add-in Functions


    The Analysis ToolPak, an add-in, can grant your ability to analyze data by extending
    Excel''s built-in functions. When you load this, you receive additional functions
    in the Financial, Date & Time, Math & Trig, Statistical, and Information categories.
    Excel also adds a function called


    Engineering, which provides functions such as converting decimal to binary or
    hexadecimal, or working with complex numbers. See Chapter 11 for information on
    installing add-ins. See Appendix B for the list of the Engineering functions added
    with the Analysis ToolPak.


    272'
  merge: -1
