  md: '# EXCEL DATA ANALYSIS


    # # CREATE A CUSTOM TEMPLATE


    If you frequently create worksheets with the same layout, such as a weekly stock
    analysis report, you can make a template to eliminate repetitive tasks. Templates
    provide a desired layout with specific styles, border settings, headers, footers
    and even text and images, such as a company logo.


    You create a template by designing a generic workbook that contains the worksheets
    you want and change any aspect of it to suit your needs. You can create custom
    styles, number formats, customized macros and formulas. You can also create custom
    headings in a template. Each month, if example you generate a budget worksheet
    for summing the totals. See the sections "Create a Custom Number Format" and "Create
    a Named Style" for information on creating styles and number formats. See Chapter
    4 for information creating formulas and Chapter 9 for more macros.


    Your custom template can contain settings for the entire workbook. For example,
    if you only want the workbook to contain one worksheet, you simply remove the
    other before saving your template.


    You can now save your generic workbook as a template. As the Save dialog box,
    you must replace the (.xlt) option in the Save Type field. This may also appear
    as Template. When you do so, Excel specifies a default storage location to save
    them:


    ```

    C:\Documents\Settings\user_name\AppData\Microsoft\Templates

    ```


    Your drive letter may, and you must replace user_name with the username you use
    to log in Windows. You should allow Excel to store your workbook in the default
    location. This ensures that the template appears in the General tab of the Templates
    dialog box when you create a new workbook.


    # CREATE A CUSTOM TEMPLATE


