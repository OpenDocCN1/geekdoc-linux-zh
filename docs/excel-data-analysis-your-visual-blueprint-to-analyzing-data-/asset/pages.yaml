    For example, if you create a new column containing Landscape expenses, you can
    create a new data series on the chart.


    If you expand a data range to include an additional series, Excel automatically
    creates a new data series. You can customize your data series name or range in
    the Series tab.


    Excel allows you to add a maximum of 255 data series to the most of chart types.
    The only exception is the pie chart, which only allows you to use one data series.
    If you create a chart using multiple data series, Excel ignores all but the first
    data series. For more about this see the section "Chart Basics."


    Excel groups related data together in a data series. Typically, a data series
    refers to the data that appear in rows or columns in a worksheet. If you chart
    your


