  md: '# EXCEL DATA ANALYSIS


    # CREATE LABEL RANGES


    You can automatically have Excel the column or row labels as names for your worksheet.
    This eliminates time to manually create a range for each column or row in your
    data. Excel creates names based on the labels in the top, bottom row, left column,
    or right column within the range. If your worksheet contains office expenses for
    an entire year, you can create names for monthly expenses. Excel creates the range
    name from the column labels.


    rows contain the corresponding data values, you must select both the labels and
    the data values. When you activate this option, Excel creates a separate range
    name for each label within the range of selected cells.


    If you have labels in the top row and the left column, and you select the top
    row only, Excel only creates names for the top row. For both the top row and left
    column, you must select both in the Create Name dialog.


    In the Create Name dialog you must first select the range of cells containing
    both the labels and the cells for the named ranges. For example, if your top row
    contains the column name for the remaining


    Although you use your worksheets to create the range, only the selected cells
