  md: '# EVALUATE WORKSHEET DATA 3


    # # Extra


    The Subtotal option actually inserts the SUBTOTAL function in each summary row
    in the form of a formula, which automatically updates whenever you modify a value
    in the data records. You can make modifications to each function to alter the
    summary range or function. See Chapter 4 for information on formulas.


    If you want to remove all subtotals from your worksheet, click Data > Subtotals
    to display the Subtotal dialog box. Click Remove All button removes the subtotal
    and final total rows from the worksheet.


    The first argument of SUBTOTAL function defines the function that summarizes the
    data records. Excel uses numbers between 1 and 11 to identify the functions in
    the following order: **Average, Count, Num, Min, Product, StDev, StDevP, Sum,
    Var, and VarP**. The second argument specifies the range of cells to subtotal.
    The following formula performs the subtotal, and uses 9 in the first argument
    to correspond to the Sum function:


    ```

    =SUBTOTAL(9,B3:B10)

