  md: '# EXCEL DATA ANALYSIS


    # SUM CELLS WITH THE AUTOSUM BUTTON


    You can apply the AutoSum to quickly summing cells in a worksheet. The AutoSum
    button helps automatically create a SUM function in the active cell. The range
    of cells includes a cell that is adjoining the active cell.


    In the worksheet, Excel draws a blue colored border around the cells that it will
    join together. You can include more or less cells. If you modify the selected
    range of cells, adjoining the cell to the formula must remain part of the selected
    range. For example, if the range of cells must include either D10 or C11 because
    both of these cells join D11. You can also modify the range by simply typing a
    new formula.


    When you activate the AutoSum, Excel examines the cells values and determines
    which cells located to the left of the active cell or above the active cell. For
    example, if D1 through D10 contain a list of numbers and you select the AutoSum
    button, Excel creates a formula to sum the cells in D1 through D10, and places
    the formula in D11.


    After you specify the range to sum, you can accept or reject your entries using
    the Enter or Cancel buttons. The result of the formula appears in the selected
    cell, and Excel moves to the next cell. If you are not familiar with building
