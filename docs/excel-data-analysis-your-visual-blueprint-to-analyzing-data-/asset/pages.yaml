    chart type with your PivotChart, you should preview the new chart type from the
    Chart dialog box. By choosing PivotChart, Excel creates a sample chart using the
    data from your PivotChart.


    When switching to a different chart type, by default Excel maintains any applied
    formatting. For example, if you have modified font types, colors, and so on, Excel
    applies those options to the new chart. If you want to use the formatting of the
