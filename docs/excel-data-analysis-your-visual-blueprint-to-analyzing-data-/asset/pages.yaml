  md: '# EXCEL DATA ANALYSIS


    # ADD A CALCULATED ITEM


    To insert an item in a field that was not part of the original source data, you
    can create a calculated item.

    A calculated item contains a user-created formula to determine the value of the
    item in a particular field. You can create a calculated item by adding a new item
    to a field and defining a formula that calculates the individual values for that
    item.


    You create an item on the Insert Calculated Item dialog box. When you display
    the dialog box, Excel shows where it will add the calculated item as part of the
    dialog title. For example, if you select the Sales field or coloring, the title
    of the dialog box is "Sales Item"


    You can use any of Excel formulas to create the formula for the calculated item.
    This includes using built-in functions and mathematical operators, as +, and /.
    If you use a built-in function, you make


    your arguments the constant value or field items listed in the Items list box.
    You cannot use cell references or range names within a formula for a calculated
    item. See Chapter 4 for more information on creating formulas. For example, you
    may follow the formula to calculate a Maintenance fee for computer hardware:


    ```

    =Hardware = 0.0125

    ```


    You can create multiple items for each field. Each item that you display as a
    row or column on the PivotTable. As you create new items, Excel adds them to the
    list for the corresponding field. A calculated item acts as an argument in the
    formula. For example, you can determine the total amount earned for hardware and
    maintenance fees:


    ```

    = Hardware + Maintenance

    ```


    ![](img/b1f17ae2919b92b22fb561904c497d03_151_0.png)


    +   1 Select an item from the field where you want to add an item.


    +   2 Click PivotTable+ Calculated Item.


    +   - The Insert Calculated Item dialog box displays.


    +   3 Type a label for the calculated item.


    +   4 Type the formula for calculating the item values.


    +   - You can add an item to the formula by selecting one in the items list and
    clicking Insert Item.


    +   5 Click Add.


    See Chapter 4 for more creating formulas.


    138'
