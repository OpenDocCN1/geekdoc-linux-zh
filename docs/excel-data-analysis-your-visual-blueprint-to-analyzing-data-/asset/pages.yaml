  md: '# EXCEL DATA ANALYSIS


    # CHANGE THE CALCULATION OF A DATA FIELD


    When you create a PivotTable report, Excel performs summarizing data that appear
    in the Data area. For example, if the cell contains all sales in Arkansas during
    January, Excel determines the cell value by summing the sales totals from different
    sales points, Excel totals all of them and places them here.


    When you change the function, the Data area reflects the selection. For example,
    if the selected function is Count and the field in the Data area is Amount, the
    name of the Data area becomes Count.


    You can change your data to something other than the default Sum function. Excel
    lets you select different functions to summarize the original data, such as counting
    values or finding the maximum value. For example, if you selected the Count function,
    cell contains representing the number of values in the original data. If you had
    four amounts for Arkansas, the cell contains not the total amount:


    You can also customize the function by adding some calculation options on the
    PivotTable dialog box. For example, you can determine what percentage is a sum
    by counting the total with the % function of calculation.


    Some of the calculations options require more information about the calculation.
    You must define the field you want to use for the calculation as well as the value
    for the field. For example, to determine the difference between the current month
    and the previous month sales, select the Month field and Previous in the Base
