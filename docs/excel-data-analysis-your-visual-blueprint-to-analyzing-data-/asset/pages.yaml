    +   * You can place values in a row.


    +   * Type the formula in the first cell of the next column.


    +   * If your values are in a row, type the formula in the first cell in the row
    under values.


    +   * Select the cells containing substitution values and the formula.


    See Chapter 1 for more on selecting cells.


    +   * Click Data Table.


    70'
