  md: '# HOW TO USE THIS BOOK


    Excel Data Analysis: Your blueprint for creating and analyzing data, charts, and
    PivotTables uses simple, straightforward examples to teach you how to create powerful
    and dynamic programs.


    To get the most out of this book, you should read each chapter in order, from
    beginning to end. Each chapter introduces new ideas and builds on the knowledge
    learned in previous chapters. When you become familiar with Excel Data Analysis:
    Your blueprint for creating and analyzing data, charts, and PivotTables, you can
    use this book as an independent reference document.


    Courier Font


    Indicates the use of Visual Basic for Applications (VBA) code such as tags or
    attributes, scripting language code such as statements, operators, or functions,
    and Excel Object Model code as objects, methods, and properties.


    Bold


    Indicates information that you must type.


    # Who This Book is For


    If you are interested in creating worksheets that analyze your data so that you
    can accurately interpret results, Excel Data Analysis: Your blueprint for creating
    and analyzing data, charts, and PivotTables is the book for you.


    This book is geared toward someone who is learning the skills necessary to become
    a data analyst. It is also ideal for the data analyst who wants to learn more
    advanced analysis techniques. An intermediate to experience with the Microsoft
    Windows operating system and Excel is required.


    Itics


    Indicates a new term.


    # Apply It


    Apply It section usually contains a segment of code that takes the lesson you
    learned one step further. Apply It sections offer inside information and pointers
    that you can use to enhance the functionality of your code.


    # What You Need to Use This Book


    To perform the tasks in this book, you need a computer with Windows 98, ME, NT
    4000, or XP, installed, as well as Excel 2000 or 2002. You do not require any
    special development tools, because all the tools are part of Excel.


    # Extra


    An Extra section provides additional information about the task you accomplished.
    Extra sections often contain interesting tips and useful tricks to make working
    with Excel macros even more efficient.


    # The Conventions in This Book


    A number of typographic and layout styles have been used throughout Excel Data
    Analysis: Your blueprint for creating and analyzing data, charts, and PivotTables
    to distinguish different types of information.


    # The Organization of This Book


    Excel Data Analysis: Your blueprint for creating and analyzing data, charts, and
    PivotTables contains 11 chapters and five appendices.'
  merge: -1
