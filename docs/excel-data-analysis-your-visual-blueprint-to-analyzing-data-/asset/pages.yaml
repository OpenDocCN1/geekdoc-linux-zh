  md: '# EXCEL DATA ANALYSIS


    # ADD A CALCULATED FIELD


    If your data analysis requires special calculations. If you can include a field
    that contains a calculation based on other fields or customized values in the
    PivotTable, you can create a calculated field. A calculated field is inserted
    as an row or column containing a formula. For example, you can create a calculated
    field to determine the amount of commission paid for each type of sales. The formula
    uses the value of Sales and multiplies it by the commission amount, similar to
    the following:


    ```

    = (Sales * .10)

    ```


    When you use the standard Excel formula options on the Insert Calculated Field
    dialog to create the formula for the calculated field. This includes built-Functions
    and mathematical operators, such as +, -, and /. If you use a built-in function,
    you must make your arguments constant values or any of the Pivot report fields
    in the


    Fields box. You cannot use cell references or range names within a formula for
    a calculated field.


    You can create multiple calculated fields for each PivotTable report. Each field
    that you create displays a separate Data field. As you create new calculated fields,
    Excel also deems you can only place them in the Data area. You can use a calculated
    field as an argument in a new calculated field. For example, you can determine
    the total earnings by subtracting the commissions from the sales:


    ```

    = Amount - Commission

    ```


    Although the calculated fields look like any other field, and in the PivotTable
    list once you create them, you cannot move them to the Page, Row, or Column areas.
    For more on the different areas of PivotTable, see the "PivotTable Basics" - A
    View of the Pivot Report Fields.


    # ADD A CALCULATED FIELD


    ![](img/b1f17ae2919b92b22fb561904c497d03_149_0.png)


    +   1 Select a cell within the PivotTable report.


    +   2 Click Insert > Calculated Field


    +   The Insert Calculated Field dialog displays.


    +   3 Type a label for the calculated field.


    +   4 Type the formula for calculating the field values.


    +   You can add a field to the formula by selecting one from the Fields list and
    clicking Insert Field.


    +   5 Click Add.


    Note: See Chapter 4 for creating formulas.


    136'
