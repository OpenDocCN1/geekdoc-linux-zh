    # COMPARE THE VARIANCES IN TWO GROUPS OF DATA


    If you want to compare the variances between two groups of data, you can use the
    F-Test for Variance tool in Excel. *Variance* is a measurement of how much a group
    of numbers varies from the group''s mean. For example, you might have two plants
    producing the product, one in Indiana and one in Texas, that have efficiency levels
    of 95%, but you want to know which more consistently performed throughout the
    year. When you calculate the variance of each plant''s efficiency you that the
    Indiana plant has a lower variance than Texas, therefore more efficiently performed
    throughout the year.


    groups to the MS within the groups. If the F statistic is less than the F critical,
    you cannot reject the null hypothesis that the variances of the two groups are
    the same. An F statistic close to 1 indicates that two groups have equal variances.


