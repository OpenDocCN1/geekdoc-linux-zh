  md: '# EXCEL DATA ANALYSIS


    # REQUEST USER INPUT FOR A MACRO


    You can use the InputBox function to prompt for specific user input during execution
    of a procedure. The InputBox function displays a dialog requesting input and returns
    the user response. You capture your response by assigning the results of the InputBox
    function to a variable.


    You can display a default value of Microsoft Excel. The optional Default argument
    specifies the default value to display in the text box in the dialog box.


    You specify the position of the dialog box using the optional arguments xPos and
    yPos. If you omit them, the dialog uses units of measurement called twips. One
    tw equals one-fourteenth of an inch. The XPos argument indicates the distance
    from the left side of the screen to the dialog box. The yPos indicates the position
    from the top of the screen to the dialog box.


    The InputBox has different arguments, but only the first are required: Prompt,
    Title, Default, xPos, yPos, HelpText, and Context. The Prompt argument indicates
    the string you want to display on the dialog box. You can make this by using a
    text string enclosed in quotes or by using the concatenation operator (& in this
    example: InputBox("Sum: " & Sum))


    You can specify two optional arguments for adding help to the dialog box. Help
    specifies the name of the help file, and Context specifies the context ID of the
    help to display. If you specify one, you must specify both.


    The Title argument contains the text that appears on the title bar of the dialog
    box. If omitted, Excel


