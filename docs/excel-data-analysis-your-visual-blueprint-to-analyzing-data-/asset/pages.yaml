  md: '# Extra


    Excel creates the conditional sum statement by combining a SUM function with a
    nested IF statement. You may find it a little confusing to interpret the function
    if you want to modify it. The nested IF statements mean the Number1 argument of
    the SUM function. For example, Excel creates the formula for a list where the
    conditions are over $50,000 and State equals:


    ```

    =SUM(IF($D$2:$D$20="Texas",IF($F$2:$F$20>50000,$F$2:$F$20,0),0))

    ```


    This example first checks if the value of the record in column D "Texas". If the
    first condition is True, the second statement checks if the value in column F
    is greater than $50,000. If both conditions are True, Excel adds the value in
    column F to the sum and repeats the process for the next row in the range. If
    either value in the row does not match the condition, Excel adds a value of zero
    to the sum. See Chapter 4 for more information on creating conditional statements.


    ![](img/b1f17ae2919b92b22fb561904c497d03_232_0.png)


