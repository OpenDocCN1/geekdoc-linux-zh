    +   Select the range of cells containing the list to sort.


    Note: See Chapter 1 for information on selecting a range of cells.


    +   Click Data Sort. The sort dialog box displays.


    +   To sort columns, click the down arrow and click the desired column.


    +   If desired, click Descending to change the sort to descending order.


    +   Click OK.


