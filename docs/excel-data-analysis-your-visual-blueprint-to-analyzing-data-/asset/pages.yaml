  md: '# EXCEL DATA ANALYSIS


    # CHANGE THE LAYOUT OF A PIVOTABLE


    PivotTables work for data analysis and allow you to quickly add, move, and remove
    fields from the report, thus quickly changing the values in data. If you have
    created the layout of a PivotTable, you can quickly drag the fields to different
    locations. For example, you can move the fields in the section to the column area,
    Excel add additional fields to the Column area, You can also change the layout
    of the PivotTable by adding more fields to the Row or Column sections.


    You can move any fields on the PivotTable report area to another. When you move
    a field, the filter selections remain for the same field. If you are only viewing
    values for the months of January and February and you move the Month field to
    the Column area, the selection for the field January or February remains the same.
    Select the "Field A" for more information on moving fields.


    Add new fields to the PivotTable List. The PivotTable List displays all of the
    fields that were part of the PivotTable when you created it. If you add a field
    to an area of report that contains a field, the new field becomes a sub-category
    of the original field.


    When you add fields to a PivotTable chart, a thick line identifies the location
    where you drag it. If you drag the field to the Row area, Excel inserts the new
    field to the left of the line. If you drag the field to the Column area, Excel
    adds the new field below the line. For more information about the elements of
    a PivotTable, select "PivotTable Basics."


