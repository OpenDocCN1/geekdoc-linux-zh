  md: '# EXCEL DATA ANALYSIS


    # ADD A SERIES TO A LIST


    You can quickly create a series in a list and avoid repetitive entries by using
    the Fill Handle. A series is simply a list of values that are either the same
    value or are increased by the same value. For example, you can have series of
    dates as January 1, 2003, February 1, 2003. A series of numbers can increment
    by adding, subtracting, multiplying, or dividing by the same value. For example,
    2, 4, 6 is a list of numbers that increments by 2. For more information, see the
    section "Create a List."


    creates the remaining series. If the cell contains a numeric value — also known
    as a label — Excel simply repeats it in the specified cells. If you provide a
    date, Excel increments the date based on its format. For example, for a date that
    contains a day, such as 24/12/2002, Excel increments the days by one. If the cell
    contains only the month, Excel increments the months by one.


    Excel calls the black square at the bottom-right corner of the selected range
    of cells the *Fill Handle*. When you drag this handle down or to the right, Excel
    uses the values in the originally selected cells to create the series in the expanded
    range of cells. As you drag across each cell, Excel will place the value in each.


    Excel creates a series when you present one value, to ensure your series properly
    increments, you must provide both the first and second values in the series. Excel
    assesses the values, the pattern, and


