  md: 'The first chapter, "Getting Started," introduces you to various data analysis
    options. You learn how to select a range of cells, how to use named ranges, label
    ranges, and styles, as well as how to create a custom template.


    Chapter 2, "Organize Worksheet Data," shows you how to add, sort, customize and
    consolidate your data. In this chapter, you learn how to create Excel lists, how
    to create, customize


    Chapter 3, "Evaluate Data," helps you learn how to apply formatting, sorting,
    and filters. It also includes tasks on validating data and creating scenarios.


    The fourth chapter, "Creating Formulas," builds simple and complex formulas with
    the insert function box. It also shows you how to use the Solver, and create a
    conditional formula.


    In Chapter 5, you learn all about external data, including how to properly copy
    and import it, as well as how to work with database queries and the DAVERAGE feature.


    Chapters 6 through 8 show you how to optimize the presentation of your data with
    charts, PivotTables, and PivotCharts.


    In Chapter 9, you learn how to use VBA to create macros. In Chapter 10, you find
    out about all forms and form controls, and in Chapter 11, you learn all many useful
    Add-ins that Excel provides.


    The five appendices include Keyboard Shortcuts, an Excel function reference, a
    VBA Quick Reference, and a section on formulas for those not familiar with Excel.


    # What''s on the CD-ROM


    The CD-ROM included in this book contains the sample files for the book as well
    as trial versions of FinOptions XL 2.0, Sigma XL 1.1, UNISTAT 5.5, and 4TOPS Data
    that you can work with *Excel Data Analysis: Your visual for creating and analyzing
    data, charts, and PivotTables*. An e-version of the book is also available on
    the disc.'
