    # 将 Oracle 数据库从 z/OS 迁移到 Linux for System z


    Oracle 始终声称 Oracle 就是 Oracle。无论 Oracle 运行何处，它都具有相同的功能。随着使用 Linux for System z
    的趋势，我们发现展示数据库从 z/OS 迁移到 Linux for System z 的 Oracle 的将非常有帮助。


    本章详细介绍了将应用程序数据库从 system z/OS  Oracle 迁移到 Linux for System z  Oracle 的过程。z/OS 数据库使用
    EBCDIC 编码，而 Linux for System z 数据库使用 ASCII 编码。


    # 10.1 将您的 Oracle 数据库从 z/OS 迁移到 Linux for System z


    要迁移数据库，可以使用许多工具，例如传统的导出/导入、RMAN、Data Pump 导出/导入以及一些第三方工具。我们决定使用 Oracle Data Pump，因为这比使用传统的导出/导入实用程序更快。


    由于需要进行 EBCDIC 到 ASCII 的转换，可传输表空间并不是一个选项。这就是 Oracle on z/OS 不支持可传输表空间平台的原因。


    # 10.2 使用 Data Pump


    Data Pump 导出和导入的设计相比原始的导出和导入实用程序极大提升了移动性能。关于如何使用 Data Pump 的信息位于《Oracle Database
    Utilities, B10825-01》。


    Data Pump 导出和导入实用程序（分别通过 `expdp` 和 `impdp` 命令调用）与原始的导出 (exp) 和导入 (imp) 实用程序具有相似的外，但它们是完全独立的。由新的
    Data Pump 导出工具生成的转储文件与原始导出工具生成的转储文件不兼容。因此，由导出 (exp) 程序生成的文件无法使用 Data Pump 导入 (impdp)
    程序导入。


    Oracle 建议您使用新的 Data Pump 导出和导入实用程序，因为它们支持 XML Schema 之外的所有 Oracle Database 10
    功能。原始导出和导入支持 Oracle 数据库 9.2 的全功能集。


    我们所做的练习是将位于 z/OS Oracle 上的数据库迁移到 Linux for System z。该数据库用于一个 Web 应用程序的 Oracle
    数据库。


    我们首先在 System z/OS 上安装 Oracle。一旦安装好 Oracle，我们就为 Web 应用程序创建了数据库、用户和模式。


    我们执行迁移测试的步骤如下：


    - 1. 在 z/OS 上安装 Oracle 10g

    - 2. 创建数据库和表

    - 3. 填充数据库

    - 4. 准备 Data Pump 导出

    - 5. 运行 Data Pump 导出

    - 6. 将转储文件移动到新系统

    - 7. 在 Linux for System z 上安装 Oracle 10g

    - 8. 创建数据库

    - 9. 准备 Data Pump 导入

    - 10. 运行 Data Pump 导入

    - 11. 验证应用程序


    # 10.3 在 z/OS 上安装 Oracle 10g


    我们遵循《Oracle Installation Guide》和《Experiences with Oracle Database 10g on z/OS,
    SG24-7055》在 z/OS 上安装了 Oracle 二进制文件。在安装二进制文件并按照创建数据库（描述在《Experiences with Oracle
    Database 10g on z/OS, SG24-7055》第 5 章“Creating the Oracle Database”）之后，我们需要验证作业
    SQLORA13 是否成功运行。为了能够使用 Data Pump，Java 代码必须成功初始化。检查作业 SQLORA13 是否无错误地完成。


    # 10.4 创建数据库和表


    Data XML 导出使用 `DBMS_METADATA_UTIL` 包。该包需要安装 XML，XML 需要安装 JAVA。作业 SQLORA13 处理了这些需求。


    ```

