    ## 3.6 Summary


    The installation using the OUI is very easy and uncomplicated. However, to make
    sure that the installation is problem free, it is important that you complete
    all of the tasks to prepare for the environment correctly. This includes the kernel
    parameters, and so on. The most important task is to correctly install Linux and
    ensure that the correct Red Hat Package Managers (RPMs) are installed. If you
    follow the instructions above to install Red Hat and the Oracle Installation Guide
    to ensure that all necessary RPMs are installed, the installation should be smooth.


    Chapter 3. Installing an Oracle 10g2 instance 59


    If you are using SUSE Linux Enterprise Server 9, we used this process for the
    installation of Linux. We found that if you use this method, you should not have
    any RPM-related problems installing Oracle. We used YaST2 to perform a default
    installation of SUSE Linux Enterprise Server (Figure 3-28).


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_81_0.png)


    Figure 3-28 Linux default installation


    Using Oracle Solutions on Linux for System z


