- md: "\nIn virtualization strategies employing techniques that exploit features of\
    \ both the virtualized system (Linux) and the host system (z/VM) combine the best\
    \ of both worlds. Using facilities inherent in CP, CMS, and Linux facilitates\
    \ excellent methods of replication.\n\n## 7.3 Using FlashCopy so backups can be\
    \ managed by z/OS\n\nThis section describes one approach for managing backups\
    \ of Oracle databases.\n\nThe methods shown here are for EXT2 or EXT3 file systems.\
    \ If you are using the Oracle ASM file system, other considerations must be taken\
    \ into account. ASM issues are not covered in this section.\n\n### 7.3.1 Backups\n\
    \nThere are many approaches for backing up and restoring Linux virtual machines\
    \ on the IBM System server. This includes Linux file level backups through source\
    \ packages, VM backups through system utilities or vendor products, and backing\
    \ up from z/OS systems.\n\nWhile lacking capabilities, such as the ability to\
    \ perform Linux file level archiving, performing backups and restores with the\
    \ aid of a z/OS system is a popular choice among z/VM and Linux installations.\
    \ Many z/VM shops limited (or no) access to tape drives, tape vaults, or robotic\
    \ tape systems.\n\nMany z/VM and Linux installations have existing mainframes\
    \ running z/OS, complete with backup/restore software, procedures, and policies.\n\
    \nThere are two configurations of z/OS reaching out to the DASD owned by a z/VM\
    \ system:\n\n- 1. A z/OS LPAR is in the same CEC as the z/VM LPAR(s). The z/OS\
    \ LPAR would have access to the z/VM DASD through the coding of IOCDS.\n- 2. The\
    \ z/VM LPAR(s) and the z/OS LPAR are on separate CECs. In this case, the DASD\
    \ storage unit itself has dual cabled into both CECs. Each CEC has an IOCDS coded\
    \ to be configured to see the same DASD.\n\nA large client with Oracle virtual\
    \ machines utilizes a configuration of two, separate CECs. Figure 7-8 on page\
    \ 143 shows the architecture of the backup\n\n![](img/5b458d26d6ded58c4d2c82af59a3d71c_164_0.png)\n\
    \nFigure 7-8 Backup architecture\n\nThe steps of the backup are:\n\n- 1. A CMS\
    \ service machine in the z/VM LPAR issues console commands as the root user to\
    \ each Linux machine at a preset time from a remote system. The remote system\
    \ is a service LPAR.\n    - a. The service machine, SIGBKUP, is started by a timer\
    \ based program as WAKEUP.\n    - b. Using the CP secondary console input facility,\
    \ issue commands through the CP SEND command to each Linux guest that is to be\
    \ backed up.\n- 2. The Linux machine processes the console command PREFLASH. PREFLASH\
    \ is a bash script:\n    - a. Quiesces Oracle. Once a week, the database is stopped\
    \ with dbora stop. Other times, a hot backup is performed and the database is\
    \ stopped with the command alter database begin backup.\n    > Note: When quiescing\
    \ Oracle with alter database begin backup and the database spans multiple Cylinder\
    \ volumes using the ext3 file system, there is a small window for I/O inconsistency.\
    \ There is a slight chance that the database will not be restored to a good state.\
    \ However, using alter database suspend instead of alter database begin will provide\
    \ a clean environment in this situation.\n    - b. Issues the sync command several\
    \ times. The sync command is issued several times in each machine to ensure the\
    \ disks are updated. Linux will cache file updates in memory, and the sync command\
    \ can write any data buffered in memory out disk.\n- 3. The CMS server machine\
    \ on the service LPAR will now:\n    - a. Link to the full volumes of all DASDs\
    \ containing the Linux machine minidisks. Minidisks containing Oracle data for\
    \ production machines are backed up daily. Minidisks containing system data such\
    \ as executables are backed up less frequently (lower change rate).\n    - The\
    \ backups are done by pools of machines, that is, production, development, lab,\
    \ and so on.\n    - c. Link to the targeted part of the full volumes.\n    - c.\
    \ Perform a FLASHCOPY from the source volume to the target volume starting from\
    \ cylinder 1 to the last cylinder. Cylinder 0 is not required for the FLASHCOPY,\
    \ as no minidisks start on cylinder 0, and this way the volume label on the target\
    \ is preserved.\n\nA lookup is done for each minidisk belonging to the Linux machine,\
    \ and a list of full volumes is prepared. SIGBKUP links to the SYSDUMP1 minidisk\
    \ at virtual address 380E for the source, and 388E for the target. Example 7-13\
    \ shows the list.\n\n## Example 7-13 List of minidisks\n\n| VPCX81 380E | 3390\
    \ | SYSDUMP1 | 0 | 3338 | 3339 | FC380E | ZODNXX1 | CPCMS |\n| :--- | :--- | :---\
