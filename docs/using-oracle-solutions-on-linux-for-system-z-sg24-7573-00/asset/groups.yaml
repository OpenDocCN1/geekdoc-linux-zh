    Tools package as well. Figure 3-29 demonstrates how we accomplished those tasks.


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_82_0.png)


    Figure 3-29 Selecting C/C++ compiler. In this chapter, we explained how we installed
    Linux, either Red Hat or SUSE Linux, to ensure that there are no RPM problems
    when installing Oracle R12g. This does not mean that we are able to accomplish
    this task, but because in doing that we found our way to


    Chapter 3. Installing an Oracle R12g single instance 61


    ## Setting up Oracle RAC on Linux for System z


    Oracle Real Application Clusters (RAC) is a feature of the Oracle database that
    provides increased availability and scalability. On System z, the Linux guests
    using Oracle RAC can be on the same IBM System z9™ or on two z9s.


    The Oracle Clusterware, Oracle Binaries for RAC, and a RAC database are easy to
    install if the infrastructure is correctly set up. This chapter covers the items
    to consider when setting up the infrastructure. If this setup is successful, the
    cluster verify utility will work and the installation will be successful. The
    details of the installation of Oracle 10gr2 RAC are beyond the scope of this book.


    In this chapter, we cover:


    - IBM System Network Options for IP interconnect

    - IBM System z disk storage options

    - Disk formatting options

    - Setting up for ASM

    - Getting ready for Oracle installation and other sources of information


    ## 4.1 Introduction


    This document provides an introduction to the various network and disk storage
    options available for setting up an Oracle RAC system on a System z (a Linux/zVM
    system).


    This chapter introduces some of the options available for network configuration,
    disk storage, and performance tuning. Tips for setting up these configurations
    and best practices will be discussed. References to further detailed guides will
    also be provided.


    ## 4.2 Oracle 10g RAC on IBM System z network options


    10g RAC under z/VM has various options available for setting up the network infrastructure
    between nodes. These various network architectures can be on the same Logical
    Partition (LPAR), separate LPARs, or on separate IBM System z machines within
    the same sysplex.


    An LPAR is a division of processors, memory, and storage into multiple sets of
    resources, so that each set of resources can be operated independently with the
    operating system instance and applications.


    The IBM System z platform is the highest availability platform available for customers
    today. By virtue of moving to a IBM System z platform even without Oracle RAC,
    a higher level of availability and scalability can be achieved. When selecting
    the best infrastructure for installing Oracle RAC on IBM System z, the points
    of failure shown in Table 4-1 should be considered.


    Table 4-1 Points of failure


    | Single point of failure | Probability of failure | Cost to fix |

    |---|---|---|

    | System z hardware | Very Low | High |

    | LPAR | Very Low | Low |

    | z/VM | Low | Low |

    | Linux | Low | Very Low |

    | Disk Subsystem Microcode | Low | Medium |

    | Application | High | Very Low |

