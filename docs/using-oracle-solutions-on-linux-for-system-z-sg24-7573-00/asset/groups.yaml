    ## 11.4.2 Oracle 客户端


    WIN/XP 上的 Oracle 客户端需要选择并安装高级安全选项（Advanced Security Option），以便从 Oracle 客户端进行 RADIUS
    身份验证。


    使用 Oracle Net Manager 配置 Oracle 客户端使用 RADIUS 进行验证。从第 215 页图 11-1 所示的本地窗口，在下拉菜单中选择
    Oracle Advanced Security，选择“验证”（Authentication）选项卡，并将 RADIUS 从“可用方法”（Available
    Methods）面板移动到“已选方法”（Selected Methods）面板。


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_236_0.png)


    图 11-1 Oracle Advanced Security 窗口


    这将通过向 `SQLNET.AUTHENTICATION_SERVICES` 参数添加 RADIUS 来更新客户端的 sqlnet.ora 文件：


    # sqlnet.ora 网络配置文件：

    C:\pt849\rawin\NETWORK\ADMIN\sqlnet.ora

    # 由 Oracle 配置工具生成。

    SQLNET.AUTHENTICATION_SERVICES= (RADIUS,NTS)

    NAMES.DIRECTORY_PATH=(TNSNAMES, EZCONNECT)


    ## 11.4.3 LDBM 中的用户名和 SDBM 中的密码的 Oracle 客户端连接


    此时，Oracle 用户 icucser2 可以与 Oracle 数据库服务器进行正常连接，并由 z/VM LDAP 作为 FreeRADIUS 服务器的后端进行身份验证。所使用的
    `radius.conf` 文件位于第 209 页的示例 11-2 或第 210 页的示例 11-3，取决于是否允许匿名绑定。在此处的窗口中显示了 icucser2，它是为
    z/VM LDAP 原生身份验证设置的，这意味着它的密码在 RACF 中，而不是在 LDBM 目录中。icucser1 也有相同的窗口，其密码在 LDBM
    目录中。


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_237_0.png)


    在输入用户名、有效密码和 Oracle 连接字符串后，用户连接到 Oracle 数据库，如图 11-3 所示。


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_237_1.png)


    如果 icucser2 输入了错误的密码，将出现第 217 页图 11-4 所示的窗口。


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_238_0.png)


    ## 11.4.4 SDBM 中的用户名和密码的 Oracle 客户端连接


    Oracle 用户 icracf1 和密码 ldapxx 位于 RACF SDBM 数据库中。Oracle 客户端连接数据库时的唯一区别是使用了 icracf1/ldapxx
    代替 icuser1/icuser1x。主要区别在于启动 FreeRADIUS 时需要一个 `radius.conf` 文件，如第 210 页的示例 11-4
    所示。该文件中的参数设置允许 FreeRADIUS 使用 RACF SDBM 后端绑定到 zVM LDAP，并在 RACF 中搜索 icracf1 进行用户身份验证。


    ## 11.4.5 外部身份验证的 Oracle 参考


    - Oracle Database Security Guide 10g Release 2, B14266-01, 2005年6月

    - Oracle Database Advanced Security Administrator''s Guide, B14268-02, 2005年11月


