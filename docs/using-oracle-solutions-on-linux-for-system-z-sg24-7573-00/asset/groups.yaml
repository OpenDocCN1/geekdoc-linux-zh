    # Using WebSphere Application Server with Oracle 10gR2


    Chapter 11, "Using WebSphere with Oracle9i", in Experiences with Oracle for Linux
    on zSeries, SG24-6552, discussed WebSphere Application Server V4.0 using an Oracle9
    database as the repository for WebSphere Application Server. The WebSphere Application
    Server repository contains copies of the individual component configuration documents,
    but from WebSphere Application Server Version 5 onwards, the configuration information
    has been stored in XML files instead of in relational database. The application
    server''s Admin service is used to manage the configuration data in the XML files
    and to make sure it is consistent at runtime.


    To demonstrate the use of WebSphere Application Server with an Oracle database
    in this book, the IBM Trade 6 Performance Benchmark Application was installed
    with WebSphere Application Server V6.1 and the application was configured to use
    Oracle10.0.2.2 database. Trade 6 is a WebSphere Application sample application
    that is publicly available from IBM. The Trade 6 benchmark models an electronic
    stock brokerage application providing Web-based online securities trading. It
    is implemented as a 3-tier J2EE Web, utilizing an application server, a database
    server, and a Web server.'
  - '[PAGE 173]


    # 8.1 WebSphere Application Server V6.1, Oracle 10.2.0.2 DB, and the Trade 6 Performance
    sample application


    An existing Oracle database was used to install the Trade 6 application''s data,
    this chapter does not cover the database installation process that is described
    in Experiences with Oracle@ 10g2 Solutions on Linux for IBM System z, SG24-7191.
    The following steps are covered in this chapter:


    +   - Install IBM WebSphere Application Server V6.1, referred to as base.

    - Install IBM HTTP Server V6.1.

    - Install, configure, and execute IBM Trade 6 Application.


    # 8.2 Install WebSphere Application Server V6.1(base) and IBM HTTP V6.1


    Both the WebSphere Application Server and the IBM HTTP Web server were installed
    on the same Linux system, known as linux25. The Oracle 10.2.0.2 database was also
    installed on linux25. This configuration is sufficient for the feasibility demonstration
    here, but not recommended for production.


    The launchpad is the starting point for installing the WebSphere Application Server
    and the HTTP Web server. The launchpad is a Web application, a supported Web browser
    is needed to run it. The browser that was used for the installation on Linux for
    System z. Also, the installation was done as the root user.


    ```

    [root@linux25 ~]# /usr/bin/firefox -version

    Mozilla Firefox 1.5.0.3, Copyright (c) 1998 - 2006 mozilla

    [root@linux25 ~]# export BROWSER=/usr/bin/firefox

    [root@linux25 ~]# ./launchpad.sh

    ```'
  - '[PAGE 174]


    The launchpad program is in the root directory of the product disc or the downloaded
    image. The launchpad is named launchpad.sh on Linux for System z. Executing launchpad.sh
    results in the window shown in Figure 8-1.


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_174_0.png)


    Figure 8-1 Welcome window for WebSphere Application Server


    Chapter 8. Using WebSphere Application Server with Oracle 10g2 153'
  - '[PAGE 175]


    The actual installation is straightforward for installing the WebSphere Application
    Server and the IBM HTTP Server, but we should note two things. First, a prerequisite
    check failed with a warning message as the installer was checking for Red Hat
    Enterprise Linux 4 Update 2 and linux25 is at Update 5. Everything worked fine
    at the Update 5 level. Second, when the window showed in Figure 8-2 appeared during
    installation, we enabled administrative security.


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_175_0.png)


    Figure 8-2 Enable Administrative Security


    With administrative security enabled, the user name above must be added with the
    -password option and the password above must be added to get the command-line
    scripts startServer.sh, stopServer.sh, and wsadmin.sh to run successfully.


    Neither Application nor Java 2 security was enabled, but with administrative security
    enabled, the localOSUserID had to be added under both Users and Groups and Bus
    Security, as shown in the following WebSphere Application Server administrator
    windows. This enables the JMS API used by Trade 6 to work correctly. The default
    password for this ID is password and is also needed. If administrative security
    is not enabled, then adding this ID in the following steps is not necessary.


