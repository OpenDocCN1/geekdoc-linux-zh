    \ 1812。该项目中指定了 Radius Server 密钥（secret）。这是数据库和 FreeRADIUS 用于加密和解密在 FreeRADIUS\
    \ 和 Oracle 之间传递的 Oracle 密码的密钥。当 Oracle 设置外部身份验证时，该密钥将在后续章节提供。\n\n> 注意：关于 Radius\
    \ 密钥规范有多种描述，经过一些实验，才找到可以在 Oracle 数据库和 FreeRadius 之间正常工作的密钥。如果密钥超过 15 位，Oracle\
    \ 数据库与 FreeRadius 之间的加密/解密将无法工作。\n\n```\nclient = linux25.itso.ibm.com\n  secret\
    \ = testing123\n}\n```\n\n## 11.3.5 FreeRadius 配置 users\n\n第三个文件标识使用 FreeRADIUS\
    \ 的 Oracle 用户。当为用户选择外部身份验证时，用户账户由 Oracle 维护，但密码管理和用户身份验证由外部服务或此处结合 z/VM LDAP 服务器的服务完成。\n\
    \n```\nuser1\nuser2\n```\n"
