    #  4.2 Setting up disks between separate z9 machines


    Typically, when setting up disks between z9 machines, the first Linux guest owns
    the disks in read/write mode, while the second guest lists the disks in read/write.


    Because the Linux guests are on two different z9 machines, the directory entries
    for both virtual machines will use dedicated statements to define the devices
    being shared. For example, the first node would have DED 0340 1F91 in the directory
    entry to define the virtual 340 device, and the second node would have DED 0340
    2F91. It is important to let CP know that the physical devices are shared with
    another system. This is done through the system config file and andevice statement.
    Following is an example:


    ```

    Rdevice xxxx-yyyy Type DasD Shared Yes MDC OFF

    ```


    In this statement, xxxx-yyyy is the range of real device addresses that are shared
    between the two z9 machines. Because the devices are shared, we recommend making
    sure that each system does not cache any of the I/Os, so you should use MDC OFF.
    Having the devices dedicated means they are ineligible for a minidisk.


    Dedic to a virtual machine means that it is not available for any other virtual
    machine under z/VM image. It is not possible to mix minidisks and dedicated devices.
    In order to use minidisks, a device needs to be attached to the system. When a
    device is dedicated, it is attached to a particular virtual machine.'
  - '[PAGE 95]


    # 4.3.3 File system setup


    Oracle under zVM Linux has various options available for setting up the storage
    needed to run Oracle RAC. Several file system groups are required to run Oracle.
    These include:


    +   - Standard operating system disk(s) for each node in SUSE/Red Hat

    - Swap disk for each node in the cluster

    - Local disk for the Oracle Binaries, patches, and Oracle logs on each node

    - Shared disk between the Oracle RAC nodes for database files


    The standard operating system disk will require an additional 400 MB free /tmp
    to install. Typically, this should be a size of at least 2.1 GB.


    Figure 4-3 shows a sample RAC file system devices setup.


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_95_0.png)


    Figure 4-3 Sample RAC file system device setup'
  - '[PAGE 96]


    The first Linux guest node owns the disks in read/write mode, while the second
    guest links to the disks in read/write mode.


    # 4.3.4 Linux swapping recommendations


    Sizing Linux swapping on z/VM environments correctly is very important, or the
    performance of the system will diminish.


    Setting up a small virtual disk in storage (VDISK) and a minidisk with the higher
    priority on the VDISK can provide a method for sizing memory for Oracle and the
    Linux virtual machine. If there is paging to the second paging disk, then you
    should consider adding memory to Linux or reduce the Oracle SGA/PGA. Some swap
    to the VDISK is okay, but extensive swapping the minidisk is a sign that memory
    is not sized correctly.


    See 5.3.2,"Swap space for Linux" on page 92 for more swap space recommendations.


    # 4.3.5 Oracle binaries installation


    When installing Oracle RAC on IBM z, several independent sets of Oracle binaries
    must be installed for Oracle Clusterware and the Oracle database software to function
    properly. From an Oracle perspective, these are typically called ORACLE_HOME and
    CRS_HOME.


    You must install the Oracle Clusterware in a separate Oracle Home, which typically
    uses about 1.5 GB of storage. The Oracle Home for the RAC database will need another
    2.0 GB of storage. Oracle also advises when using ASM disk storage (which is fairly
    typical for Oracle RAC) to have another Oracle Home for it.


    The requirement of another Oracle home for ASM binaries is not mandatory, but
    makes things easier for database patching since the Oracle ASM set of binaries
    can be patched while the database is running, reducing the required downtime for
    the node.


    Space is also needed for the alert logs, trace files, database patches, and the
    Oracle install media zip files, which typically a size of 15-20 GB is used on
    each node for installing the Oracle software.'
