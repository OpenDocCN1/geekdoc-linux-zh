    # Figure 8-10 Users and Groups in Bus Connector


    When administrative security was not enabled in WebSphere Application Server,
    the Trade 6 application started and ran successfully without making the two changes
    shown above for the LocalOSUserId user ID. After making the changes, the window
    shown in Figure 8-11 appears and the changes need to be saved. At this point,
    the Trade 6 application started successfully without stopping and restarting the
    WebSphere Application Server. For other configuration changes, the server may
    need to be stopped and restarted with the stopServer.sh and scripts.


    ### Messages

    Changes have been made to your local configuration. You:

    * Save directly to the master configuration.

    * Review changes before saving or discarding.

    The server may need to be restarted for these changes to take effect.


    Figure 8-11 Message to save configuration changes


    Figure 8-12 shows the installation summary window for the IBM WebSphere Application
    Server V6.1.0.0. The default name for the application server is server1.


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_181_0.png)


    **Figure 8-12** WebSphere Application install results


    From here, the First steps console, shown in Figure 8-13 on page 161, can be accessed
    to start the application server and run the Installation Verifications Tests.


    **160** Using Oracle Solutions for Linux for System z


    # Figure 8-13 WebSphere Application Server first steps to get started


    The launchpad console can also be used to install the IBM HTTP Server V6.1.0.0.


    Figure 8-14 shows the install summary window for the HTTP server. The default
    name for the web server is webserver1.


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_182_0.png)


    # Figure 8-14 HTTP server install results


    # 8.3 Download IBM Trade Performance Application


    The first step is to download and unzip the Trade 6 zip file, tradeInstall.zip.
    The download is freely available from IBM at:


    https://www14.software.ibm.com/webapp/iwm/web/preLogin.do?source=trade6


    tradeinstall is the high level directory in the downloaded trade zip file. An
    overview and architectural description of the Trade 6 application is in the PDF
    located in the tradeinstall/Trade.pdf file, and the installation instructions
    are in the readme file located in tradeinstall/Readme.html. The DDL to create
    the tables and indexes used by Trade 6 is located in tradeinstall/Oracle/Table.dl.


    # 8.3.1 Set up an existing Oracle Database for Trade 6


    An existing Oracle database (SID = psft1) on linux25 was used for the Trade 6
    tables and indexes. A new data table space and new temporary table space were
    created for the Trade 6 application with the DDL shown in Example 8-1.


    > Example 8-2 Create Tablespace SQL statements


    ```sql

    CREATE TABLESPACE TRADE61_DEFAULT_TS DATAFILE

    ''/oracle2/trade61/oradata/psft1/trade61ldts.dbf'' SIZE 400M EXTENT

    MANAGEMENT LOCAL UNIFORM SIZE 1M SEGMENT SPACE MANAGEMENT AUTO;

    ```


    ```sql

    CREATE TEM TABLESPACE TRADE61_TEMP_TS TEMPFILE

    ''/oracle2/trade61/oradata/psft1/trade61lts.dbf'' SIZE 100M EXTENT

    MANAGEMENT LOCAL UNIFORM SIZE 1M;

    ```


    ```sql

    ALTER DATABASEFILE ''/oracle2/trade61/oradata/psft1/trade61ldts.dbf''

    AUTOEXTEND ON NEXT 10M MAXSIZE UNLIMITED;

    ```


    ```sql

    ALTER TABLEFILE ''/oracle2/trade61/oradata/psft1/trade61lts.dbf''

    AUTOEXTEND ON NEXT 10M MAXSIZE UNLIMITED;

    ```


    The user name was created and authorizations were given to the trade user ID in
    the existing Oracle database (see Example 8-2).


    > Example 8-2 Create example


    ```sql

    user trade identified by trade default tablespace

    TRADE61_DEFAULT_TS

    temporary tablespace TRADE61_TEMP_TS account unlock;

    ```


    ```sql

    GRANT CREATE SESSION to trade;


    GRANT CREATE table to trade;

    alter user trade quota unlimited on trade61_default_ts;

    ```


    A connection was made to the Oracle database with the user name and the

    password shown here:


    ```

    connect trade/trade@psft1

    ```


    The Trade 6 tables and indexes were created in the trade schema in table space

    TRADE61_DEFAULT_TS by running the DDL:


    ```bash

    tradeinstall/Oracle/Table.dbl1

    ```


    # 8.4 Install Trade 6 as a WebSphere Application Server application


    According to the installation readme, the tradeinstall directory was

    made the current directory and the WebSphere Application Server script,

    wsadmin.sh -f trade.jacl, was run from the linux25 command line to

    interactively install the JDBC/JMS resources and Trade 6 application:


    ```bash

    [root@linux25 tradeinstall#]

    /oracle2/IBM/WebSphere/AppServer/wsadmin.sh -f trade.jacl

    -user admin -password wasadmin

    ```


    Since administration security was enabled, the appropriate user name and

