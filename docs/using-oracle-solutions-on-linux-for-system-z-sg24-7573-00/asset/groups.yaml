    \ 143 shows the architecture of the backup\n\n![](img/5b458d26d6ded58c4d2c82af59a3d71c_164_0.png)\n\
    \nFigure 7-8 Backup architecture\n\nThe steps of the backup are:\n\n- 1. A CMS\
    \ service machine in the z/VM LPAR issues console commands as the root user to\
    \ each Linux machine at a preset time from a remote system. The remote system\
    \ is a service LPAR.\n    - a. The service machine, SIGBKUP, is started by a timer\
    \ based program as WAKEUP.\n    - b. Using the CP secondary console input facility,\
    \ issue commands through the CP SEND command to each Linux guest that is to be\
    \ backed up.\n- 2. The Linux machine processes the console command PREFLASH. PREFLASH\
    \ is a bash script:\n    - a. Quiesces Oracle. Once a week, the database is stopped\
    \ with dbora stop. Other times, a hot backup is performed and the database is\
    \ stopped with the command alter database begin backup.\n    > Note: When quiescing\
    \ Oracle with alter database begin backup and the database spans multiple Cylinder\
    \ volumes using the ext3 file system, there is a small window for I/O inconsistency.\
    \ There is a slight chance that the database will not be restored to a good state.\
    \ However, using alter database suspend instead of alter database begin will provide\
    \ a clean environment in this situation.\n    - b. Issues the sync command several\
    \ times. The sync command is issued several times in each machine to ensure the\
    \ disks are updated. Linux will cache file updates in memory, and the sync command\
    \ can write any data buffered in memory out disk.\n- 3. The CMS server machine\
    \ on the service LPAR will now:\n    - a. Link to the full volumes of all DASDs\
    \ containing the Linux machine minidisks. Minidisks containing Oracle data for\
    \ production machines are backed up daily. Minidisks containing system data such\
    \ as executables are backed up less frequently (lower change rate).\n    - The\
    \ backups are done by pools of machines, that is, production, development, lab,\
    \ and so on.\n    - c. Link to the targeted part of the full volumes.\n    - c.\
    \ Perform a FLASHCOPY from the source volume to the target volume starting from\
    \ cylinder 1 to the last cylinder. Cylinder 0 is not required for the FLASHCOPY,\
    \ as no minidisks start on cylinder 0, and this way the volume label on the target\
    \ is preserved.\n\nA lookup is done for each minidisk belonging to the Linux machine,\
    \ and a list of full volumes is prepared. SIGBKUP links to the SYSDUMP1 minidisk\
    \ at virtual address 380E for the source, and 388E for the target. Example 7-13\
    \ shows the list.\n\n## Example 7-13 List of minidisks\n\n| VPCX81 380E | 3390\
    \ | SYSDUMP1 | 0 | 3338 | 3339 | FC380E | ZODNXX1 | CPCMS |\n| :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- | :--- |\n| VPCX81 380E | ---- | PSSDDPB\
    \ | 0156 | 1 | 350 | 350 | FC380E | ZODNXX1 | LINUX |\n| VPCX81 380E | ---- |\
    \ PSSDDPB | 024F | 351 | 160 | FC380E | ZODNXX1 | LINUX |\n| VPCX81 380E | ----\
    \ | PSSDDPB | 025F | 511 | 1066 | 556 | FC380E | ZODNXX1 | LINUX |\n| VPCX81 380E\
    \ | ---- | PSSDDPB | 026F | 1067 | 1516 | 450 | FC380E | ZODNXX1 | LINUX |\n|\
    \ VPCX81 380E | ---- | PMRCDCA1 | 0150 | 1517 | 2104 | 588 | FC380E | ZODNXX1\
    \ | LINUX |\n| VPCX81 380E | ---- | PMRCDCA1 | 0153 | 3281 | 1177 | FC380E | ZODNXX1\
    \ | LINUX |\n\nEach full volume has a \"twin\" volume that is the target of the\
    \ FLASHCOPY.\nFigure 7-9 on page 146 shows the source and target disks linked\
    \ from the SIGBKUP CMS server machine, and the FLASHCOPY command.\n\n![](img/5b458d26d6ded58c4d2c82af59a3d71c_167_0.png)\n\
    \nFigure 7-9 FLASHCOPY for source to target volume\n\n- 4. A CMS service machine\
    \ in the z/VM LPAR issues console commands as the root user to each Linux machine\
    \ at a preset time from a remote system. The remote system is a service LPAR.\n\
    \    - a. The service machine, SIGBKUP, is started by a timer based program as\
    \ WAKEUP.\n    - b. Using the CP secondary console input facility, issue commands\
    \ through the CP SEND command to each Linux guest that is to be backed up.\n-\
    \ 2. The Linux machine processes the console command PREFLASH. PREFLASH is a bash\
    \ script:\n    - a. Quiesces Oracle. Once a week, the database is stopped with\
    \ dbora stop. Other times, a hot backup is performed and the database is stopped\
    \ with the command alter database begin backup.\n    > Note: When quiescing Oracle\
    \ with alter database begin backup and the database spans multiple Cylinder volumes\
    \ using the ext3 file system, there is a small window for I/O inconsistency. There\
    \ is a slight chance that the database will not be restored to a good state. However,\
    \ using alter database suspend instead of alter database begin will provide a\
    \ clean environment in this situation.\n    - b. Issues the sync command several\
    \ times. The sync command is issued several times in each machine to ensure the\
    \ disks are updated. Linux will cache file updates in memory, and the sync command\
    \ can write any data buffered in memory out disk.\n- 3. The CMS server machine\
    \ on the service LPAR will now:\n    - a. Link to the full volumes of all DASDs\
    \ containing the Linux machine minidisks. Minidisks containing Oracle data for\
    \ production machines are backed up daily. Minidisks containing system data such\
    \ as executables are backed up less frequently (lower change rate).\n    - The\
    \ backups are done by pools of machines, that is, production, development, lab,\
    \ and so on.\n    - c. Link to the targeted part of the full volumes.\n    - c.\
    \ Perform a FLASHCOPY from the source volume to the target volume starting from\
    \ cylinder 1 to the last cylinder. Cylinder 0 is not required for the FLASHCOPY,\
    \ as no minidisks start on cylinder 0, and this way the volume label on the target\
    \ is preserved.\n\n### 7.3.2 Restore\n\nUsing the backup method already described,\
    \ the restore method will restore all volumes backed up to a standby Linux machine.\
    \ The standby Linux machine does not provide any real time services. Once full\
    \ volumes are restored, and the file systems are available on the standby Linux\
    \ machine, Oracle is started with the backed up. Files are FTPed to the original\
    \ machine. Figure 7-10 on page 148 shows the architecture of the restore method.\n\
    \n- 1. A tape is recalled on z/OS.\n2. The necessary full volume(s) are restored\
    \ using DFSMS/DSS.\n3. Minidisks are assigned to the standby Linux machine.\n\
    4. Files are transferred using FTP to the original machine requiring the restore.\n"
  mdcn: "\n在虚拟化策略中，采用利用虚拟化系统（Linux）和主机系统（z/VM）特性的技术可以结合了这两者的优点。利用 CP、CMS 和 Linux 自有的功能可以实现极佳的复制方法。\n\
    \n## 7.3 使用 FlashCopy 以由 z/OS 管理备份\n\n本节描述了管理 Oracle 数据库备份的一种方法。\n\n此处显示的方法适用于\
    \ EXT2 或 EXT3 文件系统。如果您正在使用 Oracle ASM 文件系统，则必须考虑其他因素。本节不涵盖 ASM 相关问题。\n\n### 7.3.1\
    \ 备份\n\n在 IBM System 服务器上备份和恢复 Linux 虚拟机有许多方法。这包括通过源包进行 Linux 文件层级备份、通过系统实用程序或特定厂商产品进行\
    \ VM 备份，以及从 z/OS 系统进行备份。\n\n虽然缺乏某些功能（例如执行 Linux 文件层级归档的能力），但在 z/OS 系统的辅助下进行备份和恢复是\
    \ z/VM 和 Linux 部署中的一种流行选择。许多 z/VM 环境对磁带驱动器、磁带库或机器人磁带系统的访问有限（或没有）。\n\n许多 z/VM 和\
    \ Linux 部署已经拥有运行 z/OS 的现有主机，并配备了备份/恢复软件、程序和策略。\n\nz/OS 有两种配置可以访问由 z/VM 系统拥有的 DASD：\n\
    \n- 1. 一个 z/OS LPAR 与 z/VM LPAR(s) 位于同一个 CEC 中。z/OS LPAR 通过 IOCDS 编码访问 z/VM DASD。\n\
    - 2. z/VM LPAR(s) 和 z/OS LPAR 位于不同的 CEC 上。在这种情况下，DASD 存储单元本身双路连接到两个 CEC。每个 CEC\
    \ 的 IOCDS 编码均配置为查看同一个 DASD。\n\n一个拥有 Oracle 虚拟机的大型客户使用了两个独立 CEC 的配置。第 143 页的图 7-8\
    \ 显示了备份架构。\n\n![](img/5b458d26d6ded58c4d2c82af59a3d71c_164_0.png)\n\n图 7-8 备份架构\n\
    \n备份的步骤为：\n\n- 1. z/VM LPAR 中的 CMS 服务机在预设时间从远程系统以 root 用户身份向每台 Linux 机器发布控制台命令。远程系统是一个服务\
    \ LPAR。\n    - a. 服务机 SIGBKUP 由基于计时器的程序作为 WAKEUP 启动。\n    - b. 使用 CP 次级控制台输入功能，通过\
    \ CP SEND 命令向每个待备份的 Linux 客户发布命令。\n- 2. Linux 机器处理控制台命令 PREFLASH。PREFLASH 是一个\
    \ bash 脚本：\n    - a. 静置 Oracle（Quiesces）。每周一次通过 `dbora stop` 停止数据库。其他时间，执行热备并使用\
    \ `alter database begin backup` 命令停止数据库。\n    > 注意：在使用 `alter database begin backup`\
    \ 静置 Oracle 且数据库使用 ext3 文件系统跨越多个柱面卷时，存在一个极短的 I/O 不一致窗口。数据库有可能无法恢复到良好状态。然而，在这种情况下，使用\
    \ `alter database suspend` 代替 `alter database begin` 将提供一个干净的环境。\n    - b. 多次执行\
    \ `sync` 命令。在每台机器上多次执行 `sync` 命令以确保磁盘已更新。Linux 会在内存中缓存文件更新，`sync` 命令可以将内存缓冲的任何数据写入磁盘。\n\
    - 3. 服务 LPAR 上的 CMS 服务器机现在将：\n    - a. 连接到包含 Linux 虚拟机 minisk 的所有 DASD 的完整卷。包含生产机器\
    \ Oracle 数据的 minisk 每天备份一次。包含可执行文件等系统数据的 minisk 备份频率较低（更改率低）。\n    - 备份由机器池（即生产、开发、实验室等）完成。\n\
    \    - c. 链接到完整卷的目标部分。\n    - c. 从柱面 1 到最后一个柱面从源卷到目标卷执行 FLASHCOPY。FLASHCOPY 不需要柱面\
    \ 0，因为没有 minisk 起于柱面 0，通过这种方式可以保留目标卷上的标签。\n\n对属于 Linux 机器的每个 minisk 进行查找，并准备一份完整卷列表。SIGBKUP\
    \ 连接到虚拟地址为 380E 的源 SYSDUMP1 minisk，以及 388E 的目标。示例 7-13 显示了该列表。\n\n## 示例 7-13 minisk\
    \ 列表\n\n| VPCX81 380E | 3390 | SYSDUMP1 | 0 | 3338 | 3339 | FC380E | ZODNXX1 |\
    \ CPCMS |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | VPCX81 380E | ---- | PSSDDPB | 0156 | 1 | 350 | 350 | FC380E | ZODNXX1 | LINUX\
    \ |\n| VPCX81 380E | ---- | PSSDDPB | 024F | 351 | 160 | FC380E | ZODNXX1 | LINUX\
    \ |\n| VPCX81 380E | ---- | PSSDDPB | 025F | 511 | 1066 | 556 | FC380E | ZODNXX1\
    \ | LINUX |\n| VPCX81 380E | ---- | PSSDDPB | 026F | 1067 | 1516 | 450 | FC380E\
    \ | ZODNXX1 | LINUX |\n| VPCX81 380E | ---- | PMRCDCA1 | 0150 | 1517 | 2104 |\
    \ 588 | FC380E | ZODNXX1 | LINUX |\n| VPCX81 380E | ---- | PMRCDCA1 | 0153 | 3281\
    \ | 1177 | FC380E | ZODNXX1 | LINUX |\n\n每个完整卷都有作为 FLASHCOPY 目标的“双胞”卷。第 146 页的图\
