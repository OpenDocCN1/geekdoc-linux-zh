    This project assumes that the 10gr2 database client has been installed on the
    i386 host on which the BIEE servers are installed.


    Ensure that the oracle SID is in your .profile statement and that the TWO_TASK
    variable has been set to reflect the proper Oracle SID. Putting these in your
    .profile prevents the mistake of forgetting to set the SID:


    ```

    /* Excerpt from .profile */

    export ORACLE_SID=olapmst

    export TWO_TASK=$ORACLE_SID

    ```


    The installation library used was FTPd to the middle tier and expanded with the
    following command:


    ```

    cpio -idmv < biee_linux_x86_SUSE_10132_disk1.cpio

    ```


    This created the directory /oracle/SS_Linux/Server/Oracle_Business_Intelligence.


    The installation process was started using the following commands:


    ```

    cd oracle/SS_Linux/Server/Oracle_Business_Intelligence

    ./setup.sh

    ```


    If you get an error message that you are missing the gcc library, you will need
    to return to 6.3.1, "Preparing the environment" on page 102 and re-install the
    necessary GCC C++ runtime libraries.'
