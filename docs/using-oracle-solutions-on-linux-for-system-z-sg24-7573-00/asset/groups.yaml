    # Migrating an Oracle database from z/OS to Linux for System z


    Oracle has always claimed that Oracle is Oracle. It does not matter where Oracle
    is running, it has the same functionality. With the trend of using Linux for System
    z, we found that it would be helpful to show the process of migrating a database
    from z/OS to Oracle on Linux for System z.


    This chapter goes through the migration of an application database from Oracle
    on system z/OS to Oracle on Linux for System z. The z/OS database is in EBCDIC
    and the Linux for System z database is in ASCII.


    # 10.1 Migrating your Oracle Database from z/OS to Linux for System z


    To migrate a database, you can use many tools, such as traditional export/import,
    RMAN, Data Pump export/import, and some third party tools. We decided to use Oracle
    Data Pump, as this is a faster migration than using the traditional export/import
    utilities.


    Transportable table spaces are not an option because of the EBCDIC to ASCII conversion
    that is required. This is the reason Oracle on z/OS is not a supported platform
    for transportable table spaces.


    # 10.2 Using Data Pump


    The design of Data Pump Export and Import results in greatly enhanced movement
    performance over the original Export and Import utilities. Information about how
    to use the Data Pump is located in Oracle Database Utilities, B10825-01.


    The Data Pump Export and Import utilities (invoked with the expdp and impdp commands,
    respectively) have a similar look and feel to the original Export (exp) and Import
    (imp) utilities, but they are completely separate. Dump files generated by the
    new Data Pump Export utility are not compatible with dump files generated by the
    original Export utility. Therefore, files generated by the Export (exp) utility
    cannot be imported with the Data Pump Import (impdp) utility.


    Oracle recommends that you use the new Data Pump Export and Import utilities because
    they support all Oracle Database 10 features, except for XML schemas. Original
    Export and Import supports the full set of Oracle database release 9.2 features.


    The exercise we did was to migrate a database that resided on Oracle on z/OS to
    Linux for System z. The database was used for a Web Application to an Oracle database.


    We started with Oracle installation on System z/OS. Once we had Oracle installed,
    we created the database, user, and schema for the Web Application.


    The steps we took to do the migration test were:


    - 1. Installing Oracle 10g on z/OS

    - 2. Creating the database and tables

    - 3. Populating the database

    - 4. Preparing for Data Pump Export

    - 5. Running Data Pump Export

    - 6. Moving the dump file to new system

    - 7. Installing Oracle 10g on Linux for System z

    - 8. Creating the database

    - 9. Preparing for Data Pump Import

    - 10. Running Data Pump Import

    - 11. Validating the application


    # 10.3 Installing Oracle 10g on z/OS


    We installed the Oracle binaries on z/OS by following the Oracle Installation
    Guide and Experiences with Oracle Database 10g on z/OS, SG24-7055. After installing
    the binaries and following the creation of a database (described in Chapter 5,
    “Creating the Oracle Database”, of Experiences with Oracle Database 10g on z/OS,
    SG24-7055), we needed to verify that job SQLORA13 ran successfully. To be able
    to use Data Pump, the Java code must be initialized successfully. Check that job
    SQLORA13 was completed without errors.


