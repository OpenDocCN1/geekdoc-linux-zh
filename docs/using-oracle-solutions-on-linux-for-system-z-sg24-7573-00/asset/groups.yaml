    # 4.2.1 Using a Virtual Switch


    A Virtual Switch (VSwitch) bridges real hardware and virtual networking LANs,
    offering external LAN connectivity to the guest LAN environment. A VSwitch can
    be used within the same LPAR, connecting multiple z/VM guests using virtual network
    adapters rather than dedicated hardware network adapters.


    If or more Oracle RAC nodes are on the same LPAR, then a guest local area network
    can be used for communication between the RAC nodes. A guest LAN is a virtual
    LAN connection between virtual machines that use either the z/VM simulation of
    HiperSocks (without the HiperSocks microcode) or a virtual OSA-Express (QIDIO)
    adapter.


    When setting the Oracle private interconnect between Linux guests on the same
    LPAR, a HiperSocket Guest LAN can be used. For the main Oracle interface, where
    broadcast and routing capabilities are needed, the OSA or QDIO emulation should
    be used.


    The deployment of a virtual switch reduces the CPU utilization and latency associated
    with providing external connectivity through a physical router. The switching
    logic resides in the z/VM Control Program (CP), which owns the connection and
    performs all data transfers between guest LAN nodes. In this help eliminate the
    impact associated with a router.


    # 4.2.2 Using HiperSockets


    HiperSockets enables you to quickly transfer data between operating system instances
    running on different LPARs. On system z, HiperSockets supports up to 16 independent
    virtual LANs that operate as TCP/IP networks within a mainframe''s central electronics
    complex (CEC).


    HiperSockets achieves high-speed TCP/IP connectivity between separate LPARs by
    using a subchannel on the shared HiperSocket (IQD chpid). This subchannel then
    communicates with another host using the same chpid (that is, the communication
    is through the system memory of the processor).


    The speed of HiperSockets is directly related to the speed of processors on the
    CEC, because a HiperSocket network is implemented by microcode that runs on the
    CEC processors.


    HiperSockets is an in-memory network connection. By keeping the packets local
    to the mainframe, the network configuration becomes much simpler and therefore
    reduces the networking logistics and external cabling. Compared to OSA, HiperSockets
    is quite fast.'
  - '[PAGE 90]


    # 4.2.3 Gigabit Open System Adapter (OSA) card


    On the IBM System z machine, OSA-Express/OSA-Express2 Gigabit Ethernet can be
    used for the Oracle RAC interconnect as the network card used between two or more
    RAC nodes. This can also be achieved through a VSwitch emulating an OSA card.


    An OSA card is typically used when two or more RAC nodes are on separate IBM z
    machines, but can also be used as an alternative if HiperSockets, for example,
    is not available between LPARs.


    OSA-OSE-Express2 cards support a mode of operation called Queued Direct I/O, or
    QDIO. QDIO is a highly efficient data transfer architecture that dramatically
    improves data speed and efficiency for TCP/IP traffic.


    # 4.2.4 Best practices for network configuration


    If you are setting up a test or development system on one Linux LPAR, utilizing
    a VSwitch for both the public and private interfaces is recommended. The Oracle
    private interconnect can use a HiperSockets Guest LAN (this emulates a HiperSocket)
    and the public network interface can use a Gigabit Ethernet Guest LAN configuration.


    For an Oracle RAC system on two or more separate LPARs on the same IBM System
    z machine, HiperSockets is recommended for the private network interconnect.


    When setting up Oracle RAC between two or more System z machines, a gigabit OSA
    card (or a VSwitch that emulates a gigabit osa card) is the only configurable
    option for the private interconnect.


    Table 4-2 shows some of these recommendations.


    Table 4-2 Network configuration options

    | Setup | Oracle private network (interconnect) | Oracle public network |

    |---|---|--|

    | All z/VM Linux guests in one LPAR | VSwitch recommended Gigabit OSA Card possible
    | VSwitch recommended Shared or dedicated OSA Card |

    | z/VM Linux guests on different LPARs | HiperSocket recommended Gigabit OSA card
    possible | VSwitch recommended Shared or dedicated OSA Card |'
