    ## LOG_ARCHIVE_CONFIG


    LOG_ARCHIVE_CONFIG: 在此参数上指定 DG_CONFIG 属性，以列出 Oracle Data Guard 配置中主数据库和备用数据库的
    DB_UNIQUE_NAME。这允许向运行在最大保护或最大可用性模式下的实时应用集群（RAC）数据库的 Oracle Data Guard 配置中动态添加备用数据库。默认情况下，LOG_ARCHIVE_CONFIG
    参数允许数据库发送和接收 redo。在角色转换后，可能需要使用 SEND、NOSEND 或 NORECEIVE 关键字再次指定这些设置。使用以下语法：


    ```sql

    SQL> ALTER SYSTEM SET LOG_ARCHIVE_CONFIG=DG_CONFIG=(trade,trade);

    ```


