    Linux 的逻辑卷管理 (LVM) 和 Oracle 的自动存储管理 (ASM) 都是 dasd 聚合条带和镜像工具。在设置 Oracle 数据库存储时，您应该使用其中一种。


    使用 LVM 时，应使用建议的条带设置：

