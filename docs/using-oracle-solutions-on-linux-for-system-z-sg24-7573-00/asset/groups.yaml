    \ in a z/VM and Linux environment.\n\n## 7.2 Setting up a cloning architecture\n\
    \nOne of the major strengths of z/VM as a virtualization host for multiple Linux\
    \ servers is a rich set of tools for Linux server replications.\n\nThere are several\
    \ methods of cloning in z/VM, ranging from manually creating directory entries,\
    \ copying disks, and updating Linux configuration files by hand, in-house automated\
    \ solutions, to vendor products.\n\nThe solution presented here consists of multiple\
    \ steps from installation to usable master. The coding was done using CMS REXX™\
    \ and PIPELINES and has an automated front end to DIRMAINT on multiple systems\
    \ and RACF.\n\nA large client runs Oracle databases on nearly 200 Linux servers.\
    \ In this environment, replication of several master images is an important part\
    \ of systems administration. A cloning methodology was developed based on using\
    \ SUSE SLES. The methodology uses very few masters. The masters contain a purified\
    \ Linux distribution and a pre-installed Oracle.\n\n![](img/5b458d26d6ded58c4d2c82af59a3d71c_156_0.png)\n\
    \nThe major steps, as shown in Figure 7-3, are:\n\n- 1. Installation is performed\
    \ on a SUSE SLES 9 or 10 package from a directory tree that resides in a zVM Linux\
    \ virtual machine. Service packs are installed as well.\n  After the install is\
    \ completed, many packages that have been deemed unnecessary are removed. Package\
    \ removal is a labor intensive step with around 3,000 packages being removed.\n\
    \  This initial Linux system, minus the unnecessary packages, is then copied over\
    \ to a new set of disks in preparation for the next step of installing on packages,\
    \ products, and local tailoring.\n- 2. Installation of add-on packages and products\
    \ and local tailoring.\n  The additional packages provide software for performance\
    \ monitoring with Velocity Software, security compliance and change notification\
    \ with Tripwire package, and the approved method of file transfer using Axway.\n\
    \nLocal tailoring involves the installation of scripts used in the cloning process,\
    \ changes to the FSTAB to conform to the disk standards in use, and configuration\
    \ skeleton files for the network interfaces.\n\nThe tailored system is then copied\
    \ to a new set of disks in preparation for the next step, the Oracle installation.\n\
    \n- 3. Oracle installation.\n\nOracle is installed. The file systems where Oracle\
    \ is installed are shown in Figure 7-4.\n\n![](img/5b458d26d6ded58c4d2c82af59a3d71c_157_0.png)\n\
    \nFigure 7-4 Oracle shared read-only and non-shared read-write disks\n\n- 4. Extensive\
    \ testing by different departments\n\nThe Oracle system is then copied over to\
    \ a new set of disks in preparation of the testing system. The testing system\
    \ is turned over from builders to Linux sysadmins, z/VM programmers, Oracle DBAs,\
    \ the automation group, and the security administrators.\nCorrections and changes\
    \ are reviewed, and then tested. When all tests have passed, this certified system\
    \ is now used as master for input to the cloner.\n\n- 5. The approved golden image\
    \ is made ready as the master image for cloning.\n\nThe replication engine is\
    \ done in CMS server in service zone LPAR. The service zone LPAR is configured\
    \ to recognize all DASD devices on CEC. The coding engine is written in REXX,\
    \ and interfaces with CP, the VM directory through DIRMAINT commands, and RACF.\n\
    \nDIRMAINT is configured to send commands to remote systems.\nExample 7-11 shows\
    \ a command issued from SERVICE LPAR to the APPLICATION LPAR.\n\nExample 7-11\
    \ Direct commands\n\n```\nquery userid\nReady; T=0.01/0.01 14:43:02\ndirm to applic\
    \ for sigdk01 get lock\nReady; T=0.02/0.02 14:43:07\nFrom APPLICATION(DIRMAINT):\
    \ DVHRE289I Your GET request for SIGDK01 at *\nFrom APPLICATION(DIRMAINT): DVHRE289I\
    \ has been accepted.\nFrom APPLICATION(DIRMAINT): DVHGET3305I Entry SIGDK01 sent,\
    \ no lock\nFrom APPLICATION(DIRMAINT): DVHGET3305I made.\nRDOR FILE 002 SENT FROM\
    \ RSCS WAS 339 RSCS 001 A NOLEEP\nDMAT104I File (2471) spooled to MAINT -- origin(DIRMAINT)\
    \ 01/08/08 14:43:07\nFrom APPLICATION(DIRMAINT): DVHRE289I Your GET request for\
    \ SIGDK01 at *\nFrom APPLICATION(DIRMAINT): DVHRE289I completed; with RC = 0.\n\
    ```\n\nThe RSCS service machine on both LPARs is used to transport the messages.\n\
    Figure 7-5 shows the interLPAR communication used by DIRMAINT.\n\n![](img/5b458d26d6ded58c4d2c82af59a3d71c_159_0.png)\n\
    \nThe RACF database is shared between the production LPARs and the service zone\
    \ LPAR, as shown in Figure 7-6 on page 139.\n\nFigure 7-5 RSCS to RSCS inter LPAR\
    \ communication on a z/VM system\n\n![](img/5b458d26d6ded58c4d2c82af59a3d71c_160_0.png)\n\
    \nFigure 7-6 RACF shared databases\n\nThe replication engine is based on sharing\
    \ large portions of the Linux hierarchical file system, and modifying the root\
    \ file system to include smaller disks. The small disks are used for local parameters\
    \ for a Linux host, containing customized configuration files. These smaller file\
    \ systems are then mounted into the standard Linux file systems structure.\n\n\
    Figure 7-7 shows the disk architecture used by a replicated server.\n\n![](img/5b458d26d6ded58c4d2c82af59a3d71c_161_0.png)\n\
    \nFigure 7-7 DASD configuration for a Linux Server\n\nThe R/O disks are linked\
