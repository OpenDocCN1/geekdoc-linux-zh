    # 使用 Oracle 10gR2 使用 WebSphere Application Server


    《Experiences with Oracle for Linux on zSeries, SG24-6552》中的第 11 章“Using WebSphere
    with Oracle9i”讨论了使用 Oracle9 数据库作为 WebSphere Application Server 仓库的 WebSphere Application
    Server V4.0。WebSphere Application Server 仓库包含各个组件配置文档的副本，但从 WebSphere Application
    Server 5 版本开始，配置信息已存储在 XML 文件中，而不是关系型数据库。应用程序服务器的 Admin 服务用于管理 XML 文件中的配置数据，并确保其在运行时的一致性。


    为了在书中演示如何在 Oracle 数据库中使用 WebSphere Application Server，我们使用 WebSphere Application
    Server V6.1 安装了 IBM Trade 6 性能基准应用程序，并配置应用程序使用 Oracle10.0.2.2 数据库。Trade 6 是 IBM
    公开提供的 WebSphere 示例应用程序。Trade 6 基准模拟了一个提供基于 Web 的在线证券交易的电子股票经纪应用程序。它被实现为 3 层 J2EE
    Web 应用，利用了应用程序服务器、数据库服务器和 Web 服务器。


    ## 8.1 WebSphere Application Server V6.1, Oracle 10.2.0.2 DB 以及 Trade 6 性能示例应用程序


    使用现有的 Oracle 数据库安装 Trade 6 应用程序的数据，本章不涵盖在《Experiences with Oracle@ 10g2 Solutions
    on Linux for IBM System z, SG24-7191》中描述的数据库安装过程。本章涵盖以下步骤：


    - 安装 IBM WebSphere Application Server V6.1（称为 base）。

    - 安装 IBM HTTP Server V6.1。

    - 安装、配置并执行 IBM Trade 6 应用程序。


    ## 8.2 安装 WebSphere Application Server V6.1(base) 和 IBM HTTP V6.1


    WebSphere Application Server 和 IBM HTTP 服务器都安装在同一个名为 linux25 的 Linux 系统上。Oracle
    10.2.0.2 数据库也安装在 linux25。这种配置对于此处的可行性演示足够，但不推荐用于生产环境。


    启动器（launchpad）是安装 WebSphere Application Server 和 HTTP Web 服务器的起点。启动器是一个 Web 应用程序，需要支持的
    Web 浏览器来运行。在 Linux for System z 上安装时使用的是该浏览器。此外，安装是以 root 用户身份完成的。


    ```

    [root@linux25 ~]# /usr/bin/firefox -version

    Mozilla Firefox 1.5.0.3, Copyright (c) 1998 - 2006 mozilla

    [root@linux25 ~]# export BROWSER=/usr/bin/firefox

    [root@linux25 ~]# ./launchpad.sh

    ```


    启动器程序位于产品光盘或下载镜像的根目录下。在 Linux for System z 上，启动器命名为 launchpad.sh。执行 launchpad.sh
    会显示图 8-1 所示的窗口。


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_174_0.png)


    图 8-1 WebSphere Application Server 欢迎窗口


    第 8 章. 使用 Oracle 10g2 使用 WebSphere Application Server 153


    安装 WebSphere Application Server 和 IBM HTTP Server 的实际过程非常简单，但我们应该注意两点。首先，由于条件检查失败并显示了警告消息，因为安装程序正在检查
    Red Hat Enterprise Linux 4 Update 2，而 linux25 处于 Update 5。在 Update 5 级别一切运行正常。其次，当安装期间出现图
    8-2 所示窗口时，我们启用了管理安全。


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_175_0.png)


    图 8-2 启用管理安全


    启用管理安全后，必须使用 -password 选项添加上述用户名，并必须添加上述密码，以便让命令行脚本 startServer.sh、stopServer.sh
    和 wsadmin.sh 能够成功运行。


    既未启用应用程序或 Java 2 安全，但在启用管理安全后，必须将 localOSUserID 分别添加到“用户和组”（Users and Groups）以及“总总线安全”（Bus
    Security）下，如下 WebSphere Application Server 管理员窗口所示。这使得 Trade 6 使用的 JMS API 能够正常工作。该
    ID 的默认密码为 password，并且也需要它。如果没有启用管理安全，则不需要在后续步骤中添加此 ID。


    154 使用 Linux for System z 的 Oracle 解决方案


    ## 在 Users and Groups 下添加 LocalOSUser

    在管理控制台左侧展开 **Users and Groups**，选择 **Manage Users**，然后在弹出的窗口中（如图 8-3 所示）选择 **Create**。


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_176_0.png)


    图 8-3 在 Users and Groups 下创建 LocalOSUser


    出现图 8-4 所示窗口，可以输入“LocalOSUserID”和“password”。填充字段后，选择 **OK** 添加 LocalOSUserID。


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_176_1.png)


    图 8-4 添加 LocalOSUserID


    一旦添加 LocalOSUserID，出现图 8-5 所示的窗口，显示 LocalOSUserID 已成功添加。


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_176_0.png)


    图 8-5 Users and Groups


    如果 Users and Groups 下没有任何内容，请使用 Search 选项填充该窗口。


    ## 在 Bus Security 下添加 localOSUserID


    展开管理控制台左侧的 **Security** 选项，出现图 8-6 所示窗口。


