    \ | 0156 | 1 | 350 | 350 | FC380E | ZODNXX1 | LINUX |\n| VPCX81 380E | ---- |\
    \ PSSDDPB | 024F | 351 | 160 | FC380E | ZODNXX1 | LINUX |\n| VPCX81 380E | ----\
    \ | PSSDDPB | 025F | 511 | 1066 | 556 | FC380E | ZODNXX1 | LINUX |\n| VPCX81 380E\
    \ | ---- | PSSDDPB | 026F | 1067 | 1516 | 450 | FC380E | ZODNXX1 | LINUX |\n|\
    \ VPCX81 380E | ---- | PMRCDCA1 | 0150 | 1517 | 2104 | 588 | FC380E | ZODNXX1\
    \ | LINUX |\n| VPCX81 380E | ---- | PMRCDCA1 | 0153 | 3281 | 1177 | FC380E | ZODNXX1\
    \ | LINUX |\n\nEach full volume has a \"twin\" volume that is the target of the\
    \ FLASHCOPY.\nFigure 7-9 on page 146 shows the source and target disks linked\
    \ from the SIGBKUP CMS server machine, and the FLASHCOPY command.\n\n![](img/5b458d26d6ded58c4d2c82af59a3d71c_167_0.png)\n\
