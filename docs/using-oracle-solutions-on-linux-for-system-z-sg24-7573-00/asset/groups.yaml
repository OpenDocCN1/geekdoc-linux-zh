    LOG_ARCHIVE_DEST_1=''LOCATION=/oracle/

    VALID_FOR=(ALL_LOGFILES,ALL_ROLES)

    DB_UNIQUE_NAME=trade1

    LOG_ARCHIVE_DEST_2=''SERVICE=trade2''

