    can be run on a supported middle tier with the database that contains the user
    data hosted on Linux for System z. This chapter describes the steps followed to
    install this architecture using Linux Intel as the middle tier and Oracle 10gR2
    on Linux for System z as the DB tier.


    Installing the Database code and the Application Server code is covered in detail
    in Experiences with Oracle 10g Database for Linux on zSeries, SG24-6482. This
    chapter concentrates on the new BIEE component.'
