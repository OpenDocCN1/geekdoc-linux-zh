    In our example, we used two guests running SLES10 and Oracle 10gR2. The database
    name was tradedb, the unique name on the first node was trade1, and the unique
    name on the second node was trade2. The directory structure was the same for both
    nodes:


    ```

    ORACLE_HOME=/oracle/10gr2

    LOG_ARCHIVE_DESTINATION=/oracle/trade

    ORACLE DATABASE FILE LOCATION=/oracle/10gr2/oradata/tradedb

    ```


    These are the steps we executed to prepare the database for copying.


    ## 9.6.1 Enable forced logging


    Place the primary database in FORCE LOGGING mode after database creation using
    the following SQL statement:


    ```sql

    SQL> ALTER DATABASE FORCE LOGGING;

    ```


    To verify that force logging is set, run:


    ```sql

    SQL> SELECT FORCE_LOGGING FROM V$DATABASE;

    ```


    ```

    FOR

    ---

    YES

    ```


    ## 9.6.2 Create a password file


    This was done during the installation of Oracle Binaries and the creation of the
    database.


    ## 9.6.3 Configure standby redo logs


    A standby redo log is required for the maximum protection and maximum availability
    modes and the LGWR ASYNC transport mode is recommended for all databases. Oracle
    Data Guard can recover and apply more redo data from a standby redo log than archived
    redo log files alone. To configure the logs, do the following steps:


    - 1. Ensure that the log file sizes are identical on the primary and standby databases.

    - 2. Determine the appropriate number of standby redo log file groups using the
    following formula:

    (Max num of log files per thread + 1) * (Max num of threads) = 4

    - 3. Verify the related database parameters and settings:


    ```sql

    SQL> SELECT TYPE,RECORDS_TOTAL FROM V$CONTROLFILE_RECORD_SECTION

    WHERE TYPE=''REDO LOG'';

    ```


    | TYPE | RECORDS_TOTAL |

    | --- | --- |

    | REDO LOG | 16 |


    ```sql

    SQL> SELECT DIMLM FROM X$KCCDI;

    ```


    DIMLM

    3


    - 4. Create standby redo log file groups:


    ```sql

    SQL> ALTER DATABASE ADD STANDBY LOGFILE ''/oracle/10gr2/oradata/tradedb/redo004s.log''
    size 50M,

    GROUP 4 ''/oracle/10gr2/oradata/tradedb/redo005s.log'' size 50M,

    GROUP 6 ''/oracle/10gr2/oradata/tradedb/redo006s.log'' size 50M,

    GROUP 7 ''/oracle/10gr2/oradata/tradedb/redo007s.log'' size 50M;

    ```


    - 5. Verify the standby redo log file groups were created:


    ```sql

    SQL> SELECT GROUP#,THREAD#,SEQUENCE#,ARCHIVED_STATUS FROM V$STANDBY_LOG;

    ```


    | GROUP# | THREAD# | SEQUENCE# | ARCHIVED_STATUS |

    | --- | --- | --- | --- |

    | 4 | 0 | 0 | YES UNASSIGNED |

    | 5 | 0 | 0 | YES UNASSIGNED |

    | 6 | 0 | 0 | YES UNASSIGNED |

    | 7 | 0 | 0 | YES UNASSIGNED |


    ## 9.6.4 Setting primary database initialization parameters


    There are two ways to set the initialization parameters: one is to create init(ORACLE_SID).ora
    file and start the database with that file. The second way is to issue the following
    commands:


    - 1. DB_UNIQUE_NAME

    - 2. LOG_ARCHIVE_CONFIG

    - 3. LOG_ARCHIVE_DEST

    - 4. ALTER SYSTEM to set flash recovery


    The following sections show how to set these commands.


    ## DB_UNIQUE_NAME


    DB_UNIQUE_NAME: Specify a unique name for each database. This name stays with
    the database and does not change, even if the primary and standby databases reverse
    roles. The syntax is:


    ```sql

    SQL> SELECT * FROM V$DATAGUARD_CONFIG;

    DB_UNIQUE_NAME

    ```


    tradedb


    ```sql

    SQL> ALTER SYSTEM SET DB_UNIQUE_NAME=''tradedb'' SCOPE=SPFILE;

    SQL> SELECT * FROM V$DATAGUARD_CONFIG;

    DB_UNIQUE_NAME

    ```


    tradedb


    At this point, we need to shut down the database and restart it in order to see
    the changes:


    ```sql

    SQL> shutdown immediate

    Database dismounted.

    ORACLE instance shut down.

    ```


    ```sql

    SQL> startup

    ORACLE instance started.

    ```


