    # # 3.1 Installing Oracle Database 10gR on Linux for System z


    Oracle Database 10gR for Linux for System z is 64-bit. You can set it up using
    a bit Red Hat AS4 Update 3 or Novell SUSE Linux Enterprise Server (SLES9) SP3
    64-bit Linux or SLES10 guest under z/VM in a logical partition (LPAR) on System
    z or in LPAR running only Linux.


    The version released in May 2006 was Oracle Database 10gR2 (10.2.0.2). We based
    this document on the installation experiences that we gained when installing this
    code at IBM and Oracle locations.


    This chapter assumes you have a functional Linux image. It describes the steps
    that we performed to prepare the environment and to run the installation process.


    # # 3.2 Preparing the environment for the installation


    We based this chapter on a Linux virtual machine named linux23. We installed Red
    Hat AS4 U3. We used a file system that was 7 GB ext3 Logical Volume Manager (LVM)
    mounted as /oradb. We used z/VM LPAR and z/VM V5.2. We chose to use an LVM instead
    of Oracle Automatic Storage Management (ASM). Either one is a valid option.


    # # 3.2.1 z/VM V5.2 definitions for the Linux virtual machine


    We defined a Linux virtual machine with 2 GB of virtual memory and one virtual
    CPU. Example 3-1 shows the user directory entries for our virtual machine, linux23.


    Example 3-1 linux23 virtual machine definitions


    ```

    USER LINUX23 xxxxxxxxxx 2G 2G G

    ACCOUNT ITS30000

    IPL CMS PARM AUTOCR

    MACHINE X

    NICDEF C200 TYPE Q010 LAN SYSTEM VSWITCH1

    CONSOLE 0009 3215

    SPOOL 000C 3505 A

    SPOOL 000D 3525 A

    SPOOL 000E 1403 A

    LINK MAINT INT 0190 0190 RR

    ```


    Using Oracle Solutions on Linux for System z'
