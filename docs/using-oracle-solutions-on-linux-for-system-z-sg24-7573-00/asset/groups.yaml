    DB_UNIQUE_NAME=trade1 |

    | log_archive_dest_2 | string | SERVICE=trade2 VALID_FOR=(ONLINE_LOGFILES,PRIMARY_ROLE)
    DB_UNIQUE_NAME=trade2 |


