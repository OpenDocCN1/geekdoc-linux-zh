    Oracle 集群至少需要两个设备：一个用于 Oracle 集群注册表 (OCR)，另一个用于投票磁盘 (Voting disks)。如果您正在格式化 ECKD
    类型的 DASD 以作为原始或块分区，则必须使用 4 KB 的块大小对其进行格式化。


    对于测试系统，通常使用一个分区同时存放 OCR 和投票磁盘。对于生产系统，建议每个大小的至少使用 280 MB 空间，并配置多个投票磁盘（必须为奇数）。


