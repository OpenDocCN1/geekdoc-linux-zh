    # 4.7.1 Oracle clusterware


    Cluster Ready Services (CRS) is now called Oracle Clusterware. Oracle Clusterware
    should be installed in a separate Oracle Clusterware home directory.


    This is a change to the Optimal Flexible Architecture (OFA) rules. You should
    not install Oracle Clusterware in a release-specific Oracle home mount point,
    typically /u01/app/oracle/product/10.2.0, as succeeding versions of Oracle Clusterware
    will overwrite the Oracle Cluster installation in the same path.


    If Oracle Clusterware Release 2 (10.2) detects an existing Oracle Cluster Ready
    Services installation, then it overwrites the existing installation in the same
    path.


    Oracle Clusterware manages the shared disk integrity, enabling two or more Linux
    guests to write to the same shared disk, much like VM manages mini-disks


    # 4.7.2 Cluster Verification Utility


    Oracle Database 10g Release 2 (10.2) is provided with the Cluster Verification
    Utility. Cluster Verification Utility (CVU) is a validation tool that you can
    use to check whether or not your cluster is properly configured, to avoid installation
    failures, and to avoid database creation failures.


    The CVU is used in the configuration and installation of Oracle Clusterware and
    RAC. The command runcluv verify all the important components necessary for a RAC
    installation. This must run (stage-pre) successfully before installing the cluster.


    The crs_stat command provides view of resources controlled by CRS. The -t option
    gives a list of the contents of the cluster registry


    The checkcrs command checks the cluster components, such as


    +   * Global services daemon (GSD)

    * Oracle Notification Service (ONS)

    * Instances

    * Listeners

    * Cluster Virtual IP addresses (VIP)


    If you have completed the setup of the network and the disks correctly, this should
    run successfully.'
  - '[PAGE 106]


    # 4.7.3 Note on LVM


    Oracle''s statement that they do not support LVM for RAC does not apply to Linux
    System z.


    Oracle does not support LVM with Oracle RAC because it does not have clustering
    capabilities. This has led to some confusion regarding IBM System z, as we use
    LVM for clustering but to create one large logical volume if we are using ECKD
    devices.


    On IBM System z, you can use LVM with Oracle Instance or RAC if you want to create
    one large logical volume from several small ECKD devices. For example, if you
    have 2 GB drives and you need an 8 GB drive to install Oracle Clusterware and
    Binaries on each node, you can use LVM to create one larger logical volume.


    > Note: In several cases we noticed that the CPU utilization was 20% to 30% with
    CRS running, before the database was started. We applied patch 6056783 and this
    resulted in the CPU utilization going down to about 2%. If you are running 10gr2,
    you may want to investigate using this patch.


