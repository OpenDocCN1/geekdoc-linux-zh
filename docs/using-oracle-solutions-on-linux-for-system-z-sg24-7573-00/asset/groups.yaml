    # Preparing to install Oracle products on Linux for System z


    This chapter provides current information about installing Oracle products on
    IBM System z. The hints and tips are based on commonly asked questions or problems.
    These include:


    - Ensuring the Linux RPMs that Oracle requires are all installed.

    - Ensuring the correct Oracle patches and patchsets are installed.

    - Ensuring Linux and VM have sufficient resources to run Oracle products.


    This chapter covers the following:


    - Setting up VM and Oracle Linux guests

    - Overview of Installing Oracle products

    - Installing Oracle Database 10.2.0.3 on SLES10


    This chapter is not meant to cover the detailed installation process for Oracle
    products such as the installation of a 10.2.0.2 database, which is described in
    Chapter 3, "Installing an Oracle 10gR2 single instance" on page 19.


    Remember to follow the latest Oracle documentation and MetaLink notes.


    ## 2.1 Setting up VM and Linux guests for Oracle


    Here we discuss setting up VM and Linux guests for Oracle.


    ### z/VM

    IBM is continually enhancing z/VM to improve the performance of the solution,
    such as Oracle database and applications. Try to use the latest releases of VM
    for the best results. Oracle development is presently using VM 5.2 and VM 5.3.
    You should be at least at these levels.


    It is important to make sure VM has allocated sufficient resource to your Oracle
    Linux guest. Oracle may not be able to run in your typical Linux guest depending
    on your default options. For example, you will need:


    - Memory

    The Oracle Universal Installer checks to see that you have 1 GB of memory to run
    the installation of the Oracle code.


    When running the database, memory is needed for Linux, the SGA, and the PGA for
    the database. If you are using ASM, you need memory for the SGA of the ASM infrastructure
    database.


    Less is better with Linux so that VM is not busy managing memory that is not necessary.


    - Disk

    To install your first Oracle database, you will need disk space for:

    - A copy of the CD images from otn.oracle.com

    - A copy of any patches or patch sets from metalink.oracle.com

    - Your ORACLE_HOME for the Oracle installed code

    - Your Oracle database files and redo logs


    The DBF files should be on a separate mount point from the redo logs for a production
    database. For subsequent installations, you can NFS mount the CD images and patches
    to save disk space.


    We usually started with a 20 GB logical disk for our installations of the database.
    For Oracle applications such as EBS or PeopleSoft, we usually start with a 100
    GB LUN. Your disk sizes might differ significantly from what we used.


    **Note:** On IBM System z, you can use LVM with Oracle Single Instance if you
    want to create one large logical volume from several small ECKD™ devices. For
    example, if you have two 7 GB drives and you need an 8 GB drive to install Oracle,
    you can use LVM to create a larger logical volume.


    ## CPUs

    For testing, a Linux guest with one CPU allocated will be fine. For production,
    having at least two CPUs will allow for multi-tasking or multi-processing.


    ## Swap space

    We use 500 MB of swap space. This is sufficient for Oracle on System z if you
    are running under z/VM. Be aware that the Oracle installation document recommends
    1.5 times the memory allocated to Linux. That is an x86 statement and is not recommended
    here. When the Oracle installer (OUI) runs, it checks for the swap space installed
    and will flag this as a problem. If this is the only parameter that it flags,
    then continue the installation. Any other parameters flagged must be fixed. Fixing
    and swapping space are necessary.


    ## Linux

    Linux distributors are continually producing new versions (distros). Make sure
    the one you are using is certified with the Oracle product you are installing.
    You can check this certification at http://www.metalink.oracle.com. In some cases,
    you will need a patch to use an Oracle product on the latest distro. This was
    the case for SLES10 and the Oracle Database 12.2.0.3, as described in 2.3.1, "Installing
    an Oracle database on SLES10" on page 16.


    Oracle requires more RPMs in a minimum install of Linux. It can be a very frustrating
    experience to start with a minimum install and add RPMs as problems are encountered.
    The solution of doing an installation of all RPMs, which works well, makes a great
    deal of disk space and gives you a Linux guest with RPMs that are never used.
    Oracle has recently produced several MetalLink notes that can give you guidance
    in the area of RPMs to install. You should reference these for the latest information.
    We list in this section the current information we have for Red Hat 4, SLES9,
    and SLES10.


    ## Oracle’s recommendations for Linux RPMs

    In 2007, Oracle published MetalLink notes to identify the RPMs needed for each
    Linux distro level for each Oracle Database product. Metalink note 401705.1 Linux
    x86 and Linux x86-64 Requirements Reference List is a master list of all the other
    notes. We have indicated in each of the following sections the Doc ID for the
    ones for IBM System z. You should refer to these for the latest information.


    ## Red Hat 4 RPMs

    We installed Red Hat AS4 U3, which was the current patch set at the time of the
    documentation of our install. We installed Red Hat for the RPM recommended process
    detailed:

    http://www-128.ibm.com/developerworks/eserver/library/es-rhel-coexist/


    It is very important that when Red Hat is installed as stated above that the following
    selections are used:

    - Legacy and Compatibility ARCH Development Support

    - Legacy Software Development

    - Compatibility ARCH Development Support


    Without these selections, you will have difficulty installing Oracle. The OUI
    may not start, or you may see Java™ errors or make/link errors. These will be
    very time consuming to diagnose.


    In addition to the selections listed above, the other functions that we recommend
    installing are:

    - Editors

    - DNS

    - FTP


    > Important: The procedure we use to install Novell''s SuSE SLES9 for Oracle is
    listed in 3.6, “Summary” on page 59.


    After the installation, we ran the unname -a command to verify the results:

