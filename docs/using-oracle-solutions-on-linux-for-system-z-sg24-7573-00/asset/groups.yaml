    In Figure 7-1 on page 125, z/VM LPAR is shown with four different VSwitch networks
    serving the needs of production, pre-production, development, and test. None of
    these VSwitch networks connect, so they cannot route to each other within the
    LPAR. All of the VSwitch networks coexist without knowledge of each other.


    All of the Linux machines on the VSwitches are running Oracle databases.


    The VSwitch networks connect to the physical networks by OSA Express-2 as QDIO
    devices. Three device addresses are required for one set of QDIO devices: a read
    device, a write device, and a data transfer device.


    VSwitches are defined in the SYSTEM CONFIG file read by CP IPL time, or by the
    CP DEFINE VSWITCH commands. Virtual machines are allowed or denied participation
    in a VSwitch at the membership level by the SYSTEM CONFIG file, the CP SET VSWITCH
    GRANT or REVOKE commands, or can be protected by an ESM, or RACF®.


    Example 7-1 is an example of defining VSwitches in a SYSTEM CONFIG file.


    # Example 7-1 VSwitch definitions


    ```

    ********************************************************

    /* VSwitch Definitions */

    ********************************************************

    Define VSwitch VXSSAP2 IP Rdev D900 Controller * Vlan 999 Portt Trunk

    Define VSwitchVXXAP2 ip rdev 0000 Controller * vlan 999 portt trunk

    DEFINE VSWITCHVXXAO2 IP RDEV DA00 DB000 CONTROLLER * VLAN 999,

    PORTT TRUNK

    DEFINE VSWITCHVXXAP2 IP RDEV E804 E904 CONTROLLER * VLAN 999,

    PORTT TRUNK

    ```


    The VSwitches VXXOAP2 and VXXPAP2 have two sets of real devices, corresponding
    to their uses as production and pre-production networks. Device recovery is possible.
    The VSwitches VXXSAP2 and VXXVAP2 have only one set of rdevs. No device recovery
    is possible. These devices are attached to a controller machine when the virtual
    switch is created, or given to an alternate controller machine in the unlikely
    event of a controller failure.


    The controller machine does not participate in the movement of layer two frames
    or layer three packets. The controller machine, although configured through the
    standard files used by the VM TCP/IP stack, is used for initialization and recovery
    purposes. Although confusing at first, it is very straightforward to work with
    the controller machines. In most cases, the IBM supplied controller'
- md: '

    machines, DTCVSW1 and DTCVSW2, can handle all requirements for multiple Switch
    configurations.


    Since no packet or frame movement takes place in a controller machine, it is a
    safe environment for controlling multiple networks, even networks that cannot
    see each other''s data due to site security policies.


    The directory entry for DTCVSW1 is shown in Example 7-2, and may be used exactly
    as provided in the zVM installation: The user statements contains the defaults
    from installation time, and are satisfactory for production needs.


    ## Example 7-2 DTCVSW1 entry


    ```

    USER DTCVSW1 32M 128M G

    INCLUDE TPCMSU

    OPTION QUICK055 SVMWSTAT MAXCONN 1024 DIAG98

    TIUCV "SWITCH" MSGLIMIT 65535

    LINK SVMTCP30 491 491 RR

    LINK SVMTCP30 492 492 RR

    LINK TCMPINT 591 591 RR

    LINK TCMPINT 592 592 RR

    LINK TCMPINT 198 198 RR

    *

    ISK 191 3390 22 005 VMXAL MR DTCVSW1 WDTCVSW1

    *

    DVHOPT LNKO LOG1 RCM SMS0 NP1 LANGAMEN PWC2007038 CRC7

    ```


    The DTCVSW1 CONTROLLER ON from the DTCVSW1 TC/IP configuration file is shown.
    The DTCVSW1 PROFILE may be used exactly as provided in the zVM installation.


    ## Example 7-3 SWITCH CONTROLLER statement


    ```

    ----------------------------------------------------------------------

    : Define the given virtual machine such that it can control CP-defined

    : Virtual Switch connections to real LAN segments through OSA Express

    : devices:

    :

    ----------------------------------------------------------------------

    ```


    ```

    SWITCH CONTROLLER ON

    ```


    No DEVICE, LINK, HOME, or GATEWAY statements should be coded in a controller profile.


    Figure 7-2 on page 128 shows the VSXXAP2 VSwitch with the controller machine,
    several Linux virtual machines, and a VM TCPI/P machine is shown with its virtual
    NICs and an IP address of 172.27.120.158.


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_149_0.png)


    Figure 7-2 Sample network


    128 Using Oracle Solutions on Linux for System for z


    A virtual machine connects to a VSwitch providing it has been grant authority
    by a cp command or through an ESM with either a directory statement (NICDEF or
    SPECIAL) or cp commands (DEFINE NIC and COUPLE).


    When using the NICDEF statement, the virtual NICs and coupling to the VSwitch
    are done by the one command. Example 7-4 shows an extract from a directory entry
    for DBXXUA1 virtual machine.


    ## Example 7-4 NICDEF statement


    ```

    USER DBXXUA1 CHANGEIT 256M 1024M G

    INCLUDE SIGPLNX

    NICDEF E800 TYPE QDI0 DEVICES 3 LAN SYSTEM VSXXAP

    ```


    The virtual machine is granted access to the VSwitch with the set vswitch command:


    ```

    set vswitch vsxxvap2 grant dbxxua

    ```


    The nicdef statement will define virtual NIC devices EB00, EB01, and EB02 as simulated
    QDIO, and couple them to the system defined VSwitch VSXXVAP2.


    The remaining task is to configure the device in Linux as an Ethernet device.
    The device is configured in the /etc/sysconfig/network directory. The file name
    is ifcfg-qeth-bus-ccw- prepended to the fully qualified device name, in this case,
    0.0.eb00, so: ifcfg-qeth-bus-ccw-0.0.eb00.


    A catenate (cat) command shows the contents of the file, as shown in Example 7-5.


    ## Example 7-5 cat command


    ```

    cat ifcfg-qeth-bus-ccw-0.0.eb00

    BOOTPROTO=''static''

    UNIQUE=''1''

    STARTMODE=''onboot''

    IPADDR=''172.27.120.157''

    MTU=''1500''

    NETMASK=''255.255.255.0''

    NETWORK=''172.27.120.0''

    BROADCAST=''172.27.120.255''

    REMOTE_IPADDR=''1''

    ```


    Assuming that this file is from a master, and the clone has no network access
    (we do not want to have a duplicate IP address), the 3270 interface will be needed
    to create the working configuration file. In the example, the IP address is changed
    from 172.27.120.157 to 172.27.120.158.


    The Linux commands used are cat, cp, head, tail, and echo (see Example 7-6). The
    cp command will make a copy of the configuration file to a new file called tempemp.
    The head command will take the first three lines of temp and by using redirection
    will write it to a new file called newtemp. The echo command will write the line
    with the new IP address 172.27.120.157 to the newtemp file with the append redirection
    symbol. The escape character / used so that the single quotes are sent to the
    output. The tail command will take the last five lines from tempemp and append
    it to newtemp using the append redirection symbol. The cat command will display
    the contents of the newtemp file with the updated IP address (172.27.120.158).


    ## Example 7-6 cp command


    ```

    cp ifcfg-geth-bus-ccw-0.0.eb00 tempemp

    cp ifcfg-geth-bus-ccw-0.0.eb00 tempemp

    #

    head -n 3 tempemp > newtemp

    head -n 3 tempemp > newtemp

    #

    echo IPADDR=''172.27.120.158'' >> newtemp

    echo IPADDR=''172.27.120.158'' >> newtemp

    #

    tail -n 5 tempemp >> newtemp

    tail -n 5 tempemp >> newtemp

    #

    cat newtemp

    cat newtemp

    BOOTPROTO=''static''

    UNIQUE=''1''

    STARTMODE=''onboot''

    IPADDR=''172.27.120.158''

    MTU=''1500''

    NETMASK=''255.255.255.0''

    NETWORK=''172.27.120.0''

    BROADCAST=''172.27.120.255''

    REMOTE_IPADDR=''1''

    ```


    The mv command will rename tempemp to the configuration file, ifcfg-geth-bus-ccw-0.0.eb00.
    The ifdown command will take the eth0 interface. The ifup command will bring the
    eth0 interface from the new configuration file with the IP address of 172.27.120.158.
    See Example 7-7 on page 152 for more.


    ## Example 7-7 mv command


    ```

    mv tempemp ifcfg-qeth-bus-ccw-0.0.eb00

    mv tempemp ifcfg-qeth-bus-ccw-0.0.eb00

    #

    ifdown eth0

    eth0          configuration: qeth-bus-ccw-0.0.eb00

    #

    ifup eth0

    eth0          configuration: qeth-bus-ccw-0.0.eb00

    ```


    The ifconfig eth0 command will show the interface with the new IP address. The
    ping command will show the TCP/IP stack of 172.27.120.156. See Example 7-8 for
    more.


