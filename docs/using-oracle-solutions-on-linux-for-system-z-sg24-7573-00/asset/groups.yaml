    \n- Legacy and Compatibility ARCH Development Support\n- Legacy Software Development\n\
    - Compatibility ARCH Development Support\n\nWithout these settings, it is difficult\
    \ to install Oracle. The Oracle User Interface (OUI) might not start, and you\
    \ might see Java errors or make/link errors. These situations are time consuming\
    \ to diagnose.\n"
