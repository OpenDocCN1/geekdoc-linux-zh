    # 1.1 Oracle Database Server (9i, 10grR1, 10gr2, and 11g)


    On the IBM System z platform, Oracle delivered their production level Oracle9i
    Enterprise Edition Database Server in 2002, Oracle 10grR1 in 2004, and 10gr2 in
    2006. Oracle 11g is projected for 2008.


    Over the past four years, many clients have moved or added new databases to run
    on Linux on the IBM System z platform. The i in 9i stands for Internet and the
    g in 10g stands for grid.


    These releases are the same Oracle database that runs on the other platforms,
    and they include most of the components of the Enterprise Edition, including:


    +   - Oracle Real Application Clusters

    - Oracle OLAP

    - Oracle Spatial

    - Oracle Label Security

    - Oracle Partitioning

    - Oracle Data Mining

    - Oracle Advanced Security


    This includes the client package, which contains Oracle Net Services, Oracle Call
    Interface (OCI), and the Pro*C/C++ precompiler. The release notes indicate if
    a feature is not supported.


    These products provide a complete Oracle9i database or Oracle 10g Database Product
    for development, testing, and production in Linux for System z.


    # 1.2 Oracle Fusion Middleware


    Oracle Fusion Middleware is the brand name for Oracle''s middleware products.
    It consolidates Oracle Application Server 10g and related AS products and options,
    Oracle Data Hub, and Oracle Collaboration Suite into one family of infrastructure
    products.


    Oracle Fusion Middleware is used as the middleware infrastructure to unify Oracle''s
    application portfolio as part of Oracle''s “Project Fusion.” Clients use Oracle
    Fusion Middleware today for their custom applications.


    For IBM System z, Oracle AS10g and Oracle Collaboration Suite (in a split configuration
    with the Database tier) run on Linux for System z today.'
