    \ parameters that are flagged.\n\n## 3.2.2 The Linux environment\n\nThe system\
    \ administrator needs to set up the Linux guest with resources such as CPU, memory,\
    \ disk, and network connectivity that are specific to the installation's needs.\n\
    \nWe installed Red Hat AS 4 Update 3, which was the current patch set at the time\
