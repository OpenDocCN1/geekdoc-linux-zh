    # 4.3.6 OCR and Voting disks installation


    Oracle supports two ways of storing the Oracle Cluster files: either with Raw/Block
    devices or a shared file system such as Oracle Cluster File System 2 (OCFS2).
    OCF2 is an extent based, clustered file system that can be accessed and written
    to all nodes in the cluster. OCF2 is supported on Linux 2.6 kernels and above
    only.


    Oracle Cluster requires at least two devices: one for the Oracle Cluster Registry
    (OCR) and another for the Voting disks. If you are formatting ECKD type DASDs
    to use as Raw or Block partitions, you must format these with a 4 KB block size.


    For test systems, one partition for the OCR and Voting disks is typical. For production
    systems, using at least 280 MB for each size and multiple Voting disks (must be
    an odd number) are recommended.


    +   - Two OCRs: 256 MB each or 512 MB


    +   - Three Voting: 256 MB each or 768 MB


    Oracle ensures that devices contain a minimum of 256 MB of available disk space.
    Hence, at least 280 MB for each device size is recommended to account for the
    impact of partition creation.


    # 4.3.7 Shared database disk installation


    Oracle RAC can be created using the following storage options:


    +   - Oracle ASM for the data files with the OCR and Voting disks on Raw or Block
    devices


    +   - Standard Raw or Block devices (no Oracle ASM)


    It is a good idea to set up multiple disk groups for the different types of I/O
    that Oracle uses. For example, one set of disks for the database files and another
    set of disks for redo logs.


    If creating an ASM database, Oracle recommends putting the Flash Recovery Area
    on a different disk group than the database files. This protects the system from
    having the active data and backup and recovery data on the same physical disk.'
