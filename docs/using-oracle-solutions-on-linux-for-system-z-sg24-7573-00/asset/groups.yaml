    The Oracle user, icrac1, was added to the z/VM LDAP RACF SDBM

    directory with the following command:


    ```

    ldapadd -h 9.12.4.92 -d "racfid=ladapdm2, profiletype=user,

    cn=icrac1, o=ibm, c=us" -w ldap0 -f //icrac1.ldif

    ```


    The contents of this ICC RACF LDAP file are:


    ```

    dn=icrac1,profiletype=user,cn=racfvm,o=ibm,c=us

    objectclass:racUser

    racfid: icrac1

    ```


    The RACF alter USER command rac al (icrac1) noexpired

    password(ldapxx) was added to add a password to icrac1. Everything about

    The Oracle user name, icrac1, exists in the RACF SDBM database.


    # The CMS EXEC LDAPSCH


    ```

    ldapsch -h 9.12.4.92 -d "racfid=ladapdm2, profileType=User, cn=racfvm,

    o=ibm, c=us" -w ldap0 -s sub - "racfid=icrac1,profileType=user,

