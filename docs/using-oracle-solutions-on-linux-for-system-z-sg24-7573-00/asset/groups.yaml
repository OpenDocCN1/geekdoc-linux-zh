- md: "\nKei Kitamura\nMichiyasu Takada\nIBM Japan\n\n# Become a published author\n\
    \nJoin us for a two- to six-week residency program! Help write a book dealing\
    \ with specific products or solutions, while getting hands-on experience with\
    \ leading-edge technologies. You will have the opportunity to team with IBM technical\
    \ professionals, Business Partners, and Clients.\n\nYour efforts will help increase\
    \ product acceptance and customer satisfaction. As a bonus, you will develop a\
    \ network of contacts in IBM development labs, and increase your productivity\
    \ and marketability.\n\nFind out more about the residency program, browse the\
    \ residency index, and apply at:\n\nibm.com/redbooks/residencies.html\n\n# Comments\
    \ welcome\n\nYour comments are important to us!\n\nWe want our books to be as\
    \ helpful as possible. Send us your comments about this book or other IBM Redbooks\
    \ in one of the following ways:\n\n- - Use the online **Contact us** review Redbooks\
    \ form found at:\n  ibm.com/redbooks\n\n- - Send your comments in an e-mail:\n\
    \  redbooks@us.ibm.com\n\n- - Mail your comments to:\n  IBM Corporation, International\
    \ Technical Support Organization\n  Dept. HYTD Mail Station P099\n  2455 South\
    \ Road\n  Poughkeepsie, NY 12601-5400\n\nPreface xix\n\nXX Using Oracle Solutions\
    \ on Linux for System z\n\n![](img/5b458d26d6ded58c4d2c82af59a3d71c_22_0.png)\n\
    \n# Part 1\n\n# Installing Oracle Solutions\n\nIn this part, we provide a list\
    \ of Oracle Solutions that run on Linux for System z at the time of writing of\
    \ this book. This part also includes a summary of hints and tips on how to set\
    \ up the Linux and VM environment for Oracle products. It has some detailed checklists\
    \ on what to set up.\n\nThere are other IBM Redbooks publications where we have\
    \ previously described in detail our experiences installing Oracle products on\
    \ IBM System z:\n\n- - For Oracle 9: Experiences with Oracle for Linux on zSeries,\
    \ SG24-6552\n- For Oracle DB 10gR1: Experiences with Oracle 10g Database on Linux\
    \ on zSeries, SG24-6482\n- For Oracle DB 10gR2, AS10g, and mixed configuration\
    \ of EBS R11: Experiences with Oracle 10gR2 Solutions on Linux for IBM System\
    \ z, SG24-7191\n\n2 Using Oracle Solutions on Linux for System z\n\n# Overview\
    \ of Oracle Solutions on Linux for System z\n\nThis chapter is an overview of\
    \ Oracle Solutions that run on System z. Oracle has three main families of products:\n\
    \n- - Oracle Database Server (9i, 10g, 11g)\n- Oracle Fusion Middleware:\n  -\
    \ Oracle Application Server (9AS and AS10g)\n  - Oracle Identity Manager\n  -\
    \ Oracle Service-Oriented Architecture (SOA)\n  - Oracle Collaboration Suite\n\
    \  - Oracle Business Intelligence Enterprise Edition\n- Oracle Application Suites:\n\
    \  - Oracle 11i E-Business Suite\n  - Oracle's PeopleSoft® Enterprise\n  - Oracle's\
    \ Siebel Applications\n\nThis chapter provides a brief overview of these solutions.\
    \ See the following Web site for more detailed information:\n\n```\nhttp://www.oracle.com\n\
    ```\n\n# 1.1 Oracle Database Server (9i, 10gR1, 10gR2, and 11g)\n\nOn the IBM\
    \ System z platform, Oracle delivered their production level Oracle9i Enterprise\
    \ Edition Database Server in 2002, Oracle 10gR1 in 2004, and 10gR2 in 2006. Oracle\
    \ 11g is projected for 2008.\n\nOver the past four years, many clients have moved\
    \ or added new databases to run on Linux on the IBM System z platform. The i in\
    \ 9i stands for Internet and the g in 10g stands for grid.\n\nThese releases are\
    \ the same Oracle database that runs on the other platforms, and they include\
    \ most of the components of the Enterprise Edition, including:\n\n- - Oracle Real\
    \ Application Clusters\n- Oracle OLAP\n- Oracle Spatial\n- Oracle Label Security\n\
    - Oracle Partitioning\n- Oracle Data Mining\n- Oracle Advanced Security\n\nThis\
    \ includes the client package, which contains Oracle Net Services, Oracle Call\
    \ Interface (OCI), and the Pro*C/C++ precompiler. The release notes indicate if\
    \ a feature is not supported.\n\nThese products provide a complete Oracle9i database\
    \ or Oracle 10g Database Product for development, testing, and production in Linux\
    \ for System z.\n\n# 1.2 Oracle Fusion Middleware\n\nOracle Fusion Middleware\
    \ is the brand name for Oracle's middleware products. It consolidates Oracle Application\
    \ Server 10g and related AS products and options, Oracle Data Hub, and Oracle\
    \ Collaboration Suite into one family of infrastructure products.\n\nOracle Fusion\
    \ Middleware is used as the middleware infrastructure to unify Oracle's application\
    \ portfolio as part of Oracle's “Project Fusion.” Clients use Oracle Fusion Middleware\
    \ today for their custom applications.\n\nFor IBM System z, Oracle AS10g and Oracle\
    \ Collaboration Suite (in a split configuration with the Database tier) run on\
    \ Linux for System z today.\n\n# 1.2.1 Oracle Application Server (9iAS and AS\
    \ 10g)\n\nIn the third quarter of 2006, Oracle certified AS10g to run on Linux\
    \ for System z. Oracle 9iAS does not run on Linux for System z.\n\nThe versions\
    \ that were ported to Linux for System z in 2006 are:\n\n- - Oracle Application\
    \ Server 10g Release 2\n- - Oracle Application Server 10g Release 3\n- - Oracle\
    \ Application Server 10g Release 4\n- - Oracle Application Server 10g Service-oriented\n\
    \n# 1.2.2 Oracle Application Server Components\n\nAs December 2007, the components\
    \ of 10.2 are:\n\n- - Oracle Application Framework (ADF)\n- - Oracle Application\
    \ Assistant\n- - Oracle Application Certificate\n- - Oracle Application Integration\n\
    - - Oracle Application Sign-On\n- - Oracle BP Process Manager\n- - Oracle Business\
    \ Intelligence Discoverer\n- - Oracle Containers for JEE (OC4)\n- - Oracle Content\
    \ Management\n- - Oracle Enterprise Control\n- - Oracle Forms\n- - Oracle Identity\
    \ Manager\n- - Oracle Metadata Repository\n- - Oracle Personalization\n- - Oracle\
    \ Portal\n- - Oracle Reports\n- - Oracle Search\n- - Oracle Support\n- - Oracle\
    \ TopLink\n- - Oracle Ultra\n- - Oracle Wireless\n- - Oracle Workflow\n- - Oracle\
    \ XML\n\n# 1.2.3 Oracle Application Server 10.3\n\nAs December 2007, the components\
    \ of 10.3 are:\n\n- - Oracle Application Server 10g Release 1\n- - Oracle Application\
    \ Server 10g Release 2\n- - Oracle Application Server 10g Release 3\n- - Oracle\
    \ Application Server 10g Release 4\n- - Oracle Application Server 10g Service-oriented\n\
    \n# 1.2.4 Oracle Collaboration Suite\n\nOracle Collaboration Suite is a complete\
    \ collaboration suite, including calendar, e-mail, files, and workflow. It enables\
    \ the consolidation of messaging and collaboration to achieve cost efficiency.\
    \ It is supported in split configuration where you can run the database.\n\n#\
    \ 1.2.5 Oracle Business Intelligence Enterprise Edition\n\nOracle BIEE can run\
    \ with the Oracle database on Linux for System z. The Oracle BIEE application\
    \ runs on middle tier platform such as AIX or x86.\n"
  mdcn: "\n村北圭 (Kei Kitamura)\n高田道康 (Michiyasu Takada)\nIBM 日本\n\n# 成为作者\n\n加入我们为期二至六周的驻留计划！协助编写特定产品或解决方案的书籍，同时获得前沿技术的实践经验。你将有机会与\
    \ IBM 技术专家、业务伙伴和客户团队合作。\n\n你的努力将有助于提高产品的接受度和客户满意度。此外，你将在 IBM 开发实验室建立人脉网络，并提高你的工作效率和市场竞争力。\n\
    \n通过以下网址了解更多关于驻留计划的信息、浏览驻留索引并提交申请：\n\nibm.com/redbooks/residencies.html\n\n# 欢迎意见\n\
    \n您的意见对我们非常重要！\n\n我们希望书籍能够尽可能提供帮助。请通过以下方式之一向我们反馈关于本书或其他 IBM Redbooks 的意见：\n\n\
    - - 使用位于下方的在线**联系我们**（Contact us）Redbooks 反馈表单：\n  ibm.com/redbooks\n\n- - 通过电子邮件发送您的意见：\n\
    \  redbooks@us.ibm.com\n\n- - 将您的意见邮寄至至：\n  IBM Corporation, International Technical\
    \ Support Organization\n  Dept. HYTD Mail Station P099\n  2455 South Road\n  Poughkeepsie,\
    \ NY 12601-5400\n\n序言 xix\n\nXX 在 Linux for System z 上使用 Oracle 解决方案\n\n![](img/5b458d26d6ded58c4d2c82af59a3d71c_22_0.png)\n\
    \n# 第 1 部分\n\n# 安装 Oracle 解决方案\n\n在本部分中，我们提供了编写本书时在 Linux for System z 上的 Oracle\
    \ 解决方案列表。本部分还包含了关于如何为 Oracle 产品设置 Linux 和 VM 环境的提示和技巧。它包含了一些关于设置内容的详细清单。\n\n在其他\
    \ IBM Redbooks 出版物中，我们也详细描述过在 IBM System z 上安装 Oracle 产品的经验：\n\n- - 对于 Oracle\
    \ 9：zSeries 上的 Linux Oracle 经验，SG24-6552\n- 对于 Oracle DB 10gR1：zSeries 上的 Linux\
    \ Oracle 10g 数据库 经验，SG24-6482\n- - 对于 Oracle DB 10gR2、AS10g 以及 EBS R11 的混合配置：IBM\
    \ System z 上 Linux 的 Oracle 10gR2 解决方案 经验，SG24-7191\n\n2 在 Linux for System z\
    \ 上使用 Oracle 解决方案\n\n# Linux for System z 上 Oracle 解决方案概述\n\n本章概述了运行在 System z\
    \ 上的 Oracle 解决方案。Oracle 有三个主要的产品家族：\n\n- Oracle 数据库服务器 (9i, 10g, 11g)\n- Oracle\
    \ Fusion 中件：\n  - Oracle 应用服务器 (9AS 和 AS10g)\n  - Oracle 身份管理器 (Identity Manager)\n\
    \  - Oracle 服务体系架构 (SOA)\n  - Oracle 协作套件 (Collaboration Suite)\n  - Oracle 商业智能企业版\
    \ (Business Intelligence Enterprise Edition)\n- Oracle 应用套件：\n  - Oracle 11i 企业套件\
    \ (E-Business Suite)\n  - Oracle PeopleSoft® 企业版\n  - Oracle Siebel 应用\n\n本章提供了这些解决方案的简要概述。更多详细信息请参考以下网站：\n\
    \n```\nhttp://www.oracle.com\n```\n\n# 1.1 Oracle 数据库服务器 (9i, 10gR1, 10gR2 和 11g)\n\
    \n在 IBM System z 平台上，Oracle 分别于 2002 年交付了生产级 Oracle9i 企业版数据库服务器，2004 年交付了 10gR1，并在2006\
    \ 年交付了 10gR2。Oracle 11g 预计将于 2008 年推出。\n\n在过去的四年里，许多客户迁移或添加了新的数据库运行在 IBM System\
    \ z 上的 Linux 平台上。9i 中的 `i` 代表 Internet（互联网），10g 中的 `g` 代表 grid（网格）。\n\n这些版本与在其他平台上的\
    \ Oracle 数据库相同，包含了企业版的大多数组件，包括：\n\n- Oracle 实时应用集群 (RAC)\n- Oracle OLAP\n- Oracle\
    \ 空间 (Spatial)\n- Oracle 标签安全 (Label Security)\n- Oracle 分区 (Partitioning)\n-\
    \ Oracle 数据挖掘 (Data Mining)\n- Oracle 高级安全 (Advanced Security)\n\n这包括客户端包，其中包含\
    \ Oracle Net Services、Oracle 调用接口 (OCI) 以及 Pro*C/C++ 预编译器。发布说明中指示了某些功能是否受支持。\n\
    \n这些产品为 Linux for System z 提供了 Oracle9i 或 Oracle10g。\n\n# 1.2 Oracle Fusion 中件\n\
    \nOracle Fusion 中件是 Oracle 中件产品的名称。它将 Oracle 应用服务器 10g 以及相关的 AS 产品、Oracle Data\
    \ Hub 和 Oracle 协作套件整合到一个产品族中。\n\nOracle Fusion 中件作为 Oracle “Fusion 项目”的基础设施。客户现在使用\
