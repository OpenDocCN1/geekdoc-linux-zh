    \ System z, SG24-7191. We followed this procedure several times in the course\
    \ of writing the IBM Redbooks. This chapter includes the following:\n\n- Preparing\
    \ the environment:\n- z/VM environment\n- Linux environment\n- Linux kernel parameters\n\
    - Setting up X System\nInstallation\nPost installation\n\n## 3.1 Installing Oracle\
    \ Database 10gR on Linux for System z\n\nOracle Database 10gR for Linux for System\
    \ z is 64-bit. You can set it up using Red Hat AS 3 or Novell SUSE Linux Enterprise\
    \ Server (SLES9) SP3 64-bit Linux or SLES10 under z/VM in a logical partition\
    \ (LPAR) on System z or LPAR running only Linux. The version released in May 2006\
    \ was Oracle Database 10gR2 (10.2.0.2). We based this document on the installation\
    \ experiences we gained when installing this code at IBM locations. This chapter\
    \ assumes you have a functional Linux image and describes the steps we performed\
    \ to prepare the environment and run the installation process.\n\n## 3.2 Preparing\
    \ the environment\n\nWe based this chapter on a Linux virtual machine named linux23.\
    \ We installed Red Hat AS 3. We used a file system that was 7 GB Logical Volume\
    \ Manager (LVM) mounted as /oracle. We used z/VM LPAR and z/VM V5.2. We chose\
    \ to use LVM instead of Oracle Storage Management (ASM). Either one is a valid\
    \ option.\n\n### 3.2.1 z/VM V5.2 definitions for the Linux virtual machine\n\n\
    We defined a Linux virtual machine with 2 GB of virtual memory and one virtual\
    \ CPU. Example 3-1 shows the user entries for our virtual machine, linux23.\n\n\
    Example 3-1 linux23 virtual machine definitions\n```\nUSER LINUX23 xxxxxxxxxx\
    \ 2G 2G\nACCOUNT ITS3000\nIPL CMS PARM AUTO\nMACHINE X\nNICDEF C200 TYPE Q010\
    \ LAN VSWITCH1\nCONSOLE 0009 3215\nSPOOL 000C 3505 A\nSPOOL 000D 3525 A\nSPOOL\
    \ 000E 1403 A\nLINK MAINT 0190 0190 RR\n```\n```\nLINK MAINT 019E 019E RR\nLINK\
    \ MAINT 019F 019F RR\nLINK MAINT 019D 019D RR\nMDISK 0191 3390 2062 50 VMLUA1\
    \ MR\nMDISK 0201 3390 0001 0200 LX1AC MR\nMDISK 0202 3390 0201 3038 LX1AC MR\n\
    MDISK 0203 3390 0001 3338 LX1B40 MR\nMDISK 0204 3390 0001 3338 LX1B47 MR\nMDISK\
    \ 0301 3390 0001 10016 LX4CB0 MR\nMDISK 0302 3390 0001 10016 LX4CD0 MR\n```\n\n\
    Added 500 MB of swap space. This is sufficient for Oracle on Linux for System\
    \ z. Be aware that the Oracle installation document recommends 1.5 times the memory\
    \ allocated to Linux. That is an x86 statement and we do not recommend it here.\
