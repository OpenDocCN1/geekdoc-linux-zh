    # # 4.3 Oracle 10g RAC on IBM System z disk storage options


    The IBM System z platform supports many disk configurations for installing and
    running a 10g Oracle RAC system under z/VM Linux. This section will explore some
    of these storage options as well as providing some analysis on which options may
    fit your environment best.


    # ## 4.3.1 z/VM disk options


    One important consideration when setting up an Oracle database on IBM System is
    disk storage. It is important for the DBA to understand the underlying disk infrastructure
    in order to tune and maintain the system efficiently.


    With z/VM Linux, there are two types of disk storage that are typically used.
    Disk applications can use either SCSI storage devices utilizing fixed (S12-byte)
    blocks or Extended Count Key Data (ECKD) disk devices. These disks can then be
    connected by the following connection technologies: Enterprise System Connection
    (ESCON®), Fiber Connector (FICON®), or Fibre Channel Protocol (FCP).


    FCP/SCSI devices can be faster than FICON/ECKD devices. One approach is to put
    large database files on FCP/SCSI devices, and the Linux system and Oracle binaries
    on the FICON/ECKD devices.


    You cannot install Linux on an all-FCP/SCSI partition. System z requires at least
    one ECKD disk to install the operating system.


    With FICON/ECKD storage, you do not need to set up multipathing on the Linux guest,
    as it can be provided by the channel subsystem with multiple path groups. When
    using FCP/SCSI disk, we recommend implementing DM multipathing to provide the
    necessary fault tolerance. In order for Oracle ASM to utilize multipathing, the
    DM multipath devices must be specified (as opposed to the FCP/SCSI device) when
    assigning the disk in Oracle.'
  - '[PAGE 92]


    Another consideration with FCP/SCSI disks is FCP channels. With Oracle RAC, the
    SAN LUNs can be shared across Linux guests, but each guest must use a different
    FCP channel (or group of FCP channels) if DM multipathing is implemented. This
    may cause concerns if there is any limitation on the number of FCP channels that
    are available.


    Customers implementing FCP disks may also want to consider N-Port Virtualization.
    With N-Port Virtualization, LUNs can be assigned directly to guests rather than
    all the guests running under VM. N-Port Virtualization is first supported on the
    IBM System z9, and not on the z990 or z980 models. See Fibre Channel Protocol
    for Linux and vVM on IBM System z, SG24-7266 for further details.


    When using SAN/SCSI storage, it is very important to use disks from several arrays
    and from all clusters. This will provide better I/O concurrency and load balancing.
    Figure 4-2 illustrates the correct way to assign disks. The incorrect way is to
    allocate all the storage in one rank in sequential order, for example, 5100 to
    510F.


