    tradedb


    ## LOG_ARCHIVE_CONFIG


    LOG_ARCHIVE_CONFIG: Specify the DG_CONFIG attribute on this parameter to list
    the DB_UNIQUE_NAME of the primary and standby databases in the Oracle Data Guard
    configuration. This enables the dynamic addition of a standby to a Oracle Data
    Guard configuration that has a Real Application Clusters database running in either
    maximum protection or maximum availability mode. By default, the LOG_ARCHIVE_CONFIG
    parameter enables the database to send and receive redo. After a role transition,
    you may need to specify these settings again using SEND, NOSEND, RECEIVE, or NORECEIVE
    keywords. Use the following syntax:


    ```sql

    SQL> ALTER SYSTEM SET LOG_ARCHIVE_CONFIG=DG_CONFIG=(trade,trade);

    ```


    ```sql

    SQL> SHOW PARAMETER LOG_ARCHIVE_CONFIG

    ```


    | NAME | TYPE | VALUE |

    |---|---|---|

    | LOG_ARCHIVE_CONFIG | STRING | DG_CONFIG=(trade1,trade2) |


    ```sql

    SQL> SELECT * FROM V$DATAGUARD_CONFIG;

    DB_UNIQUE_NAME

    trade1

    ```


    ## LOG_ARCHIVE_DEST


    - Regardless of the role (primary or standby), output the ARCHIVE LOG to /oracle/trade
    on local according to log_archive_1.

    - Only in the case of the primary role should you output ARCHIVE LOG to remote
    destination.


    LOG_ARCHIVE_DEST_n: Specify where redo data to be archived on the primary and
    standby systems.

    LOG_ARCHIVE_DEST_1: Archives redo data generated by the primary database from
    the local online redo files to the local archived redo files in /oracle/trade.

    LOG_ARCHIVE_DEST_2: Transmits redo data to the remote physical standby trade2.


    Example 9-1 shows LOG_ARCHIVE_DEST:


    ```sql

    SQL> ALTER SYSTEM SET LOG_ARCHIVE_DEST_1=''LOCATION=/oracle/trade VALID_FOR=(ALL_LOGFILES,ALL_ROLES)
    DB_UNIQUE_NAME=trade1'';

    SQL> ALTER SYSTEM SET LOG_ARCHIVE_DEST_2=''SERVICE=trade2 VALID_FOR=(ONLINE_LOGFILES,PRIMARY_ROLE);

    ```


