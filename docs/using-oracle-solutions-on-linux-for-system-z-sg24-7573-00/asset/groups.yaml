- md: '

    # Using Oracle Solutions on Linux for System z


    # Setting up VM and Linux for Oracle Database 10gr2


    Linux on System z offers many advantages to customers who rely upon the IBM mainframe
    systems to run their businesses. Linux for System z takes advantage of the qualities
    of service in System hardware and in zVM, making it a robust industrial strength
    Linux. This provides an excellent platform for hosting Oracle solutions that run
    in your enterprise.


    # Setting up an environment for Data Guard


    This IBM Redbooks publication describes experiences gained while installing and
    testing several Oracle features and such as:


    # Setting up multiple Linux guests for Oracle


    - Oracle Data Guard

    - IBM WebSphere Application Server connecting to an Oracle database on Linux for
    System z

    - Oracle DB2 connecting to an Oracle database for System z

    - Oracle Data Pump


    It includes many general hints and tips on running Oracle products on IBM System
    z with Linux and zVM.


    The audience for this book includes database consultants, installers, administrators,
    and system programmers. It is not meant to replace Oracle documentation. It is
    just our experiences with installing and using Oracle products.


    # INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    # BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM Customers and Partners from around the world create timely information
    based on realistic scenarios. Recommendations are provided to help you implement
    IT solutions more effectively in your environment.


    For more information: ibm.com/redbooks

    '
  mdcn: '


    # 在 System z Linux 上使用 Oracle 解决方案


    # 为 Oracle Database 10gr2 设置虚拟机和 Linux


    对于依赖 IBM 主机系统运行业务的客户，System z  Linux 提供了许多优势。System z for Linux 利用了 System 硬件和
    zVM 的服务特性，使其成为稳健的工业级 Linux。这为托管您企业中运行的 Oracle 解决方案提供了一个卓越的平台。


    # 为 Data Guard 设置环境


    本 IBM Redbooks 出版物描述了在安装和测试若干 Oracle 功能时获得的经验，例如：


    # 为 Oracle 设置多个 Linux 客户机


    - Oracle Data Guard

    - IBM WebSphere Application Server 连接到 System z for Linux 上的 Oracle 数据库

    - Oracle DB2 连接到适用于 System z 的 Oracle 数据库

    - Oracle Data Pump


    它包含了许多在带有 Linux 和 zVM 的 IBM System z 上运行 Oracle 产品的通用提示和技巧。


    本书的读者群体包括数据库顾问、安装程序人员、管理员和系统程序员人员。它并非旨在替代 Oracle 的官方文档，这仅代表了我们安装和使用 Oracle 产品的经验。


    # 国际技术支持组织


    # 基于实战经验构建技术信息


    IBM Redbooks 由 IBM 国际技术支持组织开发。来自全球的 IBM 客户和合作伙伴的专家根据真实场景创建及时信息。书中提供的建议旨在帮助在您的环境中更有效地实施
    IT 解决方案。


    更多信息请访问：ibm.com/redbooks


