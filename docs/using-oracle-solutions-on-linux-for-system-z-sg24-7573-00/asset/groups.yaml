    -w ldapmx -f //icuser1.ldif

    ```


    The content of the ICUCESS LDIF A CMS file was:


    ```

    dn: cn=icuser1, ou=icc, o=ibm

    objectclass: top

    objectclass: person

    objectclass: organizationalPerson

    objectclass: posixAccount

    cn: icuser1

    sn: icuser1

    uid: icuser1

    userPassword: icuser1x

    uuidnumber: 50001

    gidnumber: 500

    homedirectory:/home/icuser1

    logshell:/bin/bash

    ```


    The adminDN entry in the LDAP server DS file is cn=ldapadm4,o=ibm.

    There is no particular reason that the administrator DN has only two levels in
    the directory and the icuser1 DN being added has three levels than it seemed like
    a logical organizational structure. The directory levels were also created with
    the CMS LDAPADD EXEC.


    Retrieving the entry from the directory with the CMS command:


    ```

    ldapsr -h 9.12.4.92 -D "cn=ldapadm4,o=ibm"

    -w ldapmx -b "cn=icuser1,ou=icc,o=ibm"

    "objectclass=*"

    ```


    yields the following output as expected:


    ```

    cn=icuser1, ou=icc, o=ibm

    objectclass=top

    objectclass=person

    objectclass=organizationalPerson

    objectclass=posixAccount

    cn=icuser1

    sn=icuser1

    uid=icuser1

    userpassword=icuser1x

    uuidnumber=50001

    gidnumber=500

    homedirectory=/home/icuser1

    loginshell=/bin/bash

    ```


    The userPassword is entered as clear text and will remain that in the directory
    unless the password encryption option, pwEncryption, in the DS CONF file is set
    to encrypt the userPassword attribute. The pwEncryption parameter setting is changed
    from none to SHA, the userPassword is encrypted by the SHA algorithm. For entries
    that have already been entered into the directory without encryption, there is
    a utility, db2passwd, which can be used to encrypt clear text passwords. A simple
    ldapsch search of an encrypted userPassword results in userpassword=NOT being
    displayed. What actually returned is a tag tagging SHA and the encrypted password,
    which is not printable to CMS. This encryption applies only to the LDBM database.


    The options -Dcn=idldapm4;o=ibm and -w idldapm on the CMS LDAPSEARCH above are
    required, as the DS CONF file parameter allowAnonymousBinds set to off, so anonymous
    binds are not allowed. The idldapm4 name with password idldapm is used to explicitly
    bind to the LDAP server. If the allowAnonymousBinds parameter is set to on and
    anonymous binds are allowed, then the LDAPSRCH will work with the -D and -w options
    specified.


    The LDBM back end uses the following settings in the z/VM LDAP server

    DS CONF:


    ```

    database LDBM GLDBLD31

    suffix="o=ibm"

    ```


    ## 11.2.2 z/VM LDBM and native authentication


    The z/VM LDAP server allows clients to bind to entries in an LDBM back end while
    using RACF for verifying the supplied password. The entry for the Oracle user
    name, except for the password, is maintained in LDBM, just as in the LDBM case
    for icuser1. There are a few differences in both the LDBM directory entry and
    the z/VM LDAP server configuration file. icuser2 is the Oracle user name used
    for this method of authentication using z/VM LDAP. The directory entry for icuser2
    is shown.


    ```

    cn=icuser2,ou=icc,o=ibm

    objectclass=top

    objectclass=person

    objectclass=organizationalPerson

    objectclass=ibm-nativeAuthentication

    objectclass=posixAccount

    cn=icuser2

    sn=icuser2

    ibm-nativeid=ICCUSER2

    uid=icuser2

    uidnumber=50002

    gidnumber=500

    homedirectory=/home/iccuser2

    loginshell=/bin/bash

    ```


    Notice that there is no password attribute and value pair in the LDBM directory
    entry. The objectclass=ibm-nativeAuthentication is specified and its definition
    includes the ibm-native attribute. The objectclass allows the use of the attribute
    ibm-native and this is the connection to z/VM LDAP native authentication. The
    RACF ID must be added in uppercase to the directory entry; otherwise, the native
    authentication will fail.


    iccuser2 was added to z/VM RACF with the following RACF commands from CMS:


    ```

    rac au (iccuser2) pass(password)

    rac al (iccuser2) noexpired password(ldap22)

    ```


    The alteruser command was run to prevent having to change the password upon the
    first access to RACF by iccuser2.


    Native authentication using the following three parameter settings in the z/VM
    LDAP DS CONF file:


    ```

    useNativeAuthchecked

    nativeUpdateAllowed on

    nativeAuthSubtree "ou=icc,o=ibm"

    ```


    ## 11.2.3 z/VM SDBM


    The z/VM LDAP server provides access to RACF user information stored in RACF SDBM.
    RACF group and connection information is also available, but is not discussed
    in this document. SDBM is also known as the RACF back end of the LDAP server.
    TheDBM database allows for directory authentication using a RACF ID and password.
    z/VM RACF must be available to the LDAP server to communicate with RACF and the
    LDAP server must be configured to use SDBM. The format of the DN is restricted
    using SDBM, as the DN must match the schema of the underlying RACF data. A complete
    DN for the Oracle user in the examples contains two required attributes: racfid
    and profiletype. For the discussion, the attribute value of profiletype will always
    be user. In other contexts, group are valid for profiletype. The suffix for SDBM
    used here is cn=racfvm, o=ibm, c=us. The z/VM LDAP server can be configured to
    support LDBM and SDBM at the same time, but for the discussion here only SDBM
    is configured in the DS CONF file.


    Everything. Everything about the Oracle user name, icuser1, exists in the RACF
    SDBM database. The following are the DS CONF settings for SDBM:


    ```

    database LDBM GLDBLD31

    suffix="o=ibm"

    ```


    The z/VM LDAP server administrator, ldapdm2, was added to RACF with the addUser
    command and the directory structure was created from the suffix when LDAP server
    was first started with the above values in the DS CONF file. The Oracle user,
    icuser1, was added to the z/VM LDAP RACF SDBM directory with the following command:


    ```

    ldapadd -h 9.12.4.92 -D "cn=ldapadm4,o=ibm"

    -w ldapmx -b "cn=icuser1,ou=icc,o=ibm" -f //icuser1.ldif

    ```


    The contents of this RACF LDAP file are:


    ```

    dn=icuser1,profiletype=user,cn=racfvm,o=ibm,c=us

    objectclass=user

    racfid=icuser1

    ```


    The RACF alter command rac al (icuser1) noexpired password(ldapxx) was added to
    add a password to icuser1. The CMS EXEC LDAPSEARCH:


    ```

    ldapsch -h 9.12.4.92 -D "cn=ldapadm4,o=ibm"

    -w ldapmx -b "cn=icuser1,ou=icc,o=ibm"

    -s "racfid=icuser1,profiletype=user,cn=racfvm,o=ibm,c=us" "objectclass=*"

    ```


    returns the following for icrac1 user:


    ```

    racfid=ICRAC1,profiletype=USER,cn=racfvm,o=ibm,c=us

    racfid=ICRAC1

    racauthordate=12/18/07

    racowner=RACFID-LDAPDM2,PROFILETYPE=USER,CN=RACFVM,O=IBM,C=US

    passwordinterval=30

    racpasswordchanged=12/18/07

    racdefaultgroup=RACFID-SYS1,PROFILETYPE=GROUP,CN=RACFVM,O=IBM,C=US

    raclastaccess=01/08/12:52:57

    raclogondays=SUNDAY

    raclogondays=MONDAY

    raclogondays=TUESDAY

    ```


