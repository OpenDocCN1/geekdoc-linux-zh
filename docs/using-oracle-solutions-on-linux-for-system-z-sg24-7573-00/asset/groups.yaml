    To display the attributes of the newly created LV, run:

    # lvsdisplay /dev/orabvg/orablv


    To create an ext3 file system for the oracle logical volume, you need to run mkfs.

    An ext3 file system type is recommended:

    # mkfs.ext3 /dev/orabvg/orablv -b 4096


    Create the mount points for Oracle home and CRS mount, mount the file system,
    and verify the size of the newly created file system:

    # mkdir -p /oracle

    # mount /dev/orabvg/orablv /oracle

    # df -h


    To make the changes permanent, you need to update the fstab file. We recommend
    making a backup of this file first:

    # vi /etc/fstab

    /dev/orabvg/orablv /oracle ext3 defaults 2


    # 4.5 Installing Oracle ASM Database On raw/block devices


    Oracle Automated Storage Management (ASM) is new feature in Oracle 10g that provides
    the DBA with the ability to manage database files through the creation of disk
    groups. A disk group is a set of disks that Oracle ASM owns and manages. By managing
    just a few disk groups, as opposed to potentially several thousand data files,
    database management can be made easier.


    Oracle ASM can also increase throughput and performance for the database through
    its ability to stripe spaces across several disk devices.


    Only one ASM instance is required per node regardless of the number of database
    instances on the node. For z/VM production Oracle environments, we recommend only
    one ASM and one RAC instance per node so that memory management can be tuned properly
    for the instance.


    For multipath devices, such as /dev/mapper/, you should use the multipath device
    and not the SCSI device name, such as /dev/sda or /dev/sdb.


    As of the Linux 2.6 kernel, it is now recommended to use block devices opposed
    to raw devices for the OCR, Voting, and ASM disks.'
  - '[PAGE 100]


    If using raw devices, you need to update the /etc/raw (SUSE) or /etc/sysconfig/rawdevices
    (Red Hat) files with the device bindings. The following is an example of the rawdevices
    file:


    ```

    # This file and interface are deprecated.

    # Applications needing raw device access should open regular

    # block devices with 0_DIRECT.

    # raw device bindings

    # format /dev/<rawdev> <major> <minor>

    # <rawdev> <blockdev>

    # example /dev/dev/raw/raw1 /dev/sda1

    # /dev/raw/raw2 8 5

    /dev/raw/raw1 /dev/dasdo1

    /dev/raw/raw2 /dev/dasdpl

    /dev/raw/raw3 /dev/dasdq1

    ```


    You must restart the raw service as the root user, or reboot the server in order
    to pick up the devices:


    ```

    # service rawdevices restart

    # /etc/init.d # chconfig -s raw 35 (for Fuse)

    # /etc/init.d # chconfig -add rawdevices -- level 35 (for Red Hat)

    ```


    If using block devices, you do not need to update the /etc/raw or /etc/sysconfig/rawdevices
    files.


    In order to assign the correct file permissions for these devices, you need to
    utilize udev to set the file permissions. For Red Hat Enterprise Linux 4 systems,
    you should create a 49-oracle.permissions file, and for Red Hat Enterprise Linux
    5 and SUSE Enterprise Server 10 systems, you should create a 51-oracle.permissions
    file in the /etc/udev/permissions.directory.


    If using block devices, the file should look something like this:


    ```

    # OCR disks

    dsas1:root:install:0640

    # Voting disks

    dasdpl:oracle:install:0640

    # ASM disks

    dasdq1:oracle:dba:0660

    dasdr1:oracle:dba:0660

    ```'
  - '[PAGE 101]


    If using raw devices, the file should look something like this:


    ```

    # QCR disks

    raw/raw1:root:oinstall:0640

    # Voting disks

    raw/raw2:oracle:install:0640

    # ASM disks

    raw/raw3:oracle:dba:0660

    raw/raw4:oracle:dba:0660

    ```


    The main reasons for creating a new file as opposed to modifying the existing
    file is that the Linux kernel loads the 49-oracle.permissions/51-oracle.permissions
    before the 50-dev.permissions, ensuring the correct file permissions get set.
    Another reason not to modify 50-dev.permissions is that the file can be overwritten
    with a support pack update. Without the correct file permissions, Oracle clusterware
    will not start correctly, causing issues with system startup.


    The following command can be used to execute the assignment of the file permissions:


    ```

    # /sbin/udevstart

    ```


    You should then check the files to ensure that they have the correct file permissions
    set.


    After raw/block partitions are defined, you can then clear the disk being used
    for the OCR, Voting, and raw/block devices with the `dd` command:

    diff if=/dev/zero of=/dev/dsag1 bs=1 count=100000


    At this point, the block/raw devices are ready for the installation of Oracle
    RAC using ASM. The Oracle Clusterware installation should be done first, followed
    by ASM disk group creation, and finally, the Oracle RAC database creation.


    # 4.6 Installing Oracle ASM with ASMLIB


    ASMLIB is an add-on utility for Oracle ASM that provides a method to assign disks
    to ASM disk groups. Oracle states that the purpose of ASMLIB is to provide an
    alternative interface for ASM to identify and access block devices.


    In order to use ASMLIB, you first need to download and install three Linux RPMs
    based on the kernel version that you are using. You should first determine the
    level of the kernel you are running with the following command:


    ```

    [root@oralin1 ~]# uname -r

    2.6.9-55.EL

    ```'
