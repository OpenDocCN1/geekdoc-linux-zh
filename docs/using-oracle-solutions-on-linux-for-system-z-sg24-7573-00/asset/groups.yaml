    ```sql

    SQL> SELECT * FROM V$DATAGUARD_CONFIG;

    trade1


    ## LOG_ARCHIVE_DEST


    - 无论角色如何（主或备用），根据 log_archive_1 将 ARCHIVE LOG 输出到本地 /oracle/trade。只有在主角色情况下将 ARCHIVE
    LOG 输出到远程地。LOG_ARCHIVE_DEST_n: 指定主数据库和备用数据库存档 redo 数据的位置。LOG_ARCHIVE_DEST_1: 将主数据库生成的在线
    redo 文件存档到本地 /oracle/trade redo 文件。LOG_ARCHIVE_DEST_2: 将 redo 数据传输到远程备用库 trade2。示例
    9-1 显示了 LOG_ARCHIVE_DEST：


