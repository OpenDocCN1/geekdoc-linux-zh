    # # Using Oracle Data Guard


    Oracle Data Guard is an Oracle Database feature that can be used to enhance high
    availability.


    This chapter describes an exercise we did to create a Oracle Data Guard setup
    with 10gR2 10.2.0.3 on Linux for System z.


    The main steps were:


    +   - Create a production database.

    - Create a standby database.

    - Test a switchover.


    This chapter is not meant to cover the detailed installation process for Oracle
    products. The installation of a 10.2.0.2 database is described in Chapter 3, “Installing
    an Oracle 10gR2 single instance” on page 19.'
  - '[PAGE 189]


    # 9.1 Oracle Data Guard overview


    Oracle Data Guard is the management, monitoring, and automation software infrastructure
    that creates, maintains, and monitors one or more databases to protect enterprise
    data from failures, disasters, errors, and corruptions.


    Oracle Data Guard maintains these standby databases as synchronized copies of
    the production database. These standby databases can be located at remote disaster
    recovery sites thousands of miles away from the production data center, or they
    may be located in the same city, same campus, or even in the same building. If
    the production database becomes unavailable because of a planned or unplanned
    outage, Oracle Data Guard can switch any standby database to the production role,
    thus minimizing the downtime associated with the outage, and preventing any data
    loss.


    A standby database is initially created from a backup copy of the primary database.
    Once created, Oracle Data Guard automatically maintains the standby database as
    a synchronized copy of the primary database by transmitting primary database redo
    to the standby system and then applying the redo to the standby database.


    A physical standby database provides a physically identical copy of the primary
    database, with on-disk database structures that are identical to the primary database
    on a block-for-block basis. The database schema, including indexes, is the same.


    A logical standby database contains the same logical information as the production
    database, although the physical organization and structure of the data can be
    different.


    Using Oracle Data Guard, the role of a database can be switched from a primary
    role to a standby role and vice versa, ensuring no data loss in the process, and
    minimizing downtime. There are two kinds of role transitions: a switchover and
    a failover.


    # 9.2 Oracle Data Guard Broker


    Oracle Data Guard Broker is a distributed management framework that automates
    and centralizes the creation, maintenance, and monitoring of Oracle Data Guard
    configurations. All management operations can be performed through Oracle Enterprise
    Manager, which uses the Broker, or through the Broker''s specialized command-line
    interface (DGMRL). Oracle Data Guard Broker'
  - '[PAGE 190]


    Broker 11g also enables database failover for Oracle Data Guard configurations
    using either Maximum Availability or Maximum Performance modes.


    # 9.3 Oracle Data Guard benefits


    +   1. Disaster recovery and high availability

    Oracle Data Guard provides an efficient and comprehensive disaster recovery and
    high availability solution. Automatic failover and easy-to-manage switchover capabilities
    between primary and standby databases, minimizing the downtime of the primary
    database for planned and unplanned outages.


    +   2. Complete data protection

    A standby database also provides an effective safeguard against data corruption
    and user errors. Storage level corruption on the primary database does not propagate
    to the standby database. Similarly, logical corruptions or user errors that cause
    the primary database to be permanently damaged can be resolved. Finally, the redo
    data is validated at the time it is received at the standby database and further
    when applied to the standby database.


    +   3. Efficient utilization of system resources

    A physical standby database can be used for backups and read-only reporting, reducing
    the primary database workload and saving valuable CPU and I/O cycles. A physical
    standby database can be easily converted back and forth between a physical standby
    and an open read/write database, without compromising data protection. A logical
    standby database enables read-write access to a synchronized standby database,
    adding local tables to the standby database that can also be updated, or creating
    additional indexes to optimize read performance.


    +   4. Flexibility in data protection to balance availability against performance
    requirements

    Oracle Data Guard offers the maximum protection, maximum availability, and maximum
    performance modes to help enterprises balance data availability against system
    performance requirements.'
  - '[PAGE 191]


    +   5. Protection from communication failures


    If network connectivity is lost between the primary and one or more standby databases,
    redo data cannot be sent from the primary to those standby databases. Once connectivity
    is re-established, the missing redo data is automatically detected by Oracle Data
    Guard and the necessary archive logs are automatically transmitted to the standby
    databases. The standby databases are resynchronized with the primary database,
    with no manual intervention by the administrator.


    +   6. Centralized and simple management


    Oracle Data Guard Broker automates the management and monitoring tasks across
    the multiple databases in an Oracle Data Guard configuration. Administrators may
    use either Oracle Enterprise Manager or the Broker''s specialized command-line
    interface (DGRL) to take advantage of this integrated management framework.


    +   7. Integrated with Oracle database


    Oracle Data Guard is available as an integrated feature of the Oracle Database
    (Enterprise Edition) at no extra cost.


    # 9.4 Steps to creating an Oracle Data Guard solution


    The steps we executed were:


    +   - Install the Oracle Binaries.

    - Create a database on a production node by using DBCA.

    - Prepare a production database for copy.

    - Copy a database to standby node.

    - Set up the standby database.

    - Start the physical standby database.

    - Test the switchover process.


    The document we followed was:


    +   - Oracle Data Guard Concepts and Administration 10g Release 2 (10.2), B14239-04

    - MetaLink: 232240.1 Performing switchover in Oracle Data Guard Configuration

    - Oracle Database 10g High Availability with RAC, Flashback & Oracle Data Guard'
