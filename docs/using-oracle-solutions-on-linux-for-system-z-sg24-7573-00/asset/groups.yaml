    \n图 7-9 源到目标卷的 FLASHCOPY\n\n- 4. z/VM LPAR 中的 CMS 服务机在预设时间从远程系统以 root 用户身份向每台\
    \ Linux 机器发布控制台命令。远程系统是一个服务 LPAR。\n    - a. 服务机 SIGBKUP 由基于计时器的程序作为 WAKEUP 启动。\n\
    \    - b. 使用 CP 次级控制台输入功能，通过 CP SEND 命令向每个待备份的 Linux 客户发布命令。\n- 2. Linux 机器处理控制台命令\
