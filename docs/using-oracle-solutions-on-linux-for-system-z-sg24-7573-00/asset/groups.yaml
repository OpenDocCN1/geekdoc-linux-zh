    ## 4.7.1 Getting started with Oracle

    Once the infrastructure is set up, it is time to:


    1. Download files from OTN at http://otn.oracle.com.

    2. Select Database -> 10g -> Download the following:

    - 10r2_linux.zip

    - 10r2_clusterware.zip


    ## 4.7.2 Cluster Verification Utility

    The Cluster Verification Utility (CVU) is a validation tool that you can use to
    check whether your cluster is properly configured, to avoid installation failures.
    This must run (stage-pre) successfully.


    The `crs_stat` command provides view of resources controlled by CRS, such as:

    - Global services daemon (GSD)

    - Oracle Notification Service (ONS)

    - Instances

    - Listeners

    - Cluster Virtual addresses (VIP)


    The `checkcrs` command checks the cluster components. The `crs_stat -t` option
    gives a list of the contents


    ## 4.7.3 Note on LVM

    Oracle''s statement that they do not support LVM for RAC does not apply to Linux
    System z.


    Oracle does not support LVM with RAC because it does not have clustering capabilities.
    This has led to some confusion regarding IBM System z, as we use LVM for clustering
    to create one large volume from several ECKD devices. For example, if you have
    2 GB drives and you need an 8 GB drive to install Oracle Clusterware and binaries
    on each node, you can use LVM to create one larger volume.


    ## 4.8 More information about Oracle RAC

    The details of the complete installation process have already been documented
    in several IBM Redbooks publications and white papers so the content is not duplicated
    here. This chapter highlights the environment setup.


    For more information about Oracle for System z, refer to these books, which can
    be found at http://www.redbooks.ibm.com:


    - Experiences with Oracle 10g Database for Linux on zSeries, SG24-6482

    - Experiences with Oracle@ 10gR2 Solutions for Linux for IBM System z, SG24-7191


    This covers a RAC on Red Hat 4 installation.


    Also, see the following white paper, which can be found at http://www.oracleracs.org:


    Building an Oracle RAC 10g R2 cluster for Linux for System z

