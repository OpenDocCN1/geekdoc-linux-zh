    ISQL. See Figure 3-24 on page 56 and Figure 3-27 on page 59 where we used these
    Web sites.


    The Oracle Listener should also be running at the completion of the installation.
    Enter the command lsnrctl status and you should get a message indicating that
    the listener is up for the database. You start and stop the listener by entering
    the following command:


    ```

    lsnrctl {start, stop}

    ```


    To restart the database, issue the following commands:


    ```


    sqlplus ''/as sysdba''

    SQL>startup

    ```


    At this point, you have a running database.


    > **Note 1:** Our installation of Oracle did not necessarily follow the Oracle
    Flexible Architecture (OFA). The Linux virtual machines we used were used for
    several projects and we did not have the flexibility to continually change Linux
    configurations to meet the OFA recommendations. Your installation should follow
    the best practices used by your organization to install Oracle products. Our installation
    process does follow the Oracle documentation for process and parameters and as
    such indicate how a successful installation would appear.


