    # # Preface


    Linux® on System z™ offers many advantages to customers who rely upon the IBM®
    mainframe systems to run their businesses. Linux for System z takes advantage
    of the qualities of service in the System z hardware and in z/VM®, making it a
    robust industrial strength Linux. This provides an excellent platform for hosting
    Oracle® solutions that run in your enterprise.


    This IBM Redbooks® publication describes experiences gained while installing and
    testing several Oracle features and solutions, such as:


    +   - Oracle Data Guard


    +   - IBM WebSphere® Application Server connecting to an Oracle database on Linux
    for System z


    +   - Oracle BIEE connecting to an Oracle database on Linux for System z


    +   - Oracle Data Pump


    It also includes many hints and tips on running Oracle products on IBM System
    z with Linux and z/VM.


    The audience for this book includes database consultants, installers, administrators,
    and system programmers. This is not meant to replace Oracle documentation. It
    is just our experiences with installing and using Oracle products.


    # # The team that wrote this book


    This book was produced by a team of specialists from around the world at the International
    Technical Support Organization, Poughkeepsie Center.


    Kathryn Arrell is an Oracle Specialist at the IBM/Oracle International Competency
    Center at IBM San Mateo. Previously she worked as an ERP specialist at the ITSO
    in Poughkeepsie, New York.


    Dennis Dutcavich is a System z Oracle Specialist in IBM Sales and Distribution
    in the Americas. He supports Linux for System z for presales opportunities.'
