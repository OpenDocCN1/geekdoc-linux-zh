    |---|---|---|\n| z/VM Linux guests on different physical machines | GlGigabit\
    \ OSA card | OSA card |\n\n## 4.3 Oracle 10g RAC on IBM System z disk storage\
    \ options\n\nThe IBM System z platform supports many disk configurations for installing\
    \ and running a 10g Oracle RAC system under z/VM Linux. This section will explore\
    \ some of these storage options as well as providing some analysis on which options\
    \ may fit your environment best.\n\n### 4.3.1 z/VM disk options\n\nOne important\
    \ consideration when setting up an Oracle database on IBM System is disk storage.\
    \ It is important for the DBA to understand the underlying disk infrastructure\
    \ in order to tune and maintain the system efficiently.\n\nWith z/VM Linux, there\
    \ are two types of disk storage that are typically used. Disk applications can\
    \ use either SCSI storage devices utilizing fixed (512-byte) blocks or Extended\
    \ Count Key Data (ECKD) disk devices. These disks can then be connected by the\
    \ following connection technologies: Enterprise System Connection (ESCON®), Fiber\
    \ Connector (FICON®), or Fibre Channel Protocol (FCP).\n\nFCP/SCSI devices can\
    \ be faster than FICON/ECKD devices. One approach is to put large database files\
    \ on FCP/SCSI devices, and the Linux system and Oracle binaries on the FICON/ECKD\
    \ devices.\n\nYou cannot install Linux on an all-FCP/SCSI partition. System z\
    \ requires at least one ECKD disk to install the operating system.\n\nWith FICON/ECKD\
    \ storage, you do not need to set up multipathing on the Linux guest, as it can\
    \ be provided by the channel subsystem with multiple path groups. When using FCP/SCSI\
    \ disk, we recommend implementing DM multipathing to provide the necessary fault\
    \ tolerance. In order for Oracle ASM to utilize multipathing, the DM multipath\
    \ devices must be specified (as opposed to the FCP/SCSI device) when assigning\
    \ the disk in Oracle.\n\nAnother consideration with FCP/SCSI disks is FCP channels.\
    \ With Oracle RAC, the SAN LUNs can be shared across Linux guests, but each guest\
    \ must use a different FCP channel (or group of FCP channels) if DM multipathing\
    \ is implemented. This may cause concerns if there is any limitation on the number\
    \ of FCP channels that are available.\n\nCustomers implementing FCP disks may\
    \ also want to consider N-Port Virtualization. With N-Port Virtualization, LUNs\
    \ can be assigned directly to guests rather than all the guests running under\
    \ VM. N-Port Virtualization is first supported on the IBM System z9, and not on\
    \ the z990 or z980 models. See Fibre Channel Protocol for Linux and vVM on IBM\
    \ System z, SG24-7266 for further details.\n\nWhen using SAN/SCSI storage, it\
    \ is very important to use disks from several arrays and from all clusters. This\
    \ will provide better I/O concurrency and load balancing. Figure 4-2 illustrates\
    \ the correct way to assign disks. The incorrect way is to allocate all the storage\
    \ in one rank in sequential order, for example, 5100 to 510F.\n\n| FCP CHDR |\
    \ FCP CHDR | FCP CHDR | FCP CHDR | FCP CHDR | FCP CHDR |\n|---|---|---|---|---|---|\n\
    | | | | | | CHIDs - the FICON Express card supports 2 ports, either FCP or FICON\
    \ |\n| | | | | | |\n| FICON/FCP Switch | | | | | |\n| HA Bay 1 | HA Bay 2 | HA\
    \ Bay 3 | HA Bay 4 | | |\n| Device Adapter | Rank 1 | Rank 2 | Device Adapter\
    \ | | |\n| | Rank 9 | Rank 10 | | | |\n| Device Adapter | Rank 3 | Rank 4 | Device\
    \ Adapter | | |\n| Device Adapter | Rank 5 | Rank 6 | Device Adapter | | |\n|\
    \ | Rank 13 | Rank 14 | | | |\n| Device Adapter | Rank 7 | Rank 8 | Device Adapter\
    \ | | |\n| | Rank 15 | Rank 16 | | | |\n\n- Host Adapter (HA) supporting FCP (FCP\
    \ port): each host adapter, organized in 4 bays, 4 ports each divided into two\
    \ Clusters, caches organized per cluster!\n- Device Adapter Pairs (DA): each one\
    \ supports two loops\n- Disks are organized in ranks: each rank (8 physical disks)\
    \ implements one RAID 5 array (with logical disks)\n\nFigure 4-2 Correct way to\
    \ allocate disks\n\n> *Source: Performance experience with Databases on Linux\
    \ for IBM System z, by Kammerer, found at http://www.ibm.com/developerworks/linux/linux390/index.html.\n\
    \nLinux's Logical Volume Management (LVM) and Oracle's Automatic Storage Management\
    \ (ASM) are both dasd aggregate stripping and mirroring utilities. You should\
    \ use one or the other when setting up storage for an Oracle database.\n\nWhen\
    \ using LVM, the recommendation for stripping should be used:\n- Good stripes\
    \ are 32 KB and 64 KB for data warehouses, 16 KB or 8 KB for high online transaction\
    \ processing databases (OLTP).\n\n### 4.2 Setting up disks between separate z9\
    \ machines\n\nTypically, when setting up disks between z9 machines, the first\
    \ Linux guest owns the disks in read/write mode, while the second guest lists\
    \ the disks in read/write.\n\nBecause the Linux guests are on two different z9\
    \ machines, the directory entries for both virtual machines will use dedicated\
    \ statements to define the devices being shared. For example, the first node would\
    \ have 0340:1F1 in the directory entry to define the virtual device, and the second\
    \ node would have 0340:2F1. It is important to let CP know that the physical devices\
    \ are shared with another system. This is done through the system config file\
    \ and device statement.\n\n```\ndevice xxxx-yyyy Type DasD Shared MDC OFF\n```\n\
    \nIn this statement, xxxx-yyyy is the range of device addresses that are shared\
    \ between the two z9 machines. Because the devices are shared, we recommend making\
    \ sure that each system does not cache any of the I/Os, so you should use MDC\
    \ OFF. Having the devices dedicated means they are ineligible for a minidisk.\
    \ Dedicated to a virtual machine means that it is not available for any other\
    \ virtual machine under z/VM. It is not possible to mix minidisks and dedicated\
    \ devices. In order to use minidisks, a device needs to be attached to the system.\
    \ When a device is dedicated, it is attached to a particular virtual machine.\n\
    \n### 4.3.3 File system setup\n\nOracle under zVM Linux has various options available\
    \ for setting up the storage needed to run Oracle RAC. Several file system groups\
    \ are required to run Oracle. These include:\n- Standard operating system disk(s)\
    \ for each node in SUSE/Red Hat\n- Swap disk for each node in the cluster\n- Local\
    \ disk for the Oracle Binaries, patches, and Oracle logs on each node\n- Shared\
    \ disk between the Oracle RAC nodes for database files\n\nThe standard operating\
    \ system disk will require an additional 400 MB free /tmp to install. Typically,\
    \ this should be a size of at least 2.1 GB.\n\nFigure 4-3 shows a sample RAC file\
    \ system devices setup.\n\n![](img/5b458d26d6ded58c4d2c82af59a3d71c_95_0.png)\n\
    \n 4-3 Sample RAC file system device setup The first Linux guest node owns the\
    \ disks in read/write mode, while the second guest links to the disks in read/write\
    \ mode.\n\n### 4.3.4 Linux swapping recommendations\n\nSizing Linux swapping on\
    \ z/VM environments correctly is very important, or the performance of the system\
    \ will diminish.\n\nSetting up a small virtual disk in storage (VDISK) and a minidisk\
    \ with the higher priority on the VDISK can provide a method for sizing memory\
    \ for Oracle and the Linux virtual machine. If there is paging to the second paging\
    \ disk, then you should consider adding memory to Linux or reduce the Oracle SGA/PGA.\
    \ Some swap to the VDISK is okay, but extensive swapping the minidisk is a sign\
    \ that memory is not sized correctly.\n\nSee 5.3.2,\"Swap space for Linux\" on\
    \ page 92 for more swap space recommendations.\n\n### 4.3.5 Oracle binaries installation\n\
    \nWhen installing Oracle RAC on IBM z, several independent sets of Oracle binaries\
    \ must be installed for Oracle Clusterware and the Oracle database software to\
    \ function properly. From an Oracle perspective, these are typically called ORACLE_HOME\
    \ and CRS_HOME.\n\nYou must install the Oracle Clusterware in a separate Oracle\
    \ Home, which typically uses about 1.5 GB of storage. The Oracle Home for the\
    \ RAC database will need another 2.0 GB of storage. Oracle also advises when using\
    \ ASM disk storage (which is fairly typical for Oracle RAC) to have another Oracle\
    \ Home for it.\n\nThe requirement of another Oracle home for ASM binaries is not\
    \ mandatory, but makes things easier for database patching since the Oracle ASM\
    \ set of binaries can be patched while the database is running, reducing the required\
    \ downtime for the node.\n\nSpace is also needed for the alert logs, trace files,\
    \ database patches, and the Oracle install media zip files, which typically a\
    \ size of 15-20 GB is used on each node for installing the Oracle software.\n"
