    ## 10.6 准备进行 Data Pump 迁移


    接的流程是使用 Data Pump 从 z/OS 上的 Oracle 导出数据库，然后使用 Data Pump 将数据库导入到运行在 Linux for System
    z 上的 Oracle 实例中。


    ## 10.6.1 Data Pump 导出和日志文件


    包含 Data Pump Export 写入 Data Pump Import 读取的数据库数据的文件称为导出文件或转储文件（dump file）。虽然在概念上与
    Export 和 Import 工具的导出文件相似，但这两种类型不可互换。例如，你不能用 Data Pump Import 读取普通的 Export 文件，也不能用普通的
    Import 读取 Data Pump Export 文件。


    除了写入或读取导出文件外，Data Pump Export 或 Import 的执行通常会写入日志文件。这只是记录处理细节的文本日志。


    在 z/OS 上，Data Pump Export 和 Import 使用的导出和日志文件必须是 HFS 系统文件；它们不能是 z/OS 数据集。由于 Data
    Pump 导出和日志处理是在 Oracle 数据库服务器上完成的，而不是客户端作业或会话，因此对这两类文件的访问由数据库管理员创建的数据库目录对象控制。虽然对于
    HFS 文件和数据集都有相应形式的目录对象，但在 Data Pump 操作中，只能使用 HFS 形式的目录对象。


    当我们尝试使用 Data Pump 进行全数据库导出时，在导入侧发生了失败。解决方案是包含参数 `compression=none`。这在 Metal Note
