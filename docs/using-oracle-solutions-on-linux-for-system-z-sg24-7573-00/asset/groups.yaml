    ## 4.3 IBM System z 上的 Oracle 10g RAC 存储选项


    IBM System z 平台为在 z/VM Linux 下安装和运行 10g Oracle RAC 系统提供了多种磁盘配置。本节将探讨其中的一些存储选项，并对哪些选项可能最适合您的环境提供分析。


    ### 4.3.1 z/VM 磁盘选项


    在 IBM System 上设置 Oracle 数据库时，磁盘存储是一个重要的考虑因素。DBA 必须理解底层的磁盘基础设施，以便高效地调优和维护系统。


    在 z/VM Linux 中，通常使用两种类型的磁盘存储。磁盘应用程序可以使用利用固定（512 字节）块的 SCSI 存储设备，也可以使用扩展计数键数据 (ECKD)
    磁盘设备。这些磁盘可以通过以下连接技术连接：企业级系统连接 (ESCON®)、光纤连接器 (FICON®) 或光纤通道协议 (FCP)。


    FCP/SCSI 设备可能比 FICON/ECKD 设备更快。一种方法是将大型数据库文件放在 FCP/SCSI 设备上，将 Linux 系统和 Oracle
    二进制文件放在 FICON/ECKD 设备上。


    您无法在全 FCP/SCSI 分区上安装 Linux。System z 至少需要一个 ECKD 磁盘来安装操作系统。


    使用 FICON/ECKD 存储时，您不需要在 Linux 虚拟机上设置多路，因为通道子系统可以提供带有多个路径组的通道。当使用 FCP/SCSI 磁盘时，我们建议实现
    DM 多路以提供必要的容错能力。为了让 Oracle ASM 利用多路，在 Oracle 中 分配磁盘时，必须指定 DM 多路设备（而不是 FCP/SCSI
    设备）。


    FCP/SCSI 磁盘的另一个考虑因素是 FCP 通道。在 Oracle RAC 中，SAN LUN 可以在 Linux 虚拟机之间共享，但如果实现了 DM
    多路，每个虚拟机都必须使用不同的 FCP 通道（或 FCP 通道组）。如果可用的 FCP 通道数量存在限制，这可能会引起关注。


    实施 FCP 磁盘的客户可能还想考虑 N 端口虚拟化。通过 N 端口虚拟化，LUN 可以直接分配给虚拟机，而不是所有运行在 VM 下的虚拟机。N 端口虚拟化首次在
    IBM System z9 上支持，不支持 z990 或 z980 型号。更多详情参见《Fibre Channel Protocol for Linux and
    vVM on IBM System z, SG24-7266》。


    使用 SAN/SCSI 存储时，使用来自多个阵列和所有集群的磁盘非常重要。这将提供更好的 I/O 并发和负载均衡。图 4-2 展示了分配磁盘的正确方法。错误的方法是按顺序在一个
    Rank 中分配所有存储，例如从 5100 到 510F。


    | FCP CHDR | FCP CHDR | FCP CHDR | FCP CHDR | FCP CHDR | FCP CHDR |

    |---|---|---|---|---|---|

