    | 2 | | ONLINE_LOGFILE | PRIMARY_ROLE | trade2 |


    ## ALTER SYSTEM to set the flash recovery


    On the physical standby database that will be activated for read/write access,
    you set the following initialization parameters to ensure a guaranteed restore
    point can be created. This sets up the flash recovery area.


    ```sql

    SQL> ALTER SYSTEM SET DB_RECOVERY_FILE_DEST_SIZE=2G;

    ```


    ```sql

    SQL> ALTER SYSTEM SET DB_RECOVERY_FILE_DEST=''/oracle/10gr2/flash_recovery_area/TRADEDB;

    ```


    ```sql

    SQL> SHOW PARAMETER DB_RECOVERY_FILE_DEST

    ```


    | NAME | VALUE |

    | --- | --- |

    | db_recovery_file_dest | string | /oracle/10gr2/flash_recovery_area/TRADEDB |

    | db_recovery_file_dest_size | big integer | 2G |


    ```sql

    SQL> SHUTDOWN IMMEDIATE

    SQL> STARTUP MOUNT

    SQL> ALTER DATABASE FLASHBACK ON;

    ```


    ```sql

    SQL> ALTER DATABASE OPEN;

    ```


