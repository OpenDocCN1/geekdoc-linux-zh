    ## 10.6 Preparing for Data Pump


    The next process was to use Data Pump to export the database from Oracle on z/OS
    and then import the database using Data Pump to an Oracle instance running on
    Linux for System z.


    ## 10.6.1 Data Pump Export and log files


    The file that contains the database data written by Data Pump Export and read
    by Data Pump Import is called an export file or dump file. While conceptually
    similar to the export files of the Export and Import utilities, the two types
    are not interchangeable. For example, you cannot read a plain Export file with
    Data Pump Import and you cannot read a Data Pump Export file with plain Import.


    Besides writing or reading an export file, the execution of Data Pump Export or
    Import normally writes a log file. This is just a text log reporting processing
    details.


    On z/OS, the export and log files used by Data Pump Export and Import must be
    HFS system files; they cannot be z/OS data sets. Because Data Pump export and
    log file processing is done in the Oracle database server rather than the client
    job or session, access to both types of file is controlled with database directory
    objects, which are created by a database administrator. Although there are forms
    of a directory object for both HFS files and data sets, only the HFS form of a
    directory object can be used in a Data Pump operation.


    When we tried to do a complete database export with Data Pump, we had a failure
    on the import side. The solution was to include the parameter compression=none.
    This is explained in Metal Note 457255.1, as shown in Example 10-4.


    ```

