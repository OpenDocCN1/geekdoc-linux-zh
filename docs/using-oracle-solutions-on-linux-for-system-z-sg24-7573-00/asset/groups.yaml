    # 11.2.4 References for LDAP on z/VM V5.3


    These documents were used to implement the tasks in this section:


    +   * Security on z/VM, SG24-7471

    * z/VM TCP/IP LDAP Administration Guide, SC24-6140

    * z/VM TCP/IP Planning and Customization Guide, SC24-6125

    * z/VM TCP/IP User''s Guide, SC24-6127

    * z/VM RACF Security Server Command Language Reference, SC24-6144


    # 11.3 FreeRADIUS for Linux for System z


    RADIUS is a client-server protocol that can be used by the Oracle Advanced Security
    Option (ASO) to do external authentication. There are several RADIUS servers available
    and they can be found by searching the Internet. The FreeRADIUS server available
    from http://www.freeradius.org was installed and configured on SLES9 for System
    z. The SLES9 distribution CDs contain the freeradius-1.0.5-2.4 package, and this
    is the package that was used.


    # 11.3.1 FreeRADIUS installation


    A standard rpm -ivh install of the freeradius-1.0.5-2.4 package was done.


    # 11.3.2 FreeRADIUS configuration


    FreeRADIUS was configured to operate as a server for the Oracle Database and as
    a client to the z/VM LDAP server. Three FreeRADIUS configuration files, radiusd.conf,
    clients.conf, and users, were modified to support the configurations'
- md: "\ndiscussed in this document. The following details show the specific pieces\
    \ of each file that was changed from the FreeRADIUS default values. After the\
    \ installation of FreeRADIUS, these file are all located in /etc/raddb directory.\n\
    \n## 11.3.3 FreeRADIUS configuration radiusd.conf file\n\nThe radiusd.conf file\
    \ was set up in different ways to show three ways to use the z/VM LDAP server\
    \ for user authentication from FreeRADIUS. In all cases, the z/VM LDAP server\
    \ was identified by a network name and the default port of 389. The vmlinux9 name\
    \ used here was at IP address 9.12.4.92. It was used in the discussion above and\
    \ either can be used in either place.\n\nThe first two Clients, icucker1 and icucser2,\
    \ are in the z/VM LDAP under ou=icc, o=ibm in the Directory Information Tree (DIT).\
    \ This hierarchy value was used as FreeRADIUS basedn in the radiusd.conf file.\
    \ The based is where the search will start in the LDAP directory for the Oracle\
    \ users. The Oracle name, icucker1, has a DN of cn=icucker1, ou=icc, and a password\
    \ of icuckerx1. The details of setting up Oracle for external authentication are\
    \ given in later sections. Also, what is shown in Example 11-2 and Example 11-3\
    \ on page 210 is just a snippet of the FreeRADIUS configuration file.\n\nIf the\
    \ z/VM LDAP server allows anonymous binds with the parameter setting, allowAnonymousBinds\
    \ on the DS CONF file, then the following will allow FreeRADIUS to connect to\
    \ the z/VM LDAP Server for password authentication of the Oracle client.\n\n>\
    \ Example 11-2 Radius.conf snippet part 1\n\n```\nldap\n  server = \"vmlinux9.itso.ibm.com\"\
    \n  basedn = \"ou=icc,o=ibm\"\n  password_attribute = \"userPassword\"\n  filter\
    \ = \"(uid={Stripped-User-Name:%{User-Name}})\"\n\nAuth-Type LDAP {\n  ldap\n\
    }\n```\n\nIf z/VM LDAP does not allow anonymous binds and has the parameter setting\
    \ \"allowAnonymousBinds off\", then FreeRADIUS needs to have a user ID and password\
    \ (ldap4/ldapmx) that it can send to the z/VM LDAP server. This allows it to bind\
    \ to the z/VM LDAP server before the search for the password for authentication\
    \ of the Oracle user is done. The user ID/password is provided in the configuration\
    \ file with the identity and password settings.\n\nChapter 11. Using z/VM 5.3\
    \ LDAP Authentication for Oracle users 209\n\npassword is clear text, so appropriate\
    \ permission settings need to be maintained in the configuration file.\n\nExample\
    \ 11-3 Radius.conf snippet part 2\n\n```\nldap (\n  server = \"vminux9.itso.ibm.com\"\
    \n  identity = \"cn=ldapadm4,o=ibm\"\n  password = \"ldapadmx\"\n  basedn = \"\
    ou=icc,o=ibm\"\n  password_attribute = \"userPassword\"\n  filter = \"(uid={Stripped-User-Name}-%{UserName})\"\
    \n)\nAuth-Type LDAP (\n  ldap\n)\n```\n\nThe z/VM LDAP server is using the RACF\
    \ SDBM database to connect Oracle user names and passwords, then a slightly different\
    \ radius.conf file is needed, as shown in Example 11-4. For RACF users, the LDAP\
    \ DN is fixed to a racifad, and a suffix. It is also possible to maintain RACF\
    \ group and connection information in the SDBM back end, but they are not used\
    \ or discussed here. The DN for Oracle DN, icraft1, is DN: racifad=icraft1, profileType=user,cn=racfvm,o=ibm,c=us.\
    \ The suffix is cn-racfvm,o=ibm,c=us.\nldapadm2 is a RACF user ID that can find\
    \ the z/VM LDAP server and search RACF for the icraft1 user name. As above, the\
    \ password is clear text, so appropriate permission settings needs to be maintained\
    \ on the configuration file.\n\nExample 11-4 Radius.conf snippet part 3\n\n```\n\
    ldap (\n  server = \"vminux9.itso.ibm.com\"\n  identity =\n  racifad=ldapadm2,profiletype=user,cn=racfvm,o=ibm,c=us\"\
    \n  password = ldap00\n  basedn = \"racifad={Stripped-User-Name}-%{User-Name}},profiletype=user,cn=racfvm,o=ibm,c=us\"\
    \n  password_attribute = \"userPassword\"\n  filter = \"(objectclass=*\"\n)\n\
    Auth-Type LDAP (\n  ldap\n)\n```\n\n## 11.3.4 FreeRadius Configuration clients.conf\n\
    \nAn entry was added to the clients.conf file to identify the network name of\
    \ the Oracle Database server that will connect to FreeRADIUS as a RADIUS client\
    \ to do external authentication for Oracle user names. The default port is 1812.\
    \ The Radius Server secret is specified in this entry. This is the key that the\
    \ Database and FreeRADIUS use to encrypt and decrypt the Oracle password that\
    \ is passed between FreeRADIUS and Oracle. The secret is made available to Oracle\
    \ when it is set up for external authentication and the detail is provided in\
    \ a later section.\n\n> Note: There are various descriptions of the specification\
    \ of the Radius secret and it took some experimenting before a key was found that\
    \ successfully work between the Oracle Database and FreeRADIUS. The encrypt/decrypt\
    \ between the Oracle Database and FreeRADIUS did not work if the key is longer\
    \ than 15.\n\n```\nclient = linux25.itso.ibm.com\n  secret = testing123\n}\n```\n\
    \n## 11.3.5 FreeRadius Configuration users\n\nThe third file, identifies the Oracle\
    \ users that will use FreeRADIUS. When you choose external authentication for\
    \ a user, the user account is maintained by Oracle, but by password administration\
    \ and user authentication is performed by an external service or FreeRADIUS in\
    \ combination with the z/VM LDAP server here.\n\n```\nuser1\nuser2\n```\n"
  mdcn: "\n本文讨论了相关内容。以下详细显示了每个文件相对于 FreeRADIUS 默认值所更改的具体部分。安装 FreeRADIUS 后，这些文件均位于\
    \ `/etc/raddb` 目录。\n\n## 11.3.3 FreeRADIUS 配置 radiusd.conf 文件\n\nradiusd.conf\
    \ 文件以不同的方式进行设置，展示了三种通过 FreeRADIUS 使用 z/VM LDAP 服务器进行用户身份验证的方法。在所有情况下，z/VM LDAP\
    \ 服务器都通过网络名称和默认端口 389 进行标识。此处使用的 vmlinux9 名称对应的 IP 地址为 9.12.4.92。它在上面的讨论中使用，也可以在任何位置使用。\n\
    \n前两个客户端 icucker1 和 icucser2 位于目录信息树 (DIT) 中 z/VM LDAP 下的 ou=icc, o=ibm。此层级值被用作\
    \ radiusd.conf 文件中的 FreeRADIUS `basedn`。basedn 是 LDAP 目录中搜索 Oracle 用户的起始位置。Oracle\
    \ 用户 icucker1 的 DN 为 cn=icucker1, ou=icc，密码为 icuckerx1。后续章节将提供设置 Oracle 外部身份验证的细节。此外，第\
    \ 210 页的示例 11-2 和示例 11-3 显示的只是 FreeRADIUS 配置文件的片段。\n\n如果 z/VM LDAP 服务器通过 DS CONF\
    \ 文件中的参数 `allowAnonymousBinds` 匿名绑定，则以下配置允许 FreeRADIUS 连接到 z/VM LDAP 服务器对 Oracle\
    \ 客户端进行密码验证。\n\n> 示例 11-2 Radius.conf 代码片段部分 1\n\n```\nldap\n  server = \"vmlinux9.itso.ibm.com\"\
    \n  basedn = \"ou=icc,o=ibm\"\n  password_attribute = \"userPassword\"\n  filter\
    \ = \"(uid={Stripped-User-Name:%{User-Name}})\"\n\nAuth-Type LDAP {\n  ldap\n\
    }\n```\n\n如果 z/VM LDAP 不允许匿名绑定且参数设置为 \"allowAnonymousBinds off\"，则 FreeRADIUS\
    \ 需要一个可以发送到 z/VM LDAP 服务器的用户 ID 和密码 (ldap4/ldapmx)。这允许它在执行 Oracle 用户身份验证的密码搜索之前，先绑定到\
    \ z/VM LDAP 服务器。用户 ID/密码通过配置文件中的身份和密码设置提供。\n\n第 11 章 使用 z/VM 5.3 LDAP 进行 Oracle\
    \ 用户身份验证 209 页\n\n密码是明文，因此需要在配置文件中维持适当的权限设置。\n\n示例 11-3 Radius.conf 代码片段部分 2\n\
    \n```\nldap (\n  server = \"vminux9.itso.ibm.com\"\n  identity = \"cn=ldapadm4,o=ibm\"\
    \n  password = \"ldapadmx\"\n  basedn = \"ou=icc,o=ibm\"\n  password_attribute\
    \ = \"userPassword\"\n  filter = \"(uid={Stripped-User-Name}-%{UserName})\"\n\
    )\nAuth-Type LDAP (\n  ldap\n)\n```\n\nz/VM LDAP 服务器使用 RACF SDBM 数据库来连接 Oracle\
    \ 用户名和密码，因此需要略有不同的 radius.conf 文件，如示例 11-4 所示。对于 RACF 用户，LDAP DN 固定为 racifad 以及一个后缀。也可以在\
    \ SDBM 后端维护 RACF 组和连接信息，但此处未对其使用或讨论这些内容。Oracle DN icraft1 的 DN 为：racifad=icraft1,\
    \ profileType=user,cn=racfvm,o=ibm,c=us。后缀为 cn-racfvm,o=ibm,c=us。ldapadm2 是一个\
    \ RACF 用户 ID，可以找到 z/VM LDAP 服务器并在 RACF 中搜索 icraft1 用户名。如上，密码是明文，因此需要在配置文件上维持适当的权限设置。\n\
    \n示例 11-4 Radius.conf 代码片段部分 3\n\n```\nldap (\n  server = \"vminux9.itso.ibm.com\"\
    \n  identity =\n  racifad=ldapadm2,profiletype=user,cn=racfvm,o=ibm,c=us\"\n \
    \ password = ldap00\n  basedn = \"racifad={Stripped-User-Name}-%{User-Name}},profiletype=user,cn=racfvm,o=ibm,c=us\"\
    \n  password_attribute = \"userPassword\"\n  filter = \"(objectclass=*\"\n)\n\
    Auth-Type LDAP (\n  ldap\n)\n```\n\n## 11.3.4 FreeRadius 配置 clients.conf\n\nclients.conf\
