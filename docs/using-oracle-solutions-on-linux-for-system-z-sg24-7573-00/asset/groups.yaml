    //*JOBPARM SYSAFF=SC53

    /*/*

    // COPYRIGHT (C) 2006 ORACLE. ALL RIGHTS RESERVED.

    ///*

    // JOB DESCRIPTION: Initialize Java VM and XML

    ///*

    ```

    ```

    ```

