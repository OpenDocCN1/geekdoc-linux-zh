- img_proc: true
  md: '# 11.3.6 FreeRADIUS debug mode


    FreeRADIUS can be started in debug mode by supplying the -X and -A options, for
    example, /usr/local/sbin/radiusd -X -A. This provides a great deal of information
    and is particularly helpful when the conf files above are changed, as much of
    the information from the files is printed when FreeRADIUS is started. In this
    mode, the information about the FreeRADIUS connections to both Oracle DB and z/VM
    LDAP is also printed.


    # 11.3.7 FreeRADIUS test driver


    FreeRADIUS provides a test driver, radtest, that is useful in testing that FreeRADIUS
    is installed and configured correctly, for example, executing /usr/local/bin/radtest
    icuser1x icuser1x 127.0.0.1 testing-123 tests that icuser1x is in the user files,
    the tests encrypt and decrypt of the password icuser1x with the secret of testing-123,
    and tests that FreeRADIUS sends the user ID/password, icuser1x/icuser1x, to z/VM
    LDAP for authentication. This example shows a local test, but if the binary is
    available, radtest can be run from a remote system. The IP address must be adjusted
    according to where the FreeRADIUS server is running.


    # 11.3.8 References for FreeRADIUS


    There is a lot of Radius Server information available on the Internet. But the
    README files, other referenced files, and comments in the configuration files
    (particularly radiusd.conf) are the best source of detailed documentation for
    FreeRADIUS.


    # 11.4 Oracle setup for external authentication


    RADIUS support is installed as a part of Oracle Advanced Security during the install
    of the Oracle Database. Remote Authentication Dial-In User Service (RADIUS) is
    a client-server security protocol that is used for authentication and access.
    Oracle Advanced Security uses this standard in a client-server network environment
    to enable use of any authentication method that supports the RADIUS protocol.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# 11.4.1 Oracle Database setup for FreeRADIUS


    After the database is installed with the advanced security option, there are three
    steps that need to be done on the Oracle Database server so that an Oracle user
    can be externally authenticated through a RADIUS server. The first step is to
    create the RADIUS secret file for the database server. The contents of the file
    must match the value specified for the secret parameter in the FreeRADIUS clients.conf
    file that was set up and described in 11.3.4, "FreeRADIUS clients.conf file" on
    page 211:


    ```

    # cat /oracle1/db1/network/radius.key

    testing-123

    ```


    The next step is to use Oracle Net Manager or directly edit the sqlnet.ora file
    so that the database server can use FreeRADIUS for external authentication. The
    FreeRADIUS server is running on network address linux20.itso.com and listening
    on port 1812. Also, sqlnet.ora contains the location of the secret:


    ```

    # /oracle1/db1/network/admin/sqlnet.ora

    # sqlnet.ora Network Configuration File:

    # /oracle1/db1/network/admin/sqlnet.ora

    # Generated by Oracle configuration tools.

    SQLNET.AUTHENTICATION_SERVICES=(BEQ,TCPS,NTS,RADIUS)

    SQLNET.RADIUS_SECRET = /oracle1/db1/network/radius

    NAMES_DIRECTORY_PATH=(TNSNAMES,EZCONNECT)

    SQLNET.RADIUS_AUTHENTICATION_TIMEOUT = 10

    SQLNET.RADIUS_AUTHENTICATION = linux20.itso.ibm.com

    SQLNET.RADIUS_AUTHENTICATION_PORT = 1812

    SQLNET.RADIUS_SEND_ACCOUNTING = OFF

    SQLNET.RADIUS_CHALLENGE_RESPONSE = OFF

    ```


    The final step on the database server to use external authentication is the Oracle
    users that will use the FreeRADIUS server. When you choose external authentication
    for a user, the user account is maintained by Oracle, but by password administration
    and user authentication is performed by an external service or FreeRADIUS in combination
    with the z/VM LDAP server here. The following statements create users who are
    identified by Oracle and authenticated by FreeRADIUS. The users created here are
    referred throughout the document as examples.


    Chapter 11. Using z/VM 5 LDAP Authentication for Oracle users 213'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'The setup used here also has the following statement, os_authent_prefix = "",
    in the Oracle Database initialization file or pfile so that there is not any prefix:


    ```

    SQL> create user icuser1 identified externally;

    User created.

    SQL> grant create session to icuser1;

    Grant succeeded.

    SQL> create user icuser2 identified externally;

    User created.

    SQL> grant create session to icuser2;

    Grant succeeded.

    SQL> create user iccrac1 identified externally;

    User created.

    SQL> grant create session to iccrac1;

    SQL>

    ```


    # 11.4.2 Oracle client


    The Oracle client installation on WIN/XP requires the selection and installation
    of the Advanced Security Option to be able to do RADIUS authentication from the
    Oracle client.


    The Oracle Net Manager is used to configure the Oracle Client to use RADIUS for
    authentication. From the local profile window, shown in Figure 11-1 on page 215,
    select Oracle Advanced Security in the drop-down menu, select the Authentication
    tab, and move RADIUS from the Available Methods pane to the Selected Methods pane.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '![](img/5b458d26d6ded58c4d2c82af59a3d71c_236_0.png)


    Figure 11-1 Oracle Advanced Security window


    This will update the client sqlnet.ora file by adding RADIUS to the SQLNET.AUTHENTICATION_SERVICES
    parameter:


    # sqlnet.ora Network Configuration File:

    C:\pt849\rawin\NETWORK\ADMIN\sqlnet.ora

    # Generated by Oracle configuration tools.

    SQLNET.AUTHENTICATION_SERVICES= (RADIUS,NTS)

    NAMES.DIRECTORY_PATH=(TNSNAMES, EZCONNECT)


    Chapter 11. Using z/VM 5.3 LDAP Authentication for Oracle users 215'
  merge: -1
  pgno: 236
- img_proc: true
  md: '# 11.4.3 Oracle Client Connection with User Name in LDBM and Password in SDBM


    At this point, the Oracle user, icucser2, can do a normal connection to the Oracle
    Database server and will be authenticated by z/VM LDAP as the back end to the
    FreeRADIUS server. The radius.conf file used is either shown in Example 11-2 on
    page 209 or Example 11-3 on page 210, depending on whether anonymous binds are
    allowed. The icucser2 is shown in the windows here and it was set up for z/VM
    LDAP native authentication, meaning that its password is in RACF and not in the
    LDBM directory. The same windows are available for icucser1 and its password is
    in the LDBM directory.


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_237_0.png)


    After entering the user name, the valid password, and the Oracle connect string,
    the user is connected to the Oracle Database, as shown in Figure 11-3.


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_237_1.png)


    If the incorrect password is entered for icucser2, the window shown in Figure
    11-4 on page 217 appears.'
  merge: -1
  pgno: 237
- img_proc: true
  md: '![](img/5b458d26d6ded58c4d2c82af59a3d71c_238_0.png)


    # 11.4.4 Oracle client connection with user name and password in SDBM


    The Oracle user, icracf1, and password, ldapxx, are in the RACF SDBM database.
    The only difference when the Oracle client is connecting to the database is icracf1/ldapxx
    is used instead of icuser1/icuser1x. The major difference is that the FreeRADIUS
    server needs to be started with a radius.conf file, shown in Example 11-4 on page
    210. The parameter settings in this file allow FreeRADIUS to bind to zVM LDAP
    with the RACF SDBM back end and do search for icracf1 in RACF for user authentication.


    # 11.4.5 Oracle references for external authentication


    +   - Oracle Database Security Guide 10g Release 2, B14266-01, June 2005

    - Oracle Database Advanced Security Administrator''s Guide, B14268-02, November
    2005'
