  md: '# Using WebSphere Application Server with Oracle 10gR2


    Chapter 11, "Using WebSphere with Oracle9i", in Experiences with Oracle for Linux
    on zSeries, SG24-6552, discussed WebSphere Application Server V4.0 using an Oracle9
    database as the repository for WebSphere Application Server. The WebSphere Application
    Server repository contains copies of the individual component configuration documents,
    but from WebSphere Application Server Version 5 onwards, the configuration information
    has been stored in XML files instead of in relational database. The application
    server''s Admin service is used to manage the configuration data in the XML files
    and to make sure it is consistent at runtime.


    To demonstrate the use of WebSphere Application Server with an Oracle database
    in this book, the IBM Trade 6 Performance Benchmark Application was installed
    with WebSphere Application Server V6.1 and the application was configured to use
    Oracle10.0.2.2 database. Trade 6 is a WebSphere Application sample application
    that is publicly available from IBM. The Trade 6 benchmark models an electronic
    stock brokerage application providing Web-based online securities trading. It
    is implemented as a 3-tier J2EE Web, utilizing an application server, a database
    server, and a Web server.'
  merge: -1
  pgno: 172
- img_proc: true
