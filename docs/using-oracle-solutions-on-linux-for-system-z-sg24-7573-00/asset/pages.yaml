    # LOG_ARCHIVE_DEST


    Set up the ARCHIVE file (where the ARCHIVE LOG file output is):


    +   Regardless of the role (primary or standby), output the ARCHIVE LOG to /oracle/trade
    on local according to log_archive_dest_1.


    +   Only in the case of the primary role should you output ARCHIVE LOG to orcl_2
    on remote according to log_archive_dest_2.


    LOG_ARCHIVE_DEST_n: Specify where the redo data is to be archived on the primary
    and standby systems.


    LOG_ARCHIVE_DEST_1: Archives redo data generated by the primary database from
    the local online redo log files to the local archived redo log files in /oracle/trade.


    LOG_ARCHIVE_DEST_2: Valid only for the primary role. This destination transmits
    redo data to the remote physical standby destination trade2.'
