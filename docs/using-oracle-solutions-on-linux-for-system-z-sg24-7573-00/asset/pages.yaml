  md: '# Using z/VM 5.3 LDAP Authentication for Oracle users


    Chapter 9, "Using Radius Server and z/OS RACF LDAP for Oracle DB user authentication",
    in Experiences with Oracle 10g Database for Linux on zSeries, SG24-6482 contains
    a discussion on the authentication of Oracle systems, using an LDAP server running
    on z/OS. This chapter parallels that discussion. The major difference is that
    the LDAP server is running on z/VM instead of z/OS.


    The Oracle Client user ID and password authentication method discussed in this
    chapter is not restricted to a particular configuration. However, the method may
    provide more utility in a z/VM environment running multiple Linux systems, where
    some of the Linux systems are running Oracle Database servers. The usefulness
    of this method may be enhanced further, as the underlying z/VM 5.3 Lightweight
    Directory Access Protocol (LDAP) support could be extended to Linux and CMS users.
    For example, the z/VM LDAP server could be used to provide a single user name
    and password for an Oracle client, a Linux user, and a CMS user.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# 11.1 Introduction


    An Oracle 10g database server was configured to do external password authentication
    of Oracle client user names and passwords. The Oracle Advanced Security Option
    (ASO) is required to be installed on both the Oracle client and database to do
    external password authentication. The sqlnet.ora files in both the database and
    client were configured to use a RADIUS server for the external authentication.
    The RADIUS server in turn was configured to use the z/VM LDAP


    Example 11-1 shows an overview of the configuration.


    Example 11-1 Overview of the configuration


    | Oracle Client ---> | Oracle DB ---> Radius Server ---> LDAP Server |

    | Win/XP | Linux25 | Linux20 z/VM |


    The Oracle database is a RADIUS client and the RADIUS server is a client to the
    z/VM 5.3 LDAP Server. The details of configuring z/VM LDAP, RADIUS, and Oracle
    for external authentication are described in the following sections.


    # 11.2 z/VM LDAP


    The LDAP data model is closely aligned with the X.500 data model. In this model,
    a directory service provides a hierarchically organized set of entities. Each
    of these entries is represented by an object class and the object classes are
    part of a schema and the schema is available to the LDAP server. The object class
    of the entry determines the set of attributes that are required to be present
    in the entry as well as the set of attributes that can optionally appear in the
    entry. An attribute is represented by attribute type and one or more values. In
    addition to the attribute type and values, each attribute has an associated syntax
    that describes the format of the attribute values. Every entry in the directory
    has a distinguished name (DN). The DN is the name that uniquely identifies an
    entry in a directory. A DN is made up of attribute=value pairs, separated by commas.
    For example:


    ```

    cn=iccuser1, ou=icc, o=ibm

    ```


    is an LDAP DN. In addition to these lines:


    ```

    DN: cn=iccuser2, ou=icc, o=ibm and DN: racfid=iccracfl,

    profiletype=user, cn=racfvm, o=ibm, c=us

    ```


    it will be in the following discussion.'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'It is assumed there is a LDAP running on a z/VM V5.3 system and the server
    can access both LDBM back ends to store and retrieve LDAP directory information.
    The GDBM back end, which can be used to implement a change log, is not discussed.
    The references given below cover up a z/VM LDAP server, the discussion here is
    about the specific configuration that needs to be done so that a communication
    path is available for user authentication between Oracle and the z/VM LDAP server.


    # 11.2.1 z/VM LDBM


    z/VM LDAP is a server function of TCP/IP provided in z/VM V5.3 and it runs as
    a virtual machine under the OPENVM SHELL. The z/VM Lightweight Access Protocol
    (LDAP) is based on a client-server model that provides client access in a central
    location. z/VM supports two back ends or databases that can contain LDAP directory
    information. The back end discussed in this section is the LDBM, which is a general
    purpose back end. It uses the z/VM CMS File System (BFS) to store directory information.
    When the z/VM LDAP server is running the LDBM maintained in storage.


    Even though it is assumed that the z/VM LDAP server is up and running, three items
    related to the server are described briefly. By default, the z/VM server configuration
    parameters are in a CMS file, DS CONF, which is located on the TCMAINT 198 minisk.
    The default can be changed by a command-line parameter when the server''s virtual
    machine is started, the default is used here. References to several parameters
    in the DS CONF file and their specific settings will be made. From CMS, the information
    in the LDBM directory is accessed and managed by LDAP utilities (commands) such
    as 1ldapadd and 1ldapsearch. These utilities are packaged as EXECs in CMS and
    the EXECs are on the TCMAINT 592 disk.


    The utilities follow the same syntax as would be if running in other systems,
    except that the names invoked are CMS EXECs, so the invocation names are eight
    characters. Thus, the EXEC name for the ldsearch is LDAPSEARCH. Also, these utilities,
    whether from CMS or Linux, are clients to the z/VM LDAP server and the client/server
    connection can be secured with SSL/TLS is not used here. Finally, access to LDAP
    directory entries and controls is controlled by the z/VM LDAP server administrator
    and Access Control Lists (ACLs). The ACLs are attributes in the directory entries
    and are managed by the LDAP utilities mentioned previously. For the discussion
    that follows, the ACL defaults are used, which means that all users can read,
    search, and compare the LDAP entries in the LDBM, but only the DN defined in the
    adminDN parameter in the DS CONF file and the DN that is propagated down the LDAP
    hierarchy to the entriesOwner can change the entry.'
  merge: -1
  pgno: 224
