  md: '# 3.3.3 Determine naming conventions


    Choose the names for ORACLE_HOME, ORACLE_SID, and so on, as shown in Table 3-1.


    Table 3-1 Names chosen for Oracle installation


    | Variable | Value | Comment |

    | --- | --- | --- |

    | ORACLE_BASE | /oradbf | Highest level directory for this Oracle installation.
    |

    | ORACLE_SID | Inx23or | Database name. |

    | ORACLE_HOME | /oradbf/product/10grR2 | Where the binaries are located. |

    | ORACLE_INVENTORY | /oradbf/oralInventory | Must not be in ORACLE_HOME but under
    ORACLE_BASE. |

    | Images directory | /oradbf/images/ | Where we put the "copy in and copy out"
    (cpio) files. |

    | Oracle db files | /oradbf/oradata | N/A. |


    We chose the directories in Table 3-1.


    To facilitate the installation, we put the following entries in the oracle users
    .file:


    ```

    export ORACLE_BASE=/oradbf

    export ORACLE_HOME=/oradbf/10grR2

    export ORACLE_INVENTORY=$ORACLE_HOME/oraInventory

    export PATH=$PATH:$ORACLE_HOME/bin

    export LD_LIBRARY_PATH=$ORACLE_HOME/lib:$ORACLE_HOME/rdbms

    export ORACLE_SID=inx23or

    ```


    And then we executed the profile by entering:


    +   -profile


    (This is a dot followed by a space, then .profile.)


    The profile does not need to be set before the installation is complete. In fact,
    according to the Oracle Installation Guide, only $ORACLE_BASE needs to be set.
    We did this for convenience, because this is the only Oracle software installed
    on this Linux installation. If you follow the Installation Guide, then you need
    to make these additions at the end of the installation.'
