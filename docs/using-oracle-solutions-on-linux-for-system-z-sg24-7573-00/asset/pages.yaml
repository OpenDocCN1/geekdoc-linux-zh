- img_proc: true
  md: 'A virtual machine connects to a VSwitch providing it has been grant authority
    by a cp command or through an ESM with either a directory statement (NICDEF or
    SPECIAL) or cp commands (DEFINE NIC and COUPLE).


    When using the NICDEF statement, the virtual NICs and coupling to the VSwitch
    are done by the one command. Example 7-4 shows an extract from a directory entry
    for DBXXUA1 virtual machine.


    # Example 7-4 NICDEF statement


    ```

    USER DBXXUA1 CHANGEIT 256M 1024M G

    INCLUDE SIGPLNX

    NICDEF E800 TYPE QDI0 DEVICES 3 LAN SYSTEM VSXXVAP

    ```


    The virtual machine is granted access to the VSwitch with the set vswitch command:


    ```

    set vswitch vsxxvap2 grant dbxxua

    ```


    The nicdef statement will define virtual NIC devices EB00, EB01, and EB02 as simulated
    QDIO, and couple them to the system defined VSwitch VSXXVAP2.


    The remaining task is to configure the device in Linux as an Ethernet device.
    The device is configured in the /etc/sysconfig/network directory. The file name
    is ifcfg-qeth-bus-ccw- prepended to the fully qualified device name, in this case,
    0.0.eb00, so: ifcfg-qeth-bus-ccw-0.0.eb00.


    A catenate (cat) command shows the contents of the file, as shown in Example 7-5


    # Example 7-5 cat command


    ```

    cat ifcfg-qeth-bus-ccw-0.0.eb00

    BOOTPROTO=''static''

    UNIQUE=''1''

    STARTMODE=''onboot''

    IPADDR=''172.27.120.157''

    MTU=''1500''

    NETMASK=''255.255.255.0''

    NETWORK=''172.27.120.0''

    BROADCAST=''172.27.120.255''

    REMOTE_IPADDR=''1''

    ```


    Assuming that this file is from a master, and the clone has no network access
    (we do not want to have a duplicate IP address), the 3270 interface will be needed
    to create the working configuration file. In the example, the IP address is changed
    from 172.27.120.157 to 172.27.120.158.'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'The Linux commands used are cat, cp, head, tail, and echo (see Example 7-6).
    The cp command will make a copy of the configuration file to a new file called
    tempemp. The head command will take the first three lines of temp and by using
    redirection will write it to a new file called newtemp. The echo command will
    write the line with the new IP address 172.27.120.157 to the newtemp file with
    the append redirection symbol. The escape character / used so that the single
    quotes are sent to the output. The tail command will take the last five lines
    from tempemp and append it to newtemp using the append redirection symbol. The
    cat command will display the contents of the newtemp file with the updated IP
    address (172.27.120.158).


    # Example 7-6 cp command


    ```

    cp ifcfg-geth-bus-ccw-0.0.eb00 tempemp

    cp ifcfg-geth-bus-ccw-0.0.eb00 tempemp

    #

    head -n 3 tempemp > newtemp

    head -n 3 tempemp > newtemp

    #

    echo IPADDR=''172.27.120.158'' >> newtemp

    echo IPADDR=''172.27.120.158'' >> newtemp

    #

    tail -n 5 tempemp >> newtemp

    tail -n 5 tempemp >> newtemp

    #

    cat newtemp

    cat newtemp

    BOOTPROTO=''static''

    UNIQUE=''

    STARTMODE=''onboot''

    IPADDR=''172.27.120.158''

    MTU=''1500''

    NETMASK=''255.255.255.0''

    NETWORK=''172.27.120.0''

    BROADCAST=''172.27.120.255''

    REMOTE_IPADDR=''

    ```


    The mv command will rename tempemp to the configuration file, ifcfg-geth-bus-ccw-0.0.eb00.
    The ifdown command will take down the eth0 interface. The ifup command will bring
    p the eth0 interface reading from the new configuration file with the IP address
    of 172.27.120.158. See Example 7-7 on page 131 for more details.'
  merge: -1
