    Added 500 MB of swap space. This is sufficient for Oracle on Linux for System
    z. Be aware that the Oracle installation document recommends 1.5 times the memory
    allocated to Linux. That is an x86 statement and we do not recommend it here.
    When the Oracle installer (the Oracle User Interface (OUI)) runs, it checks for
    installed swap space and flags this as a problem. If is the only parameter that
    it flags, then you can continue the installation. You must fix any other parameters
    that are flagged.


    # 3.2.2 The Linux environment


    The system administrator needs to set up the Linux guest with resources such as
    CPU, memory, disk, and network connectivity that are specific to the installation''s
    needs.


    We installed Red Hat AS4 Update 3, which was the current patch set at the time
    of writing. We installed Red Hat using the IBM recommended process found at:

    http://www-i28.ibm.com/developerworks/eserver/library/es-rhel-coexist/


    It is very important that you install Red Hat that you use the es-linux selections:


    +   - Legacy and Compatibility ARCH Development Support

    - Legacy Software Development

    - Compatibility ARCH Development Support


    Without these settings, it is difficult to install Oracle. The Oracle User Interface
    (OUI) might not start, and you might see Java errors or make/link errors. These
    situations are time consuming to diagnose.'
