  md: '```

    uidnumber=50002

    gidnumber=500

    homedirectory=/home/iccuser2

    loginshell=/bin/bash

    ```


    Notice that there is no password attribute and value pair in the LDBM directory
    entry. The objectclass=ibm-native Authentication is specified and its definition
    includes the ibm-native attribute. The objectclass allows the use of the attribute
    ibm-native and this is the connection to z/VM LDAP native authentication. The
    RACF ID must be added in uppercase to the directory entry; otherwise, the native
    authentication will fail.


    iccuser2 was added to z/VM RACF with the following RACF commands from CMS:


    ```

    rac au (iccuser2) pass(password)

    rac al (iccuser2) noexpired password(ldap22)

    ```


    The alteruser command was run to prevent having to change the password upon the
    first access to RACF by iccuser2.


    Native authentication using the following three parameter settings in the z/VM
    LDAP DS CON file:


    ```

    useNativeAuthchecked

    nativeUpdateAllowed on

    nativeAuthSubtree "ou=icc,o=ibm"

    ```


    # 11.2.3 z/VM SDBM


    The z/VM LDAP server provides access to RACF user information stored in the RACF
    SDBM database. RACF group and connection information is also available, but is
    not discussed in this document. SDBM is also known as the RACF database back end
    of the LDAP server. The SDBM database allows for directory authentication using
    a RACF user ID and password. z/VM RACF must be available to the LDAP server to
    communicate with RACF and the LDAP server must be configured to use SDBM. The
    format of the DN is restricted when using SDBM, as the DN must match the schema
    of the underlying RACF data. A RACF style DN for a user contains two required
    attributes plus a suffix. The required attributes are racfid and profiletype.
    For the discussion, the attribute value of the profiletype will always be user.
    In other contexts, group or connect are valid for the profiletype attribute.


    The suffix for SDBM used here is cn=racfvm, o=ibm, c=us. A complete DN for the
    Oracle user in the examples is DN: racfid=iccrac1, profiletype=user,'
