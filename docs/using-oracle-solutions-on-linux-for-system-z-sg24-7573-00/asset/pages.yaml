- img_proc: true
  md: '# Getting started using z/VM

    for Oracle Database 10gR2


    To obtain optimum performance from Oracle RDBMS when running in Linux for System
    z, the proper configuration of both Linux and z/VM is extremely important. Our
    experiences have shown that the vast majority of performance concerns were solved
    by making changes to z/VM, Linux, or the I/O subsystem.

    This chapter discusses the major areas of concern.


    +   * Sizing and tuning memory

    * CPU allocation

    * Paging, swap, and I/O considerations

    * Monitoring performance


    For more information about VM tuning recommendations, refer to:

    http://www.vm.ibm.com/perf/tips/


    This chapter was previously published in Experiences with Oracle 10g Database
    for Linux on zSeries, SG24-6482. We have updated it with current information.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# 5.1 Memory sizing and configuration


    The sizing and allocation of memory is one of the most critical areas of implementing
    Oracle in Linux under z/VM. This was especially so with 31-bit Oracle9i and 31-bit
    Linux distributions. Even though Oracle Database 10g 64-bit runs in 64-bit Linux,
    memory sizing still affects performance.


    When running under z/VM, there is a need for expanded storage. Even though z/VM
    is fully 64-bit and supports 64-bit virtual machines, expanded storage must be
    configured when running Oracle. You should configure 10% of the memory in the
    LPAR as expanded storage, not to exceed 2 GB. Once configured, it is unlikely
    that the amount of expanded storage configured will change.


    When sizing the Linux machine for Oracle, the virtual machine should be configured
    with the minimum amount of memory needed. Linux will set up cache buffers with
    all memory allocated to it. It is better to let z/VM handle paging and manage
    memory where possible. System performance can be adversely affected by the amount
    of memory allocated.


    The method to size a guest for Oracle is to add the System Global Area, the Program
    Global Area (if needed), and about 128 MB for Linux. If you are using ASM, another
    256 MB should be added for it. If this is a large database, then of memory may
    need to be larger; Check the Oracle ASM Administration Guide for instructions
    to size ASM SGA memory requirements.


    The System Global Area is the memory requirement for Oracle. This is shared within
    Oracle to functions such as caching table data, parsing SQL, and so on.


    The Program Global Area is outside the Oracle instance. This generally is used
    by users who create connections to the database. Depending on the application,
    this can be either a small amount of memory per user or very large amounts (in
    excess of 10 MB per user) for applications like the Oracle E-Business Suite.


    This situation tends to be the complete opposite of assigning memory to Linux
    in an Intel environment or even in UNIX® . But it must be remembered that in this
    case, Linux is running under and being managed by the z/VM Hypervisor.'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# 5.2 CPU allocation


    CPU (or CP) allocation can be viewed from several perspectives:


    +   - A MIP''s requirement for the databases and applications to be run in Linux
    System z

    - Allocation of virtual CPUs

    - Setting shares or running multiple LPARS with CPUs either as shared or dedicated


    # 5.2.1 Sizing


    As part of the consolidation process, workloads should be sized not only to ensure
    that the correct amount of MIPS are determined, but also to aid in determining
    if this is a good candidate to move to Linux for System z. It can also help determine
    if this database should possibly run in a Linux virtual machine or in an LPAR.
    The other databases, such as development, test, and so on, should be considered
    candidates to be run under z/VM. This is a very important part of the consolidation
    process, if not the most part.


    Doing the right work will save problems later after the workload is moved to Linux
    for System z.


    IBM can provide sizing estimates, and there is no charge for this. To do an estimate,
    IBM will need to follow information:


    +   - Make and model of the system on which the database currently runs

    - The number of the CPs and the MHz rating of the CPs

    - The peak utilization of each system


    It is best if these are actual numbers from a system tool such as vmstat. Approximations
    can be provided, but the amount of utilization the estimates are in error is directly
    proportional to the error in the sizing.


    There are several methods of sizing. IBM has several tools it uses based on information
    gathered from customers. Customers can also size servers and create TCO values
    by purchasing a license for the zRACE tool from Ideas International (http://www.ideasinternational.com).'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# 5.2.2 CP allocation


    The amount of virtual CPs allocated to a Linux machine is important. In general,
    one virtual CP is a good starting point unless the sizing points to something
    larger.


    In a constrained CPU environment (that is, more CP cycles are needed to complete
    the work), you should give the Linux virtual machine all the CPs it needs to do
    its work efficiently. However, there should not be more CPs allocated than the
    number of physical CPUs that are assigned to LPAR when running under/VM. If this
    were to happen (more virtual CPs than physical CPUs), performance would suffer
    as the cost to execute the workload would increase. This is due to an increased
    scheduling impact in z/VM''s control program.


    CP time is limited to the number of physical CPUs installed. Therefore, it would
    be prudent to reduce CP usage where possible. This would be in areas such as:


    +   * Eliminate unnecessary services that might install with the Linux guest.

    * Eliminate any unnecessary cron tasks.

    * Reduce unnecessary work.

    * Eliminate using "r-u-there" pings to determine if the virtual machines are there
    and up.

    * Do not measure idle guests. Measuring takes cycles.

    * Network consideration.

    * Use VSwitch.


    # 5.2.3 Setting share values


    The workload of Linux virtual machines can be managed or controlled by setting
    the SHARE value of a virtual machine. The first choice of SHARE is to use ABSOLUTE
    or RELATIVE. The second choice is the size of the SHARE. The simplest way to decide
    which to use for a specific server is to determine the following: as more users
    log on to this system, should this service machine more CPU or less?


    A relative share says this server should get a relative share of the processor,
    relative to all virtual machines in the dispatch and eligible lists. As more users
    log on, the share will drop.


    An absolute share remains fixed up to the point where the sum of the absolute
    shares is 100 percent or more, which is a rather confused state of configuration.
    Servers may have a requirement that increases as the level of work increases.'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'These servers should have ABSOLUTE shares. All other users should use RELATIVE.


    The size of the share is both a business decision and a performance decision.
    For example, if one server is assigned a very high share, which might be as much
    of the system as the rest combined, one would expect this server to be absolutely
    critical to your business. This server has the capability of taking resources
    whenever it needs them, but if this server starts looping it would easily consume
    all the resources allocated. But in general, this is not a likely situation for
    production.


    A simple way of looking at share values is that if there is a heavy contention
    for the processor, what servers would you like to run? The production Oracle databases
    are obvious choice. Required servers should have absolute values.


    # Control Priority of Linux guests


    +   * SHARE settings determine access priority for CPU, main, and paging capacity

    * Settings can be changed on *the fly* by command or programmed automation

    * Resources are allocated to Absolute guests first, remaining resources are allocated
    to Relative guests

    * SHARE settings are not a guarantee for system behavior


    | | Absolute % | Relative |

    |---|---|---|

    | | 800 | Relative Share |

    | | | guests guests 700 |

    | | | 500 |

    | | | 400 |

    | | | 300 |

    | | 200 100 |

    | Lin1 Lin2 Lin3 Lin4 |


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_112_0.png)


    ```

    SET SHARE LIN1 ABSOLUTE 20% ABSOLUTE 30% LIMITSOFT

    SET SHARE LIN2 ABSOLUTE 10% ABSOLUTE 15% LIMITHARD

    SET SHARE LIN3 RELATIVE 200 RELATIVE 30% LIMITHARD

    SET SHARE LIN4 RELATIVE 100 RELATIVE 20% LIMITSOFT

    ```


    Notes:

    *** limit can be exceeded if unused capacity is available (limitsoft)

    ** limit will not be exceeded (limithard)


    # 5.3 Paging, swapping, and I/O considerations


    z/VM machines paging, while Linux swaps. Swapping in Linux is really paging. Swapping
    is a “carry-over” term from the early days of Linux. So Linux does, use its own
    paging algorithm.


    The approach to this is to keep the memory in Linux virtual machines enough so
    that z/VM does not do a lot of paging and large enough that Linux does not have
    to do excessive paging. And all paging at the first level should be to a memory
    device, such as a VDISK for Linux or expanded storage for z/VM.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# 5.3.1 z/VM paging


    One of the common mistakes with new VM customers is to not allocate paging (along
    with not configuring expanded storage). The installation process configures enough
    paging space to complete an installation. This paging space on the sysres pack
    is small and can handle a small amount of tasks. However, you should remove the
    paging space from the sysres pack and add DASD space to do real work. The VM Planning
    and Administration manual has details on determining how much space is required.
    Here are a few thoughts:


    +   - If the system is not paging, you may not care where you put the page space.
    However, it has been our experience that sooner or later the system grows to a
    point where it pages and you might wish you had thought about it.


    +   - z/VM paging is most optimal when it has large contiguous available space
    on volumes that are dedicated to paging. Therefore, do not mix paging space with
    other space (user, tdisk, pool, Linux guests, and so on).


    +   - Set up VM paging to many disks. The more subchannels z/VM can use, the faster
    the paging will take place. It is best to use smaller 3390s, such as the mod 3s
    or mod 9s.


    +   - A rough starting point for page allocation is to add up the virtual sizes
    of virtual servers running and multiply by 2. Keep an eye on the allocation percentage
    and the block read set size.


    # 5.3.2 Swap space for Linux


    Try avoiding swapping in Linux whenever possible. However, sometimes swapping
    is unavoidable. There are a few acceptable ways to set up swap:


    +   - Traditional minisk: Using a traditional minisk on physical DASD requires
    some setup and formatting the first time and whenever changes in size of swap
    space are required. However, the storage burden on z/VM I/O is small, the controllers
    are well-cached, and I/O performance is generally very good. If you use a traditional
    minisk, you should disable z/VM Minisk Cache (MDC) for minisk (the MINIOPT NOMDC
    statement in the user directory).


    +   - VDISK: A VM virtual disk in storage (VDISK).


    VDISK is backed by a memory address space, not by real DASD. While in use, VDISK
    blocks reside in main storage (which make them very fast). When not in use, VDISK
    blocks can be paged out to expanded storage or paging DASD.


    Linux assigns priorities to swap extents. You could set up a small VDISK with
    higher priority (higher numeric value), and it would be used for swap as long
    as there was space on the VDISK. Swap extents of equal priority are used in'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'round-robin fashion Setting up two VDISKS of different priorities or a VIDSK
    minidisk with the higher priority on the VDISK can provide a tuning tool or method
    for properly sizing memory on the Linux virtual machine. Monitor the paging at
    peak times; if there is paging to the second paging disk, then you should consider
    adding virtual memory to Linux.


    # 5.3.3 I/O considerations


    One of the biggest performance issues we ran into during some testing, both on
    z/OS* and Linux for System z, when we placed the database files on a single rank
    in the IBM Storage. This will cause performance-related issues that mostly involve
    cache utilization. The best practice for the DS or ESS system is to distribute
    data across as many ranks (arrays) as possible. This made a dramatic difference
    in our testing, even though this was a small database. It is also important to
    stripe the logical volumes that are created. This enables the operating system
    to issue multiple IOs over the LVM. Striping a logical volume is not the same
    as any striping or RAID that is done inside the disk controller. The guidelines
    for striping on an IBM Total Storage ESS and DS8000™ are follows:


    +   - ESCON: One stripe per channel

    - FICON: One stripe per physical volume

    - FCP: One stripe per volume or LUN


    When the logical volume is created, one of the parameters is the stripe size.
    The best stripe size is dependent on the workload characteristics. The IBM website
    recommends 16 KB or 32 KB stripe sizes.


    If you are using Oracle ASM, then ASM will stripe the volume it creates.


    A final thought on this is that faster and newer is always better. Some implementations
    have experienced up to a 50 percent performance improvement just going from ESCON
    to FICON.


    # 5.3.4 Monitoring the system


    z/VM provides extensive virtualization techniques. A virtual machine running under
    z/VM acts as though it has all the resources allocated to it in the user direct
    profile that was created for the virtual machine. This means monitoring what a
    virtual machine is doing by looking at resource utilization with a tool or monitor
    running in that virtual machine may not always be accurate.'
  merge: -1
  pgno: 114
- img_proc: true
  md: 'Since monitoring a virtual machine from the virtual machine is not always accurate,
    it is extremely important to use a tool to monitor the z/VM system and all the
    virtual machines from a system perspective. There are two tools that we have experience
    with and provide value:


    +   - IBM Performance Toolkit for VM—Licensed through IBM


    +   - ESAMON from Velocity Software (http://www.velocity-software.com)


    While using one of tools is absolutely necessary for performance monitoring and
    tuning, do not overlook using tools like **sar** to **vmstat** monitor events
    and resource utilization, as swapping in a Linux virtual machine. Another way
    to monitor performance, especially during times when problems are suspected, is
    the use of CP commands such as **cp** indicate. These are very valid for a current
    point in time, but do not provide the ability to go back to review performance,
    as one of the tools mentioned above.


    This chapter described the configuration of Linux and z/VM. However, this is for
    an Oracle database, and using a tool such as Stackpack (or DB Control AWR) is
    still an important way to monitor and tune the Oracle database server.


    # 5.4 Summary


    There is a summary of the key points to get the best performance from Oracle:


    +   - Memory: This is likely the most critical area of tuning Linux virtual machines.
    The mindset is the exact opposite of Linux on Intel: the less, the better. Memory
    assigned to Linux should be enough to cover the needs of the Oracle database (SGA
    + PGA) and about 128 MBs for Linux. Add 256 MBs for the ASM SGA if ASM is being
    used.


    +   - Monitor resources: The more virtual machines installed under z/VM, the more
    you will need to use a system monitor, such as the z/VM Toolkit. Trying to understand
    performance problems and determine capacity needs without this type of monitor
    is impossible.


    +   - Paging and swap space: Paging at the z/VM level and Linux level (swapping)
    is unavoidable. You must allow for this situation. Ensure that the z/VM paging
    space is less than 50% utilized during peaks. The best paging device for Linux
    is a VDISK.


    +   - I/O bottlenecks: Use best practices for configuring and using disk. Data
    must be distributed as evenly as possible across different ranks. The logical
    volumes should be striped, with the number of stripes being dependent on the technology
    used.'
  merge: -1
  pgno: 115
- img_proc: true
