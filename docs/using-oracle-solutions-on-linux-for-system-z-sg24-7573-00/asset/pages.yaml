  md: "# ### 11.3.4 FreeRADIUS Configuration clients.conf\n\nAn entry was added to\
    \ the clients.conf file to identify the network name of the Oracle Database server\
    \ that will connect to FreeRADIUS as a RADIUS client to do external authentication\
    \ for Oracle user names. The default port is 1812. The Radius Server secret is\
    \ specified in this entry. This is the key that the Database and FreeRADIUS use\
    \ to encrypt and decrypt the Oracle password that is passed between FreeRADIUS\
    \ and Oracle. The secret is made available to Oracle when it is set up for external\
    \ authentication and the detail is provided in a later section.\n\n> Note: There\
    \ are various descriptions of the specification of the Radius secret and it took\
    \ some experimenting before a key was found that successfully work between the\
    \ Oracle Database and FreeRADIUS. The encrypt/decrypt between Oracle and FreeRADIUS\
    \ did not seem to work if the key is longer than 15 characters. The radtest program\
    \ mentioned below with a key longer than 15 characters:\n\n```\nclient linux25.its..ibm.com\n\
    {\n  secret = testing-123\n  shortname = linux25\n}\n```\n\n# ### 11.3.5 FreeRADIUS\
    \ Configuration users files\n\nThe third file, users, identifies the Oracle users\
    \ (icuser1, icuser2, and iccraf1) that will authenticate using the z/VM LDAP server.\
    \ These user names will be used in later examples in this chapter. These are the\
    \ same names that were used in the setup of the z/VM LDAP server:\n\n```\nicuser1\
    \ Auth-Type = LDAP\nicuser2 Auth-Type = LDAP\nicccraf1 Auth-Type = LDAP\n```\n\
    \nAt this point, the FreeRADIUS server is started on linux20 by executing the\
    \ binary radiusd. Now both FreeRADIUS and the z/VM LDAP server are configured,\
    \ running, and awaiting user requests from Oracle for external authentication."
