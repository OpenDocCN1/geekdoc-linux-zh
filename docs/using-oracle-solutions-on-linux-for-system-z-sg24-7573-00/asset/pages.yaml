  md: '# 9.8 Set up the standby database


    In order to have the standby database synchronized with the primary database,
    you have to do some setup. This setup will enable the correct communication between
    the databases:


    +   - Set up the environment to support the standby database.

    - Create a password file.


    This was done during the installation of the Oracle Binaries and the creation
    of the database.


    Configure the listeners for the primary and standby databases. Either netca or
    update the listner.ora files as follows:


    +   - On primary

    TRADE1 =

    (DESCRIPTION =

    (ADDRESS_LIST =

    ADDRESS = (PROTOCOL = TCP)(HOST = node1)(PORT = 1521))

    (CONNECT_DATA = (SERVICE_NAME = trade1)))

    - On standby

    TRADE2 =

    (DESCRIPTION =

    (ADDRESS_LIST =

    ADDRESS = (PROTOCOL = TCP)(HOST = node2)(PORT = 1521))))

    (CONNECT_DATA = (SERVICE_NAME = trade2)))


    # 9.8.1 Create Oracle Net service names


    On both the primary and standby systems, use Oracle Net Manager to create a network
    service name for the primary and standby databases that will be used for redo
    transport services.'
