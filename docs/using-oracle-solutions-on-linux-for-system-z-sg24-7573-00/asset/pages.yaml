    \ to start the database, we need the following:\n\n+   - Create a server parameter\
    \ file for the standby database:\n  SQL> CREATE SPFILE FROM PFILE='inittradedb_node2.ora';\n\
    - Start the physical standby database:\n  SQL> START MOUNT;\n- Start redo apply:\n\
    \  SQL> ALTER DATABASE RECOVER MANAGED STANDBY DATABASE DISCONNECT SESSION;\n\
    - Verify the physical standby database is performing properly.\n\nIn order to\
    \ verify that the standby database was updated, we created the tables and users\
    \ needed by the application and then we started the application and populated\
    \ the database. After doing a switchover, we check for tables and users on the\
    \ standby database and found everything.\n\n# 9.10 Switchover to the standby database\n\
    \nSwitchover is a role reversal between the primary database and one of its standby\
    \ databases. A switchover operation guarantees no data loss. This is typically\
    \ for planned maintenance of the primary system. During a switchover, the primary\
    \ database transitions to a standby role and the standby database transitions\
    \ to the primary role. The transition occurs without having to re-create either\
    \ database.\n\nBy contrast, a failover is an irreversible transition of a standby\
    \ database to the primary role. This is only done in the event of a catastrophic\
    \ failure of the primary database."
