  md: 'The replication engine is based on sharing large portions of the Linux hierarchical
    file system, and modifying the root file system structure to include smaller disks.
    The small disks are used for local parameters for a Linux host, containing customized
    configuration files. These smaller file systems are then mounted into the standard
    Linux file systems structure.


    Figure 7-7 shows the disk architecture used by a replicated server.


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_161_0.png)


    Figure 7-7 DASD configuration for a Linux Server


    The R/O disks are linked through CP directory LINK statements, and are mounted
    r/o by Linux at startup time. The tailoring of the file system is done in the
    master image during the image preparation.'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'Linux bind mounts allow mounted parts of the file system to be mounted at another
    location. Bind mounts can be used in combination with VM minisks to graft the
    r/w smaller part disks into the appropriate location in the file system. This
    technique combines disks with different attributes (such as a r/w and a d/o disk)
    into a seamless view of the file system. Bind mounts can be used to place a tailored
    file from a farm disk into the standard location of the hierarchical file system.


    For example, the 152 minisk is linked R/O by the replicated Linux server. The
    152 is mounted as /SHARED, and then various parts /SHARED are bound into the /usr
    hierarchy. The /usr hierarchy is, of course, an excellent candidate for sharing,
    as its contents are shared and static. Example 7-12 shows how 152 (dascc) is bind
    mounted.


    # Example 7-12 Commands for disk 152


    ```

    send cp lsigapara query virtual 152

    LSIGAPARA: DASD 0152 3390 VPDX3 R/O      2502 CYL ON DASD  3664 SUBCHANNEL = 000B

    ```


    ```

    send lsdasd | grep dasdc

    LSIGAPARA: lsdasd | grep dasdc

    LSIGAPARA: 0.0.0152(ECKD) at (94: 8) : is dasdc active at blocksize 4096, 50360
    blocks, 1759 MB

    LSIGAPARA:/ #

    ```


    ```

    send mount | grep dasdc

    LSIGAPARA: mount / /dev/dasc1 on /SHARED type ext2 (ro)

    LSIGAPARA: LSIGAPARA:/ #

    ```


    ```

    send mount | grep SHARED

    LSIGAPARA: mount / /dev/dasc1 on /SHARED type ext2 (ro)

    LSIGAPARA: /SHARED/lib on /lib type none (ro,bind)

    LSIGAPARA: /SHARED/lib64 type none (ro,bind)

    LSIGAPARA: /SHARED/usr on /usr type none (ro,bind)

    LSIGAPARA: /SHARED/bin on /bin type none (ro,bind)

    LSIGAPARA: /SHARED/sbin on /sbin type none (ro,bind)

    LSIGAPARA: /SHARED/logiciels / /logiciels type none (rw,bind)

    LSIGAPARA:

    ```


    The SENDIT EXEC is a short REXX routine that sends mixed commands to a Linux host,
    LSIGAPARA.'
