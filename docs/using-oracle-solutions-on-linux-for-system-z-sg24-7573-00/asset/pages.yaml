  md: 'Here are the steps to do switchover:


    +   1. Verify that it is possible to perform a switchover operation. query the
    switchover_status column of v$database to verify that switchover to standby is
    possible:


    ```

    SQL> SELECT SWITCHOVER_STATUS FROM V$DATABASE;

    SWITCHOVER_STATUS

    ----------------

    ```


    TO STANDBY


    In order to perform a switchover, all sessions to the database need to be disconnected:


    ```

    SQL> ALTER DATABASE COMMIT TO SWITCHOVER TO STANDBY WITH SESSION

    SHUTDOWN

    ```


    +   2. Convert the primary database to the new standby:


    ```

    SQL> ALTER DATABASE COMMIT TO SWITCHOVER TO PHYSICAL STANDBY;

    Database altered.

    ```


    +   3. Shut down the former primary and mount it as a standby database:


    ```

    SQL> SHUTDOWN IMMEDIATE

    ORA-01507: database not mounted

    ORACLE instance shut down.

    SQL> STARTUP NOMUNT

    ORACLE instance started.

    ```


