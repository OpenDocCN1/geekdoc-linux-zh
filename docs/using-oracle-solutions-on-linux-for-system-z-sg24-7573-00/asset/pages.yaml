  md: 'In our example, we used two guests running SLES10 and Oracle 10gR2. The database
    name was traded, the unique name on the first node was trade1, and the unique
    name on the second node was trade2. The directory structure was the same for both
    nodes:


    ```

    ORACLE_HOME=/oracle/10gr2

    LOG_ARCHIVE_DESTINATION=/oracle/trade

    ORACLE DATABASE FILE LOCATION=/oracle/10gr2/oradata/tradedb

    ```


    These are the steps we executed to prepare the database for copying.


    # 9.6.1 Enable forced logging


    Place the primary database in FORCE LOGGING mode after database creation using
    the following SQL statement:


    ```

    SQL> ALTER DATABASE FORCE LOGGING;

    ```


    To verify that force logging is set, run:


    ```

    SQL> SELECT FORCE_LOGGING FROM V$DATABASE;

    ```


    ```

    FOR

    ---

    YES

    ```


    # 9.6.2 Create a password file


    This was done during the installation of Oracle Binaries and the creation of the
    database.


    # 9.6.3 Configure standby redo logs


    A standby redo log is required for the maximum protection and maximum availability
    modes and the LGWR ASYNC transport mode is recommended for all databases. Oracle
    Data Guard can recover and apply more redo data from a standby redo log than archived
    redo log files alone. To configure the logs, do the following steps:


    +   1. Ensure that the log file sizes are identical on the primary and standby
    databases.

    2. Determine the appropriate number of standby redo log file groups using the
    following formula:

    (Max num of log files per thread + 1) * (Max num of threads) = 4'
