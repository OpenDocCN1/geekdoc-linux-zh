    # 9.5 Installation and creation of production database


    This chapter does not cover the details of the installation of Oracle binaries
    or the creation of a database, as this is covered in other books or chapters.


    # 9.6 Prepare the production database


    The first step to create a Physical Standby Database is to prepare the production
    database in order to be able to copy it to the standby database server.'
