    # 7.2 Setting up a cloning architecture


    One of the major strengths of z/VM as a virtualization host for multiple Linux
    servers is a rich set of tools for Linux server replications.


    There are several methods of cloning in z/VM, ranging from manually creating directory
    entries, copying disks, and updating Linux configuration files by hand, in-house
    automated solutions, to vendor products.


    The solution presented here consists of multiple steps from installation to usable
    master. The coding was done using CMS REXX™ and PIPELINES and has an automated
    front end to DIRMAINT on multiple systems and RACF.


    A large client runs Oracle databases on nearly 200 Linux servers. In this environment,
    replication of several master images is an important part of systems administration.
    A cloning methodology was developed based on using SUSE SLES. The methodology
    uses very few masters. The masters contain a purified Linux distribution and a
    pre-installed Oracle.'
  merge: -1
  pgno: 155
- img_proc: true
  md: "![](img/5b458d26d6ded58c4d2c82af59a3d71c_156_0.png)\n\nThe major steps, as\
    \ shown in Figure 7-3, are:\n\n+   1. Installation is performed on a SUSE SLES\
    \ 9 or 10 package from a directory tree that resides in a zVM Linux virtual machine.\
    \ Service packs are installed as well.\n   After the install is completed, many\
    \ packages that have been deemed unnecessary are removed. Package removal is a\
    \ labor intensive step with around 3,000 packages being removed.\n   This initial\
    \ Linux system, minus the unnecessary packages, is then copied over to a new set\
    \ of disks in preparation for the next step of installing on packages, products,\
    \ and local tailoring.\n2. Installation of add-on packages and products and local\
    \ tailoring.\n   The additional packages provide software for performance monitoring\
    \ with Velocity Software, security compliance and change notification with Tripwire\
    \ package, and the approved method of file transfer using Axway."
  merge: -1
  pgno: 156
- img_proc: true
  md: 'Local tailoring involves the installation of scripts used in the cloning process,
    changes to the FSTAB to conform to the disk standards in use, and configuration
    skeleton files for the network interfaces.


    The tailored system is then copied to a new set of disks in preparation for the
    next step, the Oracle installation.


    +   3. Oracle installation.


    Oracle is installed. The file systems where Oracle is installed are shown in Figure
    7-4.


    ![](img/5b458d26d6ded58c4d2c82af59a3d71c_157_0.png)


    Figure 7-4 Oracle shared read-only and non-shared read-write disks'
  merge: -1
  pgno: 157
- img_proc: true
  md: '+   4. Extensive testing by different departments


    The Oracle system is then copied over to a new set of disks in preparation of
    the testing system. The testing system is turned over from the builders to Linux
    sysadmins, z/VM systems programmers, Oracle DBAs, the automation group, and the
    security administrators.


    Corrections and changes are reviewed, and then tested. When all tests have been
    passed, this certified system is now used as a master for input to the cloner.


    +   5. The approved golden image is made ready as the master image for cloning.


    The replication code engine is done in a CMS server in the service zone LPAR.
    The service zone LPAR is configured to recognize all DASD devices on the z/9 CEC.
    The coding engine is written in REXX, and interfaces with CP, the VM directory
    through DIRMAINT commands, and RACF commands.


    DIRMAINT is configured to send commands to remote systems.

