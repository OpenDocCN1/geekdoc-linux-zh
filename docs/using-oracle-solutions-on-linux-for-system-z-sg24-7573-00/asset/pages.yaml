    # 4.3.4 Linux swapping recommendations


    Sizing Linux swapping on z/VM environments correctly is very important, or the
    performance of the system will diminish.


    Setting up a small virtual disk in storage (VDISK) and a minidisk with the higher
    priority on the VDISK can provide a method for sizing memory for Oracle and the
    Linux virtual machine. If there is paging to the second paging disk, then you
    should consider adding memory to Linux or reduce the Oracle SGA/PGA. Some swap
    to the VDISK is okay, but extensive swapping the minidisk is a sign that memory
    is not sized correctly.


    See 5.3.2,"Swap space for Linux" on page 92 for more swap space recommendations.


    # 4.3.5 Oracle binaries installation


    When installing Oracle RAC on IBM z, several independent sets of Oracle binaries
    must be installed for Oracle Clusterware and the Oracle database software to function
    properly. From an Oracle perspective, these are typically called ORACLE_HOME and
    CRS_HOME.


    You must install the Oracle Clusterware in a separate Oracle Home, which typically
    uses about 1.5 GB of storage. The Oracle Home for the RAC database will need another
    2.0 GB of storage. Oracle also advises when using ASM disk storage (which is fairly
    typical for Oracle RAC) to have another Oracle Home for it.


    The requirement of another Oracle home for ASM binaries is not mandatory, but
    makes things easier for database patching since the Oracle ASM set of binaries
    can be patched while the database is running, reducing the required downtime for
    the node.


    Space is also needed for the alert logs, trace files, database patches, and the
    Oracle install media zip files, which typically a size of 15-20 GB is used on
    each node for installing the Oracle software.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# 4.3.6 OCR and Voting disks installation


    Oracle supports two ways of storing the Oracle Cluster files: either with Raw/Block
    devices or a shared file system such as Oracle Cluster File System 2 (OCFS2).
    OCF2 is an extent based, clustered file system that can be accessed and written
    to all nodes in the cluster. OCF2 is supported on Linux 2.6 kernels and above
    only.


    Oracle Cluster requires at least two devices: one for the Oracle Cluster Registry
    (OCR) and another for the Voting disks. If you are formatting ECKD type DASDs
    to use as Raw or Block partitions, you must format these with a 4 KB block size.


    For test systems, one partition for the OCR and Voting disks is typical. For production
    systems, using at least 280 MB for each size and multiple Voting disks (must be
    an odd number) are recommended.


    +   - Two OCRs: 256 MB each or 512 MB


    +   - Three Voting: 256 MB each or 768 MB


    Oracle ensures that devices contain a minimum of 256 MB of available disk space.
    Hence, at least 280 MB for each device size is recommended to account for the
    impact of partition creation.


    # 4.3.7 Shared database disk installation


    Oracle RAC can be created using the following storage options:


    +   - Oracle ASM for the data files with the OCR and Voting disks on Raw or Block
    devices


    +   - Standard Raw or Block devices (no Oracle ASM)


    It is a good idea to set up multiple disk groups for the different types of I/O
    that Oracle uses. For example, one set of disks for the database files and another
    set of disks for redo logs.


    If creating an ASM database, Oracle recommends putting the Flash Recovery Area
    on a different disk group than the database files. This protects the system from
    having the active data and backup and recovery data on the same physical disk.'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# 4.4 Formatting partitioning disks for Oracle RAC


    The formatting tool dasdfmt provides options to format DASD devices with different
    block sizes. A dasdfmt block size of 4096 should be used on z/VM systems:


    ```

    # dasdfmt -f /dev/dasda -b 4096 -p

    # dasdfmt -f /dev/dasdb -b 4096 -p

    # dasdfmt -f /dev/dasdc -b 4096 -p

    ```


    The next step is to create a partition on each of the disk devices. You should
    create only one partition on each disk, but for test environments people create
    more than one partition on each disk. The commands to create the partitions are
    similar whether you are using ECKD disk (fdsd) or SCSI/FCP disk (fdisk):


    ```

    # fdsd -a /dev/dasda

    # fdsd -a /dev/dasdb

    # fdisk /dev/sda

    ```


    For Oracle RAC, you will first need to format and partition the OCR, Voting, and
    any Oracle ASM database disks.


    For the non database file systems, you can use the pvcreate command to create
    a physical volume. The pvcreate command writes a volume group descriptor at the
    start of each disk or partition.


    Hence, if you wanted to create a file system involving three disks, you would
    enter a command similar to the following to mark each device that you want to
    use in the volume group as a physical volume:


    ```

    # pvcreate /dev/dasdal /dev/dasb1 /dev/dasc1

    ```


    Then the next step is to create a volume group for the physical volumes:


    ```

    # vgcreate orabinvg /dev/dasdal /dev/dasb1 /dev/dasc1

    ```


    To display the attributes of this volume group, you can use the following command:


    ```

    # vgdisplay orabinvg

    ```


    The next step is to create logical file system that can be mounted and used by
    Oracle.


    In this example, we are using three disks and a LV of three stripes, with a block
    size of 32 KB and a 6.8 GB LV size:


    ```

    # lvcreate -i13 -I32 -L6.8G -orabinlv orarang

    ```'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'To display the attributes of the newly created LV, run:

    # lvsdisplay /dev/orabvg/orablv


    To create an ext3 file system for the oracle logical volume, you need to run mkfs.

    An ext3 file system type is recommended:

    # mkfs.ext3 /dev/orabvg/orablv -b 4096


    Create the mount points for Oracle home and CRS mount, mount the file system,
    and verify the size of the newly created file system:

    # mkdir -p /oracle

    # mount /dev/orabvg/orablv /oracle

    # df -h


    To make the changes permanent, you need to update the fstab file. We recommend
    making a backup of this file first:

    # vi /etc/fstab

    /dev/orabvg/orablv /oracle ext3 defaults 2


    # 4.5 Installing Oracle ASM Database On raw/block devices


    Oracle Automated Storage Management (ASM) is new feature in Oracle 10g that provides
    the DBA with the ability to manage database files through the creation of disk
    groups. A disk group is a set of disks that Oracle ASM owns and manages. By managing
    just a few disk groups, as opposed to potentially several thousand data files,
    database management can be made easier.


    Oracle ASM can also increase throughput and performance for the database through
    its ability to stripe spaces across several disk devices.


    Only one ASM instance is required per node regardless of the number of database
    instances on the node. For z/VM production Oracle environments, we recommend only
    one ASM and one RAC instance per node so that memory management can be tuned properly
    for the instance.


    For multipath devices, such as /dev/mapper/, you should use the multipath device
    and not the SCSI device name, such as /dev/sda or /dev/sdb.


    As of the Linux 2.6 kernel, it is now recommended to use block devices opposed
    to raw devices for the OCR, Voting, and ASM disks.'
  merge: -1
  pgno: 99
- img_proc: true
  md: 'If using raw devices, you need to update the /etc/raw (SUSE) or /etc/sysconfig/rawdevices
    (Red Hat) files with the device bindings. The following is an example of the rawdevices
    file:


    ```

    # This file and interface are deprecated.

    # Applications needing raw device access should open regular

    # block devices with 0_DIRECT.

    # raw device bindings

    # format /dev/<rawdev> <major> <minor>

    # <rawdev> <blockdev>

    # example /dev/dev/raw/raw1 /dev/sda1

    # /dev/raw/raw2 8 5

    /dev/raw/raw1 /dev/dasdo1

    /dev/raw/raw2 /dev/dasdpl

    /dev/raw/raw3 /dev/dasdq1

    ```


    You must restart the raw service as the root user, or reboot the server in order
    to pick up the devices:


    ```

    # service rawdevices restart

    # /etc/init.d # chconfig -s raw 35 (for Fuse)

    # /etc/init.d # chconfig -add rawdevices -- level 35 (for Red Hat)

    ```


    If using block devices, you do not need to update the /etc/raw or /etc/sysconfig/rawdevices
    files.


    In order to assign the correct file permissions for these devices, you need to
    utilize udev to set the file permissions. For Red Hat Enterprise Linux 4 systems,
    you should create a 49-oracle.permissions file, and for Red Hat Enterprise Linux
    5 and SUSE Enterprise Server 10 systems, you should create a 51-oracle.permissions
    file in the /etc/udev/permissions.directory.


    If using block devices, the file should look something like this:


    ```

    # OCR disks

    dsas1:root:install:0640

    # Voting disks

    dasdpl:oracle:install:0640

    # ASM disks

    dasdq1:oracle:dba:0660

    dasdr1:oracle:dba:0660

    ```'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'If using raw devices, the file should look something like this:


    ```

    # QCR disks

    raw/raw1:root:oinstall:0640

    # Voting disks

    raw/raw2:oracle:install:0640

    # ASM disks

    raw/raw3:oracle:dba:0660

    raw/raw4:oracle:dba:0660

    ```


    The main reasons for creating a new file as opposed to modifying the existing
    file is that the Linux kernel loads the 49-oracle.permissions/51-oracle.permissions
    before the 50-dev.permissions, ensuring the correct file permissions get set.
    Another reason not to modify 50-dev.permissions is that the file can be overwritten
    with a support pack update. Without the correct file permissions, Oracle clusterware
    will not start correctly, causing issues with system startup.


    The following command can be used to execute the assignment of the file permissions:


    ```

