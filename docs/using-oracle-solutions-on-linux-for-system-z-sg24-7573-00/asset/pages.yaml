  md: 'In virtualization strategies employing techniques that exploit features of
    both the virtualized system (Linux) and the host system (z/VM) combine the best
    of both worlds. Using facilities inherent in CP, CMS, and Linux facilitates excellent
    methods of replication.


    # 7.3 Using FlashCopy so backups can be managed by z/OS


    This section describes one approach for managing backups of Oracle databases.


    The methods shown here are for EXT2 or EXT3 file systems. If you are using the
    Oracle ASM file system, other considerations must be taken into account. ASM issues
    are not covered in this section.


    # 7.3.1 Backups


    There are many approaches for backing up and restoring Linux virtual machines
    on the IBM System server. This includes Linux file level backups through source
    packages, VM backups through system utilities or vendor products, and backing
    up from z/OS systems.


    While lacking capabilities, such as the ability to perform Linux file level archiving,
    performing backups and restores with the aid of a z/OS system is a popular choice
    among z/VM and Linux installations. Many z/VM shops limited (or no) access to
    tape drives, tape vaults, or robotic tape systems.


    Many z/VM and Linux installations have existing mainframes running z/OS, complete
    with backup/restore software, procedures, and policies.


    There are two configurations of z/OS reaching out to the DASD owned by a z/VM
    system:


    +   1. A z/OS LPAR is in the same CEC as the z/VM LPAR(s). The z/OS LPAR would
    have access to the z/VM DASD through the coding of IOCDS.

    2. The z/VM LPAR(s) and the z/OS LPAR are on separate CECs. In this case, the
    DASD storage unit itself has dual cabled into both CECs. Each CEC has an IOCDS
    coded to be configured to see the same DASD.


    A large client with Oracle virtual machines utilizes a configuration of two, separate
    CECs. Figure 7-8 on page 143 shows the architecture of the backup'
  merge: -1
  pgno: 163
- img_proc: true
  md: '![](img/5b458d26d6ded58c4d2c82af59a3d71c_164_0.png)


    Figure 7-8 Backup architecture'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'The steps of the backup are:


    +   1. A CMS service machine in the z/VM LPAR issues console commands as the root
    user to each Linux machine at a preset time from a remote system. The remote system
    is a service LPAR.


    +   a. The service machine, SIGBKUP, is started by a timer based program as WAKEUP.


    +   b. Using the CP secondary console input facility, issue commands through the
    CP SEND command to each Linux guest that is to be backed up.


    +   2. The Linux machine processes the console command PREFLASH. PREFLASH is a
    bash script:


    +   a. Quiesces Oracle. Once a week, the database is stopped with dbora stop.
    Other times, a hot backup is performed and the database is stopped with the command
    alter database begin backup.


    > Note: When quiescing Oracle with alter database begin backup and the database
    spans multiple ECKD volumes using the ext3 file system, there is a small window
    for I/O inconsistency. There is a slight chance that the database will not be
    restored to a good state. However, using alter database suspend instead of alter
    database begin will provide a clean environment in this situation.


    +   b. Issues the sync command several times. The sync command is issued several
    times in each machine to ensure the disks are updated. Linux will cache file updates
    in memory, and the sync command can write any data buffered in memory out disk


    +   3. The CMS server machine on the service LPAR will now:


    +   a. Link to the full volumes of all DASDs containing the Linux machine minidisks.
    Minidisks containing Oracle data for production machines are backed up daily.
    Minidisks containing system data such as executables are backed up less frequently
    (lower change rate).


    +   The backups are done by pools of machines, that is, production, development,
    lab, and so on.


    +   c. Link to the targeted part of the full volumes.


    +   c. Perform a FLASHCOPY from the source volume to the target volume starting
    from cylinder 1 to the last cylinder. Cylinder 0 is not required for the FLASHCOPY,
    as no minidisks start on cylinder 0, and this way the volume label on the target
    is preserved.'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'A lookup is done for each minidisk belonging to the Linux machine, and a list
    of full volumes is prepared. SIGBKUP links to the SYSDUMP1 minidisk at virtual
    address 380E for the source, and 388E for the target.

    Example 7-13 shows the list.


    # Example 7-13 List of minidisks


    | VPCX81 380E 3390 SYSDUMP1 0 3338 3339 FC380E ZODNXX1 CPCMS |

    | VPCX81 380E ---- PSSDDPB 0156 1 350 350 FC380E ZODNXX1 LINUX |

    | VPCX81 380E ---- PSSDDPB 024F 351 160 FC380E ZODNXX1 LINUX |

    | VPCX81 380E ---- PSSDDPB 025F 511 1066 556 FC380E ZODNXX1 LINUX |

    | VPCX81 380E ---- PSSDDPB 026F 1067 1516 450 FC380E ZODNXX1 LINUX |

    | VPCX81 380E ---- PMRCDCA1 0150 1517 2104 588 FC380E ZODNXX1 LINUX |

    | VPCX81 380E ---- PMRCDCA1 0153 3281 1177 FC380E ZODNXX1 LINUX |


    Each full volume has a "twin" volume that is the target of the FLASHCOPY.

    Figure 7-9 on page 146 shows the source and target disks linked from the SIGBKUP
    CMS server machine, and the FLASHCOPY command.'
  merge: -1
  pgno: 166
- img_proc: true
  md: '![](img/5b458d26d6ded58c4d2c82af59a3d71c_167_0.png)


    Figure 7-9 FLASHCOPY for source to target volume


    +   4. When the FlashCopy® is complete, the CMS service machine in the z/VM LPAR
    issues a console command to the root user to resume Oracle. This is done using
    the POSTBACKUP script. The Linux machines processes the POSTBACKUP script to resume
    Oracle. The console starts the database after it is stopped, or *alter database
    end backup* run in the case of a hot backup.

    5. A batch job is started on the z/OS LPAR to back up the twinned volume to tape.
    The list of volumes to back up is shipped from the CMS server machine to z/OS.

    6. z/OS using DFSM/DSS backs up the flash target to tape. Tapes are stored offsite.


    146 Using Oracle Solutions on Linux for System z *'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'The entire process of quiescing the database, FlashCopying the disks, and resuming
    the database typically takes no than one minute for Linux machine. The Oracle
    machines are backed up in groups, as production, test, development, and so on.
    Production machines are backed up on a daily basis.


    The backup to tape from the z/OS can take several hours, but on the z/VM side
    all the Oracle database virtual machines are up and available. The z/OS backup
    is done on a full volume. The full volumes contain minidis, some volumes have
    multiple minidis, and other volumes contain one large minidisk. When planning
    z/VM storage, a volume should contain minidis for the same virtual machine as
    much as possible. This will provide a general scheme of locality of reference
    for the FlashCopy and tape backup process by having the minidisk of a Linux server
    on as few real volumes as possible. A real volume should be defined with minidisk
    from the same Oracle Linux server.


    # 7.3.2 Restore


    Using the backup method already described, the restore method will restore all
    volumes backed up to a standby Linux virtual machine running Oracle. The standby
    Linux machine does not provide any real time Oracle services. Once full volumes
    are restored, and the file systems are available on the standby Linux running
    Oracle, Oracle is started with the backed up databases. Files are FTPed to the
    original Linux machine. Files can contain entire databases, portions of databases,
    or records. Figure 7-10 on page 148 shows the architecture of the restore method.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '![](img/5b458d26d6ded58c4d2c82af59a3d71c_169_0.png)


    As shown in Figure 7-10, the steps are:


    +   1. A tape is recalled on z/OS.

    2. The necessary full volume(s) are restored using DFSMS/DSS.

    3. Minidisks are assigned to the standby Linux virtual machine.

    4. Files are transferred using FTP to the original machine requiring the restore.


    Although this method seems cumbersome and lacks sophistication, it does work quite
    well. Production environments have used this method for restoring old databases
    ranging from the record level.'
  merge: -1
  pgno: 169
- img_proc: true
