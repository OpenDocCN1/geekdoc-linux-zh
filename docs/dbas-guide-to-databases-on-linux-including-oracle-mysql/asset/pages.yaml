  md: '# ABOUT THIS BOOK


    The stability and reliability of the Linux operating system makes it an ideal
    platform on which to operate databases. Increasingly, major software vendors are
    designing their applications to run on Linux. DBA''s Guide to Databases on Linux
    walks you through the installation and configuration of several major databases
    on Linux and provides a working example of an e-commerce Web site.


    Major commercial databases such as Oracle, Informix, Sybase, DB2 and Progress
    are covered in depth as well as the widely-used freeware databases, MySQL and
    PostgreSQL. DBA''s Guide to Databases on Linux is the ultimate resource and comparative
    reference for any managing databases on Linux.


    # ABOUT solutions@syngress.com


    With over 1,000,000 copies of our MCSE, MCSD, CompTIA, and Cisco study guides
    in print, we have learned what like and dislike about typical computer books.
    In response, we have created solutions@syngress.com, a service that includes the
    following features:


    +   - A one-year warranty against content obsolescence that occurs as the result
    of vendor product upgrades. We will provide regular web updates for affected chapters.

