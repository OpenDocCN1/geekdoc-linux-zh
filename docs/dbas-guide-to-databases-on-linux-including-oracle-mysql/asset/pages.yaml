  md: '# Chapter 7 • MySQL on Linux


    # # Introduction


    MySQL is a complex database, the installation is not nearly as complex as you
    might think. By making a few decisions before you start your installation, you
    can make it a smooth process. Before you begin, however, you should have a Linux
    machine available, and plenty of disk space. The machine should have roughly 30-40
    MB of free space for the installation and database files. Memory is also a key
    factor—the more memory available in the machine for the database, the better.
    Generally, 64 megabytes or more will suffice.


    MySQL comes in a variety of distributions, each with their respective positive
    and negative aspects. There are binary distributions, RPM (Red Hat Package Manager
    for Red Hat Linux) installations, and source distributions. Binary distributions
    and RPM distributions are the easiest to set up and get you up and running in
    minutes. These distributions set up and configure most of the installation for
    you. Source distributions take more time to install and set up, but they are the
    most powerful distributions, allowing users to configure and tweak their distributions
    to the fullest potential. Source distributions also free you from having to have
    a binary distribution created for you. Source distributions can be highly optimized
    for a specific type of platform, allowing you to generate a database that runs
    as fast as possible on your platform.


    Each distribution also has a different level of development; some of them are
    bleeding-edge distributions, only for those who want to check out the new features
    if there are more frequent crashes. The stable versions, which are recommended
    for first-time users, contain all the major features and are completely robust
    and well tested. The latter versions are for those upgrading from past versions
    and are behind the stable versions. These are for historical purposes only. For
    any type of database that will be supporting an application, you should use the
    stable versions. Most likely, unless you need a new feature that is being developed
    in the new versions, a stable version will provide all the necessary features.


    Installation of these distributions, especially for the binary and RPM distributions,
    are covered next, and should not take very long to complete. These are very easy
    to install and will get you on your way leveraging the power of MySQL in your
    application. The source distribution takes a few more steps, but the steps are
    not very complex and are fully explained. Once you have completed one source distribution,
    you can tackle most other open-source distributions. Power users can use the source
    distribution to optimize their speed and how they want the database to perform.
    Even if you do not install the other types of distributions, it is good to review
    them and get a feel for how they are set up, in case your platform changes or
    you want to move to a different type of distribution.'
