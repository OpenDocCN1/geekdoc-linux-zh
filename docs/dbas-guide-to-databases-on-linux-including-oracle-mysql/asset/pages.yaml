    similar machines.


    # Recommended Hardware


    Linux servers run well on older equipment and are an excellent way to get added
    out of older equipment as a firewall, file and print (nfs, SMB, Novell, Mac),
    or Web or ftp server. But for the desktop, last year''s models are the best. You
    do not always want the latest and greatest hardware; many times they are very
    specific to Windows only, like WinModems. Generally speaking, name-brand peripherals
    or peripherals that use well-known chip sets work with Linux the best. Linux has
    a large following and there is usually a driver for most common equipment easily
    available at some Internet site.


    # Finding Drivers


    A great place to begin looking for drivers is at the Web of the Linux distribution;
    for example, www.RedHat.com, a small part of the main Red Web site, or www.debian.com/distrib/ftplist,
    a small part of the main Debian Web site. You can also use your favorite engine
    from any Web browser and type in the keywords "Linux" and your hardware name."
    You should come up with a number of links to sites with drivers and maybe run
    down some favorites like video cards, network cards, and SCSI cards. Most sites
    will also include their latest hardware compatibility HOWTO for additional hints.
    In general, the Internet should be your best source for Linux documentation, updates,
    and support.'
