  md: '# Contributors


    Tom Bascom is an Enterprise Architect for EDS responsible for providing business
    and information technology consulting to EDS and customer enterprises. His duties
    include formulating enterprise-wide strategies and providing recommendations in
    the design, development, implementation and management of appropriate products
    and solutions. Tom has been involved with products using the Progress database
    since 1986 and Linux since 1994 and is a frequent contributor to public forums
    as PEG and the comp.databases.progress newsgroup. Tom is also an occasional speaker
    and author of industry specific and technical articles in the Progressions newsletter.


    Jamieson Becker is a Linux/UNIX and Windows NT engineer and owner of Ring0.com,
    a Web services engagement firm. Since starting programming in 1980, Jamieson has
    become an accomplished consultant, completing engagements with IBM, Compaq, Carrier,
    Brown & Williamson, VoiceStream, Cargill, and Citizens. Jamieson specializes in
    large Web applications using Linux. He lives with his wife, Jennifer, and cat,
    Angie, in Atlanta, GA. He can be reached at jamiebecker@ring0.com.


    Geoff Crawford heads New Jersey-based consulting company Innov8 Computer Software,
    LLC. (www.innov8cs.com). He has been using Progress since its commercial release
    15 years ago. Geoff is a regular contributor to the Progress E-mail Group, author
    of the Progress ODBC FAQ, and a regular speaker at Progress user conferences.
    In his spare time, Geoff enjoys the unlikely combination of researching his Pennsylvania
    Dutch roots and listening to Pantera.


    Marc Connolly has worked with relational databases since 1987. He has extensive
    experience with DB2, Informix, and Oracle, and has worked with each in various
    capacities, as a DBA, product developer, product manager, and marketing specialist.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Brad Dietrich (B.S. Computer Science and Electrical Engineering) has worked
    professionally and academically on the Internet since its earliest days. He is
    currently one of the founding Software Engineers for ChannelDot Networks in San
    Francisco, CA. Before joining ChannelDot, he founded and ran DefTech Contracting
    (with), a successful Internet and Web application development business, where
    he developed worldclass Web applications for many clients including Mattel and
    Spyglass. He worked on projects ranging from e-commerce solutions to legacy system
    integration and terabyte databases. He has provided support to application development
    in the open-source community for the Linux environment ranging from viable middleware
    to bug workarounds in closed-source drivers. Prior to starting his Internet application
    development business, he worked to develop Web-based network management applications
    at FORE Systems as well as developing Web-based distance learning systems at Carnegie
    Mellon University.


    David Egan (P.Eng.; BASc Engineering, University of Toronto; MCT; RHCE) has lived
    in several countries and worked with computers since the early days of the Apple
    and IBM-type PC’s. David’s first “hobby-turned-job” was a five-year position as
    a Z80 Assembler and C Language programmer. David shifted gears somewhat to become
    a VMS/Unix/NT/PC Systems Integration Consultant and Technology Instructor over
    the past 15 years. David is still consulting and writing the occasional book,
    but mostly contracts as a Course Director and Course Writer of Unix-, NT- and
    Linux-based courses for Global Knowledge Inc. of Cary, NC: http://www.globalknowledge.com.
    When not on the road preaching the virtues of Linux and NT from his stage, he
    resides outside Vancouver, BC with his lovely daughter Vanessa and son Callen.
    They can be reached at either egand@istar.ca or egand@wwdb.org or through http://home.istar.ca/~egand.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'Brent Gilmore (Sun Certified Solaris Administrator andn Sun Certified Network
    Administrator is an Oracle DBA and Programmer/Analyst for San Diego State University.
    He has been working in the IT industry since 1989 and has received a B.S. degree
    in Information Systems and a M.S. degree in Business Administration Management.
    Brent started using Linux in 1996 and began using Oracle in 1997. He is currently
    involved in Internet application development and database design using Oracle8/8i,
    Linux, Perl, PL/SQL, OAS, and Apache.


    Bryan Schwab (B.S. Computer Engineering, Florida Atlantic University) is a Principal
    Engineer with Billpoint, an eBay company, and is responsible for developing his
    end eCommerce system, including shipping and ordering servers, security systems,
    monitoring systems and the integration of major strategic partner applications.
    With over 10 years as a software engineer, Bryan specializes in developing back
    end database architecture on Linux, Solaris, FreeBSD, OpenBSD and Windows NT/9x.
    He has designed and implemented mission-critical information systems and large-scale
    business processes for companies such as Wired Digital and NetGravity. He has
    authored articles for Wired Magazine and Webmonkey.


    Tim Schaefer is an Informatix Data Base Administrator and IT data warehousing
    consultant, currently working with Galaxy Latin America DirectTV, in Ft. Lauderdale,
    Florida. He has worked on Inforix databases of all sizes, ranging from the Standard
    Engine on Xenix 80286 machines to large-scale data warehouses with Informatix
    Extended Parallel Server (XPS). He has been in the computer business since 1985,
    attending college at Webster University in St. Louis in 1985, and has been working
    with Informatix products since 1988. Among his many successes, Tim participated
    in an international group of developers and business professionals chosen to promote
    the benefits of Informatix on Linux. He also runs the InxUtil Web site.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'http://www.inxutil.com, a Web site dedicated to Informix tools and is actively
    involved with the South Florida scuba Informix Users Group of Ft. Lauderdale.
    Tim is an avid scuba diver and can be found many weekends in the spring and summer
    off the coast of Ft. Lauderdale, FL diving among the fish, the many shipwrecks
    and reefs. You can reach him at tschaefe@bellsouth.net.


    **Alavoor Vasudevan** (B.E. Osmania University, M.S. University of Texas at El
    Paso) started his computer science career in 1985. Since then, he has worked extensively
    with Unix/C/C++/SQL databases. He also has experience in E-commerce, HTML and
    Linux. His hobbies include writing a good amount of documentation for Linux/Unix
    as well as software development for Linux/Unix. Al Dev lives as a consultant for
    companies in downtown Pearland, TX and the surrounding area.


    **Paul Zikopoulos** is a senior member of the DB2 information and development
    team, specializing in DB2 installation and configuration issues. He has more than
    five years experience with DB2 Universal Database and has written numerous magazine
    articles and books about DB2. Paul is an IBM Certified Advanced Technical Expert
    (DRDA and Cluster/EEE) and an IBM Certified Solutions Expert with DB2 Universal
    Database. You can reach him at paulz_ibm@yahoo.com. Paul would like to thank IBM
    developers Susan Williams and Darin McBride for their help and passion for DB2
    and Linux.'
