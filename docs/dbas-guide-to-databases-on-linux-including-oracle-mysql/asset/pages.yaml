    Congratulations! You made it through the first step towards

    Oracle8i. You now have the software installed, but no database. Before

    t database is created, though, we need to install patches.


    # Installing the Patch


    Download any current patches for Oracle8i. The current patch level is

    8.1.5.0.2, which applies to both the Enterprise and Standard editions of

    Oracle8i. Make sure the _HOME/bin is in your path; otherwise

    t patch will fail. I am explaining a few issues with previous patch

    files in case you run into problems. Previous patch releases for Oracle8

    uncompressed the patch files directly into the current working directory,

    which could be messy. Most tar files SORACLE HOME create a subdirectory and then

    decompress the files into the subdirectory. With Oracle on Linux, it

    as necessary to create a subdirectory and move the patch into the direc-

    tory before it was uncompressed. The 8.1.5.0.1 patch was even worse. It

    uncompressed into the current working directory, and then the patch

    would mysteriously fail because it would count the number of files in the

    directory, and it would find one too many—the patch file itself. It was

    necessary to move the compressed patch file out of the directory before

    t patch would fail. Oracle did a wonderful thing with the patch set

    for 8.1.5.0.2—the patch will uncompress into its own subdirectory. The

    reason I described issues with previous patches is because I cannot cer-

    tain how future patches will be delivered, and you should be aware of

    previous problems. Read any documentation that ships with the patch.

    Always shut down the database server when you install patches that

    relate to the server.


    +   1. Uncompress the patch.


    ```

    $ cd /home/oracle/patches

    ```


    ```

    $ tar xvzf linux_815_patches.tgz

    ```


    +   2. Make sure your $ORACLE_HOME variable is set:


    ```

    $ echo $ORACLE_HOME

    ```


    ```

    #u01/app/oracle/product/8.1.5

    ```'
