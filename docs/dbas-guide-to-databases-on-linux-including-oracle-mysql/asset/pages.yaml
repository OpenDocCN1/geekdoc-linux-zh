    # Network Configuration


    Networking under Oracle8/8i is use similar network configuration files. There
    is no utility to assist with network configuration in Oracle8; therefore, they
    must be modified by hand. Oracle8i provides a Java-based application called Network
    Assistant that configures the networking.


    The Oracle server supports many network protocols. The two popular methods of
    connecting to networked Oracle servers are TCP/IP hostnames and transport network
    substrate (TNS) service names. If you choose to install a single instance on your
    server, if your Linux server had the hostname **fred**, you can use **fred** as
    the connect string for the service to connect to the instance. A server running
    multiple Oracle instances cannot use TCP/IP hostnames. TNS maps service names
    to hosts different protocols, including TCP/IP, and the instance name can be specified.
    TNS names are stored in the


    **ORACLE_HOME/network/admin** directory in a file called


    tnames.ora.


