  md: '# An Informix Installation on Linux • Chapter 4 141


    When you install the engine, the physical log and the logical logs are inside
    the rootdb, but we will be moving these logs into their own spaces after the installation.
    This will leave very little use for the rootdb, so to make the rootdb very large
    can be a waste of disk space. The only reason you might want to change it is due
    to the fact that you cannot change it later unless you re-initialize your instance.
    Now is the time to make this decision, or forever live with the 20MB default size.
    If you leave it at 20000, be sure to create a logsdb and a physdb for the logical
    logs and the physical log, and follow the instructions later in this chapter to
    move these logs into their own dbpaces.


    After moving the logs out, you will have approximately 16MB of the 20MB space
    that will probably never get used. I recommend you move these logs as a part of
    standard practice, which will allow you total flexibility when you want to adjust
    the size and the amount of the logical logs, and want to adjust the size of the
    physical log. We will perform this last last, after getting the engine running.


    So, let''s continue on our way towards configuring our server. We may or not have
    a tape system for backups, but for now we want to disable tape backup until the
    server is completely operational.


    # System Archive Tape Device - before


    | TAPEDEV | /dev/tapedev | Tape device path |

    | TAPEBLK | 16 | Tape block size (Kbytes) |

    | TAPESIZE | 10240 | Maximum amount of data to put on tape (Kbytes) |


    # Log Archive Tape Device


    | LTAPEDEV | /dev/tapedev | Log tape device path |

    | LTAPEBLK | 16 | Log tape block size (Kbytes) |

    | LTAPESIZE | 10240 | Max amount of data to put on log tape (Kbytes) |


    We make our changes as follows:


    # System Archive Tape Device - after


    | TAPEDEV | /dev/tapedev | Tape device path |

    | TAPEDEV | /dev/null | Tape device path |

    | TAPEBLK | 16 | Tape block size (Kbytes) |

    | TAPESIZE | 10240 | Maximum amount of data to put on tape (Kbytes) |'
