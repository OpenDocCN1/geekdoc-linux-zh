- img_proc: true
  md: '# Chapter 10 Developing a Web-Based Application


    In this case, we are merely setting the variable $item_id equal to the information
    that is contained in the current row of $results, in the field item_id. There
    are many more ways to extract data from a result string as well. PHP is loosely
    typed, which means there is little distinction between variables that hold various
    types of information, such as number versus text; PHP makes the determination
    from the context of the variable. This makes it very easy to code for. Of course,
    if you wish, you can always force a variable to be a particular type using the
    setype() function.


    # Security


    It would be easy for a cracker simply to note that he was session #444 and simply
    change his personal cookie so that his session become session #443, effectively
    hijacking another user''s session. The way most shopping cart and other secure
    applications combats is by generating a unique and difficult-to-guess session
    id using a combination of the date, time, a random number, the user''s IP address
    or host name, and so on. A complicated and sophisticated scheme would be virtually
    unbreakable.


    # For IT Professionals


    Does Linux Really Offer Advantages Over NT/2000 for Web Serving?

    Linux offers all the traditional advantages of UNIX such as stability, scalability,
    and reliability, but it also offers ease-of-use, a large number of powerful and
    full-featured utilities, a large amount of free software that''s useful, and a
    design paradigm that sets it apart from NT/2000. In Linux, the emphasis is placed
    on building small, modular programs that can be quickly linked together from the
    command line. Although Microsoft has been trying to move in that direction for
    many years (i.e., COM/DNA), most of their applications and tools are still large,
    monolithic applications that generally try to do everything by themselves. In
    contrast, Linux tools are designed to work together. Metaphorically speaking,


    Continued


    ![](img/4dc2950553fde871c28ea3e04a065356_463_0.png)'
