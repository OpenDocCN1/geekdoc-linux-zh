    Our system will be using a cooked file for rootdbs: we are done setting this variable.
    I mentioned that you might want the rootdbs to be 50MB instead of 20MB. You can
    change this to 50,000KB, which is roughly 50MB, setting it now if you wish, or
    if you can leave it at the default of 20,000KB. This is only a precaution, and
    not necessary. I tend to give a little more room for rootdbs for the sake of safety,
    but after our configuration, it will have very little actual use except for the
    engine. There are several situations where a slightly larger rootdbs comes in
    handy, such as leaving the logical logs or the physical log inside the rootdbs.


    > If you anticipate creating more than one instance on your server, please rename
    rootdbs to rootdbs01, physdbs to physdbs01, logsdbs to logsdbs01, and tempdbs
    to tempdbs01 when the reference is in this installation to these dbspaces. This
    ways the name are consistent with the instances and it makes managing them easier.
    Make the appropriate changes in your server''s SONCONFIG before performing oninit
    -i.

    Do not change the PHYSDBs settings until after the first oninit, when you run
    oninit -i. After the engine is up and running, you can make changes.'
