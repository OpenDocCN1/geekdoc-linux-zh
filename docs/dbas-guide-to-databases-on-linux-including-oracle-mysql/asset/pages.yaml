  md: '# Chapter 10 Developing a Web-Based Application


    After the session is created, the user has a session_status of 0. This session_status
    means that the user is just browsing and has not authenticated. Since the user
    must authenticate before purchasing any items, he or she doesn''t have a checkout
    button. The user is allowed to browse and add items to the shopping cart (the
    carts database) without authentication. Upon authentication (registration), the
    session_status is increased to 1, which means that the user now has a checkout
    button. Also, the user_id is placed in the session database.


    When the user clicks checkout, the session_status is increased to 2, meaning that
    the user has completed the transaction. At this point, it would be possible to
    send emails to the buyer and seller indicating that a transaction has taken place.
    (For security purposes, an unencrypted credit card number should never be sent
    via e-mail.) The best thing to send via e-mail would be a unique URL (for example,
    http://www.shoppingcart.com/view_session_id=323), which would send the viewer
    to a page that would allow someone who intercepted this email to get any sensitive
    information, or to one that would be protected behind a login. For simplicity''s
    sake, we have not implemented this code in this sample application.


