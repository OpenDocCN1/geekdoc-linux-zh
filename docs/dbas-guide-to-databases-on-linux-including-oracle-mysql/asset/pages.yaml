  md: '# Summary


    In this chapter, a shopping cart application was built with PHP and MySQL. We
    look forward to hearing of any implementations of this code. The complete application—with
    source code, the database dump, and installation instructions—is available for
    free the GNU License version 2 (GPLv2) at www.syngress.com or www.sourceforge.net.
    If you are not familiar with the GPL, a description, as well as the text of the
    license, is available at http://www.gnu.org/copyleft/gpl.html.


    # FAQ


    +   Q: We don''t have any PHP expertise in our organization, but we do have some
    Perl experts. Are there other open source shopping cart applications?


    +   A: Yes. One of the most complete shopping cart applications is Minivend, written
    in Perl (http://www.miniv.com). Another excellent Perl-based shopping cart application
    is OpenCart, developed and used by Walnut Creek CDROM (http://www.cdrom.com).
    For more examples, including others in both PHP as well as other languages, check
    out Freshmeat.Net (http://www.freshmeat.net).


    +   Q: Which Web server is the fastest?


    +   A: That depends on what you''re serving and, of course, who you ask. In general,
    for serving static, traditional Web pages (such as the traditional HTML page)
    and not generated by PHP, ASP, or other languages, the simplest Web server include
    caching and other performance features to enhance the speed of the more processing-intensive
    functions (such as dynamic page generation), but these features themselves incur
    a certain amount of overhead if they are not needed. Generally speaking, security
    functions slow down a server greatly as well. So, if speed is the main objective,
    you would need to weigh the various options carefully, and balance them against
    your needs. In general, Apache is the best solution for most uses as it offers
    an excellent balance of features and performance.


