- img_proc: true
  md: 'ignored. A record is made up of a number of fields, separated by spaces and/or
    tabs.


    Connections from clients can be made using UNIX domain sockets or Internet domain
    sockets (i.e., TCP/IP). Connections made using UNIX domain sockets are controlled
    using records of the following format:


    local database authentication method


    where:


    +   - database specifies the database to which this record applies.

    value all specifies that it applies to all databases.

    authentication method specifies the method a user must use to authenticate themselves
    when connecting to that database using UNIX domain sockets. The different methods
    are described next.


    Connections made using Internet domain sockets are controlled using records of
    the following format:


    host database TCP/IP address TCP/IP mask authentication method


    The TCP/IP address is logically and''ed to the specified TCP/IP mask and the TCP/IP
    address of the connecting client. The two resulting values are equal, the record
    is used for this connection. If a connection matches more than one record, the
    earliest one in the file is used. Both the TCP/IP address and the TCP/IP mask
    are specified in dotted decimal notation.


    If a connection fails to match any record then the reject authentication method
    is applied (see next).


    # Authentication Methods


    The following authentication methods are supported for both UNIX and TCP/IP domain
    sockets:


    +   - trust The connection is allowed unconditionally.

    - reject The connection is rejected unconditionally.

    - crypt The client is asked for a password for the user. This is encrypted (using
    crypt(3)) and compared against the password held in the pg_shadow table. If the
    passwords match, the connection is allowed.

    - password The client is asked for a password for the user. This is sent in clear
    and compared against the password held in the pg_shadow table. If the passwords
    match, the connection is allowed. An optional password file may be specified after
    the password keyword, rather than the pg_shadow table. See pg_passwd.'
  merge: -1
  pgno: 425
- img_proc: true
  md: '# PostgreSQL on Linux • Chapter 9 391


    The following authentication methods are supported for TCP/IP domain sockets only:


    +   - **krb4** Kerberos V4 is used to authenticate the user.

    - **krb5** Kerberos V5 is used to authenticate the user.

    - **ident** The ident server on the client is used to authenticate the user (RFC
    1413). An optional map name may be specified after the ident keyword, which allows
    ident usernames to be mapped onto Postgres usernames. Maps are held in the file
    `SPGDATA/pg_ident.conf`.


    Here are some examples:


    ```

    # Trust any connection via Unix domain sockets.

    local       trust

    # Trust any connection via TCP/IP from this machine.

    host       all             127.0.0.1      255.255.255.255      trust

    # We don''t like this machine.

    host       all             192.168.0.10     255.255.255.0      reject

    # This machine can''t encrypt so we ask for passwords in clear.

    host       all             192.168.0.3      255.255.255.0      password

    # The rest of this group of machines should provide encrypted passwords.

    host       all             192.168.0.0      255.255.255.255      crypt

    ```


    # Creating Users


    To define a new user, run the `createuser` program. To assign a user or set of
    users to a new group, you must define the group itself, and assign users to that
    group. In Postgres, these steps are not currently supported with a `create group`
    command. Instead, the groups are defined by inserting appropriate values into
    the `pg_group` system table, and then using the `grant` command to assign privileges
    to the group.


    # Creating Groups


    Currently, there is no easy interface to set up user groups. You have to explicitly
    insert/update the `pg_group` table. For example:


    ```

    jolly-> insert into pg_group (gronome, grolisid, grolist)

    jolly->      values (''posthackers'', ''1234'', ''(5443, 8261));

    INSERT 548224

    jolly->      grant insert on foo to group posthackers;

    CHANGE

    jolly->

    ```'
