- img_proc: true
  md: '# Installing and Managing Progress on Linux • Chapter 8 345


    put back, then your system is at risk. The most common problem in this scenario
    is a runaway process—a process that attempts to consume all available CPU. If
    you have traps rid of them.


    Kill-8 (SIGFPE) varies in behavior depending on the release of Progress. In some
    releases it just acts like an unhandled signal—that is, it dumps core and the
    process dies without any serious attempt to cleanup, which is essentially the
    same as kill -9. This is bad because you could be holding a latch, thereby bringing
    down the database. In more recent releases (including the Linux 8.3 release) it
    cleans up if SIGHUP were sent, but also creates a procore file.


    Kill-10 (SIGUSR1) in recent releases causes the process to create a procore file
    and a prototype without otherwise impacting the process (the process keeps running).
    This is a very neat feature it''s not well supported (isn''t documented anywhere
    and Tech Support is ignorant of its existence). The procore file is very handy—it
    contains a 4GL stack trace including line numbers showing where the process was
    at the time that it signaled. This is very handy for tracking down what a user
    was (really) doing when it became "hung".


    Kill-9 (SIGKILL) is never a good idea. It isn''t ever necessary. There is a myth
    that kill -9 is "good" because it "always works." This isn''t true—a process blocked
    in certain states (as D or disk-wait) will not respond to anything—including kill
    -9.


    When you use kill -9, the killed process cannot clean up (this is a UNIX feature—kill
    -9 is defined as uncatchable). Watchdog notices the client is gone and attempts
    to shut down the system and clean up on behalf of the client. Watchdog succeeds
    at cleaning up almost all the time. Sometimes a critical resource is being held
    (protected by a latch) and there is no way to clean up because the data was in
    the vanished memory space of the client. In event a watchdog brings down the database
    (if you aren''t running a watchdog) the broker will perform this function. That
    isn''t as big an issue as it sounds—if a latch is being held (and they always
    are when watchdog crashes the database) then nobody was doing anything except
    spinning on anyway your users are effectively frozen—they haven''t noticed it.


    The corruption that some people think they see after kill -9 comes from some of
    the other excitement that often happens along with it. In no event does "bad data"
    get written to disk either in the .bi file or as a direct result of any sort of
    a kill command. Rash actions deleting .bi files, misconfiguring the location of
    the .bi file, unwisely using dbprpr, or using the -F option can lead to data corruption
    (you have to ignore a lot of warning messages to succeed). Environments where
    kill -9 is used are usually uncontrolled and chaotic. Lots of stuff happens isn''t
    reported or well thought out and it''s difficult to get to the bottom of things.
    So kill -9 gets blamed.'
