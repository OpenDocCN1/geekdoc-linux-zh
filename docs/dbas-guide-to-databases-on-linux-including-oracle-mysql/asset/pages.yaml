    # Alternate Locations


    It is possible to create a database in a location other than the default location
    for the installation. Remember that all database access actually occurs through
    the database back-end, so that any location specified must be accessible by the
    back-end.

    Alternate database locations are created and referenced by an environment variable,
    which gives the absolute path to the intended storage location. This environment
    variable must have been defined before the back-end was started, and must be writeable
    by the postgres administrator. Any valid environment variable name may be used
    to reference an alternate location, although using a variable name with a prefix
    of PGDATA is recommended to avoid confusion and conflict with other variables.


    # NOTE


    In previous versions of Postgres, it was also permissible to specify an absolute
    pathname to alternate storage location. The environment variable style of specification
    is preferred since it allows the site administrator more flexibility in managing
    disk storage. If you prefer using absolute paths, you may do so by defining ALLOW_ABSOLUTE_DBPATHS
