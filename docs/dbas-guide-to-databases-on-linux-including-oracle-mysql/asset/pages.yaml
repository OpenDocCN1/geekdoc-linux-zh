    then the preceding step was necessary—simply do this step now.


    +   8. Create the database installation. To do this you must log in to your PostgreSQL
    superuser account. It will not work as root.


    ```

    $ mkdir /usr/local/postgresql/data

    $ chown postgres /usr/local/postgresql/data

    $ su postgres

    $ /usr/local/postgresql/initdb -D /usr/local/postgresql/data

    ```


    The **-D option** specifies the location where the data will be stored. You can
    use any path you want—it the installation directory. Just make sure that the superuser
    account can write to the directory (or create it) before starting **initdb**.
    (If you have already been doing the installation up to now the PostgreSQL superuser,
    you may have to log in as root temporarily to create the data directory.)


    +   9. The preceding step tells you how to start up the database server—do now.


    ```

    $ /usr/local/postgresql/bin/postmaster -D /usr/local/postgresql/data

    ```


    This will start the server in the foreground. To make it detach to the background,
    use the **-S** option.


    +   10. If you are upgrading from an existing installation, dump your data back
    in:


    ```

    $ /usr/local/postgresql/bin/psql < db.out

    ```


    You also might want to copy the old pg_hba.conf file and any other files you might
    have set up for authentication, such as password files.


    This concludes the installation proper. To make your life more productive and
    enjoyable, look at the following optional steps and suggestions.


    +   Life will be more convenient if you set up some environment variables. First,
    you probably want to include **/usr/local/postgresql/bin** (or equivalent) into
    your PATH. To do this, add the following to your shell startup file, such as **/.bash_profile**
    (or **/etc/profile**, if you want it to affect every user):


    ```

    PATH=$PATH:/usr/local/postgresql/bin

    ```'
