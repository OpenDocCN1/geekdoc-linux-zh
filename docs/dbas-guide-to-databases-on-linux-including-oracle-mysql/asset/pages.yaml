    Oracle8 Release 8.0.5.1.0 - Production

    PL/SQL Release 8.0.5.1.0 - Production

    ```


    ```

    SVRGR> connect internal

    Connected.

    SVRGR> alter user sys identified by newpassword

    Statement processed.

    SVRGR> alter user system identified by newpassword

    Statement processed.

    SVRGR>

    ```


    All of the base tables and views for the data dictionary are stored in the schema
    SYS. You should not modify any object in the SYS schema; this should be done only
    by Oracle. The SYSTEM account is granted all system privileges for the database
    and is used to create additional tables and views involved with database administration.
    The SYSTEM account is generally the owner of tables and views used by Oracle tools.'
