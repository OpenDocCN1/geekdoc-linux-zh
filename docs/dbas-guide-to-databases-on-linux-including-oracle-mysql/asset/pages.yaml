  md: '# The Linux Operating System • Chapter 23


    If you left NT on another partition, it is a little harder to rebuild the NT MBR
    but you can do it by using the rescue option and forcing NT to rewrite the MBR
    block.


    G: What applications run on Linux?


    A: Lots of applications are out there somewhere on the Internet. As far as most
    Linux distributions are concerned, the applications must be specifically Linux-oriented,
    just like Windows 9x/NT applications must run on their own platforms. There are
    several thousand products available for the Linux OS that are not just sold via
    (Windows-based) PC magazines, mostly because they are free, so there are no advertisements.
    You look them up on the Internet or you can look for commercial versions advertised
    in your favorite magazine or Web search engine. You are aware that all the big
    server services run on Linux-like database managers, network management, firewalls,
    Web services, e-mail services, and so on.


    G: I have never installed an operating system, is it difficult?


    A: Anything can be difficult without the proper knowledge or tools. Linux has
    been made as user friendly as any installation out there, with a lot less advertising
    as well. Put the CD-ROM in your machine and power up. Most new machines will start
    the installation automatically, while others need to be started manually. Even
    then, it is not that hard. Chapter 2 will cover the installation of Red Hat 6.1
    in detail.


    G: Do I have to know something about UNIX to use Linux?


    A: Yes, I''m afraid so. Although the GUI world of windows is nice, it is only
    one method of management. And management is the difference between all versions
    of operating systems. You need to get a clear idea of how UNIX/Linux does something
    before you can tackle the problem. Once you know the basics, you can hunt and
    peck with the best of them.'
