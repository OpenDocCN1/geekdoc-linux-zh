    # Performance


    A few optimizations can be done to improve the performance of MySQL with the compiler.
    By using the -static flag you will get the fastest database possible. Also, using
    UNIX sockets and not using network connections will improve performance as well.


    Different hardware configurations also help. By storing the database across multiple
    disks, the wait for head movements and seek times goes down because more disks
    are doing the work instead of one being the bottleneck. This is also known as
    *striping*. For striping on a larger scale, using a Redundant Array of Independent
    Disks (RAID) will give you the best results.


    Using symbolic links also helps by making links to directories in the distributions
    that are on other devices. Removing the swap file also helps too, for the operating
    system could be slowing down the database access by using the drive to swap out
    programs from memory.


    The MySQL daemon itself can be tuned. There are a variety of variables that can
    be tuned to increase performance. These can be set with the **mysqladmin** tool.


    ```

    shell$ ./mysqladmin variables

    ```


    | Variable_name | Value |

    | --- | --- |

    | back_log | 5 |

    | connect_timeout | 5 |

    | baseddir | /home/bschwab/mysql/ |

    | datadir | /home/bschwab/mysql/var/ |

    | delayed_insert_limit | 100 |

    | delayed_insert_timeout | 300 |

    | delayed_queue_size | 1000 |

    | join_buffer | 131072 |

    | flush_time | 0 |'
