  md: '# Installing and Utilizing Sybase on Linux • Chapter 5 197


    We need to know what partition was set aside for the master partition and syssystemproc
    partition. For this discussion, we will assume that it is partition 5 and 6 on
    the first SCSI disk. This partition corresponds to the device special file /dev/sda5
    and /dev/sda6, respectively. Also, we need to know the other two partitions we
    set aside on the second and third hard drive. For this discussion, we will assume
    they are /dev/sdb1 and /dev/sdc1, respectively.


    Login on the Linux console as root and install the RPM package with the following
    command:


    ```

    rpm -ivh sybase-11.0.3.1-rpm

    ```


    This command will install the Sybase SQL Server in the directory /opt/sybase.
    After installing the files, it will return to the command prompt. To continue
    with installation, execute the shell script located at /opt/sybase/install/sybinstall.sh.
    This script will first show the license agreement, which you must agree to, then
    continue to prompt you through the installation and setup of the database server.
    Figure 5.1 is a transcript of the questions followed by a discussion of the options.


    The first question that the script asks is if you should create a user account
    for the Sybase database server. You should probably let the script do this so
    the server can run as the Sybase user and group accounts. It yes, the script will
    prompt for a password for the Sybase user account. Choose a password for this
    user account and enter it twice. The script then updates the ownership of the
    files in the /opt/sybase directory appropriately so that the newly created user
    and group them own.


    The script indicates that the /opt/sybase/install/sybinit file should be executed
    as the Sybase user to continue the installation procedure. Before doing this,
    we need to update the ownership of a couple of other files. Specifically, we must
    allow the Sybase user and Sybase group to write to the partitions that we set
    aside for Sybase devices. To do this, as root, execute the follow commands (replacing
    /dev/sdxx with the actual disk devices which you wish to use for the database
    devices):


    ```

    [root@wanderer install]# cd /dev

    [root@wanderer /dev]# chown sybase:sybase /dev/sda5

    [root@wanderer /dev]# chown sybase:sybase /dev/sda6

    [root@wanderer /dev]# chown sybase:sybase /dev/sdb1

    [root@wanderer /dev]# chown sybase:sybase /dev/sdc1 ]

    ```


    Now that we have given the Sybase user ownership of the device devices, it is
    probably a good idea to ensure that no other users have read rights to the database
    partitions. If other'
