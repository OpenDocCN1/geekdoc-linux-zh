    # pg_options


    The optional file data/pg_options contains runtime options used by the back-end
    to control trace messages and other back-end tunable parameters. What makes this
    file interesting is the fact that it is reread by a back-end when it receives
    a SIGHUP signal, making it possible to change runtime options on the fly without
    restarting Postmaster. The options specified in this file might be debugging flags
    used by the trace package (backend/utils/misc/trace.c) or numeric parameters that
    can be used by the back-end to control its behavior. New options and parameters
    must be defined in backend/utils/misc/trace.c and backend/include/utils/trace.h.


    pg_options can also be specified with the -T switch of Postgres:

    postgres -T "verbose=2,query,hostlookup-"


    The functions used for printing errors and debug messages can now make use of
    the syslog(2) facility. Messages printed to stdout and stderr are prefixed by
    a timestamp containing the back-end pid:


    ```

    #timestamp #pid #message

    980127.17:52:14.173 [29271] StartTransactionCommand

    980127.17:52:14.174 [29271] ProcessUtility: drop table t:

    980127.17:52:14.186 [29271] SIInumumEntries: table is 70% full

    980127.17:52:14.186 [29286] AsyncNotifyHandler

    980127.17:52:14.186 [29286] Waking up sleeping backend process

    980127.19:52:14.292 [29286] AsyncNotifyFrontend

    980127.19:52:14.413 [29286] AsyncNotifyFrontend done

    980127.19:52:14.466 [29286] AsyncNotifyHandler done

    ```


    This format improves readability of the logs and allows people to understand exactly
    which back-end is doing what, and at what time. It also makes easier to write
    simple awk or perl scripts that monitor the log to detect database errors or problems,
    or to compute transaction statistics.


    Messages printed to syslog use the log facility LOG_LOCAL. The use of syslog can
    be controlled with the syslog pg_option. Unfortunate'
