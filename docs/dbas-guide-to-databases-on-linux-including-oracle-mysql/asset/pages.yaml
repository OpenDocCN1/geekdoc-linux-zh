  md: '# Issues to Present to Your Manager


    **Cost.** No doubt about it, zero operating system licensing cost is a big advantage.
    When calculating licensing costs for competing platforms, be sure to calculate
    the licensing costs for clients that utilize server, and the license cost of future
    upgrades. They can be tremendously expensive for some other operating systems.
    Zero licensing cost does not mean there is no support; commercial support is available.
    The big names in computer manufacturers are starting to offer their PCs preconfigured
    with Linux, usually Red Hat. This is a big plus in favor of using Linux if companies
    like Compaq, Dell, and IBM are deciding to support Linux on their hardware.


    **Reliability.** There is almost never a reason to reboot Linux; drivers and applications
    can be reloaded anytime. Most server operating systems are powered by Linux and
    other UNIX-style operating systems because they are extremely reliable. UNIX dominates
    the high-end market for production servers and high-end graphics workstations
    because it has the reliability and resilience to keep going.


    **Security.** Another reason for the strength of Linux and Unix on the Internet
    is their mature and robust security model. The kernel is well protected from direct
    access by any user, and the file system is designed to be secure and has been
    proven secure for years on the Internet. Most security breaches are not from weaknesses
    that the average or even above average user would be to exploit in any operating
    system—it comes from poor security practices of the users. Win98 has no real security
    built-in. Linux has security built into the file system and available on every
    file.


    # Doing a Proper Cost Analysis


    You need to do a proper cost analysis of bringing in another operating system
    into your network, the support needed (staff training; client training should
    be minimal), integration issues (if few any), interface issues (different type
    of window interface but same basic concepts), and cost savings.


    You will need to provide test resources, training resources, retraining resources,
    and helpdesk resources long-term with any operating system. By using a reliable,
    secure, and powerful operating system like Linux, you can cut down on some resource
    drain.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Summary


    The phenomenon that is Linux is here to stay. The grassroots feelings that center
    around Linux, and the new ease of installation and integration make Linux a very
    attractive product. It is a robust alternative to any Windows operating system
    as long as you remember it is NOT Windows per se. Linux is at home in the server
    arena as well as the desktop environment. Keep in mind that Linux is a version
    of UNIX, and you will need someone with UNIX or Linux experience to manage it.
    The interface is very similar to Windows but not exactly the same in all cases,
    but there is nothing you can do in Windows that you cannot do in Linux. There
    are plenty of user-type applications available for Linux that do all the same
    functions, albeit differently at. The main benefits are the cost, reliability,
    and security that Linux offers as an operating system, not to mention the steady
    increase in support from the big players on the block like Oracle, Informix, IBM,
    Sun, Dell, Compaq, and many more.


    # FAQs


    +   G: Will I lose access to Windows?


    +   A: Yes and no. Yes, you can it if you want to, and no, you do not have to
    if you do not want to. This will be made more evident in the installation section.
    Basically, you can add Linux as an alternate operating system to most any PC without
    losing the current configuration if you have available, unused disk space. You
    can also decide to remove all traces of any other operating system if you desire
    and use this machine with Linux only. Realistically speaking, you want to eliminate
    any other operating system on the database server. You would not be utilizing
    your disk space in having more than one when can run at any time (except in the
    case of running VMware—VMWare is best used on a work station rather than a server
    because of the overhead of running two operating systems at once).


    +   G: Do I need to keep Windows?


    +   A: Yes, if you absolutely cannot live without it. No, if you want to move
    on or if this machine is for development. Like any operating system, you can always
    rebuild it later. In general, for a database server, you should only use one.'
  merge: -1
