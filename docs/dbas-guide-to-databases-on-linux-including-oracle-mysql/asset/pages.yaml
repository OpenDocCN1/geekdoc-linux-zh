    # Build the Database Creation Scripts


    The Database Configuration Assistant utility (dbassist) is used to delete, create,
    or modify a database. There are two reasons why we will be creating database creation
    scripts rather than having the Oracle Database Configuration Assistant configure
    a basic database for us. The first is because you most likely will run into bugs
    during the installation process that will halt you in your tracks. The second
    is because it provides a great opportunity to see what components make up the
    database. Use the Help feature extensensively during each of the steps to create
    the database scripts.


