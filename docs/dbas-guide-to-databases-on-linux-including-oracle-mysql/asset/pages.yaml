    # Issues


    Depending on your Linux distribution, MySQL might have some problems running.
    MySQL works best with the latest version of glibc. This is the C library on which
    the database is based. MySQL requires at least version 2.0.7 of glibc. Most problems
    are related to not having the latest version of this library. You can find out
    which version is installed on your system with the following:


    ```

    shell rpm -q glibc

    ```


    If you use a binary distribution instead, you do not have to worry about the library
    version you are using. Older distributions have glibc, the predecessor to glibc.
    As long as glibc is at least 5.4.46, it will work.

    For Red Hat 4.X, there is a problem with resolving hostnames with older glibc.
    This can be fixed by updating to at least glibc, 5.4.46.

    For Red Hat 5.X, installing the latest glibc should work with the following RPMs:


    ```

    glibc-2.0.7-19

    glibc-devel-2.0.7-19

    ```


    Updating libraries requires root privileges. If you do not have root privileges,
    ask your system administrator to install or upgrade these libraries to the latest
    versions.


    # Threads


    MySQL also uses threads under Linux. Threads are smaller pieces of a program that
    can allow more work to get done by the machine than with a single process. As
    long as the latest glibc is in place, this should work without having to install
    any new programs. This can be downloaded at http://www.mysql.com/Downloads/Linux.


    Also, with glibc versions that are 2.1.1 or below, a problem occurs with INSERT
    DELAYED commands. This can be fixed with a patch at http://www.mysql.com/Downloads/Patches/glibc-pthread_cond_timed_wait.patch.


    MySQL development version 3.23.7 contains a temporary work-around for this problem.'
