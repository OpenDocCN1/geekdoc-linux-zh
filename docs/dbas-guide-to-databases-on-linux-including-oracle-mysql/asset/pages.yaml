  md: '# Chapter 9 • PostgreSQL on Linux


    You are ready to create your first database! You do so by using the command **createddb**.
    See the online manual page on **createddb:**


    ```

    bash$ createddb

    ```


    ```

    bash$ createdb myatabase

    ```


    This will create a database named **mydatabase**. After creating the database,
    you can access the database through the **psql** interface. See the online document
    by typing:


    ```

    bash$ man psql

    ```


    and access **mydatabase** by typing:


    ```

    bash$ psql myatabase

    ```


    This will put you inside the **psql** program at the **psql** prompt. Inside **psql**
    you can push up and down arrow keys for history line editing, or alternatively,
    use the **/** command. Now you can enter all the standard SQL commands at the
    **psql** prompt. Refer to a SQL tutorial or SQL textbook for more help.


    Exit the **psql** program by typing the **\q** command. This will put you back
    at the **bash$** prompt.


    Now, to use the **pgaccess** interface to PostgreSQL you should export a Linux
    environment variable called **DISPLAY:**


    ```

    bash$ export DISPLAY=<hostname>:0.0

    ```


    where **hostname** is the name of the Linux host in the file **/etc/hosts**, or
    the IP address of the host. For example, on my machine I:


    ```

    bash$ export DISPLAY=elmo:0.0

    ```


    or alternatively, I type:


    ```

    bash$ export DISPLAY=198.210.32.110:0.0

    ```


    **198.210.32.110** is the IP address of the host named **elmo**. See the manual
    page on **pgaccess** by typing:


    ```

    bash$ man pgaccess

    ```


    and access your **mydatabase** database by typing:


    ```

    bash$ pgaccess myatabase

    ```


    This will pop up a convenient GUI application on your X Windows system (KDE or
