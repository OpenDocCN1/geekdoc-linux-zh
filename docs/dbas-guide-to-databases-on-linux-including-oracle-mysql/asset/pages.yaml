  md: '# Introduction


    Oracle has the world''s largest market share in database management software by
    producing and maintaining one of the most powerful, scalable, and versatile relational
    database management systems (RDBMS) in existence. Although the Oracle RDBMS is
    not open-source, it is a very stable and robust application once it is properly
    installed and configured. With Linux and other powerful applications and platforms,
    Oracle is highly configurable and scalable, which can make it seem complicated
    to the unfamiliar. Unlike some SQL database server products, Oracle does not ship
    in a box-for-all-sizes.


    Since Oracle8 is incredibly feature-rich, it would take volumes to explain each
    feature of the database. The goal of this chapter is to get you up and running
    with Oracle8 or Oracle8i on Linux, at which time you can seek out more advanced
    documentation. This chapter presents an overview of how to install, configure,
    and use the Oracle database running on a Linux server. Several Linux-specific
    issues are covered, but a more complete treatment of the Oracle database can be
    gained from any of the many publications on the software. At present time, there
    are two releases of the Oracle RDBMS available, Oracle8 and Oracle8i. Each release
    has two editions, Standard and Enterprise. The Enterprise edition of Oracle8 provides
    more features and options than the Standard edition.


