    # Security


    Database security is addressed at several levels:


    +   Database file protection. All files stored within the database protected from
    reading by any account other than the Postgres superuser.


    +   Connections from a client to the database server are, by default, allowed
    only via a local UNIX socket, not via TCP/IP sockets. The back-end must be started
    with the -i option to allow nonlocal clients to connect.


    +   Client connections can be restricted by IP address and/or username via the
    pg_hba.conf file in PG_DATA.


    +   Client connections may be authenticated via other external packages.'
