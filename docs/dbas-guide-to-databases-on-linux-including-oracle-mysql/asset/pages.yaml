    no registry like NT or Windows 98, so the only things you need to worry about
    are the final links that are created at the end of the installation. You should
    also visit the Informix Web site for tips and techniques to recover disk space
    from some of the N files that are installed for languages you may not need.


    A script is available to help you delete files, but bear in mind that a reinstall
    may fail if these files do not exist. You will have to reextract the software,
    then basically reinstall from scratch.


    One final point to this part of installation: Do not remove the tar file for connect
    until you are certain that you will not need to reinstall. I personally wish that
    the SDK installation did not depend on this tar file be placed in this directory;
    it requires you to allocate twice as much space to install it. In the future,
    Informix should allow you to keep the tar files and installation scripts elsewhere
    on the system for reinstations, allowing you to reduce the allocation of space
    for.


    # Part III: Disk Setup and Server Operation


    We can now proceed with the operational aspects of IDS. What we are now discussing
    should be prepared for in advance, and you already should have reserved a certain
    amount of disk space for the dbspaces, where the actual database(s) and tables
    will reside. This chapter focuses on the installation aspects of an Informix server,
    so you should become familiar with some of the terminology of Informix before
    proceeding.


    Please become very familiar with the Administrator’s Guide for IDS, found at the
    Informix Web site, and although on CD-ROM. A physical printing of this manual
    is also available, usually at a significant cost. It is recommended that you obtain
    the latest CD-ROM of documentation known as the Answers Online Documentation,
    which contains documentation for all of the Informix database products. This CD-ROM
    is available directly from Informix and can be ordered from your regional sales
    office. The documentation is always available on the Informix Web site; take the
    time to download it and become familiar with the Administrator’s Guide. It describes
    everything you need to know to make your installation a success. The advantages
    of raw versus cooked files are discussed here, so it is to your advantage to read
    it.'
