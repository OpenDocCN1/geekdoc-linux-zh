  pgno: 463
- img_proc: true
  md: 'means that if a particular brick that you''re using to build your tower you
    can pull out that brick and replace it with another without having the entire
    structure collapse on your head.


    One of the only advantages that Microsoft has over Linux is in the ease-of-use
    of their development tools. However, this advantage is subject to debate. Because
    the Microsoft tools make it so easy to rapidly develop an application, design
    tends to suffer or be discarded altogether as a continuous running prototype developed.
    As any DBA will attest, proper database design is absolutely crucial before actually
    any coding. Microsoft tools attempt to shield the user from the actual complexity
    of the task at hand. Generally speaking, though, this is a direction Linux is
    moving in; for example, KDE, one of the most popular Linux desktops (windows managers),
    is widely known as being easier to use than even your Windows 98.


    Finally, UNIX enjoy a huge lead over NT, in terms of actual large-size installations,
    and in terms of developer support. While there are thousands and thousands of
    Visual Basic programmers who have made the transition to Web-based development,
    Visual Basic itself was never designed to handle the demands that Web development
    places on it. Also, because the Visual Basic tools and Visual Studio relieve the
    programmer of many design constraints, many VB programmers never learn proper
    coding procedures or database interfaces. While this may not be a problem for
    small applications, limitations and design flaws become readily apparent as an
    application grows.


    Aside from Microsoft, very few IT professionals contest Linux is a much more stable
    and full-featured platform than NT/2000. There is also an upgrade path to other,
    non-Intel platforms that NT doesn''t offer. For example, Linux is available on
    every major platform available, including Sun''s Sparc, Compaq''s Alpha, Apple''s
    PowerPC, HP''s PA-RISC, and Intel''s upcoming IA-64 processors. If those machines
    are not enough for you, IBM is porting Linux to their largest mainframes. In addition
    to very large machine-support, Linux has been ported all the way down to 3Com''s
    Palm Pilot and Linux Torvalds is developing a special version of Linux for the
    upcoming Transmeta processor which promises to revolutionize portable computing
    with extraordinary battery life and self-optimizing processes.


    The reality is that choosing Linux, you''ve made the right move. Open Source is
    here to stay and the entire industry has recognized and is committing to that
    fact.'
