  md: 'You can create users who are allowed to connect locally only, from specific
    remote hosts or both. There are also special tables that can restrict access to
    tables and from certain hosts that can combine a matrix of privileges that can
    be very specific to your environment. These privileges are given with the GRANT
    command, and if you know SQL well, you can apply the SQL commands directly to
    modify these tables to provide the setup that you need.


    Once set up, you need the database to be available as much as possible. The default
    way to start the MySQL daemon is with safe_mysql. This is actually a script that
    will monitor the status of the database daemon. If the database were to be shut
    or shutdown, it will automatically restart it. There is also a way to make sure
    the MySQL daemon is started upon bootup. By creating an rc script in the /etc
    directory, you can link it to the different run levels of the machine and make
    sure that when the machine is rebooted, MySQL is started along with the other
    programs on the server.


    The last few steps of installation require optimizing your distribution. You can
    compile optimizations in the compiler, if you have a source distribution. The
    benefit of having the source is that it allows you to compile with different options
    to take the best advantage of your platform. There are also hardware methods that
    can be utilized to speed up the database daemon that allow you to tweak and modify
    the variables to further speed up your database. Once you have completed an installation,
    set up the database users, and even tried working with the performance of the
    database, you will feel like a database wizard in no time.


    # # FAQs


    +   Q: How do I run more than one MySQL server on my machine?


    +   A: This can be accomplished in two ways:


    With the source distribution, you can pass specific flags to allow the database
    to point to a different location and use a different port:


    ```

    shell$ ./configure -with-tcp-port=port_number \

    -with-unix-socket=file_name \

    -prefix=/usr/local/mysql-3.22.9

    ```


    If you do not have the source distribution you may also use runtime flags to mysqld:


    ```

    shell$ /my/path/bin/safe_mysql -socket=file_name -port=port_number

    ```'
