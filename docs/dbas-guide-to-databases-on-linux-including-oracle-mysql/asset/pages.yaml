  md: '# Introduction


    In the middle of 1998, I was commissioned to develop a Web-administered database
    of digitized and cataloged fine art for a nonprofit organization. This organization
    was operating on a shoestring budget (as all nonprofits do) and could not afford
    to invest large sums of money into a large data-base solution, so Linux became
    the obvious choice. After spending a few weeks experimenting with some test cases
    on many of the open-source and freeware databases for Linux, we became heavily
    discouraged by speed when we reached the tens of thousands of records in the test
    sets. Since the full set was to start at 200,000 records and then grow to millions,
    these solutions were not feasible, and so were eliminated.


    Discouraged by the performance of the open-source databases, we were forced to
    use NT as our database platform running Microsoft SQL Server 6.5. We still wanted
    to leverage the fast and reliable Web server (Apache) and Perl on Linux, so we
    started using Sybase''s Open client soft with the Perl library, written by Michael
    Peppler. Luckily Microsoft appears to have gotten SQL Server from Sybase originally,
    and the Open Client was able to connect. We were not pleased with the performance
    of SQL Server on NT, but we could not afford a better solution at the time.


    After a month of development, we heard rumors that Sybase was releasing their
    SQL Server version 11.0.3 for Linux. Best of all, they were releasing it for free,
    and one of our month of development was wasted since we were already using their
    client libraries. When Sybase released the SQL Server, we downloaded and installed
    it. With absolutely no tuning, the exact same development database we were using
    on NT SQL performed easily 10 times faster than Sybase on Linux. We were extremely
    pleased and proceeded to develop the product completely on no-software. Since
    the time of the deployment of that product, Sybase released Adaptive Server Enterprise
    (ASE) 11.9.2 for Linux, as well as many other objects. ASE 11.9.2 was released
    for development purposes, but requires a license fee for deployment. Sybase has
    continued to offer free use and deployment of SQL Server 11.0.3.


    In this chapter, we will cover how to install Sybase SQL Server running on the
    Linux platform, and provide some minimal tuning for it. Since there are already
    many books published with much more room to devote to the running and tuning of
    Sybase SQL Server, this chapter focuses specifically on those things that matter
    be to get SQL Server running and running well on Linux.


    # Installation


    As mentioned in the introduction, Sybase is currently providing two versions of
    their database server for the Linux platform. Sybase SQL'
