    buy Enterprise if performance is of any concern.


    +   G: Is Progress available internationally?


    +   A: Yes; in fact, Progress has offices throughout the world. In some cases

    where Progress does not have its own presence, national distribution

    networks have been set up. Each office has different policies and price

    schedules so be sure to speak with your local office. A list is available

    on the Progress web site.


    +   G: Is there a recommended RAID level for use with Progress?


    +   A: There is no recommended parity-based RAID (2,3,4,5,7, ...). Parity-

    based RAID results in a parody of performance. It exists to make you

    are repeat customer of the RAID vendor, because you will continually

    need upgrades and enhancements to e out reasonable performance

    from such a system. RAID 0 (stripping) and RAID 1 (mirroring) are not

    parity-based RAID performance, and, therefore, good choices (especially when

    combined). You have to add RAM and lie about the completion of I/O

    requests ("write back" cache vs "write through" cache) to improve

    parity-based RAID performance, whereas you can improve the

    performance of striped and mirrored systems by adding disks. Disk is

    cheaper than RAM (especially the RAM required for RAID arrays and

    big time servers) and you can add lots more of them (there are always

    severe limits on how much RAM you can add even if you have a

    bottomless budget...). in that RAM when the power fails. If a write back cache
    is

    enabled (based RAID), one little slip and your database is in jeopardy (battery

    backups have been known to fail) because the array led to Progress

    about what is really on disk, which makes crash recovery very

    questionable.


    +   Just say No to RAID 5 (and its cousins).


    +   G: Why doesn''t Progress work with RAID 5?


    +   A: Progress does work with RAID 5. But like every other database, it

    works much, much faster with other disk technologies. Progress has

    no awareness of the sort of RAID system that you use. Only your

    users will be able to tell.'
