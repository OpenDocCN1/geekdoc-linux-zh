  md: '# Chapter 3 • Installing and Running Oracle on Linux


    # Table 3.3 Oracle8i Options


    | Options | Description of Features |

    | Oracle interMedia | Oracle combined a few different products into one larger
    product called interMedia. Oracle interMedia enables Oracle8i to manage text,
    documents, images, audio, video, and geographic information in an integrated fashion.
    (Not fully available over 8.1.5.) |

    | Oracle Visual Information Retrieval | Oracle8i Visual Information Retrieval
    (VIR) makes it easy to locate visually similar images, based on criteria such
    as color, pattern, and texture. |

    | Oracle interMedia Text | Oracle interMedia text provides text retrieval capabilities.
    It will index documents and provide text searches to locate archived documents.
    All search options are available from any PL/SQL or SQL tool. interMedia used
    to be called OracleText |

    | Oracle Time Series | Oracle Time Series allows time-stamped data to be stored
    in the database. It supports a basic set of functions to retrieve and process
    data. Functions include calendar, time series, and time scaling. |

    | Oracle Spatial | Spatial data is data with a specific location. Databases with
    geographic fields, such as addresses, phone numbers, and postal codes can be analyzed
    using a service known as geocoding. |

    | OracleServer | JServer is Oracle''s Java2-compliant Java virtual machine. Java
    code can be stored and executed from within the database. |

    | Advanced Replication | Replication is the process of copying and maintaining
    database objects in multiple databases that make up a distributed database system
    |


