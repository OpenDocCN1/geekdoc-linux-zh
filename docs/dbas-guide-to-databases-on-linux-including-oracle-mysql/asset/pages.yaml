    # WARNING


    Linux Native is a very fast file system, well-optimized for data files. Linux
    can use DOS, HPFS, NTFS, and other types of partitions, but not in an optimized
    fashion. Avoid them all—you do not need them. However, several new, even higher
    performance, file systems are being developed for Linux and should be considered
    when they are ready; these include Ext3, Reiserfs, and XFS.


    # Hard Drive Selection


    The hard drive option is an issue only if you have more than one physical drive
    to choose from. If your system has a single IDE drive available, it will be called
    hda (hard disk a). This would be the name for the first drive on the IDE type
    first controller. The next drive would be hdb on the same IDE controller. On the
    second IDE controller, the first drive would be hdc and the second would be hdd.
    On each of these drives the partitions are simply numbered from 1 to 16. Hence,
    the partition DOS world would usually refer to C: on the first partition, Linux
    calls hda1. The next partition primary partitions would be hda2, hda3, and hda4.
    However, from the original bizarre partition scheme design, there is designated
    Extended primary partition, and it can be hda2, hda3, or hda4, depending on how
    many other primary partitions already exist. Within this specific Extended primary
    partition, you can create up to 12 additional partitions. These 12 partitions
    start as hda5 and go to hda16. So, technically, you can have up to 16 partitions
    on any one physical drive.


    ---------


