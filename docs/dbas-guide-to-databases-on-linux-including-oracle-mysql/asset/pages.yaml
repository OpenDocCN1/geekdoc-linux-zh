  md: '# 424 Chapter 10 · Developing a Web-Based Application


    # Design Goals


    We had certain goals in mind when designing our shopping cart application, including
    easy maintenance and extensibility, clarity of code, and a user-friendly interface.


    # Clarity


    Because clarity is a focal point, we have decided not to include any sophisticated
    session identifier generation systems. We have also developed the entire application
    in a single PHP script. Everything is available through this script, so the browser''s
    base URL never changes as he proceeds through the site. To tell one user from
    another, we set a single cookie on each user''s computer, which contains a unique
    session identifier. This session identifier increments with each new computer
    as it connects (i.e., 1.2.3...), there is never a conflict. There is a security
    flaw with this scheme, though, which we will discuss in the security section later.


    # Extensibility


    One of the major barriers to extensibility and maintainability is difficult-to-understand
    code. PHP offers features to make it possible to develop large projects. PHP has
    a number of advanced features, such as objects and templates (using FastTemplate)
    that we will not use here. PHP4 (Zend) and PHP3 (using PHPLib) also offer more
    secure versions of session control.


    Of course, PHP also offers functions: global, static, and local variables; and
    a number of other features designed to develop modular code that most languages
    provide.


    We have developed the code with extensibility in mind, but some more work remains
    to be done. Your contributions are welcome. For example, we are currently working
    on a more advanced checkout system.


    # User-Friendly Interface


    One of our priorities was to offer the ability to browse and add items to a virtual
    shopping cart without providing any personal information, while making it easy
    for the user to register, log-in, or purchase those items without having to repurchase
    those items. We also wanted to make it simple to administer the store.


    # Designing the Schema


    Currently in open-source development is a full, free, secure version of this database.
    Details are available at www.syngress.com or www.sourceforge.org. This code is
    not designed to be secure and we strongly recommend you not implement it in a
    production environment. As we will'
