  md: '# 36 Chapter 9 • PostgreSQL on Linux


    Packager : Red Hat Software <http://developer.redhat.com/bugzilla>

    URL : http://www.ramifordist.net/

    Summary : The PostgreSQL server programs.


    Description : PostgreSQL includes the programs needed to create and run a PostgreSQL
    server, which in turn allow you to create and maintain PostgreSQL databases. PostgreSQL
    is an advanced Object-Relational database management system (DBMS) that supports
    almost all SQL constructs.


    Sometimes it is a good idea to check the list of files in the RPM package. To
    see the list of files in the PostgreSQL RPMs:


    ```

    # rpm -qpl postgres*.rpm less

    ```


    The RPM option -q is query mode, -p is package, and -l is list files. If PostgreSQL
    already exists on your system and if the database is running on the default port,
    then you must first stop the postmaster process. To see if any PostgreSQL process
    is running type:


    ```

    # ps -auxw | grep postmaster

    ```


    If the postmaster is running, exit all the PostgreSQL applications and stop the
    postmaster process. You can stop the postmaster by giving the following command:


    ```

    # /etc/rc.d/init.d/postgresql stop

    ```


    PostgreSQL installation must always be a "clean slate" installation in that your
    system can not have prior installations of PostgreSQL. If you do have an installation
    of PostgreSQL, you may need to move or rename it so that there is no "name collision."
    PostgreSQL is usually installed under the Postgres UNIX ID. Now to check if there
    is already a UNIX user by the name of postgres on your Linux system. Type:


    ```

    # cat /etc/passwd | grep postgres

    ```


    ```

    postgresql:x:20:223:PostgreSQL:/var/lib/postgresql:/bin/bash

    ```


    If you see the postgres user then you need to back up and clean up the PostgreSQL
    home directory -postmaster and delete the UNIX user postgres, or rename the UNIX
    user post to something like postgres2.

    Install the required postgres packages, but if you have enough hard disk space,
    install all PostgreSQL RPMs.


    ```

    # rpm -i postgres*.rpm

    ```


    If you want the Linux system to start up the PostgreSQL database automatically
    during the system booting, add PostgreSQL to system init startup scripts using
    the Linux command chkconfig. To read the online manual:


    ```

    # man chkconfig

    ```


    ```

    # chkconfig --add postgresql

    ```'
