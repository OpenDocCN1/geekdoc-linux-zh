    # Access Control


    Postgres provides mechanisms to allow users to limit the access to data that is
    provided to other users.

    Database superusers Database superusers (that is, users who have pg user.usersuper
    set) silently bypass all of the access controls described next with two exceptions:
    manual system catalog updates are not permitted if the user does not have pg user.usecatd,
    and destruction of system catalogs (or modification of their schemas) is never
    allowed.

    Access privilege The use of access privilege to limit reading, writing, and setting
    of rules on classes is covered in grant/revoke(l).

    Class removal and schema modification Commands that destroy or modify the structure
    of an existing class, such as alter, drop table, and drop index, only operate
    for the owner of the class. As mentioned earlier, these operations are never permitted
    on system catalogs.


