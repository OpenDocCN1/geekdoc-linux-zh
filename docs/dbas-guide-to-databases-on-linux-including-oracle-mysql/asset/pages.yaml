- img_proc: true
  md: '# Onmonitor


    One of the tools we didn''t use for the installation was monitor. Onmonitor is
    available for engine monitoring and maintenance, but does not offer you a lot
    of flexibility or hand-holding.


    You can run monitor and change or view many of your settings for the engine; however,
    most Informix DBAs opt for command-line control. In a production environment,
    the more control you have, the better off you are, simply because one wrong command
    can erase company data. Simply run monitor and the following output will appear
    as a character-based user interface along the same lines as dbaccess:


    ```

    Dynamic Server: Status Parameters Dbspaces Mode Force-ckpt ...

    Status menu to view Dynamic Server.

    ```


    ```

    ----------------On-Line-------------------- Press CTRL-W for Help. --------------------

    ```


    For example, you can view the same basic information with monitor as you can with
    the onstat command:


    ```

    STATUS: Profile Userthreads Spaces Databases Logs Archive ...

    Display system profile information.

    ```


    ```

    ----------------On-Line-------------------- Press CTRL-W for Help.--------------------

    ```


