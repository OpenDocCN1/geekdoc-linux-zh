    # Disk Management—Supporting Large Databases


    PostgreSQL can support extremely large databases with sizes greater than 200GB.
    Performance of 32-bit CPU machines will decline rapidly when the database size
    exceeds 5GB. You can run a 30GB database on a 32-bit CPU, but the performance
    will be degraded. Machines with 32-bit CPUs impose a limitation of 28GB on RAM
    (though newer versions of Linux can extend this a little farther), 2GB on file
    system sizes, and other limitations on the operating system. Use the special file
    systems for Linux made by SGI, IBM, HP, or ext3-fs to support file sizes greater
    than 20GB on 32-bit Linux machines.


