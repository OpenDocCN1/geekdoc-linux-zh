  md: '# Chapter 2 • Basic Red Hat Linux Installation


    # Not Using DHCP


    The rest of the network configuration screen is used to configure the TCP/IP settings
    manually for this host. At a minimum, you need to supply the IP address and the
    associated network mask or netmask. The interface will try to guess your network
    mask setting if you use the Tab key to go to the next field (it may pause a short
