    # Kernel Parameters


    Now all of the Progress products have been copied from the CD, the Linux kernel
    may need to be configured. Progress uses two main sets of resources controlled
    by the Linux kernel: shared memory and semaphores. Before we decide on the exact
    values of each parameter, it is important to understand a little background on
    these resources to set them properly.'
