    You can now run the **oninit** program to initialize the rootdbs. Keep in mind
    that what we do is only for the initial installation. After this you will not
    repeat this initialization start-up for everyday operations. The **oninit** program
    is the same program we use for starting and stopping the engine on a daily basis,
    but without the options for our initial installation. You need to be root for
    our install operation; hereafter, the only login for daily startup will be informix,
    and **oninit** is used without any options.


    To initialize your engine, the following command is run from any directory:


    ```

    $ oninit -ivy

    ```


    Think of the **ivy** command combination as poison ivy! Stay away from the **-i**
    option except to run this initialization. You want to use it only once—it will
    cause you pain if you use it again on the same instance.


    +   - **i** initializes the instance—do this only once

    - **v** means verbose mode

    - **y** means answer yes to all prompts


    Once you run the **oninit -ivy** command, the following dialog will appear:


    ```

    rebel:root # oninit -ivy

