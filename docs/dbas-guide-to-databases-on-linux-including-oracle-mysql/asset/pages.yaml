  md: '# Installing and Utilizing Syabase on Linux • Chapter 5 223


    We now have to extract some information from the database. We are interested in
    a complete list of all of our users sorted by last name. We will execute the following
    command to find out:


    ```

    SELECT username, lname, frame, email FROM user_logins SORT BY lname

    ```


    The sort operation on this table would take quite a long time because we never
    declared an index on this column. An index on a column makes sorts and references
    to the column incredibly faster than the same sort or reference without an index.
    Good database design requires deciding which columns must be indexed and which
    do not. Indexing every column is self-defeating because it increases the overhead
    on the database both in size (to maintain the index trees) and in speed (to update
    the index trees when the table changes). To create an index on the lname and fname
    columns so that this previous report will run better, we must execute:


    ```

    CREATE INDEX user_logins_lname_fname ON user_logins(lname, fname)

    ```


    Finally, we should delete this table, because it is only a test. We will delete
    it with the following-command:


    ```

    DROP TABLE user_logins

    ```


    If all of these commands worked for both the sa user and the brad user then your
    database is fully configured and running correctly. If any errors occurred during
    this simple database test, you should go back through this chapter, ensuring that
    you completed all the configuration and installation tasks as described. Keeping
    your database running top-notch is often a full-time job for a trained DBA; small
    databases should also be able to be maintained and run through the commands we
    discussed in this chapter.


    # Database Design


    Database design is a very important step in any database development. It is usually
    the first step in the development, and can be one of the most critical. A poor
    database design usually is doomed to remain in place because the cost of changing
    it means completely redeveloping all of the applications that rely on it.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# 224 Chapter 5 Installing and Utilizing Sybase Linux


    When setting out to develop a new database, a lot of thought needs to be put into
    not what type of data needs to be stored in the database, but also all the interdependencies
    and use cases are that may exist now or in the future. Designing a database becomes
    almost like trying to predict the future, since a nontrivial database is likely
    to be around for quite some time. Therefore, we must consider what questions are
    likely to be asked of the database and how the responses are likely to be structured.


    To try and portray some of the considerations that go into developing a good database,
    let us consider, as an example, the company publishing this book. They may want
    to create a database of information about all the books that they publish, which
    chapters are in which books, and which authors wrote chapters. As a first attempt
    at designing this database, let''s consider the pieces of data that are likely
    to be referenced from others.


    Obviously, the books that they publish will contain chapters. We will represent
    this by including the book''s primary key in the chapter column. This will allow
    us easily to know which chapters belong to which book.


    The next set of data to relate is the author to the chapter. It is possible (and
    is the case in this book) that different people write different chapters in a
    book. Thus, our data model has to be able to allow each chapter to have the primary
    key of the author table in the chapter table. This will work so long as there
    is not more than one author for each chapter. Because it is certainly foreseeable
    that multiple authors may be writing a chapter, this data model would be a poor
    choice. Likewise, we cannot include the primary key of the chapter in the author
    table, because it is certainly possible the same author to write multiple chapters.


    This many-to-many relationship comes up quite a lot in data modeling. To model
    this many-to-many properly, we could take the naive approach and create multiple
    author columns in the chapter table, but we would invariably run into the problem
    that the number of key columns that we created was not enough. Also, trying to
    write an SQL statement to handle the case of multiple foreign key columns would
    be cumbersome at best.'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Installing and Utilizing Sybase on Linux • Chapter 5 225


    The best way to model this many-to-many relationship is to create another linking
    table that will contain a key to the chapter table and the author table. Thus
    for every chapter that an author wrote, there be one row in the linking table,
    and for every chapter that had multiple authors, there would be one row in the
    linking table for each author.


    In the hopes of clarifying this example, the following SQL script will create
    the four tables, populate them with some example data, and query them. In our
    example, we will say that there is only one book title "The Wild Database Model."
    "Chapter 1" and "Chapter 2." Chapter 1 was written exclusively by Joe User and
    Chapter 2 was written by Joe User and Sally User.


    ```

    CREATE TABLE books (

    book_id NUMERIC(10,0) PRIMARY KEY,

    book_title VARCHAR(100)

    )

    CREATE TABLE chapters (

    chapter_num NUMERIC(10,0) PRIMARY KEY,

    book_id NUMERIC(10,0) REFERENCES books(book_id),

    chapter_title VARCHAR(100)

    )

    CREATE TABLE authors (

    author_id NUMERIC(10,0) PRIMARY KEY,

    name VARCHAR(30),

    lname VARCHAR(30)

    )

    CREATE TABLE chapter_author_link (

    link_id NUMERIC(10,0) IDENTITY PRIMARY KEY,

    chapter_num NUMERIC(10,0) REFERENCES chapters(chapter_num),

    author_id NUMERIC(10,0) REFERENCES authors(author_id)

    )

    INSERT INTO books VALUES (1, ''The Wild Database Model'')

    INSERT INTO chapters VALUES (1, 1, ''Chapter 1'')

    INSERT INTO chapters VALUES (2, 1, ''Chapter 2'')

    INSERT INTO authors VALUES (1, ''Joe'', ''User'')

    ```'
