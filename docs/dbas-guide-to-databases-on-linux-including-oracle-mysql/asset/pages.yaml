  md: "# Large Databases\n\nSince Postgres allows tables larger than the maximum file\
    \ size on your system, it can be problematic to dump the table to a file, because\
    \ the resulting file likely will be larger than the maximum size allowed by your\
    \ system.\n\nAs pg dump writes to stdout, you can just use standard *nix tools\
    \ to work around this possible problem:\n\n+   Use compressed dumps:\n  % pg_dump\
    \ dbname | gzip > filename.dump.gz\n  reload with:\n  % createdb dbname\n  % gunzip\
    \ -c filename.dump.gz | psql dbname\n\ncat filename.dump.gz | gzip | psql dbname\n\
    \n+   Use split:\n  % pg_dump dbname | split -b 1m - filename.dump.\n  reload\
    \ with:\n  % createdb dbname\n  % cat filename.dump.* | psql dbname\n\nOf course,\
    \ the name of the file (filename) and the content of the pg_dump output need not\
    \ match the name of the database. Also, the restored database can have an arbitrary\
    \ new name, so this mechanism is also suitable for renaming databases.\n\n# Using\
