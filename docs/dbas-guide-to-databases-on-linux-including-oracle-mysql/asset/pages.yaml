- img_proc: true
  md: '# Installing and Managing Progress on Linux • Chapter 8 319


    Shared memory is a facility to set aside RAM for multi-user access. Instead of
    writing all of the database information directly to disk where each user would
    perform a slow IO operation, Progress uses faster RAM as a kind of database record
    depot. Blocks are read from disk into the shared memory area (also known as the
    Buffer Pool) where they are available to not only the user that requested the
    data, but to all users of the system. The Progress database engine is multithreaded
    and takes advantage of SMP if multiple processors are available. Since multiple
    users attempt to modify shared memory, Progress uses the other resource, semaphores,
    to lock portions of shared memory as necessary, and to ensure that operations
    on shared memory are atomic. (Actually, semaphores are only used for “slow” mutex
    locks, or latches, are used for “fast” operations.)


    Modified data blocks are eventually written back to disk, but not always immediately.
    If so evicted from the buffer pool—if it sounds like this is dangerous, rest assured
    the database system has been designed to be rock solid. Although Oracle has a
    reputation for crashing proof, Progress is the highest scorer in that category
    in user surveys such as VAR Business’ Annual Report Cards.


    Progress has built in concurrency, crash recovery, and data management schemes
    to ensure the integrity of the database while keeping used blocks in the pool
    for possible reuse (and therefore eliminating expensive I/O operations). The details
    of these schemes are complex and beyond the scope of this book. For more information
    see the Technical Papers section of the PEG, at http://www.peg.com. The architects
    of the database engine, commonly referred to as the Engine Crew, have written
    several excellent papers explaining the various database internals.


    Following is a list of each parameter and how to set the value of each one. Most
    are based on either the number of users in a system, or on the number of databases.
    The include files sem.h and shm.h contain descriptions of these parameters in
    the Linux kernel. Both files are generally found under /usr/src/linux/include/linux.


    # Shared Memory


    Shared memory is organized into segments; each individual segment is given a unique
    identifier. Each Progress database requires at least one segment of shared memory
    and one identifier to go with it. Take the number of databases you intend to run
    on the system, and round the number up to the nearest multiple of five for safety—the
    result is the minimum setting for SHMMNI. The default for Red Linux is 10, which
    should be sufficient for one database.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Chapter 8 • Installing and Managing Progress on Linux


    +   - SHMMNI—Number of shared memory identifiers

    - SHMSEG—Number of shared memory segments per process

    - SHMMAX—Maximum size of a shared memory


    SHMSEG and SHMMAX work together as a pair. Since shared memory is organized in
    segments, the maximum size of shared memory is the number segments times the size
    of each segment. Progress under v8.3 will create segments that are the lower of
    SHMSEG or 16,776,214 bytes (16MB). Because Progress currently will never use a
    segment larger than 16MB, even if SHMMAX is set, it makes sense to set it to no
    larger than 16,776,124.


    How much shared memory will be needed? The manuals describe the exact amounts,
    but invariably the amount of RAM used by the buffer pool dwarfs any other shared
    memory usage. For performance reasons, try to give each user of a production system
    an absolute minimum of about 2MB of buffer pool space per user. If at possible,
    consider using 4MB and purchasing more if needed. Remember, the shared memory
    must be contained in physical RAM. If you allocate more memory than you have physical
    RAM, Linux will page portions of the buffer pool in and out of swap to cover the
    difference. This will have a dramatically negative impact on performance.


    Take the number of users of each database and multiply by the amount of RAM you
    have decided to reserve. Do this for each database, and determine which one will
    have the maximum amount of shared memory. This is the high-water mark needed to
    set SHMSEG. Divide the maximum RAM by the 16MB we set SHMMAX to, and round up.
    This is the largest number of segments any database will require, and our value
    for SHMSEG.


    # Semaphores


    Semaphores, like shared memory, are organized into a name set with an identifier.
    Similarly, Progress will require one set of semaphores per database. The calculation
    for SEMMNI is the same as SHMMNI—both parameters are usually set to the same value.


    +   - SEMMNI—Number of semaphore identifiers

    - SEMMNS—Number of semaphores system-wide

    - SEMSSL—Number of semaphores per identifier


    Progress uses approximately five semaphores for its own internal use, one for
    each concurrent user logged into that database. SEMSSL needs to be set to the
    maximum amount of users logged into the database with the most concurrent users.
    Set it to the maximum number of users in that single database plus the five extra
    and an additional 10 percent as a safety factor.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '# Installing and Managing Progress on Linux • Chapter 8 321


    SEMMNS in most Linux kernels generally is set to SEMMNI * SEMMS. There is nothing
    wrong with this, but it does assume that every user will log into every database.
    If there is only one database there is no real need for any other calculation,
    but on multiple databases this can be somewhat wasteful. When doubt, simply let
    the calculation be. If you expect to have a very large database and also a very
    small one, like a development database with only five users compared to the 400
    users on the production system, consider modifying SEMMNS. A good rule of thumb
    is to take each database and add these numbers together. Add an additional five
    for each database and an additional 10 percent for safety.


    Under some UNIX variants are also Semaphore and a Semaphore map (SEMUME/SEMAP),
    but in Linux these are no longer used.


    # Other Miscellaneous Parameters


    In addition to shared memory and semaphores, there are a couple of parameters
    that need to be considered:


    +   - MAXUMEM—Maximum memory usage of a process

    - NOFILES—Maximum number of open files per process

    - NBUFS—Number of open files system-wide


    Since each user, and the database process, must connect to the shared memory segment,
    the amount of memory each Linux process access can be considerably larger than
    normal. MAXUMEM needs to be set to a level equal to the size of the Progress executable
    image, plus the largest shared memory area in the system. A good rule is to take
    SHMSEG * SHMAX (which gives the largest possible amount of shared memory) and
    add 5MB, or just set it to the amount of physical RAM in the system.


    As we will discuss later, some databases will be composed of only two or three
    files, larger databases using a multiverse structure are split into many operating
    system files. When such databases are used, the NOFILES, NFILES, and NINODES parameters
    may need modification. Under v 8.3 of Progress, the maximum number of files a
    database can use is 256 (v 9 has the capacity of using thousands of files, so
    be careful to make a better calculation when v9 becomes available on Linux.) Each
    user also requires the three standard input/output/error files, any temporary
    and pool files created (as many as 12 file handles, not counting database related
    files). Therefore, NOFILES should never be higher than 300.


    NFILES is the system-wide number of files, which at its maximum would be the number
    of users logged in the number of databases'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# 322 Chapter 8 Installing and Managing Progress on Linux


    times the number of operating system files in each database. Remember that this
    is only the amount of Progress usage. Linux itself and other Linux users'' open
    files must be added to this number for NFILES, but as you can tell from this calculation,
    that number can become very large fast. The calculation may be safe, but it assumes
    each user is logged into each database. In reality, smaller numbers may be appropriate.


    On small sites where there is only one database, this is not generally an issue,
    but on larger sites this can be quite wasteful. A true value for NFILES would
    calculate the number of concurrent users for each database and multiply by the
    number of operating system files for that particular database. Each of these values
    database would be added together to create the usage for Progress. Perhaps 10
    percent should be added in case of expansion or changes to login patterns. Also
    add another 10 percent for the operating system file usage.


    There is one last Linux parameter to review. Since Progress uses its owner pool
    to manage access, standard Linux disk buffers are not entirely useful. On systems
    where RAM is tight, it is often advantageous to reduce the Linux buffers slightly
    allocate this towards shared memory. NFS controls the number of buffers, but caution
    should be exercised with this parameter. All spool files, program files, and other
    operating system files must go through the Linux disk buffers. Setting this value
    lower may allow for better performance of the database, but cause a slowdown in
    printing and other disk access. If in doubt, reduce this parameter gradually from
    the original setting. Watch the system carefully for printing slideshows and pauses
    while new Progress programs are run. Balance that with the Progress performance
    tools to see how a larger Buffer Pool affects the database performance. More details
    on the balance of RAM allocation are in the Configuration section, later.


    # Environment Setup


    Setting up the Linux environment for Progress is a simple matter of establishing
    a few environment variables and possibly modifying the TCP/IP hosts and services
    files—tasks that will be familiar to the average Linux system administrator. If
    a character-based application is going to be used then there also be modifications
    to the terminal definition that Progress uses. This terminal setup is in addition
    to the normal termcap/terminfo setup, and on occasion can be more complex than
    just choosing the right type terminal.


    # Environment Variables


    Progress requires two Linux environment variables—DLC and TERM. The DLC variable
    should be set to the directory where Progress was installed. Typically this would
    be something like the following (bash):'
  merge: -1
  pgno: 357
- img_proc: true
  md: '# Installing and Managing Progress on Linux • Chapter 8 323


    ```

    DLC=/cpt/progress/dlc83b

    TERM=linux

    Export DLC TERM

