  md: '# Installing DB2 Universal Database Version 6.1 on Red Hat Linux — Chapter
    6 257


    skip this section and proceed to the section Installing a DB2 Client, later in
    this chapter.


    To set up the Control Center on your DB2 server, perform the following steps.


    +   1. Log on to your workstation as a user with root authority.

    2. Download an appropriate JRE. For all the latest information on supported JREs
    and browsers, go to http://www.software.ibm.com/data/db2/


    To run the Control Center you need to be running at least Java 1.1.7 v3 or later.

    A JRE for Red Hat is available from the Blackdown Web site at http://www.blackdown.org/java-linux/mirrors.html.

    For this example, I visited the mirror site at ftp://metalab.unc.edu/pub/linux/devel/lang/java/blackdown/1.1.7/i386/glibc/v3/
    and downloaded the jre_1.1.7-v3-glibc-x86-native.tar.gz and placed it in the /tmp
    directory.


    # NOTE


    There are two types of threads associated with a JRE—native and green. Threads
    affect the way the Java code is run on your work station. You must download the
    native threads version of the JRE that you want to use. The DB2 Control Center
    does not support green threads.


    +   3. Change focus to the directory where you downloaded the JRE. For our example,
    this would be the /tmp directory. Enter the following command to change to this
    directory:


    ```

    cd /tmp

    ```

    4. Once you have downloaded the appropriate JRE, you need to unzip and untar it
    by entering the following command:


    ```

    tar xvfz jre_1.1.7-v3-glibc-x86-native.tar.gz

    ```

    5. Log on to your workstation as the instance owner. For our example, log on to
    the workstation as the db2inst1 user.


    # TIP


    You can use the – db2inst1 command to log on as this user; however, ensure that
    you enter this command with the – parameter so that the DB2 profile gets read
    correctly.'
  merge: -1
  pgno: 292
