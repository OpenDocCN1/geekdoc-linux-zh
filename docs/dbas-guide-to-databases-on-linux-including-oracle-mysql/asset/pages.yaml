  md: '# Preface


    It is hard to believe that Linux is less than 10 years old. In that short timeframe,
    the fledgling operating system that was written as an experiment by a Finnish
    graduate student has exploded in function and usage. The similar explosion of
    the Internet fueled the growth of Linux.


    Nowadays, Linux is rapidly gaining popularity as an enterprise-level, mission-critical
    server platform. Since its first general release, Linux has proven itself as a
    stable and scalable operating system. However, only recently have the major software
    vendors begun porting their applications onto the Linux platform. The most notable
    advance in this area came in 1999 when the four major database vendors—Oracle,
    Informix, Sybase, and IBM—announced general support for the Linux platform. Linux
    had other databases available to it before then, but the participation of these
    highly respected vendors gave it the final push into the limelight that it needed.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# About This Book


    Many of the chapters walk you through the installation of various data-bases,
    as well as how to test and utilize some critical features for maintaining the
    databases. The decision is left to the reader to exactly which database is best
    for a given project, but a few pointers will be given in the introduction and
    along the way to help you choose.


    # Organization of This Book


    This book covers the installation and configuration of several major databases.
    It is intended primarily as a reference and, as such, there may be some readers
    who may not necessarily read the book to cover. With that in mind, each chapter
    is written to stand on its own as a reference for each particular database.


    **Chapter 1: The Linux Operating System** is a summary of Linux in general. This
    chapter explores a bit of history and some of the logistics of Linux, and is a
    good background chapter for those unfamiliar with Linux and the Open Source movement.


    **Chapter 2: Basic Red Hat Linux Installation** is a step-by-step review of installing
    the most popular flavor of Linux, Red Hat. If the database server in question
    is to be a production server, a clean operating system install is recommended
    for new hardware, which will result in the most stable configuration.


    **Chapter 3: Installing and Running Oracle on Linux** Oracle tends to be the most
    popular and widely recognized database on the market today. It is highly scalable
    and extremely reliable. However, it is rather expensive and may not be appropriate
    for small businesses.


    **Chapter 4: An Informix Installation on Linux** Informix follows Oracle in scalability
    and reliability. Usually the choice between the two databases falls simply to
    personal preference.


    **Chapter 5: Installing and Utilizing Sybase on Linux** Sybase has a very loyal
    following. If you are familiar with Microsoft SQLServer, Sybase follows as a logical
    choice for the Linux environment. Microsoft’s design for SQLServer closely follows
    the Sybase design.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'Chapter 6: Installing DB2 Universal Databases Version 6.1 on Linux DB2 is the
    most under-appreciated of the major databases. While it is still mostly used on
    mainframes, the DB2 port to Linux is powerful and scalable. You should not discount
    DB2 as a viable alternative without carefully examining this chapter.


    Chapter 7: A MySQL Installation on Linux MySQL is the most popular of the freeware
    databases. It is easy to set up and configure, and lends itself well to Web-based
    applications. However, it tends to be less scalable for extremely large databases.


    Chapter 8: Installing and Managing Progress on Linux Progress is usually overlooked
    by most DBAs. Progress often embeds itself in third-party applications but is
    a very capable database on its own.


    Chapter 9: PostgreSQL on Linux PostgreSQL comes installed with several Linux distributions.
    It is open source like MySQL, and offers a very easy startup for a small database
    application. Its scalability is limited, however.


    Chapter 10: Developing a Web-Based Application provides a sample database application.
    Once a database is installed, there are many things that can be done with it.


    Online Usenet groups, white papers, and user groups are valuable resources for
    computer professionals to network and share ideas. To that end, throughout the
    book, we''ve provided valuable links and resources to access on the Web.


    # Databases on Linux


    Presumably, you have already made the decision to implement a database solution
    on Linux. The stability and reliability of the Linux operating system suits a
    database well. As an open source operating system, Linux is well supported and
    constantly updated. The user must realize from the beginning that the major kernel
    releases and the minor bug fixes must be applied to the operating system with
    regularity. Care must also be given to the actual hardware for the database server.
    Redundancy should be built in time Consider some sort of Redundant Array of Independent
    Disks (RAID) configuration. Different databases like different configurations.
    It goes without saying that as much memory as'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'possible should be installed; the best database available would fail miser-ably
    if it is deployed on sufficient hardware.


    With the operating system and server in hand, several questions should now be
    asked:


    +   * What do you want your database to do?

    * What specific production environment do you have: small, medium, or large?

    * Is this a mission-critical application?

    * Will there be support needs for this application?


    Each of the databases covered in this book has its strengths and weaknesses. If
    the decision has not already been made, or even if it has, each should be considered
    carefully. A little extra thought never hurts before the solution is implemented.


    Oracle always rises to the top as one of the leaders in scalability and reliability.
    Oracle also requires highly qualified DBAs and support contracts from the company.
    This combination, along with the high cost of commercial licenses for Oracle,
    usually makes it out of reach for smaller companies with smaller database needs.
    Informix follows this same pattern. It is a highly functional and reliable database,
    but the cost of acquiring and supporting it is too high.


    Sybase comes out as a good middle of the road solution. It may not quite have
    as rich feature as Oracle or Informix, but it is certainly not lacking in the
    essentials. Its cost is more manageable, and, if the user is familiar with Microsoft
    SQLServer, its configuration is very straightforward. Sybase scales to most applications,
    and provides good stability. Much of the same can be for DB2 It can be a bit more
    challenging to support, but it is just as feature-rich and scalable as Oracle.
    The cost for commercial applications is lower as well. Progress also fits into
    this category.


    The freeware databases like MySQL and PostgreSQL are very good entry-level solutions.
    The cost is very nice, of course... free. These databases are easy to implement
    and easy to maintain. A novice user with the help of this book could be up and
    running in just a day or two. The main drawback with these databases is scalability.
    Usually the freeware databases have performance problems with more than a million
    records. Still, it is a perfectly viable solution to start with one of the freeware
    databases and then migrate to one of the larger ones. Exporting the tables into
    SQL and then importing the SQL into a different database usually works very well.
    Spending time on a solid database design and a good data model from the very start
    will save a great headaches if you'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'plan on taking this route. This is, of course, true for any database imple-
    mentation, but is especially pertinent to a resource in a data migration situation.


    This book should be used as a resource to help you decide which will best suit
    your needs. In the end, only you can decide which one is right for your purposes.


    # More Database for Your Buck


    Yesterday''s databases are a shadow of the powerful applications currently being
    produced by today''s top corporations. Managers and DBAs have many options to
    choose from today. The standardized nature of SQL makes the data very portable.
    The use of BLOBs (Binary Large Objects) makes it possible to store images and
    executables in a database. The-ively new technology of XML allows the data that
    was once locked behind two or three application layers to be served instantly
    to the Web. In general, the databases covered in this book can fit into two categories:
    traditional and open source.


    # Traditional Databases


    Databases are traditionally programmed and supported by large software companies.
    The most notable advantage to this model is product support. For an annual maintenance
    fee, the software vendor is readily available for product support, troubleshooting,
    and upgrades. Most large companies that rely heavily on extremely databases absolutely
    refuse to give up the extra layer of accountability that this support model offers.
    One obvious disadvantage of the traditional model is the slowness of the software
    vendor to change its product and add new features. The latest technology is often
    months to years in the development cycle before it makes it into the hands of
    the end user. A significant disadvantage is that companies, like any other corporation,
    are forced to watch their bottom line. The cost of the individual licenses can
    be prohibitive for many users. The vendor is usually subject to intense competition.
    As a result, products come out early, and patches are often needed. A prime example
    is Oracle 8i. The long-awaited version of Oracle was programmed to be Internet-ready,
    but was filled with bugs. Oracle 8i, Release2 fixes those bugs, but was released
    one year later. This is a scenario that many software vendors deal with all the
    time.


    # Open Source Databases


    The newer software development model is open source. Open source has the large
    advantage of its development community. There are usually'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'or a few people that are responsible for the code with basically the entire
    Internet as a developer base. The resulting software is updated and revised often.
    The latest release of a particular piece of software has the latest features and
    the newest technology. This, of course, leads to the disadvantage that those features
    may not be entirely tested yet. The system administrator must keep on top of the
    new changes and additions, and a more advanced user is required to maintain the
    system. Larger companies balk at the fact that traditional support and accountability
    is not available. The support falls on the administrator. In all honesty, that
    is exactly how most corporate systems are supported anyway. The administrator
    uses his or her own knowledge and applies the knowledge that can be gained from
    Web sites and newsgroups on the software in question.


    # Utilizing and Maximizing Your Database


    Having a database on a Linux server is a great thing, but what should you do with
    it? For the most part, the answer is: “The sky’s the limit.” Tracking employee
    data, managing customer requirements, correlating marketing data, improving the
    efficiency of an ordering system, and a host of other applications can be conceived
    and programmed.


    # Basic Features


    All databases speak SQL (Structured Query Language). This basic standard assures
    compatibility from one database to another. Some databases implement more or less
    of the standard, so be careful in the migration. As an example, don’t try to migrate
    an Oracle database using BLOBs into a PostgreSQL database that does not support
    those types of objects. All databases support the basic SQL constructs: SELECT,
    INSERT, UPDATE, DELETE. In addition, all should support the basic user and table
    schema that is used to create and manage database tables and user permissions.


    # Advanced Features


    The two most notable advanced features are BLOBs and XML. BLOBs allow large binary
    objects, such as images, to be stored in the database. Oracle and several other
    databases support BLOBs. XML (extensible Markup Language) is a relatively new
    technology. Similar to HTML, XML is a subset of SGML (Standard Generalized Markup
    Language). Unlike HTML, which is a data formatting markup language, XML is a data
    vocabulary markup. XML allows data to be dumped directly into a Web'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'page. If the browser or application server speaks XML, the data is formatted
    and displayed with a minimum of programming. Most every database now that is on
    the market today supports XML in some fashion.


    # Databases and Beyond


    The Web has exploded onto the scene over the past three years. Utilizing databases
    on the Web is already the order of the day. Housing user and customer information,
    accessing personal profiles, sorting and cataloging product information and data
    for customer access will be the new standard—the model that will drive e-commerce.
    Data mining, portals, and shopping carts are the buzzwords in the golf conversations
    of CEOs everywhere.


    For the purposes of this book, we have presented a shopping cart scenario to illustrate
    some of the potential uses for your database. Web servers are a key element in
    utilizing databases on the Web, and we have provided a short overview of many
    of the most popular ones today.


    Overall, we hope you find this book a useful reference that will assist your efforts
    in bringing up a database on Linux for whatever purpose.


    # Audience


    This book is intended primarily for database administrators and Linux users who
    want to improve their skills and understanding of various databases. We hope you
    will come away with a better understanding of database design and implementation
    in general. A mechanical set of instructions to install and configure a database
    is all very well, but this book attempts to give you a better understanding of
    the Linux operating system when it is used as a database server.


    # Other Books by Syngress


    In addition to this book, Syngress Media Inc. has produced a number of other titles
    for IT professionals. Please check our Web site at www.syngress.com for the latest
    announcements.'
  merge: -1
