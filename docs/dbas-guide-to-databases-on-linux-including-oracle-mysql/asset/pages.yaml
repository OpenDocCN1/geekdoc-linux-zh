  md: "# Chapter 5 • Installing and Utilizing Sybase\n\nThe first and older interface\
    \ is the syperl package. This package provides a near mirror of the C API provided\
    \ by the Open Client Library to Perl applications. The second package is a DBI\
    \ driver that fits the Perl DBI interface. There are advantages and disadvantages\
    \ to using each package. The DBI package allows you to develop Perl code that\
    \ can connect to any database for which there is a DBI driver (very much like\
    \ ODBC or JDBC, respectively). However, as DBI is a database generic, there are\
    \ some things that it cannot. The syperl package provides the power to do all\
    \ of the things to the Sybase server that you would be able to do through the\
    \ Open Client Library of Sybase, but is specifically for connecting to a Sybase\
    \ server. Both of these packages are available through CPAN. Try http://www.cpan.org/\
    \ or a local mirror.\nIf you prefer to develop in the Java language, Sybase provides\
    \ a pure Java driver called jConnect from their Web site at http://www.sybase.com/products/internet/jconnect/.\
    \ This driver can be run on any platform that has a Java machine.\n\n# Configuration\n\
    \nWe are now ready to continue with configuration as the installation shell script\
    \ finishes. We will change to log in as the Sybase user and execute the /opt/sybase/install/sybinit\
    \ application. It will provide us with several screens of console menus to progress\
    \ through installation.\n noticed that on my Red Hat 6.1 machine, sybinit complained\
    \ about loading localization files. I had been using Red Hat 5.2 prior to this,\
    \ so this appeared to be a new problem introduced by Red Hat 6.1. I looked into\
    \ it a little bit and came to the conclusion that the environment variables $LANG\
    \ and $LC_ALL were causing this problem. As Sybase does not understand the en_US\
    \ locality that is set in these variables. Unsetting these variables will cause\
    \ Sybase to revert to using the default locale, which is us_english.\nA better\
    \ solution is to edit the text file at /opt/sybase/locales/locales.dat This file\
    \ defines the method of mapping these locales in LANG and LC_ALL to Sybase's understanding\
    \ of these locales. Currently, it appears that Sybase maps the strings ENGLISH,\
    \ FRENCH, GERMAN, and JAPANESE to its locale definitions for the Linux platform.\
    \ If this file is edited to change these lines:\n\n```\nlocale = ENGLISH, us_english,\
    \ iso_1\nlocale = FRENCH, french, iso_1\nlocale = GERMAN, german, iso_1\nlocale\
    \ = JAPANESE, japanese, eucjis\n```"
