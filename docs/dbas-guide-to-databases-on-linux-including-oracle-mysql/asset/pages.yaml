  md: '# Chapter 1 • The Linux Operating System


    G: How do I dual (triple, quadruple, etc.) boot with my current operating system(s)?


    A: Remember, unless this is a development system, you do not need nor to have
    two operating systems on a machine that will be a server. However, during installation,
    you can elect to have the system add a dual boot feature using lilo, or you can
    add the Linux boot to almost every known boot manager for the Intel-based PC.


    G: Can it run Microsoft Office 97?


    A: Not really, as it is not native. By using an emulator, like WINE, you may be
    able to get some or all of Office97 to run. You can use one of the many alternates
    that are similar but not exactly the same, like StarOffice or WordPerfect. Each
    of these can read and write the Office97 format on most documents.


    G: What about support?


    A: For support, start by thinking about who supports you. Find someone similar,
    just like you did when you first started with Win9x or Win NT. Give someone a
    chance to shine, promote from within, or ask for a volunteer. You may actually
    find someone who is already playing with it at home or used it in school. Support
    is available free via news services and user groups on the Internet, and paid
    commercial support is available from many organizations. See the vendors listed
    in Table 1.3.


    G: How do I remove Linux?


    A: Technically, you just need to repartition the disk, make one of the new partitions
    active, transfer some OS-like DOS to this active partition, and then reboot. Voilä,
    Linux is gone forever. You can do this to any operating system on a PC to get
    the same result.


    If you left Windows 9x on, then you can use a Win 9x boot disk, and run the command:


    ```

    A:> FDISK /MBR

    ```


    This will eliminate the lilo bootup and automatically start Windows 9x again.
    You can then repartition or reformat any previous Linux partitions to FAT format.'
