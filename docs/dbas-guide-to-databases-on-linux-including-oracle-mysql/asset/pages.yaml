    \ |\n| Hostname (hostname) or IP address (ip_address) | Use the hostname or IP\
    \ address of the remote DB2 server. | db2server or 9.21.125.124 |\n| | To resolve\
    \ this parameter:\n Enter the hostname command at the DB2 server to obtain the\
    \ hostname.\n Enter the ping command to obtain the IP address, or contact your\
    \ system administrator. | |\n\nContinued"
