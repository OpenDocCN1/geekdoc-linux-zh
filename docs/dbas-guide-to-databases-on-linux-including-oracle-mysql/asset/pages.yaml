  md: 'This is a program you will rarely need to use if you learn to use the

    onstat command and the $SONCONFIG settings. It is much easier and

    safer (less risky) to edit the $SONCONFIG by hand, and restart the engine.

    There are also things you can do with the onmode command to save you

    from restarting the engine, thus eliminating the need for onmonitor. It is

    import to review all the commands and programs that are available to

    you in the $INFORMIXDIR/bin directory. A Web-based system admin-

    istration tool is also now available for people wanting to manage the server

    with a Web browser.


    # # Resources


    Several avenues of help and resources are available to you if and when

    you need help with Informix products. Some of the contacts are with

    Informix in the way of customer support; others are contacts with other

    Informix professionals and customers.


    # # Informix Technical Support


    You can call Informix Tech Support at 1-800-331-1763 to get a live cus-

    tomer support engineer to help you with your particular problem.

    Informix technical support has won awards over the years for their out-

    standing response times and solutions.


    # # Informix Web Site


    You can visit the Informix Web site at http://www.informix.com, and take

    advantage of other methods of customer support. There is an Informix

    Developer''s Network at the Informix Web site with many topics covered,

    and in many cases a limited-access discussion group for each of the

    product areas. There is also TechInfo Center, a great way for you to get

    information on bug fixes and other technical information.


    # # Usenet News Group comp.databases.informix


    This is a news group accessible on the Internet via a news server, e-mail

    mailing list, or Web-based news servers such as DejaNews. You can find

    out more about accessing this newsgroup by visiting the IIUG Web site,

    home of the International Informix User Group, at http://www.iiug.org,

    or by visiting a Web-based news server.'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# International Informix User Group (IIUG)


    The IIUG at http://www.iiug.org is known as a great resource for people using
    Informix products. Not only can you find several e-mail lists to subscribe to
    here, you can also find a wealth of tools to augment your Informix world. There
    are also links to local user groups, probably one close to you, and the instructions
    for starting your own user group.


    # Informix Press


    Several books exist for Informix users. Most books are written by top professionals
    in the Informix world with many years of experience using Informix products. You
    can find new titles on the Informix Web site as well as titles available through
    most of the major book stores and Web-based book distributors. Informix also produces
    most of their documentation on CD sets available at a significant cost savings
    over the printed materials. You can contact your nearest sales office and order
    the documents on CD.


    # Informix Training


    Informix has some of the best, award-winning training available. I have seen people
    with little or no experience with Informix products trained quickly and thoroughly
    in using the products by going through the recommended courses that Informix offers.
    Several of the courses on databases are generic enough to apply to other database
    products, and offer a very sound foundation on which to build your database wisdom.
    If you are serious about performance training and learning more about the database
    engine, then you should take the training applicable to your work. Informix also
    offers certification programs as well to make sure your hard work and skills are
    recognized in the business community as a standard business managers can use to
    gauge your proficiency. The more you know, the more you should be recognized for
    it.


    # Summary


    Now that you have installed IDS for Linux, what can you do with it? Well, for
    starters you can connect almost any ODBC-compliant user interface to the server,
    and begin immediately to develop and connect applications to the database engine.
    You can create and connect Web applications and clients directly to the engine
    with either ODBC, JDBC, and I-connect network connections. The range of applications
    is limited only by your imagination.'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'Informix IDS 7.3x is a very powerful SQL database engine, with everything you
    need for an enterprise-level database server. This server is capable of being
    highly reliable and robust for a variety of data storage and retrieval operations
    involving low- and high-volume access rates. Some of the fastest database servers
    in use today are Informix database servers on UNIX. Informix has outperformed
    competitive servers from other vendors and continues to lead the pack. The Linux
    version of IDS is no different internally than the other UNIX platforms; the only
    limitation you will face is the current Linux kernel and your hardware platform.


    IDS 7.3 can scale from one to N users, the only limitation is, of your hardware.
    You can learn everything for the UNIX version in the Linux version, with the exception
    being the high-performance loader, and raw disks, both not available as of this
    writing. IDS is compatible to a certain degree with the Standard Engine, but only
    in its core features. The Standard Engine has more limitations and fewer data
    type choices than the shared memory engine in IDS. Standard Engine is a passive,
    ISAM-based engine. SE is highly reliable, but not capable of some of the more
    advanced features of the IDS engine. You will find SE compares to IDS the propeller-driven
    airplanes compare to jets. Both are valid flight machines and each have their
    appropriate uses.


    The total installation time can be as fast as two hours, if you have prepared
    your environment, or longer depending on what you didn''t prepare for. It is extremely
    important for you to read the Administrator''s Guide, to become familiar with
    the various settings and controls you can place on the engine.


    # FAQ


    +   **Q:** Can I use Microsoft products with an Informix database on Linux?

    **A:** Of course you can! Any Microsoft product or Microsoft-based software product
    that can connect to ODBC database can connect to an Informix database on Linux.
    You simply set up the networking connection between the Linux server and the Microsoft
    client, and you can be connected.


    +   **Q:** Can I connect an Informix database on Linux to an Informix database
    on another UNIX platform?'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'A: Yes. You need to configure the networking parameters in the appropriate
    configuration files, and you can network two different database servers together.
    You can also connect these servers using data replication.


    Q: How much hardware do I need to set up an Informix database?


    A: The whole installation can take up approximately 500MB for a small system,
    and for a larger database. Informix can run in as little as 8MB of memory.


    Q: Where is the best place to go to find out more information on Informix?


    A: The Informix FAQ is located at http://www.iiug.org, which is the home of the
    International Informix User''s Group. A FAQ, as well as a plethora of free tools
    are available at the IIUG Web site for you to use with the Informix family of
    products. Much of the history of Informix engines is covered in the FAQ. You will
    find a rich resource of tools, routines, 4GL programs, ESQLC programs, as well
    as tips and techniques to help you run one of the best database engines available.
    You can download or upload your own tools at the IIUG site, and develop your own
    open source projects with other developers.


    The FAQ will also point you to other Informix resources like the Informix Developer''s
    Network at http://www.informix.com/idn/. This is a Web site for the serious Informix
    developer, complete with discussion groups to talk about various topics with other
    developers, DBAs and others. You will need to register to gain access, but this
    is a worthwhile Web site to visit often to stay abreast of changes and upgrades
    to software.'
