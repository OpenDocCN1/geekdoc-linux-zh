- img_proc: true
  md: '# PostgreSQL on Linux • Chapter 9 417


    The postgres program has -s, -A, and -t options that can be very useful for debugging
    and performance measurements.


    You can also compile with profiling to see what functions are taking execution
    time. The back-end profile files will be deposited in psql/data/base/dbname directory.
    The client profile file will be put in the current directory.


    +   Q: I get Sorry, too many clients when trying to connect. Why?


    +   A: You need to increase the postmaster''s limit on how many concurrent back-end
    processes it can start.


    In Postgres 6.5., the default limit is 32 processes. You can increase it by restarting
    the postmaster with a suitable -N value. With the default configuration, you can
    set -N as large as 1024; if you need more, increase MAXBACKENDS in include/config.h
    and rebuild. You can set the default value of -N at configuration time, if you
    like, using configure''s --with-max-backends switch.


    Note that if you make -N larger than 32, you should consider increasing -B beyond
    its default of 64. For large numbers of back-end processes, you are also likely
    to find that you need to increase UNIX kernel configuration parameters. Things
    to check include the maximum size of shared memory blocks, SHMAX; the maximum
    number of semaphores, SEMMNS and SEMNI; the maximum number of processes, NPROC;
    the maximum number of processes per user, MAXUPRC; and the maximum number of open
    files, NFILE and NINODE. The reason that Postgres has a limit on the number of
    allowed back-end processes is that you can ensure that your system won''t run
    out of resources.


    In Postgres versions prior to 6.5, the maximum number of back-ends was 64, and
    changing it required a rebuild after altering the MaxBackendID in include/storage/sinvaladt.h.


    +   Q: What are the pg_tempNNN.NN files in your database directory?


    +   A: They are temporary files generated by the query executor. For example,
    if a sort needs to be done to satisfy an ORDER BY, and the sort requires more
    space than the back-end''s -S parameter allows, then temp files are created to
    hold the extra data.


    The temp files will go away automatically, but might not if a back-end crashes
    during a sort. If you have no transactions running at the time, it is safe to
    delete the pg_tempNNN.NN files.'
  merge: -1
