  md: '# Setting Up the Target Machine


    Before actually installing the RPMs


    Sybase on Linux (like many programs on UNIX machines) accesses its database devices
    through the file system. Sybase''s SQL Server doesn''t really care whether your
    database device is a file in some file system or a device like a partition of
    a hard drive (e.g., /dev/sda). There are advantages and disadvantages to each.


    Using a file system gives you the advantage of having control over the database
    file device as you would any other file on the file system. This includes moving
    it around, creating symbolic links to it, and copying it to another machine. Before
    Sybase released their replication software for Linux, this or the extended file
    system (which is the most common file system used on Linux), are limited to 2
    gigabytes in size. Unfortunately, a database device that exists as a file on the
    file system is limited to 2 gigabytes.


    Using a disk partition like /dev/sda under Linux does not really supply the database
    with any substantial speedup as you might expect because of Linux'' extensive
    use of caching. Access to the disk partition and to the file system are both cached
    in the Linux cache system. Using a dedicated partition allows for devices larger
    than two gigabytes, which is important for large databases. On the other hand,
    a partition dedicated to the database can only be accessed through the corresponding
    block device, and must be allocated by partitioning the disk.


    One of the large arguments among those on the Sybase-Linux group was whether usage
    of these types of database devices was good at all. Many DBAs from other UNIX
    platforms would argue that the only way to have a database device was to have
    it on a "raw" disk partition. This type of disk partition is a device in the system
    that the operating system does not cache at all, and all writes are written directly
    to disk before control is returned to the writing program. Linux kernels through
    the 2.2 series do not support true "raw" devices, though some form of raw devices
    are expected to be supported in later kernel releases, the DBAs who believe that
    these devices are required say that Sybase maintains its own cache and expects
    all things written to disk to be really written, when it'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'regains control after a write some inconsistencies may happen in the event
    of a power outage. Understandably, it Sybase thought something was written to
    disk Linux was just caching it in memory to be written at some future time and
    the power failed before Linux actually wrote it, then the system could be left
    in an inconsistent state. The best argument that I have heard against this is
    that any database server would have an uninterruptible power supply (UPS) on it.
    If the UPS told the machine the power failed, it could ensure that the database
    and the rest of the processes were shut down in the event of a power outage before
    the UPS failed.


    With the discussion of possible data devices out of the way, I can make some recommendations.
    If you can afford it, dedicate the entire machine to the database and give the
    machine lots of physical memory (as much as you can afford). Sybase may be able
    to get by 32MB of memory (nothing else running on the machine), but there will
    be a lot of disk accesses, as it cannot maintain enough information in cache.
    I don''t recommend using less than 128MB of memory in a database server, and obviously
    the more you use the better your performance will be. If you plan on having the
    machine run multiple queries at one time, you may want to consider running a Web
    server and the database server on the same machine. You can do it, but you will
    have a much faster and more responsive database if the machine isn''t busy doing
    other things as well.


    For any nonvolatile database, you need to devote at least three SCSI hard drives
    to the system. You should not use IDE devices for a database server. For a more
    robust system, I would recommend at least SCSI hard drives in a RAID configuration
    to allow for data survival in case of physical media. The first hard drive can
    be reasonably small (less than 4GB), as it should contain the Linux operating
    system, the database application, and a little else. The second hard drive (or
    RAID volume) should be entirely devoted to the database transaction logs. The
    third hard drive or volume can be devoted entirely to database devices. If you
    plan on running multiple databases on this machine you may consider placing each
    database on a separate device on a separate disk so queries are not forcing the
    disk to seek between the two devices on one disk.


    Partition the first SCSI disk with at least five Linux partitions and probably
    a Linux swap partition. The root root file system should be kept reasonably small
    (approximately 200-300MB). The second partition should be your /usr file system
    and should contain about 2GB of space. The third partition should be your /opt
    file system, where Sybase will install itself from the RPMs. This partition should
    be at least large enough to hold the installed Sybase dis'
