  md: '# Privileges


    MySQL allows different users to perform different actions on, and with, the database
    based on their privileges. These privileges are stored in a table and checked
    when the user tries to execute an action. The following privileges are set up
    in MySQL:


    +   - **select.** Reads a row in a table.

    - **insert.** Creates a row in a table.

    - **update.** Updates a row in a table.

    - **delete.** Removes a row in a table.

    - **index.** Adds/removes indexes on a table.

    - **alter.** Allows ALTER TABLE sql command.

    - **create.** Creates a database/table.

    - **drop.** Removes a database/table.

    - **grant.** Gives users privileges.

    - **file.** Reads and writes external files to the database.

    - **reload.** Reloads or flushes tables.

    - **shutdown.** Shuts down the database properly.

    - **process.** Displays or removes processes.


    These privileges will determine what actions you can perform on the database.
    Not all users should be able to use the more powerful features, such as `grant`,
    `alter`, `file`, `process`, and `shutdown`. Those should be reserved for the administrator.


    After the root password is changed, let''s add some new users. There are two main
    ways to add new users to the database: using the `grant` option or using SQL to
    insert new rows into the user tables.


    For **grant**, first make sure the database is up, and use **mysql** to make a
    connection.


    ```

    /mysql -p -user=root mysql

    ```


    ```

    Enter password:

    Reading table information for completion of table and column names

    You can turn off this feature to get a quicker startup with -A

    ```


    ```

    Welcome to the MySQL monitor. Commands end with ; or \g.

    Your MySQL connection id is 3 to server version: 3.22.30

    ```


    ```

    Type ''help'' for help.

    mysql>

    ```'
