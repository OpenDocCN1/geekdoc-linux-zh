  md: "# 356 Chapter 8 • Installing and Managing Progress on Linux\n\nG: I'm currently\
    \ using Progress by installing the SCO binaries and iBCS. \nWhat do I need to\
    \ do to switch to the native Linux port?\n\nA: First, call your PSC Sales Representative\
    \ and get the license switched to the Linux platform, and install the native binaries\
    \ as described in this chapter. Make sure you choose a separate directory for\
    \ this version of Progress. Modify your environment variables, particularly the\
    \ SDLC variable, and the rest of your existing start up/shutdown/backup/etc. scripts\
    \ should be ready to go. If you are already using the v 8.3 format for SCO, there\
    \ should be no database conversion necessary. If you are using version 8.2, it\
    \ should only be a bi file pout db -C truncate. Both of these methods are not\
    \ guaranteed by Progress. For versions of Progress older than v 8.2, or for safety,\
    \ create a new v 8.3 database with the Linux binaries and dump and load between\
    \ the two databases.\n\nG: I know Progress 4GL supports graphical programming\
    \ under MS Windows, and I know Progress supports Linux as a host-based client.\
    \ But can I program under X Windows as well?\n\nA: Yes, but only with the version\
    \ 7 of Progress that is not a native port to Linux (in other words, the SCO binaries\
    \ using the iBCS emulation). At the time version 8 was under construction, the\
    \ marketing team reviewed the number of licenses sold to UNIX GUI environments\
    \ and found the numbers to be small. A marketing decision was made to freeze the\
    \ X Windows support at the Progress V7 level. This was also at a time when X Windows\
    \ meant special X-Terminal hardware, or expensive third-party PC emulation of\
    \ X Windows. Linux popularity is not what it is today, and the number of X Windows\
    \ capable computers has grown accordingly since. By all means call your Progress\
    \ Sales Representative and express interest in reviving support for X Windows.\n\
    \nG: I heard that after-imaging is a performance drain. Do I really need it? After\
    \ all, I back up the database anyway.\n\nA: After-imaging will save you. Running\
    \ after-imaging allows you to restore a database right up to the minute before\
    \ the crash. Even if you back up your entire system on a nightly basis, you run\
    \ the risk of crashing at the end of the day. Your entire day's worth of work\
    \ is gone if you are not running after-imaging. Always ask the question, \"Can\
    \ I afford to lose data from the time since the last backup was?\" 24x7 and other\
    \ mission-critical systems will say the data loss is acceptable."
