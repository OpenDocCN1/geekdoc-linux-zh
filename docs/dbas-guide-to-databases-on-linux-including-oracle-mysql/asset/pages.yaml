  md: '# PostgreSQL on Linux · Chapter 9 373


    +   **prefix=BASEDIR** Selects a different base directory for the installation
    of PostgreSQL. The default is **/usr/local/pgql**.


    +   **enable-locale** Lets you use locales.


    +   **enable-multibyte** Allows the use of multibyte character encodings. This
    is primarily for languages like Japanese, Korean, or Chinese.


    +   **with-perl** Builds the Perl interface. Please note that the Perl interface
    will be installed in the usual place for Perl modules (under **/usr/lib/perl/**),
    so you must have root access to use this option successfully.


    +   **with-odbc** Builds the ODBC driver package.


    +   **with-tcl** Builds interface libraries and programs requiring Tl/Tk, including
    libpgctl, pgtcsh, and pgtksh.


    5. Compile the program: Type:


    ```

    $ gmake

    ```


    The compilation process can take anywhere from 10 minutes to an hour. Your mileage
    will most certainly vary. The last line displayed hopefully will as follows:


    All of PostgreSQL is successfully made. Ready to install.


    Remember, **gmake** may be called **make** on your system.


    6. Install the program. Type:


    ```

    $ gmake install

    ```


    7. Tell your system to find the new shared libraries—this method varies between
    platforms. What tends to work everywhere is to set the environment variable


    **LIBRARY_PATH**


    ```

    $ LD_LIBRARY_PATH=/usr/local/pgsql/lib

    ```


    ```

    $ export LD_LIBRARY_PATH

    ```


    You might want to put this into a shell startup file such as ~/.bash_profile.


    On some systems the following is the preferred method, but you must have root
    access. Edit file **/etc/ld.so.conf** to add a line:


    ```

    /usr/local/pgsql/lib

    ```


    Then run the command /sbin/ldconfig.


    In doubt, refer to the manual pages of your system. When you get a message like
    the following:


    ```

    /psql: error in loading shared libraries

    ```'
