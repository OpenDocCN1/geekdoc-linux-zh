  md: '# The Global Knowledge Advantage


    Global Knowledge has a global delivery system for its products and services. The
    company has 28 subsidiaries, and offers its programs through a total of 60+ locations.
    No vendor can provide consistent services across a geographic area this large.
    Global Knowledge is the largest independent information technology education provider,
    offering programs on a variety of platforms. This enables our multi-platform and
    multi-national customers to obtain all of their programs from a single vendor.
    The company has developed the unique CompetusTM Framework software tool and methodology
    which can quickly reconfigure courseware to the proficiency level of a student
    on an interactive basis. Combined with self-paced and on-line programs, this technology
    can reduce the time required for training by prescribing content in only the deficient
    skills areas. The company has fully automated every aspect of the education process,
    from registration and follow-up, to "just-in-time" production of courseware. Global
    Knowledge through its Enterprise Services Consultancy, can customize programs
    and products to suit the needs of an individual customer.


    # Global Knowledge Classroom Education Programs


    The backbone of our delivery options is classroom-based education. Our modern,
    well-equipped facilities staffed with the finest instructors offer programs in
    a wide variety of information technology topics, many of which lead to professional
    certifications.


    # Custom Learning Solutions


    This delivery option has been created for companies and governments that value
    customized learning solutions. For them, our consultancy-based approach of developing
    targeted education solutions is most effective at helping them meet specific objectives.


    # Self-Paced and Multimedia Products


    This delivery option offers self-paced program titles in interactive CD-ROM, videotape
    and audio tape programs. In addition, we offer custom development of interactive
    multimedia courseware to customers and partners. Call us at 1-888-427-2288.


    # Electronic Delivery of Training


    Our network-based training service delivers efficient competency-based, interactive
    training via the World Wide Web and organizational intranets. This leading-edge
    delivery option provides a custom learning path and "just-in-time" training for
    maximum convenience to students.'
