- img_proc: true
  md: 'The steps to create new databases are defined well in the Progress documentation,
    but a small example is given here. You first need to create an .st file with the
    list of all extents. Extents are defined by their type (before-image, after-image,
    data), whether they are fixed length or variable, and if fixed by size in 1k blocks
    (or whatever block size database you are creating—1k is the default). There can
    be only one variable before-image, and one variable data extent. Let''s keep the
    example simple and define a structure file with one fixed and one variable extent
    for both before-image and data. After-image extents are highly recommended since
    they give the ability to roll the database forward from the point of last backup
    to any point in time afterwards. They are not included in this example for the
    sake of simplicity. Such a structure file would be called mydata.st and look like
    this:


    | B | /mnt/bi/mydata.bi f 10000 |

    | B | /mnt/bi/mydata.b2 |

    | D | /mnt/db/mydata.di f 500000 |

    | D | /mnt/db/mydata.d2 |


    Note how the first column denotes the extent type, B/D/A, and how the f means
    an extent of fixed size. In this case, if the before-image file grew bigger than
    10MB (i.e., 10000 blocks), then the second .b2 extent would begin to be used.
    Similarly, the .d2 extent would be used if the data files grew larger than 500MB.
    Also, note how the extents are spread across different mount points.


    Sizing extents is an exercise in balance. In general, more file handles better
    concurrency, so you would want to choose 10 extents instead of 2 extents of 1GB
    for a 2GB database. You also want to preserve room for growth and keep DBA intervention
    to add or resize extents to a minimum.


    Two steps complete the process. First, the Progress prostruct is used to translate
    the structure file into the physical database layout ready to use. Any fixed-length
    extents will be created in the requested sizes (rounded up to the next 16k). Here
    is the syntax, using the database structure file created earlier:


    ```

    prostruct /mnt/db/mydata mydata.st

    ```


    Review the ordering system files created after this step, .db, .b1, .b2, .d2,
    etc. Note that the .db file is not described in the structure file, but instead
    is derived from it. The .db will be created in the directory specified by the
    third parameter passed to the prostruct command. These files together create the
    database, but until the final step there is no internal structure to the database
    and is known as a void'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'database. To give it, copy a blank database into the void by the **procopy**
    command:


    ```

    procopy empty /mnt/db/mydata

    ```


    The empty database is a special case of the **procopy** command. It is not necessary
    to specify the whole path of this structure even though it resides in the DLC
    directory where the Progress executables are installed. Progress will find the
    empty database using the DLC environment variable. There are also several alternate
    versions of the empty data based on the block size. To create a database using
    an 8k block size, simply substitute **empty8** for **empty** in the **procopy**
    command. Remember however, that variable block size is a feature of the Enterprise
    Database license. All WorkGroup databases are respect.


    The database is now ready for access in single user mode. It is necessary to start
    a multi-user broker in order to allow more than one user into the database. Simply
    use the **preserve** command to start this broker. Without any other options,
    the broker will allow 10 users on the local system to access the database. To
    allow for more users, use the **-H -N -S** option. These options and more performance-related
    parameters are discussed here later, and are also in the Progress System Administration
    Reference Manual.


    # Sizing the Buffer Pool


    The largest consumer of RAM in most Progress installations is the **-B** buffer
    pool. This is a large shared memory area that is used to cache disk blocks order
    to improve performance.


    Don''t tune this per user! Tune it to how much I/O disk subsystem can handle.
    Basically, you''re trying to get physical I/O operations down to the point where
    your disks are between 50 and 25 percent utilized, there are no queues, and the
    service times are under 20ms. If your disks have an average access time of 10ms,
    then they can perform 100 random I/O operations per second and can sustain between
    25 and 50 I/O operations per second without danger of queuing.


    It''s true that the number of users is probably related to the number of database
    access requests. But the relationship between that and the miss ratio is nonlinear.
    It follows a curve similar to:


    R = L / sqrt(C)


    where:


    +   R = Physical I/O operations

    L = Logical I/O operations

    B = Buffer Pool Size

    C = some constant (probably near 1.5)'
