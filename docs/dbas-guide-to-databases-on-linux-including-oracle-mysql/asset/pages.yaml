  md: '# PostgreSQL Examples RPM


    Examples RPM contains various programs to validate the installation of PostgreSQL
    at your site. They are also needed to do testing of various interfaces to PostgreSQL.
    Install the postgresql examples directory from one of the following:


    +   - Linux CD-ROM: postgresql-*examples.rpm

    - Get postgresql-*examples.rpm from http://www.aldev.8m.com or http://www.aldev.webjump.com

    - PostgreSQL source code tree postgresql*.src.rpm: look for examples, testing,
    or tutorial directories


    # Testing Tcl/Tk Interface


    An example of the Tcl/Tk interface is the pgaccess program. It requires X Windows
    to be running. You can use KDE, GNOME, or Motif window. Read the file /usr/bin/pgaccess
    using a text editor like vi, gvim, or view:


    ```

    # man xhost

    # xhost +

    # su - postgres

    bash$ view /usr/bin/pgaccess

    bash$ export DISPLAY=<hostname of your machine>:0.0

    bash$ createdb mydb

    bash$ pgaccess mydb

    ```


    This will bring up a beautiful GUI showing various buttons for creating, forms,
    queries, reports, etc. For more information on pgaccess, visit http://www.flex.ro/pgaccess.
    If you have any comments or suggestions for improvements, send an email to teo@flex.ro.


    # Testing Python Interface—PyGreSQL


    After installing PostgreSQL Examples RPM, do the following:


    ```

    bash$ cd /usr/lib/pgsql/python

    bash$ createdb thilo

