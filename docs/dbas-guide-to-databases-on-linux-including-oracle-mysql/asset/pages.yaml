  md: 'As of this writing, Linux still does not have a strong raw disk orientation
    like any of the existing UNIX platforms, however, this most likely will be available
    by the time this goes into circulation. Some sites are using raw disks without
    incident, but as of this writing it is unsupported.


    A raw disk installation, simply put, allows you to soft-link the Informix software
    directly to unformatted file systems (hard drives that are unmounted file systems),
    and the Informix software takes over the formatting and disk operation. For raw
    disks, Informix is the disk operating system for drives set up as raw disks. The
    only thing for which Linux is responsible is an entry in the /dev device pointing
    to the disk drive. A soft-link is created in a directory you choose, to point
    to the /dev directory, and the drive entry.


    For example, you would create an /opt/informix/links directory, and then create
    that to point to the /dev directory. If you had a disk in /dev/rdisk1, then you
    simply create a link to it:


    ```

    $ cd /opt/informix/links

    $ ln -s /dev/rdisk1 databs01

    ```


    When you do an -l, you will see the link, not the disk.

    A cooked disk installation, simply put, allows you to create Linux files of a
    certain size that Linux will manage along with Informix. Cooked files are, and
    look like, regular Linux files.


    Cooked files are created with a specific size in mind, and can be backed up with
    a standard backup, provided the Informix server is offline, and shut down. Cooked
    files must be closed like regular Linux files in order to back them up. Benefits
    to cooked files are that they are simply Linux files, and backing them up is as
    simple as backing up any other Linux file.


    When you perform an -l on the directory, the cooked files show up as regular Linux
    files (see Figure 4.5). When you look at raw disks, the directory listing usually
    shows a link to /dev entries, but no file size show up, as these disks are now
    under the control of Informix. To understand raw disks, use onstat commands to
    see how much space they are using; this is the only way you can see what they
    contain. It is highly advisable for you to use cooked files until you become more
    familiar with raw disks set up.


    Informix on Linux has very good performance using cooked files, but the preferred
    method in UNIX is to use raw disks, often giving a 15-20 percent performance advantage
    over cooked files. As of this writing, benchmarks were not available to compare
    the differences between raw disks and cooked files on Linux. Many x86 sites using
    the NT version of'
  merge: -1
