  md: '# 154 Chapter 4 • Informix Installation on Linux


    > NOTE

    A complete listing of onstat options is available by using the onstat-command.
    Read the Administrator’s Guide for a complete discussion of what all these options
    tell you. Included with this book are a couple of tools that provide much more
    comprehensive reporting about your engine.


    # Stopping Your Engine


    Now that your engine is running, how do you turn it off? To stop the Informix
    engine, use the onmode -ky command.


    ```

    $ onmode -ky

    ```


    This will allow you to make changes to your $ONCONFIG and restart the engine.


    A series of additional features are contained in the onmode command. Be sure to
    read your Administrator’s Guide for more information on how and for what the other
    options are used.


    # Final Configuration


    What’s next? Your engine is running, but really not operational. The next phase
    will allow our server to be useful, especially for endusers.


    We will set up your engine for our final configuration, one that you can change
    to suit your needs from here. You need to make sure you have the disk space for
    the following actions. If you have done your space allocations for your disks
    as outlined in the beginning of this chapter, you are now ready to complete the
    following steps.


    # Review


    Let’s quickly review some of the key dbpaces we covered. Created during our installation
    and initialization of the database.


    rootbs.


    physbs. Will contain the physical log; must be moved out of the rootdbbs into
    its own dbpace.


    logsdbs. Will contain the logical logs; must be moved out of the rootdbbs into
    their own dbpace.'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'An Informix Installation on Linux • Chapter 4 155


    tempdbs. Defaults to the rootdbs, will point to its own dbspace,

    is is used for sorts, queries, and temp tables.

    dbs dbs. Will contain database entries, but no table entries.

    datadbbs01. Will contain tables.

    indexdbs01. Will contain indexes.


    # Physdbs


    For performance considerations, it is a standard practice to relocate the

    physical log to its own dbspace. The physical log is a buffer, or cache, of

    dat activity that has yet to be written to the database. Relocating it

    to own dbspace allows you to expand or decrease its size as your

    allows, without impacting the rootdbs, and allows you to increase

    performance.


    As previously discussed, the rootdbs contains the brains behind every

    dat you create on this server, for this instance. You can have multiple-

    st of Informix; each instance has its own rootdbs and dbspaces

    separate from other instances. It is important to minimize the risk to the

    rootdbs. Relocating the physical log is one of the first steps we will take to

    make sure the rootdbs is left only for the minimum of activity—keeping

    track of where everything is in your databases—and managing the engine.

    Make sure your Informix engine is up and running.


    $ onstat


    If the engine is not running, start it now with the oninit program,

    with no options, or at a minimum using only the -v option (the verbose

    flag):


    $ oninit -v


    You do not use the -i option to run oninit after you create the root-

    dbs. Doing so is the equivalent of reformatting your hard drive. The one

    exception you can use is oninit -v, which shows verbose output as the

    engine starts. Using the -i option on a production server would only serve

    to expedite work on your resumé.


    Once the engine is up and running, you can create the physdbs first

    with UNIX/Linux commands, and then with Informix commands, as you

    did with the rootdbs.'
  merge: -1
