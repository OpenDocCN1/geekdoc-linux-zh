  md: '# Summary


    This chapter covered key Oracle concepts that are important to understand when
    working with the Oracle RDBMS. An important concept to understand is the difference
    between a database and an instance. The database represents the physical structures,
    whereas the instance represents the memory structures. A critical memory component
    is the System Global Area (SGA). The SGA is a key factor in performance tuning.
    Installation of both Oracle8 and Oracle8i require similar preinstallation steps.
    Oracle8 requires fewer hardware resources and has been around longer, but Oracle8i
    is geared towards Internet usage and includes a Java runtime environment built
    into the server, along with new security and XML features. Oracle8 was designed
    for Red Hat Linux 5.2 and requires compatibility libraries to run under Red Hat
    Linux 6.0 and 6.1.


    Oracle8 and 8i provide many security features including system privileges, object
    privileges, and roles. The Data Dictionary is a central repository of read-only
    reference tables and views. Oracle uses the dictionary to look up object definitions,
    space allocation, integrity constraints, privileges, and auditing information.
    SQL*Plus is the primary interface to the Oracle RDBMS provided by Oracle Corporation.
    The Import and Export utilities are used to get data into and out of the database.
    SQLLoader is used to import data from other databases. Examples of third-party
    applications for Linux include SQLWork, Object Manager, and Oracle. Perl is an
    excellent language to use in Web development and has excellent connectivity to
    Oracle.


    # FAQs


    +   Q: Why can''t I run any of the Oracle utilities?


    +   A: Make sure $ORACLE HOME/bin is located in your PATH.


    +   Q: What is the password for the internal account? When I try to connect as
    the internal account in Server Manager, it requests a password.


    +   A: You are probably logged into an account that is not a member of the dba
    group listed in the /etc/group file, such as root.'
  merge: -1
