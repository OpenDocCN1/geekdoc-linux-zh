  md: '# 156 Chapter 4 • An Informix Installation on Linux


    # # Create a physds File


    UNIX and Linux allow you to create a zero-length file when you issue the >filename
    command.


    ```

    $ cd /opt/data

    $ physds

    $ chown informix:informix physds

    $ chmod 660 physds

    ```


    This creates the file, but with absolutely nothing in it.

    We will need to do most of the following steps in single-user, or quiescent mode,
    as it is referred to. We will also take advantage of two utilities—onspaces and
    onparams—programs you use as a DBA.

    Onspaces can be used in multi-user mode, but onparams must be run when the engine
    is in single-user mode to get to single-user mode, run the onmode command onmode
    -s. Adding an s to this command removes the following question:


