  md: '# Chapter 4 • Inforix Installation on Linux


    and the features of the database are as simple as well. SE was the engine of choice
    for a lot of vertical market VARs (value-added resellers) who found a simple,
    low-maintenance, low-cost engine for a variety of UNIX-based applications. Although
    SE has enjoyed the cost-sensitive space for most of the life of Inforix, it can
    no longer be chosen simply on cost alone. There are too many things missing from
    SE to make it a serious choice compared to IDS today''s marketplace, unless you
    are only looking for very basic features in a database. Even more basic is C-ISAM,
    which is the lowest level of database products Inforix offers.


    C-ISAM is the foundation used by almost all database products on the market today,
    including the competition. However, C-ISAM is extremely limited and has a very
    narrow window of acceptable use, which for most situations makes it not an option
    at all. Keep in mind that Inforix was the first company in the database market
    to offer an ISAM product in UNIX, and then went to offer much sophisticated ISAM
    products in their Standard Engine, which allowed the use of Standard SQL to access
    the database. C-ISAM is available for Linux, and you may want to get a copy to
    learn how it works, and how other database products use.


    Inforix Dynamic Server (IDS), originally called Dynamic Server, got its name from
    how it works. IDS can adjust itself dynamically to the load it put upon it, and
    offers several sets you can change without having to restart the engine. There
    are, of course, limitations to IDS, but for the most part this engine can take
    a lot of load and still deliver impressive performance. IDS is very reliable,
    and robust, and should be considered your minimal engine for the future if not
    at all. It can be implemented with the same simplicity as SE, without much more
    maintenance than was common with SE. IDS can be maintained simply, provided you
    took care of the full cycle of operations this engine entails. The benefits of
    IDS over SE are more noticeable in faster performance, but are noticeable also
    in the advanced data types available in IDS.


    You will find IDS similar to SE in many respects, but you will also find IDS much
    more powerful, with much better performance than Standard Engine. The performance
    gains, as well as the advanced features, make it the preferred choice. If you
    are a developer who needs even more than performance you should also take advantage
    of IDS.2000, allowing you object-relational features not found in IDS 7.30. I
    would advise you to install IDS 7.30 as a general exercise to get the feel of
    the basic engine, and then move to IDS.2000. There are additional features in
    IDS.2000 that you may never need, but on the other hand, they may be essential.
    At any rate, it is better to learn the simpler of the two engines first, and then
    move to the more complicated.


    For a complete product comparison of SE versus IDS IDS.2000, visit the Inforix
    Web site. Because of SE''s limitations, most'
