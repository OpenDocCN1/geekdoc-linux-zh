  md: '# solutions@syngress.com


    With over 1,000,000 copies of our MCSE, MCSD, CompTIA, and Cisco study guides
    in print, we have come to know many of you personally. By listening, we''ve learned
    what you like and dislike about typical computer books. The most requested item
    we have for a web-based service that keeps you current on the topic of the book
    and related technologies. In response, we have created solutions@syngress.com,
    a service that includes the following features:


    +   - A one-year warranty against content obsolescence that occurs as the result
    of vendor product upgrades. We will provide regular web updates for affected chapters.


    +   - Monthly mailings that respond to customer FAQs and provide detailed explanations
