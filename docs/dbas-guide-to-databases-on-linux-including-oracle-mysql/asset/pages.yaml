    is set up properly.


    # Kerberos Authentication


    Kerberos is an industry-standard secure authentication system suitable for distributed
    computing over a public network.


    # Availability


    The Kerberos authentication system is not distributed with Postgres. Versions
    of Kerberos typically are available as optional software from operating system
    vendors. In addition, a source code distribution may be obtained through MIT Project
    Athena.


    > NOTE

    nYou may wish to obtain the MIT version even if your vendor provides a version,
    since some vendor ports have been deliberately crippled or rendered noninteroperable
    with the MIT version.


    Users located outside the U.S. and Canada are warned that distribution of the
    actual encryption code in Kerberos is restricted by U.S. Government export regulations.'
