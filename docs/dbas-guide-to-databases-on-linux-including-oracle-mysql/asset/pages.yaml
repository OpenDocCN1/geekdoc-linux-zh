  md: '# Custom Corporate Network Training


    # Train on Cutting Edge Technology


    We can bring the best in skill-based training to your facility to create a real-world
    hands-on training experience. Global Knowledge has invested millions of dollars
    in network hardware and software to train our students on the same equipment they
    will work with on the job. Our relationships with vendors allow us to incorporate
    the latest equipment and platforms into your on-site labs.


    # Maximize Your Training Budget


    Global Knowledge provides experienced instructors, comprehensive course materials,
    and all the networking equipment needed to deliver high quality training. You
    provide the students; we provide the knowledge.


    # Avoid Travel Expenses


    On-site courses allow you to schedule technical training at your convenience,
    saving time, expense, and the opportunity cost of travel away from the workplace.


    # Discuss Confidential Topics


    Private on-site training permits the open discussion of sensitive issues such
    as security, access, and network design. We can work with your existing network''s
    proprietary files while demonstrating the latest technologies.


    # Customize Course Content


