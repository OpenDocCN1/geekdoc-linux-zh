  md: '# The Optional Features


    Here are some of the optional features and programs available that you may want
    to consider during your installation.


    +   M1. Dialup networking may be useful for remote dial-in diagnostics and maintenance.


    +   M2. With the Web server installed, you may be able to manage your system from
    a Web interface, but this is completely up to you or the application you install.


    +   M3. If you do not want to purchase a SQL-compliant type database server application,
    you can use the free one called Postgres.


    +   M4. You may be required to compile some aspects of your new database server
    application and you may need the development applications; check your documentation.


    +   M5. The default kernel that most Linux installations use when you first install
    may not be optimized for your hardware.


    > TIP


    To truly optimize many of the Linux versions, you need to run the kernel reconfiguration
    utilities to upgrade the kernel to support a more advanced-level CPU type (to
    double 386, change to 586, PII, PIII, Athlon, etc.) and to support SMP (Symmetric
    Multi-Processor hardware), RAID, SCSI, etc. You need to read up on this. Is it
    absolutely necessary? No, but it is highly recommended. It is not hard once it
    has been explained. The extra documentation covers all the basics of rebuilding
    (recompiling) the kernel and then installing it. Any thick "Everything you want
    to know about...” book on Linux for your distribution will cover this topic in
    excruciating detail, and will be well worth the money spent.


    # Everything Option


    There is always the option to install everything. If you have plenty of disk space
    available (about 1.5GB under the /usr partition), then this is a desirable option
    to choose rather than go through each option to decide what is needed. A word
    to the wise, however; some of the packages installed will want to start daemons
    at system startup and will install files that may lead to security issues. Users
    and administrators alike should familiarize themselves with the packages and what
    they all do. For exam-'
