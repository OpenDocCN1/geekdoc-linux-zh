    # Creating User Logins and Permissions


    It is probably not a good idea to use the sa for all of your database connections
    from clients. You can create new logins, users, and groups for particular databases
    and specify what permissions different users or groups have.


    Logins are not the same as users. Login names apply only to the database. After
    logging in, the actual user name may change depending on which database the user
    is currently in. Some logins may have the same user name and some be aliased to
    other users in different databases. Some logins may not have access to a database
    at all. New logins can be created in the master database with the sp_addlogin
    stored procedure. This procedure requires two parameters, the login name and the
    password. We will create two logins for our example user_data database:


    ```

    1> sp_addlogin brad, <password>

    2> go

    Password correctly set.

    Account unlocked.

    New login created.

    (return status = 0)

    1> sp_addlogin mary, <password>

    2> go

    Password correctly set.

    Account unlocked.

    New login created.

    (return status = 0)

    ```


    Once you have created logins, you should also specify the default database for
    the login. If no default database is specified, then the login user will be placed
    in the master database. This is usually not what you'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# 216 Chapter 5 • Installing and Utilizing Sybase on Linux


    want to happen, since no regular users should be able to change anything in the
    master database. Therefore, use the sp_defaultdb stored procedure in the master
    database to specify in which database users should be put immediately upon logging
    in. In our example database the logins created earlier should be placed in user_data,
    so we will execute the following commands in isql:


    ```

    1> use master

    2> go

    1> sp_defaultdb brad, user_data

    2> go

    Default database changed.

    (return status = 0)

    1> sp_defaultdb mary, user_data

    2> go

    Default database changed.

    (return status = 0)

    ```


    ![](img/4dc2950553fde871c28ea3e04a065356_251_0.png)


    In large database situations where you can separate users into a quantifiable
    number of groups where each group has a like set of permissions for objects in
    the database, it is a good idea to set up these groups and give the permissions
    to the groups. This lets you easily add and remove users to the system without
    having to remember and update each of the objects to which a particular user needs
    permissions.


    Especially in the current economy where employee loyalty is often almost unheard
    of, adding and removing users to a database would become a full time job for an
    IT person in a large company. There would also be the invariable new employee
    that needs access to something get a critical project done, but does not have
    access due to an oversight in permission setting. If this person is known to be
    of a particular type of user (perhaps ‘sales’) when he or she was created, this
    person would simply have been specified as being a part of the sales group, and
    thus all the permissions applicable to the sales group applies to him or her.


    Groups are collections of users who have like permissions. With the use of groups,
    you can specify permissions based on types of users, and'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Installing and Utilizing Sybase on Linux • Chapter 5 217


    then as your user base grows, you can add new users to the groups with out having
    to change permissions on all the objects in the database. To create a new group
    in a particular database, first use the database and then execute the sp_addgroup
    procedure. This procedure takes one parameter, the new group name, and creates
    this group. We will create one group named editors for our example database:


    ```

    > user_data

    > go

    > sp_addgroup editors

    > go

    ```


    A user in a database can, but need not, have the same name as a particular login.
    The owner of the database is a special user dbo, but the sa login is the dbo of
    any database, for example. To add another login that should be dbo for a particular
    database, first add the login as described earlier and create an alias from this
    login to the user dbo. This is accomplished through the sp_addalias stored procedure.
    This procedure sets the specified login to mean the specified user in the current
    database. This same stored procedure can provide any login alias for any user.
    So to specify the login we created to be the dbo for the user_data in our example,
    we would execute the following commands as isql:


    ```

    > use user_data

    > go

    > sp_addalias brad, dbo

    > go

    ```


    Alias user added.

    (return status = 0)


    Other users of the database can be added through the sp_adduser stored procedure.
    This procedure indicates the login name, the new user in this database, and the
    group to which this user belongs. In our example, mary is to be added to the user_data
    database. Mary is an editor, so we will make her a member of the editors group
    to inherit all the permissions that all editors have.


    ```

    > use user_data

    > go

    > sp_adduser mary, mary, editors

    > go

    ```


    New user added.

    (return status = 0)'
