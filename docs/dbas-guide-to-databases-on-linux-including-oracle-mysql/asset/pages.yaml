    # Creating an Account


    There are three issues you need to consider when creating a user account. The
    first is to create the account itself, the second is to give rights to the account,
    and the third is to give the account a quota on one or more tablespaces. There
    are many issues to consider regarding Oracle security. The following instructions
    will help you create a basic login account without thrills. You must be logged
    in with DBA to create user accounts. You should use the SYSTEM account to initially
    create an account for yourself. The following command creates a user pat with
    the password er34533. The user has the default tablespace users and the temporary
    tablespace temp. It is important to specify a default tablespace for accounts.
    You do not want users creating objects in the SYSTEM tablespace. The final line
    provides the user unlimited space on the tablespace. Rather unlimited, you can
    limit the quota by specifying a size such as 50M for 50 MB, or 500K for 500 KB.


    ```

    SQL> CREATE USER pat

    2 IDENTIFIED BY er34533

    3 DEFAULT TABLESPACE users

    4 TEMPORARY TABLESPACE temp

    5 QUOTA unlimited ON users;

    ```


    Once the account has been created, it must be assigned rights to connect to the
    database. There are two types of privileges, system and object. System privileges
    enable users to perform actions in the database including creating, dropping,
    and altering tables, views, rollback segments, and procedures. Object privileges
    enable users to access and modify objects within the database such as tables,
    views, sequences, procedures, functions, or packages. There are 80 system privileges.
    The GRANT command grants a privilege to a user and the REVOKE command revokes
    a user''s privilege. The DBA_SYS_PRIVS view lists the system privileges granted
    to users. A user can identify privileges available to the current session by querying
    the SESSION_PRIVS view. Because there are so many individual privileges, it can
    be difficult maintaining multiple privileges on a large number of user accounts.
    Oracle helps the database administer'
