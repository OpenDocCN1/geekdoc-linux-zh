  md: '# Basic Red Hat Linux Installation • Chapter 2 35


    to add disks after this, you technically could use this choice. If you had lots
    of disk space, you could create a development machine with this and install your
    database onto this big partition or onto another disk, your choice. By default,
    if any other OS is on this machine, it would be retained automatically and offered
    as an optional bootup choice (albeit not displayed, you just have to know it is
    there). This is not the recommended installation type for your server.


    # A Server Installation


    The server installation is another possible choice, as it does a much better job
    of partitioning the disk into more desirable management-oriented design. It also
    installs a lot of server software and does not install the X Window system by
    default. This installation also removes all previous operating system partitions
    of any type, creates partitions with minimal sizes for most, and then installs
    all the server packages and few of the user packages. For ease of getting started
    with a Linux-based server offering all the network services ready to go, this
    is the easiest option for a new machine. Make sure you have lots of extra space
    for your database application and its data.


    # The Upgrade Installation


    The upgrade installation is obviously intended only for a system that already
    contains a previous version of Red Hat. This is not applicable to any other version
    of Linux. Upgrades only replace the currently installed software sets with the
    newer versions plus any new dependency-related software sets.


    # A Custom Installation


    The custom installation is the best choice for someone who knows exactly he or
    she wants. You can implement a specific design for your disks—what size partitions
    on what disks, then define the directory location for each of these partitions
    in your file system—and finally, you can decide on the software sets you want
    to install.


    # Custom (Manual) Installation


    The remaining steps assume you are following a custom installation procedure,
    and take you through each of the basic steps with helpful hints and suggestions.
    This is the recommended installation method for a database server, so that you
    can select the additional services you need. It is highly recommended not to include
    any other services on your database server. Of course, if you have no other server
    for them, or if this will not be'
  merge: -1
