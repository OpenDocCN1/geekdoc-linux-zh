    We have new logical logs that can be used, and we can delete the ones in the rootdb.
    To do this we need to tell the engine which logs are the ones to point as current
    logs. This is accomplished with the **onmode** command:


    ```

    rebel:root # onmode

    uusage: onmode -abcdFklMnoOpQRRsuyZz

    -a <bytes> Increase shared memory segment size.

    -b <version> Revert Dynamic Server structures.

    -c [block unblock] Checkpoint. Block or unblock server.

    -D <max PDQ priority allowed>

    -d [standard|primary <servername>] set DR server type

    -F Unused memory segments

    -K Shutdown completely

    -1 Force to next logical log

    -M <decision support memory in kbytes>

    -m Go to multi-user on-line

    -n Set shared buffer cache to non-resident

    -O Override space down blocking a checkpoint

    -p <+#> Start up or remove virtual processors of a specific class

    -Q <max # <class> decision support queries

    -R Rebuild the /INFORMIXDIR/etc/.infos.OBSERVERNAME file

    -r Set shared buffer cache to resident

    -S <max # decision support scans>

    -s Shutdown to single user

    -u Shutdown and kill all attached sessions

    -Y Do not require confirmation

    -Z <address> heuristically complete specified transaction

    -z s <sid> Kill specified session id

    ```


    The three options we are interested in are the **-l**, **-c**, and **-m** options.
    The two options **-l** and **-c** manage the logical logs. The **-l** option forces
    the engine to use the next logical log. Checkpoints are covered in the *Administrator''s
    Guide*, and essentially the **-c** option tells the engine to perform a checkpoint.
    Checkpoints are a mark that the engine puts on logical log activity with which
    to allow the logs to be backed up, and how much to recover when doing a database
    restore. The **-m** option allows us to bring the server back up into multi-user
    mode.'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Chapter 4 • An Informix Installation on Linux


    We need not only move the current log activity to the new logical logs, but also
    perform a checkpoint to free up the old logs so they can be deleted. The engine
    should be started on the new logs so we can delete the old ones. So you simply
    perform the following commands on the old logs until onstat shows you the engine
    is using the new logs. In our particular case, we need to do this six times. The
    following output shows our logs after running onmode -l three times.


    | address | flags | uniqid | begin | size | used | %used |

    | 10039324 | U-B--- | 1 | 100233 | 250 | 250 | 100.00% |

    | 10039340 | U-B--- | 2 | 10032d | 250 | 250 | 100.00% |

    | 1003935c | U-B--- | 3 | 100427 | 250 | 250 | 100.00% |

    | 10039378 | U-B--- | 4 | 100521 | 250 | 250 | 100.00% |

    | 10039394 | U-B--- | 5 | 10061b | 250 | 250 | 100.00% |

    | 100393b0 | U-B--L | 6 | 100715 | 250 | 43 | 17.20% |

    | 100393c7 | U-B--- | 7 | 300035 | 512 | 1 | 0.20% |

    | 100393e8 | U-B--- | 8 | 300235 | 512 | 1 | 0.20% |

    | 10039404 | U-C--L | 9 | 300435 | 512 | 0 | 0.00% |

    | 10039420 | F---- | 0 | 300635 | 512 | 0 | 0.00% |


    As you can see in this example, the checkpoint log is now log 9 in the new logs,
    but the last back used is log 6. Run onmode -c now, which will have the last back
    used as log 9:


    | address | flags | uniqid | begin | size | used | %used |

    | 10039324 | U-B--- | 1 | 100233 | 250 | 250 | 100.00% |

    | 10039340 | U-B--- | 2 | 10032d | 250 | 250 | 100.00% |

    | 1003935c | U-B--- | 3 | 100427 | 250 | 250 | 100.00% |

    | 10039378 | U-B--- | 4 | 100521 | 250 | 250 | 100.00% |

    | 10039394 | U-B--- | 5 | 10061b | 250 | 250 | 100.00% |

    | 100393b0 | U-B--L | 6 | 100715 | 250 | 43 | 17.20% |

    | 100393c7 | U-B--- | 7 | 300035 | 512 | 1 | 0.20% |

    | 100393e8 | U-B--- | 8 | 300235 | 512 | 1 | 0.20% |

    | 10039404 | U-C--L | 9 | 300435 | 512 | 0 | 0.00% |

    | 10039420 | F---- | 0 | 300635 | 512 | 0 | 0.00% |


    Now that the current logs are the new ones and not the old ones, we can delete
    the old ones:


    ```

    $ onparams -d -l 1 -y

    $ onparams -d -l 2 -y

    $ onparams -d -l 3 -y

    $ onparams -d -l 4 -y

    $ onparams -d -l 5 -y

    ```'
