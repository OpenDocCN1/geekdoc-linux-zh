- img_proc: true
  md: 'heavily burdened server, then you can add them during this installation

    process easily and quickly.


    # Creating the Partitions to Your Specifications


    The next step provides a graphical disk partition and assignment tool

    called Disk Druid. Unfortunately, this tool is available only during instal-

    lation. When the system is running, you can use the fdisk utility to per-

    form partition changes, but not the partition to directory assignments.


    # WARNING


    As a database server, the separation of the data into distinct partitions

    provide for better overall management later on. You are encouraged to

    keep the system files and database files on separate partitions.


    # For IT Professionals


    # Disk and Memory Issues


    Technically, you can use FAT16 and FAT32 formatted drives with

    Linux, but this would be a poor choice for a database server. The

    optimal type of file system is the Linux Native for all data drives. You

    also need disk space allocated to swap drives. You can have a maxi-

    m of 4GB of swap space spread across eight partitions with any

    one partition not to exceed 2GB in size. The recommendation is to

    have two to three times your RAM size as swap. This is a good rule

    of thumb until you get into the gigabytes of RAM. You are unlike-

    ly swap at this point and even less likely to swap out all 2GB of

    RAM. There are exceptions, for example, if you have really big single

    processes configured like big resident database files, then you need

    the large amount of swap. If you are designed toward smaller

    transaction oriented processes, then you can have less total swap

    space. Remember, if you have big processes in memory, disk is cheap,

    use it for swap. At this point, stick to two to three times the RAM

    until you can do some system analysis.'
