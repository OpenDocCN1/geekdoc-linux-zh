  md: '# Chapter 4 · An Informix Installation on Linux


    If you create this minimum set de you will have a minimum installation that can
    meet most of your needs as you learn about how the IDS engine works. It will also
    allow you to expand easily as your needs increase.


    # About Disks


    You should set up an area on your system to accommodate Informix. There are three
    areas to consider: software, dbspaces, and a work area for backups, loading, and
    so on.


    SCSI is recommended over IDE, for speed and flexibility. SCSI allows you to chain
    together drives more than IDE. However, if you are experienced enough with IDE,
    you could achieve a similar disk setup, but there are still limitations with IDE
    that do not allow the same flexibility as SCSI. If at all possible, get a SCSI
    controller for your system, and use a SCSI drive.


    # Disks and Directories


    Here are explanations of what the /opt/informix/ids7.30 and /opt/data directories
    hold.


    /opt/informix/ids7.30. This directory holds software—everything under this tree.
    Set aside, at a minimum, 500MB for the Informix software. No data is stored here.
    Using this convention for a directory name you can add other versions of the software
    under /opt/informix, and easily test switching or upgrading your software by simply
    changing the $INFORMIXDIR environment variable.


    /opt/data. This directory holds cooked-file dbspaces; if possible, this should
    be another disk. This directory is for data only.


    # Space Considerations


    How much space should you set aside? You could take a 2GB disk and allocate space
    as follows.


    For the operational spaces:


    +   - 50MB for rootdbs

    - 50MB for physdbs

    - 100MB for logsdbs

    - 300MB for tempdbs

    - 500MB total'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# An Informix Installation on Linux · Chapter 4 131


    For the data spaces:


    +   - 100MB for dbs_dbs—this will hold only database entries, and is not for tables.

    - 250MB for datadbs01—this can be smaller if you are going to use it for training,
    and it will hold tables.

    - 250MB for indexdbs01—again, for training this can be smaller, but will hold
    only indexes.

    - 600MB total.


    If you have set aside 2GB disk for example, you have now allocated a total of
    1100MB to start with and there is still some room for growth. This is only a starting
    point, not necessarily hard and fast for all systems. These are also conservative
    resource settings, without a lot of wasted space for each dbspace. The only resource
    settings that are really firm for rootdbs and physdb, even these are arbitrary:
    After properly configuring the system you will find these sizes might be adjusted
    for your site. Start with these, and change them later if you choose. The rootdbs
    space will have very little usage after we are done so you should not make it
    larger than 50MB; in most cases, even 20MB will be too much space. I make it 50MB
    as a safety precaution


    /work is a mounted file system of your choosing for work. Set aside at least 1000MB
    for this disk. This is a Linux disk for preparing load files and managing data
    coming in and leaving the database. It''s always a good idea to have a place to
    work on the system that is specific to different database projects. Under this
    directory you can create project directories or user-named directories, at your
    preference.


    # NOTE


    Many BIOSs in PCs do not allow the use of large drives in Linux, even when the
    hardware is brand new. Most BIOSes do not support many of the larger drives—be
    careful when using IDE drives. This is one of the most important reasons to use
    SCSI, as you will not be limited by the on-board controller for your disk layout
    when configuring your drives for Linux.


    This is not the only reason you should use SCSI drives; performance is another.
    Even with the advances in IDE drives, most shops will still configure and prefer
    SCSI drives. If you have already configured your drive, have an ample amount of
    room for the software and data. Then you are ready to install Informix.'
