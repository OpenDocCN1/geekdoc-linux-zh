  md: '# 328 Chapter 8 Installing and Managing Progress on Linux


    using the -t (lowercase) parameter. The major file types found in the -T

    area are:


    +   - Srta<pid>: The sort file—client-side query resolution and r-code buffering


    +   - Lbia<pid>: Local Before Image—subtransaction and variable undo

    notes


    +   - DBia<pid>: Temporary buffer overflow


    If you cannot use memory to redirect this I/O (the -mmax and -Bt

    parameters are the relevant parameters), it is important that the -T area

    have excellent I/O throughput—such as be found on a striped and

    mrored set of disks.


    # Creating a New Database


    Although there are many ways to set up your database, we will concen-

    trate the best performing methods. Progress provides two different

    methods of using a database—single-volume and multiverse.

    Multiverse is an absolute necessity in large-scale environments, but

    offers many advantages to all users.


    # Multiverse


    Progress has two types of database layouts available. Single vol-

    abases are the easiest to create but have a maximum size of 2

    gigabytes (the limit of an lseek() system call). Data extents still have the

    tame 2GB limit in multiviverse databases, but they can all be combined

    for larger storage capacity. Beginning in version 9 of Progress, or just

    dabases will be multiverse. This, combined with the potential perfor-

    mancements due to increased file handles, makes multiverse

    recommended choice.


    Progress databases are split into four types of files—before-image

    extents, after-image extents, data extents, and the DB file. Before-imaging

    is what gives Progress the ability to back out unfinished transactions.

    the before-simage file are identified by file extensions of .b1, .b2, or just

    .bi for a single-volume database. After-image extents end in .a1, .a2, etc.,

    and are the Roll Forward Recovery files. Data extents contain both data

    and the indexes to the data. Each of these files is described in a

    structure file and then pieced together in a collection to form the binary equiv-

    albase. The structure file ends in .st and is used to create its binary equiv-

    ent db file is not required and can be recreated using the prostrct utility—it
    is, however,

    handy to keep around for documentation purposes.'
