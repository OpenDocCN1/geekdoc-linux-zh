- img_proc: true
  md: '# Technical Editors


    Chris Rogers has been configuring Linux servers since 1994. To give an idea of
    how long that is in terms of the computing industry, the Web browser was Mosaic,
    Netscape 0.9 had just hit the FTP sites, and the Slackware distribution without
    X-windows could still fit in on only three 3.5" diskettes. Chris is now CEO of
    PowerStreak Networks, a Management Services Provider that specializes in managing
    customer networks using Linux servers. Chris may be e-mailed at crogrers@powerstreak.com.


    David C. Niemi is a senior network engineer at a large financial company. He is
    also president and co-founder of Tux.Org, a nonprofit company devoted to education
    and support for free software. He has been contributing to the Linux kernel and
    other free software projects.'
