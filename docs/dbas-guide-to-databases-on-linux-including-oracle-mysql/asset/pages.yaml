  md: '414 Chapter 9 • PostgreSQL on Linux


    # FAQs


    +   Q: Why does initdb fail?


    +   A: Check that you don''t have any of the previous version''s binaries in your
    path. (If you see the message WARN:heapmodifytuple: repl is \ 9, this is the problem.)
    Check to see that you have the proper paths set, and that the postgres user owns
    the proper files.


    +   Q: How do I install PostgreSQL somewhere other than /usr/local/postgresql?


    +   A: The simplest way is to specify the --prefix option when running configure.
    If you forgot to do that, you can edit Makefile.global and change POSTRESDIR accordingly,
    or create a Makefile.custom and define POSTGRESDIR there.


    +   Q: When I start the postmaster, I get a Bad System Call or core dumped message.
    Why?


    +   A: It could be a variety of problems, but first check that you have System
    V extensions installed on your kernel. PostgreSQL requires kernel support for
    shared memory and semaphores.


    +   Q: When I try to start the postmaster, I get IpcMemoryCreate errors. Why?


    +   A: You either not have shared memory configured properly in the kernel or
    you need to enlarge the shared memory available in the kernel. The exact amount
    you need depends on your architecture and how many buffers and back-end processes
    you configure postmaster to run with. For most systems, with default numbers of
    buffers and processes, you need a minimum of ~1MB.


    +   Q: When I try to start the postmaster, I get IpcSemaphoreCreate errors. Why?


    +   A: If the error message is IpcSemaphoreCreate: semget failed (No space left
    on device) then your kernel is not configured with enough semaphores. Postgres
    needs one semaphore per potential back-end process. A temporary solution is to
    start the postmaster with a smaller limit on the number of back-end processes.
    Use -N with a parameter less than the default of 32. A more permanent solution
    is to increase your kernel''s SEMMNS and SEMMIN parameters.


    +   If the error message is something else, you might not have semaphore support
    configured in your kernel at all.'
