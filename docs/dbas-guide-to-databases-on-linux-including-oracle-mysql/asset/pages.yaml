  md: '# PostgreSQL on Linux • Chapter 9 415


    G: How do I prevent other hosts from accessing my PostgreSQL database?


    A: By default, PostgreSQL only allows connections from the local machine using
    UNIX domain sockets. Other machines will not be able to connect unless you add
    the -i flag to the postmaster, and enable host-based authentication by modifying
    the file PGDATA/pg_hba.conf accordingly. This will allow TCP/IP connections.


    G: Why can''t I connect to my database from another machine?


    A: The default configuration allows only UNIX domain socket connections from the
    local machine. To enable TCP/IP connections, make sure the postmaster has been
    started with the -i option, and add an appropriate entry to the file pgsql/data/pg_hba.conf.
    See the pg_hba.conf manual page.


    G: Why can''t I access the database as the root user?


    A: You should not create database users with user id 0 (root). They will be unable
    to access the database. This is a security precaution because of the ability of
    any user to dynamically link object modules into the database engine.


    G: All my servers crash under concurrent table access. Why?


    A: This problem can be caused by a kernel that is not configured to support semaphores.


    G: How do I tune the database engine for better performance?


    A: Certainly, indices can speed up queries. The explain command allows you to
    see how PostgreSQL is interpreting your query, and which indices are being used.


    If you are doing a lot of inserts, consider them in a large batch using the copy
    command. This is much faster than individual inserts. Second, statements not in
    a begin work/commit transaction block are considered to be in their own transaction.
    Consider performing several statements in a single transaction block. This reduces
    the transaction overhead. Also consider dropping and recreating indices when making
    large data changes.


    There are several tuning things that can be done. You can disable fsync() by starting
    the postmaster with a -F option. This will prevent fsync()s from flushing to disk
    after every transaction.'
  merge: -1
  pgno: 450
- img_proc: true
  md: '# 416 Chapter 9 · PostgreSQL on Linux


    You can also use the postmaster -B option to increase the number of shared memory
    buffers used by the back-end processes. If you make this parameter too high, the
    postmaster may not start up because you''ve exceeded your kernel''s limit on shared
    memory space. Each buffer is 8K and the default is 64 buffers.


    You can also use the back-end -S option to increase the maximum amount of memory
    used by each backend process for temporary sorts. The -S value is measured in
    kilobytes, and the default is 512 (i.e., 512K). It is unwise to make this value
    too large, or you may run out of memory when a query invokes several concurrent
    sorts.


    You can also use the cluster command to group data in base tables to match an
    index. See the cluster(1) manual page for more details.


    Q: What debugging features are available in PostgreSQL?


    A: PostgreSQL has several features for debugging purposes. that report status
    information that can be valuable for us.


    First, by running configure with the --enable-cassert option, many assert()s monitor
    the progress of the back-end and halt the program when something unexpected occurs.


    Both postmaster and postgres have several debug options available. First, when
    you start the postmaster, make sure you send the standard output and error to
    a log file:


    ```

    cd /usr/local/postgresql

    ./bin/postmaster >server.log 2>&1 &

    ```


    This will put a server.log file in the top-level PostgreSQL directory. This file
    contains useful information about problems or errors encountered by the server.
    Postmaster has a -d option that allows even more detailed information to be reported.
    The -d option takes a number that specifies the debug level. Be warned that high
    debug level values generate large log files.


    You can actually run the postres back-end from the command line, and type your
    SQL statement directly. This is recommended only for debugging purposes. Note
    that a newline terminates the query, not a semicolon. If you have compiled with
    debugging symbols, you can use a debugger to see what is happening. Because the
    back-end was not started from the postmaster, it is not running in an identical
    environment and locking/back-end interaction problems may not be duplicated. Some
    operating systems can attach to a running back-end directly to diagnose problems.'
  merge: -1
