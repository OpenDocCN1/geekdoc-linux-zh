  md: '# # Introduction


    This chapter will introduce the basic concepts you need to know to install any
    Linux distribution, and will specifically use specific examples from a Red Hat
    Installation. Linux distributions usually provide a plethora of utilities and
    products; you must decide which you need and which you do not. Many include a
    free or sample version of a database server.


    Linux is also a server of many network and productivity services so you must decide
    how you will use this server before plan your installation. Technically, you can
    run any combination of the following services: dynamic host control protocol (DHCP),
    Domain Name Server (DNS), ftp, a database product such as Oracle (not supplied
    with many distributions), or the Postgres server (free version supplied with some
    versions of Linux). You can do all of these services from one physical machine
    or you can spread them out to any combination of machines you want.


    # NOTE


    The screen shots used in this chapter were obtained during an installation of
    Linux onto a host NT 4.0 machine using VMware. They are for illustrative purposes;
    be aware that the title bars such as those in Figure 2.2, Figure 2.3, and others
    which follow, do not appear during the installation.


    # # Separate Physical Machine


    Naturally, a separate server for your database is highly recommended. This provides
    the best responsiveness, security, and reliability. Most database applications
    are very complex in design and are very CPU-, memory-, and disk-intensive. You
    do not want your database server competing for CPU cycles or disk I/O with any
    other services (Web, ftp, file, and print, for example), as this would greatly
    reduce the performance of all services in general.


    By separating the database service, you are also better able to secure the system
    from intrusion, and keep the data and its backups completely separate and secure
    from other processes. The general types of system attacks are mostly in standard
    network services. If you keep your services on another machine, intruders are
    unlikely to be able to get to your database server. Even the administrative passwords
    should be different between these systems for additional security against intruders
    who breach one of the other servers on your network.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Choosing a Distribution of Linux


    Next to consider is which distribution version of Linux to use. There are many
    to choose from; they will all probably support any database certified Linux to
    some extent, but the more commercial versions will probably already have a support
    service or an alliance with the database product company already. Red Hat has
    support for many database products such as Oracle, and from such hardware vendors
    as Dell, Compaq, and IBM to name a few.


    # Preliminary Installation Decisions


    Your project should be designed with every step in mind. In this section, you
    will be introduced to some of the basic topics you plan for before the installation
    takes place. This includes the performance levels you want for now and the future,
    and will lead to the hardware and software decisions prior to the actual installation.


    The most critical part of the server is the various hardware aspects outlined
    in the next few sections. This would be true no matter what operating system you
    decided to use.


    # Hardware


    Although it sound odd in this period of cheap home computers, the big-name server
    vendors are big because their high-end servers are just—designed to run 24x7,
    with fail-over features and easy maintenance and serviceability features. This
    is where you need to spend some time and get a machine that can handle extended
    periods of high I/O, run lots of processes simultaneously, move lots of data between
    disk and memory and from memory to CPU, keep most processes memory resident, and
    have some form of hardware RAID for fail-over contingencies. Make sure your new
    system can be expanded easily in the areas of disk controllers, drive bays, and
    RAM.


    # Multiple CPUs


    Database servers need lots of CPU power. The cheap processors can be run in parallel
    to provide amazing throughput and peak load levels. Although you do not get 100
    percent of each additional CPU, the added benefit of keeping everything in local
    memory outweighs the additional cost for the server that supports multiple CPUs.


    # RAM


    The critical factor after deciding on the CPU (or CPUs) is the amount of RAM—you
    need to get a lot. You should do a preliminary analysis of'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'The expected database needs and add a reasonable extra margin. A reasonable
    minimal amount of RAM to start with is probably 256MB for most basic databases.


    # Disks


    The next most important feature is the disk subsystem. Multiple controllers provide
    better throughput and Redundant Array of Independent Disks (RAID) level 5, Disk
    Striping with Parity, provides even better performance in many but not all instances.
    In some cases, especially with databases, RAID level 0, Disk Striping without
    Parity, and RAID level 1, Disk Mirroring, are the recommended options. One more
    thing to note is the cost associated with each of these RAID levels as discussed
    in the next section on RAID.


    In absolute terms you do not need RAID—any good quality, high-speed disks with
    lots of on-board cache will. As long as you have an adequate backup and the down
    time to recover is not too expensive for your business, you can use anything you
    want. Just remember that if your server your order entry system and it goes down,
    everyone waits until it is up again—everyone, including your staff and your clients.
    You can really afford not to have it up? Measure the meager cost of the hardware
    against the possible revenue losses and you will probably go for some form of
    RAID that offers easy recoverability if not assured 24x7 availability.


    # RAID


    RAID level 1, Mirroring, is a good option for your system disks, where your operating
    system resides. Your database files should be on separate disks entirely from
    the OS and should be hardware RAID 5 to get the best throughput and reliability.


    # Cost of RAID


    The most expensive RAID level is 1. In this case, if two disks of the same size
    are used, you end up with only the space of one for your system; the other is
    a duplicate. This is a 50 percent realized utilization of the two disks. If three
    disks are used for mirroring, then you effectively get 33 percent as only one
    disk is actually available—in essence, the other two are just duplicates of the
    first one.


    With RAID 0, you get 100 percent realized utilization of the disks with usually
    improved read and write speeds. This is because all disk space is available but
    there is no *recovery*. If any disk fails, they are all lost and you must rebuild
    all them and recover all data back to all disks. This is not recommended for mission-critical
    data, but could be used for scratch and temporary data. Alternatively, a set of
    hardware RAID services underneath the multiple disks is an acceptable option.
    You can use providing software RAID 0 to combine them into one really big disk
    as far as the server is concerned.'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'RAID level 5 effectively uses the space on one of the disks (on a rotating
    basis throughout all the disks in the RAID group) to provide a parity block that
    is used to regenerate the data missing by any one disk at a time. Only one disk
    can fail at any given time and must be recovered before any other disk fails;
    usually, there are exceptions. The minimum is three disks, the maximum is 32,
    depending on the operating system used. With three disks, you effectively get
    two of the three for 67 percent utilization. With four disks, you get three of
    four for 75 percent, four of five for 80 percent, and so on until the best utilization
    is 31 of 32 for about 96 percent realized with built-in recoverability. This is
    the recommended solution for mission-critical data.


    # Hardware or Software RAID


    Linux does provide for software-based RAID levels 1 and 5. This is an excellent
    option if the hardware solution is not chosen. This is implemented with two and
    three minimum disks, respectively, and with mdrecover daemon service. You can
    select entire disks or just sized partitions to implement the RAID sets. The setup
    is clearly outlined in the HOWTO-RAID documentation.


    # Network Interface(s)


    A network interface will be another bottleneck in your system. The bigger part
    of the pipe (data throughput rate), the slower part of any system is the disk
    drive. Runs in milliseconds of average seek time, the system memory runs in nanoseconds,
    and the network falls in the middle, usually at microseconds. Get 100 megabit
    cards and a switch instead of two network interface cards (NICs) to two separate
    hubs if possible and spread the load. After the disk system, this is the next
    bottleneck to contend with getting data between your server and your clients.


    # Backup Issues


    The biggest tape drive gets bigger every month. A good top-of-the-line basic single-tape
    backup can back up a maximum of about 80GB. Get at least 2GB, for redundancy and
    speed. There are many options for backup other than tape drives; for example,
    CD-R, CD-RW, DVD-ROM, and Jaz disks, which may offer better availability than
    tapes at a slightly higher cost. You can also go for the newest disk management
    systems that offer data migration from high-need RAID disks, to medium-need disk
    drives, to needed CD-ROM or Jaz-type disks, to rarely archive levels on tape,
    all in one big system that appears to your machine as just one big disk. This
    is a truly awesome product for availability of your data to the server. Tapes
    are the traditional way, but you can buy two Jaz disks or you can buy another
    6–10GB of disk drive (which is constantly growing), which has a much'
  merge: -1
  pgno: 64
- img_proc: true
  md: 'higher recovery time. Stick these disks on another server and use them as backup
    media—fast to back up and to recover, and cheaper. If the other server is off-site,
    you also have disaster recovery built-in, depending on distance. Check out all
    your options before proceeding, remembering that recovery time is a truly important
    aspect of your decision. Also, don''t forget to verify your backups and to test
    your recovery procedures.


    # Support Issues


    Every big hardware vendor and many Linux vendors make a vast majority of their
    income by providing support services to companies like yours. You pay a premium
    price for a premium product and most would agree it is worth the extra cost.


    ![](img/4dc2950553fde871c28ea3e04a065356_65_0.png)


    +   - A variety of support services are available for different versions of Linux.

    - If you purchased either the Deluxe or Professional official products, Red Hat
    offers 180 days free ftp support, 90 days web-based support, and 30 days of installation
    support.

    - Debian GNU/Linux provides unlimited access to their Web and ftp support sites.

    - Purchasers of TurboLinux get 60 days of technical support.


    # Installation Preliminaries


    For a development machine, you could simply add some extra disk to an existing
    machine and install Linux onto that extra disk, set the system for dual bootop,
    and then reboot into whichever OS you prefer. This is a common scenario for many
    administrators that want to try it first, prove it under a simulated load, and
    then deploy to the field.

    For a real, full-time, dedicated mission-critical server, you need to dedicate
    the machine to the serving of the database and, preferably, nothing else.


    # Installing Red Hat


    Red Hat Linux is the single largest distribution, and several other leading distributions
    are derived from it to varying degrees. Red Hat was one of the first commercial
    versions of the Linux distribution that offered support services and added additional
    user-friendly features and will be covered here for the above reasons.'
  merge: -1
  pgno: 65
