- img_proc: true
  md: '# Setting the System Administrator’s Password


    At this stage we have an operating Sybase Database Server running. We can connect
    to this server from the local machine by the logical names we gave it in the interfaces
    file. Sybase provides an application called isql that provides an interactive
    SQL shell to send SQL statements to the database server and retrieve the results
    sets to be displayed on screen. (Optional, you can download sqsh, which is a much
    nicer tool that provides similar functionality. See the description of it, earlier.)


    Sybase initially installs the database server with the System Administrator (sa)
    password set to an empty string. This is highly insecure; therefore, you should
    change it as soon as possible. To change the password, we need to log on to the
    server with the isql tool and execute the sp_password stored procedure, as follows:


    ```

    [wanderer bard]$ /opt/sybase/bin/isql -U sa -S WANDERER

    ```


    Password:

    1> sp_password @new_password="INOTELL"

    2> go

    Password correctly set.


    Normally, if you are setting a password for a user, you must also specify the
    caller password, new password, and login parameters to the sp_password stored
    procedure.


    # Configuring Database Devices and Databases


    The next step to configure our server is to create the database devices for the
    user databases tables. In our example case we will have only one database on this
    machine, but we easily could have multiple databases on each device and multiple
    devices on this machine, as well as a single database that spans multiple devices.
    All of these possibilities are supported by Sybase and are logical extensions
    of our example.


    To create a new device, use the disk insert command. The syntax of the insert
    command is:


    ```

    DISK NAME="<name>", PHYSNAME="<device>", VDEV=<devnumber>, SIZE=<size> [,CTRLTYPE=<controller>]
    [,START=<offset>] [, CONTIGUOUS

    ```


    To create a device as a file on the file system we must just specify full path
    to the file to create. To create a device on a Linux device (like a hard drive
    partition) we just specify PHYSNAME as the full path to the device special. The
    NAME parameter to insert is a unique string name to reference this database device
    on this server.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# 214 Chapter 5 · Installing and Utilizing Sybase on Linux


    DEVNO is an integer device number for the new device. This should be one higher
    than the max device currently known to the server. You can find out what devices
    are currently known and what device numbers they have with the sp_device stored
    procedure. SIZE is the size of the new device as an integral number of 2048 bytes.
    When setting the size of a database device that is going to occupy a disk partition,
    be sure to specify it as large as the partition itself. You can have only one
    data-device on a disk partition.


    So, for our example, we would execute the following commands in isql:


    ```

    1> disk init name="xact", physname="dev/sdb1",

    2> DEVNO=2, SIZE=<SIZE OF PARTITION in 2KB blocks

    3> go

    1> disk init name="data1", physname="dev/sdc1",

    2> DEVNO=3, SIZE=<SIZE OF PARTITION in 2KB blocks

    3> go

    ```


    Now we have two new devices available to put user databases on our SQL Server.
    The first device, called xact, will hold our transaction logs. (It is always a
    good idea to have your transaction logs on a separate physical device than your
    database so if one of the physical devices fails, you can retrieve the database
    from the other device.) The second device, called data1, will hold the data tables
    for the database. We named it data1 so that we could add more data devices (more
    hard drives) as our database grows.


    The next step is to actually create user databases to reside on the new devices,
    using the create database SQL command. This command must be executed while you
    are in the master database (type use master). The syntax for this command is:


    ```

    create database database_name

    [on (default | database_device) [= size]

    [, database_device [= size]...]

    log on database_device [= size]

    [, database_device [= size]...]

    [with override]

    [for load]

    ```


    The on clause specifies which device the database should be put, and the =size
    clause specifies the database size in megabytes. The log clause indicates where
    the SQL Server should put the transaction log. In our example we have only one
    database, which we will call user_data.'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'and will create it to occupy fully both the datal and the xact database devices.
    The command for doing this is as follows:


    +   1> create database_user_data data=<SIZE OF PARTITION in MB>

    2> log on xact=<SIZE OF PARTITION in MB>

    3> go


