    # Configuration


    The basic layout of the MySQL directory is set up in two different ways, depending
    on which distribution you have installed. For binaries, it looks like this:


    ```

    bin             main and support programs

    data            the databases themselves and log files

    include         header files

    lib             libraries

    scripts         scripts used for installation

    share/mysql     error messages

    ql-bench        benchmarks

    ```


    For source distributions, it looks like this:


    ```

    bin             main and support programs

    include/mysql   include files

    info            documentation

    lib/mysql       libraries

    libexec        the server itself

    share/mysql     log files for errors

    ql-bench        benchmarks and test suites

    var             the database files and log files

    ```


    # Security


    Restricting user access to the database and only letting them perform certain
    actions will help improve your application. This is an important step that cannot
    be stressed enough. If this database is merely set up for evaluation, this is
    not needed. Any service or application that will use this database to store live
    data should be secured.'
