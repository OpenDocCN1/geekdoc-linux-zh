  md: '# Chapter 8 · Installing and Managing Progress on Linux


    # Word Indexes


    One of the forgotten gems in the Progress database is a feature known as the Word
    Index. Character data can be used to create a presorted index identifying all
    of the words contained inside the data. This is not a particularly sophisticated
    text retrieval feature, but a low-cost way to provide advanced searches on databases
    of newsgroup posts, legal briefs, and knowledge-base entries. Access to the index
    is provided by the single 4GL CONTAINS.


    # Internationalization


    Internationalization covers a wide variety of topics from Double Byte enabled
    versions of Progress for the Asian character sets, to language translations of
    the Progress error messages, to regionalized date and numeric formats, and collation
    tables providing sort capabilities based on national character sets. Progress
    has all of these features through a rich set of character handling features.


    In addition, Progress makes an additional optional product called Translation
    Manager. Its primary function is to scan Progress 4GL source code and determine
    the strings used in the application for various messages and screen labels. This
    list can then be given to a professional translator without ever having to know
    anything about computers. Multiple copies of the translated strings can then be
    kept, swapped and in and out through the Translation Manager product.


    # 24 by 7 Operation


    Progress added an online backup feature in several releases prior to the current
    one. However, there are still several features missing in the currently available
    for Linux. The Linux 8.3 version does not allow you to keep the database online
    during index reorganization. Activation and deactivation of indexes and most other
    database schema changes currently not be conducted online.


    Progress slowly has been adding features to mitigate some of these issues. For
    example, new fields can be added without reorganizing the entire table. In addition,
    version 9 offers an online table move and an online index build. The Linux platform
    is scheduled to be ported during the introduction of Progress 9.1.


    # No BLOBs


    Binary Large Objects (BLOBs) are pieces of data like movie and audio clips, or
    geospatial data. Progress currently does not support these and has plans for only
    minimal support in the future. Support for smaller objects, up to 32k bytes, is
    available and so is using the database as an'
  merge: -1
  pgno: 383
- img_proc: true
  md: '# Installing and Managing Progress on Linux • Chapter 8 349


    index of the BLOBs stored as file pointers. However, if you have requirements
    for heavy multimedia storage, then Progress is not a likely candidate.


    # No Parallel Queries


    A handful of the highest end database systems have incorporated the ability to
    process a single database query across multiple CPUs. The technology behind this
    has proven to be extremely costly and time-consuming to debug. Today''s massively
    parallel CPU architectures can certainly produce huge amounts of CPU resources.
    However, the cost of such machines and the cost of creating the technology puts
    it out of reach of the average medium-sized computer department. Costs aside,
    there is no guarantee that the individual queries you may have benefit from processing
    on more than one CPU. Many cases show that the I/O operations become the bottle-neck
    instead the CPU. In those cases, all the money spent on a Parallel Query would
    be wasted


    # No Distributed Lock Manager


    To provide full transactional roll back between multiple databases, a feature
    called 2-Phase Commit is needed. This was introduced shortly after introducing
    the capability of one Progress to connect to multiple databases at the same time.
    There is no issue if those databases are located on one single system, since the
    2-Phase Commit scheme involves shared data in main memory. But if those databases
    are located on different machines, the method no longer works. For such a feature
    to exist, a Distributed Lock Manager is needed. The theory and practice of this
    type of software is complex and expensive to build. It is even more expensive
    to continue to manage and run. PSC has taken the stance that the expense of such
    a Lock Manager would be too much for a client base accustomed to a high ROI database.
    Consequently, systems needing products like Tuxedo and TopEnd are not candidates
    for Progress.


