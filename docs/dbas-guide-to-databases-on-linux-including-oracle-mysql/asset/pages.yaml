    # Troubleshooting


    Very little goes wrong with a Progress database. Most issues have to do with managing
    those crazy users. The following topics are some of the more likely scenarios.


    # Hung Users, Runaways, and Other Psychos


    The simplest (and safest) way to handle _progress processes (self-service user
    sessions) needing some sort of external attention is to wait for them to finish.


    If that isn''t an option, then in all cases your next step should be to have the
    user slowly back away from the keyboard keeping their hands in sight at all times.
    This (hopefully) prevents any problems arising from simultaneous conflicting attempts
    to remedy the situation. Then your best bet is kill -2 (SIGINT). Kill -2 simply
    raises the STOP condition in the target 4GL procedure and causes the -p startup
    procedure to be rerun. The process won''t die but it won''t be doing anything
    either. And if the problem is something along the lines of “I''m hung” the user
    will probably get their session back without having to go through a UNIX login
    again (if it''s a network or hung problem out of luck).


    If kill -2 isn''t what you need—perhaps because you limit users to one login and
    there is a network problem the idle session is blocking access—then you should
    still use kill -2 to get the process to a stable state. Once it is stabilized,
    the .lg file says that any transaction backing is complete and it is no longer
    accumulating CPU time and I/O operations then kill -1 (SIGHUP) should very safely
    terminate it just if the user had shut off their terminal. Kill -15 (SIGTERM)
    has much the same effect.


    Using a series of kill commands is not a good idea unless you plenty of time between
    them and monitor the .lg file and the process status. If you interrupt Progress''
    cleanup routines and the interruption to an interrupt isn''t handled correctly
    you could easily crash the database.


    Trapping signals with the shell trap command is a bad idea. It will defeat the
    proper operation of these signals and lead to a very unstable system. If you shell
    out of a _progres session, type trap, and get any'
  merge: -1
