    # Configuring the Control Center


    If you want to use the Control Center to manage remote workstations and schedule
    scripts to run on your DB2 server, you have to set up the Java Run-Time Environment
    (JRE). You can run the Control Center either as a Java application or as a Java
    applet over a Web server. I recommend that you run the Control Center as a Java
    application. For more information, refer to the Control Center README file, called
    readme.htm, located in the /usr/IBMdb2/V6.1/cc/directory. The instructions in
    this section assume that you are setting up the Control Center to run as a Java
    application. If you do not want to use the Control Center, you can'
