    # Configuring a DB2 Client to Communicate with a DB2 Server


    This section describes how to configure a DB2 client to communicate with a DB2
    server using the command-line processor. This section also assumes that TCP/IP
    is functional on the client and server workstations and was functional before
    you installed your DB2 server or DB2 client.


    Before a DB2 client can be configured to communicate with a DB2 server, the DB2
    server must have been configured to accept inbound requests. By default, the DB2
    Installer will autconfigure your DB2 server for TCP/IP communications. If you
    did not use the DB2 Installer to install'
  merge: -1
  pgno: 302
- img_proc: true
  md: "# Chapter 6 Installing DB2 Universal Database Version 6.1 on Red Hat Linux\n\
    \nyour DB2 server, you would have to configure inbound client communications manually\
    \ using the command-line processor. For information on how to configure your DB2\
    \ server manually for inbound client communications, refer to the DB2 and DB2\
    \ Connect Installation and Configuration Supplement.\n\nDue to the characteristics\
    \ of the TCP/IP protocol, TCP/IP may not be immediately notified of the failure\
    \ of another workstation. As a result, a DB2 client application accessing a remote\
    \ DB2 server using TCP/IP, or the corresponding agent at the server, may sometimes\
    \ appear to be hung. DB2 uses the TCP/IP SO KEEPALIVE socket option to detect\
    \ when there has been a failure and the TCP/IP connection has been broken.\n\n\
    If you are experiencing problems with your TCP/IP connection, refer to the DB2\
    \ Troubleshooting Guide for information on how to adjust this parameter, and for\
    \ information about other common TCP/IP problems.\n\nIf a DB2 client to communicate\
    \ with a DB2 server using TCP/IP, perform the following steps.\n\n+   1. Identify\
    \ and record the required TCP/IP parameters. These parameters are presented in\
    \ Table 6.1.\n\n| Table 6.1 Required TCP/IP Parameters for DB2 Client-to-Server\
