- img_proc: true
  md: '# Scripting Languages


    There are many Open Source scripting languages, such as Perl, Python, and TCL,
    that offer scripting capabilities. Many of them can be integrated into Apache
    and other Web servers, avoiding the security and performance issues that occur
    with CGI. These languages are an excellent choice for Web development, especially
    if you are already proficient in them. You can visit any of the following sites
    for more information: http://www.perl.com, http://www.python.org, and http://www.tcl.com.


    # PHP


    PHP is an extremely popular Open Source application language that is designed
    to compete directly with Apache and JSP. It offers modules for IMAP, POP3, LDAP,
    XML, PDF, PostScript, FTP, WebDAV, Oracle, MySQL, mSQL, Informix, PostgreSQL,
    Sybase, and many other database engines to mention here. It runs on Linux, UNIX,
    and Windows NT. Because PHP is freely available, with source code, and included
    with Red Hat Linux, we will develop the application built-up in PHP against the
    excellent MySQL database engine. According to Netcraft, PHP is powering over one
    million Web servers and growing very fast. Go to http://www.php.net for more information.


    # Apache


    By far the most popular Web server platform is Apache (http://www.apache.org),
    with approximately 60 percent of the market share according to NetCraft. Microsoft''s
    IIS comes in a distant second with 22 percent of the market share. Apache offers
    great performance, although performance is not only its advantage. There is a
    wealth of addons and modules available; it''s extremely stable and offers good
    security; it runs on all operating systems; it''s very scalable; and it''s free
    and Open Source.


    Apache is based on the NCSA Web server. The developers of Apache were unsatisfied
    with the rate of development on the NCSA Web server, and so released their own
    patched-version, a Patchy Web Server. In the years since, Apache has developed
    into a robust and well-supported platform. Security bugs are fixed in a matter
    of hours, as everyone has the source code and can contribute a fix back to the
    development team.


    PHP and Perl, as well as many other Open Source languages and platforms, are available
    as plug-in modules to Apache. Although PHP can run with other Web servers, we
    will discuss PHP running as an Apache module, because there are other security
    constraints involved with running it via CGI.'
