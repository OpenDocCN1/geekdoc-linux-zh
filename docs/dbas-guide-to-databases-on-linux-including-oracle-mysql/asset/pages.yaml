  md: '# Preparing Red Hat Version 6.1 for a DB2 Installation


    Recently, Red Hat version 6.1 became generally available. This version of Red
    Hat has a problem with its dynamic loader library and causes DB2 to crash when
    it tries to start the database manager for an instance. The database manager,
    started by entering the db2start command, is required to start an instance, create
    a database, and access data within a database. Essentially, if you do not have
    a started database manager, you cannot use DB2. DB2 Installer will perform most
    of the configuration steps to set up a DB2 server, it will have to create and
    start an instance. This will cause the installation to hang.


    IBM is working with Red Hat to fix this problem; in the meantime, there are some
    steps you have to perform to avoid this problem and to install DB2 successfully.
    In order for your Red Hat version 6.1 workstation to install a DB2 product, you
    have to download a patch file from the Web. To make things a little confusing,
    the patch that you download depends on where the DB2 code you want to install
    came. Your DB2 code could come from one of two sources: the IBM-distributed version
    of DB2 that became generally available in the fall of 1999 or the version of DB2
    that is bundled in the Red Hat version 6.1 box.


    # TIP


    I recommend that you maintain your version of DB2 at the most recent FixPack level.
    At the time this book was written, this was FixPack 2. The version of DB2 that
    is shipped with Red Hat version 6.1 is DB2 with FixPack 1. DB2 FixPacks are available
    for download at ftp://ftp.software.ibm.com/products/db2/fixes/english-us/db2linuxv6.1/
    Each FixPack''s name starts with FP and the number of the FixPack. For example,
    the name for FixPack 2 would start with FP2. If you have the resources when you
    finish your DB2 installation, upgrade your version of DB2 to the latest FixPack.


    To ensure that you download the correct patch file and implement it patch correctly,
    perform the following steps:


    +   1. Log on to your workstation as a user with root authority.

    2. Connect to IBM''s support fix site at

    ftp://ftp.software.ibm.com/products/db2/tools.

    3. Download the appropriate patch file.


    If you want to install the copy of DB2 that came in your Red Hat version 6.1 box,
    download the db2rh61fix.tgz patch. If you are going to install any other code
    of DB2, download the db2rh61gafix.tgx patch.'
