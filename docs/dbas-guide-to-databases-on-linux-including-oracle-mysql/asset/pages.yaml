  md: '# 36 Chapter 9 • PostgreSQL on Linux


    +   Different systems have different conventions for starting up daemons at boot
    time, so you are advised to familiarize yourself with them. Most systems have
    a file called /etc/rc.local or /etc/rc.d/rc.local, which is almost certainly not
    a bad place to put such a command. Whatever you do, postmaster must be run by
    the PostgreSQL superuser (postgres) and not by root or any other user. Therefore
    you probably always want to form your command lines along the lines of su -c ''...''
    postgres.


    +   It is advisable to keep a log of the server output. To start the server that
    way:


    su -c postmaster -D /usr/local/postgresql/data > server.log 2>&1 & postmaster
    &

    Here are a few more operating system-specific suggestions.


    +   Edit rc.local on NetBSD or file rc2.d on SPARC Solaris 2.5.1 to contain the
    following single line:


    ```

    postgres -c "/usr/local/postgresql/bin/postmaster" -S -D

    /usr/local/postgresql/data

    ```


    +   In FreeBSD 2.2-RELEASE, edit

    usr/local/etc/rc.d/postgresql.sh to contain the following lines and make it 755
    and chosen root:bin:


    ```

    #!/bin/sh

    [ -x /usr/local/postgresql/bin/postmaster ] && {

    su -l postgres -c ''exec /usr/local/postgresql/bin/postmaster

    -D/usr/local/postgresql/data

    -S -O -F /usr/local/postgresql/errlog &\necho -n '' postgres''

    }

    ```


    +   You may put the line breaks as shown here. The shell is smart enough to keep
    parsing beyond end-of-line if there is an expression. The exec saves one layer
    of shell under the postmaster process so the parent is init.


    +   In Red Hat Linux, add a file /etc/rc.d/init.d/postgresql.init. which is based
    on the example in contrib/linux/. Then make a symlink to this file from /etc/rc.d/rc.5/S98postgresql.init.


    +   Run the regression tests to verify that PostgreSQL runs on your machine in
    the way the developers expect it to. You definitely should do this before putting
    a server into production use. The file /usr/src/postgresql/postgresql-7.0/src/test/regression/README
    has detailed instructions for running and interpreting the regression tests.'
