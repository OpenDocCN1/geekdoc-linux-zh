    Now that the logbs bspace exists, you can roll the logical logs out of the rootdbs,
    into the logdbs. When the installation started, it created six logical logs, so
    we will add 20 logical logs for a total of 26. Why 26? Adding 20 logs is a great
    exercise, and will give you a good idea of how the engine works. It is a good
    idea to have many small logical logs; the guidelines are covered in the Administrator''s
    Guide.


    To move the logical logs out you must have new logs in place already available
    for the engine, which will take the place of the existing logical logs. The minimum
    of logical logs is three, so in order to do this we have to tell the engine which
    are the good ones, and which can be deleted. We also cannot delete or remove any
    logical logs that are in use, so we need to tell the engine to use the new ones
    so the old ones can be removed.


    # Create logdbs


    Make sure you have created the new logdbs bspace with the onstats command we discussed
    at the beginning of this section, and then proceed.'
