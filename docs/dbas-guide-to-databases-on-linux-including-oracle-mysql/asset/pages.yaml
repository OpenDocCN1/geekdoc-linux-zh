  md: '# Installing a DB2 Client


    This section will take you through the setup and installation of a DB2 client.
    Before performing the steps in this section, be sure that you have completed all
    the tasks to enable your workstation for a DB2 product installation as discussed
    in the section Preparing Your Red Hat Workstation for a DB2 Installation, at the
    beginning of this chapter.


    The instructions in this section assume that you install and configure your DB2
    client using the defaults provided by the DB2 installation tool. The DB2 Installer
    is a menu-based installation program that assists you in accomplishing time-consuming
    installation and configuration tasks for your DB2 products. The instructions in
    this section also assume that you do not maintain previous versions of a DB2 product
    on your workstation, or the default db2inst user. If you have this user on your
    system, remove it using the userdel command. I recommend that you follow the instructions
    in this chapter on a workstation that has never had a DB2 product installation
    performed on it.


    > TIP


    Sometimes display problems can occur when running DB2 Installer. If your display
    encounters these problems, you can press CTRL-L at any time to refresh your current
    screen.


    To avoid most of the potential display problems, I recommend that you install
    DB2 in a virtual console session. A virtual console session is a terminal window
    outside of the standard graphical interface that is installed with most Red Hat
    workstations. To change to a virtual console, press CTRL-ALT-F1. To change back
    to the graphical interface, press CTRL-ALT-F7.


    You can use the instructions in this section to install a DB2 Run-Time Client
    or a DB2 Administration Client. For example, we will install a DB2 Administration
    Client since it is available on the DB2 Universal Database version 6.1 CD-ROM
    that you used to install your DB2 server. DB2 Administration Clients are also
    available on the DB2 Administration Client CD-ROMs; DB2 Run-Time clients are available
    only on the DB2 Run-Time Client CD-ROMs. For more information, see the DB2 and
    DB2 Connect Installation and Configuration Supplement.


    To install a DB2 Client, perform the following steps.


    +   1. Log on to the Red Hat workstation as a user with root authority.'
  merge: -1
  pgno: 295
- img_proc: true
