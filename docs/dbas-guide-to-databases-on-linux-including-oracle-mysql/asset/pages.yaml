  md: '# Import/Export


    There are three utilities used to get large amounts of data into and out of the
    Oracle database: Export, Import, and SQLLoader. Each utility has a vast number
    of options and features. The Export utility, called exp, extracts the object definitions
    and data from an Oracle database and stores them in a binary file, often called
    a dump. The Import utility, imp, inserts the extracted data into another database.
    Dump files can be read only by the Import utility. Export is not the typical method
    of backing up a database, but it can be used to create a permanent copy of a schema
    to be duplicated to other servers, or to archive if a user leaves an organization.
    The primary use of Export and Import is to get data from one Oracle server to
    another. The CATEXP.SQL or CATALOG.SQL, which runs CATEXP.SQL, must be run to
    configure Oracle for the Import utility. The script needs to be run only once.


    SQLLoader is used to import data from other databases. SQLLoader can read an external
    file containing data stored in a variety of formats. For example, SQLLoader can
    import a fixed-width file or a variable-width record using delimiters, such as
    a tab, to identify columns. SQLLoader requires a control file that describes the
    data and specifies the input data files. SQLPlus produces a log file and a reject
    file containing rejected records.


    # For IT Professionals


    # WebDB


    WebDB is an Oracle product that provides a Web-based interface to the Oracle database.
    WebDB is basically a Web-site construction kit written in PL/SQL. It is completely
    contained within the database and the user interacts solely through a standard
    Web browser. WebDB provides some database administration features such as account
    and object management. It also provides simple-driven development tools that allow
    end-users to design their own Web pages, reports, and forms. The interface includes
    folders in which users can store reports, forms, and documents.


    WebDB contains all the components for a complete site, including a PL/SQL and
    HTTP listener. When the HTTP listener receives a request, it forwards it to the
    PL/SQL gateway, which processes the request to the Oracle server and returns the
    results to the client. All Web-related files and data are stored within the server.
    WebDB uses standard Oracle security, which makes managing individual accounts
    easier.


    Continued


