  md: '# Installation Done!


    You are essentially done! Reboot! The last screen congratulates you for your installation
    and prompts you to press Enter to Reboot. Do not power down at this point; you
    want the system to do a proper shutdown. In fact, you should do an orderly shutdown
    every time you are going to power off your machine, Many databases also have their
    own procedures for an orderly shutdown which will save you considerable time and
    risk.


    # Configuring the Server to Run a Database


    Find a good DBA and let him or her configure the server to run a database. Otherwise
    follow the installation and plan your disk space according to your needs (lots,
    spread it out, RAID, back it up often). The rest of this book will provide more
    details about how to set up Linux as a database server. In essence, you will need
    to configure the network interface or interfaces, create or restore any data files
    you need, test access from any client across the network, and initiate your backup
    scheme.


    # Things to Watch Out For


    Disks, RAM, CPUs, and network cards are the important performance features. Be
    adventurous but do not use bleeding-edge hardware—use tried and truly tested hardware
    wherever possible.


    Partitioning too little or too much can be a consideration; just create what you
    initially need and add as needed. The worst mistake you can make is not to give
    enough space to critical file system partitions like the root partition, and the
    /var partition (if logging and auditing is being done). Your database application
    should be on a separate partition from the OS and from your data. Your data should
    be on its own partition or on multiple partitions, depending on the design.


    Additionally, if you keep each critical area on a separate partition, you can
    easily move it to a new, larger partition. This makes management of growth much
    simpler. Separate partitions are easier to back up and restore, and much easier
    to manage in the areas of user quotas and security issues.


    # Other Flavors of Linux


    This section has focused on a Red Hat installation, but obviously you can use
    any of the Linux distributions you want. Every one of them will be similar in
    performance, features, and stability. The only difference is in the installation,
    initially. Then there may be big differences in some of the system management
    utilities, but that will strictly be in their look and'
