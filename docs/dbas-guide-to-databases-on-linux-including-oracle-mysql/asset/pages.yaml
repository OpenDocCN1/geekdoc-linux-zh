    will allow you to set up a powerful database for your application.


    # # Installation


    Before installing MySQL, you must first decide on one of three versions. The recommended
    one is the stable version, labeled 3.22.X. This version is very well tested, does
    not have any untested features, is ready for production, and is recommended for
    first-time users. The development version, 3.23.X is targeted mainly towards developers
    contributing to the improvement of MySQL, and has many new features. This version
    is not recommended in a production environment. The last version, 3.21.X, is a
    deprecated version. This mainly provides a way for previous users to upgrade to
    this version without any major changes in functionality. This is also more of
    a historical version and not intended to be used.


    After choosing the version, a decision between binary, RPM, and source distributions
    must be made. A binary distribution is already compiled for you. All you need
    to do is install it and decide on the location of the files. The drawback is you
    must find the appropriate binary for your platform.


    Not all platforms are kept up to date for each version. The RPM distribution is
    for those with a Red Hat Linux distribution. This is similar to a binary in that
    it is already compiled and it even sets up the environment for you. The last option
    is the source distribution. This distribu'
