    # User Authentication


    Authentication is the process by which the back-end server and postmaster ensure
    that the user requesting access to data is in fact he or she claims to be. All
    users who invoke PostgreSQL are checked against the contents of the pg user class
    to ensure they are authorized to do so. However, verification of the user''s actual
    identity is performed in a variety of ways:


    +   - From the user shell: A back-end server started from a user shell notes the
    user''s (effective) user id before performing `setuid` to the user id of `postgres`.
    The effective user id is used as the basis for access control checks. No other
    authentication is conducted.


    +   - From the network: If the PostgreSQL system is built as distributed, access
    to the Internet TCP port of the postmaster is available to anyone. The DBA configures
    the `pg_hba.conf` file in the PGDATA directory to specify which authentication
    system is to use according to the host making the connection, and to which database
    it is connecting. See `pg_hba.conf(5)` for a description of the authentication
    systems available. Of course, host-based authentication is not foolproof in UNIX,
    either. It is possible for determined intruders to masquerade as the origin host.
    Those security issues are beyond the scope of PostgreSQL.


    # Host-Based Access Control


    Host-based access control is the name for the basic PostgreSQL controls exercises
    on clients that are allowed to access a database, and on how the users on clients
    must authenticate themselves.


    Each database system contains a file named `pg_hba.conf` in the PGDATA directory,
    which controls which users can connect to each database.


    The general format of the `pg_hba.conf` file is a set of records, one per line.
    Blank lines and lines beginning with a hash character (#) are'
