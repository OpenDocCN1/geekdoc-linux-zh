  md: '# Chapter 3 • Installing and Running Oracle Linux


    9. Review the control file parameter information. A control file is required to
    mount and access a database. For a basic test database, use the default parameters.
    If you set up your file system with Oracle''s OFA, you can optionally change the
    directory path of the control files to /u02/oradata/orcl/control01.ctl and /u03/oradata/orcl/control01.ctl.


    10. The next screen has tabs for SYSTEM, USER, ROLLBACK, INDEX, and TEMPORARY.
    These are tablespaces that serve specific purposes. The SYSTEM tablespace contains
    most of the administrative tables and the data dictionary, the USER tablespace
    stores user objects, the ROLLBACK tablespace holds indexes, and the TEMPORARY
    tablespace stores temporary tables. Notice the initial size for each tablespace
    and the location. The defaults are fine for a test database. If you configured
    your file system with Oracle''s OFA, reference Table 3.4 for directory locations.


    # Table 3.4 Tablespace Data File Locations


    | Tablespace | Location |

    | --- | --- |

    | SYSTEM | /u02/oradata/orcl/system01.dbf |

    | USER | /u02/oradata/orcl/user01.dbf |

    | ROLLBACK | /u02/oradata/orcl/rbs01.dbf |

    | INDEX | /u02/oradata/orcl/indx01.dbf |

    | TEMPORARY | /u02/oradata/orcl/temp01.dbf |


    11. The next screen contains redo log information. Increase the size of the redo
    logs to 5000KB (5MB). Redo logs are required to open the database. Each transaction
    gets recorded in a redo log—it is used for data recovery. If you configured your
    system with Oracle''s OFA, set the redo logs in the following locations: /u03/oradata/orcl/redo01.log
    and /u03/oradata/orcl/redo02.log.'
