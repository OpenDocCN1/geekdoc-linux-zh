    # Destroying a Database


    If you are the database administrator for the database mydb, you can destroy it
    using the following UNIX command:


    ```

    % dropdb dbname

    ```


    This action physically removes all of the UNIX files associated with the database
    and cannot be undone, so this should be done with a great deal of forethought.


    It is also possible to destroy a database from within an SQL session by using:


    ```

    > drop database dbname

    ```


    # Backup and Restore


    Postgres provides two utilities to back up your system: pg_dump to back-individual
    databases, and pg_dumpall to back up your installation in one step.


    An individual database can be backed up using the following command:


    ```

    % pg_dump dbname > dbname.pgdump

    ```


    ```

    and can be restored using:

    ```


    ```

    cat dbname.pgdump | psql dbname

    ```


    This technique can be used to move databases to new locations, and to rename existing
    databases.


    # WARNING


    > Every database should be backed up on a regular basis. Since Postgres manages
    its own files in the file system, it is not advisable to rely on system backups
    of your file system for your database backups; there is no guarantee that the
    files will be in a usable, consistent state after restoration.'
