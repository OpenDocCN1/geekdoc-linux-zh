    # Disk Space versus I/O Throughput


    Another important consideration when configuring a system to run a database is
    the physical disk layout and the capabilities of the disk system. If you have
    a small system that isn''t being stressed you can skip this section until you''re
    ready for it. As long as you''ve followed a design similar to the preceding, you
    can come back later and apply these techniques as needed.


    Capacity of a single disk in gigabytes or sequential throughput in megabytes per
    second are interesting measurements if you''re doing videoon-demand or some other
    pre-Internet world-domination application. What you really need to focus on is
    how many operations per second are occurring. Of course the PC media has convinced
    everyone that the only thing that really matters is the size of a disk drive,
    so if you ever have to explain why you''re "wasting" so much space to a bean counter
    you''re going have to be very patient


    Routine Progress database I/O is going to be in uniform blocks randomly scattered
    on the disk. The disk holding the database, therefore, need to concentrate on
    random I/O. Striped disks are excellent at optimizing random I/O. Mirroring doesn''t
    hurt it any. RAID 5 is a poor choice if there is any noticeable write activity.
    Thus from a RAID perspective,'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# RAID 10 (aka RAID 0 + RAID 1) is the ideal choice. JBOD (Just a Bunch Of
    Disks) is second best, one enough disk third best, and RAID 5 should be avoided.


    Before Image and After file I/O is essentially sequential. Disks perform better
    sequential operations 10 or 20 times faster than random operations. If you mix
    access types you get random access performance. If the aggregate demand for I/O
    operations is greater than what the disks can provide then you get disk queuing
    and bad performance. The first place that will show up is at all checkpoints (freezes
    of all users, as in memory copies of data that are periodically synchronized to
    disk) if you have a workgroup license (or if you aren''t using the asynchronous
    process writer features of the *enterprise license*). Dedicating a disk to the
    .bi file allows it to avoid being impacted by other I/O activity and to run at
    full speed. This is es important with the workgroup license, and still important
    with the enterprise license as you start to push the machine''s capabilities.


    Dedic to the .ai file is important for the same reasons and for an additional
    reason—after-imaging roll forward recovery. If your .ai files are on the same
    media that was damaged in the event that you''re recovering, you have a Catch-22.
    If at all possible you share a disk for after imaging. If you can''t then you
    have only protection from serious hardware failures and administrative errors
    (like accidentally reformatting a disk). You should use after-imaging—it protects
    you from the much more likely user errors (like accidental deleting of all of
    your customers) through the roll forward to a point-in-time feature. But if you
    aren''t getting the full benefit of the feature unless it is on a distinct disk.


    Mirroring .bi and .ai files is a good idea—you don''t want to lose either of them
    for reason. Mirroring is not a replacement for either. The .bi file is essential
    for successful crash recovery. Mirroring faithfully reduces human errors as the
    previously mentioned “delete all the customers” scenario or something as simple
    as rm * in the wrong directory. After-imaging can rescue you from those miscues.
    Mirroring enhances uptime but does not protect you from everything.


    Striping .bi and .ai files is not useful—it defeats the sequential nature of the
    I/O pattern and limits the potential throughput to those files. RAID 5, of course,
    is completely inappropriate for these files.


    Systems with tightly constrained memory or poorly indexed queries experience heavy
    I/O rates to the temporary file area defined by the -T session startup parameter.
    This is a file system where Progress creates temp files used for various purposes.
    These files are normally stored unlinked and are therefore invisible, but they
    can be made visible by'
