    # Choosing an Installation Type


    The Installation Type, as shown in Figure 2.5, is very important. This is when
    you are asked to make a big decision about how to install your Linux. For Red
    Hat, you have three basic options: Server, Custom, or the two versions of Workstation,
    either with Gnome or KDE desktops. The fourth option, Upgrade, is chosen only
    if you already have an earlier version of the same Linux version on this machine.
    You cannot upgrade any other version of Linux except an earlier version of the
    same Linux; in this case, you could upgrade only an earlier version of Red Hat
    Linux.


    # A Workstation Installation


    The workstation options may be sufficiently for your clients or your test machine;
    they are not recommended for a real server. They will install a base Linux for
    you with X Window interface of either Gnome or KDE. They are predefined to partition
    available disk space into three partitions and to install everything into the
    biggest partition of the three. If you were'
