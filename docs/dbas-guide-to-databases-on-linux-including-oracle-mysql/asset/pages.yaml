    # Installing Optional Client Software


    There are several client software packages that can be used to make administering
    and developing for the Sybase platform considerably easier.


    # SQSH


    The first package is a command line and X11 application called sqsh (pronounced
    squish). This application is available from http://www.voicent.com/~gray/sqsh.html
    and is available under the GNU General Public License (GPL). This is an application
    that provides a much nicer command-line interface to SQL statement execution than
    the isql program included with Sybase — making it almost a must for server administration
    through an SQL shell. You can download both the source and binary packages from
    this URL.


    I recommend getting the binary package and installing it somewhere in your path.
    Once installed, you can use this to connect to the database from the command line
    instead of isql. This program provides many feature improvements over isql, including:


    +   - Command completion and command line editing

    - Variables

    - Redirection

    - Backgrounding

    - Job control

    - History


    # Development Libraries


    The other client software packages that I recommend development libraries. They
    provide the “glue” that connects software that you develop to the Sybase server.
    Sybase 11.0.3.3 ships with a copy of the Open Client Library for C, but if you
    are not developing in C, you will need these alternative libraries.


    Perl development provides quick and powerful scripts to be written to alter items
    in the database. There are currently two interfaces to Sybase-'
