    # FAQs


    +   Q: How do you make a numeric column in Sybase that automatically increments?


    +   A: Sybase uses IDENTITY columns for this purpose. The syntax for creating
    an identity column is: CREATE TABLE <tablename> (< table_id NUMERIC(<size>),0
    IDENTITY). These columns are usually used to ensure that there is a primary key
    on the table, so this column can also be specified as the primary key. See the
    earlier section "Issues," about Identity Columns to some of the issues surrounding
    use of Identity columns.


    +   Q: I just want a small database—do I really need to devote two entire drives
    to it?'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# 236 Chapter 5 • Installing and Utilizing Sybase on Linux


    A: No. It is recommended from a recovery standpoint that your transaction logs
    and data actually exist on different physical media in the event that one of the
    physical media devices fails. If you have a small database and are willing to
    take the risk of device failure, then you can certainly put both your transaction
    log and data on the same device. In fact, you can specify your database devices
    to be files in your files system if you don''t want to devote entire unformatted
    partitions to them.


    +   G: My indexes on my tables don''t appear to be working anymore. What happened?


    A: Sybase does not rebuild indexes every time you insert new data into a table.
    The query optimizer for Sybase has the tough job of deciding whether or not a
    table''s index is sufficiently up to date or whether a table scan be faster. If
    you have tables for which the data is changing or being added quite often, then
    you should have Sybase periodically rebuild the indexes on those tables. This
    can be accomplished by running the update statistics `<table>` command in `isql`.


    +   G: My transaction log fills up my entire database device and my inserts fail.
    How can I stop this from happening?


    A: Sybase writes an entry in the transaction log for every transaction that you
    execute on the database. In the case of large data using `INSERT`, `UPDATE`, or
    `DELETE`, you may fill up the transaction log device, causing the actual command
    to wait in the background until enough transaction log room is free to continue
    the command. To continue this, log into the database as the `sa` user and dump
    the transaction log for the offending database (you may have to specify with the
    `no_log` setting if the log is really full). This will not dump any running transactions,
    so if these changes are large transaction (e.g., `DELETE FROM <table>` on a long
    table) it is possible that this action will never be completed because there is
    not enough room in the transaction log to write this entire transaction entry.
    If this is the case, break the transaction down into smaller chunks and execute
    each chunk, then dump the log.


    +   G: But isn''t there a way just to dump the transaction log automatically?


    A: Yes. Sybase provides the ability to truncate the log whenever it does a checkpoint.
    A checkpoint is Sybase''s period check to see if the data in the data device is
    consistent with what it should be. This happens every couple of seconds. You can
    indicate that Sybase should dump the transaction log when this happens by executing
    the following command as `sa` in the master database:


    ```

    sp_dboption <dbname>, trunc, true

    ```'
