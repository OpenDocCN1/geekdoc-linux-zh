    # tempdb


    Sybase uses a database called tempdb for all of the temporary tables that it uses
    to produce complex queries such as group by, order by, and joins. This database
    is in the default configuration of Sybase SQL Server, a 2MB database on the master
    device. I found this database to be too small (have gotten out of space) and too
    slow. Many people recommend putting this database on a RAM disk so that it is
    very fast and can be larger than 2MB.


    Red Hat 6.1''s default kernel has the RAM disk size set as 4MB. If you want to
    have a tempdb on a RAM disk larger than 4MB, then you will have to edit your /etc/lilo.conf
    file and add the following line to the section under your booting kernel, and
    execute the lilo command to reinstall LILO.


    ```

    append="ramdisk_size=<size in KB>"

    ```


