  md: '# Introduction


    Every computer system in the world needs a database to store and retrieve information.
    The primary reason you use the computer is to store, retrieve, and process information,
    and to do all these very quickly, thereby saving you time. At the same time, the
    system must be simple, robust, fast, reliable, economical, and very easy to use.
    A database is the most vital system, because it stores mission-critical information
    of every company in the world. Industries like telecom, automobile, banks, airlines,
    will not function efficiently without a database system. The most popular database
    systems are based on the International Standard Organization (ISO) SQL specifications
    and ANSI SQL (American) standards. The current specifications widely used in the
    industry are ANSI/ISO SQL 1992/98. Without a standard like ANSI/ISO SQL, it would
    be very difficult to develop an application once, and run it on all the database
    systems. An end user wants to develop an application only once, using SQL, ODBC,
    JDBC, and then be free to deploy it on all variety of database systems.


    PostgreSQL is the most advanced open source object relational database in the
    world. PostgreSQL, developed originally in the UC Berkeley Computer Science Department,
    pioneered by many of the object-relational concepts. It provides SQL92/SQL3 language
    support, transaction integrity, user-defined functions, stored procedures, triggers,
    and type extensibility. PostgreSQL is a free and open-source descendant of this
    original Berkeley code. Millions of PostgreSQL databases are installed as database
    servers. Web database servers, and application database servers. It is a very
    sophisticated object relational database system (ORDBMS).


    PostgreSQL runs on Solaris, SunOS, HPUX, AIX, Linux, Irix, Digital Unix, BSDi,
    FreeBSD, SCO UNIX, NEXTSTEP, Unisware, and almost all flavors of Unix. A port
    to Microsoft Windows NT has been done using the Cygnus cywin32 package.


    +   - Title: PostgreSQL RDBMS Database (Object Relational Database Management
    System)

    - Current Version: 7.0

    - Age: In development since 1985, PostgreSQL is now 15 years old.

    - Authors: PostgreSQL was developed by millions of people in universities and
    companies on the Internet for the past 15 years.


    MySQL is another open-source, quasi-commercial database system, but it supports
    important features like transactions.'
