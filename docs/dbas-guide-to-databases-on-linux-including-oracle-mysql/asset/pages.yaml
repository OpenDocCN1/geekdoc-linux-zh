    ```

    oracle:/u01/app/oracle/product/8.0.5:Y

    ```


    A run-level is a logical state used to define a configuration. A system in run-level
    3 might have different processes running than in run-level 4. A Red Hat system
    usually runs at run-level 3 or run-level 5. Run-level 3 is considered full multi-user
    mode, and run-level 5 provides an Windows login screen. Under Red Hat Linux, run-control
    scripts are stored under /etc/rc.d/. Symbolic links are created under ../rc0.d,..rc1.d,..rc2.d
    ..rc4.d ..rc6.d depending on what run-level action should take place. The symbolic
    links start with S or K, depending on whether they should be started or killed,
