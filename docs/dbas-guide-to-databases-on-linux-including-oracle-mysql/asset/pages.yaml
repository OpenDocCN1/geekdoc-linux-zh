    # Starting


    Smaller sites often use scripts that automatically detect the state of the database
    and bring it up when the first user attempts to access it. Sometimes they bring
    it down automatically when the last user exits. Although convenient, there are
    several possible pitfalls to this approach. Such a script should never delete
    the .lk file. If Progress is telling you that a lock file exists you need to take
    message seriously and understand why it is in there. It could be that another
    user has, unknown to you, started a legitimate single-user session (perhaps to
    perform-database maintenance). Deleting the .lk file and then accessing the database
    will result in two sets of processes, potentially updating the database simultaneously
    without awareness of one another—a situation that would obviously lead to disaster.


    Another downside to this approach is that it makes it difficult to gain exclusive
    access to the database for maintenance or recovery windows. It is good practice
    to separate database server startup from user session startup and to institute
    a set of standard controls that are respected by all scripts so that you can safely
    administer the database when need be. One very helpful technique is to use a flag
    to gate access to user sessions like so:


    ```

    # Start server

    #


    /mnt/scripts/env

    ```


    ```

    # Start something and verify it


    str()

    {

    CMD=$1

    USR=$2

    GTX=$3

    WHO=$4


    msg "Starting: $1"

    $CMD >> $LOGS/start.log

    sleep 5

    ```'
