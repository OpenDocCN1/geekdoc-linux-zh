  md: '# Accessing a Database


    Once you have constructed a database, you can access it by:


    +   - Running the Postgres terminal monitor program (psql), which allows you to
    interactively enter, edit, and execute SQL commands


    +   - Writing a C program using the libpq subroutine library. This allows you
    to submit SQL commands from C and get answers and status messages to your program.
    This interface is discussed further in the PostgreSQL Programmer''s Guide.


    You might want to start up psql to try out the examples in this manual. It can
    be activated by the dbname database by typing the command:


    ```

    % psql dbname

    ```


    You will be greeted with the following message:


    Welcome to the Postgres interactive sql monitor:


    ```

    type \? for help on slash commands

    type \q to quit

    type \g or terminate semicolon to execute query

    ```


    You are currently connected to the database: dbname


    ```

    dbname=>

    ```


    This prompt indicates that the terminal monitor is listening to you and that you
    can type SQL queries into a workspace maintained by the terminal monitor. The
    psql program responds to escape codes that begin with the backslash character
    (\). For example, you can get help on the syntax of various Postgres SQL commands
    by typing:


    ```

    dbname=> \h

    ```


    To get out finished entering your queries into the workspace, you can pass the
