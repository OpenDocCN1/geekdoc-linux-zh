    you can simply move to the next field or correct them as needed.


    # Hostname


    The hostname is just a reference for this machine and is not necessarily the same
    name used to reference this host from anywhere else on the network. Name resolution
    is the act of changing a name to an IP address. Linux uses the /etc/hosts file
    and DNS... but the local naming scheme is neither shared nor specific; every other
    machine can use any name it wishes locally for the IP address of your machine.
    When you use a central service like DNS you are restricted to a specific name,
    and this can be circumvented. In summary, this hostname does not have to be unique
    on the network, but it should be if you are using DNS.


