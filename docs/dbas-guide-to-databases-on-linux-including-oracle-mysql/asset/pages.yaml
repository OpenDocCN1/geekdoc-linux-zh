    # Client/Server Mode Setup

    If your only access is through Telnet terminal emulation, you are what known as
    a self-service client, and there are no additional steps needed. Client/Server
    mode is not the same as using Telnet to access the Linux machine. If your users
    are going to access the database in Client/Server mode, an additional file must
    be edited. Progress requires the TCP/IP address of the machine and a dedicated
    TCP/IP port for each database accessed over the network. The IP address of the
    machine should already be set during the /etc/hosts setup of the machine. To reserve
    the TCP/IP port(s), edit /etc/services. Each line has the form:


    ```

    name 1000/tcp

    ```


    Create one line for each database, replacing name with a unique identifier for
    each database. You can use the database''s actual name for the identifier so it
    is easy to identify. Choose port numbers above the last one currently in use,
    and leave at least 500 between each port. This port is not actually the only one
    used, and through Progress'' port assignment scheme, conflicts can sometimes occur
    if the port numbers for multiple databases are too close. Only a TCP port is needed;
    the database part of Progress will not use UDP.


    # Configuration


    Configuring a Progress database is not at all difficult. There are several decisions
    that must be made, and then the actual database is ready to be created. First,
    we focus on the directory structures Progress uses, and then we discuss the implications
    of disk space versus disk speed.


    # Directory Structure


    Configuring a directory structure for a Progress database is an important part
    of preparing to deploy an application. Of course you could just dump everything
    into a single ugly directory and not worry about it. This is a solution that is
    not only ugly, but one that leads to an administrative'
