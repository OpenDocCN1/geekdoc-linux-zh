  md: '# Detailed Installation


    This section is the detailed explanation of each one of the steps in the section
    "PostgreSQL Quick-Install Instructions."


    Insert the latest Red Hat CD-ROM into the caddy and log in as root. Give the following
    commands at the bash prompt:


    ```

    # mount /mnt/cdrom

    ```


    This will mount the CD-ROM from the directory /mnt/cdrom. Now change to the directory
    where all the RPMs are located:


    ```

    # cd /mnt/cdrom/Red Hat/RPMS

    ```


    You need to know some basics about the RPM packages and the Linux command rpm.
    To see online documentation that explains the options and usage of rpm, issue
    the following command:


    PostgreSQL RPMs are generally named as postgresql-aaa-x.x.x-r.rpm, where aaa is
    the package, like jdbc or server; x.x.x is the version number, like 7.0.0; and
    r is the package release, like 1, 2, 3, and so on. To see the list of PostgreSQL
    RPMs:


