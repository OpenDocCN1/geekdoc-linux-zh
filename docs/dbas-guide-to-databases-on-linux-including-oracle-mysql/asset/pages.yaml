    need to add index.php3 to DirectoryIndex in Apache’s httpd.conf. Alternatively,
    you could create an HTTP refresh page named index.html and have it immediately
    transfer the browser to index.php3.


    # PHP Database Connectivity: Making the Connection


    In the function connect_db(), we connect to the database server and select the
    database we plan to use. To make it easy to port this application to another database
    server, we have separated the variables into init_db_variables().


    ```

    MYSQL_CONNECT($db_server, $db_username, $db_password) OR DIE("Unable to connect
    to database");

    ```


    ```

    @MYSQL_SELECT_DB("symetix") or die("Unable to select database");

    ```


    # Reading Data from the Database


    In browse_column(), there is a simple example of reading data from the database:


    ```

    $result=mysql_query("SELECT * FROM items WHERE category_id=$category_id");

    $num_results=mysql_num_rows($result);

    ```


    In the first statement, we run a simple SQL SELECT statement against the items
    table. The results are stored in the $Result variable. In the second statement,
    we are taking a count of the results we received.

    $row=mysql_fetch_array($result);


    In this statement, we are extracting the first record that was in our result set.
    We can then extract each field from that record using the following command:

    $item_id=$row["item_id"];'
