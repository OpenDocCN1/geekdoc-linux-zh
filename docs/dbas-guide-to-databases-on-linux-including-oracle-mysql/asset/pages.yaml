  md: '# Multiple Swap Partitions


    Swap is where the system puts certain memory-resident process sets when RAM becomes
    full. You need it for the system to work properly you really do not want the system
    to use it because it is incredibly slow compared to RAM. It is there for emergencies
    when your RAM is overwhelmed, and it is fine for occasional usage. Steady use
    is a clear indication that you do not have enough RAM. Upgrade immediately if
    you detect or notice extensive use of swap space. Since any disk activity is improved
    by spreading the requests over multiple disks or controllers, the same goes for
    swap space—spread it out to improve performance and spread the load out to all
    disks


    # Delete a Partition


    You would delete a partition if you were starting with a machine that may already
    have had an operating system on it. If you want to start fresh, that is, you do
    not need to keep this OS, then delete every partition if you want to keep the
    old OS and add Linux to some free space or reuse a disk partition that is free
    to use, you should delete the old partition first.


    You can delete any currently existing partition on any disk at this point within
    Disk Druid. Select the partition in the upper box and then click Delete and confirm
    the action.


    # Edit a Partition


    You can change a partition parameter setting at a later time if desired by using
    the Edit option.


    # Add a Partition


    Click the Add button to add a new partition. You will need to do this for each
    partition you want to set up. If there is more than one physical disk, you should
    select the specific disk in the lower box first.


    # Partition Mount Point


    When you click Add, you are presented with a parameter setting screen. There are
    four parameters to set. The first parameter is the mount point. Unlike DOS-based
    systems that define a drive letter for each partition (currently, this is changing
    in Microsoft Windows 2000), in UNIX and Linux, there is one file system that uses
    directory names to connect them together. These directories are called mount points.
    UNIX has had some historical mount points that Linux has continued with. You can
    either enter a directory name of your choice or pick from one of the preconfigured
    directory names in the drop-down list. Figure 2.6 shows the precon-'
  merge: -1
