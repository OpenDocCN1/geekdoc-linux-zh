  md: '# FAQs


    Q: I have a really old disk, should I use that?


    A: No, avoid it. In many cases, old disks do not use the advanced IO features
    of the motherboard and will slow down your machine considerably.


    Q: I was told you can run Linux from Windows; is that true?


    A: Yes, there is a very clever product called VMware (www.vmware.com) that allows
    you to use almost any operating system (like NT or Linux) as the host OS, into
    which you can install one or more additional virtual OSs (like Win9, NT, and Linux).
    The screen shots used in this manual were obtained during an installation of Linux
    onto a host NT 4.0 machine with all drives already FAT and NTFS formatted. VMware
    created a virtual disk on one of the FAT volumes that just happened to have 1.8GB
    free. A full installation of Red Hat Linux in which six simulated partitions were
    created, as shown in the figures used earlier, used 1.3GB of the FAT partition
    (probably compressed format) for the virtual disk. Note: The recommended hardware
    is at least 266 MHz PC with 96MB RAM, and like all recommendations, this is low.
    Get more RAM and more horsepower if you can, or be prepared to go slowly through
    the molasses of installation (16 hours on a 166 MHz with 64MB RAM).


    Q: Why choose Red Hat?


    A Red Hat is a good choice because it is the most widely known, provides full
    support and training services, and is the market share leader.


    Q: Is support important?


    A: That depends. You can pay some support organization for their time or, if you
    have support staff, you can upgrade the skills of your staff about the same fees.'
