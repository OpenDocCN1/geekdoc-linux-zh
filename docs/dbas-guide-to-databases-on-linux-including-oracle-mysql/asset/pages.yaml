  md: '# Parameter File Configuration


    Oracle uses a file called the initialization parameter file during startup. The
    file is named initSID, and is simply referred to as INIT.ORA. Replace SID with
    $ORACLE_SID. In Oracle8 the file is located under /u01/admin/$ORACLE_SID/file.
    In Oracle8i, the file is located under /u01/app/oracle/$ORACLE_SID/file. The initialization
    file can include parameters to optimize database performance, set defaults, set
    limits, and specify filenames. The parameters that define the SGA memory structures
    are located in the INIT.ORA file. The default INIT.ORA file that is installed
    in a new database includes three basic settings labeled SMALL, MEDIUM, and LARGE.
    The medium and large settings are usual commented out. Depending on the amount
    of RAM installed, the parameters can be increased. It is beyond the scope of this
    chapter to describe the vast variety of initialization options. All that I can
    recommend to start out with the default settings. One parameter that should be
    changed is the date format. The standard output for dates in the Oracle server
    appear with two-digit years; for example, 10-APR-99. To see four-digit years,
    the nls_date_format in the INIT.ORA file should be added. Edit the INIT.ORA and
    add the following:


    ```

    nls_date_format = "YYYY-MM-DD";

    ```


