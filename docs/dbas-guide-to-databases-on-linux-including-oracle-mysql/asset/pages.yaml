  md: '# For Managers


    # MySQL Versions, Licensing, and Support


    MySQL is an open-source package, which means that the source code to the database
    and relevant tools are freely available. This is immensely powerful for many reasons.
    One is that if there are any problems with the database, they may be able to be
    fixed by competent developers are on hand. Open source software is also being
    constantly upgrade. This brings the user the latest and greatest features of the
    database, but it can also add an extra burden of management. Keeping up with the
    latest version and relevant environment of libraries and tools in the support
    environment can be a bit much at times. Even though versions are constantly changing,
    you do not have to constantly upgrade Once you have a distribution in server up
    and running, you do not have to upgrade as soon as the next version appears, especially
    if all the functionality necessary in your application exists. It is better to
    wait for few revisions after the next release. Keep up-to-date on the latest features
    being added; if the feature is something that is necessary for the application,
    it might be worth upgrading right away. Also, if a feature you are currently using
    has a bug or related problem, upgrading sooner to alleviate the problem is advised.


    MySQL requires no license for usage, even in commercial applications. If you use
    the server along with other services, charge for installation of MySQL or include
    MySQL in a distribution that charges for usage, you will require a license. The
    license is required for CPU; in case of multiple CPUs, it still counts as a single
    CPU. The latest prices can be found at http://www.mysql.com/Manual_chapter/Licensing_and_Support.html#
    As of this writing, One CPU is $200, with discounts of $10 to $50.


    If you benefit from using MySQL either in commerce or other applications, they
    ask that you buy a support license to help further the development. The support
    is separated into four different types: basic e-mail, extended e-mail, login support,
    and extended e-mail support. The basic starts at EURO 170, extended e-mail at
    EURO 2000, and extended login support at EURO 5000.


    Continued'
