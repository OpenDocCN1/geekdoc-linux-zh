- img_proc: true
  md: '# Extent


    An extent is the smallest unit of storage in an Oracle database. An extent is
    made up of one or more file system blocks. For example, an ext2 file system is
    usually 2048 bytes per block, but can be set to 1024, 2048, or 4096 bytes per
    block. An extent can be configured to be one or more ext2 blocks, depending on
    how the database will be used.


    # Segment


    A segment is the physical representation of an object and is made up of one or
    more extents. A single table is an example of a segment.


    # Control Files


    When the database starts up, it references a binary file called the control file
    to find the location of data files and the online redo logs. The control file
    is updated continuously while the database is running and must be available whenever
    the database is mounted or opened. The control file usually is mirrored across
    several devices. If any of the control files being used by the database becomes
    unavailable, then the database cannot function properly.


    # Redo Logs


    Redo logs store all changes made to the database buffer cache, with a few exceptions.
    They are used to minimize the loss of data and for database reconstruction. Oracle
    requires at least two redo log files, and sets of files are often mirrored across
    multiple devices. Their configuration and size can impact performance. It is common
    to store redo logs on their own devices, separate from data files. The redo logs
    are written to sequentially, unlike rollback segments, which exist in data files
    similarly to database objects.


    # Rollback Segments


    Rollback segments provide read-consistency by storing data that has been modified
    in the database, and are used to restore information after a rollback command.
    When a transaction begins to modify data in a table, the original data is copied
    to a rollback segment. If a second transaction needs the same data, and the first
    transaction has not committed the new data, Oracle will retrieve the data from
    the rollback segment.'
