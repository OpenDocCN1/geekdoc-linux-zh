    # Summary


    After researching all the available databases that are free, with available source
    code, it was found that only PostgreSQL is the most mature, most widely used and
    robust RDBMS SQL free database (object relational) in the world.

    greSQL is very appealing because a lot of work has already been done. It has ODBC
    and JDBC drivers; using these makes it possible to write applications independent
    of the databases. The applications written in PostgreSQL using ODBC and JDBC drivers
    are easily portable to other databases like Oracle, Sybase, and Informix, and
    vice versa.

    You may ask, why PostgreSQL? The answer is, since it has a lot more time to develop
    a database system from scratch, it makes sense to pick up a database system that
    satisfies the following conditions:


    +   ■ Source code is available (must be an Open Source Code system)

    ■ Has no license strings, no ownership strings attached to it

    ■ Can be distributed on the Internet

    ■ Has in development for several years

    ■ Satisfies standards like ISO/ANSI SQL 92 (SQL 89)

    ■ Can satisfy future needs like SQL 3 (SQL 98)

    ■ Has advanced capabilities


    And it just so happens that PostgreSQL satisfies all these conditions and is the
    appropriate software for this situation.'
