  md: '# G: How do I set up a pg group?


    A: Currently, there is no easy interface to set up user groups. You have to explicitly
    insert/update the pg group table. For example:


    ```

    jolly=> insert into pg_group (grname, grosid, grolist)

    jolly=> values (''posthackers'', ''1234'', ''{5443, 8261}'');

    INSERT 548224

    jolly=> grant insert on foo to group posthackers;

    CHANGE

    ```


    The fields in pg_group are:


    +   - **grname**: The group name. This should be purely alphanumeric—do not include
    underscores or other punctuation.

    - **grosid**: The group id. This is an int4, and should be unique for each group.

    - **grolist**: The list of pg_user ids that belong on the group. This is an int4[].'
