  md: '# Installing DB2 Universal Database Version 6.1 on Red Hat Linux • Chapter
    6 271


    # TIP


    > If you are planning on supporting any UNIX-based DB2 client that is using Network
    Information Services (NIS), and you are not using a name server on your network,
    you must update the /etc/hosts file located on your NIS master server.


    As a user with root authority, edit the client''s local /etc/hosts file and add
    an entry for the DB2 server''s hostname. For example:


    9.21.125.124 db2server # host address for the computer db2server


    +   where:

    - 9.21.125.124 is the IP address of the remote DB2 server.

    - db2server is the hostname of the remote DB2 server.

    - # denotes the start of a comment describing this entry.


    # TIP


    > If the server is not in the same domain as the client, you must provide a fully
    qualified domain name such as db2server.vnet.com, where vnet.com is the domain
    name.


    3. Update the local /etc/services file. If you are planning to set up communications
    between a DB2 client and a DB2 server using only the port number of the remote
    DB2 server, you can skip this step.

    Using a local text editor, as a user with root authority, add an arbitrary Service
    Name and the port number that matches the remote DB2 server''s port number to
    the DB2 client''s services file for TCP/IP support. For example:


    db2cdbdbinst1 50000/tcp # db2 client service name & matching DB2 server port


    +   - db2cdbdbinst1 is an arbitrary local name that represents the port number
    on the DB2 client.'
