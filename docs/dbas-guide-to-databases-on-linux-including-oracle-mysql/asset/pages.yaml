  md: '# Chapter 1 • The Linux Operating System


    exceeds any other competing products on the market. Various Linux versions have
    created alliances with major database servers to ensure optimal integration and
    performance. One such alliance has been created between Red Hat and Oracle and
    there are others; check the home Web site of any version for the particulars.


    # Servers and Workstations


    There is no real separation between a workstation and a server version, as Linux
    is still the same operating system when used in either capacity. However, Linux
    may be packaged and sold with those distribution assigned classifications; for
    example, TurboLinux Workstation version retails for less than the TurboLinux Server
    package. The only difference is how much and what type of software you get to
    install with it. A workstation usually means it includes the main Linux network
    services that pertain to a user and additional productivity applications like
    an office suite. A server version might not include these user productivity applications


    ![](img/4dc2950553fde871c28ea3e04a065356_45_0.png)


    # For IT Professionals


    # Odd Incompatibilities


    In one recent class, we were working with a few local machines. They contained
    a common network interface card (NIC) that was assumed to work with Linux. Sadly,
    all this NIC did cause frustration. A quick check of the NIC manufacturer corporate
    Web page gave us a glimmer of hope. The Frequently Asked Questions (FAQ) section
    provided a Linux-specific section with a helpful hint that required a download
    of their DOS Setup disk files. The site stated “This NIC works best when not in
    Plug and Play mode with Linux.” The setup utility, however, did not have any way
    to change this status on these particular NICs, though the NIC worked fine under
    Windows and NT. No amount of coaxing or begging helped. It was eventually replaced
    by a very old 8-bit NIC that worked fine on the first try. Just to show, that
    you never know for sure.

    The Web site did indicate that their newer NIC cards were indeed Linux-compliant,
    and that there were some Linux drivers available for them. Frankly, Linux is becoming
    another OS that hardware manufacturers are spending increased development time
    to ensure compatibility.'
