    the INIT.ORA or <SID>.ORA. The instance name (SID) is attached to the file name.


    # SID


    The system identifier represents a single instance. The ORACLE_SID environment
    variable represents the default Oracle instance. Throughout this document, the
    Oracle SID will be assumed to be ORCL. Since the SID is user-selected, and certain
    files utilize the SID as part of the filename, you will see <SID> written in documentation.
    It is recommended that the instance name be four or less characters.


    # $ORACLE_HOME


    The ORACLE_HOME environment variable is used to identify a particular installation
    of Oracle. (It is possible to have multiple versions of Oracle installed.) The
    ORACLE_HOME environmental variable can be changed to point at different versions.
    Throughout this document, ORACLE_HOME will represent the actual directory structure
    where Oracle is installed. Oracle8 is usually installed under /u01/app/oracle/product/8.0.5,
    and Oracle8i is commonly installed under /u01/app/oracle/product/8.1.5.


    # $ORACLE_BASE


    The ORACLE_BASE environment variable is used to identify the base of the Oracle
    installation tree.


    # Version Identifiers


    Oracle has a five-number version identifier. The first number is the major release,
    the second number is the minor release, the third number is a code release by
    the engineering group, and the fourth and fifth numbers refer to a patch set.
    The first two or three numbers make up an individual product. For example, Oracle8i
    is version 8.1.5. A patch set might bring Oracle8i up to 8.1.5.0.2. The farther
    a digit is to the right, the less significant the change.


    # PL/SQL


    PL/SQL is an Oracle procedural language that extends SQL by adding application
    logic, including block structured procedural constructs. PL/SQL is used to write
    applications that can manipulate data in the database.'
