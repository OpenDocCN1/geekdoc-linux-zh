  md: '# Running Progress


    The typical daily process of running a Progress database generally is not a full-time
    job. Usually some initial script writing is done for the database startup, backup,
    and shutdown scripts. Afterwards the most time is spent on gathering data to insure
    the optimal performance of your system. Many Progress-based systems run for years
    without any attention from a DBA.


    # Managing the Database


    PSC provides simple scripts for starting, stopping, monitoring, and backing up
    the database. Although these are generally adequate for an initial development
    environment, a more sophisticated or customized approach is usually desired for
    production work.


    A helpful first step is to create a small environment script that contains all
    the commonly used Progress and application-related environment variables in a
    single script that can then be "dotted" or "sourced" in scripts that they need.
    For instance:


    ```

    # Common Environment Script

    # To use:

    # . /mnt/scripts/env


    export TMP=/mnt/tmp

    export MTH=''date ''+%m''

    export DAY=''date ''+%d''

    export LOGS=/mnt/logs/$MTH.$DAY

    export SRV=''uname''

    export SCRIPTS=/mnt/scripts

    export DLC=/opt/progress/dlc83b

    export DBNAME=/mnt/db/sports

    ```


    ```

    # standard messaging routine

    msg()

    {

    MSG=$1; shift

    echo "MSG"

    echo ''date'' "$MSG" >> \$LOGS/start.log


    # If additional arguments were passed then the message to

    # those people (the names might be pager addresses)

    ```'
