  pgno: 359
- img_proc: true
  md: '# Installing and Managing Progress on Linux • Chapter 8 325


    mess down the road. A well thought-out and organized directory structure is essential
    to a well-run site. In general, create separate file systems for differently purposed
    bits of the database and application. That way you can map the file systems onto
    differently configured disks and tune file system options such as fs type, block
    size, RAID types, and when file systems become available many others to the purpose
    of the file system. To that end, the following structure in Table 8.1 should be
    considered:


    # Table 8.1 Directory Name Table


    | Directory Name | Purpose |

    |---|---|

    | /opt/progress/dlc83b | Establish distinct directories for each release of Progress—this
    makes updates, testing, and potential rollbacks much easier. |

    | /mnt/db | The .db, .st and .d extents all go here. This should be a striped
    and mirrored set of disks with a fs block size that works well with the db block
    size and with maximum reliability and recoverability options. |

    | /mnt/bi/ai | The .bi and .ai file systems should be on mirrored disks, not striped,
    with maximum reliability and recoverability file system characteristics. |

    | /mnt/logs | You should establish a file system for lg files and other monitoring
    data. Sweep daily logs into this file system nightly. It need not be mirrored
    or striped; plain old disks are fine. Create an archiving strategy that puts files
    in directories named yyyy.mm.dd so that you have a searchable history. Archive
    your .ai files in the same manner. |

    | /mnt/source/mnt/rcode/mnt/tmp/mnt/scripts | These file systems should be fast
    and reliable but need not be highly recoverable—striping and mirroring are appropriate.
    Full logging (a journaled fs currently unavailable for Linux) is not necessary
    since you can recover everything from backup, but reliability is important since
    user sessions may crash if the files stored on these file systems become unavailable.
    |


