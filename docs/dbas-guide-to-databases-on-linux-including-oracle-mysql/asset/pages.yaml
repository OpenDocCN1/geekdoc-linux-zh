    # Dbaccess


    One of the most important tools that comes with the engine is dbaccess. This is
    a character-based application that allows you to take a peek at the engine, database,
    and tables. It allows you to do queries against tables and to perform database
    maintenance on all the databases for a particular instance. Please read the documentation
    available for dbaccess in the Dbaccess Users Guide. When you run dbaccess, you
    get the following display:


    ```

    DBACCESS: Query-language Connection Database Table Session Exit

    ```


    Use SQL query language.


    Dbaccess is easy to use, and nicely in a VT-100 window. It offers an excellent
    scratch pad to work with your database. There are also GUI-based tools that Informix
    is developing and eventually will offer as part of the engine distribution.'
