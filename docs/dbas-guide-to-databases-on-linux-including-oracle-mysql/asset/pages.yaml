    # Access Control


    Once you have configured the privileges and the user- and hostnames of where you
    want to grant access, each connection will be evaluated to determine if it should
    be allowed. MySQL will look at the username and host first. When the connection
    is made, all the parameters are matched against the entries in this list. It will
    keep comparing them from the beginning until the end the first one is matched.
    If it is not matched, the request is denied. Make sure the list is sorted correctly;
    the database does not match cases, just the first one that comes to works.


    If the connection is allowed, the database will verify that you have access to
    the database(s) you are trying to access. It will then consult the db and host
    tables and match up your host with the database you are trying to access. Unlike
    the previous check, the database will consult the tables based on the type of
    access that is requested.'
