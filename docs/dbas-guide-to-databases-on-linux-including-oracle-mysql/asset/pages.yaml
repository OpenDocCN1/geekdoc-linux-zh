  md: '# Summary


    This section has provided you with a quick step-by-step GUI-based installation
    of a Red Hat system. Red Hat was used because it is the dominant Linux distribution
    on the market.


    +   - The first thing you need to do is have a fully thought-out plan and design
    so you can match the hardware to your needs.

    - You want to make sure you have compatible hardware, and hardware that is well-suited
    to the task of being a database server—preferably multicore CPUs, lots of RAM,
    and a fast underlying disk I/O subsystem with lots of disk space.

    - It helps to understand the partitioning concepts of Intel PC motherboards, the
    limitation of 16 partitions on an IDE type drive, and 15 partitions on a SCSI
    drive.

    - You need to be aware that partitioning your file system into smaller, easily
    managed parts is good and expected with most Linux and UNIX versions.

    - Critical partitions for the system are /, /usr, /var, /home, /usr, /opt, and
    swap, to name just a few.

    - The installation options you will be presented with may allow you to retain
    your current OS and dual boot with, and some options erase any other OS partitions.
    Production servers should generally be dedicated to Linux only, and should not
    use any non-Linux partitions.

    - The packages to install are numerous, and only necessary packages should be
    installed.

    - You should create the boot disk at the end of the installation.

    - You should not use this database server as a user workstation as well; it should
    be dedicated to the purpose of database services only for best performance.

    - System management tools vary considerably within Linux and UNIX in general;
    keep the supplied books handy.

    - It is highly recommended that you find someone who has previous Linux or UNIX
    system administration skills since Windows system administration skills are not
    easily transferable.


    If you have neither UNIX nor Linux experience, you have a whole new world to explore
    with hardware, software, and interfaces. Get in there and play, but use a test
    machine for that.'
