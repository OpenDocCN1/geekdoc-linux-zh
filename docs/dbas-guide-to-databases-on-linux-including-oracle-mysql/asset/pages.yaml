    Spikes in the results indicate interesting events—if the number of orders spikes
    then the business is busy and it might be reasonable for read and write response
    times to increase slightly. Big jumps in response times with or without corresponding
    jumps in business activity tend to indicate that there is a problem in the environment
    that needs to be addressed—it might mean, for instance, that another application
