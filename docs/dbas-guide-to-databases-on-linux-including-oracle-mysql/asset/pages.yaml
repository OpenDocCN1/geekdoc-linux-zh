    This will install files under /usr/local/postgresql/doc and /usr/local/postgresql/man.
    To enable your system to find the man documentation, you need to add a line like
    the following to a shell script file:


    ```

    PATH=$MANPATH:/usr/local/postgresql

    ```


    The documentation is also available in Postscript format. If you have a Postscript
    printer or if your machine is already set up to accept Postscript files using
    a print filter, to print the User''s Guide type the following:


    ```

    $ cd /usr/local/postgresql/doc

    $ gunzip -c user.ps.tz | lpr

    ```


    Here is how you might do it if you have Ghostscript on your system and are writing
    to a laserjet printer:


    ```

    $ alias gshp=''gs -sDEVICE=laserjet -r300 -dNOPAUSE''

    $ export GS_LIB=/usr/share/ghostscript:/usr/share/ghostscript/fonts

    $ gshp user.ps.gz

    $ gshp -OUTPUTFILE=user.hp user.ps

    $ gzip user.ps

    $ lpr -l -s -r webpage.hp

    ```


    If in doubt, confer with your manuals or your local expert. The Administrator''s
    Guide should be your first reading if you are completely new to PostgreSQL, since
    it contains information about how to set up database users and authentication.


    Usually, you will want to modify your computer so that it will start the database
    server automatically, whenever it boots. This is not required; the PostgreSQL
    server can be run successfully from unprivileged accounts without root intervention.'
