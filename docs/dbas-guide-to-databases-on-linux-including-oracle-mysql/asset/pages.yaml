  md: 'Let''s start changing the password for the root user in the database.

    This is done as follows:


    ```

    shell /my/path/mysql/bin/mysqladmin -u root password ''new-password''

    ```


    Also, make sure that any new users are created in the database

    passwords.


    Another way to set up MySQL to be secure is to run it as only

    user. Running the daemon as a new user and setting all the file permis-

    s to that user will prevent tampering by other users and make it more

    secure. Also, not running the daemon will prevent attempts by

    crackers to attack the daemon to get root privileges.


    If you installed the Red Hat RPM, this part of the configuration is

    done for you. If you installed the binary or source distribution, you need

    to complete some further steps.


    A user should be created for the database to run as, as mysql.

    This can be added to the password file using adduser.


    ```

    shell $/usr/sbin/adduser mysql

    ```


    Once an entry has been made in /etc/passwd for this user, it can be

    edited to the correct database directory (/my/path/mysql/var)

    along with the appropriate shell (default is none).


    This user should own all of the files. You can do this with chmod


    ```

    shell$ chmod -R mysql /my/path/mysql

    ```


    You can also make sure that this new user has write permission


    ```

    shell$ chmod -R go-w /my/path/mysql

    ```


    which will set all files in /my/path/mysql to be owned by this user.

    Make sure that only this user mysql has the privilege to write to these

    files.


    MySQL also has runtime options to run more securely:


    +   - secure Does a reverse lookup on the IP addresses and makes

    they are not forged. This will add an extra layer of

    protection from requests coming from the outside that are trying

    to change their remote address to bypass any restrictions.

    - skip-networking Allows only connections on the local machine

    and not over the network. This is another good option if the

    machine on which the database runs is not protected by a

    firewall.


    Please see the MySQL documentation for further security enhance-

    ments to the MySQL daemon for protection.'
