  md: '# Chapter 3 Installing and Running Oracle on Linux


    You may not have the same set of processes running on your machine. There are
    five Oracle processes you are almost guaranteed to have running: the database
    writer, log writer, system monitor, monitor, and the checkpoint process. Notice
    that each process is preceded with ora and each ends with the instance name. The
    database writer (DBW0) is responsible for writing changed data to the physical
    data files. When data is changed, it is placed in the database buffer cache. During
    intervals the database writer writes dirty buffers from the data-buffer cache
    to the database files. The database writer must ensure that sufficient numbers
    of free buffer are available in the database cache. Database performance is improved
    since changes are made to a memory buffer rather than disk. Multiple database
    writer processes can be started to improve performance, although one is usually
    sufficient. The log writer (LGWR) records changes registered in the redo log buffer
    to the redo files. The log writer performs sequential writes to the redo log file
    under the following circumstances: when the redo log buffer is one-third full,
    when a timeout occurs (every three seconds), when a transaction commits, and before
    the database writer modifies blocks in the database buffer cache to the data files.
    The system monitor (SMON) checks for database consistency and initiates recovery
    of redo when the database is opened. The process monitor (PMON) cleans up resources
    for failed processes. The checkpoint process (CKPT) is responsible for updating
    the database status whenever changes in the buffer cache are permanently recorded
    in the database.


    Optional processes include the archiver, recoverer, dispatcher, and the shared
    server process. The archiver (ARCn) copies the online redo logs to archival storage
    when they are full or a switch occurs. Archiving redo logs is an important database
    protection strategy. If the database crashes and datafiles are lost, you can use
    the backups to restore the database to a certain point-in-time state, and then
    use the archived redo logs to bring the database further forward in history. If
    the database is in archive log mode and the archiver cannot find space to archive
    redo log, all database transactions will be halted. The recoverer (RECO) is used
    in a distributed database configuration to resolving transactions possibly caused
    by network or system failure. The dispatcher (Dnnn) is used in multithreaded server
    configurations. The dispatcher routes requests from each user process and back
    to the user process. There is at least one dispatcher for each communication protocol.
    The shared server process (Snnn) is used in a multithreaded server configuration
    to serve client requests. There are three additional processes you are unlikely
    to see right away, which include the lock process (LCK0), job queue (SNPn), and
    the queue monitor (QMnn).'
  merge: -1
