    # Run Environment


    There is a really in-depth description of tuning Sybase SQL Server included in
    the docs RPM package as well as Sybase''s document Web site http://sybooks.sybase.com/.
    There are a couple of topics that I feel absolutely must be addressed in this
    chapter, however, will drastically improve your performance and reduce your headaches
    with Sybase SQL Server on Linux.


    # Sybase Memory Usage


    You must tell Sybase how much of the system memory that it should use. By default,
    it uses only 16MB of memory for its internal caches and data. You will get far
    better performance if you make this number quite a bit larger. The basic rule
    is to subtract the amount of physical memory that you need to run the other processes
    that are going to be running on this machine (hopefully few) from your total physical
    memory. This amount is the amount that you should give to Sybase. Be careful that
    you do not use too much memory for Sybase, otherwise Linux will be forced to drop
    something to disk swap when it runs out of physical memory. This will absolutely
    kill the performance of a database server.


    You can specify the amount of memory that Sybase should try and get with the ''total''
    line in the SYBASE.cfg file in the /opt/sybase directory. The number you set here
    is the number of 2KB blocks that Sybase should use for its shared memory.'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Installing and Utilizing Sybase on Linux • Chapter 5 231


    There is one slightly sticky problem with setting this value. Sybase was developed
    to run on SMP machines, and thus it allocates this large chunk of memory shared
    when it is started. each of its individual processes (on each processor) can access
    its memory. Linux, in its default configuration, does not allow for shared memory
    segments to be larger than about 32MB in size. Fortunately with the advent of
    the Linux 2.2.x kernel, this default can be changed at boot type through the /proc/sys
    file system. To specify the largest shared memory segment that Linux will allow,
    execute the following command:


    ```

    echo 134217728 > /proc/sys/kernel/shmax

    ```


    This will increase the maximum shared-memory segment size to 128MB. The theoretical
    maximum that Linux allows 1GB.


    # NOTE


    Setting shared memory this high takes away precious address space on servers with
    more than 2GB of RAM; use of true 64-bit hardware is recommended.


    You will have to add this to your rc scripts somewhere so that this will happen
    on boot so the sybase server is started. I recommend adding it to your /etc/rc.d/init.d/sybase
    script so that it reads something like:


    ```

    start()

    echo -n "Setting Shared Memory Max to 128MB ... " \

    echo 134217728 > /proc/sys/kernel/shmax

    echo "done"

    echo -n "Starting Sybase ASE ... " \

    (cd $(SYBASE)/install; \\

    unset LANG; unset LC_ALL; \ \

    for run_server in RUN*; do; \

    su -c "startserver -f $(run_server)\ sybase >/dev/null 2>&1; \\

    echo -n "$(run_server)"; \\

    done

    echo

    ;;

    ```


