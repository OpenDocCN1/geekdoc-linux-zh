    # Concepts


    Before diving into installation details, certain concepts need to be understood.
    Database usage is often divided into three categories: Online Transaction Processing
    (OLTP), Decision Support System (DSS), and Hybrid. OLTP is characterized by short
    database queries and updates, such as an airline reservation system. Decision
    Support Systems are characterized by long running queries, such as gathering information
    about weather patterns. A Hybrid system application would include a mix of the
    two; for example a Web-based brokerage application might take orders (OLTP) and
    provide research information (DSS). The three classifications provide a basic
    understanding of how the database must be designed and configured.


    There is an important distinction between an Oracle database and an Oracle instance.
    The database, identified by the database name (DB_NAME), is composed of the physical
    files used for storage. An instance, identified by the system identifier (SID),
    is composed of the memory structures and processes to fulfill user requests. When
    an Oracle server is shutdown, the instance ceases to exist. The primary reason
    are differentiated because a single database can be serviced by multiple instances.
    The database and instance are composed of many components. Memory structures include
    the system global area, shared pool, database buffer cache, redo log buffer, and
    program global area. Logical structures include tablespaces, schemas, extents,
    roll-back segments, tables, and indexes. Physical components include data files,
    control files, redo logs, and parameter files.


    # System Global Area


    The memory structures of an Oracle instance are contained in a memory region called
    the System Global Area (SGA). The SGA is allocated in virtu-'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Chapter 3 • Installing and Running Oracle on Linux


    al memory when the Oracle server process resides. The SGA comprises several memory
    structures including the shared pool, database buffer cache, and the redo log
    buffer. Many processes share the SGA.


    # Shared Pool


    The shared pool contains two components, the library cache and the data dictionary
    cache. The library cache stores the most recently used SQL statements and their
    execution plans. The data dictionary cache stores the most recently used data
    dictionary information as table definitions, usernames, and privileges. The size
    of the shared pool can affect performance of the database, especially in the OLTP
    environment.


    # Database Buffer Cache


    When an SQL query is submitted by a user, the server process looks in the database
    buffer cache for data blocks to fulfill the request. If the blocks are not found
    in the database buffer cache, the server process must read the blocks from a physical
    device, and places a copy of the data in the buffer cache. Subsequent requests
    for the same blocks are likely to be in memory, and may not require physical reads.


    # Redo Log Buffer


    All changes to data are stored in the redo log buffer, and are later copied to
    the physical redo redo log files.


    # Program Global Area


    The program global area (PGA) is a memory region that contains data for a single
    server process. When used in a dedicated server configuration, the PGA contains
    a sort area, session information, cursor state, and stack space. PGA is allocated
    for a process when it is started and deallocated when the process is terminated.


    # Tablespace


    A database is divided into logical storage units called tablespaces. A tablespace
    is used to group related logical structures together, and can be represented by
    one or more physical files. It is common practice to group certain types of objects
    within a tablespace. Examples might include temporary tables, rollback segments,
    or data dictionary tables.


    # Datafile


    Each tablespace can have one or more datafiles, the actual physical files stored
    on the file system.'
  merge: -1
