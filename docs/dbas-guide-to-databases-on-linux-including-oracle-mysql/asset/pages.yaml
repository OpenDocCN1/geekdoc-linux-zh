  md: '# Considerations Before Upgrading or Migrating


    Updating a large user client base will take resources and time. No matter how
    you try to tackle it, it will be a major undertaking. You will need to take into
    account the current state of your network, network cabling, and network bandwidth
    to ensure that proper performance specifications are met. Training users will
    be required only if their current application or applications are from a completely
    different database server type.


    If the database server product is not going to change (for example, it remains
    Oracle, just on a new platform), then the applications should not have to change.
    If this is a new database server service, as in a migration from Access or Dbase
    to Oracle or Informix, then there will be a lot of training involved for the new
    interface and associated applications.


    If you have to migrate legacy databases to this new service, you will need to
    retrain users accessing the relocated data with the new interfaces. Retraining
    users for any new or upgraded product will require resources. This is just part
    of any new development or improvement project. Other resources to consider include
    the database administration itself, user development tools, interface development,
    additional network bandwidth requirements, and ongoing support and help services.


    # For Managers


    # Cheap Is Still Cheap


    A test system purchased a year ago that was just behind the leading edge at the
    time had a complete power supply failure one year and one month after going into
    continuous but very light-duty service. The warranty was one year. The replacement
    part retails for $30 but the aggravation of being down for one day was not worth
    the small savings for the cheap power supply used in the tower box.


    In comparison, the older 200 MHz machines, which have been in continuous service
    for over two years have not had a power failure yet, nor have the many 100 MHz
    workstations purchased five years ago. You get what you pay for and there is a
    reason why the big, name-brand companies are selling server-style hardware—it
    is designed to last longer. It is a niche market and hence fewer are built, so
    the price is higher. Be prepared to purchase server quality products.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Hardware Compatibility


    The first consideration should be hardware compatibility, availability, and the
    time needed to research the compatibility issues. You can usually check for hardware
    compatibility information at the main Web site of each of the distributions illustrated
    in Table 1.2, earlier. In general, older is better in most cases. Extremely and
    seemingly "outdated" hardware can be used for general purposes like e-mail, routing,
    firewall, and print services, but the support issue of older hardware for replacement
    parts must be weighed against the relative cheapest of last year''s model of computer,
    often an excellent choice to run Linux. Linux has less overhead as an operating
    system and should provide more bang for the buck in optimizing older hardware.


    In most cases, your database server will be dealing with mission-critical data.
    You want to put the best hardware you can without having to deal with finding
    drivers for the very latest hardware designs. You also want reliable hardware
    that will survive the rigors of 24 by 7 service. The under$1000 PC does not have
    the best high-reliability parts in it and is as likely to run 24 by 7 for more
    than a year or two—it is designed to last a minimal amount of time and replaced
    often. The components will be expensive, in general.


    Most name-brand server vendors today IBM, Compaq, Dell, HP, and others offer Linux
    pre-loaded on at least part of their product line. Several vendors specialize
    in Linux-based servers (VA Linux Systems, Cobalt Networks, and Penguin Computing
    to name a few). Either of these approaches can save you a lot of time and effort
    in getting a well-configured Linux system up and running.


    Your main concern is to ensure you have enough in the way of processing power
    and RAM. A database server optimally should have multiple CPUs, twice the RAM
    you think you need, the fastest NIC possible a direct connection to the biggest
    network switch available, and four times the disk you need on multiple SCSI controllers!


    # Test Environment


    You should have a test environment consisting of at least one server machine and
    a few client machines. Have some knowledgeable users test the first few upgrades.
    Get a plan of action for training, deployment, and troubleshooting, and then stick
    to it. The test environment all too often is skipped to meet deadlines. Proper
    planning and implementation using a test environment will smooth the final rollout
    for all concerned.'
  merge: -1
