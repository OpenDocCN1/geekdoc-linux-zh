  md: 'Once installed, the next steps are to secure the database. Making sure that
    only authorized users can access the database is a very important step. Depending
    on your application, database security should be taken seriously, especially in
    e-commerce applications where data is very sensitive, such as credit card numbers.
    Each user should be required to have a password. The users will also be granted
    privileges based on what type of usage they expect from the database. If a user
    only needs to read from the tables, this can be accomplished without giving the
    user power to execute any command on the database. Users and privileges are important
    to prevent unauthorized access and usage of your database.


    A database should always be available. Installing custom scripts to your server
