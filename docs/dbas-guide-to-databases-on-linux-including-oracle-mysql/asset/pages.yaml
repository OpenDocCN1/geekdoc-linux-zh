    # Issues


    This section will discuss some issues that arise when using Sybase. Some of these
    issues are generic Sybase issues that affect all platforms of Sybase, and some
    of these are specific to the Linux port of Sybase.


    # Identity Columns (Auto Increment)


    Sybase provides the ability to create integer columns that automatically increment
    whenever there is an insert operation on the table. These columns can be very
    nice when used to generate primary keys for columns in the table that do not inherently
    have any particularly unique data, or when used to reference a particular column
    from another table without using a longer string primary key.


    An identity column must be of the NUMERIC data type and will always be an integer.
    The size of the data type is not critical, but there are some implications of
    using too large a NUMERIC. To create an identity column, do so when you create
    the table with a syntax like this:


    ```

    CREATE TABLE<table>(

    table_id NUMERIC(<size>,0) IDENTITY PRIMARY KEY,

    ...

    )

    ```'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# Installing and Utilizing Sybase on Linux • Chapter 5 227


    If you decide to use identity columns, then there are a few things to be aware
    of. First of all, Sybase will not let you insert your own value into the identity
    column of a table unless you tell it you are going to before-hand. To tell Sybase
    you are going to enter your own value into an identity column, execute the following
    command:


    ```

    set identity_insert <table_name> on

    ```


    After executing this command, you can insert values into the identity column as
    if it were any normal NUMERIC column. Be sure to set the identity_insert back
    off for the table when you are done with the command. After setting identity_insert
    to off, Sybase will start producing values for identity columns with the next
    value generated being higher than the maximum value in the column currently.


    If you use identity columns in Sybase for any amount of time, you may notice that
    at some point your identity starts producing some really large numbers with a
    large gap from the last number produced. This occurs because of an optimization
    Sybase uses called the identity burning set. When you insert the first row into
    a table with an identity column, Sybase actually reserves a set of numbers to
    issue quickly to future inserts—if the database is shut down with nowait specified
    or through a catastrophic failure, then Sybase will not know which of these numbers
    in the set has been issued. Therefore, it just starts allocating another set of
    numbers, thus the large gap in numbers assigned. This can be limited by editing
    the SYBASE.cfg file in /opt/sybase and setting the burning set factor to a small
    number, but the only way to eliminate it from occurring is to ensure the database
    is always shut down properly. (See the following discussion about Sybase rc scripts.)


    The last important thing to know about identity columns is the special global
    variable @@IDENTITY. This variable is a global session variable that always contains
    the last assigned identity value in the last insert statement. With the use of
    this variable, you can find out what number was assigned to the most recent insert
    into a table with an identity column. An example of using this is displayed in
    Figure 5.13.


