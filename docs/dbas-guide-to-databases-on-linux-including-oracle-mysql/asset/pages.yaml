    Other tools that come with the MySQL distribution are:


    +   - mysisamchk. Checks, optimizes, repairs, and describes the MySQL tables.


    +   - make_binary_release. Creates a binary release of MySQL from a compiled version.


    +   - mysql2mysql. Converts programs written for mysql to MySQL.


    +   - mysqlaccess. Checks access privileges for host, user, and database records
    from the database.


    +   - mysqladmin. Provides general administration for MySQL.


    +   - mysqlbug. Files bug reports to MySQL mailing list.


    +   - mysqld. The actual MySQL database daemon.


    +   - mysqldump. Exports a database to a file.


    +   - mysqlimport. Imports a file into the database.


    +   - mysqlshow. Shows the information about databases and tables.


    +   - mysqlinstall_db. Script used at the beginning of installation to set up
    the initial tables.


    +   - replace. Script to replace strings; used by mysql2mysql.


    +   - mysqld. Script that keeps the mysqld daemon running, and restarts it when
    it dies.


    # Troubleshooting


    In case of trouble with the MySQL database server, there is a log file in the
    data directory with a .err extension. This file will most likely contain logging
    information when errors occur. If there is no information regarding why it crashed,
    you might also want to enable the -log run time option for mysql. This will also
    add extra logging information about what the database is doing. There is also
    a -debug option to add more logging information.


    A few items to note:'
