  md: '# Linux Loader (LILO) and Boot Disk


    The Linux loader and boot disk is highly recommended and requires only one diskette.
    This creates an alternate bootup to your system files, bypassing the current active
    partition. You can make this boot disk at any time using the mkbootdisk utility
    in Red Hat Linux (and the same or equivalents in the others; check your documentation).
    Figure 2.18 shows the scene you are presented with waits for you to put a diskette
    into the drive or to cancel the action.


    Figure 2.18 LILO configuration and boot disk creation (Do it!)


    ![](img/4dc2950553fde871c28ea3e04a065356_88_0.png)


    # LILO Configuration


    If you have installed Linux with a windows operating system already on the system,
    you could decide on which OS to boot by default. The Linux installation chooses
    the LILO boot partition by default in all cases.


    # Emergency Boot Disk


    The emergency boot disk is highly recommended—make the boot disk. This is a replacement
    for the boot block only, if your system loses its boot sector for any reason,
    stick in this and reboot the system). This boot disk is also used for recovery,
    along with a second disk created with the RESC.IMG file as out-lined earlier.'
