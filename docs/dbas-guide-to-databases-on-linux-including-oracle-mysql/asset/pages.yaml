    Digital Alpha CPU, Sun Ultra-SPARC 64-bit CPU, Silicon graphics 64-bit CPU, Intel
    Itanium IA-64 CPU, HPXX 64-bit machines, or IBM 64-bit machines. Compile PostgreSQL
