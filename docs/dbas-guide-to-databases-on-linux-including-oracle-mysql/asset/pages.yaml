  md: '# Physical Log


    You''ll notice that the physdb settings have been changed for you:


    ```

    # Physical Log Configuration


    PHYSDBS      physdb      # Location (dbspace) of physical log

    PHYSFILE     20000       # Physical log file size (Kbytes)

    ```


    # Logical Log


    The number of LOGFILES changed for you, but LOGSIZE didn''t change, so it''s a
    good idea to set it to whatever your system should have.


    # Default Values


    ```

    # Logical Log Configuration


    LOGFILES      26          # Number of logical log files

    LOGSIZE       500         # Logical log size (Kbytes)

    ```


    # New Values


    ```

    # Logical Log Configuration


    LOGFILES      26          # Number of logical log files

    LOGSIZE       1024        # Logical log size (Kbytes)

    ```


    In our case we set it to 1024, which is basically 1MB in size. See the Administrator''s
    Guide for details on what your system''s logical log size should be.


    # Memory Usage


    The default size of 8MB is pretty conservative. It''s probably a good idea to
    increase this—you should try different increments to see what works best for you:


    # Default Size


    ```

    SHMVIRTSIZE   8000        # initial virtual shared memory segment size

    ```


    # New Size


    ```

    SHMVIRTSIZE   24000       # initial virtual shared memory segment size

    ```'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# An Informix Installation on Linux • Chapter 4 177


    You can leave this alone, test all the other settings, and then enlarge memory
    usage last. In our examples at the end of this section, the output from restarting
    the engine will show this instead of changing it now. Change memory usage last
    in case it gives you problems.


    # LRU Settings


    Please see your Administrator’s Guide and other Informix documentation for the
    reasoning behind these new settings. Remember, the focus is here on installation,
    I''m giving you a few settings for now that will help your performance—the rest
    is up to you to learn.


    # Default Values


    ```

    LRUS 8 # Number of LRU queues

    LRU_MAX_DIRTY 60 # LRU percent dirty begin cleaning limit

    LRU_MIN_DIRTY 50 # LRU percent dirty end cleaning limit

    ```


    These settings are covered in several books dedicated solely to Informix, and
    will help you tremendously. There is also an ongoing discussion in the USENET
    newsgroup comp.databases.informix about many of these settings below. These here
    are based on experience, and on good performance improvements on Linux.


    # New Values


    ```

    LRUS 4 # Number of LRU queues

    LRU_MAX_DIRTY 5 # LRU percent dirty begin cleaning limit

    LRU_MIN_DIRTY 1 # LRU percent dirty end cleaning limit

    ```


    # DBSPACETEMP Settings


    You need to change this so that your new tempdbs dbpace can be used for temp tables,
    and sorts for queries.


    # Default Value


    ```

    # DBSPACETEMP # Default temp dbpaces

    ```


    # New Value


    ```

    DBSPACETEMP tempdbs

    ```


    # Restart Your Engine


    Restart your Informix engine with the oninit command $ oninit -v and watch the
    output.'
