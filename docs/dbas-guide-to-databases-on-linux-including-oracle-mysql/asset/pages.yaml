    # Using DHCP


    The first option button when configuring a network adapter is the choice to use
    DHCP (Dynamic Host Configuration Protocol) to configure all TCP/IP related information
    automatically from a central DHCP server service that can be running on any OS,
    as long as it is RFC-compliant.


    # Activate on Boot


    The second option button when configuring a network adapter is the choice to activate
    this network adapter on boot. If this is the only network adapter, this will be
    selected for you. If this is an interface that is dial-in or dial-out oriented,
    you may not want it to activate on bootup. You can make this demand-activated
    service, but that is beyond the scope of this installation.'
