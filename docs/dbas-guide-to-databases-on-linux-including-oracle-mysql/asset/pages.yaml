  md: '# Step-by-Step Procedure


    For a fresh install, or when upgrading from previous releases of PostgreSQL:


    +   - Create the PostgreSQL superuser account—the server will run as this user.
    For production use you should create a separate, unprivileged account (postgres
    is commonly used). If you do not have root access or just want to play around,
    your own user account is enough.


    +   - Running PostgreSQL as root, bin, or any other account with special access
    rights is a security risk and therefore won''t be allowed. You do not need to
    do the building and installation itself under this account (although you can).
    You will be told when you need to log in as the database superuser.


    +   - If you are not upgrading an existing system, skip ahead to step 4.


    You now need to back up your existing database. To dump your fairly recent post-6.0
    database installation, type:


    ```

    $ pg_dumpall db.out

    ```


    If you wish to preserve object ids (OIDs), use the -o option when running pg_dumpall.
    However, unless you have a special reason for doing this (such as using OIDs as
    keys in tables), don''t it.


    Make sure to use the pg_dumpall command from the version you are currently running.
    However, do not use the pg_dumpall script from 6.0 or everything will be owned
    by the PostgreSQL superuser. In that case you should grab pg_dumpall from a later
    6.x.x release. Version 7.0''s pg_dumpall will not work on older databases. If
    you are upgrading from a version prior to Postgres95v1.09, you must back up your
    database, install Postgres95v1.09, restore your database, and then back it up
    again.


    # WARNING


    You must make sure that your database is not updated in the middle of your backup.
    If necessary, bring down postmaster, edit the permissions in file /usr/local/postgresql/data/pg_hba.conf
    to allow only you on, then bring postmaster back up.'
