  md: '# Part I: Acquisition and Server Placement of the Software


    Set up three environment variables in your root and informix logins. Yes, you
    will need an informix id, and an informix group. I discuss the reasons for this
    later, but it would be a good idea to take care of this.


    For now, set these environment variables in your environment; we''ll talk about
    them as we go:


    ```

    INFORMMIXDIR=/opt/informix/ids ; export INFORMMIXDIR

    INFORMMIXSERVER=rebel_shm ; export INFORMMIXSERVER

    ONCONFIG=rebel_shm.cfg; export ONCONFIG

    ```


    Substitute the rebel name with your own; it will be referenced as we. Make sure
    that you put these commands in your root and informix profiles, and that your
    profiles are bringing these values into your environment when you log in before
    proceeding with the installation. Until the INFORMMIXDIR variable is set, the
    installation cannot proceed correctly, or at all. Log out and then log in and
    make sure these variables are set before proceeding.


    Download the zip file from www.intraware.com. Inside this zip file will be an
    RPM file that contains tar files and an installation script. Be sure to follow
    Informix''s recommendations for installing their software.


    # NOTE


    The following steps should be done as root login. If you do not have root access,
    stop what you are doing and get root login permission for the duration of the
    install. Once the software has been installed, you will still need to be root
    to set up data directories. Do not use any other login unless the Informix installation
