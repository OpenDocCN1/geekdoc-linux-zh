    It is helpful to have Oracle automatically start up and shut down with Linux.
    Oracle includes a script dbstart that can be used in runcontrol scripts. The dbstart
    script consults the /etc/oratab file to see what instances should be started and
    stopped automatically.


    ```

    # /etc/oratab

