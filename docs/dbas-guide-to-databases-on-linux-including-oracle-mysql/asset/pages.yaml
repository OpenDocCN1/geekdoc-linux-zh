    This concludes the editing of ONCONFIG file. Save this file with the changes you
    made, and get ready to edit another important file, the $INFORMDIR/etc/sqlhosts
    file. There are more changes we will be making to the $ONCONFIG later on, but
    for now these are all we need to make to get the engine to start.


    The following are editing tasks on other ASCII files. Make sure these files are
    saved as text files just like your ONCONFIG was.


    # $INFORMDIR/etc/sqlhosts


    Add these entries to your $INFORMDIR/etc/sqlhosts file:


    | rebel_shm onicpsm rebel sv_rebel_shm |

    | rebel_net onsoctcp rebel sv_rebel_net |


    These are directly related to other entries in the /etc/services file, so make
    sure you keep track of them. A complete discussion of what these values mean can
    be found in the Administrator''s Guide. As a matter of convention you can name
    the values in the far-right column whatever you want—here I have prefixed them
    with sv_ to indicate they refer to entries in the /etc/services file. For now,
    simply follow this convention for your first installation; after this you can
    change it to whatever you prefer.


    # /etc/services


    Add these entries to your Linux /etc/services file (not $INFORMDIR/etc/services!)
    :


    | sv_rebel_shm 60000/tcp # IDS 7.30 @ rebel |

    | rebel_net 60001/tcp # IDS 7.30 @ rebel |


    Make sure these port entries can be used; if they cannot be used, use other available
    port numbers. Any number between 0 and 65536 can be assigned a port number, including
    negative numbers. Many are presigned as a matter of standards and conventions
    in the UNIX world, so'
