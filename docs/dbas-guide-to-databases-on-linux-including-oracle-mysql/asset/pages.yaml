  md: 'Administrative requests check only the user table, because it is the only table
    where administrative privileges are located. If the user has this privilege, the
    action will be granted or otherwise denied. Database-related ones used to manipulate
    rows in a table are first checked in the user table. If the user does not have
    these privileges, the database will go to the db and host tables and verify that
    this request should be granted. If the user is not listed in the db, the request
    is denied. If the user''s host field is blank, it will cross-reference it with
    the host table and determine if the access should be granted.


    By setting up a simple access control list, you can easily specify which users
    can connect to your database, and from which host. This is extremely powerful.
    You can exclude everyone from outside your domain and allow only people in the
    local network or allow only specific users from specified addresses.


    # System Setup


    To keep the database running all the time, you must set up your system to start
    the database automatically when it boots up. This is set up in the /etc/rc.d directory
    on your machine. If you set up the RPM distribution, this is already done for
    you. A file can be created that will set the environment and the pathnames, and
    then load the database daemon. We will set up by creating an rc script to accomplish
    this. Creating scripts requires root privileges and can be done only by the administrator.


    First, let''s create a new script in the rc directory called mysql. Change into
    /etc/rc.d/init.d and create the mysql file. Here we will set up the environment
    for the database. All scripts start by telling the system shell to perform execute
    with the following:


    ```

    #!/bin/sh

    ```


    Next, we set the path and directory names:


    ```

    PATH=/usr/sbin:/usr/bin:/usr/bin

    basedir=/my/path/mysql

    pid_file=/my/path/mysql/var/mysqld.pid

    mysql_daemon_user=mysql

    ```


    Then we up the startup part of the script. This will change the mysql directory
    specified previously; make sure the safe mysqld program exists, and then executes
    it, specifying the user and pid_file to use as defined earlier. The pid file contains
    the process id, which can be used to stop the process in the later half of the
    script.


    ```

    mode=$1

    ```'
