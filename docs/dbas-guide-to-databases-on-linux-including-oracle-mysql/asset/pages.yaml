  md: '# Upgrading


    There is an Upgrade Option for most Linux installations. This usually entails
    re-installing the newer versions of all currently installed products, including
    the kernel files. Any dependencies are also installed if necessary. Some distributions
    of Linux keep track of every package installed and where the related files are
    installed. This database is queried for all current packages, and any related
    new packages will overwrite them as well as install any new dependency packages.


    # NOTE


    If you already have some version of Linux, you need to be aware that the Workstation
    installation option on some versions of Linux (like Red Hat) deletes ALL Linux
    partitions (and leaves some OS partitions alone), then creates and installs everything
    new, whereas the Server installation on some versions of Linux (again, notably
    Red Hat) just wipes out ALL partitions on all drives and proceeds to install everything
    fresh.


    # Migrating from Another OS


    A big question regarding any migration strategy is what to do with it with the
    old files of information. You may wish to make it available on a disk partition
    (FAT, FAT32, NTFS, etc.) and make it available to the Linux system. You do not
    have to delete the old OS or any of the file system if there is available file
    system space for Linux. You can even keep the old OS intact (in a dual boot configuration)
    until you are ready to complete the migration. This is not the recommended method
    for hundreds of workstations, because this may require two visits to each machine.
    You need to test the transition, plan it carefully, roll it out, and allow for
    some hiccups


    However, if this is truly to be a server only, you do not need any other OS or
    their old files using up disk space. Convert the data and use all the available
    disk space on the new box for this server. Keep a backup if you want, but once
    you have moved to the new service, you will most likely not need to access the
    old data.


