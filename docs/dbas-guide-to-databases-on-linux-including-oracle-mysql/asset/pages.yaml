- img_proc: true
  md: '# 218 Chapter 5 • Installing and Utilizing Sybase on Linux


    At the outset, only the dbo has permission to anything in a database. Each object
    (table, view, stored procedure, or column) in the database has a set of permissions
    associated with it for each user or group. The dbo has the ability to grant permission
    to other users of the database for certain actions. The process of granting permissions
    to a user or group allows them that permission (select, update, insert, delete,
    references, or execute) on a particular object. The syntax for the grant and revoke
    commands are:


    ```

    grant (all [privileges]) | permission_list

    on ( table_name [(column_list)]

    | view_name[(column_list)]

    | stored_procedure_name)

    to [public | name_list | role_name]

    [with grant option]

    ```


    ```

    revoke [grant option for]

    all [privileges] | permission_list]

    con ( table_name [(column_list)]

    | view_name [(column_list)]

    | stored_procedure_name)

    from (public | name_list | role_name)

    [cascade]

    ```


    So for our example, will grant the group editors the ability to select data (read)
    from the authors, chapters, and books tables. (We must create these tables first.)
    These commands will do the trick:


    ```

    1> grant select on authors to editors

    2> grant select on chapters to editors

    3> grant select on books to editors

    4> go

    ```


    # Testing the Database


