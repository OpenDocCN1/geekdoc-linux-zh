    Notice I left the original values commented-out so that we can go back to these
    later and change or keep them as a point of reference. It''s always a good idea
    to comment out other values—copy and change the copy rather than just changing
    the original entry. This way you can keep track of changes.


    We our tape devices set to /dev/null, and this allows the IDS server to come up
    and work without worrying about where the backups go for. Now we will change this
    to a real tape backup if we have one, or leave it as until we decide to have a
    real tape backup. Setting it to /dev/null is a standard way of telling the IDS
    server to ignore a physical device for backup, but still do the things necessary
    to tell the engine certain things are backed up, namely the logical logs. We will
    discuss the logical logs later on; for now we will only worry about bringing up
    the server.


