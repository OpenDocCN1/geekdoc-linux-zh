  md: 'An Informix Installation on Linux • Chapter 147


    you should take care not to use port numbers that are already assigned to other
    Ethernet channels.

    Once you are editing your /etc/services file, you need to restart your networking.
    In most cases restarting inetd will force inet to reread the /etc/services file;
    however, a reboot may be necessary for some of the Linux distributions. The various
    distributions have different run levels, which means that each distribution has
    unique procedures to restart networking. As a matter of tradition, many Linux
    system administrators strive not to cold-start their Linux servers unless what
    is necessary. For the sake of simplicity and reduced errors, reboot your Linux
    server if you can; otherwise, make absolutely sure that the networking layer of
    Linux is restarted, and that the /etc/services file is reread. If you don''t,
    the Informix server will not be able to talk to clients on the network, or other
    problems may arise with the installation.

    Notice that the entries in the $INFORMATDIR/etc/sqlhosts file correspond to the
    /etc/services file. If these do not match, you won''t be starting the engine.


    # /opt/data/rootdbs


    To use a cooked file, we must create one in the /opt/data directory (see Figure
    4:6):


    ```

    $ mkdir /opt/data      # only if you do not have this directory!!!

    $ chown informix:informix /opt/data

    $ chmod 775 /opt/data

    $ cd /opt/data

    $ >rootdbs

    $ chown informix:informix rootdbs

    $ chmod 660 rootdbs

    $ ls -l rootdbs

    ```


    The rootdbs should now be zero bytes in size. It should be owned by Informix and
    have user group permissions on it, but no public permissions. It should be rw-rw----
    when you run ls -l on the rootdbs file. The directory, where the rootdbs lives,
    should be owned by Informix and the group id of Informix.


    # Starting Your Engine with oninit


    If you have followed all the instructions to now, you are ready to initialize
    your instance of Informix. Initialization is the process whereby the sysmaster
    database is created, and the rootdbs brought online. This will bring the engine
    up, and you will be able to start creating databases and tables.'
