    # Setting Up Data Files for Informix


    Create a directory, /opt/data, or /db/data, or preferably, a separate hard drive
    /data, and under it create a directory called /data/informix. I have a separate
    directory I call /db, and have created a /db/data for the home of all the data.
    For all we will use /opt/data, but you should have a different directory. It is
    advisable to keep your data separate from your software if at all possible. As
    I describe later, you should allocate at least 500MB for the data, if not more.
    It makes no sense to scrimp on data space unless you can avoid it. When I talk
    about allocation of space, I''m referring to total space,'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'specific files. Your total aggregate space should be no less than 500MB, and
    we will create coated files of different sizes within this space.


    Informix uses chunks to describe the largest value for data space. All data resides
    inside chunks as pages, which are the smallest unit of measure for data space.
    Please refer to the Administrator''s Guide for a complete description of chunks
    and pages. This chapter will use that terminology to finish the installation,
    so it is important for you to understand the concepts. You will find award-winning
    documentation with Informix software, so take advantage of it.


    Once you are familiar with the concept of chunks and dbspaces, you are ready to
    configure your server for operation. We will set up a server that allows you to
    specify on your own how much data space to use, and the minimum operational space
    to set aside. This way you can grow the system with a minimum of aggravation.


    There are several dbspaces for which you will need to set aside disk space. These
    are the minimum; the rest are data spaces you decide to add as additional dbspaces.
    The following are operational spaces.


    +   - Root. dbspace containing the sysmaster database, the intelligence center
    for the database engine.


    +   - Physdbs. dbspace for buffering data before it is written to disk. This is
    contained in the rootdbbs, but should be moved to its own dbspace for improved
    performance and administration. You can call this dbspace whatever you like; however,
    it is advisable to call it something consistent with what it is.


    +   - Logsdb. dbspace for logical logs. Upon installation, it is contained in
    the rootdbbs, but for better operation it should be placed in its own dbspace.
    You can call this dbspace whatever you like; however, it is advisable to call
    something consistent with what it is.


    +   - Tempdbs01. dbspace for temp tables and sorting of queries. You can call
    this dbspace whatever you like; however, it is advisable to call it something
    consistent with what it is.


    The following are data spaces. You may call these dbspaces whatever you like.


    +   - Dbs dbs. dbspace for database creation, but not tables. A database entry
    is created, with a few basic system table entries, but user tables are referenced
    outside this space.


    +   - Dataddbs01. dbspace for user tables.


    +   - Indexdbs01. dbspace for user indexes.'
