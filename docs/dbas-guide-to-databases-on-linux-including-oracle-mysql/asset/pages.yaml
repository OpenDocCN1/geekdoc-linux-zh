  md: '# 306 Chapter 7 • MySQL on Linux


    +   - Make sure you have the latest version in your distribution for

    database.


    +   - Make sure you have the latest glibc or libc (depending on your

    distribution).


    +   - Check user permissions on all of the files that the database user

    owns.


    +   - Check the status with mysqladmin to make sure the load times

    do not look abnormal.


    +   - If you have problems connecting make sure that your access

    control is set up correctly for the user, password, and hostname;

    and that the server is actually running (can be checked with the\ps command).


    +   - Make sure no other program took the same port that MySQL

    runs as.


    +   - If a thread has died, you must kill all other threads before

    trying the database again.


    +   - Try connecting locally and remotely. If remotely fails, check to

    make sure the networking options are on. If locally fails, make

    sure UNIX sockets are turned on.


    +   - Make sure there are enough connections for all of your clients.


    +   - Make sure there is plenty of memory for the database. Very large

    dabases tend to use up resources quickly.


    +   - Make sure the performance settings are set correctly for table

    sizes. Make sure tables to not grow too large.


    +   - Make sure no significant changes have occurred in the operation

    of the database since this printing. Refer to the documentation

    comes with MySQL for any changes.


    # Summary


    MySQL installation seems pretty daunting at first, but by reviewing the\options
    and taking a course that best suits your needs, you can have the

    database up and running in no time. MySQL comes in a variety of distrib-: binary,
    RPM, and source. The binary distributions are tailored for

    specific types of platforms and cannot be used on any other. These are

    relatively easy to install and may require root access to be installed in the

    system-level directories. The RPM distributions are the easiest, but only if

    have Red Hat Linux. These distributions will even do part of the con-

    figuration for you. The last distributions, which we recommend, are the'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# MySQL on Linux • Chapter 7 307


    source distributions. These come with a lot of documentation and examples, and
    can be highly tailored to your liking.


    MySQL is constantly in development, as you can see by the number of levels of
    maturity of the distributions. The stable distributions are recommended for their
    stability and full range of tested features. The bleeding-distributions are for
    testing out new features that are fleshed out in the database. The old deprecated
    releases are not necessary unless you are a previous user. Keeping up-to-date
    in the stable distributions, 3.2.22, will provide all the features and stability
    an application requires.


    The actual installation depends on the distribution chosen. The binary and RPM
    installations require the least amount of work and can be done relatively quickly.
    The RPM distributions require Red Hat and root privileges. Binary distributions
    require it only if installed in a system directory because it is already done
    for you. The source distribution does not require root unless placed in a system
    directory as well. This distribution requires more tools than the previous distributions,
    but these should already be installed from your Linux distribution. The only extra
    step is compilation, which should take more time depending on system resources.


    Once installed, you must configure and set up the database for usage. The first
    stage of setup is to make sure proper security is in place. Nothing can be stressed
    more strongly than making sure the database is secure and only the users you want
    to access it can access it, especially if the information being stored is sensitive.
    Even if it is not, you still do not want users to be able to harm the data, such
    as deleting it.


    The first user created when the database is installed is the root user. The password
    for this user must be set immediately after installation. If not, anyone can connect
    and have full access to the database. You should also set up a user on the system
    to run the MySQL daemon. You should not run this daemon as root or you will open
    yourself to crackers who try to exploit the daemon to get root privileges. Once
    this user is created, the files and permissions should be set so that that user
    has access to the files and can write to them.


    With MySQL there are many types of privileges that determine what a user can do
    with the database. There are more administrative privileges, such as shutting
    the database down or doing reloads. There are also privileges related to the database
    and tables as being able to read the tables and putting new data in them. New
    users should be created with specific rules in them. A user can be created that
    just handles administrative functions. Regular users who manipulate data should
    only have permissions to do these operations, and leave the more privileged operations.
    Users also can be restricted from where they originate the connection'
