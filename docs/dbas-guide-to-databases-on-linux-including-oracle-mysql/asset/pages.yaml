  md: '# Other Tools


    The following are a few of the tools that come with the Informix database engine.


    **onlog**. A logical log browser that allows you to view the contents of your
    logical logs. You simply run **onlogs**, and the display will show you the contents
    of the logical logs.


    **dbschema**. A report-writer for the DBA, allowing you to produce SQL statements
    that can be used to create databases and tables.


    **dbexport /dbimport** Tools that allow you to back up your database completely
    in one convenient file, and that can be used to restore a database with very little
    work.


    **finderr**. A program that produces detailed documentation about an Informix
    error message. You run **finderr** with an error number you provide it, and it
    produces a small page of information about the nature of the problem.


    **SMI Tables**. You should become familiar with the sysmaster database located
    in the rootdb dabase. It contains a wealth of information about your engine. For
    example, you can produce reports about disk usage that are a little easier to
    read.


    The following report, called **IDspaces**, shows you a nice report about disk
    usage. Instead of this:


    ```

    re:root # onstat -d

    ```


