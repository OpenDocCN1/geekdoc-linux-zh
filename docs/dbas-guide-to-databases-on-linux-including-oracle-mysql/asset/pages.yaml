- img_proc: true
  md: '# Chapter 9 PostgreSQL on Linux


    Inquiries regarding your Kerberos should be directed or to your vendor or to MIT
    Project Athena. Note that FAQLs (Frequently-Asked Questions Lists) periodically
    are posted to the Kerberos mailing list (send mail to subscribe), and to the USENET
    news group.


    # Installation


    Installation of Kerberos itself is covered in detail in the Kerberos installation
    notes. Make sure that the server key file (the srtab or keytab) is somehow readable
    by the Postgres account.


    Postgres and its clients can be compiled to use either Version 4 or Version 5
    of the MIT Kerberos protocols by setting the KRVERS variable in the file src/Makefile.global
    to the appropriate value. You can also change the location where Postgres expects
    to find the associated libraries, headers files, and its own server key file.


    After compilation is complete, Postgres must be registered as a Kerberos service.
    See the Kerberos operations notes and related manual pages for more details on
    registering services.


    # Operation


    After initial installation, Postgres should operate in all ways as a normal Kerberos
    service. For details on the use of authentication, see the PostgreSQL User''s
    Guide reference sections for postmaster and psql.


    In the Kerberos Version 5 books, the following assumptions are made about user
    and service naming (also, see Table 9.1):


    +   - User principal names (anames) are assumed to contain the actual UNIX/Postgres
    username in the first component.


    +   - The Postgres service is assumed to have two components, the service name
    and a hostname, canonicalized as in Version 4 (i.e., with all domain suffixes
    removed).


    Table 9.1 Kerberos Examples


    | Parameter | Example |

    | --- | --- |

    | user | frew@S2K.ORG |

    | user | aoki/HOST=miyu.S2K.Berkeley.EDU@S2K.ORG |

    | host | postgres_dbms/ucbvax@S2K.ORG |


    Support for Version 4 will disappear sometime after the production release of
    Version 5 by MIT.'
