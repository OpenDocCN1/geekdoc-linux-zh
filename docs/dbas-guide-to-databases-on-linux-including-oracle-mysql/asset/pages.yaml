  md: '# Standard Web Services


    Internet services support is provided with the Apache Web server, the most dominant
    Web server product running http services on the Internet, as well as full versions
    of the latest CGI interfaces: Perl, Java, etc. Linux is an excellent Web server;
    Apache is a top-of-the-line Web application that has integration hooks for all
    the major database services using these CGI interfaces. The only interface not
    supported locally is Active Server Pages (ASP). ASP support is available via a
    number of third party vendors.


    # Standard UNIX Services


    Linux supports all the UNIX services: e-mail, FTP, UseNet news, Telnet, POP, IRC,
    NFS, DNS, NIS, SNMP, Kerberos, etc., as would be expected of any Internet OS.
    For a much more detailed overview of what Linux is and is not, you can check out
    the Linux International Web site at http://www.li.org/li/index.html.


    # Why Choose Linux


    Any operating system has the same basic set of requirements: reliability, security,
    features, and cost. When you add these together, Linux is hard to beat. Few other
    operating systems boast the breadth of applications, the proven record of reliability,
    and the latest networking features for little or no cost. The initial software
    is free. The on-going costs of support and staffing are no different than normal,
    but someone has to install, manage, and maintain it. The total cost of ownership
    with Linux is very low, and while qualified systems administrators are not always
    easy to find, Linux doesn''t require much attention once it is up and running.


    # When to Use Linux


    The most common and best uses of Linux are as a router, dynamic host control protocol
    (DHCP), Web, file transfer protocol (ftp), database, file or print server, for
    almost any operating system. Then you can migrate it to desktops.


    Linux is a noted firewall server with the latest security offerings of advanced
    packet filtering and TCP Wrappers services. Linux can provide network address
    translation (NAT) as well as proxy services for intranet hosts accessing the Internet
    more securely. With Apache and WS-FTP services, you have a very secure and robust
    Web and ftp site with extensive security, auditing, and management features to
    match, and which'
  merge: -1
