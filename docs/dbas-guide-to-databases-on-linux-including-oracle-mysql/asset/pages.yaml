  md: '# Post-Installation


    Now that Oracle is installed, you must be chomping at the bit to start using it.
    Before you, you need to take care of a few things, including changing a few critical
    passwords, setting a new date format, and configuring Linux to start and stop
    Oracle automatically.


    # SYS and SYSTEM Accounts


    There are three special accounts created by default under Oracle: internal, SYS,
    and SYSTEM. The account internal is a special account, often used by scripts.
    The account SYS owns the administrative tables and the data dictionary. You should
    rarely use the SYS account. The SYSTEM account owns all administrative tables
    and views created after the database-installed, as well as those used by Oracle
    tools. The SYSTEM account is not directly related to the SYSTEM tablespace, though
    they share the same name. The SYS and SYSTEM account passwords should be changed.
    Replace newpassword in the following example with a password of your choosing.


    To change the passwords, login using svrmgrl:


    ```

    [oracle@dbsvr oracle]$ svrmgrl

    ```


