  md: '# Chapter 4 • An Informix Installation on Linux


    Informix Dynamic Server are using cooked files exclusively, simply for the fact
    that raw draws on NT do not offer enough of a performance gain to make it worth
    the trouble to use them. The Administrator''s Guide discusses this issue in more
    detail.


    Cooked files are easier to manage in most situations, and I recommend you use
    cooked files in environments where you want a more simple administration, and
    you do not anticipate an extremely high load on the system. If you get into a
    situation where you need more performance, then you would most likely want to
    make a raw disk installation for UNIX. Until raw disks are supported on Linux,
