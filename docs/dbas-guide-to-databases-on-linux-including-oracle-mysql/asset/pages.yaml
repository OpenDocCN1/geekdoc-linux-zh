  md: '# Active Server Pages


    Microsoft''s Active Server Pages (ASP) are designed for Windows NT/2000 but can
    run also (better, in) on many UNIX/Linux platforms, including Red Hat Linux, via
    Chili!Soft''s excellent emulator. ASP has the ability to use any Component Object
    Model (COM) object, but COM objects are a Microsoft technology. Microsoft''s own
    Internet Information Services (IIS) and Visual Studio present an excellent development
    environment, but is plagued with reliability and security issues and is typically
    not compatible with Web servers unless IIS is used. You can find more information
    at Chili!Soft''s Web site at http://www.chilisoft.com.


    # Cold Fusion


    Allaire''s Cold Fusion is another proprietary product that is easy to learn and
    use; although it traditionally has been available for Windows NT only, Allaire
    has been converting it to various UNIX flavors, including HP-UX, Solaris, and
    Linux. Cold Fusion uses custom HTML-like embedded tags mixed with standard HTML
    to build a customized, database-driven page. You can find more information at
    http://www.allaire.com.


    # Java Server Pages


    Sun''s Java Server Pages is a relative newcomer to the Web application platform
    arena, but offers the vast power of Sun''s Java language. Although replete with
    complexity as well as features, it is an excellent choice if your organization
    is standardizing on Java and CORBA. JSP is available for any platform that a Java
    interpreter is available, which includes Linux, UNIX, and Windows NT. To go to
    http://www.sun.com for more information.


    # Zope


    Zope is an excellent Open Source Web application platform that incorporates a
    hierarchical, object-oriented database with built-in permissions and a Web-based
    development environment. It also has modules that connect to major database engines,
    and offers all the advantages of traditional relational databases as well as object-oriented
    databases, as well as many of the advantages of PHP. It also offers a flowdown
    inheritance scheme and a built-in permission strategy. Development on Zope, like
    most Open Source projects, proceeds very rapidly, and it''s definitely worth checking
    out. As a complex and full-featured product with an integrated security model,
    it''s not quite as fast as PHP. You can find more information at http://www.zope.org.'
  merge: -1
