  md: '# Introduction


    Informix, like Oracle, is a powerful commercial database. Informix, Oracle, and
    other enterprise-level databases like IBM''s DB2 and Sybase, Oracle, all compete
    on a variety of platforms, but they are focused primarily on enterprise-level
    database management, where large volumes of database traffic and storage are required.
    These products are considered serious contenders for businesses looking for a
    production database server, one that meets certain load requirements usually found
    in mid-sized to large corporate business environments.


    Informix was one of the first databases on UNIX. Informix, called CISAM (Indexed
    Sequential Access Method) product for UNIX, which is still available today, and
    yes, you can get it for Linux. All current database products on the market use
    an ISAM methodology for their operation, without exception. Informix has many
    other firstly in the database world, and now can compete with much more expensive
    products.


    All of these database products, including many others not mentioned here, meet
    a minimum requirement with ISO and the SQL standard as being entry level database
    products. They all meet the minimum entry point for basic SQL compliance, in addition
    to the entry-level features that are allowed under the SQL specification, they
    are also allowed advanced-level features as optional features. No single vendor
    has implemented all the SQL specifications, but most vendors meet the minimums,
    and then choose to implement additional features when they have an opportunity
    to increase their competitive edge. For more information on the SQL standard,
    be sure to search the World Wide Web (WWW). Vendors also add additional features
    for more, or when the competition adds a feature that the endusers like and now
    simply cannot live without.


    This chapter focuses on how to install and bring up an Informix engine in the
    Linux operating environment. The focus is not only on an enterprise-level database
    engine, but also on an engine that is scalable from Linux upward to the larger
    servers on the market, primarily in the UNIX operating systems market. Much of
    what you learn here can be applied to the other UNIX versions of Informix Dynamic
    Server in the rest of the UNIX world, and to some degree the NT world; however,
    for now you will find it easier not to worry about any comparisons to NT. Most
    of the enterprise engines on the market are on UNIX and NT, and in some cases,
    MVS (on mainframes). The only ones not found on UNIX are the database products
    from Microsoft, who choose NT as their banner platform to scale.


    Microsoft is only now starting to take their database market seriously, building
    products for data warehousing, and data transformation to complement their SQL
    Server product line. Once a platform in the Intel x86'
  merge: -1
