- img_proc: true
  md: '# Runtime Environment—Using Postgres from UNIX/Linux


    All Postgres commands that are executed directly from a UNIX shell are found in
    the directory .../bin. Including this directory in your search path will make
    executing the commands easier.


    A collection of system catalogs exists at each site. These include a class (pg_user)
    that contains an instance for each valid Postgres user. The instance specifies
    a set of Postgres privileges, such as the ability to act as Postgres superuser,
    the ability to create and destroy databases, and the ability to update the system
    catalogs. A UNIX user cannot do anything with Postgres until an appropriate instance
    is installed in this class. Further information on the system catalogs is available
    by running queries on the appropriate classes.


    # Starting Postmaster


    Nothing can happen to a database unless the postmaster process is running. As
    the site administrator, there are a number of things you should remember before
    starting the postmaster. These are discussed in the installation and configuration
    sections of this manual. However, if Postgres has been installed by following
    the installation instructions exactly as written, the following simple command
    is all you should need to start the postmaster:


    ```

    % postmaster

    ```


    The postmaster occasionally prints out messages that are often helpful during
    troubleshooting. If you wish to view debugging messages from the postmaster, you
    can start it with the -d option and redirect the output to the log file:


    ```

    $ postmaster -d >pm.log 2>&1 &

    ```


    If you do not wish to see these messages, you can type:


    ```

    % postmaster -S

    ```


    and the postmaster will be “S”ilent. Notice that there is no ampersand (&) at
    the end of the last example, so postmaster will be running in the foreground.


    # Using pg_options


    The optional file data/pg_options contains runtime options used by the back-end
    to control trace messages and other back-end tunable parameters. The file is reread
    by a back--end when it receives a SIGHUP signal,'
  merge: -1
  pgno: 420
- img_proc: true
  md: '# Chapter 9 PostgreSQL on Linux


    making it possible to change runtime options on the fly without needing to restart
    Postgres. The options specified in this file might be debugging flags used by
    the trace package (backend/utils/misc/trace.c), or numeric parameters that can
    be used by the back-end to control its behavior. initialized to zero at back-end
    startup. New or modified options will be read by all new back-ends when they are
    started. To make effective any changes for running back-ends, we need to send
    a SIGHUP to the postmaster. The signal will be sent automatically to all the back-ends.
    We can also activate the changes for a specific back-end by sending the SIGHUP
    directly to it.


    pg_options can also be specified with the -T switch of Postgres:

    postgres options -T "verbose=2,query,hostlookup-"


    The functions used for printing errors and debug messages can now make use of
    the syslog(2) facility. Messages printed to stdout or stderr are prefixed by a
    timestamp also containing the back-end pid:


    ```

    #timestamp #pid #message

    980127.17:52:14.173 [2971] StartTransactionCommand

    980127.17:52:14.174 [2971] ProcessUtility: drop table t:

    980127.17:52:14.186 [2971] SIInCNumEntries: table is 70% full

    980127.17:52:14.186 [9286] Async_NotifyHandler

    980127.17:52:14.186 [9286] Waking up sleeping backend process

    980127.19:52:14.292 [9286] Async_NotifyFrontend

    980127.19:52:14.413 [9286] Async_NotifyFrontend

    980127.19:52:14.466 [9286] Async_NotifyHandler done

    ```


    This format improves readability of the logs and allows people to understand exactly
    which back-end is doing what and at which time. It also makes easier to write
    simple awk or perl scripts, which monitor the log to detect database errors or
    problems, or to compute transaction statistics.


    Messages printed to syslog use the log facility LOG_LOCAL. The use of syslog can
    be controlled with the syslog pg_option. Unfortunately many functions directly
    call printf() to print their messages to stdout or stderr, and this output cannot
    be redirected to syslog or have timestamps in it. It is advisable that all calls
    to printf be replaced with the PRINTF macro so we can control all output in a
    uniform way.


    The format of the pg_options file is as follows:


    ```

    # comment

    option=integer_value # set value for option

    option # set option = 1

    ```'
