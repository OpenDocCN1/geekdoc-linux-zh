    Install your Linux distribution on the first SCSI hard drive.


    # Installing Sybase


    After setting up the machine and installing Linux as we just described, we will
    gather some information that we will need to install Sybase. First, we need to
    know what devices correspond to the partitions on the hard drives that we have
    just set up. The fdisk program can be used to display all partition information
    on a hard drive. Following is a typical usage case for the fdisk program to obtain
    the partitions:


    ```

    # fdisk /dev/sda

    ```


    The number of cylinders for this disk is set to 1247.

    There is nothing wrong with that, but this is larger than 1024, and could in certain
    setups cause problems with:


    +   1) software that runs at boot time (e.g., LILO)

    2) booting and partitioning software from other OSs

    (e.g., DOS DISK, OS/2 FDISK)


    Command (m for help): p


    ```

    Disk /dev/sda: 255 heads, 63 sectors, 1247 cylinders

    Units = cylinders of 16065 * 512 bytes

    ```


    Command (m for help): q'
