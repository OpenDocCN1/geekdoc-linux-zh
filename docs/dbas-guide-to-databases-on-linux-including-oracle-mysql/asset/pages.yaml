    and SALGRADE. The tables can be created through the script ORACLE_HOME/rdbms/admin/utilsampl.sql.
    A user with DBA privileges, beides SYSTEM, should run the script if you are interested
    creating tables. The ORACLE_HOME/rdbms/admin directory contains many optional
    scripts. Most of the scripts explain the purpose of the script. Certain scripts
    must be processed by a particular user such as SYS or SYSTEM.


    # Data Dictionary


    Oracle''s data dictionary is a central repository of read-only tables and views.
    Oracle uses the data dictionary to look up object definitions, space allocation,
    integrity constraints, privileges, auditing information, and other information.
    The underlying configuration of the data dictionary is a set of read-only, normalized
    tables that are difficult to read. User-accessible views are created to make the
    data easier for us humans to read. The data dictionary is owned by the SYS schema,
    and it it should be altered only by Oracle Corporation. Changes to the SYS schema
    can damage the database, and thus the account should be kept secure. There are
    many public synonyms for data dictionary views,'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# Chapter 3 • Installing and Running Oracle on Linux


    including three basic sets of views: ALL, USER, DBA. There is also a set of dynamic
    performance tables that begin with VS. The USER views include items in the user''s
    schema. The ALL views include everything users can see and are designed for the
    database administrator. The ALL, OBJECTS view is especially lengthy because it
    includes all objects a user can access.


    ```

    SELECT * FROM ALL_OBJECTS;

    ```


    There are three other data dictionary objects that should be mentioned: DUAL,
    CAT, and DICT. DUAL is a special table composed of one column DUMMY with the value
    X. The DUAL table is used to fulfill the requirement that all select statements
    include a FROM clause identifying a table.


    ```

    SELECT sysdate FROM DUAL;

    ```


    The CAT view is a synonym for USER_CATALOG. This view lists tables, views, synonyms,
    and sequences owned by the user.


    ```

    SELECT * FROM CAT;

    ```


    DICT is a synonym for DICTIONARY. This view contains descriptions of data dictionary
    tables and views.


    ```

    SQL> COLUMN table_name FORMAT a15

    SQL> COLUMN comments FORMAT a50

    SQL> SELECT FROM dict WHERE table_name=''DICTIONARY'';

    ```


    | TABLE_NAME | COMMENTS |

    |---|---|

    | DICTIONARY | Description of data dictionary tables and views |


    The dynamic performance views are updated by the Oracle server throughout its
    operation. These virtual tables are not accessible by most users and are used
    by the database administrator to get information about the database. It is used
    extensively in database performance tuning, the dynamic performance views being
    with VS.


    ```

    SQL> SELECT * from vversion;

    ```


    BANNER


    ```

    Oracle8 Release 8.0.5.1.0 - Production

    PL/SQL Release 8.0.5.1.0 - Production

    CORE Version 4.0.5.0 - Production

    TNS Version for Linux: Version 8.0.5.0.0 - Production

    NLSRTL Version 3.3.2.0 - Production

    ```'
  merge: -1
