  md: '# How Can I Trust PostgreSQL?


    There is a scientific way to validate the reliability of the PostgreSQL system.
    To validate PostgreSQL, a regression test package (src/test/regress) is included
    in the distribution. The regression test package will verify the standard SQL
    operations as well as the extensibility capabilities of PostgreSQL. The test package
    already contains hundreds of SQL test programs.


    You should use the computer''s high-speed power to validate the PostgreSQL, instead
    of using brain power. Computers can carry out software regression tests millions
    or billions of tests faster than humans can. Modern computers can run billions
    of SQL tests in a very short time. In the near future the speed of computers will
    be several times faster than the human brain! Hence, it makes sense to use the
    power of computers to validate the software.


    You can add more tests in case you need to, and can upload to the primary PostgreSQL
    Web site if you feel it will be useful to others on the Internet. The regression
    test package helps build confidence and trust in PostgreSQL, and facilitates rapid
    deployment of PostgreSQL on production systems.


    The regression test package can be taken as a very technical document, mutually
    agreed upon between the developers and end users. PostgreSQL developers extensively
    use the regression test package during the development period and also before
    releasing the software to the public to ensure good quality.


    Capabilities of PostgreSQL are directly reflected by the regression test package.
    If a functionality, syntax, or feature exists in the regression test package,
    then it is supported; all others not listed in the package may not be supported
    by PostgreSQL! You may need to verify those and add them to the regression test
    package.


    # System Layout


    If you installed the PostgreSQL RPM, then the pgsql directory will be in /var/lib/postgresql,
    and the doc directory will be in /usr/doc/postgresql-x-x, where x-x-x is the version
    number of PostgreSQL. Therefore, you should add this directory to your shell command
    path. If you use a variant of the Berkeley C shell, as csh or tcsh, you would
    add:


    ```

    set path = ( /usr/local/postgresql/bin path )

    ```


    in the login file in your home directory. If you use a variant of the Bourne shell,
    such as sh, ksh, or bash, then you would add:'
