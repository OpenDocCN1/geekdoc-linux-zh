    This should be done in the system-wide login profile (/etc/profile) or alternately
    in each user''s individual .profile or .login (or whatever is appropriate for
    the shell in use). Unless there is compelling reason for a customized setup, all
    other environment variables Progress requires take appropriate default values
    based on $DLC. It is advantageous, however, to put the Progress executables in
