    # Sample Database Scenarios


    Here are a few examples of real-world scenarios implementing databases on Linux
    with the corresponding hardware resources recommended.


    # Scenario 1


    +   G: Assuming you want to install an Oracle database server eventually, you
    first want to install a Linux Server for it. Your database will be 50MB with growth
    expected to enlarge it by 50MB a year. You will also be providing Web services
    from this server to 100 users. What do you need?


    +   A: You want to have at least 256MB of RAM for this server and if possible,
    hardware RAID (or software RAID if not) on about 2GB of disk space for transactions
    and logging. You want a solid 10/100 network card; a single 500+ MHz CPU machine
    should be sufficient for the first year but most likely will be inadequate later
    on. Get a dual CPU machine for this if possible.


    # Scenario 2


    +   G: You are installing Informix, you have an 800MB database that will grow
    to 3GB this year, and double lookup every six months after that with 500 users
    doing many short lookup requests most of the time and 100 users adding data records
    constantly. What do you need?


    +   A: You want at least 4GB of RAM, 4GB of swap, and at least two processors
    along a large disk farm of at least 10-12 gigabytes to provide local live backups
    and lots of logging, transaction, and auditing space. You may want to go to an
    Alpha-based server to get the larger virtual memory size so you can keep the entire
    database in memory without need for swapping. If you exceed a 2GB user process
    size, you will need to go to the Alpha-based server for sure.'
