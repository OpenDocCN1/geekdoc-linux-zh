    # Terminal Setup—PROTERMCP


    Progress uses a curses-like library called Vermont Views (recognized by error
    messages prefixed with vr_) to screen drawing and painting so the TERM value must
    be set correctly. Progress has its own termcap-like configuration file called
    PROTERMCP defines the additional terminal attributes that standard termcap does
    not have. Primarily these revolve around the extensive function key and color
    capabilities of the Progress 4GL species.


    Definitions for many terminals are already provided in the PROTERMCP file shipped
    with the product. For Linux, an entry is provided for the Linux console under
    the linux terminal type (ones where codes reduce the viewable area). For X Terminal
    usage, the xterm type is assumed. Older space-taking terminals (Wyse 50, Televideo
    925, and so forth) are no longer supported. Watch out for the emulation on some
    realistically terminal emulators. The original keyboard layout of a real vt100
    had only four functions keys, and a real vt220 had predefined hardware uses for
    the first five function keys. Although some emulators give additional keys, Progress
    has the "real" keys in PROTERMCP file. You may either need to modify the PROTERMCP
    or switch to an emulation that has a full set of keys.


    Specific PROTERMCP entries are described in some detail in the Progress technical
    manuals and are beyond the scope of this book. But in general, there are some
    tips for working with PROTERMCP. Leave the original configuration file as is.
    Instead of modifying the original, make a copy of it and set a Linux environment
    variable called PROTERMCP equal to the fully qualified pathname of the new PROTERMCP
    file (this is a case where there is a reason to customize and override the default
    settings).


    Two other issues that can arise in terminal configuration are the Backspace key
    and the Linux interrupt. Progress expects'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# Chapter 8 Installing and Managing Progress on Linux


    character to Ctrl-H, even on DEC terminals where the backspace is really defined
