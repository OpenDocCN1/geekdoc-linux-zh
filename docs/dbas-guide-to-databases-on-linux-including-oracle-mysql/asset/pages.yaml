- img_proc: true
  md: '# A Brief History of Linux


    Linux has been in continuous development since its creation in 1991, when Linux
    Torvalds began writing a UNIX-based operating system for the Intel PC environment.


    As a graduate student at the University of Helsinki, Finland, Linux saw the advantages
    of a basic PC as a desktop system under the high cost of dumb terminals. At that
    time, however, the cost of desktop software and the required desktop operating
    system prohibited the average student and user from being able to afford a PC
    with all the necessary software products. In an effort to alleviate this problem,
    and extend the resources of the school at which he was working, Linux decided
    that he would work to redevelop Minix code (a microkernel-based clone of Unix)
    to create few simple utilities for himself. He felt it would be a worthwhile project
    if it simply allowed the school to use some old PCs as dumb terminals to connect
    to the main servers.


    Linux opened his project to the Internet community for additional development
    ideas and resources. In early 1992, only a few hundred were using Linux. The original
    Linux kernel was very compact and had only the most basic functionality. The Internet
    community quickly latched onto this project and helped its development in a truly
    grassroots fashion. So, hundreds and then thousands of programmers collaborated
    to help with code and break out on their own Linux code. This provided a very
    fast development with many eyes debugging and testing the code. Before long, Linux
    replaced the Minix code with his own code plus the contributions from other development
    volunteers. Taking advantage of the Open Source community, which was still in
    its infancy, Linux released it to the world.


    In terms of the development of utilities, there was and is still no "best design"
    of a utility. Anyone can contribute whatever he or she feels a useful utility.
    This is evident in the fact that there are several utilities that perform the
    same function; if you were already familiar with a specific utility, Linux would
    provide a fully functional counterpart for it. For example, there are a dozen
    or more file editors specified in text-based and Window versions.


    Nearly a decade later, Linux is beginning to find its place in the business community
    as a viable, and often superior, replacement to many other server and desktop
    operating systems. Linux has entered into and excelled at a newer area—that of
    a database server—as proven by the many alliances between various Linux vendors
    and some of the big data-base vendors like Oracle and IBM, to name a few. This
    introduces the strengths of Linux as a database server platform, examines several
    database solutions, and introduces a few examples of real-world applications.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# The Linux Kernel


    Linux was originally developed for recreational use and was always intended to
    be distributed for free. The Linux kernel and the related source code are made
    available to everyone and will continue to be free as long Linux holds the copyright
    to the kernel source. Linux is a registered trademark of Linux Torvalds and is
    collectively written under the terms of the General Public License (GPL) by its
    hundreds of contributing authors. The GPL allows anyone to freely distribute the
    full source code in its entirety, make copies thereof, and sell or distribute
    it (with a few exceptions) any way or she wishes. The GPL is supplied along with
    the Linux kernel [usr/src/linux/COPYING/] directory on the Linux CD-ROM, or it
    can be downloaded from many sites on the Internet.


    # NOTE


    Software under the GLP provides almost unlimited flexibility to users of the software,
    and frees them from the expensive license purchasing and tracking.


    The Linux kernel is just one small part of the whole thing collectively known
    as Linux. The kernel, as its name would imply, is the central, core piece to the
    operating system. You can think of the kernel as the engine of your PC; that which
    "makes it all run." The kernel handles I/O, performs memory management, and is
    basically the brains of the operating system. The kernel, though compact, is one
    of the key reasons why Linux is such a powerful and efficient OS.


    In addition to these central parts, you need many other components to build a
    complete and usable operating system. The power of an operating system can''t
    be fully tested without utilities to accomplish work like creating documents,
    sharing files, and installing, displaying, and printing files and documents. These
    utilities are freely available on the Internet, the same as the Linux kernel.
    Table 1.1 provides a very small sample of the utilities supplied with Linux.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# Chapter 1 • The Linux Operating System


    | Table 1.1 Basic UNIX Utilities Supplied with Every Linux Distribution |

    | Operation | Command Line or File |

    | File Manipulation | cp, mv, rm, ln, touch, ls, cat, more, >, >>, 2>, < |

    | Setup | ifconfig, mount, showmount,/etc/rootmap /etc/hosts |

    | Stats | ps, vm, nfs, innstat, netstat, top, who, users, pac, du |

    | Utilities | vi, pince, sed, awk, grep, find, netscape, tar, cpio, compress |

    | Network Services | DHCP, http, SMB, ftp, telnet, talk, imap, pop3, fingered,
    sendmail |


    All of these utilities and hundreds more are freely available on the Internet.
    You can download and install each one individually, or you can download the kernel
    and all of the required utilities in a single (albeit large) file. Instead of
    downloading, many software companies offer their versions of Linux on CD that
    can be bought at a local store. This is what the commercial versions are—a collection
    of programs and utilities, along with some of their own homemade utilities that
    make up their version or distribution of Linux.


    # The Future of Linux Development


    All the source code is freely available: even if Linux decides to stop working,
    else can easily take the source and continue the development. The kernel is one
    small, but very important part of the whole community that is Linux. Most of the
    hundreds of utilities have been contributed from the GNU project and elsewhere
    in the Open Source arena.


    Linux is not the only kernel developer in the world. There were many contributors
    to this point and there will be many more. Alan Cox is one notable contributor
    to kernel development in such areas as dealing with additional hardware and new
    CPU design requirements. Specifically, AMD is providing all the processor nuts
    and bolts of the Athletic processor to Alan Cox. Kernels released in the very
    near future should process at record speeds, as they will be optimized to run
    on an Athletic machine.


    # Linux Distributions


    Whenever you get a copy of Linux, either commercially or for free, you get what
    collectively is called a distribution. A distribution is one company''s collection
    of utilities for Linux along with the kernel and possibly some of their proprietary
    products, like database managers, firewall software, etc. A typical Linux distribution
    contains hundreds of standard UNIX-like utilities as well as an excellent set
    of development tools, games, databases,'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# The Linux Operating System • Chapter 1


    graphical display, and control utilities, as well as a windowing Graphical User
    Interface (GUI) called the X Window System.


    Some of these Linux distributions are not entirely free. The base of their system
    may be free but they charge for the extras that make their special version of
    Linux. There are commercial versions of Linux produced by companies like Debian,
    Red Hat, VA Linux, SuSE, and others. Under the terms of the General Public License,
    you can download a full copy of these Linux distributions at no cost. Distributions
    can usually be found on each company''s Web site, as well as from any of the many
    mirror sites on the Internet.


    # Why Pay for a Commercial Linux Version?


    The commercial versions offered bonuses that are not available with the free versions,
    although the actual media that is supplied may seem identical. The difference
    is usually in some value-added product or service that is included with the commercial
    product. For example, Red Hat Linux, when bought commercially from a retailer,
    includes 30-180 days of free installation support as well as a subscription to
    their update central Web service. The Debian Distribution provides unlimited support
    from its Web and fpt sites. You can also buy this support and update service on
    a yearly contractual basis from Red Hat and other providers. This is how Red Hat
    has its money and continues to pour that back into developing additional features
    for their product.


    Commercial versions are also more likely to be kept current and have a simplified
    installation and unified interface for you. In the early days of Linux, you were
    given a basic set of instructions on how to get the supplied Linux distribution
    installed. You then have to configure your files and printers, network and sound
    cards individually. Current releases almost always have an installation interface
    that may be color-oriented and menu-based (most common), or it may be GUI-oriented
    (X Window) like the current release of Red Hat.


    # The Difference between Linux and Other Operating Systems


    Linux is a UNIX clone that is written to POSIX-compliant wherever possible. Linux
    was originally written for the Intel platform but there are ports to PowerPC,
    Macintosh, Amiga, some Atari computers, and even the Palm Pilot. If you know the
    basic commands, file system layout, and general utilities of any other UNIX variant,
    you know them for Linux. If you are Microsoft Windows- or Macintosh-oriented,
    you may not be comfortable at first, but you will find that almost everything
    is similar.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# Feature Rich


    Not every Linux distribution has exactly the same set of utilities, but in general,
    the base features supplied with Linux are quite impressive to say the least. Since
    Microsoft Windows has had almost no competition at the desktop, their advertisements
    almost always speak to the improvements over their previous offerings, not their
    competition. Linux is a competitive operating system for the Intel or clone-based
    PC as both a workstation and server operating system. In fact, most of the improvements
    added to Windows NT over the past four years have been UNIX-like services that
    Linux has always supported.


    Some of the many features included with most Linux variants that make Linux a
    great database server are the:


    +   - Multitasking

    - SMP

    - 32- and 64-bit virtual memory models

    - Protected kernel mode

    - ELF standard binaries

    - Multi-user

    - Free GUI

    - Binary compatibility with other UNIX variants

    - Extensive network protocols and services support

    - All the standard UNIX network services like HTTP, FTP, Telnet, etc.


    # Multitasking


    Multitasking is an essential requirement of any server, especially a data-base
    server. With a true 32-bit Intel multitasking environment (64-bit on supported
    RISC CPUs), Linux has the ability to run multiple programs apparently "simultaneously"
    even on a single processor. The process, in reality, is a very fast round-robin
    — that is, each process waits its turn in line for the required resources. The
    particular method that Linux uses to handle the requests gives the impression
    of true multitasking. Many process threads can be started simultaneously and execute
    in parallel, offering excellent performance and optimization of I/O channels.


    # Symmetric Multiprocessor Support


    Out of the box, Linux will support between one, and in some cases, up to 16 CPUs,
    depending on the variant. This multiprocessor support makes Linux an excellent
    platform for a database server, able to handle many'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'threaded processes simultaneously. Almost all major vendors sell multi-processor
    servers specifically for database and Web services. The Linux kernel is well-designed
    to handle these multiple processors, providing nearly full utilization of each
    additional processor instead of a declining ratio as each new processor is added.


    # 32-Bit (and 64-Bit RISC) Virtual Memory


    Linux uses the full processor 32-bit memory management services to provide virtual
    memory of 4GB on Intel platforms and 16 exabytes when using 64-bit Linux on any
    RISC processor. Each new process gets an independent user-level process with 2GB
    of virtual space (available if required; in reality, it uses only RAM as needed
    to support the process). This provides security and independence between every
    process on the system.


    # Binary Compatibility: Standard Executable and Linking Format (ELF) Binaries


    Linux has embraced the standardized ELF-based binaries'' and shared libraries
    (similar to dynamic link libraries (DLL) but not compatible) application design
    strategy. This allows applications to run on multiple operating systems without
    need of recompilation. SCO UNIX 4.2, SVR4, AIX, Sun, and most Linux Intel-based
    versions are among the many UNIX variants that are moving toward this compatibility
    design. For example, Corel Draw! for SCO also runs under Linux.


    # Multi-User


    True multi-user capabilities provide for multiple users to run multiple processes
    on a single Linux server host. This should not be confused with "multiple access
    capability," which is what Microsoft Windows NT provides, in which multiple threads
    and processes run but without complete, separate user contexts.


    # Fully Protected Kernel Mode Operations


    The Linux operating system runs all applications in fully protected mode (no process
    can circumvent the operating system). No user application can interfere with any
    other user application unless it is specifically allowed, and there is no direct
    access to any hardware in Linux. These are the two main problems with DOS-type
    operating systems, which exacerbates its vulnerability to viruses and other security
    problems.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Free X Window GUI


    The Linux Graphical User Interface is a completely free GUI, based on an XFree86
    standard version of the X Window System (most existing X-based programs will run
    under Linux without any modification). The X Window System has been around since
    the early 1980s, predating the Microsoft Windows designs. You may even notice
    the new look of Win9x / NT is very similar to the X Window standard that has been
    around for quite a bit longer.


    # Limited DOS / Windows Application Support or VMware


    Supplied with most versions of Linux is a DOS Emulator package called DOSEMU and
    a Windows Emulator package called WINE. Both of these packages provide Support
    for basic, "well-behaved" applications which don''t try to bend rules directly
    accessing hardware or using undocumented APIs.


    Another bright spot for Linux is a Virtual Machine Emulation package called VMware.
    VMware 3.x / 9.x / NT support allowing Linux to be a host operating system with
    one or more of these guest operating systems installed in a virtual world, sharing
    with the Linux OS local memory and hardware resources equally and at the same
    time. You literally can have both Linux and one or more Windows Operating Systems
    running at the same time on the same machine in different X Window Panels! This
    means you could provide either desktop to all users on the network on any relatively
    powerful PC (i.e., with the proper hardware: 266+ MHz, 96+ MB RAM, plus disk space).
    Note that VMware offers the equivalent machine product for NT. You can install
    Linux as a guest OS on NT and run both desktops together from a Windows window.
    You can download a 30-day free trial version from www.vmware.com for either OS.


    # Extensive Networking Support


    Perhaps the biggest selling point for any Linux version is the extensive networking
    support provided. This includes native protocols and application-level support
    for almost all other network operating systems commonly used on PC hardware. Additionally,
    there is extensive media support for various types of interfaces other than Ethernet
    and Token Ring, like ISDN and even Ham Radio support.


    Full native protocol support is supplied for Macintosh, DOS, Windows NT / 3.xx,
    Novell, and OS/2 networking through various add-on packages, making Linux appear
    like a native server or client to these other OS versions.'
