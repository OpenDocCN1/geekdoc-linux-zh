    # Troubleshooting—Postmaster Startup Failures


    There are several common reasons for the postmaster to fail to start up. Check
    the postmaster''s log, or start it by (without redirecting standard output or
    standard error) to see what messages appear. Some of the possible error messages
    are reasonably self-explanatory, but here are those that not:


    ```

    FATAL: StreamServerPort:bind(failed): Address already in use

    ```


    ```

    Is another postmaster already running on that port?

    ```


    This usually means just what it suggests: you accidentally started a second postmaster
    on the same port where one is already running. However, if the kernel error message
    is not "Address already in use" or some variant of that wording, there may be
    a different problem. For'
  merge: -1
  pgno: 435
- img_proc: true
  md: '# PostgreSQL on Linux Chapter 401


    example. trying to start a postmaster on a reserved port number may draw something
    like:


    ```

    $ postmaster -i -p 666

    FATAL: StreamServerPort: bind( ) failed: Permission denied

    Is another postmaster already running on that port?

    ```


    IpcMemoryCreate: shmget failed (Invalid argument) key=5440001,

    size=83918612, permission=600

    FATAL 1: ShmemCreate: cannot create region


    A message like this probably means that your kernel''s limit on the size of shared
    memory areas is smaller than the buffer area that Postgres is trying to create.
    (Or it could mean that you don''t have SysV-style shared memory support configured
    in your kernel at all.) As a temporary workaround, you can try starting the postmaster
    with a smaller-than-normal number of buffers (-B switch). You will eventually
    want to reconfigure your kernel to allow the shared memory size, however you may
    see this message when trying to start multiple postmasters on the same machine,
    if their total space requests exceed the kernel limit.


    IpcSemaphoreCreate: semget failed (No space left on device) key=5440026,

    num=16, permission=


    A message like this does not mean that you''ve run out of disk space; it means
    that your kernel''s limit on the number of SysV semaphores is smaller than the
    Postgres wants to create. As before, you may be able to work around the problem
    by starting the postmaster with a reduced number of back-end processes (-N switch),
    but eventually you''ll want to increase the kernel limit.


    # Client Connection Problems


    Once you have a running postmaster, trying to connect to it with client applications
    can fail for a variety of reasons. The sample error messages shown here are for
    clients based on recent versions of libpq; clients based on other interface libraries
    may produce other messages with more or less information.


    ```

    connectDB() - connect() failed: Connection refused

    is the postmaster running (-i) at ''server.joe.com'' and accepting connections
    on TCP/IP port ''5432''?

    ```


    This is the generic “I couldn''t find a postmaster to talk to” failure. It looks
    like the earlier example, when TCP/IP communication is attempted,'
  merge: -1
  pgno: 436
- img_proc: true
  md: '# 402 Chapter 9 • PostgreSQL on Linux


    or like the following, when attempting UNIX-socket communication to a local postmaster:


    ```

    connectDB() -- failed: No such file or directory

    ```


    Is the postmaster running at ''localhost'' and accepting connections

    on Unix socket ''5432''?


    The last line is useful in verifying that the client is trying to connect to where
    it is intended. If there is, no postmaster running there, the kernel error message
    typically will be either "Connection refused" or "No such file or directory,"
    as illustrated. (It is particularly important to realize that "Connection refused"
    in this context does not mean that the postmaster got your connection request
    and rejected it—that could produce a different message, as shown.) Other error
    messages such as "Connection timed out" may indicate more fundamental problems,
    like lack of network connectivity.


    ```

    pg_hba.conf entry for host 123.123.123.123, user joblow, database testdb

    ```


    This is what you are most likely to get if you succeed in contacting a postmaster,
    but it doesn''t want to talk to you. As the message suggests, the postmaster refused
    the connection request because it found no authorizing entry in its pg_hba.conf
    configuration file.


    Password authentication failed for user ''joblow''


    Messages like this indicate that you contacted the postmaster, and it''s willing
    to talk to you, but not until you pass the authorization method specified in the
    pg_hba.conf file. Check the password you''re providing, or check your Kerberos
    or IDENT software if the complaint mentions one of those authentication types.


    ```

    FATAL 1: SetUserId: user ''joblow'' is not in ''pg_shadow''

    ```


    This is another variant of authentication failure: no Postgres create_user command
    has been executed for the given username.


    ```

    FATAL 1: Database testdb does not exist in pg_database

    ```


    There''s no database by name that exists under the control of this postmaster.
    Note that if you don''t specify a database name, it defaults to your Postgres
    username, which may or not be the right thing.


