  md: '# ODBC, JDBC, and ODBC Drivers


    PostgreSQL users may ask the DBA to install the database access drivers such as
    ODBC, JDBC, and so on. ODBC (Open DataBase Connectivity), established by Microsoft,
    is a popular standard for accessing information from various databases from different
    vendors. Applications written using the ODBC drivers are guaranteed to work with
    various databases like PostgreSQL, Oracle, Sybase, and Informix.


    +   - PostODBC is already included in the distribution, on the PostgreSQL CD-ROM.
    See the main Web site, http://www.postgresql.org.

    - Open Link Software Corporation (http://www.openlinksw.com) is selling ODBC for
    PostgreSQL and other databases. Open Link is also giving away free ODBC (limited
    seats)—check them out.

    - Insight ODBC for PostgreSQL (http://www.insightdict.com/psqldbc). This is the
    official ODBC site.

    - FreeODBC package (http://www.ids.net/-bjepson/freeODBC/). This is a free version
    of ODBC.


    ODBC is a static version of ODBC, independent of driver managers and DLL support,
    used to embed database connectivity support directly into applications.


    +   - Open Link Software Corporation (http://www.openlinksw.com) is selling ODBC
    for PostgreSQL and other databases. Open Link is also giving away free ODBC (limited
    seats)—check them out.


