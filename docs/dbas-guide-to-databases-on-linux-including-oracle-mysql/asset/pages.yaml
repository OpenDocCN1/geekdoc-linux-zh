- img_proc: true
  md: 'architecture is big enough for NT to enable it to run as fast as a UNIX or
    other platform, then SQL Server may have a chance in this arena. Until then you
    will notice significant performance differences between UNIX and NT, and of course,
    Linux. NT will tend to perform well using Informix in small workgroups, but better
    performance ratios are found in UNIX and Linux.


    Preference usually follows lines of exposure. If a developer is exposed to Informix
    first, that developer most likely continue to support Informix out of personal
    preference. This is especially true once you see how easy Informix is to manage
    compared to some of the other products on the market. The reason is simplicity:
    A typical Oracle instance takes approximately 600MB of disk space for the software,
    not to mention the additional space needed for databases. A typical Oracle installation
    is far more complicated than Informix, not only in software layout, but also in
    configuration. Simply take a look at the Oracle software directory and you can
    see the difference once you installed Informix next to it.


    Oracle can take much longer to install and configure than Informix, not to mention
    the performance limitations when compared to Informix. Oracle is your first engine,
    and Informix your second, you may be surprised at how simple it is. If Informix
    is your first engine, the Oracle software is a worthwhile learning experience.


    Informix takes up considerably less space than Oracle—the engine and core developer
    SDK tools typically take up less than 150MB. However, this can vary depending
    on the additional components a developer can add to the Informix software directory,
    well known in UNIX as the $INMIXDIR. We will go into detail describing the $INMIXDIR
    environment variable as well as everything you need to get Informix up and running
    quickly, and professionally, in this chapter.


    Typically, an Informix installation can be done in two hours or less; much of
    this depends on a little bit of advanced planning. The more you plan ahead, the
    faster the install can be. Although Informix engines are simple to install, they
    also require you to spend a little time understanding the ramifications of how
    you set things up. Bear in mind this is true for any software product, or any
    database product.


    I will show you a good basic layout that you can expand on, which will work for
    almost any engine Informix sells, the only exception being their Standard Engine,
    which we are not covering in this chapter. Standard Engine (SE) is an engine that
    does not take advantage of the shared memory features of Informix Dynamic Server,
    nor many of the other features Dynamic Server over Standard Engine.


    Standard Engine has a few advantages for small shops and software deployments
    where the requirements of operation need little to no human intervention, or where
    the data requirements are very small or simple.'
