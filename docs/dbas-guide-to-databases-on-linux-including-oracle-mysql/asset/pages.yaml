  md: '# Chapter 5 Installing and Utilizing Sybase on Linux


    (approximately 300MB). The final two Linux native partitions should be left without
    a file system and each should be about 50MB in size. This partition will hold
    the master and syssystprocs devices for Sybase. Partition the second and third
    SCSI hard drive as one large Linux native drive (the entire size of the disk),
