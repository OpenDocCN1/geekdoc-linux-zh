  md: '# 36 Chapter 8 Installing kill and Managing Progress on Linux


    In summary, kill -9 will inevitably crash your database sooner or later—it''s
    like playing Russian Roulette. It will not, by itself, corrupt your database.
    It does, however, lay the groundwork for other activities to be executed, which
    may damage your data. If you feel that you must kill a process first, use kill
    -2, then, if necessary, kill -1. If you need more than that then something is
    very wrong and you should get help.


    # Strengths and Weaknesses


    Like all products, Progress is not perfect. Although it offers a large set of
    features that only the enterprise class databases have, it does lack some of the
    most expensive options available on the “Big Four.” Here is a discussion of where
    Progress shines, and where it is lacking.


    # The 4GL


    In many ways the Progress 4GL (fourth generation language) is both its greatest
    strength and a weakness combined. The 4GL is a procedural language designed to
    write an entire application. From the very start PSC has made good on that promise
    as witnessed by the number of applications available from their partners, each
    without any significant usage of 3GL (third generation language). These are not
    just small products either, but industry-leading products from software houses
    like FiServ; qad, inc.; Sync; and NXT.


    On the other hand, 4GLs are seen as proprietary and closed. Progress'' product
    is no exception, and in fact, the lack of reasonable ODBC drivers has until recently
    added to the closed nature of the product. To some extent this is a red herring
    in fact all databases have their own proprietary SQL extensions, and code transportability
    is limited to only a small subset of the application.


    # OLTP Oriented


    From the start, the database engine was built to be a transaction engine. In fact,
    unlike other databases, it is impossible to modify data and not use a transaction—very
    high data integrity results. The 4GL also features that make sense in an OLTP
    world. SQL traditionally is set related, meaning records are gathered together
    at a set at time and processed. For online applications, this is not as efficient
    or natural as the 4GL that focuses on accessing a single record and making it
    available to the application immediately.


    There is a down side to the pure OLTP model however, and that is Decision Support.
    Set-oriented access by far outperforms individual'
  merge: -1
