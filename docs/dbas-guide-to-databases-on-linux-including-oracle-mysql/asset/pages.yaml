  md: '# PostgreSQL Quick-Install Instructions


    Even though PostgreSQL is the most advanced and most sophisticated database system
    in the world, installing PostgreSQL is not at all complex, and in fact, installation
    takes less than five minutes with binary RPMs. PostgreSQL needs a bare minimum
    of 40MB disk space and 8MB of RAM. But nowadays, even low-cost PC systems are
    shipping with 10GB hard disks and 64MB RAM. This section gives you a bird''s-eye
    view of the installation process. If you have had some experience with Linux and
    Red Hat RPM packages, you can complete PostgreSQL installation in just minutes
    by simply following the next steps. If you are a novice to Linux/UNIX, then cross-reference
    this section with the next section, "Detailed Instructions," which explains in
    detail each one of the steps.


    On Red Hat Linux systems, use the following steps. On Debian Linux, the steps
    will be similar, but replace .rpm with .deb. On Debian Linux, if you do not have
    PostgreSQL packages then you can convert Hat PostgreSQL RPM packages to Debian
    packages using the rpm2deb program.


    Login as root and give the following commands at the bash prompt:


    ```

    # cd /mnt/cdrom/Red Hat/RPMS


    # man rpm


    # ls postgres*.rpm (to see list of packages)


    # rpm -qpi postgres*.rpm | less (to see info of package)


    # rpm -qpl postgres*.rpm | less (to see list of files inside each package)


    # ps -auxw | grep postmaster

    ```


    If the postmaster is running then exit all the PostgreSQL applications and stop
    the postmaster process.


    ```

    # cat /etc/passwd | grep postgres

    ```


    > NOTE

    If you see a postgres user, you may need to back up and clean up the postgres
    home directory ~postgres and delete the UNIX user postgres, or rename the UNIX
    user postgres to something like postgres2. It must be a clean-slate install.


    Install the required postgresql packages—you must install all packages of clients,
    data, and server for pgaccess to work.'
  merge: -1
