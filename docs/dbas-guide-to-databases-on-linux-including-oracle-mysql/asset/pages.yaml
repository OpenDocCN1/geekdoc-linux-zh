  md: '# Chapter 5 • Installing and Utilizing Sybase on Linux


    Choose each one and allow them to be configured. When finished, press Ctrl-A several
    times to exit the syhibit application.


    Many client applications expect the SYBASE environment variable to be set to the
    root of the Sybase installation tree so that they can find the interfaces file
    and some of the other files. If many users on your machine are likely to be executing
    client software from this or other Linux machines, make sure that you put the
    following line in /etc/profile so this variable gets set for everyone:


    ```

    export SYBASE=/opt/sybase

    ```


    Also be aware that some scripts and servers that will be accessing the server
    through the client libraries in C or in Perl will be looking for this environment
    variable. If odd behavior is happening from your CGI syperl scripts or from open
    client applications that they can''t connect to the server, check that they have
    the SYBASE variable in their environment.


    # Starting the Database Server and Backup Server on Boot


    At this point both your database server and your backup server should be up and
    running successfully. For an independent database server, however, you would want
    these servers to start at boot time. Sybase''s installation created a file at
    /etc/init.d/sybase, which is an rc startup script compatible with Red Hat''s standard
    method of starting and stopping services at boot and shutdown. To make Sybase
    start at boot time and properly terminate at shutdown, you would need to create
    symbolic links to this file in /etc/rc.d/rc0.d, /etc/rc.d/rc3.d, /etc/rc.d/rc5.d,
    and /etc/rc.d/rc6.d, respectively. The meaning of these directories is beyond
    the scope of this chapter, but the following set of commands will ensure that
    Sybase starts on boot and terminates on shutdown properly. These commands must
    be executed as root.


    ```

    #cd /etc/rc.d/rc0.d

    #ln -s .../init.d/sybase K05sybase

    #cd /etc/rc.d/rc3.d

    #ln -s .../init.d/sybase S95sybase

    #cd /etc/rc.d/rc5.d

    #ln -s .../init.d/sybase S95sybase

    #cd /etc/rc.d/rc6.d

    #ln -s .../init.d/sybase K05sybase

    ```


    After successfully executing these commands, all Sybase Database and Backup Servers
    on this machine will be started at the next boot time.'
