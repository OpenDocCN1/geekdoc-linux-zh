- img_proc: true
  md: 'Q: The Oracle installer fails and complains about a missing program called
    gmake. Why?


    A: Check to see if you have gmake installed under /usr/bin. If it is installed,
    make sure your PATH includes /usr/bin. If gmake does not exist, as root you can
    create a symbolic link to make: in -s /usr/bin/make /usr/bin/gmake.


    Q: Where is the file libcintsh.so.8.0?


    A: The libcintsh.so.1.0 for Oracle8 and the libcintsh.so.8.0 for Oracle8i be generated
    by using the script gencintsh located in $ORACLE_HOME/bin, although it should
    have been created during installation. Run gencintsh if you have problems connecting
    between 8.1.5 and 8.0.5 machines.


    Q: Where can I get more information about Oracle?


    A: The Oracle Technology Network (http:// /technet.oracle.com) provides documentation
    on all of Oracle''s products. Book publisher O''Reilly (http://www.oreilly.com/)
    has an excellent collection of well-written Oracle books. Oracle: The Complete
    Reference by George Koch and Kevin Loney is a large book that is a useful reference.


    Q: Where can I find an Oracle user group group?


    A: The International Oracle User''s Group (http://www.ioug.org/) maintains a list
    of Oracle user groups.'
