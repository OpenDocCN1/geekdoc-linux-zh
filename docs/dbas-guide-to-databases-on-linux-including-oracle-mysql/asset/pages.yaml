    3 active, 2047 maximum


    As you can see, rootdbs has gained some space. It now has almost 17MB free, more
    than enough to handle the engine, made up of the sysmaster database and the sysutils
    database, which is used to manage Informix backups.


    From here we have a couple more steps, and your system will be operational.


    # Tempdbs


    Informix engines must have a workspace for sorting queries, and a place to put
    temporary tables. If you do not specify a place for this to occur, the engine
    will use /tmp, and its own name, called INFORMIXTEMP, usually placed in the /
    directory. This is not good: We need to create a tempdbs to allow our system to
    control where temp tables and sorts will occur.


    Creating this dbspace is a little different. We must tell the engine to use this
    as a temporary dbspace; otherwise it will treat it as a regular dbspace. We may
    add the -o option to do this:


    ```

    $ onspaces -c -t -d tempdbs -p /opt/data/tempdbs -o 0 -s 102400

    rebel:root # onspaces -c -t -d tempdbs -p /opt/data/tempdbs -o 0 -s 300000

    Verifying physical disk space, wait please...

    Space successfully added.

    rebel:root # ls -1

    ```'
