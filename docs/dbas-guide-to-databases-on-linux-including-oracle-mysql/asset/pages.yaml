  md: '# Installing and Managing Progress on Linux • Chapter 8 347


    record retrieval when large report and forecasting is the wall. ODBC report writers
    almost always expect such features as well as SQL execution. Progress supports
    the older SQL 88 specification, but it is not optimized for this type of access.
    Reports still run workable, but in many cases inefficient and poorly written SQL,
    and computer-generated SQL in particular, it does not run as fast as native 4GL
    for the reports.


    This is in a state of change, though. Version 9 has slowly introducing the newly
    written SQL-92 engine. PSC has written an entirely new product that sits on top
    of the same storage manager as the current 4GL product. The new product not only
    follows the newer standard language, it is optimized for SQL execution. This new
    product will become commercial with version 9.1 of Progress.


    # Bullet-Proof Crash Recovery


    In the Progress sales force, there is an old story of how representatives were
    trained to prove the reliability of the database. Demonstrations were done on
    portable computers running DOS. There has always been concern on that platform
    the operating system clobtering open files. While in the middle of the demonstration,
    sales reps would purposefully pull the power cord from the wall, without battery
    power, and crash the machine. Without exception, the database would be undamaged
    and crash recovery successful. The technology that goes into Progress processing
    is the same one that keeps the database going without fear of power failure corrupting
    the database. This should not be seen as a panacea for hardwareable failure. All
    databases will lose data if the physical media is unrecoverable by the hardware.


    # Cost of Ownership


    Progress is priced in the range that ordinary companies can afford—not only in
    terms of the initial purchase, but also in terms of what it takes to keep a system
    running. Most Progress installations today do not have a full time database administrator.
    The database does not need to be configured in many cases unless a significant
    increase in the number of users occurs. Most Progress administrators share their
    time between an hour or two monitoring their database and other mundane system
    administration tasks. A system that can scale to several thousand users and be
    operational with minimal database administration is a remarkable achievement.


    PSC authorized the Aberdeen Group to evaluate both initial and longterm term costs
    to run the Progress database compared to databases aimed at both large and small
    environments. The results can be viewed at the Progress web site, http://www.peg.com.'
