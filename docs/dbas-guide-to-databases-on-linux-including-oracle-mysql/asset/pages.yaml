    # ## Data Flow


    When the user first connects to the Web site, a session is created for him and
    he is provided with a cookie that contains a single value, **session_id**. This
    session_id** contains a unique number that is keyed to the primary key of the
    session''s database. (In this case, we are simply allowing MySQL to auto-increment
    the primary key; we do not recommend that this practice be followed for reasons
    explained in the security section.)'
