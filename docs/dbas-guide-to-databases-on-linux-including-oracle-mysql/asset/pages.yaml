- img_proc: true
  md: '# Chapter 3 - Installing and Running Oracle on Linux


    Interfacing with WebDB is accomplished through standard Internet-based protocols.
    The client does not need special libraries or network software to connect to the
    WebDB server. WebDB builds the skills that DBAs already possess. WebDB is suitable
    for an intranet site where users regularly interface with the database. It is
    useful to the DBA, end-user, and developers.


    # Third-Party Software


    There are a number of third-party applications supporting Oracle for the Linux
    platform. Four applications will be mentioned in this section, including Orosoft
    SQLWork, Orosoft Object Manager, Orac, and Perl DBI.


    # Orasoft


    Orasoft (www.orasoft.org) is an active open-source project to bring high-quality,
    enterprise-level applications to the Linux platform. At press time, there are
    five applications including SQLWork, Procedit, Session Monitor, Table Browser,
    and ObjectManager. SQLWork is an SQL worksheet, Procedit is used to edit PL/SQL
    code, Session Monitor is used to monitor database connections, Table Browser is
    used to browse Oracle tables. ObjectManager is the newest member of the application
    suite, and is designed for database administration. Session Monitor and Table
    Browser functionality are being rolled into ObjectManager.


    # SQLWork


    SQLWork is a graphical SQL worksheet, providing a friendly graphical interface
    to Oracle (see Figure 3.8). It is written using the GIMP Toolkit (GTK), preinstalled
    on most Linux distributions. There are many features available including history,
    bookmarks, printing, and exporting to file. Results can be viewed free-form or
    using a grid layout, similar to a spreadsheet. The history feature provides a
    buffer to store previous commands. The bookmark feature allows you to save SQL
    statements for later use, similar to a Web browser. Query results can be saved
    to file or printed.'
