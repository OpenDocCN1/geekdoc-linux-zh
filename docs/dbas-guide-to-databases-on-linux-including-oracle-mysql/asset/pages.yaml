    # Installing Oracle8i


    The installation of Oracle8i is tricky because you must maneuver around

    bugs in the installation routine for version 8.1.5. The goal is to install the

    Oracle software first, install patches, create an actual database called

    orcl, and then start the instance.


    The following installation instructions were performed on a system

    with a fresh copy of Red Hat Linux 6.1, including all available patches.

    Expect the Oracle Universal Installer (OUI) to gorge itself with memory.

    You should have at least 128MB of RAM and sufficient swap space before

    bey you begin the installation. To recap: Make sure the Java JRE is installed

    and the symbolic link /usr/local/jre exists. Make sure you have an ora-

    cle account, a dba group, and an installer group. Oracle should be a

    member of groups, install being the primary group listed in

    /etc/passwd. Make sure the Oracle environmental variables exist using

    the env command.


    # WARNING


    > There have been problems running the installer over the default version of

    enlightenment installed with Red Hat Linux 6.0. Enlightenment is the

    default window manager installed under Gnome. If you run into problems

    with the Oracle Universal Installer, you might want to upgrade

    enlightenment or replace it with Sawmill. You can also switch to fvwm

    KDE.


    Login as the oracle user to perform the installation, and mount the

    CD-ROM containing the software. The assumed mount point for the CD-

    ROM is /mnt/cdrom. If you downloaded the software, replace

    /mnt/cdrom with the directory where the software is installed.


    +   1. Change to the Oracle CD-ROM or installation directory.


    +   2. The Oracle8i Installation Guide for Linux says to run the

    runInstaller script. The runInstaller script doesn''t function

    under Red Hat Linux 6.1, so you must use the runIns.sh script

    located under /mnt/cdrom/install/linux.'
