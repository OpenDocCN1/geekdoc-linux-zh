  md: '# Chapter 4 · An Informix Installation on Linux


    The physical log was originally 1MB in size, this being the default at the engine
    install. Now we can see it has used up all a few bytes in our new 200MB physdb.
    You''ll see that rootdbs gained 1MB in available free space. As we roll out our
    logical logs, rootdb will gain even more space. If you look in your /opt/data
    directory you will see the new physical log db you created, as another cooked
    file:


    ```

    rebel:root # ls -1

    total 40643

    drwxr-xr-x 2 informix informix 1024 Jan 24 11:14 .

    drwxr-xr-x 17 root root 1024 Jan 18 10:22 .

    -rw-rw-r-- 1 informix informix 20971520 Jan 24 12:25 physdb

    -rw-rw-r-- 1 informix informix 20480000 Jan 24 12:25 rootdbs

    ```


    Physdb is also slightly physically than rootdbs—this is because all our commands
    refer to KB sizes rather than MB sizes. 20000KB equates to 20480MB, the install
    size we gave to the rootdbs. 20480KB equates to 20971520 bytes, the actual size
    of physdbs, which we created when we used the onspaces command using KB sizes,
    not MB sizes.


    In most cases, almost without exception, Informix commands are going to refer
    to information in KB, not MB. It is important to pay attention to this characteristic
    of Informix commands that you are using them in the right context; that is, you
    think first in KB, not MB. You can think in MB but only in terms of converting
    the KB to MB.


    # Logdbs


    Now let''s create a logdbs for our logical logs, currently residing in rootdbs.
    Make sure your engine is in quiescent mode, and then follow to create the logdbs.


    We are going to create 20 logical logs, 1MB each, so we need a logical log dbspace
    of at least 26MB if not more, and it''s a great idea to make it a little larger
    so you can add more logs as you need. Our first logdbs is going to be 50MB, to
    allow some room for growth. We have six logical logs in the rootdbs and we want
    26, so we will create 20 new ones.


    ```

    rebel:root # onspaces -c -d logdbs -p /opt/data/logdbs -o 0 -s 50000

    ```


    Verifying physical disk space, please wait ...nSpace successfully added.


    > ** WARNING ** A level 0 archive of Root DBSpace will need to be done.

    rebel:root # ontape -s -L 0'
