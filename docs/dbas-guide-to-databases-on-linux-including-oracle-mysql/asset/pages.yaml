    Oracle performs significantly better with more RAM, which makes sense considering
    that the more things it can store in memory, the fewer trips it will make to the
    physical drives. Oracle also performs significantly better with more drives, because
    there is less contention between files. The most important method of improving
    performance in Oracle is to add more RAM. The second most important method is
    to add more disks. Relational databases are usually IO-bound.


