- - '##'
  - 预读变量
- - '###'
  - 'DBSPACETEMP:'
- - '###'
  - 等于 SE 的 DBTEMP。这是 Dynamic Server 用来创建表的 dspaces 列表。
- - '###'
  - 如果指定，或者指定的 dspaces 无效，即时查询将在 /tmp 中创建临时文件。
- - '##'
  - 'DUMP*:'
- - '###'
  - 当 Dynamic Server 操作发生意外错误（断言失败）时，以下参数控制保留诊断信息的类型。
- - '###'
  - DUMPSHMEM 和 DUMPCORE 表示是，0 表示否。
- - '##'
  - Dynamic Server 用于确定当前时间的方法
- - '##'
  - 并行数据库查询 (pdq)
- - '##'
  - OPTCOMPIND
- - '###'
  - 0 => 在可能的情况下，嵌套连接优于排序连接和哈希连接。
- - '###'
  - 1 => 如果事务隔离模式不是“可读”，优化器的行为如译文 (2)。
- - '###'
  - 否则，行为如上文 (0)。
- - '###'
  - 2 => 无论事务隔离模式如何都使用成本。嵌套连接并不优先。
- - '##'
  - 优化器完全根据成本做出决策
- - '##'
  - HETERO_COMMIT（网关在分布式事务中的参与）
- - '###'
  - 1 => 启用异构提交
- - '###'
  - 0（或任何其他值） => 禁用异构提交
- - '##'
  - 优化目标：-1 = ALL_ROWS（默认），0 = FIRST_ROWS
- - '##'
  - 优化器 DIRECTIVES （1/默认）或关闭（0）
