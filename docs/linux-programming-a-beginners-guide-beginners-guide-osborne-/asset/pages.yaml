  md: '# Module 9: GNOME


    # Hint


    Though developed in ANSI C, there are wrappers available in other languages for
    the GNOME and GTK+ libraries. There are wrappers for most languages, including
    Ada, Scheme, Python, Perl, Dylan, Objective-C, and C++, of course.


    # Note


    GNOME applications make use of GNOME, GTK+ Toolkit, GGTK Drawing Kit, and GNU
    libraries. For detailed descriptions of the functions, definitions, and structures
    contained in these libraries, it strongly recommended that you use the extensive
    documentation available on the GNOME developer''s Web site at developer.gnome.org.
    The Documentation includes detailed tutorials, manuals, and reference works, including
    the complete reference for the GNOME, GTK, and CDK APIs.


    Programs written to work on GNOME are essentially C programs that contain GNOME
    and GTK+ functions. The GNOME and GTK+ functions handle the GNOME desktop operations
    for a program. When programming for GNOME, you will make use of a very extensive
    set of functions and structures contained in many libraries—these functions and
    structures make up the different components that go into a GNOME application.


    This module can provide only a general overview of these libraries and how you
    use them to create GNOME programs. Though GNOME is not as easy as Tk, programming
    in GNOME requires the use of only a few functions to create simple user interfaces.
    You can think of GTK+ as lower level operations and GNOME functions as easy-to-use
    higher level operations. The GNOME functions usually incorporate several GTK+
    functions, making GUI tasks relatively easy to program. A GNOME program is essentially
    a C program with GTK+ functions as well as GNOME functions. Because basic GNOME
    operations are handled by GTK+ functions, this module begins with basic GTK+ programming,
    and then discusses GNOME programs.


    The GNOME libraries provide the highest level functions used in GNOME applications.
    Below them are the GTK+ libraries. GTK+ is the toolkit developed for the GNU Image
    Manipulation Program (GIMP).'
