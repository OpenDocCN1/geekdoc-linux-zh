- img_proc: true
  md: "# 272 Linux Programming: A Beginner's Guide\n\nTo run Expect commands, you\
    \ must first enter the Expect shell.\nin the preceding script, the Expect shell\
    \ is invoked with the command #!/usr/bin/expect.\nThe expect command can take\
    \ two arguments: the pattern to expect and an action to take if the pattern is\
    \ matched. The expect command can also take its argument as block of pattern/action\
    \ arguments. In this case, the expect command can match on alternative patterns,\
    \ executing the action only for the pattern it receives. For example, the fit\
    \ command may return a \"connection refused\" string instead of a \"name\" string.\
    \ In that case, you would want to issue this message and exit the Expect script.\
    \ If you want more than one action for a pattern, you can enclose the actions\
    \ in braces, separated by semicolons.\nExample of such an expect command follows:\n\
    \n```\nsend \"open argv\"\nexpect {\n    \"connection refused\" {puts \"Failed\
    \ to connect\"; exit}\n    \"name\" puts \"connection successful\"\n}\n```\n\n\
    Another useful Expect command is timeout. You can set the timeout command to a\
    \ number of seconds, and then have expect check for the timeout. To set the number\
    \ of seconds for a timeout, you use set to assign the number to the timeout variable.\
    \ Have the expect command detect a timeout, use the word timeout as the expect\
    \ command's pattern. With the timeout, you can add an action for the shell to\
    \ take. In the following example, a timeout has been added to the Tcl script:\n\
    \n```\nset timeout 20\nsend \"open argv\"\nexpect {\n    timeout {puts \"Connection\
    \ timed out\"; exit}\n    \"connection refused\" {puts \"Failed to connect\";\
    \ exit}\n    \"name\" puts \"connection successful\"\n}\n```"
  merge: -1
  pgno: 295
