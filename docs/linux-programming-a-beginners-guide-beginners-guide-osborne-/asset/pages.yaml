    gint gtk_signal_connect( GtkObject *object, gchar *name, GtkSignalFunc func, gpointer
    func_data );

    ```


    When a signal is detected for the specified object, its associated callback function
    is called and executed, as shown in this syntax statement:


    ```

    void callback_func( GtkWidget *widget, gpointer callback_data );

    ```


    Therefore, to associate a click on a button with the hello function, you will
    use the gtk_signal_connect statement:


    ```

    gtk_signal_connect( GTK_OBJECT(button), "clicked", GTK_SIGNAL_FUNC(hello), NULL
    );

    ```


    The object is mybutton, clicked is the click signal, and hello is a function programmer
    to be executed when this signal is detected. GTK_OBJECT and GTK_SIGNAL_FUNC are
    macros that perform type checking and casting to make sure the objects are passed
    with the appropriate types.


    Certain objects have signals that can be associated with them. For example, the
    button object can be associated with a clicked signal or an enter signal. The
    clicked signal occurs when a user presses down and then releases the mouse button,
    whereas an enter signal occurs when the user moves the mouse pointer over the
    button object. The button signals are the following:


    +   - pressed Mouse button is pressed down when pointer is positioned on the button.


    +   - released Mouse button is released when pointer is positioned on the button.


    +   - clicked Mouse button is pressed down and released when pointer is positioned
    on the button.


    +   - enter Mouse pointer is moved onto the button.


    +   - leave Mouse pointer is moved off the button.'
