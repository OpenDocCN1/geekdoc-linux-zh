    make decisions on which commands you want to execute.


    +   - Place traps in your program to handle interrupts.


    You can find out more about TCSH from your online manual (at the command prompt,
    enter the man command with the term tsh (like so: man tsh).


    The TCSH shell differs from other Linux shells in that control structures conform
    more to a programming language format. For example, the test condition for a TCSH
    shell''s control structure is an expression that evaluates to true or false, not
    to a Linux command. In addition, a TCSH shell uses the same operators as found
