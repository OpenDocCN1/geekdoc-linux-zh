  md: '# Linux Programming: A Beginner’s Guide


    There are two ways of thinking about GAWK. It is a filter that you can invoke
    on the command line, like any other filter, and it can also be used to create
    your own filters.


    A filter, in Linux, reads information from an input source, such as a file or
    the standard input, modifies or analyzes that information, and then outputs the
    results. Results can be a modified version of the input, or an analysis of the
    input. For example, the sort filter reads a file and then outputs a sorted version
    of it. The wc filter reads a file and then calculates the number of words and
    lines in it, outputting that information. With GAWK you can design and create
    your own filters, in effect creating your own commands. You can instruct GAWK
    to simply display lines in a text, like cat, or to search for patterns like grep,
    or even count words like wc. In each case, you can add your own customized filtering
    capabilities. You can display part of each line, or search for a pattern in a
    specific field, or count only words that are capitalized.


    The GAWK utility has all the flexibility and complexity of a programming language.
    GAWK has a set of operators that allow it to make decisions and calculations.
    You can also declare variables and use them in control structures to control how
    lines are processed. Many of the programming features are taken from the C programming
    language and share the same syntax. All of this makes for a very powerful tool.


    You can use GAWK directly as a filter, or can place it within a shell file that
    you then execute. In the latter case, the name of the shell file can be thought
    of as a new filter that you have created. This module will examine both aspects
    of GAWK. First, we will examine GAWK as a filter, with all its different features.
    Then we will see how you can use it in a shell file to define your own filters.


    # Note


    GAWK is the GNU version of the UNIX AWK utility, which was originally created
    as a standard utility for the UNIX operating system. One of its creators is Brian
    Kernighan who helped develop the UNIX operating system. An enhanced version of
    AWK, called NAWK, was developed later to include file handling. With NAWK, you
    can access several files in the same program. GAWK is a further enhancement, including
    the features of NAWK as well as the standard capabilities of AWK. You can find
    out more about GAWK at www.gnu.org/software/gawk.'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# The gawk Command


    The gawk command takes as its arguments an instruction and a list of file names.
    The GAWK instruction is encased in single quotes and is read as one argument.


    The instruction consists of two segments, a pattern and an action, with the action
    enclosed in brackets. Records that match that pattern are then retrieved, and
    the actions in the action segment are applied to those records. The syntax of
    a GAWK instruction looks like this:


    ```

    pattern {action}

    ```


    # Ask the Expert


    **Question:** Can I use the pattern segment of the GAWK as a test condition?


    **Answer:** The term “pattern” can be misleading. It is perhaps clearer to think
    of the pattern segment as a condition. The pattern segment can be either a pattern
    search or a test condition of the type found in programming languages. The GAWK
    utility has a full set of operators with which to construct complex conditions.
    You can think of a pattern search as just another kind of condition for retrieving
    records. Instead of simply matching patterns, as in the case of **grep**, the
    user specifies a condition. Records that meet that condition are then retrieved.
    The actions in the action segment are applied to the retrieved records. In this
    respect you can think of the syntax of a GAWK instruction as


    ```

    condition {action}

    ```


    **Question:** Can GAWK operate on files?


    **Answer:** The GAWK utility operates on either files or the standard input. You
    can list file names after the command line, and if no file names are listed, the
    input is taken from the standard input. The following example shows the structure
    of the entire GAWK instruction. The invocation of GAWK consists of the *gawk*
    keyword'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'followed by an instruction and file names. The instruction should be placed
    within single quotes to avoid interpretation by the shell. Since the condition
    and action are not separate arguments for GAWK, you need to enclose them both
    in one set of quotes. The syntax of a gawk command looks like this (see the following
    table):


    ```

    $ awk ''pattern {action}'' filenames

    ```


    You can think of the pattern in a GAWK instruction as operating on each line in
    turn. The GAWK action is then performed on each of those lines.


    | Options | Description |

    | --- | --- |

    | -a filename | With this option, GAWK will read its commands from filename. This
    option is discussed in the "GAWK Instruction Files" section, later in the module.
    |

    | -Fc | This option specifies a field delimiter, , for the input file. This option
    is discussed in the "Field Delimiters" section, later in the module. |


    # # Pattern Searches and Special Characters


    A GAWK pattern search is designated with a beginning and ending slash, and it
    is placed in the pattern, condition, segment of the GAWK instruction.


    ```

    /pattern/{action}

    ```


    The pattern search is performed on all the lines in the file. If the pattern is
    found in a line, the action is performed on that line. In this respect, GAWK performs
    much like an editing operation. Like sed, a line is treated as a line of text,
    and the pattern is searched for throughout the line.'
