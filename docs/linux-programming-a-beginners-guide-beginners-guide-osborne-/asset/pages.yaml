    # File Handles


    You use the open command to create a file handle for a file or pipe. The open
    command takes two arguments: the name of the file handle and the file name string.
    The name of the file handle can be whatever you want, and by convention it is
    in uppercase. The file name string can be the name of the file or a variable that
    holds the name of the file. This string can also include different modes for opening
    a file. By default, a file is opened for reading; but you can also open a for
    writing, for appending, or for both reading and writing. The syntax for open follows:


    ```

    open ( file-handle, filename-string);

    ```


    The next example opens the reports file, calling the file handle it REPS.


    ```

    open (REPS, "reports");

    ```


    To open a file in a specific mode, such as writing or appending, you include the
    appropriate mode symbols in the file name string before the file name, separated
    by a space. Mode symbols are listed in Table 6–3.


    ![](img/3cfc28f62e3fe98d5a49b453e25d689c_205_0.png)


    **Question:** Can I keep the file name in a variable?


    **Answer:** Often the file name will be held in a variable. You then use the dollar
    sign ($) with the variable name to reference the file name. In this example, the
    file name “reports” is held in the variable filen.


    ```

    filen = "reports";nopen (REPS, $filen );

    ```'
