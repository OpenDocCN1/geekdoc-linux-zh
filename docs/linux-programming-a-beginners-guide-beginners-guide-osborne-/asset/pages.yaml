  md: 'Question: Can I execute Linux commands from within a Tcl script?


    Answer: With the exec command you can execute any Linux command within a Tcl program.
    The exec command will execute a Linux command, waiting for it to finish before
    continuing with your program. The result of the Linux command will be returned
    by exec to your program. In the following example, the exec command executes the
    Linux date command. The returned date is assigned to the variable mydate. Then
    the ls -l command will be output by the puts command to the standard output (screen).


    ```

    set mydate [ exec date ]

    puts [exec ls -l]

    ```


    # Variables


    Tcl supports numeric and string variables, as well as arrays, including associative
    arrays, which are discussed in the next section. All variables hold a string as
    their content. However, although the content of a variable is a string, string
    can be used as an integer or real value in an arithmetic expression, provided
    that the string consists of numbers. Whenever such variable is used as an operand
    in an arithmetic expression, its contents are first to be converted to an integer
    or real value. The operation is performed, and then the arithmetic values and
    the result returned by expr are converted back to a string. This means that you
    do not have to worry about declaring the type of variable or defining a variable.
    All variables are automatically defined when they are first used in a statement.


    As we have seen, variables can be assigned values using the set command, which
    takes as its argument the variable name and the value assigned. A variable''s
    name can be any set of alphabetic or numeric characters plus the underscore character
    (_). Punctuation and other characters are not allowed.'
