  md: '# Environment Variables: setenv


    The TCSH shell has two types of variables: local variables and environment variables.
    A local variable is local to the shell it was declared in; an environment variable
    operates like a scoped global variable. The environment variable is known to any
    subshells but not to any parent shells. An environment variable is defined with
    the setenv command. You assign a value to an environment variable using the setenv
    command, the variable name, and the value assigned. In the next example, the greeting
    environment variable is assigned the value "hello."


    +   > setenv greeting hello


    Whenever a shell script is called, it generates its own shell. If a shell script
    is executed from another shell script, it will have its own shell separate from
    that of the first script. There are now two shells: the parent shell belonging
    to the first script and a subshell, which is the new shell


    > Each shell has its own set of variables. The subshell cannot reference local
    variables in the parent shell, but it can reference environment variables. Any
    environment variables declared in the parent shell can be referenced by any subshells.


    generated when the second script was executed.

    In the next example, the variable myfile is defined as an environment variable
    in the dispfile script. Notice the use of the setenv command instead of set. The
    myfile can now be referenced in any subshells, such as that generated when profilefile
    is executed. The user has already created a file List with the entries screen,
    modem, and paper.

    The dispfile script is shown here:


    ```

    #

    setenv myfile "List"

    echo "Displaying $myfile"

    cat -n $myfile.

    profilefile

    ```'
