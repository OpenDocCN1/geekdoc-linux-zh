  md: '# 106 Linux Programming: A Beginner''s Guide


    TSCH shell expression is true if it results in a nonzero value; it is false if
    it results in a 0 value.


    The switch structure works like a restricted version of the if structure. The
    switch structure compares a string with a set of possible patterns. If a match
    is found, operations associated with that pattern are executed. The switch structure
    is useful for implementing menus, in which a user makes a choice from among several
    options.


    The foreach structure runs through a list of values, assigning each value in turn
    to a specified variable. There is no test. The list of values can be generated
    by a pattern and shell characters. For example, the asterisk (*) will generate
    a list of your file names. A list of values can also be specified by a set of
    words. Each word is then a value assigned in turn to the for variable. The loop
    will always continue until all values have been assigned.


    # Test Expressions


    The if and while structures use an expression as their test. A true test is any
    expression that results in a nonzero value. A false test is any expression that
    results in a 0 value. In the TCSH shell, relational and equality expressions can
    be easily used as test expressions, because they result in 1 if true and 0 if
    false. You can use a number of operators in an expression, as shown in Table 4–3.
    The test expression can also be an arithmetic or a string comparison, but strings
    can be compared only for equality or inequality.


    Unlike the BASH and PDKSH shells, you must enclose the TCSH shell if and while
    test expressions within parentheses. The next example shows a simple test expression
    to test whether two strings are equal:


    ```

    if ($greeting == "hi" ) then expression

    echo Informal Greeting

    endif

    ```


    The TCSH shell has a separate set of operators for testing strings against other
    strings or against regular expressions:


    +   * == and != operators test for the equality and inequality of strings.

    "* ~= and ! operators test a string against a regular expression and test to determine
    whether a pattern match is successful or not."'
