  md: 'The string index command returns a single character from a string at a specified
    index. It takes two arguments: the string and index of the character to be returned.
    The following example returns the fifth character from the $mystring variable:


    ```

    string index $mystring 5

    ```


    The string length command returns the length of a string:


    ```

    string length $mystring

    ```


    Regular expression matching on strings is implemented with the regexp has full
    extended regular expression matching capabilities. It takes two arguments: the
    regular expression pattern and the string to be searched. It returns a 1 if the
    pattern is found in the string and 0 if it isn''t. The following looks for any
    numbers in $mystring:


    ```

    regexp [0-9]+ $mystring

    ```


    The regsub command is the Tcl substitute command. It matches a regular expression
    like regsub, but it replaces the matched string with a specified replacement string,
    placing the entire modified string in a new variable. The regsub command takes
    four arguments. The first two are the same as regexp—the string to be searched.
    The third argument is the replacement string, and the fourth is the variable where
    the modified string will be placed. The syntax is shown here:


    ```

    regsub pattern replacement-string variable

    ```


    If the pattern is not found in the string, it returns a 0:


    ```

    regsub milk $mystring yogurt newstring

    ```'
