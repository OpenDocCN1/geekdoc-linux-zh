  md: '# 38 Linux Programming: A Beginner’s Guide


    in, or they may appear as the result of executing a Linux command. In most cases,
    you will need to surround these values with single quotes, double quotes, backslashes,
    or back quotes to set them apart from executable code.


    # Quoting Strings and Characters with Double Quotes, Single Quotes, and Backslashes


    Although variable values can comprise any characters, problems occur when you
    include characters that are also used by the shell as operators. Your shell uses
    special characters in evaluating the command line.


    | Character | Purpose in the Shell |

    | --- | --- |

    | Space Asterisk (*), question mark (?), and brackets ([ and )) | Parses arguments
    on the command line Generate lists of file names |

    | Period (.) | Represents the current directory |

    | Dollar ($) | Evaluates variables |

    | Greater-than (>) and less-than (<) characters | Redirect the standard input
    and output |

    | Ampersand (&) Vertical bar (|) | Executes background commands Pipes output from
    one command to another |


    If you want to use any of these characters as part of the value of a variable,
    you must first quote them (enclose them in double or single quotes, or backslashes).
    Quoted special characters are not evaluated by the shell.


    By surrounding these characters with double and single quotes, you can quote several
    special characters at a time. Any characters that fall within double or single
    quotes are not evaluated. If you want to assign more than one word to a variable,
    you must also quote the spaces separating the words. You can do this by enclosing
    the words within double quotes. You can think of this as creating a string to
    be assigned to the variable.


    If you want to quote a single character, you a backslash before and after that
    character. The following examples show three ways of quoting strings. In the first
    example, the double quotes enclose words separated by spaces. Because the spaces
    are enclosed within double quotes, they are treated as characters, not as separators
    used to parse command line arguments.'
