  md: '# Control Structures and Operators: while, if, switch, and foreach


    As in other shells, the TCSH has a set of control structures that let you control
    the execution of commands in a script. You can use loop and conditional control
    structures to repeat Linux commands or make decisions on which commands you want
    to execute. The while and if control structures are more general-purpose control
    structures that perform iterations and make decisions using a variety of tests.
    The switch and foreach control structures are more specialized operations. The
    switch structure is a restricted form of if that checks to see whether a value
    is equal to one of a set of possible values. The foreach structure is a limited
    type of loop that runs through a list of values, assigning a new value to a variable
    with each iteration.


    The while loop and if conditions operate much as they do in


    > Hint

    The TCSH differs from other shells in its control structures conform more to a
    programming language format. The test condition for a TCSH shell control structure
    is an expression that evaluates to true or false, not to a Linux command. One
    key difference between BASH and TCSH shell control structures is that TCSH structures
    cannot redirect or pipe their output. They are strictly control structures, controlling
    the execution of commands.


    programming languages. The loop continues until a test expression returns false.
    The if condition executes its commands if its test expression returns true. The
    test expression is a TCSH shell expression, and the operators used in a TCSH shell
    expression are similar to those found in the C programming language. The shell
    uses a wide range of assignment, arithmetic, relational, and bitwise operators,
