    # Variables, Constants, and Functions


    GAWK provides for the definition of variables. There are three types of variables:
    field variables, special GAWK variables, and user-defined variables. GAWK automatically
    defines both the field and special variables. The user can define or her own user-defined
    variables. The user can also define arithmetic and string constants. Arithmetic
    constants and string constants consist of any characters enclosed within double
    quotes.


    In addition to variables and constants, GAWK includes functions that can operate
    on the variables and constants. There are both arithmetic and string functions.
    For example, there are string functions that can determine the length of a string
    or locate the position of a character in a string.'
