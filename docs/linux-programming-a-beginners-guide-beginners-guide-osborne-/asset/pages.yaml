  md: '# 276 Linux Programming: A Beginner’s Guide


    The Tk application extends Tcl with commands for creating and managing graphical
    objects such as windows, icons, buttons, and text fields. Tk commands create graphical
    objects using the X Window System—which is an easier way to program X Windows
    objects using the X11 toolkit directly. With Tk, you can easily create sophisticated
    window-based user interfaces for your programs.


    Tk operates under the X Window System. Within the X Window System, Tk uses its
    own shell, called the wish shell, to execute Tk commands.


    +   1. Start up your X Window System.

    2. Start up the wish shell with the command wish. This will open a window in which
    you can then run Tk commands.


    If you are using a graphical user interface, such as Open Look or Motif, X Windows
    is automatically started. Note that you can also enter the wish command from an
    Xterm window.


    The Tk language is organized according to different types of graphical objects
    such as windows, buttons, menus, and scroll bars. Such objects are referred to
    as widgets.


    Instead of explicitly programming Tk code to create a graphical user interface
    (GUI), you can use a Tcl/Tk GUI builder. A GUI builder generates the Tcl/Tk code
    for a user interface that you can use in a Tcl/Tk program. This GUI builder X
    Windows program has its own GUI with windows, menus, and icons that allow you
    to easily create GUI widgets with simple menu selections or mouse operations.
    Using a GUI builder, creating and configuring a widget is as simple as clicking
    its icon in the palette and dragging it to a grid, or choosing the options from
    a toolbar.


    # Note


    Several currently available Tcl/Tk GUI builders are available for free, such as
    Visual Tcl, SpecTcl, VisualGIPSY, and XF. These are downloadable from their respective
    Web sites. You can find links to these sites on the Scriptics Web site’s GUI Builder’s
    page, which is located through the Tcl Resources page.'
  merge: -1
