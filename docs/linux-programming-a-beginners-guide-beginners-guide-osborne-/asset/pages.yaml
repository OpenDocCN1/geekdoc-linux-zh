    The evaluation of these logical commands is summarized in Table 6-8. You can extend
    these commands with added &&& or || commands, creating AND and OR operations.
    The logical commands allow you to use logical operations as your test command
    in control structures, and you can also use them independently.


    # Logical Operation Syntax


    # Evaluation


    expression && expression\expression and expression


    The logical AND condition returns a true (0) value if both expressions return
    a true (0) value; if one returns a nonzero value, then the AND condition is false
    and also returns a nonzero value. The Execution stops at the first expression.
    The and operation is the same as &&& but has a lower precedence.


    expression || expression

    expression or expression


    The logical OR operation returns a true (0) value if one or the other expression
    return a true (0) value; if both expressions return a nonzero value, then the
    OR condition is false and also returns a nonzero value. Evaluation stops at the
    first expression. The or operation is the same as II but has a lower precedence.


    ! expression

    not expression


    The logical NOT condition inverts the true or false value of the expression. The
    not operation is the same as ! but has a lower precedence.


    # Table 6-8 Evaluation of Perl Logical Commands'
