  md: '# Module 5: GAWK 153


    You can perform arithmetic calculations on numeric values represented by numeric
    patterns. A numeric pattern is any sequence of digits, and an arithmetic constant
    is an obvious numeric pattern. A field whose contents are digits is a numeric
    pattern. Arithmetic constants, field variables, and user-defined variables whose
    values are numeric patterns all can be used as operands in arithmetic operations.
    There are also certain special GAWK variables defined as numeric, such as NR and
    NF. These can also be arithmetic operands.


    Arithmetic operations can be used in either the action or pattern segment of the
    GAWK instruction. In the next example, the user outputs every even-numbered line.
    The percent sign (%) is a modulo operator that results in the remainder of a division.
    If 2 divides evenly into the line with no remainder, the line is an even-numbered
    line. Notice how parentheses are used to arrange the expression.


    ```

    gawk ''(NR % 2) == 0 {print NR, $0}'' books

    2 Christmas Dickens 3.50 Academic

    4 Raven Poe 2.50 Penguin

    ```


    With arithmetic operators and variables, you can easily perform calculations on
    a database file. For example, you could sum the values of the same field in each
    line, just as you could sum up a column in a spreadsheet. The user-defined variable
    tot holds the sum, and the END condition then prints out the final value of the
    tot. Since variables are automatically initialized to 0, the tot variable begins
    with an initial value of 0.


    ```

    gawk ''{print; tot = tot + $3} END {print "Total=" tot}'' books

    Tempest Shakespeare 15.75 Penguin

    Christmas Dickens 3.50 Academic

    Iliad Homer 10.25 Random

    Raven Poe 2.50 Penguin

    Total= 32

    ```


    In addition to the standard arithmetic operators, there is also a set of arithmetic
    assignment operators, listed in Table 5-7. These operators combine the assignment
    operation with an arithmetic operation. They are used as a kind of shorthand for
    specifying an operation that assigns a'
