  md: '# Module 1: Introduction to Linux Programming


    device such as a disk. Files are organized into directories. Each directory may
    contain any number of subdirectories, each holding files. Together, the kernel,
    the environment, and the file structure form the basic operating system structure.
    With these three, you can run programs, manage files, and interact with the system.


    An environment provides an interface between the kernel and the user. It can be
    described as an interpreter. It interprets commands entered by the user and sends
    them to the kernel. Linux provides several kinds of environments: desktops, window
    managers, and command line. Users can tailor their environments to their own needs,
    whether they be shells, window managers, or desktops. In this sense, the operating
    system functions more as an operating environment that the user can control.


    As an alternative to a command line interface, Linux provides both desktops and
    window managers. These use GUIs based on the X Window System developed for UNIX
    by the Open Group consortium (www.openggroup.org and www.X11.org). A window manager
    is a reduced version of a desktop that supports only window operation but still
    lets you run any application. A desktop provides a complete GUI, much like Windows
    and the Mac. You have windows, icons, and menus, all managed through mouse controls.
    Currently, two desktops are freely available and included with most distributions
    of Linux: GNOME and KDE.'
