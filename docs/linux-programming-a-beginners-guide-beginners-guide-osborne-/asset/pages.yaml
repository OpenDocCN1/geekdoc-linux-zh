    buttons, and menus. To define a particular object, you first declare its class;
    then, as you would traditionally declare a variable, you define an object of that
    class. In non-C++ terms, you can think of the class as the type and an object
    as a variable of that type.


    Qt provides numerous class declarations, each placed in its own header file. For
    example, to declare a class, you just have to include the QPushButton (a button),
    you include the pushbutton.h file.


    ```

    #include <pushbutton.h>

