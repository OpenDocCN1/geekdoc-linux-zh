    # The switch Structure


    The switch structure chooses among several possible alternatives. The choice is
    made by comparing a string value with several possible patterns. Each pattern
    has its own block of Tcl commands. If a match is found, the associated block is
    executed. The default keyword indicates a pattern that matches anything. If all
    the others fail, the block associated with the default keyword is executed. The
    switch structure begins with the keyword switch, then options prefixed with –,
    and then the string pattern to be matched followed by a block containing all the
    patterns with their blocks. The syntax for the case structure is describe here:


    ```

    switch -options string-pattern {

    pattern {

    Tcl commands

    }

    pattern {

    Tcl commands

    }

    default {

    Tcl commands

    }

    ```


    Options specify the pattern-matching capabilities. The following options are supported.'
