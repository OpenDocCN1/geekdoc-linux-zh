  md: '# Linux Programming: A Beginner''s Guide


    Perl (the Practical Extraction and Report Language) is a scripting language that
    has all the capabilities of GAWK but with many more features. Perl was originally
    designed to operate on files like GAWK does, generating reports and handling very
    large files. However, Perl was designed as a core program to which features could
    be easily added. Over the years, Perl''s capabilities have been greatly enhanced.
    It can now control network connection interaction and even supports a variety
    of database management files. Perl remains completely portable. A Perl script
    will run on any Linux system. You can find out more about Perl at www.perl.org.


    # Note


    There are extensive and detailed man pages on Perl that discuss all aspects of
    the language with a great many examples. The man pages begin with the term perl;
    for example, perlfunc discusses the built-in Perl functions and perlyn describes
    the control structures.


    # Perl Command Line Operations


    Perl can execute either a Perl command entered on the command line or a file of
    Perl commands. Files of commands are more commonly used, letting you create what
    are essentially Perl programs. Perl is invoked using the command perl. After entering
    the command, you need to enter an option to specify whether you are executing
    a Perl script or a single Perl command: -e for a single command and -f for reading
    commands from a file. Perl options are listed in Table 6-1.


    | Command Line Option | Description |

    |---|---|n| -e | Enter one line of a Perl program |

    | -n | Read from files listed on the command line |

    | -p | Output any data read to standard output |


    Table 6-1 Perl Command Line Options'
