  md: '# Ask the Expert


    **Question:** How complex can expressions be?


    **Answer:** In programming languages, test expressions can be made up of complex
    subexpressions using relational and logical operators, as well as arithmetic expressions
    and function calls. Like such test expressions, a GAWK pattern can contain subpatterns
    using relational, logical, and even arithmetic operations. In this sense, a pattern
    can be thought of as an expression.


    However, in programming languages, the operands used in expressions are numbers
    or characters, but in the GAWK pattern, the operands are considered patterns.
    In GAWK, a relational operation compares a value to a pattern, so a logical operation
    will have subexpressions that compare patterns. In fact, the subexpressions are
    technically referred to as patterns, and a complex logical operation can be referred
    to a compound pattern. To avoid confusion between the terms *expression* and *pattern*,
    an entire pattern will be referred to here as a *condition*. Bear in mind that
    the operands in any condition are patterns.


    In the next example, only lines whose last field is equal to the string "Penguin"
    are printed. Notice that a string is used instead of a pattern encased in slashes.
    A pattern within slashes is a search operation looking for the occurrence of any
    pattern in the field, where a string is a simple value comparing the entire field
    to the string value.


    ```

    $ gawk ''$4 == "Penguin" {print}'' books

    Tempest  Shakespeare  15.75 Penguin

    Raven     Poe         2.50 Penguin

    ```


    You can use relational operators to construct conditions. GAWK has the same relational
    operators used in other programming languages: >, <, >=. However, unlike the C
    language versions, GAWK relational operators can compare strings, ranking them
    by alphabetical order. For example, "Aleina" is less than "Larisa" and relational
    and relational operators are listed in Table 5–7.'
