  md: "# Ask the Expert\n\n**Question:** What kind of expressions does a for loop\
    \ take?\n\n**Answer:** The for loop does not in in any way require that the first\
    \ expression actually be an initialization. Nor does it require that the last\
    \ expression be an update or increment operation. The expressions can be any valid\
    \ expressions. The for loop simply places expressions in a loop structure. The\
    \ first expression is placed before the loop, where an initialization is likely\
    \ to occur. The last expression is placed at the end of the loop, where an update\
    \ is likely to occur. The for loop does not even require that there be a first\
    \ or last expression. The following example is a simple way to write a for loop\
    \ to read from the standard input.\n\n```\nfor (:<STDIN>); {\n}\n```\n\n**Question:**\
