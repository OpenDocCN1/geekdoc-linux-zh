    # # Compiling GNOME Programs


    Given the extensive number of libraries involved in creating GNOME applications,
    the compiler command with all its listed libraries and flags can be very complex
    to construct. For this reason, GNOME provides the gnome-config script. You place
    a call to this script as an argument to the compiler operation instead of manually
    listing GNOME libraries and flags. gnome-config takes two options, --cflags and
    --libs. The --libs generate all the flags you need, and the -- option generates
    the list of necessary GNOME libraries. You need to specify the libraries you want
    to use, as gnomeui and gnome, as shown here:


    ```

    gnome-config --cflags --libs gnomeui

    ```


    For the compiler operation, you would place the gnome-config operation in back
    quotes to execute it:


    ```

    gcc myprog.c -o myprog gnome-config --cflags --libs gnomeui

    ```


    To simplify matters, you can place this operation in a Makefile. In a Makefile,
    the compiling is performed separately from the linking. For compiling, you would
    use a gnome-config script with the --cflags option, and for linking you would
    use the --libs option. In the following example, CFLAGS and LDFLAGS macros are
    used to hold the compiling and linking results, Notice the use of back quotes
    in the code.


    ```

    makefile

    CFLAGS=gnome-config --cflags gnomeui

    LDFLAGS=gnome-config --libs gnomeui

    ```


    ```

    all: bookrec


    bookrec: file.o calc.o

    cc $(LDFLAGS) main.o -o bookrec

    ```'
