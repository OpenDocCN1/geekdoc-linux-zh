  md: '# Pattern Search Operators


    You can use two pattern matching operators, the tilde (~) and the exclamation
    tilde (!), to carry out pattern searches on fields. Instead of using the equality
    operator to compare the entire field to a string, you can use the ~ operators
    to search whether a certain pattern exists within the field. When using these
    operators to search fields, the right operand is the pattern and the left operand
    is the field to be searched. In the next example, the first field is searched
    for "mas".


    ```

    $ awk $1 ~ /mas/ {print}'' booksnChristmas Dickens 3.50 Academic

    ```


    The next example retrieves all records whose first field does not contain the
    pattern "mas".


    ```

    $ awk $1 ~ /mas/ {print}'' books

    Tempest Shakespeare 15.75 Penguin

    Iliad Homer 10.25 Random

    Raven Poe 2.50 Penguin

    ```


    Just as you can use special characters in a general pattern search, you can also
    match both uppercase and lowercase versions of “Pinguin” in the fourth field.
    The brackets special characters ([]) are used to define a character for uppercase
    and lowercase P.


    ```

    $ awk $4 ~ /[Pp]eng/) {print}'' books

    Tempest Shakespeare 15.75 Penguin

    Raven Poe 2.50 Penguin

    ```


    # BEGIN and END Special Patterns


    The GAWK instruction has two special patterns that allow the user to specify actions
    to be executed before and after processing lines in the input. The BEGIN pattern
    is a condition that specifies actions to be performed before lines are processed,
    and the END pattern specifies actions to be performed after lines processed.'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'In the following example, the heading “Book List” is output before any lines
    are processed. After processing, the value of NR is printed. Since NR increments
    with each line, after processing, NR will hold the total count of records in the
    file.


    ```

    $ gawk ''BEGIN {print "Book List"} END {print "Total recs", NR}'' books

    Book List 4

    Tempest Shakespeare 15.75 Penguin

    Christmas Dickens 3.50 Academic

    Iliad Homer 10.25 Random

    Raven Poe 2.50 Penguin

    Total recs 4

    ```


    # Range Patterns


    The GAWK utility has a special operator that can be placed between two lines to
    retrieve a range of lines. The first line in the set is the first line that matches
    the first condition. The last line in the set is the next line that matches the
    second condition.


    The comma operator is particularly useful for selecting a range of lines using
    the NR special variable, which holds the current line number. The condition NR
    == 4 will select the fourth line; because when line four is reached, the value
    of NR will be 4 and the condition will be true.


    ```

    $ gawk ''NR == 1, NR == 3 {print $0}'' books

    Tempest Shakespeare 15.75 Penguin

    Christmas Dickens 3.50 Academic

    Iliad Homer 10.25 Random

    ```


    # Hint


    The GAWK instruction literally searches for the first condition. Once the first
    line is met, it searches exclusively for the second condition. In the process,
    it may pass over other matches of the first condition. In fact, there may be matching
    sets, and GAWK does not stop with the first set retrieved—it restarts its searching
    after the second condition is met, looking for another matched pair.'
