  md: '# Module 1: Introduction to Linux Programming


    # # Tool Command Language (Tcl)


    Tcl is a general-purpose command language developed by John Ousterhout in 1987
    at the University of California, Berkeley. Designed to customize applications,
    it has become a functional language in its own right. With Perl and GAWK, you
    can write Tcl scripts, developing your own Tcl programs. Tcl is a simple language
    to use. You can find out more about Tcl at dev.scripts.com.


    Tk and Expect are applications that extend the capabilities of the Tcl language.
    The Tk application allows you to easily develop graphical interactive applications.
    You can create your own windows and dialog boxes with buttons and text boxes of
    your choosing. The Expect application provides easy communication with interactive
    programs such as ftp and telnet.


    Tcl is often used in conjunction with Tk to create graphical applications. Tk
    is used to create the graphical elements, while Tcl performs programming actions,
    such as managing user input. Like Java, Tcl and Tk are cross-platform applications
    means that a Tcl/Tk program will run on any platform that has the Tcl/Tk interpreter
    installed. Currently, Tcl/Tk versions exist for Windows, Macintosh, and UNIX systems,
    including Linux. You can write a Tcl application on Linux and run the same code
    in Windows or on a Macintosh.


    Tcl is an interpreted language that operates, like Perl, within its own shell.
    To invoke the Tcl shell, use the tsh command. Within this shell, you can then
    execute Tcl commands. You can also create files within which you can invoke the
    Tcl shell and list Tcl commands, effectively creating a Tcl program.


    # # Tk


    The Tk application extends Tcl with commands for creating and managing graphical
    objects such as windows, icons, buttons, and text fields using the X Window System.
    You can find out more about Tcl at dev.scripts.com.


    Within the X Window System, Tcl uses its own shell, called the wish shell, to
    execute Tcl commands. To run Tcl programs, you must first start the X Window System
    and start the wish shell using the command wish. You''ll see a window in which
    you can run Tcl commands.


    If you are using a GUI such as Open Look or Motif, X Windows is automatically
    available.'
