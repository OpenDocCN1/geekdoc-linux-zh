  md: 'Perl also supports aliases and references. An alias is another name for a variable,
    array, or function. You can set up a general alias using the asterisk (*) by putting
    it in front of the name of the object you are aliasing, and assigning it to the
    alias name, which is also preceded with an asterisk. For example, the following
    assignment creates an alias count for the variable num.


    ```

    *count = *num;

    ```


    count is now another name for num.

    This is a glob operation because it actually aliases all variables, arrays, or
    functions that have the same name. So, based on the preceding example, if there
    were an array @num, it would now also have an alias @count; and if there were
    a function named num, there would also be an alias for that list count.

    To alias a specific variable or array, use a reference. A reference is a variable,
    array, or function name preceded by a backslash. The following example creates
    cost as a reference only to the variable Smycost, not to any array or function
    of that name.


    ```

    *cost = \Smycost

    ```


    > Tip

    References are used extensively for call-by-reference operations arguments used
    in function calls.


