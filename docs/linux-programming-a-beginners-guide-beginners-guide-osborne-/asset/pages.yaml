    You can create complex expressions using parentheses. The most deeply nested expressions
    are evaluated first. In the following example, 25 * 2 is evaluated; the result,
    50, has 20 subtracted from it.


    ```

    expr (25 * 2) - 20

    ```


    > Hint:

    The resulting value returned by any Tcl command is always a string. In the case
    of arithmetic operations, the arithmetic value is converted first to a string,
    which is then returned by the expr command.


    # Ask the Expert


    **Question:** Can I embed Tcl commands?

    **Answer:** Yes. You can combine commands by embedding one within the other. Embedding
    is commonly used for assigning the result of an expression to a variable. This
    involves two commands: the set command to perform the assignment, and the expr
    command to evaluate an expression. You embed commands using brackets ([ and ]).
    An embedded command is another Tcl command whose result is used as an argument
    in the outer Tcl command. The embedded command is executed, and its result is
    used as the argument to the outer command.


    The following statement assigns the result of the arithmetic operation 25 * 2
    to the variable num. The expr 25 * 2 command is embedded within the set command.
    First, the embedded command is executed; and its result, 50, is assigned to the
    variable num.


    ```

    set num [expr 25 * 2]

    ```


    ![](img/3cfc28f62e3fe98d5a49b453e25d689c_258_0.png)'
