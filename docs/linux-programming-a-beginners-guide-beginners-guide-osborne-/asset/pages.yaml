  md: '# Linux Programming: A Beginner''s Guide


    Linux is an operating system for PCs—a fully graphical user interface—a GUI that''s
    similar to the GUI used by Windows and Macintosh platforms (although Linux is
    more stable). Linux has become the predominant platform for Internet services,
    such as Web servers, e-commerce, and database support. Since Linux was developed
    in the early 1990s by Linux Torvalds, the program has been amended and improved
    over the years by other programmers around the world. As an operating system,
    Linux performs many of the same functions performed by UNIX, Macintosh, Windows,
    and NT machines. However, Linux is distinguished by its power and flexibility.
    As part of its basic configuration, all Linux systems provide extensive support
    for programming. You can install Linux on your system and start programming in
    any number of languages at no extra cost or effort.


    Linux programming can be classified into four general categories: shell programming
    languages, higher level languages (GUI) programming, and standard programming
    using system calls. This book concentrates on the commonly used and easy-to-understand
    shell and higher level languages, with introductory chapters on GUI programming.
    Shell and higher level programming do not require that you have previous programming
    knowledge, although some understanding of programming principles will help. GUI
    programming requires that you know the C and C++ programming languages. Standard
