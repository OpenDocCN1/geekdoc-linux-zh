  md: '# TCSH Shell Variables, Scripts, and Arguments


    The TCSH shell, like the BASH shell, also has programming language capabilities.
    You can define variables and assign values to them. You can define variable definitions
    and Linux commands in a script file and then execute that script. You can use
    loop and conditional control structures to repeat Linux commands or make decisions
    on which you want to execute. You can also place traps in your program to handle
    interrupts.


    The TCSH differs from other shells in that its control structures conform more
    to a programming language format. For example, the test condition for a TCSH shell''s
    control structure is an expression that evaluates to true or false, not to a Linux
    command. A TCSH shell expression uses the same operators as those found in the
    C programming language. You can perform a variety of assignment, arithmetic, relational,
    and bitwise operations. The TCSH shell also allows you to declare numeric variables
    that can easily be used in operations.


    The TCSH shell uses variables much the same way as the BASH shell does. You can
    define variables in a shell and assign values to them, as well as reference script
    arguments. You can also define environment variables that operate like BASH shell
    exported variables. The TCSH shell differs in the way it defines variables and
    the type of variables you can define, however. The TCSH shell defines its variables
    using the TCSH commands set, @ and setenv. The TCSH shell also allows you to define
    numeric variables and arrays. The @ command defines a numeric variable on which
    you perform arithmetic operations. Parentheses and brackets allow you to define
    and reference arrays.


    Scripts also operate in much the same way, but with several crucial differences.
    A TCSH shell script must begin with a number sign (#) in the first column of the
    first line. Also, although prompts can be outputting using the echo command, TCSH
    has no read command to handle input. Instead, you need to redirect the standard
    input to a variable.'
  merge: -1
  pgno: 111
