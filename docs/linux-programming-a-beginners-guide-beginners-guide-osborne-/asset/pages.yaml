  md: '# Introduction


    The Linux operating system has become one of the major operating systems, bringing
    to the PC all the power and flexibility of a UNIX workstation as well as a complete
    set of Internet applications and a fully functional desktop interface. What many
    may not realize is that all standard Linux systems support a wide range of programming
    languages that allow users to create their own programs easily. Keep in mind that
    Linux was based on UNIX, which was designed as a research platform upon which
    researchers could quickly develop customized applications. In this spirit, all
    Linux distributions include a large selection of programming platforms, including
    support for numerous kinds of shell programming, a variety of higher level languages
    like Perl and Tcl/Tk, and extensive GUI programming for desktops like GNOME and
    KDE. Once Linux is installed, you can start creating your own programs.


    This book is designed as a beginner''s guide to programming on Linux. It covers
    numerous programming platforms and the languages that are currently available
    on Linux. You can begin to work with most of these with no prior programming experience,
    with the exception'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'of the GUI platforms covered at the end of the book. GUI programming does assume
    a working knowledge of C and C++ programming.


    This book idifies three major Linux programming topics: shell programming, the
    higher level languages, and GUI programming. Writing shell programs and the higher
    level languages do not necessarily require that you have any prior programming
    experience. Part 1 of the book covers BASH and TCSH shell programming. BASH and
    TCSH are shell environments on Linux that have programming features. Within a
    BASH shell, you can create simple programs that you can execute easily. BASH shell
    programming is organized into two modules, one on the basics and the other on
    control structures. Control structures allow you to control the execution of a
    program so that you can repeat commands or select commands to execute. TCSH shell
    programs use a different syntax, although they work in the same way.


    Part 2 covers higher level languages, including GAWK, Perl, and Tcl/Tk. Each of
    these languages allow you to create very complex programs using a few powerful
    commands. They each have control structures, many of which operate in similar
    ways. With GAWK, you can easily process data, generating modified versions of
    the original. Perl lets you access files and manipulate strings as well as manage
    arrays. Tcl performs many of the same tasks as Perl. Tk is an extension of Tcl
    that lets you create GUIs. With just a few commands, you can create your own windows
    with menus and buttons. Tk supports a wide range of GUI objects.


    Part 3 provides an introduction to programming in GNOME and KDE. The module on
    GNOME, Module 9, is meant as a brief introduction and requires an understanding
    of C programming. The module on KDE, Module 10, also provides an introduction,
    although programming in KDE requires that you have an understanding of C++ programming,
    particularly class hierarchies. For those of you with this background, these modules
    may prove helpful. Without without this background will still gain an understanding
    of what is needed to develop applications for these desktops. The book does not
    cover the lower Linux system calls. These are often used for systems programming,
    developing applications such as device drivers. They require an understanding
    of the underlying structure'
  merge: -1
  pgno: 21
- img_proc: true
  md: of the Linux operating system, including processes, scheduling, and file structure.
    This is beyond the scope of a beginner's book, though, and is best handled at
    an intermediate level. This book focuses on programming that any beginner can
    do, without having to know how operating systems are built.
  merge: -1
