  md: '# Text Operator: <<


    Perl has a special kind of input that operates like the << operation used in the
    BASH shell. In Perl, the << operator reads text that has been typed directly into
    the Perl script. It then generates a string from that text you can assign to a
    variable, print out, or even turn into a list. The syntax for this command is
    the << operator followed immediately by a tag and a semicolon. There is no space
    between the << and the tag. The tag is used to specify the end of the text to
    be read. Everything you enter from the << statement on will be read as you typed
    it, until a line with that tag is reached. The syntax for the text operation is
    as follows:


    +   <<TAG;

    << TAG


    << command can treat the text in three different ways, depending upon how the
    tag is quoted. The text can be treated as verbatim text that is read exactly as
    it was; or it can be treated as a quoted string in which Perl variables and special
    characters can be evaluated; or it can be treated as a series of commands, such
    as shell commands, to be executed by line. The action depends on the type of quotes
    placed around the tag. You can apply other single quotes, double quotes, or back
    quotes to the entire text by placing a tag around the tag.


    Single quotes placed around the tag will read the text exactly as it is typed,
    with no changes, as if were a string enclosed with simple quotes.


    Double quotes around the tag will cause any variables placed within the text to
    be evaluated. If you type in a variable reference, such as $scalar, the value
    will be read in instead of the variable name.


    Back quotes around the tag cause each line in the text to be read as a command,
    and they are executed just as back quotes around a shell command execute that
    command.


    In all of these cases, the results of the operations are placed in a string that
    you use in your program.


    +   ''TAG'' Quote everything

    "TAG" Evaluate variables in a string

    "TAG" Execute commands'
  merge: -1
  pgno: 208
- img_proc: true
  md: 'Single quotes are the default and are assumed if there are no quotes around
    the tag. Single quotes are helpful for dealing with large amounts of text without
    having either string constants or a file. Double quotes allow you more flexibility,
    letting you make of all the features of double-quoted strings. The following example
    generates a string consisting of three lines. The Stitle and Sauthor values will
    be substituted in.


    ```

    $title = "Golf and Hockey"

    $author = "Dylan Christopher"

    print <<"BKINFO";

    The title of this book is $title

    The author is $author

    The next edition is under development

    BKINFO =

    ```


    When a tag is encased in back quotes, it will expect to read executable commands.
    When run from the shell, a Perl script will execute shell commands. By assigning
    the output of the tag operation to a variable, you can, in effect, channel the
    standard output of a shell command into a variable in your Perl script.


    In the following example, the ls -m *.c shell command will generate a list of
    C files. This is the output of the <<CF'' operation that is then assigned to $Smyfiles.
    The <<LC'' operation executes a more complicated shell command that counts all
    the lines in the .c and .h files, returning that number, which is assigned to
    Slinescode. Though only one shell command is used in each of these examples, you
    can have as many as you want. Instead of assigning the output to a variable, you
    could use the print command to display them. However, context is important. If
    you invoke the Perl script from a TCSH shell, it will expect to execute TCSH commands,
    some of which are slightly different.


    ```

    $smyfiles = <<CF'';nls -m *.c

    CF

    $linescode = <<LC'';ncat *.c *.h | wc -l

    ```'
