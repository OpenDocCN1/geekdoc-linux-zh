  md: '# Linux Programming: A Beginner’s Guide


    In Perl there are several ways to call subroutines. Traditionally, a subroutine
    is called with the subroutine name preceded by an ampersand (&). For example,
    &dispfile would call the dispfile subroutine. You can also use parentheses instead
    of the preceding &. If you have a preceding subroutine declaration, you can just
    use the subroutine name itself. The following subroutines are equivalent, but
    using the name requires a subroutine declaration.


    ```

    dispfile;

    &dispfile;

    dispfile();

    ```


    Subroutines can have arguments passed to them and return values back to the calling
    statement. These arguments and return values are passed as lists. Arguments specified
    in a subroutine call are placed in a list and assigned to the @_array that is
    passed to the subroutine. The @_array will hold the arguments for the subroutine
    currently called. To access a particular argument, you use array or list operations
    to reference elements of the @_array. The @_array is used in every subroutine
    to access that subroutine’s arguments.


    Arguments are arranged in the @_array counting from 0, and they are referenced
    as elements of any scalar array. The first argument is referred with $[[0], the
    second with $[1], and so on. The following subroutine example, dispfile, is designed
    to receive its argument the name of a file. It uses $[[0] to access a file name
    passed to it in the @_array.


    ```

    dispfilearg

    {

    system("cat $[0]");

    }

    ```


    The subroutine calls could be either of the following:


    ```

    dispfilearg("myfile");

    &dispfilearg "myfile";

    ```'
