  md: "# The for Loop\n\nThe for loop performs the same tasks as the while loop. However,\
    \ it has a different format. The for loop takes four arguments, the first three\
    \ of which are expressions and the last is a block of Tcl commands. The first\
    \ three arguments are expressions that incorporate the initialization, test, and\
    \ increment components of a loop. These expressions are each enclosed in braces.\
    \ The last argument, the block of Tcl commands, begins with an opening brace and\
    \ then continues with Tcl commands on the following lines, with a closing brace.\
    \ Here’s the syntax:\n\n```\nfor {expression1} {expression2} {expression3} {\n\
    \  Tcl commands\n}\n```\n\nThe first expression is usually reserved for an initialization\
    \ of a variable used to control the loop. This expression is executed before the\
    \ loop is actually entered. The second expression is the test expression, such\
    \ as a relational expression that controls the loop. The third expression is executed\
    \ within and at the end of the loop. It is used for incrementing the variable\
    \ used to control the loop. Following the block of Tcl commands to be executed\
    \ within the loop. The third expression is executed after the block of commands.\n\
    \n```\nfor {initialization} {test expression} {increment} {\n  Tcl commands\n\
    }\n```\n\nThe following example shows a simple for loop. Notice how much compact\
    \ the for loop is than the while loop.\n\n```\nfor {set i 1} {$i <= 3} {incr i\
    \ 1} {\n  puts $i\n}\n```\n\nAs with the while loop, you can easily use the for\
    \ loop to manage arrays. The variable used to control a loop can also be used,\
    \ inside the loop, to index an array. In the titlearray script that follows, the\
    \ elements of the title array are assigned the value of each title. Then the contents\
    \ of each element are printed"
