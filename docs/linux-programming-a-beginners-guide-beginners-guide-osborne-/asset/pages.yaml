    # Equality and Relational Operators


    You can construct simple conditions using equality operators, field variables,
    and constants. The equality operators are the same as those in the C programming
    language. The equality operator consists of two equal symbols (==), which is slightly
    different from other programming languages. A single symbol is the assignment
    operator (=). It is easy to confuse the two. The inequality operator is the exclamation
    point with the equal symbol (!=).'
