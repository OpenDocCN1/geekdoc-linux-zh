    \ initialized before entering the loop. The variable is then tested in a relational\
    \ operation with the loop's test expression to determine when to stop the loop.\
    \ The variable is incremented each time the loop is executed. When i is incremented\
    \ to 4, the loop's test expression is false and the loop stops."
