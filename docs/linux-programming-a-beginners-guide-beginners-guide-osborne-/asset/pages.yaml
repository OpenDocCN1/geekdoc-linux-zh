  md: '# The test Command


    Often you may need to perform a test that compares two values; yet the test used
    in control structures is a Linux command, not a relational expression. There is,
    however, a Linux command called test that can perform such a comparison of values.
    The test command compares values and returns its exit status 0 if the comparison
    is successful.


    Using the test command, you can compare integers and strings, and you can even
    perform logical operations. The command (its syntax is shown following) consists
    of the keyword test followed by the values being compared, which are separated
    by an option that specifies what kind of comparison is taking place. You can think
    of the option as the operator, or it is written, like other options, with letter
    codes preceded by a minus sign. For example, -eq is the option that represents
    the equality comparison. The syntax for the test command is shown here:


    ```

    test value -option value

    test string = string

    ```


    Be aware that two string operations actually use an operator instead of an option.
    When you compare two strings for equality, you use the equal sign (=). In the
    next example, two integer values are compared to determine whether they are equal.
    In this case, you need to use the equality option, -eq. The exit status of the
    test command is examined to determine the result of the test operation. The shell
    special variable $ holds the exit status of the most recently executed command.


    ```

    $ num-5

    $ test $num -eq 10

    $ echo $

    ```


    Alternatively, instead of using the keyword test for the test command, you can
    use enclosing brackets [ and ]. The command test $greeting = \

    "hi" can also be written like this:


    ```

    $ [ $greeting = "hi" ]

    ```'
  merge: -1
