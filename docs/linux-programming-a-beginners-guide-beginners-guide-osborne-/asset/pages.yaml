  md: "# Module 7: Tool Command Language (Tcl) 265\n\n+   3. Open the source file\
    \ (sourcefile variable) for reading, and assign its file handle to the handle\
    \ variable.\n\n+   4. Open the destination file (destfile variable) for writing,\
    \ and assign its file handle to the handle variable.\n\n+   5. In a while loop,\
    \ use the gets command to read a line of the source file in the line variable\
    \ with each iteration. Then use the puts command to write the line to the line\
    \ destination file.\n\n+   6. Output a simple message stating that the file has\
    \ been copied.\n\n+   7. Close both the destination (dhandle) and source (handle)\
    \ files.\n\nThe contents of the mycp program follows:\n\n```\n#!/usr/bin/tcl\n\
    if [$argc != 2] {\n    puts \"Please enter two filenames\\n\"\n    exit 1\n}\n\
    \nset sourcefile [ index $argv 0 ]\nset destfile [ index $argv 1 ]\nset handle\
    \ [ open $sourcefile r ]\nset dhandle [ open $destfile w ]\n\nwhile {[gets $handle\
