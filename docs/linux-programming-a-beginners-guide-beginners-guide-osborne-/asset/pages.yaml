  md: '# Shell Scripts: Commands and Comments


    them to accept input from the standard input or send it to the standard output.
    Unlike the Bourne shell, the first shell used for UNIX incorporates incorporates
    many features of the TCSH and Z shells. Arithmetic operations in particular are
    easier to perform in BASH.


    A shell script is a text file that contains Linux commands that you enter using
    any standard editor, such as vi, emacs, WordPerfect, or any of the GNOME or KDE
    text editors. There are several ways to run a shell script. One way to do is to
    precede the name of the script with a period, as shown next. The shell will read
    the commands in shell scripts and execute them. In this example, the name of the
    script is hello. The period (.) symbol instructs Linux to execute this script.


    ```

    $ hello.

    ```


    You can also make the script file itself executable, or "runnable," and use its
    name directly on the command line in the same way that you would use the name
    of any command.

    The following shows the hello script (in bold) and its output. Script and output
    will be shown in this way throughout this book.


    ```

    $ hello

    Hello, how are you

    $

    ```


    You may have to specify that the script you are using in your current working
    directory. You do this by prefixing the script name with a period and slash combination,
    ./ as in ./hello. The following example shows how you would execute the hello
    script.


    ```

    $ ./hello

    Hello, how are you

    $

    ```'
