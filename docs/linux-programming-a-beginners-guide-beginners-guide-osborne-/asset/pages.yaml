  md: '# 366 Linux Programming: A Beginner’s Guide


    For a toolbar, you also need to manage the icons you want to use in it. To load
    icons, use a KIconLoader object that you create with the getIconLoader method,
    as shown here:


    ```

    KIconLoader *myloader = myapp->getIconLoader();

    ```


    The KIconLoader object will load and cache the toolbar icons, searching for them
    in specified KDE icon directories. Be sure to include the kiconloader header file.

    To add a button to the toolbar, use the insertButton method. This takes as its
    first argument the icon you want to use for the button. For this argument, you
    have to first load the icon using the KIconLoader object’s loadIcon method. This
    method takes as its argument the name of the icon. The following example loads
    the file for the Exit icon:


    ```

    loader->loadIcon("filenew.xpm")

    ```


    The second argument is the command identifier, the third is a flag to indicate
    whether the button is enabled, and the last is the ToolTip text. The following
    example adds an Exit button to a toolbar with the hint "Exit program":


    ```

    toolbar->insertButton(loader->loadIcon("exit.xpm"), 0, TRUE,

    "Exit Program");

    ```


    # Hint


    It is helpful to allow for international support by wrapping the ToolTip text
    in the koclale->translate function, like this:

    kloclale->translate("Exit Program")


    To connect an icon in the toolbar with an object’s slot function, use the toolbar
    object’s addConnection function. This takes as its first argument the identifier
    of the icon on the toolbar. The identifier is the number you used as the second
    argument with the insertButton function when you added the icon to the toolbar.
    The remaining arguments are similar to those for the connect function: the signal,
    the object slot function, and the slot function.'
