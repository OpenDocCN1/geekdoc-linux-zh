    # The foreach Structure


    The foreach structure is designed to sequentially reference a list of values.
    It is similar to the BASH for-in structure. The foreach structure takes two operands—variable
    and a list of values enclosed in parentheses. Each value in the list is assigned
    to the variable in the foreach structure. Like the while structure, the foreach
    structure is a loop. Each time through the loop, the next value in the list is
    assigned to the variable. When the end of the list is reached, the loop stops.
    The while loop, the body of a for loop ends with the keyword end. The syntax for
    the foreach variable loop is shown here:


    ```

    foreach variable ( list of values )

    commands

    end

    ```


    The foreach loop is useful for managing files. In this structure, you can use
    special characters in a pattern to generate a list of file names for use as your
    list of values. This generated list of file names becomes the list referenced
    by the foreach structure. An asterisk by itself generates a list of all files
    and directories. The pattern *.c lists files with the .c extension. These are
    usually C source files.'
