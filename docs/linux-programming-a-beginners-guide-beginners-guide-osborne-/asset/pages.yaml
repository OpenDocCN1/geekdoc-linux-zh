  md: '# 20 Linux Programming: A Beginner''s Guide


    In Linux, files are organized into directories, much as they are in Windows. The
    entire Linux file system is one large interconnected set of directories, each
    containing files. Some directories are standard directories reserved for system
    use. You can create your own directories for your own files, as well as easily
    move files from one directory to another. You can even move entire directories
    and share directories and files with other users on your system. With Linux, you
    can also set permissions on directories and files, allowing others to access them
    or restricting access to you alone.


    The directories of each user are in fact ultimately connected to the directories
    of other users. Directories are organized into a hierarchical tree structure,
    beginning with an initial root directory. All other directories are ultimately
    derived from this first root directory. You can actually travel throughout the
    system, entering any directory that may be open to you. This interconnectivity
    of the file structure makes it easy to share data—several users can access the
    same files.


    The root directory is a special directory that you will need to make use of when
    you first set up your Linux system. Linux is a multiuser system: several users
    can share the operating system. However, the operating system itself resides in
    programs placed in special directories beginning with the root directory. These
    are sometimes referred to as system directories.


    With KDE and GNOME, Linux now has a completely integrated GUI. Previously, Linux
    did support window managers that provided some GUI functionality, but they were
    usually restricted to window operations. KDE and GNOME are fully operational desktops
    supporting drag-and-drop operations, letting you drag icons to your desktop and
    set up your menus on an Applications panel. Both rely on an underlying X Window
    System, which means that as long as they are both installed on your system, applications
    from one can run on the other desktop. You can run KDE programs, such as the GNOME
    desktop applications as the GFtp FTP client can run on the KDE desktop. You can
    even switch file managers, running the KDE file manager on GNOME—you will lose
    some desktop functionality, such as drag-and-drop operations, but the applications
    will run fine.


    Both desktops can run any Window System program as well as any cursor-based program
    such as Emacs and Vi, which were designed to work in a shell environment. At the
    same time, a great many applications were written just for those desktops and
    included with your distributions.'
