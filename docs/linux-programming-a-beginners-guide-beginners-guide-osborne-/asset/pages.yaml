    # Signals and Slots


    KDE and Qt use signals and slots to allow one widget to communicate with another.
    Signals and slots are member functions defined in a class that have special capabilities.
    Signals are emitted by an object when it is activated by some event occurring
    on it. For example, when a user clicks a button object, the button will emit a
    clicked signal. This signal can then be picked up by any other object set up to
    receive it. Such an object will'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# 356 Linux Programming: A Beginner''s Guide


    slots that are designated to receive the signal. A slot is just a member function
    that executes when the object receives a certain signal.


    In effect, slots operate like event handlers, and signals can be thought of as
    events; KDE and Qt do not operate like standard event-driven GUIs. Instead, the
    process of event handling is implemented as messages that are sent by objects.
    Instead of focusing on the processing of an event when it occurs, objects manage
    their own event tasks as they occur, whether that be receiving or sending signals.
    A KDE widget emits a signal when an event occurs on or when it changes state for
    some reason. There are several possible signals, among the common of which are
    the activated and clicked signals. So, when an activated signal occurs on a menu
    item widget, the processing function will execute the corresponding function for
    that item. For example, given a menu with an item having an Exit item, when a
    user clicks an Exit item in the File menu, a function to execute the program should
    be executed. The Exit item emits a signal that is then received by the main window
    object, which executes the slot function associated with the Exit item.


    The connection between the signal from emitting object to a slot in a receiving
    object is created with the connect function. The connect function sets up a connection
    between a certain signal in a given object with a specific slot function in another
    object. Its first argument is the object, the second is the signal, and the last
    is the callback function. To specify the signal, you use the SIGNAL macro on the
    signal name with its parameters. For the callback command function, you use the
    SLOT macro. Using connect operations, you can also connect a signal to several
    slots and connect signals to just one slot. In this example, the clicked signal
    on the buttonhi is connected to the myhello slot in the赢得 object:


    | Object to be referenced when signal occurs |

    | Widget | Signal on the widget | Function in object to execute when signal occurs
    |

    |


    ```

    connect(buttonhi, SIGNAL(clicked()), mywin, SLOT(myhello()));

    ```'
