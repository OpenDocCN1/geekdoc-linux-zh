    \ like the output of any Linux command. In a control structure command, you can\
    \ place a redirection operator immediately following the done keyword to redirect\
    \ the output of a loop to a file. In the myListave file, for example, the echo\
    \ command within the for-in loop will place the name and the date in the standard\
    \ output. These items name and dates are then redirected to a file called foods.\n\
