  md: '# Module 1: Introduction to Linux Programming


    conditions to create complex programs. Usually, the instructions making up a shell
    program are entered into a script file that can then be executed. To run the shell
    program, you can even distribute your program among several script files, one
    of which will contain instructions to execute others. You can think of variables,
    expressions, and control structures as tools you use to bring together several
    Linux commands into one operation. In this sense, a shell program is a new, complex
    Linux command that you have created.


    You can control the execution of Linux commands in a shell program with control
    structures that allow you to repeat commands and select commands over others.
    A control structure consists of two major components: a test and commands. If
    the test is successful, the commands are executed. In this way, you can use control
    structures to make decisions about whether commands should be executed.


    # TCS Shell Programming


