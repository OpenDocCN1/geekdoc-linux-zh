    # Signal and Events


    GNOME programming works like other GUI programming—it is event

    oriented. In event-driven programs, you first define the objects that the

    user can operate on, and then you start the interaction function that

    continually check for certain events, such as mouse clicks and menu

    selections. When such an event is detected, it is passed to its appropriate

    function for handling. For example, if a user clicks an OK button, the

    mouse click is detected and control is passed to a function set up to handle

    a click on an OK button. When the function has finished, it returns

    control back to the interaction program.


    GTK adds a further level of sophistication. When events occur on

    aner widget, the widget will emit a signal that is then used to execute

    a function associated with both signal and that object. For example,

    when you click a Close button, the Close button widget detects the

    mouse-click event and emits a “clicked” signal. The signal is detected

    and its associated function is executed.


    You can also, if you wish, associate an event directly with a function.

