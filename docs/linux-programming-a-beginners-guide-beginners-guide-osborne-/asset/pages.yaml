  md: '# 310 Linux Programming: A Beginner''s Guide


    The GNU Network Object Model Environment, known as GNOME, provides a powerful
    and easy-to-use desktop consisting primarily of a panel, and a set of GUI tools
    with which program interfaces can be constructed. Its aim is not just to provide
    a consistent interface, but also a flexible platform for the development of powerful
    applications.


    GNOME is completely free under the GNU Public License, with no restrictions. You
    can obtain the source directly from theGNOME Web site at www.gnome.org. GNOME
    uses the Common Request Broker Architecture (CORBA), which allows software components
    to interconnect, regardless of the computer language in which they are implemented
    or the kind of machine they are running on. The GNOME implementation of CORBA
    is called ORBit.


    The components of the GNOME desktop consist of a panel for starting programs,
    and desktop functionality. Other normally found in a desktop, such as a file manager,
    a Web browser, and a window manager, are provided by GNOME-compliant applications.
    GNOME provides libraries of GNOME GUI tools that developers can use to create
    GNOME applications, and programs are said to be GNOME compliant if they use buttons,
    menus, and windows that adhere to a GNOME standard.


    GTK+ is the widget set used for GNOME applications, and its look and feel was
    originally derived from Motif. A widget set is the set of GUI objects that are
    available for use in a desktop: buttons, windows, and toolbars are all examples
    of widgets. The widget set is designed from the ground up for flexibility; for
    example, buttons have labels, images or any combination thereof. Objects can be
    dynamically queried and modified at runtime. GTK+ also includes a theme engine
    that lets users change the look and feel of applications using these widgets.
    At the same time, the GTK+ widget set remains small and efficient.


    The GTK+ is entirely free under the Library General Public License (LGPL). The
    LGPL allows developers to use the widget set with proprietary as free software.
    The widget set also features an extensive set of programming language bindings
    with C++, Perl, Python, Pascal, Objective-C, Guile, and Ada. Internalization is
    fully supported, permitting applications based on GTK+ to be used with other character
    sets, such as those of Asian languages. The drag-and-drop functionality supports
    both XND and Motif protocols, allowing drag-and-drop operations with other widget
    sets that support these protocols, such as Qt and Motif.'
