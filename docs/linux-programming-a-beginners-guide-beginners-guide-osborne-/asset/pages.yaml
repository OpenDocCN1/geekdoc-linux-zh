  md: '# Ask the Expert


    **Question:** How do I compile a KDE program?


    **Answer:** You compile a KDE program just as you would compile any C++ program.
    Use the `g++` command and specify the KDE and Qt libraries to use.


    **Question:** What if I receive an error that the compiler cannot find a header
    (.h) file?


    **Answer:** This usually means that the compiler does not know where the KDE or
    Qt libraries are located on your system. You can use the `-I` option to specify
    a directory for header files and the `-L` option to specify the directory that
    contains libraries. For example, if your KDE header files are located in the `/opt/kde/include`
    directory, you would use the following:


    ```

    -I/opt/kde/include

    ```


    **Question:** Is there an easier way to specify the location of KEDIR and header
    files and libraries?


    **Answer:** Yes, many systems will have set up the KEDIR and QTDIR shell variables.
    KEDIR would contain the path names for the KDE commands, headers, and libraries,
    and QTDIR would contain the path names for Qt. To specify the header files for
    KDE, you would use the following:


    ```

    -I$KEDIR/include

    ```


    Be sure to include the `$` before KEDIR. If KEDIR is not already defined, you
    can define it yourself, assigning the location (if you know it) of the KDE components:


    ```

    KEDIR = /opt/kde

    ```


    Red Hat Linux, the Qt libraries for 6.0 are placed in the `/usr/lib/qt` directory,
    and KDE libraries are mixed with other libraries in the `/usr/lib` directory.
    You will not have to specify a KDE library; and for Qt, you'
