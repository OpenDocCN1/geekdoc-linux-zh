    # GNOME Functions


    GNOME programs build on GTK+ programs providing GNOME functions to let you more
    easily create GNOME interfaces that are consistent with the style for the GNOME
    desktop. To create a simple GTK program, you begin with GTK object definitions
    for your GNOME widgets and then use GNOME functions to initialize your program
    and define your widgets. GTK functions as gtk_signal_connect are used to associate
    GUI events with objects, whereas GNOME functions as gnome_app_create_menus create
    menus. In a GNOME program, you need to include an initialization function called
    gnome_init, which you place at the very beginning. To create a primary window
    for your application, you use gnome_app_new.


    The following example shows the use of the gnome_init and the gnome_app_new functions.
    The gnome_init function takes as its arguments initial arguments that the user
    must enter when the program starts, well as an application ID and version number.
    The user’s initial arguments are managed by the argc and argv variables. gnome_app_new
    takes as its arguments the title you displayed in the application window and the
    name of the application object. It returns the address of the new object, which,
    in this example, is assigned to the app pointer. app is a pointer to an object
    of type GtkWidget.


    ```

    GtkWidget *app;


    gome_init("", "0.1", argc, argv);

    app = gnome_app_new("Hello-World", "Hello App");

    ```


    Other operations, such as displaying widgets and starting the interactive interface,
    are handled by GTK functions. gtk_widget_show_all will


