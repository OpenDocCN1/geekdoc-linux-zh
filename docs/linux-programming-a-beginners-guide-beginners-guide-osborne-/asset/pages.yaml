  md: '# Module 10: KDE


    # Qt Programming


    KDE currently relies directly on the Qt Toolkit. Using just Qt objects, you can
    create an interface with a look and feel similar to KDE. You can create a Qt application
    using just Qt objects and the Qt libraries. This section provides a basic introduction
    to Qt programming. Both the KDE development site at developer.kde.org and the
    Qt Web site at www.trol.com provide very detailed documentation and tutorials
    on Qt programming. It is strongly recommended that you consult these for a detailed
    presentation of Qt programming and API references.


    # Qt Applications


    A Qt program is a C++ program. The Qt libraries provide extensive definitions
    of Qt classes with which you can define Qt objects in your Qt program. You can
    also use these classes to create your own classes, inheriting their parents''
    predefined capabilities. Table 10-3 lists the commonly used widgets.


    | Widget | Description |

    |---|---|

    | QCheckBox | A check box with a text label |

    | QComboBox | A combined button and popup list |

    | QFrame | The base class of widgets that can have a frame |

    | QLabel | A label that displays static text or a pixmap |

    | QListBox | A list of selectable, read-only items |

    | QListView | A list/tree view |

    | QMainWindow | A typical application window, with menu bar, some toolbars, and
    a status bar |

    | QMenuBar | A horizontal menu bar |

    | QPopupMenu | A popup menu widget |

    | QProgressBar | A horizontal progress bar |

    | QPushButton | A push button with a text or pixmap label |


    Table 10-3 Common Qt Widgets'
