  md: "# Linux Programming: A Beginner’s Guide\n\nYou can also use the trap command\
    \ to prevent outside events from stopping a program. For example, suppose you\
    \ do not want the user to be able to stop a program by pressing CTRL-C; you want\
    \ any outside event to be ignored. The trap command can trap the CTRL-C event\
    \ and prevent it from interfering with the execution of the program. You can do\
    \ this by entering a set of empty quotes as the trap command's first argument.\
    \ If the trap command has no Linux commands to execute, it merely intercepts an\
    \ event that would stop the program. The trap command will trap all CTRL-C events\
    \ and prevent a CTRL-C entered by a user from stopping your program:\n\n```\n\
    trap '' 2\n```\n\nIn the next example, the 0 signal number denotes the end-of-program\
    \ events. When used with a trap, this number dictates that whenever your program\
    \ ends, the trap will be executed. Should your program end due to an interruption,\
    \ an exit command, or simply by executing the last command in the program, this\
    \ trap will be activated and its action executed. In the next example, the \"\
    Goodbye\" message will be output whenever the program ends, for any reason.\n\n\
    ```\ntrap 'echo \"Goodbye\"' 0\n```\n\nThis trap is entered into the backupG script,\
    \ shown here, along with the other trap checking for interruptions. The CTRL-C\
    \ trap, indicated by the number 2, is removed in this case to illustrate how the\
    \ 0 trap works:\n\n```\ntrap '' 1 3 15\ntrap 'echo \"Goodbye\"' 0\n```\n\n```\n\
    for backfile in *.c\nd\n  cp $backfile sourcebak/$backfile\n  echo $backfile\n\
    done | sort > cnames\n```"
