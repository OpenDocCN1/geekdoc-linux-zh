    # # Conditions: if, if-else, elif, and case


    The BASH shell has a set of conditional control structures that allow you to choose
    which Linux commands to execute. Many of these structures are similar to conditional
    control structures found in programming languages, with some differences. The
    if condition tests the success of a Linux command, not an expression. Furthermore,
    the end of an if-then command must be indicated with the keyword fi, and the end
    of a case command is indicated with the keyword esac. The condition control structures
    are listed in Table 3-2.


    # ## The if-then Structure


    The structure places a condition on commands. That condition is the exit status
    of a specific Linux command. If a command is successful, returning an exit status
    of 0, the commands within the if structure are executed. If the exit status is
    anything other than 0, the command has failed and the commands within the if structure
    are not executed.


    The if command begins with the keyword fi and is followed by a Linux command whose
    exit condition will be evaluated. This command'
