    became standard. In 1975, UC Berkeley released its own version of UNIX, known
    by its distribution arm, Berkeley Software Distribution (BSD). BSD of UNIX became
    a major contender to the AT&T Bell Labs version. Other independently developed
    versions of UNIX sprouted up.

    In 1980, Microsoft developed a PC version of UNIX called Xenix. AT&T developed
    in 1983 released its first commercial version, called System 3. This was later
    followed by System V, which became a supported commercial software product.


    At the same time, the BSD version of UNIX was developing through several releases.
    In the late 1970s, BSD UNIX became the basis of a research project by the Project
    of Defense''s Advanced Research Projects Agency (DARPA). As a result, in 1983,
    Berkeley released a powerful version of UNIX called 4.2. It included sophisticated
    file management as well as networking features based on TCP/IP network protocols—the
    same protocols used for the Internet. BSD release 4.2 was widely distributed and
    adopted by many vendors, such as Sun Micros.


    The proliferation of different versions of UNIX led to a need for a UNIX standard.
    Software developers had no way of knowing which versions of UNIX their programs
    would actually run on. In the mid-1980s, two competing standards emerged, one
    based on the AT&T version of UNIX and the other on the BSD version. In bookstores
    today you will see many different books on UNIX for one or the other version.
    Some specify System V UNIX, while others focus on BSD.


    AT&T moved UNIX to a new organization, called UNIX System Laboratories, that could
    focus on developing a standard system, integrating the different major versions
    of UNIX. In 1991, UNIX System Laboratories developed System V release 4, which
    incorporated almost all the features found in System V release 3, BSD release
    4.3, SunOS, and Xenix.

