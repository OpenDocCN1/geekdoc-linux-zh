  md: '# Loops: while, until, for-in, and for


    The BASH shell has a set of loop control structures that allow you to repeat Linux
    commands: the while, for, and for-in structures. Like the if structure, while
    and until test the result of a Linux command. However, the for and for-in structures
    do not perform tests. Instead, they simply progress through a list of values,
    assigning each value in a specified variable. Furthermore, the while and until
    structures operate in ways similar to the corresponding structures found in programming
    languages, whereas the for and for-in structures are very different from their
    corresponding programming structures. The loop control structures are listed in
    Table 3–3.


    | Loop Control Structures | Description |

    | --- | --- |

    | while do command | while executes an action as long as its test command is true
    |

    | until do command | until executes an action as long as its test command is false
    |

    | for variable in list-values do command | for-in is designed for use with lists
    of values; the variable operand is consecutively assigned the values in the list
    |

    | for variable do command | for is designed for reference arguments; the variable
    operand is consecutively assigned each argument |

    | select string in item-list do command | select creates a menu based on the items
    in the item-list, and then it executes the command; the command is usually a case
    |


    Table 3-3 BASH Shell Loops'
