    \n# Expect\n\nThe Expect application adds several commands to Tcl scripts that\
    \ you can use to automatically interact with any Linux program, plus a utility\
    \ that prompts for responses. For example, the login procedure for different systems\
    \ using fip or telnet can be automatically programmed with a Tcl script using\
    \ Expect commands. You can find out more about Expect at www.nist.gov. Expect\
    \ commands are designed to work with any interactive program. The commands wait\
    \ for a response from a program and then send the response specified in the Tcl\
    \ script. You can drop out of the script with a simple CTRL-D command and interact\
    \ with the program directly.\n\nThree Basic Expect commands added to Tcl scripts\
    \ are the send, expect, and interact commands. The expect command will wait to\
    \ receive a string or value from the program you are interacting with. The send\
    \ command will send a string to that application. The interact command places\
    \ you into direct interaction with the application, ending the Expect/Tcl script.\
    \ In the following script, expect is used to perform an anonymous login with the\
    \ fip program. The spawn command starts with the fip program. The internet address\
    \ of the FTP site is assumed to be an argument to this script, and as such, will\
    \ be held in the argv list.\n\n```\n#!/usr/bin/expect\nspawn ftp\nsend \"open\
    \ $argv\\r\"\nexpect \"login:\"\nsend \"anonymous\\r\"\nexpect \"word:\"\nsend\
    \ \"richlp@turtle.mytrek.com\\r\"\ninteract\n```"
  merge: -1
