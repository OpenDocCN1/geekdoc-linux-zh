    # Pattern Segment as a Condition


    The pattern segment of a GAWK instruction can be thought of as a test condition.
    Control structures in programming languages have test expressions that are tested
    for truth or fals, and if the test is true, the control structure’s statements
    are executed. In the same way, a pattern in GAWK can be considered a test expression—if
    the pattern makes a successful match, then it is true and its GAWK action is executed.
    In this respect, a pattern is a condition for the action’s execution. The operators
    you use for creating such tests are listed in Table 5-7. Also included are special
    patterns that specify certain conditions. For example, the BEGIN and END patterns
    will execute code before and after the main code.'
