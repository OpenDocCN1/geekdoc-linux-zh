    # Ask the Expert


    **Question:** How are increments and decrements implemented?


    **Answer:** There are two special increment and decrement arithmetic operators.
    The increment operator consists of two plus signs (++), and the decrement operator
    consists of two minus signs (--). The increment operation is a combined addition
    and assignment operation.


    The increment operation first adds 1 to the variable and then assigns the increment
    value to that variable. The expression i++ is equivalent to i=i+1. The decrement
    operation performs a combined subtraction and assignment operation. The expression
    i-- is equivalent to i=i-1.


    Increment operations are very useful for progressing through an array, and are
    often used in loops to update variables that control a loop. In the next example,
    the user uses the variable linen to keep track of each line number instead of
    using NR. linen is incremented by 1 at each line and is used to output the line
    number.


    ```

    $ awk ''{linen++; print linen, $0 } ''

    ```


    | Tempest Shakespeare 15.75 Penguin |

    | Christmas Dickens 3.50 Academic |

    | Iliad Homer 10.25 Random |

    | Raven Poe 2.50 Penguin |'
