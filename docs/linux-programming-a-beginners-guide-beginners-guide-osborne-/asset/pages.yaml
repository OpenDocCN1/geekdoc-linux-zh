  md: "# 254 Linux Programming: A Beginner’s Guide\n\n| Option | Description |\n|\
    \ - | - |\n| -exact | Use exact matching when comparing string to a pattern. This\
    \ is the default. |\n| -glob | When matching a string to the patterns, use glob\
    \ style matching. |\n| -regexp | When matching a string to the patterns, use regular\
    \ expression matching (i.e., the same as implemented by the regex command). |\n\
    | -- | Marks the end of the options. The following argument one will be treated\
    \ as generic, even if it starts with a - |\n\nThe -regexp option lets you match\
    \ any regular expression, whereas -glob lets you use the shell name matching methods.\
    \ With -glob, the shell characters *, [ ], and ? let you easily match part of\
    \ a string. With the -regexp option, you can match on complex alternative strings,\
    \ specifying multiple instances of characters, beginning or end of a string, and\
