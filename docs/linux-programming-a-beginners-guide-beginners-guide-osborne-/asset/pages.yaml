  md: '# Linux Programming: A Beginner’s Guide


    In a script file, it is often helpful to include short explanations describing
    the file''s task as well as the purpose of certain commands and variables. You
    can enter such explanations using comments. A comment can appear in any line or
    part of a line—with the exception of the first line—and is preceded by a number
    sign (#). You can''t use comments in the first line of your script file, because
    this line is reserved for shell identification. Any characters following a number
    sign will be ignored by the shell. In the next example, a comment describing the
    name and function of the script is placed at the head of the file.


    The content of the hello script with an initial command line is here:


    ```

    # The hello script says hello

    echo "Hello, how are you"

    ```


    # Setting Permissions: Permission Symbols


    Before you run a script directly, you need to make it executable. You can do this
    by turning on the script''s execute permission. Each file in Linux has a set of
    three possible permissions: read, write, and execute. You can turn these on or
    off using the chmod command and the appropriate options. These options are the
    characters r, w, and x for read, write, and execute, respectively. Any of these
    permissions can be added or removed. The symbol used to add a permission is the
    plus sign (+). The symbol to remove a permission is the minus sign (−). In the
    next example, the chmod command adds the execute permission and removes the write
    permission for the mydata file. The read permission is not changed.


    ```

    $ chmod +x-w mydata

    ```


    There are also permission symbols that specify each user category. The owner,
    group, and others categories are represented by the u, g, and o characters, respectively.
    Notice that the owner category is represented by a u and can be thought of as
    the user. The symbol for a category is'
