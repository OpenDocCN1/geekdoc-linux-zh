    Tempest Shakespeare 15.75 Penguin

    Christmas Dickens 3.50 Academic

    ```


    # Logical Operators


    GAWK has a set of logical operators that you can use to create complex

    conditions. The logical operators are the same as those used in the C

    programming language, and are listed in Table 5–7. The logical

    operator for OR is a double bar (||), and the logical operator for NOT is a single

    exclamation point (!). The operands for logical operators are themselves

    conditions. These are usually enclosed within parentheses.


    In the next example, all books published by Penguin that cost over

    $10.00. This involves comparing the fourth field to “Penguin”nand testing to see
    if the third field is greater than 10.00.


    ```

    gawk ''$($4 == "Penguin") && ($3 > 10.00) {print}'' books

    Tempest Shakespeare 15.75 Penguin

    ```


    In the next example, the command prints books that are published

    either by Penguin or Academic. This involves checking to see if the fourth

    field is equal to the string "Penguin" or the string "Academic".


    ```

    gawk ''$($4 == "Penguin") || ($4 == "Academic") {print}'' books

    Tempest Shakespeare 15.75 Penguin

    Christmas Dickens 3.50 Academic

    Raven Poe 2.50 Penguin

    ```'
