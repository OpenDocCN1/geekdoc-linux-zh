    (IEEE) developed an independent UNIX standard for the American National Standards
    Institute (ANSI). This new ANSI-standard UNIX is called the Portable Operating
    System Interface for Computer Environments (POSIX). The standard defines how a
    UNIX-like system needs to operate, specifying details such as system calls and
    interfaces. POSIX defines a universal standard to which UNIX versions must adhere.
    Most popular versions of UNIX are now POSIX compliant. Linux was developed from
    the beginning according to the POSIX standard.


