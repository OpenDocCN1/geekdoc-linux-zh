    # Tip


    Any class that includes slots or signals must also include a special

    reference named Q_OBJECT. This enables the Meta-Object Compiler

    preprocessor (described next) to set up any signals and slots declared

    in the class.


    # Meta-Object Compiler: MOC


    Though the code for entering signal and slot functions, as well as for

    making the connections, may appear straightforward to the programmer,

    it actually requires much more complex C++ coding. Signal and slot

    functions need to be preprocessed by the Meta-Object Compiler

    (MOC) to generate the C++ code that can implement the signal and

    slot message-connection process. You then include the output of MOC

    in your source code file for compiling. This means that you should place

    the class declarations for any classes that have signals and slots in separate

    header files. You can then preprocess these header files and include

    the output in the source code.


    You cannot combine the member function definitions with the class

    declaration. To compile, the class declaration has to first be preprocessed

    by MOC before it can be combined correctly with the member function

    definitions. This necessitates placing the class declaration in a separate file

    from the functions so that the class declaration can be separately

    preprocessed by MOC.


    Table 10–2 lists the different MOC options.'
