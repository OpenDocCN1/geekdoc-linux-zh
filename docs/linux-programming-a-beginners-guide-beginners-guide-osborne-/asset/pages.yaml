  md: '# TCSH Shell Variables


    In the TCSH shell, you need to first declare a variable before you can use it.
    You declare a variable with the set command followed by the variable''s name.
    Here are the rules for naming a variable:


    +   - May be any set of alphabetic characters, including the underscore.

    - May include a number, but the number cannot be the first character in the name.

    - May not include any other type of character, such as an exclamation point, ampersand,
    or even a space. These symbols are reserved by the shell for its own use.


    The next example declares the variable greeting. You can later undefine the variable
    with the unset command.


    ```

    set greeting

    ```


    > Note A name may not include more than one word, since the shell parses the command
    line on the space. The space is a delimiter between the different elements of
    the command line.


    You also use the set command to assign a value to a variable. You type in the
    keyword set, the variable name; the assignment operator, = and then the value
    assigned. Any set of characters can be assigned to a variable. In the next example,
    the variable greeting is assigned the string "hello".


    ```

    set greeting="hello"

    ```


    In the TCSH shell assignment operation, you need either to place spaces on both
    sides of the assignment operator or to have no spaces at all. This assignment
    operation


    ```

    set greeting="hello"

    ```'
