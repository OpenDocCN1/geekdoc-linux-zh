    \ member functions in a class that differ only in that they can be connected to\
    \ a signal. They also can be called as regular functions. You make slots protected,\
    \ private, or public and thereby control what objects can have their signals connect\
    \ to them.\n\n```\nsignals:\n  void mySignal();\nprivate slots:\n  void myslot1();\n\
