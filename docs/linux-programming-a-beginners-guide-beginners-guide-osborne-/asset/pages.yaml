    \ is specified with the if structure, followed by other alternatives, each specified\
    \ by its own else-if component. The alternative to the last if is specified with\
    \ an else. If the test for the first if structure fails, control will be passed\
    \ to the next if structure following the next else, and its test will be executed.\
    \ If it fails, control is passed to the next if structure and its test checked.\
    \ This continues until a test returns true. Then that if has its commands executed\
    \ and control passes"
