  md: 'function can use a series of special control specifiers and constants to format
    your output. The syntax for the printf function follows:


    printf("format-string", arg1, arg2, ..., argn);


    The printf function takes as its first a format string. This is usually a string
    enclosed in double quotes, containing conversion specifiers or any constants you
    want to output. Any characters in the format string are taken as characters to
    output. Nonprinting characters, such as the newline and tab, are represented with
    their quoted equivalents.


    "hello\n"


    After the format string, you list as arguments the values you want to output.
    These can be the values of variables, such as field variables or special variables.
    They can also be values that result from expressions, such as arithmetic expressions.
    In most cases, you will be listing variables whose values you want to output as
    arguments.


    For each argument that you list, you need to have a corresponding conversion specifier
    in the format string. A conversion specifier consists of a percent sign (%) followed
    by a one-letter code indicating a certain type of conversion. A conversion specifier
    takes the value of an argument and converts it to characters that can then be
    output. For example, the %d conversion specifier will take an integer value, such
    as 465, and convert it to the characters 4, 6, and 5, which can then be output.
    In most cases, you will be outputting strings, and the conversion specifier for
    a string is %s. The conversion specifiers are listed in Table 5–4.


    Conversion specifiers in your format match up sequentially to the arguments that
    you list. The first conversion specifier in the format string will convert the
    first argument, the second conversion specifier will convert the second argument,
    and so on. In the next example, the user outputs the integer value 23 and the
    string "visitors" using first a %d and then a %s conversion specifier.


    ```

    printf("%d %s", 23, "visitors");

    ```'
