  md: '# Module 7: Tool Command Language (Tcl)


    The tcsh command is implemented as a link to the actual tcsh program. This program''s
    name consists of the tcsh with the version number attached, such as tcsh.8.3 for
    version 8.3. If your system does not implement a tcsh link, you will have to use
    the tcsh command or implement a link yourself.


    You can run a tcl script either as a stand-alone program or as a file explicitly
    read by the tcl shell command tclsh. A Tcl script has the extension .tcl. For
    example, the myread.tcl Tcl script would be read and executed by the following
    command:


    ```

    $ tcsh myread.tcl

    ```


    To create a stand-alone script that operates more like a command, you need to
    invoke the tcl command within the script. You can do this by placing an explicit
    path name for the tclsh command as the first line of the script, as shown here:


    ```

    #!/usr/bin/tclsh

    ```


    # Tcl Commands


    The Tcl programming language is simple to use. Its statements consist of a command
    followed by arguments; it also has a complete set of control structures, including
    while and for loops. Commands can be terminated either by a semicolon or by a
    newline character. You can think of a Tcl command as a function call, where the
    command operates like a function name, followed by arguments to the function.
    However, unlike the function call, no parentheses or commas enclose the arguments.
    You simply enter the command and its arguments, separated only by spaces. A newline
    character entered after the last argument will end the statement.


    You can see the features in this format clearly in the Tcl assignment command
    set. To assign a value to a variable, you first enter the assignment command set.
    Then enter the name of the variable followed by the value to be assigned. The
    command name, variable, and value are separated only by spaces. The newline at
    the end of the line ends the statement. The following statement assigns a string
    "Dylan" to the variable myname, and the next statement assigns the integer value
    5 to the variable age.


    ```

    set myname "Dylan"

    set age 5

    ```'
