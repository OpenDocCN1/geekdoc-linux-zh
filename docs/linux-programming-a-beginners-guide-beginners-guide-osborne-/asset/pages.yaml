    # Field Delimiters


    By default, GAWK separates fields by spaces or tabs. However, if you want to use
    a specific delimiter, you can specify one with the -F option.

    The -F option actually sets a GAWK special variable called FS, which stands for
    field separator. With the -F option, you can specify any character for your delimiter.


    In the next example, the books file uses a colon to separate fields. The -F option
    causes GAWK to treat the colon as a field delimiter.


    ```

    $ gawk -F: ''{print $1, $3}'' books

    War and peace 15.75

    Christmas carol 3.50

    Iliad 10.25

    Raven 2.50

    ```'
