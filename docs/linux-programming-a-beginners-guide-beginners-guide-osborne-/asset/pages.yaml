  md: 'To execute a Perl single command on the shell command line, use the command
    perl with the -e option. The Perl command you want to execute should then be entered
    and quoted within single quotes. The following Perl operation prints the string
    "hello" using the Perl print command. The command ends with a semicolon.


    ```

    perl -e ''print "hello";''

    ```


    # Note


    You can use Perl this way for simple operations, much as you would single-line
    GAWK commands. This command use of Perl is rare. Normally, Perl commands are placed
    in script files that are then executed, like shell scripts.


    # Ask the Expert


    **Question:** How can Perl read from the standard input?

    **Answer:** Perl will not read from the standard input unless explicitly instruct
    it to with a while loop. Unlike GAWK, it does not read the standard input by default.
    The following example searches for the pattern "Dickens". The file books is first
    output to the standard output by the cat command piped to the Perl command as
    standard input.


    ```

    cat books | perl -e ''while(<STDIN>){if(/Dickens/){ print; }}''

    ```


    The following GAWK command is equivalent.


    ```

    cat books | gawk ''/Dickens/{print}''

    ```


    This is discussed in greater detail in the “Input and Output” section. later in
    this module.'
