  md: '# The wish Shell and Scripts


    Within the wish shell, you can interactively enter commands and execute them one
    by one, or you can place the commands in a script file and execute all at once.
    Usually, Tk commands are placed in a script that is run with the invocation of
    the wish command. Like Tcl scripts, Tk scripts usually have the extension .tcl.
    For example, a Tk script called mydir.tcl would be read and executed by the command
    entered in Xterm:


    ```

    $ wish mydir.tcl

    ```


    To create a stand-alone script that operates more like a command, you need to
    invoke the wish command within the script. Ordinarily, the wish command will open
    an interactive Tk shell window whenever executed. To avoid this, invoke wish with
    the -f option, like so:


    ```

    #usr/bin/wish -f

    ```


    # Note


    When creating a stand-alone script, be sure to change its permissions with the
    chmod command to allow execution. You can then enter the name of the script to
    run the program. To read more about the chmod command, refer to Module 2.


    ```

    $ chmod 755 mydir

    $ mydir

    ```


    # Tk Widgets


    A type of widget is considered a class, and each widget class has its own class
    command to create it. The corresponding command will create a particular instance
    of that widget class—that is, a particular widget of that type. For example, you
    can create a button with the button command or a window with the window command.
    Graphical objects, such as buttons and frames (discussed later in the module in
    the section “Frames and Tags”) are often referred to as widgets. Table 8-1 lists
    the widgets available in Tk.'
  merge: -1
