  md: '# Essential Skills for First-Time Programmers

    Linux Programming

    A Beginner’s Guide


    earn the fundamentals of Linux programming by following the steps and examples
    in this easy-to-use guide. Linux expert Richard Petersen uses hands-on exercises
    to teach you how to program the BASH and TCSH shells, customize Linux using Perl,
    Tcl, and GAWK, and write GUI programs in Tk. You''ll also learn GUI programming
    techniques for interfaces such as the GNOME and KDE desktop environments. If you
    want to get started programming the Linux OS right away, this is the perfect self-paced
    learning solution for you.


    +   This Beginner’s Guide is Designed for Easy Learning:

    - Modules—Each programming concept is divided into logical modules (chapters),
    ideal for linear learning

    - Goals—Each module opens with the specific programming skills you''ll have by
    the end of the module

    - Ask the Experts—Q&A sections throughout

    - 1-Minute Drills—Quick self-assessment sections to check your progress

    - Annotated Syntax—Example code annotated with commentary points to the particular
    technique illustrated

    - Projects—Coding exercises contained in each module that build on one another,
    from simple to complex

    - Mastery Checks—End-of-module reviews that test proficiency using multiple-choice,
    fill-in-the-blank, and simple coding questions


    ABOUT THE AUTHOR:

    Richard Petersen, M.I.L.S., is the author of Linux: The Complete Reference, Linux
    Programmer’s Reference, and Red Hat Linux: The Complete Reference. He teaches
    UNIX and C/C++ courses at the University of California at Berkeley.


    | OSBORNE

