  md: '# Module 8: Tk 279


    Tk commands use a format similar to those used in Tcl. You enter a Tk command
    on a line followed by its arguments. Tk commands are more complicated than Tcl
    commands, however. Graphical interface commands require a significant amount of
    information about a widget to set it up correctly. For example, a button requires
    a name, the text it will display, and the action it will take. Tk commands can
    take various options that indicate different features of a widget. With these
    options you can display images in widgets (-image), set background and foreground
    colors for widgets, and determine where information is displayed on a widget (anchor).
