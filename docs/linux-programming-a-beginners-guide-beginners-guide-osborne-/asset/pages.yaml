  md: "# Linux Programming: A Beginner’s Guide\n\nWidgets are organized hierarchically.\
    \ For example, if you want to set up a window for data input, you may need to\
    \ create a frame, within which may be text fields as well as buttons. Widget names\
    \ reflect this hierarchy. So the widget (text field) contained within another\
    \ widget (the frame) is prefixed with the outermost widget's name. In this example,\
    \ then, if the name of the frame is report and you want to call the text input\
    \ field report.monday. A period separates each level in the hierarchy. Similarly,\
    \ that you want to call ok that is within the report frame be named report.ok.\n\
    \nOnce you have your widgets, you need to define their geometry. The geometry\
    \ determines the size of each widget in relation to the others, their shape, and\
    \ their location in the window. Tk has three geometry managers: pack, place, and\
    \ grid.\n\n| Geometry Manager | Description |\n| --- | --- |\n| pack | Packs widgets\
    \ next to each other |\n| place | Places widgets in positions in frame |\n| grid\
    \ | Places widgets in a grid of rows and columns |\n\nYour widgets cannot be displayed\
    \ until their geometry is determined. The following example determines the geometry\
    \ of the .mybutton widget using the pack command.\n\n```\npack .mybutton\n```\n\
    \nA line of Tk code can be very long. You may want to split it into two or more\
    \ lines in your script to make it easier to read. However, to break a single code\
    \ line into two you must place a backslash at the end of the first line of script.\
    \ For example, the following single line of code has been broken into two script\
    \ lines by placing a \\ at the end of the first line:\n\n```\nlistbox .list -yscroll\
    \ \".scroll set\" -relief sunken \\\n      -width 15 -height 15 -gridset yes\n\
    ```\n\nMany of the long lines of code in the examples and programs in this chapter\
    \ are split into two or more lines in the script, even though they are interpreted\
    \ by Tk as only one line. Any line ending with a \\ is part of a single code line\
    \ that is continued on the next,script line."
