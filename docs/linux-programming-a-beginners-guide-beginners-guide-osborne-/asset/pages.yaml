  md: '# Tcl string string Command


    The Tcl string command is used to perform different operations on strings. It
    takes various options, depending on the task you want to perform. You can search,
    substring, or obtain the length of a string. The option is entered as a word following
    the string command. Arguments will vary according to the option you choose. Table
    7-7 shows the Tcl string commands.


    With the string match command, you can perform basic search operations on a string,
    although regular expressions are not supported by this command. It does support
    *, ?, and [] special characters for simple pattern matching, as used in the shell
    for file name matching. string match takes two arguments: the pattern to match
    and the string to search, as shown in this example:


    ```

    string match report* Sname

    ```


    The string range command returns a substring of a specified string. It takes three
    arguments: the string, beginning and end indices. The count starts from 0. The
    term used for the end index will automatically copy the remainder of the string,
    as shown in the following example. The first example returns "ave" and the second
    returns "ven":


    ```

    string range 4 9

    string range 3 end

    ```


    | Command | Description |

    | --- | --- |

    | binary | Converts between strings and binary data |

    | regexp | Matches on a string using regular expressions |

    | regsub | Performs substitutions with patterns with regular expressions |

    | split | Splits a string into list elements |

    | string | Operates on strings |

    | subst | Performs substitutions on a string |


    # Table 7-7 Tcl String Operations'
  merge: -1
  pgno: 290
