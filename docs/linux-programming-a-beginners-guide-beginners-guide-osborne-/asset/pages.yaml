  md: '# Arithmetic and Assignment Operations


    GAWK has a full set of arithmetic operators. You can perform multiplication, division,
    addition, subtraction, and modulo calculations. The arithmetic operators are the
    same as those used in the C programming language, and they are listed in Table
    5-8, along with the assignment operators, which will be discussed shortly.


    | Arithmetic Operators and Functions | Description |

    | --- | --- |

    | * | Multiplication |

    | / | Division |

    | + | Addition |

    | - | Subtraction |

    | % | Modulo; results in the remainder of a division |

    | int(num) | Truncates a floating-point number, *num*, to its integer value |

    | cos(num) | Returns the cosine of *num* |

    | sin(num) | Returns the sine of *num* |

    | log(num) | Returns the natural log of *num* |

    | exp(num) | Returns the exponential of *num* |

    | sqrt(num) | Returns the square root of *num* |

    | rand() | Returns a random number |

    | srand() | Uses *num* as a seed for **rand** |

    | Assignment Operators | |

    | = | Assignment |

    | ++ | Increment |

    | -- | Decrement |

    | += | Addition and assignment; *i = i + 1* is the same as *i += 1* |

    | -= | Subtraction and assignment; *i = i - 1* is the same as *i -= 1* |

    | *= | Multiplication and assignment; *i = i * 1* is the same as *i *= 1* |

    | /= | Division and assignment; *i = i / 1* is the same as *i /= 1* |

    | %= | Modulo and assignment; *i = i % 1* is the same as *i %= 1* |


    **Table 5-8** The GAWK Arithmetic and Assignment Operators and Functions'
