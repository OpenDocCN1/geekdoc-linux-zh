  md: '# Module 4: TCSH Shell Programming


    # Loop Structures: while, foreach, and repeat


    The TCSH shell has a set of loop control structures that allow you to repeat Linux
    commands: while, foreach, and repeat. The TCSH shell loop control structures are
    like a way similar to corresponding structures found in programming languages.
    Table 4-5


    The while structure operates in a way similar to corresponding structures found
    in programming languages. Like the TCSH shell''s structure; the while structure
    tests the result of an expression. The TCSH shell''s foreach structure, like the
    for and for-in structures in the BASH shell, does not perform any tests. It simply
    progresses through a list of values, assigning each value in turn to a specified
    variable. In this respect, the foreach structure is very different from corresponding
    structures found the repeat structure is a simple and limited control structure.
    It repeats one command a specified number of times. It has no expression, and
    it cannot repeat more than one command.


    # The while Structure


    The while loop repeats commands. A while loop begins with the keyword while and
    is followed by an expression enclosed in parentheses.


    | Loop Control Structures | Description |

    | --- | --- |

    | while(expression) command | Executes commands as long as the expression is true.
    |

    | foreach (arg-list) command | Iterates the loop for as many arguments as exist
    in the argument list. Each time through the loop, the variable is set to the next
    argument in the list; operates like for-in in the BASH shell. |

    | repeat num command | Repeats a command the specified number of times. Jump to
    next iteration, skipping the remainder of the loop commands. |

    | break | Break out of a loop. |


    Table 4-5 TCSH Loop Control Structures'
