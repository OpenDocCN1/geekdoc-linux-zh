    \ a specific signal as you wish. They will be executed sequentially when the signal\
    \ occurs.\n\n**Question:** Once a callback function is associated with an object,\
    \ can I disassociate it?\n\n**Answer:** You can, but you need to reference the\
    \ tag for function. The return value of the gtk_signal_connect function is an\
    \ identifying tag for function. Save this value to a variable of type int. If\
    \ you want to later disassociate that function from the particular object and\
    \ signal, use the gtk_signal_disconnect function with the identifying tag and\
    \ object as arguments.\n\n```\nvoid gtk_signal_disconnect(GtkObject *object,\n\
    \    int id);\n```\n\nIn the following example, the myfunc function is associated\
    \ with a mouse click on the button1 object. Its identifying tag is saved in the\
    \ myfunc variable, which is used in the gtk_signal_connect function to disassociate\
    \ myfunc from the mouse-click operation.\n\n```\ngint myfuncid;\n\nmyfuncid =\
    \ gtk_signal_connect(GTK_OBJECT (button1),\n    \"clicked\", GTK_SIGNAL_FUNC (myfunc),\
