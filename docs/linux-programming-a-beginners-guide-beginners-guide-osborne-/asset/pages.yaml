    # # Variables and Expressions


    Perl variables can be numeric or string variables. Their type is determined by
    context—the way they are used. You do not have to declare them. A variable that
    is assigned a numeric value and is used in arithmetic operations is a numeric
    variable, and all others are treated as strings. To reference a variable in your
    program, you precede the variable name with a dollar sign ($), just as you would
    for a shell variable.


    You can use the same set of operators with Perl variables as with C variables,
    with the exception of the operators for strings. Strings use the same special
    comparison terms as used in BASH shell; the standard comparison operators are
    reserved for numeric variables. However, other operators, as assignment operators,
    work on both string and numeric variables. Arithmetic operators and assignment
    operators work on numeric values. The various Perl operators are listed in Table
    6-4.


    In the next example, the variable myname is assigned the string "Aleina". The
    assignment operator is the equal symbol (=).


    ```

    $myname = "Aleina";

    ```'
