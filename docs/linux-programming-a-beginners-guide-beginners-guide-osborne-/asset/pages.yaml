    \ the Expert\n\n**Question:** In a switch structure, can I specify several patterns\
    \ for the same body?\n\n**Answer:** If the hyphen (−) is used as the body for\
    \ the **switch** entry, a match on its pattern will execute the block for the\
    \ next pattern. The next pattern also has a hyphen for its body, the body after\
    \ that is used, and so on. Using hyphens in **switch** entry bodies makes it possible\
    \ for you to share a single body among several preceding patterns. This is how\
    \ you can easily specify alternative patterns for a given block—for example, uppercase\
    \ and lowercase instances of a character. In the following example, a match on\
    \ an uppercase S will execute the block for the following lowercase s.\n\n```\n\
    S -\ns {\n  ls -S\n}\nThe - will fall through to the next body\n```\n\n**Question:**\
    \ Can I use the regular expressions in switch tests?\n\n**Answer:** Using regular\
    \ expressions in patterns can give you a great deal more flexibility than simple\
    \ patterns. If you use the | special character in the pattern, it will allow you\
    \ to specify more than one match character. For example, using c|C will match\
    \ on both an uppercase C and a lowercase c. In the next example, c|C will match\
    \ both uppercase and lowercase versions:\n\n```\nc|C {\n  ls -1\n}\n```"
