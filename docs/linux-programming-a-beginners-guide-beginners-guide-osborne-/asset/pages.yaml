  md: '# 1-Minute Drill


    +   - What are the different geometry managers for Tk?

    - What is the command you use to invoke Tk?


    # Ask the Expert


    Question: How do the geometry commands differ?


    Answer: The pack geometry command simply packs in widgets next to each other,
    taking only the amount of space in a frame or window to fit in a form. You can
    add padding to space them out more if necessary. The place geometry command lets
    you position a widget at a particular place in the frame. The grid geometry command
    lets you set up a cell-like grid, in which you can position widgets.


    Question: When would I use grid?


    Answer: A grid is helpful for arranging widgets in a particular format, such as
    in a form. For example, if you want to set up a form with entry boxes and buttons,
    you can use a grid to place the widgets at different parts of the form. To reference
    a particular cell in the grid, you would specify its row and column.


    Question: How do you use the place command?


    Answer: The place geometry command comes handy when you want to position a widget
    at a particular point on the window or frame that is further away from other widgets.
    While the pack and grid commands place widgets next to each other, you can use
    place to put the widget anywhere by specifying x and y coordinates. For example,
    you could place to put an OK button widget in a corner away from a text widget
    that appears in the middle of the screen.


    +   - pack, place, and grid

    - wish'
