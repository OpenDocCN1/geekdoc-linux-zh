  md: '# Parent-Child Objects


    You construct a Qt interface using objects that you place in hierarchical structures,
    with lesser objects designated as dependent on a major object. For example, a
    window would be a major object that in turn would have lesser objects such as
    menus, toolbars, and slider bars on it. The major object is the parent, and the
    lesser objects are its children. When you create a major widget like a window,
    you can also create lesser widget toolbars that you then attach to the window.
    You do this by making the lesser widget, such as the toolbar, a child of the major
    widget (like the window). A child widget can, in turn, be a parent to its own
    child widgets. In constructing an interface, you place widgets in a hierarchical
    structure of parent widgets and their children.


    To create a complex widget, such as a window with its dependent children, you
    first define the parent widget. Then, when you define a child of parent, you place
    the address of the parent widget as an argument in the widget''s definition.


    The following example defines a button widget named quit and makes it a child
    of the window widget. The window now includes the button widget. Notice that the
    & operator is used to obtain the address of the parent widget.


    ```

    QPushButton mybutton( "Quit", &mywin );

    ```


    The window now includes the button widget. Notice that the & operator was used
    to obtain the address of the parent widget.


    When you display the parent widget, all its child widgets are automatically displayed.
    In the following example, the show member function for the window widget will
    also "show" the mybutton button:


    ```

    myapp.setMainWidget( &mywin );

    mywin.show();

    ```


