  md: '# Events and Bindings


    A Tk program is event driven, which means that as it runs it waits for an event,
    such as a mouse event or a keyboard event, to take an action. A mouse event can
    be a mouse click, a double-click, or even a mouse down or up. A keyboard event
    can be a pressed control key or meta-key, or it be the pressing of the ENTER key
    at the end of input data. When the program detects a particular event, it takes
    an action. The action may be another graphical representation, such as displaying
    another menu, or it may be a Tcl, Perl, or shell program execution.


    Actions are explicitly bound to given events using the bind command. The bind
    command takes its arguments as the name of an object or class, the event to bind,
    and the action to that event. Whenever the event takes place within that object,
    the specified action is executed. Following is an example of a bind entry. The
    event of pressing the CTRL-C key will perform the action of destroying all widgets,
    ending the program.


    ```

    Widget Event pattern Action

    bind all <Control-c> {destroy }

    ```


    You use the bind command to connect events in a Tk object with a Tcl command you
    executed. In a sense, you are dividing your Tcl program into segments, each of
    which is connected to an event in a Tk object. When an event takes place in a
    Tk object, its associated set of Tcl commands is executed. Other Tk commands,
    as well as Tcl commands, can be associated with an event bound to a Tk object.
    This means you can nest objects and their events. The Tcl commands executed by
    one Tk event may, in turn, include other Tk commands and objects with events bound
    to yet other Tcl commands.


    An event can be either a keyboard event triggered by pressing a key on a keyboard,
    or a mouse event triggered by a click of the mouse button. An event is represented
    in Tk code as an event pattern. For example, pressing the BACKSPACE key Event
    patterns are enclosed in < > symbols. A mouse button click is represented as <Button-1>.
    To portray a sequence of events, such as a double-click, you enter a modifier
    before the event. For example, the event pattern for double-click is <Double-Button-1>,'
  merge: -1
