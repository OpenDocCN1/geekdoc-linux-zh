  md: "# Module 5: GAWK\n\nFor example, suppose you want to perform an action not\
    \ on the line you are matching on, but on the line following it. You can use the\
    \ powerful pattern-matching capabilities of a gawk command to locate the line\
    \ you need to match on, and then, using getline, read the following line and perform\
    \ whatever operation you want on it.\n\nThe getline command reads a line of input\
    \ and places it in the $0 variable. The first time you use getline in an action,\
    \ it replaces the input line that has just been automatically read by GAWK. Be\
    \ sure to perform any operations you need on the input line before you wipe it\
    \ out with your getline statement.\n\nWhen using getline in a loop, you need to\
    \ check for an end-of-file condition. getline will not automatically stop GAWK\
    \ at the end of a file, but it returns 0 if the end of the file is reached. It\
    \ returns 1 if you are not at the end. You can assign this return value to a variable\
    \ and then the variable in your loop so that you can loop until you reach the\
    \ end.\n\nIn the example that follows, the script makes use of the end variable\
    \ to check whether the end of the file has been reached (endfile is an ordinary\
    \ variable). First, endfile is initialized to 1, and then it is checked within\
    \ the while loop's test. In each call to getline, the return value of getline\
    \ is assigned to the endfile variable; so if the end of the file is reached, getline\
    \ will return 0, which will be assigned to endfile, making the while test on endfile\
    \ false. The initialization in this example is redundant, but it is included for\
    \ emphasis.\n\nThe script is designed to extract all table-formatted text from\
    \ a UNIX troll file. You could use the same logic to extract a range of lines\
    \ from any document with begin and end separators. Any range of lines beginning\
    \ with .TS and ending with .TE are table-formatted text. The gawk command matches\
    \ the initial .TS, and the loop continues reading lines until the end of the file\
    \ is reached or the ending .TE is reached. Recall that the ^ character indicates\
    \ a pattern at the beginning of a line, so /^/\\\\.TS/ specifies a line beginning\
    \ with .TS.\n\n```\n/^\\\\.TS/\n  endfile = 1;\nwhile(endfile != 0) && ($0 ~ /^\\\
    \\.TE/ )) {\n    print $0;\n    endfile = getline;\n}\nprint $0;\n```"
