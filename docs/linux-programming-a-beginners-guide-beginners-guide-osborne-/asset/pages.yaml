    \  gawk-actions\nelse\n  gawk-actions\n```\n\n# Note\n\nTake special note, that\
    \ there is no semicolon at the end of the GAWK actions that come before the else.\
    \ The GAWK if-else is similar to the C programming language's if-else structure\
    \ with this one exception. If you use programming languages, you may inadvertently\
    \ add a semicolon, which will be considered an error because GAWK separates actions."
