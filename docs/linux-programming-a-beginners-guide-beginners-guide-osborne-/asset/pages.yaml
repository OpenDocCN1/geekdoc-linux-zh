  md: '# Arrays and Associative Arrays


    A subscript enclosed in brackets and placed next to an array name references an
    element in the array. Like variables, the first use of a subscript in GAWK also
    defines the array. Unlike programming languages, arrays are not declared, and
    no maximum size needs to be given for an array. An array will dynamically expand
    as elements are referenced.


    In the following example, the array titles is defined. Each element of titles
    is assigned the value of the first field of a line. There will be only as many
    elements in the array as there are values assigned. The variable num is used to
    reference each element of the array, and it is incremented after each use. At
    the end, the array is printed out.


    ```

    $ gawk ''{titles[num] = $1; num++} END {print titles[num - 1]}'' books

    Raven

    ```


    Suppose, however, that you want to assign each field in a particular record to
    an array. You could do this through individual assignment operations for each
    field, but GAWK provides a shortcut. You can assign fields to array elements with
    the split function. The split function takes as arguments an array, and a field
    separator. The field separator is specified by a string—to use a colon as a field
    separator, you would specify the string \:". The field separator is optional,
    and if no field separator is entered, either a tab or a space is assumed by default.


    The split function can operate on any string. split("9-10-92", "-", date) assigns
    9 to date[1], 10 to date[2], and 92 to date[3]. In the following example, each
    field in a line is assigned an element of the myrec array. The line is assigned
    by the search pattern /Dickens/. The fields are then output in reverse order.


    ```

    $ gawk ''/Dickens/ {split($0, myrec); print myrec[4], myrec[3], myrec[2], myrec[1]}''
    books

    Academic 3.50 Dickens Christmas

    ```


    GAWK also allows you to define associative arrays. An associative allows strings
    to be array subscripts. Suppose you want to reference an author''s publisher by
    the author''s name. In the next example, and in Figure 5–2, the user assigns publishers
    to an array index indexed by the author''s'
