  md: '# Module 6: Perl 225


    For constants, the (@ list holds only values. However, if you use a variable or
    array as an argument, then (@) will reference those objects. In effect, with variables
    and arrays, call-by-reference is implemented. This means that references to elements
    of the (@ array reference the original objects. Changes made by referencing these
    objects through the (@ array will change the original objects in the calling function.
    Therefore, if a string variable is used as an argument to a function, and that
    argument is referenced through @ and is assigned a new value in a subroutine,
    then the value of that variable is changed in the calling function, too.


    Return values can be specified by the return statement. Any values listed with
    it are placed in a list and returned to the calling statement. If there is no
    return statement, then the value of the last statement in the subroutine is the
    returned value. This means that a Perl subroutine can return more than one value.
    Values can be returned and assigned to a list of variables.


    # Scoping


    Scoping allows you to define variables that exist only within a subroutine or
    file. Those familiar with scoping in other programming languages will find some
    differences in Perl. With the my operation, you can define a local variable known
    only to a subroutine.


    The my operation restricts the scope of a variable to the function or block within
    which was defined. A variable defined with my is technically a static variable
    though within a subroutine, and it operates like a C variable. However, if you
    define a variable with the my operation outside of any subroutine at the top of
    the file, then it operates like a C static variable. Such a variable is known
    to all subroutines within Perl script, but not to any other Perl scripts that
    may make up the Perl program.


    The my operation works within blocks as well as within subroutines. You can define
    a block by itself, without making it part of a function definition or control
    structure. Any variables you define in it with the my operation will only be known
    within it. Should you define a variable with the my operation within a block and
    then follow it with a subroutine also defined within that block, then the variable
    will be visible to the subroutine.


