    # How UNIX Came to Be


    As a version of UNIX, Linux''s history naturally begins with UNIX. The story begins
    in the late 1960s during a concerted effort to develop new operating system techniques.
    In 1968, a consortium of researchers from General Electric, AT&T Bell Laboratories,
    and the Massachusetts Institute of Technology carried out a special operating
    system research project called MULTICS (Multiplexed Information Computing System).
    MULTICS incorporated many new concepts in multitasking, file management, and user
    interaction. In 1969, Ken Thompson, Dennis Ritchie, and the others at AT&T Bell
    Laboratories developed the operating system, incorporating many of the features
    developed by the MULTICS research project. They tailored the system for the needs
    of a research environment, designing it to run on minicomputers. From its inception,
    UNIX was an affordable and efficient multiuser and multitasking operating system.


    The UNIX system became popular at Bell Labs as more and more researchers started
    using the system. In 1973, Ritchie and Thompson rewrite the programming code for
    the UNIX system in the C programming language. Ritchie developed the C programming
    language as a flexible tool for program development. One of the advantages of
    C is that it directly access the hardware architecture of a computer with a generalized
    set of programming commands. Until this time, an operating system had to be rewritten
    in hardware-specific assembly language for each type of computer. The C programming
    language allowed the researchers to write only one version of the UNIX operating
    system that could then be compiled by C compilers on different computers. In effect,
    the UNIX operating system became transportable—able to run on a variety of different
    computers with little or no reprogramming.'
