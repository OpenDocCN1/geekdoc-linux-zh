  md: "# Module 10: KDE 377\n\nbetween two objects. Since they are merely communicating\
    \ messages, signals and slots can be made very robust. They can take a varying\
    \ number of arguments of different types, and you can connect any number of signals\
    \ to the same slot. Signals and slots can be used in any classes that inherit\
    \ from the QObject class, as as QWidget. Any object can contain both signals to\
    \ send messages and slots to receive messages.\n\nWhen an event occurs on a widget,\
    \ it will emit a signal. That is all it does. It does not set up a connection\
    \ to another object. To be able to receive a message from a signal, an object\
    \ must set up a slot. A slot is just a member function that is executed when the\
    \ object receives a signal. Conceptually, slots are used to obtain information\
    \ about a change in other objects. A slot does not know if there are actually\
    \ any signals connected to it, and a signal does not know if there are any slots\
    \ to receive it.\n\nYou use the connect function to set up a connection between\
    \ a signal in one object and a slot in another. You can connect as many signals\
    \ as you want to a single slot, and each object can have signals to send messages\
    \ and slots to receive messages. The connect functions will set up a connection\
    \ between two objects, connecting a signal from one to a slot in another.\n\n\
