  md: '# Special Variables and Arrays: argv and env


    Every time you run a Tcl script, several special arrays and variables are set
    for your use in the program. Tcl sets up an argv variable that holds the arguments
    you used on the UNIX command line when you invoked your program. The special variable
    argc holds the count of the number of arguments. And argv0 holds the name of your
    program.


    Tcl also sets a special associative array env that holds all the environmental
    variables from your Unix shell. You can reference the value of any of these Tcl
    environmental variables by using the name to index the env array. For example,
    Senv(HOME) gives you the value of Senv(PATH) provides the paths used in command
    lookups.


    # Lists


    Tcl supports a type of object not found in most programming languages: the list
    is a set of words, strings, or numbers encased in braces { }. Tcl includes a set
    of flexible list commands that you can use to manipulate lists, by combining them,
    separating them, or adding and deleting elements from them. Table 7–3 shows several
    of the commonly used list commands.


    | Command | Description |

    | --- | --- |

    | set list values | Creates a list and assigns values to it |

    | lsearch list pattern | Searches for a pattern in elements of a list |

    | lindex list index | Returns the value of the indexed element in a list |

    | llen list | Returns the number of elements in a list |

    | range list first last | Returns a subrange of the list specified by first and
    last |

    | insert list index value-list | Inserts a new element into a list after the index
    |

    | replace list index value-list | Replaces the element indexed with a new value
    |

    | lappend list-name value-list | Appends new values to the list |

    | concat lists | Combines elements of several lists into one |


    Table 7-3 Tcl List Operations'
