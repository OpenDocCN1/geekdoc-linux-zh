  md: '# Field Variables and Field Delimiters


    Field variables are designed to reference fields in a line. A field is any set
    of characters separated by a field delimiter, and the default delimiter is a space
    or a tab. GAWK defines a field variable for each field in the file. A field variable
    consists of a dollar sign ($) followed by the number of the field; and with other
    database filters, GAWK numbers starting from 1, so the field variable S2 references
    the second field. The variable S0 is a special field variable that contains the
    entire line.


    > Hint

    A variable may be used in the pattern or action segment of the GAWK instruction.
    If more than one variable is listed, they are separated by commas.


    In the next example, illustrated in Figure 5-1, the variables S2 and S4 reference
    the second and fourth fields, so the second and fourth fields of the books are
    printed out.


    ```

    $ gawk ''{print $2, $4}'' books

    Shakespeare Penguin

    Dickens Academic

    Homer Random

    Poe Penguin

    ```


    The books file used in this example follows.:


    | Tempest Shakespeare 15.75 Penguin |

    | Christmas Dickens 3.50 Academic |

    | Iliad Homer 10.25 Random |

    | Raven Poe 2.50 Penguin |


    In the next example, the user outputs the line with the pattern ""Dickens"" twice:
    first reversing the order of the fields, and then with the fields in order. The
    S0 variable is used to output all the fields in order—the entire line.


    ```

    $ gawk ''/Dickens/ {print $4, $3, $2, $1; print $0}'' books

    Academic 3.50 Dickens Christmas

    Christmas Dickens 3.50 Academic

    ```'
