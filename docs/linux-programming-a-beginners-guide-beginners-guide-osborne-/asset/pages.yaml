    # Dialog Boxes


    To create a simple dialog box, you can use the QMessageBox widget. You can then
    generate dialog boxes with different features by using the QMessageBox member
    functions (methods). For example, if you just want to display a message, receiving
    no information back from the user, then you can use the QMessageBox widget''s
    about function. It simply takes the parent object, the message title, and the
    message as its arguments. You can use escape sequences for newlines and tabs:
    \n and \t.


    ```

    QMessageBox::about(this, "Message box example", "This example demonstrates simple
    use of " "The message box.");

    ```


    For dialog boxes where you want the user to select one of several buttons, you
    use the QMessageBox object''s information function. It takes several arguments:
    its parent object, its title, the message text, and the buttons you want displayed.
    For separate lines on the message, place each line in its own string.


    The following example creates a simple message box with two lines of text and
    three buttons: OK, Cancel, and Apply.


    ```

    QMessageBox::information(this, "Save notice", "The document has been changed "
    "the last save.", "OK", "Cancel", "Apply",0, 1)

    ```


    The message box will return the number of the button selected. You can then use
    this result to select the action you want to take, as shown next.'
