    # Control Structures


    GAWK operates like a programming language and permits you to define

    variables, construct expressions, and assign values. It also includes a set of

    control structures to provide iteration and selection capability. There are

    three control structures for constructing loops in GAWK: the while, for,

    for-in loops. There is one selection control structure: the if structure.

    The GAWK control structures are listed in Table 5-9 and are described

    det in the following discussions. With the exception of the for-in loop,

    these control structures are similar to those in the C programming language.


    # The while Loop


    The while loop consists of the keyword while followed by a test expression

    encased in parentheses. A GAWK action follows the test expression, and

    several GAWK actions can be combined into a block of actions with

    braces, each separated by a semicolon. Placing a block of actions

    after the test expression of a while loop executes all those actions the

    loop. Here is the syntax for a while loop:


    ```

    while ( test expression )

    {

    ngawk-actions;

    }

    ```


    While loops require three components to work properly: an

    initialization, a test, and an increment. All components operate on a

    variable that is used to control the loop.


