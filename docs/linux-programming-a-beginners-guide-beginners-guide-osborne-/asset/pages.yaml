  md: '# Arithmetic Shell Operations: let


    The let command is the BASH shell command used for performing operations on arithmetic
    values. By using let, you can compare two values or perform arithmetic operations,
    such as addition or multiplication, on them. Such operations are often used in
    shell programs to manage control structures or perform necessary calculations.
    The let command can be indicated with the keyword let or with a set of double
    parentheses. The syntax consists of the keyword let followed by two numeric values,
    separated by an arithmetic or relational operator, as here:


    ```

    let value1 operator value2

    ```


    Here''s an example using double parentheses:


    ```

    $(( value1 operator value2 ))

    ```


    The let command automatically assumes that operators are arithmetic or relational.
    You do not have to quote shell-like operators. The let command also evaluates
    any variables and converts their values to arithmetic values. This means that
    you can write your arithmetic operations as simple arithmetic expressions. In
    the next example, the let command multiplies the values 2 and 7. The result is
    output to the standard output and displayed.


    ```

    let 2*=7

    14

    ```


    If you want to have spaces appear between operands in the arithmetic expression,
    you must quote the expression, as shown here. The let command expects one string.


    ```

    $ let "2 * 7"

    ```


    You can also include assignment operations in your let expression. In the next
    example, the result of the multiplication is assigned to res.


    ```

    let "res = 2 * 7"

    echo $res

    14

    ```'
  merge: -1
