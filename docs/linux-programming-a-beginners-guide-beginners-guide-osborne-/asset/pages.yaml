  md: '# 30 Linux Programming: A Beginner’s Guide


    A shell program combines Linux commands in such a way as to perform a specific
    task. A shell is like a command interpreter—it serves as a liaison between the
    user and the operating system. When you log in to your account, your Linux system
    generates your user shell. The primary shell used on Linux systems is the BASH
    shell. BASH stands for Bourne Again Shell and is based on the original Bourne
    shell used in UNIX systems.


    The BASH shell provides many programming tools that you can use to create shell
    programs. You can define variables and assign values to them. You can also define
    variables in a script file and have a user interactively enter values for them
    when the script is executed. The shell provides loop and conditional control structures
    that repeat Linux commands or make decisions on which commands you want to execute.
    You can also construct expressions that perform arithmetic or comparison operations.
    All these BASH programming tools operate in ways similar to those found in other
    programming languages, so if you''re familiar with coding, you might find BASH
    simple to learn.


    This module covers the basics of creating a shell program using the BASH shell,
    the shell used on most Linux systems. You will learn how to create your own scripts,
    define shell variables, and develop user interfaces, as well as the more difficult
    task of combining control structures to create complex programs. Tables throughout
    the module list BASH shell commands and operators, with numerous examples how
    they are entered.


    Usually, the instructions making up a shell program are entered into a script
    file that can be executed. To run the shell program, you execute its script file.
    You can even distribute your program among several script files, one of which
    contains instructions on how to execute others. You can think of variables, expressions,
    and control structures as tools you use to bring together several Linux commands
    into one operation. In this sense, a shell program is a new and complex Linux
    command that you have created.


    The BASH shell has a flexible and powerful set of programming commands that allow
    you to build complex scripts. It supports variables that can be either local to
    the shell or exported to other shells. The BASH shell has a complete set of control
    structures, including loops and if statements, as well as case structures—all
    of which you''ll learn about as you read this book. All shell commands interact
    easily with redirection and piping operations that allow'
  merge: -1
