  md: 'expressions, for use with strings and numeric values. You can also use pattern
    operations that allow the use of regular expressions.


    # Test Expressions


    Perl has different sets or operators for numeric and string comparisons. You have
    to be careful not to mix the different operators. The string operators are two-letter
    codes similar to those used in the BASH shell. For example, the eq operator tests
    for equality of two strings and the gt operator tests to see if one is greater
    than the other. Numeric comparisons, on the other hand, use symbols similar to
    those found in programming languages as operators. For example, > stands for greater
    than, and == tests for equality, and these are essentially the same comparison
    used for the C programming language. These operators were all listed earlier in
    the module in Table 6-4. There are two important exceptions: string patterns and
    patterns.


    The string-pattern operand =~ tests for a pattern in a string variable. The right-hand
    operand is the pattern and the left-hand operand is the string. The pattern can
    be any regular expression, making this a very flexible and powerful operation.


    Passforms perform pattern matching on either a string or the contents of the $_S
    variable. The pattern operator consists of two slashes to enclose the pattern
    /pattern/. The pattern can be any regular expression.


    There are also a number of tests that you can perform on a file to check its status.
    For example, you can use the -e to make sure a file exists or use a -s to check
    whether it is empty (see Table 6-7).


    # The Logical Commands: &&, || !


    Perl supports the AND (&&), OR (||), and NOT (!) logical operations. They take
    as their operands expressions, just as they do in the C programming language.
    Their syntax is as follows:


    ```

    (expression) && (expression)

    (expression) || (expression)

    !(expression)

    ```'
