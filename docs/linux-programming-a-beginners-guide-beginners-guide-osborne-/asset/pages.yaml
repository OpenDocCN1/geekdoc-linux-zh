  md: '# 234 Linux Programming: A Beginner''s Guide


    # # Hint


    As GAWK and Perl, variable types are determined by their use. A variable assigned
    an integer will be considered an integer, and one assigned a string will be a
    character array. For those readers who are familiar with Lisp, this command name
    will look familiar.


    You can use a number of Tcl commands to perform system tasks, by stopping a script
    (exit), changing a working directory (cd), or trapping errors (catch). These are
    listed in Table 7-1.


    # # Expressions


    Expressions are also handled as commands in Tcl. The command expr evaluates as
    an expression and returns its value as a string. It takes as its arguments the
    operands and operators of an expression. Tcl supports all the standard arithmetic,
    comparison, and logical operators. The result of an arithmetic expression will
    be the same form as its operands; so, for example, if the operands are real numbers,
    the result will be a real number. You can mix operands of different types, and
    Tcl will convert one to match the other. In case of real and integer operands,
    the integer will be converted to real automatically. In the first statement that
    follows, the addition of 4 and 3 is evaluated by the expr command. The next command
    multiplies 25 by 2.


    | Tcl Command | Action |

    | --- | --- |

    | catch | Traps errors |

    | cd | Changes the working directory |

    | clock | Returns the time and date strings |

    | error | Raises an error |

    | eval | Evaluates as a command as a list of arguments |

    | exec | Executes a Linux command |

    | exit | Ends the program and exit |

    | pwd | Returns the current working directory |

    | info | Queries the state of the Tcl interpreter |

    | trace | Checks values of variables |


    Table 7-1 Tcl System Commands'
