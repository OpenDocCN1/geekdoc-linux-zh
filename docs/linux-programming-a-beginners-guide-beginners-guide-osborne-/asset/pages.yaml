    # Input and Output


    A Perl script can accept input from different sources. It can read from different
    files, from the standard input, and even from pipes. Because of this, you have
    to identify the source of your input within the program; and unlike GAWK, like
    a shell program, you have to explicitly instruct a Perl script to read input.
    A particular source of input is identified by a file handle, a name used by a
    program to reference an input source such as a particular file. Perl already sets
    up a file handle for the standard input and the standard output, as well as the
    standard error. The file handle for the standard input is STDIN


