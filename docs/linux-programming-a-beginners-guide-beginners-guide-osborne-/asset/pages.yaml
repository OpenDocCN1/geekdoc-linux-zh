  md: 'Classes composed of several widgets, such as an application window,

    will often have connections from signals from the different widgets to

    the main widget. Connect operations are usually placed with the class

    declaration of the main widget for connecting signals from its subwidgets

    to itself. In this case, the main widget (object) can then be referenced with

    the C++ pointer reference, which always references the class being

    declared, as shown next.


