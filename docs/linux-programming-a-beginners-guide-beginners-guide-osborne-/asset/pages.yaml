    a variable and the keyword in. A set of patterns then follows. Each pattern is
    a regular expression terminated with a closing parenthesis. After the closing
    parenthesis, commands associated with this pattern are listed, followed by a double
    semicolon on a separate line, designating the end of those commands. After all
    the listed patterns, the keyword case command ends. The syntax looks like this:'
