  md: '# GAWK


    GAWK is a programming language designed to let Linux users create their filters.
    A filter reads information from an input source such as a file or the standard
    input, modifies or analyzes that information, and then outputs the results. Results
    can be a modified version of the input or an analysis. For example, the sort filter
    reads a file and then outputs a sorted version of it. The wc filter reads a file
    and then calculates the number of words and lines in it, outputting just that.


    With GAWK, you can design and create your own filters—in effect creating your
    own Linux commands. You can instruct GAWK to display lines in a text file like
    cat or to search for patterns like grep, or to count words like wc. In each case,
    you could add your own customized filtering capabilities to your programs. You
    could, for example, display only part of each line, search for a pattern in a
    specific field, or count only words that capitalized.


    The GAWK utility has the flexibility and complexity of a programming language.
    GAWK has a set of operators that allows you to program it to make decisions and
    calculations. You can also declare variables and use them in control structures
    to control how lines are to be processed. Many of the programming features are
    taken from the C programming language and share the same syntax. All of this makes
    for a very powerful programming tool. You can find out more about GAWK from your
    Linux Manual (enter the man gawk), and from the GNU''s Web site at www.gnu.org/software.gawk.


    # Perl


    Perl (Practical Extraction and Report Language) is a scripting language that was
    originally designed to operate on files to generate reports and handle very large
    files. You can think of Perl as the successor of GAWK and the Bash shell programming
    language. It includes many of the same capabilities but with greater power and
    flexibility. Perl was designed as a core program to which features could be easily
    added, and over the years, Perl''s capabilities have been greatly enhanced. You
    can now control network connections and process interactions, and it supports
    a variety of database management files. With Perl you can easily access files
    and manipulate strings, as well as manage arrays. At the same time, Perl remains
    completely portable—a Perl script will run on any Linux system. You can find out
    more about Perl at www.perl.com.'
