    # Export Variables and Script Shells


    If you execute another script within the script currently running, the current
    script suspends execution and control is transferred to the other script. All
    the commands in this other script are first executed continuing with the suspended
    script. The process of executing one script from another operates much like a
    function or procedure call in other programming languages. Think of a script calling
    another script. The calling script waits until the called script finishes execution
    before continuing with its next command.


    Any variable definitions that you place in a script will be defined within the
    script''s shell and known only within that script''s shell. Variable definitions
    are local to their own shells. In a sense, the variable is hidden within its shell.
    Suppose, however, you want to be able to define a variable within a script and
    use it in others it may call. You cannot do this directly, but you can export
    a variable definition from one shell to another using the export command. When
    the export command is applied to a variable, it will instruct the system to define
    a copy of that variable for each new subshell generated. Each new subshell will
    have its own copy of the exported variable. In the next example, the variable
    is defined and exported.


    ```

    $ myname="Charles"

    $ export myname

    ```'
