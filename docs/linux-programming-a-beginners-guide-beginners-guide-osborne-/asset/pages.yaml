    # Project 8-1: Display a Directory


    The following mydir program is a simple Tcl/Tk program that displays a list of
    file and directory names in a Tk list object with an attached scrollbar. Figure
    8-1 shows this list box. A list box object lets you display a list of items that
    can be easily scrolled and selected using the mouse. You can attach a scrollbar
    to accommodate items there be more items than fit in the designated list box size.


    # Step-by-Step


    +   1. Define the scroll bar with the scrollbar command: name it .scroll and bind
    it with the command .list yview. This instructs the scrollbar to be attached vertically
    to the list box on the y axis.


    +   2. Define the list box with the listbox command, name it .list, and provide
    a y axis scroll capability with the .scroll width. The list box will appear "sunken",
    with the specified width and height.


    ```

    scrollbar .scroll -command ".list yview"

    ```


    ```

    listbox .list -yscroll ".scroll set" -relief sunken -width 15 -setgrid

    ```


    +   3. Create the two objects (the scrollbar and the list box) with the pack command,
    and position them in the window. The scrollbar and list box are placed on the
    left side of the window and will expand to fill the window. Their anchor is on
    the west side of the window, as indicated by w in the code that follows. The list
    box, .list, is placed first, followed by the scrollbar, .scroll.


    ```

    pack .list .scroll -side left -fill both expand -yes -anchor w

    ```'
