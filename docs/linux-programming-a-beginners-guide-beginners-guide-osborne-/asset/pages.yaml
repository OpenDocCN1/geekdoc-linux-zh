  md: '# Module 9: GNOME 341


    There are also several specialized dialog boxes, such as message boxes, property
    dialog boxes, and file dialog boxes. A GnomeMessageBox dialog box works the same
    as a GnomeDialog dialog box. A message box is initially set up with a label and
    an icon determined by the message type. 9-10 lists the message box types.


    You create a message box using the gnome_message_box_new function. It takes as
    its first arguments the message text, then the type of message box, and then the
    buttons you want on the message box, with the last argument being NULL.


    With the GnomeProperty dialog box, you can create dialog boxes for different properties,
    options, or settings for an application. The notebook dialog box has tabs you
    can click to display different kinds of properties. You create a property dialog
    box with the gnome_property_box_new function. This sets up a notebook and four
    buttons: OK, Close, and Help. OK and Apply will call the function you set up to
    manage the responses selected by the user, also known as the apply handler. OK
    will further close the dialog box. Close will simply close the dialog box, and
    Help will call the help function you set up for this dialog box. You can add pages
    to your property dialog box using the gnome_property_box_append_page function.
    This takes as its arguments the page number and the label. Each time the user
    makes a change on one of the dialog box''s widgets, you use the gnome_property_box_changed
    function to mark the dialog box as changed. This enables the Apply and OK buttons
    to invoke the apply handler to enact the changes.


