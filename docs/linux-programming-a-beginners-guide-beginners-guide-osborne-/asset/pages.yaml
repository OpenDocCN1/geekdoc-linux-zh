  md: '# Linux Programming: A Beginner’s Guide


    This module will cover the basics of creating a shell program using the BASH shell,
    the shell used on most Linux systems. You will learn how to create your scripts,
    define shell variables, develop user interfaces, and master the more difficult
    task of combining control structures, to create complex programs. Tables in this
    module BASH shell commands and operators, while numerous examples show you how
    they are implemented.


    The BASH has a complete set of control structures, including loops and if statements
    as well as case structures. All the shell commands interact with redirection and
    piping operations that allow them to accept input from the standard input or to
    send to the standard output.


    You can control the execution of Linux commands in a shell program with control
    structures. Control structures allow you to repeat commands and select certain
    commands over others. A control structure consists of two major components: a
    test and commands. If the test is successful, the commands are executed. In this
    way, you can use control structures to make decisions about whether commands should
    be executed.


    Two types of control structures are used in shell programs: loops and conditions.
    A loop repeats commands, while a condition executes a command when certain conditions
    are met. The BASH shell has three loop control structures—while, for, and for-in—and
    two condition structures—if and case.


    The while and if control structures are used for general purposes, such as performing
    iterations and making decisions using a variety of different tests.


    The case and for control structures are more specialized. The case structure is
    a restricted form of the if and is often used to implement menus. The for structure
    is a limited type of loop. It runs through a list of values, assigning a new value
    to a variable with each iteration.


    The if and while control structures test the execution of a Linux command. All
    Linux commands return an exit status after they have finished executing. If a
    command is successful, its exit status will be 0. If the command fails for any
    reason, its exit status will be a positive value referencing the type of failure
    that occurred. The if and while control structures check to see whether the exit
    status of a Linux command is 0 or some other value. In the case of the if and
    while structures, if the exit status is a 0 value, the command was successful
    and the structure continues.'
  merge: -1
  pgno: 81
