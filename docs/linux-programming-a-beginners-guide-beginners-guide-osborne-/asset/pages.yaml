    With the GNOME dialog functions, you can easily create both modal and nonmodal
    dialog boxes. Those tend to be more user friendly, modal dialog boxes are easier
    to program. To create a dialog box, you need to define a GDialog This function
    takes its arguments the title of the dialog box and any buttons you want displayed
    on it. To use stock buttons, you can use any of the GNOME_STOCK_BUTTON definitions
    as shown.


    ```

    Gtkwidget *get_mydialog:

    mydialog = gtk_dialog_new("My Dialog", GNOME_STOCK_BUTTON_OK, GNOME_STOCK_BUTTON_APPLY,
    GNOME_STOCK_BUTTON_CLOSE, NULL);

    ```


    For a simple dialog box, use the gnome_dialog_run_and_close function to execute
    the dialog box. A modal dialog box waits for a user to click a button or the window''s
    Close box. It will return the number of the button selected (or -1 for a Close
    box).

    If you have a dialog box where the user needs to click several buttons, you can
    use the gnome_dialog_run function. This function does not automatically close
    the dialog box at the first click. Instead, it returns the number of the button
    click and remains displayed. You can use the returned value to execute any operations
    you have associated with that button, and then call gnome_dialog_run to get the
    next button click.'
