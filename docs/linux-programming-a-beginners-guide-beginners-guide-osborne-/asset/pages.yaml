  md: '# Status and Toolbars


    The KDE status bar widget is KStatusBar. To create a status bar, you create a
    KStatusBar object and assign its to a pointer you want to use to reference the
    object. KStatusBar takes as its argument the address of its parent. In the following
    example, the parent is the class it is being defined in, which is referenced by
    the special pointer (commonly used for subwidgets);


    ```

    statusBar= new KStatusBar(this);

    ```


    To set the text you want initially displayed on the status bar, you use the KStatusBar
    class''s insertItem method. This takes as its first argument the text you want
    displayed and as a second argument an identifier. To change the status bar message,
    you use the changeItem function.


    ```

    statusBar->setItem("My hello program", 0);

    statusBar->changeItem("My New Hello Program", 0);

    ```


    To attach the status bar to the window object, you use the KMainWindow class''s
    setStatusBar function. This takes the address of the status bar and an identifier
    as its arguments.


    ```

    setStatusBar(statusBar, 0);

    ```


    Then, to have the status bar displayed, you use the show function.


    ```

    statusBar->show();

    ```


    To create a toolbar, you define a KToolBar object, assigning its address to a
    pointer you want to use reference the object. In this example, the user creates
    a toolbar object and assigns its address to mytoolbar:


    ```

    mytoolbar = new KToolBar(this);

    ```'
