  md: "unless(open REPS, \"+\\$fileen\") {\n die \"Can't open $fileen\";\n}\n\n# switch\n\
    \nThere is no switch structure in Perl, although it can be simulated. In a classic\
    \ switch structure, a choice is made by comparing a value with several possible\
    \ patterns, and each possible value is associated with a set of operations. If\
    \ a match is found, the associated operations are performed.\n\nYou can simulate\
    \ a switch in Perl using a block and a last command. Blocks are valid constructs\
    \ in their own right. You can list a block by itself, and its statements will\
    \ be executed consecutively. The statements within a block are considered to be\
    \ a group. The last command exits a block or skips a block if there is one. the\
    \ last is like the C break statement. When used in a statement within a block,\
    \ the last command will immediately exit the block.\n\nIn the next example, the\
    \ final statement is never executed because the last command forces an exit from\
    \ the block.\n\n```\n{\nprint \"The first statement\\n\";\nprint \"the second\
    \ statement\\n\";\nlast;\nprint \"The third statement\\n\";\n}\n```\n\nThere are\
    \ several ways to construct the statements in a block to simulate a switch control\
    \ structure. The easiest is to have a series of structures followed by a block\
    \ of statements ending with a last statement. The block would be given a label\
    \ that the last statement would reference, thereby exiting the labeled block.\
    \ The final statement in the block would be a default operation, executed if all\
    \ the tests fail. The syntax for this structure would look like the following:\n\
    \n```\nLABEL:{\n(expr){statements;last LABEL;\n}\n```"
