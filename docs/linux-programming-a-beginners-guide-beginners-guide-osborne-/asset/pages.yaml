  md: '# Linux Programming: A Beginner''s Guide


    KDE (K Desktop Environment) is organized on a C++ object model with C++ objects
    containing functions with which you can modify the object. Many of the functions
    are inherited from higher level KDE classes, while others are defined for a particular
    type of object. In a KDE program, you define an object and then use its public
    and private functions to modify it. For example, you can create a menu object
    and then use the menu object''s functions to add new menu items to it. KDE uses
    the Qt toolkit, by Troll Tech (www.troll.com). This toolkit is actually used to
    display and manage GUI objects as buttons and windows. The Qt toolkit operates
    like the GTK+ in GNOME.


    Because KDE applications are C++ object-oriented programs, they use a set of hierarchical
    object classes in the KDE and Qt libraries. Classes lower in the hierarchy will
    inherit members (functions) from predefined KDE classes higher in the hierarchy,
    and you can create your own classes and have them inherit members. KDE uses the
    Qt Toolkit and completely relies on it Unlike GNOME, by any toolkit, KDE relies
    solely on the Qt Toolkit. Currently, KDE programming is essentially Qt programming.


    KDE and Qt programming rely on an extensive set of classes, each of which usually
    has a significant number of member functions that manage objects of that class.
    There are far more than can be listed within the size limitations of this book.
    For a complete list of the KDE user interface classes, consult the documentation
    provided on the KDE developer''s site,.kde.org. This site includes detailed tutorials
    and reference materials for the KDE API as well as KOM (KDE Object Manager) and
    Qt reference material. Each class is described in detail, and class declarations,
    including their member function declarations and definitions, are given. In addition,
    consult the KDE and Qt header files. The .h files contain a complete listing of
    the KDE and Qt classes, along with detailed comments describing their member functions.


    A widget, like a window or a button, is just an object. You can define a window
    object using a KDE or Qt window class or a button using a KDE or Qt button class.
    There are several kinds of classes that you can use, depending on the type of
    window or button you want. To create a complex widget, such as a window that contains
    other widgets (perhaps toolbars and menus), you would define the subwidgets as
    children of the'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# Module 10: KDE


    main widget. When you define a toolbar, you specify a particular window object
    as its parent. A subwidget can, in turn, have its own subwidgets-its own children.
    For example, a menu bar can have a window as its parent and individual menus as
    its children.


    When you declare a C++ object, you usually include arguments in addition to the
    class and object name. These arguments are passed to a special function called
    a constructor that is executed when the object is defined, which performs any
    needed setup or initialization operations for the object.


    For widgets, one of these arguments is usually the address of its parent widget.
    For example, a toolbar will be defined with one of its arguments being the address
    of a window object that is its parent. If the widget is a top-level object with
    no parent, the argument is NULL. With a series of simple object definitions, you
    can create a complex widget.


    # KDE Libraries


