  md: '# 230 Linux Programming: A Beginner’s Guide


    Tcl is a general-purpose command language developed by John Ousterhout in 1987
    at the University of California, Berkeley. Originally designed to customize applications,
    it has become a fully functional language in its own right. With Perl and GAWK,
    you can write Tcl scripts to develop your own programs. Tcl is a very simple language
    to use.


    Tk and Expect are Tcl applications that extend the capabilities of the language.
    The Tk application allows easy development of graphical interactive applications.
    You can create your own windows and dialog boxes with buttons and text boxes of
    your choosing. The Expect application provides easy communication with interactive
    programs such as ftp and telnet.


    Tk is often used in conjunction with Tcl to create graphical applications. Tcl
    is used to create the graphical elements such as windows, and Tcl performs the
    programming actions as managing user input. Like Java, Tcl and Tk are cross-platform
    applications. A Tcl/Tk program will run on any platform that has the Tcl/Tk interpreter
    installed. Currently, Tcl/Tk versions for Windows, Macintosh, and UNIX systems,
    including Linux, are available. You can write a Tcl application on Linux and run
    the same code on Windows or a Mac. The new versions of Tcl and Tk 8.0 even support
    local look and feel for graphical user interface (GUI) widgets using Mac-like
    windows on the Mac and Windows-like windows on Windows.


    # Note


    The Tcl and Tk languages are organized according to different types of graphical
    objects such as windows, buttons, menus, and scroll bars. Such objects are referred
    to as widgets. For even more about widgets, see Module 8.


    Tcl is an interpreted language that operates, like Perl, within its own shell.
    The command for invoking Tcl is tcl. Within this shell, you can execute Tcl commands.
    You can also create files which you can invoke the Tcl shell and list Tcl commands
    (list commands are explained in the section “Lists,” later in this module), effectively
    creating a Tcl program. A significant advantage to the Tcl language and its applications
    is the fact that it is fully compatible with the C programming language, and Tcl
    libraries can be incorporated directly into C programs. In effect, this allows
    you to create very fast compiled versions of Tcl programs.


    When you install Tk and Tcl on your system, man pages for Tcl/Tk commands are
    also installed. The man pages are the pages displayed by the Linux online manual,
    which is accessed with the man command. Use the


