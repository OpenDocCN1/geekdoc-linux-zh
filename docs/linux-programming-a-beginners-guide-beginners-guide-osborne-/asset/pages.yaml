  md: '# Perl Scripts


    Usually Perl commands are placed in a file that is then read and executed by the
    perl command. In effect, you are creating a shell in which your Perl commands
    are executed. Files containing Perl commands must have the extension .pl. This
    identifies the file as a Perl script that can be read by the perl command. There
    are two ways that you can use the perl command to read Perl scripts.


    The first option is to enter the perl command on the shell command line, followed
    by the name of the Perl script, Perl will read and execute the commands. The following
    example executes a Perl script called hello.pl.


    ```

    $ perl hello.pl

    ```


    The second way is to include the invocation of the perl command within the Perl
    script file, much as you would for a shell script. /usr/bin/perl should be the
    location of the perl command on your system. If you place the following shell
    instruction on the first line of your file, it automatically invokes the Perl
    shell and will execute the following Perl commands in the script.


    ```

    #!/usr/bin/perl

    ```


    To make the script executable, you would have to set its permissions to be executable.
    the chmod command with the 755 option sets executable permissions for a file,
    turning it into a program that can run on the command line. You only have to do
    this once per script, and you do not have to do this if you are using the perl
    command on the command line, as noted previously.


    The following example sets the executable permissions for the hello.pl script.


    ```

    $ chmod 755 hello.pl

    ```


    Perl has many similarities to the C programming language and to GAWK. Like C,
    Perl commands end with a semicolon. As in GAWK,'
