  md: '# KDE Applications and Widgets


    To create a KDE application, you simply create an object of type KApplication
    in your program before you define any other KDE objects. The class declaration
    for KApplication is contained in the kapp.h file. The definition of a K object
    takes as its arguments argc and argv. These operate as they do in C programs,
    referencing any command line arguments the user enters. The following example
    defines an object called myapp:


    ```

    KApplication myapp( argc, argv);

    ```


    Declarations for different kinds of KDE and Qt objects are located in separate
    header files. Whenever you define an object of a particular type, be sure to include
    the header file that has its class declaration. For example, to create a main
    window, you use KMainWindow class, and you need to include the kmainwindow.h header
    file.


    ```

    #include <kmainwindow.h>

    ```


    The header files are also extremely helpful as a reference source. They list all
    the member functions for a particular class and include detailed comments describing
    each function and its use. The header files will be located in the KDE include
    directory, /usr/include. Currently for Red Hat, this is the standard include directory,
    and on Linux and other distributions, it may be the special KDE directory, such
    as /opt/kde/include.


    To define a main window for your application, use the KMainWindow class. The following
    example defines a main window object called mywin.


    ```

    KMainWindow mywin;

    ```


    If you create an application in which the main window is the primary interface,
    and you want the application to close when that window closes, you have to make
    the main widget for the application. To do this, use the application object''s
    setMainWidget function. The main widget could be any widget you want. Be sure
    to pass the address of the widget. You do this by preceding it with the address
    operator, the ampersand (&).'
