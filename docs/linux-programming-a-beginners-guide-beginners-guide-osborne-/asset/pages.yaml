  md: '# Control Structure Syntax Description


    ( actions )


    A block is formed by opening and closing braces; and it is used to group actions,
    making them subject to a control structure—such as a loop—or enclosing the actions
    in the GAWK instruction proper.

    The if control structure executes an action if its expression is true. If false,
    the else action is executed.


    if(expression)

    action

    else


    while(expression)

    action

    for(exp1; exp2; exp3)

    action


    The while control structure executes an action as long as its expression is true.

    The for control structure executes an action as long as exp2 is true. The first
    expression, exp1, is executed before the loop begins. The third expression, exp3,
    is executed within the loop after the action.

    The for-in control structure is designed for use with associative arrays. The
    variable operand is consecutively assigned the strings that index the array.

    The next stops operations on the current record and skips to the next record.

    The exit statement ends all processing and executes the END command if there is
    one.


    for(variable in arrayname)

    action

    ext


    exit


