  md: '# Scheduling Jobs to Run at Appropriate Times


    ```

    | Hour (0-23)

    Minute (0-59)

    ```


    The example instructs cron to run the program /usr/adm/cleanup at 8:00 p.m. every
    Monday through Friday of every month. Each of the first five fields may contain:


    +   * A number (within the specified range as shown above)

    * Two numbers separated by a dash to indicate inclusive range

    * A list of lists, separated by commas, that selects all numbers in the list

    * An asterisk, which indicates all legal values


    This example shows a sample crontab file.


    # Example 10-19: A Typical Crontab File


    ```

    # (@) crontab

    #

    #

    0 5 1 * * /usr/adm/billing

    0 20 * * 1-5 /usr/adm/cleanup

    ```


    # Now Try This!


    Use crontab to schedule a job for execution.


    +   a. Create a crontab file that will capture the output from the date command
    into a file crontab.txt. Have the command execute three times within the next
    hour.

    b. Submit the file with the crontab command.

    c. Check to see if the job executes correctly, then remove your crontab file.


    # Solution


    ```

    $ date

    Sat Jan 3 10:36:47 EST 1998

    $ cat micron

    40,45,50 10 * * date >> crontab.txt

    $ crontab micron

    $ crontab -1

    ```'
