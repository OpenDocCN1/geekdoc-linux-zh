    # About Symbolic (Soft) Links


    A symbolic or soft link provides a path to a file.


    This format of the ln command is:


    ```

    ln -s source_file target_file

    ```


    Symbolic links can be made:


    +   - Across file systems

    - To a directory


    The original file and soft link have different inode numbers.


    Creation of a symbolic link has no effect on the link count. Delete the original
    file and the soft link still exists, but the original file is gone.


    In the following example, a symbolic link is made to /usr/users/smif/mortgage.
    Directory listings for the link and linked files are shown.


