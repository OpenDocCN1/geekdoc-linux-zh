- img_proc: true
  md: '# Controlling File Access


    # Overview


    File permissions allow you to restrict access to files or folders. Three groups
    of users can access files and folders: user (owner), group, and other. File access
    is divided into three types of permissions: read, write, and execute.


    # Types of Access


    When you try to manipulate a file, the operating system tries to determine what
    type of permissions of the file has. There are three categories of file permissions:


    +   * User

    If you are the owner of the file (your user ID matches the user ID of the file),
    the system checks the owner''s rights.

    * Group

    If you are in the owner''s group (your group ID matches the group ID of the file),
    the system checks permissions that the owner grants to the group.

    * Other

    If neither your user ID nor group ID matches those of the file, the operating
    system checks the other permissions to see if other users are allowed to access
    the file.


    The superuser can access other users'' files without regard to permissions.


    # Types of Access Permissions


    The access permissions on a file specify how that file can be accessed by the
    owner, group members, and other users.


    +   * Read

    Allows access to retrieve, copy or view the contents of the object.

    * Write

    Allows access to change the contents of the object or remove the object.

    * Execute

    For a file, allows access to run the file. This includes executable files, scripts,
    and actions. For a folder or directory, allows access to run commands, scripts
    and actions within that folder.'
  merge: -1
  pgno: 128
