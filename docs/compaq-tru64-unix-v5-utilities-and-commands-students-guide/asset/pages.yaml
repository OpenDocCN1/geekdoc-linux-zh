  md: '# Correcting Mistakes


    # Transposing Characters and Words


    One of the most common typing mistakes is transposing characters. `emacs` provides
    commands to transpose characters, words, sentences, or paragraphs, shown here.


    | Command | Function |

    | :--- | :--- |

    | Ctrl/T | Transposes two characters, the character cursor is on and the previous
    |

    | Esc T | Transposes two words, the two words cursor is between |

    | Ctrl/X Ctrl/T | Transposes two lines, the line cursor is on and the previous
    |

    | Esc X transpose-sentences | Transposes two sentences, the sentence cursor is
    on and the next |

    | Esc X transpose-paragraphs | Transposes two paragraphs, the paragraph cursor
    is on and the next |


    Which characters, words, and lines are transposed upon cursor position.


    # Capitalization


    Another mistake often make is in capitalization. `emacs` provides special commands
    for fixing capitalization problems.


    +   - Esc C Capitalize the first letter of the word

    - Esc U Uppercase the word

    - Esc L Lowercase the word


    When capitalizing a word, if the cursor is not on the first letter, the letter
    under the cursor will be capitalized. If the cursor is moved to the first letter,
    Esc C will capitalize the first letter and change any other capitalized characters
    in the word to lowercase.


    # Using the mouse with emacs


    If you are using a workstation, you can move the cursor, cut and paste, and manipulate
    `emacs` windows with the mouse. The following table provides direction for using
    the mouse with emacs.


    # Table 18-17:Using the mouse with emacs


    | Mouse Click | Equivalent emacs Command |

    | :--- | :--- |

    | MB1 | Moves cursor to location mouse points to |

    | MB2 or Shift/MB3 | Yank, Ctrl/Y |'
