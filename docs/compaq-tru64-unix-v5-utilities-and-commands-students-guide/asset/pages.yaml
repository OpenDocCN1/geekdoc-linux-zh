  md: '# Summary


    # Setting Up Your Default Printer


    You can determine available printers by displaying the contents of the /etc/printcap
    file.


    Use the PR environment variable to establish your default printer.


    # Printing Files


    You can use the lpr or lpr commands to print files. The lpr command provides more
    printing options including:


    +   - One or two-sided printing

    - Landscape or portrait orientation

    - Multiple pages on a side of paper

    - International support


    # Managing Print Requests


    You can obtain printer status information with the lpq and lpstat commands.

    You delete print jobs using the lprm or cancel command.


    Use the printer control program, lpc to restart printer daemons and display printer
    status information.


    # Deleting Print Requests


    To delete a print job, you can use the lprm or cancel commands.'
