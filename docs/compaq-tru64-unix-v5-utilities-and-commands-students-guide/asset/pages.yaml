- img_proc: true
  md: '# Using Filters


    # Overview


    A filter is a command that reads standard input, processes the input, and prints
    the result to standard output.


    # Using the wc Filter


    The wc (word count) filter is often used by programmers who want to see how much
    code they have written, or by writers who want to see how much text they have
    written. The wc filter is given


    +   - Performs a word count on its input file(s), or on standard input if no file
    name is given


    +   - Provides a count of the number of lines and the number of characters in
    the file(s)


    The output, reading from left to right, displays the number of lines, words, and
    characters in the input. If a file is specified, the file name is displayed at
    the extreme right.


    The following example shows the output generated when wc is applied to the newfile
    file.


    Example 9-2: Using the wc Command


    ```

    $ wc newfile

    10 27 139 newfile$

    ```


    # wc Command Options


    The wc command has three options, each which allows you to list one of the counts
    normally provided in the output. The options are shown in the table.


    Table 9-1: wc Command Options


    | Option | Function |

    | -l | Prints only the number of lines in a file |

    | -w | Prints only the number of words in a file |

    | -c | Prints only the number of characters in a file |


    If you run the wc command on standard input (without specifying a file name),
    you must press Ctrl/D to display the output of the command.


    # Now Try This!


    Determine the number of lines, words, and characters in the /etc/passwd file.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Using Filters


    # Solution


    The wc command allows you to determine the number of lines, words, and characters
    in an entry you make at the keyboard, or in an existing file. To determine the
    number of characters, words, and lines in the /etc/password file, enter the following
    command:


    ```

    $ wc /etc/passwd

    26 79 1681 /etc/passwd

    ```


    This passwd file contains 26 lines, 79 words, and 1681 characters.'
