  md: "# # Scheduling Jobs to Run at Appropriate Times\n\n# ## Overview\n\nTo schedule\
    \ jobs to run at appropriate times, you need commands that will schedule jobs\
    \ to run\n\n+   - Once at some time in the future\n- Periodically at some time\
    \ in the future\n\n# ## Scheduling Jobs to Run Once\n\nThere are two methods for\
    \ executing commands just once at some time in the future. The commands are:\n\
    \n+   - The at executes commands once at a specified time\n- The batch command:\n\
    \    - Executes commands once when the system load permits\n    - Input commands\
    \ from standard input\n\nThe at has the following formats:\n\n```\nat [-cksm]\
    \ time [date] [+increment] [command | file] ...\nat -l [user]\nat -n [user]\n\
    at [-fi] -r job_number \\dots [-u user] [command | file] ...\n```\n\nThe batch\
    \ command has the format:\n\n```\nbatch\ncommand\n<Ctrl/D>\n```\n\n# ## Command\
    \ Options\n\nThis table shows at command options.\n\n| Table 10-6: Command Options\
    \ |\n| Option | Function |\n| c | Executes job in the C shell |\n| k | Executes\
    \ job in the Korn shell |\n| s | Executes job in the Bourne shell |\n| m | Mails\
    \ a message on successful command execution |\n| l | Reports your scheduled jobs\
    \ |"
