  md: '# # Copying, Moving, and Saving Text


    # ## Overview


    This lesson discusses how to use buffers with the *yank* and *delete* and put
    commands to copy or move text. It also covers commands to save text by writing
    the buffer to a file.


    # ## Copying and Moving Text


    When you delete or copy text in the vi editor, it is put in a temporary buffer.
    You can then move to another location and put the text back in.


    For example, to move the current line down two lines, first delete it with the
    *dd* command. Move down one line with the *j* command and paste the line below
    the cursor with the *p* command.


    | | |

    |---|---|

    | delete (d) | Cuts text to the buffer; delete word (dw), delete line (dd) |

    | yank (y) | Copies text to the buffer: yank word (yy), yank line (yy)

    You can prefer the command with a number; 5yy copies 5 lines. |

    | put (p) | Pastes text from the buffer **after** the cursor |

    | put (P) | Pastes text from the buffer **before** the cursor |


    # ## Now Try This!


    +   1. Edit `myfile.txt` file and use the *yy* command to copy the first line.

    2. Move down to line 5 and use the *p* command to paste the line.

