  md: '# Obtaining Process Status


    # Overview


    To determine a job''s process status:


    +   - Use the ps command to obtain the status of all your processes.

    - Use the jobs command to obtain the status of a stopped or background job.


    # Using the ps Command


    Use the ps (process status) command to obtain more information about your processes,
    or other processes on the system. The ps command displays information on your
    login process as well as any active child processes.


    The format for the ps command is:


    ```

    ps [-option]

    ```


    The ps command has many options which provide customized output. For options,
    see ps(1).


    # Now Try This!


    +   1. Enter the ps command without options.

    What is the process identification number (PID) of your shell process?

    2. Enter the command:


    ```

    $ ps -1

    ```


    What additional process information is available with this form of the process
    command?


    # Solution


    +   1. In this example, the process ID of the shell process is 13938.

    2. Additional information includes the parent process ID (PPID), the user ID (UID),
    and priority of the job (PRI).


    $ ps

    PID TTY S TIME CMD

    13938 pts/4 S + 0:00.23 -ksh (ksh)


    ```

    $ ps -l

    F S UID PID PPID PRI NI ADDR SZ WCHAN TTY TIME CMD

    80808001 S + 205 13938 13869 0.0 44 0 200K wait pts/4 0:00.24 sh

    $ $

    ```'
