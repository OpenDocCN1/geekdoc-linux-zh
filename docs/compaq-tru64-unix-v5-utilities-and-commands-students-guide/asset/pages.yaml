    to open it | None |

    | Desktop Introduction | Displays "Introducing the Desktop" | None | None |

    | Front Panel | Displays the Front panel volume | None | None |


    # Changing Workspaces


    A workspace is the screen display area. Using workspaces, you can set multiple
    work areas. For example, one workspace can be used for managing mail, another
    for project management, and so on.


    You can click a workspace button to change to another workspace. Each workspace
    has a pop-up menu that allows you to add, delete, or rename a workspace and to
    get workspace help.


    The default number of workspaces is four. Your system administrator sets the default
    on a systemwide basis. You can add more workspaces as you need them.'
