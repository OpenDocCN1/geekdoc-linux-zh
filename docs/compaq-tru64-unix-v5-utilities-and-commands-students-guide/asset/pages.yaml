  md: '# # Linking Files


    # ## Overview


    Links provide a mechanism for sharing files.


    +   - A link allows more than one user to access the same data.

    - A link is a directory entry referring to a file.

    - A file may have multiple links to it.


    # ## About Inodes


    An *inode* is a file system data structure that contains information about a file
    such as the:


    +   - Type and access mode of a file

    - File''s owner

    - Group access identifier

    - Number of links to a file

    - Size of the file in bytes

    - Number of physical blocks used by the file

    - Time the file was created, accessed, or modified

    - Pointers to the data blocks on the disk


    You can display the inode number with the `ls -i` command.


    # ## Using the ln Command


    The two types of links, hard and symbolic (soft link), are generated using the
    `ln` command. By default `ln` makes hard links.


    The format of the `ln` command is:


    ```

    ln [-fns] source_file target_file

    ```


    The *source_file* is the existing file name. The *target_file* is the link file
    name. Commonly used link options:


    +   -f Forces removing of existing target pathnames before linking

    -n Does not overwrite the contents of the target file if the target file already
    exists; the -f overrides this option

    -s Creates a symbolic link'
  merge: -1
  pgno: 197
- img_proc: true
  md: '# About Hard Links


    When a hard link is established, it is indistinguishable from the original file.
    If the original file is deleted, the link file still exists, and contains the
    exact data.


    Hard links:


    +   - Cannot refer to directories


    +   - Cannot span file systems (must be on the same file system as the original
    file)


    +   - Save disk space because only one copy of the data exists


    +   - Share inodes


    # Generating Hard Links


    The following example shows how to generate a hard link to Smif''s mortgage program.
    The results of ls -il commands for both the source and target files are also shown.


    # Example 6-9: Creating a Hard Link


    ```

    $ pw

    $ /usr/users/you

    $ ln /usr/users/smif/mortgage mortgage-hlink

    $

    $ ls -il mortgage-hlink

    17028 -rwxr-xr-x 2 smif users 39772 Apr 06 10:40 mortgage-hlink

    $

    $ ls -il /usr/users/smif/mortgage

    17028 -rwxr-xr-x 2 smif users 39772 Apr 06 10:40 mortgage

    ```


    # Relationship Between Hard Link and File


    The following figure shows the relationship between a hard link and the file to
    which it is linked.'
