  md: 'Suppose you need to take medication every hour during a work day. You could
    create the file medicine.ksh to include the following:


    ```

    print "It is time to take your medicine!"

    sleep 3600; print "It is time to take your medicine!"

    sleep 3600; print "It is time to take your medicine!"

    sleep 3600; print "It is time to take your medicine!"

    sleep 3600; print "It is time to take your medicine! Only one more to go!"

    sleep 3600; print "It is time to take your medicine! Last time today!"

    ```


    The shell script could be executed in the background as:


    ```

    $ medicine.ksh &\n$

    ```


    # Making a Process Wait


    Background processing is a convenient way to execute long jobs when user interaction
    is unnecessary. However, you may have to wait for a background job to finish before
    you can complete other tasks. The wait utility waits until all process IDs known
    to the invoking have terminated.


    The format of the wait command is:


    ```

    wait [job_name]

    ```


    Suppose you use the ls command using the -R flag to list all the files in each
    subdirectory starting at the root directory.


    Assume that you need to use the list of directories in the script you are writing.
    The wait command to wait until the background job completes.


    This example demonstrates the use of the wait command in an interactive situation.


    # Example 10-12: Waiting for Completion of a Background Job


    ```

    $ ls -lar /usr | grep d > dir-list &\n[1] 586

    $ wait 586; print "The directory list is complete"\nThe directory list is complete\n$

    ```


    The wait is a Korn built-in command. Since all background jobs are children of
    the shell, the login shell must wait for the child processes.'
