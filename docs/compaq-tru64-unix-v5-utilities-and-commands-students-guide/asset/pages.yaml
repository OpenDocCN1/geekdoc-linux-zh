- img_proc: true
  md: "# Copying Files\n\nOne way to copy files between a local and a remote or two\
    \ remote systems is to use the rcp command. As with the rlogin command, the name\
    \ of the local system must be in the /etc/hosts.equiv file on the remote system,\
    \ or the system name and user must be in the $HOME/.hosts file in the remote account.\n\
    \nTwo formats of the rcp command are:\n\n```\nrcp [-p] file1 file2\nrcp [-r] file...\
    \ directory\n```\n\nWhen specifying a file on a remote system, use the remote\
    \ system name followed by a colon (:) as a prefix to the file, such as sys001:/etc/shells.\n\
    \nTo copy files from a particular user account, the user name followed by an at\
    \ sign (@) should be used as a prefix to the remote system name, such as you@sys001:.profile.\n\
    \nThe path file will start from that user's home directory.\n\nThis table shows\
    \ some options you can use with the rcp command.\n\n# Table 12-3: rcp Options\n\
    \n| Option | Function |\n| p | Preserves the modification times and modes of the\
    \ source files in its copies, ignoring the umask |\n| r | Copies files in all\
    \ subdirectories recursively if the file to be copied is a directory; the destination\
    \ must be a directory |\n\nThis example shows how to enter the rcp command to\
    \ copy files from a remote system.\n\n# Example 12-3: Using the rcp Command\n\n\
    ```\n$ rcp sys001:/user/users/smith/file.txt file.txt\n\n$ rcp smith@sys001:/user/users/smith/file.txt\
    \ file.txt\n\n$ rcp -r smith@sys001:/user/users/smith/smith@sys002:production\n\
    ```\n\n# Now Try This!\n\n+   1. Enter the rcp command to copy the following file\
    \ from your remote system to your user directory on your local system.\n   /usr/include/stdio.h\n\
    \n+   2. Enter the rcp command again but preserve the modification times and modes\
    \ of the source file."
