    \nThere are many options to the ls command. Here are just a few.\n\n+   -a Lists\
    \ all files in directory including those that begin with a period; file names\
    \ with a period are usually hidden\n-F Flags certain types of files with special\
    \ symbols\n-l Provides a long listing of the files in a directory, including file\
    \ type, access rights, owner, group, size, and date of creation or modification\n\
    -R Recursively lists all subdirectories\n\nYou must have execute permission on\
    \ the directory to get a long listing, while only read permission is required\
    \ for an ordinary listing.\n\nYou can combine these options. Using the -1 and\
    \ -a opitons together produces a long listing of all files, including hidden files."
