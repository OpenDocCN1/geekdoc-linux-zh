    ```


    ```

    sys001 whoami

    joe

    sys001 exit

    $ login sys002 -l smith

    Password:

    Last Login: Mon Mar 30 01:00:59 from sys999

    Tru64 UNIX X5.0-14(Rev. 490);Mon Mar 30 03:09:17EST 1998

    ```


    ```

    sys002 whoami

    smith

    sys002$ <Ctrl/D>

    $

    ```


    # Try This!


    To perform the exercises in this unit, your system must be connected to a network
    of UNIX systems using TCP/IP. You must obtain a system name from your instructor/system
    administrator for a remote system that you can log in and have a user account
    on that system.


    +   1. Using the login command, log in to your remote system.

    2. Enter the hostname and whoami commands.

    3. Log out.


    # Need Help?


    If you receive a password prompt, the local system does not have an entry in the
    remote host.equiv or .rhosts file. Create a .rhosts file in your remote home directory
    listing your local system.


    # Solution


    ```

    $ login sys002

    Password:

    Last Login: Mon Mar 30 01:00:59 from you@sys001

    Tru64 UNIX X5.0-14(Rev. 490);Mon Mar 30 03:09:17EST 1998

    sys002$ hostname

    sys002

    sys002$ whoami

    you

    sys002$ <Ctrl/D>

    $

    ```'
