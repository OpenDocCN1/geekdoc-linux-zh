  md: '# Summary


    # Introducing the Tru64 UNIX Operating System


    The Tru64 UNIX operating system is a multiuser, interactive, general-purpose operating
    system. It allows you to run more than one program at a time while performing
    other tasks simultaneously.


    Tru64 UNIX is an open system based on the OSF operating system called OSF/1. It
    has the "look and feel" of UNIX.


    # Describing the User Interface


    The Tru64 UNIX operating system provides two methods for users to interact with
    the operating system:


    +   * Graphical user interface (GUI)

    * For workstation users or intelligent terminals with bit-mapped displays

    * Command line interface (CLI)

    * For character terminal users or a terminal emulator


    # Logging In and Out of the System


    Your system administrator must provide you with username and password information
    before you can log in to the UNIX operating system.


    Enter information in response to system requests or prompts. The prompts for logging
    in and system response differ depending upon the type of terminal being used.


    UNIX is sensitive to uppercase and lowercase letters and treats them as different
    characters. Two types of commands are used in this course.


    | Enter | Type the command and press Return |

    | Type | Type the characters and do not press Return |


    +   * The Tru64 UNIX command line is indicated by a customizable symbol such as
    $$.

    * Use the exit command to log out of the system.

    * Use the passwd command to change your password. Keep your password confidential.

    * The man command displays information about commands.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Summary


    # Choosing Passwords


    When choosing passwords, do **not**:


    +   * Choose words found in the dictionary

    * Use personal information

    * Use your default (original) password

    * Choose a password that is easy to guess, or hard to remember

    * Write down your password


    # Listing Tru64 UNIX Documentation


    Compaq supplies a complete set of manuals with each kit of the Tru64 UNIX operating
    system. This documentation is available in an online documentation set and in
    hardcopy in the Software Documentation Kit. Tru64 UNIX commands are also documented
    on line in the reference pages.'
  merge: -1
