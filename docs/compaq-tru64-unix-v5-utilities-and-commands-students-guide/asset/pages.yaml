  md: '# Summary


    # Redirecting Input and Output


    With the Korn shell, you can redirect standard input and output as follows:


    +   > Redirects standard output to a specified file

    >> Redirects standard output by appending output to a file

    < Redirects standard input


    # Using Filters


    The wc filter:


    +   * Performs a word count on its input file(s), or on standard input if no file
    name is given

    * Gives a count of the number of lines and the number of characters in the file)


    # Sorting


    The sort command alphabetizes its input according to the first letter in each
    field, and prints the sorted list to standard output.


    The sort command allows you to designate different sequences for the sort command
    to follow when it examines and reformats the input.


    # Searching


    The grep command searches its input for a pattern of characters, and outputs any
    line containing that pattern. The grep utility has the ability to look for patterns
    that are not fixed, called regular expressions.


    You can use grep to look for lines that do not contain a specific pattern, or
    to match arbitrary characters.


    # Using Pipelines


    Pipelines allow you to use the output of one command as input to another. You
    can use the vertical bar (|) symbol to pipe output from one program or command
    into another.


    # Using the awk Utility


    The awk utility processes ASCII text files and generates reports involving selective
    retrieval and string manipulation. It is used primarily to generate tables and
    reports from files of raw data.'
