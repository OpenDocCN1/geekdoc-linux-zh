  md: '# Listing Files


    # Overview


    The system keeps track of the names of all your files. You can see a list of the
    names of all files in a directory using the `ls` command.


    The format of the `ls` command is:


    ```

    ls options pathname

    ```


    # Using the ls Command


    Here are some examples of the `ls` command assuming the working directory is /usr/users/you.


    To display a list of files in the working directory:


    ```

    $ ls

    ```


    To display a list of files in the /usr/users/you/book using a full pathname:


    ```

    $ ls /usr/users/you/book

    ```


    To display a list of files in the directory /usr/users/you/book using a relative
    pathname:


    ```

    $ ls book

    ```


    To display a list of files in the working directory using the special symbol .
    (dot):


    ```

    $ ls .

    ```


    To display a list of files in the parent directory using the special symbol ..
    (dot dot):


    ```

    $ ls ..

    ```


    To display the files in more than one directory, separate each directory name
    with a space:


    ```

    $ ls book project

    book:

    chap chap2 contents.lis

    project:

    plan report.txt

    ```


    # Now Try This!


    +   1. List the files in your home directory using the ls command.


    +   2. List all files in both your home directory and its parent directory using
    the special pointer files . (dot) and .. (dot dot).'
