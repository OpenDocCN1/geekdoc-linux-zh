  md: '# Using Terminal


    # Customizing Terminal


    You can customize the Terminal window using the:


    +   - Options menu

    - Global Options dialog box

    - Terminal Options dialog box


    # Using the Options Menu


    Through Terminal''s Options menu you can change the following Terminal characteristics.


    +   - Remove/Restore the Menu Bar.

    - If you remove the Menu Bar, restore it, click MB3 anywhere in the Terminal window
    to display the pop-up menu. Choose Menu Bar from the Options menu.

    - Remove/Restore the Scroll Bar

    - Resize the window to 80 characters by 24 rows or 132 characters by 24 rows.

    - Change the font size used for text in the window.


    # Setting Global Options


    By selecting Global from the Options menu, you can change the following characteristics:


    +   - Change the cursor style, blink and blink rate.

    - The cursor style is either a box or an underline. You can enable or disable
    cursor blinking. If you enable blinking, the default blink rate is 250 milliseconds,
    which you can change.

    - Switch foreground and background colors.

    - You may choose Normal, which displays the foreground and background colors as
    usual, or Inverse which switches the foreground and background colors.

    - Set scroll behavior.

    - You can enable or disable smooth scrolling. With smooth scrolling each line
    is sent to the Terminal window immediately rather than scrolling the lines in
    a buffer. The default is smooth scrolling disabled (scroll a page at a time).

    - Set the bell type.

    - You may choose Audible (default) which causes the bell to make a sound, Visible
    which causes the bell to blink the background color.

    - Set margin and Distance.

    - You can enable or disable a visible or sound indication that the cursor is within
    a specified distance from the right margin. When you enable this feature, you'
  merge: -1
  pgno: 89
- img_proc: true
  md: "should set the number of characters from the right margin (default is 10 characters).\n\
    \n**Figure 2-30:** Global Options Dialog Box\n\n![](img/8295751df7a37c5d3eb4d16a30f79f7b_90_0.png)\n\
    \n# Setting Terminal Options\n\nYou can change the behavior of your keyboard and\
    \ screen by choosing Terminal from the Options menu. The Terminal Options dialog\
    \ box allows you to change the following:\n\n+   * Cursor key mode\n\\ In Normal\
    \ mode, the arrow keys move the cursor in the left, right, up and down directions.\
    \ In Application mode, the arrow keys generate escape sequences (control sequences)\
    \ that the application interprets for its purposes.\n\n+   * Keypad mode\n\n In\
    \ Numeric mode, the numeric keypad generate the corresponding numeral on the display.\
    \ In Application mode, the numeric keypad keys generate escape sequences that\
    \ the application interprets for its purposes.\n\n+   * Newline sequence\n\n Return\
    \ Only (the default) generates only a carriage return at the end of a line. Return/linefeeds\
    \ both a carriage return and a line feed at the end of a line.\n\n+   * User functions\n\
    \n Locks or unlocks (default) the user function keys."
