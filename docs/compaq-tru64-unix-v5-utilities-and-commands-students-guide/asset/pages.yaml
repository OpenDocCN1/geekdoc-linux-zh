- img_proc: true
  md: '# # Mail Options Using the set Command


    # ## Binary And Value Options


    Below are the binary and value options available with the set command when using
    the Mail utility. The options are listed in alphabetical order. To avoid confusion,
    please note that the options are either lowercase letters or all uppercase letters.


    +   - EDITOR

    Valued option defines which the pathname of the text editor to be used in the
    edit command and ~e. If not defined, a standard editor is used.


    +   - SHELL

    Valued option which gives the pathname of your shell. Used for the ! command and
    ~! escape. this shell expands file names with shell metacharacters like * and
    ? in them.


    +   - VISUAL

    Valued option which defines the pathname of your screen editor for use in the
    visual command and ~v escape. A standard screen editor is used if you do not define
    one.


    +   - append

    Binary option which causes messages saved in mbox to be appended to the end rather
    than preceded. Normally, the Mail utility stores messages in mbox in the same
    order that the system puts messages in your system mailbox. By setting append,
    you are requesting that mbox be appended to regardless. It is quicker to append.


    +   - ask

    Binary option which causes mail to prompt you for the subject of each message
    you send. If you respond with simply a newline, no subject field is sent.


    +   - askcc

    Binary option which causes you to be prompted for additional carbon copy recipients
    at the end of each message. Responding with a new line shows your satisfaction
    with the current list.


    +   - autoprint

    Binary option which causes the delete command to function like dp. After deleting
    a message, the next one is typed automatically. Useful for quickly scanning and
    deleting messages in your mailbox.'
  merge: -1
  pgno: 503
- img_proc: true
  md: '+   - crt

    Valued option used as a threshold to determine how long a message must be before
    is used to read it. more prints only one screenful of the message at a time allowing
    the user to press Spacebar when ready to continue.


    +   - debug

    Binary option which causes debugging information to be displayed. Same as using
    the -d command-line option.


    +   - dot

    Binary option which, if set, causes mail to interpret a period alone on a line
    as the terminator of a message you are sending.


    +   - escape

    Valued option allows you to change the escape character used when sending mail.
    Only the first character of the escape option is used, and it must be doubled
    if it is to appear as the first character of a line of your message. If you change
    your escape character, then ~ loses all its special meaning, and no longer needs
    to be doubled at the beginning of a line.


    +   - folder

    Directory name for storing folders of messages. If this name begins with a slash
    (/) mail considers it to be an absolute pathname; otherwise, the folder directory
    is relative to your home directory.


    +   - hold

    Binary option which causes messages that have been read (but not manually dealt
    with) to be held in the system mailbox. Prevents such messages from being automatically
    swept into mbox.


    +   - ignore

    Binary option which causes RUBOUT characters from your terminal to be ignored
    and echoed as while you are sending mail. RUBOUT characters retain their original
    meaning in mail command mode. Setting the ignore option -i on the command line.


    +   - ignoreeof

    Option related to do makes mail refuse to accept a Ctrl/D as the end of a message.
    Also applies to mail command.


    +   - keep

    Option which causes mail to truncate your system mailbox instead of deleting it
    when it is empty. Useful if you choose to protect your mailbox, which you would
    do with the shell command:

    ```bash

    chmod 600 /usr/spool/mail/you

    ```'
  merge: -1
  pgno: 504
