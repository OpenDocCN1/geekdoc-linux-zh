  md: '# # Using Wildcard Operators


    # ## Overview


    You may sometimes want to process a group of related files without typing out
    the full names of all of them. The Korn shell provides wildcard operators to identify
    names of files to process.


    # ## Matching File Names


    The string that you specify as a file name is scanned for the special characters
    asterisk (*) and question mark (?). If one of these characters is found, the file
    name is treated as pattern and compared to the names of the files in directory.
    A list of matching file names is generated and used to replace the wildcard pattern
    on the command line.


    Wildcard operators cannot be used to match the leading period in hidden file names.


    # ## Using the * Operator


    Use the asterisk (*) operator to match any string of zero or more characters.
    Examples of the * operator are shown in the following table.


    | Pattern | Matches any Name that... |

    | --- | --- |

    | file* | Begins with the string file |

    | *.c | Has the .c extension |

    | *f* | Contains a lowercase f |

    | file*.txt | Begins with the string file and ends with the .txt extension |


    # ## Using the ? Operator


    Use the question mark (?) operator to match any single character. Some examples
    of the ? operator are shown in the following table.


    | Pattern | Matches any Name that... |

    | --- | --- |

    | file? | Begins with the string file and contains exactly one more character
    |

    | ??? | Contains exactly three characters |

    | file*. | Begins with the string file and ends with any one-character extension
    |'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Using Wildcard Operators in Commands


    You can use a wildcard pattern to generate a list of file names for a command
    that accepts multiple file name parameters, as shown in the following table.


    | Command | Function |

    |---|---|

    | cp *.c *.h src | Copies all files with the .c or .h extension to the src directory
    |

    | ls *proj* | Lists all files that contain the string proj |

    | rm *.log | Deletes all files with the .log extension |

    | ls ? | Lists all single-character file names |


    # Escaping Wildcard Operators


    The special meaning of wildcard operators can be escaped (turned off) in either
    of two ways:


    +   - Precede the wildcard operator with a backslash ( \)

    - Enclose the string in single quotes (''^'')


    For example, you can delete a file named *wow* with the command rm \*wow\* or
    the command rm ''*wow*''


