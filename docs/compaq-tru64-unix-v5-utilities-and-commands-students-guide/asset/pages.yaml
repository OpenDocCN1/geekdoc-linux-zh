  md: '# Using the rsh Command


    One way to enter commands on a remote system is to use the rsh (remote shell)
    command. The rsh command connects to the remote host and executes a specified
    command or, if no command is specified, performs a login on the remote host.


    The same restrictions apply for the /etc/hosts.equiv and $HOME/.hosts files as
    the rsh login command.


    The format of the rsh command is:


    ```

    rsh [-dn] [-l user] remote_host [command] [argument ...]

    ```


    This table shows some options for the rsh command.


    Table 12-2: rsh Options

    | Option | Function |

    |---|---|

    | d | Turns on socket debugging on the TCP socket for communication with its copies,
    ignoring the umask |

    | 1 | Specifies another user ID for login rather than the local user ID |

    | n | Redirects all command input to /dev/null; should be used with the C shell
    |


    This example shows two of the rsh command.


    # Example 12-2: Using the rsh Command


    ```

    $ rsh sys001 users

    event garcia

    $ rsh sys002

    Last login: Mon Mar 30 02:10:59 from sys999

    Tru64 UNIX X5.0-14(Rev. 490);Mon Mar 30 03:09:17EST 1998

    sys0025

    ```


    # Now Try This!


    Enter the rsh command to list the /bin directory on the remote system.


    # Need Help?


    If you get the message, "Permission denied",create the .rhosts file on the remote
    system.


    # Solution


    ```

    $ rsh sys002 ls /bin

    Mail

    Rsh

    X11

    .

    .

    ..

    ```'
