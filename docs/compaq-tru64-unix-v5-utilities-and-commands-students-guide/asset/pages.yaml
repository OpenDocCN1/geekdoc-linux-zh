  md: '# # Finding Files


    # ## Overview


    There are times when you need to locate files on the system, but you do not know
    all of the information necessary to locate them. The **whereis** and **find**
    commands are useful for these situations.


    # ## Locating Files


    The **whereis** command locates the directory that contains the source, binary
    and reference page files for a program. With no options, **whereis looks in the
    default directories for all three types of files. After looking in the default
    directory, whereis then searches the Path** variable directories.


    # ### Example 6-2: Using the whereis Command


    ```

    $ whereis emacs ❶

    emacs:/usr/bin/emacs /usr/lib/emacs /usr/share/man/man/emacs

    $ whereis -b emacs ❷

    emacs:/usr/bin/emacs /usr/lib/emacs

    $ whereis -m emacs ❸

    emacs:/usr/share/man/man/emacs.l

    $ whereis -s emacs ❹

    emacs:

    ```


    +   * Searches for files named emacs in the default source, binary, and reference
    page directories

    * Searches for emacs executable programs

    * Searches for emacs reference pages

    * Searches for emacs source files; none are found on this system


    See the *whereis* reference page for more information and options.


    # ## Using the find Command


    The **find** command searches specified directory trees for files that meet particular
    criteria.


    The format for the **find** command is:


    ```

    find pathname expression

    ```


    +   * *pathname* is the directory tree to search from

    * *expression* is the specified criteria to search for


    You can use the **find** command to search the entire directory structure for
    all files named **chap** using this command:'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# Finding Files


    ```

    $ find -name chap -print

    ```


    In the example shown above, root (/) is the pathname to search from and -name
    chap is the expression that indicates to search for files named chap. The -print
    expression tells the system to display any matching file names on the screen.


    In this example, the directory /etc is the pathname to search from and -name passwd
    is the expression to search for. This example searches from the directory /etc
    for any files named passwd and displays them on the screen.


    ```

    $ find /etc -name passwd -print

    ```


    # Using find Command Expressions


    Some of the more common find command expressions, examples of their use and their
    functions are listed here:


    +   - -print expression causes the file name(s) matching the criteria to be displayed
    on the screen.


    ```

    $ find -name chap -print

    ```


    +   - -name expression tells the system to find files based on the file name.


    ```

    $ find /usr/users -name chap -print

    ```


    +   - -ls expression causes the file name(s) matching the criteria to be displayed
    on the screen in the format of a long list.


    ```

    $ find -name chap -ls

    ```


    +   - -user expression finds files based on the owner.


    ```

    $ find -user jones -print

    ```


    +   - -group expression finds files based on the group.


    ```

    $ find /usr -group student -ls

    ```


    +   - -size expression finds files based on size in blocks. A block is 512 bytes.
    You can search for files greater than a size by preceding the size with a plus
    (+).


    ```

    $ find -size 1 -user jones -print

    ```


    +   - -atime expression finds files based on the number of days they were last
    accessed.


    ```

    $ find -atime 7 -ls

    ```'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Pattern Matching


    Suppose you want to find all files whose file name begin with the word chap. You
    can use pattern-matching characters to search for partial file names. If you use
    these characters, you must precede them with the backslash character (or enclose
    the string in quotes). A couple of these characters are:


    +   * asterisk (*) (splat) Substitution for anything. Using chap\ or "chap*" in
    the example will find all files that begin with chap.

    * question mark (?) Substitution for a single character. Using chap\ or "chap?"
    in the example will find all files that begin with chap and have only one more
    character. For, it would not chap2.


    # Now Try This!


    In your home directory, use the /etc find command to:


    +   1. Search from the / directory for files named motd and display those file
    names on the terminal.

    2. Search the /usr/users directory for all files owned by you and display their
    file names. (Note: You receive error messages for subdirectories under /usr/users
    that you do not have access to.)

    3. Search from the /dev directory for file names that include the characters tt
    and display those file names in the form of a long listing.


    # Solution


    +   1. $ find /etc -name motd -print

    2. $ find /usr/users -user you -print

    3. $ find /dev -name \*tt* -ls


    ```

    $ find /dev -name "*tt*" -ls

    ```'
