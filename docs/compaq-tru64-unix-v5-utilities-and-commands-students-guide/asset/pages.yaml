  md: '# Viewing Files


    # Overview


    UNIX provides many ways to display file contents on your terminal screen.

    Commands that provide this functionality are:


    +   - cat Text of file scrolls by

    - more File displays one page at a time

    - head First 10 lines of file are displayed on the screen

    - tail Last 10 lines of file are displayed on the screen


    # Viewing Entire Files


    The cat command displays the entire contents of a file on your screen, with the
    first lines scrolling off if all contents do not fit.


    The format for the cat command is:


    ```

    cat filename

    ```


    # Example 6-3: Viewing a File Using the cat Command


    ```

    $ cat phones

    Maynard MA (508)493-4123

    Nashua NH (603)884-2413

    Cambridge MA (617)654-9531

    Springfield MA (413)747-3452

    Stamford CT (203)258-3232

    Kazoo MI (616)384-8310

    Littleton ME (508)952-4839

    Augusta ME (207)271-2221

    Burlington VT (802)657-2895

    Charleston SC (803)744-9046

    Philadelphia PA (215)246-7028

    Rochester NY (716)385-8240

    $

    ```


    # Viewing Portions of Files


    When you use the cat command to view the contents of a file, the entire file is
    to your screen, leaving the last restful of the file on your screen. However,
    there may be times when you only want to see certain portions of a file.


    The head and tail commands provide this functionality. By default, the head and
    tail commands display the first 10 or last 10 lines of a file. You can specify
    how many lines of the file you want to display.'
  merge: -1
  pgno: 173
- img_proc: true
