  md: '# Using the emacs Help Facility


    # Overview


    emacs has one of the most useful, and complete help facilities of any text editor.

    emacs help consists of:


    +   - Completion: emacs helps you complete typing the names of things

    - The help key: allows you to get help on many emacs topics


    # Name Completion


    You can type in the shortest, unambiguous sequence of characters and tell emacs
    to figure out the rest of the name. The partial name has to contain enough characters,
    starting from the beginning, to distinguish it from any other name.

    emacs can complete:


    +   - File names (in a given directory)

    - Buffers

    - Command names

    - Variable names


    In most cases, when you are prompted for a name in a minibuffer, emacs provides
    completion. When you type a name, press one of three characters to tell emacs
    to help complete the name.


    | Tab | Complete the name as far as possible |

    | Spacebar | Complete the name to the next punctuation* |

    | ? | List any choices of possible names in the *Completion* window


    For example, you might have a C program called poker.c in your default directory.
    When you press Ctrl/X Ctrl/F to visit the file, emacs prompts for the file name.
    The following are the responses you would get if you type pok and use name completion.


    | Press Tab | emacs completes the file name poker.c if no other files begin with
    pok |

    | Press spacebar | emacs completes the file name to poker |

    | Press ? | emacs generates a *Completion* window and provides the names of all
    files that start with pok'
