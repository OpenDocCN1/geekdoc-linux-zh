  md: '# Using stty Command Arguments


    # Using stty Command Arguments


    # Overview


    Use the arguments in the following tables to set the terminal characteristics.


    Table 18-1: stty Command Arguments: Control Modes


    | Argument | Function |

    | --- | --- |

    | parenb (-parenb) | Enables (disables) parity generation and detection |

    | parodd (-parodd) | Selects odd (even) parity |

    | cs5 cs6 cs7 cs8 | Selects character size, if possible |

    | number | Sets terminal baud rate to the number given, if possible; if the baud
    rate is set to zero, modem control is no longer asserted |

    | ispeed number | Sets input baud rate to the number given, if possible; if zero
    is specified, the input baud rate is set to the output baud rate |

    | opeed number | Sets terminal output baud rate to the number given, if possible;
    if the output baud rate is set to zero, modem control is no longer asserted |

    | hupcl (-hupcl) | Stops (does not stop) asserting modem control on last close
    |

    | hup (-hup) | Performs the same as hupcl (-hupcl) |

    | cstob (-cstob) | Uses two (one) stop bits per character |

    | cread (-cread) | Enables (disables) the receiver |

    | clocal (-clocal) | Assumes a line without (with) modem control |

    | crtscts (-crtscts) | Uses (does not use) RTS/CTS hardware flow control |

    | nokerninfo (-nokerninfo) | Disables (enables) the printing of kernel-generated
    status information when the info control character is entered |'
  merge: -1
  pgno: 495
- img_proc: true
  md: '# Table 18-2: stty Command Arguments: Input Modes


    | Argument | Function |

    |---|---|

    | echoctl (-echoctl) | Echoes control characters as ^X and Backspace as ^?; prints
    two backspaces following the End-of-File character (special characters are echoed
    as themselves) |

    | ignbrk (-ignbrk) | Ignores (does not ignore) break on input |

    | brkint (-brkint) | Signals (does not signal) intr on break |

    | ignpar (-ignpar) | Igno (does not ignore) parity errors |

    | parrmk (-parmrk) | Marks (does not mark) parity errors |

    | inpck (-inpck) | Enables (disables) input parity checking |

    | istrip (-istrip) | Strips (does not strip) input characters to seven bits |

    | inlcr (-inlcr) | Maps (does not map) new line to carriage return on input |

    | igncr (-igncr) | Ignores (does not ignore) carriage return on input |

    | icrnl (-icrnl) | Maps (does not map) carriage return to new line on input |

    | maxbel (-maxbel) | Rings (does not ring) bell on terminal when input buffer
    is full |

    | iuccl (-iuccl) | Maps (does not map) uppercase to lowercase |

    | ixon (-ixon) | Enables (disables) Start/Stop output control; output from the
    system is stopped when the system receives Start, and started when the system
    receives Start |

    | ixany (-ixany) | Allows any character (allows only Ctrl/Q) to restart output
    |

    | ixoff (-ixoff) | Requests that the system send (not send) Start/Stop characters
    when the input queue is nearly empty/full |'
  merge: -1
  pgno: 496
