  md: '# # Using Variables in Korn Shell Scripts


    # ## Overview


    The Korn shell lets you use variables interactively and within shell scripts to
    modify information that has changing values. For example, you can modify the value
    of the PATH variable to include new directories. Variables such as PATH are reserved
    by the shell.


    Using and user-created variables in Korn shell scripts allows you to read new
    information or change the output of your scripts to meet changing needs. Assignment
    of variable values can be done in a variety of ways, as shown in the following
    examples.


    | Variable | Function |

    | $ nvalue=100 | Assigns a numerical value to the nvalue variable; by default,
    all variables are strings |

    | $ types -i nvalue=50 | Declares nvalue to be an integer and nvalue=50 assigns
    the value of 50 to it |

    | $ integer y=100 | Forces y to be an integer value |

    | $ dog=cat | Assigns the value cat to the variable dog |

    | $ set | Displays names and values of all variables |

    | $ unset dog | Unassigns a variable |


    The next example shows the results of executing a series of commands for setting,
    displaying, and unset variables.


    # ### Example 17-3: Script for Modifying Variables


    ```

    $ nvalue=100

    $ print $nvalue

    100

    $ integer y=100

    $ print $y

    100

    $ dog=cat

    $ print $dog

    cat

    $ print $PATH

    /usr/users/you:/usr/bin:/usr/sbin::.

    $ unset dog

    $ print $dog

    $

    ```'
  merge: -1
  pgno: 422
- img_proc: true
  md: '# Using Variables in Korn Shell Scripts


    # Using Variables


    Variables provide a way to easily modify the arguments that get passed to a command,
    as shown in the following example.


    # Example 17-4: Script for Modifying Arguments


    ```

    $ cat greeting.ksh

    !/bin/bash

    #

    # greeting.ksh

    # This script uses variables to issue a welcome message

    message="Good Morning"

    application="Shell Programming"

    print ""

    print "$message, $USER"

    print "bb"

    print "Welcome to the Wonderful World of ..."

    print ""

    print "$application!"

    $ greeting.ksh

    Good Morning, you!

    Welcome to the Wonderful World of ...

    Shell Programming!

    $

    ```


    +   - If the time of days changes, modify the value of message.

    - If the application changes, modify the value of application.

    - The print command is used in the Korn shell to print the value of a variable.
    The echo command can also be used.

    - Placing a dollar sign ($) in front of a variable returns the value.

    - Quotation marks are used in Korn shell programming to enclose a string and return
    a literal value except for special characters such as dollar sign ($), apostrophe
    (\''), quotation marks ("), and backslash (\).

    - Execute the greeting.ksh script.


    # Reading Variables


    There are times when the value of a variable must be supplied by the user at run
    time. A script that allows its user to enter information at run time is known
    as an interactive script.


    The following example uses the read command, followed by the variable name, to
    prompt the user to enter information interactively.'
  merge: -1
  pgno: 423
