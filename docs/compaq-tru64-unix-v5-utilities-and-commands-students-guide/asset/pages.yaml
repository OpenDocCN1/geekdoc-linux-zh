  md: 'Customizing Mail (CLI)


    # # Customizing Mail (CLI)


    # ## Overview

    You can customize your mail session by:

    - Using a .mailrc file to override mail’s initial configuration

    - Creating folders to organize saved mail

    - Using an alias to simplify mail distribution


    # ## System Mail File /usr/share/lib/mail.rc

    The /usr/share/lib/mail.rc file:

    - Contains commands that set the initial mail configuration and are applicable
    to all users

    - Is executed by the mail utility before it turns control over to you

    - Is maintained by the system administrator

    Individual users can alter or augment the settings by using a $HOME/.mailrc file.


    # ## Creating a .mailrc File

    Themailrc file:

    - Must be located in your home directory

    - Contains mail set, unset, alias, and ignore commands

    If the .mailrc is not present when you log in for the first time, create it using
    an editor or the cat command.

    The following .mailrc file contains two commands:

    - set ask, which tells mail to prompt you for a subject line whenever you send
    a message

    - set askcc, which prompts you for carbon copies when you finish typing a message


    ### Example 11-9: Creating a .mailrc File

    ```bash

    $ cat > .mailrc

    set ask

    set askcc

    <Ctrl/B>\$

    ```


    Communicating with Other Users 11-21'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'Customizing Mail (CLI)


    # Customizing Your Mail Option File


    Two types of options can be set: binary and valued.


    Table 11-13: Binary Options (on or off)


    | Option | Function |

    | --- | --- |

    | [un]set ask | Causes mailx to prompt for the subject of each message you send
    |

    | [un]set askbb | Causes mailx to prompt for your email address of people to receive
    a blind carbon copy |

    | [un]set ascc | Causes mailx to prompt for Email addresses of people to receive
    copies of the message |

    | [un]set metoo | Causes the sender to be included in the alias expansion and
    therefore sender also receives |

    | [un]set hold | Causes message to be held in the system mailbox by default |


    Table 11-14: Valued Options (option=value)


    | Option | Function |

    | --- | --- |

    | set crt=number | Causes paging program to be invoked from messages that exceed
    number of lines |

    | set EDITOR=pathname | Defines text editor invoked by the ~e and edit subcommands
    |

    | set folder=pathname | Defines the name of directory to use for storing folders
    for messages |

    | set VISUAL=pathname | Specifies pathname of a text editor to use in the visual
    and ~v subcommands |


    # Solution


    +   1. $ vi .profile


    ```

    i

    MAIL=/var/spool/mail/$USER

    wq

    ".profile" 20 lines, 340 characters

    ```


    +   2. $ cat /usr/share/lib/Mail.rc


    ```

    set append dot save

    ignore Received Message-Id Resent-Message-Id Status Mail-From

    Return-Path Via

    $

    ```'
