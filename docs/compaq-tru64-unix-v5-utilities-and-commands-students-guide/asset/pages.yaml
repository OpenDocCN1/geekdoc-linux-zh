  md: '# Figure 5-17: File Manager Permission Dialog Box


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_156_0.png)


    The default permissions are set by the system administrator. To determine your
    default permissions, create a new file or folder, then open the Permissions dialog
    box for that file or folder.


    # Changing the Owner


    You must be the owner of the file or a system administrator (root user) to change
    the ownership of a file. If you have the authority to log in as the root user,
    you must do so before beginning the following procedure. To change ownership of
    a file or folder:


    +   1. Select the icon of the file or folder.

    2. Choose the Change Permissions from the Selected menu or from the icon''s pop-up
    menu displayed by pressing Shift/F10 or MB3.

    3. Type the new owner''s name into the Owner Name text box.

    4. Click OK or press Return.


    If you give ownership of a file or folder to another user, you cannot change its
    permissions again unless that user returns ownership to you.


    # Changing Permissions


    You must be the owner or the system administrator (root user) to change the permissions
    of a file or folder. To change permissions:


    +   1. Select the icon for the file or folder.

    2. Choose the Change Permissions command from the Selected menu or from the icon''s
    pop-up menu displayed by pressing Shift/F10 or MB3.'
