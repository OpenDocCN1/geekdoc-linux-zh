    # Using Mailer (CDE)


    CDE provides the Mailer application for you to communicate with other users on
    your network systems. Using Mailer, you can create, send and receive messages,
    with attachments, manage your incoming mail and customize the Mailer application
    for your working environment.


    # Obtaining User Information (CLI)


    The following commands display helpful user information.


    +   - who | Lists the users who are logged in login name, terminal name, and login
    date and time

    - who am i | Lists information only about the user who is logged in at the terminal
    where the command is entered

    - whoami | Displays your current login name from the /etc/passwd

    - users | Provides a quick, one-line list of users

    - finger | Provides detailed information about users


    # Introducing the Mail Utility (CLI)


    The CLI mailix and Mail commands let you:


    +   - Compose, edit and send message

    - Receive and read messages

    - Delete or store message in a mailbox or in folders


    # Customizing Mail (CDE)


    You can customize your mail session by:


    +   - Using a .mailrc file to override mail''s initial configuration

    - Creating folders to organize saved mail

    - Using an alias to simplify mail distribution'
