  md: '# Restoring and Repeating Changes


    You can undo or repeat a command.


    +   - To undo the last command, type u. The cursor need not be on the line where
    the original edit was made.

    - To undo all edits on a single line, type U if the cursor is still on that line.

    - To repeat the last command, type a period (.).


    # Saving Changes


    Use the :w to save changes to the original file. The colon brings you to last
    line mode where the commands are executed.


    ```

    w file      Saves the contents to the specified file

    !file      Overwrites the specified file

