  md: '# Figure 2-9: Entering Text in Text Editor


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_68_0.png)


    To enter text, click in the document and begin typing text. By default, the Text
    Editor is in insert mode, so text is inserted beginning at the cursor location.


    If you select Overstrike mode, when you position the cursor within a text line,
    any new text will overlay the existing text in the line beginning at the cursor
    location. Press the Insert key to toggle between Insert and Overstrike modes.


    Press the Return key to start a new line.


    The Text Editor Wrap To Fit option, when turned on, will automatically wrap a
    text line at the edge of the window. To use this, you must press the Return key
    to force a new line or create a new paragraph. If you use the Wrap To Fit option,
    you can resize the Text Editor window and the text automatically adjusts to fit
    the new width.


    # Moving the Cursor


    You can insert the cursor with the mouse or the arrow keys.


    +   * To move the cursor with the mouse, move the pointer to the new position
    in the text and press MB1.


    +   * Use the arrow keys or the following:


    ```

    Home            Move to beginning of the current line

    End             Move to end of the current line

    Ctrl/Home       Move to beginning of the document

    Ctrl/End        Move to end of the document

    ```'
