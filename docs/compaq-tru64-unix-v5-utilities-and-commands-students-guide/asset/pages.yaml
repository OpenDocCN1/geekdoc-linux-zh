- img_proc: true
  md: 'Using the CDE Front Panel


    # Workspace Switch


    The **workspace switch** is a portion of the Front Panel containing:


    +   * Buttons to change from one workspace to another

    * A control to lock your workspace

    * A control to exit the system

    * A control that indicates system activity


    Each workspace can be customized for a particular use. For example, if you are
    working on two different projects, you can customize a workspace for each of the
    projects with the files and tools you need.


    # Subpanels


    A **subpanel** is a menu associated with a control. It is indicated by an arrow
    button above the control. A subpanel:


    +   * Contains an Install Icon to customize the subpanel

    * Contains a labeled copy of the Front Panel control

    * Can be deleted or added to a Front Panel control


    This figure shows a Personal Applications subpanel.


    **Figure 2-2:** Subpanel


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_55_0.png)'
