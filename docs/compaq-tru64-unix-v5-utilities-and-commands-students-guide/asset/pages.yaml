  md: '# Editing Another File


    Use the commands shown here to edit another file.


    +   - e file Edits a different file; note the space before the file name


    +   - e! Reeds the current file, discarding any changes


    +   - r file Reads the prefixed file into the editing buffer below the cursor;
    note the space before the file name


    +   - r! Runs a shell command, placing the command output in the file below the
    cursor position


    # Controlling the Screen


    Use the Ctrl/L command to clear and redraw the screen.


    +   - z Redraw the screen with the current line at the top


    +   - z- Redraw the screen with the current line at the bottom


    +   - z. Redraw the screen with the current line at the center


    # Recovering an Edit Session


    If a system failure occurs while you are editing a file, any changes made after
    last saved the file are lost. However, a copy of the edit buffer containing your
    edit changes, should be saved.


    The next time you log in, you may receive a mail message indicating that your
    buffer was saved.


    To determine if any recover buffers are available


    ```

    $ vi -r

    ```


    On Mon Mar 16 at 9:05 saved 5 lines of file "test.txt"


    To recover the buffer, use the -r option with the file name.


    ```

    $ vi -r test.txt

