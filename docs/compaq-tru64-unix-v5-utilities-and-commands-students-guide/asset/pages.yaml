  md: '# Sorting


    # Overview


    Another useful filter is the sort command, which alphabetizes its input according
    to the first letter in each line, and prints the sorted list to standard output.
    The following example displays the result of using the sort filter on the hot
    and cool files.


    # Example 9-3: Using the sort Command


    ```

    $ cat hot          $ cat cool

    orange aqua

    yellow turquoise

    scarlet violet

    magenta chartreuse

    ```


    ```

    $ sort hot cool

    aqua

    chartreuse

    magenta

    orange

    scarlet

    turquoise

    violet

    yellow

    ```


    # sort Command Options


    Common options to the sort command are shown in the following table.


    # Table 9-2: Common sort Command Options


    | Option | Example | Function |

    | -f | sort -f cool hot | Sorts files hot and cool, disregarding whether the letters
    are in the file uppercase or lowercase |

    | -r | sort -r cool | Sorts the file in reverse alphabetical order |

    | -u | sort -u cool hot | Sorts files hot and cool, eliminating any duplicates;
    ensures that each item in the output is unique |

    | -m | sort -m file1 file2 | Reads file1 and file2 and merges the results of each
    on the screen; only works if files are already sorted |

    | -o | sort -o warm hot | Sorts the file hot and places the output in the file
    name immediately following the -o flag (warm); enables sorting a file onto itself
    |'
  merge: -1
  pgno: 258
