- img_proc: true
  md: '# Managing Print Requests


    # Overview


    Once you print your file, you may want to check on the status of your print job.

    UNIX provides the following commands for checking print job status.


    +   - lpq

    - lpstat

    - lpc


    # Checking Print Status with lpq


    The lpq command reports the status of jobs in the print queues by:


    +   - Printer

    - User

    - Request ID


    The format of the lpq command is:


    ```

    lpq [+number] [-l] [-Printer] [request_id...] [user...]

    ```


    The following table provides information about the use of arguments with the lpq
    command.


    # Table 14-3: lpq Command Options


    | Option | Function |

    |---|---|

    | (No option) | Reports on all print jobs for the default printer |

    | +number | If the + argument is used, lpq reports the status of the spool every
    second until the queue is empty; if number is provided, lpq displays the queue
    every number seconds |

    | -l | Causes additional information about each entry to be shown |

