  md: '# Deleting Print Requests


    # Overview


    Use either of the following commands to delete a print request:


    +   - lprm

    - cancel


    # Deleting a Print Job with lprm


    You can remove print requests from the print queue with the lprm command.


    The format of the lprm command is:


    ```

    lprm [options]

    The following table lists some options to the lprm command

    ```


    Table 14-6: lprm Options

    | Option | Function |

    | (No option) | Removes from the queue the current active request for the user
    on the default printer if no options are specified |

    | -Pprinter | Specifies a specific print queue from which to remove print jobs.
    Further identification of a print job is required |

    | - | Removes all print jobs from the designated queue for users; for the superuser,
    the spool queue is completely emptied |

    | request_id | Removes the print job with number request_id from the designated
    print queue |

    | user | Removes all print jobs from the designated print queue for user; if the
    superuser executes the command, multiple users may be identified |


    # With the lprm Command


    The following example shows how to remove job 49 from the default print queue.


    Example 14-4: Deleting a Print Job with lprm


    ```

    $ lprm 49

    ```


    # Deleting a Print Job with cancel


    The cancel command can also remove print jobs spooled by the lp or lpr commands.


    The format of the cancel command is:


    ```

    cancel [request_id] [printer]

    ```'
  merge: -1
  pgno: 373
- img_proc: true
  md: 'The request_id option cancels only the print job with that job number. The
    printer option cancels all print jobs for the selected printer for the user. If
    the superuser issues the cancel command with the printer option, all requests
    for that printer are removed from the queue.


    # Now Try This!


    +   1. Spool a large file to a printer.

    2. Use the lpq command to find the job number.

    3. Use the cancel command to cancel the job.


    # Solution


    Sample solution:


    ```

    $ lpr -Pforpub core

    $ lpq -Pforpub

    Thu Jul 2 10:55:37 1998: Attempting to print dfA002gertie

    Rank Pri Owner Job Files Total Size

    active 0 2 msg core 1212416 bytes

    $ cancel 2 forpub

    dfA002gertie dequeued

    cfaA002gertie dequeued

    ```'
