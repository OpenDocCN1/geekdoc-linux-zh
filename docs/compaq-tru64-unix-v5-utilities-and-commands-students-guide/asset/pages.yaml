  md: '# Defining Korn Shell Startup Files


    # Overview


    When a user logs in, the default shell executes system and user login files to
    customize the user environment. The user environment is defined by variables and
    options. This lesson provides examples of the Korn shell startup files and describes
    some of the variables and options that can be set.


    The Korn shell startup files are:


    +   - /etc/profile


    +   - $HOME/.profile


    +   - The file indicated by the ENV variable (we will use $HOME/.kshrc)


    When you log in, the /etc/profile script runs first. Every Korn shell user on
    the system has this script; therefore, it is a good place for the system administrator
    to provide information that every user needs.


    $HOME/.profile script runs next. Because the script is located in each user''s
    $HOME directory, each user can customize the script to his or her needs.


    Each time you start up a new Korn shell script or run a Korn shell script, the
    system automatically invokes the environment script, the script file designated
    by the expansion of the ENV variable.


    The assignment of the file name to the ENV variable is done in the $HOME/.profile
    file, to be described shortly.


    # Korn Shell .profile File


    When you log in with the Korn shell as the default shell, the Korn shell executes
    the /etc/profile script if it exists, then executes your $HOME/.profile script


    Use your $HOME/.profile script to:


    +   - Set and export variables that you want to set for all programs that you
    run


    +   - Set options that you want to apply to your login shell only


    +   - Specify a script to execute when you log out


    A sample Korn .profile file is shown in the following example.'
  merge: -1
  pgno: 225
- img_proc: true
  md: "# Example 7-13: Korn Shell .profile File\n\n```\nCDPPATH=..:$HOME\nENV=$HOME/.kshrc\n\
    EDITOR=emacs\nFCEDIT=emacs\nPS1='! ksh ' \nexport PATH ENV PS1\ntrap $HOME/.kshlogout\
    \ EXIT\n```\n\n# Korn Shell Environment Script File\n\nEach time the Korn is invoked,\
    \ it expands the ENV variable, and if not null, executes that script file. We\
    \ will use $HOME/.kshrc as defined in .profile of the preceding example.\n\nUse\
    \ the .kshrc environment script file to:\n\n+   - Define aliases and functions\
    \ that apply to interactive use and for scripts invoked by the Korn\n- Set default\
    \ options that you want to apply to all Korn Shell invocations\n- Set variables\
    \ that you want to apply to the current Korn shell invocation\n\nSome commands\
    \ that might be included in a Korn shell environment file are shown in the following\
    \ table.\n\n# Table 7-5: Some .kshrc Commands\n\n| Command | Function |\n| ---\
    \ | --- |\n| set -o monitor | Enables the Korn shell to display the job number\
    \ when a background job is started, and starts a status message when the job completes\
    \ |\n| set -o trackall | Reduces the amount of time it takes the Korn shell to\
    \ find some commands; the Korn shell creates an alias for the command first time\
    \ it is executed |\n| set -o noclobber | Prevents the Korn shell from writing\
    \ over an existing file when using the > (redirection) operator |\n| alias l='ls\
    \ -al | Defines an alias for getting a list of all files |\n| alias h=history\
    \ | Defines an alias that provides a history of commands |\n| alias c=clear |\
    \ Defines an alias that clears the screen |\n| HISTSIZE=64 | Defines the maximum\
    \ number of previously entered commands you can access through the Korn shell\
    \ as 64; default is 128 |\n| umask 022 | Creates a file creation mask; umask is\
    \ a 3-digit octal number that specifies the permissions the system should remove\
    \ whenever the Korn shell or any of its child processes creates a file |"
  merge: -1
