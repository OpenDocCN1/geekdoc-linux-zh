    prompt and is used as the first character in each line of an execution trace (default
    is +)

    - The user''s working directory

    - The pathname of the user''s shell

    - The login name of the user

    - A temporary variable that contains the last argument of the previous shell command;
    a portion of the previous shell command executed

    - A user-created variable


    To have a customized environment, users can define the built-in variables that
    are modifiable such as PATH, PS1, CDPATH, and HISTSIZE in the .profile file in
    their login directory. The following example provides a sample of the commands
    used to set these variables.


    # Example 17-7: Commands Used to Set Variables


    ```

    $ cat .profile

    print "executing .profile"

    PS1=''! $PWD> \

    export PS1

    export TERM=vt10 \

    CDPATH=:.\

    ```'
