  md: '# Searching


    # Overview


    Another filter, called grep (global regular expression printer), searches its
    input for a pattern of characters, and outputs any line containing that pattern.


    The format of the grep command is:


    ```

    grep expression filename...

    ```


    where expression is a pattern of characters, and filename... refers to the file(s)
    to be searched.


    The output from grep is a list of lines from the file(s) that contain the expression.


    # Finding Patterns


    The following example displays the contents of the price.fruit file, then shows
    how to use the grep command to search price.fruit for the prices of fruits that
    are berries.


    Example 9-7: Searching for Patterns with grep


    | cat price.fruit | $ grep berries.fruit |

    | apples | .49 | raspberries | 3.39 |

    | oranges | .59 | strawberries | 2.38 |

    | grapefruit | 0.59 | blueberries | 1.89 |

    | lemons | .25 | cranberries | 1.59 |

    | limes | .33 | | |

    | cantaloupe | 1.19 | | |

    | kiwi | .38 | | |

    | bananas | .87 | | |

    | pineapples | 1.49 | | |

    | grapes | 2.19 | | |

    | raspberries | 3.39 | | |

    | strawberries | 2.38 | | |

    | blueberries | 1.89 | | |

    | cranberries | 1.59 | | |

    | peaches | .79 | | |


    # Finding Patterns in Specific Positions


    The following series of examples shows how to use grep to find patterns in specific
    positions.


    To find the price of a pound of apples, you could use the command:


    ```

    $ grep ''apples'' price.fruit

    ```'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'However, be aware that this command prints out the price of any fruit containing
    the pattern ''apples'', not just the price of the apples.


    ```

    $ grep ''apples'' price.fruit

    apples .49

    pineapples 1.49

    ```


    If you want only the price of apples (not pineapples or crabapples), you can specify
    that you only want grep to print the pattern if it occurs at the beginning of
    the line. To anchor a pattern to the beginning of a line, use the caret (^) character,
    enclosing the entire expression in quotation marks.


    ```

    $ grep ''^apples'' price.fruit

    apples .49

    ```


    You can also anchor patterns to the end of the line using a dollar sign ($), enclosing
    the entire expression in quotation marks.


    ```

    $ grep ''59$'' price.fruit

    oranges .59

    grapefruit 0.59

    cranberries 1.49

    ```


    # Finding Nonfixed Patterns


    The grep command has the ability to look for patterns that are not fixed. These
    patterns are known as regular expressions.


    Regular expressions:


    +   * A method of specifying patterns of character strings

    * Allow you to describe a set of strings instead of having to list every member
    of the set


    Strings that fit the specified pattern are said to match the regular expression.
    A choice, or range, of characters is specified with square brackets ([]).


    The example prints any line in the price.fruit file that begins with the letter
    l, the letter o, or the letter s.


    # Example 9-8: Searching Files for Regular Expression


    ```

    $ grep ''^[los]'' price.fruit

    lemons .29

    limes .33

    oranges .59

    strawberries 2.38

    ```


    To indicate one character from a range, specify the first character in the range,
    followed by a hyphen (-), followed by the last character in the range.


    The next example prints every line in the price.fruit file that begins with letters
    a through g.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Example 9-9: Specifying a Range with grep


    ```

    $ grep ''^[a-g]'' price.fruit

    apples              .49

    grapefruit          0.59

    cantaloupe           1.19

    bananas             .87

    grapes               2.19

    blueberries         1.89

    cranberries          1.59

    ```


    # Using Negation with grep


    You can use grep to find lines that do not contain a specific pattern. There are
    two ways to do this.


    +   - Using the -v option

    - Using the caret symbol within square brackets [^]


    To find all lines in the price.fruit file that do not end with a 9, you can use
    either of the commands shown in the following example.


    # Example 9-10: Using Negation with grep


    ```

    $ grep -v ''9$'' price.fruit

    lemons              .25

    limes                .33

    bananas             .87

    strawberries        2.38

    ```


    ```

    $ grep ''[^9\]$'' price.fruit

    lemons              .25

    limes                .33

    bananas             .87

    strawberries        2.38

    ```


    # Other Options to the grep Command


    Some other options to the grep command are shown in the following table.


    | Option | Function |

    | --- | --- |

    | -c | Counts the number of lines in which the pattern occurs for each file named
    |

    | -l | Lists all file names that contain one or more occurrences of the pattern
    |

    | -n | Prints the line number with the whole line for each occurrence of the pattern
    |

    | -i | Considers uppercase and lowercase letters identical in making comparisons'
