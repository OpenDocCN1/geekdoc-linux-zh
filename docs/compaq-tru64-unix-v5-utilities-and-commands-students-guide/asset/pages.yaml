  md: '# # Accessing Remote Systems


    # ## Overview


    During the course of your work day, you may need to access another system to locate
    a manual stored on line, program source files that need to be updated, or start
    up programs. This section covers the commands you can use to gain access to a
    machine other than your own. Once you have access to the other machine, you can
    enter commands just as you do on your local host system.


    # ## Network Security


    For many network applications, the remote host allows access without one or more
    of the following apply:


    +   - The local system is included in the remote host''s `/etc/hosts`.equiv file,
    the local user is not the superuser, and the `-l` option is not specified.

    - The local system and user name is included in `$HOME/.rhosts` file in the home
    directory of the remote user account.


    Some applications as `login` will prompt for a password if none of the above is
    true, while others as `rcp` will fail.


    # ## Logging In


    You can use the `login` command to log in to a remote system.


    The format of the `login` command is:


    ```

    login host [-echaracter] [-l username]

    ```


    This table shows some of the options you can use with the `login` command.


    Table 12-1: login Options


    | Option | Function |

    | --- | --- |

    | -8 | Allows an 8-bit data path at all times. Otherwise, unless the Stop and
    Continue key sequences on the remote host are not standard, `login` uses a 7-bit
    data path, and the 8th (high) bit of each is stripped. |

    | -echaracter | Changes the escape character to the one you specified. |

    | -username | Changes the remote user name to the one you specified. Otherwise,
    your local user name is used at the remote host. |


    This example shows two uses of the `login` command.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# Example 12-1: Using the login Command


    ```

    $ login sys001

    Last Login: Mon Mar 30 01:00:59 from sys999

