  md: '# Introducing the Mail Utility (CLI)


    # Deleting Mail


    You can delete messages and retrieve those messages deleted by mistake using the
    d and u commands, as shown in the following table.


    Table 11-11: Delete and Undelete Commands


    | Command | Function |

    | --- | --- |

    | d msg_list | Deletes all messages whose numbers are in msg_list; if no list
    is given, only the most recently read message is deleted |

    | u msg_list | Undeletes messages whose numbers are in msg_list and places them
    back in your mailbox; only messages from the current mail session may be undeleted
    |


    # Exit and Help Commands


    Mail provides the following commands to obtain help and exit the mail program.


    Table 11-12: Exiting and Help Commands


    | Function | Command | Result |

    | --- | --- | --- |

    | Help | ?, help | Displays a list of commands along with a summary of their meanings
    |

    | Exit mail | q | Mail is exited;all changes made to your mailbox (for example,
    deletions) are final |

    | | x, ex | Mail is exited and you are returned to the $ prompt; your mailbox
    is left as it was at the beginning of the mail session |

    | List mail variables | set | Lists mail variables |'
