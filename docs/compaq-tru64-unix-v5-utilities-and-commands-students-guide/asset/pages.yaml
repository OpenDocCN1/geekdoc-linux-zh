- img_proc: true
  md: '# Printing Files


    # Overview


    With CLI, you have two print commands.


    +   - lp

    - lpr


    # Printing Files with lp


    The lp command sends the specified files to a printer for printing.


    The format of the lp command is:


    ```

    lp [-option] [] [file]

    ```


    This table shows some of the options for the lp command.


    # Table 14-1: lp Command Options


    | Option | Function |

    | - | Reads input from standard input |

    | -d | Specifies the printer to do printing; if -d printer is not specified, in
    order:

    - PRINTER environment variable

    - LPDEST environment variable |

    | -m | Sends mail to the user after the files are printed |

    | -n number | Specifies the number of copies you want |

    | -t title | Prints title on the banner page |


    # Now Try This!


    To print a file from your working directory:


    +   1. Use your default printer which you created in the previous lesson.

    2. Print two copies of the text file.

    3. Give your print job a title.

    4. Have the system send you mail when the file is printed.


    # Need Help?


    If you did not receive a job number, your print command did not work. If you received
    an error message, fix the error. If you are still having problems, talk to your
    system administrator after reading the reference page on lp(1).'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'Printing Files


    # Solution


    The command you enter should look similar to this:


    ```

    $ lpr -n2 -t"Program Example V1.0" -m example.txt

    Job Number is: 215

    ```


    # Printing Files with lpr


    The lpr command provides more printing options than the lpr command including:


    +   - One or two-sided printing

    - Landscape or portrait orientation

    - Multiple pages on a side of paper

    - International support


    The format of the lpr command is:


    ```

    lpr [-option] [file]

    ```


    This table shows lpr options.


    | Option | Function |

    | --- | --- |

    | - | Reads input from standard input |

    | -i[number] | Indents the output by number of spaces; default number of spaces
    is 8 |

    | -j | Displays the printer request ID on standard output after the job is entered
    in the queue |

    | -J name | Provides name on the burst page |

    | -Ksides | Prints one-sided, two-sided, tumble, simplex or duplex |

    | -m | Sends mail when the spooling is complete |

    | -Nnumber | Prints one or more pages on one sheet of paper |

    | -Pprinter | Prints to the specified printer |

    | -#number | Produces the specified number of copies |


    # Now Try This!


    Using the lpr command, print a text file from your home directory with the following
    options:


    +   - 1. Print the file to a printer other than your default printer.

    - 2. Print with the banner MY JOB.

    - 3. Have the text indented five spaces.'
  merge: -1
  pgno: 365
- img_proc: true
  md: '4. Have the mail program notify you when your print job is complete.


    # Need Help?


    Read the reference page on lpr(1).


    # Solution


    The command you enter should look similar to this:


    ```

    $ lpr -Plp1 -J "MY JOB" -i5 -m examples.txt

    ```'
  merge: -1
