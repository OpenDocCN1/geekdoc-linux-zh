  md: '# Logging In and Out of the System


    # Overview


    Your system administrator must provide you with username and password information
    before you log in to the UNIX operating system.


    Enter information in response to system requests or prompts. The prompts for logging
    in and system response differ depending upon the type of terminal being used.


    > NOTE

    \UNIX is sensitive to uppercase and lowercase letters and treats them as different
    characters.


    Two types of commands are used in this course.


    +   - Enter: Type the command and press Return

    - Type: Type the characters and not press Return


    # Logging In Using CDE


    To begin a desktop session, log in to CDE. To end the session, log out. The work
    you do between events is managed by a CDE application called the Session Manager.
    On logging out, the Session Manager remembers the state of your session, and on
    your next login recreates that state in a new session.


    **Figure 1-2:** Login Screen


