- img_proc: true
  md: 'Summary


    # Summary


    # Introducing the emacs Editor


    Start emacs [-options] filename.


    The emacs screen is divided into three areas:


    +   - The editing area (which may contain one or more windows)


    +   - A mode line for each window


    +   - The minuffer area


    Terminate the emacs session by pressing Ctrl/X Ctrl/C.


    # Using the emacs Help Facility


    emacs has a very extensive and useful Help facility. You can get help with Ctrl-
    followed by the character that represents the type of help you want. Another Ctrl/H
    provides a list of applicable characters.


    # Performing Basic Editing


    There are emacs commands, such as:


    +   - Use the sequence Ctrl/X Ctrl/F file (find-file command) to read a file.


    +   - Precede a command with Esc number to repeat the command.


    +   - Move the cursor with the arrow keys.


    +   - Set a mark at one end of a region with Ctrl/spacebar or Ctrl/@, then move
    the cursor to the other end of the region and press Ctrl/X Ctrl/X.


    +   - Ctrl/W deletes a marked region.


    +   - Esc W copies a marked region.


    +   - Ctrl/Y yanks the deleted or copied text into the buffer.


    +   - Ctrl/U undoes the last edit.


    # Searching and Replacing


    emacs provides commands to search for a text string and optionally replace it.
    Start a search with Ctrl/S.'
  merge: -1
  pgno: 541
- img_proc: true
  md: '# Using Buffers and Windows


    emacs allows you to edit multiple buffers at one time. A window on the screen
    displays a buffer.


    +   - Ctrl/C Ctrl/B lists the buffers.

    - Ctrl/X b buffer-name switches buffers.

    - Ctrl/X 2 splits the window.

    - Ctrl/X/O moves the cursor to the other window.

    - Ctrl/X 1 deletes all but one window.


    # Correcting Mistakes


    emacs provides commands to transpose characters, words, sentences, or paragraphs.
    emacs provides commands to change the capitalization of text.'
  merge: -1
  pgno: 542
- img_proc: true
  md: '# Exercises


    +   1. Using the emacs tutorial:


    +   a. Start emacs with junkfile, then start the emacs tutorial with Ctrl/H T.

    Only the TUTORIAL buffer will be visible. Follow the steps in the tutorial.


    Remember, you may be using Ctrl/\ for incremental searches instead of Ctrl/S.


    Also remember, if Esc does not work, try Ctrl/[.


    If you want to take a break, or quit, with intentions of resuming where you left
    off, place some type of marker at the place you want to come back to. Use some
    combination of characters, like qq, is easy to remember. Use Ctrl/X C to exit
    the emacs editor. When emacs asks if you want to save the file ~/TUTORIAL, type
    yes. emacs will save the file in your home directory.


    When you want to resume the tutorial at the point you left off, edit the file
    TUTORIAL that you saved. When the mode line is on the screen, incremental search
    (Ctrl/S) to find the qq, or whatever you used as a marker. Use Esc to terminate
    the search when emacs finds the qq. You are now ready to resume the tutorial.


    +   b. When you have completed the tutorial portion of the buffer, exit emacs
    with Ctrl/X Ctrl/C. This time, type no when emacs asks if you want to save the
    file TUTORIAL. You can always get back into the tutorial with Ctrl/H T.


    +   2. Cutting and pasting from one file to another:


    +   a. Edit junkfile again, and start the tutorial.


    +   b. Create a second window with Ctrl/X 2.


    +   c. Use Ctrl/X B Return to switch to the buffer junkfile, which is the default.
    You should now have junkfile in one window, and the tutorial in the other window.


    +   d. Switch cursor to the window containing the tutorial with Ctrl/X O.


    +   e. Incremental search, Ctrl/S or Ctrl/\, to find the string "several windows".


    +   f. Use Ctrl/A to terminate the search and move the cursor to the beginning
    of the line. Note that you do not have to terminate the search with Esc then Ctrl/A
    to move the cursor. Most cursor motion commands will terminate a search.


    +   g. Set the mark with Ctrl/spacebar.


    +   h. Move the cursor to the end of the paragraph with Esc.'
  merge: -1
  pgno: 543
- img_proc: true
  md: '+   i. Verify that the mark is set where you thought it was with Ctrl/X Ctrl/X.
    mark and point are not where you thought, set the mark again.


    +   j. Delete the marked text with Ctrl/W.


    +   k. Move the cursor to the other window with Ctrl/X O.


    +   l. Yank the text into the buffer from the kill ring with Ctrl/Y.


    +   3. Using Query Replace and Recursive Edit


    +   a. Move the cursor to the other window (TUTORIAL) with Ctrl/X O.


    +   b. Move the cursor to the top of the tutorial with Esc <.


    +   c. Use Esc % to query replace "M-" with "Esc-".


    +   d. Enter y or spacebar to replace the first four occurrences of "M-". When
    you reach the fifth "M-" , you should be on the line that begins with "If moving
    by characters is too slow..." Let''s assume we notice a mistake and want to replace
    "characters" with "one character".


    +   e. To enter recursive edit, type Ctrl/R.


    +   f. Move the cursor to the beginning of the word "character" with isearch-backward,
    Ctrl/R, or by normal cursor movement. Add the word one and a space before "character",
    then delete the "s" from the end of "characters". It should now read "If moving
    by one character is too slow..."


    +   g. Exit recursive edit with Esc Ctrl/C. Notice that the cursor moves to the
    next "M-", right where you left off.


    +   h. Enter y or spacebar to replace a few more occurrences of M-.


    +   i. Enter . to exit the query replace.'
  merge: -1
