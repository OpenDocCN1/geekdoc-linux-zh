    # ### Setting Korn Shell Variables


    Use an assignment statement to set variables. The format of an assignment statement
    is:


    ```

    name=value

    ```


    If value has a space in it, you must enclose the entire string with double quotes.


    As shown in the following example, you can create variables myname and address
    a value to the EDITOR and FCEDIT variables.


    # ### Example 7-4: Setting Korn Shell Variables


    ```

    $ myname="Charlie Brown"

    $ address="2 Tired Way"

    $ EDITOR=emacs

    $ FCEDIT=emacs

    ```'
