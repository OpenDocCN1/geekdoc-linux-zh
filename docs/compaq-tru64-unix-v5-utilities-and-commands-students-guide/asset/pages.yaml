  md: '# Using Buffers and Windows


    # Overview


    One of the most useful features of emacs is its ability to edit multiple buffers
    at one time, and to display more than one buffer on the screen at one time.


    In addition to the buffers that are a working copy of the files you are editing,
    you can create temporary buffers that have no relationship to the files. emacs
    itself creates buffers, and generally these buffers have names of the format *buffer
    name*, such as #Help*, *scratch*, and *Buffer List*.


    There is no limit to the number of buffers you can have, but most often one or
    two buffers are displayed. But, even though you cannot see them, the other buffers
    are still active.


    A window is an area on the screen in which a buffer is displayed. Each window
    has its own mode line which separates the windows from each other. You can have
    multiple windows, as many as you want, but there comes a point where the windows
    become so small that they are just not useful.


    When you have multiple windows:


    +   - They can be the same buffer or different buffers


    +   - You can move from one window to another, and therefore from one buffer to
    another


    +   - You can move from one place in one buffer to another place in the same buffer


    +   - You can quickly and easily compare buffers or copy from one buffer to another


    # Buffer Commands


    When you initially start editing a file with emacs, you provide the filename of
    the file you want to edit. The file becomes the buffer name.


    If you want to edit a second file, use the Ctrl/X Ctrl/f command. emacs creates
    a new buffer for your working copy of the file.


    If you have been editing for an extended period of time, you may have many different
    buffers. You must be able to move between buffers, and often, you will forget
    the names of buffers, so you must be able to determine which buffers are available
    and be able to manipulate them.'
  merge: -1
  pgno: 533
