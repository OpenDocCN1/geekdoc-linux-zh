  md: '# Unit Overview


    # Introduction


    This unit examines some of the commands that allow access to other systems using
    TCP/IP as the network transport.


    TCP/IP stands for Transmission Control Protocol/Internet Protocol - a suite of
    network protocols used by applications to provide network functions such as:


    +   - Remote login

    - File Transfer

    - Name/address resolution

    - Network file systems


    # Objectives


    To access other systems, you should be able to:


    +   - Log in and execute commands

    - Display Motif applications from remote systems


    # Resources


    For more information on the topics in this unit, see the following:


    +   - UNIX reference pages'
