    # Signal Trapping


    Signals are provided in a UNIX operating system to control the system. Signals
    are used in programming to send a message to a script to stop it altogether, or
    momentarily.


    To see the signals available on your system, enter: kill -1. Most signals sent
    to a script will terminate the script. To prevent this from happening, programmers
    try to capture signals rather than let them interfere with their program.


    K shell providing the trap command to hold signals and events and capture error
    information. The following example shows how trap can be used to identify traps
    the INT <Ctrl/C> and QUIT (<Ctrl/>) signals sent to the script. Each occurrence
    of the INT signal is counted. QUIT signals are ignored. After each, you start
    the script, enter numerous <Ctrl/C> and <Ctrl/> commands during the 15 seconds
    it takes to run the script.


    # Example 17-17: ksh Script Signal Trapping


    ```

    $ cat traps.ksh

    #!/bin/ksh

    #

    # traps.ksh

    #

    # Demonstrate the use of interrupt and exit traps

    #

    integer c=0 j=0

    #

    trap ''c=+1; print " ouch $c'''' #Count INTs (^C)

    #

    trap Print of C''s on exit

    trap ''''print All done: $c ^Cs'''' EXIT

    #

    trap '''' QUIT #Ignore QUITs (\)

    #

    trap Wait for 15 seconds

    ```'
