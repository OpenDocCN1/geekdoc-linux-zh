  md: '# Controlling and Managing Jobs


    # Overview


    To control and manage a job, you need commands that will:


    +   - Stop, suspend or terminate job execution

    - Move a job between the background and foreground

    - Coordinate the execution of multiple jobs


    # Suspending Jobs


    While waiting for a command or shell script to complete, you often realize that
    there is something you forgot to do. You can suspend the present job while you
    correct the problem, then continue where you left off the suspended job. Use the
    SUSP character (usually Ctrl/Z) to suspend a foreground job.


    This example shows the vi editor started and then suspended with Ctrl/Z.


    Example 10-7: Susending the Present Process


    ```

    $ vi notice.txt

    -

    .

    .\.

    "notice.txt" [New file]

    <Ctrl/Z>


    [3] + 10147 Stopped vi notice.txt

    $

    ```


    # Placing a Job in the Foreground


    The fg command places a stopped or background job in the foreground. The fg command
    format:


    ```

    fg job_id

    ```


    If job_id is not used, the current job, as indicated by the plus (+) in the output,
    is placed in the foreground. You can specify the job by preceding it with a percent
    sign (%), or you can specify the PID. If you do not specify the job, the system
    uses the current job.


    This example demonstrates the fg command


    Example 10-8: Using the fg command


    ```

    $ fg Places the current job in the foreground

    $ fg %3 Places job 3 in the foreground

    $ fg 10147 Places the job with PID 10147 in the foreground

    ```'
