  md: '# Tilde Escape Sequences


    Other commonly used tilde escapes are shown in the following table.


    | Table 11-7: Tilde Escape Functions |

    | Option | Function |

    | ~b | Adds username(s) to the list of people username(s) receive blind copies
    of the message |

    | ~c | Adds username(s) to the list of carbon copy username(s) recipients |

    | ~p | Prints out header fields, followed by the entire contents of the message
    so far |

    | ~r filename | Reads the named file into the message |

    | ~s string | Uses the string as the subject field in the message header |

    | ~t | Adds usernames to the list of direct username recipient |

    | ~w filename | Writes a message to the file, filename |

    | ~! command | Starts a shell, run command, returns to editor |

    | ~? | Displays a list of tilde escapes |


    This example shows the use of some tilde escape sequences.


    # Example 11-7: Using Tilde Escapes When Sending Mail


    ```

    $ mailx jls sjg

    ~-s current thoughts on the book project

    We need to get together very soon to discuss the modifications necessary if the
    book is ever going to be published. I sent a copy to the publishers last week
    to see if they are all interested, but obviously we have to make a lot of changes
    to it conform somewhat to industry standards. How''s Friday at 2 pm for a meeting?

