  md: '# Summary


    # Using File Manager


    Start File Manager by clicking the File Manager icon on the Front Panel.


    The File Manager window has menus for command options, and shows the current folder
    path and the object icons in it. You can:


    +   * Change folder path by double-clicking the folder icon.

    * Select one or more objects to manipulate.

    * Drag files and folders.

    * Double-click the file or folder icon to open it.


    # Locating Files


    File Manager keeps track of files by allowing you to search for a file or folder
    by name. You can also search for files based on the contents of the file.


    Use Find from the File menu to search for files.


    # Customizing File Manager Views


    The File Manager provides several ways to view the contents of folders. You can:


    +   * Display folders in tree view or folder view

    * Change the sort order of objects

    * Show or hide certain files or folders

    * Change the style used for objects


    File Manager can be customized to display files and folders in tree and folder
    views. Files and folders can be displayed or hidden from view.


    # Creating Files and Folders


    To create a new file, choose New File from the File Manager menu. Type a file
    name. Click OK.


    To create a new folder, choose New Folder from the File Manager menu. Type a folder
    name. Click OK.


    # Deleting Files and Folders


    The Trash collects files and folders that you delete. These objects are not actually
    removed from the system until the trash is emptied. You can change your mind and
    restore a file you have put in the Trash Can if the Trash Can has not been emptied.'
