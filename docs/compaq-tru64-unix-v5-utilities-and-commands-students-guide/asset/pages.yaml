  md: '# Using Terminal


    # Overview


    CDE provides a terminal emulator window where you can enter commands using the
    UNIX command line interface. The default emulator for the desktop is dtterm. The
    Terminal application provides support for legacy applications written for ANSI
    and ISO conformant character terminals such as the DEC VT220.


    Your system administrator may provide other terminal emulators for your use.


    This topic discusses how to use the default terminal emulator for the desktop,
    dtterm.


    # Starting Terminal


    When you click the Terminal control in the Personal Applications subpanel, Terminal
    displays its main window, as shown in this figure.


    Figure 2-27: Terminal''s Main Window


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_86_0.png)


    When the Terminal emulator supplies a prompt, you may enter commands to start
    up applications, issue commands or perform copy and paste operations between windows.


    # Starting an Application


    To start up an application, you must type a command at the command line prompt.
    The syntax of a command is as follows:'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# Using Terminal


    application [options] &


    Where application is the name of the application you want to run and options is\information
    which passes to the application in the form of parameters or switches.


    Check the reference pages or online help to find the type of information you can

    supply on the command line for your application.

    A ampersand (&) specifies that you want the application to run in the background.

    This allows you to continue entering commands in the Terminal window while the

    application is running.


    This figure shows how to run the clock program, xclock. The -digital switch

    tells the clock program you want a digital clock instead of an analog clock.


    **Figure 2-28: Starting an Application in Terminal


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_87_0.png)


    After pressing Return to enter the command, the xclock application displays the

    time and date in a separate window where you can place anywhere on the desktop,

    and the dtterm window is ready to take another command.


    # **Try This!**


    Use the Terminal application to start the xclock application in the background.


    # **Need Help?**


    If you get the message xclock: not found,use the /usr/bin/X11/

    xclock command.


    # **Solution**


    +   1. Click the Terminal control on the Personal Applications subpanel.

    2. Type xclock &.'
  merge: -1
  pgno: 87
- img_proc: true
