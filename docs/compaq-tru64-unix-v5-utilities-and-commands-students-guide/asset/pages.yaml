  md: '# About This Course


    # Introduction


    This section describes the contents of the course, suggests ways in which you
    can most effectively use the materials, and sets up the conventions for the use
    of terms in the course. It includes:


    +   - Course description — a brief overview of the course contents


    +   - Target audience — who should take this course


    +   - Prerequisites — the skills and knowledge needed to ensure your success in
    this course


    +   - Course goals and nongaols — what skills or knowledge the course will will
    and not provide


    +   - Course organization — the structure of the course


    +   - Course map — the sequence in which you should take each chapter


    +   - Chapter descriptions — brief descriptions of each chapter


    +   - Time schedule — an estimate of the amount of time needed to cover the chapter
    material and lab exercises


    +   - Course conventions — explanation of symbols and signs used throughout this
    course


    +   - Resources — manuals and books to help you successfully complete this course


    # Course Description


    Tru64 UNIX V5 Utilities and Commands is an entry-level course. It provides the
    fundamental skills needed to effectively use a UNIX operating system, including
    Tru64 UNIX, UNIX System V, or a BSD-based system.


    The concepts presented here are suitable for users of any UNIX environment, and
    prepare students to use the Common Desktop Environment (CDE) and the Korn shell
    on any UNIX operating system. The examples, ejercicios, and solutions are based
    on Tru64 UNIX Version 5.0 system using CDE and the Korn shell.


    # Place in Curriculum


    This course is the basic user course. It is also the prerequisite for the UNIX
    administration curriculum and the UNIX programming curriculum.


    # Target Audience


    The concepts presented in this course are suitable for users of any UNIX environment,
    for service technicians and customers.'
  merge: -1
  pgno: 27
