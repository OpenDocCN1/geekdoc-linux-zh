  md: '# Summary


    # Introducing the UNIX Shell


    The Tru64 UNIX available shells, their default prompts, and file names:


    | /bin/csh (%) | C shell |

    | /bin/sh ($) | Bourne shell |

    | /bin/ksh (*) | Korn shell |


    Shells can be used as a programming language to provide:


    +   - A user interface to the Tru64 UNIX operating interpreter

    - A command language interpreter


    Using Wildcard Operators

    - The asterisk (*) operator can match any string of zero or more characters.

    - The question mark (?) operator can match any single character.

    - The special meanings of wildcard operators can be escaped (turned off) by preceding
    the wildcard operator with a backslash (\), or by enclosing the string in single
    quotes.


    # Describing the Korn Shell Environment


    Variables perform an important role in defining the Korn shell environment. There
    are two types of variables.


    +   - Reserved variables

    - User-defined variables


    The Korn shell has many reserved variables, and they fall into two classes; variables
    whose values are the Korn shell:


    +   - Sets and updates

    - Does not automatically set


    Korn variables are defined with an assignment statement that has the format name=value.
    Variables are displayed with the set, typeset, or print $name commands. The typeset
    command sets the attributes of a variable.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Defining Korn Shell Startup Files


    The system and user login scripts customize the following environment features:


    +   * Terminal characteristics

    * Search path

    * Shell variables

    * Default file creation permissions for new files with umask

    * Checking for mail

    * Command aliases

    * History variables

    * The trap command


    The following files set up shell and environment variables and options:


    +   * /etc/profile

    * $HOME/.profile

    * Environment file designated by the expansion of the ENV variable'
  merge: -1
