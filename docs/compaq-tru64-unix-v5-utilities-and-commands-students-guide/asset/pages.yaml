    # Using the kill Command


    You can communicate with a foreground process by using the terminal keys, such
    as Ctrl/C, but you need special commands to communicate with a background job.


    The kill command sends a signal to a background job. Use kill to terminate a job,
    or with the trap command to create a script to catch inappropriate action. An
    application can choose to ignore signals or to catch them and attend to them at
    a later time. If this is not the case, the kill command will terminate the process.


    The format of the kill command is:


    ```

    kill [-signal] job_name

    ```


    You display the kill signals with the kill -1 command. The table shows the list
    of signals from the kill–1 command.


    # Table 10-3: Tru64 UNIX kill Signals


    | 1-HUP | 7-EMTX | 13-PIPE | 19-CONT | 25-XFSZ |

    | 2-INT | 8-FPE | 14-ALRM | 20-CHLD | 26-VTALRM |

    | 3-QUIT | 9-KILL | 15-TERM | 21-TTIN | 27-PROF |'
