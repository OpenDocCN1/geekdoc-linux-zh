  md: '# Changing Permissions


    # Overview


    File permissions allow you to restrict access to files or folders. Three groups
    of users can access files and folders: user, group, and other. File access is
    divided into three types of permissions: read, write, and execute.


    The superuser can access other users'' files without regard to permissions.


    # Displaying the Permissions


    You can display the file has by using the -l option with the 1s command.


    ```

    $ ls -l

    -rwxr-x-- 1 users 45 Jun 29 15:22 reports

    -rwrw-r-- 1 users 321 Nov 02 17:21 a.out

    ```


    Starting in the second character of the first field, the first three characters
    represent the user''s permissions, the next three are the group''s permissions,
    and the last three are the others'' permissions.


    Within each set of three characters are the types of permissions. A dash (-) means
    no permission, and the following characters indicate a permission.


    +   - r Users can read the file

    - w Users can write (change) the file; write access implies delete access all

    - x Users execute the file


    An executable file is a special file that can be run as a program. The file can
    be a binary file, or an ASCII file, such as a shell script.


    A directory is another example of an executable file. If it is a directory, you
    must have both read and execute permission to access all the information about
    the files in it. Read permission lets you read the file names. Execute permission
    is required to get detailed information, such as file size and permissions.


    # Interpreting File Permission Fields


    The table describes the file permissions for this sample entry.


    ```

    -rwxr-r-- 1 you students 321 Nov 02 17:21 a.out

    ```'
  merge: -1
  pgno: 183
- img_proc: true
  md: "# Table 6-2: Interpreting File Permission Fields\n\n| Field | Name | Description\
    \ |\n| --- | --- | --- |\n| - | File type | The first character indicates the\
    \ file type. It is not part of the permissions. File types include:\n- ordinary\
    \ file\br>- d directory<br>- c character special file<br>- P named pipe<br>- s\
    \ socket<br>- 1 symbolic link |\n| rwx | User access | These three characters\
    \ indicate the file access for the user (owner). The owner of this file you has,\
    \ read and execute access. |\n| rw- | Group access | The next three characters\
    \ indicate the file access for the group. Group (students) have only read and\
    \ write access to this file. |\n| r-- | Other access | The last three characters\
    \ indicate file access for others (world). The world has only read access to this\
    \ file. |\n\n# Changing File Permissions Using chmod\n\nUse the chmod command\
    \ to change file permissions. There are two different methods of changing file\
    \ permissions.\n\n+   - Using letters and operation symbols\n- Using octal numbers\n\
    \nThe chmod command can specify permissions using letters and operation symbols.\n\
    The format for the chmod command is:\n\n```\nchmod class operation permission\
    \ filename\n```\n\n# Table 6-3: chmod Options\n\n| Parameter | Description |\n\
    | --- | --- |\n| class | Specifies which group's permission you are changing.\
    \ Possible values are:\n- u User (owner's) permission\br>- g Group's permission\b\
    r>- o Other's or world permission\br>- a All (user, group and world) |"
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Table 6-3: chmod Options (Continued)


    | Parameter | Description |

    | --- | --- |

    | operation | Specifies whether you are adding or removing a permission. Possible
    values are: <br>+ Add permission<br>- Remove permission<br>= Assign permission
    regardless of previous settings |

    | permission | Specifies the type of permission you are adding or removing. Possible
    values are: <br>r Read<br>w Write<br>x Execute |

    | filename | Specifies the name of the file whose permissions you want to change.
    |


    This example shows how to use the chmod command with letters and operation symbols.


    +   1. Display the current permissions on the file a.out.


    ```

    $ ls -l a.out

    -rw-r---- 1 users 23951 Jan 08 13:02 a.out

    ```


    +   2. Give group and others write access to the file a.out. Separate multiple
    class-operation-arguments with a comma.


    ```

    $ chmod g+w,o+w a.out

    ```


    +   3. Display the permissions on the file a.out.


    ```

    $ ls -l a.out

    -rw-rw-rw 1 users 23951 Jan 08 13:02 a.out

    ```


    +   4. Remove read access from the group and adds read access to others on the
    file a.out.


    ```

    $ chmod g-r,o+r a.out

    ```


    +   5. Display the permissions on the file a.out.


    ```

    $ ls -l a.out

    -rw-rw--r 1 users 23951 Jan 08 13:02 a.out

    ```


    +   6. Add read and execute access for the group on the file a.out.


    ```

    $ chmod g+rx a.out

    ```


    +   7. Display the permissions on the file a.out.


    ```

    $ ls -l a.out

    -rw-xrwx- 1 users 23951 Jan 08 13:02 a.out

    ```'
