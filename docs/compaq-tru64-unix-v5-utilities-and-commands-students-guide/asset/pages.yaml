  md: '# Korn Shell Command Line Editing


    +   - Command execution

    - Moving the cursor

    - Deleting or replacing characters, words, and lines

    - Entering vi insert mode

    - Using uppercase and lowercase letters

    - Pathname expansion or completion

    - Miscellaneous commands


    # Editing Shell Commands with emacs and gmacs


    Both emacs and gmacs are subsets of the GNU emacs editor. The only difference
    between emacs and gmacs is the way they handle Ctrl/T. The emacs editor swaps
    the present character with the next character and advances the cursor, whereas
    gmacs just swaps the previous characters.


    # Editing Korn Shell Commands with vi


    The vi editor, the vi command line editor contains both insert and command modes.


    +   - Insert mode:


    The default mode; type text normally on the command line. To recall a previous
    command, you must press Esc to enter command mode. Use insert mode to type in
    a command or to insert characters into a recalled command. Any character typed
    is inserted on the command line, except those listed in the following table.


    Table 16-2: vi Insert Mode Commands

    | Command | Function |

    |---|---|n| Esc (escape) | Places the vi command line editor into command mode
    |

    | Backspace (erase) | Deletes the character previous to the current cursor position
    |

    | Ctrl/U (kill) | Clears all input characters from the command line |

    | Ctrl/W | Deletes the previous word |

    | Ctrl/D (eof) | Executes the command if typed with the cursor at the first character
    on the command line |

    | Ctrl/V | Inserts the next character as a special character (control characters
    except erase and kill) |

    | \ | Inserts the control characters for erase or kill; press \ followed by the
    delete or kill character |


    16-12 Recalling and Editing Korn Shell Commands'
