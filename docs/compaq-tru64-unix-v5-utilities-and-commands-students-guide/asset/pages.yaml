    | q | Display all buffers marked with m | Immediately |


    The command divides the screen into the number of windows designated by the marked
    buffers plus the buffer where the cursor is located. If you want two buffers,
    mark one with m, place the cursor on the line containing the name of the other
    buffer, press q.


