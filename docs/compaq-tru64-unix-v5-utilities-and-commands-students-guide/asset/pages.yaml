  md: '# Using File Manager


    You can use either the mouse or the keyboard to select multiple files or folders.


    There are two ways to select multiple objects using a mouse:


    +   * Press MB1 in a blank area of the view, drag the mouse to draw a box around
    the icons you want to select, release the mouse button.

    * Click MB1 to select the first icon, then hold the Ctrl key and click MB1 to
    select each additional icon.


    To remove a single icon from the selected group, hold down the Ctrl key and click
    the icon you want to remove.


    To select multiple objects using the keyboard:


    +   1. Select the first file or folder by pressing the spacebar.

    2. For each additional icon you want to select, move the highlight to it, then
    press Ctrl/spacebar.


    # Dragging and Dropping a File or Folder


    To drag and drop a file or folder:


    +   1. Put the mouse pointer over the file or folder.

    2. Press and hold MB1.

    3. Drag the icon to where you want to drop it.

    4. Release the mouse button.


    To cancel a drag in an icon, press Esc before releasing the mouse button.


    If you try to drop an icon into a location that does not support dropped objects,
    the icon snaps back to its original location in File Manager or on the desktop.


    # Displaying a Pop-up Menu


    Each object in File Manager has a pop-up menu. The File Manager window itself
    has a pop-up menu when the pointer is placed in the view outside the boundaries
    of the individual file or folder objects.


    To select a pop-up menu using the mouse:


    +   1. Point to the icon whose pop-up menu you want to display and press MB3.
    On a two-button mouse, press the right mouse button.

    2. To choose a command from the menu, drag to the command, then release, click
    the command.


    To cancel the menu without choosing a command, click an empty area within the
    File Manager window.'
