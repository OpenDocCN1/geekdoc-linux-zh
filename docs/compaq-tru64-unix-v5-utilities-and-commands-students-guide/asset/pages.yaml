  md: '# # Invoking Remote Motif Applications


    # ## Overview


    Sometimes you may want to execute a Motif application on another system, but display
    the output on your workstation screen. This can be done using the same commands
    that you use to invoke terminal-based applications on another system.


    # ## Network Security


    In addition to the ordinary network security that the /etc/hosts.equiv and HOME/.hosts
    files provide, there is an additional security check made before a remote Motif
    application can display its output on your workstation.


    You must grant permission on the local system (server) to receive display from
    a remote system (client).


    +   * To see the list of authorized display clients, enter the command /usr/bin/X11/xhost
    on the local system. The output will show which remote systems have permission
    to display output on the local system.

    * To add display clients, use the xhost command with the host or user name you
    want to display output.


    # ## Specifying the Display


    Many Motif applications provide a -d or -display option to specify where the application
    should display output. If you do not specify this option, the application uses
    the value of the DISPLAY environment variable.


    To set and export the display with the KornShell, the format is:


    ```

    export DISPLAY=system:screen

    ```


    where:


    +   * system is the system name to display on

    * : indicates TCP/IP should be used for the connection

    * screen is the screen on that system to display on, usually 0.0


    The Motif version on your system must be compatible with the remote system version.


    # ## Invoking Applications


    If you have a terminal session running on the remote system, or after you open
    a one with the login/telnet command, just invoke the Motif application from the
    command line.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# Invoking Remote Motif Applications


    Tru64 UNIX locates many of the Motif applications in the /usr/bin/X11 directory.
    If this directory is not in your command search path, you use the full pathname.


    Either set and export your DISPLAY variable, or use the display option of the
    application to redirect the display to your system. You may want to use the &
    operator to run the Motif application in the background, so you can use your terminal
    session for other work.


    This example shows how to run a remote Motif application with the display output
    to your local system.


    +   - First by specifying the display system on the command line with the -d option

    - Second by using the DISPLAY environment variable to specify the display system


    Example 12-6: Invoking Motif Applications


    ```

    $ login sys002 -l you

    Password:

    Last login: Mon Mar 30 12:12:20 from sys999

    nsys002$ /usr/bin/X11/xclock -d sys999:0.0 &

    [1] 5731

    sys002$ export DISPLAY=sys999:0.0

    sys002$ /usr/bin/X11/xclock

    ```


    # Now Try This!


    +   1. Using the login or telnet command, to log in to your remote system.

    2. Use the whereis command to get the full path for xclock, the clock application.
    Invoke it in the background, using the display option to direct the display to
    your workstation.


    # Solution


    +   1. $ login sys002

    Password:

    Last login: Mon Mar 30 01:00:59 from you@sys001

    Tru64 UNIX X5.0-14(Rev. 490);Mon Mar 30 03:09:17EST


    +   2.

    sys002$ whereis xclock

    xclock: /usr/bin/X11/xclock /usr/share/man/man/xclock.1X

    sys002$ /usr/bin/X11/xclock -display sys001:0.0 &

    [1] 9573

    sys002$'
  merge: -1
  pgno: 341
- img_proc: true
  md: "# Invoking with rsh\n\nTo invoke only one application on the remote system,\
    \ you can use the rsh command.\n\n```\n$ rsh sys002 -l1 you /usr/bin/X11/xclock\
    \ -d sys999:0\n```\n\n# Now Try This!\n\nEnter the rsh command to invoke xclock\
    \ on your remote system.\n\n# Need Help?\n\nIf you get a message stating:\n\n\
    > Client is not authorized to connect to Server: Can not open display use the\
    \ xhosts command on your local system to grant permission to the remote system.\n\
    \n# Solution\n\n```\n$ rsh sys002 -l1 you /usr/bin/X11/xclock -d sys001:0\n$ \n\
    ```"
  merge: -1
