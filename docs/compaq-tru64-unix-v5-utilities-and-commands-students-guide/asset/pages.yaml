  md: '# Managing Print Requests


    +   The -r option provides the status of the printer daemon. In this example,
    the daemon is running.


    +   The -s option provides a list of printers in addition to the default printer
    and the status of the daemon. Notice that the output for the lp and lpl printers
    goes to a remote system.


    +   The -t option provides status information for all printers. Notice that queuing
    and printing are enabled for all printers, however, no daemon is present for any
    of the printers. No daemon is present because there are jobs.


    +   To determine the printers available on the system, use the lpstat -v option.
    The output from this command also shows if a printer is local or remote. The serial
    printer in this example is a local printer (directly connected to the system),
    lp, lpl, parallel are remote printers (located somewhere on the network).


    # Printer Control Program (lpc)


    The lpc command is normally used by the system administrator to control the operation
    of the printers on the system. However, users can issue the lpc status and restart
    commands. Use these two commands to check the status of your job and restart the
    printer daemons.


    The format of the lpc command is:


    ```

    /usr/bin/lpc [command [argument]]

    ```


    If you enter /usr/bin/lpc without arguments, lpc prompts for commands from standard
    input. If you supply arguments, lpc interprets the first argument as the command
    to be executed, and the remaining arguments as parameters to the command.


    # lpc User Commands


    This table lists all lpc commands available to users.


    Table 14-5: lpc User Commands


    | Command | Description |

    | --- | --- |

    | help or ? | With no arguments, provides a list of the available commands. With
    a command name as an argument, provides a short description of command. |

    | restart [all | printer...] | If an abnormal condition causes the daemon to quit,
    leaving jobs in the queue, the restart command attempts to start a new daemon.
    |

    | status [printer...] | Displays the status of daemons and queues on the local
    system. The output from this command may also be seen with the lpstat -t command.
    |

    | exit or quit | Exits lpc interactive mode. |


    14-12 Printing Using CLI'
