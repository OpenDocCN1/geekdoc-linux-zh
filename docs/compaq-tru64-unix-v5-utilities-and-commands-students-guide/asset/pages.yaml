  md: '# Using Flow Control and Loops


    # Overview


    As you write more complex shell programs, you must be able to verify input and
    results. Conditional and loop statements allow you to execute commands such as
    if and while, or until specified conditions are true.


    # Relational Operators


    The Korn shell script relational operators let you make comparisons that a numeric
    or string value based on a condition being met. The table provides numerical relational
    operators.


    The format for a numeric test is: (( number1 operator number2 )). The following
    table shows numeric relational operators.


    # Table 17-1: Numeric Relational Operators


    | Operator | Comparison |

    | --- | --- |

    | == | Equal to |

    | != | Not equal to |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to


    The format for string tests is: [[string1 operator string2]]. The following table
    shows string relational operators.


    # Table 17-2: String Relational Operators


    | Operator | Comparison |

    | --- | --- |

    | == | Equal to |

    | != | Not equal to |

    | < | Greater than |

    | > | Less than


    # Flow Control: If If Statement


    The conditional if-then-else statement provides for the execution of a set of
    commands only if a stated condition is true. The condition is generally a relational
    expression in which the value of two or more items is compared.'
  merge: -1
  pgno: 429
