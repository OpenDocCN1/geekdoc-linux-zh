  md: '# Locating Files


    # Overview


    File Manager keeps track of files by allowing you to search for a file or folder
    by name. You can also search for files based on the contents of the file.


    # Finding an Object by Name


    To find an object based on the name:


    +   1. Choose Find from the File menu.


    **Figure 5-3:** File Manager Find Dialog Box


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_139_0.png)


    +   2. Type the name of the file or folder you want to find in the File or Folder
    Name field.


    When you specify a file or folder name, you can include wildcard characters, such
    as asterisk (*) or question mark (?). The * matches any string of characters (including
    no characters), and ? matches any single character.


    +   3. Type the folder where you want to search begin into the Search Folder field.
    By default, this field contains the name of the current folder.


    Find will search this folder and all of its subfolders.


    +   4. Click Start or press Return.


    File Manager searches the Search Folder and the folders it contains for files
    that match your request. Matches appear in the Finds list. Once an object is found,
    you can select it and click Open Folder to open it or Put in Workspace to place
    its icon on the current backdrop.


    +   5. To stop the search, click the Stop button or press Return.'
  merge: -1
