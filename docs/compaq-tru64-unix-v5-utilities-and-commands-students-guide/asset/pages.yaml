  md: '# Figure 0-1: Course Map


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_30_0.png)


    # Chapter Descriptions


    A brief description of each chapter is listed below.


    +   - **Getting Started with Tru64 UNIX**: Contains a brief history of UNIX, a
    basic description of the Tru64 UNIX operating system, and an introduction to the
    Common Desktop Environment. Logging in and out, changing passwords and using the
    Tru64 UNIX documentation is also included.

    - **Using CDE**: Describes the CDE Front Panel, how to help, and how to use the
    clock, text editor, calculator, and terminal applications in CDE.

    - **Customizing Your Workspace**: Describes how to customize a workspace using
    the Style Manager. For the command line interface, the chapter describes how to
    set up a terminal.

    - **Introducing File System Concepts**: Describes the directory tree structure,
    types of files and file conventions used by the Common Desktop Environment and
    command line interface; also introduces access permissions.

    - **Managing Files with CDE**: Discusses using File Manager to access, list, find,
    create, delete, copy, move, rename, link, and control access to the contents of
    files and directories.

    - **Managing Files with CLI**: Discusses basic commands to access, list, find,
    display, create, delete, copy, move, rename, link, and control access to the contents
    of files and directories.'
