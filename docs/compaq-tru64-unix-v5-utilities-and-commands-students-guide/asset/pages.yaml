  md: '# Summary


    To delete files or folders, drag and drop the object on the Trash Can. To return
    the file, open the Trash Can and drag and drop the file to File Manager. Files
    are deleted permanently when the trash is shredded or you log out of a session.


    # Copying and Moving Files and Folders


    Files and folders are copied by selecting the object, then pressing and holding
    the Ctrl key and dragging and dropping the object into the destination folder.


    Files and folders are moved by selecting the object and dragging and dropping
    the object into a destination folder.


    # Renaming Files and Folders


    You can rename a file or folder using one of the following methods.


    +   - Select the object and choose Rename from the Selected menu in File Manager.


    +   - Select the object and type the new name directly into the name field. Press
