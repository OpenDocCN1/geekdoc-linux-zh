  md: '# Introducing File System Concepts'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Unit Overview


    # Introduction


    The UNIX operating system uses a hierarchical file system. Since a file is a named
    collection of information, the information can be:


    +   * A program

    * Data for a program

    * A directory

    * A device special file


    To efficiently work with a UNIX system, you must understand how the UNIX system
    is organized and the different types of files that can be created. You must know
    limitations regarding naming of files and directories and determine the type of
    information a file contains.


    # Objectives


    To understand and use UNIX files, you should be able to:


    +   * Identify several file types

    * Describe file and directory naming conventions

    * Describe the UNIX directory tree structure


    # Resources


    For more information on the topics in this chapter, see the following:


    +   * Common Desktop Environment: User’s Guide

    * Command and Shell User’s Guide'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Identifying Files and Data Types


    # Overview


    A file is a container that holds information. This information can be data, records,
    a spreadsheet, or a document. The format of the data in a file can be arranged
    in many ways. The format of the file is known as a data type. The UNIX file system
    uses three types of files.


    +   * Ordinary disk files

    * Special files

    * Directory files


    # Ordinary Disk Files


    An ordinary (regular) file contains whatever information you place in it.


    +   * ASCII characters or binary data

    * A string of bytes by data


    The system does not require a particular structure and formatting is left to a
    user''s program or the UNIX command interpreting the file. A file created using
    an editor is an ordinary file.


    A subclass of the ordinary file is the hidden file.


    +   * Hidden file names begin with a period(.profile, .kshrc)

    * Each hidden file used by the system performs a special function.


    # Special Files


    UNIX treats all physical devices as if they were special files.


    +   * Each device on a UNIX system has a special file associated with it.

    * These special files are normally located in the /dev directory.

    * Writing to a special file transfers information to the device.


    # Directory Files


    A directory is a special file that contains files. Think of it as a file folder
    containing letters or reports.


    # Determining Data Types (CDE)


    A data type identifies the file''s particular format and associates the file with
    the appropriate application. CDE associates icons with data types. In most cases,
    double-click on the icon will open the application and the file.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Identifying Files and Data Types


    The icons shown represent the type of data contained in a particular file.


    Figure 4-1: Icon Data Types


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_121_0.png)


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_121_1.png)


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_121_2.png)


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_121_3.png)


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_121_4.png)


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_121_5.png)


    +   - The lightning bolt represents an executable.

    - The ps icon represents a PostScript file.

    - The pencil icon represents a text file.

    - The text icon is for special and undefined files.

    - The K and shell icon represents a Korn shell file.

    - The folder icon represents a folder.


    # Determining File Types (CLI)


    The file command shows you the type of a particular file. That is, it provides
    information about whether a file contains ASCII text, or program code, or is a
    directory or special file.


    The format for the file command is:


    ```

    file filename

    ```


    This command displays the file name and the type of information it contains. The
    example shows the output of some file commands.


    Example 4-1: Using the file Command


    ```

    $ file bin

    bin:          directory

    $ file myfile

    myfile:       ascii text

    $ file nosuch

    file: Cannot get file status on nosuch: not open for reading

    $ file compute_average.c

    compute_average.c: c program text

    ```'
  merge: -1
  pgno: 121
- img_proc: true
  md: '```

    $ file /dev/tty

    /dev/tty: character special (1/0)

    $

    ```


    # Now Try This!


    Using the file command, determine the type of each file listed.


    +   1. .profile

    2. /usr

    3. /


    # Solution


    ```

    1. $ file .profile

    .profile: commands text

    2. $ file /usr

    /usr: directory

    3. $ file /

    n/: directory

    ```


    # Folders


    A folder is a container for files, similar to a folder in a file cabinet. A folder
    is the CDE equivalent to a UNIX directory.


    A folder can contain subfolders. Within any single folder, each file name must
    be unique. However, files in different folders may have the same name.


    In the CDE environment, as you navigate from folder to folder, your current location
    is referred to as the current folder.


    Folders provide the connection between the names of files and the files themselves.
    They impose a structure on the file system.


    +   * Each folder stores the names of the files in the folder.

    * The system maintains several folders for its own use. One of these is the root
    folder, represented by a slash (/). It is the top-level folder.

    * Files and folders are often grouped by function.

    * All user folders are often grouped together.

    * Each user has a folder of files called the home folder.


    # Objects


    CDE uses the term object to represent a system resource such as a file, directory,
    or application.'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'Since files and folders are represented in File Manager icons, the term object
    is used to describe them both. Objects are discrete things on the desktop that
    you can create and manipulate.


    On the desktop, applications can also be represented as objects. For example,
    Application Manager contains objects representing the applications available on
