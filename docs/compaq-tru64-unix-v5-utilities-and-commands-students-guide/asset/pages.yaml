  md: '# # Using Calendar


    #  Overview


    If you do not have a secretary, an electronic tool like the Calendar application
    can keep track of your appointments, meetings and any miscellaneous activities
    you need to do. If you do have a secretary, that person can maintain your calendar
    as well as the calendar of other group members.


    Project leaders will find Calendar''s feature of scheduling group appointments
    when setting up meetings to discuss project concerns.


    This topic discusses the Calendar application and how to make an entry in your
    Calendar or To Do list.


    #  Viewing Calendar


    When you click the Calendar control on the Front Panel, Calendar displays a main
    window, as shown in the figure. It contains menus and tool bar controls at the
    top and the selected Calendar view in the lower part.


