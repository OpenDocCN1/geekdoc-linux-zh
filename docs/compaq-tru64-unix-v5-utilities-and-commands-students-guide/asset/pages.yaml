    # Getting emacs Help


    emacs provides help through the emacs help key, Ctrl/H, followed by the character
    that represents the type of help you want. Some of the help commands are shown
    in the table.


    | Command | Function |

    |---|---|

    | Ctrl/H a expr | Searches for commands that match expr, and if any are found,
    provides the name of the command, key binding, and any, the first line of documentation
    in a help window. |

    | Ctrl/H f cmd-name | Provides a description of the command provided by cmd-name.
    |

    | Ctrl/H k key-sequence | Provides the name of the command executed by key-sequence,
    and provides a description of the command. |

    | Ctrl/H w cmd-name | Provides the key sequence, if any, bound to cmd-name. |


    If you cannot remember what to type to get help on a particular topic, Ctrl/H
    Ctrl/H, emacs opens a *Help* window which provides a short description of all
    the options.


    Here are some general information key sequences.


    | Command | Function |

    |---|---|

    | Ctrl/H i | Starts the information documentation reader |

    | Ctrl/H t | Provides an emacs tutorial |


    # Now Try This!


