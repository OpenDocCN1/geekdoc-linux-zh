  md: "# Status Information\n\nWith no options on the command line, the ps command\
    \ provides process status with the information categories shown in the table.\n\
    \nTable 10-1: Process Status Information Categories\n| Header | Description |\n\
    | PID | Process identification number |\n| TTY | Name of the terminal device that\
    \ controls the process; in most cases, this is the terminal you were when you\
    \ entered a command |\n| S | State of the process indicated by a sequence of flags\
    \ up to four letters |\n| TIME | Accumulated execution time of the process |\n\
    | CMD | Name of the command and its arguments |\n\n# Using ps Options\n\nSome\
    \ common options to the ps commands are shown in this table.\n\nTable 10-2: Selected\
    \ Options for the ps Command\n| Option | Function |\n| -a | Prints information\
    \ to standard output about all processes except the group leaders and processes\
