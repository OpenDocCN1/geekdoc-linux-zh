  md: '# Taking This Course


    +   * Introducing UNIX Shells: Describes the purpose of a shell, the shells available
    with Tru64 UNIX, and the general features of each of these shells. The Korn shell
    variables and startup files are also discussed at an introductory level.

    * Using the vi Editor: Introduces the editors available with Tru64 UNIX, and provides
    a detailed description of the vi text editor.

    * Redirecting, Filtering, and Piping: Covers input and output redirection, common
    filters such as wc, sort and grep, as well as the use of pipes. Simple text manipulation
    using awk is also presented.

    * Controlling Processes: Covers the Concept of processes and how to manage them.
    Understanding the information in this chapter is fundamental to how successful
    you will be in the features of the Korn shell. Topics include the definition of
    a process, how to create processes, commands that control processes, and how to
    run processes in the background and at scheduled times.

    * Communicating with Users: Teaches the CDE Mail application and in CLI, commands
    that show who is logged in to the system. The chapter presents an introductory
    overview of the features of the Tru64 UNIX operating system with additional discussion
    of the talk and write utilities.

    * Using TCP/IP Networks: Describes how to exchange files with, execute commands
    on, and how to log in to remote systems.

    * Printing CDE: Discusses how to determine what name to use access printers available
    on your system, how what files are waiting to be printed, and how to delete print
    requests using the Common Desktop Environment.

    * Printing Using CLI: Discusses how to determine what name to use access printers
    available on your system, how to print files, determine what files are waiting
    to be printed, and how to delete print requests using the command line interface.

    * Using Tapes and Disks: Defines how to identify devices types and names, the
    tar and ltf commands for working with tapes, and the df and du commands.

    * Recalling and Editing Korn Shell Commands: Defines the use of variables associated
    with Korn shell command recall, command editing, and the history buffer, and describes
    how to recall commands from the history buffer, and reexecute Korn shell commands.

    * Introducing Korn Shell Scripts: Provides an introduction to the Korn shell script
    as well as its creation and execution. This chapter also covers features of the
    Korn shell programming environment.'
