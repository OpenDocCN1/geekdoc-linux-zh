  md: '# Describing the Korn Shell Environment


    # Overview


    This lesson provides an introduction to the concept of the parent and child process
    and the environment.


    # The Parent, the Child, and the Environment


    Assume that you are logged in to a UNIX system and are using the Korn shell to
    run a Korn script file called first.ksh. The running script, first.ksh, is a child
    of the Korn shell. The Korn shell is the parent of the script file. There are
    other parent/child relationships, as the Korn shell itself has a parent. However,
    for this discussion, assume that the parent is the Korn shell and the child is
    a script file or an executed command.


    Figure 7-1: Processes and the Environment


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_215_0.png)


    Every parent or child process has an environment. An environment is a collection
    of privileges, resources, and traits.


    +   - A parent cannot inherit environmental traits from its child.

    - A child cannot damage the environment of its parent.

    - By default, a parent process passes rights and privileges to its children.


    # Inherited Environmental Characteristics


    By default, a parent does not pass variables, functions, or aliases to its child.
    The following environmental characteristics are passed from a parent to a child:


    +   - Ability to read, write, or execute objects (the parent''s) access rights
    to files, directories, and so forth

    - Files that the parent has opened

    - Resource limits (for example, the amount of main memory that a process is allowed
    to use)

    - Response to signals'
  merge: -1
  pgno: 215
- img_proc: true
  md: "+   * Value of the IFS variable\n\nA child does not inherit the following environmental\
    \ characteristics from its parent:\n\n+   * Aliases defined by the parent\n\n\
    +   * Functions defined by the parent\n\n+   * Variables defined by the parent\n\
    \n+   * Values of the parent's Korn shell reserved variables\n\n+   * Values of\
    \ the parent's option settings\n\n# Korn Shell Variables\n\nVariables perform\
    \ an important role in defining the Korn shell environment. There are two types\
    \ of variables.\n\n+   * Reserved variables\n\n+   * User-defined variables\n\n\
    The Korn shell has many reserved variables, which fall into two classes; variables\
    \ which values the Korn shell:\n\n+   * Sets and updates\n\n+   * **Does** automatically\
    \ set\n\nThe following table lists Korn shell variables that are set and updated\
    \ by the Korn shell.\n\n**Table 7-2:** Variables Set and Updated by the Korn Shell\n\
    \n| Variable | Function |\n| --- | --- |\n| ERRNO | The error number of the most\
    \ recently failed system call |\n| LINENO | The current line number being executed\
    \ within a script or function |\n| OLDPWD | The previous working directory |\n\
    \ PID | The process identification number (PID) of the parent |\n| RANDOM | A\
    \ random integer between 0 and 32,767 |\n| SECONDS | The number of seconds since\
    \ the Korn shell was invoked |\n| $ | The PID of the current process |\n| ! |\
    \ The PID of the last process placed in the background |\n| ? | The exit status\
    \ of the most recent Korn shell statement, command, or user program; an error\
    \ status of zero (0) indicates success, and a nonzero error status indicates failure\
    \ |"
