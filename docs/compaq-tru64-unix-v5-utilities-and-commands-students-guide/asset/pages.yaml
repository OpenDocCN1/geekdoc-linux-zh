  md: '# Unit Overview


    # Introduction


    The UNIX operating system offers a choice of data transfer and conversion commands.
    You can save and restore individual files and directories as well as tree-structured
    file systems to and from disks and magnetic tapes.


    Device special files and device naming conventions allow you to identify specific
    devices when entering commands.


    The df and du commands provide detail about disk space usage. The tar, ltfm, dd,
    and mt commands are used for tape data transfer and conversion.


    The primary emphasis is on using the tar command to create backup tapes.


    # Objectives


    To save and restore disk files and file systems on magnetic tape, you should be
    able to:


    +   - Identify device types and names

    - Use the df and du commands to display free disk space

    - Use the Tape Archive utility


    # Resources


    For more information on the topics in this chapter, see the following:


    +   - Tru64 UNIX reference pages, du(1), df(1), tar(1) and tar(4)'
