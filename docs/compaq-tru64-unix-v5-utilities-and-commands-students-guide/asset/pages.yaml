  md: '# Unit Overview


    # Introduction


    The Common Desktop Environment is a new industry standard, user interface based
    on the X Window System. CDE allows you to start applications and select functions
    using the mouse or keyboard rather than typing long commands on a command line.


    Microsoft Windows and the Apple Macintosh are other graphical user interfaces
    that provide a windowing environment using icons, menus, and the mouse to interact
    with the system.


    This unit discusses how to invoke the desktop applications that you will find
    on your system using the CDE user interface.


    # Objectives


    To use desktop applications, you should be able to:


    +   - Use the Front Panel

    - Obtain help using the CDE and CLI user interface

    - Use the Text Editor to create and edit text files

    - Use Calendar to schedule appointments, make To Do lists, browse other calendars
    and schedule group appointments

    - Use the terminal emulator application to execute UNIX commands

    - Run applications from the CDE desktop


    # Resources


    For more information on the topics in this chapter, see the following:


    +   - Common Desktop Environment: User''s Guide, Chapters 3, 4 and 6

    - CDE Companion, Chapters 1 and 3'
  merge: -1
  pgno: 53
- img_proc: true
  md: '# Using the CDE Front Panel


    # Overview


    When you begin a CDE session, you see a virtual desktop consisting of a workspace
    and a Front Panel of controls. This section discusses the elements of the Front
    Panel, and describes how to customize the desktop to suit your needs.


    # Front Panel


    The Front Panel is a special window containing controls that:


    +   * Start up applications

    * Contain buttons for changing to other workspaces

    * Indicate system state

    * Are drop zones

    * Can contain subpanels


    The Front Panel:


    +   * Can be positioned anywhere on the desktop

    * Can be minimized

    * Belongs to all workspaces

    * Can be customized


    The Front Panel contains the main panel, including workspace switch, and subpanels.


    **Figure 2-1:** Front Panel


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_54_0.png)


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_54_1.png)'
  merge: -1
