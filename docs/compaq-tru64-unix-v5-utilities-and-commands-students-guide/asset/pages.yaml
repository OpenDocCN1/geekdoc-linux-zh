  md: 'Searching and Replacing


    # Searching and Replacing


    # emacs Search Operation


    Like any good editor, emacs provides search commands. In fact, there are three
    different search commands, as shown in this table.


    | Search Command | Function |

    | --- | --- |

    | Incremental search | As soon as you type a character, emacs starts searching
    for the next occurrence of that character. As you type more characters, it searches
    for combination of characters. |

    | Nonincremental or simple search | Provide emacs with a search string and it
    will find the next occurrence. The search terminates at the found string, or fails
    if the string is not found. |

    | Word search | Like a simple search, except that it only searches for full words
    and phrases. For example, if you are searching for the word mental, you do not
    have to worry about finding the word incremental. |


    emacs searches are, by default, not case sensitive. If you search for home, emacs
    will find Home, HOME, and hoMe.


    # Incremental Search


    To do an incremental search:


    +   1. Press Ctrl/S. emacs displays "I-search" in the minuffer.

    2. Type the first character to search for. emacs displays that character in the
    minuffer and moves to its first occurrence.

    3. Type the next characters in the string. emacs displays the characters and finds
    the first match.


    Notes:


    +   * Press Ctrl/S to search again forward.'
  merge: -1
  pgno: 529
