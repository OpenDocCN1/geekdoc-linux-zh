  md: '# # Getting Help


    # ## Overview


    CDE provides help:


    +   * With a context-sensitive Help key

    * In an application''s Help menu

    * Through the Help Manager

    * Through the Man Page Viewer


    With CLI, you can obtain help by issuing the `man` command.

    This section shows how to use each of these methods to obtain help.


    # ## Using the Help Key


    CDE provides context-sensitive help. Press the Help key (or function key **F1**)
    and the application you are using displays the most appropriate topic related
    to the window, button or dialog box highlighted. The Help key is a shortcut for
    selecting help on a menu or dialog box.


    # ## Using an Application''s Help Menu


    Most applications have a Help menu that contains:


    +   * An overview of help topics

    * Task instructions for most application operation

    * Reference summaries for windows, dialog boxes, menus and application resources

    * On-item help, which allows you to click an item and view a description of the
    item

    * Help on using Help windows

    * Help providing the version and copyright information for the application


    # ## Using the Help Manager


    Click the Front Panel Help Manager control to display online help.

    The Help Viewer window displays a topic tree. Click a topic to display the related
    help information. The Help Manager builds a history of where you have been. Choose
    the Backtrack button to return to a previous topic.


    The Help system displays help for the home topic or for a chosen topic. In this
    display, hypertext allows you to jump to the related help topic.'
  merge: -1
