  md: '# Korn Shell Command Line Editing


    # Overview


    The Korn shell offers the ability to edit commands on the command line. The command
    line editor also provides additional ways to recall commands and peruse the commands
    in the history file.


    This section discusses how to select a Korn shell command line editor and how
    to recall commands using the selected command line editors. As you execute other
    commands throughout the course, you can use the selected editor to edit or correct
    the commands.


    # Korn Shell Command Line Editor Selection


    The Korn shell built-in line editors are vi, emacs, and gmacs. All three editors
    are a subset of the vi and GNU emacs editors. They are a part of the Korn shell,
    and are therefore available even if the corresponding editor is not present on
    the system.


    Use one of the following commands to select a Korn shell command line editor.
    Commands are listed in order of priority, from lowest to highest.


    +   * set -o emacs (gmacs or vi)

    * EDITOR=emacs (gmacs or vi)

    * VISUAL=emacs (gmacs or vi)


    If you execute the following commands, the VISUAL variable would override the
    other two commands and emacs would be the command line editor used.


    Example 16-5: Setting the Command Line Editor


    ```

    $ set -o vi

    $ EDITOR=gmacs

    $ VISUAL=emacs

    ```


    You need to use one method of selecting your command line editor, and should place
    that command in your .profile file.


    # Editing Korn Shell Commands on the Command Line


    The Korn shell provides the capability to edit commands on the command line with
    the built-in editors gmacs, emacs, and vi. These editors are a subset of the GNU
    emacs and vi, and most of the editing commands are the same as their editor counterparts.


    The commands for command line editing are provided in Appendix C. The commands
    are separated into tables by function as follows:


    +   * Fetching commands from the history file'
