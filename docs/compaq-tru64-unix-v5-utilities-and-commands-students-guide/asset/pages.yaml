- img_proc: true
  md: '# Figure 13-3: Editing .dtprofile


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_348_0.png)


    Now Try This!


    To change your default printer to another printer on your system:


    +   1. Use the File Manager to select the /etc folder.

    2. Double-click the printcap icon.

    3. Select a printer to use as your default. Close the file.

    4. Use the File Manager to select your home folder.

    5. Open the .dtprofile file. Edit the value of the LPDEST environment variable
    to your new choice for the default printer.

    6. Save the changes.

    7. Log out, then log back to have the change take effect.


    Need Help?


    Double-clicking a text file opens it in the Text Editor you can view it or make
    changes.

    Pick a printer listed in the /etc/printcap file and add it to the .dtprofile file.


