  md: '# Performing Basic Editing


    # Reading and Writing Files


    You can read a file other than the one you are editing, insert a file into the
    buffer, or save a modified file.


    | Command Sequence | Function |

    | --- | --- |

    | Ctrl/X Ctrl/F find-file command | Finds and reads a file |

    | Ctrl/X i insert-file command | Inserts the file at the cursor |

