  md: '# Using Text Editor


    # Overview


    The Text Editor (dt_pad) on the Front Panel is a basic text editor which allows
    you to perform file creation and editing functions using both the keyboard and
    a mouse. Some of the editor features include:


    +   - Pull-down menus for edit and file operations

    - Simple formatting

    - Search and replace

    - Spelling checker

    - Status line showing cursor position by line number and the ability to position
    the cursor by line number

    - Automatic save of the editing session if the Text Editor abnormally terminates

    - Undo edit operation

    - Overstrike mode

    - Wrap-to-fit function


    This topic introduces the Text Editor and shows how to use some of its features.


    # Starting the Text Editor


    Click the Text Editor control on the Front Panel and it displays the Text Editor
    main window containing title, menu, scroll bars and an optional status line.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Figure 2-8: Text Editor''s Main Window


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_67_0.png)


    The title bar displays the name of the current document. If it is a new document,
    the title bar displays (UNTITLED).


    The menu bar provides editing functions on pull-down menus including file access,
    formatting and option changing functions.


    The text area is where you type the text of your document. This area is blank
    for a new document; if you read in an existing document, it is displayed here.


    At the bottom of the window, you can optionally display a status line which displays:


    +   - Line number containing the insertion point

    - Total number of lines in the document

    - Text editor messages

    - Overstrike indicator if the editor is in Overstrike mode


    # Entering Text


    When the Text Editor starts up, it provides you with a new document, UNTITLED,
    with the insert cursor positioned at the top of the window waiting for you to
    input text. The insert cursor, shaped like an I, always shows the current position
    for entering text. The status line indicates the line number in the file.'
  merge: -1
