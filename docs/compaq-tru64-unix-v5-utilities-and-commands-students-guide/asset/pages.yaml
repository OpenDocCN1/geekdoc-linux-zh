    |8008005 R N+ 0 4566 4423 0.0 54 10 352K - pl 0:00:04 ps |

    ```


    # Making a Process Sleep


    The sleep command suspends process execution for a specified number of seconds.Use
    the sleep command to cause execution of a command after a certain amount of time
    or execute a command every so often.


    The format of the sleep command is:


    ```

    $ sleep seconds

    ```'
