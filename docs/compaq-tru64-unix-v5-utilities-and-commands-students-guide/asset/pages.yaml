  md: "# Introducing the Mail Utility (CLI)\n\n# Overview\n\nThe CLI mailx and Mail\
    \ commands let you:\n\n+   - Compose, edit and send messages\n- Receive and read\
    \ messages\n- Delete or store messages in a mailbox or in folders\n\n# Sending\
    \ Mail\n\nThe formats of the mailx and Mail commands are:\n\n```\nmailx [-dinVF]\
    \ [-h number] [-r address] [-s subject] user ...\nMail [-dinVF] [-h number] [-r\
    \ address] [-s subject] user ...\n```\n\nThe following mail session shows how\
    \ to send a message to three user systems: jar, kls, and sjg and a carbon copy\
    \ to ske.\n\n# Example 1-3: Sending Mail\n\n```\n$ mailx jar kls sjg\nSubject:\
    \ Book Modification <Return>\nWe need to get together sometime very soon to discuss\
    \ the modifications necessary if the book is going to be published.\nI sent a\
    \ copy to the publishers last week to see if they are at all interested, but obviously\
    \ we have to make a lot of changes to make it conform somewhat to industry standards.\
    \ How's Friday at 2 pm for a meeting:\n<Return>\n<Ctrl/D>\nCc: ske <Return>\n\
    $ \n```\n\n# Try This!\n\nTo send a message to yourself:\n\n+   1. At the system\
    \ prompt ($), enter: mailx username Return, using your username.\n2. Mail then\
    \ prompts with Subject:: Enter the subject of your message and press Return.\n\
    3. Mail is now waiting for you to enter your message. Enter the body of your message,\
    \ then press Return to move the cursor to the beginning of the line. Then press\
    \ Ctrl/D to end the message.\n4. If Mail prompts: Cc;, enter usernames (separated\
    \ with commas or spaces) to whom carbon copies/additional copies should be sent\
    \ and press Return."
