  md: "# # Identifying Devices\n\n# ## Overview\n\nThis topic introduces concepts\
    \ to help you manage disk, tape and CD-ROM devices.\n\n# ## Device Special Files\n\
    \nUNIX treats all devices (console, mouse, keyboard, disks, tape drives, printers,\
    \ terminals pseudotinals) as special files. The device special files are read\
    \ and written like ordinary files, except they activate the I/O device itself\
    \ and are generally located in the directory /dev.\n\nExamples of device special\
    \ files are shown in the table.\n\nTable 15-1: Device Special Files\n\n| File\
    \ | Description |\n|---|---|\n| /dev/tty1 | Terminal |\n| /dev/lp0 | Printer |\n\
    | /dev/disk/dsk3g | Third Disk found when the system was started, partition g,\
    \ block I/O |\n| /dev/rdisk/dsk3g | Third Disk found when the system was started,\
    \ partition g, character I/O |\n| /dev/tape/tape0_d0 | FirstTape unit found, highest\
    \ supported density |\n| /dev/rd0a | SCSI disk, logical unit 0, partition a |\n\
    | /dev/rdmt0h | Tape drive, logical unit 0, high density |\n\nDisk and tape drives\
    \ have two types of special device files.\n\n+   - Block\n    - Reads and writes\
    \ to the device one block of bytes at a time (usually 512 bytes)\n- Character\n\
    \    - Reads and writes to the device one character at a time"
