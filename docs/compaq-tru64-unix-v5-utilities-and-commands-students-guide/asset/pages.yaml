    # Recursive Edit


    While you are doing a query replace, you may see something else that needs fixing.
    Try and remember the change, or write it down, so you can go back and fix it later.
    When you finish the query replace, if you did not make a note, many times you
    will not remember what else you were going to fix.


    With the emacs query recursive edit option, you do not have to wait. You can fix
    the problem right away and not have to remember it later.


    Type Ctrl/R to start a recursive edit, then use the normal emacs commands to move
    the cursor and make changes. When the changes are complete, use Esc Ctrl/C or
    Ctrl/] exit recursive edit and return to the query replace, or exit both. If you
    resume the query replace, emacs puts the cursor right back where it was when you
    started the recursive edit.


    While the recursive edit option is active, brackets are placed around the modes
    on the mode line, for example, [(Fundamental)].


    ```

    Ctrl/R      Enters recursive edit

    Esc Ctrl/C  Exits recursive edit

    Ctrl/ ]     Exits recursive edit and exits query replace

    ```'
