  md: '# Creating Files


    # Overview


    The UNIX operating system provides several ways to create files. One method is
    using an editor such as vi or emacs. Another method, to create short files, is
    the cat command. You can also create empty files with the touch command.


    # Using the touch Command


    The touch command can:


    +   * Create an empty file

    * Update the access time of a file

    * Update the modification time of a file


    The format for the touch command is:


    ```

    touch [-acfm] [-r reference_file | -t time] file

    ```


    The options are described in the following table.


    Table 6-1: touch Options

    | Option | Function |

    |---|---||

    | touch (no option) | Updates the access and modification times to the time specified,
    or the present time |

    | touch -a | Changes only the access time |

    | touch -c | Prevents the creation of the file |

    | touch -f | Attempts to force file access in spite of file permissions |

    | touch -m | Changes only the modification time |

    | touch -r | Changes the modification time to that of the reference file |

    | touch -t | Changes the modification time to the specified time in the format:
    [[CC]YY]MMDDhhmm[.SS] |


    The following examples demonstrate how to use the touch command.


    ```

    $ touch poker.c

    ```


    Updates the access and modification time of the file poker.c to the current date
    and time.


    ```

    $ touch -m -c poker.c

    ```


    Updates the modification time of poker.c to the current date and time. If the
    file does not exist, do not create it.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Creating Files


    ```

    $ touch -a -t 07070707 poker.c

    ```


    Sets the access date of poker.c to July 7, 7:07 AM of the current year.


    ```

    $ touch empty

    ```


    Creates an empty file named empty.


    # Using the cat Command


    In addition to using the cat command to view the contents of files, you can also
    use it to:


    +   - Create files

    - Add lines to files

    - Combine files by appending the contents of one file to another


    # Using cat to Create a File


    The format of the cat command to create a file is:


    ```

    cat > filename

    ```


    The > symbol indicates that the output of the command should be placed in the
    file following the > symbol.


    The following example shows how to create a file called homephones using the cat
    command.


    ```

    $ cat > homephones

    Susan 432-7215

    John 226-1945

    Mary 321-1776

    <Ctrl/D>

    ```


    > ① Redirect the output of the cat command to the new file homephones.


    > ② Enter the text of the file. Press Return at the end of each line. Simple typing
    mistakes can be corrected using the erase key. However, you cannot move the cursor
    to a previous line to correct a typing error.


    > ③ On a blank line, press Ctrl/D to save the text and close the file.


    You can now view the contents of the file at any time by entering the following
    command:


    ```

    $ cat homephones

    ```


    # Now This!


    In your home directory, create a file called homephones that includes names and
    phone numbers.'
