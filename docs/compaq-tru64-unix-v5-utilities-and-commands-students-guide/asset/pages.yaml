  md: '# Copying, Moving, and Saving Text


    # Setting Options


    Two types of options can be changed using the :set command.


    +   - Toggle options, which are either on or off


    :set option (on) and :set nooption (off)


    For example, to ignore the case of the words during a search, type:set ignorecase.


    To match the case of the words during a search, type:set noignorecase.


    - Options that take a numeric or string value


    :set option=value


    For example, to automatically insert a carriage return 10 columns from the right
    margin, type :set wramargin=10.


    It may be tedious having to customize vi each time a file is edited. You can add
    these options to a file named .exrc in your home directory. When using an .exrc
    file to customize vi, leave off the colon (.). The commands are executed by ex
    before it enters vi.'
