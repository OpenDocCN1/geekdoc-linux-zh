  md: '# Changing Ownership and Permissions


    # Overview


    File permissions allow you to restrict access to files or folders. Three groups
    of users can access files and folders: owner, group, and other. File access is
    divided into three types of permissions: read, write, and execute.


    # Viewing Permissions


    The folder icon represents the different types of access permissions. If you do
    not have permission to write inside a folder, the folder will look like the next
    figure.


    **Figure 5-14:** Folder without Write Access


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_155_0.png)


    If you do not read or execute permission for a folder, the folder will look like
    the next figure.


    **Figure 5-15:** Folder without Read and Execute Access


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_155_1.png)


    If you have read, write, and execute permission for a folder, the folder will
    look like the next figure.


    **Figure 5-16:** Folder with Read, Write, and Execute Access


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_155_2.png)


    Select a file or folder and choose Change Permissions from the Selected menu.
    The Permission dialog box opens. The Permissions section lists the types of access
    in the left column and the types of access permissions in the top row. Cross reference
    the access types and access permissions to determine the permissions of a file
    or folder.'
  merge: -1
