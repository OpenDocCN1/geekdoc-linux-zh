  md: '# Moving the Cursor


    # Overview


    When you start to edit a file with vi, you are in command mode. You must be in
    command mode to use the cursor positioning commands.


    The arrow keys are the easiest way to move the cursor when you first start using
    vi. Fast typists may find the h, j, k, and l keys easier to use than the arrow
    keys.


    This section introduces a few of the many cursor movement commands in vi.


    # Moving the Cursor as a Character or Line


    There are a number of commands to move the cursor near the line you are currently
    editing.


    Table 8-3: Moving the Cursor a Character or Line


    | To Move the Cursor | Use |

    |---|---|

    | One character to the left | h, Ctrl/H, or left arrow |

    | Down one line | j, Ctrl/N, or down arrow |

    | Up one line | k, Ctrl/P, or up arrow |

    | One character to the right | l, space, or right arrow |


    Note that the vi editor is sensitive to the use of uppercase and lowercase for
    the same letter causes different results.


    # Repeating Cursor Movement


    You can prefix vi commands with the number of times you want the command to execute.


    For example, press the k key to move the cursor up one line. Type 6k to move the
    cursor up 6 lines.


    This works only if there are six existing lines above the present cursor position.


    # Moving the Cursor Within a Screen


    There are a number of commands to navigate within a screen.


    Table 8-4: Moving the Cursor Within a Screen


    | To Move the Cursor | Use |

    |---|---|

    | To the beginning of the current line | 0 |

    | To the end of the current line | $ |

    | To the beginning of the next word | w |'
