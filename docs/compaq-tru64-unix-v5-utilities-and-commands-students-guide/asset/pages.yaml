    # Using the CLI man Command


    When you are working in a terminal window using the command line interface, you
    have access to the standard reference pages through the use of the man command.


    # Organization of Reference Pages


    The reference pages are organized into sections according to function, as shown
    in the following table.


    # Table 2-6: The man Reference Pages


    | Section | Topic |

    | --- | --- |

    | man (1) | Commands that can be entered by all users |

    | man (2) | Operating system program interfaces |

    | man (3) | Subroutines |

    | man (4) | Include files, program files, and some system files |

    | man (5) | Miscellaneous topics, such as text-processing macro packages |

    | man (7) | Device special files, related driver functions, and networking support
    |

    | man (8) | System maintenance and operation |


    Note: there is no man(6) section, which is games on some UNIX systems. Therefore
    cat(1) means the cat command is documented in section 1. Some UNIX words are documented
    in more than one section; you might need to specify the section number.'
  merge: -1
