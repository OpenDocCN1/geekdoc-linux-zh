  md: '# Summary


    # Changing Directories


    Because the UNIX file structure is hierarchical, all files or directories are
    accessed by tracing a path through a chain of directories until the desired one
    is reached.


    To understand how to use the `cd` command, you must first understand the concepts
    of home and working directories and pathnames.


    The home directory is usually identified by a pathname that includes the user
    name as its last component. Your home directory never changes.


    Your working directory is defined as your current location in the directory tree.


    # Listing Files


    The system keeps track of the names of all your files. You can see a list of the
    names of all files in a directory using the `ls` command.


    # Finding Files


    There are times when you need to locate files on the system, but you do not know
    all of the information necessary to locate them. The `whereis` and `find` commands
    are useful for these situations.


    # Viewing Files


    UNIX provides many ways to display file contents on your terminal screen. Commands
    that provide this functionality are:


    | cat | Text of files scrolls by |

    | more | File displays one page at a time |

    | head | First 10 lines of file are displayed on the screen |

    | tail | Last 10 lines of file are displayed on the screen |


    # Creating Files


    The `cat` command to create a file by redirecting the output with the `>` or `>>`
    symbols.


    The `touch` command creates an empty file.


    # Creating Directories


    After you use a UNIX operating system for awhile, your home directory may become
    cluttered. When you list your files, they fill the screen. The logical solution
    is to organize your files into directories.


    The command for creating a directory is: `mkdir filename`.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Summary


    # Changing Permissions


    File permissions allow you to restrict access to files or folders. Three groups
    of users can access files and folders: user, group, and other. File access is
    divided into three types of permissions: read, write, and execute.


    Use the chmod command to change file permissions.


    # Moving and Renaming Files


    Use the mv command to move or rename a file. If the destination name is a directory,
    the file is moved; otherwise the file is renamed.


    # Copying Files


    You may on occasion to make a copy of a file rather than rename it. Always make
    a backup copy of a file before you make any major revisions to it.


    The cp (copy) command performs this function.


    # Removing Files and Directories (CLI)


    Use the rm command to remove files. Use the rm -r command to remove a directory
    and all its contents. Use the rdir command to remove an empty directory.


    # Linking Files


    Use the ln command to create a hard link:


    +   - Indistinguishable from the original entry

    - Cannot span file systems

    - Cannot refer to directories


    Use the ln -s command to create a symbolic (soft) link:


    +   - Can be made to a directory

    - Can be made across file systems

    - Delete a file which has an existing symbolic link, and there is no way to access
    the file through the link'
  merge: -1
