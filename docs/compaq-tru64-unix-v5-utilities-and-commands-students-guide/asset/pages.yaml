    Your /etc/passwd entry is changed, and the next time you log in, your default
    shell will be the C Shell.


    # Temporarily Changing Your Login Shell


    To temporarily change your shell (start a subshell), enter the pathname of the
    requested shell. For example, to temporarily change shells from the Korn shell
    to the C shell, enter the command shown in the example.


    # Example 7-3: Changing Shells Temporarily


    ```

    $ /bin/csh

    %

