  md: '# Foreground Jobs


    When you execute a shell command or shell script, the command or script by default
    runs in the foreground. When that command finishes execution, you can execute
    another command.


    When a job runs in the **foreground**, the shell cannot accept any further input
    until the job finishes. In other words, you cannot type other commands to the
    shell while you wait for the job to finish.


    # Background Jobs


    To allow more than one job to run at a time, jobs can run in the **background**.
    A background job does not have direct control of terminal input and output. Processing
    the job does not tie up your communication with the shell.


    This method of running jobs is useful when the job:


    +   - Is time consuming (spreadsheet calculations, complex mathematical calculations)


    +   - Does not require interactive input (sorts, compilations)


    To process a job in the background, append an ampersand (&) to a shell command:
    `command &`


    Jobs that run in the background need to have their input (if any) and output (if
    any) redirected **from** or **to** a **file**. This precludes any confusion with
    an application running interactively at the same time.


    This example shows two commands executing in the background:


    # Example 10-3: Running Jobs in the Background


    ```

    $ ls -al /usr | grep ^ user-directories &

    [1] 1768

    $ find -name emacs -print | find-emacs &

    [2] 1765

    [1] - Done ls -al /usr | grep ^ user-directories &

    ```


    # Now Try This!


    To run a job in the background that performs a listing of the /etc directory:


    +   1. Enter the following command:


    ```

    $ ls -l /etc > etc_dir.txt &

    ```'
