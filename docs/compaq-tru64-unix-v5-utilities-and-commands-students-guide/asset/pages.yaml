  md: '# Editing with vi


    # Overview This lesson discusses the vi modes of operation as well as how to start
    and end an editing session.


    # Setting Up Your Terminal


    If you are using a remote Tru64 UNIX system from a remote host, set up your workstation
    window or terminal for VT100 mode. Otherwise, when you press the Escape (Esc)
    key to return to command mode, the case of the last letter typed may be changed
    (uppercase to lowercase or vice versa).


    For example, a DECterm window, you choose General... from the Options Menu, and
    choose VT100 mode.


    Some keyboards do not contain a labeled Esc (Escape) key. Alternate keystrokes
    that may work on your system include:


    +   - Press the F11 key

    - In a DeCTerm window, pull down the Options menu and choose Keyboard. Then choose
    "F11 sends Escape".

    - Press Ctrl/[


    # Editing Modes


    The editor has three operational modes:


    +   - Command mode

    The default mode entered upon editing a file with vi. Used to move the cursor,
    and delete or change text.

    Entered from text input mode by pressing Esc. Entered from last line mode by pressing
    Return. Pressing Esc in command mode cancels a partial subcommand. Pressing the
    interrupt key (usually Ctrl/C) will also cancel a partial subcommand.

    - Text input mode

    Entered from command mode by typing the letters a, A, c, C, i, I, O, R, s or S.
    After entering one of these commands, you can enter text into the buffer at the
    current cursor position.

    - Last line mode

    Entered from command mode by typing colon (:), slash (/), question mark (?), or
    exclamation marks (!).

    A prompt appears on a line at the bottom of the screen. Type a command and press
    the Return key.'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'The relationship between the three operational modes is shown in greater detail
    in this figure.


    # **Figure 8-1:** vi Modes


    | TEXT-INPUT MODE | COMMAND MODE (default) | LAST LINE MODE |

    | --- | --- | --- |

    | append, change, insert, open, replace, or substitute | delete text, move cursor,
    move text, or undo commands | :, ?, !! | edit another file, execute command, execute
    a shell command, quit, read file into buffer, run login shell, or write to file
    |

    | | Esc | Return | x, wg, q!


    If you are not sure what mode you are in, press the Esc key and you will hear
    a beep, which means you have returned to command mode.


    # Starting vi


    You can start the vi editor using the name of an existing file to edit or a new
    file you want to create, or without a file name.


    The format of the vi command is:


    ```

    `vi [options] [filename]`

    ```


    If you start with the -R option, the file is opened in read-only mode. You can
    use the view command to accomplish the same thing.


    If the name is an existing file, the first lines of the file are displayed on
    the screen. If the number of lines is not enough to fill the screen, all lines
    that do not contain characters have a tilde (~) in the first column. The last
    line shows the name of the file and number of lines and characters in the file.


    # Editing an Existing File


    This example shows how to edit the vegetables in the current directory.


    # **Example 8-1:** Starting vi with an Existing File


    +   * $ vi vegetables

    - carrots

    - peas

    - cauliflower

    - broccoli

    - beans'
