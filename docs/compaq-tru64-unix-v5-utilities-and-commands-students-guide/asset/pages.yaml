  md: '# Using the Command


    Use the crontab command to place jobs in the queue for the cron daemon to process.
    The crontab command takes as input, a file that contains information about the
    commands and when you want to execute them.


    The crontab [file] has the format:


    ```

    crontab [file]

    crontab -l | -v

    crontab -r

    ```


    # Command Options


    The crontab command options are shown in the table.


    Table 10-7: Some crontab Command Options


    | Option | Function |

    | 1 | Displays the contents of your crontab file |

    | e | Edits a copy of your crontab; invokes the editor specified by the EDITOR
    environment variable or uses vi by default. |

    | r | Removes the crontab file from the crontab directory |

    | v | Verbose mode: displays the name of your crontab file and the date and time
    when you submitted it with crontab |


    The following are some crontab command examples.


    Example 10-17: Using the crontab Command


    ```

    $ crontab -l

    $ crontab * * 1 1-5 echo "I was cronned"

    $ crontab -v

    crontab file: your submission time: Fri Jan 02 13:00:29 1998

    ```


    # Creating a crontab File


    Each user can have one crontab file active at a time. The crontab file may contain
    more than one entry. Each line in the file consists of six fields separated by
    spaces or tabs.


    This example shows the format of a crontab file.


    Example 10-18: A crontab File Entry


    ```

    0 20 * * 1-5 /usr/adm/cleanup

    |   |   |   |   |

    |   |   |   |   | |-----------------------

    |   |   |   |   | Command to be executed

    |   |   |   | | Day of the week (0 - 6 with 0 = Sunday)

    |   |   |   | |

    |   |   | | Day of the month (1-31)

    ```'
