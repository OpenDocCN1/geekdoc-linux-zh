  md: 'Setting Up a Terminal


    # Setting Up a Terminal


    # Overview


    When you log in to a UNIX system, you can determine which keys are automatically
    set to default functions. You can use these keys at either the command level or
    at the system prompt.


    # Displaying Keyboard Settings


    Use the stty everything command to determine terminal settings. Along with keyboard
    settings, the stty (set TTY) command displays the speed of the terminal and settings
    that affect your screen. On a Tru64 UNIX system, you can also use stty -a.


    Example 3-1: Using the stty everything Command


    ```

    $ everything

    # 2 disc;speed 9600 24 rows; 80 columns

    erase = ^?; werase = ^W; kill = ^U; intr = ^C; quit = ^?; susp = ^Z

    dusp = ^Y; eof = ^D; olc <>; eol2 <>;stop = ^Q

    next = ^V; output = ^R; status <>; time = 0

    min = 1

    -parenb -parodd csstob hupcl cread -clocal

    -ignprk brnik -ignpar -parmek inpck -intfl -lncr icrnrl

    lucxon ixlon - maxaxel

    isig ican -xacho echo echok echon -noflish -mdmbur -nofahn

    tostop echocht echport echo -alterwise ixten -nokerniffo

    opost -oluc onclr -ocrnl -oniret -ofill -ofdel tabs -oneoot

    ```


    The caret (^) indicates a control key. For example Ctrl/? is used to erase the
    previous character. These default keyboard settings may be helpful in modifying
    information entered at the keyboard.


    # Table 3-2: Selected Keyboard Settings


    | Command Key Function |

    | erase Backspace or Ctrl/? | Backs up one space and removes a single character
    time it is pressed |

    | kill Ctrl/U | Erases the current command line, discarding the command |

    | intr Ctrl/C | Stops a command that is currently executing; if the line you are
    typing a line and press the system ignores it you were returning to the prompt
    |

    | stop Ctrl/S | Suspends output (stops scrolling) |

    | start Ctrl/Q | Resumes output (starts scrolling) |

    | eof Ctrl/D | Designates an end of file |

    | susp Ctrl/Z | Suspends the current process and returns control to the parent
    process |


    3-1 Customizing Your Workspace'
  merge: -1
  pgno: 113
- img_proc: true
