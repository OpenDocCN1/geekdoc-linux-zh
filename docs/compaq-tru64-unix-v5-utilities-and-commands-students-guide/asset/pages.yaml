- img_proc: true
  md: '# Summary


    # Accessing Remote Systems


    | Table 12-6: Remote Access Commands |

    | Command | Function |

    | --- | --- |

    | login | Logs in to a remote system |

    | rsh | Enters commands on a remote system |

    | rcp | Copies files between systems without having to log in |

    | ftp | Transfers files from one system to another using the File Transfer Protocol
    |

    | telnet | Connects to a remote system using the TELNET protocol |


    # Invoking Remote Motif Applications


    To invoke a Motif application on another system and display it on your system:


    +   - Network security must be set up to allow you to access the remote system,
    and to display on your system.

    - You must specify that the display will be on your system by giving the -display
    parameter to the application, or by setting the DISPLAY environment variable.

    - You can either login to the remote system and invoke the application, or use
    rsh to invoke the application.'
  merge: -1
