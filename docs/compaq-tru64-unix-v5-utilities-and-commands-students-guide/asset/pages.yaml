  md: "# Using the awk Utility\n\n# Overview\n\nThe awk utility is a report generator\
    \ that processes ASCII text files and generates reports involving selective retrieval\
    \ and string manipulation. It is one of the most flexible methods of manipulating\
    \ text and retrieving specific information from files. Once the information is\
    \ retrieved, awk can print it, alter it, reformat it, or ignore it.\n\nThe awk\
    \ utility is primarily used to generate tables and reports from files of raw data.\
    \ The awk program is one of the most powerful filters. The awk utility works by\
    \ searching files for patterns and performing specified actions on the lines found\
    \ by the search. It has many applications including:\n\n+   * Generating reports\n\
    * Creating mailing lists\n* Database queries\n* Writing tables to awk\n\n# Introduction\
    \ to awk Terminology\n\n**A record** refers to a line of input. The different\
    \ parts of a record are called **fields**.\n\n+   * Fields are separated by a\
    \ field separator, which, by default, is a space.\n* In awk, fields are numbered\
    \ differently than the way they are numbered in sort.\n    * Numbering begins\
    \ with 1 for the first field in the record, 2 for the second field, up to n for\
    \ the nth field.\n    * Field 0 refers to the entire record.\n    * The notation\
    \ to refer to the fifth field in a record is $5.\n\nThe following figure shows\
    \ the way fields are numbered in awk.\n\n**Figure 9-1:** awk Field Numbering Conventions\n\
    \n![](img/8295751df7a37c5d3eb4d16a30f79f7b_269_0.png)"
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Using the awk Program Structure


    The awk programs are defined in terms of patterns and actions. The format of an
    awk program is:


    ```

    <pattern_1> {action_1> <pattern_2> {action_2> <pattern_n> {action_n}>

    ```


    # Using awk


    There are two ways to use the awk utility, from the command line, or through a
    program.


    You can invoke awk on the command line, as shown in the following example.


    **Example 9-13:** Invoking awk from the Command Line


    ```

    $ cat names

    Donna Davies

    Peter Parker

    Paul Baker

    $ awk ''print $2, $1'' names

    Davies Donna

    Peter Parker

    Paul Baker

    ```


    Alternatively, you can create an awk program and run awk with the -f option. Use
    this method for more complex commands and reports. The following example uses
    the /etc/passwd file. The result may vary from system to system.


    **Example 9-14:** Using an awk Program


    ```

    $ cat list.awk

    {

    FS = ":"

    OFS = "<TAB"

    print $1, $5

    <Ctrl/D>

    ```


    ```

    $ awk -f list.awk /etc/passwd | tail -5

    dan David Nolan

    seg Susan Greenburg

    mw

    Marcy Williams

    eap

    Eric Patterson

    dbs

    Diana Sanchez

    $

    ```'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Using the awk Utility


    # Expressions and Variables


    The following table shows some of the expressions used in writing awk programs.
    These expressions are really predefined variables that can be changed to a new
    value within an awk program.


    Table 9-5: awk Program Expressions

    | Expression | Significance |

    | --- | --- |

    | BEGIN <action> | <action> will be performed once, before any other <action>
    in the program, and after all input is processed |

    | END <action> | Causes <action> to be performed after other <action>s in the
    program, and after all input has been processed |

    | NR | Number of records that have been read at the time of evaluation |

    | NF | Number of fields in the current record |

    | FS | Input field separator |

    | OFS | Output field separator |


    # Comparison Operators


    The symbols shown in the following table are used by awk to evaluate and compare
    expressions. They are the same symbols used in the C programming language.


    Table 9-6: Comparison Operators for awk

    | Symbol | Definition |

    | --- | --- |

    | == | Is equal to |

    | != | Is not equal to |

    | > | Is greater than |

    | < | Is less than |

    | >= | Is greater or equal to |

    | <= | Is less or equal to |


    # Using Logical Operators with awk


    Logical operators are Boolean statements that contain two or more expressions.


    +   - AND (&&) Both condition 1 AND condition 2 are true

    - OR (||) Either condition 1 OR condition 2 is true


    The phones file shows the use of logical operators with awk.'
