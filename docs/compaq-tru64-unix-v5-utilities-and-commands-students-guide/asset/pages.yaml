  md: '# Controlling and Managing Jobs


    | Table 10-3: Tru64 UNIX kill Signals (Continued) |

    | 4-ILL | 10-BUS | 16-URG | 22-TTOU | 28-WINCH |

    | 5-TRAP | 11-SEGV | 17-STOP | 23-POLL | 29-PWR |

    | 6-LOST | 12-SYS | 18-TSTP | 24-XCPU | 30-USRI |


    Specify the signal with either a name or number. The default kill signal is TERM,
    which terminates any process that does not ignore or catch the signal.


    This example shows how to use the kill command.


    # Example 10-10: Using the kill Command


    ```

    $ kill %4

    $ kill -QUIT %1

    $ kill -9 10652

    ```


    +   Sends the default signal (TERM) to job 4. This signal terminates a process
    that does not ignore or catch the signal.


    +   Sends the QUIT signal to job 1.


    +   Sends the KILL signal to job with PID 10652. This is the sure kill, and often
    terminates the process even if TERM does not terminate.


    # Process Priority


    The operating system assigns each process a priority. This priority schedules
    processes and may affect how it takes for a job to complete. The actual values
    are system dependent.


    The UNIX operating system provides the nice command, which allows you to run a
    command at a lower priority. The nice priority value:


    +   Controls how fast your process executes

    Ranges from -20 (highest priority) to 19 (lowest priority)

    Default is 10


    The superuser can use the highest priorities (negative numbers).


    The operating system maps the nice value to an appropriate priority on that system.


    The format of the nice command is:


    ```

    nice [-n priority] command [argument ...]

    ```


    In this example, the script file find.ksh is run in the background with a decreased
    priority.'
