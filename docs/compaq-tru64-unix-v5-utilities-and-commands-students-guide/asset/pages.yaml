  md: '# Introducing the Tru64 UNIX Operating System


    # Overview


    The Tru64 UNIX operating system is a multiuser, interactive, general-purpose operating
    system. It allows you to run more than one program at a time performing other
    tasks simultaneously.


    # Creators of UNIX


    +   UNIX was created in 1969 by Ken Thompson at Bell Laboratories, originally
    written in PDP-7 assembly language.


    +   Thompson was joined by Dennis Ritchie, developer of the "C" programming language.
    Thompson and Ritchie rewrote UNIX in C.


    +   UNIX was one of the operating systems written in a high-level language.


    # UNIX Evolution


    The following illustration shows the evolution of UNIX since 1969.


    Figure 1-1: UNIX Evolution


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_36_0.png)'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Introducing the Tru64 UNIX Operating System


    # A Standard UNIX


    The Tru64 UNIX operating system is a 64-bit advanced kernel architecture. It is
    based on Carnegie-Mello University''s Mach V2.5 kernel design with components
    from Berkeley Software Distribution (BSD) 4.3 and 4.4, UNIX System V, and other
    sources. Tru64 UNIX is Compag Computer Corporation''s implementation of the Open
    Software Distribution OSF/R1.0, R1.1, and R1.2 technology, and the Motif graphical
    user interface and programming environment. The full features of the X Window
    System, Version 11, Release 6 (X11R6) from the X Consortium Inc. are fully supported.
    Selected features of Release 6.1 (X11R6.1) are also supported.


    Tru64 UNIX complies with numerous other standards and industry specifications,
    including the X/Open XPG4 and XTI, POSIX, FIPS, and System V Interface (SVID).
    The Tru64 UNIX operating system is compatible with the Berkeley 4.3 and System
    V programming interfaces. Tru64 UNIX conforms with the OSF Application Environment
    Specification (AES) which specifies an interface for developing portable applications
    that will run on a variety of hardware platforms. For more information, see the
    Tru64 UNIX Operating System Product Description.


    # Description


    The Tru64 UNIX operating system is a multiuser/multitasking, 64-bit, advanced
    kernel architecture. It supports symmetric multiprocessing (SMP), and a real-time
    user and programming environment. It provides a choice of user interfaces, including
    graphical and command line interfaces.


    Tru64 UNIX includes utilities and commands for:


    +   - Electronic mail and phone communication capabilities

    - File management, organization, and protection

    - Text processing

    - Searching files

    - Sorting and merging files

    - Programming tools

    - Record searching and reporting utilities


    The shell is the command interpreter for the system, the translator that communicates
    your requests to the system. The shell contains a full programming language used
    to write command procedures and prototype applications in the form of shell scripts.


    # Tru64 UNIX Features


    Tru64 UNIX provides symmetric multiprocessing (SMP), real-time support, and numerous
    features to help application programmers develop applications that use shared
    libraries, multithread support, and memory mapped files.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Introducing the Tru64 UNIX Operating System


    +   - Common Desktop Environment (CDE)

    Tru64 UNIX provides CDE graphical user interface, the new industry standard UNIX
    desktop.

    - Motif and X Window System

    The Motif and X Window System provides a programming environment with an extensive
    set of libraries and tools for use by application developers.

    - Programming environment

    Tru64 UNIX provides alternative programming environments and the programming environment
    features of both System V and BSD UNIX systems.

    - Real-time support

    Tru64 UNIX provides a real-time user and programming environment conforming to
    the POSIX 1003.1b-1993 standard for real-time.

    - File systems

    The Tru64 hierarchical file system architecture is based on OSF/1 Virtual File
    System (VFS) and supports a number of file systems:

    - POLYCENTER Advanced File System (AdvFS)

    - UNIX File System (UFS)

    - Network File System (NFS)

    - Memory File System (MFS)

    - ISO 9660 Compact Disk File System (CDFS)

    - File-on-Mount File System (FFM)

    - File Based Pipes

    - /proc File System

    - Internationalization and localization

    Tru64 UNIX provides an internationalization environment and tools as well as the
    localization features for developing and executing internationalized software
    without the need to reengineer the application.

    - System management

    Tru64 UNIX provides a suite of graphical configuration and administrative applications
    for managing Tru64 UNIX systems.

    - Security

    Tru64 UNIX exceeds the requirements of the C2 evaluation class of DoD 5200.28-STD
    “Trusted Computer System Evaluation Criteria” including extended passwords, audit
    and Access Control Lists (ACLs).'
  merge: -1
