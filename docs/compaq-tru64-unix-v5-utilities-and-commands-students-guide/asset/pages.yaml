    # File Transfer


    A second method of transferring files between systems is to use the ftp application.
    ftp:


    +   - Allows the transferring of files between hosts that use dissimilar file
    systems

    - Does not attempt to preserve file attributes that are specific to a particular
    file system

    - Does not allow recursive cooping of subdirectories


    Once you invoke the ftp application, you can enter other commands to accomplish
    tasks.


    The format of the ftp command is:


    ```

    ftp [options] [host]

    ```


    If you do not specify a host, ftp prompts for a command. Refer to ftp(1) for a
    list of options. Some ftp commands are shown in this table.


    # Table 12-4: Some ftp Commands


    | Command | Function |

    | open rsys | Connects to remote system rsys |

    | close | Closes the current connection |

    | get | Receives a file |

    | put | Sends a file |

    | ls | Lists contents of remote directory |

    | quit or Ctrl/D | Exits ftp |

    | ? or help | Displays list of ftp commands |


    Refer to ftp(1) for a complete list of commands.


    This example shows how to use the ftp command to log in to a remote system.'
