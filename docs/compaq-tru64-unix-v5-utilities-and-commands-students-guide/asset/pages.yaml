  md: "# Writing Simple Korn Shell Scripts\n\nThe output from executing the command\
    \ is as follows:\n\n```\n/usr/users/you\nbook misc time.status\n/usr/users/you/book\n\
    chap1 chap2 contents.dis intro.txt\n$\n```\n\n# Executing Korn Shell Scripts\n\
    \nThere are three ways to execute a Korn shell script:\n\n+   * Invoke a subshell:\n\
    \  $ ksh filename\n* Run the script in your current shell:\n  $ . filename\n*\
    \ Make the script executable, and invoke it as a command:\n  $ chmod +x filename\n\
    \  $ filename\n\nTo invoke a subshell, you must have read privileges set on the\
    \ file. Any shell specified on the first line of the script is ignored. The \"\
    dot filename\" method is a Korn shell built-in, and will not work with the C shell.\n\
    \n# Korn Shell Environment\n\nThe first line of a Korn shell script should contain\
    \ the #!/bin/ksh, both to inform the program reader, and to force execution of\
    \ the script in the Korn environment if no subshell is specified.\n\nYou can execute\
    \ Korn shell scripts in your current directory or in remote directories by specifying\
    \ the search path on the command line. Make sure that the correct path variable,\
    \ PATH, is set before you try to execute the script, since PATH contains the search\
    \ path for your command line.\n\nThe following example shows how to modify the\
    \ PATH variable to execute a Korn script that has been made executable.\n\n# Example\
    \ 17-2: Modifying PATH to Execute a Script\n\n```\n$ cd\n$ pwd\n/usr/users/you\n\
    $ intro-script.ksh\nksh: intro-script.ksh: not found\n$ print $PATH\n/usr/bin:/sbin/usr/sbin\n\
    $ PATH=$HOME:$PATH\n$ print $PATH\n```"
