  md: '# Naming Files and Directories


    # Naming Conventions


    The naming conventions for files and directories are the same. The name of a file
    or directory is its file name and is used to refer to the file in a command.


    File and directory names can include letters, numbers, periods (.), and underscores
    (_).


    A period in a file or directory name has no special meaning to the system, except
    when it is the first character. This makes the file hidden: it does not appear
    in ordinary directory listings. Many hidden files are reserved for system use.


    The allowable length is system dependent. Traditionally, it can contain up to
    255 characters for BSD systems, but only 14 characters for some SVID systems.


    # Acceptable File Names


    The following file names are acceptable.


    ```

    .login

    .profile

    junk_file

    file2

    FILE2

    compute_average.c

    compute_average.out

    letter.txt

    ```


    # Naming Guidelines


    Keep these guidelines in mind when naming files.


    +   - Avoid beginning your file or directory name with a period (.) unless you
    want it to be hidden.

    - Avoid characters with special programming or system meaning, such as those shown.


    +   - / Reserved for root directory

    - * Wildcard substitution

    - ? Single character substitution

    - [] Selective file name substitution

    - < Indicates than or redirect input

    - > Indicates greater than or redirect input

    - - Indicates options

    - $ Indicates argument substitution'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Naming Files and Directories


    +   - Turns off special meaning


    +   - Groups characters into a single argument


    +   - Performs command in background


    +   - History substitution


    +   - [space] Confusing in directory lists


    You can access files with special naming characters by escaping the special character
    with a backslash, or putting the entire name in quotes.


    +   - Do not use spaces or periods (.) and (...) alone for file or directory names;
    these are reserved for system files.


    +   - Upper and lowercase letters are distinct (HELLO, Hello, and hello are three
    different file or directory names). UNIX is case sensitive.


    +   - The UNIX operating system does not retain old versions of a file if it is
    updated, although some applications do. For example, the emacs editor saves the
    previous version of a modified file, using the file name with a tilde (~) appended
    to it.


    +   - You can use part of the file name as a file extension preceded by a period
    (.) to indicate the contents of the file.


    ```

    prog.c      Source code for a C language program

    prog.out     Executable file

    report.txt  Text file

    prog.dat     Data file

    ```'
  merge: -1
