- img_proc: true
  md: '# Setting Your Default Printer


    # Overview


    To set up your default printer, you need to:


    +   - Determine the available printers.


    +   - Set up the PRINTER environment variable.


    # Determining Available Printers


    Before you print any files, you must know what printers are available for your
    use. You can determine this by examining the printer description file. /etc/printcap.
    This is a partial of an /etc/printcap file.


    Example 14-1: Examining/etc/printcap


    ```

    $ /etc/printcap

    # LN03 in the office area

    lp0|1|0|officepr:

    :lp=

    :rms=sys01.zeko.dec.com:\n:rp=1:

    :sd=/usr/spool/lpd


    # LN03 in the last next to the line printer

    lp1|1|ansio|labpr:

    :lp=

    :rms=sys01.zeko.dec.com:\n:rp=2:

    :sd=/usr/spool/lpd1

    $

    ```


    Your system administrator maintains the /etc/printcap file and adds an entry for
    each local or remote printer available for use. An entry consists of several lines
    which describe a printer''s characteristics. The first noncommented line of each
    entry lists the printer''s name and its aliases separated by a vertical bar (|)
    and terminated with a colon (:).


    You may use any one of the names to reference the printer in a print command.
    In the previous example, lp0 is the name of one printer, lp, 0 and officepr are
    aliases for that printer.


    # PRINTER Environment Variable


    The next step in setting up your default printer is to initialize the PRINTER
    environment variable.


    If you are using the C shell, enter the following command at the system prompt:


    ```

    % setenv PRINTER printer_name

    ```'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# Setting Your Default Printer


    where printer_name is the name or alias of the printer you want to use.

    Or if you are using the Korn shell, enter:


    ```

    $ PRINTER=printer_name

    ```


    # LPDEST Environment Variable


    If you do not set the PRINTER environment variable, print commands the printer
    specified by the LPDEST environment variable. To determine the value of this variable,
    enter the following command:


    C shell:


    ```

    % setenv

    ```


    Korn shell:


    ```

    $ set

    ```


    # Now Try This!


    +   To set your default printer:

    1. Use the more command to display the contents of your /etc/printcap file.

    2. Choose a printer to use as your default printer.

    3. Use the appropriate shell to set the PRINTER environment variable to the printer
    you choose to be the default printer.


    # Need Help?


    Read the reference pages on lp(1), lpr(1), csh(1), and ksh93(1CDE)


    # Solution


    +   1. $ more /etc/printcap

    # Created on Mon Jan 27 22:48:40 EST 1997 by root

    2. turky|turky|lp|turky (PrintServer turky):

    :af=/var/admin/turky.acct:

    .

    .

    chi|chi|chi (PrintServer chi):

    :lp=/dev/null-chi:

    .

    3. $ PRINTER=turky'
  merge: -1
