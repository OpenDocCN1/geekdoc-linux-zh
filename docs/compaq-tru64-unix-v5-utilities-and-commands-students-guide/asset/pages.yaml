  md: '# Introducing the UNIX Shell


    # Tru64 UNIX Shell Features


    The following table summarizes the features of each Tru64 UNIX shell.


    **Table 7-1:** Tru64 UNIX Shell Features Summary


    | Feature | Bourne Shell | C Shell | Korn Shell | Function |

    | --- | --- | --- | --- | --- |

    | Shell programming | X | X | X | Provides a programming language with features
    such as looping and control statements |

    | Signal trapping | X | X | X | Traps interruptions and other signals sent by
    the operating system |

    | Restricted shell | X | | | Offers a controlled shell environment to limit user
    access |

    | Common aliases | | X | X | Allows the user to abbreviate shell commands |

    | Command history | | X | X | Stores executed shell commands in a command history
    buffer for display or রয়েছে |

    | File name completion | | X | X | Allows a portion of a name to be entered, and
    the shell completes the pathname or provides a list of choices |

    | Array | | X | X | Allows data to be grouped and manipulated by name |

    | Integer arithmetic | | X | X | Allows the shell to perform integer arithmetic
    functions |

    | Job control | | | X | Provides the ability to monitor background processes |n|
    Command line editing | | | X | Allows you to edit a command on the command line
    or a previously entered command on the command line or in a temporary buffer |


    # Determining Your Login Shell


    The /etc/passwd file contains, other things, the name of the shell to execute
    when you log in.


    To determine your login shell, enter the following command:


    ```

    more /etc/passwd

    ```


    Look for your account name. The entry after the last colon (:) is the pathname
    of the shell to execute. The pathnames for the three available shells are as follows:


    | | C shell |

    | --- | --- |

    | /bin/csh | |

    | /bin/sh | Bourne shell |

    | /bin/ksh | Korn shell |'
