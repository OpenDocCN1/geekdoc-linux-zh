  md: "# Summary\n\n# Identifying Devices\n\nUNIX treats all devices (console, mouse,\
    \ keyboard, disks, tape drives, printers, terminals pseudoterminals) as special\
    \ files. The device special files are read and written like ordinary files, except\
    \ they activate the I/O device itself and are generally located in the directory\
    \ /dev.\n\nDisk and tape drives have two types of special devices.\n\n+   - Block\n\
