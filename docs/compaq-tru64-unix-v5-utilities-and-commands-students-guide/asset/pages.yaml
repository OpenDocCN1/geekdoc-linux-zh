    default printer | None |

    | Print Manager | Starts Print | Prints file on default printer | None |


    # Help Control


    The Help control and its subpanel provide access to the CDE Help facility. This
    table shows the behavior of the Help subpanel controls.


    Table 2-5: Help Subpanel Control Behaviors


    | Name | Click Behavior | Drop Behavior | Indicator Behavior |

    | --- | --- | --- | --- |

