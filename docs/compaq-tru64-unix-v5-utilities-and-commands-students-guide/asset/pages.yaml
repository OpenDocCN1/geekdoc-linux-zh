  md: '# Using the Tape Archive Utility


    # Overview


    The tar utility is most commonly used to back up files from disk to tape, and
    then restore the files from the tape back to disk.


    # Tape Density


    Typical device special files for tape drives with their corresponding densities:


    +   - /dev/rmt01: drive 0, low density

    - /dev/rmt0m: drive 0, medium density


    /dev/rmt0h: drive 0, high density.For most reel-to-reel tape drives, the default
    density is 6250 bpi (high density). To select low density, 1600 bpi, the device
    special file for low density must be selected.


    +   - For TK50 cartridge drives, there is only one density - 6666 bpi, whether
    you select the device special file for high or low density.


    # Tape Archive Utility


    The tar (tape archive) utility saves and restores multiple files to from a magnetic
    tape. tar extracts files and directories from tapes originally made with tar.
    Users can record private copies of their files and directories using the tar command.


    The format for the tar command is:


    ```

    tar [key_option] [options] name ...

    ```


    name is either a file or directory. If name is a directory, tar recursively copies
    files and subdirectories in that directory.


    This table shows some commonly used tar options. One option must appear as the
    first command line argument. Additional options can be combined with the key option.


    Table 15-6: Commonly Used tar Options


    | Key Option | Additional Option | Function |

    |---|---|-|

    | c | | Creates a new tape archive |

    | r | | Adds files to the end of the tape |

    | t | | Lists names of files as they occur on the tape |

    | u | | Adds new or modified files to the tape |'
  merge: -1
  pgno: 386
- img_proc: true
