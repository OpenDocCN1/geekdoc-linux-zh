  md: 'Identifying Devices


    # Device Names (Prior to V5.0)


    Prior to Version 5.0, Tru64 UNIX systems used the device mnemonics listed in this
    table to name disk and tape devices.


    Table 15-2: Tru64 UNIX Tape, Disk, CD-ROM Device Mnemonics


    | Category | Mnemonic | Description |

    | --- | --- | --- |

    | Disks | rznn | SCSI disks (RZ22/RZ23/RZ24/RZ55/RZ56/RZ57/RZ58) |

    | CD-ROM | rznn | SCSI disks (RRD40) |

    | Tapes | iznn | SCSI tapes (TLZ04/TLZ05/TZ30/TZK50) |


    The format of a device name is:


    ```

    [r]device-mnemonic lun [attribute]

    ```


    The table details the device name elements.


    Table 15-3: Device Name Elements


    | Element | Description |

    | --- | --- |

    | r | Indicates a character special file; not used for block special files or
    tape devices |

    | device-mnemonic | Disks |

    | lun | CD-ROM |

    | attribute | Tapes |


    # Device Names (V5.0)


    Tru64 UNIX Version 5.0, introduces a new format for device names and new directory
    locations for the device special files. The new names remove all notion of device
    type and physical location from the device name. They now reflect the order in
    which the device is found during the installation process.


    The disk device name format is:


    ```

    deviceup

    ```


    where: device is disk or cdrom


    ```

    u is the device unit number

    ```


    ```

    p is the partition letter

    ```


    For the example, the device special file for the third disk found at installation
    might have the pathname:


    ```

    /dev/disk/dsk3g

    ```


    A character special file for this disk would have the following pathname:'
