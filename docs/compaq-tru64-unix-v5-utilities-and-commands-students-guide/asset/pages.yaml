  md: '# Using the Tape Archive Utility


    files appended are displayed on standard output.


    +   The cvf option creates the tar file, file.tar on a disk. It contains the files
    designated by file_name. As with tape creation, if file_name is dot (.) or asterisk
    (*), all files in the current directory and subdirectories are written to tape.
    If file_name is one file name or a list of files, only those files are written
    to tape.


    # Restore Operations


    This example uses tar to restore an archive to disk. The tar archive can be copied
    to other systems and extracted just if it were being read from a tape.


    # Example 15-4: Using tar for Disk-to-Disk Operations


    ```

    $ tar -tvf file.tar

    $ tar -xvf file.tar file_name

    $ tar -xv file_name

    $ compress file.tar

    $ uncompress file.tar.Z

    ```


    +   Displays a verbose list of files contained in the tar archive, file.tar.


    +   Extracts the files by file_name from the tar archive, file.tar. If file_name
    is not provided, the entire contents of the tape are extracted. If file_name matches
    a directory, the directory is recursively extracted.


    +   The xv option allows the extraction of files from the archive. If file_name
    is not provided, the entire contents of the tape is extracted. If file_name matches
    a directory whose contents were written onto the tape, this directory is recursively
    extracted.


    +   compress reduces the size of the tar archive. This is especially useful when
    tar archive must be copied over a network. The new archive has the same file name
    as the tape with .Z appended to the name (file.tar.Z).


    +   uncompress converts the compressed file to the uncompressed version after
    copying a compressed version of the file over a network. The created file has
    the same name without the .z (file.tar).


    # Now Try This!


    +   1. Mount a blank tape on a tape drive. Log in your login name. Choose a file
    in your home directory and write it to tape using the tar command. The c option
