  md: '# # Introducing the UNIX Editors


    # ##


    The table shows the standard editors available on most UNIX systems.


    Table 8-1: Standard UNIX Editors

    | Editor | Description |

    | --- | --- |

    | ed | Line editor that operates on one line at a time; ed is the only editor
    available in single user mode |

    | ex | Line editor similar to ed, but more powerful; provides a subset of the
    vi screen editor commands (vi editor can be invoked from ex) |

    | edit | Line editor designed for beginners users; a simplified version of ex
    |

    | sed | Stream line editor that modifies lines based on script commands from the
    command line or from script file |

    | vi | Full screen display editor based on the ex line editor; uses different
    operational modes and options that can be customized |

    | view | Read-only version of vi |

    | emacs | Powerful, extensible, screen editor which allows editing in multiple
    windows and has an extensive help facility; GNU emacs editor is available from
    the Free Software Foundation and the Tru64 UNIX Freeware CD-ROM


    The Common Desktop Environment (CDE) also includes a basic text editor with a
    graphical user interface. See the Text Editor icon on the Front Panel.'
  merge: -1
