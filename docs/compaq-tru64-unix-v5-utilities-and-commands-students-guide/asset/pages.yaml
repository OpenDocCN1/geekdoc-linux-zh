  md: 'Using Calendar


    Calendar can display the following views:


    | | | |

    |---|---||

    | Day | Shows one day''s appointments |

    | Week | Shows one week''s appointments |

    | Month | Shows one month''s appointments (abbreviated) |

    | Year | Does not show appointments |


