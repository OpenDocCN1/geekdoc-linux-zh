  md: '# Example 9-11: Finding Special Characters with grep


    ```

    $ grep ''\.\$\'' price.fruit

    oranges .59

    grapefruit 0.59

    cranberries 1.59

    ```


    # Finding Repeated Characters


    Use an asterisk (*) inside regular expressions to indicate that the character
    immediately preceding it may be any number of times, including zero.


    Using metacharacters to match repeating patterns is called closure. The following
    format specifies closure in regular expressions.


    ```

    $ grep character* filename

    ```


    where character is a:


    +   * Regular character

    * Character enclosed in square brackets

    * Arbitrary character (denoted by a period)

    * Literal character


    To print out items in the price.fruit file that start with the letters a through
    g whose prices are under one dollar, use the command shown in the.


    # Example 9-12: Specifying Repeating Characters with grep


    ```

    $ grep ''^[a-g].*[0]...$'' price.fruit

    apples .49

    grapefruit .59

    bananas .87

    ```


    The notation * means that any number of characters can be between the first part
    of the pattern ([a-g]) and the last part of the pattern ([ ] \......). Note the
    space following the zero in the brackets indicating that there is a zero or a
    space. If the space is missing, the results are different from those shown in
    example.


