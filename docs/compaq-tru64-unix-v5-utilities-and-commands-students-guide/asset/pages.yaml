  md: '# Specifying Arbitrary Characters


    It is also possible to use grep to match arbitrary patterns. With regular expressions,
    a period (.) matches any character in the ASCII set. Each period matches exactly
    one character. Consider the situations listed in the following table.


    Table 9-4: Matching Arbitrary Characters


    | To Find all Lines in a File that... | Use the Expression... | To Match... |

    | --- | --- | --- |

    | Are exactly 10 characters long | ^......$ '' | Who knows? telephones Red Blue
    John Smith |

    | Start with 4-character words beginning with the character R | ^R... '' | Rick
    says "hello" Ride ''em Cowboy\ Red Blue |

    | End with 6-character words | .......$ '' | Bring extra shoes Who knows Ride
    ''em Cowboy\ Red Blue |


    # Finding Special Characters


    Escaped metacharacters are known as literal characters. When a metacharacter is
    escaped, it is accepted literally and not given special meaning. You can escape
    (\) the metacharacters listed in the following table by placing them within single
    quotation marks in an expression.


    | Use this Format | To Search for this Literal Character |

    | --- | --- |

    | \[ | [ |

    | \ | ] |

    |\. | . |

    | \* | * |

    | \$ | $ |

    | \? | ? |

    | \/ | | |

    | \^ | ^ |

    | \\ | \ |


    For example, to find all items in the price.fruit file whose prices end in .59,
    use the following command.'
