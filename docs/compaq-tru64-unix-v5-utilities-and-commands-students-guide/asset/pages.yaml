- img_proc: true
  md: '# # Describing the UNIX Directory Structure


    # ## Overview


    In the file system, files and directories are grouped by function. Users can control
    their own files and directories. System managers control and manage system files
    and directories.


    # ## Hierarchical File System


    All information stored in the file system hierarchy stems from the **root directory**
    (/).


    +   - Directly under the root are the first-level directories.

    - Under the first-level directories are further levels of subdirectories.


    Think of the file system as the root structure of a tree. The **top level** is
    the root. All other directories and files branch from it a widening structure.
    This is called a **hierarchical file system**. All information is divided into
    logical groups. Therefore, the hierarchical file system provides a way to organize
    the vast amount of information stored in the computer.


    This figure shows a portion of a representative UNIX file system.


    **Figure 4-2: Hierarchical File System**


    | sbin | dev | etc | lost+found | usr | opt | tmp | var | vunix |

    |---|---|---|---|---|---|---|---|---|n| | | ccs | |bin | lib | sbin | shlib |
    opt | tmp |

    | | bin | include | users | opt | share | adm | spool |


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_126_0.png)


    # ## Determining the Directories


    Directory names do not require an extension and can be indistinguishable from
    file names.'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'Describing UNIX Directory Structure


    The CDE File Manager displays a directory as a folder icon.


    In command mode, you can use the `ls` command to display a detailed list of a
    directory. If the first character of the mode information is a **d**, the file
    is a directory. In this example, dogs and goats are directories.


    ```

    $ ls -l

    total 2

    -rw-r--r 1 grazie 1990 Nov 4 09:50 cleo

    drwxr-xr-x 2 gracie 512 Jul 21 09:54 dogs

    -rw-r--r 1 gracie 1992 Jul 11 08:50 ellie.txt

    drwxr-xr-x 2 gracie 512 Sep 28 09:54 goats

    -rw-r--r 1 gracie 1985 Sep 28 08:50 sally.txt

    -rw-r--r 1 gracie 1995 Oct 15 08:50 sarah.txt

    -rw-r--r 1 gracie 1977 Jul 4 09:50 jessie.txt

    -rw-r--r 1 gracie 1967 May 15 08:50 cookie.txt

    ```


    # Pathnames


    A file**s pathname** specifies the location of the file within the file system.
    A pathname consists of a sequence of directory names separated by slashes (/)
    that end with the file name.


    A **full** or **absolute** pathname starts from the root directory. The absolute
    pathname for the whales file (in the preceding figure) is /usr/users/jonah/whales.


    A **relative pathname** starts from the current directory; for example, jonah/whales.'
  merge: -1
