    # Extracting Files


    To extract files from tape archives:


    +   1. Load the tape containing your files on the tape drive. Ask your system
    manager for assistance if you are unfamiliar with the tape operating procedure.
    Make sure the tape is write-protected.

    2. Log in at the console terminal, using your login name.

    3. Use the cd command to change to the directory where you want to place files
    from the tape.

    4. Enter the tar x command to extract the file or files from the tape.

    5. After the tape stops, rewind and unload it.

    6. Use the ls command as a final check to verify that the file or files are in
    your directory.


    # Backup Operations


    This example uses tar to create and list files from Disk-to-Tape.


    Example 15-3: Using tar for Disk-to-Tape Operations


    ```

