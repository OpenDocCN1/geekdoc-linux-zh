  md: '# Search and Replace


    You may want to combine a search with a replace operation. For example, you may
    have problems when typing certain words, like "teh" instead of "the," or often
    misspell a word like "recieve" instead of "receive." emacs provides search and
    replace operations that allow you to make changes like this very quickly.


    emacs has two types of search and replace operations:


    +   - Simple search and replace: Replaces every occurrence

    - Query replace: Verifies each occurrence before replacing


    Search and replace, and query replace operate only in the forward direction.


    # Simple Search and Replace


    To replace every occurrence of one string with another, use the simple search
    and replace. The command format is:

    Esc X replace-string <Return> old-string <Return> new-string

    <Return>


    +   1. Press Esc X, type the replace-string command, and press Return. emacs displays
    "replace string:" in the minuffer.

    2. Type the string to find and press Return. emacs displays "with:" in the minuffer.

    3. Type the replacement string and press Return. emacs finds and replaces any
    occurrences, then says "Done" in the minuffer.


    Because search and replace works only in the forward direction, if you want to
    ensure you replace every occurrence in the file, move the cursor to the top of
    the file before executing the command.


    # Query Replace


    If you are not sure that you want to replace each and every occurrence, use replace
    Esc %. It lets you decide text replacement on a case-by-case basis.


    +   1. Press Esc %. emacs displays "Query replace:" in the minuffer.

    2. Type the string to find and press Return. emacs displays "with:" in the minuffer.

    3. Type the replacement string and press Return. emacs finds the next occurrence
    and waits for your response.


    | y or spacebar | Replaces old-string with new-string; searches for next occurrence
    of the string |

    | n or backspace | Does not replace; goes to next instance |

    | q or Return | Quits |'
  merge: -1
