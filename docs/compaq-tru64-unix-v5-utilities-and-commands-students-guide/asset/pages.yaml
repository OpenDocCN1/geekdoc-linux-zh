  md: '# Using Pipelines


    # Overview


    There are situations when you want to use the output from one command or program
    as input to another, thereby constructing a pipeline of commands. Normally the
    commands used in pipelines are commands that are filters.


    A pipeline has the same effect as:


    +   - Storing the output from one command or program in a temporary file

    - Using the temporary file as input for a second command or program

    - Removing the temporary file


    # Using the Pipeline Operator


    Use the vertical bar (|) symbol to pipe output from one program or command into
    another. The | operator allows you to combine several operations in a single command
    line, optimizing processor performance. The following example compares not and
    using pipelines to perform the following series of tasks.


    +   - Generate a file that contains a long listing of files in your current directory

    - Sort that list numerically according to the size of the files

    - Search the sorted list for all files that end in .txt


    # Not Using a Pipeline:


    ```

    $ ls -1 > all.1

    $ sort -o all.sort +4n all.sort

    $ grep ''|'' .txt$ all.sort

    -rw-r--r-- 1 users 178 Jan 18 11:21 vegetables.txt

    -rw-r--r-- 1 users 365 Jan 18 11:43 report2.txt

    -rw-r--r-- 1 users 2132 Jan 18 11:42 chap15.txt

    ```


    # Using a Pipeline:


    ```

    $ ls -1 | sort +4n | grep ''.txt$$

    -rw-r--r-- 1 users 178 Jan 18 11:21 vegetables.txt

    -rw-r--r-- 1 users 365 Jan 18 11:43 report2.txt

    -rw-r--r-- 1 users 2132 Jan 18 11:42 chap15.txt

    ```


    # Using the tee Command


    The tee command reads from standard input and writes the input to standard output
    and to a specified file name. The format of the tee command is:


    ```

    tee [-a] filename

    ```'
