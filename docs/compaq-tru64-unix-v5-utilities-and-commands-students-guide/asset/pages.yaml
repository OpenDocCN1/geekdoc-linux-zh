  md: '# Setting Your Default Printer


    # Overview


    Your system may have access to several printers and provide many printing options.
    You might have more than one type of printer (such as PostScript, PCL or plotter),
    which may be either directly connected to your system (local) or located somewhere
    on the network (remote). One printer is generally designated as your default printer.


    # Determining the Default Printer


    To determine your default printer, double-click the printer control on the Front
    Panel or the Default printer control in the Personal Printers subpanel. (See Figure
    13-1)


    Figure 13-1: Printer Control on Front Panel


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_346_0.png)


    Result: The Printer Jobs application starts up in another window showing information
    on your default printer.'
