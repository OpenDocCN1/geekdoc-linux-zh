  md: '# Obtaining User Information (CLI)


    # Overview


    The following CLI commands allow you to obtain user information.


    +   - who

    - users

    - finger


    # Finding Out Who is Logged In


    The who command shows you:


    +   - Who is logged in

    - Where users are logged in


    The who command has three forms am


    +   - who am i

    - Displays information only about the user logged in at the terminal where the
    command is entered. Use this command to determine your initial login


    ```

    $ who am i

    smith      pts/5      May 14 16:05      (:0:0)

    ```


    +   - whoami

    - Examines the system file /etc/passwd and then displays the current user''s login
    name based on file. Use this command to change your current user name. Remember
    to use who am i to determine who you really are.


    ```

    $ whoami

    smith

    $

    ```


    +   - who [options]

    - The who command examines the system file /var/adm/utmp to obtain user information.


    ```

    $who         console May 14 11:50

    smith      :0         May 14 11:50

    smith      pts/1      May 14 11:50

    smith      pts/2      May 14 14:56

    smith      pts/3      May 14 16:01

    $

    ```'
