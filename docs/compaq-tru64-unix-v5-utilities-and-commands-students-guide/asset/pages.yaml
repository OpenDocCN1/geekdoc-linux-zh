  md: '# # Changing Directories


    #  Overview


    Because the UNIX file structure is hierarchical, all files or directories are
    accessed by tracing a path through a chain of directories until the desired one
    is reached.


    To understand how to use the `cd` command, you must first understand the concepts
    of:


    +   * Home and working directories

    * Pathnames


    #  Home Directory


    The home directory is usually identified by a pathname that includes the user
    name as its last component. When you log in to your account on a UNIX operating
    system, you are automatically placed in your home directory. Your home directory
    never changes.


    #  Working Directory


    Your working directory is defined as your current location in the directory tree.
    If you are in your home directory, that is also your working directory. However,
    if you move to another directory, that becomes your working directory.


    At times you may forget which directory you are in. Use the `pwd` (print working
    directory) command to display your current location.


    ```

    $pwd

    /usr/users/you

    ```


    #  Pathnames


    A pathname represents the directories and subdirectories that are passed through
    to reach a specified file or directory. It represents the path of a directory
    from a specific point in the directory structure. There are two types of pathnames:
    full pathnames and relative pathnames.


    Full pathnames are also known as absolute pathnames. Full pathnames always begin
    at the root (/) directory.


    Relative pathnames are based on your current working directory. For example, if
    your current working directory is your home directory, and you have a subdirectory
    called misc containing a file named alan.txt, the relative pathname of the file
    is misc/alan.txt. In contrast, the full pathname for that same file is /usr/users/you/misc/alan.txt.


    This figure illustrates full and relative pathnames for accessing a file named
    chapel from the /usr/users directory.'
  merge: -1
  pgno: 164
