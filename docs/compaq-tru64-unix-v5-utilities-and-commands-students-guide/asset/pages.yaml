  md: '# # Describing the User Interface


    # ## Overview


    The Tru64 UNIX operating system provides two methods for users to interact with
    the operating system:


    +   - Graphical user interface (GUI)

    - For workstation users or intelligent terminals with bit-mapped displays

    - Command line interface (CLI)

    - For character cell terminal users or a terminal emulator


    It is important to understand the difference between the interfaces. You probably
    use both to work on Tru64 UNIX.


    # ## Common Desktop Environment


    The default graphical user interface for the current version of Tru64 UNIX is
    the Common Desktop Environment (CDE). CDE is an industry standard, graphical user
    interface (GUI) which provides a common user interface across multivendor platforms.
    CDE development was a collaborative effort including technology for HP, IBM, SunSoft,
    and Novell. It is based on the X Window System (X1R6) and Motif R1.2.3.


    When you log in, CDE transforms your display into a desktop backdrop. On the backdrop,
    you have the Front Panel controls which provide access to various applications
    and tools. The desktop has more than one workspace. You can configure each workspace
    to fit the requirements of the work you want to.


    # ## Command Line Interface


    Before there were GUIs, the user interface was a command line interpreter (CLI).
    To interact with the operating system using a CLI, you type commands when the
    system prompts for input. Each command executes and the system prompts you for
    more input. Commands generally execute sequentially. You must wait for one command
    to finish before executing another.


    UNIX refers to CLIs as shells. Many different shells are available on the UNIX
    system. Typical shells are:


    +   - C shell

    - Korn shell


    # ## When to Use a CLI Interface


    Two instances when you use the CLI interface are:


    +   - When using a character cell terminal or dumb terminal'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# DECwindows


    +   - When accessing the system through a terminal emulator window


    Prior to DIGITAL UNIX Version 4.0, the default user interface is DECwindows.

    DECwindows is based on the OSF Motif interface developed by the Open Software
    Foundation and released in 1989. Motif is supplied by OSF to hardware vendors,
    software developers, and end-user organizations.


    With DECwindows, you can use more than one window to run applications using mouse
    buttons, menus and the keyboard. The most noticeable difference between DECwindows
    and CDE is in the look and feel of the 3-dimensional visuals such as window frames
    and pushbuttons.


    The DECwindows graphical user interface is available as an optional GUI with Tru64
    UNIX through the CDE login manager. The DECwindows applications are also available.'
