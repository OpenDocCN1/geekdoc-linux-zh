    A process is a running program or command. This unit discusses the concept of
    a process and how to manage user processes. When you enter a command, the command
    executes as a subordinate process (child) of the current process (parent). All
    user processes are children of the login shell process.


    # Objectives


    To control processes, you should be able to:


    +   - Define the concepts of process and job

    - Obtain the status of a process

    - Control and manage processes

    - Schedule processes to run at other times


