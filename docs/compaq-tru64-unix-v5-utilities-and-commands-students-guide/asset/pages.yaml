    did not read it at that time |

    | > | Points to the current message; immediately after you invoke mail, the >
    prompt will point to the first message on the list |


    To read a particular mail message, use the commands in this table.


    # Table 11-9: Reading Mail Commands


    | Command | Result |

    | <Return> | Current message is displayed |

    | p, t | Current message is displayed or redisplayed |

    | n, + | Next message is displayed |

    | number | Previous numbered message is displayed |


    # Sending Mail Commands


    The following table contains most of the commands you will need to send mail.


    # Table 11-10:Sending Mail Commands


    | Function | Command | Result |

    | Send a message | m user_list | Sends mail to all users in the message list user_list.
    Can can be used with the -f escape to forward messages. The -f escape reads the
    contents of the specified file into the message you are sending. |

    | | file# | Returns you to your mailbox. |

    | Save a message | RET, s, w | Message is saved in the file dropbox in your home
    directory. |

    | Reply to a message | R | Allows you to reply to the user who sent the message.
    The subject field of the message contains the subject of the message you are responding
    to, prefixed by RE: You may use the escapes just as you would when sending mail.
    |

    | | r | Same as R, but sends a response to all recipients of the original message
    as well as the sender. |


    Communicating with Other Users 11-19'
