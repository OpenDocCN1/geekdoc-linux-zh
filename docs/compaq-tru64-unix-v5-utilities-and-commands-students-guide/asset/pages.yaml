  md: '# Simple Search


    To do a simple search:


    +   Press Ctrl/S. emacs displays "I-search" in the minibuffer.


    +   Press Esc. emacs displays "Search" in the minibuffer.


    +   Type the characters in the string, emacs displays the characters and finds
    the first match.


    Notes:


    +   Use Ctrl/R Esc string to start a simple search backward.


    # Word Search


    To do a word search:


    +   Press Ctrl/S. emacs displays "I-search" in the minibuffer.


    +   Press Esc. emacs displays "Search" in the minibuffer.


    +   Press Ctrl/W. emacs displays "Word Search" in the minibuffer.


    +   Type the characters in the string, emacs displays the characters and finds
    the first match.


    Notes:


    +   Use Ctrl/R Esc Ctrl/W string to start a word search backward.


    # Now Try This!


    +   Edit the file with: emacs -q emacs.txt


    +   Press Ctrl/S. emacs displays "I-search" in the minibuffer.


    +   Type slowly and watch the minibuffer display and the cursor: editing


    +   Press Ctrl/S again to find the next occurrence.


    +   Press Ctrl/G to cancel the search.


    +   Press Ctrl/S and type emaq, emacs displays "Falling I-search: emaq" in the
    minibuffer.


    # Need Help?


    If Ctrl/S is used for keyboard flow control, this key sequence will not work.
    You must turn off flow control, or assign another key sequence. If you are using
    the emacs initialization file, use Ctrl\ instead of Ctrl/S.'
