- img_proc: true
  md: '# Unit Overview


    # Introduction


    The Tru64 UNIX operating system includes three very powerful tools that allow
    you to control the way commands handle data input and output.


    +   * Redirection of input and output

    * Filters that read from standard input and print to standard output

    * Piping the output of one process to the input of another


    This unit explains the use of these tools and demonstrates some of their power.


    # Objectives


    To use these Tru64 UNIX tools, you should be able to:


    +   * Redirect shell command output to a file

    * Redirect input to a shell command from a file

    * Use filters such as wc

    * Sort text with the sort filter

    * Perform basic searches using the grep command

    * Pipe basic shell commands

    * Manipulate text using the awk utility


    # Resources


    For more information on the topics in this unit, see the following:


    +   * Common Desktop Environment: User''s Guide

    * Programming Support Tools Reference, Chapter 2'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# # Redirecting Input and Output


    # Overview


    You can redirect standard input or output if you want input to come from somewhere
    other than the terminal keyboard, or output to go somewhere other than the terminal
    screen.


    With the Korn shell, you can redirect standard input and output using the following
    symbols.


    +   > Redirects standard output to a specified file

    >> Redirects standard output by appending output to a file

    < Redirects standard input


    # Using the > Symbol


    Use the > to replace the contents of a file with the output of a command, even
    if the file already exists (except if the noclobber option is set).


    The > symbol:


    +   * Creates a file if the file does not exist

    * Generates an error if the file fails, but you do not have write access

    * Opens the output file for writing before performing the command (so cat r >
    r produces an empty file)


    Here are some examples of the use of the > symbol.


    ```

    $ cat chap > newchap

    $ ls > listfile

    $ man cd < cdref

    $ date > date_file

    2> date_err

    ```


    Directs output of cat chap to file newchap

    Directs output of ls command to file listfile

    Directs output of man command to file cdref

    Directs output of date command to date_file and any error messages to date_err


    # Using the >> Symbol


    The >> also redirects standard output. This symbol appends the output of a command
    to the named file.


    These examples show the use of the >> symbol in various contexts.


    +   * $ ls -l >> dirlist


    Appends a long listing of the current directory to a file named dirlist'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Redirecting Input and Output


    ```

    $ cat workphones >> homephones

    ```


    Appends output of workphones to a file named homephones


    ```

    $ cat report1 report2 >> report3

    ```


    Appends output of date command to date_file and directs any error messages to
    date_err


    # Using the < Symbol


    The < symbol redirects standard input. It tells the system to look for input from
    the file that is specified after the < symbol. The syntax is as follows:


    ```

    command-name < input-filename

    ```


    +   - Any command that accepts standard input


    +   - input-filename File that contains the input for the specified command


    The following example shows the use of the < symbol.


    # Example 9-1: Using the < Symbol


    ```

    $ cat < chap3

    Chapter 3

    ```


    In this example, the cat command displays the contents of chap3 on your terminal
    screen. If you did not supply a file name, cat would have read its input from
    the keyboard.


    # Now Try This!


    Display the contents of your home directory .cshrc file using the cat command.


    # Solution


    You can use the < operator to redirect standard input so that cat displays the
    contents of .cshrc.


    ```

    $ cat < .cshrc

    set notify

    ```'
