  md: '# Mail Options Using the set Command


    where you is your login name. If you do not do this, anyone can read your mail,
    although most people will not.


    keepsave


    When you send a message to a folder or a file, mail usually discards its copy
    when you quit. To retain all saved messages, set the keepsave option.


    +   * metoo


    When sending mail to an alias, mail makes sure that if you are included in the
    alias, mail will not be sent to you. This is useful if a single alias is being
    used by all members of the group. If, however, you want to receive a copy of all
    the messages you send to the alias, you can set the binary option metoo.


    +   * noheader


    Binary option which suppresses the printing of the version and headers when mail
    is first invoked. Same as using -N on the command line.


    +   * nosave


    Normally, when you abort a message with two RUBOUTS, mail copies the partial letter
    to the dead file.letter which it creates in your home directory. Setting the binary
    option nosave prevents this.


    +   * quiet


    Binary option which suppresses the printing of the version when mail is first
    invoked.


    +   * record


    Valued option which can be set to the name of a file to save your outgoing mail.
    Each new message you send is appended to the end of the file.


    +   * screen


    When mail initially prints the message headers, it determines the number to print
    by looking at the speed of your terminal. The faster the terminal, the more it
    prints. The valued option screen overrides this calculation and specifies how
    many message headers you wanted. This number is also used for scrolling with the
    z command.


    +   * toplines


    Valued option which defines the number of lines that the top command will print
    out instead of the default five lines.


    +   * verbose


    Binary option which causes mail to invoke sendmail with the -v option, causing
    it to go into verbose mode and announce expansion of aliases, and so forth. verbose
    option is equivalent to invoking mail with the -v option.


    B-4 Mail Options Using the set Command'
