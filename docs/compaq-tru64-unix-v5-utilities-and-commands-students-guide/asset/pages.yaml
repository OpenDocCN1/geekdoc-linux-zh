  md: '# # Editing Korn Shell Commands in a Temporary Buffer


    # ## Using a Temporary Buffer


    One command, or multiple commands, can be edited in a temporary buffer using the
    `fc` command with the following format when using the `fc` command to edit commands
    in a temporary buffer:


    ```

    fc -e editor first last

    ```


    +   * The command to be used is supplied on the command line by using the -e option,
    or is defined by the FCEDIT variable if no editor value is specified.\n* *first*
    and *last* are the numbers or names of the first and last commands in the sequence
    to be edited. If *last* is not used, only one command is executed.

    * The selected commands are placed in a temporary buffer for editing.

    * After making necessary changes, writing the temporary file causes execution.

    * Exiting the editor without writing the file causes the original commands in
    the buffer to be executed.


    If emacs is used, when exiting the editor with Ctrl/X Ctrl/C, emacs asks the question:
    *Save file /tmp/sh####.###? (y o n)*


    If you answer no, the temporary file is not written and the original (unmodified)
    command(s) are executed. If you answer yes, the temporary file is written, and
    the new (modified) command(s) are executed.


    If vi is used to execute the commands, exit the editor with ZZ or :wq; either
    of which will cause the temporary file to be written and the new commands to be
    executed. If the editor is exited with :q!, the original commands are executed.


    In all situations, whether the old or new command(s) are executed, all commands
    are echoed on the screen, then they are executed.


    Multiple commands that were edited as a group now appear as one command in the
    history buffer whether or not they modified.


    The following example shows how to use the `fc` command to edit commands in a
    temporary buffer.


    # ### Example 16-6: Editing Korn Shell Commands in a Temporary Buffer


    ```

    $ fc -e vi 100 104

    $ fc -e emacs 100 104

    $ FCEDIT=emacs

    $ fc 100 104

    ```'
