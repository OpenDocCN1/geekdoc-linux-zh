  md: '# Deleting Files and Folders


    # Overview


    The Trash Can collects the files and folders that you delete. These objects are
    not actually removed from the system until the trash is emptied. You can change
    your mind and restore a file you have put in the Trash Can if the Trash Can has
    not been emptied.


    # Using the Trash Can


    You can open the Trash Can window by clicking the Trash Can in the Front Panel.


    Figure 5-10: Trash Can Icon on the Front Panel


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_149_0.png)


    # Deleting an Object


    To move an object to the Trash Can, perform one of the following steps:


    +   - Choose Put in Trash from the object''s pop-up menu, displayed by pressing
    Shift+F10 or MB3.

    - Select the object''s icon, then choose Put in Trash from the Selected menu on
    the File Manager bar.

    - Drag and drop the object''s icon onto the Trash Can icon in the Front Panel.

    - Drag the object''s icon to open the Trash Can window.


    # Retrieving an Object


    To retrieve an object from the Trash Can, perform one of the following steps:


    +   - Drag the object from the Trash Can window to File Manager.

    - In the Trash Can window, select the object you want to restore and choose Put
    back from the File menu.

    - Choose Put from the object''s pop-up menu, displayed by pressing Shift/F10 or
    MB3.


