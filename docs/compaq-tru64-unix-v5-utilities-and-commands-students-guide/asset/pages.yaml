  md: '# Unit Overview


    # Introduction


    File management involves organizing files into directories and subdirectories,
    as well as moving, copying, renaming, protecting and removing files.


    This unit discusses Common Desktop Environment (CDE) methods to:


    +   - Change and list directories

    - Locate files based upon file characteristics, such as file name, owner, group,
    or file size

    - Display the contents of a file

    - Create, delete, copy and move files

    - Change permissions


    # Objectives


    To manage files with CDE, you should be able to:


    +   - Use the File Manager window to locate, access, and manipulate file(s) and
    folder(s)

    - Customize the File Manager display

    - Create files and folders

    - Delete files and folders

    - Copy files and folders

    - Move files and folders

    - Rename files and folders

    - Change ownership and permissions on files and folders

    - Link files


    # Resources


    For more information on the topics in this chapter, see the following:


    +   - Common Desktop Environment: User’s Guide'
