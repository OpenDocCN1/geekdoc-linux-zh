  md: '# Unit Overview


    # Introduction


    The Korn shell allows the storing, viewing, and reexecution of previously executed
    shell commands. Each command that is issued can be stored in a history file.


    The command history file stores the commands you enter and allows to display them.
    You can select a previous command for reexecution, or you can modify a previously
    executed command. This feature saves you time because it allows you to reuse commands
    instead of retyping them.


    The Korn shell also allows you to edit commands, either on the command line or
    in a temporary buffer.


    # Objectives


    To efficiently execute Korn shell commands, you should be able to:


    +   * Define the use of variables associated with command recall

    * Recall commands from command history

    * Edit commands in a temporary buffer using the emacs or the vi editor


    # Resources


    For more information on the topics in this unit, see the following:


    +   * Common Desktop Environment: User''s Guide

    * The KornShell Command and Programming Language Morris I. Polsky and David I.
    Korn; published by Prentice Hall, Englewood Cliffs, New Jersey 07632 (c) 1989
    ISBN 0-13-516972-0'
  merge: -1
  pgno: 393
- img_proc: true
  md: "# Korn Shell Command History File\n\n# Overview\n\nEvery time you execute a\
    \ command on the Korn shell command line, the Korn shell automatically stores\
    \ a copy of the command in a history file. The history file contains a record\
    \ of all the commands you have invoked.\n\nCommands stored in the history file\
    \ are available to you any time during the session. The history file is maintained\
    \ when you log out, so previously executed commands are available the next time\
    \ you log in.\n\n+   * The history file is created by default\n* You can modify:\n\
    \  - Number of recallable commands\n  - Name of the history file\n\n# Korn Shell\
    \ Command History Variables\n\nThe following table shows variables you can use\
    \ to alter the number of commands you may recall, or change the name of the history\
    \ file.\n\nTable 16-1: Korn Shell History Buffer and Command Recall Variables\n\
    | Variable | Description |\n| --- | --- |\n| HISTSIZE=$n | n determines the number\
    \ of commands that can be recalled. The default is 128. Set this variable in the\
    \ .profile file. |\n| HISTFILE=filename | filename is the pathname of the file\
    \ that stores the command history. The default is $HOME/.sh_history. Set this\
    \ variable in the .profile file to change it. |\n\nIf you have multiple sessions\
    \ running on one system, you should create multiple history files, for each session\
    \ running the Korn shell.\n\nIf you do not create separate history files, the\
    \ commands you execute in each session are archived in one history file, $HOME/.sh_history.\
    \ The following example illustrates commands you can place in the .profile file\
    \ to set the number of recallable commands to 96, an arbitrary number, and to\
    \ set the HISTFILE variable to provide a separate history file for each session\
    \ running the Korn shell.\n\n# Example 16-1: Modifying the Korn Shell History\
    \ Variables\n\n```\nHISTSIZE=96\nHISTFILE=$HOME/.history$\\$\nexport HISTFILE\n\
    ```"
  merge: -1
  pgno: 394
- img_proc: true
  md: '# Korn Shell Command History File


    # Korn Shell Command Viewing and Recall


    The Korn shell allows you to view, edit in a temporary buffer, or recall and reexecute
    the HISTSIZE commands.


    To display the command history buffer, use the Korn shell built-in command fc
    (fix command). The fc command has several formats. In this topic we discuss the
    first format, used to view previously executed Korn shell commands.


    The syntax of the first format of the fc command is:


    ```

    fc [-lnr] first last

    ```


    The command options are shown in the table.


    | -l | Causes the command lines from first to last to be displayed with command
    numbers. If a line number (first) or range of lines (first, last) is not specified,
    the last 16 commands are displayed. The Korn shell has a preset alias, history=-l,
    used to display the 16 commands. |

    | -n | When used with the -l option, causes commands to be displayed without command
    numbers. |

    | -r | When used with the -l option, causes commands to be displayed in reverse
    order. |

    | first and last | Can be specified as commands or as names. |


    +   * If specified as numbers, commands are displayed in the same order as the
    numbers; the -r option reverses that order.

    * If specified as names, commands are displayed from the most recent first command
    to the most recent last command, in first to last order; the -r option reverses
    that order.


    # Viewing Korn Shell Commands


    The following example uses the fc command to view previously executed Korn shell
    commands from the history file.


    # Example 16-2: Viewing Korn Shell Commands


    ```

    $ fc -l 32 36 1

    32 ls -al

    33 more tempfile

    34 cd /bin

    35 ls -al k

    36 echo $myname

    $ fc -ln 32 36 2

    ls -al

    more tempfile

    cd /bin

    ls -al k

    echo $myname

    $ fc -lr 32 36 3

    36 echo $myname

    ```


    16-4 Recalling and Editing Korn Shell Commands'
  merge: -1
  pgno: 395
- img_proc: true
  md: '```

    35 ls -al k

    34 cd /bin

    33 more tempfile

    32 ls -al

    $ fc -l1 ls cd 4

    35 ls -al k

    34 cd /bin

    $ history ls cd 5

    35 ls -al k

    34 cd /bin

    $

    ```


    +   1 Displays command lines 32 to 36


    +   2 Displays command lines 32 to 36 without line numbers


    +   3 Displays command lines 32 to 36 in reverse order


    +   4 Displays the command lines from the latest ls to the next cd command


    +   5 Displays the command lines from the latest ls to the next cd command, but
    this time using the history command, the Korn shell built-in alias for fc -1


    # Recalling Previously Executed Korn Shell Commands


    Previously executed Korn shell can be recalled and reexecuted, or modified and
    reexecuted. The second format of the fc command is used to recall and modify a
    previously executed command.


    The syntax of the second format for the fc command is:


    ```

    fc -e [old=new] [command]

    ```


    This command reexecutes a previously executed command. It replaces old with new
    information in the command specified by command name, where command can be a command
    number or command name. If the command referred to is the last command executed,
    command can be omitted.


    Use fc -e to execute the command without modification. The default for fc -e is
    r. To execute the previous command, just type r.


    The following example shows a short history of commands.


    # Example 16-3: history Command Output


    ```

    $ history 49 53

    49 $ date

    50 $ first="Charlie"

    51 $ mi="M.,"

    52 $ last="Brown"

    53 $ print $first $mi $last

    ```


    The next example shows some samples of recalling and modifying commands.'
  merge: -1
  pgno: 396
- img_proc: true
  md: '# Korn Shell Command History File


    Example 16-4: Recalling Commands from the History File

    $ fc -e Charlie-Susan 50 ①

    first="Susan"

    $ fc -e M=L mi ②

    mi="L"

    $ r=Smith last ③

    last="Smith"

    $ r print ④

    print $first $mi $last

    Susan L. Smith


    +   ① Recalls command 50 and substitutes Susan for Charlie

    ② Recalls the last command that started with mi and substitutes L for M

    ③ Recalls the last command that started with last and substitutes Smith for Brown;
    uses the default alias, r

    ④ Reexecutes, without modifications, the last print command


