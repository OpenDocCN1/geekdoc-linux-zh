    | Mail Address | Format | Example |

    |--- | --- | --- |

    | Standard | username@location | bobbyjo@ufl.edu |

    | Alias | alias@location | bob@ufl.edu |


    You can create an alias for length or hard-to-spell Email addresses, distribution
    lists or a group of aliases. Once you have created the aliases, you can use it
    in the To: field when composing a mail message.


