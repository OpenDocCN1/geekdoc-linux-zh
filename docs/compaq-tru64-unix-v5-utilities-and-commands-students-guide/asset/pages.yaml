  md: "# Describing the Process Concept\n\n# Overview\n\nThe operating system manages\
    \ both hardware and software resources. One of the software resources that it\
    \ manages is an executing program. We call an executing program a *process*.\n\
    \nA process:\n\n+   - Can be created and destroyed\n- Has allocated resources\n\
    - Has an associated environment that:\n  - Is inherited from the parent process\n\
    \  - Consists of all information relative to the process\n  - Can be changed by\
    \ issuing shell commands\n- Creates other processes\n- Communicates with other\
    \ processes\n\n# Process Environment\n\nA process environment includes:\n\n+ \
    \  - Process and process group IDs\n- Open files\n- Working directory\n- File\
    \ creation mask\n- Real and effective user and group IDs\n- Resource limits\n\
    \  - Maximum file size\n  - Maximum amount of memory\n- Signal action settings\n\
    - A set of named variables\n\n# Creating a Process\n\nWhen you start the operating\
    \ system, the *init* process starts. The *init* process creates login processes\
    \ that wait for terminal input."
