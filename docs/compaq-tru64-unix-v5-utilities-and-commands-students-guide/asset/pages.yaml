  md: '# Using Terminal


    +   * 132 column switching

    * When enabled, the system will automatically enlarge the window to accommodate
    132 columns when the active application switches to 132 columns. When this feature
    is disabled (default), the system does not automatically enlarge the window if
    the active application switches to 132 columns.

    * End-of-Line wrapping

    * When enabled, characters wrap to the next line automatically when the end-of-line
    is reached. When disabled, text does not wrap.

    * Reverse end-of-line wrapping

    * This controls the behavior of backspacing at the end of a line. If enabled,
    backspacing automatically wraps to the previous line when an end-of-line is reached.
    If disabled, no wrapping occurs.


    Figure 2-31: Terminal Options Dialog Box


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_91_0.png)


    # Resetting Control Characters


    Use the Ctrl key in combination with another key to perform a specific function.
    For example, Ctrl/C cancels the current operation and displays the command prompt.'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'The table shows the default settings for control characters set by the Login
    Manager.


    # ### Table 2-7: Terminal Control Characters


    | Key | Control Name | Function |

    |---|---|||

    | Ctrl/H | erase | Backspace: erases characters |

    | Ctrl/C | intr | Interrupt: cancels the current operation and displays the command
    line prompt |

    | Ctrl/U | kill | Stops an operation or application |

    | Ctrl/Q | start | Accepts keyboard input; continues an application that has been
    paused |

    | Ctrl/S | stop | Does not accept keyboard input; pauses an application |

    | Ctrl/@ | swtch | Switches between layers in a shell |


    Terminal (dtterm) emulates a terminal. The control settings may be different for
    the actual hardware you are using or for another terminal emulator. You can change
    the settings of the control characters by using the ttyModes resource.


    The syntax of this statement is:


    ```

    ttyModes: controlname ^key

    ```


    For example:


    ```

    ttyModes: erase ^H int ^C kill ^U start ^Q ^S swtch ^@

    ```


    To set terminal control characters:


    +   1. Add the ttyModes resource to the file .Xdefaults in your home directory.

    2. Double-click the Reload Resources icon in the Desktop_Tools application group
    (in Application Manager).'
  merge: -1
  pgno: 92
- img_proc: true
  md: '# Running Applications


    # Overview


    CDE provides a variety of methods for invoking applications which give a great
    deal of flexibility for how you use the system.


    You can invoke an application from the Application Manager, File Manager, Front
    Panel and the Terminal Emulator application. This topic discusses how to run applications
    using the Application Manager and File Manager.


    # Using the Application Manager


    The Application Manager control on the Front Panel provides some of the most frequently
    used tools and applications available on the system. The applications you find
    there are either built into the desktop or configured by your system administrator.


    When you click the Application Manager control, the system displays a File Manager
    view of a special folder, as shown in this figure.


    Figure 2-32: Application Manager Folder


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_93_0.png)


    This is not a typical folder because files and folders are not created directly
    in it. They are gathered into this location automatically when you log in.


    The contents of these folders can consist of application files, sample data files,
    and read me files.'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Registered Application Groups


    **Registered applications** are those applications that your system administrator
    registers using the application registration process. This process lets the desktop
    know that an application is present.


    Each application group in the Application Manager is gathered each time you log
    in. The application group may be located on your system or other systems in the
    network.


    Because the Application Manager gathers these applications each time you log in,
    it is possible that the Application Manager view will display a different set
    of applications depending upon the work of your system administrator.


    # Built-In Application Groups


    The desktop provides the built-in application groups shown here.


    | Application | Description |

    | --- | --- |

    | Desktop_Apps | Applications such as the Calculator, Netscape, and Text Editor
    |

    | Desktop_Tools | Administration and operating system tools such as Archive, vi
    Text Editor and Check Spelling |

    | Information | Icons representing frequently used help topics |

    | System_Admin | Tools used to manage the system |


    When you double-click the Desktop_Apps icon in the Application Manager folder,
    the system displays the contents of the Desktop_Apps folder, as shown here. This
    folder contains useful applications such as the Calculator and Man Page applications.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Figure 2-33: Contents of the Desktop_Apps Application Group


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_95_0.png)


    You can start any application by double-clicking its icon.


    # Running an Application from the Application Manager


    To activate an application:


    +   1. Click the Application Manager on the Front Panel.

