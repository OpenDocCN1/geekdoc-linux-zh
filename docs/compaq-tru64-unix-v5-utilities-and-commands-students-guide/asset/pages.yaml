    # Types of Sessions


    There are two types of sessions: current and home.


    +   * Current session


    When you log in to the system, the Session Manager creates a session for you.
    This is called your current session. If you change the characteristics of your
    desktop during the session, the Session Manager captures this information when
    you log out and restores it when you log in.


    +   * Home session

