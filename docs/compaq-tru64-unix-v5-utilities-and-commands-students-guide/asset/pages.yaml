    # Displaying Korn Shell Variables


    All shell variables can be displayed using the set command with no options on
    the command line, as shown in the following example.


    Example 7-5: Displaying All Variables with set


    ```

    $ set

    CDPATH=..:/usr/users/you/.usr

    EDITOR=emacs

    ENV=/usr/users/you/.kshrc

    FCEDIT=emacs

    TERM=vt100

    USER=you

    myname=''Charlie Brown''

    address=''2 Tired Way''

    ```


    You can also display an individual variable with the print command, which has
    the format: print $name.


    Example 7-6: Displaying Individual Variables with set


    ```

    $ print $myname $address

    Charlie Brown 2 Tired Way

    ```


    # Unsetting Korn Shell Variables


    Korn shell variables are unset (cleared) with the unset command, which has the
    format: unset name


    For example, to clear the variables myname and address, type:


    ```

    $ unset myname

    $ unset address

    ```


    # Using typeset with Korn Shell Variables


    The Korn shell supports some data types, and you may want to declare the data
    types of the variables you use for Korn shell programming.


    Use a Korn built-in typeset to:


    +   - Set variable attributes

    - Unset variable attributes

    - Set values


