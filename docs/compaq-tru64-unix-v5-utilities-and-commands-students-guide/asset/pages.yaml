  md: '# Summary


    # Identifying Files and Data Types (CDE)


    There are three types of files in the UNIX file system.


    +   - Ordinary files, which hold data

    - Directories, which hold files

    - Special files, which associate physical devices


    The file command allows you to distinguish the type of information in a file.


    CDE files are represented by icons. The icon type represents the data type of
    the file. In most cases, you can click the icon to open the application that created
    the file.


    Folders are files used to group and categorize files similar to files contained
    in folders within a file cabinet.


    # Naming Files and Directories


    Follow these guidelines when naming files.


    +   - Use letters, numbers, underscores, and periods within file names.

    - Avoid beginning your file or directory names with periods (.).

    - Avoid spacial characters.

    - Upper and lowercase letters are distinct.

    - You can use part of the file name as a file extension preceded by a period (.)
    to indicate the contents of the file.


    # Describing the UNIX Directory Structure


    The UNIX file system is hierarchical. All pathnames stem from the root directory,
    represented by the slash symbol (/). Grouping files and directories according
    function allows system files and directories to be protected.


    # Controlling File Access


    File permissions allow you to restrict access to files or folders. Three groups
    of users can access files and folders: user (owner), group, and other. File access
    is divided into three types of permissions: read, write, and execute.'
  merge: -1
