  md: '# Choosing Passwords


    # Overview


    When you are given an account on the system, you are also given a password. When
    you log in to your account for the first time, you should set or change your password.
    Your password is confidential. Once you set it, you are the only person to have
    access to your account.


    # Choosing Passwords


    When choosing passwords, do not:


    +   * Choose words found in the dictionary

    * Use personal information

    * Use your default (original) password

    * Choose a password that is easy to guess, or hard to remember

    * Write down your password


    # Password Guidelines


    Passwords may contain nonalphanumeric characters as well as letters and numbers.
    You should select a password that is easy to remember, but not that one that is
    obvious. For security reasons, it is best to select a password that is greater
    than six characters in length.


    Passwords:


    +   * Must contain at least five characters

    * Can be longer than eight characters, but only the first eight are recognized

    * Cannot consist entirely of lowercase letters; must include at least one uppercase
    letter, one digit, or one symbol

    * Should be changed frequently


    # Changing Your Password


    Use the passwd command to change your password. The system will prompt you to
    enter:


    +   * Your old password (to verify who you are)

    * Your new password

    * Your new password again (for confirmation)


    If you make an error when confirming your password, your original password is
    not changed.'
