  md: '# Setting Your Default Printer


    Figure 13-2: Determining the Default Printer


    ![](img/8295751df7a37c5d3eb4d16a30f79f7b_347_0.png)


    # Changing the Default Printer


    To change your default printer:


    +   1. Using the File Manager, select your home directory.


    +   2. Double-click the .dtprofile file. If you cannot see the file, change your
    Manager View to show hidden files.


    +   3. Add a line to set the value for the LPDEST environment variable to the
    printer you want to use as your default. Check the /etc/printcap file for possible
    printers.


    ```

    LPDEST=printer_name; export LPDEST

    ```


    +   4. Log out of the system and log back in. The change should be in effect.'
  merge: -1
