  md: '# Choosing Passwords


    Password confirmation ensures that you do not set your password to an unknown
    word derived from a typing error — unless you make the same mistake twice.


    # Now Try This!


    Change your password to something unique. Remember this password! You will be
    using it for your exercises throughout the course.


    +   1. At the system prompt enter the passwd command:

    n$ passwd

    Changing password for [username]

    2. Old password: Enter your current password. It will not echo on the screen.

    3. New password: Enter your new password. It will not echo on the screen.

    4. Retype new password: Enter the new password again. It will not echo on the
    screen.


    # Some Useful Tips


    When you enter a password, it is not echoed (displayed) on the screen.


    If you make a mistake typing your old password, the system displays the message
    Sorry.


    If you make an error when confirming your password, the system displays the message
    Mismatch – passwd not changed.


    If these problems occur, reenter the passwd command to start the process again.


    If you forget your password, your system administrator can reset it for you.


    Getting Started with Tru64 UNIX 1-13'
