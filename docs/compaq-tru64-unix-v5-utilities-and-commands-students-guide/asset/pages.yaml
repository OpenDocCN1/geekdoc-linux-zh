  md: '# Summary


    # Summary


    Korn Shell Command History

    The Korn Shell provides a command history buffer that can be used to recall and
    reexecute previous commands.


    The Korn shell has a default history file, $HOME/.sh_history.


    Shell variables used with the history files are:


    +   - HISTSIZE

    - HISTFILE


    # Korn Shell Command Line Editing


    The Korn shell provides the capability to edit commands on the command line with
    vi, emacs, or gmacs.


    The command line editors are a part of the Korn shell, and are a subset of the
    GNU emacs and vi editors.


    The vi command line editor has two modes: insert and command. Insert mode is the
    default mode. Command mode is entered by pressing Esc.


    Most command line editor commands are the same as the editor of which it is a
    subset.


    # Editing Korn Shell Commands in a Temporary Buffer


    Use the command fc -e editor first last to edit a list of previous commands in
    a temporary buffer.


    Use the FCEDIT variable to select a default editor for editing commands in a temporary
    buffer.


    Recalling and Editing Korn Shell Commands 16-23'
