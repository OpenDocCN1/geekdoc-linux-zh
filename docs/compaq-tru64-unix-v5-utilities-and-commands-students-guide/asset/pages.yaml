  md: '# Killing Buffers


    You can kill the buffer you are currently editing by pressing Ctrl/X k. If you
    do not supply a buffer name, `emacs` prepares to kill the default buffer and responds
    with: Kill buffer: (default buffer-name).


    +   * Press Ctrl/G to cancel the command.


    +   * Press Return to kill the buffer immediately if it has not been modified.
    If the buffer has been modified, `emacs` informs you that it has been modified
    and asks you to verify.


    +   * If you provide a buffer name, `emacs` prepares to kill the named buffer
    as it would the default buffer.


    Use Esc `kill-some-buffers` to selectively kill buffers through the buffer list,
    and informs you if a buffer has been modified to allow you to keep the buffer.
    It then asks if you want to kill the buffer. If you respond `yes`, `emacs` gives
    you another chance to change your mind by informing you that the file has been
    modified, and asks if you want to kill the buffer anyway.


    `emacs` even lists its internal buffers, allowing you to kill them if you want.


    # Renaming Buffers


    Imagine the situation where you have multiple directories, each containing a file
    by the same name, `distribution-list`. If you edit this file from one directory,
    use Ctrl/X/F to bring in a file with the same name from another directory, `emacs`
    names the buffer for the second file `distribution-list2` to indicate that it
    is the second with this name. You may want to change the name of the buffer to
    make it easier to keep track of while you are editing the buffers.


    Use Esc `rename-buffer buffer-name` to rename the buffer. Even with different
    buffer names, `emacs` keeps the corresponding file names straight. After you have
    completed buffer modifications and save the files, `emacs` saves them to the proper
    files.


    # Read-Only Buffers


    You will occasionally want to copy text from one file to another without changing
    the file you are copying from. It is easy to hit the wrong keys and unknowingly
    add text. You may want to make a buffer read-only, preventing this from happening.
    You can then copy into the kill ring and yank text to the other file (remember,
    you cannot delete text in a read-only file). To set the default buffer to read-only,
    use Ctrl/X Ctrl/Q


    # Try This!


    +   1. Edit file5 with `emacs file5`


    +   2. Go to file6 with: Ctrl/X Ctrl/F


    +   3. List the buffers with: Ctrl/X Ctrl/B'
