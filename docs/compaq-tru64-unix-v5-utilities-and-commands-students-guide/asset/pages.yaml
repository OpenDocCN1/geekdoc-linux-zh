    # Global Variables


    When a variable is defined, its value is only available in the current shell.
    To make a variable global or available to child processes of your current shell,
    use the export command after defining the variable as follows:


    # Example 17-8: Defining Global Variables


    ```

    $ dog=cat

    $ export dog

    $ print $dog


    ```


    Use the k command to fork a child shell. Global variables can be seen at a child
    level as follows.


    # Example 17-9: Global Variables in a Child Shell


    ```

    $ FOOD=pasta

