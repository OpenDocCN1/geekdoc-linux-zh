  md: '# Overview


    # Introduction


    emacs is the most powerful editor in the UNIX world today, and is a complete working
    environment. You can use emacs to:


    +   - Get a listing

    - Edit, rename, delete, and copy files

    - Compile programs

    - Send and read mail

    - Check for proper spelling

    - Execute a single shell command

    - Run a shell in an emacs window


    This appendix introduces the emacs editor.


    # Resources


    For more information on the topics in this appendix, see the following:


    +   - emacs reference pages

    - GNU emacs Manual

    Richard Stallman

    available in the /usr/lib/emacs/doc directory when you install the FSFemacsSRC
    software subset

    - Learning GNU emacs

    Debra Cameron and Bill Rosenblatt

    published by O''Reilly and Associates, Inc., Sebastopol, CA (c) 1991

    ISDN 0-937175-84-6'
  merge: -1
  pgno: 515
- img_proc: true
  md: '# Introducing the emacs Editor


    # Overview


    The original emacs was written by Richard Stallman for the PDP-10 as a set of
    macros for the TECO line editor. emacs stands for Editing Macros. GNU emacs comes
    from the Free Software Foundation and the GNU project (GNU''s UNIX), a complete
    operating system that Stallman and his associates are generating.


    The emacs software and documentation is free. The emacs software is often packaged
    with distributions of UNIX systems; Tr64-UNIX includes GNU emacs in the OSEmacs
    software subset (and documentation and sources in the FSEmacs subset).


    The documentation for GNU emacs is available online and can be viewed using Info,
    a subsystem of the emacs facility. The emacs editor has an interactive help facility,
    however, you must know how to manipulate emacs windows and buffers to use it.


    # Using emacs Files and Buffers


    emacs does not edit the actual file, but puts the contents of the file into a
    temporary buffer and edits that buffer. Any changes are made to the buffer, not
    the original file. The file on disk is not modified until the file is written.
    The buffer name is usually the same as the file name.


    emacs may have many buffers at one time. One of the buffers, *Help*. You can open
    more than one buffer, and move back and forth between buffers at will.


    # emacs Modes


    emacs has different operating modes. The modes allow emacs to operate differently
    based upon the contents of the file being edited. There are major and minor modes.
    Some examples of major modes are shown in the table.


    | Mode | Function |

    | Fundamental | Default mode; no special operation |

    | Text | Writes text |

    | Indented text | Indents all the text you write |

    | Picture | Creates simple line drawings |

    | C | Writes C programs |

    | FORTRAN | Writes FORTRAN programs |

    | emacs LISP | Writes emacs LISP functions |'
  merge: -1
  pgno: 516
- img_proc: true
  md: '# Introducing the emacs Editor


    emacs selects the major mode based based upon the file extension or the contents
    of the file. If it cannot determine a major mode, it defaults to the fundamental
    mode.


    There are also minor modes that can be turned on or off within a major mode. They
    define a particular aspect of emacs behavior; for example, fill mode means that
    emacs should wrap long lines where appropriate.


    The minor modes are shown in the table.


    | Mode | Function |

    |---|---|n| Abrev | Allows the use of word abbreviations |

    | Fill | Enables word wrap |

    | Overwrite | Allows typing over characters instead of inserting them |

    | Autosave | Saves your file automatically so often |


    # Starting emacs


    On a UNIX workstation, you can start emacs within the current terminal window,
    or in a separate X window as a background process.


    # Starting emacs in a Terminal Window


    The format of the emacs command is:


    ```

    emacs [-option] filename

    ```


    Some of the options you may want to use:


    +   +number Start the edit on the line specified by number

    -q Do not load an initialization file

    -u user Load user''s initialization file

    -nw Do not use the special interface to X; for perfuming the editing in the present
    window


    For example, to start emacs on a terminal without using an initialization file:


    ```

    $ emacs -q junkfile

    ```


    # Starting emacs in an Xterm Window


    The format of the emacs command is:


    ```

    emacs [-option] filename &

    ```'
  merge: -1
  pgno: 517
- img_proc: true
  md: 'Some of the options you may want to use with a workstation are shown here.


    | Option | Function |

    | -wn name | Specifies the name of the emacs window |

    | -i | Displays the kitchen sink bitmap icon (looks like a deep sink) when making
    the emacs window an icon |

    | -geometry | Sets the emacs window''s width, height, and position. The width
    and height are specified in characters, and the default is 80 by 24 |

    | -fg color | Sets the color of the text on color displays; colors can be found
    in the file /usr/lib/X11/rgb.txt |

    | -bg color | Sets the color of the window''s background on color displays |


    # Using the emacs Screen


    Before learning any emacs commands, you must learn a few things about the emacs
    screen. When you edit a file, there is:


    +   * The workspace, the area of the screen for the text

    * A mode line, two lines up from the bottom of the screen

    * The minibuffer area, just below the mode line


    The cursor marks the place where the next character will be entered, and you can
    start typing right away. emacs does not have separate modes for inserting text
    and giving commands. This example shows a typical mode line, containing the following
    information.


    +   * Two asterisks (**): If present, they indicate that the buffer you are editing
    has modified since the last time it was saved.

    * The word emacs: You are using the emacs editor.

    * The name of the buffer you are editing, junkfile.

    * One or more words in parentheses: The first word in the parentheses is the major
    node, in this case Fundamental. Any further information within the parentheses
    indicates minor modes that are turned on.

    * Where you are in the file (Top, Bot, All, or % into the file).


    # Example 18-1: emacs Mode Line


    ```

    ---**emacs: junkfile--------------------------------------Top---

    ```


    Below the mode line is the minibuffer. This is the area where:


    +   * emacs echoes the commands you enter

    * You specify file names for emacs to find'
  merge: -1
  pgno: 518
- img_proc: true
  md: '# Introducing the emacs Editor


    +   * You specify values for emacs to search for

    * You type the name of a command to be executed


    # Introducing emacs Commands


    Before talking about specific emacs commands, we will discuss emacs commands from
    a more general point of view.


    +   * There are hundreds of emacs commands, but you need to learn only a few to
    get started.

    * emacs commands have long command names. However, the commands used most often
    are bound to key sequences.

    * You can always use the command name to execute a command, even if it is bound
    to a key.

    * The most commonly used commands (cursor movement commands) are bound to Ctrl/char.

    * Slightly less used commands are bound to Esc char key sequences. If you do not
    have an Esc key, try the F11 key or Ctrl/.

    * emacs allows you to bind a command to a sequence of keys, something you should
    do after using emacs.


    You can execute any command by pressing Esc X then typing the command name. This
    is the normal way to execute the commands that do not have key sequences bound
    to them. An example is the goto-line command


    # Leaving emacs


    After editing the buffer, you can temporarily suspend emacs by pressing Ctrl/Z.
    This places you at the shell prompt. You can get back into emacs by typing fg.
    Suspending emacs is very useful, but be careful not to start another session of
    emacs on the same file; you could corrupt the file. You should get in the habit
    of saving your buffer before suspending emacs.


    Terminate the emacs session by pressing Ctrl/X Ctrl/C. If you have changes to
    the file, emacs asks you if to write the file. If you type y, emacs writes the
    file then exits. If you type n, emacs forces you to verify that the changes should
    be discarded.


    # Now Try This!


    +   1. Start the emacs editor with the emacs -q file5

    2. Note the mode line near the bottom of the window specifying the file name.

    3. Type this line: `Now is the time to say goodbye`

    4. Terminate emacs by pressing Ctrl/X Ctrl/C.


    D-6 Using the emacs Editor'
