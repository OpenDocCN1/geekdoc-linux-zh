  md: '# Performing Basic Editing


    # Repeating Commands


    You may want to repeat a command a number of times, especially when it comes to
    cursor motion. emacs provides two ways to repeat commands.


    +   - Precede the command with Esc number, where number is the number of times
    you want to repeat the command. For example, if you gave the command to move down
    the file by one line, and preceded with Esc 100, the cursor would move 100 lines
    down. A negative number reverses the direction.

    - Precede the command with Ctrl/U number, or use Ctrl/U by itself. Ctrl/U number
    works the same as Esc number. Ctrl/U without a number uses the number four.


    # Moving the Cursor


    There are many commands to move the cursor. To move the cursor one character or
    line at time, use the commands here.


    | Command | Function |

    |---|---|n| Ctrl/F or right arrow | Moves forward one character (right) |

    | Ctrl/B or left arrow | Moves backward one character (left) |

    | Ctrl/P or up arrow | Moves to previous line (up) |

    | Ctrl/N or down arrow | Moves to next line (down) |


    Some other movement commands include those shown here.


    | Command | Function |

    |---|---|n| Ctrl/A | Moves to the beginning of the line |

    | Ctrl/E | Moves to the end of the line |

    | Ctrl/V | Moves forward one screen |

    | Esc V | Moves backward one screen |

    | Esc > | Moves to the end of the file |

    | Esc < | Moves to the beginning of the file |

    | Esc X goto-line n | Goes to line n in the file |


