  md: '# Unit Overview


    # Introduction


    This unit introduces the various UNIX editors and provides instruction for the
    vi editor. One major advantage of the vi editor over the emacs editor is that
    most UNIX systems offer the vi editor. If you use vi, and move from one UNIX system
    to another, you might not have to learn any other editor.


    This unit shows you how to start and exit vi, move the cursor, find and edit text,
    copy and move text.


    # Objectives


    To edit files on a UNIX system, you should be able to:


    +   * Compare the various UNIX editors

    * Start and exit an edit session

    * Move around in a file

    * Find and change text

    * Copy and move text


    # Resources


    For more information on the topics in this unit, see the following:


    +   * Command and Shell User''s Guide, Appendix A http://www.unix.digital.com/faqs/publications/base_doc/DOCUMENTATION/V40D_HTML/APS2HDTE/TITLE.HTM

    * vi reference page'
  merge: -1
