  md: '# Introducing the Mail Utility (CLI)


    +   5. The system then prompts: $. This indicates you have successfully sent your
    mail message.


    # Editing a Message


    When you are entering the body of your mail message, the line-oriented editor
    allows you to enter each line of the message. You press Return to get a new line.
    To edit a line, you must make changes before entering Return. There are efficient
    ways to create and edit a message, including:


    +   * Creating a file using mail

    * Invoking an editor while in mail

    * Using ~r to send a file


    # Creating a File Before Mailing


    To send a message using an existing file:


    +   * Use a text editor to create and edit a file entering the information you
    want to mail. Save the file.

    * Use the Mail command to send the file to a distribution list.


    The following example shows the document, letter.mail, to users dan, kls, ar and
    rln. The message file, letter.mail, was created with a text editor before entering
    the mail command. Notice the redirection symbol (<). This indicates to the mail
    program to take input from the file, letter.mail.


    # Example 11-4: Using Mail to Send a File


    ```

    $ mailx dan kls ar rln < letter.mail

    ```


    # Invoking an Editor in Mail


    To invoke an editor from within mail, enter ~v or ~e on a line by itself.


    The following example shows how to create a message using thetilde sequence, when
    you enter ~v on a line by itself, mail invokes the editor defined by the shell
    environment variable, VISUAL.


    # Example 11-5: Editing a Message with ~v


    ```

    $ smith

    Subject:<Return>

    ~s Send Mail Editing Session

    ~v

    (Note: Typing ~i causes vi to enter the insert mode)

    This is a sample editing session using the vi.

    Notice how the text wraps automatically when you reach the end of the line.

    Don''t forget to press Esc to stop editing.

    Then enter :w to return to the send mail session.

    <Esc>

    :wq

    ```


