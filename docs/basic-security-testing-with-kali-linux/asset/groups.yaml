    ## 结论


    攻击路由器有多种方法，我们涵盖了最易用的方法之一——Routerpwn。我们还涵盖了攻击路由器的 WPS 能力。


    如前所述，我们将在接下来的几个章节中花费更多时间讨论路由器，特别是 Wi-Fi 网络。


    公司和家庭必须保持路由器固件更新，使用长且复杂的密码保护路由器，并在不需要时关闭 WPS。


