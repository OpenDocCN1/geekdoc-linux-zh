    net:192.168.1.10

    net:192.168.1.0/24


    # TITLE Command


    You can also search for items using the Title command:


    title:"Server Room”


    Title is probably one of the most overlooked search parameters. You can scan the
    entire Internet or your entire domain looking for title keywords.


    # KEYWORD Search


    Probably the most popular way to search Shodan is using a body keyword search.
    If you know the type of server the target system is, the name of an embedded server,
    or want to search for only “200 OK” webpages, then the body keyword search is
    the one to use.


    For instance if you wanted to find all the servers running Apache server version
    2.2.8 and only open sites, or sites that didn’t return an error when scanned –
    “200 OK” sites, the following keywords:


    ```

    apache/2.2.8 200 ok

    ```


    Or maybe you want to skip any 401 unauthorized pages or 302 Moved pages? Just
    use a minus sign and the HTML error code:


    apache/2.2.8-401-302


    # Combined Searches


    The most effective Shodan searches are completed by combining search terms. With
    a few keywords you could search for all of the Microsoft servers IIS/7.0 at your
    Boston location.


    IIS/7.0 hostname:YourCompany.com country:Boston


    Or you could do a quick security scan of your domain for old systems that need
    to be updated. For example any IIS/5.0 systems located anywhere on your domain
    in France.


    IIS/5.0 hostname:YourCompany.com country:FR


    Title searches work great too. Many webams use “camera” in their title information.
    If cameras were not allowed on your network you could quickly check for that.


    Title:camera hostname:YourCompany.com


    Lastly searching using the Geo coordinates opens up some interesting capabilities,
    especially for OSINT and government entities. As you were creating a network map
    and wanted to search for Linux servers located near Damascus, Syria:


    ```

    geo:33.5,36.3 os:Linux

    ```


    For some reason not every system will be correctly labeled with their city/ country
    and the geo'
  - '[PAGE 75]


    knowledge helps identify additional systems that would not show up otherwise.


    Other search terms you can use include:


    +   - **Port:** Search by port number.

    - **OS:** Search by Operating System.

    - **After or Before:** Search for servers dates.


    # # Shodan Searches with Metasploit


    Shodan search capabilities have been added to the Metasploit Framework. You just
    need to sign up from a free Shodan user account and get an API key from their
    website. Using an API key allows you to automate Shodan searches.


    To find systems with Metasploit, you simply use it like any other exploit:


    +   1. Create a free account on Shodanhq.com.

    2. Obtain an API key - http://www.shodanhq.com/api_doc

    3. Start Postgeql (Type, “service postgresql start” in a terminal).

    4. Start the Metasploit Service ("service metasploit start").

    5. Start Metasploit ("msfconsole") or use Top Ten Menu.

    6. Type, “use auxiliary/gather/shodan_search",


    ```

    msf > use auxiliary/gather/shodan_search

    msf auxiliary(shodan search) >

    ```


    7. Now, "show options" to see what options we need to use:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_75_0.png)


    +   8. Type "set Shodan_APIKey <API KeyNumber>" and fill in your API Key Number.


    +   9. Now set the Query field with the keyword you want to search for:'
