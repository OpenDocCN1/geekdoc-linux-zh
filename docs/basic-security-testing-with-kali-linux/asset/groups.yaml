    # Filter Commands


    Let''s take a closer look at the filer commands.


    (To use these commands or to get more than one page of results, you need to sign
    up for a free Shodan Account.


    > CITY and COUNTRY Command


    The City and Country commands allow you to narrow down the geographic location
    of your searches.


    country:(2 Letter country code)or city:(city name)


    country:US


    city:Memphis


    Better yet, combine the two if the city you are looking for is located in more
    than one country.


    country:US city:Memphis


    > HOSTNAME Command


    Scan an entire domain with the hostname command:


    hostname:google


    You can use part of the Fully Qualified Domain Name, like google or the entire
    site like www.microsoft.com or support.microsoft.com.


    > NET Command


    Scan a single IP or a whole net block range using the net command:'
