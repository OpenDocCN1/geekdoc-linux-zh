    Autoselected keyboard map en-us

    Password:

    ```


    “-p -" 选项告诉 rdesktop 向你提示输入密码。这要安全一些，因为你没有通过网络发送明文密码。


    一旦我们登录，我们将在 Kali 机器上获得一个图形化的 Windows 桌面：


