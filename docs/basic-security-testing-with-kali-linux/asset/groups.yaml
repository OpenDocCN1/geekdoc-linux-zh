    Metasploitable.vmx 文件并点击“Open”。


    - 4. 它现在将出现在 VMware Player 菜单中：


    ![](img/ff9cd19afe449ae54278ee429e668a6f_24_0.png)


    - 5. 现在进入 Metasploitable 的“编辑虚拟机设置”，确保网络接口设置为“NAT”：


