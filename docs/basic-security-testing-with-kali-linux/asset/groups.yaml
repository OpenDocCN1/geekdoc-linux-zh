    # Chapter 30 – Installing Kali on a Raspberry Pi


    ## Resources


    - Kali Raspberry Pi ARM Image - http://www.kali.org/downloads/

    - Win32 Disk Imager - http://sourceforge.net/projects/win32diskimager/

    - Putty Download - http://www.chiark.greenend.org/~sgatham/putty/download.html

    - Xming - http://sourceforge.net/projects/xming/


    # Introduction


    In this chapter we will learn how to install Kali Linux on a Pi, connect to it
    remotely via Windows 7 and use it to perform some wireless security tests.


    Kali Linux is the newest version of ever popular Backtrack penetration testing
    and security platform. Numerous updates and enhancements have been added to make
    Kali more capable and easier to update than ever before.


    > (Note: Occasionally I have noticed that certain programs will not run from the
    command prompt on the ARM version of Kali. You may need to execute them from their
    program directory /usr/bin.)


    Raspberry Pi is a very inexpensive functional “credit card” sized computer that
    comes in two models. The “B” model, used in this article, has 512 MB RAM, video
    output, NIC, sound jack and dual USB ports and amazingly costs about $35 (USD).


    The Pi has an ARM based processor, and comes preloaded with an operating system.
    But other operating systems compiled for ARM can also run on the Pi.


    The good folks at Offensive Security have created a Kali Linux image for the Raspberry
    Pi, so installation could not be easier. All you need is a Raspberry Pi, the Kali
    Image, and an SD Card. We will use a Windows system to write the image to the
    SD card, and then use it to connect to the Pi via SSH.


    > REMINDER: As always, never connect to or access a network that you do not have
    express permission to access. Doing so could get you into legal trouble and you
    might end up in jail.


    # Pi Power Supplies and Memory Cards


    Before we get started, let me quickly cover power issues with the Raspberry Pi.
    A Power adapter does not normally come with the Pi. If the adapter you use does
    not provide enough amperage the Pi will act erratic, especially when you plug
    in the Wi-Fi card.


    The manufacturer recommends that you use a 2 amp power supply. Many micro USB
    power adapters provide only one amp or less. I have had very good luck with a
    2.1 Amp adapter from Rocketfish.


    Pi also comes without a required SDHC memory card. An easy rule to follow when
    selecting a card, the faster the better. I used a Sony 16GB Sony memory card with
    a stated transfer rate of 15MB.


    # Installing Kali on a Raspberry Pi


    Here is how to install Kali Linux on the Pi:


    - 1. Download Kali Raspberry Pi ARM Image.

    - 2. Use Win32 Disk Imager to write the image to your SD card.

    - 3. Insert the SD card into the Raspberry Pi.

    - 4. Power on the Raspberry Pi.

    - 5. Boot the system.


    # Connecting to a “headless” Pi


    To do so:


    - 1. Download Putty for Windows.

    - 2. Run Putty and enter the IP address for your Raspberry Pi.

    - 3. Make sure port 22 is entered and select “SSH” as the connection type.

    - 4. Hit “Open”.

    - 5. Use Kali default credentials (root/toor).


    # Viewing Graphical X Programs Remotely through Putty


    Okay, you can run any text based program through Putty, but if you try to run
    a graphical program it will work. We can run the X based programs over a remote
    Putty connection if we use Xming, the X Server for Windows.


    - 1. Simply download and install Xming.

    - 2. When asked which components to install click, “Don’t install an SSH client”
    and finish installation.

    - 3. Now open Putty again and put in the IP address and port for your Raspberry
    Pi.


