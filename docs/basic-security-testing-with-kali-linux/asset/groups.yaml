    # 使用 SET 进行更高级的攻击


    花点时间研究 SET，并查看它为攻击目标系统提供的许多选项。


    你可以使用 SET 创建恶意的 CD/DVD 和 USB 介质（用于创建恶意介质并留在公司停车场等）、一系列基于 Arduino 的攻击、Microsoft
