    ## Introduction


    So far we have covered several techniques for attacking passwords. We saw that
    sometimes you can just do a rainbow lookup, and in some cases if all else fails,
    you have to crack. How big of a problem is this? Not long ago I tried Hashcat
    with my Windows 7 system that had a Core i5-750 running at 2.6GHz and a single
    fairly released password that contained over 7,000 hashes. I chose this one due
    to the size. Besides, how many American businesses have million or more employees?
    With Hashcat and two different files, I was able to crack 86% of it... If that
    doesn''t sound impressive, Hashcat took just 12 seconds to recover 46% and about
    13 minutes to recover 66%.


    Now, take a minute and think about password length and complexity. Hashcat is
    an all-purpose password cracker that can run off your graphics card (GPU) or your
    CPU. The version Hashcat-plus (or CUDAcat-plus) is counted as the world’s fastest
    md5crypt, phpass and WPA/WPA2 cracker. Hashcat is a multi-threaded cracker, so
    if your CPU can run several threads it will use them. But the real speed comes
    into play using the horsepower of a GPU on your video card. If your GPU can run
    hundreds of threads, all of this power is used to break passwords. You can even
    harness the power of multiple video cards to create a monster station.


    ## Cracking NTLM passwords


    There is nothing like hands-on practice, so let’s crack some hashes. Here are
    some:


    ```

    a4f9c4c06510bdcab6824ee77c30fd852

    2e4db83aa056289935daea328977b20

    d149886c6122b1654ba39932465528

    4a8441c8cb2b55e3ef645c83f01aa7b

    259745cb123a52aa2693aaacca2db552

    d5c2155161d7228302b90afdcd5539

    5835048ce9240d564ec29a92403510ef

    b963c570102f18ed2c3329b5e4d0f

    f773c5db7d2beb4b0daec72e8c50a4

    5d05c3883ac48f1842f8f2b1c63d8954

    6fad63faebf7421101f02ba62a1b3e

    43fcc6faeba63d14b26427c26d00410ef

    27c055ea55ecfedba01c022681d3da3f

    9349b142f202437a557fc521fcf8bd3

    ```


    Simply put these hashes in a text file. In my example I used “Easyhash.txt” and
    placed them in the Desktop directory. I also copied the “RockYou.txt” password
    dictionary from the “/usr/share/wordlists” file to the desktop.


    (Remember the RockYou.txt file is compressed, so if you haven’t done so already,
    you will need to uncompress it using the “gunzip” command. The Wordlists chapter
    for more information.)


    We are going to run Hashcat, but we need to tell it a few things. We need to tell
    it what type of hashes we are using, the name of the hash file, the name of the
    dictionary file and finally the output filename to store the cracked hashes.


    You can see the different options by opening a terminal window and typing “hashcat
    --help”.


    Let’s get ahead and try to crack the hashes listed above.


    - 1. Open a terminal, navigate to the Desktop directory and type, “hashcat -m
    1000 Easyhash.txt rockyou.txt -o cracked.txt”


    ```

    root@kali:~# hashcat -m 1000 Easyhash.txt rockyou.txt -o cracked.txt

    ```

