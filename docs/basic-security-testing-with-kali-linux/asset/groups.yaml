    ## Conclusion


    BeEF can be a very interesting to play with and fairly easy to use once you get
    the hang of it.


    The attacks are color coded to the chance that they might work. You may want to
    try them anyways, as I have noticed that some coding not working seemed to work
    okay on occasions.


    I also noticed that newer browsers seemed to stop some of the attacks, but XP
    was still pretty open to what would work against it.


    I tried these exact attacks against a Windows 7 system using the latest Firefox
    browser and nothing was displayed:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_120_0.png)


    A hook was created, but only lasted for about a second or two before it was dropped.


    The best mitigation against this type of attack seems to be use the latest Windows
    OS and browser versions. If you can, update or replace your Windows XP systems,
    especially if they are used online.


    The base security in Windows 7 and 8 is much better than Windows XP.


    Finally always run a script blocker like the Firefox Add-In, “NoScript”, and don’t
    click on or open links and attachments in unsolicited email and social media.


    ## Social Engineering


    ### Introduction


    Social Engineering is the art of manipulating people to gain information or access.
    It is the psychological manipulation of people into performing performing actions
    or divulging confidential information.


    There are many types of social engineering attacks, some of the most common being:


    - Phishing: This is the most common type of social engineering. The attacker sends
    a fraudulent email appearing to be from a reputable source to steal sensitive
    information.

    - Spear phishing: This is a targeted form of phishing where the attacker targets
    a specific individual or organization.

    - Whaling: This is a type of spear phishing attack that targets high-level executives,
    such as CEOs, CFOs, and COOs.

    - Pretexting: In a pretext attack, the attacker creates a fabricated scenario
    to gain the victim''s trust.

    - Tailgating: This occurs when an attacker follows an authorized person into a
    restricted area.

    - Baiting: This involves leaving a infected device, such as a USB drive, in a
    public place where someone will pick it up.

    - Quid pro quo: This involves the attacker offering a service or benefit in exchange
    for information or access.

    - Social media-based attacks: This is the practice of using social media platforms
    to gather information about a target and craft convincing attacks.


    Here are some examples of social engineering:


    - You are the CEO of a major company. One day you get a package in the mail from
    a company you do business with. It was a gift thanking you for the business. You
    open it up to find one of the tablets along with a note. own- You get an e-mail
    from the IT manager at your company. They are installing some software and need
    to install some new drivers. They include the software package as an attachment
    and give you full directions to install it. Which you do. The e-mail wasn''t actually
    from your IT manager and you just a remote hacker complete control of your workstation.

    - You are in the cafeteria. An attacker approaches you wearing a shirt and tie,
    carrying a clipboard. He says he is performing upgrades and needs access to your
    system. You let him.

    - You are on the way into your office building. An attacker follows an authorized
    person into a restricted area. You let him.

    - Baiting: This involves leaving a infected device, such as a USB drive, in a
    public place where someone will pick it up. Someone picks it up and plugs it into
    their computer.


    We say that the victim is on a New York Giants football page, even when being
    from New York like we don''t, and we want them to be sent to the Dallas Cowboy’s
    homepage when they click any of the links.


    ## Resources


    - http://www.socialengineer.org/


    ## Social Engineering Defense


    With that being said, it is imperative to train your employees to be on the lookout
    for these types of attacks. Have policies in place to deal with service calls,
    software updates, and gifts from outside companies.


    You can teach, instruct and even leave reminder messages and posters, but employees
    may still not follow corporate policy. That is why when it comes to social engineering
    attacks, it is a good idea to manually test to see if your company is truly prepared.


    In this section we will look at a couple programs in Kali that corporate security
    teams can use to test their company’s preparedness against these types of attacks.

