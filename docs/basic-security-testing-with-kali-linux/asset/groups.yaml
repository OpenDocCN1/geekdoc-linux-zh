    # Chapter 12 – Using the Browser Exploitation Framework


    # Resources


    +   - Browser Exploitation Framework (BeEF) Website - http://beefproject.com/


    Introduction

    The internet it can be a very unfriendly place, especially for older operating
    systems like Windows XP. In this post we will take a look at exploiting Windows
    XP browsers using “BeEF”, the Browser Exploitation Framework.


    It has been a long time since I have played with BeEF, about three years in fact,
    after going through a great Web Application and XSS security class, I figured
    it was time to brush it off.


    I was very pleased to find that ton of new features (called commands) have been
    added to BeEF since I last used it, dramatically increasing its functionality.


    Granted many attacks in BeEF no longer seem to work against Windows 7 using the
    latest browsers, but it appears that Windows XP systems are still very vulnerable
    to many of the browser attacks, even when using the latest browsers.


    So let''s see what BeEF can do against a Windows XP system.


    # BeEF in Action


    First we need to start the Exploitation Framework.


    +   1. In Kali, just open a terminal and type:


    ```

    root@kali:# cd /usr/share

    root@kali://usr/share# cd beef-xss/

    root@kali://usr/share/beef-xss# ./beef

    ```


    This starts the BeEF server and shows you the web address to open the graphical
    user interface and a couple sample pages that you can use to hook browsers:'
