    # Metasploit Overview


    You can start Metasploit a couple of different ways, from the menu or from a terminal
    prompt.


    +   - Kali Linux/Top Ten Security Tools/Metasploit framework

    - /Kali Linux/Exploitation Tools/Metasploit

    - Or just "msfconsole" in a terminal


    Once Metasploit loads you will see the following main screen and be given an "msf>"
    prompt.


    ```

    root@kali:~# msfconsole

    II   db.tb

    II   a'' v b

    III  f

    IV   t.np

    V    Te.Tp\p

    IIII  vP

    IIIII


    I love shells --egypt

    -- = metasploit v4.7.1-2013100901 [core:4,7 api:1.0]

    -- = 1206 exploits 728 auxiliary 201 post

    -- = 314 payloads 39 encoders 8 rops

    KALI LINUX

    msf >

    ```


    Metasploit can be a little confusing if you have never used it before, but once
    you get used to know how it works, you can do some amazing things with it.


    Basically, using Metasploit to attack a target system usually involves:


    +   1. Picking an Exploit

    2. Setting Exploit Options

    3. Picking a Payload

    4. Setting Payload Options

    5. Running the Exploit

    6. Connecting to the Remote System

    7. Performing Post Exploitation Processes


    The screenshot below shows an example of this process, but don’t worry; we will
    cover the process in much more detail we as we go along.'
  - '[PAGE 33]


    Depending on the type of exploit, once our exploit is complete we will normally
    end up with either a remote shell to communicate or a Meterpreter.


    A remote shell is basically a remote terminal connection or a text version of
    a remote desktop for Windows users. It allows us to enter commands as if we are
    sitting at the keyboard.


    But a Meterpreter offers a ton of interesting programs and utilities that we can
    run to get information about the target machine, control devices like the webcam
    and microphone, or even use this foothold to get further access into the network.


    And of course, if needed, you can drop to a regular shell at any time.


    In most cases, depending on what you are trying to do, a Meterpreter Shell is
    much more advantageous than just a regular shell.


    We will discuss the Meterpreter Shell later, but for now let''s quickly cover
    the first five steps.


