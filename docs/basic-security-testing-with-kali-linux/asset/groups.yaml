    # Chapter 5 – Recon Tools


    # Resources


    +   - Recon-NG Wiki Page - https://bitbucket.org/LaMNaSteR53/recon-ng/wiki/Home


    # Introduction


    There are several tools in Kali Linux to aid in information gathering and reconnaissance.
    When a hacker attacks a target one of the normal stages they perform is information
    gathering. They want to learn as much about your network, their target, as they
    can, to make their lives easier.


    Maltego is a very popular tool one that is covered quite a bit in security books
    and training seminars. It already has a lot of coverage, I figured we would look
    at some of the other tools included in Kali.


    In this chapter we will look at one of the newer tools, Recon-NG and a couple
    of other tools that come with Kali.


    # Recon-NG


    The Recon-NG Framework is a powerful tool that allows you to perform automated
    information gathering and network reconnaissance. Think of it as Metasploit for
    information collection.


    Recon-NG automates a lot of the steps that are taken in the initial process of
    a penetration test. It has numerous features that allow you to collect user information
    for social engineering attacks, and network information for network mapping and
    much more.


    You can automatically hit numerous websites to gather passive information on your
    target and even actively probe the target itself for data.


    Anyone who is familiar with Metasploit will feel right at home as the interface
    was made to have the same look and feel. The command use and functions are very
    similar. Basically you can use Recon-NG to gather info on your target, and then
    attack it with Metasploit.


    # Using Recon-NG


    To start recon-ng, just open a terminal prompt and type, "recon-ng":'
  - '[PAGE 63]


    ```

    root@kali:~# recon-ng


    [recon-ng v1.41 Copyright (C) 2013, Tim Times (@LaNMaSteR53)]


    [6] Recon modules

    [7] Discovery modules

    [4] Reporting modules

    [1] Experimental modules


    recon-ng > _

    ```


    Type, "help" to bring up a list of commands:


    ```

    recon-ng > help

    Commands (type [help?]| <topic>):

    back            Exits current prompt level

    banner          Displays the banner

    exit            Exits current prompt level

    help            Displays this menu

    info            Displays module information

    keys            Manages framework API keys

    load            Loads selected module

    query           Queries the database

    record          Records commands to a resource file

    reload          Reloads all modules

    resource        Executes commands from a resource file

    run             Not available

    search          Searches available modules

    set             Sets global options

    shell           Executed shell commands

    show            Shows various framework items

    use             Loads selected module

    recon-ng > _

    ```


    Now, like Metasploit, you can type "show modules" to display a list of available
    modules:'
  - '[PAGE 64]


    # recon-ng > show modules


    ```

    Discovery

    discovery/exploitable/http/dnn_fcklinkgallery

    discovery/exploitable/http/generic_restaurantmenu

    discovery/exploitable/http/webziz_rte

    discovery/info/disclosure/cache_snnoop

    discovery/info/disclosure/dns

    discovery/info/disclosure/http/backup_finder

    discovery/info/disclosure/http/google_ads

    discovery/info/disclosure/http/interesting_files

    ```


    ```

    Experimental

    ----------experimental/rce

    ```


    ```

    Recon

    recon/contacts/enum/http/web/dev_diver

    recon/contacts/enum/http/web/namechk

    recon/contacts/enum/http/web/pwdlist

    recon/contacts/enum/http/web/should_change_password

    recon/contacts/gather/http/api/jsigsaw/point_usage

    ```


    Some of the modules are passive; they never touch the target network. While some
    directly probe and can even attack the system you are interested in.


    One tactic used to passively probe network structure is to use the Google search
    engine to enumerate site sub-domains. You know that there will be a main domain
    like “some_target.com” but what other subdomains are out there?


    You can do a Google search for subdomains using the “site:” and “inurl:” switches.
    Then remove sub-domains (-inurl) that you find, so other subdomains will appear.
    This can take a while to do by and require a lot of typing if the target has a
    large number of sub-domains.


    Recon-NG will do this for you automatically and record what it finds in a database.


    Just use the “recon/hosts/gather/http/web/google_site” module. Then “show options”
    to see what the module requires.


    ```

    recon-ng > use recon/hosts/gather/http/web/google_site

    recon-ng [google_site] > show options

    ---------------------------------------

    Name     Current Value Req Description

    DOMAIN             yes target domain

    recon-ng [google_site] >

    ```


    This one requires the target domain.

    as In Metasploit


    ```

    recon-ng [google_site] > set DOMAIN SomeDomainName.com\DOMAIN => SomeDomainName.com

    recon-ng [google_site] > run

    ```


    You will then see a screen like the simulated one below:'
- md: '

    ```text

    As you can see from the screenshot above, Recon-NG is enumerating the sub-domains
    for a fictitious website called "DomainName". Within seconds, several of the sub-domains
    are listed.


    All the data collected by Recon-NG is placed in a database. You can create a report
    to view the data.


    Just type in “back” to get out of the current module:


    ```

    [* 46 total hosts found.

    [*] 46 NEW hosts found!

    recon-ng [google_site] > back

    recon-ng > |

    ```


    And then “show modules” again.


    Notice the “Reporting” section:


    ```

    Reporting

    ------

    reporting/csv_file

    reporting/html_report

    reporting/list

    reporting/pushpin

    ```


    Simply use one of the report modules to automatically create a nice report of
    the data that you have obtained.


    ```

    recon-ng > use reporting/csv_file

    recon-ng [csv_file] > run

    46 records added to ''/usr/share/recon-ng/workspaces/default/results.csv''

    ```


    All the files will be stored in the “/usr/share/recon-ng/workspaces/default” directory.


    ## Recon-NG wrap up


    Sub domain enumeration is only one module you can run, there are many others to
    choose from. There are some that require a program API key like Twitter, Shodan,
    LinkedIn or Google. Using these you can get specific information from the corresponding
    sites about your targets.


    for example can search Twitter tweets from your target or even check Shodan for
    open systems.


    I have just briefly touched on some of the capabilities of Recon-NG. It is really
    an impressive tool that is well worth checking into.


    ## Dmitry


    Dmitry is a nice little tool for quickly finding out information about a site.
    Just run Dmitry from the menu or command line.


    ![](img/ff9cd19afe449ae54278ee429e668a6f_66_0.png)


    "dmitry -s SomeDomainName.com" will perform a similar scan as demonstrated in
    the Recon-NG section.


    ## Netdiscover


    ![](img/ff9cd19afe449ae54278ee429e668a6f_66_1.png)


    Netdiscover is another neat tool included in Kali. It can too be run from the
    command prompt or from the menu system.


    Netdiscover scans a network looking for devices and displays them:


    Currently scanning: 172.168.0.1/24 Screen View: Unique Hosts

    4 Captured ARP Request packets, from 3 hosts. Total size: 240


    | IP | At Mac Address Count | Len | MAC Vendor |

