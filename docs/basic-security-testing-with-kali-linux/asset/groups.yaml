    当然，如果需要，你可以随时切换到普通的 shell。


    在大多数情况下，取决于你想做什么，Meterpreter Shell 比比普通的 shell 更有优势。


    我们稍后会讨论 Meterpreter Shell，但现在让我们先快速涵盖前几个步骤。


