    3. Now select the Wi-Fi button you want to attack and a list of detected APs will
    show up. We have a lab WPA 2 router up and named “Vulnerable Router” that we will
    use in this example.


    ![](img/ff9cd19afe449ae54278ee429e668a6f_229_0.png)


    4. Next select the “Regular Attack” button, and pick a dictionary file (common.txt
    is included with Fern).


    5. And finally click “WiFi Attack”.


    Fern will then Deauthenticate a client from the AP so it can capture an authentication
    key when the computer tries to reconnect. It then tries to crack the key using
    the dictionary file provided.


    If the dictionary file contains the password you should see this:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_229_1.png)


    **WPA Key: password** – Wow, a password of “password”, not a smart way to secure
    anything. You would definitely not want an AP like that attached to your corporate
    network.


    We now have the access key to the Wi-Fi network, and depending on the level of
    testing needed, could continue to penetrate deeper into the network if necessary.'
  - '[PAGE 230]


    As mentioned above, MAC filtering is not an effective means of securing a wireless
    network. If you look in earlier, across from ‘Handshake Captured’, you can see
    that Fern was kind enough to give us the MAC addresses of any client connected
    to the API in the drop down box.


    # # Conclusion


    In this section we learned how to install and run Kali Linux on a Raspberry Pi
    Computer. We also learned how to connect to it remotely from a Windows system
    and use it to run some basic wireless pentesting with Fern.


    Hopefully we demonstrated that trying to hide your wireless network or MAC filtering
    for security are not effective means of protecting your network. Also Fern WiFi
    cracker would make short work of any wireless AP protected by a weak password
    key.


    If an attacker can gain access to your network via Wi-Fi, they could use the foothold
    to attack deeper into your infrastructure. It is imperative to use strong complex
    WPA2 passkeys for small to medium businesses and home offices, or RADIUS servers
    in a corporate environment.


    You should also scan your network frequently to be sure there are no rogue or
    “employee installed” access points on your network. Testing your network for rogue,
    or weakly secured access points should be a part of every company’s security routine.


    While Wi-Fi pentesting on a Raspberry Pi may not make the most sense for large
    companies, but it is a very cost effective solution. To be able to run Kali on
    a credit card size $35 computer and be able to test wireless security with it
    is just incredible.


    It could also be a very interesting solution for professional pentesters. The
    Pi comes with one, but two USB adapters. And if paired with battery power, could
    be used in many creative ways.'
