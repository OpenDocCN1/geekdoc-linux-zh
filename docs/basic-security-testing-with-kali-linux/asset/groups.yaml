    # Introduction


    Recently, there have been several critical vulnerabilities discovered in very
    common network routers. They are, in most cases, the first line of defense for
    a network, so I think it important to spend some time about them.


    We will take a look at a couple ways that Routers and Wireless Networks are attacked.


    In this chapter we will look at “Routerpwn”, a website that contains executable
    exploits for routers. We will then look at attacking Wi-Fi Protected Setup (WPS)
    - a push button or PIN based method of setting up WPA/WPA2 networks.


    Then over the next chapters we will cover attacking Wi-Fi networks in more depth.


    But first let’s talk a little bit about Router passwords.


    # Router Passwords


    Of all devices, routers are one of the most important devices to secure with a
    long complex password.


    Multiple websites exist that contain default passwords for network devices. The
    first thing a drive-by hacker (someone looking for an easy hit) will do is try
    credentials for internet facing devices.


    And sadly, many times they will work!


    Some industry experts recommend a password of 12-15 mixed symbols, numbers and
    upper/ lower case characters for a good password. I would easily recommend at
    twice that many for a mission critical internet facing router.


    I also recommend turning off remote web management, when not needed. This immediately
    blocks changes to the router being made from over the internet.


    # Routerpwn


    Though not included in Kali, Routerpwn.com is probably one of the easiest to use
    for finding Router exploits. The webpage contains router exploits by manufacturer
    and multiple tools & utilities including password key generators.'
