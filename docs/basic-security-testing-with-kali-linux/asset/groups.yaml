    ones, just poke around the `/usr/share/` directory and see what you can find.


    # Wordlist Generator


    Several tools in Kali let you make your own personalized wordlists. CeWL is pretty
    nice as it lets you create passwords by grabbing information from a target website.
    Crunch is nice too as it allows you to create your own custom wordlists from scratch.


    In this section we will take a look at Crunch.


    # Crunch


    Crunch is a great program that allows you to create your own password lists. Simple
    crunch what you want, the length and complexity, and crunch makes it for you!


    To pull up the Crunch help page, you have to use the manual command:


    ```bash

    root@Kali:~# man crunch

    ```


    # CRUNCH(July 2012)


    ## NAME

    crunch


    ## SYNOPSIS

    <min-len> <max-len> [options]


    ## DESCRIPTION

    Crunch can create a wordlist based on criteria you specify. The output from crunch
    can be sent to the screen, file, or to another program.


    ## OPTIONS


    min-len

    The minimum length string you want to start at. This option is required even for
    parameters that won''t use the value.


    max-len

    The maximum length string you want to end at. This option is required even for
    parameters that won''t use the value.


    But basically all we need to tell crunch is the minimum and maximum length and
    what type of characters to use.


    Crunch also makes heavy use of the charset.lst file that is located in its install
    directory `/etc/share/crunch`. So you will need to either run crunch from that
    directory or point to the directory with the `-f` switch when using the more advanced
    character sets (shown below).


    Alright, let''s start with an easy one.


    For example:


    ```bash

    root@Kali:~# crunch 1 3 -o ThreeLetters.txt

    ```


    Will produce something like this:


    - - a, b, c, d, e, f, g, h, i, j, et...

    - aa, ab, ac, ad, ae, af, ag, ah, ai, aj, et...

    - aaa, aab, aac, aad, aae, aag, aah, aai, aaj, et...


    Basically crunch starts out with a single letter “a” and cycles through all permutations
    until it gets to “zzz".


    If we play around with the options we can create some more complex lists, for
    example:


    ```bash

    root@kali:/usr/share/crunch$ crunch 3 4abcd1234 -o alphaNumeric.txt

    Crunch will now generate the following amount of data: 35721 bytes

    0 MB

    0 GB

    0 TB

    0 PB

    Crunch will now generate the following number of lines: 7290

    100%

    ```


    Would create a wordlist that starts with “aaa” and ends with “4444” creating alphanumeric
    combinations like aal, bb3, 2a21, and e3da.


    We use the charset.lst file so we don''t have to type in all the characters that
    we actually want to use if we "cat charset.lst" we can view commands that are
    available:


    ```bash

    root@kali:/usr/share/charset# cat charset.lst

    # charset configuration file for winrtgen v1.2 by Massiliano Montoro (maoox<

    # compatible with rainbowcrack 1 and later by Zhu Shanglei <shangelei@hotmail.com>


    hex-lower = [0123456789abcdef]

    hex-upper = [0123456789ABCDEF]

    numeric = [0123456789]

    numeric-space = [0123456789 ]

    symbols1 The quieter = [!@#$%^&()_+-={}\|;'':",.<>?/?]

    symbols14 = [!@#$%^&()_+-=]

    symbols-all = [!@#$%^&()_+-={}\|;;'':",.<>?/?]

    symbols-all-space = [!@#$%^&()_+-={}\|;;'':",.<>?/?]

    alpha = [ABCDEFGHIJKLMNOPghijklmnopqrstuvwxyz]

    alpha-space = [ABCDEFGHIJKLMNOPghijklmnopqrstuvwxyz]

    ```


    We can use any of the defined sets, for example:


    ```bash

    root@kali:/usr/share/crunch# crunch 2 4 -f charset.lst alpha-numeric-all -o mix.txt

    Crunch will now generate the following amount of data: 393724 bytes

    375 MB

    0 GB

    0 PB

    Crunch will now generate the following number of lines: 78916

    ```


    This took a little while, but created a wordlist that cycled through 2 to 4 character
    words contained all letters, numbers and symbols. meaning that you can start each
    password with a certain word, or have the first part and last part. Not really
    critical to do this, as some of the more advanced cracking programs will do this
    automatically.


    # Download Wordlists


    If none of the above information helps or if you want more wordlists, you can
    also download them from the web to use in Kali. Two of the best sites I have seen
    are Skull Security and CrackStation.


    - **Skull Security:** http://www.skullsecurity.org/wiki/index.php

    - **CrackStation:** https://crackstation.net/buy-wordlist-dictionary.htm has a
    couple, with one being what I call the mother of all wordlists, 15GB monster!


    # Conclusion


    Many times cracking programs work much better with one wordlists. In this section
    we covered how to find and create these lists. If you have the time and patience
    you can create a very large list. When all else fails the internet provides some
    great wordlists that you can download and use.


