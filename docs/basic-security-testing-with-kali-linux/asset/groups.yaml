    # TELNET


    The Telnet version scanner can function in a couple different ways. If we use
    a username and password, it will try to log in to the service. If we don''t it
    will just do a banner grab.


    Notice that this is unlike the others we have covered so far; on the Metasploitable
    machine it does not return a version number, it performs a banner grab.


    But sometimes you can find some very interesting information by using it.


    Let''s set the scanner up:'
  - '[PAGE 91]


    ```

    msf auxiliary/scanner/telnet/telnet_version) > show options

    Module options(auxiliary/scanner/telnet/telnet_version):

    | Name     | Current | Required | Description |

    |----------|---------|-----------|----------------------------|

    | PASSWORD |         | no        | The password for the specified username |

    | RHOSTS  |         | yes       | The target address range or CIDR identifier
    |

    | THREADS | 23      | yes        | The number of concurrent threads |

    | TIMEOUT | 30      | yes        | Timeout for the Telnet probe |

    | USERNAME|         | yes       | The username to authenticate as |

    msf auxiliary(telnet version) > set RHOSTS 192.168.198.145

    ```


    Now, when we type exploit we see this:


    ```

    msf auxiliary(telnet version) > exploit

    [*] 192.168.198.145:148:45:23 TELNET

    \x0a\x0a//\x0a\x0a|\x0a|||____|\x0a\x0a@Warning: Never expose this VM to an untrusted
    network\x0a@Contact: msfadminw@metasploitable/msfadmin/msfadmin to get started\x0a@x0a

    [+] Vulnerability found: Exploitable!\x0a

    [*] Scanned 1 of hosts (100% complete)

    [*] Auxiliary module execution completed |

    ```


    Just likes a bunch of text with no hint as to what level of software is running.
    But if we look closer, we can see something else:


    **Login with msfadmin/msfadmin to get started**


    “Login with msfadmin/msfadmin to get started”, looks like they are giving away
    the login credentials on the Telnet page:


    Are you kidding me?


    Let''s try it and see if it works:


    ```

    root@metasploitable:~$ telnet -1 msfadmin 192.168.198.145

    Connected to 192.168.198.145.

    Escape character is ''}\''.

    Password:

    Last login: Wed Oct 23 24:48:53 EDT 2013 server66 on tty1

    Linux metasploitable 2.6.0-26-kernel#1 SMP Thu Apr 10 13:58:00 UTC 2006 i686

    The programs included with the Ubuntu system are free software; the explicit distribution
    terms for each program are described in the individual files in /usr/share/doc/*~/copyright.

    Ubuntu comes with ABSOLUTELY NO WARRANTY, to the extent permitted by applicable
    law.

    To access official Ubuntu documentation, please visit:

    http://help.ubuntu.com/

    No mail.

    msfadmin@metasploitable:~$

    ```


    And we are in!'
