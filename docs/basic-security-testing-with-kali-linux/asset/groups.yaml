    Wireshark is great for analyzing network communications, and you can do a lot
    with it, but it is a bit advanced for a new user and might be hard to use until
    you become familiar with it.


    So, let’s look at our packet capture in last program. The program, Xplico, lists
    all the information from the packet capture in an easy to read menu. It also allows
    you to view any images or documents.


    # Xplico


    Xplico has been added to Kali repositories, but it may not be installed on your
    system yet. It is a web based interface, so to start it, you need both the Apache
    Web Server and Xplico server started.


    Under “System Services” in the Kali Menu, you should see both HTTP (Apache) and
    Xplico listed.


    If Xplico is not listed you will need to install it. To install, run the following
    command:


    ```

    root@kali:~# apt-get install xplico

    ```'
