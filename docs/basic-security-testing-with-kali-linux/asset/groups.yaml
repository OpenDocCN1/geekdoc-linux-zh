    ```


    如你所见，它正确地判断出目标是一个 VMware 虚拟机。


    # GETGUI:


    Getgui 是一个很巧的小脚本，它允许你在 Windows 机器上启用远程桌面（如果尚未启用）并创建一个远程桌面用户。


    该用户会被同时添加到远程桌面用户组和管理员组。如果你想在日后某天连接回这台机器，这非常方便。


    首先，运行“run getui-e”来启用桌面：


    ```

