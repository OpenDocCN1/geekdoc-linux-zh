    # Welcome to the New Virtual Machine Wizard

    A virtual machine is like a physical computer; it needs an operating system. How
    will you install the guest operating system?


    Install from:

    Installer disc:

    DVD RW Drive (D:)

    Insert the installer disc into this drive to continue.


    Then just install Windows 7 as usual.

    When done, you will have a Windows 7 Virtual Machine:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_26_0.png)


    Check the network settings on it to make sure that too is using NAT for networking:


    | Device | Summary |

    |---|---|

    | Memory | 1 GB |

    | Processors | |

    | Hard Disk (SCSI) | 40 GB |

    | CD/DVD (IDE) | Auto detect |

    | Floppy | Auto detect |

    | Network Adapter | Auto detect |

    | USB Controller | Present |

    | Sound Card | Auto detect |

    | Printer | Present |

    | Display | Auto detect |


    Play the virtual machine and run “ipconfig” from a Windows 7 Command Prompt to
    see what its IP address is:


    Microsoft Windows [Version 6.1.7601]


    Copyright (c) 2009 Microsoft Corporation. All rights reserved.


    C:\Users\Fred>ipconfig


    Windows IP Configuration

    Ethernet adapter Local Area Connection:


    IPv4 Address. . . . . . . . . . . . : 192.168.198.130


    And finally if you want, install the VMware Tools for Windows when prompted:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_27_0.png)


    That''s it, you should now have three virtual machines in a mini-network that
    you can use to practice and learn basic offensive security pentesting techniques.


    # Install Wrap Up


    In this section we learned how to install VMware Player as a virtual host. We
    then installed Kali Linux, Metasploitable 2 and Windows 7 as separate virtual
    machines on the host.


    We set them up to use the same networking (NAT) so that they can communicate with
    each other and out to the internet if needed.


    We will use this setup throughout the rest of the book.


    Just as a reminder, with VMware’s DHCP, IP addresses of the systems may change
    when we reboot them. I used this partially because you will always be using different
    target IP addresses in the real world. But if you get lost, you can run "ifconfig"
    (Linux) or "ipconfig" (Windows) on the VM to find the changed IP address.


    And finally, never run Metasploitable directly on the internet as it is purposefully
    vulnerable.


    # Quick Desktop Tour


    Let''s take a moment and take a short tour of the Kali menu and interface.


    One of the biggest things you will notice when installing is that Kali is based
    off of Debian Linux, instead of Ubuntu, which earlier versions were based on.
    If you were used to Backtrack, the desktop still uses Gnome, but it seems to have
    a different look and feel to it.


    # Top Menu Bar


    We will start our tour with the top menu bar.


    The top menu has the Applications menu which is the main gateway to access all
    the included programs in Kali, the Places menu which allows you to navigate around
    the file system. The Firefox web browser is next, and a shortcut to the Terminal
    prompt follows.


    In the middle is the date and time, followed by a volume control icon on the right
    side, a Network icon, where you can view and edit your network connections and
    finally your user menu where you can access system settings, switch users or log
    out.


    # Applications Menu


    The Applications menu is the main menu in Kali.


    ![](img/ff9cd19afe449ae54278ee429e668a6f_28_0.png)


    Under this menu you find the following main menus:


    - Accessories menu includes the normal tools you would expect to find in an operating
    system.

    - Electronics tab contains a programming utility for the Arduino board.

    - Kali Linux is the main menu to access the security programs.

    - System Tools contain system administrator tools and preferences.


    The rest are pretty self-explanatory.


    # Kali Linux Menu


    Of most importance to us, the Kali Linux menu option is where you will find most
    of the security tools.


    ![](img/ff9cd19afe449ae54278ee429e668a6f_29_0.png)


    A quick peek at the menu shows that a Top Ten Security Tools** menu has been added
    to Kali so you can get into your favorite tools faster.


    Aircrack-ng, Burpsuite, Metasploit, Nmap, Wireshark and several other top programs
    are now right at your fingertips.


    If you are familiar with the original Backtrack don''t worry, all the regular
    tools are still present in a menu system very similar to the one Backtrack used.


    To navigate the menu, just find the topic you want, for example Information Gathering
    and follow the menu across until you find the utility you want:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_30_0.png)


    Following down the main menu branch you will see that the tools are sorted by
    type. Web Application testing programs can be found in the Web Applications menu
    option, as Password related security programs are under the Password Attacks menu
    and so on.


    # Conclusion


    If you want, it would be a good idea to take a few minutes and surf the menu system
    until you are familiar with its layout.


    Many, if not most of the programs can be run directly from the command prompt,
    and there are additional programs included in Kali that are not in the menu system.
    We will cover several of the utilities that come with Kali. We will also cover
    a few that have not been added in yet, but are very good tools for any security
    tester.


    # Part 2 - Metasploit Tutorial


    # Chapter 3 – Introduction to Metasploit


    # Resources


    Metasploit Information


    - http://www.offensive-security.com/metasploit-unleashed/Main_Page

    - http://www.offensive-security.com/metasploit-unleashed/Msfconsole_Commands


    Security Bulletin Sites


    - http://cve.mitre.org/

    - http://technet.microsoft.com/en-us/security/bullet


    # Introduction


    For the security testing community, Metasploit (and Metasploit Pro) is one of
    the coolest things since sliced bread. Metasploit gives you a complete framework,
    or playground for security testing.


    ![](img/ff9cd19afe449ae54278ee429e668a6f_31_0.png)


    ```

    msf >

    ```

    + = metasploit v4.7.8-2018039101 [core:4.7 api:1.0]

    + --= 1169 exploits - 643 auxiliary - 186 post

    + --= 312 payloads - 30 encoders - 8 nops

    ```


    The Metasploit Framework is a comprehensive platform for performing vulnerability
    testing, and exploitation. It is loaded with over a thousand exploits, hundreds
    of payloads and multiple encoders.


    We will cover the basics of using Metasploit in this chapter, and then in a later
    chapter see how to use Metasploit against a test target. If you are already familiar
    with Metasploit then feel free to skip this chapter or use it as a refresher.


    # Updates


    Normally to update Metasploit, you simply run "msfupdate", but according to the
    Rapid 7 website, Metasploit updates are synced to update with Kali.


    (https://community.rapid.com/thread/30)


    # Metasploit Overview


    You can start Metasploit a couple of different ways, from the menu or from terminal.


    Once Metasploit loads you will see the following screen and be given a prompt:


    ```

    msf >

    + = metasploit v4.7.8-2018039101 [core:4.7 api:1.0]

    + --= 1169 exploits - 643 auxiliary - 186 post

    + --= 312 payloads - 30 encoders - 8 nops

    ```


    When all else fails and you want to start feel lost in Metasploit, or the Meterpreter
    shell, try typing the “help” command.

    You can also use the “tab” key to autocomplete a line or hit twice to show all
    available exploits and payloads.


    The the systems may change when we reboot them. I used this partially because
    you will always be using different target IP addresses in the real world. But
    if you get lost, you can run "ifconfig" (Linux) or "ipconfig" (Windows) on the
    VM to find the changed IP address.


    And finally, never run Metasploitable directly on the internet as it is purposefully
    vulnerable.


    # Quick Desktop Tour


    Let''s take a moment and take a short tour of the Kali menu and interface.


    One of the biggest things you will notice when installing is that Kali is based
    off of Debian Linux, instead of Ubuntu, which earlier versions were based on.
    If you were used to Backtrack, the desktop still uses Gnome, but it seems to have
    a different look and feel to it.


    # Top Menu Bar


    We will start our tour with the top menu bar.


    The top menu has the Applications menu which is the main gateway to access all
    the included programs in Kali, the Places menu which allows you to navigate around
    the file system. The Firefox web browser is next, and a shortcut to the Terminal
    prompt follows.


    In the middle is the date and time, followed by a volume control icon on the right
    side, a Network icon, where you can view and edit your network connections and
    finally your user menu where you can access system settings, switch users or log
    out.


    Using Metasploit to attack a target usually involves:

    1. Picking an Exploit

    2. Setting Exploit Options

    3. Picking a Payload

    4. Setting Payload Options

    5. Running the Exploit

    6. Connecting to the System

    7. Performing Post Exploitation


    Depending on the type of exploit, once our exploit is complete we will normally
    end up with either a remote shell or a Meterpreter.


    A remote shell is basically a terminal connection or a text version of a remote
    desktop for users. It allows us to enter commands as if we are sitting at the
    keyboard.


    But a Meterpreter offers a ton of interesting programs and utilities that we can
    run to get information about the target machine, control devices like the webcam
    and microphone, or even use this foothold to get further access into the network.


    And of course, if needed, you can drop to a regular shell at any time.


    In most cases, depending on what you are trying to do, a Meterpreter Shell is
    much more advantageous than just a regular shell.


    We will discuss the Meterpreter Shell later, but for now let''s quickly cover
    the first steps.

