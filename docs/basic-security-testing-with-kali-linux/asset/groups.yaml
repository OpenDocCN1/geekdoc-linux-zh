    - 2. 指定服务器所在的国家位置，同样可以使用 country 命令进行搜索。

    - 3. 主机名搜索命令可以根据域名搜索服务器。

    - 4. 正文区域。输入到 Shodan 中的任何未加过滤器的文本都将被视为正文内容搜索，并将查找在正文区域中请求过请求信息的服务器。


    ## 过滤器命令


    让我们仔细查看过滤器命令。


    （要使用这些命令或获取超过一页的结果，你需要注册一个免费的 Shodan 账号。）


    > CITY 和 COUNTRY 命令


