    使用 Metasploit 攻击目标通常涉及：

    1. 选择漏洞（Exploit）

    2. 设置漏洞选项

    3. 选择有效负载（Payload）

    4. 设置有效负载选项

    5. 运行漏洞

    6. 连接到系统

    7. 执行后渗透


    根据漏洞的类型，一旦我们的利用完成，我们通常会获得一个远程 shell 或 Meterpreter。


    远程 shell 基本上是一个终端连接或远程桌面的文本版本。它允许我们像坐在键盘前一样输入命令。


