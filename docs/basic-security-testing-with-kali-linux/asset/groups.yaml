    So if you want to follow along on the Windows 7 (or XP) sections you will need
    to install a licensed copy of Windows 7 in VMware Player.


    I will not cover installing Windows 7 in VMware Player, but basically all you
    need is your Windows 7 CD and install Key, and do a full install from disk by
    clicking “New Install” and then pointing to your CD Rom drive:

