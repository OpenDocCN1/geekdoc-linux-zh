    > For cleanup command: run multi_console_command -rc /root/.msf4/logs/scripts/getui

    1/clean.up 20131102.5019.rc

    ```


    现在我们只需要打开终端并运行 Kali 自带的“rdes”命令来连接到 Windows 远程桌面：


    ```

