    好的，它破解了空密码、“P$$word”以及“NameIsBob”。剩下的两个密码相当难破解。它使用了特殊字符、大小写字母和一个数字（$Count!），最后一个非常长，接近
    30 个字符。


    ## 更高级的破解


    仅仅将字典文件丢哈希可以恢复一些简单的密码，但要获取更难的，你需要使用更高级的技术。我不会详细介绍它们，但 Hashcat 允许你使用多种攻击类型：


    - 多个字典列表

    - 规则集

    - 密码掩码


    **攻击类型：**“-a”选项允许你从以下选项指定要使用的攻击类型：


    - 0 = 直射（Straight）

    - 1 = 组合（Combination）

    - 2 = 大小切换（Toggle-Case）

    - 3 = 暴力破解（Brute-force）

    - 4 = 排列（Permutation）

    - 5 = 表查询（Table-Lookup）


    大部分都是自显明的。组合攻击允许你组合字典中的单词来创建新单词。


    规则攻击非常有用。Hashcat 有一组内置规则，你可以用它们来破解字典单词并尝试不同的 leet speak 版本。你甚至可以使用编程语言创建自己的规则集。


    基于规则的攻击通过使用“r”开关并包含你所需的规则名称启用。Best64.rule、passwordpro.rule、d3adone.rule 和 leetspeak.rule
    是一些常用的规则。例如：


    ```

    root@kali:~/crack# hashcat -m 1000 rockyou.txt -r leetspeak.rule -o cracked.txt

    ```


    掩码攻击允许你定义攻击中使用的布局。例如，如果你知道密码策略要求两个数字、六个字母和两个特殊字符，你可以为 Hashcat 创建一个掩码。在这个例子中，它看起来像
    ?d?d?u?u?u?u?s：


    ```

    root@kali:~/crack# hashcat -m 1000 -a 3 hash.txt ?d?d?u?u?u?u?s -o cracked.txt

    ```


    尝试不同的选项，直到你熟悉它们是如何运作的。某些攻击（尤其是暴力破解攻击）可能花费永远的时间。如果你有兼容的显卡，请使用基于显卡的 Hashcat 版本来加速。


    ## 结论


    这次练习的目的不仅是展示如何破解密码，而是演示密码可以有多不安全。有时作为伦理黑客或渗透测试人员，你需要破解哈希。这只是对 Hashcat 的基础介绍。当你将不同的攻击样式、规则和掩码结合在一起时，你可以创建一个非常强大的工具。


    希望这说明了强密码的重要性。实施要求用户使用长复杂密码的策略是保护网络的明智举措。或者更好，为你的系统实施多因素身份认证。


    # 第 22 章 - 字典列表（Wordlists）


    ## 引言


    在尝试破解密码时，字典列表非常重要，因为破解程序可以读取填充密码的文件（也称为字典列表或字典文件）并使用它进行破解。大多数破解程序可以直接使用现有的密码文件，而更高级的程序可以使用密码文件（或多个文件）并对其进行处理以创建新的密码组合。例如，某些可以在字典列表中的密码开头或结尾添加字母或数字。某些程序将取两个或多个密码文件并合并单词创建一个新列表。最后，某些破解器使用规则集来修改其工作方式。某些规则会将大写字母改为小写，反反之。其他规则可以完全修改单词并生成新单词。如之前提到的，Leet
    (133t) Speak 规则集会将密码文件中的单词转换为“leetspeak”，用数字替换常用字母。使用通配符可以让密码破解变得简单且快速。许多渗透人员会使用公司数据、员工姓名、电话号码、电子邮件等创建自己的密码列表。


    但我们在哪里可以找到字典列表？


    ## Kali 自带的字典列表


    Kali 自带了一些列表，问题在于找到它们。大部分位于使用它们的主程序目录。


    > （在最新版本的 Kali 中，其他字典列表的快捷方式存储在“usr/share/wordlists”目录）


    ## ROCKYOU 字典列表


    最流行的可能是 RockYou 字典列表。这是一个包含数百万实际使用的密码的巨大集合，是从数据库转储中提取的。文件位于 /usr/share/wordlists/
    目录，如下：


    ```

    root@kali:/usr/share# cd wordlists/

    root@kali:/usr/share/wordlists# ls

    rockyou.txt.gz

    ```


    如果你注意到，密码列表是压缩过的，因此在使用之前我们需要对其解压：

