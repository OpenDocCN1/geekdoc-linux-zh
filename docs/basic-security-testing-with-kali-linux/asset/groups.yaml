    ## PART FIVE - Password Attacks


    ## Chapter 16 – Cracking Simple LM Hashes


    Introduction

    Microsoft’s support for Windows XP SP3 and Office 2003 will officially end in
    April 8, 2014. With only one year of support left, almost 40% of computer users
    still use it according to some reports.


    That is a huge number of Windows XP systems that are still used in business critical
    positions.

    Computers do not just store passwords in plain text, but store them in an encrypted
    form. There are several different ways that computers encrypt passwords. One of
    the most secure ways includes Salting the password. Basically this means to use
    a number (or Salt) and incorporate that into the hashing process to ensure that
    no two passwords are ever the same.


    If a salt is not used (like on LM systems), basically the users that used the
    same password will have the same hash. So all you need to do is take the hash
    and compare it to known hashes and if you get a match, you have the password!


    Many Windows XP systems use LM hashes to protect their passwords. This is a very
    old and outdated way to store password hashes. This hashing process was created
    for systems before Windows NT.


    Basically on a system using LM hashes, any password that is 14 characters or less
    is converted into all uppercase, and then broken into two seven character passwords.
    Each half is then encrypted and combined to form the final hash.


    Again there is no salt, so basically if you can get the LM hashes from a system,
    all you need to do is a lookup table comparison to known hashes and get the actual
    password.


    A typical Windows hash looks like this:


    ```

    ac93c8016d14e75a29b76bb9e2cbb6:8516cd0838d1a4fd1ac3e8eb9811350

    ```


    The LM hash is on the left of the colon and the NHash is on the right.


    Cracking LM passwords Online


    There are several websites that will allow you to input a Windows LM hash and
    it will return the password used (if it is in its lookup table).


    A Swiss company called Objectif Sécurité (creator of Ophcrack) has developed a
    cracking technology that uses rainbow tables on SSD devices. They offer an online
    demo of their technology that cracks many LM passwords in seconds.


    > (http://www.objectif-securite.ch/en/ophcrack.php)


