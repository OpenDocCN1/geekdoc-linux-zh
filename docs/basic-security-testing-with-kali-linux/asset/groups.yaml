    One of the biggest things you will notice when installing is that Kali is based
    off of Debian Linux, instead of Ubuntu, which earlier versions were based on.
    If you were used to Backtrack, the desktop still uses Gnome, but it seems to have
    a different look and feel to it.


    # Top Menu Bar


    We will start our tour with the top menu bar.'
  - '[PAGE 28]


    The top menu has the Applications menu which is the main gateway to access all
    the included programs in Kali, the Places menu which allows you to navigate around
    the file system. The leweasel web browser is next, and a shortcut to the Terminal
    prompt follows.


    In the middle is the date and time, followed by a volume control icon on the right
    side, a Network icon, where you can view and edit your network connections and
    finally your user menu where you can access system settings, switch users or log
    out.


    # Applications Menu


    The Applications menu is the main menu in Kali.


    ![](img/ff9cd19afe449ae54278ee429e668a6f_28_0.png)


    Under this menu you find the following main menus:


    +   * Accessories menu includes the normal tools you would expect to find in an
    operating system.

    * Electronics tab contains a programming utility for the Arduino board.

    * Kali Linux is the main menu to access the security programs.

    * System Tools contain system administrator tools and preferences.


    The rest are pretty self-explanatory.


    # Kali Linux Menu


    Of most importance to us, the Kali Linux menu option is where you will find most
    of the security tools.'
