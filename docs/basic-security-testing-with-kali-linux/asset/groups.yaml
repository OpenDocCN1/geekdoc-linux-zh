    # Chapter 27 – WiFi Testing


    ## Introduction

    There are several programs that take the Aircrack-ng toolset and add a graphical
    or text menu to it. This makes it much easier to use without having to remember
    all individual commands. Now we will take a look at Wifite, a quick and easy to
    use menu driven program for finding and testing wireless networks.


    ## Using WiFi

    - 1. To start Wifite simply type wifite at terminal prompt:

    ```bash

    root@kali:~# wifite

    ```


    - 2. Wifite will start and automatically begin scanning for networks:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_203_0.png)


    - 3. At this point just let it run for a while. You will see wireless networks
    begin to fill in as they are found. When you feel you have found the ones you
    are looking for, hit "CTRL-C".


    - 4. You will be asked what WiFi networks you would like to attack. You can pick
    an individual one by separating their numbers with a comma, or just type ‘all’
    to attack all of them:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_203_1.png)


    Things to notice here:

    - NUM: number of WiFi networks you want

    - ENCR: type of encryption the network is using (Open, WEP, WPA, WPA2)

    - POWER: level in decibels

    - WPS: if WiFi Protected Setup is enabled

    - CLIENT: if any are connected. It will say ''client'' if one is connected or
    ''clients'' if multiple are present.


    - 5. For this example, "Vulnerable" seems like a good one to try. As you can see,
    using only WEP encryption is easy to crack. Wifite immediately begins to attack
    and crack the WEP key:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_204_0.png)


    A fairly large number of Initialization Vectors (IVs) are needed to crack the
    WEP key. Wireless APs generally generate IVs. Once enough of the packets have
    been collected, the WEP key can be decoded as shown below:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_204_1.png)


    As you can see, Wifite successfully cracks the WEP key "1234567890" in this case.


    ## Advanced attacks with WiFi

    We can also include a dictionary file to speed up cracking the WPS password by
    using the --dictPath switch. By combining them to use the RockYou password file
    to attack a specific WiFi network:

    ```bash

    root@kali:~# wifite -e "Vulnerable" --dict /usr/share/wordlists/rockyou.txt

    ```

    You can use the "-all" switch with an encryption switch (-wpa) to attack all networks
    detected that use WPA. Additionally, you can use the power switch (-p 60) and
    wps switch (-wps) to crack all WiFi networks using WPS that have a power rating
    over 60 decibels.


    ## Conclusion

    In this chapter we demonstrated how to use the Wifite program to discover and
    test network security from an easy to use menu driven system. We also discussed
    how to use command line switches with Wifite to customize our tests. Wifite is
    a streamlined program that allows you to perform wireless network pentesting very
    quickly.


