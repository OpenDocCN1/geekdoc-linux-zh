- md: "\nYou should now have two files, \"root/Desktop/passwd\" and \"root/Desktop/shadow-\"\
    \ on your Kali system.\n\nNext we need to have both newly created text files and\
    \ run the \"Unshadow\" command on them from the John Ripper utilities. This command\
    \ takes the files and combines them into a single file (cracked) that John the\
    \ Ripper can crack:\n\n```\nroot@kali:~# sudo unshadow passwd shadow- cracked\n\
    ```\n\nOkay, now that we have the combined \"cracked\" file, we can unleash John\
    \ the Ripper on it to attempt to retrieve the passwords.\n\nWe will use the wordlist\
    \ file \"password.lst\" that comes with John:\n\n![](img/ff9cd19afe449ae54278ee429e668a6f_182_0.png)\n\
    \nOkay, 7 password hashes and only one remaining. Now just use the show command\
    \ to see what it found:\n\n![](img/ff9cd19afe449ae54278ee429e668a6f_182_1.png)\n\
    \nAnd there we have 6 usernames and passwords to play with.\n\n- sys/ batman\n\
    - klog/ 1234567890\n- msfadmin/ msfadmin\n- postgres/ postgres\n- user/ user\n\
    - service/ service\n\nLooks like the administrator of the box used simple passwords,\
    \ not a good idea.\n\n# Automating Password Attacks with Hydra\n\nNow that we\
    \ have these passwords, we can take them and use “Hydra” to automate attacks against\
    \ the Metasploitable system's services.\n\nHydra is a brute force attack program\
    \ that takes a user list and password list and tries different combinations of\
    \ them to attack servers.\n\nIf we make a text file with the usernames and another\
    \ with the passwords that we acquired above, we can feed them to a program like\
    \ Hydra to automate testing of these passwords to see what services work against.\n\
    \nSo, if we want to attack the SSH service with our newly created passwords, we\
    \ could do something like this:\n\n```\nroot@Desktop hydra -L user -P 192.168.198.145\
    \ ssh\nHydra v7.5 (c)2013 by van Hauser/HTC & David Maciejak - for legal purposes\n\
    Hydra (http://www.thecc.org/hydra) starting at 2013-11-02 16:35:44\n[DATA] 16\
    \ tasks, 1 server, 81 login tries (1:9), -5 tries per task\n[DATA] attacking ssh\
    \ on port 22\n[ERROR] ssh protocol error\n[ERROR] ssh protocol error\n[ERROR]\
    \ ssh protocol error\n[ERROR] ssh protocol error\n[ERROR] ssh protocol error\n\
    [ERROR] ssh protocol error\nKALI LINUX\nThe quieter you become, the more you are\
    \ able to hear\n[ ] host: 192.168.198.145 login: msfadmin password: msfadmin\n\
    1 target successfully completed, 1 valid password found\nHydra (http://www.thec.org/hydra)\
    \ finished at 2013-11-02 16:36:02\nroot@Desktop #\n```\n\nThe “-L” lists our username\
    \ file, “user” in this case. The “-P” switch is the location of our password file,\
    \ or “pass” in this case. Then we just list the target IP address and the target\
    \ service and that is it!\n\n(You can use Hydra-GTK from the Online Password attack\
    \ menu if you prefer a graphical interface)\n\nAs you can see we found the right\
    \ combination of username and password pretty quick:\nmsfadmin/ msfadmin\n\nThough\
    \ it is kind of silly trying a small list of passwords that we already know, the\
    \ concept is solid. Without having any of the actual passwords we could use hydra\
    \ with a large username and dictionary file to try to brute force our way into\
    \ the server.\n\n# Conclusion\n\nThat all is there to it. Because we had a root\
    \ shell, we were able to grab the Linux hashes from them by copying and pasting\
    \ them to our local machine. We were then able to use John Ripper to crack them.\
    \ \n\nIf you take a good look at the Metasploit service scanner programs mentioned\
    \ in an earlier tutorial, you probably noticed some that had a place to set usernames\
    \ and passwords. How would it be to just feed our newly cracked passwords into\
    \ these scanners and unleash them on the Metasploitable box?\n\nAlso, as many\
    \ times use the same passwords on other boxes, we could use the same scanners\
    \ to target the whole network address to see how many other machines we could\
    \ get access to!\n\nIf the Linux administrator had updated his software, or even\
    \ used complex passwords this would have been much harder, if not impossible to\
    \ do.\n\nLastly, as the Hydra automated attack shows us, we need to use long complex\
    \ passwords to protect our servers from brute force attacks.\n\n# PART SIX – Router\
    \ and Wi-Fi Attacks\n\n# Chapter 24 – Router Attacks\n\n# Resources\n\n- Routerpwn\n\
    - Shodany.com\n\n# Introduction\n\nRecently, there have been several critical\
    \ vulnerabilities discovered in very common network routers. They are, in most\
    \ cases, the first line of defense for a network, so I think it is important to\
    \ spend some time about them.\n\nWe will take a look at a couple ways that Routers\
    \ and Wireless Networks are attacked.\n\nIn this chapter we will look at “Routerpwn”,\
    \ a website that contains executable exploits for routers. We will then look at\
    \ attacking Wi-Fi Protected Setup (WPS) - a push button or PIN based method of\
    \ setting up WPA/WPA2 networks.\n\nThen over the next chapters we will cover attacking\
    \ Wi-Fi networks in more depth.\n\nBut first let’s talk a little bit about Router\
    \ passwords.\n\n# Router Passwords\n\nOf all devices, routers are one of the most\
    \ important devices to secure with a long complex password.\n\nMultiple websites\
    \ exist that contain default passwords for network devices. The first thing a\
    \ drive-by hacker (someone looking for an easy hit) will do is try credentials\
    \ for internet facing devices.\n\nAnd sadly, many times they will work!\n\nSome\
    \ industry experts recommend a password of 12-15 mixed symbols, numbers and upper/lower\
    \ case characters for a good password. I would easily recommend at twice that\
    \ many for a mission critical internet facing router.\n\nI also recommend turning\
    \ off remote web management, when not needed. This immediately blocks changes\
    \ to the router being made from over the internet.\n\n# Routerpwn\n\nThough not\
