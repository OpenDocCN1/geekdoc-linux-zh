    Though beyond the scope of this book, you can also use “mimikatz-command” to do
    more advanced functions, including recovering certificates.


    ## Conclusion


    In this section we showed how to recover plain text passwords from a remote system.
    We did so using the Metasploit Framework’s Meterpreter and the Mimikatz command.


    As you can see, trusting using complex passwords alone as a security measure is
    not always proof. If an attacker is able to get access to your system, they could
    possibly obtain your password in plain text.


    ## Chapter 19 – Mimikatz and Ultiman


    ## Introduction


    For the security field mantra has, if you have physical access, you have total
    access. And in many cases this is true.


    I performed onsite server and workstation support throughout upstate New York
    and Northern Pennsylvania for 20 years and have seen companies do really silly
    things when it comes to physical security.


    I have been in and out of hundreds of facilities, allowed to roam completely unsupervised.


    At one datacenter that I showed up to repair a server; none of the admins could
    be found and the network manager was off site. Not one of them answered their
    pages or cell phones. The receptionist was the only logical thing, she ushered
    me into their server room and left me, completely unsupervised for about an hour
    until someone showed up...


    One time I saw a major company prop their secure server room door open with cabling
    boxes and left it unsupervised while they took their lunch hour.


    I have a friend who is a retired Special Forces operator, and he told me once
    that if you are armed with a tie and a clipboard, no one will stop you. And he
    was right. Out of my 20 years of doing onsite server and IT support involving
    banks, government facilities, research centers and large corporations, inside
    the building, I was stopped and asked for ID only three times!


    Physical security is very important. In this security we will look at one possible
    Windows physical attack using a Kali Live CD, “Ultiman Login Bypass” and the very
    powerful password revealing program “Mimikatz”.


    ## Ultiman Login Bypass


    Okay this technique is really old, and not technically an attack. It originated
    from an old Microsoft Technet Active Directory support forum message. This technique,
    called the “Ultiman Bypass”, was one recommended technique to log into a Windows
    server in case you forgot your password.


    The Ultiman bypass works by manipulating a helpful windows function that is available
    at the login prompt. It allows a system level command session to open without
    using credentials.


    I have friends who support large networks that tell me that they still use this
    technique for legitimate purposes. For example when older corporate stand-alone
    systems need to be backed up and repurposed and no one can remember the system
    password, they will use this technique.


    To perform this procedure you need a (Kali) Linux boot disk. We will boot from
    the disk and change the Windows “Ultiman” program, so the “Windows” + “U” keys
    are pressed, a command prompt will open instead of the normal utility menu.


    > **WARNING!!!**

    > Warning: If you do something wrong in this procedure could render your Windows
    system unbootable. You have been warned.


    - 1. On a Windows system, boot from a Kali Linux Live CD:


    ![](img/ff9cd19afe449)


    - 2. After booting, click the Desktop.


    ![](img/ff9cd19afe449)


    - 3. Navigate to the Windows\System32 directory:


    ![](img/ff9cd19afe449)


    - 4. Rename the utilman.exe to utilman.old:


    ![](img/ff9cd19afe449)


    - 5. Create a duplicate of cmd.exe and rename it:


    ![](img/ff9cd19afe449)


    - 6. Rename the copy of cmd.exe to utilman.exe:


    ![](img/ff9cd19afe449)


    - 7. Just shutdown and let Windows boot normally.


    ![](img/ff9cd19afe449)


    - 8. At the login screen, press the “Windows” and “u” key together:


    ![](img/ff9cd19afe449)


    - 9. Type “whoami” you will see you are nt authority\system:


    ![](img/ff9cd19afe449)

