    ```


    As you can see it correctly determined that our target was a VMware VM.


    # GETGUI:


    Getgui is a neat little script that will allow you to enable remote desktop on
    a Windows machine (if it isn''t already enabled) and create a remote desktop user.


    The user is added to both the remote desktop user group and the administrators
    group. This makes it handy if you want to connect back to the machine at a later
    date.


    First, "run getui-e" to enable desktop:


    ```

    meterpreter > run getui-e

