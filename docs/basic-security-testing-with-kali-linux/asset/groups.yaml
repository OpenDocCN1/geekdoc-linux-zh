    ## Conclusion


    In this chapter we learned a bout Metasploit''s Meterpreter shell. Though we covered
    some of the basics of getting around and using the shell, we only touched on a
    fraction of its capabilities. Hopefully you can see why a Meterpreter shell gives
    you a whole lot more functionality than just getting a remote access shell.


    Grabbing video and sound may seem a bit theatrical, but social engineers could
    use information they glean. For from video they could grab images of people''s
    badges, and a glimpse into the target''s physical environment.


    Sound is interesting too. A social engineer could learn a bout the target facility
    by being able to have a live microphone inside the building. And not too long
    "Sinn3" from the Metasploit development team showed how they could grab recorded
    audio and search it using AT&T''s Watson''s speech program and Metasploit to look
    for keywords like “password” or “social security number”.


    (See “Resources” above for link to article)


    Lastly we saw how to recover deleted files from a remote system using a special
    Meterpreter module called “Recovery_Files”


    Once we get remote access to a machine with a Meterpreter shell we can interact
    with the target system, manipulate it, and even grab video from it.


    But we can also use Meterpreter to bypass Windows UAC protection and automate
    pulling user password hashes and even plain text password. We will talk about
    all of these features in upcoming chapters.


