    ## Chapter 14 – The Social Engineering Toolkit


    ## INTRODUCTION


    Social engineering attacks are one of the top techniques used against networks
    today. Why spend days, weeks or even months trying to penetrate layers of network
    security when you can just trick a user into running a file that allows you full
    access to their machine and bypasses anti-virus, firewalls and many intrusion
    detection systems?


    This is most commonly used in phishing attacks today, craft an e-mail, or create
    a fake website that tricks users into running a malicious file that creates a
    backdoor into their system. But as a security expert, how could you test this
    against your network? Would such an attack work, and how could you defend it?
    Kali includes one of the most popular social engineering toolkits available, Social
    Engineering Toolkit (SET). The team is very active on SET, there are always new
    features being added. Most recently making it a very robust tool.


    In this chapter we will take a look at some of the tools included with SET and
    two of attack options, both PowerShell based attacks.


    ## Starting SET


    To start SET from the Kali main menu: Linux > Exploitation Tools > Social Engineering
    Toolkit


    ## Mass Emailer


    One way a Social Engineer will attack a network is to send out a flood of e-mails
    to addresses and see who will respond or run the malicious attachment sent with
    it. SET comes with a Mass Emailer select, "Engineering Attacks".


    There are two options on the mass-mailer, the first would be to send an email
    to one person. The second option will allow you to import a list and send it to
    as many people as want within that list. What do you want to do:


    - 1. Email Attack

    - 2. Mass Mailer

    - 3. Return to main menu


    For this example, let''s just send one.


    - 1. Use a Gmail account for email.

    - 2. Use your own server or relay

    - 4. Enter target address:

    - 5. Next choose to use a Gmail account or another server.

    - 6. Now choose spoofed name to use for the "from" line of the message:

    - 7. Next SET asks for the password of your account.

    - 8. Enter "yes" at the prompt, "Flag this message as high priority?"

    - 9. Next, enter e-mail subject.

    - 10. Enter "P" when prompted to "Send the message as html or plain?"


    ```

    set phishing> MrCEO@SomeDomain.com

    set phishing> Important Update

    set phishing> ITDepartment@SomeDomain.com

    set phishing> EvilHacker@EvilDomain.com

    set phishing> 1

    set phishing> Your email address:

    set phishing> 2

    set phishing> 3

    set phishing> 4

    set phishing> 5

    set phishing> 6

    set phishing> 7

    set phishing> 8

    set phishing> 9

    set phishing> 10

    ```


    Now type-in fake message, preferably one that will entice our victim to click
    on a malicious link. In actual defense this could just a webpage that records
    the IP address of those who were tricked to surf to the page. That way as security
    team we know our organization needs to be better educated on the risks of e-mails.
    When finished, type "END".


    ## SET JavaInjector Attack


    The message above is obviously a fake, but something like this (with a much more
    believable message) could be used to test employee''s ability to detect, resist
    and report phishing attempts. So far we have just sent a fake email that could
    redirect someone to a bogus site. But what if we made a fake site that offered
    up booby-trapped script? And if user allows the script to run, creates a remote
    shell with the user?


    The JavaInjector attack leverages the anti-virus bypassing capabilities of PowerShell
    based attacks with a Java application. We will use SET to create a fictitious
    website that will offer up booby-trapped Java app. And if user allows the app
    to run, we get a remote session to the system. We will be using a Windows 7 system
    as the "target" in this example.


    From the main SET menu:


    - 1. Select number 1, "Social-Engineering Attacks".

    - 2. Next select 2, "Website Attack".

    - 3. Then, 1, "Java Applet Method".


    This will create a Java app that has a backdoor shell. There are several alternative
    attack options available here. The Metasploit Browser attacks the client system
    with Metasploit browser exploits. The Credential Harvester attack is pretty slick
    as it clones an existing website (like Facebook) and then stores any credentials
    that are entered into it. TabNabbing works great if the client has a lot of browser
    windows open, it waits a certain time then switches one of the tabs to a page
    that SET creates. The Web-Jacking attack uses iframe replacements to make a malicious
    link legit. and finally, the Multi-Attack combines several of the above attacks.


    - 4. Next choose 1, "Web Templates" to SET create a generic webpage to use. Or
    use Option 2, "Site Cloner" to allow SET to use an existing webpage as a template
    for the attack webpage.

    - 5. NAT/Port Forwarding – Select yes or no depending if your system will use
    a different facing IP address. Usually selecting "no" will be sufficient if using
    an internal testing lab.

    - 6. Enter the IP address of your SET machine. You can open another terminal window
    and type "ifconfig" if you are uncertain of your IP address.

    - 7. Select a template - Now choose 1, "Java Required". Notice the other options
    available.

    - 8. Pick a payload you delivered, I usually choose 14, "ShellCode Alphanum Shellcode"
    (This is an interesting as it runs from memory, never touching the hard drive,
    effectively bypassing some anti-virus programs) or 15, "PyInjector Shellcode".
    For now, let’s go ahead and use Option 15, "PyInjector Shellcode Injection", and
    use the default port 443.

    - 9. Next choose a payload to inject, let’s pick the first Option, "Windows Meterpreter
    Reverse TCP".


    Now SET is all ready to go and does several things. It creates and encrypts the
    PowerShell injection code, creates the website, loads Metasploit and starts up
    a listening service for people to connect. When done, your screen will look like
    this:


    ```

    # Preparing pyinjector for delivery...

    # Preparing website for pyinjector shellcode injection...

    Base

    # Preparing pyinjector for delivery...

    # Preparing website for pyinjector shellcode injection...

    Base

    # Preparing pyinjector for delivery...

    # Preparing website for pyinjector shellcode injection...

    Base

    # Preparing pyinjector for delivery...

    # Preparing website for pyinjector shellcode injection...

    ```

