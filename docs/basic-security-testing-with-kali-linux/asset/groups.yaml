    ![](img/ff9cd19afe449)


    - 5. 创建 cmd.exe 的副本并重命名：


    ![](img/ff9cd19afe449)


    - 6. 将 cmd.exe 的副本重命名为 utilman.exe：


    ![](img/ff9cd19afe449)


