    # Recovering password from a Locked Workstation


    Moving forward with this concept, how could it be for a penetration tester (if
    you had physical access to the system) to be able to grab the passwords off of
    a Windows system that was sitting at a locked login prompt? And what if you get
    these passwords in plain text?


    Well, you can!


    A while back I was wondering, what if you were a penetration tester that had physical
    access to a system, would it be possible to get passwords off of a locked Desktop?
    You know, a user is using the system and dutifully locks his workstation before
    leaving for lunch.


    If you have physical access to the system, this can be done.


    First you need to be able to enable the system command prompt from the login screen.
    Discussed above, the "Utilman Login Bypass" trick enables a pop-up system level
    prompt by just pressing the "Windows" and "u" on the keyboard.


    Now all we need is a USB drive with Mimikatz installed. This can be downloaded
    from Gentle'
