    # # Introduction


    In this section we setup Kali Linux, Windows 7 and Metasploitable 2 as Virtual
    Machines (VMs) using VMWare Player on a host computer.


    Setting up our testing lab using virtual machines makes it very easy to learn
    offensive computer security testing using Kali.


    Virtual machines make it possible to run several operating systems on a single
    computer. That way we do not need a room full of computers to set up a testing
    and learning environment. We only need one machine powerful enough to run several
    Virtual Machine sessions at once.


    For the book I used a Windows 7 Core I-5 system with 8 GB of RAM. It had plenty
    of power to run all three of our lab operating systems at the same time with no
    problem at all.


    If you have experience with Virtual Systems, you can use any Virtual Machine software
    that you want. But for this tutorial I will be using VMWare Player as the host
    software, and then install Kali, Metasploitable 2 and Windows 7 in separate VMs
    running under the host.


    When done, you should have a small test network that looks something like this:'
- md: '

    Because we will be dealing with vulnerable operating systems, make sure that you
    have a Firewall Router (Preferably hardware) between the Host system and the live
    internet.


    ## Install VMware Player & Kali


    Installing Kali on VMware is extremely simple as Offensive Security provides a
    Kali VMware image that you can download, so we will not spend a lot of time on
    this.


    Download and install VMware Player for your version of OS.


    - 1. Download and install VMware Player (https://my.vmware.com/web/vmware/downloads)


    ![](img/ff9cd19afe449ae54278ee429e668a6f_18_0.png)


    - 2. Agree to the license agreement and choose where you want it to install it,
    the default is normally fine.


    - 3. Click, “Finish” when done.


    Download the Kali VMware Image (http://www.kali.org/downloads/) and save it in
    a location you want it to run from.


    ![](img/ff9cd19afe449ae54278ee429e668a6f_19_0.png)


    (Note: It is always a good idea to verify the SHAISUM with the downloaded image
    to verify you have a legitimate copy of the image. There are numerous MD5/SHA1
    freeware programs available)


    - 5. Un-GZip and Un-Tar the downloaded image (7-Zip works great).


    ![](img/ff9cd19afe449ae54278ee429e668a6f_19_1.png)


    - 6. Start the VMware Player.


    - 7. Click, “Player” from the Menu.


    - 8. Then “File”


    - 9. Next click, “Open”.


    - 10. Surf to the extracted Kali .vmx file, select it, and click, “Open”.


    - 11. It will now show up on the VMware Player home screen.


    ![](img/ff9cd19afe449ae54278ee429e668a6f_19_2.png)


    - 12. With the Kali VM highlighted click, “Edit Virtual Machine Settings”.


    - 13. Here you can view and change any settings for the VM:


    - 14. Click, "Network Adapter":


    ![](img/ff9cd19afe449ae54278ee429e668a6f_20_0.png)


    It is set to NAT by default. This will be good enough for what we are doing. NAT
    means each Virtual machine will be created in a small NAT network shared amongst
    themselves and with the host; they can also reach out to the internet if needed.


    Each machine will be given a DHCP IP address, which means the IP addresses might
    change on the VMs when you reboot them.


    (If you need to know Kali''s or Metasploitable''s IP address, just type "ifconfig"
    in a Terminal window. On a Windows based VM, just type "ipconfig" at a command
    prompt.)


    - 15. Click "cancel" to return to the VMware Player main screen.


    - 16. Now just click, "Play Virtual Machine", to start Kali. You may get a message
    asking if the VM was moved or copied, just click, "I copied it".


    - 17. When prompted to install VMware Tool, select to install them later.


    - 18. When Kali boots up you will come to the Login Screen:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_21_0.png)


    - 19. Click on “Other”, then login with the username, “root” and the password
    “toor” (root backwards).


    - 20. You will then login to Kali and be presented with the main Desktop:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_21_1.png)


    Congratulations, you did it!


    ## Updating Kali


    We will cover getting around in Kali a little later, but first, we need to update
    Kali to the latest version. The VM image is a bit old, so there are a lot of updates
    that could take a while to download.


    ## Open a Terminal Window:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_22_0.png)


    - 2. Type, “apt-get update” and hit “enter":


    ```

    root@kali:~# apt-get update

    Get:1 http://http.kali.org kali/ InRelease [22.0 KB]

    Get:2 http://http.kali.org kali/updates InRelease [11.8 KB]

    Get:3 http://http.kali.org kali/main Sources [7,535 KB]

    Ign http://http.kali.org kali/contrib Translation-en-US

    Ign http://http.kali.org kali/contrib Translation-en-en

    Ign http://http.kali.org kali/main Translation-en-US

    Ign http://http.kali.org kali/main Translation-en-en

    Ign http://http.kali.org kali/main/non-free Translation-en-US

    Ign http://http.kali.org kali/main/non-free Translation-en-en

    ```


    - 3. And then, “apt-get dist-upgrade":


    ```

    root@kali:~# apt-get dist-upgrade

    Reading package lists... Done

    Building dependency tree... Done

    Reading state information... Done

    Calculating upgrade... Done

    The following packages will be REMOVED:

    console-tools icedtea-jre openvas5

    ```

    > (Type, “y") and enter when prompted that additional disk space will be needed.
    This can take quite a while, so this might be a good time for a break!


    - 4. When done, reboot.


    Tech Note: There are additional source repositories that you can manually add
    to Kali if you want. For example if you want the absolute latest and greatest,
    you can add the “Bleeding Edge” repositories to Kali. But these come with a warning
    that they are not maintained and are low priority. For more information: http://docs.kali.org/general-use/kali-linux-repositories/
    That''s it; Kali should now be installed, updated and ready to go. We will take
    a closer look at the desktop in the next section.


    ## Installing VMware Tools for Linux


    When Kali boots up, a pop-up should appear asking if you want to install VMware
    tools into the operating system. This allows the OS to work better with VMware,
    giving you control over video options and cut-paste with the host, but it usually
    makes things work a little smoother. When you get the pop-up message, click “Download
    and Install”:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_23_0.png)


    The tools will then begin to download:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_23_1.png)


    Allow the tools to install and then click, “Close” when finished.


    ## Installing Metasploitable 2


    Metasploitable 2, the purposefully vulnerable operating system that we will practice
    exploiting, is also available as a VM. As we did with the Kali VM, all we need
    to do is just download the Metasploitable 2 image, unzip and open it with VMware.
    It''s that simple.


    - 1. Download Metasploitable 2 (http://sourceforge.net/projects/metasploitable/files/Metasploitable2/)
    and place it in a folder where you saved it.


    - 2. Unzip the File.


    | Filename | Date | Size |

    | :--- | :--- | :--- |

    | Metasploitable.nvram | 5/21/2012 1:45 AM | 9 KB |

    | Metasploitable.vmdk | 5/21/2012 1:46 AM | 900,864 KB |

    | Metasploitable.vms | 5/21/2012 1:46 AM | 1 KB |

    | Metasploitable.vmx | 5/21/2012 1:46 AM | 3 KB |

    | Metasploitable.vmf | 5/21/2012 1:37 AM | 1 KB |


    - 3. Then just open Metasploitable 2 in VMware by starting VMware Player, click,
    “Player”, "File", "Open", then surf to and select the Metasploitable.vmx file
    and click, "Open".


    - 4. It will now show up in the VMware Player Menu:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_24_0.png)


    - 5. Now go to “Edit Virtual Machine Settings” for Metasploitable and make sure
    the network interface is set to “NAT”:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_24_1.png)


    Metasploitable 2 is now ready to use.


    *** Warning *** - Metasploitable is a purposefully vulnerable OS. Never run it
    open on the internet. Make sure there is a firewall installed between your host
    system and the Internet.


    - 6. Go ahead and “Play” the Metasploitable system, click “I copied it” if you
    are asked if you moved or copied it.


    You should now see the Metasploitable Desktop:


    ```

    Warning: Never expose this VM to an untrusted network!

    Contact: msfdev.metasploit.com

    Login with msfadmin:msfadmin to get started


    metasploitable login: _

    ```


    - 7. Login with the credentials on the screen.


    Login name: msfadmin

    Password: msfadmin


    - 8. At the terminal prompt type, “ifconfig” to get the IP address of the Metasploitable
    machine:


    ```

    msfadmin@metasploitable:~$ ifconfig

    eth0 Link encap:Ethernet

    inet addr:192.168.198.129

    ```


    The IP address in this case is 192.168.198.129. Because we are using DHCP IP addresses
    of the virtual machines may change when we bring the systems down and back up.
    So it is a good idea to check and verify them if you start having communication
    problems.


    We now have our Metasploitable and Kali systems up.


