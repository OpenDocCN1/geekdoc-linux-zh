    ## 第14 章 – 社会工程工具包 (SET)


    ## 引言


    社会工程攻击是当今针对网络的最有效技术之一。为什么要花费几天、几周甚至几个月来尝试渗透层层网络安全，而你只需要欺骗用户运行一个文件，即可获得其机器的权限并绕过杀毒软件、防火墙和许多入侵检测系统？


    这在今天最常用于钓鱼攻击：编写封电子邮件或创建一个虚假网站，诱骗用户运行恶意文件，从而在他们的系统中创建后门。但作为一名安全专家，你该如何针对你的网络进行这种测试呢？这种攻击有效吗？你又如何防御？Kali
    包含了最流行的社会工程工具包之一——社会工程工具包（Social Engineering Toolkit, SET）。该团队非常活跃，总是在添加新功能，这使其成为了一个非常健壮的工具。


    在本章中，我们将查看 SET 包含的一些工具以及两种攻击选项（都是基于 PowerShell 的攻击）。


    ## 启动 SET


    从 Kali 主菜单启动 SET：Linux > Exploitation Tools > Social Engineering Toolkit


    ## 批量邮件发送器 (Mass Emailer)


    社会工程师攻击网络的一种方法是向大量地址发送大量邮件，看看谁会回复或运行随附的恶意附件。SET 自带了批量邮件发送器（Mass Emailer），选择“Engineering
    Attacks”（工程攻击）。


    批量邮件发送器有两个选项，第一个是向某个人发送电子邮件。第二个选项允许你导入列表，并将其发送给列表中的任意人数。你想执行什么：


    - 1. 邮件攻击 (Email Attack)

    - 2. 批量邮件发送器 (Mass Mailer)

    - 3. 返回主菜单


    在这个示例中，我们只发送一封。


    - 1. 使用 Gmail 账户发送邮件。

    - 2. 使用你自己的服务器或中继。

    - 4. 输入目标地址：

    - 5. 接下来选择使用 Gmail 账户或其他服务器。

    - 6. 现在选择用于邮件“发件人”行的行的伪造名称：

    - 7. 接下来 SET 会询问你的账户密码。

    - 8. 在提示“将此消息标记为高优先级吗？”时输入“yes”。

    - 9. 接下来输入邮件主题。

    - 10. 在提示“以 html 还是纯文本格式发送消息？”时输入“P”。


    ```

    set phishing> MrCEO@SomeDomain.com

    set phishing> Important Update

    set phishing> ITDepartment@SomeDomain.com

    set phishing> EvilHacker@EvilDomain.com

    set phishing> 1

    set phishing> Your email address:

    set phishing> 2

    set phishing> 3

    set phishing> 4

    set phishing> 5

    set phishing> 6

    set phishing> 7

    set phishing> 8

    set phishing> 9

    set phishing> 10

    ```


    现在输入虚假信息，最好是那种能诱导我们的受害者点击恶意链接的消息。在实际防御中，这可以只是一个网页，记录下欺骗访问该页面的用户的 IP 地址。这样，作为安全团队，我们就知道组织需要加强对邮件风险的教育了。完成后后，输入“END”。


    ## SET JavaInjector 攻击


    上面的消息显然是虚假的，但类似这样的（配上更可信力的内容）可以用来测试员工检测、抵抗和报告钓鱼尝试的能力。到目前，我们只是发送了一封可能将某人引导到虚假网站的假邮件。但如果我们制作一个提供带有陷阱脚本的虚假网站呢？如果用户允许脚本运行，是否能与用户创建一个远程
    shell呢？


    JavaInjector 攻击利用了基于 PowerShell 的攻击绕过杀毒软件的能力并结合 Java 程序。我们将使用 SET 创建一个虚假网站提供带有陷阱的
    Java 程序。如果用户允许程序运行，我们就获得了系统的远程会话。在本示例中，我们将使用 Windows 7 系统作为“目标”。


    从 SET 主菜单：


    - 1. 选择 1，“Social-Engineering Attacks”（社会工程攻击）。

    - 2. 接下来选择 2，“Website Attack”（网站攻击）。

    - 3. 然后选择 1，“Java Applet Method”（Java Applet 方法）。


    这将创建一个带有后门 shell 的 Java 程序。这里还有其他可选的攻击选项。Metasploit 攻击使用 Metasploit 浏览器漏洞攻击客户端系统。Credential
    Harvester（凭据收割器）攻击非常巧妙，因为它会克隆现有网站（如 Facebook），然后存储输入到其中的任何凭据。TabNabbing 如果客户端打开了大量浏览器窗口时效果非常好，它会等待一段时间，将其中一个标签页切换到
    SET 创建的页面。Web-Jacking（网页劫持）攻击使用 iframe 替换使恶意链接看起来合法。最后，Multi-Attack（组合攻击）结合了上述几种攻击。


    - 4. 接下来选择 1，“Web Templates”（网页模板）让 SET 创建一个通用网页。或使用选项 2，“Site Cloner”（站点克隆）允许
    SET 使用现有网页作为攻击网页的模板。

    - 5. NAT/端口转发 – 根据你的系统是否使用不同的外部 IP 地址选择 yes 或 no。通常如果使用内部测试实验室，选择“no”足够了。

