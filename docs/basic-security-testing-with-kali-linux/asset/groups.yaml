    | 192.168.198.254 | 00:50:56:e6:77:37 | 01 | 060 | VMware, Inc. |


    It can also run in stealth "passive" mode where it doesn''t send any data, it
    only sniffs traffic.


    ## Zenmap


    Zenmap is basically a graphical version of the ever popular nmap command. If you
    are not familiar with nmap, then Zenmap is a great place to start.


    Like the previous commands, Zenmap can be started from the menu or command line.


    Once started, you will see the following screen:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_67_0.png)


    Just fill in the target IP address and choose what type of scan you want to perform
    from the Profile drop down box. Zenmap will show you what the resulting nmap command
    switches are in the command box. Then just click the "Scan" button to run the
    command:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_67_1.png)


    As you can see above the nmap command status shows up in the Nmap Output window.

    Other information can be viewed by clicking on additional tabs, like the “Ports/
    Hosts” tab:


    | Nmap Output | Ports / Hosts | Topology | Host Details | Scans |

    |---|---|---|---|---|

    | Port | Protocol | State | Service | Version |

    | 53 | tcp | open | tcpwrapped | | |


    Or the “Host Details” window:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_68_0.png)


    ## Conclusion


    In this chapter we looked at the multi-faceted tool Recon-NG. We saw how it was
    created to mimic Metasploit so users who are familiar with it could pick up Recon-NG
    fairly quickly.


    We also covered a couple other tools used in Host identification, reconnaissance
    and information gathering.


    ## Chapter 6 - Shodan


    ### Resources


    - Shodan Website - http://www.shodanhq.com/

    -- Google Dorks Database - http://www.exploit-db.com/google-dorks/


    ## Introduction


    Shodan is one of the coolest websites on the web. Called the “Hacker’s Google”,
    “Dark Google” and many times “terrifying”, it is a search engine for computers.


    Shodan allows you to find computers on the web by searching them by keyword. For
    example, you can search for all the Microsoft IIS 7.0 servers in Canada, and all
    the systems Linux in Africa.


    If you are familiar with “Google Dorks”, Shodan is similar, but is a much easier
