    ```


    或者你可能想跳过任何 401 未授权页面或 302 重定向页面？只需使用减号和 HTML 错误代码即可：


    apache/2.2.8-401-302


    ## 组合搜索


    有效的 Shodan 搜索是通过组合搜索术语完成的。通过几个关键词，你可以搜索你波士顿地区的所有运行 IIS/7.0 的微软服务器。


