    # JOHN THE RIPPER Wordlist


    The ever-popular password cracker John the Ripper comes with a somewhat smallish
    wordlist,

    but it includes many of the most popular passwords used on the web.


    The file is located in the /usr/share/John/ directory as seen below:


    ```

    root@kali:/usr/share/john# ls password.lst

    password.lst

    root@kali:/usr/share/john#

    ```


    # WFUZZ Multiple Wordlists


    Wufzz is a website brute force attack tool. Though all the wordlists may not be
    helpful, some are

    interesting, especially the ones in the “general” directory.


    The files are located in the /usr/share/wufzz/wufzz/ directory as seen below:


    ```

    root@kali:/usr/share/wufzz/wufzz/# ls

    fuzzdb general Injections others stress vulns webersicces

    root@kali:/usr/share/wufzz/wordlist#

    ```


    # OTHER Wordlists


    As mentioned earlier, there are several other programs with wordlists in the /usr/share/
    directory.

    Though RockYou one again is probably one of the best, if you want additional ones,
    just poke

    around the /usr/share/ directory and see what you can find.


    # Wordlist Generator


    Several tools in Kali let you make your own personalized wordlists. CeWL is pretty
    nice as it lets

    y create passwords by grabbing information from a target website. Crunch is nice
    too as it allows

    y to create your own custom wordlists from scratch.


    In this section we will take a look at Crunch.


    # Crunch


    Crunch is a great program that allows you to create your own password lists. Simple
    crunch what

    y you want, the length and complexity, and crunch makes it for you!


    To pull up the Crunch help page, you have to use the manual command:


    ```

    root@Kali:~# man crunch

    ```'
  - '[PAGE 177]


    # CRUNCH(July 2012)


    # CRUNCH(July 2012)


    NAME


    crunch


    SYNOPSIS <min-len> <max-len> [options]


    DESCRIPTION


    Crunch can create a wordlist based on criteria you specify. The output from crunch
    can be sent to the screen, file, or to another program.


    OPTIONS


    min-len


    The minimum length string you want to start at. This option is required even for
    parameters that won''t use the value.


    max-len


    The maximum length string you want to end at. This option is required even for
    parameters that won''t use the value.


    But basically all we need to tell crunch is the minimum and maximum length and
    what type of characters to use.


    Crunch also makes heavy use of the charset.lst file that is located in its install
    directory /etc/share/crunch. So you will need to either run crunch from that directory
    or point to the directory with the -f switch when using the more advanced character
    sets (shown below).


    Alright, let''s start with an easy one.


    For example:


    ```

    root@Kali:~# crunch 1 3 -o ThreeLetters.txt

    ```


    Will produce something like this:


    +   - a, b, c, d, e, f, g, h, i, j, et...

    - aa, ab, ac, ad, ae, af, ag, ah, ai, aj, et...

    - aaa, aab, aac, aad, aae, aag, aah, aai, aaj, et...


    Basically crunch starts out with a single letter “a” and cycles through all permutations
    until it gets to “zzz".


    If we play around with the options we can create some more complex lists, for
    example:


    ```

    root@kali:/usr/share/crunch$ crunch 3 4abcd1234 -o alphaNumeric.txt

    Crunch will now generate the following amount of data: 35721 bytes

    0 MB

    0 GB

    0 TB

    0 PB

    Crunch will now generate the following number of lines: 7290

    100%

    ```


    Would create a wordlist that starts with “aaa” and ends with “4444” creating alphanumeric
    combinations like aal, bb3, 2a21, and e3da.


    We use the charset.lst file so we don''t have to type in all the characters that
    we actually want to'
