    # # Connecting to a Remote Session


    Once we have a successful exploit we will be able to view any remote sessions
    that were created. To check what sessions were created type the "sessions " command.


    Any sessions that were created will show up along with the IP address, computer
    name and user name of the target system.


    ![](img/ff9cd19afe449ae54278ee429e668a6f_42_1.png)


    We can now connect to the session interactively with the "sessions -i <ID#>" command
    as shown in the sample session above.


