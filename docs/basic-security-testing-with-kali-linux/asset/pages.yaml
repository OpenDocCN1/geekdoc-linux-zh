    pasting the exploit path and names works very well here too:


    ```

    msf > use exploit/unix/irc/unreal_ircd_3281 backdoor

    msf exploit(unreal ircd_3281 backdoor) > _

    ```


    Okay, so we are now using our exploit, how do we set the options?


    # Setting Exploit Options


    Setting options in Metasploit is as simple as using the “set” command followed
    by the variable name to set and then the value:


    +   - set <Variable Name> <Value>


    ![](img/ff9cd19afe449ae54278ee429e668a6f_36_0.png)


    To set what variables can be set, use the “show options” command:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_36_1.png)


    This exploit only uses main variables, RHOST and RPORT. Rhost is the remote host
    that we are attacking and Rport is the remote port.'
