  md: '# Chapter 17 – Pass the Hash


    # Introduction


    In the previous section we looked at how insecure Windows LM based passwords can
    be, but what about NTLM based Passwords?


    Windows systems usually store the NTLM hash right along with LM hash, the NTLM
    hash being more secure. As I mentioned, the LM can be turned off (or just use
    passwords longer than 14 characters). But what a lot of people have asked me how
    much longer it takes to access the user account, if only the NTLM hash was available?


    This is a great question, and the answer is, if certain circumstances are met
    and a certain technique is used, it could take the same amount of time.


    Let me explain, if you can retrieve the LM or NT hashes from a computer, you do
    not need to crack them. There is really no need. Sometimes you simply take the
    hash as-is and use it as a token to access the system. This technique is called
    “Pass the Hash”.


    The Pass the Hash attack is not new, at the ever popular “BlackHat USA” conference
    last year there was a presentation, “Still Passing the Hash 15 Years Later”. That
    should give you some idea how long this attack has been used.


    Though some of these attacks no longer work on updated systems. AV and patched
    Windows systems are catching some of the mechanisms used and blocking them. And
    networks set to use NTLM2 or Kerberos only defeat these kinds of attacks.


    Also the Windows User Account Control feature in Windows 7 blocks a lot of pass
    the hash type attacks that still work against Windows XP systems. But if UAC is
    disabled, as we will see later in this section, it could still work.


    But it is still worth a look at some of the Pass the Hash techniques.


    # Passing the Hash with Psexec


    Probably one of the standby methods of passing the hash for years has been the
    psexec command.


    In this tutorial we will start with having an active remote session through Meterpreter.'
