    # Using a Larger Dictionary File


    If you don''t succeed, try a larger dictionary!


    Crackstation (https://crackstation.net/buy-crackstation-wordlist-password-cracking-dictionary.htm)
    has a 15GB dictionary file that works well.


    I downloaded the 4GB compressed file, uncompressed it and put it in a directory
    with our hash. Then I run the hashcat using the Dictionary wordlist:


    ```

    root@kali:~/Crack hashcat -m 1000 hash.txt crackstation.txt -o cracked.txt --ro

