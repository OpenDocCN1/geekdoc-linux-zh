    network:


    ```

    root@kali:~# winite -e "Vulnerable" --dict /usr/share/wordlists/rockyou.txt

    ```


    You can use the "- all" switch with an encryption switch (-wpa) to attack all
    networks detected that use WPA. Additionally, you can use the power switch (-p
    60) and wps switch (-wps) to crack all Wi-Fi networks using WPS that have a power
    rating over 60 decibels.


    # Conclusion


    In this chapter we demonstrated how to use the WiFiite program to discover and
    test network security from an easy to use menu driven system. We also discussed
    how to use command line switches with WiFi to customize our tests.


    Wifite is a streamlined program that allows you to perform wireless network pentesting
    very quickly.'
