    \ wlan0\nroot@kali:-$ airmon-ng start wlan0\n\nFound 1 processes that could cause\
    \ trouble.\nairirdump-ng, airplay-ng or airmon-ng stops working after\na short\
    \ period of time, you may want to kill (some of) them!\n\nPID     Name\n1482 \
    \   dhclient\nmissing btime in /proc/stat\n\nInterface   Chipset             \
    \    Driver\nwlan0       Atheros AR8271      ath9k - [phy0]\n                \
    \            (monitor mode enabled on mon0)\n```\n\nThis creates a new wireless\
    \ adapter called “mon0”. Now we can use this interface to capture wireless management\
    \ and control frames.\n\nTo so, we will need a packet capture program. You could\
    \ use tcpdump -i mon0. Or you could use tshark, the text version of Wireshark.\n\
    \nBut what's the fun in that? I like graphical interfaces!\n\nWith Xming running\
    \ you can just start Wireshark as you normally would and it will show up on your\
