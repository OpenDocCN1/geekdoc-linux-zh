  md: '# # Chapter 29 – Easy Credds


    ## Introduction

    Easy-Credds is a great menu driven program that allows you to turn a wireless
    card into a complete wireless Access Point attack platform. Easy-Credds creates
    a rogue access point, and then runs as a man-in-the-middle type attack analyzing
    the user’s data stream and pulls account information from the stream including
    passwords entered on secured websites.


    It is able to recover secure accounts by removing any SSL encryption by using
    the ever popular program SSL strip. Basically SSL strip captures and manages HTTPS
    SSL communications on the browser’s behalf, dropping the user’s session down to
    a regular HTTP connection.


    That way any account information can be captured and read before it is forwarded
    to the SSL encrypted website.


    ## Installing Easy-Credds

    Easy-Credds while a part of BackTrack 5 is not installed by default in Kali. We
    will install easy-creds using the author’s install script. As this is not installed
    from a Kali repository, it could break something else, *so install* at your own
    discretion.


    +   1. Download from “http://code.google.com/p/easy-creds/downloads/list”.

    2. Unzip the file using the command: `tar -xvf easy-creds-3.8-DEV.tar.gz`

    3. Change into the newly created *easy-creds* directory.

    4. “cat README” to read the install directions if you desire.

    5. Type `sudo ./installer.sh` to run the installer script and you will see the
    main install screen:'
