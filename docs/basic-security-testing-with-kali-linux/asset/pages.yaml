    # Scanning for Targets


    One of the first steps that many security testers is to do an “nmap” scan to try
    to determine what ports are open and hopefully even what services are installed
    on those ports. If we can determine open ports and service program versions, then
    we may be able to exploit a vulnerability in the service and compromise the machine.


    Let''s take a look at Metasploitable from our Kali box.


    The first thing to do is to run an nmap scan and see what services are installed.


    +   - Open a Terminal window on your Kali system and type:

    nmap -sS -Pn <metasploitable IP address>


    Put in the IP address for your Metasploitable machine, which in our case is 192.168.198.145.
    If you didn’t know what IP address your Metasploitable is at you, you could always
    scan a range of addresses by typing something like, “nmap -sS -Pn 192.168.198.1-150”


    The “-sS” switch tells nmap to perform a stealth scan. The “-Pn” tells nmap not
    to run a ping scan to see what services are up.


    This will show us the open ports and try to enumerate what services are running:'
