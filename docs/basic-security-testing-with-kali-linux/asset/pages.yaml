    attacks against the Metasploitable system''s services.


    Hydra is a brute force attack program that takes a user list and password list
    and tries different combinations of them to attack servers.


    If we make a text file with the usernames and another with the passwords that
    we acquired above, we can feed them to a program like Hydra to automate testing
    of these passwords to see what services'
