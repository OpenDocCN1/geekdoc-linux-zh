    # Install Wrap Up


    In this section we learned how to install VMware Player as a virtual host. We
    then installed Kali Linux, Metasploitable 2 and Windows 7 as separate virtual
    machines on the host.


    We set them up to use the same networking (NAT) so that they can communicate with
    each other and out to the internet if needed.


    We will use this setup throughout the rest of the book.


    Just as a reminder, with VMware’s DHCP, IP addresses of the systems may change
    when we reboot them. I used this partially because you will always be using different
    target IP addresses in the real world. But if you get lost, you can run "ifconfig"
    (Linux) or "ipconfig" (Windows) on the VM to find the changed IP address.


    And finally, never run Metasploitable directly on the internet as it is purposefully
    vulnerable.


