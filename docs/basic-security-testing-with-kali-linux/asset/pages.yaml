    This took a little bit longer, about 11 minutes. It looks like it was able to
    recover an additional hash.


    Let''s see what it was:


    ```

    root@kali:~/Crack# cat cracked.txt

    3d6cf6fe0d1ea6a931b7c59d7e2c009c0:

    d6e07a7eb9da272150d12563f5b89de:MyNameIsBob2a4dbf33aa05629993daea328977b20:P@@$$word

    root@kali:~/Crack# _

    ```


    Okay, it got the one with an empty password, the “P@@$$word” one and one new—“MyNameIsBob.”


    The two remaining passwords would be fairly difficult to crack. uses special characters,
    upper and lower case letters and a number ($SeCuR@@dCount!) and the last one is
    very long, almost 30 characters.


    # More advanced cracking


    Just throwing a dictionary file at a hash list will recover some of the easier
    passwords, but to get the harder ones you need to use more advanced techniques.
    I will not cover them in detail, but Hashcat allows you to use multiple attack
    types:


    +   * Multiple Wordlists

    * Rule Sets

    * And Password Masks.


    **Attack Types:** The “-a” option allows you to designate the type of attack you
    want to use from the following options:


    0 = Straight

    1 = Combination

    2 = Toggle-Case

    3 = Brute-force

    4 = Permutation

    5 = Table-Lookup


    Most are self-explanatory. Combination attacks allow you to combine words from
    dictionaries to create new words on the fly.'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'Rule attacks are very useful. Hashcat has a list of built in rules that you
    can use to crack dictionary word and tries different lee-speak versions of the
    word. You can even use a programming language to create your own rulesets.


    Rule based attacks are enabled by using the “r” switch and including a name of
    the rules you want. Best64.rule, passwordpro.rule, d3ad0ne.rule, and leetspeak.rule
    are some of the more popular ones.


    Something like:


    ```

    root@kali:~/crack# hashcat -m 1000 rocky.txt -r leetspeak.rule -o cracked.txt

    ```


    Mask attacks allow you to define the layout of the words that will be used in
    your attack. For instance if you know the password policy requires two numbers
    six letters and two special characters you can create a mask for Hashcat to use.


    In this example it would look something like ?d?d?u?u?u?u?u?s:


    ```

    root@kali:~/crack# hashcat -m 1000 -a 3 hash.txt ?d?d?u?u?u?u?u?s -o cracked.txt

    ```


    Play around with the different options until you get a feel for how they work.


    Some of the attacks, especially the Brute Force ones can take forever. Use the
    video card based Hashcat versions to speed things up if you have a compatible
    card.


    # Conclusion


    The purpose of this exercise was not in just showing how to crack passwords, but
    to demonstrate how insecure passwords can be.


    Sometimes as an Ethical Hacker or pentester you need to crack hashes. This was
    just a basic level look at Hashcat. When you mix together the different attack
    styles, rules and masks you can create a really powerful tool.


    Hopefully this demonstrated why strong passwords are important. Implementing a
    policy requiring your users to use long complex passwords is a good move in securing
    your network. Or better yet, implement multi-factor authentication for your systems.


    Don''t forget to remind your users to use a different password for every account
    they have, especially important online accounts that include personal information.
    That way if a password is compromised the hacker will not have access to every
    one of their accounts.'
  merge: -1
  pgno: 174
- img_proc: true
  md: "# # Chapter 22 - Wordlists\n\n# ## Introduction\n\nWordlists are very important\
    \ when trying to crack passwords, as cracking programs can take a file filled\
    \ with passwords, also known as a wordlist or dictionary file, and use it to crack\
    \ passwords.\n\nMost cracking programs can use the password file directly as they\
    \ exist, while more advanced ones can use the password file (or multiple files)\
    \ and manipulate them to create many new combinations of passwords to try.\n\n\
    For example, some can take all the passwords in the wordlist and attach letters\
    \ or numbers to the beginning or end of the word.\n\nSome programs will take two\
    \ or more password files and combine the words from both to make a new list of\
    \ words to try.\n\nAnd finally some crackers use rule sets that modify how they\
    \ work. Some rulesets will change all upper case characters to lowercase, or vice\
    \ versa. Others can completely modify the word and the new word. As mentioned\
    \ before, a Leet (133t) Speak rule set would take a word from the password file\
    \ and convert it to “leet speak”, replacing common letters with numbers.\n\nUsing\
    \ a wildcard can make password cracking easiest and faster.\n\nMany pentesters\
    \ will make their own password list using company data, employee names, phone\
    \ numbers, e-mail addresses, etc.\n\nBut where can we find wordlists?\n\n# ##\
    \ Wordlists Included with Kali\n\nKali comes with several that you can use, the\
    \ problem is just finding them. Most are in the directory of the main program\
    \ that uses them.\n\n> (On the latest release of Kali, shortcut links to the other\
    \ wordlists are stored in the “usr/share/wordlists” directory)\n\n# ## ROCKYOU\
    \ Wordlist\n\nThe most popular one would probably be the RockYou wordlist. This\
    \ is a huge collection of millions of passwords that were actually used and pulled\
    \ from a database dump.\n\nThe file is located in /usr/share/wordlists/ directory\
    \ as seen below:\n\n```\nroot@kali:/usr/share# cd wordlists/\nroot@kali:/usr/share/wordlists#\
    \ ls\nrockyou.txt.gz\nroot@kali:/usr/share/wordlists# \n```\n\nIf notice, the\
    \ password list is zipped, so we need to unzip it before using it:"
  merge: -1
