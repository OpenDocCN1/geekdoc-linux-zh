    +   5. Press "Cntrl-C" to exit when you think you have captured enough packets.


    And that is it. All the files captured will be located in a "logs" directory in
    the location we supplied.


    # Wireshark


    Okay, we have our packet capture, what do we do with it?


    Wireshark is a great packet capture and analyzer program that has a ton of features
    and capabilities. We will just cover viewing a packet capture in Wireshark very
    briefly.


    +   1. To start Wireshark, select it from the "Top Ten Security Tools" menu, or
    better yet, just run it from a terminal prompt:

    `root@kali:~# wireshark`


    +   2. Click, "OK" at at warning messages about running as root.


    +   3. Click, "File" then, "Open" and open our packet capture file.


    +   4. Click on "Protocol" to sort by protocol and then scroll down to the FTP
    section:'
