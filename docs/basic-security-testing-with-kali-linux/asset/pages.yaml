  md: '# # Chapter 25 – Wireless Network Attacks


    ## Resources

    * Wireless Adapters for Kali Discussion: http://forums.kali.org/showthread?php=4237-Best-possible-wireless-adapter-for-Kali-linux-%28PCIE-amp-USB%29


    ## Introduction

    Wireless networks and Wi-Fi devices have saturated both the home front and business
    arena. The threats against Wi-Fi networks have been known for years, and though
    some effort has been made to lock down wireless networks, some are still wide
    open or not secured very well.


    In this chapter we will talk about wireless security and a few common Wi-Fi security
    misconceptions. We will look at couple popular tools used to test security. We
    will also cover several techniques that an Ethical Hacker could use to check the
    security of their wireless networks.


    In the final part of this section we will look at two menu driven programs that
    can be used to make Wi-Fi testing very easy.


    ## Wireless Security Protocols

    Though the news is getting out and Wireless manufacturers are configuring better
    security as the default for their equipment, there are still a large amount of
    wireless networks that are woefully under.


    One of the biggest things in securing your Wireless network is the Wireless Security
    Protocol. You have "None", which basically means that you are leaving the door
    wide open for anyone to access your network. "WEP" which has been cracked a long
    time ago and basically means that you locked the door, but left the key under
    the front mat with a big sign saying, "The key is under the Mat. "WPA" which is
    much better, and "WPA2" is the latest and recommended security setting for your
    network.


    The following chart (Figure 1) was created from data from my local city.'
