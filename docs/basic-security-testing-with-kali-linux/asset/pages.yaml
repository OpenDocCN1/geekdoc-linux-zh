  md: 'the air and should instantly see a list of all the Wi-Fi Beacon traffic.


    For example:


    +   1 0.000000 Beacon frame, SN=3269, FN=0, SSID=Broadcast

    2 0.028565 Beacon frame, SN=3318, FN=0, SSID=Terminator


    Here you can capture from two separate APs. The first one is called “Terminator”,
    but the first one is ineffective. The SSID is “Broadcast”, which tells us the
    name for this AP is hidden.

    \This is an ineffective technique to secure wireless networks, and I will show
    you why.


    If a client attempts to connect to this hidden AP, we automatically capture the
    SSID name in a “Probe Request”. Checking the packet capture for “Probe Requests”
    we will actually see the hidden SSID name as follows:


    +   93 0.623480 Probe Request, SN=0, FN=0, SSID=HiddenWiFi

    99 0.712094 Probe Response, SN=843, FN=0, SSID=HiddenWiFi


    The AP name that did not show up in the Beacon frames becomes revealed to us as
    soon as a client attempts to connect!


    The client lists the hidden AP name in the probe request, in this case “HiddenWiFi”.
    And the AP echoes its hidden name back to the client in the Probe Response.


    To stop the Wireshark capture just use the “Stop Capture” button on the menu.
    You can then search, filter or save the results.


    # Turning a Wireless Card into an Access Point


    One of the interesting features of wireless cards is that they can also act as
    an Access Point. This feature is of great interest to penetration testers, but
    unfortunately to malicious users. You can create an AP using any SSID you want.
    If you name your created AP the same as an existing one, the client cannot tell
    the difference and will connect to the nearest one, or the one with the strongest
    signal.


    Once your card is in monitoring mode (airmon-ng start wlan0), you can turn it
    into an AP using the Airbase-ng command:


    ```

    root@Kali:~ airbase-ng -e "EvilAP" -c 6 mon0

    ```


    This command creates an AP with the name “EvilAP”, on channel 6 the mon0 interface.


    ```

    root@Kali: # airbase-ng -e "EvilAP" -c 6 mon0

    12:29:50 Created tap interface at0

    12:29:50 Trying to set MTU on at0 to 1500

    12:29:50 Trying to set MTU on mon0 to 1800

    12:29:51 Access Point with BSSID F0:D1:B11:B3:F7:DF started.

    ```


    This AP should now show up on any nearby Wi-Fi clients:'
