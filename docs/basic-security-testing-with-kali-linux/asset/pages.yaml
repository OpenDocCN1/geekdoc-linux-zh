    And then “show modules” again.


    Notice the “Reporting” section:


    ```

    Reporting

    ------

    reporting/csv_file

    reporting/html_report

    reporting/list

    reporting/pushpin

    ```


    Simply use one of the report modules to automatically create a nice report of
    the data that you have obtained.


    ```

    recon-ng > use reporting/csv_file

    recon-ng [csv_file] > run

    46 records added to ''/usr/share/recon-ng/workspaces/default/results.csv''

    ```


    All the files will be stored in the “/usr/share/recon-ng/workspaces/default” directory.


    # Recon-NG wrap up


    Sub domain enumeration is only one module you can run, there are many others to
    choose from. There are some that require a program API key like Twitter, Shodan,
    LinkedIn or Google. Using these you can get specific information from the corresponding
    sites about your targets.'
