    Routerp includes a MAC lookup utility and a link to external resources including
    a router default password list site and Shodan.


    Shodan (Shodanhq.com) is probably one of the easiest ways for an attacker to find
    routers and other devices on the web. For the most part, just entering the manufacturer''s
    name as a keyword will return thousands of them.


    The crazy thing is that because Routervpn is a website, it can be run off of almost
    any platform - Windows, Linux, smart phones, etc. In one security seminar the
    author of the tool mentioned that you can run it from a Wii!


    Routervpn is a great one stop shop for finding basic router exploits.


    # Wi-Fi Protected Setup (WPS)


    WPS is used to try to make setting up Wi-Fi devices easier, by allowing users
    to use a PIN or button presses instead of having to enter a long passphrase. Many
    routers support it, but the way in how it works opens up to possibly hacker brute
    force attacks.


    Cracking a long Router passphrase could take days, or even months. But in many
    cases, WPS can be cracked to gain access to a router WPA/WPA2 passphrase in usually
    under 10 hours.


    WPS on the router side will look like this screenshot of a router configuration
    page below:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_188_0.png)


    I don''t want to spend a lot of time on this, but we will take a quick look at
    a couple utilities that can be used to perform WPS attacks.'
