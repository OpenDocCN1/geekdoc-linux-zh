    are listed.


    All the data collected by Recon-NG is placed in a database. You can create a report
    to view the data.


    Just type in “back” to get out of the current module:


    ```

    [* 46 total hosts found.

    [*] 46 NEW hosts found!

    recon-ng [google_site] > back

    recon-ng > |

