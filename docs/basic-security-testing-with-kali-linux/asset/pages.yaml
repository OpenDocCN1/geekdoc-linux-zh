  md: '# # Chapter 6 - Shodan


    # ## Resources


    +   - Shodan Website - http://www.shodanhq.com/

    - Google Dorks Database - http://www.exploit-db.com/google-dorks/


    # ## Introduction


    Shodan is one of the coolest websites on the web. Called the “Hacker’s Google”,
    “Dark Google” and many times “terrifying”, it is a search engine for computers.


    Shodan allows you to find computers on the web by searching for them by keyword.
    For example, you can search for all the Microsoft IIS 7.0 servers in Canada, and
    all the systems Linux in Africa.


    If you are familiar with “Google Dorks”, Shodan is similar, but is a much easier
    way to search the breadth of the internet for systems.


    The trick to using Shodan effectively is to know the right keywords. Usually they
    are the manufacturer’s name, or a device model number, but sometimes they are
    the name of a very obscure embedded web server that you would never think to look
    for.


    But once you know these magic keys, in seconds you can search the world for these
    devices. Or by using filter commands you can refine your search to certain devices
    and areas.


    A security tester can use Shodan to very quickly assess what systems on their
    network are being displayed publicly, maybe when they shouldn’t be. It can also
    allow them to find possible rogue or unauthorized devices that have been added
    to the company network.


    In this section we will briefly discuss how scanning your network space with Shodan
    is a good idea. We will then look at how we can do these searches from the web
    interface, Shodanhq.com, and finally through Kali Linux using the Metploit Framework.


    # ## Why scan your network with Shodan?


    There are a large number of seemingly important systems that should never be publicly
    viewable on the Internet. All can be found easily with just a couple keyword searches.


    Everything from open, outdated & insecure systems, routers, network storage, and
    phone systems - to security cams, building controls, and even security systems.


    ![](img/ff9cd19afe449ae54278ee429e668a6f_69_0.png)


    Move the pointer over the ports for more information.


    But that is not all.


    Open network printers and embedded devices can also be a font of information for
    hackers giving'
