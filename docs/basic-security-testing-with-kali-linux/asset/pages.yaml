  md: '# SET ''s Java PYInjector Attack


    The message above is obviously a silly fake, but something like this (with a much
    more believable message) could be used to test your employee''s ability to detect,
    resist and report phishing attempts.


    So far we have just sent a fake email that could redirect someone to a bogus site.
    But what if we made a fake site that offered up a booby trapped script. And if
    the user allows the script to run, creates a remote shell with the user?


    The Java PYInjector attack leverages the anti-virus bypassing capabilities of
    PowerShell based attacks with a Java application. We will use SET to create a
    fictitious website that will offer up a booby-trapped Java app. And if user allows
    the app to run, we get a full remote session to the system.


    We will be using a Windows 7 system as the “target” in this example.


    From the main SET menu:


    +   1. Select number 1, “ Social-Engineering Attacks ”.

    2. Next select 2, “ Website Attack Vectors ”.

    Notice the other options available.

    3. Then, 1, “ Java Applet Attack Method ”.

    This will create a Java app that has a backdoor shell.


    There are several alternative attack options available here.


    The Metasploit Browser Expl attacks the client system with Metasploit browser
    exploits. The Credential Harvester attack is pretty slick as it clones an existing
    website (like Facebook) and then stores any credentials that are entered into
    it. TabNabbing works great if the client has a lot of browser windows open, it
    waits a certain time then switches one of the tabs to a page that SET creates.
    The Web-Jacking attack uses iframe replacements to make a malicious link legit.
    and finally, the Multi-Attack combines several of the above attacks.


    +   4. Next choose 1, “ Web Templates ” to SET create a generic webpage to use.
    Or use Option 2, “ Site Cloner ” to allow SET to use an existing webpage as a
    template for the attack webpage.

    5. NAT/Port Forwarding – Select yes or no depending on if your SET system will
    use a'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'different facing IP address. Usually selecting “no” will be sufficient if using
    an internal testing lab.


    +   6. Enter the IP address of your SET machine. You can open another terminal
    window and type “ifconfig” if you are uncertain of your IP address.


    +   7. Select a template - Now choose 1, “Java Required”. Notice the other social
    media options available.


    +   8. Pick a payload you delivered, I usually choose 14, “ShellCode Alphanum
    Shellcode” (This is an interesting as it runs from memory, never touching the
    hard drive, effectively by-passing some anti-virus programs) or 15, “PyInjector
    Shellcode”. For now, let’s go ahead and use Option 15, “PyInjector Shellcode Injection”,
    and use the default port 443.


    +   9. Next choose a payload to inject, let’s pick the first Option, “Windows
    Meterpreter Reverse TCP”.


    Now SET is all ready to go and does several things. It creates and encrypts the
    PowerShell injection code, creates the website, loads Metasploit and starts up
    a listening service for people to connect.


    When done, your screen will look like this:


    ```

