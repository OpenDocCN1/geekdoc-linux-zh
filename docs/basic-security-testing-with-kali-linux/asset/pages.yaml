  md: '# Chapter 21 - HashCat


    # Resources


    +   - Hashcat - http://hashcat.net/wiki/

    - Installing drivers for your card - http://docs.kali.org/general-use/install-nvidia-drivers-on-kali-linux

    - Wordlists - See Wordlist Chapter


    # Introduction


    So far we have covered several techniques for attacking passwords. We saw that
    sometimes you can just do a rainbow table lookup, and in some cases you can pass
    the hash. But if all else fails, you have to crack the hash.


    Kali includes several excellent programs to do this. In this section we will look
    at one of my favorites, Hashcat.


    We rely on passwords to secure our home systems, business servers and to protect
    our online account information. As cracking programs improve and video cards get
    faster (Video GPU''s are used for very fast cracking) passwords are becoming much
    easier to crack.


    How big of a problem is this?


    Not long ago I tried OCL-Hashcat with my Windows 7 system that had a Core i5-750
    processor running at 2.67 Ghz and a single AMD Radeon 7870 video card. I used
    a fairly recently released password hash file that contained over 7,000 user hashes.
    I chose this one due to the size. Yes larger ones are out there, but I thought
    the size corresponded more realistically to an average company that a pentester
    or incident response team would be dealing with. Besides, how many American businesses
    have a million or more employees?


    With OCL-Hashcat and two different dictionary files, I was able to crack 86% of
    it... In 30 minutes...


    If that doesn''t sound impressive, OCL-Hashcat took just 12 seconds to recover
    46% of them, and about 13 minutes to recover 66%.


    Think about that for a moment, 46% of the seven thousand passwords were cracked
    in 12 seconds.


    Now, take a minute and think about your company password length and complexity
    policy. Long, complex passwords can take an exponentially longer time to crack,
    unless the password is already a dictionary file.


    # Hashcat


    Hashcat is an all-purpose password cracker that can run off of your graphics card
    processor (GPU) or your CPU. The GPU version, OCL-Hashcat-plus (or CUDAhashcat-plus
    depending on your video'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'is courted as the world’s fastest md5crypt, phpass, mcash2 and WPA / WPA2 cracker.


    Hashcat is a multi-threaded cracker, so if your CPU can run several threads, it
    will use them. But the real speed comes into play using the horsepower of a GPU,
    the processor on your video card. If your GPU can run hundreds of threads, all
    of this power is used to break passwords.


    You can even harness the power of multiple video cards GPUs to create a monster
    cracking station.


    # Cracking NTLM passwords


    There is nothing like hands on practice, so let’s crack some hashes.


    Here are some ones:


    ```

    a4f9c4c06510bdcab6824ee77c30fd852

    2e4db83aa056289935daea328977b220

    d149886c6122b1654ba39932465528

    4a8441c8cb2b55e3ef645c83f01aa7b

    259745cb123a52aa2693aaacca2db552

    d5c2155161d7228302b90afd3cd5539

    5835048ce9240d564ec29a92403510ef

    b963c570102f18ed2c3329b5e4d0f

    f773c5db7d2bebfa4b0daec72e8c50a4

    5d05c3883ac48f1842f8f2b1c63d895a4

    6fad63faebf74211010f02ba62a1b3e

    43fcc6faeba63d14b26427c26d00410ef

    27c055ea55ecfedba01c022681d3da3f

    9349b142f202437a557fc521fcf8b2d3

    ```


    Simply put these hashes in a text file. In my example I used “Easyhash.txt” and
    placed them in the Desktop directory. I also copied the “RockYou.txt” password
    dictionary from the “/usr/share/wordlists” file to the desktop.


    (Remember the RockYou.txt file is compressed, so if you haven’t done so already,
    you will need to uncompress it using the “gunzip” command. The Wordlists chapter
    for more information.)


    We are going to run Hashcat, but we need to tell it a few things. We need to tell
    it what type of hashes we are using, the name of the hash file, the name of the
    dictionary file and finally the output filename to store the cracked hashes.


    You can see the different options by opening a terminal window and typing “hashcat
    --help”.


    Let’s get ahead and try to crack the hashes listed above.


    +   1. Open a terminal, navigate to the Desktop directory and type, “hashcat -m
    1000 Easyhash.txt rockyou.txt -o cracked.txt”


    ```

    root@kali:~# hashcat -m 1000 Easyhash.txt rockyou.txt -o cracked.txt

    ```'
