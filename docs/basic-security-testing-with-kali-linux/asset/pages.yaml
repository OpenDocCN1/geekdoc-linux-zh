    # # Conclusion


    In this short section we saw how to escalate a user that has Administrator privileges
    to the super user System level account. We were able to do this by running a Meterpreter
    module that allowed us to bypass the Windows User Access Control security feature.


    Once we have system level access we can do anything that we want to do. We demonstrated
    this by dumping the password hashes from the security database.

    The UAC bypass was possible because the user account we access to was an administrator
    level account. It is imperative that users always be given a non-administrator
    level account. The security repercussions to this rule should be seriously considered.'
