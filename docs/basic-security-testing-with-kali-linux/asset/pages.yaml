    How do you differentiate between the local system and the remote system that you
    are attached to?


    All the commands are assumed to be on the **remote** system. So for example to
    listing a directory listing of the remote system, just use the “ls” command:


    ![](img/ff9cd19afe449ae54278ee429e668a6f_46_1.png)


