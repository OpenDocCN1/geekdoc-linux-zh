    # Running Scripts


    The last topic we will cover in this section is running scripts. Meterpreter has
    over 200 scripts that you can run to further expand your exploitation toolkit.


    We actually have already touched on these. We used the “run” command to use the
    sound and webcam script attacks. We will take a moment and cover a couple of them.


    To see a list of all the available scripts just “Run <tab><tag>”:


    ```

    $ meterpreter > run

    Display all 213 possibilities?(y or n)

    ```


    Then just, “run” with the script name that you want to try.

    Here are a couple of the more interesting ones:


    # CHECKVM:


    Sometimes when you get a remote shell you are not sure if you are in a Virtual
    Machine or a standalone computer. You can check with this command.


    ```

    $ meterpreter > run checkvm

    [+] Checking if target is a Virtual Machine ....

    [+] This is a VMware Virtual Machine

    ```


    As you can see it correctly determined that our target was a VMware VM.


    # GETGUI:


    Getgui is a neat little script that will allow you to enable remote desktop on
    a Windows machine (if it isn''t already enabled) and create a remote desktop user.


    The user is added to both the remote desktop user group and the administrators
    group. This makes it handy if you want to connect back to the machine at a later
    date.'
