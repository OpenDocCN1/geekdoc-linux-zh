  **b.** 引入口译员\n**c.** 花时间教育团队成员了解文化差异\n**d.** 记录每个团队成员的个人偏好\n\n**5.** 假设虚拟项目团队的所有成员都说同一种语言，但住在世界不同的地区。团队可能需要解决的最两个通信问题是什么？\n\
  \n**a.** 语言障碍和文化差异\n**b.** 地理因素和文化差异\n**c.** 语言障碍和地理因素\n**d.** 地理因素和个人偏好\n\n###\
  \ 基础知识\n\n#### 通信方法\n\n项目通信通过不同的方法和媒介进行。项目经理必须理解所有可用的方法和媒介，以确定对于可能出现的任何情况最佳方法和媒介。这些选择受到本章详细讨论的许多因素的影响。项目经理负责为所有团队成员和利益相关者记录通信信息。这可能包括电子邮件地址（工作和私人）、电话号码、即时消息账号等。这些信息作为通信计划的一部分被记录。\n\
  \n***\n\n### 注意事项\n\n通信计划记录了团队成员与利益相关者之间的沟通。如果非团队成员或利益相关者需要项目信息，应由项目经理处理。\n\n***\n\
  \n对于 Project+ 考试，项目经理必须理解以下通信方法：会议、电子邮件和传真、视频和语音会议、即时消息和短信、面对面沟通、印刷介质的分发以及社交媒体。\n\
  \n![图像](img/00004.jpeg)\n\n### 会议\n\n项目会议将在项目团队内部进行，但会议也是与项目利益相关者、客户和第三方进行沟通的最佳方式。会议中的讨论和对话可以面对面、在线甚至在不同的地点进行。\n\
  \n团队会议应按照定期计划举行，例如每个工作日的早上或周一上午 10 点，理想情况下应在相同的地点举行，例如会议室或 Google Hangout 上。项目经理应该理解启动会议、虚拟会议与现场会议、计划会议与临时会议以及结束的用途、优点和局限性。\n\
  \n### 启动会议\n\n`启动会议` 是项目团队和项目发起人的第一次会议，在项目启动阶段之后举行，通常在执行阶段开始之前的计划阶段。项目利益相关者也可能被邀请参加启动会议。在启动会议之前，项目经理应确保项目的主要部分已经定义且项目计划已完成，包括进度、预算和项目管理计划的所有部分。这种会议通常被认为是介绍性的，以便所有团队成员能够彼此认识并理解每个人在项目中的职责。\n\
  \n启动会议不应侧重于文档记录，个人团队成员应该已经理解他们在项目中的角色。启动会议只是给团队一个机会认识所有人，并理解他们将如何共同工作产生最终的项目结果。\n\
  \n在这次会议期间，团队成员应该识别他们启动任务所需的内容，并将这些需求传给项目经理和项目发起人。项目经理负责确保尽快满足启动会议期间识别出的所有需求。\n\n\
  启动会议应该有一个设定的议程，以确保会议不会陷入项目细节的讨论中。保持启动会议简明快捷。\n\n**示例：** 一个项目经理完成了一个项目的启动和计划阶段，该项目旨在记录一家家具制造公司所使用的流程。该项目包括来自制造设施所有部门的团队成员。在项目执行之前，项目经理召开了启动会议，以确保所有项目团队成员和利益相关者都理解他们在项目中的职责，以及他们产生的结果如何影响其他团队成员。\n\
  \n#### 虚拟会议与现场会议\n\n\n\n\n\n项目团队成员之间应优先选择面对面会议，但有时举行面对面会议是不可能的。在这种情况下，虚拟会议可能是唯一的选择，特别是当项目团队成员在地理上分布分散时。虚拟会议通过如视频会议等技术进行（`virtual\
  \ meeting(#part0034.html_gloss377)`），允许来自不同地理区域的人员参加。作为沟通计划的一部分，项目经理应该提供关于何时举行虚拟会议与面对面会议的指南。此外，沟通计划还应为所有会议提供具体细节（谁、何地、何时以及如何）。\n\
  \n请记住，如果团队成员位于偏远地区或没有支持虚拟方法的技术，即使是虚拟会议也可能无法实现。此类问题在启动项目之前应得到充分考虑并记录。\n\n**示例：**\
  \ 一个新的环保项目涉及在办公室工作以及进行环境测试的团队成员。在现场工作时，团队成员可能无法参加项目团队的每日站会（daily scrum meetings），这是办公室举行的面对面会议。然而，每周项目状态会议——所有团队成员即使在现场也应预期参加——将是虚拟会议。当团队成员在现场工作时，他们需要适当的技术来连接到虚拟会议。\n\
  \n## 定计划会议与临时会议\n\n大多数项目将同时拥有定计划的会议和临时会议。定计划会议定期举行，通常在同一地点或通过相同的媒介进行。它们应该有计划的议程。临时会议则会在项目条件发生变化或发生紧急情况时产生。由于临时会议具有变动性，为它们建立指南很困难。如果发生了临时会议，请记录参与者和结果，以确保所有受影响的团队成员和利益相关者都能收到会议更新。\n\
  \n**示例：** 一个新的环保项目包括启动会议、每日站会、每周项目状态会议以及包含在项目计划中的里程碑会议。当一名团队成员在实地调查中发现新鱼类时，需要几位团队成员的专业知识来确定这一发现对项目的影响。对于这种情况，应该召开临时会议，会议结果可以在下一次每周状态会议上告知团队其他成员。\n\
  \n### 结项会议\n\n项目结束会议（`closure meetings(#part0034.html_gloss48)`，也称为结项会议）必须在项目实际完成后尽快举行，以确保在记忆还新鲜时记录最终的项目信息。在会议期间，与会人员应该审查项目并决定组织可以从中学习到什么。结项会议的产物是一份“教训”文档，供未来的项目、经理和团队使用。结项会议应该回答并记录此类类的问题：\n\
  \n![Image](img/00003.jpeg) 项目的主要成功之处有哪些？\n\n![Image](img/00003.jpeg) 主要的挑战有哪些？\n\
  \n![Image](img/00003.jpeg) 在进度、预算和风险管理方面学到了什么？\n\n![Image](img/00003.jpeg) 项目团队中包含正确的人员吗？如果没有，谁可以让项目变得更成功？\n\
  \n***\n\n### 注意事项\n\n在某些情况下，“教训”文档中需要包含机密信息。任何包含机密信息的文档都应该有定义的访问控制列表（ACL），以确保只有获得授权的人员才能阅读该文档。如果有人需要访问但没有适当的权限，则应提供“教训”文档的脱敏版本。\n\
  \n***\n\n![Image](img/00004.jpeg)\n\n## 电子邮件和传真\n\n如今，通过电子邮件通信比通过传真通信更常见。在大多数情况下，电子邮件或传真通信没有验证通信已被阅读的方法，尽管通常可以确认收执。保留已发送的电子邮件可以确保通信证明，但在没有接收方配合的情况下，通过传真证明通信要困难得多。对于大多数项目来说，电子邮件和传真通信被视为非正式通信方法。\n\
  \n某些利益相关者和项目团队成员可能偏好电子邮件而非其他类型的通信。项目经理应该在利益相关者注册和其他项目文件中记录此类偏好。\n\n**示例：** 一个新项目将为一种新型环保汽车设计创建一个原型。项目团队成员在多个全球地点工作。在本项目中，电子邮件可能是团队成员之间最常见的通信类型。然而，项目经理应该定期使用视频或语音会议安排虚拟项目状态会议。大多数文档应通过云端共享。在需要传输已签署的纸质文档的情况下，通过传真发送签署文件将是确保文档及时到达目的地的最快方法。所有传真文件的原件都应保留在发送地或接收地（如果文件原件邮寄给接收方）。这些过程应在沟通计划中定义。\n\
  \n![Image](img/00004.jpeg)\n\n### 视频和语音会议\n\n视频和语音会议是极佳的通信工具，特别是当项目团队成员在地理上分散时。然而，请记住，与会者需要执行视频或语音会议的资源。如果使用互联网连接，视频会议比语音会议需要更多带宽，但视频会议提供了查看其他参与者并阅读其肢体语言的额外好处。\n\
  \n无论使用哪种通信方法，项目经理都必须确保与会者拥有参加会议所需的适当硬件和软件资源。\n\n**示例：** 一个新的应用程序开发项目涉及遍布团队成员。大多数成员拥有高速互联网连接，但其中一个人住在农村地区，带宽有限。语音传输在他的连接上通常运行良好，但视频传输经常出现故障。项目经理应确保团队理解该成员的带宽限制，鼓励团队对任何涉及该成员的通话使用语音会议。对于不涉及该成员的通话，应使用视频会议。此信息应记录在沟通计划中。\n\
  \n![Image](img/00004.jpeg)\n\n## 即时消息和短信\n\n即时消息和短信息是现今常见的通信方法。虽然这两个术语经常被同义使用，但它们实际上描述的是两种不同的技术。即时消息（`Instant\
  \ messaging(#part0034.html_gloss140)`）使用由供应商（如 Google 或 Microsoft）管理的计算机或移动应用程序。短信（`Text\
  \ messaging(#part0034.html_gloss362)`）是通过手机运营商的通信带宽在移动设备上进行的文本“对话”。幸运的是，这两类供应商都提出了提供跨平台访问的解决方案。大多数即时消息\
  \ App 都可以安装在移动设备和手机上。短信应用程序可以安装在计算机和其他允许手机通信的设备上。\n\n这两种形式的通信都具有优势：\n\n![Image](img/00003.jpeg)\
  \ 在不说话的情况下通信允许用户在发送消息的同时参与其他活动（例如在面对面会议期间）。\n\n\n\n\n\n![Image](img/00003.jpeg)\
  \ 多次对话可以在所有参与者不同时的情况下进行。\n\n![Image](img/00003.jpeg) 无面化通信为某些人增加了信心，让他们能够交流他们不愿面对面或通过电话说出的信息。\n\
  \n![Image](img/00003.jpeg) 消息传递在几乎所有地点都是方便的。\n\n![Image](img/00003.jpeg) 回复消息可以延迟到更方便的时间。\n\
  \n当然，消息传递也有一些缺缺点：\n\n![Image](img/00003.jpeg) 由于无法传输语气和肢体语言，误解是常见的现象。\n\n![Image](img/00003.jpeg)\
  \ 消息丢失或顺序错乱可能会导致混乱。\n\n![Image](img/00003.jpeg) 缩写或术语可能被误解。\n\n![Image](img/00003.jpeg)\
  \ 消息传递具有内置的字符限制。\n\n![Image](img/00003.jpeg) 自动更正和文本转语音功能经常会导致通信错误。\n\n项目经理需要理解消息传递方法的局限性。制定一项要求所有接收者确认消息的政策可能是重要的，以确保所有消息都已接收并阅读。无论政策如何，消息传递方法都应仅用于非正式通信或召集紧急或临时会议。此外，组织可能希望采取某种政策，将所有文本或即时消息保留永久记录。请记住，某些应用程序并不提供此功能。\n\
  \n项目经理应该在团队内部解释短信的规则。虽然这种形式的消息传递对于快速提问非常棒，但在移动设备的键盘上输入长回复对某些用户来说可能是很麻烦的。如果消息需要的回复超过一句话，使用电子邮件可能是更好的选择。\n\
  \n**示例：** 一项零售店翻新项目涉及由总承包商管理的多个承包商团队，所有团队都在商店地点工作。项目经理与总承包商举行每周状态会议。当项目赞助人请求翻新某个特定方面的当前状态时，项目经理希望提供最新的信息。在这种情况下，向总承包商甚至分包商发送短信可以快速获取所需的必要信息。\n\
  \n![Image](img/00004.jpeg)\n\n### 面面沟通\n\n项目经理通常偏于面对面沟通。无论是正式的计划会议还是临时会议，面对面沟通都是最有效的方法，特别是在做出项目决策时。启动会议、变更控制委员会会议和结束会议通常是面对面进行的。某些股东也可能偏好面对面接收某些重要信息，例如项目状态更新。项目经理需要在项目沟通计划中记录有关这种沟通偏好的特定细节。\n\
  \n**示例：** 几个月前，启动了一个为新应用程序创建文档的项目。营销部门通知项目赞助人，客户已经表达了对购买该新应用程序的兴趣，赞助人决定加快项目进度。项目经理与团队成员举行面对面会议，征求关于压缩进度（crash\
  \ schedule）的想法。面对面会议有助于确保项目团队充分讨论所有可能的解决方案，并对其进行记录，以便赞助人对该做什么做出最终决定。项目经理必须对提议的方案进行彻底分析，确保理解所有的约束变化。进度的压缩通常意味着需要更高的预算和更多的资源。\n\
  \n![Image](img/00004.jpeg)\n\n### 纸质媒体的分发\n\n大多数项目都会产生大量的文档，通常以打印形式分发。这些文档通常还存储在中心位置，以便团队成员和利益相关者方便访问。项目经理应该保留一份与项目相关的纸质媒体列表，注明谁拥有主文件或应该接收副本。记录这些信息将有助于在文档可用时确保相关方都能收到文档，并在团队成员突然离开项目时确保文档不会丢失。\n\
  \n如今许多组织依赖使用云或文档共享应用程序将文档分发给多个接收者。项目经理需要选择提供项目所需功能的最佳解决方案。应授予团队成员和利益相关者对每份文档的适当访问权限；某些人可能需要完全读写权限，而另一些人只有读取权限。\n\
  \n**示例：** 采用了一个将为新型高科技玩具创建营销材料的项目。当平面设计师创建用于营销材料的图像时，团队成员在图像上传到云端后查看数字图像。项目经理需要记录这些图像或其他媒体的物理副本何时打印并分发给团队。在某些情况下，查看数字图像与物理副本的图形和营销材料看起来可能完全不同。\n\
  \n![Image](img/00004.jpeg)\n\n### 社交媒体\n\nFacebook 和 LinkedIn 等社交媒体现在被用于个人和业务需求。组织可以创建仅包含团队成员和利益相关者的私组，利用这些小组进行通信并分发适当的材料。随着社交媒体应用程序功能的演变，项目经理将需要意识到这些变化，寻找使用这种通信方法的新途径。\n\
  \n处理社交媒体时应非常谨慎。与其确保团队成员理解并遵循组织的社交媒体指南，不如禁止在社交媒体渠道发布内容来容易。某些项目可能需要聘用公关（PR）人员以确保将适当的信息发布在社交媒体上。引入公关专业人士可以减少无意泄露机或敏感信息的概率。\n\
  \n**示例：** 一家大型在线零售商正在设计一种创新电子设备，该设备将根据过去的购物习惯以及用户食品储和冰箱的内容创建数字购物清单。项目经理通知所有团队成员项目的机密性，并从每个人那里获得了一份签署的非保密协议（`NDA`）。`NDA`\
  \ 特别禁止在任何社交媒体论坛上发布有关项目的信息。在该项目中，所有暗示新产品的社交媒体帖子都应来自公司的营销部门，然后这些帖子可以由团队成员分享。\n\n![Image](img/00004.jpeg)\n\
  \n### 沟通的影响因素\n\n项目团队使用的沟通方法通常受到其他项目因素的影响。理解这些影响可以帮助项目经理在各种情况下确定使用的最佳沟通方法。最好预见到这些影响并为之制定计划。\n\
  \n项目沟通受到语言障碍、时区和地理因素、技术因素、文化差异、组织间和组织内部差异、个人偏好、和谐和关系建立、消息内容和关键性因素以及利益相关者沟通需求的影响。作为沟通计划的一部分，所有这些细节都应该记录，包括特定的利益相关者沟通需求。项目经理应该记录必要的沟通频率、报告详细程度、沟通类型、保密性限制和偏好的沟通风格。\n\
  \n\n\n\n\n### 语言障碍\n\n当团队成员或利益相关者使用不同语言时，`Language barriers`会影响项目沟通。这些影响通常容易预见。如果项目团队成员或利益相关者使用不同的语言，项目经理必须找到方法克服可能出现的任何沟通问题。解决方案可能包括翻译文档、聘请口译进行口头交流、使用视觉化沟通和培训方法等。另一种策略是受影响的团队成员学习一些所需的其他语言的基础知识，这也是一种极佳的团队建设手段。尽管很难精通另一种语言，但只要学习基础就能助于简单的沟通。\n\
  \n虽然口头语言障碍看起来显而易见，但项目也可能涉及听障人员。可能需要手语翻译员。一些聋人或听力障碍人士会读口型，但如果他们与沟通对象使用不同的语言进行交流或阅读，这并无无帮助。\n\
  \n项目经理需要让所有团队成员意识到任何语言障碍，努力确保所有的沟通都能考虑到所有接收者的语言需求。\n\n### 时区与地理因素\n\n与语言障碍一样，时区和地理因素对项目沟通的影响也是容易预见的。如果项目团队成员或利益相关者在不同的时区或地理区域工作，应当记录这些信息。项目经理在制定项目进度和安排会议时需要小心，以确保时间和位置差异不会对计划中的任务及其依赖关系产生不利影响。某些会议或其他沟通可能需要在其他时区的团队成员不在场的情况下进行。在这种情况下，所有错过会议或其他沟通的人都将尽早获得更新。\n\
  \n项目经理需要确保所有团队成员都理解任何相关的时区或地理因素，并努力确保所有的沟通在时间上是恰当的。\n\n**示例：** 一位项目经理和她的大多数团队成员位于美国纽约州纽约市的公司总部，那里使用的是东部标准时间（EST），UTC\
  \ –5。其他几位团队成员位于印度新里里的办公室，采用的是印度标准时间（IST），UTC +5.5。其他团队成员在英国伦敦工作，采用的是格林威治标准时间（GMT），UTC\
  \ +0。为了召集整个团队召开周会，项目经理可能会安排在东部时间上午 8:00（IST 时间晚上 6:30，GMT 时间下午 1:00）举行半小时的视频会议，这样新里里的团队成员就不必留在办公室留到深夜。偶尔在纽约时间下午\
  \ 1:00 举行的临时会议可能允许伦敦团队成员参加（当地时间下午 6:00），但会因为在 IST 时间晚上 11:30 而将新里团队成员排除在外。项目经理还可能选择在东部时间上午\
  \ 6:00 从家里主持每日远程站会会议，仅供国际团队成员参加（IST 时间下午 4:30，GMT 时间上午 11:00），然后在东部时间上午 10:00 在办公室为纽约团队成员举行第二次每日站会会议。在第二次站会会议期间，项目经理可以分享在早间会议上由远程团队成员报告的任何问题。\n\
  \n提示\n\n如果一个团队分布在多个时区，其中某些地区实行夏令时（DST），则会议安排也需要考虑到计划中的时钟调整。例如，在本书出版时，纽约实行东部夏令时间（EDT,\
  \ UTC –4），伦敦实行英国夏令时间（BST, UTC +1）。新里不实行夏令时，这意味着在夏令期间，上例中纽约/伦敦团队与新里团队之间的时差会减少一小时。\n\
  \n务必考虑地理因素如何与时间因素相结合。位于多个国家（甚至同一国家不同地区）的团队成员可能根据当地季节、流行天气状况、政府和公民法规等，在同一天以完全不同的方式庆祝活动、安排采购运输、旅行、发布产品等。一个简单的例子是，圣诞节在全球范围内于同一日期（12\
  \ 月 25 日）发生，在地球北半球是冬季而在南半球是夏季。同样，在上述的项目示例中，项目经理可能需要在纽约的冬季制定不同的周会时间表，因为冰或雪可能导致晨间出行变得危险。请参见后文“文化差异”部分，讨论文化（如宗教活动）如何也影响项目。\n\
  \n### 技术因素\n\n技术因素对项目沟通的影响可能不像语言障碍或地理因素那样容易预见。项目经理应该记录任何现有或潜在的技术问题，并尝试解决它们。如果无法克服技术因素，项目经理应该记录这些因素，并计划尽可能地减少它们对沟通的影响。\n\
  \n所有团队成员必须理解任何相关的技术因素，并努力确保所有的沟通受这些因素的影响降最低。今天的业务通常严重依赖电子通信，但每种类型的电子通信都有独特的无障碍问题。例如，并不是所有人都能在移动设备上阅读或输入文本信息。特别是设备尺寸的缩小，对老年人群以及视觉或身体残障人士的影响。记录团队成员或利益相关者不喜欢或无法使用的沟通类型与记录他们的偏好同样重要。\n\
  \n一个非常重要的技术因素是安全。发给人员的设备可能需要安全控制来保护组织的机密资产。为了让团队成员完成职责，有时可能需要临时禁用或覆盖安全控制，以赋予设备必要的功能。或者，可能需要安装额外的控制措施以确保组织的资产得到完全保护。\n\
  \n**示例：** 一家公司正在开发一种应用程序，为用户提供公司网络上设备的详细映射。几位团队成员负责测试该应用程序的功能。然而，发给这些团队成员的计算机不允许他们在没有管理员凭据的情况下安装应用程序。在这种情况下，项目经理可能需要一个临时管理员帐户来安装应用程序。另一种选择是临时禁用阻止应用程序安装的控制措施。无论何种方式，测试完成后，IT\
  \ 部门都需要确保临时管理员帐户被禁用或删除，或者重新启用控制措施。\n\n### 文化差异\n\n`Cultural differences` 基于个人思考、观察和听取世界的方式。一个人的文化塑造了其发送和接收信息的方式。同样的词对于不同文化背景的人可能具有不同的含义。将语言差异加入这种文化混合中，会增加影响沟通问题的可能性。\n\
  \n文化差异可以从几种方式限制项目：\n\n`Cognitive constraints` 是文化世界观，为所有新信息的比较提供了背景。例子包括宗教、识字水平、性别和经济状况。\n\
  \n\n\n\n\n![Image](img/00003.jpeg) `Behavioral constraints` 是每种文化的行为规则，影响着言语和非语言交流。示例包括眼神交流、直接讨论与委婉讨论问题，甚至是人与人之间的距离远近。\n\
  \n![Image](img/00003.jpeg) `Emotional constraints` 是表达情感的文化规则。示例包括大喊、哭泣、顺从以及任何其他的情绪表现。\n\
  \n项目经理必须理解团队成员和利益相关者之间的文化差异。通常，项目经理需要确保团队成员也理解这些文化差异，这是确保有效沟通的关键。\n\n**示例：** 有一个项目涉及两个不同国家的团队。在每周的项目视频会议期间，其中一个国家的团队做出了承诺，但这些承诺往往在周末结束前未能实现。另一个国家的团队对这些未实现的预期感到日益沮丧。项目经理咨询了一位专家，专家解释说文化差异（例如，在收到请求时不愿意向上级说“不”）可能导致了这些问题。随后，请了文化专家为两个团队提供培训，指导他们如何改进互动和团队。\n\
  \n### 组织间与组织内部差异\n\n`Interorganizational differences` 是组织之间的差异，而 `intraorganizational\
  \ differences` 是组织内部的差异。两种差异都会影响项目沟通。通常，根据组织管理风格的不同，不同的组织或组织内部的不同部门有完全不同的沟通需求。项目经理需要识别这些差异并与其配合。\n\
  \n**示例：** 一位外部承包商被要求向她的公司发送每日电子邮件更新，汇报其所有项目任务的状态。在某个项目中，项目经理仅要求他的团队（包括承包商和一些内部团队成员）两周提交一次电子邮件更新。为了避免重复劳动，承包商决定在向其公司发送每日更新时，抄送给该项目经理。否则，她不仅要向公司发送每日更新，还要向该项目经理发送双周更新。\n\
  \n项目经理必须理解影响项目沟通的所有组织间和组织内部差异，并寻找解决任何影响项目或项目团队差异的方法。\n\n**示例：** 某项目的所有利益相关者都会收到每周电子邮件状态更新。项目经理在团队每周项目状态会议后立即发送这些信息。一位利益相关者大约每隔周参加一次状态会议。经过几次会议，很明显这位利益相关者没有阅读任何状态更新，因为她经常对在之前的会议中已充分讨论并在状态邮件中讨论过的话题提出基础问题。回答她的问题浪费了会议时间。项目经理应该询问该利益相关者是否收到了邮件，并鼓励她阅读。如果问题得不到解决，可能需要让其主管，以防止浪费时间。\n\
  \n### 个人偏好\n\n大多数人倾向于某些类型的沟通。项目经理应该与所有项目团队成员和利益相关者合作，识别他们偏好的沟通方式。虽然通过偏好方式进行沟通并不总是可行，但记录这些偏好对于确保团队知道联系任何个人的最佳方法很有用。例如，某些团队成员可能不想通过个人电子邮件地址或家庭座机电话联系。然而，项目经理应该为每位团队成员列出多种联系途径，以防偏好方法不可用（例如在电子邮件服务器维护或停电期间）。\n\
  \n在紧急情况下，最有效的沟通方式通常是应该使用的方法，无论它是否是偏好方法。\n\n这些偏好最好在沟通计划中进行跟踪，但可以进一步细化到一份整个项目团队都可以访问的沟通清单中——并非所有项目沟通（特别是在紧急情况下）都可能涉及项目经理。应该鼓励团队成员打印此列表，以防电子技术故障导致无法访问数字文件。\n\
  \n## 建立良好关系\n\n`Rapport` 是基于寻找共同点与他人或小组和谐相处。在项目团队成员之间建立良好关系有助于个人和小组之间的关系。在项目开始时，破冰的介绍活动可以帮助团队成员建立关系。项目经理应该寻找团队成员之间的共同点，例如共同的经历、运动偏好、爱好等。在介绍中融入幽默会有帮助。\n\
  \n### 注意事项\n\n项目经理可能需要为团队成员提供幽默指导。一个人的趣事可能被另一个人视为性别歧视。。此类担忧通常与文化差异有关。\n\n由于某些人自然不太分享个人信息，项目经理可能决定在启动会议期间让每位团队成员进行简短介绍，然后要求每个人分享一个关于自己的独特之处。建立良好关系的另一个优秀技巧是在项目工作开始后让团队成员轮流领导团队会议。某些项目成员甚至可以启动项目门户，列出所有团队成员、他们的成就、对项目的贡献以及其他有趣的信息。无论使用何种方法，关键在于帮助团队成员相互了解，使他们在一起工作时感到舒适。\n\
  \n如果团队成员之间缺乏良好关系，项目可能会遇到沟通问题，因为团队成员感到不自在表达自己。项目经理应该主导建立团队成员之间关系的工作。\n\n## 消息内容与关键性因素\n\
  \n消息内容对项目沟通有影响，因为内容可能决定受众和所使用的沟通方法。紧急沟通可能需要通过快速机制（如即时消息）发送，而每周状态报告可以通过不那么紧迫的介质（如电子邮件）传输。项目的沟通计划（项目管理计划的一部分）应该记录预期的沟通类型、目的和预期方法。项目团队成员和利益相关者可以参考此文档来确定信息应如何传输。\n\
  \n消息的关键性对项目沟通有影响，因为关键消息必须及时交付。正常的项目沟通可能不需要那么及时的交付，但可能需要通过多种进行编辑和访问。项目经理可能需要指定关键性级别（如\
  \ `normal`、`elevated`、`critical` 和 `emergency`），并为向项目沟通分配这些级别提供指南。\n\n\n\n\n\n项目经理应该考虑到所有类型的消息，并就紧急沟通、变更沟通、项目状态沟通、质量保证沟通、预算沟通、进度沟通等方法提供指导。这些指导确保确保团队成员知道如何处理每种沟通，而无需不断联系项目经理获取指示。此外，项目经理应该记录所有关键性级别以及每种级别所使用的沟通方法。\n\
  \n### 利益相关者沟通需求\n\n利益相关者可能会根据其偏好向项目经理提供特定的沟通需求。项目经理应该在沟通计划中记录这些需求。某些利益相关者的需求可能包含在已定义的常规项目沟通中，但其他偏好可能超出这些参数范围。常见的利益相关者需求包括沟通频率、报告详尽程度、沟通类型、机密性限制以及定制的沟通风格。通常，这类细节最易于通过图表或电子表格进行记录。创建沟通模板可能是确保满足所有利益相关者沟通要求的最佳方式。\n\
  \n### 沟通频率\n\n利益相关者可能会为项目沟通指定特定的频率。例如，项目中的大多数利益相关者可能希望每周收到项目状态报告，但其中某人希望每隔一天收到一次状态报告。在这种情况下，最简单的方法可能是让该利益相关者参加每日团队会议。否则，项目经理将需要找到一种，每隔一天为该利益相关者提供他所需的信息。\n\
  \n利益相关者可能还希望与项目团队定期互动。项目经理应该尝试在进行其他定期安排会议时鼓励这种沟通，以实现团队效率最大化。\n\n## 报告详尽程度\n\n某些利益相关者可能对某些项目沟通要求更高或更低级别的报告详尽程度。假设你团队的大多数利益相关者希望项目状态报告仅显示任务的开始和结束信息，但另一位利益相关者还想知道哪些项目团队成员负责每项任务。最简单的解决方案可能是创建一个包含所有利益相关者所需全部信息的报告，而不是根据利益相关者的需求制作不同的报告。如果一份报告无法满足所有人的需求，项目经理可以使用单独的报告模板确保每份报告都包含所有核心信息。\n\
  \n### 沟通类型\n\n利益相关者通常偏好某些类型的沟通，包括本章较之前定义的方法。例如，项目中的大多数利益相关者可能偏好通过短信接收所有紧急沟通，而其他利益相关者则偏好使用电子邮件，因为他们所在地区的手机信号不稳定。在这种情况下，所传达的内容可能是相同的，只是使用了不同的媒介。记录此类需求有助于确保为每个利益相关者使用适当的沟通方法。\n\
  \n## 机密性限制\n\n某些项目沟通可能有机密性限制，例如需要某些安全许可级别的信息。这种情况在涉及新技术开发或政府实体的项目中非常典型。在这种情况下，沟通文档应包括每个利益相关者的机密级别以限制访问权限。\n\
  \n**示例：** 一公司正在开发一种使用替代燃料源的新发动机。由于该项目的信息对竞争对手具有价值，项目经理必须确保对所有项目沟通进行机密性评估。某些沟通（如项目状态报告）可能具有较低的机密级别，并适用于所有利益相关者。其他沟通（如包含商业秘密的研究发现）可能仅限于具有适当安全许可的特定利益相关者。\n\
  \n如果机密性限制很重要，项目经理将需要记录不同的机密级别以及哪些类型的沟通适用于每个级别。还需要一份访问控制列表，以映射每个利益相关者的访问级别。\n\n###\
  \ 沟通风格\n\n项目经理可能需要根据利益相关者的行为特征调整他们的沟通风格。为了应对不同性格类型，主导、影响、稳健、谨慎（DISC）分类法可以帮助项目经理理解个体利益相关者的行为风格：\n\
  \n![Image](img/00003.jpeg) **主导型人格：** 主导型个人被称为*直接型*或*控制型*，他们需要简洁且有力的沟通。基本上，这些人偏好纯事实，而不需要太多细节。\n\
  \n![Image](img/00003.jpeg) **影响型人格：** 影响者非常社交，偏好往复式沟通。影响者想要细节，并反过来会提供大量的反馈。\n\n\
  ![Image](img/00003.jpeg) **稳健型人格：** 稳健风格的利益相关者冷静、从。一旦这些利益相关者被说服项目的必要性，他们就是忠诚的，并在真诚的感谢中成长。\n\
  \n![Image](img/00003.jpeg) **谨慎型人格：** 由于谨慎的利益相关者是以任务为导向的，他们更倾向于让人打电话预约，而不是直接拜访并可能破坏他们的创意流。在处理这种人格类型时，项目经理应该充分准备，带有详细的书面文档进行面对面。\n\
  \n项目经理必须调整其个人风格以满足这些性格类型的需求。调整沟通方法以适应每个利益相关者将有助于确保项目沟通成功。\n\n## 考试准备\n\n正如引言中“如何使用本书”部分提到的，你有几种准备考试的选择：此处的练习；第\
  \ 15 章“最终准备”；以及在线 Pearson 测试准备软件。\n\n## 复习所有关键主题\n\n回顾本章最重要的主题，这些主题在页边缘有关键主题图标。9-2\n\
