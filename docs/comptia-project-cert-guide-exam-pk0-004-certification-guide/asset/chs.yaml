  \n# 第 3 章 项目成本控制\n\n本章涵盖了以下主题：\n\n![Image](img/00003.jpeg)\n\n### 理解项目成本控制\n项目总成本、支出跟踪与报告、消耗率、成本基准/预算（计划与实际）以及成本控制计算（包括\
  \ EVM、EAC、ETC 和 TCPI）。\n\n项目面临的主要限制之一是预算，该预算是在项目的规划阶段建立的。项目经理负责在整个项目中跟踪预算。如果预算不足以完成项目，项目经理将要求项目赞助者提供更多资金。因此，项目经理必须理解并实践严谨的项目成本控制。\n\
  \n> **注意**\n> 深入理解项目进度对于管理项目成本至关重要。第 4 章“项目进度，”提供了有关项目计划、执行和修订进度的详细信息。\n\n本章涵盖了\
  \ Project+ 考试的目标：\n\n**1.4 识别项目成本控制的基础知识。**\n\n> **注意**\n> 提醒：CompTIA 可能在 Project+\
  \ 考试中使用与行业标准术语略有不同的表达。有关已知词汇差异的详细列表，请参见第 15 章“最终准备。”\n\n## “我已经掌握了吗？”测验\n\n“我已经掌握了吗？”测验可以让你评估自己是应该仔细阅读整个章节，还是应该跳到“考试准备任务”部分。如果你对这些问题的答案或对自己对这些主题知识的评估有疑问，请阅读整个章节。表\
  \ 3-1 列出了本章的要标题及其对应的“我已经掌握了吗？”测验题。你可以在附录 A“‘我已经掌握了吗？’测验与复习题答案。”中找到答案。\n\n### 表 3-1\
