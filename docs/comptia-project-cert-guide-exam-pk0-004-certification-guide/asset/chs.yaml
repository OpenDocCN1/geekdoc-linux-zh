  \n**5.** 哪个项目角色主要负责管理项目时间？\n**a.** 项目经理\n**b.** 发起人\n**c.** 项目团队\n**d.** 进度计划员\n\
  \n**6.** 下列哪项*不是*PMO 的职责？\n**a.** 设定项目管理标准\n**b.** 提供模板\n**c.** 估算成本\n**d.** 提供工具\n\
