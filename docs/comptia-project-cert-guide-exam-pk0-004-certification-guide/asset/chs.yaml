  c. 确保所有受变更影响的团队成员都记录在案\nd. 确保变更所需的所有步骤都记录在案\n\n### 4.一个项目任务耗的时间将比原计划预计的长。应该启动什么类型的变更请求？\n\
  \na. 进度变更\nb. 预算变更\nc. 风险事件\nd. 需求变更\n\n### 5.一名项目团队成员获得了绩效加薪，导致每小时薪率提高。应该启动什么类型的变更请求？\n\
  \na. 风险事件\nb. 进度变更\nc. 资源变更\nd. 预算变更\n\n### 6.你发现你管理的项目所需的实验室在原计划时间内无法使用。然而，你已经预到了这种可能性，并制定了替代计划在稍后日期完成任务。以下发生了哪种情况？\n\
  \na. 预算变更\nb. 资源变更\nc. 风险事件\nd. 进度变更\n\n### 7.分配用于完成项目任务的设备不可。应该启动什么类型的变更请求？\n\n\
  a. 进度变更\nb. 资源变更\nc. 预算变更\nd. 采购变更\n\n### 8.你的公司决定购买一家竞争对手以获得其知识产权和业务联系。这是哪种组织变更？\n\
  \na. 业务收购\nb. 业务拆分\nc. 内部重组\nd. 外包\n\n### 9.在你管理项目期间，公司宣布销售和营销部门将合并为一个部门。这是哪种组织变更例子？\n\
  \na. 业务合并\nb. 搬迁\nc. 业务流程变更\nd. 内部重组\n\n### 10.在你管理项目期间，公司决定所有超过 $25,000 的采购必须通过涉及三名高层管理人员的正式审批流程。你的项目计划进行多次超过此金额的采购。这是哪种组织变更例子？\n\
  \na. 外包\nb. 业务拆分\nc. 业务流程变更\nd. 业务合并\n\n## 基础知识\n\n![Image](img/00004.jpeg)\n\n\
  ### 变更控制流程\n\n项目的`change control process`(#part0034.html_gloss40) 是用于审查所有变更请求、批准变更、管理变更并沟通它们将如何影响项目的正式程序。项目的`变更控制委员会\
  \ (CCB)`(#part0034.html_gloss39) 是负责审查每项请求的项目变更并批准或拒绝该请求的个人小组。在较小的组织中，CCB 可能仅包含项目经理和项目发起人，但仍必须建立正式的\
  \ CCB。变更控制流程是项目经理的最终责任，尽管其他项目实体可能是审批或拒绝过程的一部分。\n\n> **注意**\n> 如果 CCB 正在考虑推迟请求，通常的响应是给予条件批准。（“如果发生了某特定情况，我们将批准此变更。如果没有，则变更将不实施。”唯一可以推翻\
  \ CCB 的人是项目发起人，这种情况很少发生，因为 CCB 通常包含项目发起人或对批准或拒绝变更背的原因具有专家知识的赞助组织人员。）\n\n变更控制流程由一系列步骤组成：\n\
  \n1. **识别并记录变更。**\n2. **评估变更的影响并提供合理的理由。**\n    a. 开发一个`regression plan`（回归计划），以防变更需要撤销。\n\
  3. **识别变更批准权限。**\n4. **获得变更的批准。**\n5. **实施变更。**\n6. **验证变更并检查它如何影响项目质量。**\n7. **更新项目文档、审计项目并实施版本控制。**\n\
  \n此外，项目经理应在整个变更控制过程中根据需要沟通有关变更的信息。\n\n> **注意**\n> 这些步骤的措辞在 Project+ 考试和其他常见标准（如《项目管理知识体系指南》PMBOK）之间可能略有不同。在大多数情况下，作者选择使用标准的术语，而不是\
  \ CompTIA 的术语。\n\n### 识别并记录变更\n\n变更请求是对修改项目中的任何文档、交付物或基线的正式提议。以下类型的变更请求在大多数项目中是典型的：\n\
  \n![Image](img/00003.jpeg) 进度变更\n![Image](img/00003.jpeg) 预算变更\n![Image](img/00003.jpeg)\
  \ 风险事件\n![Image](img/00003.jpeg) 需求变更\n![Image](img/00003.jpeg) 质量变更（包括缺陷/纠正措施）\n\
  ![Image](img/00003.jpeg) 资源变更\n![Image](img/00003.jpeg) 范围变更\n![Image](img/00003.jpeg)\
  \ 通信变更\n![Image](img/00003.jpeg) 利益者变更\n![Image](img/00003.jpeg) 采购变更\n![Image](img/00003.jpeg)\
  \ 组织变更\n\n每个项目都应该采用正式的变更请求模板。图 11-1 显示了变更请求模板的示例。\n\n尽管变更请求中记录的信息可能会根据项目和任何适用的组织标准而变化，但变更请求表至少包含以下组件：\n\
  \n![Image](img/00003.jpeg) 变更请求日期\n![Image](img/00003.jpeg) 变更控制标识 (ID)\n![Image](img/00003.jpeg)\
  \ 变更请求人名称\n![Image](img/00003.jpeg) 变更所有者名称\n![Image](img/00003.jpeg) 拟议变更详情\n![Image](img/00003.jpeg)\
  \ 变更分析的结果和估计，包括对范围、进度和/或预算的任何影响\n![Image](img/00003.jpeg) 项目经理分析后的签字\n![Image](img/00003.jpeg)\
  \ CCB 批准/拒绝后的签字\n![Image](img/00003.jpeg) 项目发起人签字\n![Image](img/00026.jpeg)\n\n\
  **图 11-1** 变更请求模板的一部分\n\n### 评估影响并提供合理的理由\n\n一旦提交了正式的变更请求，项目经理或其他指定的方应评估所请求变更对项目的影响，并为实施该变更提供合理的理由。首先，项目经理必须确定实施变更所需的精力。变更可能会影响项目的范围、进度、预算、质量、资源、风险、通信、采购和/或利益相关者。为了评估变更，项目经理应该使用对请求变更领域具有专业知识的专家和团队成员的专家判断和分析，以识别所有受变更影响的项目组件。一旦记录了潜在影响，项目经理将需要为该变更提供合理的理由。在评估影响和提供合理理由的过程中，项目经理还需要制定一个`regression\
  \ plan`（回归计划）。\n\n### 开发回归计划\n\n在某些情况下，即使在变更经过评估和批准后，也可能需要回到纳入变更之前的项目状态。因此，项目经理创建了一个`regression\
  \ plan`(#part0034.html_gloss268)，详细说明了撤销已批准变更的过程。\n\n\n\n\n\n**示例：** 一家珠宝公司正在开发一个新的移动应用程序，允许客户设计定制珠宝品。该应用程序的首个版本将仅允许设计戒指，稍后将作为独立模块添加其他珠宝物品。起初，应用程序会创建一个最终设计图，客户可以将此图带到公司的任何一家商店，由商店为该指定的单品制作模具。直接从此应用程序订购和购买定制珠宝的功能直到项目最后阶段才会添加。随着项目向应用程序添加新模块，还需要在当模块对应用程序的整体功能或其他模块产生问题时，具备移除该模块的能力。软件开发团队应该创建一个回归计划，以确保模块可以快速回滚。\n\
  \n## 识别批准权限并获取批准\n\n在评估所提变更的影响并确定其合理性后，项目经理必须识别变更的批准权限。在大多数项目中，`CCB` 负责在变更控制会议期间批准或拒绝请求的变更。`CCB`\
  \ 还可能记录并审查实施变更的过程。如果项目赞助人不是 `CCB` 的成员，项目经理可能还需要获得项目赞助人的批准，特别是当变更影响项目的范围、进度或预算时。此时，项目经理需要确保变更日志反映了所请求的变更及其处理结果。在此阶段，关于项目变更的利益相关者沟通也至关重要。\n\
  \n> 注意\n变更日志的示例请参见第 10 章，“沟通触发因素与目标受众](#part0025.html_ch10)”\n\n## 实施变更\n\n变更批准后，可以在项目中实施。项目经理应该与项目团队成员沟通，确保他们理解变更将如何实施，以及将如何影响项目的范围、预算和进度。变更的最终效果取决于实施的变更类型。（变更类型将在本章稍后讨论。）\n\
  \n### 验证变更并检查质量\n\n接下来，项目经理使用变更验证来确认变更已实施。在变更验证期间，项目经理还应该进行质量保证，以确保变更对项目质量标准没有负面影响。如果变更负面影响了项目的交付物或质量标准，项目经理应实施回归计划将项目恢复到之前的状态。\n\
  \n**示例：** 珠宝公司的移动应用程序允许用户设计定制戒指、耳环、手链和项链。应用程序创建一个完成的设计图像，客户必须将其带到公司的任何一家商店来订购最终产品。应用程序的新模块将允许客户定位并联系公司的任何一家商店以电子方式提交订单。然而，当测试新模块时，负责选择最近商店的算法似乎没有正常工作。项目团队应该使用回归计划回滚最新的模块，并在部署前修复它。\n\
  \n### 更新文档\n\n一旦完成验证，项目经理必须确保项目管理文档已更新，包括项目管理计划的基线和辅助计划。项目经理此时还应该进行项目审计，以确定项目是否处于正轨。在某些情况下，可能需要内部或外部审计员来保持独立性。审计完成后，其结果应被记录并与项目赞助人、利益相关者和团队进行沟通。\n\
  \n请记住，此时项目可能已经产生了多个版本的项目文档。项目经理对所有文档实施版本控制至关重要。在大多数情况下，这包括使用版本号，并在每份文档的开头或结尾提供按时间排列列表，详细说明发生的更改。有些组织将此跟踪工作更进一步，保留产品文档的所有版本。\n\
  \n### 变更沟通\n\n沟通对于确保项目赞助人、利益相关者和团队成员理解每项变更至关重要。项目经理应确保在整个变更控制过程中进行适当的变更沟通。对于所有变更请求，无论最终被接受还是拒绝，这都是必要的。\n\
  \n**示例：** 一个项目正在装修一栋建筑，`CCB` 批准了建筑卫生间位置的调整。项目经理需要在定期团队会议上传达此变更。此变更还必须通过收件者偏好的沟通方式告知给未参加这些会议的任何人。在大多数情况下，项目经理应该从团队成员、利益相关者和赞助人处获得某种形式的通知证明或正式签署，以确保每个人理解并确认了变更。\n\
  \n### 项目变更类型\n\n项目经理必须充分分析并理解所有项目变更。变更通常发生在大多数项目的所有方面，包括项目的进度、预算、风险、需求、质量、资源、范围、沟通、利益相关者和采购。接下来的章节将讨论并提供所有这些变更类型的示例，以及它们可能如何影响项目。\n\
  \n> 注意\n尽管 CompTIA 未在目标中专门地列出此项，但紧急变更在许多项目中都会发生，项目经理应该准备好处理此类情况。“紧急变更”部分讨论了此类变更以及它们可能如何影响项目的变更控制。\n\
  \n无论变更类型如何，项目经理必须充分分析变更对项目范围、进度、预算等的潜在影响。如果影响了其他项目团队成员或利益相关者，项目经理需要咨询他们以获得对变更的意见。接下来的每个章节都说明了处理该特定类型项目变更的方法。\n\
  \n> 注意\n无论变更类型如何，项目经理必须遵循之前讨论的变更控制程序。\n\n![图像](img/00004.jpeg)\n\n### 进度变更\n\n由于进度是预测性的估算，项目进度可能会发生变化。项目经理应该定期评估进度准确性，并向项目利益相关者沟通。当请求进度变更时，项目经理应该评估其对项目其他方面的影响，并告知项目团队、利益相关者和赞助人影响。\n\
  \n进度变更包括任务的缩短和延长、任务的添加和删除、任务分配以及任务延迟。如果受影响的任务位于关键路径上，整体进度将受到变更的影响。然而，如果受影响的任务不在关键路径上，该任务可能有足够的浮动或空闲，使得变更不会影响完成项目所需的总时间。由浮动和空闲涵盖的正常进度变更不需要正式的变更控制。但需要更新进度，以确保依赖任务的浮动和空闲任何更改都得到调整。\n\
  \n> 注意\n关于关键路径和浮动的更多信息，请参见第 4 章，“项目进度](#part0017.html_ch04)”\n\n\n\n\n\n如果任务被缩短或删除，预算可能会减少。如果任务被延长或增加，预算可能会增加。如果任务分配发生变化，预算可能会增加或减少，取决于新任务资源的成本。如果任务由于任何原因发生延迟，其依赖任务也将被延迟。如果该任务处于关键路径上，整个项目可能会被延迟。\n\
  \n图 11-2 显示了一个关键路径网。在这个示例中，如果任务 A、F、K、N 或 P 延迟，项目本身将延迟，因为这些任务构成了关键路径。然而，如果任务 C、H、L、O\
  \ 和 P 的延迟时间不超过两天，整体产品将不会延迟，因为 C–H–L–O–P 路径的浮时间为二天。\n\n![Image](img/00027.jpeg)\n\
  \n**图 11-2** 关键路径网示例\n\n**示例：** 项目经理接到通知，新房屋建设项目所需的橱柜交付将延迟。项目的许多任务可以在不受橱柜延迟影响的情况下继续。然而，在安装橱柜之前，厨房和浴室无法完成。项目经理需要针对交付延迟调整依赖任务（台面安装、水槽安装和电器安装）。所有步骤都是原始计划变更的一部分。如果原始安装人员在延迟的交付日期无法可用，且新安装人员的薪资更高，这种计划变更可能会导致预算增加。对于任何其他依赖任务，可能需要类似的成本调整。如果在发生原始计划变更时已获调整后的成本，那么这些变更也应一并批准，从而确保对项目约束的影响得到批准。\n\
  \n当发生此类变更时，项目经理应该与负责依赖任务的项目团队成员会面，听取他们对变更影响的意见。获取团队成员的反馈通常可以确保考虑范围内不会遗漏或忽略任何内容。\n\
  \n***\n\n提示\n\n当 `CCB` 分析变更时，会检查并记录其对所有约束的影响。因此，批准变更意味着批准了任何相关的变更。假设某项计划变更已批准，并记录了该计划变更将导致由于原始资源不可用而需要以更高的薪资支付不同的资源。这种依赖性的资源更改在计划变更批准期间自动通过。现在假设计划变更已批准，但项目经理*稍后*得知原始资源不可。在这种情况下，资源更改需要单独的变更请求。\n\
  \n***\n\n![Image](img/00004.jpeg)\n\n### 预算变更\n\n与项目计划一样，项目预算是对项目成本的预测性估算，因此可能会发生。项目经理应定期评估预算准确性，并向项目利益相关者沟通。当请求预算变更时，项目经理应评估其对项目其他方面的影响，告知项目团队、利益相关者和赞助者建议变更的影响。\n\
  \n预算变更包括任务成本、资源成本和采购成本的增加或减少。一个领域的成本增加可能需要削减其他领域的成本。成本的减少可能导致剩余预算用于其他成本。预算变更可能导致项目范围或项目计划的调整。\n\
  \n**示例：** 项目经理接到通知，大型图书馆改造项目所需新软件的所有竞标价格都高于最初估计。当然，项目经理需要调整项目预算。如果无法减少请求软件的功能数量，项目经理可能需要寻找其他领域和方法来削减成本。可能包括为图书馆购买质量较低的架子、减少购买的电脑数量、为建筑改造聘用更少的承包商等。\n\
  \n如果预算变更导致成本增加，项目经理应该与项目团队成员会面，听取他们对成本增加影响的意见，并讨论如何在其他领域削减成本。如果预算变更导致成本降低，项目经理应该告知项目团队，但可能不需要意见，因为剩余预算资金留存在备金中。\n\
  \n### 风险事件\n\n![Image](img/00004.jpeg)\n\n项目约束可能会受到已知风险事件的影响，但也可能发生未知风险事件，并可能识别出新的风险事件。如果风险在\
  \ `Planning` 阶段识别出，预算应已分配应急储备，以涵盖该风险发生时应对该风险的成本。解决方案可能简单地调整适当的项目约束（如范围、预算或计划）来应对该风险。此类情况可能不需要\
  \ `CCB` 的正式批准，但项目经理仍然需要沟通变更、更新项目文档，并照常进行版本控制和审计。已知风险通常由在项目计划期间分配的管理备用金覆盖。\n\n如果发生了在\
  \ `Planning` 阶段未识别的风险，项目经理将需要通过变更控制过程处理该风险事件的影响。步骤包括之前讨论的对风险影响进行全面分析。\n\n**示例：**\
  \ 已知风险：在 `Planning` 阶段，一项环境研究项目注意到天气事件可能会延迟或阻止研究数据的收集。项目经理已经在项目计划中加入了一定量的浮时间，以考虑这一已知风险事件。然而，在天气延迟后，一名原始项目团队成员无法在新的研究日期工作。这种情况将导致研究任务的人员分配发生变化。此外，如果使用新团队成员导致成本不同，则可能导致预算发生变化。\n\
  \n**示例：** 未知风险：一名团队成员意外需要请病假。项目经理需要分析失去该团队成员将如何影响项目计划。可能需要将该团队成员的任务分配给其他项目团队成员，这可能导致交付延迟。如果计划延迟不可接受，项目经理可能需要为该团队成员寻找替代者。无论发生什么，项目经理都需要确定这一未知风险事件如何影响项目计划和项目预算，并相应完成变更控制过程。\n\
  \n**示例：** 识别出新风险：一名团队成员通知项目经理，执行某些任务所需的实验室可能无法使用。项目经理应分析这一此前未识别的风险对项目计划和项目预算的影响。也许可以修订任务日期，或者有备用实验室。\n\
  \n在这些示例中，无论是预测了潜在的风险事件还是识别出了新风险，都需要编辑风险登记册。\n\n### 需求变更\n\n![Image](img/00004.jpeg)\n\
  \n\n\n\n\n项目需求在项目的启动和规划阶段会进行分析和记录，但新需求往往在执行阶段或监控和控制阶段被识别。项目需求由项目赞助和项目利益相关者指定。然而，所有给出的需求并不可能都会被纳入项目。如果识别出新的项目需求或删除了某个项目需求，项目经理将需要分析此变更将如何影响项目的范围、进度和预算。\n\
  \n新需求可能会导致项目范围和进度的变化，并导致项目预算的增加。移除需求也会改变范围和进度，并可能减少项目预算。\n\n**示例：** 一位项目利益相关者要求项目经理在一个软件开发项目中添加一个新功能。项目经理需要分析此变更对项目进度、预算和范围的影响。项目经理应该与项目团队成员会面，征取他们对新需求影响的意见。需要在进度表中添加一个或多个新任务，以适应新功能的开发，并且项目预算将会增加。如果新需求获得批准，则需要扩大项目范围以包含有关新功能的细节，并需要调整基线。\n\
  \n![Image](img/00004.jpeg)\n\n### 质量变更\n\n质量是项目符合其规格或满足项目赞助者期望的程度。质量变更包括在质量控制期间识别的缺陷和增强，导致变更请求。范围、进度或预算的任何变更都可能影响项目交付物的质量。项目经理必须确保所有质量测量作为质量管理计划的一部分进行记录。在整个项目生命周期中，项目经理必须确保质量保证和控制措施得以完成。\n\
  \n质量变更包括根据质量保证和控制措施或根据需求的变化更改交付物的质量参数。质量变更可能会对项目的范围、预算和进度产生负面或正面的影响，这取决于满足新质量标准所需的工作和资源。\n\
  \n**示例：** 聘请了一家塑料制造商为新款无人机生产一个储物箱。在项目的规划阶段，无人机制造商为塑料公司和项目经理提供了非常详细的箱体规格，包括外观、颜色、内部插槽尺寸和外部尺寸。在对\
  \ 15 个储物箱的原型运行进行测试时，无人机制造商确定箱体的塑料太薄了，无法在不损坏无人机部件的情况下承受跌落，因此要求使用更强的塑料。项目经理需要确定此规格变更对项目范围、进度和预算产生什么影响。很有可能，项目经理需要咨询塑料制造商的管理层和项目团队，以确定这一质量变化的全面影响。\n\
  \n![Image](img/00004.jpeg)\n\n### 资源变更\n\n资源变更是完成项目所需的材料资源或人员资源的任何变更：\n\n![Image](img/00003.jpeg)\
  \ `材料资源`包括项目可能需要的任何用品，例如为了完成城市道路路面更换项目所需的施工设备。对于材料资源变更，如果识别出的资源可用，项目经理可能需要寻找替代方案或供应商。材料资源变更通常会影响项目进度和预算。\n\
  \n**示例：** 一个道路铺设项目分配了一台项目赞助者拥有的设备来完成道路。在刚好需要该设备之前，它被分配给了一个优先级更高的项目。项目经理有几种解决此问题的方案。一种方案是寻找替代资源，例如从租赁公司租赁必要的设备，但此类资源变更会导致更高的成本。另一种方案是等待原始设备可用，这将导致进度延误。\n\
  \n![Image](img/00003.jpeg) `人员资源`是致力于完成项目的项目团队成员。对于人员资源变更，项目经理可能会尝试寻找替代团队成员或将核心任务转移给现有的团队成员。人员资源变更可能会影响项目进度和预算，分别取决于专业水平或生产能力以及薪资水平。如果替代资源无法产生与原始资源预期相同的质量，人员资源变更也会影响项目范围。\n\
  \n**示例：** 一位工匠是制作手工家居装饰项目的团队成员。项目进行五周后，该工匠必须离开项目。项目经理必须想办法完成分配给该人员资源的任务。她可能决定聘请一名新工匠，或将工作转移给团队中的另一位工匠。如果新团队成员与之前的技术一样，聘请新工匠将允许项目按计划进行。此外，新工匠可能需要不同的薪资标准。转移工作可能会影响项目进度并可能影响项目预算。在考虑人员资源变更时，项目经理必须将资源的技能、知识水平和薪资水平与被替换团队成员进行比较。\n\
  \n![Image](img/00004.jpeg)\n\n### 范围变更\n\n项目范围变更是指对项目约定工作范围的增加或减少请求。范围的增加可能要求项目预算相应增加，并在项目进度中增加额外任务。范围的减少可能会减少项目预算并从项目进度中移除任务。其中任何变更都可能影响项目所需的资源。\n\
  \n**示例：** 启动一个项目，将公司目前的双绞网络替换为光纤网络。在原始项目中，新网络将在三栋办公楼内实施。然而，在项目过半时，项目赞助者购买了第四栋建筑并要求将这栋办公楼也纳入项目。在这种情况下，项目经理需要确定为新建筑提供网络的成本，并必须获得材料和人员资源来部署这第四个网络。整个项目进度和项目范围也必须进行更改。\n\
  \n***\n\n注意\n\n此示例涉及范围变更；它不是范围蔓延（scope creep）。范围蔓延见第 7 章“项目约束与影响”。\n\n***\n\n![Image](img/00004.jpeg)\n\
  \n### 通信变更\n\n通信变更通常不像此为止讨论的其他变更那样对项目约束产生不利影响。这些变更通常涉及更改特定利益相关者或特定事件所需的通信类型。项目经理只需要在通信计划中记录此变更。在大多数情况下，通信变更不会导致任何预算、进度或范围的变更，不需要记录在变更日志中或遵循正式的变更控制流程。只有当请求会影响项目约束时，通信变更才需要遵循正式的变更控制流程。\n\
  \n\n\n\n\n示例：某利益相关者希望开始接收项目进度报告。这种更改只需通过将该利益相关者添加到该报告的分发列表中即可完成。\n\n示例：项目中的一个新利益相关者无法访问项目团队用于共享文档的软件。将该利益相关者与团队其他成员连接需要额外的硬件、网络等。这种通信变更会影响预算，因此必须通过正式的变更控制流程。\n\
  \n对于任何通信变更，项目经理都需要确保负责发送受影响通信的项目团队成员已收到变更通知。这些更改必须记录在项目沟通计划中，并结合版本控制进行实施。\n\n![Image](img/00004.jpeg)\n\
  \n### 利益相关者变更\n\n项目可能会经历两种类型的利益相关者变更。一种是由于职责变、招聘、解雇等导致的项目利益相关者的增加或移除。另一种是通过利益相关者需求的变更，这在技术上属于需求变更，正如前文“需求变更”章节所述。\n\
  \n由于利益相关者仅通过其影响力和他们要求的项目需求来影响项目，因此项目经理应确保对任何利益相关者的替换、增加或移除都记录在案。然后，项目经理应该与新的利益相关者会面，以确保他或她理解项目。项目经理还需要记录利益相关者的需求，这些需求之前可能尚未全部被纳入项目。\n\
  \n示例：一位新的人力资源经理是“更换人力资源部所有电脑”项目的利益相关者。如果该经理决定视频录制功能对所有电脑都很重要，而这并非原始需求之一，那么项目经理将需要评估此更改对项目范围、进度和预算的影响。\n\
  \n对于任何利益相关者变更，项目经理都需要确保项目团队成员理解利益相关者变更将如何影响通信和项目范围。\n\n![Image](img/00004.jpeg)\n\
  \n## 采购变更\n\n项目采购经历一个正式流程，其中记录采购需求、征集报价、选择供应商，然后进行实际采购。项目赞助者或采购供应商可以在此过程的任何时候请求采购变更。然而，一旦签署了采购合同且采购生产/交付在即，采购变更获得批准的概率就会降低。\n\
  \n示例：项目经理发现，在一个制造新无线设备项目所需的某部件规格中存在错误。如果招标邀请书（ITB）已经发布，项目经理将需要对 ITB 发布修正案。然而，如果项目经理已经在与选定的供应商进行谈判，他将需要修改合同以记录已发生的规格变更。选定的供应商需要时间来评估变更对合同（包括成本和进度）的影响。\n\
  \n对于任何采购变更，项目经理都需要确保采购供应商和项目团队成员理解采购变更将如何影响项目，特别是项目进度。如果采购变更将影响采购成本，可能还需要需要通知项目赞助者。\n\
  \n![Image](img/00004.jpeg)\n\n### 紧急变更\n\n紧急变更必须及时获得批准。此类变更用于恢复服务、防止事故发生、处理紧迫需求（如法律要求）等。如果需要紧急变更，项目经理应该召集紧急变更控制委员会（CCB）会议专门讨论该紧急变更。一旦获得批准，项目经理应该按照流程中的剩余步骤执行变更，以确保变更被快速实施。\n\
  \n示例：一个项目团队成员发现正在设计公共使用的应用程序中存在错误。该错误可能导致安全问题，使黑客能够访问个人身份信息。该团队成员已识别出需要修复的代码，但应用程序的一部分已经发布进行\
  \ Beta 测试，且包含该安全问题。项目经理应该记录修复该问题需要多久，并立即召集 CCB 会议以获得对这一紧急变更的批准。\n\n对于任何紧急变更，项目经理必须确保团队成员理解紧急变更将如何影响项目，特别是项目进度和预算。\n\
  \n![Image](img/00004.jpeg)\n\n### 组织变更\n\n正如项目会变化，组织也会变化。层次结构可能会发生变化，改变业务的汇报结构。其他可能影响项目的组织变更包括业务合并/收购或拆分/分裂、业务流程变更、内部重组、搬迁和外包。\n\
  \n以下章节讨论了这些特定的组织变更类型以及它们如何影响项目。对于每种组织变更，项目经理必须充分分析变更，以确定其对项目所有方面的潜在影响，包括范围、进度、预算、资源等。如果其他项目团队成员或利益相关者可能受到影响，项目经理需要咨询他们以获取对变更的意见。以下每个章节都说明了特定类型组织变更处理方式的差异。\n\
  \n### 业务合并/收购与业务拆分/分裂\n\n业务合并将两个组织合并为一个实体。通常是其中一家公司购买另一家公司作为业务收购，或者两家公司由于共同利益或为了深化市场渗透而联手。如果合并是通过收购发生的，购买方通常会对合并将如何进行以及在合并完成后保留哪些资产做出所有决定。部门和工作类型的重叠通常意味着部门可能会合并，人员可能会被解雇或转岗，因为工作角色的重复是没有必要的。\n\
  \n业务合并或收购可能以以下几种方式影响项目：\n\n![Image](img/00003.jpeg) 可能会识别出新的利益相关者和团队成员。\n\n![Image](img/00003.jpeg)\
  \ 被收购的公司可能拥有能够积极方式影响项目预算和进度的技术或专业知识。\n\n![Image](img/00003.jpeg) 另一家公司可能已经开展了类似的项目。\n\
  \n![Image](img/00003.jpeg) 其他资源（如必要的供应品、设备或其他资产）可能与项目共享。\n\n业务合并或收购通常对项目产生积极影响。\n\
  \n业务拆分将业务拆分为独立的实体。在这种情况下，管理层必须确定拆分将如何影响资产（包括人员）的处理。共享资源，特别是硬件资产，可能会分配给其中新组织之一。另一个新组织随后可能需要更换或购买资产以确保业务流程能够继续。\n\
  \n业务拆分或分裂可能以多种方式影响项目：\n\n![Image](img/00003.jpeg) 利益相关者和团队成员可能会从保留项目的公司中分裂出去。\n\n\
  ![Image](img/00003.jpeg) 项目所需的技术或专业知识可能不再由保留项目的公司拥有。\n\n\n\n\n\n![Image](img/00003.jpeg)\
  \ 资源可能会从保留项目的公司中剥离。\n\n![Image](img/00003.jpeg) 项目所需的预算资源可能会耗尽。\n\n业务拆分或分拆通常会对项目产生负面影响。\n\
  \n无论发生何种类型的公司重组，项目经理都需要分析重组对项目各个方面的影响，包括项目范围、预算、进度、资源、利益相关者和沟通。编辑项目文档（特别是预算和进度计划）可能需要花费一些精力，以确保项目能够按照原计划继续进行。\n\
  \n## 业务流程变更\n\n当组织希望提高性能、降低成本和/或增加盈利能力时，通常会实施业务流程变更。流程变更可能会产生显著的结果，但衡量变更的程度需要进行变更前后的性能测量。在实施流程变更之前，组织应该对该流程进行基准性能测量，然后将其与实施变更后实现的性能测量值进行比较。\n\
  \n当任何类型的业务流程变更影响项目时，项目经理将需要分析该变更对项目所有方面的影响。\n\n**示例：** 一家公司采用了新的应付账款程序以更及时地支付货物发票。由于这一新流程将影响多个项目，每个项目的项目经理都需要在项目的采购管理计划以及项目的其他受影响区域记录该变更。进行此更新将有助于确保团队成员遵循适当的应付账款程序。\n\
  \n## 内部重组\n\n内部重组是对公司内部结构的全面调整，可能涉及公司的部分或全部部门。公司重组是为了提高效率、削减成本、重新定位业务和/或处理合并和收购等公司变更。\n\
  \n**示例：** 某组织在每个办公地点都有一支 IT 技术人员团队。公司决定采用共享服务模式，大多数 IT 服务将由中心位置的单一团队处理。对于大多数日常运营，这种模式可能足够，但复杂问题可能会导致恢复或解决延迟。项目经理将需要分析这种内部重组对项目的影响。如果项目具有高优先级且会有超出常常的\
  \ IT 请求，则可能需要安排一名 IT 技术人员作为项目团队成员驻在现场。这种组织变化无疑会影响项目成本，但也能确保任何问题都能得到处理。\n\n### 搬迁\n\
  \n当公司全部或部分从一个地方或设施搬迁到另一个地方时，所有业务资产必须从原位置移动到新位置。对于 IT 资产，系统必须重新上线并尽可能地恢复必要的服务。在恢复过程中，某些业务资产的优先级可能低于其他资产。项目经理将需要分析搬迁对项目所有方面的影响。\n\
  \n**示例：** 某组织正将其整个业务搬迁到城中另一处的新设施。资产的实际移动可以在正常办公时间后进行，但并非所有资产都能在第二天早晨恢复运行。项目经理将需要识别对项目至关重要的资产，并确保这些资产尽可能地恢复全面运行。\n\
  \n### 外包\n\n当业务流程被外包给组织外部实体时，这种外包可能会提供成本效益。然而，外包可能会对进度产生不利影响，因为合同工不受组织的直接控制。某些来源会为多个组织提供工作，这可能会导致延迟。\n\
  \n项目经理将需要分析外包对项目所有方面的影响，包括项目范围、预算、进度、资源、利益相关者和沟通。受外包影响的主要限制条件通常是项目进度和预算。\n\n**示例：**\
  \ 一家音乐制作公司有一个发布新音乐应用程序的项目。该项目的编码工作外包给了自由职业软件开发人员。项目经理需要与合同开发人员保持持续沟通，以确保他们按任务和按进度进行。项目经理可能会决定在进度表中留出缓冲时间，以防错过截止日期。\n\
  \n## 考试准备任务\n\n正如引言中“如何使用本书”部分提到的，你有几种准备考试的选择：此处的练习题；第 15 章、“最终准备”；以及在线的 Pearson\
  \ Test Prep 模拟考试软件。\n\n## 复习所有关键主题\n\n回顾本章最重要的主题，这些主题在页边缘用“关键主题”图标标记。表 11-2 提供了这些关键主题的参考以及每个主题起始页码。\n\
