  \ | 7, 10 |\n| 阶段性评审 | 8 |\n| 事件响应与业务连续性响应 | 9 |\n\n***\n\n**注意**\n\n自评估的目标是衡量你对本章主题的掌握程度。如果你不知道某个问题的答案，或者对答案只有部分确定，那么在自评估时，你应该将该问题标记为错误。对于你猜对的答案给自己分会歪曲你的自评估结果，并可能给你一种虚假的安全感。\n\
  \n***\n\n**1.** 哪种通信触发因素是验证符合项目需求的结果？\n**a.** 阶段性评审\n**b.** 项目里程碑\n**c.** 项目变更\n\
