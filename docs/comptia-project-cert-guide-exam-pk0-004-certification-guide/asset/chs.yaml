  \n## 术语表\n\n**AC** *参见*实际成本 (AC)。\n\n**accept risk** *参见*风险接受 (risk acceptance)。\n\
  \n**accepting risk** *参见*风险接受 (risk acceptance)。\n\n**accommodating** *参见*平滑 (smoothing)。\n\
  \n**acquired resources** 来自外部来源的人员，如顾问和分包商。\n\n**action items** 必须处理的项目关注事项。行动事项所需的资源很少，通常解决时间少于一周。这些事项不应导致项目延迟。\n\
  \n**actual cost (AC)** 截至目前在项目上花费的实际资金。AC 不需要公式；它仅仅是项目预算已使用的部分。\n\n**adaptive planning**\
  \ 项目规划的一种，将项目分解为在不确定时间表上创建的小组件，赋予项目灵活性。\n\n**adjourning** 团队建设的阶段，团队在此完成项目。\n\n\
  **Agile** 一种管理团队和项目的方法。*Agile* 一词源于敏捷宣言（参见 agilemanifesto.org）。\n\n**agreement**\
  \ *参见*合同 (contract)。\n\n**archive** 1) 存储项目文档的地方。2) 在项目结束阶段完成的一项活动。项目经理归档项目文档，以确保其在不再需要之前一直得到维护。\n\
  \n**assumption** 项目规划阶段的一个因素。假设被认为是真实的。\n\n**attribute** 资源之间存在变化的特征。\n\n**audit**\
  \ 一种项目过程，用于验证项目交付物是否符合项目计划中列出的指南，以验证项目绩效。\n\n**avoid risk** *参见*风险规避 (risk avoidance)。\n\
  \n**avoiding** 一种冲突解决技术，将问题推迟直到项目经理可以做出更好的准备或其他方可以解决问题。也称为*退出* (withdrawing)。\n\n\
  **avoiding risk** *参见*风险规避 (risk avoidance)。\n\n**backlog** 在敏捷项目中，包含任何当前未被处理的需求的文档。\n\
  \n**backward pass** 计算任务晚开始 (LS) 和晚结束 (LF) 的方法。\n\n**balanced score card (BSC)**\
  \ 一份业务文档，管理层在其中列出了组织的战略目标。BSC 包含四组指标：财务、客户、内部流程以及学习与增长。\n\n**behavioral constraints**\
  \ 每种文化中的行为规则，影响言语和非语言沟通。例子包括眼神接触、直接讨论与绕圈子讨论，甚至人与人之间的距离。\n\n\n\n\n\n**闲置资源 (benched\
  \ resource)**：项目可用但未被使用的资源。通常指人员。\n\n**BSC**：参见平衡得分卡 (BSC)。\n\n**预算 (budget)**：项目批准的支出估算。项目预算从成本基准开始，可以通过正式变更控制流程进行更改。\n\
  \n**消耗率 (burn rate)**：项目预算消耗的速度。消耗率是 CPI 的倒数。计算消耗率的公式为 `1 / CPI`。\n\n**燃尽图 (burndown\
  \ chart)**：敏捷开发中最常用的冲刺跟踪机制。燃尽图显示了当前冲刺中已投入和剩余的工作量。\n\n**业务收购 (business acquisition)**：一家企业购买另一家企业。\n\
  \n**业务理由书 (business case)**：在项目启动阶段创建的文档。业务理由书建立了项目的效益，并作为项目授权的依据。\n\n**业务连续性 (business\
  \ continuity)**：项目在发生破坏性事件后以可接受水平持续的能力。\n\n**业务拆分 (business demerger)**：企业拆分为独立的实体。\n\
  \n**业务合并 (business merger)**：两个组织合并为一个实体。\n\n**业务拆分 (business split)**：参见业务拆分。\n\
  \n**因果图 (cause-and-effect diagram)**：参见鱼骨图。\n\n**CCB**：参见变更控制委员会 (CCB)。\n\n**停止函\
  \ (cease-and-desist letter)**：发送给个人或实体的信，要求其立即停止某项行为（cease）且永远不再这样做（desist）。此文档通常适用于特定的活动、劳动惯例或竞争方法。\n\
  \n**支持者 (champion)**：参见赞助人。\n\n**变更控制 (change control)**：在项目监控和控制阶段发生的活动。变更控制涉及审查、批准和管理项目变更请求。\n\
  \n**变更控制委员会 (CCB)**：负责审查每个请求的项目变更并批准或拒绝请求的人员小组。\n\n**变更控制流程 (change control process)**：审查所有变更请求、批准变更、管理变更并沟通其将如何影响项目的正式程序。\n\
  \n**变更日志 (change log)**：项目期间请求的所有变更的详细清单。\n\n**变更管理计划 (change management plan)**：在项目计划阶段创建的文档。变更管理计划定义了如何管理和实施项目变更请求。\n\
  \n**变更请求 (change request)**：修改任何项目文档、交付物或基准的正式提案。\n\n**章程 (charter)**：参见项目章程。\n\n\
  **结束阶段 (Close phase)**：参见收尾阶段。\n\n**结束会议 (close-out meeting)**：参见总结会议。\n\n**收尾阶段\
  \ (Closing phase)**：项目的最后一个阶段。收尾阶段完成所有项目活动。\n\n**总结会议 (closure meeting)**：也称为结束会议。该会议在项目实际完成后尽快举行，以确保在知识仍然新鲜时记录最终的项目信息。\n\
  \n**认知限制 (cognitive constraints)**：为所有新信息提供背景的文化世界观。示例包括宗教、识字水平、性别和经济状况。\n\n**协作工具\
  \ (collaboration tools)**：帮助项目团队共同工作的工具。协作工具侧重于帮助提高团队效率和产出，而不是与团队之外的个人沟通。\n\n**协作谈判\
  \ (collaborative negotiation)**：寻求双赢局面，且在尽可能减少冲突的同时努力建立关系的谈判。\n\n**沟通管理 (communication\
  \ management)**：参见项目沟通管理。\n\n**沟通媒介 (communication medium)**：沟通模式。\n\n**沟通计划 (communication\
  \ plan)**：在项目计划阶段创建的文档。沟通计划描述了如何、何时以及由谁将项目信息分给项目团队和利益相关者。\n\n**竞争 (competing)**：参见强制。\n\
  \n**竞争性谈判 (competitive negotiation)**：关注获得最优交易的谈判。主要用于与第三方的合同谈判。\n\n**妥协 (compromising)**：一种冲突解决技术，团队通过部分解决冲突来寻找一个让所有方都满意的解决方案。也称为调和。\n\
  \n**配置管理计划 (configuration management plan)**：定义了产品、结果、服务或组件的配置如何作为变更管理的一部分进行文档记录、跟踪和定义。\n\
  \n**对抗 (confronting)**：一种冲突解决技术，团队利用多种观点来达成共识。也称为问题解决。\n\n**约束 (constraint)**：限制项目范围或执行的因素。\n\
  \n**约束重新优先级排序 (constraint reprioritization)**：当受特定约束限制的项目必须将优先级转移到另一个约束时发生的事件。\n\
  \n**应急备金 (contingency reserve)**：预算中预留用于涵盖已知风险的资金。\n\n**合同 (contract)**：说明双方之间交易条件的文档。也参见采购协议。\n\
  \n**企业环境 (corporate environment)**：组织的类型以及组织的文化。\n\n**相关图 (correlation chart)**：参见散点图。\n\
  \n**成本基准 (cost baseline)**：项目依据的批准预算。基准金额永远不变，尽管项目预算可以根据正式变更控制流程发生更改。\n\n**成本控制\
  \ (cost control)**：监控项目成本并管理成本基准的变更。\n\n**成本管理 (cost management)**：参见项目成本管理。\n\n\
  **成本管理计划 (cost management plan)**：描述如何对成本进行计划、结构和控制。\n\n**成本绩效指数 (CPI)**：完成值与实际成本的比例。计算\
  \ CPI 的公式为 `EV / AC`。\n\n**成本加奖金合同 (CPAF contract)**：此类合同中供应商根据所有允许的成本获得付款。奖金根据合同中列出的绩效标准获得。\n\
  \n**成本加固定费用合同 (CPFF contract)**：此类合同中供应商根据所有允许的成本加上固定费用获得付款，该固定费用是估算成本的百分比。除非项目范围发生变化，否则付款不会改变。\n\
  \n**成本加激励费用合同 (CPIF contract)**：此类合同中供应商根据所有允许的成本加上根据合同中列出的目标获得的激励费用获得付款。\n\n**成本报告\
  \ (cost report)**：由项目经理创建的报告，指示预算支出、实际支出以及这两个值之间的差异。\n\n**成本偏差 (CV)**：在任何给定点的预算赤字或盈余。计算\
  \ CV 的公式为 `EV – AC`。\n\n**CPAF 合同**：参见成本加奖金合同 (CPAF contract)。\n\n**CPFF 合同**：参见成本加固定费用合同\
  \ (CPFF contract)。\n\n**CPI**：参见成本绩效指数 (CPI)。\n\n**CPIF 合同**：参见成本加激励费用合同 (CPIF contract)。\n\
  \n**关键路径 (critical path)**：构成项目路径且完成耗时最长的任务序列。\n\n**文化差异 (cultural differences)**：基于个人对世界的思考、观察和听取方式对项目沟通的影响。\n\
  \n**CV**：参见成本偏差 (CV)。\n\n**仪表板 (dashboard)**：显示重要项目状态信息的图表报告，通常包括关键绩效指标、项目度量、当前进度和相关问题。\n\
  \n**专用资源 (dedicated resource)**：分配给单个项目的资源。\n\n**交付物 (deliverable)**：参见项目交付物。\n\n\
  **依赖关系 (dependency)**：依赖于前一个任务完成的任务。也参见前置任务。\n\n**强制 (directing)**：参见强制。\n\n**持续时间\
  \ (duration)**：完成一项任务所需的时间。\n\n**EAC**：参见完工估算 (EAC)。\n\n**早完成 (EF)**：任务可以完成的最早日期。\n\
  \n**早开始 (ES)**：任务可以开始的最早日期。\n\n**完成值 (EV)**：项目从迄今已花费的资金中获得的价值。计算 EV 的公式为 `(% of\
  \ completed work) × budget`。\n\n\n\n\n`earned value management (EVM)` 一种结合了范围、进度和资源测量来评估项目绩效的计算方法。\n\
  \n`emotional constraints` 情感的文化规则。示例包括大喊、哭泣、顺从任何其他情感表现。\n\n`enhance risk` *参见* 风险增强\
  \ (risk enhancement)。\n\n`enhancing risk` *参见* 风险增强 (risk enhancement)。\n\n`estimate\
  \ at completion (EAC)` 根据项目发生的变化，对项目预算或成本基准进行的新预测。根据项目情况，可以使用多种公式。\n\n`estimate\
  \ to complete (ETC)` 一种预测，为项目经理提供完成项目剩余部分所需的大致资金。\n\n`ETC` *参见* 完工预测 (estimate to\
  \ complete (ETC)。\n\n`EV` *参见* 完成值 (EV)。\n\n`EVM` *参见* 完成值管理 (earned value management)。\n\
  \n`Execute phase` *参见* 执行阶段 (Executing phase)。\n\n`Executing phase` 项目的第三阶段。执行阶段完成项目管理计划中定义的工作。\n\
  \n`Execution phase` *参见* 执行阶段 (Executing phase)。\n\n`exploit risk` *参见* 风险利用 (risk\
  \ exploitation)。\n\n`exploiting risk` *参见* 风险利用 (risk exploitation)。\n\n`FFP contract`\
  \ *参见* 固定总价 (FFP) 合同。\n\n`finish-to-finish (FF) relationship` 一种项目任务关系，其中前序活动必须完成，后续活动才能完成。\n\
  \n`finish-to-start (FS) relationship` 一种项目任务关系，其中前序活动必须完成，后续活动才能开始。\n\n`firm fixed\
  \ price (FFP) contract` 一种合同，采购价格在开始时确定，除非工作范围发生变化否则不会改变。\n\n`fishbone diagram`\
  \ 对问题的潜在原因进行分类的图，帮助项目团队识别根本原因。\n\n`fixed price incentive fee (FPIF) contract` 一种合同，采购价格在开始时确定。但是此合同包含一个条款，将供应商的财务激励与某些条件挂钩——通常与成本、进度或技术性能有关，但包含价格上限。\n\
  \n`fixed price with economic price adjustment (FP-EPA) contract` 一种合同，采购价格随时间推移可能会变化，因为这些合同可能跨越多年。价格可能会根据通货膨胀或商品价格变化等不断变化的情况而波动。通常经济调整条款与特定的财务指数挂钩。\n\
  \n`float` 也称为 *松弛* (slack)。任务推迟开始 (LS) 和早开始 (ES) 值之间的差。浮量为 0 的任务是关键任务，必须按时启动和完成。\n\
  \n`flowchart` *参见* 流程图 (process diagram)。\n\n`forcing` 一种冲突解决技术，尽管团队中存在其他观点仍坚持一种观点。也称为\
  \ *指示* (directing) 或 *竞争* (competing)。\n\n`forming` 团队建设阶段，在此阶段团队成员会面并学习他们如何在项目中共同工作。\n\
  \n`forward pass` 一种计算任务早开始 (ES) 和早完成 (EF) 的方法。\n\n`FP-EPA contract` *参见* 带有经济价格调整的固定价格\
  \ (FP-EPA) 合同。\n\n`FPIF contract` *参见* 固定激励费用 (FPIF) 合同。\n\n`functional manager`\
  \ 在职能团队结构中管理项目团队成员的人。\n\n`functional team structure` 每位员工都向单一经理或主管汇报的团队结构。\n\n`Gantt\
  \ chart` 一种随时间显示项目计划活动或任务的图表，通常包括活动的的依赖关系和关系。\n\n`gate review` 项目经理和项目赞助人会以决定是否继续项目。此时还会进行门关质量检查。项目赞助人根据每个门关规划阶段定义的标准做出通过/终止（go/kill）决策。\n\
  \n`global environment` 项目公司之外的条件：监管环境、物理环境（自然界）、政治环境和/或财政环境。\n\n`governance gate`\
  \ 项目进度中的一个点，在继续之前必须获得正式批准。\n\n`groupthink` 一种群体动态，其中小组决策的方式会抑制个人的创造力或责任感。\n\n`high-level\
  \ risks` 作为项目章程的一部分的列表。高级风险是对项目目标产生正面或负面影响的不确定事件。风险在项目获得后后进行更全面的评估。\n\n`high-level\
  \ scope` 作为项目章程的一部分的声明。高级范围定义了交付项目结果必须执行的高级工作。\n\n`histogram` 一种特殊的条形图，代表特定范围的连续数据。图形化地描述了统计数据的近似分布。\n\
  \n`human resource management` *参见* 项目人力资源管理。\n\n`human resource management plan`\
  \ 描述人力资源如何结构化和管理，包括他们的角色、责任和汇报关系。\n\n`incident` 项目中可能导致中断的事件。\n\n`incident management`\
  \ 限制事件对项目影响程度的过程。\n\n`incremental process` 一种在每一步完成时都会产生可用交付物的过程。\n\n`influence`\
  \ 可以影响项目约束的项目事件或条件。\n\n`Initiate phase` *参见* 启动阶段 (Initiating phase)。\n\n`Initiating\
  \ phase` 项目的第一阶段。启动阶段定义新项目并获得启动该项目的授权。\n\n`Initiation phase` *参见* 启动阶段 (Initiating\
  \ phase)。\n\n`instant messaging` 使用由供应商（如 Google 或 Microsoft）管理的计算机或移动应用程序。\n\n\
  `intangible outcome` 非物理资产，如专利、商标、特许经营、商誉或版权。\n\n`integration management` *参见* 项目集成管理。\n\
  \n`Internet site` 公开托管的网站。\n\n`interorganizational differences` 组织之间的差异。\n\n`interproject\
  \ dependency` 当一个项目必须等待另一个项目完成其第一个项目所需的结果时。\n\n`intranet site` 仅在组织内部访问的网站。\n\n\
  `intraorganizational differences` 组织内部的差异。\n\n`Ishikawa diagram` *参见* 鱼骨图 (fishbone\
  \ diagram)。\n\n`issues` 项目生命周期中意外发生、差距、不一致或冲突，且之前未识别为风险。问题通常需要多个资源和大量时间来解决。\n\n\
  `issues log` 记录利益相关者提出的所有问题的文档。\n\n`iterative process` 一个通过顺序细化向预期结果进展的过程。\n\n`key\
  \ performance indicator (KPI)` 一种评估项目或项目交付物在性能目标方面成功的衡量。与美国国防部 (DoD) 使用的术语 *关键性能参数\
  \ (KPP)* 同义。\n\n`key performance parameter (KPP)` *参见* 关键性能指标 (KPI)。\n\n`kickoff\
  \ meeting` 项目团队和项目赞助人的首次会议。这次介绍会议明确了所有团队成员在项目中的职责。\n\n`knowledge area` *参见* 项目知识领域。\n\
  \n`knowledge base` *参见* 供应商知识库。\n\n`KPI` *参见* 关键性能指标。\n\n`language barriers` 当团队成员或利益相关者说不同语言时对项目沟通的影响。\n\
  \n`late finish (LF)` 任务可以完成的最晚日期。\n\n`late start (LS)` 任务可以开始的最晚日期。\n\n\n\n\n\n\
  - **经验教 (lessons learned)** 1) 存储所有项目经验教的数据库或其他存储位置。2) 在项目收尾阶段完成的一项活动。在`lessons\
  \ learned`文档中，项目经理记录了项目期间获得的任何知识，并展示了如何处理项目问题和事件。\n\n- **意向书 (letter of intent (LOI))**\
  \ 两个或多个双方之间协议计划的文件，通常是正式合同的前身。在美国美国，`letter of intent`通常被视为`谅解备忘录 (MOU)`的同义词。\n\n\
  - **LOI** *参见* letter of intent (LOI)。\n\n- **双输 (lose-lose)** 一种不能满足任何一方的冲突解决解决方案。\n\
  \n- **管理储备 (management reserve)** 项目预算中留用于管理控制目的的部分，主要用于在完成项目范围需要不可预见的工作时。\n\n-\
  \ **实物资源 (material resources)** 项目可能需要的任何物资。\n\n- **矩阵团队结构 (matrix team structure)**\
  \ 职能经理和项目经理共享权限的团队结构，资源从职能部门分配到项目中，项目经理的权限从弱到强不等。\n\n- **会议议程 (meeting agenda)**\
  \ 提供会议讨论的话题的文件。\n\n- **会议纪要 (meeting minutes)** 会议期间所有讨论内容和所做决定的记录。\n\n- **谅解备忘录\
  \ (memorandum of understanding (MOU))** `letter of intent (LOI)`的另一个术语。\n\n- **合并\
  \ (merger)** *参见* business merger。\n\n- **里程碑 (milestone)** 项目中的重大事件。里程碑被纳入项目进度，但它们没有持续，因为它们并不是实际的项目任务。相反，里程碑是项目进展到达的时间点。\n\
  \n- **里程碑列表 (milestone list)** 识别所有项目里程碑并指示每个里程碑是否为强制性的文档。\n\n- **缓解风险 (mitigate\
  \ risk)** *参见* risk mitigation。\n\n- **风险缓解 (mitigating risk)** *参见* risk mitigation。\n\
  \n- **监控和控制阶段 (Monitor and Control phase)** *参见* Monitoring and Controlling phase。\n\
  \n- **监控和控制阶段 (Monitoring and Controlling phase)** 项目的第四阶段。监控和控制阶段跟踪、审查并组织项目的进度。\n\
  \n- **MOU** *参见* memorandum of understanding (MOU)。\n\n- **相互约束性文件 (mutually binding\
  \ document)** 双方之间的协议，其中一方承诺为了报向另一方做某些事。\n\n- **NDA** *参见* non-disclosure agreement\
  \ (NDA)。\n\n- **负面风险 (negative risk)** 可能会偏离项目并应该被防止的不良事件。\n\n- **谈判资源 (negotiated\
  \ resources)** 项目经理希望加入项目团队、且必须通过与其他经理谈判才能获得的人员。\n\n- **谈判 (negotiating)** 一种将两种观点结合在一起以讨论问题并达成解决方案的冲突解决技术。\n\
  \n- **噪声 (noise)** 影响信息传递的任何干扰或障碍。\n\n- **竞业协议 (non-compete agreement)** *参见* non-compete\
  \ clause。\n\n- **竞业条款 (non-compete clause)** 防止供应商在指定的时间范围内与买方的直接竞争对手开展类似的项目。\n\n\
  - **保密协议 (non-disclosure agreement (NDA))** 一种保密协议，其中选定的供应商和任何参与采购的供应商人员同意不披露项目的细节。\n\
  \n- **成形成阶段 (norming)** 团队建设阶段，团队开始共同工作，团队成员调整自己的工作来支持团队。\n\n- **OPCs** *参见* other\
  \ project costs (OPCs)。\n\n- **机会 (opportunity)** *参见* positive risk。\n\n- **组织图\
  \ (organizational chart)** 以金字塔形式绘制的图表，显示人员在项目结构中的位置。\n\n- **其他项目成本 (other project\
  \ costs (OPCs))** 不包括 TEC 的所有与其他项目相关的成本。\n\n- **离群值 (outlier)** 落在图中大多数点模式之外的数据点。\n\
  \n- **外包 (outsourcing)** 将业务流程委托给组织外的实体。\n\n- **帕累托图 (Pareto chart)** 垂直条形图与折线图结合，用于按从高到低的顺序显示重要性或其他值。\n\
  \n- **路径 (path)** 也称为`pathway`。需要完成的任务序列。\n\n- **性能测量和报告 (performance measuring\
  \ and reporting)** 在项目监控和控制阶段发生的活动。将项目性能与项目管理计划中定义的基准进行比较。\n\n- **执行阶段 (performing)**\
  \ 团队建设阶段，团队开始作为一个单元进行工作，团队成员相互依赖并轻松地解决问题。\n\n- **人员资源 (personnel resources)** 工作完成项目的项目团队成员。\n\
  \n- **阶段 (phase)** *参见* project phase。\n\n- **阶段门模型 (phase-gate model)** 一个倡议或项目被分为若干阶段或时期，由闸门隔开。每个闸门完成项目生命周期的该阶段，然后在项目移动到下一阶段之前进行审查。也称为`phase-gate\
  \ process`或`stage-gate process`。\n\n- **计划阶段 (Plan phase)** *参见* Planning phase。\n\
  \n- **计划价值 (planned value (PV))** 当前完成工作的计划成本。计算 PV 的公式为（计划完成百分比）——预算。\n\n- **规划阶段\
  \ (Planning phase)** 项目的第二阶段。规划阶段建立项目总范围和目标，并开发实现目标所需的行动。\n\n- **PMO** *参见* project\
  \ management office (PMO)。\n\n- **PO** *参见* purchase order (PO)。\n\n- **项目组合 (portfolio)**\
  \ 组织管理的所有项目、计划和运营，使其能够实现战略目标（如果单独管理将无法获得这些目标）。\n\n- **正向风险 (positive risk)** 被视为机会的风险。项目希望发生的理想事件。\n\
  \n- **预分配资源 (preassigned resources)** 根据在组织中的职位和/或知识和技能组从开始分配给项目的人员。\n\n- **前置任务\
  \ (predecessor)** 在开始下一个任务之前必须完成的任务。*另见* dependency。\n\n- **前置活动 (predecessor activity)**\
  \ 位于任何依赖活动之前的活动。\n\n- **预测性规划 (predictive planning)** 使用历史数据提供围绕所需结果构建的线性开发计划的项目规划。\n\
  \n- **问题解决 (problem solving)** *参见* confronting。\n\n- **流程图 (process diagram)**\
  \ 完成业务流程所需步骤的顺序分解，并相互显示。\n\n- **过程改进计划 (process improvement plan)** 详细说明了分析过程的步骤，以识别增强其价值的活动。\n\
  \n- **采购协议 (procurement agreement)** 定义必须从第三方获取的商品或服务的购买条款的文档。\n\n- **采购管理 (procurement\
  \ management)** *参见* project procurement management。\n\n- **采购管理计划 (procurement\
  \ management plan)** 也称为`procurement plan`。在项目规划阶段创建的文件。描述了如何从外部来源采购商品和服务。\n\n-\
  \ **采购计划 (procurement plan)** *参见* procurement management plan。\n\n- **产品所有者 (product\
  \ owner)** 敏捷产品的关键利益相关者，为产品提供整体愿景。\n\n- **程序 (program)** 相关的项目或活动的分组，通过协调管理以获得单独管理时无法获得的益处。\n\
  \n- **项目 (project)** 为创建独特的产品、服务或结果而进行的临时性性工作。\n\n- **项目预算 (project budget)** 提供项目成本估算的文件。项目预算包括单个\
  \ WBS 工作包、采购和计划活动的成本明细。\n\n- **项目章程 (project charter)** 在项目启动阶段创建的文件。项目章程授权项目，并允许项目经理应用组织资源来完成项目。\n\
  \n- **项目沟通管理 (project communication management)** 确保项目信息被正确创建、分发和存储的项目知识领域。\n\n\
  - **项目协调员 (project coordinator)** 支持项目经理协调活动、资源、设备和信息的角色。主要关注项目实施和所有项目任务的跨部门协调。\n\
  \n\n\n\n\n**项目成本控制** *参见*成本控制。\n\n**项目成本管理** 确保项目成本在批准预算内的项目知识领域。\n\n**项目仪表板** 一种让利益相关者和团队成员能够快速查看项目整体情况的工具。仪表板包括项目状态报告，并可能包含其他组件，如关键绩效指标、项目指标、项目进度以及其他项目问题的细节。\n\
  \n**项目交付物** 在执行阶段创建的项目主要产出，由工作分解分解结构（WBS）中定义的唯一工作包组成。\n\n**项目环境** 项目内部的条件，包括完成项目必须存在的任何变量。\n\
  \n**项目人力资源管理** 确保项目团队得到组织和管理以完成项目的项目知识领域。\n\n**项目集成管理** 识别并协调项目中的所有过程和活动的项目知识领域。\n\
  \n**项目知识领域** 项目管理的一种划分，将各个过程归类到特定的专业化活动中，如集成、范围、时间、成本等。\n\n**项目管理办公室 (PMO)** 提供项目管理治理，并确保资源、方法、工具和技术在所有项目之间共享或协调。\n\
  \n**项目管理计划** 在项目规划阶段创建的总体文档。项目管理计划包含了所有项目知识领域的管理计划。\n\n**项目经理** 被选来管理项目、领导项目团队并确保项目成功的个人。\n\
  \n**项目阶段** 项目管理中的不同时期，在此期间完成特定类型的活动：启动、规划、执行、监控和控制以及结束。\n\n**项目采购管理** 确保从第三方处获取任何所需产品或服务的项目知识领域。\n\
  \n**项目质量管理** 确保项目质量满足项目需求的项目知识领域。\n\n**项目需求** 列出任何利益相关者对项目的需求和要求的的列表。某些利益相关者的需求可能不会包含在项目最终批准的列表中。\n\
  \n**项目储备** 预算中用于缓解成本和/或进度风险的拨备资金。管理储备和应急储备是两类项目储备。\n\n**项目风险管理** 确保项目风险得到识别、分析和控制的项目知识领域。\n\
  \n**项目进度计划** 一份展示项目活动及其计划开始/结束日期、持续时间、里程碑和资源的文档。\n\n**项目进度计划软件** 支持“如果……怎样”场景、跟踪项目效率并使用图表和图解分析进度的程序和应用程序。\n\
  \n**项目范围** 为项目提供总产品、服务或结果而执行的工作。\n\n**项目范围管理** 确保所需工作已完成且在定义的项目范围内的项目知识领域。\n\n**项目范围说明**\
  \ 一份包含项目合理性、范围描述、验收标准、交付物、排除项、约束和假设的正式声明。\n\n**项目验收** 在项目结束阶段完成的文档。项目验收提供了一种根据项目管理计划验证项目完成的正式方法。\n\
  \n**项目赞助人** 根据项目章程必须正式授权项目的个人或组织。\n\n**项目利益相关者** 可能影响或受项目任何部分影响的个人、团体或组织。\n\n**项目利益相关者管理**\
  \ 记录受项目影响的任何个人、团体或组织的预期和项目影响的项目知识领域。\n\n**项目工作说明书** 对项目交付的产品、服务或结果的描述。项目工作说明书在项目启动阶段使用。\n\
  \n**项目团队** 与项目经理合作执行项目任务以确保项目完成的个人小组。\n\n**项目时间管理** 确保项目按时完成的项目知识领域。\n\n**项目化团队结构**\
  \ 项目经理拥有完全权限、人员向项目经理汇报、且资源根据*临时*（ad hoc）原则分配给项目的团队结构。\n\n**采购订单 (PO)** 在合同签署后立即发行的文档，用于澄清购买细节。采购订单规定了财务协议、条款、交付方式、交付日期、所需数量等，并对购买方具有法律约束力。\n\
  \n**PV** *参见*计划值 (PV)。\n\n**定性风险分析** 执行风险概率和影响评估以制定概率和影响矩阵，该矩阵提供风险评分以指导风险响应。\n\n\
  **质量保证** 在项目监控和控制阶段发生的活动。使用质量指标和检查表配合鱼骨图、流程图等工具来解决项目质量问题。\n\n**质量闸** 项目进度计划中的某一点，在此分析验收标准，以确保完成的交付物符合项目规划期间建立的质量控制指南。\n\
  \n**质量管理** *参见*项目质量管理。\n\n**质量管理计划** 描述如何实施项目的质量政策。\n\n**定量风险分析** 为识别出的风险分配数值。\n\
  \n**RACI 矩阵** *参见*负责、问责、受咨询者和被会者（RACI）矩阵。\n\n**关系建立** 基于寻找共同点与另一个人或团体良好相处。\n\n**调解**\
  \ *参见*折中。\n\n**回归计划** 允许已批准变更被撤销的过程。\n\n**信息请求 (RFI)** 一种采购文档，买方请求潜在卖家提供与产品/服务相关的信息或有关卖家提供产品/服务能力的信息。\n\
  \n**建议书 (RFP)** 一种采购文档，买方向产品或服务的潜在卖家请求建议书。\n\n**报价请求 (RFQ)** 一种采购文档，买方向常见产品或服务（如计算机或建筑材料）的潜在卖家请求价格报价。\n\
  \n**需求** *参见*项目需求。\n\n**需求管理计划** 在项目规划阶段创建的文档。需求管理计划描述了如何对项目需求进行分析、记录和管理。\n\n**储备分析**\
  \ 确定资金以应对项目可能遇到的任何成本不确定性的方法。\n\n**储备** 分配用于处理不可见风险的项目资金。\n\n**资源分配** 将资源分配给单个项目活动或任务的过程。\n\
  \n**资源分解结构** 一份按类别和类型分层分解分配资源的文档。\n\n**资源日历** 一份列出所有资源及其对项目可用日期和时间的文档。\n\n**资源冲突**\
  \ 当多个项目同时需要某个特定资源时。\n\n**资源均衡** 一种资源优化技术，根据资源限制调整任务的开始和结束日期。这种技术可能会增加原始关键路径。\n\n\
  **资源管理** 确保完成项目所需的所有供应都得到适当识别和管理的过程。\n\n\n\n\n`resource overallocation` 当项目拥有过多的特定资源时，导致库存剩余或团队成员闲置。\n\
  \n`resource release` 在项目收尾阶段（Closing phase）释放所有资源的活动。\n\n`resource shortage` 项目没有足够的特定资源来完成某项活动或任务。\n\
  \n`resource smoothing` 一种资源优化技术，通过调整任务活动的浮量来实现资源平衡。该技术可以防止资源需求超过可用资源的限制。\n\n`resources`\
  \ 完成项目所需的人员和其他资产，包括人员、设备、服务、供应品和资金。\n\n`responsible, accountable, consulted, and\
  \ informed (RACI) matrix` 项目在项目规划阶段（Planning phase）使用的工具，用于分析项目利益相关者和团队成员相对于项目活动或任务的角色和职责。\n\
  \n`RFI` 参见信息请求 (request for information)。\n\n`RFP` 参见建议书请求 (request for proposal)。\n\
  \n`RFQ` 参见询价请求 (request for quote)。\n\n`risk` 任何可能对项目目标或其他方面（如项目成本、范围或进度）产生积极或负面影响的不确定事件。\n\
  \n`risk acceptance` 针对负面和正面风险的风险策略。项目团队承认该风险，但决定不采取任何行动。\n\n`risk activities` 风险管理规划、识别风险、执行风险分析、规划风险应对以及控制风险。这些风险活动发生在项目的规划阶段和监控控制阶段（Monitoring\
  \ and Controlling phase）。\n\n`risk appetite` 组织为了获得回报而愿意承担的不确定性程度。\n\n`risk avoidance`\
  \ 针对负面风险的风险策略，项目团队通过消除风险或保护项目免受风险影响来实现。\n\n`risk cause` 导致风险发生的条件或事件。\n\n`risk communication`\
  \ 作为风险管理计划的一部分被记录在案的风险报告。它定义了如何对项目团队成员和利益相关者进行风险的文档记录、分析和沟通。\n\n`risk enhancement`\
  \ 针对正面风险的风险策略，项目团队识别影响风险的关键驱动因素，并调整这些因素以增加风险发生的概率。\n\n`risk exploitation` 针对正面风险的风险策略，项目团队确保风险的发生。\n\
  \n`risk identification` 预先确定哪些风险可能影响项目并将其记录在风险管理计划中的过程。\n\n`risk impact` 风险对项目产生的影响。\n\
  \n`risk management` 参见项目风险管理。\n\n`risk management plan` 一份描述可能影响项目的所有已知风险以及处理每种风险的策略的文档。项目管理计划的一部分。\n\
  \n`risk mitigation` 针对负面风险的风险策略，项目团队通过减少风险发生的概率或减轻风险的预期影响来实现。\n\n`risk planning`\
  \ 一项项目管理过程，通过正式创建风险管理计划，确保风险被识别、分析、量化、优先级排序和评审，并为每种风险准备适当的应对措施。\n\n`risk prioritization`\
  \ 确保根据优先顺序为每个识别出的风险制定风险计划。\n\n`risk quantification` 执行定性定定量风险分析，以确定风险对项目目标的影响。\n\
  \n`risk register` 记录在风险规划期间识别的所有风险的文档。\n\n`risk response planning` 开发行动以增强项目机会并减少对项目构成的威胁。\n\
  \n`risk review` 在项目的监控控制阶段定期调查风险，以检测可能出现的任何新风险，并确保计划的风险策略仍然有效。\n\n`risk sharing`\
  \ 针对正面风险的风险策略，将风险的部分所有权分配给第三方。\n\n`risk tolerance` 组织能够承受的风险程度。\n\n`risk transference`\
  \ 针对负面风险的风险策略，将风险影响转移给另一方。\n\n`risk trigger` 将导致应急计划实施的事件或条件。\n\n`roles` 项目的一部分的工作职责。\n\
  \n`roll wave planning` 一种活动定义过程，其中对近期的活动进行详细计划，而对未来的活动进行高级计划。随着项目的进行和需求的变得清晰，将对工作分解结构（WBS）较低层的工作包进行更详细的计划。\n\
  \n`run chart` 使用折线图显示项目随时间变化的趋势、波动或下降/改进的图表。\n\n`scatter chart` 用于寻找两个变量之间相关性的图表。\n\
  \n`scatter diagram` 参见散点图。\n\n`scatter plot` 参见散点图。\n\n`schedule` 参见项目进度。\n\n`schedule\
  \ baseline` 批准的项目进度版本。\n\n`schedule management plan` 建立开发、监控和控制进度的活动。\n\n`scheduler`\
  \ 负责制定和维护项目进度，并确保在需要时资源可用的角色。该角色的任务可能由项目经理承担。\n\n`scope` 参见项目范围或高层范围。\n\n`scope\
  \ baseline` 用于在项目执行阶段和监控控制阶段比较范围控制的依据项目文档。范围基准包括项目范围说明、工作分解结构（WBS）和 WBS 字典。\n\n\
  `scope creep` 项目中的一种状态，即在不调整其他项目约束（包括成本、时间和资源）的情况下更改项目范围。\n\n`scope management`\
  \ 参见项目范围管理。\n\n`scope management plan` 在规划阶段创建的文档。范围管理计划描述了如何界定、开发、监控、控制和验证范围。它是项目管理计划的主要组成部分之一。\n\
  \n`scope statement` 提供项目范围描述、主要交付物、假设和约束的项目文档。\n\n`scrum` 一种强调团队合作、问责制和朝着明确目标进行迭代进展的项目管理框架。\n\
  \n`scrum master` 使用 Scrum 或敏捷方法的开发团队的促进者。\n\n`scrum retrospective` 在每个冲刺（sprint）结束时举行的会议，用于讨论冲刺并记录任何有助于提高下一次冲刺生产力的更改。\n\
  \n`service-level agreement (SLA)` 服务提供者与其客户之间的合同。SLA 为服务的不同方面设定了特定指标，包括质量、可用性和责任。\n\
  \n`share risk` 参见风险共享。\n\n`shared resource` 项目共同使用的资源。\n\n`sharing risk` 参见风险共享。\n\
  \n`SLA` 参见服务水平协议 (SLA)。\n\n`slack` 参见浮量。\n\n`smoothing` 一种冲突解决技术，强调共识而非差异。也称为调解。\n\
  \n`SOW` 参见工作说明书 (SOW)。\n\n`sponsor` 授权项目的个人或组织。\n\n`sprint` 敏捷项目中的重复、迭代的工作周期。冲刺的目标是以可用形式完成产品的一项需求。\n\
  \n`sprint planning` 决定在即将到来的冲刺中处理的特定工作的过程。\n\n`stakeholder` 任何对项目成功有利益的个人、团体或组织。\n\
  \n\n\n\n`stakeholder management plan` 一份在项目规划阶段创建的文档。利益相关者管理计划规定了如何管理和参与项目利益相关者，包括每个利益相关者的参与水平、关系和沟通需求。根据每个利益相关者的需求、兴趣和对项目的影响，定义了让利益相关者参与项目决策和执行的工具和技术。\n\
  \n`stakeholder register` 一份在项目启动阶段创建的列表。利益相关者登记册列列了所有利益相关者，以及他们的识别信息、需求和期望、对项目的影响以及分类。\n\
  \n`start-to-finish (SF) relationship` 一种项目任务关系，其中前置活动必须开始，后继活动才能完成。\n\n`start-to-start\
  \ (SS) relationship` 一种项目任务关系，其中前置活动必须开始，后继活动才能开始。\n\n`statement of work (SOW)`\
  \ 工作说明书，一份描述采购项目内容的文档，以便潜在供应商了解规格并确定他们是否能够提供满足规格的采购物品。\n\n`status report` 状态报告，一份提供项目活动、问题、变更和风险最新信息的文档。\n\
  \n`storming` 团队建设阶段，团队在此阶段开始对项目做出决策。\n\n`story mapping` 一种在敏捷项目中发现需求的技术。团队通过绘制用户故事来发现客户需要的功能。\n\
  \n`strengths, weaknesses, opportunities, and threats (SWOT) analysis` 一种在项目规划阶段使用的工具，用于识别可能导致问题或提供机会的项目风险。\n\
  \n`successor activity` 后继活动，指在其所依赖的活动之后的活动。\n\n`SWOT analysis` *参见* 优势、劣势、机会和威胁\
  \ (SWOT) 分析。\n\n`T&M contract` *参见* 工时与材料合同 (T&M contract)。\n\n`tangible outcome`\
  \ 有形成果，可以衡量的物理资产，如土地、车辆、设备、机械、家具、库存或现金。\n\n`task list` 一份列出完成项目所需所有任务的文档。每个任务必须有唯一的名称，并应追溯到\
  \ WBS 组件。\n\n`TCPI` *参见* 完工绩效指数 (TCPI)。\n\n`TEC` *参见* 总预估成本 (TEC)。\n\n`text messaging`\
  \ 短信，通过手机运营商的通信带宽在移动设备上进行的文本“对话”。\n\n`threat` *参见* 负面风险。\n\n`time and materials\
  \ (T&M) contract` 一种在无法提供工作说明时使用的合同。合同的全价值和所需物品的数量可能无法定义，因此合同被认为是开放式的。支付基于计费工时间和所有允许的成本。这些合同通常包含不超过限值、时间限制以及单位劳动力率或材料率。\n\
  \n`time management` *参见* 项目时间管理。\n\n`To-Complete Performance Index (TCPI)` 使用剩余资源完成任务所需的成本绩效。计算\
  \ TCPI 有两个主要公式：\n\n`total estimated costs (TEC)` 初始项目预算中的所有预估成本。\n\n`total project\
  \ cost` 从项目启动到项目结束产生的所有项目特定成本。\n\n`transfer risk` *参见* 风险转移。\n\n`transition/integration\
  \ plan` 一份在项目结束阶段创建的计划。过渡/整合计划包含了项目团队将如何转移或整合到组织内其他项目或区域的细节。\n\n`trend line` 散点图中大多数点所在的直线。\n\
  \n`triple constraint` 项目的主要限制条件：范围、时间和成本。\n\n`user stories` 用户故事，是定义敏捷项目需求的基础。每个用户故事都说明了谁想要产品、团队正在构建什么以及团队为什么要构建它。\n\
  \n`vendor knowledge base` 包含有关特定供应商产品授权信息的数据库。\n\n`virtual meeting` 使用技术（如视频会议）举行的会议，允许来自不同地理区域的人员参加。\n\
  \n`virtual team` 项目团队，其中全部或部分成员远程工作。\n\n`warranty` 供应商提供的文档，对采购物品的质量水平提供保证。\n\n\
  `WBS` *参见* 工作分解结构 (WBS)。\n\n`WBS dictionary` 工作分解结构 (WBS) 的辅助文档。WBS 字典提供了关于每个 WBS\
  \ 组件的详细信息，包括标识符、交付物、描述和进度信息。\n\n`wiki` 一种用于管理协作内容的网站。wiki 用户决定网站结构并能够编辑内容。Wiki 页面通常不需要专业的技术知识。\n\
  \n`win-win` 满足双方顾虑的解决方案。\n\n`withdrawing` *参见* 避免。\n\n`work breakdown structure\
  \ (WBS)` 项目实施期间必须完成的活动或工作包的层级列表。该项目文档将项目工作细分为可管理的组件。\n\n`work package` WBS 中最小的工作单位。\n\
