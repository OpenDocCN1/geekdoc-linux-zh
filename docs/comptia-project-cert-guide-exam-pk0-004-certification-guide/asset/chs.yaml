  **d.** 权力范围从弱到强不等\n\n**10.** 在哪种项目团队结构中，资源最有可能从其职能部门被分配到项目中？\n**a.** 矩阵型\n**b.**\
  \ 混合型\n**c.** 职能型\n**d.** 项目型\n\n## 基础知识点\n\n## 项目角色与职责\n每个项目都包含负责某些项目职责的项目角色。每个项目都有项目发起人、项目经理、利益者和项目团队。可选的项目角色可能包括项目协调员和进度计划员。最后，一些组织设有中央项目管理办公室。本节将讨论所有这些角色以及可能涉及项目的职责。\n\
  \n![Image](img/00004.jpeg)\n\n#### 项目发起人\n项目`发起人`，也称为项目`支持者 (champion)`，是授权项目的个人或组织。发起人负责为项目提供资金，并建立项目章程、项目基准和高层需求。项目的最终控制权在项目发起人手中，他们还负责在整个组织内推广项目，以确保利益相关者的参与。发起人必须记录所有项目障碍，并与项目经理合作消除这些障碍。发起人完成项目的业务案例/合理性说明，而且发起人还必须选择或批准项目经理。\n\
  \n在大多数情况下，任何潜在的项目变动都必须咨询项目发起人。发起人授权或提供所有资源，并负责取消或正式关闭项目。\n\n项目发起人是一个强制角色。\n\n![Image](img/00004.jpeg)\n\
  \n### 项目经理\n`项目经理`是被选来领导项目团队的个人。项目经理负责确保项目的成功。项目经理应该评估项目需求、任务需求和团队需求，并战略性地使用这些评估来引导项目实现目标。项目经理必须具备项目管理知识和经验，并知道如何实现项目目标。最后，他/她必须具备性格特征、人际技巧和领导力，以有效地领导项目团队。\n\
  \n项目经理必须管理项目的团队、沟通、范围、风险、预算、时间和质量保证。所有项目文档和产出物都是项目经理的职责。\n\n项目经理必须与所有利益相关者进行适当的沟通，但最终对项目发起人负责。\n\
  \n项目经理是一个强制角色。\n\n![Image](img/00004.jpeg)\n\n### 项目协调员\n`项目协调员`支持项目经理协调活动、资源、设备和信息。虽然项目经理负责项目的整体成功，但项目协调员主要关注项目实施和所有项目任务的跨部门协调。如果项目协调员无法解决项目问题，协调员将把问题上报给项目经理。信任对于项目协调员与项目经理之间的关系至关重要。\n\
  \n项目协调员协助项目文档工作并提供行政支持。项目协调员负责资源调度和检查交付物的质量。\n\n当多个项目必须共享资源时，一些组织会使用项目协调员。这种类型的项目协调员帮助解决共享资源可能出现的任何问题。无论项目协调员是在一个项目还是多个项目上工作，协调员与项目经理之间的伙伴关系都是至关重要的。\n\
  \n项目协调员角色不是强制性的，这意味着即使不担任此也可以实现项目的成功。\n\n![Image](img/00004.jpeg)\n\n#### 利益者\n\
  项目`利益者`是指任何对项目成功有利益关系的个人、团体或组织。利益者可能会影响项目结果或被项目结果影响。项目经理应该充分分析项目利益者，以确定他们在项目中的利益（关注程度）、影响力（积极参与）、影响（影响项目变化的能力）、紧迫性（关注的需求）、合法性（适当或不适当的参与）和权力（权限水平）。\n\
  \n一旦确定了利益者，利益者应该向项目经理提供输入和需求。他们还提供项目指导和专业知识。\n\n\n\n\n\n应当记录利益相关者，并说明他们的角色、知识水平和对项目的预期。项目经理应确定与每位利益相关者沟通的最佳沟通方法。管理利益相关者的预期是关键，因为并非所有的预期都能实现。事实上，一个利益相关者的预期可能与另一个人的完全相反。因此，项目经理需要人际交往技巧来与利益相关者进行谈判，以确定哪些预期是可以实现的，并确保项目的成功。\n\
  \n![Image](img/00004.jpeg)\n\n## 计划员\n\n项目`计划员(#part0034.html_gloss324)` 负责制定和维护项目进度计划，并确保在需要时资源可用。该人员通过趋势分析和挣值管理确定进度、成本和资源偏差，从而报告进度绩效。计划员向资源人员征集任务状态，监控项目里程碑，沟通任何进度变更，并在所有项目会议中发挥积极作用。根据项目和组织规模，该角色可能与项目经理或项目协调员的角色合并，也可能独立。\n\
  \n在某些项目中，项目计划员并不是一个独立的角色，因为这些任务由项目经理完成。\n\n![Image](img/00004.jpeg)\n\n### 项目团队\n\
  \n`项目团队(#part0034.html_gloss254)` 是与项目经理合作执行项目任务以确保项目完成的个人群体。项目团队成员需要根据项目需求具备各种技能。随着项目的进行，团队成员可能会被移除或增加，他们可能需要在加入团队之前获得培训。项目经理必须清晰地定义每个团队成员的职责，以确保每位团队成员都理解所有预期。项目经理可能还需要与职能经理、其他项目管理团队和/或其他组织谈判，以获得合适的团队成员。\n\
  \n项目团队成员根据项目进度贡献项目知识和交付物。他们提供任务持续时间、成本和依赖关系的估计。\n\n项目经理在选择项目团队成员时使用的一些标准可能包括可用性、成本、经验、能力、知识、技能、态度和国际因素。项目经理还需要评估团队将面对面工作和/或作为虚拟团队工作。最后，项目经理需要帮助团队增强成员之间的信任，以提高士气、减少冲突并加强团队合作。\n\
  \n***\n\n注意\n\n`第 5 章`，“人员和物理资源管理，`”详细讨论了项目团队。\n\n***\n\n![Image](img/00004.jpeg)\n\
  \n### 项目管理办公室 (PMO)\n\n`项目管理办公室 (PMO)(#part0034.html_gloss235)` 提供项目管理治理（包括标准和实践），并确保资源、方法、工具和技术在所有项目之间共享或协调。PMO\
  \ 设定了交付物、关键绩效指标和其他项目参数。它还概述了不履约的后果，并提供标准的文档和模板。\n\nPMO 支持、控制或指导项目。`支持型` PMO 为项目提供项目知识库的访问权限并行使低级别的项目控制。`控制型`\
  \ PMO 提供相同的访问权限，但要求遵守已建立的 PMO 标准和流程，行使中等程度的项目控制。`指令型` PMO 直接管理所有项目并行使高级别的项目控制。\n\
  \nPMO 通过识别和制定项目管理标准、管理共享资源、监控合规性以及协调沟通来支持项目经理。当项目经理专注于项目目标并管理项目资源和约束条件时，PMO 处理重大的程序范围变更，优化所有项目共享资源的使用，并管理项目之间的风险和依赖关系。\n\
  \n![Image](img/00004.jpeg)\n\n## 项目团队结构\n\n项目团队结构受组织结构控制，这会影响资源的可用性。项目团队结构分为职能型、矩阵型或项目型。以下章节将讨论这些类别。\n\
  \n项目经理必须理解项目团队结构，以便有效管理项目资源。项目团队结构影响项目经理的角色和权限，以及资源可用性、项目预算管理和项目管理行政人员。`表 2-2` 展示了项目团队结构如何影响这些项目特性。\n\
  \n**表 2-2** 项目团队结构对项目的影响\n\n| 项目特性 | 职能 | 弱矩阵 | 平衡矩阵 | 强矩阵 | 项目型 |\n| :--- | :---\
  \ | :--- | :--- | :--- | :--- |\n| 项目经理权限 | 很少或没有 | 低 | 低到中等 | 中等到高 | 高到几乎完全 |\n\
  | 资源可用性 | 很少或没有 | 低 | 低到中等 | 中等到高 | 高到几乎完全 |\n| 项目预算管理 | 职能经理 | 职能经理 | 混合 | 项目经理\
  \ | 项目经理 |\n| 项目经理的角色 | 兼职 | 兼职 | 全职 | 全职 | 全职 |\n| 行政人员 | 兼职 | 兼职 | 兼职 | 全职 | 全职\
  \ |\n\n![Image](img/00004.jpeg)\n\n### 职能团队结构\n\n在采用`职能团队结构(#part0034.html_gloss122)`的组织中，每位员工都向一名经理或主管汇报。员工按专业领域分组，例如营销、销售或会计；专业领域可能被进一步细分，例如应付账款和应收账款。由于团队成员向`职能经理(#part0034.html_gloss121)`汇报，项目经理需要与职能经理合作进行资源进度安排。\n\
  \n在职能结构中，项目经理很少或没有权限。由于资源可用性由职能经理掌握，项目经理需要与职能经理合作进行资源进度安排。如果团队成员来自多个职能领域，这种协作可能涉及多个职能经理。\n\
  \n在大多数情况下，职能经理也管理预算。在这种团队结构中，项目经理通常不是全职负责项目。\n\n如果出现职能问题或紧急情况，项目可能会受到影响。如果项目可能受到不利影响，项目经理可能需要就团队成员可用性与职能经理会面。`图\
  \ 2-1`展示了职能组织中的项目管理。在示例中，项目团队成员来自多个职能领域，每个职能经理对该职能领域的人员拥有权限。\n\n![Image](img/00006.jpeg)\n\
  \n**图 2-1** 职能团队结构\n\n![Image](img/00004.jpeg)\n\n### 矩阵团队结构\n\n在采用`矩阵团队结构(#part0034.html_gloss167)`的组织中，每位员工通常向一名职能经理汇报。然而，权限在职能经理和项目经理之间共享。根据职能经理和项目经理之间权力水平，矩阵团队结构被称为`弱矩阵`、`平衡矩阵`或`强矩阵`。\n\
  \n在大多数情况下，资源从职能领域分配到项目，但职能经理通常拥有最终的安排权限。项目经理的功能更多是协调员或催促者。\n\n\n\n\n\n图 2-2 展示了`弱矩阵`组织中的项目管理情况。部分人员被分配到项目中负责项目协调。其他参与项目的人员主要在他们的职能部门工作，同时也参与项目活动。\n\
  \n![Image](img/00007.jpeg)\n\n**图 2-2** 弱矩阵团队结构\n\n图 2-3 展示了`平衡矩阵`组织中的项目管理情况。在这种结构中，部分人员被分配到项目中负责项目协调。其他参与项目的人员主要在他们的职能部门工作，同时也参与项目活动。在这种矩阵中，项目经理通常是某个职能部门内部的职员。\n\
  \n![Image](img/00008.jpeg)\n\n**图 2-3** 平衡矩阵团队结构\n\n图 2-4 展示了`强矩阵`组织中的项目管理情况。与之前的示例一样，部分人员被分配到项目中负责项目协调，其他人员在主要在职能部门工作的同时也执行项目活动。在这种矩阵中，项目经理向\
  \ PMO（项目管理办公室）内的项目经理经理汇报。\n\n随着从弱矩阵向强矩阵转变，组织的团队结构变得更接近项目化。\n\n![Image](img/00009.jpeg)\n\
  \n**图 2-4** 强矩阵团队结构\n\n![Image](img/00004.jpeg)\n\n## 项目化团队结构\n\n在采用`项目化团队结构`的组织中，每位员工都向项目经理汇报。项目经理对所有资源拥有完全权限。资源根据需要（`ad\
  \ hoc`）进行分配，并在需要在项目之间移动。\n\n图 2-5 展示了项目化结构中的项目管理。在组织内部，所有人员都在项目经理的权限范围下。项目经理共同工作，确保每个项目都能获得相应的资源。\n\
