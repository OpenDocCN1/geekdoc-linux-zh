  \ | 4–10 |\n\n### 注意\n\n自评估的目标是衡量你对本章主题的掌握程度。如果你不知道问题的答案，或者对答案只有部分确定，在自评估时，你应该将该问题标记为错误。对于你猜正确的答案给分会扭曲你的自评估结果，并可能给你虚假的安全感。\n\
  \n**1.** 敏捷项目的哪种特性允许项目应对变化的情况？\n\n**a.** 增量的 (incremental)\n**b.** 预测性的 (predictive)\n\
  **c.** 迭代的 (iterative)\n**d.** 适应的 (adaptive)\n\n**2.** 下列哪种描述描述了敏捷项目的迭代特性？\n\n\
  **a.** 它将项目拆分为较小的组件。\n**b.** 它提供一个围绕预期结果的线性开发计划。\n**c.** 每个未完成的区域都会不断完善，直到结果满意。\n\
  \n\n\n\n\nd. 完成的工作贯穿整个项目生命周期交付。\n\n### 3. 敏捷计划中使用哪种工具来帮助收集需求？\n\na. 燃尽图\nb. 用户故事\n\
  c. scrum 回顾会议\nd. 问卷\n\n### 4. 在敏捷项目中，燃尽图的目的是？\n\na. 跟踪当前迭代（sprint）任务的完成情况\nb. 跟踪整个项目的任务完成情况\n\
  c. 决定团队将要开展的迭代的具体细节\nd. 决定团队将要开展的项目细节\n\n### 5. 敏捷项目成功的关键要素是什么？\n\na. 燃尽图\nb. 持续反馈\n\
  c. scrum 师\nd. scrum 回顾会议\n\n### 6. 下列哪些情况在迭代计划（sprint planning）期间不会发生？\n\na. 团队使用燃尽图收集需求。\n\
  b. 团队决定迭代的持续时间。\nc. 团队选择迭代期间将处理的目标事项列表（backlog）。\nd. 团队对任务进行估计。\n\n### 7. 下列哪个不是每日\
  \ scrum（daily scrum）会议中回答的问题之一？\n\na. 团队成员昨天做了什么？\nb. 团队成员今天将做什么？\nc. 是否存在任何障碍？\n\
  d. 在本次迭代中发生了什么问题？\n\n### 8. 在 scrum 回顾会议期间，谁应该负责在开始下一次迭代之前记录并对行动和教训进行优先级排序？\n\n\
  a. 团队成员\nb. 产品所有者\nc. scrum 师\nd. 项目经理\n\n### 9. 什么时候举行 scrum 回顾会议？\n\na. 在每次迭代之前\n\
  b. 在每次迭代之后\nc. 在最后一个迭代之后\nd. 在第一个迭代之前\n\n### 10. 哪种描述最符合敏捷团队？\n\na. 集中组织和指导\nb.\
  \ 自我组织和自我指导\nc. 集中组织但自我指导\nd. 自我组织但受集中指导\n\n### 基础主题\n\n![Image](img/00004.jpeg)\n\
  \n### 适应性计划\n\n预测性计划 使用历史数据提供一个围绕预期结果构建的线性开发计划。例如，建造大多数房屋的过程通常是相同的：场地准备、地基、框架结构等。预测性计划适用于这类项目。\n\
  \n适应性计划 允许项目根据需要演变，以应对变化的情况。通过将项目拆分为在不确定时间线上创建的小组件，适应性计划赋予了项目灵活性。某个项目任务的结果可能会导致项目发生变化以适应变化的环境。\n\
  \n预测性项目产生预期的输出，而适应性项目可能会产生意外惊喜。适应适应性项目是增进的，最终结果可能与原始计划大不相同。\n\n由于敏捷项目使用适应性计划，项目团队必须保持灵活并对变化持开放态度。由于项目是分阶段通过一系列交付物完成的，敏捷允许根据组织的需要修改项目方向。敏捷方法往往会提高质量和生产力。\n\
  \n![Image](img/00004.jpeg)\n\n### 迭代过程和增量过程\n\n迭代过程 通过一系列完善向预期结果迈进。当项目团队对开发步骤进行第一轮执行时，他们知道结果将是不完整的。随着项目的进行，团队将反复回到每个未完成的区域，并通过添加细节和功能来改进它。最终产品分阶段完善，直到团队对结果满意为止。\n\
  \n**示例：** 为了理解迭代方法，可以想象一下雕塑。雕塑家从原材料开始，将其雕刻成一个大致形状。最早的任务是勾画形状并去除作品所有区域的多余材料。在接下来的阶段中，雕塑家会精炼作品，为之前粗加工的每个区域添加细节。然而，在整个作品完成之前，雕塑并不算完成。雕塑家可能需要返回某些区域进行精炼和修改，以使最终产品反映出雕塑家的意图设计。\n\
  \n增量过程 在过程的每一步产生可用的交付物，尽管每一步的结果可能与最终结果相似。\n\n**示例：** 为了理解增量方法，可以想象一个郊区住宅开发项目。开发商雇用建筑师制作房屋的概念图，并规划新社区的地块线、道路和公用设施。一旦概念获得批准，建筑师就会创建用于估计成本和建造建筑的蓝图。蓝图定稿后，开发商建造一个板间房，买家可以在销售过程中参观。当地块出售给买家时，开发商建造最终的房屋。\n\
  \n增量方法不会重新访问过程中的之前的步骤。在这个示例中，一旦公用线路安装，开发商就不会返回第一步重新绘制地块线。\n\n敏捷开发既是迭代的增量的，在过程中仍在响应反馈不断变化：\n\
  \n![Image](img/00003.jpeg) **迭代的：** 敏捷开发是迭代的，因为项目计划在后续迭代中改进上一次迭代的工作。\n\n![Image](img/00003.jpeg)\
  \ **增量的：** 敏捷开发是增量的，因为完成的工作贯穿项目周期交付。来自利益相关者、用户和赞助者的持续反馈允许项目团队随时间推移改变项目需求。\n\n![Image](img/00004.jpeg)\n\
  \n### 需求收集和用户故事\n\n在敏捷项目中，来自利益相关者的持续反馈被用于完善项目需求，这意味着项目结束时的需求与开始时的需求可能不同。随着项目需求的变化或新设计考虑因素的揭示，需求经常被重写。\n\
  \n敏捷项目中的利益相关者积极参与为新功能和需求生成用户故事。用户故事根据特定用户捕捉软件功能描述。一个用户故事包含三个基本部分：\n\n![Image](img/00003.jpeg)\
  \ 我们在为谁构建它？\n\n![Image](img/00003.jpeg) 我们在构建什么？\n\n![Image](img/0003.jpeg) 我们为什么要构建它？\n\
  \n为了更好地理解用户故事，请查看以下用户故事示例：\n\n![Image](img/00003.jpeg) **编辑：** 我想在主屏幕上看到我所有的活跃出版物。\n\
  \n![Image](img/00003.jpeg) **学生：** 我想在板上看到我所有的旧成绩。\n\n![Image](img/00003.jpeg) **研究员：**\
  \ 我想看到我最后做的五次搜索。\n\n项目团队根据用户故事记录需求：\n\n![Image](img/00003.jpeg) **编辑：** 在主屏幕上显示活跃出版物。\n\
  \n![Image](img/00003.jpeg) **学生：** 在板上显示旧成绩。\n\n![Image](img/00003.jpeg) **研究员：**\
  \ 显示最后五次搜索。\n\n通过在项目工作进行期间继续收集设计需求，项目团队可以塑造产品以满足客户的需求。项目结果间歇地发布给客户，允许测试人员、工程师和客户充分研究设计。\n\
  \n\n\n\n敏捷团队通常使用`故事映射法(#part0034.html_gloss353)`技术来发现需求并生成项目的完整地图。通过这种技术，团队通过描绘用户故事来发现客户所需的功能。在编写用户故事的过程中，团队会收集需求。这些活跃的讨论有助于团队确定完整的功能设计。故事映射法之所以有效，是因为它基于用户故事产生了活跃的讨论、分步可视化和需求收集。\n\
  \n![Image](img/00004.jpeg)\n\n## Scrum 开发\n\n`Scrum(#part0034.html_gloss331)` 是一种项目管理框架，强调团队合作、问责制以及朝着明确目标进行迭代进展。作为最流行的敏捷方法论，Scrum\
  \ 既简单又灵活。Scrum 方法围绕一个重复的、迭代的工作周期展开，被称为 `sprint(#part0034.html_gloss343)`（冲刺）。一个冲刺的目标是以可用的形式完成产品的一某项需求。冲刺通常从冲刺计划会议开始，通过每日\
  \ Scrum 会议循环，并以回顾会议结束。\n\n在 Scrum 方法中，`scrum master(#part0034.html_gloss332)` 处理任何可能阻止团队项目进展的外部干扰或内部复杂问题。Scrum\
  \ Master 帮助将利益相关者的需求转化为需求，并执行 Scrum 策略，同时保持团队对项目设计的关注。Scrum Master 的目标是保持团队积极前进并走在正轨。\n\
  \n与传统的项目经理不同，Scrum Master 不会向团队成员分配工作，也不会指导项目策略。`product owner(#part0034.html_gloss220)`（产品所有）角色负责许多传统的项目管理任务，例如确定工作优先级、管理预算、验收交付物和设定发布日期。产品所有是敏捷产品的关键利益相关者，负责提供产品的整体愿景。\n\
  \n虽然用户故事通常在冲刺开始时编写，但团队成员实际上可以在周期的任何时候创建用户故事。然后根据用户故事创建需求。随着项目的进行，敏捷开发团队会维护一个 `backlog(#part0034.html_gloss19)`（待办列表）。该待办列表包含了当前冲刺中未处理的任何需求。在敏捷开发中，随着开发团队完成工作，冲刺待办列表会被输入到项目中。\n\
  \n![Image](img/00004.jpeg)\n\n### 冲刺计划\n\n`Sprint planning(#part0034.html_gloss344)`\
  \ 是决定即将到冲刺中要处理的具体工作的过程。产品所有、Scrum Master 以及整个项目团队都会参加冲刺计划会议。其他项目利益相关者也可能被邀请参加冲刺计划会议。\n\
  \n在冲刺计划会议期间，团队决定冲刺的持续。Scrum Alliance（一个协助 Scrum 标准的组织）建议冲刺为 30 天，但时长可以短至一周。作为指南，为一次冲刺选择的时长应该是整个项目期间使用的时长。在冲刺计划会议期间，项目团队选择将在冲刺期间处理的目标待办事项。一旦确定了这些目标，团队就需要明确该冲刺的需求。\n\
  \n在每个冲刺结束后，团队会回到冲刺计划阶段，直到所有待办事项完成或移除。由于团队指定了他们在每个冲刺中可以完成多少工作，因此冲刺并不一定对应于项目的部分。例如，产品所有不能期望每个冲刺都能完成四分之一的工作，仅仅因为在第一个冲刺中完成了那个量。\n\
  \n### 每日 Scrum 会议\n\nScrum 会议通常每天在同一地点、同一时间，通常是早晨第一件事。这些会议严格限制在 15 分钟。所有团队成员必须参加会议。Scrum\
  \ Master 和产品所有也应该参加会议以表示支持并记录任何问题。如果允许其他人参加会议，他们应该只负责听。。\n\n每个团队成员都有时间发言，回答以下问题：\n\
  \n1. 团队成员昨天做了什么？\n2. 团队成员今天将做什么？\n3. 是否有障碍？如果有，障碍是什么？\n\n通过回答这三个问题，每个团队成员都承诺完成某些任务以帮助团队实现其冲刺目标。任何提出的障碍将成为\
  \ Scrum Master 的责任，尽管 Scrum Master 可能会寻求他人的帮助来消除障碍。\n\n适当的每日 Scrum 会议有助于团队分担待办列表和燃尽图（本章稍后讨论）的责任。它们还帮助团队成员相互监督以完成每日义务。\n\
  \n### 持续反馈\n\n敏捷开发需要持续反馈以确保项目成功。每个团队成员在项目中都扮演着重要角色，并且必须适应新流程。如果没有持续反馈，团队成员可能会重复错误。每个团队成员的行动应由其他团队成员进行分析。及时的反馈可以帮助纠正成员以确保实现项目目标。\n\
  \n通过每日 Scrum 会议，敏捷团队可以提供持续反馈以确保快速改进和适应。对团队成员的建设性反馈应基于过去的实例；提供者提供过去行为的示例，并对接收者如何更好地处理这种情况提出建议。对团队同样重要的是关于流程改进的反馈。可以用于交换反馈的技术包括一对反馈、小组反馈、书面反馈和反馈指导。\n\
  \n在任何敏捷项目中，团队成员都应该努力培养持续反馈的文化。项目经理可能需要实施有助于在团队和组织内部培养这种文化的活动。随着项目的进行，持续反馈将成为团队的习惯。\n\
  \n![Image](img/00004.jpeg)\n\n### 燃尽图\n\n`Burndown charts(#part0034.html_gloss27)`\
  \ 是敏捷开发中最常用的冲刺跟踪机制。燃尽图显示了当前冲刺已投入和剩余的工作量。要创建燃尽图，你首先需要创建一个任务分解。每个任务必须有完成所需的关联小时数，由团队在计划会议期间确定。任务分解列出了每个任务、其状态、所有者、估计工作量（通常以小时计算）和剩余工作量。\n\
  \n绘制并更新燃尽图以反映项目进度，假设所有任务都将在冲刺内以均匀速率完成。红线表示理想进度（基准燃尽率），如`Figure 6-1(#part0019.html_ch06fig01)`所示。Y\
  \ 轴代表冲刺总小时数（在此情况下为 200 小时），X 轴代表项目中的冲刺日期。\n\n![Image](img/00016.jpeg)\n\n**图 6-1**\
  \ 燃尽图示例\n\n随着项目的进行，每个团队成员从任务分解中选择任务工作。在每天结束时，每个团队成员更新当天所选任务的状态，并估计完成该任务所需的剩余工作量。\n\
  \n燃尽图中的蓝线显示了每天的剩余工作量。如果蓝线在红线之上，如`Figure 6-2(#part0019.html_ch06fig02)`所示，项目进展比预测慢，可能无法按时完成承诺。如果蓝线在红线下方，项目正以加速运行，可能比预期更早完成。\n\
  \n![Image](img/00017.jpeg)\n\n\n\n\n# 图 6-2 显示进度缓慢的燃尽图\n\n在某些项目中，燃尽图会在工作完成之前结束。像图\
  \ 6-3 所示的燃尽图显示未达到冲刺承诺。剩余工作将成为待办事项列表（backlog）的一部分，并带入后续的项目冲刺。\n\n![Image](img/00018.jpeg)\n\
  \n## 图 6-3 显示未达成冲刺承诺的燃尽图\n\n图 6-4 中的燃尽图显示，项目团队在冲刺的前几天工作速度较慢，然后在冲刺结束时进行冲刺以完成承诺。该项目团队需要确保项目任务在各个冲刺之间的分布更加均匀，并防止拖延成为一个问题。\n\
  \n![Image](img/00019.jpeg)\n\n## 图 6-4 显示冲刺末期赶的燃尽图\n\n在图 6-5 中，尽管团队在冲刺结束时实现了承诺，但其表现一直不一致。这种分布很可能是因为团队成员在每周周末临近时急于完成周目标导致的。\n\
  \n![Image](img/00020.jpeg)\n\n## 图 6-5 显示工作不一致的燃尽图\n\n由于燃尽图对项目的成功至关重要，因此项目团队应该努力确保燃尽图尽可能准确。以下是燃尽图上可能犯的一些典型错误：\n\
  \n![Image](img/00003.jpeg) **多个用户故事具有共同任务：** 不应该在多个用户故事中创建任务，而任务分解应该包含一个跨越这些故事的单一任务。这样，燃尽图就能正确地反映该任务只需要完成一次。\n\
  \n![Image](img/00003.jpeg) **任务太困难或太大：** 任务的大小（时长）应保持在可管理的范围内，以防止跟踪变得困难。大多数出版物建议单个任务的最长时间为\
  \ 12 小时。\n\n![Image](img/00003.jpeg) **误解剩余投入与已投入投入之间的关系：** 在更新任务时，团队成员应重新估算每个任务，包括更新完成所需的剩余投入。如果这两个字段都没有更新，燃尽图最初将显示下降趋势。但在冲刺的后些时候，蓝线会折回并再次交叉红线，如图\
  \ 6-6 所示。\n\n![Image](img/00003.jpeg) **未能每日更新投入：** 燃尽图上的任务投入应由所有团队成员在每天结束时更新，以确保燃尽图显示正确的情况。\n\
  \n![Image](img/00021.jpeg)\n\n## 图 6-6 显示投入更新不当燃尽图\n\n使用燃尽图跟踪进度具有多个优势：\n\n![Image](img/00003.jpeg)\
  \ 项目团队共享单一的计划和跟踪工具。\n\n![Image](img/00003.jpeg) 对投入和进的每日反馈提供了每日的风险缓解。\n\n![Image](img/00003.jpeg)\
  \ 燃尽图简化了与客户和利益相关者的有效沟通。\n\n![Image](img/00003.jpeg) 可以有效跟踪回顾行动项。\n\n### Scrum 回顾\n\
  \n在每个冲刺结束时，团队会举行一次 Scrum 回顾。团队成员和 Scrum 主管会面，讨论刚刚结束的冲刺，并记录任何有助于下一次冲刺提高效率的更改。Scrum\
  \ 回顾类似于许多项目管理方法中的“教训”会议。\n\nScrum 回顾应该回答三个主要问题：\n\n1. 在本次冲刺中哪些工作做得好？\n2. 在本次冲刺中哪些工作上出了问题？\n\
  3. 可以做哪些改进来提高下一次冲刺？\n\n回顾结束后，Scrum 主管应在开始下次冲刺之前记录并优先考虑行动和学到的教训。记住，Scrum 回顾的核心在于提供持续反馈，调整项目需求以满足项目目标。\n\
  \n### 自组织和自主型团队\n\n与严重依赖项目经理引导团队的其他项目管理方法不同，敏捷项目中的项目团队被预期是自组织和自主的，每个团队成员都对其他团队成员负责其自己的义务。每个团队成员完成当前的义务，然后转向另一个义务。在大多数情况下，团队成员选择他们想要完成的任务，这通常允许更高效地完成任务。\n\
  \n一个纪律严明的敏捷团队比传统的项目团队更容易管理。在许多情况下，Scrum 主管的角色更多是协调者而不是项目经理。因此，Scrum 主管仍然需要传统项目经理所需的人际技巧，以帮助团队成员响应反馈并在任务上达成共识。\n\
