  ## 附录 B 记忆表格\n# 附录 C 记忆表格答案\n\n## 献辞\n\n给我的丈夫 Michael 和我的儿子 Jonas。我爱你们！\n\n## 关于作者\n\
  \n`Robin M. Abernathy` 在 Kaplan IT Training（Transcender 品牌的所有者）的 IT 认证准备行业工作了超过\
  \ 15 年。她曾编写并编辑过针对 (ISC)2、Microsoft、CompTIA、PMI、Cisco、EC-Council 和 ITIL 认证的准备材料，并持有这些供应商的多个\
  \ IT 认证。\n\nRobin 提供计算机硬件和软件、网络、安全和项目管理的培训。她曾担任多本出版物的技术编辑，并合著了 Pearson 的第二版 `CompTIA\
  \ Advanced Security Practitioner (CASP) CAS-002 Cert Guide` 和 `CISSP Cert Guide`。她还在技术会议上发表演讲，并主持关于\
  \ IT 认证主题的网络研讨会。\n\n## 致谢\n\n首先，我再次感谢我的天父，让我知道我注定要做，即使在成年早期我说过“我永远不会以电脑为工作或以写作为生”。上帝总有计划。而且`知道`祂很有幽默感！\n\
  \n如果没有我的替代兄弟们，我的生活将是不完整的。虽然你们通过悲剧的情况进入我的世界，但你们已成为我真正的兄弟。Doug Carey 和 John Carey，感谢你们向我介绍有关辛辛那提红队、蝙蝠、`星际迷航`和埃尔维斯的一切。感谢收养了两个小女孩，我知道他们在青少年时期可能很不容易。爱你们！Lynne\
  \ 和 Lorrie，我们也很喜欢你们加入我们的家庭！Will Carey、Bobby Carey、Christian Carey 和 Jacob Carey，你们有很棒的父亲，我喜欢看着你们变得像他们一样！\n\
  \n我想感谢我所有的侄女和外甥，在上帝赐予我自己的孩子之前，他们是我的替代孩子。Jordyn Abernathy、Chase Abernathy、Chad Abernathy、Cassie\
  \ Bonds、Caitie Bonds、Zack Stadler、Noah Stadler 和 Gabe Stadler，尽管你们的父母不这么想，但你们是`我的`第一批孩子。Tyler\
  \ Loggins，感谢你作为哥哥照顾 Stadler 兄弟们。最后，Luke 和 Jordyn McDaniel，我们的家庭和你们的父母等了你们很久。看着你们成长并成为我们家族故事的核心部分是我们的快乐！\n\
  \n我必须感谢我完美的丈夫 Michael 和儿子 Jonas，再次在我被关在项目管理世界里时愿意去做“男人的事”。你们是我的世界！这段旅程太精彩了！！！\n\n\
  感谢 Pearson 的所有人再次组建了一支优秀的团队，帮助我完成这段 Project+ 之旅。Robin Drake 和 Ann Lang，老实说，这是迄为止最棒的一个团队。你们两个是摇滚明星！\n\
  \n各位读者，祝你们在 IT 认证目标上取得成功！\n\n—Robin Abernathy\n\n## 关于技术审核员\n\n`Ann Lang` 是一位认证项目经理和技术写作作家。她在\
