  \na. 三重约束\nb. 约束重新排序\nc. 范围蔓延\nd. 变更请求\n\n5.** 下列哪个是范围蔓延的示例？\n\na. 由于项目赞助者要求额外的\
  \ 10 个服务器架，数据中心项目超出预算 100,000 美元且进度落后六个月。\nb. 公司最近遇到了财务困难，要求削减预算，导致进度延长。项目最初开始时，需要尽快完成。\n\
