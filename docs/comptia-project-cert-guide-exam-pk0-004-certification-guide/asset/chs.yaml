  \n![图像](img/00002.jpeg)\n\n## 引言\n\nProject+ 认证是一项优秀的入门级项目管理认证。作为一项全球认可的证书，Project+\
  \ 认证证明了持有者在广泛的项目管理主题方面拥有知识和技能。\n\n在每个行业，每个大小组织每天都会启动新项目。许多组织意识到，具备项目管理技能和知识的人员对于项目的成功至关重要。Project+\
  \ 认证专业不仅拥有基础的项目管理知识；为了通过 Project+ 考试，认证考生必须理解项目管理的各个方面。\n\n\n\n\n项目管理知识和技能适用于所有类型的项目，从建筑、软件开发到制造以及所有其他领域。获得\
  \ `Project+` 认证证明了项目管理人员启动、计划、执行、监控和控制、完成以及关闭项目的能力。\n\n## Project+ 认证的目标\n\n`Project+`\
  \ 认证由知名的认证机构——计算技术行业协会（CompTIA）创建并管理。CompTIA `Project+` 认证有若干明确的目标。虽然了解这些目标对于通过考试并非至关重要，但熟悉\
  \ CompTIA 组织组织及其对 `Project+` 认证的目标，有助于理解考试创建背景和内容背后的动机。\n\n## 赞助机构\n\nCompTIA 是一家非营利性贸易协会，提供供应商中立的认证流程，并与合作伙伴共同创建教材。`Project+`\
  \ 认证是 CompTIA 提供的多种认证之一：\n\n![Image](img/00003.jpeg) A+\n\n![Image](img/00003.jpeg)\
  \ Network+\n\n![Image](img/00003.jpeg) Security+\n\n![Image](img/00003.jpeg) Linux+\n\
  \n![Image](img/00003.jpeg) Cloud+\n\n![Image](img/00003.jpeg) Mobility+\n\n![Image](img/00003.jpeg)\
  \ Server+\n\n![Image](img/00003.jpeg) CDIA+\n\nCompTIA 还提供两个大师级安全认证：\n\n![Image](img/00003.jpeg)\
  \ CompTIA 高级安全从业人员 (CASP)\n\n![Image](img/00003.jpeg) 网络安全分析师+ (CSA+)\n\n## 明确的目标\n\
  \nCompTIA 管理 `Project+` 认证的目标是提供一种可靠的工具，来衡量个人管理项目生命周期的知识和技能，确保适当的沟通、管理资源和利益相关者，并维护项目文档。考试涵盖的主题在技术上比某些其他项目管理认证测试的内容要浅一些。\n\
  \n`Project+` 考试 (`PK0-004`) 涵盖的四个知识领域的主题将在本引言后续部分进行讨论。\n\n## Project+ 认证的价值\n\n\
  `Project+` 认证对考试候选人和组织都具有价值。项目管理是一项在招聘网站上日益受欢迎的职业技能。`Project+` 通常被认为是项目管理领域新手的极佳入门认证。\n\
  \n### 对项目专业人士\n\n项目管理专业人士有很多理由投入精力和精力获得 `Project+` 认证：\n\n![Image](img/00003.jpeg)\
  \ 满足对项目管理人员日益增长的需求\n\n![Image](img/00003.jpeg) 在竞争日益激烈的职场市场中更具市场吸引力\n\n![Image](img/00003.jpeg)\
  \ 提升当前工作的技能\n\n![Image](img/00003.jpeg) 获得晋升资格或更成功地竞争晋升机会\n\n![Image](img/00003.jpeg)\
  \ 增加收入\n\n简而言之，这项证书证明了持有者不仅拥有考试测试的知识和技能，还具备计划和实施涵盖广泛项目管理主题的学习课程的能力。\n\n### 对组织\n\
  \n对于组织而言，`Project+` 认证提供了一个可靠的基准，通过验证知识和经验来对求职者进行衡量。持有该认证的人会脱颖而出，使招聘过程变得更容易，并为最终选择增加信心。\n\
  \n## Project+ 目标\n\n`Project+` 考试 (`PK0-004`) 中的内容分为四个领域，每个领域包含若干个目标：\n\n![Image](img/00003.jpeg)\
  \ 项目基础领域\n\n![Image](img/00003.jpeg) 项目约束领域\n\n![Image](img/00003.jpeg) 沟通与变更管理领域\n\
  \n![Image](img/00003.jpeg) 项目工具与文档领域\n\n在大多数情况下，本书为这些目标中的每一个分配了一个章节。少数目标已逻辑性地合并到一个章节中。领域和目标之间不可避免会有重叠，导致章节涵盖的主题之间存在重复。本节描述了所涵盖的领域和主题。\n\
  \n### 项目基础领域\n\n`项目基础领域`涵盖了广泛的通用项目管理主题：\n\n![Image](img/00003.jpeg) 项目属性\n\n![Image](img/00003.jpeg)\
  \ 项目角色与职责\n\n![Image](img/00003.jpeg) 项目阶段\n\n![Image](img/00003.jpeg) 项目成本控制\n\n\
  ![Image](img/00003.jpeg) 项目团队组织结构\n\n![Image](img/00003.jpeg) 项目进度\n\n![Image](img/00003.jpeg)\
  \ 敏捷方法论\n\n![Image](img/00003.jpeg) 人力、物理资源及人员管理\n\n### 项目约束领域\n\n`项目约束领域`涵盖了广泛的项目限制因素：\n\
  \n![Image](img/00003.jpeg) 项目约束变量与影响\n\n![Image](img/00003.jpeg) 项目风险策略与活动\n\n###\
  \ 沟通与变更管理领域\n\n`沟通与变更管理领域`涵盖了沟通以及变更管理过程中的谁、什么、为什么和何时：\n\n![Image](img/00003.jpeg)\
  \ 项目沟通方法\n\n![Image](img/00003.jpeg) 项目沟通影响因素\n\n![Image](img/00003.jpeg) 项目沟通触发因素、受众及依据\n\
  \n![Image](img/00003.jpeg) 项目控制过程与变更类型\n\n![Image](img/00003.jpeg) 组织变更\n\n### 项目工具与文档领域\n\
  \n`项目工具与文档领域`涵盖了成功管理项目所需的所有工具和文档：\n\n![Image](img/00003.jpeg) 项目管理工具\n\n![Image](img/00003.jpeg)\
  \ 以项目中心的文档\n\n![Image](img/00003.jpeg) 以供应商中心的文档\n\n## 获取 CompTIA 认证的步骤\n\n要获得 CompTIA\
  \ Project+ 认证，候选人必须满足某些先决条件并遵循某些程序。本节涵盖这些主题。\n\n### 关于 Project+ 考试\n\n`Project+`\
  \ 考试是一项机考，候选人有 90 分钟的时间完成。没有正式休息时间，但允许你进行短暂休息。无论你是在线考试还是在 VUE 考试中心面对面考试，休息使用的任何时间都会计入\
  \ 135 分的最长时长内。你必须携带政府颁发的身份证。不接受其他形式的身份证明。\n\n考试将包含最多 100 道单选题和拖拽题。及格分是 900 分中的 711\
  \ 分。候选人将在测试中心从测试管理员处获得结果。\n\n### 报名\n\n虽然参加考试没有经验要求，但 CompTIA 建议至少拥有 12 个月的累计项目管理经验。由于这不是硬性要求，候选可以在没有经验的情况下报名，但应该花费足够的学习时间以确保他们拥有所需的知识。\n\
  \n### 报名\n\nCompTIA 考试在全球的 VUE 考试中心提供。美国和加拿大的某些合格学生或其他个人可能符合通过 ProctorU 远程参加 `Project+`\
  \ 考试，而不是前往考试中心。如果你想在线考试，请查看并遵循 `http://proctoru.com/portal/comptia` (`http://proctoru.com/portal/comptia`)\
  \ 中的说明。\n\n在最近的 Pearson VUE 考试中心参加 `Project+` 考试的步骤如下：\n\n1. 创建 Pearson VUE 账户 `www.pearsonvue.com/comptia`\
  \ (`http://www.pearsonvue.com/comptia`)。\n\n2. 在最近的 Pearson VUE 场预约考试。\n\n\n\n\n\
  \n3. 保存您的考试预约确认单。\n\n完成考试后，您将获得一份成绩报告。请妥善保存此成绩报告，直到您通过登录 [`www.certmetrics.com/comptia/login.aspx`](https://www.certmetrics.com/comptia/login.aspx)\
  \ 确认您已获得该证书。\n\n## 如何使用本书\n\n此本书的目标非常简单：帮助你通过 2017 版本的 CompTIA Project+ 认证考试（PK0-004）。\n\
  \nProject+ 考试强调对项目管理知识领域和经验的全面理解。无论你是在多个行业中拥有资深项目经理背景，还是初次进入项目管理领域，本书都旨在帮助你理解并掌握考试所需的目标。\n\
  \n本书使用了多种方法论来帮助你：1) 发现你需要更多复习的考试主题，2) 充分理解并记住这些主题的细节，以及 3) 向自己证明你已经掌握了关于这些主题的知识。要通过考试，仅仅背记术语是不够的；你必须理解考试和本书中涵盖的概念。\n\
  \n每个章节的结构如下：\n\n![Image](img/00003.jpeg) **目标：** 章节开头列出了该章节涵盖的 Project+ 考试主题、这些主题的简要介绍以及相应的\
  \ CompTIA Project+ 目标列表。\n\n![Image](img/00003.jpeg) **“我已经知道了吗？”测验：** 该测验测试你对章节所涵盖的主要主题的知识和理解。详细答案位于\
  \ 附录 A，“我已经知道了吗？”测验和复习题答案](#part0033.html_app01)”。测验帮助你评估应该阅读整个章节、仅阅读不熟悉主题的部分，还是直接跳转到“考试准备任务”部分。\n\
  \n![Image](img/00003.jpeg) **基础主题：** 这一部分包含了章节的核心内容。它通过理论和示例探讨了章节主题。深入描述、列表、表格和图表旨在构建你的知识，以便你通过\
  \ Project+ 考试。\n\n![Image](img/00003.jpeg) **示例：** 本书提供了超过 125 个真实的案例，展示了项目管理实际上在项目经理工作中涉及的阶段、任务、文档、流程等方面是如何*运作*的。这些示例旨在为你提供真实的见解，这对于正式\
  \ Project+ 考试中的情景分析题特别有用。\n\n![Image](img/00004.jpeg)\n\n![Image](img/00003.jpeg)\
  \ **关键主题：** 页边空白的关键主题图标表示你考试时应该知道的重要信息。虽然整个章节的内容都可能出现在考试中，但一定要掌握每个关键主题中列出的信息。章节的所有关键主题都汇总在章节末尾的关键主题表格中，以便快速参考涵盖每个关键主题的正文。\n\
  \n![Image](img/00003.jpeg) **考试准备任务：** 章节的这一部分从主动学习转向主动备考。现在你已经掌握了章节内容，请使用本部分的活动来测试你对章节信息的理解情况：\n\
  \n![Image](img/00003.jpeg) **复习所有关键主题：** 本部分中的关键主题表格对带有前述“关键主题”符号标记的每个章节元素进行了简要总结。仔细查看表格内容，以检查你对该主题的理解。如果需要刷新记忆或学习更多知识，表格列出了每个主题开始的页码，你可以立即跳转到章节中的该位置。\n\
  \n![Image](img/00003.jpeg) **定义关键术语：** 这一部分列出了章节中讨论的所有重要术语。你被要求熟悉 Project+ 考试的这些关键术语。为列表中的术语提供自己的定义，然后将你的定义与书末词表中的定义进行比较。词表整合了所有章节中的所有关键术语，并按字母顺序排列，以便查找每个术语。\n\
  \n![Image](img/00003.jpeg) **复习题：** 每个章节末尾都有 10 道多选题，旨在测试你对章节内容的理解情况。请对照 附录 A 中的答案和描述核对你的选择。\n\
  \n## 谁应该读本书？\n\nCompTIA Project+ 考试适用于任何领域的项目管理。该考试证明成功的候选人具备管理任何类型组织项目所需的必要知识和技能。\n\
  \n如前所述，参加考试不需要任何项目管理经验。然而，CompTIA 建议至少拥有 12 个月的累计项目管理经验。\n\n本书面向广泛的 Project+ 认证候选人，从寻求初级项目管理知识的人到希望保持技能敏锐、增加收入、提高组织排名或头衔，或满足组织强制认证政策的资深项目经理。\n\
  \n## 备考策略\n\n你如何使用本书来备考取决于你现有的技能和知识。理想的备考应该是经过多年活跃的项目管理经验，加上对考试目标的严谨学习，但对你来说这可能并不实际。确定你是否准备好参加\
  \ Project+ 的最佳方法是完成章节开头的“我已经知道了吗？”测验。\n\n如果你需要学习 PK0-004 认证考试大纲中的特定领域，请在书中找到这些部分并仔细复习。表\
  \ I-1 列出了 Project+ 考试目标以及这些目标在本书中的对应章节。\n\n**表 I-1** CompTIA Project+ PK0-004 考试主题与章节映射\n\
  \n| Project+ 目标 | 描述 | 章节 |\n| :--- | :--- | :--- |\n| 1.1 | 总结项目的属性。 | 1 |\n| 1.2\
  \ | 分类项目角色和职责。 | 2 |\n| 1.3 | 比较和对比标准的项目阶段。 | 1 |\n| 1.4 | 识别项目成本的基础。 | 3 |\n| 1.5\
  \ | 识别常见的项目团队组织结构。 | 2 |\n| 1.6 | 给定场景，执行并制定项目计划。 | 4 |\n| 1.7 | 识别敏捷方法的基本方面。 |\
  \ 6 |\n| 1.8 | 解释人力资源、物理资源和人员管理的重要性。 | 5 |\n| 2.1 | 给定场景，预测贯穿项目的各种约束变量和影响。 | 7 |\n\
  | 2.2 | 解释风险策略和活动的重要性。 | 8 |\n| 3.1 | 给定场景，使用适当沟通方法。 | 9 |\n| 3.2 | 比较影响沟通方法的因素。\
  \ | 9 |\n| 3.3 | 解释常见的沟通触发因素并确定目标受众和理由。 | 10 |\n| 3.4 | 给定场景，在项目背景下使用以下变更控制流程。 |\
  \ 11 |\n| 3.5 | 识别组织变更类型。 | 11 |\n| 4.1 | 比较对比各种项目管理工具。 | 12 |\n| 4.2 | 给定场景，分析项目中心的文档。\
  \ | 13 |\n| 4.3 | 识别常见的合作伙伴或供应商相关的文档及其目的。 | 14 |\n\n\n\n\n\n当你对自己的技能充满信心时，请完成每一章中的“考试准备任务”部分，然后尝试在线通过\
  \ Pearson Test Prep 模拟考试软件进行练习考试。在进行练习考试时，记下你缺乏知识或信心的领域，然后在书中复习这些概念。在复习这些领域后，再次进行练习考试并对你的技能进行评分。请记住，练习考试的次数越多，你对题目就越熟悉。\n\
  \n在你成功完成练习考试后，请按照前文介绍安排你的 CompTIA Project+ PK0-004 考试。通常情况下，候选人应该在感觉准备好的一周内参加考试。\n\
