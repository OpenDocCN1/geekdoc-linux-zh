  \n\n\n\n\n### 问题 8\n哪些因素被称为*三重约束*？\n\n**a.** 范围、时间、成本\n**b.** 资源、时间、范围\n**c.** 时间、需求、质量\n\
  **d.** 成本、资源、质量\n\n### 问题 9\n下列哪项*不属于*描述项目约束？\n\n**a.** 如果贵机构的产品没有在五个月内发布，一个主要的竞争对手将率先推出类似产品进入市场。\n\
  **b.** 项目必须包括针对客户员工的现场培训，该培训须在项目结束前三周交付。\n**c.** 材料成本不能超过预算的 10%。\n**d.** 产品必须运行在客户现有的销售点终端上。\n\
  \n### 问题 10\n下列哪项描述了约束之间的相互作用？\n\n**a.** 赞助人想要增加预算并使用更贵的材料。赞助人要求项目经理评估这些变更对时间表的影响。\n\
  **b.** 一项新通过的法规要求正在进行的项目符合额外的安全标准。项目经理为测试分配了另外一个月的时间，并重新安排了原型批准会议。\n**c.** 因为项目\
  \ B 具有更高的业务优先级，一位高级经理要求关键资源将其 70% 的时间花在项目 B 上，仅 30% 花在项目 A 上。\n**d.** 团队成员向客户提交了一份手册进行审批。客户要求团队成员在打印手册之前对高管肖照进行数字修饰。\n\
  \n### 基础知识\n\n![Image](img/00004.jpeg)\n\n### 常见约束\n\n`约束` 是限制项目范围或执行的因素。约束在项目的启动阶段首先确立，并在项目章程中进行高层记录。在计划阶段，约束会被记录在项目范围说明书中。项目经理必须确保所有约束都得到适当的记录和监控。\n\
  \n> **注意**\n> 范围说明书见第 1 章，“项目属性与阶段。”\n\n### 如果需要更改约束，项目经理需要获得项目赞助人的批准。项目的变更控制流程概述了这些变更如何获得批准和记录。项目经理负责评估变更的影响，更新任何受变更影响的项目文档，并将变更告知相关的团队成员和利益相关者。\n\
  \n> **注意**\n> 有关变更控制流程的细节，请参见第 11 章，“变更控制。”\n\n本节介绍了如何预测各种约束变量的影响，包括成本、范围、时间与进度、交付物、质量、环境、资源和需求。\n\
  \n成本、范围和时间共同构成了`三重约束`。改变三重约束的某一方面会自动影响其他方面。每个约束都有其支持者。例如，项目赞助人可能主要关注成本（尽可能廉价地获得项目结果），而项目客户可能主要关注时间（尽可能快获得项目结果）和范围（在项目中获得所有必要的功能）。\n\
  \n当项目启动时，三重约束的三个方面具有相同的权重。\n\n随着项目的启动和计划，必须平衡这些约束，以确保项目结果在项目定义的范围、时间和成本约束内实现。\n\n\
  项目经理应该理解这条规则：“好、快、廉”——三选其二。要实现所有三个目标是不可能的。在大多数项目中，一个或两个约束具有优先权。如果约束在项目期间重新调整了优先级，则必须对其他约束进行彻底审查。\n\
  \n**示例：** 你正在管理一个项目，该项目在计划阶段的主要关注点是成本。为了降低成本，项目进度被延长了，材料质量较低，资源知识水平有限，且范围不包含最初建议的所有功能。项目进行一半时，一家竞争公司开始开发竞争产品。如果你的项目赞助人想在竞争对手之前抢占市场，你的项目约束将不得不重新调整优先级：加快进度会导致更高的成本，实现所需的发布日期可能需要进一步缩小项目范围，依此类推。\n\
  \n![Image](img/00004.jpeg)\n\n### 成本约束\n\n预算是任何项目的经典约束，因为每个项目的可用资金都是有限的。在计划阶段，项目经理估算完成项目所需的资金。成本包括资源、承包商的工费率、风险估计、材料等。项目中所有具有货币属性的方面都是整体成本结构的一部分。项目经理利用所有成本细节来估算项目预算。大多数项目包含`储备`，即分配用于应对风险的资金。然而，即使有了储备，任何项目的可用资金也是有限的。\n\
  \n> **注意**\n> 第 8 章讨论了不同类型的风险储备。\n\n如果项目的成本估算不准确且最终需要更多资金，则需要增加项目预算并获得赞助人的批准，或者需要调整其他项目约束。项目的变更控制流程概述了这些变更如何获得批准和记录。\n\
  \n**示例：** 在建造新房子的项目进行期间，项目经理发现木材成本远高于预期。项目经理需要与项目赞助人（在这种情况下是房主）面，a) 获取额外资金以覆盖增加的成本，b)\
  \ 减少其他领域的成本，或 c) 两者兼顾。房主可能会决定减少其他领域的成本来抵消木材价格上涨的增加。例如，更换更廉价的灯具并省略顶角线，可能提供足够的资金来覆盖木材成本的增加。\n\
  \n![Image](img/00004.jpeg)\n\n### 范围约束\n\n范围是一种约束，因为它将项目工作限制在产生项目最终产品、结果或服务所需的内容。在计划阶段，项目经理确定有助于定义项目范围的需求。所有被接受的需求都为项目范围提供指导。\n\
  \n由于范围在三重约束中与成本时间和结合，范围的改变会改变一个或两个其他方面。如果项目范围必须更改，则需要更改项目预算并获得赞助人的批准，和或需要调整项目进度。\n\
  \n**示例：** 在一个新银行应用程序的项目期间，赞助人请求增加一个功能。项目经理需要与赞助人面谈，a) 获取额外资金以涵盖新功能并调整进度以考虑开发时间，b)\
  \ 决定牺牲哪些其他功能以抵消预算和进度的变化，或 c) 两者兼顾。做出决策后，项目需要根据这些决策进行调整。\n\n![Image](img/00004.jpeg)\n\
  \n### 时间与进度约束\n\n\n\n\n\n时间是一项项目约束，因为每个项目都有有限的时间可用来创建项目的交付物。可用时间决定了项目进度，即交付项目所需的时间。时间影响着大多数其他项目约束，包括成本、范围、质量和进度安排。\n\
  \n在规划阶段（Planning phase），项目经理确定项目进度，将所有资源分配给项目任务或活动。项目进度基于完成任务所需的时间以及所有资源可用的时间。完成项目所需的最少时间（关键路径）也会影响用于付费资源工时的的最低项目预算。\n\
  \n### 注意\n关于关键路径的讨论，请参阅第 4 章“项目进度”。\n\n如果分配给某项任务的时间超出预期，由于需要额外资源，将会产生额外成本；例如，员工可能需要支付加班费来完成超过分配小时数的任务。如果无法获得额外的资源时间，包括质量和范围在内的其他项目约束可能会受到影响。\n\
  \n**示例：** 在一个新移动应用程序的项目中，开发人员表示任务完成的时间比原计划要长。项目经理可能需要获得额外的员工来帮助项目按进度进行，或者她可能会要求目前的开发人员加班以满足原始的项目发布日期。这两个选择中的任何一个都会导致项目成本增加，从而影响项目预算。项目经理还可以要求缩小项目范围，例如删除应用程序中的某个功能。\n\
  \n![Image](img/00004.jpeg)\n\n### 交付物约束\n交付物被认为是项目约束，因为每个项目都会创建某种交付物。这些交付物被视为项目范围的一部分。交付物也是约束，因为它们必须满足特定的、可衡量的标准或关键绩效指标（KPI）才能被接受。\n\
  \n### 注意\n关于关键绩效指标的更多信息，请参阅第 12 章“项目管理工具”。\n\n在规划阶段，项目经理确定项目的交付物。如果规划完成后项目范围发生变化，通常会交付物。如果交付物的数量增加，项目预算和进度通常会受到影响。\n\
  \n**示例：** 一个新书项目正在进行，作者决定在计划的大纲中增加一个章节。项目经理可能需要调整项目进度，以包含编写新章节的时间。项目经理可能会尝试与作者合作，确保项目进度保持不变，但如果只有一个作者，这种选择可能不太可行。聘请另一位作者会导致成本增加。\n\
  \n虽然交付物不属于三重约束，但在任何类型的项目中更改交付物无疑会影响项目范围，并可能影响成本和时间。\n\n![Image](img/00004.jpeg)\n\
  \n### 质量约束\n每个项目都有交付物必须遵守的质量参数。质量约束被视为项目范围的一部分，根据需求管理计划中记录的需求定义项目交付物的质量。需求描述了预期结果，但质量是衡量该结果是否交付的标准。\n\
  \n### 注意\n第 12 章介绍了衡量交付物质量的工具。\n\n在规划阶段，项目经理确定项目质量。项目范围影响项目质量，质量反过来影响其他项目约束。例如，如果为了满足质量标准，交付物必须由昂贵的材料制成，材料成本将成为最低项目预算的一部分，使其成为优先约束。如果生产正确的交付物需要大量时间，则必须安排充足的资源工时。\n\
  \n任何类型项目的质量变化都会影响项目范围，从而影响成本（项目预算）和时间（项目进度）。\n\n**示例：** 一家公司正在制造一个新的机器部件，项目发起人请求将项目改为更高质量的金属合金。项目经理需要增加项目预算以考虑到这种更昂贵的材料。此外，项目进度可能会因为订单和接收新合金所需的时间而延迟。\n\
  \n![Image](img/00004.jpeg)\n\n### 环境约束\n项目发生的环境可能会约束其范围、交付物的质量、资源的可用性、进度或许多其他因素。环境约束包括企业环境、组织之外的全球环境，以及项目环境本身。项目经理必须理解并记录这些环境对项目可能产生的任何影响。\n\
  \n企业环境包括组织类型和组织文化。例如，在职能型公司中，项目经理必须与职能经理合作以协商资源时间。这种环境会限制资源和进度安排。\n\n### 注意\n职能团队结构在第\
  \ 2 章“项目角色、职责和团队结构”中讨论。\n\n全球环境是为项目搭建舞台的背景，例如监管环境、物理环境（自然界）、政治环境和/或财政环境。这些问题可能根据项目完成的地点而异。例如，设计新汽车的项目将受到监管环境（安全测试和排放标准）的约束。建筑项目受到法规（建筑规范）和建筑物理环境（如需要抗震框架）的约束。太阳能发电项目可能会受到物理环境（阳光的可用性）和政治环境（位于具有能源税收优惠的市场）的约束。\n\
  \n**示例：** 一个新建筑项目正在进行，市规划委员会报告说，原计划越越了邻近物业的界线六英寸。项目经理可能需要对场地进行重新测量，并与建筑师和设计人员合作调整建筑图纸。此外，项目进度可能需要调整以考虑到施工延迟。或者，项目经理可以向市申请获得该物业（如果它在市场上可用且负担得起）。\n\
  \n项目环境包括完成项目必须存在的任何变量。某些项目可能需要“无尘室”来进行科学实验。其他项目可能需要特定的环境条件，例如维持在特定范围内的温度。还有其他项目可能需要访问某些物理环境，如海洋或外层空间。很多情况下，这些特定条件只能在一年的特定时间或特定地点获得。项目经理的工作是确保项目规划规定了这些要求。\n\
  \n**示例：** 一个新项目设计用于测试某种植物是否能在特定季节的特定温带环境中生长。对于这个项目，适当的规划至关重要，以确保项目在季节开始的地点和时间准备就绪。\n\
  \n\n\n\n\n项目环境的变化可能会影响所有三个三重约束：范围、时间和成本。\n\n![Image](img/00004.jpeg)\n\n## 资源资源约束\n\
  \n`资源` 是完成项目所需的人员和其他资产。人员可能因为仅在特定时间有空、执行某项任务需要固定时间或缺乏产出交付物的技能而对项目产生限制。对于人员资源，项目经理需要确保团队成员具备完成项目任务所需的适当技能。对于所有其他资产，项目经理必须确保这些资产能够及时采购并可用，以用于需要它们的任务中。\n\
  \n**示例：** 在完成一个新项目的规划阶段后，项目经理发现项目所需的石灰岩至少六个月内无法从供应商那里获得。另一个供应商有足够的项目所需石灰岩现货，但价格高得多。项目经理和项目赞助人需要在三种替代方案之间做出选择：1)\
  \ 调整进度，以反映原始成本下所需石灰岩的预计可用。2) 增加预算以涵盖目前可用石灰岩的涨价。3) 更改项目范围以允许使用另一种建筑材料。\n\n在项目的规划阶段，项目经理确定项目所需的所有资源。在执行阶段，必须获取资源并将它们分配到相应的任务中。项目任务直接影响所需的资源。\n\
  \n**示例：** 在一个正在进行的打印项目中，项目赞助人想要更改为更高质量的纸张。项目经理需要增加项目预算，以考虑到更高质量纸张增加的成本。此外，项目进度可能会延迟，以便安排订单和接收新纸张。\n\
  \n**示例：** 一名团队成员辞职，项目经理必须找到替代者。如果替补成员的薪资高于原团队成员，项目经理可能需要增加预算。如果替补成员的工作速度与原团队成员不同，项目进度也可能需要调整，因为新团队成员可能花费更长或更短的时间完成分配的任务。\n\
  \n项目资源的变化最可能影响时间和成本。\n\n![Image](img/00004.jpeg)\n\n## 需求约束\n\n需求是项目最终产品或服务中必须存在的条件。需求也是约束，因为它们直接影响项目范围，并决定了最终产品的分级标准。如前所述，需求描述了预期的结果，而质量是衡量你是否交付了该结果的标准。需求使用关键绩效指标（KPI）和验收标准进行评估。\n\
  \n***\n\n**注意**\n\n参见 `第 12 章` 获取有关使用 `KPIs` 评估需求的详情。\n\n***\n\n在规划阶段，项目经理从项目赞助人和利益相关者处收集需求，记录需求，然后与项目赞助人协商以确定哪些需求将包含项目中。在敏捷框架中，此阶段包括收集用户故事。然后使用这些需求来定义项目范围。如果需求发生变化，必须更改项目范围。此外，可能需要更改项目预算和项目进度。在某些情况下，需求无法实现，或者必须推迟到产品的未来版本。\n\
  \n***\n\n**注意**\n\n有关与敏捷团队一起开发的更多信息，请参见 `第 6 章`、`敏捷方法`。\n\n***\n\n**示例：** 一个州政府机构在检查建筑项目期间指定了多项需求。项目经理需要更改项目范围以包含这些需求，向项目添加任何必要的任务来处理这些需求，并为这些任务分配资源。最后，项目经理需要调整项目预算，以包含满足需求而产生的任何新成本。\n\
  \n项目需求的变化通常影响项目的范围、时间和成本。\n\n![Image](img/00004.jpeg)\n\n## 项目影响\n\n`影响` 是可能影响项目约束的项目事件或条件。项目经理必须能够识别影响是否即将发生，采取适当措施防止影响或调整项目约束以考虑该影响。常见的影响包括变更请求、范围蔓延、约束重新排序、约束之间的相互作用、利益相关者/赞助人/管理以及其他项目。\n\
  \n![Image](img/00004.jpeg)\n\n### 变更请求\n\n`变更请求` 以某种方式修改项目的正式提案。变更请求包括对交付物、基线、程序或文档的更改。无论更改项目的哪个方面，任何获批准的更改将至少影响三重约束中的之一。\n\
  \n所有变更请求必须提交给变更控制委员会并经过正式的变更控制流程。变更控制委员会审查变更并决定接受还是拒绝。在批准变更请求之前，变更控制委员会应彻底分析为适应该更改而可能需要的任何项目变更。如果变更请求获得批准，项目经理将需要更改项目范围、预算和/或进度以处理已批准的更改。\n\
  \n***\n\n**注意**\n\n变更控制流程在 `第 11 章` 中详细讨论。\n\n***\n\n**示例：** 在一个厨房改造项目中，房屋主决定想安装花岗岩而不是层板台面。由于房屋主是项目赞助人，项目经理需要解释拟议的台面材料更改如何影响项目进度和预算。如果房屋主批准了这些时间和预算变更，项目经理需要采取必要的步骤实施已批准的更改，包括订购花岗岩、取消层板、租赁花岗岩锯、重新安排漆工时间、给房屋主一个新的入住日期，并对材料和人工成本的差额计费。\n\
  \n变更请求通常影响所有的三重约束：范围、时间和成本。无论什么类型的项目，项目经理都需要充分分析任何更改，以确定抵消这些变化的方法。例如，项目成本变化的平衡措施可能包括范围、时间、质量和/资源的减少。项目赞助人最能确定当项目成本受影响时应该发生哪些变化。\n\
  \n![Image](img/00004.jpeg)\n\n### 范围蔓延\n\n`范围蔓延` 指在不调整其他项目约束（包括成本、时间和资源）的情况下更改项目范围的情况。在大多数情况下，这种事件发生在规划阶段没有妥善记录项目范围和需求，而且在大型项目中更有可能发生。将范围蔓延视为跳过正式变更控制流程的项目更改，因此在没有经过批准调整的情况下影响了项目约束。\n\
  \n\n\n\n\n示例：一个应用程序开发项目受新颁布政府法规的影响。遗憾的是，所需的更改被添加到项目需求中，但未没有同步调整相应的项目约束，包括范围、进度和预算。这些更改导致项目耗时比原计划长，成本也更高。\n\
  \n范围蔓延影响所有三个三重约束：范围、时间和成本。除了记录项目的初始需求外，防止范围蔓延影响底线的最佳方法是制定——并执行！第 1 章中描述的变更管理计划和沟通计划。\n\
  \n### 注意事项\n项目变更的方面和变更控制过程将在第 11 章中详细讨论。\n\n### 范围蔓延\n范围蔓延发生在客户改变主意并在不通过变更控制过程的情况下进行项目更改时。当项目拥有自主工作的团队成员时，这可能是一个严重问题。项目经理必须确保团队成员理解，无论大小的变化都必须遵循变更控制过程。范围蔓延可能发生在任何项目中，当项目团队成员在不同地点工作时，这个问题尤为突出。\n\
  \n示例：ABC 公司聘请 Designs for You, LLC 重新设计 ABC 公司网站。Designs for You, LLC 与 Jane Smith\
  \ 合同编写代码，与 David Jones 合同设计图形。Jane 和 David 只在虚拟项目会议期间互动。项目启动一个月后，ABC 公司管理层决定其中一个新页面的图形不令人满意，尽管它完全符合合同规定。ABC\
  \ 公司就该图形联系 David Jones，David 按照要求实施了更改。然而，该更改并未根据变更管理计划中记录的变更控制过程获得正式批准。当 David\
  \ 的工作完成时，他向 Designs for You, LLC 开具了所有工作费用，包括图形更改。Designs for You, LLC 的项目经理调整了预算以支付\
  \ David 的额外费用。当完成的图形交付给 Jane Smith 时，她发现图形更改导致了她的代码功能问题。Jane 现在需要调整她的代码，导致预算再次增加以涵盖她的工作费用。如果两名人员的较高成本超过了预算储备，Designs\
  \ for You, LLC 将需要 1) 吸收预算超支，或 2) 与 ABC 公司合作增加预算。在项目后期增加预算不太可能获得批准。为了防止这种包含未经授权的图形和代码更改的范围蔓延，项目经理本应向所有团队成员解释，所有更改必须通过正式的变更控制过程，即使变更请求直接来自项目赞助者或客户。\n\
  \n![Image](img/00004.jpeg)\n\n### 约束重新优先级排序\n约束重新优先级排序发生在一个受特定约束限制的项目必须将优先级转移到另一个约束时。当发生重新优先级排序时，项目经理必须全面评估所有项目约束，以记录对它们产生的任何影响。然后，项目经理将需要向项目赞助者解释这种重新优先级排序将对项目产生什么影响。\n\
  \n如果项目的成本估计不准确，需要更多资金来制作交付物，则成本成为项目的主要约束。为了满足原始范围，需要增加项目预算并获得项目赞助者的批准。如果预算增加，则需要调整另一个项目约束以减轻成本约束的压力；项目可能需要放弃某项需求或更改质量标准。\n\
  \n示例：当出版社正在进行新书项目时，竞争对手宣布计划一本主题相似但发布日期更早的书。由于项目的最初优先级是成本最小化，因此仅聘请了一位作者和编辑。然而，出版社现在想提前书籍进度，以赶在竞争对手的书出版之前。为了赶上日期，出版社可能需要增加预算以聘用额外资源，或为现有资源提供激励以加快工作。另一个选项是更改书籍的范围，例如缩短内容。然而，这种更改可能会影响质量。无论做出哪种选择，项目经理都必须调整所有受影响的项目约束。\n\
  \n约束重新优先级排序影响所有三个三重约束——范围、时间和成本——最终效果取决于哪个约束被优先考虑。\n\n![Image](img/00004.jpeg)\n\
  \n### 约束之间的相互作用\n项目约束在整个生命周期内直接相互作用。在规划阶段，项目经理使用收集的约束信息来创建项目文档、预算、进度和范围。\n\n重要的是，其他约束实际上可以影响一个或多个三重约束（范围、时间和成本）。资源直接影响项目成本。质量、需求和交付物直接影响项目范围。环境直接影响项目进和成本。此类更改的结果可能是负面的，也可能是正面的。假设有两个新团队成员加入一个引擎开发项目。虽然这种人员变动可能会增加项目预算，但也很有可能缩短项目进度。\n\
  \n示例：一名关键项目团队成员在项目进行一半时请病假。项目经理评估了对项目进度的影响，然后向赞助者或关键利益相关者提出可能的行动方案。建议可能包括获得更多资金聘用另一名团队成员，或延长项目进度以考虑到进展缓慢。这两个选项以不同的方式影响项目的约束：\n\
  \n![Image](img/00003.jpeg) 如果项目将保持人员不足但进度可以延长，项目经理必须将缺失团队成员的工作重新分配给其他资源，并调整任务的开始/完成日期、依赖关系和关键路径。项目里程碑必须重新安排。\n\
  \n![Image](img/00003.jpeg) 如果必须遵循原始进度但提供更多资金，项目经理应评估聘用新资源的成本、如果必须培训资源对进度的影响，以及无法聘到足够技能的资源对交付物质量的影响。\n\
  \n项目经理需要理解所有约束之间的关系，并在其他约束发生时相应调整项目范围、预算或进度。\n\n![Image](img/00004.jpeg)\n\n###\
  \ 利益相关者、赞助者和管理层的影响\n利益相关者、赞助者和管理层也可以影响项目约束。利益相关者和赞助者参与项目需求的设定，这直接影响项目范围。赞助者还建立项目预算并影响项目进度。\n\
  \n管理层对项目进度的影响通常大于其他约束，特别是当组织结构是职能型而非项目型时。\n\n### 注意事项\n对于职能型和项目型团队结构的差异，请参见第 2 章。\n\
  \n\n\n\n\n**示例：** 一位关键利益相关者要求项目经理对交付物进行重大变更。该利益相关者未就此请求咨询项目发起人。项目经理要求该利益相关者填写一份变更请求，以记录拟议的修订并评估变更的影响。只有在此之后，项目经理才按照变更管理计划中详细说明的变更控制程序向发起人寻求批准。\n\
  \n与其他影响因素一样，利益相关者、赞助人和管理层可能会影响所有的三重约束：范围、时间和成本。\n\n## 来自其他项目的影响\n\n其他项目可能会影响项目约束；例如，通过竞争共享资源的使用。项目经理可能需要与其他项目经理以及项目管理办公室（PMO，如果有的话）进行谈判，以便在需要时获得资源。\n\
  \n**示例：** 两个项目在各自的研究部分中都需要访问同一个实验室。在项目规划期间，项目管理办公室发现这两个项目计划在同一个两周内使用该实验室。PMO 与两个项目的项目经理合作，提出了三个方案：1)\
  \ 找到一种同时共享实验室的方法；2) 允许每个团队获得半天的实验室访问权限，其中一个项目团队在上午，另一个团队在下午；或者 3) 将实验室的主要访问权交给优先级较高的项目，并将低优先级项目的实验室访问推迟到以后。前两个选择都需要对两个项目进行进度调整，而第三个选择仅需要对一个项目进行进度调整。在充分评估这些方案并对如何进行达成决定后，项目经理可以进行必要的调整。在这种情况下，没有必要遵循变更控制流程，因为问题是在规划阶段、在项目执行之前发现的。\n\
  \n在规划阶段，项目经理应该记录任何将与其他项目共享的资源。项目之间的冲突应由项目经理进行谈判。如果他们无法解决问题，则应由 PMO 或高层管理做出决定。在较大的公司中，公司政策可能会规定此类问题的解决方式。\n\
