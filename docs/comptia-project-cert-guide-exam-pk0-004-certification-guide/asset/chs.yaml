  \n项目利益相关者管理\n\n## 复习题\n\n这些问题的答案出现在附录 A。需要更多示例考试题练习，请使用在线 Pearson Test Prep 练习测试软件。\n\
  \n**1.** 下列哪项`不是`项目？\n\n**a.** 部署一台新的 Web 服务器\n\n**b.** 构建一个新的客户应用程序\n\n**c.** 安装最新的操作系统和应用程序更新\n\
  \n**d.** 设计一种新的电力发动机\n\n**2.** 你的公司目前正在进行以下项目：\n\n![Image](img/00003.jpeg) 为单个部门部署新的文件服务器。\n\
  \n![Image](img/00003.jpeg) 编写 IT 变更管理流程。\n\n![Image](img/00003.jpeg) 作为一楼楼装修的一部分安装地板。\n\
  \n![Image](img/00003.jpeg) 作为一楼楼装修的一部分粉刷墙壁。\n\n![Image](img/00003.jpeg) 作为一楼楼装修的一部分购买新的配件和办公家具。\n\
  \n![Image](img/00003.jpeg) 更新所有客户端和服务器计算机上的防病毒和反恶意软件特征。\n\n对于这些项目，下列哪种陈述`不`正确？\n\
  \n**a.** 这三个装修项目是一个计划组的一部分。\n\n**b.** 这三个装修项目是一个项目组合的一部分。\n\n**c.** 更新防病毒和反恶意软件特征不是一个项目。\n\
  \n**d.** 以上所有项都是项目组合的一部分。\n\n**3.** 你已经完成了一个新项目的项目章程和业务理由。你正处于哪个阶段？\n\n**a.** 规划\n\
  \n**b.** 启动\n\n**c.** 执行\n\n**4.** 下列哪些项是在规划阶段期间创建的？\n\n**a.** 预算和进度\n\n**b.** 高级需求和风险\n\
  \n**c.** 交付物\n\n**d.** 变更\n\n**5.** 对于你正在管理的一个项目，你记录了在审查交付物后出现的问题。你识别出了新风险。你正参与于哪个阶段？\n\
  \n**a.** 执行\n\n**b.** 监控与控制\n\n**c.** 规划\n\n**6.** 你正在为一个研究新产品线的项目记录教训总结。你释放了项目资源并获得了项目签验收。你正在完成哪个阶段？\n\
  \n**a.** 启动\n\n**b.** 规划\n\n**c.** 收尾\n\n**d.** 执行 \n\n**7.** 在哪个项目阶段进行定量和定性风险分析？\n\
  \n**a.** 规划 \n\n**b.** 执行\n\n**c.** 启动\n\n**d.** 监控与控制 \n\n**8.** 下列哪些项在项目的执行阶段期间发生？\n\
  \n**a.** 执行变更控制并验证范围\n\n**b.** 开发项目章程并识别利益相关者\n\n**c.** 估算成本并定义范围\n\n**d.** 获取项目团队并执行质量保证\
  \ \n\n**9.** 下列哪项是项目时间管理的一部分？\n\n**a.** 安排活动\n\n**b.** 创建工作分解结构\n\n**c.** 估算成本\n\
  \n**d.** 识别风险 \n\n**10.** 在哪个项目阶段，你应该确保项目团队接受了适当的培训？\n\n**a.** 规划\n\n**b.** 执行\n\
  \n**c.** 启动\n\n**d.** 监控与控制 \n\n# 第 2 章 项目角色、职责与团队结构\n\n本章涵盖以下主题：\n\n![Image](img/00003.jpeg)\
  \ **理解项目角色和职责：** 项目赞助者、项目经理、项目协调员、利益相关者、进度、项目团队和项目办公室 (PMO)。\n\n![Image](img/00003.jpeg)\
  \ **理解项目团队结构：** 职能型、矩阵型和项目型团队结构。\n\n现在了每个组织都有项目、项目是什么以及其基本周期，现在是学习项目角色、职责和团队结构了。项目角色\
  \ 是项目组成的工作职责。每个项目角色都有特定的责任需要完成，以确保项目成功。项目进一步受到组织结构的影响，这将控制资源的可用性和项目执行的方式。\n\n本章涵盖\
  \ Project+ 考试的目标：\n\n**1.2** 分类项目角色和职责。\n\n**1.5** 识别常见的项目团队组织结构。\n\n* * *\n\n注意：CompTIA\
