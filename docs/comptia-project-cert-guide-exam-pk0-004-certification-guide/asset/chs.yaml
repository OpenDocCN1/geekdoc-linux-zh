  **b.** 执行门审查。\n**c.** 更新风险注册表。\n**d.** 执行项目审计。\n\n**2.** 下面哪种通信触发因素可能需要与项目供应商进行沟通？\n\
  \n**a.** 审计\n**b.** 采购变更请求\n**c.** 预算变更请求\n**d.** 风险注册表更新\n\n**3.** 对于你公司目前的项目，项目经理发现创建项目交付物的时间明显长于预估。在与项目赞助人讨论此问题后，招聘了一位新团队成员。这些行动最可能导致哪种项目通信触发？\n\
  \n**a.** 门审查\n**b.** 审计\n**c.** 相关利益者变更\n**d.** 预算变更\n\n**4.** 下面哪项是相关利益者变化的例子？\n\
  \n**a.** 新项目需求\n**b.** 采购成本增加\n**c.** 门审查\n**d.** 里碑完成\n\n**5.** 对于一个新的打印项目，项目赞助人要求升级为质量更高的乙烯基材料，但目前没有库存。你提交了变更请求。在将变更通知项目团队之前，哪个项目实体必须批准此变更？\n\
  \n**a.** 项目经理\n**b.** 项目相关利益者\n**c.** 项目赞助人\n**d.** 变更控制委员会 (CCB)\n\n**6.** 当采购合同的金额高于预估时，会发生哪种通信触发？\n\
  \n**a.** 进度变更\n**b.** 相关利益者变更\n**c.** 预算变更\n**d.** 资源变更\n\n**7.** 你是一个新建筑项目的项目经理。在项目规划期间，你了解到项目赞助人拥有的一台挖掘机可以用于项目。然而，在需要挖掘机的前二天，你发现它正在维修，你必须租用一台挖掘机。挖掘机租赁已获批准。哪些通信触发将受到影响？（选择两个。）\n\
  \n**a.** 资源变更\n**b.** 进度变更\n**c.** 预算变更\n**d.** 相关利益者变更\n\n**8.** 对于与任务 `C2` 有开始到完成\
  \ (SF) 关系的任务 `C1` 的完成，哪些项目实体最应该接收有关完成的通知？\n\n**a.** 负责任务 `C2` 的项目团队成员\n**b.** 负责任务\
  \ `C1` 的项目团队成员\n**c.** 项目相关利益者\n**d.** 项目赞助人\n\n**9.** 下面哪项描述了门审查？\n\n**a.** 项目计划中的一个重大事件，但实际上没有持续时间\n\
  **b.** 为了决定项目是否继续而召开的会议\n**c.** 验证是否符合项目指南以及验证项目执行情况的过程\n**d.** 项目中可能导致项目中断的事件\n\
  \n**10.** 哪种通信触发经常会导致业务连续性响应？\n\n**a.** 里碑\n**b.** 审计\n**c.** 事件\n**d.** 门审查\n\n\
  ## 第 11 章变更控制\n\n本章涵盖了以下主题：\n\n![Image](img/00003.jpeg) **理解项目变更控制流程：** 识别并记录变更、评估其影响和合理性、识别批准权限并获得批准、实施变更、验证变更并检查项目质量、更新相关文档、沟通变更以及制定回滚计划。\n\
  \n![Image](img/00003.jpeg) **理解项目变更类型：** 进度变更、预算变更、风险事件、需求变更、质量变更、资源变更和范围变更。\n\n\
  ![Image](img/00003.jpeg) **理解组织变更：** 业务合并/收购、业务拆分、业务流程变更、内部重组、搬迁和外包。\n\n当项目团队成员、利益者或赞助人请求对项目的某些记录方面（如范围、进度或预算）进行修改时，就会发生项目变更。变更是不可避免的，且由于多种原因。当变更请求获得批准时，它会改变项目的进程，从而使得在范围、进度和预算限制内工作更具挑战性。因此，项目团队和利益者遵循正式的变更控制流程很重要。\n\
  \n本章详细解释了变更控制流程、项目变更类型以及影响项目的组织变更。变更以及正式变更控制发生在项目的监控和控制阶段。\n\n本章涵盖了 Project+ 考试的目标：\n\
  \n**3.4** 根据场景中使用项目流程。\n\n**3.5** 识别组织变更类型。\n\n***\n\n### 注意\n\n提示：CompTIA 在 Project+\
