  \n**a.** 关键路径\n\n**b.** 资源日历\n\n**c.** 成本基线\n\n**d.** 进度基线\n\n## 第 5 章：人员与资源管理\n\
  \n本章涵盖了以下内容：\n\n![Image](img/00003.jpeg) **理解人员管理：** 团队建设、信任建立、团队选择、技能组、远程与内部人员、沟通问题和冲突解决。\n\
  \n![Image](img/00003.jpeg) **理解资源管理：** 共享资源与专用资源；资源分配、短缺；总体资源；项目依赖关系和资源竞争。\n\n项目使用人员和其他资源。在项目规划阶段，项目经理应该识别人员和其他资源。例如，一个建筑项目可能包括自运车等设备，以及水泥和电气布线等物料。即使资源中只有某一个没有在正确的时间到位，整个项目都可能被推迟。\n\
  \n本章涵盖了 Project+ 的以下目标：\n\n**1.8** 解释人力资源、物理资源和人员管理的重要性。\n\n**注意：** 根据组织和项目的不同，人员可能被也视为资源的一部分。对于\
  \ Project+ 考试，CompTIA 将人员视为一种资源。然而，即使项目的人员被计入项目资源，他们仍然是通过人员管理进行管理的，而不是资源管理。本章首先关注人员管理，然后讨论其他资源。\n\
  \n\n\n\n\n# 1. 下述哪个陈描述了“风暴期（storming）”？\n\na. 团队见面并了解他们将如何在项目中合作。\nb. 团队开始共同工作。\n\
  c. 团队开始对项目做出决策。\nd. 团队开始作为一个整体进行工作。\n\n# 2. 哪个术语用于根据其组织职位或知识和技能集从开始就分配到项目的人员？\n\n\
  a. 获取资源 (acquired resources)\nb. 预指资源 (preassigned resources)\nc. 协商资源 (negotiated\
  \ resources)\nd. 闲置资源 (benched resources)\n\n# 3. 哪种冲突解决技术涉及共识而非差异？\n\na. 平滑 (smoothing)\n\
  b. 强制 (forcing)\nc. 妥协 (compromising)\nd. 对峙 (confronting)\n\n# 4. 解决长期冲突时，你应该将哪种冲突解决技术作为最后手段？\n\
  \na. 妥协 (compromising)\nb. 对峙 (confronting)\nc. 避免 (avoiding)\nd. 强制 (forcing)\n\
  \n# 5. `shared resources`（共享资源）一词描述的是什么\n\na. 在多个项目之间共同使用\nb. 分配给单个项目\nc. 包括内部和远程人员\n\
  d. 分配给项目但尚未分配到特定的活动或任务\n\n# 6. 下列哪个条件最可能导致项目延迟？\n\na. 超额分配 (overallocation)\nb.\
  \ 资源短缺 (resource shortage)\nc. 共享资源 (shared resources)\nd. 闲置资源 (bench resources)\n\
  \n# 7. 项目经理应该做什么来确保项目不使用低质量资源？\n\na. 仅使用内部人员完成项目任务\nb. 仅使用专用资源完成项目任务\nc. 咨询专家以确保资源规范列在项目文档中\n\
  d. 将所有被认为低质量的资源闲置\n\n# 8. 哪个术语描述项目项目可用但未被使用的资源？\n\na. 共享资源 (shared resources)\n\
  b. 闲置资源 (idle resources)\nc. 内部资源 (in-house resources)\nd. 闲置资源 (benched resources)\n\
  \n# 9. 当资源被多个进度重叠的项目使用时，下列哪是一个问题？\n\na. 超额分配 (overallocation)\nb. 资源竞争 (resource\
  \ contention)\nc. 闲置资源 (benched resources)\nd. 远程资源 (remote resources)\n\n# 10.\
  \ 下列哪个陈是错误的？\n\na. 项目间的依赖发生在一个项目必须等待另一个项目完成第一个项目所需的结果。\nb. 当项目共享资源时，每个项目都依赖其他项目及时释放资源，以确保所有项目的成功。\n\
  c. 各种因素可能帮助决定哪个项目获得竞争资源。\nd. 无论组织结构如何，项目经理都必须决定哪个项目优先。\n\n### 基础主题\n\n## 人员管理\n\n\
  人员管理确保项目团队的成员或对项目有利益的个人得到识别和管理。正如在第 2 章中讨论的“项目角色、职责和团队结构”，项目的规划阶段包括识别所有这些利益相关者和团队成员。利益相关者可以影响项目的结果，但通常不实际完成项目工作。项目团队成员是拥有完成项目所需专业知识的个人，他们共同开展项目活动。项目经理负责确保项目团队能够良好合作。\n\
  \n项目经理必须具备管理人员的相关技能，包括团队建设和信任建立。团队成员的技能集影响团队选择和表现，团队成员的位置（远程和/或内部）影响团队的管理方式。项目经理还处理团队的人员移除或替换，并能够解决沟通问题和冲突。\n\
  \n![Image](img/00004.jpeg)\n\n### 团队建设与信任建立\n\n项目经理必须组建一个胜任的项目团队以完成项目活动。某些项目团队成员可能被提前选择并分配到项目，特别是完成项目所需的特定技能的人员。在其他情况下，项目经理可能需要通过谈判为团队获取员工。这些谈判可能涉及职能经理、其他项目团队和项目经理、外部组织和/或项目管理办公室（PMO）。最后，可能需要招聘团队成员或向第三方外包。无论团队如何组建，项目经理都必须在团队建设过程中帮助团队。\n\
  \n团队建设是一个永无的过程。即使在团队成熟后，团队建设也应该定期更新或继续。项目经理应该与团队成员合作，确保团队通过塔克曼模型（Tuckman ladder）确定的团队建设阶段：\n\
  \n![Image](img/00003.jpeg) **形成期 (Forming):** 团队见面并了解他们将如何在项目中合作。在这个阶段，团队成员可能还没有开放去信任彼此。在这个阶段，团队成员更多地关注任务而非沟通。\n\
  \n![Image](img/00003.jpeg) **风暴期 (Storming):** 团队开始对项目做出决策。因为这个阶段需要协作和冲突解决，团队成员应该对不同的想法和观点保持开放。\n\
  \n![Image](img/00003.jpeg) **规范期 (Norming):** 团队开始共同工作，团队成员调整自己的工作来支持团队。在这个阶段，团队成员开始信任彼此。\n\
  \n![Image](img/00003.jpeg) **执行期 (Performing):** 团队开始作为一个整体进行工作。团队成员相互依赖并轻松地解决问题。\n\
  \n![Image](img/00003.jpeg) **结束期 (Adjourning):** 团队完成项目。一旦项目关闭，团队成员将被释放到其他项目。\n\n\
  在某些情况下，团队可能会跳过这些阶段之一。如果发生某些事件（例如向团队添加新成员），团队可能需要返回之前的阶段。项目经理负责帮助项目团队推进团队建设阶段。\n\n\
  ![Image](img/00004.jpeg)\n\n### 团队选择与技能集\n\n项目团队可能通过预指、协商或获取来选择：\n\n![Image](img/00003.jpeg)\
  \ **预指资源 (Preassigned resources):** 根据组织中的职位和/或知识和技能集从开始分配到项目的人员。\n\n![Image](img/00003.jpeg)\
  \ **协商资源 (Negotiated resources):** 项目经理希望进入项目团队并必须与其他经理协商以获取的人员。\n\n![Image](img/00003.jpeg)\
  \ **获取的资源 (Acquired resources):** 来自外部来源的人员，如顾问和分包商。\n\n无论如何获取资源，项目经理必须理解每个团队成员的技能集。根据技能集，团队成员将被分配到项目中的某些活动或任务中。\n\
  \n\n\n\n\n尽管并非所有的活动或任务都可以根据工作率进行拆分，但团队成员通常可以为项目经理提供完成某项任务所需时间的估计。此类估算对于制定`资源日历`的最优判断至关重要，该日历列出了所有资源以及他们投入项目的日期和时间。由于工作率可能存在差异，某人完成某些工作的速度可能比另一个人快得多。项目经理必须理解并记录这些细节以及技能集信息，以确定人员资源的最优利用。\n\
  \n对于所有人员资源，项目经理需要记录以下信息：\n\n![Image](img/00003.jpeg) **可用性：** 指每个资源何时可以实际执行工作。\n\
  \n![Image](img/00003.jpeg) **成本：** 指定支付给该资源的费率。\n\n![Image](img/00003.jpeg) **经验：**\
  \ 记录资源的工作背景。\n\n![Image](img/00003.jpeg) **能力：** 记录资源的胜任能力。\n\n![Image](img/00003.jpeg)\
  \ **知识：** 描述资源对客户、类似项目以及项目环境的理解。\n\n![Image](img/00003.jpeg) **态度：** 记录资源对项目和团队的感受，重点关注该人员是否能够在团队环境中良好工作。\n\
  \n![Image](img/00003.jpeg) **国际因素：** 列出资源的所在地、时区、通信能力以及任何项目团队其他成员可能不了解的国际习俗/规范。\n\
  \n记录所有这些信息有助于项目经理获得一个能够良好合作以完成项目的团队。一旦招募了项目团队，项目经理应确保为团队成员提供适当的培训（如果需要），并将项目团队成员分配到适当的活动或任务中。\n\
  \n## 远程与内部人员\n\n项目经理在招募项目团队成员时，可能需要同时考虑远程和内部资源。管理一个在同一地点工作的项目团队比管理一个远程或虚拟项目团队要容易得多。然而，无论无论何种情况，项目经理都必须依靠其人际关系技巧和生产力工具来帮助团队高效地工作。\n\
  \n在`虚拟团队`中，团队的所有或部分成员远程工作。虚拟团队共同努力以实现项目目标，但几乎或没有面对面的互动。如今的通信能力（包括电子邮件、会议技术和社交媒体）可以使管理虚拟团队变得更容易。\n\
  \n使用虚拟团队的缺点包括沟通问题、孤立感、协作困难和技术成本。项目经理应该意识到这些缺点，并努力帮助促进团队沟通。处理冲突的方法也同样。最后，如果团队成员是全球性的，则可能需要探索文化差异。\n\
  \n## 人员撤换/替换\n\n![Image](img/00004.jpeg)\n\n无论项目经理计划得多么完美，人员方面都可能出现意外问题，导致需要移除和/或替换项目团队成员。这就是项目经理必须完全理解每个团队成员的技能集和工作率的原因之一。如果团队成员被简单移除或替换，则分配给该资源的工作需要分配给另一个资源。当团队成员被移除或替换时，项目经理必须根据此变化调整项目进度和预算。\n\
  \n**示例：** 一位正在参与两个项目的成员辞职了，替换该人的技能集需要两个独立的资源。招聘这些资源可能会导致两个项目的成本增加。然而，由于现在有两个资源可用，工作率实际上可能会增加，这意味着分配给这些资源的项目任务将更快地完成。因此，虽然两个项目的预算可能会增加，但项目经理可能会看到项目进度的改进。\n\
  \n项目经理应向整个项目团队和项目利益者告知团队成员的变化。在团队成员变更需要调整项目预算和进度后，项目经理还应向相应的利益者分发相关的高级文档。\n\n![Image](img/00004.jpeg)\n\
  \n### 沟通问题\n\n由于项目团队成员和/或利益者之间可能会出现沟通问题，项目经理应向团队成员提供项目规划阶段开发的沟通计划。该计划解释了如何、何时以及由谁管理和分配有关项目的信息。团队成员应将此计划作为所有沟通的指南。\n\
  \n即使项目有完善沟通计划，可能出现沟通问题。许多项目问题实际上是沟通不畅的结果，这会导致项目问题，如预期差异、对项目变化的惊讶等。项目经理必须帮助团队成员和利益者解决此类问题。\n\
  \n由于项目经理最终负责管理项目沟通，因此理解以下沟通问题及其处理方法非常重要：\n\n![Image](img/00003.jpeg) **未能倾听：** 向项目团队成员强调倾听和关注说话者的重要性。\n\
  \n![Image](img/00003.jpeg) **地理问题：** 考虑到团队成员之间存在地理距离，努力举行定期会议，给所有团队成员时间交流状态和任何需要帮助的问题。\n\
  \n![Image](img/00003.jpeg) **文化差异：** 所有团队成员都应为项目提供意见，即使这意味着要向更不积极的成员寻求反馈。团队中的任何小组都应包含来自不同文化的团队成员。\n\
  \n![Image](img/00003.jpeg) **态度和自我意识：** 注意项目团队中的性格强势的人员。如果一个团队成员试图垄断会议时间或规定项目政策，项目经理应介入帮助团队达成共识。\n\
  \n![Image](img/00003.jpeg) **权限或层级问题：** 团队成员可能不愿在小组环境中表达问题，特别是当小组包含具有权威的人员时。项目经理应花时间与每个团队成员私下交流，以便团队成员能够机密地表达任何问题。\n\
  \n![Image](img/00003.jpeg) **书面沟通不佳：** 确保所有沟通都清晰明了。任何为了传播而创建的文本都应由作者以外的人审核，以检查错误或遗漏。\n\
  \n![Image](img/00003.jpeg) **性别偏见：** 所有团队成员无论性别，都必须有机会表达他们的担忧。团队成员绝不因为他们的观点而被轻视，即使这些观点并非团队大多数人的认同。\n\
  \n![Image](img/00003.jpeg) **专注或倾听问题：** 使用团队活动帮助有倾听问题的团队成员。小组技术（如焦点小组使用的方法）可能有助于保持整个团队的参与。\n\
  \n![Image](img/00003.jpeg) **知识不足：** 确保参与项目的所有人员都理解团队使用的所有术语、缩写和其他语言。可能必要准备并分发一份术语表。在某些情况下，知识不足的人员可能需要在欠板领域接受正式培训。\n\
  \n\n\n\n\n![Image](img/00003.jpeg) **关系：** 注意团队人力资源中是否存在任何小圈子、团体或友谊，并向团队成员强调保持客观的必要性。关系会影响决策并导致群体思维——小组以一种抑制个人创造力或责任感的方式做出决策。\n\
  \n最终，项目经理负责确保所有沟通性问题都得到解决，这可能需要寻求具有有效沟通技巧的人的帮助。\n\n### 冲突解决\n\n![Image](img/00004.jpeg)\n\
  \n项目中的冲突不是“是否”会发生的问题，而是“何时”发生的问题。冲突的常见来源包括资源稀缺、进度问题和工作风格。当冲突发生时，项目经理负责与团队成员和利益相关者合作解决问题，无论其来源如何。\n\
  \n冲突解决技术包括缓解、强制、妥协、对抗、回避和谈判。接下来的章节将详细讨论这些技术。\n\n### 缓解（Smoothing）\n\n缓解也称为`调解`，强调共识而非差异。通过这种技术，项目经理帮助团队成员配合他人的顾虑。缓解在以下情况下可能是合适的：\n\
  \n![Image](img/00003.jpeg) 当暂时缓解冲突或赢得时间很重要时\n\n![Image](img/00003.jpeg) 当该问题对某一个人比对另一个人更重要时\n\
  \n![Image](img/00003.jpeg) 当其中一方是错的时\n\n![Image](img/00003.jpeg) 当持续冲突会对项目产生不利影响时\n\
  \n在某些情况下，项目经理可能会选择缓解来保护更重要的利益，同时放弃一些不重要的利益。缓解为团队成员提供了一个从不同角度重新评估状况的机会。\n\n仅在需要时使用缓解；它不应作为解决所有冲突的首选方案。冲突双方可能会试图利用缓解，且某些团队成员可能不喜欢使用缓解来解决冲突。此外，缓解可能会对团队对项目经理应对激进冲突情况能力的信心产生负面影响。最后，缓解使得很难过渡到未来的双赢也称为`指示`或`竞争`，尽管团队中存在其他观点，但仍坚持某一种观点。它通常涉及抵抗另一团队成员的行为。强制在以下情况下可能是合适的：\n\
  \n![Image](img/00003.jpeg) 当强制性较弱的方法不起作用或无效时\n\n![Image](img/00003.jpeg) 当团队面临压力，要求追求一个项目经理认为错误的特定观点时\n\
  \n![Image](img/00003.jpeg) 当需要快速解决且使用武力是合理的时\n\n![Image](img/00003.jpeg) 作为解决长期冲突的最后手段\n\
  \n项目经理有时使用强制手段来为冲突提供快速解决方案。当用坚决的抵制作为对侵略性或敌意的回应时，强制会增加尊重。\n\n强制可能会对项目经理与对手的关系产生负面影响。此外，它可能导致对手以同样的方式做出反应。通过这种方法，对方立场的优点会被忽略。采取这种方法需要大量的能量。\n\
  \n### 妥协（Compromising）\n\n通过妥协，也称为`调和`，团队通过部分解决冲突来寻找让所有方都满意的解决方案。妥协在以下情况下可能是合适的：\n\
  \n![Image](img/00003.jpeg) 当目标仅具有中等重要性且不值得使用其他方法时\n\n![Image](img/00003.jpeg) 为复杂问题达成临时解决时\n\
  \n![Image](img/00003.jpeg) 为重要问题达成权宜之计时\n\n![Image](img/00003.jpeg) 当涉及双方没有高水平的互信时\n\
  \n![Image](img/00003.jpeg) 当协作或强制不起作用时\n\n妥协比其他冲突解决技术更快，在时间是考虑因素时可能是实用的。它可以提供一个临时解决方案，直到找到双赢解决方案。妥协可以降低冲突情况下的紧张水平和压力。\n\
  \n在双输输也称为`解决问题`，团队利用多个观点来达成共识。通过这种方法，团队努力共同为手头的问题寻找双赢解决方案。这种方法的目标是找到一个互利的结果。对抗在以下情况下可能是合适的：\n\
  \n![Image](img/00003.jpeg) 当共识和承诺很重要时\n\n![Image](img/00003.jpeg) 在协作环境中时\n\n![Image](img/00003.jpeg)\
  \ 当多个利益相关者的利益需要被解决时\n\n![Image](img/00003.jpeg) 此时存在高水平的信任时\n\n![Image](img/00003.jpeg)\
  \ 当长期关系很重要时\n\n![Image](img/00003.jpeg) 当涉及敌意时\n\n![Image](img/00003.jpeg) 当团队需要分担责任时\n\
  \n对抗通常会导致解决实际问题，同时增强互信。它还为未来帮助实现有效协作奠定了基础。使用这种技术的项目经理通常被视为良好的谈判者。这种冲突解决方法通常比大多数其他方法产生的压力更小。\n\
  \n在对抗冲突时，所有方必须致力于找到双方接受的解决方案；因此，这种冲突解决方法比其他方法需要更多精力和时间。如果时间至关重要，对抗是不行的，因为双赢解决方案可能显而易见。如果团队内部信任受到损害，在重新建立信任之前，无法使用这种方法。\n\
  \n### 回避（Avoiding）\n\n回避也称为`退出`，将问题推迟，直到项目经理准备得更充分或其他方可以解决问题。这种技术通常涉及避开问题。回避在以下情况下可能是合适的：\n\
  \n![Image](img/00003.jpeg) 当问题微不足道时\n\n![Image](img/00003.jpeg) 当由于时间限制直接处理问题不切实际时\n\
  \n![Image](img/00003.jpeg) 当需要更多信息来做决定时\n\n![Image](img/00003.jpeg) 当不是处理该问题的时间或地点时\n\
  \n![Image](img/00003.jpeg) 当解决问题需要不切的努力时\n\n![Image](img/00003.jpeg) 当讨论可能导致敌意时\n\
  \n![Image](img/00003.jpeg) 当需要另一方的参与时\n\n回避通常被用于推迟决定，直到有利的条件允许对对立观点进行反击。当冲突是短期的时，退出是一种低压力的方法。它让团队有关注更重要的问题，并允许团队在采取行动之前收集信息。\n\
  \n\n\n\n\n回避问题可能会削弱与项目团队或任何期望采取采取行动的方之间的关系。回避还需要技巧和经验，以防止对项目经理的职位产生负面影响。\n\n###\
  \ 谈判\n\n`谈判` 将两种观点汇集在一起，讨论问题并达成解决方案。谈判技巧包括设定目标和界限、控制情绪、倾听、口头沟通以及理解何时结束谈判。\n\n项目经理使用两类谈判：\n\
  \n- **`竞争性谈判`:** 关注于获得最优交易条件，竞争性谈判主要用于与第三方的合同谈判。如果可能，请避免这种类型的谈判。\n- **`协作性谈判`:**\
  \ 寻求双赢局面，正如面对冲突时一样。协作性谈判旨在建立关系，同时最大限度地减少冲突。\n\n当项目经理没有完整的项目权限时（例如组织采用职能型或矩阵型结构），谈判非常有帮助。\n\
  \n> 注意\n> 有关项目团队结构（项目化型、矩阵型或职能型）的更多信息，请参阅第 2 章。\n\n谈判包括计划、讨论问题、提出解决方案、就权衡进行还价、同意解决方案以及审查决议。但在谈判中要注意以下问题：\n\
  \n- 未能充分准备\n- 给出了不合理的报价\n- 在持久的谈判中忽略了休休息时间\n- 仓促谈判\n- 未能及时离开\n- 未能保持冷静\n\n项目经理可能需要谈判技巧方面的培训。他们必须能够向参与谈判的任何团队成员说明指导方。\n\
  \n## 资源管理\n\n`资源管理` 确保完成项目所需的所有物资都得到识别并妥善管理。在项目的计划阶段，项目经理必须识别所有所需的资源。如果组织不拥有所有必要的资源，任何缺失的资源必须作为采购管理的一部分进行购买或安排。组织拥有的资源必须安排在适当的时间作为项目资源使用。采购必须从计划、执行、控制采购一直管理，直到获得资源并准备就绪后结束采购。应该制定一份资源日历，以显示项目所需的所有资源及其使用时间。\n\
  \n> 注意\n> 在某些项目管理文章中，`项目资源`术语包含了人员资源（如团队成员）。对于节讨论的所有资源问题，请记住该主题也适用于人员资源，但本讨论关注非人员资源。\n\
  \n资源随项目而异。为了编制一份所需资源的完整清单，项目经理可能需要咨询领域专家。\n\n**示例：** 对于建筑项目，资源可能包括设备和物资，如重型机械、工具、混凝土、木材、油漆等。对于在网络中添加新子网的项目，资源可能包括网络设备、布线、软件等。无论组织考虑什么种类型的项目，预先确定所有资源都是重要的。\n\
  \n项目经理必须具备管理共享资源和专用资源的适当技能，包括对资源进行分配、监控和控制以防止资源短缺或过度分配；建立处理低质量资源的程序；以及记录闲置资源。最后，项目经理应该记录项目间的依赖关系和任何资源竞争。\n\
  \n### 共享资源与专用资源\n\n在为项目分配资源时，项目经理必须理解共享资源和专用资源之间的区别：\n\n- **`共享资源`:** 多个项目共同使用。在使用共享资源时，项目经理需要与部门经理或其他项目经理协商资源的可用性。如果存在\
  \ PMO，这种谈判也可能涉及。请记住，组织类型和项目团队结构（项目化型、矩阵型或职能型）会影响资源谈判。\n- **`专用资源`:** 分配给单个项目。在使用专用资源时，项目经理可以完全访问该项目的资源。\n\
  \n> 注意\n> 组织类型和项目团队结构在第 2 章中进行了讨论。\n\n**示例：** 一家建筑公司有两辆自卸车供三个项目共享。为了满足所有三个项目的需求，项目经理需要与资源经理合作安排自卸车的使用计划。低优先级的项目可能必须等到高优先级的项目完成对设备的使用后。如果有足够的资金资源，组织可能会租赁或购买额外的卡车。项目经理将必须共同努力以避免或至少预见调度冲突并做出其他安排。\n\
  \n**示例：** 一个 IT 项目需要访问与另一个部门共享的实验室环境。可能允许项目团队和部门人员同时访问实验室环境，而不会引起资源竞争。然而，如果发生冲突，项目经理将需要与部门主管合作调整进度，为项目团队和部门人员都留出实验室的时间。这些这些示例表明，受资源可用性影响的项目可能会影响项目进度。因此，在创建项目进度基准计划之前，识别这些资源并记录资源日历是重要的。\n\
  \n### 资源分配\n\n在确定了项目的所有必要资源后，项目经理需要在资源日历中列出这些资源，显示每种资源对项目的可用性。对于将购买的资源，项目经理还必须创建采购管理计划（项目管理计划的一部分），然后监控所有采购，以确保它们按计划接收。\n\
  \n> 注意\n> 第 1 章，“项目属性和阶段](part0014.html_ch01)”描述了采购管理计划以及项目管理计划的其他部分。\n\n### 资源短缺与过度分配\n\
  \n\n\n\n\n当项目没有足够的特定资源来完成某项活动或任务时就会发生 `resource shortage`（资源短缺）；而当项目的特定资源过多，导致库存剩余或团队成员空闲时，就会发生\
  \ `resource overallocation`（资源过度分配）。资源短缺通常会影响项目进度，因为在获得更多缺失资源之前，项目活动或任务无法进行。它还会影响项目预算，因为资源是产生成本的。例如，即使缺失的零件可以在当天交付以保持进度，项目预算也必须扩大额度以涵盖任何送运费用。资源过度分配意味着购买或分配的资源超过了需求，通常会导致预算浪费。\n\
  \n项目经理需要咨询专家和技术人员，以确保为项目获取适当的资源。\n\n**示例：** 根据建筑蓝图，电工应该能够估算项目所需的电力资源，例如电线的数量。根据菜单，厨师应该能够估算准备宴会所需的采购食品量。\n\
  \n项目经理不能寄希望于独自完成详细的估算。应该根据需要让其他人员参与，确保所有资源估算尽可能准确。\n\n### 低质量资源\n\n单个资源可能具有若干项特征，这些特征会影响资源整体对项目其他部分的影响。资源\
  \ `attribute`（属性）是不同资源之间会变化的特征。\n\n**示例：** 建筑项目通常使用不同等级的木材和其他资源。如果项目是在建造外室，使用较低等级的资源可能没问题。但如果项目是在地震多发地区建造商业建筑，那么所用资源的质量可能高得多，并可能受当地、州和联邦法规的限制。资源内部的差异也可能随时间而变化。例如，项目赞助者可能在项目早期想要高质量资源，但在后期需要削减预算时，决定允许使用低质量资源。\n\
  \n如果项目对资源有质量要求，则这些要求必须在采购这些产品的任何合同中明确说明。\n\n**示例：** 一公司决定在其现有网络中添加一个新的子网。虽然使用 `Cat\
  \ 5` 网线可以实现预期的网络速度，但公司可能会指定更高类别，如 `Cat 6e` 或 `Cat 7`，以确保网络未来不会因为性能缓慢而需要升级。如果项目预算充足，甚至可能指定光纤缆。\n\
  \n项目经理应该咨询专家，以确保资源规格包含符合项目指南和任何管理法规的质量要求。\n\n## 闲置资源\n\n`benched resource`（闲置资源）一词最常用于可用但未被利用的人员资源。然而，该术语也可以指由于原因无法使用的任何可用资源。闲置人员在“待命”度过时间时可能会士气低落，而其他闲置资源可能会占用活跃资源所需的空间。\n\
  \n项目经理应该密切关注进度安排，确保资源不会被闲置长时间。虽然闲置资源的某些原因可能超出项目经理的控制，但所有资源都应该得到及时利用。例如，如果团队成员不具备完成某项活动或任务的技能，也许可以拆分另一个活动或任务以便包含这个人。这种解决方案可能具有更快完成拆分任务的额外处。\n\
  \n资源管理工具可以帮助项目经理良好地管理资源并尽可能减少闲置资源。\n\n## 项目间依赖与资源竞争\n\n`Interproject dependencies`（项目间依赖）发生于一个项目必须等待另一个项目完成第一个项目所需的结果时。例如，如果项目\
  \ A 需要项目 B 正在完成的客户研究结果，那么在收到这些结果之前，项目 A 无法完成。\n\n如果多个项目需要共享人员和其他资源，每个项目都必须依赖其他项目及时释放资源，以确保所有项目的成功。当多个项目同时需要特定资源时，就会导致\
  \ `resource contention`（资源竞争）。组织必须有一种方法在资源竞争发生时确定项目优先级。\n\n根据组织结构，项目管理办公室（PMO）或部门主管可能必须决定哪个项目优先。包括每个项目的优先级、进度、预算或其他约束在内的多种因素，可能有助于决定哪个项目先获得资源。某个项目甚至可能具有一些浮动时间，可以容纳接收所需资源的任何延迟。一些组织定义了资源竞争指南，以确保所有项目在做出资源竞争决策时遵循相同的规则。\n\
  \n## 备考任务\n\n如引言中“如何使用本书”部分提到的，你有几种准备考试的选择：这里的练习题；`Chapter 15`；“最终准备”以及在线 Pearson\
