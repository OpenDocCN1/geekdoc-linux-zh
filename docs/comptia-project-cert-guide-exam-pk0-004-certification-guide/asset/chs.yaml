  \ | 优先级 |  |  |\n\n### 进度活动\n\n在将项目拆分为各个组件并在 WBS 中记录它们之后，项目经理可以使用 WBS 为所有活动安排进度。创建进度表可能是最耗时的工作之一，因为需要大量的协调工作：\n\
  \n1. 确定任务。\n2. 确定项目里程碑。\n3. 确定每项任务的持续时间和开始/结束日期。\n4. 设置前置任务和依赖关系。\n5. 对任务进行排序并确定优先级。\n\
  6. 将项目资源分配给任务。\n7. 设置进度基准。\n8. 设置质量。\n9. 设置治理。\n\n![Image](img/00004.jpeg)\n\n###\
  \ 确定任务\n\n一旦完成 WBS，项目经理就可以确定必须完成的任务。在某些情况下，这些任务直接来自 WBS。如果需要包含子任务，项目经理会创建一个完成项目所需的全部任务\
  \ `任务列表`。每个任务必须有唯一的名称，并应追溯到 WBS 组件。多个任务可以分配给一个工作包。\n\n**示例：** 我们慈善晚宴 WBS 中的大多数单个\
  \ 1.x.x 和 1.x.x.x 组件都是任务，但某些可以细分为子任务。例如，如果桌子和椅子来自不同的供应商，项目经理可能会将`桌子/椅子`任务 (`1.3.2`)\
  \ 细分为两个子任务。\n\n![Image](img/00004.jpeg)\n\n### 确定里程碑\n\n`*里程碑` 是项目中的重大事件。`里程碑列表`\
  \ 识别所有项目里程碑并指示每个里程碑是否强制强制。里程碑被纳入项目进度，但它们没有持续时间，因为它们实际上并不是项目任务。相反，里程碑是随着项目进展而到达的时间点。\n\
  \n**示例：** 对于我们的慈善晚宴 WBS，一个项目里程碑可能是晚餐的所有烹饪组件都已购买或获取。这只会在任务 `1.2.1–1.2.3` 之后发生。另一个项目里程碑可能是晚餐的所有“人员”组件都已确认，这将在任务\
  \ `1.4.1–1.4.2`、`1.5.1–1.5.5` 和 `1.6.1` 完成之后发生。\n\n\n\n\n\n有关任务顺序关系的详细信息，请参阅第 10\
  \ 章”。\n\n***\n\n![Image](img/00004.jpeg)\n\n## 确定任务持续时间和开始/结束日期\n\n一旦记录了任务，项目经理就需要确定每个任务的`duration`——即完成该任务需要多久。项目经理与项目团队合作以获取这些任务持续时间的估计帮助。一旦创建了任务持续时间，项目经理就可以确定每个任务的开始和结束日期。\n\
  \n**示例：** 对于我们的慈善晚宴工作分解结构（WBS），完成客星名单（任务 1.4.1）的持续时间可能比获取回复（任务 1.4.2）更短。因此，虽然项目经理可能只为创建客星名单和发送邀请分配两天，但获取回复可能需要几周时间。甚至可能需要安排人联系任何尚未回复的人员。这项额外任务届将被添加到任务列表中，例如作为子任务“客星名单跟进”1.4.1.1。\n\
  \n![Image](img/00004.jpeg)\n\n## 设置前置任务和依赖关系\n\n现在任务列表已经完成（或在目前已尽可能完成），项目经理必须确定任务的前置任务和依赖关系。`predecessor`是指在开始下一个任务之前必须完成的任务。紧随前置任务的任务被称为`dependency`，它依赖于早期任务的完成。\n\
  \n**示例：** 对于我们的慈善晚宴 WBS，在确定菜单（任务 1.2.1）之前，项目团队无法创建购物清单（任务 1.2.2）。此外，烹饪晚餐（任务 1.2.4）必须在有人完成购物（1.2.3）、获得烹饪设备（任务\
  \ 1.3.5）并雇佣厨师（任务 1.5.2）之后方才能完成。\n\n![Image](img/00004.jpeg)\n\n## 排序和优先考虑任务\n\n\
  一旦记录了任务的前置任务和依赖关系，项目经理就可以将任务按其完成所需的顺序（称为`path`或“路径”）进行排列。对任务进行优先排序可以确保如果两个任务发生冲突，优先级较高的任务将获得必要的资源。\n\
  \n在对任务排序和优先考虑时，项目经理将制定一个可能具有多个完成路径的计划。这些路径将成为下一步确定关键路径的一个重要因素。\n\n**示例：** 我们的慈善晚宴活动将会有几条项目路径。图\
  \ 4-1 显示了任务 1.2 中包含的任务的计划示例。该图是甘特图的一个示例。\n\n项目经理安排了菜单（任务 1.2.1）和购物清单（任务 1.2.2）任务在项目早期进行。然而，采购物资（任务\
  \ 1.2.3）必须在更接近实际活动日期时进行。此外，烹饪（任务 1.2.4）和供应（任务 1.2.5）将在活动当天发生。\n\n![Image](img/00011.jpeg)\n\
  \n**图 4-1** 项目计划示例\n\n## 确定关键路径\n\n![Image](img/00004.jpeg)\n\n确定了任务的顺序和优先级后，项目经理准备好寻找项目的关键路径。`critical\
  \ path`代表完成项目需要最长时间的项目路径。这条关键路径还定义了项目可能的最短持续——如果项目要成功，这些活动时间是无法削或压缩的。\n\n要计算关键路径，项目经理通过相加每个项目路径内的任务持续时间来确定每个路径的持续时间。持续时间最长的路径被关键路径。\n\
  \n**示例：** 图 4-2 显示了一个标有 A 到 P 任务的示例项目。每个任务的持续时间（`D=`）列在任务上方。\n\n![Image](img/00012.jpeg)\n\
  \n**图 4-2** 路径网格示例\n\n图 4-2 中的图是用于计算项目关键路径并显示任务依赖关系的常用图表。在此示例中，任务 N 依赖于任务 K 的完成，而任务\
  \ K 依赖于任务 F 和 G 的完成。\n\n图 4-2 中的图表总共有五个项目路径：\n\n![Image](img/00003.jpeg) A–F–K–N–P\n\
  \n![Image](img/00003.jpeg) B–G–K–N–P\n\n![Image](img/00003.jpeg) C–H–L–O–P\n\n要确定关键路径，项目经理相加每个项目路径内的任务持续时间。持续时间最长的路径被认为是关键路径。\n\
  \nImage A–F–K–N–P\nImage B–G–K–N–P\nImage C–H–L–O–P\n\n\n\n\n项目经理将继续使用这种方法，直到所有任务都具有\
  \ `ES` 和 `EF` 值。一旦完成这些值，就可以确定每个任务的 `LS` 和 `LF` 并计算浮动时间（float）。浮动时间为 0 的任务是关键任务；它们必须准时启动和完成，因为它们不允许进度表发生变动。\n\
  \n要开始计算 `LS` 和 `LF`，项目经理从最后一个任务开始，对所有任务进行反向推导，确定每个任务的推迟开始时间和推迟完成时间。最后一个任务的 `LS`\
  \ 和 `LF` 与该任务的 `ES` 和 `EF` 相同。在示例中，任务 `P` 的 `ES` 和 `LS` 值应为 16，`EF` 和 `LF` 值为 20。\n\
  \n倒回计算，一个任务的 `LF` 等于其后续任务的 `LS`。因此，任务 `N` 的 `LF` 为 16。要获取任务的 `LS`，从 `LF` 中减去持续时间。对于任务\
  \ `N`，`LS` 为 14。\n\n任务 `O` 也是任务 `P` 的前置任务，这将为我们计算浮动时间的机会。任务 `O` 的 `LF` 是任务 `P` 的\
  \ `LS`，即 16。任务 `O` 的 `LS` 为 13（LF 减去持续时间）。计算浮动时间要比较任务的 `ES` 和 `LS`。任务 `O` 的 `ES`\
  \ 为 12，`LS` 为 13。因此，该任务的浮动时间为 1，这意味着该任务可以延迟 1 天而不对项目产生不利影响。\n\n### 提示\n奇怪为什么任务 `O`\
  \ 的 ES 与任务 `L` 的 EF 不相同？因为任务 `O` 也依赖于任务 `M`。如果任务 `O` 只依赖于任务 `L`，则任务 `O` 的 `ES` 将是\
  \ 11。然而，由于它也依赖任务 `M`，任务 `O` 的 `ES` 是较大的值（12）。同样的原理适用于任务 `K`、`M` 和 `P` 的 `ES`。\n\n\
  项目经理将继续执行这些步骤，直到 `LS` 和 `LF` 字段完成。图 4-4 显示了此示例完成的关键路径网。\n\n![Image](img/00014.jpeg)\n\
  \n**图 4-4** 关键路径计算\n\n完成关键路径计算非常耗时。许多项目管理工具包含了帮助项目经理进行这些计算的模板。无论使用哪种方法，关键路径计算都是创建进度表的重要部分。为了确保你完全理解这一过程，请通过各种示例练习关键路径计算。\n\
  \n### 分配资源\n![Image](img/00004.jpeg)\n\n在完成所有任务调度活动后，项目经理需要为每个项目任务分配资源。可以分配的资源包括材料、人员、设备、用品等。\n\
  \n所有资源必须记录在资源分解结构中，该结构按类别和类型对分配的资源进行分级分解。资源可用的时间列在资源日历中，其中显示了每个项目任务所需的资源。对于材料和用品等可能需要几天或几周才能交付的资源，项目经理可能还需要记录订购提前期。例如，如果一个新的\
  \ IT 项目要求购买的设备在项目的某个时间点可用，项目经理必须从供应商处确定设备在订单日期后多久会生产并交付。当然，所有这些信息都在采购文档中，但这些信息必须记录在资源日历中，以帮助制定项目进度表。\n\
  \n项目经理使用资源日历将资源与 `WBS` 中记录的各种项目任务和时长相匹配。通过资源优化技术（如资源均衡和平资源平滑），项目经理可以制定项目进度表。`资源均衡`\
  \ 根据资源约束调整任务的开始和结束日期，并可能会增加原始关键路径。`资源平滑` 在活动各自的浮动时间范围内调整活动，以确保资源需求不会超过可用资源的限制。对于项目进度表中的每个任务，必须记录所有资源。\n\
  \n![Image](img/00004.jpeg)\n\n### 设置基准\n进度表基准是批准的项目进度表版本。项目的时间管理总是根据原始进度表基准进行衡量的。进度表只能通过正式的变更控制过程进行调整。\n\
  \n**注意**\n有关变更控制过程的详情，请参阅第 11 章“变更控制”。\n\n### 设置质量门\n作为进度表编制的一部分，项目经理可能会建立质量门，通过提供验收标准，以确保项目任务在项目规划期间建立的质量控制指南内完成交付物。质量门通常在项目阶段之间执行，也可以在其他过渡时期完成。\n\
  \n**示例：** 某组织在项目的某个阶段需要第三方服务。服务水平此前已与第三方协商好，并记录在正式的服务水平协议（SLA）中。项目经理知道适当的服务水平对项目的成功至关重要。一旦服务可用，项目经理应该设置一个质量门来测试可用的服务水平，以确保其符合承诺的水平。\n\
  \n质量门通常有一个相关的检查清单，用于提供是否符合衡量标准。\n\n### 设置治理门\n治理门与质量门类似，都标记了项目任务的验收标准，但治理门更多关于客户签署、管理批准或立法批准。这里的关键词是“批准”。\n\
  \n**示例：** 某组织需要州政府机构批准项目的某些方面符合新规定。项目应包含一个治理门（或多个治理门，取决于复杂度），以确保获得适当的批准。设置治理门可以确保如果初始批准被拒绝，项目可以进行修订。\n\
  \n## 考试准备任务\n正如引言中“如何使用本书”部分提到的，你有几种准备考试的选择：此处此处的练习题；第 15 章“最终准备”以及 Pearson Test\
  \ Prep 在线模拟考试。\n\n## 复习所有关键主题\n复习本章最重要的主题，这些主题在页外边缘用“关键主题”图标标记。表 4-3 提供了这些关键主题及其起始页码的参考。\n\
