  \ 中。欲更多模拟考试练习，请使用在线的 Pearson Test Prep 模拟考试软件。\n\n**1。** 项目团队成员提交了正式变更请求。作为项目经理，你必须执行的下一步是什么？\n\
  \n**a.** 开发回归计划。\n\n**b.** 评估变更的影响并提供理由。\n\n**c.** 识别批准机构并获得批准。\n\n**d.** 执行变更。\n\
  \n**2。** 你需要确保项目可以撤回已请求的变更。\n\n你应该创建什么？\n\n\n\n\n\na. 变更验证\n\nb. 风险事件\n\nc. 回归计划\n\
  \nd. 变更请求\n\n3.** 一位项目利益相关者请求了项目变更。哪个实体将批准或拒绝该请求？\n\na. 项目经理\nb. 项目团队成员\nc. 项目利益相关者\n\
  d. 变更控制委员会\n\n4.** 在执行一个新应用程序的项目任务时，一名项目团队成员发现遗漏了另一个任务，因此该应用程序的一个重要部分将缺乏适当的安全机制。在新任务中完成的操作属于原始项目范围的一部分。作为项目经理，你必须评估添加该任务对项目产生的任何影响。请求的是哪种类型的变更？\n\
  \na. 进度变更\nb. 资源变更\nc. 需求变更\nd. 范围变更\n\n5.** 你是一个新建筑项目的项目经理。首席木工联系你，说项目使用的的一种类型木材在主供应商处缺货了。该项目已经批准了一家备用供应商，但该供应商的木材价格更贵。请求的是哪种类型的变更？\n\
  \na. 质量变更\nb. 需求变更\nc. 进度变更\nd. 预算变更\n\n6.** 你是一个环境项目的项目经理，该项目研究当地建设和零售开发对水质的影响。项目启动后，赞助人意识到测试将在秋季和冬季进行。他决定项目在春季和夏季也进行测试。请求的是哪种类型的变更？\n\
  \na. 风险事件\nb. 预算变更\nc. 需求变更\nd. 质量变更\n\n7.** 你是一个道路维修项目的项目经理。你的项目计划明天使用公司的水泥运输车，但你刚刚获知设备在今天的事故中受损了。在项目规划期间，你曾担心这种情况可能会发生，并制定了以防某些原因导致关键设备不可用的预备计划。发生了哪种类型的变更？\n\
  \na. 范围变更\nb. 风险事件\nc. 需求变更\nd. 资源变更\n\n8.** 你是一个钢铁建筑项目的项目经理。在施工开始前，客户要求使用更高等级的钢材。发生了哪种类型的变更请求？\n\
  \na. 质量变更\nb. 资源变更\nc. 范围变更\nd. 采购变更\n\n9.** 你是一个新型无线耳机设计项目的项目经理。该项目需要从第三方进行多次昂贵的采购。在采购过程开始之前，你的公司发布了必须遵循的大额采购新程序。这些新程序将影响你项目中一半的采购。发生了哪种组织变更？\n\
  \na. 业务合并\nb. 业务流程变更\nc. 内部重组\nd. 外包\n\n10.** 下列哪项是内部重组的示例？\n\na. 一家软件开发公司决定使用第三方完成某些未完成的开发项目。\n\
  b. 管理层决定将分处从一个城市搬到另一个城市。\nc. 一公司将销售和营销人员分为两个不同的团队，每个团队向不同的主管汇报。\nd. 管理层决定出售公司拥有的一个不再盈利的应用程序。\n\
  \n# 第四部分：项目工具与文档\n\n## 第 12 章 项目管理工具\n\n本章涵盖了以下主题：\n\n![Image](img/00003.jpeg) **理解项目管理工具：**\
  \ 工具包括项目进度安排软件、图表、仪表板和状态报告、知识管理工具、性能测量工具、SWOT 分析和 RACI 矩阵。\n\n今天，复杂的工具可以帮助处理项目管理的许多细节。本章描述的每种工具都满足项目中的特定需求，例如预测进度冲突、分析任务性能或图形化描绘质量问题。项目经理应该充分研究功能，并为工作选择最佳可用工具。某些项目经理可能必须使用其组织或项目管理办公室（PMO）提供的或要求的工具。\n\
  \n本章涵盖了 Project+ 考试的以下目标：\n\n**4.1.** 比较并对比各种项目管理工具。\n\n***\n\n### 注意\n\n提醒：CompTIA\
  \ 可能在 Project+ 考试中使用行业标准术语的细微变。有关已知词汇差异的详细列表，请参阅第 15 章“最终准备.”\n\n***\n\n### “我已经学会了吗？”测验\n\
  \n“我已经学会了吗？”测验可以让你评估是否应该仔细阅读整个章节，还是跳到“考试准备任务”部分。如果你对这些问题的答案或对对这些主题知识的评估有疑问，请阅读整个章节。表\
  \ 12-1 列出了本章中的主要标题及其对应的“我已经学会了吗？”测验问题。你可以在附录 A“‘我已经学会了吗？测验和复习题答案。”找到答案。\n\n**表 12-1**\
  \ “我已经学会了吗？”基础知识章节与问题映射\n\n| 基础知识章节 | 该节涵盖的问题 |\n| :--- | :--- |\n| 项目进度安排软件 | 1\
  \ |\n| 图表和流程图 | 2–3, 10 |\n| 仪表板和状态报告 | 4 |\n| 知识管理工具 | 5 |\n| 性能测量工具 | 6, 9 |\n\
  | SWOT 分析 | 7 |\n| RACI 矩阵 | 8 |\n\n***\n\n### 警告\n\n自评估的目标是衡量你对本章主题的掌握程度。如果你不知道某个问题的答案，或者对答案只有部分把握，那么出于自评估的目的，你应该将该问题标记为错误。对你猜中的答案给自己分会歪曲你的自评估结果，并可能给你带来虚假的安全感。\n\
  \n***\n\n1.** 哪种项目主要用于跟踪项目活动、持续时间以及分配的人员？\n\na. 流程图\nb. 直方图\nc. 鱼骨图\nd. 项目进度安排软件\n\
  \n2.** 直方图的目的是？\n\na. 设置优先级\nb. 对问题的潜在原因进行分类以识别根源\nc. 描绘统计数据的近似分布\nd. 按顺序描绘业务流程中的步骤\n\
  \n3.** 哪种项目图表用于寻找两个变量之间的相关性？\n\na. 运行图\nb. 散点图\nc. 帕累图\nd. 甘特图\n\n4.** 下列哪个答案*最好*描述了项目仪表板的目的是？\n\
  \na. 提供项目状态\nb. 显示随时间变化的项目活动\nc. 显示项目随时间演变的趋势、波动或下降/改进\nd. 管理协作内容\n\n5.** 哪种知识管理工具为项目团队成员提供关于第三方问题的答案？\n\
  \na. wiki 页面\nb. 供应商知识库\nc. 内部网站点\nd. 协作工具\ne. 仪表板\n\n6.** 哪种关键绩效指标（KPI）用于显示项目从目前为止投入资金中获得的价值？\n\
  \na. CPI\n\n\n\n\n\n**b.** AC\n\n**c.** PV\n\n**d.** EV\n\n### 7. SWOT 分析的目的是什么？\n\
  **a.** 识别风险\n**b.** 识别角色和职责\n**c.** 估算成本\n**d.** 分解活动\n\n### 8. 使用哪种工具来确定处理每个项目活动所需的角色？\n\
  **a.** SWOT 分析\n**b.** RACI 矩阵\n**c.** 帕累图（Pareto chart）\n**d.** BSC（平衡得分）\n\n###\
  \ 9. BSC 中分析了哪些类别？\n**a.** 计划、启动、执行、监控与控制以及结束\n**b.** 负责（Responsible）、应责（Accountable）、咨询（Consulted）和知情（Informed）\n\
  **c.** 错过的里程碑、截止日期和资源利用率\n**d.** 财务、客户、内部流程以及学习与增长\n\n### 10. 哪种项目工具帮助项目经理识别项目中最大的单一问题来源？\n\
  **a.** 直方图（histogram）\n**b.** 甘特图（Gantt chart）\n**c.** 帕累图（Pareto chart）\n**d.**\
  \ 散点图（scatter chart）\n**e.** 鱼骨图（fishbone diagram）\n\n### 基础主题\n![Image](img/00004.jpeg)\n\
  \n### 项目调度软件\n合适的工具可以让项目经理的工作变得得多。现代`项目调度软件`\n\n### 流程图\n`process diagram` 显示了采购流程流程图的一部分。\n\
  \n流程图中的组件通常使用以下符号（参见图 12-2）：\n\n![Image](img/00003.jpeg) 方框详细说明单个步骤。\n\n![Image](img/00003.jpeg)\
  \ 箭头显示从一个步骤或决策到另一个步骤的方向流。\n\n![Image](img/00003.jpeg) 菱形标记流程中的决策点。菱形内写有一个问题，根据问题的可能答案，从菱形中引出多个箭头。\n\
  \n![Image](img/00003.jpeg) 半圆显示流程中的延迟或等待。\n\n![Image](img/00003.jpeg) 圆形表示到另一个页面或另一个流程图的链接。链接页面或图表上的相同符号表示流程在该处继续。\n\
  \n![Image](img/00003.jpeg) 平行四形表示流程的输入或输出。\n\n***\n\n**提示\n用法各不相同。某些组织或艺术家可能会以不同的方式使用这些符号，添加其他符号，通过线宽或颜色赋予意义，等等。\n\
  \n***\n\n![Image](img/00028.jpeg)\n\n**图 12-1** 采购流程图示例\n\n![Image](img/00029.jpeg)\n\
  \n**图 12-2** 流程图中的常用符号\n\n许多商业软件应用程序可以使创建流程图变得更简单。`Microsoft Visio`、`Novagraph Chartist`、`RFFlow`、`WizFlow\
  \ Flowcharter`、`1888 Quick Flow Chart Creator` 以及其他应用程序在复杂度、成本和功能上各异。项目经理或 PMO 应该找到最适合组织需求的产品。某些应用程序（如\
  \ `Microsoft Visio`）提供的不仅仅是流程图，还包括网络图、数据流图和其他需要专业组件的图表。\n\n![Image](img/00004.jpeg)\n\
  \n### 直方图\n`histogram` 显示了一个代表接待员接到的电话数量和类型的直方图示例。\n\n![Image](img/00030.jpeg)\n\
  \n**图 12-3** 直方图示例\n\n### 鱼骨图\n![Image](img/00004.jpeg)\n\n\n\n\n\n`鱼骨图` (#part0034.html_gloss111)也被称为`因果图`或`石川图`，它通过对问题的潜在原因进行分类，帮助项目团队识别根本原因。当团队思维倾向于陷入定式时，项目经理可以使用此工具进行头脑风暴。\n\
  \n图表的左侧列出了原因，并将其分为几个主要大类。随着图表的构建，识别出的原因将放置在适当的归类别中。图表的右侧列出了结果。结果被写为项目经理试图识别其原因的问题陈述。图\
  \ 12-4 中的部分鱼骨图显示了产品质量不符合标准的原因。\n\n![Image](img/00031.jpeg)\n\n**图 12-4** 鱼骨图示例\n\
  \n鱼骨图通常在项目团队会议期间手绘。创建鱼骨图的流行工具包括 SmartDraw、Edraw Max、RCAXPress Fishbone Diagram Builder、XMind\
  \ 和 Nevron。\n\n![Image](img/00004.jpeg)\n\n## 帕累托图\n\n`帕累托图` (#part0034.html_gloss195)帮助项目经理为质量控制设定优先级，通常与鱼骨图结合使用。项目经理可以在质量管理过程中找出项目问题背后的原因的相对重要性。帕累托图背后的理论是“80/20\
  \ 法则”，它表明项目中的大多数问题（80%）是由少数几个因素（20%）引起的。项目经理通过识别首先处理哪个根本原因，可以消除最多的问题。\n\n帕累托图将垂直柱状图与折线图相结合，显示从高到低排列的重要性或其他数值。项目经理使用项目问题列表作为柱状图的基础。最常见的问题应该列在左侧，最不常见的问题列在右侧。每个参数的重要性通过几个因素（如频率、时间或成本）来衡量。代表累计总百分比的数据点绘制在折线图中。\n\
  \n许多帕累托图包含一个累计百分比截止值（例如 80%）。任何超过该截止值的条形都显示问题的最高累计百分比，这表明了优先考虑的原因。低于截止线的数据表示优先级较低的根本原因。\n\
  \n图 12-5 显示帕累托图的示例。\n\n![Image](img/00032.jpeg)\n\n**图 12-5** 帕累托图示例\n\n![Image](img/00004.jpeg)\n\
  \n## 运行图\n\n与帕累托图一样，`运行图` (#part0034.html_gloss317)也用于质量管理。运行图使用折线图显示项目随时间推移的趋势、波动或下降/改进（参见图\
  \ 12-6）。项目经理可以使用运行图分析以下数据趋势：\n\n![Image](img/00033.jpeg)\n\n**图 12-6** 运行图示例\n\n\
  ![Image](img/00003.jpeg) 过多的运行点在中心线之上或下方\n\n![Image](img/00003.jpeg) 过多的点持续增加或减少\n\
  \n![Image](img/00003.jpeg) 过多的点在中心线的同一侧\n\n![Image](img/00003.jpeg) 过多的点交替上升或下降\n\
  \n**示例：** 作为项目经理，你需要记录在整个应用程序开发项目中每周检测到的代码错误数量。团队成员以小组形式开发代码，然后由团队相互审查代码。他们向你报告代码错误的数量，你在运行图中记录总数，目标是随着项目的进行而减少代码错误的数量。\n\
  \n![Image](img/00004.jpeg)\n\n## 散点图\n\n`散点图` (#part0034.html_gloss318)也称为`散点图`（`scatter\
  \ plot`）或`相关性图`，用于寻找两个变量之间（例如交通速度和事故数量之间）的相关性。第一个变量是独立变量，第二个变量依赖于第一个变量。该图显示了因变量如何受自变量变化的影响：\n\
  \n![Image](img/00003.jpeg) 变量之间没有相关性（参见图 12-7）\n\n![Image](img/00003.jpeg) 变量之间存在中等相关性（参见图\
  \ 12-8）\n\n![Image](img/00003.jpeg) 变量之间存在强相关性（参见图 12-9）\n\n![Image](img/00034.jpeg)\n\
  \n**图 12-7** 变量间无相关性的散点图\n\n![Image](img/00035.jpeg)\n\n**图 12-8** 变量间存在中等相关性的散点图\n\
  \n![Image](img/000036.jpeg)\n\n**图 12-9** 变量间存在强相关性的散点图\n\n为了正确解释散点图，项目经理需要理解`离群值`\
  \ (#part0034.html_gloss193)，即落在落在大多数点模式之外的数据点。散点图的`趋势线` (#part0034.html_gloss373)是大多数点所分布的线。\n\
  \n图 12-10 中的散点图显示了海滩游客人数与平均温度之间的相关性。\n\n![Image](img/00037.jpeg)\n\n**图 12-10**\
  \ 散点图示例\n\n## 甘特图\n\n![Image](img/00004.jpeg)\n\n`甘特图` (#part0034.html_gloss123)显示项目随时间安排的计划活动或任务，通常还包括活动的依赖关系和关联。甘特图是用于项目调度的主要工具之一，也可以描绘项目进度基准。图表的左侧列出活动，图表的顶部或底部显示时间尺度。网格内条形的长度和位置描述了每个活动的开始日期、持续时间和和结束日期（参见图\
  \ 12-11）。在甘特图中，项目经理、团队成员和利益相关者可以看到以下进度特征：\n\n![Image](img/00003.jpeg) 项目活动\n\n![Image](img/00003.jpeg)\
  \ 活动开始和结束日期\n\n![Image](img/00003.jpeg) 活动持续时间\n\n![Image](img/00003.jpeg) 活动重叠\n\
  \n![Image](img/00003.jpeg) 项目开始和结束日期\n\n在某些情况下，可以修改甘特图以包含有关分配给活动的资源信息，将里程碑作为零持续时间的任务添加，并标记关键活动。\n\
  \n![Image](img/00038.jpeg)\n\n**图 12-11** 甘特图示例\n\n项目调度软件和项目管理软件提供了内置功能，可以根据项目的任务、持续时间和时间数据生成甘特图。使用电子表格应用程序创建功能性的甘特图可行但非常耗时。\n\
  \n### 仪表板和状态报告\n\n![Image](img/00004.jpeg)\n\n项目图表和状态报告是项目经理汇总和沟通项目状态关键数据的简单选择，而不会让观众感到压力。一种被称为`仪表板`\
  \ (#part0034.html_gloss83)的图形报告显示了重要的项目状态信息，通常包括关键性能指标、项目指标、当前进展和相关问题。书面状态报告可能包含也不包含仪表板的内容；它发送给项目赞助人和任何想要这些信息的利益相关者。\n\
  \n项目管理软件或独立的仪表板应用程序允许项目经理自定义仪表板上的信息。例如，项目经理可能决定创建一个供利益相关者查看数据的仪表板，以及另一个供包含更多详细信息的项目团队成员使用的独立仪表板。以下列表描述了一些常见的仪表板格式。\n\
  \n\n\n\n\n![Image](img/00003.jpeg) **燃尽图仪表板：** 显示已完成多少活动以及剩余多少工作。\n\n![Image](img/00003.jpeg)\
  \ **成本概览仪表板：** 显示项目的当前成本状态，通常包括计划成本、剩余成本、实际成本、累计成本、基线成本和完成率，帮助判断项目是否会保持在预算。\n\n\
  ![Image](img/00003.jpeg) **项目概览仪表板：** 报告活动完成情况、即将到来的里程碑以及过期的活动。\n\n![Image](img/00003.jpeg)\
  \ **工作概览仪表板：** 包括项目的工作燃尽图以及所有顶级任务的工作统计，帮助确定完成百分比和剩余工作。\n\n具有仪表板功能的常用项目管理应用程序包括 Microsoft\
  \ Project、Asana、Basecamp、Mavenlink 和 Smartsheet。\n\n* * *\n\n提示\n\n在网上搜索“project\
  \ overview dashboard images”可以为为项目构建实用的仪表板提供许多思路。\n\n* * *\n\n![Image](img/00004.jpeg)\n\
  \n### 知识管理工具\n\n项目团队需要在项目进展过程中共享信息。需要共享的知识可能包括记录的流程和程序、可用的工具和技术、数据库、源代码仓库等。知识管理工具可以提供一个中心位置，所有项目团队成员无论其所在地或平台如何，都可以轻松访问共享数据。\n\
  \nCompTIA 要求 Project+ 认证候选人熟悉常用知识管理工具的功能：内网和互联网站点、wiki 页面、供应商知识库和协作工具。\n\n#### 内网站点和互联网站点\n\
  \n`内网站点`(#part0034.html_gloss146) 仅供组织内部访问，而 `互联网站点`(#part0034.html_gloss143) 是公开托管的网站。两者都可以作为项目存储库。项目经理可以在现有的内网或互联网站点上添加项目信息，或者为该项目建立一个新站点。这些站点通常包含任务管理器、项目文档、讨论板、日历以及团队成员简介等通用信息。\n\
  \n网站为知识管理提供了若干优势：\n\n![Image](img/00003.jpeg) 可以通过网络浏览器访问数据\n\n![Image](img/00003.jpeg)\
  \ 易于设置\n\n![Image](img/00003.jpeg) 成本低\n\n![Image](img/00003.jpeg) 提高生产力\n\n使用网站作为知识管理工具最大的缺点是安全影响，特别是对于机密或具有高货币价值的项目。即使是内网站点也可能受到攻击。在将项目信息放在内网或互联网站点之前，项目赞助人和项目经理应该评估项目的数据机密性需求，并确定在组织内部和/外共享项目信息的价值是否值得承担安全风险。如果组织担心项目机密性泄露（例如专有信息泄露给竞争对手），他们可能需要选择风险较低的知识管理工具。\n\
  \n#### Wiki 页面\n\n`wiki`(#part0034.html_gloss382)是一种用于管理协作内容的网站类型。wiki 用户决定站点的结构，并能够根据需要编辑内容，而无需通过正式的编辑或上传过程。虽然内网和互联网站点需要了解\
  \ Web 开发技术和语言（如 `HTML`），但 wiki 页面通常很少需要专业知识。对于需要大量文档的项目，wiki 特别有用，这些文档将由多个地点和时区的团队成员访问和编辑。\n\
  \n对于项目管理，使用 wiki 具有若干优势：\n\n![Image](img/00003.jpeg) 任何人都可以编辑内容。\n\n![Image](img/00003.jpeg)\
  \ 在 wiki 页面上发布信息快速且方便。\n\n![Image](img/00003.jpeg) 共享数据有助于沟通和讨论。\n\n![Image](img/00003.jpeg)\
  \ wiki 页面可以链接以简化相关数据的访问。\n\n![Image](img/00003.jpeg) wiki 页面的所有更改都经过了跟踪。\n\n![Image](img/00003.jpeg)\
  \ 启动和维护 wiki 通常比许多其他选项更便宜。\n\n但 wiki 也有缺点：\n\n![Image](img/00003.jpeg) 任何人都可以编辑内容。\n\
  \n![Image](img/00003.jpeg) 公开站点可能受到垃圾邮件攻击。\n\n![Image](img/00003.jpeg) 协作工具可能会变得混乱。\n\
  \n![Image](img/00003.jpeg) wiki 结构可能会变得混乱。\n\n#### 供应商知识库\n\n`供应商知识库`(#part0034.html_gloss376)是一个包含有关特定供应商授权信息的数据库。大多数操作系统供应商（如\
  \ Cisco、Microsoft 和 Apple）都有供公众搜索的知识库，尽管某些内容可能为订阅者或产品所有者保留。如果项目需要特定产品但项目团队没有过丰富的知识，知识库将特别有帮助。\n\
  \n项目经理应确保项目团队成员知道如何访问和搜索知识库。团队成员可能还需要理解如何在知识库中请求新的更新信息。\n\n#### 协作工具\n\n`协作工具`(#part0034.html_gloss50)用于项目中帮助项目团队共同工作。有许多工具可以帮助团队成员协作，功能从集中式文档管理到生产力到会议不等。这些工具通常允许带有版本控制的共享文档管理。协作工具侧重于帮助提高团队效率和输出，而不是与团队之外的人交流。\n\
  \n流行的项目管理协作工具包括 Asana、Projecteev、Podio、Redbooth（原 Teambox）、Trello、Flow、Conceptboard、Basecamp、Binfire、Projecturf、Wiggio、Zoho\
  \ 和 G Suite。功能较少的工具主要关注文件共享：SharePoint、Dropbox、Microsoft OneDrive、WebEx、GoToMeeting\
  \ 和 Skype。\n\n所有项目团队成员必须知道如何使用选定的协作工具访问和更新项目资源或进行通信。\n\n* * *\n\n注意\n\nProject+\
  \ 考试侧重于图表和知识管理工具为项目提供的功能。不要期望会针对特定工具进行测试。目标是理解这些工具的用途以及何时何时选择它们。\n\n* * *\n\n###\
  \ 性能测量工具\n\n项目需要量化成功的方法。*性能测量工具*（如关键性能指标、关键性能参数和平衡分卡）帮助项目经理以可衡量的格式展示项目成功。当提供此类测量结果时，即使是不熟悉项目术语的人也能理解项目的运行情况。\n\
  \n* * *\n\n警告\n\n注意不要将*性能测量工具*与*项目质量工具*混淆，后者衡量的是项目中的质量规范。\n\n* * *\n\n#### 关键性能指标\
  \ (KPI)/关键性能参数 (KPP)\n\n\n\n\n\n`关键性能指标 (KPI)` 是一种衡量项目或交付物在实现性能目标方面成功与否的标准。美国国防部（DoD）将这些指标称为\
  \ `关键性能参数 (KPPs)`。KPI 和 KPPs 通常记录在项目仪表板中。\n\n[表 12-2] 显示了项目经理通常在仪表板中提供的 KPI 和 KPPs。\n\
  \n**表 12-2** 关键性能指标/关键性能参数\n\n| KPI 或 KPP | 描述 |\n| --- | --- |\n| 计划价值 (PV) | 当前已完成工作量的计划成本。\
  \ |\n| 实际成本 (AC) | 截至目前在项目上花费的实际资金。 |\n| 挣值 (EV) | 项目根据目前已花费的资金所获得的价值。 |\n| 成本偏差\
  \ (CV) | 在任何给定时间的预算缺口或盈余。 |\n| 成本绩效指数 (CPI) | 挣值与实际成本的比率。 |\n| 进度绩效指数 (SPI) | 挣值与计划值的比率。\
  \ |\n| 进度偏差 (SV) | 挣值与计划值之间的差异。 |\n| 投资回报率 (ROI) | 项目赞助人为该项目将获得的总美元/时间回报。ROI 使用两个公式之一计算：![Image](img/00003.jpeg)\
  \ (运营成本的变化) / (项目成本)![Image](img/00003.jpeg) (收入的变化) / (项目成本) |\n| 管理过程成本 | 用于在监督和管理项目上花费的时间和资源的概览。\
  \ |\n| 过期项目任务（也称为跨期） | 过期的项目活动数量。将超过截止日的项目活动计算百分比与所有完成的项目活动进行比较。 |\n| 错过的里程碑 | 指明项目进度是超前、准时还是落后。\
  \ |\n| 任务完成百分比 | 指明任务完成进度。 |\n| 资源利用率 | 衡量团队成员在执行项目期间时间的使用情况。具体而言，这项测量显示了团队成员在计费活动上花费的时间与在非计费任务（如会议）上花费的时间相比。\
  \ |\n| 按时完成的项目百分比 | 有助于证明组织的整体项目成功率。 |\n| 项目取消百分比 | 显示组织项目的可持续性。项目面临因内部因素（如缺乏预算或赞助支持）或外部因素（如监管或环境问题）而被取消的风险。如果取消的项目过多，组织应该改变项目管理方法或关注不同类型的项目。\
  \ |\n\n注意\n参见[第 3 章]“[项目成本控制”，获取 `PV`、`AC`、`EV`、`CV`、`CPI`、`SPI` 和 `SV` 及其公式。里程碑列表中记录在里程碑列表中列出了所有项目里程碑并标明每个里程碑是否为强制性。里程碑的详细信息请参见[第\
  \ 4 章]“项目进度”。\n\n可以根据组织的需要添加其他 KPI 或 KPP。项目经理应确保项目赞助人和利益相关者理解每项测量的含义。\n\n### 平衡计卡\
  \ (BSC)\n\n理解管理层试图衡量什么，有助于项目经理收集和报告影响这些测量的项目信息。这种理解也有助于向项目解释为什么需要特定的测量。在组织的 `平衡计卡\
  \ (BSC)` 中，管理层利用项目管理工具和原则来明确整个组织的战略目标，而不仅仅是其项目或项目组合。\n\nBSC 包含四组衡量指标：\n\n![Image\
  \ **财务：** 财务部分回答问题：“我们如何向股东证明我们在财务上是成功的？”该部分包含组织的财务目标，使用了 `具体的、可衡量的、可实现的、现实的、有时间的\
  \ (SMART)` 目标。该部分通常包括诸如“在 2018 财年增加 15% 的收入”或“在第四季度减少 10% 的运营成本”等声明。![Image](img/00)\
  \ **客户：** 客户部分回答问题：“我们如何让客户对我们公司的感知与我们的愿景一致？”该部分将财务部分的目标与它们将如何影响组织客户联系起来。例如，如果财务目标是增加收入，营销和销售工作可能会侧重于获得特定数量的新客户或增加现有客户的订单量。\n\
  \n![Image](img/00003.jpeg) **内部流程：** 内部流程部分回答问题：“为了实现客户和财务目标，哪些业务流程必须卓越，或者必须建立哪些系统？”该部分将组织的内部业务流程和运营与财务及客户部分的目标联系起来。例如，如果财务目标是增加收入，客户目标是获得特定数量的新客户，那么销售和营销团队可能有一个内部流程目标，即合作开发新的营销材料以吸引新客户。\n\
  \n![Image](img/00003.jpeg) **学习与成长：** 学习与成长部分回答问题：“为了支持我们的财务和客户目标，我们需要什么样的知识、技能和能力？”该部分将组织的能力与内部流程、客户和财务部分的目标联系起来。例如，如果财务目标是增加收入，客户目标是获得特定数量的新客户，内部流程目标是开发新的营销材料，那么营销团队可能需要一个新的软件应用程序来帮助团队开发新的营销计划。\n\
  \n平衡计卡的每个部分都应该包含目标、衡量标准、指标和计划。项目经理应仔细研究每个部分，以确保项目目标与组织目标一致，将项目策略映射回 BSC，以确保项目的采纳和成功。\n\
  \n### SWOT 分析\n\n`优势、劣势、机会和威胁 (SWOT) 分析` 在项目的规划阶段使用，用于识别项目风险。项目经理使用此工具识别项目中可能导致问题或提供机会的领域。\n\
  \n优势和劣势是内部因素，而机会和威胁是外部因素。在这两个分组（内部和外部）中，每组的一个因素是正面的，另一个是负面的：\n\n![Image](img/00003.jpeg)\
  \ **内部因素：** `优势分析`处理正面的内部因素，而 `劣势分析`关注负面的内部因素。\n\n![Image](img/00003.jpeg) **外部因素：**\
  \ `机会分析`查看正面的外部因素，而 `威胁分析`集中于负面的外部因素。\n\n项目经理的 SWOT 分析逐个检查这些各个方面：\n\n![Image](img/00003.jpeg)\
  \ **优势：** 分析内部技能和经验、所有任务的预算充足性、项目收益以及其他类似项目，以识别组织或团队为项目提供的任何优势。优势包括组织记录、资源可用性、技能水平、流程和系统、声誉等。\n\
  \n\n\n\n\n![Image](img/00003.jpeg)\n\n ## 劣势\n分析应急资金的可用性、外包需求、进度的现实性和项目缺陷，以识别项目中的任何劣势。劣势可能包括知识和专业技能方面的差距、时间范围和截止日期、预算和资金、流程和系统以及竞争项目等问题。\n\
  \n![Image](img/00003.jpeg) ## 机会\n分析竞争对手的劣势、当前行业趋势、新技术以及其他应当抓住机会来帮助项目的领域。机会可能包括技术开发、基础设施建设、新兴和发展市场、新创新以及市场需求。\n\
  \n![Image](img/00003.jpeg) ## 威胁\n为了识别对项目的威胁，需要分析团队成员是否难以替换、所需新技术是否经过测试、趋势变化是否会影响项目，或者项目结果会被竞争对手复制。典型威胁包括环境因素、竞争对手活动、经济因素、季节性影响和政治因素。\n\
  \n`Table 12-3`` 显示了一个新餐厅的 SWOT 分析示例。\n\n### 表 12-3 SWOT 分析示例\n\n| 优势 | 劣势 |\n| :---\
  \ | :--- |\n| **位置：** 我们位于市中心的第一个选址将吸引游客和市中心购物者。 | **缺乏资金：** 所有的启动资金将来自贷款和投资者。 |\n\
  | **独特性：** 我们作为快餐的独特替代方案脱颖而出，并在独特的氛围中提供高质量的食物。 | **缺乏声誉：** 尽管我们所有的餐厅都很成功，但我们需要建立统一的品牌。\
  \ |\n| **强大的管理能力：** 我们的管理团队在五年内成功开设了十二家概念餐厅。 | |\n\n| 机会 | 威胁 |\n| :--- | :--- |\n\
  | **区域增长：** 该城市每年 8.5% 的速度增长。 | **竞争：** 一个竞争对手销售类似的食品并拥有忠实客户，还与经常向他们采购的企业有合作。 |\n\
  | **有孩子的工薪家庭：** 这是一个不断增长的人口，无论是在人数还是对便利食物的选择上都是。双收入家庭准备食物的时间较少。 | **对开业人数准备不足：**\
  \ 开业周糟糕的服务或产品质量可能会让客户不再回来。 |\n\nSWOT 分析相比复杂的分析方案具有一些优势，但缺点也是代价的一部分，正如 `Table 12-4``\
  \ 所示。\n\n### 表 12-4 SWOT 分析的优点与缺点\n\n| 优势 | 缺点 |\n| :--- | :--- |\n| 分析简单。 | 创建\
  \ SWOT 表的简单性可能会鼓励列列清单，而不是专注于实现目标。 |\n| 执行成本低。 | 更昂贵的分析可能会产生更有用的结果。 |\n| 快速产生新想法。\
  \ | 不将想法组织以适应既定的优先级。 |\n| 允许制定通用的响应计划。 | 有用的风险准备需要更详细的分析。 |\n\n ## RACI 矩阵\n项目经理在项目的规划阶段创建`负责、认可、咨询和知情\
  \ (RACI) 矩阵`](part0034.html_gloss287)，以分析项目利益相关者和团队成员相对于项目活动或任务的角色和职责。对于每个任务，项目必须识别以下内容：\n\
  \n![Image](img/00003.jpeg) **负责 (R)：** 谁来执行完成活动的工作？\n\n![Image](img/00003.jpeg)\
  \ **认可 (A)：** 谁对该活动负责？\n\n![Image](img/00003.jpeg) **咨询 (C)：** 谁提供有关该活动的信息？\n\n\
  ![Image](img/00003.jpeg) **知情 (I)：** 谁需要知道活动的进度？\n\n为了创建 RACI 矩阵，大多数项目经理从规划阶段创建的工作分解结构\
  \ (WBS) 开始。网格在左侧列列出项目活动。然后将每个项目利益相关者或团队成员列在单独的一列中，并在姓名或角色下方的字段中为每个活动指定标记（R、A、C 和/或\
  \ I）（参见 `Table 12-5``）。在大多数情况下，只有项目经理使用 RACI 矩阵。如果其他团队成员需要此文档，项目经理应该解释不应让利益相关者访问。`Table\
  \ 12-5`` 显示了一个 RACI 矩阵模板。\n\n### 表 12-5 RACI 矩阵模板\n\n| 活动 | 角色 1 | 角色 2 | 角色 3 |\
  \ 角色 4 | 角色 5 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 活动 1.1 | R | A |\
  \ C, I | | |\n| 活动 1.2 | | R, A | | C | I |\n| 活动 2.1 | I | I | R | A, C | |\n|\
