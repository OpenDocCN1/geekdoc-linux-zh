  \n## 第 7 章 项目约束与影响\n\n本章涵盖了以下主题：\n\n- **理解整个项目过程中的各种约束变量：** 约束包括成本、范围、时间和进度安排、交付物、质量、环境、资源和需求。\n\
  - **理解整个项目过程中对约束的各种影响：** 项目影响包括变更请求、范围蔓延、约束重新排序、约束之间的相互作用、利益者/赞助者/管理层的影响，以及其他项目的影响。\n\
  \n约束在重要方面限制了项目，例如定义项目范围和可用资源。然而，约束并非一成不变的；它们可能会受到项目进行期间发生事件的影响。项目影响（例如预算增加或赞助者对扩大项目的兴趣）也可能要求更改项目的约束。本章研究了约束以及这些约束的变化如何影响项目。\n\
  \n本章涵盖了 Project+ 考试的以下目标：\n\n**2.1** 给定场景，预测整个项目过程中各种约束变量和影响的影响。\n\n> **注意**\n>\
  \ 风险也被视为项目约束。第 8 章“风险活动与策略”将更详细地讨论风险。\n\n> **注意**\n> 提醒：CompTIA 在 Project+ 考试中可能会使用行业标准术语的细微变体。有关已知词汇差异的详细列表，请参见第\
  \ 15 章“最终准备”。\n\n### “我真的学会了吗？”测验\n\n“我真的学会了吗？”测验可以让你评估是否应该仔细阅读整个章节内容，还是跳到“考试准备任务”部分。如果你对这些问题的答案或自己对这些主题知识的评估有疑问，请阅读整个章节。表\
