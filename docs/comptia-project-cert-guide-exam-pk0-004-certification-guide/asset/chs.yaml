  \na. 风险接受\nb. 风险增强\nc. 风险缓解\nd. 风险利用\n\n[9]. 风险转移最常见的形式是什么？\n\na. 雇用更多资源\nb. 使用外包资源完成所有工作\n\
  c. 购买保险\nd. 冗余\n\n[10]. 哪种积极风险策略使用关键驱动因素来确保风险发生？\n\na. 风险增强\nb. 风险接受\nc. 风险利用\n\
  d. 风险共享\n\n### 基础主题\n\n![Image](img/00004.jpeg)\n\n## 风险活动\n\n\n\n\n\n`Risk activities`\
  \ 包括制定风险管理计划、识别风险、执行风险分析、制定风险响应以及审查和控制风险。这些风险活动发生在项目的规划阶段和监控控制阶段。由于已知风险已被识别和分析，因此可以对这些风险进行规划。但也可能存在未知风险；这些风险在发生之前是无法处理的，因为它们在规划过程中没有被识别。\n\
  \n**提示**\n风险管理是贯穿整个项目、用于发现、量化和应对风险的整体策略。对已识别的单个风险将进行进一步分析，以确定对每种风险的适当响应。\n\n项目经理需要确保进行适当的风险规划、风险识别、风险量化和排序以及风险审查。此外，必须规划风险响应、创建并维护风险登记册，并制定风险沟通计划。本节将讨论所有这些风险活动。\n\
  \n![Image](img/00004.jpeg)\n\n### 风险规划\n\n`Risk planning` 涉及多个过程，以确保风险被识别、分析和量化。对已知风险进行优先级排序，并为每种风险准备适当的响应。以下所有活动都是风险规划过程的一部分：\n\
  \n1. **规划风险管理**。随着风险规划的实施，创建并编辑风险管理计划。\n2. **识别风险**。确定项目风险并创建风险登记册。\n3. **执行风险分析**。对风险进行定性和定量的分析，以记录风险概率、影响、排名和紧急性。将这些信息记录在风险登记册中。\n\
  4. **制定风险响应**。确定用于应对每种已知风险的策略，并将这些策略记录在风险登记册中。\n\n随着风险规划中每一步的执行，都应导致所有相关项目文档的更新，例如风险登记册（在本章稍后描述）。一旦完成所有风险规划步骤并记录了所有决策，风险管理计划将最终定稿，并成为项目管理计划的一部分。\n\
  \n`risk management plan` 是一份描述可能影响项目的所有已知风险以及用于处理每种风险的策略的文档。风险管理计划应包含以下细节：\n\n![Image](img/00003.jpeg)\
  \ **风险方法论**：列出用于风险管理的方法、工具和数据源。\n\n![Image](img/00003.jpeg) **角色与职责**：定义风险管理团队成员及其职责。\n\
  \n![Image](img/00003.jpeg) **风险预算**：估计预算中预留用于风险的资金。`Contingency reserves` 已知风险，而`management\
  \ reserves`涵盖未知风险。\n\n![Image](img/00003.jpeg) **风险分类**：根据潜在原因对风险进行分组，例如外部、内部或技术性。\n\
  \n![Image](img/00003.jpeg) **风险概率和影响**：根据风险分析定义每种风险的概率和影响。\n\n![Image](img/00003.jpeg)\
  \ **利益相关者容度**：定义每个利益相关者对已知风险的容度。这通常仅以货币形式记录为整体利益相关者容度。\n\n![Image](img/00003.jpeg)\
  \ **报告**：定义如何记录、分析风险活动并与项目团队及利益相关者进行沟通；使用这些信息创建风险管理计划。\n\n![Image](img/00003.jpeg)\
  \ **跟踪**：记录如何跟踪和审计风险活动。\n\n一旦风险规划完成且项目工作开始，项目经理应确保根据风险管理计划控制风险。与项目管理计划的所有其他部分一样，风险管理计划被视为动态文档，可能会在整个项目生命周期内发生变化。\n\
  \n![Image](img/00004.jpeg)\n\n## 风险识别\n\n`Risk identification` 是预先确定哪些风险可能影响项目并记录在风险管理计划中的过程。通过在规划阶段执行这些任务，项目经理能够预测风险事件并在风险发生时迅速采取。项目经理应与项目团队和利益相关者合作，分析项目的各个方面——包括项目成本、进度、质量、人员、范围、利益相关者和采购——以确定对项目的任何预期风险。\n\
  \n在风险识别期间，项目经理可能决定采用以下部分或全部信息收集技术：\n\n![Image](img/00003.jpeg) **头脑风暴**：在协调人的帮助下获取项目风险列表。可以使用风险分类来帮助此过程。\n\
  \n![Image](img/00003.jpeg) **访谈**：鼓励项目团队成员、利益相关者和领域专家识别风险。\n\n![Image](img/00003.jpeg)\
  \ **根因分析**：识别项目问题以及导致这些问题的原因，然后制定预防措施。\n\n![Image](img/00003.jpeg) **德尔菲法**：基于专家意见制定风险列表。\n\
  \n绘图技术也可用于识别风险，包括因果图、流程图和影响图。SWOT 分析可以用于内部确定可能影响项目的风险。\n\n**注意**\n有关使用 SWOT 分析的详情，请参见第\
  \ 12 章“项目管理工具”。\n\n风险识别完成后，项目经理可以开始创建风险登记册（在本章稍后描述）。\n\n![Image](img/00004.jpeg)\n\
  \n### 风险量化和排序\n\n`Risk quantification` 涉及执行两种类型的风险分析——定性风险分析和定量风险分析——以确定风险对项目目标的影响。\n\
  \n![Image](img/00003.jpeg) **定性风险分析**：根据概率和影响对风险进行优先级排序和合并。定性风险分析涉及执行风险概率和影响评估，以制定概率和影响矩阵，从而为指导风险响应提供风险评分。在此分析过程中还会确定风险分类和风险紧急性。风险分类可以基于风险来源、受影响的项目区域或任何其他有效的区分。风险紧急性可以根据检测风险的概率、响应风险所需的时间、风险症状或警告信号以及风险评分进行分配。当定性风险分析完成后，每种风险的概率、影响、排名、紧急性和分类信息应被添加到风险登记册中。\n\
  \n![Image](img/00003.jpeg) **定量风险分析**：从数值上分析风险对项目目标的影响。定量风险分析涉及为已识别的风险分配数值。可以使用访谈、概率建模、敏感性分析、期望货币值分析以及建模和模拟技术收集数据。当定量风险分析完成后，风险登记册通常会更新一份排序后的量化风险列表。\n\
  \n两种类型的风险分析通常都包含将专家判断作为分析的一部分。\n\n在量化风险时，风险通常等于概率乘以风险的影响。\n\n\n\n\n\n**示例：** 如果由于攻击导致\
  \ Web 服务器宕机一天的影响为 $100,000，且发生的概率是每年发生四次，那么对 Web 服务器单次攻击的风险可以量化为 $25,000。这个例子之所以简单是因为它分配了定量值，但请记住，并非所有风险都可以进行定量评估。\n\
  \n风险量化的最终结果是一个风险优先级排序列表。这种风险优先级排序确保了根据每个识别出的风险的优先级，制定相应的风险响应计划。高优先级风险可能会有详细的计划；中等优先级和低优先级风险在风险管理计划中可能没有那么详细的计划。确保所有风险都有相关的行动计划将有助于项目团队在遇到特定风险时知道该如何做。\n\
  \n![Image](img/00004.jpeg)\n\n## 风险响应计划\n\n风险响应规划涉及制定行动以增强项目的机会并减少对项目的威胁。风险根据其优先级进行处理，并可以根据需要向项目中添加资源和活动来应对。该过程始于检查风险登记册并分析负面风险（威胁）和正向风险（机会）。\n\
  \n***\n\n### 注意\n\n特定的风险响应（正向和负面）将在本章的“风险策略”部分讨论。\n\n***\n\n在某些情况下，项目经理需要创建基于某些事件的应急计划，这些事件被称为风险触发因素。应急计划应包含导致计划实施的触发事件或条件的详细说明。\n\
  \n## 风险审查\n\n风险审查涉及在项目的监控和控制阶段定期调查风险，以检测可能出现的任何新风险，并确保所计划的风险策略仍然有效。每当风险事件发生、阶段或步骤完成之前，以及当影响项目的情况发生变化时，都应该对风险进行审查。在风险审查期间，应该审查项目的各个方面，以确保所有风险都已识别，且风险策略仍然有效。\n\
  \n![Image](img/00004.jpeg)\n\n## 风险登记册\n\n风险登记册是记录风险规划期间识别出的所有风险的文档。它应该包含基本的风险注释、风险评估信息和风险响应细节。如果在执行阶段发现了新风险，也应该将它们添加到风险登记册中。图\
  \ 8-1a、8-1b 和 8-1c 显示了示例风险登记册模板的三个部分。注意，在实际操作中，这些将是电子表格中的连续列；此处为了阅读，分别显示了这些部分。\n\
  \n![Image](img/00022.jpeg)\n\n**图 8-1a** 风险登记册模板：基本风险信息\n\n![Image](img/00023.jpeg)\n\
  \n**图 8-1b** 风险登记册模板：风险评估信息\n\n![Image](img/00024.jpeg)\n\n**图 8-1c** 风险登记册模板：风险响应信息\n\
  \n风险登记册中的基本风险注释可能包括以下类型的事实：\n\n![Image](img/00003.jpeg) **风险编号：** 风险的唯一标识符。\n\n\
  ![Image](img/00003.jpeg) **风险描述：** 可能会发生什么风险以及它可能如何影响项目。\n\n![Image](img/00003.jpeg)\
  \ **负责人：** 谁负责处理该风险。\n\n![Image](img/00003.jpeg) **报告日期：** 风险最初报告的时间。\n\n![Image](img/00003.jpeg)\
  \ **最后更新：** 风险信息最后一次更新的时间。\n\n风险登记册中的风险评估信息应该包含以下点：\n\n![Image](img/00003.jpeg)\
  \ **影响：** 根据风险评估确定的风险的潜在影响。\n\n![Image](img/00003.jpeg) **影响描述：** 对项目范围、进度、预算或项目其他方面的具体影响。\n\
  \n![Image](img/00003.jpeg) **概率：** 根据风险评估确定的风险发生的可能性。\n\n![Image](img/00003.jpeg)\
  \ **时间线：** 预计风险发生的时间，通常以宽泛的术语给出，如*短期*、*中期*和*长期*。\n\n![Image](img/00003.jpeg) **响应状态：**\
  \ 是否已为应对该风险制定了计划。\n\n风险登记册中的风险响应细节可能包括此类具体信息：\n\n![Image](img/00003.jpeg) **已完成的行动：**\
  \ 为处理风险而采取的行动。\n\n![Image](img/00003.jpeg) **计划中的未来行动：** 该风险仍待完成的行动。\n\n![Image](img/00003.jpeg)\
  \ **风险状态：** 风险的当前状态，例如*开启*（仍可能发生）、*关闭*（已过去或已成功缓解）或*转为问题*（风险已发生）。\n\n风险登记册应该根据组织的需求进行定制。\n\
  \n## 风险沟通\n\n风险沟通，特别是风险报告格式，将作为风险管理计划的一部分进行记录。它定义了如何与项目团队成员和利益相关者就风险进行记录、分析和沟通。大部分文档将在风险登记册中完成。然而，根据风险管理计划，项目经理需要就风险与相关人员进行沟通。\n\
  \n并不是每个项目团队成员和利益相关者都会对每个风险的状态和计划感兴趣。出于此原因，某些项目可能决定在风险登记册中记录某些报告信息，包括在风险发生时应该联系哪些团队成员和利益相关者。无论使用哪种方法，主要目标都是使用每个人偏好的沟通方式，让项目团队成员知晓风险状态。\n\
  \n***\n\n### 注意\n\n关于项目沟通的详情，请参阅第 9 章“沟通方法与影响”和第 10 章“沟通触发因素与目标受众”。\n\n***\n\n##\
  \ 风险策略\n\n![Image](img/00004.jpeg)\n\n一旦项目风险被识别、分析并确定优先级，项目团队同利益相关者以及项目赞助人必须确定适用于每个风险的风险策略。风险策略取决于风险是*正向*（项目希望发生的理想事件）还是*负面*（项目应该防止的不良事件）：\n\
  \n![Image](img/00003.jpeg) **负面风险响应：** 接受风险、缓解风险、转移风险或回避风险。\n\n![Image](img/00003.jpeg)\
  \ **正向风险响应：** 接受风险、利用风险、增强风险或共享风险。\n\n以下章节将描述这些响应并提供每种策略的示例。\n\n***\n\n### 注意\n\n\
  本章涵盖的风险策略比 Project+ 目标列出的多。CompTIA 的目标列表包含以下声明：\n\n每个目标下方以项目符号形式提供的示例列表并非详尽列表。与每个目标相关的其他技术、流程或任务示例也可能出现在考试中，尽管它们未在[目标]中列出。\n\
  \n根据作者的现实经验，为了让读者对风险策略有更广泛的理解，本章讨论了大多数项目管理文档中认可的所有风险策略。\n\n\n\n\n请记住，未来的风险评审可能会在获得更多关于风险的信息后，做出改变风险状态的决定。没有任何一种风险策略是一成不变的，根据新数据，之前接受的风险可能会迅速变得不可接受。所有项目管理文档都是活文档，应随着项目变更的识别而进行编辑。\n\
  \n### 接受风险\n\n`风险接受` 是一种针对负面风险和正向风险的风险策略。通过这种策略，项目团队承认风险的存在但决定不采取任何行动。对于负面风险，当没有具有成本效益的方法或适当应对策略时，通常会选择接受风险。对于正向风险，当团队决定不追求该机会时，通常会选择接受风险。\n\
  \n**示例：** 一个项目团队在某建筑改造项目中将地震识别为一项负面风险。通过研究，团队发现该地区地震发生的概率非常低，而且将建筑改造为防震结构既成本高昂，也不符合当地建筑法规的要求。在这种情况下，项目团队可能会决定接受地震造成的损害风险。\n\
  \n### 缓解风险\n\n`风险缓解`](part0034.html_gloss304) 是一种针对负面风险的策略，通过项目团队降低风险发生的概率或减轻风险的预期影响来实现。\n\
  \n**示例：** 一个新的 Web 服务器开发项目识别出一项负面风险，即服务器可能会过载，导致性能问题。为了缓解这一风险，项目团队决定部署 Web 服务器集群。\n\
  \n缓解风险的选项包括此类策略，例如在投入生产之前开发原型、采用更简单的流程以减少用户错误、实施更多测试、选择更稳定的采购供应商等。缓解并不能防止风险的发生，而是在风险发生时限制其影响。\n\
  \n### 转移风险\n\n`风险转移` 是一种针对负面风险的策略，将风险影响转移给另一方。这种风险策略几乎总是涉及向另一方支付以以承担风险。购买保险可能是最为人知的风险转移方法。\n\
  \n**示例：** A 公司需要一个电子商务网站。由于该没有没有创建和管理该网站所需的人力或专业知识，A 公司决定将网站的开发和管理外包给专门从事此类工作的 B\
  \ 公司。这种策略将电子商务网站的大部分风险从 A 公司转移到了 B 公司。\n\n### 规避风险\n\n`风险规避` 是一种针对负面风险的策略，通过项目团队消除风险或保护项目免受风险的影响。该策略最流行的方法是修改项目管理计划，从项目中完全消除威胁，但这种选项并非总是可行。最激进的风险规避方法是关闭项目。\n\
  \n**示例：** 一个项目计划使用第三世界国家的供应商，但由于政治动荡，源头的交付延迟已成为可能事件。为了规避这一风险，项目团队可能会决定不从不稳定或危险国家的供应商处采购。他们甚至可以更进一步，决定只从项目所在地同的国家的供应商处采购。\n\
  \n### 利用风险\n\n`风险利用` 是一种针对正向风险的策略，通过项目团队确保风险的发生。\n\n**示例：** 一家烘焙店正在开发新甜点。在开发过程中，发现了一种新的生产技术，可以降低\
  \ 20%的甜点生产成本。为了利用这一机会，项目经理确保团队成员接受了使用新技术的培训。\n\n### 增强风险\n\n`风险增强` 是一种针对正向风险的策略，通过项目团队识别影响风险的关键驱动因素并调整这些因素以增加风险概率。\n\
  \n**示例：** 项目团队识别出关键路径上的某项任务，在增加一名团队成员的帮助下可以缩短整月的项目进度。项目经理决定增加该资源，以便项目尽早完成。\n\n###\
  \ 分享风险\n\n`风险共享` 是一种针对正向风险的策略，将风险的部分所有权分配给第三方。\n\n**示例：** 一个值得追求的项目需要敏捷开发实践。由于项目团队没有敏捷专家，团队决定与一家专攻敏捷开发的公司合作，以便两家公司都能从这个新项目中获益。\n\
  \n## 备考准备任务\n\n正如引言中“如何使用本书”部分提到的，你有几种准备备考的选择：这里的练习题；`第 15 章`、“最终准备”以及在线 Pearson\
  \ Test Prep 模拟测试软件。\n\n## 复习所有关键主题\n\n复习本章最重要的主题，这些主题在页面外边角标有关键主题图标。`表 8-2`\n\n\
