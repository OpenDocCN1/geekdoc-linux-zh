  \n# 第一部分：项目基础\n\n## 第 1 章 项目属性与阶段\n\n本章涵盖了以下主题：\n\n- 理解项目的定义：项目属性，包括临时性、开始与结束、唯一性以及原因/目的。\n\
  - 理解项目作为计划的一部分：项目如何融入组织的整体计划中。\n- 理解项目作为投资组合的一部分：项目如何融入组织的整体投资组合中。\n- 比较和对比标准的项目阶段：启动阶段、规划阶段、执行阶段、监控和控制阶段以及结束阶段。\n\
  \n每个行业都有项目。承包商建造建筑。IT 公司发布新服务。医院修订流程以符合新标准或法规。零售业务为客户推出新的移动应用程序。所有这些活动都是项目，即使组织没有明确地称其为“项目”或没有完成正式的项目管理阶段。\n\
  \n\n\n\n\n项目具有临时性，因为它有定义的开始时间、结束时间、范围、预算和资源。如果这些参数在项目开始时没有被定义，你将无法衡量项目的成功或失败。因此，所有类型的组织都应该聘用具有项目管理知识的专业人士。\n\
  \n项目管理知识涉及理解所有项目的属性、理解项目作为组织整体项目计划和项目组合的一部分，以及理解所有项目的各个阶段和知识领域。\n\n本章涵盖了 CompTIA\
  \ Project+ 考试的以下目标：\n\n**1.1** 总结项目的属性。\n\n**1.3** 比较和对比标准的项目阶段。\n\n***\n\n**注意**\n\
  \n本书在命名五个项目阶段时遵循了大多数项目管理标准，分别为`启动 (Initiating*`、`规划 (Planning)`、`执行 (Executing)`、`监控与控制\
  \ (Monitoring and Controlling)` 和`结束 (Closing)`。某些组织（包括 CompTIA）可能会使用略有不同的措辞（`Initiation`、`Close`\
  \ 等），但阶段是相同的。注意 Project+ 考试中阶段名称的变体，以避免被术语误导。有关已知词汇差异的详细列表，请参阅第 15 章，`最终准备.`。\n\n\
