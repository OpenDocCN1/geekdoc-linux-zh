  \n**d.** 在所有工作完成之前，预算将耗尽。\n\n# 第 4 章 项目进度\n\n本章涵盖了以下主题：\n\n![Image](img/00003.jpeg)\
  \ **理解项目进度：** 工作分解结构 (WBS) 和进度安排活动。\n\n项目的一个主要局限性是进度，它是在项目的规划阶段建立的。项目经理负责在整个项目过程中管理进度。如果任务持续时间比最初预计要长，则需要提供更多资源，或者必须更改项目结束日期。因此，项目经理需要仔细管理项目进度。\n\
  \n***\n\n注意\n\n深入理解项目成本对于规划项目进度至关重要。有关项目相关成本的规划和控制细节，请参阅第 3 章 “项目成本控制”\n\n***\n\n\
