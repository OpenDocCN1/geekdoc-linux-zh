  **b.** 项目团队成员\n**c.** 项目赞助者\n**d.** 项目利益相关者\n\n**3.** 下列变更如果获得批准，哪一个可能会改变项目的进度？\n\
  **a.** 添加了一个利益相关者。\n**b.** 添加了一个团队成员。\n**c.** 团队成员的薪资比预期高。\n**d.** 利益相关者确定了一个新需求。\n\
  \n**4.** 下列变更如果获得批准，哪一个可能会改变项目的预算？\n**a.** 采购的完成成本更高。\n**b.** 采购的交付时间比预期长。\n**c.**\
  \ 添加了新的利益相关者。\n**d.** 项目赞助者无法参加阶段性评审。\n\n**5.** 在项目执行期间，发现了一个新的项目风险。一旦风险管理计划更新，应该通知哪个项目实体？\n\
  **a.** 项目赞助者和项目团队成员\n**b.** 项目利益相关者和项目团队成员\n**c.** 项目赞助者和项目利益相关者\n**d.** 项目赞助者、项目利益相关者和项目团队成员\n\
  \n**6.** 为什么应该将项目里程碑记录在项目进度表中？\n**a.** 以确保发生适当沟通\n**b.** 以确保依赖任务准时开始\n**c.** 以确保为里程碑的完成留出时间\n\
  **d.** 以确保项目由变更控制委员会（CCB）审查\n\n**7.** 哪种通信触发确保依赖活动开始？\n**a.** 阶段性评审\n**b.** 任务启动/完成\n\
  **c.** 里程碑\n**d.** 审计\n\n**8.** 在项目期间，不同阶段的项目经理与项目赞助者会面，决定项目是否继续。这个过程称为什么？\n**a.**\
  \ 阶段性评审\n**b.** 里程碑\n**c.** 审计\n**d.** 变更控制过程\n\n**9.** 哪种项目事件可能导致业务连续性响应？\n**a.**\
  \ 审计\n**b.** 变更请求\n**c.** 事件\n**d.** 已批准的变更请求\n\n**10.** 项目任务在其先置任务完成之前无法启动。这是哪种任务关系？\n\
  **a.** 开始-开始 (SS)\n**b.** 开始-结束 (SF)\n**c.** 完成-完成 (FF)\n**d.** 完成-开始 (FS)\n\n###\
  \ 基础主题\n\n虽然项目通信根据项目需要每天或每小时（甚至每分钟）按需频繁地进行，但某些类型的项目通信是正式且可预测的，例如成本报告、状态报告和质量报告。其他类型的通信可能并不直观明显，但它们也需要发生，以确保没有隐藏的陷阱偏离利益相关者的预期。\n\
  \n与规划风险响应一样，项目经理必须准备好沟通普通的项目更新，同时知道在最坏的情况下如何应对。通信触发因素是项目中需要与项目团队和利益相关者进行通信的事件或条件。对于\
  \ Project+ 考试，项目经理必须理解通信触发因素和目标观众，包括审计、项目规划、项目变更、风险注册表更新、里程碑、任务启动/完成、阶段性评审、事件响应和业务连续性响应。\n\
  \n![Image](img/00004.jpeg)\n\n### 审计\n\n审计是项目监控和控制阶段的一部分。`审计` 验证项目交付物符合项目管理计划中设定的指南，以验证项目的绩效。审计通常用于验证项目的范围、质量和法规合规性，但它们也可以验证成本或进度的合规性，识别新风险，或确定风险是否即将发生。\n\
  \n项目审计提供两个益处：\n\n![Image](img/00003.jpeg) 获取有关特定组件的具体数据，以确定项目如何符合其目标\n\n![Image](img/00003.jpeg)\
  \ 激励团队成员和利益相关者，他们将审计视为管理监督的证据\n\n审计结果应该仔细分析，以确定项目执行是否符合预期。如果发现任何问题，应将其作为审计报告的一部分记录。根据审计结果，项目经理应与项目团队合作，识别任何可以改进审计发现问题的纠正措施。\n\
  \n当审计报告完成后，项目经理应将审计结果分发给通信计划中列出的接收者。通常，这些报告将与项目团队成员、项目赞助者以及任何要求审计结果的项目利益相关者共享。与项目赞助者和利益相关者沟通审计结果允许他们分析结果并提供相关的反馈。与项目团队成员沟通审计结果可确保他们理解影响其项目任务或进度的审计发现。审计定义在项目管理计划的子计划中：质量审计定义在质量管理计划中，成本审计定义在成本管理计划中，以此此类推。\n\
  \n**示例：** 一个制造项目的管理计划包括定期审计，以确保生产的零件符合特定的设计规范和成本范围。如果审计显示没有值超出要求的标准，则项目经理将发送正常的审计报告。然而，通信计划包含一个审计触发因素，如果值超出质量或成本规范，则指示项目经理与某些团队成员召开会议，讨论需要对项目进行哪些调整以解决这些问题。\n\
  \n\n\n\n\n大多数项目计划文档是在项目的规划阶段（Planning phase）创建的。由于这些文件每一个对于项目的成功都至关重要，项目经理应确保所有文档都存储在中心位置，并确保需要访问这些文档的人员至少能够读取这些文档。\n\
  \n项目管理计划描述了将如何执行、监控和控制项目。该文档整合了许多子计划和基线（baselines）。这些文件中的每一个都有特定的用途，正如第 1 章“项目属性与阶段”中所讨论的。一旦创建了每个文档，确保建议的目标受众收到或获得该文档的访问权限是非常重要的（参见表\
  \ 10-2）。然而，组织及其项目管理办公室可能需要根据项目和组织需求对文档的目标受众进行自定义。\n\n***\n\n### 注意事项\n\n本书的第 1 章重点关注\
  \ Project+ 考试目标中指定的子计划和基线，正如 CompTIA 所述，这不是一个完整的列表。表 10-2 包含了项目管理标准中列出的某些额外组件。在整个行业，某些组件名称可能会有所不同（例如\
  \ `communication plan` 与 `communication management plan`）。注意 Project+ 考试中可能出现的名称变体，这些可能会让你困惑。\n\
  \n***\n\n### 表 10-2 项目管理计划组件和目标受众\n\n| 组件 | 建议的目标受众 |\n| --- | --- |\n| 变更管理计划 |\
  \ 项目赞助人和利益相关者、变更控制委员会、任何具有变更流程角的项目成员 |\n| 沟通计划 | 项目赞助人和利益相关者、任何具有沟通角色的项目成员 |\n|\
  \ 配置管理计划 | 项目赞助人和利益相关者、项目团队成员 |\n| 成本基线 | 项目赞助人、任何具有预算角色的项目成员 |\n| 成本管理计划 | 项目赞助人和利益相关者、项目团队成员\
  \ |\n| 人力管理计划 | 项目赞助人和利益相关者 |\n| 过程改进计划 | 项目赞助人和利益相关者、项目团队成员 |\n| 采购管理计划 | 项目赞助人和利益相关者、采购供应商、任何具有采购角色的项目成员\
  \ |\n| 质量管理计划 | 项目赞助人和利益相关者、任何具有质量控制/保证角色的项目成员 |\n| 需求管理计划 | 项目赞助人和利益相关者、项目团队成员\
  \ |\n| 风险管理计划 | 项目赞助人和利益相关者、项目团队成员 |\n| 进度基线 | 项目赞助人和利益相关者、项目团队成员 |\n| 进度管理计划 |\
  \ 项目赞助人和利益相关者、项目团队成员 |\n| 范围基线 | 项目赞助人和利益相关者、项目团队成员 |\n| 范围管理计划 | 项目赞助人和利益相关者、项目团队成员\
  \ |\n| 利益相关者管理计划 | 项目赞助人、团队成员 |\n\n由于这些文档在整个项目生命周期内发生变化，项目经理应该建立版本控制流程，并在文档发生更改时与相关的个人和小组进行沟通。\n\
  \n![Image](img/00004.jpeg)\n\n### 项目变更\n\n`变更请求` 是对修改任何文档、交付物或基线的正式提议。变更请求录入 `变更日志`\
  \ 中，这是项目期间请求的所有变更完整列表。变更日志包含了变更的日期和时间、成本、风险影响以及其他细节（示例参见图 10-1）。可能会出于多种原因请求变更，例如纠正措施、预防性措施和修复。\n\
  \n![Image](img/00025.jpeg)\n\n### 图 10-1 变更日志示例\n\n***\n\n### 注意事项\n\n关于项目内部处理变更的正式流程的详情，请参见第\
  \ 11 章“变更控制”。\n\n***\n\n一旦请求变更，变更控制委员会（CCB，根据变更管理计划，通常由项目经理和其他项目团队成员组成）就会面评审变更请求并决定批准还是拒绝变更。变更请求的处理结果应更新在变更日志中，所有批准的变更请求应由相应的项目团队成员实施。项目经理、项目团队成员、CCB\
  \ 成员和项目赞助人需要访问变更日志。变更可能需要更新适当的项目管理计划组件和项目文档。如果基线发生变化，这些变更应仅显示从当前时间开始向后的更改。根据受影响的项目组件，变更需要与相关人员进行沟通。\n\
  \n项目经理需要控制某些变更，包括进度变更、利益相关者变更、资源变更和预算变更。无论发生何种类型的变更，项目经理都有责任确保变更得到适当记录并告知相关的项目实体。\n\
  \n![Image](img/00004.jpeg)\n\n### 进度变更\n\n进度变更包括影响项目进度的任何变更请求，例如任务延迟、任务估计不准确和采购延迟。进度变更被批准后，需要更新项目进度基线，并可能需要移动里程碑。\n\
  \n**示例：** 一个项目团队成员确定若干任务所需的时间将比原计划长。一旦 CCB 批准了进度变更，就需要更新进度基线以反映受影响任务的新任务持续时间。此更改还将影响任何依赖任务。\n\
  \n每当发生进度变更时，都需要通知项目赞助人、项目利益相关者项目团队成员。\n\n### 利益相关者变更\n\n![Image](img/00004.jpeg)\n\
  \n项目中发生的利益相关者变更有两种类型。首先，利益相关者（如项目团队成员）可能会从项目中移除或添加到项目中。其次，利益相关者可能会提交影响项目范围、时间、成本、质量或采购的变更请求。当利益相关者变更被批准后，需要更新适当的项目文档。\n\
  \n**示例：** 一位项目利益相关者离开了公司并被另一个利益相关者取代。在这种情况下，项目经理需要编辑利益相关者注册和利益相关者管理计划。项目赞助人和项目团队成员需要被这些变更。\n\
  \n**示例：** 一位利益相关者联系项目经理，请求向项目添加一个新需求。该变更请求需要由 CCB 分析。如果批准，更改将体现在需求管理计划中。此外，根据变更的影响，项目经理可能需要更新成本基线和/或进度基线。即使请求未获批准，也需要就请求的变更通知项目赞助人、利益相关者团队成员。这确保了请求者理解变更请求的处理结果，并且团队成员知道不要实施该变更请求，即使在以后私下收到此类请求。\n\
  \n\n\n\n\n示例：一个项目团队在多个地点工作，团队成员之间通常通过每周项目状态视频会议进行交流。一位项目利益相关者对团队正在开发的一个新应用程序请求了功能变更。在正式的变更控制过程中，该变更被拒绝了。下周，该利益相关者在与一名应用程序开发人员通话时提到了该请求的变更。通话后，该开发人员决定包含此功能实际上不会影响进度，于是她实现了允许该功能运行的代码。如果项目经理向整个团队共享了变更日志，所有团队成员（包括应用程序开发人员）都会知道该变更请求已被拒绝。\n\
  \n![Image](img/00004.jpeg)\n\n### 资源变更\n\n资源变更包括对项目资源的任何更改，例如物资、采购和人员资源的变更。当资源变更获得批准后，可能需要更新资源日历、项目进度计划、进度基准和其他文档。如果资源变更涉及人员，项目经理应通知项目团队和利益相关者。如果资源变更涉及供应或采购，项目经理只需要通知受该资源影响的团队成员，且仅在变更影响项目任务时才通知。\n\
  \n示例：一名项目团队成员必须请意外假，项目已为该项目分配了一名替代成员。分配给原团队成员的任务被重新分配给新团队成员。如果新团队成员能够以原团队成员相同的速度完成工作，唯一的更新将是分配给任务的资源。然而，如果新团队成员完成工作的速度不同，分配给新团队成员的任务持续时间必须进行调整，这也会影响任何依赖任务。需要通知项目发起人、项目利益相关者和项目团队成员进度已发生变化。\n\
  \n示例：分配了一台推土机来完成一项建筑项目的平整工作。然而，该特定机器在需要该推土机的五天任务期间被安排了维修。项目经理有两个选择：推迟涉及推土机的任务，或者租赁另一台推土机以防止进度延误。任务延迟将需要调整进度基准，更新负责推土机的团队成员，并通知任何负责依赖任务的团队成员。租赁另一台推土机将需要调整成本基准，更新项目进度计划以将新推土机分配给任务，并告知项目发起人预算变更。\n\
  \n![Image](img/00004.jpeg)\n\n### 预算变更\n\n预算变更要求项目预算的减少或增加。预算变更可能包括采购成本增加、项目团队成本减少、影响项目成本的任务持续时间增加、项目发起人减少预算等。当预算变更获得批准后，可能需要更新成本基准、项目预算和成本管理计划。\n\
  \n示例：某某项目采购面临的成本高于根据供应商提案的最初估算。一旦变更控制委员会（CCB）批准了这一预算变更，项目经理需要更新成本基准、项目预算、成本管理计划和采购管理计划。\n\
  \n预算变更需要沟通给项目发起人和希望了解预算状态的利益相关者。可能没有必要与所有项目团队成员共享预算变更，但具有预算或采购角色的项目团队成员应该得到通知。\n\
  \n## 风险注册表更新\n\n风险注册表包含了所有识别出的正面和负面项目风险。可能影响风险注册表的事件包括更改责任方、更改风险状态以及添加新发现的风险。变更获得批准后，应用新信息更新风险注册表。\n\
  \n提示\n风险只有在发生时才会变得重要。新识别的风险只是被确认、分析和记录。\n\n示例：负责某项风险的人正在离开项目。一旦确定了新的责任方，就应移除原责任人的姓名并添加新人员。如果发现了新风险，则需要对其进行彻底分析并添加到风险注册表中，以便规划风险响应。随后，对风险注册表和风险响应计划的变更需要沟通给项目发起人、团队成员和利益相关者。\n\
  \n无论发生何种类型的风险注册表更新，确保变更被妥记录并沟通给适当的项目实体都是项目经理的责任。\n\n### 里程碑\n\n正如第 4 章中“项目进度计划，”所述，里程碑是一个表示项目工作阶段完成的重要项目事件。尽管里程碑本身实际上没有持续时间，但当里程碑达成、错过或移动时，应通知项目发起人、利益相关者和团队成员，以便所有方都对项目状态有现实的认识。例如，如果项目前\
  \ 20%的工作应该达到项目的第一个里程碑，一旦进度表显示已完成 20%的工作，项目经理必须对该里程碑进行报告。报告里程碑是达成（准时达成）、超出（提前达成）还是错过（尚未达成），可以为项目运行情况提供宝贵的见解。\n\
  \n里程碑在高层面上包含在项目章中，并是项目进度计划的一部分。里程碑应在项目进度计划上注明，以便项目经理知道何时报告项目里程碑的实现（或失败）。如果计划内任务发生滑后，里程碑日期可能需要调整。\n\
  \n### 任务启动/完成\n\n![Image](img/00004.jpeg)\n\n在整个项目生命周期中，任务关系作为项目进度计划的一部分控制着任务的启动和完成。当两个或多个项目任务共享依赖关系或逻辑关系时，`前置活动`位于任何依赖活动之前，而`后继活动`位于其依赖的活动之后。\n\
  \n项目任务关系通过四种方式之一定义：\n\n![Image](img/00003.jpeg) `完成-开始 (FS):` 前置活动必须完成，后继活动才能开始。\n\
  \n![Image](img/00003.jpeg) `完成-完成 (FF):` 前置活动必须完成，后继活动才能完成。\n\n![Image](img/00003.jpeg)\
  \ `开始-开始 (SS):` 前置活动必须开始，后继活动才能开始。\n\n![Image](img/00003.jpeg) `开始-完成 (SF):` 前置活动必须开始，后继活动才能完成。\n\
  \nFS 关系是大多数项目中最常见的关系。\n\n由于许多项目任务可能涉及不同的项目团队成员，因此在任务启动和完成时通知项目团队是非常关重要的。任务的完成应该是一个通信触发点。通知可以确保处理依赖后继任务的团队成员能够准时开始任务。\n\
  \n准时启动和完成关键路径上的任务非常重要，以防止项目延误。密切监控这些特定任务。\n\n注意\n\n\n\n\n\n# 第 4 章 讨论了如何确定项目的关键路径。\n\
  \n无论任务是开始还是结束，也无论它们是否在关键路径上，项目经理都负责确保每项任务的启动和完成都得到了妥善记录，并与相关的项目实体进行沟通。\n\n![图像](img/00004.jpeg)\n\
  \n## 关口评审 (Gate Reviews)\n\n要理解关口评审，项目经理必须首先理解`阶段-闸门模型`，也称为`阶段-闸门过程`(phase-gate\
  \ process)或`阶段-闸门过程`(stage-gate process)。大多数项目只通过一次整个项目生命周期过程。在阶段-闸门项目中，一项倡议或项目被分为若干阶段或阶段，并由关口进行隔开。每个关口都会完成项目生命周期中的该阶段，然后在项目移动到下一个阶段之前进行评审。\n\
  \n**示例：** 一项大型多层建筑项目使用阶段-闸门过程将流程细分为各个独立的关口，以确保项目管理的成功。每个独立的方面都是自己的项目，贯穿各个阶段，并在每个部分完成后进行关口评审。场地准备是一个项目关口，混凝土工程是另一个项目关口，钢结构工程是另一个项目关口，以此此类推。通过这种方式，整个项目更具管理性，每个项目经理只负责其个人的独立关口。\n\
  \n在采用阶段-闸门设计的项目中，各个关口之间的关系与之前讨论的任务关系相似。`关口评审`按照项目进度表中的详细说明完成，以允许项目继续。在关口评审期间，项目经理和项目赞助人会面，决定是否继续项目。此时还会进行关口质量控制检查。项目赞助人根据每个关口在计划阶段定义的标准做出继续/终止（go/kill）决策。\n\
  \n项目经理负责确保相关实体知晓关口评审，并在时参加关口评审会议。在大多数项目中，关口评审是项目赞助人的唯一责任，项目经理参与以便在出现问题时提供项目细节。一旦项目关口评审完成，项目经理必须确保关口评审结果已记录并与相关的项目实体进行沟通，通常是项目利益相关者和其他关口的项目经理。\n\
  \n![图像](img/00004.jpeg)\n\n### 事件响应与业务连续性响应\n\n`事件`是项目中的一种可能导致项目中断的事件。如果不进行妥善管理，事件可能会升级为紧急情况、危机或灾难。`事件管理`是限制事件对项目干扰程度的过程。\n\
  \n`业务连续性`是项目在发生破坏性事件后继续以可接受水平运行的能力。项目面临的大多数破坏性事件都应该在风险计划期间进行预见和记录，且所有记录的风险都应该有计划的风险响应。如果发生了事件，项目经理应首先咨询风险管理计划，查看该事件是否已被预见。如果没有，项目经理将需要与项目团队成员快速合作，以确定业务连续性响应。\n\
  \n**示例：** 建筑工地发生停电。如果已经预见到了这一风险，项目的风险计划将确保备有替代电源（如发电机）。如果未预见到该风险，项目经理可能需要获得替代电源。如果没有其他电源，则可能需要在电力恢复之前临时停止建筑工地的任务。\n\
  \n业务连续性可能需要包括联系民政当局和通知公众的计划。在某些情况下，组织可能需要通知依赖性组织，例如当服务器遭受攻击时，业务连续性计划可能需要包含服务器故障的计划。项目经理负责确保相关实体知晓关口评审，并在必要时参加关口评审会议。\n\
  \n\n\n\n\n- 完成到开始 (FS) 关系\n- 完成到完成 (FF) 关系\n- 开始到开始 (SS) 关系\n- 开始到完成 (SF) 关系\n-\
  \ 阶段门模型 (phase-gate model)\n- 门审查 (gate review)\n- 事件 (incident\n- 事件管理\n- 业务连续性\n\
  \n## 复习题\n\n这些问题的答案出现在附录 A 中。如需更多示例考试题练习，请使用在线 Pearson Test Prep 练习软件。\n\n**1.**\
