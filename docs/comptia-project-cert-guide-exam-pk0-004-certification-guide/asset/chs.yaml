  - 组织内部差异\n- 关系建立\n\n## 复习题\n\n这些问题的答案出现在附录 A 中。如需进行更多示例考试题练习，请使用在线 Pearson 测试准备练习软件。\n\
  \n**1.** 你的公司需要为其珠宝产品重新设计货架解决方案。该项目的所有规划工作已经完成，项目团队也已选出。作为项目经理，你需要介绍所有团队成员并确保他们理解自己的项目职责。你应该做什么？\n\
  \n**a.** 发送一封电子邮件。\n**b.** 召开视频会议。\n**c.** 召开一次有计划的会议。\n**d.** 召开启动会议。\n\n**2.**\
  \ 一个项目团队在不同的地理位置上负责不同的项目任务。所有团队成员都位于美国时区，并可以使用通信技术。你想与团队进行一次面对面会议。你应该举行哪种类型的会议？\n\
  \n**a.** 收尾会议\n**b.** 面面会议\n**c.** 虚拟会议\n**d.** 启动会议\n\n**3.** 一位项目经理与市场部和公共关系部合作，为当前项目开发一系列新闻稿。这些新闻稿应在整个项目期间定期发布，以向客户和其他利益相关者更新项目进度。哪种通信方法最适合实现这一目的？\n\
  \n**a.** 即时消息\n**b.** 社交媒体\n**c.** 语音会议\n**d.** 视频会议\n\n**4.** 你被聘来接手一个项目。根据上任项目经理的笔记，你担心两个团队成员之间存在冲突。确定这两个人之间的通信是否存在问题的最佳方法是什么？\n\
  \n**a.** 与每个团队成员分别举行面对面会议。\n**b.** 与两名团队成员共同举行一次面对面会议。\n**c.** 与每个团队成员分别举行虚拟会议。\n\
  **d.** 与两名团队成员共同举行一次虚拟会议。\n\n**5.** 你是一个软件开发项目的项目经理。项目启动时，所有团队成员都位于纽约的一个地点。三名团队成员离开了，并被马德里的团队成员取代。所有团队成员都按照相同的时间表工作。并不是所有人都会说英语。关于项目通信，你的主要关注点应该是？\n\
  \n**a.** 文化差异\n**b.** 语言障碍\n**c.** 地理因素\n**d.** 关系建立\n\n**6.** 你是一个设计新应用的项目经理，该应用需要率先上市。该应用具有几项必须保护的专利技术。一位利益相关者要求访问机密项目信息，该该相关者未获得接收这些信息的批准。你应该做什么？\n\
  \n**a.** 咨询项目赞助人以确认利益相关者是否需要这些信息。\n**b.** 拒绝利益相关者的请求。\n**c.** 授予利益相关者对信息的有限访问权限。\n\
  **d.** 为利益相关者提供信息的删减副本，移除机密信息。\n\n**7.** 你是公司的项目经理。当前项目的所有团队成员都是其他部门的员工。你要求在敏捷（scrum）会议期间每日口头状态更新。几个团队成员希望按照部门主管的要求提交书面每周项目状态报告。正在发生哪种通信影响？\n\
  \n**a.** 文化差异\n**b.** 保密限制\n**c.** 组织内部差异\n**d.** 组织间差异\n\n**8.** 项目经理需要识别技术因素影响项目通信的情况。以下哪项是这种影响的例子？\n\
  \n**a.** 一名团队成员被聘为该项目的承包。\n**b.** 一名团队成员与其他成员处于不同的时区。\n**c.** 一名团队成员将英语作为第二语言。\n\
  **d.** 一名团队成员的互联网连接不稳定。\n\n**9.** 你识别出项目中的一位利益相关者为主导型人格。你需要向该利益相关者传递一些项目信息。该利益相关者偏好面对面通信，紧急情况除外。你应该使用哪种通信方式？\n\
  \n**a.** 以书面形式提供事实即可。\n**b.** 以书面形式提供大量细节。\n**c.** 口头提供大量细节。\n**d.** 口头提供事实即可。\n\
  \n**10.** 在当前项目中，你想确保项目团队成员和项目利益相关者能够合作以实现项目目标。在启动会议期间你应该开展什么活动？\n\n**a.** 讨论个人通信偏好。\n\
  **b.** 解释语言障碍。\n**c.** 执行关系建立活动。\n**d.** 解释文化差异。\n\n## 第 10 章。通信触发因素与目标受众\n\n本章涵盖了以下主题：\n\
  \n![Image](img/00003.jpeg) **理解通信触发因素：** 触发因素包括审计、项目规划、项目变更、风险注册更新、里程碑、任务启动/完成、阶段评审、事件响应和业务连续性响应。\n\
  \n![Image](img/00003.jpeg) **理解通信目标受众：** 通信的目标受众包括项目赞助人、利益相关者和团队成员。\n\n![Image](img/00003.jpeg)\
  \ **理解通信原理：** 项目通信 set 原理。\n\n通信触发因素是在发生后必须向适当受众报告的项目事件或条件。在项目的规划阶段，项目经理创建项目计划及其辅助文件，其中包括通信计划。该计划详细说明了在项目执行、监控控制和收尾阶段必须发生的通信，并列出了这些项目通信的目标受众。项目经理负责了解何时以及如何让参与方保持在知情状态。\n\
  \n本章讨论了项目通信的常见触发因素，以及每种类型通信的目标受众和原理。\n\n本章涵盖了 Project+ 考试的以下目标：\n\n**3.3** 解释常见的通信触发因素，并确定目标受众和原理。\n\
