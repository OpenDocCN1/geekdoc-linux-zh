  \n## 附录 A. “我已经知道了吗？”测验和复习题的答案\n\n### 第 1 章\n\n### “我已经知道了吗？”测验\n\n**1.** B. 项目是临时的，不是永久的。项目有定义的开始和结束时间，是独特的，并且有说明的理由或目的。\n\
  \n**2.** A. 组织的组合包含了其为了实现战略目标而管理的所有项目、计划和运营。\n\n**3.** C. 项目章程是在项目的启动阶段创建的。\n\n\
  **4.** D. 工作分解结构（`WBS`）是在项目的规划阶段创建的。\n\n**5.** A. 项目交付物是在项目的执行阶段创建的。\n\n**6.** C.\
  \ 项目经理在项目的监控和控制阶段指导质量保证。\n\n**7.** D. 变更控制是项目监控和控制阶段的一项活动。\n\n**8.** B. 人力资源管理主要关注组织和管理项目团队以完成项目。\n\
  \n**9.** C. 项目威胁作为风险管理的一部分被识别。\n\n**10.** B. 预算是在成本管理的一部分创建的。\n\n## 复习题\n\n**1.**\
  \ C. 安装最新的操作系统和应用程序更新不是项目。它是日常运营的一部分，每当有更新准备好部署时就会重复。\n\n**2.** D. 列出的所有项目都是项目组合的一部分，这是不正确的。防病毒和防恶意软件更新不是项目。它们是正常的日常运营，每当有更新准备好部署时就会重复。\n\
  \n**3.** B. 你在启动阶段完成新项目的项目章程和业务情况书。\n\n**4.** A. 预算和进度是在规划阶段创建的。\n\n**5.** B. 监控和控制阶段包括在项目交付物创建后识别问题和风险。\n\
  \n**6.** C. 当你记录教训、释放项目资源并获得项目赞助人的项目签字时，你正在完成结束阶段。\n\n**7.** A. 定量和定性风险分析是在规划阶段进行的。\n\
  \n**8.** D. 获取项目团队和执行质量保证是在执行阶段进行的。\n\n**9.** A. 项目时间管理包括活动顺序排序。\n\n**10.** B. 你应该确保项目团队在执行阶段接受适当的培训。\n\
  \n### 第 2 章\n\n### “我已经知道了吗？”测验\n\n**1.** A. 赞助人对项目提供最终批准。\n\n**2.** B. 项目经理不创建交付物；项目团队创建交付物。项目经理管理团队、创建预算并创建进度。\n\
  \n**3.** D. 项目协调支持项目经理并协调跨部门任务。\n\n**4.** C. 项目利益者提供项目需求。\n\n**5.** D. 进度计划员主要关注项目时间。\n\
  \n**6.** C. 项目管理办公室（`PMO`）不负责估算成本。PMO 设置项目管理标准、提供模板并提供工具。\n\n**7.** B. 混合不是项目团队结构。项目团队结构包括矩阵型、职能型和项目型。\n\
  \n**8.** C. 在职能型团队结构中，项目经理几乎没有或没有权限。\n\n**9.** A. 在项目型团队结构中，资源向项目经理汇报。\n\n**10.**\
  \ C. 在职能型团队结构中，资源最可能从其职能部门分配到项目中。\n\n## 复习题\n\n\n\n\n\n**1**. C. 你应该从项目赞助人处获得项目章程和初步预算的批准。\n\
  \n**2.** D. 你将担任项目经理的角色。\n\n**3.** B. 项目协调员将支持你并提供跨部门组织支持。\n\n**4.** A. 项目团队不负责创建项目进度表。那是项目经理（或项目计划员，如果适用）的工作。\n\
  \n**5.** B. 你正在识别项目利益相关者，这包括所有对项目有直接利益的个人或群体。\n\n**6.** C. 项目计划员专门负责确保项目时间得到管理和报告。\n\
  \n**7.** A. 你们公司采用职能团队结构，所有团队成员均向其部门经理报告。\n\n**8.** D. 弱矩阵型项目团队结构赋予项目经理的权限比职能团队结构略高一点。\n\
  \n**9.** A. 在项目化项目团队结构中，项目经理拥有最大的权限。\n\n**10.** B. 项目协调员或项目经理——而不是计划员——负责检查项目质量。\n\
  \n### 第 3 章\n\n### “我已经知道这些了吗？” 问答\n\n**1.** A. 成本控制涉及监控项目成本并管理成本基准的变化。\n\n**2.**\
  \ B. 项目总成本包括直到收尾阶段完成为止产生的所有项目特定成本。\n\n**3.** C. 计算 PV 的公式是 `(planned % complete)—budget`。\n\
  \n**4.** D. `AC + ETC` 公式使用 `ETC` 计算 `EAC`。\n\n**5.** D. `TCPI` 大于一表示项目处于预算内。\n\n\
  ## 复习题\n\n**1**. D. 计划计划值 (`PV`) = `(planned % complete)—budget`。因此，\n\n`PV = 40%—$1,000,000\
  \ = $400,000`.\n\n**2.** C. 实际成本 (`AC`) 是截至目前在项目上花费的实际资金。因此，`AC = $600,000`。\n\n\
  **3.** B. 挣值值 (`EV`) = `(% of completed work)—budget`。因此，\n\n`EV = 40%—$1,000,000\
  \ = $400,000`.\n\n**4.** B. 进度偏差 (`SV`) = `EV—PV`。`EV = 40%—$1,000,000 = $400,000`。\n\
  \n`PV = 60%—$1,000,000 = $600,000`。所以 `SV = $400,000—$600,000 = -$200,000`。\n\n\
  **5.** D. 成本偏差 (`CV`) = `EV—AC`。`EV = 40%—$1,000,000 = $400,000`。\n\n`AC = $600,000`。所以\
  \ `CV = $400,000—$600,000 = -$200,000`。\n\n**6.** D. 进度性能指数 (`SPI`) = `EV/PV`。`EV\
  \ = 40%—$1,000,000 = $400,000`，且 `PV = 60%—$1,000,000 = $600,000`。所以 `SPI = $400,000/$600,000\
  \ = .67`。\n\n**7.** C. 成本性能指数 (`CPI`) = `EV/AC`。`EV = 40%—$1,000,000 = $400,000`。`AC\
  \ = $600,000`。所以 `CPI = $400,000/$600,000 = .67`。\n\n**8.** D. 消耗率 = `1/CPI`。\n\n\
  **9.** B. 就已完成的工作量而言，项目已超预算。正的 `CV` 表示已完成的工作量处于预算内，负的 `CV` 表示已完成的工作量已超预算。值为零表示已完成工作的成本在预算内。\n\
  \n**10.** A. 项目消耗预算的速度比计划慢。消耗率大于一表示项目消耗预算的速度比计划快，并将在所有工作完成之前耗尽预算。消耗率小于一表示项目消耗预算的速度比计划慢，并将在预算内完成。消耗率为一表示项目按计划消耗预算，将在预算内完成。\n\
  \n### 第 4 章\n\n### “我已经知道这些了吗？” 问答\n\n**1.** A. 如果任务 B 依赖于任务 A 的完成，并应在任务 A 之后开始，则发生了依赖关系。\n\
  \n**2.** B. 关键路径是耗时最长的任务序列。\n\n**3.** C. 确定推迟 `LS` 和推迟 `LF` 的方法是从最后一个任务（或）开始并进行逆向计算。\n\
