  \n项目工作说明书\n\n采购协议\n\n假设\n\n约束\n\n项目赞助者\n\n业务理由\n\n高级范围\n\n高级风险\n\n利益相关者注册\n\n###\
  \ 规划阶段\n\n项目进度\n\n项目预算\n\n范围管理计划\n\n工作分解结构 (WBS)\n\n范围基线\n\n范围说明书\n\nWBS 字典\n\n\
  资源\n\n风险\n\n风险登记表\n\n负面风险\n\n正向风险\n\n项目需求\n\n需求管理计划\n\n沟通计划\n\n利益相关者管理计划\n\n采购管理计划\n\
