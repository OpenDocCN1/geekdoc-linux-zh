  创建项目进度涉及执行时间管理活动，以确定项目任务、任务持续时间和任务依赖关系。经批准的项目进度表只能通过正式的变更控制进行更改。项目进度控制允许项目经理识别与项目计划的偏差并采取纠正措施。由于项目进度和项目预算密切相关，项目经理必须理解项目任务完成与项目资金消耗之间的关系。\n\
  \n为了创建项目进度，项目经理必须先创建工作分解结构，然后执行进度活动。\n\n![Image](img/00004.jpeg)\n\n### 工作分解结构 (WBS)\n\
  \n`工作分解结构 (WBS)` 是一份项目文档，它将项目工作细分为可管理的组件。为了创建 `WBS`，项目经理应该使用分解法和自上而下的方法将项目交付物拆分为各个独立的部分。WBS\
  \ 的顶层是项目本身，WBS 的第二层通常是项目的主要阶段。第三层包含项目交付物，第四层是创建项目交付物的具体个人任务。然而，请记住，组织可能有一个已建立的 WBS\
  \ 模板，该结构是根据组织的特定需求设计的。\n\nWBS 在项目经理定义了单个 `工作包` 后结束，工作包是 WBS 中最小的工作单元。每个工作包随后会被分配一个控制账户和一个唯一标识符。这些分配使得对工作包的范围、预算、实际成本和进度的跟踪变得简单。WBS\
  \ 包含一个 `WBS 词典`，提供了有关每个 WBS 组件的交付物、活动和进度信息。\n\n**示例：** `表 4-2` 显示了慈善晚宴活动的 WBS。该活动被分为六个主要部分：计划与监督、晚餐、房间与设备、客人们、员工和演讲者。\n\
