  \n## 复习题\n\n\n\n\n\n这些问题的答案出现在附录 A 中。可以使用在线 Pearson Test Prep 练习测试软件进行更多示例考试题练习。\n\
  \n### 1. 你是一个项目的项目经理，负责为公司的珠宝产品重新设计货架解决方案。这些解决方案将发送到零售店。作为项目规划的一部分，你与团队成员和利益相关者一起头脑暴项目可能面临的陷阱。该小组正在进行哪种风险活动？\n\
  \n**a.** 风险量化\n**b.** 风险识别\n**c.** 风险审查\n**d.** 风险应对\n\n### 2.一个项目团队目前正致力于为所有项目风险分配数值。他们正在完成哪种过程？\n\
  \n**a.** 风险识别\n**b.** 定性风险分析\n**c.** 定量风险分析\n**d.** 风险优先级排序\n\n### 3. 作为项目经理，你负责管理所有项目风险。最近你发现，某个已识别风险发生的概率要高得多。你应该怎么办？\n\
  \n**a.** 将该风险添加到风险登记簿。\n**b.** 对该风险进行风险量化。\n**c.** 改变风险应对。\n**d.** 调整风险登记表中风险的概率。\n\
  \n### 4. 你被聘来管理一个项目。你担心原始的风险规划过程没有识别所有的项目风险。你应该怎么办？\n\n**a.** 执行风险审查。\n**b.** 执行风险识别。\n\
  **c.** 执行风险量化。\n**d.** 执行风险规划。\n\n### 5. 哪份项目文档列出了所有关于已识别项目风险的信息？\n\n**a.** 风险管理计划\n\
  **b.** 概率和影响矩阵\n**c.** 风险策略\n**d.** 风险登记簿\n\n### 6. 你是一个公司礼品线包装设计项目的项目经理。针对其中一个已识别的风险发现了一个缓解措施。然而，该缓解措施的成本可能高于风险发生的成本。应该选择哪种风险策略？\n\
  \n**a.** 风险缓解\n**b.** 风险接受\n**c.** 风险转移\n**d.** 风险规避\n\n### 7. 你是一个公司创建新存储区域网络项目的项目经理。已识别的风险之一是网络访问失败。项目赞助者决定实施冗余网络骨干以确保可访问性。该项目使用的是哪种风险策略？\n\
  \n**a.** 风险转移\n**b.** 风险接受\n**c.** 风险缓解\n**d.** 风险规避\n\n### 8. 下列哪个选项是风险转移的示例？\n\
  \n**a.** 购买建筑险\n**b.** 引入第三方帮助完成项目\n**c.** 部署服务器群而不是单台服务器\n**d.** 采取行动确保风险不发生\n\n\
  ### 9. 处理正向风险的四种风险策略是什么？\n\n**a.** 接受、缓解、转移、规避\n**b.** 接受、利用、增强、共享\n**c.** 接受、增强、转移、共享\n\
  **d.** 接受、增强、缓解、转移\n\n### 10. 一位团队成员发现，公司目前的某个项目可以使用某种专有技术更快地完成。如果你向技术供应商提出一个计划，与其合作完成项目并共享其优势，你正在采用哪种类型的风险策略？\n\
  \n**a.** 风险利用\n**b.** 风险增强\n**c.** 风险共享\n**d.** 风险接受\n\n# 第三部分：沟通与变更管理\n\n## 第 9\
  \ 章 沟通方法与影响\n\n本章涵盖了以下主题：\n\n![Image](img/00003.jpeg) **理解沟通方法：** 方法包括会议、电子邮件和传真、视频和语音会议、即时消息和短信、面对面沟通、印刷媒体的分发以及社交媒体。\n\
  \n![Image](img/00003.jpeg) **理解沟通影响：** 影响包括语言障碍、时区和地理因素、技术因素、文化差异、组织间和组织内部差异、个人偏好、和谐和关系建立、消息内容、关键性因素以及利益相关者的沟通需求。\n\
  \n项目沟通管理是计划、收集、创建、分配、存储、检索、控制和处置项目信息的过程。项目经理花费大部分时间与项目团队成员和利益相关者进行沟通。因此，有效的沟通是项目经理使用的最重要的工具之一。\n\
  \n每次信息交换都会发生沟通。沟通方法可能因项目而异，甚至在一个项目内部也不同。`medium` 是沟通模式，而`noise` 是影响消息传递的干扰或障碍。基础沟通涉及两个实体：发送者和接收者。发送者对接收者编码消息，接收者必须对解码。在某些情况下，接收者可能会确认收到消息。最后，接收者可能会对发送者的消息提供反馈或响应。\n\
  \n三种基本的沟通方法：\n\n![Image](img/00003.jpeg) **拉取式沟通：** 信息存储在中心位置，利益相关者可以根据需要访问信息。\n\
  \n![Image](img/00003.jpeg) **推送式沟通：** 信息发送给需要的特定接收者。\n\n![Image](img/00003.jpeg)\
  \ **交互式沟通：** 信息在两个或多个双方之间双向交换。\n\n沟通可以采取多种形式：\n\n![Image](img/00003.jpeg) 项目内部的沟通\n\
  ![Image](img/00003.jpeg) 与客户、供应商、其他项目和/或公众的外部沟通\n![Image](img/00003.jpeg) 正式沟通，包括报告、纪要和简报\n\
  ![Image](img/00003.jpeg) 非正式沟通，包括电子邮件、备忘录和 *ad hoc* 讨论\n![Image](img/00003.jpeg)\
  \ 通过组织层级进行的垂直沟通\n![Image](img/00003.jpeg) 同级人员之间的水平沟通\n![Image](img/00003.jpeg)\
  \ 通过简报和报告进行的官方沟通\n![Image](img/00003.jpeg) 非官方的、不记录的沟通\n![Image](img/00003.jpeg)\
  \ 书面、口头或言语沟通（通过语调），以及通过肢体语言的语言沟通\n\n项目经理必须对沟通计划进行文档记录，以确保在需要的时间以所需的格式将项目信息发送给需要它的人（特别是与利益相关者的沟通）。\n\
  \n项目经理应该了解项目潜在沟通通道的数量，作为项目沟通复杂性的指南。计算潜在沟通通道总数的的公式为 `n(n – 1) / 2`，其中 `n` 是必须接收沟通的利益相关者或团队成员的数量。例如，如果一个项目有\
  \ 5 个利益相关者和团队成员，公式为 `5(5 – 1) / 2 = 10`，总共有 10 个潜在沟通通道。\n\n\n\n\n\n必须根据利益相关者的需求仔细选择通信技术。影响通信技术选择的因素包括信息所需的紧迫程度、通信技术的可用性、其易用性、项目环境以及信息的敏感性或机密性。\n\
  \n项目经理必须同时理解影响项目的通信方法以及影响沟通的因素。妥当的计划可以确保在项目工作完成之前对这些方法和影响因素记录在案，从而使项目经理无论出现什么情况都能进行有效的沟通。\n\
  \n本章涵盖了 Project+ 考试的以下目标：\n\n**3.1** 给定场景，使用适当的通信方法。\n\n**3.2** 比较并对比影响通信方法的因素。\n\
