  \ 关键路径\n\n**2.** 什么是项目总成本？\n- a. 直到监控和控制阶段完成为止产生的所有特定项目成本\n- b. 直到收尾阶段完成为止产生的所有特定项目成本\n\
  - c. 预算中用于缓解和/或进度风险的准备\n- d. 预算中用于缓解风险的准备\n\n**3.** 计算计划价值 (PV) 的公式是什么？\n- a. (%\
  \ 完成工作量) × 预算\n- b. `EV – AC`\n- c. (计划完成百分比) × 预算\n- d. `EV / AC`\n\n**4.** 公式\
  \ `AC + ETC` 计算的是什么？\n- a. 包含 CPI 和 SPI 的工作的 EAC\n- b. 按当前 CPI 执行工作的 EAC\n- c. 按当前执行工作的\
  \ EAC\n- d. 使用计算出的 ETC 的 EAC\n\n**5.** `TCPI` 大于 1 表示什么？\n- a. 项目在计划时间内。\n- b. 项目在计划时间之外。\n\
  - c. 项目超出预算。\n- d. 项目预算内。\n\n## 核心概念\n\n### 基础主题\n![Image](img/00003.jpeg)\n\n###\
  \ 成本基准\n成本控制涉及监控项目成本和管理成本基准的变化。`cost baseline` #0034.html_66 是批准的项目预算；然而，项目预算会开始。\n\
  \n### 项目总成本\n`Total project cost` #0034.html_370 定义为从启动阶段到收尾阶段产生的所有特定项目成本。该值由所有估计成本\
  \ `TEC` #0034.html_369 以及未包含在 TEC 中的其他与项目相关的成本 `OPCs` #0034.html_192 组成。\n\n###\
  \ 支出跟踪与报告\n支出跟踪和报告有助于项目经理评估项目的财务状况。支出通常根据工作分解结构 `WBS` 进行跟踪，以便每项支出都能链接到特定的活动。`WBS`\
  \ 中的每个活动或任务都将有与完成该活动相关的成本，包括人员、采购、差旅等。\n\n\n\n\n\n项目经理负责根据沟通计划中的规定，向相关的利益相关者提供更新的成本报告，该沟通计划是项目管理计划的一部分。此任务可能包括向利益相关者发送成本报告，或召开会议讨论该报告。在大多数情况下，沟通计划会详细说明何时可以将成本报告直接发送给利益相关者，何时可能需要会议来讨论问题（例如当成本超过某活动预算的特定百分比时）。\n\
  \n***\n\n### 注意\n\n项目沟通和沟通计划将在第 9 章“沟通方法与影响”和第 10 章“沟通触发因素与目标受众.”中进行更详细的讨论。\n\n\
  ***\n\n![Image](img/00004.jpeg)\n\n### 成本控制计算\n\n为了理解成本控制，项目经理必须首先拥有项目的预算和成本基线。一旦在项目的规划阶段确定并批准了成本基线，就会将项目预算与成本基线进行比较，以确定任何偏差。如前所述，随着项目变更的批准，项目预算可能会变化，但成本基线不会改变。\n\
  \n为了执行成本控制，项目经理使用成本基线来衡量项目支出与其成就之间的关系。这些计算显示了预算随时间变化的视图。在开始成本控制计算之前，项目经理必须对比成本基线推导出计划价值、挣值值和已完成工作的实际成本：\n\
  \n![Image](img/00003.jpeg) **计划价值 (PV):** 表示当前已完成工作数量的预算成本。以下公式计算 PV：\n\n```\n(planned\
  \ % complete) — budget\n```\n\n![Image](img/00003.jpeg) **挣值值 (EV):** 显示项目截至目前为止通过已花费资金所获得的价值。以下公式计算\
  \ EV：\n\n```\n(% of completed work) — budget\n```\n\n![Image](img/00003.jpeg) **实际成本\
  \ (AC):** 截至目前在项目上花费的资金。计算 AC 不需要公式；只需简单的加法。\n\n这些值量化了项目到目前的进度，并有助于分析项目运行情况接近预算的程度。\n\
  \n#### 挣值值管理 (EVM)\n\n接下来，项目经理必须理解挣值值管理 (EVM。EVM 计算结合了范围、进度和资源衡量标准来评估项目性能，并使用了四个\
  \ EVM 公式：\n\n![Image](img/00003.jpeg) **进度偏差 (SV):** 挣值值与计划价值之间的差异。\n\n![Image](img/00003.jpeg)\
  \ **成本偏差 (CV):** 在任何给定时间点的预算缺口或盈余。\n\n![Image](img/00003.jpeg) **进度执行指数 (SPI):**\
  \ 挣值值与计划价值的比率。\n\n![Image](img/00003.jpeg) **成本绩效指数 (CPI):** 挣值值与实际成本的比率。\n\n在某些情况下，项目经理可能需要理解消耗率，它简单是指项目预算的消耗速率。消耗率是\
  \ CPI 的倒数。\n\nSV、CV、SPI 和 CPI 都是通过 PV、EV 和 AC 计算得。表 3-3 显示了计算所有 EVM 值的公式。\n\n**表\
  \ 3-3** 挣值值管理 (EVM) 值计算\n\n| EVM | 公式 |\n| :--- | :--- |\n| 计划价值 (PV) | (planned\
  \ % complete) — budget |\n| 挣值值 (EV) | (% of completed work) — budget |\n| 进度偏差\
  \ (SV) | EV – PV |\n| 成本偏差 (CV) | EV – AC |\n| 进度执行指数 (SPI) | EV / PV |\n| 成本绩效指数\
  \ (CPI) | EV / AC |\n| 消耗率 | 1 / CPI |\n\n**示例：** 项目经理有一个项目将在六个月内完成，总成本为 $50,000。计划显示在项目进行三个月后，应完成\
  \ 50% 的工作。PV 的计算如下：\n\n```\nPV = 50% — $50,000\nPV = $25,000\n```\n\n在该项目中，项目经理确定在过去的三个月里，只完成了\
  \ 40% 的工作。随后计算 EV 如下：\n\n```\nEV = 40% — $50,000\nEV = $20,000\n```\n\n在完成成本报告时，项目经理确定截至目前花费的金额为\
  \ $20,000。这就是 AC。现在项目经理可以计算偏差。\n\nSV 的计算如下：\n\n```\nSV = $20,000 – $25,000\nSV =\
  \ –$5,000\n```\n\n正的 SV 表示项目进度提前，负的 SV 表示项目落后于计划。\n\n\n\n\n\n假设项目经理确定该项目剩余部分的 `ETC`\
  \ 为 $30,000。使用计算出的 `ETC` 得到的 `EAC` 如下：\n\n`EAC = $20,000 + $30,000`\n`EAC = $50,000`\n\
  \n此预测显示最终项目成本没有变化。然而，为了得出一个预测范围，你还应该使用另外三个代表 `EVM` 值的公式来计算 `EAC`：\n\n`EAC for work\
  \ performed at current rate = $20,000 + ($50,000 – $20,000)`\n`EAC for work performed\
  \ at current rate = $50,000`\n`EAC for work performed at current CPI = $50,000 /\
  \ 1`\n`EAC for work performed at current CPI = $50,000`\n`EAC for work including\
  \ both CPI and SPI = $20,000 + [($50,000 – $20,000) / (1 — 0.8)]`\n`EAC for work\
  \ including both CPI and SPI = $20,000 + [($30,000) / (0.8)]`\n`EAC for work including\
  \ both CPI and SPI = $20,000 + $37,500`\n`EAC for work including both CPI and SPI\
  \ = $57,500`\n\n除了计算中同时包含 `CPI` 和 `SPI` 的那项计算外，大多数这些计算的预测预算保持不变。结果并不并不总是如此，因为在项目中，`CPI`\
  \ 和 `SPI` 可能匹配，也可能不匹配。\n\n### 完工绩效指数 (TCPI)\n\n项目经理可能需要衡量剩余预算资源所需的成本性能。通过此计算，项目经理心中必须有一个特定的目标，例如项目预算或其中一个\
  \ `EAC` 值。如果显然成本基准不再可行，则应使用 `EAC` 值。为了衡量该值，项目经理将需要使用以下公式之一计算“完工绩效指数 (TCPI)”：\n\n\
  `TCPI using current budget = (Budget – EV) / (Budget – AC)`\n`TCPI using EAC value\
  \ = (Budget – EV) / (EAC – AC)`\n\n**示例：** 回到之前的场景，我们首先使用原始成本基线计算 `TCPI`：\n\n`TCPI\
  \ = ($50,000 – $20,000) / ($50,000 – $20,000)`\n`TCPI = 1`\n\n项目经理认为带有 `CPI` 和 `SPI`\
  \ 的 `EAC` 计算给出了更好的预测，通过使用另一个公式确定 `TCPI`：\n\n`TCPI = ($50,000 – $20,000) / ($57,500\
  \ – $20,000)`\n`TCPI = $30,000 / $37,500`\n`TCPI = 0.8`\n\n`TCPI` 大于一表示项目处于预算内，`TCPI`\
  \ 小于一表示项目超出预算。数值为一表示预算执行情况完全符合计划。对于这个项目，第一个 `TCPI` 值显示项目正按计划进行，但第二个 `TCPI` 值显示项目已超预算。\n\
  \n***\n\n**注意**\n\n不要只记这些公式——要练习使用它们。构思你自己的项目场景，然后完成这些计算。本章末尾“复习题”部分也包含示例。\n\n***\n\
  \n### 储备分析\n\n`储备分析` (`reserve analysis`) 是一种确定保留资金以应对项目可能遇到的任何成本不确定性的方法。要理解储备分析，项目经理必须首先理解\
  \ `项目储备` (`project reserves`)，即预算中用于减轻成本和/或进度风险的准备。大多数项目使用两种项目储备：`管理储备` (`management\
  \ reserves`) 和 `备用储备` (`contingency reserves`)。\n\n`管理储备` 是项目预算的一部分，留作管理控制目的，主要在完成项目范围需要不可预见的工作时使用。这种储备专门针对未知风险。`管理储备`\
  \ 不包含在成本基准中，但它是预算需求的一部分。该任意金额由项目赞助人和项目经理确定。管理储备 只有在被使用时才会成为预算的一部分。\n\n`备用储备` 是分配给项目风险的项目预算的一部分。这种储备专门针对已识别的风险。如果发生了特定风险，则支出分配给该风险的\
  \ `备用储备` 部分。这些储备金额通常使用概率和影响计算来得出。备用储备是成本基准和预算需求的一部分。\n\n管理储备可以根据项目经理的决定使用，通常需与项目赞助人一致。备用储备通常在发生特定风险时才使用，且仅使用分配给该风险的\
  \ `备用储备` 部分。未使用的储备应在项目结束时返回项目赞助人，除非项目管理计划另有规定。\n\n### 变更请求\n\n成本绩效分析可能会导致成本基准、项目进度或其他项目计划其他部分的变更请求。变更请求应作为变更控制过程的一部分处理。如果变更获得批准并涉及资金变更，则需要修订预算。\n\
  \n***\n\n**注意**\n\n变更控制过程将在第 11 章进行更详细的讨论。\n\n***\n\n### 考试准备\n\n正如引言提到的，你有几种准备考试的选择：Pearson\
