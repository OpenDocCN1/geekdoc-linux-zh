  \n***\n\n**1.** 下列哪项*不是*项目的特征？\n\n**a.** 开始和结束\n**b.** 永久性的\n**c.** 独特的\n**d.**\
  \ 理由（注：原文此处为 reason，可能为笔误，此处按原意译为理由）\n\n**2.** 关于项目计划和项目组合，以下哪个描述是正确的？\n\n**a.**\
  \ 所有项目都是项目组合的一部分。\n**b.** 只有某些项目计划是项目组合的一部分。\n**c.** 每个项目必须是项目计划的一部分。\n**d.** 项目内部的每个项目计划都通过协调的方法进行管理。\n\
  \n**3.** 项目在哪个项目阶段创建项目章程？\n\n**a.** 规划\n**b.** 执行\n**c.** 启动\n**d.** 监控与控制\n\n**4.**\
  \ 下列哪项在规划阶段发生或被创建？\n\n**a.** 业务案例说明\n**b.** 交付物\n**c.** 变更控制\n**5.** 下列哪项在规划阶段发生或被创建？\n\
  \n**a.** 业务案例说明\n**b.** 交付物\n**c.** 变更控制\n**d.** 工作分解结构\n\n**6.** 下列哪项在规划阶段发生或被创建？\n\
  \n**a.** 业务案例说明\n**b.** 交付物\n**c.** 变更控制\n**d.** 工作分解结构\n\n**7.** 项目在哪个项目阶段创建项目章程？\n\
  \n**a.** 规划\n**b.** 执行\n**c.** 启动\n**d.** 监控与控制\n\n**8.** 哪个知识领域主要涉及管理项目团队？\n\n\
  **a.** 沟通管理\n**b.** 人力资源管理\n**c.** 范围管理\n**d.** 集成管理\n\n**9.** 在哪个知识领域中识别项目的威胁？\n\
  \n**a.** 范围管理\n**b.** 质量管理\n**c.** 风险管理\n**d.** 采购管理\n\n**10.** 下列哪个项目文档作为成本的一部分创建的？\n\
  \n**a.** 进度\n**b.** 预算\n**c.** 工作分解结构\n**d.** 需求\n\n\n\n\n\n项目的临时性意味着项目是为了特定时间段而开展的，并在某个时间点结束。临时性与项目的长短无关——仅仅是指它有启动日期和完成日期。项目的结果并不一定是临时的——只有项目本身是。事实上，大多数项目都会产生持久的成果。表\
  \ 1-2 中的项目成果包括 Web 服务器、备份流程和程序、帮助台流程、一栋新建筑、一条新珠宝线、车队中的视频录制机以及一个培训计划。因此，虽然项目是临时的，但结果是永久的，通常会影响项目赞助人或客户，直到该结果不再被需要或不再满足赞助人或客户的需求。\n\
  \n### 开始与结束\n\n为项目定义明确的开始和结束日期至关重要。如果没有定义的开始和结束日期，项目将不受时间的限制，并可能可能成为日常运营的一部分。定义开始和结束日期有助于人员确保项目的完成。项目管理专业人员必须能够分析项目范围，以确定完成项目所需的时间。为了在设定的时间限制内完成项目，可能还需要削减项目的其他方面，例如其范围或预算。开始和结束日期的设定应该在项目的早期阶段完成。\n\
  \n### 独特性\n\n项目的结果应该是独特的。虽然某些项目可能包含重复元素，但每个项目仍然是，具有不同的设计、地点、情况、利益相关者或其他元素。\n\n**示例：**\
  \ 一家建筑公司建造许多类型的建筑。大多数建筑具有相同的元素，如基础、框架、水水、电气等。然而，没有两栋建筑是完全相同的。即使两栋建筑遵循相同的建筑图纸，它们也不会在完全相同的地点由完全相同的团队成员和物资进行建造。\n\
  \n### 原因/目的\n\n应当清晰阐述项目的理由或目的，以确保项目赞助人和所有其他利益相关者理解它。项目应该为赞助组织提供业务价值。价值可以通过新的物理资产或过程创造，甚至可以通过对进行中的运营进行有效重新设计产生。但项目必须有一个理由或目的，以确保这种业务价值的提供。\n\
  \n![Image](img/00004.jpeg)\n\n## 作为计划组成的项目\n\n`计划` 是相关项目或活动的组合，通过协调管理以获得如果单独管理将无法获得的利益。计划内的项目之所以相关，是因为它们具有共同的结果。\n\
  \n**示例：** 一个组织的计划包含了几个涉及多个设施翻新的项目。每个设施的翻新或翻新的每个方面面（水水、电气等）都是一个项目，所有项目共同构成了该计划。\n\
  \n***\n\n注意\n\n项目不必是计划的一部分，但计划始终包含项目。\n\n***\n\n由于计划的主要收益是协调，因此应该使用计划来确保从计划的角度管理每个项目的资源、冲突、目标、目的和变化。计划内的项目必须关注项目之间的相互依赖关系。\n\
  \n提示 如果项目不共享结果，但通过共同的客户、卖家、技术或资源相关联，则它们属于同一个`投资组合`——而不是同一个`计划`。\n\n![Image](img/00004.jpeg)\n\
  \n## 作为投资组合组成的项目\n\n`投资组合`包含了组织管理的所有项目、计划和运营，以便实现其战略目标。投资组合中包含的项目和计划并不一定相互依赖。\n\n\
  要充分理解项目、计划和投资组合之间的关系，请记住以下几点：\n\n![Image](img/00003.jpeg) 所有项目都是投资组合的一部分。\n\n![Image](img/00003.jpeg)\
  \ 所有计划都是投资组合的一部分。\n\n![Image](img/00003.jpeg) 每个项目可以是计划的一部分，也可以是独立的。\n\n![Image](img/00003.jpeg)\
  \ 计划内的每个项目都通过协调的方法进行。\n\n![Image](img/00003.jpeg) 投资组合中的所有项目和计划都与组织的战略计划相关。\n\n\
  ![Image](img/00004.jpeg)\n\n## 项目阶段\n\n每个项目分为五个项目`阶段`（有时称为`过程组`）：\n\n1. 启动阶段\n2.\
  \ 规划阶段\n3. 执行阶段\n4. 监控和控制阶段\n5. 收\n\n项目经理确保组织将所有这些阶段作为项目管理的一部分。虽然这些阶段通常以线性方式列出，但它们并不一定以严格的线性方式执行。例如，在执行阶段创建了一些交付物并在监控和控制阶段监控其结果之后，可能需要审查并修改在规划阶段创建的计划。图\
  \ 1-1 显示了项目管理阶段的示例。\n\n![Image](img/00005.jpeg)\n\n**图 1-1** 项目管理阶段\n\n项目管理生命周期中的每个阶段都包含了为了完成项目而执行的操作和活动的过程。每个过程属于五个项目阶段之一。项目经理必须理解这些过程、它们运行的阶段以及过程之间的相互关系。\n\
  \n***\n\n注意\n\n本章提到的项目角色将在第 2 章“项目角色、职责和团队结构。”中进行详细讨论。\n\n***\n\n![Image](img/00004.jpeg)\n\
  \n### 启动阶段\n\n启动阶段定义了一个新项目并获得启动项目的授权。在此阶段，组织选定一个项目经理，由项目经理定义初始范围、财务资源和利益相关者。该阶段的主要目的是使利益相关者的预期与项目的范围和目标保持一致。\n\
  \n在启动阶段，项目经理制定项目章程并识别利益相关者。该阶段包括创建以下项目文档：\n\n![Image](img/00003.jpeg) 项目章程\n![Image](img/00003.jpeg)\
  \ 业务情况\n![Image](img/00003.jpeg) 高级范围定义\n![Image](img/00003.jpeg) 高级风险\n![Image](img/00003.jpeg)\
  \ 利益相关者注册\n\n以下章节简要介绍了这些文档。\n\n### 项目章程\n\n项目章程授权项目并允许项目经理应用组织资源来完成项目。章程由项目赞助人正式发布。项目的工作说明、业务情况、采购协议以及组织资产和因素为项目章程提供了输入。它包含了项目的目的、目标、需求、假设和约束、高级范围和风险、摘要里程碑计划、摘要预算和利益相关者列表。项目赞助人必须根据项目章程正式授权项目。\n\
  \n`假设` 是规划阶段中的一个被认为是真实的因素，而`约束` 是影响项目执行的限制性因素。例如：\n\n![Image](img/00003.jpeg) **假设：**\
  \ 项目的一个典型交付物大约需要四周时间完成。\n\n\n\n\n\n![Image](img/00003.jpeg) **约束：** 必须有特定数量的成员参与项目。\n\
  \n## 业务案例\n\n`业务案例` 确定了项目的益处，并作为项目授权的依据。它用于判断项目是否值得投入。一个业务案例通常是根据市场需求、组织需求、客户请求、技术进步、法律要求、生态影响或社会需求而产生的。\n\
  \n## 高级范围定义\n\n`高级范围 定义` 是项目章程的一部分。它定义了为交付项目结果必须执行的高级工作。在随后的规划阶段，高级范围定义将得到扩展，并最终包含项目必须完成的各个工作单元。\n\
  \n## 高级风险\n\n`高级风险` 是项目章程的一部分。`风险` 一词描述任何可能对项目目标产生积极或负面影响的不确定事件。风险在规划阶段会有更正式的定义。\n\
  \n## 相关方登记\n\n相关方登记包含所有已识别的相关方列表，并包括识别信息、需求和期望、对项目的影响以及他们的分类。相关方登记稍后用于创建相关方管理计划。\n\
  \n![Image](img/00004.jpeg)\n\n### 规划阶段\n\n规划阶段建立了项目的总范围和目标，然后制定所需的行动。在此阶段，项目经理定义项目的范围、进度、预算、质量、人力资源需求、通信方法、风险和采购。该阶段的主要目的是定义成功完成项目所需的行动。\n\
  \n在此阶段，项目经理制定项目管理计划及其所有子计划，包括创建以下项目文档：\n\n![Image](img/00003.jpeg) 进度\n![Image](img/00003.jpeg)\
  \ 范围管理计划\n![Image](img/00003.jpeg) 工作分解结构\n![Image](img/00003.jpeg) 范围基准\n![Image](img/00003.jpeg)\
  \ 范围说明\n![Image](img/00003.jpeg) 资源\n![Image](img/00003.jpeg) 详细风险\n![Image](img/00003.jpeg)\
  \ 需求\n![Image](img/00003.jpeg) 需求管理计划\n![Image](img/00003.jpeg) 通信计划\n![Image](img/00003.jpeg)\
  \ 相关方管理计划\n![Image](img/00003.jpeg) 采购管理计划\n![Image](img/00003.jpeg) 变更管理计划\n![Image](img/00003.jpeg)\
  \ 预算\n\n以下章节简要描述了这些文档。\n\n### 进度\n\n`schedule` 展示了项目活动以及计划的开始/结束日期、持续时间、里程碑和使用的资源。为了确保项目的准确性，项目经理必须确定所需的活动、完成这些活动所需的资源以及关于资源可用性的资源日历。\n\
  \n### 范围管理计划\n\n`范围管理计划` 描述了如何定义、开发、监控、控制和验证范围。它是项目管理计划的主要组件之一。\n\n### 工作分解结构 (WBS)\n\
  \n`工作分解结构 (WBS)#part0034.html_gloss385)` 是项目期间必须完成的活动或工作包的层次结构列表。WBS 中的每个工作包都应该有一个唯一的标识符，以帮助将工作包与其成本、进度和资源相关联。`[WBS\
  \ 字典` 是 WBS 的辅助文档，提供了关于每个 WBS 组件的详细信息，包括标识符、描述和进度信息。\n\n### 范围基准和范围说明\n\nWBS 是 `范围基准`\
  \ 的一部分，其中包括 `项目范围` 说明、WBS 和 WBS 字典。范围基准被作为执行阶段和监控控制阶段比较范围控制的依据。`范围说明` 包含了项目范围描述、主要交付物、假设和约束。\n\
  \n### 资源\n\n项目的 `资源` 包括完成项目所需的人员、设备、服务、用品和资金。每种资源都需要一个资源日历，用于定义资源可用的日期和小时。\n\n###\
  \ 详细风险\n\n`详细风险`定义在项目的 `风险登记` 中。一旦作为风险管理过程的一部分识别出所有风险，必须确定每种风险的响应。风险应被识别为积极或负面。负面风险可能会导致严重问题并使项目偏离轨道。积极风险则是理想的机会。例如：\n\
  \n![Image](img/00003.jpeg) **负面风险:** 建筑项目建筑材料成本上涨的可能性。\n\n![Image](img/00003.jpeg)\
  \ **积极风险:** 在截止日期的一周前完成交付，从而为项目进度留出了一些缓冲余地。\n\n### 需求和需求计划\n\n项目的`需求`包括任何相关方对项目的需求和规范。通常，这些需求必须使用决策技术进行谈判。需求在开发范围管理计划期间被记录，并包含在需求管理计划中。`需求管理计划`\
  \ 描述了如何对需求进行分析、记录和管理。\n\n### 通信计划\n\n`通信计划` 描述了如何、何时以及谁向项目团队和相关方发布项目信息。项目经理必须在该计划中记录相关方及其偏好的通信方法。该计划还应包括有关项目状态会议和项目团队会议的信息。\n\
  \n### 相关方管理计划\n\n`相关方管理计划` 识别了如何管理和参与项目相关方，包括他们的参与水平、关系和通信需求。相关方管理计划与通信计划配合使用，以管理相关方的参与。\n\
  \n### 采购管理计划\n\n`采购管理计划`（也称为采购计划）描述了如何从外部来源采购项目的任何货物和服务。项目经理应该与组织合作，制定选择采购源的标准。根据从第三方所需的商品和服务，项目经理可能需要管理多个供应商和合同类型。\n\
  \n### 变更管理计划\n\n`变更管理计划` 定义了如何管理和实施项目变更请求。变更只有在经过正式审批流程后才能实施。变更通常会影响项目的范围、预算和进度。\n\
  \n### 预算\n\n`预算`是项目的成本估算。它包含了单个 WBS 工作包、采购和任何计划内的成本明细。由于预算是基于成本估算的，项目经理应该不断分析实际成本并将其与预算成本进行比较。\n\
  \n### 执行阶段\n\n![Image](img/00004.jpeg)\n\n\n\n\n执行阶段完成了项目管理计划中定义的工作。在此阶段，项目经理协调人员和其他资源，并管理利益相关者的预期。项目预算的大部分将在此阶段支出。\n\
  \n在执行阶段，项目经理指导项目工作、质量保证和沟通。此外，项目经理还负责开发和管理项目团队，并进行采购。\n\n此阶段的主要输出是项目 `deliverables`（交付物），即\
  \ WBS 中定义的唯一工作包。\n\n![Image](img/00004.jpeg)\n\n### 监控和控制阶段\n\n监控控制阶段跟踪、审查并组织项目的进度。在此阶段，项目经理识别需要更改的领域并启动已批准的变更。该阶段的关键目的是定期衡量和分析项目性能，以识别与项目管理计划之间的偏差。\n\
  \n在监控控制阶段，项目经理监控并控制项目的工作、范围、进度、预算、质量、沟通、风险和采购。此阶段涉及以下项目文记录和活动：\n\n![Image](img/00003.jpeg)\
  \ 问题日志\n![Image](img/00003.jpeg) 绩效衡量与报告\n![Image](img/00003.jpeg) 质量保证/治理\n![Image](img/00003.jpeg)\
  \ 变更控制\n![Image](img/00003.jpeg) 预算\n\n以下章节简要描述了这些文档和活动。\n\n### 问题日志\n\n`issues\
  \ log`记录了正在讨论的团队成员或利益相关者问题。如果项目赞助人批准了这些问题，可能会变为正式的变更请求。如果项目经理认为应该对可能再次的问题制定计划，这些问题可能会变成风险。\n\
  \n注意\n\n在编写时，CompTIA 目标将此文档称为 `risks/issues log`。然而，项目管理标准并不使用这一术语。`risk register`（风险注册）是在计划阶段创建的，记录了任何识别出的风险以及计划的应对措施。`issues\
  \ log` 是在监控控制阶段创建的，记录了任何出现的利益相关者问题。某些问题很容易处理，无需将其提升到风险水平。大多数项目风险是在计划阶段识别的。问题日志中记录的问题可能可能被添加到风险列表中。\n\
  \n**示例：** 在项目执行期间，一名团队成员需要在几台计算机上安装漏洞分析工具，但没有管理权限。此问题被输入到问题日志中。需要向该团队成员或其他适当人员（如\
  \ `project manager`）授予管理级权限，他们就可以安装任何需要此类权限的工具和应用程序。\n\n### 绩效衡量与报告\n\n`Performance\
  \ measuring and reporting`将实际项目性能与项目管理计划中定义的基线进行比较。结果用于控制项目的变更、范围、进度、成本、质量、风险和采购。获取原始性能数据并与基线比较，产生有关工作性能的详细信息。这些信息随后整合到项目报告中。\n\
  \n### 质量保证/治理\n\n`Quality assurance/governance` 获取项目的质量指标和清单，并使用鱼骨图、流程图和直方图等工具解决任何质量问题。识别出的质量控制问题可能需要项目变更，以确保按照项目管理计划维持的交付物质量。\n\
  \n### 变更控制\n\n`Change control`审查、批准并管理项目变更请求。如果变更未被批准，则将变更请求简单输入变更日志。如果变更获得批准，将由项目经理或团队成员根据变更控制流程进行处理。\n\
  \n### 预算\n\n项目预算根据完成工作产生的实际成本进行更新和管理。实际成本应始终与基线预算（即最初批准的预算）进行比较。\n\n![Image](img/00004.jpeg)\n\
  \n### 结束阶段\n\n结束阶段完成了所有活动。在此阶段，项目经理验证项目定义的流程已完成。该阶段的关键目的是正式关闭项目。当所有工作完成后，项目关闭，但也可能因为项目取消或紧急情况而提前关闭。\n\
  \n在结束阶段，项目经理关闭项目以及属于项目的采购。此阶段涉及以下项目文档和活动：\n\n![Image](img/00003.jpeg) 移交/集成计划（包括培训）\n\
  ![Image](img/00003.jpeg) 项目验收\n![Image](img/00003.jpeg) 项目文档归档\n![Image](img/00003.jpeg)\
  \ 经验教训\n![Image](img/00003.jpeg) 资源释放\n![Image](img/00003.jpeg) 合同关闭\n\n以下章节简要描述了这些文档和活动。\n\
  \n### 移交/集成计划\n\n`transition/integration plan`包含了项目团队如何移交或集成到组织内其他项目或领域的细节。通常会作为结束的一部分提供培训，以确保项目团队获得新项目或领域所需的技能。\n\
  \n### 项目验收\n\n`project sign-off`提供了一种根据项目管理计划验证项目完成的正式方法。验收通常由项目经理完成并由项目赞助人签字。\n\
  \n### 项目文档归档\n\n项目经理必须`archive`所有项目文档，以确保它们一直维护到不再需要为止。法律和法规可能规定记录必须保留的时间和形式。项目经理应遵循既定程序，以确保文档存储在可以检索的地点和格式中。\n\
  \n### 经验教训\n\n`Lessons learned`文档记录了在项目期间获得的任何知识，显示了如何处理项目问题和事件。记录经验教训的唯一目的是改进未来的项目性能。\n\
  \n# 资源释放\n\n在结束阶段，项目经理应正式`release`所有正在使用的资源。对于人员，这应该包括完成对项目团队成员绩效的评估。对于完成项目所需的设备、服务、用品和资金，项目经理必须正式将这些资产释放回项目赞助人。\n\
  \n### 合同关闭\n\n最后，项目经理必须关闭所有项目采购合同。记录供应商的表现和任何问题是重要的，以确保未来的项目采购有这些数据供分析。\n\n![Image](img/00004.jpeg)\n\
  \n# 项目知识领域\n\n虽然项目阶段描述了项目如何通过其生命周期，但`project knowledge areas`描述了项目的过程如何分组为共享的专业化活动。一个项目过程将同时属于一个项目阶段和一个项目知识领域。例如，开发项目章程是启动阶段的一部分也是项目集成知识领域的一部分。大多数项目有\
  \ 10 个主要的项目知识领域：\n\n\n\n\n![Image](img/00003.jpeg) 项目集成\n![Image](img/00003.jpeg)\
  \ 范围管理\n![Image](img/00003.jpeg) 时间管理\n![Image](img/00003.jpeg) 成本管理\n![Image](img/00003.jpeg)\
  \ 质量管理\n![Image](img/00003.jpeg) 人力资源管理\n![Image](img/00003.jpeg) 沟通管理\n![Image](img/00003.jpeg)\
  \ 风险管理\n![Image](img/00003.jpeg) 采购管理\n![Image](img/00003.jpeg) 相关者管理\n\n项目经理需要理解每个项目知识领域涉及的活动，以及这些活动应该在项目生命周期的何时完成。以下章节简要描述了这些项目知识领域。\n\
  \n## 项目集成\n\n`project integration` 识别并协调项目中的所有过程和活动。它包括制定项目章程和项目管理计划、指导和管理项目工作、监控和控制项目工作、执行集成变更控制以及关闭项目。\n\
  \n项目经理在启动阶段制定项目章程，在规划阶段制定项目管理计划。项目工作在执行阶段进行指导和管理。项目工作在监控和控制阶段进行监控和控制。变更控制也发生在监控和控制阶段。关闭项目发生在结束阶段。\n\
  \n## 范围管理\n\n项目 `scope management` 确保项目所需的工作是完整的，并且处于定义的项目范围内。它包括制定 `scope management\
  \ plan`（作为项目管理计划的一部分）、收集需求、定义范围、创建 `WBS`、验证范围以及控制范围。\n\n项目经理在规划阶段制定范围管理计划、收集需求、定义范围并创建\
  \ `WBS`。范围的验证和控制发生在监控和控制阶段。\n\n## 时间管理\n\n项目 `time management` 确保项目按时完成。它包括制定 `schedule\
  \ management plan`（作为项目管理计划的一部分）、定义和排序活动、估算活动资源和工期、制定进度以及控制进度。\n\n项目经理在规划阶段制定 `schedule\
  \ management plan`、定义并排序活动、估算活动资源和工期并制定进度。进度的控制发生在监控和控制阶段。\n\n## 成本管理\n\n项目 `cost\
  \ management` 确保项目成本在批准的预算内完成。它包括制定 `cost management plan`（作为项目管理计划的一部分）、估算成本、确定预算以及控制成本。\n\
  \n项目经理在规划阶段制定 `cost management plan`、估算成本并确定预算。成本控制发生在监控和控制阶段。\n\n## 质量管理\n\n项目\
  \ `quality management` 确保项目质量满足项目需求。它包括制定 `quality management plan`（作为项目管理计划的一部分）、执行质量保证以及控制质量。\n\
  \n项目经理在规划阶段制定 `quality management plan`。质量保证发生在执行阶段，质量控制发生在监控和控制阶段。\n\n## 人力资源管理\n\
  \n项目 `human resource management` 确保项目团队得到组织和管理以完成项目。它包括制定 `human resource management\
  \ plan`（作为项目管理计划的一部分）以及获取、开发和管理项目团队。\n\n项目经理在规划阶段制定 `human resource management plan`。项目团队的获取、开发和管理发生在执行阶段。\n\
  \n## 沟通管理\n\n项目 `communication management` 确保项目信息的正确创建、分配和存储。它包括制定 `communication\
  \ plan`（作为项目管理计划的一部分）以及管理和控制所有项目沟通。\n\n项目经理在规划阶段制定 `communication plan`。沟通管理发生在执行阶段，沟通控制发生在监控和控制阶段。\n\
  \n## 风险管理\n\n项目 `risk management` 确保项目风险（也称为 `threats`）被识别、分析和控制。它还涉及风险响应计划。该项目知识领域包括制定\
  \ `risk management plan`（作为项目管理计划的一部分）、识别风险、执行定性和定量风险分析、制定风险响应以及控制风险。\n\n项目经理在规划阶段创建\
  \ `risk management plan`、识别风险、执行定性和定量风险分析并制定风险响应。风险控制发生在监控和控制阶段。\n\n## 采购管理\n\n\
  项目 `procurement management` 确保从第三方获取所需的产品或服务。该项目知识领域包括制定 `procurement management\
  \ plan`（作为项目管理计划的一部分）以及实施、控制和结束采购。\n\n项目经理在规划阶段创建 `procurement management plan`。实施采购发生在执行阶段，控制采购发生在监控和控制阶段，结束采购发生在结束阶段。\n\
  \n## 相关者管理\n\n项目 `stakeholder management` 记录受影响的人员、团体或组织的预期以及对项目的影响。此外，还会制定相关者管理策略。它包括识别相关者、创建\
  \ `stakeholder management plan`（作为项目管理计划的一部分）以及管理和控制相关者的参与。\n\n项目经理在启动阶段识别相关者，并在规划阶段创建\
  \ `stakeholder management plan`。相关者参与管理发生在执行阶段，相关者参与控制发生在监控和控制阶段。\n\n## 考试准备任务\n\
  \n如引言中“如何使用本书”部分所述，你有几种准备考试的选择：此处的练习题；`第 15 章`、“最终准备”以及 Pearson Test Prep 在线模拟考试。\n\
