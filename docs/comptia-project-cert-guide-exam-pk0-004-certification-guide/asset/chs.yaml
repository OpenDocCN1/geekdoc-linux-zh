  \ A。如需更多模拟题练习，请使用在线 Pearson Test Prep 模拟考试软件。\n\n**1。** 你被聘请担任某研究项目的经理。你发现项目物资的成本远高于最初估算。然而，预算并未调整以反映这一增长。你可以做什么来解决这个问题？（选择所有适用项）\n\
  \n**a.** 向项目发起人申请额外资金。\n**b.** 在项目的其他领域寻找削减成本的方法。\n**c.** 降低项目质量。\n**d.** 缩短项目进度以降低成本。\n\
  \n**2。** 在项目规划期间，某新电子设备的项目发起人要求为产品添加一个新功能。你与发起人会面讨论添加这一新功能。这次会议的结果应该是？\n\n**a.**\
  \ 降低新设备的质量。\n**b.** 聘用新人员来开发新功能。\n**c.** 获取额外资金以涵盖新功能的开发费用。\n**d.** 移除设备的其他一个功能。\n\
  \n**3。** 对于你公司的当前项目，项目经理发现创建项目交付物花费的时间远超预估。在与项目发起人讨论此问题并遵循适当控制程序后，项目经理聘用了一个新团队成员。作为这一行动的结果，应该调整哪些项目约束？\n\
  \n**a.** 成本、时间和范围\n**b.** 时间和范围\n**c.** 成本和范围\n**d.** 成本和时间\n\n**4。** 你被聘请接手一个项目，发现遗漏了一个交付物。你与项目发起人讨论此问题，对方决定添加该交付物。作为这一行动的结果，应该调整哪些项目约束？\n\
  \n**a.** 成本、时间和范围\n**b.** 时间和范围\n**c.** 成本和范围\n**d.** 成本和时间\n\n**5。** 对于一个新的打印项目，项目发起人要求更高质量的乙基布，而目前没有货。作为这一请求的结果，应该调整哪些项目约束？\n\
  \n**a.** 成本、时间和范围\n**b.** 时间和范围\n**c.** 成本和范围\n**d.** 成本和时间\n\n**6。** 你是一个应用程序开发项目的项目经理。作为项目的一部分，质量保证人员需要访问实验室环境。在完成项目规划后，你发现实验室在你需要时无法使用，但在其他时间可用。作为这一问题的结果，应该调整哪个项目约束？\n\
  \n**a.** 范围\n\n\n\n\n\nb. 时间\n\nc. 成本\n\nd. 需求\n\n[7]. 你是一个新建筑项目的项目经理。在项目规划期间，你了解到项目赞助人拥有的一台挖掘机可以用于该项目。然而，在你需要使用挖掘机的前两天，你发现它正在维修中，你必须租用一台挖掘机。由于此问题的发生，应该调整哪项项目约束？\n\
  \na. 范围\nb. 时间\nc. 成本\nd. 交付物\n\n[8]. 你是一个零售店重新设计项目的项目经理。在项目执行两周后，项目赞助人要求将主通道的宽度增加一英。该变更已批准，项目需求也相应调整。这是哪种影响的示例？\n\
  \na. 变更请求\nb. 范围蔓延\nc. 约束重新排序\nd. 另一个项目\n\n[9]. 你被聘请接手一个现有项目的项目经理。在第一天，你发现由于项目中增加了新需求，导致项目预算超支且进度滞后。在添加这些需求时，项目的预算和进度没有进行调整。这是哪种影响的示例？\n\
  \na. 变更请求\nb. 范围蔓延\nc. 约束重新排序\nd. 另一个项目\n\n[10]. 你正在管理一个生产商用新型冰箱设计的项目。在项目最初规划时，项目赞助人希望尽快获得该设计以抢占市场份额。然而，今天你了解到公司面临预算危机，项目赞助人要求你调整项目以降低至最低。这是哪种影响的示例？\n\
  \na. 变更请求\nb. 范围蔓延\nc. 约束重新排序\nd. 另一个项目\n\n# 第 8 章 风险活动与策略\n\n本章涵盖了以下主题：\n\n![Image](img/00003.jpeg)\
  \ **理解风险活动：**风险活动包括风险规划、风险识别、风险量化与优先级排序、风险审查、风险响应、开发和维护风险注册以及风险沟通。\n\n![Image](img/00003.jpeg)\
  \ **理解风险策略：**风险策略包括接受风险、缓解风险、转移风险、规避风险、利用风险、增强风险和共享风险。\n\n`risk` 是任何可能对项目目标或其他方面（如项目成本、范围或进度）产生积极或消极影响的不确定事件。风险既有产生因也有影响。风险\
  \ `causes` 是导致风险发生的条件或事件，而影响则是风险对项目产生的结果。虽然风险是不可避免的，但它本身并不是坏的——积极风险的另一个术语是 `opportunity`。\n\
  \n项目风险管理包括风险管理规划、识别和分析风险、针对识别出的风险制定响应计划以及控制风险。必须在项目的规划阶段识别识别风险，以确定组织的风险偏好和风险容度。`Risk\
  \ appetite` 是组织为了获得回报而愿意承担的不确定性程度。`Risk tolerance` 是组织能够承受的风险量。\n\n风险活动是在项目实施期间为了识别、分析、计划和监控风险而采取的行动。风险策略是组织在风险出现时将用来处理风险的方法。本章首先关注风险活动；在完成其他风险活动之前，实际上无法确定和应用风险策略。\n\
  \n本章涵盖了 Project+ 考试的以下目标：\n\n**2.2** 解释风险策略和活动的重要性。\n\n***\n\n**注意**\n\n提醒：CompTIA\
  \ 在 Project+ 考试中可能会使用行业标准术语的细微变。有关已知词汇差异的详细列表，请参阅第 `15` 章，“最终准备”。\n\n***\n\n###\
