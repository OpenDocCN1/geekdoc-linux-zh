  a. 会议纪要\nb. 会议议程\nc. 仪表板信息\nd. 状态报告\n\n### 基础主题\n![Image](img/00004.jpeg)\n\n###\
  \ 项目章 (Project Charter)\n`project charter` 创建于项目的启动阶段，它授权项目并允许项目经理利用组织资源来完成项目。章程由项目发起人正式发布，包含了项目的目的、目标、需求、假设和约束、高层范围和风险、概要里程碑进度表、概要预算以及利益相关者列表。\n\
  \n项目章是构成项目管理计划（下文讨论）的许多文档的起点。由于章程是项目的基础，项目经理和项目团队在每次创建或更新项目文档时，都首先分析章程。\n\n**示例：**\
  \ 何时分析项目章：项目经理要求一名项目团队成员通过创建利益相关者登记来协助项目规划。该成员获取了项目章的副本，并在该文档中找到了利益相关者列表。该成员可能需要向登记表中添加利益相关者，但项目章中的利益相关者列表提供了一个很好的开始。\n\
  \n![Image](img/00004.jpeg)\n\n### 项目管理计划 (Project Management Plan)\n`project management\
  \ plan` 创建于项目的规划阶段，是定义所有项目工作的核心文档。它包含了以下项目文档：\n\n![Image](img/00003.jpeg) 所有基线，包括：\n\
  \n![Image](img/00003.jpeg) **范围基线：** 在项目执行阶段和监控控制阶段用作比较范围控制的依据的项目文档。范围基线包含了项目范围说明书、工作分解结构\
  \ (WBS) 和 WBS 字典。\n\n![Image](img/00003.jpeg) **进度基线：** 批准的项目进度表版本。\n\n![Image](img/00003.jpeg)\
  \ **成本基线：** 批准的项目预算。\n\n![Image](img/00003.jpeg) 所有子计划，包括：\n\n![Image](img/00003.jpeg)\
  \ **范围管理计划：** 描述范围如何被定义、开发、监控、控制和验证。\n\n![Image](img/00003.jpeg) **需求管理计划：** 描述项目需求如何被分析、文档化和管理。\n\
  \n![Image](img/00003.jpeg) **进度管理计划：** 建立了开发、监控和控制进度的活动。\n\n![Image](img/00003.jpeg)\
  \ **成本管理计划：** 描述成本如何被规划、结构化和控制。\n\n![Image](img/00003.jpeg) **质量管理计划：** 描述项目的质量政策将如何被实施。\n\
  \n![Image](img/00003.jpeg) **过程改进计划：** 详细说明了分析过程以识别增强其价值的活动的步骤。\n\n![Image](img/00003.jpeg)\
  \ **人力资源管理计划：** 描述人力资源如何被结构化和管理，包括他们的角色、职责和汇报关系。\n\n![Image](img/00003.jpeg) **沟通计划：**\
  \ 描述有关项目的信息如何、何时以及由谁分发给项目团队和利益相关者。\n\n![Image](img/00003.jpeg) **风险管理计划：** 描述所有可能影响项目的已知风险，以及将用于处理每种风险的策略。\n\
  \n![Image](img/00003.jpeg) **采购管理计划：** 也称为 `procurement plan`。描述如何从外部来源采购项目所需的货物和和服务。\n\
  \n![Image](img/00003.jpeg) **利益相关者管理计划：** 根据每个利益相关者的需求、兴趣和对项目的影响，定义了利益相关者参与项目决策和执行的工具和技术。规定了如何管理每个利益相关者的参与水平、关系和沟通需求。\n\
  \n![Image](img/00003.jpeg) **变更管理计划：** 定义了如何管理和实施项目变更请求。\n\n![Image](img/00003.jpeg)\
  \ **配置管理计划：** 定义产品、结果、服务或组件的配置如何作为变更管理的一部分进行记录、跟踪和定义。配置管理计划通常与变更管理计划紧密配合。\n\n* *\
  \ *\n\n注意\n由于第 1 章和本章涵盖了不同的 Project+ 目标，这两个章节的涵盖范围相应不同。这里讨论的某些文档未在第 1 章中涵盖，反之亦然。\n\
  \n* * *\n\n作为管理项目的主要文档，项目管理计划作为项目团队的指南，确保项目结果符合项目发起人的需求。一旦项目基线建立，项目管理计划只能通过变更控制过程进行更改。项目经理应在项目的执行阶段和监控控制阶段咨询项目管理计划，以确保项目按计划进行。\n\
  \n* * *\n\n注意\n项目管理计划中的文档将随着项目的进展进行修改，以反映持续变更。有关处理项目变更的详情，请参阅第 11 章“变更控制”。\n\n*\
  \ * *\n\n\n\n\n\n**示例：** 何时分析项目管理计划：一名项目团队成员就项目采购问题联系项目经理。该团队成员认为采购不符合采购合同中列出的规格。项目经理和项目团队成员应该咨询项目管理计划中的采购管理计划，然后审查采购合同以确定\
  \ 1) 采购是否符合合同规格，以及 2) 如果采购不符合规格，下一步是什么。\n\n![Image](img/00004.jpeg)\n\n### 问题日志\
  \ (Issues Log)\n\n`issues log`（问题日志）在项目的执行阶段（Executing phase）期间创建，记录了利益相关者提出的所有问题。当识别出新问题或解决当前问题时，就会对日志进行更新。可以分析旧项目的问题日志以帮助识别当前项目的风险，因为问题往往作为未列在风险登记中的未预见风险出现。问题可能会变成风险，但并非所有风险都始于问题。与其他类型的变更一样，问题应该通过编号系统进行全程跟踪。问题日志还应该跟踪问题优先级、问题类型、目标解决和状态。\n\
  \n项目经理应确保团队成员理解问题、风险和变更请求之间的区别：\n\n![Image](img/00003.jpeg) **问题：** 在项目生命周期中意外发生的差距、不一致之处或冲突，且此前未被识别为风险。问题已经影响了项目并需要解决。\n\
  \n![Image](img/00003.jpeg) **风险：** 如果发生，会对至少一个项目目标产生影响的不确定事件或状态。大多数风险在项目规划期间被识别。\n\
  \n![Image](img/00003.jpeg) **变更请求：** 以任何方式修改项目的请求。问题可能导致风险或变更请求，也可能不会。\n\n区分这三者的最佳方法是理解以下内容：\n\
  \n![Image](img/00003.jpeg) `issue`（问题）是发生的事情，必须立即处理以便项目进行，且未作为风险管理的一部分被预见到。\n\n\
  ![Image](img/00003.jpeg) `risk`（风险）可能发生也可能不发生，但已有相应的计划。\n\n![Image](img/00003.jpeg)\
  \ `change request`（变更请求）是在项目期间提出的项目修改，可能被或不被批准，并且在批准和实施之前必须经过充分分析。\n\n**示例：** 何时使用和分析问题日志：一次意外停电导致项目工作停工一天。如果该事件不在风险登记册中，它\
  \ true 一个问题，必须输入问题日志中。项目经理应与项目团队合作，调整项目进度以及任何受此问题影响的其他项目文档。\n\n![Image](img/00004.jpeg)\n\
  \n### 组织架构图 (Organizational Chart)\n\n设计良好的 `organizational chart`（组织架构图）对于项目的成功至关重要。组织架构图以金字塔形式绘制，显示人员在项目结构中的位置。金字塔顶端的人员比底部的人员拥有权力和责任。组织架构图中个人姓名和/或职称的位置显示了工作关系，连接框的线条表示个人之间的正式监督关系和沟通路线线。\n\
  \n项目经理需要确保项目团队成员可以使用当前的组织架构图。此外，可能需要创建项目的组织架构图以帮助团队成员和利益相关者理解项目关系。项目经理还应该理解组织结构（职能、矩阵或项目型），以确保人员在整个项目生命周期内得到妥善管理。\n\
  \n***\n\n注意\n\n项目团队结构在第 2 章“项目角色、职责和团队结构”中讨论。第 2 章还提供了组织架构图的示例。\n\n***\n\n**示例：**\
  \ 何时分析组织架构图：一个职能组织的项目使用了来自多个部门的人员。如果项目进度发生重大变化，项目经理可能需要与职能经理协商，以确保在需要时所需的项目团队成员可用，或者需要不同的人来完成新活动。\n\
  \n### 范围说明书 (Scope Statement)\n\n![Image](img/00004.jpeg)\n\n`project scope statement`（项目范围说明书）是一份正式声明，包含了项目理由、范围描述、验收标准、交付物、排除项、约束和假设。结合工作分解结构（WBS）和\
  \ WBS 字典，它构成了规划阶段作为 WBS 过程组成部分的范围基线。范围说明书必须经过项目赞助人的正式批准，并且只能通过正式的变更控制程序进行更改。\n\n\
  **示例：** 何时分析范围说明书：利益相关者对正在开发的新应用程序请求一个功能。项目经理需要分析范围说明书以查看该功能是否包含在项目范围内。如果该功能不在原始范围内，利益相关者将需要提交变更请求以添加该功能。\n\
  \n![Image](img/00004.jpeg)\n\n### 沟通计划 (Communication Plan)\n\n如前所述，`communication\
  \ plan`（沟通计划）描述了如何、何时以及由谁将项目信息发布给项目团队和利益相关者。沟通计划为所有项目沟通提供整体指导，以确保所有项目团队成员和利益相关者都能及时获得适当的信息。\n\
  \n***\n\n注意\n\n沟通计划在第 9 章“沟通方法与影响”和第 10 章“沟通触发因素和目标读者”中有详细讨论。\n\n***\n\n**示例：**\
  \ 何时使用或分析沟通计划：项目达到了一个里程碑。项目经理应参考沟通计划，确定谁需要或想要告知里程碑信息，然后对这些人员使用偏好的沟通方法。\n\n![Image](img/00004.jpeg)\n\
  \n### 项目进度计划 (Project Schedule)\n\n`project schedule`（项目进度计划）显示了项目活动及其计划的开始/结束日期、持续时间、里程碑和资源。项目进度计划通常维护在项目管理软件中，并随着活动的开始和结束而更新。这种跟踪确保依赖活动按时开始。\n\
  \n***\n\n注意\n\n第 4 章“项目进度”提供了关于项目、执行和修订项目的细节。\n\n***\n\n**示例：** 何时使用和分析项目进度计划：项目经理接到通知，活动\
  \ Z 完成所需的时间是预期的一半。在项目后期，活动 Z 将执行两次。项目经理应该调整两次活动 Z 的任务持续时间，这将导致任何依赖于活动 Z 的活动也发生变化。如果活动\
  \ Z 的任何一次是关键路径的一部分，项目经理需要确定关键路径是否发生了变化。如果变化很大，项目经理可能需要与项目团队和利益相关者就项目进度变更进行沟通。\n\n\
  ![Image](img/00004.jpeg)\n\n### 状态报告 (Status Reports)\n\n\n\n\n\n项目的`status reports`提供了有关项目活动、问题、变更和风险的最新信息。大多数项目都会定期召开状态会议。状态报告既可以为了状态会议而编制，也可以作为状态会议的成果，但通常状态报告只是一个摘要。要获取状态会议的完整报告，人员应参阅会议记录（在本章稍后将讨论）。创建状态报告的主要目的是确保项目赞助人、利益相关者以及未参加状态会议的团队成员仍然了解项目的当前状态。项目经理应确保将最新的状态报告整合到项目仪表板中。\n\
  \n> 注意：有关项目状态报告和仪表板的更多信息，请参阅第 12 章，“项目管理工具.](#part0028.html_ch12)”\n\n**示例：** 何时使用和分析状态报告：一名项目团队成员缺席了状态会议，他负责完成一项即将进行的活动。然而，他知道上周一次非计划的停电影响了项目进度。为了了解状态会议期间针对此次停电做出了哪些决策，他需要阅读状态报告。他可能还需要查阅项目进度表，查看活动是否已针对停电进行了调整。\n\
  \n![Image](img/00004.jpeg)\n\n### 仪表板信息\n\n虽然项目状态报告通常是`project dashboard`](#part0034.html_gloss229）的一部分，但仪表板也可能包含其他组件，例如关键绩效指标、项目指标、项目进度和其他项目问题的细节。此工具让利益相关者和团队成员能够快速查看项目整体状况。\n\
  \n> 注意：有关项目仪表板的用法，请参阅第 1 章 2。\n\n**示例：** 何时使用和分析项目仪表板：一位利益相关者认为项目超支。检查预算状况的最快方法是找到关键绩效指标，例如成本绩效指数\
  \ (CPI) 或成本差异 (CV)。\n\n> 注意：请参阅第 3 章，“项目成本控制，](#part0016.html_ch03)”了解有关挣值管理 (EVM)\
  \ 计算（如 CPI 和 CV）的详情，以及这些值如何反映项目预算各个层面的示例。\n\n![Image](img/00004.jpeg)\n\n# 行动事项\n\
  \n`Action items`](#part0034.html_gloss6) 是必须解决的项目关注事项。会议通常会产生行动事项列表，这些列表应该始终清晰记录，以确保它们被记住并处理。项目经理必须确保项目团队理解问题（Issues）和行动事项（Action\
  \ items）之间的区别：\n\n![Image](img/00003.jpeg) **问题 (Issues)：** 在项目生命周期中意外发生的、差距、不一致或冲突，且此前未被识别为风险。问题已经影响了项目并需要被解决。问题通常需要多个资源和大量时间来解决。\n\
  \n![Image](img/00003.jpeg) **行动事项 (Action items)：** 只需要很少资源——通常只需要单个资源——且解决时间通常小于一周。这些项目不应导致项目延误。\n\
  \n当行动事项产生时，应将其添加到行动事项列表中并分配给项目团队成员。每项行动事项都应分配一个优先级和完成日期，以确保其在受影响的项目活动之前及时完成。\n\n\
  **示例：** 何时使用和分析行动事项：在零售店装修的每日站会期间期间，项目团队确定了即将进行的项目活动所需的若干工具和物资。团队需要创建一个行动事项列表，详细列出所有这些工具和物资。列表可以按供应商或购买地点进行划分，并分配一或两个项目团队成员来获取这些工具和物资。\n\
  \n> 提示：在大多数组织中，金额低于一定金额的基础用品和小五工具（如锤子或螺丝刀）可以从当地商店购买并提供收据。这些购买被视为行动事项而非项目采购，后者通常涉及更高的支出限额、招标程序、批准的供应商和合同条款。\n\
  \n![Image](img/00004.jpeg)\n\n## 会议议程和会议记录\n\n`meeting agenda`](#part0034.html_gloss168)是提供会议讨论议题的文档。议程应在每次预定的会议之前制定。（此规则的例外是每日站会。）当举行预定会议时，应分配一名团队成员记录会议情况。`meeting\
  \ minutes`](#part0034.html_gloss169)是会议期间讨论的所有内容和所做任何决策的记录。会议记录应正式发布，供项目利益相关者评审。请记住，议程是为了引导会议，而会议记录是为了记录会议期间期间发生的情况。\n\
  \n**示例：** 何时分析会议记录：在上次状态会议期间，发现了几个新的项目风险，并导致了长时间的讨论。项目赞助人没有参加这次会议，要求项目经理解释发生了什么。项目经理应该参考会议记录，涵盖会议期间发生的所有情况。\n\
  \n## 考试准备任务\n\n正如引言中“如何使用本书”部分提到的，你有几种准备考试的选择：此处的练习题；第 15 章，“最终准备](#part0032.html_ch15)”；以及在线\
  \ Pearson Test Prep 练习软件。\n\n## 复习所有关键主题\n\n回顾本章最重要的主题，这些主题在页外边距处有“关键主题”图标标记。表 13-2\
