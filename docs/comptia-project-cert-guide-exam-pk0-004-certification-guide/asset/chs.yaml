  \ resource`\n- `resource allocation`\n- `resource shortage`\n\n\n\n\n\n# 资源过度分配\n\
  \n# 属性\n\n# 闲置资源\n\n# 项目间依赖关系](#part0018.html_ch05par30)\n\n# 资源冲突\n\n## 复习习题\n\n\
  这些问题的答案出现在附录 A 中。如需更多示例考试题的练习，请使用在线 `Pearson Test Prep` 练习测试软件。\n\n**1.** 项目团队建立信任阶段的正确顺序是什么？\n\
  \n**a.** 震风期 (storming)、组建期 (forming)、规范期 (norming)、执行期 (performing)、离散期 (de-journing)\n\
  **b.** 震风期 (storming)、组建期 (forming)、执行期 (performing)、规范期 (norming)、离散期 (adjourning)\n\
  **c.** 组建期 (forming)、震风期 (storming)、规范期 (norming)、执行期 (performing)、离散期 (adjourning)\n\
  **d.** 组建期 (forming)、震风期 (storming)、执行期 (performing)、规范期 (norming)、离散期 (adjourning)\n\
  \n**2.** 你是一个新项目的项目经理。在过去的一周里，你获得了项目团队并开始与团队成员进行每日会议。今天，团队开始对项目做出决策。团队正处于哪种信任建立阶段？\n\
  \n**a.** 执行期 (performing)\n**b.** 规范期 (norming)\n**c.** 组建期 (forming)\n**d.** 震风期\
  \ (storming)\n\n**3.** 你是一个新项目的项目经理。项目被分配了三名内部人员。你与部门主管协商了另外两名内部人员。最后，为项目聘请了两名顾问。这些顾问属于哪种类型的资源？\n\
  \n**a.** 协商资源 (negotiated resource)\n**b.** 获取资源 (acquired resource)\n**c.** 预指资源\
  \ (preassigned resource)\n**d.** 远程资源 (remote resource)\n\n**4.** 下列哪些是虚拟团队的缺点？（选择所有适用项。）\n\
  \n**a.** 通讯问题\n**b.** 感到孤立\n**c.** 协作困难\n**d.** 技术成本\n\n**5.** 你管理的项目团队向你反映了一个问题。在听取了双方的意见后，你意识到一方显然是错误的。继续讨论该问题可能对项目产生不利。你应该使用哪种冲突解决技术？\n\
  \n**a.** 强行 (forcing)\n**b.** 平滑 (smoothing)\n**c.** 妥协 (compromising)\n**d.** 对峙\
  \ (confronting)\n\n**6.** 最近，你管理的项目团队就某个项目问题发生了冲突。遗憾的是，问题的解决导致了双输的局面。你最可能使用了哪种冲突解决方法？\n\
  \n**a.** 平滑 (smoothing)\n**b.** 强行 (forcing)\n**c.** 妥协 (compromising)\n**d.** 对峙\
  \ (confronting)\n\n**7.** 在确定当前项目所需的资源时，你确定项目团队需要使用两个研究服务器。遗憾的是，另一个项目目前正在使用这些服务器。管理层决定在两个项目期间，两个项目都可以访问这些服务器。服务器属于哪种资源？\n\
  \n**a.** 共享资源 (shared resource)\n**b.** 低质量资源 (low-quality resource)\n**c.** 闲置资源\
  \ (benched resource)\n**d.** 专用资源 (dedicated resource)\n\n**8.** 在完成一个大建筑内办公室空间的改造后，你发现了许多未使用的地板和电气设备。什么最可能导致了这个问题？\n\
  \n**a.** 闲置资源 (benched resource)\n**b.** 低质量资源 (low-quality resource)\n**c.** 资源短缺\
  \ (resource shortage)\n**d.** 资源过度分配 (resource overallocation)\n\n**9.** 你是一个包含多项硬件采购项目的项目经理，包括一台服务器计算机和一个不间断电源\
  \ (UPS)。当团队收到硬件时，他们通知你 `UPS` 无法处理所需的负载。哪个术语描述了这种情况？\n\n**a.** 低质量资源 (low-quality\
  \ resources)\n**b.** 闲置资源 (benched resources)\n**c.** 资源短缺 (resource shortage)\n\
  **d.** 资源过度分配 (resource overallocation)\n\n**10.** 两个项目都需要某个特定团队成员的技能。遗憾的是，根据项目进度，两个项目在同一周内都需要该成员四天。项目\
  \ A 有三天的浮时间，项目 B 有十四天的浮时间。你应该怎么办？\n\n**a.** 优先考虑项目 B。\n**b.** 优先考虑项目 A。\n**c.**\
  \ 在项目之间分配资源访问，使任务花费倍的时间。\n**d.** 聘请另一个资源来负责其中一个项目。\n\n## 第 6 章 敏捷方法论\n\n本章涵盖了以下主题：\n\
  \n![Image](img/00003.jpeg) **识别敏捷方法论的基本方面：** 适应计划、迭代和增量过程、持续需求收集、用户故事、Scrum 开发、持续反馈、燃尽图、自组织和自引导的团队。\n\
  \n敏捷开发是一种管理团队和项目的特殊方式。虽然敏捷主要用于管理信息技术开发项目，但这种方法适用于任何存在不确定性的项目。`敏捷`一词源于`敏捷宣言`（参见 `agilemanifesto.org`），它描述了四个重要的价值观：\n\
  \n- `个人与互动`优于`过程和工具`\n- `可工作的软件`优于`详尽的文档`\n- `客户协作`优于`合同谈判`\n- `响应变化`优于`遵循计划`\n\n\
  通过寻求传统项目管理的替代方案，敏捷开发帮助团队通过增量、迭代的工作和反馈来应对不可预测性。\n\n本章涵盖了 Project+ 考试的以下目标：\n\n**1.7**\
  \ 识别敏捷方法论的基本方面。\n\n### 注意\n\n提醒：CompTIA 在 Project+ 考试中可能会使用行业标准术语的细微变。有关已知词汇的详细列表，请参见第\
  \ 15 章“最终准备。”\n\n## “我已经掌握了吗？”测验\n\n“我已经掌握了吗？”测验可以让你评估自己应该阅读整个章节，还是跳到“考试准备”部分。如果你对自己的答案或对知识的评估有疑问，请阅读整个章节。表\
