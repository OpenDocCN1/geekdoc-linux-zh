  \ agendas`；记录和分析 `meeting minutes` | 284 |\n\n## 定义关键术语\n\n定义本章中的以下关键术语并在词表表中检查你的答案：\n\
  \n- project charter\n- project management plan\n- scope baseline\n- schedule baseline\n\
  - cost baseline\n- scope management plan\n- requirements management plan\n- schedule\
  \ management plan\n- cost management plan\n- quality management plan\n- process\
  \ improvement plan\n- human resource management plan\n- communication plan\n- risk\
  \ management plan\n- procurement management plan\n- stakeholder management plan\n\
  \n\n\n\n\n- 变更管理计划\n- 配置管理计划\n- 问题日志\n- 组织结构图\n- 项目范围声明\n- 项目进度\n- 状态报告\n- 项目仪表板\n\
  - 行动事项\n- 问题\n- 会议议程\n- 会议纪要\n\n## 复习题\n\n这些问题的答案出现在附录 A 中。如需更多示例考试题练习，请使用在线 Pearson\
  \ 测试练习软件。\n\n**1.** 你是一个负责设计和建造百老汇音乐剧布景项目的项目经理。你需要启动规划过程并创建项目管理计划。你应该咨询哪份项目文件？\n\
  \n**a.** 范围声明\n**b.** 项目章程\n**c.** 状态报告\n**d.** 组织结构图\n\n**2.** 一个正在进行的项目增加了一个新的利益相关者。该利益相关者对项目范围、需求、进度和预算有疑问。该利益相关者需要哪份项目文件？\n\
  \n**a.** 范围声明\n**b.** 仪表板信息\n**c.** 项目管理计划\n**d.** 状态报告\n\n**3.** 在一次项目会议期间，一位利益相关者提到计划中的项目活动场地在活动当天可能无法使用。这并不是一个记录在案的项目风险。信息应该*首先*记录在哪里？\n\
  \n**a.** 状态报告\n**b.** 仪表板\n**c.** 行动事项\n**d.** 问题日志\n\n**4.** 分配到你项目的一名团队成员无法可用。你找到了一个新资源，但那人在你公司的另一个部门，你必须与项目外部的人员协商该人员的时间。哪份文件可以帮助你确定应该与谁协商该资源？\n\
  \n**a.** 组织结构图\n**b.** 沟通计划\n**c.** 项目进度\n**d.** 项目章程\n\n**5.** 你是一个学校改建项目的项目经理。项目赞助人联系了你，想知道教室里的橱柜是否会被更换。哪份文件包含这些信息？\n\
  \n**a.** 组织结构图\n**b.** 状态报告\n**c.** 项目章程\n**d.** 范围声明\n\n**6.** 对于以下哪个问题，你需要分析沟通计划？\n\
  \n**a.** 下周内需要发生哪些紧急行动？\n**b.** 会议上讨论了哪些主题？\n**c.** 哪些利益相关者将收到某份报告？\n**d.** 即将举行的会议将讨论哪些主题？\n\
  \n**7.** 下列哪项不会出现在项目进度中？\n\n**a.** 资源分配\n**b.** 延迟的原因\n**c.** 活动依赖关系\n**d.** 活动长度\n\
  \n**8.** 一位关键利益相关者已经休假了一周。当她回来时，她需要了解项目及其进度。完成这一点的最快方法是什么？\n\n**a.** 检查仪表板和状态报告。\n\
  **b.** 检查项目进度。\n**c.** 检查问题日志和行动事项。\n**d.** 要求项目经理开个会议。\n\n**9.** 在今天的状态会议上，一名项目团队成员表示他需要某个特定的应用程序和一些特定的研究结果来帮助项目完成。这些信息应该记录在哪里？\n\
  \n**a.** 问题日志\n**b.** 行动事项\n**c.** 状态报告\n**d.** 仪表板\n\n**10.** 一名项目团队成员正在准备即将到来的状态会议，他在会上被要求对讨论的某些问题发表意见。哪份文件可以为他提供指导？\n\
  \n**a.** 问题日志\n**b.** 行动事项\n**c.** 会议议程\n**d.** 会议纪要\n\n## 第 14 章供应商文档\n\n本章涵盖了以下主题：\n\
  \n![Image](img/00003.jpeg) **理解常见的合作伙伴或以供应商为中心的文档及其目的：** 文件包括信息请求 (RFI)、建议书请求 (RFP)、报价请求\
  \ (RFQ) 以及具有共同约束力的文件（协议/合同、保密协议、停止终止函、意向书、工作说明书、谅解备忘录、服务水平协议、采购订单和保修）。\n\n采购是指需要从第三方获取的任何产品、货物、服务或结果。项目的采购管理计划描述了如何从外部来源采购任何货物和服务，项目经理应该为选择采购源制定标准。根据从第三方所需的货物和服务，项目经理可能需要管理多个供应商和合同类型。\n\
  \n单独采购由供应商文档管理，其中包括采购的条款和条件。由于供应商文件被认为具有法律约束力，此类文档通常以正式方式进行审查和批准。每份文件必须包含所有所需的规格，以确保采购符合项目需求。每项采购通常在项目从规划到结束的阶段单独管理。大型项目可能涉及管理多个采购合同。项目经理可能需要理解各种类型的供应商文档，包括信息请求\
  \ (RFI)、建议书请求 (RFP)、报价请求 (RFQ) 以及具有共同约束力的文件。\n\n本章涵盖了 Project+ 考试的以下目标：\n\n**4.3**\
  \ 识别常见的合作伙伴或以供应商为中心的文档及其目的。\n\n***\n\n注意\n提醒：CompTIA 在 Project+ 考试可能会使用行业标准术语的细微变。有关词汇差异的详细列表，请参见第\
  \ 15 章，“最终准备.](#part0032.html_ch15)”\n\n***\n\n### “我掌握这些了吗？”测验\n\n“我掌握这些了吗？”测验可以让你评估是否应该仔细阅读整个章节，还是跳到“考试准备任务”部分。如果你对这些问题的答案或对自己这些主题知识的评估有疑问，请阅读整个章节。表\
  \ 14-1 列出了本章中的主要标题及其对应的“我掌握这些了吗？”测验题。你可以在附录 A 中找到答案，“我掌握这些了吗？”测验和复习题答案.](#part0033.html_app01)”\n\
  \n**表 14-1** “我掌握这些了吗？”基础知识章节与问题映射表\n\n| 基础知识章节(节) | 本节涵盖的问题 |\n| :--- | :--- |\n\
  | 信息请求 (RFI) | 1 |\n| 报价请求 (RFQ) | 2 |\n| 建议书请求 (RFP) | 3 |\n| 保密协议 (NDA) | 4 |\n\
  | 意向书 (LOI) 和 谅解备忘录 (MOU) | 5 |\n\n***\n\n警示\n自评估的目标是衡量你对本章主题的掌握程度。如果你不知道某个问题的答案，或者对答案不确定，那么在自评估中应将该问题标记为错误。为你猜对的答案给分会扭曲自评估结果，并可能给你带来虚假的安全感。\n\
  \n***\n\n**1.** 如果采购方不确定采购的规格，应该发布哪种供应商文档？\n\n**a.** 报价请求\n**b.** 信息请求\n\n\n\n\n\
  \nc. 征求书\n\nd. 工作说明书\n\n2. 报价请求（request for quote）的目的是什么？\n\na. 向通用产品或服务（如计算机或建筑材料）的潜在卖家征求报价\n\
  \nb. 寻求潜在卖家提供与产品、服务或卖家能力相关的信息\n\nc. 向产品或服务的潜在卖家征求提书\n\nd. 概述两个或多个双方之间协议的计划\n\n3.\
  \ 为了获得投标，应向潜在卖家提供哪种供应商文件？\n\na. RFI\nb. PO\nc. RFP\nd. SLA\n\n4. 哪种文档可以确保供应商和承包商不共享项目细节？\n\
  \na. MOU\nb. LOI\nc. SLA\nd. NDA\n\n5. 哪个术语与 LOI 同义？\n\na. PO\nb. MOU\nc. SLA\n\
  d. RFI\n\n### 基础知识\n\n在某个阶段，大多数项目都需要购买服务、材料和/或设备来开展并完成项目。在项目管理标准中，这些从承包商、提供者等处的采购（统称为\
  \ `vendors`）遵循正式的采购流程：\n\n1. 项目经理执行适当的自制或外购分析。\n2. 一旦决定从供应商处购买，项目经理就会记录所需产品或服务的细节以及源选择标准。\n\
  3. 根据这些信息，可能会发布供应商文件，例如信息请求（`RFI`）、征求书（`RFP`）或报价请求（`RFQ`）。\n4. 最终有一位投标者成为选定的来源，然后演变为签订合同的供应商或卖家。采购流程的这部分可能涉及相互约束的供应商文件，如合同/协议、非披露协议（`NDA`）、停止侵函、意向书（`LOI`）或谅解备录（`MOU`）、工作说明书（`SOW`）、服务水平协议（`SLA`）、采购订单（PO`）和/或保修。\n\
  \n在大型组织中，会计部门通常提供必要的支持，以确保所有采购按照记录的业务流程完成。供应商或采购文件既可以通过适当的会计人员处理，也可以由获得授权的项目团队成员处理。可能还需要采购专家或部门来协助项目采购。会计部门管理的采购文件必须提供给项目经理，反之亦然。无论由谁负责项目的采购流程，都必须根据采购管理计划中记录的既定业务流程创建、维护和存储适当的供应商文件。\n\
  \n![Image](img/00004.jpeg)\n\n### 信息请求 (RFI)\n\n`信息请求 (RFI)` 是一种采购文件，其中买方要求潜在卖家提供与产品/服务相关的信息，或提供卖家提供该产品/服务能力的信息。在\
  \ `RFI` 中，项目经理不提供项目细节，而是关注供应商的能力、技能和经验。这种方法允许买方预选具有适当能力提交提议书的服务提供商。`RFI` 还可以帮助供应商在无法满足项目既定需求时将其排除在考虑之外。\n\
  \n`RFI` 应列出以下细节：谁发布了 `RFI`、`RFI` 适用于项目、`RFI` 引用 ID、发布日期、`RFI` 适用于项目范围的 `WBS` 级、`RFI`\
  \ 的优先级、发布者需要回复的任何特定查询或问题，以及回复 `RFI` 的截止日期。\n\n**示例：** 一家小型企业需要安装新的网络基础设施以及保护网络的设备。该项目的布线和路由器已经订购。为了购买防火墙，项目经理需要更多关于防火墙及其提供服务的信息。项目经理发布了\
  \ `RFI`，以获取尽可能关于可用防火墙产品的信息。在收到对 `RFI` 的回复后，项目经理可以咨询领域专家（`SMEs`），获取他们对这些回复的意见。\n\n\
  项目经理应该跟踪 `RFIs`，并意识到何时实施了过多的 `RFIs`。过多的 `RFIs` 可能表明合同或项目文件不完整，或者对项目采购需求的研究不完全。大量的\
  \ `RFIs` 会导致项目延误和额外成本。\n\n关于 `RFIs`，请记住以下几点：\n\n- ![Image](img/00003.jpeg) 当信息不完整或缺乏理解而无法确定规格时，使用\
  \ `RFIs`。\n- ![Image](img/00003.jpeg) `RFIs` 有助于缩小供应商范围。\n- ![Image](img/00003.jpeg)\
  \ `RFIs` 不完成合同。\n- ![Image](img/00003.jpeg) 在接收并分析了所有供应商对 `RFI` 的回复后，下一步是发布征求书或报价请求。\n\
  \n![Image](img/00004.jpeg)\n\n### 征求书 (RFP)\n\n`征求书 (RFP)` 是一种采购文件，其中买方向产品或服务的潜在卖家征求提议书。`RFP`\
  \ 应包含足够的信息，使投标者知道对其提议书的要求和期望。`RFP` 应包含有关请求组织的信息、相关项目信息、项目范围、投标者资质要求、时间表和指南。通过 `RFPs`，供应商在收到\
  \ `RFPs` 后获得资质认定。\n\n**示例：** 一家小型企业的新网络需要一个高速互联网连接。该项目的项目经理向潜在供应商发布了 `RFP`，以了解可用选项。\n\
  \n在创建 `RFP` 时，项目经理应记住以下提示：\n\n- ![Image](img/00003.jpeg) 预定义评估标准，以确保选择团队和潜在供应商理解所有需要评估的领域。\n\
  - ![Image](img/00003.jpeg) 包含一个跨部门的 `RFP` 评审小组，以就与购买相关的价格、合同和财务问题获得更多投入。\n- ![Image](img/00003.jpeg)\
  \ 进行背景调查和实地访问，以确保潜在供应商有能力能够提供产品或服务。\n- ![Image](img/00003.jpeg) 将所有的沟通请求发送给一个人，以防止多个人不得不回答提议问题。\n\
  - ![Image](img/00003.jpeg) `RFP` 中做出的承诺应纳入合同，以确保它们仍然是供应商承诺的一部分。\n\n`RFP` 的最终结果是采购协议或合同。\n\
  \n![Image](img/00004.jpeg)\n\n### 报价请求 (RFQ)\n\n`报价请求 (RFQ)` 是一种采购文件，其中买方向通用产品或服务（如计算机或建筑材料）的潜在卖家征求报价。当产品或服务的规格已知时，使用\
  \ `RFQs` 代替 `RFPs`。`RFQs` 只发布给买方以前合作过的供应商；因此供应商在收到 `RFQ` 之前就已经具备资质。由于对产品或服务的的信息非常已知，`RFQ`\
  \ 主要关于价格。\n\n**示例：** 一家小型企业正在部署一个新的零售销售应用程序。有了应用程序供应商对收银机台、服务器和移动设备的规格，项目经理可以向潜在供应商发布\
  \ `RFQ`，以确定这些设备的成本。\n\n\n\n\n\nRFQ 过程被认为是透明且易于理解的。项目经理应确保授予标准和权重记录了以下细节：\n\n![Image](img/00003.jpeg)\
  \ 产品功能或服务范围\n\n![Image](img/00003.jpeg) 初始价格\n\n![Image](img/00003.jpeg) 总所有成本 (TCO)\n\
  \n![Image](img/00003.jpeg) 产品或服务的风险\n\n![Image](img/00003.jpeg) 供应商风险\n\n![Image](img/00003.jpeg)\
  \ 满足需求的能力\n\n封标投标确保在截止日期之前没有人能看到完成的标书。投标系统在提交截止日期后开放，由选拔团队对 RFQ 进行评审以授予合同。如果第一轮未达到预设价格目标，可能会进行第二轮，由于价格目标的限制，参与者将有限。\n\
  \nRFQ 的最终结果是采购协议或合同。\n\n![Image](img/00004.jpeg)\n\n### 相互具有约束力的文件\n\n`具有约束力的文件`(#part0034.html_gloss179)\
  \ 是双方之间的协议，其中一方承诺为另一方提供服务以换取付款。虽然之前讨论的供应商文档涉及合同授予之前的采购过程，但项目经理还必须理解选择供应商后涉及的相互具有约束力的文件。项目经理应确保法律代表协助起草相互具有约束力的协议，以防在民事诉讼中需要这些文件。\n\
  \n项目经理可能需要理解多种类型的相互具有约束力的文件，如下文章节讨论所示。\n\n![Image](img/00004.jpeg)\n\n### 协议/合同\n\
  \n`协议`或`合同`(#part0034.html_gloss63) 是阐明双方之间交易条件的文件。此类文件包括固定价格合同、成本报销合同和工时与材料合同。合同的类型根据项目需求进行选择。\n\
  \n项目经理应该理解以下合同类型：\n\n![Image](img/00003.jpeg) `固定总价合同 (FFP):`(#part0034.html_gloss110)\
  \ 采购价格在开始时设定，除非工作范围发生变化，否则不会更改。供应商将承担因性能问题导致的任何成本增加。采购规范的变更将导致成本增加。这是最常用的合同类型。\n\
  \n![Image](img/00003.jpeg) **示例：** 一个项目需要购买七台用于图形应用程序的台式电脑。使用 FFP 合同是因为规格已知，且电脑有货或在较短时间内可以获得。\n\
  \n![Image](img/00003.jpeg) `固定价格激励费用合同 (FPIF):`(#part0034.html_gloss112) 与 FFP 一样，采购价格在开始时设定。然而，该合同包含一项条款，将供应商的财务激励与某些条件挂钩——通常与成本、进度或技术性能有关，但包含一个价格上限。最终成本在工作完成后确定。\n\
  \n![Image](img/00003.jpeg) **示例：** 一个项目需要购买一个存储区域网络 (SAN)。选定的供应商预计 SAN 六周后可以设置好并供使用。如果项目需要更早获得\
  \ SAN，项目经理可以使用 FPIF 合同，希望通过财务激励来加速供应商的进度。\n\n![Image](img/00003.jpeg) `带经济价格调整的固定价格合同\
  \ (FP-EPA):`(#part0034.html_gloss113) 采购价格可能会随时间变化，因为这些采购合同可能跨多年。价格可能会根据通货膨胀或商品价格变化等不断变化而波动。通常经济调整条款与特定的财务指数挂钩。\n\
  \n![Image](img/00003.jpeg) **示例：** 一个长期项目涉及在新社区建造房屋。第一阶段将在项目的第一年建造 50 间房屋。第二阶段将在第二年建造\
  \ 100 间房屋。第三阶段将在第三年完成 200 间房屋。对于该项目的木材供应商来说，FP-EPA 合同是最佳选择，因为……\n\n![Image](img/00003.jpeg)\
  \ `成本加固定费用合同 (CPFF):`(#part0034.html_gloss72) 供应商获得所有成本加上固定的费用，除非项目范围发生变化，否则该费用不会更改。\n\
  \n![Image](img/00003.jpeg) **示例：** 一个开发新移动应用程序的项目聘请了第三方创建应用程序的帮助文件。供应商及其技术写作人员应签署保密协议\
  \ (NDA)，以防止泄露任何关于应用程序的信息。\n\n![Image](img/00003.jpeg) `成本加激励费用合同 (CPIF):`(#part0034.html_gloss73)\
  \ 供应商获得所有成本加上根据实现特定目标而获得的激励费用。\n\n![Image](img/00003.jpeg) `成本加奖金费用合同 (CPAF):`(#part0034.html_gloss71)\
  \ 供应商获得所有成本加上根据对性能的主观评估而获得的奖金费用。\n\n![Image](img/00003.jpeg) `工时与材料合同 (T&M):`(#part0034.html_gloss364)\
  \ 这种合同通常在无法制定工作说明书时使用。付款是基于可计费时间和允许的成本支付的。\n\n#### 保密协议 (NDA)\n\n`保密协议 (NDA)`(#part0034.html_gloss187)\
  \ 是一种保密协议，其中选定的供应商和任何参与采购的供应商人员同意不披露有关项目的细节。NDA 通常用于项目涉及将与供应商共享的机密信息，但项目赞助人希望这些信息保持私密的情况。\n\
  \nNDA 确定了机密信息的类型而不实际泄露细节，列出了协议涵盖的双方，并规定了 NDA 不涵盖的信息类型。\n\n\n\n\n\n在某些情况下，保密协议（NDA）可能需要包含`竞业条款`(part0034.html_gloss186)或单独的`竞业协议`，以防止供应商在指定的时间内为买方的直接竞争对手开展类似的项目。NDA\
  \ 的执行期限应包含在合同中，并附带与协议相关的任何惩罚措施。\n\n**示例：** 一个项目正在为安全分析师开发培训材料。该项目将聘请第三方提供内容开发团队。该团队需要进行昂贵的教育和准备，以确保他们拥有编写培训材料的必要技能。项目经理在\
  \ NDA 中包含了竞业条款，以确保同一团队不会被用于为直接竞争对手开发材料。\n\n![Image](img/00004.jpeg)\n\n## 停止函 (Cease-and-Desist\
  \ Letter)\n\n`停止函`(part0034.html_gloss36) 用于指示某个人或实体立即停止某项行为（停止）并永远不再这样做（杜止）。该文件通常适用于特定的活动、劳务实践或竞争方法。常见的例子是违反版权或专利。停止函可以包含补偿要求，或为了纠正违规行为而提出的正式署名请求。停止函可以单独发布，也可以与民事诉讼结合使用。由法律代表发出的停止函通常比仅由项目发起人发出的函更有分量。\n\
  \n**示例：** 当 A 公司正在开发一个新的游戏系统时，获竞争对手刚刚发布了一款基于 A 公司项目发起人专利技术的类似设备。项目发起人的法律代表在采取法律行动之前应出具一封停止函。\n\
  \n![Image](img/00004.jpeg)\n\n## 意向书 (LOI) 与谅解备录 (MOU)\n\n`意向书 (LOI)`part0034.html_gloss162)或`谅解备录\
  \ (MOU`](part0034.html_gloss170)概述了两个或多个双方之间协议的计划，通常是正式合同的前身。这种临时措施通常用于实施，说明双方正在谈判合同条款。项目经理应确保\
  \ LOI 或 MOU 有有限的时间限制，并尽快实施正式合同。\n\n### 注意事项\n\n在编写时，CompTIA 在目标 4.3 的“相互具有约束力的文件”部分将\
  \ LOI 和 MOU 列为单独的要点。在美国，这两个术语通常被视为同义，因此本文讨论将它们视为同一种类型的文件。\n\nLOI 或 MOU 不具有法律约束力，但它们带有某种程度的严肃性和相互尊重，比“君士协议”™要强。当使用其中任何一种类型的文件时，意味着一份具有约束力的合同正在制定中。\n\
  \n**示例：** 在一个将发布新教育系统的项目中，项目发起人开始谈判购买该项目的一个供应商。项目发起人发布了的一封意向书以宣布这些谈判。\n\n## 工作说明书\
  \ (SOW)\n\n![Image](img/00004.jpeg)\n\n采购`工作说明书 (SOW)`part0034.html_gloss350 对采购项目进行描述，以便让潜在供应商了解规格并判断他们是否能够提供满足规格的采购物品。SOW\
  \ 可以包含所需的数量、质量规格、性能数据、履行期、工作地点以及任何其他要求。\n\n**示例：** 对于一个为 IT 课程制作培训材料的项目，合同将说明项目的条款和条件，包括付款信息。SOW\
  \ 包含了有关所需最终产品的细节，包括将作为产品部分的任何图形、视频和评估问题。\n\n每项采购都需要特定的工作说明书，但 SOW 可以将供应商作为该采购一部分提供的多个相关产品或服务分组。\n\
  \n![Image](img/00004.jpeg)\n\n### 服务水平协议 (SLA)\n\n`服务水平协议 (SLA)`part0034.html_gloss334\
  \ 是服务提供商与其客户之间的合同。SLA 为服务的不同方面设定了特定指标，包括质量、可用性和责任。例如，项目与其其 IT 服务之间、组织与其互联网服务提供商（ISP）之间，或组织与其云计算提供商之间可能存在\
  \ SLA。某些项目服务可能由同一组织内部的部门提供。在这种情况下，部门与项目之间的 SLA 确保了承诺的服务有正式协议。例如，IT 部门与项目之间的 SLA\
  \ 确保了项目所需的服务已记录在案。\n\nSLA 应描述提供的服务类型、性能水平、报告问题的步骤、响应和问题解决参数、流程和服务水平报告，以及后果。项目经理应确保\
  \ SLA 中设定的参数将满足项目的需求。\n\n![Image](img/00004.jpeg)\n\n### 采购订单 (PO)\n\n`采购订单 (PO)`part0034.html_gloss257\
  \ 是合同签署后立即发出的文档，用于澄清购买细节。PO 说明了财务协议、条款、交付方式、交付日期、所需数量等，并对购买者具有约束力。根据组织政策，项目经理可能只需要对超过某些金额的购买发布\
  \ PO。一旦产品或服务交付，供应商将开具一份引用 PO 的发票。这种做法允许适当的会计程序跟踪整个交易。\n\n## 保修\n\n![Image](img/00004.jpeg)\n\
  \n`保修`](part0034.html_gloss379 为采购项目的质量水平提供了保证。在某些情况下，保修是合同的一部分。然而，某些采购物品（如计算机、路由器和其他设备）可能带有单独的保修声明。这些保修在一定时间内有效，通常为几个月或几年。保修应作为采集采集的任何配置管理数据的一部分记录。\n\
  \n## 考试准备任务\n\n如引言中“如何使用本书”部分所述，您有几种准备考试的选择：这里的练习题；第 15 章，“最后的准备”以及在线 Pearson Test\
  \ Prep 模拟考试软件。\n\n## 复习所有关键主题\n\n复习本章最重要的主题，这些主题在页外边缘用“关键主题”图标标记。表 14-2 提供了这些关键主题的参考以及各自开始的页码。\n\
  \n![Image](img/00004.jpeg)\n\n**表 14-2** 第 14 章关键主题\n\n| 关键主题元素 | 描述 | 页码 |\n| :---\
