    ## 重定向


    如上所述，许多 Unix 命令从标准输入（通常是键盘）读取数据，并将数据写入标准输出（通常是终端屏幕）。重定向运算符允许您从文件读取输入（`<`）或将程序输出写入文件（`>`）。当输出被重定向到文件时，如果该文件已存在，程序输出将替换文件的原始内容；要将程序输出追加到现有文件的末尾，请使用追加重定向运算符（`>>`）。


    观察以下命令的结果：


    ```bash

    ./a.out

    ```


    系统将提示您输入华氏温度。输入一个数值后，屏幕上将显示一条消息，告知您等效的摄氏温度。在此示例中，您通过键盘以标准输入方式输入了一个数值，并且程序的输出显示在终端屏幕上。


    在下一个示例中，您将从文件读取数据，并将结果显示在屏幕上（标准输出）：


    ```bash

    cat data.in

    ./a.out < data.in

    ```


    现在，您将从标准输入（键盘）读取数据并写入文件：


    ```bash

    ./a.out > data.two

    35

    cat data.two

    ```


    现在从标准输入读取数据，并将结果追加到现有文件中：


    ```bash

    ./a.out < data.in >> data.two

    ```


    作为重定向的另一个示例，请观察以下两个命令的结果：


    ```bash

    ls -la /etc > temp

    more temp

    ```


    这里我们将 `ls` 命令的输出重定向到文件“temp”，然后使用 `more` 命令逐页显示该文件的内容。在下一节中，我们将看到如何使用管道简化此操作。


    ### 使用管道和过滤器


    过滤器是一个 Unix 程序，它从标准输入接受输入并将其输出放入标准输出。过滤器增强了 UNIX 系统的功能，因为可以编写程序，将另一个程序的输出作为输入使用，并创建可供另一个程序使用的输出。管道（用符号“|”——垂直线表示）用于
    UNIX 命令之间，表示第一个命令的输出将作为第二个命令的输入。请比较以下两个命令的输出：


    ```bash

    ls -la /etc

    ls -la /etc | more

    ```


    第一个命令以长格式显示“/etc”目录中的所有文件。由于信息快速滚动过屏幕，因此很难利用这些信息。在第二行中，`ls` 命令的结果被管道传输到 `more`
    命令。现在我们可以通过逐屏检查此信息，甚至可以根据需要返回到前一屏的信息。随着您对 UNIX 更加熟悉，您会发现将输出管道传输到 `more` 命令在许多应用程序中非常有用。


    `sort` 命令可用于按所需顺序对文件中的行进行排序。现在输入以下命令并观察结果：


    ```bash

    who

    sort cars

    who | sort

    ```


    `who` 命令显示当前登录到系统的用户列表。`sort` 命令允许我们对信息进行排序。第二个命令按首字段的字母顺序对文件 cars 中的行进行排序，并在标准输出中显示结果。第三个命令说明了如何在显示之前将
    `who` 命令的结果传递给 sort 命令。结果是按字母顺序排列的已登录用户列表。


    以下示例使用“awk”和“sort”命令来选择和重新组织由“ls”命令生成的输出：


    ```bash

    ls -l | awk ''/:/ {print $5,$9}'' | sort -nr

    ```


    注意：花括号不一定能在所有输出设备上正确显示。在上面的示例中，单词 print 前应有一个左花括号，数字 9 后应有一个右花括号。


    请注意，输出按大小递减的顺序显示文件大小和文件名。这里 ls 命令首先生成当前目录中文件的“长”列表，该列表被管道传输到“awk”实用程序，其输出随后被管道传输到“sort”命令。


    “awk”是一个强大的实用程序，它处理一行或多行程序以在文件中查找模式，并根据找到的内容执行选择性操作。斜杠 (/) 字符用作要匹配的模式和要采取的操作的定界符，操作包含在花括号中。如果未指定模式，则处理文件中的所有行；如果未指定操作，则输出所有匹配指定模式的行。由于这里使用了冒号
    (:)，因此选择了所有包含文件信息的行（每个文件对应的时间列包含冒号），并且第 5 列和第 9 列包含的信息被输出到 sort 命令。


    注意：如果您系统中的 ls 命令不包含列出组成员资格的列，请使用 `{print $4, $8}` 代替上面列出的 awk 的“print”命令选项。


    这里“sort”命令选项“-nr”指定将“awk”的输出按反向数字顺序（即从最大到最小）进行排序。


    前面的命令有点复杂，输入时很容易出错。如果这是一个您经常使用的命令，我们可以将其包含在 shell 脚本中，如示例文件“filesize”所示。要使用此 shell
    脚本，只需输入以下命令：


    ```bash

    ./filesize

    # 或

    sh filesize

    ```


    如果您使用 cat 或 vi 命令检查此文件的内容，您会发现它只包含将 ls 命令管道传输到 awk，然后将输出管道传输到 sort。


    tee 实用程序用于将输出同时发送到文件和屏幕：


    ```bash

    who | tee who.out | sort


    cat who.out

    ```


    在这里，您应该观察到屏幕上以字母顺序显示了已登录用户的列表，并且文件“who.out”包含相同 userid 的未排序列表。


    ## 一些额外的文件处理命令


    ### 字数统计


    命令 `wc` 显示文件中的行数、单词数和字符数。


    要显示文件 `file_name` 中的行数、单词数和字符数，请输入：


    ```bash

    wc file_name

    ```


    ### 比较两个文件的内容：`cmp` 和 `diff` 命令


    `cmp` 和 `diff` 命令用于比较文件；`comp` 命令不是用于比较文件，而是用于“创建消息”。


    `cmp` 命令可用于二进制和文本文件。它指示两个文件出现第一个差异的位置（字节和行）。


    `diff` 命令可用于比较文本文件，其输出显示两个文件中不同的行：小于号（“<”）出现在第二个文件中与第一个文件不同的行之前，大于号（“>”）出现在第二个文件中不同的行之前。匹配的行不会显示。


    观察以下命令的结果：


    ```bash

    cmp   page1  page2

    diff  page1  page2

    ```


    这两个文件的第 1 行和第 2 行相同，第 3 行有一个字符不同，并且 page1 在第 3 行之后包含一个空行，而 page2 则没有。


    # 第九章：导航和文件管理


    如果您没有太多使用 Linux 系统的经验，可能会因为要从命令行控制操作系统而感到不知所措。在本书中，我们将尝试帮助您快速掌握基础知识。


    ## 先决条件和目标


    为了跟随本书，您需要能够访问 Linux 服务器。您还需要对终端的工作原理和 Linux 命令的样子有基本的了解。本书涵盖终端基础知识，因此如果您是首次使用终端，建议先查看相关内容。本书中的所有材料都可以使用普通的非
    root（非管理员）用户账户完成。您可以通过遵循您的发行版的初始服务器设置指南（Ubuntu 14.04, CentOS 7）来学习如何配置此类用户账户。当您准备好开始时，请使用
    SSH 连接到您的 Linux 服务器，并继续向下阅读。


    ## 导航和探索


    您需要掌握的最基本技能是导航文件系统。我们将在本节讨论允许您做到这一点的工具。


    ### 使用“pwd”命令查找当前位置


    当您登录到服务器时，通常会被放入用户账户的主目录。主目录是为您的账户预留用于存储文件和创建目录的目录。它是文件系统中您拥有完全控制权的地点。要了解主目录相对于文件系统的其余部分位于何处，您可以使用
    pwd 命令。此命令显示我们当前所在的目录：


    ```bash

    pwd

    ```


    您应该得到类似以下信息：


    ```bash

    /home/demo

    ```


    主目录以用户账户命名，因此上述示例是如果您使用名为 demo 的账户登录到服务器时的值。此目录位于一个名为 /home 的目录中，而 /home 本身又位于顶级目录中，顶级目录被称为“根”目录，用单个斜杠“/”表示。


