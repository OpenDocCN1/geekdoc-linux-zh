    |


    | M or m | In addition to the normal behavior of the special regular expression
    characters ^ and $, this flag causes ^ to match the empty string after a newline
    and $ to match the empty string before a newline. | daemon:x:1:1:daemon:/usr/sbin:/bin/sh
