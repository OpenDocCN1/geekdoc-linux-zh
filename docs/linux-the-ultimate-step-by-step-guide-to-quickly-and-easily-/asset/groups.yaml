    请观察，“filesize” 是一个可执行的 shell 脚本，它显示文件的大小。还要注意，“./hobbit” 和 “./add2” 会产生错误诊断，因为不存在名为
    “hobbit” 的命令或文件，并且文件 “add2” 缺乏执行权限。


