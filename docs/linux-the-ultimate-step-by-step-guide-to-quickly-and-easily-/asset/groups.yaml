    ```bash

    ls -la /etc

    ls -la /etc | more

    ```


    The first command displays all the files in the “/etc” directory in long format.
    It is difficult to make use of this information since it scrolls rapidly across
    the screen. In the second line, the results of the `ls` command are piped into
    the `more` command. We can now examine this information one screen at a time and
    can even back up to a prior screen of information if we wish to. As you become
    more familiar with UNIX, you will find that piping output to the `more` command
