    使用 `vi ""` 命令退出该文件。


    ## Cat 命令


    `cat` 是一个用于**拼接（conCATenate）**文件的实用工具。因此，它可以用于将文件连接在一起，但更常见的用途是在屏幕上显示文件的内容。


    请观察以下每条命令产生的输出：


    ```

    cd;       cd   xmp

    cat       cars

    cat   -vet  cars

    cat   -n    cars

    ```


    此示例第一行中的分号（;）是一个命令分隔符，它允许在一行中输入多个命令。在此行之后按下 <Return> 键时，系统会发出 `cd` 命令，切换到你的主目录。然后发出
    `cd xmp` 命令，进入子目录 “xmp”。输入此行等同于在单独的行中依次输入这些命令。示例中包含这两个命令是为了确保你位于包含 “cars” 和其他示例文件的子目录中。如果你已经位于复制示例文件时创建的
    “xmp” 目录中，则无需输入这些命令。


    “-vet” 选项启用显示文件内的制表符、行尾及其他不可打印字符；“-n” 选项在显示时对每行进行编号。


    你也可以使用 cat 命令将文件连接在一起：


    ```

    cat  page1

    cat  page2

    cat  page1   page2 > document

    cat  document

    ```


    **注意：** 如果文件 “document” 之前已存在，它将被文件 “page1” 和 “page2” 的内容替换。


    **使用 cat 命令的注意事项：** cat 命令仅应用于“文本”文件；不应将其用于显示二进制文件（例如，编译后的 C 或 FORTRAN 程序）的内容。可能会出现不可预测的结果，包括终止你的登录会话。在使用
    cat 命令处理任何未知文件之前，请使用命令 `file *` 显示目录中文件的特性。你可以使用 od 命令（输入 “man od” 了解八进制转储的使用细节）来显示非文本文件的内容。例如，要以十六进制和字符表示法显示
    “a.out” 的内容，请输入：


    ```

    od -xc a.out

    ```


    **警告：** cat（以及其他 Unix 命令）如果使用不当，可能会破坏文件。例如，正如 Sobell 书中所示，cat（以及 cp 和 mv）命令可以覆盖并因此破坏文件。请观察以下命令的结果：


    ```

    cat letter page1 > letter

    ```


    通常，UNIX 在命令成功执行时不会返回消息。此处，UNIX 操作系统将尝试通过首先初始化文件 “letter”，然后将 “letter”（当前为空）和 “page1”
    的当前内容写入该文件来完成请求的命令。由于 “letter” 已被重新初始化且也被命名为主源文件，因此会生成错误诊断。UNIX 哲学的一部分是“没有消息就是好消息”。因此，出现消息意味着命令未成功完成，这是一个警告。


    现在使用 “cat” 命令单独检查文件 “letter” 和 “page1” 的内容。请观察，文件 “letter” 并未包含原本意图中的文件 “letter”
    和 “page1” 的原始内容。


    使用以下命令恢复原始文件 “letter”：


    ```

    cp ~aixstu00/xmp/letter.

    ```


    ## More 命令


    你可以使用 more 命令输入或浏览文件。“more” 命令在检查大文件时非常有用，因为它每次显示一页文件内容，允许随时检查每一页。与 man 命令一样，你必须按下空格键才能前进到文件的下一个屏幕。在许多系统中，按下
    <b> 键可以允许你向后翻阅文件。要在任何时候终止 more，请按下 <q>。


    要使用 more 命令检查文件，只需输入：


    ```

    more  file_name

    ```


    **man** 命令使用 **more** 命令显示手册页；因此，你熟悉的用于 **man** 的命令也将适用于 **more**。并非所有 Unix 系统都包含
    **more** 命令；有些系统改为实现 **pg** 命令。VTAIX 同时包含 **more** 和 **pg** 命令。当使用 **pg** 命令时，请按
    `<Return>` 键在文件中向下翻页，而不是使用空格键。


    请观察输入以下命令的结果：


    ```

    more  argtest

    pg    argtest

    ```


    ## Head 命令


    **head** 命令用于显示文件的前几行。当你希望在文件开头查找特定信息时，此命令可能很有用。例如，输入：


    ```

    head  argtest

    ```


    ## Tail 命令


    **tail** 命令用于显示文件的最后几行。当需要监视将输出附加到文件末尾的程序的运行状态时，此命令可能很有用。例如，输入：


    ```

    tail  argtest

    ```


    ## 复制、擦除、重命名


    > **警告：** 典型的 Unix 操作系统不提供“取消擦除”或“取消删除”命令。如果你错误地删除了文件，你需要依靠你或系统管理员维护的备份来恢复该文件。使用诸如
    **copy** 和 **move** 等命令时需要小心，因为这可能会导致覆盖现有文件。如果你使用的是 C 或 Korn Shell，你可以创建一个命令**别名**，这些命令在覆盖文件之前会提示你进行确认。


    ### 复制文件


    **cp** 命令用于复制文件或一组文件。当你将示例文件复制到你的用户 ID 时，你之前已经见过 **cp** 命令的应用示例。现在让我们复制其中一个文件。请记住，你可以使用
    `ls` 命令获取当前目录中文件的列表。请观察以下命令的结果：


    ```

    ls l*

    cp letter letter.2

    ls l*

    ```


    **注意：** 与许多其他操作系统（如 PC/DOS）不同，你必须在复制命令中指定目标；如果未指定“复制至”目标，它不会假设当前目录。


    ### 擦除文件


    Unix 使用命令 `rm`（ReMove）来删除不需要的文件。要删除我们刚创建的文件 “letter.2”，请输入：


    ```

    rm letter.2

    ```


    输入命令 `“ls l*”` 以显示所有以字母 “l” 开头的文件列表。请注意，letter.2 不再存在于当前目录中。remove 命令可以与文件名中的通配符一起使用；然而，这可能很危险，因为你可能最终会擦除想要保留的文件。建议使用
    `rm` 的 “-i”（交互式）选项进行通配符删除——届时，你将被提示对每个想要删除的文件回答‘Y’或‘N’。


    ### 重命名文件


    典型的 Unix 操作系统实用程序不包含重命名命令；然而，我们可以使用 `mv`（MoVe）命令（有关此命令的其他用途，请参阅“处理目录”）将文件从一个名称“移动”到另一个名称。请观察以下命令的结果：


    ```

    ls [d,l]*

    mv letter document

    ls [d,l]*

    mv document letter

    ls [d,l]*

    ```


    **注意：** 第一个 `mv` 命令覆盖了你之前通过拼接 “page1” 和 “page2” 创建的文件 “document”。使用 `mv` 命令将文件移动到现有文件名称时，不会发出警告。如果你希望当
    `mv` 命令覆盖现有文件时提示确认，请使用 `mv` 命令的 “-i”（交互式）选项，例如：


    ```

    mv -i page1 letter

    ```


    此时，你将被告知文件 “letter” 已存在，并且你会被询问是否要继续执行 `mv` 命令。只要回答不是 “y” 或 “Y”，文件 “letter” 就不会被覆盖。


    ### 使用命令行


    命令解释器（shell）提供了输入命令被解释并传递给 Unix 内核或其他程序进行处理机制。请观察输入以下命令的结果：


    ```

    ./filesize

    ./hobbit

    ./add2

    ls -F

