  md: "\n![](img/95e14ba64977353b42ea3103515e63c3_38_0.png)\n\n## Step 4: Select Language\
    \ and Keyboard\n\nSelect your preferred language.\n\n![](img/95e14ba64977353b42ea3103515e63c3_38_1.png)\n\
    \n## Step 5: Change the Installation Destination\n\nBy default, the Anaconda installer\
    \ will choose automatic partitioning for your hard disk. Click on the INSTALLATION\
    \ DESTINATION icon to change to custom partitioning.\n\n![](img/95e14ba64977353b42ea3103515e63c3_38_2.png)\n\
    \nSelect the hard drive where you want to install CentOS 7 and under Other Storage\
    \ Options, choose ‘I will configure partitioning’ then click Done.\n\n![](img/95e14ba64977353b42ea3103515e63c3_39_0.png)\n\
    \n## Step 6: Select the Partitioning Scheme\n\nNext, select the partitioning scheme\
    \ to use for the mountpoints. In this case, choose Standard Partition.\n\n![](img/95e14ba64977353b42ea3103515e63c3_39_1.png)\n\
    \n## Step 7: Create a Swap Space\n\nYou can create a swap space in one of the\
    \ partitions and set the desired capacity, which is dependent on how much RAM,\
    \ the system has. Choose the File System for swap space as *swap*, and select\
    \ the **Reformat** option. You can also name your swap space to whatever name\
    \ you like but a name like *swap* is more descriptive.\n\n![](img/95e14ba64977353b42ea3103515e63c3_40_0.png)\n\
    \n## Step 8: Create a Mountpoint\n\nThe next step is to create the mountpoint\
    \ where the root partition will be installed. Depending on your requirements,\
    \ you might need to put the boot, home and root partitions on different mountpoints.\
    \ In this instance, we shall only create one mountpoint `/`.\n\nNext, set the\
    \ **Label** and **Desired Capacity** to whatever you wish. A rule of thumb is\
    \ to use descriptive names for the label especially if the computer is to be managed\
    \ by different system administrators. Choose the file system as `ext4` and select\
    \ the Reformat option.\n\n![](img/95e14ba64977353b42ea3103515e63c3_40_1.png)\n\
    \n## Step 9: Accept Changes\n\nAfter Steps 7 and 8 have successfully completed\
    \ click on **Done** button. A prompt window will appear with a summary of the\
    \ changes that will take place. If you are satisfied with them click **Accept\
    \ Changes**.\n\n![](img/95e14ba64977353b42ea3103515e63c3_41_0.png)\n\n## Step\
    \ 10: Set Date and Time\n\nClick on the Clock icon under the localization menu\
    \ and select your time zone from the map of the world, then click Done.\n\n![](img/95e14ba64977353b42ea3103515e63c3_41_1.png)\n\
    \n## Step 11: Begin Installation\n\nClick on the Begin Installation button.\n\n\
    ![](img/95e14ba64977353b42ea3103515e63c3_41_2.png)\n\nInstallation will begin\
    \ immediately and as it proceeds you will need to set up a user account as well\
    \ as the root password.\n\n![](img/95e14ba64977353b42ea3103515e63c3_42_0.png)\n\
    \n## Step 12: Set Up Root Password\n\nClick on the ROOT PASSWORD option and enter\
    \ a password and confirmation of the same then click Done.\n\n![](img/95e14ba64977353b42ea3103515e63c3_42_1.png)\n\
    \n## Step 13: Create a User Account\n\nThe next step is to create a user account.\
    \ Enter the details and if this is an administrator account, check Make this user\
    \ administrator and Require a password to use this account for security purposes.\n\
    \n![](img/95e14ba64977353b42ea3103515e63c3_43_0.png)\n\n## Step 14: Complete Installation\n\
    \nThe installer should finish installing the software and boot loader.\n\n![](img/95e14ba64977353b42ea3103515e63c3_43_1.png)\n\
    \nHopefully, once the install is complete you will get a success message, after\
    \ which you can click Quit. Now logout from the live system and login to your\
    \ new installation. Finally, once you login to your CentOS 7 accept the EULA agreement\
    \ and enjoy!\n\n![](img/95e14ba64977353b42ea3103515e63c3_44_0.png)\n\n## Change\
    \ and Set Hostname Command\n\nOn a CentOS Linux 7 server, you can use any one\
    \ of the following tools to manage hostnames:\n\n- hostnamectl: Control the system\
    \ hostname. This is the recommended method.\n- nmtui: Control the system hostname\
    \ using text user interface (TUI).\n- nmcli: Control the system hostname using\
    \ CLI part of NetworkManager.\n\n### Method #1: hostnamectl\n\nLet us see how\
    \ to use the hostnamectl command.\n\nTo verify new settings, enter:\n\n```\n#\
    \ hostnamectl status\n```\n\n### How do I see the host names?\n\nSample outputs:\n\
    \n| Static hostname | server1.cyberciti.biz |\n| :--- | :--- |\n| Pretty hostname\
    \ | Senator Padmé Amidala's Laptop |\n| Transient hostname | r2-d2 |\n| Icon name\
    \ | computer |\n| Chassis | n/a |\n| Machine ID | b5470b10ccfd49ed8e4a3b0e953a53c3\
    \ |\n| Boot ID | f79de79e2dac4670bddffe528e826b61f |\n| Virtualization | oracle\
    \ |\n| Operating System | CentOS Linux 7 (Core) |\n| CPE OS Name | cpe:/o:centos:centos:7\
    \ |\n| Kernel | Linux 3.10.0-229.1.2.el7.x86_64 |\n| Architecture | x86_64 |\n\
    \nHow do I delete a particular host name?\n\nThe syntax is:\n\n```\n# hostnamectl\
    \ set-hostname \"\"\n# hostnamectl set-hostname \"\" --static\n# hostnamectl set-hostname\
    \ \"\" --pretty\n```\n\nHow do I change host name remotely?\n\nUse any of the\
    \ following syntax:\n\n```\n# ssh root@server-ip-here hostnamectl set-hostname\
    \ server1\nOR set server1 as host name on a remote host called 192.168.1.42 using\
    \ ssh:\n# hostnamectl set-hostname server1 -H root@192.168.1.42\n```\n\n### Method\
    \ #2: nmtui\n\nYou can set host name using the **nmtui** command, which has text\
    \ user interface for new users:\n\n```\n# nmtui\n```\n\n![](img/95e14ba64977353b42ea3103515e63c3_45_0.png)\n\
    \nSample outputs:\n\nUse the **Down** arrow key > select the ‘Set system hostname’\
    \ menu option > Click\n\n![](img/95e14ba64977353b42ea3103515e63c3_45_1.png)\n\n\
    the OK button:\n\nYou will see the confirmation box as follows:\n\n![](img/95e14ba64977353b42ea3103515e63c3_46_0.png)\n\
    \nFinally, restart the hostnamed service by typing the following command:\n\n\
    ```\n# systemctl restart systemd-hostnamed\n```\n\nTo verify the changes, enter:\n\
    \n```\n# hostnamectl status\n```\n\n### Method #3: nmcli\n\nThe **nmcli** is a\
    \ command-line tool for controlling Network Manager and reporting network status.\n\
    \nTo view the host name using nmcli:\n\nThe syntax is:\n\n```\n# nmcli general\
    \ hostname\n```\n\nTo set the host name using nmcli:\n\nThe syntax is:\n\n```\n\
    # nmcli general hostname R2-D2\n# nmcli general hostname server42.cyberciti.biz\n\
    ```\n\nFinally, restart the systemd-hostnamed service:\n\n```\n# systemctl restart\
    \ systemd-hostnamed\n```\n\n## Chapter Six: LINUX AND UNIX MAN COMMAND\n\nOn Linux\
    \ and other Unix-like operating systems, *man* is the interface used to view the\
    \ system's reference manuals.\n\n### Syntax\n\n```\nman [-C file] [-d] [-D] [-warnings[=warnings]]\
    \ [-R encoding] [-L locale]\n   [-m system[,...]] [-M path] [-S list] [-e extension]\
    \ [-i|-I]\n   [-regex|-wildcard] [-names-only] [-a] [-u] [no-subpages] [-P pager]\n\
    \   [-r prompt] [-7] [-E encoding] [no-hyphenation] [no-justification]\n   [-p\
    \ string] [-t] [-T[device]] [-H[browser]] [-X[dpi]] [-Z]\n   [[section] page ...]\
    \ ...\nman -k [apropos options] regexp ...\nman -K [-w|-W] [-S list] [-i|-I] [-regex]\
    \ [section] term ...\nman -f [whatis options] page ...\nman -l [-C file] [-d]\
    \ [-D] [-warnings[=warnings]] [-R encoding]\n   [-L locale] [-P pager] [-r prompt]\
    \ [-7] [-E encoding] [-p string] [-t]\n   [-T[device]] [-H[browser]] [-X[dpi]]\
    \ [-Z] file ...\nman -w|-W [-C file] [-d] [-D] page ...\nman -c [-C file] [-d]\
    \ [-D] page ...\nman [-hV]\n```\n\n### Description\n\nMan is the system's manual\
    \ viewer; it can be used to display manual pages, scroll up and down, search for\
    \ occurrences of specific text, and other useful functions. Each argument given\
    \ to man is normally the name of a program, utility or function. The pages associated\
    \ with each of these arguments are then found and displayed. A section number,\
    \ if provided, will direct man to look only in that section of the manual. The\
    \ default action is to search in all of the available sections, following a pre-defined\
    \ order and to show only the first page found, even if pages exist in several\
    \ sections.\n\n### General Options\n\n| Option | Description |\n| :--- | :---\
    \ |\n| -h, --help | Print a help message and exit. |\n| -V, --version | Display\
    \ version information and exit. |\n| -C file, --config | Use configuration file\
    \ *file* rather than the |\n"
  mdcn: "\n\n![](img/95e14ba64977353b42ea3103515e63c3_38_0.png)\n\n## 步骤 4：选择语言和键盘\n\
    \n选择您首选的语言。\n\n![](img/95e14ba64977353b42ea3103515e63c3_38_1.png)\n\n## 步骤 5：更改安装位置\n\
    \n默认情况下，Anaconda 安装程序将自动对您的硬盘进行分区。点击“安装位置”图标以更改为自定义分区。\n\n![](img/95e14ba64977353b42ea3103515e63c3_38_2.png)\n\
    \n选择您要安装 CentOS 7 的硬盘，然后在“其他存储选项”中选择“我配置分区”（I will configure partitioning），然后点击完成。\n\
    \n![](img/95e14ba64977353b42ea3103515e63c3_39_0.png)\n\n## 步骤 6：选择分区方案\n\n接下来，选择用于挂载点的分区方案。在这种情况下，请选择标准分区（Standard\
    \ Partition）。\n\n![](img/95e14ba64977353b42ea3103515e63c3_39_1.png)\n\n## 步骤 7：创建交换空间\n\
    \n您可以在其中一个分区中创建交换空间并设置所需的容量，这取决于系统拥有的 RAM 数量。选择交换空间的文件系统为 *swap*，并选择 **重新格式化**（Reformat）选项。您也可以为交换空间命名任何您喜欢的名字，但像\
    \ *swap* 这样的名称更具描述性。\n\n![](img/95e14ba64977353b42ea3103515e63c3_40_0.png)\n\n\
    ## 步骤 8：创建挂载点\n\n下一步是创建根分区将安装到的挂载点。根据您的需求，您可能需要将引导、主目录和根分区放在不同的挂载点上。在此示例中，我们将只创建一个挂载点\
    \ `/`。\n\n接下来，将 **标签**（Label）和 **期望容量**（Desired Capacity）设置为您希望的值。经验法则是使用描述性的名称作为标签，特别是当计算机将由不同的系统管理员管理时。选择文件系统为\
    \ `ext4`，并选择重新格式化（Reformat）选项。\n\n![](img/95e14ba64977353b42ea3103515e63c3_40_1.png)\n\
    \n## 步骤 9：接受更改\n\n在步骤 7 和 8 成功完成后，点击 **完成**（Done）按钮。将显示一个提示窗口，其中包含即将发生的更改摘要。如果您对此满意，请单击\
    \ **接受更改**（Accept Changes）。\n\n![](img/95e14ba64977353b42ea3103515e63c3_41_0.png)\n\
    \n## 步骤 10：设置日期和时间\n\n点击本地化菜单下的时钟图标，从世界地图上选择您的时区，然后点击完成。\n\n![](img/95e14ba64977353b42ea3103515e63c3_41_1.png)\n\
    \n## 步骤 11：开始安装\n\n点击“开始安装”按钮。\n\n![](img/95e14ba64977353b42ea3103515e63c3_41_2.png)\n\
    \n安装将立即开始，随着进程推进，您需要设置用户账户以及 root 密码。\n\n![](img/95e14ba64977353b42ea3103515e63c3_42_0.png)\n\
    \n## 步骤 12：设置 Root 密码\n\n点击 **ROOT PASSWORD** 选项，输入密码并确认相同密码，然后点击完成。\n\n![](img/95e14ba64977353b42ea3103515e63c3_42_1.png)\n\
    \n## 步骤 13：创建用户账户\n\n下一步是创建用户账户。输入详细信息，如果这是一个管理员账户，请勾选“使该用户成为管理员”（Make this user\
    \ administrator）和“使用此账户需要密码”（Require a password to use this account），出于安全目的。\n\
    \n![](img/95e14ba64977353b42ea3103515e63c3_43_0.png)\n\n## 步骤 14：完成安装\n\n安装程序应该完成软件及引导加载器的安装。\n\
    \n![](img/95e14ba64977353b42ea3103515e63c3_43_1.png)\n\n希望安装完成后，您会得到一条成功消息，之后您可以点击“退出”（Quit）。现在退出实时系统并登录您的新安装。最后，一旦您登录到\
    \ CentOS 7，请接受 EULA 协议并享受吧！\n\n![](img/95e14ba64977353b42ea3103515e63c3_44_0.png)\n\
    \n## 更改和设置主机名命令\n\n在 CentOS Linux 7 服务器上，您可以使用以下任一工具来管理主机名：\n\n- hostnamectl：控制系统主机名。这是推荐的方法。\n\
    - nmtui：使用文本用户界面 (TUI) 控制系统主机名。\n- nmcli：使用 NetworkManager 的 CLI 部分控制系统主机名。\n\n\
    ### 方法 #1：hostnamectl\n\n让我们看看如何使用 hostnamectl 命令。\n\n要验证新设置，输入：\n\n```\n# hostnamectl\
    \ status\n```\n\n### 我如何查看主机名？\n\n示例输出：\n\n| 静态主机名 | server1.cyberciti.biz |\n\
    | :--- | :--- |\n| 美观主机名 | Senator Padmé Amidala's Laptop |\n| 临时主机名 | r2-d2 |\n\
    | 图标名称 | computer |\n| 机箱 | n/a |\n| 机器 ID | b5470b10ccfd49ed8e4a3b0e953a53c3\
    \ |\n| 启动 ID | f79de79e2dac4670bddffe528e826b61f |\n| 虚拟化 | oracle |\n| 操作系统 |\
    \ CentOS Linux 7 (Core) |\n| CPE 操作系统名称 | cpe:/o:centos:centos:7 |\n| 内核 | Linux\
    \ 3.10.0-229.1.2.el7.x86_64 |\n| 架构 | x86_64 |\n\n我如何删除特定的主机名？\n\n语法是：\n\n```\n\
    # hostnamectl set-hostname \"\"\n# hostnamectl set-hostname \"\" --static\n# hostnamectl\
    \ set-hostname \"\" --pretty\n```\n\n我如何远程更改主机名？\n\n使用以下任一语法：\n\n```\n# ssh root@server-ip-here\
    \ hostnamectl set-hostname server1\n或者使用 ssh 在名为 192.168.1.42 的远程主机上将 server1\
    \ 设置为主机名：\n# hostnamectl set-hostname server1 -H root@192.168.1.42\n```\n\n###\
    \ 方法 #2：nmtui\n\n您可以使用 **nmtui** 命令设置主机名，该命令为新手提供文本用户界面：\n\n```\n# nmtui\n```\n\
    \n![](img/95e14ba64977353b42ea3103515e63c3_45_0.png)\n\n示例输出：\n\n使用 **向下** 箭头键\
    \ > 选择“设置系统主机名”（Set system hostname）菜单选项 > 点击\n\n![](img/95e14ba64977353b42ea3103515e63c3_45_1.png)\n\
    \nOK 按钮：\n\n您将看到如下确认框：\n\n![](img/95e14ba64977353b42ea3103515e63c3_46_0.png)\n\
    \n最后，通过输入以下命令重启 hostnamed 服务：\n\n```\n# systemctl restart systemd-hostnamed\n\
    ```\n\n要验证更改，输入：\n\n```\n# hostnamectl status\n```\n\n### 方法 #3：nmcli\n\n**nmcli**\
    \ 是一个用于控制 Network Manager 并报告网络状态命令行工具。\n\n使用 nmcli 查看主机名：\n\n语法是：\n\n```\n# nmcli\
    \ general hostname\n```\n\n使用 nmcli 设置主机名：\n\n语法是：\n\n```\n# nmcli general hostname\
    \ R2-D2\n# nmcli general hostname server42.cyberciti.biz\n```\n\n最后，重启 systemd-hostnamed\
    \ 服务：\n\n```\n# systemctl restart systemd-hostnamed\n```\n\n## 第六章：LINUX 和 UNIX\
    \ MAN 命令\n\n在 Linux 和其他类 Unix 操作系统中，*man* 是用于查看系统参考手册的界面。\n\n### 语法\n\n```\nman\
    \ [-C file] [-d] [-D] [-warnings[=warnings]] [-R encoding] [-L locale]\n   [-m\
    \ system[,...]] [-M path] [-S list] [-e extension] [-i|-I]\n   [-regex|-wildcard]\
    \ [-names-only] [-a] [-u] [no-subpages] [-P pager]\n   [-r prompt] [-7] [-E encoding]\
    \ [no-hyphenation] [no-justification]\n   [-p string] [-t] [-T[device]] [-H[browser]]\
    \ [-X[dpi]] [-Z]\n   [[section] page ...] ...\nman -k [apropos options] regexp\
    \ ...\nman -K [-w|-W] [-S list] [-i|-I] [-regex] [section] term ...\nman -f [whatis\
    \ options] page ...\nman -l [-C file] [-d] [-D] [-warnings[=warnings]] [-R encoding]\n\
    \   [-L locale] [-P pager] [-r prompt] [-7] [-E encoding] [-p string] [-t]\n \
    \  [-T[device]] [-H[browser]] [-X[dpi]] [-Z] file ...\nman -w|-W [-C file] [-d]\
    \ [-D] page ...\nman -c [-C file] [-d] [-D] page ...\nman [-hV]\n```\n\n### 描述\n\
    \nMan 是系统的手册查看器；它可以用于显示手册页、向上和向下滚动、搜索特定文本的出现以及其他实用功能。提供给 man 的每个参数通常是程序、实用程序或函数的名称。然后查找并显示与这些参数中每一个关联的页面。如果提供了章节号，man\
    \ 将只在该手册章节中查找。默认操作是在所有可用章节中按预定义顺序进行搜索，并且只显示找到的第一个页面，即使页面存在于多个章节中。\n\n### 通用选项\n\
    \n| 选项 | 描述 |\n| :--- | :--- |\n| -h, --help | 打印帮助消息并退出。 |\n| -V, --version |\
    \ 显示版本信息并退出。 |\n| -C file, --config | 使用配置文件 *file* 而不是默认的 |\n\n"
