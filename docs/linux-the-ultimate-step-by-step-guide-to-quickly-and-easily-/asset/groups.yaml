    \n有时，你希望操纵一组文件，例如删除所有文件，而不必对每个文件单独执行命令。例如，假设我们要删除目录中所有的 .c 文件。通配符是一种模式，用于匹配其他内容。两个常用的\
    \ *nix 通配符是 *（星号）和 ?（问号）。\n\n- 星号 (*) 表示零个或多个字符\n- 问号 (?) 表示正好一个字符\n- 方括号 ([ ])\
    \ 表示一组字符\n\n涉及使用通配符指定文件名的命令将由 shell 展开（这被称为 globbing，源自于以前用于在 shell 外部执行此操作的程序\
    \ glob 的名称）。\n\n### ‘\\*’\n\n‘file\\*’ 将匹配任何以字符 “file” 开头，随后跟随零个或多个任意字符的文件名。\n\
    \n### 示例\n\n假设 **Fred’s** 主目录包含以下文件，\n\n- file01.cpp\n- file02.cpp\n- file03.cpp\n\
    - file1.cpp\n- file01.o\n- file02.o\n- file03.o\n- file1.o\n\n要删除所有的 **.c** 文件，请输入，\n\
    \n```\n$ rm *.c\n```\n\n要删除 file01.cpp 和 file01.o，\n\n```\n$ rm file01.*\n```\n\
    \n### The ‘? ’\n\n‘?’ 代表单个字符。\n\n### 示例\n\n再次考虑前一个示例中 Fred 的主目录。\n\n删除 file01.o,\
    \ file02.o 和 file03.o，但不删除 file1.o，\n\n```\n$ rm file??o\n```\n\n删除 file01.o，但不删除\
    \ file01.cpp，\n\n```\n$ rm file01.?\n```\n\n### The ‘[ ]’ 通配\n\n可以使用方括号 [ ] 指定一组字符。‘[ab]’\
    \ 意味着 **单个** 字符可以是 ‘a’ **或者** ‘b’。也可以指定范围（例如：‘[1–57–9]’ 代表 1–5 或者 7–9）。\n\n###\
    \ 示例\n\n从 Fred 的目录中删除 file02.cpp 和 file03.cpp，\n\n```\n$ rm file0[23].cpp\n```\n\
    \n这将删除任何以 f 或 F 开头的文件（请记住 linux 是区分大小写的），\n\n```\n$rm [fF]*\n```\n\n要删除所有以字符串\
    \ “file” 开头，后跟单个字母的文件，请输入，\n\n```\n$ rm file[a-zA-Z]\n```\n\n最后一个例子中的 a-z 和 A-Z\
    \ 代表小写 a-z 或大写 A-Z 范围内的所有字母。\n\n通配符匹配还有很多内容，但这足以让你入门。\n\n*更多示例*\n\n删除所有恰好为 1 个字符的文件，\n\
    \n```\n$rm ?\n```\n\n假设你有一个名为 ‘9-15-2007-Backup-Really-Long-Name-blah...’ 的目录。与其输入整个名称，你只需输入字符串的子集，并将其与\
    \ cd 命令一起使用。\n\n```\n$ cd 9-15-2007*\n```\n\n如果你有多个以 9-15-2007 开头的文件夹，你的目录将更改为按字母顺序排列的第一个。\n\
    \n你可以对大多数接受文件作为参数的命令使用文件名通配。\n\n## 第十四章：UNIX - SHELL 输入/输出重定向\n\n时间很宝贵。在命令提示符下浪费时间输入经常使用的命令序列是没有意义的，特别是如果它们异常长或复杂时。脚本是一种通过自动化这些命令序列来缓解此问题的方法，从而让在\
    \ shell 中的生活更容易且更具生产力。脚本的核心在于让计算机，即工具，去工作。通过本教程，你将充分了解 Unix 上可用的脚本语言类型以及如何将它们应用于你的问题。UNIX\
    \ 包含许多奇妙且奇怪的命令，在脚本世界中非常有用，你知道的工具越多，对它们越熟悉，你会发现它们的用途越多。大多数 Unix 命令和许多内置命令都有 man\
    \ 页；man 页包含与其父工具相关的使用说明。它们并不总是非常清晰，可能需要阅读几次。要在 Unix 中访问 man 页，应用以下命令序列\n\n## 第十五章：UNIX\
    \ SHELL 函数\n\n函数使你能够将脚本的整体功能分解为较小的逻辑子部分，然后在需要时调用它们执行各自的任务。使用函数执行重复任务是创建代码重用的绝佳方式。代码重用是现代面向对象编程原则的重要组成部分。Shell\
    \ 函数类似于其他编程语言中的子程序、过程和函数。\n\n### 创建函数\n\n要声明一个函数，只需使用以下语法 –\n\n```\nfunction_name()\
    \ {\n   list of commands\n}\n```\n\n你的函数名为 function_name，这就是你将在脚本的其他地方调用它时使用的内容。函数名后必须跟随括号，括号内是花括号包围的命令列表。\n\
    \n### 示例\n\n使用函数的示例 –\n\n```\n#!/bin/sh\n\n# 在此处定义你的函数\nHello() {\n   echo “Hello\
    \ World”\n}\n\n# 调用你的函数\nHello\n```\n\n**输出**\n\n```\n$ ./test.sh\nHello World\n\
    $\n```\n\n### 向函数传递参数\n\n你可以定义一个函数，该函数在调用时接受参数。这些参数将表示为 $1, $2 等等。下面是一个示例，我们传递两个参数\
    \ *Zara* 和 *Ali*，然后在函数中捕获并打印这些参数。\n\n```\n#!/bin/sh\n\n# 在此处定义你的函数\nHello ( )\
    \ {\n  echo \"Hello World $1 $2\"\n}\n\n# 调用你的函数\nHello Zara Ali\n```\n\n输出\n\n\
    ```\n$ ./test.sh\nHello World Zara Ali\n$ \n```\n\n### 从函数返回值\n\n如果你在函数内部执行 exit\
    \ 命令，其效果不仅是终止函数的执行，还会终止调用该函数的 shell 程序。如果你只是想终止函数的执行，那么有一种方法可以从定义的函数中退出。根据情况，你可以使用\
    \ return 命令从函数返回任何值，其语法如下 –\n\n```\nreturn code\n```\n\n这里 code 可以是任何你选择的内容，但显然你应该选择在脚本整体上下文中具有意义或有用的内容。\n\
    \n示例\n\n以下函数返回值 1 –\n\n```\n#!/bin/sh\n\n# 在此处定义你的函数\nHello ( ) {\n  echo \"Hello\
    \ World $1 $2\"\n  return 10\n}\n\n# 调用你的函数\nHello Zara Ali\n\n# 捕获最后一个命令返回的值\n\
    ret=$?\necho \"Return value is $ret\"\n```\n\n输出\n\n```\n$ ./test.sh\nHello World\
    \ Zara Ali\nReturn value is 10\n$\n```\n\n### 嵌套函数\n\n函数最有趣的功能之一是，它们可以调用自身，也可以调用其他函数。调用自身的函数被称为\
    \ *递归函数*。\n\n以下示例演示了两个函数的嵌套 –\n\n```\n#!/bin/sh\n\n# 从一个函数调用另一个函数\nnumber_one\
    \ () {\n\techo \"This is the first function speaking...\"\n\tnumber_two\n}\n\n\
    number_two () {\n\techo \"This is now the second function speaking...\"\n}\n\n\
    # 调用函数 one。\nnumber_one\n```\n\n输出\n\n```\nThis is the first function speaking...\n\
    This is now the second function speaking...\n```\n\n### 从提示符调用函数\n\n你可以将常用函数的定义放在\
    \ .profile 中，以便它们在你登录时始终可用。或者，你可以将定义分组到一个文件中，例如 test.sh，然后通过在当前的 shell 中执行该文件来使它们生效\
    \ –\n\n```\n$ . test.sh\n```\n\n这会使 test.sh 中定义的任何函数被读取并定义到当前 shell 中，如下所示 –\n\
    \n```\n$ number_one\n```\n\n"
