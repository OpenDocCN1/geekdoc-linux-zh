    | -l | 仅打印包含匹配行的文件名（字母“l”） |

    | -c | 仅打印匹配行的计数。 |

    | -i | 匹配大写或小写字母。 |


    接下来，让我们使用一个正则表达式，告诉 `grep` 查找包含“carol”，后面跟着零个或多个其他字符（在正则表达式中缩写为“.*”），然后跟着“Aug”的行。这里我们使用
    -i 选项来进行不区分大小写的搜索 –


    $ ls -l | grep -i “carol.*aug”

