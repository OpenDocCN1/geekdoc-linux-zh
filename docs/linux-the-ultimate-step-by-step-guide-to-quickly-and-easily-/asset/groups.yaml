    # ## The Substition Command


    The substitution command, denoted by s, will substitute any string that you specify
    with any other string that you specify. To substitute one string with another,
    you need to have a way of telling sed where your first string ends and the substitution
    string begins. This is traditionally done by bookending the two strings with the
    forward slash (/) character. The following command substitutes the first occurrence
    on a line of the string root with the string amrood.


    ```

    $ cat /etc/passwd | sed ''s/root/amrood/''

    amrood:x:0:0:root user:/root:/bin/sh

    daemon:x:1:1:daemon:/usr/sbin:/bin/sh


    ```


    It is very important to note that sed substitutes only the first occurrence on
    a line. If the string root occurs more than once on a line, only the first match
    will be replaced. To tell sed to do a global substitution, add the letter g to
    the end of the command as follows –


    ```

    $ cat /etc/passwd | sed ''s/root/amrood/g''

    amrood:x:0:0:amrood user:/amrood:/bin/sh

    daemon:x:1:1:daemon:/usr/sbin:/bin/sh

    bin:x:2:2:bin:/bin:/bin/sh

    sys:x:3:3:sys:/dev:/bin/sh

    ```


    # ## Substitution Flags


    | Flag | Description |

    |:---|:---|

    | g | Replace all matches, not just the first match. |

    | NUMBER | Replace only NUMBERth match. |

    | p | If substitution was made, print pattern space. |

    | w FILENAME | If substitution was made, write result to FILENAME. |

    | | |


    There are a number of other useful flags that can be passed in addition to the
    g flag, and you can specify more than one at a time.


    # ### Using an Alternative String Separator


    You may find yourself having to do a substitution on a string that includes the
    forward slash character. In this case, you can specify a different separator by
    providing the designated character after'
