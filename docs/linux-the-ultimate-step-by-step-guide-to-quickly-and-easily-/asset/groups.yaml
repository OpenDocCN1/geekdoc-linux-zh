    # Chapter Ten: UNIX SHELL SCRIPTING


    Time is precious. It does not make sense to waste time typing a frequently used
    sequence of commands at a command prompt, more especially if they are abnormally
    long or complex. Scripting is a way by which one can alleviate this problem by
    automating these command sequences in order to make life at the shell easier and
    more productive. Scripting is all about making the computer, the tool, do the
    work. By the end of this tutorial you will have a good understanding of the kind
    of scripting languages available for Unix and how to apply them to your problems.
    UNIX contains many wonderful and strange commands that can be very useful in the
    world of scripting, the more tools you know the better you know them, the more
    use you will find for them. Most of the Unix commands and many of the built-in
    commands have `man` pages; `man` pages contain the usage instructions pertaining
    to the parent tool. They are not always very clear and may require reading several
    times. In order to access a man page in Unix the following command sequence is
    applied:


    ```

    `man command`

    ```


    If a man page exists for the command specified the internal viewer will be invoked
    and you will be able to read about the various options and usage instructions.


    # Shell Scripting Introduction


    UNIX uses shells to accept commands given by the user; there are quite a few different
    shells available. The most commonly used shells are SH (Bourne SHell) CSH (C SHell)
    and KSH (Korn SHell), most of the other shells you encounter will be variants
    of these shells and will share the same syntax, KSH is based on SH as is BASH
    (Bourne again shell). TCSH (Extended C SHell) is based on CSH.


    The various shells all have built in functions which allow for the creation of
    shell scripts, that is, the stringing together of shell commands and constructs
    to automate repetitive tasks in order to make life easier for the user.


    With all these different shells available, what shell should we use? This is debatable.
    For the purpose of this tutorial we will be using SH because it is practically
    guaranteed to be available on most Unix systems and be supported by the SH based
    shells. Your default shell may not be SH. Fortunately we do not have to be using
    a specific shell in order to exploit its features because we can specify'
  - '[PAGE 85]


    the shell we want to interpret our shell script within the script itself by including
    the following in the first line.


    ```

    #!/path/to/shell

    ```


    Usually anything following (#) is interpreted as a comment and ignored but if
    it occurs on the first line with a (!) following it is treated as being special
    and the filename following the (!) is considered to point to the location of the
    shell that should interpret the script.


    When a script is "executed", it is being interpreted by an invocation of the shell
    that is running it. Hence, the shell is said to be running non-interactively,
    when the shell is used "normally" it is said to be running interactively.


    Note: There are many variations of the basic commands and extra information which
    is too specific to be mentioned in this short tutorial, you should read the man
    page for your shell to get a more comprehensive idea of the options available
    to you. This tutorial will concentrate on highlighting the most often used and
    useful commands and constructs.


    # ## Command Redirection and Pipelines


    By default a normal command accepts input from standard input, which we abbreviate
    to stdin, standard input is the command line in the form of arguments passed to
    the command. By default a normal command directs its output to standard output,
    which we abbreviate to stdout, standard output is usually the console display.
    For some commands this may be the desired action but other times we may wish to
    get our input for a command from somewhere other than stdin and direct our output
    to somewhere other than stdout. This is done by redirection:


    We use > to redirect stdout to a file, for instance, if we wanted to redirect
    a directory listing generated by the ls we could do the following:


    ```

    ls > file

    ```


    We use < to specify that we want the command immediately before the redirection
    symbol to get its input from the source specified immediately after the symbol,
    for instance, we could redirect the input to grep (which searches for strings
    within files) so that it comes from a file like this:'
  - '[PAGE 86]


    ```

    ```cpp

    grep searchterm < file

    ```

    ```


    We use `>>` to append stdout to a file, for example, if we wanted to append the
    date to the end of a file we would redirect the output from `date` like so:


    ```

    ```cpp

    date >> file

    ```

    ```


    One can redirect standard error (stderr) to a file by using **2>**, if we wanted
    to redirect the standard error from commandA to a file we would use:


    ```

    ```cpp

    commandA 2>

    ```

    ```


    Pipes are another form of redirection that are used to chain commands so that
    powerful composite commands can be constructed, the pipe symbol `|` takes the
    stdout from the command preceding it and redirects it to the command following
    it:


    ```

    ```cpp

    ls -l | grep searchword | sort -r

    ```

    ```


    The example above firsts requests a long (`-l` directory listing of the current
    directory using the `ls` command, the output from this is then piped to `grep`
    which filters out all the listings containing the searchword and then finally
    pipes this through to `sort` which then sorts the output in reverse (`-r`, sort
    then passes the output on normally to stdout.


    # Variables


    When a script starts, all environment variables are turned into shell variables.
    New variables can be instantiated like this:


    ```

    ```cpp

    name=value

    ```

    ```


    You must do it exactly like that, with no spaces, the name must only be made up
    of alphabetic characters, numeric characters and underscores; it cannot begin
    with a numeric character. You should avoid using keywords like `for` or anything
    like that, the interpreter will let you use them but doing so can lead to obfuscated
    code ;)


    Variables are referenced like this: `$name`, here is an example:


    ```

    ```bash

    #!/bin/sh

    msg1=Hello

    msg2=There!

    echo $msg1 $msg2

    ```

    ```'
