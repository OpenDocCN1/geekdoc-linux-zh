    ## Unix - 管道和过滤器


    你可以将两个命令连接起来，使一个程序的输出成为下一个程序的输入。以这种方式连接的两个或多个命令构成一个*管道*。要创建一个管道，需要在命令行中在两个命令之间放入一个竖线
    (|)。当一个程序从另一个程序获取输入，对该输入执行某些操作，并将结果写入标准输出时，该程序被称为*过滤器*。


    ## grep 命令


    `grep` 程序在文件或一组文件中搜索具有特定模式的行。语法如下 –


    $ grep pattern file(s)


    “grep” 这个名称源自 `ed`（一个 UNIX 行编辑器）命令 `g/re/p`，其意思是“全局搜索正则表达式并打印包含它的所有行”。正则表达式可以是纯文本（例如一个单词）和/或用于模式匹配的特殊字符。`grep`
    最简单的用法是查找由单个单词组成的模式。它可以用于管道中，以便仅将输入文件中含有给定字符串的行发送到标准输出。如果你没有给 `grep` 提供一个要读取的文件名，它将读取其标准输入；这就是所有过滤器程序的工作方式
    –


    $ ls -l | grep "Aug"

