    # **software selection**


    At the moment, only the core of the system is installed. To tune the system to
    your needs, you can **choose** to install one or more of the following predefined
    collections of software.


    **Choose software to install:**


    +   - ☑ Debian desktop environment

    +       - ☐ GNOME

    +       - ☑ K\*DE

    +       - ☐ Cinnamon

    +       - ☐ MATE

    +       - ☐ LXDE

    +   - ☑ web server

    +   - ☑ print server

    +   - ☐ SSH server

    +   - ☑ standard system utilities


    ![](img/95e14ba64977353b42ea3103515e63c3_29_0.png)


    # Install the GRUB boot loader on a hard disk


    You need to make the newly installed system boot-able, by installing the GRUB
    boot loader on a bootable device. The usual way to do this, is to install GRUB
    on the master boot record of your first hard drive. If you prefer, you can install
    GRUB elsewhere on the drive, or to another drive, or even to a floppy.


    **Device for boot loader installation:**


    +   - **Enter device manually:**

    +   - ☑ /dev/sda

    +   - ☐ MBR of /dev/sda


