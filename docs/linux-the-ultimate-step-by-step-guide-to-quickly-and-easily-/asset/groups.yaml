    # Mageia


    Mageia may be the newest distribution on this list, but its roots go back to July
    1998 when Gaël Duval launched Mandrake Linux. At the time, it was just a branch
    of Red Hat Linux with KDE as the default desktop, better hardware detection, and
    some user-friendly features, but it gained instant popularity due to positive
    reviews in the media. Mandrake was later turned into a commercial enterprise and
    renamed to Mandriva (to avoid some trademark-related hassles and to celebrate
    its merger with Brazil’s Conectiva) before almost going bankrupt in 2010. A Russian
    venture capital firm eventually saved it, but this came at a cost when the new
    management decided to lay off most of the established Mandriva developers in the
    company’s Paris headquarters. Upon finding themselves out of work, they decided
    to form Mageia, a community project that is a logical continuation of Mandrake
    and Mandriva, perhaps more so than Mandriva itself. Mageia is primarily a desktop
    distribution. Its best-loved features are cutting-edge software, a superb system
    administration suite (Mageia Control Centre), the ability to attract a large number
    of volunteer contributors, and extensive internationalization support. It features
    one of the easiest, but more powerful system installers on its installation DVD,
    while it also releases a set of live images with both KDE or GNOME desktops and
    comprehensive language support, with the ability to install it onto a hard disk
    directly from the live desktop session. The distribution’s well-established package
    management features, with powerful command-line options and a graphical software
    management module, allow easy access to thousands of software packages. The unique
    Mageia Control Center continues to improve with each release, offering a powerful
    tool for configuring just about any aspect of their computer without ever reaching
    for the terminal.


    Pros: Beginner-friendly; excellent central configuration utility; very good out-of-the-box
    support for dozens of languages; installable live media.


    Cons: Lacks reputation and mindshare following its split from Mandriva, some concern
    over the developers’ ability to maintain the distribution long-term on a volunteer
    basis.


