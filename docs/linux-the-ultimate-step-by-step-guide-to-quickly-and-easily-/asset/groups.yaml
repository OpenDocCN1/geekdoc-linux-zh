    | **MANOPT** | 如果设置了 **$MANOPT**，它将在 **mans** 命令行之前被解析，并且预期具有类似的格式。由于其他所有特定的 man
    环境变量都可以表示为命令行选项，因此它们都是包含在 **$MANOPT** 中的候选项，预计它们将逐渐被淘汰。注意：所有应解释为选项参数的一部分的空格都必须进行转义（前面加一个反斜杠）。
    |

    | **MANWIDTH** | 如果设置了 **$MANWIDTH**，其值将用作手册页应进行格式化的行长度。如果未设置，手册页将按适合当前终端的行长度进行格式化（如果可用则使用
    **ioctl**，使用 **$COLUMNS** 的值，或者如果两者都不可用则回退到 80 个字符）。**cat** 页面仅当可以使用默认格式化时才会保存，即当终端行长度在
    66 到 80 个字符之间时。 |

    | **MAN_KEEP_FORMATTING** | 通常，当输出不重定向到终端（例如重定向到文件或管道）时，格式化字符会被丢弃，以便在没有特殊工具的情况下更容易阅读结果。但是，如果将
    **$MAN_KEEP_FORMATTING** 设置为任何非空值，这些格式化字符将被保留。这对于能够解释格式化字符的 **man** 包装器可能很有用。
