    ## 删除账户


    可以使用 `userdel` 命令删除现有用户。如果不小心使用，这是一个非常危险的命令。该命令只有一个可用的参数或选项：`-r`，用于删除账户的主目录和邮件文件。例如，若要删除账户
    `mcmohd20`，你需要发出以下命令：


    ```

    $ userdel -r mcmohd20

    ```


    如果你希望保留主目录以备备份目的，请省略 `-r` 选项。你可以在稍后根据需要删除主目录。


    # 第二十章：系统性能


    本教程的目的是向性能分析师介绍一些用于监控和管理 UNIX 系统性能的免费工具，并提供在 Unix 环境中诊断和解决性能问题的指南。UNIX 具有以下需要监控和调整的主要资源类型：


    - CPU

    - 内存

    - 磁盘空间

    - 通信线路

    - I/O 时间

    - 网络时间

    - 应用程序


    ## 性能组件


    系统总时间主要分配在五个主要组件中：


    | 组件 | 描述 |

    |---|---|

    | **用户态 CPU** | CPU 在用户态下运行用户程序的实际时间。包括执行库调用花费的时间，但不包括代表用户在内核中花费的时间。 |

    | **系统态 CPU** | CPU 在系统态下代表该程序花费的时间。所有 I/O 例程都需要内核服务。程序员可以通过使用阻塞进行 I/O 传输来影响此值。
    |

    | **I/O 时间和网络时间** | 移动数据和处理 I/O 请求所花费的时间。 |

    | **虚拟内存性能** | 包括上下文切换和换页。 |

    | **应用程序** | 运行其他程序所花费的时间——当系统未服务此应用程序，因为另一个应用程序当前拥有 CPU 时。 |


    | 命令 | 描述 |

    |---|---|

    | **nice/renice** | 以修改后的调度优先级运行程序 |

    | **netstat** | 打印网络连接、路由表、接口统计、伪装连接和组播成员关系 |

    | **time** | 计时简单命令或提供资源使用情况 |

    | **uptime** | 系统平均负载 |

    | **ps** | 报告当前进程的快照。 |

    | **vmstat** | 报告虚拟内存统计信息 |

    | **gprof** | 显示调用图分析数据 |

    | **prof** | 进程分析 |

    | **top** | 显示系统任务 |


    ## 性能工具


    Unix 提供了以下重要工具来测量和微调 Unix 系统性能：


    ## Unix - 系统日志


    UNIX 系统拥有非常灵活且强大的日志记录系统，它允许你记录几乎任何内容，然后操作日志以检索所需的信息。许多版本的 UNIX 提供了一种称为 syslog
    的通用日志记录设施。需要记录信息的各个程序将信息发送到 syslog。


    Unix syslog 是一个主机可配置的、统一的系统日志记录设施。系统使用一个集中式系统日志记录进程来运行程序 /etc/syslogd 或 /etc/syslog。


    系统日志记录器的操作相当简单。程序将它们日志条目发送到 syslogd，syslogd 会查阅配置文件 /etc/syslogd.conf 或 /etc/syslog，当找到匹配项时，将日志消息写入所需的日志文件。


    你应该理解以下四个基本的 syslog 术语：


    | 术语 | 描述 |

    |---|---|

    | **Facility (设施)** | 用于描述提交日志消息的应用程序或进程的标识符。示例包括 mail、kernel 和 ftp。 |

    | **Priority (优先级)** | 消息重要性的指示器。在 syslog 中定义了级别作为指导，从调试信息到关键事件。 |

    | **Selector (选择器)** | 一个或多个设施和级别的组合。当传入事件匹配选择器时，将执行某个操作。 |

    | **Action (操作)** | 匹配选择器的传入消息如何处理。操作可以是将消息写入日志文件、将消息回显到控制台或其他设备、将消息写入已登录用户，或将消息转发到另一个
    syslog 服务器。 |


    ## Syslog 设施


    以下是选择器的可用设施。并非所有版本的 UNIX 都包含所有设施。


    | 设施 | 描述 |

    | :--- | :--- |

    | **auth** | 与请求名称和密码相关的活动 (getty, su, login)。 |

    | **authpriv** | 与 auth 相同，但记录到只有特定用户可以读取的文件中。 |

    | **console** | 用于捕获通常指向系统控制台的消息。 |

    | **cron** | 来自 cron 系统调度器的消息。 |

    | **daemon** | 系统守护程序捕获所有。 |

    | **ftp** | 与 ftp 守护程序相关的消息。 |

    | **kern** | 内核消息。 |

    | **local0.local7** | 按站点定义的本地设施。 |

    | **lpr** | 来自行打印系统的消息。 |

    | **mail** | 与邮件系统相关的消息。 |

    | **mark** | 用于生成时间戳的伪事件。 |

    | **news** | 与网络新闻协议 (nntp) 相关的消息。 |

    | **ntp** | 与网络时间协议相关的消息。 |


    设施和级别的组合使你能够审慎地选择记录什么内容以及这些信息去向。每当程序忠实地将其消息发送到系统日志记录器时，日志记录器根据选择器中定义的级别来决定记录什么和丢弃什么。当你指定一个级别时，系统将跟踪该级别及更高的一切内容。


    ## /etc/syslog.conf 文件


    /etc/syslog.conf 文件控制消息记录到哪里。典型的 syslog.conf 文件可能如下所示：


    *日志文件。* `*.err; /kern.debug; /auth.notice /dev/console`

    `news` 与网络新闻协议 (nntp) 相关的消息。 `daemon, auth.notice /var/log/messages lpr.info /var/log/lpr.log
    mail.* /var/log/mail.log ftp.* /var/log/ftp.log auth.* @prep.ai.mit.edu`

    `ntp` 与网络时间协议相关的消息。 `auth.* root, amrood netinfo.err /var/log/netinfo.log install.*
    /var/log/install.log *.emerg *.alert |program_name mark.* /dev/console`


    ### Syslog 优先级


    | 优先级 | 描述 |

    | :--- | :--- |

    | **emerg** | 紧急状况，例如即将发生的系统崩溃，通常广播给所有用户。 |

    | **alert** | 应立即纠正的状况，例如损坏的系统数据库。 |

    | **crit** | 关键状况，例如硬件错误。 |

    | **err** | 普通错误。 |

    | **warning** | 警告。 |

    | **notice** | 非错误状况，但可能需要特殊处理。 |

    | **info** | 信息性消息。 |

    | **debug** | 用于调试程序的消息。 |

    | **none** | 指定不记录消息的伪级别。 |


    上述配置的要点如下：


    - 消息选择器，指定要记录哪类消息。例如，所有错误消息或来自内核的所有调试消息。

    - 操作字段，说明应该对消息执行什么操作。例如，将其放入文件或发送消息到用户的终端。

    - 消息选择器有两部分：一个设施和一个优先级。例如，**kern.debug** 选择由内核（设施）生成的所有调试消息（优先级）。

    - 消息选择器 **kern.debug** 选择所有大于 **debug** 的优先级。

    - 设施或优先级处的星号表示“所有”。例如，*.debug 表示所有调试消息，而 kern.* 表示内核生成的所有消息。

    - 你还可以使用逗号指定多个设施。可以使用分号将两个或更多选择器组合在一起。


    ## 日志记录操作


    操作字段指定以下五种操作之一：


    - 将消息记录到文件或设备。例如，/var/log/lpr.log 或 /dev/console。

    - 将消息发送给用户。可以通过用逗号分隔来指定多个用户名（例如，root, amrhood）。

    - 将消息发送给所有用户。在这种情况下，操作字段由星号组成（例如，*）。

    - 将消息通过管道传输到程序。在这种情况下，程序在 UNIX 管道符号 (|) 之后指定。

    - 将消息发送到另一主机的 syslog。在这种情况下，操作字段由主机名组成，前面加 @ 符号（例如，@tutorialspoint.com）


    ## logger 命令


    UNIX 提供了 `logger` 命令，这对系统日志记录非常有用。`logger` 命令将日志消息发送到 syslogd 守护程序，从而触发系统日志记录。这意味着我们可以随时使用
    `syslogd` 守护程序及其配置从命令行进行检查。`logger` 命令提供了一种从命令行向系统日志文件添加单行条目的方法。


    命令的格式为：


    ```

    logger [-i] [-f file] [-p priority] [-t tag] [message]...

    ```


    以下是参数的详细信息：


    | 选项 | 描述 |

    |:--------|:---------------|

    | `-f filename` | 使用文件 filename 的内容作为要记录的日志消息。 |

    | `-i` | 在每条日志中记录 logger 进程的处理 ID |


