    over 95 percent of the kernel''s code written in that language. However, other
    languages make up the kernel as well, making it more heterogeneous than other
    operating systems. The kernel community has evolved its own distinct way of operating
    which allows it to function smoothly (and produce a high-quality product) in an
    environment where thousands of lines of code are being changed every day. This
    means the Linux kernel development process differs greatly from proprietary development
    methods.


    The kernel''s development process may come across as strange and intimidating
    to new developers, but there are good reasons and solid experience behind it.
