    \ 编号 0 和 1 未被使用。通过指定 `ls` 命令的 `-i` 选项可以看到文件的 inode 编号。\n- 它是自包含的。一个文件系统和任何其他文件系统之间没有依赖关系。\n\
    \n目录有特定的用途，并且通常保存相同类型的信息，以便于定位文件。以下是主要 Unix 版本上存在的目录：\n\n| 目录 | 描述 |\n| :--- |\
    \ :--- |\n| / | 这是根目录，应该只包含文件系统顶层所需的目录。 |\n| /bin | 这是可执行文件所在的位置。它们对所有用户可用。 |\n\
    | /dev | 这些是设备驱动程序。 |\n| /etc | 用于监督目录命令、配置文件、磁盘配置文件、有效用户列表、组、以太网、主机以及关键消息发送目标的目录。\
    \ |\n| /lib | 包含共享库文件，有时还包含其他内核相关文件。 |\n| /boot | 包含用于启动系统的文件。 |\n| /home | 包含用户和其他账户的主目录。\
    \ |\n| /mnt | 用于挂载其他临时文件系统，例如 CD-ROM 驱动器和软盘驱动器分别使用的 cdrom 和软盘。 |\n| /proc | 包含所有被标记为文件的进程，按进程编号或动态系统信息区分。\
    \ |\n| /tmp | 保存系统启动之间使用的临时文件。 |\n| /usr | 用于杂项目的，可被许多用户访问。包括管理命令、共享文件、库文件等。 |\n\
    | /var | 通常包含可变长度文件，如日志和打印文件，以及其他可能包含可变数据量的文件类型。 |\n| /sbin | 包含二进制（可执行）文件，通常用于系统管理。例如\
    \ `fdisk` 和 `ifconfig` 实用工具。 |\n| /kernel | 包含内核文件。 |\n\n## 导航文件系统\n\n现在你了解了文件系统的基础知识，你可以开始导航到所需的文件。以下是你用来导航系统的命令：\n\
    \n| 命令 | 描述 |\n| :--- | :--- |\n| `cat filename` | 显示文件名。 |\n| `cd dirname` |\
    \ 移动到指定的目录。 |\n| `cp file1 file2` | 将一个文件/目录复制到指定位置。 |\n| `file filename` | 识别文件类型（二进制、文本等）。\
    \ |\n| `find filename dir` | 查找文件/目录。 |\n| `head filename` | 显示文件的开头部分。 |\n| `less\
    \ filename` | 从文件末尾或开头浏览文件。 |\n| `ls dirname` | 显示指定目录的内容。 |\n| `mkdir dirname`\
    \ | 创建指定目录。 |\n| `more filename` | 从文件开头到末尾浏览文件。 |\n| `mv file1 file2` | 移动文件/目录的位置或重命名文件/目录。\
    \ |\n| `pwd` | 显示用户当前所在的目录。 |\n| `rm filename` | 删除文件。 |\n| `rmdir dirname` |\
    \ 删除目录。 |\n| `tail filename` | 显示文件的结尾部分。 |\n| `touch filename` | 创建一个空白文件或修改现有文件的属性。\
    \ |\n| `whereis filename` | 显示文件的位置。 |\n| `which filename` | 如果文件在你的 PATH 中，则显示文件的位置。\
    \ |\n\n你可以使用 **管理帮助** 来检查这些命令的完整语法。\n\n## df 命令\n\n管理分区空间的第一种方式是使用 *df*（磁盘空闲）命令。命令\
    \ `df -k`（磁盘空闲）以千字节显示磁盘空间使用情况，如下所示：\n\n```bash\n$ df -k\nFilesystem 1K-blocks\
    \ Used Available Use% Mounted on\n/dev/vzfs 10485760 7836644 2649116 75% /\n/devices\
    \ 0 0 0 0% /devices\n$\n```\n\n某些目录，如 `/devices`，在千字节、已用和可用列中显示 0，容量百分比也为 0%。这些是特殊的（或虚拟的）文件系统，虽然它们位于\
    \ `/` 下的磁盘上，但它们本身不占用磁盘空间。\n\n`df -k` 的输出在所有 Unix 系统上通常都是相同的。它通常包含以下内容：\n\n| 列\
    \ | 描述 |\n| :--- | :--- |\n| **Filesystem** | 物理文件系统名称。 |\n| **Kbytes** | 存储介质上可用的总千字节数。\
    \ |\n| **Used** | 文件使用的总千字节数。 |\n| **Avail** | 可用的总千字节数。 |\n| **Capacity** | 文件使用的总空间百分比。\
    \ |\n| **Mounted on** | 文件系统挂载的位置。 |\n\n你可以使用 `-h`（人类可读）选项，以更易理解的符号显示大小。\n\n##\
    \ du 命令\n\n`du`（磁盘使用情况）命令允许你指定目录以显示特定目录的磁盘空间使用情况。如果你想确定特定目录使用了多少空间，这个命令非常有用。以下命令将显示每个目录使用的块数。根据系统不同，一个单块可能占用\
    \ 512 字节或 1 千字节。\n\n```bash\n$ du /etc\n10\t/etc/cron.d\n126\t/etc/default\n6\t\
    /etc/dfs\n...\n$\n```\n\n`-h` 选项使输出更容易理解：\n\n```bash\n$ du -h /etc\n5k\t/etc/cron.d\n\
    63k\t/etc/default\n3k\t/etc/dfs\n...\n$\n```\n\n## 挂载文件系统\n\n文件系统必须被挂载才能被系统使用。要查看系统中当前挂载（可用）的内容，请使用此命令：\n\
    \n```bash\n$ mount\n/dev/vzfs on / type reiserfs (rw,usrquota,grpquota)\nproc\
    \ on /proc type proc (rw,nodiratime)\ndevpts on /dev/pts type devpts (rw)\n$\n\
    ```\n\n"
