    - `-T[device], --troff-device[=device]`：此选项用于更改 groff（或可能是 troff）的输出，使其适合除默认以外的设备。它隐含
    `-t`。示例包括 dvi、latin1、ps、utf8 以及 X75 和 X100。

    - `-H[browser], --html[=browser]`：此选项将使 groff 产生 HTML 输出，并在 Web 浏览器中显示该输出。浏览器的选择由可选的
    browser 参数（如果提供）、SBROWSER 环境变量或编译时默认值（如果未设置，通常为 lynx）决定。此选项隐含 `-t`，并且仅适用于 GNU
