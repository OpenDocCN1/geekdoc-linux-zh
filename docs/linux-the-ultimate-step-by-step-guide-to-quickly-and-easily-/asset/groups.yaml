    \ Shell functions are similar to subroutines, procedures, and functions in other\
    \ programming languages.\n\n# ## Creating Functions\n\nTo declare a function,\
    \ simply use the following syntax –\n\n```\n```\nfunction_name() {\n   list of\
    \ commands\n}\n```\n```\n\nThe name of your function is function_name, and that\
    \ is what you will use to call it from elsewhere in your scripts. The function\
    \ name must be followed by parentheses, which are followed by a list of commands\
    \ enclosed within braces.\n\n# ## Example\n\nExample using function –\n\n```\n\
    ```\n#!/bin/sh\n\n# Define your function here\nHello() {\n   echo “Hello World”\n\
    }\n\n# Invoke your function\nHello\n```\n```\n\n**Output**\n\n```\n```\n$ ./test.sh\n\
    Hello World\n$\n```\n```\n\n# ## Pass Parameters to a Function\n\nYou can define\
    \ a function, which would accept parameters while calling those functions. These\
    \ parameters would be represented by $1, $2 and so on. The following is an example\
    \ where we pass two parameters *Zara* and *Ali* and then we capture and print\
