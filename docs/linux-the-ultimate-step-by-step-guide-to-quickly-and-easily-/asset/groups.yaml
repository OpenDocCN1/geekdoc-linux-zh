    从 BSD 内核以及所谓的“用户层”构建而成的集成操作系统（因此即使没有额外应用程序也可使用）。一旦安装在普通的计算机系统上，这种区别在很大程度上就消失了——与许多
    Linux 发行版一样，有大量易于安装的（大多为）开源应用程序可用于扩展 FreeBSD 核心，但这些通常由第三方贡献者提供，并非 FreeBSD 的严格组成部分。FreeBSD
    已建立起一个快速、高性能且极其稳定的操作系统的声誉，特别适合网络服务器及类似任务。许多大型网络搜索引擎和拥有关键任务计算基础设施的组织多年来一直在其计算机系统上部署并使用
    FreeBSD。与 Linux 相比，FreeBSD 在限制性小得多的许可证下分发，这几乎允许出于任何目的无限制地使用和修改源代码。甚至苹果公司的 Mac
    OS X 也被已知源自 FreeBSD。除了核心操作系统外，该项目还提供了超过 24,000 个软件应用程序的二进制和源代码形式，以便轻松安装在 FreeBSD
    核心之上。虽然 FreeBSD 当然可以作为桌面操作系统使用，但它无法与更受欢迎的 Linux 发行版相提并论。文本模式系统安装程序在硬件检测或系统配置方面提供甚少，将大量繁琐的工作留给用户在安装后设置中完成。在支持现代硬件方面，FreeBSD
    通常落后于 Linux，特别是在支持前沿的桌面和笔记本电脑设备方面，例如无线网络卡片或数码相机。那些希望利用 FreeBSD 在桌面或工作站上的速度和稳定性的用户，应考虑可用的桌面
    FreeBSD 项目之一，而不是 FreeBSD 本身。


    - 优点：快速且稳定；可安装超过 24,000 个软件应用程序（或“端口”）；非常出色的文档。

    - 缺点：在支持新型和特殊硬件方面往往落后于 Linux，商用应用程序可用性有限；缺乏图形化配置工具。


    ## 第三章：许可证


    代码在多种许可证下贡献给 Linux 内核，但所有代码必须与 GNU 通用公共许可证第 2 版（GPLv2）兼容，该许可证涵盖内核整体分发。在实践中，这意味着所有代码贡献要么由
    GPLv2 覆盖（可选地，允许在 GPL 后续版本下分发的语言），要么由三项条款的 BSD 许可证覆盖。任何未由兼容许可证覆盖的贡献都不会被接受到内核中。贡献给内核的代码不需要（也不要求）版权转让。所有合并到主线内核的代码都保留其原始所有权；因此，内核现在有成千上万的拥有者。这种所有权结构的一个含义是，任何改变内核许可的努力注定几乎肯定会失败。很少存在实际场景能够获得所有版权持有人的同意（或将其代码从内核中移除）。因此，在可预见的未来，没有迁移到
    GPL 第 3 版的前景。确保所有贡献给内核的代码都是合法的自由软件是至关重要的。因此，来自匿名（或化名）贡献者的代码将不被接受。


    所有贡献者都被要求对其代码进行“签署”，声明该代码可以随内核以 GPL 分发。其所有者未将其作为自由软件许可的代码，或可能给内核带来版权问题（例如，源于缺乏适当保护措施的逆向工程工作的代码）的代码不能被贡献。关于版权问题的问题在
    Linux 开发邮件列表中很常见。这类问题通常会得到不少回答，但应记住，回答这些问题的人不是律师，无法提供法律建议。如果您有关于 Linux 源代码的法律问题，与了解该领域的律师交谈是不可替代的。依赖在技术邮件列表上获得的答案是一种风险行为。


    ## 社区


    Linux 社区有两种基本形式：开发者和用户。


    Linux 最具吸引力的特点之一是它对开发者的开放性；任何具备相应技能的人都可以改进 Linux 并影响其开发方向。专有产品无法提供这种开放性，这是自由软件过程的特征。开发者社区可以自愿维护和整个发行版的支持，例如
    Debian 或 Gentoo 项目。Novell 和 Red Hat 也分别支持其产品的社区驱动版本，即 openSUSE 和 Fedora。对这些社区发行版的改进随后会被整合到商业服务器和桌面产品中。Linux
    内核本身主要由其开发者社区支持，是现存最大和最活跃的自由软件项目之一。典型的三个月内核开发周期可能涉及超过 1000 名开发者，为 100 多家不同公司（或根本不属于任何公司）工作。


    随着 Linux 的增长，希望参与其开发的开发者（和公司）数量也在增加。硬件供应商希望确保 Linux 良好地支持其产品，使其产品对 Linux 用户具有吸引力。使用
    Linux 作为集成产品中组件的嵌入式系统供应商，希望 Linux 尽可能强大且适合手头任务。基于 Linux 构建产品的发行商和其他软件供应商对 Linux
    内核的功能、性能和可靠性有明确的兴趣。其他开发者社区专注于运行在 Linux 上的不同应用程序和环境，例如 Firefox、OpenOffice、GNOME
    和 KDE。最终用户也能对 Linux 的开发做出有价值的贡献。通过 Linux.com、LinuxQuestions 以及发行版和应用程序托管的众多多样化在线社区，Linux
    用户群通常是 Linux 操作系统非常响亮但通常是积极的倡导者和指南。Linux 社区不仅仅是在线存在。被称为 Linux 用户组（LUGs）的本地小组经常聚会讨论
    Linux 操作系统相关问题，并为其他本地用户提供免费的演示、培训、技术支持和安装活动。


    ## 开发


    Linux 是一个由多种不同开发语言组成的操作系统。发行版代码的很大一部分是用 C（52.86%）或 C++（25.56%）语言编写的。其余所有代码都属于个位数百分比，Java、Perl
    和 Lisp 补齐了前五大语言。Linux 内核本身具有更占主导地位的 C 语言存在，超过 95% 的内核代码是用该语言编写的。然而，其他语言也构成了内核，使其比其他操作系统更具异质性。内核社区发展出了自己独特的运作方式，使其在一个每天都有数千行代码被修改的环境中平稳运行（并产生高质量的产品）。这意味着
    Linux 内核开发过程与专有开发方法大相径庭。


    内核的开发过程对新开发者来说可能显得奇怪和令人望而生畏，但其背后有良好理由和扎实的经验。不理解内核社区方式（或更糟，试图违反或绕过它们）的开发者会变得非常沮丧。开发社区虽然在帮助那些试图学习的人方面很有帮助，但对那些不听劝告或不关心开发过程的人则没什么耐心。虽然许多
    Linux 开发者仍使用 Emacs 或 Vim 等基于文本的工具来开发代码，但 Eclipse、Anjuta 和 Netbeans 都提供了更强大的集成开发环境。


    '
