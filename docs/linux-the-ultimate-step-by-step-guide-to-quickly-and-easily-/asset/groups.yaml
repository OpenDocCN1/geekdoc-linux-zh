    # ## FILE NAME GLOBBING WITH *, ?, [ ]


    Sometimes you want to manipulate a group of files, e.g., delete all of them, without
    having to perform the command on each file separately. For example, suppose we
    want to delete all of the .c files in a directory. A wildcard is a pattern, which
    matches something else. Two commonly used *nix wildcards are * (star) and ? (question
    mark).


    +   - Star (*) means zero or more characters

    +   - Question Mark (?) means exactly one character

    +   - Brackets ([ ]) represent a set of characters


    Commands involving filenames specified with wildcards are expanded by the shell
    (this is called globbing after the name of a former program called glob which
    used to do this outside the shell).


    # ## The ‘*”


    ‘ file*’ will match any filename which starts with the characters “file”, and
    then is followed by zero or more occurrences of any character.


    # ## Examples'
