    ```

    $ mount -t iso9660 /dev/cdrom /mnt/cdrom

    ```


    这假设你的 CD-ROM 设备名为 `/dev/cdrom`，并且你希望将其挂载到 `/mnt/cdrom`。有关更具体的信息，请参阅 mount 手册页，或在命令行中输入
