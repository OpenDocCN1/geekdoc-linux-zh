    # Chapter One: LINUX HISTORY


    The history of Linux began in 1991 with the commencement of a personal project
    by Finnish student Linus Torvalds to create a new free operating system kernel.
    Since then, the resulting Linux kernel has been marked by constant growth throughout
    its history. Since the initial release of its source code in 1991, it has grown
    from a small number of C files under a license prohibiting commercial distribution
    to the 3.18 version in 2015 with more than 18 million lines of source code under
    the GNU General Public License (GPL). He wrote the program specifically for the
    hardware he was using and independent of an operating system because he wanted
    to use the functions of his new PC with an Intel 80386 processor. Development
    was done on MINIX using the GNU C compiler. The GNU C Compiler is still the main
    choice for compiling Linux today. The code can be built with other compilers,
    such as the Intel C Compiler. As Torvalds wrote in his book ‘Just for Fun’, he
    eventually ended up writing an operating system kernel. On 25 August 1991 (age
    21), he announced this new system in a Usenet posting to the newsgroup “comp.os.minix.”


    Torvalds first published the Linux kernel under its own license, which had a restriction
    on commercial activity. The software used with the kernel was developed as part
    of the GNU project licensed under the GNU GPL, a free software license. The first
    release of the Linux kernel, Linux 0.01, included a binary of GNU’s Bash shell.
    In the “Notes for Linux release 0.01”, Torvalds lists the GNU software that is
    required to run Linux: Sadly, a kernel by itself gets you nowhere. To get a working
    system, you need a shell, compilers, a library, etc. These are separate parts
    and may be under stricter (or even looser) copyright. Most of the tools used with
    Linux are GNU software and are under the GNU copyright. These tools are not in
    the distribution - ask me (or GNU) for more info. In 1992, he suggested releasing
    the kernel under the GNU GPL. He first announced this decision in the release
    notes of version 0.12. In the middle of December 1992, he published version 0.99
    using the GNU GPL. Linux and GNU developers worked to integrate GNU components
    with Linux to make a fully functional free operating system. Torvalds has stated,
    “Making Linux GPL''d was definitely the best thing I ever did.” Torvalds initially
    used the designation “Linux” only for the Linux kernel. The kernel was, however,
    frequently used together with other software, especially'
