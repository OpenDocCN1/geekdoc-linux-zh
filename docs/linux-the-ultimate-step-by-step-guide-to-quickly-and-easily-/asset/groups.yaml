    the Bazaar）首次以文章形式出版（后来出版为书），导致 Netscape 公开发布其 Netscape Communicator 网络浏览器套件的源代码。Netscape
    的行动以及对文章的引用使 Linux 的开源开发模式引起了大众技术媒体的注意。此外，一组程序员开始开发图形用户界面 KDE。

    -   **1999：** 一组开发人员开始工作于图形环境 GNOME，它注定成为 KDE 的自由替代品，因为当时 KDE 依赖于当时的专有图形工具包 Qt。在这一年里，IBM
    宣布了一个广泛的支持 Linux 的项目。

    -   **2000：** Dell 宣布它现在是全球第二大基于 Linux 系统的提供商，也是第一家在其整个产品线中提供 Linux 的主要制造商。

    -   **2002：** 媒体报道称，“微软扼杀了 Dell Linux。”

    -   **2004：** XFree86 团队分裂，并与现有的 X 标准机构合并，成立了 X.Org Foundation，这导致 Linux 的 X 服务器开发速度大大加快。

    -   **2005：** openSUSE 项目开始由 Novell 社区进行免费分发。此外，OpenOffice.org 项目引入了 2.0 版本，该版本随后开始支持
    OASIS OpenDocument 标准。

    -   **2006：** Oracle 发布了其 Red Hat Enterprise Linux 的自有发行版。Novell 和 Microsoft 宣布合作，以实现更好的互操作性和相互专利保护。

    -   **2007：** Dell 开始分发预装 Ubuntu 的笔记本电脑。

    -   **2009：** Red Hat 的市场资本额等于 Sun 的市场资本额，这被解释为“基于 Linux 的经济”的一个象征性时刻。

    -   **2011：** Linux 内核 3.0 版本发布。

    -   **2012：** Linux 服务器市场总收入超过了其余 UNIX 市场。

    -   **2013：** 基于 Linux 的 Google Android 占据了 75% 的智能手机市场份额（按发货手机数量计算）。

    -   **2014：** Ubuntu 宣称拥有 22,000,000 用户。

    -   **2015：** Linux 内核 4.0 版本发布。


    ## 第二章：LINUX 发行版（DISTRO）


    ### 简介


    对于 Linux 新手来说，令人眼花缭乱的 Linux 发行版选择以及不断增长的发行版数量可能会造成困惑。这就是编写这本书的原因。它列举了 10 个 Linux
    发行版（外加对 FreeBSD 的特别提及，它是所有 BSD 系统中迄今为止最受欢迎的），并认为它是全球 Linux 用户中使用最广泛的。虽然没有数据来支持这一说法，而且还有许多其他发行版可能更适合你的特定用途，但作为一般规则，这些发行版都很受欢迎，并拥有非常活跃的论坛或邮件列表，当你陷入困境时可以在那里提问。Ubuntu、Linux
    Mint 和 PCLinuxOS 被认为是最适合希望尽快在 Linux 中变得富有生产力而不必掌握其所有复杂性的新用户的发行版。而在光谱的另一端，Slackware
    Linux、Arch Linux 和 FreeBSD 是更高级的发行版，在有效使用之前需要更深入的理解。openSUSE、Fedora、Debian GNU/Linux
    和 Mageia 可以归类为良好的“中庸之道”发行版。CentOS 是企业级发行版，适合那些偏好稳定性、可靠性和长期支持而非最新功能和软件的人。


    ### 选择发行版的指南


    ### Linux Mint


    Linux Mint 是一个基于 Ubuntu 的发行版，由 1996 年出生于法国、现居爱尔兰的 IT 专家克莱门特·勒费弗尔（Clement Lefebvre）于
    2006 年首次启动。最初维护一个致力于为新 Linux 用户提供帮助、技巧和文档的 Linux 网站时，作者看到了开发一个 Linux 发行版的潜力，该发行版旨在解决通常更具技术性的主流产品所伴随的许多易用性缺陷。自创建之初，开发人员就一直在添加各种图形化的“mint”工具以增强易用性；其中包括
    mintDesktop（一个用于配置桌面环境的实用程序）、mintMenu（一种新颖且优雅的菜单结构，便于导航）、mintInstall（一个易于使用的软件安装程序）以及
    mintUpdate（一个软件更新器）。Mint 以易用性著称，由于包含了通常因潜在法律威胁而缺席于大型发行版的专有和受专利限制的媒体编解码器，其声誉进一步增强。也许
    Linux Mint 的最佳特性之一是开发人员倾听用户的声音，并总是迅速实施良好的建议。虽然 Linux Mint 可免费获取，但该项目的收入来自捐赠、广告和专业支持服务。


    **优点：** 内部开发的出色“minty”工具集合，数百项用户友好的增强功能，包含媒体编解码器，向用户开放建议。


    **缺点：** 替代的“社区”版本并不总是包含最新功能；该项目不发布安全公告。


    ### Ubuntu


    Ubuntu 的启动最初于 2004 年 9 月宣布。尽管是 Linux 发行版领域的后起之秀，该项目却像其他任何项目一样迅速崛起，其邮件列表很快充满了热情用户和积极开发人员的讨论。在随后的几年里，Ubuntu
    增长为最流行的桌面 Linux 发行版，并为开发易于使用且免费的桌面操作系统做出了巨大贡献，使其能够很好地与市场上海的任何专有操作系统竞争。在技术方面，Ubuntu
    基于 Debian “Sid”（不稳定分支），但其中一些主要软件包，如 GNOME、Firefox 和 LibreOffice，已更新至最新版本。它使用一种名为“Unity”的自定义用户界面。它具有可预测的
    6 个月发布计划，偶尔会有长期支持（LTS）版本，根据版本不同，提供 5 年的安全更新支持（非 LTS 版本支持 9 个月）。Ubuntu 的其他特殊功能包括可安装的
    Live DVD、富有创意的艺术作品、桌面主题、面向 Windows 用户的迁移助手、对最新技术的支持（如 3D 桌面效果）、易于安装 ATI 和 NVIDIA
    显卡的专有设备驱动程序、无线网络以及按需支持非自由或受专利限制的媒体编解码器。


    **优点：** 固定的发布周期和支持期；具有 5 年安全更新支持的长期支持（LTS）变体；对初学者友好；丰富的文档，包括官方和用户贡献的文档。


