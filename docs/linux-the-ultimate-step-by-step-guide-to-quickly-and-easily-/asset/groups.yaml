    ## Arch Linux


    Arch Linux 的 KISS（保持简单，白痴）理念由加拿大计算机科学毕业生 Judd Vinet 于 2002 年左右构思，他同年启动了该发行版。多年来，它一直作为一个边缘项目，专为中级和高级
    Linux 用户设计，直到它开始宣传自己是一个“滚动发行”的版本，该版本只需安装一次，即可通过其强大的包管理器和始终最新的软件仓库保持更新，从而声名鹊起。因此，Arch
    Linux 的“版本发布”间隔很长，目前仅限于一张基础安装 DVD，仅在基础系统发生重大变化需要重新安装时才会发布。除了备受喜爱的“滚动发行”更新机制外，Arch
