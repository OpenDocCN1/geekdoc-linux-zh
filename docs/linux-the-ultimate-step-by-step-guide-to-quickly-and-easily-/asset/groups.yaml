    \ directory. To move up one level, we can type:\n\n```bash\ncd ..\n```\n\nThis\
    \ takes us to the /usr/share/locale/en directory.\n\nA shortcut that you saw earlier\
    \ that will always take you back to your home directory is to use cd without providing\
    \ a directory:\n\n```bash\ncd\npwd\n/home/demo\n```\n\n# Viewing Files\n\nIn the\
    \ last section, we learned how to navigate the filesystem. In this section, we\
    \ will discuss different ways to view files. In contrast to some operating systems,\
    \ Linux and other Unix-like operating systems rely on plain text files for vast\
    \ portions of the system. The main way that we will view files is with the less\
    \ command. This is what we call a “pager”, because it allows us to scroll through\
    \ pages of a file. While the previous commands immediately executed and returned\
    \ you to the command line, less is an application that will continue to run and\
    \ occupy the screen until you exit.\n\nWe will open the /etc/services file, which\
    \ is a configuration file that contains the systems services information:\n\n\
    ```bash\nless /etc/services\n```\n\nThe file will be opened in less, allowing\
    \ you to see the portion of the document that fits in the terminal window:\n\n\
    ```\n# Network services, Internet style\n#\n# Note that it is presently the policy\
    \ of IANA to assign a single well-known port number for both TCP and UDP; hence,\
    \ officially ports have two entries\n#\n# even if the protocol doesn't support\
    \ UDP operations.\n#\n# Updated from http://www.iana.org/assignments/port-numbers\
    \ and other\n#\n# sources like http://www.freebsd.org/cgi/cvsweb.cgi/src/etc/services\
    \ .\n#\n# New ports will be added on request if they have been officially assigned\n\
    #\n# by IANA and used in the real-world or are needed by a debian package.\n#\n\
    # If you need a huge list of used numbers please install the nmap package.\n\n\
    tcpmux\t\t\t1/tcp\t\t\t\t# TCP port service multiplexer\necho\t\t\t7/tcp\n```\n\
    \nTo scroll, you can use the up and down arrow keys on your keyboard. To page\
    \ down one whole screens-worth of information, you can use either the space bar,\
    \ the “Page Down” button on your keyboard, or the **CTRL-f** shortcut.\n\nTo scroll\
    \ back up, you can use either the “Page Up” button, or the **CTRL-b** keyboard\
    \ shortcut. To search for some text in the document, you can type a forward slash\
    \ “/” followed by the search term. For instance, to search for “mail”, we would\
    \ type: /mail  This will search forward through the document and stop at the first\
    \ result. To get to another result, you can type the lower-case **n** key:\n\n\
    ```\nn\n```\n\nTo move backwards to the previous result, use a capital **N** instead:\n\
    \n```\nN\n```\n\nWhen you wish to exit the `less` program, you can type **q**\
