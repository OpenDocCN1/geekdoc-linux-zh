    ## 第八章：处理文件


    本章首先描述 Unix 命令的一般特征。然后讨论常用于创建和操作文件的命令。一些最常用的 UNIX 命令的摘要呈现在命令比较中。


    ### UNIX 文件名


    理解创建 UNIX 文件的规则很重要：UNIX 区分大小写！例如，“fileName” 与 “filename” 不同。建议将名称限制为字母字符、数字、下划线（_）和点（.）。UNIX
    文件名中使用的点（.）只是字符，而不是文件名组件之间的分隔符；你可以在文件名中包含多个点。将点作为文件名的第一个字符会使文件对普通的 ls 命令不可见（隐藏）；使用
    ls 命令的 -a 标志来显示隐藏文件。虽然许多系统允许更长，但建议每个文件名的长度为 14 个字符。Unix shell 通常包含几个重要的通配符。星号
    (*) 用于匹配 o 或更多字符（例如，abc* 将匹配以字母 abc 开头的任何文件），问号 (?) 用于匹配任何单个字符，左方括号 ([) 和右方括号
    (]) 用于括住一串字符，其中任何一个字符匹配。执行以下命令并观察结果：


    ```bash

    ls m*

    ls *,f

    ls *.?

    ls [a-d]*

    ```


    PC 用户注意事项：Unix 使用正斜杠 (/) 而不是反斜杠 (\) 作为目录分隔符


    ### 查看文件内容


    你可以使用各种命令查看文件内容。此处介绍了 cat、more、pg、head 和 tail。当然，你始终可以使用编辑器；要在“只读”模式下使用 vi 查看文件
    “argtest” 的内容，请输入：


    ```bash

    vi -R argtest

    ```


