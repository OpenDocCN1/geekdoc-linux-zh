    # Chapter Nine: NAVIGATION AND FILE MANAGEMENT


    If you do not have much experience working with Linux systems, you may be overwhelmed
    by the prospect of controlling an operating system from the command line. In this
    book, we will attempt to get you up to speed with the basics.


    # Prerequisites and Goals


    In order to follow along with this book, you will need to have access to a Linux
    server. You will also want to have a basic understanding of how the terminal works
    and what Linux commands look like. This book covers terminal basics, so you should
    check it out if you are new to using terminals. All of the material in this book
    can be accomplished with a regular, non-root (non-administrative) user account.
    You can learn how to configure this type of user account by following your distribution’s
    initial server setup guide (Ubuntu 14.04, CentOS 7). When you are ready to begin,
    connect to your Linux server using SSH and continue below.


    # Navigation and Exploration


    The most fundamental skills you need to master are navigating the filesystem.
    We will discuss the tools that allow you to do this in this section.


    # Finding where you are with the “pwd” command


    When you log onto your server, you are typically dropped into your user accounts
    home directory. A home directory is the directory set aside for your account to
    store files and create directories. It is the location in the filesystem where
    you have full dominion. To find out where your home directory is in relationship
    to the rest of the filesystem, you can use the pwd command. This command displays
    the directory that we currently in:


    ```

    ```

    pwd

    ```


    ```


    You should get back some information that looks like this:


    ```

    ```

    /home/demo

    ```


    ```


    The home directory is named after the user account, so the above example is what
    the value would be if you were logged into the server with an account called demo.
    This directory is within a directory called /home, which is itself within the
    top-level directory, which is called “root” represented by a single slash “/”.'
