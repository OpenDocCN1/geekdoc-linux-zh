    latin1 设备以 ASCII 格式显示纯 ASCII 手册页。它不会转换任何 latin1 文本。下表显示了执行的转换：其中部分内容可能仅在使用 GNU
    nroff 的 latin1 设备时才能正确显示。当使用 -t、-H、-T 或 -Z 选项时，此选项将被忽略；对于非 GNU 版本的 nroff，此选项可能无用。


    ## -E encoding, --encoding=encoding

    生成针对默认以外的字符编码的输出。为了向后兼容，encoding 可以是 nroff 设备（如 ascii、latin1 或 utf8），也可以是真正的字符编码（如
    UTF-8）。


    ## --no-hyphenation, --nh

    通常，nroff 会在换行时自动连字符化文本，即使在单词中不包含连字符，如果为了在一行中排版三个单词而不产生过多间距必须这样做，也会执行此操作。此选项禁用自动连字符化，因此只有已经包含连字符的单词才会被连字符化。如果你正在编写手册页，只是想阻止
    nroff 在不合适的位置连字符化某个单词，请不要使用此选项，而是查阅 nroff 文档；例如，你可以在单词内放入 "\%" 以指示可以在该位置连字符化，或在单词开头放入
    "\%" 以防止其被连字符化。


    ## --no-justification, --nj

    通常，nroff 会自动将文本两端对齐。此选项禁用完全两端对齐，仅保留左对齐，有时称为“右端不规则”文本。


    如果你正在编写手册页，只是想阻止 nroff 对某些段落进行对齐，请不要使用此选项，而是查阅 nroff 文档；例如，你可以使用 “.na”、“.nf”、“.fi”
