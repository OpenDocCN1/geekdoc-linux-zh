  md: "\n## The Substitution Command\n\nThe substitution command, denoted by `s`,\
    \ will substitute any string that you specify with any other string that you specify.\
    \ To substitute one string with another, you need to have a way of telling `sed`\
    \ where your first string ends and the substitution string begins. This is traditionally\
    \ done by bookending the two strings with the forward slash (/) character. The\
    \ following command substitutes the first occurrence on a line of the string `root`\
    \ with the string `amrood`.\n\n```bash\n$ cat /etc/passwd | sed 's/root/amrood/'\n\
    amrood:x:0:0:root user:/root:/bin/sh\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\n\
    ```\n\nIt is very important to note that `sed` substitutes only the first occurrence\
    \ on a line. If the string `root` occurs more than once on a line, only the first\
    \ match will be replaced. To tell `sed` to do a global substitution, add the letter\
    \ `g` to the end of the command as follows:\n\n```bash\n$ cat /etc/passwd | sed\
    \ 's/root/amrood/g'\namrood:x:0:0:amrood user:/amrood:/bin/sh\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\n\
    bin:x:2:2:bin:/bin:/bin/sh\nsys:x:3:3:sys:/dev:/bin/sh\n```\n\n### Substitution\
    \ Flags\n\n| Flag | Description |\n|:---|:---|\n| g | Replace all matches, not\
    \ just the first match. |\n| NUMBER | Replace only NUMBERth match. |\n| p | If\
    \ substitution was made, print pattern space. |\n| w FILENAME | If substitution\
    \ was made, write result to FILENAME. |\n\nThere are a number of other useful\
    \ flags that can be passed in addition to the `g` flag, and you can specify more\
    \ than one at a time.\n\n### Using an Alternative String Separator\n\nYou may\
    \ find yourself having to do a substitution on a string that includes the forward\
    \ slash character. In this case, you can specify a different separator by providing\
    \ the designated character after the `s`.\n\nFor example:\n\n| Flag | Description\
    \ | Command Example |\n|:---|:---|:---|\n| I or i | Match in a case-insensitive\
    \ manner. | `cat /etc/passwd \\| sed 's:/root:/amrood:/g'`<br>`amrood:x:0:0:amrood\
    \ user:/amrood:/bin/sh` |\n| M or m | In addition to the normal behavior of the\
    \ special regular expression characters `^` and `$`, this flag causes `^` to match\
    \ the empty string after a newline and `$` to match the empty string before a\
    \ newline. | `daemon:x:1:1:daemon:/usr/sbin:/bin/sh` |\n\nIn the above example,\
    \ we used `:` as delimiter instead of slash `/` because we were trying to search\
    \ `/root` instead of simple `root`.\n\n### Replacing with Empty Space\n\nUse an\
    \ empty substitution string to delete the `root` string from the `/etc/passwd`\
    \ file entirely:\n\n```bash\n$ cat /etc/passwd | sed 's/root//g'\n:x:0:0://bin/sh\n\
    daemon:x:1:1:daemon:/usr/sbin:/bin/sh\n```\n\n### Address Substitution\n\nIf you\
    \ want to substitute the string ‘sh' with the string ‘quiet' on line 10, you can\
    \ specify it as follows:\n\n```bash\n$ cat /etc/passwd | sed '10s/sh/quiet/g'\n\
    root:x:0:0:root user:/root:/bin/sh\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\nbin:x:2:2:bin:/bin:/bin/sh\n\
    sys:x:3:3:sys:/dev:/bin/sh\nsync:x:4:65534:sync:/bin:/bin/sync\ngames:x:5:60:games:/usr/games:/bin/sh\n\
    man:x:6:12:man:/var/cache/man:/bin/sh\nmail:x:8:8:mail:/var/mail:/bin/sh\nnews:x:9:9:news:/var/spool/news:/bin/sh\n\
    backup:x:34:34:backup:/var/backups:/bin/quiet\n```\n\nSimilarly, to do an address\
    \ range substitution, you could do something like this:\n\n```bash\n$ cat /etc/passwd\
    \ | sed '1,5s/sh/quiet/g'\nroot:x:0:0:root user:/root:/bin/quiet\ndaemon:x:1:1:daemon:/usr/sbin:/bin/quiet\n\
    bin:x:2:2:bin:/bin/bin/quiet\nsys:x:3:3:sys:/dev:/bin/quiet\nsync:x:4:65534:sync:/bin/bin/sync\n\
    games:x:5:60:games:/usr/games:/bin/sh\nman:x:6:12:man:/var/cache/man:/bin/sh\n\
    mail:x:8:8:mail:/var/mail:/bin/sh\nnews:x:9:9:news:/var/spool/news:/bin/sh\nbackup:x:34:34:backup:/var/backups:/bin/sh\n\
    ```\n\nAs you can see from the output, the first five lines had the string ‘sh’\
    \ changed to ‘quiet,’ but the rest of the lines were left untouched.\n\n### The\
    \ Matching Command\n\nYou would use `p` option along with `-n` option to print\
