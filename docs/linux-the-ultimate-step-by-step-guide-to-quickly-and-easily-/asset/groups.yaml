  mdcn: "\n\n## 替换命令\n\n替换命令由 `s` 表示，它会将您指定的任意字符串替换为另一个您指定的字符串。要将一个字符串替换为另一个字符串，您需要一种方法来告诉\
    \ `sed` 第一个字符串在哪里结束以及替换字符串从哪里开始。传统上，这是通过用正斜杠 (/) 字符作为两个字符串的分隔符来实现的。以下命令将一行中首次出现的字符串\
    \ `root` 替换为字符串 `amrood`。\n\n```bash\n$ cat /etc/passwd | sed 's/root/amrood/'\n\
    amrood:x:0:0:root user:/root:/bin/sh\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\n\
    ```\n\n需要注意的是，`sed` 仅替换每行中首次出现的字符串。如果字符串 `root` 在一行中出现多次，只有第一个匹配项会被替换。若要指示 `sed`\
    \ 执行全局替换，请在命令末尾添加字母 `g`，如下所示：\n\n```bash\n$ cat /etc/passwd | sed 's/root/amrood/g'\n\
    amrood:x:0:0:amrood user:/amrood:/bin/sh\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\n\
    bin:x:2:2:bin:/bin:/bin/sh\nsys:x:3:3:sys:/dev:/bin/sh\n```\n\n### 替换标志\n\n| 标志\
    \ | 描述 |\n|:---|:---|\n| g | 替换所有匹配项，而不仅仅是第一个匹配项。 |\n| NUMBER | 仅替换第 NUMBER 个匹配项。\
    \ |\n| p | 如果进行了替换，则打印模式空间。 |\n| w FILENAME | 如果进行了替换，则将结果写入 FILENAME。 |\n\n除了\
    \ `g` 标志外，还可以传递许多其他有用的标志，并且您可以一次指定多个标志。\n\n### 使用备用字符串分隔符\n\n您可能会发现需要对包含正斜杠字符的字符串执行替换。在这种情况下，您可以在\
    \ `s` 之后提供指定字符来指定不同的分隔符。\n\n例如：\n\n| 标志 | 描述 | 命令示例 |\n|:---|:---|:---|\n| I 或\
