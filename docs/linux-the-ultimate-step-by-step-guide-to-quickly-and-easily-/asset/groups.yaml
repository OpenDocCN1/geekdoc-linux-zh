    | - | Subtraction - Subtracts right hand operand from left hand operand | `expr
    $a - $b` will give -10 |

    | \* | Multiplication - Multiplies values on either side of the operator | `expr
    $a \* $b` will give 200 |

    | / | Division - Divides left hand operand by right hand operand | `expr $b /
    $a` will give 2 |

    | % | Modulus - Divides left hand operand by right hand operand and returns remainder
    | `expr $b % $a` will give 0 |

    | = | Assignment - Assign right operand in left operand | a=$b would assign value
    of b into a |

