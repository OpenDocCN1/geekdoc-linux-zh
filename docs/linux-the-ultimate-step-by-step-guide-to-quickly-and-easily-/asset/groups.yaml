    \ by the file you are moving. There is no way to recover the previous file if\
    \ you accidentally overwrite it.\n\n## Copying Files and Directories with “cp”\n\
    \nWith the `mv` command, we could move or rename a file or directory, but we could\
    \ not duplicate it. The `cp` command can make a new copy of an existing item.\n\
    \nFor instance, we can copy `file3` to a new file called `file4`:\n\n```\ncp file3\
    \ file4\n```\n\nUnlike the `mv` operation, after which `file3` would no longer\
    \ exist, we now have both `file3` and `file4`.\n\n> **Note:** As with the `mv`\
    \ command, it is possible to overwrite a file if you are not careful about the\
    \ filename you are using as the target of the operation. For instance, if `file4`\
    \ already existed in the above example, its contents would be completely replaced\
    \ by the contents of `file3`.\n\nIn order to copy directories, you must include\
    \ the `-r` option in the command. This stands for “recursive,” as it copies the\
    \ directory, plus all of the directory’s contents.\n\nThis option is necessary\
    \ with directories, regardless of whether the directory is empty. For instance,\
    \ to copy the `some` directory structure to a new structure called `again`, we\
    \ could type:\n\n```\ncp -r some again\n```\n\nUnlike with files, with which an\
    \ existing destination would lead to an overwrite, if the target is an *existing\
    \ directory*, the file or directory is copied *into* the target:\n\n```\ncp file1\
    \ again\n```\n\nThis will create a new *copy of `file1`* and *place it inside\
    \ the `again` directory*.\n\n## Removing Files and Directories with “rm” and “rmdir”\n\
    \nTo delete a file, you can use the `rm` command.\n\n**Note:** Be extremely careful\
    \ when using any destructive command like `rm`. There is no “undo” command for\
    \ these actions so it is possible to accidentally destroy important files permanently.\n\
    \nTo remove a regular file, just pass it to the `rm` command:\n\n```\ncd\nrm file4\n\
    ```\n\nLikewise, to remove *empty* directories, we can use the `rmdir` command.\
    \ This will only succeed if there is nothing in the directory in question. For\
    \ instance, to remove the `example` directory within the `testing` directory,\
    \ we can type:\n\n```\nrmdir testing/example\n```\n\nIf you wish to remove a *non-empty*\
    \ directory, you will have to use the `rm` command again. This time, you will\
    \ have to pass the `-r` option, which removes all of the directory’s contents\
    \ recursively, plus the directory itself.\n\nFor instance, to remove the `again`\
    \ directory and everything within it, we can type:\n\n```\nrm -r again\n```\n\n\
    Once again, it is worth reiterating that these are permanent actions. Be entirely\
    \ sure that the command you typed is the one that you wish to execute.\n\n## Editing\
    \ Files\n\nCurrently, we know how to manipulate files as objects, but we have\
    \ not learned how to actually edit and add content to them. The `nano` command\
