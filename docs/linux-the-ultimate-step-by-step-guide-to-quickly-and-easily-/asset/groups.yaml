  md: "\n## Shell 算术运算示例\n\n以下脚本演示了基本的算术操作：\n\n```sh\n#!/bin/sh\n\na=10\nb=20\nval=`expr\
    \ $a + $b`\necho \"a + b : $val\"\n\nval=`expr $a - $b`\necho \"a - b : $val\"\
    \n\nval=`expr $a \\* $b`\necho \"a * b : $val\"\n\nval=`expr $b / $a`\necho \"\
    b / a : $val\"\n\nval=`expr $b % $a`\necho \"b % a : $val\"\n\nif [ $a == $b ]\n\
    then\n  echo \"a is equal to b\"\nfi\n\nif [ $a != $b ]\nthen\n  echo \"a is not\
    \ equal to b\"\nfi\n```\n\n输出结果：\n\n```text\na + b : 30\na - b : -10\na * b :\
    \ 200\nb / a : 2\nb % a : 0\na is not equal to b\n```\n\n注意：\n- 操作符和表达式之间必须有空格，例如\
    \ `2+2` 是错误的，应写作 `2 + 2`。\n- 完整的表达式应被反引号（inverted commas，即 ` ` ` 和 ` ` `）或引号包围。\n\
    - 乘法运算中使用 `\\*` 代替 `*` 符号。\n- **if...then...fi** 语句是决策语句，将在下一章解释。\n\n算术运算符表：\n\
    \n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| + | 加法 - 将操作符两侧的值相加 | `expr $a\
    \ + $b` 结果为 30 |\n| - | 减法 - 从左手操作数中减去右手操作数 | `expr $a - $b` 结果为 -10 |\n| \\*\
    \ | 乘法 - 将操作符两侧的值相乘 | `expr $a \\* $b` 结果为 200 |\n| / | 除法 - 左手操作数除以右手操作数 | `expr\
    \ $b / $a` 结果为 2 |\n| % | 取模 - 左手操作数除以右手操作数并返回余数 | `expr $b % $a` 结果为 0 |\n| =\
    \ | 赋值 - 将右手操作数赋值给左手操作数 | `a=$b` 将 b 的值赋给 a |\n| == | 相等 - 比较两个数字，如果相同则返回 true\
    \ | `[ $a == $b ]` 返回 false |\n| != | 不等 - 比较两个数字，如果不同则返回 true | `[ $a != $b ]`\
    \ 返回 true |\n\n请注意，所有条件表达式都必须放在方括号内，且周围需有一个空格，例如 `[ $a == $b ]` 是正确的，而 `[$a==\
    \ $b]` 是错误的。\n\n所有算术计算均使用长整型（long integers）。\n\n## 关系运算符\n\nBourne Shell 支持以下关系运算符，它们仅适用于数值。这些运算符不适用于字符串值，除非其值为数字。例如，以下运算符检查\
    \ 10 和 20 之间的关系，也检查 \"10\" 和 \"20\" 之间的关系，但不检查 \"ten\" 和 \"twenty\" 之间的关系。假设变量\
    \ a 持有 10，变量 b 持有 20：\n\n此示例使用了所有关系运算符：\n\n```sh\n#!/bin/sh\n\na=10\nb=20\n\n\
    if [ $a -eq $b ]\nthen\necho \"$a -eq $b : a is equal to b\"\nelse\necho \"$a\
    \ -eq $b: a is not equal to b\"\nfi\n\nif [ $a -ne $b ]\nthen\necho \"$a -ne $b:\
    \ a is not equal to b\"\nelse\necho \"$a -ne $b : a is equal to b\"\nfi\n\nif\
    \ [ $a -gt $b ]\nthen\necho \"$a -gt $b: a is greater than b\"\nelse\necho \"\
    $a -gt $b: a is not greater than b\"\nfi\n\nif [ $a -lt $b ]\nthen\necho \"$a\
    \ -lt $b: a is less than b\"\nelse\necho \"$a -lt $b: a is not less than b\"\n\
    fi\n\nif [ $a -ge $b ]\nthen\necho \"$a -ge $b: a is greater or equal to b\"\n\
    else\necho \"$a -ge $b: a is not greater or equal to b\"\nfi\n\nif [ $a -le $b\
    \ ]\nthen\n    echo \"$a -le $b: a is less or equal to b\"\nelse\n    echo \"\
    $a -le $b: a is not less or equal to b\"\nfi\n```\n\n输出结果：\n\n```text\n10 -eq\
    \ 20: a is not equal to b\n10 -ne 20: a is not equal to b\n10 -gt 20: a is not\
    \ greater than b\n10 -lt 20: a is less than b\n10 -ge 20: a is not greater or\
    \ equal to b\n10 -le 20: a is less or equal to b\n```\n\n注意：\n- 操作符和表达式之间必须有空格，例如\
    \ `2+2` 是错误的，应写作 `2 + 2`。\n- **if…then…else…fi** 语句是决策语句，将在下一章解释。\n\n关系运算符表：\n\
    \n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| **-eq** | 检查两个操作数的值是否相等，如果是则条件为\
    \ true | `[ $a -eq $b ]` 不为 true |\n| **-ne** | 检查两个操作数的值是否相等，如果不等则条件为 true |\
    \ `[ $a -ne $b ]` 为 true |\n| **-gt** | 检查左手操作数的值是否大于右手操作数的值，如果是则条件为 true | `[\
    \ $a -gt $b ]` 不为 true |\n| **-lt** | 检查左手操作数的值是否小于右手操作数的值，如果是则条件为 true | `[ $a\
    \ -lt $b ]` 为 true |\n| **-ge** | 检查左手操作数的值是否大于或等于右手操作数的值，如果是则条件为 true | `[ $a\
    \ -ge $b ]` 不为 true |\n| **-le** | 检查左手操作数的值是否小于或等于右手操作数的值，如果是则条件为 true | `[ $a\
    \ -le $b ]` 为 true |\n\n请注意，所有条件表达式都必须放在方括号内，且周围需有一个空格，例如 `[ $a <= $b ]` 是正确的，而\
    \ `[$a <= $b]` 是错误的。\n\n## 布尔运算符\n\nBourne Shell 支持以下布尔运算符。\n\n假设变量 ‘a’ 持有 10，变量\
    \ ‘b’ 持有 20：\n\n此示例使用了所有布尔运算符：\n\n```sh\n#!/bin/sh\n\na=10\nb=20\n\nif [ $a !=\
    \ $b ]\nthen\n    echo \"$a != $b : a is not equal to b\"\nelse\n    echo \"$a\
    \ != $b: a is equal to b\"\nfi\n\nif [ $a -lt 100 -a $b -gt 15 ]\nthen\n    echo\
    \ \"$a -lt 100 -a $b -gt 15 : returns true\"\nelse\n    echo \"$a -lt 100 -a $b\
    \ -gt 15 : returns false\"\nfi\n\nif [ $a -lt 100 -o $b -gt 100 ]\nthen\n    echo\
    \ \"$a -lt 100 -o $b -gt 100 : returns true\"\nelse\n    echo \"$a -lt 100 -o\
    \ $b -gt 100 : returns false\"\nfi\n\nif [ $a -lt 5 -o $b -gt 100 ]\nthen\n  \
    \  echo \"$a -lt 5 -o $b -gt 100 : returns true\"\nelse\n  echo \"$a -lt 5 -o\
    \ $b -gt 100 : returns false\"\nfi\n```\n\n输出结果：\n\n```text\n10 != 20 : a is not\
    \ equal to b\n10 -lt 100 -a 20 -gt 15 : returns true\n10 -lt 100 -o 20 -gt 100\
    \ : returns true\n10 -lt 5 -o 20 -gt 100 : returns false\n```\n\n注意：\n- 操作符和表达式之间必须有空格，例如\
    \ `2+2` 是错误的，应写作 `2 + 2`。\n\n布尔运算符表：\n\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :---\
    \ |\n| ! | 逻辑否定。将 true 条件反转为 false，反之亦然 | `[ ! false ]` 为 true |\n| -o | 逻辑 OR。如果任一操作数为\
    \ true，则条件为 true | `[ $a -lt 20 -o $b -gt 100 ]` 为 true |\n| -a | 逻辑 AND。如果两个操作数均为\
    \ true，则条件为 true，否则为 false | `[ $a -lt 20 -a $b -gt 100 ]` 为 false |\n\n## 字符串运算符\n\
    \nBourne Shell 支持以下字符串运算符。\n\n假设变量 ‘a’ 持有 \"abc\"，变量 ‘b’ 持有 \"efg\"：\n\n此示例使用了所有字符串运算符：\n\
    \n```sh\n#!/bin/sh\n\na=\"abc\"\nb=\"efg\"\n\nif [ $a = $b ]\nthen\n    echo \"\
    $a = $b : a is equal to b\"\nelse\n    echo \"$a = $b: a is not equal to b\"\n\
    fi\n\nif [ $a != $b ]\nthen\n    echo \"$a != $b : a is not equal to b\"\nelse\n\
    \    echo \"$a != $b: a is equal to b\"\nfi\n\nif [ -z $a ]\nthen\n    echo \"\
    -z $a : string length is zero\"\nelse\n    echo \"-z $a : string length is not\
    \ zero\"\nfi\n\nif [ -n $a ]\nthen\n    echo \"-n $a : string length is not zero\"\
    \nelse\n    echo \"-n $a : string length is zero\"\nfi\n\nif [ $a ]\nthen\n  \
    \  echo \"$a : string is not empty\"\nelse\n    echo \"$a : string is empty\"\n\
    fi\n```\n\n输出结果：\n\n```text\nabc = efg: a is not equal to b\nabc != efg : a is\
    \ not equal to b\n-z abc : string length is not zero\n-n abc : string length is\
    \ not zero\nabc : string is not empty\n```\n\n注意：\n- 操作符和表达式之间必须有空格，例如 `2+2` 是错误的，应写作\
    \ `2 + 2`。\n\n字符串运算符表：\n\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| = | 检查两个操作数的值是否相等，如果是则条件为\
    \ true | `[ $a = $b ]` 不为 true |\n| != | 检查两个操作数的值是否相等，如果不等则条件为 true | `[ $a !=\
    \ $b ]` 为 true |\n| -z | 检查给定字符串操作数的长度是否为零。如果长度为零则返回 true | `[ -z $a ]` 不为 true\
    \ |\n| -n | 检查给定字符串操作数的长度是否非零。如果长度非零则返回 true | `[ -z $a ]` 不为 false (注：原文如此，意指\
    \ `[ -n $a ]` 的判断) |\n| **str** | 检查 str 是否为非空字符串。如果为空则返回 false | `[ $a ]` 不为\
    \ false |\n\n## 文件测试运算符\n\n以下运算符测试与 Unix 文件相关的各种属性。\n\n假设变量 `file` 持有现有的文件名 \"\
    test\"，其大小为 100 字节，并具有读、写和执行权限：\n\n此示例使用了所有文件测试运算符：\n\n```sh\n#!/bin/sh\n\nfile=\"\
    /var/www/tutorialspoint/unix/test.sh\"\n\nif [ -r $file ]\nthen\n  echo \"File\
