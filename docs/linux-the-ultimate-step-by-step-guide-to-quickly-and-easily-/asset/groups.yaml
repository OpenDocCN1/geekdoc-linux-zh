    ## 日志轮转


    日志文件很容易快速增长并消耗大量磁盘空间。要启用日志轮转，大多数发行版使用如 newsyslog 或 logrotate 这样的工具。这些工具应使用 cron
    守护进程以频繁的时间间隔调用。有关更多详细信息，请查阅 newsyslog 或 logrotate 的手册页。


