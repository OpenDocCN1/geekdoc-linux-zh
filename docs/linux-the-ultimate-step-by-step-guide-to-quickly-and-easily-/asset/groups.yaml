    \ in users |\n\n# Chapter Seventeen: REGULAR EXPRESSION\n\nA regular expression\
    \ is a string that can be used to describe several sequences of characters. Regular\
    \ expressions are used by several different Unix commands, including `ed`, `sed`,\
    \ `awk`, `grep`, and, to a more limited extent, `vi`. Here `sed` stands for **stream\
    \ editor** a stream oriented editor, which was created exclusively for executing\
    \ scripts. Thus, all the input you feed into it passes through and goes to STDOUT\
    \ and it does not change the input file.\n\n## Invoking sed\n\nBefore we start,\
    \ let us make sure you have a local copy of `/etc/passwd` text file to work with\
    \ `sed`. As mentioned previously, `sed` can be invoked by sending data through\
    \ a pipe to it as follows:\n\n```\n$ cat /etc/passwd | sed\nUsage: sed [OPTION]...\
    \ {script-other-script} [input-file]...\n\n-n, --quiet, --silent\n           \
    \      suppress automatic printing of pattern space\n-e script, --expression=script\n\
    \                 \"...\" \n```\n\nThe `cat` command dumps the contents of `/etc/passwd`\
    \ to `sed` through the pipe into `sed`'s pattern space. The pattern space is the\
    \ internal work buffer that `sed` uses to do its work.\n\n## The sed General Syntax\n\
    \nGeneral syntax for sed:\n\n```\n/pattern/action\n```\n\nHere, **pattern** is\
    \ a regular expression, and **action** is one of the commands given in the following\
    \ table. If **pattern** is omitted, **action** is performed for every line as\
    \ we have seen above.\n\nThe slash characters ( / ) that surround the pattern\
    \ are required because they are used as delimiters.\n\n| Range | Description |\n\
    | :--- | :--- |\n| P | Prints the line |\n| D | Deletes the line |\n| s/pattern1/pattern2/\
    \ | Substitutes the first occurrence of |\n\n## Deleting All Lines with sed\n\n\
    Invoke `sed` again, but this time tell `sed` to use the editing command delete\
    \ line, denoted by the single letter d:\n\n```\n$ cat /etc/passwd | sed ‘d’\n\
    $ \n```\n\nInstead of invoking `sed` by sending a file to it through a pipe, you\
    \ can instruct `sed` to read the data from a file, as in the following example.\
    \ The following command does exactly the same thing as the previous example, without\
    \ the cat command:\n\n```\n$ sed -e ‘d’ /etc/passwd\n$ \n```\n\n## The sed Addresses\n\
    \n`sed` also understands something called addresses. Addresses are either particular\
    \ locations in a file or a range where a particular editing command should be\
    \ applied. When `sed` encounters no addresses, it performs its operations on every\
    \ line in the file.\n\nThe following command adds a basic address to the `sed`\
    \ command you have been using:\n\n```\n$ cat /etc/passwd | sed ‘1d’ |more\ndaemon:x:1:1:daemon:/usr/sbin:/bin/sh\n\
    bin:x:2:2:bin:/bin:/bin/sh\nsys:x:3:3:sys:/dev:/bin/sh\nsync:x:4:65534:sync:/bin:/bin/sync\n\
    games:x:5:60:games:/usr/games:/bin/sh\nman:x:6:12:man:/var/cache/man:/bin/sh\n\
    mail:x:8:8:mail:/var/mail:/bin/sh\nnews:x:9:9:news:/var/spool/news:/bin/sh\nbackup:x:34:34:backup:/var/backups:/bin/sh\n\
    $ \n```\n\nNotice that the number 1 is added before the delete edit command. This\
    \ tells `sed` to perform the editing command on the first line of the file. In\
    \ this example, `sed` will delete the first line of /etc/passwd and print the\
    \ rest of the file.\n\n## The sed Address Ranges\n\nSo, what if you want to remove\
    \ more than one line from a file? You can specify an address range with `sed`\
    \ as follows:\n\n```\n$ cat /etc/passwd | sed ‘1, 5d’ |more\ngames:x:5:60:games:/usr/games:/bin/sh\n\
    man:x:6:12:man:/var/cache/man:/bin/sh\nmail:x:8:8:mail:/var/mail:/bin/sh\nnews:x:9:9:news:/var/spool/news:/bin/sh\n\
    backup:x:34:34:backup:/var/backups:/bin/sh\n$\n```\n\nThe above command will be\
    \ applied on all the lines starting from 1 through 5. Therefore, it deletes the\
    \ first five lines. Try out the following address ranges:\n\n| Range | Description\
    \ |\n|---|---|\n| `‘4,10d’` | Lines starting from 4th till 10th are deleted |\n\
    | `‘10,4d’` | Only 10th line is deleted, because sed does not work in reverse\
    \ direction. |\n| `‘4,+5d’` | This will match line 4 in the file, delete that\
    \ line, continue to delete the next five lines, and then cease its deletion and\
    \ print the rest |\n| `‘2,5!d’` | This will delete everything except starting\
    \ from 2nd till 5th line. |\n| `‘1~3d’` | This deletes the first line, steps over\
    \ the next three lines, and then deletes the fourth line. Sed continues applying\
    \ this pattern until the end of the file. |\n| `‘2~2d’` | This tells sed to delete\
    \ the second line, step over the next line, delete the next line, and repeat until\
    \ the end of the file is reached. |\n| `‘4,10p’` | Lines starting from 4th till\
