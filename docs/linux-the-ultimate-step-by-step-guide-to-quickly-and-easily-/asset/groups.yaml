    \ $0 and so on, $0 gets scrapped because it has nowhere to go, this can be useful\
    \ to process all the arguments using a loop, using one variable to reference the\
    \ first argument and shifting until you have exhausted the arguments list.\n\n\
    As well as the command line arguments there are some special built-in variables:\n\
    \n- $# represents the parameter count. Useful for controlling loop constructs\
    \ that need to process each parameter.\n- $@ expands to all the parameters separated\
    \ by spaces. Useful for passing all the parameters to some other function or program.\n\
    - $- expands to the flags(options) the shell was invoked with. Useful for controlling\
    \ program flow based on the flags set.\n- $$ expands to the process id of the\
    \ shell invoked to run the script. Useful for creating unique temporary filenames\
    \ relative to this instantiation of the script.\n\nNote: The command line arguments\
    \ will be referred to as parameters from now on, this is because SH also allows\
    \ the definition of functions which can take parameters and when called the $n\
    \ family will be redefined, hence these variables are always parameters, its just\
    \ that in the case of the parent script the parameters are passed via the command\
    \ line. One exception is $0 which is always set to the name of the parent script\
    \ regardless of whether it is inside a function or not.\n\n# Command Substitution\n\
    \nIn the words of the SH manual “Command substitution allows the output of a command\
    \ to be substituted in place of the command name itself\". There are two ways\
    \ this can be done. The first is to enclose the command like this:\n\n```\n$(command)\n\
    ```\n\nThe second is to enclose the command in back quotes like this:\n\n```\n\
    `command`\n```\n\nThe command will be executed in a sub-shell environment and\
    \ the standard output of the shell will replace the command substitution when\
    \ the command finishes.\n\n# Arithmetic Expansion\n\nArithmetic expansion is also\
    \ allowed and comes in the form:\n\n```\n$(expression)\n```\n\nThe value of the\
    \ expression will replace the substitution. Eg:\n\n```sh\n#!/bin/sh\necho $(1\
    \ + 3 + 4)\n```\n\nWill echo “8” to stdout.\n\n# Control Constructs\n\nThe flow\
    \ of control within SH scripts is done via four main constructs; if... then...\
    \ elif..., else..., do..., while..., for... and case....\n\n## If.. Then.. Elif..\
    \ Else\n\nThis construct takes the following generic form; the parts enclosed\
    \ within ([]) and () are optional:\n\n```sh\nif list\nthen list\n[elif list\n\
    then list] ...\n[else list]\nfi\n```\n\nWhen a Unix command exits it exits with\
    \ what is known as an exit status, this indicates to anyone who wants to know\
    \ the degree of success a command, usually when a command executes without error\
    \ it terminates with an exit status of zero. An exit status of some other value\
    \ would indicate that an error has occurred, the details of which are specific\
    \ to the command. The commands’ man pages detail the exit status messages.\n\n\
    A list is defined in the SH as “a sequence of zero or more commands separated\
    \ by newlines, semicolons, or ampersands, and optionally terminated by one of\
    \ these three characters.” Hence in the generic definition of the if above the\
    \ list will determine which of the execution paths the script takes. For example,\
    \ there is a command called test on UNIX, which evaluates an expression and if\
    \ it evaluates true will return zero and will return one otherwise, this is how\
    \ we can test conditions in the list part(s) of the if construct because test\
    \ is a command.\n\nWe do not actually have to type the test command directly into\
    \ the list to use it; it can be implied by encasing the test case within (! and\
    \ (!) characters, as illustrated by the following (silly) example:\n\n```sh\n\
    #!/bin/sh\nif [ \"$1\" = \"1\" ]\nthen\n\techo \"The first choice is nice\"\n\
    elif [ \"$1\" = \"2\" ]\nthen\n\techo \"The second choice is just as nice\"\n\
    elif [ \"$1\" = \"3\" ]\nthen\n\techo \"The third choice is excellent\"\nelse\n\
    \techo \"I see you were wise enough not to choose\"\n\techo \"You win\"\nfi\n\
    ```\n\nWhat this example does is compare the first parameter (command line argument\
    \ in this case) with the strings “1”, “2” and “3” using tests' (=) test which\
    \ compares two strings for equality, if any of them match it prints out the corresponding\
    \ message. If none of them match it prints out the final case. OK the example\
    \ is silly and actually flawed (the user still wins even if they type in (4) or\
    \ something) but it illustrates how the if statement works.\n\nNotice that there\
    \ are spaces between (if) and ([], ([) and the test and the test and (), these\
    \ spaces must be present otherwise the shell will complain. There must also be\
    \ spaces between the operator and operands of the test otherwise it will not work\
    \ properly. Notice how it starts with (if) and ends with (fi), also, notice how\
    \ (then) is on a separate line to the test above it and that (else) does not require\
    \ a (then) statement. You must construct this construct exactly like this for\
    \ it to work properly.\n\nIt is also possible to integrate logical AND and OR\
    \ into the testing, by using two tests separated by either “&&” or “||” respectively.\
    \ For example, we could replace the third test case in the example above with:\n\
    \n```sh\nelif [ \"$1\" = \"3\" ] || [ \"$1\" = \"4\" ]\nthen echo \"The third\
    \ choice is excellent\"\n```\n\nThe script would print out “The third choice is\
    \ excellent” if the first parameter was either “3” OR “4”. To illustrate the use\
    \ of “&&” we could replace the third test case with:\n\n```sh\nelif [ \"$1\" =\
    \ \"3\" ] && [ \"$2\" = \"4\" ]\nthen echo \"The third choice is excellent\"\n\
    ```\n\nThe script would print out “The third choice is excellent” if and only\
    \ if the first parameter was “3” AND the second parameter was “4”.\n\n“&&” and\
    \ “||” are both lazily evaluating which means that in the case of “&&”, if the\
    \ first test fails it won’t bother evaluating the second because the list will\
    \ only be true if they BOTHER pass and since one has already failed there is no\
    \ point wasting time evaluating the second. In the case of “||” if the first test\
    \ passes it won’t bother evaluating the second test because we only need ONE of\
    \ the tests to pass for the whole list to pass. See the test man page for the\
    \ list of tests possible (other than the string equality test mentioned here).\n\
    \n## Do...While\n\nThe Do...While takes the following generic form:\n\n```sh\n\
    while list\ndo list\ndone\n```\n\nIn the words of the SH manual “The two lists\
    \ are executed repeatedly while the exit status of the first list is zero.\" There\
    \ is a variation on this that uses `until` in place of `while` which executes\
    \ until the exit status of the first list is zero. Here is an example use of the\
    \ `while` statement:\n\n```sh\n#!/bin/sh\ncount=$1 # Initialise count to first\
    \ parameter\nwhile [ $count -gt 0 ] # while count is greater than 0 do\ndo\n\t\
    echo $count seconds till supper time!\n\tcount=$(expr $count -1) # decrement count\
    \ by 1\n\tsleep 1 # sleep for a second using the Unix sleep command\ndone\necho\
    \ Supper time!! , YEAH!!! # were finished\n```\n\nIf called from the command line\
    \ with an argument of 4 this script will output:\n\n```text\n4 seconds till supper\
    \ time!\n3 seconds till supper time!\n2 seconds till supper time!\n1 seconds till\
    \ supper time!\nSupper time!! , YEAH!!\n```\n\nYou can see that this time we have\
    \ used the `-gt` of the `test` command implicitly called by ‘[’ and ‘]’, which\
    \ stands for greater than. Pay careful attention to the formatting and spacing.\n\
    \n## For\n\nThe syntax of the `for` command is:\n\n```sh\nfor variable in word\
    \ ...\ndo list\ndone\n```\n\nThe SH manual states *\"The words are expanded, and\
    \ then the list is executed repeatedly with the variable set to each word in turn.\"\
    * A word is essentially some other variable that contains a list of values of\
    \ some sort, the `for` construct assigns each of the values in the word to variable\
    \ and then variable can be used within the body of the construct, upon completion\
    \ of the body variable will be assigned the next value in word until there are\
    \ no more values in word. This example should\n"
  mdcn: "\n# 命令行参数\n\n命令行参数在脚本中被视为特殊变量，我称它们为变量是因为它们可以通过 `shift` 命令进行修改。命令行参数的枚举方式如下：$0,\
    \ $1, $2, $3, $4, $5, $6, $7, $8 和 $9。$0 比较特殊，它对应脚本自身的名称。$1 是第一个参数，$2 是第二个参数，依此类推。若要引用第九个参数之后的参数，必须将数字放在括号中，形式如\
    \ ${nn}。你可以使用 `shift` 命令将参数向左移动一个位置，从而使 $2 变为 $1，$1 变为 $0，以此类推，$0 会被丢弃，因为它无处可去。这在通过循环处理所有参数时非常有用：使用一个变量引用第一个参数，并不断执行移位操作，直到参数列表被处理完毕。\n\
    \n除了命令行参数外，还有一些特殊的内置变量：\n\n- $# 表示参数数量。适用于控制需要处理每个参数的循环结构。\n- $@ 展开为所有参数，参数之间以空格分隔。适用于将所有参数传递给其他函数或程序。\n\
    - $- 展开为启动 shell 时使用的标志（选项）。适用于根据设置的标志控制程序流程。\n- $$ 展开为运行脚本的 shell 进程 ID。适用于基于此脚本实例创建唯一的临时文件名。\n\
    \n注意：从现在开始，命令行参数将被称为“参数”。这是因为 SH 也允许定义可以接收参数的函数，当函数被调用时，$n 系列变量会被重新定义，因此这些变量始终代表参数，只是在父脚本的情况下，参数是通过命令行传入的。有一个例外是\
    \ $0，无论是否位于函数内部，它始终设置为父脚本的名称。\n\n# 命令替换\n\n用 SH 手册中的话说：“命令替换允许将命令的输出替换命令名称本身”。实现这一功能有两种方式。第一种是将命令包裹起来，形式如下：\n\
    \n```\n$(command)\n```\n\n第二种是使用反引号将命令包裹起来，形式如下：\n\n```\n`command`\n```\n\n该命令将在子\
    \ shell 环境中执行，当命令完成时，shell 的标准输出将替换该命令替换部分。\n\n# 算术扩展\n\n也允许进行算术扩展，其形式为：\n\n```\n\
    $(expression)\n```\n\n表达式的值将替换该扩展部分。例如：\n\n```sh\n#!/bin/sh\necho $(1 + 3 + 4)\n\
    ```\n\n这会将 “8” 输出到标准输出。\n\n# 控制结构\n\nSH 脚本中的控制流通过四种主要结构实现：if... then... elif...,\
    \ else..., do..., while...、for... 以及 case...。\n\n## If... Then... Elif... Else\n\
    \n该结构采用以下通用形式；包含在 ([ ]) 和 () 中的部分是可选的：\n\n```sh\nif list\nthen list\n[elif list\n\
    then list] ...\n[else list]\nfi\n```\n\n当 Unix 命令退出时，它会以一个被称为退出状态的值结束，这向需要了解该命令成功程度的人表明情况。通常，当命令无错误执行时，它以零退出状态终止。其他值的退出状态表示发生了错误，具体细节取决于该命令。命令的手册页详细说明了退出状态消息。\n\
    \n在 SH 中，列表被定义为“由换行符、分号或 & 符号分隔的零个或多个命令序列，并可选项地以这三个字符之一结尾”。因此，在上述 if 语句的通用定义中，列表将决定脚本采取哪条执行路径。例如，Unix\
    \ 中有一个名为 `test` 的命令，它评估一个表达式，如果评估结果为真则返回零，否则返回一。这就是我们如何在 if 结构的列表部分测试条件的原因，因为\
    \ test 是一个命令。\n\n实际上，我们不需要在列表中直接输入 test 命令来使用它；可以通过将测试用例封装在 `(` 和 `)` 字符中来隐式实现，如下面（这个有些傻的）示例所示：\n\
    \n```sh\n#!/bin/sh\nif [ \"$1\" = \"1\" ]\nthen\n\techo \"The first choice is\
    \ nice\"\nelif [ \"$1\" = \"2\" ]\nthen\n\techo \"The second choice is just as\
    \ nice\"\nelif [ \"$1\" = \"3\" ]\nthen\n\techo \"The third choice is excellent\"\
    \nelse\n\techo \"I see you were wise enough not to choose\"\n\techo \"You win\"\
    \nfi\n```\n\n这个示例的作用是使用 `test` 的 `=` 测试（比较两个字符串是否相等）将第一个参数（在此情况下是命令行参数）与字符串 “1”、“2”\
    \ 和 “3” 进行比较，如果其中任何一个匹配，则打印出相应的消息。如果都不匹配，则打印出最后一种情况的消息。好吧，这个示例有些傻气且存在缺陷（即使用户输入\
    \ 4 或其他值，他们仍然获胜），但它说明了 if 语句是如何工作的。\n\n请注意 (if) 和 ([ ], ([) 以及测试表达式与 () 之间存在空格，这些空格必须存在，否则\
    \ shell 会报错。测试的操作符和操作数之间也必须有空格，否则无法正常工作。请注意它以 (if) 开始，以 (fi) 结束；另外，请注意 (then)\
    \ 位于上一行测试表达式的单独一行上，并且 (else) 不需要 (then) 语句。你必须严格按照这种方式构建该结构才能使其正常工作。\n\n还可以将逻辑\
    \ AND（与）和 OR（或）整合到测试中，方法是使用由 “&&” 或 “||” 分隔的两个测试。例如，我们可以用以下内容替换上面示例中的第三个测试用例：\n\
    \n```sh\nelif [ \"$1\" = \"3\" ] || [ \"$1\" = \"4\" ]\nthen echo \"The third\
    \ choice is excellent\"\n```\n\n如果第一个参数是 “3” 或 “4”，脚本将打印出 “The third choice is\
    \ excellent”。为了说明 “&&” 的用法，我们可以将第三个测试用例替换为：\n\n```sh\nelif [ \"$1\" = \"3\" ]\
    \ && [ \"$2\" = \"4\" ]\nthen echo \"The third choice is excellent\"\n```\n\n\
    当且仅当第一个参数是 “3” 且第二个参数是 “4” 时，脚本才会打印出 “The third choice is excellent”。\n\n“&&”\
    \ 和 “||” 都是惰性求值，这意味着在 “&&” 的情况下，如果第一个测试失败，它就不会费心评估第二个测试，因为列表只有在它们 *都* 通过时才为真，既然其中一个已经失败了，就没有必要浪费时间评估第二个。在\
    \ “||” 的情况下，如果第一个测试通过，它就不会费心评估第二个测试，因为整个列表通过只需要其中 *一个* 测试通过即可。请参阅 test 的手册页以了解可能的测试列表（除这里提到的字符串相等测试外）。\n\
    \n## Do...While\n\nDo...While 采用以下通用形式：\n\n```sh\nwhile list\ndo list\ndone\n\
    ```\n\n用 SH 手册中的话说：“只要第一个列表的退出状态为零，这两个列表就会反复执行。” 有一个变体使用 `until` 替代 `while`，它执行直到第一个列表的退出状态为零。以下是使用\
    \ `while` 语句的一个示例：\n\n```sh\n#!/bin/sh\ncount=$1 # 初始化 count 为第一个参数\nwhile [ $count\
    \ -gt 0 ] # 当 count 大于 0 时执行\ndo\n\techo $count seconds till supper time!\n\t\
    count=$(expr $count -1) # count 减 1\n\tsleep 1 # 使用 Unix sleep 命令休眠一秒\ndone\n\
    echo Supper time!! , YEAH!!! # 完成了\n```\n\n如果从命令行调用该脚本并传入参数 4，该脚本将输出：\n\n```text\n\
    4 seconds till supper time!\n3 seconds till supper time!\n2 seconds till supper\
    \ time!\n1 seconds till supper time!\nSupper time!! , YEAH!!\n```\n\n你可以看到，这次我们使用了由\
    \ ‘[’ 和 ‘]’ 隐式调用的 `test` 命令的 `-gt` 选项，它代表“大于”。请仔细注意格式和空格。\n\n## For\n\n`for` 命令的语法如下：\n\
    \n```sh\nfor variable in word ...\ndo list\ndone\n```\n\nSH 手册指出：*\"单词会被展开，然后列表会反复执行，variable\
    \ 依次设置为 word 中的每个单词。\"* 单词本质上是包含某种值列表的其他变量，`for` 结构将 word 中的每个值分配给 variable，然后\
    \ variable 可以在结构体内部使用，当结构体执行完毕后，variable 将被赋值为 word 中的下一个值，直到 word 中不再有值。这个例子应该\n"
