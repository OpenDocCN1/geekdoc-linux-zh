    \   ```\n\n3. 禁用 nounset。\n   \n   ```bash\n   set +u\n   \n   或者\n   ```\n\n\
    4. 在一个植入的 Shell 中执行 `echo /var` 和 `ls`。\n\n   ```bash\n   echo $(cd /var;ls)\n\
    \   ```\n   \n   `echo` 命令用于展示 `ls` 命令的后果。省略将使 Shell 将第一个文档作为命令执行。\n\n5. 在一个植入的\
    \ Shell 中创建变量 `embvar` 并 `echo` 它。该变量存在于你当前的 Shell 中吗？\n\n   ```bash\n   echo\
    \ $(embvar=emb;echo $embvar); echo $embvar #最后一个 echo 无效\n   ```\n   \n   `$embvar`\
    \ 不存在于你当前的 Shell 中\n\n6. 解释 “`set -x`” 的作用。这有用吗？\n\n   它显示 Shell 开发过程以便调查你的命令。\n\
    \n（可选）\n\n7. 根据附带的截图，向命令行添加四个字符，使汇总结果为 FirstMiddleLast。\n\n   ```bash\n   [paul@RHEL4b\
    \ ~]$ echo First; echo Middle; echo Last\n   echo -n First; echo -n Middle; echo\
    \ Last\n   ```\n   *(注：OCR 中有 \"reverberate\" 和 \"resound\"。已更正为 \"echo\"。解决方案添加了\
    \ \"-n\" 以防止换行。)*\n\n8. 在一个植入的 Shell 中使用 “`which`” 命令显示 passwd 命令的长列表（`ls -l`）。\n\
    \n   ```bash\n   ls -l $(which passwd)\n   ```\n\n几乎所有现代 Shell 都允许用户在启用时搜索命令历史。History\
    \ 命令可以显示带有行号的历史列表，以 * 标记的表示已被用户修改。\n\n"
