    或 `X100-12` 设备。

    - `-Z, --ditroff`：groff 将运行 troff，然后使用适当的后处理器产生适合所选设备的输出。如果 groff -mandoc 是 groff，则此选项会传递给
    groff 并抑制后处理器的使用。它隐含 `-t`。


    ## 章节号


    手册的章节号列于下方。阅读文档时，如果你看到命令名称后跟着括号内的数字，该数字指的是这些章节中的一个。例如，man 是第 1 章中找到的 man 的文档。某些命令可能在一个以上的章节中有文档，因此命令名称后的数字可能会引导你到正确的章节以查找特定类型的信息。


    章节号及其涵盖的主题如下：


    | 章节号 | 主题 |

    | :--- | :--- |

    | **1** | 可执行程序或 shell 命令 |

    | **2** | 系统调用（内核提供的函数） |

    | **3** | 库调用（程序库内的函数） |

    | **4** | 特殊文件（通常位于 /dev） |

    | **5** | 文件格式和约定，例如 /etc/passwd |

    | **6** | 游戏 |

    | **7** | 杂项（包括宏包和约定），例如 man、groff |

    | **8** | 系统管理命令（通常仅限 root 使用） |

    | **9** | 内核例程 [非标准] |


    ## 退出状态


    终止时，**man** 将返回以下退出状态之一：


    - **0** 在程序成功执行时返回。

    - **1** 如果发生使用、语法或配置文件错误则返回。

    - **2** 如果发生操作错误则返回。

    - **3** 如果子进程返回非零退出状态则返回。

    - **16** 如果搜索的一个或多个页面、文件或关键字不存在或未匹配则返回。


    ## 环境变量


    **man** 使用以下环境变量：


    | 变量 | 描述 |

    | :--- | :--- |

    | `MANPATH` | 如果设置了 `$MANPATH`，其值将**用作搜索手册页的路径**。 |

    | `MANOFFOPT` | `$MANOFFOPT` 的内容会在 **man** 调用格式化工具（*nroff*、*troff* 或 **groff**）时每次都添加到命令行中。
    |

    | `MANOFFSEQ` | 如果设置了 `$MANOFFSEQ`，其值将用于确定每个手册页经过的预处理器集合。默认预处理器列表因系统而异。 |

    | `MANSECT` | 如果设置了 `$MANSECT`，其值是一个冒号分隔的章节列表，用于确定搜索哪些 man 章节以及搜索顺序。 |

    | `MANPAGER`、`PAGER` | 如果设置了 `$MANPAGER` 或 `$PAGER`（$MANPAGER 优先使用），其值将用作显示手册页的程序名称。默认情况下，使用
    `pager -s`。该值可以是简单的命令名称或带有参数的命令，并且可以使用 shell 引用（反斜杠、单引号或双引号）。它不能使用管道连接多个命令；如果需要那样做，请使用包装脚本，该脚本可以采用要显示的文件作为参数或**标准输入**。
    |

    | `MANLESS` | 如果设置了 `$MANLESS`，man 将不会执行其通常的处理来为 `less` 分页器设置提示字符串。相反，`$MANLESS`
    的值将被逐字复制到 `$LESS` 中。例如，如果你希望无条件地将提示字符串设置为“my prompt string”，请将 `$MANLESS` 设置为
    ‘-Psmy prompt string’。 |


    '
