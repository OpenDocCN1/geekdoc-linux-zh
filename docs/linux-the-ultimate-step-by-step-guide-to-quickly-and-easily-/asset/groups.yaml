    membership, use `{print $4, $8}` instead of the “print” command option of awk
    listed above.


    Here the “sort” command options “-nr” specify that the output from “awk” be sorted
    in reverse numeric order, i.e., from largest to smallest.


    The preceding command is somewhat complex and it is easy to make a mistake in
    entering it. If this were a command you would use frequently, we could include
