    which greatly contributed to the distribution’s rapid rise in popularity and its
    overtaking of Slackware Linux as the most widely-used Linux distribution in the
    world. In later years, Red Hat standardized on a regular, 6-month release schedule.
    In 2003, just after the release of Red Hat Linux 9, the company introduced some
    radical changes to its product line-up. It retained the Red Hat trademark for
    its commercial products, notably Red Hat Enterprise Linux, and introduced Fedora
    Core (later renamed to Fedora), a Red Hat sponsored, but community-oriented distribution
    designed for the “Linux hobbyist”. After the initial criticism of the changes,
    the Linux community accepted the “new” distribution as the logical continuation
    of Red Hat Linux. A few quality releases was all it took for Fedora to regain
    its former status as one of the best-loved operating systems on the market. At
    the same time, Red Hat quickly became the biggest and most profitable Linux company
    in the world, with an innovative product line-up, excellent customer support,
    and other popular initiatives, such as its Red Hat Certified Engineer (RHCE) certification
    program. Although Fedora’s direction is still largely controlled by Red Hat, Inc.
    and the product is sometimes seen — rightly or wrongly — as a test bed for Red
    Hat Enterprise Linux, there is no denying that Fedora is one of the most innovative
    distributions available today. Its contributions to the Linux kernel, glibc and
    GCC are well-known and its more recent integration of SELinux functionality, virtualization
    technologies, system service manager, cutting-edge journaled file systems, and
    other enterprise-level features are much appreciated by the company’s customers.
    On a negative side, Fedora still lacks a clear desktop-oriented strategy that
    would make the product easier to use for those beyond the “Linux hobbyist” target.


    +   Pros: Highly innovative; outstanding security features; a large number of
    supported packages; strict adherence to the free software philosophy; availability
    of live CDs featuring many popular desktop environments.


    +   Cons: Fedora’s priorities tend to lean towards enterprise features, rather
    than desktop usability; some bleeding edge features, such as early switch to KDE
    4 and GNOME 3, occasionally alienate desktop users.


