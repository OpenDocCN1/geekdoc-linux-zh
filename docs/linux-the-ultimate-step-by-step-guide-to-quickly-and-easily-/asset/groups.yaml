    ## pg 和 more 命令


    通常，较长的输出会在屏幕上快速闪过，但如果将文本通过 more 或 pg 作为过滤器运行，显示将在每屏文本后停止。假设你有一个很长的目录列表。为了使排序后的列表更容易阅读，将输出通过
    more 进行管道处理，如下所示 –


    $ ls -l | grep "Aug" | sort +4n | more

