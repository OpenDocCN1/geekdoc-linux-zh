    \ address.\n\n# Setup your hosts file\n\nNow your server is configured lets add\
    \ the hostname to your hosts file!\n\nSimply add the following entry into your\
    \ hosts file. This should be done on your host machine – be it Windows or Mac\
    \ OS X or Linux, not the VM itself.\n\n```\n192.168.56.101 debian-vm\n```\n\n\
    Keep in mind that for every domain you setup on your VM, you will need to add\
    \ it to your hosts file.\n\n# Log in via SSH!\n\nNow that you have setup the network\
    \ adapter in Virtual Box, and added the correct settings to the VM interfaces\
    \ file, you're ready to actually SSH into your server and begin installing everything!\
    \ You may be wondering why you need to SSH and not simply use the VM window. The\
    \ reason I do it this way is that the server does not support copy/paste! There’s\
    \ a lot of typing ahead and having the ability to simply copy/paste into your\
    \ terminal is going to speed things up quite a bit!\n\nFor SSH on Windows, I use\
    \ KiTTY. It's an SSH client that adds some nifty features to PuTTY. There is also\
    \ Poderosa. For Mac/Linux just use the terminal! Since you’ve already added the\
    \ correct lines to your hosts file, you can set the address to connect to as **debian-vm**\
    \ (or whatever you chose during setup). Make sure to actually start the VM from\
    \ VirtualBox before attempting to login. Just start it, there is no need to login\
    \ from the VirtualBox server window.\n\n### Installing the basics\n\nFirst things\
    \ first, we’re going to install the basic necessities, like make, curl, **wget**,\
    \ as well as the Apache Server, Mercurial, Git and Subversion:\n\n```\n$ sudo\
    \ apt-get install gcc make wget cron curl libxml2 libxml2-dev libzip-dev \\\n\
    \            libssl2-dev curl libcurl4-openssl-dev libcurl3-gnutls libpcre2-dev\
    \ \\\n            libpkg++2-dev libpkg++1-0 libssl2-dev libncrypt-dev libcrypto4\
    \ libncrlib2-dev \\\n            libxml2-dev apach2 apach2-mpm-prefork apach2-prefork-dev\
    \ apach2-utils \\\n            apach2.2-common git mercurial subversion libaptcurl3\
    \ samba samba-common\n```\n\nEdit the new Apache2 config file, `$ sudo nano /etc/apache2/httpd.conf`\
    \ and add\n\n```\nServerName localhost\n```\n\nYou now have the Apache server\
    \ up and running! Just point your browser to http://debian-vm and behold the magic.\n\
    \nNow lets enable Apache's `ModRewrite` module:\n\n```\n$ sudo a2enmod rewrite\n\
    ```\n\n### Installing MySQL\n\nWe will be installing MySQL 5.1 from repo, as this\
    \ is the easiest way and works fairly well.\n\n```\n$ sudo apt-get install mysql-client-5.1\
    \ mysql-server-5.1\n```\n\nOn the screens asking for a MySQL password, leave it\
    \ blank and hit `Enter`. Since this is only for a local server there is no point\
    \ in setting up a password. Do NOT use a blank password in production environments.\n\
    \n### Setting up MySQL\n\nWe need to update the IP address that MySQL will listen\
    \ to for connections by editing the my.cnf file.\n\n```\n$ sudo nano /etc/mysql/my.cnf\n\
    ```\n\nDo a search for **bind-address** (CTRL + W) and change the setting to:\n\
    \n```\nbind-address    = 127.0.0.1\nbind-address    = 192.168.56.101\n```\n\n\
    Now let's grant root MySQL user all permissions:\n\n```\n$ mysql -u root\nGRANT\
    \ ALL ON *.* TO 'root'@'%' ;\nexit;\n```\n\nand restart the service:\n\n```\n\
    $ sudo service mysql restart\n```\n\n## Chapter Five: INSTALLING CENTOS 7\n\n\
    This is a community-supported distribution derived from sources freely provided\
    \ to the public by Red Hat for Red Hat Enterprise Linux (RHEL). As such, CentOS\
    \ Linux aims to be functionally and compatible with RHEL. The CentOS Project mainly\
    \ changes packages to remove upstream vendor branding and artwork. CentOS Linux\
    \ is free and free to redistribute. Each CentOS version is maintained for up to\
    \ 10 years (by means of security updates — the duration of the support interval\
    \ by Red Hat has varied over time with respect to Sources released). A new CentOS\
    \ version is released approximately every 2 years and each CentOS version is periodically\
    \ updated (roughly every 6 months) to support newer hardware. This results in\
    \ a secure, low-maintenance, reliable, predictable and reproducible Linux environment.\n\
    \n### Installation of CentOS 7\n\nFinally, the much-awaited CentOS 7 is out. CentOS\
    \ (Community Enterprise Operating System) are forked from Red Hat Linux, a Linux\
    \ Distro fine tuned for servers. You will learn how to install Centos 7 in a few\
    \ easy steps.\n\n### Step 1: Download the ISO Image\n\nTo get a copy of CentOS\
    \ 7 download from the link below:\n\nhttp://mirror.centos.org/centos/7/\n\nCentOS\
    \ 7 is only available for 64-bit platforms; currently there is no 32-bit ISO image.\
    \ This is primarily due to the fact that most production servers are 64-bit.\n\
    \n### Step 2: Make a bootable Drive\n\nAfter you download the ISO image, make\
    \ a bootable USB drive using Unetbootin. Alternatively, you can burn a DVD using\
    \ Brasero or your favorite CD/DVD burning software.\n\n### Step 3: Begin Installation\n\
    \nTo begin installation, click on the Install to Hard Drive icon on the desktop.\n"
  mdcn: "\n## 更新你的系统\n\n更新你的系统：\n\n```\n[root] $ apt-get update && apt-get dist-upgrade\n\
    ```\n\n## 安装客户机增强功能所需的依赖项\n\n```\n[root] $ apt-get install build-essential module-assistant\n\
    [root] $ m-a prepare\n```\n\n插入客户机增强功能 CD 镜像（主机 + D 键），前往挂载驱动器的根目录并执行程序：\n\n```\n\
    [root] $ sh ./VBoxLinuxAdditions.run\n```\n\n# 自定义你的系统\n\n... 以获得看起来更现代的外观。\n\n\
    ![](img/95e14ba64977353b42ea3103515e63c3_31_0.png)\n\n# 终端\n\n终端是 Linux 系统中最有用的工具之一。花些时间让它看起来更舒适：启用提示符颜色，在\
    \ `.bashrc` 中设置别名，并在 root bash 中启用颜色和自动补全功能。\n\n```\n$ nano ~/.bashrc\n```\n\n\
    取消注释“force_colored_prompt=yes”这一行\n\n```\n[root] $ nano .bashrc\n```\n\n```\n\
    # 设置一个花哨的红色提示符\nPS1=?'${debian_chroot:+($debian_chroot)}\\{33[01;31m\\]u@h\\{33[00m\\\
    ]:\\\n[33[01;34m\\]w\\{33[00m\\] $ ' \n# 启用自动补全\nif\n[ -f /etc/bash_completion\
    \ ] && ! shopt -oq posix;\nthen . /etc/bash_completion\nfi\n```\n\n# 字体\n\n在*外观面板*中启用字体提示，以获得系统最佳的字体渲染效果。设置\
    \ > 外观 > 字体 > 启用抗锯齿 + 轻微提示 + 子像素排序 RGB。在 Jessie 中这应该就足够了，无需创建 fonts.conf 文件或安装\
    \ Infinality 引擎。\n\n![](img/95e14ba64977353b42ea3103515e63c3_32_0.png)\n\n# 主题和图标\n\
    \nGTK 主题、窗口装饰和图标集是自定义桌面的最重要元素。首先安装一些某些主题所需的互补 gtk 引擎：\n\n```\n[root] $ apt-get\
    \ install gtk2-engines-murrine gtk2-engines-pixbuf dmz-cursor-theme\n```\n\n#\
    \ 安装 sudo\n\nDebian 默认不包含 sudo，这是一个实用的小工具，可以暂时授予你 root 权限。\n\n```\n$ su\n$ apt-get\
    \ install sudo\n$ nano /etc/sudoers\n```\n\n在 `root ALL=(ALL) ALL:` 下方添加\n\n```\n\
    USERNAME ALL=(ALL) NOPASSWD: ALL\n```\n\n将 **USERNAME** 替换为你的用户名。**NOPASSWD**\
    \ 标志移除了每次使用 **sudo** 时输入密码的要求。在生产服务器上这样做*不*是好主意！\n\n重启你的机器以使更改生效：`$ reboot`\n\n\
    从现在开始，所有需要 root 权限的操作都应以 **sudo** 前缀运行，而无需每次输入密码。\n\n## 设置网络\n\n使用你在安装期间选择的用户名和密码登录到你的新虚拟机。我们将为你的虚拟机添加一个网络连接，这将使你能够轻松通过\
    \ SSH 登录到服务器。\n\n```\n$ sudo nano /etc/network/interfaces\n```\n\n在文件末尾添加以下内容：\n\
    \n```\nauto eth0\niface eth0 inet static\naddress 192.168.56.101\nnetmask 255.255.255.0\n\
    ```\n\n按 **CTRL + X**，然后按 Y 和 **ENTER** 保存更改。\n\n关闭虚拟机。\n\n```\n$ sudo shutdown\
    \ -h now\n```\n\n在主 Virtual Box 界面中，点击*设置*按钮。然后从左侧列表中选择**网络**，从选项卡中选择*适配器 2*，勾选‘启用网络适配器’，从下拉菜单中选择‘仅主机适配器’，然后点击**确定**。\n\
    \n![](img/95e14ba64977353b42ea3103515e63c3_34_0.png)\n\n我们做的是配置你的虚拟机使用静态 IP 地址。这是个好主意，因为它允许我们始终使用单个\
    \ IP 地址/主机名访问我们的虚拟机，而无需每次启动时都要查找它。\n\n默认情况下，Virtual Box 在你的网络中使用 **192.168.56.1**\
    \ 地址，并为你的所有虚拟机分配 **192.168.56.1xx** 范围内的 IP 地址。\n\n通过编辑 `/etc/network/interfaces`，我们告诉操作系统应该在该地址处期望有一个可用的网络资源。\n\
    \n# 设置你的 hosts 文件\n\n现在你的服务器已配置好，让我们将主机名添加到你的 hosts 文件中！\n\n只需在 hosts 文件中添加以下条目。这应在你的主机机器上完成\
    \ – 无论是 Windows 还是 Mac OS X 或 Linux，而不是虚拟机本身。\n\n```\n192.168.56.101 debian-vm\n\
    ```\n\n请记住，对于你在虚拟机上设置的每个域，你都需要将其添加到你的 hosts 文件中。\n\n# 通过 SSH 登录！\n\n现在你已经在 Virtual\
    \ Box 中设置了网络适配器，并将正确的设置添加到虚拟机 interfaces 文件中，你准备好实际通过 SSH 登录到你的服务器并开始安装所有东西了！你可能在想为什么需要\
    \ SSH 而不只是使用虚拟机窗口。我这样做的理由是服务器不支持复制/粘贴！后面有很多打字，能够直接在终端中复制/粘贴会大大加快进度！\n\n在 Windows\
    \ 上进行 SSH，我使用 KiTTY。它是一个为 PuTTY 添加了一些实用功能的 SSH 客户端。还有 Poderosa。对于 Mac/Linux，只需使用终端！既然你已经在\
    \ hosts 文件中添加了正确的行，你可以将连接地址设置为 **debian-vm**（或者你在设置时选择的任何名称）。请确保在实际尝试登录之前先从 VirtualBox\
    \ 启动虚拟机。只需启动它即可，无需从 VirtualBox 服务器窗口登录。\n\n### 安装基础组件\n\n首先，我们要安装基本的必需品，如 make、curl、**wget**，以及\
    \ Apache 服务器、Mercurial、Git 和 Subversion：\n\n```\n$ sudo apt-get install gcc make\
    \ wget cron curl libxml2 libxml2-dev libzip-dev \\\n            libssl2-dev curl\
    \ libcurl4-openssl-dev libcurl3-gnutls libpcre2-dev \\\n            libpkg++2-dev\
    \ libpkg++1-0 libssl2-dev libncrypt-dev libcrypto4 libncrlib2-dev \\\n       \
    \     libxml2-dev apach2 apach2-mpm-prefork apach2-prefork-dev apach2-utils \\\
    \n            apach2.2-common git mercurial subversion libaptcurl3 samba samba-common\n\
    ```\n\n编辑新的 Apache2 配置文件，`$ sudo nano /etc/apache2/httpd.conf` 并添加\n\n```\nServerName\
    \ localhost\n```\n\n现在你的 Apache 服务器已经启动并运行了！只需将浏览器指向 http://debian-vm 即可见证神奇。\n\
    \n现在让我们启用 Apache 的 `ModRewrite` 模块：\n\n```\n$ sudo a2enmod rewrite\n```\n\n###\
    \ 安装 MySQL\n\n我们将从仓库安装 MySQL 5.1，因为这是最简单且运行良好的方式。\n\n```\n$ sudo apt-get install\
    \ mysql-client-5.1 mysql-server-5.1\n```\n\n在询问 MySQL 密码的界面上，留空并按 `Enter`。因为这仅用于本地服务器，所以设置密码没有意义。切勿在生产环境中使用空白密码。\n\
    \n### 配置 MySQL\n\n我们需要通过编辑 my.cnf 文件来更新 MySQL 监听连接使用的 IP 地址。\n\n```\n$ sudo nano\
    \ /etc/mysql/my.cnf\n```\n\n搜索 **bind-address** (CTRL + W) 并将设置更改为：\n\n```\nbind-address\
    \    = 127.0.0.1\nbind-address    = 192.168.56.101\n```\n\n现在让我们授予 root MySQL\
    \ 用户所有权限：\n\n```\n$ mysql -u root\nGRANT ALL ON *.* TO 'root'@'%' ;\nexit;\n```\n\
    \n并重启服务：\n\n```\n$ sudo service mysql restart\n```\n\n## 第五章：安装 CentOS 7\n\n这是一个由社区支持的发行版，源自\
    \ Red Hat 免费向公众提供的 Red Hat Enterprise Linux (RHEL) 源代码。因此，CentOS Linux 旨在在功能和兼容性上与\
    \ RHEL 保持一致。CentOS 项目主要更改软件包以去除上游供应商的品牌和艺术品。CentOS Linux 是免费的，并且可以自由再分发。每个 CentOS\
    \ 版本都维护长达 10 年（通过安全更新 – 红帽的支持区间时长随时间推移相对于发布的源代码有所变化）。新的 CentOS 版本大约每 2 年发布一次，每个\
    \ CentOS 版本都会定期更新（大约每 6 个月）以支持更新的硬件。这创造了一个安全、低维护、可靠、可预测和可复现的 Linux 环境。\n\n###\
    \ 安装 CentOS 7\n\n终于，期待已久的 CentOS 7 发布了。CentOS（社区企业操作系统）是从 Red Hat Linux 分支而来的，这是一个为服务器精心调整的\
    \ Linux 发行版。你将学习如何在几个简单步骤中安装 Centos 7。\n\n### 步骤 1：下载 ISO 镜像\n\n要获取 CentOS 7 的副本，请从以下链接下载：\n\
    \nhttp://mirror.centos.org/centos/7/\n\nCentOS 7 仅适用于 64 位平台；目前没有 32 位 ISO 镜像。这主要是因为大多数生产服务器都是\
    \ 64 位的。\n\n### 步骤 2：制作可启动驱动器\n\n下载 ISO 镜像后，使用 Unetbootin 制作一个可启动的 USB 驱动器。或者，你可以使用\
    \ Brasero 或你喜欢的 CD/DVD 刻录软件刻录 DVD。\n\n### 步骤 3：开始安装\n\n要开始安装，请单击桌面上的“安装到硬盘”图标。\n\
    \n"
