    all the parameters to some other function or program.

    +       * $- expands to the flags(options) the shell was invoked with. Useful
    for controlling program flow based on the flags set.

    +       * $$ expands to the process id of the shell innovated to run the script.
    Useful for creating unique temporary filenames relative to this instantiation
