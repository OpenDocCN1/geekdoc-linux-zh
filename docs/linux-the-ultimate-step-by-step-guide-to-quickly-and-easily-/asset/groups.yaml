  mdcn: "\n## 第四章：安装 DEBIAN 8\n\n### 什么是 Debian\n\nDebian 是一个全由志愿者组成的组织，致力于开发自由软件并推广自由软件社区的理想信念。Debian\
    \ 项目始于 1993 年，当时 Ian Murdock 向软件开发者发出公开邀请，希望他们为一个基于相对较新的 Linux 内核的完整且连贯的软件发行版做出贡献。最初，这群规模较小但充满热情的爱好者主要由\
    \ **自由软件基金会** 资助，并受到 **GNU** 哲学的影响，经过多年发展，如今已成长为一个拥有约 1026 名 *Debian 开发者* 的组织。\n\
    \n### Debian GNU/Linux\n\nDebian 的哲学、方法论、GNU 工具、Linux 内核以及其他重要的自由软件相结合，构成了一个独特的软件发行版，称为\
    \ Debian GNU/Linux。该发行版由大量的软件 *软件包* 组成。发行版中的每个软件包都包含可执行文件、脚本、文档和配置信息，并有一位 *维护者*\
    \ 主要负责保持软件包的更新、跟踪错误报告以及与软件包上游作者进行沟通。庞大的用户群结合错误跟踪系统，确保了问题能够被迅速发现并修复。Debian 对细节的关注使其能够生成高质量、稳定且可扩展的发行版。安装后的系统可以轻松配置为承担多种角色，从精简的防火墙到科学桌面工作站，再到高端网络服务器。由于在技术上的卓越表现以及对\
    \ Linux 社区需求和预期的深刻承诺，Debian 在高级用户中特别受欢迎。Debian 还向 Linux 引入了一些如今已变得普及的功能。例如，Debian\
    \ 是第一个包含软件包管理系统以便轻松安装和卸载软件的 Linux 发行版。它也是第一个可以通过升级而不需要重新安装即可更新的 Linux 发行版。Debian\
    \ 继续引领 Linux 的发展。其开发过程展示了开源开发模式如何高效地运作——即使是构建和维护完整操作系统这样非常复杂的任务也不例外。\n\nDebian\
    \ 与其他 Linux 发行版最显著的区别在于其软件包管理系统。这些工具使 Debian 系统管理员能够完全控制已安装的软件包，包括安装单个软件包或自动更新整个操作系统的能力。单个软件包还可以被保护以防止被更新。你甚至可以告诉软件包管理系统你自己编译的软件及其满足的依赖项。为了保护系统免受“特洛伊木马”和其他恶意软件的侵害，Debian\
    \ 的服务器会验证上传的软件包来自已注册的 Debian 维护者。Debian 软件包打包者也非常注意以安全的方式配置其软件包。当已发布的软件包中出现安全问题时，修复补丁通常可以很快获得。\n\
    \n### 将 Debian 8 安装为虚拟机\n\n首先，你需要下载并安装 VirtualBox，这是 Oracle 提供的软件，允许你在任何其他操作系统上作为虚拟环境运行任意操作系统。这个过程比双引导安全得多：不需要折腾引导扇区或磁盘分区，一切都是在虚拟环境中创建的。相应的代价是两个操作系统共享你的计算机资源。为了避免任何性能问题，我们将选择一个轻量级但高效的桌面环境。本书将使用\
    \ XFCE Debian 版本，你可以使用下面的链接进行下载：\n\nhttps://www.debian.org/CD/torrent-cd/\n\n\
    XFCE 并不是最新的桌面环境，但它是最强大、最轻量级且最具可定制性的环境之一，同时在使用其经典桌面隐喻时也非常易于上手。想象一下 Windows XP 的改进版，这是开始使用\
    \ Linux 的绝佳方式。\n\n### 创建你的虚拟系统\n\n安装完成后，启动 VirtualBox 并按照以下步骤操作。我们将开始虚拟机配置：\n\n\
    - 新建 > 名称，类型 (debian)，版本 64\n- 常规 > 高级 > 启用剪贴板和拖放\n- 系统 > 检查内存，禁用软驱，检查 CPU 数量\
    \ (2)\n- 显示 > 最大视频内存，启用 3D 加速\n- 存储 > 在“IDE 控制器”下选择你的 Debian ISO\n- 共享文件夹 > 选择在系统之间共享的文件夹。我们稍后会回来讨论此功能。\n\
    \n![](img/95e14ba64977353b42ea3103515e63c3_27_0.png)\n\n![](img/95e14ba64977353b42ea3103515e63c3_27_1.png)\n\
    \n我们现在已准备好运行发行版安装程序。\n\n### 运行 Debian 安装程序\n\n选择你的虚拟机并点击 **“开始”** 图标。Debian 图形安装程序很简单：只需按照步骤操作，当被要求时输入\
    \ root 密码；创建你的用户（姓名、用户名和密码）。一旦到达分区步骤，请选择“引导式，使用整个磁盘，所有在一个分区中”。如果你希望修改交换分区的大小，你可以选择手动分区，或者稍后使用\
    \ Parted（分区工具）进行操作。\n\n代理，第 1 部分：选择你的网络镜像。如果你需要配置代理，请在所需字段中使用以下语法：`http://user:pass@host:port/`。\n\
    \n继续进行安装。一旦完成，你必须选择在哪里安装 Grub（引导加载程序包）：因为这是虚拟机安装，请选择 `/dev/sda`（ata-VBOX_HARDDISK）。如果你是在双引导系统上安装，这会是个棘手的地方，所以好好享受虚拟机的舒适吧！\n\
    \n![](img/95e14ba64977353b42ea3103515e63c3_28_0.png)\n\n![](img/95e14ba64977353b42ea3103515e63c3_28_1.png)\n\
    \n在 VirtualBox 上安装 Debian\n\n### 软件选择\n\n此刻，只有系统的核心被安装。为了根据你的需求调整系统，你可以**选择**安装以下预定义软件集合中的一个或多个。\n\
    \n**选择要安装的软件：**\n\n- ☑ Debian 桌面环境\n  - ☐ GNOME\n  - ☑ K\\*DE\n  - ☐ Cinnamon\n\
    \  - ☐ MATE\n  - ☐ LXDE\n- ☑ Web 服务器\n- ☑ 打印服务器\n- ☐ SSH 服务器\n- ☑ 标准系统工具\n\n![](img/95e14ba64977353b42ea3103515e63c3_29_0.png)\n\
    \n### 在硬盘上安装 GRUB 引导加载程序\n\n你需要通过安装引导设备上的 GRUB 引导加载程序使新安装的系统可引导。通常的做法是将 GRUB 安装在你第一个硬盘的主引导记录（MBO）上。如果你愿意，你可以将\
    \ GRUB 安装到驱动器上的其他位置，或者另一个驱动器，甚至软盘。\n\n**用于安装引导加载程序的设备：**\n\n- **手动输入设备：**\n- ☑\
    \ /dev/sda\n- ☐ /dev/sda 的 MBR\n\n![](img/95e14ba64977353b42ea3103515e63c3_29_1.png)\n\
    \n![](img/95e14ba64977353b42ea3103515e63c3_29_2.png)\n\n*现在重启虚拟机。*\n\n### 首次启动和更新\n\
    \n启动时，Grub 菜单显示出来，保持默认的条目并等待你的系统初始化。在 XFCE 首次启动时，你会被要求选择两种面板设置之一，请选择默认配置。\n\n\
    ![](img/95e14ba64977353b42ea3103515e63c3_30_0.png)\n\n检查你的时间配置。如果错误，请以 root 身份运行\
    \ `dpkg-reconfigure tzdata` 并选择你的国家。\n\n**代理，第 2 部分（如果需要）：** 在安装过程中，你输入了用于 **apt**\
    \ 连接的代理地址（仓库连接）。它已写入文件 `/etc/apt/apt.conf`，并且可以随时修改。我使用 nano 作为命令行文本编辑器，请按需更改。\n\
    \n```\n[root] $ nano /etc/apt/apt.conf\nAcquire::http::Proxy \"http://user:password@proxy.address:port/\"\
    ;\n```\n\n现在为整个系统添加代理设置：\n\n```\n[root] $ nano /etc/environment\nhttp_proxy=http://user:password@proxy.address:port/\n\
    https_proxy=http://user:password@proxy.address:port/\nftp_proxy=http://user:password@proxy.address:port/\n\
    ```\n\n恭喜，你现在是一名合格的 Linux 用户了！现在我们可以更新并安装一些有用的工具，然后修改默认 UI。为了充分利用你的虚拟机，你需要安装一个名为\
    \ **Guest Additions** 的互补 VirtualBox 扩展。为此，需要一些依赖项。\n\n检查你的源，移除 CD 条目，添加 **contrib**\
    \ 和 **non-free** 仓库：\n"
