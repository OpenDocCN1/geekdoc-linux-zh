    \ editor, or later on, when you wish to save your content.\n\nWe can open the\
    \ `file1` file for editing by typing:\n\n```\ncd\nnano file1\n```\n\nThe `nano`\
    \ application will open the file (which is currently blank). The interface looks\
    \ something like this:\n\n```\nGNU nano 2.2.6                   File: file1\n\n\
    \      [ Read 0 lines ]\n^G Get Help   ^O WriteOut   ^R Read File  ^Y Prev Page\
    \  ^K Cut Text   ^C Cur Pos\n^X Exit       ^J Justify    ^W Where Is   ^V Next\
    \ Page  ^U UnCut Text  ^T To Spell\n```\n\nAlong the top, we have the name of\
    \ the application and the name of the file we are editing. In the middle, the\
