    | /.*$/ | 匹配无论内容如何的整行。 |\n| /*/ | 匹配一个或多个空格 |\n| /^$/ | 匹配空行 |\n\n用于演示元字符使用的表达式。\n\
    \n下表显示了一些常用的字符集：\n\n### 字符类关键字\n\n一些特殊关键字通常可用于正则表达式，尤其是使用正则表达式的 GNU 实用程序。这些对于\
