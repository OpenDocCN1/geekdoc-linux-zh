    ```\n```\n\n# Output\n\n```\n$ ./test.sh\nHello World Zara Ali\n$ \n```\n\n# Returning\
    \ Values from Functions\n\nIf you execute an exit command from inside a function,\
    \ its effect is not only to terminate execution of the function but also of the\
    \ shell program that called the function. If you instead want to just terminate\
    \ execution of the function, then there is a way to come out of a defined function.\
    \ Based on the situation you can return any value from your function using the\
