    # Debian GNU/Linux


    Debian GNU/Linux was first announced in 1993. Its founder, Ian Murdock, envisaged
    the creation of a completely non-commercial product developed by hundreds of volunteer
    developers. With skeptics far outnumbering optimists at the time, it seemed destined
    to disintegrate and collapse, but the reality was very different. Debian not only
    survived, it thrived and, in less than a decade, it became the largest Linux distribution
    and possibly the largest collaborative software product ever created! The following
    numbers can illustrate the success of Debian GNU/Linux. Over 1,000 volunteer developers
    develop it, its software repositories contain close to 50,000 binary packages
    (compiled for 8 processor architectures) and is responsible for inspiring over
    120 Debian-based distributions and live CDs. These figures are unmatched by any
    other Linux-based operating system. The actual development of Debian takes place
    in three main branches (or four if one includes the bleeding-edge “experimental”
    branch) of increasing levels of stability: “unstable” (also known as “sid”), “testing”
    and “stable.” However, this lengthy and complex development style has some drawbacks:
    the stable releases of Debian are not particularly up-to-date, and they age rapidly,
    especially since new stable releases are only published once every 1 - 3 years.
    Users who prefer the latest packages and technologies are forced to use the potentially
    buggy Debian testing distributions or unstable branches. The highly democratic
    structures of Debian have led to controversial decisions and have led to infighting
    among the developers. This has contributed to stagnation and reluctance to make
    radical decisions that would take the project forward.


    **Pros:** Very stable; remarkable quality control; includes over 30,000 software
    packages; supports more processor architectures than any other Linux distribution.


    **Cons:** Conservative - due to its support for many processor architectures,
    newer technologies are not always included; slow release cycle (one stable release
    every 1 - 3 years); discussions on developer mailing lists and blogs can be uncultured
    at times.'
