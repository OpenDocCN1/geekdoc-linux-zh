    # Chapter Four: INSTALLING DEBIAN 8


    # What is Debian


    Debian is an all-volunteer organization dedicated to developing free software
    and promoting the ideals of the Free Software community. The Debian Project began
    in 1993, when Ian Murdock issued an open invitation to software developers to
    contribute to a complete and coherent software distribution based on the relatively
    new Linux kernel. That relatively small band of dedicated enthusiasts, originally
    funded by the **Free Software Foundation** and influenced by the **GNU** philosophy,
    has grown over the years into an organization of around 1026 *Debian Developers*.


    # Debian GNU/Linux


    The combination of Debian''s philosophy, methodology, GNU tools, the Linux kernel,
    and other important free software, form a unique software distribution called
    Debian GNU/Linux. This distribution is made up of a large number of software *packages*.
    Each package in the distribution contains executables, scripts, documentation,
    and configuration information, and has a *maintainer* who is primarily responsible
    for keeping the package up-to-date, tracking bug reports, and communicating with
    the upstream author(s) of the packaged software. The extremely large user base,
    combined with a bug tracking system ensures that problems are found and fixed
    quickly. Debian''s attention to detail allows them to produce a high-quality,
    stable, and scalable distribution. Installations can be easily configured to serve
    many roles, from stripped-down firewalls to scientific desktop workstations to
    high-end network servers. Debian is especially popular amongst advanced users
    because of its technical excellence and its deep commitment to the needs and expectations
    of the Linux community. Debian also introduced many features to Linux that are
    now commonplace. For example, Debian was the first Linux distribution to include
    a package management system for the easy installation and removal of software.
    It was also the first Linux distribution that could be upgraded without requiring
    re-installation. Debian continues to be a leader in Linux development. Its development
    process is an example of just how well the Open Source development model can work
    — even for very complex tasks such as building and maintaining a'
  - '[PAGE 26]


    complete operating system.


    The feature that most distinguishes Debian from other Linux distributions is its
    package management system. These tools gives the administrator of a Debian system
    complete control over the packages installed, including the ability to install
    a single package or automatically update the entire operating system. Individual
    packages can also be protected from being updated. You can even tell the package
    management system about software you have compiled yourself and what dependencies
    it fulfills. To protect your system against “Trojan horses” and other malevolent
    software, Debian’s servers verify that uploaded packages come from registered
    Debian maintainers. Debian packagers also take great care to configure their packages
    in a secure manner. When security problems in shipped packages do appear, fixes
    are usually available very quickly.


    # Installing Debian 8 as a Virtual Machine.


    First, you will need to download and install VirtualBox, the Oracle software that
    allows you to run any OS on... any other OS, as a virtual environment. This procedure
    is a lot safer than a dual boot: no need to fool around with boot sector or disk
    partitions, all is virtually created. The counterpart is that the two OS’s share
    your computer resources. To avoid any performance issue, we will choose a lightweight
    but efficient desktop environment. This book will use the XFCE Debian edition,
    that you can download using this link below:


    https://www.debian.org/CD/torrent-cd/


    XFCE is not the newest desktop environment, however it is among the most powerful,
    lightweight, and customizable, while being easy to use with its classic desktop
    metaphor. Imagine an improved version of Windows XP, a great way to get started
    with Linux.


    # Create your Virtual System


    Once installed, start Virtual Box and follow these steps. We will begin the VM
    configuration:


    +   - New > Name, Type (debian), Version 64


    +   - General > Advanced > Activate clipboard and Drag’n’drop


    +   - System > check memory, deactivate Floppy, check the nb of CPU (2)'
