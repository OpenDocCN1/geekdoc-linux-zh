    \ `--sections=*list*`\n  `list` 是冒号或逗号分隔的“顺序特定”手册节列表，用于搜索。此选项覆盖 `$MANSECT` 环境变量。（`-s`\
    \ 拼写方式是为了与 System V 兼容。）\n\n- `-e sub-extension`, `--extension=*sub_*extension*`\n\
    \  一些系统将大型的手册页包（例如随附 Tcl 包的包）合并到主要的手册页层级中。为了解决拥有同名手册页（如 `exit`）的问题，Tcl 页面通常都被分配给第\
    \ 1 节（小写 l）。然而，现在可以将页面放在正确的节中，并为其分配特定的“扩展名”，在本例中为 `exit(3tcl)`。在正常操作下，`man` 会优先显示\
    \ `exit` 而不是 `exit(3tcl)`。为处理这种情况并避免必须知道所需页面所在的节，现在可以提供一个子扩展名字符串给 `man`，指示页面必须属于哪个包。使用上面的示例，向\
    \ man 提供选项 `-e tcl` 将限制搜索范围，仅搜索具有 `*tcl*` 扩展名的页面。\n\n- `-i`, `--ignore-case`\n\
    \  在搜索手册页时忽略大小写。这是默认行为。\n\n- `-I`, `--match-case`\n  区分大小写地搜索手册页。\n\n- `--regex`\n\
    \  显示所有页面，其中任一名称或描述的任一部分作为正则表达式匹配每个页面参数，类似于 `apropos`。由于在搜索正则表达式时通常没有合理的方法来选择一个“最佳”页面，因此此选项隐含了\
    \ `-a`。\n\n- `--wildcard`\n  使用 shell 风格的通配符显示所有页面，其中任一名称或描述的任一部分匹配每个页面参数，类似于\
    \ `apropos --wildcard`。页面参数必须匹配整个名称或描述，或者匹配描述中的单词边界。由于在搜索通配符时通常没有合理的方法来选择一个“最佳”页面，因此此选项隐含了\
    \ `-a`。\n\n- `--names-only`\n  如果使用 `--regex` 或 `--wildcard` 选项，则仅匹配页面名称，而不匹配页面描述，类似于\
    \ `whatis`。否则，此选项没有效果。\n\n- `-a`, `--all`\n  默认情况下，man 在显示其找到的最合适的手册页后会退出。使用此选项可强制\
    \ man 显示所有名称与搜索条件匹配的手册页。\n\n- `-u`, `--update`\n  此选项使 man 对其数据库缓存执行 inode 级一致性检查，以确保它们是文件系统的准确表示。只有当\
