    \ | This would also generate syntax error. |\n\n**Note:** While using `p` action,\
    \ you should use `-n` option to avoid repetition of line printing. Check the difference\
    \ between these two commands:\n\n```\n$ cat /etc/passwd | sed -n ‘1,3p’\n```\n\
    \nCheck the above command without `-n` as follows:\n"
