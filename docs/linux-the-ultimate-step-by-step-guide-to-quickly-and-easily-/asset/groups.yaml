    (/) characters are used as delimiters around the pattern to be matched and the
    action to be taken is enclosed in curly braces. If no pattern is specified, all
    lines in the file are processed and if no action is specified, all lines matching
    the specified pattern are output. Since a colon (:) is used here, all lines containing
