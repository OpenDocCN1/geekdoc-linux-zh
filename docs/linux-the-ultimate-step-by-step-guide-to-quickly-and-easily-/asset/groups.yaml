    Many commands and programs can create files. The most basic method of creating
    a file is with the `touch` command. This will create an empty file using the name
    and location specified.


    First, we should make sure we are in our home directory, since this is a location
    where we have permission to save files. Then, we can create a file called `file1`
    by typing:


    ```

    ```

    cd

    touch file1

    ```

    ```


    Now, if we view the files in our directory, we can see our newly created file:


    ```

    ```

    ls

    file1

    ```

    ```


    If we use this command on an existing file, the command simply updates the data
    our filesystem stores on the time when the file was last accessed and modified.


    We can also create multiple files at the same time. We can use absolute paths
    as well. For instance, if our user account is called `demo`, we could type:


    ```

    ```

    touch /home/demo/file2 /home/demo/file3

    ls

    file1 file2 file3

    ```

    ```


    # ## Create a Directory with “mkdir”


    Similar to the `touch` command, the `mkdir` command allows us to create empty
    directories.


    For instance, to create a directory within our home directory called `test`, we
    could type:


    ```

    ```

    cd

    mkdir test

    ```

    ```


    We can make a directory *within the* `test` directory called `example` by typing:


    ```

    ```mkdir test/example```

    ```


    For the above command to work, the `test` directory must already exist. To tell
    `mkdir` that it should create any directories necessary to construct a given directory
    path, you can use the `-p` option. This allows you to create nested directories
    in one step. We can create a directory structure that looks like `some/other/directories`
    by typing:


    ```

    ```mkdir -p some/other/directories```

    ```


    The command will make the `some` directory first, then it will create the `other`
    directory in the `some` directory. Finally, it will create the `directories` directory
    in the `other` directory.'
  - '[PAGE 79]


    # Moving and Renaming Files and Directories with “mv”


    We can move a file to a new location using the `mv` command. For instance, we
    can move `file1` into the `test` directory by typing:


    ```

    mv file1 test

    ```


    For this command, we list all items that we want to move, with the location to
    move them to. We can move that file *back* to our home directory by using the
    special dot reference to refer to our current directory. We should make sure we
    are in our home directory, and then execute the command:


    ```

    cd

    mv test/file1 .

    ```


    This may seem unintuitive at first, but the `mv` command is also used to *rename*
    files and directories. In essence, moving and renaming are both just adjusting
    the location and name for an existing item.


    So to rename the `test` directory to `testing`, we could type:


    ```

    mv test testing

    ```


    > **Note:** It is important to realize that your Linux system will not prevent
    you from certain destructive actions. If you are renaming a file and choose a
    name that *already* exists, the previous file will be **overwritten** by the file
    you are moving. There is no way to recover the previous file if you accidentally
    overwrite it.


    # Copying Files and Directories with “cp”


    With the `mv` command, we could move or rename a file or directory, but we could
    not duplicate it. The `cp` command can make a new copy of an existing item.


    For instance, we can copy `file3` to a new file called `file4`:


    ```

    cp file3 file4

    ```


    Unlike the `mv` operation, after which `file3` would no longer exist, we now have
    both `file3` and `file4`.


    > **Note:** As with the `mv` command, it is possible to overwrite a file if you
    are not careful about the filename you are using as the target of the operation.
    For instance, if `file4` already existed in the above example, its contents would
    be completely replaced by the contents of `file3`.


    In order to copy directories, you must include the `-r` option in the command.
    This stands for “recursive,” as it copies the directory, plus all of the directory’s
    contents.'
  - '[PAGE 80]


    This option is necessary with directories, regardless of whether the directory
    is empty. For instance, to copy the `some` directory structure to a new structure
    called `again`, we could type:


    ```

    cp -r some again

    ```


    Unlike with files, with which an existing destination would lead to an overwrite,
    if the target is an *existing directory*, the file or directory is copied *into*
    the target:


    ```

    cp file1 again

    ```


    This will create a new *copy of `file1`* and *place it inside the `again` directory*.


    # Removing Files and Directories with “rm” and “rmdir”


    To delete a file, you can use the `rm` command.


    **Note:** Be extremely careful when using any destructive command like `rm`. There
    is no “undo” command for these actions so it is possible to accidentally destroy
    important files permanently.


    To remove a regular file, just pass it to the `rm` command:


    ```

    cd

    ```


    ```

    rm file4

    ```


    Likewise, to remove *empty* directories, we can use the `rmdir` command. This
    will only succeed if there is nothing in the directory in question. For instance,
    to remove the `example` directory within the `testing` directory, we can type:


    ```

    rmdir testing/example

    ```


    If you wish to remove a *non-empty* directory, you will have to use the `rm` command
    again. This time, you will have to pass the `-r` option, which removes all of
    the directory’s contents recursively, plus the directory itself.


    For instance, to remove the `again` directory and everything within it, we can
    type:


    ```

    rm -r again

    ```


    Once again, it is worth reiterating that these are permanent actions. Be entirely
    sure that the command you typed is the one that you wish to execute.


