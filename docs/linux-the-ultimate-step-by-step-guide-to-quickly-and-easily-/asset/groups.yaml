    ```

    $ su

    $ apt-get install sudo

    $ nano /etc/sudoers

    ```


    Add below `root ALL=(ALL) ALL:`


    ```

    USERNAME ALL=(ALL) NOPASSWD: ALL

    ```


    Replace **USERNAME** with your username. The **NOPASSWD** flag removes the requirement
    to enter a password every time you use **sudo**. This is *not* a good idea on
    a production server!


    Reboot your machine to make the changes take effect: `$ reboot`


    From now on all operations that require root should be run with the **sudo** prefix,
    without having to enter the password each time.


    # ## Set up the network


    Log in to your new VM using the username and password you chose during installation.
    We’re going to add a network connection to your VM that will allow you too easily
    SSH into the server.


    ```

    $ sudo nano /etc/network/interfaces

    ```


    Add the following to the end of the file:


    ```

    auto eth0

    iface eth0 inet static

    address 192.168.56.101

    netmask 255.255.255.0

    ```


    Hit **CTRL + X**, then Y and **ENTER** to save changes.


    Shutdown the VM.


    ```

    $ sudo shutdown -h now

    ```


    At the main Virtual Box screen, hit the *settings* button. Then select **Network**
    from the list on the left, choose *Adapter 2* from the tabs, check ‘Enable Network
    Adapter’ and choose ‘Host-only Adapter’ from the dropdown, then click **Ok**.'
  - '[PAGE 34]


    ![](img/95e14ba64977353b42ea3103515e63c3_34_0.png)


    What we have done is set up your VM to use a static IP address. This is a good
    idea because it allows us to always access our VM using a single IP address/hostname
    without having to look it up each time we boot.


    By default, Virtual Box utilizes the **192.168.56.1** address in your network,
    and it assigns IP addresses in the **192.168.56.1xx** range to all your VMs.


    By editing `/etc/network/interfaces` we told the OS that it should expect a network
    resource to be available at that address.


    # Setup your hosts file


    Now your server is configured lets add the hostname to your hosts file!


    Simply add the following entry into your hosts file. This should be done on your
    host machine – be it Windows or Mac OS X or Linux, not the VM itself.


    ```

    192.168.56.101 debian-vm

    ```


    Keep in mind that for every domain you setup on your VM, you will need to add
    it to your hosts file.


    # Log in via SSH!


    Now that you have setup the network adapter in Virtual Box, and added the correct
    settings to the VM interfaces file, you''re ready to actually SSH into your server
    and begin installing everything! You may be wondering why you need to SSH and
    not simply use the VM window. The reason I do it this way is that the server does
    not support copy/paste! There’s a lot of typing ahead and having the ability to
    simply copy/paste into your terminal is going to speed things up quite a bit!


    For SSH on Windows, I use KiTTY. It''s an SSH client that adds some nifty features
    to PuTTY. There is also Poderosa. For Mac/Linux just use the terminal! Since'
