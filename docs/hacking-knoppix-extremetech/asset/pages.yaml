    \ ClusterKnoppix Applications\n\nSeveral ClusterKnoppix applications are available,\
    \ although this chapter only introduces you to: POV-Ray and John the Ripper. Search\
    \ for others on your own and determine whether they'd help you out.\n\n# Using\
    \ POV-Ray\n\nPOV-Ray is a ray-tracing computer rendering program. That is, it\
    \ takes text files describing scenes, renders and renders them as three-dimensional\
    \ spaces. Ray tracing is really neat because it works by simulating rays of light\
    \ emanating from a light source and tracks them as they bounce off surfaces. This\
    \ creates stunning realistic results by modeling real-world physics. Keeping track\
    \ of all those lights is also expensive in computational terms, which makes the\
    \ program an attractive candidate for parallel processing.\n\nTo run POV-Ray as\
    \ a parallel program, first start the PVM (Parallel Virtual Machine) daemon by\
    \ running pvm and then quit out of the console it opens. Your parallel POV-Ray\
    \ ray-trace with this:\n\n```\n- /usr/share/doc/povray/povscn/level2/skyvase.pov\
    \ +v1 \n+ft -x -a030 .303 -q9 -mv2.0 -w1600 -h1200 -d +nt16\n```\n\nThe last parameter,\
    \ NT, is the number of processes to bind. In general, try out a few smaller runs\
    \ with different numbers of cores; I find using a couple more than CPUs works\
    \ best. In addition, you might want to change -w and -n, which are the width and\
    \ height (in pixels) of the output image; processing time increases quickly as\
    \ the image gets larger. The remaining parameters are settings for POV-Ray's rendering\
    \ engine and are beyond the scope of this chapter. For more information on what\
