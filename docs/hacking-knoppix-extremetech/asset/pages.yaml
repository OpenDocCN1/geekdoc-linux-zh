  md: '# 248 Part IV — Customizing Knoppix and Live CDs


    Wait while this command lists every directory and its size, rerun grep of space,
    and pay attention to the last line. For example, a last line that reads 2458927
    total


    tells you that Knoppix is 2.45GB of space, and you''d need to get rid of as much
    software as possible so that you can install the packages you want to use when
    your Myppix. It''s helpful to erase the packages that are taking up the most space.
    To find out what packages are on Knoppix, sorted by size, with the largest at
    the bottom, run this command (actually, two commands joined together by the pipe):


    ```

    # dpkg-query -W --showformat=''${Installed-Size} ${Package}''\n | sort -n

    ```


    When you created Archix, the distro for kids, you dumped the kde-i18n ("internationalization")
    packages, and you can do the same thing with Myppix if you''re an English speaker
    and don''t need Russian, Spanish, Italian, or Japanese translations of everything.


    To enumerate the i18n packages, grep so the previous command, but add pipe followed
    by another grep so that you see only packages with i18n in the name:


    ```

    # dpkg-query -W --showformat=''${Installed-Size} ${Package}''\n | sort -n | grep
    i18n

    ```


    Here''s an example of list:


    +   - kde-i18n-tr

    - k3b-i18n

    - kde-i18n-ja

    - kde-i18n-pl

    - kde-i18n-ru

    - kde-i18n-nl

    - kde-i18n-es

    - kde-i18n-it

    - kde-i18n-fr

    - kde-i18n-de


    You don''t want to remove these packages with APT; you want to purge them, which
    also removes other files, such as configurations, from the machine. To do that,
    run this command:


    ```

    # apt-get remove --purge kde-i18n-tr k3b-i18n-ja

    kde-i18n-pl kde-i18n-ru kde-i18n-nl kde-i18n-es kde-i18n

    -it kde-i18n-fr kde-i18n-de

    ```


    APT lets you know what it''s about to do and then asks you a question:


    Reading Package Lists... Done

    Building Dependency Tree... Done

    The following packages will be REMOVED:

    k3b-i18n* kde-i18n-es* kde-i18n-fr* kde-i18n-it*

    kde-i18n-ja* kde-i18n-nl* kde-i18n-pl* kde-i18n-ru* kde-i18n-tr*

    0 upgraded, 0 newly installed, 10 to remove and 18 not upgraded.

    Need to get 0 GB of archives.

    After unpacking 196MB disk space will be freed.

    Do you want to continue? [Y/n]'
