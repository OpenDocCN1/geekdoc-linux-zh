    Read Only box.


    Mount the drive by right-clicking on the drive icon and selecting Mount. You can
    use the command line in conjunction with the cp command to move files between
    the hard drive and the jump drive (typically /dev/uba1). Alternatively, you can
    open two Konqueror windows (see Figure 5-13) and drag and drop.


    Your only limitation to saving files this way is the speed of the file transfer
    and the capacity of your jump drive, although 1GB and 2GB jump drives are available
    for very reasonable prices, and you can use more than one if necessary.'
