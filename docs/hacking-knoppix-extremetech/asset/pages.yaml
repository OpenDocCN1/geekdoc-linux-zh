  md: '# Chapter 11 — Creating Archix, Knoppix for Kids 239


    The composite photograph gives you a powerful sense of humanity''s presence on
    the globe, perfect for a discussion with an intelligent kid. Where are there lights?
    Why? Where are there fewer lights? Why is that? Geography, history, environmentalism:
    It can all be taught using this one image.


    The 386KB image''s 2400 × 1220 dimensions won''t work with Knoppix. Instead, it
    needs to be 1024 × 768. Open the image in the GIMP (examined in Chapter 1) and
    change the image''s dimensions. The image will be a bit distorted, but it''s not
    black, and actually is closer to the Gall-Peters projection that some geographers
    find more accurate.


    For information on the various ways to project the spherical earth onto a flat
    surface, see Gall-Peters projection (http://en.wikipedia.org/wiki/Gall-Peters_projection),
    Mercator projection (http://en.wikipedia.org/wiki/Mercator_projection), and Map
    projection (http://en.wikipedia.org/wiki/Map_projection).


    Alternatively, you can use the GIMP to change the size of the image''s width,
    but keep your dimensions proportional. Then change the size of the image''s canvas
    to 1024 × 768, center the image vertically, and give the blank areas at the top
    and bottom of the canvas a color, like the deep navy of the photo or black.


    Once you have the image you want, copy it to the appropriate location in the Knoppix
    file system:


    ```

    $ cp knnoppix.jpg /home/scott/knoppixuncompressed/usr/lib/

    ```


    When your distro finishes loading, the kids using it will have an amazing image
    in front of their eyes.


    # Changing the Boot Screen


    Long before the desktop background shows up, the boot screen makes its appearance.
    That''s where you can present the user with the name of your distro. This is clearly
    an important consideration: Your custom distro name should be short, snappy, descriptive,
    and somewhat-cool. For example, St. Louis is the name of the world-famous Arch,
    and that''s what sparked the name Archix for this example kid distro. It seemed
    like a fun name to use.


    Creating a boot screen isn''t really easy as making a desktop background image.
    First, open the GIMP and create a blank image of 640 × 480 pixels in size. Paste
    in a photo or some other graphic that you like (the example uses a photo of the
    Arch from one of its legs). Then use the Text tool to insert text boxes that describe
    your distro, welcome new users, and let them know to press Enter to boot the CD.
    Don''t be afraid to use a little orange (a popular color with kids, could give
    a little zing to the text showing your distro).


    To finalize for Knoppix, save your image as a PPM file (the example is, clearly
    enough, archix.ppm). Then set it to only 16 colors, which is required by Knoppix.
    This may improve your image a bit, greatly limiting the quality of your boot screen,
    but we have no choice. It must be 16 colors. To limit the color palette, select
    Image -> Mode -> Indexed, choose Generate Optimum Palette, and then set Maximum
    Number of Colors to 16. The boot screen showing in Figure 11-2 isn''t exactly
    a work of art, but it''s clear and neat enough for kids to enjoy.'
