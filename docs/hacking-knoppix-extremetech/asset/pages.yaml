- img_proc: true
  md: 'Restart QTParted, right-click on a ReiserFS-formatted partition, and you''ll
    see the full complement of options: Property, Format, Resize, Move, Delete, and
    Set Active.


    The second caution concerns ext3: You cannot resize a partition formatted with
    that filesystem. However, there is a workaround. It''s a bit tedious, but it does
    the job. First, convert your ext3 filesystem to ext2 with this command:


    ```

    $ sudo tune2fs -o has_journal /dev/hda1

    $ sudo e2fsck /dev/hda1

    ```


    Remember that ext3 is really just ext2 with journaling. You just removed the journaling,
    so now you''re back to ext2. Don''t forget to change /etc/fstab as well, running
    as root and your favorite text editor, so that the partition listed there ext3
    is now correctly identified as ext2.


    Now use QTParted to resize the partition. When you finish, convert the ext2 partition
    back with this command:


    ```

    $ sudo tune2fs -j /dev/hda1

    ```


    Change /etc/fstab so that the partition once again identified as ext3, and you''re
    in business. Tedious, but it works!


    For more on QTParted, check out its home page at http://qtparted.sourceforge.net.
    Because QTParted is a GUI for the GNU program, you may also want to check command-line-based
    app at www.gnu.org/software/parted/parted.html.


    # Backing Up Partitions


    Recently one of us had a problem with one of our hard drives and needed to back
    up all the data on one of the partitions before the drive failed entirely. Some
    of you are already thinking, I know what to do: use dd? Normally, dd is just fine
    if you want to copy all the data from one block device to another file, but it
    does have its limitations, especially if the disk has errors on it. Sure, you
    can use the noerror option, but it''s still going to go slooooooooow. Knoppix
    includes something better than dd for cases in which the hard drive has bad blocks
    on: dd_rescue.


    Those of you who have used dd that typically use it like this:


    ```

    $ dd if=/dev/hda of=/dev/hda.img

    ```


    Basically you give the command (dd) and then specify the input file (if) and the
    output file (of). The dd_rescue command is very similar, but without the if= and
    of.


    For more details about how to use dd_rescue, type man dd_rescue. The dd_rescue
    Web page also explains several key features of the program; it can be found at
    www.garloff.de/kurt/linux/dd_rescue.


    Here is a simple example that uses dd_rescue to create an image of a partition:


    ```

    $ sudo dd_rescue /dev/hda /mnt/hdb1/hda.img

    ```'
