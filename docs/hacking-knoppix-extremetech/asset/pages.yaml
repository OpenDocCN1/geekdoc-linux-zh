    # Customizing the Look of Your Distro


    You have the software you want, but you still need to make things look fun and
    inviting for the kiddies. You can make some changes that will improve the look
    of your new distro.


    # Getting a Desktop Background


    The normal desktop background is OK, but the kids would get a kick out of something
    that''s a bit cooler. First you need to find an image. If you''re making this
    distro for a particular individual who has a favorite picture, by all means, use
    that; but if you instead like to find something online, you''ll find all ideas
    in this section and the accompanying sidebar, "Searching for Cool Wallpaper."
    Just sure that any images you decide to use are freely available or licensed in
    a way that you can use them without any problems.


    There''s a particular image from the Astronomy Picture of the Day that it is beautiful
    and thought-provoking, qualities you should always look for in a good photograph.
    Titled "Earth at Night," the photo (shown in Figure 11-1) was chosen as Picture
    of the Day in 2000. You can find it at http://antwrp.gsfc.nasa.gov/apod/ap001127.html.


