- img_proc: true
  md: '# Command-Line Controls for FreeNX Server


    It''s pretty easy to change the FreeNX server by using the command line. Once
    you''re running root (just type su - on the command line, press Enter, and you''re
    running as the superuser), you can enter any of the commands following to make
    alterations:


    +   - nxserver -listuser: Displays a list of FreeNX users, which could be very
    helpful if you want to verify just who can log in to your account

    - nxserver -adduser username: Adds a new user, which you probably won''t need
    to do because nxuser is sufficient

    - nxserver -deluser username: Deletes a user

    - nxserver -passwd username: Prompts you for a password for the specified user,
    which again probably won''t need to be done, assuming you picked an adequate password
    for nxuser when you were originally prompted

    - nxserver -status: Is FreeNX running? Find out with this command.

    - nxserver -start: Starts the FreeNX server if it''s not running

    - nxserver -stop: Stops the FreeNX server if it is running

    - nxserver -restart: If the FreeNX server is running, restart it; if it''s not
    running, start it. Be warned: Anyone connected to your FreeNX server when you
    run this command is going to be rudely disconnected, unless you use the next command.

    - nxserver -broadcast message: Sends your message to all logged-in users, which
    you should do before restarting the server


    For the full list of possible options, just type nxserver on the command line
    as root and press Enter.


    # Understanding FTP


    FTP (File Transfer Protocol) is one of the oldest protocols still use on the Net.
    First proposed in RFC 114 in April 1971 at www.ietf.org/rfc/rfc114.txt), FTP is
    used millions of times every day, even by people who have no idea that the file
    they''re downloading with their Web browser is arriving on their computer courtesy
    of a technology that is more than 30 years old.


    Unfortunately, FTP has one big problem: security. Because it''s so old, FTP simply
    wasn''t designed with security. Consequently, usernames and passwords, as well
    as all subsequent traffic, is sent in the clear, making it easily for anyone sniffing
    packets to find your sensitive information. Knoppix doesn''t come with FTP server
    software, and that''s OK: You should use SSH and SFTP, which encrypts all traffic,
    anyway. However, Knoppix does'
