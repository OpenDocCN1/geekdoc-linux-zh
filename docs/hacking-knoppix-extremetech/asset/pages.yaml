  md: 'Keep in mind you''re sharing things, not necessarily partitions or drives.
    A share can consist of an entire partition or drive (although generally that''s
    not a good idea), but it doesn''t have to be. You can share a subfolder waaaaay
    down in your directory hierarchy using Samba; for example, to view some OGGs and
    MP3s, you might click on the music share.


    Immediately you''ll be prompted for a username and password, which happens any
    time you try to connect to a protected share. Keep in mind that you must enter
    a Samba username and password, which may not be the same as your login username
    and password on the box—it depends on how you set up Samba on that computer. If
    it''s a Windows or Mac OS machine to which you''re connecting, it''s a login name
    and password; if it''s a Linux box, then login names may not be the same as Samba
    names. You just have to know how the computer you''re trying to connect to is
    set up.


    A few years ago, Konqueror asked you over and again to enter your username and
    password—every time you entered a new subfolder, perhaps. In fact it was insane—enough
    to drive you insane. Thankfully, KDE has removed this annoyance. Now you are asked
    for a share, and that''s it.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_105_0.png)


    Once you''ve logged in correctly, you can get access to the files and folders
    that you want to access. In my case, that would be rock ''n'' roll OGGs and MP3s
    (all legal). At this point, I might think it''s time to play some music—some Smiths
    (I am compulsiously organized when it comes to my music collection), click Rock_Alternative_All_Time_Greats
    (I am seriously), and then click Smiths_-Hatful_of_Hollow_-01_-William_It_Was_Really_Nothing.mp3
    and... what''s this? The file appears in XMMS (the default MP3 player), but there''s
    no sound. What stored locally on the Knoppix machine plays fine. What''s going
    on?


    The problem is that the “music” share that''s connected to William isn''t actually
    mounted, so XMMS can''t play the songs on that. Right-clicking on William_-It_Was_Really_Nothing.mp3
    and choosing to open it with xnite, plays—the file is the first one downloaded
    onto the machine. That''s OK for a single tune, but for an album, a large video,
    or anything else—loading every single file before listening to it, or watching
    it, it''s quickly going to tedious. To solve that issue, you need to actually
    mount the Samba share on the other machine you''re using Knoppix box, so that
    Knoppix treats the file like it''s on the hard drive.


    If you know how to use smbount on the command line, this is your time to shine.
    Just enter smbount and the appropriate options, and you''re set. If you don''t
    know smbount, or you want to learn how to use it, start by LinNeighborhood, included
