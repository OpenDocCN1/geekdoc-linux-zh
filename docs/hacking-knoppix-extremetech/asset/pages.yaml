  md: '# Testing for Vulnerabilities


    It''s not enough to baton down the hatches if you don''t know which hatches need
    hardening. On a computer system, you need to know where the possible holes are,
    and Knoppix can help you test for and mitigate vulnerabilities.


    # Verifying the Absence of Rootkits with Chkrootkit


    If your computer gets cracked, rootkits (also called root kit) are definitely
    a concern. Basically, a cracker can leave a rootkit behind that lets him easily
    access and control the machine in the future, while are two kinds of rootkits:
    kernel level, which replaces pieces of the Linux kernel with malicious code, and
    application level, which replaces regular programs (such as is, cd, less, and
    so on) with seemingly similar programs that are actively Trojan horses up to no.
    With Knoppix, you can root out the rootkits and keep your computer safe.


    For information on rootkits, see the Wikipedia article at http://en.wikipedia.org/wiki/Rootkit,
    or view search results at SecurityFocus with http://search.securityfocus.com/swsearch?query=rootkit&sbm=infokus&metename=all
    doc.


    Knoppix uses a command-line program called chkrootkit to do its work. It tests
    for (at this time) 59 different rootkits, LKMs (Linux Kernel Modules, the kernel-level
    rootkits discovered previously). Check out the complete list at the chkrootkit
    Website, www.chkrootkit.org.


    To run chkrootkit, open your terminal and execute the following command:


    ```

    $ sudo chkrootkit

    ```


    Immediately chkrootkit kicks into action, scanning your machine for known rootkits
    and poking about, looking to see if anything has been tampered with. As it works,
    the program spits its out on your command line, leading to a hundred lines or
    so that look like this:


    Checking ''timed...'' not found

    Checking ''traceroute...'' not infected

    Checking ''vdir...'' not infected

    Checking ''w...'' not infected

    Checking ''write...'' not infected

    Checking ''aliens''... no suspect files

    Searching for sniffer''s logs, it may take a while... nothing found

    Searching for HIDRootkit''s default dir... nothing found

    Searching for torn''s default files and dirs... nothing found


    If a nasty were on your computer, you''ll see the name, following by INFECTED.
    Clearly it''s a bit overwhelming to see a list of everything that''s not infected
    because it would be easy to miss the line informing you that you are infected,
    so it''s better to run chkrootkit with the -q (for "quiet") option, like this:


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_153_0.png)'
