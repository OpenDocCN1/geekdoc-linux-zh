  md: '# Chapter 1 — Unraveling the Knoppix Toolkit Maze 29


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_54_0.png)


    FIGURE 1-20: Setting the kind of session you''re using in K3b


    Most of the time, you''ll probably fill a CD completely, so you want the default:
    No Multisession. If you''re going to use several different sessions, you don''t
    want K3b to "close" the disc until you''re finished. To do this correctly, Start
    Multisession for the first burn, Continue Multisession for the next burns except
    the last one, and then complete your CD-R/W with Finish Multisession, which tells
    K3b that it''s all right to close the disc. You''ll use the default No Multisession
    most often, but it''s good to know how to create a multiple-session CD if you
    need one.


    # Keeping Yourself Informed


    The Volume Desc tab is shown in Figure 1-21.


    None of the information on the Volume Desc tab prevents a successful burn, but
    you''ll probably want to spend a moment here just so things are organized and
    clear. In other words, this tab isn''t for the computer—it''s for the human user.
    Fill things out as you see fit.


    # Understanding Filesystems


    The Data Project''s Filesystem tab (see Figure 1-22) is very important, if you
    want to make sure that your disc can be used on both Linux and other operating
    systems. For backups, this is an essential consideration. If you never have to
    touch a Windows machine, this tab may not be as significant to you, although there
    are still things here that you will probably want to set.'
