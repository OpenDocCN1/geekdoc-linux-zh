  md: '# Chapter 6 — Assessing Security with Knoppix 155


    Peter Gutmann, a security researcher, contends that a disk must be overwritten
    at least 22 times, with different patterns, before it is securely wiped. You can
    read his argument at http://wipe.sourceforge.org/secure_del.html.


    To use the dd command, boot Knoppix but don''t mount the disk you want to wipe.
    Open Console and execute the following:


    ```

    for (( i = 0;i<11;i++)); do if=/dev/urandom of=/dev/hda; dd if=/dev/zero of=/dev/sda;
    done

    ```


    Press Enter, and then get up and leave the computer. It''s going to take a long,
    long time (many hours, perhaps days) for that command to finish, unless you''re
    trying to erase a pretty dirty hard drive. It''s worth to know that your data
    is safely—and permanently—erased, isn''t it?


    # Employing Wipe


    The other method for securely erasing drives (or partitions) utilizes the wipe
    command. With Knoppix, it''s pretty easy. To nuke the second partition on your
    hard drive, for example, boot with Knoppix and then invoke the wipe command as
    follows:


    ```

    $ wipe -fik /dev/hda2

    ```


    The options do the following:


    +   - f: You will not be asked for confirmation (if that makes you nervous, don''t
    use the option).


    +   - i: Print information about the command''s progress on the command line.
    If you don''t need to see this, don''t use the option.


    +   - k: Don''t get rid of the file (in this case, a device).


    If you use Wipe to nuke an entire disk instead of just a partition (if /dev/hda1,
    in other words), you will erase the Master Boot Record on the drive, which means
    that all of your partitioning data will be gone and you will not be able to boot
    the drive anymore. This may not be a bad thing if you''re planning to install
    an OS from scratch or if the drive is not used by your machine, but you should
    at least know about it. Besides, you can recover the MBR—maybe—if you read the
    "Restoring a Missing MBR" section in Chapter 4.


    wipe is a powerful command; by default, it overwrites files with random data 34
    times. If that number is too high for you and you want to use 11 instead, change
    it with -Q11 to the wipe command (make sure you use a capital Q). If you''re really
    impatient and don''t want a superficial job, you can use -q as an option, which
    just wipes the drive four times (not recommended, but it''s your data).


    You can also wipe directories, if you''d like, instead of entire drives, by first
    mounting the partition containing the directory and then using this command:


    ```

    $ wipe -ficker /mnt/hda2/secretstuff/

    ```'
