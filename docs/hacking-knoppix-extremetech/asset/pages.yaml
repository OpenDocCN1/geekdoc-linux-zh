    # Browsing the Web with Mozilla Firefox


    Knoppix used to include the full Mozilla suite of Web browser, email program,
    and Web page composer, but it dropped the suite with version 3.8 and instead included
    Firefox, which is a Web browser only. That was a great move. Firefox has the buzz,
    the extensions and other goodies, and it''s a faster, more swvelte program.


    If you''re reading this, you''ve probably used Firefox before, and you probably
    know how to use a Web browser. I''m not going to conduct Web Browsing 101 here;
    instead, let''s look at three really cool things you can do with Firefox.


    # Improving Your Home Page


    When I used to start Firefox, I found that I''d open the three tabs every time:
    Gmail, Bloglines, and The Open Source Weblog. I finally realized that what I was
    doing was inefficient. So I went to Edit -> Preferences, selected General, and
    for Home Page I entered the following, clicking OK when I finished:


    gmail.google.com | www.bloglines.com/myblogs |opensource.weblogsinc.com


    Now I open Firefox, it automatically opens those three sites in tabs, for me to
    view. If I click the Home button, those sites appear. Try it yourself. Determine
    which sites you want to repeatedly and enter their URLs into the Home Page text
    box, separating them with the pipe symbol (| | right above the Enter key on most
    keyboards). Changing your home page into your key page makes things more efficient
    and useful because presumably are the sites you need to do most of your work.


    # Installing Extensions


    One of the coolest things about Firefox is the hundreds of free extensions that
    extend the browser in infinite ways. You can install new extensions by selecting
    Tools -> Extensions and clicking Get More, which opens a new Firefox window pointing
    to https://addons.update.mozilla.org/extensions/. From there, find the extension
    you want and install Now. Restart Firefox to load the extension after it has been
    downloaded and installed.


    The Mozilla Update site has every extension—you can find a lot of great ones there,
    there are essential extensions on other sites. The only thing you need to be aware
    of is that you can''t just install Firefox from any old site. For security''s
    sake, Firefox starts with a whitelist of sites from which you can install software;
    when you try to install extensions from nonwhitelisted sites, Firefox opens an
    alert at the top of the window warning that the site has been blocked. Add to
    your whitelist, click the Edit Options button on the right of the alert bar, and
    when the Allowed Sites window opens, click Allow and then OK. Click on the link
    to install the extension again, and this time Firefox does it without complaint.'
