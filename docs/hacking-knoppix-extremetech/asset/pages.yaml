    Unfortunately, if you find that the system you''re examining has in fact rooted,
    your best option is to reinstall your OS and make sure that all updates have been
    applied and that the system is hardened before turning it back on a network. It
    is no fun, but that''s the only way to ensure that you don''t miss something and
    continue to allow some miscreant access to your box.


    # Scanning for Open Ports with Nmap


    To find out what ports are open on a machine, the gold standard is Nmap. Nmap
    actually does its job in three steps: pinging the computer in (or several, if
    you want) to determine whether''s on the network, scanning ports to ascertain
    what services are running on the machine, and figuring out the operating system
    of the box. Each of these steps is almost entirely configurable within Nmap, enough
    that a short book could be written on the software. This section focuses on common
    tasks for which you might use Nmap.


    If you don''t know what ports are, check out http://en.wikipedia.org/wiki/Port_(computing),
    http://en.wikipedia.org/wiki/Socket, and http://en.wikipedia.org/wiki/List_of_well-known_ports_(computing)
    for a quick overview.


    First, choose the computers you want to scan. If you have only one machine you''re
    interested in, that''s easy: just specify its IP address or domain name. If you''re
    interested in several machines, you can give a range of IP addresses —192.168.0.1-5,
    —or you can use a mask. It''s not easy to remember the various masks mean, so
    here''s a handy table that may help you keep things right:


    | IP Address/Mask | What It Means |

    |---|---|

    | 192.168.0.1/32 | Just that computer: 192.168.0.1 |

    | 192.168.0.1/24 | The entire Class C range of addresses for that network: 253
    addresses addresses total First octet is always between 192–223 192.168.0.0–255
    |

    | 172.16.0.1/16 | The entire Class B range of addresses for that network: 65,532
    addresses total First octet is always between 128–191 172.16.0–255.255 |

    | 10.0.0.1/8 | The entire Class A range of addresses for that network: 16,777,214
    addresses total First octet is always between 0–127 10.0–255.255.255 |'
