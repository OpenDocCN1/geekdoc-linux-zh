  md: '# Part I — Navigating the Amazing Knoppix Toolkit


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_65_0.png)


    For some excellent overviews of Scribus'' capabilities, see www.linuxdevcenter.com/pub/a/linux/2004/09/02/scribus.html
    and www.linuxjournal.com/article/7054.


    For details on Scribus, go to the program''s Website, at www.scribus.net. There''s
    a ton of great information there, including documentation (a lot), a wiki, downloads,
    and more.


    # Viewing PDFs with Adobe Acrobat Reader


    Linux comes with a wide variety of PDF readers, and Knoppix itself includes KGHostView,
    GV (GhostView), and Xpdf, in addition to the official one, Adobe''s Acrobat Reader.


    You can start Acrobat Reader from the K menu by selecting Multimedia -> View ->
    Acrobat Reader, but you''ll more commonly click on a PDF you''ve downloaded, or
    on a link on a Web page that points to a PDF; and your PDF reader will open, already
    displaying the file you want to read. Knoppix comes with Adobe''s Acrobat Reader
    as the default app to view PDFs, so you don''t need to change anything.


    Acrobat Reader supports text selection, which can come handy if you want to get
    some text out of a PDF and into another program. To turn this on, click the text
    selection icon on the toolbar, shown in the center of Figure 1-28.'
