  md: '# Creating Myppix, Your Personal Knoppix


    In this chapter, you apply what you learned in Chapters 9 and 10 to create your
    own Knoppix-based distro that is completely focused on you. It''ll have all your
    settings, your favorite software, and everything "just so"—a Knoppix CD that is
    customized exactly the way you want it.


    It''s called Myppix because there''s evidently a cosmic computing law stating
    variants of Knoppix end with "ppx," or, if that''s not possible, at least "ix,"
    and because the name is descriptive and appropriate (literally "My Knoppix").
    Of course, you can give any name you want.


    The essentials of remastering Knoppix were explained in detail in the previous
    two chapters, so none of that needs to be repeated here. If you skipped ahead
    to this chapter and find yourself wondering what the heck you''re doing, go back
    and read Chapters 10 and 11.


    # Before You Begin


    Before you begin the whole remastering process that will eventually end with the
    unveiling of Myppix before the world, you need to perform a step that looks completely
    unrelated at first. Trust me, though—it will all become clear by the end of this
    chapter.


    # chapter 12


    # in this chapter


    +   - Before you begin

    - Preparing Knoppix

    - Creating a new distro

    - Customizing the look of your distro

    - The big secret

    - Mastering the CD'
