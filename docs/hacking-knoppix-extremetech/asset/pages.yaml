- img_proc: true
  md: 'If you want to watch fsck.vfat at work, tack on the -l option, which lists
    each file as it''s examined, and the -v option, which tells the program to be
    more verbose. To mark bad clusters, use the -t option.


    # Examining and Repairing Other Filesystems


    There are more filesystems, of course, but the ones covered here are the most
    common. Some of the other filesystems you may encounter, and the commands to use,
    are as follows:


    +   - fsck.jfs (for more info, see man fsck.jfs)

    - xfs_check (for more info, see man xfs_check)

    - NTFS: ntfsfix, which you should use after writing to an NTFS-formatted partition
    under Knoppix, as ntfsfix puts it, "MS chkdsk is well known for stupidity when
    fixing altered partitions." Keep in mind that ntfsfix is not a replacement for
    the Windows chkdsk command but a tool designed to keep particular software from
    freaking out.


    For more information about any of the filesystem commands, try man e2fsck, man
    reiserfs, and man fsck.vfat. For more on filesystems in general, see man under
    Linux, or check out http://en.wikipedia.org/wiki/Filesystem.


    > Note usually means that a file is gone, and it ain''t coming back. However,
    it is possible to undelete files that you removed from your Linux box. To find
    out how, check out "Performing Forensics with the Coroner''s Toolkit" in Chapter
    6.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_123_0.png)


    # Working with Linux Partitions


    You can check your hard drive, but sometimes you need to specifically work with
    the partitions on your hard drives. Frequently, Knoppix provides some excellent
    tools that enable you to create, manipulate, and restore partitions on your machines.


    # Partitioning with QTParted


    If you''ve spent any time in the Windows world, you would be familiar with PartitionMagic,
    popular and powerful—program that makes it really easy to work with partitions,
    even those formatted with NTFS. Think of QTParted as a free, open-source PartitionMagic,
    and you''ll be on the right track with this essential software.


    To start QTParted, from the K menu select System -> QTParted. You''ll see something
    similar to what is shown in Figure 4-1.'
