  md: "# Chapter 6 — Assessing Security with Knoppix 127\n\nThis uses the --output\
    \ option, which enables you to specify the name of the ASCII file you're creating.\
    \ You don't need to use it, but if you left it out, the resulting digital signature\
    \ file would be named secret.txt.asc, the same as the output of the gpg -r \"\
    Klaus Knopper\" --armor --sign secret.txt command you used previously. In other\
    \ words, you would overwrite your encryption with your signature (or vice versa,\
    \ depending on the order in which you run the commands!)\n\nYou can combine the\
    \ commands and do everything at once:\n\n```\n$ gpg \"Klaus Knopper\" --armor\
    \ --encrypt secret.txt ; \ngpg --output digitalisig.sig --armor --detach-sign\
    \ secret.txt\n```\n\nThe result? Two files (in addition to the original .txt file,\
    \ which remains untouched): digitalisig.sig and secret.txt.asc, suitable for pasting\
    \ into email messages or attaching.\n\n![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_152_0.png)\n\
    \nYou can always specify yourself as the recipient, protecting your important\
    \ files from prying eyes.\n\nYou send Klaus your encrypted file and your digital\
    \ signature. What does he do with them? First he verifies your signature — and\
    \ this assumes, of course, he's already imported your public key into his keyring.\
    \ To verify your signature, he runs the following:\n\n```\n$ gpg --verify digitalisig.sig\
    \ secret.txt.asc\n```\n\nKlaus can either decrypt the attachment, once it has\
    \ been saved, or copy and paste the text into a new file and decrypt that. To\
    \ perform decryption, he simply enters one of the following on the command line:\n\
    \n```\n$ gpg --output secret.txt --decrypt secret.txt.gpg\ngpg --output secret.txt\
    \ --decrypt secret.txt.asc\n```\n\nWhen Klaus presses Enter, he's prompted to\
    \ enter the password for his secret key; after he does so, GnuPG displays his\
    \ work and the file is decrypted, so that secret.txt appears and Klaus can now\
    \ read your message. If Klaus didn't use the --output option, GnuPG would simply\
    \ place the output of the decrypted file on the console. Another way around that\
    \ would be to use this command:\n\n```\n$ gpg --decrypt secret.txt.gpg > secret.txt\n\
    ```\n\nWith GnuPG in your arsenal, we have industrial-strength encryption available\
    \ to protect your secrets. It's a shame that more people don't know about GnuPG\
    \ and encryption, but you can help spread the word and educate folks with Knoppix.\
    \ For good and proselytize!\n\n![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_152_1.png)\n\
    \nman gpg has a lot of great information if you want to learn more. The GnuPG\
    \ Website is an excellent resource, at http://gnupg.org, containing HOWTOs, FAQs,\
    \ guides, and more."
