  md: '# Chapter 6 — Assessing Security with Knoppix 125


    When you run the --sign-key command, you''re asked several questions:


    +   - Do you want to sign all the user IDs associated with the key? Answer y and
    press Enter.

    - How carefully have you performed the verification? It really doesn''t matter
    what your answer is because the process continues regardless, but it does force
    you to think about what yourre doing, and that''s never a bad thing when it comes
    to security. Your best is to at least be able to truthfully answer that have you
    done careful checking. Make your choice, and press Enter.

    - Do you really want to sign the key? Yes, you really want to sign the key, type
    y and press Enter.


    Type your secret passphrase, to prove that it''s really you''re trying to sign
    the key in your keyring, and press Enter. You''re back at the command prompt.
    (In the best UNIX tradition, success is quiet; in other worlds, if things work,
    UNIX continues running along. Only problems merit feedback.)


    You need to repeat this process for every key in your keyring. If you sign a new
    key whenever you add it to your keyring, get it over with and can start using
    the key right away.


    With Klaus'' key signed, create and encrypt a file as if you were going to send
    it to him. From the K menu Editors → Kwrite, and type This is a file I''m going
    to encrypt ... bwahahahaha! Save the file on your Desktop as secret.txt. minimize
    Kwrite, and go to your shell (Console on the panel, if it''s not already open).
    cd to your Desktop, and run the following command:


    ```

    $ gpg -r "Klaus Knopper" --encrypt secret.txt

    ```


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_150_0.png)


    Don''t inundate Klaus with encrypted files. He''s too busy working on Knoppix
