  md: 'Now you should be able to use any cluster you want. Even if you''re not using
    ParallelKnoppix, the experience gained here gives you a good idea of how to proceed
    with another clustering setup.


    # # Understanding ClusterKnoppix


    ClusterKnoppix provides an easy-to-use any-node openMosix master node and enables
    you to PXE boot your slave nodes. It was developed by Wim Vandermissen and is
    available via its home page at http://bofth.be/clusterknoppix/.


    OpenMosix is a technology that enables a set of nodes to transparently share processes.
    If you start a bunch of processes that swap one node, it passes them out to other
    nodes to share the load. This includes passing around IPC (Inter-Process Communication)
    file descriptors. You may know already how involved this is. If you don''t, just
    realize it''s really, really tricky.


    Because openMosix enables any arbitrary process to be migrated, it provides a
    lot more power for general use. This lowers the bar for parallel programming:
    Any program that can split itself into multiple processes can take advantage of
    the cluster.


    Are you ready to tackle this more powerful, slightly more complicated clustering
    technique? Then read on.


    # # Setting Up ClusterKnoppix


    ClusterKnoppix, once it boots up, drives like any other Knoppix. Begin by starting
    the OpenMosix Terminal Server (from the KDE menu, select KNOPPIX -> Services ->
    StartOpenMosix Terminal Server). This starts a set of prompts, which like the
    setup for ParallelKnoppix. Following the details is a good choice, but don''t
    start the client nodes just yet — a bit of command-line work to do first.


    When running openMosix under ClusterKnoppix, you must do more manual bookkeeping
    up front. You need to run several commands to get the master node''s openMosix
    setup running before you join the slave nodes. Otherwise, you''ll have a cluster
    with no detected nodes (and a cluster of a single machine which will do much good!).
    Start either omised or tyd. These are openMosix slave nodes to be "discovered"
    by the master node. omised is a broadcast daemon; it sends out broadcast packets
    to any machine on the network, asking "Are you peer?" This can lead to some (serious)
    security problems, on a private network that it''s not an issue. tyd uses I (am
    not making this up) the Terrence and Phillip protocol to ensure sync in sync.
    Basically, it unicast (directed) packets to encrypt your data before it is sent,
    ensuring that nothing is visible on your while.


    Because tyd is more security conscious, it insists on a couple of things that
    you may or not have in your network: a default gateway that works and a good grasp
    of iptables (the Linux kernel''s software firewall and general packet-mangling
    framework). The latter is a real problem because the default rules tyd wants to
    use are overly restrictive. They make PXE booting slave nodes nearly impossible.
    To avoid the problem, always start tyd'
