    # Exploring Stage 2


    Move on stage 2, enter exit at the stage 1 shell prompt. A few lines of text messages
    appear, followed by this prompt:


    ```

    bash-3.00#

    ```


    The following cheatcodes are processed or have some effect during stage 2: boot=,
    tohtd, and toram,


    # Exploring Stage 3


    Move on to stage 3, type exit at the stage 2 shell prompt. You''ll then see a
    few lines of text messages followed by this prompt:


    ```

    root@console (deleted)[]#

    ```


    No cheatcodes are processed when moving to stage 3. However, this marks the end
    of the initial boot script, /linuxrc. When Knoppix leaves stage 3, /linuxrc is
    deleted and /etc/init takes over the process. Basically, UNIONFS is set up in
    this stage.


    # Exploring Stage 4 (Emergency Mode)


    Leave stage 3 by typing exit. You''ll see the line "Starting the init process"
    followed by "Give root password for maintenance." Simply press the Enter key,
    and you will be in an emergency-mode shell. At this point, the init program (/etc/init)
    has taken over and begin processing /etc/initabb. The only cheatcode processed
    at this stage is -b, which causes init to boot directly into a single user shell
    without running any startup scripts. This enables you to modify your startup scripts,
    change environment variables, or load/unload modules before continuing the boot
    process.


    If you cannot get to next stage, modify the file /etc/init.d/knoppix-autoconfig
    by placing a set -x command near the top. That command tells Knoppix to display
    a lot of debugging information that may give you clues as to why Knoppix does
    not successfully complete moving on the next stage.


    # Exploring Stage 5 (Textmode Runlevel)


    Move on to stage 5 by entering exit. Knoppix is in textmode, specifically level
    3, in which you have a fully running Knoppix system. The big change between stages
    4 and 5 is that startup script /etc/init.d/knoppix-autoconfig ran, probing and
    configuring more of the hardware. Specifically, knnoppix-autoconfig processes
    the following cheatcodes (some with examples):'
