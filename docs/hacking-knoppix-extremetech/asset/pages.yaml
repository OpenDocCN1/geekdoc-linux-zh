    # Generating GnuPG Keys


    To start the process of creating your own set of GnuPG keys, run this command:


    ```

    $ gpg --gen-key

    ```


    Then choose what kind of key you want to use. The options are as follows (that''s
    right — there is no 3 in the list; I don''t know why):


    +   1. DSA and ElGamal (default)

    2. DSA (sign only)

    4. RSA (sign only)


    The default of 1 is just fine, so either type 1 and press Enter, or just press
    Enter to accept the default. Choose the size of your key. Once again, the default,
    1024, is okay, so press Enter. Next, decide the length of the key is going to
    be valid. 0, the default, means that the key will never expire. This is acceptable,
    if you intend to keep the key and re-use it in the future, as long as you don''t
    publish the key to a keyserver and neither forget to use the key again or delete
    it, cluttering up public keysvers.


    If you know for certain that you''re only going to use the key for a brief period
    of time, select a key life span corresponding to that time. For example, if you
    need it for one week, type 1w and press Enter. GnuPG asks you to verify the life
    span of the key, so make sure it''s what you want, type y, and press Enter.


    Create what GnuPG calls a User-ID, which is actually composed of three questions.
    Answer them all after each one. First, you will need to enter a real name, like
    Scott Grannemen; an email address, like scott@grannemen.com; and finally, a comment
    which can be anything from an organization name to a city and state (like St.
    Louis, MO), to a URL, or nothing at all. If the User-ID is okay, type the letter
    O if it''s not, make your changes and type O. Press Enter.


    Next, and most important of all, you must type the passphrase that will be used
    to protect your key. If you lose this, or someone else can guess your passphrase,
    your security is compromised, it''s imperative that you pick something strong
    and secure. Keep in mind that you can use a passphrase, not just a password, which
    should strengthen your security. Passphrases can include spaces and other characters.


    > Tip You may want to read the SecurityFocus article titled "Pass the Chocolate"
    (http://securityfocus.com/columnists/245), which has many tips for generating
    strong passwords. It''s easy to adapt to passphrases.


    Type in your passphrase (please make sure it''s a good one!) and press Enter,
    and then do it again so GnuPG can make sure your passphrases match. Immediately
    you''re going to see a lot'
