  md: '# Some Other Handy NFS Commands


    If you really want to make the best of NFS, you need to know some additional commands.

    You''ll find the following quite useful:


    +   - /etc/init.d/nfs-kernel-server: Stops NFS

    - /etc/init.d/nfs-kernel-server restart: Restarts NFS (be careful with because
    anyone connected to your NFS server will temporarily find themselves unable to
    work on any programs accessing NFS-based data)

    - exportfs -ra: Re-exports the /etc/exports file if you''ve made changes.


    For NFS, you need to run several commands in Konsole, starting with this one:

    $ portmap

    portmap essentially translates RPC numbers into networking port numbers. When
    a server (for instance, your Knoppix running NFS server) receives an RPC call,
    it uses portmap to send that call to the right network port. Without portmap,
    NFS doesn''t work.


    > Don''t know what an RPC is? Head over to Wikipedia and read http://en.wikipedia.com/wiki/RPC.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_111_0.png)


    Other commands include stop (sudo /etc/init.d/portmap stop) and restart sudo /etc/init.d/portmap
    restart). For more information about portmap, use man portmap.

    Next, start two services by running the following:


    ```

    $ sudo /etc/init.d/nfs-common start

    $ sudo /etc/init.d/nfs-kernel-server start

    ```


    That gets NFS up and running.

    With NFS on, anyone running an NFS client on Dante should be able to mount and
    connect to the shared /tmp directory on Homer. To mount the shared directory,
    run the following commands as root in Dante:


    ```

    # mkdir /mnt/homertmp

    $ mount -t nfs homer:/tmp /mnt/homertmp

    ```


    The first command creates the mountpoint; the second does the actual mounting.
    You can run ls /mnt/homertmp and see the contents of the /tmp directory on Homer
