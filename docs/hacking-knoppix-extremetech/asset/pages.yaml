  md: '# Recommended Extensions


    I keep an updated list of my installed Firefox extensions on my Website (http://granneman.com/go/extensions/),
    and if you want to see what I''m using right now, check it out. For now, I recommend
    the following as indispensable:


    +   - Adblock: Look for this in the Miscellaneous section at Mozilla Update. Annoyed
    by ads on Websites? Just right-click an ad, select Adblock Image, and say bye-bye
    to that bothersome ad. You can also use regular expressions to block all ads from
    a certain domain, or matching a particular pattern. You can import the Adblock
    lists other folks have created; search Google for "adblock import filter list"
    and try out the ones you found.

    - Jybe: http://jybe.com/download/register.aspx. Jybe enables you, and anyone else
    who installs Jybe (IE for Windows, for Linux, Mac OS, or Windows), to collaboratively
    view Web pages in real time and chat about what you''re seeing. Perfect for demos,
    work sessions, troubleshooting, or long-distance support.

    - miniT: Look for this in the Tabbed Browsing section at Mozilla Update. With
    this extension, you can drag your tabs to reposition them in any order you''d
    like. As you drag a tab, a tiny arrow appears, making it clear where your tab
    is going to go.

    - SessionSaver: Look for this in the Tabbed Browsing section at Mozilla Update.
    If you''ve ever suffered a Firefox crash and all of the Websites you had in your
    tabs, you''ll need SessionSaver. Load this extension and forget about it. Firefox
    crash? Restart Firefox, and everything is restored: tabs, histories, cookies,
    everything. Close Firefox with a series of tabs open? Restart Firefox, and they
    reappear.


    There are, course, more extensions—you can see my full list at my Website and
    look around Mozilla Update and elsewhere. There''s an amazing amount of innovation
    going on in the area of Firefox extensions, so you''re sure to find something
    wonderful.


    # Focusing Your Searches


    Firefox comes with a lot of neat search tools built in, both obvious (the search
    box in the upper right corner) and not so obvious (press Ctrl+F to open the search
    bar at the bottom of the window, or highlight a word or phrase and right-click
