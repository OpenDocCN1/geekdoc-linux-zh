    # Summary


    In the modern era of computing, it''s all about connectivity, and Knoppix helps
    make things easy. Whether it''s controlling other machines or letting other machines
    control it, using FTP or its vastly more secure SFTP and SCP, logging in and running
    commands with SSH, sharing files and printers with Samba and NFS, or even up Web
    pages with Apache, Knoppix is ready to do the hard work that makes your life easier.


    This is important stuff, and it''s the base for a lot of later information about
    data recovery, make sure you take some time to really familiarize yourself with
    the various options that Knoppix makes available to you for connecting to other
    machines and resources. You won''t regret it—and it may just save your bacon down
