  md: '# Sharing Files with BitTorrent


    Knoppix doesn''t include any file-sharing apps by default, and that''s OK. Most
    file sharing is focused on music or movies, which isn''t super-important when
    you''re in Knoppix. Most file-sharing software is slow and inefficient anyway.
    BitTorrent (BT for short) is a better way to download and share the ISO images
    and other large files that you need to grab when you''re running Knoppix.


    Most file-sharing software works as follows: You search for a file, and your search
    is either against an index of files kept on a central server (the Napster model,
    which tends to get pieces inside the group) or against the indexes generated and
    each individual computer (the decentralized Gnutella model, which makes it harder
    for RIAA and MPAA to track and shut down so-called pirates—copyright infringers—but
    also results in really slow searches). Once you''ve located a file, you download
    it from the computer that has it, a process that is sloooooow, even on a fast
    connection.


    BitTorrent is completely different. In essence, BT breaks enormous files into
    hundreds or thousands of small pieces. When you begin downloading a file using
    BT, you''re actually downloading those pieces from everyone who has any of those
    pieces on their computers. So as you''ve downloaded a piece, BT shares it with
    anyone else trying to acquire the file. Instead of downloading an entire file
    at once from one machine, you''re downloading pieces of that file from several
    machines at the same time—and returning the favor by sharing your pieces as well.
    The result? The more popular the file, the faster the download, sometimes (to
    quote Mel Brooks'' Sphere) "lucicrous speed.


    +   Note For more information about BitTorrent, read the official BT home page
    at http://bitconjur.org/BitTorrent/, the Wikipedia article on BT at http://en.wikipedia.org/wiki/BitTorrent,
    or Brian''s BitTorrent FAQ and Guide at www.desnent.net/btfaq/


    Try BitTorrent by downloading the latest version of Knoppix using. Using your
    web browser, go to http://torrent.unix.au-kl.de, the UNIX-AG BitTorrent Tracker,
    and find the latest version of Knoppix in your language (either EN for English
    or DE for German). Click the DL link (for download) next to Knoppix you want to
    save, and the torrent file (a whopping 55KB) to your desktop. And now... what?
    Nothing happens. Where''s the ISO image?


    To find other files, use Google. You can find music (especially "jam band" stuff),
    software and OS ISOs, movies, and more. Legal?


    +   Tip Well, remember that Knoppix doesn''t come with any file-sharing apps,
    including BitTorrent, by default. To do anything with that torrent file you''ve
    downloaded, you need to install BT. Fortunately, you can use APT (discussed in
    Chapter 1) and the Knoppix persistent disk image, so you can restart Knoppix later
    and continue to use the BT software you install.


    Different BT software packages are available, the "real" BitTorrent software packages
    made by Bram Cohen, the inventor of BT. They''re fine, but a BT client called


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_78_0.png)'
