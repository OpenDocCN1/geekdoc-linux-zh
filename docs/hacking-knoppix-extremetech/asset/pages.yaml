  md: '# Configuring Your World


    Start by booting your favorite Knoppix disk, the one that you''re soon going to
    use as a basis for Mypupp. Once Knoppix has finished booting, change things to
    your liking. For instance, there are a few things you might do whenever you start
    out with a brand-new Knoppix:


    +   - Change the fonts: See "Beautifying Knoppix" in Chapter 1. Set your font
    choices-where, so that all your programs and KDE itself, look nice, crisp, and
    readable.

    - Set up your printers: Using the advice given in the section "Setting Up Printers"
    in Chapter 1, you can set up all of the printers you might use with your Knoppix—your
    home printer(s), your office printer, your friends'' printers—ahead of time.

    - Choose your text editor: If your text editor of choice is vim, for example,
    you probably have a .vimrc file (and a .vimrc for times you use vim with a GUI).
    Copy those files into Knoppix. Do you have any scripts that reside in your ~/.vim
    directory? You''ll want to copy them, so you''ll be ready to work with any text
    file.

    - Set up other system files: There are other important config files that you may
    have available when customizing your Knoppix distro boots. Here are some examples:
    ~/.bashrc (aliases alias), ~/.gpg (be careful with this—remember that it contains
    your PPG keys!), ~/.mozilla (actually the location of your Firefox bookmarks,
    settings, and extensions), and ~/.openoffice.org. Again, copy any important or
    customized files and directories to your running instance of Knoppix.

    - Set your KDE preferences: Your ~/.kde directory contains several important files
    that control how your KDE works. If you''re in a hurry, you just copy the entry
    ~/.kde/share/config directory from your Linux machine to the computer that''s
    running Knoppix. If you want to go the slow ''n'' steady route, once Knoppix is
    running, make all your changes using the KDE Control Center and the Preferences
    found in the KDE programs you run.

    - Copy your ~/bin directory: If you''re always writing (and finding) new scripts
    that make your life easier, you undoubtedly follow good Linux practice and keep
    them in ~/bin, so you certainly want to copy that directory, too.

    - Rearrange your KDE panel: When you first start KDE, it creates a default panel
    (see Figure 12-1) at the bottom of your screen.'
