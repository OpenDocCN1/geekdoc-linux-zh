  md: '# Chapter 12 — Creating Myppix, Your Personal Knoppix 249


    If you want to remove 196MB of software you don''t need, type Y, press Enter,
    and watch as APT purges those packages from the machine.


    In the spirit of removing internationalization files, you can get rid of German
    Firefox files as well:


    ```

    # apt-get remove --purge mozilla-firefox-locale-de-mozilla

    --firefox-locale-de-de

    ```


    That''s another 864KB purged.


    If you rely on OpenOffice, and you''ve been dumping the internationalization files,
    purge the combined German/English version of OpenOffice that comes with Knoppix:


    Now install OpenOffice.org, and other packages that OoO uses, but in just the
    English edition:


    ```

    # apt-get install openoffice.org openoffice.org-mimeink

    openoffice.org-kde openoffice.org-hyphenation-en-us

    openoffice.org-thesaurus-en-us openoffice.org-help-en

    -t unstable

    ```


    By running this command, you have install extra packages, but that''s fine. And
    more important, you''re getting your toolkit in place just the the way you want
    to.


    If you like the vim editor and use emacs, you can gain a little more space with
    this command:


    ```

    # apt-get remove --purge emacs21-common emacs21-bin

    --common emacsen-common

    ```


    Then update vim:


    ```

    # apt-get install vim-common vim-gtk vim-scripts vimart

    vim-doc -t unstable

    ```


    You may recall removing the dev files from Archix in Chapter 11. That''s a huge
    process, if you''d like to delete those files from your distro, just follow the
    instructions in that chapter.


    Now what? When you''re writing, new versions of Mozilla Firefox and Thunderbird
    are out, and you probably want to upgrade to those. Find out whether they''re
    available, run the following command, which tells APT that you want to upgrade
    the unstable (which means beta, roughly) set of Debian packages for that software.
    After the command, however, when you''re asked if you want to do the full, humongous
    upgrade of all packages to Unstable, immediately press n for No.


    ```

    # apt-get upgrade -t unstable

    ```


    I''m serious! Do not press Y! Press n! Otherwise, you''ll be installing about
    50 gazillion packages.'
