  md: '# Exploring Helix


    Helix has two claims to fame: a sharp focus on Incident Response and Forensics,
    and that it is used by the world famous SANS (SysAdmin, Audit, Network, Security)
    Institute during training in "System Forensics, Investigation, and Response."
    Because it''s used by SANS, Helix is kept up to date: as of this writing, the
    latest release is March 2005.


    Helix has been carefully calibrated so that it does not touch the host computer
    in any way, leaving the machine and its forensics soundly. In other words, Helix
    does not automount the host machine''s swap space, and it does not automount devices
    like hard drives and USB flash drives.


    Another cool feature of Helix is that it contains a lot of neat tools for working
    with Windows computers in addition to the infinite available for "nis boxes. Getting
    Helix is easy: Just head over to www.e-fense.com/helix/downloads.php and grab
    the ISO image using HTTP, FTP, or BitTorrent. Burn the ISO to a CD, boot your
    computer with it, and you''re ready to use Helix.


    Helix uses the Xfce window manager (yes, yet another window manager... remember,
    no one said that consistency was an overriding goal of these distros). A taskbar
    at the top of your screen opens applications and files, while the bottom contains
    the Xfce menu, which is a Startlike menu; a clock; various system diagnostic tool;
    and links to common programs.


    For some reason, the default color scheme for Konsole in Helix produces un text.
    The solution is to select Settings -> Schema, and change from Transparent, Dark
    Background to White on Black. Ah, much better!


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_210_0.png)


    If you need more aid with Xfce, select Xfce -> Help for an HTML-based manual that
    covers all of basics and then some.


    Helix comes with hundreds of extremely useful security tools (the full list is
    at http: //e-fense.com/helix/contents.php), organized into the following categories:


    +   - Incident response and forensics

    - Network utilities

    - Servers

    - Packet sniffers and assemblers

    - Vulnerability assessment

    - Wireless tools'
