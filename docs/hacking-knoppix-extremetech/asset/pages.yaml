  md: '# 116 Part II — Rescuing and Recovering Systems Using Knoppix


    > Tip

    After you have saved all the files you think you need, it is always a good idea
    to verify that the data you saved is correctly archived. Navigate the backup medium
    and open random files (those that can be opened) to ensure that the data is valid.


    # Saving Data to a USB Jump Drive


    Knoppix recognizes your USB jump drive almost immediately after the drive is plugged
    in. From that point, it is a trivial matter to save data from your Windows partition
    to the key drive, which is represented by the USB icon on the desktop. To save
    to the jump drive, you only need to make it writable by right-clicking the jump
    drive, and selecting Properties. Select the Device tab, which looks like the dialog
    shown in Figure 5-12, and then un the Read Only box to enable writing to the drive.
    Click OK to close the window, and you''re good to go.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_141_0.png)


