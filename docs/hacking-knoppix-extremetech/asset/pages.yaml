- img_proc: true
  md: '# 264 Hacking Knoppix


    Cheatcodes processed during this phase are noject and noprompt. Because of the
    way the scripts are currently written, if you specify prompt (which instructs
    Knoppix not to prompt you to remove the CD and press Enter), you must also specify
    noject (which tells Knoppix not to eject the CD). If you specify only prompt,
    Knoppix hangs just before rebooting.


    # Tips, Tricks, and Troubleshooting


    The following sections contain a collection of tips and tricks that you can use
    to troubleshoot the boot process or to customize your Knoppix environment.


    # Blank Screen: Now What?


    Remember the scenario described in the opening paragraph of this appendix? Your
    CD worked just fine on a friend''s computer, yet when you put the same CD in your
    machine all you see is a blank screen. What''s going on?


    There could be a number of reasons why you''re getting a blank screen, but they
    depend on where in the process you get. To determine that, boot with this command:


    ```

    knoppix vga=0 debug - 3

    ```


    Do you get to the bootloader phase? If not, you may want to explore some of the
    options mentioned in the section "Examining the Bootloader Phase," earlier in
    the appendix. If you get past the bootloader phase, how far do you get into the
    text phase? If you do not get to stage 1, the most common problems seem to be
    issues with VGA settings, power settings, PNP settings, and PNP BIOS, as mentioned
    earlier. Reboot your machine and try booting with this command:


    ```

    knoppix vga=normal noapic noacpi pnpbios=off acpi=off noapm

    debug - 3

    ```


    If that doesn''t work, then, as mentioned before, you can turn off several more
    options using failsafe debug -b


    Once you get to a shell prompt, enter cat /proc/cmdline to see the text of the
    successful boot command line. You can optimize your boot command by methodically
    removing the cheatcodes that failsafe uses:


    | ataptic | nosound | |

    | noacpi | pnpbios=off | acpi=off |

    | nofstab | noscsi | nodma |

    | noapm | nousb | nopcemcia |

    | nofirewire | noagp | nomce |

    | nodhcp | | |'
