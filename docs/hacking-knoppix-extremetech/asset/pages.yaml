- img_proc: true
  md: '# Appendix A — Booting Knoppix 257


    Notice the boot prompt, boot:: To see a list of some of the cheatcodes, press
    F2 for page or F3 for the other. To return to the splash screen, press F1. (More
    on cheatcodes in a bit.)


    Knoppix lists only a few of the cheatcodes when you press F2 or F3. You can find
    a more complete list on the CD. If your drive is letter D:, the list is in D:\KNOPPIX\knoppix-cheatcodes.txt.
    If you boot with Knoppix, the list is in /cdrom/KNOPPIX/knoppix-cheatcodes.txt.


    To move on to the text phase, enter knnoppix 3


    at the boot prompt. A bunch of text flies by and then you will see a shell prompt
    that looks like the

    root@tty1[#]


    Now you''re in textmode, which you use your keyboard to interact with Knoppix
    via the command line.


    To enter the graphics phase, enter 5 at the shell prompt. After a few graphics
    services start up, the KDE Desktop (see Figure A-2) opens on your screen. In graphics
    mode, you use your mouse (keyboard, especially your mouse) to interact with Knoppix
    via the graphical user interface.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_282_0.png)


    FIGURE A-2: Knoppix in graphics mode.'
