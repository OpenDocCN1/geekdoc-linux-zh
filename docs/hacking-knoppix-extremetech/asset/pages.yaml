- img_proc: true
  md: '![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_53_0.png)


    Remember that Knoppix is using your RAM as its hard drive, so you may not be able
    to write an ISO image unless you have enough RAM to hold it. run the df -h command
    in Console and note how much free space is available on the /ramdisk row. If you
    don''t have enough room, check how much is available on one of your mounted hard
    drives. If there''s space, mount the hard drive with write access (right-click
    on the icon on Knoppix desktop, select Properties, open the Device tab, check
    Read Only, and mount the drive). One last step: Tell K3b that you want to use
    your hard drive to hold the ISO by changing the path for Write Image File To (which
    is no longer grayed out once you uncheck On Fly on the Writing tab) so that it
    points to your newly mounted hard drive. Yes, it''s a lot of work, but that''s
    what happens when you''re using a Live CD.


    It''s generally a good idea to select Verify Written Data (the final option on
    the Writing tab), which compares what was burned to the original data, thereby
    letting you know if something didn''t work correctly.


    # Burning in Sessions


    You need to change the settings on the Data Project''s Settings tab (see Figure
    1-20) only if you plan to add content to your CD over several different burning
    sessions.'
