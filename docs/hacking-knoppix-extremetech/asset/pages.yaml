    # Summary


    Even the best of us can occasionally make mistakes or have things spin wildly
    out of control. When times get tough, the tough pull out Knoppix, boot with it,
    and fix their issues. From just making sure that a machine will run Linux to patching
    up problems with booting, to repairing important files used by Linux, to retrieving
    busted partitions, Knoppix is there to solve your problems and keep you looking
    as cool as you really are.'
