    The three options are as follows:


    +   - **Debian (recommended):** Installs a derivative of full-fledged Debian Linux
    (www.debian.org), which will behave like most regular hard-drive native Linux
    distributions. This is the preferred type.

    - **Beginner:** Installs a multiple-user (more than one user on the same system)
    package with specialized hardware detection for the machine on which it is being
    installed.

    - **Knoppix:** Installs the packages in such a way that the system behaves exactly
    as if you had booted off a CD.


