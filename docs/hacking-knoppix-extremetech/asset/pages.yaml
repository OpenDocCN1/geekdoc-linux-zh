    # dpkg-query -W --show=''$(Installed-Size) {Package}\n'' ↴

    | sort -n

    ```


    is really one line of code when you type it into your editor.


    Code, filenames, functions, and so forth within the text of this book appear in
    a monospace font, while content you type appears either **bold** or monospaced.


    # Hacking Precautions


    There is no way that just booting Knoppix on a computer can damage that machine.
    In fact, that''s one of the beautiful things about Knoppix you can boot it, play
    it with all you want, reboot and take the Knoppix CD out, and your machine remains
    untouched. However...


    You still need to be careful with Knoppix, because it is possible—if you know
    how, and you will be learning how-delete key system files on your computer, blow
    up system partitions, and in general render your nice Windows or Linux machine
    into an unbootable hull of plastic and silicon that will require either a reinstall
    or a system rollback (if you are using Windows XP''s system restore feature) to
    work again.


    Hey, don! That doesn''t mean that Knoppix is dangerous. It just means that it
    is a powerful tool, and like any powerful tool, you need to treat it with care
    and respect. Keep your head about you as you read this book and try to out the
    techniques demonstrated for you. A good backup wouldn''t hurt either (but then
    again, it never does).


    So have fun with Knoppix, but be careful too. You''re to start learning more about
    one of the coolest, most innovative, and most powerful software tools available
    today. Make sure you''re responsible—your computer will thank you.'
  merge: -1
