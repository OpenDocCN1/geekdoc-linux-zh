  md: '# Chapter 3 — Connecting to Other Machines and Resources 73


    Of course, you can go in the other direction just as easily: To upload a file,
    simply drag it from your Desktop, or anywhere else, drop it in your Konqueror
    window, and your upload begins. You can grab multiple files at the same time if
    you really want to make things quick.


    It might not have been obvious to you, but Konqueror does the job and is actually
    a great FTP program. Try it and you''ll see.


    # Exploring SSH and Its Descendants


    As discussed earlier, FTP is insecure because it doesn''t protect your traffic
    during authentication or transmission of data. The same problem is inherent in
    Telnet, which is used to log in to other machines and run commands. First described
    in RFC 854 in May 1983 (and still available at www.ietf.org/rfc/rfc854.txt), Telnet
    is another of those protocols that were never built with security in mind. My
    advice? Avoid Telnet. Use completely, because it is simply too dangerous and unsafe.
    Use SSH.


    SSH (secure shell) was first written by Tatu Yönen of Finland in 1995 as a replacement
    for Telnet (as well as login and ssh, which other include secure programs), although
    the version you''re now using with Knoxious is quite separate from Yönen''s proprietary
    implementation. SSH is really an amazing program, one that would be a centerpiece
    of Knoxious toolkit. With SSH, you can connect to other machines and run commands,
    transfer files securely, and much more. It''s one of those programs about you
    can always learn something new.


    # Ensuring SSH Is On for Secure Connections


    In order for you or others to connect to your Knoxious via SSH, you need to enable
    the SSH daemon. Klaus and the other Knoxious developers have made this drop-dead
    simple: Just open the Knoxious menu and select Services → Start SSH. You''ll be
    prompted to assign a password to the user knoxys, go ahead and enter a good one
    (you won''t see what you''re typing as a security measure). After Knoxious accepts
    your password, press Enter to close the window. SSH is now running and capable
    of accepting logins from the user knoxys.


    To enable new ssh, simply add new system users using the user command on the command
    line, or with KUser, available at K → System → KUser. The root password (from
    the Knoxious menu select Root Shell, enter passwd,, and type a new password for
    root), go to User → Add, and give your new user access. Once someone is a system
    user, you can SSH into your computer and get to work.


    # Using SSH


    To SSH into another box, just open Konsole (the Terminal Program icon on the panel),
    type ssh username@machine, and press Enter. For example, if I were user scott
    on machine work.wiley.com, you could enter ssh scott@work.wiley.com. SSH prompts
    you for a password; type it in, press Enter, and you''re in.'
