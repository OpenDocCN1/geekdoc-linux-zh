    # ## Emailing Data to Yourself


    Another option that many people don''t think of is email the data to yourself.
    With today''s large-capacity sizes of both Web-based email services (thank you,
    Gmail!) and personal email services, you can generally send any data you need
    backed up via email with no worries about the capacity of the mail account. You
    do, however, still need to take into account that your email service probably
    has some limit on the size of attachments. For example, Gmail limits attachments
    to a maximum of 10MB.


    To save data, simply use KMail (covered in Chapter 2) or Thunderbird, available
    via Knoppix -> Internet. Set these up to use your POP or IMAP account, and then
    attach your recovered files and send the mail. If you use a Web-based email account
    such as Yahoo! or Gmail, you can simply use Firefox or Web browser and attach
    the files as you would normally.


    > > **Caution** Be aware that email is not typically an encrypted method of transmission,
    meaning that someone intercepting your files will be able to read the data.'
