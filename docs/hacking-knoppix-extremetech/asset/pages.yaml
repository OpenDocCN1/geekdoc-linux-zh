  md: '# 42 Part I — Navigating the Amazing Knoppix Toolkit


    # Comparing Two or More Files with Kompare


    Kompare is a GUI wrapper for the diff program, an ancient (the 1970s!) UNIX utility
    that displays the differences between two text files. Here''s an example that
    explains how Kompare—and diff work. One of us has been working on a poem for a
    while (more than 12 years), and periodically it is edited. The original file is
    titled hoarding_our_lives.txt; after a few tentative changes, it was saved as
    hoarding_our_lives_2.txt. After reading the second one, it wasn''t clear which
    one was better, but trying to compare the two files was a bit of pain. Enter Kompare.


    Start Kompare from the K menu by selecting Development -> Kompare. The Compare
    Files Files window opens, and you''re asked to choose your files. Here''s our
    advice: don''t do it! Instead, choose the diff on the left side of the window,
    enter /usr/bin/diff in the Diff Program textbox, and go back to choosing the files
    you want to compare by clicking the Files icon. The source file is hoarding_our_lives.txt,
    and the Destination file is hoarding_our_lives_2.txt (you choose one, of course).
    Then click the Compare button. Kompare opens, looking like what is shown in Figure
    1-29.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_67_0.png)


    FIGURE 1-29: Kompare compares two files, highlighting the differences.


    Kompare is a really neat tool if you want to see the differences between two files.
    It has highlighted the following differences between the two poem files:'
