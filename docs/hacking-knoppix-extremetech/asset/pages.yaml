    # # Summary


    Security is one of things you are forced to think about, whether you really want
    to or not. Fortunately, Knoppix makes it easy not only to check the security status
    of your network but also to learn about security and have fun while you''re doing
    so. You can use Knoppix to encrypt your data, check for vulnerabilities, sniff
    packets streaming by on a network, perform forensic analysis on a compromised
    system, and wipe a hard drive. All of these are key tasks, and even if you don''t
    know how to do them right now, Knoppix helps you learn so that you can protect
    not just your own networks, but those of your clients, family, and friends as
    well.'
