    can view what it has found (see Figure 8-6).


    If you had Retriever copy everything to a USB flash drive, you now possess exact
    copies of the files that Retriever located, which you can examine at any time.
    As you can see, Retriever is quite useful now, and it should continue to improve
    for the Helix developers working on it.


