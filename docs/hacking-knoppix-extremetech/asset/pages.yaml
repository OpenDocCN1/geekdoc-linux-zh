  md: '# # Taking Charge When Key System Files Have Problems


    Sometimes Windows has files that are corrupted or missing, which seriously impairs,
    or even prevents, the operation of the system. If you''ve encountered this before,
    you know that one of your options is to start from scratch or try to recover the
    system using the draconian Windows Startup and Recovery system. The toolkit included
    in that is sparse at best and difficult to use. Knppix, conversely, provides a
    friendly and very powerful environment in which to fix certain issues you may
    encounter when problems pop up.


    By default, Knppix can read a large set of filesystems out of the box, but it
    doesn''t support writing to certain filesystems. There are some known issues with
    Knppix 3.8 and later regarding NTFS filesystems (the default for Windows XP and
    later). These filesystems require the use of a program called captive-ntfs (http://jratkovich.net/project/captive/)
    to allow write access, which is crucial for editing files on the system. By default
    because of lack of active project development and other concerns regarding corruption
    of data. (There is another system in place—UnionFS—that promises to provide this
    support. It isn''t fully developed yet, so it only gives the appearance of writing
    to the NTFS partition.)


    Earlier versions of Knppix (3.7 and earlier) include captive-ntfs, but if you
    are using Windows XP Service Pack 2 (SP2), take the steps identified in http://kb.bitdefender.com/site/KnowledgeBase/viewArticle/en/100/Problem_with_Linux_Defender_and_Windows_XP_SP2_.html
    to enable read/write capabilities.


    # ## Accessing boot.ini to Resolve Start Issues


    The boot.ini file is used by Windows NT-based systems (NT, 2000, XP, 2003) to
    boot the system into the correct operating environment by displaying a list of
    Windows-recognized operating systems and directing the system toward the selected
    environment. If the file is corrupted, damaged, or missing, you cannot boot your
    Windows system properly. The boot..ini file can become corrupted if you reboot
    your system properly, or may be missing if someone deletes it, accelerates it,
    or well, there are many other causes for that error.


    If you boot your system and get an invalid boot..ini could not start error message,
    the most likely culprit is an invalid or corrupted boot..ini file. To correct
    this problem, you need to either edit your existing .ini file or create a new,
    generic one. First, you must make the Windows partition that your core system
    resides on writable (Knoppix makes all existing partitions read only) by right-clicking
    the drive on the desktop and selecting Properties. In the Device tab, make sure
    that Read Only is unchecked to make the drive writable. Don''t do this unless
    you are on an NTFS partition.'
