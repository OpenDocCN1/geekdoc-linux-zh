    \ from the beginning of the original file, so it's now part of)\n\nClose this\
    \ file and go back to the original. Once again, select File $\rightarrow$ Export\
    \ WAV, navigate, and save the file as clayton_christensen-_-capturing_the_upside_2.wav\
    \ (because it's the second half of the original). The original WAV file isn't\
