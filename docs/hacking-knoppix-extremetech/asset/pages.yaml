    # gzip minirt

    ```


    The updated RAM disk now resides at

    /home/knoppix/knoppixiso/boot/isolinux/minirt.gz.


    # Copying the Kernel


    The last step is to replace the actual kernel on your Live CD ISO. Copy it from
    the /boot directory in your knoppixiso directory, overwriting the one previously
    used to boot Knoppix. For example:


    ```

    # cp /home/knoppix/knoppixuncompressed/boot/

    vmlinuz-2.6.11 /home/knoppix/knoppixiso/boot/isolinux/linux

    ```


    If you have installed a different kernel, check the /boot directory of your chroot
    for the correct name; the kernel name will start with vmlinuz and typically have
    the kernel version appended.


    Survived until now? Everything worked as planned? Well done, because you have
    successfully replaced the Knoppix kernel! If something went wrong rethink your
    steps: Replacing the Knoppix kernel is an error-prone process and is likely to
    take a few tries before success is'
