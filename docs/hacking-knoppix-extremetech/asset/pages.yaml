  md: '# ## Text Editors


    Linux is a testament to the continued power and relevance of plain '' text files.
    Virtually all configuration information is stored in text files, and many programs
    are really just scripts in text files. Learn how to edit text files effectively,
    and you''re well on your way to becoming a mighty Linux (and Knoppix) guru!


    # ### Editing Configuration Files on the Command Line with vim


    Want to start a discussion that will quickly become a debate and eventually escalate
    into an argument? With all the innocence you can muster, a bunch of Linux users
    will, "Which is better? Emacs or vi?" and then step back and watch the fireworks.
    It''s one of the oldest debates in the ''nix world, and Knoppix comes down square
    in the middle: It includes both editors, leaving the choice up to you.


    We believe that (actually vim, or "vi improved") is the better of the two editors,
    and we will explore it here. If you want to learn about emacs, there''s plenty
    of information on the Web and in a lot of books. You should still learn vim, because
    while you can''t be sure that emacs is on every single "nix machine you''ll run
    into, you can be certain that vi (and probably vim) will be installed. Learn vi,
    and you increase the likelihood that you can fix a machine by changing config.


    Knopp includes both console- and GUI-based versions of vim. This section covers
    the console version, for a couple of reasons. First, if you learn to use vim on
    the console, moving to the GUI is a piece of cake. Second, the GUI may not be
    available, but the console will.


    Suppose that you need to edit your hosts file so that you can more easily ssh
    to a couple of the boxes on your LAN. Open Console (it''s the black icon on the
    desktop) and run cp /etc/hosts to copy the file to your home directory. Now type
    vim hosts and press Enter, and the newly copied hosts file opens (see Figure 1-24).


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_59_0.png)


    Figure 1-24: Editing a copy of the /etc/hosts file with vim.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# # Chapter 1 — Unraveling Knoppix Toolkit Maze 35


    If you''ve never used vim (or even emacs) before, you''re probably a bit confused
    at this point. What do you do? Why doesn''t anything appear when you are starting
    typing? How do you save? Or quit?


    The first thing to understand is that vim operates in one of several modes at
    a time. When you first open vim, it''s in command mode, in which you use your
    keyboard to move the cursor, delete information, cut, copy, and paste, and run
    commands that help your file (because this is a console app, you can''t use your
    mouse). You want to position the cursor so that you can enter some data. To do
    so, use the arrow keys on your keyboard (because Knoppix supports them), or use
    the following key commands:


    +   - h: Moves the cursor one character to the left.

    - j: Moves the cursor one character down.

    - k: Moves the cursor one character up.

    - l: Moves the cursor one character to right.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_60_0.png)


    To learn more about vim and all of its commands, just type `vim` on the command
    line, and then : help to enter vim''s built-in help system (:q to get out of help,
    or course) or look on the Web by searching for "vim tutorial,"vim tips," or "vimrc"
    if you want to find sample vim config files people have posted, which can teach
    you a lot.


    Position the cursor at the end of the first line and press. Now you''re in the
    insert mode


    For this example, press Enter so you''re on a new line and enter three new lines
    into the hosts file, pressing Enter after each one to start the start:


    ```

    192.168.0.10    dante

    192.168.0.15    chaucer

    192.168.1.20    virgil

    ```


    You know you should save your work often, but don''t do that while you are inserting
    text. The solution? When you insert mode, press Esc to return to command mode.
    Now enter `:w` (colon, w) to save the file. To write out (colon) and immediately
    quit (exit), use `:wq` (colon, w, q); to quit without saving your work, use `:q!`
    (colon, q, exclamation).


    For this example, there are a couple of problems with what you just entered, and
    here''s how to fix them. Chaucer is temporarily offline, so it doesn''t need to
    be in the hosts.file. You''re still in command mode, maneuver the cursor (using
    the arrow keys or key commands) until it''s somewhere in the Chaucer line. To
    delete a line, enter `dd` while in command mode; the entire line disappears.


    The second problem is a typo in the line about Virgil: The IP address is 192.168.0.20,
    192.168.1.20. To easily correct: Position the cursor over the 1, press x to delete
    just that character, press i to enter insert mode, type a 0, press Esc to go back
    into command mode, finish with `:wq`, which writes the file out and quits vim.'
