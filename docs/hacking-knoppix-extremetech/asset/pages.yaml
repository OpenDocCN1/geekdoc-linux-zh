  md: 'For more information on the GIMP, check out the program''s Website at www.gimp.org.
    Users have written a lot about the GIMP online; search Google and you''re sure
    to find much more information about virtually every aspect of the app.


    # Manipulating Graphics via the Command Line with ImageMagick


    The GIMP is a great program, it''s a GUI app. If you want to speed or scriptability,
    turn to ImageMagick, a command-line program that is amazingly comprehensive and
    powerful. There''s a lot to learn, and it bears your careful reading. For more
    info, see the program''s Website, at www.imagemagick.org.


    Let''s look at a couple of ways that you can use ImageMagick. It is hoped that
    these will start to give you some ideas that will inspire you to do far cooler
    things (if you develop something, share with us — we''re always adding new tricks
    to our toolbox).


    In preparing this book, we took a lot of screenshots. We could use KDE''s screen
    capture utility, KSnapshot (available from the K menu by Selecting Graphics →
    KSnapshot), but it doesn''t save in TIFF format, which is our publishers-want.
    We used ImageMagick and the following lines, inserted at the bottom of the .bashrc
    file in /home/knoppix:


    ```

    # screenshot of chosen window, incl. kde frame

    alias window=''sleep 3; import -depth 8 -frame window.tif

    # screenshot of selected area

    alias selection=''sleep 3; import -depth 8 selection.tif

    # screenshot of entire screen

    alias screenshot=''sleep 3; import -depth 8 -window root screen.tif

    ```


    After adding these lines to .bashrc, don''t forget to run source ~/.bashrc so
    you can immediately begin using your new commands.


    The sleep 3 command gives you three seconds to get things up before the screenshot
    is taken; if you need more (or less) time, change the number. The import command,
    part of ImageMagick, does the real work. It grabs an image of the window, a selection
    of the screen that you specify by clicking and dragging a box, or the entire screen,
    depending on the name of the file at the end of the command. If you don''t want
    the image to be TIFF, change the extension to .jpg, .gif, or whatever you would
    like.


    We used -depth 8 in the command because ImageMagick takes a 16-bit TIFF, which
    causes the GIMP and other programs in Knoppix to complain. If you''re not saving
    the image as a TIFF, remove the option.'
