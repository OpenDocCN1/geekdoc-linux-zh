  md: '# # Fixing Windows with Knoppix


    You or someone you know will encounter a seemingly unfixable Windows system environment
    at one time or another. When this occurred in the past, most users would reinstall
    their operating systems, sometimes wiping out significant amounts of data that
    was needed on the system. Now you can use Knoppix to (often) correct your Windows
    system problems without losing any data and save the time associated with reinstalling
    all of the operating system files and applications.


    # ## Resizing Windows Partitions


    Partitioning is a simple scheme for segmenting your physical hard drive into different
    sections. Power Windows users typically partition their hard drive for performance
    and backup reasons or allow for different operating systems to be installed on.
    When the system is first partitioned, the drive sizes are determined by the installer''s
    experience and the projected needs for each partition. As time goes on, the partitions''
    size requirements may change, necessitating resizing.


    Many commercial applications, like PartitionMagic, enable you to repair your hard
    drive. They can cost $60 or more, however, and you get the same base functionality
    using tools included natively with Knoppix for no cost. This section explains
    how to resize your Windows partition or other types of partitions using Knoppix
    and QTParted, which is a user-friendly graphical front end for the command-line
    partition resizing tool *parted*.


    QTParted worked on the following Windows partition types (as well as Windows file
    system types):


    +   - FAT16: Used primarily with Windows 3.1 and earlier versions of MS-DOS

    - FAT32: Used by Windows 95, 98, and ME primarily

    - NTFS: Used by the NT based versions of Windows, including NT, 2000, XP, and
    2003


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_130_0.png)'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# Preparing to Partition


    Before you resize your partitions, defragment your hard drive if you can. This
    process, very simply, rearranges the hard drive, putting your files together in
    a logical manner as possible, usually in a group, and checking for errors.


    Although partitioning with the tools described in this chapter are time tested
    and have been used by many, people, there is always the chance of an inadvertent
    input error on your part or the possibility of some unforeseen circumstance, so
    back up your important data.


    Determine what you want the filesystem layout to be after you have resized partitions,
    including the sizes of the partitions. You will need this information to use the
    tool in the most effective manner. For example, if you have a single partition
    on the entire drive consisting of 100GB and you want to make room for a secondary
    Windows or Linux partition of 10GB, you would resize the primary partition to
    90GB, leaving 10GB for the new partition to be created.


    The GPTed tool cannot create space where none exists, so ensure that you have
    the requisite amount of space available before you attempt to resize. If your
    100GB partition is filled with 98GB of data, for example, you''d only be able
    to create a new 2GB partition because that''s how much space is available.


    # GPTed Partitioning


    Ready to partition? Boot your Windows machine with Knoppix and choose Knoppix
    -> GPTarted. A screen similar to the one shown in Figure 5-1 opens.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_131_0.png)


    FIGURE 5-1: GPTarted''s startup screen'
