    # Accessing Files with NFS


    NFS is actually older than the SMB protocol, but it does far less. SMB enables
    you to share files and folders as well as printers, whereas NFS only shares files
    and folders. In terms of security, SMB is better in many ways because it enables
    you to control access to shares by usernames (“Are you Steve? Then access the
    finance directory, while NFS only controls shares by machine (“Are you coming
    from the machine Dante? You are Great!; then no matter what machine you actually
    are on that, you''ll get access to the finance directory!). SMB is built into
    Windows, but it''s very well supported on Mac OS and Linux, whereas NFS is a UNIX
    protocol—you can find support for NFS on Windows, but nevertheless, if you''re
    looking to easily share files between Linux machines, NFS is quick, easy, and
    efficient.


    To start with NFS, you need to detail your NFS shares. Suppose you want to make
    the /tmp directory on the Knoppix machine Homer available to the non-Knoppix Linux
    machine Dante, for example. First you need to ensure that Homer and Dante know
    each other''s IP address. By editing /etc/hosts file, for instance, add Dante''s
    IP address 192.168.0.105 and Homer''s 192.168.0.110 to Dante''s /etc/hosts file.
    Once that task is complete (no reboots required is Linux!), the two machines can
    find each other on your network.


    Then open /etc/exports on Homer with a text editor (you need to be root, so sudo
    vim /etc/exports if you''re using the command line, or sudo k if you want to start
    a GUI editor as root), and add the following line:


    ```

    /tmp dante (rw,sync)

    ```


    > You must be very careful when you are entering the line in the exports file.
    Notice that there is no space after the machine name and before the parenthesis,
    and do not put spaces in there, or you will accumulate bad security karma. See
    tldp.org/HOWTO/NFS-HOWTO/security.html for more information.'
