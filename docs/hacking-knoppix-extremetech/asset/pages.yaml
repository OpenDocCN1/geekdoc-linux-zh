    To run the ClamAV tool, right-click on the Desktop and select Applications ->
    Security -> Virus scanner clam avscan — super user. When it opens, click on the
    Database tab, shown in Figure 8-15.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_222_0.png)


