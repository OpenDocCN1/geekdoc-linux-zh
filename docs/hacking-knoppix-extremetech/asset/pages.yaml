    # # Copying Data over the Network


    Knoppix has the capability to transfer your important files over a network if
    that is the method you prefer. By far the easiest way to accomplish this is to
    have your Knoppix system run an SSH server for you. SSH provides the capability
    to interactively log into your Knoppix system as well as transfer files, all over
    an encrypted transmission, meaning that should anyone intercept your communication,
    he or she would have a very difficult time deciphering the actual data. If the
    system to which you are transferring the files resides on a Linux or Knoppix system,
    the capability to SFTP is already built into the system. If you are transferring
    your files to a Windows system, you need to download an SFTP client (one recommend
    free version is WinSCP, available at http://winscp.net).


    For more about SFTP, see Chapter 3.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_144_1.png)


    To enable a remote Linux or Windows system to connect to the Knoppix system you
    want to back up, start the SSH server on the Knoppix system by selecting Knoppix→Services→Start
    SSH Server. A unique key for encryption is generated in the window that opens.
    Enter a strong password, and then enter it the same way twice. The password you
    enter here is used when logging into the system via SFTP, and it is case sensitive,
    so make sure that you remember your exact password.'
