  md: "# Chapter 1 — Unraveling the Knoppix Toolkit Maze 23\n\nHere's another way\
    \ you can use ImageMagick: convert a list of images from one format to another.\
    \ If you have a folder full of TIFFs that you want to convert to JPGs, for example,\
    \ cd to the directory containing the TIFFs and run the following:\n\n```\nfor\
    \ i in *.tif; do convert \"$i\" \"${i%.tif}.jpg\"; rm $i; done\n```\n\nThis is\
    \ a loop that works on TIFF in the directory. It converts the file from a TIFF\
    \ to a JPEG, and removes the original TIFF image to keep things neat and clean.\
    \ Don't want the original file removed? Get rid of rm $i and the original TIFF\
    \ will remain.\n\nIf you'll be using this command, turn it into an alias. If you\
    \ have the freedom to use different formats on the fly, create an executable file,\
    \ named converting or something like that, in your ~/bin directory, paste the\
    \ line in the file, and save:\n\n```\nfor i in *.1; do convert \"$i\" \"${i%.1}.2\"\
    ; rm $i; done\n```\n\nNote that you're using variables. To run your script, run\
    \ the following command:\n$ converting tif jpg\n\nreplaces .1, and .2 replaces\
    \ the 2 script. Want to convert a batch of PNGs to GIFs? converting png gif instead,\
    \ and so.\n\nThe final ImageMagick example is that one of us wrote one to offer\
    \ some digital photos on a Website to download and use as wallpaper. You can try\
    \ it too: Gather 50 or so images and begin each one in GIMP, saving the original\
    \ image in different common desktop dimensions, including 1024x768, 800x600, and\
