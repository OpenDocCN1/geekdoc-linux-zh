  md: '# Updating the Initial RAM Disk


    When booting up, knoppix first loads a small compressed image into memory. That
    image is called the initial RAM disk; it contains enough information (drivers
    and scripts) to start up the Linux system and hand the boot process off to another
    set of scripts elsewhere that are responsible for bringing up services on a machine.
    Knoppix accesses the larger compressed /KNOPIX/KNOPIX file. On the ISO, this image
    is at /boot/isolinux/init.gz. To have Knoppix use your updated kernel, you have
    to update the image file, too, because it contains a number of kernel modules.


    Use the following to uncompress the RAM disk:


    ```

    # cd /home/knoppix/boot/isolinux

    # gunzip minirdt.gz

    ```


    To access its contents, you have to mount the image:


    ```

    # mkdir /home/knoppix/minirt

    # mount -o loop minirt /home/knoppix/minirt

    # cd /home/knoppix/minirt

    ```


    Now comes the ugly part. You need to copy a few kernel modules, and if you are
    doing this more than once (which you probably), you should make a shell script
    to automate the process. To make matters worse, the directories, names and extensions
    of those kernel modules are hard coded and in a different location than they normally
    are. If you are restoring a newer version of Knoppix, check the locations of these
    modules in the /directory. If you have a different kernel, check its location
    in the /home/knoppix/knoppixcompressed/lib/modules/KERNEL_VERSION/kernel/drivers,
    replacing KERNEL_VERSION with the version you are using.


    Copy the new kernel modules into the RAM disk:


    ```

    # cp /home/knoppixuncompressed/lib/modules/2.6.11/lib/

    minirt/2.6.11/kernel/drivers/block/cloop.ko /home/knoppix/minirt/modules/cloop.ko

    # cp /home/knoppixuncompressed/lib/modules/2.6.11/lib/

    minirt/2.6.11/kernel/drivers/scsi/BusLogic.ko /home/knoppix/minirt/modules/scsi/BusLogic.o

    # cp /home/knoppixuncompressed/lib/modules/2.6.11/lib/

    minirt/2.6.11/kernel/drivers/scsi/s350c406a.ko /home/knoppix/minirt/modules/scsi/s350c406a.o

    # cp /home/knoppixuncompressed/lib/modules/2.6.11/lib/

    minirt/2.6.11/kernel/drivers/scsi/a100uw2.ko /home/knoppix/minirt/modules/scsi/a100uw2.o

    # cp /home/knoppixuncompressed/lib/modules/2.6.11/lib/

    minirt/2.6.11/kernel/drivers/advansys.ko /home/knoppix/minirt/modules/scsi/advansys.o

    # cp /home/knoppixuncompressed/lib/modules/2.6.11/lib/

    2.6.11/kernel/drivers/aic7xxx/aic7xxx.ko /home/knoppix/minirt/modules/scsi/aic7xxx.o

    ```'
