  md: "# Converting MP3s to WAVs\n\nAt IT Conversations (www.itconversations.com),\
    \ you can listen to streaming audio of interviews and talks by some of the leading\
    \ thinkers in technology. Streaming audio is cool, but we prefer to have files\
    \ on our machine for convenience; fortunately, IT Conversations also makes everything\
    \ available in MP3 format. You can download a bunch of MP3 files, but some of\
    \ us can't listen to someone talk while we try to write and work!\n\nYou can,\
    \ however, convert the MP3s to CD audio, so you can listen to the interviews and\
    \ talks while you're driving around in your car (if the CD player in your car\
    \ handles MP3s, you can skip this section). To convert the MP3s into WAVs, run\
    \ the following scripts, which you can name mp32wav and place in your -/bin directory:\n\
    \n```\nfor i in *.[mM] [pP3]; do\n  # convert uppercase to lowercase & space to\
    \ underscore\n  name=$(echo $i | tr '[A-Z]' '[a-z]')\n  # replace .mp3 with .wav\n\
    \  name=${name//.mp3/.wav}\n  # convert mp3 to wav\n  mp3-decoder $i --wav $name\n\
    done\n```\n\n![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_41_0.png)\n\nWAV files are\
    \ a lot bigger than MP3 files, so make sure you have enough space on your hard\
    \ drive. A rough rule of thumb is that every 1MB of an MP3 will turn into 10MB\
    \ of a WAV. Knoppix uses your RAM as \"hard drive,\" and you quickly use it if\
    \ you're not careful. Run df -h to see how much space you have on /ramdisk. If\
    \ you don't have a lot of RAM, check how much is available on one of your \"real\"\
    \ hard drives. If you do have that space on a \"real\" hard drive, mount it with\
    \ write access (right-click on the icon on the Knoppix desktop, select Properties,\
    \ go to the Device tab, uncheck Read only, and mount the drive).\n\nAt the end\
    \ of the chapter, you should have several WAV files that you could burn to a CD-R/W\
    \ to listen in your car (to find out how to burn them, see the \"Burning CDs with\
    \ K3b\" section later in this chapter). Keep an eye on your available space, when\
    \ we tried to burn the WAV for Professor Clayton Christensen’s \"Capturing the\
    \ Upside\" (available from www.itconversations.com/shows/detail135.html), however,\
    \ it was too big—in fact, at 1 hour and 48 minutes, his talk would take almost\
    \ two CDs!"
  merge: -1
