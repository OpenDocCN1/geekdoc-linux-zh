    # Exploring FreeNX


    NoMachine (a division of Mediaologic) created NoMachine NX, “a Terminal Server
    and remote access solution” based on the X Window protocol, containing several
    improvements, including hyper-efficient compression (100:1 at the highest levels)
    and smart caching. In addition, NX can convert RDP (Remote Desktop Protocol, used
    by Microsoft Windows Terminal Services and Citrix MetaFrame) and RFB (Remote Buffer
    Buffer, used by VNC) to NX, greatly improving the efficiency of those protocols
    as well.'
