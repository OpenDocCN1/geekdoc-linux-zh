  md: '# 208 Part IV — Customizing Knoppix and Live CDs


    # Using the saveconfig Script


    The saveconfig script, written by Klaus Knopper, is a graphical tool for saving
    the configuration of your Knoppix Live CD on a floppy, USB flash drive, or hard
    partition. You can either run it as root from the Live CD via a terminal or you
    can start it from the KDE menu: select Knoppix → Save Knoppix configuration.


    When you start saveconfig (see Figure 9-3), you can choose to save the following:


    +   - Personal configuration (all your dot files in the /home/knoppix directory
    that have been changed)

    - Desktop files (everything that has changed in /home/knoppix/Desktop)

    - Network configuration files, including dial-up and ISDN files

    - X Window system configuration, defining your screen resolution and video card
    driver

    - Any other files from /etc that have been changed


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_233_0.png)


    FIGURE 9-3: The saveconfig script shows the selection of save options.


    Choose what you want to save and then select where to store your files (see Figure
    9-4). The script saves the selected files, wraps them together, and saves the
    resulting archive on the selected media.


    For Knoppix to find your saved files, you need to use a cheatcode at boot time.
    Use knnoppix myconfig-scan to have Knoppix search all your inserted media for
    the saved configuration files, or use knnoppix myconfig=/dev/hda1, where hda1
    is the device on which you have your files. The second command skips searching
    all your devices, which speeds up the time required to boot Knoppix. After you''ve
    booted Knoppix, you can use saveconfig again to overwrite your changes on the
    writable media.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Chapter 9 — Changing Knoppix to Fit Your Needs 209


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_234_0.png)


    **Figure 9-4:** Specify where files should be stored.


    saveconfig seems like a bit of magic. How does it work? It creates two files —
    knnoppix.sh and configs.tbz. These files are saved on the media specified. Knoppix
    searches for the knnoppix.sh script at startup and when it runs. That script extracts
    configs.tbz, which is a bzip2-compressed tarball containing the modified files.
    If you know a bit of shell scripting, it''s easy to modify and extend the knnoppix.sh
    script to be more complicated or location-specific tasks.


    The configs.tbz file contains the files from the home directory (/home/knoppix)
    and certain files from /etc that were writable. Its contents are extracted by
    knnoppix.sh onto the writable portions of the Knoppix Live CD, which has certain
    directories loaded on a RAM disk. You can modify this yourself if you want to
    add more files in different locations; just remember that the whole tarball is
    extracted into RAM. Avoid saving your entire home directory in this tarball because
    you can quickly run out of RAM, leaving your Knoppix Live CD unbootable when using
    myconfig cheatcode.


    # Using the knnoppix-mkimage Script


    The knnoppix-mkimage script is similar to saveconfig, but it is more useful for
    saving larger files in your home directory when booted from the Knoppix Live CD.


    knnoppix-mkimage is opened from the KDE menu: Select Knoppix ➜ Configure ➜ Create
    a Persistent Knoppix Home Directory. The script starts, showing an introduction
    screen (see Figure 9-5) with all the details.'
  merge: -1
