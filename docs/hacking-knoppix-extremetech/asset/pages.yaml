  md: 'man page for mount explains that the dev option tells Linux to "Interpret character
    or block special devices on the filesystem", like this:


    ```

    $ sudo mount -o dev /mnt/hda1

    ```


    To repair LILO, you need to fool it into thinking that /mnt/hda1 (or whatever
    your root partition may be) under Knoppix is actually / if the machine has booted
    without Knoppix. To do this, use the chroot command, which tells processes started
    with it to treat a given directory as the root directory. Now that the /mnt/hda1
    partition is mounted, restore LILO by running the following:


    ```

    $ sudo chroot /mnt/hda1 lilo

    ```


    This tells the system to treat /mnt/hda1 like it was actually /, and to run lilo,
    which restores LILO the way you want it. Take Knoppix out, reboot, and LILO should.


    # Fixing GRUB


    The process for fixing GRUB (the GRAnd Unified Bootloader), a more modern bootloader
    than LILO, is pretty much same as fixing LILO. You first need to find the partition
    on your hard drive as the root partition and holds the GRUB config file /boot/grub/menu.1st.
    You need to mount the partition that contains GRUB''s config file with the device
    option turned on, like this:


    ```

    $ sudo mount -o dev /mnt/hda2

    ```


    Just as with LILO, you need to use chroot with GRUB, but the full command is different
    because, of course, this is a different bootloader:


    ```

    $ sudo chroot /mnt/hda1 grub-install /dev/hda

    ```


    Now reboot, and GRUB should work. Woohoo!


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_119_0.png)


    More and more distros are using GRUB instead of LILO because it''s a newer, more
    flexible, more powerful boot loader. It''s really in your best interest to learn
    it.


