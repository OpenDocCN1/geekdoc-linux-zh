  md: '# 24 Part I — Navigating the Amazing Knoppix Toolkit


    Basically, sed some regular expression work get the number that corresponds to
    the width of the original image and write that number to the width variable.


    Note For more on regex, see Andrew Watt''s Beginning Regular Expressions at (www.rox.com/WileyCDA/WroxTitleCd-0764574892.html).


    Now the script performs a test: Does the number in the width variable equal 1600?
    If not, nothing happens, and the image is skipped. If it does match, the oh-so-versatile
    command kicks in and changes the dimensions of each image, while also using the
    highest quality and no compression. Each file is renamed to include the dimensions
    in the filename to make things clear.


    Tip Yes, convert can change more than just file types and dimensions. In fact,
    it can do a lot more. man convert should be your next step.


    When the process is finished, you''ll have a nice collection of photographs in
    a variety of common dimensions, ready for upload to a Website to be shared (under
    a Creative Commons license!) with anyone. If you''d like to see one of the author''s,
    head to www.granneman.com/personal/photos/. Every photo on those pages appears
    courtesy of ImageMagic.


    # Watching Video


    Digital movies have been getting more and more popular over the last several years
    as the Internet pipes into our homes and businesses have been getting larger and
    faster. Although ultimately limited in a few key ways, Knoppix enables you to
    listen to and watch movies and videos.


    # Checking Out Video with xine


    xine is hardly my favorite video player, for a simple reason: Its UI is pretty
    bad. Don''t get wrong: the using xine video engine is great, but the sine interface
    is almost baffling in its complexity and lack of clues and feedback. Regardless,
    that''s what Knoppix includes, and that''s what we will peek at.


    Note You can use APT to install other video players with better UIs. In particular,
    check out player, Caffeine, or Totem.


    Open xine from the K menu by selecting Multimedia -> Video -> xine media player,
    but you''ll probably use it more often by right-clicking a video file and choosing
    Open With -> xine. Figure 1-16 shows a video file opened in xine.'
