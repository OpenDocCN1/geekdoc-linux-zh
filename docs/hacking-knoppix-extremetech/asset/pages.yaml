    # Setting Up Printers


    Once upon a time, an old IT pro was counseling some new IT youngsters gathered
    around him. He was speaking sagely about keeping your "clients" happy, when someone
    asked him, "Master, what''s the number one thing we can do to keep our computer
    users from calling us, complaining?" His answer? "Here it is, grasshopper: make
    sure they can print. Not being able to print causes angry faster than anything
    else.


    Now, that was before the advent of the Internet into popular consciousness, his
    answer might be a bit different today, with network access being the new number
    one concern. Even so, printing would still come in a close second. People get
    crank when they can''t print, with good reason: Much as we''d like to believe
    we live in the age of the paperless office, experience has proved otherwise.


    Fortunately, Knoppix makes it pretty easy to set up printers. Of course, if your
    printer works under Linux (Samsung, for example), Knoppix ain'' gonna fix that,
    but if you''re trying to use a printer that''s supported by Linux, then you should
    be able to use it with your Knoppix Live CD.


    To get started, from the Knoppix menu, choose Configure -> Configure printer(s).
    Knoppix opens the KDE printer configuration tool, shown in Figure 1-8.


    KDE''s print system uses CUPS (the Common Unix Printing System) by default, and
    installs several so-called pseudo printers by default, including Print to File
    (PDF), Print to File (PostScript), Send to Fax, and Mail PDF File. All are very
    cool, and all work well (of course, to fax, you need a working modem).'
