    # Editing the System Registry When It Goes Boom in the Night


    The registry is the central Windows location for all system-specific information,
    including configurations and settings, for Windows 95 and all later versions.
    The registry can be edited very easily using the Windows native program reg within
    Knoppix. Just type the following command in a console window:


    ```

    regedit

    ```


    This command invokes Wine and pulls up the Windows Registry Editor, as shown in
    Figure 5-11. (Wine is an open-source implementation of Windows APIs that runs
    on top of Linux. Some folks think of it as a Windows emulator, but Wine''s developers
    call it a Windows compatibility layer for UNIX.)


    All of the functionality you get running the Registry Editor in Windows is available
    under Wine, including importing a backed-up registry and saving a modified registry.


    Some of the variant versions of Knoppix include an excellent Linux-native Registry
    Editor called Offline NT Password and Registry Editor (chntpw), a program that
    enables you to modify the Windows registry as well as Windows passwords. You can
    get more information on chntpw at http://home.unet.no/~pnordahl/ntpasswd/. The
    standard Knoppix versions 3.8 and later do not include chntpw by default, but
    the software is available through APT (sudo apt-get install chntpw), described
    in Chapter 1, as well as through the Klik program.'
