    # Analyzing Network Traffic with Ethereal


    Ethereal has been available for general use since 1998, and in the few years it''s
    been out, it has become one of the premier open-source security tools. It is both
    powerful and easy to use for basic needs, including it on Knoppix is a no-brainer.
    It''s also a program that rewards careful study: The more you learn, the more
    you can do, and the more you will learn—about your network, networking, and security.


    To get the most from Ethereal, you need to run it as root. Unfortunately, if you
    try to open Ethereal as root in Knoppix, you are prompted for a password that
    doesn''t exist. There are two ways around this issue (actually, there are a lot
    more than that, but these two should do for you):


    +   - Set the root password. Just open your command line by going to the K menu
    and selecting System -> Console. When it opens, enter sudo password, type the
    new root password twice, and press Enter. That''s it. The password is now changed.
    When you run Ethereal, you are prompted to enter root''s password, which you just
    created.


    +   - Right-click the K menu and select KDE Editor to open the KDE Menu Editor.
    Click the + next to Internet to expand it, and then select Ethereal (as root)
    with a single click. You should now be able to edit the data about this item on
    the right side of the KDE Menu Editor. Next to the Command field, edit the command
    to read like the following:


    ```

    sudo gks -u root /usr/bin/ethereal

    ```


    Further down, uncheck Run as Different User. Use the KDE Editor. Save your changes
    and wait while they are made permanent. Now you can run Ethereal as root without
    having to create a root password.


    Open Ethereal by going to the K menu and selecting Internet -> Ethereal (as root).
    The program opens with a screen similar to the one shown in Figure 6-6.


