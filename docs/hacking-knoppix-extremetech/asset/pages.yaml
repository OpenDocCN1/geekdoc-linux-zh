  md: '# Introduction


    Years ago, Bob heard about Linux, and he wanted to give it a whirl. It sounded
    interesting: open source, free, powerful, stable. So he asked Alice, a friend
    of his who uses Linux, "Hey, I''m running Windows right now, and I want to keep
    running it, but how do I try Linux out for myself?


    "Well," she said, "we can either back up your hard drive, wipe it, install Linux
    let you out, and then remove Linux and put Windows back on, along with all your
    data, or . ."


    "Whoa! I just want to try it out, not this into a project! Isn''t there an easier
    way?


    "OK, we can set up your machine to dual boot Windows and Linux. We will resize
    your hard drive partitions—oh, yeah, we need to buy some software to do that,
    about $50 or so—and then we will install Linux in a new partition, and when you
    turn your box on, you can choose either Windows or Linux. How''s?


    "That sounds like a lot of work too. I just want to play with Linux. I don''t
    want to commit to it. Is there anything else I can do?


    Alice thought for a moment. "No, not really."


    Bob walked away, another potential Linux user that remained that potential:


    There had to be a better way. Soon enough, and there was more rejoicing in Linuxland.
    Rejoicing has spread over the years, and now and more computer users—many of them
    living outside Linux in Linuxworld—are discovering that there''s software that
    enables them to try Linux out painlessly, and do a whole heck of a lot more besides.
    With this fantastic tool, users can do any of the following:


    +   - Recover previous data from a machine (running Linux or Windows!) that won''t
    boot


    +   - Test the security of a machine, a local area network, or a public server


    +   - Play games, listen to music, view videos, or look at pictures


    +   - Surf the Web, shoot off emails, instant message pals, and download software


    +   - Fix common problems with computers running either Windows or Linux


    +   - Create their own customized version that suits their needs perfectly


    Best of all, this tool has all the characteristics of the best that the world
    of Linux has to offer: it''s free, it''s awomely innovative and astonishingly
    clever, and it''s flat out fun. In addition, for those of us who love (and) to
    live, by combining the brainpower of a dedicated volunteers all over the world,
    there''s always something new and exciting to learn about this software.


    The name of this tool, of course, is Knoppix.'
  merge: -1
