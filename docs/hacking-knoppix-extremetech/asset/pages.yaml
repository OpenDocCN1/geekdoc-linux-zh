- img_proc: true
  md: '# Part IV — Customizing Knoppix and Live CDs


    The first step in all three processes is removing the installed kernel in the
    chroot of the KNOPPIX/KNOPPIX file. As with everything in Knoppix, you can easily
    remove the kernel by apt-get:


    ```

    # apt-get remove kernel-image-2.6.12

    ```


    You get a warning when running this command your host system is running the same
    kernel. Because you are removing the kernel from the chroot, you can safely ignore
    the warning.

    Type Yes to continue.


    You should also remove any existing kernel module packages for the 2.6.12 kernel.
    They won''t function with a different kernel, so keeping them installed doesn''t
    serve any purpose:


    ```

    # apt-get remove *modules-2.6.12

    ```


    When replacing the kernel, the most work involves ensuring that all the kernel
    modules you are included in your Live CD. Different kernel modules need to be
    built in different ways, as you will see later in this chapter.


    # Installing a Pre-Made Kernel from the Debian Archive


    In Debian, a large number of kernels are available for a variety of systems. The
    kernels are generic to work on many different machines as possible and are a good
    bet if you aren''t acquainted with configuring and compiling your kernel. The
    advantage is that this process is relatively easy to do; the drawbacks are a lack
    of choice as to which kernels you can use and a lack of control over which kernel
    module and options are chosen — already have been chosen for you.


    To begin, you find the kernel that suits your purposes. Use synaptic to search
    for kernel packages (their names start with kernel-image). Say, for, that you
    want to use an older 2.4 Linux kernel; execute the following in the chroot:


    ```

    # apt-get install kernel-image-2.4.27-2-386

    ```


    There you have it, your (albeit old) kernel. Don''t think that you''ve done this
    quickly, though each kernel also needs kernel module packages in for all functionalities
    to be available. The following command installs the pcmia modules, which are required
    if you want your Live CD to function properly with removable hardware in laptops:


    ```

    # apt-get install kernel-pcmcia-modules-2.4.27-2-386

    ```


    If you want to support wireless network cards, install the linux-wlan-ng-package:


    ```

    # apt-get install linux-wlan-ng-modules-2.4.27-2-386

    ```


    To be able to compile kernel modules that aren''t pre-packaged for your kernel,
    it''s a good idea to also install the accompanying kernel-headers package:


    ```

    # apt-get install kernel-headers-2.4.27-2

    ```'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Using make-kpkg to Create Your Own Kernel Package


    If you prefer more control over choices made regarding what kind of kernel goes
    onto your Live CD, you can still use the flexibility that Debian provides. It''s
    highly recommended that you do this on your host system and save the resulting
    packages in a separate directory, so that you don''t have to worry about losing
    all your hard work. You''ll also be able to make small changes without having
    to start from scratch.


    On your host system, do the following:


    ```

    # apt-get install kernel-source-2.6.11

    ```


    This downloads the kernel source from the Debian repository; it ends up in /usr/src.


    Unpack the source:


    ```

    # cd /usr/src

    # tar jxvf kernel-source-2.6.11.tar.bz2

    ```


    This command extracts the kernel source into /usr/src/kernel-source-2.6.11. Enter
    that directory:


    ```

    # cd kernel-source-2.6.11

    ```


    Now you have two options: use a default configuration supplied by Debian or create
    your own. If you want to create your own configuration, you can use one of the
    following commands:


    ```

    # make menuconfig

    # make xconfig

    # make gconfig

    ```


    All three configuration tools provide an interface in which you can select the
    various kernel options for the intended systems. You can use the existing Knoppix
    configuration by loading the configuration from /usr/src/linux/.config; this is
    possible in all three tools. Unless your kernel is different from the existing
    Knoppix kernel or the intended usage is restricted, it''s a good idea to start
    with the existing Knoppix kernel configuration, so that you only have to tweak
    the settings for situations where your usage differs.


    After you have configured your kernel, you''re ready to create the kernel packages
    for your Live CD. Execute the following:


    ```

    # make-kpkg kernel_image

    ```


    This command starts compiling your kernel. It takes a while, but afterward new
    files are in the /usr/src directory: a kernel-image package, a kernel-source package,
    a kernel-headers package, and a kernel-doc package. Copy the kernel-image package
    and kernel-headers packages into your chroot and install them using dpkg. For
    example:


    ```

    # dpkg -i kernel-image-2.6.11_10.00.Custom_i386.deb

    kernel-headers-2.6.11_10.00.Custom_i386.deb

    ```


    If everything went well, you have replaced your kernel successfully. Congratulations!
    However, you aren''t out of the woods yet.'
  merge: -1
