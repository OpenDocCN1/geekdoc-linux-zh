  md: 'Keep in mind that many tools run via the command line, so they won''t show
    up on the Xfce menu. Check out the complete list of software, and investigate
    everything that interests you. It''s a feast, so dig in, and don''t worry about
    being gluttonous. The next few sections discuss some of the available tools.


    # Imaging a Hard Drive with GRAB


    When you''re performing a forensic analysis of a compromised machine, one of the
    first things you usually need to do is make an image of the hard drive that you
    can examine. Although the command-line tool dd can do either, GRAB—a program created
    by e-fence, the developers of Helix—has several nice features, including the following,
    which are listed in the Helix manual:


    +   * Autodetection of IDE and SCSI drives, CDROMs, and tape drives

    * Choice of using either dd, ddfld, or sddd

    * Image verification from source and copy via MD5 or SHA1

    * Image compression/decompression via gzip/bzip2

    * Image over a TCP/IP network via Netcat/Cryptcat, or SAMBA (NetBIOS)

    * Support for SCSI tape drives

    * Wiping (zeroing) drives or partitions

    * Splitting images into multiple segments

    * Detailed logging with date/times and command line output


    To start GRAB, just click the program''s icon, located on the Xfce panel at the
    bottom of your screen. When it opens (see Figure 8-4), you''ll see that GRAB isn''t
    hard to use at all.


    In particular, GRAB makes it easy to copy your disk image over a network to another
    machine. For more details about this feature, and many of the other nice things
    that GRAB can do for you, refer to the Helix manual, available at http://e-fence.com/helix/Helix-Manual.pdf.


    # Finding All the Images on a Drive with Retriever


    Helix comes with Retriever, a tool unique to its distro, which finds certain kinds
    of files and gathers them together so that you can look them over your leisure.
    To start the program, just click the retriever icon (which looks like a close-up
    of a dog''s nose) on the Xfce panel. When it opens, you''re immediately given
    more details about the program. Just click OK to close that alert. You choose
    whether to have Retriever place the files it finds when it scans the hard drive
    on a USB flash drive or /images/retriever, a hard-coded path. If you choose the
    latter, Retriever does not actually copy the files, but simply creates soft links
    pointing back to the files it finds. Choosing /images/retriever makes easy.'
  merge: -1
