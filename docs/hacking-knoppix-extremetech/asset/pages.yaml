    # Scanning Your Web Servers with Nikto


    Nowadays it seems like everyone is running a Website; unfortunately, it also seems
    like another Website gets broken into and defaced just every day. It''s important
    to try to prevent embarrassing and potentially dangerous Website hacks, and Nikto
    does the job. Nikto is a constantly updated open-source tool that, as its Website
    describes, tests for ''over 3,200 potentially dangerous files/CGIIs, versions
    on over 625 servers, and version-specific problems on over 230 servers.'' Run
    it against your Web server, and you will find holes about which you know nothing.


    > Do not run Nikto against any server that you feel like scanning could be you
    the subject of an unpleasant visit from the authorities. Instead, confine it to
    Websites and servers that are under your control. When in doubt, ask first.


    To start Nikto, from the K menu select Auditor -> Scanning -> Webserver scanning
    -> Nikto. Console opens, and the various options available for Nikto appear. Take
    a look through them if you''re interested, but to get started, just enter the
    following in the terminal, substituting your Website''s domain name for www.webserver.com.


    ```

    # nikto -h www.webserver.com

    ```'
