  md: 'K3b is divided into two main areas: a file and folder navigation area in the
    top half of the window and a project view in the bottom half, as shown in Figure
    1-17.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_51_0.png)


    Figure 1-17: K3b''s main window


    K3b makes it very easy to get started by providing buttons for the most common
    tasks in the project view. To burn a CD for backup, choose New Data CD Project.
    The project view area changes to Current Projects, as shown in Figure 1-18.


    Using the top half of the window, navigate to the items you want to burn and begin
    dragging them into the bottom half of the window. As you add items, the bar at
    the bottom of the window shows how much space you''ve taken up onto your CD and
    how much you have left. Gone over the limit? Select an item in the project and
    press the Delete key to remove it from the burn. Once you''ve correctly specified
    the items you want to burn onto a CD, click the Burn button on the right of K3b.


    A new window opens up Data Project. This is an extremely important window because
    it enables you to tell K3b exactly how you want to burn your CD. You have several
    options here, and selecting the right one can make the difference between a successful
    backup and a shiny hunk of plastic.


    To lessen the chance you''ll end up with a bad burn, this section covers the key
    changes you need to make. With built-in help, K3b has informative help. If you''re
    unsure about an option, just click the What''s This button (the one that looks
    like a question mark) in the upper-right corner of the window, and then select
    the option in the window about which you''d like more information.'
