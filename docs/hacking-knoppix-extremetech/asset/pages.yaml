    | /dev/hda1 | | 5.2G | 4.7G | 53% | /mnt/hda1 |


    You can see that hda2 is a 27GB file system, with 1.7GB free. Fortunately, hda1
    has 4.7GB free, so it''s going to be close but not a problem. You can run the
    unmount command toal for safekeeping.


    Before unmounting, you must ensure the filesystem against which you want to run
    un:


    ```

    $ umount /mnt/hda2

    ```


    Check that you''ve mounted hda1 with writing enabled, or this process won''t work.
    Now run the unmount command, sending the output to a file on the still-mounted
    hda1:


    ```

    $ unrm /dev/hda2 > /mnt/hda1/hda2_unrm_results

    ```


    The unrm command can take a while to run, depending on the amount of free space
    on a device. Once finished, it''s time to go to work withazarus.


    # Understanding Lazarus


    Lazarus analyzes the data by unrm and tries to bring anything back to life. Be
    warned: lapazarus can take twice as long to complete its job as it took unrm to
    work, so this may be one of those commands you start and then go to bed. Here''s
    how to run it:


    ```

    $ lapazar -h /mnt/hda1/hda2_unrm_results

    ```


    The -h option tells Lazarus to produce a report in HTML that you can load in a
    browser. That report is composed of three files: hda2_unrm_results.html, unrm_results.frame,
    and hda2_unrm_results.frame.html; the last one is the one you need to open in
    your Web, and it takes care of loading the others.


    Lazarus tries—on the words”—to identify binary or text, and then it tries to figure
    out what kind of text or binary data it is: HTML, mail, logs, executable, and
    so on. A key is available in the HTML files that lapazar displays in your browser.
    Most of the Web page is populated with a list of keys, ones for each file that
    lapazar recovered. Click the link, and you can see the contents of the file.


    This is very similar to looking for a needle in a haystack, of course, you might
    want to spend things up by using grep. If you''re looking for a file having to
    do with the McGillicuddy account, you could try grep McGillicuddy /mnt/hda1/hda2_unrm_results/*.
    Try long enough, and you might just find that file you so desperately.'
