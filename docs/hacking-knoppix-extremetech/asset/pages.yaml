  md: '# Checking Out

    Security Distros


    One of the great things about Knoppix is that it''s a general-purpose distro.
    You can do a gazillion different things with it, and that''s one of its strengths.
    However, there''s also something to be said for specialization, and the distros
    in this chapter are single-minded about one thing: security. Each of these distro
    focuses solely on security, but that doesn''t mean they''re all the same. Granted,
    there''s a lot of overlap here (each distro has Nmap and SSH, for instance), but
    each distro also has a different focus and a unique set of tools.


    In the same way that Knoppix is free, making it worth your while to try out, each
    of these distros is free for the download. Grab''em, burn ''em, and boot ''em—you
    have no excuse!


    # Inspecting Auditor


    When you first boot Auditor, you''re going to be blown away by the amazingly well-structured
    K menu. The folks behind Auditor have done a simply incredible job organizing
    the various tools they provide so that everything is easy to find and presented
    in a logical fashion. Figure 8-1 shows an example of Auditor menus.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_200_0.png)


    +   - Exploring Auditor

    - Using Helix

    - Examining INSERT'
