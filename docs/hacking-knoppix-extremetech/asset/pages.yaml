- img_proc: true
  md: '# Chapter 4 — Fixing Linux with Knoppix 101


    This copies an image of /dev/hda1 hdb1. It assumes, of course, that there''s room
    on hdb1 for all of hda1. If there''s not, you''ll have to use another partition.


    The following command restores the disk image of hda1:


    ```

    $ sudo dd_rescue /mnt/hdb1/hda1.img /dev/hda1

    ```


    That was easy—it''s just the reverse of the initial command.


    Next is something that would be useful if you have limited partitions on a machine
    or, or for example, if hdb1 couldn''t contain hda1: Use dd and ssh to create an
    image on another machine:


    ```

    $ sudo dd_rescue /dev/hda1 | ssh username@machine ''cat > /home/username/hda1.img''

    ```


    You''ll be prompted for a password; enter it, and wait for dd_rescue to do its
    job. Needless to say, this can take a while if you''re dealing with a large partition.
    If you get an error message such as


    ```

    dd_rescue: (warning): output file is not seekable!

    dd_rescue: (warning): Illegal seek

    ```


    while you''re running this command, it''s safe to ignore it. It''s just dd_rescue
    being overly cautious.


    To restore the image from another machine using ssh, use this command, entering
    a password when prompted


    ```

    $ ssh username@machine ''cat /home/username/hda1.img'' | /dev/hda1

    ```


    Once again, you may have to wait for a while. Watch TV. Go for a walk. Read a
    book. Better yet—read this book!


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_126_0.png)


    > It''s a good idea to fsck any images you create by running fsck -y /mnt/hdb1.img
    after you create the image, especially if the partition you were backing up had
    problems begin with.


    Finally, you can use tar and ssh to compress the partition and copy it to another
    machine:


    ```

    $ tar zcvf - /mnt/hdb1 | ssh username@machine ''cat->/hda1_bak.tar.gz''

    ```


    Of course, you have to enter a password once more. Again, this process could take
    a long time, but you end up with a compressed copy of your partition.


    To restore the partition, use the following command:


    ```

    $ ssh username@machine ''cat /tmp/hda1_bak.tar.gz'' | tar xzv -

    ```


    Don''t forget the dash on the end! This process can take a while, but your partition
    will make back onto your hard drive, which is the goal.'
