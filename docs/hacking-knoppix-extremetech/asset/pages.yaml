  md: '# 102 Part II — Rescuing and Recovering Systems Using Knoppix


    > > Caution Keep in mind that when you untar hdal_bak.tar.gz, everything is going
    to be recreated in a mnt/hdal directory subdirectory from which you run the command,
    so you''ll have to manually move your files and folders to the root of your hard
    drive.


    What you don''t want to leave the copied images on another hard drive? If the
    images you''ve created are small enough, you can burn them to CD; if they''re
    larger, burn them to DVD. If an image is too big for that, you can use the split
    command to break the file into sections and each section to disk. If you ever
    need to join the sections again, copy each section from your disk(s) and use the
    cat command to rejoin them (you can avoid this scenario by backing up external
    hard drives).


    To break up a 10 GB gzipped file (hdal_bak.tar.gz in this example) into two smaller
    files suitable for burning onto two DVDs, you''d use the following:


    ```

    $ split --bytes=4000m --verbose hdal_bak.tar.gz hdal_bak

    ```


    This command produces three files: hdal_baaa, hdal_bakab, and hdal_bakac. The
    first two are 4GB each, and the last one is 2GB (all that''s left of the 10 GB
    original). Burn them onto DVDs and you''re good to go.


    When it''s time to rejoin what you''ve burned onto DVD, copy the three files from
    the DVDs and onto a hard drive, and run the following:


    ```

    $ cat hdal_bak* > hdal_bak.tar.gz

    ```


    After some time, you have your single file back. Use ssh and tar to restore it
    to your hard drive on another machine, and you''re as good as new!


    # Restoring Lost Partitions


    OK, you''ve done it: you deleted the MBR, or at least the partition table, and
    you don''t have a backup. Time to erase the hard drive and start over, right?
    Wrong! Before you try that drastic route, boot with Knoppix and see whether Gpart
    (which stands for G partitions) can save your bacon.


    Gpart looks for areas of your hard drive it can identify as partitions, and creates
    a partition table for them. Yet, it seems like magic, and it doesn''t always work,
    but it''s better than just throwing in the towel. What can it hurt?


    Better still, Gpart supports a wide variety of filesystems, including not limited
    to the following:


    +   - FAT and VFAT

    - ext2 and ext3

    - Linux swap

    - NTFS

    - ReiserFS'
