  md: '# 252 Part IV — Customizing Knoppix and Live CDs


    # # The Big Secret


    Here''s the big secret you''ve been waiting for breathlessly: how to truly make
    this distro exactly meets your needs and wants. Since the beginning of this chapter,
    you booted Knoppix, customized things to your liking, and then saved your Knoppix
    config files. Now you''ll include those files with your drive. When you boot Myppix,
    you''ll have in front of all of your settings, for yours, bookmarks, and more!
    Is that cool or what?


    Remember the files you created in the "Saving Those Changes" section? Named configs.tbz
    and knnoppix.sh, these files contain, respectively, copies of system config files
    and a script that automatically them when using Knoppix boots. Find those files
    on your USB drive or hard drive—wherever you saved them—and copy them to the knnoppix/KNOPPIX
    drive. For example, to copy the files from your USB drive I use these commands:


    ```

    $ cp /media/ubal/configs.tbz /home/scott/knoppixiso/KNOPPIX/

    $ cp /media/ubal/knoppix.sh /home/scott/knoppixiso/KNOPPIX/

    ```


    That''s it! Now that those files have been copied into what will become the Myppix
    file structure, all you need to do is boot Myppix, and all your settings will
    be put into place. Man, that''s easy... and really useful!


    # # Mastering the CD


    It''s time to turn Myppix into an actual product! Start by compressing the KNOPPIX/KNOPPIX
    filesystem, using your own directories, of course:

    $ mkisfs -iso-level 4 -R -U "Myppix" -hide-rr-moved -cache -inodes -no-bak -pad
    /home/scott/knoppixuncompressed -n5 create_compressed_fs -65536 /home/scott/knoppixiso/KNOPPIX


    Not surprising, this command can run for a long time, depending on the size and
    speed of your knnoppixuncompressed directory. When the command finishes running,
    you can create the ISO image you''re going to boot:


    ```

    $ mkisfs -pad -l -r -J -v "Myppix" -b boot/isolinux/isolux.bin -c boot/isolinux/boot
    -no-emul-boot -boot-load-size 4 -boot-info-table -hide -rr -moved /home/scott/knoppix.iso
    /home/scott/knoppixiso/

    ```


    Again, this takes some time to run. When it finally finishes, ls -l /home/scott
    displays something like the following:


    ```

    -rw-r--r-- 1 root root 664347215 Jun 13 12:55 myppix.iso 664MB. Not too bad, and
    there''s still some space to add additional software to your distro if you ever
    want to remaster Myppix again.

    ```'
