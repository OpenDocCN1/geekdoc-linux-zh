  md: '# Chapter 12 — Creating Myppix, Your Personal Knoppix 253


    There''s one thing to fix before continuing. You probably don''t want the ISO
    in your home directory to be owned by root, so you need to change the permissions
    to use your system''s user-name, and check it once again with ls -l:


    ```

    # chown scott.scott myppix.iso

