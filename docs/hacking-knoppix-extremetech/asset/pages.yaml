  md: '# Sniffing Packets with the Snafs


    This story really happened, and it explains just how you can use various tools
    that come with Auditor to sniff packets on a wireless network, potentially to
    devastating consequences. I was at my buddy Ben''s house, using his wireless network
    and writing the portion of this chapter about Auditor. Ben and his fiancée were
    talking in his office and looking at Ben''s computer screen. Ben''s machine was
    also wirelessly connected to the Net.


    From the dining room, I asked, "Hey, Ben! Mind if I eavesdrop on what you''re
    doing for my book?" He gave an assent, and so I started firing by Mailnarf, part
    of the excellent sniff package, opening the K menu, and selecting Auditor -> Analyzer
    -> Applications -> Mailnarf.


    ```

    # mailnarf -i eth0 "tcp"

    ```


    I used eth0 with the -i (interface) because I knew Auditor had assigned device
    ID to my wireless card by running the ifconfig command. "tcp" tells what kind
    of traffic to sniff, using the same terminology that tcpdump and ethereal use.
    Finally, the . (period) in the command looks for all emails by; if I wanted to
    limit Mailnarf''s activity to certify emails, I could use a search word or phase
    index, like this:


    ```

    # mailnarf -i eth0 password "tcp"

    ```


    After a few minutes, the following email popped up in Konsole (I redacted the
    domain names for privacy''s sake):


    From mailnarf Sat Apr 30 00:40:41 2005


    Return-Path: <Jans@DOMAIN.com>


    Delivered-To: jans-DOMAIN.com-Ben@DOMAIN.com


    X-Envelope-To: ben@DOMAIN.com


    Received: (gmail 6440 invoked from network) 30 Apr 2005 00:39:19 -0000

    Received: from relay03.pair.com (209.68.5.17)


    by chanas.pair.com with SMTP; 30 Apr 2005 00:39:19 -0000


    Received: (gmail 91563 invoked from network) 30 Apr 2005 00:39:18 -0000


    Received: from unknown (HELO ?192.168.1.3?) (unknown)


    by pair-pair with SMTP; 30 Apr 2005 00:39:18 -0000

    X-pair-Authenticated: 69.155.165.22


    Mime-Version: 1.0 (Apple Message framework v622)


    Content-Transfer-Encoding: 7bit


    Continued'
