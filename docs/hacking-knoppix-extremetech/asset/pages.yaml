- img_proc: true
  md: '# Chapter 10 — Remastering Knoppix 219


    # Choosing a Different Desktop Environment


    A lot of simple hacks are possible using the Knoppix cheatcodes. Knoppix comes
    with a number of desktop environments pre-installed, and you can use the desktop
    cheatcode for altering the desktop environment starts.


    Say, for example, that you want to start with icewm, a quick desktop environment
    suited for older machines, by default. Change the isolinux.cfg file APPEND lines
    to include desktop=icewm.


    If you don''t want to use the cheatcodes to easily modify your Live CD, you the
    Knoppix startup files. In that case, from within the chroot /etc/init.d/knoppix-autoconfig
    file with a text editor. This script contains the largest part of the boot process
    and starts a list of other programs for hardware detection and the like. On line
    483 of this file is a case statement defining the the desktop cheatcode is used
    in Knoppix. If you want to change the default in this, modify


    ```

    DESKTOP="kde"

    ```


    to


    ```

    DESKTOP="icewm"

    ```


    Modifying the default desktop environment is, of course, more complicated if that
    desktop environment isn''t installed in Knoppix to begin with! In that case, you
    also have to install the environment you want. For example, to install the XFCE4
    desktop environment, simply execute


    ```

    # apt-get install xfece4

    ```


    from within the chroot. This installs the XFCE4 desktop environment and all the
    dependencies it requires. Remember to free up a corresponding amount of space
    or your Live CD won''t fit on a CD! One of the largest challenges in remastering
    Knoppix is making sure the Live CD contains everything you need and is still small
    enough to fit on the CD.


    # Booting with a Different Kernel


    One of the more complicated areas of Knoppix remastering, swapping the Linux kernel
    is not for the faint of heart. There are three ways you can go exchanging the
    kernel:


    +   - The Debian, by installing a pre-made kernel

    - By using make-kpkg to create your own kernel package, which can be installed
    manually

    - By manually downloading, configuring, compiling, and installing your kernel


    This section discusses the first two; doing everything manually doesn''t offer
    any advantages over using make-kpkg.'
  merge: -1
