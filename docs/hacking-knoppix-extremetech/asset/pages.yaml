    # Sniffing Packets on a Network


    Traffic sent from your computer is broken into small chunks (typically around
    1,500 bytes each) called packets; when the packets reach their destination, they
    are reassembled back into a whole. Each packet consists of headers and data. The
    data is the information being sent, while the headers get the packet from its
    source to its destination.


    To understand packets over the Internet, think of an onion. Wrapped around the
    data is the Ethernet header, which contains the MAC addresses of the source and
    destination. Wrapped around that is the Internet Protocol (IP) information, which
    consists of a lot of data, but most importantly the IP addresses of the source
    and destination.


    Wrapped around the IP layer is the Transmission Control Protocol (TCP) information,
    which possesses the source and destination ports and the sequence numbers of the
    packets. That may be the outside of the onion, unless an application of sort,
    such as a Web browser or an email program or an IM app. In these instances, the
    TCP layer is wrapped in an application layer—such as HTTP, POP3, or AIM—which
    performs services needed by those applications. And that, is, the final layer
    of the onion.


    What do sniffing programs do? Basically, they enable you to see all the traffic
    on your network, whether it is intended for your machine or not (there is a caveat
    to that statement, coming up soon). All the packets rush by and you see all layers
    that make up packets—network protocol analyzers as Ethernet reveal all.


    Why would you want to do that? Why in the world you want to know the details of
    all the traffic going across the network to you''re currently attached? Well,
    there''s the bad reason—to grab non-encrypted passwords and data—and the good
    guy reasons:


    +   - To learn more about network protocols

    - To figure out just what the heck is wrong with %#$%&&$ Samba connection (or
    NFS, or email, or what you have)

    - To audit an organization''s network to expose security holes (such as really
    bad, unencrypted passwords, or folks who aren''t using encryption when they''re
    supposed to)'
