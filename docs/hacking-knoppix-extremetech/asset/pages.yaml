    # Calculating Pi


    In the same vein, the pi sample program is an instructive case if you have an
    MPI application you''d like to compile on ParallelKnoppix. It''s a simple demonstration
    of compiling an MPI application for use on ParallelKnoppix cluster.


    The pi example contains a neat technique for estimating pi: Instead of trying
    to do a lot of calculations, it simulates the ''dartboard'' technique, which is
    elegant in its own right. Imagine you have a square dartboard. Now, draw a circle
    centered on one of the corners with a radius equal to the side length of the square.
    This leaves a quarter-circle that covers the majority of the square''s surface.
    Next, you throw darts at this board, keeping track of how many hit inside the
    quarter-circle and how many hit outside. the the square and you see that there''s
    (pi/4)/r2 = pi/4 probability of a dart landing inside the circle. Just multiply
    the percentage of darts inside the circle by four, and you will get an estimate
    of pi in a moment, you''ll see just how accurate your estimate is.


    As with the Octave example, begin by copying the pi directory into the shared
    working space. The pi folder is found in ParallelKnoppix/Examples/C/pi/; just
    copy that directory into the working folder. Switch to a console window, cd into
    the newly copied directory, and run mpiicc -o pi_send c dboard.. This command
    should create a pi binary.


    Run the binary with mpirun -np 4 . /pi, a command that handles all the MPI-related
    voodoo that gets nodes to start the application. All of these steps are shown
