  md: '# Appendix B — Installing Knoppix to Your Hard Drive


    Knoppix uses the first letter of your first name and your full last name to create
    a username for you (see Figure B-10). You can change the username to whatever
    you''d like. You''ll use it to log into the system both locally and remotely.
    When you''re satisfied with your username, click Next.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_300_0.png)


    Figure B-10: Use the Knoppix-generated username or create your own.


    Now create a password to go with your new username. Enter the password twice,
    as shown in Figure B-11, and click Next.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_300_1.png)


    Figure B-11: Enter a user password.


    The administration password (see Figure B-12) is not the user password you just
    created; it''s not associated with your username at all. It is the all-important
    root or super-user account password that provides full access to the system. For
    security reasons, you should be careful to ensure that you use a strong password
    with a combination of alphanumeric and nonalphanumeric characters. Enter the password
    twice and click Next.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# 276 Hacking Knoppix


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_301_0.png)


    **Figure B-12:** Enter an administration (root) password.


    You''re prompted to provide your system hostname (see Figure B-13), which is the
    name by you want to refer to your machine. The default is box, which should be
    changed to something more interesting and descriptive. After you''ve entered a
    name you like, click Next.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_301_1.png)


    **Figure B-13:** Create a system hostname.


    The boot loader (called GRUB, for grand unified boot loader) does the heavy work
    and starts the Knoppix operating system when you turn on your computer. It can
    be installed in the machine boot record (MBR) or on the partition where Knoppix
    will be installed (see Figure B-14). If you have multiple operating systems on
    the same computer and install GRUB in the MBR, you can use it to boot all your
    operating systems. If you are installing Knoppix on a computer with no other operating
    systems, you also probably want to choose the MBR option.


    Later in the install process, you have the option to create a boot floppy disk.
    If you want to boot Knoppix only when you have the boot floppy installed and you
    normally operate the system without the diskette, you should select the partition
    option. Make your choice and then click Next.'
