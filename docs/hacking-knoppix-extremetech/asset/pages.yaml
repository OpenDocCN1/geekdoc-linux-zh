  md: '# Chapter 1 — Unraveling the Knoppix Toolkit Maze 31


    Checking the boxes in the File Systems is key if you''re after cross-platform
    compatibility. There''s a wide variety of standards for CDs, and in typical fashion
    in the computer world, they don''t always agree. For instance, when you burn a
    CD, you can stick to ISO9660 standards, but all filenames must be in capital letters,
    and have to be a maximum of eight characters, plus the period and the extension.
    DOS, anyone? You can also use the Rock Ridge extensions (including Linux and Mac
    OS X) to read CDs that contain files with names up to 255 characters, as well
    as support Unix-like systems such as owners, groups, permissions, and symbolic
    links. Windows does not support Rock Ridge (worth $50 bill and with 30,000 employees,
    Microsoft can''t support Rock Ridge), so unless you use it as your only file if
    you want to access your data on that operating system.


    If you want to make sure that Windows can read the content of your discs, ensure
    Joliet extensions, which support up to 64 characters in filenames (although there''s
    a way around this, as you''ll see). Users of Linux and Mac OS X can also read
    CDs that use Joliet, but Mac OS 9 and earlier will truncate filenames to 31 characters,
    a major limitation of pre-OS X.


    UDF, which stands for Universal Disk Format, is mostly used for DVDs, but CD-R/W
    also uses it, including spaces. The idea is to allow 127-character filenames,
    so you can write to CDs and UDFs you like to use floppies, USB drives, or hard
    drives: just drag and drop right. For UDF to work, though, you need very recent
    hardware and software drivers if you''re using Windows or Mac OS (most Linux drivers
    now include soft support for UDF-based disks). If you''re shooting for wide compatibility,
    you should probably avoid UDF at this time.


    With an understanding of these different filesystems, the Files tab will make
    more sense, if your disc is only going to be used on Linux machines (or Mac OS
    X), check Rock Ridge Extensions. If you use Rock Ridge but do not want symbolic
    (or "soft") links included on your burn, check Dis All Symlinks. If you are concerned
    about including soft links, but you want to make sure that you don''t accidentally
    include links to files that aren''t included in your burn project, make sure that
    you check Discard Broken Symlinks.


    In addition, if you''re using Rock Ridge, you can tell K3b to include information
    about file permissions along with the burn. To do this, check Preserve File Permissions
    (Backup). This creates an exact backup of your files—not just the data, but also
    the meta-information about who owns it and what they can do with it.


    If you want to Windows machines in your burn, check Generate Rock Ridge Extensions
    and Joliet Extensions. Your Linux machines will see files up to 255 characters,
    while Windows will see them truncated to 64 characters... unless you check a box
    on the next tab, which we''ll get to just in a moment.


    The options in the Whitespace area of the burn would be useful if you want to
    get rid of spaces in the filenames for your disc. No change does just—files that
    have spaces in their names still do. Nowadays, this isn''t really a problem for
    Linux boxes, so we just leave K3b set to that.


    Over the years, the standards for burning CDs have morphed in many different directions.
    Fortunately, most modern hardware and operating systems support most of these
    additions and extensions, but it''s still a good policy to test all burned CDs
    on the various CD readers'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'that you plan to use before you rely on those discs! It would be a shame to
    make backups of your vital data onto CD, intending to transfer the data to a different
    machine, only to find out after you''ve repurposed the original box that the different
    computer can''t read your discs. Testing is always worth the time it takes.


    # Fine-Tuning CD-R/W Filesystems


    The Data Project''s Advanced tab (see Figure 1-23) enables you to make changes
    to the basic CD-R/W filesystems.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_57_0.png)


    FIGURE 1-23: You can change the basic CD-R/W filesystems in K3b.


    Getting beyond the 64-character limit for the Joliet extension was mentioned earlier.
    Here''s how to do it: Check Allow 103 Character Joliet Filenames, and you almost
    double your allowed filename-length on Windows machines. Does this break the official
    Joliet standard? Does it appear to work anyway in Windows? Yup, so go for it (but
    remember to test first). Also remember that you can get up to 255 characters in
    your filenames using Rock Ridge but only 103 characters using Joliet. Still, for
    all but the finest of filenames, 103 characters should suffice.


    The Allow Untranslated Filenames option has nine sub-options. Checking Allow Untranslated
    Filenames activates eight of those sub-options—weirdly, you must enable Allow
    Max Length Filenames (37 Characters) if you want it because that option isn''t
    included by choosing the parent option.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Chapter 1 — Unraveling the Knoppix Toolkit Maze 33


    Note


    In essence, either Allow Untranslated Filenames or any of its sub-options breaks
    the ISO9660 standard. We recommend going ahead and selecting Allow Untranslated
    Filenames anyway; for a penny, in a pound, as they say. Realize that your CD will
    not play in MS-DOS, but however concerned about that you We''ve never had a problem
    with that option and we''ve never had a problem in either Linux or Windows playing
    those CDs. Your mileage may vary.


    The Input Char section enables you to specify the character set you''re using
    in your filenames. If you don''t specify, Kb3 uses the default of ISO-8859-1,
    which covers Western European languages, such as Russian, Asian, or Hebrew, for
    the one you''re using to read this book. If you''re using different characters
    (such as Russian), specify the character set by checking Force Input Char and
    choosing from the drop-menu. If the option you want to use isn''t listed (UTF-8
    isn''t, for instance), you can manually enter it.


    It takes some time to examine all of these options, but if you want to do your
    burns correctly, you have to know how to use the program.


    # Ready, Set, Burn


    OK, it''s time to burn. Click the Burn button in the upper right corner of the
    window. Depending on the speed of your burn and the speed you''ve chosen for you,
    you''ll be shortly done. While Kb3 works, it displays a progress bar showing what
    it''s doing and how it has progressed. If you get an error, take a look at the
    info that Kb3 provides because doing so can help diagnose the problem.


    You can create other kinds of CDs besides simple data disks, that''s probably
    what you''ll use Knoppix for most of the time. The four main tasks are listed
    in the project area, but check out the Tools menu for other possibilities. Keep
    in mind that Knoppix comes with the soft that Kb3 needs to work its magic, but
    a few things are missing for reasons. For example, the transpose package isn''t
    included, so you can''t create audio and video from DVD or AVI files, and you
    don''t have MPEG, so you won''t be able to burn video CDs that will boot and play
    automatically (You can add these on yours, however). Conversely, you can create
    SVCDs (Super Video CDs), believe it or not.


    Note


    The first place to get information about Kb3 is the home page, at www.k3.org.
    There''s not a lot there, unfortunately, but you might find something useful,
    such as the latest news about software releases. However, the mailing list, found
    at www.sourceforge.net/mailarchive/forum.php?forum_id=1927, is useful if you''re
    currently averaging a couple of hundred emails a month, so you might be able to
    find there, maybe even Sebastian Treug, the creator and maintainer of Kb3.


    If you want to learn more about burning CDs and DVDs, an excellent and up-to-date
    resource is Andy McFady''s CD-Recordable FAQ, which you can find at www.cdraq.org.
    For Linux-specific information, use the CD-Writing HOWTO in the Linux Documentation
    Project, tldp.org/HOWTO/CD-Writing-HOWTO.html. It''s several years old, but still
    has good stuff in.


    If you want to bypass Kb3 completely and use the command line, IBM''s developerWorks
    site has a great tutorial, at www-106.ibm.com/developerworks/linux/library/cdburn,
    called Burning CDs on Linux. IBM''s site requires free registration, but not.'
