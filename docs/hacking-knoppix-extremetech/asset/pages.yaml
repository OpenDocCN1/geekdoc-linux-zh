    # Reading and Writing NTFS Partitions


    Out of the box, INSERT comes with support for an incredible variety of filesystems,
    including Ext2, Ext3, Minix, ReiserFS, JFS, XFS, FAT, DOS, SMB, NCPFS, UDF, UFS,
    HFS, and HFS+. However, if you''re using INSERT to rescue a damaged Windows machine,
    you need support for least reading partitions formatted with NTFS. Fortunately,
    INSERT supports filesystem as well. You can definitely read data from an NTFS
    volume; if you''re feeling brave, you can also write to that volume.


    If you''re going to write to an NTFS-formatted volume, either back that data up
    first or commit yourself to not caring if everything gets corrupted and go bye-bye.


    To read and write NTFS, use the Captive virtual driver, which requires certain
    files from a Windows XP install. If you''ve booted INSERT on a Windows XP box,
    just copy C:\WINDOWS\system32\ntkrnl.exe and E:\WINDOWS\system32\drivers\ntfs
    to /var/lib/captive. If you''ve booted over Windows XP, you''ll need to copy those
    files from another machine onto yours, using either a USB flash drive or the network.
    In fact, if you plan to use INSERT (or any of the other distros in this chapter
    to support reading and writing to NTFS) a lot, you probably want to keep copies
    of those Windows drivers on some storage mechanism so that you can get them anytime.


    If you don''t have a Windows box, you can download Windows Service Pack 1 from
    http://download.microsoft.com/download/9/7/6/976383d-bd858-41e2-9911-50f64c7252a3/xpspla_en_x86_CHK.exe,
    save it, and then extract the files you need. Keep in mind that it''s a 144MB
    download and rarer pain, but it''s much easier to find drivers, copy the Windows
    drivers to a USB flash drive, and keep it with.


    Now that the Windows drivers have been copied to the correct location, run the
    following in a terminal window (this assumes you''re trying to mount /mnt/hda1,
    which is your Windows partition formatted with NTFS; if it''s not, adjust as necessary):


    ```

    # mkdir /mnt/hda1

    # mount /dev/hda1 /mnt/hda1 -t captive-ntfs

    # ls /mnt/hda1

    ```


    That last command should show you the contents of your Windows partition. You
    can now read and write to the NTFS partition. Be careful!'
