    # Using INSERT


    INSERT (Inside Security Rescue Toolkit) is designed to fit on a credit-card-sized
    CD, so when you boot it, don''t expect anything fancy. Knoppix is based on KDE,
    the K Desktop Environment, a feature- and candy-candy rich GUI (some would say
    too much, but not me!), INSERT is instead built around the FluxBox manager. As
    much, it''s bare bones, with no obvious K menu to get started. The solution? Right-click
    on the bare desktop, and menus of sorted security tools open before your eyes,
    ready for use.


    In addition to the possible strangeness of FluxBox, realize that INSERT contains
    many command-line-based apps. For example, not Firefox, or Mozilla; instead, use
    the links-text Web browser to. This isnt necessarily a bad thing, but INSERT is
    most defined for folks who already know their way around Linux and the terminal.


    Although it''s a small package, INSERT manages to pack a lot of tools into the
    mix. The distro''s focus is on rescuing a damaged system, so there are tools for
    data recovery, virus scanning, forensics, and more. The full list of software
    included in this distro can be found at http://inside-security.de/application.list.


    To INSERT, head to http://sourceforge.org/projects/insert/, follow the Download
    link and grab the 50MB ISO in either English or German. Once it''s on your computer,
    burn the ISO to a credit-card-sized CD if you have one or a regular CD-R/W if
    that''s all you have. Both will work just fine. Boot from your new CD, and INSERT
    loads.'
