  md: '# Chapter 11 — Creating Archix, Knoppix for Kids 241


    The command line, convert the ppm to L16, the format that Knoppix uses for a boot
    screen. The name must be logo.16, so don''t use anything else:


    ```

    $ ppmtolss-16 < archix.ppm > logo.16

    ```


    Now move the image to its correct location in the Knoppix filesystem:


    ```

    $ cp logo.16 /home/scott/knoppixiso/boot/isolinux/

    ```


    You''ve customized the image that people will now associate with your distro.
    There''s still more you could do, but this is enough to give you some ideas to
    tackle on your own.


    # Mastering the CD


    You can now see the light at the end of the tunnel. That''s left is compressing
    your work, putting it onto a CD, and then final testing.


    Begin by compressing the KNOPIX/KNOPPIX filesystem:


    ```

    $ mkisofs -iso-level 4 -R -U -V "Archix" -hide-rr-moved \

    cache-inodes -no-bak -pad /home/scott/knoppixuncompressed \

    | nice -5 -create_fs - 65536 > /home/scott \

    knoppixiso/KNOPIX/KNOPIX

    ```


    This command can take a while, depending on the speed of the knoppixuncompressed
    directory and your machine. When it''s finished (finally!) to create your final
    burnable or loadable ISO:


    ```

    $ mkisofs -pad -1r -J -V "Archix" -b boot/isolinux \

    isolinux.bin -c boot/isolinux/boot.cat -no-emul_boot \

    boot-load-size 4 -boot-info-table -hide -rr -moved -o \

    home/scott/archix.iso /home/scott/knoppixiso

    ```


    Again, this will take quite a while. It will finally finish, and ls -l /home/scott
    now shows the:


    ```

    -rw-r--r-- 1 root root 6531422016 Jun 12 22:55 archix.iso

    ```


    Awesome! Only 653MB! Archix is finished faster than Knoppix, so there''s plenty
    of room to add other software if the distro is re-mastered Archix.


    There is one thing to fix before. You don''t want the ISO in your home directory
    to be owned by root, so you need to change the permissions (using your own info,
    of course), and then check it again with ls -l:


    ```

    # chmod scott.archix.iso

    # ls -l

    ```


    ```

    -rw-r--r-- 1 rsgranne rsgranne 6531422016 Jun 12 22:55

    archix.iso

    ```


    Now you can do whatever you want with your distro: burn it, test it, use it, or
    delete it and start all over.'
