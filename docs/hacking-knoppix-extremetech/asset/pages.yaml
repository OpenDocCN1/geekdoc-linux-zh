  md: '# Booting Knoppix


    You are visiting a friend who just got the latest Knoppix CD. Excitedly, he puts
    it in the CD-ROM drive of his computer, boots up the PC, and a few minutes later
    you are both ooo-ing and ahhh- at the beautiful KDE Desktop. Life is good. After
    surfing the Web, writing some emails, and chatting with friends, he powers off
    and hands you the CD. You go home, put the CD in your PC''s CD drive, power up
    the machine, and walk away to get a refreshing beverage from the fridge. When
    you get back, you see ... nothing—but a blank screen.


    What happened? This same CD worked beautifully at your friend''s house. To understand
    what might be wrong, you first need to understand how Knoppix boots.


    # Ideal Boot Process


    Ideally, to boot Knoppix, you set your BIOS to boot from the CD-ROM, insert the
    Knoppix CD into your computer''s CD drive, and then boot (either turn on power
    or reboot the machine). After a few moments, the Knoppix splash screen displays.
    If you do nothing or press the Enter key, Knoppix boots using the default settings.
    After a few text messages go by, Knoppix displays the KDE splash screen followed
    shortly by the KDE Desktop.


    That''s what is supposed to happen, and while it sounds fairly simple, there''s
    actually a lot more going under the hood.


    # Booting: the Traditional View


    The way Knoppix boots is not different from any other Linux distribution. The
    BIOS loads the bootloader isolux from the CD-ROM and turns control over to it.
    Isolux locates and loads the Linux kernel and then mounts the initial ramdisk,
    miniroot, which contains the boot script /linuxrc. /linuxrc does all the heavy
    lifting by mounting the compressed system on the CD and doing the primary hardware
    probing and setup.


    # appendix


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_280_0.png)


    in this appendix


    +   - Exploring the boot process

    - Using cheatcodes in booting

    - Tips, tricks, and troubleshooting'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Hacking Knoppix


    Once /linuxrc finishes, it handles control over /etc/init, which reads and parses
    /etc/initabb. With the default boot options, /etc/init runs the initial startup
    scripts in /etc/rc*, which tend to be soft links to /etc/init.d/. The most notable
    startup script is /etc/init.d/knoppix-autoconfig, which further probes and configures
    the system hardware. When it finishes, it enters runlevel 5 and runs the script
    /etc/init.d/xsession, which starts X11 (the graphical user interface) with the
    KDE Desktop. (Runlevels are explained later in this appendix.)


    # Booting: The Knoppix View


    Another way to look at the boot process is in terms of phases and stages, which
    are convenient breakpoints where you can interact with Knoppix. As Knoppix boots,
    it goes through the following four phases:


    +   - Bootloader

    - Text

    - Graphics

    - Shutdown (true, shutdown isn''t really part of booting, but it does complete
    the cycle)


    When these phases in action, let''s take a quick tour through the boot process.
    Insert the CD, boot the computer, and you will see the Knoppix boot splash screen,
    as shown in Figure A-1.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_281_0.png)


    Figure A-1: Start with the Knoppix boot splash screen.'
  merge: -1
