  md: '# 258 Hacking Knoppix


    To enter the shutdown phase, open the K menu and select Logout -> Turn off Computer.
    You can also shut down from within a virtual terminal by shutting down or init
    0. When shutdown completes, Knoppix ejects the CD and gives you finishing instructions.
    Rebooting works similarly: open the K menu and select Logout -> Restart Computer
    from within KDE, or enter reboot or init 6 from a virtual terminal.


    One important point about the Knoppix boot process is that each phase depends
    on the success of the previous phase. If you get into graphics phase, that means
    that Knoppix was able to get through the boot and text phases. Of course, if that
    all goes well.


    Although Knoppix does an excellent job at guessing your hardware and configuring
    the settings, it is still just a guess. Knoppix guesses or makes the wrong assumption.
    When that happens you find yourself staring at a blank screen, a system that sometimes
    freezes, or a screen full of odd-looking text with the words "Oops! or "Panic!
    So what do you do when that happens? And then, how can you nudge Knoppix so that
    it guesses correctly or makes different assumptions? Use cheatcodes.


    Cheatcodes are options that you pass to Knoppix at boot time to configure various
    settings. In the earlier example you used cheatcode 3 to tell Knoppix to stop
    the boot process in the textmode.


    > Note For a more complete list of cheatcodes and their descriptions, visit the
    KNOPPIX.net Website, www.knoppix.net/wiki/Cheat_Codes.


    # Booting: Knoppix Details


    Let''s go through the boot process again, this time examining each phase in a
    bit more detail and exploring some of the cheatcodes that are processed at each
    level.


    # Examining the Bootloader Phase


    During the boot phase, the BIOS loads and runs the isolinux bootloader from the
    CD-ROM. At the end of the bootloader phase, the Knoppix splash screen displays.
    If you do not see the Knoppix splash screen, you might want to try out one of
    these fixes:


    +   - Check your BIOS to ensure that your system can boot from a CD-ROM.

    - Check the md5sum of the ISO to ensure that it was not corrupted during the download.

    - Make sure that you burn the ISO to the CD as an image and not as a file.

    - Make sure that you burn at a slow speed —less than 8x— to ensure that you get
    a good burn.

    - Run boot: memtest to check your system''s memory.

    - Run boot: knnoppix vga=0 tested to check the CD.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Appendix A — Booting Knoppix 259


    If you''ve tried all of these options and Knoppix still does not display the splash
    screen, you may want to look into the Smart Boot Manager (http://btmgr.sourceforge.net/about.html),
    which automatically loads bootable floppy, hard, and CD-ROM devices and enables
    you to boot from them when the BIOS does not recognize them.


    If you still have problems booting Knoppix, post a question to the knoppix.net
    forums (www.knoppix.net/forum). Be sure to include the Knoppix version, a brief
    description of your hardware, and any error messages.


    At this stage of the boot process, there isn''t much to look at. It pretty much
    either works or not. However, it is at the boot prompt that you type cheatcodes
    that determine the rest of the boot processes.


    # Examining the Text Phase


    The text phase can be broken down into five stages. As Knoppix goes from stage
    to stage, it probes and configures more and more of your hardware. By pausing
    at each stage, you can examine what Knoppix has done and change before moving
    to the next stage.


    Let''s take a more detailed look at the stages in the text phase by using two
    additional cheatcodes debug and -b, which tell Knoppix to pause and display a
    shell prompt at the end of each stage.


    # Exploring Stage 1


    At the boot prompt, enter the following:


    ```

    knoppix debug -b 3

    ```


    This time, you see a lot more text fly by, and then the screen shown in Figure
    A-3 is displayed. This stage is very important because it tells you a lot, including
    the following:


    +   - Your machine can boot from the CD-ROM.

    - The default Linux kernel works with your machine.

    - Video mode is working.


    At this stage, Knoppix is running a very stripped-down version of the ash shell.
    There''s not a whole lot you can do except the built-in ash commands and the few
    external binaries. For example, you can type ls to get a listing of the files;
    there is no ls. Instead, use echo * or echo /proc/* to see a listing of files
    in the current directory or /proc, respectively. You can also do some simple looping
    to explore kernel settings or devices:


    ```

    for i in /proc/* ; do echo $i ; done

    ```'
