    # Testing Myppix


    As discussed in Chapter 11, QEMU is an emulator that enables you to test (albeit
    verrrrrrrry sloooooowly) the Myppix ISO without having to burn it first.


    To test Myppix with QEMU, run the following:


    ```

    $ qemu -cdrom myppix.iso

    ```


    Booting Myppix with qemu took me more than 20 minutes from start to KDE. That''s
    a long time to wait, you''ll be certain that myppix.iso is good and that your
    distro will boot.


    # Summary


    This chapter has focused on your specific needs as you create Myppix, a Knoppix-based
    distro just for you. One of the most important steps is at the beginning, when
    you boot Knoppix, configure everything to your liking, and save those changes.
    Then you prepare Knoppix, remove and install software packages, customize the
    look of your new distro, copy over the saved config files, and finally master
    and test your CD image. The whole process takes a while, but the result is awesome:
    Myppix, a distro just for you. Enjoy!'
