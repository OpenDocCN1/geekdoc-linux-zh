  md: "# 18 Part I — Navigating the Amazing Knippox Toolkit\n\n![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_43_0.png)\n\
    \nIf the new waveform doesn't look like it did a few seconds before, that's because\
