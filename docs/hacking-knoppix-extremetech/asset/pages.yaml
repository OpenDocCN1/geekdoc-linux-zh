  md: '# 200 Part III — Knoppix Variants


    > There is a script on INSERT that somewhat automates this process: /usr/sbin/use
    captive. If you don''t want to use Captive manually, try running script first.
    For further info on Captive, visit the project page at http://jankratochvil.net/project/captive/.
    Captive is no longer under active development by the original author, but others
