    # # Repairing Boot Issues


    There''s a sinking feeling, deep in the pit of your stomach, when a system won''t
    boot. In the past, a failure to boot meant you''d spend hours fiddling with config
    files in an often fruitless-less attempt to fix the problem, or worse, a re-install
    of the OS. Now a boot problem doesn''t mean a big time loss because Knoppix can
    be used to fix issues that arise when you start up your computer. In fact, you
    might be surprised just how easy it is to wield Knoppix as a powerful fix-it tool.


    > We know that sure could have used Knoppix eight years ago when we tried to install
    Red Hat on a Windows box to create a dual-boot machine and ended up staring in
    horror at the blinking LI on the computer monitor, certain that we had lost a
    lot of data on the hard drive. Oh, the humanity!


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_117_0.png)


    # # Restoring a Missing MBR


    Often enough, the cause of a boot issue involves a corrupted or missing MBR (Master
    Boot Record). The MBR is virtually important to your computer. It is a 512-byte
    area at the beginning of your hard drive that contains two critical items: the
    information that enables your computer to boot, and your partition tables. If
    your MBR gets messed up, you''re normally up a creek. How does the MBR get messed
    up? Well, attempting to create a dual-boot system installing Windows after Linux
    usually gets the tricky (always install Windows first, and then install Linux!),
    and so running fdisk /mbr from within Windows. Sometimes it gets corrupted for
    no discernible reason.


    Because the MBR is so vital, you really should back it up regularly, just in case
    disaster strikes. You can back up the MBR from within Windows by Knoppix using
    the following command (which assumes that you''re copying the MBR on the machine
    named Homer onto a USB flash drive):'
