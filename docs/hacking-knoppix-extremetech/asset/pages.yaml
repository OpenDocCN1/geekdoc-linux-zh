    here''s how to connect an HP LaserJet 6L to a Xandros Linux machine shared through
    Samba:


    +   1. **Introduction:** Click Next.

    2. **Backend Selection:** Choose SMB printer (Windows). Click Next.

    3. **User Identification:** Choose Normal Account and enter a Login and Password
    for the Xandros box. Click Next.

    4. **SMB Printer Settings:** Enter the SMB Workgroup name (MILTON, in this example),
    the SMB server name (Cromwell, in this), and the name of the Printer (hplj6l,
    in this example). Click Next.

    5. **Printer Model Selection:** Select HP as the Manufacturer and LaserJet 6L
