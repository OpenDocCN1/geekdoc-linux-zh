  md: '# UnionFS Opens New Doors


    The main problem with using new software used to be coping with the fact that
    the Knoppix filesystem for the most part was read-only, with /usr, /lib, and large
    parts of /etc and /var not being writable and the rest of the filesystem residing
    on a RAM disk. There were techniques that could be used to work around this limitation,
    but they were somewhat clumsy to use. Recent versions of Knoppix have removed
    this limitation, thanks to the UnionFS overlay filesystem. UnionFS enables you
    to write to read-only directories as if they were writable, while transparent
    placing placing changes into memory and rerouting requests to the new file. This
    greatly eases the task of installing new software and opens up a lot of new possibilities
    for Live CDs.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_232_0.png)


    # Changing Knoppix Without Remastering


    Remastering—the rebuilding of a Live CD—is a complicated and time-consuming process,
    as you''ll see in Chapter 10. Although plenty of fun, it is overkill for minor
    modifications because there are ways to save your Knoppix changes on floppy disk,
    USB flash drive, or one of your hard disk partitions. You can run the saveconfig
    script, which uses knnoppix.sh to unpack an archive of modified configuration
    files on one of those writable media, for instance, or you can run the knnoppix-mkimage
    script, which is much like the older persistent home script that saves the files
    in your home directory, using a writable image or a whole partition. Let''s take
    a closer look at those two methods.'
  merge: -1
