    Excellent. You''ve got the software situation in hand. Time to perform final clean-ups.


    All of this installing and uninstalling has been generating system mail that you
    need to remove:


    ```

    # rm -rf /var/mail/root

    ```


    Anything in the /tmp directory needs to go:


    ```

    # rm -rf /tmp

    ```


    Before exiting your chroot environment, unmount the proc filesystem:


    ```

    # ummount /proc

    ```


    Do not forget to do this or your new Knoppix variant may not work the way you''re
    expecting!


    Finally, it''s time to leave chroot:


    ```

    # exit

    ```


    You''re now back in your normal shell, where you have some further customizations
    to perform.


    # Customizing the Look of the Distro


    You have the software you want, but you might want to make things look cool.

    In the preceding chapter, you learned how to set the desktop''s background image
    to something a bit more interesting—The image used there—the earth at night, with
    all the lights in the world twinkling—is pretty cool. You can follow the instructions
    in Chapter 11 to change your desktop background to that image or to other image
    you want.


    Long before the Desktop background shows up, the boot screen make its appearance.

    That''s where you will present the user with the name of your distro and any other
    important information. The main user of Myppix is well, you, there really isn''t
    a huge need to change the boot screen. You know that this is your distro, after
    all, and you are the intended user, a boot screen seems a bit superfluous.


    OK, OK... if you really want to create your own boot screen, the entire process
    is covered in Chapter 11. Take a look there, and go crazy making a boot screen
    that absolutely screams you.'
