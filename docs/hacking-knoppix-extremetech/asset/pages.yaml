  md: '# Part I — Navigating the Amazing Knoppix Toolkit


    Change the fonts on screen to ones that you like better. The following are our
    recommendations:


    +   - Standard font: Verdana or Bitstream Vera Sans

    - Fixed font: Andale Mono (if you have it on your system, it''s much better than
    anything in the Courier family)

    - Serif font: Bitstream Vera Serif or Times New Roman (use Times New Roman only
    if you must; Bitstream Vera Serif is far easier to read)

    - Sans serif font: Verdana or Bitstream Vera Sans

    - Cursive font: Lucida Calligraphy, Lucida Handwriting, and Bradley Han ITC are
    great, but none of those is available, so choose Arioso.

    - Fantasy font: Comic MS isn''t (you''re hardly ever going to need this font),
    but you can pick any goofy font.


    Click OK to make the changes and close this window. You can close Konqueror if
    you''d like. Now that you''ve changed your system fonts, move on to program fonts.


    # Changing Application Fonts


    You''ll probably find yourself using Mozilla Firefox, KMail, and OpenOffice.org
    often. You can change your fonts to make these programs more usable, too.


    # Fixing Firefox Fonts


    To set Firefox''s fonts, click the Mozilla icon on the panel (yes, it should be
    the Firefox icon, but it isn''t), and choose Edit -> Preferences, click the General
    icon, and select Fonts & Colors (see Figure 1-5).


    Make these changes:


    +   - Proportional: Sans Serif

    - Serif: Bitstream Vera Serif/Times New Roman

    - Sans serif: Bitstream Vera Sans or Verdana

    - Monospace: Andale Mono


