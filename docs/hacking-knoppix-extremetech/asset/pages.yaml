  md: '# 36 Part I — Navigating the Amazing Knoppix Toolkit


    V really isn''t that difficult to work with —it just takes some getting used to.
    Once you''re comfortable with the basics, it''s easy to expanding your vim knowledge
    base, with scripts and macros and regular expressions and all sorts of other fun,
    powerful stuff. The sooner you can do just a little bit with vim, the sooner you''re
    on your way to using Knoppix more effectively.


    # Editing Configuration Files Using the GUI Editor Kate


    At last count, there were more than 7,000 text editors available for Linux. OK,
    that if it was just an exaggeration ... not much of one. Knoppix includes a few
    text editors, and they serve their purpose. Probably the easiest-to-right-out-of-the-box
    GUI text editor on the Knoppix disk is Kate. Kate is powerful and officially targeted
    at developers, although anyone can use it. From the K menu, select Editors →Kate.
    Kate opens, as shown in Figure 1-25.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_61_0.png)


    FIGURE 1-25: Kate, the text editor, ready to edit text


    If you''re reading this book, you''ve used a text editor in your life, even if
    it was just Notepad. Kate is very easy to use for simple tasks because it is pretty
    much like every other text editor in the world, but it contains a lot of special
    features that make it appropriate for more sophisticated work as well.


    There''s only space to point out a few of Kate''s features here. The best way
    to learn about Kate is to go through all the menus, playing with the options and
    trying things out.


    Ever wanted to view different parts of the same file at the same time? Select
    View → Split Vertical, which enables you to do just that. To return to the single
    display of a file, select View → Close Current View.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Chapter 1 — Unraveling the Knoppix Toolkit Maze


    Need to run a command against the file you''re working on, but don''t want to
    switch to Konsole? Click the Terminal at the bottom of the window; a resizable
    console frame appears, already targeted at the directory where your file resides.
    Perfect for a quick -w file.txt (to find the number of words in your file) or
    run ifconfig to grab your machine''s IP address and paste it into your file. To
    close it, click the Terminal button.


    Finally, do you need to directly open a file on another machine accessible only
    via SSH, and find downloading, editing, and uploading it would be too much? No
    problem. Use KDE''s built-in transparency, select File -> Open, and in the Location
    box find fish:username@other.computer.com (you can use an IP address instead of
    the domain name, if you want). You may have to accept the machine''s SSH key if
    this is the first time you''ve connected to it (answer affirmative if asked).
    Enter a password when you''re prompted, and bond! You''re connected to that machine
    over a secure connection. Select the file you need, click Open, edit it, save
    it, and you''re done. You''ve just remotely opened a file as though you were sitting
    on your machine. Pretty cool, eh?


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_62_0.png)


    Kate, like any KDE app supporting the built-in libraries providing transparency,
    can work with files using a variety of protocols, including FTP, SFTP, SMB, NFS,
    and WebDAV. For a quick overview of KDE''s transparency see www.osdir.com/Article2159.html.
    For more information on some of these protocols and their usage in Knoppix, take
    a look at Chapter 3.


    # Working with Office Software


    Like Dilbert, many folks spend their days in offices, working for the Man, trying
    to earn their daily bread. If you''re among them, having Knoppix in your arsenal
    at least provides you with a cool operating system while you do your time in cubital
    prison.


    # Enjoying Interoperability with OpenOffice.org


    Office suites are important. In 1984, Apple introduced the first office suite
    — AppleWorks—enabled users to create text documents, crunch numbers, and work
    with data (software to give presentations came later). Although it was underpromoted
    by Apple, and only on the Apple II instead of the new Mac, it proved to be incredibly
    popular. When Microsoft released Office 95 to coincide with the release of Windows
    95, there was no looking back. Now, people spend most of their workday inside
    their office suite suite.


    Microsoft may currently dominate the office suite software market, but things
    are slowly starting to change. A free, high-quality, open-source office suite
    has been a long time in coming, and one is finally here: OpenOffice.org (known
    as OOo devotees). It runs on Mac OS X, Windows, and Linux; it provides a word
    processor, spreadsheet, and presentation program; and exchanges documents with
    Microsoft''s Office suite beautifully. It''s an essential tool for any computer
    user, and it comes with Knoppix.'
  merge: -1
