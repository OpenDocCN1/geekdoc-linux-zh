  md: '# Chapter 6 — Assessing Security with Knoppix 147


    Protecting with Encryption

    How do you protect against Ethereal? It''s pretty simple, really. Use encryption.
    That means SSL whenever you have to log in to any Website that needs a username
    and password, and SSL for any email clients. For the contents of email, use GPG
    (discussed earlier in this chapter).


    Want to scare a friend or family member and show her the value of good security?
    Use Ethereal for a while when she''s using the Net to surf and read emails, and
    show her what you learned. I have the feeling she''ll be a lot more receptive
    to a simple discussion about the benefits of SSL and encrypted POP3 and IMAP.
    In that way, you can use Ethereal to make everyone safer.


    Ethereal is an awesome program that offers hundreds of features and tweaks, and
    I''ve barely touched on a fraction of its capabilities. To learn more, start with
    the excellent User''s Guide, available in HTML or PDF formats at http://ethereal.com/docs/.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_172_0.png)


    # Performing Forensics with the Coroner''s Toolkit


    One of the most popular shows on TV right now is CSI: Crime Scene Investigation.
    Every week, an intrepid team of investigators uses forensic evidence and the latest
    scientific tools to plumb the depths of human crime and malvolence. Using clues
    such as blood spatters, footprints, teeth impressions and gunpowder residue, the
    past can be reconstructed and crimes can be solved.


    In the computer world, forensics is a well-known aspect of computer security.
    When a machine is compromised, it''s important for a qualified, knowledgeable
    person to use tools such as the Coroner''s Toolkit (known as TCT) to enable the
    reconstruction of the computer to learn the following:


    +   - The exact causes of the break-in can be reasonably ascertained

    - The extent of the damage can be cataloged

    - The evidence can be preserved in a way that can be used in legal proceedings


    That last point is especially important. If a court case is to be made, it is
    imperative that the evidence is gathered and preserved in a way that does not
    allow for any argument to be made that the gathering and preservation itself or
    manipulated any of the evidence. For reason, I do not encourage you to introduce
    yourself if the legal system is going to be involved. Instead, engage the services
    of a security professional (who may well run TCT).


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_172_1.png)


    The Coroner''s Toolkit is actually a collection of software packages, some of
    which can be run independently, that work together to give you a snapshot of the
    activities a computer was engaged in at a specific time. It includes the following:


    +   - Grave-robber: Runs several other tools that gather together as much information
    about a computer system as possible.

    - Maxime: One of the tools used by grave-robber, which you can also run independently,
    that looks at the last time the following occurred:'
