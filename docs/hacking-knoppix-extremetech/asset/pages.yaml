    Figure 8-1: Now that is good mening!


    As you can see, everything is broken down into the major tasks you''d want in
    a distro focus on security checking, which is Auditor''s goal. It wants to be
    the Live CD you use when you need to check out a network or machine to figure
    out what''s going on. In particular, it has a lot of good scanning tools, especially
    wireless scanning tools, and 64 million entries in word lists that you can use
    for brute-force password cracking. Best of all, the developer — a guy named Max
    Moser seems to work hard to keep Auditor up-to-date, with regular changes and
    tweaks. He develops progress at http://new.remote-exploit.org/index.php/Auditor_devlog.
    Bookmark that page and view it to see what is new and different.


    > If you like Auditor and want to help the developers out, you can give them money
    by visiting their website and clicking the Make a Donation button.


    To acquire Auditor, head over to the project''s home page, http://new.remote-exploit.org/index.php/Auditor_main;
    scroll down to the Downloads section; and click the link for the list of download
    mirrors. Download the zipped ISO (about 525MB) from one of the sites, unzip it,
    burn the ISO, boot with it, and you''re ready to go.


    Following are three tips that will be handy when you start to use the feature-featured
    Auditor distro:


    +   - How not run Konsole as root: When you open a terminal in Auditor, it always
    opens as root. This is fine with Auditor because most of the useful command-line
    tools you need should be run as root anyway. However, if you want to mount your
    local drive to write data to it, you may want to take safeguards. To become a
    nonroot user in Konsole, just type su knoppix and press Enter. You''re now running
    without root privileges; to become root again, enter exit and press Enter.'
