    # Preparing Knoppix


    You must get all the files onto your computer before you can change Knoppix. To
    do so, return to Chapter 11 and follow all of the instructions in the “Preparing
    Knoppix” section.


    # Creating Your New Distro


    Now that preparations are completed, you can begin the fun part: making Knoppix.
    Start thinking now, if you haven''t already, about exactly what you want in a
    Knoppix built especially for you. What settings do you always alter? What software
    do you always install? What packages never used? Fonts, colors, home pages ...what
    do you like? Try to make a list of the things to go into your Linux.


    Meanwhile, set up your remastering environment by returning to Chapter 11 and
    following all of the instructions in the “Preparing Environment” section.


    All set? Good. Let''s move on. In Chapter 11, you removed any software that didn''t
    seem appropriate for the kiddies. For instance, you said bye-bye to internationalization
    packages, emacs, security tools, Thunderbird, Apache, development packages, and
    a whole lot more. You''re not a kid, though, and you probably want to keep some
    of that stuff, so this times are going to be a bit different. From your creation
    of Arch, you most likely have an idea of the things you want to remove from your
    own distro, but let''s take another look at procedure


    As before adding or removing software, you need to tell APT to update the list
    of software-available on repositories:


    +   - apt-get update


    Information appears in your terminal as APT connects to repositories listed in
    /etc/apt/sources.list file. The first thing to do is update APT itself, just in
    case there something new in there that you need, so enter the following on the
    command line:


    +   - apt-get install apt-utils -t unstable


    unstable in this command moves, roughly, the beta set of Debian packages. APT
    asks whether you want to install the packages you indicated, as well as a few
    others. Enter Y, and after process completes, run the update command again. Then
    you can quite some packages.


    It''s always vital to keep tabs on how much space is used in your distro, so run
    the disk usage command:


    +   - du -c'
