- img_proc: true
  md: '# Chapter 3 — Connecting to Other Machines Resources 75


    Remember that all traffic sent over SSH is encrypted. To make the encryption possible,
    keys are exchanged between your computer and the server to which you''re connecting.
    This warning is SSH''s way of telling you that it has no way of knowing if the
    server''s key is valid—if, in other words, if you''re positive that you know the
    key is valid and not the victim of a man-in-the-middle attack—go ahead and click
    Yes to add the key to the list you found at ~/.ssh/known_hosts (if the key changes
    on the server because the OS is reinstalled, you''ll need to find the appropriate
    line in known_hosts, delete it, and reconnect to the server to re-accept and re-enter
    the key).


    After the key is added, you''re prompted for a username and password. Go ahead
    and enter it, and a few seconds later you should see the contents of the SFTP
    server.


    Want to know more about man-in-the-middle attacks? Check out Wikipedia''s article
    on the subject, at http://en.wikipedia.wiki/Man_in_the_middle_attack.


    Download and upload files with SFTP in the same way you do so with FTP: just drag
    and drop, or right-click and choose Copy To. If this is an SFTP site you plan
    to use several times while you''re running Knopix, go ahead and bookmark it for
    easy access later.


    Be safe: When you have a choice, use SSH instead of FTP.


    I use SCP at home on my internal network, partly because I''m paranoid, and partly
    because I use it now that it''s just automatic. It''s a good idea to develop the
    same habit.


    # Using SCP


    If you''re a command-line junkie and you''re in a hurry, SCP (secure copy) is
    a great way to quickly copy a file from one machine to another using SSH. SCP
    basically follows this pattern: scp user@host1:file@host2:file. You can leave
    out the user@host, however, if one of the files you''re working with is local,
    as you''ll see in a moment.


    For example, suppose you want to use scp to copy me.jpg from the directory you''re
    currently in your website on another machine (called wiley.com). Type following
    following on the command line and press Enter:


    ```

    $ scp me.jpg username@wiley.com:/var/www/mywebsite/images

    ```


    You''ll be prompted for a password, and a moment later, me.jpg will be available
    on your Website for viewers around.


    You''ve got several JPEGs you want to transfer? Simple!


    ```

    $ scp *.jpg username@wiley.com:/var/www/mywebsite/images

    ```


    To copy all the JPEGs on your server to your current machine, but to a different
    directory than your current one, type:


    ```

    $ scp username@work.wiley.com:/var/www/mywebsite/images ~/pix/website

    ```'
