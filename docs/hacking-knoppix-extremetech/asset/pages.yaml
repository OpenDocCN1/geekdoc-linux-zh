    # # Tracing Route


    Sometimes your network connection is so slow out and you can''t figure out why.
    Traditionally, two of the first tools a network-savvy user uses ping, which tells
    you whether a machine is up, and traceroute, which informs you of the path packets
    taking from your machine to another. INSERT has a cool little software that combines
    the two functionalities into one: mtr.


    For example, suppose I noticed a slowdown getting to my Website, http://granneman.com.
    To check, I run the following command:


    ```

    $ mtr www.google.com

    ```


    Within a few seconds, I get the output shown in Figure 8-17.


