    that tool moving on to the full glut of data provided by grave-robber. For a quick
    look at how to utilize mactime, run it against the /etc/init.d directory, which
    holds a lot of the programs run as services on your Knoppix machine:


    ```

    $ sudo mactime -y -R -d /etc/init.d 1/1/1970

    ```


    The options in this command mean the following (for the full list of options,
    use man mactime):


    +   - y: Display the date YY MM DD, instead of MM DD YY, which makes for better
    sorting.

    - R: Process the current directory, and all subdirectories, recursively.

    - d: Use the following directory instead of a database (/etc/init.d in this example).

    - 1/1/1970: Show all files modified, accessed or changed after this date (in this
    example, the UNIX epoch, seen by UNIX systems as the start of time); it''s also
    possible to use a range, such as 4/1/2005–4/2008.


    For information on the UNIX epoch, see the Jargon File at http://clueless.com/jargon3.0.0/epoch.html
    or Wikipedia''s in-depth "Unix time" article at http://en.wikipedia.org/wiki/Unix_epoch.


    The example command should produce output containing at least some of the:


    99 Nov 07 10:35:31 2213 m.. -rwxr-xr-x root /etc/init.d/rc

