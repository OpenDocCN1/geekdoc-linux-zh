    # Summary


    This chapter includes the design for a cluster using Knoppix and Knoppix-derived
    distros. With the advent of UnionFS and other tools, Knoppix is a good alternative
    for building a quick cluster system. Because Knoppix is a live-CD distro, its
    performance won''t be as good as other architectures, but for speed of development
    and flexibility, it''s straightforward to configure, can be designed to be dynamic,
    and is growing in popularity. With a little planning, a Knoppix cluster integrates
    well into an existing environment.'
