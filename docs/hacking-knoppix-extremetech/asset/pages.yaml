    # Wiping a Hard Drive


    Probably anyone reading this book is a bit paranoid when it comes to computers,
    most likely because you have an idea how computers really work. For instance,
    you know that sending an encrypted file is pretty like sending a postcard through
    the mail—anyone can read it along the way—and you also know that deleting a file
    doesn''t really delete it.


    In fact, a well-published report published in 2003, tech Simon Garfinkel looked
    at 150 hard drives purchased at sales. Many of those drives were supposedly erased,
    yet Garfinkel and his team were able to recover—including credit card numbers,
    bank account numbers and sensitive corporate memos, email messages, and photography—from
    64 percent of them.


    If you’re getting rid of a computer, or just a drive, it’s a good idea to really
    remove the drive that you have. If you don’t use the drive anymore, take a ball-peen
    hammer and beat it until you destroyed the drive (be sure to wear safety goggles!),
    or take a drill with a strong bit and run through that a number of times until
    your drive resembles Swiss cheese. No one—not even Jack Bauer at CTU—can recover
    any data that off.


    However, if you want to pass the drive to someone else to use, but you don''t
    want to be able to recover any of the data on it, you have two options: Knoppix-employing
    dd and using wipe. Leave them unmounted. No matter which technique you use, do
    not mount the partitions you want to wipe. If you''re not sure which partitions
    are on your machine, or what Knoppix thinks they are, go to the K menu and select
    System → TParted to display your drives and partitions.


    Be careful when using TParted because you can accidentally delete a partition.
    (For more about this great program, see the discussions in Chapters 4 and 5).


    When TParted opens, select a drive in the Device panel at Most likely, you’ll
    be interested in /dev/hda, your first hard drive. TParted takes a few seconds
    to analyze the drive, and then you see something like is shown in Figure 6-12
    (remember, though, that your drives and partitions may vary).'
