  md: "# Changing Knoppix to Fit Your Needs\n\nKnoppix comes bundled with a bucket\
    \ of tools, and although 1.7GB of uncompressed space goes a long way, you might\
    \ encounter the problem of using software that Knoppix does not include by default.\
    \ Additionally, you may make changes in configurations that you want to keep when\
    \ you reboot, or store data between Knoppix sessions. Thankfully, there are a\
    \ few different ways to solve this, some being easier to use and more successful\
    \ than others. This chapter shows you how to use and modify Knoppix to save your\
    \ data and install new software.\n\nMost of these techniques can be done without\
    \ using a terminal, it's assumed that you know the command-line basics of Linux\
    \ and bash.\n\n# Using apt-get and KPackage to Install New Software\n\nIn the\
    \ latest versions of Knoppix, you can use the Debian package management utilities.\
    \ The most important of these are apt-get, software package retrieval and installation\
    \ tool that provides access to the more than 16,000 packages available in Debian.\
    \ KPackage is a front-end to the KDE desktop, making it easy to find and install\
    \ new apt-get new software packages available in Debian.\n\nThis section shows\
    \ you how to use KPackage to install KPDF, a PDF viewer for KDE. (KPDF is normally\
    \ part of the KDE desktop but it doesn't come with Knoppix.) Depending on the\
    \ version of Knoppix used, you might have to first set the user password from\
    \ a terminal:\n\n```\nsudo passwd knnoppix\n```\n\nEnter a new password for the\
    \ user knnoppix. (If you're a root password, use sudo passwd root instead.)\n\n\
    To start KPackage, choose KNOPPIX $\rightarrow$ Utilities $\rightarrow$ Manage\
    \ Software in KNOPPIX (kpackage). After KPackage starts, update the package lists\
    \ by opening the KPackage menu and selecting Special $\rightarrow$ APT: Debian\
    \ $\rightarrow$ Update.\n\n# chapter 9\n\nin this chapter\n\n+   - Using KPackage\
    \ and apt-get to install Debian packages\n\n+   - Saving your current configuration\
    \ in Knoppix\n\n+   - Saving the files in your home directory in Knoppix\n\n+\
    \   - Changing Knoppix to Fit Your Needs"
