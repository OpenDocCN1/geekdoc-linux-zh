  md: '# Maximizing Knoppix Internet Tools


    The Internet has been central to the growth of Linux — after all, Linus Torvalds
    could not have marshaled the enthusiasm and work of thousands of people all over
    the world without it. That''s also true for Knoppix. Klaus Knopper is German,
    but people all over the globe helped build Knoppix into the exciting, innovative
    product it is today. This chapter explores the many ways you can combine Knoppix
    and the Net.


    # chapter 2


    in this chapter


    +   - Accessing the Internet


    +   - Working on the Internet


    # Accessing the Internet


    Before you use all the really cool Internet tools that are introduced in the second
    half of this chapter, you first have to get on the Internet. Most of the time,
    this isn''t a problem: you just boot your computer with the Knoppix CD inserted,
    and at the end of the boot process, you''re connected. Things grow complicated,
    however, if your hardware isn''t recognized or you still cannot access bandwidth.


    # Connecting via Your Modem


    If you''re still using dial-up to access the Net, don''t despair — you can still
    use Knoppix. However, the same caveats apply to modems used with any Linux distro
    apply to Knoppix: internal modems may or not to work (if it''s a WinModem, probably
    not), external modems are more likely to work. If you''re using a laptop, the
    built-in modem probably is a no-go, but a PCMCIA modem probably is OK.


    In other words, if Knoppix detects your modem, great. Things are looking good,
    and you should be able to get online. If Knoppix doesn''t detect your modem, you
    will have to decide how much time and energy you want to put into getting your
    modem to work. You can look around the Knoppix forum, but don''t expect much,
    frankly. That''s why I always keep spare PCI and PCMCIA modems around; I know
    they work with Linux, and especially Knoppix. Here''s what I rely on:


    +   - PCI: USRobotics 3PC5610


    +   - PCMCIA: USRobotics Megahertz XJ1560'
