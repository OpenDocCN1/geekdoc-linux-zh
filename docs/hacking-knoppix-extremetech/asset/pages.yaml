  md: '# Enjoying Multimedia


    Multimedia makes computing fun, whether it''s music, video, images, or any combination
    of these. While it''s doubtful that you''ll ever use Knoppix as a true multimedia
    box acting as the hub of your digital life, it''s still really cool that this
    Live CD comes with software that you can use for your multimedia files. Let''s
    walk through the highlights of the software, taking brief looks at some of the
    best multimedia on any OS, not just Linux.


    # Listening to Sound


    Noise. Notes. Speech from a movie. Verses from a song. With Knoppix, you can hear
    it all ... and change it as well.


    Listening to Music with XMMS

    Linux users have a huge variety of audio players from which to choose, with more
    coming out every day, but Knoppix includes an old standby that may still use and
    rely upon: XMMS, the X Multimedia System.


    Open XMMS from the K menu by selecting Multimedia -> XMMS. To use XMMS effectively,
    you need to be able to see it, and by default the interface is built for perfect
    eyes who are also looking at the program through powerful electron microscopes.
    Right-click on a blank area of the program and select Options -> Double. That''s
    much better! Once you master XMMS and its interface, you can go back to the regular
    size, for now, use the enlarged window.


    Besides the XMMS window, you really need to display the Playlist Editor window,
    so click the PL button (or right-click on the program and choose Playlist Editor).
    The Playlist Editor window opens. Resize the playlist by grabbing the bottom right
    corner and dragging it so that it''s bigger. That makes it easier to see the songs
    that you have queued. Figure 1-9 shows XMMS with a docked Playlist Editor.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_39_0.png)


    Figure 1-9: XMMS is simple and effective.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# Chapter 1 — Unraveling the Knoppix Toolkit Maze


    XMMS plays tunes in a wide variety of formats, including MP3, OGG (a patent-free
    alternative to MP3—and it sounds better, too!), WAV, and CD audio (in fact, XMMS
    plays videos in the MPEG format as well). You can add songs to the XMMS playlist
    by clicking on the FILE icon, which opens a Load dialog box. Navigate to your
    music, find the files you want to, select them, close the dialog, and click the
    Play button in XMMS. Assuming that your sound card is supported, you should hear
    your music.


    Here''s another way to add music to your playlist: open the Konqueror file manager,
    navigate to your songs, select the ones you want to, and drag them over the XMMS
    playlist. Much easier, especially if you already have Konqueror to manage files.


    XMMS isn''t a complicated program. If you''ve used any audio player on a computer,
    you''ll probably figure out XMMS pretty quickly. If you get stuck, or just want
    to learn more about XMMS, as well as download skins and plug-ins, visit the project''s
    home page at www.xmms.org.


    # Editing Sound Files with Audacity


    Audacity is a free audio recorder and editor that can import digital audio files,
    manipulate them in an astonishing variety of ways, and export them. Before you
    use Audacity, though, you need a sound file to edit. The sidebar "Converting MP3s
    to WAVs" explains how you can acquire a sound file.


    Once you have a sound file, open Audacity (see Figure 1-10) from the K menu by
    selecting Multimedia ➜ Audacity.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_40_0.png)


    Figure 1-10: Audacity, when you first open it'
