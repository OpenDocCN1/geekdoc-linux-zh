  md: '# Unraveling the Knoppix Toolkit Maze


    # chapter 1


    Linux is famous as an operating system that includes almost everything software
    user could ever want out of the box — and for free. The Knoppix developers had
    quite a time deciding which of the thousands of packages to include, made their
    decisions, and you''re the one who benefits. This chapter can''t cover everything
    that comes on the Knoppix disk—that would be a book in itself!—but it takes a
    look at important apps such as K3b and the GIMP that you''ll probably find your
    yourself using at one time or another.


    > Note If you don''t know how to boot Knoppix, before you go much further. Refer
    to Appendix A, "Booting Knoppix," for complete instructions. You have to be running
    Knoppix to really learn from this book.


    +   - Making Knoppix look nicer

    - Setting printers

    - Enjoying multimedia

    - Burning CDs with K3b

    - Using text editors

    - Working with office software


    # Beautifulifying Knoppix


    Out of the box, Knoppix has what could be called "ugrification issues." It just
    isn''t as pretty and user-friendly as it could be. One of the first things you
    might want to do when you start Knoppix is to make it a bit neater, so that it
    won''t cause you to constantly grit your teeth at jagged, ugly fonts.


    Then, after making your changes, you want to make sure you save your choices so
    that when you next boot Knoppix, you won''t have to reconfigure the appearance
    of the OS again. That''s covered in depth in the Introduction, but if you somehow
    skipped over it, for now just select Knoppix -> Configure -> Save Knoppix, choose
    a hard drive or USB flash to save onto, and then choose that source the next time
    you boot Knoppix.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Part I Navigating the Amazing Knoppix Toolkit


    # # Replacing System Fonts


    The default fonts are definitely ugly. Blech! We think the best solution is to
    download and install the Microsoft Web fonts, which are attractive and common.
    However, if you''re not using the persistent home directory, you''re going to
    have a problem. You will be able to install the fonts, but when you restart Knoppix,
    you''ll have to reinstall all the fonts again, because all of your work will have
    been blown away. With the persistent Knoppix disk image, all of your work is saved,
    so you can count on your newly installed fonts being there.


    To install the Microsoft Web fonts, use KPackage, the KDE software installation
    for Debian''s APT (Advanced Package Tool). From the Knoppix menu, choose Utilities
    -> Manage Software in Knoppix to start KPackage. When KPackage opens, select the
    All tab, as shown in Figure 1-1.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_29_0.png)


    Then follow these steps:


    +   1. In KPackage, select Special -> APT:Debian -> Update. APT downloads a list
    of the software available in the APT repositories Knoppix knows about. This can
    take a few minutes, so just relax.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'Don’t know what APT is or how to use it? The author of this chapter has prepared
    “Updating Your Computer with Debian’s APT,” a presentation for Linux students
    that covers the basics, which you can download from www.granneman.com/presentations.
    (It’s available under a Creative Commons license). Alternatively, read the official
    Debian documentation, APT HOWTO, at www.debian.org/doc/manuals/apt-howto/index.html.


    +   2. When the APT update completes, go to the Alt tab and select File -> Find
    Package.

    Enter the package name, mstccorefonts, as the search term, and click Find.

    3. After KPackage finds it, close the Find Package window and click the Install
    button at the bottom of the right page.

    4. An Install window opens. Click the Install button at the bottom. (Yes, this
    is kind of silly, which is why I prefer to use the command instead of KPackage
    for installing software. Using the command line is discussed in this chapter.)
    Finally, KPackage begins to actually download and install the software onto your
    system.

    5. When it’s finished, close KPackage.


    If you’re curious, the Microsoft fonts have been placed into /usr/share/fonts/truetype/mstccorefonts.


    However, you can’t start using your newly installed fonts just yet. You need to
    restart X, and unfortunately that’s pretty straightforward (unlike using KPackage).
    From the Knoppix menu, select Logout -> End Current Session. After X restarts,
    you will need to log back in, and now you can finally start making intelligent
    font choices!


    Remember if you’re not using the persistent Knoppix disk image, when you reboot,
    you are going to have to repeat this process again, and again in a Sisyhean task
    that will never end. Set up and use the persistent Knoppix disk image!


    Now assign some new fonts in appropriate places on your system. Keep in mind that
    this chapter walks through only the major apps on Knoppix, so you’re on your own
    to change fonts on any other apps you happen to use that aren’t covered here.


    First, fix KDE itself. From the Knoppix menu, select Control Center, expand Appearance
    & Themes, and select Fonts. The Fonts Control Center displays, as shown in Figure
    1-2.'
