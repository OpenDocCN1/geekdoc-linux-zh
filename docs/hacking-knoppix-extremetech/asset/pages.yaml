  md: '# 178 Part III — Knoppix Variants


    # Author''s Experience


    I used a Lec Orinoco Gold, I know it''s ancient, but it''s my Old Faithful because
    it works with virtually any Linux distro), Auditor saw the card, I didn''t get
    an IP address automatically. I first ran ifconfig to find out which device Auditor
    thought my Orin was. Once I saw it was eth0, I ran pump -eth0 to ask my router
    to assign an IP address using DHCP. After another ifconfig to ensure that, yes,
    I was now 192.168.0.102, I was ready to go. If you can''t get online with your
    wireless card, and you know Auditor supports it, but that sequence of commands
    will see that fixes your problem.


    Be as patient as Nikto does to work. It''ll take some time, but you eventually
    get some results. For instance, here''s what came back from scanned Web:


    +   - Nikto 1.32/1.23 www.cirt.net

    + Target IP: [IP address redacted]

    + Target Hostname: [Domain name redacted]

    + Target Port: 80

    + Start Time: Apr 28 04:52:05 2005

    - Scan is dependent on "Server" string which can be faked, -g to override

    + Server: Apache/1.3.3 (Darwin) PHP/5.0.1 mod_sl/2.8.22 OpenSSL/0.9.7b

    + /robots.txt contains 7 ''allow'' entries which should be manually viewed (added
    to mutation files) (GET).

    + Allowed HTTP Methods: GET, HEAD, POST, PUT, DELETE, CONNECT, OPTIONS, PATCH,

    PROPFIND, POPPATCH, MK, COPY, MOVE, LOCK, UNLOCK, TRACE

    + HTTP method ''PUT'' may allow clients to save files on the web server.

    + HTTP method ''CONNECT'' may allow server to proxy client requests.

    + HTTP method ''DELETE'' may allow client to remove files on the web server.

    + HTTP method ''PROPFIND'' may indicate that WebDAV is installed. This may be
    used to get directory listings if indexing is allowed but a default page exists.

    + HTTP method ''PROPPATCH'' may indicate DAV/WebDAV is installed. It should be.

    + HTTP method ''TRACE'' is typically only used for debugging. It should be.

    + Apache/1.3.3 appears to be outdated (current is at least Apache/2.0.47).

    + Apache 1.3.28 is still maintained and secure.

    + OpenSSL/0.9.7b appears to be outdated (current is at least 0.9.7c) (may depend
    on server version)

    + 2.8.22 OpenSSL/0.9.7b - Telcoder Simplexerver 2.1.31207 Build 3289 and allow
    directory traversal with ''../''.

    + mod_sl2.8.2 - mod_sl 2.8.7 and lower are vulnerable to a buffer overflow which
    may allow a remote shell (difficult to exploit). CAN-2002-0082.

    + /-root Enumeration of users is possible by requesting -username (responds with
    Forbidden for realusers, not found for existing users) (GET).


    There''s lot more than this. Consider it just taste of all the great info you
    can get with Nikto. be sure to read man nikto and visit the project''s home page
    at http://cirt.net/nikto.shtml.'
