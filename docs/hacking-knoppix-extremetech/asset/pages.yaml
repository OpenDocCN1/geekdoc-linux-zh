  md: '# Preparing Knoppix


    Before you can change Knoppix, you must get all the files on your Linux computer.
    Insert the Knoppix CD and mount it at /cdrom. Then run a command to create a subdirectory
    in your home directory that you''ll use to store the CD''s files:


    ```

    $ mkdir /home/scott/knoppixiso

    Now copy all the files from the Knoppix CD except for KNOPPIX/KNOPPIX:

    $ cp -r /cdrom/[a-z]* /home/scott/knoppixiso

    $ mkdir /home/scott/knoppixiso/KNOPPIX

    $ cp -r /cdrom/KNOPPIX/* /cdrom/KNOPPIX/images /home/scott/knoppixiso/KNOPPIX/

    ```


    The author''s directories are used in this project; you should substitute your
    own.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_253_0.png)


    For the big boy: the compressed KNOPPIX/KNOPPIX file. As discussed in the preceding
    chapter, you can use the cloop kernel module if you''ve installed it. If Libranet,
    a Debian-based distro, did not come with that particular module, you can use the
    second method: the cloop command-line utilities. Are they on your machine?


    ```

    # whereis extract_compressed_fs

    ```


    Nope. If the command can''t find them, you need to install them. If you''re using
    a Debian-based system, you can use APT, which makes it easy:


    ```

    # apt-get install cloop-utils

    ```


    After a minute or so, they''re installed and ready to use. Then run the following
    command to extract the KNOPPIX/KNOPPIX file and get it on your hard drive:


    ```

    # extract_compressed_fs /cdrom/KNOPPIX > /tmp/knoppix.iso

    ```


    As cloop does your job, you''ll see a lot of feedback on your screen, showing
    each block as it''s extracted. On a Pentium III 1GHz machine, it takes about five
    minutes to extract 30,728 blocks, which isn''t too bad, except that the CPU has
    to run at nearly 100 percent the whole time, so you couldn''t do a whole lot of
    other intensive work, other than read email. This might be a good time to get
    up and take a break.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_253_1.png)


    When the extraction is complete, mount the KNOPPIX/KNOPPIX file as if it were
    a CD:


    ```

    # mkdir /tmp/mountdir

    # mount -t iso9660 /tmp/knoppix.iso /tmp/mountdir -o loop

    ```


    The files are available at /tmp/mountdir, so now you can copy them to another
    subdirectory in your home directory.'
