  md: '# Testing Archix


    To test your ISO, you can use QEMU, an emulator that enables you to test the distro
    without burning it. To be honest, QEMU is sloooooooo. It would probably be quicker
    to burn the ISO file to a CD and test by booting with it, but it doesn''t hurt
    to know how to use QEMU, and it is pretty cool.


    If QEMU isn''t already on your Debian-based system, you need to install it:


    ```

    # apt-get install qemu

    ```


    Once program is on your system, you can test your distro with a simple command:


    ```

    $ qemu -cdrom archix.iso

    ```


    Booting Archix with QEMU took about 20 minutes from start to KDE (as they say
    in Missouri, slower than molasses running uphill in January). However, you will
    know for sure that your .iso is good and that your distro will boot. Time to burn
    that ISO to CDs and start handing them out to kids you know. It''s going to be
    fun!


    # Summary


    From preparing Knoppix to actually creating the new distro by removing and installing
    software, to customizing the look of your new distro and naming it, to mastering
    the CD image and testing it, remastering is a long process. Still, it''s completely
    fascinating and you''ll learn a lot about Knoppix, Linux, and all sorts of other
    items. Best of all, you''ll have the satisfaction of knowing that you made something
    cool: a Linux Live CD distro that meets your needs and fulfills your creativity.
    Now how many people can say that? Not many. So why not get busy and join them?'
  merge: -1
