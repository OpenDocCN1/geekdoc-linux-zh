- img_proc: true
  md: '# Changing the Boot Screen


    The Knoppix boot screen is set up in the /home/knoppix/knoppixiso/boot/isolux
    directory. Three files are of interest:


    +   - isolinux.cfg: The configuration of the isolinux bootloader. Insolux provides
    the ini-boot screen and starts the Knoppix boot process. This file can be edited
    directly using any editor.


    +   - boot.msg: The text of the boot screen. You can use any editor to modify
    this file, too.


    +   - logo.16: The image shown at boot time. It is more difficult to modify. logo.16
    in the LSS16 image format, which is designed specially for isolinux and its counterpart,
    sys-linux. To convert an image to this format, you must first save the image in
    the Gimp as a .ppm file. Then:


    ```

    # ppmtomls16 < myimage.ppm > /home/knoppix/knoppixiso/boot/isolinux/logo.16

    ```


    myimage.ppm must be a 640 x 480 16-color image. Any other image, and isolinux
    refuses to show an image, getting this right will take some practice.


    # Setting Languages


    In the isolinux.cfg file, introduced in the preceding section, you can define
    the default cheatcodes for booting Knoppix. These cheatcodes are the ones that
    can normally be entered on the command line right before Knoppix boots from the
    CD and displays the boot screen.


    Open the isolinux.cfg file with your favorite text editor and locate the lines
    that start with APPEND. On these lines you will see a cheatcode in the form lang=us
    or lang=de. Changing this to another language''s two-letter abbreviation changes
    the default language used on the Live CD.


    Note that setting the cheatcode does not always work. Certain programs, such as
    KDE, OpenOffice, Mozilla, and Mozilla Firefox, don''t have all language packs
    by default. If you want to have a completely translated Live CD, you will have
    to install these, similar to installing new software as described in the section
    "Installing and Removing Software" earlier in the chapter. For example, if you
    want to install the Dutch language package for KDE, you''d execute the following
    in the root:


    ```

    # apt-get install kde-i18n-nl

    ```


    Similarly for Mozilla Firefox:


    ```

    # apt-get install mozilla-firefox-locale-nl-nl

    ```


    Creating Knoppix Live CDs is not very complicated after you''ve mastered the installing
    of software in Knoppix; however, language package names differ per software-age.
    If you''re not sure, start syntactic to search for package names and their language
    package counterparts. Not every language will be available.'
  merge: -1
