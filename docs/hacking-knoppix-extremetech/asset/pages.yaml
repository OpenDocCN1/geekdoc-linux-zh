- img_proc: true
  md: '# 70 Part I — Navigating the Amazing Knoppix Toolkit


    Note

    For more information about NoMachine and its NX software, head over to http://nomachine.com.


    From a security perspective, NX has much to recommend it. It uses SSH (and the
    SSH daemon) to ensure that usernames and passwords are encrypted when connecting
    for the ini-cial authentication. After you''ve passed that gauntlet and logged
    in, you can continue to use SSH so that all further traffic is also encrypted.
    If you''re on your LAN and behind a firewall, you can disable session encryption
    for improved speed, especially with older hardware (we re-commending to use SSH
    unless you''re using old machines with slow CPUs, to be as secure as possible).


    NoMachine made its core technologies available under the GPL, and the result is
    FreeNX, a completely free implementation of the NX server and client. NoMachine
    completely supports the efforts of the FreeNX team by helping to ensure that both
    the free and commercial soft-ware remain in sync, which is to be commended.


    Note

    An interview with the KDE developers who brought FreeNX to KDE can be found at
    www.osnews.com/printer?news_id=8139. Incredibly, FreeNX is actually just a BASH
    shell script—several hundred lines of a BASH script, but a BASH script nonetheless!


    What kinds of machines can support the FreeNX server? For each KDE user session,
    you''re looking at 40MB of RAM and around 100MHz of your CPU, which ain''t bad.
    With a good, fast machine, say around 3GHz with 1GB of RAM, which could support
    25 parallel sess-ions or so. That''s not bad!


    The result of FreeNX: very fast, secure connections to other machines — and free
    to boot!


    # Setting Up FreeNX


    To start the NX server, select Knoppix → Services → Start NX Server. A dialog
    box opens, warning you that a new user nxuser will be created who can access the
    FreeNX server. Go ahead and click OK. Another dialog box opens, prompting you
    to create a password for the new nxuser. To keep things simple for now, use nxuser
    as the password as well, and then click OK.


    Caution

    Do not use nxuser as the password on your machine! Create a good password that
    will protect your machine and data. For help in creating a good password, read
    the Security Focus titled "The Chocolate," available at www.securityfocus.com/columnists/245.


    FreeNX generates encryption keys so that all communications sent using its protocols
    are safe from packet sniffers; it spawns a shell window in which you can watch
    the process.


    Meanwhile, another dialog box opens, informing you that it''s now possible to
    log in using the newly created nxuser account. Note that you can log in using
    any user already on the system, so the knoppix—who has no password set by default—can
    also log in. When you click OK to close the dialog box, the shell window spawned
    by FreeNX disappears, and FreeNX is running and up.'
