  md: '# Assessing Security with Knoppix


    # chapter 6


    Security is vitally important to everything we do. We drive well-built cars and
    wear seat belts, avoid unsafe areas of town, and safeguard our computer systems
    and networks as best as we can against criminals, spammers, and miscreants. You
    can use Knoppix to protect your computers, but you can also use it to learn more
    about security. You may even find that it''s fun along the way.


    # Encrypting Data with GnuPG


    Encryption is one of things that can really raise the hackles of some folks, primarily
    in government who want to limit the use of it by ordinary Jones like you and me.
    However, there is no good reason not to use encryption. We have all information
    that we''d like to keep secret, whether it''s related to business or our personal
    lives, and encryption is the way to do it.


    One of the best tools for encryption is GnuPG, the Gnu Privacy Guard. GnuPG uses
    public key cryptography, which means that you possess two keys: a private key
    you to decrypt messages sent to you, and a public key that others use to encrypt
    messages for you. This setup public keys being exchanged between people who want
    to send encrypted files, as you''ll see.


    # in this chapter


    +   - Encrypting data with GnuPG

    - Testing for vulnerabilities

    - Sniffing packets on a Network

    - Performing forensics after a crack

    - Wiping a hard drive


    > Note Don''t know what encryption is? Read http://en.wikipedia.org/wiki/Encryption,
    or, if you''re feeling more hardcore, check out Neils Ferguson and Bruce Schneier''s
    Practical Cryptography. Want to learn more about public key cryptography? Head
    over to http://en.wikipedia.org/wiki/symmetric_key_algorithm.


    You can actually use GnuPG for a variety of tasks:


    +   - Encrypting and decrypting email

    - Encrypting and decrypting files on your computer

    - Signing a file with an electronic signature, or verifying the authenticity of
    a file by checking its digital signature

    - Verifying, or signing, other folks'' public keys


