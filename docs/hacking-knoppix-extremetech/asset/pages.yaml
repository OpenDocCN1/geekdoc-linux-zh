    6. **Driver Selection:** Select HP LaserJet 6L (foomatic + hpijs) [recommended]
    as the best driver among six options. Click Next.

    7. **Printer Test:** Skip until the process has completed because it rarely works
    for some reason. Click Next.

    8. **Banner Selection:** Leave No Banner selected. Click Next.'
