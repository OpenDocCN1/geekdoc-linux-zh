    Things get really interesting when you start filtering the mass of data that Ethereal
    captures. For instance, suppose you want to determine whether anyone on your network
    is trying to log in to his email using a username and password sent in the clear
    (Bad user!). To find out, you want to create a display filter that limits in some
    packets that Ethereal shows you (these are not the same as capture filters, which
    control the packets that Ethereal gathers in the first place). Click the Filter
    Expression button in the filter toolbar near the top of the window; Ethereal''s
    Filter Expression opens (see Figure 6-10).


