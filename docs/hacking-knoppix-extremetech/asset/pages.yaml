    \ quality, except for the thumbnails, don't need to look like.\n\nManually changing\
    \ multiple photosize is boring and tedious, so use the following script, which\
    \ you can create in a file named the ~/bin directory:\n\n```\nfor i in *.jpg;\
    \ do\nwidth=\\$(identify \"$i\" | sed -re 's/\\. ([0-9]+)x[0-9]+).*/\\1//')\n\
    height=\\$(identify \"$i\")\nif test width -ge 1600; then\nfor size in 1600x1200\
    \ 1024x768 800x600 640x480; do\nconvert \"$i.jpg\" -resize \"$size\" -compress\
    \ -quality \n100 \"${i}_$(size).jpg\"\ndone\nfi\nsize=200x150\nconvert \"$i.jpg\"\
    \ -resize \"$size\" -compress JPEG -quality \n75 \"${i}_$(size).jpg\"\n\ndone\n\
    ```\n\nAfter making it executable with chmod 744 photosize, the script ran perfectly.\
    \ Most of our images were 1600x1200, but not all. We needed some to work with\
    \ the largest images, and the identify command would Running identify sample.jpg\
    \ gives you information about the image that looks like this:sample.jpg JPEG 1600x1200\
    \ DirectClassClass 8-bit 641kb 0:00:01. Now you know the dimensions, but if you\
