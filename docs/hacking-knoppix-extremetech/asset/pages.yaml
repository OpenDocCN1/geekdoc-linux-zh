  md: '# # Installing Knoppix to Your Hard Drive


    Knoppix is a great way to try out Linux with no commitment and without modifying
    your hard drive. After using it a while, you may decide you want to install it
    to your computer so it is always readily available without having to use the CD.
    This appendix explains how to prepare and install Knoppix to your hard drive.


    # ## The Good, the Bad, and the Ugly of Knoppix Hard Drive Installation


    Knoppix is primarily geared for use from the CD-ROM, but there are some valid
    reasons to run Knoppix from your hard drive, including the:


    +   - Faster boot

    - Freeing up your CD drive for other uses

    - Having a consistent, easily configurable Linux distribution without going through
    any extra steps required from the Live CD version

    - Dual booting, so that you have a choice when you start your computer between
    Knoppix and another operating system on your PC, such as Windows 98, 2000, or
    XP


    Be forearmed! You need to consider a few of the negative aspects of installing
    Knoppix to your hard drive instead of using one of the hard-drive-focused versions
    of Linux (such as Kanotix, Ubuntu/Kuntu, and MEPIS) that also provide Live CDs
    to test:


    +   - You are not provided with the same level of granularity to choose what is
    going to be installed.

    - If you install with some of the system types, you aren''t afforded the standard
    security protections that come with some Linux distributions (security for the
    root account is open to any user on the live system, for example).


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_294_0.png)'
  merge: -1
  pgno: 294
- img_proc: true
  md: "The Knoppix system is designed to run on any system, and some of the specialized\
    \ hardware installed on most systems is treated generically, not taking full advantage\
    \ of the hardware. In other words, your super-expensive video card may become,\
    \ in the hands of Knoppix, the equivalent of an 8-year-old basic video card that\
    \ outputs VGA and not much else.\n\nUsers have reported various levels of success\
    \ upgrading their systems once Knoppix is installed. You may go through an install\
    \ only to find that upgrading your system breaks things.\n\nThe reasons to not\
    \ install Knoppix to your hard drive are significant and should be carefully considered\
    \ prior to going through the process.\n\nFind out more about the other distros\
    \ mentioned earlier in this section by pointing your Web browser at their home\
    \ pages. You'll find Kanotix at www.kanotix.com, Ubuntu (a GNOME-based distro)\
    \ at www.ubuntu.com, Kubuntu (the KDE-based brother of Ubuntu) at www.kubuntu.org,\
    \ and MEPIS at www.mepis.org.\n\n# Preparing to Install\n\nIn addition to all\
    \ the requirements for running Knoppix from the CD, you need the following to\
    \ install it onto your hard drive (these are bare minimum requirements; as with\
    \ most things involving computers, more is always better):\n\n+   - 2GB or more\
    \ of hard drive space to install the primary operating system\n- 128MB of swap\
    \ space (if you have less than 512MB of physical RAM).\n\nYou can set up partitions\
    \ for these prior to starting the installation routine or you can wait until the\
    \ install process and use QPParted.\n\n# Installing Knoppix\n\nOpen a console\
    \ window by selecting Knoppix $\rightarrow$ System $\rightarrow$ Konsole. Enter\
    \ su to switch to root, and then enter knnoppix-installer at the # prompt, as\
    \ shown in Figure B-1."
