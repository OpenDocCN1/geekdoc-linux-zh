    # Getting Data into a ParallelKnoppix Cluster


    You have source code and real datasets to move in and crunch, which is why you''re
    interested in clustering, right? With the master node booted off a CD, and without
    a network, you face a problem: getting your data into the cluster. There are three
    basic methods, each with its own benefits and drawbacks.


    First, Knoppix has excellent removable storage support: You can justple your material
    in a USB or IEEE1394. Drive the drive in, it is detected and mounted, and you
    just need to manually move things off the disk before you start (don''t forget
    to move your results back onto the disk!). The removable storage method is a very
    simple, low-overhead way to get things into and out of your cluster. If your data
    is large, or you''re stuck with USB 1.x devices, however, it might be too slow.


    The second technique is the most obvious: Slap the data on a drive in the master
    node before you get going. This also allows fast access and makes it less likely
    that you''ll forget to save your results after you finish. Unfortunately, it also
    requires opening the master node, or at least a lot of planning work with the
    master node. If you are using a computer lab in the middle of'
