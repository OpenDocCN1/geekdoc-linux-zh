  md: '# Chapter 4 — Fixing Linux with Knoppix 97


    The -C option displays a useful progress bar, which is always handy. If you want
    to see additional output, including the actual commands that fsck is using, add
    the -V option to the command.


    If you want fsck to look for bad blocks on your hard drive, the -c (lowercase)
    option (this is a different option than the uppercase -c), runs the badblocks
    program. badblocks finds that any areas on your hard drive are damaged, it adds
    them to a list that the system keeps, so that they are not used in the future.


    When you run fsck, you may be asked a lot of questions—hundreds if your hard drive
    has a lot of problems. If you just want fsck to fix your drive automatically,
    add the -p and -y options. Most of the time, this isnt a big deal, but it sometimes
    does things you weren''t expecting (to be honest, though, we usually use these
    options because we''re lazy and don''t feel like typing the same letter over and
    again).


    # Examining and Repairing ReiserFS Filesystems


    Ext3 is a good journaled filesystem, but in recent ReiserFS has been gaining a
    lot of converts. To check and repair a ReiserFS-formatted filesystem, use the
    following:


    ```

    $ sudo reiserfs --fixable /dev/hda1

    ```


    The --fixable option does just that: It tells reiserfs to fix the easy problems.
    If reiserfs finds additional problems, it lets you know and suggests additional
    options to use, some of the following:


    +   -rebuild-sb: If reiserfs complains that "read_super_block: can''t find a reiserfs
    filesystem," and you know for fact that the filesystem uses ReiserFS, you need
    to use this option.


    +   -rebuild-tree: reiserfs tells you to run this command when it needs to rebuild
    the entire filesystem tree, and no, this is not a good sign. Be sure to back up
    the partition using dd or


    +   -yes: This tells reiserfs to assume "yes" as the answer to all questions,
    so that it runs without asking you a million things. Be cautious about using this
    option.


    # Examining and Repairing FAT32 (VFAT) Filesystems


    Yes32, known as VFAT to Linux users, is a Windows filesystem, but it is widely
    used in the Linux world as well, especially on partitions shared between Linux
    and Windows installs, and on USB drives, digital camera storage cards, and portable
    mobile devices. It''s therefore a good idea to know how to check and repair partitions
    formatted with VFAT using the command:


    ```

    $ fsck.vfat -a /dev/hda1

    ```


    The -a option automates the process, taking the least dangerous method each there''s
    a problem. If you want to be asked every time there''s an issue, use the -r option
    instead. If you don''t use -a or -r, the filesystem is examined, but not repaired.'
  merge: -1
