  md: '# About the Author


    Scott Granneman is an author, educator, and consultant. Scott''s book on the Firefox
    web browser, Don''t Click on the Blue El: Switching to Firefox, has garnered wide
    praise. In addition, he is a monthly columnist for SecurityFocus and for Linux
    Magazine, and he blogs professionally on the Open Source Weblog. He is currently
    an adjunct professor at Washington University in St. Louis, where he teaches a
    variety of courses about technology, social software, and the Internet. Finally,
    as a co-owner of WebSanity, Scott helps nonprofits and businesses use the company''s
    Content Management System to take full advantage of the Web''s communication,
    sales, and service opportunities. He''s been using Linux for a decade, and swears
    by it.'
