    The following, from a Windows XP Home Edition, is a typical generic boot .ini
    file:


    ```

    [boot loader]

    timeout=30

    default=multi(0)disk(0)disk(0)partition(1)\WINDOWS

    [operating systems]

    multi(0)disk(0)disk(0)partition(1)\WINDOWS="Microsoft Windows XP Home Edition"
    /fastdetect

    ```


    timeout specifies how long the system should wait for user input while the boot
    menu is being displayed.


    default identifies which selection from the Windows recognizable operating systems
    (identified in the [operating systems] section) will be booted if the user makes
    no selection in the boot menu. The [operating systems] section identifies all
    Windows recognizable operating systems that can be booted by the boot menu.


    multi denotes whether this system has an IDE or SCSI drive, and is almost always
    0. If you are using a SCSI drive with no BIOS support, this is scsi(0) instead
    of multi(0). (Note that Windows NT systems using SCSI drives have multi.) The
    disk designator 0 if multi is listed as the adapter. If scsi is the adapter in
    use, you would indicate the scsi bus number. rdisk identifies which controller
    the disk is, such as rdisk(1) for the secondary disk, rdisk(0) for the primary.
    If you are using scsi, this option is always 0.'
