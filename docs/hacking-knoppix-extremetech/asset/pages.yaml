    # Creating a New Distro


    It''s almost time to craft a new distro based on Knoppix. There are a few things
    to do to get your environment ready for the big changes in store, and then you
    need to get rid of as much unnecessary software as possible. Only then will you
    install new software for the kids, and wrap up by making some other changes designed
    to make your new distro friendly.


    # Preparing Your Environment


    Tell your terminal /home/scott/knoppixuncompressed (or whatever your directory
    is) is the root directory; otherwise, you won''t be able to install and remove
    software correctly. To perform this magic, use the chroot command:


    ```

    # chroot /home/scott/knoppixuncompressed

    ```


    Your shell will change and now think that /home/scott/knoppixuncompressed is actually
    /. In essence, the rest of your filesystem is hidden from this shell as long as
    you are inside it (if you type exit, you''re back in a normal shell). Keep in
    mind that you''re automatically running as root inside this chroot environment.


    You also need to mount the proc filesystem inside your chroot jail, or things
    really won''t work:


    ```

    # mount -t proc /proc proc

    ```


    Ignore the error message warning that you the system can''t open the /etc/fstab
    file. No biggie.


    Before you can install software, make sure that your Net connection is working
    by pinging a Website. For example:


    ```

    # ping www.granneman.com

    ```'
