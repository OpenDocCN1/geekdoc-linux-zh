    It says that out of the box, Knoppix is 2.8GB of space. If you need jettison as
    make room for the packages you want to make available to the kids who use your
    distro. Logically, it''s a good idea to start with the stuff that''s taking up
    the most space. To find out what packages are on Knoppix, sorted by size, with
    the largest at the end, run this:


    ```

    # dpkg-query -W --format=''${Installed-Size} ${Package}\n'' | sort -n

    ```


