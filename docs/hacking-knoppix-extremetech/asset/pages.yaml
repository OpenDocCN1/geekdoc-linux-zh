  md: '# Clustering with Knoppix


    Knoppix and Knoppix-derived distributions can be used for large computational
    problems that would benefit from the use of multiple computers. This chapter introduces
    the concept of a cluster, which, for the sake of this discussion, is a group of
    systems networked together to run a single computational task.


    A cluster is the opposite of a shared system whereby users might run current tasks.
    Clusters are used to run tasks, frequently called jobs, that are computationally
    intensive (often called expensive), such as the ones that scientists and mathematicians
    often need. This chapter focuses primarily on ParallelKnoppix, which is by far
    the easiest of the clustering setups, but it shows most of the problems you might
    run into with a Knoppix-based ad hoc cluster. ParallelCluster is perfect for the
    basement supercomputer. If your problem can be solved using MPI (Message Passing
    Interface, an industry standard for parallel computing), ParallelKnoppix is for
    you. If you can''t, ParallelKnoppix is a good learning experience. It presents
    a very gentle curve for handling all the basic components of clustering.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_184_0.png)


    # in this chapter


    +   - Exploring cluster concepts

    - Using ParallelKnoppix

    - Understanding ClusterKnoppix

    - Surveying other science-oriented Knoppix distros


    > Another type of cluster—the high-availability or fail-over cluster— involves
    pooling multiple computers, each of which is a candidate server for their filesystems,
    databases, or applications. In the event of failure in one of the cluster members,
    the others take over its services, usually in a way that makes it transparent
    to client systems accessing the data. That''s a subject for another book. This
    chapter covers only clusters.


    Clustering is of special interest to system administrators, whose job is to configure
    the cluster with the libraries and services needed and then to maintain the system.
    Parallel programming would be another book entirely. The administrator''s task
    in and of itself can be complex, and this chapter can only begin to cover.


    This chapter assumes that you''re using Knoppix and its derived distros as a development
    platform, so, for example, $PATH values will be the default on Knoppix. Code will
    be written, whenever possible, as bash (Bourne Again Shell) scripts. The chapter
    also assumes that the purpose of your cluster is to do real work in an environment
    similar to a research group, which the task of'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# 160 Part III — Knoppix Variants


    maintaining the cluster is not the job of just one administrator but several.
    The intent is to ensure that you have a maintainable system that doesn''t depend
    on just one knowledgeable person. (It almost goes without saying that your system
    should be behind a firewall and generally secure.)


    After examining the basic concepts of clustering, you''ll explore ParallelKnoppix
    and ClusterKnoppix distros then take a look at some other science-related Knoppix
    derivations.


    # Understanding Basic Clustering Concepts


    Clusters are meant to run "jobs" exclusively for a single user and often without
    interaction. A job scheduler manages the tasks, and libraries and programs manage
    the behavior of the task. It''s basically that simple.


    Why clusters? Some tasks are just too large not to have multiple systems calculate
    some aspect of a sizeable project or problem. Here is a simple example: I built
    a six-system (12-processor) cluster. The systems have Intel Pentium III 866MHz
    processors and 512MB of RAM processor (not a fast system by today''s standards).
    Knoppix was configured the first time on the entire cluster in about 15 minutes.
    As a test, a graphic rendering package POV-Ray was used to render a benchmark
    file called skyvase.pov (POV-Ray rendering is often referred to as an embarrassing
    parallel application; it easily runs on a cluster because there aren''t any cross-communication
    and other complexities associated with the process.) Running the benchmark on
    a single system took 1 minute, 24.5 seconds. Running the same benchmark across
    all 12 processors took 34 seconds. The point is pretty obvious: If the problem
    you''re trying to solve fits into the parallel computer model, you''ll see a dramatic
    increase in computational speed and power.


    A Linux cluster is a bunch of systems that share nothing; you can''t read the
    memory of processor 0 on machine from processor 0 on machine bar. You could equivocate
    and say, "No, but there is fancy hardware MemFooBar that does shared memory (often
    called abmem), or "But I have a 64-way SMP system running Knoppix and I can see
    all the memory from any processor ... some expert you are, Mr. Numbskill." That''s
    not the kind of cluster that''s being discussed here. This chapter is tackling
    cheap, ubiquitous PC-quality systems networked together with Ethernet. The most
    you''re going to share is an NFS filesystem.


    This sort of cluster, one made up of independent machines, was once complicated
    to set up and maintain. Now, thanks to Knoppix-derived distributions, you can
    set up one in a matter of minutes. In this chapter, you set up clusters using
    ParallelKnoppix and ClusterKnoppix, and run various applications on them.'
