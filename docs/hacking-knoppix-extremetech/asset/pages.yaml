  md: '# # Creating Archix,

    Knoppix for Kids


    In this chapter, you actually make your own Knoppix-based distro. The distro is
    targeted at kids between the ages of 6 and 13, for several reasons.


    First, more kids should be using Linux and open source. Make it fun and easy to
    use and kids will start asking for Linux into the workplace, when they grow up,
    and Archix can achieve total world domination (cue maniacal laughter)!


    Second, the distro can help worried parents. If your brother''s kids are visiting,
    for example, and you don''t want them messing around your Windows machine because
    you don''t want to clean spyware and other garbage (off the umpteenth time), boot
    with your customized Knoppix for kids and your worries are gone. They can have
    fun and maybe learn something, and you don''t have to spend hours after they leave
    cleaning off malware.


    Third, the cool new distro could be a boon for schools. Microsoft and the Business
    Software Alliance have been making life miserable for several cash-strapped school
    districts in recent years. Now would be much nicer than a switch to more open-source
    software that those schools wouldn''t have to spend what little money they have
    on software licenses.


    Finally, making a version of Knoppix for kids is fun, and once you get the basics
    down, you can customize it to meet the needs of the kids you know. Follow along
    with the instructions in this chapter, but then try your own thing. Change the
    source packages, use different images, and change the name. Make this version
    of Knoppix that your kids (or the kids you know) will enjoy!


    > For information about Microsoft''s and the BSA''s actions against schools, see://dir.salon.com/tech/feature/2001/07/10/microsoft_school/index.html?id=1039938.


    > Many of the commands in this chapter must be run as root, but could be run as
