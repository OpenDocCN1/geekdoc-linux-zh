  md: '# Chapter 4 -- Fixing Linux with Knoppix 93


    ```

    $ sudo dd if=/dev/hda of=/mnt/uba1/mbr_homer_backup bs=512

    count=1

    ```


    The dd command creates images of drives, but this command uses the bs (block size)
    option to tell dd to output only 512 bytes at a time, while the count option means
    that dd should only do once. Because the MBR is contained in the first 512 bytes
    of the hard drive, this command copies it. (For more information on the dd command,
    see the section “Backing Up Partitions” later in this chapter.) Now reboot the
    system and the partition table backed up on your USB flash drive, which should
    make you feel safer.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_118_0.png)


    Yes, you can use Knoppix, but really, you should back up the MBR no matter what
    OS''re using. Don''t wait until you''re using Knoppix to perform the backup!


    With your MBR backed up, you can restore it if it ever gets nuked. To do so, simply
    reverse the directories in the following command:


    ```

    $ sudo dd if=/mnt/uba1/mbr_homer_backup of=/dev/hda bs=512 count=1

    ```


    Keep in mind that this will restore your boot code and your partition table. Every
    time you change your partition scheme, you must back up your MBR again (fortunately,
    most people rarely ever alter their partitions, so one backup should do the trick).
    If you have not changed your partitions, this command should be fine. However,
    if you have altered your partition table since the original backup of your MBR
    (Bad computer!), then you will want to run the following command:


    ```

    $ sudo dd if=/mnt/uba1/mbr_homer_backup of=/dev/hda bs=446 count=1

    ```


    The MBR''s boot code is located in the first 446 bytes of 512-byte area; the last
    66 bytes contain the partition table. Restore the first 446 bytes and you have
    your boot code back; restore the full 512 bytes and you have your boot code and
    partition table back. Now that is good to know!


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_118_1.png)


    Be careful typing those numbers in the dd command! Fat-fingering and typing 521
    instead of 512 can lead to disaster.


