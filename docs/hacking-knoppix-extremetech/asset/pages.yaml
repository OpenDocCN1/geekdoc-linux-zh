  md: '# 182 Part III — Knoppix Variants


    Continued


    Driftnet''s display window doesn''t include a scrollbar, if a picture zooms past,
    you can''t scroll up to see it. Fortunately, Driftnet wants to save the pictures
    that it captures, in addition to playing them you, but there''s a problem: The
    default directory you''re in the Driftnet Konsole window is /root/, which is actually
    in your RAM and will fill up quickly. If you really want to save the images Driftnet
    sees, tell the program to use another directory (on your hard drive or a USB flash
    drive) by using the following command:


    ```

    # driftnet -i eth0 -d /mnt/hda2/driftnet_pix

    ```


    I quietly left Ben and Tracy at the computer, happily planning their wedding.
    (Congratulations, you two!)


    Remember, Ben and Tracy know that I was watching them the whole time, while this
    little story isn''t as crazy as it might seem. They actually found it of funny
    yet worrisome that their wireless internet access was so wide open. Your average
    wireless coffeehouse is just as open, virtually none of the parton realizes it.


    To learn more about Mailsnarf, try man mailsnarf; for URLsnap, try—you guessed
    it!—man urlsnap. Both tools are part of the dsniff suite, and a visit to the dsniff
    home page provides a bit more info, but not much: http://monkey.com/~dugsong/dsniff.
    A longer look at dsniff can be found at http://uah.org/dsniffr.htm. Definitely
    look into dsniff—I only covered a fraction of what it can do.


    For more on Driftnet, a separate tool from dsniff, man driftnet or driftnet -h,
    and be sure to visit the home page, at http://ex-parrot.com/~chris/driftnet/


    # Detecting and Sniffing Wireless Networks with Kismet


    Ever how could you discover a wireless network? Enter Kismet.


    To start Kismet, open the K menu and select Auditor -> Wireless -> Scanner/Analyzer
    -> Kismet tools -> GKismet (gkismet is a GTK GUI for Kismet). Choose a data directory,
    in which Kismet will store the packet database it''s going to create. Select a
    folder on your hard drive if you (make sure you can write to it), or point at
    a mounted USB flash drive. When you''re asked about a file, leave the default
    and click OK.


    GKismet opens, and it immediately detects any wireless networks in the area. Figure
    8-2 shows quite a few—the gkismet user is probably near an apartment building.'
