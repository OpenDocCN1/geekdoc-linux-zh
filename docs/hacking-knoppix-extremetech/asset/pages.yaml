- img_proc: true
  md: '# Installing and Removing Software


    You can use the extracted files to install and remove software from Knoppix. All
    files from the Knoppix ISO are now available via /home/knoppix/knoppixiso, and
    the files that were in the KNOPPIX/KNOOPPIX file are available in /home/knoppix/knoppixuncompressed


    To begin, chroot (change the root directory) into the extracted filesystem:


    ```

    # chroot /home/knoppix/knoppixuncompressed

    ```


    This means that you will see the /home/knoppix/knoppixuncompressed directory as
    your root filesystem. You now have a shell that has access only to the files in
    /home/knoppix/knoppixuncompressed.


    To install certain packages, you need to mount the proc filesystem inside the
    chroot:


    ```

    # mount -t proc /proc proc

    ```


    You will get a warning (can''t open /etc/fstab: No such file or directory), which
    you can safely ignore.


    Test whether your Internet connection works by pinging a server:


    ```

    # ping slashdot.org

    ```


    If you receive replies, congratulations! You have a connection with the Internet
    from within the chroot and can start using apt-get to install new software.


    If you didn''t get a reply, you''ll have to add your DNS nameserver to /etc/resolv.conf.
    Open the file using vim or a different text editor:


    ```

    # vim /etc/resolv.conf

    ```


    For each nameserver, add an entry:


    ```

    # nameserver 0.0.0.0

    ```


    where 0.0.0.0 is your nameserver. Save the file and try pinging again to make
    sure your connection works. You need it if you want to install new software from
    the Internet using apt-get.


    # Using apt-get


    First, update apt-get''s package lists so it will know which new packages are
    available:


    ```

    # apt-get update

    ```


    Now you can install packages at will. For example, use this to install the latest
    version of AbiWord:


    ```

    # apt-get install abiword

    ```'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Chapter 10 — Remastering Knoppix 217


    Similarly, use the following to install the newest Firefox Web browser:


    ```

    # apt-get install mozilla-firefox

    ```


    Naturally, you can also remove packages, which is necessary if you want to install
    additional packages. If you don''t free up enough space for your new packages,
    your final Live CD won''t fit on a CD! The following removes OpenOffice:


    ```

    # apt-get remove openoffice.org*

    ```


    Adding * to the command catches all of the packages.


    Afterward, you have to clean up inside the chroot:


    ```

    # apt-get clean

    # ummount /proc

    ```


    After you are done, simply exit the chروط shell.


    # Other Customizations


    You can make several other common modifications to a Knoppix Live CD. The following
    sections explore some of them.


    # Setting Passwords


    Setting the initial passwords of the knoppix and root users is simple. To set
    the knoppix user password, execute the following in the chroot:


    ```

    # passwd knoppix

    ```


    To set the root user password, execute the following:


    ```

    # passwd

    ```


    Enter and confirm the password. Setting these passwords on a Live CD that is distributed
    and used "in the wild" isn''t a good idea as it might seem. In Knoppix, with the
    knoppix user able to execute commands directly using sudo, you want to avoid anyone
    being able to log into Knoppix remotely over a network. Although Knoppix itself
    can''t be tampered with by a remote user, it is possible for a user to access
    the hard disk or other media on the computer that is running Knoppix.


    # Picking a Different Background


    Changing the default background is easy once you have uncompressed the KNOXPIX
    file. The location of the background used in Knoppix is /usr/local/lib/knoppix.jpg
    in the chroot. You can overwrite this file simply by overwriting this image:


    ```

    # cp mybackground.jpg /home/knoppix/knoppixuncompressed/

    /usr/local/lib/knoppix.jpg

    ```


    You can overwrite this image with an image of any format.'
