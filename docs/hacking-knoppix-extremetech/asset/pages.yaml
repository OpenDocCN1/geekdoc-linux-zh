    Create a security report about your Windows machine by selecting SecReport from
    the list. Choose where the report''s files should go. A: is the default, and you
    really don''t want to do that unless you enjoy writing for floppies to sloooooorld
    write their data. Better to choose a USB flash drive, or a folder on the machine''s
    hard drive, or as C:\secreate.


    Make sure the directory you enter actually exists, or SecReport will not write
    any files. (Yes, that is annoying and something that be fixed.)


