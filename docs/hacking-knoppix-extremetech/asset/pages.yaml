  md: '# Chapter 7 — Clustering with Knoppix 171


    You''re going to see a bunch of errors, which is perfectly normal. Don''t worry
    about installing the software: It''s best to leave it in the src directory and
    use it from there, ensuring that you won''t lose the program later. If you plan
    to use a more permanent master node, you can install it there, but the rest of
    this example assumes the binaries are left where John''s makefile created them.


    After the program compiles, download a dictionary to use. The facto standard dictionary
    is all.gz, available at http://ftp.popen.com/pub/wordlists/all.gz. Use the following
    to fetch it into the John directory:


    ```

    cd /mnt/hdc4/src/john-1.6/

    wget ftp://ftp.popen.com/pub/wordlists/all.gz

    ```


    Configure your copy of John the Ripper to tell it how many nodes you have. By
    default, John assumes you have two nodes. If this is the case for you, skip this
    paragraph. To change the number of nodes in the cluster, you will need to manually
    edit the john.ini config file in the run/ directory. Open the file in your text
    editor. Toward the bottom is a line reading total = 2; Change the number 2 to
    the number of nodes you have.


    With John the Ripper compiled, a dictionary installed, and the number of nodes
    configured, the installation is finished. Next you''ll create a password, extract
    its hash, and finally crack that password.


    # Running John


    Begin cracking by setting a new password for user knoppix on the ClusterKnoppix
    machine. For this example, choose something relatively simple, such as bottle,
    to ensure that you won''t spend hours waiting for John to stumble upon. To set
    the password, run the following:


    ```

    sudo passwd knoppix

    ```


    Enter the new password twice when prompted. Then create an unshadowed version
    of the password file. In modern UNIX and Linux systems, the /etc/passwd file doesn''t
    actually contain the password hashes. They are stored in a shadow of the password
    file, which is readable only by root or the shadow user. To crack the password
    without running John as root, you must create a password file containing hashes
    for that, a normal user, can read. To store the unshadowed results in


    ```

    john-1.6/run/unshadow /etc/passwd /etc/shadow > /tmp/unshadow

    ```


    This gives you a set of hashes to work with, and you can now begin cracking passwords.
    From within the john-1.6/run/ directory, run the following:


    ```

    .john-rules -external:parallel -wordfile:/.../tmp/unshadow

    ```


    As shown in Figure 7-4, processing is distributed among the nodes.'
