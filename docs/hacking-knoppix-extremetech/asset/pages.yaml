  md: '# Chapter 2 — Maximizing Knoppix Internet Tools 61


    You''re halfway done; you''ve taken care of the sending part. Now you need to
    receive email. Go to the Receiving tab and click the Add button. Figure 2-9 shows
    the small Add Acc window that opens. Choose the kind of email account you have.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_86_0.png)


    FIGURE 2-9: Tell KMail which kind of email account you use.


    You''ve got five options. Here''s what each one means:


    +   - Local mailbox: Use this if you have local mail stored in the widespread
    mbox format, in which each folder''s messages are stored, concatenated, in a single
    file. mbox probably should be avoided because one damaged email can corrupt an
    entire mbox file containing hundreds or thousands of messages.

    - POP3: Post Office Protocol 3, which is what most people use. With POP3, you
    download your email from your server when you check it (yes, you can leave copies
    on your server, but this is not the correct way to use POP3, and it creates a
    mess, with copies of email on that machine and that).

    - IMAP: Internet Message Access Protocol, which is what more people use, especially
    those who access email from more than one machine. Unlike POP3, IMAP stores email
    on the server. only the headers are downloaded; when you view an individual message,
    the content is downloaded so you can see it. Delete an email, it is deleted on
    the server. With IMAP, you always see the same email, no matter which machine
    you use to view it.

    - Disconnected IMAP: The same as IMAP, except that a copy of each message is downloaded
    onto your machine so that you can view, and delete messages while you''re offline;
    when you reconnect, your changes are synchronized with the email store on the
    server. Disconnected IMAP is faster than regular IMAP and enables you to work
    with email when you aren''t connected to the Net.

    - Maildir mailbox: The successor to mbox, in which each email is stored in a separate
    file. If you have local emails that have been saved using maildir, this is your
    choice.'
