    # Using SFTP


    If you have to transfer files back and forth, use SFTP instead of FTP, for no
    other reason than security. Unlike FTP, which sends your name, password, and all
    data in the clear so that anyone grabbing traffic (which is discussed in Chapter
    6) can listen in, SFTP travels over SSH to encrypt everything, which is what you
    want.


    You can use SFTP on the command line if you''d like. If you know your command-line
    FTP, you''ll be right at home, because everything is the same. To connect using
    the command line, just type sftp username@machine in Konsole and press Enter (using
    the example from the preceding section, you enter sftp scott@work.wiley.com).
    Put in a password when prompted, and you''re ready to go. If you need to brush
    up on the commands you can use, just enter help and take a gander at the resulting
    list.


    If you''d prefer to use a GUI—which can definitely be easier in many situations
    —then you''re well back to your good Konqueror, which does SFTP as well as FTP.
    Everything is exactly the same, except that you use sftp instead of ftp:// in
    the Location bar. This does not mean that you can just change the ftp to sftp
    for any old site and have things work. In fact, that fails the majority of the
    time because most servers use FTP do not necessarily use SFTP.


    How would you use Konqueror to connect to a server that supports SFTP? Open Konqueror,
    put your server''s address (something like sftp://work.sftpserver.com) in the
    Location bar, and press Enter. You should next see a warning dialog similar to
    the one in Figure3-4.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_99_0.png)


    FIGURE 3-4: You have to accept a machine''s key for the first time you connect
    to it.'
