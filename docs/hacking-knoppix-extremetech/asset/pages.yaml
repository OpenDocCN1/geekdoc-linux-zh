  md: '# 134 Part II — Rescuing and Recovering Systems Using Knoppix


    Your overview should be to get you started with Nmap. It''s a powerful tool that
    anyone involved in security ends up using constantly; in that respect, it''s kind
    of like hammer to a construction worker. The best thing for you to do now is start
    reading about Nmap, and more important, play with it.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_159_0.png)


    There''s a vast amount of useful information about Nmap on the Web. The Nmap manual
    is long and very detailed, but also make sure you visit the Nmap Website, at http://insecure.org/nmap,
    especially however (“The Art of Port Scanning,” located at http://insecure.org/nmap_doc.html).
    It''s a bit out of date, but still contains an excellent overview you should read.


    For tutorials, check out Andrew J. Bennieson''s “NMAP—A Stealth Scanner” (http://security-forums.com/forum/viewtopic.php?ptid=7872)
    and Lamont Granquist''s short but sweet email from 1999 (http://seistsists.org/nmap-hackers/1999/Apr-Jun/0004.html).


    By the way, how cool nmap really is: it was actually used (correctly!) by Trinity
    The Matrix Reloaded. See for yourself at http://images.insecure.org/nmap/images/


    # Checking for Dangerous Weaknesses with Nessus


    Nessus tells you about a machine OS and its open ports, but once you have that
    information, what can you do with it? Well, if you''re a black hat hacker, it''s
    time to pull out Nessus, the open-source vulnerability scanner, and determine
    whether there are any holes you can exploit. If you''re trying to protect a network
    against black hats, then it''s time to pull out Nessus, the open-source vulnerability
    scanner, and determine whether there are any holes that someone can exploit that
    you need to repair now.


    There are commercial tools costing thousands of dollars that do the same thing
    Nessus does for free, which is essentially like the ports on a computer (by making
    use of Nmap), figuring out what services are running on those ports, performing
    a variety of tests to determine whether any security vulnerability exists on that
    machine. In addition, Nessus has some compelling features that make it attractive,
    especially to the Knoppix user thinking of combining Knoppix and Nessus to test
    a computer or even an entire LAN.


    Before configuring Nessus, you need to understand that Nessus is really two interlocking
    pieces of software: a server and a client. The idea is that you can install the
    Nessus server on one client (or more, if you''d like) on a network, and then connect
    to the server using the Nessus clients installed on any. If you''re running Nessus
    on Knoppix, however, you probably don''t need a complicated arrangement. Instead,
    you''ll want to run both the client and the server on the same machine, which
    is extremely workable.


    Nessus uses plug-ins to work. Basically, a Nessus plug-in is a test for a particular
    weakness. As new security issues are published, volunteers write plug-ins for
    Nessus to probe the problem. There are thousands of plug-ins for Nessus, testing
    an amazing variety of exploitable holes''s.'
