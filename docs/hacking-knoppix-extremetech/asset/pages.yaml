  md: '# 112 Part II — Rescuing and Recovering Systems Using Knoppix


    > Caution Modifying partitions (the Windows XP default) can cause significant
    problems, perform the write function on FAT partitions only.


    When you have the capability to write to the filesystem, locate the Windows top-level
    directory on is usually the Windows C: drive (typically on the drive labeled HDA1).
