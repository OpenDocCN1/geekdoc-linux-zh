  md: '# 20 Part I — Navigating the Amazing Knoppix Toolkit


    perform some quick ''n dirty work, the GIMP is probably just right. You''ll also
    find it''s a big, complicated program, worthy of a book on its own. There is no
    way to cover even a fraction of the GIMP''s capabilities here, but we''ll point
    out a couple of things to whe your interest in this fascinating addition to Knoppix.


    From the K menu, select Graphics -> GIMP Image Editor and then open an image from
    within the program, right-click an image, and choose Open With. Unfortunately,
    KDE in Knoppix isn''t set to include the GIMP by default in the list of Open With,
    so you need to add it. Here''s how: Select Open With+. The Open With window appears.
    Click the + to Graphics to expand it, and then choose GIMP Image Editor. Before
    you click OK, check the box next to Remember Application Association for This
    Type of File if you plan to use the GIMP quite a bit.


    GIMP displays an image much like what''s shown in Figure 1-14. (This image is
    of Libby, a wonderful dog of one the authors, back when she was a puppy.)


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_45_0.png)


    FIGURE 1-14: The GIMP, ready to edit an image of a really cute little dog


    Three windows are open. From left to right, they are the main toolbox, which contains
    the basic tools you use to work on your images; the image window, containing the
    picture you''re manipulating; and a window containing several panels joined together,
    including Layers, Channels, Paths, Brushes, Patterns, and Gradients (let''s call
    the dialog window). Notice the menu — the main toolbox has the highest-level menu
    that governs the image in general, the image window contains all the goodies that
    enable you to change the image in amazing bewildering variety of ways, while the
    dialog window lacks menus, which is just fine.


    If you know Photoshop or Fireworks or any other image-manipulation program, dive
    into the GIMP and start discovering where it has placed the equivalents to the
    commands you know. Don''t expect to find everything — as mentioned earlier, the
    GIMP isn''t yet up to the capabilities of the proprietary programs, but it''s
    gaining fast.'
