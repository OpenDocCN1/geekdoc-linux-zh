    \ files of CD-burnable length; you can burn both using K3b (discussed later in\
    \ this chapter) and enjoy Prof. Christensen's brilliant observations in your car\
    \ during those long road trips. That's just one of the many things you can do\
    \ with Audacity. To use the program to its maximum, you really need to investigate\
    \ Audacity further. You can start with a visit to Audacity's home page at http://audacity.sourceforge.net,\
    \ and then move on to a Google search for \"audacity tutorial.\" You'll find a\
    \ lot of great\n\n# Viewing Images\n\nWho doesn't like importing and viewing pictures\
    \ of your friends? And then using software to distort their heads so they look\
    \ like pumpkin-headed fre before emailing the results to other friends? Yes, Knippox\
    \ makes it all possible. In fact, that's his motto: \"Knippox Making Pumpkin-Heads\
    \ Possible for Years.\" OK, that's a silly joke—but the rest is true. Honest!\n\
    \n# Using Kuikshow\n\nWhen it's time to view pictures, you're looking for three\
    \ things: speed, wide compatibility with a variety of image formats, and the capability\
    \ to automatically resize an image it's larger than the monitor. Knippox comes\
    \ with Kuikshow (see Figure 1-12), a program that nearly meets those three goals.\
    \ Open Kuikshow from the K menu to select Graphics $\rightarrow$ Kuikshow:\n\n\
    Theoretically, once Kuikshow is open, you choose File $\rightarrow$ Export and\
    \ navigate to the image you want to see, select it, and then view it in Kuikshow.\
    \ In reality, many use the Konquer file manager to manage the image they want,\
    \ right-click, and select Open With $\rightarrow$ Kuikshow. Kuikshow opens, displaying\
    \ the image. If you want to view other images in the directory, the quickest is\
    \ to press PgDn/Page Down on your keyboard to get the next image, and PgUp/Page\
    \ Up to the previous image.\n\nThere aren't any menu visible in Kuikshow, because\
    \ it's a kind of bare-bones app. You can, however, make few changes to the image\
