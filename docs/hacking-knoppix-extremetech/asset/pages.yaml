    # # Recovering Data


    If your Windows system crashes completely and cannot be recovered using the Registry
    Editor or the boot.ini, you may face some serious problems if important data on
    the system wasn''t backed up. Knoppix can come to your rescue by enabling you
    to access your Windows partition and save your important data to multiple devices
    for restoration later. These methods include using USB jump drives (also called
    flash drives or key drives), using CD-Rs and DVD-Rs, and copying data over the
    network. This section explains how to recover and save the data that you''ll restore
    after you have reinstalled Windows following a crash.


    # # Preparing for Data Recovery


    The most common mistake when recovering data from a system is failing to retrieve
    all of it because of haste. What you leave behind is typically the data you end
    up needing the most, so take your time and ensure that you are capturing everything
    valuable. The most common area for data storage is in the Documents and Settings
    folders (usually /mnt/hdal/Documents and Settings), which is Windows'' default
    for saving most user data, music, pictures, and so on. If there are any nonstandard
    directories into which you or your users save data, consider those as.'
