  md: '# Chapter 1 — Unraveling the Knoppix Toolkit Maze


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_52_0.png)


    FIGURE 1-18: Creating a Data CD Project in K3b


    # Setting Burn Speed


    The first thing to set is the speed at which you''re going to burn your CD. This
    may or may not work. Do this on the Data Project window''s Writing tab (see Figure
    1-19).


    If you leave speed to Auto, K3b tries to burn at maximum speed. Experience has
    shown that it''s a good idea to burn at a slower speed to ensure that the burn
    is not problematic, matter what software you use. If you have the time and patience,
    4x is slow and steady and always works. Granted, it takes about 15 minutes or
    so to burn a 700MB disc, but it''s not a big deal. If you''re not patient, start
    out fast, test your results, and be prepared to slow down gradually, testing each
    burn until you find the optimal speed for your hardware and media.


    If you leave On the Fly, K3b just that: writes the files directly to the CD-RW
    without creating an ISO image. If your hardware is fast enough, this should be
    no problem. If your hardware is slow, or if you are experiencing problems burning,
    check On the Fly; K3b will first create an ISO image of data, and then that image
    to disc, a process that takes longer but is more likely to result in a good burn.
    If uncheck the Fly, Remove Image is no longer grayed out; however, you should
    probably leave Remove Image checked so that K3b erases the ISO it created once
    it has successfully burned it to disc, reclaiming your storage for Knoppix.'
