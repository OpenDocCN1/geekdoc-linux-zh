- img_proc: true
  md: 'Unlike other office suites, OpenOffice.org is not designed to lock in users
    by forcing them into proprietary data formats. Because it has this philosophy,
    OoO supports a wide variety of formats, including some that may surprise you.


    Most users of OoO know that it reads and writes Microsoft files pretty well. You
    can open Word, Excel, and PowerPoint files and templates, and it''s a pretty sure
    thing that Oo will display them like the original Microsoft apps. In addition,
    you can save files using Microsoft''s Word, Excel, or PowerPoint formats, and
    most users of those programs have no problem opening and using your documents.
    In fact, they''ll probably never know that you used something other than a Microsoft
    program unless you tell them.


    OoO actually enables you to save your work in a cornucopia of formats, including
    the following (listed by application):


    +   - OoO Writer gives you the options of OpenOffice.org 1.0, Microsoft Word 97/2000/XP,
    Microsoft Word 95, Microsoft Word 6.0, Rich Text Format (RTF), StarWriter, text,
    and HTML.


    +   - OoO Calc provides OpenOffice.org 1.0, Microsoft Excel 97/2000/XP, Microsoft
    Excel 5.0, Data Interchange Format, iBASE, StarCalc, CSV, and HTML.


    +   - OoO Impress allows for OpenOffice.org 1.0, Microsoft PowerPoint 97/2000/XP,
    StarDraw, StarImpress, and HTML.


    The OpenOffice formats are good. They tend to be much smaller in size than their
    Microsoft counterparts (because they''re really just zipped XML-formatted files);
    they are open and available to anyone, rather closed and proprietary; and they''re
    the bases for efforts by the Organization for the Advancement of Structured Information
    Standards (OASIS) to standardize on a common, open, XML-based format for office
    suites (predictably, Microsoft has to take a "wait and see" approach to OASIS''
    goals). However, as with everything in the open-source world, OoO gives you options
    and leaves the final decision up to you.


    One of the most useful file types that OoO supports is Adobe''s PDF. Using OoO
    1.1, create a text document and then select File\->Export as PDF, or if you prefer
    to use the toolbar, click the Export Directly as PDF button, visible in the center
    of Figure 1-26.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_63_0.png)


    FIGURE 1-26: The OpenOffice.org function toolbar, with the Export Directly as
    PDF button in the center, between the Edit and Print buttons.


    OoO creates excellent PDFs, readable by any Linux, Mac OS X, or Windows users.
    It is really a fantastic benefit and, with so many of the really cool things about
    OoO, it''s 100 percent free and built in to the program.'
  merge: -1
  pgno: 63
- img_proc: true
  md: '# Chapter 1 — Unraveling the Knoppix Toolkit Maze 39


    In addition to PDF, OOO now supports a format that may surprise some of you: Macromedia''s
    Flash. Yup, that''s right. Macromedia Flash, the cause of so many annoying advertisements
    and useless splash pages on the Web, is now available for export by OOO users
    — specifically, OOO Imp users. If you create a presentation, select File -> Export;
    from the File format drop-down menu, choose Macromedia Flash (SWF) and you''re
    done.


    Complaints about Flash aside, the capability to export this format is a pretty
    useful feature. Flash is widely supported (the tune of more than 90 percent of
    OOO users, using Macromedia), and it produces small files that are completely
    cross-platform. An exported presentation can be placed on a company website, and
    users can open it with their Web browsers to view it. If a user clicks on a slide,
    the next one loads.


    OOO is a powerful program, and it''s constantly getting better. If you''re using
    Knoppix, however, you''re probably not going to use OOO to write your next novel.
    Instead, you''re more likely to recover or quickly edit a few documents. The capability
    to export documents in a variety of popular formats is an essential feature of
    OOO that makes it a key part of your Knoppix toolkit.


    The first place to go for information about OOO is, not surprisingly, www.openoffice.org.
    This is the motherhood for OOO users, where you can download the program, read
    the latest OOO news, get some aid if you need it, and contribute to the project
    if you''re inclined.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_64_0.png)


    The most active online forums for OOO can be accessed at www.ooforum.org, an excellent
    resource.


    Another great place to look is www.openoffice-support.net, which includes tutorials,
    descriptions, and HowTo. The tutorials in particular are quite nice, especially
    for anyone desiring a list of मैटर to help in learning the basics of OOO.


    # Desktop Publishing with Scribus


    Scribus is an open-source publishing application that enables you to design, create,
    and produce documents for publishing that contain complex layouts, such as newsletters,
    brochures, ads, fliers, and even magazines. In addition, because Scribus outputs
    as PDF (perfect for handing off to your local print shop), you can generate PDFs
    with advanced features — such as forms and passwords — hititherto available only
    with the purchase of Adobe''s Acrobat package (which is expensive and does not
    run on Linux). Scribus brings the full world of desktop publishing (DTP) to Linux
    and Knoppix — an amazing achievement.


    From the K menu, select Office -> Scribus. Figure 1-27 shows the Scribus workspace.


    Scrib is enormous in capabilities and features, so big it really needs a base
    of its own. There''s no way to cover the program in any meaningful way here, especially
    for those who may be new to DTP, our advice is to just jump in. If you''ve used
    PageMaker or Quark, you should feel right at home in Scribus; if you haven''t,
    Scribus is an excellent program in its own right that you can use to bring yourself
    up to speed with the world of DTP. Consider it a tremendous bonus that Knoppix
    makes it easy for anyone to try out this truly amazing program, a harbinger of
    open source''s maturity and growth.'
