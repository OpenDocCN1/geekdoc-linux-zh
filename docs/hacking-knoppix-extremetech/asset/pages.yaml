  md: '# xviii Introduction


    # # About This Book


    Hacking Knoppix is your guide to the wonderful world of Knoppix. The authors have
    been using Knoppix for years, in all sorts of ways, and we all jumped at the chance
    to share our experiences and hard-won knowledge with you. We hope you find Hacking
    Knoppix inter-esting, inspiring, and useful.


    You don''t need to read this book straight through beginning to end. Instead,
    feel free to jump around from chapter to chapter and dive into the stuff that
    interests you. Just be sure to try out the stuff that''s covered. It''ll make
    this book more enjoyable, and you''ll learn Knoppix a lot faster and more effectively.


    # # Who Is This Book Written For?


    This book is not just for Linux users. Folks who use Windows (in other words,
    most people) will find that Knoppix is darn handy to keep in their toolkits as
    well. Many are the machines I have fixed with nothing more than patience, my trusty
    Knoppix CD, and a pinch of luck.


    This book is aimed at intermediate computer users. If you''ve used Linux a bit,
    the topic will be a bit easier for you, Linux experience is not absolutely required
    as long as you keep an open mind and want to learn.


    You need access to a computer that can run Knoppix. Right now, this means an Intel-compatible
    CPU that''s at least 486, a bare minimum of 96MB of RAM, a bootable CD-ROM drive
    or boot floppy and standard CD-ROM, a standard SVGA-compatible video card, and
    a serial, PS/2, or USB mouse.


    Those are the official Knoppix recommendations. In reality, here''s what I''d
    try to have: a Pentium III or the AMD equivalent, a decent video card with at
    least 4MB of RAM, and 128MB of RAM at the bare minimum—256MB of RAM is better,
    and 512MB is positively sweet.


    # # How This Book Is Organized


    The 12 chapters of this book are divided into four major parts, each focusing
    on a different topic. Two appendices round out the volume.


    # Part I: Navigating the Amazing Knoppix Toolkit


    Part I is an introduction to the software tools included with Knoppix. Chapter
    1 covers the important parts that any computer user is going to look for in operating
    an operating system, such as printing, multimedia, burning CDs, and creating documents
    of all kinds. Chapter 2 moves on to Internet-based software. First you connect
    to the Net with broadband, wireless, or dial-up, and then you can use programs
    as BitTorrent, Firefox, KMail, and Gain—all. Chapter 3 is about using Knoppix
    to link to other machines, files, and printers, and enabling others to connect
    to your Knoppix machine to access selected resources.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Introduction


    # xix


    # Part II: Rescuing and Recovering Systems with Knoix


    Part II is where you start to use Knoppix to work beyond simply running. You begin
    using Knoppix to fix problems. Chapter 4 uses Knoppix to repair issues common
    to Linux boxes, and Chapter 5 does the same for Windows. Ever had a problem with
    GRUB or a partition, or an issue with boot .ini or viruses? Then Chapters 4 and
    5 will come in handy. Chapter 6 looks at how you can use Knoppix to make your
    systems and networks more secure by utilizing encryption, testing for vulnerabilities,
    and sniffing packets, among other cool tricks.


    # Part III: Knoppix Variants


    Knoppix itself becomes a building block for other Linux Live CD distros that perform
    an astonishing variety of tasks. Part III presents the coolest and most useful
    of Knoppix variants. Chapter 7 investigates others that help scientists perform
    their jobs (if you''ve ever wanted a way to create a super-powerful Linux cluster,
    this is the chapter for you!). Chapter 8 analyzes four Knoppix-based distros that
    focus on security. These are some of the most powerful CDs or computer pro could
    have in their toolkit. Check ''em out!


    # Part IV: Customizing Knoppix and Live CDs


    In IV, you learn how to create your Knoppix-based Live CD. This is some really
    cool stuff! Chapter 9 leads you through various customizations you can make without
    remastering your distro. Chapter 10 guides you through the intense process of
    changing and remastering Knoppix, and we you''ll be surprised when you discover
    that it''s detailed, but eminently doable, process. In Chapters 11 and 12, you
    put what you learned in Chapter 10 to work. Chapter 11 walks you through creating
    Archix, a distro for kids, and Chapter 12 helps you create a distro called Myppix
    that is totally focused on you and your specific Linux needs.


    # Appendices


    The two appendices provide you with auxiliary information about Knoppix. Appendix
    A covers the Knoppix boot process with a fine-tooth comb. You may think how Linux
    machines boots, but trust us: Knoppix is different. We guarantee that you''ll
    find techniques in this appendix that you had no idea. Appendix B helps you keep
    Knoppix off of the CD it comes on and put it onto your hard drive. If you like
    Knoppix so much that you want to become your main OS of choice, Appendix B will
    help you do so..


    # README: Some Things You Really Need to Know


    Starting with Knoppix 3.8.1, UnionFS—a unification filesystem—was added to the
    distro. This was an enormous change because at once, several longstanding problems
    installing on top of a CD-based distro were solved, and many new possibilities
    became available to Knoppix users. To maximize your use of Knoppix, you need to
    understand what UnionFS does and how you can use it. This is extremely important,
    and the authors of Hacking Knoppix assume throughout this book that you have read
    this section.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Introduction


    # The knnoppix-mkimage Script


    The knnoppix-mkimage script is amazingly useful. It enables you to save virtually
    any change made to Knoppix while you are running it. Think about that for a second.
    Previously, you couldn''t really install new programs on top of Knoppix because
    the /usr directory was read-only (yes, there were a few hackish ways around that,
    which you''ll see in Chapter 10). You could save changes made to your home directory,
    but that was about it. Now, thanks to a fantastic technology called UnionFS, you
    can basically make any change that you want to running your copy of Knoppix, save
    those changes to a structure that exists in layers on top of the read-only Knoppix,
    reboot Knoppix, and have all those changes made automatically restored for your
    use.


    With a Knoppix CD and a USB flash drive, you can sit in front of any computer,
    and in a few minutes, find yourself using Knoppix with your settings, configurations,
    programs, and customizations. That is, if you don''t reboot it, wicked cool!


    For details about Knoppix UnionFS and how it works, see "A Stackable Unification
    File System" at www.fl.cs.sunusb.org/project-unionfs.html, Linux Journal''s "Kernel
    Corner—Unions: Bringing File-systems Together" at http://linuxjournal.com/article/77714,
    and "LinuxHints/KnoppixUnionFS" at www.hants.linux.org/cgi-bin/wiki.pl?LinuxHints/KnoppixUnionFS


    To use UnionFS with Knoppix, first run the knnoppix-mkimage script by selecting
    the Knoppix menu -> Configure -> Create a Persistent Knoppix Disk Image. An introduction
    screen (see Figure 1) is displayed with all the details.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_21_0.png)


    Figure 1-1: The knnoppix-mkimage introduction screen


    Don''t worry about the title bar of the window, as Knoppix makes home directory
    instead of an entire disk image. The Knoppix developers will clean up that bit
    of legacy code soon.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Introduction


    Familiarize yourself with this overview, and then click Yes. Next, select the
    writable media you want to use to store your files, as shown in Figure 2.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_22_0.png)


    Figure 1-2: Where do you want to store your persistent image?


    Knoppix automatically detects hard drives, USB flash drives, Zip drives, and other
    writable media that it can use. A USB flash drive would give you maximum portability.
    Free feel, though, to use your hard drive if you plan to reboot Knoppix a lot
    on the machine you''re using. If you''re going to use your hard drive, don''t
    worry about wiping out everything—you''ll be asked in just a moment to select
    how big you want your disk image to be, so you could even select a partition containing
    Windows if you wanted.


    Next, indicate whether you want to encrypt the disk image you''re going to create
    (see Figure 3).


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_22_1.png)


    Figure 1-3: For maximum security, encrypt your persistent image.


    If you''re really paranoid, then by all means, choose Yes; just be aware that
    you''re going to have to enter a 20-character password every time you boot. If
    you''re talking the security of important documents, however, this is hardly a
    burden. If you don''t need to worry about securing your disk image, click No.


    Then you have a big decision to make: how big should your persistent disk image
    be (see Figure 4)?'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Introduction


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_23_0.png)


    Figure 1-4: How do you want your persistent image to be?


    The size you choose is totally dependent upon how you plan to use Knoppix. If
    you''re going to be using Knoppix on the same desktop machine for quite a period
    of time, you may want to create a multi-gigabyte disk image. If you''re going
    to store the image on a USB flash drive, you''re probably thinking in terms of
    a few hundred megabytes or so. Just make sure that the device you choose has enough
    room on it. If you''re just starting out with UnionFS and the knoppix-mkimage
    script, which means a minimum of 100MB, nowadays is chicken feed.


    Make sure that you specify the size of the persistent disk image in MB A 2GB image,
    therefore, would be entered as 2000 (or 2048 if you want to be pedantic).


    Click OK, and knoppix-mkimage does its job. This can take a while, so be patient.
    If it appears that the script is hung, be patient a bit longer. It''s working.


    Finally knoppix-mkimage finishes, indicating success, as shown in Figure 5.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_23_1.png)


    Figure 1-5: Your persistent image has been created.


    To use your new persistent disk image, you may have to use a cheat (a special
    instruction for Knoppix) at boot time. Use knoppix home=scan to search Knoppix
    for your persistent home directory at boot time. You can specify the location
    as well; for instance, if you stored the image on your hard drive, you would use
    knoppix home=/dev/idal to use the persistent disk image on the hdal partition.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'You can also use knoppix-mkimage to save files you add, configuration files
    you change, and even applications that you download and install using APT, which
    are discussed in Chapter 10. Thanks to your persistent disk image, the changes
    you make will be available upon reboot, and you won''t have to re-download, re-install,
    and re-configure Knoppix every time you use the distro.


    If you''re feeling particularly clever, you can save more than one disk image
    (see Figure 6).


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_24_0.png)


    Figure 1-6: I like to keep at least a couple of different disk images on my USB
    flash drive.


    Figure 6 shows two images on your USB flash drive: knoppix.img, the current one,
    and knoppix.img.security, an alternative that''s focused on security testing.
    Normally I use knoppix.img, but if I''m going to be doing intensive security work,
    I change the name of knoppix.img to knoppix.security, and then alter the name
    of knoppix.security to knoppix.img. When I start Knoppix, I simply use knoppix-home=scan
    as usual, but this time the image devoted to security is employed.


    When it''s time to go back to the normal disk image, I reverse the renaming process,
    and I''m good to go. Best of all, you can have as many disk images as you need
    ... or will fit onto your media!


    As you read the rest of this book, in many places we assume that you''re using
    a persistent disk image, so you go ahead right now and get that set up. You''ll
    be glad you did, and it will make your experience with Hacking Knoppix more efficient
    and fun.


    # # Conventions Used in This Book


    In this book, you''ll find several notification icons—Note, Caution, and Tip—that
    point out important information. Here''s what the three types of icons look like:'
