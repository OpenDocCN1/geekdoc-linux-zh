    # Looking at Unrm and Lazarus


    The other two major programs in T—unrm and Lazarus are run separately from grave-robot.
    This discussion will walk you through all the details of these programs, but it
    provides an overview so you''ll know what they are and how to use them.


    Be aware that unrm has a very large limitation: at present, it only works on Linux
    systems formatted with the ext2 filesystems. Because more and more Linux distributions
    strip with journaled filesystems as ext3, reisers, and XFS by default, this greatly
    limits the usefulness of unrm.


    Suppose that you accidentally delete a file on your computer, or you''re trying
    to see whether any bad guys took a machine and attempted to delete evidence of
    their presence. In those cases, the combination of unrm and Lazarus helps. Unrm
    first; it makes a copy of all free disk space. Lazarus analyzes the data in the
    copy created by unrm and tries to figure out what the data is.


    Think about unrm for a second before you run it. If you have a 60GB filesystem
    drive, and 19GB are used then unrm is going to make a bit-by-bit copy of everything
    not occupied by those 19GB and then lazarus is going to process those files, and
    in doing so create another copy). Hmm ...


    This means you need to consider two things before running unrm. First, unrm is
    going to copy 41GB—everything not used by the 19GB of data—and lapus is going
    to generate another 41GB. Second, where are you going to put those 82 (41+41)
    GB? You can''t fit them on the same filesystem you''re running unrm against, or
    you''ll be busy overwriting the very things you''re trying to recover! You must
    send unrm''s output to a different filesystem.


    # Understanding Unrm'
