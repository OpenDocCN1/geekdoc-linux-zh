  md: '# 76 Part I — Navigating the Amazing Knoppix Toolkit


    scp can come in quite handy when you want to securely copy files between machines.
    However, it gets tiresome to type scp commands if you have a lot of different
    things to move around. When that happens, you may want to use SFTP, or turn to
    protocols such as SMB or NFS.


    > Note

    The only basics of SCP are covered here. To learn more, man scp is quite helpful,
    or search Google for "scp tutorial."


    # Sharing Files and Printers


    To paraphrase the great poet and priest John Donne, no computer is an island,
    entire of itself. In other words, you can''t store every single file you need
    on your hard drive, and you can''t directly connect every printer you need to
    use your PC. Instead, you need to access files and printers on other machines,
    and you might want to make files and printers on your machine available to others.
    In the Linux world, there are two main protocols for just such sharing: Samba,
    the open-source implementation of Microsoft''s SMB/CIFS (Server Message Block/Common
    Internet File System) protocol, and NFS, the standard Network File System first
    developed by Sun. Both work well, and for both is built into Knoppix.


    # Starting and Configuring Samba


    The roots of SMB (Microsoft) renamed SMB to CIFS a few years ago, but the name
    of the Linux implementation is Samba — get it? go back a long ago. For the purpose
    of this discussion, the Samba project began life when a brilliant Australian programmer
    named Andrew Trident reverse-engineered the SMB protocol, implemented it for UNIX,
    and published his code in 1992. Since then, the Samba project has grown into one
    of the great open-source success stories.


    > Note

    For information about Samba, visit the Samba project home page at www.samba.org,
    or read it about at Wikipedia, at http://en.wikipedia.org/wiki/Samba_software.


    To start Samba


    Samba is now running on your computer. Any machine that supports the SMB/CIFS
    protocol can connect to your Knoppix box. This means Linux, of course, but it
    also means Mac OS and Windows, which gives you an excellent range of possibilities.'
