  md: "# Adding the cloop module Linux Kernel Module\n\nThere is one kernel a Knoppix-based\
    \ Live CD can't function without: the cloop driver. You used the cloop utilities\
    \ for extracting the /KNOPPIX/KNOPPIX file at the beginning of this chapter, and\
    \ in a few moments you'll use them to compress again. For your Live CD to actually\
    \ use the compressed data, however, the cloop driver has to be on that CD. The\
    \ cloop package isn't pre-compiled for any kernels, so you have to make your own.\n\
    \nFirst, make sure you have the kernel headers installed or the kernel source.\
    \ If you follow the directions in either of the preceding sections, this should\
    \ be the case. Now do the following inside the chroot:\n\n```\n# apt-get install\
    \ cloop-src\n```\n\nThe cloop-src package contains the source you need to compile.\
    \ It is placed in /usr/src/cloop.tar.gz.\n\nUnpack the cloop source in /usr/src/modules/cloop:\n\
    \n```\n# cd /usr/src\n# tar xvzf cloop.tar.gz\n```\n\nIf you have installed the\
    \ kernel headers, make sure you have the same kernel headers installed on your\
    \ host system. Then do the following:\n\n```\n# cd /usr/src/modules/cloop\n# debian/rules\
    \ KSRC=/usr/src/\nkernel-headers-2.4.27-2 KVERS=2.4.27-2 kdist_image\n```\n\n\
    The package required is built and placed in /usr/src/modules.\n\nOtherwise, use\
    \ the following if you still have the source of the kernel you made on your host\
    \ system:\n\n```\n# cd /usr/src/kernel-source-2.6.11\n# make-kpkgx modules_image\n\
    ```\n\nThe package is built and placed in /usr/src.\n\nNow, copy either the cloop-module-2.6.11\
    \ or the cloop-module-2.4.27-2 package into the chroot:\n\n /home/knoppix/knoppixuncompressed/\n\
    \nInside the chroot, install the package:\n\n```\n# dpkg -i cloop-module-2.6.11_2.01.5-3_i386.deb\n\
    ```\n\nIf all goes well, your new kernel module exists as /lib/modules/2.6.11/kernel/drivers/block/cloop.ko.\
    \ Make sure it exists, because you'll need it for the next section."
