  md: '# Chapter 3 — Connecting to Other Machines Resources 77


    To test that Samba is running correctly, open up Konqueror in Knoppix and type
    smb://127.0.0.1/ in the Location bar. List of shares, including partitions and
    hard drives, is displayed. Click one of them, and you are prompted for a username
    and password. Use knoppix for the username, and the password is whatever you entered
    earlier.


    You can also test via the command line. As you, not root, enter the following:


    ```

    $ smclient -L 127.0.0.1

    ```


    When you''re asked for a password, just press Enter without entering one. You
    should see a list of all shares, but this is the list that any anonymous user
    will see. Don''t panic—anonymous users can''t actually connect to your folders
    and files. To prove this to, enter the following on the command line:


    ```

    $ smclient //127.0.0.1/hda1

    ```


    When prompted for a password, press Enter, just like an anonymous user. You will
    see the following error message:


    ```

    Anonymous login successful

    Domain=[WORKGROUP] OS=[Unix] Server=[Samba 3.0.9-Debian]

    tree connect failed: NT_STATUS_ACCESS_DENIED

    ```


    At first, things look bad—the anonymous login is successful. But it''s OK—although
    Mr. Anonymous can log in, he can''t see, read, or write anything.


    Now try it as the approved user knoppix. Enter the following on the command line:


    ```

    $ smclient //127.0.0.1/hda1 -U knoppix

    ```


    When prompted for a password, enter the password you created. This time, you should
    be like Flynn, with an FTP-link prompt, like this:


    ```

    Domain=[KNOPPIX] OS=[Unix] Server=[Samba 3.0.9-Debian]

    smb: \\

    ```


    Most of the ftp commands you know work here as well, including ls, cd, get, put,
    mget, mput, and mkdir. However, smclient has a few commands that ftp does not:
    chown, chmod, symlink, hardlink, rd, and, for example (tar is definitely one to
    check out, as you can use it to create backups of files and folders on a Samba
    share). To see the full list of commands, just type help and press Enter.


    For more information about smclient, type man smclient on the command line.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_102_0.png)


    Remember that, by default, Knoppies does the easy way and shares everything on
    the hard drive. If you''re going to have Knoppies running for a while, you should
    either edit the smb.conf file to only share appropriate attributes or turn Samba
    off when you don''t need it by entering sudo /etc/init.d/samba stop on the command
    line. To turn it back on, just use sudo /etc/init.d/samba start, and away you
    go.'
