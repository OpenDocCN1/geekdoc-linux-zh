    If there''s a problem and your content doesn''t appear, make sure your path is
    correct to DocumentRoot in httpd.conf, save it, and restart Apache (make sure
    you''ve got content in that directory!).


    You''ll never use Apache running on Knoppix to power your business or serve up
    pages to thousands of users around the world, but in a pinch, it can be perfect
