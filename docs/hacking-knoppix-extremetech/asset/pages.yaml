  md: '# Chapter 12 — Creating Myppix, Your Personal Knoppix 247


    For example, there could be two files on your USB flash drive: configs.tbz and
    knoppix. sh. configs.tbz consist of changed files from /etc and /home/knoppix,
    which is exactly what you want.


    That''s it for settings and configurations. Soon you''ll use the files you just
