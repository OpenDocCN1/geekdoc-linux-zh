- img_proc: true
  md: "The first thing to do is update the AV database so that Clam can detect the\
    \ latest nasties. Click the Update button, and Clam connects to the Internet to\
    \ download any new patterns (in one case, Clam went from the capability to recognize\
    \ 5,287 virus patterns to seeing more than 6,143). When the process has finished,\
    \ the screen indicates the last update time and the new number of virus signatures.\
    \ Now select the Scan tab, shown in Figure 8-16.\n\n![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_223_0.png)\n\
    \n**FIGURE 8-16:** Tell ClamAV where you want to scan for viruses.\n\nTo give\
    \ ClamAV to scan, open a root terminal by right-clicking on the Desktop and then\
    \ choosing Terminal session $\rightarrow Rxvt — super user. When the shell opens,\
    \ enter mount /mnt/hda2 (or whatever partition you use) to mount the partition\
    \ on the hard drive that holds your data.\n\nNow that the partition is mounted\
    \ and therefore available to ClamAV, return to the program, and click the folder\
    \ icon next to the right of the Location text box. Select /mnt/hda2 and click\
    \ the Select button. At the bottom of the Scan tab, check both Recursive (so the\
    \ scan looks at every folder on...) and Executables Only (so the scan doesn't\
    \ waste its time on text files and like). Click the Start button, and go for a\
    \ cup of coffee. You could continue to work on other things, of course, but you\
    \ might as well leave the computer alone so you can focus on one.\n\nAs soon as\
    \ you click Start, ClamAV switches to the Results tab. If anything is flagged,\
    \ it shows up here. Just to give you an idea about how much ClamAV needs to run,\
    \ a 30GB partition on a 2GHz Pentium with 512MB of RAM takes about five minutes\
    \ or so (so no viruses are flagged, but of course that is a Linux machine).\n\n\
    ClamAV is a good tool to have for virus detection and cleanup. It's really easy\
    \ to run it in scripts using its command-line tools, but that's left as an exercise\
    \ for you."
