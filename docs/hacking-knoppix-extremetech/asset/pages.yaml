    # Understanding John


    First, a bit of background on what John the Ripper does, for those who are new
    to it. Passwords

    typically stored in hashed form, meaning that the original, plaintext password
    isn''t available

    in a file anywhere—only a hash and a salt value are stored. Whenever someone types
    in his

    password, the system gets the salt value, and combines it with the password the
    user is authenticated. In its brute-

    attack, John the Ripper tries a bunch of possible passwords in sequence. It starts
    with "a",

    b,"b", and so on, working its way up to long time, arbitrary strings of characters.
    Needless

    tall ballpark figure of 40 character

    options available for each password character of an 8-digit password, and that
    40'' possible

    passwords—6.5×10¹² unique strings to clear:


    One way to succeed the process is to keep a dictionary of possible passwords,
    and work

    through that. With a dictionary, brute-force password discovery is a very computationally

    intensive process. Frankly, each guess is totally independent of the other guesses,
    making

    this perfect candidate for parallelization. John the Ripper doesn''t include an
    explicitly parallel

    model, but it does with a built-in language and a rule that enables you to split
    up a

    acking session.


    # Setting Up John


    John the Ripper isn''t included with ClusterKnoppix, you need to download and
    compile the

    program, and download a dictionary to start as well. First, create a build directory
    to work

    in. Because you typically want to audit passwords every few months, creating the
    build direc-

    tory on a hard disk is recommended, so you won''t have to rebuild John the Ripper
    every time

    y want to run it. If you have more than one program installed, make a generic
    src

    directory on your:


    ```

    mkdir /mnt/hdc4//

    ```


    Follow that with the following:


    ```

    cd /mnt/hdc4/

    ```


    Then fetch a new copy of the John source code:


    ```

    wget http://www.openwall.com/john/c/john-1.6.tar.gz

    ```


    After the files download, unpack the source code:


    ```

    tar xvf john-1.6.tar.gz

    ```


    John is an old UNIX application, and it doesn''t have a configure interface. Insnsightly
    old-fashioned interface. First change directories (cd john-1.6/src/),

    then run make, which will give you a list of options for build targets. This example
    uses Linux

    x86 with MMX, so the following command compiles the program:


    ```

    make linux-x86-mmx-elf

    ```'
