  md: '# 88 Part I — Navigating the Amazing Knoppix Toolkit


    By default, Apache loads files from /var/www, which means you need to replace
    the files in that directory with those you want to serve, or point Apache to a
    different directory. If you decide on the former, keep in mind that index.html
    is the default file, although index.htm, index.shtml and cgi will work.


    If you want to go with the latter, open /etc/apache/httpd.conf as root with your
    favorite text editor, find the line that currently says DocumentRoot /var/www
    and change /var/www to the directory of your choice. Look down about 25 lines
    or find the line that changes <Directory /var/www> as well. Save your work and
    close httpd.conf.


    You''re not finished yet. You need to make sure that the directory you entered
    has world-readable and executable permissions, like this: chmod +o-xr directory.
    Any directories containing the one you''re trying to use Apache must also be world
    readable and executable as well. Once you''re sure that permissions are correct,
    enter apache restart on the command line as root. Reload http://127.0.0.1 in Mozilla,
    and you should see the contents of your new directory. Even if you have index.html—or
