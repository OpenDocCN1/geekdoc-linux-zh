  md: '# Appendix A — Booting Knoppix 263


    Depending on the runlevel, different features or services are enabled or disabled.
    In Knoppix, the runlevels are divied up this way: four for textmode, one for graphics
    mode, and two that power down the computer. In runlevel 1, Knoppix starts up in
    textmode with only one VC. In runlevel 2, Knoppix starts up in textmode with two
    VCs. Runlevels 2, 3, and 4 act identically. Runlevel 5 is the graphics mode (more
    on this in the next section). Runlevels 0 and 6 are, respectively, for powering
    down or rebooting the machine. To change runlevels once Knoppix is running, use
    the init command. For example, to change to runlevel 1, enter init 1. To change
    back to runlevel 3, enter init 3.


    # Examining the Graphics Phase


    To start the graphics phase of the boot process, enter init 5 from any virtual
    console. Of course, you could also get here by explicitly entering knoppix 5 at
    the boot prompt or by simply pressing the Enter key at the boot prompt runlevel
    5 (graphics mode, which displays the KDE desktop) is the default for Knoppix.


    To start the graphics environment,/etc/init run the script /etc/init.d/xsessions,
    which processes the following cheatscodes:


    | xserver=XFree86 XF86_SVGA | keyboard=us |

    |---|---|n| module=ati|radeon|fbdev|vesa | desktop=fluxbox|icew|kde |

    | savage|s3|nv|i810|mga|svga|tseng | lars|twm|wmaker|xfce |

    | nowmouse | wheelmouse |

    | screen=1280x1024 | xrefresh=80 or hsync=80 |

    | xvrefresh=60 or vsync=60 |


    From within graphics mode, you can also switch virtual consoles. To switch to
    the second VC, press Ctrl+Alt+F2. To return to the virtual console, the fifth
    VC, press Ctrl+Alt+F5. You can change runlevels by using the K menu and selecting
    Run Command, and then typing sudo init 3 to change to runlevel 3, you can also
    do this by switching to a text VC and then entering init 3. To return to runlevel
    5, enter init 5.


    You can cycle between different graphics modes using Ctrl+Alt+Shift+= and Ctrl+Alt-.
    In addition, you can restart the X server using Ctrl+Alt+Backspace.


    # Examining the Shutdown Phase


    To begin shutdown from graphics mode, open the K menu and select Logout, and then
    click either Off Computer or Restart Computer, depending on whether you want to
    power off or reboot the machine. You can also shut down from a virtual console
    by entering poweroff or reboot. During the shutdown, Knoppix goes through two
    more stages before finally powering off. To proceed from one stage to the next,
    simply enter exit at the command line.'
