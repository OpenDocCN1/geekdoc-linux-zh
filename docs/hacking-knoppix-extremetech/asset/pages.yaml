    # Changing a Windows Administrator Password


    Now that you have read/write access to a Windows NTFS partition, you might as
    well do something cool with it, such as change the Administrator’s password—without
    having to know the original password.

    To change the password, you need to know where the SAM database file is. On Windows
    XP, it is located at C:\Windows\System32\Config\SAM; for Windows 2000, look at
    C:\WINNT\System32\Config\SAM. Assuming a Windows XP machine, you will run the
    following command:


    +   # chntpw /mnt/hda1/Windows/System32/Config/SAM


    Enter the password you want to use, and click OK, and you’re finished. Now the
    Administrator on that box has a new password. Pretty easy, eh?


    > If you want to learn how to change the passwords of other users, take a look
    at chntpw visit http://home.eunet.net/~npordahil/ntpasswd.


    # Testing Your System’s RAM


    Sometimes a computer acts flaky, but it has nothing to do with the software at
    all. One user’s Linux laptop, for example, constantly locked up on him, with no
    apparent cause. He tried three or four different distros, with no discernible
    change—eventually, and sporadically, his laptop would lock up, no matter what
    he was running at the time. He emailed a Linux users group and asked for help.
    Another user suggested that perhaps should have been obvious: bad RAM.

    To test this hypothesis, the first booted INSERT and then run Memtest as follows:


    +   # memtest all -1 /mnt/hda1/memtest.log


    Memtest can take a long time to run, depending on the amount of RAM you have and
    the speed of your machine, so you need to be patient. Start it and then leave
    the computer alone. Don’t try to use the machine for anything else, or you’ll
    just prolong the agony.'
