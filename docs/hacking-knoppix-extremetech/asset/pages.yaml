  md: '# Chapter 7 — Clustering with Knoppix 161


    # Understanding ParallelKnoppix


    ParallelKnoppix is a live CD designed to setting up ad-hoc clusters quick and
    easy. It''s ideal for getting started with parallel computing; it only takes a
    few machines. It uses a form of clustering known as MPI (Message Passing Interface),
    which enables applications specifically designed for parallel computation to run
    on several different processors or computers.


    ParallelKnoppix was developed by Michael Creel at the Universidad Autonomoma de
    Barcelona. His homepage (http://pareto.uab.es/mel/ParallelKnoppix/) has links
    to ISO images you can download, and much more useful information.


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_186_0.png)


    Download an ISO image and burn it to a CD before continuing.


    # Setting Up ParallelKnoppix


    ParallelKnoppix has pretty basic requirements:


    +   - A master node, with CD-ROM, keyboard, mouse, network card, and a hard disk
    partition on which you machine can be a stock Windows installation using FAT32
    or a Linux installation using ext3, ReiserFS, or any other filesystem. It just
    needs to be writable from Knoppix.


    +   - From 1 to 2 slave nodes, with kernel-supported network cards and the capability
    to PXE boot. (PXE booting enables your computer to boot off the network instead
    of a hard drive or CD.) You can find out more at http://en.wikipedia.org/wiki/Pxe/).
    You want all the same boot arguments for Knoppix because they will be booted homogeneously
    by default. You also need to know which kernel drivers support the network card.


    +   - A reasonably fast network


    +   - A single copy of the ParallelKnoppix CD, which enables you to create a cluster
    from 2 to 200 nodes


    One thing to note right front: ParallelKnoppix clusters are, by design, very insecure.
    You really don''t want to run it on an open network such as a computer lab. In
    addition, they depend on being the DHCP/netboot server on the network, so pull
    the uplink to the side network before you (just remember to plug it back after
    you''re finished with your crunching!). An astute reader might notice that there
    is no way to get your programs and data into the cluster; you''ll need that in
    a certain case.


    After you have all equipment together, you''ll be about 10 minutes from having
    your own computer cluster. First, boot the master node with the ParallelKnoppix
    CD, just like if you were running Knoppix on the machine. Leave all the slaves
    off—they need to boot up after the master node is configured. When the master
    node is up, you''ll be at a normal KDE desktop, with a copy of the ParallelKnoppix
    home page on the screen. Select ParallelKnoppix → Setup ParallelKnoppix. A series
    of windows appear to guide you through configuring your cluster.'
  merge: -1
