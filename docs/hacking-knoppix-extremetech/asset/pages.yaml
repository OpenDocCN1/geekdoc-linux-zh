  md: '# Connecting to Other Machines and Resources


    ne telephone all by itself is a fashion accessory; however, a telephone connected
    to a telecommunications network can be a lifesaver. In the same way, a computer
    sitting alone is certainly useful, but when you connect it to a network of other
    computers, magic happens. You can transfer data, access resources all over the
    world (or simply in the next room), print to machines not directly connected to
    your machine, control computers, and even make Web pages available to anyone in
    the world. In many ways, the computing revolution over the last decade has really
    been about networking, and Knopix makes the fruits of that revolution fully available
    to its users. Want to make resources on your box available using Knopix? No problem.
    Want to use Knopix to access network resources on other boxes? Even easier.


    # Understanding Remote Control


    Sometimes you''re sitting in front of one computer, but you really need to see
    what''s happening on another. You might be configuring one as a server and you
    need to test the other as a client, or perhaps you''re trying to help family members
    in one city solve a particularly knotty issue, and things would proceed far more
    smoothly if you could just see exactly what they are viewing. Knopix makes remote
    control possible with two different, complementary apps: VNC and FreeNX.


    # Controlling Another Computer with Remote Desktop Connection


    VNC is a free, versatile, multi-platform remote-control server and client that
    every computer user should have in his or her toolkit. First developed by researchers
    at the Olivetti & Oracle Research Lab, it was released under the GPL and made
    available to the world. VNC has received great acclaim because of its power and
    flexibility. It runs natively on Linux and other varieties of *nix, Windows and
    PocketPC, Mac OS, Palm OS, OS/2, and best of


    # chapter 3


    # in this chapter


    +   - Examining remote control


    +   - Using FTP


    +   - Exploring SSH and its descendants


    +   - Sharing printers and files


    +   - Serving Web pages with Apache'
