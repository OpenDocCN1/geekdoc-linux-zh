  md: '# Chapter 1 — Unraveling the Knoppix Toolkit Maze 25


    ![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_50_0.png)


    FIGURE 1-16: Xine, playing Thomas. A. Edison’s “May Irwin Kiss” (1896)


    To control playback, right-click the movie and the items in the menu. Although
    Xine is pretty simple, it’s simply not pretty to use.


    # Burning CDs with K3b


    Here’s a common scenario: Someone’s computer won’t boot, and he’s just got to
    get his data off that machine. As you’ll find out in Chapters 4 and 5, it’s really
    easy to take care of that problem with Knoppix, a NIC, some Ethernet, and a network,
    but that’s not always possible. If the user has a CD-R/W device installed on that
    machine, though, you can still save him by burning a CD. It is tremendously hard
    to burn CD-RWs from the command line, but it’s easier to use a nice GUI, and K3b
    is the easiest CD-burning GUI for Linux, perhaps even on any platform.


    Open K3b by selecting Multimedia → K3b. The first time you open it, K3b asks you
    to confirm your burner’s device. It probably defaults to 0, which is obviously
    of no help, so bump it to the correct set and click OK.


    > This might be obvious, K3b won’t work unless you have a CD-R/W device installed
    on your system, and Knoppix needs to recognize it. To confirm that K3b sees your
    CD-R/W, open K3b, select Settings → Configure K3b, and choose the Devices button
    on the left. The CD-R/W should be listed. If it isn’t, click Add Device and help
    K3b try to find your burner. If you need broader help getting your CD-R/W hardware
    to work, take a look at the CD-Writing HOWTO www.tldp.org/CD-Writing-HOWTO.html.


    Here’s something else you need to consider: You can’t burn a CD if Knoppix is
    taking up your only CD-R/W drive if you have two CDs, you’re set: Boot Knoppix
    in one and use the other to burn. If you have only one CD-R/W drive, you may need
    to install Knoppix on your hard drive (see Appendix B) to free your CD for the
    burn (you can uninstall Knoppix after you’ve checked your CD).'
