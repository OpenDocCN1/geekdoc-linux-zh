  md: '# Chapter 4 — Fixing Linux with Knoppix 103


    Before you actually turn Gpart loose on your hard drive, run the program in demo
    mode, so that it shows you what it would do. Here''s how:


    ```

    $ sudo gpart /dev/hda

    ```


    You point Gpart at your hard drive, not at a partition—which makes sense because
    you don''t have any partitions at this point!


    Eventually—Gpart can take a long time to work, so be patient—you should get some
    output. Look over it carefully, and if Gpart seems it will work for you, then
    it''s time to run the program in write mode:


    ```

    $ gpart -W /dev/hda /mnt/hda

    ```


    If all goes well, you should now be able to boot, with your partitions newly raised
    from the dead! Thank Knoppix and Gpart next time you get a chance. They made your
    life easier, that''s for sure.


    > For further info on Gpart, including what to do when gpart doesn''t work right
    away, check out www.stud.uni-hannover.de/user/76201/gpart/, the project''s home
    page.


