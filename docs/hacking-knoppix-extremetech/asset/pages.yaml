  md: "# Mastering the CD\n\nOnce you are done with your changes, it is time to compress\
    \ the KNOPXPIX/KNOPXPIX filesys- and make the burnable CD ISO:\n\n```\n$ mkisofs\
    \ -iso-level 4 -R -V \"My LiveCD\" -hide-rr-moved \n-cache-inodes -no-back -pad\
    \ /home/knoppix/\nknoppixisouncompressed -n5 create_compressed_fs \n- 65536 >\
    \ /home/knoppix/knoppixiso/KNOPXPIX\n```\n\nPlease be aware that this command\
    \ should be executed on a single line, and it will take a long time to run, depending\
    \ on the size of the /home/knoppix/knoppixuncompressed direc- tory of your machine.\n\
    \nWhen the command is finished, you create the final ISO:\n\n```\n$ mkisofs -pad\
    \ -1 -r -J -v \"My LiveCD\" -b boot/\nisolinux/isolux.bin 4 -c boot/init.cat -no-emul\n\
    -boot -boot-load-size 4 -boot-hide -rr -moved \n-o /home/knoppix/my-livecd.iso\
    \ /home/knoppix/knoppixiso\n```\n\nIf everything goes well, the final ISO should\
    \ exist at /home/knoppix/my-livecd.iso.\n\n# Testing!\n\nQEMU is an excellent\
    \ tool for testing your ISO. It's a machine emulator that enables you to test\
    \ your Live CD without having to (re)burn an actual Live CD. There is no reason\
    \ not to use it—it will save you a lot of time and coasters. You can either apt-get\
    \ get:\n\n```\n# apt-get install qemu\n```\n\nOr you can download it from http://fabrice.beallard.free/qemu.\n\
    \nUsing QEMU is very simple. It's a command-line tool, showing on your host system\
    \ what would happen if you tried to boot your newly created Live CD. Here's the\
    \ command:\n\n```\n$ qemu -cdrom /home/knoppix/my-livecd.iso\n```\n\nOnce your\
    \ Live CD works as planned, you can start burning the ISO using your favorite\
    \ CD recording software. Knoppix comes with the excellent K3B CD/DVD burning suite\
    \ that will make this easier.\n\n# Summary\n\nThis chapter explored the field\
    \ of Knoppix remastering. It showed you the files from a Knoppix Live CD, how\
    \ to install and remove software, how to do other custom- tizations, and how to\
    \ put the pieces back together to create your very own Live CD based on Knoppix.\
    \ The remaining chapters provide a couple of examples of customizing Knoppix for\
    \ specific purposes.\n\n![](img/2fb32174ccf4cfbddb3c8b1d8e3e3b4c_251_0.png)"
