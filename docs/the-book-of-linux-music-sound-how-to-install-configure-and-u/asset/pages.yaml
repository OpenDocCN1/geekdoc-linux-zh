- pgno: 260
  md: 'SAOL is the Structured Audio Orchestra Language. It is designed to work with
    the emerging MPEG-4 audio specification (see the SAOL Web site for detailed information
    regarding MPEG-4). In the author''s own words, it " a powerful, flexible language
    for describing music synthesis, and integrating synthetic sound with ''natural''
    (recorded) sound in an MPEG-4 bitstream. MPEG-4 integrates the two common methods
    of describing audio on the WWW: through low-bitrate coding (like RealAudio) and
    structured audio description (like MIDI files). However, the quality and flexibility
    of the MPEG-4 tools is greater than other audio tools available.


    Currently, the primary tools for SAOL are the compiler (saolc) and the encoder
    (saolenc). saolc will compile an MPEG-4 bitstream or an SAOL orchestra into an
    AIFF audio file, an SAOL score, or a Standard MIDI file. The saolc compiler provides
    "reference" software: it proves the viability of the concept of a music description
    and synthesis language based on the MPEG-4 specification. saolenc will encode
    audio files into an MPEG-4 bitstream (see Chapter 7 for more information regarding
    MPEG and bitstreams).


    sfront translates SAOL programs into C code. Its tools make the use of SAOL easier
    for first-time users. It performs the same duties as saolc, but it is capable
    of much faster compile times, and it is packed with a comprehensive set of tutorial
    examples and documentation.


    The remainder of this profile will focus on the sfront tools, because they provide
    better and more explicit support for Linux.


    # How to Make sfront


    After retrieving the sfront source package, unpack it with tar xzvf sfront-latest.tar.gz
    and change into the newly created sfront directory. Move into the src directory
    and edit the Makefile to indicate where you want sfront installed. Type make,
    and after a few minutes you should have a brand-new copy of the sfront binary.
    make install (run as root) will place the program in your selected installation
    directory, and you can now run the various examples.


    # What It Does


    The best way to see what sfront does is to run one of the examples included in
    the sfront/examples directory. For our example, we will use sfront as an audio
    rendering tool. We''ll take a SAOL-compliant source file (such as my_foo.mp4 or
    my_foo.saol) and convert it to a C program. The resulting C code will then be
    compiled into a soundfile using a native C compiler (typically gcc in most Linux
    systems).


    In the sfront/examples/speedt directory, we find this SAOL instrument:


    ```

    // speedt.saol

    // Tests speedt opcode and templates

    // Written by John Lazzaro

    ```


    Software Sound Synthesis 257'
