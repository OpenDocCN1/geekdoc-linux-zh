- pgno: 424
  md: '# STEAL THIS COMPUTER BOOK:

    WHAT THEY WON’T TELL YOU

    ABOUT THE INTERNET


    by WALL WANG


    > “A delightfully irresponsible primer.” — Chicago Tribune


    > “If this book had a soundtrack, it’d be Lou Reed’s ‘Walk on the Wild Side.’

    —InfoWorld


    > “An unabashed look at the dark side of the Net—the stuff many other books

    gross over.” —Amazon.com


    Steal This Computer Book explores the dark corners of the Internet and reveals
    little-known techniques that hackers use to subvert authority. Unfortunately,
    some of these techniques, when used by malicious hackers, can destroy data and
    compromise the security of corporate and government networks. To keep your computer
    safe from viruses, and yourself from electronic games and security crackers, Wallace
    Wang explains the secrets hackers and scammers use to prey their victims. Discover:


    +   * How hackers write and spread computer viruses

    * How criminals get free service and harass legitimate customers on online services
    like America Online

    * How online con artists trick people out of thousands of dollars

    * Where hackers find the tools to crack into computers or steal software

    * How to find and use government-quality encryption to protect your data

    * How hackers steal passwords from other computers


    WALLACE WANG is the author of several computer books, including Microsoft Office
    97 for Windows for Dummies and Visual Basic for Dummies. A regular contributor
    to Boardwatch magazine (the “Internet Underground” columnist), he’s also a successful
    stand-up comedian. He lives in San Diego, California.


    340 pp., paperback, $19.95

    ISBN 1-88641II-21-2'
