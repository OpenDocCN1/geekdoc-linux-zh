  md: '# 3


    # MIXING, PLAYING,

    AND RECORDING


    ![](img/43a9671cef617c9c7a18f7a6904433f1_58_0.png)


    This chapter will take you through the setup of a basic playback and recording
    system and also step-by-step through your first Linux recording. I will profile
    three programs I consider to be the best of their kind: the aumix software mixer,
    the yarec recorder/player, and the Sox soundfile format converter.


    # The Software Mixer


    An audio-device software mixer is a necessary piece of sound support software.
    The mixer queries your installed audio hardware for its capabilities and represents
    those capabilities as channels. You use faders to control the individual and combined
    channel levels of audio input and output.


    aumix, profiled below, is a versatile mixer that is updated frequently, and I
    recommend it for any any Linux system. I chose aumix because it requires no special
    graphics toolkit, and it is included with all mainstream Linux distributions.
    However, many software mixers are available for Linux, using virtually'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'every popular GUI toolkit. The listing at www.metalab.unc.edu/pub/Linux/apps/sound/mixers/
    is a good place to start looking for a mixer that will accommodate your favorite
    graphic interface. Since the list is rather long, a text file with the .15m (Linux
    software map) extension is provided for each mixer listed. This file provides
    a brief description of the program and its requirements. Read the .15m files—they
    are your friends.


    # aumix


    +   Author: Various; see AUTHORS file in package

    Version profiled: 1.22

    Web site: http://jpj.net/~trevor/aumix.html

