- pgno: 423
  md: '# # THE NO B.S. GUIDE TO nRED HAT LINUX 6.x


    *by BOB RANKIN*


    This book is a thorough concise guide to installing Red Hat Linux 6.x and exploring
    its capabilities. Author Bob Rankin (The No B.S. Guide to Linux, No Starch Press)
    provides easy-to-follow instructions for installing and running Red Hat 6.x. Through
    examples and helpful illustrations, the author guides readers through these topics
    and more:


    +   - Installation—in ten easy steps!


    +   - How to use and configure GNOME—the new Linux GUI


    +   - How to write Bash or Perl scripts and use the Bash shell


    +   - How to connect to the Internet with SLIP/PPP and how to run the Apache Web
    server for Linux


    +   - How to access DOS files and run Windows programs under Linux


    The CD-ROM contains Red Hat Linux 6.2—one of the most popular Linux distributions
    available. It''s easy to install and requires minimal configuration—you''ll be
    up and running in a snap!


    BOB RANKIN is a programmer and nationally recognized expert on the Internet. He
    is a columnist for Boardwatch Magazine and a contributor to several computer publications.
    His books include Dr. Bob''s Painless Guide to the Internet (1996) and The No
    B.S. Guide to Linux (1997).


    402 pp., paperback, $34.95 W/CD-ROM

    ISBN 1-886411-30-I


