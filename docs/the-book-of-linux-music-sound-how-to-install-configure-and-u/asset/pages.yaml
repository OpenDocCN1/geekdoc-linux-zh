- pgno: 215
  md: 'You can also switch between line-segment curves and spline curves. A line-segment
    curve interpolates a straight line between points, a spline curve is smooth and
    rounded between its points. Figure 9-7 shows another view of the my_first example''s
    function graphs, now with two of the functions controlled by spline curves and
    the other controlled by a line-segment curve.


