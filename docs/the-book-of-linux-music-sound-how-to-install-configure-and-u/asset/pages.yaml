- pgno: 214
  md: 'Select File • Save Module As, rename and save CybilExample as my_first.cec,
    then select File • Reinit Module. You are now ready to edit your first Cecilia
    module.


    # The Grapher


    Let''s explore the grapher first. Figure 9-6 provides a better look at the grapher
    in the my_first example.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_214_0.png)


    Figure 9-6: Cecilia''s grapher


    I''ve added simple line-segment graphs for the three graph-controlled functions
    (envelope, indenvelope, volume). Unfortunately, the grayscale screenshots cannot
    show Cecilia''s use of color coding: Each envelope curve is a different color,
    which helps when the grapher is filled with curves. The entire program makes good
    use of color schemes and coding.


    To edit or create a line-segment control envelope, select a function by clicking
    on its label (at the left side of the graph window). Its line will be highlighted
    in the grapher, and you can now add points to it by left-clicking the mouse pointer
    within the graph display. Points can be dragged around the graph, and you can
    delete points with a middle-button click (or a simultaneous right/left click on
    a two-button mouse).


    To move an entire curve, bring the pointer over the curve you want to move. When
    the line turns white, click and hold the left mouse button and drag the curve
    to a new location.'
