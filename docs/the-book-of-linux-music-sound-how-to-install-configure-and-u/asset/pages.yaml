    // Syntax:

    C++

    // Smake: cc -Wall -g -c b.cpp -I../../../../include -8 rm -f b.o

    //

    #include "WhiteNoise.h"

    #include <iostream>

    #include <stdlib.h>

    #include <limits.h>

    #include <time.h>

    /////////////////////////////////////

    //

    // WhiteNoise::WhiteNoise

    // default values: aMaxAmplitude aMaxAmplitude randomSeed = 0

    //

    WhiteNoise::WhiteNoise(sampleType aMaxAmplitude, int randomSeed) {

    setName("WhiteNoise"); setAmplitude(aMaxAmplitude); seed(randomSeed);

    outputValue = 0; brandname = GENERATOR; action();

    }

    ```'
