    # The Instrument Panel


    The next panel (in the center of the lower left window in Figure 9-11) is where
    you design your instruments. Separate panels are available for mono, stereo, and
    quad output, and any all may be used. The output selector in the main window will
    determine the output channels; however, if no panel exists for an output type,
    it will be grayed out. Our my_first example has only a stereo instrument, so a
    good exercise will be to add a mono panel to it.


    # To Add A Panel


    Click on the mono panel selector under the menu bar, and a new empty panel will
    appear in the editor. For the my_first example, simply copy and paste the stereo
    panel contents into the new panel. Select the text in the stereo panel by left-clicking
    and dragging the mouse over the text. Choose Copy from the Edit'
