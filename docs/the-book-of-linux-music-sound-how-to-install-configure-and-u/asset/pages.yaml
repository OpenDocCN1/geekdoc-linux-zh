  md: 'kernel series 2.0.x and 2.1.x Hannu is no longer involved in the development
    of the kernel driver and its API (application programming interface); kernel hacker
    Alan Cox now maintains that area.


    # Linux Arrives


    In 1996, when I started maintaining a Web site that provided audio sound and music
    applications written for Linux, "all" meant about 40 links. The site now lists
    more than 500 Web addresses for audio and music software applications, including
    many for digital signal processing software, MIDI programs and tools, software
    synthesizers and synthesis languages, and players for virtually every popular
    soundformat. Many of these powerful tools and applications can be run on both
    Linux console and the Windows system, and sound and music applications now exist
    for every notable window manager, GUI toolkit, and desktop environment.


    Why is the world of Linux sound and music exploding with activity?


    Open source code availability (letting anyone see and modify the source code behind
    Linux and Linux applications, which was the base of Linux''s success) had a profound
    effect on the Linux audio community. Application sources coupled with straightforward
    sound programming interfaces provide an excellent environment for developing audio
    and MIDI software. As a result, Linux music and sound software have proliferated.
    Many projects have shown real longevity and growth, indicating a bright future
    for Linux as a powerful platform for audio and music development.


    # … and Hardware Follows


    Hardware vendors such as Trident, Creative Labs, and Aural 3D have recognized
    the Linux phenomenon: Trident made their 4Dwave chipset specifications available
    for free to Linux developers, Creative Labs has open-source Linux drivers for
    their popular 5Live soundcards, and Aural now provides Linux drivers for their
    Vertex chipsets (included on many popular soundcards, such as the Turtle Beach
    Monte). The ALSA open-source soundcard driver project now includes support for
    the RME Hammer digital audio board and the Mark Of The Unicorn MIDI Piece/AV (a
    complex MIDI interface/router/time-code box), while 4Front Technologies has announced
    forthcoming support for more professional digital audio boards for their commercially-available
    OSS/Linux drivers. These developments clearly indicate a continuing interest in
    Linux as a serious platform for audio and music software.


    # The Reviewer''s Testing Facility


