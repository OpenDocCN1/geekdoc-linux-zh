    a set of three knobs: The left (aqua) knob is the channel selector, the center
    (red) knob is the Master-Tempo control, and the right (red) knob is the Channel
    Tempo. Right-click on a knob to increase its value, left-click to decrease.


    The Channel Tempo is an experimental feature that permits multiple simultaneous
    tempos, but it may not always sync the audio streams correctly. Performance is
    best on CPUs faster than 266 MHz.

    The next row of sixteen knobs is the mixer section. The small tab underneath each
    knob toggles the channel mute; the knob itself controls the channel volume (right-click
    to increase, left-click to decrease).

