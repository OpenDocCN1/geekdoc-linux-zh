    +   - Three types of reverbs (Moorer, Schroeder, and multi-tap)

    - Four types of delays (stereo, modulated, multitap, multi)

    - A flanger

    - A phaser

    - Distortion

    - Four filter types (low-pass, high-pass, band-pass, band-reject)

