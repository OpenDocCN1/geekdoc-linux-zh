- pgno: 96
  md: 'You can edit the EDL in any text editor. The HTAL tags surround a list of Assets,
    Labels, Settings, and Track information, and from there the content is self-explanatory.


    # Basic Editing


    BC2''s main window is designed for synchronizing video and audio streams. Some
    of its terms and tools may confuse you at first, but once you learn the interface
    controls you''ll fly through them easily. Let''s take a closer look at the main
    window interface.


    Directly beneath the top menu bar, you see three groups of controls: the transport
    controls (for starting and stopping play and record functions), the display controls
    (for resizing the waveform x/y axes and the tracks displays), and the Fit/Label/Cut/Copy/Paste.
    The Fit button fits the entire soundfile to the main window; the Label button
    adds a marker at the current location of the cursor. Cut/Copy/Paste do just as
    they indicate.


    Beneath the control strip, you can see the time line. The end points of the time
    line serve as locators for moving the cursor quickly to the next label in the
    pointer''s direction.


    To the left of the large waveform display window, you see the track label (Audio
    1 by default) and four track controls. From left to right, these controls are
    toggles for play, edit, automation, and display. By default they are all toggled.


    At the bottom of the main window, you see five time displays indicating start
    time, selection length, end time, current cursor position, and total length.


    Close the Preferences window, then select File > Load to open an audio file. You
    will see the waveform amplitude display, along with the soundfile name and the
    edit handles (the small arrows) at the beginning and end of the file as shown
    in Figure 4-34.


    Let''s perform some simple edits on this file.


    > For-only edit sessions, turn off Settings > Align cursor on frames. Otherwise,
    the track cursor will place itself on the nearest video frame boundary instead
    of the mouse pointer location.


    An area can be selected by simply left-clicking and dragging the mouse pointer
    over the desired span. You can make extremely precise selections using the markers
    with the locators. Place two labels in your soundfile, then click on the right
    locator to position the cursor. Now hold the SHIFT key down and click on the left
    locator, and the area between your markers will be selected automatically, as
    shown in Figure 4-35.


    Now lets apply a simple effect. Select Audio • Effects ... from the menu bar,
    click on the Reverse Audio entry, and set the options for bit resolution (8, 16,
    and 24) and dithering (“smoothing”) effect, useful when lowering a selection''s
    sample rate). Figure 4-36 shows this process.'
  merge: -1
  img_proc: true
