- pgno: 120
  md: '# 6


    # THE LINUX MIDI STUDIO


    ![](img/43a9671cef617c9c7a18f7a6904433f1_120_0.png)


    # MIDI History


    In 1981, Sequential Circuits engineer Dave Smith drafted a specification for a
    digital musical instrument interface that would allow communication between synthesizers
    built by different manufacturers. This communications protocol was presented to
    and widely adopted by the various synthesizer companies such as Roland, Yamaha,
    Oberheim, and Sequential Circuits. A manufacturers consortium was organized, the
    protocol was established as a specification, and by 1985 MIDI (Musical Instrument
    Digital Interface) had become one of the most important advances in 20th-century
    music technology.


    # MIDI Advantages


    By placing inexpensive and powerful tools for composition, arrangement, and recording
    on the composer''s desktop, MIDI quickly revolutionized the music industry and
    is now a ubiquitous music technology. The MIDI interface is a standard device
    on every modern synthesizer and soundcard, and its compact file format is probably
    the most widely used format for digital music data. MIDI''s design favors keyboard
    controllers, but pitch-to-MIDI converters have made it possible to implement the
    interface on wind instruments, percussion, and even plucked and bowed string instruments.
    Its utility has spread to the'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'control of professional mixing boards, lighting consoles, signal processors,
    and recording devices as analog tape decks and hard-disk recorders.


    MIDI has a great advantage over audio formats such as WAV, MOD, or MP3 files:
    it is extremely compact, because no audio data is included in a MIDI file. Transferring
    files over a network is much faster than transferring digital audio, and the development
    of the General MIDI sound set (found on virtually every modern soundcard) ensures
    that what is heard on my system will be heard with the same sounds on my friend''s
    system (with some caveats; see below).


    # How MIDI Works


    MIDI is a simple control protocol or a convention for sending messages; it is
    not encoded sound data (i.e., it is not data of a sound wave). The MIDI protocol
    switches machine functions between on/off states and can control streams for continuous
    controllers such as MIDI volume, pitch bend, modulation, and afterthought. These
    functions and control streams are sent back and forth over a MIDI cable, in a
    digital data format called MIDI messages.


    # The MIDI Message


    A MIDI music file (also known as a sequence) is a very compact series of on/off
    messages, with no concern for what device is sending or receiving the messages.
    When a MIDI file sends a message to a MIDI instrument (instrument that can understand
    MIDI messages), the message gives the instrument instructions such as which note
    to play on what channel and with which effects. Similarly, a MIDI instrument can
    record to a MIDI file by sending messages to a MIDI recorder capable of saving
    performances in the Standard MIDI File format. Here is a brief series of MIDI
    messages, typically represented in hex (hexadecimal) numbering:


    ```

    90 3C 40

    90 3C 00

    C0 00

    ```


    The first and second messages are each three bytes long and together compose a
    note-on (first message) / note-off (second message) pair.


    The first byte (90) indicates the message status (9x, a note-on) occurring on
    channel 1 (x0). The original MIDI specification allowed transmission and reception
    on 16 channels, numbered from 0 to 15 (or 00 to 0F in hexadecimal).


    The next byte (3C) in the note-message is reserved for the value of a MIDI note-number,
    in this instance number 64 (middle C on the keyboard).'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'The last byte (40) is the attack velocity of the note-on. Velocity is sometimes
    confused with MIDI volume: Whereas velocity does relate to loudness (a hard-stroke
    note is louder than one softly played), it is also related to a sound tone color
    (the hard-stroke note sounds brighter). The velocity for the first message is
    64, almost a mezzoforte in musical terminology.


    The second message is identical to the first except for its velocity data. The
    zero value ends the sound turned on by the first message.

    The third message is a program change (instrument designator) message. Again,
    the first byte identifies the message status, this time as a program change (Cx)
    on channel 1 (x0). The second byte is the number of the requested patch (program),
    with a value of 1 (00 in hex). Note that, for these simple messages, the range
    of data values is restricted to integers (whole numbers) between 0 and 127. Other
    MIDI messages have much greater available ranges (such as pitch bend) for a more
    fine-grained resolution.


    You may notice that a single MIDI message (i.e., one of the above) does not indicate
    the duration of the note played because there is no way to predict when a player
    might hold or release a key-press. Notes are assumed active until a MIDI note-off
    message (or a note-on with a velocity value of 0) is received. In a MIDI file,
    messages are stored in the sequence of their occurrence, and duration is determined
    by the combination of note-on and note-off (or zero-value note-on) messages.


    # Step Recording


    This special method of note entry lets the user add notes to a MIDI track with
    the sequencer in record mode, but moving forward only after a note or rest has
    been entered, waiting until the next event is entered before moving forward again.
    Step recording is especially valuable to those of us with minimal keyboard skills,
    permitting the creation of complex music without the need for high-level instrumental
    ability.


    # Enhancing Your Sounds


    Following are several ways to enhance different aspects of your sounds with MIDI.


    # Velocity Value


    The velocity value of a MIDI note-on message can add a sense of liveliness and
    animation to the note played.


    # Aftertouch


    Most MIDI synthesizers respond to aftertouch, the amount of pressure placed on
    a key after the key is struck.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Continuous Controllers


    More expression can be added to MIDI data using the continuous controllers, such
    as the mod (modulation) wheel, volume pedal, and pitchbend wheel. Unlike the simple
    on/off nature of MIDI note data, continuous controllers on synthesizer keyboards
    produce streams of data that affect some aspect of the sound. For instance, the
    mod wheel typically controls the addition of a vibrato to the sound. When the
    wheel is in its bottom position, the vibrato will be set to 0, and the wheel''s
    top position will apply the maximum amount (127). Because the wheel is a continuous
    controller, the vibrato effect can be added in a smooth curve instead of an abrupt
    off/on, allowing the player to determine how much is enough.


    > NOTE Many continuous controllers can be routed to different aspects of the sound,
    exactly what can be modulated depends on the particular device. On my DX7II, the
    mod wheel not only sets the vibrato rate, but can also be routed to filter cutoff,
    letting me control the brightness of the sound while performing. Most commercial
    performance-grade synthesizers are designed to permit a broad range of effects
    controllable in real time by various wheels, pedals, and sliders.


    # System-Exclusive MIDI Messages


    A special type of MIDI system-exclusive (or sys-ex) message delivers and receives
    machine-specific data, usually to transfer synthesizer patch settings between
    synthesizers or between a computer and a synthesizer. For example, if you wanted
    to save a set of patches you designed for your MIDI synthesizer, you could initiate
    a patch data bulk dump to your computer. Later you could edit back to your synth
    with a bulk send message. You can build and save libraries of your own patches
    this way.


    System-exclusive messages also let you dynamically control a device''s parameters
    that may not be controlled by any other MIDI data format. For example, if you
    wanted to change a single parameter within one synthesizer patch, you could place
    the appropriate sys-ex message into the sequence data stream to make the adjustment
    in realtime performance.


    A sys-ex message begins with a single byte with the value of F0, followed by a
    header including the manufacturer identification number and the identity of the
    machine (or machines) that can respond to the message. The machine-specific data
    comes next, arranged in whatever manner suits the manufacturer, and the system-exclusive
    message ends with another single byte, this time with the value of F7 (remember,
    the values are in hexadecimal). Here is a simple sys-ex message:'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'And here is its breakdown:


    +   - F0 Begin sys-ex message

    - 43 Yamaha manufacturer ID

    - 10 Device number (variable)

    - 01 Parameter group/subgroup number

    - 06 Parameter number for algorithm selector

    - 00 Value for algorithm #1

    - F7 End sys-ex


    Because MIDI sys-ex message length is unconstrained, you could disrupt the MIDI
    flow during recording or playback by inserting a large sys-ex packet into a flow
    of MIDI note-ons or in the middle of a held note. Embedding sys-ex messages within
    MIDI sequences provide unique control of an instrument, but you should place the
    messages at points where the overall data flow is relatively light. When placing
    small sys-ex packets, look for inactive areas between MIDI events. A large sys-ex
    bulk send) should be placed one or more measures before the music actually begins,
    giving the sequencer time to send the entire packet without disturbing other data
    flow.


    # The General MIDI Specification


    Because the protocol (i.e., the MIDI message) doesn''t care about the actual instruments
    involved, there was originally only one way to ensure that a MIDI composition
    played with its intended sounds: The same instruments needed were used for playback
    for the composition. However, a later development standardized a set of instruments
    now known as the General MIDI (GM) specification. GM is a patch layout that has
    been agreed upon by the MIDI standards organizations. When, when I send a composition
    to a friend overseas, I can be relatively assured that she will hear it as I intended
    to be heard, as long as we are both using devices that support the GM patch set.
    Most contemporary soundcards support the General MIDI, and many external modules
    also support the layout. General MIDI isn''t a perfect solution: My friend''s
    card use the Yamaha OPL3 chip for its GM patches, whereas I use the ROM samples
    on a Sound Blaster AWE64. The difference between her Bright Piano and mine is
    remarkable, but at least I can send my file knowing she has something like a Bright
    Piano at program location #1 or a standardized drum set on MIDI channel 10.


    # Additional MIDI Specifications


    Other notable extensions to the original MIDI specification include the MIDI Sample
    Dump Standard (which provides a common format for transfer of soundfile data between
    MIDI-capable samplers), MIDI Machine Control (for remote operation of various
    studio and performance machinery, as mix-'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'ers and light-show controls), Bank Select (for soundcards and synthesizers
    with multiple banks of patch data), MIDI Time Code (for synchronizing the actions
    of MIDI-linked devices), and support for multi-port interfaces with more than
    sixteen discrete channels.


    > All MIDI-capable devices support the full set of MIDI messages. Some types of
    data may not be applicable to a device, and the manufacturer might simply ignore
    others in order to reduce costs. Most MIDI devices have a MIDI implementation
    chart that specifies the data types accepted and transmitted by the device. You
    should consult that chart to learn the particular MIDI capabilities of your instrument.


    # MIDI Software


    A plethora of software programs allows users to compose, edit, and arrange MIDI
    data on a computer. The most basic of these programs is the MIDI sequencer.


    # The MIDI Sequencer


    The MIDI sequencer, certainly the most commonly encountered MIDI software, is
    so called because it can record MIDI data as it arrives in sequence and reorganize
    the sequenced events for later playback. The sequencer provides the tools for
    quick and easy manipulation of recorded MIDI data by setting up a cycle of recording
    and editing a musical performance until it is tweaked to perfection. Indeed, the
    sequencer might be the very heart of your MIDI studio.


    # Other MIDI Software


    Other useful MIDI software packages include patch editors for synthesizers, rhythm
    composers for controlling drum machines, music notation editors, and experimental
    composition environments. Many popular sequencers for Windows and the Mac (such
    as Steinberg''s Cubase and Opcode''s Vision) have incorporated all of these functions
    into one huge package, usually including support for sequencing digital audio
    as well as MIDI data. Choosing between the large or small packages depends on
    your requirements: The large packages may provide convenience, but they may lack
    fine control of some processes; if you need fine control of a process, use a smaller
    program that specializes in that process.


    # MIDI File


    In the beginning of MIDI, the major sequencer developers saved their sequence
    data in incompatible formats, and eventually it was agreed that a file standard
    was desirable. Thus the Standard MIDI File format was born. Popularly known as
    the MIDI file, this format has enabled users of different sequencing packages
    to share compositions without the need for external converters.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Linux Support for MIDI


    -Standard kernel support for MIDI devices includes the hardware interfaces implemented
    on most soundcards (UART 6450/16550) and standalone interface cards (MIDI-only
    cards) such as the Roland MPU-401 and the Music Quest MQX16. When you compile
    a kernel with MIDI support (see Chapter 2), closely follow the configuration instructions
    and that should keep everything straight. As always, make sure your configuration
    selections actually match your hardware and be sure to have your documentation
    nearby.


    # Soundcards


    Most soundcards provide a MIDI interface as well as a MIDI-controllable synthesizer.
    If you have external MIDI devices, you can utilize the hardware port, but if the
    soundcard synth is all you have, you can still enjoy making and listening to MIDI
    music. And as we will see, some ways of using your soundcard for MIDI playback
    will obtain much better than the card''s synth will (see the profile on Midi++).


    For most desktop and small-scale studio use of MIDI, your soundcard''s port will
    work well. However, if you need services not provided by the UART mode (such as
    SMPTE time code or sixteen MIDI channels), you will require a standalone MIDI
    interface. Popular models include the Roland MPU-401, the Music Quest MQX32M,
    and the MOTU MIDI TimePiece/AV. Support for these cards vary in each driver package:
    Read the latest documentation for your selected driver to find the extent of support
    for the capabilities of your standalone interface.


    # Soundcard Drivers


    The Linux kernel source code includes a set of soundcard drivers known as OSS/Free
    (or OSS/Lite). Linux distributions (such as Red Hat or Mandrake) typically use
    the OSS/Free drivers. If your soundcard is supported and your MIDI needs are basic,
    the kernel drivers should work well for you.


    The commercially available OSS/Linux drivers from 4Front Technologies (see Chapter
    2) offer MIDI support for various soundcards as well as for a variety of standalone
    MIDI interface cards. During installation of the driver, simply select the appropriate
    card from the menu of supported cards. If desired, various options such as IRQ
    and the interface''s base address can be manually configured.


    The ALSA drivers (see Chapter 2) currently supply limited MIDI resources, but
    a very comprehensive API (applications programming interface) has been designed
    that will eventually provide powerful MIDI capability, including support for SMPTE
    time code, multi-port MIDI interfaces, and direct control of more soundcard synthesizers.
    At present, ALSA supports only a few onboard synthesizers.'
