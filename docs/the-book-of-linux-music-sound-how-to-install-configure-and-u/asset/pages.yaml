  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_168_0.png)


    database, Grip would have found it and provided a complete track list. By bringing
    together all the tools necessary for auditioning, converting, and managing CD
    and MP3 files, Grip''s flexibility and organization make it an outstanding Linux
    audio utility.


    # ## Other MP3 Software


    Support software for MP3 file creation and maintenance includes the following:


    **ID tag editors** create, edit, or delete the ID3 tags that identify MP3 files
    with the name of the song, the artist, the source, the year it was recorded, and
    a comment.


    **Renamers** rewrite ID3 tags in a batch mode, enabling quick renaming of any
    of the identification files.


    **Playlist editors** prepare lists of MP3 files in HTML and other formats, including
    SQL database formats.


    MP3tools bundle an ID3 tag reader/editor, a file information viewer, and an indexing
    utility for playlists all in one program. The tools can be run as separate applications
    from a command line, or can be accessed through a nice Perl/Tk TG GUI. Figure
    7-13 on page 146 shows MP3tools'' graphic interface in action.


    Kmp32, shown in Figure 7-14 on page 146 is an other graphic interface to MP3 file
    information and tag data.


    Kyle Smith''s Krio (Figure 7-15, page 147) is an easy-to-use interface for uploading
    and downloading files for the Diamond Rio player.'
