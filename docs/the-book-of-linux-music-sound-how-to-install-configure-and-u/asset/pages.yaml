    aumix is a command-line mixer that will run either at the Linux console or in
    an xterm window. It automatically configures itself to the capabilities of your
    soundcard and is easy to build and use. Figure 3-1 shows aumix to record from
    the microphone input channel of a Sound Blaster PCI128.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_59_0.png)


