- pgno: 36
  md: '# 2


    # SETTING UP YOUR SYSTEM


    ![](img/43a9671cef617c9c7a18f7a6904433f1_36_0.png)


    Before recording or playing any sounds with your computer, you must make sure
    that your system is prepared for audio. This chapter will help you determine what
    hardware and software you need to prepare your Linux sound system for digital
    audio as well as take you through configuring Linux for sound. After you''ve set
    up your system, the next chapter will help you install and configure some basic
    record-ing playback software and walk you through the basic recording process.


    +   For simple recording:

    Input (microphone, CD or tape player, mixing board, MIDI synthesizer) ->

    Analog-to-digital converter (soundcard inputs) ->

    Recorder (computer writes audio data to hard-disk)


    +   For simple playback:

    Playback device (computer reads audio data from hard-disk) ->

    Digital-to-analog converter (soundcard outputs) ->

    Output (mixer to amplifier to speakers, or directly to powered speakers)'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Your Budget


    How much you are willing to spend on hardware will make a big difference in your
    system''s recording and playing capabilities. You should strive to avoid compromising
    any aspect of your hardware. However, if your budget is tight, I recommend that
    you first set up a good audio playback system. A relatively slow CPU can still
    handle digital audio at lowered sampling rates (such as 32 kHz or lower), but
    your amplifier and speakers are the final link in your output chain, and they
    will ultimately determine how your music will sound. Buy the best soundcard you
    can afford and be sure to study its capabilities and how extensively it is supported
    by the available Linux drivers.


    # Hardware


    Fundamental hardware considerations include your CPU type and speed, the size
    and speed of your hard disk, the amount of memory installed, and the components
    in your audio playback system. The recommendations and advice given here will
    prove sufficient for desktop sound and small-scale project purposes. If you are
    putting together a serious music studio, then you should consult professional
    audio catalogs and other reference materials.


    # The CPU


    The Linux operating system runs on CPUs ranging from the lowest 225 MHz 386SX
    to the latest-gigahertz Athlon. Music and sound applications can make heavy demands
    on your CPU. If you plan on a MIDI-only system, any 386 or 486 will work, but
    if you want to do multitr recording or realtime sound synthesis, you should have
    at least a Pentium-class CPU—the faster the better.


    The two hardware listings presented here are the minimal and optimal systems for
    running the software profiled in this book. They are presented as guides to help
    match your budget to your purposes.


    # Minimum Requirements


    To gain the most pleasure and insight from this book, you need at least the following
    hardware:


    +   * A working Linux system, preferably on a Pentium 120 or better


    > 1 The following books are especially recommended:

    Robert E. Runstein and David Miles Huber. Modern Recording Techniques. 4th ed.
    Boston: Focal Press, 1995. ISBN: 0240830386.

    Davis, Gary and Ralph Jones (contributor). Sound Reinforcement Handbook. 2nd ed.
    Milwaukee: Hal Leonard Publishing, 1990. ISBN: 0881899008.'
  merge: -1
  img_proc: true
