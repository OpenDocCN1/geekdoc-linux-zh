  md: 'Table 10-1 is a quick profile of the realtime software synthesizers presented
    in this chapter.


    # Table 10-1: Overview of realtime software synthesizers


    | Program | Synthesis | MIDI control | Extensible? | Command-line | toolkit |

    | --- | --- | --- | --- | --- | --- |

    | aRts | Various | Yes | Yes | Yes | Qt |

    | RTSynth | Physical modeling | Yes | No | No | FLTK |

    | Quasimodulo | Various | Yes | Yes | Yes | Gtk |

    | jMax | Various | Yes | Yes | No | Java |

    | Aube | Additive synthesis | No | Yes | No | Gtk |


    Each program profiled here was tested on a rather low-end machine (a Pentium 166),
    yet response was excellent in every test.


    # aRts


    Authors: Stefan Westerfeld and Harald Lapp

    Version proved: 0.3.4

    Web site: http://linux.twc.de/arts/

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: GPL

    Capsule summary: Blends analog synthesis emulation with external MIDI control,
    provides a client/server architecture for working with concurrent aRts-compatible
    processes


    aRts (Analog Realtime Synthesizer) was inspired by the modular patching systems
    popular in the 1970s. Those machines presented the player with racks and banks
    of hardware modules, each performing a unique function, and each capable of “patching”
    (plugging a cable) into any other. A patching synthesizer has an entirely open
    interface, which means that any output can be routed to any input. aRts works
    in a similar manner; the only difference is that the physical boxes of yesterday
    are now replaced by software modules.


    # Getting It, Building It


    aRts is available on this book’s CD and from the Web site listed above. After
    downloading it, unpack the tarball with tar xzv arts-latest.tar.gz. Enter your
    new aRts directory and read the current installation instructions in the README
    and INSTALL files.


