- pgno: 8
  md: '# ACKNOWLEDGMENTS


    This book owes its existence to the support and encouragement of many people,
    some of whom may be surprised to find themselves mentioned here.


    First and foremost I want to thank Donna J. Young (my mother), and my brothers
    Scott, Bill, and Joe Phillips; they have willingly provided essential material
    and spiritual assistance whenever I needed it, which has often enough to guarantee
    them all a heavenly paradise.


    Enormous thanks go to the true Linux MIDI and sound wizards and gurus, including
    Paul Barton-Davis, Nicola Bernardi, Nick Copeland, Francois Deschelles, Fred Floberg,
    Guenter Geiger, Michael Gogins, Eric Ovyyd Hammond, Reine Jones, Richard Kent,
    Alexander Koenig, Matthias Koskinen, Michael Krause, Raslav Kysela, Paul Lansky,
    Eric Lyon, Gabriel Maldonado, Dev Mazum and Hannu Savolainen, Stefan Puxeddu,
    Juhana Sedharju, Eric Sheirer, Bill Schottaedt, Doug Scott, Per Signmond and Andreas
    Vos, Tim Thompson, Eric Tiedemann, Topper, Layer Troxler, Kai Vehmanen, Steven
    Westerfeld, and Adam Williams. They have patiently endured years of my correspondence
    (i.e., nagging) and will probably (unfortunately for them) endure many more years
    of it.


    The entire cast of contributors to the Csound mail-list has been constant inspiration,
    and I continue to learn from the whole world.


    Special thanks go to Dr. Richard Boulanger for his tutorials, his friendship,
    and his decision to include my work in his wonderful Csound Book. And I am deeply
    indebted to John fitch, maintainer of the canonical C sources, who really set
    me off on my Csound adventure when he suggested I try compiling the sources for
    Linux and then let me place the results at the main Csound repository in Bath
    UK.


    I am equally in debt to the membership of the Linux Audio Development mail-list.
    Special thanks must go to Erik Castro de Lopo, Richard W. E. Furse, John Nettmerseyer,
    David Olofson, David O''Toole, Benny Sennor, David Slomin, Eric Steffl, and (last
    but certainly not least) Paul Winkler.


    Professor Burton Beerman kindly provided me with the opportunity to evangelize
    the Linux audio course in his Music Technology course at Bowling Green State University.
    Much gratitude to him and his students, and many thanks also to his graduate assistants
    Adam Zygm and Mark Vito.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'I owe special thanks to Georg Hitsch, Matt Probst, and Kenji Yasaaka: They
    have provided mirrors for the Linux Sound and MIDI packages in Europe (http://www.linuxsound.at),
    the United States (http://sound.condorow.net), and Japan (http://www.ymo.org/linuxsound/),
    enabling easy access to the site at any time from anywhere in the world.


    Every writer needs the occasional jump-start, and I could never have written all
    the words in this book without the coffee and delightful camaraderie found at
    Elaine Bruggeman''s Main Street Delhi, down-stairs from my apartment in Finley,
    Ohio.


    Many thanks to Deb Frye and George Head, owners of the Guitar Ranch, and to my
    students for putting up with suddenly cancelled lessons and my occasional complete
    destruction.


    Thanks also to Greg Halamay and his staff at CDs and Tapes, especially Rick Clark,
    Stephen Conley, Kerry Asher (now Mrs. Kerry Morris), Jan Reichenbach, and Tony
    Ros. I doubt any other employer or crew would have tolerated my schedule or my
    general weirdness.


    Great support for this project also came from Bob Baratta, Dan and Ginny British,
    Rusty and Diane Campbell, Joshua Flechner, Fred Kiev, Kevin Lyle, Tyler McLannahan,
    Joe Routzon, Chris Spradlin, and Phil Sugden. "From each according to his ability,
    to each according to his."


    This book would never have been written at all without a fateful message from
    Bill Pollock, owner of No Starch Press. His encouragement and support of a totally
    new author has resulted in this unique book, and I hope his faith is amply rewarded.
    Great gratitude to Nick Hoff, my editor, who is now very knowledgeable about Linux
    MIDI and sound matters, and without whom my writing would have remained incomprehensible.
    Karl Jurado and Carol Lombardi guided me through the details of the finishing
    touches, Jennifer Arter ushered the book through its production stages, and Amanda
    Staub and Melissa Sherowski make sure the world learns of its existence.


    As my technical editor, Nicola Bernardini did all one man could to correct my
    frequent lapses in judgement, mistakes in expression, and errors in calculation.
    What faults remain in this book are certainly mine alone, and I owe Nicola great
    thanks for his patience and clarity.


    However, I owe him far greater thanks for a friendship that has inspired me with
    the hope that I might someday become a truly civilized man.


    Finally, deepest thanks of all to Ivy Maria: My life''s light, safe haven of my
    soul, keeps on lifting me...


    Dave Phillips

    Finlay, OH'
