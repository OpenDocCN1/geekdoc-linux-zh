    5. Save your work.


    # Setting Up for MIDI


    Now you can set up the structure to respond to incoming MIDI events:


    +   1. Replace the Synth_PLAY module with Synth_BUS_UPLINK (from the Modules •
    Synthesis Busses).


    +   2. Delete the Synth_SEQUENCER module, replace it with an Interface_MIDI_NOTE
    module (from Modules • Synthesis • Midi+Sequencing), and connect the MIDI_NOTE
    port to Synth_FREQUENCY freq ports.


    Now you need a way to specify how long your signal will be played, because there
    is no way to predict how long a player will hold a note on a MIDI keyboard (or
    other MIDI input device). The MIDI note therefore includes a port named pressed,
    indicating either 1 (pressed) or 0 (released). The Synth_PSCALE envelope will
    not work with keyboard MIDI note input (because the envelope must know how the
    note will be played), so Synth_PSCALE must be replaced by the Synth_ENVELOPE_ADSR
    module, which controls stages of the envelope


    Here''s how you do it:


    +   1. Connect the MIDI note pres (key pressed) port to the ADSR envelope act
    (activate envelope) port, then connect the sine wave outv and the ADSR inv ports.


    +   2. In the ADSR module, set atta (the envelope attack time) to 0.1, (decay
    time) to 0.2, sust (ustain level) to 0.7, and rele (release time) to 0.1. These
    values (suggested by the aArts documentation) will create a perceptible modulation
    in the amplitude of the output signal.


    +   3. Connect the ADSR outv to the Synth_BUS_UPLINK left and right ports.


    +   4. Drop a Synth_STRUCT_KILL module beneath the ADSR envelope and connect the
    read and don (done) ports. The kill module shuts off the sound when the MIDI key
    is released. By this time your structure should appear like Figure 10-9.'
