    Caps summary: Sophisticated simulation game with excellent graphics and sound


    Railroad Tycoon II (RT2) is another commercially available game from Loki Games.
    In this game, you set out to build a railroad empire and become an industry baron.
    Beginning with an initial capital outlay, you start your railway company and spend
    your money wisely (or not) to lay track, build stations, and maintain and expand
    your company interests. This type of game is often called a simulation, because
    the game play real-world developments and necessities. RT2 requires great skill
    in managing and deploying resources, with practice you too can become a virtual
    railroad tycoon.


    # ### Getting It, Building It


    As Myth2, this review is based on the free demo version of RT2 available from
    the Loki Games Web site. The package weights in at about 50 MB, if you have trouble
    retrieving it, please read the Myth2 profile for instructions on using the wget
    utility.


    Unpack the package with `tar xzvf rt2-demo.tar.gz`, enter the RT2 directory, and
    study the README file for the most recent news about the game. Because the game
    is available in binary form only, simply type in `./rt2` (while still in the RT2
    directory) to start it. The Loki splash screen will appear, followed by the startup
    menu shown in Figure 14-11.


    # ### Working on the Railroad


    If you''ve played other "sim" games, RT2 will feel quite familiar, but if you''re
    new to the genre you should work through the Tutorial. Select Load Scenario from
    the startup menu and click on the Tutorial. This scenario presents an 1870s English
    landscape in which you will connect the various towns and villages, gradually
    expanding the reach of your new railroad. Because building the railroad depletes
    your cash, you must deliver and manage services to generate revenue in order to
    keep expanding. The basic procedure is to lay track, add stations, buy trains,
    and then provide transportation and other services to increase your total wealth.
    Figure 14-12 shows a look at the tutorial scenario.


    The tutorial will walk you through the various aspects of game play, as founding
    your company and building your railways. The game itself is very'
