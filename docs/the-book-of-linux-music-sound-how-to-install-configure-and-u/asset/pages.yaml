    # Kwave


    +   - Author: Martin Wilt

    - Version profiled: 0.29.7

    - Web site: http://fs.spinfo.uni-koeln.de/~kwave/

    - FTP site: n/a

    - Maintained: No

    - Availability: Free, open-source

    - License: GPL


    Capsule summary: Graphic additive synthesizer, fast graphic envelope editing,

    good basic editor


    Kwave is a newer editor based on the Qt GUI and the KDE libraries. It presents

    a modern interface that takes advantage of Qt''s graphics and Linux threads,

    presenting the possibility of interactive editing.


    # Getting It, Building It


    If your Linux distribution bundles the Qt GUI toolkit and the KDE desktop

    environment and its development packages, you should be able to compile

    Kwave by the by-now familiar command sequence of /.configure, to make,

    then make install.


    If not, you will need to acquire the Qt and KDE development packages

    b you can build Kwave. You don''t need the entire KDE desktop environ-

    mentment, only the development libraries and headers (complete instructions for

    these components are included with the packages).


    Qt is available from www.trolltech.com, and KDE is available from

    www.kde.org.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Using Kwave


    Kwave''s waveform display occupies the bulk of the main window, with a continuously
    updated status display across the bottom.


    # Editing Tools


    Kwave''s feature list is impressive. It is capable of


    +   - Importing ASCII text files and converting them to WAV format (and vice versa)


    +   - Calculating a variety of generated sounds (besides the additive synthesis
    it create silence, noise, or a pulse train)


    +   - Undoing your mistakes with the Revert function


    Upon opening, Kwave offers few amenities—as shown in Figure 4-27.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_89_0.png)


    Figure 4-27: Kwave opening screen


    However, when a soundfile has been loaded, the top menu expands, as shown in Figure
    4-28.

    Kwave makes excellent use of the Qt graphics toolkit. Figure 4-29 shows an example
    from the Create item under the Fx-Filters menu. The soundfile seen in Figure 4-28
    has been normalized (its overall volume has been maximized relative to the sound''s
    peak volume) and the Create Filter window is open for tweaking.


    The graph updates in realtime as the sliders are moved, giving immediate visual
    feedback to the filter design.'
