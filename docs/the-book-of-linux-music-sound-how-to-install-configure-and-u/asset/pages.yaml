- pgno: 435
  md: '$59.95 ($61.95 Cdn)

    shelve in: LINUX/OPERATING SYSTEMS


    # LINUX NEVER

    SOUNDED BETTER!


    # LINUX

    JOURNAL

    PRESS


    ![](img/43a9671cef617c9c7a18f7a6904433f1_435_0.png)


    Linux Music & Sound is an in-depth introduction to recording, storing, playing,
    and editing music and sound on a Linux system. You''ll learn all about digital
    audio, the hardware you need, and how to optimally configure Linux for sound.
    In addition, musician/programmer Dave Phillips de-vviews dozens of Linux music
    and sound applications and presents his top picks. You''ll learn how to:


    > ". ..an amazingly comprehensive overview of Linux audio software, the ultimate
    linux-audio-softwarehowto."

    —Bill Schstadt, Composer and Programmer working at the Center for Computer Research
    in Music and Acoustics (CCRMA), Stanford


    +   - Record, with mid, and adds effects to tracks


    +   - Work with Mod, MIDI, and MP3 files


    +   - Do hard-disk multi-track recording


    +   - Use realtime synthesizers and software sound synthesis programs like Csound


    +   - Produce high-quality scores with music notation programs


    +   - Share sound resources over a network—even broadcast live over the Internet!


    The CD-ROM contains most software packages discussed in the book and over a hundred
    extras, including MIDI applications, digital audio and music notation software,
    and utilities.


    # ABOUT THE AUTHOR


    Dave Phillips maintains the "Sound & MIDI Software for Linux" site (http://www.bright.net/-dlphill/linuxusound/)
    and has been a performing musician for over 30 years. He is an expert in MIDI,
    Csound, and Linux, and maintains several educational Web sites on these topics.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_435_1.png)


