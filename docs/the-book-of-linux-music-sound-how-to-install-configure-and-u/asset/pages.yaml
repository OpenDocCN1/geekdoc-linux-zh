    # Getting It, Building It


    BC2 is available in source code and as a "trial" binary. The author suggests downloading
    the binary and testing it on your system before you decide to retrieve the sources
    and build it yourself. If you decide to build your own binary, download the latest
    source package from the BC2 Web site, unpack it in your /home/directory, and enter
