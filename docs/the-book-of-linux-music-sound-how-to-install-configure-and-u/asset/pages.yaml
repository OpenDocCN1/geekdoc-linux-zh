  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_186_0.png)


    # # Summary


    Its program documentation is brief, but Multitrack is very easy to learn and operate.
    Its X interface is clean and uncluttered, and Multitrack is the only Linux hard-disk
    recorder with a mouse-operated Super VGA interface for users who prefer working
    without X. If you need a simple recording and mixing system for up to sixteen
    tracks of audio, Multitrack is just what you''re looking for.


    # # Mix


    Author: Oyvind Hammer, Linux version by Guenter Geiger

    Version profiled: 0.56

    Web site: http://gige.xdv.org/mix.html

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: GPL


    Capsule summary: Best suited for arranging pre-recorded soundfiles into complex
    mixes


    The Linux version of Mix is a powerful program that allows you to combine different
    soundfiles and file formats into one. Mix accepts WAV, AIFF, and AIFC formats,
    all of which can be freely mingled throughout the tracks. Mix will also let you
    put mono and stereo files in the same track—even in the'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'same space on a track. You can mix all these file types up to nine channels,
    and each channel has its own volume control, mute and solo toggles, and slider
    to resize the waveform display. Graphic displays of the channel volume, panning,
    and auxiliary curves can also be toggled.


    Mix''s processors include echo, chorus, ring modulation, filters (lowpass, highpass,
    bandpass, and bandstop), reverb, compression, and an octave divider. Most of the
    effects have parameter value sliders that can be adjusted in realtime playback.
    And, thanks to Guenter Geiger, the effects are not separate plug-ins.


    NOTE


    The applications programming interface for Mix plug-ins is still under development,
    but the code is open-source, and the specification is straightforward and effective.


    # Getting It, Building It


    The latest version of Mix for Linux is available from Guenter Geiger''s Mix page
    on the Web. The package is source-only, but building Mix is easy. It requires
    either Motif 1.2 or the equivalent libraries (available from LessT group at www.lesstif.org).
    After unpacking the mix-latest.tar.gz file, you will need only run /config, make,
    and (as root) make install in the Mix directory.


    Give special attention to the Mix resource file: From you can specify various
    helper applications that will be called during a Mix session, such as your preferred
    soundfile editor and your browser of choice for reading the HTML help files. Many
    details of the program''s appearance can be customized in the resource file, including
    button placement, scrollbar implementation, screen size, and colors.


    # Loading and Recording Files


    You can begin a session in Mix by opening the File menu and loading existing soundfiles
    into arbitrary positions anywhere in the nine tracks or by choosing Record from
    the Settings menu.


    # Loading Files


    Figure 8-17, illustrating the first method, shows Mix with the Add Soundfile box
    open and loading files.


    Track number and start time are selectable, and a play button lets you hear your
    samples before placing them in a track. After selecting your sounds, click Cancel
    in the selector box to close your loading process, and you should see something
    like Figure 8-18.


    # Recording Files


    To record directly into Mix, open the Settings menu and select Record. Figure
    8-19 on page 166 shows the Record File window opened and set to record a'
  merge: -1
  img_proc: true
