- pgno: 212
  md: 'Cecilia is a user-friendly and complete front-end for Cound. It provides a
    graphic interface for every aspect of Cound, including ocr/sco composition, the
    analysis utilities, documentation, and the command-line options. The interface
    includes a user-programmable graph for drawing control curves with the mouse.
    The system also contains its one scoring, called Cybil. Cecilia is highly interactive,
    capable of realtime performance, and a complete environment for computer music
    composition and sound design. Although the program utilizes Cound as its rendering
    engine, no knowledge of Cound is needed to use Cecilia. It''s a comprehensive,
    powerful tool that I highly recommend.


    # Getting It, Building It


    Retrieve the latest Cecilia package from the Web site listed above. Unpack it
    in your /home directory with tar xzvf cecilia-latest.tar.gz. Move into the Cecilia
    directory and run the installation script. As root, ./install.sh at the command
    prompt and the installation will proceed automatically. When it''s finished, type
    cecilia in an xterm window to start the program.


    # Setting It Up


    When Cecilia opens, you will see its attractive splash screen with a loading status
    at the bottom of the window. When the program components have loaded, the splash
    screen will disappear, leaving Cecilia''s main window open. This window contains
    various global settings, including output choice (direct to soundcard or write
    to disk), output file name, Cound file header values (sample rate, control rate,
    number of samples per control pass, number of channels, Cound GEN function table
    size), and compilation controls. The menus at the top provide file management,
    the full range of Cound command-line options, access to the Cound analysis utilities,
    and a manager for Cecilia''s windows.


    To begin your acquaintance with Cecilia, open File ● Preferences and edit the
    information in the Preferences window. Figure 9-4 shows the default main window
    and my preferences.


    Be sure to indicate the correct path to the Cound binary. If you have set the
    Cound environment variables SSDIR (location for soundfile input), SFDIR (location
    for soundfile output), and SADIR (location for analysis files) you can pass those
    to Cecilia by pressing the sync to env button (at the far right of Figure 9-4).
    You can also choose a new color scheme and assignment shortcuts for the playback
    controls. When you are satisfied with your selections, press OK. You are now ready
    to open a Cecilia module.


    # The Cecilia Module


    In Cecilia, a "module" includes the general settings in the main window, the components
    of the grapher window (if a GUI is used by the module), and a text editor for
    creating instruments and score specifications.'
  merge: -1
  img_proc: true
