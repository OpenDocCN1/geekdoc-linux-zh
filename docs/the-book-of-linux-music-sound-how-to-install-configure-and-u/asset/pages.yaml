    # Realtime Effects Processing in RTcmix


    This final example demonstrates a delay effects processor applied to a realtime
    audio stream read from the csound''s microphone input:


    ```

    /* rt_delay.sco */

    load("DELAY") /* load libDELAY.sco */

    rtsetparams(44100, 1, 64, 1) /* set realtime parameters: sampling rate, channels,
    buffer

    size, ? */

    rtinput("AUDIO") /* tell the scheduler where the input comes from /

    makegen(1, 24, 1000, 0.0, 0.5, 3.5, 1, 7,0) /* apply amplitude envelope to output
    *

    DELAY(0, 0, 7, 0.7,.14, 0.7, 3.5) /* apply effect to input signal */

    ```


    This score is run with this command sequence:


    ```

    CMIX < rt_delay.sco

    ```


    The realtime response is quite good even on a P166. Faster machines should perform
    more complex processing.


    # The Future of RTcmix


    Although the Cmix community is small compared to the Csound user base, it is an
    active group dedicated to improving the power and presentation of the language.
    Dave Topper has generously donated his time and energy to maintaining the Linux
    version of RTcmix, and he hopes to improve it continuously. With the availability
    of graphic user interfaces for it, I expect Cmix''s popularity to grow.


    # Other Languages


    With its UNIX lineage, Linux inherited a rich tradition of academic music and
    sound software. Csound and Cmix are only two of the many software sound synthesis
    languages available for Linux; others include Common LISP Music, SAOL, Nyquist,
    and Music4C. Many of these languages expand upon the MusicN series of computer
    music technologies, but new approaches have come into use, such as the composition
    of audio processing classes for direct use with the C++ programming language.'
