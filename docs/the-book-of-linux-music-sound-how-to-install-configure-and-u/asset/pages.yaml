  md: 'need to know is that a mix file saves all the specifications of a mix in a
    standard text document.


    The File menu also provides the rather important option to write the mix to disk
    as a stereo soundfile. Use this option when you''re satisfied with a mix and want
    to save it as finished piece.


    The Refresh option replays the screen to remove any Artifacts.


    # Edit


    The Edit menu offers only a few basic operations: The familiar cut/copy/paste
    actions are provided, along with Insert and Undo functions. This selection of
    edit functions might seem embarrassingly meager, but remember, that by left-clicking
    on a sound graphic, you can call your preferred soundfile editor to perform more
    detailed and extensive edits.


    # Settings


    We have already looked at the Record File dialog available from the Settings menu
    in Figure 8-19. Figure 8-21 shows the dialog windows for the Audio, Time, and
    Display settings.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_192_0.png)


    Figure 8-21: Audio, Time, and Display settings dialog boxes


    The Time dialog lets the user select whether the time will be displayed as seconds
    or beats. When represented as beats, a tempo and beats per bar can be indicated.
    These settings are especially important when using the Time Machine in the Tools
    menu.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'The Internet Slaves option on the Settings Menu is not yet working under Linux.
    Check the Mix Web site for updates on Mix''s capabilities.


    # Effects


    Mix''s effects include chorus, compression, echo, filter, harmonizer, octave divider,
    reverb, and ring modulation. Although the list sounds extensive, Figure 8-22 shows
    that parameter control is not exactly fine (though efforts are being made to improve
    Mix''s effects).


    ![](img/43a9671cef617c9c7a18f7a6904433f1_193_0.png)


    Figure 8-22: Parameter control for Mix''s effects


    You can adjust the effects in realtime. Simply leave the Effects window open,
    start playback, and adjust the effects from the panel. Note that, to adjust effects
    in realtime, each channel in "Aux” graph (including the Master track at the bottom
    of the track display) must be turned on and dragged to maximum level.


    Guenter Geiger has created a programming interface for Mix that allows effects
    devices to be used as loadable software modules (plug-ins). Because Linux Mix
    is an open-source GPL project, Guenter''s API is free for use by any Linux audio
    software developer.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Tools


    The Tools menu calls the Time Machine and Sounds Overview internal helpers and
    also links Mix to the external helpers specified in the Mix resource file (the
    Mix.ad file, which make install will place as "Mix" in your /usr/X11R6/lib/X11/app-defaults
    directory). Figure 8-23 displays the Time Machine and Sounds Overview dialogs
    and Figure 8-24 shows the AIFF soundfile player Airplay, the soundfile editor
    Snd, and the file format converter Xox all being used under Mix.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_194_0.png)


    The Time Machine is a powerful tool that works in coordination with the Time options
    in the Settings menu. It lets you quantize (place on a preferred beat) soundfile
    start times from whole-note to sixteenth-note precision, auto-quantize, and expand
    or contract the entire mix time by the “Multiple times” value.


    The Sounds Overview box details the names of all the files included in the mix,
    their start and stop times, and their track assignments. All of this information
    can be edited, with the exception of the file names and paths. Add a file to the
    list of grouped files (the highlighted files in the Sounds Overview window), hold
    the SHIFT key while left-clicking on a file name in the Overview box. Other options
    in the Tools menu will eventually include the following functions, but they are
    not yet fully operable. The Write to PostScript function will write a PostScript
    graphic file depicting the layout of the mix, but at the time of this'
  merge: -1
  img_proc: true
- pgno: 195
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_195_0.png)


    writing it is not working correctly. The 3D Viewer option calls another external
    helper, in this case "view" from the Apprentice for Linux package, to display
    a three-dimensional view of the mix in the SGI Inventor format. As of this writing,
    the 3D Viewer displays an image, but it is not accurate.


    # Variables


    The Variables menu enables drop-in values for effects and other parameters to
    be placed anywhere within a mix. For instance, a dramatic increase in reverb time
    can be achieved simply by placing the appropriate variable value wherever needed.


    Figure 8-25 shows a track with four variables already inserted along the waveform;
    the parameter values window is opened for a fourth object (the Variables are numbered
    from 0). In this instance, a reverb effect is applied at 72% strength at 14.18
    seconds into the track.


    In the Variables Overview window (shown in Figure 8-26) you can delete or duplicate
    the variable object, redefine its insertion point and track number, and edit its
    parameter value.


    # Graph


    The Graph menu lets you delete volume, aux, and pan nodes (the small squares for
    adjusting graph levels) from existing graphs. It also provides a list of nodes
    for a selected graph, as seen in Figure 8-27 on page 174 (the Pan control nodes
    for Track 3). Nodes can be deleted by erasing them from the list, or simply clicking
    on the node and pressing the DELETE key.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_196_0.png)


    Figure 8-25: Using variables to modify a track


    ![](img/43a9671cef617c9c7a18f7a6904433f1_196_1.png)


    Figure 8-26: The Variables Overview window


    # Group


    Grouping lets you drag an entire mix as one file (by choosing Group All), retaining
    the relative start and end times of each file in the mix. You can make a group
    using selected sounds from a mix or add sounds to an already existing group at
    any time by simply holding the SHIFT key and clicking the mouse button on the
    desired sounds’ graphic representations. The Group menu also lets you delete or
    duplicate grouped sounds and then mute the affected tracks. If necessary, you
    can ungroup grouped sounds from this menu too.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_197_0.png)


    # Final Words on Mix


    In true Linux fashion, Mix has been worked on by several developers, and I expect
    the "committee method" will continue to work for Linux Mix. Perhaps by now Mix
    already has such amenities as Region edits and improved effects processing. But
    don''t let its few drawbacks discourage you from using Mix: It is usable right
    now, and is an excellent tool for composers, arrangers, and researchers working
    with sound and Linux.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# SOFTWARE SOUND SYNTHESIS


    Some of the finest Linux audio and music applications come under the rubric of
    software sound synthesis (SWSS), a method for the manipulation of sound using
    a programming language (sometimes called a “waveform compiler”) and a computer.
    Audio synthesis and processing languages let you create, edit, analyze, and resynthesize
    sounds by providing language elements, or opcodes, for working with digital audio
    (such as Csound''s sound generating and processing opcodes). Examples of SWSS
    include computer music stalwarts such as Csound, Cmix, and Common LISP Music,
    as well as newer developments like Craig Stuart Sapp''s Sig++ and the SAOL project
    led by Eric Scheirer. Graphic interfaces sound design and composition environments
    such as Cecilia (from Jean Piche and Alexandre Burton), the Atelier Planck group''s
    HPKComposer, and Michael Gogins'' Silence. All of these programs are profiled
    in this chapter, making it easily the largest chapter in the book. (Realtime software
    synthesizers such as aRT, Quasimodo, and RTSynth constitute their own class of
    Linux sound and music software, so I have dedicated a separate chapter to them:
    See Chapter 10.)


    # Warning: Brainwaves Required!


    SWSS is an advanced topic in digital audio. If you are not a programmer, much
    of what follows may seem incomprehensible. Learning a software synthesis'
  merge: -1
  img_proc: true
