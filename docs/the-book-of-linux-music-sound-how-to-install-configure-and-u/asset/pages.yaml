    SoX (SoundXchange) is a venerable Linux audio tool, especially useful for good-quality
    resampling (changing the soundfile sample rate), file-format conversion (such
    as WAV to AIFF), and handy effects. Converting a soundfile to another format is
    very easy with SoX: all you need is testrec.wav testrec.aif for a simple conversion
    of the file testrec from WAV to AIFF.


