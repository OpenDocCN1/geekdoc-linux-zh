    # Getting It, Building It


    terminatorX requires the GTK libraries and header files found in most Linux distributions.
    If your GTK installation is out of date or if you do not have installed all, you
    can retrieve the latest package from www.gtk.org.


    After downloading the latest version of terminatorX from its Web site, pack the
    package in /home or /usr/local/ directory and unpack it with tar xzv terminatorx-latest.tar.gz.
    Move into the terminator-latest directory and read the installation instructions.
    The build process is a straight-forward ./configure, make, and (as root user)
    make install. Type terminatorX in an xterm window, and the program will open to
