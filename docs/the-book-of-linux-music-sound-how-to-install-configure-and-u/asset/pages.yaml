- pgno: 67
  md: 'Use of the various editors is straightforward. The following reviews will concentrate
    on the unique and important features of the different editors rather than give
    step-by-step instructions for their basic functions.


    # DAP


    Author: Richard Kent

    Version profiled: 2.0.2

    Web site: http://www.cee.hw.ac.uk/~richardk/

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: GPL


    Capsule summary: Large assortment of processing modules, handy looping tools for
    AIFF and WAV files, most extensive editing suite


    Richard Kent''s Digital Audio Processor (DAP) for UNIX is an outstanding application,
    providing a full complement of basic and advanced file editing and signal processing
    tools. Based on the Xforms cross-platform GUI toolkit, DAP is available in source
    code and binaries for SGI computers and the IRI operating system, Sun, Solaris,
    and Linux. Soundfile editors depend heavily on the capabilities of their GUI toolkit,
    and Richard has used the Xforms capabilities to their fullest. DAP''s somewhat
    unusual interface is logically organized for quick access and ease of use.


    # Getting It, Building It


    DAP is available as a pre-built binary or in a source package. If you retrieve
    the binary, you need only place it somewhere in your system''s PATH statement
    and you''re good to go. Building DAP is a little more work: You''ll need the Xforms
    development package and an up-to-date C++ compiler. Both are easy to obtain: The
    compiler should be standard in every contemporary Linux distribution, and the
    Xforms package is available for free from http://bright.physys.uwm.edu/xforms.
    If you have the right tools in the right places, you need only follow Richard''s
    instructions to build DAP on your own machine.


    # Using DAP


    DAP''s main window displays the soundfile''s waveform. Clicking on the Edit button
    (on the right of the top menu bar) will call up a sample-level display in the
    main window; in this mode editing can be performed with single-sample accuracy,
    on any single point of the soundfile data. You can use the mouse as a drawing
    tool during (and only during) an Edit session. The DSP (digital signal processing)
    button (next to the Edit button) opens a window of effects (all listed in "Special
    Effects" below) that can be applied to the waveform.'
  merge: -1
  img_proc: true
