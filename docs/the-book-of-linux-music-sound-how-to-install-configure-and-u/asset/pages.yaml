    # # Mod Conversion Tools


    You may choose among several useful conversion utilities to work with mod files.
    The mod2text and text2mod tools, for convert Amiga Protracker modules (files with
    the MOD extension) to and from a text file. The author of these tools has remarked
    that they essentially let you “turn Emacs into a tracker!” If you want to convert
