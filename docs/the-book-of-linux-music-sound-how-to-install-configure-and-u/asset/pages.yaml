    # RTSynth


    Author: Stefan Nitschke

    Version profiled: 1.6.2b

    Web site: http://www.vtourist.com/rtsynth/

    FTP site: n/a

    Maintained: Yes

    Availability: Free, binary-only

    License: Held by the author


    Capsule summary: Excellent visual interface to physical modeling synthesizer,
    supports external control via MIDI keyboard or concurrently running MIDI sequencer


    RTSynth consists of two synthesis engines, one for polyphonic string sounds (including
    plucked strings) and one for monphonic flute (or other blown instrument) sounds.
    The effects panel offers realtime control over parameters for distortion, filtering,
    resonators, reverb, and delay. With its internal processing in 32-bit floating
    point numbers, RTSynth produces very high-quality synthesized sounds and effects.


    RTSynth uses the synthesis methodology known as physical modeling.

    Unlike other synthesis methods, physical modeling does not combine or filter modulate
    waveforms to create its sound: Instead it controls over the physical properties
    of an instrument, such as string or tube length, as well as controls for aspects
    of its playing technique, such as bow pressure or plucking point.


    Physical modeling can be confusing to sound designers familiar with the older
    synthesis strategies, because getting a good sound with physical modeling requires
    some knowledge of an instrument''s physical and performance properties. RTSynth
    provides a simple, effective interface for experimenting with those properties.


    # Getting It, Building It


    Retrieve the RTSynth package from this book''s CD or from the RTSynth Web site
    and unpack it with tar xzvf rynth-latest.tar.gz. To install the program, simply
    copy or soft-link the binary anywhere you prefer. /usr/local/bin is a good choice.
    However, you should first set ownership permission for the program. For best performance,
    set RTSynth to root user identity with chown root RTSynth; chmod +s RTSynth (you
    may need to become the root user to make this change). Now the program will use
    the realtime scheduler'
