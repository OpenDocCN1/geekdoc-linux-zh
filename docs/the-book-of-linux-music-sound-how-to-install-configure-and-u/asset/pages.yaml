  md: 'sfront''s author has included a Makefile with each example to automate the
    process, so it is necessary only to make type in any of the example to create
    the output.wav file.


    After creating output.wav, you can play and edit it with WAV-compatible audio
    software.


    # Where It''s Going


    SAOL continues to evolve under the watchful supervision of Eric Scheirer, and
    its importance will grow as audio software programmers and hardware manufacturers
    adopt the MPEG-4 specification.


    Computer musicians are increasingly attracted to SAOL''s orchestra language, and
    its support for modern programming techniques, and tools such as sfront increase
    SAOL''s efficiency even more. I have only recently begun to work with SAOL and
    sfront, but I do not hesitate to recommend them to anyone who wants to take a
    look at and work with the next generation of synthesis software for Linux.


    # Recommendations


    All of the systems profiled and reviewed here have their unique values. Csound
    is certainly richest in opcodes, and its user base is very large. It also has
    the most helper applications. I recommend it to anyone wanting to learn more about
    synthesis methodologies and digital signal processing. If you are interested in
    using more modern language styles, then I would steer you to Cmix and RTcmix.
    RTcmix also has the best realtime response of the systems I''ve used, though Csound
    isn''t far behind. C++ programmers will find lots to like in Sig++. SAOL and sfront
    are indicators of the "cutting edge" of SWSS languages.'
