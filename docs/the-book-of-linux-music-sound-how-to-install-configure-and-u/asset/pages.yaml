    ![](img/43a9671cef617c9c7a18f7a6904433f1_94_1.png)


    Figure 4-33: Waveform display and asset manager windows


    Figure 4-33 shows the asset manager for the project below, with the Get Info panel
    opened for the edited edition (bc-temp.wav).

    When you select File • Save or File • Save As, you will be saving the EDL. This
    point is very important: You are not saving soundfile data with those save functions,
    you are saving a text file composed in BC2''s Hypertext Audio Language (HTAL).


    > WARNING Don''t make the mistake of giving your saved EDL file the same name
    as your soundfile: It is not a soundfile and you will overwrite your sound data!'
