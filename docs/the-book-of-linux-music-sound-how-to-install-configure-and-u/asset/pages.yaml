    Figure 10-11: RTSynth and its default tiles


    The tiles are connected by left-clicking an output tab (shown as a white arrow)
    and dragging a connector line to an input tab. The synthesis tiles have only output
    tabs, whereas the Effects tile has both input and output tabs. Right-click anywhere
    on the Effects tile, and a menu will pop up. Select Open, and the panel shown
    in Figure 10-12 will appear.


    Close the Effects panel, double-click on the String and Flute tiles to view your
    parameter displays. Figures 10-13 and 10-14 show the string and flute synthesizer
