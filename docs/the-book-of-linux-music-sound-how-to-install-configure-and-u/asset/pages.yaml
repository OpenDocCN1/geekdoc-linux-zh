    6. Speak into the microphone. When you''re finished, press s or the space bar
    to stop yarec.


    You should now have a file named testrec.wav residing in your current directory.
    Press P to play it.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_62_0.png)


    Figure 3-3: aimix and yarec set for a basic recording


    # General Audio Tools


    The utilities presented in this section are essential tools for working with audio
    files. SoX, for instance, is often referred to as the “Swiss Army knife” of Linux
    sound tools, doing everything from recording and playback to conversion to adding
    simple special effects. Other utilities are more specialized, and you will certainly
    want one or more of the following in your audio toolkit.'
