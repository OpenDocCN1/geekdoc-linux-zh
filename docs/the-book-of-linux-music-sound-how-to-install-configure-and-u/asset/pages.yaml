- pgno: 145
  md: 'ure utility and step through the configuration sequence, selecting your default
    synth device (external, OPL3, AWE 32/64, Gravis Ultrasound) and MIDI output device
    (if more than one exists). Run make (as root, course) make install, and if all
    goes well you will have a fresh binary of playmidi to play your MIDI files. If
    your system has the Xaw libraries (also called the Athena widget set), then the
    compile process will also build xplaymidi, a simple-X interface for playmidi.


    # Using playmidi


    Here''s an example of a playmidi command sequence:


    ```

    playmidi -e /dev/midi -p 63 -r -V 75 myfoo.mid

    ```


    This command enables a realtime display of MIDI activity, sets the play-back volume,
    and sends a program change message (63) and the file data (myfoo.mid) to an external
    synthesizer connected to the default MIDI interface (/dev/midi/). With the appropriate
    hardware, even more complex commands can be prepared for file play and synthesizer
    control.


    Here is a more elaborate command for playback with a Sound Blaster AWE64:


    ```

    playmidi -a -p 1,44 -R 48 -C 24 -V 1,80 -r myfoo.mid

    ```


    where -a tells playmidi to use the AWE32/64 internal synthesizer and -p sends
    a General MIDI patch number (41) to it on MIDI channel 1. -R sets an initial reverb
    value, -C sets an initial value for a chorus effect, and -V sets the volume for
    MIDI channel 1. Reverb, chorus, and volume each have a range of values from 0
    to 127. The -r activates a realtime display of MIDI activity: Instru-


