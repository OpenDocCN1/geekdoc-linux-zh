  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_119_0.png)


    # MikMod and the Linux Demo Scene


    Because the MikMod library is central to many Linux and multimedia projects (including
    the ClanLib, Crystal Space, and MAM graphics/gaming projects) and is easily integrated
    into other applications, it has become the sound engine of choice for many Linux
    demo artists. A demo, or demonstration program, shows off some neat graphics or
    animation with text and music. The demo scene is mainly populated by Amiga users
    and DOS hackers, but some very good demos exist for UNIX/Linux. I have included
    some examples on this book''s CD. Check them out—they show how Linux can be a
    powerful multimedia presentation platform. And be sure to visit the Linux Demo
    Scene site (http://linux.scene.org) for up-to-date news of demo-related events
    as well as links to tools, utilities, and documentation.


    # Learning More about Things Mod


    Interested readers should check out all Internet resources in this chapter. The
    United Trackers page (www.united-trackers.org) is an excellent guide to finding
    trackers and players, sample archives, links to Mod Collections (an incredible
    number of modules are available over the Internet), and tutorials. You may also
    want to keep up with the alt.binaries.sounds.mods and alt.binaries.sounds.mods.techno
    newsgroups, where many independent musicians post their creations, questions,
