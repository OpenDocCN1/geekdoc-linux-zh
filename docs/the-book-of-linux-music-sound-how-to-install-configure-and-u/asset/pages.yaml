  md: 'shout localhost -P itsme -p /home/soundfiles/MP3/playlist -l g -n "Your Icecast
    Show"


    With this command, shout uses the Linux network loopback device (localhost) to
    connect to localhost with the password itsme (set in icecast.conf), stream the
    files listed in the /home/soundfiles/MP3/playlist file, loop the playlist, identify
    the genre of music as various, and name the broadcast by My Icecast Show. You
    can now listen to the Icecast stream by running mpg123 http://localhost.localdomain:8000
    or xmms http://localhost.localdomain:8000. Figure 12-3 displays the Icecast session
    described above with the client.


