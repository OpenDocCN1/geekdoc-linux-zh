  md: 'use. Whether you''re a seasoned pro or a complete newbie to tracking, Sound-Tracker
    is the tool you need to create your own Mod masterpieces in Linux.

    After you''ve composed or collected some Mods, you might want to show them off
    to your friends. You could open your files by one in SoundTracker, but Soundtrack
    is optimized as a Mod tracker, and its file support is limited to MOD and XM formats.
    A Mod player is a playback-only application, providing amenities such as support
    for playlists and a wide variety of mod file formats. In the next section we''ll
    look at MikMod, my mod player of choice.


    # The Player: MikMod


    +   **Authors:** Jean-Paul Mikkers, Steve McIntyre, Peter Amstutz, Miodrag Vallat,
    others

    **Version profiled:** 3.1.6

    **Web site:** http://mikmod.darkorb.net/index.html

    **FTP site:** n/a

    **Maintained:** Yes

    **Availability:** Free, open-source

    **License:** GPL


    MikMod is a powerful yet straightforward command-line Mod player that requires
    only a Linux console and an audio-ready system. Originally a project designed
    by one man (Jean-Paul Mikkers), MikMod has evolved into a distributed project
    with code contributed by programmers around the world, and it is now included
    in every major Linux distribution. MikMod is heartily recommended: It supports
    a wide variety of module file formats, several graphic interfaces are available
    for it, and it is in continuous development and maintenance.


    # Getting It, Building It


    MikMod is easy to build and install from sources, requiring only running the X
    window system (a screen manipulation library for displays) and C libraries included
    in each Linux distribution. Versions of MikMod with GUIs (see Figure 5-9 on page
    96) will of course require their own libraries and headers (each package''s installation
    instructions for details of obtaining the necessary interface toolkits).


    After retrieving the latest source package from the MikMod Web site, unpack it
    by typing `tar xvzf mikmod-latest-tar.gz`. A directory will be created containing
    the source code and documentation: Be sure to read the docs for any late-breaking
    news about the compilation process!


    Switch into your new MikMod directory and type `./configure --help` to see what
    options are available during the configuration process, and then type `./configure`
    (including any selected options) to create the Makefile needed to build the program.
    Then just type `make` and grab a cup of coffee while the build process finishes.
    If no errors are reported, enter `su root` to become super, type `make install`,
    and your new version of MikMod is now ready to use.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Using MikMod


    To play a Mod file with MikMod you only type mikmod my_song.xm (substituting your
    song name and its appropriate Mod extension) and the program will do the rest.
    The command mikmod -h displays the available options, which include:


    +   - Device selection


    +   - Panning, reverb, and volume effects


    +   - Output to mono and/or 8-bit resolution


    +   - Support for playlists, including random selection


    Figure 5-6 shows makes the Help options, Figure 5-7 shows MikMod''s Configuration
    menu, and Figure 5-8 lists the samples/instruments used in the XM module. (The
    screen shots in this section were all captured while running MikMod in an xterm
    window and playing the example Mod file from this book''s CD.)


    MikMod makes good use of curses, and, as noted earlier, it is also available in
    versions for Gtk, Java, Qt, and XForms. The Java version is a commandline application
    that does not use of the Java graphic user interface classes. However, in Figure
    5-9 on page 96 you can see MikMod in its glorious GUI incarnations as KMikMod
    (Qt), Mod4XWin (XForms), and GtkMikMod. Note that the playlists indicate MikMod''s
    versatility with Mod file formats—they can freely combine any of the supported
    file types.


