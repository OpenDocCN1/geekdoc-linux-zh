    // Bass played at three sizes


    ```

    template <bass, twicebass, halfbass> ()

    map <factor, size> with {<1, 110848>, <2, 2*110848+1>, <0.5, 55424> {

    imports exports table bass;

    table newbass(empty,size);

    speed(bass,newbass,factor);

    output(0.4*oscil(newbass));

    }

    ```


    In this example you can see some similarity to Csound code, particularly in the
    header statement and its use of pre-filled function tables. However, the differences
    are striking. The SAOL language supports modern programming models, including
    support for templates, arrays, conditional tests, and more.

    Running sfront -o sa.c -orc speedt.will create sa.c (the default name for the
    C code produced by sfront). sa.c -o can then be compiled into the sa binary by
    running gcc -g -03 sa.c -lm -o sa. Running ./sa will create a WAV soundfile with
    the default name output.wav.


