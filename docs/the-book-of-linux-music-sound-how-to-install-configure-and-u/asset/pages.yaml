- pgno: 22
  md: '# FOREWORD


    In the current situation of widely monopolized software and operating systems,
    whenever a new operating system emerges, the question “That''s all very nice,
    but are there software applications written for it?” becomes the most obvious
    condition for acceptance on a wider basis. The more so when we restrict the niche
    of applications to a smaller dedicated selection like that of sound and music
    packages.


    However, the Linux case is somewhat different on several accounts. Linux software
    draws on the experience of UNIX systems (perhaps the longest-lived operating system
    still running successfully over all the world); it is based on a new software
    development model (open-source development, which is proving to have an extremely
    quick turnaround), and last but not least it is being developed collectively by
    literally several million people. Linux Music & Sound is an eloquent demonstration
    of the Linux difference: The book drives dozens of applications in musical fields
    ranging from signal processing research and contemporary music tools to virtual
    Dj turntables and astounding adventure games. No market considerations or business
    plans drive the development of these applications—just their sheer usefulness.


    But this was certainly not easy to write: Linux is not a closed system, and its
    users are always allowed to go under the hood to delve into its full depths—a
    liberty that gave Linux the reputation of being “userunfriendly”(nothing far from
    the truth, reality). Explaining deep things in plain and concise terms requires
    a firm control over written language and a creative ability to devise explanations
    and solutions to difficult concepts. The reader will quickly realize that the
    author of this book is well endowed with the required creativity and control.


    And there is more. Most of the applications described in this book can’t be bought
    in a shop, simply because they are completely free and can be easily downloaded
    from the Internet—while this is a great opportunity for all users to get and select
    the applications that fit their best needs, it is a difficult endeavor to even
    guess which is the application that you need, let alone what its name is and where
    you could find it. This is where the most precious expertise of the author of
    this book, Dave Phillips, comes in. For several years, Dave has been managing
    the most widely acclaimed Web site on the platform specializing in Linux sound
    and MIDI (at sound.condor.net), and his gentle and cooperative attitude has won
    him the friendship and esteem of all developers and specialists in the field.
    Many of them consider him a central figure of this social environment made of
    billions of ASCII characters and glyphs traversing the earth every day. Furthermore,
    his intense profes'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'sional musicianship never allowed the technicalities of the software to obscure
    the ultimate musical meaning of its purpose, something which turns out to be a
    real bonus for those of us who set the music as the end product of our lives.


    So this is what Linux Music & Sound turns out to be in the end: An indispensable
    working reference for musicians who consider computers and intelligent operating
    systems to be valuable musical tools. I hope you enjoy reading and using this
    book.


    Nicola Bernardini'
