- pgno: 53
  md: 'The above report tells us that Sound Blaster16 is installed, with services
    including the OPL3 FM synthesizer (snd-opl3), OSS/Free emulation (snd-pcm1-oss),
    support for a software mixer (snd-mixer), and emulation of the MPU401 MIDI interface.


    If you run these commands and receive a message that something like "Operation
    not supported by device," then you do not have the audio subsystem properly installed.
    Try retracing the installation steps for the driver you installed (OSS/Free, ALSA,
    OSS/Linux) and be sure that you have followed them precisely.


    # Playing a Test File


    You can test your audio devices at the command prompt with the UNIX cat (catenate)
    command. If you don''t have a WAV soundfile to test, go to ftp://mustec.bgsu.edu/pub/linux
    and download the linux8.wav soundfile. `cat linux8.wav > /dev/dsp`, and you should
    hear the instructive voice of Linux Tovards, played by the default PCM audio device.
    If you have a WAV file (any WAV file should work), type `cat your_file.wav > /dev/dsp`
    to hear


    If nothing is heard, your mixer settings may be too low. Open the aumix program
    by typing `aumix` in Chapter 3—most Linux distributions automatically install
    aumix, but if you don''t have it, check your distribution documentation to see
    which mixer installed. In aumix, raise the master and PCM channel volumes and
    try your WAV file again. If you still hear nothing or if the sound is distorted,
    then it''s times to troubleshoot.


    # Troubleshooting


    Troubleshooting my sound system has been truly humbling. From experience I have
    learned that the source of most problems lies with the interface between the keyboard
    and the chair (i.e., yours truly). Here are some of the most common problems and
    solutions I''ve encountered:


    **Problem 1: The command cat /dev/sndstat reports that everything I is there,
    but when I play a soundfile I hear nothing.


    **Possible solutions:** Check the levels of your sound mixer (described in Chapter
    3). If the master volume and PCM channels are raised sufficiently (65 percent
    is good), take a look at your sound system. Check to see whether all your wires
    and cables are connected properly. If you have powered speakers, make sure they
    are turned on and that their volumes are raised. All of the equipment in your
    audio chain (power amplifier, mixer, signal processors) must be powered with levels
    up.


    **Problem 2: I can play CDs, but I can''t play a WAV file.


    **Possible solutions:** Run cat /dev/sndstat (or cat /proc/modules if you installed
    the ALSA drivers). If no audio devices are listed, then you may have'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'failed to correctly build or install the sound support. Retrace the steps outlined
    for the kernel sound configuration.


    # Problem 3: I can play WAVs, but I can''t play CDs.


    Possible solutions: Check to see if the master volume and CD channels are raised
    on the software mixer. You might need to open the mixer to see if the CD drive
    is connected to the soundcard. Be sure it''s connected to the appropriate socket
    (it should be labelled on the board or specified in your soundcard''s documentation).


    If the CD drive is mounted as a data drive, your CD player may not work. Unmount
    the CD drive by typing umount /mnt/cdrom (or whatever mount point you choose for
    the CD drive) and restart your CD player.


    # Problem 4: I hear sound, but it''s distorted/barely audible/noisy/too thin/too
    thin booming/playing at the wrong place.


    Possible solutions: For problems with volume, see the solutions to Problem 1.


    Distortion can be caused by a variety of factors. Overdriving speakers is a common
    source of distortion: If the software mixer levels are already high, raising the
    volume of your speakers or power amplifier will overdrive and distort the sound.
    Conversely, if the mixer levels are too low, increasing levels on your speakers
    or amplifier will increase the system noise level in a sound lacking power.


    Thin or booming sound is usually due to badly set treble and bass controls. Not
    all sound mixers provide these controls, so you might need an external EQ (equalizer)
    to balance the high and low frequencies of your audio.


    Problems with playback speed are usually the result of incorrect configuration
    of the player software: A soundfile recorded with a sampling rate of 44.1 kHz
    must be played back at the same rate to be heard at its original pitch.


    # Paul Winkler''s HOWTO


    You may also want to check out Paul Winkler''s excellent HOWTO (from http://www.linuxdj.com/audio/quality),
    which is dedicated to improving audio quality under Linux. Following are nuggets
    of wisdom from his page:


    **Muted channels** Open your mixer and mute each channel to the noisy ones. On
    every card I''ve used there''s one or more noisy channels. Turning them to zero
    or muting them can dramatically decrease system noise, especially with a poorly
    shielded card.


    **Cables** Use the best cabling and connectors you can get. Better wiring usually
    means better insulation and conductivity. Connectors should insert solidly: Pin-jacks
    are notoriously unsteady, and you may have to try a few plugs to find a good fit.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Shield cards Move or shield cards if necessary. The motherboard, the power
    supply, the installed cards, and all the drives are sources for noise of various
    sorts, including radio frequency noise. Moving the soundcard from a noise source
    may reduce interference. Winkler''s Audio Quality HOWTO (you''ll find a copy on
    this book''s CD-ROM) describes a homebrew method of shielding that may also reduce
    interference, but it is a tricky and risky operation.


    # Post a Message to a Newsgroup


    When you believe you have exhausted your resources, it''s time to post a distress
    call to a relevant Usenet newsgroup. For the best response, describe your problem
    in detail, make clear in your message what you''ve done so far, list your system
    specifics, avoid cross-posting (sending the same message to many groups), and
    be polite about asking for help.


    Newsgroups likely to be of assistance when you''re trying to configure and assist
    Linux audio system include the following:


    ```

    comp.os.linux.hardware

    comp.os.linux.setup

    comp.os.linux.misc

    linux-dev.sound

    ```


    If you use the ALSA drivers, you may want to subscribe to their very active users
    mail list. See the ALSA Web page at www.alsa-project.org for subscription details.


    # Necessary Support Software


    The following list is not comprehensive, but it does indicate the range of support
    software necessary for most of the applications presented in this book:


    | X11 | The basic libraries and headers for the X window system |

    | SVGA library | A console graphics library needed by many games and demos |

    | LessTif | Free replacement libraries for the often-required Motif GUI toolkit
    |

    | Gtk | The GIMP ToolKit, a graphics library for GUI development |

    | Qt | A graphics library associated with the KDE desktop GUI |

    | KDE libraries and headers | Needed for compiling KDE-based apps |

    | GNOME libraries and headers | Needed for compiling Gtk apps |

    | Xforms | Another graphics toolkit |

    | ncurses | A library for creating a text-based interface for console applications
    |'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'You should try to install the most current version of a software package, but
    be aware that certain applications may require older or specific libraries and
    headers. Be sure to read whatever documentation comes with the package for information.


    Many of the applications profiled are packaged as source code only. In order to
    compile these programs, you will need the languages and their development environments:


    +   - C/C++: Normally in the form of the GNU compiler (GCC), needed to build the
    Linux kernel itself, therefore found in all Linux distributions

    - Java 1.2 or Java 1.1.7 with Swing extensions: Sun Microsystems'' "write once,
    run anywhere" language, a popular cross-platform development environment (with
    native GUI support)

    - Tcl/Tk: A scripting language (Tl, the tool command language) bound to a set
    of graphics widgets (Tk, the toolkit) for rapid development of a program''s graphics
    interface

    - Perl: Another scripting language, widely used for processing text in Web applications

    - Python: Yet another scripting language gaining popularity as a general-purpose
    applications programming language


    Fortunately, most popular distributions include the above packages (except for
    Java, which must be downloaded from www.java.com) as a matter of choice during
    the installation or upgrade process. They are all available for free over the
    Internet. Check your distribution for language and interface packages you may
    not have installed when you first installed.


    # Internet Connection


    Like Linux itself, sound and music software is a "moving target" under constant
    development. As toolkits improve, so do the applications built from them, necessitating
    updates and upgrades, both easily downloaded from the Net. Further, many of the
    applications presented in this book maintain mail lists for user feedback, and
    Usenet hosts a variety of newsgroups dedicated to music and sound (not necessarily
    Linux-specific). Consider the Internet connection a mandatory item.'
  merge: -1
