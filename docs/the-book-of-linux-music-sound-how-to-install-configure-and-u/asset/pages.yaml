- pgno: 107
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_107_0.png)


    Figure 4-48: Spectral display after LPC resynthesis


    # Ceres Development


    Ceres has spawned a small family of versions; Johnathan Lee''s Ceres2 greatly
    expands the number of control and editing functions, and Reine Jonsson''s Ceres2w
    is Johnathan''s version with WAV support. Guenter Geiger recently joined the list
    of developers lending their efforts to extend and expand the program and has already
    improved the FFT analysis code and added a micro-phone input record function.


    Ceres grows slowly, but its feature list has become noteworthy, offering signal
    processing and transformation options found in no other program. Further, the
    ability to directly edit the spectral display of a sound wave makes Ceres a unique
    and indispensable tool for the Linux musician and sound researcher. I consider
    it a "Most Recommended" piece of Linux audio software.'
