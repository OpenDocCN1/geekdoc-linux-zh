    Cmix was not originally intended to be a realtime or interactive music language.
    However, as computers become more powerful, very interesting realtime and interactive
    features have been added to the package. One result of these additions is RTcmix.


    # # RTcmix


    Authors: Brad Garton and Dave Topper

    Version profile: 2.0

    Web site: http://www.music.columbia.edu/cmix/

    FTP site: ftp://presto.music.virginia.edu/pub/rtcmix/

    Maintained: Yes

    Availability: Free, open-source

    License: Copyright held by Paul Lansky

    Caps summary: Excellent update of Cmix with new unit generators and support for
    realtime audio input/output


    In 1995, Brad Garton and Dave Topper began work on a new version of Cmix for the
    "Indy", a computer manufactured by SGI and designed for superb multimedia performance.
    It was soon apparent that a number of Cmix instruments could run in realtime.
    The Cmix synthesis engine was then connected directly to the Indy''s digital-to-analog
    converters, and RTcmix was born.


    RTcmix has since been ported to Linux and has maintained good cross-platform compatibility
    with the versions for SGI computers. It now reads data over TCP sockets, which
    has liberated the synthesis engine from the interface/parser. MIDI I/O is available.
    RTcmix instrument parameters can be controlled in realtime via software interfaces
    (such as the Looping interface later in this section) or MIDI controllers (such
    as keyboards or fader boxes).


    RTcmix is distributed by Columbia University and is significantly different from
    the Princeton (Cmix) package. The RTcmix documentation pages should clarify compatibility
    problems that may arise when using scores for classic cmix.


    # ## GUIs for RTcmix


    Brad Garton has prepared a package of interfaces for RTcmix, including GUIs for
    X/Motif, OpenGL, and Java. Console interfaces are included for MIDI control and
    hooking into the LISP programming language. As of June 1999, these interfaces
    were not yet optimized for Linux, but they are easily converted with a little
    hacking. Dave Topper''s GTK interfaces also offer possibilities for real-time
    interactive design.'
