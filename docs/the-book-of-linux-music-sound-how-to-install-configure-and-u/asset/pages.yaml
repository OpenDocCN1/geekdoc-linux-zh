    supported actions are TiMIDI Start, Pause/Restart, Stop, and it is simple to use.
    With TiMidity++ as its engine, UMP can render high-quality sound for Web-based
    MIDI files. UMP binaries, sources, and instructions are available at http://pubweb.bnl.nl/people/hoff/.


    # playmidi


    Authors: Nathan Laredo, Takashi Iwai (support for AWE32)

    Version profiled: 2.4

    Web site: http://playmidi.openprojects.net/

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: GPL


    Capsule summary: Excellent MIDI file player for virtually any soundcard; can be
    used in simple console-only mode or in a variety of GUI modes


    playmidi can play MIDI files through the synthesizer on your soundcard (such as
    the OPL3 on most cards or the EMU8000 on the Sound Blaster AE32/64 cards), or
    it directs its output through a MIDI port to an external synthesizer. Like TiMidity,
    playmidi has spawned a family of versions based on the original software. It is
    found in almost every mainstream Linux distribution, and it is an official GNU
    project.


    playmidi is my command-line MIDI file player of choice. It is powerful and versatile.
    Thanks to the low demands placed on the CPU by the libraries required for use
    on a Linux console without graphics. The MIDI data stream, playmidi (in command-line
    form) is perfect for playing MIDI music files on console-systems or on slower
    machines as legacy 486s and old Pentiums, whereas more modern machines can take
    advantage of their various versions for X. If I want to tune to my MIDI file collection
    while working at the Linux command-line, or with without X, I turn to playmidi.


    playmidi provides a rich set of options for playing MIDI files, including the
    ability to force or exclude playback on specific MIDI channels, redefine the synth
    device and MIDI output port, force or exclude percussion channels, control the
    synthesizer, and enable realtime graphics. In addition, playmidi does things better
    than MIDI sequencer packages like Jazz++ can''t: It provides support for playlists
    and controls for the effects processing on some popular soundcards (e.g., AWE32/64
    cards).


    # The Setup


    After unpacking the source code with tar xzv playmidi-latest.tar.gz, change directories
    to your new playmidi directory. Run the playmidi Config-'
  merge: -1
