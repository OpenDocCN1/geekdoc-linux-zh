- pgno: 182
  md: '# # Multitrack


    Author: Boris Nagels

    Version profiled: 2.2

    Web site: n/a

    FTP site: ftp://mustec.bgsu.edu/pub/linux/multitrack-2.2.tar.gz

    Maintained: No

    Availability: Free, binary-only

    License: Copyright held by author

    Capsule summary: Good light-weight solution for small-scale projects


    Multitrack is the only multitrack hard-disk recorder available for the Linux-sole
    running in the SVGA graphics mode. It will also run under X, but for users who
    can''t or use X, it is an excellent direct-to-disk recorder and soundfile editor
    with a graphic user interface.


    Multitrack includes a variety of useful tools, including an oscilloscope and a
    guitar tuner not found in any other Linux multitrack recorder.


    # ## Getting It, Building It


    Installation is simple. After you acquire the package, you run make **install**
    the binary in the proper location. The program can then be placed anywhere from
    the command line. If you''re running it in X, you will need to invoke it with
    the -x switch; if you have the SVGA libraries installed, you need only to type
    in **multitrack** at the console and your session will be in a very full-color
    SVGA graphics mode.


    An options file named "prefs" will be placed in $(HOME)/. Multitrack is fairly
    straightforward, but you may need to make some adjustments in that file in order
    to get Multitrack working properly. In particular, be sure to set the **i_nr_buffers**
    and **o_nr_buffers** to a value of 1 or higher (I set mine to 10).


    If you experience display or mouse problems in Multitrack''s console mode (e.g.,
    Multitrack won''t open or you cant control the mouse), you may need to look into
    your /etc/libvga.conf. Make sure that the settings indicated in that file actually
    match your configuration.


    > Multitrack''s use of the SVGA library may be a security concern to network administrators
    because the program must run root (which means that requires root permissions).
    Just to be safe, take your machine off any network when using Multitrack.


    # ## Recording Session


    Your first session in Multitrack will demonstrate a simple two-track recording.
    Let''s assume you have a soundcard capable of full-duplex operation, so you can
    simultaneously record one track while playing another.


    Before recording or playing anything in Multitrack, you have to create a new song
    file. First, select a directory for your project track information, as shown in
    Figure 8-11.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_183_0.png)


    Figure 8-11: The Select Directory window in Multitrack


    Clicking on the Format button will take you to the box shown in Figure 8-12.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_183_1.png)


    Figure 8-12: Multitrack''s Format window


    Here you indicate the number of tracks, the sampling rate for recording and playback,
    a title and copyright date, and the track length. All of these settings can be
    edited within Multitrack after a session is in progress.'
