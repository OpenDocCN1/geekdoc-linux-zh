- pgno: 225
  md: 'Silence Csound scores from numeric systems (such as Lindenmeyer fractal formula).
    MIDI files, and graphics in the GIF format. Silence is a realtime synthesizer,
    nor does it provide any interactive controls. It is designed for (but not only
    for) exploring the musical possibilities of exotic mathematics such as chaotic
    systems and fractal geometry. After a Silence score has been created, you can
    choose to compile it with Csound or render it as a MIDI file.


    Silence is a deep program, creating, transforming, and processing sound with tools
    not found in any other Linux audio or MIDI application. However, its logical interface
    makes it easy to explore the world of Silence, and its documentation clearly explains
    the nature and use of its unusual tools.


    # Getting It, Building It


    Silence requires Java—either the JDK (Java Development Kit) 1.1.7 or higher with
    the Swing extensions or the JDK 1.2. The JDK for Linux is available from www.blackdown.org
    and the Swing extensions are available from Sun Microsystems at www.java.com.
    Both packages are free.


    Silence also requires Csound. You can use Silence by itself to create Csound instruments
    and scores, but of course you will be able to compile them from Silence only if
    Csound is installed. When Java packages are installed, retrieve Silence from its
    Web site and unpack it in /usr/local/ or /home directory. Silence is packaged
    as a DOS-style PKZIP file, but fortunately the ubiquitous gunzip will uncompress
    it without complaint. Type gunzip Silence.zip to create a new Silence directory.
    Change to directory and edit the Silence.cfg file to designate your external helper
    applications for viewing the HTML file for playing and editing soundfiles. Here
    is how my Silence.cfg appears:


    ```

    silenceHelpPath = /home/Silence/Silence.htm

    csoundHelpPath = /home//Manual/Csound/TITLE.html

    instrumentLibraryPath = /home/Silence/Instr

    instrumentPath = /Instruments.

    unitPath = Units.

    nodePath = /home/Silence/Nodes

    play wav = xplay

    edit wav = snd

    play aif = xplay

    edit aif = snd

    play mid = playmidi -e

    edit mid = jazz-pp

    open html = xterm -e lynx

    open htm = xterm -e lynx

    csound = csound

    ```


    > Note that the nodePath does not include a trailing period.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'You will also need to download the ACSound package from the Silence site. All
    you need from that package is the JCSound directory. Unzip the ACSound package
    wherever you like, copy the JCSound directory to the Silence tree, then configure
    the JCSoundManager.cfg in the Silence • JCSound directory. Here is my JCSoundManager
    configuration file:


    ```

    soundfilePlayer = xplay

    helpCommand = xterm -e lynx /home/Silence/ACSound.htm

    externalCsound = true

    ```


    With these steps completed, you can now launch and use Silence.


    # Using Silence


    From the Silence top directory, start the program with the following command (substituting
    the correct paths for your installation) in an xterm window:


    ```

    java -classpath:/home/Silence/calc:/home/Silence/JCSound:/home -mx72m -ms64m

    Silence.Framework.MMLManager

    ```


    The mx and -ml options specify the optimal starting memory for Java and Silence
    (72 megabytes and 64 megabytes in this example). You may need to adjust those
    amounts to accommodate the size of your system''s memory.


    When Silence starts, it opens to the Music Modeling window shown in 9-16.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_226_0.png)


    Figure 9-16: Silence''s Music Modeling window'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'You create a Silence composition by selecting Nodes and arranging along the
    Music Graph. When you are satisfied with your structure, select Score • Generate
    Score from the menu bar, and Silence will switch to the Score window—where it
    will display your new creation as a piano-roll style graph.


    Silence loads and saves a variety of file types. An entire Silence creation is
    saved as a Music Modeling Language file with the .mml extension. Silence scores
    can also be saved as Csound file, as MIDI files, and as scores within Csound csd
    unified file format.


    # Render a MIDI File to a Silence Score


    For our first experiment with Silence, we''ll render a MIDI file to a Silence
    Score. Select the MIDI node from the Available Nodes and press the Insert key
    to add the node to the Music Graph. Right-click on the MidFile node in the Music
    Graph, choose a MIDI file to render, and rename the node. Figure 9-17 illustrates
    the process.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_227_0.png)


    Figure 9-17: Rendering a MIDI file in Silence


    Select Score • Generate Score from the top menu, and the display will automatically
    switch to the Score window while Silence computes the new score. When the score
    has been computed, you will see a new display in the Score window. Figure 9-18
    shows the "ragtime" example MIDI file rendered to a Silence score display.


    You can now select Score • Edit Score to edit the events in your new score. Events
    can be inserted and deleted singly or in blocks, and individual'
  merge: -1
