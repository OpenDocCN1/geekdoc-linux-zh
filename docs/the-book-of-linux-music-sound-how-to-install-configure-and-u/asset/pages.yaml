- pgno: 175
  md: '# Creating Files and Using SLab


    To create a file, left-click on an icon in the top panel of the main window. A
    new panel will appear with an icon named startCD, the default project name. You
    can start your own project by holding the right button down anywhere within the
    same panel as the startCD icon. A tear-off menu will appear with "New CD" in it.
    Select it, then name and save your new project (for this example, we named it
    Your_CD) in the Save As dialog box. A new project with your project name will
    appear beside the default startCD icon, and a third panel will appear with only
    the word "Empty" in. Left-click over the new icon. Right-click anywhere within
    the Empty panel and select the New Song item from the tear-off menu. A SongFile
    Requester page will appear, in which you''ll name your song, select the sampling
    rate frequency, the block sample count (for managing the soundcard I/O or 0 buffers),
    and what compression value to use. Figure 8-3 shows the main window opened to
    the third panel and the SongFile Requester page (where we''ve named the song Your_Song).


    ![](img/43a9671cef617c9c7a18f7a6904433f1_175_0.png)


    Figure 8-3: Slab''s SongFile Requester page


    When you''ve completed the Requester page, click on OK and the Your_Song icon
    will appear in the third panel. You can now drag and drop that icon onto any of
    the four icons at the top of the main window. Those icons represent (from left
    to right) Slab''s StudioSlab (a studio-style mixer also referred to as MixerLab),
    TapeSlab (a tape-recorder GUI for the record/play func-'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'tions), DeviceSlab (the soundcard mixer), and WaveSlab (a wave editor). For
    our first look at SLab, we''ll drop Your Song CD onto the MixerSlab icon (each
    icon has a text identifier that pops up when the cursor is moved over it). Slab
    will go through some transformations, finally settling into a display like that
    shown in Figure 8-4.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_176_0.png)


    Figure 8-4: SLab''s MixerSlab display


    SLab''s design intentionally duplicates many functions in its various windows.
    For example, in addition to mixing, the StudioSlab studio mixer you have just
    opened can also record and play back, using either the transport controls beneath
    the meter display or items selected from the Tape menu. You can also open any
    of the devices along with any. Changes made in one of the devices will register
    on the corresponding displays of the other devices, so that when you move the
    sliders of StudioSlab''s mini-mixer, for example, the corresponding sliders of
    DeviceSlab also move. Figure 8-5 shows the StudioSlab, the TapeSlab, and the DeviceSlab
    all opened and interoperable.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_177_0.png)


    # Recording


    Your first SLab project will be a simple two-track recording, utilizing the full-duplex
    capacity of the soundcard. First you''ll record a part on track 1, and then you''ll
    record a second part on track 2 while listening to your first recorded part. This
    is all very simple in SLab.


    First, open the three devices as shown in Figure 8-5. To record your first part,
    just click the L button at the top of the first mixer strip (in the top left corner
    of the mixer window in the StudioSlab display). This activates the track for recording.
    Now use the mini-mixer for your audio device (located in the upper right corner
    of the StudioSlab) to raise the microphone (MC) input level, testing it by speaking
    into the mic and watching the meter levels for the track selected for recording.
    When you''re satisfied with the input level, begin recording by pressing the Record
    [ ] button under the StudioSlab meter display, then pressing the Play [ || ] button.
    Play your music and click on the Stop [ ■ ] button when you''re finished. You
    can listen by raising the mini-mixer PCM (pulse-code modulation) channel level,
    pressing the Rewind [ << ] control and clicking on Play [ || ] again.


    To record track 2 while listening to track 1, simply repeat the process above,
    this time using the second mixer strip for recording. Keep the PCM channel level
    up, set the playback level of track 1 using the slider in the first (leftmost)
    strip, bring up the slider in the second strip, and repeat the'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'ing and playback process. You should hear the first recorded track playing
    as you add your new track.


    # Adding Effects


    To add an effect to a newly recorded track, you''ll need to open your Effects
    toolbar and assign each effect you want to its own Return panel in the StudioLab
    mixer. Following a standard studio recording method, the sound from your recorded
    track is sent to the effects panel, mixed with a specified amount of the selected
    effect, and returned to the audio output bus (hence the significance of the Send
    and Return terms).


    Click on the EffectsTool in the top of the main window (visible in Figure 8-4).
    The second (project) panel will be replaced by a panel containing a variety of
    effects types, and clicking on any of these icons will replace your third (songfile)
    panel with a panel of specific effect modules. You can now drag and drop any of
    the effects into one of the Return panels located directly beneath the transport
    controls in the StudioLab mixer. For example, to add a reverb effect to the first
    Return panel, simply drag the Reverb icon over the Return panel and drop it to
    Return 1. A new window will appear, as shown in the lower right of Figure 8-6,
    representing the effect as a rack-mount effects box. To apply the effect to, track
    2, click on the small I/O button (the second knob from the top of the mixer strip).
    Double-click in the small box below and to the right of the I/O button, then enter
    the number of the effects Return panel you want to apply to the track. Adjust
    the Send control knob and the Return panel level until you have the exact amount
    of the effect you want. Figure 8-6 shows the Reverb module that was dropped into
    Return panel 1 and applied to track 2.


    The Reverb module''s controls are adjustable in realtime, as are most of SLab''s
    controls. You can continue dropping effects into the Return panels, selecting
    only the ones you need for your tracks. You can build arrangements of effects
    modules, as seen in Figure 8-7.


    In Figure 8-7, the two Sends for both tracks have been activated (there are two
    Sends per track), and each rack-mounted module is specified beneath the appropriate
    Send knob. The Return panel level is up (for panels one through four), which will
    allow the modules to actually process the tracks, and the rack-mount display (the
    window in the bottom right of Figure 8-7) shows the effects modules with their
    default values.


    You can save your work at any time by selecting BaseLines/Save Mix or Sessions/Save
    Session. Save Mix will save all the parameters of your mix, including all volume,
    pan, and effect settings. If you enable sessRec in TapeSlab, you can record any
    movements you make with the user interface, with a fade-out with a track volume
    slider. Save Session will save those movements along the rest of the mix, and
    sessPlay is chosen in TapeSlab, the playback mix will include your recorded fade-out.'
