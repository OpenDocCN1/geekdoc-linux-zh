- pgno: 33
  md: '# FM Synthesis


    The original Ad Lib and Sound Blaster commands (and other cards that claim Sound
    Blaster compatibility) have an on-board "synthesizer-on-a-chip," the Yamaha OPL3.
    The OPL3 performs a simple form of frequency modulation (FM) synthesis. Developed
    at Stanford University in 1973 by the composer John Chowing, FM synthesis controls
    the timbre (tone color) of a sound by modulating the frequency of one sine wave
    by another. A complete explanation of FM synthesis is beyond the scope of this
    book, and the interested reader should consider the Dodge & Pulse book.


    Digital FM proved to be both musically expressive and computationally inexpensive
    (i.e., sounds could be synthesized quickly). Able to create highly evocative imitative
    and original sounds without the need for heavy computing resources, FM became
    popular with many composers working with computers. In 1975 the Yamaha Corporation
    licensed the technology from Stanford and ten years later the market marked its
    sounds using FM synthesis.


    The OPL3, however, is not a DX7 on a single chip. Designed for cheap, mass-produced
    soundcards in order to provide a common level of sounds (partially for games),
    the OPL3''s palette is rather limited. Consequently, it simply not suffice for
    serious synthesis or MIDI file playback. In order to provide a richer palette
    of sounds, many cards now include a wavetable synthesis instead of (and sometimes
    as) the OPL3.


    # Wavetable Synthesis


    According to a strict computer-music definition, wavetable synthesis sizes a sound
    by filling a software table with a pre-calculated waveform and then reading the
    table through a digital oscillator. The oscillator typically adds frequency (pitch)
    and amplitude (volume). For example, a function table in the sound programming
    language Csound can store a pre-defined waveform—such as a sine wave or sawtooth
    wave—and make it available for processing (i.e., synthesizing) by Csound''s oscillators
    and others.


    To matters matters, soundcard manufacturers have a different definition of wavetable
    synthesis; for them it is actually a type of sound playback. By this definition,
    playing a set of sounds pre-loaded into a soundcard''s memory is wavetable synthesis.
    You can loop and add effects to these sounds, but do remember that the sounds
    used are not synthesized but rather are pre-recorded samples.


    The Sound Blaster AWE64 is a good example of a soundcard with an on-board wavetable
    synthesizer, and an especially good choice for MIDI file playback. The chip that
    provides the synthesis engine is an EMU8000, designed by engineers from the EMU
    Corporation, leaders in the design of hardware players. It is accessible via MIDI,
    has expandable memory, and comes pre-loaded'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'with a usable set of General MIDI sounds. In order to maintain compatibility

    with the original Sound Blaster, it also includes the ubiquitous OPL3.


    # Other Synthesis Methods


    Many other synthesis strategies exist and can be explored using software syn-

    thesis languages such as Csound and RTmix. These other useful methods

    include physical modeling, additive synthesis, subtractive synthesis, waveshap-

    ing modeling, and analysis-based synthesis. Each method has its strengths: Physical

    synthesis subtractive synthesis

    recreates the sounds of vintage analog synthesizers, waveshapings is very

    effective for imitating brass instruments, and additive synthesis techniques

    provide unique tools for warping the time and pitch of a previously recorded

    sound. However, most contemporary soundcards only supply hardware for the

    FM and wavetable methods. Although these other types of synthesis are not\likely
    to appear soon as standard soundcard hardware, they are available now

    in many Linux synthesis languages (see Chapter 3).


    # A Few Words about MIDI


    MIDI is not an audio format. MIDI is a simple switching and command protocol

    designed to pass on/off messages between compatible devices. It also supports

    the continuous data streams produced by the pitch bend wheel, mod wheel,

    sustain pedal, and other controllers commonly found on MIDI keyboards.

    MIDI simply sends and receives commands to and from devices that do make

    sounds—such as soundcards, external synthesizers, and drum machines—

    telling them them when to play a particular sound, for how long, at what volume,

    and so forth. You will learn more about MIDI in Chapter 6.'
  merge: -1
  img_proc: true
