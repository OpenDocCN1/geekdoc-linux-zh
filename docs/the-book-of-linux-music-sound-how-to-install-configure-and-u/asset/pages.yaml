  md: '# Sig++


    Author: Craig Stuart Sapp

    Version profiled: 1.0.0

    Web site: http://hummer.stanford.edu/sig/

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open source

    License: Copyright held by author

    Capsule summary: Sound synthesis and predefined language similar to C++


    Craig Stuart Sapp describes Sig++ as " . . a set of C++ classes for creating sound
    synthesis/filtering programs—primarily for the uninterpreted elegant environment
    of a Unix command line.


    Like Cmix, Sig++ is really a library of audio signal processing functions that
    can be linked into regular C and C++ code. To programmers already convers with
    those languages, using Sig++ is a simple matter of learning its functions. To
    novices with sounding souls and a desire to learn more about C/C++ programming,
    Sig++''s C++ classes and predefined functions provide an elegant solution.


    # A Sig++ Example: The White Noise Generator


    Following is the code for a white noise generator, written in C++:


    ```

    //

    // Programmer: Craig Stuart Sapp <craig@crm.stanford.edu>

    // Creation Date: Wed Apr 30 14:17:37 GMT-0800 1997

    // Last Modified: Mon Jan 19 04:21:15 GMT-0800 1998

