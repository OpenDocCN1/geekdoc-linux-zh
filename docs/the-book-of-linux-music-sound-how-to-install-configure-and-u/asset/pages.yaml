  img_proc: true
- pgno: 141
  md: 'Unpacking in /home will create the TiMidity-latest directory. Following the
    instructions in the INSTALL text file, you can run the ./configure make; make
    install command sequence to build and install TiMidity++. However, you will want
    to run ./configure --help first; TiMidity has many options for the build process,
    including interface selection (curses, X11/Motif, Zaw, Tcl/Tk, and Gtk), choice
    of sound drivers (OSS, ALSA, ESD), and whether to support network audio. Of course,
    the necessary libraries and headers must be present to compile the desired selections
    into the application.


    Once the program is installed, type timidity -h to bring up lists with the various
    command-options for running TiMidity; type man timidity for a more leisurely look
    at those options presented in a UNIX "man" (manual) page. The man pages are viewable
    in an X window or over the Linux console, so help for TiMidity is always easily
    available.


    # What All Does It Do?


    TiMidity++ has an impressive feature list. It.


    +   - Plays MIDI files without an external MIDI synthesizer by rapidly converting
    a MIDI file to a WAV file and playing it through the soundcard DACs

    - Places a very low load on the CPU

    - Converts a MIDI or a MOD file to various audio file formats (WAV, AU, RAW, AIFF)

    - Plays MIDI files over a network

    - Handles MIDI files that utilize a 32-channel format

    - Automatically detects the drum channel and patch layout mode of MIDI files (General
    MIDI, Roland GS, Yamaha XG)

    - Has a sound spectrogram display and support for almost all common MIDI messages
    as well as for uncommon ones (particularly some karaoke display functions)

    - Supports playlists

    - Plays files contained within archived files, including tarballs, zipfiles, and
    lzh-compressed files

    - Accesses and plays files (including archived files) over a network, including
    the HTTP (e.g., http://foo.mid), FTP (e.g., ftp://foo.mid), and NNTP (e.g., news://foo.mid)
    protocols


    TiMidity++ uses the same GUS-compatible patches for the original TiMidity and
    can now employ SoundFonts (a soundfile format for the Sound Blender AWE32/64 cards).
    If neither format is available, you can use a GUS2WAV conversion utility to create
    Gravis Ultrasound PAT files from WAV files. With the'
