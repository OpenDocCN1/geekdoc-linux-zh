  md: '# The <unspecified> message at the prompt is Snd''s way of telling you everything
    turned out all right.


    Next we''ll apply a series of effects to our newly reverberated sound. First,
    some ring modulation:


    ```

    (map-chan (ring-mod 100 ''(0 0 1 0)))

    ```


    Then some chordal comb filtering:


    ```

    (map-chan (comb-chord .95 40 .30))

    ```


    And finally some moving formant filtering:


    ```

    (map-chan (moving-formant .01 ''(0 200 .5 400 1 100)))

    ```


    This last process significantly reduces the amplitude of the output. Let''s use
    the Listener one last time to call a scale plug-in.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_87_0.png)


    In the Snd And Motif section of the extsnd.html file you will find the C code
    for building a plug-in to scale amplitude up or down. Follow the directions, build
    the plug-in, and update Snd by entering these commands in the Listener:'
  merge: -1
