- pgno: 93
  md: '# Using BC2


    You can start BC2 by entering bcast2000 in the BCHOME/newbc/bcast directory.

    You can also edit the bcast2000.sh script (in the BCHOME top directory) for the
    location of the bcast binary and libbcbase.so library, then copy the script to
    /usr/local/bin. Now you can start BC2 from any directory.


    But First...


    Before doing anything else, you should read the BC2 HTML documentation in /docs
    under the top directory) for clear descriptions of all the program''s features
    and tools. This documentation is not called from within BC2 itself, so you''ll
    need to keep a Web browser open in order to read it while you''re working.


    Start the program from xterm by entering bcast2000.sh at the prompt.

    The default configuration will open a main window with three smaller panels, as
    seen in Figure 4-31. If your screen feels cluttered you can freely open and close
    the console, level indicator, and video windows.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_93_0.png)


    Figure 4-31: Broadcast 2000''s opening appearance


    From the menu bar at the top of the main window, open Settings • Preferences and
    edit the information (if necessary) in this panel as shown in Figure 4-32. If
    you are unsure about what to change, simply use the default settings.


    # Assets and the Edit Decision List


    Unlike the other editors profiled in this chapter, BC2 organizes all of your loaded
    soundfiles into a set of assets. Assets are then referenced to build what is called
    an edit decision list (EDL). Using the assets manager (available in Files • Assets
    .. you can delete soundfiles from your disk or project, append files to new tracks,
    retrieve soundfile information, and rebuild the EDL index.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_94_0.png)


