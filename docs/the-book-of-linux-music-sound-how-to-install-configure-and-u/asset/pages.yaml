- pgno: 153
  md: 'xpat is a software emulation of a MIDI fader box. A hardware fader box is a
    control interface that provides sliders, buttons, and wheels to send MIDI messages
    to another hardware device, typically a MIDI synthesizer, allowing you to assign
    controllers that may not exist on your hardware. xpat is a wonderful tool because
    it works in the same manner as the hardware fader box and thus saves you from
    having to buy one. xpat''s controls can be assigned to any MIDI message type.


    # Getting It, Building It


    Unpack the source code (from the Web site or this book''s CD-ROM) with tar xvf
    xpat.tar.gz and change to the new xpat directory. xpat requires the XForms library
    (available at http://bragg.phys.uwm.edu/xforms) and the X libraries included with
    most Linux distributions. After editing the Makefile to indicate the location
    of your XForms libraries, simply type make, and in a few minutes you will have
    your new xpat. Type .xpat to try it. Copy it to a directory in your system PATH
    [/usr/local/bin is a good choice] and you can run it anywhere simply by typing
    xpat in an xterm window.


    # Using xpat


    A simple use for xpat is as a transmission device for MIDI controller messages.
    However, the sliders can be programmed to send any type of MIDI message, including
    system-exclusive data (for editing external synthesizer sound parameters) and
    MIDI note-ons and note-offs.


    On start-up, xpat looks for a file named xpat.sysex, a user-configurable file
    that specifies a list of system-exclusive messages that can be controlled by the
    sliders. I wrote the following file for my Yamaha TX802 (an external synthesis
    module):


    ```

    #

    # Sysex Info File for xpat

    #

    Yamaha TX802

    algorithm select = f0 43 10 01 06 P f7

    feedback level = f0 43 10 01 07 P f7

    transpose = f0 43 10 01 10 P f7

    pitch EG scaling = f0 43 10 06 26 P f7

    oscillator fine = f0 43 10 00 13 P f7

    ```


    > NOTE The xpat.sysex file is not necessary for any other xpat operations. The
    program will launch and run perfectly without it.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_154_0.png)


    Figure 6-27: xpat


    Figure 6-27 shows xpat with the first five sliders configured as sys-ex controllers
    on MIDI channel 1 for the parameters included in my xpat. sysex file. The next
    four sliders are configured for controlling MIDI volume, modulation-wheel amount,
    pitch bend, and program change on MIDI channels 2 through 5; the remaining seven
    sliders are currently not in use.


    # Summary


    That''s all there is to xpat. It performs its tasks well, and there''s no other
    program like it for Linux. I especially like to use it for editing my synthesizers:
    They all have displays that are too small, and xpat provides a much more usable
    interface. I highly recommend it for any Linux MIDI studio.


    MIDI revolutionized the world of commercial music-making. By placing powerful
    and affordable composition, recording, and editing tools in the hands of musicians
    everywhere, MIDI has made it possible for one person with a home studio to create
    and record music as complex and polished as that coming from a major recording
    label. However, MIDI is not perfect for everyone, and the original specification
    is showing its age. But even though various schemes have been devised for replacing
    MIDI, none have been widely accepted and it is generally agreed that MIDI is here
    to stay. If you''re planning a full-featured Linux music studio, don''t forget
    about MIDI!'
  merge: -1
  img_proc: true
