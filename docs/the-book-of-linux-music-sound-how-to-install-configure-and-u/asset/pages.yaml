    # The MML File Format


    Before leaving Silence, let''s take a very brief look at the MML file format.
    Using any text editor (such as vi or emacs), open your midifile.mml file. You
    will see a type of programming language known as a mark-up language, similar to
    the HTML and XML mark-up languages well known to Web page programmers. The MML
    file format is directly editable within your text editor, allowing you to change
    the file without opening Silence itself. Here''s a look at the inside of midifile.mml,
    opened with the vi text editor (note that some material has been deleted for clarity):'
  merge: -1
  img_proc: true
