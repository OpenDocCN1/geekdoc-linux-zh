  md: '# Making Complex Loops


    If you want to make loops longer than one bar, use the **Loop Length** knob at
    the right (the top aqua knob) to set the loop anywhere from 1 to 50 bars. For
    our example, we''ll make a four-bar loop. Set the **Loop Length** to 4, press
    **Play** (the green button next to Stream), and the current pattern will repeat
    itself four times. To introduce a new rhythm into the loop, use the lower aqua
    knob to select where to insert the rhythm. For our example, adjust the **Locator**
    knob to 2 and then choose a new (blank) pattern from the pattern matrix in the
    bottom right-hand corner.


    Now enter different rhythm for this part of the loop sequence. You can lock any
    particular pattern to play by toggling the **Pattern/Loop** button so you don''t
    move to the next part of the loop when the pattern ends. Edit the other two bars
    in your loop by selecting a previous rhythm or creating a new one.


    Figure 13-9 illustrates an edit of instrument channel 2 (the snare drum), in 4
    bar (pattern 2) of a four-bar loop.


    Use the **Locator** knob to move to the beginning of the loop, then toggle the
    **Pattern/Loop** button to **Loop** mode and press **Play** to hear the entire
    loop. Press the **Stream** button to save your loop as a WAV file, and open **File
    · Save State...** to save your session configuration and rhythm patterns.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_345_0.png)


    Figure 13-9: Editing instrument channel 2


    # Closing the Box


    Green Box sequences patterns to create elaborate rhythm loops, making it an excellent
    companion to Oolaboola and terminatorX. Its design is deliberately based on the
    rhythmically strict beat-box, presenting only a single rhythm in 4/4 time. However,
    once you master the interface, Green Box opens up to some uses quite beyond the
    beat-box model. Any WAV sound source can be utilized, and independent channel
    tempo control is included as an experimental feature. Green Box is a very useful
    tool, especially when combined with'
