- pgno: 39
  md: 'Serious digital audio will stress your system to its maximum potential. Heavy-duty
    storage, fast retrieval, large archiving space, and a very fast CPU are all required
    for anything approaching serious audio work.


    # Why So Much Disk Space?


    Digital audio is a conspicuous consumer on desktop computers. In addition to the
    large size of audio software files, simply storing music takes up a lot of disk
    space. One minute of CD-quality stereo sound requires 10 MB of disk storage— doesn''t
    sound like much until you start calculating the real length of pieces, the need
    for working copies and alternate takes, the need for permanent storage. If you
    have a CD burner, you can course simply save files to a compact disc. Otherwise,
    you will have to consider either a larger hard disk or a removable drive.


    # Why So Much Memory (RAM)?


    Many of the applications profiled in this book require large amounts of physical
    memory. Some of the soundfile editors (Chapter 4) read from memory, limiting the
    file size to the amount of RAM present in your machine. For example, the Silence
    composition and synthesis environment (see Chapter 9) includes some memory-intensive
    processes. 64 MB is workable for low-demand audio, 128 MB will satisfy most of
    the applications reviewed in this book, and 256 MB is best of all.


    # What Is a Working System?


    A Linux system here means a recent kernel with up-to-date libraries and other
    support software as the components listed in the Necessary Support Software section
    later in this chapter. Linux audio developers may be only marginally concerned
    with backward compatibility, so it''s best to stay current with your base system.


    > It is not the aim of this book to teach users how to install the Linux kernel.
    Virtually all contemporary Linux distributions include a precompiled kernel along
    instructions for upgrading and installing a new one. Most users will enjoy a working
    system simply by carefully following the directions provided with the distribution
    documentation.


    # System Requirements for MIDI


    MIDI demands far less from a system; even a 386X can run MIDI applications fairly
    well. MIDI is less demanding because it is not audio data. It is a simple messaging
    protocol that, in effect, sends mainly on/off switches back and forth along the
    MIDI cable—the actual production of the sound is carried out by the soundcard
    or the external synthesizer''s dedicated processors.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Audio Hardware


    In all audio systems, one rule holds true: The overall quality of your equipment
    will determine the overall quality of your results. With that rule in mind, setting
    up an audio system for Linux is a straightforward procedure.


    # Minimum Requirements


    The following hardware components will give you a basic system. The first three
    items are required.


    +   * Soundcard and driver

    * Speakers

    * Cables

    * Microphone (optional)

    * Amplifier (optional)

    * Subwoofer (optional)


    # The Options


    A microphone is necessary if you want to record your voice or any other external
    source. You might need an amplifier if you don''t have powered speakers (speakers
    with built-in amplifiers) or if your soundcard does not provide a pre-amplified
    signal (your soundcard manual should tell you if its signal is pre-amplified or
    not).


    Consider a subwoofer if you''re using a simple multimedia audio system that was
    packaged with an off-the-shelf computer. These are sufficient for business and
    game sound, but won''t provide the ideal bass response.


    Digital audio is capable of producing clear signals through the entire range of
    human hearing—but you won''t be able to hear sounds your system can''t reproduce.


    # Medium System


    My home system might give you a good overview of a medium-powered desktop audio
    setup:


    **Soundcards** For testing various pieces of audio and MIDI software, I have three
    soundcards in my machine: a Sound Blaster AWE64, a Music Quest MQX32M, and a Sound
    Blaster PCI128. The MQX is a standalone MIDI card and has no audio output. The
    other two cards are configured to produce audio output for my CD player, to provide
    an internal MIDI synthesizer for MIDI playback, and to provide full-duplex (the
    ability to record and play simultaneously) PCM digital audio functions.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Speakers I use a pair of unpowered YSM-1 studio monitor speakers from Yorkville
    Sound.


    Cables I have shielded cable from Hosa and Rapco, with speaker cables for the
    monitors and regular patch cabling for all other connections except the mic (which
    has its own cable).


    Microphone I use a Yamaha MZ106 dynamic microphone.


    Amplifier My mixer sends its stereo output to a 100-watt power amplifier manufactured
    by the QSC Company.


    Tape recorder I usually record onto a 4-track analog recorder using a high tape
    speed and dbx noise reduction. Input to the 4-track can be routed from my MIDI
    synthesizers, from my computer, or from the microphone.


    Mixer Audio output from both Sound Blaster cards is fed into a Yamaha DMP11, an
    8-channel digital mixer that sends the mixed signals to its stereo output jacks.
    (I also recommend the Mackie mixers for low to medium budgets).


    Effects processor An inexpensive Alesis MIDiver provides a variety of reverb,
    echo, and chorus effects for outboard processing (i.e., not done by the mixing
    board).


    # Advanced System


    Bear in mind that more expensive gear wants more expensive accommodations, a building
    or room constructed specifically for the purpose of audio-recording, i.e., Given
    the funds for such a room I would build a system like this one:


    Soundcard RME Hammerfall digital audio board with ALSA driver.


    Speakers Yamaha NSM-10 monitors, 3-way main system with speakers (I''m obviously
    partial to Yamaha gear, but Gelelec speakers are also a preferred professional
    solution) dedicated to bass, midrange, and high frequencies.


    Cables Monster cables.


    Microphones An assortment of expensive dynamic and condenser mics by manufacturers
    such as Neumann and Groove Tube.


    Amplifiers A 3-way system requires a crossover box (splits the signal into the
    three frequency ranges) and amplification for each signal path. My choice would
    be a rack of Crown power amps.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Multitrack digital tape recorder The Alesis ADAT is the machine of choice in
    many studios.


    Mixing board A 32-channel Neve or Yamaha board would do nicely.


    Effects processor I''d like an Eventide Ultraharmonizer, please . .


    But now to some specifics about your system. . .


    # Soundcards


    Get the best soundcard you can afford, and check to see if your sound drivers
    (OSS/Free, ALSA, OSS/Linux—all discussed below) supports your card and all its
    features. Professional-quality cards are only beginning to get support for Linux
    installations, you''ll likely need to consider a consumer-grade card.


    The Sound Blast PCI128 is an excellent low-cost solution, with an external MIDI
    port and especially good full-duplex and CD audio. Drivers for the PCI128 are
    available from 4Front Technologies (OSS/Linux) and ALSA.


    The Trident 4Dwave is another excellent card, with a Sony/Philips digital audio
    interface (S/PDIF) supported by ALSA drivers. The Trident 4Dwave is particularly
    recommended if you want to transfer audio from your computer to a DAT (digital
    audio tape) recorder or a mini-disc recorder, or if you want to record audio from
    a CD player with digital output.


    Physically installing your soundcard is easy, but for specific installation instructions,
    consult your soundcard''s manual.


    In November 1999 Creative Labs inaugurated an open-source development initiative
    for their popular SBLive soundcard. This card has digital audio I/O, 4-channel
    sound, on-board effects processing, and an EMU10K synthesizer. Open-source drivers
    for this card are available from the Creative Labs Linux project Web site (http://open-source.creative.com).
    Both ALSA and 4Front also provide drivers for the SBLive! (see the soundcards
    directory on the CD-ROM for more information).


    # More Essentials


    # Cables


    Quality cabling is an important factor in achieving high-quality audio recordings
    and playback. Unfortunately, soundcards typically have small pin-jacks and consumer-grade
    connectors that are far from optimal. Whereas the jacks cannot be easily replaced,
    you can at least make sure that the connecting plugs and cables are the highest
    quality you can afford. Plugs should be seated'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'firmly in the jacks. Loose or shaky connections can result in dropouts, static,
    and other noise conditions during recording and playback. Companies such as Monster
    and Hosa would be good enough for home studios.


    # Speakers, Amplifiers, and Mixers


    If you''re serious about audio then it''s a bit silly to compromise the audio
    possibilities of your dual-processor 500 MHz Linux box by connecting it to a $40
    pair of powered speakers. In addition to a good set of studio-quality monitor
    speakers (such as those available from Yamaha and Alesis), you will also have
    to consider adding a power amplifier and stereo mixer if you want to enjoy high-quality
    sound.


    For the best results I recommend a three-way system, a system that routes audio
    through a crossover (a device for separating the sound into two or three broad
    ranges) and then through a speaker system optimized for low, middle, or high frequencies.
    This is a rather expensive solution, requiring the cross-over box, separate amplifiers
    for the speakers, and the speakers themselves. Typical costs can easily reach
    into thousands of dollars for a quality system (using Yamaha and Crown equipment,
    for instance).


    # Microphones


    The cheap microphone that comes with your soundcard is usable only for low-fidelity
    spoken-word recording. If you''re planning to record musical instruments or singers,
    you will need microphones optimized for the frequency and amplitude ranges of
    singers and instruments.


    Microphones come in three types, and each type has its strengths and weaknesses.


    Dynamic microphones are rugged microphones especially good at handling loud, powerful
    signals, but they lack a good transient response (the speed at which the mic responds
    to the changes of a sound).


    Condenser and electret mics have a better sensitivity to lower-powered signals,
    such as acoustic guitars and light voices, but they require a separate power source
    and are prone to overloading.


    Ribbon microphones are usually found in professional studios: They offer superior
    transient response, but are very fragile and expensive.


    Because of the wide variance in the power and frequency ranges of one kind of
    sound, it is difficult to recommend microphones. Each player plays his her instrument
    in a unique fashion, so the best solution is to have at least two of the above
    microphone types.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Mixing Boards


    Recommending hardware mixers excellent low-cost considerably easier than recommending
    mics. Mackie make excellent low-cost mixers, professional studio boards are available
    from such manufacturers as Neve, Studer, and Yamaha. Once again, your budget will
    determine what you get. You will have to consider how many inputs you might need
    for your microphones and instruments and get a board appropriate for your purposes:
    Mixers are available for live performances or studio recording, and each have
    very different specifications.


    Before leaving this section I must remind the reader to set aside funds for the
    purchase of miscellaneous items such as mic stands, racks for rack-mount-boxes
    (such as synthesizer modules and effects processors), baffles for quieting a sound
    source, headphones, and, of course, duct tape.


    # Software: Soundcard Drivers


    There are three main sources for Linux soundcard drivers: The OSS/Free kernel
    modules, the ALSA drivers, and the OSS/Linux package. Soundcards supported by
    these three sources are listed in the soundcards directory on the CD-ROM. For
    the latest installation instructions, see “Installing and Updating Drivers” below.


    In this section we''ll look at the pros and cons for each driver. If you already
    know which driver you want to use, you can skip to the “Setting Up Linux for Sound”
    section. If your driver is already installed, skip to the “Checking Your System
    for Sound Support” section. If you have no idea whether your soundcard is supported
    under Linux, or if you haven’t determined which card to purchase, see the soundcard
    support pages on the book’s CD-ROM.


    # The OSS/Free Driver


    +   - Authors: Hannu Savolainen, Alan Cox, Thomas Sailer, et al.

    - Version profiled: Versions for various kernels from 1.2.13 through 2.0.36

    - Web site: http://www.linux.org.uk/OSS/

    - FTP site: n/a

    - Maintained: Yes

    - Availability: Free, included with Linux kernel

    - License: GPL


    Modern Linux distributions usually ship with the basic kernel sound drivers (OSS/Free
    drivers) already compiled and ready to use as loadable modules. The Red Hat system,
    for example, comes with a nice configuration utility (sndconfig, shown in Figure
    2-1) that provides a simple menu-driven interface for selecting and installing
    the driver for your card (Mandra and SU offer similar sound configuration utilities).
    The OSS/Free modules are easy to configure, but the selection of cards they support
    is limited. Support for some cards’ range of features may be limited as well (see
    the CD-ROM).'
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_45_0.png)


    # ## ALSA Driver


    Authors: Jaroslav Kyselý (project leader)

    Web site: http://www.alsa-project.org

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: GPL


    The ALSA (Advanced Linux Sound Architecture) project is an ambitious team effort
    by developer Jaroslav Kyselý. At the time of this writing, it has evolved to level
    0.5.x and is considered by its authors to be in the alpha (first stage) of development
    (see the ALSA Web site for the current status reports). Nevertheless, it is already
    usable and, although it lacks an amenable configuration tool, it is becoming easier
    to set up and install (Figure 2-2 shows ALSA''s configuration utility). The ALSA
    drivers aim for complete implementation of their supported cards'' feature sets:
    Full duplex is present for any card that has, and support is available for digital
    I/O of certain cards (the Hooct 4Dwave, the RME Hammer, and the Creative Labs
    SBLive!). The ALSA drivers are free, and two very active mail lists provide excellent
    forums for reporting and resolving user-level and development problems.


    ALSA is considered by many users to be the future of Linux kernel sound support.
    Its PCM audio support is already excellent, a very powerful MIDI sequencer applications
    programming interface (API) is nearing completion, OSS/Free emulation is almost
    perfect, and the number of supported chipsets is growing. Perhaps most importantly,
    ALSA is open-source, and many talented Linux programmers continue to lend their
    skills to its development. The ALSA drivers will eventually replace OSS/Free in
    the kernel distribution, perhaps as early as the 2.4.x series.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_46_0.png)


    From the 2.2.x series onwards, the Linux kernel lets you configure sound system
    support without specifying particular driver modules. This feature makes it possible
    to install new drivers much easily, without having to reconfigure the entire system
    or rename/remove kernel sound modules already present. This amenity is especially
    agreeable to the ALSA package.


    # The OSS/Linux Driver


    Authors: Hannu Savolainen, Dev Mazumdar

    Web site: http://www.4front-technologies.com

    FTP site: n/a

    Maintained: Yes

    Availability: Commercial, binary-only

    License: Copyright held by authors


    The OSS/Linux driver is a commercial package available from 4Front Technologies
    Figure 2-3 shows its configuration utility. It sells for a base price of $20,
    with extra features available at somewhat higher cost. OSS/Linux is a greatly
    expanded version of the original OSS/Free drivers and is compatible with any application
    written for the Linux kernel drivers. OSS/Linux supports a much greater number
    of cards and chipsets than OSS/Free, and its configuration utility is simple and
    powerful. Cards can be autodetected, manually configured, and added or removed
    at will (without a system reboot). The 4Front package is distributed as a binary-only
    package with an automated installation. Purchasing OSS/ entitles the user to one
    year of technical support and two years of free upgrades. A trial version is available
    from the company''s Web site.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_47_0.png)


    Figure 2-3: 4Front''ssoundconf utility


    # ## Which Driver to Use?


    Your soundcard may determine which package you select: if only one of the packages
    supports your card, your decision is made for you.


    Beyond that, the answer depends on your needs and experience. The kernel modules
    approach (OSS/Free) has the virtue of being "out of the box" solution, but only
    if you have a supported soundcard (see the CD-ROM). I recommend the OSS/Free driver
    if you don''t want to build and install the ALSA drivers or if you don''t perform
    needs like full duplex.


    The ALSA drivers, like the OSS/Free, also cost nothing, but they are in heavy
    development and you may find them somewhat difficult to configure and install.
    However, I recommend the ALSA drivers if you want a cutting-edge open-source solution.


    OSS/Linux supports the widest variety of cards and chips with the greatest ease,
    but it costs money and is not open-source. Choose OSS/Linux if you want the simplest
    installation and maintenance procedures, or if it''s the only driver that supports
    your soundcard.


    If you''re not sure which package you should choose, I suggest starting with the
    OSS/Free kernel drivers. They are free, they are included with the kernel sources,
    and they are easy to configure and install.


    # ## Setting Up Linux for Sound


    Now that you''ve chosen the driver you want to use, you''re ready to configure
    the kernel for sound support.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'It is beyond the scope of this book to go over every detail of installing the
    sound software for the Linux kernel. However, some general guidance may reduce
    the confusion that can arise when you''re setting up the software. If you''ve
    already configured your kernel properly and are sure you have the right soundcard
    driver, you can skip to Chapter 3.


    # Configuring the Linux Kernel for Audio


    In this section I''ll show you how to configure the kernel audio subsystem. If
    you have already configured your kernel (or aren''t sure if it''s configured or
    what driver you have installed) and want to check your system to make sure everything
    is correct, skip to the "Checking Your System for Sound Support" section.


    Linux distributions usually include a precompiled kernel. Most distributions include
    a sound configuration utility that identifies, configures, and installs the appropriate
    modules (OSS/Free drivers) for your audio and MIDI system. However, you may need
    to recompile the kernel to support new hardware, update existing drivers, or set
    up the system for the ALSA drivers.


    Configuring and building a new kernel is not difficult, but it is beyond the scope
    of this book. For detailed instructions, see the Linux Kernel HOWTO at http://metalab.unc.edu/mdw/HOWTO/Kernel-HOWTO.html.
    When you have installed the kernel sources, read the sound system documentation
    in /usr/src/linux/documentation/sound for information concerning support for your
    hardware.


    # Kernel Configuration: Tips for a Better Audio System


    To make it easy to update and add drivers later, configure the kernel itself for
    module support.


    > If you intend to use the ALSA drivers you must enable sound system support,
    but without selecting a soundcard.


    When configuring the kernel for sound (usually near the end of the configuration
    process), you will be asked to identify your soundcard and the options for its
    driver. Consult your card''s documentation for default I/O address, IRQ (interrupt
    request) numbers, DMA (direct memory access) channels, and other settings. Select
    the appropriate options and enter the required values. You will be asked to choose
    whether you want the drivers to be compiled into the kernel or as loadable modules.
    The novice may find easiest to compile the drivers directly into the kernel, but
    more experienced users will want modular support. Driver modules can be removed,
    updated, and installed without recompiling the kernel.


    You will also be asked whether you want support for /dev/dsp and /dev/audio. They
    are the basic sound devices in Linux, and you will need them to record or play
    any digital audio.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Complete the configuration. Following the instructions in the kernel HOWTO,
    compile and install your new kernel.


    After the kernel is installed, run make modules to install the module object files.
    Then run make modules_install to install the modules and create the necessary
    entries in the conf.modules file (usually found in the /etc directory).


    # Check for Device Files


    Device files such as /dev/dsp and /dev/audio must exist for the sound devices.
    They are usually created during a Linux installation, and you can easily verify
    their existence. Enter ls -l /dev/dsp at the command prompt. The output should
    look something like this:


    ```

    lrwxrwxrxr-x 1 root root 9 Jun 13 2000 dsp -> /dev/dsp

    ```


    Entering ls -l /dev/audio should display something similar to this report:


    ```

    lrwxrwxrwxrx 1 root root 11 Jun 13 2000 audio -> /dev/audio

    ```


    If you didn''t get the outputs, you need to create the device files. Simply run
    the /dev/MAKEDEV script to rebuild the /dev directory contents.


    Keep in mind that finding the device files does not guarantee that your system
    is operable. The correct sound driver must be loaded for the sound devices to
    work.


    # Installing and Updating Drivers


    Installing and updating drivers is simple if you''ve enabled modular support.
    Follow the instructions for compiling the new driver (see the driver documentation
    in /usr/src/linux/documentation/drivers), then run insmod old-file. Install your
    new driver with insmod new-file.


    If you compiled your soundcard directly into the kernel, you have no choice but
    to reconfigure and recompile the kernel.


    # The Latest Driver Documentation


    As the Linux kernel develops, procedures for configuring the sound system may
    change. The latest documentation for the OSS/Free kernel sound drivers can be
    found in /usr/src/linux/Documentation/sound, the ALSA mini-HOWTO is on-line at
    http://www.alsa-project.org/~valent/Alsa-sound-mini-HOWTO.html, and the current
    OSS/Linux documentation is installed in /usr/lib/oss/doc.


    # Configuring Plug-and-Play Soundcards


    Many soundcards use the plug-and-play (PnP) protocol to configure the I/O address,
    IRQ, and DMA settings. Some older PNP soundcards used fixed settings or hardware
    jumpers: You can skip this section if you have such a card.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'As of version 2.2, Linux does not have PnP support in the kernel itself (it
    is expected in the 2.4 series). However, many distributions include the isnapptools
    utilities (to provide support for PnP cards, and many distributions preconfigure
    them).

    If you want or need to do it yourself, configuring a PnP soundcard is easy. At
    the command prompt, enter npdump > /etc/isnapp.conf. The settings for all your
    PnP devices will be defined in this file. You will need to uncomment the appropriate
    settings for your soundcard, avoiding values that conflict with other devices.
    Uncomment the (ACTY) line after each device you want to activate. Finally, run
    the isnapp/etc/isnapp.conf command to let your system know about the new configuration.
    You will need to run isnapp whenever you boot your system, so you should add it
    to one of your startup scripts (such as .bash_profile or .bashrc in /root or /home
    directory).


    # Configuring PCI Soundcards


    PCI (personal computer interface) boards are the most easily configured soundcards.
    You usually only need to select the driver for the card with no other special
    consideration, but some PCI conflicts have been reported. Often moving the card
    to another PCI slot fixes this problem. See the Audio-Quality HOWTO for Linux
    in the soundcards directory of the CD-ROM for more information about solving PCI
    problems.


    # Checking Your System for Sound Support


    Linux reads the contents of conf.modules when it boots and will report sound errors,
    such as lost modules and incorrectly configured PnP cards. You can study the boot
    messages at any time by running the dmesg command


    # What to look for if Your Driver Is Compiled into the Kernel


    If your driver is compiled into the kernel, look for messages like these:


    +   Sound initialization started

    Sound Blaster 16 (4.13) at 0x220 irq 5 dma 1,5

    Sound Blaster 16 at 0x330 irq 5 dma 0

    Yamaha OPL3 FM at 0x388

    Sound initialization complete


    If the "initialization started" and "initialization completed" lines are not displayed,
    the sound driver is not present in the kernel. Check that you actually installed
    your new kernel by entering the uname -a command at the prompt. If you did not
    update the LILO boot loader, you might still be running your previous kernel.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'If nothing is printed between the initialization start and complete lines,

    o sound devices were found. Your card may not be supported, you may have

    selected and installed the wrong driver, the I/O base address may be incor-

    rect, or you may not have configured your PnP soundcard.

    Also look for any messages displayed by the sound driver during bootup

    that might give you a clue to potential problems.


    # What to Look for if You''re Using Loadable Sound Driver Modules


    If you are using loadable sound driver modules, look for these messages at

    your system startup:


    Finding module dependencies... done

    can''t locate module sound

    can''t locate module midi


    The above indicates that module dependencies were reported for sound

    of MIDI without error, but the actual object code modules.o and

    midi.o were not found. This error usually means that you didn''t make

    modules_install after compiling the kernel. On my system, the sound modules

    are located in /lib/modules/2.0.36/misc. If you''re sure you compiled and\installedinstalled
    sound modules but don''t know where they were, type find *

    name sound.o (or midi.o) at the prompt to search your entire system for the

    missing modules. If found, place them in /lib/modules/(kernel-version)/misc

    or /lib/modules/misc.


    # Checking whether Audio Is Properly Configured


    To check whether audio has been configured properly (or at all) for your

    Linux system, you can run some simple tests at the command prompt.

    If you''re using the OSS/Free or the OSS/Linux drivers, you type cat /dev/

    dstat at the command prompt. On my system, this yields the following:


    Audio config:

    EnseniqAudioPCI / Sound Blaster PCI at 06100 irq 11

    Roland MPU-401 at 0330 irq 9

    Generic PnP support SoundBlaster PnP at 0220 irq 5 drq 1,5

    Emu 8000 Synthesizer Engine at 0620


    Audio devices:

    0: EnseniqAudioPCI (DUPLEX)

    1: EnseniqAudioPCI (playback only)

    2: Creative AWE64 PnP (4.16) (DUPLEX)

    3: SB secondary device (DUPLEX)


    Synth devices:

    0: AWE32-0.4.2 (RAM512k)


    Midi devices:


    28 Chapter 2'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# AudioPCI


    1: MPU-401.0.0 Midi interface #1


    Timers:


    0: System clock


    Mixers:


    0: Ensoniq AudioPCI


    1: Sound Blender


    2: AWE32 Equalizer


    Let''s look at this report in some detail. The card configuration section tells
    me that I have a Sound Blender PCI128 (also known as the Ensoniq AudioPCI), a
    true Roland MPU-401 MIDI interface (my MIDI Quest MQX32M standalone interface),
    a Sound Blender PnP card (a Sound Blender AWE64), and an EMU8000 (the on-board
    synthesizer for the AWE64). Audio I/O devices are found on the PCI128 and the
    AWE64, and their full-duplex status is noted. The synth device is the EMU800 on
    the AWE64; it is compatible with an earlier incarnation of the card, hence the
    reference to the AWE32. MIDI ports are found on the PCI128 and the MQX32M. The
    system clock is used to coordinate audio timing signals (necessary to control
    the flow of audio in and out of the device). Finally, support is provided for
    the mixing capabilities of the PCI128, the AWE64, and a special equalizer for
    the AWE32 synth (the EMU800). The default device selection is the first listed
    device, so firing up the auxmix mixer software would report the card capabilities
    of the PCI128.

    On a system using the ALSA driver, type cat /proc/asound/cards and cat /proc/modules
    to determine what cards and services are installed. Here''s the report for a system
    with a Sound Blender16 installed:


    ```

    cat /proc/asound/cards

    0 [card0] : SBl16 - Sound Blender 16 Sound Blender 16 at 0x220, irq 5, dma 185

    ```


    ```

    cat /proc/modules

    snd-pcm-oss 4 0

    snd-sb16 1 1

    snd-sb-dsp 4 [snd-sb16] 0

    snd-pcm1 4 [snd-pcm1 snd-sb-dsp] 0

    snd-pcm 3 [snd-pcm1 snd-sb16 snd-sb-dsp snd-pcm1] 0

    snd-mixer 3 [snd-pcm1 snd-sb-dsp] 1

    snd-mpu401-uart 1 [snd-sb16] 0

    snd-midi 4 [snd-sb-dsp snd-mpu401-uart] 0

    snd-optl3 1 [snd-sb16] 0

    snd-synth 1 [snd-optl3] 0

    snd-timer 1 [snd-optl3] 0

    snd 8 [snd-pcm1 snd-sb16 snd-sb-dsp snd-pcm1 snd-pcm-mixer]

    snd-mpu401-uart 0 snd-midi-snd-midi3-snd-timer 0

    ```'
