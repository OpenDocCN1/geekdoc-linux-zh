    from the CD-ROM that accompanies this book.

    Move it to /home or /usr/local directory and unpack it with tar xzv aumix-latest.tar.gz.
    Move into your new aumix directory and follow the instructions there for building
    and installing the program. Run ./configure --help to check the configuration
    options, then run ./configure; make; make install. If all goes well, you should
    now have a new copy of aumix.


    > You will encounter the configure/make/make install sequence of build instructions
    many times throughout this book. You will remain a normal user for the configure
    and make steps, but make install will require you to become the superuser by running'
