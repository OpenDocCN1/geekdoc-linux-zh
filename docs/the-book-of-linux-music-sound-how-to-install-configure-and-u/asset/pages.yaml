- pgno: 30
  md: '# BASICS OF DIGITAL AUDIO


    ![](img/43a9671cef617c9c7a18f7a6904433f1_30_0.png)


    # Essential Theory


    Understanding a few key concepts will help you obtain optimum audio from your
    system. For more of the technical details of digital audio theory, read one of
    the books listed in the bibliography—


    I especially recommend Computer Music: Synthesis, Composition, and Performance
    by Charles Dodge and Thomas A. Jerse.


    # Pulse-Code Modulation


    PCM (pulse-code modulation), the process of converting an electrical impulse into
    a stream of numbers, is the cornerstone of the digital audio capabilities of your
    soundcard. When you record (or sample) a digital audio file using your soundcard,
    a microphone converts a sound pressure wave into an electrical signal and sends
    it to the soundcard''s analog-to-digital converter (ADC),


    > 1 Dodge, C. and Thomas A. Jerse. Computer Music: Synthesis, Composition, and
    Performance. 2nd ed. New York: Schirmer Books, 1997. ISBN 0-02-84682-7.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'a clever device that connects the electrical (analog) current into a numerical
    (digital) stream. The ADC performs its magic by measuring the electrical current''s
    voltage at regular periods of time (usually in ten-thousandths of a second); this
    sampling process is what signal-processing engines call code modulation. "CD-quality"
    sampling, a common recording technique that uses samples at a frequency of 44,100
    Hz (44.1 kHz) with a resolution of 16 bits. The sampling frequency determines
    the upper limit of the frequencies measured (see "The Nyquist Theorem below”),
    and the bit resolution determines the upper limit to the dynamic range at 6 dB
    per bit yields a 96 dB dynamic range.


    In plain English: CD-quality recording samples assign an input signal for its
    changes 44,100 times per second and assigns each sample a 16-numerical value.


    Not surprisingly, playing a digital audio file is simply the reverse process of
    recording one. A stream of numbers representing variations in an electrical impulse
    is sent to the soundcard''s digital-to-analog converter. The DAC converts these
    numbers into electrical impulses that are sent to the soundcard''s output jacks
    and to an amplifier and speakers. The speakers are vibrated by the electrical
    energy to create a sound pressure wave identical to the original recording. The
    sound pressure wave vibrates the membranes, hairs, and bones in your ear—and you
    hear the music.


    Most soundcards can record and play PCM files (the popular WAV and AIFF formats
    use PCM). Many cards can record with sampling rates up to 48 kHz, but playback
    is usually limited to 44.1 kHz. For most project recordings, the CD-quality sampling
    rate and bit-resolution will do quite well.


    > Your mixer application, which adjusts the settings of your soundcard, will display
    faders (the sliders used to adjust settings) that control the master volume, CD
    player volume, PCM output strength, and (sometimes) treble and bass response—so
    they''re all for tweaking.


    # The Nyquist Theorem


    The Nyquist theorem says that for any signal''s frequency range to be sampled
    accurately, the sampling rate must be at least twice the peak of the frequency
    range. Given that the normal range of our hearing is from 20 Hz to 20 kHz, a sampling
    frequency of 40 kHz is required to reproduce accurately the range of sound audible
    to the human ear. Some soundcards will record up to 48 kHz, but for most purposes,
    CD-spec audio (44.1 kHz) is sufficient. When a sampled frequency range extends
    beyond the sampling rate (recording a symphony at 11 kHz, for instance), the upper
    frequencies will fold back into the signal as unovable aliasing (and probably
    undesirable) noise. Filtering cannot remove aliased sound once it is recorded,
    so most sampling devices provide a low-pass filter before the ADC in order to
    eliminate such unwanted frequencies.'
  merge: -1
  img_proc: true
