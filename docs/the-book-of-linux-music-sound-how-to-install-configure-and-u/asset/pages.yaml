- pgno: 218
  md: '# 9-11: Cecilia''s editor window


    The Cecilia editor is the Csound programming heart of the application. By closely
    studying the editor for the original my_first.cec module, you can see how the
    interface components are related to the elements of both the instrument and the
    score. This design is very powerful: The grapher can control the amplitude, pitch,
    and waveform factors at the same time that it controls the tempo, event duration,
    total duration of the piece, and density of events (performance-level factors).


    The editor is divided into three panels: one for the interface, one for the instrument,
    and the score. Panels are opened and closed by pressing their buttons, which appear
    just below the menu bar.


    # The Interface Panel


    Compare the elements of the interface panel (the top panel in the window labeled
    Cecilia Editor GyExample in Figure 9-1) with what you see in the grapher in the
    same. The last line in the panel reads csider total_time-un s -res 1 -min 5 -max
    240 -init 30, and the grapher shows a slider labeled total_time, sitting at a
    value of 30 seconds (-un s the unit of movement to seconds). Move the slider to
    the right until it stops at 240, its maximum value. Note that when the slider
    moves, it increments or decrements by units of 1. Bring the slider to the left
    until it stops at its minimum value of 5. Every part of the csider definition
    is clearly seen in the graphic slider.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_218_0.png)'
