    # # Speak Freely


    +   Author: John Walker

    Version profiled: 7.1

    Web site: http://www.fourmilab.ch/speakfree/unix/index.html

    FTP site: n/a

    Maintained: Free, open-source

    License: public domain


    Case summary: Turns a soundcard and microphone into a network telephone

    Speak Freely turns your Linux box into a network telephone and does so extremely
    well. If you and your friends have Speak Freely installed on your local machines,
    you can call each other over your network connection. The difference between making
    a telephone call and using a computer network is that the computer network call
    uses soundcard for audio services (sound input/output), the network connection
    for the carrier line, and Speak Freely for the software agent that makes it all
    work together. Whether your needs are corporate-wide or just buddy-to-buddy, Speak
    Freely is your “must-have” Linux network telefono solution.


    # ## Getting It, Building It


    Get the sources from this book''s CD-ROM and the Speak Freely Web site at www.fourmilab.ch/speakfree/unix/index.html,
    place the package in your /home or /usr/local/ directory, and unpack it with `tar
    xzv speak-freely-latest.tar.gz`. Enter the new `Speak Freely` directory and study
    the README and INSTALL files before attempting the build. Compiling Speak Freely
    is easy (it requires only common libraries found in every mainstream Linux distribution),
    but be sure to read the Makefile and edit it to accommodate your specific hardware.
    Run `make` and (as root) `make install` and you are all set to make that first
    call.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Using Speak Freely


    Speak Freely is a software suite that includes the following command-line applications:


    +   * sfecho: Echoes transmission back to host; debugging tool

    * slaunch: Opens audio device, starts mic and speaker applications (sfmike and
    sfspeaker)

    * sflwl: Look Who''s Listening client; lists users connected to LWL server

    * sflwld: The LWL server daemon

    * sfmike: Sound transmission utility

    * sfreflect: Conference call reflector

    * sfspeaker: Sound reception utility

    *ovod: Voice-on-demand server


    Speak Freely''s excellent man pages provide complete descriptions and explanations
    for these programs and their command options. For our look at Speak Freely, we
    will limit ourselves to initiating, controlling, and terminating a telephony connection
    over a TCP/IP network with slaunch.


    # Starting slaunch and Testing Speak Freely


    Start slaunch from the command prompt in an xterm or on the Linux console. You
    should see the following:


    ```

    $dlphilp@localhost]$ slaunch localhost.localdomain:2074

    Space bar switches talk/pause, Esc or "q" to quit, "." for chat text

    Pause:

    ```


    At this point, simply press the Spacebar to initiate a talk connection over your
    network loopback device on port 2074 (the default). Test your connection by pressing
    the space bar and saying a few words into your microphone. After a slight delay,
    your voice will come back through your speakers. If Speak Freely seems to be doing
    everything it should but you hear nothing, make sure your soundcard mixer levels
    are far enough and that the mic input is selected for Record.


    # Connecting to a Network IP


    To connect to a network IP address, issue the following command:


    ```

    $dlphilp@localhost]$ slaunch 209.149.133:2074

    ```'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'The above command uses an IP address in its “dotted quad” form (four decimal
    numbers separated by dots), but you can just as easily use a domain name instead,
    in this example:


    ```

    [dlphil@localhost]$ sflauch brutus.myown.net:2074

    ```


    Course, your intended receiver must also have Speak Freely installed and set to
    your network address and port in order to hear and respond to your transmission.


    In addition to voice, you can send chat text and even music over a Speak Freely
    connection (see the sflauch manual page for more details). However, Speak Freely
    is most commonly used as machine-to-machine telephony software. As with the other
    programs reviewed in this chapter, your available connection speed and bandwidth
    will determine the quality of your network audio. If your network connection is
    a dial-up Internet service provider (ISP), you might want to explore the various
    compression schemes in Speak Freely to minimize latency and fragmentation of your
    sound.


    # sfwld and sflwl


    The sfwld and sflwl programs deserve special mention. sfwld is a daemon a server
    runs as a background process that will automatically add your name and IP address
    to a database on an LWL-compliant machine (LWL is the Look Who’s Listening software
    that builds the database of registered users). Using the sflwl connection, you
    can see who is available for a Speak Freely connection, and your address will
    also be available for others to call.


    # Speak Freely and X


    The console works fine with Speak Freely, but if you prefer a fancy GUI you can
    choose between a Tcl/Tk interface (Shawn Pearce’s xspeakfree, available from http://www.spearse.org/projects/xspeakfree/)
    and one for Java (Neil Clayton’s JSF, available from http://www.germane-software.com/SpeakFreely/jsf/index.html).
    Features 12-7 and 12-8 show the xspeakfree and JSF front-ends at work.


    The GUIs introduce new features, but they do make using Speak Freely a little
    more transparent. Note that you must have Speak Freely installed to use the GUIs,
    because they are simply front-ends for the console commands.


    # Need More Information?


    Speak Freely has been in development since 1995, it is stable and feature-rich,
    and is still maintained. The original program documentation is excellent, and
    Sean Russell’s page at www.germane-software.com/SpeakFreely/ is dedicated to disseminating
    information about running Speak Freely specifically under Linux.'
  merge: -1
  img_proc: true
