  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_74_0.png)


    designs an analysis-derived filter that will recreate the original waveform of
    the sound, retaining the formants of the sound''s spectral envelope (the relative
    strengths of the sound''s spectral frequencies). Because formant positions and
    strengths indicate age and gender of a voice, the technique has been especially
    useful in speech synthesis.


    For your first experiment with LPC, load a short (about 4- or 5-second), 16-bit,
    44.1 kHz soundfile of a speaking voice, then select LPC Analysis from the Analysis
    menu. The window shown in Figure 4-8 will appear.


