- pgno: 172
  md: '# 8

    MULTITRACK HARD-DISK

    RECORDING AND MIXING


    ![](img/43a9671cef617c9c7a18f7a6904433f1_172_0.png)


    A multitrack hard-disk recording system facilitates the recording and mixing of
    multiple tracks of digital audio on a computer''s hard disk. Recording to disk
    has many advantages over the older method of multitrack recording to analog tape:
    CD-quality digital audio is cleaner than tape, with much greater dynamic response
    (better recording of very soft and very loud signals), and random access allows
    immediate record and play from any point in your songfile. And the hardware required
    for multitrack hard-disk recording is not inaccessible: Large, fast hard disks
    (10 gigabytes and larger) are inexpensive these days, as are fast CPUs. Linux
    can claim a number of excellent hard-disk recording systems to take advantage
    of this hardware bounty. In this chapter we will look at three of those systems:
    SLab, Multitrack, and Mix.


    # Which Program Should I Use?


    Selecting the multitrack recorder/mixer that works best for you depends on your
    specific background and needs. Course, considering that they are priced at $0.00
    each, you could just try them all and decide which one you like best—but you may
    not have the time to do so. Each of these programs will be strong in particular
    ways: Slab will appeal immediately to users familiar with recording in a tape-based
    studio, Mix is best suited to complex arrangements'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# SLab


    Author: Nick Copeland

    Version profiled: 3.10-3b

    Web site: http://dutw1288.wbmt.tudelft.nl

    FTP site: ftp://dutw1288.wbmt.tudelft.nl/pub/audio/

    Maintained: Yes

    Availability: Free, binary-only

    License: Held by the author


    Capsule summary: Feature-rich recording system excellent for medium- to large-scale
    recording projects


    Slab is a direct-to-hard-disk recording studio with an amazing set of features,
    including a 64-track mixing console (with selectable 64/16/8/4/2 track configuration),
    a large variety of per-track processing options (including DSP effects, dynamics
    processing, and digital filters), a handy soundfile editor, and the ability to
    record up to 16 simultaneous tracks. No other multitrack system for Linux offers
    Slab''s variety of options and features.


    Slab is easy to use, even for the complete beginner, but its features should meet
    the needs of a professional digital audio recording and mixing studio. If you''re
    looking for a multitrack hard-disk recording suite that has a flexible user interface,
    is capable of handling up to 64 tracks, and offers modular effects processing
    and support for advanced soundcards as the SlabLive!, then Slab is definitely
    for you.


    > Various configuration resources optimize Slab''s performance for a wide range
    of CPUs, and it is flexible enough to work well on relatively low-powered machines
    (it was originally developed on a Pentium 133).


    # Getting It, Building It


    # Configuring Slab


    Slab opens to the display shown in Figure 8-1.'
