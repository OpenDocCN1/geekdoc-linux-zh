    \ for unofficial versions)\nFTP site: ftp://ftp.maths.bath.ac.uk/pub/dream (official);\f\
    tp://mustec.gsu.edu/pub/linux (unofficial)\nMaintained: Yes\nAvailability: Free,\
    \ open-source\n\nLicense: Copyright held by the Massachusetts Institute of Technology\
    \ (MIT)\nCapsule summary: Most popular SWSS language, with the greatest range\
    \ of opcodes (operations and instructions) and widest variety of software support\n\
    Csound is an exceptionally powerful general purpose digital audio language. It\
    \ can be used to design new computer-based instruments, or it can analyze synthesizing\
