    interfaces, but they were originally designed for use at the command line (many
    users prefer using the command-line versions). You can create an excellent music
    and sound development environment using only the Linux console, so I have intentionally
    profiled a number of console applications for readers who prefer working from
    a command line.


    # A Word about Versions versus the CD-ROM


    Linux is a fast-moving target, with major kernel upgrades occurring frequently.
