- pgno: 294
  md: '# Setting Up a System


    Type in ax tern window. A single module will appear containing the BPM (beats
    per minute) tempo slider, and a menu bar with File and Modules (shown in the upper
    left corner of Figure 10-25). Your first arrangement of Aube modules will be designed
    to drive an additive synthesizer by a note-sequencer, adding some delay to the
    sound and mixing the synthesis and delay outputs to the final audio output stage.
    Select the following modules from the BPM window''s Modules menu and set their
    inputs according to Table 10-2.


    # Table 10-2: Aube module input settings


    | Module | Input |

    | --- | --- |

    | Atonal Loop | (None) |

    | Syre | Atonal Loop |

    | Delay | Syre |

    | Mixer | Syre/Delay |


    The resulting Aube audio chain, Sequencer • Synthesizer • Effects Unit • Mixer
    Output, is shown in Figure 10-25. Bear in mind that this chain is only one possible
    arrangement. Each module that receives input can select from any of the output
    sources (Syre, the delay line, and the mixer in this example), and the mixer expands
    to accommodate more generators as needed.


    Activate this structure by clicking the On button in the top left corner of each
    module, saving the Line Out module for last. Before turning on the outline, bring
    the mixer''s master volume down to the half-way point or lower to avoid any sudden
    spike in the audio output. (An audio spike can potentially damage your speakers.)


    Because the settings are self-explanatory for the mixer, the delay line, and the
    output module, we''ll take a closer look at just the modules for the sequencer
    and the synth.


    # The Sequencer


    The Atonal Loop module (Figure 10-26) is a simple looping pattern sequencer. Its
    basic loop is a sequence of four beats, divided into four parts (that is, sixteenth
    notes in 4/4 time). The slider determines the pitch, and the button beneath each
    slider toggles the accented and unaccented beat. A beat is silent if the slider
    is at the 0 position.


    # The Synthesizer


    Additive synthesis is the technique of adding different sine waves together to
    create a sound. But because additive synthesis requires at least 24 sine waves
    to'
