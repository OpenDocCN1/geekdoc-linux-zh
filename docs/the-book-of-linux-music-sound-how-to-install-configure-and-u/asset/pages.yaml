  md: '# Oolaboola


    Author: Eric S. Tiedemann

    Version profiled: 0.2.0

    Web site: http://www.hyperreal.org/~est/oolaboola

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: GPL


    Capsule summary: DJ mixer suitable for live performance or studio recording work

    oolaboola, an open-source cyber-shamanic noise-maker, is a system for mixing sounds
    in real time that also lets you alter the speed and volume during playback. In
    other words, it is a software mixer ideally suited for the Linux digital Dj.


    # Getting It, Building It


    Copy the oolaboola-latest.tar.gz from this book''s CD-ROM or download the latest
    version from Oolaboola''s Web site. In an empty directory, unpack it with tar
    xzvf oolaboola-latest.tar.gz and read the instructions for compiling and setting
    up the program. Oolaboola uses the Python language library and header files, so
    you will need to install Python before building Oolaboola. Python is packed with
    most Linux distributions, and the latest version is available from www.python.org.
    You will also need a version of the GIMP Toolkit (GTK) higher than 1.2.1. GTK
    is also bundled with most Linux distributions, but you can retrieve the latest
    version from www.gtk.org. Finally, you will need the Python/GTK bindings from
    ftp://ftp.gtk.org/pub/gtk/python/


    When all the other pieces are in place, move to the oolaboola-latest directory.
    Run ./configure -help to see the available options for the configuration process.
    Then run ./configure followed by make install (you must be the root user for the
    installation). Type oolaboola in any open window to start the program. You should
    hear Eric Tiedemann singing the Oolaboola theme once through. If you don''t hear
    Eric, double-check all your connections and settings and make sure that you have
    installed the latest versions of Python, GTK, and the PyGTK software.


    # Playing Oolaboola


    Figure 13-1 shows Oolaboola''s self-explanatory interface as it appears on startup.
    Each panel has its own file selector and sliders for volume, sample playback rate,
    and position within the selected soundfile. Soundfile length is displayed along
    with the amount of the file played and the amount remaining. You can control Oolaboola
    with the mouse, the keyboard, and a MIDI input device as a synthesizer or MIDI
    fader box. The program comes when all of these controls are utilized during realtime
    playback.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_334_0.png)


    Play may be paused and restarted at either by moving the cursor to the Pause control
    and pressing ENTER, by clicking on the button with the mouse pointer, or if the
    MIDI device /dev/midi is available, by pressing middle C and the D above it on
    a MIDI keyboard (respectively starting and stopping play). The Oolaboola manual
    page describes each of the program''s control interfaces (mouse, keyboard, MIDI
    input) in detail. Type man ooola in an xterm window for a list of controls.


    You can move one second forward or backward in the soundfile with the right and
    left arrow keys. CTRL-ARROW increases the position increment to 10 seconds, ALT-ARROW
    reduces the increment to 1/10 of a second, CTRL-ALT-ARROW reduces it to 1/100
    of a second. The Home and End keys move the position pointer to the beginning
    and end of the soundfile, and a cue channel toggle controls which player''s output
    is set to the cue channel (a channel waiting to be cued for its entry into the
    mix)


    To get a feel for operating the program, play with the various controls on the
    ooola.wav file loaded at startup. The GUI is intuitive and easy to navigate, so
    you will soon master the basics of Oolaboola.


    # Using Oolaboola


    Before you record anything, familiarize yourself with the program by working with
    two soundfiles at the same time (without selecting a file for recording). First
    load soundfiles into each of the player panels. Each file will autoplay once through.
    Press Loop Set (shown in Figure 13-1) to start playing a file again and Press
    Loop Clear to stop loop playback. You can manually start both'
