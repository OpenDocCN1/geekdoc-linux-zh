  md: 'Figure 5-4: The Sample Editor


    Figure 5-5: SoundTracker''s Instrument Editor


    # Instrument Editor


    Figure 5-5 displays the Instrument Editor, which lets you edit the volume and
    pan envelopes on the sample while the song or pattern is playing. This editor
    also provides a keyboard for mapping your samples across an instrument''s range.


    # Closing Remarks


    SoundTracker continues to grow in power and flexibility. It is consistently maintained
    by its author, often incorporating features and fixes submitted by users. Performance
    is quite stable, and as you have seen, the program is'
