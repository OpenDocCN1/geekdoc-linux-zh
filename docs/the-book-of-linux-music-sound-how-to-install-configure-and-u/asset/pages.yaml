- pgno: 293
  md: 'power in that description. In one easy-to-use environment, you will find this
    shopping list of features:


    **Instruments** A virtual keyboard (Simon Kagedal''s clavier again), a drum machine,
    a loop sequencer;


    **Applications** A rudimentary tracker (that will generate random sequences);
    a module for sequencing samples (with arbitrary control input); Syre, an additive
    synthesizer; a sample recorder.


    **More toys** A white noise generator, a resonant pass filter, effects modules
    for delay (echo), normal panning (left-right placement in a stereo field), and
    a four-way panner for a "false quadraphonic" sound.


    **Support** Available for OSS/Free and OSS/Linux drivers (coming soon: support
    for ALSA and ESound).


    Aube is exceptionally easy to build, install, and use. The entire program is great
    fun as well as serious software for making music in Linux. You may be specially
    interested in Aube if you''re a dance composer (Aube has excellent sequencing
    aids) or if you''re interested in learning more about synthesis.


    # Getting It, Building It


    Aube requires the Gtk development libraries and header files, available for free
    from www.gtk.org. It also requires Michael Pruett''s libaudofile, available for
    free from www.gnome.org. These packages must be installed before you can build
    Aube. Check the Aube Web site for an up-to-date list of any other required packages.


    After retrieving the package from this book''s CD or from the Aube Web site, unpack
    it in your /home directory or /usr/local/, or wherever you prefer to unwrap your
    new Linux packages. Enter tar xzvf aube-latest.tar.gz to create a new Aube directory
    and then run ./configure to see what configuration options are available. Run
    ./configure, then make. Become the root user, make install, and you will have
    the beast at your command.


    # Using Aube


    Aube is a collection of modules—controllers, generators, sequencers, filters,
    effects, mixers, and input/output ports—each which performs some specific function
    in the system. Making sound in Aube consists of creating a sound generator, connecting
    it to a controller or sequencer, adding effects or filtering, and mixing audio
    channels to send to the output stage. This profile focuses on Aube as a realtime
    software synthesizer, so let''s set up an Aube system using the Syre additive
    synthesis module for our sound generation engine.'
