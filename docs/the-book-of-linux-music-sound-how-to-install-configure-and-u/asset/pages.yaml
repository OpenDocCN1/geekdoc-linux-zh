    # Harmony Browser


    As a final flourish to our random manipulations, we will employ the unique Harmony
    Browser. Using this tool, you can drop chords anywhere into the music: Simply
    select a starting note and associated chord in the Harmony Browser''s chord selector
    box, then click in the Note editor window at the point you want to drop the chord.
    Complex harmonic passages can be quickly arranged this way. Figure-11 shows the
    chord selector (with an Am7 chord highlighted), the Harmony Browser Help page,
    and piano roll editor with the results of adding three chords into the track.


    Chords can be auditioned in the Browser window and pasted anywhere in the piano-roll
    editor, making a simple task out of the work of harmonizing a melody line. Like
    the other generators and randomizers, the Harmony Browser has other options, too
    many to investigate here, that modify its effect on tracks; the well-planned graphic
    interfaces and the online help encourage experimentation.'
