  md: '# The Linux Music & Sound Applications Pages


    This contains the most recent edition of my Web site, including links to more
    than 700 sites containing Linux audio and MIDI software, documentation, and discussion
    groups. Open linux_soundapps.html to view the site''s main page.


    # Documents (/docs)


    +   - Sound HOWTO

    - Sound Playing HOWTO

    - Audio Quality HOWTO

    - Sound Blaster AWE HOWTO

    - Quake HOWTO

    - MP3 HOWTO

    - ALSA Mini-HOWTO


    # Extra Programs (/extra)


    This directory contains all of the following:


    # LinuxPPC Audio Software


    +   - Lilypond Music notation typesetting from GNU

    - Snd Soundfile editor

