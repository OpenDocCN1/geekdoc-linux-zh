  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_137_0.png)


    # Graphic Controller Edit Windows


    Before leaving the MIDI side of Jazz++, we should look at the graphic controller
    edit windows. These functions will be immediately familiar to anyone who has used
    sequencers in Windows or on a Mac. Editing controller data by drawing curves with
    the mouse is very intuitive, and Jazz++ provides graphic editing for pitch bend,
    mod wheel, and other continuous controllers. The program also provides graphic
    editing for aftertouch, velocity, and song tempo. Figure 6-12 gives us a view
    of the graphic editor for MIDI Volume (continuous controller #7), attached to
    the starting measures of Track 2 in our example.


    # Jazz++''s Digital Audio Features


    Jazz++ provides extensive support for digital audio, as our next edits will demonstrate.
    The combination of MIDI and digital audio features is useful if you want to add
    vocals or acoustic instruments to your recorded MIDI tracks. Before we can use
    the audio features of Jazz++, we must first select a track and declare it audio
    track. From the Audio menu we select Global Settings to enable audio support and
    set the parameters for audio recording and playback. Figure 6-13 shows the track
    definition window and the global audio settings.


    Now open the Sample Settings dialog and we and attach some soundfiles to MIDI
    note numbers. If any of those numbers are encountered in the audio track, the
    corresponding sample will be played. Figure 6-14 displays a typical arrangement,
    with soundfiles attached to MIDI note numbers'
