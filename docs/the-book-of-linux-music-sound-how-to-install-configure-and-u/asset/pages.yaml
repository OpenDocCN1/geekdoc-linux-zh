    # TiMidity++


    Authors: Tuuka Toivonen, Masanao Isumo

    Version profiled: 2.7.0

    Web site: http://www.goice.co.jp/member/mo/timidity/

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: GPL


    Capsule summary: Renders MIDI file to audio in realtime, with wide range of controls
    for effects and other playback options


    Because soundcards do not have on-board synthesizers or have only a low-quality
    hardware device for use with MIDI files, getting good MIDI output can be a problem.
    TiMidity, a MIDI-to-WAV converter that currently runs on Linux, FreeBSD, HP-UX,
    SunOS, and Win32 systems, solves this problem. By using the audio device of a
    soundcard to play MIDI files (i.e., by converting a MIDI file to a PCM stream
    and playing it through a soundcard device), TiMidity enables even a lower-quality
    card to render high-quality audio for MIDI file playback.


    TiMidity utilizes patches in the Gravis Ultrasound (GUS) patch format for its
    sound sources. Conversion with TiMidity is very fast, and its output is excellent.
    Since Tuuka Toivonen ceased TiMidity, it has been superseded by a distributed
    development project led by Masanao Isumo. TiMidity++ is a great advance over the
    original program.

    TiMidity++, included with many popular Linux distributions, is in continuous development
    and improves with each release. It can be used on almost any Linux machine, from
    a 3866X to the latest screamer, requiring only a soundcard capable of PCM audio.
    I consider TiMidity++ an essential piece of Linux sound software.


    # Getting It, Building It


    After retrieving the package from this book''s CD or the TiMidity++ Web site,
    unpack it with tar xzv TiMidity-latest.tar.gz.'
