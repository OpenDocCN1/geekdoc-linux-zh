  md: '9. Click on the open-hand icon (at the left end of menu bar), indicating that
    the patch is ready for performance, and it will turn into a closed hand. The menu
    bar will also disappear. Click on the start box and you will hear a steady wave
    at 440 Hz. Click the stop box and the sound will halt.


    10. Congratulations, you''ve built and run your first jMax patch!


    # Editing a jMax Patch


    Editing a patch is easy. Cut/copy/paste operations are available, and groups of
    icons can be selected for block edits. Holding the SHIFT key while selecting icons
    will place them into a group, as well as drawing a box around a group of icons.
    Groups can be moved around the canvas, and the Patcher window will scroll sideways
    and up or down automatically to accommodate icons and groups as you reposition
    them. The selected icons can then be moved, deleted, and duplicated wherever you
    like.


    # jMax Performs: A Complex Example


    jMax patches can become quite complex. The jMax package includes some very interesting
    examples, and many patches written for the original Max program with jMax two.
    Figure 10-24 illustrates more complicated jMax patch (included with the jMax package)
    that creates a complex sound that is continuously modulated by a variety of means,
    including random data generators, interactive presets, and user-controlled sliders.
    It also provides a volume slider for MIDI-controllable mixer.


    To set all in motion, first click on the Toggle for the randnotes boxes (the square
    labeled "toggle randomizations" at left center), then click the start box (at
    lower left). A random sequence of notes will trigger the patch (the various osc
    boxes); if you move the slider or click on any of the tempo presets, you can change
    the tempo of the output. If you have a MIDI-controlled mixer, you can edit the
    ctout Object to control its parameters (it sends controller data to MIDI devices)
    and remotely manipulate the device from jMax by moving the slider attached to
    ctout. If you want to explore more complex patches, a useful set of Max tutorials
    is available from http://www.ircam.fr/equipes/temps-reel/fts/doc/tutorials/SignalObjectTutorials.


    # Summary


    Simply put, jMax is terrific. I consider it one of the best reasons for getting
    into the world of Linux music and sound. jMax is exceptionally designed and is
    easy to learn and use. By drawing the legacy of the Max iconic programming language,
    jMax provides the user with excellent documentation and examples to speed up the
    learning process, and the program is certainly rich enough in features to keep
    you occupied for a long time. The developers have'
