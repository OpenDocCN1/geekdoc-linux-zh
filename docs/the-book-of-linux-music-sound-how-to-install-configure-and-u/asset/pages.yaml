    # Using RTSynth


    MIDI control of RTSynth is quite flexible. The program will read MIDI input from
    a pipe from stdin (the command line), a named pipe (FIFO), or a device such as
    /dev/midi. MIDI messages currently recognized by RTSynth include Note-On, Note-Off,
    All Notes/Sounds Off, Velocity, Hold Pedal, Volume (controller #7), Pitch, and
    Pan. The default output device is /dev/dsp, but the default I/O devices can be
    replaced by specifying the required alternatives at the command line.


    If you start RTSynth with RTSynth in an xterm window, the program appears in normal
    operation mode, reading events from /dev/midi00 and routing the synthesis output
    to /dev/dsp. Figure 10-11 shows the program opened with the default tiles (the
    icons are called tiles) for the string synthesizer, flute synthesizer, and the
    effects.


