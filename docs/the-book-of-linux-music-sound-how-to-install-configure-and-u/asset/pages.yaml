- pgno: 290
  md: '# Building a jMax Patch


    Now that you know the available tools and how to find out what they do, you are
    ready to build your first jMax patch.


    +   1. If any jMax patches are open, close them. Select File • New from the Console
    window, and a new Patcher window will open, ready for editing.

    2. Left-click on an Object icon and move the cursor into the canvas (the blank
    area underneath the icon menu). A cross-hair cursor will appear, and another mouse
    click will drop the icon at the location of the cross-hair cursor.

    3. Click on the newly dropped box again, type osc1~ into it, then click any-where
    outside the icon to accept this definition.

    4. Bring another Object box into the canvas, drop it, and define it by typing
    tac~ into it. After defining the boxes, small black tabs will appear on both of
    the Objects: These are the input/output ports for the defined function: Tabs on
    are input points, tabs on the bottom are the output points.

    5. Move the cursor over one of the tabs, and the tab will immediately become active.
    To create a connecting wire, hold the mouse button down while over the i/o tab
    at the bottom of the osc1~ box and drag the “wire” to the left input tab of the
    tac~ box.

    6. Repeat the connection for the right tac~ input.

    7. Bring another Object box into the area, type sig~ 440 into it, and connect
    it to the top left input of the osc1~ box. This action sends a frequency of 440
    cps to the oscillator waveform.

    8. Bring two Message boxes into the area. Enter start into one and stop into the
    other and connect their outputs to the top left input to the tac~ box. Your display
    should now look like Figure 10-23.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_290_0.png)


    Figure 10-23: a jMax patch'
  merge: -1
  img_proc: true
