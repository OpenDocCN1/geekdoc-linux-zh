    Capsule summary: Powerful sophisticated iconic patching language for real-time
    synthesis and digital signal processing, includes MIDI I/O support.

    Its Internet home page describes jMax as "a graphical programming environment
    for interactive realtime audio applications"—translated, this means you can create
    your sounds by positioning icons on a blank drawing board, specifying their characteristics,
    and "wiring" them together. jMax is a Java implementation of Max, a music and
    sound programming environment designed by Miller Puckette at IRCAM (Institut de
    Recherche et Coordination Acoustique/Musique), a prestigious facility for research
    in music and acoustics.

    jMax blends its language and interface, presenting components that themselves
    represent large families of services and functions. Unlike the other software
    synthesizers reviewed in this chapter, jMax includes an interactive MIDI composition
    and performance environment. MIDI input provides an interactive control interface
    for your digital audio devices and your MIDI equipment.'
