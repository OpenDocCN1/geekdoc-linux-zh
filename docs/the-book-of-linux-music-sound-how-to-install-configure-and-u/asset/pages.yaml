    # MiXViews


    Author: Doug Scott

    Version profiled: 1.22 pl 00

    Web site: http://www.ccmrc.ucsb.edu/~doug/html/MiXViews.html

    FTP site: ftp://ftp.create.ucsb.edu/pub/MiXViews/binaries/

    Maintained: Yes

    Availability: Free, open-source

    License: Copyright held by author

    Capsule summary: Wide variety of data visualizations, analysis/resynthesis tools,
    excellent file conversion tools


    Although its InterViews betrays its age, MiXViews is a powerful and unique editor,
    particularly in the analysis and resynthesis of sound. Updates of MiXViews appear
