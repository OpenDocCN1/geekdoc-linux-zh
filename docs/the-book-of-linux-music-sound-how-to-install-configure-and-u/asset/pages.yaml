  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_231_0.png)


    Figure 9-23: Compilation options


    notify you when the compiling is done. Return to the Music Modeling window and
    save your session work as midfile.mml.


    If you''ve come this far, you now have a good starting point for exploring the
    deeper aspects of Silence. The next example demonstrates a more complex use of
    the program.


    # Triptych: An Advanced Example


    The Silence package includes some example mml files, one of which is titled Triptych.mml
    "Triptych" is a term from classical art meaning a painting or picture made of
    three panels (commonly medieval altarpieces), and this piece (by Michael Gogins)
    displays a very clear-three-part structure.


    Load Triptych.mml from File Open in the Music Modeling window. When the file is
    loaded, you will see only a locked Group icon on the Music Graph. Left-click on
    the lock lever, then unlock consecutive locked icon until all icons are unlocked.
    You should see the display (I have renamed the nodes for this example) shown in
    Figure 9-24.


    The large-scale structure is Group Progression Contour Each Contour opens to the
    deep structure Contour Rescale Strange Attractor. Let''s investigate each type
    of node on the tree, starting with the Strange Attractor node.


    The documentation for the Strange Attractor tells us that the node ... generates
    nodes by searching for a chaotic dynamical system defined by a polynomial equation
    or partial differential equation using Julien C. Readers with knowledge of mathematics
    will know more precisely what that description means, but for now we only know
    that the node is a data or signal generator. Figure 9-25 shows the node opened
    for editing.'
