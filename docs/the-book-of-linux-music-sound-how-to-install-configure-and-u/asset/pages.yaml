    Figure 9-34: The HPKSynthe default display


    To open the Csound instrument editor itself, click on the drop-down menu at the
    top right corner (labeled HPKSynthe) and select Csound Orc. When the Instrument
    display opens, click the instr button in the row of buttons labeled instr/functions/parameters/global/output.
    Type in the instrument seen in Figure-9-35 (you can leave out the comments after
    the semicolons).


    ![](img/43a9671cef617c9c7a18f7a6904433f1_243_1.png)


    Figure 9-35: HPKComposer’s Csound instrument editor


