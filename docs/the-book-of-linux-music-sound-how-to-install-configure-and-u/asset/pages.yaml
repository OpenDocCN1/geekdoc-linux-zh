- pgno: 233
  md: 'Moving up the hierarchy, the documentation for the Rescale node tells us that
    it “ . . defines a bounding hypercube of note space in the score, into which will
    be refilled, by appropriate translating and rescaling, all the child notes of
    this node. The Rescale node is the first filter through which the Strange Attractor''s
    data will pass. Among other parameters, it establishes the start and end times
    for its processing, what instruments are included, the range of note durations,
    and the range of loudness. Figure 9-26 shows the Rescale edit window.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_233_0.png)


    Figure 9-26: The Rescale edit window


    The next step upward brings us to the Contour node. The documentation states that
    it “ . . contains this node is a shaping function. The definition of a series
    of exponential functions from breakpoint to breakpoint in the form [[delta-time
    level exponent]... . .] Thinking of the Contour node as a kind of envelope generator.
    Figure 9-27 shows the details of the Contour edit window.


    Note that by scaling to 1.0, you can easily create complex segmented shapes with
    Contour, where your segments have only up to 1. In Figure 9-27, the breakpoints
    occur at delta times 0.0, 0.6, and 0.4, adding up to 1.0.


    Before continuing, note that Silence processes the nodes along the Music Graph
    from the deepest upward. In Triptych, that means the output of Contour 3 will
    be created first, then Contour 2, and Contour 1 last.


    Going up one step further, we come to the Progression node. According to the documentation,
    Progression “ . . defines a temporal sequence of pitch-class'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_234_0.png)


    sets to which the child notes of the progression will be conformed." The format
    for a Progression entry is [time transposition pitch-class set]. The pitch set
    is represented as selections from a master 12-note set, written as 0123456789ab.
    If the base pitch-class (0) is C, that notation represents a chromatic scale beginning
    on C, and the set 02367b would represent C D Eb F# G B; the set 02478a represents
    C D E G Ab Bb, and so forth. Figure 9-28 shows Progression in edit mode.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_234_1.png)


    Software Sound Synthesis 211'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'I asked the author for some clarification regarding how the Progression node
    works in Triptych, and he graciously sent the following description:


    Time is usually relative: total duration 100 seconds, time a is 1, time b is 3,
    a lasts 25 and b lasts 75 seconds. The pitch-class set IS the scale: [the] C major
    scale is 0 transposition 024579b, D major is 2 transposition 024579b. Or the pitch-class
    set is just a chord: Bb major 9th is a transposition 0247b.


    In other words, the Progression node is a filter of scales and harmonies for the
    Contour data to pass through. Select Score • Generate Score from the MML window''s
    menu. When Silence finished processing the Music Graph, the Score will be drawn
    in the Score tab window. Figure 9-29 shows the score for Triptych.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_235_0.png)


    Figure 9-29: The Triptych score


    Proceed to the Csound tab. The default command string is


    ```

    csound -RWmo7 /Triptych.wav /temp.orc /temp.sco

    ```


    Change it to this:


    ```

    csound -o Triptych.wav -w temp.orc temp.sco

    ```


    The default filenames for the Csound or/sco files created within Silence are temp.orc
    and temp.sco. You can rename the WAV file to anything you like; in fact, you can
    rewrite the command string to include any Csound options you prefer.'
  merge: -1
  img_proc: true
