- pgno: 368
  md: '# 15


    # OPERATING SYSTEM EMULATORS


    ![](img/43a9671cef617c9c7a18f7a6904433f1_368_0.png)


    This chapter covers Linux operating system emulation programs for MS-DOS (DOSemu),
    the Apple Macintosh OS (ARDI Executor), and Windows (WINE). Because many of these
    emulators are designed for users who wish to play their old favorite games on
    their new favorite operating system, developers have paid particular attention
    to audio support.


    The Linux Sound & Music Applications page at http://www.bright.net/~dlphil/linuxsound
    contains a list of the emulation systems currently available for Linux that support
    audio and/or MIDI.


    # Sound Check


    Before downloading any of this software, remember to check the application''s
    most current documentation for sound system status reports. If you intend to run
    a particular sound or MIDI application, your chance of success will depend on
    the emulator''s support for the necessary file formats, audio sampling rates,
    and MIDI drivers.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '# # DOSemu


    **Authors:** Matthias Lautner, Robert Sanders, James MacLean, Hans Lermen,

    many others

    Version profiled: 0.98.6

    Web site: http://www.dosemu.org

    FTP site: n/a

    Maintained: Yes

    **Availability:** Free, open-source


    **License:** Held by the DOSEmu Development Team, some parts under the GPL

    Capsule summary: Complete, stable MS-DOS emulation. Runs nearly all DOS-

    specific software, including many audio and MIDI applications


    DOSEmu is an MS-DOS emulator for Linux.

    Among its capabilities, DOSEmu can trap and emulate a DOS program''s

    system calls, including calls to basic Sound Blaster (or compatible) audio and

    MIDI services. PCM audio, the UART MIDI interface, and some of the sound-

    mixer functions (master volume, PCM audio level, CD level) are currently\supported.


    # ## Getting It, Building It


    To use DOSEmu you need a working copy of MS-DOS on your hard disk.

    You have a dual-boot machine with Windows and Linux installed, you should

    no trouble setting up DOSEmu. If DOS is not installed, you can try using

    FreeDOS, a free clone of MS-DOS available from www.freedos.org.

    DOSEmu is available as an installable package in most Linux distributions.

    If you do not have such a distribution, simply retrieve the DOSEmu package

    from this book''s CD-ROM or the Web site listed above, unpack it into an

    empty directory with `tar xzvf dosemu-latest.tgz`, and follow the build and

    installation instructions.


    # ## Your Configuration!


    The configuration instructions are especially important: DOSEmu depends\upon a
    file named dosemu.conf that is typically placed in your /etc directory.

    Here is a look at the relevant portion of that file configured for your system:


    ```

    $sound = (on) # sound support on/off

    $sb_base = (ox220)

    $sb_irq = (5)

    $sb_dma = (1)

    $sb_dsp = "/dev/dsp"

    $sb_mixer = "/dev/mixer"

    $mpu_base = "0x330"

    ```'
  merge: -1
  img_proc: true
- pgno: 370
  md: "As you can see, you need to know the base address of your soundcard, the numbers\
    \ for the IRQ and dma ports Dosemu's port base, and names for the Linux audio\
    \ and mixer devices. The port numbers and base addresses are normally found in\
    \ your soundcard's documentation.\n you don't have that information, it is unlikely\
    \ that you have a working Linux sound system anyway, and you may need to contact\
    \ the card manufacturer for the needed specifications.\n\nWhile in dosemu.conf,\
    \ you should probably also set the aptly highthreshold to 0. This ensures that\
    \ the CPU will devote all its processing to DoSemu, which is necessary to avoid\
    \ gaps and stuttering during playback.\n\nOther important settings in dosemu.conf\
    \ include designations for your mouse and your video support. Detailed instructions\
    \ for customizing this file are included in the DoSemu package. Because each system\
    \ will present unique hardware settings, it is not possible to cover the entire\
    \ DoSemu setup, but if you follow the documentation you should have few or no\
    \ problems with the configuration. DoSemu has been in development since 1992 and\
    \ is an exceptionally stable and well-documented program.\n\nDosemu runs in both\
    \ console mode and X:\n\n**To launch in console mode:** Simply enter dos at the\
    \ console prompt to call up the ancient MS-DOS prompt. Note that if you have Windows\
    \ 95 or later installed, you may have to select the Command-prompt only mode from\
    \ the startup menu presented during the Windows boot process.\n\n**To launch in\
    \ X:** Type xdos in an xterm window, and a separate window will open for your\
    \ DOS session.\n\nWhichever mode you choose, when you've reached the DOS prompt\
    \ you are ready to start testing your DOS MIDI software under Linux.\n\n# Using\
    \ DoSemu with DOS MIDI Programs\n\nYour success with DoSemu will depend on a variety\
    \ of factors. The most important is whether a native DOS MIDI or audio driver\
    \ will work with the emulator. Early DOS sequencers and other MIDI applications\
    \ simply accessed the MIDI interface in what is known as UART or dumb mode (so\
    \ called because it does not recognize or generate advanced features such as timing\
    \ synchronization or multiport hardware). You can probably get programs working\
    \ in Dosemu without any special setup. For example, I got both the RAVEL and MusicBox\
    \ programs working with relatively little effort, because they both use the interface\
    \ in UART mode.\n\nI have been able to run most of my favorite DOS MIDI software\
    \ on DoSemu. Here is the list of the programs I could run at the time of this\
    \ book's printing:"
  merge: -1
  img_proc: true
- pgno: 371
  md: '| Application | Description | Version | Author/Manufacturer |

    |---|---|---|---|

    | Sequencer Plus Gold | MIDI sequencer | 4.09 | Voyetra Technologies (http://www.voyetra.com)
    |

    | Sideman D/TX | Synthesizer editor | | Voyetra Technologies (http://www.voyetra.com)
    |

    | M/pc | Algorithmic music maker | 1.10b | Voyetra Technologies (http://www.voyetra.com)
    |

    | Drummer | Drum composer | 2.0 | Cool Shoes Software (unavailable) |

    | RAVEL | MIDI programming environment | 3.0 | Jim Brinkley (http://ftp.cs.psdx.edu/pub/music/ravel/)
    |

    | MusicBox | MIDI programming environment | | John Dunn (http://algoart.com) |


    The directions for audio support given in the DOSemu package are simple enough:
    A link is established with /dev/midi or /dev/sequencer, and all native calls to
    the MIDI hardware are intercepted by DOSemu and rerouted to the appropriate Linux
    MIDI device. However, Voyetra''s software will not transmit or receive MIDI data
    unless Voyetra MIDI interface (VAPI) driver is present, which presents a problem:
    Only one of the VAPI drivers will work (vapimpu.com), and then only at certain
    version levels (1.26 and 1.33). In order to use either of those drivers, you must
    add the IRQ number. Here''s the command I use in DOSemu to load the VAPIMPU driver:


    ```

    vvapimpu /IRQ:7

    ```


    The specific version level of the driver is quite important: I tried using version
    1.51, but even with the IRQ flag it would not load.


    # Software Support


    My experience with running the Voyetra MIDI programs at hand, underscores the
    importance of having all the support software as Voyetra drivers or the Cool Shoes
    graphics files. Consider it a basic rule that whatever was required to run the
    application natively in MS-DOS will be required to run it under DOSemu.


    # Some Cool DOS Music Programs to Try with DOSemu

    Sequencer Plus Gold and M/pc


    Sequencer Plus Gold (shown in Figure 15-1) is my favorite MS-DOS MIDI sequencer,
    and I''m quite pleased with its performance in DOSemu. I have also been able to
    use Voyetra''s M/pc (version 1.10b), which is a port of M 2.0 (by'
  merge: -1
  img_proc: true
- pgno: 372
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_372_0.png)


    15-1: The main screen in Sequencer Plus Gold under DOSSemu


    ![](img/43a9671cef617c9c7a18f7a6904433f1_372_1.png)


    15-2: Sideman D/TX editor in DOSSemu


    Joel Chadabe and David Zicareelli for the Macintosh. M is a fascinating composition
    environment with an excellent interactive GUI. Interestingly, M/pc utilizes a
    run-time version of Windows 2.0, which DOSemu handles with no problems. And thanks
    to DOSSemu, I can still use Voyetra''s Sideman D/TX editor with my Yamaha TX8082
    synthesizer—it''s shown in Figure 15-2.'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'Drummer Shoes Software''s wonderful Drummer 2.0 is an excellent MS-DOS MIDI
    program "loosely modeled on a drum machine" that lets you arrange patterns into
    your own score. Its performance is quite stable under Dosemu. I have been unable
    to find a music software distributor still carrying Drummer, but if you have been
    fortunate enough to own a copy you should definitely try it out under Dosemu.


    # RAVEL


    Jim Binkley''s RAVEL is a C-like MIDI programming environment especially well
    suited to exploring algorithmic composition. No special drivers or other software
    is required for RAVEL to run under Linux: It ran perfectly the first time I tried
    it under Dosemu.


    # MusicBox


    MusicBox (Figure 15-3) is a unique MIDI composition environment from John Dunn.
    It utilizes a cryptic ASCII interface, yet is an amazingly powerful program: Various
    modules are linked together to process and output any type of MIDI events, including
    system-exclusive messages. I''ve used MusicBox to create a sequencer, a virtual
    drum machine, and an editor for a Kawai K4 synthesizer. A mouse must be loaded
    for the program to run but, with RAVEL, no VAPI or other proprietary driver needs
    to be installed. The MIDI setup recommended in the Dosemu documentation is sufficient
    for using MusicBox under Linux. Readers interested in trying MusicBox can download
    it at http://mustec.bgsu.edu/pub/linux/mbox.tar.gz.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_373_0.png)


    Figure 15-3: MusicBox running under Dosemu'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# Music Printer Plus, Convert, and pcmusic


    Other significant successes with music and sound software under DOSemu include
    Music Printer Plus, an excellent DOS-based music notation program (http://www.musicwareinc.com/mpfpaq.htm
    for more information) and Jesus Villena''s Convert (http://www.th-zwickau.de/%7emaz/convert.html),
    a soundfile conversion utility that supports a wide variety of formats. Professor
    F. Richard Moore''s pcmusic, a DOS port of his venerable pcmusic software synthesis
    language, runs very well under DOSemu. It is available from ftp:https://wendy.edu/pub/pcmusic.
    As might be expected, Csound for DOS also runs well.


    # Summary Remarks


    Your success or failure at running a DOS music or sound program depends on its
    ability to support the sound Blaster configuration. Programs that you select the
    MIDI or audio devices will fare better than programs requiring special hardware
    or vendors-specific drivers. If you lack certain pieces of software, you can try
    writing to the manufacturer (if they''re still in business), but it will be the
    rare company that still supports their ancient MS-DOS software. You may have to
    scour the Internet, asking for help on various relevant newsgroups (such as comp.os.msdos.apps
    and comp.os.msdos.misc), but with some persistence you may be able to revive some
    good and useful DOS MIDI software.


    # ARDI Executor


    Author: Cliff Matthews

    Version profiled: 2.1pre6 demo

    Web site: http://www.ardi.com

    FTP site: n/a

    Maintained: Yes

    Availability: Commercial

    License: Held by ARDI Inc.

    Price: US$75(regular), US$35(student)


    ARDI Executor is designed to let you run Macintosh applications on a PC. The compatibility
    page (http://www.ardi.com/compat/search.shtml) lists hundreds of Macintosh programs
    that will run under Executor, including many sound and music applications. Executor
    has been in continuous development since 1986, and the ARDI company regards Linux
    as its primary target platform. Its years of development have resulted in a remarkably
    powerful and stable emulator.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# Setting Up Executor


    After retrieving the software from this book''s CD-ROM or ARDI Web site, simply
    unpack it in an empty directory and follow the installation instructions. Executor
    is available in binary form only, so there is no build procedure, and you can
    place the software wherever you like. If you download the RPM (Red Hat Package
    Manager) bundle, you can automate the entire setup by typing rpm -iv executor-glibc-demo-2.1pr6-1.i386.rpm.
    Repeat this procedure for any other packages included with the distribution: Separate
    RPMs are included for the X and SVGA versions of Executor.


    # Running Executor


    Typing executor-demo in an xterm window calls the Executor splash screen and then
    the license agreement. After clicking the Accept button, you''re ready to use
    Executor.


    But before you get excited at the prospect of running Opcode''s Studio Vision
    or Mark The Unicorn''s synthesizer editors, I must warn you that Executor does
    not support MIDI. In general, sound support is primitive at this time. However,
    you can still create audio files to play with your regular Linux soundfile players,
    and some truly excellent Macintosh software is available for free over the Internet.
    The repository at ftp://notam.uio.no/pub/mac/audio_old/ for a large collection
    of free Mac software.


    # Executor In Action


    > ... with SoundHack


    Tom Erbe''s SoundHack is an impressive utility for performing a variety of interesting
    operations on soundfiles. Binaural filtering (placing the sound in space relative
    to the listener), convolution (a method for reverberating a signal), spectral
    dynamics processing (compressing and expanding a signal''s frequency levels),
    and phase vocoding (analyzing a signal''s amplitude and frequency content) are
    all available in SoundHack. The documentation will tell you all you need to know
    about using SoundHack. Meanwhile, Figure 15-4 shows the program running under
    Executor in Linux.


    # ... with Spliner


    Spliner provides a graphic interface for drawing smooth curves (known as cubic-spline
    curves) for use in Csound function tables. Points can be subsequently added or
    removed from the graph, and the table values are calculated and displayed at the
    bottom of the graph window. The brief documentation explains the program''s use
    and history. Figure 15-5 shows off Spliner doing what it does best.'
  merge: -1
  img_proc: true
- pgno: 376
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_376_0.png)


    Figure 15-4: SoundHack under Executor


    ![](img/43a9671cef617c9c7a18f7a6904433f1_376_1.png)


    Figure 15-5: Spliner under Executor'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'For my last example I''ve chosen Out Phase, an ".. almost real time wavetable
    and algorithm based synthesis language." The interface includes built-in music
    editors for waveforms, standard music notation symbols, and text (for writing
    synthesis and composition algorithms). Out Of Phase is so complex to explain further
    here, but Figure 15-6 should give you some notion of the program at work.


    SoundHack, Spliner, and Out Of Phase are all available from the NoTAM tip mentioned
    above. Look for the packages SH0873.hqx, spliner.cpt.hqx, and out-of-phase-13.hqx.
    Executor comes with the Handy Stuff! Expander to unpack this software.


    # Summary


    Executor runs a wide variety of Macintosh programs, and its years of development
    have clearly paid off in an outstanding program. Cliff Matthe have indicated that
    audio support is important to Executor''s evolution, and we can expect improved
    audio functions in upcoming releases. Executor is stable and very usable: If you
    want to run some of your favorite Mac applications, or you''d like to learn about
    Macintosh software without buying a Mac, ARDI Executor is definitely the way to
    go.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_377_0.png)'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# WINE


    Authors: Too many to list (see the AUTHORS file in the WINE package)

    Version profiled: wine-000112

    Web site: http://www.winehq.com

    FTP site: n/a

    Maintained: Yes

    Availability: Open-source, free

    License: BSD-style


    WINE is an acronym for "Windows Emulator" or "Wine Is Not an Emulator." Curiously,
    both interpretations are correct. WINE is indeed a Windows environment emulator,
    enabling some Windows programs to run under Linux as though they were native Linux
    applications. The WINE project is also focused on the libwine, a code base designed
    to make easier ports of software from Windows to Linux and other UNIX environments.


    Support for sound and MIDI in WINE includes the basic Sound Blaster functions
    (similar to those supported by DOSemu) and other audio extensions, such as Microsoft''s
    DirectX. However, providing such support in an emulated Windows environment has
    proven much more difficult than it has for DOSemu. You probably won''t be able
    to run Cakewalk or Cool Edit Pro, but WINE can run a variety of lighter-weight
    sound and music applications. Check the WINE Web site for lists that enumerate
    users'' successes and failures in running specific applications under WINE, including
    a number of music and sound applications.


    WINE is still considered an alpha-stage project. It is not uncommon for an application
    to work under one WINE release, only to be broken by the next release. The WINE
    documentation gives detailed instructions for submitting useful bug reports, so
    if you find that your favorite Windows program isn''t working anymore under WINE,
    you can help the project by submitting a report, usually to the comp.os.emulators.windows
    newsgroup. That forum is also an excellent source of information about failures
    with specific Windows applications under WINE. You may find that someone else
    on the newsgroup has already supplied just what you need in order to get your
    favorite Windows program up and running in your favorite operating system (Linux,
    of course).


    # Getting It, Building It


    Before you can do anything with WINE, you need to have Windows installed and working.
    You will also need to mount the drive (while still in Linux) containing the installation
    in order to make your Windows programs available to the emulator. Here''s how
    I do it on my system:'
  merge: -1
  img_proc: true
- pgno: 379
  md: 'And, of course, if you want to run any music or sound applications under WINE
    you will need a working Linux audio system (Chapter 2).


    Download the latest binary or source package from the WINE Web or copy the version
    included on this book''s CD-ROM. Red Hat Linux users will be happy to learn that
    RPMs of the most recent releases are available at various sites listed on the
    WINE pages. Building WINE isn''t terribly difficult, but the RPM packages simplify
    the installation process for users who want to test the waters before jumping
    in.


    Keep in mind that WINE''s development pace is quite rapid, with new versions released
    nearly every week (the version number is the date of release, the version you
    profiled was released on January 12, 2000). System requirements and building procedures
    may change from version to version, so if you decide to build WINE be sure to
    follow the installation instructions included with the source package.


    # Using WINE


    WINE is easy. The documentation suggests trying to run the Windows Solitaire card
    game as a test case, because it exemplifies the basic usage. After the emulator
    has been installed, type the following in an xterm:


    ```

    wine /mnt/dsc/windows/sol.exe

    ```


    Replace the /mnt/dsc pathname with the drive where your Windows installation is
    located (the Solitaire program is normally found under the /windows directory).
    When the familiar card game appears, you''ll be ready to running some Windows
    music and sound applications.


    # More WINE, Please ...


    Sound support under WINE is transparent—that is, no special setup is required.
    However, it is safe to say that more complex programs, such as Cakewalk or other
    MIDI programs, are unlikely to work. The WINE site lists hundreds of applications
    that have been rated on how well they run under the emulator, but very few audio
    programs receive the highest rating (0 indicates failure, 5 indicates a complete
    success). Two that have received the highest marks are Markus Ekman''s Granulab
    (available from http://passagen.se/rasmuse/Granny.htm) and David Billens''s SimSynth
    (available at http://elisdee.onestop.net).


    # Granulab


    Granulab takes a WAV-format soundfile as input and performs a synthesis technique
    known as granulation on it. The program is meant to run in real time, and performances
    can be saved to disk.


    > 1 For more information on granular synthesis, the relevant material in Curtis
    Roads'' A Computer Music Tutorial. Cambridge, Mass.: MIT Press, 1996. ISBN 0-252-18158-4.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# No special DLLs are required, and it is a testament to the author’s coding
    style that GranuLab runs smoothly under WINE.


    Launch the program under WINE with wine /docs/granny/granularab.exe (substituting
    the directory paths correct for your system). Figure 15-7 shows GranuLab’s controls.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_380_0.png)


    Figure 15-7: Rasmus Ekman’s GranuLab running under WINE


    Basic operation of GranuLab is simple: Load a soundfile, check the Play box, then
    move the sliders to control various parameters of the granulation of your soundfile.
    The soundfile will loop continuously until you stop play, and you will hear your
    parameter changes immediately. For more details concerning GranuLab’s operation,
    see the program’s excellent documentation.


    # SimSynth


    SimSynth is a synthesizer with realtime parameter controls that attempts to emulate
    the classic analog synthesizers of yesterday. Like those ancient instruments,
    SimSynth presents a control interface consisting of knobs and switches for the
    realtime adjustment of a sound’s parameters. A mouse-controlled keyboard is provided,
    and an external MIDI keyboard can also control the synthesizer.


    Figure 15-8 shows SimSynth in action. The setup in this figure creates an FM (frequency
    modulation) bass sound. The SimSynth package includes a'
  merge: -1
  img_proc: true
- pgno: 381
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_381_0.png)


    variety of synthesizer emulations, each of which can be controlled in real time,
    tweaked to your liking, and saved as a new patch.


    See the SimSynth documentation for more information.


    # Closing Comments


    Thanks to similar projects carried out under other flavors of UNIX, Linux has
    inherited a rich tradition of operating system emulation software. However, Linux''s
    popularity has inspired programmers to new and innovative efforts at accommodating
    other systems and their software under Linux.


    Ideally, we would see native Linux applications replacing their Windows, Macintosh,
    and OS/2 counterparts. But until that happy time, the emulators profiled and mentioned
    in this chapter are the only solution. Let''s hope they will work well enough
    to let you run the one or few applications that still have no Linux equivalents.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# AFTERWORD


    # Taking Leave


    I have had the great pleasure of watching and helping the growth of Linux music
    and sound software, and I''ll certainly continue to encourage and follow its development.
    An amazing amount of outstanding software has appeared in a few years, and our
    journey is just beginning. Like Linux itself, the ride might be a little bumpy,
    but that''s to be expected on the road less traveled.


    # Join Up!


    If you''ve come this far, I invite you to journey onward. The development of high-quality
    Linux Audio and MIDI software depends upon your involvement, regardless of whether
    you are a seasoned programmer or a Linux newbie. If you can contribute code, then
    join in an existing project or pick up an orphaned application. Join the Linux
    Audio Development group (at http://www.linuxdj.com/audio/lad). If you can''t contribute
    code, then be a tester or contribute ideas. Sign on to one of the Linux Audio
    mail lists found at http://www.bright.net/~dilphil/linuxsound/mllists.html. Help
    with documentation is always welcome. Compose a Web page for your favorite Linux
    sound program. Put your original music online with a notice that it''s "Made In
    Linux."


    I hope you have enjoyed this tour of the world of Linux MIDI and sound software.
    Perhaps you''ve discovered programs unique to Linux (such as jMax or Quasimodo),
    or just reacquainted yourself with famil-'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'iar applications like MP3 players and MOD trackers. However you have used this
    book, I hope it has led you to some interesting and useful music and sound software.


    Above all, I hope you''ve had fun with the programs I''ve profiled here. And remember:
    The fun is just beginning. . . .'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# GLOSSARY


    +   **ADC** (analog-to-digital converter) A device that processes an electrical
    stream into a series of numbers.


    +   **additive synthesis** A synthesis method that creates complex sounds by adding
    frequency components, usually in the form of sine waves.


    +   **ADSR** (attack, decay, sustain, release) Defines the shape of a sound''s
    envelope in four stages.


    +   **AIFF** (audio interchange file format) A soundfile format from Apple Computer.


    +   **algorithm** A procedure for solving a problem or accomplishing a task wherein
    each step of the procedure is strictly defined.


    +   **amplitude** In digital audio, the value of a signal''s largest sample. Directly
    proportional to the perceived intensity and loudness of a sound.


    +   **arpeggio** Breaking a chord into a series of pitches.


    +   **attack** The first part of an ADSR envelope, also called the rise-time segment.


    +   **AU** A soundfile format from Sun Microsystems.


    +   **bit** A binary digit, either 0 or 1. The smallest unit of information understood
    by a computer.'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'bitrate The rate (in kilobits per second) at which a soundfile is converted
    to an MP3 soundfile. Files encoded at 128 kbps approach CD-quality audio fidelity.
    Higher bitrates ensure better sound, but require more storage space.


    bit resolution The number of bits used to define a single sound sample (8, 16,
    or 32 bits). In digital audio, a sampled sound''s dynamic range depends on its
    bit resolution. Low-resolution sound (8-bit) is adequate for non-musical applications,
    whereas higher resolutions (16-bit and 32-bit) are preferred for music and other
    sonically critical applications.


    bitstream The flow of the bits of an MP3 soundfile.


    CD audio Digital audio sampled at 44.1 kHz in 16-bit resolution.


    channel In audio terminology, a specified path for signal input/output in either
    hardware or software.


    cue channel A mixer that waits for a signal before it opens its sound


    DAC (digital-to-analog converter) A device that converts a series of numbers to
    an electrical stream.


    decay The second segment of an ADSR amplitude envelope, reaching from the end-point
    of the attack to the start of the sustain stage.


    decibel A unit of measurement for the relative amplitudes of a sound (abbreviated
    dB).


    delay line An algorithm that delays the output of an incoming signal (e.g., an
    echo effect).


    DMA (direct memory access) A method of transferring data directly in and out of
    a computer''s memory, bypassing the control of the CPU.


    DSP (digital signal processing) Creating or editing signals in the digital domain.
    Typical DSP applications include radar and telecommunications devices (such as
    modems), as well as audio and image processing software.


    dynamic range The full range of amplitudes that can be represented by an audio
    system.


    effect bus The part of a mixer that routes a signal to and from an effects processor.


    envelope The shape of a sound''s amplitude variation.'
  merge: -1
  img_proc: true
- pgno: 386
  md: 'fader A software or hardware slider that controls an input or output level.


    FFT analysis (fast Fourier transform analysis) A technique used to determine the
    relative amplitudes of a signal''s frequencies to determine the shape of a wave.


    filter A device or algorithm that lets some frequencies through and rejects others,
    modifying the frequency content of a signal.


    frequency How often a periodic waveform repeats itself over a unit of time (usually
    one second).


    full duplex The ability of a soundcard to simultaneously record and play back
    sound.


    gain The ratio of an audio device''s output amplitude to the input amplitude.


    Hertz A measurement unit for frequency equal to one cycle per second (abbreviated
    Hz).


    iconic synthesis environment Software synthesis by matching icons together in
    a graphic interface.


    interrupt A signal from a device that demands the immediate attention of the CPU.


    I/O Input/output.


    IRQ (interrupt request) A signal from a program to the computer, asking to attend
    to a particular device (such as a modem or soundcard) via the device''s interrupt
    number.


    LISP (list processing) A computer programming language especially well suited
    for artificial intelligence and the exploration of algorithms for the creation
    of music.


    loop To play a portion of an entire recording repeatedly.


    LPC (linear predictive coding) A method of analyzing and encoding a digital signal.
    LPC resynthesis works by calculating (i.e., predicting) its output samples using
    data from samples already calculated.


    Markov chain A randomization process that calculates higher-order probabilities
    from first-order probabilities.


    MIDI (musical instrument digital interface) A specification for hardware and software
    protocols that allows digital musical instruments (such as synthesizers and drum
    machines) from different manufacturers to communicate with each other.'
  merge: -1
  img_proc: true
- pgno: 387
  md: 'mixer A device for blending multiple sound inputs into a balanced output signal.


    MOD (music module) A soundfile format commonly used by digital audio tracking
    software. See tracking.


    MP3 (MPEG audio specification, layer 3) An audio data compression format designed
    by the Motion Pictures Engineering Group (MPEG).


    MPEG (Motion Pictures Engineering Group) An organization formed to design and
    implement standards used in commercial and industrial audio video applications.


    music specification language A programming language that represents musical symbols
    and functions.


    note-off A MIDI message indicating the end of a note.


    note-on A MIDI message indicating the start of a note.


    opcode (operation code) A programming language directive that tells the computer
    to perform a specific task. In the C language, an opcode may be a signal generator
    or modifier, a mathematics function (including the =, +, -, *, and /), or some
    other process that acts upon incoming data.


    oscillator A software or hardware device that generates a waveform.


    parameter A numerical characteristic of an algorithm that controls the characteristic
    of the sound created by the algorithm.


    patching Connecting modules by real or virtual cables.


    PCM (pulse code modulation) A standard digital sound encoding technique; the sampling
    process whereby electrical impulses are converted into numbers.


    periodic wave An audio signal consisting of a repeating waveform at a specific
    frequency. Pitched sounds, such as made by musical instruments, are periodic waves.


    phase The starting point of a waveform, represented in the radian degrees of a
    unit circle.


    pitch The subjective response to the frequency of an audio signal. Pitch is perceived
    as higher or lower as the signal frequency rises or falls.


    pitch-shifting Raising or lowering the pitch of a signal.


    polyphony A musical term indicating the simultaneous motion of multiple voices
    or melodies. Also used to indicate a synthesizer''s simultaneous sound capability.'
  merge: -1
  img_proc: true
- pgno: 388
  md: 'probability The likelihood of an event occurring.


    program change A MIDI message that tells a device to change to a particular stored
    sound.


    pulse code modulation See PCM.


    quantize The technique of converting a continuous analog signal into bits. In
    MIDI terminology, the process of rounding an event''s duration and/or start time
    to a user-defined value.


    realtime synthesis The process of synthesizing sound samples faster than the sampling
    rate and sending the sound directly to a DAC instead of saving it to disk.


    release The final stage of an ADSR envelope. Typically this stage starts from
    the last point of the sustain stage and descends to an amplitude level of zero.


    resolution The degree of detail (usually referred to in terms of bits) possible
    in digital computer output—either audio or visual.


    sampling rate The frequency in Hertz at which a sound is sampled, e.g., 22050
    Hz or 44100 Hz (cycles per second).


    scratching Manually operating a record turntable forward or backward to produce
    a distinctive rasping sound.


    SND A soundfile format used extensively on NEXT computers.


    software mixer See soundcard mixer.


    software synthesis A method of creating sound using digital computers and processors.


    soundcard mixer A software application for managing levels, mute and solo status,
    input gain, and other aspects of a soundcard''s capabilities.


    sound synthesis A general term for methods of creating sound using electronic
    devices (such as analog and digital synthesizers).


    spectral dynamics processing A process that changes the strength of a signal''s
    frequency content.


    spectrum The amplitude and phase of a sound''s frequency components.


    spline curve A smooth curve with discontinuities.


    s The third stage of an ADSR amplitude envelope, representing the “steady state”
    portion of the sound.


    synthesis The process of converting electronic signals into acoustic sound.


    track A specific hardware or software channel for recording and playing audio
    or MIDI data. Different components—bass, drums, voices—may occupy different tracks.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '**tracking** A method of arranging sound samples in tracks and then looping
    and sequencing the tracks.


    **transport controls** The start/stop/pause rewind/fast-forward controls of a
    recording or playback device.


    **unit generator** An algorithm that generates, modifies, or combines sounds.


    **VU meter** A software or hardware device that indicates input or output levels.


    **WAV** A popular soundfile format from Microsoft.


    **wavetable synthesis** A type of synthesis that uses precalculated functions
    to produce a waveform.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# ABOUT THE LINUX MUSIC

    & SOUND CD-ROM


    The CD-ROM that accompanies this book contains as many of the pro-filed applications
    as legally possible.


    Almost all of the software here can be considered "in development,"

    but that certainly does not mean it is broken or useless. As shown in the book,
    even packages in the developmental stages can be quite sophisticated. However,
    given the variety of Linux distributions and the occasional differences between
    file systems, some applications may not compile/or run on your system without
    some determined hacking. If you have persistent problems building, installing,
    or using a package, write to the author or maintainer of the software in question.
    Describe your problems clearly and keep in mind the fact that most of this-soft
    is available for free.


    Linux software is a quickly moving target. For the most up-to-date versions, I
    encourage the reader to visit the Web sites listed in the Linux Music and Sound
    Applications Pages for all of the software packages profiled in this book and
    included on the disk.


    The disk is exactly like the book: Software in Chapter 2

    of the book will be found in the Chapter_2 directory on the CD, software in

    Chapter 3 in the Chapter_3 directory, and so forth. The /extra direc-tory contains
    over 100 other applications, including GUI front-ends for

    applications as SoX and playmidi, as well as software not reviewed

    in the book.


    Packages are named as presented in the book (for instance, package-name-latest.tar.gz)
    and each file is linked to the (properly named) packageitself. Thus, RTcmix-latest.tar.gz
    is actually a link to RTcmix-3.0.1.tar.gz.


    If available, binaries in RPM format have been included.'
