    # Advanced System


    The following list would build a system more like a digital audio workstation:


    +   * A working Linux system on a Pentium 450 or better (preferably a dual-processor
    system)

    * A professional multi-channel digital audio board with digital input/output

    * A studio-quality playback system (mixing board, power amplifier, studio monitors,
    3-way speaker system)

    * A 12 GB hard disk, preferably two or more

    * At least 128 MB of RAM

    * A CD-ROM drive, the faster the better

    * A CD recorder

    * A 17-inch or larger color monitor

    * A MIDI interface and keyboard


    > If you want to use timing protocols such as MIDI Time Code (MTC) or SMPTE, you
    will need a standalone MIDI interface card, such as the Roland MPU-401 or the
    Music Quest MQX32M. Soundcard MIDI interfaces usually operate in what is known
    as UART or "dumb" mode, whereas time code requires the "intelligent" mode available
    only from the dedicated cards. A soundcard MIDI interface, though, should work
    with all the MIDI programs presented in this book.'
