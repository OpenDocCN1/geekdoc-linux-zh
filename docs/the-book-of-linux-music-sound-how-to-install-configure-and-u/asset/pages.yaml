- pgno: 100
  md: 'Now we want to move some of these soundfiles around in the main window. Let''s
    start by moving the first and last files 2 seconds forward in their tracks. deactivate
    the other tracks for editing by clicking on the round button under each track
    name. The button will turn gray, indicating that the edits will not affect that
    track. Next, locate the cursor at the 2-second point: This is easily accomplished
    simply by moving the mouse pointer until the time display (at the bottom of the
    screen) shows 2,000. Alternately, you can type the value directly into the selection
    end time display and hit Enter; the cursor will autolocate to the indicated time.
    Next, either click and drag the mouse pointer to the zero point or enter the time
    point value directly. Your main window should now look like Figure 4-40. (Note
    that the labels and edit handles have been turned off.)


    ![](img/43a9671cef617c9c7a18f7a6904433f1_100_0.png)


    Figure 4-40: Ready to move two soundfiles forward


    Now go to the Edit menu and select Paste Silence. Your two active tracks will
    be moved forward exactly 2 seconds, resulting in the display shown in Figure 4-41.


    Repeat this procedure until the sounds are placed precisely where you want them.
    When you have finished moving your sounds, save the EDL and render the mix to
    a WAV or RAW soundfile.


    For your final step in this session, add some reverb to the other tracks. Follow
    the track and area selection methods already outlined, but this time use the markers
    to select an area from 1 second to 2. Then go to Audio -> Effects . . . and choose
    the Reverb. Adjust the effect''s parameters in the pop-up Reverb control panel,
    then press the Do button in the Prompt box. Your main window should closely resemble
    the display in Figure 4-42.'
