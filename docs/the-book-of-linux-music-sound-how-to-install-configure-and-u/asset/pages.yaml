- pgno: 111
  md: '# Getting It, Building It


    Before you build SoundTracker, verify that you have all the necessary libraries
    and development tools. SoundTracker runs in the X window system, and most of what
    you will need should be included in any modern Linux distribution. However, you
    may need to acquire the most recent packages to build and utilize all of SoundTracker''s
    features. In particular, SoundTracker uses the latest GNOME development libraries
    and headers, so you may need to visit the GNOME Project Web site (www.gnome.org)
    and pick up the newest packages. You will also need Michael Pruert''s audiofile,
    available from his Web site at http://www.68k.org/~michael/audiofile. SoundTracker''s
    installation documentation specifies what you will need to build the program,
    so be sure to read it before you compile the application.


    After you have downloaded SoundTracker and acquired the necessary support software,
    building SoundTracker is easy. Typing /configure -help will result in a list of
    options you can select for customizing the build process, and running /configure
    will create the makefiles needed to compile Sound. If no errors were reported
    by the configuration procedure, you can type make and watch the compilation take
    place. If no errors were reported by the make process, become the superuser by
    typing sudo and entering your password, then type make install SoundTracker will
    install itself. The tracker is now ready to use; start by simply typing soundtracker
    in an xterm window.


    # Using SoundTracker


    As shown in Figure 5-1 (page 90), SoundTracker''s global organizing controls are
    at the top left, and the tracker and other editors at the bottom of the screen.
    Event entry is simple: use the QWERTY keyboard to audition, insert, and delete
    the instruments along the tracks. A two-octave span of notes is laid out in piano
    keyboard order. The keys Z S N D C V G H N J M correspond to the notes C# D E
    F F G# A# B. The keys Q2 W 3 E R 5 T 6 Y 7 repeat that pitch sequence one octave
    higher


    | C# D E F F G# A# B | Plays notes |

    | Z S X D C V G H N J M | Plays |

    | Q2 W 3 E R 5 T 6 Y 7 U | one octave higher |


    You can use the computer keyboard in other ways as well. Controls are available
    for song, pattern play, and nearly all of the editing functions. The combined
    keyboard/mouse interface is easy to master—you''ll quickly be able to compose
    and audition with ease.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Tracking a Module


    # General Instructions


    As of version 0.1.9, the documentation for SoundTracker consists of a single README
    file, but little more is really needed. Trackers all follow a similar design,
    and the reference materials found on Kristian Grundstrom''s United Trackers site
    (www.united-trackers.org) will help you understand the basic use of almost any
    tracker.


    # Creating Sound Patterns


    Tracking (i.e., creating a module) in SoundTracker is a simple four-step process:


    +   1. Click on the Edit Mode radio button and select Instrument 1 in the global
    section.


    +   2. Click on the Sample Editor to load the sample you want for that instrument.


    +   3. Click on the Tracker tab, position the cursor box over the first entry
    space for Instrument 1, and select the note desired from the QWERTY keyboard.
    If you select a note later you don''t want, it can be deleted simply by selecting
    it again and pressing DELETE.


    +   4. Repeat this process for each instrument until you have the pattern and
    instrumentation desired. The pattern can be played at any time, a feature that
    greatly speeds up the composition process.


    # Event Details


    The event line has four fields, shown as columns of numbers in Figures 5-1 and
    5-2. The first indicates the pitch chosen for the sample playback, the second
    displays the instrument number, the third indicates the volume, and the fourth
    combines the effects command and parameter value into one three-digit entry. Only
    the pitch indicator follows the traditional pitch/octave notation; all other values
    are represented in decimal or hex numbering (you can select the representation
    you prefer).


    The effects command not only adds typical effects such as vibrato, tremolo, LFO,
    and filtering—provides signals to start the subsequent pattern, jump to a new
    position in the event list, and loop from that for a specified time. The fine-tuning
    parameter will give you more accurate intention of a sample at a particular pitch
    level.


    The highlighted line in Figure 5-1 shows a typical tracker event entry: a bass
    instrument with a pitch of C5 (in octave 5, selected in the global area in the
    upper left corner) and the defaults for volume and effects. The entry is located
    on the first beat of a 4-beat pattern. Figure 5-2 shows the procedure carried
    to create a C major scale, rising over a period of 16 beats, from C5 to C6 (the'
