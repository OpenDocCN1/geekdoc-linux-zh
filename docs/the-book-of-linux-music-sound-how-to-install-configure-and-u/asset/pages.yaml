- pgno: 163
  md: '# XMMS: The Linux Multimedia Player


    Authors: Peter and Mikael Alm

    Version profiled: 0.9.1

    Web site: http://www.xmms.org

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: GPL


    XMMS (X Multimedia System) is one of the most popular MP3 players for Linux. Formerly
    known as X1lamp, XMMS began as a Linux emulation of the popular WinAmp (an MP3
    player for Windows 95/98). It has since been developed into a powerful Linux-specific
    application, offering support for various window managers and the GNOME desktop.


    # Getting It, Building It


    After downloading the latest package, move it to your /home or /usr/Local directory.
    Unpack it with tar xzvf xmms-latest.tar.gz and enter your XMMS directory. Follow
    the instructions to build and install XMMS. It''s as simple as ./config, make,
    and (as root again) make install, after which you need only type xmms in an xterm
    window to begin using XMMS.


    # Using XMMS


    XMMS, an excellent soundfile player, can handle MPEG audio layers 1, 2, and 3
    (the numbers refer to format series), WAV and AU soundfile, all music formats
    supported by the MikMod library, and standard CD audio. Features list extend far
    beyond the expected controls for playing files, including a spectrum analyzer,
    support for plugins, a playlist editor, an oscilloscope mode, a graphic equalizer,
    and support for streaming and Internet broadcast audio. It can also make use of
    skins that modify its appearance (Figures 7-7 and 7-8). Some cool skins are available
    from the XMMS Web site (www.xmms.org), and many more are available from MP3 sites
    www.mp3.com.


    Figure 7-7 shows XMMS in its disconnected state, with a playlist and the first
    selection (a Samba) ready to play. The graphic equalizer is also shown, along
    with the file selector box. Figure 7-8 shows the same configuration (minus the
    file selector) of player, equalizer, and playlist, but connected together and
    wearing a new skin.


    XMMS is a versatile multimedia player that supports a number of media file types,
    including MIDI and video streams. It also provides a system for installing plugins
    (loadable modules that extend the program''s capabilities). Visualization (like
    spectrograph displays) and effects (like chorus or reverb) plug-ins can be added,
    as well as plug-ins for output destination (XMMS can send its audio to the standard
    OSS/Free and OSS/Linux drivers, to the EsounD audio daemon [a small program that
    runs as a background process and


    140 Chapter 7'
  merge: -1
  img_proc: true
