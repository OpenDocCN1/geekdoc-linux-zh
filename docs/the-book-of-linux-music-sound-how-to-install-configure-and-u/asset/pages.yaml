- pgno: 150
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_150_0.png)


    Figure 6-26: The results of KeyKit''s Make Sim feature


    Using the oddly named Snarf tool from the Sim menu, you can now save your generated
    music for processing in other KeyKit modules. For instance, you could click on
    **Orig** again again, choose **Read • Snarf** to place your newly generated music
    into the Orig area, and run the entire process again.


    # Other KeyKit Features


    KeyKit has a tool for every MIDI data type, including note events, controller
    data, program changes, system-exclusive messages, and MIDI time code. We have
    already seen the Program Change tool in Figures 6-25 and 6-26. In those figures,
    the Celeste instrument is selected for channels 1 and 2. The General MIDI instrument
    order is the default layout, and the remaining channels have been left at Acoustic
    Grand Piano, the default program selection.


    KeyKit is also a powerful MIDI command language. It is an object-oriented language,
    with full support for modern programming methods, including arrays, functions,
    and conditional evaluations such as "if/else" statements- and for "for" loops.
    Here is a very simple example of KeyKit as a MIDI command language:


    ```

    key realtime (''c e g, f g b d f, c e g'')

    ```


    The realtime function will send MIDI data immediately out the MIDI interface to
    any connected MIDI devices. In this example, four chords are sent in sequence:
    a Cmaj7 (c e g), followed by a Fmaj7 (f ace) and a G7 (g b d), then resolved back
    to the Cmaj7 (c e g).


    See the program documentation for more details about KeyKit''s programming language.'
