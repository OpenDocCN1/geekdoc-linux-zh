    \ KDE and Qt are found in most modern Linux distributions, and you can download\
    \ the latest packages for free from their Web sites.\n\nYou will also need to\
    \ download and install a package MICO (www.mico.org). MICO ('Mico Corba') is an\
    \ implementation of CORBA, the Common Object Request Broker Architecture. MICO\
    \ provides services for separating running programs and processes, as preprocess\
    \ communication (which sets up and manages communications channels), message passing\
    \ (which exchanges data and instructions), and TCP/IP network connectivity. The\
    \ MICO package contains instructions for building and installing MICO.\n\nBe sure\
    \ to configure MICO with the --disable-mini-stl option. aRTs will not build otherwise.\n\
    \nWhen the required packages are successfully installed, run ./configure --help\
    \ to view aRTs' configuration options, then run /.configure. The configuration\
    \ process will notify you if any needed parts are missing. If all the pieces are\
    \ in place, type make (at root, of course) make install to build and install aRT.\n\
    \n# Using aRTs\n\nBecause aRTs employs a client/server architecture, you start\
