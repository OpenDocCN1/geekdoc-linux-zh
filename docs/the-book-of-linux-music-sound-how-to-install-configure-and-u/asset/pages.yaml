    **Figure 8-13:** Multitrack after tracks are formatted


    You can now record new tracks, import and export WAV files, perform basic edits,
    and add effects to your tracks. For this demonstration, you will record one track
    and a second while listening to the first. To record the initial track, open the
    mixer (seen to the right of the transport controls at the top of the screen),
    select the input channel and set its level, and click on the **R** button in the
    Track 0 control panel. You can also rename the track by placing the mouse cursor
    in the name box (where it says Track 0) and entering a new name. Now press the
    red, **Record** button (in the center above the track displays), and the dialog
    box shown in Figure 8-14 should appear.


    This dialog box is a summary of the recording devices; name; and toggles for displaying
    a VU meter, disabling playback during recording (cancels duplex recording), and
    specifying the time for an introduction. Clicking on **Record** will immediately
    start recording. When you''ve finished, press the **Stop** button and you should
    see something like the display in Figure 8-15.


    To set up Multitrack for simultaneous record and play, open the mixer again and
    set the level for the playback channel. For full-duplex operation on my PCI128
    soundcard, the pre-recorded tracks play through the Pcm2 channel (see Figure 8-16
    on page 163). Check the output of **cat / /dev/sndstat** (for OSS drivers) or
    **cat / /proc/asound** (for ALSA drivers) to see the full-duplex capability of
    your soundcard.'
