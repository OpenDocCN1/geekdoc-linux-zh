- pgno: 244
  md: 'As you can see, there are some significant differences from the standard Csound
    file syntax. The parameters p4 and p5 are reserved for frequency and amplitude
    respectively, function table numbers must be entered in a special format, no instr
    1 heading is not required, and the output must be labeled out (for monaural output).
    Other restrictions apply to the notation for panning and effects processing. You
    can import an existing Csound or file, but you must make the required alterations
    before it will work in HPKComposer.


    To add a function table, click the **Functions** button. Enter the table number
    and definition, then press **Add** to add it to the set of recognized functions.
    This process should produce the screen shown in Figure 9-36.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_244_0.png)


    **Figure 9-36:** HPKComposer’s function table editor


    For our example, we will skip the instrument''s parameters and global sections.
    Click on the **output** button and set the display to the configuration shown
    in Figure 9-37.


    This configuration sets the output as a mono signal without panning. Click on
    the first button in the **Dry/Effects** panel to apply a global effect to the
    output, then click one of the **Edit Effects** buttons at the top of the window
    (the ones labeled 1 through 4 only). The display will change to the screen shown
    in Figure 9-38. Note that the globals and parameters labels in Fig. 9-38 apply
    only to the **Effects Edit** window.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_245_0.png)


    Figure 9-37: Output definition display


    ![](img/43a9671cef617c9c7a18f7a6904433f1_245_1.png)


    Figure 9-38: The Edit Effects screen


    Press the **on/off** button in the **reverb2** panel to activate the connection
    to your instrument. Click on the **Synoptic** view button (the second button from
    the top right corner) to see the new connection in your Composition Structure
    (shown in Figure 9-39).'
