  md: '# Advanced Use


    You can also invoke RTSynth with the following command strings:


    ```

    RTSynth -o /dev/dspw

    ```


    which routes output to the /dev/dspw device. The line


    ```

    RTSynth </dev/midi01

    ```


    # Pipes


    A standard UNIX pipe connects the output of one process to the input of another.
    A normal pipe uses the | operator to allow several processes to be grouped together
    on the command line and literally pipes data from one process into another. This
    command sequence:


    ```

    ps -a | sort -d | more

    ```


    takes the output from the ps -a command (lists all running processes) and sends
    it to the sort -d command for sorting (in dictionary order), then sends the sorted
    list to the more command for displaying one screen full of information at a time.


    A named pipe (FIFO, for "first in, first out") is a special UNIX file type: It
    exists as a name in your file system, but it behaves as a standard pipe named
    pipe enables RTSynth to respond to input from concurrent processes (such as a
    MIDI sequencer or software MIDI keyboard).


    Let''s use a named pipe to control RTSynth with Simon Kågedal''s Clavier (available
    for free from www.sdf.se/~simon/clavier.html), a software keyboard controller
    with a Gtk graphic interface. Run this series of commands in an x window:


    ```

    mkfifo /tmp/midiFIFO

    RTSynth -o /tmp/midiFIFO &

    clavier -o /tmp/midiFIFO

    ```


    This feature is especially valuable if you don''t own an external MIDI keyboard:
    You can just use Clavier to play the sounds you design with RTSynth (Figure 10-16).'
