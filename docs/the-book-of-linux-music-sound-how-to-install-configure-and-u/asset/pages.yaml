- pgno: 181
  md: 'When the cursor is in the waveform window, it appears as a cross-hair cursor.
    To edit a track, hold the left mouse button and drag the cursor to select the
    area you want to revise. Release the mouse button, then choose the appropriate
    edit icon and drag it into the waveform. Figure 8-10 shows WaveSlab with one track
    opened, an area selected for editing, and the dialog window that opens after dropping
    the Cut icon into the waveform.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_181_0.png)


    8-10: WaveSlab with the Cut dialog box opened


    Accepting the default values in the Cut window will leave a blank space in the
    selected area. If you wish to undo any edit, just click on the Undo button to
    undo the last edit or view the edit history and undo operations there.


    # Leaving Slab


    This profile has barely scratched the surface of SLab. SLab is a very deep application,
    rich in professional-level capabilities, and it is well worth the effort to learn
    how to get around in it. Fortunately, SLab comes with complete documentation,
    including tutorials and in-depth presentations of all of SLab''s features. Nick
    Copeland''s author, is dedicated to improving SLab, and he is very responsive
    to bug reports and users'' suggestions. I heartily recommend this program to any
    serious Linux audio enthusiast.'
  merge: -1
