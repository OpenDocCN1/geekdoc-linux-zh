- pgno: 108
  md: '# 5


    # MOD FILES AND LINUX


    The Mod (from "module") digital music file is created using tracker software,
    which is essentially a sequencer for a set of sound samples and the patterns they
    fill. You can add optional effects such as vibrato, filters, and panning to the
    basic samples, and all of this information (soundfiles, sample number, effects,
    sequence position), along with the song structure, is contained in the module
    itself. The format is compact and usable across a wide variety of platforms with
    minimal system requirements: Even the lowestlied 8-bit soundcard will work with
    most trackers. However, Mods are a digital audio format, so it''s always better
    to have support for higher sampling rates and bit resolution when working with
    Mod files.


    Comparing the MIDI and MP3 formats (see Chapters 6 and 7) to Mod files, a MIDI
    file is smaller, but it contains no data and must rely on the soundcard or an
    external synthesizer for the actual sounds. MP3 is a digital audio format, but
    MP3 file sizes are typically much larger than Mods, and there are no direct composition
    tools like MIDI sequencers or Mod trackers for creating MP3 files. If you want
    to compose using sampled sounds, and you want listeners to hear your music with
    those same sounds, then the Mod format is the way to go.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_108_0.png)'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Preparing Your Mod File


    Creating a Mod file is quite easy. The composition model is similar to a pattern/track/oriented
    MIDI sequencer or drum machine: Simply lay samples out tracks, organize your tracks
    into larger patterns, and then link larger patterns to create a song. You can
    play musical patterns simultaneously, repeat, permitting the quick composition
    of multi-voice music.


    Remember to prepare your sample well. Tuning and looping are basic considerations,
    and some tracks support extensive editing of a sample''s volume and panning. "Pan"
    is short for "panorama" and refers to the placement of a sound in the auditory
    space. So, for example, a sample that is panned "left" will sound only from the
    speaker on your left. Although a sample editor is included in the design of almost
    every tracker, you will need a more powerful soundfile editor like Snd or DAP
    for finer editing. These dedicated editors provide greater resolution, more effects,
    and file conversion routines not available in the editors included with trackers.


    # Tracker and Player Mod File Compatibility


    There are many types of modules, including the MOD, IT, S3M, XM, and 669 formats.
    Most players support a variety of mod file types, whereas trackers create only
    one or two (the other mod file types come from trackers available on other platforms).
    The various module formats differ in the number of tracks allowed, the number
    of samples supported, and the permissible bit resolution of the samples. Fortunately
    for Linux users, the most popular Mod formats are supported by most of the available
    trackers and players (see Tables 5-1 and 5-2).


    # Other Trackers and Players


    Linux Mod trackers and players are surprisingly numerous. Which ones you prefer
    will be determined mainly by your machine''s graphics capabilities: For X users,
    SoundTracker and Voodoo Tracker are good trackers designed with the Gtk interface,
    while Xoundrackack requires only the basic X11 libraries. If you want to do your
    tracking from the Linux console, try FuntrackerGOLD. Mod players for X are available
    in nearly every flavor of Linux graphics toolkits, including Gtk (Gmodplay), Qt
    (Kmidbox), and Xforms (Mod4Xwin). Console-based players include MikMod and the
    Falcon Module Player.


    I''ve chosen to profile the SoundTracker tracker and the MikMod player. Both applications
    are easy to set up and use, and they are steadily and consistently maintained.
    I especially like SoundTracker''s user interface. MikMod has also been selected
    for its availability: It is included as a standard component in all mainstream
    Linux distributions.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Table 5-1: Tracker support for the various mod formats


    | Tracker | Supported Modules |

    | --- | --- |

    | FunktrackerGOLD | MOD |

    | Keg Tracker | MOD, XM |

    | SoundTracker | MOD, XM |

    | Voodoo Tracker | MOD, XM |

    | Xsoundtrack | XM |


    # Table 5-2: Player support for the various mod formats


    | Player | Supported Modules |

    | --- | --- |

    | Falcon Module Player | MOD, S3M, XM |

    | Gmodplay | MOD, S3M, XM, IT, 669, MTM, STM, FAR, ULT, AMS, DBM, MDL, OKT |

    | KmodBox | MOD, S3M, XM, IT, 669, MTM, STM, FAR, ULT, MED, IMF, AFM, STX, DSM,
    GDM, UNI, M15 |

    | MikIT | MOD, S3M, XM, IT |

    | MikMod | MOD, S3M, XM, IT, 669, MTM, STM, FAR, ULT, MED, IMF, STX, AFM, DSM,
    GDM |

    | Mod4Xwin | MOD, S3M, 669, MTM, STM |


