    # Using the Green Box


    Composing loops and patterns with Green Box will feel very familiar to anyone
    who has had experience with typical drum machines and their software emulations.
    You assign instruments to channels, start loop play, then click on the beat line
    to add an event to any particular beat. Then switch to the next channel, repeat
    the process for that instrument, and so on until the pattern is acceptable. Select
    a new pattern from the grid of the thirty-two available pattern forms (empty by
    default) and start the process again, editing your rhythms in real time.


    # Loading Sounds


    First you need to load some sounds into Green Box. Click on the **Wave** button
    to open the file selector box and select an appropriate mono WAV-format file (a
    bass drum will be good for your first example). The current channel (instrument)
    is now set to your selected sound.


    # Entering a Rhythm


    Now enter a rhythm. The blue strips beneath the sliders represent 16 notes. When
    you click on a slider, a light appears on the blue strip and the slider moves
    it to the halfway point. Click on the 1st, 5th, 9th and 13th blue strips to enter
    a sequence of bass drum beats on the first, second, third, and fourth beats of
    a measure in 4/4 time. In short, use the blue buttons to enter the rhythm and
    the sliders to alter dynamics of a channel.


    Figure 13-7 shows Green Box programmed for your bass drum beat.\ Note that the
    top numerical display in the upper left corner shows a 0 because the sixteen instruments
    in Green Box are numbered 0 through 15. Also note that the status line across
    the bottom of the display shows the currently edited instrument channel.


    # Playing and Adjusting Your Rhythm


    Press the green play strip next to the Stream button. You should now hear your
    bass drum beating a regular series of quarter notes in 4/4. While the beat pattern
    plays, accent the first beat of the pattern by moving the first slider'
