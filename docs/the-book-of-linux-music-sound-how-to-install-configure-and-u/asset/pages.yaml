- pgno: 300
  md: '# MUSIC NOTATION PROGRAMS


    ![](img/43a9671cef617c9c7a18f7a6904433f1_300_0.png)


    Music notation programs, which allow you to print high-quality scores on any PostScript-capable
    printer, come in two major types: programs that transcribe an input file or performance
    into standard notation, and music formatting programs based on a music specification
    language. This chapter covers three Linux music notation applications: Common
    Music Notation (one of the oldest and most sophisticated packages for the preparation
    of musical scores), Rosegarden, and Mup.


    Of the three programs profiled, Common Music Notation is my first choice for complex
    scoring. Rosegarden is best for quick MIDI-to-notation conversion, and Mup is
    well-suited for preparing scores for small- to medium-size musical groups. I consider
    these particular programs to be the best Linux music notation software available,
    based on the criteria of ease of installation, ease of use, and range of notation
    symbols.'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# Common Music Notation


    Author: Bill Schottstaedt Common Music Notation 17-Aug-99

    Version profiled: Common Music Notation 17-Aug-99

    Web site: http://ccrma-www.stanford.edu/CCRMA/Software/cmn/

    cmn-manual/cmn.html

    FTP site: ftp://ccrma-ftp.stanford.edu/pub/LISP/

    Maintained: Yes

    Availability: Free, open-source

    License: Held by the author


    Capsule summary: Exceptionally flexible symbol palette, perfect for notating arbitrarily
    complex scores


    Common Music Notation (CMN) is a powerful system for creating and editing complex
    musical scores. It is a LISP-based language, easy to learn and use, as has a full
    complete of music symbols and other scoring amenities (such as score sizing and
    text underlay). You can view CMN-created Post-Script (eps) files with the standard
    Linux PostScript viewers (e.g., Ghostview and Ghostscript) or the program''s own
    handy viewer (xcmnw), files can be called from within a CMN specification file.
    You can print with any Post-Script-compatible printer.


    Common Music Notation is one of the most powerful notation programs I''ve ever
    worked with, even though it lacks a mouse-event graphic interface. The language
    itself is really quite straightforward to learn, as are its viewing and printing
    capabilities. If you need a notation program capable of handling almost any scoring
    requirement, Common Music Notation might be just what you''re looking for.


    # Getting It, Building It


    To use CMN, you must have a working version of the LISP language installed. Most
    Linux distributions include some version of LISP as an installable development
    package. Almost all versions of LISP should work fine with Common Music Notation,
    but I highly recommend Allegro Common Lisp, available for free from Franz, Inc.
    at www.franz.com.


    When you have LISP installed, download the latest version of Common Music Notation
    from the Stanford FTP site listed above. Place it in /usr/local or your home directory,
    unpack the software with `tar xzv cmn.tar.gz`, enter your newly created `cmn`
    directory, and invoke your LISP interpreter. When the LISP prompt appears, type
    in `(load-all.lisp)` and grab a cup of coffee while LISP builds the Common Music
    Notation “fast-load” (fasl) files. This will take a while, but subsequent loads
    will take place very quickly. After all the files have loaded, type `(in-package
    :cmn)` at the LISP prompt, and the entire wealth of Common Music Notation will
    now be accessible.'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'By default, Common Music Notation sends its output to an eps file named aaa.eps.
    However everything else in CMN, this default designation can be changed. CMN''s
    in-line viewer, xcmnw, lets you instantly preview your score without a PostScript
    viewer, so there is no need to change the default output designation.


    You can build xcmnw with the following command:


    ```

    gcc xcmnw.c -o xcmnw -L/usr/X11R6/lib -Xlm -XXt -X1ext -X11 -lm

    ```


    Note that xcmnw requires either the Motif graphics libraries or the free LessTiff(www.lestif.org)
    libraries inbuilt xcmnw with no problems. The other required X libraries are standard
    with nearly all Linux distributions. Also note that CMN does not require xcmnw,
    which is provided only as an amenity for quality previewing.


    # Using Common Music Notation


    In an xterm or at the console if you won''t use the xcmnw program), call the Common
    Music Notation image with (load "xcmnw-all.lisp") and load the package with (in-package
    :cmnw) to get to the Common Music Notation prompt. The LISP interpreter is now
    set up to process Common Music Notation directives. Entering this line at the
    interpreter prompt:


    ```

    (cmnw staff treble c4 q)

    ```


    instructs Common Music Notation to create a single staff with a treble clef and
    a quarter note at middle C. CMN uses common practice notation—if you are unfamiliar
    with this subject, you should check out George Hessenmann''s Norton Manual of
    Music Notation'' or Gerd Castan''s online material at http://www.s-le.de/hompages/gerd-castan/commpus/musicnotation_e.html.


    To view the resulting aaa.eps output file created by the code above, use your
    PostScript viewer or add an output designator to view it with xcmnw. Typing this
    line at the prompt:


    ```

    (cmnw output-type :x) staff treble c4 q)

    ```


    open the xcmnw window with the display shown in Figure 11-1.


    1 Hessenmann, George. The Norton Manual of Music Notation. New York W. W. Norton,
    1987. ISBN 0393955265.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_303_0.png)


    Now add a few more notes by entering this line into the interpreter:


    ```

    (cmn (output-type :x) staff treble c4 q d4 e4 e f4 h)

    ```


    You should then see the xcmnw window display the screen shown in

    Figure 11-2.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_303_1.png)


    Save your file by entering (cmn-store) at the interpreter prompt. It will be

    saved as hi.cmn by default, but if you want to rename it during the save, enter

    this command at the prompt:


    ```

    cmn-store "cmn-score" "my.new.cmn"

    ```


    You can then load your file later with this command:


    ```

    load "my.new.cmn"

    ```


    Congratulations, you have already mastered the basics of Common Music

    Notation! It really is that simple to use.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Advanced Use


    Now let''s move on to a more complex example. The following is a slightly altered
    version of an example from the excellent Common Music Notation documentation:


    ```

    (cmn (output-type :x)) (size 40)

    (system brace)

    (staff treble (meter 6 8)

    (c4 e. tenuto) (d4 s) (ef4 e sf)

    (c4 e) (d4 s) (en4 s) (fs4 e (fingering 3)))

    (staff treble (meter 3 4)

    (c5 e. marcato) (d5 s bartok-pizzicato) (ef5 e)

    (c5 e staccato tenuto) (d5 s down-bow) (en5 s) (fs5 e)))

    (system bracket)

    (staff bar bass (meter 6 16)

    (c4 e. wedge) (d4 s staccato) (ef4 e left-hand-pizzicato)

    (c4 e tenuto accent rfz) (d4 s mordent) (en4 pp) (fs4 e fermata)))

    ```


    This example illustrates one of the program''s greatest strengths: its performance
    to standard music notation terminology. This "common practice notation"—including
    such terms as brace, staff, meter, tenuto, marcato, and so on—makes it very easy
    for musicians to understand the meaning of a CMN score specification file.


    Figure 11-3 shows the above example in the xcmnw window.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_304_0.png)


    Figure 11-3: An even more complex CMN example'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'You can type longer files such as the example above directly into the interpreter,
    but this method quickly becomes unmanageable. One way to put a large code listing
    into the interpreter is to open an xterm, invoke your favorite text editor (vi,
    of course), edit the CMN specification files, then copy and paste from the xterm
    into the LISP interpreter. Of course, you can also simply save the code as a .cmn
    file in LISP and load it in CMN as described in the previous section.


    As you can see, Common Music Notation provides a wealth of performance indicators
    as well as a full range of note types, rests, and other musical symbols. Another
    of CMN''s great strengths is the freedom to arrange symbols in virtually any fashion,
    lending Common Music Notation the power to create very complex scores, as seen
    in author Bill Schottstadt''s example of the CMN documentation, rendered in the
    Ghostview PostScript viewer (Figure 11-4).


    The following code lists the contents of the treble clef in the upper system (the
    grand staff at the top) of Figure 11-4:


    ```

    ;;; -*- common-lisp; package: cmn; base: 10; mode: lisp -

    ;; This example shows of invisible notes (a note with scale 0 O)

    ;; to attach slurs to, and the dy message to an explicit beam.

    (cmn

    (automatic-tails nil)

    (automatic-rests nil)

    (system brace

    (setf st1 (a3 1/16) (scale 0 O) (setf b1 (begin-slur (dyo -.5))

    (cs4 1/16) (onset 1/16) (setf ib1 (beam- (dy .25))) (setf sl1 (tie-))

    (e4 1/16) (-beam- ib1) (setf sl2 (tie-))

    (b4 1/16) (-beam- ib1) (setf sl3 (tie-curvature .33))

    (as4 1/16) (-beam-ib1) (setf sl4 (tie-))

    (ds5 1/16) (-beam-ib1) (setf sl15 (tie-direction :down))

    (g5 1/16) (-beam-ib1) (setf sl16 (tie-direction :down))

    (as5 1/16) (-beam-ib1) (setf sl17 (tie-))

    (d6 (onset .5) (scale 0 O) (end-slur sl1))

    (chord (notes (c4 -tie sl1))

    (e4 -tie sl2))

    (a4 -tie sl3))

    (b4 -tie sl4))

    (d5 -tie sl5))

    (g5 -tie sl6))

    (a5 -tie sl7))

    h (onset .5) stem-down-diminuendo (onset-offset .25) (duration 1.255))

    (cs4 e (onset + 2.5 .25) stem-down-begin-beam)

    (cn4 s (onset + 2.5 .75) stem-down-end-begin-tie (tie-direction :down))

    (c4 q (py dy --75) stem-down-end-tie))

    ```'
  merge: -1
  img_proc: true
- pgno: 306
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_306_0.png)


    Figure 11-4: Complex CMN scoring


    # Closing Remarks


    Figure 11-4 clearly demonstrates the power and flexibility of Common Music Notation,
    yet we''ve barely scratched the surface: Among other features, CMN lets you underlay
    text, colorize symbols, and add new graphics. There is also an interface for Common
    Music Notation and the Common LISP Music synthesis language that lets you play
    your scores via the synthesis methods in Common LISP Music. If you run into trouble,
    Bill Schottstaedt continues to develop Common Music Notation and is quick to help
    with any difficulties.


    # Rosegarden


    +   Authors: Chris Cannam, Andy Green, Richard Bown

    Version profiled: 2.1

    Web site: http://www.bath.ac.uk/~masjsp/rose.html

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: GPL

    Capsule summary: Integrated MIDI sequencer/notation program with graphic notation
    editor


    Music Notation Programs **283**'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'Rosegarden wears many hats: It is a full-featured MIDI sequencer, Csound score-creation
    utility, a tool for the creation and editing of scores in standard notation. This
    section will focus on its application as a notation editor, but we will see how
    this feature integrates with the other aspects of the program.


    # Getting It, Building It


    Retrieve the latest version from the Rosegarden Web site and download it to your
    /home/ directory or to /usr/local/. Unpack it with tar xzvf rosegarden-latest.tar.gz,
    switch to the new Rosegarden directory, and follow the instructions in the README
    for building the program. Rosegarden is easily compiled, requiring only a C compiler
    and the standard X libraries and headers. Running ./configure and make will build
    the program, and ./do-install will complete the installation. Typing rosegarden
    in an xterm window will launch the program.


    # Using Rosegarden


    Because our focus is on Rosegarden''s notation capability, we''ll head straight
    for its notation version editing screens. When you start Rosegarden, you will
    see a small box with buttons for selecting the sequencer and the notator. Click
    on the


    ![](img/43a9671cef617c9c7a18f7a6904433f1_307_0.png)


    Figure 11-5: A bass and treble staff in a Rosegarden score'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'Notate button and the notation editor will open with a blank canvas for entering
    notes and other musical symbols from the Palette box which stretches down the
    right side of the screen). Select File -> New, enter a staff count of 2 (i.e.,
    treble and bass), and the notator display will look like Figure 11-5.


    # Creating a Score


    Creating a score is simplicity itself: You enter notes by the left-clicking on
    the desired symbol in the Palette, then left-clicking again in the notator canvas,
    dropping the note (or other symbol) into the appropriate staff. Figure 11-6 shows
    a few measures of music entered into our two-staff canvas.


    As you can see, Rosegarden''s flexibility allows for lyrics, legato indicators,
    accidentals, and fermata markers to be added to your scores.


    # Editing Your Score


    Left-click and drag the mouse to prepare an area for a block-area edit. Area editing
    includes the basic cut/copy/paste routines, as well as the insertion and deletion
    of ligatures, tuplets, and lyrics. In addition to these Rosegarden''s area editing
    can transpose, invert, and reverse the selected block. This capability adds a
    nice touch for composers, particularly given that you can audition your notated
    work at any time merely by pressing the Sequence button.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_308_0.png)


    Figure 11-6: A few measures in a Rosegarden score'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Saving and Printing Your Score


    You can save your work as a Rosegarden or MIDI file. Rosegarden files do not require
    any particular extension, but I usually save them as .rg file.


    In order to print your Rosegarden score, you must first convert it to a MusicTex,
    OpusTex, or PMX file. Most Linux distributions include a LaTeX package that will
    perform the necessary conversions to render these formats into printable files.
    For more information regarding MusicTeX and its relatives (MusiTeX, OpusTex, MuTeX,
    and PMX) see the MusiTeX Web page at http://www.gmd.de/Misc/Music/Welcome.html.


    # Importing MIDI Files


    Rosegarden can also import and export standard MIDI files. Select File Import
    MIDI to bring a MIDI file into the notator. After a few moments, you should see
    your MIDI music represented in standard notation. Figure 11-7 shows a notation
    score after loading a MIDI file into Rosegarden.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_309_0.png)


    Figure 11-7: A MIDI file imported into Rosegarden


    As is typical with programs that transcribe MIDI performances, some manual editing
    will probably be required before your score is clearly readable.


    # Closing Remarks


    Though this brief profile has focused only on Rosegarden''s notation facility,
    don''t forget that it''s also a fine MIDI sequencer with recording, playback,
    and'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'editing capabilities. These two along with its Csound option, make Rosegarden
    a very powerful program. You can write your music using standard notation, render
    and play it as a MIDI file, convert it to a Csound score, and print out your work
    all within Rosegarden. No other Linux application provides all of these features
    in one bundle. This brief profile has shown the flexibility and power of its rotator,
    and I leave you to the happy experience of discovering everything else that Rosegarden
    can do. Enjoy!


    # Mup


    Authors: John Krallmann and Bill Krauss

    Version profiled: 3.5

    Web site: http://www.arkkra.com

    FTP site: ftp://ftp.arkkra.com

    Maintained: Yes

    Availability: Commercial (US$29), open-source anywhere

    License: Held by authors

    Capsule summary: Great easy-to-use package for small to medium scores


    Mup (“music publisher”) is essentially a specification language for music notation-that
    takes a formatted text file and creates a PostScript file for printing. It can
    also produce a standard MIDI file for rendering your music to sound.

    Here is just a partial list of the complex scoring demands Mup can handle:


    +   * Automatic transposition of music and chord marks per staff

    * Up to 32 staffs, including one-line, five-line, and tablature staffs

    * One or two voices per staff, up to 70 simultaneous notes per voice

    * Double whole to 256th notes, with any number of dots

    * Lyrics can be placed above, below, or between staffs; unlimited number of verses,
    with control of font and size

    * Optional rehearsal marks and/or automatic measure numbering

    * 8th note and shorter notes can have either flags or beams; beams can be cross-staff

    * Staffs can be grouped with braces or brackets


    As the following examples will attest, Mup delivers all this and more.


    # Getting It, Building It


    Mup is available in source code or as a pre-compiled binary. If you''ve downloaded
    the binary, you can place it anywhere in your system PATH (/usr/local/bin is always
    a good choice) and run the program by entering mup in an xterm window.'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# Building Mup from Source Code


    If you want to build Mup, you must obtain the source package and place it in your
    /home or /usr/local/directory. Unpack the compressed file with tar mup-latest.tar.gz
    and follow the build instructions in the README file.

    Compiling Mup is easy; just switch to your new mup directory and run this:


    ```

    gcc -o mup *.c -lm

    ```


    After building the program, you must create an empty file called .mup and place
    it in your root directory or in the Mup directory itself. You can now run Mup,
    but you may want to compile the Mup display first.


    # mupdisp


    Most Linux distributions include PostScript file viewers, such as Ghostview or
    Ghostscript, that will work perfectly well with the PostScript files created by
    Mup. However, you can preview your Mup files before rendering them to the PostScript
    format using the mupdisp program. It is not necessary to use mupdisp, but it is
    a handy tool. You build mupdisp by switching to the mupdisp directory and issuing
    the following command:


    ```

    gcc -o mupdisp *.c -lvga -L/usr/X11/lib -lX11 -lm

    ```


    This will build the mupdisp program. Place it in the same directory as your mup
    binary. You can now view Mup files in console mode or by X simply running mupdisp
    my_file.mup.


    # Mup Documentation


    Mup''s documentation is available as a separate package. Simply download and unpack
    it into your existing Mup directory. The docs are in PostScript and HTML formats,
    and brief (manual) pages are also provided. The PostScript and HTML pages can
    be installed wherever you like, but the man pages should be placed in /usr/man/man1
    or /usr/local/man/man1. You can invoke the Mup and mupdisp manual pages in an
    xterm or at the console with man mop man mupdisp. The man pages are useful for
    a quick overview of Mup''s usage, but the full documentation is in the PostScript
    and HTML pages.


    # Using Mup


    For our introduction to Mup, we will create a simple two-bar phrase to demonstrate
    the language and its syntax.


    Open your text editor (vi is my choice) and create a new file called my_first.mup.
    Copy the following lines into this new file and save the file.'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'title (18) "My First Mup"


    title (14) "Learning how it''s done..."


    title "2X" "David L. Phillips"


    ```

    time = 4/4

    key = #

    staffs = 2

    clef = treble

    beamstyle = 2,2

    ```


    staff 2


    clef = bass


    ```

    1: mr;

    2: 2c; 2e;

    bar

    ```


    ```

    1: 4e; 4d; 2e;

    2: 8g; 8a; 4b; 2c+

    endbar

    ```


    As you can see, a Mup input file is organized into various sections (header, footer,
    score, music) that describe some aspect of the score''s layout and music. Although
    our first example is quite simple, Mup can render very complex scoring indications,
    as we will see in a moment.


    Preview your new creation by running mupdisp my_first.mup. The display should
    look like Figure 11-8.


    > The watermark will appear on-screen and in print until you have registered Mup.


    Now convert my_first.mup to PostScript format with the following command:


    ```

    mup -f my_first.ps my_first.mup

    ```'
  merge: -1
  img_proc: true
- pgno: 313
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_313_0.png)


    Figure 11-8: A Mup score in mupdisp


    To view your new PostScript file with Ghostscript, simply run gs my_first.ps.
    Your music is now ready for printing on any PostScript-compatible printer.


    # Advanced Use


    Our example only scratches the surface of Mup''s capabilities. Your /home/mup/doc
    directory includes an example named sample.mup. Run mup -f sample.ps sample.mup
    to produce a PostScript file, seen in Ghostscript in Figure 11-9.


    The following code fragment creates the first two measures for the foghorn and
    drum parts in Figure 11-9:


    ```

    staff 3

    label = "foghorn\nin G\smflat"

    clef = baritone

    transpose = down dim 5

    ```


    ```

    // set different default octave

    defect = 4

    ```


    ```

    staff 4

    // make staff 4 a 1-line staff

    stafflines = 1

    ```


    ```

    // define a macro to allow saying "DRUM" instead of "4:" for the 4th staff

    ```'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# # Sample Song to Show What Mup Can Do


    Test: Art Opus Composer: Arthur Uberbach (1999)


    ![](img/43a9671cef617c9c7a18f7a6904433f1_314_0.png)


    This is a sample of Mup score


    Published by Mup Software P.O. Box 153, Pleasantfield, IL 62563 http://www.mup.com


    define DRUM 4: @


    ```

    // a grace note and an accent on staff 3

    3: [grace; slash 1]c; [with >] 2.d;4.r;

    ```


    ```

    // measure rest for staff 4

    DRUM mr;

    ```


    ```

    // include a note with a double flat

    3: 2.e&&4.r;

    ```


    ```

    // you can specify a pitch for a 1-line staff, even though all notes will be

    // placed on the line. The pitch will be used for MIDI output, if you use

    // the -m option to Mup to get a MIDI file instead of printed output.

    DRUM 4.f&#2.r;

    ```


    ```

    // double bar

    dblbar

    ```'
