  md: '# 0


    # THE WORLD OF

    LINUX MUSIC & SOUND


    ![](img/43a9671cef617c9c7a18f7a6904433f1_24_0.png)


    Do you want to record and play digital sound and music on your computer? Do you
    dream of distributing your music as MODs, MIDI, or MP3s? Would you like to experiment
    with digital signal processing software? And would you like to do all this and
    more with free applications? If so, then this book—and Linux—are you.


    This book is the first to collect and present comprehensive Linux information
    specifically for amateur and professional sound enthusiasts and researchers. In
    concise, easy-to-understand English, this book


    +   - Clarifies the Linux audio system setup

    - Describes basic and advanced use of the system

    - Profiles and evaluates sound and music applications and development software


    Though not written to be a textbook, this book can certainly be used as one. It
    is meant to inspire a hands-on attitude towards the software reviewed and encourage
    the reader to try and go beyond the given examples. In addition, sections on the
    history, current status, and possible future of the Linux'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'audio system will help you evaluate the prospects of Linux sound and music
    for yourself.


    # The Good Stuff


    At the heart of the book are evaluations of selected software packages and brief
    tutorials describing their installation and use. However, these examples are only
    a small taste of what''s available: The Linux Music & Sound Applications Web page
    (included in this book''s CD-ROM) lists hundreds of other software packages, and
    I sincerely hope that you will be inspired to try them out yourself.


    # The Absent Stuff


    This book assumes that you have already set up Linux on your computer and that
    you have a soundcard installed in it. You should also know the difference between
    console and X applications, and you should understand the most basic commands
    in Linux. If you''re already confused, fear not, since there are many excellent
    introductions to Linux (including The No B.S. Guide to Red Hat Linux published
    by No Starch Press).


    This book is a primary survey, and it will certainly help you discover and explore
    the software profiled here, although it is no substitute for reading the application
    documentation. Finally, some technical information is presented, I have purposely
    kept the jargon to a minimum. If you''re looking for exhaustive, in-depth explanations
    of digital audio theory or the MIDI specification, please see the bibliography
    for a list of relevant books and articles.


    # The CD-ROM


    The CD-ROM contains how-tos, FAQ sheets, programming examples, comparison charts,
    and other relevant documentation. It also offers most of the applications discussed
    in the text along with many others. (Some applications are licensed in such a
    way as to prohibit inclusion, Csound being the most notable omission.)


    Where possible (always in the case of software protected by the GNU Public License),
    source code is included; packages in the popular Red Hat RPM (Red Hat Package
    Manager) format are provided if available; and binaries have been built for some
    of the packages.


    # A Bit of History


    Linux sound support dates least back to 1992, when Hannu Savolainen released a
    kernel driver for the original Sound Blaster soundcard. Regular expansions of
    the driver and its programming interface, provided by Hannu and other kernel hackers,
    were included with Linux sources throughout the'
