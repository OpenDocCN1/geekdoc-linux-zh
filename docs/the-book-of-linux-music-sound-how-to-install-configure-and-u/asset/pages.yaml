    # Using PASCALE


    The following steps show how to use the Synth_PASCALE module to add a simple amplitude
    envelope to each note in your sequence, scaling the volume from 0 (silence) to
    1 (peak) and back to 0:


    +   1. Open a Synth_PASCALE module from Modules • Synthesis • Envelopes, drop
    it near the sine module, and disconnect the sine module''s outv (out value port
    (double-click on that port and choose "not connected")).


    +   2. Connect the Synth_WAVE_SIN outv to the Synth_PASCALE inv (in value) port,
    the Synth_PASCALE outv to both the left and right input ports on the Synth_PLAY
    module, and the sequencer pos to the Synth_PASCALE pos as shown in Figure 10-8.


    +   3. Double-click on the Synth_PASCALE top box and set it to a constant value
    of 0.10. The top value indicates that 10 percent of the duration will elapse before
    the amplitude reaches 1 (its peak) starting from silence, at which time it immediately
    begins to decay back toward the 0 (silence). Your display should now appear like
