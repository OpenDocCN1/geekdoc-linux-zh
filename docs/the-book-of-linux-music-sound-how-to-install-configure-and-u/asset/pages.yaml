    Now you can generate a phrase of a few bars or an entire piece out of the data
    loaded in the Orig area. Click on the big Sim button, select Make Sim, and choose
    the length of output you desire. In Figure 6-26 we see the results of choosing
    Make Sim • 256.


    > 1 Dodge, C. and Thomas A. Jerse. Computer Music: Synthesis, Composition, and
