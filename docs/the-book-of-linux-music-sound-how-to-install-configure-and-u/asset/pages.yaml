- pgno: 221
  md: 'The aenv and kenv oscillators directly above it produce amplitude and frequency
    envelopes. For each of those oscillators the last parameter is a function number.
    That number corresponds to the GEN table number assigned to the graph envelope
    and graph inside envelope elements.


    Note that the instrument block delimiter instr 1, 2, 3 will create three instances
    of the forci instrument.


    Our module connects its interface elements and their data to the instrument by
    graphs assigned to GEN function tables and by variables corresponding to the interface
    component type. Now let''s see what kind of interconnections exist with the Cecilia
    score.


    # Four Scores


    Cecilia recognizes four types of scores. Ordinary Csound score (sco) files are
    of course accepted, but Cecilia also processes three other interesting score types:
    #minimum, #tcl, and cyb.


    +   - A score created with the #minimum keyword contains a single event for instrument
    1 (ii). The event lasts for the duration of the longest active soundfile or for
    the duration indicated by the total_time slider. #minimum score is especially
    useful for interactive work.

    - If a score starts with #tcl, it will be interpreted as a Tcl (tool command language)
    procedure or program. A score will be compiled and passed to Csound. Tcl is a
    scripting language usually associated with Tk, a set of graphics widgets (GUI
    components). It is a popular modern programming language with support for arrays
    and complex control structures. It is also the language in which Cecilia is written.
    It is beyond the purpose of this book to teach you how to use Tcl/Tk, but interested
    readers should look into the book Practical Programming in Tcl and Tk, by Brent
    B. Welch¹.

    - A cyb score indicates that what is written in the Cybil scoring language. Cybil
    is a language for the creation of Csound note lists (as in Csound files). The
    language is easy to learn and use, yet powerful.


    Let''s look at the score in the modified _first, cec module in Figure 9-13. A
    Cscore strictly defines only the first three parameter fields (fields). The instrument
    number is p1, p2 is the event start time, and p3 is the event duration. Although
    p4 and p5 are often used for amplitude and frequency, all p-fields beyond p3 are
    arbitrarily assigned to components of the instrument.


    > Upper Saddle River: Prentice Hall PTR, 2nd ed., 1997. ISBN 0136168302.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# P-Fields and Tendency Masks


    Cybil creates data for p-fields. According to the excellent documentation, the
    general syntax for a statement in Cybil is


    ```

    {algorithm duration} [ operator {function} ]

    ```


    In your score, p2 is defined as


    ```

    p2 {sq {ran f 0.1 0.15} 40} 1 {total_time};

    ```


    The Cybil algorithm creates a sequence of events and loops them. Sequences can
    be nested. Taking this apart, we find that p2 is generated by a sequence of 40
    floating-point random numbers in a range between 0.1 and 0.15, followed by a value
    of 1, looped for the time set by the GUI total time slider. The process is repeated
    for each of the three instruments. Similar operations are carried out for all
    p-fields.


    For instance, the fossil opcode has the following syntax:


    ```

    ar fossili xamp, kcps, kcar, kmod, kndx, ifn,phs]

    ```


    In your mono instrument, the opcode is employed with these values and variables:


    ```

    ar fossili ampdb(gvolume)*aenv, cpspsch(p4), p5, p6, p7*kenv,

    ```


    The opcode receives its amplitude data from the volume graph (gvolume), converts
    it from decibels to linear amplitude data (where 60 db equals 1,000, 66 db equals
    2,000, 72 db equals 4,000, and so forth), and modulates it with the aenv oscillator.
    The note pitch is determined by the Cybil score for p-field 4, converted to cycles
    per second (Hz). With the exception of the final parameter (the function number),
    the remaining parameters are generated by Cybil formulas in the score.


    The function table number is indicated in the score in exactly the same way as
    in a standard Csound score. Anything between #cyb and the first is considered
    a Csound statement, including function tables and tempo sequences.


    P5 is the carrier frequency in the FM synthesis. The following line in the score
    calculates each occurrence of p5:


    ```

    p5 {ma f 0.3 1 3 2 [total_time};

    ```


    The algorithm generates a tendency mask, a range created by the two lines generated
    by values 1 and 3 (minimum line), and values 2 and 4 (maximum line). In my first
    example, the lines cross: whereas the other goes from 1 to 0.2. P5 is gen'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Figure 9-14: A tendency mask in Cecilia''s grapher


    er as a random number from the space between the two lines. Figure 9-14 shows
    the example tendency mask as drawn in the Cecilia graph window.


    You can check the output of the tendency mask (and all the other parameter generators)
    by investigating the contents of the scoreOut panel (shown in Figure 9-115). Make
    your graphs in the grapher, then compile the module by pressing Play in the main
    window. If the scoreOut panel is open in the editor, you will see the score events
    stream by Csound compiles the instrument and score. The scoreOut panel displays
    events by Csound syntax, so you can easily check a parameter''s realized value
    against its proposed ranges in the Cybil control.


    The orOut panel (also shown in Figure 9-115) displays the contents of the orC
    file processed by the Csound compiler, and the Csound panel shows the command
    line used. An info panel contains any pertinent information you want to enter.
    Figure 9-15 shows our my_first example with all of these panels active.


    # Summary


    Congratulations! If you came this far you are ready to go ahead, and Cecilia can
    take you much further. I have shown you only a little of what Cecilia can do.
    The interface invites experimentation, the example modules provide plenty of starting
    points for learning the deeper aspects of the program, and the documentation is
    thorough and clearly written. Recommended" Cecilia is definitely "Most Recommended"
    software for signal processing, sound design, and Csound composition. I have used
    the program extensively, yet I am far from exhausting its possibilities. In my
    opinion, Cecilia is simply splendid.'
  merge: -1
  img_proc: true
