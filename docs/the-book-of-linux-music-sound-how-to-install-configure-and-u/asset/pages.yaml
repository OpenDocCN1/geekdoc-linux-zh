- pgno: 72
  md: 'I use MixViews in my studio. No other Linux soundfile editor has its visualization
    capabilities or its analysis/resynthesis functions. Whenever I need detailed views
    of a soundfile''s frequency content, if I want to warp a soundfile by cutting
    and pasting data between analysis displays, or if I just need to quickly apply
    a fade-in to a sound, I turn to MixViews.


    # Getting It, Building It


    Building MixViews from its source code is not difficult, but it does require the
    InterViews toolkit libraries and header files. InterViews is not typically included
    in Linux distributions; directions for acquiring the toolkit can be found on the
    MixViews Web page. Unless you are experienced at building Linux libraries, I suggest
    using the MixViews binary provided by its author. Once you have the binary distribution,
    `tar xvf mixviews-latest.tar.gz` will unpack MixViews and create a MixViews directory
    containing the application. Copy it to anywhere in your system PATH (/usr/local/bin),
    and you''re ready to use MixViews.


    # Using MixViews


    Learning to use MixViews effectively requires some trial and error, particularly
    when working with its LPC (linear predictive coding) capabilities (LPC settings
    require some guesswork to optimize the results of the analysis). Many of its its
    strengths, such as its phase coding resynthesis, require understanding some rather
    abstruse audio and signal processing methods. However, since the InterViews toolkit
    allows graphical exploration and manipulation of the data files, it is easy to
    use and experiment with the analysis/resynthesis routines.


    # Editing Tools


    MixViews opens with a typical waveform display window and a smaller status display
    box. MixViews is very generous with its support for various soundfile formats,
    loading and playing WAV, AIFF, SND, AU, RAW, and SF files. In addition to the
    standard editing tools, MixViews provides splice-in/out, mix, and crossfade functions
    as well as high-quality digital filtering, a delay line, gain, and pitch-shifting.
    File length, sample format, and sample rate can also be adjusted.


    # Unique Signal Processing Features


    The Analysis menu provides tools for pitch and amplitude envelope extraction,
    phase vocoder analysis, linear predictive coding (LPC), and fast Fourier transform
    (FFT) analysis. Because the InterViews toolkit permits data exchange between different
    datasets, you can mix data from the various analysis screens and resynthesize
    it with either LPC or the phase vocoder. MixViews also supports LPC filtering—that
    is, filter is designed from the pattern of formants (resonant peaks in the overall
    frequency spectrum) derived from analyzing a sound.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Using the Phase Vocoder


    The phase vocoder in MiViews works well with the default settings. The process
    is very simple: Open a soundfile in MiViews select all or any part of the sound
    you want to analyze, then select Phase Vocoder Analysis from the Analysis menu.
    For this exercise, we''ll accept the default settings (shown in Figure 4-6), press
    the Confirm button, and watch the Status window through its calculations.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_73_0.png)


    **Figure 4-6:** Default settings of the phase vocoder


    When the status returns to Ready, a new phase vocoder window will appear. This
    window permits graphic modifications to the analysis data, either globally or
    by individual channel. For example we''ll leave everything untouched. However,
    for the next step we need to select all channels of the vocoder by right-clicking
    the mouse anywhere within the channel display. By now the phase vocoder window
    should look like Figure 4-7.


    **File New** to create an empty soundfile with the same length and sampling rate
    as your original source file. A new instance of mixw will open with a blank waveform
    display. Select the phase vocoder from the **Sound + Synthesis** submenu, watch
    the Status window fly through the synthesis, and you will see a replica of your
    original file, resynthesized in the new Soundfile window.


    That''s all there is to it. I leave it to you to revise this example using different
    analysis settings settings and modifications in the vocoder window (which include
    reverse, scale, envelope, and delay functions)


    # Using LPC


    The linear predictive coding (LPC) routines are somewhat trickier. A detailed
    explanation of LPC is beyond the scope of this book; interested readers should
    consult the relevant material in Dodge''s *Computer Music*.¹ Briefly, LPC


    > ¹ Dodge, C., and Thomas A. Jerse. *Computer Music*. New York: Schirmer 1997.
    ISBN 0-02-864682-7.'
  merge: -1
  img_proc: true
