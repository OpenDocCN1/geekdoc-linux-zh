    # Random Shuffle


    First, copy your recorded track by selecting *Replicate* from the *Edit* menu
    in the *Track* window. This creates a copy of Track 1 on Track 2. Next, click
    and drag the mouse over *Track 2* to select the entire track for randomization,
    then choose *Random Shuffle* from the *Misc* menu. (Incidentally, if you''re completely
    mystified by the randomization windows or any other aspect of Jazz++, have no
    fear. The authors have provided excellent online help that explains the purpose
    and usage of every function in the program. ) Figure 6-6 demonstrates the Random
    Shuffle process parameters (the values applied by the particular function) and
    the effect they have on our new Track 2 (Reant), along with the Help window for
    the Random Shuffle option.


    # Random Rhythm Generator


    As the Help file states and as you can see in Figure 6-6, the Random Shuffle chopped
    and shuffled our track into quite a new arrangement. Now we''ll apply the *Random
    Rhythm Generator* (also from the *Misc* menu in the main track window) to Track
    2 to give the recorded notes randomly selected start and end times. Figure 6-7
    shows again the altered track along with the function dialog box and the appropriate
    window.


    Once again we see the effect on the track, but to get a better idea of what happened,
    we need to look at the data in the *Note editor*. We started with measures that
    looked like those in Figure 6-8.'
