- pgno: 75
  md: 'Set the number of poles (peaks in the filter amplitude response) to 45, leave
    the frame offset at 50, and set the frame rate to 220. The analysis takes "snapshots"
    of the sound and casts them into frames, very much like a video is a series of
    frames, and each frame supplies the resynthesis with the information to recreate
    that part of the sound.


    Press the **Confirm** button. The Status Frames window will display the number
    of frames processed, then the graphic representation of the analysis data shown
    in Figure 4-9 will appear.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_75_0.png)


    **Figure 4-9:** LPC data window


    Before going farther with the process, select **Stabilize Frames** from the LPC
    menu. This will help the constructed filter keep parts of the sound from "exploding"
    when their amplitudes approach the upper limit of their range (a little more than
    30K for 16-bit soundfiles). The frame stabilization is automatic process without
    parameters. When it finishes, go to **View • Channel Display • Set Channel View**
    and set it to the first four channels (0 through 3). These channels contain the
    data you will most likely want to edit for the resynthesis. Your data display
    should now look like Figure 4-10.


    Let''s look from the top down at those four channels. The first is called the
    RMS (root mean squared) amplitude of the residual, a fancy way of representing
    the noise components in the original sound. The signal RMS channel represents
    the amplitudes of the voiced components (the parts that are not noise); the error
    channel indicates the difference between the residual and the signal amplitudes.
    The fourth channel contains the frequency data: At the moment it''s empty, if
    you want to include pitch information in your resynthesis you need to run a pitch
    envelope detection on your original sound.


    Select **Pitch Envelope Extraction** from the **Analysis** menu. A window will
    open, as seen in Figure 4-11.


    52 Chapter 4'
