- pgno: 281
  md: 'Quasimido is an environment for generating and processing audio and MIDI data.
    Its powerful synthesis engine allows you to use a MIDI input device (e.g., a synthesizer
    or a MIDI fader box) to control realtime audio output or simply run a standard
    Csound score to write a soundfile to disk. It has two interfaces: Its Gtk interface
    looks like a modular synthesizer combined with rack of signal processors, complete
    with patch cords, sockets, knobs, and switches; its user interface is for playing
    audio and MIDI compositions. (We''ll demonstrate the Gtk interface below.)


    Quasimido is arguably the most flexible Linux realtime synthesizer. You can alter
    or extend its behavior at many levels (e.g., redefine the interface, add plug-ins,
    change graphics), its internal engine is extremely powerful, and it has a significantly
    greater number of functional modules than any other Linux realtime synth. Quasimido''s
    code features an advanced object-oriented design, multithreading, formal grammars,
    high-precision timing, and a highly portable Gtk toolkit. It runs on advanced
    and stable operating systems based on the POSIX specification, such as Linux.


    Keep in mind, though, that Quasimido is still much under development. It isn''t
    hard to find ways to break the program, there are numerous cryptic error messages,
    and many modules are underdeveloped and/or poorly implemented. The program requires
    you to use the Csound language to write new modules, which may be a problem if
    you don''t already know Csound (see Chapter 9 for more information about Csound).


    But despite these drawbacks, the system already has enormous potential. If you
    want the full power of a Linux realtime software synthesizer and the ability to
    control almost every aspect of its behavior, Quasimido is for you.


    # Getting It, Building It


    The full Quasimido environment is a large and complex piece of software that relies
    on many external libraries. Building Quasimido from source code requires at least
    the Gtk development packages (available for free from www.gtk.org), the X11 libraries
    and header files (standard packages in almost all Linux distributions), and the
    libsigc package (available for free from www.eca.ucdavis.edu/~kenelson/libc++).
    Requirements for building Quasimido may change, so you should check with the Quasimido
    Web site for updates on required packages.


    Quasimido is designed to utilize both processors in a dual CPU system, but it
    can be configured for a single-CPU machine. The base processor should be nothing
    less than the floating-point equivalent of a Pentium II-200.


    When you have assembled and installed the Quasimido packages from the Web site
    listed above. Read the Compiling Quasimido Web page at www.quasimido.org/ compiling.html
    for a description of the current compile and installation process. It''s best
    to build Quasimido from source code, prebuilt binaries may also be available in
    RPM format (see the Compiling Quasimido page on the Quasimido Web site for details
    on installing Quasimido from the RPM'
  merge: -1
