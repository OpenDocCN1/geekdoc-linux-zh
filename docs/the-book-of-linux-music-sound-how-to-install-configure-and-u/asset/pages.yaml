  md: '# 13


    # LINUX AND THE DIGITAL DJ


    ![](img/43a9671cef617c9c7a18f7a6904433f1_332_0.png)


    In this chapter I''ll cover a DJ mixer (Loolaboola), a software "scratcher" (terminatorX),
    a drum machine/groove composer (Green Box), and an integrated bass synth/sample
    player (Freebirth). I consider these selections to be the best of their kind for
    Linux: They are certainly powerful enough for the professional DJ, but they are
    also designed to be immediately rewarding for the novice.'
