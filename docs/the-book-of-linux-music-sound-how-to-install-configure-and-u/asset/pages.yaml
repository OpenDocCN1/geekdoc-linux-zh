- pgno: 165
  md: 'After you''ve logged this, into the Showcase page at @www.showcast.com and
    look over the various station addresses and descriptions. Find one that looks
    interesting (you''ll see all sorts of music, news, and talk programs to choose
    from), click on its Web address, and XMMS will pop up to play the streaming broadcast.
    A word of warning, though: if your Internet connection is fast enough for your
    selection, which means that transmissions at higher bitrates will require higher-speed
    connections. If you''re fortunate enough to have an ADSL or cable modem connection,
    you can try any of the stations listed on the Showcase page, but a 56K modem will
    dependably delivering MP3 audio at bits of 24 kbps or lower. High-rate MP3 streaming
    audio will suffer annoying break-ups and discontinuities on a comparatively low-speed
    connection.


    # Why Choose XMMS?


    XMMS is my hands-down recommendation for an MP3 player for X. I confess that I
    was attracted by the XMMS “eye candy”—its attractive GUI and support for easily
    reconfiguring the GUI with skins—but XMMS is more than that: Its controls are
    intuitive, the equalizer is handy, and its support for a very broad range of soundfile
    types makes it useful as a general-purpose soundfile player. Further, its plug-in
    architecture will soon allow XMMS to accommodate video files. Finally, it is an
    open-source project, which appeals to the Linux hacker in me, and is licensed
    under the GPL.


    # The Ripper


    To convert an audio track from a CD to an MP3 file, you must “rip” or “grab” the
    file, which means that the file is copied from a compact disk, converted into
    an intermediate format (WAV or sometimes RAW), and then converted to an MP3 file.
    With compression ratios of up to 10:1 not uncommon, an entire audio CD of over
    600 MB can be reduced to less than 100 MB—the size of a Zip disk.


    # Grip


    Author: Mike Oliphant

    Version profiled: 2.5

    Web site: http://www.nostatic.org/grip/

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: GPL.


    Grip is a front-end for a number of CD and MP3 utilities, including a ripper,
    an encoder, a tag editor, a CD player, and other tools. Creating MP3 sound-files
    from CD audio tracks is a simple process using Grip.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Getting It, Building It


    After downloading the latest package from the Grip Web site (or copying it from
    your book''s CD), move it to your /home directory. Unpack it with tar xzvf grip-latest.tar.gz
    and enter the new Grip directory. Read the instructions to build and install the
    program. Once again, it''s as easy as .configure, make, and make install (this
    last step as root, of course). You are now ready to run Grip.


    # Using Grip


    First open an xterm window and invoke Grip with the following command:


    ```

    grip -d /dev/hdd

    ```


    - -d option selects the CD drive, in this instance an IDE drive (though SCSI drives
    work just fine with Grip, too).

    One of Grip''s coolest features is its support for the CDDB (compact disc database)
    service. CDDB is a project with two primary aims: to build an on-line database
    of CD titles and track lists, and to supply those lists to any CDDB-aware CD player.
    For instance, when I''m surfing the Web I can start the Grip CD player and find
    and search my preferred CDDB databases (specified in Grip''s Options menu for
    CDDB), automatically listing the track titles on the disk I have in the player.


    > NOTE Do not mount the CD drive before using Grip. The program will politely
    fail.


    In Figures 7-9 through 7-12, you can see how I selected an audio track from my
    CD (Figure 7-9), defined what part I would convert (Figure 7-10, page 144), ripped
    (Figure 7-11, page 144) and encoded (Figure 7-12, page 145) the partial track,
    and defined an ID3 tag for the resulting MP3 file.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_166_0.png)


    Figure 7-9: Selecting CD track 7 from the listing in Grip'
  merge: -1
