  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_167_0.png)


    ![](img/43a9671cef617c9c7a18f7a6904433f1_167_1.png)


    If the CD drive is recognized by Grip, you can begin building a collection of
    favorite tracks as MP3 files. Figure 7-9 shows the CD track listing. Right-clicking
    over the selected track will tag it for conversion.

    Figure 7-10 shows the setup for ripping 30 seconds—from sector 1900 to 4250—of
    audio from Track 7.


    Pressing the Rip+Encode button will start the process. Because Grip is a front-end
    for a variety of tools, the results will be conditioned by the configuration options
    for each utility. Figures 7-11 and 7-12 show the configuration options for the
    ripper and the encoder.


    Configuration options for the MP3 encoder include the output file name and destination,
    the bitrate conversion factor, and whether converted WAV files are to be saved
    or deleted after converting. Options for the ripper include which ripper to employ,
    scratch detection, and file format and path for the ripped audio.


    > Grip provides explicit support for the cdparanoia ripper and the BladeEnc encoder,
    but all the supported utilities are user-definable.


    In the above example, each action required its own application: cdparanoia did
    the ripping, BladeEnc did the encoding, and Grip provided the ID3 tag editor.
    If title and track information for the ripped CD were in a CDDB


    Figure 7-10: Ripping setup under Grip


    Figure 7-11: The ripper under Grip'
