- pgno: 129
  md: '# Running Brahms with aRTs


    After starting the alters (an application running behind the scenes that makes
    the aRT synthesizer available to other aRTs programs) in window, type Brahms in
    another xterm window. When the program appears, open the File menu, select Import/Export
    MIDI File, and load a file into Brahms. From the Output selector, choose which
    synthesizer device you want to use. For our example, select Midibus.


    Now you will need to complete a setup of the aRTs synthesizer. Fortunately, the
    aRTs authors have provided excellent documentation on just what to do, and it''s
    very easy. Open the artsbuilder (the aRTs synth GUI), select a MIDI mapping system
    from the Retrieve from Server Files menu item (one of the mixers will do fine),
    then click on Execute Structure in the same menu. At this point aRTs will turn
    into a pleasant-looking synthesizer, complete with knobs and other controls. Brahms
    will play instrument via the MidiBus. You can now return to Brahms and hit the
    Play button; your MIDI file will use the aRTs synthesizer as its sound source.
    You can edit the aRTs synth parameters while Brahms plays.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_129_0.png)


    Figure 6-2: Brahms with the aRTs synthesizer


    # Summary


    Brahms is evolving into a wonderful Linux MIDI tool. It is already a stable and
    usable sequencer, but its authors have great plans for the program. Their alliance
    with aRTs is a step toward making Brahms into a complete hard-disk recording solution,
    requiring no hardware beyond your computer and your soundcard. The authors are
    committed to the program''s development, and I look forward to seeing where they
    will take it next.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Authors: Per Sigmond and Andreas Voss

    Version profiled: 3.2

    Web site: http://www.jazzware.com

    FTP site: n/a

    Maintained: Yes

    Availability: Open-source, free

    License: GPL

    Capsule summary: Integrated audio/MIDI sequencer with rich selection of editing
    and randomization tools


    Jazzware''s Jazz++ is a professional-grade tool for recording, editing, and playing
    MIDI data and has the distinction of being the first Linux sequencer with integrated
    MIDI and digital audio sequencing. It provides a wide assortment of tools for
    the manipulation of recorded MIDI data, including a full complete of the basic
    tools (cut/copy/paste, mute/solo, track quantization and transposition, and so
    on), a variety of interesting and useful MIDI event generators and modifiers,
    and an editor and other tools for digital audio tracks.


    Jazz++ is powerful and easy to learn. It has been available since 1993 and is
    a well-tested, stable sequencer. The authors are committed to its development
    and have planned a complete overhaul of the user interface, switching from Motif
    to the more modern GTK, and support for the ALSA sequencer API was added early
    in 2000. Jazz++ is an excellent program for any Linux music maker, whether newbie
    or professional. Consider it highly recommended.


    # Getting It, Building It


    Jazz++ is available on this book''s CD or from Jazzware''s Web site. Formerly
    a commercial product, in February 2000 Jazzware licensed Jazz++ under the GNU
    Public License and now freely distributes the application''s source code and pre-built
    binaries. Source and binaries are available at the Jazzware Web site.


    If you''re relatively new to building applications in Linux, I recommend downloading
    a prebuilt binary package. The authors have prepared packages in the Unix standard
    tarball (a compressed file with the .tar.gz or .tgz extension) and the Red Hat
    RPM formats. Most mainstream Linux distributions can handle either format: The
    RPM is easier for novices (more automated installation), but more experienced
    users may prefer the older Unix packaging for "hands-on" installation.


    After retrieving Jazz++, place it in your /home or /usr/local directory. If you
    downloaded the RPM file, simply run rpm -iv jazz-bin-latest.rpm and you''ll be
    ready to go. If you got the tarball, unpack it with tar xzvf jazz-bin-latest.tar.gz,
    then go into the new Jazz++ directory and read the installation instructions.
    Follow those directions, run ./install-jazz, and let the installation complete
    itself.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'If you have opted for building Jazz++, follow the directions above, substituting
    jazz-src-latest for the binary package name. However, you can build Jazz++ you
    must install the wxWindows GUI toolkit, available from http://www.wxwindows.org.
    With wxWindows installed, follow the build instructions in the Jazz++ package
    to make and install Jazz++.


    # Drivers


    Give some extra consideration to your choice of drivers, because Jazz++ includes
    code for its own driver (mpu.o, installed as a kernel-loadable module) for a true
    Roland MPU-401 MIDI interface card. That driver supports MIDI, with no synchronization
    for the digital audio of Jazz++, but it provides synchronization capabilities
    not found in the kernel (OSS/Free driver). It also provides a network daemon (mididtd)
    that lets Jazz++ act as a client application over a TCP/IP network, The mpu.o
    driver can be either selected at runtime or indicated in the ~/jazz resource file.


    If you intend to sequence MIDI tracks and audio tracks, you can use the OSS/Free
    kernel drivers or the commercial OSS/Linux drivers. Any of those packages can
    be used for MIDI-only work.


    # Recording with Jazz++


    You can put data into Jazz++ by either loading a MIDI file (one with the .mid
    extension) or by recording from an external MIDI instrument. Let''s first record
    data into the sequencer and then edit the recorded data.

    Opening the program brings up the Track window. Select a track to record into,
    name it, click on the Record button, and play away. When you''ve finished recording
    the track, click on the Stop button, and Jazz++ will prompt you to save or discard
    the recorded data. Figure 6-3 shows the Track window of noname.mid (the default
    file name) with one track recorded


    ![](img/43a9671cef617c9c7a18f7a6904433f1_131_0.png)


    Figure 6-3: Jazz++ with one track recorded'
