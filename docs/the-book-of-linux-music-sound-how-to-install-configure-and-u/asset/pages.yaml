- pgno: 264
  md: '# 10

    REALTIME SOFTWARE

    SYNTHESIZERS


    A realtime software synthesizer provides an interface (not necessarily but usually
    a GUI) designed for control of a set of instantly responsive synthesis parameters.
    Some realtime synthesizers (such as Quasimodo and RTSynth) are designed to emulate
    the control interface to a hardware synthesizer, while others (such as aRT and
    jMax) present a more abstract interface in the form of iconic patching-structures.


    The realtime software synthesis applications presented in this chapter are different
    than the Csound GUIs (discussed in Chapter 9), in that the synthesizers provide
    their own software engines—i.e., they are not front-ends for Csound or any other
    software synthesis language. Realtime software synthesizers are optimized for
    response time and immediate access to synthesis parameters. They are indeed serious
    tools, but they are also just fun to play with. MIDI input (from a keyboard or
    hardware sequencer) is usually assumed for the performance interface. The synthesizer
    is designed to respond to a variety of MIDI messages and to treat the computer
    as a synthesizer capable of any digital audio synthesis technique. Some, such
    as aRTs, are evolving into complete production environments, with sequencers and
    the capacity to save performances as files. Others, like RTSynth, are purely control
    interfaces for realtime synthesis engines.'
