    # Managing System Load


    Limit the number of open applications.

    The number of programs you are running on your computer is a decisive factor in
    getting the most from your Linux audio system. Because Linux routinely checks
    various aspects of system performance, limiting unnecessary system activity can
    reduce the possibility of interrupted data streams. Even on a 500-MHz machine,
    it would probably be unwise to record four tracks of CD-quality digital audio
    while compiling the kernel, downloading an 80-megabyte WAV file, and watching
    MPEG animations of fractal displays. If you don''t need to be online, stay off
    the network. On truly low-powered machines (anything less than Pentium CPU), you
    may want to avoid the X window system entirely.


    # Going Farther


    By now you should be acquainted with the basic tools of your Linux sound system,
    particularly SOX and your software mixer. You''re ready to try out the various
    sound and music software packages available for Linux, and that''s what the rest
    of this book is about. I''ll be your guide on this trip, pointing out items of
    interest in this new world. We''ll have an interesting voyage, and I hope you
    enjoy your journey!'
