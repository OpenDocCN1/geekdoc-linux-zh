- pgno: 132
  md: '# Editing with Jazz++


    After recording a track, you can look closely at its contents in the piano roll
    editor by double-clicking anywhere within the recorded track display. Figure 6-4
    displays some measures from our newly recorded Fantastic track, with a small area
    selected for processing. Note that each column in the grid represents one beat
    in a four-beat measure.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_132_0.png)


    Figure 6-4: Jazz++''s piano roll editor


    We can now decide to edit the recorded notes, record another track, or apply a
    randomization process. If we want to edit our new track, we have an assortment
    of tools for the job, including quantization (setting note start-times and lengths
    to a specified value), MIDI channel assignment, transposition, and so forth. Figure
    6-5 shows some of the editing windows available from the Edit menus in the main
    track window and the piano roll editor.


    Jazz++ also includes a multiple Undo function, certainly one of the most important
    features of any modern sequencer, so you can edit and undo until you have just
    what you want.


    # MIDI Features Unique to Jazz++


    So far we''ve looked at Jazz++ features offered on most sequencers today. Now
    let''s look at some of the features unique to Jazz++.


    Randomization functions are not new to contemporary sequencers, but few sequencers
    have as extensive collection as Jazz++ nor are as easy and intuitive to use. Pulling
    down the Misc menu in the Track window, we see randomization routines for rhythm,
    melody, track shuffling, and arpeggiation (breaking block chords into single-note
    sequences). Let''s play with some of these routines and see what happens.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_133_0.png)


