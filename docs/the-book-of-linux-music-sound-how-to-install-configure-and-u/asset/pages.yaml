- pgno: 239
  md: '# Summary


    This profile invites Silence. The program is very deep, the interface invites
    participation and experimentation and the documentation is thorough. Perhaps Silence''s
    immediate appeal will be limited to readers with good backgrounds in mathematics
    and algebra; however, it is also designed for experimentation even by the most
    mathematically naive user (such as myself). Michael Gogins is committed to developing
    and maintaining Silence, and I can think of no better recommendation than to quote
    once more from his Web page: "If you have ever composed by writing a program,
    or by doing mathematics, or to know, then Silence is for you."


    # HPKComposer


    Authors: Didied Debril and Jean-Pierre Lemoine

    Versioned profile: 2.0

    Web site: http://hplank.inetpc.com/

    FTP site: n/a

    Maintained: Yes

    Availability: Free, binary-only

    License: Held by the authors


    Capsule summary: Beautiful graphic interface to Csound and Cmask. Supports audio,
    MIDI, and VRML output


    The HPKComposer Web page describes the application as "... a 3D Art composition
    tool for Csound"—an accurate characterization. HPKComposer presents Csound as
    a virtual synthesizer, concealing the orchestra language behind a well-designed
    graphic user interface. A graphic interface is also used to display the tendency
    masks created by the algorithmic generators.


    # Getting It, Building It


    Download the latest HPKComposer zipfile from the Web site listed above. Create
    a directory named HPK, move the file into it, and unpack it with gunzip hpkc-latest.zip.
    Because the program is distributed only as a binary, no building instructions
    are necessary.


    HPKComposer requires Java, either the JDK (Java Development Kit) 1.1.6 (or higher)
    with the Swing extensions or the JDK 1.2, which does not require the Swing software.
    You can download the JDK from the Blackground''s Web site at www.blacklist.org,
    and the Swing extensions are available from Sun Microsystems at www.java.com.
    Follow the instructions included in the package to install: It is beyond the scope
    of this book to detail the installation of Java, but it isn''t difficult to do,
    and you must have a recommended JDK installed before you can use HPKComposer.


    HPKComposer is packaged with Windows-specific start-up batch files that you can
    use as guides for writing your own Linux-specific scripts. I have two ver-'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'ions of Java installed on my machine, and I have two separate scripts for starting

    HPKComposer. Here is my script for starting it with the JDK 1.1.7 and Swing.


    java -classpath:/usr/local/java/lib/classes.zip:home/swing/swing-

    1.1/swingall.jar:hpkc.jar hpkc.commonview.CSoundApplication


    My JDK 1.1.7 installation is my default Java. To start HPKComposer with

    the JDK 1.2, I use this script:


    ```

    /home/jdk1.2/bin/java -classpath :/home/hpkc/hpkc.jar hpkc.commonview.CSoundApplication

    ```


    > On my system (described in Chapter 2), HPKComposer''s performance is significantly

    better when using the JDK 1.1.7. However, development work proceeds on the JDK
    1.2

    and it may therefore be more usable by the time this book has been published.
    HPKCom-

    poser was relatively sluggish with the JDK 1.2, but that may be due to my slow
    processor

    (a Pentium 166).


    Copy the appropriate script as go.hpkc, then run chmod +x go.hpkc to give it

    executable permission (you may need root privileges to do so). As presented

    here, these start-up scripts must be run from the HPKComposer home directory.

    Once you have written the start-up scripts, you''re ready to work with

    HPKComposer.


    # HPKComposer Setup


    Run your preferred starting script. When HPKComposer opens, you will see

    the screen shown in Figure 9-31.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_240_0.png)


    Figure 9-31: HPKComposer'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Click on the Create a new composition button. A Files dialog box will appear.
    Type my_new.hpk in the entry box, click the Open button, and a set of sixteen
    moments you will see the Composition Structure screen (also called the Synoptic
    view in the program documentation) shown in Figure 9-32.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_241_0.png)


    Figure 9-32: HPKComposer''s Composition Structure screen


    By default, tooltips are active: Move the mouse pointer over an icon and let it
    rest there, and a small box will appear with a short definition of the icon''s
    function. Move the pointer around the Synoptic view to see a set of the tooltips
    for the various buttons and icons.


    The row of buttons at the upper left corner of the screen provides file management
    functions, soundfile generation and play, preferences and external helper settings,
    and modules database management. The button in the top right corner calls the
    HPKComposer VRML scene editor.


    Four sets of numbered edit buttons fill the greater part of the Composition Structure
    display. From left to right, you see a curving set of sixteen buttons for editing
    the VRML graphic objects (more about that later), a set of eight buttons for editing
    the Structure (the Csound sound), another eight buttons for editing your instrument
    (Csound or file), and a group of four buttons for editing the global effects (such
    as reverb and echo).


    In the bottom corner, four keyboard icons represent the MIDI connections to the
    VRML display. The MIDI-to-VRML connection is currently unavailable in the Linux
    version of HPKComposer, so these keyboards may be ignored. The remaining corner,
    near the upper left, is a toggle for setting a duration that overrides any other
    setting for the score length.


    218 Chapter 9'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'Before going farther into HPKComposer, press the Edit Settings button and declare
    your preferred external soundfile player and your Csound executable. Figure 9-33
    shows my settings in the Output tab.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_242_0.png)


    **Figure 9-33**: Output settings


    The Look and feel File Generation tab provides toggles for MIDI file creation
    and pro-change MIDI message transmission. As of this writing, JavaSound is not
    implemented in Linux Java, so you must indicate an external player in your **Output**
    settings. The other controls available on this tab include instrument selection
    and a MIDI controller assignment table. MIDI channel and an initial Program Change
    message can also be set here.


    # Using HPKComposer


    Because our focus is on HPKComposer as a GUI for Csound, we will begin our explorations
    by building an instrument (orc file), creating a score (sc file), compiling the
    orc and sc files into a WAV file, and playing the output soundfile.


    # Building an Instrument


    Building a simple instrument is easy. From the **Synoptic** view, click on the
    **Edit Instrument** button. The edit screen will open to the HPKSynthe default
    display, a GUI for a software synthesizer based on predefined Csound instruments.
    The HPKComposer window should now look like like the screenshot in Figure 9-34.'
  merge: -1
  img_proc: true
- pgno: 243
