    # ### Example 1: Generating MIDI Files with the Markov Maker


    The Markov Maker utilizes a randomization process known as a Markov chain. The
    Markov Maker will analyze a piece of music, calculate its note-order probabilities
    from existing music, and tabulate how often each note occurs and in'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'what circumstances (e.g., whether it follows only other notes, appears only
    in chords, or appears in only a section of the music). By applying these derived
    "rules," it generates a new phrase or piece that can be quite similar to the original.
    KeyKit''s Markov Maker provides an intuitive, interactive means for exploring
    the possibilities of Markov chains, instantly turning theory into music. (Readers
    interested in more details on Markov processes should consult the relevant sections
    in Charles Dodge''s book, ''Computer Music:'')


    To analyze a file with Markov Maker, open the pop-up menu, choose the Tools submenu,
    click on the big Orig button, and choose Read File from its menu. For our first
    example (following the suggestions given in the tools.pdf file included with the
    distribution), we''ll select the Bach prelude (prelude.mid) from the MIDI files
    in the KeyKit music directory.


    Next, the permutation probabilities by pressing Orig again, this time selecting
    the Set Sim item to set the similarity parameters and choosing Win 1b/2 and Inc
    1b/4. The Win value signifies the size of the analysis window, and the Inc value
    is its increment as it moves across the analyzed music. Figure 6-25 shows prelude.mid
    loaded into the Orig area of the tool. With most of KeyKit''s windows, clicking
    anywhere within the tool will start and stop-back of the MIDI data.


