    further exploration of aRTs as your next exercise.


    # Advanced aRTs


    The aRTs MIDI server creates and manages a MIDI connectivity channel called the
    midibus. Any midibus-aware clients can be connected to one another for communication
    over the bus line. Chapter 6 presented a detailed example of a midibus connection
    in the profile of the Brahms MIDI sequencer.


    # Summary


    The design spirit of modular synthesizers encourages arbitrary connections between
    the hardware modules that define the synthesis parameters. aRTs carries this philosophy
    into the free arrangement and connection of software modules but, unlike the hardware
    synths, aRTs can call virtually any number of modules desired. Despite the rather
    daunting set of modules, once you understand the program’s basic operations, even
    a novice can immediately begin building complex structures. The documentation
    is excellent, the mail-list is'
