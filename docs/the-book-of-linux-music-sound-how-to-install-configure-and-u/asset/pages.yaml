- pgno: 347
  md: '# Using Freebirth


    When the program opens, you will see the trio of windows shown in Figure 13-10.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_347_0.png)


    Figure 13-10: Freebirth''s opening three windows


    The top left panel of the largest window, consisting of four modules, the step-sequencer—where
    you will compose your rhythm patterns and bass lines. Each module is composed
    of four identical vertical strips, and each strip contains (from top to bottom)
    five rhythm grid toggles for the five sounds, a slider for the pitch of the bass
    synth, a toggle for the synth hit point, and a beat tracking line.


    The top right section of this window is the mixer section, which provides sliders
    and knobs to control the relative channel volumes and panning as well as the effects
    line send and return values. Six sliders are labeled smp (sampled sound), oh (open
    hi-hat), ch (closed hi-hat), sn (snare), bd (bass drum), and bas (bass synth).
    The remaining two unlabeled sliders control the master volumes for the effects.


    The virtual knobs in the lower half of the main window control the bass synthesizer.
    The synthesizer''s global parameters include filter Q (resonance), cutoff frequency,
    and envelope attack and release times. The three oscillators have controls for
    their blend, phase, and frequencies, and the synth''s output amplitude envelope
    controls for its attack and release times. The synth panel also contains the Start/Stop
    and tempo controls.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'The Sample Pitch window—immediately below the main window, across the bottom
    of the display—lets you tune the sampled sounds. This is a very cool control,
    permitting some outrageous effects with realtime pitch-shifting. Using subtly,
    it creates a more realistic dynamic space (a slight detuning adds realism to drum
    sounds, for instance). The Effects window—the smallest window, at the right of
    the display—controls the integrated delay (the top half) and reverb (the bottom
    half). The delay module is a set of three delay lines with parameters for delay
    time in milliseconds, feedback of the delay tapped, and the amount of the tap
    that will be sent to the module output. The reverb module displays six pairs of
    controls for delay time and feedback amount for each of the comb filters (which
    make the reverb) and two pairs of controls for phase and feedback values for the
    allpass filters. As in the Sample Pitch window, realtime control of the effects
    can produce some fascinating sonorities. Figure 13-1 shows Freebirth with settings
    for rhythm patterns, bass synthesis, sample pitch, and effects.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_348_0.png)


    Figure 13-11: Freebirth with various settings


    All of Freebirth''s parameters are controllable in real time, and even if you
    know nothing about programming a synthesizer or a drum machine, you''ll be able
    to quickly generate some great sounds and patterns. There''s not much more to
    say about using Freebirth: The rest is all interactive.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# Saving Sessions


    One way to get around Freebirth''s lack of a Save State function is to make a
    screenshot of a session setting. Although not the most elegant of solutions, this
    snapshot of your settings will at least give you a model to work from if you try
    to recreate the session later.


    # Freely Speaking


    Freebirth is easy to use, incredibly fun, and sounds great. At the time of this
    writing, the program is strictly a performance-oriented virtual machine. The developers
    are considering ways to implement a digital audio save function, but even in its
    current state it has very cool features. Freebirth will appeal especially to composers
    who want to create dance rhythm tracks for bass and drums, but its flexibilities
    should interest any Linux musician. Definitively recommended.


    # Togetherness...


    You can integrate the software profiled in this chapter into a powerful toolkit.
    For example, you can use Green Box to create beat loops for use behind scratch
    tracks created in terminatorX, or save your recordings from terminatorX for use
    in the Ooolaboola mixer. If you have external recording facilities (such as a
    tape or hard-disk recorder) you can save Freebirth performances and record them
    back into your computer for use as material for Ooolaboola and terminatorX. And
    those of us fortunate enough to have two computers running Linux can play Freebirth
    on one machine while a friend plays Ooolaboola on the other—a def jam, indeed.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# # 14


    # ## LINUX GAMES


    ![](img/43a9671cef617c9c7a18f7a6904433f1_350_0.png)


    Computer games are the best indicators of how well a computer can present fast
    action in high-resolution graphics, seamless animations, scrolling text (often
    in unusual fonts), and of course high-quality sound in MIDI, MOD, and other digital
    audio formats.

    Until recently, games for Linux meant the various Pac-Man clones, Tetris variants,
    and chessboards available from the famous MetaLab (formerly sunrise) software
    repository (http://metalab.unc.edu). Many of those games are fun to play, but
    they are no match for the range and complexity of the commercial games familiar
    to Mac and Windows users.


    However, in the late 1990s the maturity of Linux attracted the attention of serious
    game developers, id Software (www.isoft.com), creators of the enormously popular
    Doom, announced the commercial release of Quake III: Arena for Linux. Each of
    commercially available shrink-wrapped Linux games had arrived. Loki Entertainment
    (www.lokigames.com) has partnered with a variety of companies (including id Software)
    to bring the latest games to Linux, and at last Linux users can play the newest
    games on the hottest new operating system.


    And things will only get better. Game development in the free software community
    benefits from the continuing expansion of game software development kits (SDK)—such
    as ClanLib (www.clanlib.org) and the SDL (Simple DirectMedia Layer) project (www.devolution.com/~slouken/projects/)'
  merge: -1
  img_proc: true
- pgno: 351
  md: '—that provide support for graphics and sound routines, freeing the game designer
    to concentrate on design.


    Sound support in Linux games is relatively uncomplicated. If you set it up properly
    and you can play WAV, MOD, MIDI files, then you should have few any problems getting
    sound from your Linux gaming experience. Some games (such as Doom) may require
    a separate sound server, but most will provide transparent support for sound with
    no special software requirements.


    The games presented in this chapter have been chosen for their availability, playability,
    and support for sound. Linux gaming is a rapidly developing activity—as I write
    this chapter in mid-2000, I can safely say that the fun is just beginning.


    # Quake


    +   Authors: id Software (John Carmack, John Romero, Adrian Carmack, Zoid, others)


    +   Version profiled: 1.0


    +   Web sites: http://www.quake.com


    +   FTP site: http://ftp.idsoftware.com/idstuff


    +   Maintained: Yes


    +   Availability: Free, open-source


    +   License: GPL


    +   Capsule summary: Extremely fast 1st-person shooter with much violence and
    gore (rated PG)


    Unless you''ve lived under a rock for the last decade, it''s hard not to have
    about id Software''s Doom and its even more intense successor, Quake. These games
    are fast, wild, and even frightening journeys through nightmare scenarios populated
    by hellish monsters and mindless zombies, all of which you must avoid or destroy
    (before they destroy you) to reach the level of game. When it was first released,
    Doom set a new standard for action games, and Quake has advanced the standard
    even further.


    In 1999, id Software announced that the Quake source code would be opened and
    licensed under the GPL. Linux game developers considered this a major coup that
    made it easier to find and fixing many bugs and add new features to a commercial-grade-grade.
    In addition, developers could sharpen their coding and design skills by studying
    the sources for a commercially successful large-scale game.


    # Getting It, Building—Downloading—It


    Generally speaking, if a package is available in source code, I usually prefer
    building it myself. However in the case of Quake, I advise downloading the pre-'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'built binaries. The Quake source code is designed to compile under the Microsoft
    C++ compiler and masm, the Microsoft assembler (to compile the parts written in
    assembly language). Although it is possible to use the native Linux assembler
    (named "as") the GNU/C++ compilers (gcc and g++), building Quake is definitely
    a task for the experienced Linux programmer. If you absolutely must build the
    game yourself, the qsource.txt file on the id Software ftp site (see above) contains
    the instructions for compiling it. For the purpose of this chapter, I will assume
    you are using one of the pre-built versions.


    Free for Quake are available for XI and SVGA, but you will also need the data
    files from the Windows shareware version. Again, the LinuxQuake HOWTO will direct
    you to various sites for acquiring the binaries. Create a new directory for these
    files in your /home/usr/local/directory, then unpack the binaries with tar xzvf
    quake-package.tar.gz.


    Next you need some drivers to play. The id Software ftp site offers a free single-episode
    version of Quake. Download the quake106.zip for your /home or /usr/local directory,
    create a new directory named Quake, then merge the zipfile into. A file named
    resource.1 will be created: This file is an iha archive and requires the lha file
    compression utility to unpack it. (If lha is not available on your system, you
    can find it at ftp://sunite.unc.edu/pub/Linux/utils/compress/lha-1.00.tar.z) Run
    lha A number of files and directories will be created, including the /id directory
    containing the data files for the various Quality levels.


    > If you already have Quake installed in Windows, you can simply copy the id1
    directory (and-its files) to your Linux Quake directory. Alternately, you can
    copy the resource.1 archive file from the Quake CD-ROM and unpack it as described.


    To start the game in X, open an xterm window, enter your Quake home directory
    and type quake. To start Quake from the console, enter quake at the command prompt.


    # Before You Begin


    Quake starts up with a high-speed demonstration run through the first level. Hit
    your ESC key at any time to start the game, but before jumping into the fray you
    should set your preferences in the Options menu shown in Figure 14-1. The game
    includes a built-in CD player, so you can choose (from the Options menu) to listen
    to the music from the original distribution discs or any other audio CD in your
    collection. You can also set your competency rating, the graphics brightness,
    the mouse sensitivity, and the sound effects volume. With your preferred settings
    you can now chop, blast, frag (blow up an opponent with a fragmentation bomb),
    and race your way through the demonic world of Quake.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_353_0.png)


    # # Playing Quake


    This is Quake: Monsters want to kill you before you can reach the gate to the
    next level, so your primary activity is to stay alive as you move through each
    scenario picking up life extenders such as health packs, protective armor, and
    new weapons and ammunition. You can save your game at any time, making it easy
    for you to learn the tricks without having to start over from the beginning each
    time you get slaughtered by some mindless zombie.


    Beyond that, you''re on your own.


    Quake''s graphics and sound are designed to evoke dread and caution. At all times
    the grim sky is moving overhead, while lurid lighting effects flicker and pulsate
    around you. Even when you can''t see them, you hear the sounds of creatures just
    around the corner, warning you to stay locked and loaded for the next fast-action
    firefight. The sound effects were created by Trent Reznor (of Nine Inch Nails
    fame) and are employed to great effect throughout the game: a low mo wind whenever
