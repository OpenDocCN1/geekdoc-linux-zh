    Download the latest package from the SoX Web site, or copy the sox-latest.tar.gz
    file from this book''s CD-ROM. Once you have the SoX source code package, unpack
    it in your /home or /usr/local/ directory. Enter the newly created SoX directory
    and follow the same build procedure as with aixix and yare: ./configure; make;
    make install (don''t forget to su root for the last step!) will complete the building
