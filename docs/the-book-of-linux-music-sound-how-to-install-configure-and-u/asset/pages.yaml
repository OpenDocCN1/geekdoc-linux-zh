- pgno: 322
  md: 'To broadcast live over a TCP/IP network, simply change the URL entry in the
    11voice.cfg file to your IP address (as you did shout).


    You can now make realtime modifications to your broadcast via the liveice interface
    and its various control commands (described in the liveice documentation) or with
    the Td/Tk front-end (Figure 1-6).


    # Performance Considerations


    Bandwidth and connection speed determine the quality of your network broadcast-cast
    audio. Although the MP3 format is remarkable for its compression ratios, it is
    still a rather dense data format for streaming audio and requires a fast CPU (I
    recommend at least 266 MHz Pentium or equivalent) and a fast network connection
    for the smoothest transmission and reception. An ISDN, cable modem, or DSL/ASDL
    connection is a must for high-quality broadcasting.


    Your icecast station bitrate can be adjusted to accommodate lower-powered machines
    and connections, but be aware that audio quality will be compromised, most notably
    if you are sending music streams. Spoken-word broadcasts can use the lower rates
    with much less noticeable degradation..


