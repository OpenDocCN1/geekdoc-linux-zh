  md: '# # MP3 Politics


    | | Name | Stre | K/s | Freq | Upload Date | Time |

    |---|---|---|---|---|---|---||

    | 3 | terror_opus.mp3 | 3180317 | 12 | 44100 | 08/07/99 | 22:00:46 |

    | 4 | we_com_to_glabber.mp3 | 2960114 | 125 | 44100 | 08/07/99 | 22:01:37 |

    | 5 | adstein.mp3 | 2150311 | 119 | 44100 | 08/07/99 | 22:02:37 |

    | 6 | fireworks.mp3 | 3104061 | 118 | 44100 | 08/07/99 | 00:37:43 |

    | 7 | shift_stick.mp3 | 3054325 | 126 | 44100 | 08/07/99 | 00:39:09 |

    | 8 | restless.mp3 | 2036326 | 128 | 44100 | 08/07/99 | 00:41:50 |

    | 9 | worthless.mp3 | 2063526 | 120 | 44100 | 08/07/99 | 00:44:12 |

    | 10 | stateforemergency.mp3 | 1224999 | 56 | 22050 | 08/07/99 | 00:47:34 |

    | 11 | Sweetdreams.mp3 | 1668727 | 56 | 22050 | 08/07/99 | 00:48:37 |

    | 12 | comeonletsgo.mp3 | 1851066 | 56 | 22050 | 08/07/99 | 00:50:00 |


    Figure 7-15: Krio''s interface (image courtesy of Kyle Smith)


    Music distribution using the MP3 format is a rather hot topic because MP3''s compression
    scheme and its high audio quality made it natural for distribution of both legal
    and pirated music over the Internet. The Recording Industry Association of America
    (RIAA) has targeted MP3 as promoting piracy (given that there is no way to prevent
    the illegal copying of MP3 files) and sued Diamond Multimedia in October 1998
    in an attempt to halt the sale of their Rio MP3 player. The suit failed.


    In 1999 the MP3 format was embroiled in more legal hot water, thanks to the Napster
    (www.napster.com) MP3 server software. Napster lets users register their MP3 collections
    online, making the contents freely available to a Napster client (see the Web
    sites listed above for Linux versions of Napster client and server software).
    Consequently, the RIAA sued Napster''s authors.


    Whether the MP3 proves to be bane or boon to the recording industry remains to
    be. On the consumer''s side, the format''s audio quality, ease of reproducibility,
    and ease of transfer have made it an enormously popular sound for legitimate (and
    not so legitimate) Internet distribution, and it shows no signs of disappearing
    anytime soon. On the industry''s side, it understandably wants to protect its
    interests. Music piracy and the theft of copyrighted material cannot be condoned,
    but MP3''s strengths have raised some difficult issues regarding the consumer''s
    de facto freedoms and the industry''s rights. Until these issues are resolved
    legally, we will each have to resolve them with our own set of personal ethics.'
  merge: -1
  img_proc: true
