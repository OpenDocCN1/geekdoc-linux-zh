  md: '# 7


    # LINUX DOES MP3


    ![](img/43a9671cef617c9c7a18f7a6904433f1_156_0.png)


    All soundfile formats have limitations. CD-quality audio in the WAV soundfile
    format requires 10 MB of disk storage per stereo minute. Furthermore, Internet
    bandwidth and transmission rates do not favor CD-quality WAV or AIFF audio files
    streamed to your computer in realtime over the Net. The MP3 audio file format,
    however, overcomes these limitations by significantly reducing storage and network
    transmission requirements while maintaining high-resolution (at least 16-bit)
    sound quality. Not surprisingly, the MP3 audio file format is commonly encountered
    on Web pages and is a popular Internet broadcasting medium.


    # What Is MP3?


    MP3 is the popular name for soundfiles in the MPEG Layer 3 Audio file format.
    MPEG, the Motion Pictures Experts Group, is an organization that defines data
    compression standards for digital audio and digital video. In addition to being
    used to distribute and broadcast high-quality compressed audio over the Net, the
    MP3 audio format is used by HDTV (high-definition television) and DVD (digital
    video disc). MP3 technical details are beyond the scope of this book, and I refer
    the reader to the excellent MP3 Tech Web site at http://www.mp3-tech.org for the
    format''s history, technical specifications, and terminology.'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'MP3 is the preferred format for distributing and promoting music on the

    Net, yielding near-CD sound fidelity with 16-bit resolution in file sizes nearly

    to modem transfers (a 50-MB WAV file can be reduced to a 5-MB MP3 file).

    MP3-encoded music can also be broadcast over the Internet as streaming

    audio (compressed data formats suitable for realtime transmission over a net-

    work), allowing you to listen to MP3 files as they download to your computer.


    Hardware MP3 players, such as Diamond''s Rio (which lets you save and

    d download MP3 files on your portable player), combined with faster

    Internet connections, have helped to turn MP3 into an effective way to distr-

    ute music over the Internet. Web sites like MP3.com (www.iuma.com) and the

    Internet Underground Music Archive are essentially huge

    collections of all types of MP3 files that have brought a wide range of music

    the Web overnight (along with all sorts of copyright issues). You can\listen to
    selections over the Internet in streaming audio, download the music

    you, organize it into customized playlists, and fire it through the

    computer''s parallel port into your portable MP3 player.


    # Bitstreams and Bitrates


    Whereas the audio quality of a WAV file depends on its sampling rate and bit

    resolution, the audio quality of an MP3 file depends on its bitrate. The bitrate

    is the number of kilobits (kbps) per second at which an MP3-compressed bit-

    stream flows from storage (disk or RAM) to the decoder input. A bitstream is

    simply the series of bits representing the encoded data. The standard bitrate

    of near-CD audio quality stereo MP3 files is 128 kbits. Higher bitrates

    improve the audio quality, but at the cost of a correspondingly larger file size.


    # Linux MP3 Applications


    Linux MP3 applications include encoders and decoders, MP3 file servers for

    network audio broadcasting (see Chapter 12), file identification tag editors,

    dabase management software for large collections of MP3 files, and file

    transfer utilities for hardware players like the Rio. Versions of these tools
    are

    aavailable for the Linux console and the X window system.


    # The Encoder


    An MP3 encoder compresses soundfile data. MP3 data compression (or

    "encoding") is the process of reducing the size of a file by applying

    sophisticated algorithms to recognize and compress redundant data. The pop-

    lar PKZIP compression utility for DOS/Windows works with a plain text file in

    this way, removing the redundant white-space data and marking its location for

    decompressing later. For text files and many other file formats, the compres-

    alg in programs such as PKZIP and GZIP can yield greatly reduced'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'file sizes, facilitating archive maintenance, conserving storage, and reducing
    the burden on network transfers. High-resolution digital graphics, video, and
    audio also require large amounts of disk storage, but the data compression and
    reduction routines of the ZIP-style utilities will not significantly reduce their
    file sizes. A five-minute WAV-format stereo soundfile contains 40 million bytes,
    and very few of them are absolutely identical values. Data compression for text
    files is called "lossless" compression; that is, when the compressed file is uncompressed,
    the data is restored to its original condition. "Lossy" compression schemes can
    provide greater soundfile size reduction, but they do so by sacrificing data considered
    irrelevant or unacceptable. Specialized lossy compression schemes (such as MP3)
    have been devised for soundfile formats. One of the best-known implementations
    of an MP3 compressor is the BladeEnc encoder.


    # The BladeEnc MP3 Encoder


    +   Author: Tord Jansson

    Version: 0.76

    Web site: http://bladeenc.mp3.no/

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: LGPL


    Capsule summary: Fast, stable, open-source encoder with broad range of bitrates.


    Among the several Linux encoders (including the Hannover MPEG Encoder and MP3ENC
    from Fraunhofer IIS), my first choice is BladeEnc. A freely available encoder
    that reads WAV and AIFF soundfiles, BladeEnc supports bitrates from 32 to 320
    kbps per second. It will accept 8-bit and 16-bit stereo soundfiles with sampling
    rates of 32, 44.1, or 48 kHz. BladeEnc is a command-line utility, but graphic
    front-ends are available in Gtk and Qt interfaces.


    # Getting It, Building It


    After copying the package from this book''s CD or downloading it from the BladeEnc
    Web site, move it to wherever you keep new packages (either /home or /usr/local
    directory is a good choice, which has much more space). Unpack it with tar xzv
    bladeenc-latest.tar.gz, then switch to your new BladeEnc directory and follow
    the instructions to build and install the program. A simple ./configure and make
    will build it. Become superuser with root and enter make install to put a working
    copy of BladeEnc in your system path, and you are now ready to run the encoder.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Using BladeEnc


    Running BladeEnc with no command-line argument or options yields the display in
    Figure 7-1.


    Running BladeEnc with its defaults yields the display in Figure 7-2.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_159_0.png)


    Figure 7-1: BladeEnc help screen


    ![](img/43a9671cef617c9c7a18f7a6904433f1_159_1.png)


    Figure 7-2: BladeEnc run with its defaults


    In the example shown in Figure 7-2, the original 76.65-second-long file was reduced
    from 14 MB to less than 1.3 MB on Pentium 166 in just under five minutes with
    the command bladeenc am004.wav am004.wav is the name of the file that was encoded.


    # GUIs for BladeEnc


    KBlade and Grip, shown in Figure 7-3, are two of BladeEnc''s GUI front. KBlade
    presents simple, command-line options in a pleasant Qt frame. It runs fast as
    BladeEnc and is very convenient in an X session. Mike Oliphant''s Grip is more
    complex: Like KBlade, it provides a nice interface to BladeEnc (and other encoders),
    but it also has a user-definable CD ripper and Mike''s GCD player. (Grip is described
    at greater length later in this chapter.)'
  merge: -1
