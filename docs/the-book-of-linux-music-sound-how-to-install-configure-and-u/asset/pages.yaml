    The grapher in the my_first example also provides a total_time slider. Adjusting
    this slider will determine the length of the output file. The other sliders (to
    the left side of the graph display) control the grid intensity and the zoom view
    into or out of the grid.


    The intensity and zoom sliders are default parts of the Cecilia grapher. Other
    default parts of the grapher include the menu bar and the toolbar directly beneath
    it.


    The File, Edit, Windows, and Help menus are the same as those on the main window.
    The toolbar contains a variety of useful tools for creating, editing, and randomizing
    graph curves. The leftmost button removes the toolbar from the grapher, displaying
    the tools in their own window. In Figure 9-7 the tools are, from left to right,
    the "scissors group," which includes buttons for cut/copy/paste operations, with
    a reset function (the eraser) and two buttons for file save and load (Cecilia
    can save and load graphs); a pair of buttons to nudge the display up or down slightly;
    the "sine wave" group, which includes functions for generating and randomizing
    waveforms; and two buttons to expand and contract the display vertically and horizontally.


