  md: '# NAS


    Authors: Network Computing Devices (Jim Fulton, Greg Renda, Dave

    Lemke, Jon Trulsion, others

    Version profiled: 1.3e

    Web site: http://radscan.com/nas.html

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: Held by authors


    Capsule summary: Network audio services provider with client/server soft-

    ware architecture


    Network Audio System (NAS) lets you play, record, and manipulate audio

    data over a network. The system provides an audio server (nasd), more than

    a dozen client applications and utilities, and extensive documentation in man

    (manual) and PostScript formats. The server makes low-level connections

    with hardware, provides audio I/O services to small "lightweight" client

    applications over a network, and allows multiple clients simultaneous access to

    the sound device. The NAS server and clients can handle AU/SND, VOC,

    WAV, AIFF, and 8SVX soundfile formats.


    NAS is perfect for providing audio services to LANs (local

    area networks), diskless workstations, and networked machines without sound-

    cards. Performance is excellent: The nasd server is completely transparent,

    the included client applications are simple and easy to use, and the sound

    quality is clean and clear. The package has been maintained since 1995,

    resulting in a stable and powerful network audio service provider. If you need

    a solid and secure means of distributing sound over your network, you’re

    looking for NAS.


    # Getting It, Building It


    Retrieve the NAS package from http://radscan.com/nas.html or this book''s

    CD-ROM and unpack it in your /home or /usr/local/ directory. Retrieve the new

    as-latest directory and carefully study the README and BUILDNOTES files.

    The NAS build utilizes a template called an Makefile that sets rules for your
    machine architecture

    (NAS will be built on Sun, SGI, HP, and Intel-based machines). Run xkmmf in the

    NAS top directory to create the top Makefile, then run the following

    command to build NAS:


    ```

    make WORLDOPTS="-k DEBUGFLAGS=''-02 -D_USE_BSD_SIGNAL=''" World

    ```


    Run make install and make install.man to install the NAS server, clients,

    and manual pages.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'Before starting your new NAS server, go to /etc/nas/ and copy the example-nasd.conf
    file to nasd.conf. You may need to do chmod +w nasd.conf to edit the file (its
    default condition is read-only). Change the following sections to reflect the
    capabilities of your soundcard:


    ```

    inputsection

    device             "/dev/dsp"      # SB PCI128 is full-duplex

    maxrate 48000      # maximum sample rate for the card

    minrate 5000       # minimum sample rate

    maxfrags 3         # low latency

    minfrags 2         # the default

    fragsize 256       # low latency

    wordsize 16        # i/o is 16-bit on the PCI128

    numchans 2         # and stereo


    outputsection

    device             "/dev/dsp"

    maxrate 48000

    minrate 5000

    maxfrags 3

    minfrags 2

    fragsize 256

    wordsize 16

    numchans 2

    ```


    When the nasd server starts, it will use these values for the system record- and
    playback defaults.


    # Using NAS


    Start NAS from the xterm or console prompt with the nasd & command (the & puts
    the process in the background). While the server is running, any of the NAS clients
    can access its services as long as they know the server''s network address. Now
    type audemo to launch the record/play demonstration client (Figure 12-9). The
    interface is self-explanatory.


    Select Record and the window in Figure 12-10 will appear. Again, the record interface
    is self-explanatory. Press the Record button to start your recording, then Dismiss
    to stop and close the window. The audemo panel panel will update automatically.
    Simply double-click on your new soundfile to listen to it. Note that the info
    panel will also update with information about your file, as shown in Figure 12-11.'
  merge: -1
  img_proc: true
