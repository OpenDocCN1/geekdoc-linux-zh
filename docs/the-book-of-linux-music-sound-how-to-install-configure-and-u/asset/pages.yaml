    Alexander Koenig named terminatorX after the famous rap Public Enemy. The author
    describes his software as “... a realtime audio synthesizer that allows you to
    ''scratch'' on digitally sampled audio data ... just like you might have hip-hop
    DJs on vinyl records. ” With one soundfile for a background loop and another for
