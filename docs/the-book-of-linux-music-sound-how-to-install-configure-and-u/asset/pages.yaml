    # # Snd


    **Author:** Bill Schottstaedt

    **Version profiled:** 3.2

    **Web site:** http://ccrma-www.stanford.edu/CCRMA/Software/snd/snd.html

    **FTP site:** ftp://ccrma-ftp.stanford.edu/pub/Lisp/

    **Maintained:** Yes

    **Availability:** Free, open-source

    **License:** Copyright held by the Board of Trustees at Stanford University

    **Capsule summary:** Loads arbitrarily large files, includes synthesis and processing
    capabilities of Common LISP Music, accommodates widest variety of soundfile types


    Snd is a straightforward tool, easy to use, with considerable power lurking behind
    its simple interface. It is tightly integrated with Common LISP Music (CLM, a
    Music-V-type audio processing environment similar to the Csound programming language),
    allowing users of CLM to quickly see the results of their computations, edit the
    results in Snd, and send the data back to CLM for further processing. Recent evolution
    of Snd includes the integration of CLM’s processing power directly into Snd—in
    other words, CLM is compiled as a normal object file and included in the build
    of Snd.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Getting It, Building It


    The Snd distribution package includes makefiles for various machines and environments,
    including Linux and LessTif. If any particular makefile doesn''t work, running
    ./configure should create a site-specific makefile. After configuration, Snd is
    compiled and installed by running CLM and then (as root) make install.


    # Editing Tools


    At first glance Snd seems a bit bare: No drop-down menus offer lengthy lists of
    DSP functions, and in fact very few functions—beyond cut/copy/paste operations—seem
    in residence. Figure 4-16 shows what Snd looks like when invoked with a filename
    from the command line. Not much to look at, until the Show Controls option is
    selected from the View menu. Figure 4-17 shows the file display with controls:
    The amplitude and speed controls are usable in realtime, whereas the other settings
    must be applied (with the Apply button) before they take effect.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_80_0.png)


    Figure 4-16: Snd invoked from the command line


    The Filter control is of special interest: The window at the bottom of the figure
    provides a graphic envelope editor (the horizontal line), while the window immediately
    to the right of the "filter" label displays the graph coordinates in the proper
    LISP notation for use in CLM. Figure 4-18 demonstrates the use and application
    of the graphic filter control.'
  merge: -1
  img_proc: true
