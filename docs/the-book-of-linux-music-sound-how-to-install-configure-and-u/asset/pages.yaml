    Now select **Tools2** from the pop-up menu and click on the **RiffRaff** tool.
    A small "sweep" icon will appear: click and drag the icon to open and size the
    RiffRaff tool. Clicking on **More** in the **RiffRaff** tool lets you choose between
    recording new notes into the tool or loading a MIDI file into it. Click on the
    **On** button within the graphic note display to audition the MIDI file or recorded
    events. You can also trigger playback (of RiffRaff and most of KeyKit''s other
    tools) by using the **Bang** tool. Bang is especially useful in complex KeyKit
    structures where you want to manually trigger a process or processes at random.
    To use it, use the pop-up menu and select **Bang** from the Tools2 submenu. Click
    on the **Add** button on the **Bang** tool, and a line will appear. Drag this
    line into the **RiffRaff** tool. Release the mouse button, and you can now switch
