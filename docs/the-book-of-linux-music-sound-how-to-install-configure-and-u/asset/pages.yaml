- pgno: 127
  md: "# MIDI Software for Linux\n\nOnce MIDI is installed, its use is transparent.\
    \ You can reconfigure the interface device on most MIDI applications, and with\
    \ some you can send MIDI output to any or all active devices. Typically, you can\
    \ choose the interface device from a program's menu and freely switch between\
    \ selections.\n\nIn this section I will profile several solid Linux applications,\
    \ including sequencers (Brams and Jazz++), MIDI file players (TiMidity++ and playmidi),\
    \ an experimental MIDI composition environment (KeyKit), and a software fader\
    \ box (xphat). Armed with the information given below, you will be prepared to\
    \ explore the MIDI side of Linux music and sound applications.\n\n| Brahms | MIDI\
    \ sequencing with interfacing with external software synths. Most useful when\
    \ combined with the aRTs synthesizer. |\n Jazz++ | A professional-grade MIDI/digital\
    \ audio recorder and editor, suitable for nearly any MIDI demands. |\n TiMidity++\
    \ | High-quality MIDI-to-WAV rendering, especially useful if your soundcard has\
    \ no on-board synthesizer. |\n playmidi | Command-line MIDI player with extensive\
    \ playback options; can be configured for any Linux machine (including extremely\
    \ low-end). |\n KeyKit | An environment for experimenting with MIDI with a GUI\
    \ and a command-line language; exceptional for generating MIDI data and processing\
    \ it in often-unusual ways. |\n xphat | A MIDI fader box; provides controllers\
    \ for machines without them. Very useful for adjusting sound parameters via system-exclusive\
    \ messages. |\n\n# Brams\n\nAuthors: Jan Würthner and Fabian Wenzel\nVersion profiled:\
    \ 0.97.2\nWeb site: http://lienhard.desy.de/mackag/jan/Brams/\nFTP site: n/a\n\
    Maintained: Yes\nAvailability: Free, open-source\nLicense: GPL\n\nCapsLock summary:\
    \ Solid MIDI sequencing environment, interfaces and cooperates with aRTs realtime\
    \ software synthesizer\nThe Brahms specification file describes the program as\
    \ a \"MIDI sequencer with extensive editing facilities.\" \"That's putting it\
    \ mildly.\" Originally inspired by the Popular Cubase MIDI sequencer for Windows,\
