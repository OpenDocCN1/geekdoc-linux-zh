- pgno: 64
  md: '# Using SoX


    Let''s use SoX to convert the testrec.wav file you just recorded with yarec resample
    to a lower sampling rate (22,050 Hz), and add some reverb. Here''s how it''s done
    with SoX at the command line:


    ```

    sox -r 44100 -t wav testrec.wav -r 22050 -t aiff testrec.aiff reverb 1 3000 500

    ```


    The numbers after the reverb option are the values for the effect''s output gain
    (1 is equal in intensity to the original signal with no effects added), reverb
    time (3000 milliseconds), and delay time (500 milliseconds). If you want to learn
    more about SoX, type man so at the command prompt to display the SoX manual page,
    a portion of which is shown in Figure 3-4.


    # Other General Audio Tools


    **Basic tools** most distributions include various basic audio tools for the console
    and for X. The CD-ROM bundled with this book contains as much of the proficient
    software as space and legality allow. To view the full range of Linux audio and
    MIDI tools over the Internet, the Linux Music & Sound Applications (http://sound.condow.net)
    site. DLP''s Choice (http://sound.condow.net/dp_choice.html) is a helpful page
    of recommended selections from the larger listing.


    Other useful tools include file compression utilities, such as Split2000 (https://heroine.linuxave.net),
    dedicated processors such as the soft-delay unit unit Tapir (www.iua.upf/~mdeboer/tapir),
    and dozens of audio development kits (sound.condow.net/tools.html).


    **GUIs** Interfaces built with Gtk, Motif/LessTiff, Qt, and other graphics toolkits
    give a nice appearance and ease of use in X sessions. Figure 3-5 shows a collection
    of audio utilities running under X.


    Interface builders for the Linux console include the popular ncurses library and
    the SVGalib graphics toolkit. Both are included in all mainstream Linux distributions.


    # Troubleshooting


    If your sounds still aren''t sounding, you''re sure your soundcard and driver
    are properly installed, and Linux is properly configured on your machine (see
    Chapter 2), you''ll need to double-check and troubleshoot everything described
    in the Troubleshooting section in Chapter 2. If you''re having recording problems,
    check to make sure you''ve:'
