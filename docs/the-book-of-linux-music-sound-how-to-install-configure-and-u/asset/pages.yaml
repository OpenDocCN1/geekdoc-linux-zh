- pgno: 246
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_246_0.png)


    NOTE The grayscale images in this book may not clearly show various connections
    and high-lighting, by HPKComposer makes good use of color throughout the program.


    Your instrument is now complete and ready for processing by HPKComposer. You now
    need to create a score for your instrument to play.


    # Creating the Score


    You may have noticed that all of the edit buttons seen in the Synoptic view are
    now placed at the top of the display. Press one of the Edit Structure buttons
    (at the right of the 16 VRML buttons) to begin defining your score.


    HPKComposer has integrated Andre Barttezki''s CMask algorithmic generators into
    its design, along with extensions created by the HPKComposer team. CMask is a
    set of algorithms that create tendency masks. By using a tendency mask, the user
    can control or constrain a set of random numbers, forcing the selection of a number
    into the area described by the mask. Various masking algorithms are available,
    including probability constraints, fractal distribution, and random pattern generation.
    Many of those algorithms have a further set of adjustable parameters. For example,
    the List algorithm includes a subset of methods for choosing values from the list,
    such as cycle or random.


    Figure 9-40 shows the Structure 1 screen with the Range algorithm employed.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_247_0.png)


    Let''s take a closer look at this screen. The parameter shown is Event Pitch,
    and the algorithm is set to produce pitches between 36 and 96 (MIDI note numbering).
    Pressing the Refresh button will graph the output of the masked random distribution
    (which can be represented as points or lines). Press Refresh again to create and
    view a new distribution.


    Mask graphs can be created for event density, duration, pitch, amplitude, polyphony,
    and MIDI controller. Tendency masks are a very powerful way to create compositional
    order out of random output from the CMask generators.


    Up to eight Structures can be used to define your score, each with its own algorithmic
    generation parameters, using any one of the eight Instruments. When you are satisfied
    with your Structure, Instrument, and Effects settings, you are ready to generate
    the Csound/sco files.


    Press the Generate Files & Sound button (in the top row of buttons, the fifth
    from the left). If you checked the Text Output box in your Output settings, you
    should see a screen like the one in Figure 9-41.


    # Compile and Play Your Composition


    Unless specified otherwise in your Output settings, the Csound compiler will open
    the function table display. When the compile is completed, click on the table
    display and that box will disappear. All that remains is for you press the Play
    Generated Soundfile button (immediately to the right of the Generate Files & Sound
    button) to hear your new HPKComposer composition.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_248_0.png)


    Figure 9-41: Csound generation


    # HPKComposer and VRML


    VRML stands for Virtual Reality Modeling Language. According to the comp.lang.vrml
    newsgroup FAQ (Frequently Asked Questions) sheet, it is “... a scene description
    language that describes the geometry and behavior of a 3D scene or ‘world.’ HPKComposer
    can generate worlds in the VRML wrl file format; unfortunately, it is beyond the
    scope of this profile to describe the VRML aspects of HPKComposer in more detail.
    Interested readers should access the FreeWRL Web page at www.crc.ca/FreeWRL for
    more information regarding a free VRML97 viewer for Linux.


    # Summary


    Like the other large applications reviewed in this book, HPKComposer offers a
    multitude of sophisticated features, and it is impossible to fully describe them
    all here. If you made it through our tutorial example, you can start to dig more
    deeply into the program’s features on you. Much fascination awaits you: The GUI
    synthesizer, the MIDI connections, and VRML scene creation are some of the areas
    for you to explore. If you have the programming skills, you can extend HPKComposer’s
    capabilities by writing new java classes and adding them to the modules database.
    The program is consistently maintained, with very good documentation and examples
    for study, and the authors are quick to respond to suggestions and criticisms.
    I have used HPKComposer since its first appearance: In my humble opinion, it is
    definitely a “Most Recommended” Linux sound and music application.'
  merge: -1
  img_proc: true
- pgno: 249
  md: "# Other Helpers\n\nCeres, a soundfile editor (see Chapter 4), is a powerful\
    \ Csound helper. After directly editing the frequency components of a sound, Ceres\
    \ can render its output as a Csound score.\n\nFor links to other Csound support\
    \ software, the interested reader should look on the Linux Sounds page, in the\
    \ section listing Csound helpers (www.bright.net/~dlphil/linuxsound/cshelp.html).\
    \ The latest edition of the Linux Soundapps page is included on the CD with this\
    \ book.\n\n# Cmix Classic\n\n+   Author: Paul Lansky\nVersion profiled: cmix-linux-3-31-97.tar.gz\n\
    Web site: http://silvertone.princeton.edu/winham/PSK\nFTP site: http://ftp.princeton.edu/pub/music/cmix.linux.tar.gz\n\
    Maintained: No\nAvailability: Free, open-source\nLicense: Copyright held by author\n\
    Capsule summary: Non-realtime sound synthesis language with very C-like syntax\n\
    \nCmix is another venerable software sound synthesis language. Originally designed\
    \ to create and manipulate soundfiles, Cmix, like Csound, developed far beyond\
    \ its designers' original intentions.\n\nThe canonical Cmix package is available\
    \ from the principal Web site at Princeton University (see above). Building and\
    \ installing Cmix is straightforward (simply unpack the Cmix source package with\
    \ tar xzvf cmix-latest.tar gz run make), though it's possible you'll have to search\
    \ for a few arcane headers and libraries. Once the system is installed, it's ready\
    \ for use.\n\nCmix isn't a language so much as a library of C functions optimized\
    \ for sound processing. The Cmix score (the control file data) is directed to\
    \ a command parser called MINC (Minc Is Not C), where the appropriate functions\
    \ are called as needed, receive their parameter values, and are finally linked\
    \ to soundfile objects to create Cmix performances and write them to disk.\n\n\
    # Getting into Cmix\n\nCmix's command parser presents itself in a very C-like\
    \ manner and includes familiar control flow structures such as the loop and if/else\
    \ conditional statements. A typical Cmix score looks like this:\n\n```\n/*my_first.sco*/\n\
    /* Cmix example score */\n/* note the example of C-style commenting */\n/*\n \
    \ * fmint -- simple fm instrument\n  * p0 = start time\n```"
  merge: -1
  img_proc: true
- pgno: 250
  md: "p1 = duration\n* p2 = pitch of carrier (Hz or oct.pc)\n* p3 = pitch of modulator\
    \ (Hz or oct.pc)\n* p4 = FM index (low)\n* p5 = FM index (high)\n* p6 = amp\n\
    * p7 = stereo spread (0-1) <optional>\n\n+   * function 1 is oscillator waveform\n\
    * slot 3 is index guide\n\n```\n/*\noutput(\"foo.snd\") /* the output soundfile\
    \ exist beforehand /* /\nmakegen(1, 10, 1024, 1) /* the output waveform, a simple\
    \ sine /*\nmakegen(2, 7, 1024, 0, 512, 1, 512, 0) /* the amplitude envelope /*\n\
    makegen(3, 24, 1000, 0.1, 2,0) /* index guide envelope; not arbitrary table length\
    \ /* /\nfms = 1 / a * counter */\n/* repeat the following code body 15 times /*\n\
