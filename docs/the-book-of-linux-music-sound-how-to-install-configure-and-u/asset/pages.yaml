    with events added for bass guitar, bass drum, snare, hi-hat, cymbal, and guitar.
    Trackers are especially well suited to beat-oriented music, such as techno and
    other dance music, but because any sort of sample can be used by the software,
    it is not limited to any particular style.


    # Stringing Patterns Together into a Song


    After creating patterns, you string them together to create a completed song.
    This procedure is also easy: In the upper left corner, the set length desired
    (the Insert/Delete buttons can also dynamically control song length), use the
    **Current Position** box to indicate song measure location, and use the **Pattern**
    box to select which pattern will play at that location. In the example shown in
    Figure 5-3, the song length is set to 46 patterns. The display can show only one
    pattern at a time, but scrolling the **Current Position** box would reveal that
    patterns 0 through 3 are taken by pattern 2, positions 4 through 6 are occupied
    by pattern 1, position 7 belongs to pattern 11, and so forth. When completed,
    files can be saved in the common MOD or XM formats.


    # Additional SoundTracker Features


    # Sample Editor


    Figure 5-4 shows the bass..wav file loaded in the Sample Editor. SoundTracker''s
    editor is not intended to be a full-fledged soundfile editing environment, but
    it does provide basic cut/copy/paste operations along with the more significant
    loop mode setting and initial volume, and fine-tune controls. It also has the
    option to load 8-bit soundfiles.'
