- pgno: 84
  md: '# Recording and Playback


    Snd records and plays soundfiles in a variety of formats, including unusual types
    such as NIST/SPHERE and AFSp. It can even read formats from popular samplers and
    hybrid synthesizers (such as the Kurzweil K2000, Yamaha SY85 and SY99, and Yamaha
    TX16W) from other soundfile editing and processing applications (as Sound Tools,
    Sound Designer I and II, Sonic Foundry''s Forge, and Turtle Beach''s Wave).


    Playback in Snd is straightforward: Simply click on the Play button, and the file
    will begin playing (hold the CTRL key down when you click Play, and you''ll see
    a tracking cursor move through the file sounds). If you have opened Snd''s performance
    controls (see Figure 4-23) you can also reverberate and make adjustments to the
    sound''s amplitude and pitch in real time. Click on the Play button again to stop
    playback.


    Selecting the Record function from the File menu opens Snd''s recording console
    (Figure 4-23), which provides a mixer (or mixers in the case of multiple soundcards)
    and input/output level meters. You can specify the recorded file''s name, sampling
    rate, data format, number of channels, buffer size, and I/O options; if the file
    format permits, an entry box is provided so you can add them to the soundfile
    header. As Figure 4-23 indicates, Snd can determine how many cards are present
    in the system and configure itself to reflect the available controls for those
    cards. As seen in the figure, my cards have different mixers, capabilities, which
    Snd accurately displays (the upper meters and mixer represent the PCI128, and
    the second row applies to the AWE64).


    ![](img/43a9671cef617c9c7a18f7a6904433f1_84_0.png)


    Figure 4-23: Snd''s recording console'
  merge: -1
  img_proc: true
- pgno: 85
  md: "# Advanced Uses of Snd\n\nThe Listener window Snd's interface to the powerful\
    \ synthesis and signal processing options of Common LISP Music, and full customization\
    \ of the Snd GUI. However, I must remind the reader that what follows requires\
    \ a healthy measure of the hacker spirit. If you already program in another language,\
    \ you should have no undue difficulties with this material. If you're new and\
    \ willing, just follow the instructions closely, think about what you're doing,\
    \ and try again if things fail. Don't be shy about asking questions on newsgroups\
    \ and de mail lists!\n\nThe Listener creates or transforms by interpreting commands\
    \ and routines within Guile, a LISP-like programming language. Files with the\
    \ scm extension are packages of Guile code. These packages can be loaded from\
    \ the command line, the HOME/, resource file, or dynamically in the Listener.\
    \ Study exam.scm, mix.scm, and snd-test.scm (all in HOME/snd-3) for examples.\n\
    \nTo use the Listener, Snd must be compiled with Guile. If Guile is not included\
    \ with your distribution, see the Guile Web site at www.gnu.ai.mit/software/guile/guile.html\
    \ for information about downloading and loading the latest version.\n\nLessTif\
    \ is a fine free replacement for the Motif GUI toolkit, but the Listener will\
    \ not work with the default LessTif installation. In LESSTIF_SRC/lib/Text/In.c,\
    \ comment out the block starting at line 826 (LessTif version 0.89):\n\n```\n\
    #if o /* add this */\nif (Text_EditMode(tw) != Xm_LINE_EDIT)\n{\n    return;\n\
    }\n#endif /* and add this */\n```\n\nRecompile and reinstall LessTif, then compile\
    \ Snd. The Listener will work, but you will need to click the mouse in the window\
    \ after each time you press the ENTER key.\n\nFrom the Snd home directory, run\
    \ snd -1 exp.scm to load an example of signal processing routines and functions.\
    \ When Snd starts, load a soundfile and open the Listener from the View menu.\
    \ Snd should now appear as shown in Figure 4-24.\n\nNow you can experiment with\
    \ the Guile/Scheme examples you loaded when invoked Snd. For a quick demonstration,\
    \ enter this line at the Listener prompt:\n\n```\n(jc-reverb 2.0 #f .1 #f)\n```\n\
    \n62 Chapter 4"
  merge: -1
  img_proc: true
