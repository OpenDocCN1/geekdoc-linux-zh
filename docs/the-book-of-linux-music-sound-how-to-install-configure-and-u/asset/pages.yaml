  md: '# Making More Complex Structure


    To make a more interesting structure, you could add a sequencer with these steps:


    +   1. Open a Synth_SEQUENCE module from Modules • Synthesis • Midi+Sequencing
    and place it above the Synth_FREQUENCY module.


    +   2. Connect their freq ports, then set the sequence speed by double-clicking
    the spe (speed) port and entering some value into the constant field. The documentation
    suggests starting with a value of 0.13; 0.26 will slow it by the half, 0.065 will
    run the sequence twice as fast.


    +   3. Double-click the seq (sequence) port and enter your sequence as a constant.
    Use the format "pitch-class/octave," with a semicolon as a separator. Note duration
    is determined by the clock-tick divided by the number of notes you specify within
    the sequence. In Figure 10-7, the first note is a C in the fourth octave (following
    the layout of octaves on a piano keyboard), followed by a B in the third octave,
    a D in the fourth, and a G in the third. Thus, these four notes will be played
    between successive clock-ticks (with the clock-tick spe value set to 0.15).


    ![](img/43a9671cef617c9c7a18f7a6904433f1_270_0.png)


    Figure 10-7: Adding a sequencer


    > NOTE Arts may crash if you don''t give the Synth_SEQUENCE module a note sequence
    and a speed.'
