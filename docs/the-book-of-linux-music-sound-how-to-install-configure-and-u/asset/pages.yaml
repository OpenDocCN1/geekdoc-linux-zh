  md: '# Silence


    FTP server: n/a

    Maintained: Yes

    Availability: Free for non-profit use, open-source

    License: GPL


    Capsule summary: Rich environment for exploring music composition using algorithms
    and mathematics. Render audio via Csound; can also output standard MIDI file


    On the Silence Web page, Michael Gogins describes his program as


    ... an extensible system for making music on computers by means of software alone.
    It is an instrument for music that could not be performed, composed, or even imagined
    without computers. It is specifically designed to support algorithmic composition
    using software synthesis.


