    \ selection of modules for generating and processing sound.\n\n# History\n\nCsound\
    \ evolved out of MIT Professor Barry Vercoe's original 1973 MUSIC11 program when,\
    \ in 1986, it was ported from PDP-11 assembler to UNIX C. MUSIC11 was derived\
    \ from the pioneering MusicV program, written in 1966 by Max Mathews. Perhaps\
    \ the most revered founder of computer music technology. One of MusicV's major\
    \ innovations was the implementation of the unit generator, a “black box” concept\
    \ that allowed great extensibility (the ability to add and expand a program or\
    \ language) to the language. Since its inception, Csound has continuously evolved,\
    \ accommodating new synthesis methods, composition utilities, and digital signal\
    \ processing (DSP) algorithms."
  merge: -1
  img_proc: true
- pgno: 200
  md: '# # Getting It, Building It


    # ## Two Distinct Packages


    Csound is available for Linux in at least two distinct packages. John Fitch maintains
    the primary repository for Csound''s source code at Bath in England and provides
    a Linux package built from those sources. Nicola Bernardini, from the Linuxsound
    Development group, maintains a version of Csound that was also built from the
    canonical sources at AIMI (Associazione di Musica Italiana). The AIMI version,
    which is available in various Linux distribution formats (such as Red Hat''s RPM
    and Debian''s DEB), is completely compatible with existing orc/scode files and
    includes all opcodes found in the Bath sources.


    Here is a summary of features available only in the AIMI version:


    +   - Enhanced makefile system, with autoconf and configure support for specific
    build

    - Support for Jaroslav Kyselý''s ALSA sound drivers

    - Support for 64-bit Alpha systems

    - Enhanced OSS/Linux realtime audio support

    - Shared library (libcsound.so) for greatly reduced memory footprint

    - Robin Whittle''s random number generator

    - A high-priority scheduler for improving realtime I/O on slower or heavily loaded
    systems


    # ## Two Distinct Build Procedures


    The AIMI and Bath versions differ somewhat in the way in which Csound is compiled,
    or from its source code.


    The Bath package includes a top-level makefile, which you edit for such items
    as audio and X support. After editing the makefile, run the make command to build
    the binary. After the binary is built, you can place it anywhere available to
    the system''s PATH environment variable (/usr/local/bin is a good choice). You
    will also need to place the csound. text file (the source for all text messages
    produced by Csound) in /usr/local/lib.


    The development group version (also known as the "unofficial") version) utilizes
    the configure utility and a greatly expanded set of makefiles and make procedures.
    This version is built by running ./configure with any necessary flags (for instance,
    or without X, realtime audio, ALSA), then make depend, make, and finally (as root)
    make install. A typical installation will place the shared library, the binary,
    and the include files in /usr/local/ hierarchy.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Whichever version you choose, once the binary is in the system PATH, Csound
    is ready for operation.


    > > NOTE The Csound examples presented in this chapter have been compiled under
    various releases of the development version but, because that version tries to
    stay in step with the canoni-cal version, you should have no problem compiling
    the examples under either version.


    # # Creating a Soundfile in Csound


    Csound requires two source files (text files created in any text editor or word
    processor). The first, called an or (orchestra) file, designs a Csound instrument,
    which might be anything from an FM oscillator (fossil) to a sample playback engine
    (oscil or sound). You write your or and sc files as common text files in an editor
    such as vi or emacs. You can define your instrument''s parameters solely within
    the or file, or you can specify that it receives from the second source file,
    the sc file. Along with instrument, a (short for score) file also specifies event
    start times, duration, and any required stored-function tables (that is, pre-calculated
    functions such as waveforms and envelope curves).


    # # Defining an Instrument


    We begin by defining an instrument (a simple oscillator) by creating it in a text
    editor and saving it as my.orc. The semicolon is the comment delineator in Csound,
    and the comments need not be entered into your score; however, commenting your
    code is always good programming practice.


    ```

    sr=22050      ; sets sampling rate

    kr=441      ; sets control rate for k-rate components (as opposed to a-rate or
    audio signals)

    ksmps=50 ; sr/kr, number of samples per control period

    nchnls=1 ; monaural output

    instri

    kamp = 10000 ; raw amplitude

    kfreq = 440 ; the musical pitch ''A'' at 440 cps

    ifn = 1 ; stored function table 1

    asig oscil kamp, kfreq, ifn ; an audio signal is created by an oscillator playing
    a

    stored sinewave at kamp and kfreq

    out asig ; the audio signal is sent out

    endin ; end instrument

    ```


    Each line of a Csound instrument follows the same general design: output – generator
    or modifier – parameter list. The line


    ```

    asig oscil kamp, kfreq, ifn

    ```'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'from the my.orc file is a perfect example: asig a symbol for an audio signal
    that we wish to create by use of the osc (simple oscillator) generator, which
    is defined by the amplitude, frequency, and waveform indicated by the kamp, kfreq,
    and ifn values.


    # Defining the Score


    Following is an example of a score file, which we will call my.sco. When your
    orc and sco files are compiled with the csound command, the score will be played
    by the instrument defined in the my.orc file above.


    ```

    f1 0 8192 10 1 ; function table #1 (supplied by user), a stored sine wave

    ii 0 3 ; instrument 1 plays for 3 seconds, start-time at 0

    e ; end score

    ```


    The function table designation is constructed in this manner:


    +   **F1** Indicates that it is the first numbered table (ifn in my.orc).

    **0** Tells the Csound compiler that it is ready for use at time point 0 (that
    is, right away).

    **8192** The number of points in the table—and therefore the resolution of the
    stored function (higher numbers mean smoother functions).

    **10** The GEN function used to fill the table, in this case GEN10, a function
    for storing waveforms made of summed sine waves.

    **1** Indicates that the first partial (a frequency component) is the only one
    present and it is at full strength (measured from 0 to 1).


    # Compiling the orc and sco Files


    As already mentioned, the finished orc and sco files are compiled with the csound
    command. The command line


    ```

    csound -o my.wav -W my.orc my.sco

    ```


    compiles my.orc and my.sco to a WAV format soundfile called my.wav. The -o flag
    defines the output file or device, and the -W flag defines the output as a WAV
    format file.


    If run in an X session, Csound will pop up a small window with a graphic display
    of the function tables in the sco file. Click anywhere within that window to allow
    compilation to begin, and a series of messages will appear in the starting xterm.


    And that''s all there is to it. You can edit the new soundfile with MiXViews,
    DAP, Snd, or any other Linux soundfile editor (see Chapter 4).'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# The Csound csd Unified File Format


    Csound also supports the csd file format. A csd file unifies the orc and sco files
    into one file along with the desired command options. Open your favorite text
    editor and create a new file named my.csd. Enter the following text:


    ```

    <CsoundSynthesizer>


    <CsOptions>

    -o my.wav -Wdm6

    </CsOptions>


    <CsInstruments>

    instr 1

    kamp = 10000

    kfreq = 440

    ifn = 1

    asig = kamp, kfreq, ifn

    out asig

    endin

    </CsInstruments>


    <CsScore>

    f1 0 8192 10 1

    i1 0 3

    e

    </CsScore>


    </CsoundSynthesizer>

    ```


    A csd file begins and ends with the CsoundSynthesizer tag pair and contains the
    CsOptions, CsInstruments, and CsScore tags. Instruments and scores are composed
    exactly as they are in standard orc and sco files (the file above uses the orc
    and sco files defined in the previous section), and the command options are the
    same as if entered on the command-line.

    Save your new my.csd file. Compile it with csound my.csd and that''s all there
    is to it. Now play the results. . . .


    # Playback


    You can play the resulting soundfile with any WAV player. If you wish to send
    the sound output directly to the soundcard DAC, use the following command line:


    ```

    csound -o devaudio -W -dm6 my.orc my.sco

    ```'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'where -o devaudio sends output to audio device in realtime, -W creates WAV

    format (uses /dev/dsp for audio device), -dm6 turns down messaging for

    Better realtime response.


    # Simultaneous Input and Output


    With a full-duplex soundcard, you can have simultaneous audio input and out-

    put, realtime signal processing. If you''re using the ALSA driver,

    command line looks like this:


    ```

    csound -i ADC DAC inout.orc.sco

    ```


    where -i ADC is input to soundcard analog-to-digital converters and -o DAC is

    the output to soundcard digital-to-analog converters.

    If you''re using the OSS/Linux driver, a command line for simultaneous

    audio input and output looks like this:


    ```

    csound -i devaudio -o /dev/dspw inout.orc.sco

    ```


    > Fred Floberg''s high-priority scheduler, available only in the "unofficial"
    version of

    Linux Csound, is invoked with either -sched or -sked. Both places Csound''s

    realtime output first in the timing queue, which will help keep playback of inter-

    fence from the system as it performs its own tasks, such as checking disk integrity
    or

    poling for network connectivity.


    # Shortening the Command Line


    To make the command line shorter, you can group the various commands

    and use wildcards (asterisks) for file extensions. Thus,


    ```

    csound -Wdm6 -o devaudio myfoo.*

    ```


    is functionally the same as


    ```

    csound -o devaudio -W -o dm6 myfoo.orc myfoo.sco

    ```


    > In the above example, a wildcard ending will work only if there are no other
    filenames

    beginning with "myfoo" in the working directory, including files such as myfoo.bak

    or myfoo.wav. Also, options that require parameters cannot be grouped (or must
    be

    last member of a group, such as m6 in the example above).'
  merge: -1
  img_proc: true
- pgno: 205
  md: "# Realtime MIDI Input\n\nNow, assuming you have a MIDI interface properly installed\
    \ (see Chapter 2), you can play your first instrument (my.orc) by adding a dummy\
    \ table to the score file (the dummy table keeps the instrument active yet does\
    \ not supply it with any parameters), as follows:\n\n```\nf1 0 8192 10 1\nfo 10000\
    \ ; dummy table, keeps the instrument active for 10000 secs\ne\n```\n\nand compiling\
    \ your orc/sco files with\n\n```\ncsound -o devaudio -W -dm6 -M/dev/midi my.orc\
    \ my.sco\n```\n\nwhere -M/dev/midi tells Csound to look for its note information\
    \ from the MIDI input instead of a Csound score.\nAnother way of triggering my.orc\
    \ is to use a MIDI file. The orc/sco has been used in the last example, but the\
    \ command line changes to\n\n```\ncsound -o devaudio -W -dm6 -F my.mid my.orc\
    \ my.sco\n```\n\nwhere -F my.mid tells Csound to expect input from the MIDI file\
    \ my.mid.\nTo make your sounds more interesting, you can map MIDI values into\
    \ the orc file and arbitrarily utilize that data. In the following example the\
    \ value for inum is derived from the incoming MIDI note number (using the notnum\
    \ opcode). That value is used to determine which of two function tables will be\
    \ assigned to the ifn parameter for the osc opcode (the determination is made\
    \ in the lines beginning with if inum).\n\n```\ninstr 1\ninum notnum ; note number\n\
    kfreq cpsmidid ; MIDI to frequency\nniamp ampmidi inum*100 ; MIDI to amplitude\
    \ (scaled within range)\nif inum > 60 goto fun1 ; if the value is greater than\
    \ 60 go to the\n; line labeled \"fun1:\" and proceed from there\n\nif inum < 61\
    \ goto fun2 ; as above, but go to \"fun2:\" if inum is less than 61\n```\n\n```\n\
    fun1:\n    ifn = 1\n    goto contin\n\nfun2:\n    ifn = 2\n    goto contin\nasig\
    \ osc\n    iamp, kfreq, ifn\nout\n    asig endin\n```"
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Our score file is the same as before, but we have added function table:


    ```

    f1 0 8192 10 1      ; sine wave

    f2 0 8192 10 1 .9 .8 .7 .6 .5 .4 .3 .2 .1 ; ramp wave

    f0 10000

    e

    ```


    These files can be compiled for control by either a MIDI input device or a MIDI
    file. They demonstrate that simple Csound components can be easily built into
    elaborate sounds and control structures: I have here used the simplest instrument,
    but already is quickly evolving into greater complexity.


    # Realtime MIDI Output


    Now''s let Csound create a realtime MIDI output stream. The next example, using
    Gabriel Maldondo''s MIDI output opcodes, demonstrates a more complex control system
    than what we''ve seen for.


    # The moscil Opcode


    The moscil (MIDI oscillator) opcode—by controlling MIDI channel, note-number,
    velocity, duration, and time between notes—can be used to create an "indeterminacy"
    aspect in composition, producing notes and other MIDI messages using Csound''s
    randomization routines. In the following instrument, knum and kvel control the
    output of MIDI notes and their velocities over p3 (note-stream duration as specified
    in the file). The k random output is used for kdur (actual duration) and kpause
    (pause between notes).


    ```

    ;;; MIDI out

    ;; Name: mussle.org

    instr 1

    kchan = 0

    knum linseg 40,p3/7,60,p3/7,46,p3/7,54,p3/7,24,p3/7,58,p3/7,48,p3/7,80

    kvel linseg 20,p2,39,p2/33

    kran pcauchy 23 ; calls a particular randomizing function known as a Cauchy distribution

    kdur = int(kran)+46

    kpause = frac(kran)

    kchan, knum, kvel, kdur, kpause

    moscil

    edin

    ```


    knum and kvel are the results (and control or k-rate signals), linseg is an opcode
    that creates an envelope (a modifying function), and P3 is the event duration
    passed to the or from the sc file. P3/7 indicates that each segment of the envelope
    is equal in length to the event duration divided by seven. The numbers between
    each p3/7 are MIDI note numbers.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'So in the above example, the knum statement creates an envelope function whose
    segments provide a linear movement between the indicated MIDI note numbers at
    the rate of p3/7.


    # Controlling Change Messages


    The next two instruments control MIDI Program Change messages (see Chapter 6 for
    more details about MIDI) sent to my external synthesizer and my MIDI-controlled
    mixer.


    ```

    instr 11

    kchan = 0

    kprog = 2.

    kmin = 1.

    kmax = 128.


    outoutpc kchan, kprog, kmin, kmax

    endin


    instr 100

    kchan = 8

    kprog = 6.

    kmin = 1.

    kmax = 128.

    \outpc kchan, kprog, kmin, kmax

    endin

    ```


    Here is the sc file for this instrument:


    ```

    ;;; MIDI OUT opcodes

    ;;; mussle.sco


    t 0 60 ; tempo indicator

    i1 1.0 1.0 ; the different p3 durations will stretch out

    ni1 2.0 7.0

    i1 9.0 18.0 ii1 18.0 17.0 ; the play of the notes indicated by knum

    iii1 0.0 1 ii100 0 1

    e

    ```


    The command line for compiling these files is


    ```

    csound -Q0 -n -dm6 mussle.orc mussle.sco

    ```


    where -Q0 selects the first MIDI device and -n suppresses write to disk (for performance
    enhancement).'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'Given a fast CPU and hard disk, you can combine the various realtime I/O options.
    I have tested simultaneous realtime audio with MIDI output codes: It works, but
    with a noticeable performance slowdown on Pentium 166.


    # Csound Helpers


    Csound is especially rich in helper applications, some of which are included in
    the canonical source tree. The source package includes Cscore (a C library for
    the creation and manipulation of Csound sources), sndinfo, which displays information
    about a selected soundfile, and a collection of powerful analysis utilities for
    providing data to the Csound synthesis opcodes.


    Csound has many other powerful and useful tools in addition to those that come
    with the source package. Analysis data editors, score processing environments,
    and drum machines are all freely available. Cecilia, HPKComposer, and Silence
    are three large-scale Csound helpers; Midi2CS and hydraj are excellent examples
    of smaller sized assistants. We''ll discuss the latter programs first.


    # Midi2CS


    Author: Ruedier Borrman

    Version profiled: 0.95 / 2

    Web site: http://~snafu.de/~rubo/midi2cs

    FTP site: n/a

    Maintained: Yes


    Availability: Free, binary-only

    License: Copyright held by author

    Capsule summary: Handy utility to convert your favorite MIDI files to Csound


    Ruedier Borrman''s Midi2CS converts standard MIDI files to WAV files using Csound
    as its rendering engine. Midi2CS can use either user-selected samples (in AIFF
    or WAV format) or user-defined Csound instruments. With this feature, Midi2CS
    can orchestrate MIDfiles in ways commercially available MIDI sequencers cannot.
    Midi2CS comes with a unique looping feature that makes it ideal for creating techno
    and other dance-music mixes; however, the program can be used to create almost
    any type of music. If you''re interested, take a look at Ruedier''s excellent
    Midi2CS tutorial on the Web site (see above).


    Midi2CS is available for Linux in binary form only, so setting up the program
    is easy. Make a new Midi2CS directory in /home or /usr/local and download the
    latest package from the Web site listed above into the new directory. Midi2CS
    is packaged as a gzipped binary, so just run `gunzip midi2cs.gz` before you use
    it. You may need to set the permission on the file by running `chmod a+x midi2cs`
    before you use it. With the correct permission, Midi2CS is ready to rock.


    Software Sound Synthesis 185'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Rendering a MIDI file to a WAV is a three-step procedure. Run midi2cs without
    parameters to create a project file template midi2cs.pro You edit this project
    file to let midi2cs know what MIDI file to process, what names to give to the
    output or and sco files, and what soundfiles or Csound instruments will be used
    to render the MIDI file. Run midi2cs (without parameters) again to create your
    Csound or/sco files. Figure 9-1 shows the results of this second step:


    ![](img/43a9671cef617c9c7a18f7a6904433f1_209_0.png)


    Figure 9-1: MIDI2CS in the second stage


    For the final step run Csound to compile your new or and sco into a WAV format
    soundfile:


    ```

    csound -W -o ppanner.wav ppanner.orc ppanner.sco

    ```


    That example would compile the ppanner (Pink Panther) or and sco files listed
    in Figure 9-1. You can automate the final step by writing a script file (call
    it cs.scr) containing this one line:


    ```

    csound -W -o $1.wav $1.orc $1.sco

    ```


    Make the script executable with chmod +x cs.scr. Using the script file, you can
    now run the command


    ```

    ./cs.scr my_project_name

    ```


    and automate the rendering process. Thus, the Pink Panther example could be compiled
    with ./cs.scr ppanner.


    MIDI2CS is an excellent tool for converting MIDI files to soundfiles, combining
    the strengths of both the MIDI file format and the Csound synthesis engine. It
    is usable from the console or X, and it is highly recommended software.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# hydra


    Author: Malte Steiner

    Version profiled: 1.20

    Web site: http://members.aol.com/additiv/

    FTP site: n/a

    Maintained: Yes

    Availability: Freeware

    License: Copyright held by author

    CapsLock summary: Simple, useful graphic editor for Csound''s retro analysis data
    files


    The retro utility, of Csound''s analysis tools, supplies heterodyne filtering,
    a process that calculates the individual frequency and amplitude components of
    a sound and renders them to a data file (see the entries for "retro" and "adsyn"
    in the Csound manuals available from David Boothe''s Web site at http://lakewoosound.com/csound/).
    Typically, the Csound adsyn opcode is used to resynthesize the analysis data back
    into a soundfile. Hydra is a tool for editing retro data files.


    Malte Steiner first developed hydra as a command-line utility, and hydraj is the
    Java version of hydra. Hydra provides graphic editors for harmonic strength and
    amplitude/frequency envelopes. Editing analysis files is an intuitive process
    with hydra''s GUI.


    I recommend running hydra under the Blackdown group''s JDK 1.1.7 or 1.1.8. These
    packages are versions of Java for Linux and are available at www.blackdown.org.
    Versions of JDK 1.2 work with hydraj but disable the Spektrumilter display.


    To install hydraj, download the package from Malte''s Web site into your /home
    directory and unpack it with tar xzv hydraj-latest.tar.gz. To start the program,
    enter your new hydraj directory, and run hydraj. When the main window appears,
    select File -> Open to load the retro analysis data into hydra. Figure 9-2 shows
    hydraj opened to the main display of the analysis data''s frequency components
    and the Spektrumilter opened behind.


    Select Process -> Open Editor from the menu bar of the main display. The editor
    simultaneously displays the frequency and amplitude components of an analysis
    channel. In Figure 9-3 the flat line in the middle represents the channel frequency
    curve, while the more active line (toggled for editing) represents the channel
    amplitude curve.


    Save your edited data from the main display''s File menu. Data can be saved in
    the Csound analysis file .ads format or exported as a Csound file.

    With hydraj''s GUI you can graphically edit a retro analysis file with full control
    over each analyzed frequency and the envelope contours for both frequency and
    amplitude. What that sets it out is to do, and that''s all there is to it. It''s
    an excellent Csound utility.'
  merge: -1
  img_proc: true
