  md: '# Editing with WaveSlab


    WaveSlab is Slab''s soundfile editor. It provides basic services such as cut/copy/paste
    routines, as well as normalize (which raises peak volume to maximum with all other
    amplitudes raised proportionally), gain adjust (which raises or lowers volumes
    by a factor), and fade functions for volume control. To edit a soundfile, open
    WaveSlab with your recorded tracks by dragging your song CD icon and dropping
    it on the WaveSlab icon. WaveSlab will open with the display shown in Figure 8-8.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_180_0.png)


    Figure 8-8: WaveSlab


    Click on the Add icon (on the left) to select which tracks you want to add to
    the display. Choosing both of your recorded tracks will produce the display shown
    in Figure 8-9.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_180_1.png)


    Figure 8-9: WaveSlab with two tracks'
  merge: -1
