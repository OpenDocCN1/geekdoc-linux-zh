- pgno: 69
  md: 'After you enter or edit the parameter values with the faders (on the right
    side of the screen) and click Execute, another window opens running a process
    to display elapsed/remaining. A third post-processing window then opens automatically,
    and you can preview results of the added effects before "printing" them to the
    soundfile (though of course the ever-ready Undo can always restore the file to
    its pre-processed condition since the last Save).


    The post-processing window also controls the mix ratio of the affected (revised)
    signal to the "dry" (unchanged) original, and a master fader controls the overall
    level of the applied effect. Click the OK button in the post-processing window
    to write the effect to the soundfile, or select Cancel to close the processing
    session without saving the results.


    # The Zoom Window


    Figure 4-2 shows DAP opened to an Edit session. The display immediately centers
    and zooms in to the midpoint of the opened soundfile, where you use the cursor
    as a drawing tool to edit the waveform or create a new one. Because the Zoom window
    will focus down quite far, you can edit soundfiles in DAP at the single-sample
    level.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_69_0.png)


    Figure 4-2: DAP in an Edit session


    # Looping


    Because DAP works only on AIFF soundfiles (imported RAW and WAV files are converted
    before editing), it has excellent support for setting and editing loop points.
    Setting loop points is as easy as selecting a region then clicking on the Range
    button for the loop you want to create (either Sustain or Release). Loop mode
    can be set to Off, Forward, and Forward/Backward. On playback, the Release button
    in the Play window will cancel the loop and continue on in the file.'
