- pgno: 315
  md: 'To render the sample.mup Mup file to a Type 1 Standard MIDI file, the following
    command:


    ```

    mup -m sample.mid sample.mup

    ```


    You can then play it with playmidi, TiMidity, or any other Linux MIDI player or
    sequencer.


    # Closing Remarks


    Mup allows a degree on output customization not commonly encountered in notation
    programs dependent on graphic interfaces. For instance, a textual music specification
    language lets you pre-process and filter the specification data with other programs,
    something that is impossible to do with graphic interface programs. The language
    itself is very easy to learn, and with a little practice you can enter complex
    scoring indications quickly and accurately. Mup is powerful and flexible, and
    every detail of the score layout can be adjusted to suit your own needs. Using
    the middisp program to preview Mup''s output enables you to edit, view, and print
    your music in a very fast working cycle. Arkkra Enterprises has consistently maintained
    Mup since 1997, and it is in use at many prestigious schools and other organizations.
    At a cost of only $29 (US), Mup is a great bargain. Consider it another "Most
    Highly Recommended" music application for Linux.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# 12


    # NETWORK AUDIO SOFTWARE


    Network audio software provides audio services to a network of computers, such
    as an office or school LAN (large area network), a group of connected computers
    in your own home, or the Internet. Typical services include music broadcasting,
    network telephony, and the distribution of audio support throughout a network.


    In this chapter we''ll look at a player for the popular Real Audio format (RealPlayer
    G2), a streaming MP3 server (Icecast), an Internet telephone connection (Speak
    Freely), and a client/server network audio I/O service provider (NAS).


    # RealPlayer G2


    +   Authors: Real.com

    Version profiled: 7.0 alpha

    Web site: http://proforma.real.com/real/player/linuxplayer.html

    FTP site: n/a

    Maintained: Yes

    Availability: Binary-only

    License: Commercial, held by Real.com

    Capsule summary: The one and only Real Audio/Real Movie player for Linux'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'RealPlayer G2 is a variable bandwidth audio/video player for files in the RA
    (Real Audio) and RM (Real Movie). The RA soundfile format was the first popular
    Internet streaming audio protocol. Thanks to Real.com''s foresight in providing
    inexpensive encoders and players, todays of Web sites offer sound and video clips
    in the RA/RM formats.


    # Getting It, Building It


    Download the latest binary from http://proforma.real.com/real/player/linuxplayer.html.
    Be sure you read the installation instructions on that Web page: The Linux version
    is offered as alpha-stage software, and installation requirements are updated
    on the Web page. RealPlayer G2 is currently distributed in the standard .tar.gz
    format and as an RPM package.


    If you download the RPM package, create an empty holding directory (something
    like /usr/local/RealPlayer is good), download the package into it, and unpack
    the software with rpm -iv RealPlayer-latest.rpm. Unpacking the RPM file installs
    everything.


    If you download the .tar.gz package, create an empty holding directory (such as
    /usr/local/RealPlayer), download the package to directory, and unpack it with
    tar xzv RealPlayer-latest.tar.gz. From the RealPlayer directory run /install.sh
    to place the program files in their correct locations.


    # Using RealPlayer


    Before using RealPlayer G2 for the first time, to View • Preferences and set the
    Performance and Connection values for your system. RealPlayer''s playback quality
    depends upon the speed of your network connection: With a 14.4 modem, the sound
    will approximate that of an AM radio, at 28.8 kbps the sound is closer to an FM
    radio transmission, and higher-speed connections yield correspondingly higher-quality
    audio. Video playback is more severely affected: Connections under 56 kbps will
    suffer from frame loss and audio/video synchronization; higher-speed connections
    will greatly improve performance.


    After setting the Preferences, you can use RealPlayer G2 from an xtterm by simply
    entering realplay at the command prompt. However, because you''ll probably access
    RA files in real time over the Internet, you must configure your browser to use
    RealPlayer when you click a link to a Real Audio soundfile. If your Netscape Preferences
    configured in this manner:


    | Description: Real Audio |

    | MIME Type: audio/x-pn-realaudio |

    | Suffixes: ra,ram |

    | Application: /usr/bin/realplay % |'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'With the above settings, I can click on a RealAudio link and listen to the
    sound as it streams to my player. In Figure 12-1 RealPlayer is playing a Real-Audio-encoded
    Csound composition by Michael Coble, available at http://www.panix.com/~coble/Coble/music/


    ![](img/43a9671cef617c9c7a18f7a6904433f1_318_0.png)


    Figure 12-1: RealPlayer G2 playing a RealAudio file


    Figure 12-2 shows RealPlayer G2 playing a music video found on Real.com''s music
    page at http://realguide.real.com.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_318_1.png)


    Figure 12-2: Playing a music video with RealPlayer G2


    There''s really not much more to say about RealPlayer G2. It is a straight-forward
    application, easy to install and use. Real.com maintains excellent listings for
    RA sites on the Internet, so you should have no trouble finding hours of streaming
    media for your network audio pleasure.


    Network Audio Software 295'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'Authors: Jack Moffitt, Barath Raghavan, many others

    Version profiled: 1.3.0

    Web site: http://www.icecast.org

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: GPL

    Capsule summary: Streaming MP3 and live audio for network broadcasting


    Icecast is a streaming MP3 server that lets anyone with a sufficiently fast network
    connection broadcast near-CD quality audio (e.g., MP3s—see Chapter 7 for more
    information) live over the Internet. Starting Icecast invokes the server (icecast),
    starts the encoder (shout) that converts your MP3s into streaming audio, and streams
    them to the server. Icecast is incredibly cool (excuse the pun) and easy to set
    up and use. If there''s a radio disc jockey inside you, Icecast is your chance
    to become an instant broadcast celebrity over the Internet or your local area
    network. Icecast is wonderful Linux audio software that definitely deserves a
    Most Highly Recommended status.


    # Getting It, Building It


    Get Icecast from www.icecast.org or this book''s CD-ROM, place it into an empty
    directory, and unpack it with `tar xzvf icecast-latest.tar.gz`. Enter your newly
    created Icecast directory, read the installation instructions, and then run `./configure
    --help to see what configuration options are available. Icecast requires no special
    libraries and should compile without problems on any Linux system. Run `./configure`
    and make icecast to build Icecast. You will also want to build the shout encoder
    and liveice (live Icecast) binaries with make shout and make liveice in their
    respective subdirectories.


    # Using Icecast


    Setting up your network broadcasting station is simple with Icecast. Edit the
    icecast.conf file (in the Icecast home directory) to reflect items as your host
    location, server name, aliases, and so forth. This file is rather lengthy, and
    it is also very well documented. Study carefully to make sure your settings are
    right.


    # Testing Your Configuration


    After you''ve edited the configuration file, start the Icecast server by entering
    `./icecast` at the command prompt. To test your broadcast system on your home
    machine, open another xterm, enter the Icecast shout subdirectory, then run the
    following command sequence:'
  merge: -1
