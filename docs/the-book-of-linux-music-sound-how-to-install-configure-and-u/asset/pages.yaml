- pgno: 321
  md: 'If you have a static IP address, you can permanently add it into the icecast.
    If your address is dynamically assigned (as occurs with dial-up connections),
    you must explicitly declare it (as in the above line) whenever you start the shout
    program. A static IP address makes it easy for listeners to tune in at time; if
    you have a dynamic address, you must announce it via a Web page or IRC channel
    each time you broadcast. Don''t forget the port address (which is 8000)—users
    need to connect to the icecast server.


    # Live Broadcasting with Icecast


    You can also broadcast interactive Icecast sessions using the liveice program.
    But before you can broadcast live, you must configure liveice for your system
    by editing the liveice.cfg file (in the liveice subdirectory). You can edit that
    file using any text editor or with the handy Tcl/Tk utility in Figure 12-4.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_321_0.png)


    To broadcast live, start the icecast server as described in the previous section.
    Then enter the liveice subdirectory and run `./liveice`. Figure 12-5 shows a liveice
    broadcast over the network loop device. You can see the icecast server running
    in the lower right window, with the liveice interface running in the upper left
    window. XMMS has been launched with the loopback address (see middle left window),
    and a software mixer (smix) has been opened to control output and input volume.'
