- pgno: 338
  md: 'The choices are mostly self-explanatory, the defaults will usually be acceptable.
    Tooltips open over any non-obvious function or option (such as the XInput Device
    button), and the program''s README explains each option in detail. Close the panel
    when you are satisfied with your choices.


    # Creating a Scratch File and Adding Turntables


    Click on the Record button at the top of the display, and a dialog box will ask
    you to name your new scratch soundfile—this is the file that will save your scratches.
    Now click on the Add Turntable button to choose the tracks you want to mix and
    scratch. Select a soundfile in WAV, AU, or MP3 format for each turntable by clicking
