  md: '# KeyKit


    Author: Tim Thompson

    Version profiled: 6.5a

    Web site: http://209.233.20.72/keykit/index.html

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: Held by the author and AT&T

    Capsule summary: Environment for exploring algorithmic MIDI composition, with
    an excellent GUI and extensive features list


    KeyKit is a MIDI composition environment with abundant tools and features—its
    toolkit outstrips that of Jazz++. It includes a graphic user interface for X displays,
    a powerful MIDI process control language, and an incredible array of functions
    and routines for interactive composition. KeyKit can be used as a straightforward
    MIDI sequencer, recording your input from a MIDI device (keyboard, MIDI guitar,
    wind controller), but no MIDI input device is required. The program will also
    load, play, and manipulate Standard MIDI files. In examples we will see how it
    excels at the creation and permutation of MIDI data.


    # Getting It, Building It


    KeyKit is available only from the Web site listed above. KeyKit can be obtained
    as a pre-compiled binary or source code. If you retrieve the binary, you only
    place it in your system PATH and type keykit in a term window—the application
    will start up. Building KeyKit is also simple: Just unpack the source package
    with tar xvzf keykit-src-latest.tar.gz and follow the directions in the author''s
    installation documentation.


    > The Linux version of KeyKit currently supports only external MIDI (/dev/midi),
    so you must have an external synthesizer to use KeyKit. It will not access a soundcard''s-board
    synth.


    # Using KeyKit


    KeyKit has far too many interesting features to illustrate or even list here.
    The first will show how to load a MIDI file and play it, and the second will demonstrate
    how to record and manipulate MIDI data with one of KeyKit''s randomization tools.
    For a full list of the program''s features and how to use them, go to the KeyKit
    Web site and follow the links to the online documentation.


    When you first open KeyKit, you will see a blank display and the key> prompt in
    the KeyKit language command Interpreter window. Left-click the mouse anywhere
    outside the Interpreter to pop up a menu of KeyKit''s various tools and functions
    (Figure 6-23).'
