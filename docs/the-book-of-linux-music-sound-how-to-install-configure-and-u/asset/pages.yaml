  md: '# Going Farther


    BC2 contains an embarrassment of riches, and I have barely indicated its possibilities.
    With the practical uses demonstrated in this profile, you can start discovering
    those riches and possibilities. The documentation will reveal more of the program''s
    depth, and practice will perfect your use of BC2. Enjoy!


    # Ceres


    +   - Author: Oyvind Hammer

    - Version profiled: 0.13

    - Web site: http://www.notam.uio.no/notam/ceres-e.html

    - FTP site: ftp://mustec.bgsu.edu/pub/linux

    - Maintained: Yes

    - Availability: Free, open-source

    - License: Copyright held by author


    Capsule summary: Graphic spectral editing, very unusual processing options (Transforms)


    Ceres was originally written for SGI by Oyvind Hammer, of the Norwegian Network
    for Technology, Acoustics, and Music Research (NoTAM). In 1997, I ported Ceres
    to Linux with the help of Richard Kent''s libraries written for the DAP editor.
    Both the SGI and Linux versions of Ceres have the same functions and documentation,
    so Dr. Hammer''s invaluable instructions for the original Ceres, which clearly
    explain its various operations and functions, are a great help for the Linux version
    too..


    # Getting It, Building It


    The latest package is always available at ftp://mustec.bgsu.edu/pub/linux/ceres-tar.gz.
    Download it to your /home directory, unpack it with **tar xzvf Ceres-linux-latest.tar.gz**,
    and enter your new Ceres directory.


    Before building you must install Motif 1.2 or the equivalent LessTif libraries
    and headers. Motif is a commercial product available from many vendors (such as
    Red Hat and Metro Link). LessTif is a free replacement for Motif: it is usually
    bundled with Linux distributions, but you can always find the latest version at
    lesstif.org. Motif (or LessTif) will provide the GUI for Ceres.


    The Ceres package also requires and includes Richard Kent''s audio libraries.
    Enter the Ceres/tich directory and run **make**. When you build Ceres its makefile
    will access this directory for the needed files. Return to the Ceres home directory
    and run and then (as root, of course) **make install** to compile and install
    the program.


    # Using Ceres


    Enter **ceres** in an xterm window and the program will open to a single empty
    window. Select **File • Load & Analyze** to load an AIFF soundfile (Ceres will
    cur-'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'rently only load AIFF files. An FFT analysis will be automatically performed
    on the selected soundfile and rendered as a graphic display of the sound''s frequency
    content over its length (in seconds).


    # Editing Tools


    By default, edits and transforms apply to the entire soundfile, but you can make
    highly detailed alterations by using area selection, a control function, and the
    paintbrush.


    Area selection Clicking and dragging the right mouse button selects an area by
    drawing a box around the area to be affected by the transform. You can create
    a control function curve point-by-point.


    > **NOTE** Area selection works only on the Sieve, Frequency-shift, Mirror, Pitch-shift,
    Gain, and Convolve transforms.


    Control functions The Extract function, which derives the amplitude, pitch, and
    centroid (brightness) curves from the soundfile, offers another method of transforming
    a soundfile. If you select one of these curves from the Extract menu, that curve
    becomes the default control function.


    The paintbrush The paintbrush is a simple editing tool. If the paintbrush is turned
    on in the display settings, clicking and dragging the right mouse button will
    paint over an area. The painted area can then be removed, or the painting can
    be rejected to start again.


    Figure 4-43 shows Ceres'' centroid graph displayed and an edit area selected:


    ![](img/43a9671cef617c9c7a18f7a6904433f1_103_0.png)


    Figure 4-43: Centroid graph with selected area displayed in Ceres'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# What''s Special about Ceres?


    The editing capabilities of the NoTAM software, originally written for SGI computers
    but ported into Linux, offer something Linux editors don''t: perform edits on
    the graphic results of a Fast Fourier Transform (FFT) analysis of a soundfile.
    It is beyond the scope of this book to explain FFT (see Dr. Hammer''s Ceres documentation
    for a brief explanation), but the results of the transform are depicted in what
    is known as a "spectral representation," or a representation of a sound''s frequencies
    (as opposed to its amplitudes) against time. Through the graphic spectral representation,
    the NoTAM software lets you directly edit the frequency content of a sound wave.
    Before Ceres, Linux had no software with such capabilities.


    # Resynthesis


    After Ceres renders the FFT results of its analysis of a wave into a graphic display,
    you can subject those results to several interesting transformations. The Resynthesis
    window lets you control the final pitch and duration after you''ve run the transforms.
    Select File • Synth & Save to apply these transformations to the original sound
    wave—and you''ve created (resynthesized) a new sound.


    The example soundfile used in Figures 4-44 and 4-45 is a 6.82-second long, 44.1
    kHz, 16-bit monaural AIFF file of me saying "Hello, my name is David Phillips,
    and I pronounce Linux as Linux." Figure 4-44 shows the results of the default
    FFT analysis of hello.aif. The vertical scale measures the frequencies in kHz,
    and the horizontal scale measures the time of the file.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_104_0.png)


    Figure 4-44: Default FFT analysis of hello.aif'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Figure 4-45 illustrates an extensive warping of our original soundfile. I edited
    the soundfile with familiar transforms, such as pitch-shifting and gain adjustment,
    as well as more exotic alterations, such as spreading and blurring effects. Resynthesizing
    performed the final transformation (an extended file length and slightly lowered
    pitch).


    ![](img/43a9671cef617c9c7a18f7a6904433f1_105_0.png)


    Figure 4-45: FFT analysis of the processed hello.aif file


    # LPC in Ceres


    # Using LPC in Ceres


    Let''s create our own talking orchestra. Go to Settings • Analysis and set a relatively
    low number of poles (20 should be good). Select File • Load & Analyze for your
    orchestra sound using both FFT and LPC loads (in other words, you will load and
    analyze the same file twice). Figure 4-46 shows our original sound in the default
    FFT spectral display. The LPC results are not displayed.)


    From the LPC menu, run the inverse filter to flatten the spectrum. The display
    will change to something like the screenshot in Figure 4-47.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_106_0.png)


    Figure 4-46: FFT display before LPC resynthesis


    ![](img/43a9671cef617c9c7a18f7a6904433f1_106_1.png)


    Figure 4-47: FFT display with "flattened" spectrum


    Now run a new LPC analysis on your filter sound (for this example we want a speaking
    voice) using a higher number of poles (60 is recommended). Select **Filter Current
    Spectrum** from the LPC menu and increase the gain (in the **Transform** menu)
    if needed. Run **Synth & Save** from the **File** menu, then use **File • Play**
    to audition your new sound as shown in Figure 4-48. Voila—the orchestra speaks!'
  merge: -1
