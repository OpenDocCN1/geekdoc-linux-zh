    two sockets will appear in the cabinet.

    4. Select Output from the modules list, open the StereoOutput module, and a second
    panel will appear in the cabinet.

    5. Move the mouse cursor over one of the Input sockets, press the left button,
    and drag the connection to one of the Output sockets. Release the button when
    you get there. Do the same for the other pair of Input/Output sockets. Figure
    10-17 illustrates these connections.


