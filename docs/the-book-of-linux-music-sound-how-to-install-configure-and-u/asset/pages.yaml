  md: '# # THE LINUX PROBLEM SOLVER


    by BRIAN WARD


    +   - Hands-on, practical guides solves kernel issues

    - Helps solve hundreds of problems


    A must-have for intermediate to advanced users who already have Linux up and running.
    Solves technical problems related to printing, networking, back-up, crash recovery,
    and compiling or upgrading a kernel. Quick and concise in approach, with over
    100 problem boxes that help to solve specific problems in addition to those discussed
    throughout the book.


    CD-ROM: Supports the book’s contents with configuration files and numerous programs
    not included in many Linux distributions.


    BRIAN WARD is a Unix systems programmer, and is the author of the “Linux Kernel
    HOWTO,” widely circulated on the Internet. A Unix network administrator, he has
    worked with Linux since 1993. He is currently pursuing a Ph.D. in computer science
