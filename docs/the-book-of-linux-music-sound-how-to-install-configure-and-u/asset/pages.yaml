  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_160_0.png)


    Figure 7-3: KBlade and Grip, two of BladeEnc''s GUI front ends


    # # Why Choose BladeEnc?


    BladeEnc appeals to me (over the other encoders mentioned above) for sev-eral
    reasons: It is an open-source project licensed under the LGPL (a version of the
    GNU Public License specifically for the use of GPL-protected library components
    in non-GPL software), it supports the widest range of bitrates (with excellent
    results at 192 kbps), it will run in "batch" mode for automatically processing
    multiple files, and it can mix a stereo file to mono while encoding (no prior
    conversion is necessary).


    Todd Janssen has kept BladeEnc in continuous development, and it is widely regarded
    as one of the fastest MP3 encoders. I''ve used it to create MP3 from dozens of
    WAV files, and I recommend it to anyone looking for a fast, flexible, and freely
    available MP3 encoder.


    # # The Decoder and the Player


    Before an MP3 file can be played, it must be decoded. A decoding engine powers
    every MP3 player: many players (such as XMMS) use the mpg123 decoder, but some
    prefer to employ their own decoders. Decoders vary in their support of the MPEG
    audio format series (there are currently four commonly encountered), range of
    supported bitrates, and decoding speed.


    # # mpg123: The Decoder


    Author: Michael Hipp

    Version profiled: 0.59k (beta)

    Web site: http://www.mpg123.de/

    FTP site: n/a

    Maintained: Yes

    Availability: Free, open-source

    License: All rights held by the author'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'Michael Hipp''s mp3123 (shown in Figure 7-4) is the default MP3 decoder

    used by MMS (see section below) and is also the decoding engine inside

    many other MP3 players for Linux. You can use mp3123 easily at the console

    command-line or from an xterm window in X.


    # Getting It, Building It


    Copy the mp3123 package from this book''s CD or download the latest version

    from the mp3123 Web site. Move it to your package holding area, then unpack

    it with tar xvzf mp3123-latest.tar.gz. Enter your newly created mp3123 direc-

    tory and read the instructions on building and installing the program. Once

    again, a simple ./configure followed by make (as root) make install is all

    You have to do.


    # Using mp3123


    Running it with no arguments brings up the help screen shown in Figure 7-4.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_161_0.png)


    Figure 7-4: Running mp3123 with no arguments


    As you can see in Figure 7-4, mp3123 offers a broad range of options,

    including specifications, decoding instructions, and playlist manipulation-

    ation. I especially enjoy the ability to play MP3 files from a URL. For example,

    the command sequence


    ```

    mp3123 http://www.bright.net/~dlphilp/pieces2a.mp3

    ```


    will retrieve my MP3 masterpiece (the pieces2a.mp3 file) from the designated

    Web address, load it into mp3123, and play once it''s downloaded.'
