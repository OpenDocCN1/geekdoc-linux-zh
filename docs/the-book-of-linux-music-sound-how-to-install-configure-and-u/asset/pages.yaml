  md: 'When you''re satisfied with the details of your score, click on the Csound
    tab of the main window. Figure 9-20 shows the default panel that will appear.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_229_0.png)


    Figure 9-20: Csound in Silence


    Click on the Csound • Score tab, and you will see your new score represented in
    Csound format. The text in this panel (and the other panels of the Csound tab)
    can be directly edited. You can freely add function tables, tempo deassignators,
    section markers, comments, and any other element of the Csound sounding syntax.
    Press the Update button at any time to save your changes. Figure 9-21 is a look
    at our ragtime example score as a Csound file, with the addition of a single function
    table (the f1 statement).


    Now click on the Csound • Orchestra tab. The default window will be empty, and
    you can paste a Csound or file directly into the edit area. Figure 9-22 is a look
    at the Orchestra window containing a Csound or file.


    With your orc or sc files defined, click the Csound • Command tab. Again, the
    default condition is an empty panel, and it is here that you will enter your Csound
    command string. The default or/sc filenames are temp.orc and temp.sc. Press the
    Render button to begin compiling your or and sc files, and when the compile is
    finished, press Play to listen to your new soundfile. In Figure 9-23, you can
    see the compilation options for rendering your or and sc files into a soundfile.


    The window containing the sine wave is the Csound function window. Its appearance
    can be suppressed with the -d option, but it''s a good idea to keep your Csound
    messaging at the default level (graphics on, all messages echoed to the root window),
    because Silence doesn''t ring a bell or otherwise'
