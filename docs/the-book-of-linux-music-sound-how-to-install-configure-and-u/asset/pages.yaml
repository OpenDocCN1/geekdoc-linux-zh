- pgno: 61
  md: '# Getting It, Building It


    Get the yarec-0.65.tar.gz file from the FTP site listed above. Move it to your
    /home or /usr/local directory. Unpack it with tar xzvf yarec-0.65.tar.gz, enter
    your newly created yarec directory, and follow the instructions for building and
    installing the program. Run ./configure --help to check the configuration options,
    then run ./configure; make; make install. The program compiles quickly, and after
    a few minutes you will have a freshly built copy of copy.


    # Launching yarec


    The command


    ```

    yarec -r 44100 -b 16 -n testrec.wav

    ```


    launches yarec to record from the microphone (Figure 3-2). The recording will
    be a 16-bit file named testrec.wav, with a sampling rate of 44100 Hz.


    ![](img/43a9671cef617c9c7a18f7a6904433f1_61_0.png)


    Figure 3-2: The yarec program


    Before you can record anything into yarec, you must specify the recording channel
    in your mixer (mix, line, or CD). The balance of this example will use the microphone
    input of your soundcard and aumix for setting levels.


    > NOTE Setting mixer levels is very important for recording. If your input level
    is too low, your recording will be noisy and difficult to hear, and if it''s too
    high the signal will distort or feedback. Make a test recording or to find the
    best settings. It is also a good idea to keep your PCM audio channel set to a
    low value when first testing your soundcard output, bringing it up slowly to find
    the optimum level. If playback starts and the setting is too high, you may damage
    your speakers.


    # Recording with yarec


    Recording with yarec is a simple six-step process:


    +   1. At the console or xterm window prompt, open aumix, press m and mute all
    channels.'
