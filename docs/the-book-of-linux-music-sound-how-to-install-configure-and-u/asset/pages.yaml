- pgno: 366
  md: '![](img/43a9671cef617c9c7a18f7a6904433f1_366_0.png)


    Figure 14-17: Beginning Clanbomber


    Open the **Options** menu to toggle the music track and various other settings.
    Press the esc key to return to the **Main** menu, then select **Local Game**.
    When that menu opens, select **Player Setup** to choose your players and set up
    teams. Figure 14-16 shows the **Player Setup** window.


    When you''ve completed the player setup, return to the **Local Game** menu. Set
    the round time and the number of points needed to win, select a terrain map, and
    start the game. The screen shown in Figure 14-17 will appear.


    From here on, planting bombs and avoiding the bombs planted by your opponents
    are your primary activities. As squares on the board are blown up, various new
    powers are revealed (such as hurling bombs and getting two-for-one explosions).
    Acquiring those powers can help you collect points, but your time is always running
    out in Clanbomber. Eventually a big rubber ball will enter the playing field.
    You bounce around and punch empty spaces at random, leaving you with less and
    room to move. Finally, your score is assessed and you proceed to the next level.


    # **Bombing Out**


    My description hardly does justice to the game and the fun of playing it. With
    the incessant motion of your opponents, the bombs exploding constantly, and the
    continuous music soundtrack, Clanbomber''s excitement level is quite high. Game
    play is fast, and the graphics and sound are very good. Clanbomber is easy to
    build, easy to play, and easy to enjoy. In short, it''s a blast. . . <groan>'
