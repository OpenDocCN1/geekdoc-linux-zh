- img_proc: true
  md: '# Chapter 15:Q & A: Quick Answers to Common Questions


    # A Shortcut to Rebooting


    One of the fastest ways to reboot your system is to perform the "three-fingered
    salute" --ing the [Ctrl]-[Alt]-[Del] keys all at the same time -- from a virtual
    console.


    A virtual console is a character interface, unlike the graphical interface of
    the X Window System. There are several virtual consoles available to you, but
    the easiest to remember is probably the first one. You can reach it by pressing
    [Ctrl]-[Alt]-[F1].


    # Getting Back


    To return to your X session from a virtual console, just press the [Ctrl]-[Alt]-[F7]
    keys.


    To reboot from a virtual console, first move to a virtual console by pressing
    [Ctrl]-[Alt]-[F1], then press [Ctrl]-[Alt]-[Del] to reboot.


    # 15.5 Error Message While Installing an RPM


    # 15.5.1 Q: Errors on Software Installation


    How do I install an RPM from a CD or the Internet? I keep getting an error message
    when I use Gnome-RPM.


    # 15.5.2 A: Having "Permission"


    If you''re getting the error message similar to "failed to open /var/lib/rpm/packages.rpm"
    (see Figure 15-2, An RPM Install Error) it''s likely due to your permissions.


    When you install software, you''re often required to make system-wide changes
    -- changes which only root can enact. In your user account, permission to make
    such changes will be unavailable to you by default.'
