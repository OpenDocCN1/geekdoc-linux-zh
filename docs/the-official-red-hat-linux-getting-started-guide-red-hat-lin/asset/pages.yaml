    # 15.13 Using All Available RAM


    # 15.13.1 Q: Using All the Memory


    My computer has 128 MB of RAM, but I''m not sure all of it is being used. How
    can I find out whether the RAM is being used? Is there a way to get Linux to recognize
    all my memory, if it isn''t already?


    # 15.13.2 A: Instruct the Kernel to Use All Your RAM


    Usually, the Linux kernel will recognize all of the RAM on a system: however,
    there may be circumstances in which not all of the memory is being recognized.


    There are couple ways to make certain that all of your machine''s memory is being
    used by the Linux kernel. First, you can test to see if it''s being used, and
    if it isn''t, you can enter the option at the boot: prompt or you can edit a file
    called /etc/lilo.conf to make sure that the memory is used each time you boot
    into your system. (The /etc/lilo.conf is the configuration file for LILO, the
    Linux LoADER.).


    First, open an Xterm window and, at the shell prompt, type cat /proc/meminfo to
    find out the current statistics memory usage on your system. Your output will
    probably look similar to the following:


    ```

    total:      used:      free:  shared: cached:

    ```'
