  md: '# Section 14.3:Command History and Tab Completion


    # Locating a previously used command


    Want to find a command in your history file without having to hit the arrow keys
    or page through your history file? Use grep, a powerful search utility. Here''s
    how you can quickly find a previously used command: Let''s say you''re searching
    for the command that was something like sneak-something. You''ve used the command
    and think it might be in your history file. At the prompt, then,


    ```

    history grep sneak

    ```


    In addition to the command you''ve just typed, you''ll see your sought-after command,
    as well, because grep searched through your history file for every instance in
    which the word "sneak" appeared. You can learn more about grep later in this chapter,
    when we discuss tools which can help you read files.


    Another time-saving tool is known as command completion. If you type part of a
    file, command or pathname then press the [Tab] key, bash will present you with
    either the remaining portion of the file/path, or a beep. If you get a beep, just
    press [Tab] to obtain a list of the files/paths that match what''s been typed
    so.


    For example, if you forget the command updateddb, but remember a portion of the
    command, you can use root, then at the shell prompt, type up, press the [Tab]
    key twice and you''ll see a list of possible completions, including updateddb
    and uptime. By adding the letter "d" to up and pressing [Tab] again, your command
    is completed for you.


    So even if the machine is turned off at the end of the day, it''s not too hard
    to update the locate database: the chances that the command will be stored in
    the command-line history or can be completed with command completion (as long
    as you remember the start of the pathname for the command).'
