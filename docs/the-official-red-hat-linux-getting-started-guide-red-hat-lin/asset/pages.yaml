- img_proc: true
  md: '# Section 15.15:Removing Red Hat Linux


    # (ACT Y)


    Remove the ".", save the changes, and exit from Pico. After setting up the new
    configuration file, and saving it, you need to activate it. Just type:


    ```

    isapnp isapnp.conf

    ```


    This will reinitialize the card with your newly changed values. If the values
    that you select the first time don''t work, you can edit the file until you find
    values that don''t conflict. Remember to activate the changes each time that you
    edit this file.


    # 15.15 Removing Red Hat Linux


    # 15.15.1 Q: Removing Red Hat Linux


    How do I remove Red Hat Linux from my computer?


    # 15.15.2 A. Remove LILO


    To remove Red Hat Linux, you''ll need to remove the LILO information from your
    Master Boot Record (MBR).


    There are several methods to removing LILO from the MBR. Inside of Linux, you
    can replace the MBR with an earlier, saved version of the MBR using the following
    command:


    ```

    /sbin/lilo -u

    ```


    In DOS, NT and Windows 95, you can use task to create a new MBR with the "undocumented"
    flag mbr. This will only rewrite the MBR to boot the primary DOS partition. The
    command should look like:


    ```

    fdisk /mbr

    ```


    # Removing partitions


    If you want to remove Linux from a hard drive, and you attempted to use the default
    DOS disk, you will experience the "Partitions exist but they don''t exist" problem.'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'The best way to remove non-DOS partitions is with a tool that understands partitions
    other than DOS.


    You can perform this with your Red Hat Linux installation floppy by typing linux
    expert at: prompt, such as:


    ```

    boot:linux expert

    ```


    Select the option to install, rather than upgrade and, when you get to the partitioning
    section, choose fdisk. In fdisk, type p to print out your partition numbers; then
    remove the Linux partitions with the d command. When you''re satisfied with the
    changes you''ve made, you can quit with w, and your changes will be saved to disk.
    If you''ve deleted too much, type q to quit without changes.


    When your partitions have been removed, you can reboot with [Ctrl]-[Alt]-[Del]
    rather than continue with the installation.


    # 15.16 Changing Login from Console to X at Startup


    # 15.16.1 Q: Changing to Graphical Login


    How do I change my login from the console to the graphical screen?


    # 15.16.2 A. Edit /etc/initab


    If you find yourself logging into your system at the console, only to type the
    startx command to start the X Window System, changing your login from console
    to graphical will save you a step or two.


    You must edit one file, /etc/initab, by changing just one number in the run-level
    section. When you''re finished, log out, and the next time you log in, you''ll
    have a graphical X-window.


    Open an an. If you''re in your user account, su to root by typing


    ```

    su

    Password:yourrootpassword

    ```


    Now, type pico /etc/initab to edit the file with Pico. The file /etc/initab will
    open. Within the first screen, you''ll see a section of the file which looks like
    this:'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# Section 15.16:Changing Login from Console to X at Startup


    ```

    # Default runlevel. The runlevels used by RHS are:

    # 0 - halt (DO NOT set initdefault to this)

    # 1 - Single user mode

    # 2 - Multiuser, without NFS (The same as 3, if you do not have networking)

    # 3 - Full multiuser mode

    # 4 - unused

    # 5 - X11

    # 6 - reboot (DO NOT set initdefault to this)

    id:3:initdefault:

    ```


    To change from a console to a graphical login, you should change the number in
    the line id:3:initdefault: from a 3 to a 5.


    > WARNING

    Change only the number of the runlevels from 3 to 5.


    Your changed line should look like:

    id:5:initdefault:


    When you''re satisfied with your change, save and exit the file using the [Ctrl]-[X]
    keys. You''ll see a message telling you that the file has been modified, and asking
    you to confirm your change. Type [Y] for yes.


    When the file is closed, exit from root by typing exit, and close the Xterm window
    by typing exit.


    That''s it. Your next login will be from the graphical screen.'
  merge: -1
