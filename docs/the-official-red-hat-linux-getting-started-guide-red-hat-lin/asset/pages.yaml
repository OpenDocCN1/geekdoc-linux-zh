  md: '# Section 9.2:The KDE File Manager


    > CAUTION

    Unless you know what a file is for, use caution before trying to open or modify
    any file.


    # Drag and Drop Open, Move and Copy


    Keeping important documents and applications within easy reach is simple with
    KFM. To open a text file, for example, you can "drag" it from the content area
    of KFM by left-clicking on it and holding your mouse button down while you drag
    it. If you "drop" the file in an open text editor, it will open, ready for you
    to modify its contents.


    In the same way, you can drag and drop files from the content area to your desktop
    or to other folders. When you reach your destination, a pop-up menu will offer
    you the choice of copying, moving or linking the file. If you select Link from
    the menu, any changes you make to a file in its new location will be reflected
    in the original location. A link, then, is like a shortcut to the original file.'
