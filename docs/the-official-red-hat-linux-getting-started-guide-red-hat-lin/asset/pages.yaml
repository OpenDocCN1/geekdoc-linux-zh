- img_proc: true
  md: 'In the Edit Internet Connection dialog, select the Advanced tab and deselect
    the option Let PPP do all authentication. (By default, this option isn''t selected
    when you create an account.) If everything else looks correct, choose OK to return
    to the Accounts tab.


    Now, debug the connection again. You might find that your login procedure goes
    a little more smoothly, when pppd isn''t started immediately, but waits until
    your login name and password are sent to your ISP.


    Working with the debug feature can help you whittle down whatever problem might
    be hindering you from a working connection. When you''re finally successful, close
    the window to stop debugging. Since the debug option is only used to diagnose
    the setup, it won''t maintain your connection to your ISP.


    When you''ve successfully configured your connection, start the interface as described
    in the beginning of this section.


