  md: '# Figure 1–3 A KDE Desktop


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_24_0.png)


    # 1.1.3 Starting an Xterm


    Both GNOME and KDE offer quick launch buttons on their panels to open an Xterm
    window.


    # Figure 1–4 The GNOME Panel


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_24_1.png)


    On the GNOME Panel, the button which launches an Xterm appears near the center
    and looks like:


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_24_2.png)


    You can also findlaunchers to Xterms from the GNOME menu, under Utilities. Items
    which will open Xterms include GNOME terminal, Regular XTerm, and Color XTerm.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Figure 1–5 The KDE Panel


    | | One | Three |

    |---|---|---|

    | | Two | Four |


    Similar to GNOME, the KDE Panel prominently features a quick launch button for
    an


    Xterm. The launcher looks like:


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_25_0.png)


    You can also find the launcher from the KDE main menu under Utilities=>Konsole.


    Now, click on the Xterm button to open a window. You''ll see the shell prompt
    inside the window, and will look like


    ```

    [root@localhost /root]#

    ```


    Type useradd, then a space and the name of the new user account (name the account
    newuser, for example).


    It may not appear that anything has happened, but you''ve just completed step
    one of creating the new account. All that remains is is for you to give this account
    a password.


    # Picking account names


    Often, user accounts are just variations on the user''s name, such as jsmith for
    John Smith. You can choose whichever name you prefer, however, such as musicman
    or Elvisisk-


    Now, on the next line, type passwd a space and type the name of the new account
    for which you want to create the password (passwd newuser).'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# What is a secure password?


    You can be fancy or plain when you pick a user account name, but take precautions
    when you choose a password. The password is the key to your account, so it should
    be both unique and easy for you to remember. Your password should be at least
    six characters (actually, it can be 256 characters long, though you probably don''t
    that). You can mix upper- and lowercase letters, as well as numbers and characters.
    Avoid easy selections, such as qwerty or password. If you want to pick an easy-to-remember
    but somewhat unique password, consider a variation of a word, such as a1rPl8nE
    for airplane. If you need more information about passwords, see Chapter 12, Shell
    Prompt Basics.


    Next, you''ll be asked to enter the password for the new user''s account -- the
    prompt will state: New UNIX password. Enter a password that will be easy to remember
    and secure.


    Type the password again for confirmation, and you''ll see a message stating passwd:
    all authentication tokens updated successfully, which means that you''ve successfully
    created the new account.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Figure 1–6 Adding a user in an Xterm


    ```

    Terminal

    File Edit Settings Help

    [root@localhost #] useradd newuser

    [root@localhost #] passwd newuser

    Changing password for user newuser

    New password:

    Retype new UNIX password:

    passwd: all authentication tokens updated successfully

    [root@localhost # ]

    ```


    In Figure 1–6, Adding a user in an Xterm, you can see a sample of an Xterm window
    with the commands and prompts.


