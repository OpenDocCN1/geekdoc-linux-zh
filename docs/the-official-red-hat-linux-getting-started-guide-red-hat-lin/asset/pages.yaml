- img_proc: true
  md: '# Chapter 15:Q & A: Quick Answers to Common Questions


    Another way you can view .bash_history is with a pager such as less, typing less
    .bash_history at the shell prompt. To move forward a screen, to move back a screen,
    press the [B] key, and to quit, press [Q].


    But paging through to find a command can be tedious. A useful alternative is to
    search the file for keywords using grep, a powerful search utility.


    If you can recall part of any command you''d typed at the shell prompt, and if
    that command is still in .bash_history, you can find it fast by piping the results
    of the history command through the utility called grep.


    Let’s say you’ve been reading the man page the day before, but can’t recall its
    name. To search for the command, then, type:


    ```

    history | grep man

    ```


    In no time, you''ll see all of the commands you''d typed which have the word man
    in them -- both the relevant and irrelevant.


    There are plenty of ways to make use of command history. For other tips and tricks,
    see Section 15.10, Tips on Using Command History


    # 15.9 Keep ls from Scrolling


    # 15.9.1 Q: When ls Is Output Scrolls Off the Screen


    Whenever you type ls I can barely see the output of the directory because it scrolls
    by too quickly. How can I actually read the output?


    # 15.9.2 A: "Piping" the Output of ls1


    You can prevent the output of ls from scrolling by too quickly by piping the output
    to a pager, such as less or more. The results are akin to the DOS command dir
    somirectory /p, because you''ll see the output one screen, or "page" at time.


    To read the output of /etc with less, for example, at the shell prompt, type:


    ```

    ls -al /etc | less

    ```'
