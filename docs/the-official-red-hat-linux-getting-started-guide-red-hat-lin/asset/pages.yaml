  md: '# Section 7.4:Using Messenger to Read News


    Your next task is to download the list of newsgroups from your ISP''s news server,
    and to subscribe to those groups in which you have an interest. Be prepared: Depending
    on the speed of your connection, downloading the list of many thousands of newsgroups
    can take some time. While you wait for the complete list, you may have enough
    time to make a cup of coffee, phone a friend -- or read a novel (just kidding).


    To begin, click on Subscribe on Messenger''s menu, or right-click on the news
    server entry in the Message Center dialog, and select Subscribe to Newsgroups.


    Figure 7–19 The Newsgroups Subscription Dialog


