    # 14.3 Command History and Tab Completion


    It doesn''t take long before the thought of typing the same command over and over
    becomes unappealing, at best.


    Linux users don''t feel any differently about that, either. In Linux, since you
    can string together commands at the shell prompt, one minor typo in a couple lines
    of a command could mean that all that typing was in vain.


    So there''s a solution: It''s called **command-line history**. By scrolling with
    the up and down arrow keys, we can find plenty of our previously typed commands
    -- including the ones with typos.


    Let''s try it by taking a look again at `sneakers.txt`. The first time, however,
    at the shell prompt, we''ll type:


    ```

    cat sneakrs.txt

    ```


    Nothing happens, of course, because there is no `sneakrs.txt` file. No problem.
    We''ll just use the up-arrow key to bring back the command, then use the left-arrow
    key to get to the point where we missed the "e." Insert the letter and press [Enter]
    again.


    Voila! We now see the contents of `sneakers.txt`.


    By default up to 500 commands can be stored in the bash command-line history file.'
