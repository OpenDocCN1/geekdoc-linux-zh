  md: '# Section 6.1:Using RP3 to Connect


    By default, when RP3 connects to your ISP, it starts pppd. What is pppd? It means
    Point-to-Point Protocol daemon: briefly, it helps your machine to "shake hands"
    with your ISP.


    > To learn more about pppd

    You can learn more about pppd by reading its man page. At the shell prompt, type
    man pppd.


    You can customize and configure account information by right-clicking on the RP3
    monitor and selecting the Configure PPP entry.


    Figure 6–11 The Internet Connections Dialog


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_104_0.png)


    In the Internet Connections dialog which appears, you can add a new account, delete
    an account and modify current account configuration. You can also debug the account,
    meaning that you can test your settings to see if there are any problems.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# 104 Chapter 6:Getting Online


    Selecting the Add button will begin the Configure PPP tool, allowing you to enter
    new account information.


