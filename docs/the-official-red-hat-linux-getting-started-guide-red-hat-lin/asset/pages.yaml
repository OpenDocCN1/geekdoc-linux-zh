- img_proc: true
  md: 'Once you’ve selected the location of your modem, you can select the flow control.
    Although you have a choice in the drop-down list for Flow Control, -- CRTSCTS,
    which specifies hardware flow control -- is the recommended setting (XON/XOFF
    specifies software flow control).


    The following entry, Line Termination, allows you to specify a correct setting
    for your modem. Often, the CR/LF entry is correct for most modems. If, however,
    you have difficulty querying your modem (see Testing Your Modem in Section 6.2.2),
    this this may be one area to which you should return to adjust settings.


    The Connection Speed entry allows you to select the highest baud rate for your
    modem (for example, a 56k modem can typically be set to 115200).


    By default, Use Lock File is checked. This means that Kppp will lock the device
    while you’re online -- preventing others from using the modem.


    The Modem Timeout entry provides the time, in seconds during which Kppp waits
    for a CONNECT response after dialing.


    # Testing Your Modem


    In the Modem section, you can test your modem’s responsiveness to your configuration
    (see Figure 6–25, The Modem Tab). By adjusting the sliding bar next to Modem volume,
    you can modify the volume of your modem while you’re dialing and connecting.'
