  md: '# Section 13.7:Using Redirection


    > CAUTION

    Be careful when you redirect the output to a file, because you can easily overwrite
    an existing file! Make sure the name of the file you''re creating doesn''t match
    the name of a pre-existing file, unless you want to replace it.


    Let''s use output redirection for another file and call it home.txt.


    ```

    [newuser@localhost]$ cat > home.txt

    bring the coffee home

    take off shoes

    put on sneakers

    make some coffee

    relax!

    ```


    Now, on an empty line, use the [Ctrl]- [D] keys again to quit cat.

    We can check the file again by typing:


    ```

    cat home.txt

    ```


    at the prompt.

    Let''s use cat again to join home.txt with sneakers.txt and redirect the output
    of both files to a brand new file we''ll call saturday (you''ll find an example
    in Figure 13–13, Joining Files and Redirecting Output).


    ```

    [newuser@localhost newuser]$ cat sneakers.txt home.txt > saturday

    ```


    That''s it.'
