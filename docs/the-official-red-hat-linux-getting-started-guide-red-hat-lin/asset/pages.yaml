  md: '# Widget


    A standardized on-screen representation of a control that may be manipulated by
    the user. Scroll bars, buttons, and text boxes are all examples of widgets.


    # X Window System


    Also known as "X," this graphical user interface provides the well-known "windows
    on a desktop" metaphor common to most computer systems today. Under X, application
    programs act as clients, accessing the X server, which manages all screen activity.
    In addition, client applications may be on a different system than the X server,
    permitting the remote display of the applications graphical interface.


    # XFree86


    A free implementation of the X Window System.'
