    # ## 6.1.5 Troubleshooting


    Sometimes, things may not go as well as you''d hoped when you''re trying to establish
    a connection. That''s when debugging can come in handy. Briefly, debugging allows
    you to see a little of what''s going on behind the curtain when you''re trying
    to connect.


    To start, launch RP3 and open the Accounts tab in the Internet Connections dialog.
    Now, highlight the account you want to debug, and select the Debug button in the
    options to the right.


    Once you choose to debug the account, you''ll see a window similar to Figure 6–14,
    Debugging an Account, showing you the commands which are used to initialize your
    modem, connect to your ISP and perform a login to your Internet account.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# Section 6.1:Using RP3 to Connect


    # Figure 6–14 Debugging an Account


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_108_0.png)


    The lines may slip by too quickly for you to catch anything unusual. Not to worry:
    You can scroll through the window to study the information and, for easier review,
    you can choose the Save Log button to save the contents of the window as a text
    file, which you can print or open in an editor or word processor.


    You may find, for example, that you can connect to your ISP, but you''re not correctly
    logging in. Check first to make certain that you entered the correct user name
    and password for your account.


    It''s also possible that the pppd is starting too early, before you have a chance
    to log in with your name and password. In this case, you appear to be successfully
    connected, yet when you try to view a Web page with Netscape, you''re met with
    error messages.


    If this is the case, stop debugging the connection by selecting Close or Cancel,
    then return to the Edit feature in the Accounts tab.'
  merge: -1
