    # 13.10 Pipes


    No, we''re not talking about plumbing here. In Linux, pipes connect the standard
    output of one command to the standard input of another command.


    Let''s take a step back, to the ls command. There are plenty of options available
    with ls, but what if the contents of a directory stream by too quickly for you
    to view them?


    Let''s view the contents of the /etc directory.


    ```

    ls -al /etc

    ```


    How do we take a closer look at the output before it races off the screen?


    One answer is to pipe the output to a utility called less. Known as a pager, (like
    more) allows us to view information one page (or screen) at a time.


    We use the vertical bar (|) to pipe the commands (as shown in Figure Figure 13–15,
    Piping Output of ls to less).


    ```

    ls -al /etc | less

    ```


    Now we can view the contents one screen at a time. To move forward a screen, press
    [Space]; to move back a screen, press [B]; to quit, just press [Q].'
