    By typing go-rw, then, we were saying "for the group and others, remove read and
    write permission to the file sneakers.txt."


    You might think of these settings as a kind of shorthand when you want to change
    permissions with chmod, because all you really have to do is remember a few symbols
    and letters with the chmod command.


    Here is a list of what the shorthand represents:


