  md: '# Chapter 14:Working with Files and Directories


    With `locate`, we''ll see every related file or directory which matches our search
    criterion. Let''s say we want to search for all files related to the finger command.


    ```

    locate finger

    ```


    The locate command uses a database to check for files and directories which match
    the string finger.


    # More about locate


    To learn more about `locate`, read the `locate` man page (type `man locate` at
    a shell prompt).


    It''s a handy command that works very quickly -- as long as the database is up
    to date. That database is automatically updated on a nightly basis, by `cron`.
    What''s `cron`? It''s a small program that runs in the background, performing
    various tasks -- such as updating the `locate` database -- at regularly scheduled
    intervals.


    # More about cron


    `cron` is a `daemon`. Daemons handle tasks in the back-ground. To read the `cron`
    man page, type `man cron` at the shell prompt.


