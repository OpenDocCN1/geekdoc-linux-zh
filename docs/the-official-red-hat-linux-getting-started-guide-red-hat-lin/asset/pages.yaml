- img_proc: true
  md: '# 14.5.4 Deleting Files and Directories


    We talked about creating files with the touch command and by using redirection
    Chapter 13, You Are Here. And we created the directory tigger using mkdir.


    But we haven''t discussed how to delete files and directories.


    Deleting files and directories with the rm command (man rm) is a straightforward
    process.


    Let''s take our new file piglet.txt, and delete it from the tigger directory with
    the rm command:


    ```

    rm piglet.txt

    ```


    What happens if we didn''t really want to get rid of it? Too late! Again, that''s
    where the -i (interactive) option comes in handy, because it gives a second chance
    to think about whether we really want to toss the file.


    ```

    [newuser@localhost newUser]$ rm -i piglet.txt

    rm: remove ''piglet.txt''

    ```


    You can also delete files using the wildcard *, but be careful, because you can
    easily delete files you didn''t intend to throw away.


    To remove a file using a wildcard, you would type:


    ```

    rm piglet*

    ```


    You can also remove more than one file in one command, as in:


    ```

    rm piglet.txt sneakers.txt

    ```


    Options for removing files -- and directories -- include:


    +   - -i -- interactive. Prompts you to confirm the deletion. This is good.

    - -f -- force. Overrides interactive mode and removes the file(s) without prompting.
    This might not be good, unless you know exactly what you''re doing.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# Section 14.5:Copying, Moving and Renaming Files and Directories


    +   - -v -- verbose. Shows a listing of files as they''re being removed.

    - -r -- recursive. When removing directories, will remove all of the files and
    the subdirectories of the specified directory. This can also get rid of an empty
    directory.


    To remove directories, you must specify the -r option.

    For example, if you want to recursively remove the directory tigger you would
    type:


    ```

    rm -r tigger

    ```


    And if you want to combine options, such as forcing a recursive deletion, you
    can type:


    ```

    rm -rf tigger

    ```


    > CAUTION

    The rm is a powerful command, and can delete your entire system! If you''re root
    and you type the simple command rm -rf / you''re sunk -- like a snake eating its
    tail, the command will recursively remove everything on your system.


    A safer alternative to using rm for removing directories is the rmdir command.
    With this command, you won''t be allowed to use recursive deletions, so a directory
    which has files in it won''t be deleted.


    Read the rmdir man page by typing man rmdir to find out more about the command.'
