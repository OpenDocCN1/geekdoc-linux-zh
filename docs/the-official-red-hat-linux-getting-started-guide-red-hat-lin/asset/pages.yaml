  md: '# 8 Customizing Your Desktop in GNOME and KDE


    Both GNOME and KDE offer you plenty of ways to add your own personalità to your
    workspace. Each environment provides powerful control centers, which let you to
    change the way your workspace looks, sounds, and more. In many respects, each
