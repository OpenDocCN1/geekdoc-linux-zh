  md: '# # 2 GNOME in 60 Seconds (or so)


    GNOME is the default desktop environment in Red Hat Linux 6.2. Like KDE, GNOME
    is flexible and user-friendly, providing both the power of your new Red Hat Linux
    system and a comfortable graphical user interface -- or GUI.


    This chapter will help you get acquainted with some of the fundamentals of GNOME.
    You''ll find greater detail about specific tasks -- such as connecting a printer
    and setting up your Internet account -- in later chapters.


    You''ll find the latest GNOME-related information at the official GNOME website:
    http://www.gnome.org.


    For a similar orientation to KDE, turn to Chapter 3, KDE in 60 Seconds (or so).


    | If you want to use both |

    | If you''ve got GNOME and KDE on your system, you can often use applications
    from the other environment in your chosen environment. For example, you can use
    the KDE e-mail client, KMail, even though your chosen environment is GNOME. The
    same can be said for other applications, which aren''t strictly GNOME or KDE applications,
    such as those you might find online.|


    # ## 2.1 An Overview


    When you first begin your GNOME X Window session, among the first items you''ll
    see:


    +   - The Desktop -- The main workspace of your environment which incorporates
    everything, including the items which follow in this list (see Figure 2–1. A GNOME
    Desktop for an example). Windows are placed on the Desktop: launchers are also
    found here for applications, documents or other data. Double-clicking will open
    a folder or start an application. See Section 2.2, The Desktop.'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'Folders -- When you first log in, folders contain links to documentation such
    as support, help and reference guides, either on your installed system (locally)
    or on the Web. Folders (as well as launchers to other applications) can be added
    and deleted from the Desktop. See Figure 2–2, Folders and Launchers on the Desktop
    for an example of folders and launchers on the desktop. See Section 2.3, Folders.


    The Panel -- The long bar across the bottom of the Desktop (for example, Figure
    2-4, The Panel at the Bottom of the Desktop). The Panel serves as a quick launcher
    for applications and applets (mini-applications), as well as minimized applications
    you may already be running. See Section 2.4, The Panel.


    Main Menu Button -- Part of the Panel, this button, which looks like the stylized
    GNOME footprint (see Figure 2-6, The Expanded Main Menu for an example), holds
    launchers and submenus to all of the included applications and applets for your
    Red Hat Linux system. Some applications you install will also be incorporated
    into this menu. You can add launchers to these menus, as well. See Section 2.5,
    Main Menu Button.


    Help Button -- By default, you''ll find a button on the Panel which has a question
    mark on it. This button is a launcher to the GNOME Help Browser. See Section 2.6,
    Finding Help.


    Multiple desktops -- In the center of the Panel you''ll find the Desk Guide, which
    shows you the number of desktops available to you. You can spread your work throughout
    multiple desktops, rather than crowd one desktop area with multiple applications.
    See Section 2.7, Multiple Desktops.


    Switching environments -- Although it''s not something you''ll find on your desktop,
    there''s a utility that allows you to easily and quickly change the choice of
    environments. Called Switchdesk, you can use this utility to quickly and easily
    change from GNOME to KDE or vice-versa. See Section 2.8, Switching Environments.


    # 2.1.1 Using Your Mouse


    Using the left mouse button selects an item to open or drag to another location;
    by holding down the left mouse button while you drag the cursor over items, you
    can select multiple items on the desktop.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Make your two-button mouse act like it has three buttons


    A three-button mouse offers the greatest flexibility in GNOME. If you have a two-button
    mouse, however, and you selected three-button emulation when you installed Red
    Hat Linux, simply hold down left and right mouse buttons at the same time to get
    the effect of a middle mouse button.


    Pressing the middle button of your mouse on the desktop will reveal a GNOME applications
    menu, help menus and configuration menus for Enlightenment, the default GNOME
    window manager.


    Using the right mouse button reveals a menu of actions which you can take. Right-clicking
    on the desktop shows you options such as adding desktop items, customizing the
    background and more. Right-clicking on a folder or application reveals a menu
    related to actions you can take with your selection, such as deletion, properties
    and more.


    # 2.1.2 Drag and Drop


    You can drag and drop items in GNOME, meaning that you can "carry" data or applications
    from one area of the desktop to another, "drop" items in folders or on applications,
    and move or copy information and applications.


    # 2.2 The Desktop


    Your first view of GNOME will look something like Figure 2–1, A GNOME Desktop.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Figure 2–1 A GNOME Desktop


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_35_0.png)


    The desktop, which is also sometimes referred to as the **workspace**, is the
    area on which you run your applications and perform all your work. On your desktop
    are **launchers** and **folders** (see Figure 2–2, Folders and Launchers on the
    Desktop, for example).


    +   - Launchers -- Icons which appear on the desktop. Click on the icon to start
    the application it''s associated with. For example, clicking on a Netscape icon
    will launch the browser.


    +   - Folders -- Containing contents of directories, launchers or documentation
    or applications.


    +   - The folder **Home directory** -- Leads to your specific directory in /home
    on the system (for example, if your login directory was newuser, the **Home directory**
    folder on the desktop would lead to your login directory, /home/newuser`) See
    Figure 2–3, Contents of an Open Folder.'
