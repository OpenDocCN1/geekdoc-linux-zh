  md: '# Chapter 13:You Are Here


    ls -a


    Quite a difference. When you added the -a option, you were specifying that you
    wanted to list all the files in the directory (see Figure 13–6, ls with -a Option).

    In fact, there are a multitude of options available with the ls command.


    # Read the 1s man page


    If you want to see all the options of the ls command, you can read the man page
    by typing man 1s at a shell prompt.

    If you want to print the man page, type man 1s | col -b | lpr at the prompt.


    Why so many options? Because they can help you sort information according to your
    needs. For example, you can specify how files are displayed, see their permissions
    and much more.


    Figure 13–6 ls 1s -a, Option


    When you typed ls 1s -a, you probably noticed the files that begin with dots.
    These are called hidden files or, appropriately enough, dot files.


    Hidden files are mostly configuration files which set preferences in programs,
    window managers, shells and more. The reason they''re "hidden" is to help prevent
    any accidental tampering by the user. Besides, when you''re searching for a directory,
    you''re not often looking for these configuration files, so keeping them hidden
    helps to avoid screen clutter.


    Whenever a filename starts with a dot (.), it''s a hidden file, and ls won''t
    list it.


    Viewing all the files can give you plenty of detail, but there''s more you can
    uncover, simply by adding more than one option.


    If we want to see the size of a file or directory, when it was created and more,
    we can just add the "long" option (-l) to our ls 1s -a command.'
