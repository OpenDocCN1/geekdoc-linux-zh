  md: '# Section 13.8:Appending Standard Output


    # Combining files with cat


    Creating and combining short files with cat can be a convenient alternative to
    using a text editor like Pico.


    # Summary


    By using the output redirection symbol (>) you can send the output to a file instead
    of the terminal. The cat utility can be used along with output redirection to
    join files together into a single, unified file with one filename.


    # 13.8 Appending Standard Output


    There''s a neat twist to output redirection which allows you to add new information
    to the end of an existing file. Similar to when you used the > symbol, you tell
    your shell to send the information somewhere other than standard output.


    However, when you use >>, you are adding information, rather than replacing it.


    The best explanation is a demonstration, so let''s take two files which have already
    been created -- sneakers.txt and home.txt -- and join them by using the append
    output symbol. We want to add the information in home.txt to the information already
    in sneakers.txt, so we type:


    ```

    cat home.txt >> sneakers.txt

    ```


    Now let''s check the file by typing:


    ```

    cat sneakers.txt

    ```


    And there it is -- with the contents of home.txt at the end.


    What we were saying when we typed that command was, "append the output from the
    file home.txt to the file sneakers.txt."'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'By appending the output, we''ve saved ourselves a step or two (and a bit of
