  md: '# 3 KDE in 60 Seconds (or so)


    Like GNOME, KDE is an appealing and easy to configure graphical environment. Formally
    called the K Desktop Environment (the K doesn’t represent any word, according
    to the website FAQ), the goals of the KDE Project are to lessen the Linux/UNIX
    learning curve for many users, and to present an appealing environment for everyone.
    Since its foundation in October 1996 by Matthias Ettrich, KDE has garnered praise
    from new and seasoned Linux users alike.


    Hundreds of free software developers from all over the world have worked on the
    KDE Project, and continue to refine and enhance the environment.


    Like the chapter about the basics of GNOME (Chapter 2, GNOME in 60 Seconds (or
    so)), this chapter will provide a quick overview of KDE fundamentals. Details,
    such as configuring your desktop, working with the file manager and using specific
    KDE tools, will be covered later in this book.


    For the latest documentation on KDE, visit the project’s website: http://www.kde.org.


    | If you want to use both |

    | If you’ve got GNOME and KDE on your system, you can often use applications from
    the other environment in your chosen environment. For example, you can use the
    Gnumeric spreadsheet application in KDE, even though the application is part of
    the bundled GNOME applications. |


    # 3.1 An Overview


    When you first start KDE, among the first items you’ll see are:


    +   - The Desktop -- The main workspace of your environment (see Figure 3–1, A
    typical KDE Desktop for an example); the space on which you place windows for
    running applications, icons for starting programs, folders for programs or documents.
    See Section 3.2, The Desktop.'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'The Floppy, CD-ROM, Printer, and Trash icons -- These are links (or shortcuts)
    which allow you easy access to your floppy and CD-ROM drives or let you "throw
    away" items by dropping them into the trashcan. See Section 3.2.1, The Trash,
    Printer, and Drives.


    Folders -- In the folder Templates, you''ll find links which you can drag your
    desktop to create new desktop items. The folder called Autostart is where you
    can place applications which you want to start automatically whenever you log
    in (see Section 3.3, Folders).


    The Panel -- The long bar across the bottom of the Desktop (for example, in Figure
    3–1, A Typical KDE Desktop). The panel serves as a quick launcher for applications
    and applets (mini-applications). See Section 3.4, The Panel.


    Multiple desktops -- In the center of the Panel you will find the Switch Desktop
    buttons, which show you the number of workspaces available to you. You can spread
    your work throughout multiple desktops, rather than crowd one desktop area with
    multiple applications. See Section 3.4.1, Multiple Desktops.


    Main Menu K Icon -- Part of the Panel, at the left (see Figure 3–9, The Main Menu
    K Icon with Expanded Menu for an example), leads to launchers and submenus for
    included applications and applets on your Red Hat Linux system. Some applications
    you install, such as StarOffice, can also be incorporated into this menu. See
    Section 3.5, The Main Menu K Icon.


    The Taskbar -- Appearing at the top of the desktop by default (though you can
    change this), the Taskbar is a thin bar which shows your currently opened windows
    -- both minimized and on the desktop. See Section 3.6, The Taskbar.


    Finding Help -- KDE includes a detailed set of help files for navigating and customizing
    the environment. See Section 3.7, Finding Help.


    Switching Environments -- Although it''s not something you''ll find on your desktop,
    there''s a utility which allows you to easily and quickly change your choice of
    environments. Called Switchdesk, you can use this utility to quickly and easily
    change from GNOME to KDE or vice-versa. See Section 3.8, Switching Environments.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# 3.1.1 Using Your Mouse


    # Click once


    Unlike GNOME, you start applications and open folders by clicking once on the
    associated icon.


    Using the left mouse button selects an item to open or drag to another location.
    To drag the item, hold down the mouse button, and continue holding it down while
    dragging to the new location. Once at the desired location, release the mouse
    button to "drop" the item.


    You can also select multiple items by holding down the cursor and dragging it
    over the items. Once you release the mouse button, each of the selected items
    will be highlighted.


    If there are multiple items you want to move or copy, but they''re not easily
    aligned for quick-selection, you can highlight each item by holding down the [Ctrl]
    key while clicking once on each icon.


    When you drop the files on their desired location -- such as a folder -- a menu
    will appear asking whether you want to Copy. Move or Link the files at the selected
    location.


    # Make your two-button mouse act like it has three-buttons


    As with GNOME, a three-button mouse offers the greatest ease of access to menus
    and navigation in KDE. If you have a two-button mouse, however, and you selected
    three-buttonton emulation, simply hold down both left and right mouse buttons
    at the same time to emulate the "middle" button of a mouse.'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'ing the middle button of your mouse on the desktop will allow you to switch
    desktops by selecting desktops one through four (you can rename the desktops,
    as you''ll learn in later in this book).


    Using the right mouse button reveals a brief menu of actions which you can take.
    Right-clicking on the desktop shows you options such as adding desktop links --
    which start applications, visit websites or open documents. You can also rescan
    and declutter the desktop.


    Also, among the options when you right-click on the desktop, you''ll find a link
    to helpful documentation on using the desktop itself.


    Right-clicking on a folder or application reveals a menu related to actions you
    can take with your selection, as moving the item to the Trash, revising the item''s
    properties and more.


    # 3.1.2 Drag and Drop


    You can drag and drop items in KDE, meaning that you can "carry" data or applications
    from one area of the desktop to another, "drop" items in folders or on applications,
    move or copy information and applications.


    When you drag an item by holding down the left mouse button, then release the
    button over the desired location, you''ll find a menu of actions you can take.
    You can copy the item into the location (which will preserve the original item)
    you can move the item to its new location, or you can create a link from the item
    in its new location to the original item. This last option is somewhat similar
    to copying; however, when you copy the item, the original item remains unchanged
    if you modify the copy. When you link an item, any changes you make to the item
    in one location are reflected in the item at its original location.


    You can also drag applications, such as Netscape, from the desktop and drop them
    into the Panel to use as a quick launcher. (To remove an item from the Panel,
    right-click on the item, and select Remove. Removing an application from the Panel
    will only remove the link and icon, not the actual application.)'
  merge: -1
