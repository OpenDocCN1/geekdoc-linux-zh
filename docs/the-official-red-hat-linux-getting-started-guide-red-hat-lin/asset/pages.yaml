    the option of saving your work or your session.


    # "Killing" an X session


    If you''re having difficulty quitting your X session -- for example, if you get
    no response when you click on the Log out button in KDE -- you can swiftly kill
    the X session and return to the login screen by pressing the [Ctrl]-[Alt]-[Backspace]
