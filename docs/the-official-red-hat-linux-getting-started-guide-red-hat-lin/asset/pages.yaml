  md: '# Glossary


    # FQDN


    # FTP


    An abbreviation for File Transfer Protocol. Also the name of a program that, as
    the name implies, permits the copying of files from one system on a network to
    another.


    # Gateway


    In networking terms, refers to a device that connects one or more computers on
    a network to other networks. The device may be specialized hardware (such as a
    router), or may be a general-purpose computer system configured to act as a gateway.


    # Geometry


    When referring to disk drives, the physical characteristics of the disk drive''s
    internal organization. Note that a disk drive may report a "logical geometry"
    that is different from its "physical geometry," normally to get around BIOS-related
    limitations. See also Cylinder, Head and Sector.


    # GID


    Short for Group ID. The means by which a user''s membership in a group is identified
    to various parts of Red Hat Linux. GIDs are numeric, although human-readable names
    are stored in the /etc/group file.


    # Group


    Groups are a way of assigning specific access rights to certain classes of users.
    For example, all users working on Project X could be added to group xproj. System
    resources (such as disk space) devoted to Project X could then be configured to
    permit only members of xproj full access.'
  merge: -1
