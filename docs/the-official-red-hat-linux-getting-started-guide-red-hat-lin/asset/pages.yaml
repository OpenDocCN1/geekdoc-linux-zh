    \ release (1), and architecture (i386). Installing a package is as simple as typing:\n\
    \n```\n# rpm -ivh foo-1.0-1.i386.rpm\n################################\nfoo\n\
    ```\n\nRPM prints out the name of the package (which is not necessarily the same\
