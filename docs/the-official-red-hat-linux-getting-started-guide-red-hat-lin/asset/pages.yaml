- img_proc: true
  md: '# Chapter 14:Working with Files and Directories


    # **Remember case**


    Unless otherwise specified, **grep searches are case-sensitive**. That means that
    searching for *Coffee* is different than searching for *coffee*. So among **grep**''s
    options is -i, which allows you to make a case-insensitive search through a file.
    Read the **grep** man page for more about this command.


    # **I/O Redirection and Pipes**


    And don''t forget about using pipes and output redirection when you want to store
    and/or print information to read at a later time.


    You can, for example, use **grep** to search for particular contents of a file,
    then those results either saved as a file or sent to a printer.


    To print the information about references to "coffee" in sneakers.txt, for example,
    just type:


    ```

    grep coffee sneakers.txt | lpr

    ```


    This command behaves similar to the command **ls -al /etc | more**, which you
    may have used in Chapter 13, **You Are Here** here to list the contents of the
    /etc directory then send the results through the **more** command for viewing
    on the screen.


    > **It''s safer to use >>**


    Remember the distinction of using > and >>: using > will overwrite a file, while
    >> appends the information to a file. Usually, unless you''re certain you want
    to, it''s safer to use >>, because you won''t lose potentially valuable information
    (though you may have to edit the file if you didn''t want to append information
    to it).'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Section 14.4:Identifying and Working with File Types


    # Wildcards and Regular Expressions


    What if you forget the name of the file you''re looking for? You can''t say to
    your computer. "Find a file called ''sneak'' or ''sneak-something''."


    Well, yes you can, in a way. Using wildcards or regular expressions, you can perform
    actions on a file or files without knowing the complete filename. Just fill out
    what you know, then substitute the remainder with a wildcard.


    # Find out more about wildcards and regular expressions


    To read more about wildcards and regular expressions, take a look at the bash
    man page (man bash). Remember that you can save the file to a text file by typing
    man bash | col -b > bash.txt. Then, you can open and read the file with less or
    pico(pico bash.txt). If you want to print the file, be prepared: It''s quite long.


    We know the file''s called "sneak-something.txt," so just type:


    ```

    ls sneak*.txt

    ```


    and there''s the name of the file:


    ```

    sneakers.txt

    ```


    You''ll probably use the asterisk (*) most frequently when you''re searching.
    The asterisk will search everything that matches the pattern you''re looking for.
    So even by typing:


    or:


    ```

    ls sn*

    ```'
