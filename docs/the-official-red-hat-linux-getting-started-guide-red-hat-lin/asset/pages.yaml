    * Click on OK in the Edit Local Printer Entry dialog; you''ll return to the Print
    System Manager.

    * Highlight your new printer entry in the Print System Manager dialog, then restart
    lpd from the menu.

    * Finally, with your printer highlighted in the Print System Manager, print a
    test page by selecting the option from the menu.


    If you''re unsuccessful at printing the test page -- or you''ve got to modify
    the way it printed -- return to the Configure Filter dialog to select a different
    filter or change settings for your current filter.


    If you''re experiencing trouble, remember to check The Hardware Compatibility
    List and the The Linux Printing HOWTO, cited in the beginning of this chapter.'
