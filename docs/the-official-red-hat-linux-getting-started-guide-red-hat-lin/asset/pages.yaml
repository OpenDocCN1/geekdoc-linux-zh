  md: '# Section 15.4:Shutting Down


    A window will appear (see Figure 15–1, The Switchdesk Utility from the Shell Prompt)
    showing you the choices of environments you can select, under Available Desktops.
    Once you select your new environment, click on OK.


    To see your changes take effect, you''ll have to log out, then log back in.


    From the login screen: You''ll select other alternative environments under Options
    => Sessions. Again, you can select a variety of environments.


    Now, just type in your name and password, and log in as usual.


    # 15.4 Shutting Down


    # 15.4.1 Q: "Right way" to Shut Down


    What''s the "right way" to shut down or reboot your system? Are there any shortcuts?


    # 15.4.2 A: Putting Away Files


    Any method you choose which allows your Red Hat Linux system to put away all data
    files and stop running processes is the "right way" to shut down. Never simply
    turn off your machine.


    Here are two ways you can cleanly shut down your system:


    +   From your X session: Go to the Panel''s Main Menu Button => Log out then choose
    Logout, or Reboot. You can also choose to save your current setup, means that
    the programs which are running when you log out will return when you log back
    in.


    +   If you select either Halt or Reboot, you''ll be required to enter your login
    password after you press the OK button to verify your selection.


    +   From the shell prompt: In an Xterm window, type shutdown -r now or shutdown
    -h now. and the -h means "halt." You will be required to enter your password before
    these commands are executed.


    +   From the login screen: Go to Option => System. You can choose whether to halt
    or reboot your system, without a required password.'
