    cat.


    Notice the difference (see Figure 13–12, Redirecting Output to a File)? For one
    thing, there are no double empty entries. That’s because the standard output from
    cat was redirected. That redirection was to a brand new file you made called sneakers.txt.


    You can find the file in your login directory (may we suggest using ls if you
