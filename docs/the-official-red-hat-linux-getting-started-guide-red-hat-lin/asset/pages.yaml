    to send and receive e-mail and newsgroup postings (turn to Section 7.4. Using
    Messenger to Read News to learn how to set up your news preferences).


    You can start Messenger in the following ways:


    +   - Select Communicator => Messenger from the menu.


    +   - Press [Alt]-[2]'
