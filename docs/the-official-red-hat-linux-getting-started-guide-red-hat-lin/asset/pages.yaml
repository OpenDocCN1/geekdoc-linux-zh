    # 15.10 Tips on Using Command History


    # 15.10.1 Q: Tips and Tricks for history


    What are some other ways I can use command history?


    # 15.10.2 A: Using More Command History


    If you type history, you''ll see a numbered list flash by, showing the previous
    500 commands you''d used.


    You probably don''t need to see all of the last 500 commands, so the command history20
    might be more useful -- where 20 is the previous 20 commands you''d typed. (You
    can use any number to reveal a specific number of previous commands).


    # Other Shortcuts


    Here are other command history shortcuts which may come in handy for you:


    +   "Bang, bang, bang": Typing !! (called "bang bang") executes the last command
    in the history.


    +   "Bang number": Typing !number (as in !302) will execute the command which
    is numbered 302 in the history file.


    +   "Bang string": Typing !string (as in !rpm) will execute a command with that
    matching string from the history file.'
