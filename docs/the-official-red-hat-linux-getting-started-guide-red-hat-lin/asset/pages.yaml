    In the last set, we can see that those who aren''t either the newuser or in the
    group called newuser can read the file, but can''t write to it or execute it.


    We can use the chmod command to change a file''s permissions.


    Let''s work a bit more on sneakers.txt to change the permissions with the chmod
    command.


    The original file looks like this, with its initial permissions settings:


    ```

    -rw-rw-r-- 1 newuser newuser 150 Mar 19 08:08 sneakers.txt

    ```


    As long as we''re the owner of the file -- we''re logged into the root account
    -- we can change permissions in any combination of settings for the owner, group
    and others.


    Right now, the owner (that''s us) and our group (which is newuser) can read and
    write to the file.


    Anyone outside of our group -- for example can only read the file (r--).


    > CAUTION Remember that file permissions are a security feature. Whenever you
    allow everyone to read, write to and execute files, you may be increasing your
    risk of tampering. As a rule, then, you should shy away from allowing everyone
    to read and write to a file.


    In this case, however, let''s say that we want to allow everyone to write to the
    file, so they can read it, write notes in it and save it. That means we''ll have
    to change the change "others" section of the file permissions.'
