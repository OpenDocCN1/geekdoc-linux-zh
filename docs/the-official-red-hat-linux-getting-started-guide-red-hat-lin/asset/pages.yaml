    Usenet. Comprised of newsgroups, Usenet is used to exchange information, gossip,
    and more.³


    To read newsgroups, you''ll need a news reader. One such news reader is Messenger,
    which lets you read and post to newsgroups similar to the way you work with e-mail.


    > ³ If you haven''t used Usenet before, you should be aware that newsgroups can
    contain information and material that might be offensive to you. Be cautious about
    which newsgroups you subscribe to.'
