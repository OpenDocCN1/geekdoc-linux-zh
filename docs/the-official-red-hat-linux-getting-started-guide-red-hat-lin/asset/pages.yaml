  md: '# # Section 13.12:Ownership and Permissions


    That was one demonstration of Linux''s security features. Linux, like UNIX, is
    a multi-user system, and file permissions are one way the system uses to protect
    against any type of tampering -- malicious or accidental.


    One way to gain entry when we see''re denied permission is to su to root, as we
    learned earlier. That''s because whoever knows the root password has to complete
    access.


    ```

    [newuser@localhost newuser]$ su

    Password: your root password

    [root@localhost newuser]# cd /root

    [root@localhost /root]#

    ```


    But switching to superuser is not always convenient -- smart, since it''s so easy
    to mistakenly mess up important configuration files.


    All files and directories are "owned" by the person who created them. We created
    the file sneakers.txt in our login directory, so sneakers. txt "belongs" to us.


    That means, we can specify who''s allowed to read the file, write to the file,
    or if it''s an application instead of a text file, who can execute the file.


    Reading, writing and executing are the three main settings in permissions.


    Since every user on the system is placed into a group when that user is created,
    then we can also specify certain groups can read, write to, or execute our file.


    Let''s take a closer look at sneakers.txt with the ls command using the -l (long)
    option (see Figure 13–16, Permissions for sneakers.txt).


    ```

    [newuser@localhost newuser]$ ls -l sneakers.txt

    -rw-rw-r-- 1 newuser newuser 150 Mar 19 01:08:08 sneakers.txt

    ```


    There''s quite a bit of detail here. We can see who can read (r) and write to
    (w) the file, as well as who created the file (newuser) and to which group the
    owner belongs (newuser).'
  merge: -1
  pgno: 272
