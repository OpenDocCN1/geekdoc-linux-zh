    # What is SMTP?


    SMTP stands for Simple Mail Transfer Protocol, a protocol designed for the transfer
    of e-mail messages.


    The option to Use Secure Socket Layer refers to encryption technology. For more
    information about security issues, refer to Netscape''s online help guide.


    You can specify where you want your mail to be stored by either typing in the
    location in Local mail directory, or by clicking on the Choose button, and selecting
    a directory in the navigation window which opens. By default, mail will be stored
    in a directory in your user directory; if your name is newuser, for example, the
    path to the directory will be /home/newuser/nsmail.


    Unless you have a specific reason to choose a different directory, however, you
    can allow the default selection.'
