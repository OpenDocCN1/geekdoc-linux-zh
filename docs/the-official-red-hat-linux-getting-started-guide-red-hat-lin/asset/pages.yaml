  md: '# A Glossary


    Alpha


    A RISC (Reduced Instruction Set Computer) architecture developed by Digital Equipment
    Corporation.


    ATAPI


    An abbreviation for AT Attachment Packet Interface. ATAPI is the protocol by which
    CD-ROM drives communicate with a computer system over an IDE interface.


    Binary


    Although the base two-numbering system used by computers is known as binary, the
    word often refers to the executable form of a program. Contrast with "source code."


    BIOS


    An abbreviation for Basic Input/Output System. On PC-compatible systems, the BIOS
    is used to perform all necessary functions to properly initialize the system''s
    hardware when power is first applied. The BIOS also controls the boot process,
    provides low-level input/output routines (hence its name) and (usually) allows
    the user to modify details of the system''s hardware configuration.


    Boot


    Short for "bootstrap." The process by which a computer starts running an operating
    system when power is applied.


    Boot Disk


    A diskette used to start many Red Hat Linux installations.


    Bootstrap


    See "Boot."'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# CISC


    An abbreviation for Complex Instruction Set Computer. A design philosophy for
    computers whereby the processor is designed to execute a relatively large number
    of different instructions, each taking a different amount of time to execute (depending
    on the complexity of the instruction). Contrast with RISC.


    # CMOS


    Originally an abbreviation for Complementary Metal Oxide Semiconductor -- a semiconductor
    technology used in many integrated circuits. Now often used to describe the low-level
    hardware that contains a personal computer’s BIOS setting, and the computer’s
    hardware clock.


    # Cylinder


    When referring to disk drives, the number of different positions the disk drive''s
    read/write heads can take over the unit''s disk platters. When viewed from above
    the platters, each head position describes an imaginary circle of different diameters
    on the platter''s surface, but when viewed from the side, these circles can be
    thought of as a series of cylinders nested within each other, hence the term.
    See also Geometry.


    # Daemon


    A daemon is a program that runs, without human intervention, to accomplish a given
    task. For example, `lpd` is a daemon that controls the flow of print jobs to a
    printer.


    # Dependencies


    When referring to packages, dependencies are requirements that exist between packages.
    For example, package `foo` may require files that are installed by package `bar`.
    In this example, `bar` must be installed, or else `foo` will have unresolved dependencies.
    RPM will not normally allow packages with unresolved dependencies to be installed.


    # Device Driver


    Software that controls a device that is connected to, or part of, a computer.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Disk Drive


    See Hard Disk.


    # Disk Druid


    Disk Druid is a component of the Red Hat Linux installation program that is used
    to partition disk drives during the installation process.


    # Diskette


    A small mass storage device in a removable cartridge, meant to be read/written
    to, in a compatible drive.


    # Distribution


    An operating system (usually Linux) that has been packaged so as to be easily
    installed.


    # Domain Name


    # Driver


    See Device Driver.


    # Dual Boot


    The act of configuring a computer system to boot more than one operating system.
    The name is something of a misnomer, as it is possible to boot more than the two
    operating systems the word "dual" implies.


    # EIDE


    An abbreviation for Enhanced Integrated Drive Electronics, which is a newer version
    of the IDE interface standard and another term for a particular implementation
    for IDE interfaces. EIDE makes larger and faster disk drives possible; most systems
    today use EIDE.'
  merge: -1
  pgno: 334
