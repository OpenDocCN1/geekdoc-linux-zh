  md: '# Chapter 9:File Managers in GNOME and KDE


    a + next to them indicate that they hold subdirectories and the view is collapsed;
    click on the + to expand the view and reveal the subdirectories.


    Use the following buttons on the menu above the Location bar to determine the
    detail of view you want:


    +   - Icons -- The default view. Displays icons to represent each file and directory
    type.

    - Brief -- Shows directories and files in a list, with directories at the top.

    - Detailed -- Shows a list, along with details such as the size and modification
    time of the files.

    - Custom -- Shows a customized detailed list (you can select items you want to
    include from the Settings menu, => Custom View).


    # Change the order


    If you view directory contents in one of the list choices, you can arrange your
    view of the list by clicking on one of the list headings. For example, if you
    want to see the contents alphabetically, click on the Name heading.


    # Navigation


    Like many file managers, you can move around by using the scrollbar next to the
    tree view to locate a directory you want to move to.


    You can also use the navigation buttons above the Location bar similar to the
    way you would use the navigation buttons in Netscape Navigator:


    +   - Back and Forward -- Move you up or down through the directory listing history

    - Up -- Moves you "up" the directory tree

    - Rescan -- Refreshes the view of the current directory

    - Home -- Lets you jump back to your default directory'
