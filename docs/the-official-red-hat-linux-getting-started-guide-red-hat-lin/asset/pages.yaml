- img_proc: true
  md: '# 13 You Are Here


    Let''s say you want to buy a pair of sneakers at a nearby shopping mall. You may
    not be familiar with the mall, but that shouldn''t be a problem.


    Why not? Because of the maps, which you can usually find near all the major entrances
    to the mall.


    The same can be said for your Red Hat Linux system: Navigation''s easy once you
    know where you''re going.


    # Make sure you unless you''re in your user account


    > Remember that unless you like to live on the wild - and dangerous - side, using
    a root account for all your activities is tempting with disaster. If you didn''t
    create your user account at the time of your Red Hat Linux installation and haven''t
    done so now, please do so now. Turn to Section 1.1.1, Create a User Account if
    you require assistance on how to create your user account.


    # 13.1 Finding Yourself with pwd


    Sooner or later (probably sooner), when you start looking through directories,
    you''re bound to ask, "Where the heck am I?" And you won''t be speaking philosophically.
    DOS can answer question just by showing you at the prompt like:


    ```

    C:\GAMES\Game\ID1>

    ```


    But Bash, the shell for your Linux system shows, by default, just shows your current
    directory.'
  merge: -1
  pgno: 238
- img_proc: true
  md: '# Figure 13–1 The Command pwd Shows You Where You Are


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_239_0.png)


    Try this: open an Xterm window. You''ll see something like:

    [newuser@localhost newuser]$


    Now type:

    pwd


    What do you see? Something like

    /home/newuser


    The command pwd stands for print working directory. When you typed pwd, you were
    asking your Linux system, "where am I?" Your system responded by "printing" the
    directory you''re in to the monitor -- also known as the standard output.


    Seems easy, right? It ought to be; you''ll be using pwd plenty as you look around.
    (Even Linux gurus can depend on this little command.)


    # 13.2 Getting from Here to There: cd


    Whenever you want to change directories, all you''ve got to do is type:

    cd


    Go ahead, try it in an Xterm window.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Section 13.2:Getting from Here to There: cd


    That didn’t do much, did it? That’s because you didn’t tell your system where
    you wanted to go.


    Whether you’re going to a store in a mall or to visit relatives across the country,
    you’ve got to know how to get from one point to another. That is, you’ll need
    to know the path to follow.


    As with anything in life, the path -- or, pathname -- is basically the set of
    directions that takes you from one point to another. In the case of your Linux
    system (and in the DOS/Windows world, as well), you state a path to take you from
    one directory to another.


    Let’s try it again. Open an Xterm window. Find yourself first with the `pwd` command.
    When you type your commands, your window will look like:


    ```

    [user@localhost newuser]$ pwd

    /home/newuser

    [user@localhost newuser]$

    ```


    Now that you see where you are, you can start to give your system the path to
    follow.


    Well, almost...


    Try typing:


    ```

    cd home

    ```


    It means your path is incomplete.


    Try typing:


    ```

    cd /home

    ```


    Now you’ve successfully changed directories and moved from your login directory
    into the subdirectory called home.'
  merge: -1
  pgno: 240
- img_proc: true
  md: "# Figure 13–2 Absolute Pathnames State Full Path\n\n```\n```Terminal\nFile\
