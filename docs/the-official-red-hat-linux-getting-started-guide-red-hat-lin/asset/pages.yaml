- img_proc: true
  md: '# Section 9.1:The GNOME File Manager


    # 9 File Managers in GNOME and KDE


    In both GNOME and KDE, the file managers are true workhorses. Use these powerful
    applications to help you create, edit, and delete, files and directories, as well
    as accomplish other tasks throughout your system.


    Both file managers support drag and drop, and provide you with a fast and easy
    way to "see" your system. Either file manager will open in your login directory
    by default. To view other directories on your system, click on the "file folder"
    representing the directory in the tree view on the left of the file manager. The
    contents of the folder will appear in the directory window, the pane on the right.


    # Do you have permission?


    Unless you''re root, you won''t be able to gain access to all the files and directories
    on your system. If you don''t have the permission to open, delete or execute a
    file, you''ll receive an error message that your access is denied.


    This chapter will provide an overview of GMC and KFM, the file managers for GNOME
    and KDE. To learn more details about using them, read the GNOME User''s Guide
    or the KDE user''s documentation in their respective help browsers. You''ll also
    be able to find the latest documentation at their websites: http://www.gnome.org
    and http://www.kde.org.


    # 9.1 The GNOME File Manager


    Fast, friendly and flexible, the GNOME File Manager lets you easily browse and
    work with files and directories. The proper name for the file manager is GNU Midnight
    Commander, or GMC, because it''s based on the Midnight Commander file manager.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# 9.1.1 Using the File Manager


    There are two ways to easily start GMC:


    +   - From the Main Menu Button -- Click on File Manager entry.

    - From the desktop -- Double-click on the file folder labeled Home directory,
