  md: '# 2.6 Finding Help


    The GNOME Help Browser (see Figure 2–7, The GNOME Help Browser) is one of the
    more useful utilities at your command.


    In fact, since this application displays not only GNOME-related help but also
    **info pages** and **man pages**, the GNOME Help Browser can be an invaluable
    resource for learning about both GNOME and your Red Hat Linux system. (Info pages
    and man pages are concise help documents which are usually installed on a Linux
    system. Help documents are covered more extensively in Chapter 12, Shell Prompt
    Basics.)


    Figure 2–7 The GNOME Help Browser


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_42_0.png)


    You can open the GNOME Help Browser by double-clicking on its launcher on the
    desktop or from the **Panel** by dragging your cursor to the item **Help System**
    on the **Main Menu Button**.'
  merge: -1
