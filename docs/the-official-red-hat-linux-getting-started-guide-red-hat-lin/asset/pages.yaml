  md: '# The Login Script Tab


    The Login Script tab allows you to specify how you want to login to your ISP (see
    Figure 6–22, The Login Script Dialog). If you chose to use a script-based login
    in the Authentication procedure of the Dial tab, you can enter that script here.


    # Figure 6–22 The Login Script Dialog


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_117_0.png)


    Not all ISPs require a script-based login procedure; you should check with your
    ISP to find out specific entries which might be necessary in a login script.


    A login script helps your machine negotiate a successful connection with your
    ISP. Your machine expects a string of information from your ISP, then sends a
    string of information or prompts. In this way, your machine shakes hands with
    your ISP.


    In the Login Script tab, use the drop-down list at the left of the dialog to create
    a series of steps you want your machine to follow when you log in to your ISP.
    You can select a variety of options to create your script, step by step. In the
    window to the right of the drop-down list, type in the specific information you
    want to supply with the drop-down list.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Section 6.2:Connecting with Kppp


    Click the Add button to add your step. If you must modify your script, you can
    choose an option, supply the information and use the insert button to place it
    in the script, rather than having to recreate the script from scratch.


    You can also remove a step in your script by highlighting the entry and clicking
    the Remove button.


    If you have difficulty connecting to your ISP after you configure Kppp, check
    the option Show Log Window on the main Kppp dialog. The log window will open when
    you try to connect to your ISP, showing what your ISP is expecting and what your
    machine is sending.


    In Figure 6–22, The Login Script Dialog, for example, the login script is for
    an ISP which sends a prompt for the login ID, then for the password and, after
    a brief pause, requires that a user send the string ppp. The script looks like:


    # Table 6–1 A Sample Login Script


    | Option | Enter | Purpose |

    | --- | --- | --- |

    | Expect | ID: | Wait for the ID: login prompt from the server |

    | Send | mylogin | Send your login name for the account |

    | Expect | word: | Wait for the password prompt from the server |

    | Send | mypass-word | Send the account’s password |

    | Expect | welcome to yourisp | Wait for the welcome message from the server |

    | Pause | 3 | Specifies a pause of 3 seconds (a value for Pause will be in seconds,
    by default) |'
