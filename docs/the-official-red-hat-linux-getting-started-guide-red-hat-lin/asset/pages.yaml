  md: '# Section 14.2:Locating Files and Directories


    That’s the idea behind environment variables.

    As long as your assistant has the right pointers, he’ll fulfill your commands
    quickly.

    Let’s take a look at our environment variables. At the shell prompt, type:


    ```

    env

    ```


    Quite a few "shortcuts" bash uses, aren’t they?

    Each one of these helps bash customize the environment for you.

    Among the most important environment variables is the PATH environment variable

    -- defines what is known as the default path.

    The PATH environment variable for our account newer might look something like
    this:


    ```

    PATH=/usr/local:/bin:/usr/X11R6/bin:/usr/bin:/usr/X11R6/bin:/home/newer/bin

    ```


    It looks crowded, but the PATH statement is a great signpost, which points to
    where

    programs can be found.


    # A standard for the PATH


    > Remember the earlier reference to the Filesystem Hierarchy Standard (see Section
    13.4, A Larger Picture of the Filesystem)? The PATH statement is set according
    to that standard, and programs are installed in directories in accordance with
    the FHS as well. The result is that the PATH statement will enable bash to automatically
    find nearly any program, as-summing it has been installed in accordance with FHS.


    # 14.2 Locating Files and Directories


    There will be times when we know a file or directory exists but we won’t know
    where

    to find it. Searching for a file or directory can be easier with the locate command.'
