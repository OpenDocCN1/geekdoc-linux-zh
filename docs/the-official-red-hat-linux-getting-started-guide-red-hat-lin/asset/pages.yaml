    +   u -- the user who owns the file (that is, the owner)

    g-- the group to which the user belongs

    o-- others (not the owner or the owner''s group)

    a-- everyone (u, g, and o)


    # 13.12 Permissions


    +   r -- read access

    w -- write access

    x -- execute access


    # 13.12 Actions


    +   + -- adds the permission

    -- removes the permission

    -- makes it the only permission'
