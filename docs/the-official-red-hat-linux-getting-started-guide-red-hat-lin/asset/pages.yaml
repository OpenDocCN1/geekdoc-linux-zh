  md: '# # 10 Using Gnome-RPM and RPM


    # ## 10.1 The benefits of RPM


    RPM stands for RPM Package Manager. At its heart, RPM is one of the most convenient
    technologies available for Red Hat Linux. That convenience extend beyond the user;
    Red Hat encourages other vendors to consider the ease of use behind the RPM system
    for their own products (the system may be distributed under terms of the GPL).


    Want to install or remove an application? No problem. Upgrade an application you
    already have? It''s easy. By typing a few simple commands or pressing a few buttons,
    the process will be taken care of you.


    RPM also features useful tools to view the contents of a package, as well as other
    essential file and system maintenance features.


    From its earliest days, RPM was intended to be an easy and secure way to get packages
    on an off an a user''s system. Often, the only requirement to installing an RPM
    package -- sometimes referred to as a pre-compiled binary if it''s an application
    -- is that you''re root and that you press the right buttons!


    You can choose to work with RPM packages from a graphical front-end or the shell
    prompt. Gnome-RPM, which was introduced in Red Hat Linux 6.0, is a graphical RPM
    tool. An alternative to Gnome-RPM are various RPM commands you can issue from
    the shell prompt in an Xterm.


    This chapter will cover some of the basic features of RPM use from Gnome-RPM and
    from the shell prompt. For more in-depth information, about both Gnome-RPM and
    RPM technology, refer to the related chapters in the Official Red Hat Linux Reference
    Guide.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# Chapter 10:Using Gnome-RPM and RPM


    # You must be root


    Because RPM makes changes to your system, for most functions you must be root
    in order to use RPM from either the shell prompt or through Gnome-RPM.


    # 10.1.1 Changing to Root


    Changing to root can be easily accomplished from within your user account.


    You can temporarily switch from your user account to root by using the su command.
    Once you''re root, you can install, delete and work with packages per perform
    maintenance on system files.


    Remember, however, that when you''re root you can inadvertently damage your system,
    so use caution!


    Just type su at the shell prompt. You''ll see something like this:


    ```

    [you@localhost]$su

    Password: yourrootpassword

    [root@localhost]#

    ```


    Now that you''re root, you can start Gnome-RPM or perform your RPM command from
    the shell prompt.


    # 10.2 Using Gnome-RPM


    Gnome-RPM was written by James Henstridge (james@daa.com.au); RPM 3.0 support
    was written by Red Hat and additional rpmfind code was written by Daniel Veillard.
    Gnome-RPM is a fast, convenient tool for working with RPMs; with such features
    as Web find, it''s also a powerful utility which allows you to easily search for
    new RPMs on the Internet.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Section 10.2:Using Gnome-RPM


    You can start Gnome-RPM (which is also referred to as gnorpm) from the shell prompt
    in your user account, and from both the shell prompt and the GNOME Panel if you
    have logged in as root (rather than performing an su from your user account).


    To start Gnome-RPM from the shell prompt, go to the Main Menu Button => System
    => Gnome-RPM.


    To start Gnome-RPM from the shell prompt, type gnorpm. When the application starts,
    you''ll see a window similar to Figure 10–1, Main Gnome-RPM Window.


