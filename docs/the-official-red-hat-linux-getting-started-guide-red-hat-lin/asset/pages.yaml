    - -p <packagefile> queries the package <packagefile>.


    There are a number of ways to specify what information to display about queried
    packages. The following options are used to select the type of information for
    which you are searching. These are called Information Selection Options.


    +   - -i displays package information such as name, description, release, size,
    build date, install date, vendor, and other miscellaneous information.

    - -l displays the list of files that the package "owns".

    - -s displays the state of all the files in the package.

    - -d displays a list of files marked as documentation (man pages, info pages,
    README''s, etc).

    - -c displays a list of files marked as configuration files. These are the files
    you change after installation to adapt the package to your system (sendmail.cf,
    passwd, inittab, etc).


    For those options that display file lists, you can add -v to your command line
    to get the lists in a familiar ls -l format.


    # 10.6.7 Verifying


    Verifying a package compares information about files installed from a package
    with the same information from the original package. Among other things, verifying
    compares size, MD5 sum, permissions, type and group of each file.


    The command rpm -V verifies a package. You can use any of the Package Selection
    Options listed for querying to specify the packages you wish to verify. A simple
    use is rpm -V foo which verifies all the files in the foo package are as they
    were when they were originally installed. For example:'
  merge: -1
  pgno: 212
- img_proc: true
  md: '+   * To verify a package containing particular file:

    ```

    rpm -Vf /bin/vi

    ```


    +   * To verify ALL installed packages:

    ```

    rpm -Va

    ```


    +   * To verify an installed package against an RPM package file:

    ```

    rpm -Vp foo-1.0-1.i386.rpm

    ```


    This can be useful if you suspect that your RPM databases are corrupt.

    If everything verified proper properly there will be no output. If there are any
    discrepancies they will be displayed. The format of the output is a string of
    8 characters, a possible "c" denoting a configuration file, and then the file
    name. Each of the 8 characters denotes the result of a comparison of one attribute
    of the file to the value of that attribute recorded in the RPM database. A single
    "." (period) means the test passed. The following characters denote failure of
    certain tests:


    +   * 5 -- MD5 checksum

    * S -- File size

    * L -- Symbolic link

    * T -- File modification time

    * D -- Device

    * U -- User

    * G -- Group

    * M -- Mode (includes permissions and file type)'
  merge: -1
