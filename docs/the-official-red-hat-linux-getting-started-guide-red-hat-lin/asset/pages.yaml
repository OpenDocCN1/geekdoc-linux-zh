  md: '# Section 2.4:The Panel


    # What is the file manager?


    The file manager is actually an application GNU Midnight Commander, or GMC. GMC
    GNOME’s version of the popular Midnight Commander file manager. You can learn
    more about the File Manager in Section 9.4, The GNOME File Manager or from the
    GNOME User’s Guide at the GNOME website.


    # 2.4 The Panel


    Like much of GNOME, the Panel is highly configurable (see Figure 2–4, The Panel
    at the Bottom of the Desktop).


    From the Panel, you can launch applications and applets, small applications and
    utilities which are meant to be docked into the panel. Among the applets already
    running on the Panel are the GNOME Pager and clock applet.


    Like KDE, you can hide the Panel by clicking on one of the arrows at either of
    its borders. You can also auto-hide the Panel, making it appear to sink beneath
    the frame of your screen (it will return when you hold your cursor over the minimized
    space). To enable the auto-hide feature, right-click on the Panel, select This
    panel properties and choose Auto hide in the Minimize options section.


    # Elements of the GNOME Pager


    The GNOME Pager consists of the Desk Guide, which is a visual representation of
    your desktops, and the Tasklist, which shows your running applications -- either
    minimized or opened on the desktop.


    For more on the Desk Guide and GNOME Pager, see Section 2.7, Multiple Desktops.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 38 Chapter 2:GNOME in 60 Seconds (or so)


    Other applets which can enhance productivity and enjoyment range from a mail checker
    and a CD player to system monitors. Applications, folders and applets can be docked
    on the Panel, so that they can be launched with a single click of the button.


    # Figure 2-4 The Panel at the Bottom of the Desktop


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_39_0.png)


    To add an applet:


    +   - Right-click on the Panel;

    - Drag your cursor to the Add applet menu;

    - Select an applet from within the listed categories.


    You can also customize the Panel, add more than one Panel to your desktop, or
    convert the current orientation of the Panel from horizontal to vertical. By clicking
    on the arrows which appear at either end, you can "shrink" the Panel to appear
    in a corner of the Desktop, rather than extend across the screen (as in Figure
    2–4, The Panel at the Bottom of the Desktop).'
