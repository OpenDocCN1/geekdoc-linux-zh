    # 10.5.3 Uninstalling Packages


    Uninstalling a package removes the application and associated files from your
    machine. When a package is uninstalled, all files it that are not needed by other
    packages on your system are also removed. Changed configuration files are copied
    to <filename>.rpmsave so you can reuse them later.


    > Make sure you''re root


    > Remember that you must be root to uninstall packages.'
