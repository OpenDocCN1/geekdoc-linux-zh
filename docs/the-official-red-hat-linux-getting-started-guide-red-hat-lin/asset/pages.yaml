  md: '# # Getting Online


    Normally, PPP accounts are used to dial in to an Internet Service Provider (ISP).
    Using PPP, which stands for Point-to-Point Protocol, you connect to a large network
    (the Internet) through your ISP; your machine becomes a part of that network and
    you use the resources of the network.


    Both GNOME and KDE offer useful tools for establishing and modifying PPP accounts
    to ISPs. These utilities remove much of the guesswork in creating an online connection;
    similarly, your only requirement is a valid Internet account.


    The utilities -- RP3 for GNOME and Kppp for KDE -- can be interchangeable, too.
    You can use RP3 to set up and connect in KDE; similarly, you can use Kppp if you
    use GNOME.


    If you use RP3 or Kppp outside of their respective environments, however, you
    will lose the ability to dock the running applications. That means you won''t
    be able to integrate RP3 into the KDE Panel, for example -- or Kppp in the GNOME
    Panel. When they are docked on their Panels, both utilities provide information
    about your connection, such as connection time, speed of the connection and more.
    You will be able to minimize these utilities on the Panel, however.


    Note, also, if you create an account in GNOME with RP3, but would rather use Kppp,
    you''ll have to set up your account again in that application; in other words,
    information you enter in one application won''t be available to the other application.


    > You must be root

    Because you''ll be making changes to your system, you must be root in order to
    create a PPP account. If you''re in your user account, you will be asked for your
    root password before proceeding in either RP3 or Kppp.


    Your own ISP may have specific connection requirements for their service which
    differ from the instructions in this chapter. Before connecting with either of
    these tools,'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'check first with your ISP for any specific instructions that they provide,
    including the following information:


    +   * The phone number that your machine must dial into at your ISP.


    +   * Your login name and password for the Internet account.


    +   * Possible gateway address: Some ISPs may require you to specifically type
    in the address for the ISP''s gateway.


    +   * DNS entries: DNS means Domain Name Service. The DNS tracks IP (Internet
    Protocol) addresses; each computer connected to the Internet must have an IP address,
    which is a unique set of numbers like 2xx.2xx.2x2. You may receive one or more
    DNS entries from your ISP when you sign up. Both RP3 and Kppp provide spaces for
    you to enter these numbers.


    # 6.1 Using RP3 to Connect


    RP3, the Red Hat PPP Dialer utility, can make easy work of connecting to the Internet
    or to some other network devices. You can then view statistics about the connection,
    such as the time, speed and cost of the current connection.


    You can start RP3 by going to the GNOME Main Menu Button => Panel => Add applet
    => Network => RH PPP Dialer (see Figure 6–1, Adding RP3 to the Panel). The application
    will then dock into the Panel and remain there until you remove it (by right-clicking
    on the docked application and selecting Remove from panel).'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Section 6.1:Using RP3 to Connect


    # Figure 6–1 Adding RP3 to the Panel


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_94_0.png)


    Another way to start the application and dock it into the Panel is to right-click
    on the Panel, then go to Add applet => Network => RH PPP Dialer.


    You can also launch RP3 -- without docking into the Panel -- from either the Gnome
    Panel (by going to Internet => RH PPP Dialer) or from the shell prompt, typing
    /usr/bin/rp3 in an Xterm window.


    To see all of your user-controllable network devices, such as modem and Ethernet
    cards, from the Main Menu Button to go to internet => RH Network Monitor. Similar
    to the two previous methods, the application will appear on the desktop, rather
    than docking onto the Panel.


    RP3''s Dialup Configuration Tool dialog (see Figure 6–2, Finding the Dialup Configuration
    Tool on the Menu) allows you to easily configure your system for an Internet connection,
    helping you to locate your modem, enter the account information and connect.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '# Figure 6–2 Finding the Dialup Configuration Tool on the Menu


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_95_0.png)


    # 6.1.1 Creating a New Internet Account


    To create a new PPP account, start RP3. Go to Main Menu => Internet => Dialup
    Configuration Tool.


    Next, type your root password when you’re prompted and click the OK button to
    continue to the opening screen for the Add New Internet Connection tool.


    If you don’t already have devices configured, you’ll see the Add New Internet
    Connection dialog (see Figure 6–3, The Add New Internet Connection dialog).'
