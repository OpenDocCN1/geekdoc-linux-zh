- img_proc: true
  md: 'Also called Ljet Tool, the utility can allow you to modify your printer settings
    for all KDE-compliant applications. Ljet Tool can be used by regular users; not
    just by root user.


    # Possible conflicts


    Ljet Tool is best suited for Hewlett-Packard LaserJet and compatible printers.
    The utility uses PCL, the same printer control language to control options used
    by Hewlett-Packard. If your printer isn''t a Hewlett-Packard LaserJet or PCL-compatible
    printer, you may experience problems if you try to use Ljet.


    # 5.2.2 Starting Ljet Tool


    You can start Ljet from the Panel or from the shell prompt.


    To start the utility from the shell prompt, open an Xterm window and, at the prompt,
    type kljjettool.


    To start Ljet from the Panel, go to the Utilities menu, then go to to HP LaserJet
    Control Panel (see Figure 5–9. Starting Ljet from the Panel for an example).'
