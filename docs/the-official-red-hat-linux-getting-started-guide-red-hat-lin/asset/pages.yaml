  md: '# Section 10.4:Basic Configuration


    +   - **No reordering** - This option is useful if RPM is unable to change the
    installation order of some packages to satisfy dependencies.


    +   - **Don''t run scripts** - Pre- and post-install scripts are sequences of
    commands that are sometimes included in packages to assist with installation.
    This check box is similar to the `--noscripts` option when installing from the
    shell prompt.


    Under Upgrade Options, you can select the following:


    +   - **Allow replacement of packages** - Replaces a package with a new copy of
    itself. This option can be useful if an already-installed package has become damaged
    or may require other repair to function correctly.


    +   - **Allow replacement of files** - Allows the replacement of files which are
    owned by another package. This option can be useful when there are two packages
    with the same file name but different contents.


    +   - **Allow upgrade to old version** - This option allows you to "upgrade" to
    an earlier package -- useful if the latest version of an installed package doesn''t
    correctly function for your system.


    +   - **Keep packages made obsolete** - Prevents packages listed in an Obsoletes
    header from being removed.


    In Other Options, you can select:


    +   - **Don''t install documentation** - Selecting this option can save on disk
    space by excluding documentation related to the package. Unless you know what
    you''re doing, however, you''re safest having the documentation which is included
    with an application, in case you require help with its features.


    +   - **Install all files** - Installs all files in the package.


    The choices available in Database Options and Architecture Options allow you to
    decide, among other things, whether you want to perform a "test" installation
    (which will'
