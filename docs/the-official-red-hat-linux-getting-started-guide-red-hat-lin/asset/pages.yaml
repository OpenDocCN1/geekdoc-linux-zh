  md: '# Be aware of formatting


    If you place a floppy diskette in the drive, then select the floppy drive on your
    desktop, you may receive an error message as "wrong fs type, bad option, bad superblock
    on /dev/fd0..."


    Chances are good that the floppy you''ve placed in the drive is not formatted
    with the ext2 filesystem -- the Linux filesystem format -- rather another filesystem
    format, such as MS-DOS. For more information about how to access an MS-DOS formatted
    diskette, as well as an ext2 filesystem, see Section 15.2, Using a Diskette.


    When you right-click on the drives, you will see several options for working with
    these drives, such as Delete and Move to Trash, which will remove the icon from
    your desktop (and which you probably won''t want to do); Copy, which allows you
    to copy the icon to another location: Open with, which you should probably avoid
    for now; and Mount.


    # "Mounting" a device


    Ordinarily, you''ll be able to use your drives just by clicking on them. In UNIX
    and Linux, however, that''s not always the case: you''ve often got to mount the
    drives. When you mount a floppy or CD-ROM, you''re making that device''s contents
    available to you. Note, however, whenever you mount a drive, you must also unmount
    the drive when you''re finished.


    The Trash is where you can drag and drop your unwanted items. Right-click on the
    trashcan and select Empty Trash Bin to delete the items from your system.'
