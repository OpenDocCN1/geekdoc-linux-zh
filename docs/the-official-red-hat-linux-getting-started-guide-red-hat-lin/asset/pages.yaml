    # 5.2 Printing Utilities in KDE and GNOME


    Once you''ve configured your printer, you''ll find KDE and GNOME provide utilities
    to help you monitor and modify printer settings and printing jobs.


    # 5.2.1 Using Ljet Tool in KDE


    In KDE, Ljet Tool can help you configure a Hewlett-Packard LaserJet printer in
