    # 15.8 Find Some Commands Previously Used Commands


    # 15.8.1 Q: Locating Commands


    I was looking at a man page yesterday, but I can''t remember the name of the command
    I was reading about, and I didn''t write it down. How do I get the man page back?


    # 15.8.2 A: Searching .bash_history


    Chances are good the command you used is stored away in a file called .bash_history.
    By default, this file stores away the last 500 commands you typed at the shell
    prompt.


    You can glimpse the history of your commands by typing history at the shell prompt
    -- but the results will speed by quickly.'
