    press [Space]; to quit, press [Q].


    Figure 13-15 Piping Output of ls | less


    ```

    Terminal

    File Edit Settings Help

    [newuser@localhost newuser]$ ls -al /etc | less|

    ```


    Actually, we''ve already been using pipes, before we even discussed what they
    were. In previous references to man pages, we used the following to print man
    page entries: man is | col -b | lpr


    Here, we''re sending the output of man is to a filter called col with an option
    of -b to format the text for the printer, then we sent the output of that to the
    printer using the lpr command.


    # Summary


    Piping allows you to send the output of one command as the input of another command.
    For example: ls -al /etc | more pipes the output of the ls command to the more
    utility for easy viewing.'
