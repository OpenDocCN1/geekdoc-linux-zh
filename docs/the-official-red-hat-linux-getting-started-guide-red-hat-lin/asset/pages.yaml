- img_proc: true
  md: 'you’d find sneakers.txt -- except that as time goes on, there will be more
    text files, and they’ll all show up because they match the pattern you’re searching
    for.


    It helps, to, narrow your search as much as possible.


    One way to narrow that search might be to use the question mark symbol (?). Like
    the asterisk, ? can help locate a file matching a search pattern.


    In this case, though, ? is useful for matching a single character -- so you were
    searching for sneaker?.txt, you’d get sneakers.txt as a result -- and/or sneaker.txt,
    if there were such a filename.


    When an asterisk, for example, just happens to be part of a filename, as might
    be the case if the file sneakers.txt was called sneak*.txt, that’s when regular
    expressions can come in handy.


    Regular expressions are more complex than the straightforward asterisk or question
    mark.


    Using the backslash (\), you can specify that you don’t want to search out everything
    using the asterisk, but you’re instead looking for a file with an asterisk in
    the name.


    If the file is called sneak*.txt, then, type:


    ```

    sneak*.txt

    ```


    Here is a brief list of wildcards and regular expressions:


    +   * -- Matches all characters


    +   ? -- Matches one character in a string (such as sneaker?.txt)


    +   \* Matches the * character


    +   \? Matches the ? character


    +   \) Matches the ) character


    You can also use wildcards for more searching: they can come in handy when you
    want to move and rename files. And regular expressions can help you rename files
    with characters like * and ? in them.


    For more on that, read on.'
  merge: -1
