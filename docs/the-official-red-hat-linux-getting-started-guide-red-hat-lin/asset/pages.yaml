- img_proc: true
  md: '# Chapter 15:Q & A: Quick Answers to Common Questions


    Let''s say you''ve downloaded a setihome client and want to try it out. You follow
    the directions for installing the software. Now you change to the directory in
    which you know the executable can be found (as shown below).


    ```

    cd setihome

    ```


    To start the application now, precede the executable with a " . /" as shown below:


    ```

    ./setihome

    ```


    Briefly, the reason you''ve got to use the . / in order to start the application
    is because the executable was not placed in a directory where your shell knew
    it could be found (such as /usr/bin).


    In such instances, you often have to go into the directory which holds the executable
    and start the application from there. That means you''ll have to tell your shell
    it can find the executable -- stating . / tells bash the executable can be found
    in the "current working directory."


    You can customize your settings so that you won''t be required to use the /, however.
    See the following for more info on how to accomplish this.


    # Editing Your PATH


    If you want to periodically start programs without having to enter a . / before
    the executable, you''ll have to do a little tweaking.


    Basically, you''ll have to add the "current working directory" () to your list
    of directories in your PATH environment variable, letting the shell know that
    it can start applications in whichever directory you''re currently working.


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_313_0.png)


    These instructions are intended only for user accounts. Avoid modifying files
    such as .bash_profile for root, because of the potential security risks.'
  merge: -1
