  md: 'In the POP section:


    +   - Leave messages on server -- Check this option if you don''t want your messages
    be deleted from your mail server when you retrieve them. Messages will remain
    on your machine, and will not be deleted on the server machine. Note that this
    option is unchecked by default; check with your ISP before deciding you want to
