  md: '# 14.5 Copying, Moving and Renaming Files and Directories


    By now, you''ve learned a little about the structure of the filesystem; and you''ve
    learned how to create files and directories.


    But just because you know how to create files and directories doesn''t mean that
    you''re stuck with the changes you''ve made. What if you want to rename and/or
    move files and directories?


    Let''s start with the copy command.


    # 14.5.1 Copying Files


    Like so many Linux features, you have a variety of options from which to choose
    when you want to manipulate files and directories. You can also use wildcards
    when you''re copying, moving, or deleting files and directories.


    Basically, the copy command is not much more complex than typing:


    ```

    cp <source> <destination>

    ```


    so to copy the file sneakers.txt to the directory tigger in your login directory,
    just type:


    ```

    cp sneakers.txt tigger

    ```


    Notice that you also used relative pathnames to copy the file. You can use both
    relative and absolute pathnames with cp. Our login directory is the parent of
    the directory tigger; meaning that tigger is one directory down from ours.


    Read the cp man page (man cp) for a full list of the options available with cp.
    But among the options you can use with cp are:


    +   - i -- interactive. Prompts you to confirm if the file is going to overwrite
    a file in your destination. This is a handy option because it can help prevent
    you from making mistakes.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# Chapter 14:Working with Files and Directories


    +   - r -- recursive. Rather than just copying all the files and directories,
    copies the whole directory tree, subdirectories and all, to another location.

    - -f -- force. Copies without prompting you for confirmation that the file should
    be overwritten. Unless you''re sure you want to force the copy, you probably don''t
    want to make friends with this option now.

    - -v -- verbose. Will show the progress of the files being copied.


    Just by using cp alone, you won''t see much when the command is executed. Using
    an option, such as -i, can make the process a little more useful, because if you
    want to copy a file to a location that already has a file with the same name,
    you''ll be asked first if you really want to overwrite -- the file that''s already
    there.


    # Don''t be too "forceful"


    Remember that among your options is -f (force), which can overwrite files without
    asking you if you''re certain. Make sure, when you use the force option, that
    you really want to overwrite a file.


    Now that we have the file sneakers.txt in the tigger directory, let''s use cp
    -i to copy the file again to the same location.


    ```

    [newuser@localhost newuser]$ cp -i sneakers.txt tigger

    cp: overwrite ''tigger/sneakers.txt''

    ```


    To overwrite the file that''s already there, press [Y] and [Enter]. Don''t want
    to overwrite the file? Now is the time to press [N] and [Enter].


    # 14.5.2 Moving Files


    To move files, use the mv command (man mv), which is similar to the cp command,
    except with mv the file is physically moved from one place to another, instead
    of being duplicated, as with cp.


    Common options available with mv include:'
  merge: -1
