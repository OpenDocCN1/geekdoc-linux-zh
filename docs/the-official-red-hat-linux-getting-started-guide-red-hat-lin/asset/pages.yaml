  md: '# Errata


    Errata is Latin for "Oops."1 When software is found to have bugs, quite often

    the software is fixed, and released as errata. Red Linux is no exception to

    the rule; we have an Errata Web page at http://www.redhat.com/errata.


    # Extended Partition


    A segment of a disk drive that contains other partitions. See Partition.


    # FAQ


    An abbreviation for Frequently Asked Questions. Linux information is often

    presented in the form of lists of questions and answers called FAQs.


    # disk


    disk is a utility program that is used to create, delete or modify partitions
    on a

    disk drive.


    # Filesystem


    A filesystem is the method by which information is stored on disk drives. Dif-

    erent operating systems normally use different filesystems, making it difficult

    to share the contents of a disk drive between two operating systems. How-

    ever, Linux supports multiple filesystems, making it possible, for example,

    read/write a partition dedicated to Windows.


    # Floppy


    A somewhat historical term for a small mass storage device in a removable

    cartridge, meant to be read/written to in a compatible drive. See "diskette".


    # Formatting


    The act of writing a filesystem on a disk drive.


