  md: '# Section 7.2:E-Mail and News Settings for Messenger


    # Creating a Signature


    A signature is a brief note at the end of an e-mail or newsgroup posting. Often
    witty signatures say something about the author of the message.


    To create a signature, do the following, using the text editor Pico:


    +   - Open an Xterm window.

    - At the prompt, type pico signature.txt.

    - In the window which opens, type the text you want for your signature (for example,
    this is a signature from a new user). You can write on more than one line, however
    netiquette frowns upon signatures longer than a line or two.\^1


    +   - Save the file using the [Ctrl]-[X] keys. When you''re asked whether you
    want to save the file, select the [Y] key for "yes".


    Now, you''ll have a new file, called signature.txt, in your directory. The full
    path to the file will be, for example, /home/newuser/signature.txt. When you write
    e-mail or post a message on a newsgroup, the text in signature.txt will automatically
    appear at the bottom of your message.


    # Mail Servers


    In the Mail Servers category, enter the server name through which your mail is
    sent and delivered (see Figure 7–8, The Mail Servers category).


    > \^1 Netiquette means Network Etiquette, conventions of politeness which are
    recognized on the Internet.'
  merge: -1
