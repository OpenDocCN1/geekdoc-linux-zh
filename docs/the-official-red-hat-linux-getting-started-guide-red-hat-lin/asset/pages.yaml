- img_proc: true
  md: '# Chapter 15:Q & A: Quick Answers to Common Questions


    Once you''re root, open an Xterm and type sndconfig at the prompt. This tool will
    help you configure your card for your Red Hat Linux system. To navigate through
    the Yes, No or Cancel buttons on the screens, just use your [Tab] and [Enter]
    keys.


    # Is it supported?


    While many sound cards are supported for Red Hat Linux, not all are completely
    compatible -- or compatible at all. If you''re having trouble configuring your
    sound card, check the Hardware Compatibility List at Red Hat''s website to see
    if your card is supported. You''ll find the list at http://www.redhat.com/hardware.


    With sndconfig, you can probe your system for any cards. If the utility detects
    a plug and play sound card, it will automatically try to configure the correct
    settings by playing sound samples. If you can hear the samples, just select Ok
    when you''re instructed and you''re all set.


    If the probe doesn''t find any cards, you''ll be presented with a list from which
    you can pick your card. Use the up and down arrow keys to scroll through the list.
    If your card is listed, highlight it, then press [Enter] (or [Tab] to the Ok button
    and press [Enter]).


    Your next task will be to select the correct I/O port, IRQ and DMA settings. These
    depend on the jumper settings of the sound card. You can find information about
    these settings in your sound card documentation. If you share your machine with
    Windows, you can also find your sound card''s settings in the Device Manager tab
    in the System section of your Control Panel.


    Once you''ve selected the right settings for your card, you''ll be presented with
    sound samples. If you hear the samples, select OK.


    You''re done. After your card is configured, you''ll return to the shell prompt.
    Just type exit to close the window, then log out of root and back into your user
    account.'
