  md: '# Chapter 3:KDE in 60 Seconds (or so)


    # Dressing it up


    Like so much of KDE, you can customize the look of your desktop, either through
    the use of preferred colors or pictures, or through the use of themes. To learn
    more about themes in KDE, visit the KDE website (http://www.kde.org).


    # 3.2.1 The Trash, Printer, and Drives


