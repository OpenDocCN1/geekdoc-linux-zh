    # 2.3 Folders


    Folders on the desktop can store applications, data such as text files or spreadsheets,
    and other items. Double-clicking on a folder will open it and display its contents.


    Folders have a corresponding locations on your system. Your default desktop includes
    a folder showing the contents of your /home directory (see Figure 2–3, Contents
    of an Open Folder). Although you can specify different ways to view the'
