    When sndconfig doesn''t work -- the sample doesn''t play and you still don''t
    have audio sounds -- there are alternatives, although they''re not quite as simple
    as sndconfig.


    > CAUTION

    The following instructions are not recommended for complete novices.


    First, you will need to know the values for your sound card. If you share machine
    with Windows, you can find your settings in the Device Manager tab in the System
    section of your Control Panel. Under Linux, you must also check the following
    files to make certain that you don''t have any devices using the sound card''s
    resources:


    +   * /proc/pci

    * /proc/interrupts

    * /proc/ioports

    * /proc/dma


    If yours is not a plug and play card, you can manually edit your /etc/conf.modules
    file to include the sound card module that it should use, for example:


    ```

    alias sound sb

    alias midi opl13

    options opl13 io=0x388

    options sb io=0x220 irq=7 dma=0,1 mpu_io=0x300

    ```


    If you do a plug and play card, the configuration is more complex, and may not
    work for all cards.


    If you have already run sndconfig, you should have the file /etc/isapnp.conf.
    When sndconfig was run, the isapnp tools created this template file. This file
    can be hand edited a text editor, such as pico.'
  merge: -1
