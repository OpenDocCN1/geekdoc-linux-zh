  md: '# # 4 Logging Out and Shutting Down


    By now, most computer users know that shutting down their system involves a little
    bit more than just tapping a power switch. The same is true for your Red Hat Linux
    system.


    But just because you''re done working doesn''t mean you must shut down. For example,
    if you''re sharing your computer with another user, you can leave your machine
    running and simply **log out** of your account, which can avoid a time-consuming
    reboot.


    There are similarities and differences to the procedure of logging out and shutting
    down in both GNOME and KDE. Let''s cover the basics first in each environment.


    # ## 4.1 Quitting from GNOME


    When you log out, GNOME allows you to simply log out (and leave the system running),
    restart, or halt the system completely.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Figure 4–1 The GNOME Log Out Confirmation


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_67_0.png)


    To log out from the Main Menu on the Panel, click on the Main Menu Button and
    select Log out.


    In the confirmation dialog which opens (see Figure 4–1, The GNOME Log Out Confirmation),
    you can choose to:


    +   - Logout -- logs you out of your account and returns you to the login screen,
    leaving the system running.

    - Halt -- logs you out of your account and shuts down the system.

    - Reboot -- logs you out of your account and restarts the system.


    Select any of the options and press the Yes button to continue. Also, select the
    Save current setup option if you want to save your session. Saving your session
    will preserve your current configuration of the Panel and save the programs you
    might have open.'
  merge: -1
