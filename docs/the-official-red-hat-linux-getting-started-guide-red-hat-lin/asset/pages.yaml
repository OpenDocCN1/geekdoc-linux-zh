    Double-click on a launcher to start the associated file (see Figure 2–2, Folders
    and Launchers on the Desktop). If it’s an application, it will start; if it’s
    data, that data will be displayed in its associated program (a spreadsheet, for
    example, will open in Gnumeric).


    Launchers can also be shortcuts to websites. By double-clicking on the launcher
    labeled Red Hat Support on your desktop, for example, your Netscape browser will
