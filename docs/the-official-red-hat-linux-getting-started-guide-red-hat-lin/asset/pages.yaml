  md: '# Chapter 7:The Web, E-Mail and News in GNOME and KDE


    # Drag and drop files


    You can drag files from your desktop or from your file manager in the same way
    that you can drag URLs from Navigator. Just hold your mouse button over the file
    you want to attach, and drag it to the attachments field of your letter.


    Have you ever wondered whether your e-mail was actually read, or even received?
    Messenger can send you a return receipt to confirm that your mail arrived and
    was opened.2


    Messenger supports two kinds of return receipts:


    +   - Delivery receipts -- notify that your mail was delivered to the inbox of
    your intended recipient on their mail server


    +   - Read receipts -- notify that the recipient has opened your message


    To specify preferences for return receipts, go to Edit => Preferences => Mail
    & News-groups => Return Receipts. In the dialog which opens (see Figure 7–17,
    The Return Receipts Dialog), choose how you want to use return receipts for mail
    you send and mail you receive.


    2 For return receipts, the recipient''s server must support the Delivery Service
    Notification (DSN) standard. For read receipts, the recipient''s server must support
    the Message Disposition Notification (MDN) standard. So, you may not be able to
    receive return receipts, depending on your recipient''s e-mail client and its
    configuration.'
  merge: -1
