- img_proc: true
  md: '# Chapter 5:Setting Up Your Printer


    # 5.1.1 Selecting Input Filters


    The Configure dialog will look similar to Figure 5–6, Selecting a Filter. Select
    the appropriate filter for your printer. When you select a filter, you''re selecting
    the correct way to convert file formats so that your printer can use them.


    # Figure 5–6 Selecting a Filter


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_79_0.png)


    The filter dialog is divided into several sections:


    +   * **Printer Type**: Lists the available printer models for which you have
    drivers.

    * **Driver Description**: Describes basic information about the driver, as well
    as the types of models for which the driver is appropriate.

    * **Resolution and Paper Size**: Allow you to specify the quality of output to
    the printer, as well as the default paper size in the paper tray.

    * **Color Depth/Unprint Mode**: Allows you to specify additional resolution options
    for a color printer.

    * **Printing Options**: Allows you to modify how jobs are printed.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Section 5.1:Using Printool


    In the Printer Type pane, at left, choose the exact make and model listed for
    your printer. If you can''t find an exact match, try to find the closest match
    to your printer''s make and model.


    If you have questions about which filter may be appropriate for your printer,
    you''ll find information about the driver in the box called Driver Description,
    at the right of the dialog.


    Quite a few makes and models of printers are supported, but not all printers are
    fully supported -- or supported at all. In some cases, printers may require additional
    drivers; in other cases, the printer may be unsupported by Red Hat Linux. Again,
    refer to the Hardware Compatibility List at http://www.redhat.com/corp/support/hardware/
    to verify that your printer is supported under Red Hat Linux.


    If you find the manufacturer of your printer, but not your model number, you can
    check your printer''s documentation to find out whether your printer can emulate
    any of the listed printers. You may also be able to find out whether a filter
    is suitable for your unlisted model by highlighting the filter in the left window
    and reading its description in the Driver Description window, at the right of
    the dialog.


    Choose the resolution and default paper size for your printer. (Not all printer
    will offer optional paper sizes.)


    In the Color Depth / Uniprint Mode section, select the options you desire.


    # A little about Floyd-Steinberg


    Floyd-Steinberg refers to a process of dithering, which is used to create shades
    or smooth jagged lines.


    # 5.1.2 Other Printing Options


    The remainder of the Configure Filter dialog allows you to specify other printing
    options:


    +   Send EOF after job to eject page -- This forces the printer to eject the page
    when the print job is finished. Uncheck this option if you receive an extra blank
    page after your print job.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# 80 Chapter 5:Setting Up Your Printer


    +   **Fix stair-stepping of text** -- Choose this option if your test page shows
    uneven lines of text, referred to as **stair-stepped**, which looks like:


    This, for example, is what stair-stepped text might look like


    +   **Fast text printing (non-PS printers only)** -- If you don''t have a PostScript
    printer, you can select this option, which will send text files directly to the
    printer, rather than send them to a program for conversion to PostScript, and
    to Ghostscript to be printed. This bypasses such a route for your text files,
    and speeds the process.


    +   **8, 4, 2, 1 pages per output page** -- This option refers to the command
    `mpage`, which allows you to print multiple pages of plain text files on one page
    (either 2, 4, or 8). This can be useful for squeezing large printouts onto a single
    sheet of page. Note, however, this option is not available if you choose the "fast
    text printing" option.


    +   **Margins** -- This option specifically applies to the selection of multiple
    page printing. If you choose to print multiple pages (see the option above), you
    can specify the width of the margin on the page. If you choose to print single
    pages, this option will be unavailable to you.


    +   **Extra GS options** -- Refers to additional Ghostscript options which may
    be available for your printer. In general, you can leave this blank. Check in
    the *Driver Description* box for any option you might be needed to add.


    # 5.1.3 Testing Your Printer Configuration


    Once you''ve made your selections in the *Configure Filter* dialog, click on the
    *OK* button. You''ll return to the *Edit Local Printer* dialog. Now, the *Input
    Filter* field will contain the information you''d chosen about your printer (see
    Figure 5–7, *Local Printer Entry with Filter*).'
