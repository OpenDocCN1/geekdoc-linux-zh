  md: '# 14 Working with Files and Directories


    If you''re a Linux newbie -- and there are many -- you may feel a little disoriented
    when you want to accomplish your first tasks.


    Relax. If you''ve had any experience with other operating systems, learning Linux
    is a bit like learning to drive in a new country: Many of the ideas are the same,
    but some of the particulars are a bit different.


    We''ll go over several of these "rules of the road" in this chapter.


    But there''s one component of your new operating system you just can''t do without:
    the shell. We''ve made numerous references to the shell -- as in "shell prompt,"
    or "bash".


    Now, it''s time to learn a little more about this indispensable tool. But first,
    some background information...


    # 14.1 Shell Collecting


    In the old days (we''re talking ''60s here), when AT&T''s Dennis Ritchie and Ken
    Thompson were designing UNIXTM, they wanted to create a way that humans could
    interact with their new system.


    Operating systems at the time did come with command interpreters, which could
    take commands from the user and interpret them so the machine could use them.


    But Ritchie and Thompson wanted something more, something which could offer better
    features than the command interpreters of the day.


    Enter the Bourne shell (known as sh), created by S.R. Bourne, which fulfilled
    the goals of UNIX''s creators.


    Since the creation of the Bourne shell, other shells have been developed, such
    as the C shell (csh) and the Korn shell (ksh).


    When the Free Software Foundation sought a royalty-free shell, developers began
    to work on the language behind the Bourne shell as well as some of the popular
    features from other shells available at the time.'
