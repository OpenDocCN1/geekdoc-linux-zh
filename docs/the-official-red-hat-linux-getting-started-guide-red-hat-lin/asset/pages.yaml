- img_proc: true
  md: '# UID, GID and Sticky bits?


    Essentially, these items refer to user management and permissions. UID means User
    ID, a unique number given to every user on the system; GID means Group ID, the
    ID of the user’s default group. Sticky refers to Sticky bit. You probably won’t
    have to worry about setting the Sticky bit.


    For more about how to work with permissions, see Section 13.12, Actions. Once
    you understand the idea behind file permissions, you may find using the Permissions
    tab a convenient way to change a file or directory’s permission sets.


    # 9.1.2 Setting GMC’s Preferences


    You can adjust quite a few settings for GMC in the Preferences dialog (Settings
    => Preferences); see Figure 9–5, The File display Tab in Preferences for an example
    of the Preferences dialog.'
