  md: '# Section 14.4:Identifying and Working with File Types


    # The head Command


    You can use the `head` command if you just want to look at the beginning of a
    file. The command is:


    ```

    head <filename>

    ```


    Head can be useful, but because it''s limited to the first several lines, you
    won''t know how long the file actually is. By default, you can only read the first
    10 lines of a file, although we can specify the number to see more by typing:


    ```

    head -20 <filename>

    ```


    Read head''s man page (man head) for more information. You''ll probably find that
    `less` or `more` are more helpful, because you can page through the file if you
    find that the information you''re looking for is further into the file than you
    originally thought.


    # The tail Command


    The reverse of `head` (obviously), is `tail`. With `(tail)`, you can review the
    last 10 lines of a file.


    # The cat Command


    The command `cat`, short for concatenation, will dump the contents of the entire
    file on the screen. Using `cat` can be handy if the file is fairly short, such
    as when we created `sneakers.txt`. But if a file is fairly long, it will easily
    scroll past you on the screen, since `cat` displays the whole file.


    # The grep Command


    The `grep` command is perfectly nifty for finding specific character strings in
    a file. Let''s say we want to find every reference we made to "coffee" in the
    file `sneakers.txt`, which we created in our login directory. We could type:


    ```

    grep coffee sneakers.txt

    ```


    and we would see every line in which the word "coffee" could be found.'
  merge: -1
