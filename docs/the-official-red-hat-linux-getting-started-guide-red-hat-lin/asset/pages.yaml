- img_proc: true
  md: '# # Getting Started


    Like many new users, learning how to work on your Red Hat Linux system can be
    both exciting and a little unn. To begin your journey, you''ll have to log in.
    When you log in, you''re basically “introducing yourself” to the system.


    Linux is case sensitive


    Like UNIX, Linux is case sensitive. That means that typing root refers to a different
    account than Root, as far as Linux is concerned -- the lowercase root is the name
    of the root login, or system administrator.


    When you installed Red Hat Linux, you had the opportunity to install the X Window
    System -- also simply called X -- which is the graphical environment. You were
    also asked whether you wanted to use a graphical screen, rather than a console
    to log in. Although our emphasis throughout this book will be on navigation and
    productivity using x, we''ll cover both the graphical and console methods of logging
    in and starting the X Window System.


    # ## 1.1 Log In, Please


    Unlike some other operating systems, your Red Hat Linux system uses accounts to
    manage privileges, maintain security and more. Not all accounts are created equal:
    some have fewer rights to access files or services than others.


    If you''ve already created a user account, you can skip ahead to Chapter 2. GNOME
    in 60 Seconds (or so). If you created only the root account, read on to learn
    how to set up a user account.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Don''t "root" around


    Because your Red Hat Linux system creates one account (the root account) during
    installation, some new users are tempted to use only this account for all their
    activities. This is a bad idea; because the root account is allowed to do anything
    on the system, you can easily damage your system by mistakenly deleting or modifying
    sensitive system files. You may be tempted to forego creating and using a user
    account during or after installation, but you''re playing with fire if you do.


    # 1.1.1 Create a User Account


    When you installed Red Hat Linux, you were asked to create a root password --
    that is, a password for the root account, the system administrator. You were also
    able to create additional user accounts, which allow you to accomplish most tasks,
    without potentially harming your system -- as would be the case if you were to
    use your root account for everything.


    If you didn''t create a user account during the installation, that''s your first
    task. Here''s what you''ll do:


    +   - Log in from the console or from a graphical screen.

    - Open a terminal emulation window (also called an Xterm window or Xterm) on the
    desktop.

    - Create a new user account.

    - Log out, then log in to the new account.


    # 1.1.2 Logging In As Root


    Regardless of whether you''ve chosen a graphical or console login screen, you''ll
    have to supply a login account name and the password associated with that account.

    From a console screen, for example, you''ll see something like:'
  merge: -1
  pgno: 21
