  md: 'The Web, E-Mail and News in GNOME and KDE


    # 7 The Web, E-Mail and News in GNOME and KDE


    Once you''ve configured your PPP account, you can view websites for information,
    entertainment, software and more.


    You can also send and receive e-mail -- the most popular online activity. And,
    you can trade information on newsgroups, which are essentially international bulletin
    boards covering thousands of subjects.


    Before you can use e-mail or read newsgroups, however, you''ll have to configure
    your e-mail and news applications, and clients. You can find two of the most popular
    mail and news clients in Netscape Communicator, included with your copy of Red
    Hat Linux.


    In this chapter, you''ll learn how to customize Netscape Communicator''s browser,
    e-mail and news applications. A suite of applications, Communicator contains:


    +   * Navigator -- for finding information on the World Wide Web

    * Messenger -- for sending and receiving e-mail and news

    * Composer -- for creating and publishing your own Web pages


    We''ll concentrate on Navigator and Messenger in this chapter.'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'Lynx: A lean and mean alternative browser


    You''ll probably use Navigator for your Web browsing. But your Red Hat Linux system
    also includes a useful browser called Lynx. What is Lynx? It''s a "general purpose"
    browser for character-cell displays; it will display the content of pages on the
    Web, but not the images. It''s very fast, and can be an excellent alternative
    for you if you''re interested in reading information, without having to wait for
    graphics.


    To give Lynx a try, open an Xterm window and type lynx at the prompt. You''ll
    find a list of options at the bottom of the screen. To go to a site, for example,
    use the [G] key and enter the website address; to quit, press the [Q] key.


    To learn more about Lynx, type man lynx at the shell prompt; or if you want to
    print the document, type man lynx | col -b | lpr.


    # 7.1 Using Navigator in GNOME and KDE


    You''ll find the Netscape icon on the Panel in GNOME and on the desktop in KDE.


    To begin Navigator, click once on the icon. When the browser starts, you''ll be
    asked to read and agree to the software license. Click on the Agree button to
    proceed. Once the browser starts, it should look like Figure 7–1, A Typical Navigator
    Window.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Section 7.1:Using Navigator in GNOME and KDE


    # Figure 7–1 A Typical Navigator Window


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_132_0.png)


    The top row containing the icons is called the Navigation Toolbar. Selecting the
    icons will perform the following actions:


    +   - Back Returns to a previously viewed page. To jump back several pages, left-click
    on the icon and hold down the mouse button to reveal a pull-down menu of previously
    viewed pages. Drag and release the cursor to your chosen page.


    +   - Forward When you’ve moved back to previously viewed pages, selecting this
    button will take you forward, toward your last viewed page.


    +   - Reload "Refreshes" the current page in the browser. This can be useful for
    example, if you want to view a page that’s frequently updated.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Chapter 7:The Web, E-Mail and News in GNOME and KDE


    +   Home -- Selecting this button will immediately send the browser to whatever
    location specified as your start page. For more on how to set this feature to
    point to a different page, see Section 7.1.1, Communicator Preferences.


    +   Search -- Sends you to a search engine page. Search engines allow you to locate
    information, people, merchandise and more.


    +   Print -- If you have configured a printer, selecting this button will print
    the current page.


    +   Security -- Displays security information about the current page, as well
    as encryption information (which aids in security) about your browser.


    +   Stop -- Stops loading the page into the browser.


    To browse other websites, just click on the hyperlinks, the differently colored,
    underlined portions of a document you view.


    You can also visit websites by typing in the URL, or website address, into the
    space provided in the Location Toolbar (see Figure 7–2, Menu and Location Options
    in Navigator). Click on the arrow pointing down at the right of the Location Toolbar
    to see a drop-down list of previously visited sites -- called the history list.
    To return to one of these sites quickly, select it from the list.'
  merge: -1
