    # Who Should Read This Book?


    If you count yourself among the many, who are discovering Red Hat Linux for the
    first time, this book is for you!


    Inside, you''ll find valuable tips and tricks which can help you get acquainted
    with your environment. Covering basics in GNOME and KDE, you''ll see how to navigate
    your system, how to manage files and directories and how to make the most of your
    Red Hat Linux work for you.


    If you''re familiar with a Windows environment, you''ll find the Linux commands
    in Appendix C: DOS to Linux Cheat Sheet (as well as the one on the inside ''cheat
    sheet'' back of Red Hat Linux) to be a useful guide to get you starting around
    right away.'
