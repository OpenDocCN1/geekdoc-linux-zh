  md: '# Section 7.3:Reading and Composing Mail in Messenger


    # To HTML or not to HTML?


    Among the options you have for sending and receiving messages, you''ll find Message
    formatting, in the Formatting category. This category allows you to decide whether
    you want to compose and send mail in HTML format.


    HTML, or Hypertext Markup Language, is the format in which Web pages and some
    other documents can be viewed. It can provide some rich formatting tools for your
    messages -- for example, you can change the color or style of your fonts. However,
    not all users read their mail or news with applications that can adequately display
    HTML; netiquette also frowns on the use of HTML in mail and news.


    Before sending your messages, make sure the recipients can read them. You can
    select the option Ask me what to do... in the section When sending HTML messages...,
    which will allow you to convert HTML messages to plain text for easier reading
    by everyone.


    Once you''ve finished entering your settings and options in Mail & Newsgroups,
    you''re ready to send and receive messages. Select the OK button to save your
    settings and exit the Preferences dialog.


    Now, turn to Section 7.3, Reading and Composing Mail in Messenger to learn more.


