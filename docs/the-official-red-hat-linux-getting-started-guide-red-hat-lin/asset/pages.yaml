  md: '# Section 10.4:Basic Configuration


    If no packages are available in the default path, you''ll be presented with an
    Add Packages window from which you can select the appropriate location of your
    new package.


    To choose a package, double-click on it with your mouse, or add a check in the
    checkbox next to the package, then click on the Add button.


    Within this Install window, you have the option of installing or upgrading packages:
    If the package has not been installed on your system, you''ll find an Install
    button at the bottom of the window.


    If the package already exists on your system and you''re querying a newer release,
    the Package Info window provides an Upgrade button, which will perform an upgrade
    to newer releases.


    You can also "drag and drop" packages from the GNOME File Manager and place them
    into the Install window. To accomplish this, open the File Manager (GNOME Panel
    => File Manager). Locate the directory in which your packages can be found, left-click
    once on the package name and "drag" the file by keeping your finger pressed on
    the mouse button, releasing the pressure (and the package) once you''re over the
    Install window.


    You''ll see a progress indicator when your package is being installed.


    # 10.4 Basic Configuration


    You can customize Gnome-RPM through the Preferences dialog, which you can access
    from Operations => Preferences on the menu. To make selections in Preferences
    select the check boxes next to the options.


    Under Behavior, you''ll find a number of options for configuring the way Gnome-RPM
    installs, uninstalls and upgrades packages. The Behavior tab is split into five
    sections: Install, Upgrade, Other, Database and Architecture. (See Figure 10–4,
    The Behavior Window for an example.) Note that by default these boxes are not
    checked.'
