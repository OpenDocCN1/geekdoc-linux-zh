  md: '# Chapter 15:Q & A: Quick Answers to Common Questions


    To become a little more familiar with the breakdown of this file, take a look
    at the man page for it by typing:


    ```

    man isapnp.conf

    ```


    There is also a great reference at the isapntools homepage at http://www.roestock.de-mon.co.uk/isapntools/


    # Using sndconfig


    If you haven''t run sndconfig, issue the command (as root): /sbin/pnpdump > /etc/isapnp.conf
    to create the file isapnp.conf, which you can edit.


    When you have created the file /etc/isapnp.conf, open it with Pico by typing pico
    /etc/isapnp.conf (note that you don''t have to be actually in /etc to edit the
    file)


    For a little help in the layout of this file, the man page is an excellent guide
    to keep at for this. Each device will have a section that starts with 4 lines
    that gives you information on what the device is:


    +   # Card 1: (serial identifier 6d ff ff ff ff 00 8c 0e)

    # Vendor Id CTL00f, No Serial Number (-1), checksum 0x6D.

    # Version 1.0, Vendor version 1.0

    # ANSI string ---->Creative VIBRA16X PnP--


    Look for the section containing the sound card device. The lines in this section
    that you need to pay attention to are the lines within parentheses. These are
    the lines that need to be adjusted for your card''s resources.


    You make adjustments by commenting or uncommenting on that line, indicating that
    you want to use the resource specified on that line. (When uncomment, you''re
    making that line visible for use in the file; when you comment, it''s invisible,
    for all intents and purposes.) Uncommenting is performed by removing the hash
    mark (#); to comment, just replace the hash mark. Once you have finished making
    these changes, look for the line towards the end of the file that says:'
  merge: -1
