  md: '# Chapter 14:Working with Files and Directories


    The result was the Bourne Again Shell -- or bash.


    By now, of course, you''ve probably seen the word bash when you''ve mistyped commands
    at the shell prompt (as in bash: somecommand: command not found).


    In Chapter 13, You Are Here, when we talked about redirection and piping, we were
    also demonstrating the power of bash.


    # More about bash


    You can learn more about bash by reading the bash man page. At the shell prompt,
    type man bash (or you can save the file as a text file by typing man bash | col
    -b > bash.txt, which you can then open to read with an editor like pico or a pager
    like less. You can also print the file with man bash | col -b | be warned: it''s
    a large file. If you want more information, O''Reilly Associates publishes Learning
    the bash Shell, by Cameron Newham and Bill Rosenblatt.


    Although your system came with several different shells, bash is the default shell
    for Red Hat Linux.


    You might think of bash as a fleet-footed office assistant who has a habit of
    keeping notes on ways to fulfill commands quickly. This assistant also keeps "pointers"
    on how you use to customize the way you work.


    These pointers bash are referred to as environment variables.


    The shell uses an "environment" in the same way we use an environment, like a
    kitchen. We work in our kitchen, arrange pots, pans, and spices. We know where
    the dishes are, how things operates.


    The same can be said for bash and its environment. There''s a basic arrangement
    for bash as there would be to just about any kitchen. For example, we''d expect
    to see pots in a kitchen in the same way that we would expect to see certain commands
    in bash.'
