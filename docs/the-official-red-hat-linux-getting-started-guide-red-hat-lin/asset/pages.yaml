  md: '# 2.7 Multiple Desktops


    Rather than crowd your work on one screen, you can use virtual desktops, which
    extend your workspace to multiple desktop areas. Say you have your browser open
    on one desktop; if you want to use a word processor or e-mail program without
    crowding everything together, you can have each application run on its own desktop.


    **Figure 2–8** Moving an Application to Another Desktop


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_43_0.png)


    Right-click on title bar,

    drag cursor to the Desktop menu


    For example, by using GNOME and the Enlightenment window manager (which literally
    manages how your windows are displayed), you can move a window from one desktop
    to another by clicking on the application''s title bar and "dragging" the application
    beyond the left, right, top or bottom border of your screen.


    Another way to move an application to another desktop, if your window manager
    supports the feature, is to select the desktop by right-clicking a window''s title
    bar (see Figure 2–8, Moving an Application to Another Desktop for an example,
    using Enlightenment).


    By default, four desktops are available to you. However, using the configuration
    utility for your window manager, you can modify that number. To run Enlightenment''s
    configuration program, middle-click on your desktop (or click your right and left
    mouse buttons simultaneously), and select Enlightenment Configuration. Go to the
    entry called Desktops to increase or decrease the number of available desktops.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# Section 2.8:Switching Environments


    Figure 2–9 The GNOME Desktop Guide


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_44_0.png)


    The Desk Guide (see Figure 2–9, The GNOME Desktop Guide) is a GNOME utility which
    allows you to switch desktops (or workspaces) by clicking on the corresponding
    desktop.


    You can use the GNOME Desktop Guide, the collection of "panes" on the Panel, to
    see where running applications are located on your desktops -- they will appear
    as small, raised squares inside a desktop pane.


    # Part of the Pager


    The Desktop Guide is one part of the GNOME Pager; the other part of the Pager
    is the Tasklist. You can add new Tasklists, Pagers, or Desk Guides by right-clicking
    on the Panel and moving your cursor to Add applet => Utility and selecting the
    applets from the menu.


    # 2.8 Switching Environments


    In addition to changing your graphical environment at the login screen, you can
    "switch" to another environment when you’re already logged in.


    You can change environments by using the Switchdesk utility (see Figure 2–10.
    The Switchdesk Utility). Whether you’re using GNOME, KDE or AnotherLevel, you
    can select your new environment in Switchdesk and log out. When you restart your
    session, you’ll find your new environment.


    In GNOME, one way to find Switchdesk is from the Main Menu Button (go to System
    => Desktop Switching Tool).'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Figure 2–10 The Switchdesk Utility


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_45_0.png)


    Other ways to start the utility include:


    +   - Type switchdesk at the prompt

    - Open the Run program item from the Main Menu Button and type switchdesk in the
    window.


    Your changes won’t be reflected immediately. Instead, you’ll have to log out of
    your current X session. The next time you start X, you’ll work in your new environment.'
