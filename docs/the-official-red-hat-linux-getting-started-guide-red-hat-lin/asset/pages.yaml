  md: '# Section 6.2:Connecting with Kppp


    # ## Specifying a Device


    Now, it''s time to provide the location and speed of your modem, in the Device
    tab (see Figure 6–24, *Device Configuration*). Here, you specify where your modem
    is located, its baud rate, some hardware settings and other specifics.


    In Modem Device, you''ll find a drop-down box allowing you to choose the location
    of your modem.


    Figure 6–24 Device Configuration


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_120_0.png)


    The following list is a comparison of serial line names in MS-DOS (and Windows)
    and Linux. If you know that your modem is attached to COM2 under Windows, for
    example, its location in Linux will be /dev/ttyS1.


    +   - COM1 = /dev/ttyS0

    - COM2 = /dev/ttyS1

    - COM3 = /dev/ttyS2

    - COM4 = /dev/ttyS3'
  merge: -1
