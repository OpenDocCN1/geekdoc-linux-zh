  md: '# Setting Up Your Printer


    Most new Red Hat Linux users want to immediately set up their printer.

    Here, we''ll cover some basic steps to configure a parallel printer on your system.
    For the most part, the process isn''t to too complicated, regardless of whether
    you''re using GNOME or KDE.


    # Is it compatible?


    Although many printers work with Linux, not all printers are compatible. To make
    certain your printer is compatible with Linux, refer to The Hardware Compatibility
    List at http://www.redhat.com/corp/support/hardware/.

    Another useful site which features printer compatibility lists as well as useful
    hints and instructions is The Linux Printing HOWTO, at http://www.picante.com/~gtaylor/pht.


    Because Linux is a multi-user, multi-tasking operating system, it can handle a
    variety of printing jobs at once. You could have multiple users on the system,
    all of whom want to send their work to a printer. Linux dutifully handles these
    requests by spooling them -- storing and printing the files in the order which
    they were received.

    Even if you''re the only user on your system, you''re still going to send your
    work to the print spool, the files wait until it''s their turn to be printed.

    There are some terms and conditions you should know:


    +   - Lpd -- The line printer spooler daemon. Normally starts when the system
    starts. Manages the print jobs.

    - Ipr -- Takes each print job and submits it to lpd.

    - Input filters -- Manage printer-specific formatting.

    - /etc/printcap -- This is the configuration file which defines your printer and
    other specifics.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Chapter 5:Setting Up Your Printer


    +   - /var/spool/lpd/ -- This is the location of the print spool, which is where
    files await printing.


    +   - Printtool -- A graphical utility you will use to configure and modify /etc/printcap.


    # Read the "man page"


    You can learn more about lpd and related commands and daemons by typing man lpd
    at a shell prompt. To move forward through the man page, use the [Space]; to move
    back, press the [B] key, and to quit, press the [Q] key.


    Regardless of whether you''re using GNOME or KDE, you can configure your printer
    with Printtool. Printtool provides a graphical means for setting up and managing
    your printer.


    # 5.1 Using Printtool


    The file /etc/printcap defines how lpr should process the print jobs. If you were
    to take a peek at the file, you''d find it looks something like the following
    excerpt:


    ```

    ##PRINTTOOL3## REMOTE POSTSCRIPT 600x600 letter {} PostScript Default 1

    acct=xerox-ac:\n:sd=/var/spool/lpd/acct:\n:mx#0:\n:rm=xerox-ac.redhat.com:\n:rp=lp:\n:if=/var/spool/lpd/filter.d/filter:

    ```


    It''s not pretty, and unless you know exactly what you''re doing, you shouldn''t
    edit the file. Instead, use the utility Printtool to set up the printer (and /etc/printcap)for
    you.


    To use Printtool, you''ll have to "be root."'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Section 5.1:Using Printtool


    Whenever you make changes to your system configuration -- such as adding or modifying
    hardware settings, installing or uninstalling software -- you must be superuser,
    or root.


    To become root from your user account:


    +   - Open an Xterm window;

    - Type su at the prompt;

    - Type your root password. (You won''t see it "echoed" on the screen when you
    type it.)


    See Figure 5–1, Switching to Root for an example of how to become root


    # Figure 5–1 Switching to Root


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_74_0.png)


    As you can see in the previous figure, when you''re your root prompt changes from
    a s to a #. Type printtool -- one word, without capitalization.


    When the utility starts, you''ll see a window similar to Figure 5–2, The Printtool
    Window. At first, you won''t find any printers listed, because you haven''t added
    a printer to /etc/printcap.


    Click on the Add button to add your printer.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# Figure 5–2 The Printtool Window


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_75_0.png)


    Next, you’ll be asked what kind of printer you want to add (see Figure 5–3, Selecting
    the Type of Printer to Add).


    # Figure 5–3 Selecting the Type of Printer to Add


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_75_1.png)


    Choose from the following:'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# Section 5.1:Using Printtool


    +   - Local Printer: Choose this if your printer is directly connected to the
    machine on you’re working (called the local machine).


    +   - Remote Unix (lpd) Queue: A printer attached to another machine on which
    an lpd daemon is running. Choose this if you want to print to a network printer
    on a LAN.


    +   - SMB/Windows 95/NT Printer: A printer which is attached to a machine running
    Windows or Samba. (Samba is a suite of programs which allows Windows machines
    to share files and services with UNIX and Linux machines on a network.)


    +   - NetWare Printer (NCP): A printer on a machine running Novell NetWare or
    compatible server software -- two networking applications for interacting with
    machines running Novell NetWare.


    # What is a daemon?


    You may have seen that ipd is called the line printer spoller daemon. A daemon
    is a small program that runs in the background. Daemons usually perform critical
    system tasks, and usually start when the the system starts. (Most daemons, also,
    have names that end in a d, such as crond, httpd, ipd, and so on.)


    For this example, we’ll add a local printer. Highlight the entry Local Printer
    and select the OK button.


    When you select your printer type, Printtool will attempt to detect any printers
    which are attached to your parallel port; you’ll then see the results (see Figure
    5–4, Detecting a Printer Port). Click on the OK button to continue to the main
    Printtool window.'
  merge: -1
  pgno: 76
- img_proc: true
