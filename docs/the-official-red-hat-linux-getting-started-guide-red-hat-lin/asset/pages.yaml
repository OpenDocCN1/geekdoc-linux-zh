- img_proc: true
  md: '# Section 6.1:Using RP3 to Connect


    Figure 6–3 The Add New Internet Connection dialog


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_96_0.png)


    # If devices are detected


    If there are devices detected, such as an Ethernet card, you can simply choose
    a listed device so that the application is running on the Panel or the desktop,
    as in. Once the application is running, right-click on the application to open
    the options menu and select Configure PPP.


    To proceed, select the Next button: to quit the utility without making any changes
    or additions, use the Cancel button. You can cancel without saving changes at
    any time during the process. You can also return to a previously completed screen
    by using the Back button.


    Your next task is to configure a modem. RP3 will try to automatically detect a
    modem on your system (as in Figure 6–4. Searching for a Modem).'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Figure 6–4 Searching for a Modem


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_97_0.png)


    If your modem isn''t detected during the search, you''ll receive a message stating
    that it couldn''t be found.


    You can still enter details about your modem''s location, speed and other information,
    in the Edit Modem Properties dialog, as in Figure 6-5, The Edit Modem Properties
    Dialog. This dialog will appear if no modems were detected on your system. Refer
    to your modem manufacturer''s specifics to enter here.


    # What are Winmodems?


    > If your machine uses a modem which relies on software drivers for some of its
    functionality, you''ve probably got a "Winmodem." Because they depend on Windows-based
    software to operate correctly, these types of modems don''t function in Linux.
    To find out more about this subject, go to http://www.o2.net/~gromitkc/winmodem.html'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# Section 6.1Using RP3 to Connect


    # Figure 6-5 The Edit Modem Properties Dialog


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_98_0.png)


    The **Edit Modem Properties** dialog, you can specify the location of your modem,
    its baud rate, your preference regarding the speaker volume during a call and
    whether to use Touch Tone dialing.


    Although RP3 attempts to detect the correct port, you can adjust the settings
    here.


    If you know that your modem is attached to COM2 under Windows, for example, its
    location in Linux will be /dev/ttyS1. Here is a comparison of serial line names
    in MS-DOS (and Windows) and /dev/tty Linux:


    +   - COM1 = /dev/ttyS0

    - COM2 = /dev/ttyS1

    - COM3 = /dev/ttyS2

    - COM4 = /dev/ttyS3


    Using the drop-down list in the **Modem Device** box, enter the port to which
    your modem is connected. Then, in **Baud Rate**, enter the fastest recommended
    speed for your'
  merge: -1
  pgno: 98
- img_proc: true
  md: '# Chapter 6:Getting Online


    modem. Due to most modems'' data compression capabilities, select a baud rate
    that is faster than the modem''s advertised speed (a typical 56k device, for example,
    would have a baud rate of 115200).


    You can also select your volume and dialing preferences in this dialog. Dragging
    the bar to Loud in the Modem Volume entry will let you hear everything that goes
    on during a connection -- dialtone to the connection negotiation. Note, however,
    that some modems will allow only a sound on/sound off configuration, rather than
    gradations of volume.


    The touch tone dialing button, when selected, will dial using touch tone; when
    deselected, you''ll dial using pulse.


    Check this modem the default modem to use your current modem settings each time
    you run RP3.


    You can also rescan your system for modem information by selecting the Auto Config-button,
    then choose to keep the settings it finds.


    Once you''re satisfied with your settings, click on Next to proceed to the following
    screen.


    # Tip


    > Even if your modem is automatically detected, you can ad-just the modem''s settings
    by choosing to Manually create a modem after RP3 detects your device. Your choices,
    such as location of modem, baud rate and volume, will be identical to those you''d
    find if the modem had not detected.


    In the Phone number and name dialog (see Figure 6–6, Adding a Name and Phone Number),
    you should enter both the name you would like to give your account and the telephone
    number of your ISP. Usually, it isn''t necessary to provide the prefix or area
    code for your ISP.


    If you must dial a "9" to reach an outside line, enter this number in the Prefix
    field. To disable call waiting, type *70 in this field.'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# Section 6.1:Using RP3 to Connect


