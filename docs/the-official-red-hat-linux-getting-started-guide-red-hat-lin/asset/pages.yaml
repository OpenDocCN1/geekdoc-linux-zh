- img_proc: true
  md: '# Section 9.1:The GNOME File Manager


    The Location bar allows you to type the directory location. If you know the path
    where you want to go, for example /etc/X11, you can type it into the Location
    bar and press [Enter] to jump to that location.


    Actually, the Location bar can let you browse more than just your local system.
    If you''re online, and you type in the location of an FTP site, such as ftp.red-hat.com,
    you''ll be able to see the files on that site which are available for download.
    The FTP command should look like this: ftp://ftp.red-hat.com. To download, just
    copy a file to a directory on your local machine.


    # GMC plays well with Gnome-RPM


    Speaking of downloaded files, you can use GMC to perform RPM-related work on new
    software packages, such as those you download or find on a CD. Just right-click
    on the package and GMC offers you options to install, verify, query, and more
    (remember, you must be root to install or uninstall software). You can also drag
    and drop packages from the file manager into Gnome-RPM for installation (refer
    to Section 10.3, Installing New Packages for more on this).


    To learn more about Gnome-RPM and RPM, turn to Chapter 10, Using Gnome-RPM and
    RPM.


    # Copying and Moving Files


    You can copy and move files from the directory window to your desktop or to another
    folder (that is, directory). If you want to move a file to your desktop, just
    "pick it up" by clicking it once and holding down the mouse button. Release the
    file on the desktop; by default, this action causes the file to be moved to your
    desktop.


    If you''d prefer to copy the file rather than move it, click on the file, then
    drag it while holding down the [Shift] key.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Choose when you get there


    Not sure whether you want to move or copy a file? Use the [Alt] key when you drag
    a file. A pop-up menu will appear once you release the file, letting you choose
    to copy or move the file. You can also choose to link the file, which is essentially
    a shortcut to the file in its original location.


    Figure 9–2 Copying File Dialog


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_177_0.png)


    If you know the path to the directory to which you want to copy a file, you can
    right-click on the file and choose Copy from the menu of options which opens.
    A dialog will open, in which you can type the location where you want to copy
    the file (as in Figure 9–2, Copying File Dialog).


    In the Advanced Options tab of the Copy dialog, you can choose to Preserve symlinks,
    which will make certain that if the file you''re copying is a symbolic link, or
    shortcut, it will be the same shortcut after it''s copied. Rather than risk losing
    a shortcut, you should make certain you select this option if you''re copying
    -- or moving -- a file that is a shortcut to another file.'
