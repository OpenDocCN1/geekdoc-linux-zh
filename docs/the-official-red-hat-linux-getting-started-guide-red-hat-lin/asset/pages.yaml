  md: '# C DOS to Linux Cheat Sheet


    Many Linux commands you type at a shell prompt are not that different from the
    commands you would type either in MS-DOS or in Windows (from the MS-DOS prompt).
    In fact, some commands are identical.


    # C.1 DOS and Linux Commands


    What follows are some common commands used at the MS-DOS prompt in Windows 9x,
    and in Linux, as well as a basic example of how the command is used at the Linux
    shell prompt. Note that these commands usually have a number of options. To learn
    more about each command, read its associated man page (for example, type man 1s
    at the shell prompt to read about the 1s).


    Table C-1 Similar Commands


    | Command''s Purpose | MS-DOS | Linux | Basic Linux Example |

    | --- | --- | --- | --- |

    | Copies files | copy | cp | cp thisfile.txt /home/thisdirectory |

    | Moves files | move | mv | mv thisfile.txt /home/thisdirectory |

    | Lists files | dir | ls | ls |

    | Clears screen | cls | clear | clear |

    | Closes prompt window | exit | exit | exit |

    | Displays or sets date | date | date | date |

    | Deletes files | del | rm | rm thisfile.txt |

    | "Echoes" output on the screen | echo | echo | echo this message |'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# Appendix C:DOS to Linux Cheat Sheet


    | Command''s Purpose | MS-DOS | Linux | Basic Linux Example |

    |---|---|---|--|

    | Edits files with simple text editor | edit | pico¹ | pico thisfile.txt |

    | Compares the contents of files | fc | diff | diff file2 |

    | Finds a string of text in a file | find | grep | grep this word or phrase thisfile.txt
    |

    | Formats a floppy | format a:(if floppy''s A:) | mke2fs (or mfor-mat²) | /sbin/mke2fs
    /dev/fd0 (/dev/fd0 is the Linux equivalent of A:) |

    | Displays command help | command/? | man³ | man command |

    | Creates a directory | mkdir | mkdir | mkdir directory |

    | Screens through a file | more | less⁴ | less thisfile.txt |

    | Renames a file | ren | mv | mv thisfile.txt that-file.txt⁵ |

    | Shows your location in the file system | chdir | pwd | pwd |


    1 Pico is a simple text editor; other editors you can use in place of pico emacs
    and vi.

    2 This formats a disk for the DOS filesystem.

    3 Or you can use info for some commands.

    4 You can use another pager, more, to scroll through a file screen at time.

    5 The mv command serves double-duty, because it can move both a file and, if you
    want to rename a file in the same directory, you "move" that file to the same
    directory with a new name, as in this example.'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# Section C.2:Different Paths


    | Command''s Purpose | MS-DOS | Linux | Basic Linux Example |

    | --- | --- | --- | --- |

    | Changes directories with a specified path (absolute path) | cd path-name | cd
    path-name | cd /directory/directory |

    | Changes directories with a relative path | cd .. | cd .. | cd .. |

    | Displays the time | time | date | date |

    | Shows amount of RAM and use | mem | free | procinfo |


    # C.2 Different Paths


    You''ll notice other slight differences between the two operating systems, as
    well. Here is one of the most common examples:


    # C.2.1 Pathnames


    A pathname shows you where you are, or conveys to the system which directory you
    want to go to. Briefly, the difference between stating the pathname is \ or /
    when you''re typing in the pathname.


    For example, to navigate to a directory from the MS-DOS prompt, you would type


    ```

    cd \thisdirectory\directory

    ```


    To move to a directory (using absolute pathnames) in Linux, you would type


    ```

    cd /thisdirectory/thisdirectory

    ```'
  merge: -1
