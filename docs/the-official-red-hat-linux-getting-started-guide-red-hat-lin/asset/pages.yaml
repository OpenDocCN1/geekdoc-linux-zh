  md: '# Introduction


    Welcome to the Official Red Hat Linux Getting Started Guide!


    Just a few short years ago, a user who wanted to try out Linux had relatively
    few choices in the distributions, or types of packaged Linux operating systems,
    which were available. That''s all changed. Now, there are dozens of Linux distributions
    from which you can choose.


    But Red Hat Linux has remained a leading choice of Linux distributions for years.
    Here at Red Hat, we believe we offer the best Linux distribution on the market.
    We hope you''ll agree that the time and money you spent to install and work with
    Red Hat Linux were well spent, indeed.


    The Official Red Hat Linux Getting Started Guide is part of our effort to help
    you become acquainted with your new Red Hat Linux system.


    # Who Should Read This Book?


    If you count yourself among the many who are discovering Red Hat Linux for the
    first time, this book is for you!


    Inside, you''ll find valuable tips and tricks which can help you get acquainted
    with your desktop environment. Concentrating on tasks in GNOME and KDE, you''ll
    see how to navigate through your system, how to manage files and directories and
    how to make some of the power of Red Hat Linux work for you.


    If you''re most familiar with a Windows environment, you''ll find the DOS-to-Linux
    commands in Appendix C, DOS to Linux Cheat Sheet (as well as the tips on the enclosed
    "cheat sheet" in the boxed set of Red Hat Linux) to be useful guides, so you can
    start looking around right away.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Introduction


    # Figure 1 A GNOME Desktop


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_11_0.png)


    You''ll learn how to accomplish such basic first steps as connecting to the Internet,
    configuring your e-mail client, adding a printer and more.


    More advanced topics will cover how to work with Update Agent, so your system-automatically
    stays current with critical software updates.


    Is Red Hat Linux sharing your computer with Microsoft Windows? Turn to Chapter
    15, Q & A: Quick Answers to Common Questions to find out how you can Red Hat Linux
    to "see" into your other operating system, so you can perform tasks without having
    to reboot into the other operating system.


    You''ll even gain some experience at file management and system administration
    using the "shell prompt," the command-line interface.


    In short, this guide picks up the Official Red Hat Linux Installation Guide leaves
    off: by giving you the confidence to work with your new operating system.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# A Peek Inside


    This book is divided into several parts:


    +   - The Basics: When you''ve finished this section, you''ll start to feel comfortable
    with your GNOME or KDE environment. You''ll take your first steps to becoming
    productive (or just having fun and looking productive). You''ll find out how to
    get online, set up an e-mail account and communicate with others using your Netscape
    browser.

    - Managing Files and Directories: Beyond the basics; here, you''ll learn about
    the GNOME and KDE file managers, working with running processes, locating files,
    installing and removing applications, using Update Agent and other administrative
    necessities.

    - The Shell Prompt: Just beneath your graphical environment, the real power of
    your system awaits. You''ll get a taste of this power and learn how to put it
    to work for you.

    - Q & A: When you care only for answers, turn to this chapter. Many of the entries
    you''ll find here concern answers to some of the most common new user questions,
    such as: how to access a floppy disk; what happens if you forget your root password
    (you can create a new one); how to access files on a Windows partition; and more.

    - Th Glossary: Here, you''ll find quick definitions to plenty of words and phrases
    that can vex any new Linux user.


    # A Note About Environments


    Your Red Hat Linux system is more than the graphical user interface, but it''s
    a fairly bet that most new and intermediate users will choose to work within the
    graphical environment, so we''ll spend most of the time demonstrating the techniques
    behind accomplishing tasks in two popular environments: GNOME and KDE.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Figure 2 A KDE Desktop


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_13_0.png)


    Much of what you can accomplish with a graphical environment can also be performed
    from the shell prompt. In fact, many actions you can perform from the shell prompt
    are faster than from the graphical environment.


    In addition to the chapters covering various tasks you can perform in KDE and
    GNOME, you''ll find plenty of useful information within covering basic information
    from the shell prompt (as shown in Figure 3, Using Pico at a Shell Prompt).'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Section 0.4:Work With Your User Account


    Figure 3 Using Pico at a Shell Prompt


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_14_0.png)


    You''u''ll also find useful tips, caution notices and related information inside.

    And speaking of caution...


    # Work With Your User Account


    Linux is a multi-tasking, multi-user operating system, so it can easily accommodate
    many users'' needs. Even if your machine isn''t attached to a network, you can
    share your machine with others -- each of whom will have their own settings.


    Because of user accounts, Linux makes it easy to share your machine while preserving
    customized settings. Using accounts is convenient for users; it''s also secure,
    because ordinary users don''t have permission to damage or delete sensitive system
    data. Only one account, the root account can make changes to the system -- and
    to others'' account information.


    Using your system''s root account for everyday work can be dangerous, because
    you can easily damage your system by accidentally deleting or modifying a sensitive
    file.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Introduction


    Most tasks in the following chapters don''t require that you be logged in to your
    system''s root account. Instead, you can accomplish almost everything from your
    user account -- so you won''t accidentally harm your system.


    # Figure 4 Log In To Your User Account


    ![](img/d15fadb9d8936db6bed1cc788a6f50fb_15_0.png)


    Unless you''re specifically told that you should be logged in as root, log in
    to your user account to accomplish tasks in this manual -- without risking disaster.


    # Where to Find More Info


    Plenty of websites offer valuable information on how to use a command, but you''ve
    probably got quite a bit of documentation already on your system. In the following
    chapters, you''ll learn:


    +   - How to read and print man pages and info pages. Man and info pages are system
    documents which can help you understand what many commands are for and how use
    them.

    - How to use the GNOME and KDE help browsers.

    - Some useful online resources you should bookmark in your browser.'
  merge: -1
  pgno: 15
