  md: "# # Chapter 3. Nameserver Configuration\n\nIn this section we provide some\
    \ suggested configurations along with guidelines for their use. We also address\
    \ the topic of reasonable option setting.\n\n# ## 3.1. Sample Configurations\n\
    \n# ### 3.1.1. A Caching-only Nameserver\n\nThe following sample configuration\
    \ is appropriate for a caching-only server for use by clients from outside clients\
    \ are refused.\n\n```\n // Two corporate subnets we wish to allow queries from.\n\
    acl \"corpnets\" ( 192.168.4.0/24; 192.168.7.0/24 );\noptions {\n    directory\
    \ \"/etc/namedb\"; // Working directory\n    pid-file \"named.pid\"; // Put pid\
    \ file in working dir\n    allow-query { \"corpnets\"; }\n}\n// Root server hints\n\
    zone \". { type hint; file \"root.hint\"; };\n// Provide a reverse mapping for\
    \ the loopback address 127.0.0.1\nzone \"0.0.0.127.in-addr.arpa\" {\n    type\
    \ master;\n    file \"localhost.rev\";n    notify no;\n}\n```\n\n# ## 3.1.2. An\
    \ Authoritative-only Nameserver\n\nThis sample configuration is for an authoritative-only\
    \ server that is the master server for \"example.com\" and a slave for the subdomain\
    \ eng.example.com\".\n\n```\noptions {\n    directory \"/etc/namedb\"; // Working\
    \ directory\n    pid-file \"named.pid\"; // Put pid file in working dir\n    allow-query\
    \ { any; }; // This is the default\n    recursion no; // Do not provide recursive\
    \ service\n}\n```"
  merge: -1
  img_proc: true
