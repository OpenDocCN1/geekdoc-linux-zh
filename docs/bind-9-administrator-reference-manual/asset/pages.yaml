  md: '# # Chapter 6. BIND 9 Configuration Reference


    BIND 9 configuration is broadly similar to BIND 8.x; however, there are a few
    new areas of configuration, such as views. BIND 8.x configuration files should
    work with few alterations in BIND 9, although more complex configurations should
    be reviewed to check if they can be more efficiently implemented using the new
    features found in BIND 9.


    BIND 4 configuration files can be converted to the new format using the shell
    script contrib/named-bootconf/named-bootconf.sh.


    # ## 6.1. Configuration File Elements


    Following is a list of elements used throughout the bind configuration:


    | acl_name | The name of an address_match_list as defined by the **acl statement**.
    |

    | --- | --- |

    | address_match_list | A list of one or more ip_addr, ip_prefix, key_id, or acl_name
    elements, see Section 6.1.1. |

    | domain_name | A quoted string which will be used as a DNS name, for example
    "test.domain". |

    | dotted_decimal | One or more integers valued from 0 through 255 separated by
    dots (''.''), such as 23.45.67 or 89.123.45.67. |

    | ip4_addr | An IPv4 address with exactly four elements in dotted_decimal notation.
    |

    | ip6_addr | An IPv6 address, such as fe80::200:ff83:fe01:9742. |

    | ip_addr | An ip4_addr or ip6_addr. |

    | ip_port | An IP port number. limited to 0 through 65535, with values below 1024
    restricted to root-owned processes. In some cases an asterisk character can be
    used as a placeholder to select a random high-numbered port |\ ip_prefix | An
    IP network specified as an ip_addr, followed by a slash (''/'') and the number
    of bits in the netmask. Trailing zeros in a ip_addr may be omitted. For example,
    127/8 is the network 127.0.0.0 with netmask 255.0.0.0 and 1.2.3.0/28 is network
    1.2.3.0 with netmask 255.255.255.240. |'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Chapter 6. BIND 9 Configuration Reference


    | key_id | A domain_name representing the name of a shared key, to be used for
    transaction security. |

    | key_list | A list of one or more key_ids, separated by semicolons and ending
    with a semicolon. |

    | number | A non-negative 32 bit unsigned integer (i., a number between 0 and
    4294967295, inclusive). Its acceptable value may be limited by the context in
    which it is used. |

    | path_name | A quoted string which will be used as a pathname, such as zones/master/my.test.domain.
    |

    | size_spec | A number, the word unlimited, or the word default. An unlimited
    size_spec requests unlimited use, or the maximum available amount. A default size_spec
    uses the limit that was in force when the server was started. |

    | yes_or_no | A number can optionally be followed by a scaling factor: K or k
    for kilobytes, M or m for megabytes, and G or g for gigabytes, which scale by
    1024*1024, and 1024*1024. The value must be representable as a 64-bit unsigned
    integer (0 to 1844674407399551615, inclusive). Using unlimited is the best way
    to safely set a really large number. |

    | dialup_option | Either yes or no. The words true and false are also accepted,
    as are the numbers 1 and 0. One of yes, no, notify, notify-passive, refresh or
    passive. When used in a zone, notify-passive, refresh, and passive are restricted
    to slave and stub zones. |


    44'
