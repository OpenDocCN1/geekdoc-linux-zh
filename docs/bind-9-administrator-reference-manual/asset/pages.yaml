- pgno: 35
  md: 'Chapter 4. Advanced Concepts


    One output file is produced: `zone.child.example.signed`. This file should be
    referenced by `named.conf` as the input file for the zone.


    # ## 4.7.5. Configuring Servers


    Unlike BIND 8, data is not verified on load in BIND 9, so zone keys for authoritative
    zones do not need to be specified in the configuration file.


    The public key for any security root must be present in the configuration file''s
    `trusted-keys` statement, as described later in this document.


    # ## 4.8. IPv6 Support in BIND 9


    BIND 9 fully supports all defined forms of IPv6 name to address and address to
    name lookups. It will also use IPv6 addresses to make queries running on an IPv6
    capable system.


    For forward lookups, BIND 9 supports both A6 and AAAA records. The use of AAAA
    records is deprecated, but it is still useful for hosts to have both AAAA and
    A6 records to maintain backward compatibility with implementations where AAAA
    records are still used. In fact, the stub resolvers shipped with most operating
    system support only AAAA lookups, because following A6 chains is harder than doing
    A or AAAA lookups.


    For IPv6 reverse lookups, BIND 9 supports the new "bitstring" format used in the
    `ipv6.arpa` domain, as well as the older, deprecated "nibble" format used in the
    `ipv6.int` domain.


    BIND 9 includes a lightweight resolver library and resolver daemon which new applications
    may choose to use to avoid the complexities of A6 chain following and bitstring
    labels, see Chapter 5.


    For an overview of the format and structure of IPv6 addresses, see Section A.3.1.


    # ## 4.8.1. Address Lookups Using AAAA Records


    The AAAA record is a parallel to the IPv4 record. It specifies the entire address
    in a single record.


    ```

    $ORIGIN example.com.

    host 3600 IN AAAA 3ffe:8050:201:1860:42::1

    ```


    While their use are deprecated, they are useful to support older IPv6 applications.
    They should not be added where they are not absolutely necessary.


    36'
  merge: -1
  img_proc: true
- pgno: 36
  md: "# 4.8.2. Address Lookups Using A6 Records\n\nThe A6 record is more flexible\
    \ than the AAAA record, and is therefore complicated. The A6 record can be used\
    \ to form a chain of A6 records, each specifying part of the IPv6 address. It\
    \ can also be used to specify the entire record as well. For example, this record\
    \ supplies the same data as the AAAA record in the previous example:\n\n```\n\
    $ORIGIN example.com.\nhost 3600 IN A6 0:3fe:8050:201:1860:42::1\n```\n\n# 4.8.2.1.\
    \ A6 Chains\n\nA6 records are designed to allow network numbering. This works\
    \ when an A6 record only specifies the part of the address domain owner controls.\
    \ For example, a host may be a company named \"company.\" It has two ISPs which\
    \ provide IPv6 address space for. These two ISPs fully specify the IPv6 prefix\
    \ they supply.\n\nIn the company's address space:\n\n```\n$ORIGIN example.com.\
    \ IN A6 64 0:0:0:0:0:42::1 company.example1.net.\nhost 3600 IN A6 64 0:0:0:0:0:42::1\
    \ company.example2.net.\n```\n\nISP1 will:\n\n```\n$ORIGIN example1.net.\ncompany\
    \ 3600 IN A6 0 3fe:8050:201:1860::\n```\n\nISP2 will:\n\n```\n$ORIGIN example2.net.\n\
    company 3600 IN A6 0 1234:5678:90ab:ffff::\n```\n\nWhen host.example.com is looked\
    \ up, the resolver (in the resolver daemon or caching server) will find two partial\
    \ A6 records, and will use the name to find the remainder of the data.\n\n# 4.8.2.2.\
    \ A6 Records for DNS Servers\n\nWhen an A6 record specifies the address of a name\
    \ server, it should use the full address rather than specifying a partial address.\
    \ For example:\n\n```\n$ORIGIN example.com. IN NS ns0\n@ 14400 IN NS nsl\n\t 14400\n\
    ```"
  merge: -1
