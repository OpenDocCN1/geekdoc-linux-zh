    # 1.4. The Domain Name System (DNS)


    The purpose of this document is to explain the installation and upkeep of the
    BIND software package, and we begin by reviewing the fundamentals of the Domain
    Name System (DNS) as they relate to BIND.


    # 1.4.1. DNS Fundamentals


    The Domain Name System (DNS) is the hierarchical, distributed database. It stores
    information for mapping Internet host names to IP addresses and vice versa, mail
    routing information, and other data used by Internet applications.


    Clients look up information in the DNS by calling a resolver library, which sends
    to one or more name servers and interprets the responses. The BIND 9 software
    distribution contains both a name server and a resolver library.


    # 1.4.2. Domains and Domain Names


    The data stored in the DNS is identified by domain names that are organized as
    a tree according to organizational or administrative boundaries. Each node of
    the tree, called a domain, is given a label. The domain name of the node is the
    concatenation of all the labels on the path from the node to the root node. This
    is represented in written form as a string of labels listed from right to left
    and separated by dots. A label need only be unique within its parent domain.


    10'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Chapter 1. Introduction


    For example, a domain name for a host at the company Example, Inc. could be mail.example.com,
    where com is the top level domain to which ourhost.example.com belongs, example
    is a subdomain of com, and ourhost is the name of the host.


    For administrative purposes, the name space is partitioned into areas zones, each
    starting at a node and extending down to the leaves or nodes where other zones
    start. The data for each is stored in a name server, which answers queries about
    the zone using the DNS protocol.


    The data associated with each domain name is stored in the form of resource records
    (RRs). Some of the supported record types are described in Section 6.3.1.


    For more detailed information about the design of the DNS and the DNS protocol,
    please refer to the standards documents listed in Section A.4.1.


    # 1.4.3. Zones


    To properly operate a name server, it is important to understand the difference
    between a zone and a domain.


    As we stated previously, a zone is a point of delegation in the DNS tree. A zone
    consists of contiguous parts of the domain tree for which a name server has complete
    information and over it has authority. It contains all names from a certain point
    down in the domain tree except those which are delegated to other zones. A delegation
    point is marked by one or more NS records in the parent zone, which should be
    matched by equivalent NS records at the root of the delegated zone.


    For instance, the example.com domain includes names such as host.aaa.com and hbb.example.com
    even though the example.com zone includes only delegations for the aaa.example.com
    and bbb.example.com zones. A zone can map exactly to a single domain, but could
    also include only part of domain, the rest of which could be delegated to other
    name servers.


    Every in the DNS is a domain, even if it is terminal, that is, has no subdomains.
    Every subdomain is a domain and every except the root is a subdomain. The terminology
    is not intuitive and we suggest that you read RFCs 1033, 1034 and 1035 to gain
    a complete understanding of this and subtle topic.


    Though BIND is called a "domain name server", it deals primarily in terms of zones.
    The master and slave declarations in the named.conf file specify zones, not domains.
    When you ask any other site if it is willing to be a slave server for your domain,
    you are actually asking for slave service for some collection of zones.


    # 1.4.4. Authoritative Name Servers


    Each zone is served by at least one authoritative name server, which contains
    the complete data for the'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'zone. To make the DNS tolerant of server and network failures, most zones have
    two or more authoritative servers.


    Responses from authoritative servers have the "authoritative answer" (AA) bit
    set in the response packets. These make them easy to identify when debugging DNS
    configurations using tools like **dig** (Section 3.4.1.1).


    #  1.4.4.1. The Primary Master


    The authoritative server whose master copy of the zone data is maintained is called
    the *primary master server*, or simply the *primary*. It loads the zone contents
    from some local file edited by humans or perhaps generated mechanically from some
    other local file which is edited by humans. This file is called the *zone file*.


    #  1.4.4.2. Slave Servers


    The other authoritative servers, the *slave servers* (also known as *secondary
    servers*) load the zone contents from another server using a replication process
    known as a *zone transfer*. Typically the data are transferred from the primary
    master, but it is also possible to transfer it from another slave. In other words,
    a slave server may itself act as a master to a subordinate slave server.


    #  1.4.4.3. Stealth Servers


    Usually all of the zone''s authoritative servers are listed in NS records in the
    parent zone. These NS records constitute a *delegation of the zone* from the parent.
    The authoritative servers are also listed in the zone file itself, at the *top
    level or apex* of the zone. You can list servers in the zone''s top-level NS records
    that are not in the parent''s NS delegation, but you cannot list servers in the
    parent''s delegation that are not present at the zone''s top level.


    *A stealth server* is a server that is authoritative for a zone but is not listed
    in that zone''s NS records. Stealth servers can be used for keeping a local copy
    of a zone to speed up access to the zone''s records or to make sure the zone is
    available even if all the "official" servers for the zone are inaccessible.


    A configuration where the primary master server itself is a stealth server is
    often referred to as a "hidden primary" configuration. Use one for this configuration
    is when the primary master is behind a firewall and therefore unable to communicate
    directly with the outside world.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# 1.4.5. Caching Name Servers


    The resolver libraries provided by most operating systems are stub resolvers,
    meaning that they are not capable of performing the full DNS resolution process
    by themselves by calling directly to the authoritative servers. Instead, they
    rely on a local name server to perform the resolution on their behalf. Such a
    server is called a recursive name server; it performs recursive lookups for local
    clients.


    To improve performance, recursive servers cache the results of the lookups they
    perform. Since the processes of recursion and caching are intimately connected,
    the term recursive server and caching server are often used synonymously.


    The length of time for which a record may be retained in the cache of a caching
    name server is controlled by the Time To Live (TTL) field associated with each
    resource.


    # 1.4.5.1. Forwarding


    Even a name server does not necessarily perform the recursive lookup itself. Instead,
    it can forward some or all of the queries that it cannot satisfy from its cache
    to another name server, commonly referred to as a forwarder.


    There may be one or more forwards, and they are queried in turn until the list
    is exhausted or an answer is found. Forwards are typically used when you do not
    wish all the servers at a site to interact directly with the Internet servers.
    A typical scenario would involve a number of internal DNS servers and an Internet
    firewall. Servers unable to pass packets through the firewall forward to the server
    that can do it, and that server query the Internet DNS servers on the internal
    server''s behalf. An added benefit of using the forwarding feature is that the
    central machine develops a much more complete cache of information that all the
    clients can take advantage of.


    # 1.4.6. Name Servers in Multiple Roles


    The BIND name server can simultaneously act as a master for some zones, a slave
    for other zones, and as a caching (recursive) server for a set of local clients.


    However, since the functions of authoritative name service and caching/recursive
    name service are logically separate, it is often advantageous to run them on separate
    servers. A server that only provides authoritative name service (an authoritative-only
    server) can run with recursion disabled, improving reliability and security. A
    server that is not authoritative for any zones and provides recursive service
    to local clients (a caching-only server) does not need to be reachable from the
    Internet at large and can be placed inside a firewall.'
  merge: -1
  img_proc: true
