- pgno: 70
  md: '# datasize


    The maximum amount of data memory the server may use. The default is default.
    This is a hard limit on server memory usage. If the server attempts to allocate
    memory in excess of this limit, the allocation will fail, which may in turn leave
    the server unable to perform DNS service. Therefore, this option is really useful
    as a limiting of the amount of memory used by the server, but it can be used to
    raise an operating system data size limit that is too small by default. If you
    wish to limit the amount of memory used by the server, use the max-cache-size
    and recursive-clients options instead.


    # files


    The maximum number of files the server may have open concurrently. The default
    is unlimited.


    # stacksize


    The maximum amount of stack memory the server may use. The default is default.


    # 6.2.14.8. Server Resource Limits


    The following options set limits on the server''s resource consumption that are
    enforced internally by the server rather than the operating system.


    # max-ifr-log-size


    This option is obsolete; it is accepted and ignored for BIND 8 compatibility.


    # recursive-clients


    The maximum number of simultaneous recursive lookups the server will perform on
    behalf of clients. The default is 1000. Because each recursive client uses a fair
    bit of memory, on the order of 20 kilobytes, the value of the recursive-clients
    option may be decreased on hosts with limited memory.


    # tcp-clients


    The maximum number of simultaneous TCP connections that the server will accept.
    The default is 100.


    # max-cache-size


    The maximum amount of memory to use for the server''s cache, in bytes. When the
    amount of data in the cache reaches this limit, the server will cause records
    to expire prematurely so that the limit is not exceeded. In a server with multiple
    views, the limit applies separately to the cache of each view.'
