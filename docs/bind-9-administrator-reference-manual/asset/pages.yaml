- pgno: 18
  md: '# Chapter 3. Nameserver Configuration


    | 600 | IN | A | 10.0.0.3 |


    When a resolver queries for these records, BIND will rotate them and respond to
    the query with the records in a different order. In the example above, clients
    will randomly receive records in the order 1, 2; 3; 2, 1; and 3, 1, 2. Most clients
    will use the first record returned and discard the rest.


    For more detail on ordering requests, check the **rrset-order** in the **options**
    statement, see **RRset Ordering**. This substatement is not supported in BIND
    9, and only the ordering scheme described


    # 3.3. Notify


    DNS Notify is a mechanism that allows master nameservers to notify their slave
    servers of changes to a zone''s data. In response to a **NOTIFY** from a master
    server, the slave will check to see that its version of the zone is the current
    version and, if not, initiate a transfer.


    DNS Notify is fully documented in RFC 1996. See also the description of the zone
    option **also-notify**, see Section 6.2.14.6. For more information about **notify**,
    see Section 6.2.14.1.


    # 3.4. Nameserver Operations


