    #  6.12.2 lwres Statement Definition and Usage


    The lwres configures the name server to also act as a lightweight resolver server,
    see Section 5.2. There may be multiple lwres statements configuring lightweight
    resolver servers with different properties.

    The listen-on statement specifies a list of addresses (and ports) that this instance
    of a lightweight daemon may accept requests on. If no port is specified, port
    921 is used. If this statement is omitted, requests will be accepted on 127.0.0.1,
    port 921.

    The view statement binds this instance of a lightweight resolver daemon to a view
    in the DNS namespace, that the response will be constructed in the same manner
    as a normal DNS query matching this view. If this statement is omitted, the default
    view is used, and if there is no default view, an error is triggered.

    The search statement is equivalent to the search statement in /etc/resolv.conf.
    It provides a list of domains which are appended to relative names in queries.

    The ndots statement is equivalent to the ndots statement in /etc/resolv.conf.
    It indicates the minimum number of dots in a relative domain name that should
    result in an exact match lookup before path elements are appended.


