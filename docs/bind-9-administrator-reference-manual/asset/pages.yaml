- pgno: 59
  md: '# Chapter 6. BIND 9 Configuration Reference


    # version


    The version the server should report via a query of name version.bind in class
    CHAOS. The default is the real version number of this server.


    # directory


    The working directory of the server. Any non-absolute pathnames in the configuration
    file will be taken as relative to this directory. The default location for most
    server output files (e.g. named.run) is this directory. If a directory is not
    specified, the working directory defaults to ''.'', from which the server was
    started. The directory specified should be an absolute path.


    # named-xfer


    This option is obsolete. It was used in BIND 8 to specify the pathname to the
    named-xfer program. In BIND 9, no separate named-xfer program is needed; its functionality
    is built into the name server.


    # tkey-domain


    The domain appended to the names of all shared keys generated with TKEY. When
    a client requests a TKEY exchange, it may may not specify the desired name for
    the key. If present, the name of the shared key will be "client specified part+"+tkey-domain".Otherwise,
    the name of the shared key will be "random hex digits"+"tkey-domain". In most
    cases, the domainname should be the server''s domain name.


    # tkey-dhkey


    The Diffie-Hellman key used by the server to generate shared keys with clients
    using the Diffie-Hellman mode of TKEY. The server must be able to load the public
    and private keys files from the working directory. In most cases, the keyname
    should be the server''s host name.


    # dump-file


    The pathname of the file the server dumps the database to when instructed to do
    so with rndcdumpdb. If not specified, the default is named_dump.db.


    # statistics-file


    The pathname of the file server writes memory usage statistics to exit. If not
    specified, the default is named.memstats.


    > Note: Not yet implemented in BIND 9.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# pid-file


    The pathname of the file server writes its process ID. If not specified, the default
    is /var/run/named.pid. The pid-file is used by programs that want to send signals
    to the running nameserver.


    # statistics-file


    The pathname of the file server appends statistics when instructed to do so using
    rndc stats. If not specified, the default is named.stats in the server''s current
    directory. The format of the file is described in Section 6.2.14.15


    # port


    The UDP/TCP port number the server uses for receiving and sending DNS protocol
    traffic. The default is 53. This option is mainly intended for server testing:
    a server using a port other than 53 will not be able to communicate with the global
    DNS.


    # random-device


    The source of entry to be used by the server. Entropy is primarily needed for
    DNSSEC operations, as TKEY transactions and dynamic update of signed zones. This
    option specifies the device (or file) from which to read entry. If this is a file,
    operations requiring entry will fail when the file has exhausted. If not specified,
    the default value is /dev/random (or equivalent) when present, and none otherwise.
    The random-device option takes effect during the initial configuration load at
    startup time and is ignored on subsequent reloads.


    # 6.2.14.1. Boolean Options


    # auth-nxdomain


    If yes, the AA bit is always set on NXDOMAIN responses, even if the server is
    not actually authoritative. The default is no; this is a change from BIND 8. If
    you are using very old DNS software, you may need to set it to yes.


    # deallocate-on-exit


    This option was used in BIND 8 to enable checking for memory leaks on exit. BIND
    9 ignores the option and always performs the checks.


    # dialup


    If yes, the server treats all zones as if they are doing zone transfers across
    a dial on demand dialup link, which can be brought up by traffic originating from
    this server. This has different effects according to zone type and concentrates
    the zone maintenance so that it happens in a short'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'interval, once every heartbeat-interval and hopefully during the one call.
    It also suppresses some of the normal zone maintenance traffic. The default is
    no.


    The dialup option may also be specified in the view and zone statements, in which
    case it overrides the global dialup option.


    If the zone is a master zone then the server will send out a NOTIFY request to
    all the slaves. This will trigger the zone serial number check in the slave (providing
    it supports NOTIFY) allowing the slave to verify the zone while the connection
    is active.


    If the zone is a slave or stub zone, then the server will suppress the regular
    "zone up to date" (refresh) queries and only perform them when the heartbeat-interval
    expires in addition to adding NOTIFY requests.


    Finer control can be achieved using notify which only sends NOTIFY messages, notify-passive
    which sends NOTIFY messages and suppresses the normal refresh queries, refresh
    which suppresses normal refresh processing and refresh queries when the heartbeat-interval
    expires and passive which just disables normal refresh processing.


    # fake-iquery


    In BIND 8, this option was used enable simulating the obsolete DNS query type
    INQUERY. BIND 9 never does INQUERY simulation.


    # fetch-glue


    This option is obsolete. In BIND 8, fetch-glue yes caused the server to attempt
    to fetch resource records it didn''t have when constructing the additional data
    section of a response. This is now considered a bad idea and BIND 9 never does
    it.


    # has-old-clients


    This option was incorrectly implemented in BIND 8, and is ignored by BIND 9. To
    achieve the intended effect of has-old-clients yes, specify the two separate options
    auth-xdomain yes and rfc2308-type no instead.


    # host-statistics


    In BIND 8, this enables keeping of statistics for every host that the nameserver
    interacts with. With not implemented in BIND 9.


    # maintain-ixfr-base


    This option is obsolete. It was used in BIND 8 to determine whether a transaction
    log was kept for Incremental Zone Transfer. BIND 9 maintains a transaction log
    whenever possible. If you need to disable outgoing incremental zone transfers,
    use provide-ixfr no.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Chapter 6. BIND 9 Configuration Reference


    # minimal-responses


    **If yes**, then when generating responses the server will only add records to
    the authority and additional data sections when they are required (e.g. delegations,
    negative responses). This may improve the performance of the server. The default
    is **no**.


    # multiple-cnames


    This option was used in BIND 8 to allow a domain name to allow multiple CNAME
    records in violation of the DNS standards. BIND 9.2 strictly enforces the CNAME
    rules both in master files and dynamic updates.


    # notify


    **If yes**, then DNS NOTIFY messages are sent when a zone the server is authoritative
    for changes, see Section 3.3. The messages are sent to the servers listed in the
    zone''s NS records (except the master server identified in the SOA NAME field),
    and to any servers listed in the **also-notify** option.


    **If explicit**, notices are sent only to servers explicitly listed using **also-notify**.
    **If no**, no notices are sent.


    The **notify** option may also be specified in the **zone** statement, in which
    case it overrides the **options notify** statement. It would only be necessary
    to turn off this option if it caused slaves to crash.


