    \ a host on the 192.168.4/24 or the 192.168.5/24 network will prefer other addresses\
    \ on its directly connected networks.\n\n```\nsortlist {\n    localhost;\n   \
    \ localnets;\n        192.168.1/24;\n        { 192.168.2/24; 192.168.3/24; };\
    \ // IF the local host\n    192.168.1/24; // THEN first fit on the\n    { 192.168.1/24;\n\
    \        { 192.168.2/24; 192.168.3/24; }; }; // following nets\n    192.168.2/24;\n\
    \    { 192.168.1/24; 192.168.3/24; }; }; // IF on class C 192.168.1\n    192.168.2/24;\n\
    // THEN use .1, .2 or .3\n    { 192.168.1/24; 192.168.3/24; }; };; // IF on class\
    \ C 192.168.2\n    192.168.3/24;\n    { 192.168.1/24; 192.168.2/24; }; };; //\
    \ THEN use .2, .1 or .3\n    { 192.168.4/24; 192.168.5/24; }; }; // IF on class\
    \ C 192.168.3\nfer that net\n    ; // if .4 or .5, pre-\n};\n```\n\nThe following\
    \ example will give reasonable behavior for the local host and hosts on directly\
    \ connected networks. It is similar to the behavior of the address sort in BIND\
    \ 4.9.x. Responses sent to queries from the local host will favor any of the directly\
