    \ 10.0.0.1, 10.0.0.2 and 10.0.0.3, a set of records such as the following means\
    \ clients will connect to each machine one third of the time:\n\n| Name | TTL\
    \ | CLASS | TYPE | Resource Record (RR) Data |\n|---|---|---|---|---||\n| www\
    \ | 600 | IN | A | 10.0.0.1 |\n| | 600 | IN | A | 10.0.0.2 |"
