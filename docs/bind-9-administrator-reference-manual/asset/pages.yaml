  md: "# 6.1.1. Address Match Lists\n\n# 6.1.1.1. Syntax\n\n```\naddress_match_list\
    \ = address_match_list_element ;\n[ address_match_list_element; ... ]\naddress_match_list_element\
    \ = [ ! ] ( ip_address [/length] | \n key_id | acl_name | ( address_match_list\
    \ ) )\n```\n\n# 6.1.1.2. Definition and Usage\n\nMatch lists are primarily used\
    \ to determine access control for various server operations. They are also used\
    \ to define priorities for querying nameservers and to set the addresses on which\
    \ named listen for queries. The elements which constitute an address list can\
    \ be any of the following:\n\n+   - an IP address (IPv4 or IPv6)\n- an prefix\
    \ in the (''-notation)\n- a key ID, defined by the key statement\n- the name of\
    \ an address list previously defined with the acl statement\n- a nested match\
    \ list enclosed in braces\n\nElements can be negated with a leading exclamation\
    \ mark ('!') and the match list names \"any,\" \"none,\" \"localhost\" and \"\
    localnets\" are predefined. More information on those names can be found in the\
    \ description of the acl list.\n\nThe addition of the key clause made of this\
    \ syntactic element something of a misnomer, security keys are used to validate\
    \ access without regard to a host or network address. Nonetheless, the term \"\
    address match list\" is still used throughout the documentation.\n\nWhen a given\
    \ IP address or prefix is compared to an address match list, the list is traversed\
    \ in order until an element matches. The interpretation of a match depends on\
    \ on whether the list is being used for access control, defining listen-on ports,\
    \ or as a topology, and which the element was negated.\n\nWhen used as an access\
    \ control, a non-negated list allows access and a negated match denies access.\
    \ If there is no match, access is denied. The clauses allow-notify, allow-query,\
    \ allow-transfer, update-notify and blacklist use address match lists. Similarly,\
    \ the listen-on option will cause the server to not accept queries on any of the\
    \ machine's addresses which do not match the list.\n\nWhen used with the topology\
    \ clause, a non-negated match returns a distance based on its position on the\
    \ list (the closer the match is to the start of the list, the shorter the distance\
    \ is between it and the server). A negated match will be assigned the maximum\
    \ distance from the server. If there is no match, the address"
