    \ view Statement Definition and Usage\n\nThe view statement is a powerful feature\
    \ of BIND 9 that lets a name server answer DNS query differently depending on\
    \ who is asking. It is particularly useful for splitting DNS setups without having\
    \ to run multiple servers.\\Each view statement defines a view of the DNS namespace\
    \ that will be seen by a subset of clients. A client matches a view if its source\
    \ IP address matches the `address_match_list` of the view's **match-clients**\
    \ clause and its destination IP address matches the `address_match_list` of the\
    \ view's **match-destinations** clause. If not specified, **match-clients** and\
    \ **match-destinations** default to matching all addresses. A view can also be\
    \ specified as **match-recursive-only**, which means that only recursive requests\
    \ from matching clients will match that. The order of the **view** statements\
    \ is significant — a client request will be resolved in the context of the first\
