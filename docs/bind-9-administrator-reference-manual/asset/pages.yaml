  md: "# Chapter 6. BIND 9 Configuration Reference\n\n| controls | declares control\
    \ channels to be used by the rndc utility. |\n include | includes a file. |\n\
    \ key | specifies key information for use in authentication and authorization\
    \ using TSIG. |\n logging | specifies what the server logs, and where the log\
    \ messages are sent. |\n options | controls global server configuration options\
    \ and defaults for other statements. |\n server | sets certain configuration options\
    \ on a per-server basis. |\n trusted-keys | defines DNSSEC keys. |\n view | defines\
    \ a view. |\n zone | defines a zone. |\n\nThe logging and options statements may\
    \ only occur once per configuration.\n\n# 6.2.1. acl Statement Grammar\n\n```\n\
    acl acl-name (\n  address_match_list\n);\n```\n\n# 6.2.2. acl Statement Definition\
    \ and Usage\n\nThe acl statement assigns a symbolic name to an address match list.\
    \ It gets its name from a primary use of address match lists: Access Control Lists\
    \ (ACLs).\n\nNote that an address match list's name must be defined with acl before\
    \ it can be used elsewhere; no forward references are allowed.\n\nThe following\
    \ ACLs are built-in:\n\n| any | Matches all hosts. |\n none | Matches no hosts.\
    \ |\n localhost | Matches the IPv4 addresses of all network interfaces on the\
    \ system. |"
