- pgno: 46
  md: 'C++-style comments start with the two characters // (slash, slash) and continue
    to the end of the physical line. They cannot be continued across multiple physical
    lines; to have one logical comment span multiple lines, each line must use the
    // pair.


    For example:


    ```

    // This is the start of a comment.  The next line

    // is a new comment, even though it is logically

    // part of the previous comment.

    ```


    Shell-style (or per-style, if you prefer) comments start with the character #
    (number sign) and continue to the end of the physical line, as in C++ comments.


    For example:


    ```

    # This is the start of a comment.  The next line

    # is a new comment, even though it is logically

    # part of the previous comment.

    ```


    > Warning

    WARNING: you cannot use the semicolon (;) character to start a comment such as
    you would in a zone file. The semicolon indicates the end of a configuration statement.


    # 6.2. Configuration File Grammar


    A BIND 9 configuration consists of statements and comments. Statements and comments
    are the only elements that can appear without enclosing braces. Many statements
    contain a block of substatements, which are also terminated with a semicolon.


    The following statements are supported:


    | acl | defines a named IP address matching list, for access control and| other
    uses. |'
