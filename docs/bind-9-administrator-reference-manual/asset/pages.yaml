    # 6.2.22.4. Dynamic Update Policies


    BIND 9 supports two alternative methods of granting clients the right to perform
    dynamic updates to a zone, configured with the **allow-update** and **update-policy**
    option, respectively.


    The **allow-update** class works the same way as in previous versions of BIND.
    It grants given clients the permission to update any record of any name in the
