- pgno: 24
  md: '# Chapter 4. Advanced Concepts


    # 4.1. Dynamic Update


    Dynamic update is the term used for the ability under certain conditions to add,
    modify or delete records or RRsets in the master zone zone files. Dynamic update
    is fully described in RFC 2136.


    Dynamic update is enabled on a zone-by-zone basis, by including an allow-update
    or update-policy clause in the zone statement.


    Updating of secure zones (zones using DNSSEC) follows RFC 3007: SIG and NXT records
    affected by updates are automatically regenerated by the server using an online
    zone key. Update authorization is based on transaction signatures and an explicit
    server policy.


    # 4.1.1. The journal file


    All changes to a zone using dynamic update are stored in the zone''s journal file.
    This file is automatically created by the server when the first dynamic update
    takes place. appending the extension .jni to the name of the corresponding zone
    file. The journal file is in a binary format and should not be edited manually.


    The server will also occasionally (''dump'') the complete contents of the updated
    zone to its zone file. This is not done immediately after each dynamic update,
    because that would be too slow when a large zone is updated frequently. Instead,
    the dump is delayed by 15 minutes, allowing additional updates to take place.


    When a server is restarted after a shutdown or crash, it will replay the journal
    file to incorporate into the zone any updates that took after the last zone update.


    Changes from incoming incremental zone transfers are also journalled in a similar
    way.


    The zone files of dynamic zones cannot be normally edited by hand because they
    are not guaranteed to contain the most recent dynamic changes - those are only
    in the journal file. The only way to ensure that the zone file of a dynamic zone
    is up to date is to run rndc.


    If you have to change a zone dynamically, the following procedure will work: Shut
    down the server using rndc (sending a signal or using rndc halt is not sufficient).
    Wait for the server to exit, remove the zone''s .jni file, edit the zone file,
    and restart the server. Removing the .jni file is necessary because the manual
    edits will not be present in the journal, rendering it inconsistent with the contents
    of the zone file.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 4.2. Incremental Zone Transfers (IXFR)


    The incremental zone transfer (IXFR) protocol is a way for slave servers to transfer
    only changed data, instead of having to transfer the entire zone. The IXFR protocol
    is documented in RFC 1995. See Proposed Standards.


    When acting as a master, BIND 9 supports IXFR for those zones where the necessary
    change history information is available. These include master zones maintained
    by dynamic update and slave zones whose data was obtained by IXFR, but not manually
    maintained master zones or by performing a full zone transfer (AXFR).


    When acting as a slave, BIND 9 will attempt to use IXFR unless it is explicitly
    disabled. For more information about disabling IXFR, see the description of the
    request-ixfr clause of the server statement.


    # 4.3. Split DNS


    Setting up different views, or visibility, of DNS to internal and external resources
    is usually referred to as a Split DNS setup. There are several reasons an organization
    would want to set up its DNS this way.


    Common reason for setting up a DNS system is to hide "internal" DNS information
    from "external" clients on the Internet. There is some debate as to whether or
    not this is actually useful. Internal information leaks in many ways (via email
    headers, for example) and most savvy "attackers" can find the information they
    need using other methods.


    Another common reason for setting up a Split DNS system is to allow internal networks
    that are behind filters or in RFC 1918 space (reserved IP space, as documented
    in RFC 1918) to resolve DNS on the Internet. Split DNS can also be used to allow
    mail back into the internal network.


    Here is an example of a DNS setup:


    Let''s say a company Example, Inc. (example.com) has corporate servers that have
    an internal network with Internet Protocol (IP) space and an external demilitarized
    zone (DMZ), or "outside" section of the network, that is available to the public.


    Example, Inc. wants its internal clients to be able to resolve external hostnames
    and to exchange mail with people on the outside. The company also wants its internal
    resolvers to have access to certain internal-only zones that are not available
    at all outside of the internal network.


    In order to accomplish this, the company will set up two sets of nameservers.
    One set will be on the inside network (in the reserved IP space) and the other
    set will be on bastion hosts, which are "proxy" hosts that talk to both sides
    of its network, in the DMZ.


    The internal servers will be configured to forward all queries, except queries
    for site1.internal, site2.internal, site1.example.com, and site2.example.com,
    to the servers in the DMZ.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Chapter 4. Advanced Concepts


    These internal servers will have complete sets of information for site1.example.com,
    site2.example.com, site1.internal and site2.internal.


    To protect the site1.internal and site2.internal domains, the internal nameservers
    must be configured to disallow all queries to these domains from any external
    hosts, including the bastion hosts.


    The external servers, which are on the bastion hosts, will be configured to serve
    the "public" version of the site1 and site2.example.com zones. This could include
    things such as the records for public servers (www.example.com and ftp.example.com),
    and mail exchange (MX) records (a.mx.example.com and b.mx.example.com).


    In addition, the public site1 and site2.example.com zones should have special
    MX records that contain wildcard (*) pointing to the bastion hosts. This is needed
    because external mail servers do not have any other way on how deliver mail to
    internal hosts. With the wildcard records, the mail will be delivered to the bastion
    host, which can then forward it to internal hosts.


    Here''s an example of a wildcard record:


    +   * IN MX 10 external.example.com.


    Now that they can mail on behalf of anything in the internal network, the bastion
    hosts will need to know how to deliver mail to internal hosts. In order for this
    to work properly, the resolvers on the bastion hosts will need to be configured
    to point to the internal nameservers for DNS resolution.


    Queries for internal hosts will be answered by the internal servers, and queries
    for external hostnames will be forwarded back out to the DNS servers on the bastion
    hosts.


    In order for all this to work properly, internal clients will need to be configured
    to query only the internal nameservers for DNS queries. This could also be enforced
    via selective filtering on the network.


    If everything has been set properly, Example, Inc.''s internal clients will now
    be able to:


    +   * Look up any hostnames in the site1 and site2.example.com zones.

    * Look up any hostnames in the site1.internal and site2.internal domains.

    * Look up any hostnames on the Internet.

    * Exchange mail with internal AND external people.


    Hosts on the internal will be able to:

    * Look up any hostnames in the site1 and site2.example.com zones.

    * Exchange mail with anyone in the site1 and site2.example.com zones.


    Here is an example configuration for the setup we just described above. configuration
    information; for information on how to configure your zone files, see Section
    3.1'
