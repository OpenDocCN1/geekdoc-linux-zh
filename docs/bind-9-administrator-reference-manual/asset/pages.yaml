    \ It makes possible to use an existing BIND 8 configuration file in BIND 9 unchanged,\
    \ and still have rndc work the same way as in BIND 8, simply by executing the\
    \ command rndc-confgen -a after BIND 9 is installed.\n\nSince the rndc.key feature\
    \ is intended only to allow the backward-compatible usage of BIND 8 configuration\
    \ files, this feature does not have a high degree of configurability. You cannot\
    \ easily change the key name or the size of the secret, so you should make a rndc.conf\
    \ with your own if you wish to change those things. rndc.key file also has permissions\
    \ set that only the owner of the file (the user named is running) can access it.\
    \ If you desire greater flexibility in allowing other users to access rndc commands\
    \ then you need to create an rndc.conf and make it readable by a group that contains\
    \ the users who have access.\n\nThe UNIX control type of BIND 8 is not supported\
    \ in BIND 9, and is not expected to be added in future releases. If it is present\
    \ in the controls statement from a BIND 8 configuration file, it is ignored and\
    \ a warning is logged.\n\nTo disable the command channel, use an empty controls\
    \ statement: controls { };\n\n# 6.2.5. include Statement Grammar\n\n```\ninclude\
    \ filename;\n```\n\n# 6.2.6. include Statement Definition and Usage\n\nThe include\
    \ statement inserts the specified file at the point that the include statement\
    \ is encountered. The include statement facilitates the administration of configuration\
    \ files by permitting the reading or writing of some things but not others. For\
    \ example, the statement could include private keys that are readable only by\
    \ a nameserver.\n\n# 6.2.7. key Statement Grammar\n\n```\nkey key_id {\n  algorithm\
    \ string;\n  secret string;\n};\n```"
  merge: -1
