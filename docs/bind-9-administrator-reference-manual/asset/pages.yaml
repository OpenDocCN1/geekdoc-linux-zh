  md: 'If you discover that a remote server is giving out bad data, marking it as
    bogus will prevent further

    queries to it. The default value of bogus is no.


    The provide-ifxr clause determines whether the local server, acting as master,
    will respond with

    in incremental zone transfer when the given remote server, a slave, requests it.
    If set to yes, incremental

    transfer will be provided whenever possible. If set to no, all transfers to the
    remote server will be

    onincremental. If not set, the value of the provide-ifxr option in the view or
    global blocks is

    asas a default.


    The request-ifxr clause determines whether the local server, acting as a slave,
    will request incremental

    zones from the given remote server, a master. If not set, the value of the request-ifxr
    option in

    the view or global blocks is used as a default.


    IXFR requests to not support IXFR will automatically fall back to AXFR. Therefore,

    there is no need to manually list servers that support IXFR and which do not;
    the global default of

    yes should always be used. The purpose of the provide-ifxr and request-ifxr clauses
    is to make it possiblento disable disable IXFR even when both master and slave
    claim to support it, for example if one of the

    servers is buggy or corrupts data when IXFR is used. The default is yes.


    The edns clause determines whether the local server will attempt to use EDNS when
    communicating

    the remote server. The server supports two zone transfer methods. The first, one-answer,
    uses DNS message per

    resource transferred. many-answers is more efficient, but is only known to be
    understood by many-answers is possible into message. BIND 9, BIND 8.x, and patched

    versions of BIND 4.9.5. You can specify which method to use for a server with
    the transfer-format

    option. If transfer-format is not specified, the transfer-format specified by
    the options statement will

    used.


    transfers is used to limit the number of concurrent inbound zone specified from
    the remote server. If

    no transfers clause is specified, the limit is set according to the transfers-per-ns.


    The keys clause is used to identify a key-id defined by the key statement, to
    be used for transaction

    security when talking to the remote server. The key statement must come before
    the server statement

    references it. When a request is sent to the remote server, a request signature
    will be generated using

    the key specified here and appended to the message. A request originating from
    the remote server is not

