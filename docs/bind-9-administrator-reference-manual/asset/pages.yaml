- pgno: 85
  md: '# allow-update-forwarding


    Specifies which hosts are allowed to submit Dynamic DNS updates to slave zones
    to be forwarded to the master. The default is `{ none };`, which means that no
    update forwarding will be performed. To enable update forwarding, specify `allow-update-forwarding
    { any };`. Specifying values other than `{ none; }` or `{ any; }` usually counterproductive,
    since the responsibility for update access control should rest rest with the master
    server, not the slaves.


    Note that enabling the update forwarding feature on a slave server may expose
    master servers relying on insecure IP address based access control to attacks;
    see Section 7.3 for more details.


    # also-notify


    Only meaningful if `notify` is active for this zone. The set of machines that
    will receive a DNS NOTICE is made up of all the listed namesvers (other than the
    primary master) plus any IP addresses specified with `also-notify`. A port may
    be specified with each `also-notify` address to send the notify messages to a
    port other than the default of 53. `also-notify` is not meaningful for stub zones.
    The default is the empty list.


    # check-names


    This option was used in BIND 8 to restrict the character set of domain names in
    master files and/or DNS responses received from the network. BIND 9 does not restrict
    the character set of domain names and does not implement the `check-names` option.


    # database


    Specify the type of database to be used for storing the zone data. The string
    following the `database` keyword is interpreted as a list of whitespace-delimited
    words. The first word identifies the database type, and any subsequent words are
    passed as arguments to the database to be interpreted in a way specific to the
    database type.


    The default is `"rbt"`, BIND 9''s native in-memory red-black-tree database. This
    database does not take arguments.


    Other values are possible if additional database drivers have been linked into
    the server. Some sample drivers are included with the distribution but none are
    linked by default.


    # dialup


    See the description of `dialup` in Section 6.2.14.'
