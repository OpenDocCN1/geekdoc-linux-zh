    # 4.4. TSIG


    This is a short guide to setting Transaction Signatures (TSIG) based transaction
    security in BIND. It describes changes to the configuration file as well as what
    changes are required for different features, including the process of creating
    transaction keys and using transaction signatures with BIND.


    BIND primarily supports TSIG for server communication. This includes zone transfer,
    notify, and recursive query messages. Resolvers on newer versions of BIND 8 have
    limited support for TSIG.


    TSIG might be most useful for dynamic update. A primary server for a dynamic zone
    should use access control to control updates, but IP-based access control is important.
    Key-based access control is far superior, see Proposed Standards. The nupdate
    program supports TSIG via the -k and -y command options.


    # 4.4.1. Generate Shared Keys for Each Pair of Hosts


    A secret is generated to be shared between host1 and host2. An arbitrary key name
    is chosen: "host1-host2.\ The key name must be the same on both hosts.


    # 4.4.1.1. Automatic Generation


    The following command will generate a 128 bit (16 byte) HMAC-MD5 key as described.
    Longer keys are better, but easier to digest with MD5. Note that the maximum key
    length is 512 bits; keys longer than what is needed to produce a 128 bit.


    ```

    dnssec-keygen -a hmac-md5 -b 128 -n HOST host1-host2.

    ```


    The key is in the file Khost1-host2+.157+00000.private. Not directly using this
    file, but the base-64 encoded string following "Key:" can be extracted from the
    file and used as a shared secret:


    Key: La/E5cG90+0sl1jq0a2da==


    The string "La/E5cG90+0sl1jq0a2da==" can be used as the shared secret.'
  merge: -1
  img_proc: true
- pgno: 30
  md: "# 4.4.1.2. Manual Generation\n\nThe shared secret is simply a random sequence\
    \ of bits, encoded in base-64. Most ASCII strings are valid base-64 (assuming\
    \ the length is a multiple of 4 and only valid characters are used), so the shared\
    \ secret can be manually generated.\n\nAlso, a known string can be run through\
    \ mmencode or a similar program to generate base-64 encoded data.\n\n# 4.4.2.\
    \ Copying the Shared Secret to Both Machines\n\nThis is beyond the scope of transport.\
    \ A secure transport mechanism should be used. This could be secure FTP, ssh,\
    \ telephone, or.\n\n# 4.4.3. Informing the Servers of the Key's Existence\n\n\
    Imagine host1 and host 2 are both servers. The following is added to each server's\
    \ named.conf file:\n\n```\nkey host1-host2. {\n  algorithm hmac-md5;\n  secret\
    \ \"LaESCJG90+0sljqq0a2jdA==\";\n}\n```\n\nThe algorithm, hmac-md5, is the only\
    \ one supported by BIND. The secret is the one generated above. Since this is\
    \ a secret, it is recommended that either named.conf be non-world readable, or\
    \ the key directive be added to a non-world readable file that is included by\
    \ named.conf.\n\nAt this point, the key is recognized. This means that if the\
    \ server receives a message signed by this key, it can verify the signature. If\
    \ the signature succeeds, the response is signed by the same key.\n\n# 4.4.4.\
    \ Instructing the Server to Use the Key\n\nSince keys are shared between two hosts,\
    \ only the server must be told when keys are to be used. The following is added\
    \ to the named.conf file for host1, if the IP address of host2 is 10.1.2.3:\n\n\
    ```\nserver 10.1.2.3 {\n  keys { host1-host2. };\n}\n```"
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Chapter 4. Advanced Concepts


    Multiple keys may be present, but only the first is used. This directive does
    not contain any secrets, so it may be in a world-readable file.


    If host1 sends a message that is a request to that address, the message will be
    signed with the specified key; host1 will expect any responses to signed messages
    to be signed with the same key.


    A similar statement must be present in host2''s configuration file (with host1''s
    address) for host2 to sign request messages to host1.


    # 4.4.5. TSIG Key Based Access Control


    BIND allows IP addresses and ranges to be specified in ACL definitions and allow-{
    query | transfer | update }; This has been extended to allow TSIG keys also. The
    above key would be denoted host1-host2.


    An example of an allow-update directive would be:


    ```

    allow-update { key host1-host2. };

    ```


    This allows dynamic updates to succeed only if the request was signed by a key
    named "host1-host2". You want to read about the more powerful update-policy statement
    in Section 6.2.22.4.


    # 4.4.6. Errors


    The processing of TSIG signed messages can result in several errors. If a signed
    message is sent to a non-TSIG aware server, a FORMERR will be returned, since
    the server will not understand the record. This is a result of misconfiguration,
    since the server must be explicitly configured to send a TSIG message to a specific
    server.


    If a TSIG aware server receives a message signed by an unknown key, the response
    will be unsigned with the TSIG extended error code set to BADKEY. If a TSIG aware
    server receives a message with a signature that does not validate, the response
    will be unsigned with the TSIG extended error code set to BADSIG. If a TSIG aware
    server receives a message with a time outside of the allowed range, the response
    will be signed with the TSIG extended error code set to BADTIME, and the time
    values will be adjusted so that the response can be successfully verified. In
    any of these cases, the message''s rcode is set to NOTAUTH.


    32'
  merge: -1
  img_proc: true
- pgno: 32
  md: "# 4.5. TKEY\n\nTKEY is a mechanism for automatically generating a shared secret\
    \ between two hosts. There are several “modes” of TKEY that specify how the key\
    \ is generated or assigned. BIND implements only one of these modes, the Diffie-Hellman\
    \ KEY exchange. Both hosts are required to have a Diffie-Hellman KEY record (although\
    \ this record is not required to be present in a zone). The TKEY process must\
    \ use sign messages, signed either by TSIG or any appropriate keys. The server\
    \ of TKEY is a shared secret that can be used to sign messages with TSIG. TKEY\
    \ can also be used to delete shared secrets that it had previously generated.\n\
    \nThe TKEY process is initiated by a client or server by sending a signed TKEY\
    \ query (including any appropriate keys) to a TKEY-aware server. The server response,\
    \ if it succeeds, will contain a TKEY record and after this exchange, both participants\
    \ have enough information to determine the shared secret; the exact process depends\
    \ on the TKEY mode. When using the Diffie-Hellman TKEY mode, Diffie-Hellman keys\
    \ are exchanged, and the shared secret is derived by both participants.\n\n# 4.6.\
    \ SIG(0)\n\nBIND 9 partially supports DNSSEC SIG(0) transaction signatures as\
    \ specified in RFC 2535. SIG(0) uses public/private keys to authenticate messages.\
    \ Access control is performed in the same manner as TSIG keys; privileges can\
    \ be granted or denied based on the key name. \n\nWhen a SIG(0) signed message\
    \ is received, it will only be verified if the key is known and trusted by the\
    \ server; the server will not attempt to locate and/or validate the key.\n\nSIG(0)\
    \ signing of multiple-message TCP streams is not supported.\n\nBIND 9 does not\
    \ ship with any tools that generate SIG(0) signed messages.\n\n# 4.7. DNSSEC\n\
    \nCryptographic authentication of DNS information is possible through the DNS\
    \ Security (DNSSEC) extensions, defined in RFC 2535. This section describes the\
    \ creation and use of DNSSEC signed zones.\n\nIn order to set up a DNSSEC secure\
    \ zone, there are a series of steps which must be followed. BIND 9 ships with\
    \ several tools that are used in this process, which are explained in more detail.\
    \ In all cases, the “-h” option prints a full list of parameters. Note that the\
    \ DNSSEC tools use the keyset and signedkey files to be in the working directory,\
    \ and the tools shipped with BIND 9.0.x are not fully compatible with the current\
    \ ones."
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Chapter 4. Advanced Concepts


    There must also be communication with the administrators of the parent and/or
    child zone to transmit keys and signatures. A zone''s security status must be
    indicated by the parent zone for DNSSEC capable resolver to trust its data.


    For other servers to trust data in this zone, they must either be statically configured
    with this zone''s zone key or the key of any zone above this one in the DNS tree.


    # 4.7.1. Generating Keys


    The dnskeygen program is used to generate keys.

    A secure zone must contain one or more zone keys. The zone keys will sign all
    records in the zone, as well as the zone keys must have the same name as the zone,
    a name type ZONE, and be used for authentication. It is recommended that zone
    keys use a cryptographic algorithm designed as "mandatory to implement" by the
    IETF; currently these are RSA1 (which is not supported in BIND 9.2) and DSA.


    The following command will generate a 768 bit DSA key for the child.example zone:


    ```

    dnsseckey -a DSA -b 768 -n ZONE.example.

    ```


    Two output files will be produced: Rchild.example,+00312345.key and Rchild.example,+00312345.private
    (where 12345 is an example of a key tag). The key file names the key name (child.example.),
    algorithm (3 is DSA, 1 is RSA, etc.), and the key tag (12345 in this case). The
    private key (in the .private file) is used to generate signatures, and the public
    key (in the .key file) is used for signature verification.


    To generate another key with the same properties (but with a different tag), repeat
    the command.


    The public keys should be inserted into the zone file with INCLUDE statements,
    including the .key files.


    # 4.7.2. Creating a Keyset


    The dnsmakekeysyset program is used to create a keyset from one or more keys.


    Once the keys have been generated, a keyset must be built for transmission to
    the administrator of the parent zone, so that the parent zone can sign the keys
    with its own zone key and correctly indicate the security status of this zone.
    Building a keyset, the list of keys to be included and the TTL of the set must
    be specified, and the desired signature validity period of the parent''s signature
    may also be specified.


    34'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The list of keys to be inserted into the key set may also included non-zone
    keys present at the top of the zone. dnssec-makekeyset may also be used at other
    names in the zone.


    The following command generates a key set containing the above key and another
    key similarly, generated with a TTL of 3600 and a signature validity period of
    10 days starting from now.

    dnssec-makekeyset -t 3600 -e +864000 Kchild.example.+003+12345

    Kchild.example.+003+23456


    One output file is produced: keyset-child.example.. This file should be transmitted
    to the parent to be signed. It includes the keys, as well as signatures over the
    key set generated by the zone keys themselves, which are used to prove ownership
    of the private keys and ensure the desired validity period.


    # ## 4.7.3. Signing the Child''s Keyset


    The dnssec-signkey program is used to sign one child''s keyset.

    If the child.example has any delegations which are secure, for example,

    grand.child.example, the child administrator should receive keyset files for each
    secure subzone. These keys must be signed by this zone keys.


    The following command signs the child''s keyset with the zone keys:

    dnssec-signkey keyset-grand.child.example. Kchild.example.+003+12345

    Kchild.example.+003+23456


    One output file is produced: signedkey-grand.child.example.. This file should
    be both transmitted back to the child and retained. It includes all keys (the
    child''s keys) from the keyset file and signatures generated by this zone keys.


    # ## 4.7.4. Signing the Zone


    The dnssec-signzone program is used to sign a zone.

    Any signedkey files corresponding to secure subzones will be present, as well
    as a signedfile for this zone generated by the parent (if there is one). The zone
    signer will generate NXT and SIG records for the zone, as well incorporate the
    zone key signature from the parent and indicate the security status at all delegation
    points.


    The following command signs the zone, assuming it is in a file called zone.child.example.
    By default, all zone keys which have an available private key are used to generate
    signatures.


    ```

    dnssec-signzone -o child.example zone.child.example

    ```'
