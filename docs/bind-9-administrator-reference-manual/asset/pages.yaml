- pgno: 80
  md: "# Chapter 6. BIND 9 Configuration Reference\n\nZones defined within a view\
    \ statement will only be accessible to clients that match the view. By defining\
    \ a zone of the same name in multiple views, different data can be given to different\
    \ clients, for example, \"internal\" and \"external\" clients in a split DNS setup.\n\
    \nMany of the options in the options statement can also be used within a view\
    \ statement, and then apply only when resolving queries with this view. When no\
    \ view-specific value is given, the value in the options statement is used as\
    \ a default. Also, zone options can be specified in the view statement; these\
    \ view-specific defaults take precedence over those in the options statement.\n\
    \nViews are class specific. If no class is given, class IN is assumed. Note that\
    \ all non-IN views must contain a hint zone, since only the IN class has compiled-in\
    \ default hints.\n\nIf there are no view statements in the config file, a default\
    \ view that matches any client is automatically created in any zone statements\
    \ specified on the top level of the configuration file are considered to be part\
    \ of this default view. If any explicit view statements are present, all zone\
    \ statements must occur inside view statements.\n\nHere is an example of a split\
    \ DNS setup implemented using view statements.\n\n```\nview \"internal\" {\n \
    \   // This should match our internal networks.\n    match-clients { 10.0.0.0/8\
    \ };\n    // Provide recursive service to internal clients only.\n    recursion\
    \ yes;\n    // Provide a complete view of the example.com zone\n    // including\
    \ addresses of internal hosts.\n    zone \"example.com\" {\n        type master;\n\
    \        file \"example-internal.db\";\n    }\nnview \"external\" {\n    match-clients\
    \ { any };\n    // Refuse recursive service to external clients.\n    recursion\
    \ no;\n    // Provide a restricted view of the example.com zone\n    // containing\
    \ only publicly accessible hosts.\n    zone \"example.com\" {\n        type master;\n\
    \        file \"example-external.db\";\n    }\n}\n```"
  merge: -1
  img_proc: true
