- pgno: 51
  md: "# 6.2.10. logging Statement Definition and Usage\n\nThe logging statement configures\
    \ a wide variety of logging options for the nameserver. Its channel phrase associates\
    \ output methods, format options and severity levels with a name that can then\
    \ be used with the category phrase to select how various classes of messages are\
    \ logged.\nOnly logging statement is used to define as many channels and categories\
    \ are wanted. If there is no logging statement, the logging configuration will\
    \ be:\n\n```\nlogging {\n  category \"unmatched\" { \"null\"; };\n  category \"\
    default\" { \"default_syslog\"; \"default_debug\"; };\n}\n```\n\nIn BIND 9, the\
    \ logging configuration is only established when the entire configuration file\
    \ has been parsed. In BIND 8, it was established as soon as the logging statement\
    \ was parsed. When the server is starting, all logging messages regarding syntax\
    \ errors in the configuration file go to the default channels, or to standard\
    \ error if the -g option was specified.\n\n# 6.2.10.1. The channel Phrase\n\n\
    All log output to one or more channels; you can make as many of them as you want.\n\
    \nEvery channel definition must include a destination clause that says messages\
    \ selected for the channel go to a file, to a particular syslog facility, to the\
    \ standard error, or are discarded. You can optionally limit the severity level\
    \ that will be accepted by the channel (the default is info), and whether to include\
    \ a named-generated time stamp, the category name and/or severity level (the default\
    \ is not to include any).\n\nThe null destination clause causes all messages sent\
    \ to the channel to be discarded; in that case, other options for the channel\
    \ are meaningless.\n\nThe file destination directs the channel to a disk file.\
    \ It can include limits how large the file is allowed to grow, and how many versions\
    \ of the file will be saved each time the file is opened.\nIf you use versions\
    \ log file option, then named will retain that many backup versions of the file\
    \ by renaming them when opening. For example, if you choose 3 old versions of\
    \ the file lamers.log then just lamers.log.1 is renamed to lamers.log.2, lamers.log.0\
    \ is renamed to lamers.log.1, and lamers.log is renamed to lamers.log.0. You can\
    \ say unlimited; to limit the number of versions. If a size option is associated\
    \ with the log file, then renaming is only done when the file being opened exceeds\
    \ the indicated size. No backup versions are kept by default; any existing log\
    \ file is simply appended.\n\nThe size option for files is used to limit log growth.\
    \ If the file ever exceeds the size, then named will stop writing to the file\
    \ unless it has a versions option associated with it. If backup versions are kept,\
    \ the file"
  merge: -1
  img_proc: true
- pgno: 52
  md: "are rolled as described above and a new one begins. If there are no versions\
    \ option, no more data will be written to the log until some out-of-band mechanism\
    \ removes or truncates the log to less than the maximum size. The default behavior\
    \ is not to limit the size of the file.\n\nExample usage of the size and versions\
    \ options:\n\n```\nchannel \"an_example_channel\" {\n    file \"example.log\"\
    \ versions 3 20m;\n    print-time yes;\n    print-category yes;\n}\n```\n\nThe\
    \ syslog clause directs the channel to the system log. Its argument is a syslog\
    \ facility as described in the syslog page. How syslog handles messages sent to\
    \ it is described in the syslog.conf page. If you have a system that uses a older\
    \ version of syslog that only two arguments to the open(), this clause is silently\
    \ ignored.\n\nThe severity clause works like syslog \"priorities,\" except that\
    \ they can also be used if you are writing straight to a file rather than using\
    \ syslog. Messages which are not at the severity level given will not be selected\
    \ for the channel; messages of higher severity levels will be accepted.\n\nIf\
    \ you are using syslog, then the syslog.conf priorities passes through. For example,\
    \ defining a channel and severity as daemon and debug only logging daemon via\
    \ syslog will cause messages of info and notice to be dropped. If the situation\
    \ were reversed, with named messages of only warning or higher, then syslog would\
    \ print all messages received from the channel.\n\nThe stderr clause directs the\
    \ channel to the server's standard error. This is intended for use when the server\
    \ is running as a foreground process, for example when debugging a configuration.\n\
    The server can supply extensive debugging information when it is in debugging\
    \ mode. If the server's global debug level is greater than zero, then debugging\
    \ mode will be active. The global debug level is set by either starting the named\
    \ with the -d flag followed by a positive integer, or by running rndc trace. The\
    \ global debug level can be set to zero, and higher debug level gives more detailed\
    \ output. Channels that provide a specific debug severity, for example:\n\n```\n\
    channel \"specific_debug_level\" {\n    file \"foo\";\n    severity debug 3;\n\
    }\n```\n\nwill get debugging output of level 3 or less any time the server is\
    \ in debugging mode, regardless of the global debug level. Channels with dynamic\
    \ severity use the server's global level to determine what\nmessages to print."
  merge: -1
  img_proc: true
- pgno: 53
  md: "If print-time has been turned on, then the date and time will be logged. print-time\
    \ may be specified for a syslog channel, which is usually pointless since syslog\
    \ also prints the date and time. If print-category is requested, then the category\
    \ of the message will be logged as well. If, print-severity is on, the severity\
    \ level of the message will be logged. The print- options may be used in any combination,\
    \ and will always be printed in the following order: time, category, severity.\
    \ Here is an example where all three print-options are on:\n\n```\n28-Feb-2000\
    \ 15:05:32.863 general: notice: running\n```\n\nThere are four defined channels\
    \ that are used for named's default logging as follows. How they are is described\
    \ in Section 6.2.10.2.\n\n```\nchannel \"default_syslog\" {\n    syslog daemon;\\\
    \                  // send to syslog's daemon\n                             //\
    \ facility\n    severity info;\\                 // only send priority info\n\
    \                             // and higher\n}\n```\n\n```\nchannel \"default_debug\"\
    \ {\n    file \"named.run\";            // write to named.run in\n           \
    \                  // the working directory\n                             // Note:\
    \ stderr is used instead\n                             // of \"named.run\"\n \
    \                            // if the server is started\n                   \
    \          // log at the server's\n    severity dynamic;\\            // with\
    \ the '-f' option.\n                             // current debug level\n}\n```\n\
    \n```\nchannel \"default_stderr\" {\n    stderr;                        // writes\
    \ to stderr\n    severity info;\\                 // only send priority info\n\
    \                             // and higher\n}\n```\n\n```\nchannel \"null\" {\n\
    \    null;                          // toss anything sent to\n               \
    \              // this channel\n}\n```\n\nThe default_debug has the special property\
    \ that it produces output when the server's debug level is nonzero. It normally\
    \ writes to a file named.run in the server's working directory."
  merge: -1
  img_proc: true
- pgno: 54
  md: "# Chapter 6. BIND 9 Configuration Reference\n\nFor security reasons, when the\
    \ \"-u\" command line option is used, the named.run file is created only after\
    \ named has changed to the new UID, and any debug output generated while named\
    \ is starting up and still running as root. If you need to capture this output,\
    \ you must run the server with the \"-g\" option and redirect standard error to\
    \ a file.\n\nOnce a channel is defined, it cannot be redefined. Thus you can alter\
    \ the built-in channels directly, but you can modify the default logging by pointing\
    \ channels at channels you have defined.\n\n# 6.2.10.2. The category Phrase\n\n\
    There are many categories, so you can send the logs wherever you want, without\
    \ seeing logs you don't want. If you don't specify a list of channels for a category,\
    \ then log messages in that category will be sent to the default category instead.\
    \ If you don't specify a default category, the following \"default\" is used:\n\
    \n```\ncategory \"default\" { \"default_syslog\"; \"default_debug\"; };\n```\n\
    \nAs an example, if you want to log security events to a file, but you also want\
    \ to keep the default behavior. You specify the following:\n\n```\nchannel \"\
    my_security_channel\" {\n    file \"my_security_file\";n    severity info;\n}\n\
    category \"security\" {\n    my_security_channel;\n    default_syslog;\n    default_debug;\n\
    }\n\n```\n\nTo discard all messages in a category, specify the null channel:\n\
    \n```\ncategory \"xfer-out\" { \"null\"; }\ncategory \"notify\" { \"null\"; };\n\
    ```\n\nFollowing are the available categories and brief descriptions of the types\
    \ of log information they contain. More categories may be added in future BIND\
    \ releases.\n\n| default | The default category defines the logging options for\
    \ those categories where no specific configuration has been defined. |"
  merge: -1
  img_proc: true
