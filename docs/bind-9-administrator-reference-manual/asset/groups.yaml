    first, the default, causes the server to query the forwarders first, and if that
    doesn''t answer the question the server will then look for the answer itself.
    If only is specified, the server will only query the forwarders.


    # forwarders


    Specifies the IP addresses to be used for forwarding. The default is the empty
    list (no forwarding).'
