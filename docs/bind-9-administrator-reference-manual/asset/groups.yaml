    \ { yes_or_no };\n    [ view_option, ... ]\n    [ zone_statistics yes_or_no ]\n\
    \    [ zone_statement; ... ]\n};\n```\n\n## 6.2.20. view Statement Definition\
    \ and Usage\n\nThe view statement is a powerful feature of BIND 9 that lets a\
    \ name server answer DNS query differently depending on who is asking. It is particularly\
    \ useful for splitting DNS setups without having to run multiple servers. Each\
    \ view statement defines a view of the DNS namespace that will be seen by a subset\
    \ of clients. A client matches a view if its source IP address matches the `address_match_list`\
    \ of the view's **match-clients** clause and its destination IP address matches\
    \ the `address_match_list` of the view's **match-destinations** clause. If not\
    \ specified, **match-clients** and **match-destinations** default to matching\
    \ all addresses. The order of the **view** statements is significant — a client\
    \ request will be resolved in the context of the first **view** that it matches.\n"
  mdcn: "\n\n注意：BIND9 尚未实现。\n\n## sig-validity-interval\n\n指定由于动态更新（第 4.1 节）自动生成的\
    \ DNSSEC 签名在未来的过期天数。默认值为 30 天。签名的起始时间（inception time）无条件地设置为当前时间的前一小时，以允许有限的时钟偏移。\n\
    \n- min-refresh-time\n- max-refresh-time\n- min-retry-time\n\n这些选项控制服务器在刷新区域（查询\
    \ SOA 变化）或重试失败的传输时的行为。通常使用区域的 SOA 值，但这些值是由主服务器设置的，服务器管理员对这些内容的控制权很小。\n\n这些选项允许管理员按区域、按视图（view）或全局设置最小和最大刷新及重试时间。这些选项适用于从区域（slave\
    \ zones）和根区域（stub zones），并将 SOA 刷新和重试时间限制在指定的值。\n\n## 6.2.14.15. 统计文件\n\nBIND\
    \ 9 生成的统计文件与 BIND 8 生成的相似，但并不相同。\n\n统计转储以 `++ Statistics Dump ++++ (97398949)`\
    \ 行开始，括号中的数字是 Unix 风格的时间戳，以自 1970 年 1 月 1 日起的秒数。该行之后是一系列行，包含计数器类型、计数器值、可选的区域名称以及可选的视图名称。未列出视图和区域的行是整个服务器的全局统计数据。带有区域和视图名称的行对应给定的视图和区域（默认视图省略视图名称）。统计转储以\
    \ `— Statistics Dump — (97398949)` 行结束，该数字与起始行的数字相同。\n\n维护了以下统计计数器：\n\n|计数器 |\
    \ 说明 |\n| :--- | :--- |\n| success | 向服务器或区域进行的成功查询数。成功查询定义为返回除引导响应（referral response）外的\
    \ NOERROR 响应的查询。 |\n| referral | 产生引导响应（referral responses）的查询数。 |\n| nxrset |\
    \ 产生无数据 NOERROR 响应的查询数。 |\n| nxdomain | 产生 NXDOMAIN 响应的查询数。 |\n| recursion | 导致服务器执行递归以查找最终答案的查询数。\
    \ |\n| failure | 产生除上述之外失败响应的查询数。 |\n\n## 6.2.15. server 语句语法\n\n```\nserver ip_addr\
    \ {\n  [ bogus yes_or_or_no ; ]\n  [ provide-ifxr yes_or_or_no ; ]\n  [ request-ifxr\
    \ yes_or_or_no ; ]\n  [ edns yes_or_or_no ; ]\n  [ transfers number ; ]\n  [ transfer-format\
    \ ( one-answer | many-answers ) ; ; ]\n  [ keys { string ; { string ; {...} }\
    \ } ; ; ]\n}\n```\n\n## 6.2.16. server 语句定义与用法\n\nserver 语句定义了与远程名称服务器相关的特征。\n\
    server 语句可以出现在配置文件的顶层，也可以视图语句内部。如果视图语句包含一个或多个 server 语句，则只有这些适用于该视图，任何顶层语句将被忽略。如果视图不包含\
    \ server 语句，则任何顶层 server 语句将作为默认值。\n\n如果你发现远程服务器正在提供错误数据，将其标记为 bogus（虚假的）将防止对其进行进一步查询。bogus\
    \ 的默认值为 no。\n\nprovide-ifxr 子句决定了作为主服务器的本地服务器在给定的远程服务器（从区域）请求时，是否会通过增量区域传输进行响应。如果设置为\
    \ yes，只要可能，将提供增量传输。如果设置为 no，到远程服务器的所有传输都将是非增量的。如果未设置，则使用视图或全局块中 provide-ifxr 选项的值作为默认值。\n\
    \nrequest-ifxr 子句决定了作为从区域的本地服务器是否向给定的远程服务器（主服务器）请求增量区域。如果没有设置，则使用视图或全局块中 request-ifxr\
    \ 选项的值作为默认值。\n\n不支持 IXFR 的 IXFR 请求会自动回退到 AXFR。因此，没有必要手动列出支持 IXFR 和不支持 IXFR 的服务器；应该始终使用全局默认值\
    \ yes。provide-ifxr 和 request-ifxr 子句的目的是即使在主、从区域都声称支持 IXFR 的情况下也能禁用 IXFR，例如如果其中一个服务器存在\
    \ bug 或者在使用 IXFR 时会损坏数据。默认值为 yes。\n\nedns 子句决定了本地服务器在与远程服务器通信时是否尝试使用 EDNS。服务器支持两种区域传输方法。第一种\
    \ one-answer 为每个传输的资源使用一个 DNS 消息。many-answers 效率更高，但只有 many-answers 被理解。BIND 9、BIND\
    \ 8.x 以及补丁版本支持。你可以为 server 指定使用这种方法。如果未指定 transfer-format，将使用 options 语句指定的 transfer-format。\n\
    \ntransfers 用于限制来自远程服务器的并发区域传输数量。如果没有指定 transfers，将根据 transfers-ns 限制。\n\nkeys\
    \ 子句用于识别由 key 语句定义的密钥，用于与服务器通信。key 语句必须位于 server 语句之前。当发送到远程服务器的请求将使用此处指定的密钥签名。来自远程服务器的请求不需要此密钥签名。\n\
    \n虽然 keys 子句允许多个密钥，但每个服务器仅支持单个密钥。\n\n## 6.2.17. trusted-keys 语句语法\n\n```\ntrusted-keys\
    \ {\n  string number number string;\n  [ string number number string;]]\n```\n\
    \n## 6.2.18. trusted-keys 语句定义与用法\n\ntrusted-keys 语句定义了 DNSSEC 安全根。DNSSEC 见第 4.7\
    \ 节。当非权威区域的公钥已知但无法通过 DNS 安全获取时，定义安全根（它是 根区域或其父区域未签名）。一旦密钥被配置为信任密钥，它将被视为已验证并证明是安全的。解析器对安全根下的所有\
    \ DNS 数据进行 DNSSEC 验证。\ntrusted-keys 语句可以包含多个密钥项，每项都包含密钥的域名、标志、协议、算法以及密钥数据的 base64\
    \ 表现法。\n\n## 6.2.19. view 语句语法\n\n```\nview view_name [class] {\n    match-clients\
    \ { address_match_list };\n    match-destinations { address_match_list };\n  \
    \  match-recursive-only { yes_or_no };\n    [ view_option, ... ]\n    [ zone_statistics\
    \ yes_or_no ]\n    [ zone_statement; ... ]\n};\n```\n\n## 6.2.20. view 语句定义与用法\n\
    \nview 语句是 BIND 9 的强大功能，允许名称服务器根据提问者回答不同的 DNS 查询。它对于拆分 DNS 设置而无需运行多个服务器特别有用。每个\
    \ view 语句定义了一个子集客户端看到的 DNS 命名空间视图。如果客户端的源 IP 地址匹配视图 match-clients 子句的 address_match_list，且其目的\
    \ IP 地址匹配视图 match-destinations 子句的 address_match_list，则该客户端匹配该视图。如果未指定，match-clients\
    \ 和 match-destinations 默认匹配所有地址。view 语句的顺序具有重要意义——客户端请求将在其匹配的第一个 view 上下文中解析。\n\
    \n"
