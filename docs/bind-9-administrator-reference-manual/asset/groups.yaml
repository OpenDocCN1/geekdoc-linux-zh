    ## 附录 A 附录


    ### A.1 致谢


    ### A.1.1. DNS 和 BIND 简史


    尽管域名系统的“官方”起源于 1984 年 RFC 920 的发布，但新系统的核心内容在 1983 年的 RFC 882 和 883 中已被描述。从 1984
    年到 1987 年，ARPANet（今日互联网的前身）成为了一个实验平台，用于在快速扩张的运行网络环境中开发新的命名/寻址方案。1987 年编写并发布了新的
    RFC，它们修改了原始文档，以纳入基于工作模型的改进。RFC 1034《域名 - 概念与设施》和 RFC 1035《域名 - 实现与规范》被相继发布，并成为所有
    DNS 实现的基础。


    第一个名为“Jeeves”的域名服务器由 Paul Mockapetris 在 1983-84 年于南加州大学信息科学研究所（US-ISI）和 SRI 国际网络中心（SRI-NC）的
    DEC Tops-20 机器上编写。不久后，加利福尼亚大学伯克利分校的一组研究生在美国国防高级研究计划署（DARPA）的资助下，编写了用于大学的互联网域名（BIND）软件包。BIND
    4.8.3 之前的版本由加州大学伯克利的计算机科学组（CSRG）维护，Douglas Terry、Mark Painter、David Ripple 和周春组成了最初的
    BIND 项目团队。在来自数字设备公司借调至 CSRG 的员工 Ralph Campbell 和 Kevin Dunlap 对软件包完成额外工作后，他们在
    1985 年到 1987 年间维护了 2 年 BIND。许多其他人也对 BIND 的开发做出了贡献：Doug Kingston、Craig Partridge、Smart
    Carl-Mitchell、Mike Jim Bloom 和 Mike Schwartz。BIND 的后续维护由 Mike Karels 和 O. K. 负责。


    数字设备公司（现为 Compaq 公司）发布了 BIND 4.9.1 版本。当时担任 DEC 员工的 Paul Viese 成为 BIND 的主要维护者。Phil
    Alquist、Robert Elz、Jan Barrett、Paul Albitz、Bryan Beecher、Andrew Part、Andrew Cherenson、Tom
    Limcinelli、Berthold Alffrath、Faisal Baaran、Anant Kumar、Art Hardin、Win Treese、Don
    Lewis、Christophe Wolffugel 等人的协助。


    BIND 4.9.2 版本由 Wix Enterprises 赞助。Paul Viese 成为 BIND 的首席架构师/程序员。


    4.9.3 及之后的 版本 版本由互联网软件联盟开发和维护，并由 ISC 赞助者的支持。作为共同架构师/程序员，Bob Halley 和 Paul Vicxie
    在 1997 年 5 月发布了第一个生产就绪的 BIND 8 版本。如今，BIND 开发工作得益于几家公司的赞助以及许多个人不懈的努力。


    ## A.2. 历史 DNS 信息


    ### A.2.1 资源记录的分类


    ### A.2.1.1. HS = hesiod


    [hesiod] 类是由 MIT Athena 项目开发的一种信息服务。它用于共享各种系统数据库的信息，如用户、组、打印机等。关键字 **hs** 是 hesiod
    的同义词。


    ### A.2.1.2. CH = chaos


    **chaos** 类用于指定由 MIT 开发的 70 年代中期开发的 LAN 协议 CHAOSnet 的区域数据。


    ## A.3. 通用 DNS 参考信息


    ### A.3.1 IPv6 地址 (A6)


    IPv6 地址是用于接口及一组接口的 128 位标识符，引入 DNS 是为了实现可扩展的互联网路由。地址有三种类型：*单播*（Unicast），单个接口的标识符；*任任播*（Anycast），一组接口的标识符；以及*组播*（Multicast），一组接口的标识符。在这里我们描述全局单播地址方案。有关更多信息，请参阅
    RFC 2374。


    可聚合的全局单播地址格式如下：


    | 3 | 13 | 8 | 24 | 16 | 64 bits |

    |---|---|---|---|---|---|

    | FP | TLA | RES | NLA ID | SLA ID | Interface ID |

    |---|---|---|---|---|---||

    | ID | <--- Public Topology ---> | | <-Site Topology-> | <--- Interface Identifier
    ---> |


    其中


    | FP | = 格式前缀 (001) |

    | TLA ID | = 顶级聚合标识符 |

    | RES | = 留作后用 |

    | NLA ID | = 下一级聚合标识符 |

    | SLA ID | = 站点级聚合标识符 |

    | INTERFACE ID |  标识符 |


    **公共拓扑**（Public Topology）由上游提供商或 ISP 提供，大致对应于地址范围的 IPv4 网络部分。**站点拓扑**（Site Topology）是你对该空间进行子网划分的地方，就像将一个
    IPv4/16 网络划分为 /24 子网一样。**接口标识符**（Interface Identifier）是给定网络上单个接口的地址。（在 IPv6 中，地址属于接口而非机器）。

    IPv6 的子网划分能力比 IPv4 灵活得多：现在可以在边界上进行子网划分，且与无分类域间路由（CIDR）相同。

    A6 全局单播地址的公共拓扑内部结构包括：


    | 3 | 8 | 24 |

    |---|---|---|---|

    | FP | TLA ID | RES | NLA ID |


    3 位 FP（格式前缀） 001 表示这是一个全局单播地址。其他类型地址的 FP 长度可能不同。

    13 位 TLA（顶级聚合器）提供了你的顶级骨干网运营商的前缀。


    8 位预留位。


    24 位用于下一级聚合器。这允许拥有 TLA 的组织将其 IP 空间的部分分发给客户组织，以便客户随后通过填充更多 NLA 位来进一步划分网络，并向其客户分发
    IPv6 前缀，以此此类推。


    站点拓扑部分没有特定的结构。组织可以按照自己想要的方式分配这些位。


    接口标识符在相应网络上必须是唯一的。在以太网网络中，确保这一点的一种方法是将地址设置为硬件地址的前三个字节“FFFF”，然后是硬件地址的最后三个字节。第一个字节的最低有效位应取反。地址以冒号隔开的
    32 位块形式写入，块的前导导零可以省略，例如：


    ```

    3fe:8050:201:9:a00:fe61:2b32

    ```


    IPv6 地址规范可能包含长字符串的零，因此架构师包含了一种用于指定它们的简写。双冒号（''::''）表示符合条件的最长零字符串。


    ## A.4. 参考文献（建议阅读）


    ### A.4.1 请求征求（RFC）


    互联网协议族的规范文档作为请求征求（RFC）系列的一部分发布，标准本身由互联网工程任务组（IETF）和互联网小组（IESG）定义。RFC 可通过 FTP 获取：ftp://www.isi.edu/in-notes/RFC（其中
    xxx 是 RFC 号）。


    ## Bibliography


