  - "[PAGE 54]\n\n# Chapter 6. BIND 9 Configuration Reference\n\nFor security reasons,\
    \ when the \"-u\" command line option is used, the named.run file is created only\
    \ after named has changed to the new UID, and any debug output generated while\
    \ named is starting up and still running as root. If you need to capture this\
    \ output, you must run the server with the \"-g\" option and redirect standard\
    \ error to a file.\n\nOnce a channel is defined, it cannot be redefined. Thus\
    \ you can alter the built-in channels directly, but you can modify the default\
    \ logging by pointing channels at channels you have defined.\n\n# 6.2.10.2. The\
    \ category Phrase\n\nThere are many categories, so you can send the logs wherever\
    \ you want, without seeing logs you don't want. If you don't specify a list of\
    \ channels for a category, then log messages in that category will be sent to\
    \ the default category instead. If you don't specify a default category, the following\
    \ \"default\" is used:\n\n```\ncategory \"default\" { \"default_syslog\"; \"default_debug\"\
    ; };\n```\n\nAs an example, if you want to log security events to a file, but\
    \ you also want to keep the default behavior. You specify the following:\n\n```\n\
    channel \"my_security_channel\" {\n    file \"my_security_file\";n    severity\
    \ info;\n}\ncategory \"security\" {\n    my_security_channel;\n    default_syslog;\n\
    \    default_debug;\n}\n\n```\n\nTo discard all messages in a category, specify\
    \ the null channel:\n\n```\ncategory \"xfer-out\" { \"null\"; }\ncategory \"notify\"\
    \ { \"null\"; };\n```\n\nFollowing are the available categories and brief descriptions\
    \ of the types of log information they contain. More categories may be added in\
    \ future BIND releases.\n\n| default | The default category defines the logging\
    \ options for those categories where no specific configuration has been defined.\
    \ |"
