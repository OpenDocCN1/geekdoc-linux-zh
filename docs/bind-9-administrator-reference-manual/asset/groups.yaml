  - "[PAGE 36]\n\n# 4.8.2. Address Lookups Using A6 Records\n\nThe A6 record is more\
    \ flexible than the AAAA record, and is therefore complicated. The A6 record can\
    \ be used to form a chain of A6 records, each specifying part of the IPv6 address.\
    \ It can also be used to specify the entire record as well. For example, this\
    \ record supplies the same data as the AAAA record in the previous example:\n\n\
    ```\n$ORIGIN example.com.\nhost 3600 IN A6 0:3fe:8050:201:1860:42::1\n```\n\n\
    # 4.8.2.1. A6 Chains\n\nA6 records are designed to allow network numbering. This\
    \ works when an A6 record only specifies the part of the address domain owner\
    \ controls. For example, a host may be a company named \"company.\" It has two\
    \ ISPs which provide IPv6 address space for. These two ISPs fully specify the\
    \ IPv6 prefix they supply.\n\nIn the company's address space:\n\n```\n$ORIGIN\
    \ example.com. IN A6 64 0:0:0:0:0:42::1 company.example1.net.\nhost 3600 IN A6\
    \ 64 0:0:0:0:0:42::1 company.example2.net.\n```\n\nISP1 will:\n\n```\n$ORIGIN\
    \ example1.net.\ncompany 3600 IN A6 0 3fe:8050:201:1860::\n```\n\nISP2 will:\n\
    \n```\n$ORIGIN example2.net.\ncompany 3600 IN A6 0 1234:5678:90ab:ffff::\n```\n\
    \nWhen host.example.com is looked up, the resolver (in the resolver daemon or\
    \ caching server) will find two partial A6 records, and will use the name to find\
    \ the remainder of the data.\n\n# 4.8.2.2. A6 Records for DNS Servers\n\nWhen\
    \ an A6 record specifies the address of a name server, it should use the full\
    \ address rather than specifying a partial address. For example:\n\n```\n$ORIGIN\
    \ example.com. IN NS ns0\n@ 14400 IN NS nsl\n\t 14400\n```"
