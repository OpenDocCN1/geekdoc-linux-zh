    # pid-file


    The pathname of the file server writes its process ID. If not specified, the default
    is /var/run/named.pid. The pid-file is used by programs that want to send signals
    to the running nameserver.


    # statistics-file


    The pathname of the file server appends statistics when instructed to do so using
    rndc stats. If not specified, the default is named.stats in the server''s current
    directory. The format of the file is described in Section 6.2.14.15


    # port


    The UDP/TCP port number the server uses for receiving and sending DNS protocol
    traffic. The default is 53. This option is mainly intended for server testing:
    a server using a port other than 53 will not be able to communicate with the global
    DNS.


    # random-device


    The source of entry to be used by the server. Entropy is primarily needed for
    DNSSEC operations, as TKEY transactions and dynamic update of signed zones. This
    option specifies the device (or file) from which to read entry. If this is a file,
    operations requiring entry will fail when the file has exhausted. If not specified,
    the default value is /dev/random (or equivalent) when present, and none otherwise.
    The random-device option takes effect during the initial configuration load at
    startup time and is ignored on subsequent reloads.


    # 6.2.14.1. Boolean Options


    # auth-nxdomain


    If yes, the AA bit is always set on NXDOMAIN responses, even if the server is
    not actually authoritative. The default is no; this is a change from BIND 8. If
    you are using very old DNS software, you may need to set it to yes.


    # deallocate-on-exit


    This option was used in BIND 8 to enable checking for memory leaks on exit. BIND
    9 ignores the option and always performs the checks.


    # dialup


    If yes, the server treats all zones as if they are doing zone transfers across
    a dial on demand dialup link, which can be brought up by traffic originating from
    this server. This has different effects according to zone type and concentrates
    the zone maintenance so that it happens in a short'
