    heartbeat-interval\n\n当此间隔过期时，服务器将对所有标记为拨号（dialup）的区域执行区域维护任务。默认为 60 分钟。合理值为 1\
    \ 天（1440 分钟）。如果设置为 0，则不会对这些区域进行区域维护。\n\ninterface-interval\n\n服务器每隔 `interface-interval`\
    \ 分钟扫描一次网络接口列表。默认为 60 分钟。如果设置为 0，则仅在加载配置文件时进行扫描。扫描后，将在任何新接口上启动监听器（前提是它们被允许 listen-on\
    \ 配置）。已消失的接口上的监听器将被清理。\n\nstatistics-interval\n\n每隔 `statistics-interval` 分钟记录一次命名服务器统计信息。默认值为\
    \ 60。如果设置为 0，则不记录任何统计信息。\n\n> 注意：在 BIND9 中尚未实现。\n\n## 6.2.14.10. 拓扑\n\n在其他条件相同的情况下，当服务器从命名服务器列表中选择一个命名服务器进行查询时，它倾向于选择在拓扑上距离自己最近的一个。`topology`\
    \ 语句接受 `address_match_list` 并以特殊方式解释它。每个顶层元素被分配一个距离。非否定元素根据其在列表中的位置获得距离，匹配项越接近列表开头，它与服务器之间的距离就越短。取反匹配将被分配距离服务器的最大距离。如果没有匹配，该地址将获得一个比列表中任何非否定元素都远、但比任何取反元素都近的距离。例如，\n\
    \n```\ntopology {\n  10/8;\n  !1.2.3/24;\n  { 1.2/16; 3/8; }\n}\n```\n将最优先选择网络\
    \ 10 服务器，其次是网络 1.2.0.0（子网掩码 255.255.0.0）和网络 3 上的主机，网络 1.2.3（子网掩码 255.255.255.0）上的主机优先级最低。\n\
    \n默认拓扑为\n\n\n\n```\ntopology ( localhost; localnets; );\n```\n\n> 注意：BIND 9 中未实现\
    \ `topology` 选项。\n\n## 6.2.14.11. sortlist 语句\n\n对 DNS 查询的响应可能由多个资源记录（RR）组成，形成一个资源记录集（RRset）。服务器通常以不确定的顺序返回\
    \ RRset（但请参阅第 6.2.14.12 节中的 **rrset-order** 语句）。客户端解析器代码应根据情况重新排列 RRs，即优先使用本地网络上的任何地址而非其他地址。然而，并非所有的解析器都这样做，或者其配置不正确。当客户端使用本地服务器时，排序在服务器端根据客户端的地址进行。这只需要配置命名服务器，而不需要配置所有客户端。\n\
    \n**sortlist**（见下文）接受一个 **address_match_list**，并在 **topology** 语句（第 6.2.14.10\
    \ 节）上对其特定解释。**sortlist** 中的每个顶层语句必须是一个具有一个或两个元素的显式 **address_match_list**。顶层列表的第一个元素（可能是\
    \ IP 地址、IP 前缀、ACL 名称或嵌套的 **address_match_list**）将与查询源地址进行检查，直到找到匹配项。\n\n一旦匹配了查询源地址，如果顶层语句仅包含一个元素，则使用匹配源地址的实际原始元素来选择响应中的地址，并移动到响应的开头。如果语句是两个元素的列表，则第二个元素被处理为与\
    \ **topology** 语句中的 **address_match_list** 相同。每个顶层元素被分配一个距离，响应中距离最小的地址将被移动到响应的开头。\n\
    \n## 第 6 章 BIND 9 配置参考\n\n在以下示例中，来自来自主机本身任何地址的任何查询将获得优先选择任何本地连接网络上地址的响应。其次优选的是\
    \ 192.168.1/24 网络上的地址，之后是 192.168.2/24 或 192.168.3/24 网络，这两个网络之间没有显示优劣之。来自 192.168.1/24\
    \ 网络主机的查询将优先选择该网络上的其他地址，而非 192.168.2/24 和 192.168.3/24 网络。来自 192.168.4/24 或 192.168.5/24\
    \ 网络主机的查询将优先选择其直接连接网络上的其他地址。\n\n```\nsortlist {\n    localhost;\n    localnets;\n\
    \        192.168.1/24;\n        { 192.168.2/24; 192.168.3/24; }; // 如果本地主机\n \
    \   192.168.1/24; // 则首先在\n    { 192.168.2/24; 192.168.3/24; }; // 后续网络\n    192.168.2/24;\n\
    \    { 192.168.1/24; 192.168.3/24; }; // 如果在 C 类\n    192.168.2/24; // 则使用 .1,\
    \ .2 或 .\n    { 192.168.1/24; 192.168.3/24; }; // 则使用 .2, .3\n    192.168.3/24;\n\
    \    { 192.168.4/24; 192.168.5/24; }; // 如果在 C 类\n    f-fer that net\n    ; //\
    \ 如果 .4 或 .5, pre-\n};\n```\n以下示例将为本地主机和直接连接网络上的主机提供合理的行为。这与 BIND 4.9 中的地址排序行为相似。发送给本地主机查询的响应将有利于任何直接连接的网络。发送给直接连接网络上其他主机查询的响应将优先选择同一网络上的地址。对其他查询的响应将不会排序。\n\
    \n```\nsortlist {\n    {localhost; localnets};\n    {localnets};\n};\n```\n\n\
    ## 6.2.14.12. RRset 排序\n\n当回答中返回多个记录时，配置放置在响应中的记录顺序可能是很有用的。`rrset-order` 语句允许配置记录的顺序。\n\
    \n```\nrrset-order [ class ] [ type ] [ domain ] order\n```\n允许对 RRset 进行排序。`rrset-order`\
    \ 的定义如下：\n\n| | |\n|---|---|\n| fixed | 响应以固定顺序返回。 |\n| random | 响应以随机顺序返回。 |\n\
    | cyclic | 响应以循环顺序返回。 |\n\n例如：\n\n```\nrrset-order class IN \"example.com\" random;\
    \ cyclic;\n```\n无论哪种成功，都由 BIND 9 随机选择 `rrset-order` 决定。如果出现多个 `rrset-order` 语句，将采用最后一个。\n\
    \n> 注意：在 BIND 9 中实现 `rrset-order` 语句。BIND    随机选择选择一个，，，绕绕 RRset 结尾。\n\n\n\n \
    \ ..2.14.13. 合成 IPv6 响应\n\n许多解析器支持使用 RFC1886 的 AAAA 记录进行 IPv6 查询，并在 ip6.int 域中使用二进制标签进行反向查询，但\
    \ BIND 9 不支持 RFC2874-style 查询。\n\n对于那些希望继续使用轻量级解析器而不是切换到 BIND 9 的用户，BIND 9 提供了一种方法，可以将\
    \ RFC1886-style lookups 转换为 RFC2874-style lookups。\n\n此功能默认禁用，可以通过 `all-v6-synthesis\
    \ { address_match_list }` 子添加到 `options` 或 `view` 语句中启用。启用后，递归 AAAA 查询将导致首先尝试\
    \ AAAA 查询，如果失败，则进行查找。无论哪一个成功，结果都以合成 AAAA 记录的形式返回。同样，ip6.int 中的递归 PTR 查询将导致在 ip6.arp\
    \ 中查找二进制标签，如果失败，则查询 ip6.int。结果将以 ip6.int 中的合成 PTR 记录返回。\n\n合成记录的 TTL 为零。目前不支持对合成响应进行\
    \ DNSSEC 验证；因此，包含合成 RR 的响应不会设置 AD 标志。\n\n> 注意：all-v6-synthesis 仅对提供递归服务的客户端执行。\n\
    \n## 6.24.14. 调优\n\nlame-ttl\n\n设置缓存失效服务器指示的秒数。0 禁用缓存。（不建议。）默认为 600（10 分钟）。最大值为\
    \ 1800（30 分钟）。\n\nmax-nache-ttl\n\n为了减少网络流量并提高性能，服务器存储负缓存。max-nache-ttl 用于设置这些答案在服务器中的最大保留时间（秒）。默认\
    \ max-nache-ttl 为 10800 秒（3 小时）。max-nache-ttl 不能超过 7 天，如果值更大，将被静截断为 7 天。\n\nmax-cache-ttl\n\
    \nmax-cache-ttl 设置服务器缓存普通（积极）答案的最长时间。默认为一周（7 天）。\n\nmin-roots\n\n接受根服务器请求所需的根服务器最小数量。默认为\
    \ 2。\n"
