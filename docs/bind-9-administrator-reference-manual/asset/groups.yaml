    interval, once every heartbeat-interval and hopefully during the one call. It
    also suppresses some of the normal zone maintenance traffic. The default is no.


    The dialup option may also be specified in the view and zone statements, in which
    case it overrides the global dialup option.


    If the zone is a master zone then the server will send out a NOTIFY request to
    all the slaves. This will trigger the zone serial number check in the slave (providing
    it supports NOTIFY) allowing the slave to verify the zone while the connection
    is active.


    If the zone is a slave or stub zone, then the server will suppress the regular
    "zone up to date" (refresh) queries and only perform them when the heartbeat-interval
    expires in addition to adding NOTIFY requests.


    Finer control can be achieved using notify which only sends NOTIFY messages, notify-passive
    which sends NOTIFY messages and suppresses the normal refresh queries, refresh
    which suppresses normal refresh processing and refresh queries when the heartbeat-interval
    expires and passive which just disables normal refresh processing.


    # fake-iquery


    In BIND 8, this option was used enable simulating the obsolete DNS query type
    INQUERY. BIND 9 never does INQUERY simulation.


    # fetch-glue


    This option is obsolete. In BIND 8, fetch-glue yes caused the server to attempt
    to fetch resource records it didn''t have when constructing the additional data
    section of a response. This is now considered a bad idea and BIND 9 never does
    it.


    # has-old-clients


    This option was incorrectly implemented in BIND 8, and is ignored by BIND 9. To
    achieve the intended effect of has-old-clients yes, specify the two separate options
    auth-xdomain yes and rfc2308-type no instead.


    # host-statistics


    In BIND 8, this enables keeping of statistics for every host that the nameserver
    interacts with. With not implemented in BIND 9.


    # maintain-ixfr-base


    This option is obsolete. It was used in BIND 8 to determine whether a transaction
    log was kept for Incremental Zone Transfer. BIND 9 maintains a transaction log
    whenever possible. If you need to disable outgoing incremental zone transfers,
    use provide-ixfr no.'
  - '[PAGE 62]


    Chapter 6. BIND 9 Configuration Reference


    # minimal-responses


    **If yes**, then when generating responses the server will only add records to
    the authority and additional data sections when they are required (e.g. delegations,
    negative responses). This may improve the performance of the server. The default
    is **no**.


    # multiple-cnames


    This option was used in BIND 8 to allow a domain name to allow multiple CNAME
    records in violation of the DNS standards. BIND 9.2 strictly enforces the CNAME
    rules both in master files and dynamic updates.


    # notify


    **If yes**, then DNS NOTIFY messages are sent when a zone the server is authoritative
    for changes, see Section 3.3. The messages are sent to the servers listed in the
    zone''s NS records (except the master server identified in the SOA NAME field),
    and to any servers listed in the **also-notify** option.


    **If explicit**, notices are sent only to servers explicitly listed using **also-notify**.
    **If no**, no notices are sent.


    The **notify** option may also be specified in the **zone** statement, in which
    case it overrides the **options notify** statement. It would only be necessary
    to turn off this option if it caused slaves to crash.


    # recursion


    **If yes**, and a DNS query requests recursion, then the server will attempt to
    do all the work required to answer the query. If recursion is off and the server
    does not already know the answer, it will return a referral response. The default
    is **yes**. Note that setting **recursion no** does not prevent clients from getting
    data from the server''s cache; it only prevents new data from being cached as
    an effect of client queries. Caching may still occur as an effect of the server''s
    internal operation, such as NOTIFY address lookups. See also **fetch-glue** above.


    # rfc2308-type1


    Setting this to **yes** will cause the server to send NS records along with the
    SOA record for negative answers. The default is **no**.


    **Note**: Not yet implemented in BIND 9.


