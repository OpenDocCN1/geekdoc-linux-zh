  mdcn: "\n\n# 第 6 章 BIND 9 配置参考\n\n出于安全考虑，当使用 \"-u\" 命令行选项时，named.run 文件的只有在 named\
    \ 切换到新 UID 后才会创建，以及 named 启动且仍以 root 身份运行时生成的任何调试输出。如果你需要捕获这些输出，必须使用 \"-g\" 选项运行服务器并将标准错误重定向到文件。\n\
    \n一旦定义了通道（channel），就无法重新定义。因此，你可以直接更改内置通道，但可以通过将通道指向你定义的通道来修改默认日志。\n\n### 6.2.10.2.\
    \ 类别短语 (Phrase)\n\n有很多类别，因此你可以将日志发送到任何地方，而不会看到你不想要的日志。如果你没有为某个类别指定通道列表，则该类的日志消息将被发送到默认类别。如果你没有指定默认类别，将使用以下“default”：\n\
    \n```\ncategory \"default\" { \"default_syslog\"; \"default_debug\"; };\n```\n\
    \n例如，如果你想将安全事件记录到文件中，但同时也保留默认行为。你可以指定以下内容：\n\n```\nchannel \"my_security_channel\"\
    \ {\n    file \"my_security_file\";\n    severity info;\n}\ncategory \"security\"\
    \ {\n    my_security_channel;\n    default_syslog;\n    default_debug;\n}\n```\n\
    \n要丢弃类别中的所有消息，请指定空通道（null）：\n\n```\ncategory \"xfer-out\" { \"null\"; }\ncategory\
    \ \"notify\" { \"null\"; };\n```\n\n以下是可用的类别及其包含的日志信息类型简述。未来的 BIND 版本可能会添加更多类别。\n\
    \n| category | 描述 |\n| :--- | :--- |\n| default | 默认类别定义了那些未定义特定配置的类别的日志选项。 |\n\
    | general | 通用类别。许多事务仍未归类到特定类别中，它们都会汇到这里。 |\n| database | 与名称服务器内部用于存储和缓存数据的数据库相关的消息。\
    \ |\n| security | 请求的允许与拒绝。 |\n| config | 配置文件的解析和处理。 |\n| resolver | DNS 解析，例如缓存名称服务器代表客户端执行的递归查询。\
    \ |\n| xfer-in | 服务器接收的区域传输（Zone transfers）。 |\n| xfer-out | 服务器正在发送的区域传输。 |\n\
    | notify | NOTIFY 协议。 |\n| client | 客户端请求的处理。 |\n| unmatched | named 无法确定其类别或没有匹配视图（view）的消息。**客户端类别也会记录一条单行摘要。**\
    \ **此类别最好发送到文件或 stderr，默认情况下它被发送到空通道。** |\n| network | 网络操作。 |\n| update | 动态更新。\
    \ |\n| queries | 查询。使用 **queries** 类别将启用查询日志。 |\n| dispatch | 将传入的数据包分发到待处理的服务器模块。\
    \ |\n| dnssec | DNSSEC 和 TSIG 协议处理。 |\n| lame-servers | 故障服务器（Lame servers）。这些是远程服务器配置错误，BIND\
    \ 9 在解析过程中尝试查询这些服务器时发现。 |\n\n### 6.2.11. lwres 语句语法\n\n这是 `named.conf` 文件中 **lwres**\
    \ 语句的语法：\n\n```\nlwres {\n[ listen-on { ip_addr [port ip_port]; [ ip_addr [port\
    \ ip_port]; ... ] }; ]; ];\n[ view_name; ];\n[ search domain_name; [ domain_name;\
    \ ... ] }; ]; ]; [];\n[ ndots number; ];\n```\n\n### 6.12.2 lwres 语句定义与用法\n\n\
    lwres 配置名称服务器同时也作为一个轻量级解析服务器运行，请见第 5.2 节。可能存在多个 lwres 语句用于配置具有不同属性的轻量级解析服务器。\n\
    listen-on 语句指定了该轻量级守护进程实例可以接受请求的地址列表（和端口）。如果没有指定端口，则使用端口 921。如果省略了此语句，请求将在 127.0.0.1\
    \ 端口 921 上被接受。\nview 语句将此轻量级解析器守护进程实例绑定到 DNS 命名空间中的一个视图中，其响应的构建方式将与匹配此视图的普通 DNS\
    \ 查询相同。如果省略了此语句，将使用默认视图；如果没有默认视图，则会触发错误。\nsearch 语句等同于 /etc/resolv.conf 中的 search\
