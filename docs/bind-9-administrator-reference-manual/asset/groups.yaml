    # # Chapter 8. Troubleshooting


    # ## 8.1. Common Problems


    # ### 8.1.1. It’s not working; how can I figure out what’s wrong?


    The best solution to solving installation and configuration issues is to take
    preventative measures by setting up logging files beforehand. The log files provide
    a source of hints and information that can be used to figure out what went wrong
    and how to fix the problem.


    # ## 8.2. Incrementing and Changing the Serial Number


    Zone serial numbers are just numbers-they aren''t date related. A lot of people
    set them to a number that represents a date, usually of the form YYYMMDD. A number
    of people have been testing numbers for Y2K compliance and set the number to the
    year 2000 to see if it will work. They then try to restore the old serial number.
    This will cause problems because serial numbers are used to indicate that a zone
    has been updated. If the serial number on the slave server is lower than the serial
    number on the master, the slave server will attempt to update its copy of the
    copy.


    Setting the serial number to a lower number on the master server than the slave
    server means that the slave will not perform updates to its copy of the copy.


    The solution to this is to add 2147483647 (2^31-1) to the number, reload the zone
    and make sure all slaves have updated to the new zone serial number, reset the
    number to what you want it to be, and reload the zone again.


    # ## 8.3. Where Can I Get Help?


    The Internet Software Consortium (ISC) offers a wide range of support and service
    agreements for BIND and DHCP servers. Four levels of premium support are available
    and each level includes support for all ISC programs, significant discounts on
    products and training, and a recognized priority on bug fixes and non-funded feature
    requests. In addition, ISC offers a standard support agreement package which includes
    services ranging from bug fix announcements to remote support. It also includes
    training BIND and DHCP.'
