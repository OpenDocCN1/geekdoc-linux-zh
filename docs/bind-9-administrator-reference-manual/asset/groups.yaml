    ## 6.2.14.6. Zone Transfers


    BIND has mechanisms in place to facilitate zone transfers and set limits on the
    amount of load that transfers place on the system. The following options apply
    to zone transfers.


    ### also-notify


    Defines a list of IP addresses of name servers that are sent NOTIFY messages whenever
    a fresh copy of the zones is loaded, in addition to the servers listed in the
    zone''s NS records. This helps to ensure that copies of the zones will quickly
    converge on stealth servers. If an also-notify list is given in a zone statement,
    it will override the options-also-notify statement. When a zone statement is set
    to no, the IP addresses in the global also-notify list will not be sent NOTIFY
    messages for that zone. The default is the empty list (no global notification
    list).


    ### max-transfer-time-in


    Inbound zone transfers running longer than this minutes will be terminated. The
    default is 120 minutes (2 hours).


    ### max-transfer-idle-in


    Inbound zone transfers making no progress in this many minutes will be terminated.
    The default is 60 minutes (1 hour).


    ### max-transfer-time-out


    Outbound zone transfers running longer than this many minutes will be terminated.
    The default is 120 minutes (2 hours).


    ### max-transfer-idle-out


    Outbound zone transfers making no progress in this many minutes will be terminated.
    The default is 60 minutes (1 hour).


    ### serial-query-rate


    Slave servers will periodically query master servers to find out if zone serial
    numbers have changed. Each such query uses a minute amount of the slave server''s
    network bandwidth. To limit the amount of bandwidth used, BIND 9 limits the rate
    at which queries are sent. The value of the serial-query-rate option, an integer,
    is the maximum number of queries sent per second. The default is 20.


    ### serial-queries


    In BIND 8, the serial-queries option set the maximum number of concurrent serial
    number queries allowed to be outstanding at any given time. BIND 9 does not limit
    the number of outstanding serial queries and ignores the serial-queries option.
    Instead, it limits the rate at which queries are sent as defining the serial-query-rate
    option.


    ### transfer-format


    Zone transfers can be sent using two formats, one-answer and many-answers. The
    transfer-format option is used on the master server to define which format it
    sends. one-answer uses one DNS message per resource record transferred. many-answers
    packs as many resource records as possible into a message. many-answers is more
    efficient, but is only supported by relatively new slave servers, such as BIND
    9, 8.x and patched versions of BIND 4.9.5. The default is many-answers. transfer-format
    may be overridden on a per-server basis by using the server statement.


    ### transfers-in


    The maximum number of inbound zone transfers that can be running concurrently.
    The default value is 10. Increasing transfers-in may speed up the convergence
    of slave zones, but it may also increase the load on the local system.


    ### transfers-out


    The maximum number of outbound zone transfers that can be running concurrently.
    Zone transfer requests in excess of the limit will be refused. The default value
    is 10.


    ### transfers-per-ns


    The maximum number of inbound zone transfers that can be concurrently transferring
    from a given remote nameserver. The default value is 2. Increasing transfers-per-ns
    may speed up the convergence of slave zones, but it may also increase the load
    on the remote nameserver. transfers-per-ns may be overridden on a per-server basis
    by using the transfers phrase of the server statement.


    ## Chapter 6. BIND 9 Configuration Reference


    ### transfer-source


    transfer-source determines which local address will be bound to IPv4 TCP connections
    used to fetch zones transferred inbound by the server. It also determines the
    source IPv4 address, and optionally the UDP port, used for the refresh queries
    and forwarded dynamic updates. If not set, it defaults to a system controlled
    value which will usually be the address of the interface "closest to" the remote
    end. This address must appear in the remote end''s allow-transfer option for the
    zone being transferred, if one is specified. This statement sets the transfer-source
    for all zones, but can be overridden on a per-view or per-zone basis by including
    a transfer-source statement within the view or zone block in the configuration
    file.


    ### transfer-source-v6


    The same as transfer-source, except zone transfers are performed using IPv6.


    ### notify-source


    notify-source determines which local address, and optionally the UDP port, will
    be used to send NOTIFY messages. This address must appear in the slave server''s
    masters zone clause or in an allow-notify clause. This statement sets the notify-source
    for all zones, but can be overridden on a per-zone / per-view basis by including
    a notify-source statement within the zone or view block in the configuration file.


    ### notify-source-v6


    Like notify-source, but applies to notify messages sent to IPv6 addresses.


    ## 6.2.147. Operating System Resource Limits


    The server''s usage of many system resources can be limited. Scaled values are
    allowed when specifying resource limits. IG can be used instead of 107374184 to
    specify a limit of one gigabyte. unlimited requests limit, or the maximum available
    amount. default uses the limit that was in force when the server was started.
    See the description.The following options setting system resource limits for the
    name server process. Some operating systems don''t support some or any of the
    limits. On such systems, a warning will be issued if the unsupported limit is
    used.


    ### coresize


    The maximum size of a core dump. The default is default.


    ### datasize


    The maximum amount of data memory the server may use. The default is default.
    This is a hard limit on memory usage. If the server attempts to allocate memory
    in excess of this limit, the allocation will fail, which may in turn leave the
    server unable to perform DNS service. Therefore, this option is really useful
    as a limiting the amount of memory used by the server, but it can be used to raise
    an operating system size that is is too by by default. If wish to limit the amount
    of memory used by the server, use the max-cache-size and recursive-clients options
    instead.


    ### files


    The maximum number of files the server may have open concurrently. The default
    is unlimited.


    ### stacksize


    The maximum amount of stack memory the server may use. The default is default.


    ## 6.2.14.8. Server Resource Limits


    The following options set limits on the server''s resource consumption that are
    enforced internally by the server rather than the operating system.


    ### max-ifr-log-size


    This option is obsolete; it is accepted and ignored for BIND 8 compatibility.


    ### recursive-clients


    The maximum number of simultaneous recursive lookups the server will perform on
    behalf of clients. The default is 1000. Because each recursive client uses a fair
    bit of memory, on the order of 20 kilobytes, the value of the recursive-clients
    option may be decreased on hosts with limited memory.


    ### tcp-clients


    The maximum number of simultaneous TCP connections that the server will accept.
    The default is 100.


    ### max-cache-size


    The maximum amount of memory to use for the server''s cache, in bytes. When the
    amount of data in the cache reaches this limit, the server will cause records
    to expire prematurely so that the limit is not exceeded. In a server with multiple
    views, the limit applies separately to the cache of each view.

