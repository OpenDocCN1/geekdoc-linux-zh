    # 第 6 章 BIND 9 配置参考


    ## version


    服务器通过查询 CHAOS 类中的 `name version.bind` 报告的版本。默认值是此服务器的实际版本号。


    ## directory


    服务器的工作目录。配置文件中的任何非绝对路径名将被视为相对于此目录的相对路径。大多数服务器输出文件（例如 `named.run`）的默认位置是此目录。如果未指定目录，工作目录默认为
    `.`，即启动服务器时所在的目录。指定的目录应该是绝对路径。


    ## named-xfer


    此选项已废弃。在 BIND 8 中，它被用于指定 `named-xfer` 程序的路径。在 BIND 9 中，不再需要独立的 `named-xfer` 程序；其功能已内置在名称服务器中。


    ## tkey-domain


    附加到使用 TKEY 生成的所有共享密钥名称后的域名。当客户端请求 TKEY 交换时，它可能也可能不指定密钥所需的名称。如果存在，共享密钥的名称将为“客户端部分+tkey-domain”。否则，共享密钥的名称将为“随机十六进制数字+tkey-domain”。在大多数情况下，该域名应该是服务器的域名。


    ## tkey-dhkey


    服务器使用 TKEY 的 Diffie-Hellman 模式与客户端生成共享密钥所需的 Diffie-Hellman 密钥。服务器必须能够从工作目录加载公私密钥文件。在大多数情况下，密钥名称应该是服务器的主机名。


    ## dump-file


    当通过 `rndcdumpdb` 指令时，服务器将数据库导出的文件路径。如果未指定，默认值为 `named_dump.db`。


    ## statistics-file


    服务器退出时写入内存使用统计信息的文件路径。如果未指定，默认值为 `named.memstats`。


    > Note：在 BIND 9 中尚未实现。


    ## pid-file


    服务器写入其进程 ID（PID）的文件路径。如果未指定，默认值为 `/var/run/named.pid`。该 pid 文件用于那些想要向运行中的名称服务器发送信号的程序。


    ## statistics-file


    当通过 `rndc stats` 指令时，服务器追加统计信息的文件路径。如果未指定，默认为服务器当前目录下的 `named.stats`。文件格式见第 6.2.14.15
    节描述。


    ## port


    服务器用于接收和发送 DNS 协议流量的 UDP/TCP 端口号。默认值为 53。此选项主要用于服务器测试：使用非 53 端口的服务器将无法与全局 DNS
    通信。


    ## random-device


    服务器使用的熵源。熵主要用于 DNSSEC 操作，例如 TKEY 事务和签名区域的动态更新。此选项指定了读取熵的设备（或文件）。如果这是一个文件，当文件内容耗尽时，需要熵的操作将失败。如果未指定，在存在时则默认值为
    `/dev/random`（或等效设备），若不存在则为无。`random-device` 选项在启动时的初始配置加载期间生效，并在随后的重载中被忽略。


    ## 6.2.14.1. 布尔型选项


    ### auth-nxdomain


    如果为 `yes`，则在 NXDOMAIN 响应上始终设置 AA 位，即使服务器实际上并不具有权威性。默认值为 `no`；这是与 BIND 8 相比的更改。如果你正在使用非常旧的
    DNS 软件，可能需要将其设置为 `yes`。


    ### deallocate-on-exit


    此选项在 BIND 8 中用于启用退出时检查内存泄漏。BIND 9 忽略此选项并始终执行检查。


    ### dialup


    如果为 `yes`，服务器将所有区域处理为正在通过按需拨号的跨拨号链路进行区域传输，该拨号链路由源自此服务器的流量建立。这会根据区域类型产生不同的影响，并集中区域维护工作，使其在短时间间隔内发生（每隔心跳间隔发生一次，并希望在单次通话中完成）。它还会抑制一些正常的区域维护流量。默认值为
    `no`。


    `dialup` 选项也可以在 `view` 和 `zone` 语句中指定，在这种情况下它将覆盖全局 `dialup` 选项。


    如果该区域是主区域，服务器将向所有从机发送 `NOTIFY` 请求。这将触发从机中的区域序列号检查（如果从机支持 NOTIFY），允许从机在连接激活状态时验证区域。


    如果该区域是从区域或存根区域（stub zone），则服务器将抑制常规“区域已更新”（刷新）查询，仅在心跳间隔过期时执行这些查询，并添加 NOTIFY 请求。


    可以使用 `notify` 实现更精细的控制，它只发送 NOTIFY 消息；`notify-passive` 发送 NOTIFY 消息并抑制正常的刷新查询；`refresh`
    在心跳间隔过期时抑制正常的刷新处理和刷新查询；`passive` 则仅禁用正常的刷新处理。


    ### fake-iquery


    在 BIND 8 中，此选项用于启用模拟已弃用的 DNS 查询类型 `INQUERY`。BIND 9 绝不进行 `INQUERY` 模拟。


    ### fetch-glue


    此选项已废弃。在 BIND 8 中，`fetch-glue yes` 会导致服务器在构建响应的附加数据部分时，尝试获取它不拥有的资源记录。这现在被认为是一个坏主意，且BIND
    9 绝不这样做。


    ### has-old-clients


    此选项在 BIND 8 中的实现有误，被 BIND 9 忽略。要实现 `has-old-clients yes` 的预期效果，请改用两个独立的选项 `options-xdomain
    yes` 和 `rfc2308-type no`。


    ### host-statistics


    在 BIND 8 中，此选项启用对与名称服务器交互的每个主机的统计。在 BIND 9 中未实现。


    ### maintain-ixfr-base


    此选项已废弃。它在 BIND 8 中被用于确定是否为增量区域传输（IXFR）保留事务日志。BIND 9 尽可能地维护事务日志。如果你需要禁用传出的区域传输，请使用
    `provide-ixfr no`。


    ### minimal-responses


    **如果为 yes**，则在生成响应时，服务器仅在需要时（例如授权、否定应答）向权威部分和附加数据部分添加记录。这可能会提高服务器的性能。默认值为 **no**。


    ### multiple-cnames


    此选项在 BIND 8 中用于允许一个域名违反 DNS 标准允许存在多个 CNAME 记录。BIND 9.2 在主文件和动态更新中严格执行 CNAME 规则。


    ### notify


    **如果为 yes**，则当服务器具有权威性的区域发生变化时，会发送 DNS NOTIFY 消息，详见第 3.3 节。消息将发送到该区域 NS 记录中列出的服务器（除
    SOA NAME 字段中标识的主服务器外），以及发送到 **also-notify** 选项中列出的任何服务器。


    **如果明确**，通知仅发送到使用 **also-notify** 显式列出的服务器。**如果为 no**，则不发送通知。


    **notify** 选项也可以在 **zone** 语句中指定，在这种情况下它将覆盖 **options notify** 语句。只有当该选项导致从机崩溃时，才有必要关闭它。


    ### recursion


    **如果为 yes**，且 DNS 查询请求递归，则服务器将尝试完成回答查询所需的所有工作。如果关闭了递归且服务器不知道答案，它将返回引用响应（referral）。默认值为
    **yes**。请注意，设置 **recursion no** 并不会阻止客户端从服务器缓存中获取数据；它只是防止新数据作为客户端查询的结果而被缓存。缓存仍可能作为服务器内部操作（例如
    NOTIFY 地址查找）的结果而发生。另，请参阅上文的 **fetch-glue**。


    ### rfc2308-type1


    将此设置为 **yes** 将导致服务器在否定应答时同 SOA 记录一起发送 NS 记录。默认值为 **no**。


    > Note：在BIND 9 中尚未实现。


