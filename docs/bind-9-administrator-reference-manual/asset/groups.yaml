    # 第 5 章 BIND 9 轻量级解析器


    ## 5.1. 轻量级解析器库


    传统上，应用程序与存根解析器（stub resolver）库链接，该库向本地缓存名称服务器发送递归 DNS 查询。


    IPv6 为解析过程引入了新的复杂性，例如遵循 A6 链和 DNAME 记录，以及同时查找 IPv4 和 IPv6 地址。这些功能在传统的存根解析器中很难或无法实现。


    相反，BIND 为轻量级解析器库和运行在本地主机上的解析器守护进程提供解析服务。它们使用简单的基于 UDP 的协议进行通信，即“轻量级解析器协议”，该协议与完整的
    DNS 协议不同且更为简单。


    ## 5.2. 运行解析器守护进程


    要使用轻量级解析器接口，系统必须运行解析器守护进程 lwres。


    默认情况下，使用轻量级解析器库的应用程序将向端口 921 的 IPv4 回环地址（127.0.0.1）发送 UDP 请求。该地址可以通过 `/etc/resolv.conf`
    中的 `lwserver` 行进行覆盖。守护进程将尝试回答问题“host foo.example.com 的地址是什么？”以及“IPv4 地址 10.1.2.3
    的名称是什么？”


    该进程目前只查找 DNS，但未来可能会使用其他源，如 /etc/hosts、NIS 等。


    lwres 守护进程本质上是一个缓存名称服务器，使用轻量级解析器协议而不是 DNS 协议来请求。由于它需要在每个主机上运行，因此被设计为不需要或仅需要极少配置。除非另有配置，否则它使用
    `/etc/resolv.conf` 中 `nameserver` 行列出的名称服务器作为转发器，但在未指定的情况下也能自主解析。


    lwres 守护进程也可以配置一个 `named.conf` 风格的文件，默认位于 `/etc/lwres.conf`。也可以通过 `named.conf`
    中的 `lwres` 语句配置名称服务器作为轻量级解析器守护进程。


    # 第 6 章 BIND 9 配置参考


    BIND 9 的配置与 BIND 8.x 大体相似；然而，有一些新的配置区域，例如视图（views）。BIND 8.x 配置文件在 BIND 9 中只需少许修改即可工作，但应对对更复杂的配置进行审查，以检查是否可以使用
    BIND 9 中的新功能更高效地实现。


    BIND 4 可以使用可以使用 脚本 `contrib/named-bootconf/named-bootconf.sh` 转换为新格式。


