    \ is restricted by the allow and keys clauses. Connections to the control channel\
    \ are permitted based on the address permissions in address_match_list, key_id\
    \ members of address_match_list are listed, and instead independently interpreted\
    \ based on the key_list. Each key id in the key_list is allowed to be used to\
    \ authenticate commands and responses over the control channel by digitally signing\
    \ each message between the server and a command client (See Remote Name Daemon\
    \ Control application in Section 3.4.1.2). All commands to the control channel\
    \ must be signed by one of its specified keys to be honored.\n\nfile rndc.key\
    \ in /etc (or whatever sysconfdir was specified as when BIND was built). To create\
    \ a rndc.key file, run rndc-confgen -a.\n\nThe keys feature was created to ease\
    \ the transition of systems from BIND 8, which did not have digital signatures\
    \ on its command channel messages and did not have a keys clause. It makes possible\
    \ to use an existing BIND 8 configuration file in BIND 9 unchanged, and still\
    \ have rndc work the same way as in BIND 8, simply by executing the command rndc-confgen\
    \ -a after BIND 9 is installed.\n\nSince the rndc.key feature is intended only\
    \ to allow the backward-compatible usage of BIND 8 configuration files, this feature\
    \ does not have a high degree of configurability. You cannot easily change the\
    \ key name or the size of the secret, so you should make a rndc.conf with your\
    \ own if you wish to change those things. rndc.key file also has permissions set\
    \ that only the owner of the file (the user named is running) can access it. If\
    \ you desire greater flexibility in allowing other users to access rndc commands\
    \ then you need to create an rndc.conf and make it readable by a group that contains\
    \ the users who have access.\n\nThe UNIX control type of BIND 8 is not supported\
    \ in BIND 9, and is not expected to be added in future releases. If it is present\
    \ in the controls statement from a BIND 8 configuration file, it is ignored and\
    \ a warning is logged.\n\nTo disable the command channel, use an empty controls\
    \ statement: controls { };\n\n### 6.2.5. include Statement Grammar\n\n```\ninclude\
    \ filename;\n```\n\n### 6.2.6. include Statement Definition and Usage\n\nThe include\
    \ statement inserts the specified file at the point that the include statement\
    \ is encountered. The include statement facilitates the administration of configuration\
    \ files by permitting the reading or writing of some things but not others. For\
    \ example, the statement could include private keys that are readable only by\
    \ a nameserver.\n\n### 6.2.7. key Statement Grammar\n\n```\nkey key_id {\n  algorithm\
    \ string;\n  secret string;\n};\n```\n"
  mdcn: "\n将获得一个比任何非否定列表元素都远的距离，且比任何取反元素更近的距离。\n\n由于算法的优先匹配特性，列表中定义另一个元素子集的元素应该位于更宽泛元素之前，无论其中一个是否被取反。例如，在\
    \ `1.2.3/24; ! 1.2.3.13;` 中，1.2.3.13 元素是完全没用的，除非算法会将对 `1.2.3.13` 的查找匹配到 `1.2.3/24`\
    \ 元素。使用 `! 1.2.3.13; ! 1.2.3/24;` 可以解决这个问题，让 `1.2.3.13` 被取反拦截，而所有其他 `1.2.3.*`\
    \ 主机都能通过。\n\n## 6.1.2. 注释语法\n\nBIND 9 的注释允许注释出现在 BIND 配置文件中空白可能出现的任何地方。为了迎各种类型的程序员，注释可以使用\
    \ C、C++ 或 shell/perl 结构来编写。\n\n### 6.1.2.1. 语法\n\n```\n* 这是一个像 C 一样的 BIND 注释 */\n\
    // 这是一个像 C++ 一样的 BIND 注释\n# 这是一个像常用 UNIX shell 和 perl 一样的 BIND 注释\n```\n\n###\
    \ 6.1.2.2. 定义与用法\n\n注释可以出现在 BIND 配置文件中空白可能出现的任何地方。\nC 风格注释以两个字符 `/*`（斜杠、星号）开始，以\
    \ `*/`（星号、斜杠）结束。由于它们由这些字符完全界定，因此可以只注释一行的部分内容，也可以跨多行。\n\nC 风格注释不能嵌套。例如，以下内容无效无效，因为整个注释在\
    \ `/*` 处结束：\n\n```\n* 这是注释的开始。\n这仍然是注释的一部分。\n/* 这是一个错误的嵌套注释尝试。 */\n这不再属于任何注释了。\
    \ */\n```\n\nC++ 风格注释以两个字符 `//`（斜杠、斜杠）开始，并持续到物理行的末尾。它们不能跨越多个物理行；要让一个逻辑注释跨越多行，每行都必须使用\
    \ `//` 对。\n\n例如：\n\n```\n// 这是注释的开始。下一行\n// 是一个新注释，尽管它在逻辑上\n// 是上一个注释的一部分。\n```\n\
    \nShell 风格（或如果你喜欢，是 perl 风格）注释以字符 `#`（井号）开始，并像 C++ 注释一样持续到物理行的末尾。\n\n例如：\n\n```\n\
    # 这是注释的开始。下一行\n# 是一个新注释，尽管它在逻辑上\n# 是上一个注释的一部分。\n```\n\n> 警告\n> 警告：你不能像在区域文件（zone\
    \ file）中那样使用分号（`;`）字符来开始注释。分号表示配置语句的结束。\n\n## 6.2. 配置文件语法\n\n一个 B 9 配置由语句和注释组成。语句和注释是可以在不包含在大括号内的情况下出现的唯一元素。许多语句包含一个子语句块，这些子语句也以分号终止。\n\
    \n支持以下语句：\n\n| 语句 | 描述 |\n| :--- | :--- |\n| acl | 定义一个命名的 IP 地址匹配列表，用于访问控制和其他用途。\
    \ |\n| controls | 声明供 `rndc` 工具程序使用的控制通道。 |\n| include | 包含文件。 |\n| key | 指定用于使用\
    \ TSIG 进行身份验证和授权的密钥信息。 |\n| logging | 指定服务器日志的内容以及日志消息发送到的位置。 |\n| options | 控制全局服务器配置选项和其他语句的默认值。\
    \ |\n| server | 基于每个服务器设置某些配置选项。 |\n| trusted-keys | 定义 DNSSEC 密钥。 |\n| view |\
    \ 定义一个视图（view）。 |\n| zone | 定义一个区域（zone）。 |\n\n`logging` 和 `options` 语句可以定义一次。\n\
    \n### 6.2.1. acl 语法\n\n```\nacl name {\n  list list\n};\n```\n\n### 6.2.2. acl\
    \ 定义与用法\n\n`acl` 语句定义一个命名的 IP 地址匹配列表，用于访问控制和其他用途。\n注意：`acl` 语句只能定义一次。\n\n| 列表\
    \ | 描述 |\n| :--- | :--- |\n| any | 匹配所有主机。 |\n| none | 不匹配任何。 |\n| localhost |\
    \ 匹配回环地址。 |\n\n### 6.2.3. controls 语法\n\n```\ncontrols {\n  inet port {\n    allow\
    \ list;\n    keys list;\n  };\n}\n```\n\n### 6.2.4. controls 定义与用法\n\n`controls`\
    \ 语句声明供 `rndc` 工具程序使用的控制通道。\n`inet` 语句在指定的端口上监听。`inet` 端口可以是 IPv4 或 IPv6 地址。使用\
    \ `*` 端口表示监听所有接口。`allow` 子句允许根据匹配列表进行访问。`keys` 子句允许通过密钥列表对消息进行签名。\n\n要禁用控制通道，可以使用空的\
    \ `controls` 语句：`controls { };`\n\n"
