    The domain information groper (**dig**) is a command line tool that can be used
    to gather information from the Domain Name System servers. Dig has two modes:
    simple interactive mode for a single query, and batch mode which executes a query
    for each in a list of several query lines. All query options are accessible from
    the command line.'
