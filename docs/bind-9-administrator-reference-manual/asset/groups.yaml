    Any single $ symbols within the lhs are replaced by the iterator value. To get
    a \ $ in the output you need to escape the $ using a backslash \ e.g. \$ $ may
    optionally be followed by modifiers which change the offset from the iterator,
    field width and base. Modifiers are introduced by a [offset,width,base], e.g.
    $[-2,3,d] which subtracts 20 from the current value, prints the result as a decimal
