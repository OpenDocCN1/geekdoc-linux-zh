    此选项用于 BIND 8，用于让服务器将回车符（“r”）视为与空格或制表符相同，以便加载在 NT 或 DOS 机器上生成的 UNIX 系统区域文件。在 BIND
    9 中，UNIX 的“\n”和 NT/DOS 的“\r\n”换行符均接受，该选项被忽略。


    # additional-from-cache


    这些选项控制权威服务器在回答具有额外数据的查询，或遵循 CNAME 和 DDNAME 链时的行为。


    当这两个选项都设置为 **yes**（默认值）且查询是从权威数据回答的（配置了服务器）时，响应的额外数据部分将从缓存中填充。在某些情况下，这是不可取的，例如对缓存的正确性的担忧，或者在从区域被第三方修改的服务器中。避免搜索这些额外数据将加快服务器操作，但可能会导致额外的权威查询。例如，如果查询请求
    `foo.example.com` 的 MX 记录，并且发现了记录“MX 10 mail.example.net”，通常 `mail.example.net`
    的地址记录（A 和 AAAA）也将提供，如果已知的话。将这些选项设置为 no。这些选项用于权威仅服务器或权威仅视图。在不指定递归 no 的情况下，这会导致服务器忽略这些选项并记录警告消息。


    指定 additional-from-cache 实际上不仅禁用了查找数据时的缓存，还用于查找答案。这通常是存在缓存数据正确性问题的权威仅服务器的期望行为。


    当服务器被递归查询一个不是权威顶点的名称时，由于额外数据来自缓存，服务器通常会带有根服务器或某些父节点的引用。如果指定了 additional-from-cache，服务器将无法提供引用，而是将用
    REFUSED 回答查询。除非解析过程不需要引用，否则这不会引起任何问题。


    # match-mapped-addresses


    如果设置为 yes，则 IPv4 映射地址将匹配任何地址列表。启用此选项对于启用了 IPv6 的系统很有用，可以解决映射地址导致 TCP 连接被始终接受的内核缺陷。出于其他目的使用此选项是不被建议的。


    # 6.2.14.2. Forwarding


    转发设施可用于在服务器上创建站点范围缓存，减少到外部名称服务器的流量。它也可以用于无法访问 Internet 但希望查询外部的服务器。转发发生在服务器不是权威且缓存中没有答案的查询上。


    # forward


    此选项仅在 forwarders 列表不空时有意义。值为 first（默认值）会导致服务器首先查询转发器，如果转发器没有回答，服务器将自行查找答案。如果指定
    only，服务器将仅查询转发器。


    # forwarders


    指定用于转发的 IP 地址。默认是空列表（不转发）。


    转发也可以按域名配置，允许特定域名使用不同的转发器，或具有不同的 **forward only/first** 行为，或完全不转发，参见第 6.2.21 节。


    ### 6.2.14.3. Access Control


    根据请求系统的 IP 地址限制对服务器的访问。参见第 6.1.1 节关于如何指定 IP 地址列表的细节。


    allow-notify


    除了区域主节点外，zone 语句中也可以指定 allow-notify，在这种情况下它会覆盖 options allow-notify 语句。它仅对于从区域有意义。如果没有指定，默认是仅来自从主的消息。


    allow-query


    指定哪些主机允许提问普通问题。zone 语句中也可以指定 allow-query，在这种情况下它会覆盖 options allow-query 语句。如果没有指定，默认是允许所有主机的查询。


    allow-recursion


    指定哪些主机允许通过此服务器进行递归查询。如果没有指定，默认是允许所有主机的递归查询。注意，禁止某个主机的递归查询并阻止该主机检索服务器缓存中的数据。


    allow-v6-synthesis


    指定哪些主机接收第 6.2.14.13 节所述的 IPv6 查询合成响应。


    allow-transfer


    指定哪些主机允许从服务器接收区域传输。zone 语句中也可以指定 allow-transfer，在这种情况下它会覆盖 options allow-transfer
    语句。如果没有指定，默认是允许向所有主机传输。


    blackhole


    指定服务器不会接受用于查询的地址列表。来自这些地址的查询将不会响应。默认是 **none**。


    # 6.2.14.4. Interfaces


    可以使用 **listen-on** 选项指定服务器回答的接口和端口。listen-on 接受一个可选端口和一个 *address_match_list*。服务器将在匹配列表允许的所有接口上监听。如果没有指定端口，将使用端口
    53。


    允许使用**多个 listen-on** 语句。例如：


    ```

    listen-on { 5.6.7.8; }

    listen-on port 1234 { !1.2.3.4; 1.2/16 };

    ```


    将为 IP 地址 5.6.7.8 开启端口 53 名称服务器，为机器上不是 1.2.3.4 的地址开启端口 1234 名称服务器。


    如果没有 **no listen-on-v6**，服务器将在所有接口上监听端口 53。


    **listen-on-v6** 选项用于指定服务器监听使用 IPv6 传入查询的端口。服务器不会像 IPv4 那样为每个 IPv6 接口地址绑定单独的套字。相反，它在
    IPv6 通配符地址上监听。因此，listen-on-v6 参数允许的值只有


    ```

    { any; }

    ```


    和


    ```

    { none; }

    ```


    可以使用多个 **listen-on-v6** 来监听多个端口：


    ```

    listen-on-v6 port 53 { any; }

    listen-on-v6 port 1234 { any; };

    ```


    要让服务器不监听任何 IPv6 地址，请使用


    ```

    listen-on-v6 { none; };

    ```


    如果没有指定 listen-on-v6 语句，服务器将不监听任何 IPv6 地址。


    # 6.2.14.5. Query Address


    如果服务器不知道问题的答案，它将查询其他名称服务器。query-source 指定了用于此类查询的地址和端口。对于通过 IPv6 发送的查询，有一个单独


