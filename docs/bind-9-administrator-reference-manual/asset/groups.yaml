    Match lists are primarily used to determine access control for various server
    operations. They are also used to define priorities for querying namesvers and
    to set the addresses on which named listen. The elements which constitute an address
    list can be any of the following:


    - an IP address (IPv4 or IPv6)

    - an prefix in-notation

    - a key ID, defined by the key statement

    - the name of an address list previously defined with the acl statement

    - a nested match list enclosed in braces


    Elements can be negated with a leading exclamation mark (''!'') and the match
    list names "any," "none," "localhost" and "localnets" are predefined. More information
    on those names can be found in the description of the acl.


    When a given IP address or prefix is compared to an address match list, the list
    is traversed in order until an element matches. The interpretation of a match
    depends on on the list is being used for access control, defining listen-on ports,
    or as a topology, and which the element was negated.


