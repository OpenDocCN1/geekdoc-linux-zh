    # 6.1.2. Comment Syntax


    The BIND 9 comment syntax allows for comments to appear anywhere that white space
    may appear in a BIND configuration file. To appeal to programmers of all kinds,
    they can be written in C, C++, or shell/perl constructs.


    # 6.1.2.1. Syntax


    ```

    * This is a BIND comment as in C */

    // This is a BIND comment as in C++

    # This is a BIND comment as in common UNIX shells and perl

    ```


    # 6.1.2.2. Definition and Usage


    Comments may anywhere that whitespace may appear in a BIND configuration file.

    C-style comments start with the two characters /* (slash, star) and end with */
    (star, slash). Because they are completely delimited with these characters, they
    can be used to comment only a portion of a line or span multiple lines.


    C-style comments cannot be nested. For example, the following is not valid because
    the entire comment ends with the /*


    ```

    * This is the start of a comment.

    This is still part of the comment.

    /* This is an incorrect attempt at nesting a comment. */

    This is no longer in any comment. */

    ```'
  - '[PAGE 46]


    C++-style comments start with the two characters // (slash, slash) and continue
    to the end of the physical line. They cannot be continued across multiple physical
    lines; to have one logical comment span multiple lines, each line must use the
    // pair.


    For example:


    ```

    // This is the start of a comment.  The next line

    // is a new comment, even though it is logically

    // part of the previous comment.

    ```


    Shell-style (or per-style, if you prefer) comments start with the character #
    (number sign) and continue to the end of the physical line, as in C++ comments.


    For example:


    ```

    # This is the start of a comment.  The next line

    # is a new comment, even though it is logically

    # part of the previous comment.

    ```


    > Warning

    WARNING: you cannot use the semicolon (;) character to start a comment such as
    you would in a zone file. The semicolon indicates the end of a configuration statement.


