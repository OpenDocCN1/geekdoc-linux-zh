    ## 4.1. 动态更新\n\n动态更新（Dynamic update）是指在特定条件下，添加、修改或删除主区文件中的记录或 RRset 的能力术语。动态更新在\
    \ RFC 2136 中有详细描述。\n\n动态更新通过在区域语句中包含 `allow-update` 或 `update-policy` 子句来按区域启用的。\n\
