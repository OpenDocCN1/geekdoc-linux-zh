  - '[PAGE 74]


    # 6.2.14.12. RRset Ordering


    When multiple records are returned in an answer it may be useful to configure
    the order of the records placed into the response. The rrset-order statement permits
    configuration of the ordering of the records in a multiple record response. See
    the sortlist statement, Section 6.2.14.11.


    An order_spec is defined as follows:


    ```

    [ class_name ] [ type_name ] name "domain_name"\norder ordering

    ```


    If no class is specified, the default is ANY. If no type is specified, the default
    is ANY. If no name is specified, the default is ".


    The legal values for ordering are:


    | | |

    |---|---|

    | fixed | Records are returned in the order they are defined in the zone file.
    |

    | random | Records are returned in some random order. |

    | cyclic | Records are returned in a round-robin order. |


    For example:


    ```

    rrset-order {

    class IN type name "host.example.com" order random;\norder cyclic;\n}

    ```


    will cause any responses for type A records in class IN that have "host.example.com"
    as a suffix, to always be returned in random order. All other records are returned
    in cyclic order.


    If multiple rrset-order statements appear, they are not combined — the last one
    applies.


    > Note: The rrset-order statement is not implemented in BIND 9. BIND 9 supports
    only a "random-cyclic" ordering, where the server randomly chooses a starting
    point within the RRset and returns the records in order starting at that point,
    wrapping around the end of the RRset if necessary.


    # 6.2.14.13. Synthetic IPv6 responses


    Many stub resolvers support IPv6 DNS lookups as defined in RFC1886, using AAAA
    records'
  - '[PAGE 75]


    # Chapter 6. BIND 9 Configuration Reference


    for forward lookups and "nibble labels" in the ip6.int domain for reverse lookups,
    but do not support RFC2874-style lookups (using A6 records and binary labels in
    the ip6.arp domain).


    For those who wish to continue using such stub resolvers rather than switching
    to the BIND 9 lightweight resolver, BIND 9 provides a way to automatically convert
    RFC1886-style lookups into RFC2874-style lookups and return the results as "synthetic"
    AAAA and PTR records.


    This feature is disabled by default and can be enabled by all-v6-synthesis { address_match_list
    } clause to the options or view statement. When it is enabled, recursive AAAA
    queries cause the server to first try an AAAA lookup and if fails, an AAAA look.
    No matter which one succeeds, the results are returned as a set of synthetic AAAA
    records. Similarly, recursive PTR queries in ip6.int will cause a lookup in ip6.arp
    using binary labels, and if that fails, another lookup in ip6.int. The results
    are returned as a synthetic PTR record in ip6.int.


    The synthetic records have a TTL of zero. DNSSEC validation of synthetic responses
    is not currently supported; therefore responses containing synthetic RRs will
    not have the AD flag set.


    Note: all-v6-synthesis is only performed for clients that are supplied recursive
    service.


    # 6.24.14. Tuning


    lame-ttl


    Sets the number of seconds to cache a lame server indication. 0 disables caching.
    (This is NOT recommended.) Default is 600 (10 minutes). Maximum value is 1800
    (30 minutes).


    max-nache-ttl


    To reduce network traffic and increase performance the server stores negative
    answers. max-nache-ttl is used to set a maximum retention time for these answers
    in the server in seconds. The default max-nache-ttl is 10800 seconds (3 hours).
    max-nache-ttl cannot exceed 7 days and will be silently truncated to 7 days if
    a greater value.


    max-cache-ttl


    max-cache-ttl sets the maximum time for which the server will cache ordinary (positive)
    answers. The default is one week (7 days).


    min-roots


    The minimum number of root servers that is required for a request for the root
    servers to be accepted. Default is 2.'
