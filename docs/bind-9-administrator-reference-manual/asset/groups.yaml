    ## 3.2. 负载均衡


    基础的负载均衡可以通过在 DNS 中为名称使用多个 A 记录来实现。

    例如，如果你有三个网络地址分别为 10.0.0.1、10.0.0.2 和 10.0.0.3 的 WWW 服务器，设置如下的一组记录意味着客户端将在三分之一的时间连接到某一台机器：


    | 名称 | TTL | 类 | 类型 | 资源记录 (RR) 数据 |

    |---|---|---|---|---|

    | www | 600 | IN | A | 10.0.0.1 |

    | | 600 | IN | A | 10.0.0.2 |

    | | 600 | IN | A | 10.0.0.3 |


    当解析器查询这些记录时，BIND 将轮询它们并以不同的顺序对查询做出响应。在上面的示例中，客户端将随机接收到按 1, 2; 3; 2, 1; 以及 3, 1,
    2 顺序的记录。大多数客户端将使用返回的第一条记录并丢弃其余。


    关于请求排序的更多细节，请检查 **options** 语句中的 **rrset-order**，参见 **RRset 排序 (RRset Ordering)**。该子语句在
    BIND 9 中不支持，仅支持所描述的排序方案。


