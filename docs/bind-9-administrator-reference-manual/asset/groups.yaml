    # Chapter 5. The BIND 9 Lightweight Resolver


    ## 5.1. The Lightweight Resolver Library


    Traditionally applications have been linked with a stub resolver library that
    sends recursive DNS queries to a local caching name server.


    IPv6 introduces new complexity to the resolution process, such as following A6
    chains and DNAME records, and simultaneous lookup of IPv4 and IPv6 addresses.
    These are hard and impossible to implement in a traditional stub resolver.


    Instead, BIND provides resolution services to a lightweight resolver library and
    a resolver daemon process running on the local host. These communicate using a
    simple UDP-based protocol, the "lightweight resolver protocol" that is distinct
    from and simpler than the full DNS protocol.


    ## 5.2. Running a Resolver Daemon


    To use the lightweight resolver interface, the system must run the resolver daemon
    lwres.


    By default, applications using the lightweight resolver library will make UDP
    requests to the IPv4 loopback address (127.0.0.1) on port 921. The address can
    be overridden by lwserver lines in /etc/resolv.conf. The daemon will try to answer
    the questions "what are the addresses for host foo.example.com?" and "what are
    the names for IPv4 address 10.1.2.3?"


    The daemon currently looks only in the DNS, but in the future may use other sources
    such as /etc/hosts, NIS, etc.


    The lwres daemon is essentially a caching-name server that answers requests using
    the lightweight resolver protocol rather than the DNS protocol. Because it needs
    to run on each host, it is designed to require no or minimal configuration. Unless
    configured otherwise, it uses the name servers listed on nameserver lines in /etc/resolv.conf
    as forwarders, but is also capable of resolving the autonomously if none are specified.


    The lwres daemon may also be configured with a named.conf style file, in /etc/lwres.conf
    by default. A name server may also be configured to act as a lightweight resolver
    daemon using the lwres statement in named.conf.


    # Chapter 6. BIND 9 Configuration Reference


    BIND 9 configuration is broadly similar to BIND 8.x; however, there are a few
    new areas of configuration, such as views. BIND 8.x configuration files should
    work with few alterations in BIND 9, although more complex configurations should
    be reviewed to check if they can be more efficiently implemented using the new
    features found in BIND 9.


    BIND 4 configuration files can be converted to the new format using the shell
    script contrib/named-bootconf/named-bootconf.sh.


    ## 6.1. Configuration File Elements


    Following is a list of elements used throughout the bind configuration:


    | acl_name | The name of an address_match_list as defined by the **acl statement**.
    |

