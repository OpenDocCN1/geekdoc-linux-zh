    参数指定的域名不是绝对的，则会将当前的 $ORIGIN 附加到 $ORIGIN 参数中指定的域名之后。


    ```

    $ORIGIN example.com.

    WWW CNAME  MAIN-SERVER

    ```


    等同于


    ```

    WWW.EXAMPLE.COM. CNAME MAIN-SERVER.EXAMPLE.COM.

