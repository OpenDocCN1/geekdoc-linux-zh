    \nThe options statement has three clauses: default-server, default-key, and default-port.\
    \ default-server takes a host name or address argument and represents the server\
    \ that will be contacted if no -s option is provided on the command line. default-key\
    \ takes the name of key as its argument, defined by a key statement. default-port\
    \ specifies the port to which rndc will connect if no port is given on the command\
