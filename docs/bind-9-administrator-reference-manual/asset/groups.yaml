    \ Inc. 希望其内部客户端能够解析外部主机名，并与外部人员交换邮件。该公司还希望其内部解析器能够访问某些仅限内部的区域，这些区域在内部网络外部完全不可用。\n\
    \n为了实现这一点，公司将设置两组名称服务器。一组位于内部网络（在保留的 IP 空间内），另一组位于堡垒机上，这些是位于 DMZ 的、与网络双端都通信的“代理”主机。\n\
