    # Chapter 6. BIND 9 Configuration Reference


    # version


    The version the server should report via a query of name version.bind in class
    CHAOS. The default is the real version number of this server.


    # directory


    The working directory of the server. Any non-absolute pathnames in the configuration
    file will be taken as relative to this directory. The default location for most
    server output files (e.g. named.run) is this directory. If a directory is not
    specified, the working directory defaults to ''.'', from which the server was
    started. The directory specified should be an absolute path.


    # named-xfer


    This option is obsolete. It was used in BIND 8 to specify the pathname to the
    named-xfer program. In BIND 9, no separate named-xfer program is needed; its functionality
    is built into the name server.


    # tkey-domain


    The domain appended to the names of all shared keys generated with TKEY. When
    a client requests a TKEY exchange, it may may not specify the desired name for
    the key. If present, the name of the shared key will be "client specified part+"+tkey-domain".Otherwise,
    the name of the shared key will be "random hex digits"+"tkey-domain". In most
    cases, the domainname should be the server''s domain name.


    # tkey-dhkey


    The Diffie-Hellman key used by the server to generate shared keys with clients
    using the Diffie-Hellman mode of TKEY. The server must be able to load the public
    and private keys files from the working directory. In most cases, the keyname
    should be the server''s host name.


    # dump-file


    The pathname of the file the server dumps the database to when instructed to do
    so with rndcdumpdb. If not specified, the default is named_dump.db.


    # statistics-file


    The pathname of the file server writes memory usage statistics to exit. If not
    specified, the default is named.memstats.


    > Note: Not yet implemented in BIND 9.'
