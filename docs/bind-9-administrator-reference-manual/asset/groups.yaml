  - "[PAGE 22]\n\n# Chapter 3. Nameserver Configuration\n\nalternate location can\
    \ be specified with the -c option. If the configuration file is not found, rndc\
    \ will also look in /etc/rndc.key (or whatever sysconfdir defined when the BIND\
    \ bind was configured). rndc.key file is generated by running rndc-congen -a as\
    \ described in Section 6.2.4.\n\nThe format of the configuration file is similar\
    \ to that of named.conf, but limited to four statements, the options, key, server\
