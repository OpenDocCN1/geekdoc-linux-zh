    \ transferred from the primary master, but it is also possible to transfer it\
    \ from another slave. In other words, a slave server may itself act as a master\
    \ to a subordinate slave server.\n\n## 1.4.4.3. Stealth Servers\n\nUsually all\
    \ of the zone's authoritative servers are listed in NS records in the parent zone.\
    \ These NS records constitute a *delegation of the zone* from the parent. The\
    \ authoritative servers are also listed in the zone file itself, at the *top level\
    \ or apex* of the zone. You can list servers in the zone's top-level NS records\
    \ that are not in the parent's NS delegation, but you cannot list servers in the\
    \ parent's delegation that are not present at the zone's top level.\n\n*A stealth\
    \ server* is a server that is authoritative for a zone but is not listed in that\
    \ zone's NS records. Stealth servers can be used for keeping a local copy of a\
    \ zone to speed up access to the zone's records or to make sure the zone is available\
    \ even if all the \"official\" servers for the zone are inaccessible.\n\nA configuration\
    \ where the primary master server itself is a stealth server is often referred\
    \ to as a \"hidden primary\" configuration. Use one for this configuration is\
    \ when the primary master is behind a firewall and therefore unable to communicate\
    \ directly with the outside world.\n\n## 1.4.5. Caching Name Servers\n\nThe resolver\
    \ libraries provided by most operating systems are stub resolvers, meaning that\
    \ they are not capable of performing the full DNS resolution process by themselves\
    \ by calling directly to the authoritative servers. Instead, they rely on a local\
    \ name server to perform the resolution on their behalf. Such a server is called\
    \ a recursive name server; it performs recursive lookups for local clients.\n\n\
    To improve performance, recursive servers cache the results of the lookups they\
    \ perform. Since the processes of recursion and caching are intimately connected,\
    \ the term recursive server and caching server are often used synonymously.\n\n\
    The length of time for which a record may be retained in the cache of a caching\
    \ name server is controlled by the Time To Live (TTL) field associated with each\
    \ resource.\n\n## 1.4.5.1. Forwarding\n\nEven a name server does not necessarily\
    \ perform the recursive lookup itself. Instead, it can forward some or all of\
    \ the queries that it cannot satisfy from its cache to another name server, commonly\
    \ referred to as a forwarder.\n\nThere may be one or more forwards, and they are\
    \ queried in turn until the list is exhausted or an answer is found. Forwards\
    \ are typically used when you do not wish all the servers at a site to interact\
    \ directly with the Internet servers. A typical scenario would involve a number\
    \ of internal DNS servers and an Internet firewall. Servers unable to pass packets\
    \ through the firewall forward to the server that can do it, and that server query\
    \ the Internet DNS servers on the internal server's behalf. An added benefit of\
    \ using the forwarding feature is that the central machine develops a much more\
    \ complete cache of information that all the clients can take advantage of.\n\n\
    ## 1.4.6. Name Servers in Multiple Roles\n\nThe BIND name server can simultaneously\
    \ act as a master for some zones, a slave for other zones, and as a caching (recursive)\
    \ server for a set of local clients.\n\nHowever, since the functions of authoritative\
    \ name service and caching/recursive name service are logically separate, it is\
    \ often advantageous to run them on separate servers. A server that only provides\
    \ authoritative name service (an authoritative-only server) can run with recursion\
    \ disabled, improving reliability and security. A server that is not authoritative\
    \ for any zones and provides recursive service to local clients (a caching-only\
    \ server) does not need to be reachable from the Internet at large and can be\
    \ placed inside a firewall.\n\n## Chapter 2. BIND Resource Requirements\n\n##\
    \ 2.1. Hardware requirements\n\nDNS hardware requirements have traditionally been\
    \ quite modest. For many installations, servers that have been pensioned off active\
    \ duty have performed admirably as DNS servers.\n\nThe DNSSEC and IPv6 features\
    \ of BIND 9 may prove to be quite CPU intensive, however, organizations that make\
    \ heavy use of these features may wish to consider larger systems for these applications.\
    \ BIND 9 is now fully multithreaded, allowing full utilization of multiprocessor\
    \ systems for installations that need it.\n\n## 2.2. CPU Requirements\n\nCPU requirements\
    \ for BIND 9 range from i486-class machines for serving of static zones without\
    \ caching, to enterprise-class machines if you intend to process many dynamic\
    \ updates and DNSSEC signed zones, serving thousands of queries per second.\n\n\
    ## 2.3. Memory Requirements\n\nThe memory of the server has to be large enough\
    \ to fit the cache and zones off disk. The max-cache-size option can be used to\
    \ limit the amount of memory used by the cache, at the expense of reducing cache\
    \ hits and causing more DNS traffic. It is still good practice to have enough\
    \ memory to load all zone into memory.\n\n## 2.4. Nameserver Intensive Issues\n\
    \nFor nameserver intensive environments, there are two alternative configurations\
    \ that may be used. The first is where clients and any second-level namesvers\
    \ query a main nameserver, which has enough memory to build a large cache. The\
    \ second alternative is to set up second-level namesvers independently. In this\
    \ configuration, none of the individual machines needs as much memory.\n\n## 2.5.\
    \ Supported Operating Systems\n\nISC BIND 9 compiles and runs on the following\
    \ operating systems:\n\n- IBM AIX 4.3\n- Compaq Digital/Tru64 UNIX 4.0\n- Compaq\
    \ Digital/Tru64 UNIX 5 (with IPv6)\n- HP HP-UX 11\n- IRIX 64\n- Sun Solaris 2.6,\
    \ 7, 8\n- NetBSD 1.5 (with-pthreads 0.17)\n- FreeBSD 3.4-STABLE, 3.5, 4.0, 4.1\n\
    - Red Hat Linux 6.0, 6.1, 6.2, 7.0\n\n## Chapter 3. Nameserver Configuration\n\
    \nIn this section we provide some suggested configurations along with guidelines\
    \ for their use. We also address the topic of reasonable option setting.\n\n##\
    \ 3.1. Sample Configurations\n\n### 3.1.1. A Caching-only Nameserver\n\nThe following\
    \ sample configuration is appropriate for a caching-only server for use by clients\
    \ from outside are refused.\n\n```\n // Two corporate subnets we wish to allow\
    \ queries from.\nacl \"corpnets\" ( 192.168.4.0/24; 192.168.7.0/24 );\noptions\
    \ {\n    directory \"/etc/namedb\"; // Working directory\n    pid-file \"named.pid\"\
    ; // Put pid file in working dir\n    allow-query { \"corpnets\"; }\n}\n// Root\
    \ server hints\nzone \". { type hint; file \"root.hint\"; };\n// Provide a reverse\
    \ mapping for the loopback address 127.0.0.1\nzone \"0.0.0.127.in-addr.arpa\"\
    \ {\n    type master;\n    file \"localhost.rev\";\n    notify no;\n}\n```\n\n\
    ### 3.1.2. An Authoritative-only Nameserver\n\nThis sample configuration is for\
    \ an authoritative-only server that is the master server for \"example.com\" and\
    \ a slave for the subdomain eng.example.com\".\n\n```\noptions {\n    directory\
    \ \"/etc/namedb\"; // Working directory\n    pid-file \"named.pid\"; // Put pid\
    \ file in working dir\n    allow-query { any; }; // This is the default\n    recursion\
    \ no; // Do not provide recursive service\n}\n```\n"
  mdcn: "\n区域。为了让 DNS 能够容服务器和网络故障，大多数区域有两个或多个权威服务器。\n\n权威服务器的响应在数据包中设置了“权威回答”（AA）位。这使得在使用\
    \ **dig**（第 3.4.1.1 节）等工具调试 DNS 配置时能够轻松识别它们。\n\n## 1.4.4.1. 主服务器 (Primary Master)\n\
    \n维护区域数据主副本的权威服务器被称为*主主服务器*，或简称为*主服务器*。它从某些人工编辑的本地文件，或者可能是由人工编辑的其他本地文件机械生成的文件中加载区域内容。该文件被称为*区域文件*。\n\
    \n## 1.4.4.2. 从服务器 (Slave Servers)\n\n其他权威服务器，即*从服务器*（也称为*从服务器*），通过称为*区域传输*的复制过程从另一台服务器加载区域内容。通常数据是从主服务器传输的，但也可以从另一个从服务器传输。换句话说，从服务器本身也可以作为其下级从服务器的主服务器。\n\
    \n## 1.4.4.3. 隐藏服务器 (Stealth Servers)\n\n通常，该区域的所有权威服务器都列在父区域的 NS 记录中。这些 NS 记录构成了父区域对该区域的*委托*。权威服务器也列在区域文件本身，位于区域的*顶层或顶点*（apex）。你可以在区域的顶层\
    \ NS 记录中列出不在父区域 NS 委托中的服务器，但你不能在父区域委托中列出不在区域顶层存在的服务器。\n\n*隐藏服务器*是对某个区域具有权威性但未列在该区域\
    \ NS 记录中的服务器。隐藏服务器可用于保留区域的本地副本，以加速对区域记录的访问，或确保即使该区域的所有“官方”服务器不可用，该区域仍然可用。\n\n\
    主服务器本身即是隐藏服务器的配置通常被称为“隐藏主”配置。使用这种配置的场景是主服务器位于防火墙之后，因此无法与外部世界直接通信。\n\n## 1.4.5.\
    \ 缓存名称服务器 (Caching Name Servers)\n\n大多数操作系统提供的解析器库是“存根解析器”（stub resolvers），这意味着它们无法通过直接调用权威服务器来自己执行完整的\
    \ DNS 解析过程。相反，它们依赖本地名称服务器代表它们执行解析。这样的服务器被称为递归名称服务器（recursive name server）；它为本地客户端执行递归查找。\n\
    \n为了提高性能，递归服务器会缓存它们执行的查找结果。由于递归和缓存过程紧密相连，“递归服务器”和“缓存服务器”术语通常被同义使用。\n\n记录在缓存名称服务器缓存中保留的时间由与每个资源关联的生存时间（TTL）字段控制。\n\
    \n## 1.4.5.1. 转发 (Forwarding)\n\n即使是名称服务器也不一定会自己执行递归查找。相反，它可以将其无法从缓存中满足的某些或全部查询转发到另一个名称服务器，这通常被称为转发器（forwarder）。\n\
    \n可能有一个或多个转发器，会按顺序对其进行查询，直到列表耗尽或找到答案。当你不希望站点的所有服务器都与互联网服务器直接交互时，通常会使用转发。一个典型的场景涉及一些内部\
    \ DNS 服务器和一个互联网防火墙。无法通过防火墙传递数据包的服务器将请求转发到可以执行此的服务器，由该服务器代表内部服务器查询互联网 DNS 服务器。使用转发功能的额外益处是，中央机器建立了一个更完整的信息缓存，所有客户端都可以从中受益。\n\
    \n## 1.4.6. 多重角色的名称服务器\n\nBIND 名称服务器可以同时担任某些区域的主服务器、其他区域的从服务器，以及一组本地客户端的缓存（递归）服务器。\n\
    \n然而，由于权威名称服务和缓存/递归名称服务的功能在逻辑上是分离的，因此将它们运行在单独的服务器上是有益的。仅提供权威名称服务的服务器（仅权威服务器）可以在禁用递归的情况下运行，从而提高可靠性和安全性。对于任何区域都没有权威性且为本地客户端提供递归服务的服务器（仅缓存服务器）不需要从整个互联网访问，可以放置在防火墙内部。\n\
    \n## 第 2 章 BIND 资源需求\n\n## 2.1. 硬件要求\n\nDNS 的硬件需求传统上相当小。对于许多安装来说，退役活跃岗位的服务器作为\
    \ DNS 服务器的表现依然出色。\n\n然而，BIND 9 的 DNSSEC 和 IPv6 特性证明是相当消耗 CPU 的，大量使用这些特性的组织可能希望为这些应用程序考虑更大的系统。BIND\
    \ 9 现在已完全支持多线程，允许在需要它的的安装中充分利用多处理器系统。\n\n## 2.2. CPU 要求\n\nBIND 9 的 CPU 要求从提供不带缓存的静态区域服务的\
    \ i486 级机器，到如果你打算处理许多动态更新和 DNSSEC 签名区域、每秒提供数千次查询的企业级机器。\n\n## 2.3. 内存要求\n\n服务器内存足够大以容纳缓存和离磁盘的区域。可以使用\
    \ `max-cache-size` 选项来限制缓存使用的内存量，但以减少缓存命中和导致更多 DNS 流量为代价。拥有足够的内存将所有区域加载到内存中仍然是一个良好的做法。\n\
    \n## 2.4. 名称服务器密集型问题\n\n对于名称服务器密集型环境，可以使用两种替代配置。第一种是客户端查询主服务器，主服务器有足够的内存构建大型缓存。第二种替代方案是独立设置从级名称服务器。在这种配置下，单个机器不需要那么多内存。\n\
    \n## 2.5. 支持的操作系统\n\nISC BIND 9 编译并运行在以下操作系统：\n\n- IBM AIX 4.3\n- Compaq Digital/Tru64\
    \ UNIX 4.0\n- Compaq Digital/Tru64 UNIX 5 (带 IPv6)\n- HP HP-UX 11\n- IRIX 64\n\
    - Sun Solaris 2.6, 7, 8\n- NetBSD 1.5 (带 threads 0.17)\n- FreeBSD 3.4-STABLE,\
    \ 3.5, 4.0, 4.1\n- Red Hat Linux 6.0, 6.1, 6.2, 7.0\n\n## 第 3 章 名称服务器配置\n\n在本节中，我们提供了一些建议配置以及使用指南。我们还讨论了合理选项设置的主题。\n\
    \n## 3.1. 示例配置\n\n### 3.1.1. 仅缓存名称服务器\n\n以下示例配置适用于拒绝外部客户端使用的仅缓存服务器。\n\n```\n //\
    \ 我们希望允许查询的两个子网。\nacl \"corpnets\" ( 192.168.4.0/24; 192.168.7.0/24 );\noptions\
    \ {\n    directory \"/etc/namedb\"; // 工作目录\n    pid-file \"named.pid\"; // 将\
    \ pid 文件放在工作目录\n    allow-query { \"corpnets\"; }\n}\n// 根服务器提示\nzone \". { type\
    \ hint; file \"root.hint\"; };\n// 为环回地址 127.0.0.1 提供反向映射\nzone \"0.0.0.127.in-addr.arpa\"\
    \ {\n    type master;\n    file \"localhost.rev\";\n    notify no;\n}\n```\n\n\
    ### 3.1.2. 仅权威名称服务器\n\n此示例配置适用于作为 \"example.com\" 主服务器以及作为子域 eng.example.com\"\
    \ 从服务器的仅权威服务器。\n\n```\noptions {\n    directory \"/etc/namedb\"; // 工作目录\n   \
    \ pid-file \"named.pid\"; // 将 pid 文件放在工作目录\n    allow-query { any; }; // 这是默认值\n\
    \    recursion no; // 不提供递归服务\n}\n```\n"
