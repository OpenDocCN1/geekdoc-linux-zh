    # 4.4. TSIG


    This is a short guide to setting Transaction Signatures (TSIG) based transaction
    security in BIND. It describes changes to the configuration file as well as what
    changes are required for different features, including the process of creating
    transaction keys and using transaction signatures with BIND.


    BIND primarily supports TSIG for server communication. This includes zone transfer,
    notify, and recursive query messages. Resolvers on newer versions of BIND 8 have
    limited support for TSIG.


    TSIG might be most useful for dynamic update. A primary server for a dynamic zone
    should use access control to control updates, but IP-based access control is important.
    Key-based access control is far superior, see Proposed Standards. The nupdate
    program supports TSIG via the -k and -y command options.


    # 4.4.1. Generate Shared Keys for Each Pair of Hosts


    A secret is generated to be shared between host1 and host2. An arbitrary key name
    is chosen: "host1-host2.\ The key name must be the same on both hosts.


    # 4.4.1.1. Automatic Generation


    The following command will generate a 128 bit (16 byte) HMAC-MD5 key as described.
    Longer keys are better, but easier to digest with MD5. Note that the maximum key
    length is 512 bits; keys longer than what is needed to produce a 128 bit.


    ```

    dnssec-keygen -a hmac-md5 -b 128 -n HOST host1-host2.

    ```


    The key is in the file Khost1-host2+.157+00000.private. Not directly using this
    file, but the base-64 encoded string following "Key:" can be extracted from the
    file and used as a shared secret:


    Key: La/E5cG90+0sl1jq0a2da==


    The string "La/E5cG90+0sl1jq0a2da==" can be used as the shared secret.'
  - "[PAGE 30]\n\n# 4.4.1.2. Manual Generation\n\nThe shared secret is simply a random\
    \ sequence of bits, encoded in base-64. Most ASCII strings are valid base-64 (assuming\
    \ the length is a multiple of 4 and only valid characters are used), so the shared\
    \ secret can be manually generated.\n\nAlso, a known string can be run through\
    \ mmencode or a similar program to generate base-64 encoded data.\n\n# 4.4.2.\
    \ Copying the Shared Secret to Both Machines\n\nThis is beyond the scope of transport.\
    \ A secure transport mechanism should be used. This could be secure FTP, ssh,\
    \ telephone, or.\n\n# 4.4.3. Informing the Servers of the Key's Existence\n\n\
    Imagine host1 and host 2 are both servers. The following is added to each server's\
    \ named.conf file:\n\n```\nkey host1-host2. {\n  algorithm hmac-md5;\n  secret\
    \ \"LaESCJG90+0sljqq0a2jdA==\";\n}\n```\n\nThe algorithm, hmac-md5, is the only\
    \ one supported by BIND. The secret is the one generated above. Since this is\
    \ a secret, it is recommended that either named.conf be non-world readable, or\
    \ the key directive be added to a non-world readable file that is included by\
    \ named.conf.\n\nAt this point, the key is recognized. This means that if the\
    \ server receives a message signed by this key, it can verify the signature. If\
    \ the signature succeeds, the response is signed by the same key.\n\n# 4.4.4.\
    \ Instructing the Server to Use the Key\n\nSince keys are shared between two hosts,\
    \ only the server must be told when keys are to be used. The following is added\
    \ to the named.conf file for host1, if the IP address of host2 is 10.1.2.3:\n\n\
    ```\nserver 10.1.2.3 {\n  keys { host1-host2. };\n}\n```"
