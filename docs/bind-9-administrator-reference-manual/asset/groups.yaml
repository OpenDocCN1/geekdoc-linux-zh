    # Chapter 4. Advanced Concepts


    There must also be communication with the administrators of the parent and/or
    child zone to transmit keys and signatures. A zone''s security status must be
    indicated by the parent zone for DNSSEC capable resolver to trust its data.


    For other servers to trust data in this zone, they must either be statically configured
    with this zone''s zone key or the key of any zone above this one in the DNS tree.


    # 4.7.1. Generating Keys


    The dnskeygen program is used to generate keys.

    A secure zone must contain one or more zone keys. The zone keys will sign all
    records in the zone, as well as the zone keys must have the same name as the zone,
    a name type ZONE, and be used for authentication. It is recommended that zone
    keys use a cryptographic algorithm designed as "mandatory to implement" by the
    IETF; currently these are RSA1 (which is not supported in BIND 9.2) and DSA.


    The following command will generate a 768 bit DSA key for the child.example zone:


    ```

    dnsseckey -a DSA -b 768 -n ZONE.example.

    ```


    Two output files will be produced: Rchild.example,+00312345.key and Rchild.example,+00312345.private
    (where 12345 is an example of a key tag). The key file names the key name (child.example.),
    algorithm (3 is DSA, 1 is RSA, etc.), and the key tag (12345 in this case). The
    private key (in the .private file) is used to generate signatures, and the public
    key (in the .key file) is used for signature verification.


    To generate another key with the same properties (but with a different tag), repeat
    the command.


    The public keys should be inserted into the zone file with INCLUDE statements,
    including the .key files.


    # 4.7.2. Creating a Keyset


    The dnsmakekeysyset program is used to create a keyset from one or more keys.


    Once the keys have been generated, a keyset must be built for transmission to
    the administrator of the parent zone, so that the parent zone can sign the keys
    with its own zone key and correctly indicate the security status of this zone.
    Building a keyset, the list of keys to be included and the TTL of the set must
    be specified, and the desired signature validity period of the parent''s signature
    may also be specified.


    34'
