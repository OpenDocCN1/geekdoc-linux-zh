- raw:
  - "[PAGE 50]\n\n# 6.2.8. key Statement Definition and Usage\n\nThe key statement\
    \ defines a shared secret key for use with TSIG, see Section 4.4.\n\nThe key statement\
    \ can occur at the top level of the configuration file or inside a view statement.\
    \ Keys defined in top-level keys can be used in all views. Keys intended for use\
    \ in a controls statement (see Section 6.2.4) must be defined at the top level.\n\
    \nThe key_id, also known as the key name, is a domain name uniquely identifying\
    \ the key. It can be used in a \"server\" statement to cause requests to server\
    \ to be signed with this key, or in address match lists to verify that incoming\
    \ requests have been signed with a key this name, algorithm, and secret.\n\nThe\
    \ algorithm_id is a string that specifies a security/authentication algorithm.\
    \ The only algorithm currently supported by TSIG authentication is hmac-md5. The\
    \ secret_string is the secret used by the algorithm, and is treated as a base-64\
    \ encoded string.\n\n# 6.2.9. logging Statement Grammar\n\n```\nlogging {\n  channel\
    \ channel_name {\n    file path name\n    [ versions ( number | unlimited ) ]\n\
    \    [ size size spec ]\n    syslog syslog_facility\n    stderr\n    null);\n\
    \    [ severity (critical | error | warning | notice | \n      info | debug [\
    \ level ] | dynamic ); ]\n    [ print-category yes or no; ]\n    [ print-severity\
    \ yes or no; ]\n    [ print-time yes or no; ]\n  }\n  [ category category_name\
    \ {\n    channel_name ; [ ... ]\n  };\n}\n```"
  - "[PAGE 51]\n\n# 6.2.10. logging Statement Definition and Usage\n\nThe logging\
    \ statement configures a wide variety of logging options for the nameserver. Its\
    \ channel phrase associates output methods, format options and severity levels\
    \ with a name that can then be used with the category phrase to select how various\
    \ classes of messages are logged.\nOnly logging statement is used to define as\
    \ many channels and categories are wanted. If there is no logging statement, the\
    \ logging configuration will be:\n\n```\nlogging {\n  category \"unmatched\" {\
    \ \"null\"; };\n  category \"default\" { \"default_syslog\"; \"default_debug\"\
    ; };\n}\n```\n\nIn BIND 9, the logging configuration is only established when\
    \ the entire configuration file has been parsed. In BIND 8, it was established\
    \ as soon as the logging statement was parsed. When the server is starting, all\
    \ logging messages regarding syntax errors in the configuration file go to the\
    \ default channels, or to standard error if the -g option was specified.\n\n#\
    \ 6.2.10.1. The channel Phrase\n\nAll log output to one or more channels; you\
    \ can make as many of them as you want.\n\nEvery channel definition must include\
    \ a destination clause that says messages selected for the channel go to a file,\
    \ to a particular syslog facility, to the standard error, or are discarded. You\
    \ can optionally limit the severity level that will be accepted by the channel\
    \ (the default is info), and whether to include a named-generated time stamp,\
    \ the category name and/or severity level (the default is not to include any).\n\
    \nThe null destination clause causes all messages sent to the channel to be discarded;\
    \ in that case, other options for the channel are meaningless.\n\nThe file destination\
    \ directs the channel to a disk file. It can include limits how large the file\
    \ is allowed to grow, and how many versions of the file will be saved each time\
    \ the file is opened.\nIf you use versions log file option, then named will retain\
    \ that many backup versions of the file by renaming them when opening. For example,\
    \ if you choose 3 old versions of the file lamers.log then just lamers.log.1 is\
    \ renamed to lamers.log.2, lamers.log.0 is renamed to lamers.log.1, and lamers.log\
    \ is renamed to lamers.log.0. You can say unlimited; to limit the number of versions.\
    \ If a size option is associated with the log file, then renaming is only done\
    \ when the file being opened exceeds the indicated size. No backup versions are\
    \ kept by default; any existing log file is simply appended.\n\nThe size option\
    \ for files is used to limit log growth. If the file ever exceeds the size, then\
    \ named will stop writing to the file unless it has a versions option associated\
    \ with it. If backup versions are kept, the file"
  - "[PAGE 52]\n\nare rolled as described above and a new one begins. If there are\
    \ no versions option, no more data will be written to the log until some out-of-band\
    \ mechanism removes or truncates the log to less than the maximum size. The default\
    \ behavior is not to limit the size of the file.\n\nExample usage of the size\
    \ and versions options:\n\n```\nchannel \"an_example_channel\" {\n    file \"\
    example.log\" versions 3 20m;\n    print-time yes;\n    print-category yes;\n\
    }\n```\n\nThe syslog clause directs the channel to the system log. Its argument\
    \ is a syslog facility as described in the syslog page. How syslog handles messages\
    \ sent to it is described in the syslog.conf page. If you have a system that uses\
    \ a older version of syslog that only two arguments to the open(), this clause\
    \ is silently ignored.\n\nThe severity clause works like syslog \"priorities,\"\
    \ except that they can also be used if you are writing straight to a file rather\
    \ than using syslog. Messages which are not at the severity level given will not\
    \ be selected for the channel; messages of higher severity levels will be accepted.\n\
    \nIf you are using syslog, then the syslog.conf priorities passes through. For\
    \ example, defining a channel and severity as daemon and debug only logging daemon\
    \ via syslog will cause messages of info and notice to be dropped. If the situation\
    \ were reversed, with named messages of only warning or higher, then syslog would\
    \ print all messages received from the channel.\n\nThe stderr clause directs the\
    \ channel to the server's standard error. This is intended for use when the server\
    \ is running as a foreground process, for example when debugging a configuration.\n\
    The server can supply extensive debugging information when it is in debugging\
    \ mode. If the server's global debug level is greater than zero, then debugging\
    \ mode will be active. The global debug level is set by either starting the named\
    \ with the -d flag followed by a positive integer, or by running rndc trace. The\
    \ global debug level can be set to zero, and higher debug level gives more detailed\
    \ output. Channels that provide a specific debug severity, for example:\n\n```\n\
    channel \"specific_debug_level\" {\n    file \"foo\";\n    severity debug 3;\n\
    }\n```\n\nwill get debugging output of level 3 or less any time the server is\
    \ in debugging mode, regardless of the global debug level. Channels with dynamic\
    \ severity use the server's global level to determine what\nmessages to print."
  - "[PAGE 53]\n\nIf print-time has been turned on, then the date and time will be\
    \ logged. print-time may be specified for a syslog channel, which is usually pointless\
    \ since syslog also prints the date and time. If print-category is requested,\
    \ then the category of the message will be logged as well. If, print-severity\
    \ is on, the severity level of the message will be logged. The print- options\
    \ may be used in any combination, and will always be printed in the following\
    \ order: time, category, severity. Here is an example where all three print-options\
    \ are on:\n\n```\n28-Feb-2000 15:05:32.863 general: notice: running\n```\n\nThere\
    \ are four defined channels that are used for named's default logging as follows.\
    \ How they are is described in Section 6.2.10.2.\n\n```\nchannel \"default_syslog\"\
    \ {\n    syslog daemon;\\                  // send to syslog's daemon\n      \
    \                       // facility\n    severity info;\\                 // only\
    \ send priority info\n                             // and higher\n}\n```\n\n```\n\
    channel \"default_debug\" {\n    file \"named.run\";            // write to named.run\
    \ in\n                             // the working directory\n                \
    \             // Note: stderr is used instead\n                             //\
    \ of \"named.run\"\n                             // if the server is started\n\
    \                             // log at the server's\n    severity dynamic;\\\
    \            // with the '-f' option.\n                             // current\
    \ debug level\n}\n```\n\n```\nchannel \"default_stderr\" {\n    stderr;      \
    \                  // writes to stderr\n    severity info;\\                 //\
    \ only send priority info\n                             // and higher\n}\n```\n\
    \n```\nchannel \"null\" {\n    null;                          // toss anything\
    \ sent to\n                             // this channel\n}\n```\n\nThe default_debug\
    \ has the special property that it produces output when the server's debug level\
    \ is nonzero. It normally writes to a file named.run in the server's working directory."
