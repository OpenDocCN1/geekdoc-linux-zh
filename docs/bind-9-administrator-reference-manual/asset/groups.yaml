    These options control the server''s behavior on refreshing a zone (querying for
    SOA changes) or retrying failed transfers. Usually the SOA values for the zone
    are used, but these values are set by the master, giving server administrators
    little control over their contents.


    These options allow the administrator to set a minimum and maximum refresh and
    retry time per-zone, per-view or globally. These options are valid for slave and
    stub zones, and clamp the SOA refresh and retry times to the specified values.


