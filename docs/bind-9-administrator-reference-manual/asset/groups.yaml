    \n### 4.1.1. 日志文件\n\n所有对使用动态更新区域的更改都存储在区域的日志文件（journal file）中。该文件由服务器在发生第一次动态更新时自动创建，并在相应的区域文件名后添加\
    \ `.jni` 扩展名。日志文件为二进制格式，不应手动编辑。\n\n服务器还会偶尔（“dump”）将更新区域的完整内容转储到其区域文件中。这不会在每次动态更新后立即执行，因为当大区域频繁更新时，这样做速度会太慢。相反，转储会延迟\
    \ 15 分钟，允许进行额外的更新发生。\n\n当服务器在关闭或崩溃后重启时，它将重放日志文件，将上次区域更新之后发生的所有更新合并到区域中。\n\n传入的增量区域传输的更改也以类似的方式记录日志。\n\
    \n动态区域的区域文件通常无法通过手动编辑，因为它们无法保证包含最新的动态更改——这些更改仅位于日志文件中。确保动态区域的区域文件是最新的唯一方法是运行 `rndc`。\n\
    \n如果你必须动态地更改区域，以下步骤将有效：使用 `rndc` 关闭服务器（仅发送信号或使用 `rndc halt` 是不够的）。等待服务器退出，删除区域的\
    \ `.jni` 文件，编辑区域文件，然后重启服务器。删除 `.jni` 文件是必要的，因为手动编辑的内容不会出现在日志中，导致其与区域文件的内容不一致。\n\
    \n## 4.2. 增量区域传输 (IXFR)\n\n增量区域传输 (IXFR) 协议是从服务器仅传输更改数据的方法，而无需传输整个区域。IXFR 协议在\
    \ RFC 1995 中记录。请参见建议标准（Proposed Standards）。\n\n当作为主服务器时，BIND 9 支持那些具有必要的更改历史信息的区域的\
    \ IXFR。这些包括由动态更新维护的主区域，以及通过 IXFR 获取数据的从区域，但不包括手动维护的主区域或通过完整区域传输 (AXFR) 获取的区域。\n\
    \n当作为从服务器时，BIND 9 将尝试使用 IXFR，除非被显式禁用。有关禁用 IXFR 的更多信息，请参见服务器语句中 `request-ixfr`\
    \ 子句的描述。\n\n## 4.3.  Split DNS\n\n为内部和外部资源设置不同的 DNS 视图或可见性，通常称为拆分 DNS（Split DNS）设置。组织想要以这种方式设置其\
    \ DNS 有几个原因。\n\n设置 DNS 系统的常见原因是从互联网上的“外部”客户端隐藏“内部”DNS 信息。关于这是否真的有用存在一些争议。内部信息会以许多方式泄露（例如，通过邮件头），而大多数精明的“攻击者”可以使用其他方法找到他们需要的信息。\n\
    \n另一个设置拆分 DNS 系统的常见原因是允许位于过滤器后面或 RFC 1918 空间（如 RFC 1918 文档的保留 IP 空间）的内部网络在互联网上解析\
    \ DNS。拆分 DNS 还可以允许邮件进入内部网络。\n\n以下是一个 DNS 设置示例：\n\n假设有一名为 Example, Inc. (example.com)\
