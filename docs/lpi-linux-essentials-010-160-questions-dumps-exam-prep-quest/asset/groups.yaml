    business in more countries.


    Note: Answers of the questions are at the end of the book


    # QUESTION 1


    What are the differences between hard disk drives and solid state disks? (Choose
    two.)


    - A. Hard disks have a motor and moving parts, solid state disks do not.

    - B. Hard disks can fail due to physical damage, while solid state disks cannot
    fail.

    - C. Solid state disks can store many times as much data as hard disk drives.

    - D. /dev/sda is a hard disk device while /dev/sda is a solid state disk.

    - E. Solid state disks provide faster access to stored data than hard disks.


    # QUESTION 2


    Reverse DNS assigns hostnames to IP addresses. How is the name of the IP address
    198.51.100.165 stored on a DNS server?


    - A. In the A record for 165.100.51.198.ipv4.arpa.

    - B. In the PTR record for 165.100.51.198.in-addr.arpa.

    - C. In the RNAME record for 198-51-100-165.rev.arpa.

    - D. In the ARPA record for 165.100.51.198.rev.

    - E. In the REV record for arpa.in-addr.198.51.100.165.


    # QUESTION 3


    What information can be displayed by top?


    - A. Existing files, ordered by their size.

    - B. Running processes, ordered by CPU or RAM consumption.

    - C. User accounts, ordered by the number of logins.

    - D. User groups, ordered by the number of members.

    - E. User accounts, ordered by the number of files.


    # QUESTION 4


    Which of the following commands can be used to resolve a DNS name to an IP address?


    - A. dnsname

    - B. dns

    - C. query

    - D. host

    - E. iplookup


    # QUESTION 5


    Which of the following outputs comes from the command free?


    A. 21:04:15 up 14 days, 7:43, 3 users, load average: 0.89, 1.00, 0.99


    B. | avg-cpu: | %user | %nice | %system | %iowait | %steal | %idle |

    |---|---|---|---|---|---|---|

    | 34.04 | 0.03 | 13.88 | 1.06 | 0.00 | 50.99 |


    C. | Filesystem | Size | Used | Avail | Use% | Mounted on |

    |---|---|---|---|---|---|

    | /dev/mapper/vg_ssd-root | 25G | 20G | 3.6G | 85% | / |


    D. 1.8M /tmp


    E. | total | used | free | shared | buff/cache | available |

    |---|---|---|---|---|---|

    | Mem: | 16123128 | 12565680 | 2011624 | 412128 | 1545824 | 7180416 |


    # QUESTION 6


    What is the UID of the user root?


    - A. 1

    - B. -1

    - C. 255

    - D. 65536

    - E. 0


    # QUESTION 7


    What is true about the owner of a file?


    - A. Each file is owned by exactly one user and one group.

    - B. The owner of a file always has full permissions when accessing the file.

    - C. The user owning a file must be a member of the file''s group.

    - D. When a user is deleted, all files owned by the user disappear.

    - E. The owner of a file cannot be changed once it is assigned to an owner.


    # QUESTION 8


    What information is stored in /etc/passwd? (Choose three.)


    - A. The user''s storage space limit

    - B. The numerical user ID

    - C. The username

    - D. The encrypted password

    - E. The user''s default shell


    # QUESTION 9


    Which of the following tar options handle compression? (Choose two.)


    - A. -bz

    - B. -z

    - C. -g

    - D. -j

    - E. -z


    # QUESTION 10


    Which of the following keys can be pressed to exit less?


    - A. l

    - B. x

    - C. e

    - D. q

    - E. !


    # QUESTION 11


    Which of the following commands sorts the output of the command export-logs?


    - A. export-logs < sort

    - B. export-logs > sort

    - C. export-logs & sort

    - D. export-logs | sort

    - E. export-logs <> sort


    # QUESTION 12


    A directory contains the following files:


    - a.txt

    - b.txt

    - c.cav


    What would be the output of the following shell script?


    ```bash

    for file in *.txt

    do

    echo $file

    done

    ```


    - A. *.txt

    - B. a b

    - C. c.cav

    - D. a.txt

    - E. a.txt, b.txt


    # QUESTION 13


    Which of the following commands will search for the file foo.txt under the directory
    /home?


    - A. search /home -file foo.txt

    - B. search /home foo txt

    - C. find /home -file foo.txt

    - D. find /home -name foo.txt

    - E. find /home foo txt


    # QUESTION 14


    The current directory contains the following:


    ```

    -rw-r--r-- 1 root root 0 Oct 27 10:00 file.txt

    -rw-r--r-- 1 root root 0 Oct 27 10:00 script.sh

    ```


    A user wants to find all files ending in .txt in the /home directory recursively.
    Which command should they use?


    - A. find /home -name "*.txt"

    - B. find /home -name "*.txt"

    - C. find /home -type f -name "*.txt"

    - D. locate /home/*.txt

    - E. ls -R /home | *.txt


    # QUESTION 15


    What is a distribution?


    - A. A bundling of Linux kernel.

    - B. A set of software.

    - C. An operating system based on Linux.

    - D. A file system.

    - E. A collection of tools.


    # QUESTION 16


    Which package management tool is used in Red Hat-based systems?


    - A. portage

    - B. rpm

    - C. apt-get

    - D. dpkg

    - E. yum


    # QUESTION 17


    Why are web cookies considered dangerous?


    - A. Cookies support identification and tracking.

    - B. Cookies are always accessible to anyone.

    - C. Cookies consume significant amounts of storage.

    - D. Cookies store critical data which is lost when cookie is deleted.

    - E. Cookies can contain viruses and malware.


    # QUESTION 18


    Which of the following are typical services offered by cloud providers? (Choose
    three.)


    - A. Platform as a Service (PaaS)

    - B. Infrastructure as a Service (IaaS)

    - C. Internet as a Service (IaaS)

    - D. Graphics as a Service (GaaS)

    - E. Software as a Service (SaaS)


    # QUESTION 19


    Which of the following characters in a shell prompt indicates the shell is running
    with root privileges?


    - A. !

    - B. #

    - C. *

    - D. &

    - E. $


    # QUESTION 20


    What is true about a recursive directory listing?


    - A. It includes the content of sub-directories.

    - B. It includes the permissions of the directory listed.

    - C. It includes details of file system, such as inodes.

    - D. It includes ownership information for the files.

    - E. It includes a preview of content for each file.


    # QUESTION 21


    Which of the following directories contains information, documentation and example
    configuration files for installed software packages?


    - A. /usr/share/doc/

    - B. /etc/defaults/

    - C. /var/info/

    - D. /doc/

    - E. /usr/examples/


    # QUESTION 22


    Which of the following commands adds the directory new/dir/ to the PATH environment
    variable?


    - A. $PATH=/new/dir: $PATH

    - B. PATH=/new/dir: PATH

    - C. export PATH=/new/dir: PATH

    - D. export PATH=/new/dir: $PATH

    - E. export PATH=/new/dir: $PATH


    # QUESTION 23


    A user is currently in the directory /home/user/Downloads/ and runs the command
    ls ../Documents/


    Assuming it exists, which directory''s content is displayed?


    - A. /home/user/Documents/

    - B. /home/user/Documents/Downloads/

    - C. /home/user/Downloads/Documents/

    - D. /Documents/

    - E. /home/user/Documents


    # QUESTION 24


    Which of the following is a protocol used for automatic IP address configuration?


    - A. NFS

    - B. LDAP

    - C. SMTP

    - D. DNS

    - E. DHCP

