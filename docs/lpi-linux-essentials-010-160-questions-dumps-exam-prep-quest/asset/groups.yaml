    # 第 1 题


    硬盘驱动（HDD）和固态硬盘（SSD）之间的区别是什么？（选择两项）


    - A. 硬盘具有电机和移动部件，而固态硬盘没有。

    - B. 硬盘可能会因为物理损坏而故障，而固态硬盘不会故障。

    - C. 固态硬盘存储的数据量可以是硬盘的许多倍。

    - D. /dev/sda 是硬盘设备，而 /dev/sda 是固态硬盘。

    - E. 固态硬盘提供存储数据的访问速度比硬盘更快。


    # 第 2 题


    反向 DNS 为 IP 地址分配主机名。IP 地址 198.51.100.165 的名称是如何存储在 DNS 服务器上的？


    - A. 在 165.100.51.198.ipv4.arpa 的 A 记录中。

    - B. 在 165.100.51.198.in-addr.arpa 的 PTR 记录中。

    - C. 在 198-51-100-165.rev.arpa 的 RNAME 记录中。

    - D. 在 165.100.51.198.rev 的 ARPA 记录中。

    - E. 在 arpa.in-addr.198.51.100.165 的 REV 记录中。


    # 第 3 题


    top 命令可以显示哪些信息？


    - A. 按大小排序的现有文件。

    - B. 按 CPU 或 RAM 消耗排序的运行进程。

    - C. 按登录次数排序的用户账户。

    - D. 按成员数量排序的用户组。

    - E. 按文件数量排序的用户账户。


    # 第 4 题


    下列哪种命令可以将 DNS 名称解析为 IP 地址？


    - A. dnsname

    - B. dns

    - C. query

    - D. host

    - E. iplookup


    # 第 5 题


    下列输出中哪一个来自 free 命令？


    A. 21:04:15 up 14 days, 7:43, 3 users, load average: 0.89, 1.00, 0.99


    B. | avg-cpu: | %user | %nice | %system | %iowait | %steal | %idle |

    |---|---|---|---|---|---|---|

    | 34.04 | 0.03 | 13.88 | 1.06 | 0.00 | 50.99 |


    C. | Filesystem | Size | Used | Avail | Use% | Mounted on |

    |---|---|---|---|---|---|

    | /dev/mapper/vg_ssd-root | 25G | 20G | 3.6G | 85% | / |


    D. 1.8M /tmp


    E. | total | used | free | shared | buff/cache | available |

    |---|---|---|---|---|---|

    | Mem: | 16123128 | 12565680 | 2011624 | 412128 | 1545824 | 7180416 |


    # 第 6 题


    用户 root 的 UID 是什么？


    - A. 1

    - B. -1

    - C. 255

    - D. 65536

    - E. 0


    # 第 7 题


    关于文件所有者，哪个说法是正确的？


    - A. 每个文件都恰好属于一个用户和一个组。

    - B. 文件所有者在访问文件时始终拥有完全权限。

    - C. 拥有文件的用户必须是该文件组的成员。

    - D. 当用户被删除时，所有由该用户拥的文件都会消失。

    - E. 文件所有者一旦分配给所有者就无法更改。


    # 第 8 题


    /etc/passwd 中存储了哪些信息？（选择三项）


    - A. 用户的存储空间限制

    - B. 数值用户 ID (UID)

    - C. 用户名

    - D. 加密密码

    - E. 用户的默认 shell


    # 第 9 题


    下列哪些 tar 选项处理压缩？（选择两项）


    - A. -bz

    - B. -z

    - C. -g

    - D. -j

    - E. -z


    # 第 10 题


    按下哪个键可以退出 less？


    - A. l

    - B. x

    - C. e

    - D. q

    - E. !


    # 第 11 题


    下列哪个命令可以对 export-logs 命令的输出进行排序？


    - A. export-logs < sort

    - B. export-logs > sort

    - C. export-logs & sort

    - D. export-logs | sort

    - E. export-logs <> sort


    # 第 12 题


    一个目录包含以下文件：


    - a.txt

    - b.txt

    - c.cav


    以下 shell 脚本的输出是什么？


    ```bash

    for file in *.txt

    do

    echo $file

    done

    ```


    - A. *.txt

    - B. a b

    - C. c.cav

    - D. .txt

    - E. a, b


    # 第 13 题


    下列哪个命令递归搜索 /home 目录下所有以 .txt 结尾的文件？


    - A. find /home -type f

    - B. find /home "*.txt"

    - C. find /home -name "*.txt"

    - D. find /home/*.txt

    - E. /home


    # 第 14 题


    当前目录包含以下内容：


    ```

    -rw-r--r-- 1 root root Oct 27 10:00 file.txt

    ```

    下列哪个命令会搜索：


    - A. *.txt

    - B. .txt

    - C. /home file.txt

    - D. /home

    - E. /txt


    # 第 15 题


    什么是发行版（distribution）？


    - A. Linux 内核。

    - B. 软件包集合。

    - C. 基于 Linux 的操作系统。

    - D. 文件系统。

    - E. 工具集。


    # 第 16 题


    哪些包管理工具用于 Red 系统？


    - A. portage

    - B. rpm

    - C. apt-get

    - D. dpkg

    - E. yum


    # 第 17 题


    为什么 cookie 被认为是危险的？


    - A. Cookie 支持身份识别和跟踪。

    - B. Cookie 任何人都可以访问。

    - C. Cookie 占用大量存储。

    - D. 删除 cookie 会丢失。

    - E. Cookie 可能包含病毒和恶意软件。


    # 第 18 题哪些是云供应商提供的服务？（选择三项）


    - A. 平台服务 (PaaS)

    - B. 基础设施服务 (IaaS)

    - C. 互联网服务 (IaaS)

    - D. 图形服务 (GaaS)

    - E. 软件服务 (SaaS)


    # 第 19 题


    提示符中的以下哪个字符表示 shell 以 root 权限运行？


    - A. !

    - B. #

    - C. *

    - D. &

    - E. $


    # 第 20 题


    关于递归目录列表，哪个说法是正确的？


    - A. 它包含子目录的内容。

    - B. 它包含列出目录的权限。

    - C. 它包含文件系统的细节，如节点。

    - D. 它包含文件的所有权信息。

    - E. 它包含每个文件的内容预览。


    # 第 21 题


    下列哪个目录包含安装软件包的信息、文档和示例配置？


    - A. /usr/share/doc/

    - B. /etc/defaults/

    - C. /var/info/

    - D. /doc/

    - E. /usr/examples/


    # 第 22 题


    下列哪个命令将目录 new/dir/ 添加到 PATH 环境变量？


    - A. $PATH=/new/dir: $PATH

    - B. PATH=/new/dir: PATH

    - C. export PATH=/new/dir: PATH

    - D. export PATH=/new/dir: $PATH

    - E. export PATH=/new/dir: $PATH


    # 第 23 题


    用户当前位于 /home/user/Downloads/ 并运行命令 ls ../Documents/


    假设它存在，显示的是哪个目录的内容？


    - A. /home/user/Documents/

    - B. /home/user/Documents/Downloads/

    - C. /home/user/Downloads/Documents/

    - D. /Documents/

    - E. /home/user/Documents


    # 第 24 题


    下列种协议用于自动 IP 地址配置？


    - A. NFS

    - B. LDAP

    - C. SMTP

    - D. DNS

    - E. DHCP


