  md: '# QUESTION 14


    The current directory contains the following file:


    ```

    -rw-r--r-- 1 root exec 24551 Apr 2 12:36 test.sh

    ```


    The file contains a valid shell script, but executing this file using ./test.shleads
    to this error:


    ```

    bash: ./test.sh: Permission denied

    ```


    What should be done in order to successfully execute the script?


    +   A. The file''s extension should be changed from .shto.bin.

    B. The execute bit should be set in the file''s permissions.

    C. The user executing the script should be added to the execgroup.

    D. The SetUID bit should be set in the file''s permissions

    E. The script should be run using #!./test.shinstead of ./test.sh.


