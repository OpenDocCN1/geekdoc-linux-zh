    # Monitor, Configure, Troubleshoot, and Control Access to Web Sites


    As mentioned, Internet Information Services (IIS) version 5.0 is included as part
    of Windows 2000. IIS version 5.0 includes a number of improvements and features
    that are designed to provide highly secure, highly available Web services to users.


    # Web Site Performance and Reliability Features in IIS 5.0


    As part of these improvements, IIS includes configuration options that are used
    to fine-tune Web performance and increase service reliability. For example, IIS
    5.0 has addressed an issue with servers running previous versions of IIS hosting
    multiple Web sites. When a server hosts multiple Web sites, each site requires
    a unique IP address to ensure that traffic is directed correctly. To do this,
    the server creates a unique identifier for a protocol called a socket, which is
    made up of the Web site''s node address and the port number it is using.


    Sockets are created when the server is started, and each socket requires a significant
    chunk of physical (non-paged) RAM. The number of sites a server could host is
    limited by the amount of memory that can be loaded on the system. IIS 5.0 has
    addressed this issue by allowing hosted sites that have different IP addresses,
    but are using the same socket, to share the sockets'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# Chapter 3


    through socket pooling. This means that more sites could be hosted from a single
    server and that the performance of those sites would be better.


    In addition, Microsoft has included process throttling and bandwidth throttling
    features in IIS 5.0. These are used to improve site performance. They allow administrators
    to specify the maximum percentage of a system''s processor and network bandwidth
    that each site on the server is allowed to use. This helps to ensure that one
    site doesn''t dominate the server''s resources, resulting in poor performance
    for the other hosted sites. IIS 5.0''s ability to host multiple sites has also
    improved. Each site on an IIS server is identified by a three-address part. This
    version is able to let sites share two of the three address parts to save resources
    and still ensure that the traffic is directed correctly.


    # Web Site Security Features in IIS 5.0


    One of the biggest concerns for administrators today is having their Web site
    attacked. There are many ways this can be done, and Microsoft has attempted to
    address them with IIS 5.0. One of the keys to this implementation of IIS is its
    ability to isolate the application from outside attack. Application protection
    is used to isolate each application process from the other processes in memory.


    IIS 5.0 began to address these issues by allowing Web applications to be launched
    outside the IIS server process. In this configuration, if a Web application fails,
    it affects only the other applications launched in that environment. IIS 5.0 takes
    this further by pooling similar applications separately from the server service.
    Another significant improvement with IIS 5.0 is the way in which the service is
    restarted. Before this version of IIS, if there was a system failure, the computer
    would have to be restarted. In IIS 5.0, however, the service and all its components
    can be restarted without taking the server down.


    IIS is installed by default during a new Windows 2000 Server installation and
    will be installed during an upgrade if an earlier version of IIS, Peer Web Services,
    or Personal Web Server is detected on the existing system. If IIS is not detected
    during an upgrade, it will not be installed.


    IIS and its components can be installed and removed through the Add/Remove Windows
    Components utility in Control Panel. If TCP/IP is not already installed before
    the installation, it will be installed automatically and configured to utilize
    DHCP for addressing. As part of the installation process, the Default Web Site,
    Administration Web site, Default SMTP Virtual Server, and Default FTP sites are
    created.'
