    +   - Make sure that the IP address doesn''t start with 169.254: This would be
    an APIPA address, meaning that the computer was unable to get an IP address from
    a DHCP server, or that you forgot to configure a static address.


    +   - Confirm that you are using the proper DNS and/or WINS server addresses.
    There won''t be any DNS name resolution if the computer'
