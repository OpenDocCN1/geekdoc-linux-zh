  md: '# Introduction


    Microsoft has introduced a number of new security features in the Windows 2000
    operating system. New additions such as the Encrypting File System (EFS) and the
    security configuration tool, along with the updated auditing and policy features,
    allow you to configure a much more secure server. With the increased emphasis
    on security in the computer industry as a whole, you should expect to see a number
    of security related questions on the exam.


    # User Accounts and Groups


    A Windows 2000 user account allows the user to log on to a computer or a domain.
    In addition, a user account controls what access, if any, that a user has to local
    or domain user resources. To grant these access rights, the administrator assigns
    rights and permissions to the user''s account.


    Permissions control what a user can do with a resource, such as a file, folder,
    or printer. When an administrator assigns permissions, it specifies what type
    of access the user has. For example, a member of the accounting department may
    have read and write access to all folders and files related to the accounting
    department. Yet, this same user may be denied all access to human resources''
    files and folders. Most likely this user has little to no dealing with confidential
    files found in human resources.


    A group is a collection of one or more user accounts that have at least one thing
    in common, such as all personnel in the sales department who would likely need
    access to the same resources. Assembling users into groups simplifies administration
    because the administrator has to configure permissions to resources only once,
    rather than for each user individually.


    Also the administrator can add or remove users from the group at any time. This
    comes in especially handy when another user, not part of the group, needs access
    to the resources to which the group collectively has access. All the administrator
    has to do is to add the user to the group that has such access.


    There are two types of user accounts and groups, domain and local. A local account
    or group can be used to assign a user or a group of users access to the resources
    only on the computer where the account resides. However, domain user accounts
    and groups can be used to grant access to any resources that are contained within
    the domain. You will discover each in more depth next.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Implementing, Monitoring, and Troubleshooting Security 265


    # Domain Accounts


    A domain is the basic security, administrative, and replication unit of the Active
    Directory. Multiple domains can be connected to a tree or forest. However, because
    Active Directory, forests, and trees are covered on other exams, we limit our
    discussion to the domain level.


    Each domain has an Active Directory security database that can contain millions
    of objects. These objects are the users, groups, computers, and other objects
    that are the resources contained within the domain. Access to these resources
    is controlled by granting access to users and groups. To assist in sorting and
    categorizing these users, groups ,and resources, there is a subcontainer called
    an Organizational Unit (OU). Each OU can hold a large number of objects. Access
    to the objects in an OU can be granted at the object, OU, or domain level.


    Each Active Directory domain controller contains a read/write copy of the domain
    database. Any changes are replicated to all of the other domain controllers.


    Domain users, groups, and other objects are created and managed using the Active
    Directory Users and Computers snap-in, as shown in Figure 8.1. This snap-in is
    installed by default on Windows 2000 servers that are domain controllers, or it
    can be added to a Windows 2000 Professional or Windows 2000 member server by installing
    the Administrative Tools package. The installation file, adminpak.msi, is located
    on the Windows 2000 Server CD in the 1386 folder. The snap-in is started by selecting
    Start, Programs, Administrative Tools, Active Directory Users and Computers.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_298_0.png)


    Figure 8.1 The Active Directory Users and Computers snap-in is used to create
    and manage users, groups, and other objects.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# Chapter 8


    The Active Directory Users and Computers snap-in has five default nodes and two
    invisible ones:


    +   - Builtin—This container holds the default groups for a Windows 2000 domain.


    +   - Computers—This container is empty when Windows 2000 is first installed.
    As computer accounts are added to the domain, they are put here unless you specify
    a specific OU to put them in.


    +   - Domain Controllers—This is an OU that contains the domain controllers for
    the domain.


    +   - ForeignSecurityPrincipals—This container holds the security objects that
    are created when a trust is set up between domains.


    +   - Users—This container holds all of the default domain and local users and
    groups installed by Windows 2000. You can add new users and groups to this container,
    or to OUs that you create.


    +   - LostAndFound—This container holds orphaned objects for the domain and is
    not visible by default. To view it, you must turn on Advanced Features by selecting
    View, Advanced Features.


    +   - System—This container holds the objects for policies, RAS, IP security,
    and other system functions, and is not visible by default. To view it, you must
    turn on Advanced Features by selecting View, Advanced Features.


    As shown earlier in Figure 8.1, the containers are represented in Active Directory
    as blank file folders, whereas OUs are file folders with an open book icon. The
    difference between the two is that you can rename, nest, and configure the properties
    for OUs. You are also limited to as what objects can be created or moved to some
    containers. There may possibly be other containers shown if Active Directory-aware
    applications, such as Exchange 2000, are installed.


    To create a new object, right-click the desired container in the Active Directory
    Users and Computers snap-in, click New, then select the type of object that you
    want to create (see Figure 8.2).


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_299_0.png)


    > There could possibly be little, any coverage of domain accounts on the exam.
    On the other hand, you should be thoroughly familiar with creating and using local
    accounts and groups and know what accounts and groups are installed by default.
    Domain accounts are discussed at length in the preparation material for the 70-217
    exam.'
  merge: -1
  pgno: 299
