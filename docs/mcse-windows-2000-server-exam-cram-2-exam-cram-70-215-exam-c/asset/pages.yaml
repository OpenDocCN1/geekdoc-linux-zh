    # User Rights


    User Rights are used to assign various privileges to specific user accounts and/or
    groups. Some of the default user rights assignments are shown in Figure 8.12.


    As you can see, several specific rights, such as the ability to back up files
    and directories or change the system time, are already assigned to certain groups.
    For example, you must be a member of the local administrators group to shut down
    a computer remotely.


    Unlike Account policies, which are usually set at the domain level and automatically
    override the local settings, by default User Rights are configured at the local
    level. The User Rights settings in the domain Group Policy are set to Not Defined
    by default.'
