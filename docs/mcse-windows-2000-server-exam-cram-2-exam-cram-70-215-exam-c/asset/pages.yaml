  md: '![](img/7b2cdf076a380b70409b2e8f4835fae3_412_0.png)


    # # What’s on the CD-ROM'
  merge: -1
  pgno: 412
- img_proc: true
  md: 'This appendix is a brief rundown of what you''ll-find on the CD-ROM that comes
    with this book. For a more detailed description of the PrepLogic Practice Tests,
    Preview Edition exam simulation software, see Appendix D, "Using PrepLogic, Preview
    Edition Software." In addition to the PrepLogic Practice Tests, Preview Edition,
    the CD-ROM includes the electronic version of the book in Portable Document Format
    (PDF), several utility application programs, and a complete list of test objectives
    and where they are covered in the book. Finally, a pointer list to online pointers
    and references are added to this CD. You will need a computer with Internet access
    and a relatively recent browser installed to use this feature.


    # ## PrepLogic Practice Tests, Preview Edition


    PrepLogic is a leading provider of certification training tools. Trusted by certification
    students worldwide, we believe PrepLogic is the best practice software available.
    In addition to providing a means of evaluating your knowledge of the Exam Cram
    material, PrepLogic Practice Tests, Preview Edition features several innovations
    that help you to improve your mastery of the subject matter.


    For example, the practice tests allow you to check your score by exam area or
    domain which topics you need to study more. Another feature allows you to obtain
    immediate feedback on your responses in the form of explanations for the correct
    and incorrect answers.


    PrepLogic Practice Tests, Preview Edition exhibits most of the full functionality
    of the Premium Edition but offers only a fraction of the total questions. To get
    the complete set of practice questions and exam functionality, visit PrepLogic.com
    and order the Premium Edition for this and other challenging titles.


    Again, for a more detailed description of the PrepLogic Practice Tests, Preview
    Edition features, see Appendix D.


    # ## Exclusive Electronic Version of Text


    The CD-ROM also contains the electronic version of this book in Portable Document
    Format (PDF). The electronic version comes complete with all figures as they appear
    in the book. You will find that the search capabilities of the readers come in
    handy for study and review purposes.'
  merge: -1
  pgno: 413
- img_proc: true
  md: '# Easy Access to Online Pointers and References


    The Suggested Reading section at the end of each chapter in this Exam Cram contains
    numerous pointers to Web sites, newsgroups, mailing lists, and other online resources.
    To make this material as easy to use as possible, we include all this information
    in an HTML document entitled “Online Pointers” on the CD. Open this document in
    your favorite Web browser to find links you can follow through any Internet connection
    to access these resources directly.'
  merge: -1
