    Each policy can be configured to audit successes, failures, or both. Just about
    any activity involving a Windows 2000 object can be audited. When planning an
    audit policy, it''s important to not only audit the accesses of resources, but
    also to audit user account management tasks. All entries are saved to the security
    log, and will provide you with a summary of the computer operations, showing which
    tasks were attempted and by whom. Not only does this help detect unauthorized
    access, but it can also point out users who don''t know what they''re doing.


    A typical entry in the security log will show the following items:


    +   > The time and date that the event occurred

    > The event performed

    > The user account that performed the event

    > The success or failure of the event


    Except for the Audit Object Access selection, all of the other selections will
    begin recording audit events to the security log immediately after they are enabled.
    The Audit Object Access selection is used to allow you to audit specific objects,
    such as files, folders, or other resources, and needs to be turned on for each
    object that you want to audit.


    To turn auditing on for a specific object


    +   1. From the Properties window of the desired object, select the Security tab.

    2. Click the Advanced button.

    3. Select the Auditing tab.

    4. Click the Add button.

    5. From the Add Users or Groups dialog box, select the user or group that you
    want to record their access of the object. Click OK.

    6. From the Auditing Entry for dialog box, as shown in Figure 8.11, select the
    actions that you wish to audit.

    7. Click OK three times when finished.'
