  md: '![](img/7b2cdf076a380b70409b2e8f4835fae3_218_0.png)


    **Figure 6.3** The Disk Properties dialog box.


    # # Viewing Volume Health Status


    The health status of each volume is provided in the volume properties pane under
    the volume size (see Figure 6.1) in Disk Management. One of the following statuses
    are displayed in this area:


    +   * Online—The disk is operating normally with no known problems.

    * Online (errors)—Only used for dynamic disks, this status indicates that I/O
    errors have been detected on the disk.

    * Offline—Only used for dynamic disks, this status indicates that the disk is
    not accessible due to any number of possible problems or errors.

    * Foreign—Only used for dynamic disks, this status indicates that a dynamic disk
    was removed from another Windows 2000 computer, but has not yet been imported
    into this computer.

    * Unreadable—The disk is not accessible and may have experienced hardware failure,
    corruption, or I/O errors. The disk''s copy of the system''s disk configuration
    database may be corrupt, causing this status indication.

    * Unrecognized—This disk is not recognized, such as a disk that was taken from
    a Unix system.

    * No Media—Used only for removable media drives. The status will change to Online
    when a readable media is inserted into the drive.'
