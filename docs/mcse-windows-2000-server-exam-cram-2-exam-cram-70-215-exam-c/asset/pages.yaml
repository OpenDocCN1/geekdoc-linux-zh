  md: '# Installing, Configuring, and Troubleshooting Access to Resources


    access to network resources so that they can be accessed through a Web browser.
    This is possible because of an enhancement to HTTP, included in version 1.1, called
    WebDAV for Web distributed authorizing and versioning. Using WebDAV and an HTTP/1.1-compliant
    Web browser, users with sufficient permissions are allowed to manipulate files
    and folders. This includes moving files to and from the WebDAV folder, changing
    the file''s properties, and searching the WebDAV directory for content. Because
    WebDAV is integrated with both Windows 2000 and Internet Explorer 5, it includes
    security features from both products. This ensures that users who access the folders
    from the Internet are granted only the access desired by the administrator.


    There are many different ways to establish a WebDAV site for users to access.
    For example, create a Web site specifically designated for WebDAV folder access,
    then create virtual directories for all folders you want to share through WebDAV.
    Once the Web site has been created, you can create the virtual directories either
    through IIS, or by choosing Web Sharing on the folder''s Properties page, as shown
    in Figure 3.8.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_126_0.png)


    **Figure 3.8** Share a folder for access via WebDAV.


    To share a folder to the Web site, on the Web Sharing tab, select the Web site
    that will host the folder, then select Share this folder. You will be prompted
    for an alias for the share on the Web site, IIS access permissions for the folder,
    and application permissions. After you''ve made the appropriate selections, click
    OK to return to the folder properties, then OK again to continue.


    Using the Web Sharing tab on a folder is a quick and familiar way to share folders
    for access via WebDAV. Once they are created, they are managed through the Internet
    Services Manager in Administrative Tools.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Chapter 3


    In fact, the Internet Services Manager is used to configure security for all Web
    sites, including WebDAV sites. Much like NTFS, IIS can configure security from
    the Web site level down to the individual files. The first security settings dictate
    the authentication level required for users to access the resources. Selecting
    Anonymous will grant anyone access to the resource, which is not recommended for
    WebDAV implementations. The Basic authentication setting requires passwords to
    access the resources, but sends them in plain text. Although this is not the most
    secure option, it is the most widely supported because it is part of the HTTP
    standard. Integrated Windows authentication relies on the Windows security system,
    which encrypts and hashes passwords before sending them across the network, validate
    user access and works well for intranet environments. Digest authentication is
    a secure method for validating user authentication through a browser and is the
    best option if the WebDAV data is to be shared over the Internet.


    In addition to controlling the authentication method used on the Web site, IIS
    includes security permissions for the individual files and folders that make up
    the Web site. When the virtual folder is configured in the Internet Services Manager,
    the Local Path section is used to assign permissions. On the Home directory of
    WebDAV Properties you are able to configure the following:


    +   * The location of the resource: as a resource on the local computer, a share
    located on another computer, or a redirection to a URL.

    * The path to the resource.

    * Which permissions to enable. If your Web site includes scripts such as ASP applications,
    the Script Source Access option will allow users to execute the scripts. Lets
    users read or download the files, while Write users to place files in the WebDAV
    virtual directory. Directory browsing allows the user to view subdirectory listings
    if there are folders beneath the shared virtual folder. If this option is not
    selected and there are subfolders, they will be hidden from the users.

    * Whether to log visits to the site.

    * Whether to allow the Microsoft Indexing server to include the resource in a
    site index.

