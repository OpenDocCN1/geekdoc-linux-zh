- img_proc: true
  md: '# Resources Properties


    The Resources tab contains a listing of the computer resources that the network-adapter
    is currently using. You may or may not be able to manually configure these resources;
    however, in most cases, you should leave them alone and let Windows 2000 do the
    resource management work for you. Chapter 4 covered hardware resources in great
    detail.


    # Power Management Properties


    The Power Management tab may or may not be present on your particular network
    adapter. If it is, you typically have two options for configuring power management
    behavior for the network adapter. The Allow This Device to Bring the Computer
    out of Standby option can be selected to allow the network adapter to bring the
    computer out of standby—a popular function with Wake-ON LAN (WOL) capable network
    devices. The WOL cable must be connected to the network adapter and the WOL plug
    must be connected to the computer''s mainboard for this function to work properly.
    This is not recommended for use on portable computers, because this process periodically
    wakes up a computer in standby to check the network connection, which can have
    an adverse impact on battery life. You can select the Allow Computer to Turn Off
    This Device to Save power option to allow Windows to manage the network adapter''s
    state to save power. This option should be selected on portable computers to maximize
    battery lifetime.


    # Troubleshooting Network Adapters


    More than not, network adapters work fine for many years. When they act up, however,
    it is a critical situation that you want to correct as soon as possible. Without
    a functioning network adapter, the network does not serve much purpose. Table
    7.1 outlines some of the more common issues that plague network adapters and serves
    as a starting point for your troubleshooting efforts.


    | Table 7.1 Common Network Adapter Problems |

    | Problem | Solution |

    | The network adapter is not on the Windows 2000 HCL. | Replace the adapter with
    a similar, but HCL supported, network adapter. |

    | The network adapter driver is outdated. | Attempt to update the driver from
    the network adapter''s Properties page (in Device Manager). If unsuccessful, seek
    out a new driver from the vendor. |


    (continued)'
  merge: -1
  pgno: 252
- img_proc: true
  md: '| Problem | Solution |

    | --- | --- |

    | The hardware is not functioning. | Replace the network adapter with a known
    good one. Verify that the network adapter is not functioning by placing the defective
    adapter into one or more machines to test it. |

    | The network adapter is not automatically installed by Windows 2000. | You must
    initiate a manual installation of the network adapter by using the Add/Remove
    Hardware Wizard. Ensure that you have set any resource settings on the adapter
    as required. Also ensure that you have recorded all required resource settings
    so that you can manually configure them in Windows |

    | Network adapter installed, but communications do not succeed. | Ensure that
    you have the required networking protocols installed and configured as detailed
    in the next section of this chapter. |

    | Network adapter installed, but communications do not succeed. | Ensure that
    you have all the required network services installed and configured properly on
    your network as detailed later in this chapter. Services typically include DNS
    and DHCP, but might include others. |

    | Network adapter installed, but causing computer to behave erratically. | Remove
    the network adapter from the Device Manager. A Safe Mode startup may be required.
    This is usually a case of incompatible drivers: Seek out compatible drivers or
    replace the network adapter with a different type. |


    # # Installing, Configuring, and Troubleshooting Network Protocols


    After getting your network adapter installed and configured to your liking, your
    next step is to install and configure the required network protocols. Think of
    network protocols as a language. If you were speaking to a friend in English and
    he replied back to you in German (assuming that you didn''t understand German),
    you would not know what was being said. Just the same, a computer that requires
    the AppleTalk protocol would not be able to effectively communicate with a computer
    using the TCP/IP protocol for communications.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Configuring and Troubleshooting Windows 2000 Network Connections


    Windows 2000 is a radical departure from all previous versions of the Windows
    operating system in that it is designed from the ground up to use the TCP/IP network
    protocol for all network communications. In fact, it is now possible (and recommended)
    to run an entire Windows network using TCP/IP only, because all versions of Windows
    include support for TCP/IP. Before you can actually begin communication between
    computers, you must install and configure the required network protocols.


    Installing network protocols is a very simple process and is done as follows:


    +   1. Open the network adapter properties by selecting it from the Network Connections
    window, right-clicking on it, and selecting Properties. The window shown in Figure
    7.3 opens.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_254_0.png)


    Figure 7.3 The Local Area Connection properties window.


    +   2. Click on the Install button to open the Select Network Component Type dialog
    box as shown in Figure 7.4.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_254_1.png)


    Figure 7.4 Installing a new network protocol.'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# Chapter 7


    3. You have the option of installing Clients, Services, or Protocols from the
    dialog box shown in Figure 7.4. Other options, such as the Client Service for
    NetWare or the Client for Microsoft Networks, appear under the Client listing.
    The Service listing includes things like the QoS (Quality of Service) Packet Scheduler
    or the Service Advertising Protocol. Finally, under Protocols, the network communications
    protocols that we are interested in, such as AppleTalk, IPX/SPX, and TCP/IP (see
    Figure 7.5). Click Protocols and select the protocol you wish to install on your
    computer.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_255_0.png)


    Figure 7.5 Selecting the protocol to be installed.


    # TCP/IP


    By default, all Windows 2000 installations include the TCP/IP protocol, but you
    may need to reinstall or configure it later. To that end, we examine the configuration
    of TCP/IP here.


    To begin the configuration of any protocol, select it from the network adapter
    properties page (refer to Figure 7.3) and click Properties. The Internet Protocol
    (TCP/IP) Properties window opens, as shown in Figure 7.6.


    IP addresses are 32-bit (4 octet) numbers that uniquely identify a computer on
