  md: '# Microsoft’s Testing Formats


    Currently, Microsoft uses four different testing formats:


    +   - Case study


    +   - Fixed length


    +   - Adaptive


    +   - Short form


    As mentioned earlier, the case study approach is used with many of the newer Microsoft
    exams. These exams consist of a set of case studies that you must first analyze
    to answer questions related to the case studies. Such exams include one or more
    case studies (tabbed topic areas), each of which is followed by 4 to 10 questions.
    The question types for exams will be multiple choice, build list and reorder,
    create a tree, drag and connect, and select and place. Depending on the test topic,
    some exams are totally-based, whereas others are not at all.


    Other Microsoft exams employ advanced testing capabilities that may not be immediately
    apparent. Although the questions that appear are primarily multiple-choice, the
    logic in fixed-length tests, which use a fixed sequence of questions, is more
    complex than that in older Microsoft tests. Some questions employ a sophisticated
    user interface (which Microsoft calls a simulation) to test your knowledge of
    particular software and systems in a simulated “live” environment that behaves
    just like the original. The Testing Innovations article at www.microsoft.com/TRAINCERT/mcpexams/faq/innovations.asp
    includes a downloadable series of demonstrations and samples.


    For some exams, Microsoft has turned to a well-known technique, called adaptive
    testing, to establish a test-taker’s level of knowledge and product competence.
    Adaptive exams look the same as fixed-length exams, but they determine the level
    of difficulty at which an individual test-taker can correctly answer questions.
    Test-takers with differing levels of knowledge or ability are presented with a
    smaller set of more difficult questions, whereas individuals with lower levels
    of knowledge are presented with a large set of easier questions. Two individuals
    may answer the same percentage of questions correctly, the test-taker with a higher
    knowledge or ability level scores because he or her questions are weighted more
    heavily.


    Also, lower-level test-takers may answer more questions than-knowledgeable colleagues.
    This explains why adaptive tests use ranges of'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Microsoft Certification Exams


    values to define the number of questions and the amount of time needed to complete
    the tests.


    Adaptive tests work by evaluating the test-taker''s most recent answer. A correct
    answer leads to a more difficult question (also raising the test software''s estimate
    of the test-taker''s knowledge and ability level). An incorrect answer leads to
    a difficult question (also lowering the test software''s estimate of the test-taker''s
    knowledge and ability level). This process continues until the test targets the
    test-taker''s true ability level. The exam ends when the test-taker''s level of
    accuracy meets a statistically acceptable value (in other words, when his her
    performance demonstrates an acceptable level of knowledge and ability) or when
    the maximum number of items has been presented (in which case, the test-taker
    is almost certain to fail).


    Microsoft also introduced a short-form test for its most popular tests. This test
    consists of 25 to 30 questions, with a time limit of exactly 60 minutes. This
    type of exam is similar to a fixed-length test because it allows readers to jump
    ahead or return to earlier questions and cycle through the questions until the
    test is done. Microsoft does not use adaptive logic in this test; it claims that
    statistical analysis of the question pool is such that the 25 to 30 questions
    delivered during a short-form exam conclusively measure a test-taker''s knowledge
    of the subject matter much in the same way as an adaptive test. The short-form
    test is like a "great hits exam" (that is, the most important questions are covered)
    version of an adaptive exam on the same topic.


    Some of the Microsoft exams may contain a combination of adaptive and fixed-length
    questions.


    Because you won''t know in which form the Microsoft exam may be, you should be
    prepared for an adaptive exam instead of a fixed-length or short-form exam: the
    penalties for answering incorrectly are built into the test itself on an adaptive
    exam, whereas the layout remains the same for a fixed-length or short-form test,
    no matter how many questions you answer incorrectly.


    The biggest difference between adaptive tests and fixed-length or short-form tests
    is that you can mark and revisit questions on fixed-length or short-form tests
    after you read them. On an adaptive test, you must answer the question when it
    is presented and cannot go back to that question later.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Strategies for Different Testing Formats


    Before you choose a test-taking strategy, you must determine what type of test
    it is: case studies, fixed length, short form, or adaptive.


    ≢- Case study tests consist of a tabbed window that allows you to navigate easily
    through the sections of the case.


    +   - Fixed-length tests consist of 50 to 70 questions with a check box. You can
    return to these questions if you want.


    +   - Short-form tests have 25 to 30 questions with a check box. You can return
    to these questions if you want.


    +   - Adaptive tests are identified in the introductory material of the test.
    Questions have no check box and can be visited (and answered) only once.


    Some tests contain a variety of testing formats. For example, a test may start
    with a set of adaptive questions, followed by fixed-length questions.


    > You''ll be able to tell for sure if you are taking an adaptive, fixed-length,
    or short-form test by the first question. Fixed-length or short-form tests include
    a check box that allows you to mark the question for later review. Adaptive test
    questions include no such check box and can be visited (and answered) only once.


    # Case Study Exam Strategy


    Most test-takers find that the case study type of exam is the most difficult to
    master. When it comes to studying for a case study, your best bet is to approach
    each case study as a standalone test. The biggest challenge you''ll encounter
    is that you feel that you won''t have enough time to get through all of the cases
    that are presented.


    Each case study provides a lot of material that you''ll need to read and study
    before you can effectively answer the questions. The trick to taking a case study
    exam is to first scan the case study to get the highlights. Make sure you read
    the overview section of the case so that you understand the context of the problem
    at hand. Then, quickly move on and scan the questions.

    As you are scanning the questions, make mental notes to yourself or notes on your
    paper that you''ll remember which sections of the case study you should focus
    on. Case studies provide a fair amount of extra information that you don''t really
    need to answer the questions. The goal with this scanning approach is to avoid
    having to study and analyze material that is not completely relevant.'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'When studying a case, read the tabbed information carefully. It is important
    to answer each and every question. You will be able to toggle back and forth from
    case to questions, and from question to question within a case subsection. However,
    after you leave the case and move on, you may not be able to return to it. I suggest
    that you take notes while reading useful information to help you when tackle tackle
    the test. It''s hard to go wrong with this strategy when taking any kind of Microsoft
    certification test.


    # # Fixed-Length and Short-Form Exam Strategy


    A well-known principle when taking fixed-length or short-form exams is first to
    read through the entire exam from start to finish. Answer only questions that
    you feel absolutely sure know. On subsequent passes, you can dive into more complex
    questions more deeply, knowing how many such questions you have left and the amount
    of time remaining.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_48_0.png)


    > There''s at least one potential benefit to reading the exam completely before
    answering the trickier questions: Sometimes, information supplied in questions
    sheds light on earlier questions. At other times, information you read in later
    questions may jog your memory about facts, figures, or behavior that helps you
    answer earlier questions. Either way, you''ll come out ahead if you answer only
    those questions on the first pass that you''re absolutely confident about.


    Fortunately, the Microsoft exam software for fixed-length and short-form tests
    makes the multiple-visit approach easy to implement. At the top-left corner of
    each question is a check box that permits you to mark that question for a later
    visit.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_48_1.png)


    > Marking questions make later review easier, but you can return to any question
    by clicking the Forward or Back button repeatedly.


    Here are some question-handling strategies that apply to fixed-length and short-form
    tests. Use them if you have the chance:


    +   - When returning to a question after your initial read-through, read every
    word again; otherwise, your mind can add or miss important details. Sometimes,
    revisiting a question after turning your attention elsewhere lets you see something
    you missed, the strong tendency is to see what you''ve seen before. Try to avoid
    that tendency at all costs.'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'If you return to a question more than twice, try to articulate yourself what
    you don''t understand about the question, why answers don''t appear to make sense,
    or what appears to be missing. If you chew on the subject awhile, your subconscious
    may provide the missing details, or you may notice a “trick” that points to the
    right answer.


    As you work your way through the exam, another counter comes handy—the number
    of questions completed and questions outstanding. For fixed-length and short-form
    tests, it''s wise to budget your time by making sure you''ve completed roughly
    one-quarter of the questions one-quarter of the way through the exam period, and
    three-quarters of the questions three-quarters of the way through.


    If you''re not finished when only five minutes remain, use that time to guess
    your way through any remaining questions. Remember, guessing is always more valuable
    than not answering. Blank answers are always wrong, but a guess may turn out to
    be right. If you don''t have a clue any of the remaining questions, pick answers
    at random or choose all a''s, b''s, and so on. Questions left unanswered are counted
    as answered incorrectly, so a guess is better than nothing at all.


    > At the very end of your exam period, you''re better off guessing than leaving
    questions unanswered.


    # Adaptive Exam Strategy


    If there''s one principle that applies to taking an adaptive test, it''s “Get
    it right the first time.” You cannot elect to skip a question and move on to the
    next one when taking an adaptive test, because the testing software uses your
    answer to the current question to select whatever question it plans to present.
    You also cannot return to a question because the software gives you only one chance
    to answer the question. You can, however, take notes as you work through the test.
    Sometimes, information supplied in earlier questions may help you answer later
    questions.


    Also, when you answer a question correctly, you are presented with a more difficult
    question next, to help the software gauge your level of skill and ability. When
    you answer a question incorrectly, you are presented with a less difficult question,
    and the software lowers its current estimate of your skill and ability. This continues
    until the program settles into a reasonably accurate estimate of what you know
    and can do.'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'The good news is that if you know the material, you''ll probably finish most
    adaptive tests in 30 minutes or so. The bad news is that you must really know
    the material well to do your best on an adaptive test. That''s because some questions
    are so convoluted, complex, or hard to follow that you''re bound to miss one or
    two, at a minimum. Therefore, the more you know, the better you''ll do on an adaptive
    test, even accounting for the occasionally strange or unfathomable questions that
    appear on these exams.


    > Because you can''t always tell in advance if a test is fixed length, short,
    adaptive or a combination, you should prepare for the exam as if it were adaptive.
    That way, you will be prepared to pass, no matter what kind of test you take.
    If the test turns out to be fixed length or short form, remember the tips from
    the preceding section, which will help you improve on what you could do on an
    adaptive test.


    If you encounter a question on an adaptive test that you can''t, you must guess
    an answer quickly. (However, you may suffer for your guess on the next question
    if you guess correctly, because the software will give you a more difficult question
    next!)


    # # Question-Handling Strategies


    For those questions that have only one right answer, usually two or three of the
    answers will be obviously incorrect, and two of the answers will be plausible.
    Unless the answer leaps out at you (if it does, reread the question to look for
    a trick; sometimes those are the ones you''re most likely to get wrong), begin
    the process of answering by eliminating those answers that are most obviously
    wrong.


    At least one answer out of the possible choices for a question can usually be
    eliminated immediately because it matches one of these conditions:


    +   - The answer does not apply to the situation.


    +   - The answer describes a nonexistent issue, an invalid option, or an imaginary
    state.


    After you eliminate all answers that are obviously wrong, you can apply your knowledge
    to eliminate further answers. Look for items that sound correct but refer to actions,
    commands, or features that are not present or available in the situation that
    the question describes.


    If you''re still faced with a blind guess among two or more potentially correct
    answers, reread the question. Try to picture how each of the possible remaining
    answers would alter the situation. Be especially sensitive to terminology;'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# Chapter 1


    sometimes the choice of words (“remove” instead of “disable”) can make the difference
    between a right answer and a wrong one.


    You should guess at an answer only after you''ve exhausted your ability to eliminate
    answers and are still unsure about which of the remaining possibilities is correct.
    An unanswered question feels you no points, but guessing gives you at least some
    chance of getting a question right; just don''t be too hasty when making a blind
    guess.


    > If you''re taking a fixed-length or a short-form test, you can wait until the
    last round of reviewing marking questions (just as you''re about to run out of
    time or unanswered questions) before you starting guesses. You will usually have
    the same option within each case study test (but once you leave a test, you may
    not be allowed to return to it). If you''re taking an adaptive test, you''ll have
    to guess move on to the next question if you can figure out an answer some other
    way. Either way, guessing should be your technique of last resort!


    Numerous questions assume the default behavior of a particular utility is in effect.
    If you know the defaults and understand what they mean, your knowledge will help
    you cut through Gordian knots. Simple “final” actions may be critical as well.
    If a utility may be restarted before proposed changes take effect, a correct answer
    may require this step as well.


    # Mastering the Inner Game


    In the final analysis, knowledge gives confidence and confidence breeds success.
    If you study the materials in this book carefully and review all of the practice
    questions at the end of each chapter, you should be aware of those areas where
    additional learning and study are required. Knowing what you don''t know also
    gives you confidence in what you do know, and allows you to concentrate your efforts
    in the most critical areas.


    After you''ve worked your way through the book'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Microsoft Certification Exams


    If you take a practice exam and don''t get at least 80 to 85 percent of the questions
    correct, keep practicing. Microsoft provides links to practice exam providers
    and also self-assessment exams at www.microsoft.com/traincert/mcpexams/prepare/.


    Armed with the information in this book and with the determination to augment
    your knowledge, you should be able to pass the certification exam. However, you
    need to work at it, or you''ll spend the exam fee more than once before you finally
    pass. If you prepare seriously, you should do well.


    The next section covers other sources you can use to prepare for the Microsoft
    Certification Exams.


    # Additional Resources


    A good source of information about Microsoft Certification Exams comes from Microsoft
    itself itself. Because its products and technologies—and the exams that go with
    them—change frequently, the best place to go for exam-related information is online.


    If you haven''t already visited the Microsoft Certified Professional site, do
    so right now. The MCP home page resides at www.microsoft.com/traincert/default.asp
    (see Figure 1.4).


    > NOTE This page may be replaced by something new and different by the time you
    read this, because things change regularly on the Microsoft site. Should this
    happen, please read the sidebar titled ''Coping with Change on the Web''.


    # Coping with Change on the Web


    Sooner or later, all of the information we''ve shared with you about the Microsoft
    Certified Professional pages and the other Web-based resources mentioned throughout
    the rest of this book will go stale or be replaced by newer information. In some
    cases, the URLs you find here may lead you to their replacements; in other cases,
    the URLs will go nowhere, leaving you with the dreaded "404 File not found" error
    message. When that happens, don''t give up.


    There''s always a way to find what you want on the Web if you''re willing to invest
    some time and energy. Most large or complex Websites (such as the Microsoft site)
    offer a search engine. On all of Microsoft''s Web pages, a Search button appears
    along the top edge of the page. As long as you can go to the Microsoft site (it
    should stay at www.microsoft.com for a long time), use this tool to help you find
    what you need.'
