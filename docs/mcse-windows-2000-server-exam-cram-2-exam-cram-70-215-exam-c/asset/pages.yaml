    +   - AppleTalk Routing


    With these protocols, and other router features such as demand-dial routing, packet
    filtering, and Internet Control Message Protocol (ICMP) router discovery, the
    Windows 2000 RRAS is fully capable of replacing a hardware router in most situations.


