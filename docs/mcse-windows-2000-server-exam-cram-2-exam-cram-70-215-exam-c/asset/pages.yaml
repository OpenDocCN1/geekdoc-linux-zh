  md: '# Chapter 8


    To recover a file or folder


    +   1. Log on to the computer using the EFS Data Recovery Agent account.

    2. Right-click the file or folder and select Properties.

    3. Click the Advanced button.

    4. From the Advanced Attributes dialog box, deselect the Encrypt Contents to Secure
    Data checkbox.

    5. Click OK twice to save.


    # Encryption Using the Cipher Command


    The cipher command-line utility is supplied so that you can work with encrypted
    files and folders from the command line. This is handy when you are encrypting
    or decrypting a large number of files or folders, because you can use wildcards,
    or run the utility from a script.


    ```

    C:\> cipher /f

    ```


    The cipher command options are shown in Table 8.1.


    | Table 8.1 Cipher Command-Line Options |

    | Option | Meaning |

    | No parameters | Displays the encryption state of the files in the current folder
    |

    | /e | Encrypts the specified folder(s) |

    | /d | Decrypts the specified folder(s) |

    | /dir | Performs the operation on the current folder and all subfolders |

    | /a | Encrypts/Decrypts the files in all of the folders that were specified |

    | / | Continues when an error occurs |

    | /f | Forces all specified files to be encrypted |

    | /q | Non-verbose reporting |

    | /h | Displays hidden or system files |

    | /k | Creates a new key. All other options are ignored |


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_325_0.png)


    > You might encounter EFS questions on the exam. You should know how to encrypt
    and decrypt files and folders using both the GUI and the cipher utility. In addition,
    you should be familiar with the key recovery process.'
  merge: -1
