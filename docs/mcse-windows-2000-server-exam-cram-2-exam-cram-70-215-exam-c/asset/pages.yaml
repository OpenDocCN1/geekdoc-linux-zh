- img_proc: true
  md: '![](img/7b2cdf076a380b70409b2e8f4835fae3_416_0.png)


    # # Using the PrepLogic Practice Tests,

    Preview Edition Software'
  merge: -1
  pgno: 416
- img_proc: true
  md: 'This Exam Cram includes a special version of PrepLogic Practice Tests—a revolutionary
    test engine designed to give you the best in certification exam preparation. PrepLogic
    offers sample and practice exams for many of today''s most in-demand and challenging
    technical certifications. This special Preview Edition is included with this book
    as a tool to use in assessing your knowledge of the Exam Cram material, while
    also providing you with the experience of taking an electronic exam.


    This appendix describes in detail what PrepLogic Practice Tests, Preview Edition
    is, how it works, and what it can do to help you prepare for the exam. Note that
    although the Preview Edition includes all the test simulation functions of the
    complete, retail version, it contains only a single practice test. The Premium
    Edition, available at PrepLogic.com, contains the complete set of challenging
    practice exams designed to optimize your learning experience.


    # Exam Simulation


    One of the main functions of PrepLogic Practice Tests, Preview Edition is exam
    simulation. To prepare you to take the actual vendor certification exam, PrepLogic
    is designed to offer the most effective exam simulation available.


    # Question Quality


    The questions provided in the PrepLogic Practice Tests, Preview Edition are written
    to the highest standards of technical accuracy. The questions tap the content
    of the Exam Cram chapters and help you to review and assess your knowledge before
    you take the actual exam.


    # Interface Design


    The PrepLogic Practice Tests, Preview Edition exam simulation interface provides
    you with the experience of taking an electronic exam. This enables you to effectively
    prepare yourself for taking the actual exam by making the test experience a familiar
    one. Using this test simulation can help to eliminate the sense of surprise or
    anxiety you might experience in the testing center because you will already be
    acquainted with computerized testing.


    # Effective Learning Environment


    The PrepLogic Practice Tests, Preview Edition interface provides a learning environment
    that not only tests you through the computer, but also teaches the material you
    need to know to pass the certification exam. Each question'
  merge: -1
  pgno: 417
- img_proc: true
  md: 'comes with a detailed explanation of the correct answer and often provides
    reasons the other options are incorrect. This information helps to reinforce the
    knowledge you already have and also provides practical information you can use
    on the job.


    # # Software Requirements


    PrepLogic Practice Tests requires a computer with the following:


    +   - Microsoft Windows 98, Windows Me, Windows NT 4.0, Windows 2000, or Windows
    XP

    - A 166MHz or faster processor is recommended

    - A minimum of 32MB of RAM

    - As with any Windows application, the more memory, the better your performance

    - 10MB of hard drive space


    # # Installing PrepLogic Practice Tests, Preview Edition


    Install PrepLogic Practice Tests, Preview Edition by running the setup program
    on the PrepLogic Practice Tests, Preview Edition CD. Follow these instructions
    to install the software on your computer:


    +   1. Insert the CD into your CD-ROM drive. The Autorun feature of Windows should
    launch the software. If you have Autorun disabled, click the Start button and
    select Run. Go to the root directory of the CD and select setup.exe. Click Open,
    and then click OK.

    2. The Installation Wizard copies the PrepLogic Practice Tests, Preview Edition
    files to your hard drive; adds PrepLogic Practice Tests, Preview Edition to your
    Desktop and Program menu; and installs test engine components to the appropriate
    system folders.


    # # Removing PrepLogic Practice Tests, Preview Edition from Your Computer


    If you elect to remove the PrepLogic Practice Tests, Preview Edition product from
    your computer, an uninstall process has been included to ensure that it'
  merge: -1
  pgno: 418
- img_proc: true
  md: 'is removed from your system safely and completely. Follow these instructions
    to remove PrepLogic Practice Tests, Preview Edition from your computer:


    +   1. Select Start, Settings, Control Panel.


    +   2. Double-click the Add/Remove Programs icon.


    +   3. You are presented with a list of software currently installed on your computer.
    Select the appropriate PrepLogic Practice Tests, Preview Edition title you wish
    to remove. Click the Add/Remove button. The software is then removed from your
    computer.


    # Using PrepLogic Practice Tests, Preview Edition


    PrepLogic is designed to be user friendly and intuitive. Because the software
    has a smooth learning curve, your time is maximized, as you will start practicing
    almost immediately. PrepLogic Practice Tests, Preview Edition has two major modes
    of study: Practice Test and Flash Review.


    Using Practice Test mode, you can develop your test-taking abilities, as well
    as your knowledge through the use of the Show Answer option. While you are taking
    the test, you can reveal the answers along with a detailed explanation of why
    the given answers are right or wrong. This gives you the ability to better understand
    the material presented.


    Flash Review is designed to reinforce exam topics rather than quiz you. In this
    mode, you will be shown a series of questions, but no answer choices. Instead,
    you will be given a button that reveals the correct answer to the question and
    a full explanation for that answer.


    # Starting a Practice Test Mode Session


    Practice Test mode enables you to control the exam experience in ways that actual
    certification exams do not allow:


    +   Enable Show Answer Button—Activates the Show Answer button, allowing you to
    view the correct answer(s) and a full explanation for each question during the
    exam. When not enabled, you must wait until after your exam has been graded to
    view the correct answer(s) and explanation(s).'
  merge: -1
  pgno: 419
- img_proc: true
  md: 'Enable Item Review Button—Activates the Item Review button, allowing you to
    view your answer choices, marked questions, and facilitating navigation between
    questions.


    Randomize Choices—Randomize answer choices from one exam session to the next;
    makes memorizing questions more difficult, therefore keeping questions fresh and
    challenging longer.


    To begin studying in Practice Test mode, click the Practice Test radio button
    from the main exam customization screen. This will enable the options detailed
    above.


    To your left, you are presented with the options of selecting the pre-configured
    Practice Test or creating your own Custom Test. The pre-configured test has a
    fixed time limit and number of questions. Custom Tests allow you to configure
    the time limit and the number of questions in your exam.


    The Preview Edition included with this book includes a single pre-configured Practice
    Test. Get the complete set of challenging PrepLogic Practice Tests at PrepLogic.com
    and make certain you''re ready for the big exam.


    Click the Begin Exam button to begin your exam.


    # Starting a Flash Review Mode Session


    Flash Review mode provides you with an easy way to reinforce topics covered in
    the practice questions. To begin studying in Flash Review mode, click the Flash
    Review radio button from the main exam customization screen. Select either the
    pre-configured Practice Test or create your own Custom Test.


    Click the Best Exam button to begin your Flash Review of the exam questions.


    # Standard PrepLogic Practice Tests, Preview Edition Options


    The following list describes the function of each of the buttons you see. Depending
    on the options, some of the buttons will be grayed out and inaccessible or missing
    completely. Buttons that are accessible are active. The buttons are as follows:'
  merge: -1
  pgno: 420
- img_proc: true
  md: 'Exhibit—This button is visible if an exhibit is provided to support the question.
    An exhibit is an image that provides supplemental information necessary to answer
    the question.


    Item Review—This button leaves the window and opens the Item Review screen. From
    this screen you will see all questions, your answers, and your marked items. You
    will also see correct answers listed here when appropriate.


    Show Answer—This option displays the correct answer with an explanation of why
    it is correct. If you select this option, the current question is not scored.


    Mark Item—Check this box to tag a question you need to review further. You can
    view and navigate your Marked Items by clicking the Item Review button (if enabled).
    When grading your exam, you will be notified if you have marked items remaining.


    Previous Item—This option allows you to view the previous question.


    Next Item—This option allows you to have completed the next question.


    Grade Exam—When you have completed your exam, click this button to end your exam
    and view your detailed score report. If you have unanswered or marked items remaining
    you will be asked if you would like to continue taking your exam or view your
    exam report.


    # Time Remaining


    If the test is timed, the time remaining is displayed on the upper right corner
    of the application screen. It counts down the minutes and seconds remaining to
    complete the test. If you run out of time, you will be asked if you want to continue
    taking the test or if you want to end your exam.


    # Your Examination Score Report


    The Examination Score Report screen appears when the Practice Test mode ends—as
    the result of time expiration, completion of all questions, or your decision to
    terminate early.


    This screen provides you with a graphical display of your test score with a breakdown
    of scores by topic domain. The graphical display at the top of the screen compares
    your overall score with the PrepLogic Exam Competency Score.'
  merge: -1
  pgno: 421
- img_proc: true
  md: 'The PrepLogic Exam Competency Score reflects the level of subject competency
    required to pass this vendor''s exam. While this score does not directly translate
    to a passing score, consistently matching or exceeding this score suggest you
    possess the knowledge to pass the actual vendor exam.


    # Review Your Exam


    From Your Score Report screen, you can review the exam that you just completed
    by clicking on the View Items button. Navigate through the items viewing the questions,
    your answers, the correct answers, and the explanations for those answers. You
    can return to your score report by clicking the View Items button.


    # Get More Exams


    Each PrepLogic Practice Tests, Preview Edition that accompanies your Exam Cram
    contains a single PrepLogic Practice Test. Certification students worldwide trust
    PrepLogic Practice Tests to help them pass their IT exams the first time. Purchase
    the Premium Edition of PrepLogic Practice Tests and get the entire set of all
    new challenging Practice Tests for this exam. PrepLogic Practice Tests—Because
    You Want to Pass the First Time.


    # Contacting PrepLogic


    If you would like to contact PrepLogic for any reason, including information about
    our extensive line of certification practice tests, we invite you to do so. Please
    contact us online at http://www.preplogic.com.


    # Customer Service


    If you have a damaged product and need a replacement or refund, please call the
    following phone number:


    800-858-7674


    # Product Suggestions and Comments


    We value your input! Please email your suggestions and comments to the following
    address:


    feedback@preplogic.com'
  merge: -1
