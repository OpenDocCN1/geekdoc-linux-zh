  md: '# Viewing Disk Properties


    You can quickly determine the properties of each physical disk in your computer
    by right-clicking the disk in question (see Figure 6.2) in the bottom area of
    the Disk Management window and selecting Properties from the shortcut menu.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_217_0.png)


    **Figure 6.2** Getting to the Disk Properties dialog box.


    As shown in Figure 6.3, the Disk Properties dialog box shows you the following
    information about your disks:


    +   - The disk number'
