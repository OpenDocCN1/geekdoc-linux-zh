    of the network card. Any other addresses in the 127 range are considered invalid
    or not supported by some TCP/IP implementations.


    A feature that was first used in Windows 98 and has now been brought over to Windows
    2000 is Auto IP Addressing (APIPA). APIPA automatically supplies an IP address
    to your network adapter if you don''t specify a static IP address and your computer
    is unable to connect to a DHCP server. The APIPA service queries the network to
    find out what APIPA addresses are in use, and then it attempts to assign your
    computer a unique IP address in the 169.254.0.0–169.254.255.255 range. APIPA does
