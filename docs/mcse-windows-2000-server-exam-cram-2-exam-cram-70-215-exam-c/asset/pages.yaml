    # Encrypting File System (EFS)


    The *Encrypting File System (EFS)* is a new feature in Windows 2000. EFS is an
    extension to NTFS version 5.0 which is included with Windows 2000, and allows
    the user to encrypt files and folders using public/private key technology which
    makes it difficult, but not necessarily impossible to crack.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# 290 Chapter 8


    As is typical with this key technology, the public key is used to encrypt the
    data, and a private key is used for decryption. After encryption is configured,
    the encrypt/decrypt process is transparent to the user.


    > NOTE The file/folder encryption and compression attributes are mutually exclusive.
    You can apply one or the other to a file or folder, but not.


    The first time a user selects the encryption attribute from the properties dialog
    of a file or folder, as shown in Figure 8.16, EFS will automatically generate
    a public key pair, then the private key is certified by a Certificate Authority
    (CA). If a CA is not available, the public key is self-signed. All of this is
    transparent to the user.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_323_0.png)


    **Figure 8.16** The folder properties dialog box, showing the Advanced Attributes
    selections.


    So that the data can be recovered in case the user loses their private key, or
    leaves the company, the local administrator account is designated as the Data
    Recovery Agent (DRA). This is the default, and can be changed using the Public
    Key Policies node of the Local Security Settings MMC in Figure 8.17. Because this
    account is designated as the DRA, a recovery key that can be used by the local
    administrator to recover the encrypted data is generated and saved in the local
    administrators'' certificate store. This recovery key can be used only to recover
    the data. The user''s private key is never revealed.


    On a standalone Windows 2000 servers and workstations, the local administrator
    account is designated as the Data Recovery Agent (DRA). In a domain, the domain
    administrators account has this role. If the DRA role is removed by a configuration
    error, the system assumes that no data recovery policy is in place and will refuse
    to encrypt any files or folders.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '![](img/7b2cdf076a380b70409b2e8f4835fae3_324_0.png)


    **Figure 8.17** The Local Security Settings MMC, showing the Encrypted Data Recovery
    Agents certificate.


    The following conditions apply when moving or copying encrypted files:


    +   * If an encrypted file or folder is moved or copied to another folder on an
    NTFS formatted volume, it remains encrypted.

    * If an encrypted file or folder is moved or copied to a FAT or FAT32 formatted
    volume, it is decrypted.

    * If an encrypted file or folder is moved or copied to a floppy, it is decrypted.

    * If a user other than the one who encrypted the file or folder attempts to copy
    it, they will receive the message “Access is Denied.”

    * If a user other than the one who encrypted the file or folder attempts to move
    it to a folder that was encrypted by the original user, they will be successful.

    * If a user other than the one who encrypted the file or folder attempts to move
    or copy it to another volume, either NTFS, FAT, or FAT32, they will receive the
    message “Access is Denied.”


    > NOTE The user account with recovery agent rights will be able to copy the file
    to his/her computer to perform recovery operations.


    # # Recovering an Encrypted File or Folder


    To recover an encrypted file or folder, you must use the EFS recovery agent.'
  merge: -1
