    # User Authentication


    When a user logs on to a Windows 2000 computer, the user supplies a user account
    and a password, or possibly a Smart Card, if that technology is being used. This
    information is used to *authenticate* the user. In other words, these items are
    used to confirm that the user is who he says he is. After the user is properly
    authenticated, an access token is created for that user. This access token consists
    of'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Chapter 8


    +   Security Identifier (SID)—Each object in Windows 2000 has a unique SID that
    identifies it. SIDs are never reused.


    +   Member of List—This list contains all the SIDs of the groups of which the
    user account is a member.


    +   User Rights—This list contains all the user rights that have been assigned
    to this user account.


    After the user is logged on to the server, each process or resource that the user
    attempts to access will examine this access token to confirm that the user has
    been granted the appropriate access.


    All Windows 2000 objects have security restrictions. These security restrictions
    are configured in the Access Control List (ACL). The ACL contains listing of users
    and groups that have access to the object, and specifically what type of access.


    Although the username is how we identify accounts, Windows 2000 uses the account''s
    SID for authentication and access levels. Note that the SID will be a unique string,
    such as S-1-5-25-1123561935-920026236-84092546-1000. For example, if you accidentally
    delete a user account and create another using the same username and properties,
    it will have a different SID. The new user account will not have access to the
    same resources as the old account unless you manually grant the permissions by
    assigning the user account to the same groups. The access permissions were assigned
    to the deleted SID. Windows 2000 never reuses a SID; they will always be unique.


    If you have a user who leaves the organization and is replaced by a new employee
    who will be performing the same tasks, you should rename the old user account
    for use by the new user. This ensures that the new user has access to the same
    resources as the old user.


    # System Policies


    System Policies are used to control the configuration of a machine or a users,
    such as whether a user can install new programs, adjust desktop settings, and
    so on. Windows 2000 System Policies are an updated version of the policies that
    were included in previous versions of Windows. Like the previous versions, in
    Windows 2000 you will use the System Policy Editor, poledit.exe, to configure
    Registry settings that control the local machine.'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'Implementing, Monitoring, and Troubleshooting Security


    Normally, you should always use the Windows 2000 Group Policy to control your
    computers, however, there are some situations in which System Policies are useful:


    +   - When you have to manage Windows 95, 98, or Me computers.


    +   - When you have to manage Windows NT 4.0 Workstation or Server computers.


    +   - When the Windows 2000 computer is a member of a Windows NT 4.0 domain.


    +   - When you have to manage a standalone Windows 2000 computer.


    In all these situations, an Active Directory based Group Policy is not available.
    The pre-Windows 2000 computers do not support Group Policy, so in a mixed environment,
    for the sake of consistency, you might want to standardize it by using a common
    policy created using the System Policy Editor.


    In addition, the Local Computer Policy is unable to create a policy that will
    support multiple users. So all users on a standalone computer will receive the
    same settings.


    The System Policy Editor is not on the system menu; you must start it from the
    command line by entering poledit.exe. The editor allows you to create policies
    that apply to single or multiple users, groups, or computers (see Figure 8.6).


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_308_0.png)


    **Figure 8.6** The System Policy Editor.


    The System Policy Editor comes with five administrative templates:


    +   - Inets.adm—Installed by default. This template contains the settings for
    Internet Explorer policies.'
