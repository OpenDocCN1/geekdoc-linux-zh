    files on the server and meet the following security requirements:


    +   - You must limit local access to change or delete files and folders except
    Administrators and Server Operators.

    - You must track all failed logon attempts.

    - You must allow members of the Accounting group complete access to the files
    in the Accounting and Payroll folders on the NTFS volume.

    - You must not allow remote access to the Everyone group to the Security Management
    share on the FAT volume.


