  md: '# Introduction


    This chapter covers a lot of ground, starting at the bottom of the pyramid, to
    speak, and working our way up. We first look at some simple yet very critical
    items, such as installing network adapters, configuring network protocols, and
    configuring network services.  These topics make up the bottom levels of our networking
    pyramid. As we move through the chapter, we examine more complex subjects, such
    as sharing connection access, configuring for Remote Access and Virtual Private
    Networking, and Terminal Services. Because many networks often have an improperly
    configured network adapter, we will start first with that topic.


    # Installing, Configuring, and Troubleshooting Network Adapters and Drivers


    Installing a network adapter into your Windows 2000 computer should be one of
    the easiest tasks you ever have to perform. Chapter 4, “Configuring and Troubleshooting
    Hardware Devices and Drivers,” covered hardware installation and configuration
    in some detail, so if you need a refresher on installing your network adapter,
    see Chapter 4.


    After you have the network adapter and drivers properly installed, you need to
    configure the network adapter driver. Each network adapter allows different levels
    of configuration options; some network adapters allow more configurable options
    than others. Figure 7.1 displays the network adapter properties shown in the Device
    Manager for a typical AMD network adapter.


    It’s important to note that not all network adapters have the same properties
    nor the same properties tabs. In the following sections, we examine each tab of
    the network adapter properties page shown in Figure 7.1 and discuss the typical
    network adapter configuration options available to you.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# Configuring and Troubleshooting Windows 2000 Network Connections


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_250_0.png)


    **Figure 7.1** The network adapter properties page.


    # # General Network Adapter Properties


    From the General tab, seen in Figure 7.1, you can gather some basic information
    about the network adapter, such as the type of network adapter you have, the manufacturer,
    and the physical location within your computer. You can also determine whether
    the device is functioning properly.


    If the device is functioning improperly, you can opt to start the Hardware Troubleshooter
    by clicking the Troubleshooter button. Lastly, you can manually disable and enable
    the network adapter by using the Device usage drop down.


    # # Advanced Network Adapter Properties


    On the Advanced tab, shown in Figure 7.2, you can configure some of the deeper
    options that your network adapter may support.


    Bear in mind that each network adapter will have different options listed on the
    Advanced tab. Therefore, if you don''t see what''s listed in Figure 7.2, it''s
    not necessarily a problem as long as your drivers are up to date and properly
    installed.


    By selecting a value from the list on the left side, you can configure its options
    in the right side of the page. The most common item you may want to consider configuring
    manually is that for speed (Link Speed/Duplex Mode) in our example. You should
    configure the adapter to the maximum speed'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'supported by the network adapter and your network infrastructure. In most cases
    this should be configured to 100MBps full duplex, but your network conditions
    may vary.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_251_0.png)


    **Figure 7.2** Configuring the network adapter''s advanced options.


    # # Driver Properties


    On the Driver tab, you can get more detailed information on the currently installed
    driver. The following is some of the information that is available to you:


    +   - Driver provider

    - Driver date

    - Driver version

    - Digital signer


    Each item in this list can be used to help discover or prevent driver-related
    problems with the hardware installed on your network. Refer to Chapter 4 if you
    need to refresh on the importance of digital signatures.


    By clicking the Driver Details button, you can gain very detailed information
    on each file that makes up the driver file set. Clicking the Uninstall button
    allows you to actually uninstall the network adapter itself, which is a useful
    first step to try when you begin experiencing hardware problems. Clicking the
    Update Driver button allows you to update the installed driver file set as discussed
    previously in Chapter 4.'
  merge: -1
