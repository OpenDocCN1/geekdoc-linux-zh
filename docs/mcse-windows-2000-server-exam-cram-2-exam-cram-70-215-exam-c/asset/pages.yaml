  md: 'Installing, Configuring, and Troubleshooting Access to Resources


    In preparing for the exam, it is recommended that you run through the process
    of creating printer objects of various types. This can be done even without a
    print device attached to your local computer, as long as you remember to not allow
    Windows to autodetect the device. Although creating printer objects is not a large
    part of the exam, it is crucial to understand how they are both created for the
    test and for real-world application.


    # Printing Environment Configuration and Security


    Like any Windows resource, the printing environment in Windows 2000 is highly
    secure and configurable. Access to printer objects is controlled in the same manner
    as access to objects such as files or folders; privileges are defined on a user
    and group basis. For printer objects, there are three basic permissions. The permissions
    given to users can be


    +   - Print


    +   - Manage documents


    +   - Manage printer


    Table 3.1 outlines what actions users can take within a Windows 2000 print environment
    based on the permission they were assigned.


    | Table 3.1 Printer-Specific Permissions | | | |

    | Permission | Print | Manage Documents | Manage Printer |

    | Print documents | Y | Y | Y |

    | Pause, restart, and cancel own documents | Y | Y | Y |

    | Connect to a printer | Y | Y | Y |

    | Control job settings for all documents | N | Y | Y |

    | Pause, restart, and cancel all documents | N | Y | Y |

    | Share a printer | N | N | Y |

    | Change printer properties | N | N | Y |

    | Delete printers | N | N | Y |

    | Change printer permissions | N | N | Y |'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# Chapter 3


    In addition to the three basic permissions outlined in Table 3.1, printer objects
    can be configured with more advanced settings. This configuration screen, called
    the Access Control Settings dialog box (see Figure 3.2), is accessed through the
    printer''s properties page or by clicking Advanced on the Security tab. Using
    Access Control Settings to manage permissions allows you finer level of granularity
    in your configurations. In addition, this utility is used to configure auditing
    for the object and manage the object''s settings.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_111_0.png)


    Figure 3.2 The Access Control Settings dialog box is used to manage Advanced security
    settings for printers in Windows 2000.


    From a troubleshooting perspective, the best preparation for the test is extensive
    knowledge of how documents flow from the user''s application to the physical device.
    If only one user is experiencing problems printing, it is most likely a problem
    with the user''s individual configuration or permissions assignment. To attempt
    to pin down a problem with a user''s printing configuration, rely on the Print
    Test Page option in the print device''s properties box. The test page is a good
    first step to identifying whether there are problems with the printer driver,
    permission assignments, or the print server itself.


    As you''ll learn in greater detail in Chapter 5, “Managing, Monitoring, and Optimizing
    System Performance, Reliability, and Availability,” Windows 2000 includes a Performance
    snap-in that is used to monitor system counters to gauge various aspects of system
    performance. To monitor printer server performance, Windows 2000 includes the
    Print Queue object. This object allows you to monitor counters as bytes printed
    per second and the number of errors generated.'
