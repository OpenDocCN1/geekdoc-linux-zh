  md: '# Question 8


    Joe is a member of your graphic art department. He frequently stores large files
    on his Windows 2000 Professional computer while he is still editing them. He would
    like to implement some form of fault tolerance for his data. Joe currently has
    two 0GB hard disks installed in his computer. What should you do to Joe''s computer
    to implement fault tolerance with the least administrative effort?


    +   A. Upgrade his Windows 2000 Professional computer to Windows 2000 Server and
    create a mirrored volume for him.

    B. Upgrade his basic disks to dynamic disks and create a mirrored set from them.

    C. Install a SCSI controller card and three SCSI external hard disks. Create a
    RAID-5 array from these external hard disks.

    D. Create a RAID-5 array on his computer using the two installed 60GB disks.


    **Answer A** is correct. The easiest course of action would be to upgrade Joe''s
    basic disks to dynamic disks and then create a mirrored set out of them. Windows
    2000 Professional does not support mirrored sets; therefore, answer B is incorrect.
    Installing a SCSI controller card and three external SCSI hard disks for a RAID-5
    array will solve the problem as well, but is not the least amount of effort, thus
    answer C is incorrect. You cannot create a RAID-5 array on a Windows 2000 Professional
    computer, nor can you create one with less than three disks, thus answer D is
    incorrect.


    # Question 9


    Rick is a user in the administrative department of your organization. Rick complains
    to you today that he is out of disk space to save his files. Upon further investigation,
