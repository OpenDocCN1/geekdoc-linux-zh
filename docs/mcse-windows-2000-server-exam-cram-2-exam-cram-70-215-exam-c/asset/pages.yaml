  md: '# Question 2


    Hannah works as a help desk support technician for a large organization. Recently,
    she received a phone call from a user who stated that his newly installed scanner
    wasn''t working. When instructed to look at Device Manager, the user reported
    that the icon to the scanner looked normal except that it had a yellow exclamation
    point on it. What should Hannah have the user do to correct the most likely problem
    with the scanner?


    +   A. Manually assign resources for the device, because it is having a resource
    conflict with another device.

    B. Remove the device from the system and do not try to use it. Devices that show
    this icon are incompatible with Windows 2000 and should not be used.

    C. Install the device drivers from the installation disks or from files down-loaded
    from the manufacturer''s Web site.

    D. Enable the device for use in the current hardware profile.


    Answer C is correct. The best course of action is to install the device drivers
    either from the setup disks or from files downloaded from the manufacturer''s
    Web site. Devices that display this icon are typically not enabled due to missing
    or corrupted drivers. Manually assigning resources to the device will not correct
    the situation and is not possible because the device is not currently using any
    resources. Thus, answer A is incorrect. Devices that are experiencing a resource
    conflict display the yellow question mark with a red X, and devices that are disabled
    show either a normal icon with a red X (disabled by the user) or a normal icon
    with a yellow exclamation point (disabled by Windows). In this case, the device
    is displaying a normal icon with a yellow exclamation point; thus answers B and
    D are incorrect.'
