    173


    Windows NT, a Windows 2000 ERD does not contain the Registry files. A Windows
    2000 ERD contains the following:


    +   - Basic system files

    - The partition boot sector

    - The startup environment


    A Windows 2000 ERD must be created while your system is fully operational. To
    create a Windows 2000 ERD, perform the following steps:


    +   1. Start the Windows 2000 Backup program by selecting Start, Programs, Accessories,
    System Tools, Backup.

    2. In the initial Backup Wizard screen, or from the Tools menu, select the Emergency
    Repair Disk option.

    3. Insert a blank floppy disk into drive A; select the option to back up the Registry
    in the repair directory, and click OK (see Figure 5.19).

    4. Click the OK button when the disk has been created.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_206_0.png)


    Figure 5.19 Windows 2000 Backup showing the creation of the Emergency Repair Disk.


    The Registry option does not save the Registry files on the disk—they are saved
    in the %systemroot%\Repair\Regback folder on your computer. Just like in previous
    versions of Windows, you should make a new ERD after you make changes to your
    system, such as adding new hardware, installing a service pack, or other major
    configuration changes.'
