  md: '# Chapter 1


    network administration and to require you to evaluate one or more sets of circumstances.
    Often, you''ll be asked to give more than one answer to a question. You may also
    be asked to select the best or most effective solution to a problem from a range
    of choices, all of which are technically correct. Taking the exam is quite an
    adventure, and it involves real thinking. This book shows you what to expect and
    how to deal with the potential problems, puzzles, and predicaments.


    In the next section, you''ll learn more about the format of Microsoft test questions
    and how to answer them.


    # Exam Layout and Design: New Case Study Format


    The format of Microsoft exams can vary. For example, many exams consist of a series
    of case studies, with six types of questions regarding each presented case. Other
    exams may have the same six types of questions but complex multi-question case
    studies.


    For the Design exams, each case study presents a detailed problem that you must
    read and analyze. Figure 1.1 shows an example of what a case study looks like.
    You must select the different tabs in the case study to view the entire case.


    | Overview | Client LAN | Prospect LAN | Current WAN | Proposed WAN | Desktop
    Design | Internet Sales | Stat |

    |---|---|---|---|---|---|---||

    | Keyskiopia, a water sports-oriented company in Princeton, West Virginia, primarily
    focuses on selling outdoor gear, including camping equipment, and kayaking supplies,
    recently merged with a waterfront company called Click-a-Fish. Click-a-Fish is
    located in Sebring, Florida. The corporate side of the merger has gone well, but
    the network infrastructure is under some reconsideration. | | | | | | | |


    **Figure 1.1** This is a typical case study.


    Following each case study is a set of questions related to the case study. These
    questions can be one of six types (which are discussed next). Careful attention
    to detail provided in the case study is the key to success. You may want to read
    the questions first so that you know what to look for when reading the case study.
    Be prepared to toggle between the case study and the questions as you work. Some
    of the case studies also include diagrams (called exhibits) that you''ll need
    to examine closely to understand how to answer the questions.'
