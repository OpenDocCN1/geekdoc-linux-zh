  md: '# Chapter 7


    cannot contact a DNS server, or if there isn''t a HOST file on the computer. A
    computer can talk to another computer on the local subnet via NetBIOS broadcasts,
    but is usually unable to talk to computers on other subnets.


    +   Confirm the correct subnet mask has been entered. The subnet mask is used
    by the computer to determine whether a computer it is trying to communicate with
    on the local subnet, or a remote network.


    +   Make sure that there is a gateway configured, if necessary. There must be
    a gateway address configured for the computer to access resources on another subnet.


    After you have verified that all of the TCP/IP configuration settings are correct,
    use the ping command line utility to see how much connectivity you have.


    Ping in this order:


    +   1. The computer''s loopback address, 127.0.0.1. This determines whether TCP/IP
    and the network card are installed and configured correctly.


    +   2. The actual IP address of the computer you are trying to communicate with.
    If your IP address is not unique, you should receive an error message.


    +   3. A computer on the same subnet. This proves that your TCP/IP settings are
    correctly configured. If this fails, you might have the wrong subnet configured.


    +   4. The IP address of the default gateway. If the gateway is not operational,
    or you have the wrong gateway configured, you cannot communicate with anything
    that is not on the local subnet.


    +   5. A computer on a subnet past the default gateway. If you can send and receive
    a ping through a router, the problem is not on your computer.


    # Internet Connection Sharing


    Internet Connection Sharing (ICS) is a feature that was first used in Windows
    98 and updated for Windows 2000. ICS allows a home or small business to share
    its Internet connection with other computers on the network. This shared connection
    can be via a network card connected to a router or cable modem, or even a dial-up
    connection.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Configuring and Troubleshooting Windows 2000 Network Connections


    ICS works by connecting to an ISP and obtaining an IP address for the server that
    you are running ICS on. ICS then allows other computers on your network that are
    configured to receive an IP address by DHCP to request an IP address from the
    ICS computer that acts as a DHCP server. After the client receive an IP address
    from the ICS computer, they are able to access the Internet through the ICS computer.
    The ICS computer uses Network Address Translation (NAT) to make it appear to sites
    on the Internet that all requests are coming from the single IP address that was
    given by the ISP. When a client request is returned from the Internet, ICS automatically
    routes it to the computer that made the initial request.


    There are some limitations to the version of ICS in Windows 2000:


    +   - It can only be installed and configured by an administrator.

    - It cannot be used in a network with existing DHCP or DNS servers and external
    gateways, because it is unpredictable whether the existing DHCP server or ICS
    will supply IP configuration information and name resolution to the clients.

    - You cannot configure the DHCP or DNS configuration settings of ICS. This includes
    configuring the address range or even disabling the DHCP functions.


    > In the situations that were previously mentioned, when using ICS might not be
    practical, you can use the Remote Access and Routing Service (RRAS) with Network
    Address Translation (NAT) to perform the same duties as ICS. However, RRAS is
    somewhat harder to configure properly.


    To configure ICS, you must configure the properties of the dial-up connection,
    or network card that is exposed to the Internet.


    > Always remember that the ICS configuration is performed on the interface that
    is connected to the Internet. This is a very important point, and as such it might
    appear on the exam.


    To configure a dial-up connection for ICS


    +   1. Open the Network and Dial-up Connections application by selecting Start,
    Programs, Accessories, Communications, and then Network and Dial-up Connections.

    2. Right-click the connection that is used to connect to the ISP, and select Properties
    from the pop-up menu.'
