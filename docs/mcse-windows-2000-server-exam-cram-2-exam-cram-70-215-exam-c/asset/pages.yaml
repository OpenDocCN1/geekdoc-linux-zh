  md: '# Unattended Installations Using Disk Duplication


    Disk duplication, the process by which the entire hard drive of one machine is
    duplicated to the hard drive of another, is not a new concept. People have been
    doing it in one form or another for years, using third-party products. The idea
    that you can configure a machine completely (right down to all the application
    software you want), copy the information to a second disk, and then simply move
    the disk to a target machine is very appealing.


    The following disk duplication process formalizes the steps for creating a duplicate
    hard drive and allows for automated setup using the Sysprep.exe program. Sysprep,
    like the Setup Manager, is a tool stored in the deploy.cab file. It is recommended
    that you extract the Sysprep files from this cabinet file into a folder called
    Sysprep, as outlined in the following steps.


    +   1. From the Windows 2000 Server CD-ROM, navigate to the Support\Tools folder
    and double-click the Deploy.cab.


    +   2. Select the files sysprep.exe, setup.exe, and detool.chm; right-click one
    of them and choose Extract from the context menu.


    +   3. When the Browse for Folder dialog box appears, browse to the location where
    you want to extract the Setup Manager files (it is recommended that you use bootpartition\sysprep,
    but it is not required).


    The role of Sysprep.exe is to prepare a disk for duplication. Once the disk has
    been prepared, a third-party tool can be used to copy the duplicated drive onto
    other machines. Sysprep.exe, which is run from the Tools Management Console or
    from a command line, configures the disk image so that SIDs and other unique information
    are removed and ready to be re-created on the target machine. This ensures that
    no conflicts arise in interaction with other machines that have the same SID.
    The following steps describe the process to duplicate the master computer (the
    computer you are using as a model for your disk duplicates):


    +   1. Install and configure Windows 2000 on the master computer.


    +   2. Log on to the computer as Administrator.


    +   3. Install and configure all applications on the master computer.


    +   4. Run Sysprep.exe on the master computer to prepare that hard disk for duplication.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Chapter 2


    5. Use a disk-imaging tool to create an image of the master computer''s hard drive.
    You need to use a third-party tool such as Norton''s Ghost for this step.


    6. Create a copy of the target drive using your third-party duplication tool.
    Place the duplicated disk into the target computer.


    When the image has been transferred to a target machine, that machine is restarted
    and a Mini-Setup Wizard is run to complete the setup on that computer. One of
    the problems in disk duplication in the past has occurred when the information
    on the target machine needed to be different from on the source machine (for example,
    Security Identifiers—SIDs—and computer names). Sysprep takes care of that and
    they are modified when the target machine is restarted.


    If you want to completely automate the process of creating new installations,
    you can have Sysprep create a Sysprep.inf file that provides answers to the setup
    routine that runs when the target machine is started after the disk image has
    been placed on it. This .inf file can make the installation completely automated
    (which is why this discussion falls under the topic of unattended installations).


    # Using Sysprep.exe


    Table 2.3 outlines some additional parameters for Sysprep.exe that will allow
    you to control how it operates from a command line.


    | Table 2.3 Switches for Sysprep.exe |

    | Switch | Function |

    | -quiet | Runs the target computer''s setup with no user interaction. |

    | -pnp | Forces full Plug and Play device enumeration and installation during
    Mini-Setup. Use only when you need to detect and install legacy devices that are
    not Plug and Play compatible. Do not use the -pnp switch on computers that have
    all Plug and Play devices because you will increase the time required for first-run
    experience without providing any additional benefits. |

    | -reboot | Restarts the configuration computer when Sysprep is complete rather
    than simply shutting down. This will invoke the Setup program on the configuration
    computer and is used only when you want to verify that the setup program is functioning
    properly. |

    | -nosidgen | Prevents the regeneration of SIDs on the target computer. This is
    useful when you are transferring the contents of one machine to another for the
    purposes of decommissioning the original. The new machine then becomes an exact
    duplicate of the first. |'
