- img_proc: true
  md: '# Installing, Configuring, and Troubleshooting Access to Resources


    After clicking Next, you are presented with the Dfs root name, which by default
    is the name of the original share. It is also on this screen that you are able
    to add comments to the Dfs share''s configuration. Click Next to proceed to the
    final screen of the wizard. Here, you are presented with the final configuration
    for the Dfs share, which outlines the share''s configuration settings. Click Finish
    to complete the wizard.


    > NOTE On standalone Dfs roots, you cannot change the name of the root; it must
    be the same as the share. However, on domain Dfs roots, you are able to specify
    a root name that is different from the share name.


    # Standalone and Domain Dfs Types


    There are two types of Dfs roots used in Windows 2000, standalone and domain.
    Domain Dfs roots are sometimes referred to as fault-tolerant dfs roots because
    they use Active Directory services to distribute Dfs information to all servers
    in the tree. Standalone Dfs root, on the other hand, is stored in the Registry
    of the hosting server. Because of this limitation, there is no backup for a standalone
    Dfs root. If the server hosting the Dfs root is unavailable, the information provided
    by the Dfs share is not accessible to users. Though it is possible to configure
    replicas of Dfs links associated with standalone Dfs roots on other servers, the
    files in the linked share must be synchronized manually, so it is not considered
    a truly fault-tolerant system. Standalone Dfs roots can be configured with one
    level of Dfs links and can reside on any supported file system. However, it is
    recommended that all Dfs links identify resources on NTFS volumes.


    There are a few key differences between standalone Dfs roots and domain Dfs roots.
    The most evident is the fact that all Active Directory servers in the domain distribute
    information in response to requests from clients on the network. Because the information
    is stored as part of the Active Directory, it is replicated to every domain controller.
    This replication ensures that users are never without access to the information
    in the Dfs share. Because of their interaction with Active Directory, domain Dfs
    roots must be located on NTFS 5.0 partitions.


    There is very little difference between creating a domain Dfs root and a standalone
    Dfs root, aside from selecting the option on the initial screen of the New Dfs
    Root Wizard. On the second screen of the wizard you are asked to choose the host
    domain for the Dfs root. After clicking Next, the configuration requirements are
    the same: Identify the host server, identify the share, Name the Dfs root, and
    Add comments.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Chapter 3


    The differences are really seen after the Dfs root is created. As Figure 3.5 shows,
    right-clicking on a Dfs domain root presents a menu that includes “New Root Replica,”
    which is not available for standalone roots. Selecting this option launches the
    same process for creating a Dfs root; the only difference is that a replication
    of the original. Once the root has been created, you can enable Dfs replication
    between the roots. Because of the potentially high traffic volume, Dfs replication
    is disabled by default. To enable replication, right-click the Dfs root and select
    Replication Policy. You are then able to select each of the Dfs root replicas
    defined. Select at least two of the replicas and click Enable. Dfs root replication
    is handled by the File Replication Service discussed in the next section.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_117_0.png)


    Figure 3.5 Select replication policy to synchronize files between replicas.


    # Dfs Links


    As mentioned, Dfs links are created to tie share root information from different
    servers into a single, easy to access location. Once the Dfs root has been created,
    you can create Dfs links to other shared folders. In the Dfs plug-in, select the
    Dfs root to will host the link, then select New Dfs Link from the Action menu.
    When prompted, fill in the name to be assigned to the Dfs link, the shared folder
    information, and any comments regarding the link. If you are uncertain of the
    exact name and location of the shared folder, use the Browse button to search
    the network. When the Dfs links have been configured, they will look to the users
    like other folders normally found in the share.'
