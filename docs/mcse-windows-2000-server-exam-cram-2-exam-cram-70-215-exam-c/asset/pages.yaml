    Private IP addresses are sometimes referred to as non-routable addresses. This
    is because the addresses are not routed to the Internet by an Internet service
    provider (ISP). The name is misleading because these networks are routed within
    private networks and Intranets. To conserve IP addresses, most companies use private
    IP addresses within their network, and use some type of proxy or firewall to translate
    the private address to a public address when an internal user is going out to
    the Internet. This is also a good security measure, because outsiders have no
    easy way of knowing the IP addresses of computers in your organization.


