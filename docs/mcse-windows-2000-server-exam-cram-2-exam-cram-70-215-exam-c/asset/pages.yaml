  md: '# Configure, Manage, and Troubleshoot a Standalone Distributed File System
    (Dfs)


    The Distributed file system (Dfs) is a new feature of Windows 2000. This item
    has been created to eliminate the confusion often experienced by end-users on
    large networks with multiple servers and extensive lists of shared folders. In
    other words, having to navigate for files through many folders found on many different
    servers is a cumbersome task. Dfs functionality allows you to put these shared
    folders in one central location. This will improve the usability of your network
    for your end-users.


    The Dfs service is installed automatically when Windows 2000 is set up on the
    server. When Dfs is implemented, it is configured to represent shared folders
    on multiple servers. The folders are shown in a hierarchical tree structure, as
    shown in Figure 3.3. The first shared folder in the tree acts as the Dfs root
    and the shared folder end-users use to access all folders in the Dfs configuration.
    Once the Dfs root is created, shared folders on the network are tied to the Dfs
    root using Dfs links.


    | Dfs Share: Human Resources Data

    Dfs Root: \DC1\HR Records

    Dfs Link: \Dallas\Payroll

    Dfs Link: \Dallas\Vacation Tracking

    Dfs Link: \Houston\Contracts |


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_114_0.png)


    Figure 3.3 Dfs shares are made up of a Dfs root and related Dfs links to shared
    folders.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Chapter 3


    > One of the biggest considerations when designing a Dfs implementation is that
    there can be only one Dfs root objects per server. This means you must carefully
    choose the servers to host Dfs root objects and design your Dfs configuration
    around the limitations of your network. Remember that the shares'' security permissions
    ultimately control whether a user is granted access to the shares in the Dfs structure
    or their files.


    Dfs management is handled through the Distributed File System MMC plug-in, which
    can be accessed through Administrative Tools in the Control Panel. To launch the
    New Dfs Root Wizard from this snap-in, click Action on the menu bar, then click
    New Dfs Root. After starting the wizard, the choice you make is whether to create
    a domain or standalone Dfs root. A domain Dfs root must be administered through
    Active Directory, whereas a standalone Dfs root can operate independently of directory
    services; this distinction is discussed in more detail in the sections that follow.
    Figure 3.4 shows the new configuration screen in the New Dfs Root Wizard in which
    you identify the server to host the Dfs root. By default, the server from which
    you launched the wizard is listed.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_115_0.png)


    **Figure 3.4** Identify the server to host the Dfs root.


    If you are creating a Dfs root on another server, click Browse to search for the
    server on the network. After you''ve identified the server, click Next. You will
    be given the option of choosing an existing share on the server or creating a
    new share.


    If you are creating a new share, you must identify the path to the share and the
    share name. To do this, of course, you must have sufficient permissions to create
    a share on the server.


    Regardless of whether you are utilizing an existing share or creating a new one,
    be certain to review the security configuration for the share to verify the Dfs
    share users have the correct permission settings.'
