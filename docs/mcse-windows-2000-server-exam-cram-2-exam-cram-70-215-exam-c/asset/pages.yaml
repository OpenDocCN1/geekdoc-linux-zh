  md: '# Monitor, Configure, Troubleshoot, and Control Access to Files, Folders, and
    Shared Folders


    Before discussing the ins and outs of file, folder, and folder access, it''s important
    to understand the underlying file system functions and the differences between
    the file systems supported by Windows 2000. There are four file systems recognized
    by Windows 2000: Universal Disk Format (UDF), CD-ROM File System (CDFS), File
    Allocation Table (FAT), and the NT File System (NTFS). However, UDF and CDFS are
    read-only file systems and do not truly support detailed access controls. For
    this reason, this section and the Microsoft exam focus on the capabilities and
    features of the FAT and NTFS file systems.


    # The FAT Allocation Table (FAT) File System


    The FAT file system is recognized by Windows 2000 to provide legacy support for
    early Windows operating systems. It was originally designed to support disks that
    were much smaller than the devices in use today. Consequently, it is not very
    efficient when handling large disks or files. Windows 2000 is able to read partitions
    formatted in two version of FAT, the 16-bit version (FAT16) supported by early
    versions of MS-DOS, and the 32-bit version (FAT32) first introduced by Windows
    95 OEM Service Release 2 (OSR2).


    Because FAT predates Windows NT and Windows 2000, it does not include support
    for security or enhanced partition features such as compression. From a practical
    perspective, the biggest difference between FAT16 and FAT32 is the maximum supported
    size. This is achieved by doubling the size of the File Allocation Table from
    16 bits to 32 bits. For FAT16 partitions, the maximum size is 4GB. In theory,
    FAT32 partitions support a maximum size of 2,047GB. However, there is a 32GB limitation
    on creating FAT32 partitions in Windows 2000.


    # The NT File System (NTFS)


    Introduced in 1993 with Windows NT 3.1, the NT File System (NTFS) is designed
    to provide a high performance, secure file system for Windows NT Servers. Windows
    2000 includes the latest version of NTFS, 5.0, which is an'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Chapter 3


    improvement over the original version included with NT 3.1, but the differences
    between NTFS and FAT are even more dramatic.


    One of the significant differences between FAT and NTFS is the reliability and
    compression features of NTFS. To ensure data is consistently written to the volume,
    NTFS uses transaction logging and advanced recovery techniques. In the event of
    a failure, NTFS uses checkpoint and data logging information to automatically
    maintain the consistency of the data on the volume. NTFS also supports selective
    file, folder, and volume compression, which is not available on FAT volumes. The
    selectivity of the NTFS compression settings allows administrators to pick and
    choose whether specific file system objects are compressed or not. Although data
    compression reduces the drive space required on the volume, it puts a greater
    burden on the system’s resources. Providing the option to compress entire volumes,
    folders, or individual files ensures that the drive space is used as efficiently
    as possible, while maintaining timely services. For additional information, refer
    to Chapter 6, "Managing, Configuring, and Troubleshooting Storage Use."


    In an effort to provide the fastest file services available, NTFS uses smaller
    clusters and has been designed to require fewer disk reads to find a file on the
    volume. NTFS version 5.0 also supports significantly larger volumes than FAT—up
    to 2 Terabytes on a single volume. NTFS volumes include highly configurable user
    and group options, including the use of disk quotas to limit the amount of drive
    space a user can consume. Perhaps more importantly, individual files, folders,
    and volumes can be secured at the user and group level. This is significantly
    more secure than the option available on FAT, which can only be secured for shared
    folders, and even then permissions are limited to three settings: Read, Change,
    and Full Control. Securing folders and files will be discussed in greater detail
    in the next few sections of this chapter.


    Because NTFS offers enormous improvements over the FAT file system, Microsoft
    recommends that all Windows 2000 volumes be formatted with NTFS. However, there
    are some situations where this is not possible. For example, most multiple-boot
    configurations require a FAT file system on the boot partition. If it is necessary
    to maintain a FAT volume on the server, it is important to understand the security
    implications of the configuration. As you will learn later in the "Monitor, Configure,
    and Control Local Security on Files and Folders" section of this chapter, FAT
    partitions cannot be secured when they are accessed from the server console. This
    is an important consideration when making the determination to support a FAT partition
    on a Windows 2000 Server.'
  merge: -1
