  md: '# Configuring and Troubleshooting Hardware Devices and Drivers


    Once you''re at the HCL Web site, finding your hardware is a fairly simple process.
    You just need to know what type of hardware you''re looking for, such as video
    adapters, and search on that. Alternatively, if you know a model number, as Matrox
    G450, you can search for that specifically.


    > NOTE If you have two components that are both on the HCL, that doesn''t necessarily
    mean that they have been tested together. That is, although each device is approved
    independently of the HCL, there may be conflicts between the devices that can
    cause errors.


    > NOTE The HCL for Windows 2000 DataCenter Server is located in a different location
    than the rest of the HCL. It can be found at http://www.microsoft.com/windows2000/datacenter/hcl/.
    Windows 2000 DataCenter is sold only by purchasing a packaged solution, which
    includes the hardware, DataCenter software, and the services to test and install
    the solution. It is sold only through approved vendors who can provide these capabilities.
    Details are available at http://www.microsoft.com/windows2000/datacenter/howtobuy/purchasing/ems.asp


    # Windows 2000 Readiness Analyzer


    Using the HCL is convenient for small amounts of hardware, but what do you do
    when you want to analyze the hardware contents of an entire computer? That''s
    where the second method available to you comes into play. Windows 2000 Readiness
    Analyzer, although arguably not as up-to-date as the HCL, can be used to determine
    the compatibility of hardware in an existing computer on which you want to install
    Windows 2000. The Windows 2000 Readiness Analyzer is run from the command prompt
    as follows:


    +   1. Open a command prompt by typing cmd in the Run box (Start, Run), and then
    click OK.

    2. From the command prompt, run the Readiness Analyzer by typing X:\i386\win32
    /checkupgradeonly and pressing Enter, where X is the location of the Windows 2000
    setup files.

    3. The analysis output window appears when the Readiness Analyzer has finished.
    You can quickly determine if any incompatible hardware devices exist in the computer.

    4. Should you need to, you can save the results of the Readiness Analyzer to a
    text file. Click Finish when you are done to close the Readiness Analyzer window.'
