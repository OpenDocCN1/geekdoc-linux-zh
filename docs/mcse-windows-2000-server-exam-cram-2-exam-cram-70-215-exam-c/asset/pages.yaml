    Windows 2000. |


    # Windows 2000 Shares Resources


    Some resources that devices require be specifically reserved for a single, specific
    device. Other resources can be shared between two or more devices, with Windows
    2000 dynamically managing resources as required. Windows 2000 works with the computer''s
    BIOS to share resources as follows.


    The IRQ uses a Programmable Interrupt Controller (PIC) to request some service
    for the device. When a request is seen, the operation is suspended and control
    is given to the device driver associated with the IRQ number (1–15). This resource
    therefore cannot be shared between devices.


    The I/O port is a memory block used by the device to communicate the service it
    is requesting. This is tied to the IRQ number and therefore is dedicated to a
    device.


    The DMA is a direct channel between the device and the computer''s memory. The
    DMA controller supplies a number of channels (usually seven) and they are shared
    between devices (at a time).


    A device memory block is a portion of system memory mapped to the internal memory
    of the device (usually). This is dedicated to the device and cannot be used by
    any other process, including Windows 2000.


