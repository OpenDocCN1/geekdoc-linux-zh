    differently, because it applies only to folders and is only inherited by folders.
    Whereas Read & Execute is inherited by both files and folders.


    **Table 3.2** NTFS File and Folder Permissions

    | Permission | Allows | Standard Permission |

    | :--- | :--- | :--- |

    | List Folder/ Read Data | Viewing folder contents (including subfolder names)
    and accessing data in files. | Read, Read & Execute, Modify, Full Control |


