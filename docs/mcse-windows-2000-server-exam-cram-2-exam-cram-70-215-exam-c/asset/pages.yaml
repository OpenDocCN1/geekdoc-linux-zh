    # Troubleshooting TCP/IP


    Even though TCP/IP is a mature technology, and you will rarely have problems,
    you should be able to perform some basic troubleshooting. For example, if a newly
    installed computer is unable to communicate with the other computers on the network
    or access the Internet, you should first verify that the TCP/IP settings are properly
    configured. This can easily be achieved using the ipconfig command line utility.


    Just open a command prompt and type ipconfig /all, and you should see something
    similar to the output shown in Figure 7.17.


