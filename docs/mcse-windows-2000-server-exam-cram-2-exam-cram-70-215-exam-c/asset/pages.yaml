    +   5. Right-click the specific device you wish to modify and select Properties
    from the context menu.


    +   6. Click the Driver tab, as shown in Figure 4.7.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_162_0.png)


    **Figure 4.7** Working with device drivers.


    +   7. Click the Update Driver button to start the Hardware Update Wizard.


    +   8. Select either an automatic installation or a manual installation. The manual
    installation states that it is an advanced option, but in reality it is the best
    way to get to your updated driver file—assuming that you know where it is.


    +   9. Follow through the rest of the steps in the Update Device Driver Wizard
    to install the updated device driver file on your computer.


    The process to update drivers is very simple but very important. Expect to be
    tested on this in one way or another.'
