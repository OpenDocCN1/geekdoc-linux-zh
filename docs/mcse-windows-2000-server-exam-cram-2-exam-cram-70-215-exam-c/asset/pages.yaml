  md: '# The Domain Name Service (DNS)


    The Domain Name Service is an Internet standard TCP/IP name service. DNS allows
    client machines to resolve, or locate, TCP/IP devices (servers, workstations,
    routers, and so on) within the LAN, and Internet hosts beyond the LAN. Although
    humans are comfortable with names, computers require numbers, so DNS is necessary
    to handle this resolution. For example, it is the responsibility of DNS to translate
    the user-friendly name http://www.quepublishing.com/ into the computer-friendly
    IP address 165.193.123.44.


    Windows 2000 uses DNS as the locator service for Active Directory (AD), and AD
    cannot be installed without a DNS server present and operational. Windows 2000
    computers query DNS at boot time to find the closest domain controller. Servers
    use DNS to create a replication topology to facilitate updates.


    > DNS replaces Windows Internet Naming Service (WINS) as the default name resolution
    mechanism in Windows 2000. However, WINS is still required for support of downlevel
    Windows 9x and NT 4.0 clients, and certain software applications.


    The shift to DNS as the primary lookup method provides a Windows 2000 environment
    with significant added functionality in its ability to locate and share information
    across an organization and to provide support for an open industry standard. Windows
    2000 also supports a number of innovations in the DNS environment, one of which
    is support for Dynamic DNS (DDNS), as described in RFC 2136, which allows Windows
    2000 to dynamically register with DNS servers listed in the TCP/IP properties.


    Windows 2000 also supports integrating the DNS database with Active Directory.
    This integration allows for DNS zone information to be maintained and distributed
    using the Active Directory replication technology already in place. This feature
    brings significant benefits to DNS, including


    +   - No single point of failure—Windows 2000 Active Directory uses multiple-master
    replication. Therefore, updates can be submitted to any participating DNS server.


    +   - Efficient replication—All Active Directory replication is on a per-property
    basis. For example, a user object has many properties associated with it—first
    name, last name, email address, phone extension, and so on. If one of these properties
    is changed, Active Directory replicates only that individual property, not the
    entire user object. This results in significantly smaller replication traffic
    across the network. Rather than an'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Configuring and Troubleshooting Windows 2000 Connections 223


    entire zone file being replicated every time a record changes, as would happen
    in traditional DNS, the integration of Microsoft DNS with Active Directory means
    that the only affected record is replicated to other DNS servers.


    +   Dynamic Registration—All computers that receive a leased IP address are automatically
    entered into the DNS database, and are removed when the lease expires.


    > NOTE ADS replication can be scheduled or compressed to save WAN bandwidth, even
    without ADS, DNS then incremental updates by default, thus replicating only changes
    rather than the entire zone file. If that fails to servers that don''t support
    incremental updates, it transfers the entire file.


