  pgno: 37
- img_proc: true
  md: 'After you complete a case study, you can review all of the questions and your
    answers. However, when you move on to the next case study, you cannot return to
    the previous case study and make any changes.


    Following are the six types of question formats:


    +   - Multiple-choice, single answer

    - Multiple-choice, multiple answers

    - Build list and reorder (list prioritization)

    - Create a tree

    - Drag and connect

    - Select and place (drag and drop)


    > Exam formats can vary by test center. You might want to call the test center
    to see if you can find out which type of test you will encounter. Some exams will
    be offered in both forms on a random basis which cannot be pre-determined.


    # Multiple-Choice Question Format


    Some exams require you to select a single answer, whereas others ask you to select
    multiple correct answers. The following multiple-choice question requires you
    to select a single correct answer. Following the question is a brief summary of
    each potential answer and why it is either right or wrong.


    # Question 1


    | You have three domains connected to an empty root domain under one contiguous
    domain name: tutu.com. This organization is formed into a forest arrangement with
    a secondary domain called frog.com. How many Schema Masters exist for this arrangement?

    ○ A. 1

    ○ B. 2

    ○ C. 3

    ○ D. 4 |


    The correct answer is A, because only one Schema Master is necessary for a forest
    arrangement. The other answers (B, C, D) are misleading because you are led to
    believe that Schema Masters may be in each domain, or that you should have one
    for each contiguous domain namespace.'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'This sample question format corresponds closely to the Microsoft Certification
    Exam format (of course, questions are not followed by answer keys on the exam).
    To select an answer, you position the cursor over the radio button next to the
    answer and click the mouse button to select the answer.


    Let''s examine a question where one or more answers are possible. This type of
    question provides check boxes rather than radio buttons for marking all appropriate
    selections.


    # Question 2


    +   How can you seize FSMO roles? [Check all correct answers]

    A. The ntdutil.exe utility

    B. The Replication Monitor

    C. The secedit.exe utility

    D. Active Directory Domains and FSMOs


    Answers A and B are correct. You can seize FSMO roles from a server that is still
    running through the Replication Monitor, or you can seize roles with the ntdutil.exe
    utility. The secedit.exe utility is used to force group policies to be reloaded;
    therefore, answer C is incorrect. Active Directory Domains and FSMOs are a combination
    of truth and fiction; therefore, answer D is incorrect.


    For this particular question, two answers are required. Microsoft sometimes gives
    partial credit for partially correct answers. For Question 2, you have to check
    the boxes next to answers A and B to obtain credit for a correct answer. Notice
    that picking the right answers also means knowing why the other answers are wrong.


    # Build-List-and-Reorder Question Format


    Questions in the build-list-and-reorder format present two lists of items: one
    on the left and one on the right. To answer the question, you must move items
    from the list on the right to the list on the left. The final list must then be
    reordered into a specific order.


    These questions are usually in the form, "From the following list of choices,
    pick the choices that answer the question. Arrange the list in a certain order."
    To give you practice with this type of question, some questions of this type are
    included in this study guide. Here''s an example of how they appear in this book;
    for a sample of how they appear on the test, see Figure 1.2.'
