    # Virtual Private Networks (VPNs)


    In addition to the dial-up remote access features of RRAS covered in the previous
    section, RRAS supports incoming connections via Virtual Private Network (VPN).
    A VPN uses a public medium, such as the Internet, to create a secure, encrypted
    tunnel to connect a client to a remote access server. After this connection is
    established, one of the tunneling protocols is used to encapsulate all of the
    commands and data that are passed from point-to-point. This allows the data to
    be secured from unauthorized individuals, which is especially important when using
    a public medium such as the Internet. Another advantage of tunneling is that Windows
    2000 supports a VPN that can encapsulate various protocols such as TCP/IP, IPX/SPX,
    and NetBEUI; the latter two protocols are not normally routed over the Internet.


    There are two tunneling protocols available for a VPN connection


    +   - Point-to-Point Tunneling Protocol (PPTP)—PPTP is carried over from Windows
    NT 4.0, and is also compatible with some third-party VPN software.


    +   - Layer Two Tunneling Protocol (L2TP)—L2TP is a newer protocol that uses IPSec
    for encryption.'
  merge: -1
  pgno: 282
