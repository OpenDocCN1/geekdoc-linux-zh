    Pack executable.


    +   2. Back up the existing files by choosing that in the Service Pack installation
    setup program.


    +   3. Reboot your computer to allow the changes to take effect.


    The update.exe command has some switches that can be used to modify its behavior.
    These switches are explained in Table 2.4.


