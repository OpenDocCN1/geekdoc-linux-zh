    # IIS 5.0 Authentication Methods


    IIS has supported primary authentication methods for some time, Basic and Integrated
    Windows. As mentioned in the WebDAV discussion earlier in the chapter, Basic Authentication
    dictates that users provide a user name and password to access a site, but this
    information is not encrypted for transmission. Because Basic Authentication is
    part of the original HTTP 1.0 standard, it is supported by most Web-enabled products,
    which almost ensures the client device will be respond to the request for authentication
    information. However, because the password is not encrypted, it could potentially
    be intercepted during transmission and used for unauthorized access to the site.


    Integrated Windows Authentication, previously Windows NT Challenge/Response, uses
    NTLM to authenticate older browsers with IIS servers, and uses the industry standard
    Kerberos v5 for authentication with supported browsers. Integrated Windows Authentication
    should only be used if Anonymous access has been denied and the IIS server is
    not behind a proxy server.


    *Digest Authentication* is a new process for ensuring secure transmission of the
    information between the client and server. It functions in much the way as Basic
    Authentication, but the authentication credentials are passed through a one-way
    process called hashing. The result is a message digest (a hash) that masks the
    original text of the message. The server sends additional information with the
    password so that if it were intercepted it could not be used. Perhaps the biggest
    benefit, however, is that Digest Authentication is part of HTTP 1.1 and can be
    transmitted seamlessly across proxy servers.


