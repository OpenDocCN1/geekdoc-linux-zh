  md: '# Chapter 4


    | Resources | Description |

    | --- | --- |

    | Direct memory access (DMA) | DMAs are channels that allow the hardware device
    to access memory directly. This allows a device such as a disk drive or floppy
    drive to write information into memory without interrupting the processor. Windows
