  md: '# Introduction


    You''ve probably heard the saying "The more things change, the more they stay
    the same" a hundred times—maybe even more. This statement couldn''t be more true
    than when it comes to managing your computer''s hard drives. Windows 2000 is light
    years ahead of its predecessors, Windows 9x and Windows NT, but you will still
    find yourself needing to effectively manage and monitor your hard drives.


    Windows 2000 provides an extremely useful GUI for performing the majority of management
    tasks on your computer''s hard drives and volumes: the Disk Management utility.
    Disk Management can be accessed in several ways, the easiest of which is via the
    Computer Management console (Start, Programs, Administrative Tools, Computer Management),
    as shown in Figure 6.1.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_215_0.png)


    **Figure 6.1** The Disk Management utility—storage management console.


    The Disk Management utility provides the following information to you at a glance:


    +   - Volumes installed and recognized by the computer

    - The file system in use, such as FAT32 or NTFS

    - The type of disk, such as basic or dynamic

    - The health status of each volume

    - The status of each volume, such as system partition, and so on

    - The total size and free space on each volume'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Managing, Configuring, and Troubleshooting Storage Use 183


    Although the Disk Management utility provides many of the tools you''ll need,
    you should also master usage of the Disk Defragmenter tool (also located in the
    Computer Management console) and the Properties page for each of your computer''s
    volumes. Together, these three management tools provide you with a wealth of capability
    and control that have been previously unavailable so easily out of the box.


    # Monitoring and Configuring Disks and Volumes


    The bulk of your hard disk and volume management tasks will be performed with
    the Disk Management utility, as shown in Figure 6.1. From here, you can perform
    the following tasks:


    +   - Determine disk and volume information, such as size, file system, and other
    pertinent information

    - Determine disk health status

    - Upgrade basic storage to dynamic storage

    - Create new partitions and volumes

    - Format partitions and volumes

    - Delete partitions and volumes

    - Extend the size of dynamic volumes

    - Assign and change drive letters or paths to hard drives and removable storage
    drives

    - Add new physical disks


    Although you will most commonly access the Disk Management utility from the Computer
    Management console, you can access Disk Management in any one of the three ways,
    depending on your preferences:


    +   - On the command line, enter `diskmgmt.msc`.

    - On the command line, enter `MMC`. In the empty console, add the Disk Management
    snap-in. This can be useful for creating powerful, customized MMC consoles for
    a variety of management tasks.

    - From within the Computer Management console, click Disk Management.'
  merge: -1
  pgno: 216
