    # # Local Accounts


    Every member server and all workstations will have their own *local accounts*.
    Unlike domain accounts, in which every domain controller contains a shared database
    of all users, groups, and resources in the domain, these accounts exist only on
    the computer where they were created. Also, these accounts can be used only to
    grant access to resources on the computer on which the local accounts reside.


    Local users and groups are created in the local security database. Local accounts
    cannot be used to access any resources other than those on the local computer
    because other computers cannot see the local Active Directory security database
    in order to authenticate the users and group in the data-base.


    > NOTE There is rarely, if ever, a reason to create a local user or group on a
    computer that is a member of a domain.


    # ## The Local Administrator and Guest Accounts


    By default, Windows 2000 Server creates two local user accounts, *Administrator*
    and *Guest*. The Administrator account has the following proper-:


    +   - Can be renamed

    "- Cannot be deleted"'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Chapter 8


    +   > Cannot be locked out

    > Cannot be disabled

    > Has access and control of all resources on the computer


    The Administrator account is used when Windows 2000 Server is installed. This
    account cannot be deleted or disabled, to ensure that you never lock yourself
    out of your server. This is the only account that cannot be deleted or disabled.


    The Guest account is disabled by default, and has the following properties:


    +   > Can be renamed

    > Cannot be deleted

    > Can be disabled

    > Can be locked out

    > Does not save any user configuration settings between logons


    The Guest account is just what the name implies, an account that has limited privileges,
    and is only to be used temporarily by a user who won''t be around long.


    # Local Groups


    In addition, there are several default local groups created when Windows 2000
    Server is installed:


    +   > Administrators—The members of this group can access and control all resources
    on the computer. The local Administrator account is a member of this group. When
    a Windows 2000 server joins a domain, the Domain Admin group (a default group
    that contains all administrators in the domain) is made a member of this group.
    This is so that all members of the Domain Admins group will have administrative
    control of this computer. Although the Administrator account cannot be locked
    out or disabled, other members of this group can be.

    > Backup Operators—The members of this group can back up and restore files and
    folders, even if they don''t have any access permissions for the files. In addition
    they can log on to the server and shut it down. However, the members of the Backup
    Operators group cannot change security settings on any objects that they don''t
    own.'
  merge: -1
  pgno: 301
- img_proc: true
  md: '# Implementing, Monitoring, and Troubleshooting Security


    +   Guests—The members of the group have limited access to resources on the server,
    but can log on and shut it down. The Guest account is a member of this group.
    When a Windows 2000 server joins a domain, the Domain Guests (a default group
    that contains all guests in the domain) group is made a member of this group.


    +   Power Users—The members of this group can create, modify, and delete resources
    such as file shares and user group accounts. However, they have complete control
    only over those objects that they have created. They can remove users from the
    Power Users, Users, and Guests groups. They cannot modify the Administrators or
    Backup Operators groups, take ownership of files, perform backups or restore,
    or unload device drivers, Power Users can run all Windows 2000 applications, as
    well as install and run most legacy applications that cannot be installed or run
    by members of the Users group. The Windows 2000 Power Users group has privileges
    roughly equivalent to that of the Users group in Windows NT 4.0.


    +   Replicator—The group is used to support file replication services in a domain.
    Do not add users to this group.


    +   Users—The members of the group can perform the normal user tasks such as running
    most Windows 2000 applications, using printers, and creating local groups. However,
    they cannot create local printers or share folders. Some legacy applications cannot
    be run by members of the users group, because the Windows 2000 Users group has
    fewer privileges than members of the Windows NT 4.0 Users group. By default, all
    local accounts created are added to the Users group. When a Windows 2000 server
    joins a domain, the Domain Users (a default group containing all authenticated
    users in the domain) group is made a member of this group.


    Local groups can be used only to assign permissions to resources residing on the
    server where the group is created. Like local user accounts, local groups are
    stored in the local security database. Local groups can contain local accounts
    from the same computer on which they are created, and a local group can''t be
    a member of any other group. If a server is a member of a domain, the local groups
    on that server can contain domain user accounts and groups.


    To create a new local group, perform the following steps:


    +   1. In the left pane of the Computer Management windows, click Local Users
    and Groups.'
