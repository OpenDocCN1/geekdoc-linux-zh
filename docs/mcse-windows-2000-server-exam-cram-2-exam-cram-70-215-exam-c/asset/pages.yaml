    # Licensing Options


    To know what choice to make in the Licensing Modes screen, you must first understand
    the available licensing modes. Per Server mode is a connection-based licensing
    model. In it, you purchase one license for every connection made to a specific
    server. If you have 1 server and'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# Chapter 2


    10 users could possibly connect to it at any time, you would purchase 10 CALs.
    If a single user makes a connection to two different servers at the same time,
    that user will be using a CAL on each of the servers at the same time. In other
    words, two licenses would be required for a single workstation. That scenario
    is where the Per Seat mode comes in. Per Seat licensing allows a user to make
    connections to all servers. Instead of monitoring the total number of connections,
    all that matters is the number of users making those connections. If you have
    5 servers and 25 users and each user could make a connection to each of the servers,
    you would only need 25 CALs with Per Seat licensing. Per Server licensing, you
    would need 125 licenses to provide the same licensed access.


    The rule on licensing is that if the number of connections made by your users
    is larger than the number of users you have, you should be looking at Per licensing.
    In addition, Per Server is an effective model for use in organizations or departments
    with only one server. In cases where the same group of users is connecting to
    more than one server, it is usually best to consider Per Seat licensing. A simple
    way to remember these licensing concepts is as follows: Per Server = Any Seat
    (client) to one server and Per Seat = Any Seat (client) to any server.


