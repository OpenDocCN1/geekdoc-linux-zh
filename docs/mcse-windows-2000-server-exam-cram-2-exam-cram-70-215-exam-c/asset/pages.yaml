  md: '# Upgrading Basic Storage to Dynamic Storage


    Should you want to take advantage of the capabilities offered by dynamic disks
    in Windows 2000, you must upgrade your basic disk to a dynamic disk. The upgrade
    is done on an entire physical disk, not just one particular partition. A dynamic
    disk is a hard disk that can only house dynamic volumes created through the Disk
    Management administrative tool. Dynamic disks do not include partitions or logical
    drives, and they cannot be accessed by DOS. A basic disk is a standard hard disk.


    The types of volumes offered to you as dynamic storage disks include the following:


    +   - Mirrored volumes—A mirrored volume is a fault tolerant configuration in
    which data is written to two hard disks, rather than one, so that if one disk
    fails then the data remains accessible. Mirrored volumes work only on a Windows
    2000 Server.


    +   - Simple volumes—Simple volumes are essentially the same as the basic partition;
    disk space is used only from one physical disk.


    +   - Spanned volumes—Spanned volumes can take disk space from two to thirty-two
    physical disks to create one large apparently contiguous volume. Spanned volumes
    offer you no fault tolerance, thus if one disk should fail the entire set is lost.
    The advantage of spanned volumes is that you can quickly add more storage to a
    spanned volume if it is running low.


    +   - Striped volumes—Striped volumes write data to multiple disks in 64KB sequential
    stripes, using two to thirty-two physical disks. The first stripe is written to
    the first disk, the second stripe is written to the second disk, and so forth.
    Striped volumes, also known as RAID-0, provide no fault tolerance. The advantage
    provided by striped volumes is in the overall disk I/O performance of the computer
    as the total I/O is split among all of the disks in the volume—striping writes
    to all disks so that data is added to all disks at the same rate.


    +   - RAID-5 volumes—RAID-5 volumes provide fault-tolerant data storage using
    two to thirty-two physical disks of the same size. The total volume capacity will
    be equal to that provided by the number of physical disks minus one. Data is written
    sequentially across each physical disk and contains both data and parity information.
    The parity information from the set is used to rebuild the set should one disk
    fail, providing fault tolerance. RAID-5 volumes in Windows 2000 cannot sustain
    the loss of more than one disk in the set while still providing fault tolerance.'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'Managing, Configuring, and Troubleshooting Storage Use 189


    Basic disks can be upgraded to dynamic disks at any time without data loss, provided
    that you meet all of the following requirements. You cannot revert a dynamic disk
    back to a basic disk without complete data loss on the volume.


    +   - Master Boot Record (MBR) disks must have at least 1MB of free space available
    at the end of the disk for the dynamic disk database to be created.


    +   - Dynamic storage cannot be used on removable media such as Zip disks.


    +   - Hard drives on portable computers cannot be converted to dynamic storage.
    Because most portable computers contain only one hard drive, there is no benefit
    to be realized by upgrading to a dynamic disk.


    +   - The sector size on the hard disk must be no larger than 512 bytes in order
    for the conversion to be able to take place. Use the fsutil fsinfo ntfinfo x:
    to determine the sector size, where x: is the volume in question.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_222_0.png)


    Dynamic disks can be used by only one operating system. If you plan multibooting
    your computer, do not upgrade your basic disks to dynamic disks.


    To upgrade a basic disk to a dynamic disk, follow these steps:


    +   1. In the lower pane of Disk Management, right-click the disk that you want
    to upgrade and select Upgrade to Dynamic Disk from the shortcut menu (see Figure
    6.2).


    +   2. Select the disk that you want to upgrade from the provided list and click
    OK.


    +   3. When the Disks to Upgrade dialog box appears, click Upgrade to continue.


    +   4. A warning dialog box opens, informing you that dynamic disks cannot be
    used by any previous version of Windows 2000. Click Yes to proceed.


    +   5. Another warning dialog box opens, notifying you that any file systems existing
    on the disk will be dismounted as part of the upgrade process. Click Yes to proceed—this
    is your last chance to abort the process.


    +   6. Click OK when the dialog box appears notifying you that a restart is required
    to complete the process. After the computer restarts, the disk upgrade will be
    complete.'
  merge: -1
