  md: '# Practice Questions


    # Question 1


    | In Windows 2000, which of the following types of disk configurations can you
    create on a Windows 2000 Professional computer? [Choose all that apply.] |

    | A. Mirrored volume |

    | B. RAID-5 array |

    | C. Spanned volume |

    | D. Primary partition |


    Answers A, C, and D are correct. On a Windows 2000 Professional computer, you
    can create primary, extended, and logical partitions on a basic disk. You can
    also create mirrored, spanned, striped, and simple volumes on a dynamic disk.
    Windows 2000 Professional does not support RAID-5 or fault-tolerant arrays, thus
    answer B is incorrect.


    # Question 2


    | Dawn configured a RAID-5 array on one of her Windows 2000 Servers that consists
    of seven 80GB SCSI hard disks. What amount of this space is required for use by
    the parity information? |

    | A. 60GB |

    | B. 80GB |

    | C. 120GB |

    | D. 132GB |


    Answer B is correct. RAID-5 arrays require all disks to have the same capacity.
    The parity information requires the capacity of one of the disks in the array,
    thus if Dawn uses seven 80GB disks to construct a RAID-5 array, she will have
    480GB available for storage and 80GB used for the parity information. Thus, answers
    A, C, and D are incorrect.'
  merge: -1
  pgno: 240
