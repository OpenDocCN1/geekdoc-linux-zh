    # Local Computer Policy


    There are two types of group policy available in a Windows 2000 environment: Local
    Computer Policy, which is applied to a single computer, and Domain Group Policy,
    which can be applied at the domain, site, or OU level. Every Windows 2000 computer
    has its own Local Computer Policy object, regardless of whether or not it''s a
    member of Active Directory domain.


    There are some limitations with Local Computer Policy objects. For example:


    +   - You can have only one Local Computer Policy object. All local users will
    receive the same settings.

    - Fewer settings are available.

    - Software installation is not available.

    - Folder redirection is not available.


    To access the Local Computer Policy object for a computer, key in gpedit.tsc in
    the Run dialog. This opens the Group Policy MMC, shown in Figure 8.8, showing
    the available configuration settings for the local object.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_311_0.png)


    **Figure 8.8** The Group Policy MMC, showing the Local Computer Policy object
    settings.'
  merge: -1
