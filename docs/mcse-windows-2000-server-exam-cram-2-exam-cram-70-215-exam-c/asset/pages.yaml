    - Run this program—This can be any program that can be run from a command line.
    For example, it might be a program that performs some type of system maintenance,
    such as compressing files.


    Alerts are often used to monitor systems in real-time. You can set an alert to
    notify you when a specific event occurs. Some of the conditions that you might
    want to configure an alert for low disk space, swap file usage, and task queues
    for network cards and CPUs. Any of these items can point to a current or potential
    system problem.


    # Optimizing System Resources


    Properly tuning and optimizing a server sometimes can appear to be more of an
    art than a science. In reality, this is an oversimplification because accurately
    measuring performance on a Windows system really requires a little'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'art and a little science. In the final analysis, however, the best tuning and
    optimizing has far more to do with attention to detail than with any other skill.


    Before you can optimize a server, you must understand its characteristics, including
    how it operates under a normal load, and what areas are stressed when the load
    increases. This has a lot to do with the application type and load of the server.
    For example, a Web server will react differently to a load condition than a server
    that is hosting Terminal Services.


    The first step in optimization should be to establish a baseline. To establish
    a baseline for a server, you should log performance data for the server when it
    is under a normal load for an established period of time. You will typically want
    to log usually at least a day, and sometimes even a week or month. This will allow
    you to observe the various components of your server under “normal” load and stress
    circumstances. You should have a large enough sample so that you can observe all
    of the highs and lows and determine what figures are averages for your server.


    After you establish this baseline, the next step is to observe your server under
    load, and identify any components that are limiting the overall performance of
    your server. As we mentioned earlier in this chapter, the four main components
    that cause the bottlenecks in a server are memory, disk, processor, and the network
    interface. The following four sections discuss optimizing resources associated
    with these vital server objects.


    # Optimizing Memory Usage


    The Windows 2000 memory system uses a combination of physical memory and a swap
    file on the hard disk to provide space for the applications to run. Because accessing
    data from a hard disk is many times slower than accessing it from memory, you
    want to minimize the frequency that the server has to swap data to the hard drive.
    This can usually be accomplished by adding more physical memory.


    Some counters to watch on memory performance are


    +   * Memory: Pages Input/sec—When this counter remains at a low value (2 or less),
    it indicates that all operations are occurring within physical RAM. This means
    that paging is not occurring and therefore is not the cause of the performance
    degradation.


    +   * Cache Faults/sec—Indicates how frequently the system is unable to locate
    data in the cache and must search for it on disk. If this number grows steadily
    over time, your system is headed into constant thrashing.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Managing, Monitoring, Optimizing System Performance, Reliability, and Availability
    157


    This means every bit of information required by the system must be retrieved directly
    from the disk. This condition usually indicates an insufficient amount of RAM
    on your system. However, it can also be caused by running a combination of apps—such
    as a read-intensive application, typically a database that is performing a large
    number of queries—at the same time as an application that is using an excessive
    amount of memory. In this case, you can schedule the applications to not run at
    the same time, or move one of them to another system.


    +   Memory: Page Faults/sec—Similar to cache faults, except that it also measures
    faults when a requested memory page is in use by another application. If this
    counter averages above 200 for low-end systems or above 600 for high-end systems,
    paging is occurring.


    +   Memory: Available Bytes—Indicates the amount of free memory available for
    use. If this number is less than 4MB, you do not have sufficient RAM on your system
    so the system performs excessive paging.


    +   Paging File: % Usage Peak—Indicates the level of paging usage. If this number
    nears 100% during normal operations, the maximum size of your paging file is too
    small, and you probably need more RAM. If you have multiple drives with multiple
    paging files, be sure to view the Total instance of this counter.


    # Optimizing the Disk Subsystem


    The disk subsystem can be a bottleneck, either directly or indirectly. If the
    access speed of the disk is slow, it will negatively affect the load time of applications
    and the read and write time of application data. In addition, because Windows
    2000 relies on virtual memory, a slow disk subsystem will indirectly affect memory
    performance.


    Some performance counters for the disk subsystem are


    +   PhysicalDisk: Avg. Disk Queue Length—Tracks the number of system requests
    waiting for disk access. The number of queued requests should not exceed the number
    of spindles in use. Most drives have only a single spindle, but RAID arrays have
    many (and Performance Monitor views RAID arrays as a single logical drive). A
    large number of items indicates that a drive or an array is not operating fast
    enough to support the system''s demands for input and output. When this occurs,
    you need a faster disk system.


    +   PhysicalDisk: % Disk Time—Represents the percentage of time that the disk
    is actively handling read and write requests. It is not uncommon for'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'this counter to regularly hit 100% on active servers. Sustained percentages
    of 90% or better, however, might indicate that a storage device is too slow. This
    usually is true when Avg. Disk Queue Length is constantly above 2.


    +   * PhysicalDisk: Avg. Disk sec/Transfer—Indicates the average time in seconds
    of a disk transfer.


    Because the very act of recording storage performance data affects system performance,
    the disk counters on Windows systems are not enabled by default. Before you can
    monitor hard drive performance, you must turn on the counters that gather statistics
    for such devices. By default, in Windows 2000 the PhysicalDisk object is automatically
    enabled. However, the LogicalDisk object must be enabled manually. From the Run
    dialog box or a command prompt, the following command enables the LogicalDisk
    counters:


    ```

    diskperf -y

    ```


    After the command is entered, the system must be restarted for the command to
    take effect.


    > When recording a log file for the Disk objects, don''t record the file to the
    same drive being measured. You are not recording accurate values because the act
    of reading the object and writing to the drive adds a significant amount of workload.


    # Optimizing Processor Usage


    The processor is the heart of your server. Most operations in the server are controlled
    directly or indirectly by the processor. Most processor bottlenecks are caused
    by multiple processes running at the same time, requiring more cycles than the
    processor can deliver efficiently. This can be alleviated by replacing the processor
    with a faster model or by adding an additional processor in a multiprocessor-capable
    server.


    To identify problems with the processor, monitor the following counters:


    +   * Processor: % Processor Time—Indicates the amount of time the CPU spends
    on non-idle work. It''s common for this counter to reach 100% during application
    launches or kernel-intensive operations (such as SAM synchronization). If this
    counter remains above 80% for an extended period, however, you should suspect
    a CPU bottleneck. (There will be an instance of this counter for each processor
    in a multiprocessor system.)'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'Managing, Monitoring, and Optimizing System Performance, Reliability, and Availability
    159


    +   * Processor: % Total Processor Time—Applies only to multiprocessor systems.
    This counter should be used the same way as the single CPU counter. If any value
    remains consistently higher than 80%, at least one of your CPUs is a bottleneck.


    +   * System: Processor Queue Length—Indicates the number of threads waiting for
    processor time. A sustained value of 2 or higher for this counter indicates processor
    congestion. This counter is a snapshot of the time of measurement, not an average
    value over time.


    # Optimizing Network Access


    Although not common as a bottleneck, thanks to the preponderance of high-performance
    100Mb NICs, there will still be those occasions on which the network card is a
    bottleneck. This is most likely to occur on Web servers or terminal servers.


    To identify performance problems with the network interface, monitor the following
    counters:


    +   * Network Interface: Bytes Total/sec—Indicates the rate at which data is sent
    to and received by a NIC (including framing characters). Compare this value with
    the expected capacity of the device. If the highest observed average is less than
    75% of the expected value, communication errors or slowdowns might be occurring
    that limit the NIC''s rated speed.


    +   * Network Interface: Current Bandwidth—Estimates a NIC''s current bandwidth,
    measured in bits per second (bps). This counter is useful for NICs with variable
    bandwidth.


    +   * Network Interface: Output Queue Length—Indicates the number of packets waiting
    to be transmitted by a NIC. If this averages above 2, you are experiencing delays.


    +   * Network Interface: Packets/sec—Indicates the number of packets handled by
    a NIC. Watch this counter over a long interval of constant or normal activity.
    Sharp declines that occur while the Queue Length remains nonzero can indicate
    protocol-related or NIC-related problems.


    Other network related counters that may be worth monitoring include protocol-specific
    objects, such as ICMP, IP, TCP, and UDP.'
  merge: -1
