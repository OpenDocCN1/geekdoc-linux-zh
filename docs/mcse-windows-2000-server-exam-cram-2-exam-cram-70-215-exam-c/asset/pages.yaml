  md: 'Installing Windows 2000 Server 49


    Although you can use winnt.exe winnt32.exe to initiate an attended installation,
    the true power of these programs lies in the fact that their behavior can be modified
    using various command-line switches as part of their execution syntax. Table 2.2
    provides a brief explanation of the switches available for both winnt.exe and
    winnt32.exe.


    Table 2.2 Switches for WINNT and WINNT32

    | WINNT | WINNT32 | Function |

    |---|---|--|

    | /a | N/A | Enables accessibility options. |

    | /e:command | /cmd:command | Executes a command before the final phase of Setup.
    |

    | /i:inf_file | N/A | Specifies the name of the setup information file. |

    | /r:folder | /copdir:folder | Specifies an optional folder to be installed in
    the system root directory. |

    | /rx:folder | /copource:folder | Specifies an optional folder to be copied, used
    for installations, and deleted when the installation is done. |

    | /s:path | /s:path | Specifies the location of the installation files for Windows
    2000 Server. You can specify up to eight sources to speed up (and load balance)
    the file copy process. The first source must be valid or the installation will
    fail. |

    | /t:drive | /tempdrive:drive | Specifies the location that the temporary installation
    files can be copied to and the location where Windows 2000 will be installed (this
    becomes the Boot partition). |

    | /u:file | /unattend:[num]:[file] | Specifies the location of the answer file
    for unattended installations and the number of seconds to wait between copying
    the files and restarting the computer. |

    | /udt:file | /udf:id,file | Specifies the location of the uniqueness database
    for unattended installations. ID is the identifier within the UDF that defines
    the installation options for this computer. |

    | N/A | /cmdcons | Specifies files required for command-line repair console will
    be installed. |

    | N/A | /debug level:file | Creates a log file when conditions of certain severity
    occur during installation. The default level is 2 (warning). |


    (continued)'
  merge: -1
