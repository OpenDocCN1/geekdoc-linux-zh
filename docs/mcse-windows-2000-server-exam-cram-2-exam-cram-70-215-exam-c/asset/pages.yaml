- img_proc: true
  md: '# Introduction


    Welcome to the Exam Cram 2 series. The purpose of this book is to prepare you
    to take Microsoft certification exam 70-215, “Installing, Configuring, and Administering
    Windows 2002 Server."


    Books in the Exam Cram 2 series are designed to help you understand the material
    you will encounter on the exam. Their purpose is to cover the topics you are likely
    to encounter on the exam, but they do not teach you everything you need to know
    about a topic. The book contains as much information as possible about the exam.


    The book begins by providing useful information about how to prepare for the exam
    and what to expect on your test day. To begin, we recommend that you take the
    self-assessment included in the book. This will help you to evaluate your current
    knowledge base what is required for an MCSE candidate. This will help you determine
    where your training should begin, which may be some classroom training or reading
    one of the several study guides available.


    It is also strongly recommended that you gain some hands-on experience with the
    technologies being covered on the exam. Again, this may be through some classroom
    training or by installing and configuring the software on a home system. In any
    case, nothing beats hands-on experience when it comes to learning essential exam
    topics.


    Once you pass 70-215, you receive the status of Microsoft Certified Professional
    and demonstrate your efficiency and knowledge on the exam topics. Passing this
    exam can also earn you credit toward the following certifications:


    +   * Microsoft Certified Systems Engineer—This is one of the core exams required
    to obtain MCSE status.


    +   * Microsoft Certified Database Administrator—This exam can be used as one
    of the electives for the MCDBA certification.


    +   * Microsoft Certified Systems Administrator—This exam can be used as one of
    the electives required to achieve MCSA status.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Taking a Certification Exam


    This section gives information on exam pricing and registration processes.

    Once you''ve fully prepared for an exam and feel that you ready for the next step,
    you''ll need to register with a testing center to take the exam. To do so, contact
    either Prometric or Virtual University Enterprise using the following-information:


    +   * Prometric—You can register for an exam online at www.prometric.com. You
    can also register by phone at 1-800-775-3926 (within the United States and Canada).
    If outside these two countries, call 1-410-843-8000.


    +   * Virtual University Enterprise (VUE)—You can register online at www.vue.com
    or call a local testing center. You can find local testing centers from the Web
    site.


    You can register for an exam by contacting either of the parties previously listed.
    You must register at least one day in advance and any cancellations must be made
    by 7 a.m. the day before you are scheduled to take the test.


    To make the registration process go smoother, make sure you have the following
    information handy, because you will be required to provide it during the registration
    process:


    +   * Your name, organization, and mailing address.


    +   * Microsoft Test I.D. In the United States, this will be your Social Security
    number. For those in Canada, this will be your Social Insurance number.


    +   * The specific number of the exam you want to take.


    +   * A method of payment. Credit card is usually the easiest method, although
    other arrangements can be made.


    At this point, you will be given the date, time, and location of where you are
    to take the exam.


    # Arriving at the Exam Site


    It is generally a good idea to arrive at the exam site at least 15 minutes before
    you are scheduled to take the test. Make sure you bring two pieces of identification
    with you, one of which must be a photo I.D., such as a driver''s license. You
    must show the identification when you sign in.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# In the Exam Room


    Granted, you cannot mimic the pressures and environment of actually being in the
    exam room with a live exam in front of you, but this section does to detail what
    being in the room is is like.


    After you''ve signed in for the exam, you''ll be directed into a testing room.
    You will not be permitted to take anything into the testing room with you. You
    will be given a few blank pieces of paper and pen upon entering the room. This
    is where the facts on the cram sheet can be very handy. If you read over the distilled
    facts prior to the exam, this is a good time to write down as many of them as
    you can remember.


    Once you complete the exam, your score will be tabulated and you will know immediately
    whether you passed or failed. If you need to retake the exam, you will have to
    contact VUE or Prometric to schedule a new test (and unfortunately this also means
    paying the price of another exam).


    If you fail an exam, you can retake the test as soon as you are ready. If you
    fail the same exam a second time, you must wait at least 14 days before you will
    be allowed to reschedule.


    # How to Prepare for an Exam


    All Microsoft exams have a set of objectives outlining the topics you need to
    understand in order to achieve exam success. This is a good place to start to
    give yourself a general idea of the topics you can expect to encounter and which
    ones you need to obtain study material for.


    There is an abundance of resources available both online and in print that can
    be used to prepare for an exam. Microsoft''s Web site is a good source of information
    pertaining to both the exam itself and in-depth coverage of exam topics. Due to
    the popularity of the MCSE certification, there are also a number of printed study
    guides and online resources. Some of the resources you may find include


    +   The Windows 2000 product CD—One of the best resources you can use when preparing
    for an exam is the Help included with the operating system. It usually covers
    different aspects of all the technologies included with the operating system.


    +   The Microsoft Training and Certification Web site—The Web site at http://www.microsoft.com/traincert/default.asp
    provides links to exam resources and outlines how an individual should prepare
    for an exam.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'The InformIT Web site—The Web site http://www.informit.com/exam2/index.asp
    provides an abundance of information about certification exams and how to prepare
    for them.


    Microsoft Training Kits—Microsoft Press publishes study guides for the different
    certification exams, including exam 70-215. You can find more information about
    the training kit at http://www.mspress.microsoft.com/findbook/list/series_ak.htm.


    Microsoft TechNet—This monthly publication provides information on the latest
    technologies and topics, some of which pertain to the exam topics covered in 70-215.


    Classroom Training—For those who can afford the price of classroom training, many
    companies offer courses designed at preparing students to pass the exam.


    The Exam Cram 2 Series—The Exam Crams have always been a popular resource for
    exam preparation.


    # Notes on This Book’s Organization


    This section highlights all the different elements and pieces that will be found
    in your Exam Cram 2. Items such as exam alerts, tips, notes, practice questions,
    and so on will be explained here:


    +   You’ll Need to Know—Each chapter begins with a list of terms that you must
    learn and understand in order to fully grasp the content covered; each of these
    terms is defined in the Glossary.


    +   Techniques You Need to Master—Following the important terms is a list of concepts/tools/techniques
    that need to be understood before attempting to take the exam.


    +   Chapter Content—The introductory paragraph will alert you to the topics that
    will be covered throughout the chapter. Following this number of topics relating
    to the chapter title will be covered in detail.


    +   Exam Alerts—Concepts and topics that are likely to appear on the exam are
    highlighted in a special layout known as an Exam Alert. An Exam Alert appears
    within the chapter content like this:'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Exam Alerts are included in each chapter to point your attention to a particular
    concept or topic that you are more likely to encounter on the exam. As you are
    working through the chapter, make sure you pay close attention to the topics addressed
    in the alerts. Exam Alerts can also be a good way of refreshing yourself with
    important information right before the exam, although the information is usually
    included in the Cram Sheet.


    This is not to say that the general content within a chapter is not important.
    The Exam Alerts are there to flag the information that is more certain to appear
    in any scenario format.


    +   Tips and Notes—Throughout a chapter you may also find side tips and notes.
    The layout and purpose of each is as follows:


    Tips are designed to give the reader some added piece of information pertaining
    to a topic being covered, such as an alternative or more efficient way of performing
    a certain task.


    Notes are designed to alert you to a piece of information related to the topic
    discussed.


    +   Practice Questions and Answers—The end of each chapter has a series of 10
    questions designed to test your understanding of the topics covered throughout
    the chapter. Detailed explanations are provided for each of the 10 questions explaining
    both the correct and incorrect answers.


    +   Need to Know More—Each chapter ends with a listing of additional resources
    offering more details about the chapter topics.


    Other elements of the book worth mentioning are the Sample Tests and Answer Keys
    found in Chapters 9 through 12. These questions cover all of the topics covered
    throughout the book. The questions can be used for review purposes and to determine
    exam readiness.


    In addition to this, you''ll also find a glossary of key terms used throughout
    the book and the appendixices listing additional resources that you may find valuable.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'Last but not least, mention must be made about the Cram Sheet included with
    the book. The Cram Sheet distills all the important facts and topics covered and
    summarizes them in a few short pages. These are the facts that we feel should
    be memorized before the test. The Cram Sheet is the last thing that you should
    review before going into the test. And once you enter the test room, the first
    thing you should do is transfer all the facts to paper.


    # How This Book Helps You


    The topics in this book have been structured around the objectives outlined by
    Microsoft Exam 70-215. This ensures that you are familiar with the topics that
    you''ll encounter on the exam.


    Some of the topics covered in earlier chapters may require an understanding of
    topics in later chapters. Therefore, it''s recommended that you read the book
    from start to finish for your initial reading. When it comes time to brush up
    or reviewing certain topics, you can always use the index to go directly to specific
    sections while omitting others.


    In preparing for Exam 70-215, we think you''ll find this book a very useful reference
    to some of the most important topics and concepts of network infrastructure. It
    prepares you for the test day by outlining what you can expect. It covers all
    the important topics you can expect to find on the exam. Also, it provides many
    sample test questions to help you evaluate exam readiness and understanding of
    the material as well as familiarize you with the Microsoft testing format.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Self-Assessment


    Based on recent statistics from Microsoft, as many as 400,000 individuals are
    at some stage of the certification process but haven''t yet received an MCP or
    other Microsoft certification. We also know that three or four times number may
    be considering whether or not to obtain a Microsoft certification of some kind.
    That''s a huge audience!


    The reason we included a self-assessment in this Exam Cram 2 book is to help you
    evaluate your readiness to tackle MCSE certification. It should also help you
    understand what you need to know to master the topic of this book—namely, Exam
    70-215, “Installing, Configuring, and Administering Windows 2000 Server.” Before
    you tackle this self-assessment, let''s talk about concerns you may face when
    pursuing an MCSE, and what an ideal MCSE candidate might look like.


    # MCSEs in the Real World


    In the next section, we describe an ideal MCSE candidate, knowing full well that
    only a few real candidates will meet this ideal. In fact, our description of that
    ideal candidate might seem downright scary. But take heart: Although the requirements
    to obtain an MCSE may seem formidable, they are by means impossible to meet. However,
    be keenly aware that it does take time, involves some expense, and requires real
    effort to get through the process.


    More than 200,000 MCSEs are already certified, so it''s obviously an attainable
    goal. You can get all the real-world motivation you need from knowing that others
    have gone before, you will be able to follow in their footsteps. If you''re willing
    to tackle the process seriously and do what it takes to obtain the necessary experience
    and knowledge, you can take—and pass—all the certification tests involved in obtaining
    an MCSE. In fact, we''ve designed the Exam Cram 2 series to make it as easy on
    you as possible to prepare for these exams. But prepare you must!'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'The same of, course, is true for other Microsoft certifications, including


    +   - MCSD, which is aimed at software developers and requires one specific exam,
    two more exams on cloud and distributed topics, plus a fourth exam drawn from
    a different, but limited, pool of options.


    +   - Other Microsoft certifications, whose requirements range from one test (MCP)
    to several tests (MCP+SB, MCDBA).


    # The Ideal MCSE Candidate


    Just to give you some idea of what an ideal MCSE candidate is like, here are some
    relevant statistics about the background and experience such an individual might
    have. Don''t worry if you don''t meet these qualifications, or don''t come that
    close—this is far from ideal world, and where you fall short is simply where you
    have more work to do.


    +   - Academic or professional training in network theory, concepts, and operations.
    This includes everything from networking media and transmission techniques through
    network operating systems, services, and applications.


    +   - Three-plus years of professional networking experience, including experience
    with Ethernet, token ring, modems, and other networking media. This must include
    installation, configuration, upgrade, and troubleshooting experience.


    +   - Two-plus years in a networked environment that includes hands-on experience
    with Windows 2000 Server, Windows 2000 Professional, Windows NT Server, Windows
    NT Workstation, and Windows 95 or Windows 98. A solid understanding of each system''s
    architecture, installation, configuration, maintenance, and troubleshooting is
    also essential.


    +   - Knowledge of the various methods for installing Windows 2000, including
    manual and unattended installations.


    +   - A thorough understanding of key networking protocols, addressing, and name
    TCP/IP, IPX/SPX, and NetBEUI.


    +   - A thorough understanding of NetBIOS naming, browsing, and file and print
    services.


    +   - Familiarity with key Windows 2000–based TCP/IP-based services, including
    HTTP (Web servers), DHCP, WINS, and DNS, plus familiarity with one or more of
    the following: Internet Information Server (IIS), Index Server, and Proxy Server.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '+   An understanding of how to implement security for key network data in a
    Windows 2000 environment.


    +   Working knowledge of NetWare 3.x and 4.x, including IPX/SPX frame formats;
    NetWare file, print, and directory services; and both Novell and Microsoft client
    software. Working knowledge of Microsoft''s Client Service For NetWare (CSNW),
    Gateway Service For NetWare (GSNW), the NetWare Migration Tool (NWCONV), and the
    NetWare Client For Windows (NT, 95, and 98) is essential.


    Fundamentally, this boils down to a bachelor''s degree in computer science, plus
    three years'' experience working in a position involving network design, installation,
    configuration, and maintenance. We believe that well under half of all certification
    candidates meet these requirements, and that, in fact, meet less than half of
    these requirements—at least, when they begin the certification process. But because
    200,000 people who already have been certified have survived this ordeal, you
    can survive it—especially if you heed what our self-assessment can tell you about
    what you already know and what you need to learn.


    # Put Yourself to the Test


    The following series of questions and observations is designed to help you figure
    out how much work you must do to pursue Microsoft certification and what kinds
    of resources you may consult on your quest. Absolutely honest in your answers,
    or you''ll end wasting money on exams you''re not yet ready to take. There are
    no right or wrong answers, only steps along the path to certification. Only you
    can decide where you really belong in the broad spectrum of aspiring candidates.


    Two things should be clear from the outset, however:


    +   A modest background in computer science will be helpful.


    +   Hands-on experience with Microsoft products and technologies is an essential
    ingredient to certification success.


    # Educational Background


    +   1. Have you ever taken any computer-related classes? [Yes or No]


    +   If Yes, proceed to question 2; if No, proceed to question 4.


    +   2. Have you taken any classes on computer operating systems? [Yes or No]'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'If Yes, you will probably be able to handle Microsoft''s architecture and system
    component discussions. If you''re rusty, brush up on basic operating system concepts,
    especially virtual memory, multitasking regimes, user mode versus kernel mode
    operation, and general computer security topics.


    If No, consider some basic reading in this area. We strongly recommend a good
    general operating systems book, such as Operating System Concepts, 5th Edition,
    by Abraham Silberschutz and Peter Baer Galvin (John Wiley & Sons, 1998, ISBN 0-471-36414-2).
    If this title doesn''t appeal to you, check out reviews for other, similar titles
    at your favorite online bookstore.


    +   3. Have you taken any networking concepts or technologies classes? [Yes or
    No]


    If Yes, you will probably be able to handle Microsoft''s networking terminology,
    concepts, and technologies (brace yourself for frequent departures from normal
    usage). If you''re rusty, brush up on basic networking concepts and terminology,
    especially networking media, transmission types, the OSI Reference Model, and
    networking technologies such as Ethernet, token ring, FDDI, and WAN links.


    If No, you might want to read one or two books in this topic area. The two best
    books that we know of are Computer Networks, 3rd Edition, by Andrew S. Tanenbaum
    (Prentice-Hall, 1996, ISBN 0-13-34995-6) and Computer Networks and Interns, 2nd
    Edition, by Douglas E. Comer (Prentice-Hall, 1998, ISBN 0-130-83617-6).


    Skip to the next section, “Hands-On Experience.”


    +   4. Have you done any reading on operating systems or networks? [Yes or No]


    If Yes, review the requirements stated in the first paragraphs after questions
    2 and 3. If you meet those requirements, move on to the next section. If No, consult
    the recommended reading for both topics. A strong background will help you prepare
    for the Microsoft exams better than just about anything else.


    # Hands-On Experience


    The most important key to success on all of the Microsoft tests is hands-on experience,
    especially with Windows 2000 Server and Professional, plus the many add-on services
    and BackOffice components around which many of'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'the Microsoft certification exams revolve. If we leave you with only one real-
    ization after taking this Self-Assessment, it should be that there''s no substi
    ute for time spent installing, configuring, and using the various Microsoft products
    upon which you''ll be tested repeatedly and in depth.


    +   5. Have you installed, configured, and worked with:


    +   * Windows 2000 Server? [Yes or No]


    If Yes, make sure you understand basic concepts as covered in Exam 70-215. You
    should also study the TCP/IP interfaces, utilities, and services for Exam 70-216,
    plus implementing security features for Exam 70-220.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_30_0.png)


    You can download objectives, practice exams, and other data about Microsoft exams
    from the Training and Certification page at www.microsoft.com/traincert/. Use
    the "Find an Exam" to obtain specific exam info.


    If you haven''t worked with Windows 2000 Server, TCP/IP, and IIS (or whatever
    product you choose for your final exam), you must obtain one or two machines and
    a copy of Windows 2000 Server. Then, learn the operating system, and do the same
    for TCP/IP and whatever other software components on which you''ll be tested.


    In fact, we recommend that you obtain two computers, each with a network interface,
    and set up a two-node network on which to practice. With decent Windows 2000-capable
    computers selling for about $500 to $600 apiece these days, this shouldn''t be
    too much of a financial hardship. You may have to scrounge to come up with the
    necessary software, but if you scour the Microsoft Web site you can usually find
    low-cost options to obtain evaluation copies of most of the software that you''ll
    need.


    +   * Windows 2000 Professional? [Yes or No]


    If Yes, make sure you understand the concepts covered in Exam 70-210.


    If No, you will want to obtain a copy of Windows 2000 Professional and learn how
    to install, configure, and maintain it. You can use MCSE Windows 2000 Professional
    Exam Cram 2 to guide your activities and studies, or work straight from Microsoft''s
    test objectives if you prefer.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# xxviii Self-Assessment


    > For any and all of these Microsoft exams, the Resource Kits for the topics involved
    are a good study resource. You can purchase softcover Resource Kits from Microsoft
    Press (search for them at mspress.microsoft.com/), but they also appear on the
    TechNet CDs (www.microsoft.com/technet). We believe that Resource Kits are among
    the best preparation tools, along with the Exam Crams and Exam Preps, that you
    can use to get ready for Microsoft exams.


    6. If you have installed, configured, used, and upgraded any specific Microsoft
    product that is not itself an operating system (for example, FrontPage 2000, SQL
    Server, and so on)? [Yes or No]


    If the answer is Yes, skip to the next section. If it''s No, you must get some
    experience. Read on for suggestions on how to do this.


    Experience is a must with any Microsoft product exam, be it something as simple
    as FrontPage 2000 or as challenging as Exchange Server 5.5 or SQL Server 7.0.
    For trial copies of other software, search Microsoft''s Web site using the name
    of the product as your search term. Also, search for bundles like “BackOffice”
    or “Small Business Server.”


    > If you have the funds, or your employer will pay your way, consider taking a
    class at a Certified Training and Education Center (CTEC) or at an Authorized
    Academic Training Partner (AATP). In addition to classroom exposure to the topic
    of your choice, you get a copy of the software that is the focus of your course,
    along with a trial version of whatever operating system it needs (usually, NT
    Server), with the training materials for that class.


    Before you even think about taking any Microsoft exam, make sure you''ve spent
    enough time with the related software to understand how it may be installed and
    configured, how to maintain such an installation, and how to troubleshoot that
    software when things go wrong. This will help you in the exam, and in real life!


    # Testing Your Exam-Readiness


    Whether you attend a formal class on a specific topic to get ready for an exam
    or use written materials to study on your own, some preparation for the Microsoft
    certification exams is essential. At $100 a try, pass or fail, you want to do
    everything you can to pass on your first try. That''s where studying comes in.


    We have included two practice exams in this book, so if you don''t score that
    well on the first test, you can study more and then tackle the second test. If'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'you still don''t hit a score of at least 70 percent after these tests, you''ll
    want to investigate the other practice test we mention in this section.


    For any given subject, consider taking a class if you''ve tackled self-study materials,
    taken the test, and failed anyway. The opportunity to interact with an instructor
    and fellow students can make all the difference in the world, if you can afford
    that privilege. For information about Microsoft classes, visit the Training and
    Certification page at www.microsoft.com/train_cert/ (use the “Find a Course” link).


    If you can''t afford to take a class, visit the Training and Certification page
    anyway, because it also includes pointers to free practice exams and to Microsoft
    Certified Professional Approved Study Guides and other self-study tools. And even
    if you can''t afford to spend much at all, you should still invest in some low-cost
    practice exams from commercial vendors.


    +   7. Have you taken a practice exam on your chosen subject? [Yes or No]

    If Yes, and you scored 70 percent or better, you''re probably ready to tackle
    the real thing. If your score isn''t above that threshold, keep at it until you
    break that barrier.

    If No, obtain all the free and low-budget practice tests you can find (see the
    list above) and get to work. Keep at it until you can break the passing threshold
    comfortably.


    > When it comes to assessing your test readiness, there is no better way to take
    a good-quality practice exam and pass with a score of 70 percent or better. When
    we''re preparing ourselves, we shoot for 80-plus percent, just to leave room for
    the “weirdness factor” that sometimes shows up on Microsoft exams.


    # Assessing Readiness for Exam 70-215


    In addition to the general exam-readiness information in the previous section,
    there are several things you can do to prepare for the Installing, Configuring,
    and Administering Microsoft Windows 2000 Server exam. As you''re getting ready
    for Exam 70-215, visit the MCSE mailing list. Sign up at www.sunbelt-software.com
    (look for the “Subscribe to” button).


    Microsoft exam mavens also recommend checking the Microsoft Knowledge Base (available
    on its own CD as part of the TechNet collection, or on the'
  merge: -1
  pgno: 32
- img_proc: true
  md: 'Microsoft Web site at support.microsoft.com/support/) for “meaningful technical
    support issues” that relate to your exam''s topics. Although we''re not sure exactly
    the quoted phrase means, we have also noticed some overlap between technical support
    questions on particular products and troubleshooting questions on the exams for
    those products.


    # Onward, Through the Fog!


    Once you''ve assessed your readiness, undertaken the right background studies,
    obtained the hands-on experience that will help you understand the products and
    technologies at work, and reviewed the many sources of information to help you
    prepare for a test, will your scores come back positive enough to get you through
    the exam tests, you''re ready to go after the real thing. If you follow our assessment
    regime, you''ll not only know what you need to study, but when you''re ready to
    make a test date at Sylvan or VUE. Good luck!'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Microsoft Certification Exams


    Terms you''ll need to understand:


    +   - Case study

    - Multiple-choice question formats

    - Build-list-and-reorder question format

    - Create-a-tree question format

    - Drag-and-connect question format

    - Select-and-place question format

    - Fixed-length tests

    - Simulations

    - Adaptive tests

    - Short-form tests


    Techniques you''ll need to master:


    +   - Assessing your exam-readiness

    - Answering Microsoft''s varying question types

    - Altering your test strategy depending on the exam format

    - Practicing (to make perfect)

    - Making the best use of the testing software

    - Budgeting your time

    - Guessing (as a last resort)'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Introduction


    Exam-taking is not something that most people anticipate eagerly, no matter how
    well prepared they may be. In most cases, familiarity helps offset test anxiety.
    In plain English, this means you probably won''t be as nervous when you take your
    fourth or fifth Microsoft certification exam as you will you take your first one.


    Whether it''s your first exam or tenth, understanding the details of the new exam
    (how much time to spend on questions, the environment you''ll be in, and so on)
    and the new exam software will help you concentrate on the material rather than
    the setting. Likewise, mastering a few basic exam-taking skills should help you
    recognize (and perhaps even outfox) some of the tricks and snares you''re bound
    to find in some exam questions.


    This chapter explains the exam environment and software and describes some proven
    exam-taking strategies that you can use to your advantage.


    # Assessing Exam-Readiness


    We strongly recommend that you read through and take the Self-Assessment included
    with this book (it appears just before this chapter). This will help you compare
    your knowledge to the requirements for obtaining an MCSE or MCSA, and it will
    also help you identify parts of your background or experience that may need improvement,
    enhancement, or further learning. If you get the right set of basics under your
    belt, obtaining Microsoft certification will be that much easier.


    After you''ve gone through the Self-Assessment, you can remedy those topical areas
    in which your background or experience may be lacking. You can also tackle subject
    matter for individual tests at the same time, so you can continue making progress
    while you''re catching up in some areas.


    After you''ve worked through an Exam Cram 2, have read the supplementary materials,
    and you''ll have a pretty clear idea of when you should be ready to take the real
    exam. Although we strongly recommend that you keep practicing until your scores
    touch the 75 percent mark, 80 percent is a better goal because it gives some margin
    for error when you are in an actual, stressful exam situation. Keep taking practice
    tests and studying the materials until you attain that score. You''ll find more
    pointers on how to study and prepare in the Self-Assessment. But now on, to the
    exam'
