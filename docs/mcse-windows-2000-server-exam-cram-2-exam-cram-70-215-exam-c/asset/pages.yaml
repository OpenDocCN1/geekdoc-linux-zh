  md: '# Chapter 4


    In catalog file signing, a CAT file is created for each driver or operating system
    file is being signed. The CAT file includes a hash of the binary file. A hash
    is the result of a mathematical operation on some data (in this case, the binary
    file) that is sensitive to any changes made in the source data. Any change to
    the binary file can be detected because the hash procedure produces a different
    value. Other information, such as filename and version number, is also added to
    the file. A certificate from the publisher, along with a Microsoft digital signature,
    is included in the catalog file to complete the signing process. The relationship
    between the catalog file and the driver binary is contained in the information
    file (.inf)-maintained by the system after the driver is installed.


    The options available for configuring how to handle unsigned drivers include the
    following:


    +   **Ignore**—Directs the system to proceed with the installation even if it
    includes unsigned files. You have no protection from poorly written drivers when
    the Ignore option is selected. As a result, it is not recommended that you configure
    driver signing with the Ignore option due to the threat of viruses, Trojan horses,
    and so on.


    +   **Warn**—Notifies the user that files are not digitally signed and allows
    the user to decide whether to stop or proceed with the installation and whether
    to permit unsigned files to be installed. Driver signing is set to Warn by default;
    however, it is not recommended to keep this setting in a production environment.


    +   **Block**—Directs the system to refuse to install unsigned files. As a result,
    the installation stops, and none of the files in the driver package are installed.
    This is the recommended setting for a production environment, and it guarantees
    the highest level of protection for client machines against poorly written driver
    devices.


    > Be sure you know the three driver signing behaviors. This is an important feature
    of Windows 2000 that you can expect to be tested on.


    As previously mentioned, you can configure driver signing from one of two locations
    depending on the configuration of your network and your preferences. Regardless
    of the location from which you choose to configure driver signing, you still have
    the same three choices available. The next section examines the process of configuring
    driver signing via Group Policy.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# Configuring Driver Signing via Group Policy


    If you have a Windows 2000 Active Directory domain, you should take advantage
    of Group Policy as often as possible. Using Group Policy Objects to configure
    your network and your computers gives you previously unavailable management abilities
    with very little overhead. Group Policy allows you to have granular control over
    the who, what, when, where, how, and why of configuring network settings. As an
    example of dealing with driver signing, assume that you work for a company that
    has the following departments:


    +   * Engineering—These individuals are technically savvy and frequently need
    to install and configure new hardware devices. They, however, in the past caused
    serious issues when installing hardware devices that shipped with poorly written
    device drivers. All Engineering client computers and user accounts are located
    in the Engineering organizational unit (OU).


    +   * Accounting—The accountants rarely, if ever, need new hardware device installed
    on their machines, it has been easy in the past to send out support personnel
    to install and configure the hardware device properly. All Accounting computers
    and user accounts are located in the Accounting OU.


    +   * Developers—The development team is responsible for all the software associated
    with the civil engineering equipment your company manufactures. The team also
    creates device drivers for this hardware and must install the device drivers on
    test machines to test and troubleshoot the hardware/software combination before
    shipping to customers. The developers have client customers spread out in two
    organizational units: their standard network machines are located in the Engineering
    OU, whereas their testing machines are located in the Developers OU. All user
    accounts are located in the Developers OU.


    In this example, you are faced with three different types of clients and three
    different driver signing options you can configure via Group Policy for their
    respective OUs. In this case, you should consider configuring driver signing as
    follows:


    +   * Configure the Warn setting for the Engineering OU—You want the Engineers
    to be able to install new hardware devices as required; however, you want them
    to be warned before installing unsigned drivers.


    +   * Configure the Block setting for the Accounting OU—The Accountants infrequently
    add new hardware; therefore, it is safer to prevent them from'
