    interval and the length of time to record the log file. These issues are detailed
    as follows:


    +   - The measurement interval determines how often a performance reading is taken.
    Too short an interval can produce spurious results and can cause additional workload
    on your system. Too long an interval might hide performance changes. Although
    most readings are insignificant, frequent readings can cause significant performance
    degradations.


    +   - The length of time over which a log file is recorded should be long enough
    to capture all the normal operational activities. This typically means recording
    a log file for at least a week. A shorter time period might not offer you a complete
