  md: '# Verifying Hardware Compatibility


    With your driver signing policies firmly in place, you are ready to move to the
    next step in the hardware installation process: verifying hardware compatibility
    with Windows 2000. It may seem a trivial matter that most hardware is Plug and
    Play compatible, but it is still important to make sure that the hardware you
    want to place into your Windows 2000 computer is recognized by Microsoft as a
    Windows 2000 compatible device. Before you purchase new hardware (or attempt to
    install Windows 2000 on a new machine), you should take the time to ensure that
    it is compatible with Windows 2000. This can be done in one of two ways:


    +   Check the Hardware Compatibility List (HCL). This is the preferred method
    to verify hardware compatibility as the HCL changes weekly and is updated by Microsoft
    certifies additional hardware items for use with Windows 2000.


    +   Run winnt32.exe with /checkupgradeonlyswitch, which checks for compatibility
    with existing hardware before installing Windows 2000.


    > > ![ALERT](image_url)

    >n Command switches are somewhat difficult to remember, but are important to learn
    nonetheless. Doing so will make your day-to-day operations easier and improve
    your chances on passing this exam.


    # The Hardware Compatibility List (HCL)


    The Hardware Compatibility List (HCL) is Microsoft''s published list of hardware
    components that have been fully tested with Windows 2000. Items that are listed
    in the HCL are guaranteed to function with Windows 2000. If you want to ensure
    that all your hardware components will function properly under Windows 2000, you
    should consult the current version of the HCL, which can be found on the Internet
    at http://www.microsoft.com/hcl/


    Although thousands of products can be found on the HCL (meaning that the Microsoft
    WHQL has tested them and found them to function with Windows 2000), not every
    piece of hardware in existence is compatible. This is especially true if the hardware
    is very old or very new. If the hardware manufacturer has a suitable Windows 2000
    driver available for that device, it should function satisfactorily in Windows
    2000. However, any future problems that you encounter with the device should be
    addressed to the hardware manufacturer, not Microsoft.'
  merge: -1
