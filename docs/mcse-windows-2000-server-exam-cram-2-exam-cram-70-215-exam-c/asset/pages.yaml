    # certificate


    A digital signature issued by a third party (called a certificate authority, or
    CA) that claims to have verified the identity of a server or an individual.


    # computer account


    An account representing a specific (Windows 2000) computer that is a member of
    a domain.


    # defragment


    The process of reorganizing files so they are stored contiguously on the hard
    drive.


    # CHKDSK


    The utility that checks the file and folder structure of your hard disk. You can
    have CHKDSK check the physical structure of your hard disk. CHKDSK can perform
    repairs as required.


    # Device Manager


    A Windows 2000 administrative tool used to install, configure, and manage hardware
    devices.


    # client


    A computer on a network that requests resources or services from some other computer,
    usually referred to as a server.


    # digital signature


    An electronic certificate that verifies the identity of a client.


    # Client Access License (CAL)


    The number of authorized connections to a server. Options for licensing include
    per seat and per server. Per server licensing is


    # Disk Cleanup


    A tool used to regain access to hard drive space by deleting temporary, orphaned,
    or downloaded files; emptying the Recycle Bin; compressing little-used files;
    condensing index catalog files.'
