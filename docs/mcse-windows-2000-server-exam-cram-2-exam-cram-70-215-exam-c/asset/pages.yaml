    # The Performance Logs and Alerts Snap-In


    Although System Monitor provides far more system monitoring information than Task
    Manager, it still only provides a snapshot view of system performance. To perform
    a more thorough evaluation of system performance, you need to view the system
    statistics over a period of time. You can find these statistics in the Performance
    Logs and Alerts tool located underneath System Monitor in the Performance Tool
    MMC. The following two sections detail the logging and alert features you can
    use to capture performance data over an extended time period.


    # Performance Logs


    The Performance Logs and Alerts MMC snap-ins allow you to log performance data
    over a period of time and save it to a log file for later viewing. There are two
    logging options: *Counter Logs* and *Trace Logs*. Counter Logs allow you to record
    data about hardware usage and the activity of system services from local or remote
    computers. You can configure logging to occur manually or automatically based
    on a defined schedule. Trace logs record data when certain activity, as such as
    disk I/O or a page fault, occurs. When the event occurs, the provider sends the
    data to the log service.


    > NOTE

    nThe Trace Logs function is rarely used, because the logs can only be read by
    a custom-developed tool. It will probably not be covered on the exam.


    The snap-in allows you to save log data in the following file formats:


    +   * Text File (CSV)—Comma-delimited format, for import into spreadsheet or database
    programs.'
