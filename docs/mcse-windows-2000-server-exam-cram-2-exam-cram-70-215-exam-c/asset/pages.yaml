  md: '# Assigning Drive Letters and Paths


    To change the drive letter or path, right-click the volume and select Change Drive
    Letter and Paths from the shortcut menu. The Change Drive Letter and Paths dialog
    box opens, as shown in Figure 6.10.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_226_0.png)


    Figure 6.10 Changing the drive letter or path assignment.


    A mounted drive functions the same as any other drive, but is assigned a name
    rather than a drive letter. To mount the drive as an NTFS folder path, ensure
    that the path specified exists and is empty, and click the Add button. To change
    the drive letter assigned, click the Edit button. To remove a drive letter or
    path, select it and click the Remove button.


    # Adding New Disks


    Adding new disks is a simple process. The only thing that may make adding a new
    disk different than adding any other type of hardware device (see Chapter 4 for
    more information on installing hardware in Windows 2000) is if your computer supports
    hot swapping. If your computer does support hot swapping, you can click Action,
    Rescan Disks after inserting the disk and Disk Management should show it. If your
    computer does not support hot swapping, the disk should appear in Disk Management
    on the subsequent restart of the computer.


    # Troubleshooting Disks and Volumes


    Windows 2000 comes with three fairly robust, built-in tools that you can use to
    perform basic troubleshooting, clamp, and repair. They are


    +   * Disk Cleanup—The utility that removes temporary files and other “dead wood”
    that may be on your computer''s disks.


    +   * Check Disk—The utility that checks the file and folder structure of your
    hard disk. You can also have Check check the physical structure of your hard disk.
    Check Disk can perform repairs as required.'
  merge: -1
