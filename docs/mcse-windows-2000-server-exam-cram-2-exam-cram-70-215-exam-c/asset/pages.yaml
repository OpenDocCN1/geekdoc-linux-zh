  md: 'Chapter 5


    # System Monitor


    The System Monitor snap-in allows you to view real-time performance data in the
    counters from your domain controllers, member servers, or workstations on your
    network. In addition, System Monitor allows you to review performance data that
    is stored in a log file created with the Performance Logs and Alerts snap-in.


    Windows 2000 is a modular, object-oriented operating system. Each subsystem within
    Windows 2000 is an object. For example, the CPU is an object, the memory is an
    object, the storage subsystem is an object, and so on. As your computer performs
    various tasks, each of these objects generate performance data.


    Each object has several monitoring functions called counters. Each counter offers
    insight into a different aspect or function of the object. For example, the memory
