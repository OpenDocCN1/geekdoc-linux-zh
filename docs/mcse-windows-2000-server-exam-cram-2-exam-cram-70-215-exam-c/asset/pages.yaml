  md: '# The MCSE Windows 2000 Cram Sheet


    This Cram Sheet provides the distinct, key facts about Exam 70-215, "Installing,
    Configuring, and Administering Microsoft Windows 2000 Server." Review these important
    points you feel the last thing you do before entering the test center. Pay close
    attention to those items you need to review. A good exam strategy is to transfer
    all the facts you can recall from this cram sheet onto a piece of paper once you
    sit to take the exam.


    6. Unattended answer files are used to provide input so the setup process can
    be automated. Answer files can be created manually using a text editor, or via
    the wizard in the Setup Manager utility.


    7. Uniqueness Database Files are used to save variations, as different computer
    names. This is so that a common unattended answer file can be used.


    # INSTALLATION AND CONFIGURATION


    +   1. Windows 2000 can be installed on the following types of partitions:

    * NTFS

    * FAT32

    * FAT16


    8. The Sysprep is used to remove the computer name and unique Security Identifiers
    (SIDs) from a Windows 2000 installation, so that the disk can be duplicated using
    Ghost or a similar utility.


    +   2. Only the following operating systems can be upgraded to Windows 2000 Server:

    * Windows NT 4.0

    * Windows NT 3.51


    9. Slipstreaming is the process of applying Service Pack updates to a copy of
    Windows 2000 that is stored in a local folder or a network share. Subsequent installations
    performed from these files will automatically include up-to-date files. Slipstreaming
    is performed by using the -switch when installing the Service Pack.


    +   4. Win32.exe is used to perform an upgrade from a 32-bit operating system.
    Some common command-line switches are

    * /s--The source of the installation files.

    * /u--The unattended answer file.

    * /udf--The Uniqueness Database File (UDF).

    * /cmcds--Used to install the Recovery Console (after installation).

    * /checkupgrade-only--To verify that your computer can be upgraded to Windows
    2000.


    # NETWORK PROTOCOLS


    5. Windows 2000 setup disks can be created using the MAKEBOOT (16-bit) or MAKEBOOT32
    (32-Bit) items that are found in the BOOTDISK-folder on the Windows 2000 CDROM.


    +   1. TCP/IP is automatically installed with Windows 2000 when a network adapter
    is detected.


    +   2. IP addresses can be assigned dynamically using a DHCP server or if no DHCP
    server is available. DHCP clients will assign them an IP address in the range
    162.254.0.1-162.254.255.255.


    +   3. Windows 2000 supports the NWLink protocol, which is Microsoft''s version
    of Novel''s IP/SPX protocol. NWLink is not enabled by default but can be added
    through the Network and Dial-up Connections.


    +   5. The frame type if IP/SPX is data on the network. If only one frame type
    is present on the network, autodetect self-configures itself to match it. If multiple
    frame types are detected on the network, autodetect defaults to the first frame
    type it detects. Netware servers 3.3 and later use the 3.2 frame type. You can
    manually configure NWLink for multiple frame types.'
  merge: -1
  pgno: 2
- img_proc: true
  md: '6. Service Client for NetWare (CSNW) is the Microsoft version of the NetWare
    client. It allows a Windows client to log on and access NetWare servers.


    7. Gateway Services for NetWare (GSNW) allows a Windows 2000 server to act as
    a gateway through which Windows clients can access file and print services on
    NetWare servers. In this case, only the Windows 2000 Server acting as a gateway
    has NWLink and Client Services for NetWare (CSNW) installed. NWLink and CSNW are
    automatically installed with GSNW.


    8. NetBIOS detects the protocols and services available for a network adapter
    as well as the order in which they appear


    9. IP packet filters control the type of inbound traffic that is allowed to enter
    a computer and/or network. IP traffic can be filtered by destination port number.


    10. Network Monitor can be used to analyze network traffic.


    11. IPSec is used to protect data between two hosts on a network.


    12. IPSec supports two modes: tunneling mode and transport mode. In tunneling
    mode, only the IP header is encrypted.


    # STORAGE


    +   1. The Distributed File System (Dfs) is installed by default in Windows 2000
    Server. There are two types of Dfs:


    +   - Standalone—The root configuration information is stored on a single server.


    +   - Domain—The root configuration is stored in Active Directory. This makes
    it more fault-tolerant.


    +   2. There can be one Dfs root per server.


    +   3. Windows 2000 uses the previous Windows file systems, but will install NTFS
    5.0 by default. NTFS 5.0 is required for the new file system features such as
    disk volumes and quotas.


    +   4. Windows 2000 Basic disks are the same as the disks in previous versions
    of Windows NT. On each physical disk you can create a maximum of four partitions,
    or three partitions and one extended partition with logical drives.


    +   5. Windows 2000 Dynamic uses volumes instead of partitions. An unlimited number
    of volumes can be configured on each physical disk. A Dynamic Volume can be extended
    at any time. The following types of volumes are supported in Windows 2000:


    +   - Simple Volume—The same as a basic partition. Disk space is used from only
    one physical disk.


    +   - Spanned Volume—A spanned volume can contain space up to 32 physical disks.
    You can add space non-destructively, there is no fault tolerance. If you lose
    a single disk, the entire volume is lost.


    +   - Strip Volumes—RAID 0 is written across multiple disks in 64 stripes. Stripes
    have the fastest disk I/O performance. They are not fault tolerant; if you lose
    one disk, the entire volume is lost.


    +   - RAID 5—A RAID 5 volume can contain space up to 32 physical disks. Data and
    parity information is written across multiple disks in 64 stripes. Fault tolerant,
    the parity information allows you to rebuild a failed disk.


    +   6. Basic disks can be upgraded to dynamic disks at any time without data loss.
    You cannot revert a dynamic disk to a basic disk without deleting the data.


    +   7. Dynamic disks can only be read by Windows 2000, or by older clients accessing
    a shared folder on a Windows 2000 computer over a network.


    +   8. Disk quotas allow you to specify how much disk space a user is allowed
    to use on any NTFS volume. You can specify disk quotas for all users or individually
    for specific users. Quotas are only supported for Windows 2000 volumes, which
    require NTFS 5.0. Disk quotas can only be applied to a single volume, and cannot
    be applied to folders.


    # REMOTE ACCESS


    +   1. Remote access allows users to dial into a server and access the network
    as they were physically connected.


    +   2. DHCP agent enables DHCP clients to obtain an IP address from a DHCP server
    on the network when they dial in.


    +   3. Remote Access Policies define who has permission to dial in and the characteristics
    of the connection. Remote Access Policies consist of conditions, permissions,
    and profiles.


    +   4. The default Remote Access Policy is to allow access to users who have dial-in
    permission enabled in their account settings.


    +   5. Multilink enables multiple lines to be combined into a single logical connection
    to increase available bandwidth.


    +   6. The following protocols can be used for RAS authentication: PAP, SPAP,
    CHAP, MSCHAP, and EAP.


    +   7. Windows 2000 uses two types of encryption: MPPE and IPSec.


    +   8. VPNs are created using a tunneling protocol. A tunnel can be established
    using either PPTP or L2TP.'
