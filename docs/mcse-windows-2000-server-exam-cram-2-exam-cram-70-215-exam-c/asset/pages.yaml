  md: '# Chapter 7


    A VPN works by having a remote client connect to the Internet via dial-up or some
    other type of connection. Then the remote client starts the VPN client software
    and it connects to the remote access server over the Internet. After authorization,
    the two computers communicate via an encrypted point to point connection.


    Because a VPN is just another form of remote access, the configuration is virtually
    identical to the remote access connection that we previously configured. All of
    the same policy attributes and profiles can be configured for a VPN.


    # Terminal Services


    Terminal Services is a Windows 2000 desktop and applications, even when using
    a computer that is not Windows 2000 capable. This allows you to reuse old hard-ware
    that cannot support current operating systems and applications.


    Terminal Services consists of three separate components:


    +   * The Terminal Server—The server is where the applications are running.

    * The Terminal Services Client—The client is responsible for updating the screen,
    and passing the keyboard and mouse movements to the server

    * Remote Desktop Protocol (RDP)—The RDP protocol runs on top of TCP/IP and is
    responsible for transmitting commands and screen updates between the client and
    the server.


    Terminal Services operates by running the applications on the Windows 2000 Server,
    and transmitting the screen updates and keyboard and mouse actions between the
    server and the client software. This allows you to use a low-powered computer
    to run the client software, because all application processing is taking place
    on the server.


    When a user logs on to a Terminal Services session, she receives a desktop that
    looks just like she were sitting in front of a Windows 2000 computer, as shown
    in Figure 7.24.


    Windows 2000 Terminal service is available in two modes:


    +   * Remote Administration—Remote Administration mode allows an administrator
    to connect remotely to a server, and manage just like he was sitting in front
    of the console. Remote Administration mode only supports two concurrent connections,
    and does not require additional licensing.'
