  md: '# File Replication Service (FRS)


    The Windows 2000 File Replication Service (FRS) is included during installation
    and was designed to handle file replication traffic for domain controllers. it
    is included with all Windows 2000 installations, though it is configured for manual
    startup on domain and member servers. When a server is configured as a domain
    controller, FRS is set to start automatically. Although FRS is originally set
    up for login script and policy replication, it is the foundation for Dfs root
    replication on domain roots. In fact, Dfs root replication will most likely take
    more FRS time than Active Directory replication. To manage Dfs root replication,
    FRS uses the same structure as the Knowledge Consistency Checker (KCC) defined
    Active Directory file replication. When a user has changed a file in a Dfs root,
    the change is noted in the NTFS change log, which is monitored for changes to
    Dfs links. When the user closes the file, the changes are updated and FRS places
    the file in a staging area for scheduled replication.


    Although Windows 2000 Servers use FRS for file replication, it is not used for
    Active Directory traffic. FRS on Windows 2000 domain controllers synchronizes
    SYSVOL contents among servers in the domain. SYSVOL stores login scripts and system
    policy files, and FRS ensures the most-to-date files exist on each server. To
    do this, version files are maintained, which allows FRS to determine whether the
    most current updates have been distributed.


    Among domain controllers, FRS automatically generates a replication ring. The
    Active Directory topology defines the path replication updates from domain controller
    to domain controller, to ensure that all servers have up-to-date information.
    By using a ring topology, FRS is certain to have at least two paths from one domain
    controller to another in the event that a domain controller is down. Because Active
    Directory uses a multmaster replication scheme in which all domain controllers
    are equal, it is imperative that all Active Directory servers are completely up-to-date.


    The replication scheme is configured into sites, which represent a group of connected
    computers. Because of the amount of traffic involved in supporting a site be reliable
    and relatively high-speed; Microsoft recommends network speeds of at least 512Kbps.
    Active Directory servers requiring synchronization over slower links, such as
    56Kbps WAN links, should be configured in separate sites. The KCC is responsible
    for generating and maintaining the replication ring among domain controllers within
    a site.'
  merge: -1
  pgno: 118
- img_proc: true
  md: '# Chapter 3


    Replication between servers in the same site (intra-site replication) occurs

    every minutes and is trigger-based, which means that the domain con-

    troller notifies its replication partners when it has changes, and when

    the replication partners are available, they send a request to the domain con-

    troller for the update. Intra-site replication traffic is not compressed. During

    the installation process, intra-site replication is automatically established

    bween domain controllers on the same site.


    Replication between sites (inter-site replication) takes place only at specific

    times (the default is three hours), unless there is an urgent need for replica-

    tion. To ensure the best transmission speeds, they transport for inter-site

    replication is configurable and the data is compressed. Unfortunately, inter-\site
    communication is not configured automatically. Urgent replication is

    ttriggered for inter-site connections when a user account has been locked out

    due to failed login attempts, when there is a change in the domain con-

    troller''s Local Security Authority (LSA), and when there is a change in the

    relative identifier (RID) master role owner.


    # Monitor, Configure, Troubleshoot, and

    Control Local Security on Files and Folders


    The Windows 2000 environment is exceptionally dynamic and allows for a

    variety of security configurations. The building blocks for implement-

    ing security on a Windows 2000 system, whether Server or Professional, are

    users and groups. Because creating and managing user and group accounts is

    a focus of the Installing, Configuring, and Administering Microsoft

    Windows 2000 Professional exam number 70-210, it is not covered on the

    Server exam. It is important, however, that you understand how users and

    groups are implemented in Windows 2000 before you tackle file and folder

    security.


    There are two levels of security that can be implemented on a Windows 2000

    system: local security and share security. Local security manages access for users

    who log on directly to the system: in other words, the user typing on the

    Server''s keyboard. Share security (discussed in the next section) generally

    lies to users who are accessing the system''s resources across the network.


    To begin securing access to local files and folders, you must define which

    users are to log on to the server locally. This is done by using security polici-

    ies, which are discussed in Chapter 8, “Implementing, Monitoring, and

    Troubleshooting Security.” For the sake of discussion in this section, it''s

    enough to understand that limiting local access to the server itself is key to

    trolling local access to files and folders.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# Installing, Configuring, and Troubleshooting Access to Resources


    Once the determination is made as to which users and groups will be allowed to
    access the server locally, securing the resources becomes a question of the drive
    partition''s file system. As mentioned earlier, one of the most significant differences
    between the FAT and NTFS file systems is the number and variety of security settings
    available. Because the FAT file system is not structured to provide security,
    it is not possible to control access to files and folders once the user has been
    granted access to the server console. FAT partitions can be secured when accessed
    remotely, however, will be discussed in the next section.


    # NTFS Permissions


    As mentioned, NTFS was designed to provide complete file-level security for file
    resources on Windows 2000 systems. It provides the ability to allow or deny access
    permissions to users and groups down to the individual files on the partition.
    It is preferable to use groups for any security configuration to provide for easier
    administration.


    To provide the most secure configuration, denying a permission to a specific user
    or group overrides all other permissions. For example, if a folder''s permissions
    assignments dictate that the Accounting group grant Full Control, but the permissions
    for a member of that group have been set to Deny for the Read permission, that
    member will not be able to see the folder or its contents. Because Deny overrides
    all other settings, it affects permission inheritance. It is often better not
    to specifically assign permissions to a user or group, rather than explicitly
    set deny permissions to restrict access.


    One of the benefits of NTFS is that its security settings apply whether the user
    is accessing the resources locally or over the network. This is an important feature
    that ensures a user accessing the server locally is not able to impact the server''s
    operation. By securing the folders where system files are stored, essential operating
    system files are protected from users deleting or modifying them. System files
    located on a FAT partition do not have this security, which means a user accessing
    the server locally can potentially render the server inoperable.


    NTFS permissions are cumulative; in other words, the permissions assigned to a
    user are combined with the permissions assigned to any groups to which they are
    members to determine whether to grant the requested access to a resource. For
    the most part, access permissions are combined to allow access. For example, an
    Administrator may grant the group Read and List Folder permissions to a folder,
    then grant specific users the Read, Write, and Modify permissions to files in
    that folder. When combined,'
  merge: -1
  pgno: 120
