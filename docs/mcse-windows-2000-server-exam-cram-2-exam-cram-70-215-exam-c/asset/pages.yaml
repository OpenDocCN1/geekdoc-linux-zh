    # # Managing Disk Quotas


    In previous versions of Windows, you had no control over how much space your users
    used on your hard disks. In Windows 2000, this has changed, thanks to the disk
    disk quotas capability. Disk quotas allow you to specify how much disk space a
    user is allowed to use on any particular NTFS volume. You must be using NTFS 5.0
    for this feature to be available. You can specify disk quotas universally for
    all users of a volume or individually for specific users. The following points
    of concern apply to disk quotas:


    +   * As previously stated, you can only implement disk quotas on Windows 2000
    NTFS 5.0 volumes.


    +   * Disk quotas can only be applied at the root level of the volume, not to
    specific folders.


    +   * Disk usage is based on all files that the user creates, copies, or takes
    ownership of.


    +   * Disk quotas are based on the actual file size, not the compressed file size.


    +   * Disk quotas affect the free size that an installed application will see
    during the installation process.


    +   * Disk quotas will not be applied to any users accessing data on a Windows
    2000 disk from Windows NT 4.0 (with the required Service Packs installed).


    To configure disk quotas, open the volume''s root properties by right-clicking
    a volume and selecting Properties from the shortcut menu. Click the Quota tab
    (see Figure 6.16) to configure disk quotas for that volume.'
  merge: -1
