    # Question 10


    Rick is the network administrator of a small Windows 2000 network consisting of
    5 Windows 2000 servers and 45 Windows 2000 Professional clients. He is currently
    operating in a peer-to-peer workgroup. Every week, Rick must reinstall two or
    three of his Windows 2000 clients due to sudden corruption and instability of
    the operating system. Rick is certain that the problems are created by users who
    are installing unsigned drivers for their hardware, thus creating instabilities
    and system failures. What can Rick do to prevent all unsigned drivers from being
    installed on his Windows 2000 clients, regardless of which user is logged in to
    the computer?


    +   A. Rick should configure a Group Policy Object that sets driver signing to
    Ignore, link it to the OU that houses his Windows 2000 Professional clients, and
    refresh Group Policy on his network.


    +   B. Rick should log on to each computer using his administrative account and
    configure driver signing to Ignore. He should select to apply this setting to
    all users of the computer.


    +   C. Rick should log on to each computer using his administrative account and
    configure driver signing to Block. He should select to apply this setting to all
    users of the computer.


    +   D. Rick should remove all of his users from the Users group and make them
    members of the Guest group.


    Answer C is correct. Because Rick''s network is operating as a workgroup and not
    using Active Directory, Rick needs to configure the settings for driver signing
    locally on each computer from the System applet of the Control Panel. Rick does
    not have Active Directory on his network and configuring the Ignore setting would
    not accomplish the goal if he did have AD, thus answer A is incorrect. Configuring
    driver signing to Ignore does not prevent users from installing unsigned drivers.
    Thus, answer B is incorrect. Placing all users into the Guest group will cause
    more problems than it fixes, including severely hammering Rick''s users from being
