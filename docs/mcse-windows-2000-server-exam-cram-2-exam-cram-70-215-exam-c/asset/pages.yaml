  md: '# Question 3


    You are training a new desk support worker. During the course of your discussions,
    the topic of digitally signed device drivers comes up. When asked about digitally
    signed device drivers are important, what will you not tell your new employee
    because it is not true?


    +   - A. Digitally signed device drivers have passed rigorous testing by the WHQL
    and therefore should provide a high degree of reliability.

    - B. Digitally signed device drivers are protected against changes to the driver
    files since signing by the manufacturer.

    - C. Digitally signed device drivers are the only type of driver files that are
    found on the Windows Update site or Windows 2000 CD-ROMs.

    - D. Digitally signed device drivers can''t be installed unless a certificate
    authority has been set up on your network.


    Answer D is correct. The other three statements are true concerning digitally
    signed device drivers. Because the certificate used to sign the file is traceable
    to a third-party certificate authority, such as VeriSign, there is no need for
    any further certificate services to be in place. If you wanted to issue digitally
    signed drivers to your customers, you would need a certificate authority in place
    on your network, preferably with a root certificate issued by a third party. When
    a driver has been digitally signed, it has been certified to pass the rigorous
    testing done by the WHQL. Thus, answer A is incorrect. By digitally signing a
    driver file, it is protected against all changes since it was signed. Thus, answer
    B is incorrect. You will only find digitally signed drivers on the Windows Update
    site or the Windows 2000 CD-ROM, thus answer C is incorrect.


    # Question 4


    Austin is using Device Manager to gather information about a particular server
    in his company. Which of the following items will he be able to gather information
    on using Device Manager? [Check all correct answers].


    +   - A. Resource settings for a specific device

    - B. A list of all interrupts currently being used on the computer

    - C. The status of a particular device, such as enabled or disabled

    - D. Information about specific drivers installed for a particular device


    Answers A, B, C, and D are correct. Using Device Manager, Austin will be able
    to gather all this information and more.'
