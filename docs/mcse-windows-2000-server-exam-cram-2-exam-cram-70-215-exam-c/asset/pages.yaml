  md: '# 136 Chapter 4


    # Question 5


    Chris is an administrator for her organization. Two of her servers have hardware
    devices that recently have had updates issued for their drivers. Where can Chris
    go to install the updated device drivers?


    +   - A. System Information

    - B. Device Manager

    - C. Add/Remove Programs applet of Control Panel

    - D. Services MMC snap-in


    Answer B is correct. Chris can install the new drivers from Device Manager. To
    install the new drivers, she must right-click the device to be updated and select
    Properties. She then must click the Driver tab and Update Driver. The System Information
    utility allows her to quickly determine many facts about your computer, but will
    not help install an updated driver. Thus, answer A is incorrect. The Add/Remove
    Programs applet is used for installing programs and configuring Windows components,
    not for installing drivers. Thus, answer C is incorrect. The Services MMC snap-in
    is used to configure and control the services running on a computer, not to install
    drivers. Thus, answer D is incorrect.


    # Question 6


    Andrea recently acquired a new modem for her Windows 2000 computer. The new modem
    is not Plug Play compatible. How will Andrea go installing the new hardware device
    on her computer?


    +   - A. Use Device Manager to install the new hardware device.

    - B. Use the Phone and Modern Options applet of the Control Panel.

    - C. Install the device into the computer. Windows 2000 will detect and automatically
    install the device the next time it is started.

    - D. Use the Add/Remove Hardware applet of the Control Panel.


    Answer D is correct. Non-Plug and Play hardware must be added via the Add/Remove
    Hardware applet of the Control Panel. All drivers to be installed should be Windows
    2000 compliant. Device Manager will not assist in installing new hardware device.
    Thus, answer A is incorrect. The Phone and Modem Options applet of the Control
    Panel can be used to configure dialing rules and modem settings after a modem
    has been successfully installed. Thus, answer B is incorrect. Only Plug and Play
    hardware can be installed physically and has Windows 2000 automatically install
    and configure the device and drivers. Thus, answer C is incorrect.'
  merge: -1
