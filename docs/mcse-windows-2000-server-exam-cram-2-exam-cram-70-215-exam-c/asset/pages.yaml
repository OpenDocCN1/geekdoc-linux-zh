    the files or change their attributes, and modify the contents of the file. Other\n\
    members of the group, however, will only be allowed to view the contents of\n\
    the folder and read the files.\n\nWindows 2000 makes very little distinction between\
    \ NTFS folder permis-\nsions and NTFS file permissions. In fact, there are few\
