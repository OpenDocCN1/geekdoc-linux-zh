    # Routing and Remote Access Service


    The Routing and Remote Access Service (RRAS) feature in Windows 2000 provides
    a multi-protocol router and support for remote access, including Virtual Private
    Networks (VPN). First introduced in Windows NT 4.0, the Windows 2000 version of
    RRAS combines software routing technology with remote access and authentication
    services.


    > NOTE In addition, the RRAS service in Windows 2000 supports DHCP relay and Network
    Address Translation. These features are covered in depth on the 70-216 exam.


    The routing features in RRAS provide support for the following routing protocols:


    +   - Routing Information Protocol (RIP) versions 1 and 2


    +   - Open Shortest Path First (OSPF)'
