    # Monitor, Configure, Troubleshoot, and Control Access to Files and Folders in
    a Shared Folder


    As discussed earlier in the chapter, users gain access to file resources through
    shared folders on the server''s partitions. When users attempt to gain access'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Installing, Configuring, and Troubleshooting Access to Resources


    to the server remotely, through utilities such as My Network Places, they will
    be able to see the shared folders to which they have access.


    The process of sharing folders is similar to the process for assigning NTFS permissions.
    By default, folders are not shared. The level of access granted to users is determined
    by their group membership. Figure 3.7 shows the Properties for a folder to be
    shared. Selecting the Share This option seen in the folder''s Properties dialog
    box allows you to specify the name of the share, add comments, as well as limit
    the number of users who are able to access it at the same time.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_124_0.png)


    **Figure 3.7** Share a folder to restrict access.


    Clicking the Permissions tab gives you the opportunity to change the access settings
    for the shared folder. Note that the default setting is to allow the Everyone
    group Full Control to the shared folder. Remember that, as with NTFS permissions,
    an explicit Deny overrides all other permissions, including any that may be inherited
    from other group memberships. Shared folder permissions are significantly less
    comprehensive than NTFS permissions. Briefly, the permissions are


    +   * Read—This permission lets the designated user or group view the files and
    subfolders present, as well as their attributes. Users are able to read the contents
    of the files and execute programs from the folder.


    +   * Change—This permission allows users the ability to create subfolders within
    the shared folder, add files to the folder, modify the files (including changing
    their attributes), and do all the things allowed by the Read permission.'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# Chapter 3


    Full Control—Gives users everything allowed under the Change permissions, plus
    the ability to change file permissions and take ownership of files.


    As with NTFS permissions, shared folder permissions are cumulative, unless a user
    is denied access in any of the groups to which they belong. The combination of
    their groups'' permissions and their own will determine their total access level.
    Though they do not provide the most thorough security configuration, shared folders
    are the only way to secure network access to files and folders on FAT volumes.
    When the shared folder resides on an NTFS volume, it is preferable to configure
    the security settings either on the share or through NTFS permissions, but not
    both. Because NTFS provides more thorough security options, it is generally the
    best choice to opt for NTFS permissions when possible. For this reason, the default
    configuration for share permissions (Everyone Full Control) is often acceptable.
    This limits the administrative effort required and makes it easier to ensure the
    correct permissions are granted to users and groups.


    On a Windows 2000 Server in a domain, memberof the Administrators and Server Operators
    are able to share folders on any computer in the domain. On a standalone server,
    Power Users can create shares on the local partitions only. In a workgroup environment,
    Administrators and Power Users can create shares on the standalone server and
    on any Windows 2000 Professional computer which is a member of the group.


    When volumes are created, Windows 2000 automatically creates special shares for
    administration. These shares are shown with a dollar sign ($) on the Sharing tab
    of the volume''s properties page. For example, the root of the volume on the C
    drive is shared as $. Administrative shares are also created for the system root
    folder, shared as Admin$, and the folder Windows 2000 users to store printer drivers,
    shared as Print$. All administrative shares are hidden and cannot be changed,
    but can be accessed by users on the network if they are granted appropriate access.
    By default, only Administrators are granted access to administrative shares.


    # Monitor, Configure, Troubleshoot, and Control Access to Files and Folders via
    Web Services


    Windows 2000 includes Microsoft''s Internet publishing product called Internet
    Information Services (IIS) version 5.0, which you''ll learn more about in the
    next section. One of the new features of IIS allows you to'
  merge: -1
  pgno: 125
