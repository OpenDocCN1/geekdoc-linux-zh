    # Performance Alerts


    The Alerts container is used to define threshold alerts. These can be used with
    real-time measurements or with historical log files. An alert is issued when a
    specific counter crosses a defined threshold value. When this occurs, a trigger
    event is initiated.


    Creating an Alert is similar to configuring a Counter Log. Right-click the Alerts
    entry in the left pane of the Performance Logs and Alerts snap-in and select New
    Alert Settings. In the New Alert Settings dialog box, enter a name for the alert.
    In the properties dialog box, you can select the desired counters and the value
    threshold. If you click the Action tab, shown in Figure 5.12, you can select the
    action to take when the threshold is reached.'
