  md: '# Introduction


    Hardware installation, configuration, and support are tasks that many administrators
    take for granted. Perhaps the administrators help desk personnel or junior administrators
    whose function it is to worry about such low-level issues. But what do you do
    if you don''t have the luxury of an entire group or department that manages your
    hardware? You then learn the value of knowing how Windows 2000 deals with hardware.
    Even if another group handles these issues for you, you must still have a firm
    grasp on hardware and how it interacts with Windows 2000. Most important, you
    need to be able to make all of your installed hardware interface interact properly,
    not only with but also with Windows 2000. Many operating system problems that
    users start with the users themselves or the hardware that they are using. Knowing
    how to deal with hardware installation and configuration will help keep your users
    happy and your boss even happier. This chapter introduces you to the nuances of
    verifying, installing, and configuring hardware for your clients


    In the days of DOS and Windows 3.11, installing new hardware in a machine could
    actually turn out to be a major event. Plug and Play was just a dream on an engineer''s
    scratch pad and getting sound technical support from most vendors was a rarity
    at best. The Microsoft Hardware Compatibility List (HCL) did not exist and thus
    you had to hope more than not that your new hardware would work properly when
    matched up with your old hardware and your operating system. Of course, there
    were always problems with custom applications that required specific hardware—but
    you get the point. When you got lucky, you were a god in your organization; when
    you were unlucky, you countless hours trying to figure out what went wrong. Or
    the joy of it all....


    Fortunately for us, these days have all but passed. In Windows 2000, with Plug
    and Play hardware, the installation and configuration of hardware devices has
    been simplified and improved substantially over all previous versions of Windows.
    The process for installing and configuring hardware has three basic steps:


    +   - Set driver restrictions.


    +   - Select the hardware to be installed and verify its compatibility.


    +   - Install and configure the selected hardware.


    There is, of course, more to this cycle than what is outlined here. These three
    steps are the core parts of managing hardware in Windows 2000. You may still find
    yourself facing the need to support legacy hardware devices'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# Configuring and Troubleshooting Hardware Devices Drivers 113


    that are not Plug and Play compliant, but Windows 2000 makes this an easy task
    compared to previous versions of Windows. We look at each of these items in greater
    detail in the following sections, plus a few other items of interest in the area
    of hardware installation and management.


    # Configuring Driver Signing Options


    Realizing that poorly written drivers were often the cause of kernel stop errors
    (also known as the Blue Screen of Death) and other system problems, such as lockups
    and instability, Microsoft introduced digital driver signing in Windows 2000.
    Digitally signed device drivers are those that have been submitted to the Windows
    Hardware Quality Lab (WHQL) by vendors and subsequently subjected to compatibility
    tests administered by the WHQL. Drivers that complete the compatibility testing
    process successfully are approved by Microsoft and digitally signed. Due to this
    rigorous testing, digitally signed drivers can be counted on as more robust and
    reliable. Driver files that have been digitally signed can be found on the Windows
    Update Web site and also on the Windows Hardware Compatibility List. Additionally,
    only digitally signed drivers are found on the Windows 2000 setup CD-ROM.


    Driver signing, which is controlled from the System applet for standalone machines
    and via Group Policy for network machines, is important to ensure your computers
    remain fully functional. By enforcing restrictions on the installation of unsigned
    drivers, you can prevent hardware conflicts and stop errors, both of which are
    common side effects of poorly written drivers. Poorly written drivers also tend
    to generate an unusually large number of CPU interrupts, thus interfering with
    all other operations.


    > The Windows Update Web site can be found at http://windowsupdate.microsoft.com/.
    The Windows Hardware Compatibility List (HCL) can be found at http://www.microsoft.com/hcl/default.asp.


    By digitally signing a file, in this case a driver file, one can be certain that
    the file is trustworthy and authentic. In this way, digitally signing your email
    message that you send to a co-worker. Because any type of computer file can be
    signed with a digital certificate signature, a means must exist to handle all
    of the different file formats. This is accomplished via a technique known as catalog
    file signing, in which digital signing information about files is available without
    any modification to the files themselves.'
