    # Performing Upgrade Installations from Windows NT 4.0 Server


    Due to its already large installed base, the possibility that you may need to
    upgrade a Windows NT Server 4.0 installation to Windows 2000 Server is quite likely.
    Fortunately, the upgrade of a Windows NT 4.0 member server to a Windows 2000 member
    server is very straightforward. A Windows 2000 member server can reside comfortably
    in a workgroup, a Windows NT 4.0 domain, or a Windows 2000 domain.


    The following are two common ways of upgrading a Windows NT 4.0 Server to Windows
    2000:


    +   - Attended

    - Unattended


    You can use the setup program from a network share or from a local CD-ROM (attended),
    or you can use the WINNT32 program from a network share (unattended). To perform
    an attended upgrade of a Windows NT 4.0 member server, follow these steps:


    +   1. From the Windows 2000 CD-ROM, run Setup.exe.

    2. When asked if you want to upgrade to Windows 2000, click Yes to continue.

    3. In the Welcome to Windows 2000 Setup Wizard screen shown in Figure 2.16, choose
    Upgrade to Windows 2000 (Recommended) and click Next.'
