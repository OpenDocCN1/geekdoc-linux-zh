    # # The Windows Internet Naming Service


    Each computer has a DNS host name and a NetBIOS computer name. Unless specifically
    configured otherwise, these names are the same. Windows Internet Naming Service
    (WINS) provides NetBIOS name-to-IP address resolution. The WINS service provides
    for NetBIOS names what DNS provides for host names.


    You install WINS using the procedure that was discussed in the beginning of this
    section. Compared to some of the other services, there is relatively little configuration
    involved for WINS. The only recommended task is to configure the WINS database
    to be backed up periodically.


    This is accomplished by right-clicking the server name in the WINS MMC and selecting
    Properties. From the General tab, as shown in Figure 7.16, enter the path where
    you want the database to be backed up. This cannot be on a network drive; the
    database is backed up every three hours. In addition, you can select the Back
    Up Database During Shutdown option, which automatically backs up the database
    whenever the server is shut down or rebooted, or the WINS service is stopped.


    You can also configure replication of the WINS database to other servers through
    the use of push and pull partners. A push partner reports changes to the database
    to other servers. A pull partner is a server that requests a replica of the database
    from the push partner. To configure general replication parameters from the WINS
    console, perform the following steps on both push and pull:


    +   1. Expand the view for the server by clicking the plus sign next to it.

