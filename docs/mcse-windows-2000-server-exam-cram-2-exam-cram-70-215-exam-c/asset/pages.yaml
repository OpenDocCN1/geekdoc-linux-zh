  md: 'Configuring and Troubleshooting Hardware Devices and Drivers 137


    # Question 7


    | Which of the following driver signing behaviors will not prompt the user for
    action when installing new device drivers and could lead to system instabilities?

    - A. Ignore

    - B. Block

    - C. Silent

    - D. Quiet |


    Answer A is correct. When configured for Ignore, Windows 2000 ignores and silently
    installs all drivers regardless of their digital signature status. This could
    allow unsigned drivers to be installed on a computer and subsequently lead to
    problems such as lockups or instability. The Block behavior automatically blocks
    all unsigned drivers and does not display or prompt for feedback to the user.
    Thus, answer B is incorrect. Quiet and Silent are not valid driver signing options.
    Thus, answers C and D are incorrect.


    # Question 8


    | Andrea noticed that her tape drive backup stopped responding last night when
    she tried to use it. When she asks for help, you instruct her to open Device Manager
    and report to you the icon displayed next to the tape drive unit. She tells you
    that a yellow question mark with a red X is next to the device. What should you
    do to correct the problem?

    - A. Manually assign system resource settings to the tape drive because it is
    obviously experiencing a conflict.

    - B. Attempt to reinstall the device driver because it might have become corrupted.

    - C. Enable the device because someone has manually disabled it.

    - D. Replace the tape drive because it has become faulty. |


    Answer B is correct. In most cases, when a yellow question mark with a red X is
    displayed, there is a problem with the drivers. The drivers might not be installed
    or be incorrectly configured. A resource conflict is indicated by normal icon
    with a yellow exclamation point, thus answer A is incorrect. A device that is
    manually disabled will have a normal icon with a red X, which is not the case.
    Thus, answer C is incorrect. A faulty tape drive would most likely not give any
    indication in Device Manager. Thus, answer D is incorrect.'
