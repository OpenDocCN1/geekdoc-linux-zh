    # Installing and Configuring Hardware Devices


    If it seems like it''s a long process to finally get to the actual installation
    and configuration of your new hardware, take comfort in the fact that you are
    ready to perform the installation and configuration in a safe manner. All of the
    prep work that has been done up to this point will help ensure that your Windows
    2000 computers function properly and have no hardware incompatibility issues in
    the future. We will now examine the installation and configuration of hardware
    in Windows 2000.


    Windows 2000 includes many enhancements over previous versions of Windows that
    greatly simplify device management. Some of these include Advanced Power Management
    (APM), Advanced Configuration and Power Interface (ACPI), and Plug and Play (PnP).


    Plug and Play is a combination of hardware and software that enables a computer
    to recognize and modify its hardware configuration changes with minimal intervention
    from the user. The hardware device that you are installing must support the Plug
    and Play specification to be automatically configured correctly. You will find
    that some older devices that pre Plug and Play will not be recognized, and thus
    require that you manually configure resource settings as discussed in the “Configuring
    Support for Legacy Hardware Devices” later in this chapter.


    With Plug and Play, a user can add or remove a device dynamically without manual
    refiguration and without any intricate knowledge of the hardware. For example,
    you can have a laptop in a docking station that contains an Ethernet network connection
    and later use the same laptop connecting to the network using a built-in modem,
    without making any configuration changes.'
