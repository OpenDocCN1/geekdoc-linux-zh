  md: '# Installing, Configuring, and Troubleshooting Access to Resources


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_122_0.png)


    **Figure 3.6** The Security tab is used to assign permissions for NTFS folders.


    At the bottom of the dialog box, the Allow Inheritable Permissions from Parent
    to Propagate to This Object selection is used to specify the inheritance policy
    for the object. If you uncheck this selection, you are asked whether you want
