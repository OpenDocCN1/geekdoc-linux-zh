  md: 'A local group can contain local or domain accounts domain local groups, or
    a global group from the domain that the computer is a member of or from any trusted
    domains.


    # Built-in System Groups


    In addition to the built-in local groups, Windows 2000 also has several built-system
    groups. The user cannot manipulate the membership of these groups; they are used
    to assign rights and permissions to resources. The Windows 2000 operating system
    dynamically manipulates the membership of these groups according to how the server
    is accessed, not by whom.


    The commonly used built-in system groups are


    +   * Anonymous Logon—This group contains the user account from any session that
    was not authenticated by the Windows 2000 security system, which occurs only when
    a username and password is not required to access the system.


    +   * Authenticated Users—This group contains all users with a valid account in
    the local security database on a member server or the Active Directory domain
    database in a domain environment.


    +   * Creator Owner—The user account that is the creator or the owner of the current
    object.


    +   * Dialup—All users that are currently connected via a dial-up connection.


    +   * Everyone—This group includes all users who access the computer, including
    the Guest account and anonymous logons.


    +   * Interactive—This group contains the user accounts of the users that are
    currently logged on to the system.


    +   * Network—This group contains the user accounts of the users that are connected
    to resources on the server over a network connection.


    Assigning permissions to the Everyone group can be a huge security exposure if
    the Guest account is enabled. Windows 2000 will authenticate a user without a
    valid account as Guest. This automatically gives this user all rights and permissions
    that you have assigned to the Everyone group. A better strategy would be to assign
    rights and permissions for resources to the Authenticated Users group instead
    of the Everyone Group, and never enable the Guest account, or, at a minimum, rename
    it.'
  merge: -1
  pgno: 304
