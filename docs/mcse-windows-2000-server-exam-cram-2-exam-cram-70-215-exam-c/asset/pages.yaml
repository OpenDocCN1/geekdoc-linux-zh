  md: '# # Practice Questions


    # ## Question 1


    Christopher is the administrator of a medium-sized (about 500 machines) Windows
    2000 network for an engineering firm. The previous administrator did a fairly
    good job of getting Windows 2000 rolled out in the organization, including breaking
    up each department into OUs. However, no matter what the administrator tried,
    one or two computers in the production department ceased to operate properly on
    a daily basis. You suspect the cause might be that the laypersonnel have a tendency
    to experiment with new hardware. What can you do to prevent future downtime on
    these computers?


    +   - A. On each machine, set the driver signing behavior to Block.

    - B. From Active Directory Users and Computers, create a GPO and link it to the
    production department''s OU. Configure driver signing in the GPO for Ignore.

    - C. From Active Directory Users and Computers, create a GPO and link it to the
    production department''s OU. Configure driver signing in the GPO to Block.

    - D. Remove all user accounts in the production department''s OU from the Users
    group to the Guest group.


    Answer C is correct. The best option in this case is to create a GPO linked to
    the production department''s OU and configure the driver signing behavior for
    Block. You are not told how many machines are part of the production department,
    but in a Windows 2000 Active Directory domain, you should always strive to apply
    policies via Group Policy Objects instead of manually configuring them. Thus,
    answer A is incorrect. Configuring a GPO with the Ignore option would not be an
    optimal solution because all drivers (signed or not) could not be installed. When
    the Block behavior is set, unsigned drivers cannot be installed. Thus, answer
    B is incorrect. Moving the users'' accounts out of the Users group and into the
    Guest group would fix the problem but would likely cause additional, unnecessary
    problems. Thus, answer D is incorrect.'
  merge: -1
