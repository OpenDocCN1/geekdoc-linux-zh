    > You absolutely must know the difference between an answer file and a .udf (unique-database
    file) and their functions before taking this exam.


    The structure of a .udf file is like as shown previously. It begins with a set
    of computer names under the heading [Uniqueids]. What follows is a section for
    each computer, with the heading [computername:UserData], and under that the unique
    variable name (such as ComputerName) and the value associated with that.


    With the answer files created, your task is simply to invoke the setup routine,
    indicating which answer file to use. This task is covered as the first topic in
    the next section.


    # Installing Windows 2000 Server Using an Answer File


    Unlike attempted installation procedures, unattended installations do not use
    the Setup.exe program. Instead, they use winnt.exe or winnt32.exe to complete
    the installation. Recall that winnt.exe is for 16-bit operating systems such as
    MS-DOS and Windows 3.x, while winnt32.exe is for 32-bit operating systems—Windows
    95 and later.'
