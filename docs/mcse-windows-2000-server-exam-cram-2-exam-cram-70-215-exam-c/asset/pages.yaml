    +   7. Open a command window and type **ntdsutil**, then press Enter.


    +   8. At the command prompt, type **authoritative restore**, then press Enter.


    To restore an object, you will need to know its common name (CN), the organization
    unit (OU), and the domain (DC) that the object was located in. For example, to
    restore the ABC St. Louis User OU, in the abc.com domain, you would enter the
    following command:


    ```

    Restore Subtree "OU=ABC St. Louis User,DC=abc,DC=com"

    ```


    This command restores all of the objects that have been deleted in the ABC St.
    Louis User OU since the backup tape was created.


    To restore a user, the command would be


    ```

    Restore Subtree "CN=JDoe,OU=ABC St. Louis User,DC=abc,DC=com"

    ```


    To restore a printer, the command would be


    ```

    Restore Subtree "CN=DeskJet 3rdfloor,OU=ABC St. Louis User,DC=abc,DC=com"

    ```


    After the command has completed, enter **quit** and reboot the domain controller.
    The domain controller will now replicate the restored Active Directory object
    to the other domain controllers.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_203_0.png)


    The following are the default Active Directory folders shown in the root of the
    Active Directory Users and Computers MMC:


    +   - Users

    - Builtin

    - Computers


    These folders are actually containers and not Organizational Units. When referencing
    these containers, you will have to use the CN= attribute and *not* the OU=.


    # Recovery Console


    For those situations in which the tools and methods available via Safe Mode are
    not enough to recover from a server failure, Microsoft has provided an additional
    tool called the Recovery Console. The Recovery Console is a DOS-like command-line
    interface in which you can perform a limited set of commands and start and stop
    system services. Unlike booting from a DOS disk, the Recovery Console allows you
    access to files on an NTFS formatted volume.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Managing, Monitoring, and Optimizing System Performance, Reliability, and
    Availability 171


    The Recovery Console is not installed by default; you must install it manually
    after you have installed Windows 2000. To install the Recovery Console:


    +   1. Load the Windows 2000 CD-ROM.


    +   2. Open a command prompt, access the Windows 2000 CD-ROM, and enter the \i386\win32
    \cmdcons command.


    +   3. Click the Yes button when the Setup window appears.


    +   4. When the setup procedure completes, restart the server.


    The Recovery Console option is added to the Windows 2000 Boot menu as shown in
    Figure 5.17.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_204_0.png)


    Figure 5.17 Windows 2000 Boot menu showing the addition of the Recovery Console.


    If your system fails and you don''t have the Recovery Console installed, or if
    you are having startup problems, you can run it from the Windows 2000 CD-ROM or
    the startup floppies. To run the Recovery Console from a CD-ROM or a floppy, perform
    the following steps:


    +   1. Insert the desired media and start the server.


    +   2. In the Windows 2000 Setup procedure, select the option to repair the operating
    system. Select Recovery Console as your repair method.


    +   3. Follow the instructions to log on to the Recovery Console.


    After you start the Recovery Console, either from media or by starting from the
    hard disk, you will be prompted for the operating system number to log on and
    to the Administrator password, as shown in Figure 5.18. This is not the domain
    or local Administrator password, but is the Directory Services Restore Mode password
    that you were prompted to create during creating the Dpromo procedure that you
    used to install Active Directory.'
  merge: -1
