  md: '# Windows 2000 Backup


    Windows 2000 provides a more advanced backup program than what was included with
    Windows NT. Windows 2000 Backup allows you to create backup jobs that you can
    run manually or schedule to run unattended. Unlike the previous NT Server version,
    NT Server 4, which could only back up to tape, you can now back up to disk, Zip
    drives, CD-R/RW, or any other media that is available via the Windows 2000 file
    system. In addition, you can use the backup program to make an Emergency Repair
    Disk (ERD).


    To start the Windows 2000 Backup program, select Start, Programs, Accessories,
    Backup. All of the backup and restore functions can be performed manually or via
    wizards. The Windows 2000 Backup dialog box is as shown in Figure 5.13.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_193_0.png)


    **Figure 5.13** Welcome tab of the Backup program showing the buttons to start
    the Backup Wizard and Restore Wizard, and the Emergency Repair Disk tool.


    To back up and restore a Windows 2000 server, you must be a member of the Administrators
    or the Backup Operators group. If you are not a member of these groups, you will
    only be able to back up the files that you are owner of, or that you have one
    of the following permissions for:'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Managing, Monitoring, and Optimizing System Performance, Reliability, and
    Availability 161


    +   * Read

    "* Read & Execute

    "* Modify

    "* Full Control"


    The backup utility allows you to back up a single file, a folder, a drive, or
    multiple drives. Although the Windows 2000 backup program will not back up files
    that are in use, many third-party backup programs are available that will: Refer
    to the “Need to Know More” section at the end of this chapter for additional information.


    # Types of Backups


    There are five backup options in Windows 2000. Each type varies as to what is
    backed up and whether or not the archive bit is set. The archive bit is a file
    attribute that is turned on when a file is created or modified. It is cleared
    whenever a file is successfully backed up. It is used to let the backup software
    know what files need to be backed up based on whether the file has just been created
    or whether modifications to a previously backed up file have happened since the
    last backup.


    # Normal


    A normal backup is used to back up all of the files and folders that you select,
    regardless of the setting of the archive bit. It then changes the archive bit
    of the files to show that they were backed up. The disadvantage of a normal backup
    is that it takes longer than some of the other backup types, because it backs
    up all of the files and folders. However, it does have the advantage of only requiring
    a single media (or set of media) for a full restore. To minimize backup time,
    the normal backup is typically used with incremental or differential backups.


    For a typical weekly backup schedule and the differences in the media required
    for a full restore, consult Tables 5.1 and 5.2.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_194_0.png)


    > You should be familiar with the various types of backups, when each one should
    be used, and what data will be restored during a recovery procedure.'
  merge: -1
  pgno: 194
- img_proc: true
  md: "# Chapter 5\n\n| Table 5.1 Weekly Backup Schedule Using Normal and Incremental\
    \ Backups |\n| Day | Backup Type | Media Required for Full Restore |\n| Monday\
    \ | Normal | Monday |\n Tuesday | Incremental | Monday + Tuesday |\n Wednesday\
    \ | Incremental | Monday + Tuesday + Wednesday |\n Thursday | Incremental | Monday\
    \ + Tuesday + Wednesday + Thursday |\n Friday | Incremental | Monday + Tuesday\
    \ + Wednesday + Friday |\n\n| Table 5.2 Weekly Backup Schedule Using Normal and\
    \ Differential Backups |\n| Day | Backup Type | Media Required for Full Restore\
    \ |\n| Monday | Normal | Monday |\n Tuesday | Differential | Monday + Tuesday\
    \ |\n Wednesday | Differential | Monday + Wednesday |\n Thursday | Differential\
    \ | Monday + Thursday |\n Friday | Differential | Monday + Friday |\n\n# Copy\n\
    \nA copy backup is used to back up the desired files and folders. It does not\
    \ read or change the archive bit. A copy backup is typically used to make an archival\
    \ copy of data and does not interrupt your current backup set.\n\n# Daily\n\n\
    A daily backup is used to back up only the files and folders that have been created\
    \ or modified on that day. It does not read or change the archive bit. A daily\
    \ backup is typically used to make a quick snapshot of the daily activity; this\
    \ is useful when you need to perform a task on the server and want to have a current\
    \ backup available.\n\n# Differential\n\nA differential backup is used to back\
    \ up only the files and folders that have been created or modified since the normal\
    \ or incremental backup. It does not change the archive bit. However, it reads\
    \ the archive bit to determine which files need to be backed up. A differential\
    \ backup is typically used between instances of a normal backup. For example,\
    \ if you perform a normal backup on Monday, you can perform differential backups\
    \ the rest of the week. The differential backup will take longer and longer each\
    \ day, because it will be backing up all of the files and folders that have been\
    \ created and"
  merge: -1
  pgno: 195
- img_proc: true
  md: '# Managing, Monitoring, and Optimizing System Performance, Reliability, and
    Availability 163


    modified since the last normal backup. A differential backup has the advantage
    that it takes less time than a normal backup, but when you perform a full restore,
    it will require the media for both the normal backup and the differential backup.


    # Incremental


    An incremental backup is used to back up only the files and folders that have
    been created or modified since the last normal or incremental backup. It reads
    the archive bit to determine which files need to be backed up. It then changes
    the archive bit of the files that were backed up so the next time the backup program
    is run, the file will not be backed again unless it was changed. An incremental
    backup is typically used between instances of a normal backup. Unlike the differential
    backup, the backup times typically do not get longer each day, because the incremental
    backup only backs up the files and folders that were modified since the last incremental
    backup. An incremental backup has the advantage of taking less time than a normal
    backup, but when you perform a full restore, it will require the media for the
    normal backup and all of the incremental backups that were performed since the
    normal backup, which is time consuming, depending on how many incremental backups
    you must restore.


    # System State Backups


    All backups of a Windows 2000 server should include the System State data. For
    all Windows 2000 operating systems, the System State data includes


    +   - Registry


    +   - COM+ Class Registration Database


    +   - System Boot Files


    For Windows 2000 Server, the System State data also includes the Certificate Services
    database (if the server is operating as a certificate server). If the server is
    a domain controller, the System State data also includes Active Directory services
    database and the SYSVOL directory. Due to their interdependencies, these components
    cannot be backed up or restored separately.


    It is important to back up the System State data for each server and domain controller.
    The System State backup from one server or domain controller cannot be restored
    to a different server or domain controller.


    There are two types of System State backup/restores, Local and Remote. A local
    backup/restore is used when the backup media is hosted on the server that is being
    restored. A remote restore is performed when the backup'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# Chapter 5


    media is located on another machine. The Windows 2000 Backup program is only capable
