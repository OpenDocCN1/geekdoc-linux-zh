    Discussed briefly earlier in the chapter, IIS 5.0 includes comprehensive internal
    security capabilities to keep intruders away and keep the information on Internet
    sites secure. This security structure is based on an extensive list of industry-standard
    security protocols and authentication methods.


    One of the most stringent standards IIS 5.0 adheres to Fortezza, which satisfies
    the very strict Defense Messaging System security architecture. Fortezza employs
    cryptography to ensure message confidentiality, integrity, and authenticity, while
    controlling access to the messages, components, and systems. Note, however, that
    the Fortezza standards are only used when IIS 5.0 is implemented on a server and
    PCMCIA hardware and browser software.


    IIS also supports Secure Sockets Layer (SSL) 3.0, which has been adopted as an
    industry standard for authentication over the Internet. IIS relies on certificates
    to provide the encryption algorithms. Transport Layer Security (TLS) is based
    on SSL, but it performs encryption at a lower level in the process, which improves
    performance, and in such a way that a programmer decrypting a message does not
