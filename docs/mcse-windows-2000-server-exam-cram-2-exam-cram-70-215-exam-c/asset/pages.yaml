- img_proc: true
  md: '# Chapter 2


    number of similar servers need to be installed. When configured properly, unattended
    installations can be completely hands-off after the installation has begun.


    For Windows 2000 Server, there are two methods of unattended installation:


    +   - Installation from scripts

    - Installation using disk images and third-party distribution software


    Script-based installations are the most prevalent in real life and on the exam,
    this section provides in-depth coverage of the configuration and deployment of
    script-based installation. You also get an overview of disk duplication, but we
    do not cover it in depth because the exam does not do so.


    # Script-Based Unattended Installation Using Answer Files


    The premise of the script-based installation is that the installation progresses
    like a normal unattended installation, except that where a user would normally
    answer setup questions, a text file provides the answers unattended. This text
    file is then intuitively called an answer file. Once the installation has begun,
    if you have configured the properties, no intervention is required.


    This list outlines the basic components of a script-based installation:


    +   - The I386 directory from the Windows 2000 CD-ROM—This is generally copied
    into a server-based folder and shared (unattended installations are almost exclusively
    network based).


    +   - The WINNT.exe or WIN32.exe programs—WINNT is for DOS-based installations;
    WIN32 is used for upgrades of 32-bit Windows


    +   - An answer file providing the generic answers to setup questions—This is
    typically a file with a .txt extension (although the extension does not matter),
    and is usually named UNATTENDED.txt.


    +   - A uniqueness database file—This file, which has a .ud extension, provides
    the answers to computer specific questions that will change from machine to machine
    (for example, the computer name or IP address).


    +   - A batch file or command line that invokes the unattended installation—This
    file is used to launch the unattended installation using the answer file and UDB
    files created to perform the installation.'
