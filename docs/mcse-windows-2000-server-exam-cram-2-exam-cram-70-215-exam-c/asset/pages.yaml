- img_proc: true
  md: '# Disk Defragmenter


    # Disk Management


    A tool that allows you to manage storage devices in Windows 2000.


    # disk quota


    A configuration setting that allows you to limit the amount of storage space user
    can consume.


    # Distributed file system (Dfs)


    A Windows 2000 Server service that manages shared network resources in a single
    hierarchical system.


    # domain controller


    A computer that authenticates domain logons. It also maintains a Windows 2000
    domain''s Active Directory, which stores all directory information and relationships
    about users, groups, policies, computers, and resources.


    # Domain Name Service (DNS)


    A naming system used to translate host names to IP addresses, and to locate resources
    on a TCP/IP-based network.


    # Domain Users and Groups


    This default built-in group in Active Directory contains the following groups:
    Account Operators, Administrators, Backup Operators, Guests, Print Operators,
    Replicator, Server Operators, Users.


    # driver


    A device-specific software component used by an operating system to communicate
    with a device.


    # driver signing


    A signed driver is one whose integrity is verified by Microsoft and digitally
    signed for installation. Windows 2000 can refuse to install any unsigned drivers.
    All drivers from Microsoft and approved vendors are signed.


    # dynamic disk


    A Windows 2000 hard disk that can only house dynamic volumes created through the
    Disk administrative tool. Dynamic disks do not include partitions or logical drives,
    and cannot be accessed by DOS.


    # Emergency Repair Disk (ERD)


    A disk that can be used to repair a failed system; it is created through the Backup
    utility.


    # Encrypting File System (EFS)


    A file system supported by Windows 2000 that provides encryption of data stored
    on NTFS volumes.'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# Event Viewer


    A utility built in Windows 2000 that is used to view and manage the Windows 2000
    event logs. Event Viewer include the Application log for application-related events,
    Security log for security- and audit-related events, and System log for events
    related to hardware and software issues in Windows 2000 Server itself and any
    installed drivers.


    # File Allocation Table (FAT)


    The file system originally introduced with DOS; it does not provide file system
    security features.


    # File and Print Services for NetWare


    The Windows 2000 service that enables NetWare clients to access Windows 2000 file
    and print resources.


    # File Replication Service (FRS)


    A service that provides multimaster file replication between designated servers
    running Windows of login scripts and policies stored in designated directory trees.


    # File Service for Macintosh


    The Windows 2000 service that enables Macintosh clients to access Windows 2000
    file-based resources.


    # File Services for Unix


    The Windows 2000 service that enables Unix clients to access Windows 2000 resources.


    # Gateway Services for NetWare (GSNW)


    A Windows 2000 service provides a connectivity service between Windows 2000 Server
    and NetWare, which allows Windows 2000 clients to occasionally access NetWare
    resources by connecting natively to a Windows 2000 server.


    # Group Policy Object (GPO)


    A security mechanism that provides granular control over the who, what, when,
    where, how, and why of configuring network settings. By using a GPO, you can easily
    configure security settings for each group on your network.


    # Hardware Compatibility List (HCL)


    A list of hardware devices that are supported by Windows. A version of the HCL
    is found on the Windows 2000 Server distribution CD, but a Web site is updated
    regularly at http://www.microsoft.com/hwdq/hcl/


    # Internet Connection Sharing (ICS)


    A basic proxy server built into Windows 2000 that is used to grant Internet access
    to a small network through a single Internet connection without requiring additional
    hardware or applications. Network clients are automatically configured to use
    the shared connection by configuring the default gateway to point to the ICS server''s
    internal NIC.'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# Internet Information Services (IIS)


    A server platform for building and sharing distributed, dynamic Web sites.


    # Internet Packet Exchange/Sequenced Packet Exchange (IPX/SPX)


    The proprietary protocol developed by Novell for communication on NetWare networks.
    Microsoft reverse engineered this protocol for use with Microsoft networks and
    called it NWLink.


    # Last Known Good Configuration


    The system and Registry settings from the last working system configuration. Last
    known good configurations are loadable at boot time.


    # licensing


    A Windows 2000 utility used to configure and manage licenses of Windows 2000 and
    installed applications.


    # Local Users and Groups


    A utility in the Computer Management MMC console that enables management of users
    and groups on the local computer.


    # MAKEBOOT


    The command used to create boot disks for Windows, designed to run under 16-bit
    operating systems, such as DOS and Windows 3.1.


    # MAKEBT32


    The command used to create boot disks for Windows, designed to run under 32-bit
    operating systems, such as Windows NT and 2000.


    # member server


    A server on a Windows network that does not participate in authenticating network
    users.


    # Microsoft Management Console (MMC)


    A standardized management interface for Microsoft operating systems. The MMC enables
    you to create a custom console for Windows administration through the use of snap-ins.


    # mirrored volume


    A fault tolerant disk configuration in which data is written to two hard disks,
    rather than one, so that if one disk fails then the data remains accessible.


    # NetBIOS Enhanced User Interface (NetBEUI)


    A native Microsoft networking protocol that is being phased out with Windows 2000
    due to its use of non-routable network broadcasts to locate resources, making
    unusable for enterprise networks.


    # network adapter


    A hardware device that enables a computer to communicate with a network.'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# Network Address Translation (NAT)


    # Network Address Translation (NAT)


    An Internet standard that enables a LAN to use one set of IP addresses for internal
    traffic and a second set of addresses for external traffic. The NAT server maintains
    a table and maps internal IP addresses to the external addresses used to connect
    them to the Internet.


    # policy


    A component that automatically configures user settings.


    # print device


    The physical hardware device that produces printed output.


    # Network Monitor


    A Windows 2000 utility used to view and troubleshoot data packets.


    # print server


    The computer that manages print services on the network.


    # NT File System (NTFS)


    The preferred Windows 2000 file system, which supports file level security, encryption,
    compression, auditing, and more.


    # Print Services for Unix


    The Windows 2000 service that enables Unix clients to access Windows 2000 print
    resources.


    # printer


    The software component running on the print server that hosts the print service
    on a network.


    # NTFS compression


    A utility for reducing the amount of disk space data consumes on NTFS partition.


    # printer driver


    The piece of software that enables communication with a print device and the operating
    system and applications.


    # NWLink


    The Microsoft implementation of Novell''s IPX/SPX protocol suite.


    # protocol


    A defined set of rules for communication across a network. Most protocols confines
    to one or more layers of the OSI Reference Model. Examples are the File Transfer
    Protocol (FTP), used to transfer files over a network, and the Hypertext Transfer
    Protocol (HTTP), used to deliver Web pages.


    # partition


    A logical separation of space on a hard disk.


    # performance


    The measurement of how efficiently a system runs.


    # Plug and Play


    A technology that allows an operating system to recognize a device, install the
    correct driver, and enable the device automatically.


    # RAID-5 array


    A drive configuration of three or more drives in which data is written to all
    drives in equal amounts'
  merge: -1
  pgno: 407
- img_proc: true
  md: 'to spread the workload. For fault tolerance, parity information is added to
    the written data to allow for drive failure recovery.


    # Recovery Console


    A command-line control system used in system recovery in the event of a failure
    of a core system component or driver. Through the Recovery Console, simple commands
    can be used to restore the operating system to a functional state.


    # Registry


    The hierarchical database that stores all system information in the form of values
    for a Windows system.


    # Registry editor


    The tool used to edit the Registry directly, which should be done only by seasoned
    administrators, and only after a full Registry backup has been performed and verified.


    # Remote Access Service (RAS)


    Remote Access Service enables remote clients to dial in a Windows 2000 server
    to access network resources as though they were physically attached to the network.


    # Remote Administration Mode


    The Windows Terminal Server mode allows you to connect remotely to a server and
    manage it just like you were sitting in front of the console.


    # Safe Mode


    A recovery tool that allows a system to start with a minimal set of device drivers
    and services loaded. Safe Mode helps ease diagnosis by minimizing the number of
    factors that need to be considered when problems occur.


    # security template


    A file that contains built-in guide for configuring security settings on a system.


    # service


    Any action performed by a server, whether through the operating system or upon
    request of a client.


    # Service Pack


    An executable that provides for the replacement of one set of files with another.
    In the case of an operating system (like Windows 2000), Service Packs have been
    a way to distribute bug fixes and fixes.


    # setup disks


    A set of four disks that perform the actions carried out by booting from the Windows
    2000 CD-ROM.


    # Setup Manager


    A utility used to create an answer file for unattended installations.


    # simple volume


    A storage volume that is essentially the same as a basic storage partition; disk
    space is only used from one physical disk.'
  merge: -1
  pgno: 408
- img_proc: true
  md: '# slipstreaming


    A process by which the most up-to-date service packs, fixes, and files are applied
    as part of a Windows Server installation.


    # System Monitor


    MMC snap-in that lets you view real-time performance data contained in the counters
    from your server or other servers or workstations on your network.


    # spanned volume


    A storage volume that can take space from 2 to 32 physical disks to create one
    large apparently contiguous volume. Spanned volumes offer you no fault tolerance,
    thus if one disk should fail the entire set is lost.


    # system partition


    The active partition; in other words, the partition from which your computer''s
    BIOS begins the boot process.


    # System State


    A collection of settings for backup purposes that includes the Registry, the COM+
    Class Registration database, and the system boot files. For a Windows 2000 Server
    that is operating as a certificate server, the System State data also includes
    the Certificate Services database.


    # striped volume (with parity)


    A fault-tolerant disk configuration in which parts of several disks are linked
    together in an array, and parity information written to all disks in that array.
    Should one disk fail, then the data may be reconstructed by the parity information
    written. A striped volume without parity is not fault-tolerant but increases write
    speed to the disk.


    # Terminal Services


    Windows 2000 includes native Terminal Services (previously available to Windows
    NT as an add-on), which allows all clients to be employed as network clients.
    Terminal Services grant remote access to applications and offers limitation controls
    over application access.


    # symmetric multiprocessing (SMP)


    The capability of an operating system to allow any process to run on any processor
    of a multiprocessing server machine, ensuring that the operating system uses all
    available resources.


    # Transmission Control Protocol/Internet Protocol (TCP/IP)


    The most popular protocol suite in today, due to the widespread use of the global
    Internet. TCP/IP consists of many protocols that work together to provide communication
    among differing systems.


    # SysPrep


    A utility that updates the operating system software installation process by creating
    a duplicate of one system and replicating it on other, identical systems.'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# Troubleshooter


    The Windows Help utility that asks questions about a device or service that isn''t
    working properly to help you diagnose the problem.


    # unattended installation


    A method that allows for installation of Windows 2000 Server to be performed with
    little or no user intervention.


    # Uniqueness Database File (UDF)


    A file used in conjunction with an answer file during an unattended installation
    that provides the answers to computer-specific questions which will change from
    machine to machine (for example, the computer name).


    # User Rights


    The actions that the user of a particular account is permitted to perform on a
    system or on network resources.


    # virtual private network (VPN)


    An extension of a network that can be accessed securely through a public network,
    such as the Internet.


    # Windows 2000 Readiness Analyzer


    A utility that can be used to determine the compatibility of hardware in an existing
    computer on which you want to install Windows 2000.


    # Windows Internet Naming Service (WINS)


    A service that dynamically maps IP addresses to NetBIOS computer names used by
    Microsoft operating systems older than Windows 2000. Most modern operating systems
    use DNS rather than WINS for IP address-to-computer translations.


    # WINNT


    The command that launches an installation of Windows 2000 on a MS-DOS or Windows
    3.x computer.


    # WINNT32


    The command that launches an installation of Windows 2000 on a computer running
    a 32-bit operating system, such as Windows NT.'
  merge: -1
  pgno: 410
- img_proc: true
