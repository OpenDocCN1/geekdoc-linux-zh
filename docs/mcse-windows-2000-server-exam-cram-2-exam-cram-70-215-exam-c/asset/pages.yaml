  md: '# Implementing, Monitoring, and Troubleshooting Security


    As you can see in Figure 8.8, group policy objects are divided into two nodes,
    Computer Configuration and User Configuration. In a domain, OU, or site, you can
    make some settings common to a machine, while other settings will vary by user.
    However, remember that in a local object the user settings apply to all users,
    so you can make your settings at either node the result will always be the same.
    Computer settings are applied at startup, whereas user settings are applied at
    logon, with the default refresh interval for both settings to 90 minutes.


    The configuration settings listed under Administrative Templates on both nodes
    are similar available via the System Policy Editor. The other settings in the
    Computer Configuration and User Configuration areas are new to Windows 2000, or
    were only available at the domain level, such as the security settings that were
    previous configured in Windows NT 4.0 by User Manager.


    The Security Settings subnet that is shown in the Group Policy MMC under the Computer
    Configuration node is also available from the Start menu as the Local Security
    Settings MMC, as shown in Figure 8.9. To open the MMC, click Start, Administrative
    Tools, Local Security Settings. If you are working from a domain controller, you
