  md: '# Implementing, Monitoring, and Troubleshooting Security 277


    the control of settings under Group Policy. Group Policies can be used to control
    the user experience by customizing what they can and cannot, and what security
    features are enabled.


    Group Policy in Windows 2000 is vastly superior to the policies that were available
    in Windows NT. For example, in Windows 2000 the policies are not permanent. If
    you decide to disable or remove a policy, the computer is restored to the state
    it was in before you applied the policy.


    In Windows NT, when you made a change in the system policy it resulted in a physical
    change to the Registry of the computer. To change the settings once they were
    applied meant that you had to apply a different set of changes to undo the first
    set. This tattooing of the Registry meant that even if a policy was applied at
    the domain level, it would still be in effect if the computer was removed from
    the domain.


    In addition, there are far more options available via policy in Windows 2000.
    There are hundreds of options available via Group Policy in an Active Directory
    domain. Even working with a standalone member server using Local Computer Policy,
    there are still many options available, including assigning startup or logoff
    scripts, system configuration, and password policy.


    Polices can be controlled at various levels, including at the local system, domain,
    OU, or site level. Policies are always applied in a specific order, with the order
    in which they are applied governing the effective settings. For example, the policy
    order used in Windows 2000 is


    +   1. Windows NT 4.0 Policies (a.k.a. System Policies)


    +   2. Local Group Policies


    +   3. Site Group Policies


    +   4. Domain Group Policies


    +   5. OU Group Policies


    Because of this hierarchy, if there are conflicting settings in different policies,
    the policy that was applied last has precedence. A popular acronym that is used
    to remember this order of precedence is LSDOU, for Local, Site, Domain, and OU.


    This inheritance of policy settings can be blocked by an administrator or user
    with the appropriate permissions, so that a policy that was configured at the
    site level can be prevented from being applied to a particular OU. This is called
    blocking inheritance. The administrator also has the option to prevent'
