    # Creating a Remote Access Policy and Profile


    To permit a user to dial-in access to a RRAS server, she must have permission
    granted via dial-in properties of her user account and via a remote access policy.
    Remote access policies give the administrator more granular control over remote
    access. For example, the administrator is able to grant or deny access based on
    group membership, time of day, day of week, or type of access requested. These
    types of items are are known as attributes within a remote access policy. We discuss
    how to add these attributes to a policy a little later. In addition, the administrator
    can use policies to specify the type of encryption used, the maximum session time,
    and callback policies.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_280_0.png)


    > The default remote access policy is to allow access to users who have dial-in
    permission enabled in their user account settings.


    For the user to have authorization to connect remotely, he has to be authorized
    via the Dial-in Properties tab of his user account object in Active Directory.
    In addition, his connection properties must match at least one of the requirements
    that were configured in the remote access policy, such as correct time of day,
    and so on.


    To create a remote access policy


    +   1. From the left pane of the RRAS MMC, right-click the Remote Access Policies
    node under the server that you are configuring and select New Remote Access Policy
    from the popup.'
