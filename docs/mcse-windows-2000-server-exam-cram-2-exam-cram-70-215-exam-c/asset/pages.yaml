    # Defragmenting Disks


    It was once thought that the NTFS file system could not become fragmented. Windows
    NT 4.0 brought this belief to the forefront due to the fact that it did not ship
    with a built-in defragmentation utility. Unfortunately, it was soon discovered
    that NTFS becomes fragmented just as FAT and FAT32 do, thus the Disk Defragmenter
    tool was reintroduced with Windows 2000. Windows 2000 includes a “light” version
    of Executive Software’s Diskeeper for performing disk defragmentation.


    > Fragmentation occurs when the operating system saves a file to the first available
    space on the hard disk, instead of placing it neatly into an available space or
    the amount of space remaining. Over time, fragmentation can slow down or degrade
    disk performance. It''s a good idea to analyze your drives for fragmentation once
    a month.


    You can access the Disk Defragmenter utility from any one of the following five
    methods:


    +   - On the Tools tab of the volume’s Properties dialog box, click the Defragment
    Now button.

    - From the Start menu, click Programs, Accessories, System Tools, Disk Defragmenter.

    - From within the Computer Management console, click Disk Defragmenter, as shown
    in Figure 6.13.'
