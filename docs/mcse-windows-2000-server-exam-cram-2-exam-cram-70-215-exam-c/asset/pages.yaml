    If an Active Directory object is accidentally deleted, it is possible to restore
    the object from a backup tape by performing a partial authoritative restore. This
    is accomplished by restoring from the last backup before the object was deleted.
    The procedure to perform the restore is very similar to the full Active Directory
    authoritative restore that was shown in the previous section.


    > > NOTE When performing a partial authoritative restore, it is very important
    to only restore the specific item that needs to be restored. If the entire Active
    Directory is restored, you could inadvertently overwrite newer objects. For example,
    the naming context of Active Directory contains the passwords for all of the computer
    accounts and trust relationships. These passwords are automatically changed approximately
    every seven days. If the existing values are overwritten by the restore, and the
    passwords have been negated because backup was created, the computer accounts
    will be locked out of the domain and the trust relationships will be dropped.
    For more information article Q216243,"Impact of Authoritative Restore on Trusts
    and Computer Accounts" in the Microsoft Knowledge Base.


    To restore a deleted Active Directory object:


    +   1. Perform steps 1 through 10 of the previous procedure to restore the AD
    database from tape.


    +   2. When the Confirm Restore dialog box appears, click OK.


    +   3. After the restore has completed, reboot the domain controller. From the
    boot menu, when you see the message, "Please Select The Operating System To Start,""
    press the F8 key.


    +   4. From the Advanced Options menu, select Directory Services Restore Mode.
    Press Enter.


    +   5. On the Windows 2000 Boot menu, select the operating system to start and
    press Enter.


    +   6. The server will boot into Directory Services Repair Mode. From the Windows
    2000 logon screen, log on using the Directory Services'
