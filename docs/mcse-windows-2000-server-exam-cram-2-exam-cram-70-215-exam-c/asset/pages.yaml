  md: '# 286 Chapter 8


    domain controller. The templates can be applied as-is using the Import Policy
    option from the Local Security Settings MMC, as discussed in the previous section.
    Or the individual settings of the template can be copied, past-ed, or merged with
    other templates.


    The security templates are supplied for four different security levels:


    +   - Basic—These templates contain the equivalent security settings of a fresh
    Windows 2000 installation. They are useful for returning a Windows 2000 installation
    back to the default settings.


    +   - Compatible—This template sets the security level of a Windows 2000 computer
    to the equivalent of a Windows NT 4.0 computer. This is useful for running legacy
    applications that cannot run under the tighter security settings in Windows 2000.


    +   - Secure—This template has more restrictive settings for password policy,
    auditing, and Registry access. In addition, it removes all users from the Power
    Users group.


    +   - Highly Secure—This template can only be used in a pure Windows 2000 environment.
    Because of the security settings, it will be unable to talk to any downlevel systems.
    All network communications will be digitally signed and encrypted.


    Windows 2000 systems that were upgraded from Windows NT 4.0 or ear-er will have
    security settings roughly equivalent to the Compatible template. The default security
    settings are only applied when a clean Windows 2000 installation is installed
    onto a NTFS partition.


    > Security templates are not supported if Windows 2000 is installed on a File
    Allocation Table (FAT) file system.


    While you can import the security templates using the Local Security Policy MMC,
    to configure them you need to use the Security Templates snap-in. The snap-in
    is not available by default; you must create a new MMC, or add it to an existing
