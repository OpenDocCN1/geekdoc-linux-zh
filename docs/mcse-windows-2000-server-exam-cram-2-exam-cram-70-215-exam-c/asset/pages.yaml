    # The Dynamic Host Control Protocol (DHCP)


    Dynamic Host Configuration Protocol (DHCP) is a TCP/IP standard designed to provide
    client machines with IP addresses dynamically at boot time. The client has use
    of this IP address for a predetermined amount of time, called a *lease-duration*.
    Before the lease expires, the client reconnects to'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Chapter 7


    The DHCP server and renews the lease. This process frees administrators from maintaining
    static IP addresses, and ensures consistency of IP configuration across the LAN.


    Once a client receives an IP address from a DHCP server, a renewal process occurs
    as the lease approaches expiration. After 50 percent of the configured lease duration
    has elapsed, the client attempts to contact the DHCP server. The client that is
    requesting to renew its IP address broadcasts a DHCPREQUEST message. The DHCP
    server, if available, responds with a DHCPACK, granting the client''s request
    to renew the IP address. Also, information about other DHCP options is included
    in this reply. If any information has changed since the client first obtained
    its lease, the client updates its configuration accordingly.


    If the server from which the client originally leased the IP address does not
    respond, the client again attempts to renew the IP when 87.5 percent of the lease
    duration has elapsed. At this point, the client attempts to renew its current
    lease with any available DHCP server. If a server responds with a DHCP offer message
    (DHCPOFFER) to update the current client lease, the client can renew its lease
    based on the offering and continue operation.


    If the lease expires and no server has been contacted, the client must immediately
    discontinue using its leased IP address. The client then follows the same process
    used during its initial start operation to obtain an IP address.


    You install DHCP using the procedure that was discussed in the previous section.
    After installation, open the DHCP MMC, as shown in Figure 7.15, and right-click
    on the server name and select New Scope. This opens the New Scope Wizard. Scopes
    determine the pool of IP addresses from which a DHCP server can assign IP addresses.
    Every DHCP server must be configured with at least one scope.


    Follow the wizard''s prompts and configure the following:


    +   * Scope Name—This should be something descriptive.


    +   * IP Address Range—This is the starting and ending IP addresses of the range
    of IPs that you want to distribute to clients. The subnet mask is also entered
    here.


    +   * Add Exclusions—If you are going to manually assign any static IP addresses
    that are included in the previously defined range of IP addresses, you should
    exclude them here. This prevents DHCP from leasing an IP address that is earmarked
    for use on a specific device. If this specification is not made for the static
    addresses, an IP address conflict occurs, causing one or more computers to not
    function.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Configuring and Troubleshooting Windows 2000 Network Connections 235


    Lease Duration—This is the length of time that the IP address is be leased to
