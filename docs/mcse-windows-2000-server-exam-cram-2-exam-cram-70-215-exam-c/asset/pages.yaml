  md: '# Practice Questions


    # Question 1


    +   Which of the following tools allow you to see how much memory is being used
    by your applications? [Check all that apply:]

    - A. System Monitor

    - B. Performance Logs and Alerts

    - C. Task Manager

    - D. Performance Monitor


    Answers A and C are correct. Both Task Manager and System Monitor allow you to
    see the current performance of your applications. The Performance Logs and Alerts
    snap-in only allows you to log data and create alerts. The Performance Monitor
    is the utility used in previous versions of Windows. Therefore, answers B and
    D are incorrect.


    # Question 2


    +   Which of the following system views are available using Task Manager? [Check
    all that apply.]

    - A. Applications

    - B. Processes

    - C. Network Performance

    - D. Disk Activity


    Answers A and B are correct. Task Manager provides three views, Applications,
    Processes, and Performance.


    # Question 3


    +   Which of the following performance measurements are available from the Task
    Manager? [Check all that apply.]

    - A. Disk I/O

    - B. Memory Usage

    - C. CPU Time

    - D. Page Faults'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Chapter 5


    Answers B, C, and D are correct. Task Manager provides the memory usage and CPU
    time as default measurements. Page faults and many other measurements can be selected
    by selecting View, Select Columns on the menu bar.


    # Question 4


    +   If you are having performance problems with your server, which devices should
    you monitor closely? [Check all that apply.]

    - A. Memory

    - B. Video

    - C. Application load time

    - D. Processor


    Answers A and D are correct. Although video performance might be important on
    a workstation, on a server the big four are memory, processor, physical disk,
    and network. Answer C is incorrect because application load time is not a device.


    # Question 5


    +   Which of the following utilities allows you to view real-time performance
    data? [Check all that apply.]

    - A. System Monitor

    - B. Performance Logs and Alerts

    - C. Task Manager

    - D. Performance Monitor


    Answers A and C are correct. The Performance Logs and Alerts snap-in only allow
    you to log data and create alerts. The Performance Monitor is the utility used
    in previous versions of Windows. Therefore, answers B and D are incorrect. Both
    Task Manager and System Monitor allow you to see the real-time performance of
    your applications.'
  merge: -1
