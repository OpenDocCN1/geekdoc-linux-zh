- img_proc: true
  md: '# What to Expect at the Testing Center


    When you arrive at the testing center where you scheduled your exam, you must
    sign in with an exam coordinator and show two forms of identification, one of
    which must be a photo ID. After you''ve signed in and your time slot arrives,
    you''ll be asked to deposit any books, bags, cell phones, or other items you brought
    with you. Then, you''ll be escorted into a closed room.


    All exams are completely closed-book. Although you are not permitted to take anything
    with you into the testing area, you are furnished with a blank sheet of paper
    and a pen (in some cases, an erasable plastic sheet and an erasable pen). Immediately
    before entering the testing center, try to memorize much of the important material
    as you can, so you can write information on the blank sheet as soon as you are
    seated in front of the computer. You can refer to this piece of paper during the
    test, but you''ll have to surrender the sheet when you leave the room. Because
    your timer does not start until you begin the testing process, it is best to do
    this while the information is still fresh in your mind.


    You will have some time to compose yourself, write down information on the paper
    you''re given, and take a sample orientation exam before you begin the real thing.
    We suggest you take the orientation test before your first exam (because the exams
    are generally identical in layout, behavior, and controls, you probably won''t
    need to do this more than once).


    Typically, the room has one to six computers, and each workstation is separated
    from the others by dividers. Most test rooms feature a wall with a large picture
    window or a closed-circuit video camera. This permits the exam coordinator to
    monitor the room, prevent exam-takers from talking to one another, and observe
    anything out of the ordinary. The exam coordinator will have preloaded the appropriate
    Microsoft certification exam (for this book, Exam 70–215), and you''ll be permitted
    to start as soon as you''re seated in front of the computer.


    All Microsoft certification exams allow a certain maximum amount of time in which
    to complete your work (this time is indicated on the exam by an onscreen counter/clock,
    so you can check the time remaining whenever you like). All Microsoft certification
    exams are computer-generated. In addition to multiple choice, you will encounter
    select and place (drag and drop), drag and connect, build list and reorder a tree
    (categorization and prioritization), (list prioritization) on most exams. The
    questions are constructed to check your mastery of basic facts and figures about
    Microsoft Windows 2000'
  merge: -1
