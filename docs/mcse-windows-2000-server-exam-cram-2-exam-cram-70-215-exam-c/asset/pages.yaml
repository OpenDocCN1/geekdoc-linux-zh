  md: '# Using the Emergency Repair Disk


    To repair your system using the ERD, you must start from the Windows 2000 CD-ROM
    or the four startup floppies. During the setup process, select the Repair option.
    When prompted for the type of repair, you have the option of selecting a Manual
    Repair or a Fast Repair. If you select the Manual Repair option, you will be presented
    with the following options:


    +   - Inspect Startup Environment—This option inspects the files in the partition
    to make sure that they are not missing or corrupted. If necessary, the files are
    copied from the Windows 2000 CD-ROM.

    - Verify Windows 2000 System Files—This option verifies the system files by comparing
    them bit by bit with the files on the Windows 2000 CD-ROM. If there is a difference,
    you are asked whether or not to replace it.

    - Inspect Boot Sector—The option inspects the boot sector and attempts to repair
    it, if necessary.


    If you select the Fast Repair option, it automatically performs the three previous
    tasks and also inspects and attempts to repair the Registry. If it cannot repair
    the Registry, it will copy the saved Registry files from the %system-root%Regback
    folder that were saved when you created the ERD.


    ![](img/7b2cdf076a380b70409b2e8f4835fae3_207_0.png)


    > You should be familiar with the various recovery methods for Windows 2000, and
    when and how to use each one.'
  merge: -1
