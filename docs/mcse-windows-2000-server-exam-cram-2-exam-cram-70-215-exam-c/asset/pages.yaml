  md: '# Glossary


    Active Directory

    A centralized resource and security management, administration, and control mechanism
    in Windows 2000, which is used to support and maintain a Windows 2000 domain.
    The Active Directory is hosted by domain controllers.


    attended installation

    A manual installation setup process. Typically this requires a person to be at
    the system to install software and answer setup questions posed by the installation
    program.


    answer file

    A text file that provides answers to questions during an unattended installation.


    auditing

    The recording of an occurrence of a defined event or action. For example, you
    might want to audit a failed login attempt after four invalid tries for security
    purposes; such an incident could indicate someone trying to break into the system.


    AppleTalk

    The Apple Macintosh network protocol stack.


    basic disk

    A Windows definition for a standard hard disk that can contain up to four primary
    partitions, or three primary partitions and one extended partition, and unlimited
    logical drives.


    Application Mode

    A mode of Windows Terminal Server operation in which an unlimited number of connections
    are supported. However each connection requires a license, called a Terminal Server
    Client Access License (TSCAL).**'
  merge: -1
  pgno: 402
- img_proc: true
