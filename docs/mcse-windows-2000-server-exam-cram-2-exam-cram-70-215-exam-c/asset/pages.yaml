  md: '# Question 3


    Andrea is the administrator in charge of your organization''s Windows 2000/SQL
    2000 servers. Last night, one of her SQL servers experienced a failure of one
    of the hard disks in its RAID-5 array. What must Andrea do to get the SQL server
    back into operation at full capability? [Choose all that apply.]


    A. Edit the boot.ini file to reflect the location of the boot partition.

    B. Replace the failed disk.

    C. Perform a restoration of data from the most recent backup set.

    D. Use Disk Management to repair the RAID-5 array.


    Answers B and D are correct. Andrea needs only to replace the failed hard disk
    and use the Disk Management utility to rebuild the RAID-5 array. Editing of the
    boot.ini file is only required when the primary disk in a mirrored set fails,
    then answer A is incorrect. Because RAID-5 arrays are fault tolerant, no restoration
    of data using Windows Backup will be required. The parity information will be
    used by Windows 2000 to rebuild the data on the failed disk, thus answer C is
    incorrect.


