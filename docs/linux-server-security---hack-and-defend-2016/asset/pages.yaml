- pgno: 97
  md: '# Chapter 8: Malware Detection


    You can tell that in addition to its clever threat detection, LMD manages to combine
    comprehensive reporting and the quarantining of threats, among many other features.
    The ability to receive summary reports on a daily basis through e-mail via a cron
    job is clearly useful to make sure the detection system is running as expected.
    LMD''s ability to plug into Apache and directly monitor file uploads is something
    that I will touch on. If this is the only way that a user can get files onto a
    system, then it is clearly a bulletproof choice.


    # Monitoring Filesystems


    One method of watching for changes on filesystems is by using notify. You need
    a compatible kernel to work correctly. Fear not, because notify is reportedly
    included in kernels from version 2.6.13 and after, so most Linux builds will have
    this capability.


    The sophisticated notify can monitor, in real time, single files and directories
    for changes, altering configured software if any changes are discovered. If a
    piece of users space is caught making changes, then notify will pass on details
    about the user or consider it an event and report it immediately.


    By creating a watch list, notify can keep track of unique watch descriptors that
    associate to each item in its watch. Although notify will not pass on details
    about the user or process that has changed a file or directory, the fact that
    a change has taken place is enough to satisfy most applications. If notify isn''t
    available, then the lower approach of polling a filesystem or manually running
    scans will usually apply. In the case of checking for changes on networked filesystems,
    any configured software will need to resort to polling the filesystem using a
    predefined frequency. This is because recursive filesystems are harder to keep
    track of.


    Unfortunately, the pseudo filesystems, which include /proc, /sys, and /dev/pts,
    aren''t visible to notify. This shouldn''t be of too much concern, however, because
    "real" files don''t exist in these paths, but rather the ephemeral workings of
    a system, which change frequently.


    # Installation


    Let''s now looking at install LMD on both Debian and Red derivatives. First, we
    will check that the wget package is installed with the following command on Red
    Hat:


    ```

    # yum install wget

    ```


    The alternative on Debian is the following command:


    ```

    # apt-get install wget

    ```


    Many distributions include wget by default, so this may not be needed.'
