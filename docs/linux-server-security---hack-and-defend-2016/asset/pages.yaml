- pgno: 121
  md: '# SQL Injection Attacks


    One of the most popular types of online attacks is known as SQL injection, sometimes
    abbreviated as SQLi. These attacks involve the insertion of database code using
    Structured Query Language (SQL), where attackers can retrieve data from databases
    or overwrite existing data.


    You might be surprised to learn that, according to OWASP (the Web Application
    Security Project), which is a charitable organization that promotes the securing
    of software, SQLi was the number one threat to online services in 2013, and listed
    as the most common threat at https://www.owasp.org/php/Top_10_2013-Top_10.


    This chapter looks at what attacks involve, how to protect your websites against
    them, and finally how to launch yourself for the purposes of penetration testing.


    Needless to say, this is a wide and complex area that requires a degree of background
    knowledge to carry out even more sophisticated attacks. You might be surprised
    how easy it is, however, running only a handful of commands and with only a little
    database knowledge, to bring a vulnerable service to its knees. For reason alone,
    it is imperative that IT professionals be aware of the risks SQL injections pose
    and how to mitigate their effects.


    # History


    Considering its simplicity, the fact that SQLi is so effective makes it a formidable
    type of attack.


    Take note, junior developers, when it comes to security matters, sysadmins tend
    not to be directly responsible for such attacks occurring. This is because of
    the time, the exploits are possible due to code that does not escape special characters.
    In addition to its simplicity, another cause for concern is that this type of
    attack has been reportedly known about since 1998. An issue of Phrack Magazine,
    published in December of that year, first announced a broad, sweeping vulnerability
    against websites. The horror began to unfold over time, and it became obvious
    that several automated tools could be used to sweep the web, looking for sites,
    and then deface or steal data from them as saw fit.


    It didn''t stop there, however. As phishing attacks become more popular (where
    attackers trick users into revealing information about themselves), cunning went
    about completely rebranding a website, by injecting the necessary code to persuade
    a visitor that they were visiting a bona website.


    For a number of years, I ran a small co-location ISP for relatively tech-savvy
    customers. On at least three occasions, our co-located server customers, who had
    unwittingly been


    Linux® Server Security: Hack and Defend, Chris Binnie© 2016 by John Wiley & Sons,
    Inc. Published by John Wiley & Sons, Inc.'
