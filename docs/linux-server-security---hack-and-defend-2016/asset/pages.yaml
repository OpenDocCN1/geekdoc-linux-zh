    # Hash Identification


    There are a couple of things to consider before using Hashcat. You first need
    to know the type of hash that you are trying to recover the password from.


    Let''s think about Linux user passwords for a moment. The default hash algorithm
    in use has changed periodically over time and can also be distribution dependent.
    In the past, common defaults were MD5 and DES, but SHA512 is now no commonplace.


    It helps Hashcat if you can identify what hash type you are attacking. You can
    run the following command to discover which hashing algorithm is in use:


    ```

    # authconfig --test | grep hash

    ```


    If you are concerned about the security on your machine and want to upgrade the
    hashing algorithm used by your machine''s Shadow passwords, then you can use the
    following command:


    ```

    # authconfig --passalgo=sha512 --update

    ```


    In this example, you can replace sha512 with sha256 if you want. However, that
    in order to make this change effective, you need to get your users to change their
    passwords'
