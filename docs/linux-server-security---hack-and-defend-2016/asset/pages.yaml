- pgno: 111
  md: '# Chapter 9: Password Cracking with Hashcat


    These algorithms shouldn''t be confused with encryption algorithms such as 3DES,
    Triple DES, Crypt, Blowfish, and Rijndael.


    # Using Hashcat


    The well-designed, accommodating Hashcat is bundled with a large number of example
    hashes and wordlists to experiment with. Let''s look at how you can work with
    them.


    # Hashcat Capabilities


    The general approach of password-cracking tools tends to be one of importing a
    password file that is full of encrypted data and then generating an output file
    the input file has been processed. Let''s look at some of the options that are
    available with the Hashcat tool. I will touch upon some of the other tools that
    are available from your software in a moment.


    Hashcat supports many different types of hashing algorithms, such as MD5, SHA1,
    and NTLM. In fact, if I''m counting correctly, the number exceeds an incredible
    90 varieties. Hashcat claims it can break the MD5 versions of popular applications
    such as WordPress and Cisco-ASA, and Drupal7 passwords. In addition to its impressive
    algorithm support, the many different attack modes are available include brute
    forcing passwords, dictionary attacks, rule-based attacks, and fingerprint attacks.


    # Installation


    At the time of writing, the current version of Hashcat is v2.00. To install Hashcat
    (assuming you can''t find it in your distribution''s repositories), you can head
    to the website and download the latest binaries. The direct link for v2.00 is:
    https://hashcat.net/files/hashcat-v2.00.7z.


    The version 2.00 link is visible at the top of the web page at https://hashcat.net/hashcat/.
    You should check this page to ensure you are downloading the latest version.


    Once downloaded, it''s just a case of extracting the .7z file, and making sure
    you have the correct permissions to write files to the directory to which you
    have extracted the files. If you get stuck extracting on any Debian derivatives,
    then you can install the 7za package with the following command:


    ```

    # apt-install p7zip-full

    ```'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Chapter 9: Password Cracking with Hashcat


    On Red Hat derivatives, you may need to add a repository. Having done so, the
    following command will hopefully work for you:


    ```

    # yum install p7zip p7zip-plugins

    ```


    Next, to extract the compressed files and preserve the directory names with x,
    run the 7za file as follows:


    ```

    # 7za x hashcat-2.00.7z

    ```


    Note the lack of a minus sign before the x, which is the usual convention. That''s
    not a typo.


    Having done that, you can now cd into the newly created hashcat-2.00/ directory,
    which contains many files and subdirectories. In particular interest are the docs
    and examples directories, which you can explore to your heart''s content. Fear
    not, you''ll be able to how to run the Hashcat executable in a moment.


    Incidentally, if you''re interested in the latest development version, there''s
    a GitHub page at https://github.com/hashcat/hashcat. It also includes documentation
    and links to the wiki, which should be of interest.


    If you''re running the sophisticated penetration-testing suite, Kali Linux, then
    you should be able to install Hashcat, thanks to the fact that it''s built-in:


    ```

    # apt-get install hashcat

