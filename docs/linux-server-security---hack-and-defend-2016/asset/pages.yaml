  md: '# Chapter 4: Denying Service


    # DNS Resolvers


    Near the de of 2014, another attack came to light. It''s still somewhat debatable
    if this was actually intended to be a reflection attack, I''ll discuss it here
    to add to your knowledge on the subject. As part of their services, Google offers
    two prominent DNS resolvers with memorable IP addresses:


    ```

    8.8.8.8

    8.8.4.4

    ```


    These resolvers resolve DNS lookups for any individual or device that doesn''t
    have a full-fledged DNS server available. These DNS resolvers will respond with
    any lookups, request from their cache or via a fresh lookup if a suitable answer
    doesn''t exist in their cache. OpenDNS offers similar services but openly discusses
    the benefits of filtering your queries, for the purposes of alerting you, for
    example, if you attempt to visit a previously reported phishing site. Their IP
    addresses are also easy to remember, resilient, and reliable:


    ```

    208.67.222.222

    208.67.220.220

    ```


    (These) free services are widely adopted, probably because they offer the convenience
    of not having the overhead of running DNS servers locally. However, thanks to
    their memorable IP addresses and outstanding reliability, as with many popular
    services, these well-meaning providers present another high-value target that
    is attractive to attackers.


    Clearly there are very good to pay attention to how you use services within your
    production infrastructure, thanks to your lack of control they should be compromised.
    The most obvious attack, in terms of DNS cache poisoning where the querying machine
    is given a false answer and sent to an illegitimate IP address, which could potentially
    infect the requester or actor in some other way. One of the many DNS cache poisoning
    attacks are so-called Kaminsky-style attacks (http://dankaminsky.com), which don''t
    just poison DNS records but rather control of the authority for domains name themselves.
    There are some well-written information about security researcher Dan Kaminsky''s
    findings at http://unixw.net/techtips/guide-kaminsky-dns-vuln.html.


    Because of their impact, the significance of DNS attacks should not be underestimated.
    Google''s DNS resolvers repeatedly serve in the region of 150 billion queries
    every day.


    The 2014 attack, which on the surface included Google''s DNS resolver IP addresses
    in the last quarter of year, was picked up by popular online security channels.
    For example, the Internet Storm Center (https://isc.sans.edu) offered advice on
    spotting attacks


