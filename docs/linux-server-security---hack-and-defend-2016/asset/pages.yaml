- pgno: 119
  md: '# Chapter 9: Password Cracking with Hashcat


    GPUs are much faster than CPUs (when set up correctly) because they are solely
    designed to crunch numbers quickly, usually to process graphics. While obviously
    designed for speed themselves, in terms of performance, CPUs can get distracted
    with their additional, inclusive feature sets, causing a reduction in throughput.
    As result, GPUs are a good choice for computing large amounts of data that can
    be optimized much better. It is also possible to scale GPU output almost seamlessly
    by connecting them together in a chain, making it easier to harness their combined
    power. To give you an idea of how fast GPUs can be, if you were using rainbow
    tables and the keyspace (of the 95 characters available on a US keyboard), you
    might hit 10 trillion plain-text tests per second!


    In terms of learning Hashcat and ocHashcat, I would recommend getting Hashcat
    working first and reading up on how to get your video card''s GPU drivers working.
    There''s more information at http://hashcat.net/ocHashcat/


    If it causes confusion, ocHashcat-plus is no longer in use and is considered deprecated.
    As a result, there is no benefit in the "plus" version.


    # Hashcat-Utils


    One additional component of the Hashcat suite that is also worth mentioning is
    a group of utilities called Hashcat-utils. This collection of useful tools can
    be downloaded from http://hashcat.net/wiki/doku.php?id=hashcat_utils.


    The tools include combinator, which is a standalone program from which you can
    run combinator attacks. You can find more information at https://hashcat.net/wiki/doku.php?id=combinator_attack.


    You can also trim and cut up a wordlist with the cutb tool, which you can use
    to clean up common, unwanted prepended or appended characters in a wordlist file.


    Another tool in the bundle, ripl, is similar to the Unix-type command, and simply
    removes duplicate files, after comparing a file to one or more other files.


    It''s definitely worth exploring these utilities further to increase your knowledge
    of how Hashcat works.


    # Summary


    In this chapter, you looked at some of the theory behind password attacks. I also
    covered the importance of the number of combinations that a character set includes,
    the length of passwords, and how their combination affects keyspace. Finally,
    I described hashing and salting, which ensure that the time it takes to crack
    a password is significantly increased.'
