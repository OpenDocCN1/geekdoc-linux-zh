- pgno: 72
  md: '# Chapter 6: Logging Reconnoiters


    In the code snippet, a server called noid experiences probes from a host called
    recce. Recce is reconnoiting to see if the server is online.


    # Iptables


    You can also run the iptables command, which uses Netfilter''s kernel-based firewall:


    ```

    # iptables -I INPUT -p icmp --icmp-type 8 -m state --state

    NEW,ESTABLISHED,RELATED -j LOG --log-level=1 --log-prefix "Pings

    Logged "

    ```


    If you''re paying attention, you may have spotted the 8 number being used as the
    --icmp-type value. In Table 6.1, you can see the codes that are used by ICMP.
    You can find more information at its Request for Comments (RFC) page, at https://tools.iet.org/html/rfc792.
    According to this page, ICMP has been around since 1981 or thereabouts,

    When the Internet was a very different animal.


    # TABLE 6.1 The ICMP Codes from the Kernel Source File, include/linux/icmp.h


    | Type | Code |

    | 0 | Echo Reply |

    | 3 | Destination Unreachable * |

    | 4 | Source Quench * |

    | 5 | Redirect |

    | 8 | Echo Request |

    | B | Time Exceeded * |

    | C | Parameter Problem * |

    | D | Time stamp Request |

    | E | Time stamp Reply |

    | F | Info Request |

    | G | Info Reply |

    | H | Address Mask Request |

    | I | Address Mask Reply |


    As a reaction to the attacks that used ICMP, changes were made to the Linux kernel
    over time. Thanks to the abuse of ICMP, the functions marked with an asterisk
    in Table 6.1 are rate limited by default in modern implementations of the kernel
    (since Linux 2.4.10).'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Chapter 6: Logging Reconnoiters


    In the following code, you will see the source and destination IP addresses (SRC=10.10.10.200
    and DST=10.10.10.10) involved in the ping traffic exchange logged to the /var/log
    messages file.


    ```

    Feb 21 17:19:34 noid.chribinnie.tld kernel: Pings Logged IN=eth0

    OUT=MAC=00:61:24:3e:1c:ef:00:30:16:3c:14:3b:02 SRC=10.10.10.200

    DST=10.10.10.10 LEN=80 TOS=00 PRETT=64 ID=0 PROTO=ICMP

    TYPE=8 CODE=0 ID=4097 SEQ=1

    Feb 21 17:19:34 noid.chribinnie.tld kernel: Pings Logged IN=eth0

    OUT=MAC=00:61:24:3e:1c:ef:00:30:16:3c:14:3b:02 SRC=10.10.10.200

    DST=10.10.10.10 LEN=80 TOS=00 PRETT=64 ID=0 PROTO=ICMP

    TYPE=8 CODE=0 ID=4097 SEQ=3

    ```


    If we used tcpdump or iptables to log traffic, I would be keen to reduce the logs.
    The first reason for this would be to stop (knowingly or otherwise) from causing
    disk space problems by creating massive log files, after inundating with ICMP
    traffic. The second reason would be to keep the significant logging noise levels
    to a minimum so that I could read the log and see what I was looking for.


    Assuming that you wisely felt uncomfortable having tcpdump running in the background
    all year, for reasons of system stability, let''s use the iptables example to
    strip out the information that you need.


    Let''s look at a high-level overview of how you might go about stripping the noise
    out of a log. For clarity, you would probably want your reconnoiter to be dumped
    to a separate file from syslog.


    I''m going to use the excellent, "rocket-fast" syslog server, rsyslog, as an example
    (you can find more information at www.rsyslog.com). This is because Red Hat and
    Debian (and their many derivatives) use rsyslog by default, so there''s a good
    chance you will have access to it.


    Let''s take another look at the iptables examples from a moment ago:


    ```

    # iptables -I INPUT -p icmp --icmp-type 8 -m state --state

    NEW, ESTABLISHED, RELATED -j LOG --log-level=1 --log-prefix "Pings

    Logged"

    ```


    You''re now paying closer attention to the --log-prefix option, as shown here:


    ```

    --log-prefix "Pings Logged "

    ```'
