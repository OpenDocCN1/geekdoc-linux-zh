- pgno: 49
  md: '# Denying Service


    There is no denying that without certain critical services working, the Internet
    would grind to a halt. Many users would suffer from degraded performance while
    others might simply experience a complete outage. Along with the DNS (Domain Name
    System), the NTP (Network Time Protocol) is key to the successful operation of
    the Internet. In this chapter, I will spend some time describing how attackers
    might try to prevent critical services from working correctly.


    Unfortunately for those who are responsible for keeping the Internet running,
    it''s possible to attack large sections of the Internet''s DNS and NTP infrastructure
    using a variety of methods. For example, DDoS (Distributed Denial of Service)
    attacks of the past were primarily designed to take an online service down or
    disrupt its users in a highly frustrating manner, possibly in order to gain a
    competitive advantage or receive payment of a ransom. Current thinking is that
    such attacks are now used as screens to disclose multiple security exploits.


    One report, published in 2014 by Kaspersky Lab, estimated that small- to medium-sized
    businesses would spend around US$52,000 dollars on a DDoS attack. That figure
    were to rise to US$444,000 for enterprises that experienced such attacks. When
    factor in loss of reputation, customer ill at having use online services (if they
    are available), and payment transactions failing (which might require manual effort
    to be resolved), guarding against such infrastructure is a worthwhile activity.
    Most worrying is that of 3,900 organizations across 27 countries that took part
    in the survey report was based on, “[m]ore than one-third (38%) of businesses
    which provide financial services or public-facing online services experienced
    a DDoS attack from April 2013 – May 2014.


    The methods used to cause denial of access to critical online services come in
    many forms. Having seen an increase in reflection attacks (amplification attacks
    included) over the past couple of years, on both NTP and SNMP services, I will
    describe some of the history behind them, what is involved, and how to mitigate
    their potentially disastrous effects.


    # NTP Infrastructure


    I have touched upon the fact that critical infrastructure services are common
    targets for attacks because they present a high-value prize to an attacker. As
    DNS and NTP protocols have evolved over the years, security has, of course, factored
    into their design. Consider NTP for a moment.


    As you expect, there are built-in security mechanisms to assist with the tuning
    of NTP as a service. For example, some top-level stratum-1 servers adopt a “Closed
    Account” option, and these servers can''t be used without prior consent. Conversely,
    as you expect, as long as you adhere to their usage policies, Access servers are
    available for polling. Those Restricted Access


    Linux® Server: Hack and Defend. Chris Binnie

    © 2016 by John Wiley & Sons, Inc., Published by John Wiley & Sons, Inc.'
