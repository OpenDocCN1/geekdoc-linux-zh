    # Monitoring Modes


    Now that you have installed your package, let''s look at what LMD can monitor
    for you on

    system. A good place to start is if you consider LMD''s monitoring modes.


    LMD offers a number of monitoring modes that can be configured to check different
    parts

    of the filesystem. As you will see, LMD uses the binary executable called Maldet,
    short for

    "malware detection."


    To monitor a system component, you can use the -m option, also written as --monitor.

    What LMD can monitor may be broken down into users, files, and paths. The website
    gives

    y the following example of how the three modes might look on the command line:


    ```

    # maldet --monitor users

    # maldet --monitor /root/monitor_paths

    # maldet --monitor /home/mike/home/ashton

    ```


    By using this first option,--monitor users, LMD will monitor any unique identifiers

    (UIDs) on the system that are above a minimum UID setting. (The config option
    that can be

    set in the config file is called notify_minuid.)


    The second monitoring example is a file, spaced by new lines, that can contain
    the files you\want to monitor. In this case, the list of files is located in the
    file /root/monitor_paths.


    For the third option, you could potentially create a very long command line by
    adding a

    comma-separated list of filesystem paths to keep an eye on.


    8.3 shows the output of running the following command:


    ```

    # maldet -m /home/ubuntu

    ```'
