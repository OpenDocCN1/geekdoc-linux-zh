  md: '# Chapter 5: Nping


    On Debian derivatives, simply use the following command to install the Nmap package:


    ```

    # apt-get install nmap

    ```


    On Red Hat derivatives, install Nmap using this command:


    ```

    # yum install nmap

    ```


    # TCP


    Back to the TCP (Transmission Control Protocol) example. You''ll run the following
    command against your local machine so that there are no firewall issues to be
    concerned with and you won''t upset other sysadmins:


    ```

    # nping -c1 --tcp -p 80,443 localhost

    ```


    Here you''re sending one ping (with -c1 count) over TCP, to TCP ports 80 and 443,
    to your local machine. The output from this command might look like Listing 5.1.


    LISTING 5.1 Having your first TCP pings with Nping, you are welcomed with a good
    level of detail.


