- pgno: 30
  md: '# Chapter 2: Digitally Fingerprint Your Files


    I''m sure you''ll agree that''''s what you''re looking for. Having your new machine''s
    build, you can simply install md5deep and run it across your entire filesystem
    (or at least parts of it). One serious caveat is to keep the resulting hash list
    somewhere else than on the server. This is for obvious reasons. If your server
    is compromised, then it''s very easy for an attacker to overwrite your MD5 sum
    list with, illegitimate MDsums and deceive you.


    If for some reason you can''t get hold of md5deep (because you''re working in
    a cloud environment, for example), it would be worth running the md5sum command
    over directories containing key binaries, as as this (nonexhaustive) list:


    ```

    /bin, /sbin, /usr/bin, /usr/sbin, /etc

    ```


    # Rootkits


    Let''s move on onto a different approach to file fingerprinting.


    If you''re interested in protecting your files against rootkits (which contain
    code that allows someone to access or control one of your machines), then you
    should consider an excellent tool called RootKit Hunter (also called rhunter;
    http://rkhunter.sourceforge.net).


    At install time, the RootKit Hunter manual warns that if you''re trying to run
    the software on a presumably compromised system and the following standard commands
    or utilities are not present, then you probably won''t be able to run it successfully:
    cat, sed, head, or tail.


    I''m pointing this out for good reason: these commands might corrupt or be missing
    on a compromised machine. If you''ve installed RootKit Hunter to hunt down files
    and discover that your system has been compromised, you really need to rebuild
    your machine. Don''t assume that the remedial work you do from onward will make
    your machine secure enough for ongoing use. It''s simply not worth it of the time
    you will spend rebuilding the machine again in the future.


    In other words, use software to identify successful attacks for that purpose:
    identification. Always assume that you''re going to run through a full rebuild
    afterward. Know from experience that these insidious rootkits are like filesystem
    impets. You might find (as I have in the past) that you spend more time chasing
    your tail attempting to clean the system than a rebuild would actually take.


    Lectures aside, let''s look at Rootkit Hunter. Once you have installed this sophisticated
    software, using the following commands, you can continue easily without any problem.


    ![](img/0de912db8d05f7607e7b5b15fbf73eaa_30_0.png)'
