  md: "# Chapter 9: Password Cracking with Hashcat\n\n# Keyspace\n\nIt's important\
    \ to understand the concept of what keyspace is in cryptography. It loosely relates\
    \ to how much effort a password-cracking tool will have to expend.\n\nThe keyspace\
    \ is simply the set of available keys that might be used when generating a particular\
    \ key. The National Institute of Standards and Technology (NIST) describes keyspace\
    \ as the \"total number of possible values that a key, such as a password, can\
    \ have.\n\nIt continues, \"A component of keyspace used in common passwords is\
    \ the 'Character Set' used to make up the key.\"\n\nIn other words, you can only\
    \ use the available characters on your keyboard (or in your locale's character\
    \ set), and represent them keyspace.\n\n a single character can have a keyspace\
    \ of ten characters if that character is a single number, ranging from zero to\
    \ nine.\n\nYou can increase the security of your passwords by increasing the length\
    \ of the passwords and your character sets. So, for example, a password with 16\
    \ characters that uses a character set sized at 10 characters would reportedly\
    \ have a keyspace of 10,000,000,000,000,000, making it much harder to attack than\
    \ the 10-character keyspace from a single character.\n\nThis helpful website might\
    \ encourage you to increase your password security: https://howsecureismympassword.net.\n\
    \nThis simple yet sophisticated site uses basic terms and discusses possible combinations\
    \ as opposed to keyspace. If you click the SHOW DETAILS link under the input box,\
    \ after you entered a password, you will see how secure the password is. For example,\
    \ the following output appeared after I entered one-character-length password:\n\
    \n```\nLength 1 characters\nCharacter Combinations 10\nCalculations Per Second\
    \ 4 billion\nPossible Combinations 10\n```\n\nNow for the part that should cause\
    \ you concern. The powerful password tool on the \"How Secure Is My Password\"\
    \ website reports that the cracking time for my single-digit password is roughly\
    \ 0.000000000025 seconds for a standard desktop computer. Imagine how fast it\
    \ might be if you combined the processing capacity of many video cards.\n\nTrying\
    \ to be a little clever, by contrast, you can see what happens when I enter a\
    \ 16-character password in the example that follows. Incidentally, I'm using my\
    \ computer's default character set, so here the 10-character-long character set\
    \ example that you just looked at won't apply.\n\n100"
