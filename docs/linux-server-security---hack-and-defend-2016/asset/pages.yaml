- pgno: 24
  md: '# Chapter 1: Invisibility Cloak


    Even on your public services such as HTTP, you need to remember to obfuscate the
    version of the daemons that are in use. The common way to do this with the world''s
    most popular web server, Apache, is to change the "ServerTokens" to "Prod" and
    set "ServerSignature" to "Off". These are hardly cutting-edge configuration changes,
    which might mean an attack ignores your server when a new zero-day exploit is
    discovered because your Apache version wasn''t in its attack database.


    Another aspect to consider is discussed in the knockd documentation. It mentions
    that if you use -l or --lookup service allows to resolve hostnames for your log
    entries, then it might be a security risk. There''s a chance of some information
    being leaked to an attacker if you do. The attacker may be able to determine the
    first port of a sequence if its possible to capture DNS traffic from your server.


    # Ephemeral Sequences


    What about using a different approach to knocking sequences? It is also possible
    to use knocking with a predefined list of port sequences that expire after they
    are used just once. Referring back to Listing 1.1 and your main config file, you
    can add this to your open and close sections to enable one-time sequences if you
    want:


    ```

    One_Time_Sequences = /usr/local/etc/portknocking_codes

    ```


    If you remove the sequence line in Listing 1.1 and replace it with this code,
    then knockd will take its sequences from the file specified in the path instead.


    The way knockd deals with one-time sequences is unusual. It reads in the next
    available sequence from that file and comments out that line following a successful
    connection with a valid knock. It simply adds a hash or pound character to the
    start of the line that has the sequence present. The next connection triggers
    the same sequence.


    The documentation states that you should leave space at the start of each line.
    Otherwise, when the # character is added to the line, you might find it has been
    overwritten unintentionally, meaning you''re locked out.


    Inside your sequences file, you can add one sequence per line. That follows the
    same format as the sequences option within your main config file.


    The documentation also points out that you can put comments by preceding them
    with a # character but bad things will happen (such as being locked out of your
    server) if you edit the sequences file when knockd is already running.


    Once you understand the basic features of knockd, it is an excellent addition
    to experiment with. During testing, you could enter phone numbers that you are
    able to memorize or some other sequence of numbers that you''re continually looking
    up an insecure list.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'For example, you might consider rotating through five telephone numbers, split
    up into valid port numbers.


    # Summary


    In addition to making your server invisible, I''ve covered how your server appears
    to the Internet before launching an attack. In order to fully obfuscate your server
    using port knocking, you should think carefully about public information such
    as reverse DNS entry, which might give away an IP address as being in use. You
    might also consider NAT to hide a server and dynamically change its IP address
    periodically, only letting administrators know which IP address is in use at a
    given time via a secret hostname, covertly in DNS on an unusual Domain Name.


    There are many other facets of protecting a server; still, I''ve hopefully covered
    enough ground to make you consider what information is leaked to the public and
    may potentially be used in future exploits, as well as hiding a server if you
    need to do so.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Digitally Fingerprint Your Files


    There are a number of good reasons to keep an eye on your server security. Few
    sysadmin types absorb the necessary security knowledge required to keep their
    infrastructure safe without enthusiasm and effort. If you''re anything like me,
    there have been a few bumps along the way, such as when I had a severe compromised
    around the turn of the millennium thanks to a nasty PHP bug, or when I was faced
    and repelled two significant DDoS attacks.


    This chapter will cover another attack vector, rootkits, and a fantastic piece
    of software called Rootkit Hunter (you may know it as rkhunter). You will start
    off, however, by exploring how to monitor your filesystem''s important files,
    such as its executables.


    # Filesystem Integrity


    Many years ago I used Tripwire (http://sourceforge.net/projects/tripwire), which
    referred to the availability of other products. Tripwire ran periodically (overnight
    cron) and used cryptographic hashing to monitor file changes on your system.


    By generating and recording the hashes of any files visible on the filesystem
    initially, during its first run, Tripwire was able to alert the administrator
    if hashes didn''t match those it had recorded on each subsequent run. If the file
    had been altered in any way the hash would have changed. It''s a clever approach,
    despite being 10% resource intensive on old hardware, and has given birth to great
    grandchildren. One example is the popular AIDE (Advanced Intrusion Detection Environment),
    which is described as a "file and directory checker" at http://aide.sourceforge.net.
    I would certainly recommend trying AIDE or Tripwire on a development virtual machine
    if you get the chance. But be warned, however, that you are lax with the initial
    configuration, then you will be bombarded with false positives.


    This type of security often appears under the umbrella of host-based intrusion
    detection systems, or HIDS, and it was reported one of the first types of software-based
    security because mainframes had few extremely risky interactions over networks.


    If you don''t run nightly filesystem checks or you aren''t in a position to receive
    daily system reports, that''s not a problem. You can opt for an older approach
    where you only scan your filesystem once, after you have built your server, in
    order to collect information about what files are installed on the filesystem.
    I will explain why this is useful in a moment.


    Linux® Server Security: Hack and Defense. Dennis Binnie

    © 2016 by John Wiley & Sons, Inc. Published by John Wiley & Sons, Inc.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Chapter 2: Digitally Fingerprint Your Files


    You might be surprised that you''ve almost used for another purpose can be easily
    used as a security assistant.


    Step forward the md5 command. When downloading Unix-type files in the past, you
    have probably been offered the option to check the integrity of your potential
    download by verifying the MD5sums for those files. For example, the MD5sums are
    usually present on the website that you use your Linux ISO file from.


    As you can see in Figure 2.1, this is what you''re faced with when downloading
    Debian Jessie from this mirror: http://ftp.debian.org/debian/dists/jjie/installer-amd64/images/


    FIGURE 2.1

    You can download Debian Jessie from the website and also check your MD5sums for
    security.


    | Filename | Time | Size |

    |---|---|---|

    | MANIFEST | 00 05:29-16 | 1709 |

    | MANIFEST | 00 23 07-05 | 46432 |

    | MD5SUMS | 00 23:07-05 | 53 |15 |

    | SHA256SUMS | 00 23:07-05 | 72131 |

