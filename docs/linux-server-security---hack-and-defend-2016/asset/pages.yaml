  md: 'By including -n in the options, you can disable DNS lookups to potentially
    speed up your results and avoid detection by DNS servers, which would otherwise
    serve the answers to your queries.


    If it''s TCP that you''re interested in, then Nmap can connect to TCP ports as:


    ```

    # nmap -sT www.chrisbinnie.tld

    ```


    Simply swap -sT to -U for UDP ports if they''re of interest.


    As I''ve mentioned, there are simply too many options to cover, before you get
    to the really good stuff, here are a couple of other options that I find useful.


    First, if you''re scanning your local network but don''t want to include certain
    hosts, then you can use an exclude file option like this:


    ```

    # nmap 10.10.10/24 --excludefile /home/chrisbinnie/exclusions.txt

    ```


    If there are a few servers that you need to ignore, then you can opt to use the
    following syntax:


    ```

    # nmap 10.10.10/24 --exclude 10.10.10.1,10.10.10.10,10.10.10.10

    ```


    For scanning specific port numbers, you must prepend U for UDP and T for TCP as
    follows:


    ```

    # nmap -p U:53,T:1024-8080 10.10.10.111

    ```


    ```

    # nmap -sP 10.10.10.24

    ```


    You would expect an output similar to this:


    ```

    Nmap scan report for mail.chrisbinnie.tld (10.10.10.10)

    Host is up (0.028s latency).

    Nmap scan report for smtp.chrisbinnie.tld (10.10.10.11)

    Host is up (0.029s latency).

    ```


    In other words, one line per host.


    # Nmap Scripting Engine


    Nmap has a highly sophisticated set of technological innards. It refers to its
    scripting engine as NSE (Nmap Scripting Engine). I''ll run through some of the
    subjects covered in extensive documentation and indicate when you may want to
    use some of its functionality.'
