    # # False Positives


    If you receive any false positives, then you can whitelist them within the config
    file /etc/rkhunter.conf.


    If the volume of false alarms is a problem, then you can do this by uncommenting
    a config line that matches an entire directory within that main config file like
    this:


    ```

    ALLOWHIDDENDIR=/dev/.initramfs

    ```


    If Rootkit Hunter incorrectly suspects that one of your binaries has been replaced
    by a script, then you can remove the warning with this option:


    ```

    SCRIPTWHITELIST="/usr/bin/lsof"

    ```


    For individual files you can also use this config setting:


    ```

    ALLOWDEVFILE="/dev/.udev.rules.99-root.rules"

    ```


    Keep in mind that any hidden files or directories (those with names beginning
    with dot) are almost always suspicious to filesystem scanners. In Figure 2.5 you
    can see another part of the Rootkit Hunter results that refers to checking for
    any malicious hidden files.


    It''s clear that the comprehensive checks made by Rootkit Hunter are well considered.
    Along with the filesystem and the process table, it also checks for networking
    anomalies, as you can see in Figure 2.6.'
