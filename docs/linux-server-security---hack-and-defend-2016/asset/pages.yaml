  md: '# Chapter 9: Password Cracking with Hashcat


    will let you download 319,378 words into a list that Hashcat will happily run
    through. You can find the wordlists at www.md5this.com/tools/wordlists.html. (The
    password to unlock the Zip files containing the words is shown as md5this.com.).


    If you''re interested, the md5this website also offers a wordlist generator in
    the form of a python script, which can be downloaded from www.md5this.com/tools/wordlist-generator.html.
    The script works by generating words from website content. In order to run the
    script, you simply need to point it at a website where it will scrape its data.


    # Rainbow Tables


    Instead of leaning on a system''s CPU or GPU capacity, another approach is to
    lean on storage, potentially using hundreds or thousands of gigabytes. During
    a brute force attack, rather than calculating a hash every attempt, it is possible
    to look up a list of calculated answers here in a long list. These are known as
    rainbow tables.


    There are ways of defeating this approach, namely by using large salts on one-way
    hashes. This is effective because each password is hashed with a unique salt,
    and therefore every possible salt''s calculated hash would need an entry in a
    rainbow table alongside its salt.


    # Running Hashcat


    Now that you know about hashes, attack modes, and where to download a wordlist
    (once you''ve run through the large number of informative examples, this knowledge
    can be very useful), you can finally get to running Hashcat itself.


    The contents of my installation directory are as follows:


