- pgno: 9
  md: '# Preface


    There''s little question that the knowledge required to secure systems and networks
    in an effective manner needs to be continually kept up to date. However, not all
    technical professionals want to become full-fledged security professionals; instead,
    they prefer to focus on other areas, despite their role demanding many of the
    required skills.


    It seems like every day news reports another sensational attack and makes those
    working in the field count themselves lucky that their clients weren''t the target.
    As our reliance on responsive connectivity and well-written software grows, so
    do the rewards for successfully compromising an online service.


    The intention of this book is to offer a broad overview of both system and network
    threats. Rather than focus on one specific facet of online security, my aim is
    to examine a number of diverse areas, providing you, the reader, with enough knowledge
    so that you may pursue, in greater detail, that I have found interesting on my
    journey as an Internet user, which, some-worrying, now spans almost two decades.


    The diversity of the subjects within this book will hopefully help you to secure
    your online services and also provide you the opportunity to experiment with common
    tools that hackers use. This is intended to benefit everyone'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Introduction


    Consider for a moment that even highly publicized online attacks might be simple
    to carry out. The steps involved in launching an attack on a system or network
    can range from highly complex to frighteningly simple. This can also be the case
    if a system is left unsecured with well-known buggy software.


    The modus operandi of a less experienced attacker may simply be the automation
    of endlessly port scans, opening a connection and promptly closing it, or tirelessly
    searching for a banner that reveals the version of the service listening behind
    the port. If any versions match those listed in their vulnerability database,
    then a fresh target is identified by the attacker. Up to this point in an attack,
    it is an almost fully automated approach, which you might say it is nothing more
    than attacking computers.


    Conversely, sophisticated attackers use a wide variety of approaches to disrupt
    or gain access to a system or network. They are not only experienced and intelligent,
    but also innovative, patient, and cunning. They employ social engineering, building
    customized hardware, and practice stealth of hand. During an attack, they adapt
    their methodology as the attack evolves, sometimes rapidly. Much of the attack''s
    impact comes from being well prepared; the sheer number of attack vectors that
    might be tested during initial reconnaissance is high.


    Securing online services is a little like pushing water uphill, and I take no
    pleasure in saying that however well secured a service or system is, there will
    always be a way to break or disrupt it. As bold statement as that may be, keep
    in mind even if a system or network isn''t vulnerable today, there is an exceptionally
    high chance that it will be at some point in the future.


    Sadly, this means that, barring destruction of the power source for a server or
    network, the very act of switching on any electronic device effectively represents
    an attack vector for someone to exploit. This is a reality that technical professionals
    have long faced. The resulting approach to online security is one of weighing
    how valuable the successful exploit of your online systems and networks might
    be to attackers versus the budget you have available to secure your infrastructure.
    You might also try to reduce the value of a single prize, for example, separating
    your mail servers from your web servers. If one cluster is compromised, hopefully
    the other cluster will not be susceptible if it''s a different firewall and using
    an alternative operating system.


    Putting night terrors aside, thankfully, very highly sophisticated attackers exist,
    against which your defenses will fail to one degree or another (sometimes within
    a matter of minutes). However, as the Internet matures, there are an increasing
    number of'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Introduction


    proficient attackers who can wield the power of other compromised systems and
    services, causing serious headaches for unsuspecting victims.


    Furthermore, the motives for attempting attacks are varied and sometimes unpredictable.
    They might include receiving kudos from the hacking community, one-upsmanship
    on a victim, a training exercise for wannabe novices, or simply financial gain.
    And, considering the most common demographic involved, let''s not forget thrill
    seekers.


    If your service is prone to certain types of unwanted attention, such as your
    web application being continually bombarded with probes looking for security holes,
    then common sense dictates that you focus primarily on getting your developers
    to fix your application''s flaws. Conversely, if you are running an e-mail service,
    then you need to be absolutely sure that the software that you rolled out all
    the mail servers in your cluster is up to date, patched frequently and promptly.
    By focusing on the most obvious weaknesses, it is possible to limit the attack
    surface that you are likely to present to skilled attackers, and to reduce the
    chances of them gaining a foothold on the rest of your infrastructure. Once you''re
    content that your primary attack vector is mostly secured, you can concentrate
    on plugging less obvious holes.


    It may help to focus your thoughts about security with a few simple questions.
    First, what are you trying to protect? For example, is it sensitive, secret information
    hidden inside a database, fronted by multiple firewalls and hosts, or are you
    protecting an online service that must stay available to your users around the
    clock, every day of the year? This question is important because it affects how
    you bolster your defenses and potentially changes the defensive choices that you
    will make. You might, for example, pay dollar every month for a network-traffic
    cleaning service to protect you against Denial-of-Service attacks, as opposed
    to buying expensive, high-end hardware.


    Second, how would you contain a security breach? If one server or device on your
    network is breached, will that automatically make other hosts suffer the same
    fate? If that''s the case, then clearly your security policy has serious issues
    that need to be addressed.


    Third, how would you recover from a security breach? You might also be concerned
    about what happens if an attacker has discovered your redundancy works and at
    what stage your failover services will be activated. There might be little point
    in rebuilding a primary server or blindly restoring network service if you don''t
    know how an attacker breached the security in the first place. Are you able to
    quickly recover services using an alternative vendor''s equipment or software?
    If so, then you might reduce the likelihood of the same attack penetrating your
    security again, allowing you to restore some, if not all, services investigating
    how the attackers got in.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Introduction


    # How This Book Is Organized


    The chapters contained within this book can be read in any order and are a collection
    of security topics that have interested the author on his journey as an Internet
    user over the years.


    The topics vary from the theory of past, current, and future attacks, to the mitigation
    and defense from a variety of online attacks, all the way empowering readers to
    perform malicious attacks themselves (in the hope they will learn to defend against
    such attacks).


    By separating the various topics into chapters, the subjects can be referenced
    and returned in the future to allow the reader to recount the content in detail.
    The content of each chapter is as follows:


    **Chapter 1: Invisibility Cloak:** If an attacker cannot see your server and isn''t
    aware of its existence, then there isn''t any attack vector to exploit in the
    first place. We demonstrate how to continue using services in production without
    the unwelcome attention of attackers.


    **Chapter 2: Digitally Fingerprint Your Files:** There are many ways to keep an
    eye on the integrity of your server''s filesystems to ensure attackers haven''t
    gained access. In this chapter we look at both a manual method and an automated
    tool that checks for rootkits.


    **Chapter 3: Twenty-First-Century Netcat:** Steeped in history, the modern-day
    version of Netcat, with its multitude of advanced features, has become a hacker''s
    tool of choice. Learn how to spoof if such a tool is being used against your servers
    and additionally how to utilize its industry-leading functionality.


    **Chapter 4: Denying Service:** Only a handful of the world''s largest Internet
    infrastructure providers can withstand the devastating effects of a full-fledged,
    high-capacity Distributed Denial of Service attack. In this chapter we discuss
    the topic in detail and comment on an entire country losing Internet connectivity
    for three weeks due to such an attack.


    **Chapter 5: Nping:** Knowing which services a host is running is only half the
    battle. The extension of the powerful Nmap security tool allows you to check that
    on any host and craft custom packets with unique payloads.


    **Chapter 6: Logging Reconitaires:** Although certain probes executed against
    your server might seem harmless, there is little doubt that being aware of how
    they work helps you secure your server further. We examine several facets of an
    attacker reconnoiting your server''s vulnerable points.


    **Chapter 7: Nmap''s Prodigious NSE:** Many users will have used Nmap for simple
    port scans, but few know that the security tool includes the ability to exploit
    remote machines too. We explore some of the many possibilities starting with the
    plethora of scripts that Nmap ships with by default.


    xvii'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Introduction


    Chapter 8: Malware Detection: A sometimes entirely silent threat that has plagued
    Windows systems for years in the form of illegitimately installed software. The
    damage that can be done to a system by malware ranges from annoying pop-up windows
    to full-fledged online banking compromises. In this chapter we learn how to deploy
    a sophisticated,frequently updated anti-malware solution on Linux.


    Chapter 9: Password Cracking with Hascat: Technical professionals may be alarmed
    to discover that one password-cracking tool all but guarantees that it can crack
    a hash password. This means that if access to your password is gained illegally,
    then it''s a matter of time before an attacker can see your password in plain
    text. This chapter walks you through the process, step by step.


    Chapter 10: SQL Injection Attacks: In a prominent survey, SQL injection attacks
    were listed as the most prevalent online attack. Despite the fact that this type
    of attack dates back to the 1990s, even a fortunately large number of such attacks
    successfully exploit websites belonging to enterprises and key online services
    through programming practices. This chapter offers some useful historical information
    along with step-by-step instructions on how to identify and exploit online services.


    # Who Should Read This Book


    This book was written for mid-level admins, software hackers, and other IT professionals.
    It is however, hopefully, written in a way that anyone who is curious will be
    able to quickly discern which sections are suitable for those interested in security
    but don''t necessarily have a strong understanding of the Linux command line.
    The aim is that some readers will go on to research a specific chapter''s subject
    in greater detail to help bolster their knowledge on that subject further, while
    other areas will be of less interest to their needs and potentially used for referencing
    at a later date.


    In other words there is no difference in the levels of experience required on
    a per-chapter basis, although those chapters that focus more heavily on the command
    line may require greater effort for a novice.


    # Summary


    Let''s hope that by increasing your understanding of a hacker''s tools and mind-set,
    and staying on top of the latest security developments, you are not subjected
    to an all-toocommon realization days: that you no longer have control of your
    own systems or networks, but somebody else does.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# CHAPTER 1


    # Invisibility Cloak


    imagine that you could hide a server from the Internet but still have access to
    your ISP''s superior bandwidth. Without making any changes, you would be able
    to securely use it as a file repository, many other things.


    You''d also have full access to the command line so that you could start and stop
    or even install any services you wanted to. The choice would be yours, whether
    you run those services briefly and then closed them down, or leave them running
    and visible to the outside world for a period of time.


    This is possible to achieve using a technique port knocking. You can disguise
    your server by closing all network ports to the outside world, genuinely making
    it invisible. The single port that you might choose to open at will, by using
    a prearranged “door-knock,” could be for your SSH server or for some other service.
    In this chapter, you''ll see how you can create an invisible server with some
    options that you might want to consider.


    # Background


    By disguising the very existence of a server on the Internet, at best you can
    run a machine in private, and at worst, if its existence is known, you will reduce
    the attack surface that an attacker can target by limiting the time ports are
    open and even partially visible.


    # Probing Ports


    Before beginning, let''s take a closer look at network ports on a server, so you''ll
    have a frame of reference. If you''ve ever used security tools like Nmap, you
    may be familiar with the confusing premise that some ports appear to be closed
    when in fact they are not. Nmap makes the distinction between whether a nonport
    has a service (a daemon) listening behind it or not.


    Nmap refers to ports that do not have a daemon listening behind them but do appear
    to be open or at potentially available. If Nmap refers to ports, it means a firewall
    of some kind is preventing access to the IP address that is scanning the system
    in question. This is partly to do with TCP RST packets, and there are also other
    states that Nmap reports back on: unfiltered, openfiltered, and closed/filtered.
    If you want more information on how these states are, go to https://nmap.org/book/man-port-scanning-basics.html.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Chapter 1: Invisibility Cloak


    # Confusing a Port Scanner


    Now that you know how ports may present themselves to port scanners, let''s look
    at how to obfuscate the response you give back in order to confuse sophisticated
    port scanning techniques. The most obvious tool of choice, thanks to its powerful
    feature set, would be the kernel-based firewall Netfilter, more commonly known
    as iptables.


    Here''s how it works. For TCP packets, you want to manipulate how you respond
    to port probes using iptables to generate a REJECT request. For other protocols
    you want to drop the packets. This way, when you get closed, not filtered, responses
    from Nmap. Based on what I''ve gathered from most online opinions (and seems this
    argument is contentious and changeable), a closed port is the best response that
    you can hope for. This is because you''re not admitting to blocking any ports
    with a firewall, nor is the port simply open because a daemon is running behind.


    To explain a little further, under normal circumstances, an unreachable port would
    usually generate an ICMP Port Unreachable response. You don''t want these errors
    to be generated, because that would mean a server is listening on that port in
    the first place and you would give your server''s response away. The tweaked REJECT
    response that you want to generate is applied as follows:-reject-with tcp-reset.
    This helps you to respond if the port were unused and closed, and not filtered.


    You simply add this snippet to the end of each of your iptables rules:


    ```

    -j REJECT-reject-with tcp-reset

    ```


    By using this technique, you''re making sure you''re not giving away unnecessary
    information about your system.


    Note that in the port knocking example that you''re about to look at, you won''t
    be using iptables option. This is because you''re not running additional services
    to your SSH server. However, this background information will help you understand
    how an attacker might approach a machine''s ports and how you can apply-reject-with
    tcp-reset option to other services.


    There is some debate about using iptables DROP versus REJECT responses in your
    rules. If you''re interested, you''ll find some insightful information on the
    subject at


    www.chiark.greenend.org.uk/~peterb/network/drop-vs-reject.


    # Installing knocked


    Now that you are armed with some useful background information, I''ll walk you
    through how to install a port knocker on your server. As we continue you might
    consider'
