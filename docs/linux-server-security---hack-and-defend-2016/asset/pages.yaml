  md: '# Chapter 4: Denying Service


    institutions to toughen up aspects of their networking infrastructure, on both
    their hosts and networking equipment, to prevent cascading effects around the
    Internet.


    Specifically, it takes some time to discuss the importance of ingress filtering
    to protect external networks from your network if it is used as an attack tool.
    Citing that, by employing simple preventative measures, the diagnosis and mitigation
