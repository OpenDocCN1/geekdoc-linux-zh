  md: '# Chapter 9: Password Cracking with Hashcat


    The password I entered was a combination of upper and lower alpha characters,
    numeric, and special characters, as follows:


    ```

    Rx951&RTdip-2YT

    ```


    In this case the website responded with a more comfortable time to crack, of 412
    trillion years. As you can see in the following output, some new vocabulary is
    included (for, at least). Apparently, the word "nonillion" is a number followed
    by 30 zeros in the United States and 54 zeros in the United Kingdom.


    ```

    Length 16 characters

    Character Combinations 96

    Calculations Per Second 4 billion

    Possible Combinations 52 nonillion

    ```


    From this example, you can clearly surmise that a standard eight-character-long
    "complicated" password is preferable to using a simple single-character password.


    # Hashes


    Now I''ve covered how a complex password can dramatically increase the effort
    in an attack, I''ll continue my discussion of password cracking. First, though,
    one explanation.


    As its name suggests, Hashcat deals with password hashes. Creating a hash in cryptography
    involves the conversion of a string of characters, such as a password, to a set
    of characters, resulting in something a little like a fingerprint. There is no
    way of undoing or reversing a hash (well, more accurately, it''s just really,
    really difficult to do in reality).


    Here are two MD5 hashes, First for the word "hello" is


    ```

    5d1402abc4b2a76b971d9311017c592

    ```


    Second, the MD5 hash for a capitalized "Hello" is


    ```

    81aa9953c46112964a827abf8c47804d7

    ```


    As you can see, that single uppercase character makes quite a difference.


    If you use another word, "Hello There," you get


    ```

    32b170d923b654360f351267bf44045

    ```


    The MD5 hash of yours is the same length as the previous examples that contained
    one word. By knowing that your hashes are always the same length, you can tell
    if a string of seemingly unrelated characters conforms to a standard.'
