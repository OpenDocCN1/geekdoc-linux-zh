- pgno: 50
  md: '# Chapter 4: Denying Service


    servers can sometimes be limited for access due to a maximum number of clients
    or a minimum poll interval and are occasionally available to certain types of
    organizations, such as academic institutions.


    Another NTP security component is that the client software is written in a way
    to adhere to the instructions that are generated by servers that they request
    the time from. If a recipient server prefers to, then it can simply block a request.
    In a similar routing and firewall techniques, these packets are discarded or black-holed
    without intervention. In other words, the recipient server of these unwanted packets
    doesn''t take on extra system load and simply drops the traffic that it doesn''t
    think it serve as a response.


    However, a response isn''t always helpful, and it''s better to politely ask the
    client to cease and desist, rather than ignore the requests unilaterally. For
    this reason, there''s a specific type of packet called the Kiss-o-Death (KoD)
    packet. If a client is sent an unwelcome KoD packet, it will remember that server
    with an access-denied marker and look elsewhere for its timeouts, or at least
    for a predefined period of time within rate-limiting thresholds.


    There are other good reasons to protect the overall security of NTP. In addition
    to the demands on IP addressing and the impact on bank balances from bandwidth
    usage, you also need to include the Internet''s NTP infrastructure on the list
    of services that are about to be affected by the potentially explosive, exponential
    growth of the Internet of Things (IoT). By all accounts, billions of devices will
    soon need to synchronize, and so will your refrigerator or other things.


    # NTP Reflection Attacks


    Around the start of 2014, a nasty NTP attack surfaced, overwhelming Internet Service
    Providers (ISPs) and forcing the Internet community to act swiftly and effectively
    in order to contain it. For a short while, at least many victims of the attack,
    it caused significant confusion. The frighteningly simple but innovative exploit
    affected almost all NTP implementations. This was referred to as a reflection
    attack, which by its very nature generates unwanted traffic and traffic that attacks
    a victim. This caused the victims to suffer load or bandwidth capacity problems
    unless they are supported by significant underlying infrastructure. In the past,
    these attacks have been referred to as challenge-response attacks; however, in
    my opinion that description isn''t very helpful because not all reflection attacks
    involve authentication, and challenge-response is most commonly associated with
    authentication mechanisms.


    The 2014 NTP attack followed reflection attacks that had been witnessed frequently
    in the past. When a critical service is discovered to have a previously unseen
    exploitable attack vector, there''s a scramble by technicians wanting to protect
    their infrastructure. Decisions that they are faced with include whether that
    single service needs to be immediately disabled in order to keep other services
    running in the meantime, prior to a


    38'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Chapter 4: Denying Service


    patch or configuration fix made available. After all, it is possible to manually
    set the time on computers or in many cases allow for a slight inaccuracy of the
    system clock. Many services will survive 24 hours of synchronized NTP updates
    before unwelcome effects are experienced.


    Within these types of attacks, there are two terms that appear frequently. The
    first is reflection, which cognates to mirror-like redirection of attack traffic.
    Here, many third-party services respond by sending traffic to a victim (the main
    target), not the attacker. This is achieved by forcing or spoofing the attacker''s
    IP addresses and flooding the third party who officially requested the traffic.


    Amplification, on the other hand, might be best illustrated as sending one packet
    of data as a question and receiving one hundred packets in return as an answer.
    In the case of a reflection attack, this refers to the unsuspecting victim receiving
    the payload, or a sizable answer to a question they didn''t.


    Think of three machines in a triangle. Machine A sends a list of questions on
    behalf of Machine B. C then sends all of the answers incorrectly to B. Machine
    B is overwhelmed by the volume of answers. Machine A is invisible to B, and B
    doesn''t even know that A is involved in the attack. For protecting their infrastructure,
    this makes for a challenging diagnosis.


    Reportedly the amplification ratio of the DDoS traffic generated by a standard
    DNS reflection attack is 70:1. In other words, if you have one gigabit of bandwidth
    available to you, you can reach 70 gigabits. The aforementioned reflection ratios
    possible by the NTP exploit were reportedly from 20:1 to 200:1. You simply needed
    to look up a freely list of public NTP servers to create a frightening amount
    of NTP traffic to fuel your DDoS attack.


    The NTP attack, as is often the case, horrendingly simple. It was based around
    a builtfunction that allowed anyone to query the few hundred servers to connect
    an NTP server. The function that was exploited spoofs the IP address asking so
    that the NTP server being queried replies to the victim instead of the machine
    submitting the query. By repeating that command and again, the victim soon becomes
    overwhelmed if thousands of servers are responding simultaneously. "amplification"
    of this "reflection" attack, where the amount of data involved in the answers
    is so much larger than the original question, is what makes it so devastating.
    This is only because a relatively small number of originating servers are used
    to make such queries can toggle vast sections of infrastructure.


    The essence of mitigating such an attack, on an IPv4 system (the first line showing
    -4) and an IPv6 system (the second line showing -6), comprises the following lines
    within your NTP config:


    ```

    restrict -4 default modify nooper noquery notrap

    restrict -6 default modify nooper noquery notrap

    ```'
  merge: -1
  img_proc: true
