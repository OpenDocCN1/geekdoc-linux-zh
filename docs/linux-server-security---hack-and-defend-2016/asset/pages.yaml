  md: '# Chapter 4: Denying Service


    Attackers have been witnessed experimenting with SNMP for sizeable reflection/amplification
    attacks. The alarming traffic ratios are reportedly as much as 1700:1. How accurate
    that estimate remains to be seen of, and whether a degree of scaremongering is
    present.


    In May 2014, Akamai''s DDoS division reported that they had spotted 14 SNMP attacks.
    With under half were in the U.S., and around 18 percent in China.


    # Preventing SNMP Reflection


    Following a quick check of your /etc/services file, you can see the following
    details for the default ports used by SNMP:


    ```

    snmp                161/tcp                # Simple Net Mgmt Proto

    snmp                161/udp                # Simple Net Mgmt Proto

    snptrap             162/tcp                # SNMPTRAP

    snmptrap            162/udp                snmp-trap # Traps for SNMP

    ```


    To prevent the reflection of SNMP traffic originating from your network, you can
    follow a deny-by-default practice, making sure that your perimeter firewalls do
    not let any of this traffic out of your LAN and onto the Internet. Of course,
    this also applies to traffic coming into your LAN. Often, default settings are
    left unchanged when equipment is set up in a hurry, upgraded or configured by
    unskilled personnel, resulting in preventative measures being missed. What is
    most worrying about an attack that is, thanks to the sheer number of broadband
    routers around the planet, it can take a long to manually patch some of them (although
    residential ISPs can add ingress and egress filters to their networks). While,
    large sections of infrastructure can start to suffer from performance issues.


    The SNMP attack as described by Akamai was attributed to a specifically crafted
    attack tool. The tool used "GetBulk" and spoofed the IP address, in the same way
    as NTP and DNS reflection attacks, in order to make sure the victim''s IP address
    received the barrages of responses sent reply to the spurious requests. Frankly,
    this particular attack only applies to an older version of SNMP, version 2. Version
    3 offers greater security and does not open itself up to as much abuse by default.


    Worringly, the key design of this attack was to generate significant amounts of
    traffic by only a few requests and possibly even from a single machine. Criminals
    can disrupt large sections of online infrastructure without needing to invest
