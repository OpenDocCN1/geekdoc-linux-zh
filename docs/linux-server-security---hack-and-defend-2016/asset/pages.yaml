- pgno: 74
  md: 'If you want to save all kernel warnings to a new log file, then it is relatively
    easy to set up. Open the file /etc/rsyslog.conf and add the following line to
    the RULES section or close to it (assuming there''s not already an entry for kern.warning
    that you might disrupt; otherwise, decide if you can overwrite or append to it):


    ```

    kern.warning

    ```


    Of course, when it comes to manipulating text files, you can achieve a lot of
    different results with a quick shell script (or by using some grep, awk, or sed-command-line
    tools). However, for the sake of avoiding empty disk space issues, let''s try
    not to log every warning from the kernel in a case of hardware misbehaving and
    logs thousands of warnings in a short period of time.


    You''re going to create a new syslog config file and call it /etc/rsyslog.d/iptables-pings-logging.
    Confidentially you can probably name this file whatever you like if your main
    config file (that''s the /etc/rsyslog.conf) picks up all config files that it
    finds in that directory. By default, there''s an entry in that file that looks
    like to warn all the config files at:


    ```

    $IncludeConfig /etc/rsyslog.d/*.conf

    ```


    I should say, that I have had trouble getting the filters to work from a new file
    in that directory. That was despite checking permissions and having remote-syslog-logging
    working from within one of those files (and trying startswith and regex instead
    of contains operator that you will see next).


    If you run into the same trouble, then instead of adding two lines to your new
    config file, simply navigate to the line mentioning kern. * under RULES in the
    main config file (/etc/rsyslog.conf) to avoid using a separate config file altogether,
    and add these two lines:


    ```

    :msg, contains "Pings"

    & /var/log/iptables-pings

    ```


    The first line catches entries that include the string "Pings" and ask syslog
    to write to the file /var/log/iptables-pings.log. The second line is a little
    unusual and tells the syslog to ignore any entries caught by the previous line
    so that you''re not doubling up with your logs by writing the same content to
    another file. You can, of course, leave that second line out if you''d like to
    log elsewhere too.


    Now that you''re able to drop content to a log file and filter out specific iptables
    events (adding your own labels as you prefer), let''s look at other examples.


    ![](img/0de912db8d05f7607e7b5b15fbf73eaa_74_0.png)'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Chapter 6: Logging Reconnoiters


    # Multipart Rules


    ![](img/0de912db8d05f7607e7b5b15fbf73eaa_75_0.png)


    If you allow pings to reach your servers and also allow outbound pings from your
    server, then each operation involves slightly different iptables configuration.


    The following web page explains how to allow ping into a certain IP address on
    your server (assuming you have more than one bound to your server) along with
    the different outbound pings config: www.cyberciti.biz/tips/linux-iptables-9-allow-icmpping.html.


    Note that the -d option for inbound ping rules means a specific IP address.


    # Log Everything for Forensic Analysis


    If you were concerned that you were experiencing an attack and wanted to log all
    inbound connections to your machine, then you could (briefly) enable this command:


    ```

    # iptables -I INPUT -m state --state NEW -j LOG --log-prefix "Logged

    Traffic: "

    ```


    Be warned that your /var/log/messages file will be so large, you would have to
    disable the logging by flushing the rule as soon as you could. (You can check
    the example later in this to find out how to do this). You might expect the output
    to look like this from the iptables command:


    ```

    Nov 11 01:11:01 ChrisLinuxHost kernel: New Connection: IN=eth0

    OUT= MAC=ff:ff:ff:ff:ff:ff:00:41:23:4f:4d:18:00 SRC=10.10.10.10

    DST=10.10.10.255 LEN=78 TOS=0x00 PREQ=0 TTL=128 ID=28621 PROTO=UDP

    SPT=137 DPT=137 LEN=58

    ```


    This extract taken from my new sizable /var/log/messages file. The traffic appears
    to have been generated by a Netbios packet. Simply swap INPUT with OUTPUT if you
    would want to track egress traffic.


    On that, what if you want to log traffic but also rate-limit what hits your servers
    logs? Here''s an example:


    ```

    # iptables -I INPUT -p icmp -p udp limit 5/min -j LOG --logprefix "Blocked ICMP
    Traffic: " --log-level 7

    ```


    It''s simple enough to change -p icmp to -p tcp or p udp and you are only logging
    five packets per minute of this type of traffic. This example means you that this
    can be useful because, generally, the first few probes are informative before
    repetition starts.


    64'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Incidently, if you find that your logs are filling up too quickly, then you
    can just flush every iptables rule like this:


    ```

    # iptables -F

    # iptables -X

    # iptables -t nat -F

    # iptables -t nat -X

    # iptables -t mangle -F

    # iptables -t mangle -X

    # iptables -t raw -F

    # iptables -t raw -X

    # iptables -t security -F

    # iptables -t security -X

    # iptables -P INPUT ACCEPT

    # iptables -P FORWARD ACCEPT

    # iptables -P OUTPUT ACCEPT

    ```


    My preference is to put this strings into a script (or very long Bash aliases
    with the commands separated by semicolons), and as the root user, I can type flush
    whenever I need a quick, fail-safe removal of all the firewall rules in use.


    # Hardening


    If you''re worried about your system being overloaded by ICMP traffic, there are
    a couple of relatively simple things you can check. This is thanks to the power
    of Unix-type operating systems. First (and your build may already have this set
    as default), you can ignore ICMP broadcasts by adding the following line to the
    bottom of the file /etc/sysctl.conf:


    ```

    net.ipv4.icmp_echo_ignore_broadcasts = 1

    ```


    This sysctl.conf example will persist a reboot, whereas the following command
    will set it immediately:


    ```

    # echo "1" /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts

    ```


    The following command will also set it immediately if you have followed the sysctl.conf
    example (it reloads all the config settings inside the file sysctl.conf):


    ```

    # sysctl -p

    ```


    The icmp_echo_ignore_broadcasts setting stops ICMP broadcasts from bringing your
    network with unwanted broadcast traffic.


    In reality, this is a deprecated attack (you saw that modern kernels use rate-limiting
    at standard), and the kernel setting is only useful for ping attacks to the broadcast'
