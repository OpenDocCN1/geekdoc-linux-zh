- pgno: 107
  md: '# Password Cracking with Hashcat


    Two sophisticated security tools caught my eye recently. They were highlighted
    in the news because they''ve been released as open source, apparently causing
    a frenzy on GitHub as developers looked for the tools'' source code. The tools
    in question are called Hashcat and oHashcat. Hashcat (https://hashcat.net/hashcat)
    boldly refers to itself as the ''world''s fastest CPU-based password recovery
    tool.'' Its rival, oHashcat, uses your Graphics Processing Unit (GPU) to number
    chunk through the process of recovering passwords, as opposed to Hashcat''s CPU-based
    approach. As a result, the GPU-based oHashcat is even faster than Hashcat.


    While tools like this can be highly useful for legitimately rescuing a lost password,
    it is also possible to use them for nefarious purposes. It hopefully goes without
    saying that these powerful tools should be used responsibly. They are employed
    by forensic scientists and penetration testers, if you find evidence of similar
    tools on one of your machines, you should certainly raise the alarm.


    Let''s look at how tools work for saving the day if a password becomes lost, as
    well as how a hacker will approach attacking your passwords.


    # History


    Another popular, vulnerable security tool that is used for ripping passwords is
    John the Ripper. Hashcat arrived on the scene in 2009, and took it upon itself
    to use multithreaded CPU password cracking. At that time, other tool developers
    had been looking at all available cores of CPU, none were able to do fully and
    without patching. When the developers were designing Hashcat, it made absolute
    sense to take advantage of the capabilities of modern CPUs and speed up the password
    recovery process significantly.


    In case it causes confusion, Hashcat originally went through a few different names
    in its early releases, such as atomcrack and Hash. As version of 0.30, the name
    that you know (and I''m sure you will begin to love), Hashcat, was applied to
    the software.


    # Understanding Passwords


    It might be helpful to look at how password systems work. I use Linux systems
    as my case in point before continuing onto Hashcat in detail.'
  merge: -1
  img_proc: true
