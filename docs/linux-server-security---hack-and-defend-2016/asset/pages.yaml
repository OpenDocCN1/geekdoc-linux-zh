- pgno: 82
  md: '# Chapter 7: Nmap''s Prodigious NSE


    The extraordinary NSE was designed with a few functions in mind. These functions
    include network discovery mostly through port scanning, advanced service detection
    using a variety of predefined scenarios, vulnerability checking (and exploitation),
    and finally backdoor detection.


    NSE''s strength is in its versatility, and it extends this functionality by offering
    the addition, as its name suggests, of scripts that can be written by anyone using
    the Lua programming language. In order to fire NSE from the command line, you
    simply launch the nmap binary with the --script= option or, alternatively, the
    -sC option.


    Following are two examples of port scanning with Nmap. The first is without enabling
    NSE and the second engages it. This should be useful so that you can familiarize
    yourself with the difference in output. In Listing 7.1 you see the results of
    the first command. Note that both these commands are run, not as the root user,
    but as a standard user.


    # LISTING 7.1 Nmap performing network discovery but without NSE being engaged


    ```

    # nmap -p0-1024 -T4 localhost

    Starting Nmap 5.51 ( http://nmap.org ) at 2016-11-16 11:16 GMT

    Nmap scan report for localhost (127.0.0.1)

    Host is up (0.0049s latency).

    Not shown: 1021 closed ports

    PORT   STATE SERVICE

    22/tcp open   ssh

    25/tcp open   smtp

    80/tcp open   http

    111/tcp open  rpcbind

    Nmap done: 1 IP address (1 host up) scanned in 0.11 seconds

    ```


    In Listing 7.2, however you see that NSE has been engaged, and here it adds invaluable
    insight into the mix.


    # LISTING 7.2 The richer output provided by network discovery with NSE being engaged


    ```

    # nmap -sC p0-1024 -T4 localhost

    Starting Nmap 5.51 ( http://nmap.org ) at 2016-11-16 11:16 GMT

    Nmap scan report for localhost (127.0.0.1)

    Host is up (0.0005s latency).

    Not shown: 1021 closed ports

    PORT   STATE SERVICE

    22/tcp open   ssh

    ssh-hostkey: 1024 d7:46:46:2d:fc:ad:9e:c7:25:d3:a1:96:45:4f:59 (DSA)

    |_2048 80:f2:29:c0:ee:a1:80:99:2e:7f:26:c3:b1:2d:c4:37 (RSA)

    ```'
