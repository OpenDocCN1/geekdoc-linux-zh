    # Contributing Factors


    When the default set of scripts is used, you might be surprised by how the mighty
    NSE reaches its decisions. There are no set thresholds; rather, it reaches a kind
    of score after running through the following criteria.


    +   - Speed — default scans must be completed swiftly, for example, so no brute
    forcing is employed.

    - Usefulness — if a script doesn''t produce useful results, then you can forget
    it inclusion in default scripts.

    - Verbosity — the resulting output of running a script needs to be succinct. Equally,
    when there''s nothing to report, silence is a virtue.

    - Reliability — inevitably, assumptions and guesses are made during the operation
    of some scripts. However, if there are frequently errors, then it shouldn''t be
    run in the default category.

    - Intrusiveness — if a script causes guards to suddenly appear, then it''s probably
    too intrusive for the default set of scripts.

    - Privacy — along the same line as the external set of scripts, the default scripts
    need to respect your privacy and not reveal your presence.


    # Security Holes


    Now that you''ve looked at the multitude of NSE''s script categories and you will
    appreciate running the default set of scripts means, let''s look at performing
