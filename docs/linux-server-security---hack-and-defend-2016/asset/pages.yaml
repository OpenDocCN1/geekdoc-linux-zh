- pgno: 94
  md: '# Malware Detection


    The term malware encompasses a large range of unwelcome software that is designed
    to damage a computer. A partial list of malware might, for example, is enough
    to include viruses, spyware, Trojan horses, and worms. A rapid proliferation of
    such software is enough to concern users of all levels, from novices to seasoned
    administrators. The impact of malware ranges from essentially harmless pranks
    to the theft of personal information, such as banking details, or a denial of
    service.


    Although the scale of scammongering in the ebbs and flows, every goodadmin knows
    that there''s no such thing as a completely secure system. Despite the massive
    number of virus and malware threats that target Unix-type machines should remember
    that these also exist for their systems.


    One popular, sophisticated software called Linux Malware Detect (LMD), from R-fx
    Networks (https://www.rfxn.com), helps to mitigate malware on Linux systems. Let''s
    look at how you can effectively protect Linux machines against malware using the
    LMD package, which only focuses on malware, unlike other diluted solutions.


    # Getting Started


    Before we begin with looking at LMD itself, let''s consider some potentially less
    obvious aspects of what''s needed to successfully keep your malware software functioning.


    # Update Update Frequency


    It is critical that signature updates are performed frequently; in fact, your
    system may be vulnerable if you have missed the latest update. The architecture
    of the detection software itself is of little value if current threats are not
    detected. Fortunately, LMD fully pulls in its updates, from which it generates
    signatures, community data, user submissions, and the firewall data of active
    malware threats.


    The LMD website offers an up-to-date RSS feed of the latest threats, and also
    provides a commercial version, which is another incentive for updates to be current
    and relevant. The feed, which is brimming with LMD''s current malware findings,
    can be found at https://www.rfxn.com/feed.


    LMD states that signatures receive an update approximately once a day, or more
    often if there is a flurry of activity reported.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Chapter 8: Malware Detection


    # Malware Hash Registry


    A well-respected security website called Team Cymru provides a Malware Hash Registry
    (www.team-cymry.org/MHR.html), which provides a lookup service to compare malware
    infections. According to LMD, over 30 antivirus companies use this data to populate
    their databases. From the LMD website, you can see the current number of reported
    threats as follows:


    +   DETECTED KNOWN MALWARE: 1951

    % AV DETECT (AVG): 58

    % AV DETECT (LOW): 10

    % AV DETECT (HIGH): 100

    UNKNOWN MALWARE: 6931


    The LMD website continues and explores some of the scoring used to measure false
    hits and other malware products, resulting in a worrying conclusion.


    Using the Team Cymru malware registry, we can see that of the 8,883 malware hashes
    with LMD 1.5, ..., 6,931 or 78% of threats ... went undetected by 30 commercial
    anti-virous and malware products. The 1,951 threats that were had an average detection
    rate of 58% with a low high detection rate of 10% and 100% respectively. Could
    not not be a clearer statement to the need for an open and community driven malware
    remediation project that focuses on the threat landscape of multi-user shared
    environments.


    As you can see from this LMD website excerpt, there are a significant number of
    failures among commercial malware products. LMD aims to plug the market gap where
    possible, but there is an advocate of open discussions and collaboration, sharing
    known threat details between vendors.


    # Prevalent Threats


    At the time of writing, LMD claims to hold 10,822 malware signatures within its
    data-base. Looking at the contents of Figure 8.1, you can see a list of the 60
    most prevalent threats within the LMD database. As you might expect, the world''s
    most popular server-side scripting language, PHP (https://www.php.net), is a common
    attack vector. The power Perl language also features heavily.


    # LMD Features


    The LMD feature is far from trivial. In Figure 8.2 you can see the features listed
    in its documentation.


    86'
