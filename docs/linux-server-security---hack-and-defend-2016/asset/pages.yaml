  md: '# Installation Packages


    For clarity, Debian Linux and therefore Ubuntu Linux use the package names shown
    in Table 3.1. On Red Hat derivatives, you might try this package for a version
    of nc:


    ```

    # yum install netcat

    ```


    And for the Nmap Project''s ncat, you might try this package:


    ```

    # yum install nmap-ncat

    ```


    I suspect installing a package and then making sure you are reading the correct
    page for that package (in case two versions of netcat are installed on the same
    machine) will prove successful.


    # TABLE 3.1 Debian and Ubuntu Package Names


    | Package Name | Description |

    | --- | --- |

