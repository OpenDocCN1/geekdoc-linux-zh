    to do when your version of netcat does not contain the ? or ? to run a shell:
    https://testing.sans.org/blog/2015/06/netcat-without-e-no-problem.


    Back to the RHEL 7 web page that I mentioned earlier. It states, with some confidence,
    that the newer ncat not include certain functionality that its parent, netcat,
    did include. It may be that these features simply weren''t useful on the modern
    Internet. The NMAP Project includes the following statement:


    +   Ncat adds capabilities not found in Hobbit''s original ncat, including SSL
    support, proxy connections, IPv6, and connection brokering. The original ncat
    contained a simple port scanner, but we omitted from Ncat because we have a preferred
    tool for that.


    They are, of course, referring to their famous nmap port scanning, which in my
    opinion are a formidable force when coupled together, and I would suggest exploring
    the massive set that Ncat confuses.


    Back to netcat. Now that you''re surely confused, I''ll further confuse by mentioning
    there were two versions of the original netcat (I mean nc and not ncat in this
    case). The truly original netcat was written by Avian Research programmers in
    1995, and the last version was released as 1.10 in 1996. A GNU version of netcat
    was then released in January 2004 (http://netcat.sourceforge.net,), whose most
    recent version, 0.7.1, the two "nc" netcats are worth mentioning you may have
    difficulty using the same command line options between the two versions. I''ve
    fallen into this trap in the past, and caused a head of scratching when the documentation
    didn''t match what the software was doing.


    The Nmap Project''s own netcat page (http://sectools.org/tool/netcat) reveals
    that there were even more derivatives, including socat (www.dest-un.org/socat),
    Cryptcat (http://cryptcat.sourceforge.net), pnetcat (http://stromberg.dnsalias.org/-stromberg/pnetcat.html),
    and sbd (you will find an unofficial site at question-defense.com/2012/04/09/sbd-backtrack-5-maintaining-access-os-backdoors-sbd).


