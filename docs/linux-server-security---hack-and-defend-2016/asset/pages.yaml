- pgno: 124
  md: '# Chapter 10: SQL Injection Attacks


    To protect the variable used in the first SQL example, you might want to run your
    user input through the `stripslashes` function. The example looked like this:


    ```

    $input = $variable[3];

    ```


    With slashes being used, it might look something like this:


    ```

    $input = stripslashes($variable[3]);

    ```


    As you guess, this means you are removing slashes to help protect against unwelcome
    input. There''s also `trim` for removing white space from a variable, which can
    be used in the same way, as with `strip_tags` for HTML and other markup tags.
    These can all be useful and chained together for example, like this:


    ```

    $input = stripslashes(trim($input));

    ```


    In addition to PHP version 5.5.0, you could use the `mysql_real_escape_string`
    function to clean your input strings as:


    ```

    $input = mysql_real_escape_string($input);

    ```


    However, as of 7.0.0 and up, you almost always want to use an improved driver
    mysqli (which stands for MySQL improved) to counter SQLi. Thanks to this enhancement,
    you can employ a more advanced way to strip unnecessary and potentially dangerous
    characters out of the code being executed. An example using mysqli doesn''t look
    all that different from the previous example:


    ```

    $input = mysqli_real_escape_string($input);

    ```


    Using mysqli, you connect to your database using a different method, as follows:


    ```

    $mysqli = new mysqli("localhost", "userid", "password", "DB_Name");

    ```


    Another approach to mitigating SQL attacks is when you use prepared statements.
    The idea behind this security addition is for the database engine to process SQL
    completely separately from any parameters being used. In this theory, an attacker
    cannot inject code into the query they are all making. An example might look like
    this:


    ```

    $input = $mysqli->prepare("INSERT INTO table_name (column_name) VALUES (?)");

    $input->bind_param("s", $actual_user_input);

    $input->execute();

    $input->close();

    ```


    This newer, preferred approach filters out your parameters using the new library.
    Note the question mark where the variable''s value would usually have gone previously.
    The line containing execute pulls together all of the previous parameters. Of
    additional help is that such a function only needs to be read once, so if it''s
    a number of times on a few pages, then the PHP engine does less work.


    116'
