- pgno: 110
  md: '# Chapter 9: Password Cracking with Hashcat


    Also, think for a second why you don''t encrypt passwords on a Linux server and
    decrypt the system''s password file when user logs in. The answer is simply because
    the process of encrypting data can be reversed, a one-way function is better than
    encrypting a password. Some people are surprised to read that the /etc/shadow
    file doesn''t remember a user''s password at all, just a salted-hash version of
    it.


    Why does an entry in your /etc/shadow file on Linux look like this? It looks encryption
    of sort at a glance.


    ```

    chrisbinnie:$6STRYWb5$6efTm54cpV2YnC6f20b7w/

    5nv8pz5FqgtWFcw3G2pKkkGsfCtWezWhWykFgrfFGMCde4HW/

    12231:3|11:32::

    ```


    The user chrisbinnie has a much longer entry because the Shadow Suite is using
    a salt to bolster the password. After a user has entered a password on a Linux
    system, by default, a salt will be used.


    In Linux''s crypt package for example, this is a two-character string that is
    chosen from characters in a character set. They could be any of these characters
    from my English character set (a-z, A-Z, 0-9/). Having a salt, the original hash
    used to hash the user password is "perturbed" in any of 4,096 ways. The salt is
    saved to the encoded password.


    Let''s think a little more about Linux passwords for a moment. Modern Linux systems
    enhance your password security with Shadow passwords. Previously, passwords were
    stored in the file /etc/passwd, which every user on the system could read. Only
    root can read the /etc/shadow file, however, this allows other policies to be
    enforced, such as password aging.


    One common way of attacking a list of passwords is by knowing, in advance, the
    hashes for a lot of common passwords and combining them with all of the 4,096
    available salt values. This is known as a dictionary attack.


    It has been said that today, the bare minimum specification of a secure password
    system should include an up-to-date hashing algorithm, as well as the resulting
    hash being salted. Popular modern hashing algorithms include SHA256, SHA512, whirlpool,
    tiger, ripemd, and SHA3. Each has subtly different attributes.


    102'
