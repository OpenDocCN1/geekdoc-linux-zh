- pgno: 60
  md: '# Nping


    Just as the U.S. military''s DARPA (the Department of Defense''s Defense Advanced
    Research Projects Agency) contributed so greatly and helped to shape the Internet
    that you know and love today, a similar military-to-civilian transition also resulted
    in the most common network-discovery tool used on the Internet: the ping command.
    The ping command''s ancestry stems from naval vessels sending pings to detect
    other vessels or geophysical features were in the vicinity.


    As part of the network discovery functionality that the powerful tool Nmap (https://nmap.org)
    also includes access to a powerful improvement to the ping command, called Nping
    (https://nmap.org/nping/). If you have used Nmap, you''ll know that you''re in
    safe hands with any tool created by the Nmap Project in terms of reliability and
    well-considered functionality.


    Let''s look at how Nping tool can help you gain more insight into what your systems
    and networks are, digging into both remote and local connections.


    # Functionality


    On the surface, what you expect Nping''s functionality to be relatively limited.
    After all, when you fire off a ping, you send a question and then simply wait
    for an answer. Although Nping is still not a finished piece of software, it''s
    safe to say that it''s highly comprehensive and sophisticated networking tool.


    You will begin by getting used to the syntax. You''ll need to be in root, the
    superuser, to execute Nping commands, and you''ll look at TCP mode. Your first
    exercise will be to fire off TCP (you read correctly; they''re not ICMP pings)
    toward your local machine. From the standard ping, you can see the normal operation
    of ping "uses the ICMP protocol''s mandatory ECHO_REQUEST datagram to elicit an
    ICMP ECHO_RESPONSE from a host or gateway." In other words, there''s a question
    and answer involved.


    In case you''re wondering, I''ll be using my local machine for these examples
    to avoid upsetting other machines and patrolling firewall logs with suspicious
    activities. With all white hat tools, you should use them with great care.


    Not only concerned with ICMP, the impressive Nping is a well-defined extension
    of the standard ping command, which also gives you easy-to-understand results.


    If you don''t have it already, you can install Nping as follows.'
