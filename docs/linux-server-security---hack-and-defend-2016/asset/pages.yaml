    # Configuration


    To configure the file Rootkit Hunter, you can edit its long config file, which
    can be found at /etc/rkhunter.conf.


    To receive overnight reports on the integrity of your machine, you just need to
    edit two config parameters, defining one e-mail address of the recipient and the
    latter of which is adjustable if the standard mail command won''t work on your
    system by default.


    Once inside the config file, look for these lines, uncomment them, and adjust
    them to your needs:


    ```

