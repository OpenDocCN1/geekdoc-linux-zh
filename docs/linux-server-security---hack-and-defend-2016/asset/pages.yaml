- pgno: 84
  md: '# Categorizing Scripts


    Despite employing a highly sophisticated underlying engine, NSE was so thoughtfully
    designed that even a new user can understand how to operate it with relative ease.
    It’s therefore possible to deploy NSE promptly and requiring too much reading
    in advance.


    However, avoiding ahead of yourself, it''s useful to know NSE refers to the different
    scripts it uses. When you run a script through NSE, a port scan will usually be
    performed prior or during its execution in order to check the current state of
    a target machine''s network availability. There are also other similarities among
    the NSE scripts, such as DNS lookups and traceroutes.


    In Table 7.1 you can see how NSE categorizes its scripts: there are a number of
    different categories to consider.


    # TABLE 7.1 The Script Categories That Come with NSE


    | Category | Description |

    | --- | --- |

    | auth | These scripts look at authentication and circumventing them — for example,
    x11-access, ftp-anon, and oracle-enum-users. The brute category is for brute forcing
    and not authentication. |

    | broadcast | If you need to broadcast the local network, employ this bundle of
    scripts. |

    | brute | For forcing the authentication credentials of a remote host, use this
    collection of scripts. There are many available if you use different protocols.
    |

    | default | The default scripts are executed if you use the -sc or -A options.
    To use specific scripts, override the default with --script. |

    | discovery | To track and what is connected to a network, these scripts are all
    about examining, for public registries, SNMP-enabled devices, and directory services.
    |

    | dos | If you want to test a vulnerability or (carefully) run scripts that have
    the possibility of crashing them, then this is suitable for your denial-of-service
    needs. |

    | exploit | In order to try out an exploit if it succeeds, these scripts will
    do exactly that. |

    | external | Be warned that by executing these scripts, actions may be logged
    by other parties. That''s because this set of scripts might perform a third-party
    query, as a WHOIS lookup, and you would be visible to WHOIS service. |

    | fuzzer | These scripts will scan for software bugs and security holes by injecting
    randomized fields into their queries while you perform your search. They take
    much longer than other techniques to knock a server offline or find anything of
    interest. |'
