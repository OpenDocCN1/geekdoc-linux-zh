- pgno: 90
  md: '# Chapter 7: Nmap''s Prodigious NSE


    To download scripts from the Nmap website, you can click the Scripts link in the
    Categories panel at https://nmap.org/nsedoc/lib/nmap.html.


    At the time of writing, there are are over 500 eye-watering scripts to consider,
    each with information relating to their functionality.


    # Script Type


    It is worth mentioning that within the underlying infrastructure of NSE, there
    are four supported script types:


    +   - Prerule scripts - as you guess, these are run at the start and before any
    scanning begins. For example, you might want to perform reverse DNS lookups on
    a list of IP addresses before examining them.


    +   - Host scripts - during standard scanning processes (that is, after discovery,
    port scanning, version detection, and operating system detection), these scripts
    are run on the target.


    +   - Service scripts - if NSE identifies a service, it can then execute these
    scripts against it. there are more than 15 HTTP scripts to run against web servers.


    +   - Postrule scripts - these are run once NSE has finished its scanning tasks,
    and they tend to concentrate on how results are output. As I''ve said, brevity
    is important, as verbosity can cause confusion.


    The comprehensive Nmap documentation (found at https://nmap.org) makes the post
    of explaining that "[many] scripts could potentially run as either a prerule or
    postrule script. In those cases, we recommend using a prerule for consistency.


    # Regular Expressions


    The command line with NSE is familiar can also cope with regular expressions (regex).
    For example, I mentioned the 15 HTTP scripts; to trigger all of these scripts
    in one line, you might run a command against a web server such as this:


    ```

    # nmap --script "http-*"

    ```


    You can also make Boolean decisions as follows (just as you''d expect with regex):


    ```

    # nmap --script "default or safe"

    ```'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Hopefully this command is easy enough to understand. The documentation also
    presents

    this more complex example:


    ```

    # nmap --script "default or safe or intrusive) and not http-*

    ```


    Here you can see that you want to enable the default, safe, and intrusive script
    categories,

    but not those deal with web servers.


    # Graphical User Interfaces


    As an aside, you can also save the output (if it''s lengthy would you scroll rapidly

    y your console) to the usual way, as you can in this example, Unix-style:


    ```

    # nmap -sC -p0-1024 -T4 localhost > /home/chrisbinnie/output.txt

    ```


    However, the NSE way to save the output is as follows, outputting to plain text:


    ```

    # nmap -T5 localhost -o output.txt

    ```


    You can also output information to XML as follows:


    ```

    # nmap -T5 localhost -oX output.xml

    ```


    # Zenmap


    There are times, especially if you''re dealing with many target machines across
    differ-

    entworks, that you need some help with your results. Imagine being able to add
    your

    results to a database so you can search for common patterns with ease across historical

    ans.


    Step forward, Zenmap (https://nmap.org/zenmap/). The official GUI scanner for
    Nmap,

    twell-designed Zenmap is free and appropriate for users of all levels. A command

    creator is included to assist in making up complex commands and the ability to
    perform

    historical searching via a database. It''s also possible to create profiles for
    commonly run

    commands so''re not continually retyping them.


    This highly useful graphical cross-platform tool is available for Linux, BSD,
    Mac OS, and

    Windows, among other systems.


    Another feature is that you can run a diff and compare the results of two scans

    in order to more easily discover what happened between then and now.'
