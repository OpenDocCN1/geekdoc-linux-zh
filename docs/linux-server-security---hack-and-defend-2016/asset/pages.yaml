    # Bringing a Nation to Its Knees


    The threat of multiple, geographically diverse systems being aimed at a single
    system — such as a network or autonomous system, regardless of how large it may
    be — and taking it offline has long been a concern for enterprises, ISPs, and
    even entire nations. DDoS attacks may even have existed since the mid-1990s.


    It was widely reported in 2007 that the Baltic state of Estonia repeated DDoS
    attacks, coupled with street riing, almost brought the government to its knees.
    Apparently the population objected to the removal of a famous war memorial by
    the Estonian parliament. Coupled with a high level of social unrest, this was
    the tipping point. The steadily increasing levels of attack traffic from the DDoS
    were received in a sustained manner over a prolonged period of time. News agencies
    were frustrated by the lack of connectivity, as this meant that the rest of the
    world could not be kept up-to-date with events as they unfolded within the country.


    The Estonian DDoS evolved, and at one point reportedly four million packets per
    second of attack traffic. This was partly aimed at, and according to some reports
    it was ultimately successful in, taking the nation’s largest bank off the Internet.
    According to national statistics, around 97 percent of the population banked online,
    which meant this was a critical failure in the country’s banking systems. And
    if the impact wasn’t damaging enough already, the lack of Internet connectivity
    meant that the main bank couldn’t communicate with, or disperse cash from, automated
    teller machines (ATMs).


