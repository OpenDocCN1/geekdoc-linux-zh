- pgno: 48
  md: '# Chapter 3: Twenty-First-Century Netcat


    Another handy tip is that you can also add up to three instances of the letter
    v, with -vvv offering the most verbosity when your commands output results.


    In the same that you used netcat to speak SMTP commands earlier, the powerful
    netcat is also capable of speaking Telnet commands. As a result, if you find yourself
    without access to a Telnet client, then netcat can also help out. There are a
    few obvious benefits of using netcat instead of Telnet. For a start, netcat is
    quieter and won''t output data unless it is sent by the machine that you''ve connected.
    There are also a few reserved characters, which mean that certain binary data
    will break if you''re using Telnet. Also, you may have noticed that Telnet quits
    on quiet (idle) connections and stops running, which could mean that you won''t
    receive the entire session''s data. The Telnet command also doesn''t work well
    with UDP but, as you know, netcat certainly does.


    # Summary


    I have only covered a tiny fraction of netcat''s potential in this chapter; there''s
    simply too broad a scope to cover.


    Hopefully you understand that it''s critically important to know about some of
    this sophisticated tool''s features, if for other reason than to reveal more about
    how an attacker might deploy against you.


    The next time I need to move files around inside a LAN, I''ll be too easy to rely
    on more cumbersome data transfer tools such as SFTP tools for such simple tasks.
    You should avoid using the Telnet command for debugging open ports and connections
