    HOST: ubuntu

    SCAN ID: 151212-1648.17013

    STARTED: Dec 12 2013 16:48:59 +0000

    COMPLETED: Dec 12 2013 16:49:00 +0000

    ELAPSED: 1s (find: 6m)


    PATH:

    /home/*/public_html

    RANGE: 7 days

    TOTAL FILES: 3

    TOTAL HITS: 0

    CLEANED: 0

    ============================

    Linux Malware Detection v1.5 < proj@fxn.com >

    ```


    To query specific reports, you need a SCANID. This is a unique reference that
    can be seen near the top of Figure 8.4, where this command runs to give you a
    report on the last LMD command that was run:


    ```

    # maldet --report

    ```'
