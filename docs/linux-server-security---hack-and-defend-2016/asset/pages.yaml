    # Exploiting SQL Flaws


    Now you''ve looked at a few ways to secure against SQLi, you will learn how a
    hacker might attack your online service. There are a number of tools available,
    I''ll focus on sqlmap (http://sqlmap.org), which is a popular, open-source tool
    among hackers, forensic scientists and penetration testers. It''s possible to
    wreak chaos with this highly sophisticated tool, so make sure you are fully aware
    of the damage you can do when testing it on your own servers, never mind servers
    that belong to others. I would definitely recommend using a development server
    or sandbox virtual machine to be safe.


    The widespread capability of sqlmap is enough to give most little dissidents cause
    for concern. According to its website, sqlmap supports the following database
    servers: MySQL, Oracle, PostgreSQL, SQL Server, Microsoft Access, IBM DB2, Firebird,
    Sybase, SAP DBD, and HQDB.


    Let''s look at how you install sqlmap. It''s bundled with some security-based
    distributions like Kali Linux, but if it''s not in your package manager''s repositories,
    there are alternative ways to install.


    You can use GitHub''s sqlmap repository using the Git command:


    ```

    $ git clone https://github.com/sqlmapproject/sqlmap.git sqlmap-dev

    ```


    There''s also a Zip file available from https://github.com/sqlmapproject/sqlmap/zipball/master.


