- pgno: 123
  md: '# Chapter 10: SQL Injection Attacks


    A moment ago I referred to a programming language. I''ll use what is reported
    by the world''s most popular server-side scripting language, PHP, as an example
    to quickly demonstrate how SQL works. As well as being used directly on millions
    of websites, the powerful PHP is used in the world''s most popular Content Management
    System (CMS), WordPress (https://wordpress.com), and many other dynamic website
    applications like Joomla!(https://www.jooomla.org). In short, PHP is all over
    the web and is an easy target for attackers if it is discovered.


    Let''s look at another example, this that in PHP:


    ```

    $input = $variable[3];

    $query = "SELECT id, item, price FROM specialoffers ORDER BY id

    LIMIT 15 OFFSET "input";

    ```


    Looking at the top line, you can see that you are not filtering the variable called
    $input. This means that the variable is used on one line within the SQL statement,
    it could potentially include any code that an attacker wanted to use. With crafted
    being injected, all sorts of havoc can be caused.


    Another example would be updating the sysop''s password. For example, a normal
    SQL statement PHP code might look like this:


    ```

    $query = "UPDATE credentials SET passwd=''$password'' WHERE

    userid=''$id'';";

    ```


    By appending SQL to this statement, such as or user like ''%sysop%'', your SQL
    becomes much less strict and you ask the database to search for other privileged
    usernames similar to sysop, as that sysops, and then update their passwords too.


    Worringly, it''s also possible to execute shell commands that can be included
    within SQL. Certain database servers allow access to operating system commands
    using this method.


    # Mitigating SQLi in PHP


    As I said, this subject area is too large to cover in detail, but I will be remiss
    not to briefly look how to filter SQL inputs to mitigate SQLi attacks. There are
    a variety of PHP functions that assist you in this endeavor. As of this writing,
    PHP is making a significant move to version 7.0.0 from its current version, 5.6.16
    (although it will likely be incremented).


    One caveat be that in older versions (up to 5.3), your main PHP config file (php.ini)
    was possible to filter (or escape) all input data via PHP using magic quotes_gpc.
    This was apparently deprecated because it was relied upon too much and didn''t
    always escape characters in the way meant applications were secure. In essence,
    magic quotes weren''t designed to be used for security purposes but were employed
    as such.


