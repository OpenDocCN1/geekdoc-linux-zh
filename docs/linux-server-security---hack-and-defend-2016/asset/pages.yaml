- pgno: 118
  md: '# Chapter 9: Password Cracking with Hashcat


    configuration settings are correct, that you will be handed the password at some
    point, even if it takes a hundred years for it to happen.


    Within its detailed online documentation, Hashcat talks about brute force attacks
    being an older, more sophisticated route to discovering passwords. Hashcat now
    includes the brute force style of attack (you may have noticed it in Table 9.2)
    within its mask attack.


    The main premise with a mask attack is to reduce the size of the keyspace and
    therefore speed up the run. One example that the documentation offers is with
    Hashcat''s innovative technique, you can reduce the recovery time of the password
    "Julia1984" from approximately four years to a staggering minutes.


    The documentation states that there are no disadvantages to running a mask attack
    over a brute force attack, which is promising. You run a mask attack by appending
    a mask to the end of your standard command, as:


    ```

    # hashcat -m 1800 -a 0 -o discovered_passwords.txt --remove hashes.

    wordlist.txt -1 ?abcdef

    ```


    The appended -1 ?abcdef in this case asks Hashcat to run through characters 0123456789abcdef


    According to the documentation, this mask, -1 ?l?d?u offers a full 7-bit ASCII
    character set also, as mixalpha-numeric-all-set. There are options such as ?l
    (which stands for lowercase characters from a to z), and ?u (which stands for
    all uppercase characters from A to Z).


    You can find more details on mask attacks at https://hashcat.net/wiki/doku.php?id=mask_attack.


    # oclHashcat


    Using oclHashcat and Hashcat requires very similar levels of knowledge, as they
    operate in almost the same. Although they have some differences — for example,
    the way oclHashcat loads up its dictionaries compared to Hashcat — you can expect
    a shallow learning curve if you move over using oclHashcat.


    In addition, the necessary password-cracking computations are an entirely different
    component of your system, as I have already mentioned. Simply put, oclHashcat
    works with video cards as opposed to CPUs. There are two software versions to
    distinguish between, and each suits popular GPUs:


    +   - cudaHashcat, which is for use on Nvidia video cards

    - oclHashcat, which works with AMD video cards'
